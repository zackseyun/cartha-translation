base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/007.yaml
  text: 'On the twenty-fourth day of the eleventh month (that is[a], the month Shebat), in the second year of Darius, the word of Yahweh came to Zechariah son of Berechiah, son of Iddo the prophet[b], saying:'
translation:
  language: hi
  text: 'दारयवेश के दूसरे वर्ष में, ग्यारहवें महीने, अर्थात शबात महीने[a], के चौबीसवें दिन याहवे का वचन इद्दो नबी के पुत्र बेरेक्याह के पुत्र जकर्याह के पास पहुँचा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी महीने का नाम ‘शबात’ है; इसे ‘शवात’ भी लिखा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם עֶשְׂרִים וְאַרְבָּעָה
  choice: चौबीसवें दिन
  rationale: इब्रानी तिथि-सूत्र का आधुनिक और स्वाभाविक हिन्दी रूप; क्रमवाचक अर्थ स्पष्ट रखा गया है।
- source_word: לְעַשְׁתֵּי עָשָׂר חֹדֶשׁ
  choice: ग्यारहवें महीने के
  rationale: महीने की क्रम-संख्या को हिन्दी कैलेंडरी प्रयोग के अनुसार व्यक्त करता है।
- source_word: הוּא חֹדֶשׁ שְׁבָט
  choice: अर्थात शबात महीने में
  rationale: הוּא यहाँ ग्यारहवें महीने का नाम स्पष्ट करता है; ‘अर्थात’ उसके व्याख्यात्मक संबंध को स्वाभाविक ढंग से दिखाता है।
- source_word: שְׁבָט
  choice: शबात
  rationale: इब्रानी महीने के नाम का निकट देवनागरी लिप्यंतरण; वैकल्पिक उच्चारण ‘शवात’ पादटिप्पणी में दिया गया है।
- source_word: בִּשְׁנַת שְׁתַּיִם לְדָרְיָוֶשׁ
  choice: दारयवेश के शासन के दूसरे वर्ष
  rationale: राजकीय वर्ष-सूत्र का अर्थ स्पष्ट करने के लिए ‘शासन’ जोड़ा गया है; यह मूल में निहित संबंध को व्यक्त करता है।
- source_word: הָיָה דְבַר יְהוָה אֶל
  choice: याहवे का वचन ... के पास पहुँचा
  rationale: भविष्यद्वाणी के प्रचलित इब्रानी प्रकाशन-सूत्र को सहज हिन्दी में व्यक्त करता है; केवल अस्तित्व बताने के बजाय वचन के प्राप्त होने का भाव रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: זְכַרְיָה בֶּן בֶּרֶכְיָהוּ בֶּן עִדּוֹא
  choice: बेरेक्याह के पुत्र, इद्दो के वंशज, जकर्याह
  rationale: पहले בֶּן को ‘पुत्र’ और अधिक दूर की वंशावली कड़ी को ‘वंशज’ कहना स्वाभाविक हिन्दी है तथा जकर्याह 1:1 की वंशावली पहचान को अनावश्यक रूप से ‘पोता’ तक सीमित नहीं करता।
- source_word: לֵאמֹר
  choice: अंत का द्विबिंदु
  rationale: ‘यह कहते हुए’ का भाव अगले कथन की भूमिका के रूप में हिन्दी में द्विबिंदु से स्वाभाविक रूप से प्रकट होता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में उपाधि नहीं, परमेश्वर का व्यक्तिगत नाम है; ‘याहवे’ उसे प्रत्यक्ष रूप से लिप्यंतरित करता है।
- issue: הַנָּבִיא (‘नबी’) का संबंध किससे है
  choice: मुख्य पाठ में जकर्याह के साथ
  alternative: इद्दो के साथ
  rationale: निकटतम शब्दक्रम इसे इद्दो से जोड़ने की अनुमति देता है, पर पुस्तक के परिचय और सामान्य पहचान-सूत्र में जकर्याह को नबी समझना भी स्वाभाविक है। मूल की वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। तिथि-सूत्र को स्वाभाविक क्रम में रखा गया है, नामों का स्रोत-सन्निकट देवनागरी लिप्यंतरण किया गया है, और वंशावली तथा ‘नबी’ की संबद्धता में मौजूद अस्पष्टता को पादटिप्पणी द्वारा सुरक्षित रखा गया है।
