id: ZEC.1.11
reference: Zechariah 1:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יַּעֲנ֞וּ אֶת מַלְאַ֣ךְ יְהוָ֗ה הָֽ/עֹמֵד֙ בֵּ֣ין הַ/הֲדַסִּ֔ים וַ/יֹּאמְר֖וּ הִתְהַלַּ֣כְנוּ בָ/אָ֑רֶץ וְ/הִנֵּ֥ה כָל הָ/אָ֖רֶץ יֹשֶׁ֥בֶת וְ/שֹׁקָֽטֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/011.yaml
  text: And they answered the angel of Yahweh who was standing among the myrtle trees and said[a], “We have gone throughout the earth, and behold[b], all the earth is at rest and quiet.”
translation:
  language: hi
  text: उन्होंने मर्टल वृक्षों के बीच खड़े याहवे के दूत को उत्तर दिया और कहा, “हम पृथ्वी भर में घूम आए हैं[a]; और देखो, सारी पृथ्वी[b] स्थिर और शांत है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “हम पृथ्वी पर इधर-उधर घूमे हैं” या “हमने पृथ्वी पर गश्त की है” भी हो सकता है।
    reason: הִתְהַלַּכְנוּ में व्यापक रूप से घूमने का भाव है; प्रसंग में गश्त का अर्थ संभव है, पर क्रिया स्वयं उद्देश्य को स्पष्ट नहीं करती।
  - marker: b
    text: या “सारा देश।”
    reason: אֶרֶץ का अर्थ प्रसंग के अनुसार ‘पृथ्वी’, ‘भूमि’ या ‘देश’ हो सकता है।
lexical_decisions:
- source_word: וַיַּעֲנוּ ... וַיֹּאמְרוּ
  choice: उत्तर देते हुए कहा
  rationale: दोनों क्रियाओं—‘उत्तर दिया’ और ‘कहा’—का भाव रखा गया है, लेकिन हिन्दी में अनावश्यक बोझिल पुनरुक्ति से बचने के लिए स्वाभाविक संयुक्त रचना अपनाई गई है।
- source_word: מַלְאַךְ יְהוָה
  choice: याहवे का दूत
  rationale: ‘दूत’ מַלְאָךְ के ‘संदेशवाहक/स्वर्गीय दूत’ दोनों संभावित अर्थों को खुला रखता है; प्रसंग स्वयं उसकी पहचान स्पष्ट करे, इसलिए ‘स्वर्गदूत’ जोड़कर अर्थ सीमित नहीं किया गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी के विशिष्ट ईश्वरीय नाम को पदवी से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: הָעֹמֵד
  choice: खड़े
  rationale: कृदन्त दृश्य में दूत की जारी अवस्था बताता है; ‘खड़े’ हिन्दी में इसे सहज रूप से व्यक्त करता है।
- source_word: בֵּין הַהֲדַסִּים
  choice: हदस के पेड़ों के बीच
  rationale: הֲדַסִּים विशिष्ट मर्टल वृक्ष हैं। ‘हदस’ वनस्पति की पहचान सुरक्षित रखता है; केवल ‘मेंहदी’ कहना आधुनिक वनस्पति-विज्ञान में दूसरी प्रजाति का भ्रम उत्पन्न कर सकता है।
- source_word: הִתְהַלַּכְנוּ
  choice: घूम आए हैं
  rationale: हित्पएल रूप किसी क्षेत्र में इधर-उधर या चारों ओर जाने का भाव देता है। ‘घूम आए हैं’ प्रतिवेदन के पूर्ण हुए भ्रमण को स्वाभाविक हिन्दी में रखता है, बिना ‘गश्त’ का उद्देश्य पाठ में जोड़ने के।
- source_word: בָאָרֶץ / כָל הָאָרֶץ
  choice: पृथ्वी / सारी पृथ्वी
  rationale: दर्शन के व्यापक परिप्रेक्ष्य में ‘पृथ्वी’ उपयुक्त है, यद्यपि אֶרֶץ का अर्थ ‘देश/भूमि’ भी हो सकता है; यह विकल्प पादटिप्पणी में रखा गया है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह ध्यान आकर्षित करने वाला प्रवचन-सूचक है; ‘देखो’ भविष्यद्वाणी के बल को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יֹשֶׁבֶת וְשֹׁקָטֶת
  choice: बैठी हुई और शांत है
  rationale: ‘बैठी हुई’ יֹשֶׁבֶת की ठोस छवि को बचाता है और ‘शांत’ को שֹׁקָטֶת के लिए अलग रखता है, जिससे समानांतर शब्दों का भेद मिटता नहीं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में निजी वाचा-नाम है; ‘याहवे’ उसे पदवी में बदले बिना प्रस्तुत करता है।
- issue: מַלְאַךְ की पहचान
  choice: दूत
  alternative: स्वर्गदूत / संदेशवाहक
  rationale: इब्रानी शब्द दोनों अर्थ-क्षेत्रों में प्रयुक्त हो सकता है। ‘दूत’ इस दर्शनीय प्रसंग में स्वर्गीय चरित्र के लिए स्वाभाविक है, पर उसकी पहचान को उससे अधिक निश्चित नहीं करता जितना मूल पाठ करता है।
- issue: पृथ्वी की शांति का स्वरूप
  choice: बैठी हुई और शांत
  alternative: विश्राम में और शांत / निश्चिंत और शांत
  rationale: मूल के दो कृदन्तों की अलग छवियाँ रखी गई हैं। ‘निश्चिंत’ जैसी व्याख्यात्मक भाषा जोड़कर इस शांति को नैतिक रूप से अच्छा या बुरा नहीं ठहराया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘याहवे’ निजी नाम के रूप में और ‘हदस’ वृक्ष के सटीक नाम के रूप में प्रयुक्त हैं। वाक्य-विन्यास हिन्दी-सुलभ है, पर ‘बैठी हुई और शांत’ में मूल इब्रानी की ठोस, कुछ असामान्य छवि जानबूझकर सुरक्षित रखी गई है।
