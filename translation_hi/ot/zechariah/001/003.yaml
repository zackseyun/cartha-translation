source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֗ם כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת שׁ֣וּבוּ אֵלַ֔/י נְאֻ֖ם יְהוָ֣ה צְבָא֑וֹת וְ/אָשׁ֣וּב אֲלֵי/כֶ֔ם אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/003.yaml
  text: 'Therefore say to them[a], ‘Thus says Yahweh of hosts: Return to me,’ declares Yahweh of hosts, ‘and I will return to you,’ says Yahweh of hosts.'
translation:
  language: hi
  text: 'इसलिए तुम उनसे कहो:[a] “सेनाओं के परमेश्वर याहवे यों कहते हैं: ‘मेरी ओर लौटो,’ सेनाओं के परमेश्वर याहवे की वाणी है, ‘और मैं तुम्हारी ओर लौटूँगा,’ सेनाओं के परमेश्वर याहवे कहते हैं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी ओर फिरो ... और मैं तुम्हारी ओर फिरूँगा।” इब्रानी में दोनों खंडों में एक ही क्रिया का प्रयोग हुआ है, जो पारस्परिक पुनर्स्थापना पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: इसलिए तुम उनसे कहो
  rationale: संयोजक וְ इस आज्ञा को पिछले पद में बताए गए परमेश्वर के क्रोध से जोड़ता है। ‘इसलिए’ उस प्रसंगगत परिणाम को स्वाभाविक हिन्दी में स्पष्ट करता है; ‘तुम ... कहो’ इब्रानी के एकवचन संबोधन को बनाए रखता है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह नबूवत का पारंपरिक संदेशवाहक-सूत्र है। ‘यों कहता है’ औपचारिक गरिमा और वर्तमान हिन्दी की सहजता दोनों बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: ईश्वरीय नाम के साथ प्रयुक्त इस पदवी में ‘सेनाएँ’ स्वर्गीय सेनाओं और सार्वभौम सामर्थ्य के व्यापक संकेत को बनाए रखता है।
- source_word: שׁוּבוּ אֵלַי
  choice: मेरी ओर लौटो
  rationale: שׁוב लौटने या फिरने को व्यक्त करता है और यहाँ संबंध तथा वाचा की ओर पुनः लौटने का भाव रखता है। ‘लौटो’ पश्चात्ताप की व्याख्या को अनावश्यक रूप से बढ़ाए बिना यह अर्थ देता है।
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे की यह वाणी है
  rationale: נְאֻם अधिकारपूर्ण ईश्वरीय कथन का सूत्र है। ‘यह वाणी है’ इसे स्वाभाविक हिन्दी में व्यक्त करता और अंतिम אָמַר से शब्दगत भेद बनाए रखता है।
- source_word: וְאָשׁוּב אֲלֵיכֶם
  choice: और मैं तुम्हारी ओर लौटूँगा
  rationale: दोनों खंडों में उसी שׁוב धातु के लिए ‘लौटना’ रखने से मानवीय और ईश्वरीय प्रत्युत्तर की जानबूझकर रची गई समानता सुरक्षित रहती है।
- source_word: אָמַר יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे कहता है
  rationale: अंतिम אָמַר को ‘कहता है’ देना मूल के दो अलग वचन-सूत्रों—נְאֻם और אָמַר—के बीच कुछ भेद बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का सीधे प्रयोग करता है। ‘याहवे’ उस नाम को उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: שׁוב में पश्चात्ताप और वाचा की ओर लौटने का भाव
  choice: ‘मेरी ओर लौटो ... मैं तुम्हारी ओर लौटूँगा’
  alternative: ‘मेरी ओर फिरो ... मैं तुम्हारी ओर फिरूँगा’
  rationale: मूल में मनुष्य और परमेश्वर की क्रिया के लिए एक ही धातु दोहराई गई है। दोनों जगह ‘लौटना’ रखने से पारस्परिक पुनर्स्थापना का बल बना रहता है, जबकि पाठ से अधिक स्पष्ट धर्मवैज्ञानिक व्याख्या नहीं जोड़ी जाती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। नबूवत के औपचारिक संदेश-सूत्र को बनाए रखते हुए अत्यधिक पुरातन शब्दावली से बचा गया है।
