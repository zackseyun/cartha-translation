review_pass:
  verdict: revise
  source_fidelity: 'The translation accurately reflects the conjunction''s consequential force, the singular command to the prophet, the prophetic formula, the threefold title יהוה צבאות, and the repeated Hebrew verb שוב in the reciprocal clauses. However, the opening title is grammatically inverted in Hindi: “सेनाओं का याहवे” means something like “Yahweh belonging to the armies,” whereas the Hebrew title means “Yahweh of hosts.”'
  naturalness: The wording is generally clear and appropriately formal. “सेनाओं के याहवे” is also nonstandard and potentially possessive in the wrong direction. “सेनाओं के परमेश्वर याहवे” is natural modern Hindi and conveys the genitive relation accurately. “यह वाणी है” is acceptable, though “की वाणी है” better fits the divine-name genitive construction.
  terminology: “याहवे” consistently preserves יהוה, and “लौटो” consistently renders the repeated שוב well. “सेनाओं के परमेश्वर याहवे” preserves the conventional semantic scope of יהוה צבאות without narrowing hosts to merely human armies. The alternative footnote preserves the repeated verb with “फिरो/फिरूँगा.”
  issues:
  - severity: medium
    issue: The divine title is inverted in the main text.
    rationale: “सेनाओं का याहवे” and “सेनाओं के याहवे” grammatically make Yahweh possessive to the armies rather than identifying him as the God/Lord of hosts. This should be corrected in all three occurrences.
  - severity: low
    issue: The middle speech formula is slightly awkward in Hindi.
    rationale: “सेनाओं के परमेश्वर याहवे की वाणी है” is more idiomatic and syntactically complete than “सेनाओं के याहवे की यह वाणी है,” while retaining the distinction between נאם and the final אמר.
