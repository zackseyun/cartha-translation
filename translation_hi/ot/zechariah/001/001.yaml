source:
  edition: WLC
  text: בַּ/חֹ֨דֶשׁ֙ הַ/שְּׁמִינִ֔י בִּ/שְׁנַ֥ת שְׁתַּ֖יִם לְ/דָרְיָ֑וֶשׁ הָיָ֣ה דְבַר יְהוָ֗ה אֶל זְכַרְיָה֙ בֶּן בֶּ֣רֶכְיָ֔ה בֶּן עִדּ֥וֹ הַ/נָּבִ֖יא לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/001.yaml
  text: In the eighth month[a], in the second year of Darius, the word of Yahweh came to Zechariah son of Berechiah, son of Iddo the prophet, saying,
translation:
  language: hi
  text: 'आठवें महीने में, दारियावेश के दूसरे वर्ष में, याहवे[a] का वचन बेरेक्याह के पुत्र, इद्दो के पुत्र जकर्याह भविष्यद्वक्ता के पास यह कहते हुए आया:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में YHWH, परमेश्वर का व्यक्तिगत नाम।
    reason: दिव्य नाम के हिन्दी रूप को स्पष्ट करना।
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁמִינִי
  choice: आठवें महीने में
  rationale: इब्रानी काल-सूचक पदबंध का स्वाभाविक और औपचारिक हिन्दी रूप।
- source_word: בִּשְׁנַת שְׁתַּיִם לְדָרְיָוֶשׁ
  choice: दारयावेश के दूसरे वर्ष में
  rationale: यह राजकीय शासन-वर्ष बताने वाला मानक पदबंध है; नाम का रूप इब्रानी उच्चारण के निकट रखा गया है।
- source_word: הָיָה דְבַר יְהוָה אֶל
  choice: यहोवा का वचन ... के पास आया
  rationale: भविष्यवाणी की भूमिका में היה + דבר יהוה प्रकाशन के आने को सूचित करता है; हिन्दी में यह स्वाभाविक भविष्यद्वक्ताई शैली है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम YHWH को हिन्दी में प्रचलित नामरूप से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: זְכַרְיָה
  choice: जकर्याह
  rationale: इब्रानी नाम का स्पष्ट और हिन्दी में पठनीय लिप्यंतरण।
- source_word: בֶּן בֶּרֶכְיָה בֶּן עִדּוֹ
  choice: इद्दो के पोते और बेरेक्याह के पुत्र
  rationale: वंश-श्रृंखला का अर्थ स्वाभाविक हिन्दी में स्पष्ट किया गया है; दूसरा בן यहाँ पूर्वज-संबंध दर्शाता है।
- source_word: הַנָּבִיא
  choice: भविष्यद्वक्ता
  rationale: निश्चित संज्ञा को उसके सामान्य हिन्दी बाइबलीय समतुल्य से प्रस्तुत किया गया है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह पद अगले वचन में आने वाली प्रत्यक्ष वाणी का परिचय देता है; हिन्दी में द्विबिंदु इस अधूरे भाषण-सूत्र को सहज रूप से दर्शाता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी पाठकों में स्थापित 'यहोवा' रूप रखा गया है और वैकल्पिक संभावित उच्चारण पादटिप्पणी में दिया गया है।
- issue: הַנָּבִיא किसके लिए प्रयुक्त है
  choice: जकर्याह को 'भविष्यद्वक्ता' बताने वाली स्वाभाविक हिन्दी रचना
  alternative: इद्दो को 'भविष्यद्वक्ता' मानना
  rationale: इब्रानी पदक्रम व्याकरणतः अस्पष्ट हो सकता है, पर पुस्तक का व्यापक संदर्भ जकर्याह की भविष्यद्वक्ताई भूमिका का समर्थन करता है; अस्पष्टता को अनावश्यक सिद्धांतगत निष्कर्ष में नहीं बदला गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। तिथि-विधान की औपचारिकता बनाए रखते हुए वंशावली को हिन्दी में स्पष्ट किया गया है; अगले पद में आरम्भ होने वाली वाणी के लिए द्विबिंदु रखा गया है।
