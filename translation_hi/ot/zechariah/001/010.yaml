  text: Then the man who was standing among the myrtle trees answered and said[b][a], “These are the ones whom Yahweh has sent to walk throughout the earth.”
translation:
  language: hi
  text: तब मर्टल वृक्षों के बीच खड़े उस आदमी ने उत्तर देकर कहा, “ये वे हैं जिन्हें याहवे ने पृथ्वी[a] पर घूमने-फिरने[b] के लिए भेजा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “देश में” अथवा “भूमि में।” यहाँ प्रयुक्त हिब्रू शब्द का अर्थ पूरी पृथ्वी या कोई सीमित भूभाग हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “गश्त करने” अथवा “इधर-उधर घूमने-फिरने।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: उत्तर देकर कहा
  rationale: यह हिब्रू के दोनों कथन-परिचायक क्रियापदों को बनाए रखता है और हिन्दी में स्वाभाविक भी है।
- source_word: הָאִישׁ הָעֹמֵד
  choice: खड़े उस पुरुष
  rationale: पुल्लिंग एकवचन और कृदन्त से व्यक्त उसकी वर्तमान स्थिति—दोनों सुरक्षित रहते हैं।
- source_word: בֵּין הַהַדַסִּים
  choice: मेंहदी के पेड़ों के बीच
  rationale: הֲדַסִּים मर्टल वृक्षों को दर्शाता है; प्रचलित बाइबलीय हिन्दी में ‘मेंहदी के पेड़’ सामान्य पाठक के लिए अधिक सुबोध है।
- source_word: אֵלֶּה אֲשֶׁר
  choice: ये वे हैं जिन्हें
  rationale: संकेतवाचक शब्द और व्यक्तियों की ओर संकेत करने वाला सम्बन्धवाचक वाक्यांश स्वाभाविक हिन्दी में स्पष्ट किए गए हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के निज नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: לְהִתְהַלֵּךְ
  choice: घूमने
  rationale: हित्पएल रूप इधर-उधर या चारों ओर चलते रहने का भाव देता है; ‘घूमने’ मूल गति-बिम्ब रखता है और अनिवार्य रूप से सैनिक गश्त का अर्थ नहीं जोड़ता।
- source_word: בָּאָרֶץ
  choice: पृथ्वी पर
  rationale: אֶרֶץ का अर्थ ‘पृथ्वी’ या ‘देश/भूमि’ हो सकता है। दर्शन के व्यापक सन्दर्भ में ‘पृथ्वी’ मुख्य पाठ के लिए उपयुक्त है, जबकि स्थानीय अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निज नाम स्पष्ट रूप से आया है। ‘याहवे’ उसका सीधा हिन्दी लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: दूतों की गतिविधि का स्वरूप
  choice: घूमने
  alternative: गश्त लगाने
  rationale: सन्दर्भ में निरीक्षण या गश्त का भाव सम्भव है, पर לְהִתְהַלֵּךְ स्वयं चलने-फिरने का व्यापक भाव रखता है; इसलिए अधिक विशिष्ट सैनिक अर्थ मुख्य पाठ में नहीं थोपा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘उत्तर देकर कहा’ हिब्रू की दोहरी अभिव्यक्ति को बिना अत्यधिक बोझिल हुए सुरक्षित रखता है; ‘याहवे’ निज नाम का देवनागरी लिप्यंतरण है।
