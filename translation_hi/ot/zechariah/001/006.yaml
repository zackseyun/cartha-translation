base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/006.yaml
  text: But did not my words and my statutes[a], which I commanded my servants the prophets, overtake your fathers? Then they turned back and said, ‘As Yahweh of Armies planned to do to us, according to our ways and according to our deeds[c][b], so he has dealt with us.’
translation:
  language: hi
  text: परन्तु मेरे वचन और मेरी विधियाँ, जिनके विषय में मैंने अपने सेवकों—नबियों—को आज्ञा दी थी[a], क्या वे तुम्हारे पूर्वजों को आकर नहीं पकड़ लिया? तब वे लौटे[b] और कहने लगे, “सेनाओं का याहवे[c] हमारे आचरण और हमारे कर्मों के अनुसार हमारे साथ जैसा करने का निश्चय किया था, उसने हमारे साथ वैसा ही किया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिनकी आज्ञा मैंने अपने सेवकों—नबियों—के द्वारा दी थी।”
    reason: हिब्रू में नबी सीधे आज्ञा पाने वाले हैं, जबकि प्रसंग यह भी सूचित करता है कि उन्हीं के द्वारा ये वचन लोगों तक पहुँचाए गए।
  - marker: b
    text: या, “तब उन्होंने पश्चात्ताप किया।” हिब्रू क्रिया का अर्थ ‘लौटना’ और प्रसंगानुसार ‘पश्चात्ताप करना’ दोनों हो सकता है।
    reason: मूल की अर्थगत और धर्मवैचारिक अस्पष्टता सुरक्षित रखने के लिए।
  - marker: c
    text: 'पारंपरिक रूप: “सेनाओं का यहोवा” या “सेनाओं का प्रभु।”'
    reason: दिव्य नाम और उपाधि के परिचित वैकल्पिक निरूपण बताने के लिए।
lexical_decisions:
- source_word: אַךְ
  choice: परन्तु
  rationale: यह पिछले पद के इस कथन के साथ विरोध दिखाता है कि पुरखे और नबी सदा जीवित नहीं रहते; ‘परन्तु’ उस विरोध को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: דְּבָרַי וְחֻקַּי
  choice: मेरे वचन और मेरी विधियाँ
  rationale: ‘वचन’ परमेश्वर की कही हुई बातों को और ‘विधियाँ’ उसके निर्धारित नियमों या आदेशों को व्यक्त करती हैं; दोनों अलग स्रोत-शब्दों का भेद बनाए रखा गया है।
- source_word: צִוִּיתִי אֶת־עֲבָדַי הַנְּבִיאִים
  choice: मैंने अपने सेवकों—नबियों—को आज्ञा दी थी
  rationale: हिब्रू वाक्यरचना में नबी आज्ञा पाने वाले प्रत्यक्ष कर्म हैं। ‘के द्वारा’ प्रसंगानुकूल अर्थ हो सकता है, पर वह वाक्यरचना की व्याख्या है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: הִשִּׂיגוּ
  choice: जा नहीं पकड़ा
  rationale: क्रिया में पीछा करके किसी तक पहुँचने या उसे पकड़ लेने का बिंब है। हिन्दी में यह पदबंध परमेश्वर के वचनों और विधियों के पुरखों पर अंततः लागू हो जाने का सजीव रूपक बनाए रखता है।
- source_word: וַיָּשׁוּבוּ
  choice: तब वे लौटे
  rationale: שׁוב का मूल अर्थ लौटना है और प्रसंग में यह पश्चात्ताप का संकेत भी दे सकता है। मुख्य पाठ मूल बिंब को रखता है और स्पष्ट ‘पश्चात्ताप किया’ को विकल्प के रूप में पादटिप्पणी में देता है।
- source_word: זָמַם
  choice: करने की ठानी थी
  rationale: यह सोचे-समझे उद्देश्य या निश्चय को दर्शाता है। ‘ठानी थी’ आधुनिक हिन्दी में स्पष्ट है और निश्चय के भाव को बनाए रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: याहवे नाम को लिप्यंतरित किया गया है और צְבָאוֹת का अर्थ ‘सेनाएँ’ स्पष्ट रूप से दिया गया है, जिससे उपाधि का सामर्थ्यपूर्ण भाव बना रहता है।
- source_word: כִּדְרָכֵינוּ וּכְמַעֲלָלֵינוּ
  choice: हमारे चालचलन के अनुसार और हमारे कामों के अनुसार
  rationale: ‘चालचलन’ नैतिक जीवन-पद्धति को और ‘काम’ किए गए कर्मों को व्यक्त करता है। ‘के अनुसार’ की पुनरावृत्ति मूल पाठ के समानांतर बल को सुरक्षित रखती है।
theological_decisions:
- issue: क्या וַיָּשׁוּבוּ को स्पष्ट पश्चात्ताप के रूप में अनूदित किया जाए
  choice: तब वे लौटे
  alternative: तब उन्होंने पश्चात्ताप किया
  rationale: क्रिया लौटने और पश्चात्ताप करने—दोनों अर्थ दे सकती है। प्रसंग में वे परमेश्वर के न्याय को स्वीकार करते हैं, पर उनके भीतरी पश्चात्ताप की पूर्णता स्पष्ट नहीं की गई; इसलिए अस्पष्टता मुख्य पाठ और पादटिप्पणी के द्वारा सुरक्षित रखी गई है।
- issue: יְהוָה के दिव्य नाम का निरूपण
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत दिव्य नाम है। ‘याहवे’ उसे नाम के रूप में प्रत्यक्ष रखता है; प्रचलित पारंपरिक रूपों की सूचना पादटिप्पणी में दी गई है।
- issue: परमेश्वर के वचनों का पुरखों को ‘पकड़ना’
  choice: रूपक को बनाए रखा गया
  alternative: वे तुम्हारे पुरखों पर पूरे नहीं हुए?
  rationale: मूल क्रिया पीछा करके पकड़ लेने का प्रभावशाली रूपक प्रस्तुत करती है। इसे केवल भविष्यवाणी की पूर्ति कह देना अर्थ को स्पष्ट करता, पर मूल की न्याय-संबंधी तीव्रता घटा देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पुरखे’, ‘चालचलन’ और ‘ठानी थी’ सामान्य पाठक के लिए बोधगम्य हैं, जबकि ‘जा नहीं पकड़ा’ मूल के पीछा करके पकड़ने वाले रूपक को स्वाभाविक हिन्दी में सुरक्षित रखता है। उद्धरण और प्रश्न की संरचना मूल पाठ के तर्क और जोर के निकट है।
