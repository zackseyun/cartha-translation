source:
  edition: WLC
  text: רָאִ֣יתִי הַ/לַּ֗יְלָה וְ/הִנֵּה אִישׁ֙ רֹכֵב֙ עַל ס֣וּס אָדֹ֔ם וְ/ה֣וּא עֹמֵ֔ד בֵּ֥ין הַ/הֲדַסִּ֖ים אֲשֶׁ֣ר בַּ/מְּצֻלָ֑ה וְ/אַחֲרָי/ו֙ סוּסִ֣ים אֲדֻמִּ֔ים שְׂרֻקִּ֖ים וּ/לְבָנִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/008.yaml
  text: I saw in the night[a], and behold, a man riding on a red horse! He was standing among the myrtle trees that were in the ravine, and behind him were red, sorrel[b], and white horses.
translation:
  language: hi
  text: मैंने रात में देखा—और देखो, एक पुरुष लाल घोड़े पर सवार था। वह निचले स्थान में उगे मर्टल के पेड़ों के बीच खड़ा था[a], और उसके पीछे लाल, सुरख़-भूरे[b] और सफ़ेद घोड़े थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गहरे स्थान में,’ ‘धँसे हुए स्थान में,’ अथवा ‘खड्ड में।’ इब्रानी शब्द किसी गहरे या निचले स्थान को सूचित करता है; उसका ठीक स्थलाकृतिक अर्थ अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: या ‘चितकबरे’ अथवा ‘धब्बेदार’; इब्रानी रंग-सूचक शब्द का ठीक अर्थ अनिश्चित है और संभवतः किसी लाल-भूरे अश्व-वर्ण को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי הַלַּיְלָה
  choice: मैंने रात में देखा
  rationale: רָאִיתִי का सामान्य अर्थ ‘मैंने देखा’ है; दर्शन का भाव प्रसंग से आता है, इसलिए क्रिया में अतिरिक्त व्याख्या नहीं जोड़ी गई। הַלַּיְלָה यहाँ रात के समय को सूचित करता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह दृश्य की ओर अचानक ध्यान खींचने वाला कथन-सूचक है। ‘और देखो’ आधुनिक हिन्दी में उसकी जीवंतता बनाए रखता है।
- source_word: אִישׁ רֹכֵב עַל סוּס אָדֹם
  choice: एक पुरुष लाल घोड़े पर सवार था
  rationale: אִישׁ को उसके सामान्य पुल्लिंग अर्थ ‘पुरुष’ में रखा गया है और רֹכֵב עַל को स्वाभाविक हिन्दी ‘पर सवार’ से व्यक्त किया गया है।
- source_word: בֵּין הַהֲדַסִּים
  choice: मेंहदी के पेड़ों के बीच
  rationale: הֲדַסִּים मर्टल जाति के वृक्षों/झाड़ियों के लिए है; हिन्दी बाइबलीय प्रयोग में ‘मेंहदी के पेड़’ समझने योग्य प्रचलित पद है। בֵּין को पेड़ों के समूह के संदर्भ में ‘के बीच’ रखा गया है।
- source_word: בַּמְּצֻלָה
  choice: घाटी की गहराई में
  rationale: शब्द किसी गहरे, धँसे या निचले स्थान का बोध करा सकता है। दृश्य के स्थलाकृतिक संदर्भ में यह अनुवाद स्वाभाविक है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: וְאַחֲרָיו
  choice: और उसके पीछे
  rationale: 'दृश्य में स्थान-संबंधी अर्थ सबसे उपयुक्त है: अन्य घोड़े मुख्य सवार के पीछे स्थित हैं।'
- source_word: שְׂרֻקִּים
  choice: सुरख़-भूरे
  rationale: इस दुर्लभ रंग-सूचक शब्द का सटीक अर्थ अनिश्चित है। ‘सुरख़-भूरे’ एक संभावित अश्व-वर्ण को व्यक्त करता है; अन्य प्रमुख संभावनाएँ पादटिप्पणी में दी गई हैं।
theological_decisions:
- issue: लाल घोड़े पर सवार ‘पुरुष’ की पहचान
  choice: पद के अनुसार केवल ‘एक पुरुष’
  alternative: यहोवा का दूत, प्रतीकात्मक सवार, या मसीह का देहधारण-पूर्व प्रकट होना
  rationale: इस पद में इब्रानी पाठ उस व्यक्ति को केवल אִישׁ, अर्थात ‘पुरुष’, कहता है। बाद का प्रसंग उसकी भूमिका पर प्रकाश डाल सकता है, पर यहाँ किसी विशिष्ट धर्मवैज्ञानिक पहचान को अनुवाद में जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक और गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘और देखो’ से दर्शन की आकस्मिक जीवंतता बनी रहती है। स्थल और घोड़ों के रंग से जुड़ी वास्तविक शब्दार्थगत अनिश्चितताएँ पादटिप्पणियों में रखी गई हैं।
