base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/009.yaml
  text: Then I said[a], “What are these, my lord?” And the angel who was speaking with me said to me[b], “I will show you what these are.”
translation:
  language: hi
  text: तब मैंने पूछा[a], “मेरे स्वामी, ये क्या हैं?” जो स्वर्गदूत मुझसे बात कर रहा था, उसने मुझसे कहा[b], “मैं तुम्हें दिखाऊँगा कि ये क्या हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “मेरे स्वामी” आदरसूचक संबोधन है। इब्रानी אֲדֹנִי इस प्रसंग में परमेश्वर के लिए संबोधन नहीं है; इसका अनुवाद “महोदय” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “मुझमें बात करने वाला”; इस दर्शन के प्रसंग में यह इब्रानी अभिव्यक्ति भविष्यद्वक्ता से बात करने के अर्थ में मुहावरेदार है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: तब मैंने पूछा
  rationale: אמר का मूल अर्थ ‘कहना’ है, पर इसके बाद सीधा प्रश्न आने के कारण स्वाभाविक हिन्दी में ‘पूछा’ संवाद की क्रिया को ठीक प्रकार व्यक्त करता है; וַ से कथा का क्रम ‘तब’ द्वारा प्रकट होता है।
- source_word: מָה אֵלֶּה
  choice: ये क्या हैं
  rationale: מָה और संकेतवाचक אֵלֶּה पहचान पूछते हैं। हिन्दी में ‘ये क्या हैं?’ सहज और पूर्ण है; ‘वस्तुएँ’ जोड़ना आवश्यक नहीं।
- source_word: אֲדֹנִי
  choice: हे मेरे स्वामी
  rationale: यहाँ यह आदरसूचक संबोधन है, परमेश्वर का विशिष्ट नाम नहीं। ‘मेरे स्वामी’ मूल के संबंधसूचक रूप और गरिमापूर्ण स्वर को बनाए रखता है।
- source_word: הַמַּלְאָךְ
  choice: स्वर्गदूत
  rationale: מַלְאָךְ का अर्थ ‘दूत’ भी हो सकता है, पर इस दर्शन में यह अलौकिक व्याख्याकार है; इसलिए प्रचलित हिन्दी ‘स्वर्गदूत’ उपयुक्त है।
- source_word: הַדֹּבֵר בִּי
  choice: मुझसे बात करने वाले
  rationale: शाब्दिक रूप से בִּי ‘मुझमें’ है, पर जकर्याह में यह संवाद करने का मुहावरेदार प्रयोग है। ‘मुझसे बात करने वाले’ हिन्दी में संदर्भगत अर्थ स्पष्ट करता है।
- source_word: אֲנִי אַרְאֶךָּ
  choice: मैं तुम्हें दिखाऊँगा
  rationale: ראה का हिफ़ील रूप ‘दिखाना’ है। स्पष्ट אֲנִי कर्ता पर कुछ बल देता है, जो हिन्दी के व्यक्त सर्वनाम ‘मैं’ से पर्याप्त रूप से प्रकट होता है।
- source_word: מָה הֵמָּה אֵלֶּה
  choice: कि ये क्या हैं
  rationale: मूल में הֵמָּה और אֵלֶּה साथ आकर संकेतित वस्तुओं की पहचान पर बल देते हैं। सहज हिन्दी में ‘कि ये क्या हैं’ अर्थ को बिना कृत्रिम पुनरुक्ति के रखता है।
theological_decisions:
- issue: אֲדֹנִי का संदर्भ और आशय
  choice: व्याख्या करने वाले स्वर्गदूत के लिए आदरसूचक ‘हे मेरे स्वामी’
  alternative: ‘महोदय’ या ‘हे मेरे मालिक’
  rationale: प्रसंग में भविष्यद्वक्ता स्वर्गदूत से बात कर रहा है। अनुवाद सम्मानसूचकता बनाए रखता है, पर इसे परमेश्वर के नाम या स्पष्ट दैवी उपाधि के रूप में प्रस्तुत नहीं करता।
- issue: הַדֹּבֵר בִּי में בִּי का अर्थ
  choice: मुहावरेदार संबंधात्मक अर्थ—‘मुझसे बात करने वाले’
  alternative: शाब्दिक ‘मुझमें बोलने वाले’
  rationale: दर्शन के संवादात्मक प्रसंग और जकर्याह में बार-बार आने वाले प्रयोग के अनुसार आशय भविष्यद्वक्ता से संचार करना है। ‘मुझमें’ अनावश्यक रूप से आंतरिक प्रेरणा का विशिष्ट धर्मवैज्ञानिक अर्थ सुझा सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप। प्रश्नवाचक संवाद में ‘कहा’ के स्थान पर स्वाभाविक ‘पूछा’ चुना गया है। ‘स्वर्गदूत’ भारतीय हिन्दी बाइबल-परंपरा में प्रचलित है, जबकि पादटिप्पणियाँ मूल की शाब्दिक और वैकल्पिक संभावनाएँ सुरक्षित रखती हैं।
