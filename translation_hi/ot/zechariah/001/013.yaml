source:
  edition: WLC
  text: וַ/יַּ֣עַן יְהוָ֗ה אֶת הַ/מַּלְאָ֛ךְ הַ/דֹּבֵ֥ר בִּ֖/י דְּבָרִ֣ים טוֹבִ֑ים דְּבָרִ֖ים נִחֻמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/013.yaml
  text: And Yahweh answered the angel who was speaking with me with good words[b][a], comforting words.
translation:
  language: hi
  text: तब यहोवा ने उस स्वर्गदूत को, जो मुझसे बात कर रहा था,[a] अच्छी और सांत्वना देनेवाली बातें कहकर उत्तर दिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह दर्शन में जकर्याह से बात करनेवाला और उसे बातें समझानेवाला स्वर्गदूत है।
    reason: cultural_note
  - marker: b
    text: या, “अच्छी बातें, सांत्वना की बातें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: तब ... बातें कहीं
  rationale: ענה का मूल अर्थ यहाँ ‘उत्तर देना’ है, पर हिन्दी में जब आगे कही गई बातों की विषयवस्तु नहीं दी जाती, तब ‘बातें कहीं’ अधिक स्वाभाविक है; ‘तब’ कथात्मक וַ־ की प्रगति व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित रूप ‘यहोवा’ इब्रानी चतुरक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में प्रस्तुत करता है।
- source_word: הַמַּלְאָךְ
  choice: उस स्वर्गदूत को
  rationale: दर्शन के प्रसंग में מַלְאָךְ एक अलौकिक दूत को दर्शाता है; निश्चित लेख और पूर्वपरिचित पात्र के कारण ‘उस स्वर्गदूत’ स्वाभाविक है।
- source_word: הַדֹּבֵר בִּי
  choice: जो मुझसे बात कर रहा था
  rationale: वर्तमान कृदंत ongoing संवाद व्यक्त करता है और בִּי इस प्रसंग में ‘मुझसे/मेरे साथ’ के अर्थ में है।
- source_word: דְּבָרִים טוֹבִים
  choice: अच्छी ... बातें
  rationale: यह सीधा अर्थ रखते हुए अनुकूल और भली विषयवस्तु की व्यापकता बनाए रखता है।
- source_word: דְּבָרִים נִחֻמִים
  choice: सांत्वना देनेवाली बातें
  rationale: נחם से संबंधित पद आश्वासन और सांत्वना का भाव देता है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ हिन्दी पाठकों के लिए अधिक परिचित पारंपरिक लिप्यंतरण है, जबकि ‘याहवे’ विद्वानों में प्रचलित वैकल्पिक पुनर्निर्मित उच्चारण है।
- issue: ענה के उत्तरात्मक भाव को व्यक्त करना
  choice: बातें कहीं
  alternative: उत्तर दिया
  rationale: इब्रानी में क्रिया ‘उत्तर दिया’ है, लेकिन उसके साथ साधन/विषयवस्तु के रूप में ‘अच्छी बातें, सांत्वना की बातें’ आती हैं। हिन्दी में ‘बातें कहीं’ सहज है; पादटिप्पणी मूल के उत्तरात्मक भाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘स्वर्गदूत’ सामान्य हिन्दी पाठक के लिए ‘दूत’ की अपेक्षा अलौकिक अभिप्राय अधिक स्पष्ट करता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित पदों के तुरंत बाद दिए गए हैं।
