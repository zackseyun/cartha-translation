  text: Your fathers—where are they? And the prophets[a], do they live forever?
translation:
  language: hi
  text: तुम्हारे पिता[a]—वे कहाँ हैं? और भविष्यद्वक्ता—क्या वे सदा जीवित रहते हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारे पुरखे।’ इब्रानी में शाब्दिक रूप से ‘तुम्हारे पिता’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבֹתֵיכֶם
  choice: तुम्हारे पिता
  rationale: इब्रानी बहुवचन का शाब्दिक अर्थ ‘तुम्हारे पिता’ है और यहाँ इससे पिछली पीढ़ियाँ अभिप्रेत हैं। ‘पिता’ मूल की सीधी और प्रभावशाली संबोधन-शैली बनाए रखता है; ‘पुरखे’ या ‘पूर्वज’ अर्थ की दृष्टि से संभव हैं।
- source_word: אַיֵּה הֵם
  choice: वे कहाँ हैं?
  rationale: प्रश्नवाचक क्रियाविशेषण के साथ स्वतंत्र सर्वनाम הֵם पर बल है; इसलिए हिन्दी में ‘वे’ को स्पष्ट रखा गया है।
- source_word: וְהַנְּבִאִים
  choice: और भविष्यद्वक्ता
  rationale: सरल संयोजक और निश्चित बहुवचन संज्ञा को रखते हुए पहली पंक्ति के समानांतर अलंकारिक प्रश्न सुरक्षित रखा गया है।
- source_word: הַלְעוֹלָם
  choice: सदा
  rationale: यहाँ इसका अर्थ निरंतर या हमेशा जीवित रहने से है; ‘सदा’ आधुनिक, संक्षिप्त और गरिमापूर्ण हिन्दी है।
- source_word: יִחְיוּ
  choice: जीवित रहते हैं
  rationale: काल-अपूर्ण रूप यहाँ सामान्य या सार्वकालिक प्रश्न व्यक्त करता है। हिन्दी वर्तमानकाल ‘जीवित रहते हैं’ मनुष्यों के अनंतकाल तक बने रहने संबंधी अलंकारिक प्रश्न को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘भविष्यद्वक्ताओं’ का आशय और अलंकारिक बल
  choice: पिता और भविष्यद्वक्ता दोनों नश्वर मनुष्य हैं।
  alternative: इसे केवल मृत पूर्वजों और कभी जीवित रहे भविष्यद्वक्ताओं की तुलना माना जा सकता है, जबकि परमेश्वर के वचन के स्थायित्व का विचार अगली आयत में स्पष्ट होता है।
  rationale: इस आयत का इब्रानी पाठ पूछता है कि क्या भविष्यद्वक्ता सदा जीवित रहते हैं। यह मनुष्यों की नश्वरता स्थापित करता है, पर इस आयत में ही भविष्यद्वक्ताओं के संदेश की विफलता या समाप्ति का निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और मौखिक पाठ में स्वाभाविक। दोनों प्रश्नों की समानांतर रचना और इब्रानी का अलंकारिक बल डैश के माध्यम से बनाए रखा गया है।
