base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/015.yaml
  text: And I am exceedingly angry with the nations that are at ease[a]; for I was only a little angry[d][c][b], but they helped forward the disaster.
translation:
  language: hi
  text: और मैं उन निश्चिन्त जातियों पर बहुत क्रोधित हूँ[a], क्योंकि मैं तो थोड़ा ही क्रोधित हुआ था[b], पर उन्होंने अनिष्ट को और बढ़ा दिया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बड़े क्रोध से क्रोधित हूँ।”
    reason: lexical_alternative
  - marker: b
    text: या, “मैं थोड़े समय के लिए क्रोधित हुआ था।” इब्रानी शब्द मात्रा अथवा अवधि—दोनों का बोध करा सकता है।
    reason: alternative_reading
  - marker: c
    text: शाब्दिक रूप से, “उन्होंने अनिष्ट के लिए सहायता की,” अर्थात उन्होंने विपत्ति को अधिक बढ़ा दिया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקֶצֶף גָּדוֹל אֲנִי קֹצֵף
  choice: और मैं...बहुत क्रोधित हूँ
  rationale: इब्रानी संज्ञा ‘बड़ा क्रोध’ और कृदन्त ‘क्रोधित हूँ’ मिलकर वर्तमान और तीव्र क्रोध व्यक्त करते हैं। हिन्दी में ‘बहुत क्रोधित हूँ’ स्वाभाविक रूप से वही बल बनाए रखता है।
- source_word: הַגּוֹיִם
  choice: जातियों
  rationale: सन्दर्भ में यह यहूदा के आसपास की विदेशी जातियों को सूचित करता है। ‘जातियाँ’ सीधा और पारम्परिक होते हुए भी आधुनिक हिन्दी में बोधगम्य है।
- source_word: הַשַּׁאֲנַנִּים
  choice: निश्चिन्त
  rationale: यह शब्द चैन, सुरक्षा और आत्मसन्तुष्ट बेफिक्री का भाव रखता है। ‘निश्चिन्त’ मूल बिम्ब को रखता है और ‘आत्मसन्तुष्ट’ जैसी अधिक व्याख्यात्मक भाषा से बचता है।
- source_word: אֲשֶׁר
  choice: क्योंकि
  rationale: यद्यपि यह सामान्यतः सम्बन्धवाचक अव्यय है, यहाँ आगे का वाक्य परमेश्वर के क्रोध का कारण बताता है; इसलिए ‘क्योंकि’ प्रसंगगत सम्बन्ध स्पष्ट करता है।
- source_word: קָצַפְתִּי מְּעָט
  choice: मैं तो थोड़ा ही क्रोधित हुआ था
  rationale: מְעָט को यहाँ मुख्यतः क्रोध की सीमित मात्रा के रूप में लिया गया है। ‘तो’ और ‘ही’ अगली विरोधसूचक उपवाक्य के साथ तुलना को स्वाभाविक हिन्दी में उभारते हैं, जबकि अवधि वाला अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וְהֵמָּה
  choice: पर उन्होंने
  rationale: सर्वनाम बलयुक्त है और वाक्य में परमेश्वर के सीमित क्रोध तथा जातियों की बढ़ी हुई हानि के बीच विरोध है। ‘पर उन्होंने’ दोनों को व्यक्त करता है।
- source_word: עָזְרוּ לְרָעָה
  choice: उन्होंने अनिष्ट को और बढ़ा दिया
  rationale: शाब्दिक अर्थ ‘उन्होंने बुराई/अनिष्ट के लिए सहायता की’ है। प्रसंग में जातियों ने आई हुई हानि को तीव्र किया; ‘अनिष्ट को और बढ़ा दिया’ इस मुहावरे का स्वाभाविक अर्थ देता है, बिना उनकी उत्तरदायित्वपूर्ण भूमिका मिटाए।
theological_decisions:
- issue: परमेश्वर के क्रोध और जातियों की भूमिका का सम्बन्ध
  choice: परमेश्वर का क्रोध सीमित था, पर जातियों ने अनिष्ट को उसकी अपेक्षा अधिक बढ़ाया।
  alternative: जातियों ने केवल परमेश्वर का न्याय पूरा किया और उसकी सीमा से आगे नहीं गईं।
  rationale: ‘मैं तो थोड़ा ही क्रोधित हुआ था, पर उन्होंने...’ की विरोधसूचक रचना परमेश्वर की सीमित अप्रसन्नता और जातियों द्वारा बढ़ाई गई विपत्ति में भेद करती है। अनुवाद परमेश्वर की भूमिका और जातियों की नैतिक जिम्मेदारी—दोनों को बनाए रखता है।
- issue: מְעָט का आशय
  choice: क्रोध की थोड़ी मात्रा
  alternative: थोड़े समय तक क्रोध
  rationale: प्रसंगगत विरोध मात्रा के अर्थ का समर्थन करता है, पर इब्रानी में अवधि का अर्थ सम्भव है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘निश्चिन्त जातियाँ’ मूल की संक्षिप्तता और बिम्ब को रखता है। वाक्य में ‘तो...पर’ से इब्रानी का मुख्य विरोध स्पष्ट किया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
