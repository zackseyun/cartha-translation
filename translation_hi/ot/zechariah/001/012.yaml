id: ZEC.1.12
reference: Zechariah 1:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֣עַן מַלְאַךְ יְהוָה֮ וַ/יֹּאמַר֒ יְהוָ֣ה צְבָא֔וֹת עַד מָתַ֗י אַתָּה֙ לֹֽא תְרַחֵ֣ם אֶת יְרוּשָׁלִַ֔ם וְ/אֵ֖ת עָרֵ֣י יְהוּדָ֑ה אֲשֶׁ֣ר זָעַ֔מְתָּה זֶ֖ה שִׁבְעִ֥ים שָׁנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/012.yaml
  text: Then the angel of Yahweh answered and said[a], “O Yahweh of hosts, how long will you have no compassion on Jerusalem and on the cities of Judah[c][b], against which you have been angry these seventy years?”
translation:
  language: hi
  text: तब याहवे के दूत[a] ने उत्तर दिया और कहा, “हे सेनाओं के याहवे, तू कब तक यरूशलेम और यहूदा के नगरों पर दया नहीं करेगा[b], जिन पर तू इन सत्तर वर्षों से क्रोधित रहा है[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दूत” का अनुवाद “संदेशवाहक” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अथवा “तू कब तक यरूशलेम और यहूदा के नगरों पर करुणा नहीं दिखाएगा?”
    reason: lexical_alternative
  - marker: c
    text: अथवा “जिनसे तू इन सत्तर वर्षों से अत्यन्त अप्रसन्न रहा है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: याहवे के दूत
  rationale: מַלְאַךְ का अर्थ ‘दूत’ या ‘संदेशवाहक’ हो सकता है। दर्शन के संदर्भ में ‘दूत’ स्वाभाविक है और इस पात्र की सटीक पहचान के विषय में पाठ से आगे नहीं जाता।
- source_word: יְהוָה צְבָאוֹת
  choice: हे सेनाओं के याहवे
  rationale: צְבָאוֹת का मूल अर्थ ‘सेनाएँ/समूह’ है। ‘सेनाओं के याहवे’ उपाधि की ठोस छवि बनाए रखता है, और ‘हे’ संबोधन को स्पष्ट करता है।
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: ने उत्तर दिया और कहा
  rationale: दोनों क्रियाओं को रखते हुए इब्रानी कथन-क्रम और संवादात्मक प्रत्युत्तर को स्पष्ट किया गया है।
- source_word: עַד מָתַי
  choice: कब तक
  rationale: यह विलाप और मध्यस्थता में प्रयुक्त समय-संबंधी प्रश्न का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: לֹא תְרַחֵם
  choice: दया नहीं करेगा
  rationale: רחם में दया और करुणा का भाव है। हिन्दी में यह रूप मूल के निषेधात्मक प्रश्न को स्वाभाविक ढंग से बनाए रखता है।
- source_word: אֲשֶׁר זָעַמְתָּה
  choice: जिन पर तू ... क्रोधित रहा है
  rationale: זעם तीव्र अप्रसन्नता अथवा रोष व्यक्त करता है। ‘क्रोधित रहा है’ दीर्घकालीन स्थिति और वर्तमान तक उसकी प्रासंगिकता को व्यक्त करता है।
- source_word: זֶה שִׁבְעִים שָׁנָה
  choice: इन सत्तर वर्षों से
  rationale: यह अवधि वर्तमान वक्तव्य तक फैली हुई है; ‘इन ... वर्षों से’ हिन्दी में זֶה के संकेतात्मक और कालावधि-संबंधी बल को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा-संबंधी व्यक्तिगत नाम है। ‘याहवे’ उसे उपाधि ‘प्रभु’ में बदलने के बजाय नाम के रूप में प्रस्तुत करता है और ‘यहोवा’ की अपेक्षा प्रचलित विद्वत्तापूर्ण उच्चारण के अधिक निकट है।
- issue: מַלְאַךְ יְהוָה की पहचान
  choice: याहवे के दूत
  alternative: याहवे के संदेशवाहक
  rationale: अनुवाद इस पात्र को दूत के रूप में प्रस्तुत करता है, पर उसे किसी विशिष्ट अवतारी या अन्य धर्मवैज्ञानिक पहचान से नहीं जोड़ता; मूल पाठ की अनिर्धारितता बनी रहती है।
- issue: दया के अभाव पर प्रश्न का स्वर
  choice: तू कब तक ... दया नहीं करेगा
  alternative: क्या तू ... पर दया नहीं करेगा?
  rationale: עַד מָתַי और निषेध को साथ रखकर प्रार्थनापूर्ण शिकायत तथा मध्यस्थता का तनाव बनाए रखा गया है; इसे केवल भविष्यवाणी या आरोप में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। एकवचन ‘तू’ बाइबलीय प्रार्थना के निकट और प्रत्यक्ष संबोधन को व्यक्त करता है। ‘सेनाओं के याहवे’ पारंपरिक उपाधि की मूल सैन्य/स्वर्गीय छवि को बनाए रखता है; वाक्य में मूल की पुनरुक्ति ‘उत्तर दिया और कहा’ जानबूझकर सुरक्षित है।
