- source_word: קָצַף ... קָצֶף
  choice: बहुत क्रोधित हुआ था
  rationale: क्रिया और उसी मूल की संज्ञा मिलकर इब्रानी में तीव्रता व्यक्त करती हैं। स्वाभाविक हिन्दी में इसे ‘बहुत क्रोधित हुआ था’ से व्यक्त किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम चतुरक्षर को किसी उपाधि से बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: עַל
  choice: पर
  rationale: क्रोध की क्रिया के साथ यह संबंधबोधक उस व्यक्ति-समूह को सूचित करता है जिसकी ओर क्रोध निर्देशित है; हिन्दी में ‘पर क्रोधित’ स्वाभाविक है।
- source_word: אֲבֹתֵיכֶם
  choice: तुम्हारे पूर्वजों
  rationale: शाब्दिक अर्थ ‘तुम्हारे पिताओं’ है, पर यहाँ आशय पिछली पीढ़ियों/पुरखों से है। आधुनिक हिन्दी में ‘पूर्वजों’ यह व्यापक संदर्भ स्वाभाविक रूप से बताता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि से प्रतिस्थापित नहीं करता।
- issue: אֲבֹתֵיכֶם का सामूहिक आशय
  choice: पूर्वजों
  alternative: पिताओं
  rationale: यहाँ संबोधित लोगों के जैविक पिताओं तक अर्थ सीमित नहीं है, बल्कि पहले की पीढ़ियों की ओर संकेत है। पादटिप्पणी शाब्दिक रूप को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। इब्रानी की जोरदार पुनरुक्ति को स्वाभाविक हिन्दी तीव्रतासूचक ‘बहुत’ से व्यक्त किया गया है।
