id: ZEC.1.14
reference: Zechariah 1:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י הַ/מַּלְאָךְ֙ הַ/דֹּבֵ֣ר בִּ֔/י קְרָ֣א לֵ/אמֹ֔ר כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת קִנֵּ֧אתִי לִ/ירוּשָׁלִַ֛ם וּ/לְ/צִיּ֖וֹן קִנְאָ֥ה גְדוֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/014.yaml
  text: 'Then the angel who was speaking with me said to me[a], “Proclaim, saying, ‘Thus says Yahweh of hosts: I am exceedingly jealous for Jerusalem and for Zion.’”'
translation:
  language: hi
  text: 'तब मुझसे बात करने वाले स्वर्गदूत ने मुझसे कहा, “घोषणा कर, ‘सेनाओं का याहवे यों कहता है: मैं यरूशलेम के लिए और सिय्योन के लिए अत्यन्त ईर्ष्यावान हूँ[a]।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं यरूशलेम और सिय्योन के लिए बड़े उत्साह से भरा हूँ।” इब्रानी में बल देने के लिए ‘ईर्ष्या/जलन’ से जुड़े एक ही मूल की क्रिया और संज्ञा का प्रयोग हुआ है।
    reason: कנא / קנאה का अर्थ ईर्ष्या या जलन के साथ-साथ प्रबल उत्साह/जोश भी हो सकता है; एक ही मूल की पुनरावृत्ति तीव्रता प्रकट करती है।
lexical_decisions:
- source_word: הַמַּלְאָךְ הַדֹּבֵר בִּי
  choice: मुझसे बात करनेवाला स्वर्गदूत
  rationale: जकर्याह में דֹּבֵר בִּי एक मुहावरा है जिसका स्वाभाविक अर्थ ‘मुझसे बात करनेवाला’ है; इसे ‘मेरे भीतर बोलनेवाला’ कहना अनावश्यक रूप से शाब्दिक और भ्रामक होगा।
- source_word: קְרָא לֵאמֹר
  choice: घोषणा कर
  rationale: भविष्यद्वक्ताई संदर्भ में קרא सार्वजनिक रूप से पुकारकर संदेश सुनाने का भाव रखता है। ‘घोषणा कर’ आज की हिन्दी में आदेश और संदेशवाहक की भूमिका दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वक्ताई संदेशवाहक का पारंपरिक सूत्र है। ‘यों कहता है’ औपचारिक गरिमा रखते हुए सहज हिन्दी है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: ‘याहवे’ परमेश्वर के विशिष्ट नाम को दर्शाता है और ‘सेनाओं का’ צְבָאוֹת की सैन्य तथा स्वर्गीय समूहों से जुड़ी कल्पना को ‘सर्वशक्तिमान’ जैसे व्याख्यात्मक रूप की अपेक्षा अधिक सीधे सुरक्षित रखता है।
- source_word: קִנֵּאתִי ... קִנְאָה גְדוֹלָה
  choice: मैं ... के लिए अत्यन्त जलन रखता हूँ
  rationale: क्रिया और उसी मूल की संज्ञा मिलकर तीव्रता प्रकट करती हैं। ‘अत्यन्त’ उस बलाघात को स्वाभाविक हिन्दी में देता है, जबकि ‘जलन’ ईश्वरीय ईर्ष्या/अनन्य निष्ठा से जुड़ा मूल तनाव बनाए रखती है।
- source_word: לִירוּשָׁלִַם וּלְצִיּוֹן
  choice: यरूशलेम और सिय्योन के लिए
  rationale: ‘के लिए’ दोनों नगर-नामों पर लागू होता है और उनके प्रति याहवे की तीव्र चिंता तथा अनुराग को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: ‘याहवे’ इब्रानी विशिष्ट नाम का निकट लिप्यंतरण है और मूल पाठ में सामान्य उपाधि के बजाय व्यक्तिगत वाचा-नाम की उपस्थिति को खुला रखता है।
- issue: परमेश्वर के लिए קנא / קנאה का अर्थ
  choice: जलन रखता हूँ
  alternative: बड़े उत्साह से भरा हूँ
  rationale: मूल शब्द में ईर्ष्या, अनन्य अधिकार और प्रबल उत्साह की अर्थ-सीमा है। ‘जलन’ इस कठिन धर्मवैज्ञानिक तनाव को नरम किए बिना सुरक्षित रखती है; अधिक सकारात्मक अर्थ सुनने के लिए वैकल्पिक रूप पादटिप्पणी में दिया गया है।
- issue: इब्रानी सिद्ध रूप קִנֵּאתִי का कालगत बल
  choice: रखता हूँ
  alternative: मैंने ... जलन रखी है
  rationale: भविष्यद्वक्ताई घोषणा में यह रूप याहवे की वर्तमान और दृढ़ मनोदशा बताता है। हिन्दी का वर्तमान काल इसे स्वाभाविक रूप से व्यक्त करता है, बिना इसे केवल बीती हुई भावना तक सीमित किए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, औपचारिक किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘स्वर्गदूत’, ‘घोषणा कर’ और ‘यों कहता है’ भविष्यद्वक्ताई प्रसंग की गरिमा बनाए रखते हैं। पादटिप्पणी-चिह्न [a] मुख्य पाठ में संबंधित विवादित अभिव्यक्ति के तुरंत बाद रखा गया है।
