language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ע֣וֹד קְרָ֣א לֵ/אמֹ֗ר כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת ע֛וֹד תְּפוּצֶ֥ינָה עָרַ֖/י מִ/טּ֑וֹב וְ/נִחַ֨ם יְהוָ֥ה עוֹד֙ אֶת צִיּ֔וֹן וּ/בָחַ֥ר ע֖וֹד בִּ/ירוּשָׁלִָֽם׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/017.yaml
  text: 'Call out again[a], saying, ‘Thus says Yahweh of hosts: My cities will again overflow with prosperity, and Yahweh will again comfort Zion and again choose Jerusalem.’'
translation:
  language: hi
  text: 'फिर पुकारकर कह, “सेनाओं का याहवे यों कहता है: मेरे नगर फिर समृद्धि से भर उठेंगे[a]; याहवे फिर सिय्योन को सांत्वना देगा और यरूशलेम को फिर चुनेगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे नगर भलाई के कारण फिर फैल जाएँगे,” अथवा “मेरे नगर फिर अच्छी वस्तुओं से भर जाएँगे।”
    reason: इब्रानी क्रिया और מִטּוֹב का मेल फैलने, प्रचुर होने, या अच्छी वस्तुओं से भर जाने के अर्थ दे सकता है।
lexical_decisions:
- source_word: עוֹד
  choice: फिर
  rationale: इस पद में बार-बार आया यह क्रिया-विशेषण न्याय के बाद नए सिरे से होने वाली घोषणा, समृद्धि, सांत्वना और चुनाव को व्यक्त करता है।
- source_word: קְרָא לֵאמֹר
  choice: पुकारकर कह
  rationale: यह सार्वजनिक और सुनाई देने योग्य घोषणा की आज्ञा है; हिन्दी में यह अभिव्यक्ति उसके घोषणात्मक बल को स्वाभाविक रूप से बनाए रखती है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह नबूवत की पारंपरिक संदेशवाहक-उक्ति का संक्षिप्त और गरिमापूर्ण हिन्दी रूप है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: याहवे व्यक्तिगत दिव्य नाम को लिप्यंतरित करता है, जबकि सेनाओं का शीर्षक צְבָאוֹת की व्यापक स्वर्गीय और सैन्य छवि को बनाए रखता है।
- source_word: תְּפוּצֶינָה ... מִטּוֹב
  choice: समृद्धि से उमड़ पड़ेंगे
  rationale: पुनर्स्थापना के संदर्भ में यह नगरों में भलाई और प्रचुरता के फैलने या भर जाने का भाव देता है; मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और शाब्दिक संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: עָרַי
  choice: मेरे नगर
  rationale: 'प्रथम पुरुष एकवचन प्रत्यय को स्पष्ट रखा गया है: ये याहवे के नगर हैं।'
- source_word: וְנִחַם
  choice: सांत्वना देगा
  rationale: נחם यहाँ विपत्ति के बाद सिय्योन को ढाढ़स और पुनर्स्थापना देने का अर्थ रखता है।
- source_word: וּבָחַר
  choice: चुनेगा
  rationale: यह בחר का सीधा अनुवाद है और वाचा-संबंधी चुनाव को किसी बाद की धर्मसैद्धांतिक प्रणाली से अधिक निर्दिष्ट नहीं करता।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; उसे उपाधि से बदलने के बजाय आधुनिक हिन्दी लिपि में लिप्यंतरित किया गया है।
- issue: यरूशलेम को फिर चुनना
  choice: यरूशलेम को फिर चुनेगा
  alternative: यरूशलेम को फिर अपना बनाएगा; यरूशलेम को फिर निर्वाचित करेगा
  rationale: मूल क्रिया दिव्य चुनाव और अनुग्रह की पुनः पुष्टि करती है; सीधा शब्द 'चुनेगा' इस अर्थ को बिना अनावश्यक धर्मसैद्धांतिक विस्तार के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। नबूवत की उद्घोषणात्मक शैली को “पुकारकर कह” और “यों कहता है” से सुरक्षित रखा गया है।
