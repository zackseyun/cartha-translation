  text: On that day[a], declares Yahweh of Armies[d][c][b], each of you will invite his neighbor under the vine and under the fig tree.
translation:
  language: hi
  text: '“उस दिन सेनाओं के यहोवा की यह घोषणा है: तुम में से हर एक अपने पड़ोसी को अंगूर की बेल और अंजीर के पेड़ के नीचे आमंत्रित करेगा[a]।”[b][c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अधिक शाब्दिक अनुवाद ‘बुलाएगा’ हो सकता है; यहाँ संदर्भ में इसका भाव संभवतः ‘आमंत्रित करेगा’ है।
    reason: lexical_alternative
  - marker: b
    text: कई अनुवाद इस उपाधि को ‘सेनाओं का प्रभु’ या ‘गणों का यहोवा’ कहते हैं। इब्रानी צְבָאוֹת का अर्थ ‘सेनाएँ’ या ‘दल’ है।
    reason: lexical_alternative
  - marker: c
    text: 'तुलना करें: 1 राजा 4:25 और मीका 4:4। बेल और अंजीर के पेड़ के नीचे बैठना शांति, सुरक्षा और समृद्धि का प्रतीक है।'
    reason: cross_reference
  - marker: d
    text: कुछ अनुवाद समान बाइबलीय मुहावरे के आधार पर ‘अपनी बेल’ और ‘अपने अंजीर के पेड़’ कहते हैं, पर यहाँ इब्रानी पाठ में स्वामित्वसूचक शब्द स्पष्ट रूप से नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्य में परमेश्वर के निर्णायक कार्य के समय को सूचित करने वाला प्रचलित भविष्यद्वाणी-सूत्र है।
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा यह घोषणा करता है
  rationale: נְאֻם को भविष्यद्वाणी की औपचारिक घोषणा के रूप में व्यक्त किया गया है; יְהוָה को वाचा-नाम ‘यहोवा’ और צְבָאוֹת को अर्थ-स्पष्ट ‘सेनाओं’ के रूप में रखा गया है।
- source_word: תִּקְרְאוּ
  choice: आमंत्रित करेगा
  rationale: क्रिया का मूल अर्थ ‘बुलाना’ है, पर पड़ोसी और विश्राम-स्थल के संदर्भ में यहाँ मैत्रीपूर्ण निमंत्रण का भाव अधिक स्वाभाविक है।
- source_word: אִישׁ לְרֵעֵהוּ
  choice: तुम में से हर एक अपने पड़ोसी को
  rationale: बहुवचन क्रिया के साथ אִישׁ का वितरणात्मक अर्थ ‘हर एक’ है; רֵעַ के लिए ‘पड़ोसी’ सामुदायिक शांति के प्रसंग में उपयुक्त और व्यापक है।
- source_word: אֶל תַּחַת גֶּפֶן וְאֶל תַּחַת תְּאֵנָה
  choice: अंगूर की बेल के नीचे और अंजीर के पेड़ के नीचे
  rationale: दोहराया गया אֶל תַּחַת गंतव्य की ओर संकेत करता है। हिंदी में ‘आमंत्रित करेगा’ के साथ ‘के नीचे’ इसे स्वाभाविक रूप से व्यक्त करता है; मूल में स्वामित्वसूचक सर्वनाम नहीं जोड़ा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में वाचा-नाम सीधे उपस्थित है; उसे सामान्य उपाधि से बदलने के बजाय नाम के रूप में रखा गया है।
- issue: צְבָאוֹת की उपाधि
  choice: सेनाओं का
  alternative: गणों का
  rationale: ‘सेनाओं’ से इस उपाधि का सैन्य तथा स्वर्गीय समूहों से जुड़ा व्यापक बिंब आधुनिक पाठक को स्पष्ट रहता है; पारंपरिक ‘गणों’ की अपेक्षा यह अधिक सहज है।
- issue: बेल और अंजीर के पेड़ का बिंब
  choice: बिंब को बिना व्याख्यात्मक विस्तार के अक्षुण्ण रखा गया
  alternative: मुख्य पाठ में शांति और समृद्धि स्पष्ट कर देना
  rationale: यह बिंब सुरक्षा, शांति और समृद्धि का संकेत देता है, पर अर्थ-विस्तार मुख्य पाठ में जोड़ने के बजाय टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। भविष्यद्वाणी की घोषणा का औपचारिक स्वर बना हुआ है, जबकि ‘तुम में से हर एक’ और ‘अपने पड़ोसी’ सामान्य हिंदी में सहज हैं।
