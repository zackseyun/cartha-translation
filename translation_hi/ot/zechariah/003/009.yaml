source:
  edition: WLC
  text: כִּ֣י הִנֵּ֣ה הָ/אֶ֗בֶן אֲשֶׁ֤ר נָתַ֨תִּי֙ לִ/פְנֵ֣י יְהוֹשֻׁ֔עַ עַל אֶ֥בֶן אַחַ֖ת שִׁבְעָ֣ה עֵינָ֑יִם הִנְ/נִ֧י מְפַתֵּ֣חַ פִּתֻּחָ֗/הּ נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת וּ/מַשְׁתִּ֛י אֶת עֲוֺ֥ן הָ/אָֽרֶץ הַ/הִ֖יא בְּ/י֥וֹם אֶחָֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/009.yaml
  text: For behold[a], the stone that I have set before Joshua—on one stone are seven eyes. Behold, I myself will engrave its engraving, declares Yahweh of Armies[b], and I will remove the iniquity of that land in a single day.
translation:
  language: hi
  text: क्योंकि देखो, वह पत्थर जिसे मैंने यहोशू के सामने रखा है—उस एक पत्थर पर सात आँखें हैं। देखो, मैं स्वयं उस पर नक्काशी करूँगा[a]—सेनाओं के याहवे की घोषणा है[b]—और मैं उस देश का अधर्म एक ही दिन में दूर कर दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसकी नक्काशी उकेरूँगा।” इब्रानी में क्रिया और संज्ञा एक ही मूल से बने हैं; अधिक सहज रूप में, “उस पर नक्काशी करूँगा।”
    reason: lexical_alternative
  - marker: b
    text: 'परंपरागत अनुवाद: “सेनाओं का प्रभु” या “सेनाओं का यहोवा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: क्योंकि देखो
  rationale: כִּי व्याख्यात्मक संबंध जोड़ता है और הִנֵּה ध्यान आकर्षित करने वाला भविष्यद्वक्तापरक सूचक है; ‘क्योंकि देखो’ दोनों पहलुओं को बनाए रखता है।
- source_word: הָאֶבֶן
  choice: वह पत्थर
  rationale: मूल का निश्चित संज्ञा-रूप रखा गया है; प्रतीक की पहचान अनुवाद में नहीं जोड़ी गई।
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵי יְהוֹשֻׁעַ
  choice: जिसे मैंने यहोशू के सामने रखा है
  rationale: נתן का यहाँ प्रसंगानुकूल अर्थ ‘रखना’ है; पूर्ण क्रिया का वर्तमान परिणाम ‘रखा है’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: עַל אֶבֶן אַחַת שִׁבְעָה עֵינָיִם
  choice: उस एक पत्थर पर सात आँखें हैं
  rationale: עַל को ‘पर’ और प्रतीकात्मक ‘सात आँखें’ को अक्षरशः रखा गया है; वाक्य की आवश्यक हिंदी स्पष्टता के लिए ‘हैं’ जोड़ा गया है।
- source_word: הִנְנִי
  choice: देखो, मैं स्वयं
  rationale: रचना में निहित ध्यानाकर्षण और प्रथम-पुरुष बलाघात दोनों को व्यक्त करता है।
- source_word: מְפַתֵּחַ פִּתֻּחָהּ
  choice: उसकी नक्काशी खोदूँगा
  rationale: क्रिया और सजातीय संज्ञा की इब्रानी अभिव्यक्ति को जानबूझकर कुछ औपचारिक हिंदी में बनाए रखा गया है; भावी अर्थ הִנְנִי के साथ आसन्न दैवी कार्य को दर्शाता है।
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे की यह घोषणा है
  rationale: נְאֻם को भविष्यद्वक्तापरक घोषणा-सूत्र के रूप में, יהוה को व्यक्तिवाचक नाम ‘याहवे’ के रूप में और צְבָאוֹת को पारदर्शी ‘सेनाओं’ के रूप में प्रस्तुत किया गया है।
- source_word: וּמַשְׁתִּי
  choice: और मैं ... दूर कर दूँगा
  rationale: संदर्भ में क्रिया हटाने या दूर करने का अर्थ देती है; ‘दूर कर दूँगा’ पूर्ण और निर्णायक कार्य को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: עֲוֺן
  choice: अधर्म
  rationale: עָוֹן में पाप, दोष और कुटिलता का अर्थक्षेत्र है; ‘अधर्म’ नैतिक भार बनाए रखता है और इसे केवल मनोवैज्ञानिक दोषभाव तक सीमित नहीं करता।
- source_word: הָאָרֶץ הַהִיא
  choice: उस देश
  rationale: הַהִיא के संकेतवाचक बल को ‘उस’ से स्पष्ट रखा गया है; यहाँ אֶרֶץ के लिए ‘देश’ प्रसंगानुकूल है।
- source_word: בְּיוֹם אֶחָד
  choice: एक ही दिन में
  rationale: ‘ही’ एक दिन की विशिष्टता और निर्णायकता को स्वाभाविक हिंदी में उभारता है।
theological_decisions:
- issue: पत्थर और सात आँखों की प्रतीकात्मक पहचान
  choice: चित्रात्मक भाषा को अक्षरशः रखा गया है और मुख्य पाठ में उसकी पहचान नहीं की गई।
  alternative: पत्थर को मसीह अथवा सात आँखों को याहवे की सर्वज्ञता के रूप में स्पष्ट कर देना।
  rationale: इस पद का इब्रानी पाठ प्रतीकों को प्रस्तुत करता है, पर यहीं उनकी स्पष्ट व्याख्या नहीं करता; अनुवाद को इस धर्मवैज्ञानिक तनाव और अस्पष्टता को बनाए रखना चाहिए।
- issue: יהוה צְבָאוֹת का अनुवाद
  choice: सेनाओं के याहवे
  alternative: सेनाओं का प्रभु; सेनाओं का यहोवा
  rationale: יהוה को वाचा के व्यक्तिवाचक नाम ‘याहवे’ के रूप में रखा गया है और צְבָאוֹת का अर्थ ‘सेनाओं’ से पारदर्शी बनाया गया है।
- issue: עָוֹן का अर्थक्षेत्र
  choice: अधर्म
  alternative: दोष; पाप; अधर्म का दंड
  rationale: मूल शब्द अपराध, उससे उत्पन्न दोष और कभी उसके दंड तक का अर्थ दे सकता है। ‘अधर्म’ मुख्य पाठ में नैतिक व्यापकता को बनाए रखता है, बिना किसी एक धर्मवैज्ञानिक पक्ष को निर्णायक बनाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए बोधगम्य रखी गई है। भविष्यद्वक्तापरक ‘देखो’ तथा प्रतीकात्मक ‘सात आँखें’ जानबूझकर सुरक्षित हैं। सजातीय इब्रानी अभिव्यक्ति के कारण ‘उसकी नक्काशी खोदूँगा’ कुछ औपचारिक है, इसलिए सहज विकल्प पादटिप्पणी में दिया गया है।
