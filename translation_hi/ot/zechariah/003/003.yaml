translation:
  language: hi
  text: यहोशू अत्यन्त गन्दे वस्त्र पहने हुए था और स्वर्गदूत के सामने खड़ा था[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अत्यन्त गन्दे’ के लिए प्रयुक्त इब्रानी शब्द वस्त्रों की बहुत ही गन्दी और अशुद्ध दशा व्यक्त करता है; ‘मैले’ भी सम्भव है।
    reason: lexical_alternative
  - marker: b
    text: या ‘दूत’। इस दर्शन के प्रसंग में ‘स्वर्गदूत’ अधिक स्वाभाविक है।
    reason: alternative_reading
lexical_decisions:
- source_word: וִ/יהוֹשֻׁעַ
  choice: यहोशू
  rationale: वाव यहाँ दर्शन-वृत्तांत को आगे बढ़ाता है; हिन्दी में अलग आरम्भिक संयोजक जोड़े बिना प्रवाह स्वाभाविक रहता है। नाम का प्रचलित हिन्दी रूप रखा गया है।
- source_word: הָיָה לָבֻשׁ
  choice: पहने हुए था
  rationale: यह रचना परिवर्तन नहीं, यहोशू की उस समय की अवस्था बताती है। आधुनिक हिन्दी में यह निष्क्रिय/स्थितिवाचक भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: בְּגָדִים צוֹאִים
  choice: मैले वस्त्र
  rationale: צוֹאִים अत्यन्त गन्दी और अशुद्ध दशा का तीखा शब्द है। ‘मैले’ सहज हिन्दी है; पादटिप्पणी इसकी तीव्रता स्पष्ट करती है, जबकि ‘अपवित्र’ अनावश्यक धार्मिक व्याख्या जोड़ सकता है।
- source_word: וְ/עֹמֵד
  choice: और ... खड़ा था
  rationale: कृदन्त पहले वर्णित अवस्था के साथ चल रही मुद्रा को व्यक्त करता है; ‘खड़ा था’ हिन्दी में उसकी निरन्तरता स्पष्ट करता है।
- source_word: לִ/פְנֵי
  choice: के सामने
  rationale: यह स्थानिक तथा व्यक्तिगत उपस्थिति का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: הַ/מַּלְאָךְ
  choice: स्वर्गदूत
  rationale: מַלְאָךְ का मूल अर्थ ‘दूत’ हो सकता है, पर इस दर्शनीय स्वर्गीय प्रसंग में ‘स्वर्गदूत’ सर्वाधिक स्वाभाविक है। निश्चितता को प्रसंग और पूर्वोल्लेख से समझा जाता है।
theological_decisions:
- issue: इस प्रसंग में הַמַּלְאָךְ की पहचान
  choice: स्वर्गदूत
  alternative: दूत; व्यापक प्रसंग के आधार पर ‘यहोवा का दूत’ या ईश्वर-प्रकटन समझना
  rationale: इस पद में केवल निश्चित रूप ‘स्वर्गदूत’ है; मुख्य पाठ इससे अधिक विशिष्ट पहचान आरोपित नहीं करता। पादटिप्पणी शाब्दिक विकल्प खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किन्तु गरिमापूर्ण शैली रखी गई है। ‘वस्त्र’ दर्शन और याजकीय प्रसंग के अनुरूप है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सरल रखा गया है।
