base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/002.yaml
  text: And Yahweh said to the Accuser[a], “Yahweh rebuke you, O Accuser! Indeed, Yahweh, who has chosen Jerusalem[b], rebuke you! Is not this a brand snatched from the fire?”
translation:
  language: hi
  text: और यहोवा ने दोष लगानेवाले[a] से कहा, “हे दोष लगानेवाले, यहोवा तुझे डाँटे! हाँ, यरूशलेम को चुननेवाला यहोवा तुझे डाँटे! क्या यह आग में से निकाला हुआ जलता हुआ लकड़ी का टुकड़ा नहीं है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परंपरागत अनुवाद: “शैतान।” इब्रानी में निश्चित उपपद के साथ भूमिका-सूचक शब्द है, जिसका अर्थ “दोष लगानेवाला” या “विरोधी” हो सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: הַשָּׂטָן
  choice: दोष लगानेवाला
  rationale: संज्ञा के साथ निश्चित उपपद है और दर्शन का प्रसंग न्यायालय-सदृश है; इसलिए इसे सीधे व्यक्तिवाचक नाम बनाने के बजाय आरोप लगाने की भूमिका बताने वाली उपाधि के रूप में रखा गया है।
- source_word: יִגְעַר
  choice: डाँटे
  rationale: यह क्रिया अधिकारपूर्ण और कठोर फटकार को व्यक्त करती है। ‘डाँटे’ सीधा, स्वाभाविक और भविष्यत्/इच्छार्थक कथन ‘यहोवा तुझे डाँटे’ के अनुकूल है।
- source_word: הַבֹּחֵר בִּירוּשָׁלִָם
  choice: यरूशलेम को चुननेवाला
  rationale: साभिप्राय कृदन्त को यथासंभव बनाए रखा गया है; यह यहोवा की पहचान उसके यरूशलेम को चुनने के कार्य से कराता है, बिना कालगत अर्थ को अनावश्यक रूप से निश्चित किए।
- source_word: הֲלוֹא
  choice: क्या ... नहीं है?
  rationale: यह रचना सहमति की अपेक्षा रखने वाले आलंकारिक प्रश्न का स्वाभाविक हिन्दी रूप है।
- source_word: אוּד
  choice: जलती लकड़ी
  rationale: यह शब्द आग में जल रहे या सुलग रहे लकड़ी के टुकड़े को दर्शाता है। ‘जलती लकड़ी’ सामान्य पाठक के लिए स्पष्ट है और अग्नि से ऐन समय पर बचाए जाने का बिंब बनाए रखता है।
- source_word: מֻצָּל מֵאֵשׁ
  choice: आग में से निकाली गई
  rationale: निष्क्रिय कृदन्त का मूल भाव छुड़ाए या बचाकर बाहर निकाले जाने का है। यह रूप दृश्य की सजीवता को सुरक्षित रखता है और कर्ता को वहाँ स्पष्ट नहीं करता जहाँ हिब्रू भी उसे स्पष्ट नहीं करता।
theological_decisions:
- issue: הַשָּׂטָן को व्यक्तिवाचक नाम माना जाए या भूमिका-सूचक उपाधि
  choice: मुख्य पाठ में ‘दोष लगानेवाला’
  alternative: ‘शैतान’ या ‘विरोधी’
  rationale: निश्चित उपपद और आरोप के दर्शनात्मक प्रसंग के कारण भूमिका-सूचक अर्थ मुख्य पाठ में रखा गया है। परंपरागत ‘शैतान’ को पाठकीय परिचय और संभावित नामपरक समझ के कारण पादटिप्पणी में दिया गया है।
- issue: यहोवा द्वारा ‘यहोवा तुझे डाँटे’ कहने की पुनरुक्ति
  choice: दोनों कथनों और तीसरे पुरुष में ईश्वरीय नाम को ज्यों का त्यों रखा गया है
  alternative: दोनों वाक्यांशों को मिलाकर एक फटकार बना देना या सर्वनाम से सरल करना
  rationale: हिब्रू की पुनरुक्ति में न्यायिक और अलंकारिक बल है। उसे सरल बनाना पाठ की वास्तविक तनावपूर्ण अभिव्यक्ति को घटा देता।
- issue: הַבֹּחֵר के कालगत अर्थ का निर्धारण
  choice: ‘यरूशलेम को चुननेवाला’
  alternative: ‘जिसने यरूशलेम को चुना है’
  rationale: हिब्रू कृदन्त वर्तमान, चरित्रसूचक या स्थापित चुनाव का संकेत दे सकता है। कृदन्तीय हिन्दी रूप इस अस्पष्टता को अनावश्यक रूप से पूर्णकाल में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। मूल की पुनरुक्ति, आलंकारिक प्रश्न और न्यायालय-सदृश वातावरण सुरक्षित हैं। ‘हे’ संबोधन फटकार की प्रत्यक्षता और गम्भीरता बनाए रखता है।
