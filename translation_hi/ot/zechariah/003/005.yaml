base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/005.yaml
  text: Then I said[a], “Let them put a clean turban on his head.” So they put the clean turban on his head and clothed him with garments[c][b], while the angel of Yahweh was standing by.
translation:
  language: hi
  text: तब मैंने कहा[a], “वे उसके सिर पर एक शुद्ध पगड़ी रखें।” इसलिए उन्होंने उसके सिर पर वह शुद्ध[b] पगड़ी रखी और उसे वस्त्र पहनाए; और याहवे का दूत[c] खड़ा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मैंने कहा।” इब्रानी संयोजक का अनुवाद केवल “और” भी किया जा सकता है; “तब” कथानक की प्रगति दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: “शुद्ध” का अनुवाद “साफ़” भी हो सकता है; यहाँ “शुद्ध” अनुष्ठानिक शुद्धता के भाव को अधिक स्पष्ट करता है।
    reason: lexical_alternative
  - marker: c
    text: “याहवे का दूत” पद यह निश्चित नहीं करता कि यह कोई सृजित स्वर्गदूत है या याहवे का कोई प्रकटन; इस पद का अनुवाद उस प्रश्न का निर्णय किए बिना किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: तब मैंने कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है। ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम दिखाता है, जबकि प्रथम पुरुष को यथावत रखता है।
- source_word: יָשִׂימוּ
  choice: वे ... रखें
  rationale: तीसरे पुरुष बहुवचन का जुस्सिव रूप इच्छा या अनुरोध व्यक्त करता है; ‘वे ... रखें’ अनिर्दिष्ट बहुवचन कर्ता और भाव दोनों को बनाए रखता है।
- source_word: צָנִיף
  choice: पगड़ी
  rationale: यह शब्द सिर पर लपेटे जाने वाले आवरण को दर्शाता है। याजकीय प्रसंग में ‘पगड़ी’ संक्षिप्त, स्पष्ट और स्वाभाविक है।
- source_word: טָהוֹר
  choice: शुद्ध
  rationale: इस प्रसंग में यह केवल बाहरी सफ़ाई नहीं, अनुष्ठानिक शुद्धता का भाव भी रखता है; इसलिए ‘शुद्ध’ उपयुक्त है।
- source_word: עַל רֹאשׁוֹ
  choice: उसके सिर पर
  rationale: मूल स्थानवाचक वाक्यांश का सीधा और स्वाभाविक अनुवाद।
- source_word: וַיָּשִׂימוּ
  choice: इसलिए उन्होंने ... रखी
  rationale: कथात्मक वाव पिछले अनुरोध के बाद हुई कार्रवाई को आगे बढ़ाता है; ‘इसलिए’ हिन्दी में परिणाम-संबंध को सहज बनाता है।
- source_word: הַצָּנִיף הַטָּהוֹר
  choice: वह शुद्ध पगड़ी
  rationale: निश्चित पद और पहले खंड की जानबूझकर की गई पुनरावृत्ति दोनों सुरक्षित रखे गए हैं।
- source_word: וַיַּלְבִּשֻׁהוּ בְּגָדִים
  choice: उसे वस्त्र पहनाए
  rationale: हिफ़िल क्रिया किसी को कपड़े पहनाने का अर्थ देती है। यह हिन्दी में स्वाभाविक है और मूल के व्यापक ‘वस्त्र’ को बनाए रखता है।
- source_word: בְּגָדִים
  choice: वस्त्र
  rationale: ‘वस्त्र’ गरिमापूर्ण और व्यापक है; ‘याजकीय पोशाक’ कहना मूल संज्ञा से अधिक विशिष्ट होता।
- source_word: וּמַלְאַךְ יְהוָה
  choice: उस समय याहवे का दूत
  rationale: संयोजक को परिस्थितिवाचक रूप में समझकर समकालिक स्थिति व्यक्त की गई है। מַלְאַךְ का मूल अर्थ ‘दूत’ है, और याहवे का व्यक्तिगत नाम लिप्यंतरित किया गया है।
- source_word: עֹמֵד
  choice: पास खड़ा था
  rationale: कृदंत जारी अवस्था को दर्शाता है। ‘खड़ा था’ उसका कालगत भाव रखता है और ‘पास’ दृश्य में उपस्थित रहने का प्रसंगगत भाव देता है।
theological_decisions:
- issue: מַלְאַךְ יְהוָה की पहचान
  choice: ‘याहवे का दूत’ के रूप में सीधा अनुवाद
  alternative: इसे स्पष्ट रूप से सृजित स्वर्गदूत अथवा याहवे के ईश्वर-प्रकटन के रूप में पहचानना
  rationale: इब्रानी पद स्वयं इस विवादित पहचान का निर्णय नहीं करता। सीधा अनुवाद दोनों व्याख्यात्मक संभावनाओं को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली अपनाई गई है। ‘पगड़ी,’ ‘वस्त्र,’ और ‘याहवे का दूत’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि याजकीय प्रसंग और मूल की धर्मवैचारिक अस्पष्टता सुरक्षित रहती है।
