lexical_decisions:
- source_word: וַיָּעַד
  choice: तब … गंभीरतापूर्वक चेताते हुए
  rationale: वाव-क्रम कथा की अगली घटना को दिखाता है, इसलिए ‘तब’ रखा गया है। क्रिया יעד यहाँ औपचारिक और गंभीर चेतावनी या आग्रह का भाव रखती है; ‘गंभीरतापूर्वक चेताते हुए’ उस भार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַלְאַךְ יְהוָה
  choice: याहवे के दूत
  rationale: מַלְאַךְ का अर्थ ‘दूत’ या संदर्भानुसार ‘स्वर्गदूत’ हो सकता है। हिन्दी का ‘दूत’ मूल की व्यापकता बनाए रखता है और दर्शन के संदर्भ में दिव्य दूत के अर्थ में स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिवाचक वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में ‘याहवे’ लिखा गया है।
- source_word: בִּיהוֹשֻׁעַ
  choice: यहोशू को
  rationale: יעד के साथ ב उस व्यक्ति को सूचित करता है जिसे गंभीर चेतावनी या निर्देश दिया गया; हिन्दी में कर्म-चिह्न ‘को’ इसका स्वाभाविक रूप है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह आगे आने वाले प्रत्यक्ष कथन का परिचय देने वाला सामान्य इब्रानी सूत्र है; हिन्दी में ‘कहा’ इसे सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: मַלְאַךְ की पहचान
  choice: दूत
  alternative: स्वर्गदूत
  rationale: ‘दूत’ मूल शब्द की शाब्दिक व्यापकता और दर्शन-संदर्भ दोनों को बनाए रखता है; ‘स्वर्गदूत’ दिव्य पहचान को अधिक स्पष्ट करता, पर मूल की शब्दगत अस्पष्टता को कुछ घटा देता।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल में व्यक्तिवाचक चतुरक्षरीय ईश्वरीय नाम है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है, जबकि ‘प्रभु’ उसे एक उपाधि के रूप में प्रस्तुत करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य के अंत में अल्पविराम इसलिए है कि ‘कहा’ से आरम्भ होने वाला कथन अगले पद में जारी रहता है।
