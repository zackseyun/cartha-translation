  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּרְאֵ֗/נִי אֶת יְהוֹשֻׁ֨עַ֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל עֹמֵ֕ד לִ/פְנֵ֖י מַלְאַ֣ךְ יְהוָ֑ה וְ/הַ/שָּׂטָ֛ן עֹמֵ֥ד עַל יְמִינ֖/וֹ לְ/שִׂטְנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/001.yaml
  text: Then he showed me Joshua the high priest standing before the angel of Yahweh[a], and the Accuser standing at his right hand to accuse him.
translation:
  language: hi
  text: फिर उसने मुझे महायाजक यहोशू को याहवे के दूत के सामने खड़े हुए दिखाया, और आरोप लगानेवाला[a] उस पर आरोप लगाने के लिए उसके दाहिने हाथ पर खड़ा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शैतान उसके दाहिने हाथ पर खड़ा था, ताकि उसका विरोध करे।” हिब्रू में “हा-सातान” है, जिसका अर्थ “आरोप लगानेवाला” या “विरोधी” हो सकता है; यहाँ यह नाम के बजाय पदवी या भूमिका को सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְאֵנִי
  choice: फिर उसने मुझे … दिखाया
  rationale: हिफ़ील रूप का अर्थ ‘मुझे दिखाया’ है; आरंभिक वाव को स्वाभाविक कथा-क्रम के लिए ‘फिर’ से व्यक्त किया गया है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: हिब्रू नाम का प्रचलित और स्रोत-रूप के निकट हिन्दी रूप।
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: महायाजक
  rationale: इस्राएल के प्रधान याजकीय पद के लिए मानक, संक्षिप्त हिन्दी पद।
- source_word: לִפְנֵי מַלְאַךְ יְהוָה
  choice: यहवे के दूत के सामने
  rationale: ‘सामने’ स्थानगत तथा न्यायिक दोनों संकेत बनाए रखता है; מַלְאָךְ को इस दर्शन में ‘दूत’ कहना हिन्दी बाइबलीय शैली में स्वाभाविक है, और יְהוָה को व्यक्तिगत नाम ‘यहवे’ से व्यक्त किया गया है।
- source_word: הַשָּׂטָן
  choice: दोष लगानेवाला
  rationale: संज्ञा के साथ निश्चित उपपद और न्यायिक प्रसंग इसे पदवी/भूमिका के रूप में समझने का समर्थन करते हैं; यह उसी धातु से बने अगले क्रियारूप से संबंध भी बनाए रखता है।
- source_word: עַל יְמִינוֹ
  choice: उसके दाहिने
  rationale: हिब्रू मुहावरे को सहज हिन्दी में व्यक्त करते हुए अभियोग लगाने की न्यायिक स्थिति का संकेत सुरक्षित रखा गया है।
- source_word: לְשִׂטְנוֹ
  choice: उस पर दोष लगाने के लिए
  rationale: प्रसंग न्यायिक है, इसलिए धातु שׂטן का अर्थ यहाँ स्पष्टतः अभियोग या दोष लगाना है।
theological_decisions:
- issue: הַשָּׂטָן को व्यक्तिवाचक नाम माना जाए या भूमिका-सूचक पदवी
  choice: दोष लगानेवाला
  alternative: शैतान; विरोधी
  rationale: हिब्रू में निश्चित उपपद और साथ आया לְשִׂטְנוֹ न्यायालय-जैसे दृश्य में भूमिका-सूचक अर्थ को प्रमुख बनाते हैं। मुख्य पाठ उस अर्थ को सुरक्षित रखता है, जबकि परिचित ‘शैतान’ और व्यापक ‘विरोधी’ अर्थ को पादटिप्पणी में रखा गया है ताकि पहचान को अनावश्यक रूप से निश्चित न किया जाए।
- issue: दाहिने खड़े व्यक्ति का संबंधसूचक सर्वनाम किसके लिए है
  choice: ‘उसके’ को मूल पाठ की तरह अनिर्दिष्ट रखा गया है
  alternative: स्पष्ट करके ‘यहोशू के दाहिने’ या ‘दूत के दाहिने’
  rationale: निकट प्रसंग न्यायिक रूप से यहोशू के दाहिने होने का समर्थन करता है, पर हिब्रू सर्वनाम स्वयं नाम दोहराकर संदर्भ स्पष्ट नहीं करता; इसलिए अनुवाद वास्तविक अस्पष्टता नहीं मिटाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘महायाजक’ और ‘यहवे के दूत’ जैसे स्थापित बाइबलीय पद रखे गए हैं। ‘दोष लगानेवाला … दोष लगाने’ की पुनरावृत्ति जानबूझकर है, क्योंकि मूल में संज्ञा और क्रिया एक ही हिब्रू धातु से हैं।
