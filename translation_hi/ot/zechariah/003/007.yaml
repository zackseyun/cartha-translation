source:
  edition: WLC
  text: כֹּה אָמַ֞ר יְהוָ֣ה צְבָא֗וֹת אִם בִּ/דְרָכַ֤/י תֵּלֵךְ֙ וְ/אִ֣ם אֶת מִשְׁמַרְתִּ֣/י תִשְׁמֹ֔ר וְ/גַם אַתָּה֙ תָּדִ֣ין אֶת בֵּיתִ֔/י וְ/גַ֖ם תִּשְׁמֹ֣ר אֶת חֲצֵרָ֑/י וְ/נָתַתִּ֤י לְ/ךָ֙ מַהְלְכִ֔ים בֵּ֥ין הָ/עֹמְדִ֖ים הָ/אֵֽלֶּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/007.yaml
  text: 'Thus says Yahweh of hosts: If you walk in my ways and if you keep my charge[a], then you also shall govern my house and also keep my courts, and I will give you free access among these who are standing here.'
translation:
  language: hi
  text: 'सेनाओं का याहवे यों कहता है: “यदि तू मेरे मार्गों पर चले और मेरे सौंपे हुए दायित्व का पालन करे, तो तू मेरे घर का प्रबन्ध भी करेगा और मेरे प्रांगणों की देखरेख भी करेगा; और मैं तुझे इन खड़े हुओं के बीच आने-जाने का अधिकार दूँगा।[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुझे इन खड़े हुओं के बीच स्वतंत्र रूप से आने-जाने दूँगा।” इब्रानी का अर्थ “इन खड़े हुओं के बीच चलने वाले जन” या “इन खड़े हुओं के बीच चलने के स्थान” भी हो सकता है।
    reason: दुर्लभ और विवादित इब्रानी शब्द מַהְלְכִים के वैकल्पिक अर्थ सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को ‘याहवे’ के रूप में रखा गया है और צְבָאוֹת का व्यापक सैन्य/स्वर्गीय भाव ‘सेनाओं’ से सुरक्षित रहता है।
- source_word: בִּדְרָכַי תֵּלֵךְ
  choice: तू मेरे मार्गों पर चले
  rationale: चलने के इब्रानी रूपक और उसके नैतिक-वाचागत अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מִשְׁמַרְתִּי תִשְׁמֹר
  choice: मेरी सौंपी हुई ज़िम्मेदारी निभाए
  rationale: याजकीय प्रसंग में यह केवल किसी सामान्य आज्ञा को मानना नहीं, बल्कि सौंपे गए दायित्व को सावधानी से पूरा करना दर्शाता है।
- source_word: תָּדִין אֶת־בֵּיתִי
  choice: मेरे भवन का प्रबन्ध भी करेगा
  rationale: דין यहाँ न्याय करने तक सीमित न होकर प्रशासन और देखरेख का भाव रख सकता है; ‘प्रबन्ध’ मंदिर-संबंधी प्रसंग में यही व्यापक अर्थ देता है।
- source_word: תִשְׁמֹר אֶת־חֲצֵרָי
  choice: मेरे आँगनों की रखवाली भी करेगा
  rationale: मंदिर के प्रांगणों की याजकीय देखरेख और सुरक्षा का भाव स्पष्ट करता है।
- source_word: מַהְלְכִים
  choice: आने-जाने का अधिकार
  rationale: दुर्लभ और विवादित शब्द को यहाँ प्राप्त प्रवेश अथवा निर्बाध आवागमन के सम्भावित अर्थ में प्रस्तुत किया गया है, जबकि अन्य सम्भव अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: בֵּין הָעֹמְדִים הָאֵלֶּה
  choice: इन लोगों के बीच, जो यहाँ खड़े हैं
  rationale: दृश्य में उपस्थित जनों को बिना मुख्य पाठ में स्पष्टतः स्वर्गदूत ठहराए, इब्रानी संकेतवाचक और कृदन्त का स्वाभाविक हिन्दी रूप देता है।
- source_word: וְגַם ... וְגַם
  choice: भी ... भी
  rationale: दोनों प्रतिज्ञाबद्ध दायित्वों में इब्रानी की बलयुक्त जोड़ने वाली समानान्तर रचना सुरक्षित रखी गई है।
theological_decisions:
- issue: וְנָתַתִּי לְךָ מַהְלְכִים בֵּין הָעֹמְדִים הָאֵלֶּה में दी गई प्रतिज्ञा का अर्थ
  choice: यहाँ खड़े जनों के बीच आने-जाने का प्रदान किया गया अधिकार
  alternative: इन खड़े हुओं के बीच चलने वाले जन देना; अथवा उनके बीच चलने के स्थान देना
  rationale: तात्कालिक दर्शन-संदर्भ में यह परमेश्वर की उपस्थिति में खड़े स्वर्गीय सेवकों के बीच विशेष प्रवेश या आवागमन का संकेत सम्भवतः देता है। फिर भी מַהְלְכִים दुर्लभ और व्याकरणतः विवादित है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखे गए हैं और मुख्य पाठ उन्हें निर्णायक रूप से समाप्त नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। याहवे यहोशू से सीधे बोल रहा है, इसलिए एकवचन ‘तू’ रखा गया है; यह आधुनिक औपचारिक बोलचाल से अधिक शास्त्रीय गरिमा देता है। ‘भवन’ और ‘आँगन’ मंदिर-संदर्भ को व्यक्त करते हैं, पर मूल पाठ से अधिक व्याख्या नहीं जोड़ते।
