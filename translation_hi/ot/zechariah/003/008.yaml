id: ZEC.3.8
reference: Zechariah 3:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שְֽׁמַֽע נָ֞א יְהוֹשֻׁ֣עַ הַ/כֹּהֵ֣ן הַ/גָּד֗וֹל אַתָּה֙ וְ/רֵעֶ֨י/ךָ֙ הַ/יֹּשְׁבִ֣ים לְ/פָנֶ֔י/ךָ כִּֽי אַנְשֵׁ֥י מוֹפֵ֖ת הֵ֑מָּה כִּֽי הִנְ/נִ֥י מֵבִ֛יא אֶת עַבְדִּ֖/י צֶֽמַח־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/008.yaml
  text: Hear now[a], Joshua the high priest, you and your companions who sit before you, for they are men of a sign; for behold, I am bringing my servant, the Branch.
translation:
  language: hi
  text: “अब सुनो, हे महायाजक यहोशू—तुम और तुम्हारे साथी, जो तुम्हारे सामने बैठे हैं; क्योंकि ये लोग एक चिन्ह हैं[a]। क्योंकि देखो, मैं अपने सेवक, ‘अंकुर’ को ला रहा हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ये चिन्हस्वरूप लोग हैं”; अथवा, “ये किसी आने वाली बात के सूचक हैं।”
    reason: מוֹפֵת का अर्थ ‘चिन्ह,’ ‘प्रतीक,’ ‘अद्भुत संकेत’ या भावी घटना का ‘सूचक’ हो सकता है; इब्रानी वाक्यांश संक्षिप्त और अर्थगर्भित है।
lexical_decisions:
- source_word: שְׁמַע נָא
  choice: अब सुनो
  rationale: आज्ञार्थक क्रिया के साथ נָא आग्रह और तात्कालिकता जोड़ता है। ‘अब सुनो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए सीधे और गंभीर आह्वान को बनाए रखता है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: इब्रानी नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: महायाजक
  rationale: प्रधान याजकीय पद के लिए स्थापित, संक्षिप्त और स्वाभाविक हिन्दी पद।
- source_word: וְרֵעֶיךָ
  choice: तुम्हारे साथी
  rationale: רֵעַ यहाँ घनिष्ठ मित्रों के बजाय यहोशू से संबद्ध साथियों या सहकर्मियों को सूचित कर सकता है; ‘साथी’ इस व्यापकता को सुरक्षित रखता है।
- source_word: הַיֹּשְׁבִים לְפָנֶיךָ
  choice: जो तुम्हारे सामने बैठे हैं
  rationale: प्रत्यक्ष स्थान और यहोशू की उपस्थिति में बैठे होने—दोनों संभावनाओं को सहज हिन्दी में बनाए रखता है।
- source_word: אַנְשֵׁי מוֹפֵת
  choice: ये लोग एक चिन्ह हैं
  rationale: इब्रानी रचना का अर्थ है कि ये व्यक्ति चिन्ह, प्रतीक अथवा शकुन-सदृश संकेत का कार्य करते हैं। ‘एक चिन्ह हैं’ सामूहिक संकेत की एकवचन संज्ञा को सुरक्षित रखता है; वैकल्पिक अर्थ फुटनोट में दिए गए हैं।
- source_word: הִנְנִי
  choice: देखो
  rationale: गंभीर दैवी घोषणा की ओर ध्यान खींचने वाला स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: מֵבִיא
  choice: मैं ... ला रहा हूँ
  rationale: הִנְנִי के साथ कृदंत आसन्न और निश्चित कार्य को जीवंत वर्तमान रूप में व्यक्त करता है।
- source_word: עַבְדִּי
  choice: अपने सेवक
  rationale: עבד के इस भविष्यद्वाणी-संबंधी संदर्भ में नियुक्त सेवा का भाव प्रमुख है; ‘सेवक’ उपयुक्त और स्थापित हिन्दी रूप है।
- source_word: צֶמַח
  choice: ‘अंकुर’
  rationale: צֶמַח का मूल चित्र उगने वाले अंकुर का है और यहाँ यह आने वाले व्यक्ति की उपाधि-सदृश संज्ञा है। उद्धरण-चिह्न उपाधिगत प्रयोग का संकेत देते हैं, बिना व्याख्या को मूल पाठ में बढ़ाए।
theological_decisions:
- issue: צֶמַח को उपाधि माना जाए या सामान्य संज्ञा
  choice: उपाधि-सदृश ‘अंकुर’
  alternative: शाखा; एक अंकुर
  rationale: जकर्याह 6:12 और यिर्मयाह 23:5 की पृष्ठभूमि में यह आने वाले दाऊदी शासक के लिए उपाधिगत प्रयोग है। ‘अंकुर’ मूल वनस्पतिक रूपक को रखता है, जबकि उद्धरण-चिह्न उसके विशेष नाम-सदृश प्रयोग को दर्शाते हैं।
- issue: אַנְשֵׁי מוֹפֵת की प्रतीकात्मकता कितनी स्पष्ट की जाए
  choice: ये लोग एक चिन्ह हैं
  alternative: ये चिन्हस्वरूप लोग हैं; ये शकुन के पुरुष हैं
  rationale: मुख्य पाठ व्यक्तियों को संकेतक या प्रतीकात्मक ठहराता है, पर चिन्ह की ठीक प्रकृति नहीं बताता। फुटनोट उस वास्तविक अर्थ-व्याप्ति को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘हे’ केवल सीधे संबोधन को स्पष्ट करने के लिए है। भविष्यद्वाणी की गंभीरता बनाए रखते हुए अत्यधिक पुरातन शब्दावली से बचा गया है।
