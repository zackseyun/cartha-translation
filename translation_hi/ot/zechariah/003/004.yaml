source:
  edition: WLC
  text: וַ/יַּ֣עַן וַ/יֹּ֗אמֶר אֶל הָ/עֹמְדִ֤ים לְ/פָנָי/ו֙ לֵ/אמֹ֔ר הָסִ֛ירוּ הַ/בְּגָדִ֥ים הַ/צֹּאִ֖ים מֵ/עָלָ֑י/ו וַ/יֹּ֣אמֶר אֵלָ֗י/ו רְאֵ֨ה הֶעֱבַ֤רְתִּי מֵ/עָלֶ֨י/ךָ֙ עֲוֺנֶ֔/ךָ וְ/הַלְבֵּ֥שׁ אֹתְ/ךָ֖ מַחֲלָצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/004.yaml
  text: And he answered and said to those standing before him[a], “Remove the filthy garments from upon him.” Then he said to him, “See, I have taken your iniquity away from upon you[b], and I will clothe you with fine garments.”
translation:
  language: hi
  text: तब उसने उत्तर देकर अपने सामने खड़े लोगों[a] से कहा, “इसके मैले वस्त्र उतार दो।” फिर उसने उससे कहा, “देख, मैंने तेरा अधर्म तुझ पर से दूर कर दिया है और मैं तुझे शानदार वस्त्र[b] पहनाऊँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संदर्भ में ये संभवतः स्वर्गीय सेवक हैं, पर इब्रानी में केवल “उसके सामने खड़े लोग” कहा गया है।
    reason: alternative_reading
  - marker: b
    text: या “भव्य वस्त्र” अथवा “उत्सव के वस्त्र।” इब्रानी शब्द उत्तम और गरिमापूर्ण पहनावे का बोध कराता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: तब उसने उत्तर देकर…कहा
  rationale: दोनों इब्रानी क्रियाओं के उत्तर देने और कहने के भाव को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक वाक्य बनाया गया है।
- source_word: הָעֹמְדִים לְפָנָיו
  choice: अपने सामने खड़े लोगों
  rationale: मूल पाठ का वर्णनात्मक रूप रखा गया है; संदर्भ से ये स्वर्गीय सेवक हो सकते हैं, पर अनुवाद में उनकी पहचान निश्चित नहीं की गई।
- source_word: הַבְּגָדִים הַצֹּאִים
  choice: मैले वस्त्र
  rationale: यह पद घोर अशुद्धता से सने कपड़ों का बोध कराता है। ‘मैले वस्त्र’ हिन्दी में स्पष्ट, सजीव और प्रतीकात्मक संदर्भ के अनुकूल है।
- source_word: הֶעֱבַרְתִּי מֵעָלֶיךָ עֲוֹנֶךָ
  choice: मैंने तेरा अधर्म तुझ पर से दूर कर दिया है
  rationale: हिफ़ील क्रिया के हटाने के भाव और מֵעָלֶיךָ की स्थानात्मक छवि दोनों को रखा गया है। עָוֹן के लिए ‘अधर्म’ नैतिक भार बनाए रखता है, यद्यपि इसमें दोष का भाव भी हो सकता है।
- source_word: מַחֲלָצוֹת
  choice: शानदार वस्त्र
  rationale: यह दुर्लभ संज्ञा उत्तम, भव्य या गरिमापूर्ण पहनावे को सूचित करती है। ‘शानदार वस्त्र’ केवल स्वच्छता जोड़ने के बजाय उस गरिमा को व्यक्त करता है।
- source_word: וְהַלְבֵּשׁ אֹתְךָ
  choice: और मैं तुझे…पहनाऊँगा
  rationale: वक्ता के आश्वासन की निरंतरता को हिन्दी में स्पष्ट और स्वाभाविक भविष्यकाल से व्यक्त किया गया है।
theological_decisions:
- issue: वस्त्र बदलने का प्रतीकात्मक अर्थ
  choice: मैले वस्त्रों को उतारने और अधर्म को दूर करने के बीच मूल पाठ में दिए संबंध को ज्यों का त्यों रखा गया है।
  alternative: इसे सीधे धर्मी ठहराए जाने या याजकीय पद पर पुनःस्थापना की व्याख्या के रूप में अनूदित करना।
  rationale: पद स्वयं प्रभावशाली प्रतीक देता है, लेकिन उसे बाद की किसी व्यवस्थित धर्मशास्त्रीय श्रेणी में स्पष्ट रूप से परिभाषित नहीं करता।
- issue: सामने खड़े लोगों की पहचान
  choice: वर्णनात्मक पद ‘अपने सामने खड़े लोगों’ रखा गया है।
  alternative: ‘स्वर्गदूतों’ या ‘उसके सेवकों’ के रूप में पहचान निश्चित करना।
  rationale: दर्शन का संदर्भ स्वर्गीय सेवकों की ओर संकेत करता है, पर इब्रानी पद स्वयं केवल उनके खड़े होने का वर्णन करता है।
- issue: עָוֹן का अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘अधर्म’ चुना गया है।
  alternative: ‘दोष’ या ‘पाप’।
  rationale: यहाँ नैतिक विकृति और उससे उत्पन्न दोष दोनों की छाया संभव है; ‘अधर्म’ प्रमुख नैतिक भाव को बनाए रखता है, बिना प्रतीक को विस्तार देकर समझाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। सर्वनामों की पुनरावृत्ति मूल पाठ की दृश्यात्मकता और कुछ हद तक उसकी संदर्भ-निर्भरता बनाए रखती है; ‘यहोशू’ नाम वहाँ नहीं जोड़ा गया जहाँ इब्रानी में केवल ‘उससे/इसके’ है।
