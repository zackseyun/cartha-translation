  text: And I lifted up my eyes and saw[a], and behold, four horns.
translation:
  language: hi
  text: मैंने अपनी आँखें उठाईं और देखा, और देखो, चार सींग![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चार शक्तियाँ।” इब्रानी में शब्द “सींग” है, जो बाइबल में सामर्थ्य या शासक शक्ति का सामान्य बिंब है; मुख्य पाठ में शाब्दिक बिंब रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשָּׂא אֶת־עֵינַי
  choice: मैंने आँखें उठाकर
  rationale: यह इब्रानी मुहावरा दृष्टि किसी ओर करने को व्यक्त करता है। हिन्दी का ‘आँखें उठाकर’ मूल चित्र को स्वाभाविक रूप से बनाए रखता है।
- source_word: וָאֵרֶא
  choice: देखा
  rationale: वाव-क्रमिक कथन को ‘तब ... देखा’ के द्वारा सहज हिन्दी कथात्मक क्रम में व्यक्त किया गया है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह दर्शन में अचानक दिखाई पड़ी वस्तु की ओर ध्यान खींचता है; ‘देखो’ उसकी जीवंत और संकेतात्मक शक्ति बनाए रखता है।
- source_word: אַרְבַּע
  choice: चार
  rationale: मूल संख्या का सीधा अनुवाद।
- source_word: קְרָנוֹת
  choice: सींग
  rationale: भविष्यद्वाणी के दर्शन में प्रयुक्त मूल प्रतीक को बनाए रखा गया है; ‘शक्तियाँ’ कहने से प्रतीक का अर्थ समय से पहले निर्धारित हो जाता।
theological_decisions:
- issue: दर्शन में चार सींगों का प्रतीकात्मक अर्थ
  choice: मुख्य पाठ में शाब्दिक चित्र ‘चार सींग’ रखा गया है।
  alternative: चार शक्तियाँ
  rationale: यह पद प्रतीक का परिचय देता है और आगे का प्रसंग उसका अर्थ स्पष्ट करता है। यहाँ व्याख्यात्मक शब्द रखने से भविष्यद्वाणी के चित्र और उसकी वास्तविक अर्थगत खुलावट को अनावश्यक रूप से सीमित किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण भविष्यद्वाणी-दर्शनीय शैली। ‘और देखो’ मूल के ध्यानाकर्षक स्वर को रखता है, जबकि ‘सींग’ प्रतीकात्मक अस्पष्टता को सुरक्षित रखता है।
