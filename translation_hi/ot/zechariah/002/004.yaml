base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/004.yaml
  text: Then I said[a], “What are these coming to do?” And he said, “These are the horns that scattered Judah, so that no one lifted up his head; and these have come to terrify them[c][b], to cast down the horns of the nations that lifted up a horn against the land of Judah to scatter her.”
translation:
  language: hi
  text: तब मैंने पूछा, “ये क्या करने आ रहे हैं?” उसने उत्तर दिया, “ये वे सींग[b] हैं जिन्होंने यहूदा को तितर-बितर कर दिया, यहाँ तक कि किसी ने अपना सिर नहीं उठाया[a]। और ये उन सींगों को दहला देने और उन राष्ट्रों के सींगों को गिरा देने[c] आए हैं, जिन्होंने यहूदा देश को तितर-बितर करने के लिए उसके विरुद्ध सींग उठाया था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में, “मनुष्य के मुँह के अनुसार, उसने अपना सिर नहीं उठाया।” यह अपमान या असहायता बताने वाला मुहावरा है; अर्थ यह भी हो सकता है, “कोई अपना सिर उठा नहीं सका।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “सींग” शक्ति या आक्रामक सामर्थ्य के प्रतीक हैं; मुख्य पाठ में प्रतीक की व्याख्या करने के बजाय मूल छवि रखी गई है।
    reason: cultural_note
  - marker: c
    text: या, “उखाड़ फेंकने।” इस दुर्लभ हिब्रू क्रिया का सटीक आशय अनिश्चित है, पर संदर्भ में शत्रु सींगों को नीचे करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קְּרָנוֹת / קֶרֶן
  choice: सींग / सींग उठाया
  rationale: भविष्यद्वाणी के दर्शन में शक्ति और आक्रामकता के प्रतीकात्मक चित्र को बनाए रखने के लिए शाब्दिक रूप रखा गया है; इसे ‘शक्तियाँ’ या ‘राज्य’ कहकर व्याख्यायित नहीं किया गया।
- source_word: זֵרוּ / לְזָרוֹתָהּ
  choice: तितर-बितर कर दिया / तितर-बितर करने के लिए
  rationale: क्रिया बिखेरने या छिन्न-भिन्न करने का भाव देती है। ‘तितर-बितर करना’ निर्वासन और विनाश—दोनों की छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כְּפִי אִישׁ לֹא נָשָׂא רֹאשׁוֹ
  choice: यहाँ तक कि किसी ने अपना सिर नहीं उठाया
  rationale: यह अपमान और असहायता व्यक्त करने वाला मुहावरा है। हिन्दी में ‘किसी ने’ प्रतिनिधिक אִישׁ का स्वाभाविक अर्थ देता है और सिर उठाने की मूल छवि भी बनाए रखता है।
- source_word: לְהַחֲרִיד
  choice: दहला देने
  rationale: यह क्रिया भय से काँपने या आतंकित होने का प्रबल भाव देती है; ‘दहला देना’ आधुनिक हिन्दी में उसी तीव्रता को व्यक्त करता है।
- source_word: לְיַדּוֹת
  choice: गिरा देने
  rationale: यह दुर्लभ क्रिया संदर्भ में शत्रु राष्ट्रों के सींगों को नीचे गिराने या उखाड़ फेंकने का संकेत देती है। ‘गिरा देने’ से अर्थ स्पष्ट रहता है और सींगों की दृश्यात्मक उपमा बनी रहती है।
- source_word: הַגּוֹיִם
  choice: राष्ट्रों
  rationale: यहाँ आशय यहूदा के विरुद्ध खड़ी विदेशी राष्ट्रीय शक्तियों से है; ‘राष्ट्रों’ संदर्भानुकूल और सामान्य आधुनिक हिन्दी है।
- source_word: הַנֹּשְׂאִים קֶרֶן
  choice: सींग उठाया था
  rationale: शक्ति, अभिमान और आक्रमण के हिब्रू मुहावरे को उसके मूल प्रतीक सहित रखा गया है।
- source_word: אֵלֶּה בָאִים לַעֲשׂוֹת / וַיָּבֹאוּ אֵלֶּה
  choice: ये क्या करने आ रहे हैं? / ये … आए हैं
  rationale: पहला वाक्य दर्शन में दिखाई दे रही वर्तमान गति को और दूसरा उनके आगमन तथा उद्देश्य को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: सींगों की प्रतीकात्मक छवि
  choice: मुख्य पाठ में ‘सींग’ को ज्यों का त्यों रखा गया।
  alternative: ‘शक्तियाँ’, ‘साम्राज्य’ या ‘राज्य’
  rationale: दर्शन की साहित्यिक और धर्मवैचारिक संरचना सींगों की छवि पर निर्भर है। प्रतीक की सीधी व्याख्या अनावश्यक रूप से अर्थ को सीमित कर देती।
- issue: אִישׁ वाले मुहावरे का हिन्दी रूप
  choice: ‘किसी ने अपना सिर नहीं उठाया’
  alternative: ‘कोई पुरुष अपना सिर नहीं उठा सका’
  rationale: यहाँ אִישׁ प्रतिनिधिक और सामान्य अर्थ में है। ‘किसी ने’ वर्तमान हिन्दी में स्वाभाविक है, जबकि ‘नहीं उठा सका’ मूल वाक्य में निहित असमर्थता को स्पष्ट कर देता है; उस निहितार्थ को पादटिप्पणी में रखा गया है।
- issue: यहूदा के लिए स्त्रीलिंग प्रत्यय לְזָרוֹתָהּ
  choice: ‘यहूदा देश को तितर-बितर करने के लिए’
  alternative: ‘उसे तितर-बितर करने के लिए’
  rationale: हिन्दी में ‘यहूदा देश’ व्याकरणतः पुल्लिंग है, इसलिए स्रोत के स्त्रीलिंग प्रत्यय की यांत्रिक नकल भ्रमकारी होती। संज्ञा को दोहराने से संदर्भ स्पष्ट रहता है और कोई अतिरिक्त धर्मवैचारिक निष्कर्ष नहीं जोड़ा जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। संवाद में ‘पूछा/उत्तर दिया’ स्वाभाविक हिन्दी के लिए चुना गया है। भविष्यद्वाणी की सींग-संबंधी मूल दृश्यात्मकता सुरक्षित रखी गई है, जबकि कठिन मुहावरे और दुर्लभ क्रिया की अनिश्चितता पादटिप्पणियों में स्पष्ट की गई है।
