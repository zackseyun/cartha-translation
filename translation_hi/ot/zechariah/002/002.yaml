language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָ/אֹמַ֗ר אֶל הַ/מַּלְאָ֛ךְ הַ/דֹּבֵ֥ר בִּ֖/י מָה אֵ֑לֶּה וַ/יֹּ֣אמֶר אֵלַ֔/י אֵ֤לֶּה הַ/קְּרָנוֹת֙ אֲשֶׁ֣ר זֵר֣וּ אֶת יְהוּדָ֔ה אֶת יִשְׂרָאֵ֖ל וִ/ירוּשָׁלָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/002.yaml
  text: And I said to the angel who was speaking with me[a], “What are these?” And he said to me, “These are the horns that scattered Judah, Israel, and Jerusalem.”
translation:
  language: hi
  text: और मैंने मुझसे बात कर रहे स्वर्गदूत से पूछा, “ये क्या हैं?” उसने मुझसे कहा, “ये वे सींग[a] हैं जिन्होंने यहूदा, इस्राएल और यरूशलेम को तितर-बितर कर दिया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शक्तियाँ” अथवा “राज्यसत्ताएँ”; इब्रानी में “सींग” है, जो भविष्यवाणी के साहित्य में सामर्थ्य या शासकीय सत्ता का सामान्य प्रतीक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: स्वर्गदूत
  rationale: מַלְאָךְ का अर्थ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है। जकर्याह के दर्शन में यह एक स्वर्गीय व्याख्याकार है, इसलिए ‘स्वर्गदूत’ संदर्भ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: הַדֹּבֵר בִּי
  choice: मुझसे बात कर रहे
  rationale: जकर्याह में यह पदबंध नबी से संवाद करने वाले व्याख्याकार स्वर्गदूत के लिए प्रयुक्त होता है। ‘मुझसे बात कर रहे’ आधुनिक हिन्दी में स्वाभाविक है; केवल संबंधबोधक בְּ के आधार पर ‘मेरे भीतर बोल रहे’ करना प्रसंग के अनुकूल नहीं है।
- source_word: מָה אֵלֶּה
  choice: ये क्या हैं?
  rationale: प्रश्नवाचक और बहुवचन संकेतवाचक का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: הַקְּרָנוֹת
  choice: सींग
  rationale: קֶרֶן का शाब्दिक अर्थ ‘सींग’ है। भविष्यवाणी के प्रतीकवाद में यह शक्ति या राज्यसत्ता का संकेत दे सकता है, पर मूल पाठ की दृश्यात्मक छवि को मुख्य पाठ में बनाए रखा गया है।
- source_word: זֵרוּ
  choice: तितर-बितर कर दिया
  rationale: זרה यहाँ लोगों को बिखेरने या अलग-अलग दिशाओं में भगा देने का भाव देता है। ‘तितर-बितर कर दिया’ इस संदर्भ में स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: יְהוּדָה ... יִשְׂרָאֵל ... וִירוּשָׁלָם
  choice: यहूदा, इस्राएल और यरूशलेम
  rationale: मूल पाठ में आए तीनों व्यक्तिवाचक स्थान/समुदाय नाम उसी क्रम और समन्वय में रखे गए हैं।
theological_decisions:
- issue: ‘सींगों’ का प्रतीकात्मक अर्थ
  choice: मुख्य पाठ में शाब्दिक दृश्य-छवि ‘सींग’ को बनाए रखना
  alternative: शक्तियाँ या राज्यसत्ताएँ
  rationale: मूल दर्शन इन वस्तुओं को ‘सींग’ कहता है। प्रतीक की व्याख्या को मुख्य पाठ में रख देने से स्रोत की छवि और उसकी अर्थगत खुलावट अनावश्यक रूप से सीमित हो जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। दर्शन की प्रतीकात्मक भाषा को स्पष्ट किए बिना ज्यों का त्यों अर्थपूर्ण रखा गया है।
