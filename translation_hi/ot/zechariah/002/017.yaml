- source_word: הַס
  choice: चुप रहो
  rationale: यह विस्मयादिबोधक आज्ञा मौन रहने का गंभीर आह्वान करती है; ‘चुप रहो’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: כָּל בָּשָׂר
  choice: हे समस्त प्राणियो
  rationale: शाब्दिक अर्थ ‘समस्त देह’ है, पर यहाँ संबोधन समस्त मानवजाति का है और उसकी सृजित, नश्वर दशा पर बल देता है। ‘समस्त प्राणी’ हिन्दी में इस व्यापकता और प्राणीपन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִפְּנֵי
  choice: के सामने
  rationale: ‘मुख/उपस्थिति के आगे’ वाला इब्रानी मुहावरा यहाँ किसी की उपस्थिति में होने का अर्थ देता है; ‘के सामने’ संक्षिप्त और स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह मौन रहने की आज्ञा का कारण प्रस्तुत करता है; ‘क्योंकि’ कारण-संबंध को स्पष्ट रखता है।
- source_word: נֵעוֹר
  choice: जाग उठा है
  rationale: क्रिया विश्राम जैसी अवस्था से जागकर कार्य करने के लिए उठने का चित्र प्रस्तुत करती है। ‘जाग उठा है’ उस बिंब और सक्रिय होने के भाव को सहज हिन्दी में बनाए रखता है।
- source_word: מִמְּעוֹן קָדְשׁוֹ
  choice: अपने पवित्र निवास से
  rationale: מָעוֹן निवास-स्थान को सूचित करता है। यह चयन पवित्र स्थान के बिंब को स्पष्ट और गरिमापूर्ण हिन्दी में रखता है।
theological_decisions:
- issue: כָּל בָּשָׂר का मानवशास्त्रीय दायरा
  choice: मुख्य पाठ में ‘समस्त प्राणियो’ और पादटिप्पणी में शाब्दिक ‘समस्त देह’
  alternative: समस्त मानवजाति; सब लोग
  rationale: इब्रानी अभिव्यक्ति व्यापक रूप से मानवजाति को संबोधित करती है, साथ ही परमेश्वर के सामने मनुष्य की सृजित और नश्वर अवस्था उभारती है। हिन्दी में शाब्दिक ‘समस्त देह’ अस्पष्ट और अस्वाभाविक लगता है, इसलिए अर्थ मुख्य पाठ में और मूल बिंब पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: व्यक्तिगत नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ सामान्य हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला देवनागरी रूप है।
- issue: ईश्वर के जागने का मानवरूपी बिंब
  choice: ‘जाग उठा है’ को बनाए रखा
  alternative: कार्य करने के लिए उठा है; सक्रिय हुआ है
  rationale: मूल पाठ ईश्वर के अपने पवित्र निवास से जागकर हस्तक्षेप करने का सजीव बिंब देता है। इसे अमूर्त व्याख्या में बदलने के बजाय पाठ की काव्यात्मक और धर्मवैचारिक तन्यता सुरक्षित रखी गई है।
