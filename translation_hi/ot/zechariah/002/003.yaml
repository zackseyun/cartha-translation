  rationale: ראה के हिफ़ील वय्यिक्तोल रूप और प्रथम पुरुष एकवचन प्रत्यय का अर्थ शाब्दिक रूप से ‘उसने मुझे देखने दिया’ और स्वाभाविक हिन्दी में ‘उसने मुझे दिखाया’ है। आरम्भिक वाव को दर्शन के क्रम में ‘तब’ से व्यक्त किया गया है। कर्म ‘चार कारीगर’ बहुवचन होने के कारण हिन्दी में क्रिया ‘दिखाए’ रखी गई है।
- source_word: יְהוָ֔ה
