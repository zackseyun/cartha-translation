source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ אַחַ֣ר כָּב֔וֹד שְׁלָחַ֕/נִי אֶל הַ/גּוֹיִ֖ם הַ/שֹּׁלְלִ֣ים אֶתְ/כֶ֑ם כִּ֚י הַ/נֹּגֵ֣עַ בָּ/כֶ֔ם נֹגֵ֖עַ בְּ/בָבַ֥ת עֵינֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/012.yaml
  text: 'For thus says Yahweh of hosts: After glory he has sent me against the nations that plunder you[b][a], for whoever touches you touches the pupil of his eye.'
translation:
  language: hi
  text: 'क्योंकि सेनाओं का यहोवा यों कहता है: महिमा के बाद उसने मुझे उन जातियों के विरुद्ध भेजा है जो तुम्हें लूटती हैं[a], क्योंकि जो तुम्हें छूता है, वह उसकी आँख की पुतली को छूता है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “महिमा के लिए उसने मुझे उन जातियों के पास भेजा है जो तुम्हें लूटती हैं।” इब्रानी पदबंध “महिमा के बाद” कठिन है और उद्देश्य, क्रम अथवा सम्मान/महिमा से संबंध व्यक्त कर सकता है; ‘जातियों के पास’ इब्रानी पूर्वसर्ग का सामान्य दिशात्मक अर्थ है।
    reason: alternative_reading
  - marker: b
    text: 'इब्रानी चित्र आँख की पुतली का है—अर्थात आँख का अत्यंत संवेदनशील और सावधानी से सुरक्षित रखा जानेवाला भाग। अर्थगत मुहावरेदार विकल्प: “उसकी आँख का तारा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से व्यक्त किया गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: यह पदवी स्वर्गीय अथवा संगठित सेनाओं के भाव को बनाए रखती है और आधुनिक हिन्दी में सुबोध है।
- source_word: אַחַר כָּבוֹד
  choice: महिमा के बाद
  rationale: इब्रानी पदबंध कठिन और अर्थ की दृष्टि से संदिग्ध है; अपेक्षाकृत शाब्दिक अनुवाद उसके क्रम, उद्देश्य अथवा सम्मान-संबंधी संभावित अर्थों को खुला रखता है।
- source_word: שְׁלָחַנִי
  choice: उसने मुझे ... भेजा है
  rationale: इब्रानी पूर्ण क्रिया के वर्तमान-प्रासंगिक परिणाम को हिन्दी पूर्णकाल से व्यक्त किया गया है और वक्ता की पहचान अनिर्णीत रखी गई है।
- source_word: אֶל הַגּוֹיִם
  choice: उन जातियों के विरुद्ध
  rationale: אֶל सामान्यतः दिशा बताता है, पर लूटनेवाली जातियों के न्याय-संदर्भ में मिशन का विरोधात्मक भाव स्वाभाविक रूप से व्यक्त होता है; 'के पास' भी व्याकरणतः संभव है।
- source_word: הַשֹּׁלְלִים אֶתְכֶם
  choice: जो तुम्हें लूटती हैं
  rationale: שׁלל युद्ध या उत्पीड़न में माल लूटने को दर्शाता है; यह आधुनिक और स्पष्ट हिन्दी है।
- source_word: הַנֹּגֵעַ בָּכֶם ... נֹגֵעַ
  choice: जो तुम्हें छूता है, वह ... को छूता है
  rationale: मूल में נגע की पुनरावृत्ति को समान हिन्दी क्रिया से बनाए रखा गया है।
- source_word: בְּבָבַת עֵינוֹ
  choice: उसकी आँख की पुतली
  rationale: यह आँख के अत्यंत संवेदनशील और सुरक्षित भाग की इब्रानी छवि को सीधे तथा सुबोध रूप में व्यक्त करता है।
theological_decisions:
- issue: ‘उसने मुझे भेजा है’ के वक्ता तथा ‘उसकी आँख’ में सर्वनाम का संदर्भ
  choice: ‘मुझे’ और ‘उसकी’ को मूल पाठ की तरह बिना स्पष्ट पहचान दिए रखा गया है।
  alternative: वक्ता को नबी, स्वर्गदूत-दूत अथवा यहोवा द्वारा भेजी गई दिव्य हस्ती के रूप में स्पष्ट करना।
  rationale: इब्रानी में दिव्य वचन और प्रथम पुरुष के भेजे जाने के कथन के बीच तनाव है; अनुवाद पाठ से अधिक निश्चित पहचान आरोपित नहीं करता।
- issue: אַחַר כָּבוֹד का संबंध
  choice: ‘महिमा के बाद’
  alternative: ‘महिमा के लिए’ अथवा ‘सम्मान के पीछे/संबंध में’
  rationale: पदबंध की वास्तविक वाक्यगत अस्पष्टता को मुख्य पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘यों कहता है’ भविष्यद्वाणी की औपचारिक उद्घोषणा को व्यक्त करता है। कठिन ‘महिमा के बाद’ को सहज बनाकर उसकी अस्पष्टता मिटाने के बजाय पादटिप्पणी सहित सुरक्षित रखा गया है।
