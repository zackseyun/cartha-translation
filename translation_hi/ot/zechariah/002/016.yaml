base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/016.yaml
  text: And Yahweh will inherit Judah as his portion in the holy land[b][a], and he will again choose Jerusalem.
translation:
  language: hi
  text: और यहोवा पवित्र भूमि[b] में यहूदा को अपने हिस्से के रूप में विरासत में लेगा[a], और वह यरूशलेम को फिर से चुनेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदा को अपनी विरासत के रूप में अपने अधिकार में लेगा।” इब्रानी में सामान्य अधिकार की भाषा के बजाय विरासत की भाषा है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “पवित्रता की धरती पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָחַל
  choice: और … विरासत में पाएगा
  rationale: नחל के विरासत पाने या उत्तराधिकार में अधिकार प्राप्त करने के अर्थ को बनाए रखा गया है। ‘अपने अधिकार में लेगा’ अधिक सहज होता, पर मूल के विरासत-संबंधी बिंब को कम कर देता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित लिप्यंतरण का प्रयोग किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: אֶת יְהוּדָה חֶלְקוֹ
  choice: यहूदा को अपने हिस्से के रूप में
  rationale: חֶלְקוֹ में भाग, हिस्सा या आवंटित अंश का भाव है। यह अनुवाद यहूदा को यहोवा का हिस्सा बताने वाली मूल संरचना सुरक्षित रखता है।
- source_word: עַל אַדְמַת הַקֹּדֶשׁ
  choice: पवित्र भूमि में
  rationale: शाब्दिक ‘पवित्रता की मिट्टी/भूमि पर’ के भौगोलिक और पवित्र ठहराए गए क्षेत्र के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: וּבָחַר עוֹד
  choice: और वह … फिर से चुनेगा
  rationale: בחר का सामान्य अर्थ ‘चुनना’ और עוֹד का पुनर्स्थापन के प्रसंग में ‘फिर से’ है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम
  rationale: स्थान-नाम का मानक हिन्दी बाइबलीय रूप रखा गया है।
theological_decisions:
- issue: यहूदा के लिए यहोवा की विरासत की भाषा
  choice: ‘यहूदा को अपने हिस्से के रूप में विरासत में पाएगा’
  alternative: ‘यहूदा को अपनी विरासत के रूप में अपने अधिकार में लेगा’
  rationale: मूल पाठ में यहोवा स्वयं विरासत पाने वाला है, जबकि सामान्यतः इस्राएल के भूमि को विरासत में पाने की बात आती है। इस उलटे हुए वाचा-संबंधी बिंब और उससे उत्पन्न वास्तविक धर्मवैचारिक तनाव को सरल ‘अधिकार में लेगा’ से समतल नहीं किया गया।
- issue: אַדְמַת הַקֹּדֶשׁ का अर्थ
  choice: ‘पवित्र भूमि’
  alternative: ‘पवित्र मिट्टी पर’ या ‘पवित्र धरती पर’
  rationale: वाक्यांश भूमि की पवित्र ठहराई गई स्थिति और भौगोलिक अर्थ दोनों बताता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई और अधिक शाब्दिक रूप पादटिप्पणी में दिया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘विरासत में पाएगा’ हिन्दी में कुछ असामान्य लग सकता है, पर यह मूल इब्रानी के जानबूझकर प्रयुक्त विरासत-बिंब को सुरक्षित रखता है।
