  yaml_path: translation/ot/zechariah/002/007.yaml
  text: And behold[a], the angel who was speaking with me went out, and another angel went out to meet him.
translation:
  language: hi
  text: और देखो, जो स्वर्गदूत मुझसे बात कर रहा था, वह बाहर निकला; और दूसरा स्वर्गदूत उससे मिलने बाहर निकला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह अभिव्यक्ति श्रोता या पाठक का ध्यान अचानक दृश्य की ओर खींचती है। ‘और देखो’ भविष्यद्वाणी के जीवंत वर्णन को बनाए रखते हुए सरल और समझने योग्य है।
- source_word: הַמַּלְאָךְ
  choice: स्वर्गदूत
  rationale: מַלְאָךְ का सामान्य अर्थ ‘दूत’ भी हो सकता है, पर इस दर्शन में एक से अधिक अलौकिक पात्रों की उपस्थिति के कारण ‘स्वर्गदूत’ अधिक स्वाभाविक है।
- source_word: הַדֹּבֵר בִּי
  choice: जो स्वर्गदूत मुझसे बात कर रहा था
  rationale: वर्तमान कृदंत उस स्वर्गदूत की चलती आ रही भूमिका बताता है। जकर्याह में यह बार-बार आने वाला इब्रानी प्रयोग स्वाभाविक हिन्दी में ‘मुझसे बात कर रहा था’ है।
- source_word: יֹצֵא
  choice: बाहर निकला
  rationale: दर्शन के क्रमिक वर्णन में कृदंत क्रियात्मक रूप से प्रयुक्त है। ‘बाहर निकला’ स्थान से बाहर जाने की गति को स्पष्ट रूप से व्यक्त करता है।
- source_word: וּמַלְאָךְ אַחֵר
  choice: और एक दूसरा स्वर्गदूत
  rationale: אַחֵר पहले स्वर्गदूत से अलग एक अतिरिक्त स्वर्गदूत को दर्शाता है; ‘एक दूसरा स्वर्गदूत’ हिन्दी में इस भेद को सहजता से व्यक्त करता है।
- source_word: לִקְרָאתוֹ
  choice: उससे मिलने
  rationale: לִקְרָאתוֹ दूसरे स्वर्गदूत के बाहर निकलने का उद्देश्य बताता है। ‘उससे मिलने’ स्पष्ट और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: दोनों स्वर्गदूतों की पहचान
  choice: दोनों को केवल ‘स्वर्गदूत’ कहा गया है और पहले को उसकी कथात्मक भूमिका—वक्ता से बात करने वाला—से पहचाना गया है।
  alternative: पहले को स्पष्टतः ‘व्याख्या करने वाला स्वर्गदूत’ और दूसरे को किसी विशेष पद या मिशन वाला स्वर्गीय दूत कहना।
  rationale: पद दोनों पात्रों को उनकी भूमिका और क्रम से अलग करता है, लेकिन उनकी और अधिक पहचान नहीं बताता। अनुवाद ऐसी कोई स्वर्गदूत-विषयक व्याख्या नहीं जोड़ता जो मूल पाठ में नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘और देखो’ में भविष्यद्वाणी-वर्णन की जीवंतता है, जबकि वाक्य का शेष भाग साधारण आधुनिक हिन्दी में है।
