source:
  edition: WLC
  text: כִּ֠י הִנְ/נִ֨י מֵנִ֤יף אֶת יָדִ/י֙ עֲלֵי/הֶ֔ם וְ/הָי֥וּ שָׁלָ֖ל לְ/עַבְדֵי/הֶ֑ם וִֽ/ידַעְתֶּ֕ם כִּֽי יְהוָ֥ה צְבָא֖וֹת שְׁלָחָֽ/נִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/013.yaml
  text: For behold[a], I am about to wave my hand over them, and they will become plunder for their own servants[c][b]. Then you will know that Yahweh of Armies has sent me.
translation:
  language: hi
  text: क्योंकि देखो, मैं उन पर अपना हाथ लहराने वाला हूँ, और वे अपने ही दासों के लिए लूट बन जाएँगे। तब तुम जानोगे कि सेनाओं के यहोवा ने मुझे भेजा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वक्ता कहता है, “सेनाओं के यहोवा ने मुझे भेजा है,” पर इस पद में वह अपनी पहचान स्पष्ट नहीं करता; संदर्भ में उसकी पहचान खुली रहती है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में उस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִנְנִי
  choice: देखो, मैं … वाला हूँ
  rationale: यह ध्यान आकर्षित करने के साथ आसन्न भविष्य की कार्रवाई बताता है; यह रूप आधुनिक हिन्दी में दोनों भावों को बनाए रखता है।
- source_word: מֵנִיף אֶת־יָדִי עֲלֵיהֶם
  choice: उन पर अपना हाथ लहराने
  rationale: הניף के ठोस, सांकेतिक ‘लहराने’ के बिंब को बनाए रखा गया है; संदर्भ में इसका विरोधात्मक प्रभाव स्पष्ट है, पर उसे अनावश्यक रूप से ‘विरुद्ध उठाना’ बनाकर नहीं खोला गया।
- source_word: וְהָיוּ
  choice: बन जाएँगे
  rationale: यहाँ क्रिया परिणामी अवस्था को सूचित करती है; ‘बन जाएँगे’ उस परिवर्तन को स्पष्ट करती है।
- source_word: שָׁלָל
  choice: लूट
  rationale: युद्ध में छीने गए माल के लिए यह सहज और प्रचलित आधुनिक हिन्दी शब्द है।
- source_word: לְעַבְדֵיהֶם
  choice: अपने ही दासों के लिए
  rationale: עבד का अर्थ ‘सेवक’ या ‘दास’ हो सकता है। यहाँ ‘दास’ प्रभुत्व के उलट जाने की तीव्रता को अधिक स्पष्ट रखता है, और ‘अपने ही’ संबंधवाचक प्रत्यय तथा विडंबनापूर्ण उलटाव को उभारता है।
- source_word: וִידַעְתֶּם
  choice: तब तुम जानोगे
  rationale: ‘तब’ पिछले कार्य के परिणामस्वरूप मिलने वाली पहचान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: ईश्वरीय नाम को ‘यहोवा’ और צְבָאוֹת को उसके सैन्य अर्थ के अनुरूप ‘सेनाओं के’ अनूदित किया गया है।
- source_word: שְׁלָחַנִי
  choice: ने मुझे भेजा है
  rationale: इब्रानी पूर्ण क्रिया पूरी हो चुकी नियुक्ति और उसकी वर्तमान प्रासंगिकता व्यक्त करती है; हिन्दी पूर्णकाल इसे स्वाभाविक रूप से दर्शाता है।
theological_decisions:
- issue: ‘सेनाओं के यहोवा ने मुझे भेजा है’ कहने वाले वक्ता की पहचान
  choice: मुख्य पाठ में प्रथम पुरुष कथन रखा गया है और वक्ता की पहचान निर्धारित नहीं की गई।
  alternative: वक्ता को जकर्याह नबी, स्वर्गदूत-दूत, अथवा दिव्य/मसीही व्यक्ति के रूप में स्पष्ट करना।
  rationale: इब्रानी पाठ वक्ता का स्पष्ट परिचय दिए बिना यह कथन रखता है। किसी एक पहचान को अनुवाद में जोड़ना पाठ की वास्तविक धार्मिक जटिलता को समय से पहले सुलझा देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘देखो’ הִנְנִי की ध्यानाकर्षक शक्ति रखता है; ‘हाथ लहराने’ मूल बिंब को सुरक्षित रखता है। ‘दासों’ का चयन सत्ता के तीखे उलटाव को बनाए रखता है।
