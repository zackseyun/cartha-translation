source:
  edition: WLC
  text: ה֣וֹי ה֗וֹי וְ/נֻ֛סוּ מֵ/אֶ֥רֶץ צָפ֖וֹן נְאֻם יְהוָ֑ה כִּ֠י כְּ/אַרְבַּ֞ע רוּח֧וֹת הַ/שָּׁמַ֛יִם פֵּרַ֥שְׂתִּי אֶתְ/כֶ֖ם נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/010.yaml
  text: Up! Up! Flee from the land of the north[a], declares Yahweh, for I have spread you abroad to the four winds of the heavens[b], declares Yahweh.
translation:
  language: hi
  text: चलो! चलो![a] उत्तर के देश से भाग निकलो—याहवे की यह घोषणा है—क्योंकि मैंने तुम्हें आकाश की चारों दिशाओं में फैला दिया है[b]—याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत अनुवादों में इसे कभी-कभी “हो! हो!” कहा गया है। यहाँ हिब्रू शब्द शोक की पुकार नहीं, बल्कि तत्काल ध्यान देने और कदम उठाने की पुकार है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैंने तुम्हें आकाश की चारों पवनों के समान फैला दिया है।” हिब्रू वाक्यांश को तुलना (“के समान”) या दिशासूचक मुहावरे (“चारों दिशाओं में”) के रूप में समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי הוֹי
  choice: चलो! चलो!
  rationale: यहाँ दोहराया गया विस्मयादिबोधक शोक नहीं, बल्कि तत्काल ध्यान और कार्रवाई के लिए पुकार है। ‘चलो! चलो!’ आधुनिक हिन्दी में उसकी तात्कालिकता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְנֻסוּ
  choice: भाग निकलो
  rationale: बहुवचन आज्ञार्थक रूप तत्काल पलायन का आदेश देता है। ‘भाग निकलो’ खतरे से शीघ्र निकल जाने का भाव स्पष्ट करता है।
- source_word: מֵאֶרֶץ צָפוֹן
  choice: उत्तर देश से
  rationale: यह हिब्रू रचना के भौगोलिक भाव को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह मानक नबूवत-सूत्र का भार बनाए रखता है और יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में प्रस्तुत करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अगले कथन को आदेश का आधार बताने वाले कारणसूचक वाक्य के रूप में स्पष्ट करता है।
- source_word: כְּאַרְבַּע רוּחוֹת הַשָּׁמַיִם
  choice: आकाश की चारों दिशाओं में
  rationale: मुख्य पाठ में व्यापक दिशाओं में फैलाव का सहज हिन्दी मुहावरा चुना गया है; כְּ के कारण संभव तुलनात्मक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: פֵּרַשְׂתִּי אֶתְכֶם
  choice: मैंने तुम्हें ... फैला दिया है
  rationale: פרשׂ के मूल ‘फैलाने’ के बिंब को बनाए रखता है और अनावश्यक रूप से हिंसक बिखराव का अर्थ नहीं जोड़ता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम יְהוָה दो बार है; ‘याहवे’ उसका नाम स्पष्ट रूप से सुरक्षित रखता है।
- issue: चार पवनों वाली अभिव्यक्ति का अर्थ
  choice: चारों दिशाओं में फैलाव
  alternative: चारों पवनों के समान फैलाव
  rationale: हिब्रू में दिशासूचक और तुलनात्मक दोनों समझ संभव हैं। मुख्य पाठ में स्वाभाविक दिशासूचक अर्थ रखा गया है, जबकि दूसरे अर्थ को पादटिप्पणी में दिया गया है ताकि वास्तविक अस्पष्टता न मिटे।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। दोहराई हुई पुकार, आज्ञा की तात्कालिकता और नबूवत-सूत्र की गंभीरता सुरक्षित हैं; विराम-चिह्न घोषणात्मक खंडों को स्पष्ट करते हैं।
