source:
  edition: WLC
  text: וְ/נִלְווּ֩ גוֹיִ֨ם רַבִּ֤ים אֶל יְהוָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא וְ/הָ֥יוּ לִ֖/י לְ/עָ֑ם וְ/שָׁכַנְתִּ֣י בְ/תוֹכֵ֔/ךְ וְ/יָדַ֕עַתְּ כִּי יְהוָ֥ה צְבָא֖וֹת שְׁלָחַ֥/נִי אֵלָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/015.yaml
  text: And many nations will join themselves to Yahweh in that day[a], and they will be my people. And I will dwell in your midst[b], and you will know that Yahweh of Armies has sent me to you.
translation:
  language: hi
  text: उस दिन बहुत-से राष्ट्र यहोवा से जुड़ जाएँगे और वे मेरी प्रजा होंगे। मैं तेरे बीच निवास करूँगा, और तू जान लेगी कि सेनाओं के यहोवा[a] ने मुझे[b] तेरे पास भेजा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत रूप से इसका अनुवाद ‘सेनाओं का प्रभु’ भी किया जाता है।
    reason: lexical_alternative
  - marker: b
    text: वक्ता कहता है, “सेनाओं के यहोवा ने मुझे तेरे पास भेजा है।” पाठ ‘मुझे’ की पहचान स्पष्ट नहीं करता; इसलिए यह अस्पष्टता अनुवाद में बनाए रखी गई है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִלְווּ
  choice: जुड़ जाएँगे
  rationale: लוה के निफ़अल रूप में यहाँ स्वयं को किसी से जोड़ने या उसके साथ संबद्ध होने का भाव है। यह चयन राष्ट्रों के स्वेच्छापूर्ण लगाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גוֹיִם רַבִּים
  choice: बहुत-से राष्ट्र
  rationale: यहाँ גוֹיִם का मुख्य भाव अनेक राष्ट्रों का व्यापक अंतरराष्ट्रीय दायरा है; ‘गैर-यहूदी’ अनावश्यक रूप से यहूदी–गैर-यहूदी विरोध को सामने लाता।
- source_word: אֶל יְהוָה
  choice: यहोवा से
  rationale: क्रिया ‘जुड़ना’ के साथ आधुनिक हिन्दी में ‘से’ स्वाभाविक है और यह यहोवा के साथ लगाव तथा निष्ठा का संबंध व्यक्त करता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यसूचक समय-सूचक अभिव्यक्ति का संक्षिप्त और प्रचलित हिन्दी रूप है।
- source_word: וְהָיוּ לִי לְעָם
  choice: वे मेरी प्रजा होंगे
  rationale: बहुवचन ‘राष्ट्रों’ के बाद भी इब्रानी में ‘प्रजा’ एकवचन सामूहिक संज्ञा है। यह वाचा-संबंधी सूत्र को सुरक्षित रखता है।
- source_word: וְשָׁכַנְתִּי בְתוֹכֵךְ
  choice: मैं तेरे बीच निवास करूँगा
  rationale: שׁכן स्थायी रूप से रहने या निवास करने को दर्शाता है। ‘तेरे’ स्त्रीलिंग एकवचन संबोधन को बनाए रखता है, जो प्रसंग में सिय्योन/यरूशलेम की ओर है।
- source_word: וְיָדַעַתְּ
  choice: तू जान लेगी
  rationale: इब्रानी रूप स्त्रीलिंग एकवचन है। ‘जान लेगी’ भविष्य में पहचान और निश्चित बोध के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: צְבָאוֹת का पारदर्शी अर्थ ‘सेनाएँ’ है। यह पारंपरिक ‘सेनाओं के यहोवा’ पद को बनाए रखते हुए आधुनिक पाठक के लिए बोधगम्य है।
- source_word: שְׁלָחַנִי
  choice: ने मुझे ... भेजा है
  rationale: पूर्ण क्रिया को हिन्दी के पूर्ण वर्तमान से व्यक्त किया गया है, क्योंकि भेजे जाने की पूरी हुई घटना का महत्त्व पहचान के समय वर्तमान है।
- source_word: אֵלַיִךְ
  choice: तेरे पास
  rationale: प्रत्यय स्त्रीलिंग एकवचन है। पद में सिय्योन या यरूशलेम का नाम स्पष्ट रूप से नहीं है, इसलिए सर्वनाम ही रखा गया है।
theological_decisions:
- issue: ‘सेनाओं के यहोवा ने मुझे तेरे पास भेजा है’ में वक्ता की पहचान
  choice: प्रथम पुरुष ‘मुझे’ को बिना व्याख्यात्मक विस्तार के बनाए रखना
  alternative: वक्ता को स्पष्ट रूप से स्वर्गदूत, नबी अथवा दिव्य/मसीही व्यक्ति बताना
  rationale: इब्रानी पाठ वक्ता की पहचान स्पष्ट नहीं करता और यहोवा द्वारा ‘मुझे’ भेजे जाने का अर्थपूर्ण तनाव बनाए रखता है। अनुवाद इसे किसी एक व्याख्या से सीमित नहीं करता।
- issue: अनेक राष्ट्रों और एक सामूहिक प्रजा के बीच वचनात्मक संबंध
  choice: ‘वे मेरी प्रजा होंगे’
  alternative: ‘वे मेरी प्रजाएँ होंगे’
  rationale: इब्रानी עָם एकवचन है और अनेक राष्ट्रों के एक वाचा-समुदाय बनने का भाव देता है; इसलिए सामूहिक एकवचन ‘प्रजा’ रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सिय्योन/यरूशलेम के स्त्रीलिंग एकवचन संबोधन को ‘तेरे’ और ‘तू ... लेगी’ से स्पष्ट किया गया है। ‘प्रजा’ वाचा-संबंधी सामूहिक अर्थ को सुरक्षित रखता है।
