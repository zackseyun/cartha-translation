  text: רָנִּ֥י וְ/שִׂמְחִ֖י בַּת צִיּ֑וֹן כִּ֧י הִנְ/נִי בָ֛א וְ/שָׁכַנְתִּ֥י בְ/תוֹכֵ֖/ךְ נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/014.yaml
  text: Sing for joy and rejoice[a], daughter Zion, for behold, I am coming, and I will dwell in your midst[c][b], declares Yahweh.
translation:
  language: hi
  text: “आनन्द से गा और प्रसन्न हो[a], हे सिय्योन की बेटी[b], क्योंकि देख, मैं आ रहा हूँ और तेरे बीच निवास करूँगा—यह याहवे[c] की वाणी है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आनन्द से जयजयकार कर और प्रसन्न हो।”
    reason: lexical_alternative
  - marker: b
    text: “सिय्योन की बेटी” सिय्योन/यरूशलेम को एक स्त्री के रूप में प्रस्तुत करने वाला काव्यात्मक संबोधन है।
    reason: cultural_note
  - marker: c
    text: 'इब्रानी: YHWH; परम्परागत रूप से “प्रभु” या “यहोवा” अनूदित।'
    reason: alternative_reading
lexical_decisions:
- source_word: רָנִּי
  choice: आनन्द से गा
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक क्रिया उल्लास से ऊँचे स्वर में पुकारने या गाने का भाव रखती है। ‘आनन्द से गा’ उत्सवपूर्ण अर्थ और काव्यात्मक स्वर दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְשִׂמְחִי
  choice: और मगन हो
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप आनन्द मनाने का आह्वान करता है। ‘मगन हो’ पहले पद के साथ सहज है और ऊँचे साहित्यिक स्तर को बनाए रखता है।
- source_word: בַּת צִיּוֹן
  choice: हे सिय्योन की बेटी
  rationale: यह सिय्योन/यरूशलेम का स्त्रीरूप में काव्यात्मक मानवीकरण और संबोधन है। ‘हे’ संबोधन को हिन्दी में स्पष्ट करता है, जबकि ‘सिय्योन की बेटी’ इब्रानी रूपक को सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आनन्द के आह्वान का कारण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: הִנְנִי
  choice: देख, मैं
  rationale: यह ध्यान आकर्षित करने वाला प्रथम-पुरुष सूचक पद है, जिसका भाव ‘देख, मैं यहाँ हूँ/मैं’ है। ‘देख, मैं’ उसकी तत्क्षणता और भविष्यद्वाणी की गंभीरता बनाए रखता है।
- source_word: בָא
  choice: आ रहा हूँ
  rationale: הִנְנִי के बाद आया कृदन्त निकट या सजीव रूप से प्रस्तुत आगमन बताता है। ‘आ रहा हूँ’ इस प्रगतिशील और आसन्न भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְשָׁכַנְתִּי
  choice: और निवास करूँगा
  rationale: यहाँ पूर्ण क्रियारूप भविष्यद्वाणी के प्रसंग में भावी कार्य बताता है। ‘निवास करूँगा’ परमेश्वर की स्थायी उपस्थिति के अर्थ को सुरक्षित रखता है, बिना बाद की धर्मवैज्ञानिक व्याख्या जोड़े।
- source_word: בְתוֹכֵךְ
  choice: तेरे बीच
  rationale: प्रत्यय स्त्रीलिंग एकवचन सिय्योन को संबोधित करता है। ‘तेरे बीच’ एकवचन संबोधन और समुदाय के मध्य उपस्थिति—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की वाणी है
  rationale: यह मानक भविष्यद्वक्तीय उद्घोषणा-सूत्र है। ‘वाणी’ कथन की प्रामाणिकता और गंभीरता व्यक्त करता है; יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे उपस्थित है। ‘याहवे’ उसका आधुनिक हिन्दी में निकट लिप्यंतरण है और नाम को सामान्य उपाधि ‘प्रभु’ में बदलता नहीं है।
- issue: भविष्यद्वाणी में परमेश्वर के निवास की भाषा
  choice: तेरे बीच निवास करूँगा
  alternative: तेरे बीच रहूँगा; तेरे भीतर निवास करूँगा
  rationale: שׁכן सिय्योन में याहवे की उपस्थिति और टिके रहने का भाव रखता है। ‘तेरे बीच निवास करूँगा’ सामुदायिक और स्थानगत अर्थ को बनाए रखता है तथा इसे केवल व्यक्ति के भीतर की उपस्थिति के रूप में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और भविष्यद्वक्तीय गरिमा रखी गई है। स्त्रीलिंग एकवचन संबोधन को ‘गा’, ‘मगन हो’ और ‘तेरे’ से स्पष्ट किया गया है। ‘देख’ मूल के ध्यानाकर्षक पद की सीधाई बनाए रखता है; वाक्य को अत्यधिक संस्कृतनिष्ठ नहीं बनाया गया।
