base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/008.yaml
  text: And he said to him[a], “Run, speak to that young man, saying[b], ‘Jerusalem will dwell as open country because of the multitude of man and livestock within her.’”
translation:
  language: hi
  text: 'और उसने उससे कहा, “दौड़, और उस युवक से यह कह: ‘यरूशलेम बिना दीवार वाली बस्तियों की तरह बसा रहेगा[a], क्योंकि उसमें मनुष्यों[b] और पशुओं की बहुतायत होगी।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “खुले क्षेत्र की तरह बसा रहेगा।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “मनुष्य” एकवचन है, पर यहाँ पूरी मानव जनसंख्या के लिए सामूहिक रूप से प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֻץ
  choice: दौड़कर
  rationale: आज्ञार्थक क्रिया की तीव्रता और दृश्यात्मकता को बनाए रखता है; केवल ‘जल्दी कर’ की अपेक्षा मूल क्रिया के अधिक निकट है।
- source_word: דַּבֵּר
  choice: कह
  rationale: इस संदेश-संदर्भ में आधुनिक हिन्दी का स्वाभाविक रूप है और बोलकर संदेश देने की क्रिया व्यक्त करता है।
- source_word: הַנַּעַר הַלָּז
  choice: उस जवान
  rationale: נַעַר यहाँ बालक से अधिक एक युवा पुरुष को सूचित करता है; ‘उस’ संकेतवाचक הַלָּז को सुरक्षित रखता है।
- source_word: פְּרָזוֹת
  choice: बिना शहरपनाह की बस्तियों के समान
  rationale: बहुवचन शब्द खुली अथवा दीवार-रहित बस्तियों को सूचित करता है। यह रूप बहुवचन और सुरक्षा-दीवार के अभाव—दोनों को स्पष्ट एवं स्वाभाविक हिन्दी में रखता है।
- source_word: תֵּשֵׁב
  choice: बसा रहेगा
  rationale: ישב के स्थायी निवास अथवा आबाद होने के भाव को व्यक्त करता है; यरूशलेम के लिए हिन्दी में ‘बसा रहेगा’ स्वाभाविक है।
- source_word: מֵרֹב
  choice: बहुतायत के कारण
  rationale: מִן के कारणसूचक प्रयोग और רֹב की प्रचुरता—दोनों को संक्षेप में व्यक्त करता है।
- source_word: אָדָם
  choice: मनुष्यों
  rationale: यहाँ אָדָם पशुओं के विपरीत पूरी मानव जनसंख्या के लिए सामूहिक अर्थ में प्रयुक्त है; हिन्दी बहुवचन अर्थ को सहज रूप से स्पष्ट करता है।
- source_word: וּבְהֵמָה
  choice: और पशुओं
  rationale: בְּהֵמָה यहाँ सामूहिक रूप से पालतू पशुधन को सूचित करता है; संदर्भ में ‘पशुओं’ स्पष्ट और सहज है।
- source_word: בְּתוֹכָהּ
  choice: उसके भीतर
  rationale: स्त्रीलिंग प्रत्यय का संदर्भ यरूशलेम से है; हिन्दी में नगर के लिए ‘उसके भीतर’ स्वाभाविक है।
theological_decisions:
- issue: אָדָם का सामूहिक अर्थ
  choice: मनुष्यों
  alternative: मनुष्य
  rationale: मूल का एकवचन शब्द यहाँ मानव आबादी को सामूहिक रूप से दर्शाता है। ‘मनुष्यों’ आधुनिक हिन्दी में अर्थ को स्पष्ट करता है, जबकि पदटिप्पणी मूल के एकवचन रूप को बताती है।
- issue: פְּרָזוֹת का स्थान-संबंधी चित्र
  choice: बिना शहरपनाह की बस्तियों के समान
  alternative: खुले क्षेत्र के समान
  rationale: मूल बहुवचन शब्द दीवार-रहित बस्तियों अथवा खुले स्थानों, दोनों का बोध करा सकता है। मुख्य पाठ में बस्तियों का चित्र रखा गया है और व्यापक स्थानगत विकल्प पदटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘शहरपनाह’ दीवारबंद नगर की कल्पना को संक्षेप और परिचित ढंग से व्यक्त करता है; वाक्य में भविष्यवाणी की तात्कालिकता के लिए ‘दौड़कर’ रखा गया है।
