  rationale: यह इब्रानी मुहावरा दर्शनीय अनुभव में देखने की क्रिया का परिचय देता है। ‘अपनी आँखें उठाकर’ मूल बिंब और भविष्यदर्शी शैली को बनाए रखता है।
