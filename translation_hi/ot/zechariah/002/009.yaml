source:
  edition: WLC
  text: וַ/אֲנִ֤י אֶֽהְיֶה לָּ/הּ֙ נְאֻם יְהוָ֔ה ח֥וֹמַת אֵ֖שׁ סָבִ֑יב וּ/לְ/כָב֖וֹד אֶֽהְיֶ֥ה בְ/תוֹכָֽ/הּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/009.yaml
  text: And I myself will be for her a wall of fire all around[a], declares Yahweh, and I will be glory in her midst.
translation:
  language: hi
  text: “और मैं स्वयं उसके चारों ओर आग की दीवार होऊँगा,” याहवे की घोषणा है, “और उसके बीच महिमा होऊँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי
  choice: और मैं स्वयं
  rationale: स्वतंत्र सर्वनाम אֲנִי कर्ता पर विशेष बल देता है; ‘मैं स्वयं’ उस बल को स्वाभाविक हिन्दी में बनाए रखता है। וַ का अनुवाद भविष्यवाणी के प्रवाह को जारी रखने वाले ‘और’ से किया गया है।
- source_word: אֶהְיֶה
  choice: होऊँगा
  rationale: यह היה का प्रथम पुरुष एकवचन अपूर्ण रूप है और प्रसंग में भविष्यसूचक अर्थ देता है। दोनों occurrences में ‘होऊँगा’ समानता और भविष्य का भाव बनाए रखता है।
- source_word: לָהּ
  choice: उसके लिए
  rationale: 'לָהּ सम्बन्ध और हित का भाव व्यक्त करता है: याहवे नगर के लिए रक्षक दीवार होंगे। स्त्रीलिंग प्रत्यय यरूशलेम/सिय्योन के स्त्रीरूप व्यक्तिकरण को बनाए रखता है।'
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: यह गंभीर भविष्यद्वाणी-सूत्र है। ‘घोषणा’ נְאֻם का औपचारिक बल रखता है, और याहवे व्यक्तिगत दिव्य नाम को दर्शाता है।
- source_word: חוֹמַת אֵשׁ
  choice: आग की दीवार
  rationale: रचना-सम्बन्ध का सीधा अर्थ ‘आग की दीवार’ है; इससे चारों ओर दिव्य सुरक्षा का रूपक सुरक्षित रहता है।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: यह नगर को पूर्णतः घेरे होने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּלְכָבוֹד
  choice: और … महिमा
  rationale: כָבוֹד को विशेषण ‘महिमामय’ न बनाकर संज्ञा ‘महिमा’ रखा गया है, ताकि याहवे स्वयं नगर के बीच उसकी महिमा हैं—यह प्रभावशाली विधेय-संज्ञा बनी रहे।
- source_word: בְתוֹכָהּ
  choice: उसके बीच
  rationale: यह नगर के भीतर या मध्य में दिव्य उपस्थिति को व्यक्त करता है और स्त्रीलिंग व्यक्तिकरण को सुरक्षित रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में टेट्राग्रामटन व्यक्तिगत दिव्य नाम के रूप में आया है। ‘याहवे’ उसका प्रचलित विद्वतापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: यरूशलेम/सिय्योन का स्त्रीलिंग व्यक्तिकरण
  choice: स्त्रीलिंग सन्दर्भ को ‘उसके’ से बनाए रखना
  alternative: नगर का नाम स्पष्ट रूप से जोड़ना; निर्जीव तटस्थ सन्दर्भ करना
  rationale: मूल के दोनों प्रत्यय स्त्रीलिंग एकवचन हैं। हिन्दी में ‘उसके’ रूप लिंग की स्पष्ट पहचान नहीं कराता, फिर भी अनावश्यक संज्ञा जोड़े बिना उसी नगर-सन्दर्भ को स्वाभाविक रूप से आगे बढ़ाता है।
- issue: לְכָבוֹד में विधेय का स्वरूप
  choice: महिमा
  alternative: एक महिमा; गौरव का कारण
  rationale: इब्रानी में כָבוֹד के साथ निश्चित उपपद नहीं है और לְ विधेयात्मक रूप में समझा जा सकता है। हिन्दी में उपपद न होने के कारण निश्चित और अनिश्चित दोनों सम्भावनाएँ मुख्य पाठ के ‘महिमा’ में स्वाभाविक रूप से खुली रहती हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और भविष्यवाणी के अनुरूप रखी गई है। ‘उसके लिए चारों ओर आग की दीवार’ सुरक्षा के रूपक को सीधा रखता है, जबकि ‘महिमा होऊँगा’ जानबूझकर मूल की प्रभावशाली विधेय-संज्ञा और उसकी अर्थगत खुलावट को सुरक्षित रखता है।
