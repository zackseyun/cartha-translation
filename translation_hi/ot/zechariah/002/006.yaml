  yaml_path: translation/ot/zechariah/002/006.yaml
  text: And I said[a], “Where are you going?” And he said to me, “To measure Jerusalem[b], to see how wide it is and how long it is.”
translation:
  language: hi
  text: और मैंने कहा, “तुम कहाँ जा रहे हो?” उसने मुझसे कहा, “यरूशलेम को नापने, यह देखने कि वह कितनी चौड़ी और कितनी लंबी है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָ֖נָה
  choice: कहाँ
  rationale: यह प्रश्नवाचक क्रियाविशेषण गंतव्य पूछता है। आधुनिक हिन्दी में ‘कहाँ जा रहे हो?’ स्वाभाविक है और दिशात्मक अर्थ बनाए रखता है।
- source_word: הֹלֵ֑ךְ
  choice: जा रहे हो
  rationale: הלך यहाँ जाने की क्रिया व्यक्त करता है; कृदन्त और सर्वनाम का स्वाभाविक हिन्दी रूप वर्तमान प्रगतिशील अभिव्यक्ति है।
- source_word: לָמֹד֙
  choice: नापने
  rationale: מדד का सीधा अर्थ ‘नापना’ है। यह ‘सर्वेक्षण करने’ की अपेक्षा ठोस क्रिया को अधिक स्पष्टता से सुरक्षित रखता है।
- source_word: אֶת יְר֣וּשָׁלִַ֔ם
  choice: यरूशलेम को
  rationale: यह साक्षात कर्म है; हिन्दी वाक्य में ‘को’ कर्मचिह्न स्वाभाविक है।
- source_word: לִרְא֥וֹת
  choice: ताकि देखूँ
  rationale: ראה का मूल अर्थ ‘देखना’ है। यहाँ उद्देश्य सूचित करने के लिए ‘ताकि’ स्वाभाविक हिन्दी देता है और स्रोत की दृश्यात्मक भाषा बनाए रखता है।
- source_word: כַּמָּֽה רָחְבָּ֖הּ
  choice: वह कितना चौड़ा ... है
  rationale: शाब्दिक ‘उसकी चौड़ाई कितनी है’ के अर्थ को आधुनिक हिन्दी में विशेषणात्मक रूप से स्वाभाविक बनाया गया है। यरूशलेम नगर के लिए पुल्लिंग ‘वह’ और ‘चौड़ा’ प्रयुक्त हैं।
- source_word: וְכַמָּ֥ה אָרְכָּֽהּ
  choice: और कितना लंबा है
  rationale: पहले आयाम के समानांतर दूसरे आयाम को सरल, सममित और मुहावरेदार हिन्दी में व्यक्त करता है।
