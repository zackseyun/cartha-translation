  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। संवाद का सीधा रूप और मापने की ठोस क्रिया सुरक्षित हैं। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘कहाँ’ में दिशात्मक अर्थ और आयामों का मुहावरेदार हिन्दी रूप बिना अर्थहानि के स्पष्ट है।
