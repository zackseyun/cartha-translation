lexical_decisions:
- source_word: הוֹי
  choice: उठो!
  rationale: यहाँ विस्मयादिबोधक शब्द विलाप नहीं, बल्कि तत्काल कार्रवाई के लिए तीखी पुकार है। आधुनिक हिन्दी में “उठो!” इस आह्वान को स्वाभाविक रूप से व्यक्त करता है।
- source_word: צִיּוֹן
