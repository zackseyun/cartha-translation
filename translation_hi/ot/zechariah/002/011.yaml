  rationale: स्थान और व्यक्तिरूप में संबोधित समुदाय के पारंपरिक बाइबलीय नाम को लिप्यंतरित किया गया है।
- source_word: הִמָּלְטִי
  choice: बच निकलो
  rationale: निफ़अल स्त्रीलिंग एकवचन आज्ञार्थक रूप सुरक्षित रूप से निकल जाने की तात्कालिक पुकार देता है। “बच निकलो” क्रिया की आत्मरक्षात्मक और पलायनात्मक दोनों छायाएँ रखता है।
- source_word: יוֹשֶׁבֶת
  choice: तुम जो ... रहती हो
  rationale: स्त्रीलिंग एकवचन कृदंत को संबोधन के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है और मूल का स्त्रीलिंग व्यक्तिरूप सुरक्षित रखा गया है।
- source_word: בַּת בָּבֶל
  choice: बाबेल की बेटी
  rationale: शाब्दिक रचना और भविष्यद्वक्ताई व्यक्तिरूप को बनाए रखा गया है; इसे केवल “बाबेल” कहकर सपाट नहीं किया गया।
theological_decisions:
- issue: स्त्रीलिंग एकवचन संबोधन का अभिप्राय
  choice: सिय्योन को स्त्री के रूप में संबोधित किया गया है, जो बाबेल की बेटी के यहाँ रहती है।
  alternative: इसे बाबेल में रहने वाली किसी प्रतीकात्मक स्त्री अथवा सिय्योन से जुड़े निर्वासित समुदाय के सामूहिक संबोधन के रूप में समझा जा सकता है।
  rationale: हिब्रू के स्त्रीलिंग रूप और संबोधन-संरचना को बनाए रखने से सिय्योन के व्यक्तिरूप और निर्वासित समुदाय के बीच की वास्तविक व्याख्यात्मक गुंजाइश खुली रहती है।
- issue: בַּת בָּבֶל के साथ संबंधसूचक पूर्वसर्ग
  choice: “बाबेल की बेटी के यहाँ”
  alternative: “बाबेल की बेटी में” या “बाबेल की बेटी के बीच”
  rationale: हिब्रू בְּ स्थान या निकट संबंध सूचित कर सकता है। “के यहाँ” हिन्दी में निवास का स्वाभाविक बोध देता है, पर व्यक्तिरूप को नष्ट नहीं करता।
