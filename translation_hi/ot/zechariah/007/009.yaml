source:
  edition: WLC
  text: כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹ֑ר מִשְׁפַּ֤ט אֱמֶת֙ שְׁפֹ֔טוּ וְ/חֶ֣סֶד וְ/רַֽחֲמִ֔ים עֲשׂ֖וּ אִ֥ישׁ אֶת אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/009.yaml
  text: 'Thus says Yahweh of hosts[a], saying: Render true judgments, and show steadfast love and compassion[b], each man to his brother.'
translation:
  language: hi
  text: 'सेनाओं का यहोवा यों कहता है: “सच्चा न्याय करो, और हर एक अपने भाई के प्रति अटल प्रेम और करुणा दिखाए।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह इब्रानी भविष्यद्वक्ताई संदेश-सूत्र का स्वाभाविक, गरिमापूर्ण हिन्दी रूप है; पूर्ण क्रिया को इस सूत्र में वर्तमान काल से व्यक्त करना हिन्दी में उपयुक्त है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: व्यक्तिगत दिव्य नाम को ‘यहोवा’ के रूप में सुरक्षित रखा गया है और צְבָאוֹת का सैन्य तथा महिमामय बल ‘सेनाओं’ से व्यक्त किया गया है।
- source_word: לֵאמֹר
  choice: उद्धरण-चिह्न और द्विबिंदु
  rationale: यह पद आने वाली वाणी का परिचय देता है; हिन्दी में इसे अलग से ‘कहते हुए’ दोहराने के बजाय विराम-चिह्नों से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: מִשְׁפַּט אֱמֶת שְׁפֹטוּ
  choice: सच्चा न्याय करो
  rationale: מִשְׁפַּט אֱמֶת ऐसे न्याय का निर्देश देता है जो सत्य और निष्पक्षता से चिह्नित हो। यह रूप संक्षिप्त और स्वाभाविक रहते हुए संज्ञा और क्रिया की न्यायिक शक्ति बनाए रखता है।
- source_word: חֶסֶד
  choice: अटल प्रेम
  rationale: यह चयन स्थायी निष्ठा, दया और संबंधपरक प्रेम को व्यक्त करता है; केवल ‘दयालुता’ कहने से शब्द का टिकाऊ नैतिक बल घट जाता।
- source_word: רַחֲמִים
  choice: करुणा
  rationale: यह स्वाभाविक आधुनिक हिन्दी में कोमल दया और सहानुभूति का भाव व्यक्त करता है।
- source_word: עֲשׂוּ
  choice: रखे
  rationale: ‘प्रेम और करुणा करना’ की अपेक्षा ‘प्रेम और करुणा रखना’ हिन्दी में अधिक स्वाभाविक है और व्यवहार में इन्हें प्रकट करने की आज्ञा को व्यक्त करता है।
- source_word: אִישׁ אֶת־אָחִיו
  choice: हर एक अपने भाई के प्रति
  rationale: वितरणात्मक अर्थ ‘हर एक’ से और मूल का संबंधसूचक ‘भाई’ सुरक्षित रखा गया है; इसे सामान्यीकृत करके ‘पड़ोसी’ नहीं किया गया।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम प्रत्यक्ष है। हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ परिचित और उच्चारणयोग्य रूप है; इसे सामान्य उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: אִישׁ ... אָחִיו की पुरुषवाची संबंध-भाषा
  choice: हर एक अपने भाई के प्रति
  alternative: एक-दूसरे के प्रति / हर व्यक्ति अपने पड़ोसी के प्रति
  rationale: मूल की प्रतिनिधिक पुरुषवाची और पारिवारिक भाषा को बनाए रखा गया है, जबकि ‘हर एक’ वितरणात्मक आज्ञा को सहज हिन्दी में स्पष्ट करता है।
- issue: חֶסֶד का संबंधपरक बल
  choice: अटल प्रेम
  alternative: दया / कृपा / निष्ठा
  rationale: यहाँ नैतिक आचरण की आज्ञा है; ‘अटल प्रेम’ प्रेम और स्थायी निष्ठा दोनों को खुला रखता है, बिना किसी संकीर्ण सिद्धान्तगत अर्थ को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण भविष्यद्वक्ताई शैली और सामान्य पाठक के लिए सहज वाक्य-विन्यास। मूल की दो बहुवचन आज्ञाओं को हिन्दी में सामुदायिक निर्देश के रूप में रखा गया है; दूसरे खंड में ‘हर एक ... रखे’ वितरणात्मक बल को स्वाभाविक ढंग से व्यक्त करता है।
