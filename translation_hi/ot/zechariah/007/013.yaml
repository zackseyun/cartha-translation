id: ZEC.7.13
reference: Zechariah 7:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֥י כַ/אֲשֶׁר קָרָ֖א וְ/לֹ֣א שָׁמֵ֑עוּ כֵּ֤ן יִקְרְאוּ֙ וְ/לֹ֣א אֶשְׁמָ֔ע אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/013.yaml
  text: And just as he called and they would not listen[a], so they will call and I will not listen, says Yahweh of Armies.
translation:
  language: hi
  text: और जिस प्रकार उसने पुकारा, पर उन्होंने नहीं सुना, उसी प्रकार वे पुकारेंगे, पर मैं नहीं सुनूँगा—सेनाओं के याहवे[a] का यह कहना है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, परंपरागत रूप से, “सेनाओं के प्रभु।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר ... כֵּן
  choice: और जिस प्रकार ... उसी प्रकार
  rationale: यह स्वाभाविक हिन्दी तुलनात्मक रचना इब्रानी के ‘जैसे...वैसे’ संबंध और उसके प्रतिफल को स्पष्ट रखती है।
- source_word: קָרָא / יִקְרְאוּ
  choice: उसने पुकारा / वे पुकारेंगे
  rationale: दोनों रूपों के लिए ‘पुकारना’ रखने से पद का जानबूझकर किया गया शब्दगत और न्याय-संबंधी समानांतर सुरक्षित रहता है।
- source_word: וְלֹא שָׁמֵעוּ / וְלֹא אֶשְׁמָע
  choice: उन्होंने नहीं सुना / मैं नहीं सुनूँगा
  rationale: ‘सुनना’ इब्रानी שׁמע की पुनरावृत्ति को बनाए रखता है और हिन्दी में ध्यान देने तथा स्वीकार करने का भाव भी दे सकता है, बिना आज्ञापालन का अर्थ अनिवार्य रूप से जोड़ने के।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: צְבָאוֹת
  choice: सेनाओं के
  rationale: यह צְבָאוֹת का अर्थ आधुनिक हिन्दी में स्पष्ट करता है और पूरे नाम-विशेषण को ‘सेनाओं के याहवे’ के रूप में स्वाभाविक बनाता है।
- source_word: אָמַר
  choice: का यह कहना है
  rationale: यह भविष्यद्वक्ताओं की अधिकारपूर्ण वाणी के सूत्र को वर्तमान प्रभाव के साथ सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: יְהוָה צְבָאוֹת का अनुवाद
  choice: सेनाओं के याहवे
  alternative: सेनाओं के प्रभु
  rationale: मुख्य पाठ में वाचा-संबंधी व्यक्तिगत नाम יְהוָה को सुरक्षित रखा गया है और צְבָאוֹת का अर्थ स्पष्ट हिन्दी में दिया गया है। परंपरागत उपाधि को पाठ-टिप्पणी में रखा गया है।
- issue: שׁמע में सुनने और मानने के बीच अर्थ-संबंध
  choice: सुनना
  alternative: ध्यान देना / मानना
  rationale: ‘सुनना’ दोनों खंडों की सटीक पारस्परिकता बनाए रखता है और मूल की अर्थगत व्यापकता को समय से पहले केवल ‘आज्ञा मानना’ तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘जिस प्रकार...उसी प्रकार’ मूल की प्रतिशोधात्मक समानांतर रचना को स्पष्ट करता है; दोनों स्थानों पर ‘पुकारना’ और ‘सुनना’ दोहराकर इब्रानी अलंकार सुरक्षित रखा गया है।
