base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/003.yaml
  text: to say to the priests of the house of Yahweh of Armies[a], and to the prophets, saying, “Should I weep in the fifth month[b], abstaining as I have done for these many years?”
translation:
  language: hi
  text: सेनाओं के यहोवा के भवन के याजकों और भविष्यद्वक्ताओं से यह कहने के लिए, “क्या मैं पाँचवें महीने में रोऊँ और धार्मिक परहेज़ करूँ[b], जैसा मैं इतने वर्षों से करता आया हूँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: अर्थात धार्मिक रीति से संयम या परहेज़ करूँ; यहाँ प्रयुक्त इब्रानी शब्द केवल उपवास से अधिक व्यापक रूप से स्वयं को अलग रखने का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר ... לֵאמֹר
  choice: यह कहने के लिए
  rationale: पहला प्रयोग प्रतिनिधिमंडल के उद्देश्य को और दूसरा उसके संदेश को प्रस्तुत करता है। हिन्दी में दोनों को यांत्रिक रूप से दोहराने के बजाय एक स्वाभाविक परिचय में समेटा गया है, जबकि पद का आशय सुरक्षित है।
- source_word: הַכֹּהֲנִים אֲשֶׁר לְבֵית יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा के भवन के याजकों
  rationale: לְבֵית यहाँ याजकों का मंदिर से संबंध बताता है। संबंधसूचक हिन्दी रचना इसे केवल उस समय की भौतिक उपस्थिति तक सीमित नहीं करती।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: व्यक्तिगत वाचा-नाम को ‘यहोवा’ और צְבָאוֹת को अर्थानुसार ‘सेनाओं’ से व्यक्त किया गया है; संयुक्त वाक्यांश में विभक्ति के कारण ‘सेनाओं के यहोवा’ आया है।
- source_word: הַנְּבִיאִים
  choice: भविष्यद्वक्ताओं
  rationale: मान्य भविष्यद्वक्ता-पद के लिए आधुनिक हिन्दी का सीधा और प्रचलित शब्द।
- source_word: הַאֶבְכֶּה
  choice: क्या मैं ... रोऊँ
  rationale: प्रथम पुरुष अपूर्ण क्रिया यहाँ विचार-विमर्श या निर्देश माँगने वाला प्रश्न है; ‘क्या मैं ... रोऊँ’ इस भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: בַּחֹדֶשׁ הַחֲמִשִׁי
  choice: पाँचवें महीने में
  rationale: मूल में दिए क्रमवाचक महीने को ही रखा गया है और बाद का कोई महीना-नाम नहीं जोड़ा गया।
- source_word: הִנָּזֵר
  choice: अपने को अलग रखूँ
  rationale: נזר का निफ़ाल रूप धार्मिक रीति से स्वयं को अलग रखने या परहेज़ करने का व्यापक अर्थ रखता है। यह चयन केवल उपवास तक अर्थ को सीमित नहीं करता।
- source_word: כַּאֲשֶׁר עָשִׂיתִי זֶה כַּמֶּה שָׁנִים
  choice: जैसा मैं इतने वर्षों से करता आया हूँ
  rationale: यह हिन्दी रचना अतीत से वर्तमान तक चली आ रही प्रथा और वर्षों की लंबी अवधि, दोनों को स्वाभाविक रूप से व्यक्त करती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में वाचा का विशिष्ट नाम सीधे उपस्थित है; ‘यहोवा’ उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में बनाए रखता है।
- issue: צְבָאוֹת उपाधि का अर्थ
  choice: सेनाओं
  alternative: गणों
  rationale: ‘सेनाओं’ आधुनिक पाठक के लिए स्पष्ट है और उपाधि की सैन्य तथा स्वर्गीय व्यापकता को खुला रखता है; इसे केवल मानवीय सेनाओं तक सीमित नहीं किया गया।
- issue: הִנָּזֵר में शोक-संबंधी आचरण
  choice: अपने को अलग रखूँ
  alternative: उपवास करूँ
  rationale: संदर्भ में उपवास सम्मिलित हो सकता है, पर मूल क्रिया का अर्थ उससे व्यापक है। इसलिए मुख्य पाठ उस व्यापकता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद पिछले वाक्य पर निर्भर उद्देश्य-वाक्यांश के रूप में आरम्भ होता है, इसलिए आरम्भिक खंड को पूर्ण स्वतंत्र वाक्य नहीं बनाया गया। ‘अपने को अलग रखूँ’ जानबूझकर व्यापक है, ताकि मूल की धार्मिक परहेज़ संबंधी अर्थ-सीमा बनी रहे।
