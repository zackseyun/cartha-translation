id: ZEC.7.1
reference: Zechariah 7:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יְהִי֙ בִּ/שְׁנַ֣ת אַרְבַּ֔ע לְ/דָרְיָ֖וֶשׁ הַ/מֶּ֑לֶךְ הָיָ֨ה דְבַר יְהוָ֜ה אֶל זְכַרְיָ֗ה בְּ/אַרְבָּעָ֛ה לַ/חֹ֥דֶשׁ הַ/תְּשִׁעִ֖י בְּ/כִסְלֵֽו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/001.yaml
  text: And in the fourth year of King Darius[a], the word of Yahweh came to Zechariah on the fourth day of the ninth month, in Kislev.
translation:
  language: hi
  text: राजा दारा के शासन के चौथे वर्ष में, नौवें महीने—अर्थात् किसलेव[a]—के चौथे दिन, याहवे का वचन जकर्याह के पास आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: किसलेव इब्रानी पंचांग के नौवें महीने का नाम है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: …में
  rationale: यह क्रियात्मक सूत्र नए वर्णनात्मक समय-संदर्भ का आरम्भ करता है। आधुनिक हिन्दी में अलग से ‘और ऐसा हुआ’ कहने के बजाय काल-वाचक वाक्यांश से इसका कार्य स्वाभाविक रूप से व्यक्त होता है।
- source_word: בִּשְׁנַת אַרְבַּע לְדָרְיָוֶשׁ הַמֶּלֶךְ
  choice: राजा दारा के शासन के चौथे वर्ष में
  rationale: यह राजकीय वर्ष के अनुसार तिथि बताने का सूत्र है। ‘शासन के’ जोड़ने से हिन्दी में स्पष्ट होता है कि बात दारा के राज्यकाल के चौथे वर्ष की है।
- source_word: הָיָה דְבַר יְהוָה אֶל זְכַרְיָה
  choice: याहवे का वचन जकर्याह के पास आया
  rationale: इब्रानी में शाब्दिक रूप से ‘वचन … हुआ/था’ है, पर यह भविष्यद्वाणी मिलने का प्रचलित सूत्र है; ‘के पास आया’ उसका स्वाभाविक और अर्थसंगत हिन्दी रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में उसका लिप्यंतरण किया गया है।
- source_word: בְּאַרְבָּעָה לַחֹדֶשׁ הַתְּשִׁיעִי
  choice: नौवें महीने … के चौथे दिन
  rationale: मूल में ‘नौवें महीने की चौथी [तिथि]’ है। हिन्दी में आशय स्पष्ट करने के लिए ‘दिन’ का प्रयोग किया गया है।
- source_word: בְּכִסְלֵו
  choice: अर्थात् किसलेव
  rationale: किसलेव उसी नौवें महीने का नाम है। ‘अर्थात्’ दोनों काल-सूचकों का संबंध स्पष्ट करता है और महीने के नाम का लिप्यंतरण सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसे उपाधि में बदले बिना आधुनिक हिन्दी में निकट लिप्यंतरण के रूप में प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल की तिथि-संबंधी औपचारिकता सुरक्षित है, जबकि ‘अर्थात्’ और ‘शासन के’ से सामान्य हिन्दी पाठक के लिए संबंध स्पष्ट किया गया है।
