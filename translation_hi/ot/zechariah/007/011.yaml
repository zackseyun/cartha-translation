  text: וַ/יְמָאֲנ֣וּ לְ/הַקְשִׁ֔יב וַ/יִּתְּנ֥וּ כָתֵ֖ף סֹרָ֑רֶת וְ/אָזְנֵי/הֶ֖ם הִכְבִּ֥ידוּ מִ/שְּׁמֽוֹעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/011.yaml
  text: But they refused to pay attention[a], turned a stubborn shoulder[b], and made their ears heavy so as not to hear.
translation:
  language: hi
  text: परन्तु उन्होंने ध्यान देने से इनकार किया, हठीलेपन से अपना कंधा फेर लिया[a], और अपने कान भारी कर लिए, ताकि वे न सुनें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक भाव है, “हठीला/विद्रोही कंधा दिया”; यह अड़ियल प्रतिरोध का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या “अपने कान सुन्न कर लिए” अथवा “अपने कान बंद कर लिए।” इब्रानी में शाब्दिक रूप से “अपने कान भारी कर लिए” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ לְהַקְשִׁיב
  choice: उन्होंने ध्यान देने से इनकार किया
  rationale: מָאֵן स्वेच्छापूर्वक इनकार को और הִקְשִׁיב ध्यान लगाकर सुनने को व्यक्त करता है; यह चयन दोनों भावों को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: וַיִּתְּנוּ כָתֵף סֹרָרֶת
  choice: हठ में अपना कंधा फेर लिया
  rationale: यह हठीले प्रतिरोध का शारीरिक मुहावरा है। हिन्दी में ‘कंधा फेरना’ स्रोत की देहात्मक छवि और जानबूझकर विरोध—दोनों को बनाए रखता है।
- source_word: סֹרָרֶת
  choice: हठ में
  rationale: यह शब्द अड़ियल अथवा विद्रोही प्रतिरोध बताता है। ‘हठ में’ इस नैतिक और इच्छापूर्ण अड़ियलपन को सहज हिन्दी में व्यक्त करता है।
- source_word: וְאָזְנֵיהֶם הִכְבִּידוּ
  choice: अपने कान भारी कर लिए
  rationale: मूल इब्रानी की ‘कान भारी करना’ वाली ठोस छवि जानबूझकर ग्रहण न करने को दिखाती है; इसलिए उसे अमूर्त ‘अनसुना किया’ में नहीं बदला गया।
- source_word: מִשְּׁמוֹעַ
  choice: ताकि वे सुन न सकें
  rationale: מן के साथ क्रियार्थक रूप यहाँ सुनने को रोकने अथवा उससे बचने का परिणाम/उद्देश्य प्रकट करता है; हिन्दी वाक्य उस इच्छापूर्ण अवरोध को स्पष्ट रखता है।
theological_decisions:
- issue: विद्रोह और बहरेपन के देहात्मक रूपक
  choice: ‘कंधा फेर लिया’ और ‘कान भारी कर लिए’ की इब्रानी छवियाँ बनाए रखी गईं।
  alternative: ‘उन्होंने हठपूर्वक आज्ञा मानने से इनकार किया और कान बंद कर लिए।’
  rationale: मूल पद वाचा-संबंधी विद्रोह को ठोस शारीरिक क्रियाओं से चित्रित करता है। इन रूपकों को बनाए रखना उसकी अलंकारिक तीव्रता और जानबूझकर न सुनने के भाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप। स्रोत की समानांतर क्रियाओं तथा कंधे और कान की देहात्मक छवियों को सुरक्षित रखा गया है।
