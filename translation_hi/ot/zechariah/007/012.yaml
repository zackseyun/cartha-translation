base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/012.yaml
  text: They made their hearts like diamond-hard stone[a], so as not to hear the law and the words that Yahweh of Armies had sent by his Spirit through the former prophets[c][b]. So great wrath came from Yahweh of Armies.
translation:
  language: hi
  text: उन्होंने अपने हृदयों को अत्यन्त कठोर पत्थर[a] बना लिया, ताकि वे व्यवस्था[b] और उन वचनों को न सुनें जिन्हें सेनाओं के याहवे[c] ने अपनी आत्मा के द्वारा पहले के भविष्यद्वक्ताओं के माध्यम से भेजे थे। तब सेनाओं के याहवे की ओर से बड़ा क्रोध आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू शब्द שָׁמִיר किसी अत्यन्त कठोर पदार्थ को दर्शाता है; परंपरागत अनुवाद ‘अदमंत’ है, और संभवतः इसका अर्थ ‘चकमक पत्थर’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘शिक्षा’ या ‘निर्देश’।
    reason: lexical_alternative
  - marker: c
    text: 'परंपरागत अनुवाद: ‘सेनाओं का प्रभु’। ईश्वरीय नाम को ‘यहोवा’ भी लिखा जाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבָּם
  choice: अपने हृदयों को
  rationale: לֵבָב यहाँ उनकी भीतरी इच्छा, मनोवृत्ति और नैतिक संकल्प का सूचक है। बहुवचन कर्ता के साथ आधुनिक हिन्दी में ‘अपने हृदयों’ स्वाभाविक है।
- source_word: שָׂמוּ שָׁמִיר
  choice: हीरे-जैसे कठोर पत्थर बना लिया
  rationale: שׂוּם के साथ यह पद हृदय को एक विशेष दशा में कर लेने का अर्थ देता है। שָׁמִיר किसी अत्यन्त कठोर पदार्थ या पत्थर का नाम है; उसकी ठीक पहचान अनिश्चित होने के कारण स्पष्ट उपमा और पादटिप्पणी दोनों रखे गए हैं।
- source_word: מִשְּׁמוֹעַ
  choice: ताकि वे ... न सुनें
  rationale: מִן के साथ infinitive यहाँ सुनने से अपने को रोकने या सुनने से इनकार करने का भाव देता है; हिन्दी में नकार को स्पष्ट करना आवश्यक है।
- source_word: הַתּוֹרָה
  choice: व्यवस्था
  rationale: תּוֹרָה का अर्थ शिक्षा या निर्देश भी हो सकता है, पर यहाँ यह परमेश्वर की अधिकारपूर्ण वाचा-संबंधी व्यवस्था को दर्शाता है। वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: הַדְּבָרִים
  choice: वचनों
  rationale: דְּבָרִים यहाँ भविष्यद्वक्ताओं द्वारा पहुँचाए गए ईश्वरीय कथनों या संदेशों को दर्शाता है; ‘वचन’ सीधा और गरिमापूर्ण हिन्दी रूप है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: יְהוָה को उसके वाचा-नाम ‘यहोवा’ से और צְבָאוֹת को आधुनिक, बोधगम्य ‘सेनाओं’ से व्यक्त किया गया है। पारंपरिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: בְּרוּחוֹ
  choice: अपने आत्मा के द्वारा
  rationale: संदर्भ में רוּחַ परमेश्वर की उस दिव्य सक्रियता को दर्शाता है जिसके द्वारा उसने भविष्यद्वक्ताओं के माध्यम से अपने वचन भेजे। ‘आत्मा’ व्यक्तिगत दिव्य अभिकरण को बनाए रखता है।
- source_word: בְּיַד הַנְּבִיאִים הָרִאשֹׁנִים
  choice: पहले के भविष्यद्वक्ताओं के हाथ से
  rationale: בְּיַד का शाब्दिक मुहावरा ‘के हाथ से’ माध्यम या अभिकरण दर्शाता है। इसे बनाए रखने से मूल की ठोस अभिव्यक्ति सुरक्षित रहती है; הָרִאשֹׁנִים का अर्थ इतिहास में पहले हुए भविष्यद्वक्ता है, न कि किसी तकनीकी ग्रंथ-विभाग का नाम।
- source_word: וַיְהִי קֶצֶף גָּדוֹל
  choice: तब ... बड़ा प्रकोप आया
  rationale: וַיְהִי घटना के घटित होने और पिछली बात के परिणाम को दिखाता है। ‘तब’ सरल संयोजन को बिना अत्यधिक तर्कात्मक बल दिए व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय वाचा-नाम प्रत्यक्ष है। हिन्दी पाठकों के लिए परिचित ‘यहोवा’ नाम को पद में रखा गया है, न कि उसे केवल पदवी ‘प्रभु’ से बदला गया है।
- issue: רוּחוֹ का आशय
  choice: अपने आत्मा के द्वारा
  alternative: अपनी आत्मा/श्वास के द्वारा
  rationale: यह वाक्य परमेश्वर द्वारा भविष्यद्वक्ताओं के माध्यम से वचन भेजे जाने की दिव्य अभिकरण-श्रृंखला बताता है। ‘आत्मा’ इस अर्थ को सुरक्षित रखता है, जबकि पाठ से आगे कोई विस्तृत सिद्धान्त नहीं जोड़ता।
- issue: צְבָאוֹת का अनुवाद
  choice: सेनाओं
  alternative: सेनाओं का प्रभु / सबाओत
  rationale: ‘सेनाओं’ हिब्रू पदवी का अर्थ आधुनिक हिन्दी में स्पष्ट करता और उसकी सामर्थ्यपूर्ण, सैन्य/स्वर्गीय व्यापकता बनाए रखता है।
- issue: दिव्य क्रोध की परिणति
  choice: यहोवा की ओर से बड़ा प्रकोप आया
  alternative: बड़ा क्रोध हुआ
  rationale: מֵאֵת स्पष्ट करता है कि प्रकोप यहोवा की ओर से आया। अनुवाद इस ईश्वरीय न्याय को न तो कम करता है, न उसके कारण से अधिक व्याख्या जोड़ता है।
