  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘हृदयों को ... कठोर पत्थर बना लिया’ मूल रूपक को बनाए रखता है। ‘पहले के भविष्यद्वक्ता’ तकनीकी कैननिक पदनाम से बचता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
