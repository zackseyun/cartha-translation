source:
  edition: WLC
  text: הֲ/ל֣וֹא אֶת הַ/דְּבָרִ֗ים אֲשֶׁ֨ר קָרָ֤א יְהוָה֙ בְּ/יַד֙ הַ/נְּבִיאִ֣ים הָ/רִֽאשֹׁנִ֔ים בִּ/הְי֤וֹת יְרוּשָׁלִַ֨ם֙ יֹשֶׁ֣בֶת וּ/שְׁלֵוָ֔ה וְ/עָרֶ֖י/הָ סְבִיבֹתֶ֑י/הָ וְ/הַ/נֶּ֥גֶב וְ/הַ/שְּׁפֵלָ֖ה יֹשֵֽׁב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/007.yaml
  text: Are these not the words that Yahweh proclaimed by the former prophets[a], when Jerusalem was inhabited and at ease, with her surrounding cities[c][b], and the Negev and the Shephelah were inhabited?
translation:
  language: hi
  text: क्या ये वही वचन नहीं हैं जिनकी घोषणा याहवे ने पहले के भविष्यद्वक्ताओं के द्वारा[a] की थी, जब यरूशलेम बसा हुआ और निश्चिंत[b] था, उसके आसपास के नगर बसे हुए थे, और नेगेव तथा शफेला[c] भी बसे हुए थे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पहले के भविष्यद्वक्ताओं के हाथ से”; यह हिब्रू मुहावरा उनके माध्यम से बोलने का भाव देता है।
    reason: lexical_alternative
  - marker: b
    text: या “सुरक्षित।” हिब्रू शब्द में शांति, सुरक्षा और निर्विघ्न समृद्धि के भाव सम्मिलित हो सकते हैं।
    reason: lexical_alternative
  - marker: c
    text: “शफेला” यहूदा के पश्चिमी निचले मैदानों और पहाड़ी ढलानों के क्षेत्र का नाम है।
    reason: cultural_note
lexical_decisions:
- source_word: הֲלֹא אֶת הַדְּבָרִים
  choice: क्या ये वे वचन नहीं हैं
  rationale: हिब्रू में यह ऐसा आलंकारिक प्रश्न है जिसका अपेक्षित उत्तर हाँ है। निश्चित ‘वचनों’ को हिन्दी में स्वाभाविक रूप से ‘ये वे वचन’ कहा गया है।
- source_word: קָרָא
  choice: घोषणा की थी
  rationale: भविष्यद्वक्ताओं के माध्यम से दिए गए सार्वजनिक और अधिकारपूर्ण संदेश के लिए ‘घोषणा’ उपयुक्त है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: בְּיַד הַנְּבִיאִים הָרִאשֹׁנִים
  choice: पहले के भविष्यद्वक्ताओं के द्वारा
  rationale: ‘हाथ से’ का हिब्रू मुहावरा माध्यम या अभिकरण बताता है। ‘पहले के’ कालगत अर्थ को स्पष्ट करता है और किसी पारंपरिक ग्रंथ-विभाग का अनावश्यक संकेत नहीं देता।
- source_word: יְרוּשָׁלִַם יֹשֶׁבֶת
  choice: यरूशलेम बसा हुआ ... था
  rationale: नगर के संबंध में ישׁב का भाव उसके आबाद या बसे होने का है।
- source_word: וּשְׁלֵוָה
  choice: और निश्चिन्त
  rationale: यह शब्द शांति, सुरक्षा और निर्विघ्न दशा का भाव रखता है; ‘निश्चिन्त’ इस व्यापकता को सहज हिन्दी में व्यक्त करता है।
- source_word: וְעָרֶיהָ סְבִיבֹתֶיהָ
  choice: उसके आसपास के नगर
  rationale: यह यरूशलेम के चारों ओर स्थित नगरों को सूचित करता है और सम्बन्धवाचक रूप को बनाए रखता है।
- source_word: וְהַנֶּגֶב
  choice: नेगेव
  rationale: यहाँ यह केवल दक्षिण दिशा नहीं, बल्कि यहूदा के दक्षिणी भौगोलिक क्षेत्र का नाम है।
- source_word: וְהַשְּׁפֵלָה
  choice: शफेला
  rationale: यह यहूदा के पश्चिमी निचले भूभाग का विशिष्ट क्षेत्रीय नाम है, इसलिए इसका लिप्यंतरण रखा गया है।
- source_word: יֹשֵׁב
  choice: बसे हुए थे
  rationale: एकवचन कृदन्त दोनों क्षेत्रों के लिए सामूहिक रूप में प्रयुक्त है; हिन्दी में बहुवचन क्रिया स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में चार अक्षरों वाला विशिष्ट ईश्वरीय नाम है। ‘याहवे’ उसे सामान्य उपाधि में बदले बिना आधुनिक हिन्दी में निकट लिप्यंतरण देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आलंकारिक प्रश्न की संरचना, नगर और क्षेत्रों के आबाद होने की समानान्तरता तथा שׁלו के सुरक्षा/निश्चिन्तता-संबंधी अर्थ-विस्तार को सुरक्षित रखा गया है।
