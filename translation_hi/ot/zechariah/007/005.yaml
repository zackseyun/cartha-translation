source:
  edition: WLC
  text: אֱמֹר֙ אֶל כָּל עַ֣ם הָ/אָ֔רֶץ וְ/אֶל הַ/כֹּהֲנִ֖ים לֵ/אמֹ֑ר כִּֽי צַמְתֶּ֨ם וְ/סָפ֜וֹד בַּ/חֲמִישִׁ֣י וּ/בַ/שְּׁבִיעִ֗י וְ/זֶה֙ שִׁבְעִ֣ים שָׁנָ֔ה הֲ/צ֥וֹם צַמְתֻּ֖/נִי אָֽנִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/005.yaml
  text: 'Speak to all the people of the land and to the priests[a], saying: When you fasted and mourned in the fifth month and in the seventh, for these seventy years, was it really for me that you fasted?'
translation:
  language: hi
  text: देश के सब लोगों और याजकों से कह, ‘जब तुम इन सत्तर वर्षों के दौरान पाँचवें और सातवें महीने में उपवास रखते और शोक मनाते रहे, तो क्या तुमने सचमुच मेरे ही लिए उपवास रखा था?[a]’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: ‘क्या तुमने मेरे लिए—वास्तव में मेरे लिए—उपवास रखा था?’ हिब्रू में क्रिया पर जोर देने वाली रचना है और अंत में स्वतंत्र सर्वनाम ‘मैं’ आया है, जिससे विशेष बल पड़ता है।'
    reason: हिब्रू की जोरदार क्रिया-रचना और अंत में आए स्वतंत्र सर्वनाम के बल को अधिक प्रत्यक्ष ढंग से दिखाना।
lexical_decisions:
- source_word: עַם הָאָרֶץ
  choice: देश के सब लोग
  rationale: यह पदबंध यहाँ किसी विशेष सामाजिक वर्ग के बजाय देश में रहने वाले लोगों को व्यापक रूप से सूचित करता है। ‘देश के सब लोग’ हिब्रू अभिव्यक्ति और כָּל, दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: כֹּהֵן का प्रचलित और प्रसंगानुकूल हिन्दी रूप।
- source_word: צַמְתֶּם וְסָפוֹד
  choice: उपवास और शोक करते आए हो
  rationale: दोनों क्रियाएँ धार्मिक उपवास और उससे जुड़े शोक को व्यक्त करती हैं। अवधि के उल्लेख के कारण ‘करते आए हो’ हिन्दी में दीर्घकालीन अभ्यास को स्वाभाविक ढंग से प्रकट करता है।
- source_word: בַּחֲמִישִׁי וּבַשְּׁבִיעִי
  choice: पाँचवें और सातवें महीने में
  rationale: हिब्रू में ‘महीना’ निहित है; हिन्दी में स्पष्टता के लिए इसे जोड़ा गया है।
- source_word: וְזֶה שִׁבְעִים שָׁנָה
  choice: इन सत्तर वर्षों से
  rationale: यह चुनाव वर्तमान समय तक चली आ रही सत्तर वर्ष की अवधि और संकेतवाचक זֶה, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: הֲצוֹם צַמְתֻּנִי אָֽנִי
  choice: क्या तुमने सचमुच मेरे ही लिए उपवास किया था?
  rationale: क्रिया की जोरदार हिब्रू रचना को ‘सचमुच’ और वाक्य के अंत में आए स्वतंत्र सर्वनाम के बल को ‘मेरे ही लिए’ से व्यक्त किया गया है। प्रश्न की आलंकारिक और चुनौतीपूर्ण प्रकृति सुरक्षित रहती है।
- source_word: אֱמֹר ... לֵאמֹר
  choice: से कह
  rationale: दोहराए गए हिब्रू कथन-सूत्र को हिन्दी में अनावश्यक रूप से ‘कह...कहते हुए’ दोहराने के बजाय स्वाभाविक प्रत्यक्ष-वचन परिचय से व्यक्त किया गया है।
theological_decisions:
- issue: उपवास के विषय में आलंकारिक प्रश्न का आशय
  choice: प्रश्न इस बात को चुनौती देता है कि उनका उपवास वास्तव में परमेश्वर के लिए था या नहीं।
  alternative: इसे उन उपवासों को पूर्णतः अमान्य घोषित करने के रूप में समझा जा सकता है।
  rationale: हिब्रू का जोर उपवास के होने से इनकार नहीं करता, बल्कि उसके परमेश्वर की ओर निर्देशित होने पर प्रश्न उठाता है। अनुवाद इस तनाव को बनाए रखता है और पद से आगे कोई धर्मवैचारिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—गरिमापूर्ण, किंतु सामान्य पाठक के लिए सहज। ‘उपवास’, ‘शोक’ और ‘याजक’ जैसे स्थापित बाइबलीय शब्द रखे गए हैं। प्रत्यक्ष आज्ञा में एकवचन ‘कह’ मूल हिब्रू के अनुरूप है।
