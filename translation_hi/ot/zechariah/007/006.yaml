  text: וְ/כִ֥י תֹאכְל֖וּ וְ/כִ֣י תִשְׁתּ֑וּ הֲ/ל֤וֹא אַתֶּם֙ הָ/אֹ֣כְלִ֔ים וְ/אַתֶּ֖ם הַ/שֹּׁתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/006.yaml
  text: And when you eat and when you drink[a], is it not you who are eating, and you who are drinking?
translation:
  language: hi
  text: और जब तुम खाते हो और जब तुम पीते हो[a], तो क्या खानेवाले तुम ही नहीं हो, और पीनेवाले भी तुम ही नहीं हो?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और यदि तुम खाते हो और यदि तुम पीते हो।” इब्रानी संयोजक का अर्थ समयसूचक (“जब”) या शर्तसूचक (“यदि”) हो सकता है; यहाँ तर्क के प्रवाह में “जब” अधिक उपयुक्त लगता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: और जब
  rationale: כִּי को यहाँ पिछले पद में उपवास के उल्लेख के समानांतर समयसूचक मानना प्रसंग के प्रवाह के अनुकूल है; फिर भी शर्तसूचक अर्थ संभव है और उसे पादटिप्पणी में रखा गया है।
- source_word: תֹאכְלוּ
  choice: तुम खाते हो
  rationale: अपूर्ण रूप यहाँ सामान्य या बार-बार होने वाली क्रिया व्यक्त करता है; हिन्दी का सामान्य वर्तमान स्वाभाविक है।
- source_word: וְכִי תִשְׁתּוּ
  choice: और जब तुम पीते हो
  rationale: दोहराया गया संयोजक पहले खंड के समानांतर है और इब्रानी वाक्य की संतुलित संरचना बनाए रखता है।
- source_word: הֲלוֹא
  choice: तो क्या ... नहीं
  rationale: यह सहमति की अपेक्षा करने वाला आलंकारिक प्रश्न है; यह हिन्दी संरचना उसके प्रश्नात्मक और बलात्मक स्वर को बनाए रखती है।
- source_word: אַתֶּם הָאֹכְלִים
  choice: खानेवाले तुम ही
  rationale: स्वतंत्र सर्वनाम और संज्ञार्थक कृदंत का बल ‘तुम ही’ से व्यक्त होता है, बिना ‘अपने लिए’ जैसी व्याख्या मूल पाठ में जोड़े।
- source_word: וְאַתֶּם הַשֹּׁתִים
  choice: और पीनेवाले भी तुम ही
  rationale: दूसरे समानांतर खंड में स्वतंत्र सर्वनाम का बल तथा खाने-पीने की संतुलित पुनरावृत्ति सुरक्षित रखी गई है।
theological_decisions:
- issue: खाने-पीने की आत्मकेंद्रित प्रकृति पर आलंकारिक बल
  choice: अनुवाद में ‘तुम ही’ की पुनरावृत्ति द्वारा यह दिखाया गया है कि खाने और पीने का लाभ उन्हीं को मिलता है।
  alternative: इसे केवल साधारण खाने-पीने के बारे में एक तटस्थ कथन के रूप में प्रस्तुत करना।
  rationale: इब्रानी के स्वतंत्र सर्वनामों और संज्ञार्थक कृदंतों में स्पष्ट बल है। अनुवाद उस बल को रखता है, पर ‘अपने ही लिए’ जोड़कर संदर्भगत आशय को मूल कथन से अधिक स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज प्रश्नात्मक रूप अपनाया गया है। ‘खानेवाले’ और ‘पीनेवाले’ इब्रानी कृदंतों की समानांतरता रखते हैं, जबकि ‘तुम ही’ स्वतंत्र सर्वनामों का बल स्पष्ट करता है।
