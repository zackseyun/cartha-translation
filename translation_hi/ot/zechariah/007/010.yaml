  yaml_path: translation/ot/zechariah/007/010.yaml
  text: Do not oppress the widow[a], the fatherless, the sojourner, or the poor[c][b], and do not devise evil in your hearts against one another.
translation:
  language: hi
  text: विधवा, अनाथ, परदेशी[a] और गरीब पर अत्याचार मत करो, और अपने मन में एक-दूसरे के विरुद्ध[b] बुराई की योजना मत बनाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “परदेशी” से आशय इस्राएलियों के बीच रहने वाले गैर-इस्राएली निवासी से है।
    reason: cultural_note
  - marker: b
    text: शाब्दिक रूप से, “हर एक अपने भाई के विरुद्ध” या “एक व्यक्ति अपने भाई के विरुद्ध।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנָה
  choice: विधवा
  rationale: शोकग्रस्त पति-विहीन स्त्री के लिए मानक और सटीक हिन्दी शब्द; यह इब्रानी बाइबल में असुरक्षित लोगों की प्रचलित सूची का अंग है।
- source_word: יָתוֹם
  choice: अनाथ
  rationale: आधुनिक हिन्दी में स्वाभाविक शब्द। इब्रानी शब्द विशेषतः पिता-विहीन बच्चे को सूचित कर सकता है, पर हिन्दी में ‘अनाथ’ इस सामाजिक रूप से असुरक्षित वर्ग को स्पष्ट रूप से व्यक्त करता है।
- source_word: גֵּר
  choice: परदेशी
  rationale: यहाँ किसी क्षणिक यात्री के बजाय इस्राएल के बीच रहने वाले गैर-इस्राएली निवासी का बोध है; सांस्कृतिक अर्थ पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: עָנִי
  choice: गरीब
  rationale: इस सामाजिक न्याय की सूची में आर्थिक अभाव और असुरक्षा प्रमुख है; ‘गरीब’ सबसे स्पष्ट आधुनिक हिन्दी समतुल्य है।
- source_word: תַּעֲשֹׁקוּ
  choice: अत्याचार मत करो
  rationale: क्रिया में निर्बलों का अन्यायपूर्ण दमन, शोषण या उनका हक मारना शामिल है; ‘अत्याचार करना’ इस व्यापक नैतिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רָעַת
  choice: बुराई
  rationale: ‘हानि’ की तुलना में यह मूल शब्द की नैतिक गंभीरता को अधिक पूर्ण रूप से बनाए रखता है।
- source_word: תַּחְשְׁבוּ
  choice: योजना मत बनाओ
  rationale: ‘बुराई’ और ‘मन में’ के साथ यह केवल सोचने नहीं, बल्कि जानबूझकर बुरा इरादा या षड्यंत्र रचने का भाव देता है।
- source_word: אִישׁ אָחִיו
  choice: एक-दूसरे के विरुद्ध
  rationale: मूल का पुरुषवाचक वितरणात्मक मुहावरा यहाँ समुदाय के सदस्यों के बीच पारस्परिक व्यवहार बताता है; यह चयन स्वाभाविक हिन्दी में वही अर्थ देता है, जबकि अधिक शाब्दिक रूप पाद-टिप्पणी में रखा गया है।
- source_word: בִּלְבַבְכֶם
  choice: अपने मन में
  rationale: इब्रानी ‘अपने हृदयों में’ आंतरिक विचार और अभिप्राय का मुहावरा है; आधुनिक हिन्दी में ‘अपने मन में’ उसका स्वाभाविक समतुल्य है।
theological_decisions:
- issue: אִישׁ אָחִיו का लिंग-चिह्नित वितरणात्मक मुहावरा
  choice: एक-दूसरे के विरुद्ध
  alternative: हर एक अपने भाई के विरुद्ध
  rationale: वाक्य का आशय नैतिक आदेश को केवल पुरुषों तक सीमित करना नहीं, बल्कि समुदाय में परस्पर बुराई की योजना को रोकना है। मुख्य पाठ में स्वाभाविक पारस्परिक अभिव्यक्ति रखी गई है और मूल की अधिक शाब्दिक संरचना पाद-टिप्पणी में दी गई है।
