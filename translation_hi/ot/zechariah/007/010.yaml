  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘मत करो/मत बनाओ’ बहुवचन समुदाय को दिए गए निषेध को स्वाभाविक हिन्दी में व्यक्त करता है। मुख्य पाठ में [a] पाद-टिप्पणी चिह्न सम्मिलित है।
