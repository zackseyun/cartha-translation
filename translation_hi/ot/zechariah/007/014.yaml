source:
  edition: WLC
  text: וְ/אֵ֣סָעֲרֵ֗/ם עַ֤ל כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר לֹֽא יְדָע֔וּ/ם וְ/הָ/אָ֨רֶץ֙ נָשַׁ֣מָּה אַֽחֲרֵי/הֶ֔ם מֵֽ/עֹבֵ֖ר וּ/מִ/שָּׁ֑ב וַ/יָּשִׂ֥ימוּ אֶֽרֶץ חֶמְדָּ֖ה לְ/שַׁמָּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/014.yaml
  text: And I scattered them with a storm wind among all the nations that they had not known[a], and the land was left desolate behind them, with no one passing through or returning[b]; thus they made the pleasant land a desolation.
translation:
  language: hi
  text: और मैंने उन्हें आँधी की तरह उन सब जातियों के बीच तितर-बितर कर दिया, जिन्हें वे नहीं जानते थे[a]। उनके चले जाने के बाद देश उजाड़ पड़ा रहा; कोई उसमें से गुजरता या लौटता न था। इस प्रकार उन्होंने उस मनोहर देश[b] को उजाड़ बना दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने उन्हें आँधी की तरह उन सब जातियों के बीच उड़ा दिया।” हिब्रू क्रिया में केवल साधारण बिखराव नहीं, बल्कि आँधी का सजीव बिंब है।
    reason: lexical_alternative
  - marker: b
    text: “मनोहर देश” का अनुवाद “मनभावना देश” या “चाहने योग्य देश” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵסָעֲרֵם
  choice: मैंने उन्हें आँधी में उड़ाकर...बिखेर दिया
  rationale: पिएल रूप में סער साधारण बिखेरने से अधिक आँधी द्वारा उड़ा दिए जाने की सजीव छवि रखता है; हिन्दी में यह प्रयोग कारणात्मक बल और तूफ़ानी बिंब दोनों बचाता है।
- source_word: עַל כָּל הַגּוֹיִם
  choice: उन सब जातियों के बीच
  rationale: बिखेरने की क्रिया के साथ עַל यहाँ विभिन्न जातियों के बीच फैलाए जाने का स्थान-वितरण सूचित करता है।
- source_word: אֲשֶׁר לֹא יְדָעוּם
  choice: जिन्हें वे नहीं जानते थे
  rationale: सम्बन्धवाचक उपवाक्य अपरिचित विदेशी जातियों की ओर संकेत करता है; हिन्दी में 'जिन्हें' राष्ट्रों/लोगों के मानवीय पक्ष को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְהָאָרֶץ נָשַׁמָּה אַחֲרֵיהֶם
  choice: उनके चले जाने के बाद देश ऐसा उजाड़ पड़ा
  rationale: निष्प्राण/उजाड़ हो जाने की परिणामात्मक दशा और लोगों के हटने के बाद बची वीरानी दोनों को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: מֵעֹבֵר וּמִשָּׁב
  choice: उसमें से कोई आता-जाता न था
  rationale: दोनों कृदन्त मार्ग से गुजरने और लौटने वाले मानवीय आवागमन के पूर्ण अभाव को बताते हैं; हिन्दी का मुहावरा 'आता-जाता' इसी द्विदिश भाव को सहजता से देता है।
- source_word: וַיָּשִׂימוּ
  choice: इस प्रकार उन्होंने...बना दिया
  rationale: वाव-क्रमिक रूप पिछले कथन का परिणाम आगे बढ़ाता है और बहुवचन कर्ता लोगों की जिम्मेदारी बनाए रखता है।
- source_word: אֶרֶץ חֶמְדָּה
  choice: मनोहर देश
  rationale: חֶמְדָּה चाहने योग्य, रमणीय या आनंददायक होने का भाव रखता है; 'मनोहर' मूल्यांकन को संक्षिप्त और गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: לְשַׁמָּה
  choice: उजाड़ बना दिया
  rationale: संज्ञात्मक हिब्रू अभिव्यक्ति परिणामी विनाश और वीरानी बताती है; हिन्दी में यह पद 'मनोहर देश' के साथ प्रभावी विरोध बनाए रखता है।
theological_decisions:
- issue: न्याय और निर्वासन में कर्तृत्व
  choice: बिखेरने वाले के रूप में परमेश्वर का प्रथम-पुरुष कर्तृत्व स्पष्ट रखा गया है, और देश को उजाड़ बनाने की जिम्मेदारी लोगों पर रखी गई है।
  alternative: ऐसा निर्वैयक्तिक अनुवाद जो निर्वासन में परमेश्वर के प्रत्यक्ष कर्तृत्व को नरम कर दे।
  rationale: हिब्रू का प्रथम-पुरुष क्रियारूप बिखेरने का कार्य परमेश्वर को देता है, जबकि अंतिम बहुवचन क्रिया लोगों को देश की उजाड़ दशा के लिए उत्तरदायी ठहराती है; दोनों पक्षों को मिलाए बिना सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक-पाठ योग्य रूप अपनाया गया है। 'जातियों', 'आँधी', 'मनोहर' और 'उजाड़' जैसे सामान्यतः समझे जाने वाले शब्द चुने गए हैं; मूल की कर्तृता, परिणामात्मकता और काव्यात्मक विरोध सुरक्षित हैं।
