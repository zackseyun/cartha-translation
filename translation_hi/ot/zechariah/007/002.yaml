  text: Bethel sent Sharezer and Regem-melech and his men to entreat the favor of Yahweh[b][a],
translation:
  language: hi
  text: बेतेल[a] ने शरेसेर, रेगेम-मेलेक और उसके आदमियों को याहवे से कृपा की विनती करने[b] भेजा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘बेतेल’। इसे ‘परमेश्वर का घर’ भी समझा जा सकता है, पर यहाँ इसके स्थान का नाम होने की अधिक संभावना है।
    reason: alternative_reading
  - marker: b
    text: या, “याहवे की कृपा पाने के लिए उससे विनती करने।” इब्रानी मुहावरे का शाब्दिक भाव है, “याहवे के मुख को कोमल करने/उसके सामने विनती करने।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: भेजा
  rationale: वाव-क्रमयुक्त क्रिया यहाँ कथा की सामान्य भूतकालीन घटना बताती है; हिन्दी में सरल भूतकाल स्वाभाविक है।
- source_word: בֵּית אֵל
  choice: बेतेल
  rationale: इस वाक्य में यह सामान्यतः स्थान अथवा वहाँ के समुदाय का नाम है, इसलिए इसका अनुवाद ‘परमेश्वर का घर’ न करके नाम के रूप में लिप्यंतरित किया गया है।
- source_word: שַׂר אֶצֶר
  choice: शरेसेर
  rationale: यह व्यक्ति का नाम है; इसे अर्थानुवाद के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: וְרֶגֶם מֶלֶךְ
  choice: रेगेम-मेलेक
  rationale: यह संयुक्त व्यक्तिगत नाम है; योजक-चिह्न उसके दो घटकों को स्पष्ट रखता है और इसे किसी राजकीय पदवी समझने से बचाता है।
- source_word: וַאֲנָשָׁיו
  choice: और उसके आदमियों को
  rationale: तृतीय पुरुष एकवचन प्रत्यय का निकटतम स्वाभाविक पूर्वपद रेगेम-मेलेक है। ‘आदमियों’ से उसके साथ आए प्रतिनिधियों का सहज बोध होता है।
- source_word: לְחַלּוֹת אֶת־פְּנֵי
  choice: से कृपा की विनती करने
  rationale: इब्रानी मुहावरे में किसी का अनुग्रह पाने हेतु उससे निवेदन करने का भाव है। यह हिन्दी रूप विनय और कृपा—दोनों पक्षों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह चार अक्षरों वाला परमेश्वर का व्यक्तिगत नाम है; इसे किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: יְהוָה का निरूपण
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसका लिप्यंतरण है और नाम तथा उपाधि के बीच का भेद बनाए रखता है।
- issue: בֵּית אֵל की पहचान
  choice: प्रेषक स्थान/समुदाय के रूप में बेतेल
  alternative: ‘परमेश्वर का घर’; किसी व्यक्ति या कुल का नाम
  rationale: वाक्य-विन्यास और प्रसंग में स्थान के नाम अथवा उस नगर के समुदाय को प्रेषक मानना सबसे स्वाभाविक है; फिर भी पाठक को वास्तविक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- issue: וַאֲנָשָׁיו में सर्वनाम का संबंध
  choice: रेगेम-मेलेक के आदमी
  alternative: बेतेल के आदमी; शरेसेर के आदमी
  rationale: पुल्लिंग एकवचन प्रत्यय का तत्काल निकटतम नाम रेगेम-मेलेक है, इसलिए ‘उसके’ रखा गया है; इब्रानी में संबंध पूर्णतः निर्विवाद नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। नामों का हिन्दी लिप्यंतरण किया गया है, जबकि दुर्बोध इब्रानी मुहावरे को अर्थ-स्पष्ट हिन्दी में व्यक्त कर उसका शाब्दिक चित्र पादटिप्पणी में सुरक्षित रखा गया है।
