    reason: ईश्वरीय नाम के मूल हिब्रू रूप और पारंपरिक वैकल्पिक प्रस्तुति की जानकारी देना।
lexical_decisions:
- source_word: וַיְהִי
  choice: तब ... आया
  rationale: भविष्यवाणी के प्रचलित सूत्र में यह रूप वचन के आने की घटना बताता है; ‘तब’ प्रसंग की क्रमबद्धता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דְּבַר
  choice: वचन
  rationale: דְּבַר־יְהוָה भविष्यवाणी का स्थापित सूत्र है। ‘वचन’ उसके औपचारिक और धार्मिक स्वर को बनाए रखता है, जबकि ‘संदेश’ अपेक्षाकृत व्याख्यात्मक होता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में परमेश्वर के व्यक्तिगत नाम के लिए ‘यहोवा’ व्यापक रूप से पहचाना जाने वाला लिप्यंतरण है; इसे ‘प्रभु’ जैसे पदनाम से नहीं बदला गया।
- source_word: אֶל
  choice: के पास
  rationale: वचन के किसी व्यक्ति तक पहुँचने के हिन्दी मुहावरे में ‘के पास आया’ स्वाभाविक है और प्राप्तकर्ता की दिशा को स्पष्ट रखता है।
- source_word: זְכַרְיָה
  choice: जकर्याह
  rationale: हिब्रू नाम זְכַרְיָה का निकट देवनागरी लिप्यंतरण।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। आधुनिक हिन्दी में पद के अंत का द्विबिंदु ‘यह कहते हुए’ की तुलना में अधिक स्वाभाविक रूप से यही कार्य करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। ‘यहोवा’ हिन्दी पाठकों में स्थापित नामरूप है और किसी पदनाम से प्रतिस्थापन किए बिना इसकी नामगत प्रकृति बनाए रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। भविष्यवाणी-सूत्र की औपचारिकता ‘यहोवा का वचन’ में सुरक्षित है, जबकि לֵאמֹר को अनावश्यक शाब्दिकता से बचाते हुए द्विबिंदु द्वारा व्यक्त किया गया है।
