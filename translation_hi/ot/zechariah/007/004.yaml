source:
  edition: WLC
  text: וַ/יְהִ֛י דְּבַר יְהוָ֥ה צְבָא֖וֹת אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/004.yaml
  text: Then the word of Yahweh of hosts came to me[a], saying,
translation:
  language: hi
  text: 'तब सेनाओं के याहवे[a] का वचन मेरे पास आया:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यह नाम चार व्यंजनों YHWH से लिखा गया है; यहाँ उसे “याहवे” लिखा गया है।
    reason: पाठक को परमेश्वर के इब्रानी नाम और उसके हिन्दी रूप के बारे में स्पष्ट करना।
lexical_decisions:
- source_word: וַיְהִי
  choice: तब … आया
  rationale: यहाँ यह क्रिया कथा के अगले क्रम को आरम्भ करती है। ‘तब … आया’ आधुनिक हिन्दी में सहज है और इब्रानी की क्रमिकता बनाए रखता है।
- source_word: דְּבַר
  choice: वचन
  rationale: भविष्यवाणी के इस प्रचलित सूत्र में यह शब्द परमेश्वर से मिले कथन या संदेश को दर्शाता है; ‘वचन’ उस स्थापित भाव को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह परमेश्वर का व्यक्तिगत नाम YHWH है; इसे किसी उपाधि से बदलने के बजाय हिन्दी लिपि में नाम के रूप में प्रस्तुत किया गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं के
  rationale: यह बहुवचन शब्द याहवे की उपाधि में उनकी अधीनस्थ सेनाओं या विशाल दलों की व्यापक धारणा व्यक्त करता है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: भविष्यद्वक्ता को दिव्य वचन प्राप्त होने के हिन्दी मुहावरे में ‘मेरे पास आया’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में अगले पद के कथन से पहले विसर्ग-सदृश विरामचिह्न ‘:’ ‘यह कहते हुए’ की अपेक्षा अधिक स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार व्यंजनों YHWH से लिखा परमेश्वर का विशिष्ट नाम है। ‘याहवे’ उसके व्यापक रूप से स्वीकृत उच्चारण को हिन्दी में व्यक्त करता है और उसे ‘प्रभु’ उपाधि से नहीं बदलता।
- issue: יְהוָה צְבָאוֹת की संयुक्त उपाधि
  choice: सेनाओं के याहवे
  alternative: सेनाओं का याहवे; सर्वशक्तिमान याहवे
  rationale: मूल पदबंध की संज्ञात्मक संरचना और ‘सेनाओं’ की बहुवचन छवि सुरक्षित रखी गई है। ‘सर्वशक्तिमान’ भावार्थ है, सीधा शब्दार्थ नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। भविष्यवाणी के पारंपरिक सूत्र ‘वचन … आया’ को बनाए रखते हुए לֵאמֹר को अगले पद में आने वाले कथन के लिए द्विबिंदु से व्यक्त किया गया है।
