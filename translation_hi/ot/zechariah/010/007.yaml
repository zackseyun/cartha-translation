  text: וְ/הָי֤וּ כְ/גִבּוֹר֙ אֶפְרַ֔יִם וְ/שָׂמַ֥ח לִבָּ֖/ם כְּמוֹ יָ֑יִן וּ/בְנֵי/הֶם֙ יִרְא֣וּ וְ/שָׂמֵ֔חוּ יָגֵ֥ל לִבָּ֖/ם בַּ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/007.yaml
  text: Ephraim will be like a mighty warrior[a], and their heart will rejoice as with wine; their children will see and rejoice[b]; their heart will exult in Yahweh.
translation:
  language: hi
  text: 'एप्रैम के लोग वीर योद्धा के समान होंगे,

    और उनका मन दाखमधु के समान आनंदित होगा।

    उनके बेटे[a] देखेंगे और आनंदित होंगे;

    उनका मन याहवे में उल्लसित होगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी संतान।” हिब्रू में “उनके बेटे” है, जो इस संदर्भ में संतान या वंशजों के लिए व्यापक अर्थ में भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ כְגִבּוֹר אֶפְרַיִם
  choice: एप्रैम के लोग वीर योद्धाओं जैसे होंगे
  rationale: אֶפְרַיִם यहाँ सामूहिक रूप से उस समुदाय को सूचित करता है; बहुवचन क्रिया के कारण ‘एप्रैम के लोग’ स्वाभाविक हिंदी है। גִּבּוֹר का युद्ध-संबंधी बल ‘वीर योद्धाओं’ से सुरक्षित रहता है।
- source_word: וְשָׂמַח לִבָּם
  choice: उनका मन ... आनंदित होगा
  rationale: एकवचन לֵב पर बहुवचन संबंधसूचक प्रत्यय सामूहिक प्रयोग है। हिंदी में ‘उनका मन’ मूल की सामूहिक एकवचन अभिव्यक्ति को स्वाभाविक रूप से बनाए रखता है।
- source_word: כְּמוֹ יָיִן
  choice: दाखमधु से मिलने वाले आनंद की तरह
  rationale: शाब्दिक ‘दाखमधु के समान’ मन को दाखमधु से समान ठहरा सकता है; संदर्भ में तुलना उससे उत्पन्न उल्लास से है। यह अभिव्यक्ति आशय स्पष्ट करती है, पर मतवालेपन को अनावश्यक रूप से नहीं जोड़ती।
- source_word: וּבְנֵיהֶם
  choice: उनके बेटे
  rationale: בָּנִים का प्रत्यक्ष अर्थ ‘बेटे’ है। संदर्भ में यह संतान या वंशजों के लिए व्यापक भी हो सकता है; उस संभावना को पादटिप्पणी में रखा गया है।
- source_word: יִרְאוּ וְשָׂמֵחוּ
  choice: यह देखेंगे और आनंदित होंगे
  rationale: ‘देखेंगे’ का कर्म हिब्रू में अंतर्निहित है। हिंदी में ‘यह’ पूर्ववर्णित बहाली और आनंद की ओर संकेत करते हुए वाक्य को सहज बनाता है, बिना किसी विशिष्ट नए कर्म को आरोपित किए।
- source_word: יָגֵל לִבָּם
  choice: उनका मन ... मगन होगा
  rationale: גיל प्रबल, उल्लसित आनंद व्यक्त करता है। ‘मगन होगा’ पहले आए שׂמח से भेद रखते हुए उस तीव्रता को सहज हिंदी में व्यक्त करता है।
- source_word: בַּיהוָה
  choice: यहोवा में
  rationale: व्यक्तिगत वाचा-नाम יהוה को ‘यहोवा’ के रूप में रखा गया है; בְּ आनंद के आधार या क्षेत्र को सूचित करता है, इसलिए ‘में’ उपयुक्त है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे उपस्थित है। ‘यहोवा’ आधुनिक हिंदी बाइबल-पाठकों में परिचित नामरूप है और इसे केवल उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता; ‘याहवे’ संभावित वैकल्पिक लिप्यंतरण है।
- issue: दाखमधु से आनंद की तुलना
  choice: दाखमधु से मिलने वाले आनंद की तरह
  alternative: दाखमधु के समान
  rationale: वाक्य आनंद की तीव्रता की उपमा देता है; यह न तो मतवालेपन की स्पष्ट स्वीकृति करता है, न उसका निषेध। अनुवाद उस तनाव को नैतिक टिप्पणी जोड़े बिना रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। काव्यात्मक समानांतरता बनाए रखने के लिए पंक्ति-विभाजन किया गया है। ‘मन’ हिब्रू के सामूहिक एकवचन ‘हृदय’ का स्वाभाविक हिंदी रूप है; ‘आनंदित’ और ‘मगन’ मूल की दो अलग आनंद-सूचक क्रियाओं का भेद रखते हैं।
