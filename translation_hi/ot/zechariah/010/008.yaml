base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/008.yaml
  text: I will whistle for them and gather them[a], for I have redeemed them[b], and they will be as many as they were before.
translation:
  language: hi
  text: मैं उन्हें बुलाने के लिए सीटी बजाऊँगा[a] और उन्हें इकट्ठा करूँगा, क्योंकि मैंने उन्हें छुड़ाया है; और वे फिर वैसे ही बढ़ेंगे जैसे पहले बढ़े थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उन्हें संकेत देकर बुलाऊँगा”; इब्रानी क्रिया का अर्थ बुलाने के लिए सीटी बजाना या फुफकार-जैसी ध्वनि करना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “और वे उतने ही अधिक हो जाएँगे जितने पहले थे।” इब्रानी का अधिक शाब्दिक रूप है, “वे बढ़ेंगे जैसे वे बढ़े थे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁרְקָה לָהֶם
  choice: मैं उनके लिए सीटी बजाऊँगा
  rationale: שׁרק का मूल अर्थ सीटी बजाना या फुफकार-जैसी ध्वनि करके संकेत देना है; यहाँ לָהֶם के साथ यह लोगों को अपने पास बुलाने के संकेत को दर्शाता है। आधुनिक हिन्दी में ‘सीटी बजाऊँगा’ सबसे स्वाभाविक और ठोस समतुल्य है।
- source_word: וַאֲקַבְּצֵם
  choice: और उन्हें इकट्ठा करूँगा
  rationale: קבץ बिखरे हुए लोगों को एकत्र करने का सामान्य शब्द है और भविष्यद्वाणी के प्रसंग में पुनर्स्थापना का भाव भी रखता है।
- source_word: כִּי פְדִיתִים
  choice: क्योंकि मैंने उन्हें छुड़ा लिया है
  rationale: כִּי यहाँ कारण बताता है। פדה दासता या संकट से मूल्य देकर छुड़ाने अथवा मुक्त करने को सूचित कर सकता है; ‘छुड़ा लिया है’ सामान्य हिन्दी में अर्थ को स्पष्ट रखता है और किसी अतिरिक्त धार्मिक व्याख्या को नहीं जोड़ता।
- source_word: וְרָבוּ כְּמוֹ רָבוּ
  choice: और वे फिर वैसे ही बढ़ेंगे जैसे पहले बढ़े थे
  rationale: दोनों बार רבה का प्रयोग हुआ है। पहला रूप भविष्यसूचक क्रम में आगामी वृद्धि बताता है और दूसरा पिछली वृद्धि से तुलना करता है। ‘फिर’ और ‘पहले’ तुलना के निहित कालगत संबंध को स्वाभाविक हिन्दी में व्यक्त करते हैं, जबकि ‘बढ़ेंगे/बढ़े थे’ मूल की शब्द-पुनरावृत्ति को बनाए रखते हैं।
theological_decisions:
- issue: छुटकारे के आधार पर लोगों का फिर इकट्ठा होना और बढ़ना
  choice: पद को परमेश्वर द्वारा पहले किए गए छुटकारे पर आधारित सामूहिक पुनर्स्थापना के रूप में रखा गया है, बिना उसके समय या साधन को और संकीर्ण किए।
  alternative: इसे केवल अंतिम समय की किसी विशिष्ट योजना या केवल आत्मिक रूपक के रूप में स्पष्ट करना।
  rationale: इब्रानी पाठ बुलाने, इकट्ठा करने, छुड़ाने और संख्या में बढ़ने की बात करता है, पर इस एक पद में पुनर्स्थापना की विस्तृत प्रणाली निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सीटी बजाऊँगा’ मूल बिंब को सुरक्षित रखता है; फुटनोट उसके संकेतात्मक अर्थ को स्पष्ट करता है। अंतिम खंड में רבה की पुनरावृत्ति को ‘बढ़ेंगे/बढ़े थे’ द्वारा यथासंभव बनाए रखा गया है।
