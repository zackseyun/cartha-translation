source:
  edition: WLC
  text: וְ/עָבַ֨ר בַּ/יָּ֜ם צָרָ֗ה וְ/הִכָּ֤ה בַ/יָּם֙ גַּלִּ֔ים וְ/הֹבִ֕ישׁוּ כֹּ֖ל מְצוּל֣וֹת יְאֹ֑ר וְ/הוּרַד֙ גְּא֣וֹן אַשּׁ֔וּר וְ/שֵׁ֥בֶט מִצְרַ֖יִם יָסֽוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/011.yaml
  text: He will pass through the sea of distress and strike the waves of the sea[a], and all the depths of the Nile will dry up. The pride of Assyria will be brought down[c][b], and the scepter of Egypt will depart.
translation:
  language: hi
  text: वह संकट के समुद्र में से होकर गुज़रेगा[a] और समुद्र की लहरों को मारेगा; नील नदी[b] की सारी गहराइयाँ सूख जाएँगी। अश्शूर का घमंड नीचा किया जाएगा, और मिस्र का राजदंड[c] हट जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह संकट के एक समुद्र में से होकर गुज़रेगा,” अथवा “वह उफनते समुद्र में से होकर गुज़रेगा।” इब्रानी पदबंध बहुत सघन है और संभवतः केवल किसी वास्तविक समुद्र की पहचान करने के बजाय निर्गमन की छवि जगाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का अर्थ “नदी” भी हो सकता है, पर मिस्र के संदर्भ में यह प्रायः नील नदी को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: या “मिस्र की छड़ी।” यहाँ “राजदंड” संभवतः शासकीय शक्ति का भाव प्रकट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  choice: वह ... में से होकर गुज़रेगा
  rationale: भविष्यसूचक प्रसंग में संयोजक सहित पूर्ण क्रिया को भावी अर्थ में लेना स्वाभाविक है। यह गति के बिंब और परमेश्वर को निहित कर्ता बनाए रखता है।
- source_word: בַּיָּם צָרָה
  choice: संकट के समुद्र में
  rationale: सघन इब्रानी पदबंध में צָרָה को संज्ञा ‘संकट’ के रूप में सुरक्षित रखा गया है। यह निर्गमन-सदृश बिंब को बनाए रखता है, जबकि पदबंध की वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
- source_word: וְהִכָּה בַיָּם גַּלִּים
  choice: समुद्र की लहरों पर प्रहार करेगा
  rationale: נכה का सामान्य अर्थ ‘प्रहार करना’ रखा गया है और हिन्दी की स्वाभाविक पद-रचना में समुद्र की लहरों का बिंब सुरक्षित है।
- source_word: וְהֹבִישׁוּ כֹּל מְצוּלוֹת יְאֹר
  choice: नील नदी की सारी गहराइयाँ सूख जाएँगी
  rationale: जल-संदर्भ में יבש का अर्थ सूखना है। מְצוּלוֹת को ‘गहराइयाँ’ और मिस्री संदर्भ में יְאֹר को ‘नील नदी’ अनूदित किया गया है।
- source_word: וְהוּרַד גְּאוֹן אַשּׁוּר
  choice: अश्शूर का घमंड नीचे गिरा दिया जाएगा
  rationale: न्याय के प्रसंग में גְּאוֹן का नकारात्मक भाव ‘घमंड’ उपयुक्त है; होफाल रूप की कर्मवाच्यता ‘गिरा दिया जाएगा’ में बनी रहती है।
- source_word: וְשֵׁבֶט מִצְרַיִם יָסוּר
  choice: मिस्र का राजदंड जाता रहेगा
  rationale: राजनीतिक समानांतरता में שֵׁבֶט शासकीय शक्ति का चिह्न है, इसलिए ‘राजदंड’ चुना गया। יָסוּר के अपूर्ण पक्ष को ‘जाता रहेगा’ से व्यक्त किया गया है।
theological_decisions:
- issue: क्रियाओं का निहित कर्ता
  choice: प्रसंगानुसार परमेश्वर को एकवचन निहित कर्ता माना गया है।
  alternative: कुछ क्रियाओं का कर्ता पुनर्स्थापित प्रजा को माना जा सकता है।
  rationale: एकवचन क्रिया-क्रम और आसपास का दैवी उद्धार का प्रसंग परमेश्वर को कर्ता मानने के पक्ष में है; फिर भी नाम जोड़कर मूल से अधिक स्पष्टता नहीं थोपी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘अश्शूर,’ ‘नील नदी,’ और ‘राजदंड’ सामान्य बाइबलीय-ऐतिहासिक शब्दावली के अनुरूप हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
