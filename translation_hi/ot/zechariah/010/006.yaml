id: ZEC.10.6
reference: Zechariah 10:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/גִבַּרְתִּ֣י אֶת בֵּ֣ית יְהוּדָ֗ה וְ/אֶת בֵּ֤ית יוֹסֵף֙ אוֹשִׁ֔יעַ וְ/הֽוֹשְׁבוֹתִי/ם֙ כִּ֣י רִֽחַמְתִּ֔י/ם וְ/הָי֖וּ כַּ/אֲשֶׁ֣ר לֹֽא זְנַחְתִּ֑י/ם כִּ֗י אֲנִ֛י יְהוָ֥ה אֱלֹהֵי/הֶ֖ם וְ/אֶעֱנֵֽ/ם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/006.yaml
  text: I will strengthen the house of Judah[a], and I will save the house of Joseph. I will restore them, because I have had compassion on them, and they will be as though I had not rejected them; for I am Yahweh their God[b], and I will answer them.
translation:
  language: hi
  text: मैं यहूदा के घराने को सशक्त करूँगा और यूसुफ के घराने[a] को बचाऊँगा। मैं उन्हें लौटा लाऊँगा[b], क्योंकि मैंने उन पर करुणा की है। वे ऐसे होंगे, मानो मैंने उन्हें त्यागा न हो; क्योंकि मैं याहवे उनका परमेश्वर हूँ, और मैं उन्हें उत्तर दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यूसुफ का घराना’ सामूहिक रूप से यूसुफ के वंशजों को, और भविष्यद्वाणी के अनेक संदर्भों में विशेषकर उत्तरी गोत्रों को दर्शाता है।
    reason: cultural_note
  - marker: b
    text: या “मैं उन्हें पुनःस्थापित करूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגִבַּרְתִּי
  choice: मैं ... दृढ़ करूँगा
  rationale: पिएल रूप का कारक भाव सुरक्षित रखते हुए ‘दृढ़ करूँगा’ आधुनिक हिन्दी में शक्ति देने या समर्थ बनाने का स्वाभाविक अर्थ व्यक्त करता है।
- source_word: בֵּית יְהוּדָה
  choice: यहूदा का घराना
  rationale: ‘घराना’ सामूहिक वंशीय और गोत्रीय अर्थ को बनाए रखता है; केवल ‘यहूदा’ कहने से यह भाव धुँधला पड़ जाता।
- source_word: בֵּית יוֹסֵף
  choice: यूसुफ का घराना
  rationale: मूल पाठ के सामूहिक पद को यथावत रखा गया है, यद्यपि भविष्यद्वाणी के संदर्भ में यह प्रायः उत्तरी गोत्रों की ओर संकेत करता है।
- source_word: אוֹשִׁיעַ
  choice: मैं ... बचाऊँगा
  rationale: हिफ़ील रूप का सीधा अर्थ ‘बचाना’ है; यह छुटकारा देने के भाव को भी समेटता है।
- source_word: וְהוֹשְׁבוֹתִים
  choice: मैं उन्हें लौटा लाऊँगा
  rationale: שׁוב के हिफ़ील रूप में वापस लाने का स्थानगत पुनर्स्थापन-भाव प्रमुख है; हिन्दी में यह निर्वासन से वापसी के संदर्भ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: כִּי רִחַמְתִּים
  choice: क्योंकि मैंने उन पर करुणा की है
  rationale: רחם की दया और गहरी करुणा को ‘करुणा की है’ स्पष्ट रूप से व्यक्त करता है तथा पूर्ण क्रिया का आधारभूत भाव बनाए रखता है।
- source_word: וְהָיוּ כַּאֲשֶׁר לֹא זְנַחְתִּים
  choice: वे ऐसे हो जाएँगे, मानो मैंने उन्हें त्यागा ही न था
  rationale: तुलनात्मक और प्रतितथ्यात्मक तनाव को बनाए रखा गया है; ‘त्यागा’ זנח के अस्वीकार या दूर कर देने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: וְאֶעֱנֵם
  choice: मैं उन्हें उत्तर दूँगा
  rationale: ענה के काल रूप का सीधा अर्थ ‘उत्तर देना’ है। ‘उनकी सुनूँगा’ अधिक स्वाभाविक हो सकता है, पर वह उत्तर देने के स्पष्ट मूल अर्थ को केवल सुनने तक सीमित कर देता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम प्रयुक्त है। ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: पुनर्स्थापन और पूर्व अस्वीकृति के बीच तनाव
  choice: मानो मैंने उन्हें त्यागा ही न था
  alternative: मैंने उन्हें कभी त्यागा नहीं था
  rationale: כַּאֲשֶׁר की तुलना को बनाए रखना आवश्यक है। पाठ पहले हुए त्याग का निषेध नहीं करता, बल्कि आने वाली बहाली की पूर्णता को प्रतितथ्यात्मक तुलना से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘घराना’ वंशीय-सामूहिक अभिव्यक्ति को बनाए रखता है। समानांतर प्रतिज्ञाओं और ईश्वरीय प्रथम पुरुष वाणी की लय सुरक्षित है।
