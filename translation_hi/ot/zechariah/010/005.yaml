base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/005.yaml
  text: They will be like mighty men[a], trampling the mire of the streets in battle; they will fight, because Yahweh is with them, and they will put horsemen to shame.
translation:
  language: hi
  text: वे युद्ध में गलियों के कीचड़ में रौंदते हुए वीरों[a] के समान होंगे। वे लड़ेंगे, क्योंकि यहोवा उनके साथ है, और वे घुड़सवारों को लज्जित करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “योद्धाओं।” इब्रानी में यहाँ वीर और पराक्रमी लड़ाकों के लिए पुल्लिंग शब्द प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: वे ... होंगे
  rationale: भविष्यसूचक प्रसंग में संयोजक सहित पूर्ण क्रिया भविष्य का भाव व्यक्त करती है; हिन्दी में आरम्भिक ‘और’ के बिना वाक्य अधिक स्वाभाविक है।
- source_word: כְגִבֹּרִים
  choice: ऐसे वीर पुरुष
  rationale: גִּבּוֹרִים बलवान योद्धाओं के लिए प्रयुक्त पुल्लिंग बहुवचन है। ‘वीर पुरुष’ मूल के पुल्लिंग और युद्ध-संबंधी चित्र दोनों को बनाए रखता है।
- source_word: בּוֹסִים בְּטִיט חוּצוֹת
  choice: गलियों के कीचड़ को पैरों तले रौंदते हैं
  rationale: בוס का अर्थ पैरों तले रौंदना है और טִיט חוּצוֹת गलियों के कीचड़ या दलदल-जैसी गंदगी को दर्शाता है। यह अनुवाद ठोस और सजीव बिंब को स्वाभाविक हिन्दी में रखता है।
- source_word: בַּמִּלְחָמָה
  choice: युद्ध में
  rationale: यह पद तत्काल युद्ध-दृश्य को सूचित करता है; ‘युद्ध में’ संक्षिप्त और स्पष्ट है।
- source_word: וְנִלְחֲמוּ
  choice: वे लड़ेंगे
  rationale: यहाँ לחם का निफ़अल रूप युद्ध में लड़ने का अर्थ देता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उनकी लड़ाई और सफलता का कारण बताता है—यहोवा उनके साथ है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित लिप्यंतरण द्वारा परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखा गया है।
- source_word: עִמָּם
  choice: उनके साथ है
  rationale: हिब्रू के नाममात्र वाक्य में निहित वर्तमान सहायक क्रिया हिन्दी में स्पष्ट की गई है।
- source_word: וְהֹבִישׁוּ
  choice: लज्जित करेंगे
  rationale: हिफ़ईल रूप शत्रु को लज्जा या अपमान में डालने का कारणवाचक भाव देता है।
- source_word: רֹכְבֵי סוּסִים
  choice: घुड़सवारों
  rationale: यह घोड़ों पर सवार सैन्य दल के लिए संक्षिप्त और स्वाभाविक हिन्दी शब्द है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। हिन्दी पाठकों के लिए व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को उपाधि में बदलने के बजाय उसका नामात्मक स्वरूप बनाए रखता है।
- issue: पुल्लिंग युद्ध-संज्ञा גִּבֹּרִים
  choice: वीर पुरुष
  alternative: योद्धा
  rationale: ‘वीर पुरुष’ मूल के व्याकरणिक पुल्लिंग और बलशाली योद्धाओं के चित्र को स्पष्ट रखता है; पादटिप्पणी अधिक सहज वैकल्पिक अनुवाद बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज युद्ध-वर्णन अपनाया गया है। ‘पैरों तले रौंदते’ मूल क्रिया की तीव्रता को स्पष्ट करता है, और छोटे वाक्यों से भविष्यसूचक कथन का प्रवाह स्वाभाविक रहता है।
