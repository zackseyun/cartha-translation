language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/גִבַּרְתִּי/ם֙ בַּֽ/יהוָ֔ה וּ/בִ/שְׁמ֖/וֹ יִתְהַלָּ֑כוּ נְאֻ֖ם יְהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/012.yaml
  text: I will strengthen them in Yahweh[b][a], and in his name they will walk,” declares Yahweh.
translation:
  language: hi
  text: “मैं उन्हें याहवे में बलवान बनाऊँगा[a], और वे उसके नाम में चलेंगे[b],” याहवे की यह वाणी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं याहवे के द्वारा उन्हें बलवान बनाऊँगा।”
    reason: इब्रानी पूर्वसर्ग בְּ यहाँ क्षेत्र या आधार (‘में’) के साथ-साथ साधन (‘के द्वारा’) का भाव भी दे सकता है।
  - marker: b
    text: “उसके नाम में” का अर्थ “उसके अधिकार के अधीन” या “उसके प्रकट चरित्र के अनुसार” भी हो सकता है।
    reason: इब्रानी में ‘नाम’ प्रतिष्ठा, अधिकार और प्रकट चरित्र को भी सूचित कर सकता है; पादटिप्पणी इस अर्थ-व्याप्ति को स्पष्ट करती है।
lexical_decisions:
- source_word: וְגִבַּרְתִּים
  choice: मैं उन्हें ... बलवान बनाऊँगा
  rationale: גבר के कारक-बलवर्धक अर्थ और प्रथम पुरुष एकवचन कर्ता तथा तृतीय पुरुष बहुवचन कर्म को स्पष्ट रखता है। ‘बलवान बनाऊँगा’ आधुनिक हिन्दी में स्वाभाविक है और ‘सामर्थी करूँगा’ की अपेक्षा अधिक सहज है।
- source_word: בַּיהוָה
  choice: यहोवा में
  rationale: ב की क्षेत्र, आधार या साधन-संबंधी व्यापकता को संकीर्ण किए बिना ‘में’ के द्वारा मूल रूपक सुरक्षित रखा गया है; साधनार्थक सम्भावना पादटिप्पणी में दी गई है।
- source_word: וּבִשְׁמוֹ
  choice: और उसके नाम में
  rationale: शाब्दिक इब्रानी मुहावरे को बनाए रखता है। ‘नाम’ में प्रतिष्ठा, अधिकार और प्रकट चरित्र के भाव निहित हो सकते हैं, पर मुख्य पाठ किसी एक अर्थ तक इसे सीमित नहीं करता।
- source_word: יִתְהַלָּכוּ
  choice: वे ... चलेंगे
  rationale: הלך के हित्वपएल रूप का चलने, जीवन बिताने या आचरण करने का रूपक सुरक्षित रहता है; ‘जीएँगे’ या ‘आचरण करेंगे’ कहने से अर्थ अनावश्यक रूप से संकुचित हो जाता।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह वाणी है
  rationale: यह मानक नबूवतीय उद्घोषणा-सूत्र का स्पष्ट, गरिमापूर्ण और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में वाचा-संबंधी विशिष्ट नाम יְהוָה आया है; ‘यहोवा’ उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: ‘उसके नाम में चलेंगे’ का अर्थ
  choice: मूल रूपक को बनाए रखना
  alternative: उसके अधिकार के अधीन जीवन बिताएँगे
  rationale: यह पद आचरण, निष्ठा, अधिकार और परमेश्वर के प्रकट चरित्र—इन सभी भावों को समेट सकता है। मुख्य पाठ में ‘चलेंगे’ रखने से यह धर्मवैचारिक व्यापकता और तनाव सुरक्षित रहता है।
- issue: ‘यहोवा में’ में בְּ का संबंध
  choice: क्षेत्र या आधार के रूप में ‘में’
  alternative: साधन के रूप में ‘यहोवा के द्वारा’
  rationale: इब्रानी पूर्वसर्ग दोनों अर्थ-संभावनाएँ ग्रहण कर सकता है। मुख्य पाठ मूल संरचना के निकट रहता है और साधनार्थक अर्थ को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण नबूवतीय शैली रखी गई है। ‘बलवान बनाऊँगा’ सामान्य पाठक के लिए सहज है, जबकि ‘नाम में चलेंगे’ मूल बाइबिलीय रूपक और उसकी बहुअर्थकता को सुरक्षित रखता है।
