  text: כִּ֧י הַ/תְּרָפִ֣ים דִּבְּרוּ אָ֗וֶן וְ/הַ/קּֽוֹסְמִים֙ חָ֣זוּ שֶׁ֔קֶר וַֽ/חֲלֹמוֹת֙ הַ/שָּׁ֣וא יְדַבֵּ֔רוּ הֶ֖בֶל יְנַֽחֵמ֑וּ/ן עַל כֵּן֙ נָסְע֣וּ כְמוֹ צֹ֔אן יַעֲנ֖וּ כִּֽי אֵ֥ין רֹעֶֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/002.yaml
  text: For the household idols speak wickedness[a], and the diviners see lies; they speak empty dreams and give vain comfort. Therefore they wander like sheep[b]; they are afflicted because there is no shepherd.
translation:
  language: hi
  text: क्योंकि घरेलू देव-मूर्तियाँ[a] कपट की बातें करती हैं, और शकुन-विचारक झूठे दर्शन देखते हैं; वे व्यर्थ स्वप्न सुनाते हैं और खोखली सांत्वना देते हैं। इसलिए लोग भेड़ों के समान भटकते हैं; वे दुःख उठाते हैं, क्योंकि कोई चरवाहा नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में “तेराफ़ीम” है—घर में पूजा के लिए रखी जाने वाली देव-प्रतिमाओं या अन्य धार्मिक वस्तुओं के लिए एक इब्रानी शब्द।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: कुल-देवताओं
  rationale: यह शब्द घरेलू या पारिवारिक पूजा में प्रयुक्त देव-प्रतिमाओं को सूचित करता है। ‘कुल-देवता’ आधुनिक हिन्दी में इस घरेलू-पंथीय संदर्भ को सामान्य ‘मूर्तियों’ से अधिक स्पष्ट करता है; पादटिप्पणी वस्तुगत अर्थ खोलती है।
- source_word: דִּבְּרוּ אָוֶן
  choice: अनर्थ की बातें कही हैं
  rationale: אָוֶן में दुष्टता, मिथ्या और निष्फलता का अर्थ-विस्तार है। समानांतर पंक्तियों में झूठ और व्यर्थता के कारण ‘अनर्थ की बातें’ नैतिक और भ्रमकारी दोनों बलों को बनाए रखता है।
- source_word: הַקּוֹסְמִים
  choice: शकुन-विचारकों
  rationale: यह शब्द भावी घटनाओं या गुप्त बातों को शकुन आदि से जानने का दावा करने वालों के लिए है। ‘शकुन-विचारक’ धार्मिक-सांस्कृतिक संदर्भ में सहज और पर्याप्त रूप से विशिष्ट है।
- source_word: חָזוּ שֶׁקֶר
  choice: झूठे दर्शन देखे हैं
  rationale: मूल में दर्शन देखने की भाषा है। ‘झूठे दर्शन’ उस प्रकाशनात्मक दावे को बनाए रखता है और इसे केवल सामान्य झूठ बोलने तक सीमित नहीं करता।
- source_word: חֲלֹמוֹת הַשָּׁוְא יְדַבֵּרוּ
  choice: वे व्यर्थ स्वप्नों की बातें करते
  rationale: शָׁוְא स्वप्नों की खोखली, मिथ्या या निष्फल प्रकृति बताता है। ‘व्यर्थ स्वप्न’ अर्थ की इस व्यापकता को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: הֶבֶל יְנַחֵמוּן
  choice: खोखली सांत्वना देते हैं
  rationale: הֶבֶל वाष्पवत् रिक्तता, व्यर्थता और सारहीनता का बोध देता है। ‘खोखली सांत्वना’ स्वाभाविक हिन्दी में उस सांत्वना की अविश्वसनीय और निष्फल प्रकृति प्रकट करती है।
- source_word: נָסְעוּ כְמוֹ צֹאן
  choice: लोग भेड़ों के समान भटकते हैं
  rationale: נָסְעוּ का मूल अर्थ चल पड़ना या पड़ाव उखाड़ना है, पर चरवाहे के अभाव वाली उपमा दिशाहीन भटकाव को सामने लाती है। हिन्दी में ‘भटकते हैं’ इस प्रसंगगत चित्र को स्पष्ट करता है। कर्ता को ‘लोग’ से व्यक्त करना हिन्दी में अस्पष्ट सर्वनाम से बचाता है, यद्यपि हिब्रू में वह अंतर्निहित है।
- source_word: יַעֲנוּ
  choice: वे दुःख उठाते हैं
  rationale: यह रूप पीड़ित, दबाए गए या दुःख में होने का अर्थ दे सकता है। ‘दुःख उठाते हैं’ व्यापक अर्थ रखता है और किसी विशिष्ट प्रकार के उत्पीड़न को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֵין רֹעֶה
  choice: कोई चरवाहा नहीं है
  rationale: अस्तित्ववाचक हिब्रू वाक्य को सीधे रखा गया है। चरवाहे का ठोस चित्र बना रहता है और नेतृत्व का रूपक पाठक पर थोपा नहीं जाता।
theological_decisions:
- issue: निन्दित धार्मिक वस्तुओं और प्रथाओं का स्वरूप
  choice: पद में कुल-देवताओं, शकुन-विचारकों और झूठे स्वप्नों को अविश्वसनीय मार्गदर्शन के स्रोतों के रूप में ठोस रूप से रखा गया है।
  alternative: תְּרָפִים को केवल सामान्य मूर्तियाँ कहना, या पूरे पद को केवल राजनीतिक नेतृत्व की आलोचना बना देना।
  rationale: निकट प्रसंग झूठे प्रकाशन और विफल मार्गदर्शन पर केन्द्रित है। अनुवाद पंथीय और भविष्य-कथन संबंधी शब्दों को स्पष्ट रखता है, जबकि चरवाहे की छवि में निहित नेतृत्वार्थ को अनिर्णीत छोड़ता है।
- issue: चरवाहे के अभाव का आशय
  choice: ‘कोई चरवाहा नहीं है’ कहकर ठोस पशुपालकीय रूपक और सम्भावित नेतृत्वार्थ दोनों सुरक्षित रखे गए हैं।
  alternative: ‘उनका कोई नेता नहीं है’ कहकर रूपक को सीधे राजनीतिक या धार्मिक नेतृत्व के रूप में खोल देना।
  rationale: मूल पाठ ‘चरवाहा’ कहता है और नेतृत्व का प्रकार निर्दिष्ट नहीं करता; अतः अनुवाद उस धर्मवैचारिक तनाव को नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कुल-देवता’, ‘शकुन-विचारक’, ‘दर्शन’ और ‘चरवाहा’ धार्मिक-पशुपालकीय चित्रों को सुरक्षित रखते हैं। मूल के पूर्ण क्रियापदों को आरोपों के स्थापित स्वर के कारण आरम्भ में पूर्णकाल से और आगे के अपूर्ण क्रियापदों को वर्तमानकाल से व्यक्त किया गया है।
