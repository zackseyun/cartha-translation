base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/009.yaml
  text: I will sow them among the peoples[a], and in distant places they will remember me[b]; they and their children will live, and they will return.
translation:
  language: hi
  text: मैं उन्हें जातियों के बीच बोऊँगा[a]; दूर-दूर के स्थानों में वे मुझे याद करेंगे। वे और उनके बच्चे जीवित रहेंगे[b], और वे लौट आएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मैं उन्हें जातियों में तितर-बितर करूँगा।’ इब्रानी क्रिया का शाब्दिक अर्थ ‘बीज बोना’ है; इसमें फैलाए जाने और भविष्य में फलने-बढ़ने के लिए उद्देश्यपूर्वक बोए जाने—दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक संरचना का अनुवाद ‘वे अपने बच्चों के साथ जीवित रहेंगे’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶזְרָעֵם
  choice: मैं उन्हें ... बोऊँगा
  rationale: זרע का मूल कृषि-संबंधी अर्थ ‘बीज बोना’ है। यहाँ यह विभिन्न जातियों में फैलाए जाने और भावी फलवृद्धि—दोनों की छवि बनाए रखता है; केवल ‘तितर-बितर करूँगा’ कहना इस उद्देश्यपूर्ण रूपक को सीमित कर देता।
- source_word: בָּעַמִּים
  choice: विभिन्न जातियों के बीच
  rationale: עַמִּים बहुवचन में लोगों के सामुदायिक या जातीय समूहों को दर्शाता है। आधुनिक राष्ट्र-राज्यों का भाव देने वाले ‘राष्ट्रों’ की अपेक्षा यह चयन संदर्भ में अधिक स्वाभाविक है।
- source_word: וּבַמֶּרְחַקִּים
  choice: दूर-दूर के स्थानों में
  rationale: מֶרְחַקִּים दूरस्थ स्थानों या प्रदेशों का बोध कराता है। यह अनुवाद उसके स्थानवाचक और बहुवचन भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: יִזְכְּרוּנִי
  choice: वे मुझे याद करेंगे
  rationale: זכר के साथ प्रथम पुरुष एकवचन प्रत्यय का सीधा अर्थ ‘मुझे याद करेंगे’ है। मूल में स्पष्ट रूप से न होने के कारण ‘वहाँ’ नहीं जोड़ा गया।
- source_word: וְחָיוּ
  choice: जीवित रहेंगे
  rationale: חיה यहाँ भविष्य में जीवन, बचे रहने या फिर से जीवन पाने का व्यापक भाव रख सकता है। ‘जीवित रहेंगे’ इस व्यापकता को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: אֶת־בְּנֵיהֶם
  choice: वे और उनके बच्चे
  rationale: यहाँ אֶת को सहवाचक अर्थ में समझा जा सकता है। हिन्दी में ‘वे और उनके बच्चे’ दोनों को जीवित रहने वाले संयुक्त कर्ता के रूप में स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וָשָׁבוּ
  choice: वे लौट आएँगे
  rationale: שוב का सामान्य अर्थ लौटना है। पुनर्स्थापना के इस संदर्भ में यह भौतिक वापसी और परमेश्वर की ओर लौटने की संभावित अनुगूँज दोनों को सुरक्षित रखता है, पर इसे केवल पश्चात्ताप तक सीमित नहीं करता।
theological_decisions:
- issue: पुनर्स्थापना के संदर्भ में बोने के रूपक का अर्थ
  choice: उद्देश्यपूर्ण ढंग से विभिन्न जातियों में बोया जाना, जिसके बाद स्मरण, जीवन और वापसी होती है
  alternative: केवल दण्डस्वरूप तितर-बितर किया जाना; अथवा केवल फलवृद्धि के लिए रोपा जाना
  rationale: निकटवर्ती संदर्भ पुनर्स्थापना का है, फिर भी रूपक फैलाव की वास्तविकता को मिटाता नहीं। ‘बोऊँगा’ दण्डात्मक बिखराव और सकारात्मक फलवृद्धि के बीच मौजूद तनाव को खुला रखता है।
- issue: אֶת־בְּנֵיהֶם में बच्चों का वाक्यगत संबंध
  choice: ‘वे और उनके बच्चे’ को जीवित रहने वाले संयुक्त कर्ता के रूप में प्रस्तुत करना
  alternative: ‘वे अपने बच्चों के साथ जीवित रहेंगे’
  rationale: אֶת का सहवाचक प्रयोग दोनों अर्थों की अनुमति देता है। मुख्य पाठ संयुक्त कर्ता को स्पष्ट करता है, जबकि पाद-टिप्पणी निकटतर संरचनात्मक विकल्प सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बोऊँगा’ मूल रूपक को सुरक्षित रखता है; ‘विभिन्न जातियों’ से आधुनिक राजनीतिक राष्ट्र-राज्य का अनावश्यक अर्थ टलता है। अर्धविराम और छोटे वाक्य भविष्यवाणी के क्रम—बोना, स्मरण करना, जीवित रहना और लौटना—को स्पष्ट करते हैं।
