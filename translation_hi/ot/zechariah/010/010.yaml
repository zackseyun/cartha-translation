source:
  edition: WLC
  text: וַ/הֲשִֽׁיבוֹתִי/ם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם וּ/מֵֽ/אַשּׁ֖וּר אֲקַבְּצֵ֑/ם וְ/אֶל אֶ֨רֶץ גִּלְעָ֤ד וּ/לְבָנוֹן֙ אֲבִיאֵ֔/ם וְ/לֹ֥א יִמָּצֵ֖א לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/010.yaml
  text: I will bring them back from the land of Egypt[a], and gather them from Assyria; I will bring them into the land of Gilead and Lebanon, and no room will be found for them.
translation:
  language: hi
  text: मैं उन्हें मिस्र के देश से वापस लाऊँगा और अश्शूर से उन्हें इकट्ठा करूँगा; मैं उन्हें गिलाद और लबानोन की भूमि में ले आऊँगा, और उनके लिए जगह नहीं मिलेगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “और उनके लिए नहीं पाया जाएगा”; यहाँ “जगह” संदर्भ से निहित है।
    reason: मूल हिब्रू में ‘जगह’ के लिए कोई व्यक्त संज्ञा नहीं है; निष्क्रिय क्रिया का निहित विषय संदर्भ से समझा जाता है।
lexical_decisions:
- source_word: וַהֲשִׁיבוֹתִים
  choice: मैं उन्हें ... लौटा लाऊँगा
  rationale: שׁוב के हिफ़ील रूप में किसी को वापस ले आने का कारणात्मक और स्थानगत भाव है; ‘लौटा लाऊँगा’ आधुनिक हिन्दी में स्वाभाविक रूप से यह अर्थ व्यक्त करता है।
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: मिस्र देश से
  rationale: אֶרֶץ को ‘देश’ के रूप में स्पष्ट रखते हुए मिस्र से वापसी का भौगोलिक भाव सुरक्षित किया गया है।
- source_word: וּמֵאַשּׁוּר אֲקַבְּצֵם
  choice: और अश्शूर से इकट्ठा करूँगा
  rationale: קבץ बिखरे हुए लोगों को एकत्र करने के लिए प्रयुक्त है; ‘इकट्ठा करूँगा’ साधारण आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וְאֶל אֶרֶץ גִּלְעָד וּלְבָנוֹן אֲבִיאֵם
  choice: मैं उन्हें गिलाद और लबानोन के देश में ले आऊँगा
  rationale: ביא के हिफ़ील का सीधा अर्थ ‘ले आना’ है। ‘देश’ אֶרֶץ को बनाए रखता है, जबकि ‘में’ गंतव्य के भीतर पहुँचाने की गति व्यक्त करता है।
- source_word: וְלֹא יִמָּצֵא לָהֶם
  choice: और उनके लिए जगह नहीं मिलेगी
  rationale: हिब्रू में क्रिया निष्क्रिय है और उसका कर्ता/वस्तु अनकहा है। हिन्दी में अर्थगम्यता के लिए संदर्भ से निहित ‘जगह’ जोड़ा गया है, पर निष्क्रिय अभिव्यक्ति और साधारण संयोजक ‘और’ सुरक्षित रखे गए हैं।
theological_decisions:
- issue: וְלֹא יִמָּצֵא לָהֶם में निहित वस्तु
  choice: संदर्भानुसार ‘जगह’ को मुख्य पाठ में स्पष्ट किया गया है।
  alternative: अधिक शाब्दिक रूप में ‘और उनके लिए कुछ नहीं मिलेगा’ कहा जा सकता है, जिससे निहित वस्तु अस्पष्ट रहती है।
  rationale: गिलाद और लबानोन में लोगों को लाए जाने के तुरंत बाद यह वाक्य आता है, इसलिए स्थान की कमी सबसे स्वाभाविक संकेत है। फिर भी ‘जब तक’ या ‘इतने अधिक कि’ नहीं जोड़ा गया, ताकि मूल पाठ से आगे बढ़कर परिणाम अथवा जनसंख्या-वृद्धि का संबंध निश्चित न किया जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अश्शूर’, ‘गिलाद’ और ‘लबानोन’ मानक बाइबिलीय स्थान-नामों के रूप में रखे गए हैं; वाक्य का समन्वयी ‘और’ मूल हिब्रू के अनुक्रम को बनाए रखता है।
