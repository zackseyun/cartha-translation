source:
  edition: WLC
  text: עַל הָֽ/רֹעִים֙ חָרָ֣ה אַפִּ֔/י וְ/עַל הָ/עַתּוּדִ֖ים אֶפְק֑וֹד כִּֽי פָקַד֩ יְהוָ֨ה צְבָא֤וֹת אֶת עֶדְר/וֹ֙ אֶת בֵּ֣ית יְהוּדָ֔ה וְ/שָׂ֣ם אוֹתָ֔/ם כְּ/ס֥וּס הוֹד֖/וֹ בַּ/מִּלְחָמָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/003.yaml
  text: My anger burns against the shepherds[a], and I will punish the male goats; for Yahweh of Armies has attended to his flock, the house of Judah[b], and will make them like his majestic horse in battle.
translation:
  language: hi
  text: मेरा क्रोध चरवाहों[a] पर भड़क उठा है, और मैं बकरों को दण्ड दूँगा; क्योंकि सेनाओं के यहोवा ने अपने झुंड की, अर्थात् यहूदा के घराने की, सुधि ली है और वह उन्हें युद्ध में अपने प्रतापी घोड़े के समान बनाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अगुए; इसी वाक्य में “बकरे” भी प्रमुख शासकों या अगुओं के लिए रूपक हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹעִים
  choice: चरवाहों
  rationale: शाब्दिक पशुपालक-रूपक को बनाए रखता है; संदर्भ में यह अगुओं की ओर संकेत करता है।
- source_word: חָרָה אַפִּי
  choice: मेरा क्रोध ... भड़क उठा है
  rationale: हिब्रू के तीव्र क्रोध-सूचक मुहावरे का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: הָעַתּוּדִים
  choice: बकरों
  rationale: नर बकरों की मूल छवि को चरवाही-संबंधी रूपक के साथ बनाए रखा गया है; यह प्रमुख अगुओं का रूपक भी हो सकता है।
- source_word: אֶפְקֹד
  choice: मैं ... दण्ड दूँगा
  rationale: इस प्रतिकूल संदर्भ में פקד दण्डात्मक निरीक्षण अथवा लेखा लेने को व्यक्त करता है।
- source_word: פָקַד
  choice: सुधि ली है
  rationale: दूसरा פקד अनुकूल हस्तक्षेप और देखभाल व्यक्त करता है; हिन्दी में 'सुधि लेना' इस भाव को स्वाभाविक रूप से रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: व्यक्तिगत दिव्य नाम को लिप्यंतरित किया गया है और צְבָאוֹת की सैनिक शक्ति को स्पष्ट रखा गया है।
- source_word: עֶדְרוֹ
  choice: अपने झुंड
  rationale: चरवाहों और बकरों की विस्तृत पशुपालक छवि के अनुरूप।
- source_word: בֵּית יְהוּדָה
  choice: यहूदा के घराने
  rationale: वंश और समुदाय दोनों को सूचित करने वाला पारंपरिक किंतु सुबोध हिन्दी रूप।
- source_word: וְשָׂם אוֹתָם
  choice: वह उन्हें ... बनाएगा
  rationale: पूर्ववर्ती दैवी हस्तक्षेप के भावी परिणाम के रूप में वाक्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כְּסוּס הוֹדוֹ
  choice: अपने प्रतापी घोड़े के समान
  rationale: הוֹד के प्रताप/वैभव को रखता है और युद्ध का अर्थ अनावश्यक रूप से इसी पद में नहीं जोड़ता।
- source_word: בַּמִּלְחָמָה
  choice: युद्ध में
  rationale: युद्ध-संदर्भ का सीधा और स्वाभाविक हिन्दी अनुवाद।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में आए व्यक्तिगत वाचा-नाम को सामान्य उपाधि में बदलने के बजाय परिचित हिन्दी लिप्यंतरण में रखा गया है।
- issue: עַתּוּדִים को सीधे 'अगुए' कहना या पशु-छवि बनाए रखना
  choice: मुख्य पाठ में 'बकरों' की छवि बनाए रखना
  alternative: अगुए; शासक
  rationale: इससे चरवाहे, बकरे और झुंड की परस्पर जुड़ी भविष्यद्वाणी-संबंधी छवियाँ सुरक्षित रहती हैं और रूपक को अनावश्यक रूप से निर्णीत नहीं किया जाता।
- issue: פקד के दो प्रयोगों का भाव
  choice: पहले को दण्डात्मक और दूसरे को अनुकूल हस्तक्षेप के रूप में व्यक्त करना
  alternative: दोनों स्थानों पर एक ही हिन्दी क्रिया रखना
  rationale: एक ही हिब्रू धातु संदर्भ के अनुसार विपरीत व्यावहारिक प्रभाव रखती है; कृत्रिम एकरूपता हिन्दी में आशय धुंधला कर देती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली। पशुपालक और युद्ध-संबंधी रूपकों को सुरक्षित रखा गया है; 'अर्थात्' से यहूदा के घराने को झुंड की व्याख्या के रूप में स्पष्ट किया गया है।
