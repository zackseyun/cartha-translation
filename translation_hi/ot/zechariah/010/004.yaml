source:
  edition: WLC
  text: מִמֶּ֤/נּוּ פִנָּה֙ מִמֶּ֣/נּוּ יָתֵ֔ד מִמֶּ֖/נּוּ קֶ֣שֶׁת מִלְחָמָ֑ה מִמֶּ֛/נּוּ יֵצֵ֥א כָל נוֹגֵ֖שׂ יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/004.yaml
  text: From him will come the cornerstone[a], from him the tent peg, from him the battle bow[b]; from him every ruler will go out together.
translation:
  language: hi
  text: उसी में से कोने का पत्थर निकलेगा, उसी में से तंबू की खूंटी, उसी में से युद्ध का धनुष[a], और उसी में से हर शासक[b] निकलेगा—सब एक साथ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “कोने का पत्थर,” “तंबू की खूंटी” और “युद्ध का धनुष” यहूदा से उत्पन्न होने वाली स्थिरता, सहारे और सैन्य शक्ति की रूपकात्मक छवियाँ हैं।
    reason: cultural_note
  - marker: b
    text: या “हर अत्याचारी” अथवा “हर बेगार कराने वाला अधिकारी।” इब्रानी शब्द किसी को हाँकने या उससे श्रम अथवा कर वसूलने वाले व्यक्ति को भी दर्शा सकता है; यहाँ इसका संकेत अधिक व्यापक रूप से यहूदा से निकलने वाले शासक की ओर हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מִמֶּנּוּ
  choice: उसी में से
  rationale: इब्रानी रूप पुल्लिंग एकवचन है और पिछले संदर्भ में यह सामूहिक रूप से यहूदा की ओर संकेत करता है। ‘उसी में से’ उस स्रोत-संबंध को व्यक्त करता है और हिन्दी में अनावश्यक रूप से किसी एक पुरुष को निर्दिष्ट नहीं करता।
- source_word: פִנָּה
  choice: कोने का पत्थर
  rationale: शब्द का अर्थ ‘कोना’ अथवा कोने का आधारभूत पत्थर हो सकता है। यहाँ यह स्थिरता और नेतृत्व की रूपकात्मक छवि है; ‘कोने का पत्थर’ स्वाभाविक और पर्याप्त रूप से निकट अनुवाद है।
- source_word: יָתֵד
  choice: तंबू की खूंटी
  rationale: यह शब्द खूंटी, विशेषकर तंबू को टिकाने वाली खूंटी, के लिए प्रयुक्त होता है। स्पष्ट संज्ञा रूपक में दृढ़ सहारे की छवि बनाए रखती है।
- source_word: קֶשֶׁת מִלְחָמָה
  choice: युद्ध का धनुष
  rationale: यह संबंधसूचक पदबंध युद्ध में प्रयुक्त धनुष को दर्शाता है। यह अनुवाद मूल संरचना और सैन्य भाव दोनों को सुरक्षित रखता है।
- source_word: יֵצֵא
  choice: निकलेगा
  rationale: יצא का मूल अर्थ बाहर निकलना या प्रकट होकर आना है। ‘निकलेगा’ स्रोत से उद्भव की बार-बार दोहराई गई छवि को बनाए रखता है।
- source_word: כָל נוֹגֵשׂ
  choice: हर शासक
  rationale: נוֹגֵשׂ प्रायः हाँकने, श्रम या कर वसूलने वाले अधिकारी के लिए आता है और नकारात्मक अर्थ में ‘अत्याचारी’ भी हो सकता है। यहाँ शक्ति और नेतृत्व की सकारात्मक छवियों के क्रम में ‘हर शासक’ संदर्भानुकूल है, जबकि कठोर वैकल्पिक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: יַחְדָּו
  choice: सब एक साथ
  rationale: क्रियाविशेषण सामूहिकता व्यक्त करता है। ‘सब एक साथ’ हिन्दी में अंतिम समूहगत भाव को स्पष्ट रखते हुए उसका ढंग अनिर्धारित छोड़ता है।
theological_decisions:
- issue: כָל נוֹגֵשׂ का सकारात्मक/तटस्थ शासकीय अर्थ लिया जाए या नकारात्मक अर्थ
  choice: हर शासक
  alternative: हर अत्याचारी; हर बेगार कराने वाला अधिकारी
  rationale: कोने का पत्थर, तंबू की खूंटी और युद्ध का धनुष—ये सभी यहूदा से निकलने वाली स्थिरता, सहारे और शक्ति की छवियाँ हैं। इसलिए अंतिम पद को तटस्थ-सकारात्मक शासकीय अर्थ में रखना प्रसंग के अनुकूल है; फिर भी इब्रानी शब्द का प्रमाणित कठोर अर्थ पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: מִמֶּנּוּ के एकवचन प्रत्यय को किसी व्यक्ति के रूप में स्पष्ट किया जाए या सामूहिक यहूदा से जोड़ा जाए
  choice: उसी में से
  alternative: उसी पुरुष से; उन्हीं में से
  rationale: व्याकरणिक रूप एकवचन है, पर संदर्भ में पूर्ववर्ती ‘यहूदा का घराना’ सामूहिक पूर्वपद है। हिन्दी अभिव्यक्ति एकवचन संकेत और सामूहिक संदर्भ दोनों को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु भविष्यद्वाणी की गरिमा और समानांतर पुनरुक्ति को बनाए रखा गया है। ‘उसी में से’ की आवृत्ति इब्रानी पद्य की लय और यहूदा को स्रोत बताने वाले जोर को सुरक्षित रखती है। अंतिम वाक्य में एकवचन ‘हर शासक…निकलेगा’ मूल के एकवचन व्याकरण को बनाए रखता है, जबकि ‘सब एक साथ’ सामूहिक भाव व्यक्त करता है।
