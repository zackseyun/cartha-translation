reference: Zechariah 10:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שַׁאֲל֨וּ מֵ/יְהוָ֤ה מָטָר֙ בְּ/עֵ֣ת מַלְק֔וֹשׁ יְהוָ֖ה עֹשֶׂ֣ה חֲזִיזִ֑ים וּ/מְטַר גֶּ֨שֶׁם֙ יִתֵּ֣ן לָ/הֶ֔ם לְ/אִ֖ישׁ עֵ֥שֶׂב בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/001.yaml
  text: Ask Yahweh for rain in the time of the latter rain[a]; Yahweh makes storm clouds, and he will give them showers of rain[b], to each man vegetation in the field.
translation:
  language: hi
  text: पिछली वर्षा के समय[a] याहवे से वर्षा माँगो। याहवे बिजली की चमकें[b] बनाता है; वह उन्हें वर्षा की झड़ियाँ देगा और हर मनुष्य को खेत में वनस्पति देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पिछली वर्षा के मौसम में”; अर्थात कृषि-वर्ष के अंत की ओर होने वाली देर की वर्षा।
    reason: lexical_alternative
  - marker: b
    text: या “तूफ़ानी बादल।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁאֲלוּ מֵיְהוָה מָטָר
  choice: याहवे से वर्षा माँगो
  rationale: बहुवचन आज्ञार्थक שַׁאֲלוּ और स्रोत बताने वाले מִן को स्वाभाविक हिन्दी में सीधे और स्पष्ट रूप से व्यक्त करता है।
- source_word: בְּעֵת מַלְקוֹשׁ
  choice: पिछली वर्षा के समय
  rationale: מַלְקוֹשׁ कृषि-वर्ष की बाद वाली, फसल पकने से पहले होने वाली वर्षा है। ‘पिछली वर्षा’ स्रोत की क्रम-संबंधी छवि बनाए रखती है; मौसमी अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: עֹשֶׂה חֲזִיזִים
  choice: बिजली की चमकें उत्पन्न करता है
  rationale: חֲזִיזִים का प्रत्यक्ष अर्थ बिजली की चमकें या वज्र-ज्योतियाँ हो सकता है। वर्षा के संदर्भ में सम्भव ‘तूफ़ानी बादल’ अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וּמְטַר גֶּשֶׁם
  choice: वर्षा की झड़ियाँ
  rationale: दो वर्षा-संबंधी संज्ञाओं का मेल साधारण वर्षा से अधिक ठोस और प्रचुर वर्षण का चित्र देता है, बिना अनिवार्य रूप से मूसलाधार बारिश मान लेने के।
- source_word: לְאִישׁ עֵשֶׂב בַּשָּׂדֶה
  choice: हर पुरुष के लिए खेत में हरे पौधे
  rationale: לְאִישׁ के पुल्लिंग एकवचन और वितरणात्मक बल को ‘हर पुरुष’ से रखा गया है। עֵשֶׂב के व्यापक अर्थ को साधारण हिन्दी ‘हरे पौधे’ से व्यक्त किया गया है और בַּשָּׂדֶה में अनकहे स्वामित्व को नहीं जोड़ा गया।
- source_word: יִתֵּן ... עֵשֶׂב
  choice: देगा ... हरे पौधे उगाएगा
  rationale: पहले खंड में יִתֵּן को ‘देगा’ रखा गया है; दूसरे वितरित परिणाम को हिन्दी में ‘हरे पौधे उगाएगा’ कहना स्वाभाविक है और वर्षा द्वारा खेत की उपज देने का आशय स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम יְהוָה दो बार आया है। ‘याहवे’ उसे नाम के रूप में बनाए रखता है, उपाधि में नहीं बदलता।
- issue: לְאִישׁ में पुल्लिंग वितरणात्मक संज्ञा
  choice: हर पुरुष के लिए
  alternative: हर एक के लिए; प्रत्येक व्यक्ति के लिए
  rationale: मूल का אִישׁ पुल्लिंग एकवचन है और यहाँ वितरणात्मक रूप से प्रयुक्त है। अनावश्यक लिंग-निरपेक्षीकरण के बजाय उसका रूप और सामूहिक वितरण दोनों रखे गए हैं।
- issue: वर्षा और खेत की उपज का कर्ता
  choice: याहवे बिजली उत्पन्न करता और वर्षा तथा हरे पौधे देता है
  alternative: प्राकृतिक प्रक्रिया को स्वतंत्र कर्ता बनाना
  rationale: पद का व्याकरण इन प्राकृतिक और कृषि-संबंधी वरदानों का कर्ता याहवे को बताता है; अनुवाद उसी ईश्वर-केंद्रित कथन को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘पिछली वर्षा’ कृषि-सांस्कृतिक पद है, इसलिए उसकी व्याख्या पादटिप्पणी में दी गई है। अर्धविराम समानांतर कथनों को जोड़ता है और याहवे की क्रिया से मिलने वाले परिणाम को स्पष्ट करता है।
