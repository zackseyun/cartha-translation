source:
  edition: WLC
  text: הֲ/ל֛וֹא בַּ/יּ֥וֹם הַ/ה֖וּא נְאֻם יְהוָ֑ה וְ/הַאֲבַדְתִּ֤י חֲכָמִים֙ מֵֽ/אֱד֔וֹם וּ/תְבוּנָ֖ה מֵ/הַ֥ר עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/008.yaml
  text: Will I not[a], on that day, declares Yahweh, destroy the wise men from Edom, and understanding from the mountain of Esau?
translation:
  language: hi
  text: क्या उस दिन—यहोवा की यह वाणी है—मैं एदोम में से बुद्धिमानों को और एसाव के पर्वत[a] से समझ को नष्ट नहीं कर दूँगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एसाव का पर्वत” अथवा “एसाव का पर्वतीय प्रदेश।” इब्रानी में शाब्दिक रूप से “एसाव का पर्वत” है।
    reason: इब्रानी पद किसी विशिष्ट “एसाव के पर्वत” के लिए या एदोम से संबद्ध पर्वतीय भूभाग के लिए प्रयुक्त हो सकता है।
lexical_decisions:
- source_word: הֲלוֹא
  choice: क्या ... न होगा
  rationale: यह अलंकारिक प्रश्न है, जिसका अपेक्षित उत्तर सकारात्मक है; हिन्दी में प्रश्नात्मक बल बनाए रखा गया है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: इब्रानी कालवाचक मुहावरे का स्वाभाविक और निकट हिन्दी रूप।
- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की वाणी है
  rationale: भविष्यद्वाणी के प्रामाणिक दैवी कथन-सूत्र का गरिमापूर्ण और स्पष्ट हिन्दी रूप।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिवाचक दैवी नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा सुरक्षित रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וְהַאֲבַדְתִּי
  choice: मैं ... नष्ट कर दूँगा
  rationale: हिफ़ील रूप यहाँ सक्रिय रूप से मिटा देने या समाप्त कर देने का भाव व्यक्त करता है।
- source_word: חֲכָמִים
  choice: बुद्धिमानों
  rationale: बहुवचन संज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है और एदोम के बुद्धिमान वर्ग का संकेत बनाए रखता है।
- source_word: מֵאֱדוֹם
  choice: एदोम में से
  rationale: מִן के स्रोत अथवा किसी समूह/स्थान के बीच से हटाए जाने के अर्थ को स्पष्ट करता है।
- source_word: וּתְבוּנָה
  choice: समझ
  rationale: अमूर्त संज्ञा के रूप को बनाए रखते हुए विवेक-बुद्धि का सामान्य, सुबोध हिन्दी शब्द चुना गया है।
- source_word: מֵהַר עֵשָׂו
  choice: एसाव के पर्वत में से
  rationale: शाब्दिक पर्वत-चित्र और एदोम के साथ समानांतरता सुरक्षित रहती है; यह पर्वतीय प्रदेश को भी सूचित कर सकता है।
theological_decisions:
- issue: दैवी नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिवाचक वाचा-नाम है; हिन्दी पाठकों में पहचाने जाने योग्य लिप्यंतरण 'यहोवा' नाम को उपाधि में बदले बिना सुरक्षित रखता है।
- issue: חֲכָמִים में लिंग और सामाजिक संदर्भ
  choice: बुद्धिमानों
  alternative: बुद्धिमान पुरुषों / बुद्धिमान लोगों
  rationale: हिन्दी का बहुवचन रूप मूल के बुद्धिमान व्यक्तियों या मान्य बुद्धिमान वर्ग को स्वाभाविक ढंग से व्यक्त करता है; 'पुरुषों' जोड़ना संदर्भ से अधिक स्पष्टता आरोपित करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-शैली रखी गई है। डैश द्वारा नְאֻם־सूत्र को मुख्य अलंकारिक प्रश्न के भीतर स्पष्ट किया गया है; शब्दावली सामान्य पाठक के लिए सुबोध है।
