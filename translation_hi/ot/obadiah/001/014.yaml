source:
  edition: WLC
  text: וְ/אַֽל תַּעֲמֹד֙ עַל הַ/פֶּ֔רֶק לְ/הַכְרִ֖ית אֶת פְּלִיטָ֑י/ו וְ/אַל תַּסְגֵּ֥ר שְׂרִידָ֖י/ו בְּ/י֥וֹם צָרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/014.yaml
  text: Do not stand at the crossroads to cut off his fugitives[c][b][a], and do not hand over his survivors in the day of distress.
translation:
  language: hi
  text: तुम उसके भाग निकलनेवालों को काट डालने के लिए दोराहे पर[a] खड़े न हो, और संकट के दिन उसके बचे हुओं[c] को शत्रु के हाथ न सौंपो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘रास्तों के मोड़ पर’ अथवा ‘पहाड़ी दर्रे पर।’ इब्रानी शब्द ऐसे स्थान को सूचित करता है जहाँ भागनेवालों को रोका जा सकता था।
    reason: lexical_alternative
  - marker: b
    text: या ‘पकड़वा न दो’ अथवा ‘हवाले न करो।’ इब्रानी क्रिया का शाब्दिक अर्थ ‘बंद करना’ है; यहाँ इसका अर्थ किसी को शत्रु के अधिकार में दे देना है।
    reason: lexical_alternative
  - marker: c
    text: या ‘उसके शेष लोगों को।’
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעֲמֹד
  choice: खड़े होकर
  rationale: मूल क्रिया का ठोस अर्थ ‘खड़ा होना’ है; यहाँ आशय भागनेवालों को रोकने के लिए किसी स्थान पर मोर्चा लेने से है।
- source_word: הַפֶּרֶק
  choice: दोराहे पर
  rationale: यह दुर्लभ शब्द ऐसे स्थान को सूचित करता है जहाँ रास्ते अलग होते हैं या जहाँ से भागनेवालों को रोका जा सकता है। ‘दोराहा’ आधुनिक हिन्दी में स्वाभाविक है और स्थल की अनिश्चितता को अत्यधिक विशिष्ट नहीं बनाता।
- source_word: לְהַכְרִית
  choice: काट न डालो
  rationale: כרת की ‘काट देना’ वाली मूल छवि को बनाए रखते हुए यह प्रयोग यहाँ लोगों का अंत कर देने का भाव स्पष्ट करता है।
- source_word: פְּלִיטָיו
  choice: उसके भाग निकलनेवालों
  rationale: פליט उन लोगों को दर्शाता है जो विपत्ति या आक्रमण से बचकर निकल गए या भाग रहे हैं। यह पद ‘भगोड़े’ की संभावित अपराधसूचक छाया से बचता है।
- source_word: תַּסְגֵּר
  choice: शत्रु के हाथ न सौंपो
  rationale: סגר का शाब्दिक अर्थ ‘बंद करना’ है, पर यहाँ किसी को विरोधी के अधिकार में दे देने का मुहावरेदार अर्थ है। ‘शत्रु के हाथ’ संदर्भ में निहित पक्ष को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: שְׂרִידָיו
  choice: उसके बचे हुओं
  rationale: שרד विपत्ति के बाद शेष बचे लोगों को दर्शाता है। यह अनुवाद स्पष्ट है और ‘शेष’ या ‘अवशेष’ से जुड़ी संभावित तकनीकी धर्मवैज्ञानिक छाया को अनावश्यक रूप से नहीं जोड़ता।
- source_word: בְּיוֹם צָרָה
  choice: संकट के दिन
  rationale: यह צרה की गंभीरता तथा वाक्यांश की समयसूचक संरचना, दोनों को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: שְׂרִידָיו में संभावित ‘शेष समुदाय’ की धर्मवैज्ञानिक छाया
  choice: उसके बचे हुओं
  alternative: उसके शेष लोगों / उसके बचे हुए शेष को
  rationale: भविष्यद्वाणी साहित्य में ‘शेष’ कभी विशेष धर्मवैज्ञानिक अर्थ ग्रहण कर सकता है, पर यहाँ तत्काल संदर्भ आक्रमण से जीवित बचे यहूदावासियों का है। इसलिए अनुवाद पाठ से अधिक कोई सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—गंभीर, संक्षिप्त और सामान्य पाठक के लिए सुबोध। ‘भाग निकलनेवाले’ पीड़ितों की स्थिति स्पष्ट करता है, जबकि ‘शत्रु के हाथ सौंपना’ मूल क्रिया का संदर्भगत अर्थ स्वाभाविक रूप से व्यक्त करता है।
