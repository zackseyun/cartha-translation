base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/002.yaml
  text: Look[a], I have made you small among the nations[b]; you are greatly despised.
translation:
  language: hi
  text: देखो, मैंने तुम्हें राष्ट्रों के बीच छोटा[a] कर दिया है[b]; तुम अत्यन्त तिरस्कृत हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राष्ट्रों के बीच महत्त्वहीन।”
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से, “मैंने तुम्हें राष्ट्रों के बीच छोटा दिया है”; यह मुहावरा यहाँ “मैंने तुम्हें राष्ट्रों के बीच छोटा कर दिया है” के अर्थ में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह शब्द श्रोता का ध्यान आगामी घोषणा की ओर खींचता है। आधुनिक हिन्दी में “देखो” इसकी संकेतात्मक और आलंकारिक शक्ति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: קָטֹן
  choice: छोटा
  rationale: यहाँ आकार से अधिक पद, प्रतिष्ठा या महत्त्व में छोटा होने का भाव है। “छोटा” मूल शब्द की व्यापकता बनाए रखता है; अधिक व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
- source_word: נְתַתִּיךָ
  choice: मैंने तुम्हें ... कर दिया है
  rationale: क्रिया का शाब्दिक अर्थ “मैंने तुम्हें दिया है” है, पर विधेय विशेषण “छोटा” के साथ इसका परिणामसूचक अर्थ “मैंने तुम्हें छोटा कर दिया है” बनता है। हिन्दी पूर्ण वर्तमान रूप घोषित कार्य और उसके वर्तमान परिणाम दोनों को व्यक्त करता है।
- source_word: בַּגּוֹיִם
  choice: जातियों के बीच
  rationale: גּוֹיִם यहाँ सामान्य रूप से विभिन्न राष्ट्रों या जातियों को सूचित करता है। “जातियों के बीच” बाद के धार्मिक अर्थभेद को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: בָּזוּי
  choice: तुच्छ समझे जाते हो
  rationale: निष्क्रिय कृदंत किसी को घृणा या अवमानना की दृष्टि से देखे जाने का भाव देता है। “तुच्छ समझे जाते हो” आधुनिक हिन्दी में इस संबंधपरक अवमानना को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: מְאֹד
  choice: बहुत ही
  rationale: यह तीव्रता व्यक्त करने वाला क्रियाविशेषण है। “बहुत ही” हिन्दी में अवमानना की प्रबल मात्रा को सहज ढंग से दर्शाता है।
theological_decisions:
- issue: ईश्वरीय न्याय की घोषणा में हिब्रू पूर्ण पक्ष
  choice: “मैंने तुम्हें ... कर दिया है” के रूप में अनुवाद
  alternative: “मैं तुम्हें ... कर दूँगा” अथवा “मैं तुम्हें ... करता हूँ”
  rationale: हिब्रू में क्रिया पूर्ण रूप में है और भविष्यसूचक वाणी में यह परमेश्वर के निश्चित, घोषित कार्य को व्यक्त कर सकती है। हिन्दी पूर्ण वर्तमान उसके संपन्न अथवा निर्णीत होने और वर्तमान परिणाम को बनाए रखता है, बिना उसे अनिवार्य रूप से केवल भविष्य की घटना बनाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “छोटा” मूल की संक्षिप्तता और अर्थगत व्यापकता को बनाए रखता है, जबकि “तुच्छ समझे जाते हो” हिन्दी में निष्क्रिय अवमानना को स्वाभाविक रूप से व्यक्त करता है। पादटिप्पणी [a] को उसी पदबंध पर रखा गया है जिसका वह वास्तविक विकल्प देती है।
