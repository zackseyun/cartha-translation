reference: Obadiah 1:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: חֲז֖וֹן עֹֽבַדְיָ֑ה כֹּֽה אָמַר֩ אֲדֹנָ֨/י יְהוִ֜ה לֶ/אֱד֗וֹם שְׁמוּעָ֨ה שָׁמַ֜עְנוּ מֵ/אֵ֤ת יְהוָה֙ וְ/צִיר֙ בַּ/גּוֹיִ֣ם שֻׁלָּ֔ח ק֛וּמוּ וְ/נָק֥וּמָה עָלֶי/הָ לַ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/001.yaml
  text: 'The vision of Obadiah[a]. Thus says the Lord GOD concerning Edom: We have heard a report from Yahweh, and a messenger has been sent among the nations: “Rise up[c][b], and let us rise against her for battle.”'
translation:
  language: hi
  text: 'ओबद्याह का दर्शन।


    प्रभु याहवे एदोम के विषय में यों कहता है:

    “हमने याहवे की ओर से एक समाचार सुना है,

    और राष्ट्रों के बीच एक दूत[a] भेजा गया है:

    ‘उठो, और हम उसके[b] विरुद्ध युद्ध के लिए उठ खड़े हों।’”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रतिनिधि” अथवा “राजदूत।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में सर्वनाम स्त्रीलिंग एकवचन है और एदोम को एक राष्ट्र के रूप में दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: “हमने” और “हम ... उठ खड़े हों” में ‘हम’ किसे दर्शाता है, यह इब्रानी पाठ स्पष्ट नहीं करता; इसके एक से अधिक अर्थ सम्भव हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזוֹן
  choice: दर्शन
  rationale: यह संज्ञा भविष्यद्वक्ता को मिले प्रकाशन या दृश्य को दर्शाती है। ‘दर्शन’ भविष्यद्वाणी के शीर्षक में सीधा, प्रचलित और स्वाभाविक हिन्दी रूप है।
- source_word: עֹבַדְיָה
  choice: ओबद्याह
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वाणी की मानक उद्घोषणा है। वर्तमानकालीन ‘यों कहता है’ इसके सूत्रात्मक और जीवंत बल को बनाए रखता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: संयुक्त उपाधि में אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ के रूप में अलग-अलग सुरक्षित रखा गया है।
- source_word: לֶאֱדוֹם
  choice: एदोम के विषय में
  rationale: यहाँ ל भविष्यद्वाणी के विषय को प्रस्तुत करता है; वचन सीधे एदोम को संबोधित करने के बजाय उसके विषय में है।
- source_word: שְׁמוּעָה
  choice: समाचार
  rationale: शब्द का अर्थ सुनी हुई सूचना, खबर या वृत्तांत है। ‘समाचार’ अनिश्चित अफ़वाह का भाव दिए बिना तटस्थ और सहज है।
- source_word: שָׁמַעְנוּ
  choice: हमने ... सुना है
  rationale: पूर्ण क्रिया को वर्तमान प्रासंगिकता सहित व्यक्त किया गया है और प्रथम पुरुष बहुवचन को बिना पहचाने सुरक्षित रखा गया है।
- source_word: מֵאֵת יְהוָה
  choice: याहवे की ओर से
  rationale: यह वाक्यांश समाचार के स्रोत के रूप में יהוה को स्पष्ट करता है; व्यक्तिगत नाम को ‘याहवे’ रखा गया है।
- source_word: וְצִיר
  choice: और ... एक दूत
  rationale: צִיר संदेशवाहक, राजदूत या प्रतिनिधि हो सकता है। ‘दूत’ अर्थ की व्यापकता बनाए रखते हुए इस संदर्भ में स्वाभाविक है।
- source_word: בַּגּוֹיִם
  choice: राष्ट्रों के बीच
  rationale: इस भू-राजनीतिक और युद्ध-संबंधी संदर्भ में גּוֹיִם के लिए ‘राष्ट्र’ स्पष्ट और उपयुक्त है।
- source_word: שֻׁלָּח
  choice: भेजा गया है
  rationale: निष्क्रिय पूर्ण क्रिया किसी पूरे हो चुके प्रेषण की वर्तमान प्रासंगिकता दर्शाती है।
- source_word: קוּמוּ
  choice: उठो
  rationale: बहुवचन आज्ञार्थक का संक्षिप्त और बलपूर्ण हिन्दी रूप, जो युद्ध के आह्वान के अनुकूल है।
- source_word: וְנָקוּמָה עָלֶיהָ לַמִּלְחָמָה
  choice: और हम उसके विरुद्ध युद्ध के लिए उठ खड़े हों
  rationale: प्रथम पुरुष बहुवचन प्रेरणार्थक भाव और एदोम के लिए प्रयुक्त स्त्रीलिंग एकवचन सर्वनाम—दोनों को यथासंभव निकटता से रखा गया है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम सीधे आता है। ‘याहवे’ उसे सामान्य उपाधि में बदलने के बजाय वाचा-संबंधी नाम के रूप में स्पष्ट रखता है।
- issue: ‘हमने सुना है’ और ‘हम ... उठ खड़े हों’ में प्रथम पुरुष बहुवचन का वक्ता
  choice: बहुवचन को बिना वक्ताओं की पहचान निर्धारित किए सुरक्षित रखना
  alternative: भविष्यद्वक्ता और उसके सहचर; स्वर्गीय सभा; युद्ध के लिए बुलाए गए राष्ट्र
  rationale: इब्रानी पाठ ‘हम’ की पहचान स्पष्ट नहीं करता। अनुवाद किसी एक व्याख्या को पाठ में आरोपित नहीं करता।
- issue: עָלֶיהָ में स्त्रीलिंग सर्वनाम का संदर्भ
  choice: ‘उसके विरुद्ध’, जिसका संदर्भ एदोम राष्ट्र है
  alternative: ‘एदोम के विरुद्ध’ को दोहराना
  rationale: मूल का सर्वनाम बनाए रखने से भाषिक रूप और उसका काव्यात्मक संदर्भ सुरक्षित रहता है; पादटिप्पणी संदर्भ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सहज रखी गई है। भविष्यद्वाणी के सूत्र के लिए ‘यों कहता है’ और सैन्य आह्वान के लिए ‘उठो/उठ खड़े हों’ चुने गए हैं। काव्यात्मक पंक्ति-विन्यास मूल कथन की गति और उद्धरण के स्तरों को स्पष्ट करता है।
