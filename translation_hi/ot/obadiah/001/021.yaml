source:
  edition: WLC
  text: וְ/עָל֤וּ מֽוֹשִׁעִים֙ בְּ/הַ֣ר צִיּ֔וֹן לִ/שְׁפֹּ֖ט אֶת הַ֣ר עֵשָׂ֑ו וְ/הָיְתָ֥ה לַֽ/יהוָ֖ה הַ/מְּלוּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/021.yaml
  text: Deliverers will go up on Mount Zion to judge the hill country of Esau[c][b][a], and the kingdom will belong to Yahweh.
translation:
  language: hi
  text: छुड़ाने वाले[a] सिय्योन पर्वत पर एसाव के पहाड़ी प्रदेश[b] का न्याय करने के लिए चढ़ेंगे; और राजसत्ता यहोवा की होगी।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उद्धारकर्ता।’ यहाँ इब्रानी शब्द उन लोगों के लिए है जो छुटकारा दिलाते हैं; इससे यह इनकार नहीं होता कि अंतिम उद्धार यहोवा का है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘एसाव का पर्वत।’ इसका आशय संभवतः एदोम का पर्वतीय भूभाग है।
    reason: lexical_alternative
  - marker: c
    text: या ‘राज्य यहोवा का होगा’ अथवा ‘प्रभुत्व यहोवा का होगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלוּ
  choice: चढ़ेंगे
  rationale: यहाँ नबूवत के क्रम में संयोजक सहित पूर्ण क्रिया भविष्य का भाव देती है। ‘चढ़ेंगे’ सिय्योन की ओर वास्तविक आरोहण की छवि बनाए रखता है।
- source_word: מוֹשִׁעִים
  choice: छुड़ानेवाले
  rationale: बहुवचन कृदंत उन मानवीय प्रतिनिधियों को सूचित करता है जो छुटकारा दिलाते हैं। यह सरल आधुनिक हिन्दी है और परम उद्धारकर्ता के विशिष्ट अर्थ से अनावश्यक भ्रम नहीं पैदा करता।
- source_word: בְּהַר צִיּוֹן
  choice: सिय्योन पर्वत पर
  rationale: यह स्थानवाचक वाक्यांश का स्वाभाविक हिन्दी रूप है और उचित नाम तथा स्थलाकृतिक अर्थ दोनों को सुरक्षित रखता है।
- source_word: לִשְׁפֹּט
  choice: न्याय करें
  rationale: שׁפט का मूल अर्थ ‘न्याय करना’ है। प्रसंग में शासन का भाव भी हो सकता है, पर मुख्य पाठ मूल शाब्दिक केंद्र को बनाए रखता है।
- source_word: אֶת הַר עֵשָׂו
  choice: एसाव के पहाड़ी प्रदेश
  rationale: הַר किसी एक पर्वत के साथ-साथ पर्वतीय भूभाग भी सूचित कर सकता है। यहाँ ‘एसाव’ एदोम और उसके क्षेत्र का प्रतिनिधित्व करता है, इसलिए ‘पहाड़ी प्रदेश’ प्रसंग में स्वाभाविक है।
- source_word: וְהָיְתָה לַיהוָה
  choice: यहोवा की होगी
  rationale: היה के साथ ל स्वामित्व व्यक्त करता है; हिन्दी में ‘यहोवा की होगी’ इस रचना का स्वाभाविक और संक्षिप्त रूप है।
- source_word: הַמְּלוּכָה
  choice: राजसत्ता
  rationale: यह संज्ञा राज्य, राजत्व या सार्वभौम शासन को सूचित कर सकती है। ‘राजसत्ता’ यहाँ शासनाधिकार पर बल देते हुए मूल अर्थ-परास को अच्छी तरह व्यक्त करती है।
theological_decisions:
- issue: ईश्वरीय राजसत्ता के प्रसंग में बहुवचन मानवीय מוֹשִׁעִים का अनुवाद
  choice: छुड़ानेवाले
  alternative: उद्धारकर्ता
  rationale: पद में बहुवचन मानवीय प्रतिनिधि हैं, जबकि अंतिम वाक्य यहोवा की राजसत्ता घोषित करता है। ‘छुड़ानेवाले’ उनकी साधनरूप भूमिका बनाए रखता है और परम उद्धार के विषय में मूल पाठ से अधिक कोई निष्कर्ष नहीं जोड़ता।
- issue: अंतिम वाक्य में הַמְּלוּכָה का अर्थ
  choice: राजसत्ता यहोवा की होगी
  alternative: राज्य यहोवा का होगा; प्रभुत्व यहोवा का होगा
  rationale: इब्रानी शब्द राजकीय शासन, राजत्व अथवा राज्य-क्षेत्र का बोध करा सकता है। ‘राजसत्ता’ शासनाधिकार के भाव को स्पष्ट रखता है, जबकि अन्य वास्तविक संभावनाएँ पादटिप्पणी में दी गई हैं।
- issue: दिव्य नाम יהוה का प्रतिलेखन
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मुख्य पाठ में दिव्य नाम को एक परिचित हिन्दी रूप में नाम के रूप में सुरक्षित रखा गया है, न कि सामान्य उपाधि से प्रतिस्थापित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘चढ़ेंगे,’ ‘न्याय करें’ और ‘राजसत्ता’ मूल की ठोस छवि तथा न्याय-शासन की अर्थगत गंभीरता को सुरक्षित रखते हैं।
