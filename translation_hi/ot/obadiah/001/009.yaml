source:
  edition: WLC
  text: וְ/חַתּ֥וּ גִבּוֹרֶ֖י/ךָ תֵּימָ֑ן לְמַ֧עַן יִכָּֽרֶת אִ֛ישׁ מֵ/הַ֥ר עֵשָׂ֖ו מִ/קָּֽטֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/009.yaml
  text: And your mighty men[a], Teman, will be shattered[c][b], so that every man from the mountain of Esau may be cut off by slaughter.
translation:
  language: hi
  text: तेमान[b], तेरे वीर भयभीत हो जाएँगे[a], ताकि एसाव के पर्वतीय प्रदेश का हर पुरुष संहार में काट डाला जाए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘आतंकित हो जाएँगे’, ‘चकनाचूर हो जाएँगे’ या ‘टूट जाएँगे’ भी हो सकता है। हिब्रू क्रिया भय और पराजय—दोनों पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: तेमान एदोम का एक क्षेत्र या नगर था; यह नाम ‘दक्षिण’ के अर्थ वाले शब्द से संबंधित है।
    reason: cultural_note
  - marker: c
    text: अंतिम वाक्यांश का अनुवाद ‘एसाव के पर्वतीय प्रदेश का हर पुरुष संहार के द्वारा काट डाला जाए’ भी हो सकता है। अंतिम शब्द का संबंध संहार के साधन, कारण, या परिस्थिति से समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְחַתּוּ
  choice: भय से टूट जाएँगे
  rationale: חתת यहाँ सैन्य पराजय के प्रसंग में भय, आतंक और मनोबल टूटने—दोनों का संकेत दे सकता है। यह अभिव्यक्ति केवल भावनात्मक भय या केवल भौतिक विनाश में से किसी एक तक अर्थ को सीमित नहीं करती।
- source_word: גִבּוֹרֶיךָ
  choice: तेरे वीर
  rationale: גִּבּוֹרֶיךָ शक्तिशाली योद्धाओं को दर्शाता है। ‘वीर’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और सैन्य आशय के अनुकूल है।
- source_word: תֵּימָן
  choice: तेमान
  rationale: यहाँ तेमान एदोम से जुड़ा स्थान-नाम है, न कि सामान्य दिशा ‘दक्षिण’; इसलिए इसका लिप्यंतरण किया गया है। पद-विन्यास इसे सीधे संबोधन के रूप में समझने का समर्थन करता है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह आगे आने वाले अपूर्ण क्रियापद के साथ उद्देश्य अथवा लक्षित परिणाम का संबंध व्यक्त करता है; ‘ताकि’ आधुनिक हिन्दी में इस संबंध को सहज रूप से रखता है।
- source_word: יִכָּרֶת
  choice: काट डाला जाए
  rationale: נפעל रूप का मूल अर्थ ‘काट दिया जाना/मिटा दिया जाना’ है। कर्मवाच्य हिन्दी मूल की वाच्य-संरचना और न्याय-संबंधी कठोरता को बनाए रखती है।
- source_word: אִישׁ
  choice: हर पुरुष
  rationale: एकवचन पुल्लिंग संज्ञा यहाँ वितरणात्मक अर्थ रखती है। युद्ध-संबंधी प्रसंग और स्रोत के लिंग-संकेत को बनाए रखने के लिए ‘हर पुरुष’ चुना गया है।
- source_word: מֵהַר עֵשָׂו
  choice: एसाव के पहाड़ का
  rationale: מִן यहाँ उद्गम या क्षेत्रीय संबंध बताता है। स्वाभाविक हिन्दी में ‘पहाड़ का’ उस क्षेत्र से संबंधित व्यक्ति का भाव देता है और ‘एसाव का पहाड़’ संरचना को सुरक्षित रखता है।
- source_word: מִקָּטֶל
  choice: संहार में
  rationale: מִן साधन, कारण या संहार की परिस्थिति बता सकता है। ‘संहार में’ वध की परिस्थिति को व्यक्त करता है, जबकि व्याकरणिक सूक्ष्मता को पादटिप्पणी में खुला रखा गया है।
theological_decisions:
- issue: אִישׁ का पुल्लिंग एकवचन और सामूहिक न्याय
  choice: हर पुरुष
  alternative: हर व्यक्ति / हर एक
  rationale: स्रोत का पुल्लिंग रूप इस युद्ध-संबंधी न्यायवाणी में एदोम के पुरुषों, विशेषकर लड़ने वालों, के सर्वनाश की धारणा से जुड़ा हो सकता है। लिंग-निरपेक्ष रूप चुनकर इस आलंकारिक विशेषता को मिटाया नहीं गया।
- issue: לְמַעַן + יִכָּרֶת में उद्देश्य और परिणाम का संबंध
  choice: ताकि ... काट डाला जाए
  alternative: जिससे ... काट डाला जाएगा
  rationale: हिब्रू रचना उद्देश्य को प्रमुखता देती है, यद्यपि अभिप्रेत परिणाम का भाव भी उपस्थित है। हिन्दी का संभावनात्मक कर्मवाच्य इस तनाव को भविष्यवाणी के साधारण निश्चित कथन में बदलने से बचाता है।
- issue: תֵּימָן का स्थान-नाम और संबोधन
  choice: तेमान, तेरे वीर
  alternative: दक्षिण, तेरे वीर / हे तेमान, तेरे वीर
  rationale: एदोमी संदर्भ में यह स्थान-नाम है। अल्पविराम द्वारा संबोधन स्पष्ट किया गया है, पर मूल में अलग संबोधन-कण न होने के कारण मुख्य पाठ में ‘हे’ नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘तेरे’ भविष्यद्वाणी के सीधे एकवचन संबोधन को स्वाभाविक हिन्दी में बनाए रखता है। ‘भय से टूट जाएँगे’ सैन्य मनोबल और विनाश, दोनों की अर्थ-छाया बचाता है; अंतिम हिब्रू वाक्यांश की वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में दी गई है।
