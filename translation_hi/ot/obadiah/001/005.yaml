  text: אִם גַּנָּבִ֤ים בָּאֽוּ לְ/ךָ֙ אִם שׁ֣וֹדְדֵי לַ֔יְלָה אֵ֣יךְ נִדְמֵ֔יתָה הֲ/ל֥וֹא יִגְנְב֖וּ דַּיָּ֑/ם אִם בֹּֽצְרִים֙ בָּ֣אוּ לָ֔/ךְ הֲ/ל֖וֹא יַשְׁאִ֥ירוּ עֹלֵלֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/005.yaml
  text: If thieves came to you[a], if robbers by night—how you have been destroyed!—would they not steal only enough for themselves? If grape gatherers came to you[b], would they not leave gleanings?
translation:
  language: hi
  text: यदि चोर तेरे पास आते, यदि रात में लुटेरे आते—तू किस तरह नष्ट हो गया है![a]—तो क्या वे अपनी ज़रूरत भर ही न चुराते?[b] यदि अंगूर बटोरनेवाले तेरे पास आते, तो क्या वे कुछ छूटे हुए अंगूर न छोड़ते?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘तू किस तरह काट डाला गया है!’ या ‘तू किस तरह बरबाद हो गया है!’ भी हो सकता है। यहाँ इब्रानी क्रिया विनाश के निकटवर्ती कई अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: ‘क्या वे अपने लिए पर्याप्त मात्रा न चुराते?’ अर्थात जितना उनके लिए काफ़ी होता, उतना ही।'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּנָּבִים
  choice: चोर
  rationale: यह चोरी करनेवालों के लिए सामान्य संज्ञा है; ‘चोर’ इसका स्वाभाविक और प्रचलित हिन्दी पर्याय है।
- source_word: שֹׁדְדֵי לַיְלָה
  choice: रात में लुटेरे
  rationale: שׁדד हिंसक लूट का भाव देता है और לַיְלָה समय बताता है; यह पद दोनों तत्वों को सहज हिन्दी में बनाए रखता है।
- source_word: אֵיךְ נִדְמֵיתָה
  choice: तू किस तरह नष्ट हो गया है
  rationale: निफ़अल क्रिया यहाँ विनाश या बरबादी को व्यक्त करती है और אֵיךְ विस्मयपूर्ण विलाप का स्वर देता है। ‘नष्ट हो गया है’ स्पष्ट है, पर निकटवर्ती वैकल्पिक अर्थों को पाद-टिप्पणी में रखा गया है।
- source_word: הֲלוֹא יִגְנְבוּ דַּיָּם
  choice: क्या वे अपनी ज़रूरत भर ही न चुराते?
  rationale: דַּיָּם का अर्थ ‘उनके लिए पर्याप्त मात्रा’ है। ‘अपनी ज़रूरत भर ही’ उस मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है और पूर्ण लूट के विपरीत सीमित चोरी का संकेत बनाए रखता है।
- source_word: בֹּצְרִים
  choice: अंगूर तोड़नेवाले
  rationale: यह शब्द विशेष रूप से दाख की फसल में अंगूर इकट्ठा करनेवालों के लिए है, सामान्य खेतिहर कटाई करनेवालों के लिए नहीं।
- source_word: יַשְׁאִירוּ עֹלֵלוֹת
  choice: बीनने के लिए कुछ अंगूर न छोड़ते
  rationale: עֹלֵלוֹת मुख्य तुड़ाई के बाद छूटे अंगूर हैं जिन्हें बाद में बीना जा सकता है। यह अनुवाद कृषि-चित्र और कुछ शेष रहने का आशय दोनों स्पष्ट करता है।
- source_word: לְךָ / לָךְ
  choice: तेरे पास
  rationale: आने की क्रिया के साथ לְ का मूल भाव ‘तेरे पास’ है। प्रसंग में आगमन शत्रुतापूर्ण है, पर अनुवाद में अनावश्यक रूप से ‘तेरे विरुद्ध’ जोड़ने से बचा गया है।
