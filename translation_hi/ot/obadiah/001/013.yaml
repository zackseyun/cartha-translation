id: OBA.1.13
reference: Obadiah 1:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַל תָּב֤וֹא בְ/שַֽׁעַר עַמִּ/י֙ בְּ/י֣וֹם אֵידָ֔/ם אַל תֵּ֧רֶא גַם אַתָּ֛ה בְּ/רָעָת֖/וֹ בְּ/י֣וֹם אֵיד֑/וֹ וְ/אַל תִּשְׁלַ֥חְנָה בְ/חֵיל֖/וֹ בְּ/י֥וֹם אֵידֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/013.yaml
  text: Do not enter the gate of my people in the day of their disaster[a]; do not look on his calamity, even you, in the day of his disaster[b]; and do not lay hands on his wealth in the day of his disaster.
translation:
  language: hi
  text: मेरी प्रजा के फाटक से उनकी विपत्ति के दिन प्रवेश न करना; उसकी विपत्ति के दिन तुम भी उसकी दुर्दशा को मत देखना[a]; और उसकी विपत्ति के दिन उसकी संपत्ति पर हाथ न बढ़ाना[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी दुर्दशा देखकर प्रसन्न न होना’; इब्रानी क्रिया का शाब्दिक अर्थ ‘देखना’ है, पर इस प्रसंग में दुर्भावनापूर्ण संतोष से देखने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसकी सेना’, ‘उसका सामर्थ्य’ अथवा ‘उसके संसाधन’; इब्रानी शब्द सैन्य बल, सामर्थ्य या संपत्ति को सूचित कर सकता है। यहाँ लूट के प्रसंग के कारण ‘संपत्ति’ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא בְשַׁעַר עַמִּי
  choice: मेरी प्रजा के फाटक में प्रवेश करना
  rationale: ‘फाटक’ नगर में प्रवेश के ठोस बिंब को बनाए रखता है; इसे केवल ‘नगर में घुसना’ कहकर विस्तृत अर्थ में नहीं बदला गया।
- source_word: בְּיוֹם אֵידָם / בְּיוֹם אֵידוֹ
  choice: उनकी/उसकी विपत्ति के दिन
  rationale: אֵיד के लिए ‘विपत्ति’ स्वाभाविक और गरिमापूर्ण है। मूल पाठ में पहले बहुवचन और फिर एकवचन प्रत्यय आते हैं, इसलिए ‘उनकी’ से ‘उसकी’ का परिवर्तन सुरक्षित रखा गया।
- source_word: תֵּרֶא
  choice: मत देखना
  rationale: ראה का मूल अर्थ ‘देखना’ है। प्रसंग में इसमें किसी की दुर्दशा को दुर्भावनापूर्वक देखने या उस पर प्रसन्न होने का भाव हो सकता है, पर मुख्य पाठ में अधिक स्पष्ट अर्थ थोपने के बजाय मूल क्रिया की अर्थगत व्यापकता रखी गई है।
- source_word: גַם אַתָּה
  choice: तुम भी
  rationale: यह एदोम पर लगाए गए निषेध को बल देता है और इब्रानी के संक्षिप्त, आरोपात्मक जोर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְרָעָתוֹ
  choice: उसकी दुर्दशा
  rationale: यहाँ רָעָה नैतिक बुराई नहीं, बल्कि झेली जा रही विपत्ति या दुर्दशा है। ‘दुर्दशा’ निकटवर्ती אֵיד के लिए प्रयुक्त ‘विपत्ति’ से अर्थपूर्ण भेद भी बनाए रखता है।
- source_word: וְאַל תִּשְׁלַחְנָה בְחֵילוֹ
  choice: उसकी संपत्ति पर हाथ न बढ़ाना
  rationale: שלח בְּ यहाँ किसी वस्तु की ओर हाथ बढ़ाने या उसे लूटने का मुहावरा है। חַיִל के अनेक अर्थों में इस विनाश और लूट के प्रसंग में ‘संपत्ति’ सर्वाधिक उपयुक्त है, जबकि अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
theological_decisions:
- issue: वचन में बहुवचन और एकवचन सर्वनामों का परिवर्तन
  choice: पहले ‘उनकी विपत्ति’, फिर ‘उसकी विपत्ति/दुर्दशा/संपत्ति’
  alternative: सभी सर्वनामों को बहुवचन या सभी को एकवचन कर देना
  rationale: इब्रानी पाठ प्रजा को पहले सामूहिक बहुवचन और फिर मानवीकृत राष्ट्र अथवा भाई के रूप में एकवचन में प्रस्तुत करता है। इस तनाव को समतल नहीं किया गया।
- issue: תֵּרֶא में केवल देखने या दुर्भावनापूर्ण प्रसन्नता का भाव
  choice: मुख्य पाठ में ‘मत देखना’, और प्रसंगगत भाव पादटिप्पणी में
  alternative: ‘उस पर मत फूलना’ या ‘उसे देखकर प्रसन्न मत होना’
  rationale: क्रिया का शाब्दिक अर्थ ‘देखना’ है, यद्यपि शत्रुतापूर्ण प्रसंग दुर्भावनापूर्ण संतोष का संकेत देता है। मुख्य पाठ और पादटिप्पणी मिलकर वास्तविक अर्थगत अस्पष्टता बनाए रखते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। तीनों निषेधों और ‘विपत्ति के दिन’ की पुनरावृत्ति को भविष्यद्वाणी की लय और जोर बनाए रखने के लिए संरक्षित किया गया है।
