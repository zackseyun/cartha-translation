id: OBA.1.20
reference: Obadiah 1:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/גָלֻ֣ת הַֽ/חֵל הַ֠/זֶּה לִ/בְנֵ֨י יִשְׂרָאֵ֤ל אֲשֶֽׁר כְּנַעֲנִים֙ עַד צָ֣רְפַ֔ת וְ/גָלֻ֥ת יְרוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּ/סְפָרַ֑ד יִֽרְשׁ֕וּ אֵ֖ת עָרֵ֥י הַ/נֶּֽגֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/020.yaml
  text: And the exiles of this host of the sons of Israel, who are among the Canaanites as far as Zarephath, and the exiles of Jerusalem who are in Sepharad, will possess the cities of the Negev.
translation:
  language: hi
  text: इस्राएलियों के इस दल के निर्वासित, जो कनानियों के बीच सारपत तक हैं,[a] और यरूशलेम के निर्वासित, जो सफारद में हैं, नेगेव के नगरों के अधिकारी होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस इब्रानी वाक्यांश का अर्थ यह भी हो सकता है: “इस्राएली निर्वासितों का यह दल कनानियों की भूमि पर सारपत तक अधिकार करेगा।”'
    reason: इब्रानी में संबंधसूचक वाक्यांश का निर्वासितों के वर्तमान स्थान या उनके भावी अधिकार-क्षेत्र से संबंध अस्पष्ट है।
lexical_decisions:
- source_word: גָלֻת
  choice: निर्वासित
  rationale: यह संज्ञा निर्वासन में गए समुदाय को सूचित करती है; आधुनिक हिन्दी में ‘निर्वासित’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: הַחֵל
  choice: दल
  rationale: חיל का अर्थ सेना, जनसमूह या संगठित दल हो सकता है। यहाँ ‘दल’ सैन्य अर्थ को अनावश्यक रूप से निश्चित किए बिना सामूहिक भाव बनाए रखता है।
- source_word: צָרְפַת
  choice: सारपत
  rationale: स्थान-नाम का प्रचलित बाइबलीय हिन्दी रूप।
- source_word: סְפָרַד
  choice: सफारद
  rationale: अज्ञात/विवादित प्राचीन स्थान-नाम को अर्थानुवाद के बजाय लिप्यंतरित किया गया है।
- source_word: הַנֶּגֶב
  choice: नेगेव
  rationale: यह दक्षिणी भौगोलिक क्षेत्र का नाम है; लिप्यंतरण इसके विशिष्ट स्थान-नाम होने को सुरक्षित रखता है।
- source_word: יִרְשׁוּ
  choice: अधिकारी होंगे
  rationale: ירשׁ भूमि या नगरों को अधिकार में लेने/विरासत में पाने का भाव देता है; यह पदबंध प्रसंग में स्वाभाविक है और केवल उत्तराधिकार तक अर्थ सीमित नहीं करता।
theological_decisions:
- issue: אֲשֶׁר כְּנַעֲנִים עַד צָרְפַת की वाक्यगत अस्पष्टता
  choice: 'इसे निर्वासितों के स्थान के रूप में प्रस्तुत किया गया: ‘जो कनानियों के बीच सारपत तक हैं।’'
  alternative: 'इसे अधिकार में ली जाने वाली भूमि के रूप में पढ़ा जा सकता है: ‘इस्राएली निर्वासितों का यह दल कनानियों की भूमि पर सारपत तक अधिकार करेगा।’'
  rationale: मसोरेटिक पाठ का संक्षिप्त विन्यास दोनों संबंधों की संभावना देता है। मुख्य पाठ परामर्श-पाठ की समझ बनाए रखता है, जबकि पादटिप्पणी वास्तविक स्रोतगत अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य शैली रखी गई है। स्थान-नाम लिप्यंतरित हैं और कठिन इब्रानी वाक्य-विन्यास की वैकल्पिक समझ पादटिप्पणी में दी गई है।
