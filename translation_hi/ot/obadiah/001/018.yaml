source:
  edition: WLC
  text: וְ/הָיָה֩ בֵית יַעֲקֹ֨ב אֵ֜שׁ וּ/בֵ֧ית יוֹסֵ֣ף לֶהָבָ֗ה וּ/בֵ֤ית עֵשָׂו֙ לְ/קַ֔שׁ וְ/דָלְק֥וּ בָ/הֶ֖ם וַ/אֲכָל֑וּ/ם וְ/לֹֽא יִֽהְיֶ֤ה שָׂרִיד֙ לְ/בֵ֣ית עֵשָׂ֔ו כִּ֥י יְהוָ֖ה דִּבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/018.yaml
  text: The house of Jacob will be a fire[a], and the house of Joseph a flame, and the house of Esau stubble. They will burn them and consume them, and there will be no survivor for the house of Esau[b], for Yahweh has spoken.
translation:
  language: hi
  text: याकूब का घराना आग होगा, और यूसुफ का घराना ज्वाला, और एसाव का घराना सूखी पराली होगा। वे उन्हें जलाकर भस्म कर देंगे[a]। एसाव के घराने में कोई जीवित न बचेगा[b], क्योंकि याहवे ने कहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे उनमें जलेंगे और उन्हें भस्म कर देंगे।” हिब्रानी पदबंध संक्षिप्त है और इसका अर्थ एसाव के घराने के बीच जलना, अथवा उसके विरुद्ध उसे जलाना, समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “एसाव के घराने का कोई शेष न रहेगा।” हिब्रानी שָׂרִיד का अर्थ ‘जीवित बचा व्यक्ति’ या ‘शेष’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵית יַעֲקֹב
  choice: याकूब का घराना
  rationale: ‘घराना’ बֵית के पारिवारिक और सामूहिक-राष्ट्रीय अर्थ को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है; केवल भवन का अर्थ देने वाले ‘घर’ से अधिक स्पष्ट है।
- source_word: אֵשׁ
  choice: आग
  rationale: विधेय रूपक को सहजता से व्यक्त करता है और विनाशकारी शक्ति की छवि बनाए रखता है।
- source_word: בֵית יוֹסֵף
  choice: यूसुफ का घराना
  rationale: ‘याकूब का घराना’ के समानांतर सामूहिक जनसमुदाय का बोध कराता है।
- source_word: לֶהָבָה
  choice: ज्वाला
  rationale: आग के साथ स्वाभाविक काव्यात्मक युग्म बनाता है और तीव्रता को सुरक्षित रखता है।
- source_word: בֵית עֵשָׂו
  choice: एसाव का घराना
  rationale: एसाव के वंश अर्थात एदोम के सामूहिक संदर्भ को बनाए रखता है।
- source_word: לְקַשׁ
  choice: सूखी ठूँठ
  rationale: קַשׁ खेत में बची सूखी, शीघ्र जलने वाली डंठल/ठूँठ को दर्शाता है; ‘सूखी’ हिन्दी पाठक के लिए दहनशीलता की छवि स्पष्ट करती है।
- source_word: וְדָלְקוּ בָהֶם
  choice: वे उन्हें जला डालेंगे
  rationale: अग्नि-रूपक के संदर्भ में דלק और ב का यह स्वाभाविक हिन्दी रूप है। हिब्रानी पदबंध संक्षिप्त है और ‘उनमें जलेंगे’ जैसा अधिक शाब्दिक रूप भी संभव है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: וַאֲכָלוּם
  choice: और भस्म कर देंगे
  rationale: अग्नि के रूपक में אכל का अर्थ पूरी तरह निगलने या नष्ट करने का है; ‘भस्म कर देंगे’ हिन्दी में इस छवि और पूर्णता दोनों को व्यक्त करता है।
- source_word: שָׂרִיד
  choice: कोई जीवित न बचेगा
  rationale: संदर्भ में पूर्ण न्याय-विनाश की घोषणा है। यह हिन्दी में स्वाभाविक ढंग से ‘survivor’ का अर्थ देता है, जबकि ‘बचा हुआ शेष’ भी शब्दार्थतः संभव है।
- source_word: כִּי יְהוָה דִּבֵּר
  choice: क्योंकि यहोवा ने ऐसा कहा है
  rationale: כִּי को कारणसूचक ‘क्योंकि’ और पूर्ण क्रिया को निश्चित भविष्यवाणी की घोषणा के रूप में प्रस्तुत करता है; יְהוָה का लिप्यंतरण ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में परिचित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम को सामान्य पदवी ‘प्रभु’ से प्रतिस्थापित न करके नाम के रूप में रखा गया है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय पाठकों में अधिक परिचित रूप है; ‘याहवे’ ध्वन्यात्मक पुनर्निर्माण के अधिक निकट विकल्प है।
- issue: ‘याकूब का घराना’ और ‘यूसुफ का घराना’ का आशय
  choice: इस्राएल के सामूहिक जनसमुदाय
  alternative: केवल उनके निकट पारिवारिक घर या राजवंश
  rationale: ओबद्याह का व्यापक संदर्भ और पद का समानांतर विन्यास सामूहिक जातीय-राष्ट्रीय समूहों की ओर संकेत करता है; अनुवाद मुहावरे को बनाए रखता है और उसकी व्याख्या पाठ में नहीं जोड़ता।
- issue: שָׂרִיד का न्याय-संदर्भ
  choice: कोई जीवित न बचेगा
  alternative: कोई शेष न रहेगा
  rationale: दोनों अर्थ शब्द में संभव हैं, पर यहाँ एसाव के घराने के पूर्ण विनाश पर बल है। चुना गया रूप सकारात्मक धार्मिक अर्थ वाले ‘शेष’ की अनपेक्षित धारणा से बचाता है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, स्पष्ट भविष्यवाणी-संबंधी गद्य। ‘घराना’ से पारिवारिक-राष्ट्रीय सामूहिकता, तथा ‘सूखी ठूँठ—जला डालेंगे—भस्म’ से मूल अग्नि-रूपक का प्रवाह सुरक्षित रखा गया है।
