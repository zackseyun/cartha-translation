source:
  edition: WLC
  text: וְ/אַל תֵּ֤רֶא בְ/יוֹם אָחִ֨י/ךָ֙ בְּ/י֣וֹם נָכְר֔/וֹ וְ/אַל תִּשְׂמַ֥ח לִ/בְנֵֽי יְהוּדָ֖ה בְּ/י֣וֹם אָבְדָ֑/ם וְ/אַל תַּגְדֵּ֥ל פִּ֖י/ךָ בְּ/י֥וֹם צָרָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/012.yaml
  text: Do not look on your brother in the day of his misfortune[a], and do not rejoice over the sons of Judah in the day of their destruction[c][b]; and do not make your mouth great in the day of distress.
translation:
  language: hi
  text: अपने भाई के दुर्भाग्य[b] के दिन उसकी दुर्दशा पर मत इतराना[a]; यहूदा के पुत्रों के विनाश के दिन उन पर आनन्दित मत होना; और संकट के दिन बड़ी-बड़ी बातें मत करना[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘उस पर मत देखना’; यहाँ संदर्भ में आशय उसकी दुर्दशा को दुर्भावनापूर्ण संतोष से देखने, अर्थात् उस पर इतराने का है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसके पराया हो जाने के दिन’ अथवा ‘उसकी विपत्ति के दिन।’ इब्रानी शब्द परायापन और दुर्दशा—दोनों भाव दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘अपना मुँह बड़ा मत करना,’ अर्थात् अहंकार से या डींग मारते हुए मत बोलना।
    reason: idiom_explanation
lexical_decisions:
- source_word: תֵּרֶא
  choice: उसे देखकर मत इतराना
  rationale: क्रिया का मूल अर्थ ‘देखना’ है, पर समानांतर निषेध—आनन्द करने और अहंकारी बातें करने के विरुद्ध—दुर्भावनापूर्ण संतोष का भाव दिखाते हैं। हिन्दी में ‘देखकर मत इतराना’ दृश्य बिंब और संदर्भगत भाव दोनों रखता है।
- source_word: אָחִיךָ
  choice: अपने भाई
  rationale: शाब्दिक पारिवारिक संबोधन रखा गया है; यह एदोम और यहूदा के बीच भाईचारे तथा विश्वासघात की नैतिक गंभीरता को व्यक्त करता है।
- source_word: נָכְרוֹ
  choice: उसके दुर्भाग्य
  rationale: संदर्भ में यह राष्ट्रीय विपत्ति के दिन को सूचित करता है, किन्तु मूल से परायापन अथवा अजनबी बन जाने का अर्थ भी संभव है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: לִבְנֵי יְהוּדָה
  choice: यहूदा के पुत्रों
  rationale: मूल का पारिवारिक-राष्ट्रीय पद औपचारिक रूप से सुरक्षित रखा गया है; यह सामूहिक रूप से यहूदा के लोगों को दर्शाता है।
- source_word: אָבְדָם
  choice: उनके विनाश
  rationale: אבד यहाँ नाश, पतन या विनाश को दर्शाता है; राष्ट्रीय संकट के संदर्भ में ‘विनाश’ स्वाभाविक और गंभीर है।
- source_word: תַּגְדֵּל פִּיךָ
  choice: बढ़-बढ़कर बातें मत करना
  rationale: शाब्दिक बिंब ‘अपना मुँह बड़ा करना’ अहंकारी या डींगभरी वाणी का मुहावरा है। हिन्दी का चुना हुआ मुहावरा आशय को स्वाभाविक ढंग से व्यक्त करता है, जबकि मूल बिंब पादटिप्पणी में दिया गया है।
- source_word: צָרָה
  choice: संकट
  rationale: यह शब्द तंगी, क्लेश या विपत्ति को दर्शाता है; ‘संकट’ आधुनिक हिन्दी में स्पष्ट और भविष्यद्वाणी के गंभीर स्वर के अनुकूल है।
theological_decisions:
- issue: एदोम और यहूदा के लिए पारिवारिक भाषा
  choice: अपने भाई
  alternative: अपने बन्धु
  rationale: ‘भाई’ मूल संबोधन की पारिवारिक शक्ति को बनाए रखता है और एदोम द्वारा निकट संबंधी के साथ किए गए विश्वासघात को सामान्यीकृत नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर निषेधों की भविष्यद्वाणी-संबंधी लय बनाए रखने के लिए तीनों खंडों में ‘मत’ का प्रयोग किया गया है।
