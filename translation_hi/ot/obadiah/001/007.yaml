source:
  edition: WLC
  text: עַֽד הַ/גְּב֣וּל שִׁלְּח֗וּ/ךָ כֹּ֚ל אַנְשֵׁ֣י בְרִיתֶ֔/ךָ הִשִּׁיא֛וּ/ךָ יָכְל֥וּ לְ/ךָ֖ אַנְשֵׁ֣י שְׁלֹמֶ֑/ךָ לַחְמְ/ךָ֗ יָשִׂ֤ימוּ מָזוֹר֙ תַּחְתֶּ֔י/ךָ אֵ֥ין תְּבוּנָ֖ה בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/007.yaml
  text: All the men of your covenant have sent you to the border[a]; the men at peace with you have deceived you and prevailed against you[c][b]. Those who eat your bread have set a trap under you—there is no understanding in him.
translation:
  language: hi
  text: तेरे साथ वाचा करनेवाले सभी लोगों ने तुझे सीमा तक भेज दिया है[a]; तेरे साथ शान्ति से रहनेवालों ने तुझे धोखा दिया और तुझ पर प्रबल हो गए। तेरी रोटी खानेवालों ने तेरे नीचे फंदा लगाया है[b]—उसमें समझ नहीं है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुझे सीमा तक खदेड़ दिया है’ अथवा ‘तुझे सीमा तक विदा करने गए हैं।’ इब्रानी क्रिया प्रसंग में तटस्थ या शत्रुतापूर्ण, दोनों भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तेरे नीचे जाल बिछाया है।’ ‘फंदा’ के लिए प्रयुक्त इब्रानी शब्द दुर्लभ है और उसका ठीक अर्थ अनिश्चित है।
    reason: lexical_alternative
  - marker: c
    text: या ‘उसमें विवेक नहीं है।’ सम्भवतः ‘उस’ से एदोम का संकेत है; कुछ लोग इसे ‘इसमें’ समझते हैं या पंक्ति का अलग अर्थ लेते हैं, क्योंकि इब्रानी में सन्दर्भ अस्पष्ट है।
    reason: alternative_reading
lexical_decisions:
- source_word: עַד הַגְּבוּל
  choice: सीमा तक
  rationale: यह गन्तव्य की ठोस स्थानिक छवि को बनाए रखता है और अपने आप यह तय नहीं करता कि वहाँ तक पहुँचाना निष्कासन था या साथ छोड़ना।
- source_word: שִׁלְּחוּךָ
  choice: तुझे ... भेज दिया है
  rationale: पिएल क्रिया का व्यापक अर्थ ‘विदा करना/भेज देना’ है; शत्रुतापूर्ण भाव सन्दर्भ से उभरता है, इसलिए मुख्य पाठ में अधिक निर्णायक ‘खदेड़ दिया’ नहीं रखा गया।
- source_word: אַנְשֵׁי בְרִיתֶךָ
  choice: तेरे वाचा बाँधनेवाले सभी लोग
  rationale: यह ‘तेरी वाचा के पुरुष’ के वाचा-सन्धि सम्बन्ध को साधारण आधुनिक हिन्दी में व्यक्त करता है और इसे केवल ‘मित्रों’ तक सीमित नहीं करता।
- source_word: הִשִּׁיאוּךָ
  choice: तुझे धोखा दिया
  rationale: यहाँ हिफ़ील रूप किसी को भ्रमित या छलित करने का भाव देता है; राजनीतिक विश्वासघात के प्रसंग में ‘धोखा दिया’ स्पष्ट और स्वाभाविक है।
- source_word: יָכְלוּ לְךָ
  choice: तुझ पर प्रबल हो गए
  rationale: यह יכל ל की विरोधात्मक शक्ति को निकटता से व्यक्त करता है और मूल के पूर्ण समानान्तर क्रियात्मक प्रवाह को बनाए रखता है।
- source_word: אַנְשֵׁי שְׁלֹמֶךָ
  choice: तेरे साथ शान्ति रखनेवाले
  rationale: यह शाब्दिक ‘तेरी शान्ति के पुरुष’ को स्वाभाविक हिन्दी में व्यक्त करते हुए शान्तिपूर्ण सम्बन्ध का भाव बचाता है।
- source_word: לַחְמְךָ
  choice: तेरी रोटी
  rationale: ‘रोटी’ भोजन-साझेदारी और निष्ठा की मूल छवि को सुरक्षित रखती है।
- source_word: יָשִׂימוּ מָזוֹר תַּחְתֶּיךָ
  choice: तेरे नीचे फन्दा लगाया है
  rationale: दुर्लभ מָזוֹר का सटीक अर्थ अनिश्चित है; ‘फन्दा’ विश्वासघात के प्रसंग में सम्भाव्य है और ‘नीचे’ मूल रूपक को बनाए रखता है।
- source_word: אֵין תְּבוּנָה בּוֹ
  choice: उसमें समझ नहीं है
  rationale: पुल्लिंग एकवचन प्रत्यय को ‘उसमें’ से सुरक्षित रखा गया है, ताकि यह एदोम अथवा पहले उल्लिखित व्यक्ति की ओर संकेत कर सके; अस्पष्ट सन्दर्भ को मुख्य पाठ में निर्णायक रूप से नहीं सुलझाया गया।
theological_decisions:
- issue: अन्तिम वाक्य में בּוֹ का सन्दर्भ
  choice: ‘उसमें समझ नहीं है’ द्वारा पुल्लिंग एकवचन और अस्पष्टता बनाए रखी गई
  alternative: ‘तुझमें समझ नहीं है’ या ‘इसमें कोई समझ नहीं’
  rationale: मूल पाठ व्याकरणतः पुल्लिंग एकवचन है, पर उसका सन्दर्भ विवादित है; किसी एक व्याख्या को धर्मवैचारिक रूप से थोपना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप रखा गया है। ‘वाचा’ और ‘रोटी’ जैसे प्रमुख मूल बिम्ब सुरक्षित हैं; ‘वाचा बाँधनेवाले’ से राजनीतिक सन्धि का अर्थ स्पष्ट होता है। सर्वनामों में एकवचन ‘तू’ का रूप मूल सम्बोधन के अनुरूप रखा गया है।
