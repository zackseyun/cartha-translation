id: OBA.1.4
reference: Obadiah 1:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִם תַּגְבִּ֣יהַּ כַּ/נֶּ֔שֶׁר וְ/אִם בֵּ֥ין כּֽוֹכָבִ֖ים שִׂ֣ים קִנֶּ֑/ךָ מִ/שָּׁ֥ם אוֹרִֽידְ/ךָ֖ נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/004.yaml
  text: Though you soar high like the eagle[a], and though you set your nest among the stars, from there I will bring you down, declares Yahweh.
translation:
  language: hi
  text: चाहे तू उकाब के समान ऊँचा उठ जाए[a], और चाहे तारों के बीच अपना घोंसला बना ले, फिर भी मैं तुझे वहाँ से नीचे उतारूँगा—यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “यदि तू उकाब के समान ऊँचा उठे ... और यदि तू तारों के बीच अपना घोंसला बनाए।” इब्रानी शर्तसूचक शब्द का अनुवाद “यदि” भी हो सकता है, पर यहाँ उसका भाव रियायती है: तू चाहे कितनी भी ऊँचाई पर पहुँच जाए, याहवे तुझे नीचे उतारेगा।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם ... וְאִם
  choice: चाहे ... और चाहे
  rationale: 'दोनों शर्तसूचक अव्यय यहाँ रियायती भाव प्रकट करते हैं: एदोम कितनी भी ऊँचाई पर पहुँच जाए, याहवे उसे नीचे उतारेगा। दोहराव से इब्रानी काव्य की समानांतर रचना भी बनी रहती है।'
- source_word: תַּגְבִּיהַּ כַּנֶּשֶׁר
  choice: तू उकाब के समान ऊँचा उठ जाए
  rationale: גבה के हिफ़ील रूप का मूल भाव ऊँचा करना या ऊँचा उठना है। उकाब की उपमा के साथ यह स्थानगत ऊँचाई और आत्मोन्नति—दोनों संकेतों को बिना किसी एक अर्थ तक सीमित किए सुरक्षित रखता है।
- source_word: בֵּין כּוֹכָבִים
  choice: तारों के बीच
  rationale: बहुवचन सामूहिक संज्ञा के साथ בֵּין का स्वाभाविक हिन्दी रूप ‘के बीच’ है और यह असंभव-सी ऊँचाई का चित्र बनाए रखता है।
- source_word: שִׂים קִנֶּךָ
  choice: अपना घोंसला बना ले
  rationale: शाब्दिक अर्थ ‘अपना घोंसला रख/स्थापित कर’ है; आधुनिक हिन्दी में ‘घोंसला बना ले’ अधिक स्वाभाविक है और उकाब के चित्र को बनाए रखता है।
- source_word: מִשָּׁם אוֹרִידְךָ
  choice: मैं तुझे वहाँ से नीचे उतारूँगा
  rationale: ירד का हिफ़ील रूप कारणवाचक है, अर्थात नीचे ले आना। ‘नीचे उतारूँगा’ अनावश्यक हिंसात्मक बल जोड़े बिना उलटाव को स्पष्ट करता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह मानक भविष्यद्वाणी-सूत्र है। יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: אִם का शर्तसूचक या रियायती अर्थ
  choice: 'रियायती: ‘चाहे ... फिर भी’'
  alternative: 'शर्तसूचक: ‘यदि ... तो’'
  rationale: भविष्यद्वाणी के प्रसंग में परिणाम अनिश्चित नहीं है। भाव यह है कि अत्यन्त ऊँचा और सुरक्षित स्थान भी याहवे के न्याय से नहीं बचा सकता; फिर भी शाब्दिक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है; लिप्यंतरण उसे सामान्य उपाधि में बदलने से बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। एदोम को संबोधित इब्रानी एकवचन पुल्लिंग के लिए ‘तू/तुझे’ रखा गया है, जिससे भविष्यद्वाणी का प्रत्यक्ष और तीखा संबोधन बना रहता है। ‘फिर भी’ लक्ष्य-पंक्ति में निहित रियायती निष्कर्ष को हिन्दी में स्पष्ट करता है।
