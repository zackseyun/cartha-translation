  text: כִּ֗י כַּֽ/אֲשֶׁ֤ר שְׁתִיתֶם֙ עַל הַ֣ר קָדְשִׁ֔/י יִשְׁתּ֥וּ כָֽל הַ/גּוֹיִ֖ם תָּמִ֑יד וְ/שָׁת֣וּ וְ/לָע֔וּ וְ/הָי֖וּ כְּ/ל֥וֹא הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/016.yaml
  text: For just as you drank on my holy mountain[a], all the nations will drink continually; they will drink and swallow[b], and they will be as though they had never been.
translation:
  language: hi
  text: क्योंकि जैसे तुमने मेरे पवित्र पर्वत पर पिया, वैसे ही सब राष्ट्र निरन्तर पीते रहेंगे[b]; वे पीएँगे और उसे निगल जाएँगे[a], और ऐसे हो जाएँगे मानो वे कभी थे ही नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूरा गटक जाएँगे।” इब्रानी क्रिया दुर्लभ है और सम्भवतः पी हुई वस्तु को पूरी तरह निगल जाने पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ पीना सम्भवतः परमेश्वर के न्याय को भोगने का बिंब है, जो भविष्यद्वक्ताओं के लेखों में सामान्य है।
    reason: cross_reference
lexical_decisions:
- source_word: כִּי כַּאֲשֶׁר
  choice: क्योंकि जैसे... वैसे ही
  rationale: כִּי पिछले न्याय-वचन का आधार प्रस्तुत करता है और כַּאֲשֶׁר एदोम के किए तथा राष्ट्रों के भावी अनुभव के बीच तुलना स्थापित करता है। हिन्दी में यह युग्म संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: שְׁתִיתֶם
  choice: तुमने... पिया
  rationale: यह द्वितीय पुरुष बहुवचन पूर्ण क्रिया है और प्रसंग में एदोम को संबोधित करती है; सरल भूतकाल उपयुक्त है।
- source_word: עַל הַר קָדְשִׁי
  choice: मेरे पवित्र पर्वत पर
  rationale: मूल का ठोस स्थान-संकेत सुरक्षित है; यह सिय्योन/यरूशलेम की ओर संकेत करता है, पर नाम को मुख्य पाठ में नहीं जोड़ा गया।
- source_word: יִשְׁתּוּ כָל הַגּוֹיִם תָּמִיד
  choice: सब राष्ट्र निरन्तर पीते रहेंगे
  rationale: भावी न्याय, सभी राष्ट्रों का व्यापक संदर्भ और תָּמִיד की लगातार चलने वाली क्रिया—तीनों को सहज हिन्दी में व्यक्त करता है।
- source_word: וְשָׁתוּ וְלָעוּ
  choice: वे पीएँगे और निगल जाएँगे
  rationale: दोनों क्रियाओं की पुनरुक्ति और तीव्रता बनाए रखी गई है। לָעוּ का दुर्लभ अर्थ पूरी तरह निगलने से संबंधित समझा गया है, पर इसकी संभावित अर्थगत अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: וְהָיוּ כְּלוֹא הָיוּ
  choice: ऐसे हो जाएँगे मानो वे कभी थे ही नहीं
  rationale: मूल उपमा और पूर्ण विनाश की प्रबलता को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है, बिना इसे शाब्दिक अस्तित्व-निषेध के रूप में अधिक स्पष्ट किए।
theological_decisions:
- issue: पीने के बिंब का स्वरूप
  choice: मुख्य पाठ में ‘पीना’ बनाए रखा गया; पादटिप्पणी में इसे सम्भवतः दैवी न्याय का भविष्यद्वाणी-संबंधी बिंब बताया गया।
  alternative: इसे सीधे ‘दण्ड भोगना’ कहना, अथवा केवल शाब्दिक मदिरापान मानना।
  rationale: प्रसंग और अन्य भविष्यद्वाणी साहित्य न्याय के प्याले की ओर संकेत करते हैं, फिर भी मूल पाठ ‘पीना’ ही कहता है। इसलिए रूपक को अनुवाद में खोलकर धार्मिक अर्थ थोपने के बजाय तनाव सुरक्षित रखा गया।
- issue: द्वितीय पुरुष बहुवचन का संदर्भ
  choice: मुख्य पाठ में केवल ‘तुम’ रखा गया, जबकि प्रसंगानुसार यह एदोम है।
  alternative: मुख्य पाठ में ‘हे एदोम’ जोड़ना, या इसे सभी राष्ट्रों का संबोधन मानना।
  rationale: आसपास का प्रसंग एदोम को संबोधित करता है, लेकिन इस पद में नाम नहीं है; अतः उसे पाठ में जोड़ना अनावश्यक व्याख्यात्मक विस्तार होता।
- issue: अन्तिम वाक्यांश का आशय
  choice: ‘मानो वे कभी थे ही नहीं’ द्वारा विनाश की तुलना सुरक्षित रखी गई।
  alternative: ‘उनका अस्तित्व पूरी तरह मिट जाएगा’ कहना।
  rationale: विस्तारित विकल्प सम्भावित आशय बताता है, लेकिन मूल की ‘मानो’ वाली उपमा और उसकी काव्यात्मक-धार्मिक गंभीरता को कम कर देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट भविष्यद्वाणी शैली अपनाई गई है। ‘राष्ट्र’ ने גּוֹיִם का व्यापक अर्थ रखा है; ‘जातियाँ’ या बाद की यहूदी-मसीही श्रेणी सूचित करने वाला शब्द नहीं चुना गया। हर पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित है।
