source:
  edition: WLC
  text: זְד֤וֹן לִבְּ/ךָ֙ הִשִּׁיאֶ֔/ךָ שֹׁכְנִ֥י בְ/חַגְוֵי סֶּ֖לַע מְר֣וֹם שִׁבְתּ֑/וֹ אֹמֵ֣ר בְּ/לִבּ֔/וֹ מִ֥י יוֹרִדֵ֖/נִי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/003.yaml
  text: The pride of your heart has deceived you[a], you who dwell in the clefts of the rock, whose dwelling is on high, who say in your heart[c][b], “Who will bring me down to the ground?”
translation:
  language: hi
  text: तेरे मन का घमंड ने तुझे धोखा दिया है[a]—तू, जो चट्टान की दरारों में रहता है[b], जिसका निवास ऊँचाई पर है और जो अपने मन में कहता है, “कौन मुझे नीचे धरती पर उतारेगा?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अहंकार’ अथवा ‘दुस्साहस’।
    reason: lexical_alternative
  - marker: b
    text: इस वाक्यांश का अर्थ ‘चट्टान की खोहों में’ भी हो सकता है। यह दुर्गम चट्टानी गढ़ों और सुरक्षित पहाड़ी निवासों का चित्र प्रस्तुत करता है।
    reason: cultural_note
  - marker: c
    text: या ‘भूमि पर’।
    reason: lexical_alternative
lexical_decisions:
- source_word: זְדוֹן
  choice: घमंड
  rationale: यह शब्द अहंकारी आत्म-उत्थान और दुस्साहस का भाव व्यक्त करता है। ‘घमंड’ आधुनिक हिन्दी में स्वाभाविक है और एदोम पर लगाए गए भविष्यद्वाणी के आरोप को स्पष्ट रखता है।
- source_word: לִבְּךָ
  choice: तेरे मन
  rationale: इब्रानी ‘हृदय’ भीतर के विचार, इच्छा और आत्मबोध को दर्शाता है। हिन्दी में ‘मन’ यहाँ स्वाभाविक रूप से उसी आंतरिक भाव को व्यक्त करता है और आगे आने वाले ‘अपने मन में’ से संबंध बनाए रखता है।
- source_word: הִשִּׁיאֶךָ
  choice: तुझे धोखा दिया है
  rationale: इस कारक रूप का अर्थ बहकाना या धोखे में डालना है। यह अनुवाद बताता है कि एदोम अपने ही घमंड के कारण वास्तविकता को पहचान नहीं पाया।
- source_word: שֹׁכְנִי
  choice: तू, जो ... रहता है
  rationale: सहभागी रूप संबोधित व्यक्ति का वर्णन करता है। प्रत्यक्ष संबोधन हिन्दी में भविष्यद्वाणी की तीव्रता और वाक्य की सहजता बनाए रखता है।
- source_word: בְחַגְוֵי סֶּלַע
  choice: चट्टान की दरारों में
  rationale: यह वाक्यांश चट्टानी दरारों, खोहों या सुरक्षित ओटों को सूचित करता है। ‘चट्टान की दरारों’ से ऊबड़-खाबड़, दुर्गम निवास का चित्र स्पष्ट होता है।
- source_word: מְרוֹם שִׁבְתּוֹ
  choice: जिसका निवास ऊँचाई पर है
  rationale: यह वाक्यांश निवास की ऊँची और दुर्गम स्थिति बताता है। संबंधवाचक रचना मूल के वर्णन को सहज हिन्दी में जोड़ती है।
- source_word: אֹמֵר בְּלִבּוֹ
  choice: जो अपने मन में कहता है
  rationale: मूल में यहाँ तृतीय पुरुष रूप है, जबकि व्यापक वाक्य एदोम को प्रत्यक्ष रूप से संबोधित करता है। संबंधवाचक प्रत्यक्ष-संबोधन रचना सामूहिक एकवचन का प्रवाह बनाए रखती है।
- source_word: מִי יוֹרִדֵנִי
  choice: कौन मुझे नीचे ... उतारेगा
  rationale: कारक क्रिया का अर्थ किसी को नीचे ले आना है। ‘नीचे उतारेगा’ ऊँचे निवास और धरती के बीच स्थानिक विरोध तथा वक्ता के आत्मविश्वासी चुनौती-भाव को सुरक्षित रखता है।
- source_word: אָרֶץ
  choice: धरती पर
  rationale: यहाँ शब्द ऊँचे निवास के विपरीत नीचे की धरती को सूचित करता है। ‘धरती पर’ स्थानिक विरोध को स्पष्ट रखता है; ‘भूमि पर’ भी संभव है।
theological_decisions:
- issue: द्वितीय पुरुष संबोधन के बीच तृतीय पुरुष के सहभागी रूपों और सर्वनाम-प्रत्ययों का परिवर्तन
  choice: 'वर्णनात्मक उपवाक्यों को एदोम के प्रत्यक्ष संबोधन से जोड़ना: ‘तू, जो ... जिसका ... और जो अपने मन में कहता है।’'
  alternative: 'रूपों को अधिक शाब्दिक रूप से तृतीय पुरुष में रखना: ‘वह जो रहता है ... उसका निवास ... जो अपने मन में कहता है।’'
  rationale: पद का आरंभ एदोम के प्रत्यक्ष द्वितीय पुरुष संबोधन से होता है। बीच के तृतीय पुरुष रूप उसी सामूहिक संबोधित व्यक्ति का वर्णन करते हैं। प्रत्यक्ष संबोधन में उन्हें जोड़ना अर्थ और भविष्यद्वाणी की शक्ति को बनाए रखते हुए असहज पुरुष-परिवर्तन से बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रत्यक्ष है। एदोम के लिए सामूहिक एकवचन ‘तू/तेरे/तुझे’ रखा गया है, जिससे मूल का निकट और आरोपात्मक संबोधन बना रहता है। ‘मन’ आधुनिक हिन्दी में आंतरिक विचार और अभिमान को स्वाभाविक रूप से व्यक्त करता है।
