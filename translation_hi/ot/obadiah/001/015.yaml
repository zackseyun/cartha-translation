  text: כִּֽי קָר֥וֹב יוֹם יְהוָ֖ה עַל כָּל הַ/גּוֹיִ֑ם כַּ/אֲשֶׁ֤ר עָשִׂ֨יתָ֙ יֵעָ֣שֶׂה לָּ֔/ךְ גְּמֻלְ/ךָ֖ יָשׁ֥וּב בְּ/רֹאשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/015.yaml
  text: For the day of Yahweh is near upon all the nations[a]. As you have done, it will be done to you[b]; your recompense will return on your own head.
translation:
  language: hi
  text: क्योंकि याहवे का दिन सब राष्ट्रों पर निकट है[a]। जैसा तूने किया है, वैसा ही तेरे साथ किया जाएगा; तेरा प्रतिफल[b] तेरे ही सिर पर लौट आएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सब राष्ट्रों के विरुद्ध।” यहाँ प्रयुक्त पूर्वसर्ग उस न्याय को सूचित कर सकता है जो राष्ट्रों के विरुद्ध निर्देशित है।
    reason: lexical_alternative
  - marker: b
    text: या, “तेरा प्रतिदान” अथवा “तेरा किया हुआ व्यवहार।” इब्रानी शब्द उस फल को दर्शाता है जो किसी व्यक्ति के कामों के उत्तर में उसी पर लौटता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या कारण प्रस्तुत करता है और इब्रानी के व्याख्यात्मक-कारणवाचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: קָרוֹב
  choice: निकट है
  rationale: विधेय विशेषण आसन्नता व्यक्त करता है; ‘निकट है’ स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी है।
- source_word: יוֹם יְהוָה
  choice: याहवे का दिन
  rationale: यह याहवे के निर्णायक न्याय के दिन का प्रचलित भविष्यद्वाणी-संबंधी पद है; व्यक्तिगत दिव्य नाम को शीर्षक से नहीं बदला गया है।
- source_word: עַל כָּל הַגּוֹיִם
  choice: सब जातियों पर
  rationale: עַל के दिशात्मक और न्याय-संबंधी बल को बनाए रखता है, जबकि ‘के विरुद्ध’ वाली अधिक स्पष्ट व्याख्या को पादटिप्पणी में दिया गया है।
- source_word: כַּאֲשֶׁר עָשִׂיתָ
  choice: जैसा तूने किया है
  rationale: प्रतिशोधात्मक न्याय की तुलनात्मक संरचना को सीधे बनाए रखता है; एकवचन संबोधन के लिए ‘तू’ प्रयुक्त है।
- source_word: יֵעָשֶׂה לָּךְ
  choice: वैसा ही तेरे साथ किया जाएगा
  rationale: निफ़अल अपूर्ण क्रिया का कर्मवाच्य अर्थ सुरक्षित है और पहले उपवाक्य के साथ स्पष्ट समानता बनती है।
- source_word: גְּמֻלְךָ
  choice: तेरा प्रतिफल
  rationale: यह किसी व्यक्ति के कर्मों के उत्तर में उसी पर लौटने वाले न्यायोचित फल को व्यक्त करता है; ‘प्रतिफल’ सकारात्मक या नकारात्मक दोनों अर्थ ग्रहण कर सकता है, जैसा मूल शब्द भी कर सकता है।
- source_word: יָשׁוּב בְּרֹאשֶׁךָ
  choice: तेरे ही सिर पर लौट आएगा
  rationale: लौटने की क्रिया और उत्तरदायी व्यक्ति पर परिणाम पड़ने की इब्रानी मुहावरेदार छवि दोनों सुरक्षित हैं।
theological_decisions:
- issue: ‘याहवे के दिन’ का विस्तार और बल
  choice: यह आसन्न दिव्य न्याय की भविष्यद्वाणी है जो एदोम से आगे सब जातियों तक विस्तृत है।
  alternative: केवल एदोम पर होने वाला सीमित न्याय।
  rationale: ‘सब जातियों पर’ न्याय के दायरे को विस्तृत करता है, जबकि दूसरे अर्धांश का एकवचन संबोधन एदोम को सीधे संबोधित करता रहता है; अनुवाद दोनों पहलुओं को बनाए रखता है।
- issue: प्रतिफल के न्याय का स्वरूप
  choice: एदोम ने जैसा किया है, वैसा ही उसके साथ किया जाएगा; उसका किया हुआ उसी पर लौटेगा।
  alternative: यह केवल एक निरपेक्ष, स्वतः कार्य करने वाला कर्म-सिद्धांत है।
  rationale: ‘याहवे का दिन’ इस प्रतिफल को दिव्य न्याय के संदर्भ में रखता है। फिर भी अनुवाद कर्ता को जोड़कर उस बात को स्पष्ट नहीं करता जिसे इब्रानी कर्मवाच्य रूप में छोड़ता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यद्वाणी की गरिमा और संक्षिप्तता बनाए रखी गई है। एदोम को संबोधित करने वाले एकवचन पुल्लिंग रूपों के अनुरूप ‘तू/तेरे’ का प्रयोग किया गया है। दिव्य नाम יְהוָה को ‘याहवे’ लिखा गया है।
