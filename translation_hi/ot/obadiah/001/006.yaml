  verdict: revise
  source_fidelity: The draft correctly preserves ‘Esau’ as the Hebrew collective name and conveys the two passive/resultative actions. However, ‘देखो’ is not present in the Hebrew, and repeating ‘कैसे’ in the second clause can misleadingly make the second Hebrew clause independently exclamatory rather than the result stated under the opening exclamation.
  naturalness: ‘एसाव को कैसे छान मारा गया है!’ is vivid, idiomatic modern Hindi for the context of thorough searching/ransacking. ‘छिपे हुए खज़ाने’ is more natural and contextually precise than ‘छिपे हुए भंडार,’ which can denote storehouses rather than the concealed valuables themselves.
  terminology: ‘एसाव’ and the explanatory collective-reference footnote are appropriate. ‘खज़ाने’ adequately represents the contextually valuable hidden things without replacing the name with ‘एदोम.’
  issues:
  - severity: low
    issue: The main text adds ‘देखो.’
    rationale: The Hebrew begins with an exclamatory ‘कैसे,’ not an imperative or attention-getter. The addition is unnecessary and should be removed for optimal equivalence.
  - severity: low
    issue: ‘कैसे’ is repeated in the second clause.
    rationale: Only one אֵיךְ occurs, at the beginning of the verse. Letting the opening exclamation govern the paired lines is possible in Hindi without repeating it; omission avoids adding a second explicit exclamatory particle.
  - severity: low
    issue: ‘भंडार’ is less precise than the likely referent.
    rationale: מַצְפֻּנָיו denotes hidden/stored things and, in this context, concealed valuables. ‘खज़ाने’ communicates this naturally, whereas ‘भंडार’ may primarily suggest a storage place.
