lexical_decisions:
- source_word: אֵיךְ
  choice: कैसे
  rationale: यह प्रश्न नहीं, बल्कि विस्मय प्रकट करने वाला उद्गार है। हिंदी में ‘कैसे’ दोनों समानांतर उपवाक्यों में इस भाव को स्वाभाविक रूप से व्यक्त करता है; ‘देखो’ से उद्गार का बल स्पष्ट होता है।
- source_word: נֶחְפְּשׂוּ
  choice: छान मारा गया है
  rationale: निफ़अल पूर्ण रूप गहराई से खोजे जाने और लूट के लिए हर जगह टटोले जाने का भाव देता है। यह वर्तमान परिणाम सहित पूर्ण हुई कार्रवाई को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: עֵשָׂו
  choice: एसाव
  rationale: मूल पाठ के व्यक्तिगत नाम को बनाए रखा गया है; यहाँ वह सामूहिक रूप से उसके वंशजों अथवा एदोम के लिए प्रयुक्त है।
- source_word: נִבְעוּ
  choice: खोज निकाले गए हैं
  rationale: यह पिछले क्रियापद से भिन्न रहते हुए छिपी वस्तुओं के खोजकर बाहर निकाल लिए जाने का परिणाम व्यक्त करता है। क्रिया का अर्थ कुछ अनिश्चित है, इसलिए वैकल्पिक अनुवाद पाद-टिप्पणी में रखा गया है।
- source_word: מַצְפֻּנָיו
  choice: उसके छिपे हुए भंडार
  rationale: शब्द का मूल भाव छिपाकर रखी गई वस्तुओं का है; प्रसंग में गुप्त रूप से संचित धन या बहुमूल्य सामग्री अभिप्रेत है। ‘भंडार’ इस अर्थ को बिना अनावश्यक विशिष्टीकरण के व्यक्त करता है।
theological_decisions:
- issue: ‘एसाव’ का सामूहिक संदर्भ
  choice: मुख्य पाठ में ‘एसाव’ रखा गया और सामूहिक अर्थ पाद-टिप्पणी में स्पष्ट किया गया।
  alternative: मुख्य पाठ में ‘एदोम’ लिखना।
  rationale: मूल हिब्रू में עֵשָׂו है। नाम को एदोम से बदलना पाठ में निहित वंशगत और राष्ट्रीय संकेत को व्याख्यात्मक रूप से सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के अनुकूल रखी गई है। ‘छान मारा गया’ लूटेरों द्वारा गहन तलाशी का सजीव भाव देता है, जबकि ‘खोज निकाले गए’ समानांतर पंक्ति में छिपे भंडारों के उजागर होने पर बल देता है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
