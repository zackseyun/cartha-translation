source:
  edition: WLC
  text: בְּ/יוֹם֙ עֲמָֽדְ/ךָ֣ מִ/נֶּ֔גֶד בְּ/י֛וֹם שְׁב֥וֹת זָרִ֖ים חֵיל֑/וֹ וְ/נָכְרִ֞ים בָּ֣אוּ שער/ו וְ/עַל יְרוּשָׁלִַ֨ם֙ יַדּ֣וּ גוֹרָ֔ל גַּם אַתָּ֖ה כְּ/אַחַ֥ד מֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/011.yaml
  text: On the day when you stood aloof[a], on the day strangers carried off his wealth, and foreigners entered his gates and cast lots over Jerusalem[c][b], you too were like one of them.
translation:
  language: hi
  text: जिस दिन तू अलग खड़ा रहा[a], जिस दिन पराए लोग उसकी संपत्ति[b] लूटकर ले गए, विदेशी उसके फाटक में घुसे[c] और यरूशलेम पर चिट्ठियाँ डालीं—उस दिन तू भी उनमें से एक के समान था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू दूर खड़ा रहा।” इब्रानी पदबंध का शाब्दिक भाव सामने अथवा दूरी पर खड़े रहने का है।
    reason: lexical_alternative
  - marker: b
    text: “संपत्ति” के लिए इब्रानी शब्द का अर्थ “सामर्थ्य,” “सेना,” या “संसाधन” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में “उसके फाटक” एकवचन है; यह संभवतः मानवीकृत यरूशलेम या यहूदा को सूचित करता है।
    reason: textual_form
lexical_decisions:
- source_word: עֲמָדְךָ מִנֶּגֶד
  choice: तू अलग खड़ा रहा
  rationale: इस पदबंध का शाब्दिक भाव सामने या दूरी पर खड़े रहने का है; संदर्भ में यह सहायता न करते हुए अलग रहने का आरोप व्यक्त करता है, पर अनुवाद इसे सक्रिय आक्रमण के रूप में नहीं बढ़ाता।
- source_word: שְׁבוֹת
  choice: लूटकर ले गए
  rationale: क्रिया सामान्यतः बंदी बनाकर ले जाने या छीन ले जाने को दर्शाती है। यहाँ कर्म संपत्ति/संसाधन है, इसलिए आक्रमण के संदर्भ में 'लूटकर ले गए' स्वाभाविक है।
- source_word: זָרִים
  choice: पराए लोग
  rationale: यह समुदाय से बाहर के लोगों को सूचित करता है। 'पराए लोग' अगले समानांतर शब्द נָכְרִים के लिए प्रयुक्त 'विदेशी' से भेद भी बनाए रखता है।
- source_word: חֵילוֹ
  choice: उसकी संपत्ति
  rationale: חֵיל का अर्थ सामर्थ्य, सेना या धन-संपत्ति हो सकता है। लूट और नगर में प्रवेश के संदर्भ में 'संपत्ति' सर्वाधिक संभावित है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: נָכְרִים
  choice: विदेशी
  rationale: यह स्पष्ट रूप से बाहरी अथवा विदेशी लोगों को दर्शाता है और זָרִים के साथ मूल की शब्द-विविधता बनाए रखता है।
- source_word: בָּאוּ שַׁעֲרוֹ
  choice: उसके फाटक में घुसे
  rationale: मासोरेटिक रूप एकवचन और पुल्लिंग प्रत्यय सहित 'उसके फाटक' है। इसे बनाए रखने से यरूशलेम/यहूदा के मानवीकरण और मूल की व्याकरणिक अस्पष्टता सुरक्षित रहती है।
- source_word: יַדּוּ גוֹרָל
  choice: चिट्ठियाँ डालीं
  rationale: यह बाँटने या अधिकार तय करने के लिए चिट्ठी डालने का प्रचलित इब्रानी मुहावरा है।
- source_word: גַּם אַתָּה כְּאַחַד מֵהֶם
  choice: तू भी उनमें से एक के समान था
  rationale: यह एदोम को आक्रमणकारियों के नैतिक समकक्ष ठहराता है, किंतु तुलना को पूर्ण पहचान में नहीं बदलता।
theological_decisions:
- issue: עֲמָדְךָ מִנֶּגֶד में एदोम की मुद्रा का आशय
  choice: दूरी बनाए रखते हुए दोषपूर्ण निष्क्रियता, जिसके कारण वह आक्रमणकारियों के समान ठहरता है
  alternative: केवल भौतिक दूरी पर खड़े होने का तटस्थ वर्णन
  rationale: पद का निष्कर्ष, 'तू भी उनमें से एक के समान था,' इस खड़े रहने को नैतिक रूप से दोषपूर्ण बताता है। फिर भी 'अलग खड़ा रहा' मूल में निहित भौतिक दूरी और निष्क्रियता दोनों को खुला रखता है।
- issue: חֵילוֹ का संदर्भ
  choice: यरूशलेम/यहूदा की संपत्ति या संसाधन
  alternative: उसकी सेना अथवा सामर्थ्य
  rationale: विदेशी आक्रमण, फाटक में प्रवेश और यरूशलेम पर चिट्ठियाँ डालने के प्रसंग में लूटी गई संपत्ति अधिक संभावित है; शब्द की वास्तविक बहुअर्थकता पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी भविष्यद्वाणी-शैली रखी गई है। एकवचन संबोधन के लिए 'तू' मूल के प्रत्यक्ष और आरोपात्मक स्वर को बनाए रखता है। मुख्य पाठ में अर्थ-प्रवाह स्वाभाविक रखा गया है और वास्तविक शब्दार्थगत विकल्प पादटिप्पणियों में सुरक्षित हैं।
