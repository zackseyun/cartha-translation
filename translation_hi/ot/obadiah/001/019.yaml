  text: וְ/יָרְשׁ֨וּ הַ/נֶּ֜גֶב אֶת הַ֣ר עֵשָׂ֗ו וְ/הַ/שְּׁפֵלָה֙ אֶת פְּלִשְׁתִּ֔ים וְ/יָרְשׁוּ֙ אֶת שְׂדֵ֣ה אֶפְרַ֔יִם וְ/אֵ֖ת שְׂדֵ֣ה שֹׁמְר֑וֹן וּ/בִנְיָמִ֖ן אֶת הַ/גִּלְעָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/019.yaml
  text: Those of the Negev will possess the hill country of Esau[a], and those of the Shephelah the land of the Philistines; they will also possess the territory of Ephraim and the territory of Samaria[b], and Benjamin will possess Gilead.
translation:
  language: hi
  text: नेगेव के लोग एसाव के पहाड़ी प्रदेश पर अधिकार करेंगे, और शफेला के लोग पलिश्तियों के देश पर[a] अधिकार करेंगे। वे एप्रैम के क्षेत्र और सामरिया के क्षेत्र पर भी अधिकार करेंगे; और बिन्यामीन गिलाद पर अधिकार करेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में शाब्दिक रूप से ‘पलिश्तियों’ है; यहाँ भू-क्षेत्रीय अर्थ स्पष्ट करने के लिए ‘पलिश्तियों का देश’ का प्रयोग किया गया है।
    reason: lexical_alternative
  - marker: b
    text: ‘अधिकार करना’ का अनुवाद ‘विरासत में पाना’ भी हो सकता है; इब्रानी क्रिया भूमि को विरासत में पाने या अपने अधिकार में लेने, दोनों को व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרְשׁוּ
  choice: अधिकार करेंगे
  rationale: यह क्रिया भूमि को विरासत में पाने या उस पर अधिकार करने—दोनों अर्थ दे सकती है। इस भू-क्षेत्रीय संदर्भ में ‘अधिकार करेंगे’ स्वाभाविक है और साधन को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הַנֶּגֶב
  choice: नेगेव के लोग
  rationale: भौगोलिक नाम यहाँ उस क्षेत्र के निवासियों के लिए लक्षणा से प्रयुक्त है; ‘के लोग’ निहित कर्ता को स्पष्ट करता है।
- source_word: הַר עֵשָׂו
  choice: एसाव का पहाड़ी प्रदेश
  rationale: यहाँ הַר एक अकेले पर्वत के बजाय एसाव अर्थात एदोम के पर्वतीय भूभाग को सूचित करता है।
- source_word: הַשְּׁפֵלָה
  choice: शफेला के लोग
  rationale: यह यहूदा के निचले पहाड़ी भूभाग का स्थापित भौगोलिक नाम है और यहाँ उसके निवासियों के लिए प्रयुक्त है।
- source_word: פְּלִשְׁתִּים
  choice: पलिश्तियों का देश
  rationale: इब्रानी में जातिनाम ‘पलिश्ती’ है, पर अधिकार का विषय उनका भूभाग है; इसलिए क्षेत्रीय अर्थ स्पष्ट किया गया है।
- source_word: שְׂדֵה אֶפְרַיִם
  choice: एप्रैम का क्षेत्र
  rationale: שְׂדֵה का मूल अर्थ ‘मैदान/खेत’ है, किंतु इस भू-क्षेत्रीय प्रयोग में यह एप्रैम के इलाके को दर्शाता है।
- source_word: שְׂדֵה שֹׁמְרוֹן
  choice: सामरिया का क्षेत्र
  rationale: वाक्यांश किसी एक खेत के बजाय सामरिया से जुड़े भूभाग का संकेत करता है।
- source_word: בִנְיָמִן
  choice: बिन्यामीन
  rationale: गोत्र का नाम सामूहिक रूप से उसके लोगों के लिए है; हिंदी में नाम को यथावत रखना संक्षिप्त और स्वाभाविक है।
- source_word: הַגִּלְעָד
  choice: गिलाद
  rationale: यह क्षेत्र का व्यक्तिवाचक नाम है; इब्रानी निश्चित उपपद को हिंदी में अलग से व्यक्त करना आवश्यक नहीं।
