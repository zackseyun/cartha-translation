base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/010.yaml
  text: Because of the violence done to your brother Jacob[a], shame will cover you, and you will be cut off forever.
translation:
  language: hi
  text: तेरे भाई याकूब के विरुद्ध की गई हिंसा के कारण[a] लज्जा तुझे ढक लेगी, और तू सदा के लिए काट दिया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे भाई याकूब के विरुद्ध हिंसा के कारण।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵ/חֲמַס
  choice: के विरुद्ध की गई हिंसा के कारण
  rationale: חָמָס हिंसा या हिंसक अन्याय को दर्शाता है और prefixed מִן यहाँ कारण बताता है। यह चयन याकूब के प्रति हिंसा की दिशा और उसके कारण आने वाले न्याय—दोनों को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: אָחִי/ךָ
  choice: अपने भाई
  rationale: אָח का सीधा अर्थ ‘भाई’ है। यह एदोम और याकूब के बीच पारिवारिक संबंध तथा उससे उत्पन्न नैतिक उत्तरदायित्व को बनाए रखता है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: मूल पाठ में व्यक्तिगत नाम याकूब है। इसे बनाए रखने से कुलपितामह के नाम द्वारा उसके वंशजों का संकेत और एदोम के साथ भाईचारे का आरोप सुरक्षित रहता है।
- source_word: תְּכַסְּ/ךָ
  choice: तुझे ढक लेगी
  rationale: כסה का मूल अर्थ ‘ढकना’ है। ‘लज्जा तुझे ढक लेगी’ हिब्रू रूपक को सुरक्षित रखते हुए हिन्दी में सहज है।
- source_word: בוּשָׁה
  choice: लज्जा
  rationale: בּוּשָׁה सार्वजनिक अपमान और नैतिक शर्म दोनों व्यक्त करता है; ‘लज्जा’ इस भविष्यद्वाणी के गरिमापूर्ण काव्यात्मक स्तर के अनुकूल है।
- source_word: וְ/נִכְרַתָּ
  choice: और तू ... काट दिया जाएगा
  rationale: כרת का निफ़अल रूप ‘काट दिया जाना’ या ‘अलग कर दिया जाना’ दर्शाता है। शाब्दिक मुहावरे को बनाए रखने से विनाश अथवा निष्कासन की पूरी प्रासंगिक शक्ति खुली रहती है।
- source_word: לְ/עוֹלָם
  choice: सदा के लिए
  rationale: עוֹלָם यहाँ स्थायी और निरंतर अवधि व्यक्त करता है। ‘सदा के लिए’ आधुनिक हिन्दी में स्वाभाविक और न्याय-संदर्भ के अनुकूल है।
theological_decisions:
- issue: ‘याकूब’ का संदर्भ और भाईचारे की भाषा का बल
  choice: ‘अपने भाई याकूब’ को मुख्य पाठ में रखा गया है; याकूब अपने वंशजों, अर्थात इस्राएल के लोगों, का भी प्रतिनिधित्व करता है।
  alternative: तत्काल स्पष्टता के लिए ‘अपने भाई इस्राएल’ कहना।
  rationale: हिब्रू पाठ स्पष्ट रूप से ‘तेरा भाई याकूब’ कहता है। कुलपितामह का नाम बनाए रखने से एदोम के विरुद्ध पारिवारिक विश्वासघात का आरोप सुरक्षित रहता है और व्याख्यात्मक प्रतिस्थापन से बचा जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी शैली रखी गई है। एदोम को संबोधित एकवचन रूप के लिए ‘तू/तुझे’ प्रयुक्त है। ‘ढक लेगी’ और ‘काट दिया जाएगा’ मूल हिब्रू के सजीव रूपकों को सुरक्षित रखते हैं।
