reference: Obadiah 1:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בְ/הַ֥ר צִיּ֛וֹן תִּהְיֶ֥ה פְלֵיטָ֖ה וְ/הָ֣יָה קֹ֑דֶשׁ וְ/יָֽרְשׁוּ֙ בֵּ֣ית יַֽעֲקֹ֔ב אֵ֖ת מוֹרָֽשֵׁי/הֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/017.yaml
  text: But on Mount Zion there will be deliverance[a], and it will be holy[c][b], and the house of Jacob will possess their possessions.
translation:
  language: hi
  text: परंतु सिय्योन पर्वत पर छुटकारा होगा[a], और वह पवित्र होगा; और याकूब का घराना अपनी संपत्ति को अपने अधिकार में लेगा[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बच निकले हुए लोग होंगे”; इब्रानी संज्ञा छुटकारे या बच निकलने के साथ-साथ बच निकले हुए लोगों को भी सूचित कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपनी विरासत का अधिकारी होगा।”
    reason: lexical_alternative
  - marker: c
    text: यदि अंतिम इब्रानी शब्द को कर्तृवाचक अर्थ में लिया जाए, तो संभवतः, “याकूब का घराना उन्हें बेदखल करेगा जिन्होंने उसे बेदखल किया था।”
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְ/הַר צִיּוֹן
  choice: परंतु सिय्योन पर्वत पर
  rationale: आरंभिक संयोजक सामान्यतः ‘और’ हो सकता है, किंतु पिछले पद में एदोम के न्याय के विपरीत यहाँ सिय्योन की बहाली सामने आती है; इसलिए ‘परंतु’ प्रसंग का विरोध स्पष्ट करता है।
- source_word: תִּהְיֶה פְלֵיטָה
  choice: छुटकारा होगा
  rationale: פְלֵיטָה छुटकारे या बच निकलने की अवस्था और बच निकले हुए लोगों—दोनों का बोध करा सकता है। मुख्य पाठ में ‘छुटकारा’ प्रतिज्ञा को अनावश्यक रूप से केवल किसी एक अर्थ तक सीमित नहीं करता; व्यक्तिवाचक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וְ/הָיָה קֹדֶשׁ
  choice: और वह पवित्र होगा
  rationale: एकवचन पुल्लिंग क्रिया का स्वाभाविक संकेत सिय्योन पर्वत की ओर है। ‘पवित्र होगा’ आधुनिक हिंदी में सहज है और उसके परमेश्वर के लिए अलग किए जाने का भाव बनाए रखता है।
- source_word: וְ/יָרְשׁוּ
  choice: अधिकार करेगा
  rationale: ירשׁ के अर्थों में अधिकार करना, विरासत पाना और बेदखल करना सम्मिलित हैं। यहाँ ‘अधिकार करेगा’ अपनी खोई हुई वस्तु फिर पाने के पुनर्स्थापनात्मक भाव को स्वाभाविक हिंदी में व्यक्त करता है, जबकि अन्य संभावनाएँ पादटिप्पणियों में सुरक्षित हैं।
- source_word: בֵּית יַעֲקֹב
  choice: याकूब का घराना
  rationale: यह याकूब के वंशजों अर्थात इस्राएल के लिए प्रयुक्त सामूहिक वाचा-संबंधी पद है। ‘घराना’ भविष्यद्वाणी की गरिमा बनाए रखते हुए हिंदी में स्वाभाविक है।
- source_word: אֵת מוֹרָשֵׁי/הֶם
  choice: अपनी संपत्ति पर
  rationale: מוֹרָשָׁה सामान्यतः संपत्ति या विरासत को सूचित करता है, और प्रत्यय उस वस्तु को याकूब के घराने से संबंधित बताता है। ‘अपनी संपत्ति’ इस संबंध को स्पष्ट करता है; संभावित कर्तृवाचक अर्थ अलग पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: सिय्योन पर प्रतिज्ञात पुनर्स्थापना का स्वरूप
  choice: पद सिय्योन पर्वत पर वास्तविक छुटकारे, पवित्रता और याकूब के घराने द्वारा अपनी संपत्ति फिर पाने की बात करता है, पर यह तय नहीं करता कि פְלֵיטָה में मुख्य बल बचाव की घटना पर है या बचे हुए लोगों पर।
  alternative: इसे मुख्यतः सिय्योन पर उपस्थित बचे हुए लोगों की प्रतिज्ञा या मुख्यतः सिय्योन के पवित्र स्थान बनने की घोषणा माना जा सकता है।
  rationale: इब्रानी शब्दावली छुटकारे, बचे हुए लोगों और पवित्र पुनर्स्थापना के परस्पर जुड़े भावों को साथ रखती है। मुख्य पाठ और पादटिप्पणी इस तनाव को किसी एक धर्मवैज्ञानिक निष्कर्ष में सीमित नहीं करते।
- issue: याकूब के घराने के अधिकार का आशय
  choice: मुख्य पाठ מוֹרָשֵׁיהֶם को याकूब के घराने की अपनी संपत्ति मानता है।
  alternative: अंतिम शब्द को कर्तृवाचक अर्थ में लेकर उन लोगों के रूप में समझा जा सकता है जिन्होंने याकूब के घराने को बेदखल किया था।
  rationale: संज्ञात्मक अर्थ रूप-विज्ञान और पुनर्स्थापना के प्रसंग के अनुकूल है, किंतु कर्तृवाचक संभावना व्याख्या को पर्याप्त रूप से बदलती है और इसलिए पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है, किंतु भविष्यद्वाणी की गरिमा बनाए रखने के लिए ‘सिय्योन पर्वत’ और ‘याकूब का घराना’ जैसे पारंपरिक बाइबलीय पद रखे गए हैं। वाक्यरचना स्पष्ट और सार्वजनिक पाठ के अनुकूल है; अर्धविराम अंतिम पुनर्स्थापना-वाक्य को पहले दो सिय्योन-संबंधी कथनों से सहज रूप से अलग करता है।
