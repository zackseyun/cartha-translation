base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/002.yaml
  text: Yahweh[a], I have heard the report of you; I stand in awe. Yahweh, revive your work in the midst of the years; in the midst of the years make it known[e][d][c][b]; in wrath remember mercy.
translation:
  language: hi
  text: हे याहवे, मैंने आपके विषय में सुनी हुई बात सुनी है[a]; मैं भय से भर गया हूँ[b]। हे याहवे, वर्षों के मध्य अपने कार्य को जीवन दीजिए[c]; वर्षों के मध्य उसे प्रकट कीजिए। क्रोध में भी दया को स्मरण रखिए[d][e]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने आपकी कीर्ति सुनी है” अथवा “मैंने आपके विषय की खबर सुनी है।” इब्रानी अभिव्यक्ति याहवे के विषय में सुनी हुई बात को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैं भयभीत हो गया हूँ”; संदर्भ में श्रद्धामय भय या विस्मय भी निहित हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “उसे जीवित कीजिए”; इसका अर्थ “उसे जीवित बनाए रखिए” या “उसे फिर नया कीजिए” भी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: या, “उथल-पुथल में,” “कंपकंपी के बीच,” अथवा “प्रचंड रोष में।”
    reason: lexical_alternative
  - marker: e
    text: इब्रानी में भाव है, “दया करना स्मरण रखिए” अथवा “करुणा करने को याद रखिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के वाचा-संबंधी नाम को उपाधि से बदलने के बजाय उसका निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: שָׁמַעְתִּי שִׁמְעֲךָ
  choice: मैंने आपके विषय में सुना है
  rationale: इब्रानी पदबंध का आशय याहवे के विषय में सुनी हुई खबर या उनके कार्यों की चर्चा से है; यह रूप आधुनिक हिन्दी में स्वाभाविक रहते हुए उस व्यापक अर्थ को खुला रखता है।
- source_word: יָרֵאתִי
  choice: मैं भय से भर गया हूँ
  rationale: क्रिया भय, आतंक अथवा श्रद्धामय भय व्यक्त कर सकती है। मुख्य पाठ में ‘भय’ रखने से इस अर्थ-तनाव को केवल विस्मय या केवल आतंक तक सीमित नहीं किया गया।
- source_word: פָּעָלְךָ
  choice: अपने कार्य
  rationale: यह शब्द काम, कार्य या कृत्य को सूचित करता है। ‘कार्य’ परमेश्वर के सामर्थी ऐतिहासिक कामों को बिना अनावश्यक विशिष्टता के समेटता है।
- source_word: בְּקֶרֶב שָׁנִים
  choice: वर्षों के मध्य
  rationale: इब्रानी के काव्यात्मक स्थान-रूपक को सुरक्षित रखा गया है; ‘हमारे समय में’ अधिक व्याख्यात्मक होता।
- source_word: חַיֵּהוּ
  choice: उसे नया जीवन दीजिए
  rationale: हिफ़ील नहीं, पिएल आज्ञार्थक रूप का मूल बिंब ‘जीवित करना’ है। हिन्दी में ‘नया जीवन देना’ इस जीवन-दायी बिंब को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תּוֹדִיעַ
  choice: उसे प्रकट कीजिए
  rationale: हिफ़ील रूप का अर्थ ‘ज्ञात कराना’ है। हिन्दी में ‘प्रकट कीजिए’ स्वाभाविक है, और ‘उसे’ का संकेत पिछले पद के परमेश्वर के कार्य की ओर है।
- source_word: בְּרֹגֶז
  choice: क्रोध के समय
  rationale: רֹגֶז उत्तेजना, हलचल, कंपकंपी या प्रचंड रोष बता सकता है। दया की याचना के संदर्भ में ‘क्रोध’ संभावित प्रमुख अर्थ है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: רַחֵם תִּזְכּוֹר
  choice: दया करना स्मरण रखिए
  rationale: इब्रानी में ‘दया/करुणा करना’ क्रियात्मक है और ‘स्मरण रखना’ उसके साथ आता है। हिन्दी रूप उस क्रियात्मक बल को ‘दया को स्मरण रखिए’ की अपेक्षा अधिक स्पष्ट रखता है।
theological_decisions:
- issue: नबी की प्रतिक्रिया में भय और श्रद्धा का संबंध
  choice: मुख्य पाठ में ‘भय’ रखा गया
  alternative: ‘श्रद्धामय विस्मय से भर गया हूँ’ या ‘मैं डर गया हूँ’
  rationale: प्रार्थना का संदर्भ श्रद्धा का संकेत देता है, पर ירא का वास्तविक भय भी मिटाया नहीं जाना चाहिए; इसलिए मुख्य पाठ दोनों दिशाओं के लिए खुला है।
- issue: परमेश्वर के कार्य को जीवन देने की याचना
  choice: परमेश्वर से अपने कार्य को नया जीवन देने की प्रार्थना
  alternative: कार्य को जीवित बनाए रखना या उसका नवीकरण करना
  rationale: पुरुषवाचक एकवचन प्रत्यय निकटवर्ती ‘आपके कार्य’ की ओर संकेत करता है। अनुवाद यह तय नहीं करता कि कौन-सा विशिष्ट ऐतिहासिक कार्य अभिप्रेत है।
- issue: क्रोध और दया का तनाव
  choice: क्रोध के बीच दया करने की प्रार्थना
  alternative: उथल-पुथल या प्रचंड हलचल में करुणा को स्मरण करना
  rationale: पाठ न्यायकारी क्रोध और करुणा को साथ रखता है; किसी एक को नरम करके दूसरे में विलीन नहीं किया गया।
translation_notes:
  register: आधुनिक, प्रार्थनामय और गरिमापूर्ण हिन्दी अपनाई गई है। ‘वर्षों के मध्य’ जैसे काव्यात्मक पदबंध को मूल की पुनरावृत्ति सहित रखा गया है। आदरसूचक ‘आप’ और विनम्र आज्ञार्थक रूप हिन्दी की प्रार्थना-शैली के अनुरूप हैं; भाषा किसी संप्रदाय-विशेष की शब्दावली पर निर्भर नहीं है।
