base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/003.yaml
  text: God comes from Teman[a], and the Holy One from Mount Paran. Selah. His splendor covers the heavens[d][c][b], and his praise fills the earth.
translation:
  language: hi
  text: परमेश्वर तेमान से आते हैं[a], और पवित्र परमेश्वर पारान पर्वत से। सेला[b]। उनका वैभव आकाश को ढाँप देता है[c], और उनकी स्तुति पृथ्वी को भर देती है[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तेमान’ का अर्थ अधिक सामान्य रूप से ‘दक्षिण’ भी समझा जा सकता है; पर यहाँ ‘पारान पर्वत’ के समानांतर होने के कारण यह संभवतः स्थान का नाम है।
    reason: lexical_alternative
  - marker: b
    text: ‘सेला’ संभवतः उपासना या संगीत से जुड़ा शब्द है, पर इसका ठीक अर्थ अनिश्चित है; इसलिए इसे अनूदित नहीं किया गया है।
    reason: cultural_note
  - marker: c
    text: ‘वैभव’ के स्थान पर ‘प्रताप’ या ‘महिमा’ भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
  - marker: d
    text: या, ‘उनकी स्तुति ने पृथ्वी भर दी है।’ इस काव्यात्मक प्रसंग में हिब्रू क्रियारूप को भूत या भविष्य के अर्थ में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלוֹהַ
  choice: परमेश्वर
  rationale: एकवचन संज्ञा यहाँ इस्राएल के परमेश्वर को सीधे सूचित करती है। आधुनिक हिन्दी में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है तथा मूल से अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: מִתֵּימָן
  choice: तेमान से
  rationale: तेमान दक्षिण दिशा या दक्षिणी क्षेत्र का संकेत भी दे सकता है, पर समानांतर पद ‘पारान पर्वत’ के कारण यहाँ स्थान-नाम अधिक संभावित है।
- source_word: יָבוֹא
  choice: आते हैं
  rationale: काव्यात्मक ईश्वर-प्रकटन में अपूर्ण क्रिया को सजीव वर्तमान के रूप में रखा गया है; इससे केवल भूत या भविष्य का अर्थ आरोपित नहीं होता।
- source_word: וְקָדוֹשׁ
  choice: और पवित्र परमेश्वर
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त दैवी उपाधि है और समानांतर पंक्ति में उसी परमेश्वर को सूचित करता है। ‘पवित्र परमेश्वर’ सामान्य हिन्दी पाठक के लिए स्पष्ट है।
- source_word: מֵהַר פָּארָן
  choice: पारान पर्वत से
  rationale: यह भौगोलिक अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस उपासना-संबंधी या संगीत-संबंधी पद का ठीक अर्थ अनिश्चित है, इसलिए अर्थ थोपने के बजाय लिप्यंतरण रखा गया है।
- source_word: כִּסָּה
  choice: ढाँप लेता है
  rationale: क्रिया व्यापक रूप से आच्छादित करने का चित्र देती है। सजीव वर्तमान पूर्ववर्ती ‘आते हैं’ के अनुरूप है।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: हिब्रू बहुवचन का हिन्दी में स्वाभाविक काव्यात्मक समतुल्य ‘आकाश’ है; ‘आकाशों’ यहाँ असहज होता।
- source_word: הוֹדוֹ
  choice: उनका वैभव
  rationale: הוֹד महिमा, प्रताप या दीप्तिमान वैभव व्यक्त कर सकता है। ‘वैभव’ आकाश को ढाँपने वाले दृश्यात्मक और राजसी भाव को सुरक्षित रखता है।
- source_word: וּתְהִלָּתוֹ
  choice: उनकी स्तुति
  rationale: संज्ञा का सामान्य अर्थ ‘स्तुति’ है। यह उनकी की जाने वाली स्तुति अथवा उनके स्तुति-योग्य यश का संकेत दे सकती है; हिन्दी पद इस तनाव को पूर्णतः नहीं मिटाता।
- source_word: מָלְאָה הָאָרֶץ
  choice: पृथ्वी भर जाती है
  rationale: स्त्रीलिंग क्रिया ‘स्तुति’ से मेल खाती है। ‘पृथ्वी’ का विश्वव्यापी विस्तार पूर्व पंक्ति के ‘आकाश’ के अनुरूप है।
theological_decisions:
- issue: ईश्वर-प्रकटन का कालगत चित्रण
  choice: 'क्रियाओं को सजीव वर्तमान में रखा गया: ‘आते हैं,’ ‘ढाँप लेता है,’ ‘भर जाती है।’'
  alternative: भूतकाल—‘आए,’ ‘ढाँप लिया,’ ‘भर गई’; अथवा भविष्यकाल—‘आएँगे,’ ‘ढाँप लेंगे,’ ‘भर जाएगी।’
  rationale: यह काव्य अतीत के ईश्वरीय प्रकटन को स्मरण करते हुए उसे उपासना में वर्तमान कर देता है। वर्तमान काल उस सजीवता को रखता है और केवल अतीत या केवल भविष्य का निर्णय नहीं थोपता।
- issue: ‘पवित्र’ का अभिप्रेत व्यक्ति
  choice: इसे पहली पंक्ति के ‘परमेश्वर’ के समान अभिप्राय वाली दैवी उपाधि के रूप में ‘पवित्र परमेश्वर’ किया गया।
  alternative: किसी अलग पवित्र व्यक्ति के रूप में पढ़ना।
  rationale: समानांतर काव्य-पंक्तियाँ दृढ़ता से एक ही दैवी कर्ता की ओर संकेत करती हैं; अलग व्यक्ति मानना मूल में अनावश्यक भेद जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुबोध शैली रखी गई है। परमेश्वर के लिए आदरसूचक बहुवचन (‘आते हैं’, ‘उनका’) तथा निकटवर्ती एकवचन विषय ‘वैभव’ और ‘स्तुति’ के अनुसार एकवचन क्रियाएँ रखी गई हैं।
