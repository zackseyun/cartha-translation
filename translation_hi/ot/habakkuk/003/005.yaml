  text: Before him goes pestilence[b][a], and plague comes out at his feet.
translation:
  language: hi
  text: 'उसके आगे महामारी चलती है,

    और दाहक रोग[a] उसके चरणों के पास[b] निकलता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दाहक महामारी,” “ज्वर”; संभवतः “रेशेफ़,” अर्थात काव्यात्मक बिंब में संकेतित महामारी से संबद्ध किसी देवता का नाम।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “उसके चरणों पर/पास”; इस पदबंध का भाव “उसके पीछे” या “उसके जुलूस में” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו
  choice: उसके आगे
  rationale: यह पदबंध किसी के सामने या आगे होने का स्थानिक भाव देता है और परमेश्वर के आगे चलने वाली विनाशकारी शक्ति का काव्यात्मक चित्र बनाए रखता है।
- source_word: יֵלֶךְ
  choice: चलती है
  rationale: क्रिया यहाँ सजीव काव्यात्मक वर्तमान का भाव देती है। ‘चलती है’ दिव्य कूच के मानवीकृत चित्र को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דָּבֶר
  choice: महामारी
  rationale: यह शब्द प्रायः व्यापक रूप से फैलने वाले घातक रोग या मरी को दर्शाता है। ‘महामारी’ आधुनिक पाठक के लिए स्पष्ट है और न्याय-संबंधी संदर्भ के अनुकूल है।
- source_word: וְיֵצֵא
  choice: और ... निकलता है
  rationale: मूल क्रिया बाहर जाने या निकलने का अर्थ देती है। यह अनुवाद उसके पाँवों से विनाशकारी शक्ति के आगे बढ़ने का स्थानिक चित्र सुरक्षित रखता है।
- source_word: רֶשֶׁף
  choice: दाहक रोग
  rationale: इस शब्द में जलन, ज्वर, दाहक महामारी या विनाशकारी ज्वाला जैसे अर्थ संभव हैं। ‘दाहक रोग’ पहले खंड की ‘महामारी’ से अनावश्यक पुनरावृत्ति किए बिना रोग और तपन—दोनों भावों को बनाए रखता है।
- source_word: לְרַגְלָיו
  choice: उसके पाँवों के पास से
  rationale: यह मूल के ‘उसके पाँवों पर/पास’ वाले ठोस चित्र को सुरक्षित रखता है; साथ ही सन्दर्भ में उसके पीछे या उसके जुलूस में चलने का संभावित भाव टिप्पणी में दिया गया है।
theological_decisions:
- issue: רֶשֶׁף में संभावित पौराणिक संकेत
  choice: मुख्य पाठ में सामान्य संज्ञा ‘दाहक रोग’
  alternative: व्यक्तिवाचक नाम ‘रेशेफ़’
  rationale: काव्य में प्राचीन निकट-पूर्वी बिंब की प्रतिध्वनि संभव है, पर मसोराई पाठ और דָּבֶר के साथ समानांतरता विनाशकारी रोग या तपन के सामान्य अर्थ का समर्थन करती है। व्यक्तिवाचक नाम को मुख्य पाठ में रखने से अनिश्चित पौराणिक पहचान आवश्यकता से अधिक निश्चित हो जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। समानांतर पंक्तियों तथा दिव्य कूच के सजीव चित्र को सुरक्षित रखते हुए दुर्लभ शब्द רֶשֶׁף की वास्तविक अर्थगत अनिश्चितता पादटिप्पणी में दी गई है।
