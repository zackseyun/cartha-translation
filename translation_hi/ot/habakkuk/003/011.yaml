base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/011.yaml
  text: Sun and moon stood in their lofty place[a]; at the light of your arrows they went[c][b], at the brightness of the flash of your spear.
translation:
  language: hi
  text: 'सूर्य और चन्द्रमा अपने ऊँचे स्थान में ठहर गए[a];


    आपके तीरों के प्रकाश में वे चले[b],


    आपके भाले की कौंध के तेज में[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने निवास में”; इब्रानी शब्द का अर्थ ऊँचा निवास या उन्नत स्थान हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी कथन संक्षिप्त है। “वे चले” सूर्य और चन्द्रमा की ओर संकेत कर सकता है; इसे परमेश्वर के तीरों और भाले की गति से जोड़कर भी समझा गया है।
    reason: alternative_reading
  - marker: c
    text: या, “आपके भाले की बिजली में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁמֶשׁ יָרֵחַ
  choice: सूर्य और चन्द्रमा
  rationale: दोनों आकाशीय ज्योतियों को अलग-अलग संज्ञाओं के रूप में रखते हुए हिन्दी में स्वाभाविक संयोजन किया गया है।
- source_word: עָמַד
  choice: ठहरे रहे
  rationale: क्रिया का अर्थ खड़े रहने, स्थिर रहने या रुक जाने का हो सकता है; यहाँ ‘ठहरे रहे’ काव्यात्मक प्रसंग में स्थिरता को व्यक्त करता है, पर उसके कारण को नहीं समझाता।
- source_word: זְבֻלָה
  choice: अपने ऊँचे स्थान में
  rationale: זְבוּל ऊँचे निवास या उन्नत स्थान का बोध कराता है। यह रूप ऊँचाई का स्थानिक भाव बनाए रखता है और किसी विशिष्ट प्राचीन ब्रह्माण्ड-कल्पना को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לְאוֹר חִצֶּיךָ
  choice: आपके तीरों के प्रकाश में
  rationale: मूल का प्रकाश-संबंधी काव्यात्मक प्रयोग और दिव्य योद्धा की तीर-वाली छवि दोनों सुरक्षित रखे गए हैं।
- source_word: יְהַלֵּכוּ
  choice: वे चले
  rationale: मूल की बहुवचन गति-सूचक क्रिया का सरल अनुवाद है। ‘वे’ व्याकरणतः सूर्य और चन्द्रमा की ओर सहज संकेत करता है, फिर भी पंक्ति की संक्षिप्तता के कारण हथियारों की गति से जुड़ी वैकल्पिक समझ पादटिप्पणी में रखी गई है।
- source_word: לְנֹגַהּ בְּרַק חֲנִיתֶךָ
  choice: आपके भाले की कौंध की चमक में
  rationale: נֹגַהּ की चमक और בְּרַק की तीखी कौंध—दोनों प्रकाश-बिम्बों को बनाए रखते हुए חֲנִית को आधुनिक, स्पष्ट हिन्दी ‘भाला’ से व्यक्त किया गया है।
theological_decisions:
- issue: יְהַלֵּכוּ (‘वे चले’) का कर्ता
  choice: मुख्य पाठ में बहुवचन सर्वनाम रखा गया है, जिसका निकटतम स्पष्ट संदर्भ सूर्य और चन्द्रमा हैं।
  alternative: इसे परमेश्वर के तीरों और भाले की उड़ती हुई गति के रूप में भी समझा जा सकता है।
  rationale: इब्रानी कविता अत्यन्त संक्षिप्त है। मुख्य व्याकरणिक संबंध को पाठ में रखते हुए वैकल्पिक काव्यात्मक संबंध को पादटिप्पणी में स्वीकार किया गया है, ताकि वास्तविक अस्पष्टता दब न जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक रूप अपनाया गया है। ‘आपके’ से ईश्वर के लिए सम्मानसूचक संबोधन रखा गया है। पंक्ति-विभाजन मूल के समानांतर काव्य-विन्यास को उभारता है।
