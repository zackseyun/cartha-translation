  text: יָצָ֨אתָ֙ לְ/יֵ֣שַׁע עַמֶּ֔/ךָ לְ/יֵ֖שַׁע אֶת מְשִׁיחֶ֑/ךָ מָחַ֤צְתָּ רֹּאשׁ֙ מִ/בֵּ֣ית רָשָׁ֔ע עָר֛וֹת יְס֥וֹד עַד צַוָּ֖אר סֶֽלָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/013.yaml
  text: You went out for the salvation of your people[a], for the salvation of your anointed one; you crushed the head of the house of the wicked, laying bare the foundation up to the neck[c][b]. Selah
translation:
  language: hi
  text: तू अपनी प्रजा के उद्धार के लिए निकला[a], अपने अभिषिक्त के उद्धार के लिए; तूने दुष्ट के घर के सिर को कुचल दिया, नींव को गर्दन तक उघाड़ दिया[b]। सेला
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी प्रजा को बचाने के लिए।” मूल इब्रानी में “उद्धार के लिए” वाक्यांश समानांतर रूप से दो बार आया है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी बिंब कठिन है। इसका अनुवाद “नींव को गर्दन तक उघाड़ दिया” भी हो सकता है; सम्भव है कि यहाँ घर ढहाने और शरीर को अनावृत करने के चित्र आपस में मिले हों। “अपने अभिषिक्त” का संकेत दाऊदी राजा, प्रतिनिधि रूप में प्रजा, अथवा प्रतिरूपात्मक रूप से मसीह की ओर हो सकता है; इब्रानी किसी एक अर्थ को अनिवार्य नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: יָצָאתָ
  choice: तू ... निकला
  rationale: यह יצא का काल पूर्ण, द्वितीय पुरुष एकवचन रूप है और परमेश्वर के निर्णायक रूप से कार्य करने हेतु निकलने को व्यक्त करता है। 'निकला' सीधा और स्वाभाविक हिन्दी रूप है; 'चढ़ आया' युद्ध-संदर्भ को आवश्यकता से अधिक स्पष्ट कर देता।
- source_word: לְיֵשַׁע
  choice: उद्धार के लिए
  rationale: יֵשַׁע उद्धार या छुटकारे को सूचित करता है। 'उद्धार' इसके धार्मिक भार को बनाए रखता है और पद में दोहराए गए समानांतर वाक्यांश को सुरक्षित रखता है।
- source_word: עַמֶּךָ
  choice: अपनी प्रजा
  rationale: द्वितीय पुरुष एकवचन प्रत्यय सहित इस संज्ञा का अर्थ 'तेरी प्रजा' है। हिन्दी में एक ही कर्ता के संदर्भ में 'अपनी प्रजा' स्वाभाविक है और वाचा-सम्बन्धी सामूहिक अर्थ बनाए रखता है।
- source_word: לְיֵשַׁע אֶת מְשִׁיחֶךָ
  choice: अपने अभिषिक्त जन के उद्धार के लिए
  rationale: दूसरा לְיֵשַׁע पहले वाक्यांश के समानांतर है, इसलिए उसकी पुनरावृत्ति रखी गई है। אֶת कर्म को चिह्नित करता है और מְשִׁיחֶךָ का वर्णनात्मक अनुवाद 'अपने अभिषिक्त जन' किया गया है।
- source_word: מְשִׁיחֶךָ
  choice: अपने अभिषिक्त जन
  rationale: शब्द का शाब्दिक अर्थ 'तेरा अभिषिक्त' है। 'अभिषिक्त जन' हिन्दी में व्यक्ति-संज्ञा को स्पष्ट करता है, पर इसे निश्चित पारिभाषिक उपाधि 'मसीह' बनाकर संदर्भ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: מָחַצְתָּ
  choice: कुचल दिया
  rationale: מחץ युद्धात्मक प्रसंग में कुचलने या चूर करने का तीव्र अर्थ रखता है। 'सिर' के साथ 'कुचल दिया' मूल बिंब को प्रभावी रूप से बनाए रखता है।
- source_word: רֹאשׁ מִבֵּית רָשָׁע
  choice: दुष्ट के घराने के सिर
  rationale: यह रूप मूल शब्दक्रम के निकट रहते हुए 'सिर' को शाब्दिक बनाए रखता है। 'घराना' בית के भवन और वंश/परिवार दोनों सम्भावित आयामों को हिन्दी में कुछ हद तक खुला रखता है; רָשָׁע को एकवचन 'दुष्ट' रखा गया है।
- source_word: עָרוֹת יְסוֹד עַד צַוָּאר
  choice: नींव से लेकर गर्दन तक उसे उघाड़ दिया
  rationale: ערה का अर्थ उघाड़ना या अनावृत करना है। कठिन मिश्रित बिंब में יְסוֹד और צַוָּאר दोनों को शाब्दिक रूप से रखा गया है; हिन्दी वाक्यरचना के लिए 'से लेकर ... तक' अपनाया गया है, जबकि अस्पष्टता पर टिप्पणी दी गई है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस संगीतिक या उपासना-सम्बन्धी पद का सटीक अर्थ अनिश्चित है, इसलिए अर्थ आरोपित करने के बजाय पारम्परिक लिप्यंतरण रखा गया है।
theological_decisions:
- issue: '''अपने अभिषिक्त जन'' का संदर्भ'
  choice: मुख्य पाठ में वर्णनात्मक रूप 'अपने अभिषिक्त जन' रखा गया है और संदर्भ को किसी एक पहचान तक सीमित नहीं किया गया।
  alternative: इसे दाऊदी राजा, सामूहिक रूप में प्रजा, या प्रतिरूपात्मक रूप से मसीह के लिए निश्चित किया जा सकता है।
  rationale: מְשִׁיחֶךָ में राजकीय और मसीही अनुगूँज है, किन्तु तत्काल प्रसंग किसी एक व्याख्या को अनिवार्य नहीं करता। अनुवाद इस धार्मिक तनाव को सुरक्षित रखता है।
- issue: दुष्ट के घराने और सिर का बिंब
  choice: '''दुष्ट के घराने के सिर'' के रूप में संरचना रखी गई।'
  alternative: '''दुष्ट के घर का ऊपरी भाग'' या ''दुष्ट सरदार'' जैसी व्याख्यात्मक प्रस्तुतियाँ सम्भव हैं।'
  rationale: मूल में भवन और शरीर के बिंब परस्पर मिलते दिखाई देते हैं। किसी एक रूपक को चुन लेना मूल की कठिनता और बहुअर्थता को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। प्रार्थना के प्रत्यक्ष सम्बोधन के अनुरूप परमेश्वर के लिए एकवचन निकट सम्बोधन 'तू' प्रयुक्त है। मूल की पुनरावृत्ति, हिंसक काव्य-बिंब और व्याख्यात्मक अनिश्चितता को यथासम्भव सुरक्षित रखा गया है।
