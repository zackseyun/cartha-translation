id: HAB.3.19
reference: Habakkuk 3:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְהוִ֤הּ אֲדֹנָ/י֙ חֵילִ֔/י וַ/יָּ֤שֶׂם רַגְלַ/י֙ כָּֽ/אַיָּל֔וֹת וְ/עַ֥ל בָּמוֹתַ֖/י יַדְרִכֵ֑/נִי לַ/מְנַצֵּ֖חַ בִּ/נְגִינוֹתָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/019.yaml
  text: 'The LORD, my Lord, is my strength; he makes my feet like the deer’s, and he causes me to tread on my heights.


    For the choir director: with my stringed instruments.'
translation:
  language: hi
  text: 'यहोवा, मेरे प्रभु, मेरा बल है;

    वह मेरे पैरों को हिरनियों के पैरों के समान बनाता है,

    और मुझे मेरे ऊँचे स्थानों पर चलाता है।


    संगीत-निर्देशक के लिए: मेरे तारवाले वाद्यों के साथ।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָהּ אֲדֹנָי
  choice: यहोवा, मेरे प्रभु
  rationale: 'दोनों ईश्वरीय संबोधनों को अलग-अलग बनाए रखा गया है: व्यक्तिगत नाम को ‘यहोवा’ और אֲדֹנָי को ‘मेरे प्रभु’ किया गया है।'
- source_word: חֵילִי
  choice: मेरा बल
  rationale: यहाँ חַיִל सामर्थ्य या शक्ति का बोध देता है; काव्यात्मक और स्वाभाविक हिन्दी में ‘बल’ उपयुक्त है।
- source_word: כָּאַיָּלוֹת
  choice: हिरनियों के पैरों के समान
  rationale: मूल में स्त्रीलिंग बहुवचन ‘हिरनियाँ’ है; ‘पैरों’ की पुनरावृत्ति हिन्दी में तुलना को स्पष्ट और सहज बनाती है।
- source_word: בָּמוֹתַי
  choice: मेरे ऊँचे स्थानों
  rationale: प्रत्यय ‘मेरे’ को सुरक्षित रखा गया है और בָּמוֹת का स्थान-संबंधी अर्थ बिना रूपक की व्याख्या किए दिया गया है।
- source_word: יַדְרִכֵנִי
  choice: मुझे ... चलाता है
  rationale: 'हिफ़ील रूप का प्रेरणार्थक भाव सुरक्षित है: वह वक्ता को उन स्थानों पर चलने योग्य बनाता या चलाता है।'
- source_word: לַמְנַצֵּחַ בִּנְגִינוֹתָי
  choice: 'संगीत-निर्देशक के लिए: मेरे तारवाले वाद्यों के साथ'
  rationale: समापन संगीत-सूचना को मुख्य कविता से अलग रखा गया है; प्रथम पुरुष प्रत्यय ‘मेरे’ और तारवाद्य-संबंधी अर्थ दोनों सुरक्षित हैं।
theological_decisions:
- issue: יְהוָהּ और אֲדֹנָי का संयुक्त प्रयोग
  choice: यहोवा, मेरे प्रभु
  alternative: प्रभु यहोवा
  rationale: मूल के क्रम और दो अलग पदों को बनाए रखने से उनका विशिष्ट संबोधन सुरक्षित रहता है; उन्हें एक संयुक्त उपाधि में नहीं मिलाया गया।
- issue: ‘मेरे ऊँचे स्थानों’ का आशय
  choice: रूपक को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: मुझे विजय की ऊँचाइयों पर पहुँचाता है
  rationale: पद विजय, सुरक्षा, स्वतंत्र गति या पर्वतीय भूभाग की छवियाँ जगा सकता है; किसी एक धर्मवैचारिक अर्थ को थोपने से मूल की व्यापकता घटती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। समानांतर पंक्तियाँ और अंतिम संगीत-सूचना अलग अनुच्छेद में दी गई हैं। किसी फुटनोट की आवश्यकता नहीं मानी गई।
