base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/009.yaml
  text: Your bow is laid bare[a]; the rods are sworn by command. Selah[b]. You split the earth with rivers.
translation:
  language: hi
  text: तू अपना धनुष पूरी तरह उघाड़ देता है; वचन के अनुसार छड़ियाँ[b] शपथबद्ध की गई हैं।[a] सेला। तू नदियों से धरती को चीर देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस कठिन इब्रानी वाक्यांश का अनुवाद निश्चित नहीं है। इसका अर्थ यह भी हो सकता है, “गोत्रों के लिए शपथें कही गईं,” या “वचन के अनुसार शपथें [हुईं]”; मूल में शपथों, छड़ियों/गोत्रों और वचन के विचार अत्यंत संक्षिप्त रूप में जुड़े हैं।
    reason: alternative_reading
  - marker: b
    text: “छड़ियाँ” के लिए इब्रानी शब्द का अर्थ “गोत्र” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְיָה תֵעוֹר
  choice: पूरी तरह खोल दिया गया है
  rationale: दोहराए गए अनावरण के भाव को स्वाभाविक हिन्दी में तीव्रता सहित व्यक्त करता है; प्रसंग में धनुष को खोलकर युद्ध के लिए तैयार करने का चित्र है।
- source_word: קַשְׁתֶּךָ
  choice: तेरा धनुष
  rationale: ईश्वर को किए गए एकवचन सम्बोधन और युद्ध-संबंधी बिंब को सीधे बनाए रखता है।
- source_word: שְׁבֻעוֹת
  choice: शपथ खाई गई है
  rationale: मूल शब्द के सामान्य अर्थ ‘शपथों’ को क्रियात्मक हिन्दी में व्यक्त करता है, पर कठिन और संक्षिप्त वाक्यांश की व्याख्या को अंतिम रूप नहीं देता।
- source_word: מַטּוֹת
  choice: छड़ियों
  rationale: ‘छड़ियाँ/लाठियाँ’ वाला अर्थ युद्ध-बिंब के अनुकूल है; ‘गोत्रों’ की वास्तविक lexical सम्भावना पाद-टिप्पणी में सुरक्षित है।
- source_word: אֹמֶר
  choice: तेरे वचन के अनुसार
  rationale: मूल ‘वचन/उक्ति’ को बनाए रखता है और ईश्वर को संबोधन के प्रसंग में उसका सम्बन्ध स्पष्ट करता है, बिना उसे अनिवार्यतः ‘आज्ञा’ तक सीमित किए।
- source_word: סֶלָה
  choice: सेला
  rationale: इसका सटीक अर्थ अनिश्चित है, इसलिए पारंपरिक लिप्यंतरण उचित है।
- source_word: נְהָרוֹת
  choice: नदियों से
  rationale: बहुवचन ‘नदियाँ’ और सम्भावित करणार्थक सम्बन्ध दोनों को संक्षेप में व्यक्त करता है।
- source_word: תְּבַקַּע
  choice: तूने ... चीर दिया
  rationale: पिएल क्रिया की प्रबलता और ईश्वर को संबोधित काव्यात्मक भूतकालीन वर्णन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָרֶץ
  choice: धरती
  rationale: इस विश्वव्यापी ईश-प्रकटन के प्रसंग में ‘भूमि’ की अपेक्षा ‘धरती’ अधिक उपयुक्त है।
theological_decisions:
- issue: שְׁבֻעוֹת מַטּוֹת אֹמֶר का अत्यंत कठिन अर्थ
  choice: तेरे वचन के अनुसार छड़ियों की शपथ खाई गई है
  alternative: ‘गोत्रों के लिए शपथें कही गईं’ अथवा इसी प्रकार का पाठ
  rationale: मुख्य पाठ ‘शपथ’, ‘छड़ियाँ’ और ‘वचन’ के मूल अर्थों को यथासम्भव सुरक्षित रखता है। वाक्यांश अत्यंत संक्षिप्त और विवादित है, इसलिए वैकल्पिक अर्थ को पाद-टिप्पणी में स्पष्ट रखा गया है और किसी विशिष्ट धर्मवैज्ञानिक निष्कर्ष को आरोपित नहीं किया गया।
