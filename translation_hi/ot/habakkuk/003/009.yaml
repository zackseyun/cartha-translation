  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक रूप। ईश्वर के लिए निकट, एकवचन सम्बोधन ‘तू/तेरा’ रखा गया है, जो इब्रानी के 2ms रूप और स्तुति-काव्य की सीधी वाणी के अनुरूप है। कठिन मध्य-पंक्ति को जानबूझकर पूर्णतः स्पष्ट नहीं बनाया गया, ताकि मूल की वास्तविक अस्पष्टता बनी रहे।
