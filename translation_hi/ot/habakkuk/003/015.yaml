base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/015.yaml
  text: You marched through the sea with your horses[a], through the heap of mighty waters.
translation:
  language: hi
  text: आप अपने घोड़ों के साथ समुद्र में से होकर चले, बहुत-से जल के ढेर के बीच से।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דָּרַכְתָּ
  choice: आप ... होकर चले
  rationale: क्रिया का मूल भाव पाँव रखते हुए आगे बढ़ना या रौंदते हुए चलना है। यहाँ ‘होकर चले’ ईश्वरीय अग्रगमन को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि समुद्र से होकर जाने का बिंब बनाए रखता है।
- source_word: בַיָּם
  choice: समुद्र में से होकर
  rationale: पूर्वसर्ग ב का मूल अर्थ ‘में’ है, पर गति-सूचक क्रिया के साथ यह किसी स्थान के बीच से होकर जाने का भाव दे सकता है।
- source_word: סוּסֶיךָ
  choice: अपने घोड़ों के साथ
  rationale: शाब्दिक अर्थ ‘आपके घोड़े’ है। हिन्दी में क्रिया के साथ संबंध स्पष्ट और स्वाभाविक करने के लिए ‘अपने घोड़ों के साथ’ रखा गया है।
- source_word: חֹמֶר
  choice: ढेर
  rationale: यहाँ यह दुर्लभ और कठिन शब्द जल के ढेर, संचित राशि या उफनती हुई मात्रा का संकेत दे सकता है। मुख्य पाठ में अपेक्षाकृत निकट अर्थ ‘ढेर’ रखा गया है और अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: מַיִם רַבִּים
  choice: विशाल जलराशि
  rationale: शाब्दिक रूप से ‘बहुत जल’ या ‘बहुत-से जल’। ‘विशाल जलराशि’ मात्रा और प्रचण्डता दोनों का काव्यात्मक भाव सहज हिन्दी में व्यक्त करती है।
theological_decisions:
- issue: काव्यात्मक ईश-योद्धा का बिंब
  choice: परमेश्वर के अपने घोड़ों के साथ समुद्र से होकर आगे बढ़ने के ठोस बिंब को बनाए रखा गया है।
  alternative: घोड़ों को बादलों या स्वर्गदूतों का रूपक मानना, अथवा पूरे बिंब को केवल समुद्र पर परमेश्वर की सामर्थ्य के सामान्य कथन में बदल देना।
  rationale: मूल इब्रानी पाठ युद्धरत राजा के रूप में परमेश्वर का काव्यात्मक चित्र प्रस्तुत करता है। अनुवाद इसे किसी विशेष प्रतीकात्मक या सैद्धान्तिक व्याख्या में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानसूचक ‘आप’ का प्रयोग किया गया है। वाक्य की काव्यात्मक पुनरुक्ति और ‘जलराशि के ढेर’ का असामान्य बिंब जानबूझकर बनाए रखा गया है, क्योंकि मूल पाठ स्वयं काव्यात्मक और शब्दार्थ की दृष्टि से कठिन है।
