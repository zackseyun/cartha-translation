  text: בְּ/זַ֖עַם תִּצְעַד אָ֑רֶץ בְּ/אַ֖ף תָּד֥וּשׁ גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/012.yaml
  text: In wrath you marched through the earth[b][a]; in anger you threshed the nations.
translation:
  language: hi
  text: रोष में तू पृथ्वी पर चला[a]; क्रोध में तूने राष्ट्रों को ऐसे रौंदा जैसे अनाज को दाँया जाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘देश/भूमि पर’; हिब्रू אֶרֶץ का अर्थ सामान्य रूप से ‘पृथ्वी’ या किसी विशेष ‘देश/भूमि’ से हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘राष्ट्रों को दाँया’; हिब्रू क्रिया अनाज की मड़ाई या दँवरी करने का बिंब प्रस्तुत करती है, जो प्रायः पैरों से रौंदकर की जाती थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזַעַם
  choice: रोष में
  rationale: בְּ के साथ זַעַם यहाँ कार्य की रीति बताता है। ‘रोष में’ प्रबल दैवी कोप को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: תִּצְעַד
  choice: तू ... आगे बढ़ा
  rationale: צעד का अर्थ कदम बढ़ाना या डग भरते हुए चलना है। काव्यात्मक ईश-दर्शन में ‘आगे बढ़ा’ उद्देश्यपूर्ण, सामर्थ्यवान गति व्यक्त करता है और हिन्दी में स्वाभाविक है।
- source_word: אָרֶץ
  choice: पृथ्वी
  rationale: אֶרֶץ का अर्थ ‘पृथ्वी’ या ‘देश/भूमि’ हो सकता है। राष्ट्रों के समानांतर इस व्यापक ईश-दर्शन में ‘पृथ्वी’ उपयुक्त है, जबकि ‘देश’ की संभावना पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: בְּאַף
  choice: क्रोध में
  rationale: אַף का शाब्दिक अर्थ ‘नाक’ है, पर यहाँ यह क्रोध का मुहावरा है। ‘क्रोध में’ पहले अर्धांश के ‘रोष में’ के साथ समानांतरता बनाए रखता है।
- source_word: תָּדוּשׁ
  choice: तूने ... दाँय दिया
  rationale: דושׁ अनाज को पैरों या पशुओं से रौंदकर दाने अलग करने की क्रिया को दर्शाता है। ‘दाँय देना’ कृषि-रूपक को बनाए रखता है; ‘रौंदना’ उसका संदर्भगत वैकल्पिक अर्थ है।
- source_word: גּוֹיִם
  choice: राष्ट्रों
  rationale: גּוֹיִם यहाँ न्याय के अधीन जातीय-राजनीतिक समुदायों को दर्शाता है। ‘राष्ट्रों’ सीधा और संदर्भानुकूल है तथा बाद की किसी विशिष्ट धार्मिक श्रेणी को आरोपित नहीं करता।
theological_decisions:
- issue: ईश-दर्शन में אָרֶץ का दायरा
  choice: पृथ्वी
  alternative: देश/भूमि
  rationale: आसपास का काव्य परमेश्वर के न्यायपूर्ण आगमन को व्यापक रूप में चित्रित करता है और अगला पद ‘राष्ट्रों’ की बात करता है। फिर भी हिब्रू शब्द स्थानीय देश या भूमि भी सूचित कर सकता है, इसलिए विकल्प पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। प्रत्यक्ष संबोधन के लिए ‘तू’ हिब्रू के एकवचन संबोधन और स्तुति-काव्य की निकटता को व्यक्त करता है। ‘दाँय देना’ कृषि-रूपक को बचाता है; उसकी कम परिचितता को पाद-टिप्पणी स्पष्ट करती है।
