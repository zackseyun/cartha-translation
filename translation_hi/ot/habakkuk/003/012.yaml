  rationale: The revision maintains the source’s poetic parallelism, divine-judgment imagery, and lexical ambiguity of אֶרֶץ. It replaces an obscure threshing idiom with clear modern Hindi while explicitly preserving the Hebrew agricultural metaphor. No doctrinal interpretation has been added.
