source:
  edition: WLC
  text: עָמַ֣ד וַ/יְמֹ֣דֶד אֶ֗רֶץ רָאָה֙ וַ/יַּתֵּ֣ר גּוֹיִ֔ם וַ/יִּתְפֹּֽצְצוּ֙ הַרְרֵי עַ֔ד שַׁח֖וּ גִּבְע֣וֹת עוֹלָ֑ם הֲלִיכ֥וֹת עוֹלָ֖ם לֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/006.yaml
  text: He stood and measured the earth[a]; he looked and made nations tremble. The ancient mountains were shattered; the everlasting hills sank low[b]. His ways are everlasting.
translation:
  language: hi
  text: वह खड़ा हुआ और पृथ्वी को नापा; उसने दृष्टि डाली और राष्ट्रों को काँपने पर मजबूर कर दिया[a]। प्राचीन पर्वत चूर-चूर हो गए; सनातन पहाड़ियाँ झुक गईं। उसके मार्ग सनातन हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “राष्ट्रों को चौंका दिया,” या संभवतः “राष्ट्रों को तितर-बितर कर दिया।” यहाँ की इब्रानी क्रिया कठिन है और इसका सटीक अर्थ विवादित है।
    reason: lexical_alternative
  - marker: b
    text: अथवा, “उसके गमन सनातन हैं,” या “उसके पथ अनादि हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָמַד
  choice: वह खड़ा हुआ
  rationale: मूल क्रिया का सामान्य अर्थ ‘खड़ा होना’ है; ईश्वर के प्रकट होने के काव्यात्मक दृश्य में यह बिना अतिरिक्त व्याख्या जोड़े उसकी प्रभावशाली उपस्थिति व्यक्त करता है।
- source_word: וַיְמֹדֶד אֶרֶץ
  choice: और उसने पृथ्वी को नापा
  rationale: व्यंजनात्मक पाठ और מדד का सामान्य अर्थ ‘नापना’ है। संदर्भ के कारण ‘हिलाया’ संभव समझा गया है, पर मूल पाठ का अधिक सीधा अर्थ ‘नापा’ है।
- source_word: רָאָה
  choice: उसने दृष्टि डाली
  rationale: शाब्दिक अर्थ ‘उसने देखा’ है; ‘दृष्टि डाली’ काव्य में जानबूझकर देखने और उसके परिणाम की जीवंतता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיַּתֵּר גּוֹיִם
  choice: और राष्ट्रों को थरथरा दिया
  rationale: क्रिया कठिन और विवादित है। इस ईश्वर-प्रकाशन के संदर्भ में राष्ट्रों के भय और विक्षोभ को ‘थरथरा दिया’ स्वाभाविक रूप से व्यक्त करता है; अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: וַיִּתְפֹּצְצוּ
  choice: चूर-चूर हो गए
  rationale: रूप हिंसक रीति से टूट जाने का बोध देता है; यह चयन हिन्दी में प्रबल और काव्यात्मक है।
- source_word: הַרְרֵי עַד
  choice: प्राचीन पर्वत
  rationale: עַד यहाँ दीर्घकालीन प्राचीनता या स्थायित्व दर्शाता है। ‘प्राचीन’ अगले समानांतर पद में ‘सनातन’ की अनावश्यक पुनरावृत्ति से बचाता है।
- source_word: שַׁחוּ
  choice: झुक गईं
  rationale: क्रिया ‘नीचा होना’, ‘धँसना’ अथवा ‘झुकना’ व्यक्त कर सकती है। ‘झुक गईं’ भौतिक नीचा होने और ईश्वर के सामने अधीनता—दोनों काव्यात्मक संकेतों को खुला रखता है।
- source_word: גִּבְעוֹת עוֹלָם
  choice: सनातन पहाड़ियाँ
  rationale: עוֹלָם युगों से चले आ रहे स्थायित्व का बोध देता है; ‘सनातन’ ऊँची काव्यात्मक शैली बनाए रखता है।
- source_word: הֲלִיכוֹת עוֹלָם לוֹ
  choice: उसके मार्ग सनातन हैं
  rationale: הֲלִיכוֹת का अर्थ ‘चालें’, ‘गमन’ या ‘मार्ग’ हो सकता है। ‘मार्ग’ आधुनिक हिन्दी में स्पष्ट है, जबकि अधिक शाब्दिक गतिशील अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: मानवरूपी और ब्रह्मांडीय ईश्वर-प्रकाशन की भाषा
  choice: पद को ईश्वर के प्रकट होने और इतिहास तथा सृष्टि में कार्य करने का काव्यात्मक वर्णन बनाए रखा गया है।
  alternative: सभी क्रियाओं को केवल राजनीतिक रूपक मानना, अथवा इन्हें कठोर रूप से शाब्दिक ब्रह्मांडीय घटना बनाना।
  rationale: हबक्कूक 3 ऊँची ईश्वर-प्रकाशन संबंधी कविता है। अनुवाद राष्ट्रों और सृष्टि दोनों पर ईश्वरीय प्रभाव की भव्यता को सुरक्षित रखता है, पर किसी संकीर्ण व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘राष्ट्रों’, ‘प्राचीन पर्वत’ और ‘सनातन पहाड़ियाँ’ जैसे पद सामान्य पाठक के लिए बोधगम्य रहते हुए मूल समानांतरता और भव्यता को बनाए रखते हैं।
