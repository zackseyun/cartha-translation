source:
  edition: WLC
  text: שָׁמַ֣עְתִּי וַ/תִּרְגַּ֣ז בִּטְנִ֗/י לְ/קוֹל֙ צָלֲל֣וּ שְׂפָתַ֔/י יָב֥וֹא רָקָ֛ב בַּ/עֲצָמַ֖/י וְ/תַחְתַּ֣/י אֶרְגָּ֑ז אֲשֶׁ֤ר אָנ֨וּחַ֙ לְ/י֣וֹם צָרָ֔ה לַ/עֲל֖וֹת לְ/עַ֥ם יְגוּדֶֽ/נּוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/016.yaml
  text: I heard[a], and my inward parts trembled; at the sound my lips quivered. Rot enters into my bones, and beneath me I tremble, as I wait quietly for the day of distress[b], for the coming up of the people who will invade us.
translation:
  language: hi
  text: 'मैंने सुना, और मेरा अंतरतम काँप उठा;

    उस आवाज़ से मेरे होंठ थरथराने लगे।


    मेरी हड्डियों में सड़न उतर आई,

    और मेरे पाँवों के नीचे मैं काँपता हूँ।


    मैं संकट के दिन की शांत रहकर प्रतीक्षा करूँगा—

    उस समय की, जब वे लोग चढ़ आएँगे जो हम पर धावा बोलते हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कि मैं संकट के दिन विश्राम करूँ।” इब्रानी क्रिया का अर्थ ‘विश्राम करना,’ ‘स्थिर होना,’ या ‘शांत रहना’ हो सकता है। अंतिम पद को “धावा बोलनेवाले लोगों के चढ़ आने” के बजाय “संकट का दिन उन लोगों पर आएगा जो हम पर धावा बोलते हैं” भी समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: मैंने सुना
  rationale: שמע का प्रथम पुरुष पूर्ण रूप है। यह भविष्यद्वक्ता द्वारा सुनी गई बात या दिव्य प्रकटाव के प्रति उसकी प्रतिक्रिया आरम्भ करता है; सरल भूतकाल स्वाभाविक है।
- source_word: וַתִּרְגַּז בִּטְנִי
  choice: मेरा अंतरतम काँप उठा
  rationale: בטן का शाब्दिक अर्थ पेट है, पर काव्य में यह मनुष्य के भीतरी, भावनात्मक और शारीरिक केंद्र को दर्शा सकता है। ‘अंतरतम’ भय की गहरी, देहगत अनुभूति बनाए रखता है।
- source_word: לְקוֹל
  choice: उस आवाज़ से
  rationale: קול का अर्थ आवाज़, ध्वनि या वाणी हो सकता है। यहाँ कारणसूचक ‘उस आवाज़ से’ श्रवण के प्रति शारीरिक प्रतिक्रिया को स्वाभाविक हिन्दी में व्यक्त करता है और अनावश्यक रूप से वक्ता को निर्दिष्ट नहीं करता।
- source_word: צָלֲלוּ שְׂפָתַי
  choice: मेरे होंठ थरथराने लगे
  rationale: यहाँ צלל होंठों की कंपकंपी को व्यक्त करता है। ‘थरथराने लगे’ आधुनिक हिन्दी में तीव्र शारीरिक भय का स्पष्ट और सजीव चित्र देता है।
- source_word: יָבוֹא רָקָב בַּעֲצָמַי
  choice: मेरी हड्डियों में सड़न उतर आई
  rationale: רקב सड़न या क्षय है। ‘सड़न उतर आई’ हड्डियों तक पहुँचनेवाली निर्बलता और भय के तीखे रूपक को बनाए रखता है।
- source_word: וְתַחְתַּי אֶרְגָּז
  choice: और मैं भीतर तक काँप उठा
  rationale: תַּחְתַּי का शाब्दिक अर्थ ‘मेरे नीचे’ है, पर पूरा पद कठिन है और पैरों या खड़े होने की जगह में अस्थिरता सूचित कर सकता है। ‘भीतर तक’ हिन्दी में समूचे अस्तित्व को हिला देने वाली कंपकंपी व्यक्त करता है, बिना धरती या पैरों को स्पष्ट रूप से जोड़ने के।
- source_word: אֲשֶׁר אָנֻוּחַ
  choice: फिर भी ... शांत होकर बाट जोहूँगा
  rationale: נוח का अर्थ विश्राम करना, स्थिर होना या शांत रहना हो सकता है। प्रसंग में भय के बीच आनेवाले संकट-दिन की मौन प्रतीक्षा प्रमुख है; ‘शांत होकर बाट जोहूँगा’ भय और भरोसे के तनाव को बनाए रखता है।
- source_word: לְיוֹם צָרָה
  choice: संकट के उस दिन की
  rationale: צָרָה कठिनाई, विपत्ति या संकट को दर्शाता है। ‘संकट’ गंभीरता को बनाए रखते हुए घटना का स्वरूप आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: לַעֲלוֹת לְעַם יְגוּדֶנּוּ
  choice: जो हम पर धावा बोलनेवाले लोगों पर आएगा
  rationale: עלה का मूल अर्थ चढ़ना/ऊपर आना है और किसी घटना के लोगों पर आने के लिए भी प्रयुक्त हो सकता है; גדד लूटमार या धावा बोलने को दर्शाता है। वाक्य-विन्यास के अनुसार संकट-दिन को आक्रमणकारी लोगों पर आनेवाला समझना सम्भव और सुसंगत है, जबकि वैकल्पिक विभाजन पाद को आक्रमणकारियों के चढ़ आने से जोड़ता है; यह विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: אֲשֶׁר אָנֻוּחַ में भय और विश्वास का संबंध
  choice: भविष्यद्वक्ता भयंकर शारीरिक भय के बावजूद संकट के दिन की शांत प्रतीक्षा करता है।
  alternative: भविष्यद्वक्ता संकट के दिन विश्राम पाएगा।
  rationale: נוח दोनों अर्थों की अनुमति देता है। ‘शांत होकर बाट जोहूँगा’ निश्चित छुटकारे का ऐसा आश्वासन नहीं जोड़ता जो पद में स्पष्ट नहीं है, और भय तथा विश्वास दोनों को साथ रहने देता है।
- issue: अंतिम पंक्ति में संकट किस पर आता है
  choice: संकट का दिन उन लोगों पर आएगा जो ‘हम पर’ धावा बोलते हैं।
  alternative: हम पर धावा बोलनेवाले लोग चढ़ आएँगे।
  rationale: לעלות לעם को ‘लोगों पर आने’ और יגודנו को उन लोगों का विशेषणात्मक वर्णन मानना इब्रानी वाक्य-विन्यास का सम्भव पाठ है। चूँकि अंतिम पंक्ति संक्षिप्त और कठिन है, आक्रमणकारियों के चढ़ आनेवाला दूसरा पाठ पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘बाट जोहूँगा’ सामान्यतः समझ में आने वाला साहित्यिक मुहावरा है और मौन, धैर्यपूर्ण प्रतीक्षा का भाव देता है। समानांतर पंक्तियाँ मूल कविता की शारीरिक प्रतिक्रियाओं और फिर शांत प्रतीक्षा की ओर उसके मोड़ को सुरक्षित रखती हैं।
