id: HAB.3.14
reference: Habakkuk 3:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: נָקַ֤בְתָּ בְ/מַטָּי/ו֙ רֹ֣אשׁ פרז/ו יִסְעֲר֖וּ לַ/הֲפִיצֵ֑/נִי עֲלִ֣יצֻתָ֔/ם כְּמוֹ לֶ/אֱכֹ֥ל עָנִ֖י בַּ/מִּסְתָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/014.yaml
  text: You pierced the head of his warriors with his own staffs; they stormed out to scatter me[a], their exultation like one about to devour the poor in secret.
translation:
  language: hi
  text: तूने उसी की लाठियों से उसके योद्धाओं[a] का सिर बेध दिया। वे मुझे तितर-बितर करने के लिए आँधी की तरह टूट पड़े; उनका उल्लास ऐसा था, मानो वे दीन को छिपकर निगलने वाले हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके गाँवों का सिर” या “उसके दलों का सिर।” “योद्धाओं” के लिए प्रयुक्त इब्रानी शब्द कठिन है और इसे अधिक सामान्य रूप से शत्रु के दलों या अगुओं के अर्थ में भी समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: נָקַבְתָּ
  choice: बेध दिया
  rationale: क्रिया נקב आर-पार छेदने या बेधने का भाव देती है; ‘बेध दिया’ युद्ध की तीखी छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְמַטָּיו
  choice: उसी की लाठियों से
  rationale: מַטֶּה का मूल अर्थ लाठी या डंडा है। ‘उसी की’ प्रत्यय के स्वामित्व और शत्रु के अपने ही साधनों से पराजित होने की विडंबना को स्पष्ट करता है।
- source_word: רֹאשׁ
  choice: सिर
  rationale: רֹאשׁ का शाब्दिक अर्थ ‘सिर’ है, पर यहाँ ‘प्रधान’ भी हो सकता है। ‘सिर’ मूल बिंब और उसकी संभावित लाक्षणिकता दोनों को खुला रखता है।
- source_word: פרזיו
  choice: उसके योद्धाओं
  rationale: यह कठिन और विवादित रूप है। युद्ध-संदर्भ में इसे शत्रु के योद्धाओं या दलों के अर्थ में लेना प्रसंगानुकूल है; अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: יִסְעֲרוּ
  choice: आँधी की तरह टूट पड़े
  rationale: סער में तूफ़ानी वेग से उमड़ने या झपटने का भाव है। यह वाक्यांश गति और आँधी के बिंब दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: לַהֲפִיצֵנִי
  choice: मुझे तितर-बितर करने के लिए
  rationale: हिफ़ील में פוץ का अर्थ बिखेरना या तितर-बितर करना है; यह सीधा और प्रचलित हिन्दी रूप है।
- source_word: עֲלִיצֻתָם
  choice: उनका उल्लास
  rationale: यह शब्द प्रबल हर्ष या विजयोल्लास बताता है। ‘उल्लास’ आक्रमणकारियों की क्रूर प्रसन्नता को गरिमापूर्ण और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: כְּמוֹ לֶאֱכֹל
  choice: मानो ... निगलने वाले हों
  rationale: तुलना शिकारी उद्देश्य और निकट भविष्य की कार्रवाई दर्शाती है। ‘निगलने’ से हिंसक रूपक बना रहता है।
- source_word: עָנִי
  choice: दीन
  rationale: עָנִי निर्धन, पीड़ित या असहाय व्यक्ति का द्योतक हो सकता है। ‘दीन’ सामाजिक दुर्बलता और पीड़ा, दोनों को समेटता है।
- source_word: בַּמִּסְתָּר
  choice: छिपकर
  rationale: यह शब्द गुप्त स्थान या गुप्त रीति का संकेत देता है। ‘छिपकर’ हिन्दी में गुप्त, घातक आक्रमण का भाव स्वाभाविक रूप से देता है।
theological_decisions:
- issue: कठिन संज्ञा פרזיו की व्याख्या
  choice: उसके योद्धाओं
  alternative: उसके गाँवों / उसके दलों
  rationale: निकटवर्ती प्रसंग में शत्रु तूफ़ानी वेग से हमला करता है, इसलिए सैन्य समूह का अर्थ अधिक संगत है। फिर भी इब्रानी रूप अनिश्चित है, अतः वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- issue: רֹאשׁ का शाब्दिक या लाक्षणिक अर्थ
  choice: सिर
  alternative: प्रधान या अगुआ
  rationale: शाब्दिक बिंब को रखने से पाठ की हिंसक काव्यात्मकता बनी रहती है और यह संभावना भी खुली रहती है कि आशय नेतृत्व या अग्रभाग से हो।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘बेध दिया’, ‘आँधी की तरह टूट पड़े’ और ‘निगलने’ से मूल युद्धात्मक तथा शिकारी बिंब सुरक्षित हैं; विवादित इब्रानी पद का विकल्प पादटिप्पणी में दिया गया है।
