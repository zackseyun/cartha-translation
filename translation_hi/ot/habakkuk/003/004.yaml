base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/004.yaml
  text: His brightness was like the light; rays were from his hand[a], and there his power was hidden.
translation:
  language: hi
  text: उसकी चमक प्रकाश के समान थी; उसके हाथ से किरणें निकल रही थीं[a], और वहीं उसका सामर्थ्य छिपा हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके हाथ से सींग।” यहाँ “सींग” को रूपक के रूप में प्रकाश की किरणें समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגַהּ
  choice: चमक
  rationale: यह शब्द चमक या दीप्ति को दर्शाता है। ‘चमक’ आधुनिक हिन्दी में सहज है और प्रकाश से की गई तुलना के अनुकूल है।
- source_word: כָּאוֹר
  choice: प्रकाश के समान
  rationale: उपसर्ग כ तुलना प्रकट करता है और אוֹר का अर्थ ‘प्रकाश’ है; यह अनुवाद मूल उपमा को बनाए रखता है।
- source_word: תִּהְיֶה
  choice: थी
  rationale: रूप की दृष्टि से यह अपूर्ण क्रिया है, पर इस काव्यात्मक दर्शन-वर्णन में प्रसंगानुसार भूतकाल का वर्णन स्वाभाविक है।
- source_word: קַרְנַיִם
  choice: किरणें
  rationale: शाब्दिक अर्थ ‘सींग’ है, पर यहाँ उससे निकलती हुई प्रकाश-किरणों का रूपक समझ में आता है। शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מִיָּדוֹ
  choice: उसके हाथ से
  rationale: יָד का सामान्य अर्थ ‘हाथ’ और מִן का अर्थ स्रोत से निकलना है। यह मूल की देहात्मक काव्य-छवि को बनाए रखता है।
- source_word: לוֹ
  choice: उसके
  rationale: यह कठिन सर्वनामिक तत्व उसी दिव्य व्यक्तित्व की ओर संकेत करता है; हिन्दी में संबंधसूचक रूप स्वाभाविक है।
- source_word: וְשָׁם
  choice: और वहीं
  rationale: संयोजक तथा स्थानवाचक क्रियाविशेषण दोनों सुरक्षित हैं; ‘वहीं’ दृश्य प्रकाश और छिपे सामर्थ्य के बीच संबंध को स्पष्ट करता है।
- source_word: חֶבְיוֹן
  choice: छिपा हुआ था
  rationale: संज्ञा का अर्थ छिपने का स्थान या गुप्तता है। हिन्दी में क्रियात्मक अभिव्यक्ति सहज रहते हुए आशय को सुरक्षित रखती है।
- source_word: עֻזֹּה
  choice: उसका सामर्थ्य
  rationale: עֹז शक्ति, बल या सामर्थ्य को दर्शाता है। ‘सामर्थ्य’ गरिमापूर्ण तथा ईश-प्रकाशन के काव्यात्मक प्रसंग में स्वाभाविक है।
theological_decisions:
- issue: ईश-प्रकाशन में देहात्मक चित्रण
  choice: ‘उसके हाथ से’ को बनाए रखा गया है।
  alternative: देहात्मकता कम करने के लिए ‘उसकी ओर से’ या ‘उसके पास से’ कहना।
  rationale: इब्रानी पाठ काव्यात्मक ईश-प्रकाशन में ‘हाथ’ की देहात्मक छवि का प्रयोग करता है। इसे सुरक्षित रखना मूल पाठ का सम्मान करता है और छवि को किसी अमूर्त धार्मिक व्याख्या से नहीं बदलता।
- issue: प्रकट प्रकाश और छिपे सामर्थ्य का तनाव
  choice: ‘और वहीं उसका सामर्थ्य छिपा हुआ था’ रखा गया है।
  alternative: सामर्थ्य को किरणों में पूर्णतः प्रकट बताया जाए।
  rationale: मूल पाठ दृश्य दीप्ति के बीच सामर्थ्य के छिपे होने का तनाव बनाए रखता है; अनुवाद इसे हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और काव्यात्मक शैली। ‘निकल रही थीं’ इब्रानी के संक्षिप्त अस्तित्व/स्रोत-वाक्य को स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘चमक उठीं’ जैसे अधिक व्याख्यात्मक भाव को जोड़ने के।
