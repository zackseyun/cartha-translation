  edition: WLC
  text: תַּ֣חַת אָ֔וֶן רָאִ֖יתִי אָהֳלֵ֣י כוּשָׁ֑ן יִרְגְּז֕וּ/ן יְרִיע֖וֹת אֶ֥רֶץ מִדְיָֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/007.yaml
  text: I saw the tents of Cushan under affliction; the tent curtains of the land of Midian were trembling.
translation:
  language: hi
  text: 'मैंने कूशान के तंबुओं को विपत्ति में देखा;

    मिद्यान देश के तंबुओं के परदे काँप रहे थे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּחַת אָוֶן
  choice: विपत्ति में
  rationale: תחת यहाँ अवस्था या परिस्थिति को सूचित करता है, जबकि און संदर्भ में संकट, विपत्ति या दुःख का भाव देता है। सहज हिन्दी में ‘विपत्ति में’ मूल की संक्षिप्तता और अर्थ दोनों को रखता है।
- source_word: אָהֳלֵי כוּשָׁן
  choice: कूशान के तंबुओं
  rationale: स्थान/जनसमूह के नाम कूशान को लिप्यंतरित किया गया है और אהלים का सामान्य आधुनिक हिन्दी रूप ‘तंबू’ रखा गया है।
- source_word: יְרִיעוֹת אֶרֶץ מִדְיָן
  choice: मिद्यान देश के तंबुओं के परदे
  rationale: יריעות तंबुओं के कपड़े या परदे हैं; संदर्भ स्पष्ट करने के लिए ‘तंबुओं के परदे’ स्वाभाविक हिन्दी है। ארץ को ‘देश’ से व्यक्त किया गया है।
- source_word: יִרְגְּזוּן
  choice: काँप रहे थे
  rationale: क्रिया भय, आंदोलन या थरथराने का बोध करा सकती है। समानांतर काव्य-पंक्ति और दृश्यात्मक संदर्भ में ‘काँप रहे थे’ उपयुक्त है।
theological_decisions:
- issue: कूशान के तंबुओं पर विपत्ति का संबंध
  choice: ‘कूशान के तंबुओं को विपत्ति में’—विपत्ति को तंबुओं/निवासियों की दशा माना गया
  alternative: ‘विपत्ति के अधीन’ या ‘कष्ट के कारण’
  rationale: मूल תַּחַת אָוֶן संक्षिप्त और कुछ हद तक अस्पष्ट है। अनुवाद कारण या दैवी दंड की प्रकृति को अधिक स्पष्ट नहीं करता, बल्कि देखी गई संकटपूर्ण दशा को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; पद की समानांतर काव्य-रचना को दो पंक्तियों में रखा गया है। ‘कूशान’ और ‘मिद्यान’ पारंपरिक बाइबलीय नामों के निकट लिप्यंतरित हैं।
