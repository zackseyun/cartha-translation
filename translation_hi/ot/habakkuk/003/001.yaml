- source_word: עַל
  choice: के अनुसार
  rationale: संगीत अथवा उपासना-संबंधी शीर्षक में यह किसी शैली, धुन या प्रस्तुति-निर्देश का संबंध बता सकता है; ‘के अनुसार’ संबंध को बनाए रखते हुए अनिश्चितता का अति-निर्धारण नहीं करता।
- source_word: שִׁגְיֹנוֹת
  choice: शिग्योनोत
  rationale: यह दुर्लभ और अनिश्चित संगीतात्मक या उपासना-संबंधी पारिभाषिक शब्द है; लिप्यंतरण झूठी निश्चितता से बचता है।
