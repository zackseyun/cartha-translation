language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/בִ/נְהָרִים֙ חָרָ֣ה יְהוָ֔ה אִ֤ם בַּ/נְּהָרִים֙ אַפֶּ֔/ךָ אִם בַּ/יָּ֖ם עֶבְרָתֶ֑/ךָ כִּ֤י תִרְכַּב֙ עַל סוּסֶ֔י/ךָ מַרְכְּבֹתֶ֖י/ךָ יְשׁוּעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/008.yaml
  text: Was your anger against the rivers[a], Yahweh? Was your wrath against the rivers, or your fury against the sea, that you rode on your horses, on your chariots of salvation?
translation:
  language: hi
  text: 'क्या नदियों पर तेरा क्रोध भड़क उठा था, हे याहवे?

    क्या नदियों पर तेरा रोष था,

    या समुद्र पर तेरा प्रचंड क्रोध,

    कि तू अपने घोड़ों पर,

    अपने उद्धार के रथों पर सवार हुआ?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने विजयी रथों पर।” इस संदर्भ में हिब्रू יְשׁוּעָה का अर्थ उद्धार, छुटकारा या विजय हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבִנְהָרִים חָרָה
  choice: क्या नदियों पर तेरा क्रोध भड़क उठा था
  rationale: प्रश्नवाचक הֲ और בְּ को ‘क्या ... पर’ से व्यक्त किया गया है। חָרָה के जलने या भड़कने वाले क्रोध-बिंब को स्वाभाविक हिन्दी में ‘क्रोध भड़क उठा’ द्वारा बनाए रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत नाम की ध्वन्यात्मक पहचान को किसी उपाधि से बदलने के बजाय हिन्दी में ‘याहवे’ रूप में रखा गया है।
- source_word: אַפֶּךָ
  choice: तेरा रोष
  rationale: אַף यहाँ मुहावरे के रूप में क्रोध बताता है। ‘रोष’ पहली पंक्ति के ‘क्रोध’ से काव्यात्मक भिन्नता रखते हुए समानांतर अर्थ बनाए रखता है।
- source_word: עֶבְרָתֶךָ
  choice: तेरा प्रचंड क्रोध
  rationale: עֶבְרָה तीव्र, उमड़ते हुए क्रोध का बोध देता है; ‘प्रचंड क्रोध’ उसकी बढ़ी हुई तीव्रता को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּיָּם
  choice: समुद्र पर
  rationale: शाब्दिक अर्थ रखा गया है, जिससे नदियों और समुद्र का काव्यात्मक समानांतर तथा ईश-प्रकटन का दृश्य सुरक्षित रहता है।
- source_word: כִּי תִרְכַּב עַל סוּסֶיךָ
  choice: कि तू अपने घोड़ों पर ... सवार हुआ
  rationale: כִּי को यहाँ पूर्ववर्ती आलंकारिक प्रश्न से जुड़ी व्याख्यात्मक कड़ी ‘कि’ के रूप में रखा गया है। רכב का सीधा अर्थ ‘सवार होना’ है और काव्य में स्मरण किए जा रहे कार्य के अनुरूप भूतकाल प्रयुक्त है।
- source_word: מַרְכְּבֹתֶיךָ יְשׁוּעָה
  choice: अपने उद्धार के रथों पर
  rationale: संक्षिप्त हिब्रू संज्ञा-संबंध को ‘उद्धार के रथ’ के रूप में रखा गया है। इससे יְשׁוּעָה का व्यापक अर्थ सुरक्षित रहता है और उसे केवल सैनिक विजय तक सीमित नहीं किया जाता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। ‘याहवे’ उस नाम को नाम के रूप में सुरक्षित रखता है।
- issue: युद्धमय ईश-प्रकटन में יְשׁוּעָה का अर्थ
  choice: उद्धार
  alternative: विजय; छुटकारा
  rationale: संदर्भ में विजयी बचाव का भाव संभव है, पर ‘उद्धार’ ईश्वरीय रक्षा के व्यापक अर्थ को सुरक्षित रखता है और युद्धक्षेत्र की सफलता तक अर्थ को संकुचित नहीं करता।
- issue: ईश्वर को संबोधित करने वाले एकवचन प्रत्यय
  choice: तेरा/तू
  alternative: आपका/आप
  rationale: हिब्रू में संबोधन व्याकरणतः एकवचन है। हिन्दी का ‘तू/तेरा’ प्रत्यक्ष, काव्यात्मक और निकट संबोधन को बनाए रखता है; यहाँ यह अनादर नहीं बल्कि प्रार्थनात्मक निकटता व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक पंक्ति-विन्यास रखा गया है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट है। ‘क्रोध’, ‘रोष’ और ‘प्रचंड क्रोध’ मूल की क्रमिक समानांतर अभिव्यक्तियों को अलग पहचान देते हैं।
