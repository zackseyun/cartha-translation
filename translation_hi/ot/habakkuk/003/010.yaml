id: HAB.3.10
reference: Habakkuk 3:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רָא֤וּ/ךָ יָחִ֨ילוּ֙ הָרִ֔ים זֶ֥רֶם מַ֖יִם עָבָ֑ר נָתַ֤ן תְּהוֹם֙ קוֹל֔/וֹ ר֖וֹם יָדֵ֥י/הוּ נָשָֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/010.yaml
  text: The mountains saw you and writhed[a]; a torrent of waters swept by. The deep gave its voice[c][b]; it lifted its hands on high.
translation:
  language: hi
  text: 'पर्वतों ने आपको देखा और वे तड़प उठे[a];

    जल की प्रचंड धारा बहती चली गई[b]।

    अथाह जल ने अपनी आवाज़ दी;

    उसने अपने हाथ ऊँचे उठाए[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “काँप उठे,” “पीड़ा से व्याकुल हो उठे,” अथवा “थरथरा उठे।” इब्रानी क्रिया काँपने के साथ प्रसव-जैसी पीड़ा में तड़पने का भाव भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप से, “पास से निकल गई” अथवा “पार हो गई।” इब्रानी क्रिया सामान्यतः पार होने या पास से निकलने के लिए प्रयुक्त होती है; यहाँ जलधारा के संदर्भ में “बहती चली गई” उसकी गतिशीलता को व्यक्त करता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “उसने अपने हाथ ऊँचे उठाए।” कुछ लोग ‘हाथों’ को अथाह जल की ऊपर उठती लहरों का रूपक समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּךָ
  choice: आपको देखा
  rationale: यह ראה के काल रूप के साथ द्वितीय पुरुष एकवचन प्रत्यय का सीधा अर्थ है। सम्मानसूचक ‘आपको’ आधुनिक हिन्दी में परमेश्वर को किए गए संबोधन के लिए स्वाभाविक है और सृष्टि के मानवीकरण को बनाए रखता है।
- source_word: יָחִילוּ
  choice: तड़प उठे
  rationale: חול/חיל से बना यह क्रिया-रूप काँपने, मरोड़ खाने या प्रसव-जैसी पीड़ा में तड़पने का भाव दे सकता है। ‘तड़प उठे’ पहाड़ों की तीव्र, सजीव प्रतिक्रिया को व्यक्त करता है और केवल ‘काँपे’ की अपेक्षा अर्थ-परास को अधिक सुरक्षित रखता है।
- source_word: זֶרֶם מַיִם
  choice: जल की प्रचंड धारा
  rationale: זֶרֶם तेज़ बहाव, मूसलाधार प्रवाह या बाढ़-सरीखी धारा का बोध कराता है। यह चयन प्रबल जल-प्रवाह की काव्यात्मक छवि को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: עָבָר
  choice: उमड़ती हुई निकल गई
  rationale: עבר का मूल अर्थ पार होना या पास से निकलना है। जलधारा के संदर्भ में ‘निकल गई’ उस मूल गति को रखता है, जबकि ‘उमड़ती हुई’ प्रसंग में उसकी प्रचंडता को व्यक्त करता है।
- source_word: תְּהוֹם
  choice: अथाह जल
  rationale: תְּהוֹם यहाँ गहरे अथवा आदिम विशाल जल को सूचित करता है। ‘अथाह जल’ आधुनिक हिन्दी में समझने योग्य है और ‘अधोलोक’ जैसी बाद की धर्मवैज्ञानिक धारणाएँ आरोपित नहीं करता।
- source_word: נָתַן תְּהוֹם קוֹלוֹ
  choice: अथाह जल ने अपनी आवाज़ उठाई
  rationale: शाब्दिक मुहावरा ‘अपनी आवाज़ दी’ हिन्दी में अस्वाभाविक है। ‘अपनी आवाज़ उठाई’ अथाह जल के मानवीकरण तथा उसके ध्वनि करने—दोनों को सुरक्षित रखता है।
- source_word: רוֹם יָדֵיהוּ נָשָׂא
  choice: उसने अपने हाथ ऊँचे उठाए
  rationale: यह पदबंध अथाह जल के ‘हाथ’ ऊँचे उठाने की मानवीकृत छवि देता है। ‘हाथ’ को सीधे बनाए रखा गया है; उसे मुख्य पाठ में ‘लहरें’ कहकर व्याख्यायित नहीं किया गया।
theological_decisions:
- issue: ईश-दर्शन में सृष्टि का मानवीकरण
  choice: पर्वतों और अथाह जल को परमेश्वर की उपस्थिति पर सजीव प्रतिक्रिया करते हुए प्रस्तुत किया गया है।
  alternative: चित्र को केवल प्राकृतिक घटनाओं के रूप में खोल देना—जैसे पहाड़ काँपे, जल गरजा और लहरें उठीं।
  rationale: इब्रानी कविता जानबूझकर पर्वतों को देखने और तड़पने तथा अथाह जल को आवाज़ और हाथ रखने वाला बताती है। इस मानवीकरण को बनाए रखना मूल काव्यात्मक तनाव को सुरक्षित रखता है और व्याख्या को अनुवाद में नहीं मिलाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—काव्यात्मक और गरिमापूर्ण, पर सामान्य पाठक के लिए सुबोध। ‘जल’ और ‘अथाह’ जैसे शब्द पद्य की ऊँची शैली के अनुकूल हैं; वाक्य-विन्यास को हिन्दी में स्वाभाविक रखते हुए इब्रानी की समानांतर पंक्तियाँ और सृष्टि का मानवीकरण सुरक्षित रखा गया है।
