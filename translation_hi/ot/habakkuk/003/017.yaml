language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי תְאֵנָ֣ה לֹֽא תִפְרָ֗ח וְ/אֵ֤ין יְבוּל֙ בַּ/גְּפָנִ֔ים כִּחֵשׁ֙ מַעֲשֵׂה זַ֔יִת וּ/שְׁדֵמ֖וֹת לֹא עָ֣שָׂה אֹ֑כֶל גָּזַ֤ר מִ/מִּכְלָה֙ צֹ֔אן וְ/אֵ֥ין בָּקָ֖ר בָּ/רְפָתִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/017.yaml
  text: Though the fig tree does not blossom[a], and there is no produce on the vines; the yield of the olive fails, and the fields produce no food; the flock is cut off from the fold, and there is no herd in the stalls[b],
translation:
  language: hi
  text: चाहे अंजीर का पेड़ न फूले[a], और अंगूर की बेलों पर उपज न हो; जैतून की फसल धोखा दे[b], और खेत भोजन न उपजाएँ; बाड़े से भेड़-बकरियों का झुंड नष्ट हो जाए, और पशुशालाओं में गाय-बैल न रहें,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि अंजीर का पेड़ नहीं फूलता...” इब्रानी का आरम्भिक शब्द कारण (“क्योंकि”) या रियायत (“चाहे”) दोनों व्यक्त कर सकता है; अगले पद में आनन्द की घोषणा की भूमिका के रूप में “चाहे” अधिक उपयुक्त जान पड़ता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “जैतून का उत्पाद धोखा दे।” इसका अर्थ है कि जैतून की फसल आशा के अनुसार फल न दे या विफल हो जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: चाहे
  rationale: यह अव्यय कारणसूचक ‘क्योंकि’ भी हो सकता है, पर पद 18 में आने वाले आनन्द के संकल्प की भूमिका में रियायती अर्थ ‘चाहे’ अधिक स्वाभाविक है।
- source_word: תְאֵנָה לֹא תִפְרָח
  choice: अंजीर का पेड़ न फूले
  rationale: वृक्ष और उसके फूलने की कृषि-छवि को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְאֵין יְבוּל בַּגְּפָנִים
  choice: अंगूर की बेलों पर उपज न हो
  rationale: יְבוּל कृषि-उपज है और גְּפָנִים अंगूर की बेलें; ‘पर’ हिन्दी में फल लगने या उपज होने का स्वाभाविक संबंध व्यक्त करता है।
- source_word: כִּחֵשׁ מַעֲשֵׂה זַיִת
  choice: जैतून की फसल धोखा दे
  rationale: इब्रानी अभिव्यक्ति का शाब्दिक भाव ‘जैतून का उत्पाद झूठा सिद्ध हो/धोखा दे’ है। ‘फसल धोखा दे’ काव्यात्मक मानवीकरण और फसल विफल होने का अर्थ दोनों बचाता है।
- source_word: וּשְׁדֵמוֹת לֹא עָשָׂה אֹכֶל
  choice: खेत भोजन न उपजाएँ
  rationale: शाब्दिक ‘खेत भोजन न बनाएँ’ को स्वाभाविक कृषि-हिन्दी में प्रस्तुत करता है।
- source_word: גָּזַר מִמִּכְלָה צֹאן
  choice: बाड़े से भेड़-बकरियाँ मिट जाएँ
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़-बकरियों, का सामूहिक शब्द है। גָּזַר के ‘काट दिया जाना/समाप्त हो जाना’ भाव को ‘मिट जाएँ’ सहज हिन्दी में व्यक्त करता है।
- source_word: וְאֵין בָּקָר בָּרְפָתִים
  choice: पशुशालाओं में गाय-बैल न रहें
  rationale: בָּקָר सामूहिक रूप से बड़े गोपशुओं को सूचित करता है; ‘गाय-बैल’ सामान्य पाठक के लिए इसका विस्तार स्पष्ट करता है। רְפָתִים के लिए ‘पशुशालाएँ’ आधुनिक और स्पष्ट है।
theological_decisions:
- issue: आरम्भिक כִּי का संबंध
  choice: रियायती अर्थ ‘चाहे’
  alternative: कारणसूचक ‘क्योंकि’
  rationale: दोनों अर्थ व्याकरणतः संभव हैं। पद 18 के ‘फिर भी मैं आनन्दित रहूँगा’ के साथ रियायती संबंध अधिक सुगठित है, जबकि वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक लय रखी गई है। कृषि और पशुपालन के चित्र सामान्य पाठकों के लिए स्पष्ट किए गए हैं, पर मूल की क्रमिक विपत्ति और मानवीकरण को समतल नहीं किया गया। पद अगले वाक्य में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
