  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: טְה֤וֹר עֵינַ֨יִם֙ מֵ/רְא֣וֹת רָ֔ע וְ/הַבִּ֥יט אֶל עָמָ֖ל לֹ֣א תוּכָ֑ל לָ֤/מָּה תַבִּיט֙ בּֽוֹגְדִ֔ים תַּחֲרִ֕ישׁ בְּ/בַלַּ֥ע רָשָׁ֖ע צַדִּ֥יק מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/013.yaml
  text: Your eyes are too pure to look on evil[a], and you cannot gaze at wrongdoing[c][b]. Why then do you look on the treacherous and keep silent when the wicked swallows up one more righteous than he?
translation:
  language: hi
  text: तेरी आँखें इतनी पवित्र हैं कि बुराई को देख नहीं सकतीं,[a] और तू अनर्थ को निहार नहीं सकता।[b] फिर तू विश्वासघातियों को क्यों देखता रहता है और उस समय चुप क्यों रहता है, जब दुष्ट अपने से अधिक धर्मी को निगल जाता है?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बुराई को देखने से तेरी आँखें अधिक पवित्र हैं”; यह इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: “अनर्थ” का अर्थ “उपद्रव,” “दुष्कर्म” या “दुःख” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में यह तुलना है—“अपने से अधिक धर्मी को”; यह आवश्यक रूप से पूर्ण धार्मिकता का दावा नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טְהוֹר עֵינַיִם מֵרְאוֹת רָע
  choice: तेरी आँखें इतनी पवित्र हैं कि बुराई को देख नहीं सकतीं
  rationale: ‘आँखों से पवित्र’ हिब्रू मुहावरे को स्वाभाविक हिन्दी में रूपक और उसके बाद आने वाली असमर्थता की धारणा सहित रखा गया है।
- source_word: וְהַבִּיט אֶל עָמָל לֹא תוּכָל
  choice: और तू अनर्थ को निहार नहीं सकता
  rationale: עָמָל में दुष्कर्म, उपद्रव और उससे उत्पन्न दुःख का अर्थ-क्षेत्र है; ‘अनर्थ’ इस काव्यात्मक संदर्भ में इस जानबूझकर खुली व्यापकता को बनाए रखता है। ‘निहारना’ הַבִּיט की ध्यानपूर्वक देखने की छाया को व्यक्त करता है।
- source_word: לָמָּה תַבִּיט בּוֹגְדִים
  choice: फिर तू विश्वासघातियों को क्यों देखता रहता है
  rationale: ‘फिर’ पहले कथन और शिकायत के बीच के तीखे विरोध को स्वाभाविक बनाता है। ‘विश्वासघाती’ בּוֹגְדִים के कपटपूर्ण और निष्ठाहीन आचरण को व्यक्त करता है।
- source_word: תַּחֲרִישׁ
  choice: चुप क्यों रहता है
  rationale: यह कथित दैवी निष्क्रियता के दौरान मौन बने रहने को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּבַלַּע רָשָׁע
  choice: जब दुष्ट ... निगल जाता है
  rationale: परिस्थितिवाचक infinitive को हिन्दी के ‘जब’ उपवाक्य से व्यक्त किया गया है और मूल की सजीव हिंसक छवि ‘निगल जाता है’ में सुरक्षित है।
- source_word: צַדִּיק מִמֶּנּוּ
  choice: अपने से अधिक धर्मी को
  rationale: מִן का तुलनात्मक अर्थ स्पष्ट रखा गया है, ताकि पीड़ित की पूर्ण निष्पापता का ऐसा दावा न बने जो मूल पाठ नहीं करता।
theological_decisions:
- issue: परमेश्वर की पवित्रता और बुराई को देखने के बीच तनाव
  choice: नबी के कथन को परमेश्वर की नैतिक पवित्रता के काव्यात्मक दावे के रूप में रखा गया है, साथ ही अगले प्रश्न में उसके विश्वासघातियों को ‘देखने’ की विडंबना को अनसुलझा छोड़ा गया है।
  alternative: ‘तू बुराई सहन नहीं कर सकता’ कहकर कथन की व्याख्या कर देना, या इसे इस निरपेक्ष दावे की तरह लेना कि परमेश्वर किसी अर्थ में बुराई देख ही नहीं सकता।
  rationale: मूल पद स्वयं ‘देखने’ की भाषा को दोनों ओर रखकर शिकायत का धार्मिक तनाव रचता है। अनुवाद उसे किसी व्यवस्थित दार्शनिक निष्कर्ष से नहीं मिटाता।
- issue: निगले जाने वाले व्यक्ति की धार्मिकता
  choice: ‘अपने से अधिक धर्मी’ के रूप में सापेक्ष तुलना बनाए रखी गई है।
  alternative: सिर्फ ‘धर्मी जन’ कहना, जिससे पूर्ण धार्मिकता या निर्दोषता का अधिक निरपेक्ष दावा सुनाई दे सकता है।
  rationale: צַדִּיק מִמֶּנּוּ स्पष्ट रूप से तुलनात्मक रचना है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक गद्य। परमेश्वर के लिए एकवचन आत्मीय ‘तू/तेरी’ रखा गया है, जो भविष्यद्वाणी की सीधी प्रार्थनात्मक शिकायत के अनुकूल है। ‘अनर्थ’ अर्थगत व्यापकता रखता है, जबकि पद की पुनरुक्त ‘देखना/निहारना’ भाषा और उसका धार्मिक तनाव सुरक्षित है।
