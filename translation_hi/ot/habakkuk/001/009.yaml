base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/009.yaml
  text: All of them come for violence[a]; the set of their faces is forward[c][b], and they gather captives like sand.
translation:
  language: hi
  text: वे सब हिंसा करने आते हैं; उनके चेहरों का रुख आगे की ओर है[a], और वह[b] बंदियों को बालू के समान बटोरता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “उनके चेहरों का रुख पूर्व की ओर है।” हिब्रू अभिव्यक्ति कठिन है: קָדִימָה का अर्थ “आगे की ओर” या “पूर्व की ओर” हो सकता है, और מְגַמַּת दिशा, लक्ष्य या दृढ़ अभिप्राय बता सकता है।'
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में क्रिया एकवचन है—“और वह बटोरता है”—जिसमें आक्रमणकारी सेना को एक सामूहिक इकाई माना गया है।
    reason: lexical_alternative
  - marker: c
    text: या “वह बालू के समान बंदीपन बटोरता है”; שֶׁבִי को अमूर्त अर्थ में भी समझा जा सकता है, अर्थात वह असंख्य लोगों को बंदी बनाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלֹּה
  choice: वे सब
  rationale: पुल्लिंग एकवचन प्रत्यय के बावजूद यह रूप प्रसंग में आक्रमणकारी दल को सामूहिक रूप से दर्शाता है; आधुनिक हिन्दी में “वे सब” स्वाभाविक है।
- source_word: לְחָמָס
  choice: हिंसा करने
  rationale: חָמָס बलपूर्वक हिंसा और क्रूर अन्याय को व्यक्त करता है; उद्देश्यसूचक לְ को हिन्दी में क्रियात्मक ढंग से रखा गया है।
- source_word: יָבוֹא
  choice: आते हैं
  rationale: בוא का सीधा अर्थ “आना” है; सामूहिक दल को हिन्दी में बहुवचन के रूप में व्यक्त करना स्वाभाविक है।
- source_word: מְגַמַּת פְּנֵיהֶם
  choice: उनके चेहरों का रुख
  rationale: दुर्लभ संज्ञा מְגַמַּת दिशा, लक्ष्य या स्थिर अभिमुखता बता सकती है; “रुख” चेहरे के ठोस बिंब और दिशात्मक अस्पष्टता दोनों को पर्याप्त रूप से बनाए रखता है।
- source_word: קָדִימָה
  choice: आगे की ओर
  rationale: यह शब्द “पूर्व की ओर” या दिशात्मक प्रयोग में “आगे की ओर” हो सकता है; सैन्य अग्रगमन के प्रसंग में मुख्य पाठ में “आगे की ओर” उपयुक्त है, जबकि दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וַיֶּאֱסֹף
  choice: और वह ... बटोरता है
  rationale: हिब्रू क्रिया एकवचन है और आक्रमणकारी दल को एक सामूहिक इकाई मानती है; हिन्दी में “वह” इस रूपगत विशेषता को बचाता है।
- source_word: כַּחוֹל
  choice: बालू के समान
  rationale: यह असंख्य मात्रा का परिचित उपमान है; “बालू के समान” गरिमापूर्ण और स्पष्ट हिन्दी है।
- source_word: שֶׁבִי
  choice: बंदियों को
  rationale: संज्ञा का अर्थ “बंदी” अथवा अमूर्त रूप में “बंदी बनाए गए लोग/बंदीपन” हो सकता है; “बटोरता है” के साथ व्यक्तिगत अर्थ अधिक स्वाभाविक है।
