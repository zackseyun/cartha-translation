id: HAB.1.15
reference: Habakkuk 1:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֻּלֹּ/ה֙ בְּ/חַכָּ֣ה הֵֽעֲלָ֔ה יְגֹרֵ֣/הוּ בְ/חֶרְמ֔/וֹ וְ/יַאַסְפֵ֖/הוּ בְּ/מִכְמַרְתּ֑/וֹ עַל כֵּ֖ן יִשְׂמַ֥ח וְ/יָגִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/015.yaml
  text: He brings all of them up with a hook[a]; he drags him away with his net, and gathers him in with his dragnet[b]. Therefore he rejoices and exults.
translation:
  language: hi
  text: वह उन सबको काँटे से ऊपर खींच लेता है[a]; वह उसे अपने जाल में घसीट ले जाता है और अपने बड़े जाल में बटोर लेता है[b]। इसलिए वह आनन्दित होता है और उल्लास मनाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उन सबको काँटे से निकाल लाता है।” इब्रानी में पकड़े गए शिकार के लिए सामूहिक रूप से ‘सब’ कहने के बाद एकवचन ‘उसे’ का प्रयोग किया गया है।
    reason: lexical_alternative
  - marker: b
    text: 'यहाँ मछली पकड़ने के जाल के लिए इब्रानी के दो अलग शब्द आए हैं: ‘जाल’ और ‘बड़ा जाल’।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלֹּה
  choice: उन सबको
  rationale: रूप की दृष्टि से यह एकवचन है, पर सन्दर्भ में पकड़े जा रहे लोगों के पूरे समूह को सामूहिक रूप से व्यक्त करता है; ‘उन सबको’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से पहुँचाता है।
- source_word: בְּחַכָּה
  choice: काँटे से
  rationale: חַכָּה मछली पकड़ने के काँटे को दर्शाता है। ‘काँटा’ मछली पकड़ने के रूपक को स्पष्ट और सहज रखता है।
- source_word: הֵעֲלָה
  choice: ऊपर खींच लेता है
  rationale: עלה का हिफ़ईल रूप यहाँ पकड़े हुए शिकार को पानी से ऊपर लाने का भाव देता है; ‘ऊपर खींच लेता है’ दृश्य और क्रिया दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְגֹרֵהוּ
  choice: वह उसे … घसीट ले जाता है
  rationale: क्रिया खींचने या घसीटने का भाव देती है और प्रत्यय व्याकरणिक रूप से पुल्लिंग एकवचन है। ‘उसे’ रखकर सामूहिक से एकवचन बिम्ब की इब्रानी अदला-बदली सुरक्षित रखी गई है।
- source_word: בְחֶרְמוֹ
  choice: अपने जाल में
  rationale: חֵרֶם यहाँ मछली पकड़ने का जाल है। ‘जाल’ सबसे स्पष्ट सामान्य हिन्दी शब्द है, और ‘अपने’ मूल के स्वामित्व-सूचक प्रत्यय को व्यक्त करता है।
- source_word: וְיַאַסְפֵהוּ
  choice: और … बटोर लेता है
  rationale: אָסַף का अर्थ इकट्ठा करना या बटोरना है। ‘बटोर लेता है’ जाल में शिकार समेटने के दृश्य को सजीव रखता है; कर्म फिर एकवचन ‘उसे’ ही है।
- source_word: בְּמִכְמַרְתּוֹ
  choice: अपने महाजाल में
  rationale: מִכְמֶרֶת घेरकर या खींचकर पकड़ने वाले बड़े जाल को सूचित करता है। ‘महाजाल’ पहले प्रयुक्त ‘जाल’ से भेद बनाए रखता है और हिन्दी में बड़े मछली पकड़ने वाले जाल के रूप में समझा जा सकता है।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पिछले सफल शिकार से निकलने वाला परिणाम बताता है; ‘इसलिए’ हिन्दी में तर्क-संबंध को सीधे व्यक्त करता है।
- source_word: יִשְׂמַח
  choice: आनन्दित होता
  rationale: שׂמח आनन्दित होने का सामान्य क्रियार्थ रखता है; यह चयन भविष्यवाणी के गरिमापूर्ण काव्यात्मक स्वर के अनुकूल है।
- source_word: וְיָגִיל
  choice: और उल्लास मनाता है
  rationale: גיל प्रबल या उमंगपूर्ण आनन्द व्यक्त करता है। ‘उल्लास मनाता है’ पहले आनन्द-सूचक पद की केवल पुनरावृत्ति न करके तीव्रता बनाए रखता है।
theological_decisions:
- issue: मछली पकड़ने के बिम्ब का अभिप्राय
  choice: मछुआरे के रूप में विजेता द्वारा लोगों को मछलियों की तरह पकड़ने का रूपक बनाए रखा गया है।
  alternative: इसे किसी राजनीतिक या मानवीय संकेत के बिना शाब्दिक मछली पकड़ना समझना।
  rationale: हबक्कूक 1:14–17 का निकट सन्दर्भ साम्राज्यवादी हिंसा के लिए मछली पकड़ने की भाषा का रूपकात्मक प्रयोग करता है। मुख्य पाठ रूपक को न तो शाब्दिक बनाता है, न अनावश्यक व्याख्या जोड़ता है।
- issue: सामूहिक और एकवचन कर्म के बीच बदलाव
  choice: पहले ‘उन सबको’, फिर ‘उसे’ रखकर इब्रानी का व्याकरणिक और काव्यात्मक बदलाव सुरक्षित रखा गया है।
  alternative: सभी खण्डों में ‘उन्हें’ रखकर हिन्दी संख्या-संगति को समतल कर देना।
  rationale: יְגֹרֵהוּ और וְיַאַסְפֵהוּ में तृतीय पुरुष पुल्लिंग एकवचन कर्म-प्रत्यय हैं। यह बदलाव सम्भवतः पूरे शिकार-समूह को एक सामूहिक इकाई या प्रतिनिधि शिकार के रूप में देखता है; अनुवाद इसका निर्णय पाठक की ओर से नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘काँटा’, ‘जाल’ और ‘महाजाल’ मूल मछली-पकड़ रूपक तथा दो भिन्न जाल-शब्दों का अन्तर बनाए रखते हैं। असामान्य ‘उन सबको … उसे’ संरचना जानबूझकर रखी गई है और पादटिप्पणी में स्पष्ट की गई है।
