base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/016.yaml
  text: Therefore he sacrifices to his net and burns incense to his dragnet[a], because by them his portion is rich and his food is plentiful.
translation:
  language: hi
  text: इसलिए वह अपने जाल को बलि चढ़ाता है और अपने बड़े जाल के लिए धूप जलाता है,[a] क्योंकि उन्हीं के द्वारा उसका भाग समृद्ध है और उसका भोजन भरपूर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका भाग मोटा है और उसका भोजन पुष्ट है।” इब्रानी में मोटेपन की छवि प्रचुरता, समृद्धि और उत्तमता व्यक्त करती है।
    reason: शाब्दिक रूप और अर्थगत विकल्प को सुरक्षित रखना
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पिछले वर्णन में विजेता की सफलता से निकलने वाले परिणाम को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: יְזַבֵּחַ
  choice: बलि चढ़ाता है
  rationale: यहाँ पिअल रूप साधारण वध नहीं, बल्कि उपासना में बलि अर्पित करने का अर्थ देता है।
- source_word: לְחֶרְמוֹ
  choice: अपने जाल के लिए
  rationale: संदर्भ में חֵרֶם मछली पकड़ने का जाल है। 'के लिए' उसके जाल को बलि अर्पित करने की असामान्य, मूर्तिपूजक छवि को बनाए रखता है।
- source_word: וִיקַטֵּר
  choice: धूप जलाता है
  rationale: पिअल में קטר धूप अथवा धूम-भेंट चढ़ाने की उपासना-संबंधी क्रिया बताता है; यह हिंदी में सहज और स्पष्ट है।
- source_word: לְמִכְמַרְתּוֹ
  choice: अपने महाजाल के लिए
  rationale: מִכְמֶרֶת एक बड़ा, घेरकर पकड़ने वाला जाल है। 'महाजाल' पहले जाल से भेद बनाए रखते हुए सामान्य पाठक के लिए समझने योग्य है।
- source_word: כִּי בָהֵמָּה
  choice: क्योंकि उन्हीं के द्वारा
  rationale: ב instrumental है और सफलता के साधन के रूप में दोनों जालों की ओर संकेत करता है।
- source_word: שָׁמֵן חֶלְקוֹ
  choice: उसका हिस्सा भरपूर
  rationale: שָׁמֵן का शाब्दिक अर्थ 'मोटा' है, पर यहाँ यह समृद्धि और प्रचुरता का मुहावरा है; 'भरपूर' अर्थ को स्वाभाविक हिंदी में देता है।
- source_word: וּמַאֲכָלוֹ בְּרִיאָה
  choice: उसका भोजन उत्तम
  rationale: בְּרִיאָה मोटा-पुष्ट, समृद्ध या बढ़िया होने का बोध देता है। 'उत्तम' भोजन की गुणवत्ता को व्यक्त करता है और समानांतर पद में प्रचुरता पहले ही 'भरपूर' से प्रकट है।
theological_decisions:
- issue: सैन्य/मछली पकड़ने के साधनों के लिए मूर्तिपूजक उपासना की भाषा
  choice: विजेता को अपने जालों के लिए बलि चढ़ाते और धूप जलाते हुए सीधे रूप में प्रस्तुत किया गया है।
  alternative: इसे वास्तविक उपासना के बजाय केवल अपनी सैन्य शक्ति पर अत्यधिक भरोसे का रूपक माना जा सकता है।
  rationale: इब्रानी में बलि और धूप के स्पष्ट उपासना-संबंधी शब्द हैं। इसलिए पाठ उनकी धार्मिक छवि को बनाए रखता है; अपने साधनों को सफलता का देवतुल्य स्रोत मानने का निहितार्थ उसी छवि से उभरता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सहज रूप रखा गया है। 'जाल' और 'महाजाल' दो अलग इब्रानी जाल-शब्दों का भेद दिखाते हैं। मुख्य पाठ में मुहावरे का स्वाभाविक अर्थ है, जबकि पादटिप्पणी मूल मोटेपन की छवि सुरक्षित रखती है।
