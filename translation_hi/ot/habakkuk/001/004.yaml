source:
  edition: WLC
  text: עַל כֵּן֙ תָּפ֣וּג תּוֹרָ֔ה וְ/לֹֽא יֵצֵ֥א לָ/נֶ֖צַח מִשְׁפָּ֑ט כִּ֤י רָשָׁע֙ מַכְתִּ֣יר אֶת הַ/צַּדִּ֔יק עַל כֵּ֛ן יֵצֵ֥א מִשְׁפָּ֖ט מְעֻקָּֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/004.yaml
  text: Therefore the law grows numb, and justice never goes forth. For the wicked surrounds the righteous; therefore justice goes forth twisted.
translation:
  language: hi
  text: 'इसलिए व्यवस्था निष्प्रभावी हो गई है,

    और न्याय कभी सामने नहीं आता।

    क्योंकि दुष्ट धर्मी को चारों ओर से घेर लेता है;

    इसीलिए न्याय विकृत होकर सामने आता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָּפוּג
  choice: निष्प्रभावी हो गई है
  rationale: मूल क्रिया का अर्थ शिथिल, सुन्न या प्रभावहीन पड़ जाना है; यहाँ व्यवस्था के काम न करने का भाव स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: תּוֹרָה
  choice: व्यवस्था
  rationale: इस संदर्भ में यह परमेश्वर की शिक्षा या विधि को सूचित करती है; हिन्दी बाइबलीय प्रयोग में 'व्यवस्था' परिचित है।
- source_word: יֵצֵא ... מִשְׁפָּט
  choice: न्याय ... सामने आता
  rationale: शाब्दिक 'न्याय निकलता है' के स्थान पर न्यायिक निर्णय के प्रकट या लागू होने का भाव सहज हिन्दी में रखा गया है।
- source_word: מַכְתִּיר
  choice: चारों ओर से घेर लेता है
  rationale: हिब्रू रूप में घेरने या चारों ओर से दबाने का बिंब है, जिसे बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: מְעֻקָּל
  choice: विकृत
  rationale: मूल शब्द मुड़े, टेढ़े या बिगाड़े गए न्याय को दर्शाता है; 'विकृत' न्याय के भ्रष्ट रूप को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: תּוֹרָה का दायरा
  choice: व्यवस्था
  alternative: शिक्षा
  rationale: पद सामाजिक और न्यायिक विफलता का वर्णन करता है, पर शब्द की परमेश्वर-प्रदत्त शिक्षा संबंधी व्यापकता को किसी विशिष्ट मानवीय कानून तक सीमित नहीं किया गया।
- issue: धर्मी और दुष्ट की पहचान
  choice: सामान्य एकवचन संज्ञाएँ रखी गईं
  alternative: किसी विशेष ऐतिहासिक दल या व्यक्ति के रूप में पहचानना
  rationale: मूल पाठ यहाँ उनकी स्पष्ट ऐतिहासिक पहचान नहीं करता; अनुवाद उस खुलापन को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। समानांतर काव्य-पंक्तियाँ और कारण-परिणाम की पुनरावृत्ति सुरक्षित रखी गई है।
