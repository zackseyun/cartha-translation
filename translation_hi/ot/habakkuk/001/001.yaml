lexical_decisions:
- source_word: הַמַּשָּׂא
  choice: भविष्यवाणी
  rationale: यह शब्द भविष्यद्वक्ता के द्वारा दिए गए गंभीर और प्रायः न्याय-संबंधी ईश्वरीय संदेश के शीर्षक के रूप में प्रयुक्त होता है। आधुनिक हिन्दी में ‘भविष्यवाणी’ इसके भविष्यद्वाणी-संबंधी भाव को स्वाभाविक रूप से व्यक्त करती है; ‘बोझ’ अधिक शाब्दिक है, पर यहाँ भ्रामक हो सकता है।
- source_word: אֲשֶׁר
  choice: जिसे
  rationale: सम्बन्धवाचक अव्यय को हिन्दी वाक्य-विन्यास के अनुरूप ‘जिसे’ से व्यक्त किया गया है।
- source_word: חָזָה
  choice: दर्शन में देखा
  rationale: मूल क्रिया का अर्थ ‘देखा’ है और यह भविष्यद्वक्ताओं को मिले प्रकाशन के लिए प्रचलित भाषा है। ‘दर्शन में’ जोड़ने से हिन्दी में आशय स्पष्ट होता है, जबकि ‘देखा’ का मूल रूपक भी बना रहता है।
- source_word: חֲבַקּוּק
  choice: हबक्कूक
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: הַנָּבִיא
  choice: नबी
  rationale: यह हबक्कूक की भविष्यद्वक्ता वाली भूमिका बताता है। ‘नबी’ आधुनिक हिन्दी बाइबलीय भाषा में संक्षिप्त और व्यापक रूप से समझा जाने वाला पद है।
theological_decisions:
- issue: भविष्यद्वाणी के शीर्षक מַשָּׂא का अनुवाद
  choice: भविष्यवाणी
  alternative: बोझ; गंभीर संदेश; ईशवाणी
  rationale: ‘भविष्यवाणी’ इस पद को भविष्यद्वक्ता से मिले प्रकाशन के रूप में रखती है, पर यह नहीं मानती कि संदेश केवल न्याय का ही है। मूल शब्द के ‘बोझ’ वाले शाब्दिक और गंभीर भाव को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: חָזָה में प्रकाशन के माध्यम का निरूपण
  choice: दर्शन में देखा
  alternative: देखा
  rationale: क्रिया को ‘देखा’ के रूप में सुरक्षित रखते हुए ‘दर्शन में’ भविष्यद्वाणी-संबंधी प्रयोग को स्वाभाविक हिन्दी में स्पष्ट करता है; यह दर्शन की प्रकृति के बारे में अतिरिक्त दावा नहीं करता।
translation_notes:
