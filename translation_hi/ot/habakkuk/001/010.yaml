source:
  edition: WLC
  text: וְ/הוּא֙ בַּ/מְּלָכִ֣ים יִתְקַלָּ֔ס וְ/רֹזְנִ֖ים מִשְׂחָ֣ק ל֑/וֹ ה֚וּא לְ/כָל מִבְצָ֣ר יִשְׂחָ֔ק וַ/יִּצְבֹּ֥ר עָפָ֖ר וַֽ/יִּלְכְּדָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/010.yaml
  text: He mocks kings[a], and rulers are a laughingstock to him. He laughs at every fortress; he heaps up earth and captures it.
translation:
  language: hi
  text: 'वह राजाओं का उपहास करता है,

    और शासक उसके लिए हँसी का पात्र हैं।

    वह हर किले पर हँसता है;

    वह मिट्टी का ढेर लगाता है[a] और उसे जीत लेता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ है, “वह मिट्टी/धूल इकट्ठी करता है।” चित्र किलेबंद स्थान को लेने के लिए उसके पास मिट्टी का ढालू टीला या चढ़ाव बनाने का है।
    reason: cultural_note
lexical_decisions:
- source_word: יִתְקַלָּס
  choice: उपहास करता है
  rationale: हित्पएल रूप तिरस्कारपूर्ण उपहास व्यक्त करता है। यह चयन आधुनिक हिन्दी में स्वाभाविक है और समानांतर पंक्ति के भाव से मेल खाता है।
- source_word: רֹזְנִים
  choice: शासक
  rationale: यह शब्द ऊँचे पद वाले अधिकारियों या प्रभुतासंपन्न लोगों को सूचित करता है। ‘शासक’ व्यापक, स्पष्ट और अनावश्यक रूप से प्राचीन शैली से मुक्त है।
- source_word: מִשְׂחָק לוֹ
  choice: उसके लिए हँसी का पात्र हैं
  rationale: संज्ञा हँसी या उपहास की वस्तु होने का भाव देती है। ‘हँसी का पात्र’ तिरस्कार का बल बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: מִבְצָר
  choice: किला
  rationale: यह शब्द किलेबंद स्थान को सूचित करता है। ‘किला’ साधारण आधुनिक हिन्दी में स्पष्ट है और सैन्य संदर्भ बनाए रखता है।
- source_word: יִשְׂחָק
  choice: हँसता है
  rationale: यहाँ שׂחק का काल रूप तिरस्कार से हँसने का भाव रखता है। ‘पर हँसता है’ मूल बिंब को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: וַיִּצְבֹּר עָפָר
  choice: मिट्टी का ढेर लगाता है
  rationale: शाब्दिक बिंब मिट्टी इकट्ठी करने का है, जबकि सैन्य संदर्भ में इससे किले पर चढ़ाई के लिए मिट्टी का घेरा या चढ़ाव बनाना अभिप्रेत है। मुख्य पाठ मूल बिंब को बनाए रखता है और पादटिप्पणी संदर्भ स्पष्ट करती है।
- source_word: וַיִּלְכְּדָהּ
  choice: उसे जीत लेता है
  rationale: क्रिया किसी स्थान को पकड़ लेने या जीत लेने को सूचित करती है। सैन्य संदर्भ में ‘जीत लेता है’ स्वाभाविक है; सर्वनाम पहले आए किले की ओर संकेत करता है।
- source_word: הוּא
  choice: वह
  rationale: सर्वनाम संदर्भ में एकवचन सामूहिक आक्रमणकारी की ओर लौटता है। ‘वह’ इब्रानी की एकवचन प्रस्तुति को सुरक्षित रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर काव्य-पंक्तियों तथा आक्रमणकारी के प्रति एकवचन ‘वह’ को सुरक्षित रखा गया है। पादटिप्पणी का चिह्न ‘मिट्टी का ढेर लगाता है’ के बाद रखा गया है, क्योंकि टिप्पणी उसी वाक्यांश की व्याख्या करती है।
