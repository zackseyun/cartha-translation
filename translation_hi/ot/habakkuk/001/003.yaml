base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/003.yaml
  text: Why do you make me see wrongdoing[a], and why do you look at trouble? Destruction and violence are before me; strife comes to be[c][b], and contention rises up.
translation:
  language: hi
  text: तू मुझे अनर्थ क्यों दिखाता है[a], और कष्ट को क्यों देखता है? विनाश और हिंसा मेरे सामने हैं; झगड़ा उत्पन्न होता है[b], और कलह सिर उठाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू मुझे दुष्टता क्यों दिखाता है, और उपद्रव को क्यों निहारता है?”
    reason: אָוֶן और עָמָל की वैकल्पिक अर्थ-छायाएँ।
  - marker: b
    text: या, “झगड़ा उठ खड़ा होता है, और कलह उठ खड़ी होती है।”
    reason: ויהי और יִשָּׂא की घटनात्मक तथा अधिक शाब्दिक वैकल्पिक अभिव्यक्ति।
lexical_decisions:
- source_word: לָמָה
  choice: क्यों
  rationale: कारण पूछने वाला सीधा प्रश्न; विलाप की तीव्रता और स्वाभाविक हिन्दी दोनों बनाए रखता है।
- source_word: תַרְאֵנִי
  choice: तू मुझे ... दिखाता है
  rationale: ראה के हिफ़ील रूप की कारक शक्ति को व्यक्त करता है; इसे केवल अनुमति के अर्थ में नरम नहीं करता।
- source_word: אָוֶן
  choice: अनर्थ
  rationale: यहाँ नैतिक बुराई और उससे होने वाले अहित दोनों की अर्थ-छाया संभव है; ‘अनर्थ’ संक्षिप्त और गरिमापूर्ण है।
- source_word: וְעָמָל
  choice: कष्ट
  rationale: संदर्भ में श्रम नहीं, बल्कि दुःखदायी उपद्रव और उत्पीड़न अभिप्रेत है।
- source_word: תַּבִּיט
  choice: देखता रहता है
  rationale: नבט के ‘निहारने/देखने’ के अर्थ को व्यक्त करते हुए शिकायत में निहित निष्क्रिय निरीक्षण की अनुभूति को स्वाभाविक हिन्दी में रखता है।
- source_word: שֹׁד
  choice: विनाश
  rationale: हिंसक उजाड़, तबाही या लूट से उत्पन्न विनाश को समेटता है और חָמָס के साथ समानांतरता बनाए रखता है।
- source_word: חָמָס
  choice: हिंसा
  rationale: हिंसक अन्याय के लिए पारदर्शी और स्थापित हिन्दी समतुल्य।
- source_word: לְנֶגְדִּי
  choice: मेरे सामने हैं
  rationale: वक्ता के सामने लगातार उपस्थित दृश्य का सीधा और स्वाभाविक निरूपण।
- source_word: וַיְהִי רִיב
  choice: झगड़ा उठ खड़ा होता है
  rationale: היה की घटनात्मक शक्ति को केवल ‘है’ में समतल न करके झगड़े के उत्पन्न होने को व्यक्त करता है।
- source_word: מָדוֹן יִשָּׂא
  choice: कलह सिर उठाती है
  rationale: יִשָּׂא की ‘उठने’ वाली छवि को मुहावरेदार हिन्दी में सुरक्षित रखता है; רִיב और מָדוֹן के निकटार्थी भेद को ‘झगड़ा/कलह’ से बनाए रखता है।
theological_decisions:
- issue: आरंभिक क्रियाओं में परमेश्वर की प्रत्यक्ष भूमिका या केवल अनुमति का भाव
  choice: 'सीधा संबोधन और कारक बल रखा गया: ‘तू मुझे ... क्यों दिखाता है’'
  alternative: ‘तू मुझे ... क्यों देखने देता है’
  rationale: इब्रानी पाठ की तीखी शिकायत और धार्मिक तनाव को नरम करके व्याख्यात्मक समाधान नहीं दिया गया।
- issue: תַּבִּיט में परमेश्वर के देखने को सहन करने या अनदेखा करने के रूप में समझना
  choice: ‘क्यों देखता रहता है’
  alternative: ‘क्यों सहता है’ या ‘क्यों अनदेखा करता है’
  rationale: मूल क्रिया ‘देखना’ है; अनुवाद ने उससे निकाले जा सकने वाले धर्मवैचारिक निष्कर्ष को पाठ में नहीं जोड़ा।
translation_notes:
  register: आधुनिक मानक हिन्दी में एकवचन प्रत्यक्ष संबोधन ‘तू’ रखा गया है, क्योंकि यह परमेश्वर से निकट और तीखे विलाप का स्वर है; भाषा गरिमापूर्ण पर सामान्य पाठक के लिए स्पष्ट है। समानांतर काव्य-पंक्तियों में ‘अनर्थ/कष्ट’, ‘विनाश/हिंसा’ और ‘झगड़ा/कलह’ के युग्म सुरक्षित रखे गए हैं।
