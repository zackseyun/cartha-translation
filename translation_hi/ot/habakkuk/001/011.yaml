  yaml_path: translation/ot/habakkuk/001/011.yaml
  text: Then he sweeps by like the wind and passes on—he becomes guilty[b][a]; this strength of his is his god.
translation:
  language: hi
  text: तब वह आँधी[a] की तरह आगे बढ़ता और निकल जाता है; फिर वह दोषी हो जाता है। वह अपने इसी बल को अपना देवता मानता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हवा’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ ‘आत्मा’ भी हो सकता है; यहाँ संदर्भ तेज और प्रचंड गति के कारण आँधी का चित्र सुझाता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘वह दोषी हो जाता है और इस बल का श्रेय अपने देवता को देता है,’ अथवा ‘उसका बल उसके देवता का है।’ इब्रानी का अंतिम वाक्यांश बहुत संक्षिप्त है और उसके एक से अधिक अर्थ संभव हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण वर्णन के अगले चरण को सूचित करता है; ‘तब’ सहज और सटीक है।
- source_word: חָלַף רוּחַ
  choice: आँधी की तरह झपटता हुआ
  rationale: רוּחַ का अर्थ ‘हवा’ या ‘आत्मा’ हो सकता है; यहाँ आक्रमणकारी की तीव्र और प्रचंड गति का चित्र प्रमुख है। ‘आँधी की तरह’ उपमा को स्वाभाविक हिंदी में व्यक्त करता है, और ‘झपटता हुआ’ חָלַף की वेगपूर्ण गति को उभारता है।
- source_word: וַיַּעֲבֹר
  choice: आगे निकल जाता है
  rationale: यह उसकी निरंतर, तीव्र बढ़त को व्यक्त करता है और पूर्ववर्ती गति-चित्र को स्वाभाविक हिंदी में आगे बढ़ाता है।
- source_word: וְאָשֵׁם
  choice: दोषी ठहरता है
  rationale: क्रिया अपराधी या दोषी होने का भाव देती है। ‘दोषी ठहरता है’ उसके नैतिक अपराध को स्पष्ट रखता है, बिना अपराध का स्वरूप पाठ में अतिरिक्त रूप से जोड़े।
- source_word: זוּ כֹחוֹ
  choice: अपने इसी बल को
  rationale: זוּ को संकेतवाचक ‘इसी’ और כֹחוֹ को सैन्य सामर्थ्य के अर्थ में ‘बल’ से व्यक्त किया गया है।
- source_word: לֵאלֹהוֹ
  choice: अपना देवता मानता है
  rationale: संक्षिप्त इब्रानी पदबंध का संदर्भानुकूल अर्थ यह लिया गया है कि विजेता अपने ही बल को देवता का स्थान देता है। ‘मानता है’ हिंदी में इस निहित संबंध को स्पष्ट करता है, जबकि वैकल्पिक व्याख्याएँ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: अंतिम पदबंध זוּ כֹחוֹ לֵאלֹהוֹ की व्याख्या
  choice: आक्रमणकारी अपने ही बल को अपना देवता मानता है और इस कारण दोषी ठहरता है।
  alternative: वह दोषी ठहरता है और इस बल का श्रेय अपने देवता को देता है; अथवा उसका बल उसके देवता का है।
  rationale: इब्रानी वाक्य अत्यंत संक्षिप्त है और उसके व्याकरणिक संबंध एक से अधिक प्रकार से समझे जा सकते हैं। तत्काल संदर्भ में साम्राज्यवादी घमंड और अपने सामर्थ्य पर देवतुल्य भरोसा दोष की घोषणा को सबसे अच्छी तरह समझाता है; फिर भी अन्य संभावनाओं को पादटिप्पणी में बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आँधी की तरह झपटता हुआ’ आक्रमणकारी की प्रचंड गति को मूर्त करता है; अंतिम कठिन पदबंध का मुख्य अर्थ पाठ में स्पष्ट किया गया है, पर वास्तविक भाषिक और धर्मवैचारिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
