language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַד אָ֧נָה יְהוָ֛ה שִׁוַּ֖עְתִּי וְ/לֹ֣א תִשְׁמָ֑ע אֶזְעַ֥ק אֵלֶ֛י/ךָ חָמָ֖ס וְ/לֹ֥א תוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/002.yaml
  text: How long, O LORD, have I cried for help and you do not hear? I cry out to you, “Violence!” and you do not save.
translation:
  language: hi
  text: हे यहोवा, मैं कब तक सहायता के लिए पुकारता रहूँ, और तू नहीं सुनेगा? मैं तुझ से “हिंसा!” की पुकार करता हूँ, और तू बचाता नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד־אָנָה
  choice: कब तक
  rationale: यह समय की सीमा पूछने वाली स्वाभाविक और सटीक हिन्दी अभिव्यक्ति है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को सामान्य हिन्दी बाइबलीय रूप में व्यक्त किया गया है।
- source_word: שִׁוַּעְתִּי
  choice: मैं ... सहायता के लिए पुकारता रहूँगा
  rationale: क्रिया सहायता की गुहार लगाने का भाव रखती है; 'कब तक' के साथ हिन्दी में निरंतर चली आ रही पुकार को स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: תִשְׁמָע
  choice: तू नहीं सुनेगा
  rationale: मूल के सीधे द्वितीय पुरुष एकवचन और सुनने की क्रिया को बनाए रखता है; यहाँ उत्तर देने का अर्थ जोड़कर अस्पष्टता नहीं मिटाई गई।
- source_word: חָמָס
  choice: हिंसा
  rationale: अन्यायपूर्ण हिंसा और उत्पीड़न को सूचित करने वाला मूल शब्द सीधे और संक्षेप में व्यक्त होता है।
- source_word: תוֹשִׁיעַ
  choice: तू बचाता नहीं
  rationale: मूल क्रिया के बचाने/छुड़ाने के अर्थ को सरल आधुनिक हिन्दी में रखा गया है।
theological_decisions:
- issue: भविष्यसूचक रूपों का कालगत बल
  choice: पहले खंड में 'पुकारता रहूँगा/नहीं सुनेगा' और दूसरे में 'पुकारता हूँ/बचाता नहीं'
  alternative: मैंने पुकारा है और तू नहीं सुनता
  rationale: हिब्रू अपूर्ण क्रियाएँ जारी या बार-बार होने वाली क्रिया और शिकायत की प्रत्याशित अवधि दोनों का संकेत दे सकती हैं। 'कब तक' के साथ भविष्याभिमुख हिन्दी स्वाभाविक है, जबकि दूसरे वाक्य में वर्तमान निरंतर शिकायत स्पष्ट रहती है।
- issue: परमेश्वर के न सुनने का कथन
  choice: सीधा प्रश्न और आरोप बनाए रखा गया
  alternative: तू मेरी प्रार्थना का उत्तर नहीं देता
  rationale: मूल की विलापपूर्ण धार्मिक तीव्रता तथा 'सुनने' की वास्तविक शब्दावली को नरम या व्याख्यायित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए स्पष्ट हिन्दी। परमेश्वर के लिए एकवचन निकट संबोधन 'तू' रखा गया है, जो हिब्रू व्याकरण और हिन्दी बाइबलीय प्रार्थना-परंपरा के अनुरूप है।
