  text: כִּֽי הִנְ/נִ֤י מֵקִים֙ אֶת הַ/כַּשְׂדִּ֔ים הַ/גּ֖וֹי הַ/מַּ֣ר וְ/הַ/נִּמְהָ֑ר הַֽ/הוֹלֵךְ֙ לְ/מֶרְחֲבֵי אֶ֔רֶץ לָ/רֶ֖שֶׁת מִשְׁכָּנ֥וֹת לֹּא לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/006.yaml
  text: For behold[a], I am raising up the Chaldeans, that bitter and hasty nation[b], which marches through the broad places of the earth to seize dwelling places not its own.
translation:
  language: hi
  text: क्योंकि देखो, मैं कसदियों[a] को उठा रहा हूँ—उस निर्दयी और उतावली जाति को, जो पृथ्वी के विस्तृत प्रदेशों में आगे बढ़ती है, ताकि उन निवास-स्थानों को अपने अधिकार में कर ले जो उसके अपने नहीं हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात बेबीलोनियों को। हिब्रू में जातिनाम “कसदी” है; यहाँ इसका संबंध नव-बेबीलोनी साम्राज्य की शक्ति से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में कही गई बात का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: ध्यान आकर्षित करने वाले और वक्ता पर बल देने वाले हिब्रू प्रयोग को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: מֵקִים
  choice: खड़ा कर रहा हूँ
  rationale: हिफ़ील रूप किसी शक्ति को उठाने, उभारने या कार्य के लिए खड़ा करने का भाव देता है और परमेश्वर की सक्रिय भूमिका बनाए रखता है।
- source_word: הַכַּשְׂדִּים
  choice: कसदियों
  rationale: मूल जातिनाम का सीधा लिप्यंतरण है; ऐतिहासिक संदर्भ में ये नव-बेबीलोनी शक्ति से जुड़े लोग हैं।
- source_word: הַגּוֹי הַמַּר וְהַנִּמְהָר
  choice: उस कड़वी और उतावली जाति को
  rationale: ‘कड़वी’ मूल विशेषण की तीखी और कठोर छवि बनाए रखता है; ‘उतावली’ गति के साथ आवेगशीलता भी व्यक्त करती है।
- source_word: הַהוֹלֵךְ לְמֶרְחֲבֵי אֶרֶץ
  choice: जो पृथ्वी के विस्तृत प्रदेशों में आगे बढ़ती है
  rationale: शाब्दिक ‘चलती/जाती है’ को सैन्य संदर्भ में बिना अनावश्यक तीव्रता जोड़े स्वाभाविक रूप से व्यक्त करता है।
- source_word: לָרֶשֶׁת
  choice: अधिकार कर ले
  rationale: यरश का अर्थ यहाँ विजय द्वारा कब्ज़ा या अधिकार करना है; यह केवल वैध उत्तराधिकार का संकेत नहीं देता।
- source_word: מִשְׁכָּנוֹת לֹא לוֹ
  choice: उन निवास-स्थानों ... जो उसके अपने नहीं हैं
  rationale: सामूहिक एकवचन ‘जाति’ के अनुरूप स्वामित्व की अवैधता स्पष्ट करता है।
theological_decisions:
- issue: बेबीलोनी/कसदी शक्ति के उदय में परमेश्वर की भूमिका
  choice: मैं कसदियों को खड़ा कर रहा हूँ
  alternative: मैं कसदियों को उकसा रहा हूँ
  rationale: हिब्रू पाठ इस शक्ति के उठने को सीधे परमेश्वर की क्रिया बताता है। मुख्य अनुवाद इस तनावपूर्ण कथन को नरम किए बिना रखता है, पर क्रिया के ढंग को आवश्यकता से अधिक निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। भविष्यद्वाणी की तीखी छवि बनाए रखने के लिए ‘कड़वी’ रखा गया है, जबकि ‘विस्तृत प्रदेशों’ और ‘अधिकार कर ले’ से हिब्रू का अर्थ स्वाभाविक हिन्दी में व्यक्त होता है।
