  yaml_path: translation/ot/habakkuk/001/017.yaml
  text: Will he therefore keep emptying his net and continually slaughtering nations without mercy?[a][b]
translation:
  language: hi
  text: तो क्या वह अपना जाल[b] खाली करता रहेगा और लगातार राष्ट्रों को निर्दयता से मारता रहेगा?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और किसी को न बख्शते हुए।” इब्रानी क्रिया का अधिक शाब्दिक अर्थ “बख्शना” या “दया करना” है।
    reason: lexical_alternative
  - marker: b
    text: या, “खींचने वाला जाल।” इब्रानी संज्ञा मछली पकड़ने के एक प्रकार के जाल को दर्शाती है; मुख्य पाठ में पूरे रूपक के भीतर सहज हिंदी के लिए केवल “जाल” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַל כֵּן
  choice: तो क्या वह इसी तरह
  rationale: प्रश्नवाचक הֲ और परिणामसूचक עַל־כֵּן मिलकर पिछले कथन से निकलने वाला आलंकारिक प्रश्न बनाते हैं। हिंदी में ‘तो क्या’ उस संबंध और प्रश्न-बल को स्वाभाविक रूप से व्यक्त करता है; ‘इसी तरह’ संदर्भ में वर्णित निरंतर आचरण की ओर संकेत करता है।
- source_word: יָרִיק
  choice: खाली करता रहेगा
  rationale: हिफ़ील रूप का अर्थ ‘खाली करना’ है। मछली पकड़ने के जाल के संदर्भ में यह स्वाभाविक है, और ‘करता रहेगा’ अपूर्ण क्रिया के जारी या बार-बार होने वाले भाव को प्रकट करता है।
- source_word: חֶרְמוֹ
  choice: अपना जाल
  rationale: संदर्भ में मछली पकड़ने का रूपक स्पष्ट है। ‘जाल’ आधुनिक हिंदी में सहज और पर्याप्त व्यापक है; अधिक विशिष्ट ‘खींचने वाला बड़ा जाल’ को पादटिप्पणी में रखा गया है।
- source_word: וְתָמִיד
  choice: और ... लगातार
  rationale: תָמִיד निरंतरता और बार-बार होते रहने का भाव देता है। ‘लगातार’ सहज हिंदी में इसी बल को बनाए रखता है।
- source_word: לַהֲרֹג
  choice: वध करता रहेगा
  rationale: यहाँ क्रिया साम्राज्यवादी हिंसा में अनेक राष्ट्रों को मार डालने के लिए है। ‘वध’ सामूहिक और क्रूर हत्या का गंभीर भाव देता है, और ‘करता रहेगा’ जारी क्रिया को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: גּוֹיִם
  choice: राष्ट्रों
  rationale: यह शब्द यहाँ विजित राजनीतिक और जातीय समुदायों के लिए है। ‘राष्ट्रों’ संदर्भ के अनुकूल है और ‘गैर-यहूदियों’ जैसा अनुपयुक्त धार्मिक अर्थ नहीं जोड़ता।
- source_word: לֹא יַחְמֹל
  choice: निर्दयता से
  rationale: חמל का अर्थ ‘दया करना’ या ‘बख्श देना’ है। नकार के साथ ‘निर्दयता से’ हिंदी में हिंसा के दयारहित ढंग को सहज रूप से व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
