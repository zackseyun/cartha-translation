base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/008.yaml
  text: His horses are swifter than leopards and fiercer than wolves at dusk[a]. His horsemen spread out; his horsemen come from far away. They fly like an eagle hurrying to devour.
translation:
  language: hi
  text: उसके घोड़े तेंदुओं से भी तेज़ हैं और साँझ के भेड़ियों से भी अधिक खूंखार। उसके घुड़सवार दूर-दूर तक फैल जाते हैं; उसके घुड़सवार दूर से आते हैं। वे उकाब[a] की तरह उड़ते हैं, जो भक्षण करने के लिए झपटता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गिद्ध।” इब्रानी शब्द נֶשֶׁר किसी बड़े शिकारी या मृतभक्षी पक्षी के लिए प्रयुक्त हो सकता है; यह आवश्यक नहीं कि उससे आधुनिक प्राणी-वर्गीकरण में उकाब ही अभिप्रेत हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלּוּ מִנְּמֵרִים
  choice: तेंदुओं से भी तेज़
  rationale: קלל यहाँ गति में तीव्र होने का भाव देता है; तुलनात्मक מִן को ‘से भी’ से स्वाभाविक और स्पष्ट रूप में व्यक्त किया गया है। נמר के लिए आधुनिक हिन्दी में ‘तेंदुआ’ सर्वाधिक परिचित शब्द है।
- source_word: וְחַדּוּ מִזְּאֵבֵי עֶרֶב
  choice: साँझ के भेड़ियों से भी अधिक खूंखार
  rationale: חדד का मूल बिंब ‘तीखा’ है, पर शिकारी पशुओं के संदर्भ में यह उग्रता या हिंस्रता बताता है। ‘खूंखार’ उस संदर्भगत बल को सहज हिन्दी में व्यक्त करता है; ‘साँझ के भेड़िए’ मूल के समय-संबंधी बिंब को बनाए रखता है।
- source_word: וּפָשׁוּ פָּרָשָׁיו
  choice: उसके घुड़सवार दूर-दूर तक फैल जाते हैं
  rationale: פוש का आशय व्यापक रूप से फैलने या चारों ओर बढ़ने से है। ‘दूर-दूर तक फैल जाते हैं’ घुड़सवार सेना की व्यापक तैनाती का बिंब देता है, बिना किसी अधिक विशिष्ट युद्ध-कौशल को आरोपित किए।
- source_word: וּפָרָשָׁיו מֵרָחוֹק יָבֹאוּ
  choice: उसके घुड़सवार दूर देश से आते हैं
  rationale: मूल में ‘दूर से’ है। ‘दूर देश से’ हिन्दी में स्वाभाविक है और आक्रमणकारी सेना के दूरस्थ उद्गम को स्पष्ट करता है। संज्ञा की पुनरावृत्ति मूल के समान रखी गई है।
- source_word: יָעֻפוּ כְּנֶשֶׁר
  choice: वे उस उकाब के समान उड़ते हैं
  rationale: עוף का सीधा अर्थ ‘उड़ना’ है। נשר किसी बड़े शिकारी या मुर्दाखोर पक्षी को सूचित कर सकता है; मुख्य पाठ में प्रचलित बाइबलीय हिन्दी ‘उकाब’ रखा गया है और प्राणीगत अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: חָשׁ לֶאֱכוֹל
  choice: जो निगलने के लिए झपटता है
  rationale: חשׁ शीघ्रता से बढ़ने का भाव देता है और אכל शिकार के संदर्भ में खाने/भक्षण करने को। ‘झपटता है’ गति और शिकारी मुद्रा दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; ‘निगलने’ से हिंसक भक्षण का बल बना रहता है।
