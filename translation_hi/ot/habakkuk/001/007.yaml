  text: אָיֹ֥ם וְ/נוֹרָ֖א ה֑וּא מִמֶּ֕/נּוּ מִשְׁפָּט֥/וֹ וּ/שְׂאֵת֖/וֹ יֵצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/007.yaml
  text: It is dreadful and fearsome; its justice and authority[a] come from itself.
translation:
  language: hi
  text: वह भयानक और डरावना है; उसका न्याय और अधिकार[a] उसी से निकलते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका निर्णय और गौरव उसी से निकलते हैं।”
    reason: מִשְׁפָּט का अर्थ ‘निर्णय’ और שְׂאֵת का अर्थ ‘गौरव’ भी हो सकता है; यह विकल्प मूल की जीवित शब्दार्थगत अस्पष्टता को सुरक्षित रखता है।
lexical_decisions:
- source_word: אָיֹם
  choice: भयानक
  rationale: यह शब्द भय और आतंक जगानेवाले स्वभाव को व्यक्त करता है; कसदियों के धमकीपूर्ण वर्णन में ‘भयानक’ स्वाभाविक और सटीक है।
- source_word: וְנוֹרָא
  choice: और डरावना
  rationale: यह אָיֹם के साथ मिलकर भयावहता को प्रबल करता है और उसके विशेषणात्मक रूप को सहज हिन्दी में बनाए रखता है।
- source_word: הוּא
  choice: वह ... है
  rationale: इब्रानी में पुल्लिंग एकवचन है और संकेत पहले वर्णित सामूहिक जाति की ओर है; हिन्दी में ‘वह’ इस सामूहिक एकवचन प्रस्तुति को सुरक्षित रखता है।
- source_word: מִמֶּנּוּ
  choice: उसी से
  rationale: पूर्वसर्ग स्रोत या उद्गम बताता है; ‘उसी से’ इस बात पर बल देता है कि उसके मानदंड किसी ऊँचे बाहरी प्राधिकार से नहीं, स्वयं उसी से निकलते हैं।
- source_word: מִשְׁפָּטוֹ
  choice: उसका न्याय
  rationale: מִשְׁפָּט में न्याय, निर्णय और न्यायिक व्यवस्था के अर्थ संभव हैं। यहाँ ‘न्याय’ संक्षिप्त है और उसके स्वयं गढ़े न्यायिक-राजनीतिक मानदंड को व्यक्त करता है।
- source_word: וּשְׂאֵתוֹ
  choice: और अधिकार
  rationale: इस संदर्भ में शब्द ऊँचे पद, प्रतिष्ठा या प्रभुत्व का बोध करा सकता है। ‘अधिकार’ न्याय के समानांतर उसकी स्वयं स्थापित शासकीय सत्ता को स्पष्ट करता है; ‘गौरव’ एक वास्तविक वैकल्पिक अर्थ है।
- source_word: יֵצֵא
  choice: निकलते हैं
  rationale: क्रिया उद्गम को व्यक्त करती है। इब्रानी में क्रिया एकवचन है, पर हिन्दी में संयुक्त कर्ता ‘न्याय और अधिकार’ के साथ बहुवचन ‘निकलते हैं’ स्वाभाविक है।
theological_decisions: []
