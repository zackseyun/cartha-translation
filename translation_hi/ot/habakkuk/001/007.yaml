  register: आधुनिक मानक हिन्दी; भाषा संक्षिप्त, गंभीर और साधारण पाठक के लिए सुबोध रखी गई है। ‘वह’ सामूहिक जाति को एक इकाई के रूप में प्रस्तुत करता है।
