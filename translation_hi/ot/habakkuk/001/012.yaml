reference: Habakkuk 1:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/ל֧וֹא אַתָּ֣ה מִ/קֶּ֗דֶם יְהוָ֧ה אֱלֹהַ֛/י קְדֹשִׁ֖/י לֹ֣א נָמ֑וּת יְהוָה֙ לְ/מִשְׁפָּ֣ט שַׂמְתּ֔/וֹ וְ/צ֖וּר לְ/הוֹכִ֥יחַ יְסַדְתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/012.yaml
  text: Are you not from of old, O Yahweh my God, my Holy One? We will not die.[a] O Yahweh, you have appointed him for judgment, and you, O Rock, have established him for reproof.
translation:
  language: hi
  text: हे याहवे, मेरे परमेश्वर, मेरे पवित्र परमेश्वर, क्या आप आदिकाल से नहीं हैं? हम नहीं मरेंगे।[a] हे याहवे, आपने उसे न्याय के लिए ठहराया है; और हे चट्टान, आपने उसे ताड़ना देने के लिए स्थापित किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, कुछ परंपराओं में सुरक्षित वैकल्पिक पाठ के अनुसार: “आप नहीं मरते।” इब्रानी मसोरेटिक पाठ में है: “हम नहीं मरेंगे।”'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹוא
  choice: क्या ... नहीं हैं?
  rationale: यह अलंकारिक प्रश्न सकारात्मक उत्तर की अपेक्षा करता है; प्रश्नवाचक रूप नबी की विनती और विश्वास दोनों को बनाए रखता है।
- source_word: מִקֶּדֶם
  choice: प्राचीनकाल से
  rationale: यह अभिव्यक्ति अत्यंत प्राचीन समय से अस्तित्व को दर्शाती है और बिना अनावश्यक रूप से अर्थ को ‘अनंतकाल से’ तक विस्तृत किए कालगत गहराई बनाए रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: दिव्य नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके निकट लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: אֱלֹהַי
  choice: मेरे परमेश्वर
  rationale: प्रथम पुरुष एकवचन संबंधसूचक रूप को स्वाभाविक और सीधी हिन्दी में रखा गया है।
- source_word: קְדֹשִׁי
  choice: मेरे पवित्र परमेश्वर
  rationale: मूल में विशेषण संज्ञा की तरह प्रयुक्त है। केवल ‘मेरे पवित्र’ हिन्दी में अस्वाभाविक और अस्पष्ट होता; ‘परमेश्वर’ की पूर्ति संबोधन का आशय स्पष्ट रखते हुए स्वाभाविक हिन्दी देती है।
- source_word: לֹא נָמוּת
  choice: हम नहीं मरेंगे
  rationale: मसोरेटिक स्वरांकन और क्रियारूप प्रथम पुरुष बहुवचन का समर्थन करते हैं; इस कठिन किन्तु स्पष्ट पाठ को मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: לְמִשְׁפָּט
  choice: न्याय के लिए
  rationale: यहाँ शब्द दैवी न्याय के साधन के रूप में नियुक्त किए जाने का उद्देश्य बताता है।
- source_word: שַׂמְתּוֹ
  choice: आपने उसे ... ठहराया है
  rationale: संदर्भ में שׂים केवल रखने नहीं, बल्कि किसी निश्चित उद्देश्य के लिए नियुक्त करने का भाव देता है।
- source_word: צוּר
  choice: चट्टान
  rationale: परमेश्वर के लिए प्रयुक्त यह उपाधि दृढ़ता और स्थिरता को व्यक्त करती है; इसे प्रत्यक्ष संबोधन के रूप में रखा गया है।
- source_word: לְהוֹכִיחַ
  choice: ताड़ना देने के लिए
  rationale: यह चयन न्यायिक भर्त्सना और अनुशासन, दोनों की छाया बनाए रखता है और अर्थ को केवल दंड तक सीमित नहीं करता।
- source_word: יְסַדְתּוֹ
  choice: आपने उसे ... स्थापित किया है
  rationale: יסד दृढ़ता से स्थापित करने का भाव देता है; यहाँ दैवी उद्देश्य के लिए साधन को दृढ़तापूर्वक नियत करना अभिप्रेत है।
theological_decisions:
- issue: לֹא נָמוּת का कर्ता और अर्थ
  choice: हम नहीं मरेंगे
  alternative: आप नहीं मरते
  rationale: मसोरेटिक पाठ का स्वरांकन और रूपविज्ञान प्रथम पुरुष बहुवचन का समर्थन करते हैं। इससे न्याय के बीच समुदाय के पूर्ण विनाश से बचने की नबी की आशा व्यक्त होती है। कुछ परंपराओं में सुरक्षित वैकल्पिक पाठ को पादटिप्पणी में रखा गया है, जिससे वास्तविक पाठगत और धर्मवैचारिक तनाव बना रहे।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर प्रत्यक्ष दैवी संबोधनों में गरिमापूर्ण शैली रखी गई है। ‘याहवे’ व्यक्तिगत दिव्य नाम का लिप्यंतरण है। ‘मेरे पवित्र परमेश्वर’ शाब्दिक संरचना की तुलना में हिन्दी में अधिक स्वाभाविक है, जबकि मूल की उपाधिपरक शक्ति बनाए रखता है।
