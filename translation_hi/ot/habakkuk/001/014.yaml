base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/014.yaml
  text: You make man like the fish of the sea[a], like creeping things that have no ruler over them.
translation:
  language: hi
  text: तू मनुष्य[a] को समुद्र की मछलियों के समान, उन रेंगनेवाले जीवों के समान बना देता है, जिन पर कोई शासन करनेवाला नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मानवजाति।” हिब्रू शब्द אָדָם एकवचन (“मनुष्य”) है, पर यहाँ वह सामूहिक रूप में मानवता का प्रतिनिधित्व कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲשֶׂה
  choice: तू ... बना देता है
  rationale: עשה का वाव-युक्त अपूर्ण रूप यहाँ परमेश्वर से सीधे संबोधन में शिकायत की वर्तमान स्थिति व्यक्त करता है। ‘बना देता है’ स्वाभाविक हिन्दी में इस आरोपात्मक कथन को बनाए रखता है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यह शब्द व्याकरण की दृष्टि से एकवचन है, पर यहाँ समष्टिगत रूप से मानवजाति का प्रतिनिधित्व करता है। ‘मनुष्य’ हिन्दी में एकवचन रूप और व्यापक मानवीय अर्थ दोनों रखता है।
- source_word: כִּדְגֵי הַיָּם
  choice: समुद्र की मछलियों के समान
  rationale: यह तुलना हिब्रू संबंध-रचना और काव्यात्मक स्वर को स्पष्ट तथा स्वाभाविक हिन्दी में सुरक्षित रखती है।
- source_word: כְּרֶמֶשׂ
  choice: रेंगनेवाले जीवों के समान
  rationale: רֶמֶשׂ छोटे रेंगने या सरकनेवाले प्राणियों के लिए व्यापक संज्ञा है। ‘जीव’ जोड़ने से आधुनिक हिन्दी में अर्थ साफ रहता है, बिना प्राणी-वर्ग को अनावश्यक रूप से सीमित किए।
- source_word: לֹא מֹשֵׁל בּוֹ
  choice: जिन पर कोई शासन करनेवाला नहीं है
  rationale: מֹשֵׁל का कृदन्तीय अर्थ ‘शासन करनेवाला’ है। בּוֹ एकवचन है, किंतु पूर्ववर्ती सामूहिक चित्र के कारण हिन्दी में बहुवचन-संबंधी ‘जिन पर’ स्वाभाविक है।
theological_decisions:
- issue: אָדָם का समष्टिगत मानवीय अर्थ
  choice: मनुष्य
  alternative: मानवजाति
  rationale: ‘मनुष्य’ स्रोत के व्याकरणिक एकवचन को बनाए रखते हुए संदर्भ में पूरी मानवता का प्रतिनिधि अर्थ दे सकता है। ‘मानवजाति’ समष्टिगत अर्थ को स्पष्ट करती, पर मूल का एकवचन रूप खो देती।
- issue: परमेश्वर की भूमिका व्यक्त करने वाले וַתַּעֲשֶׂה का काल-पक्ष
  choice: बना देता है
  alternative: बना दिया है
  rationale: भविष्यद्वक्ता की शिकायत में यह रूप वर्तमान दशा के वर्णन या बार-बार घटित होने की अनुभूति दे सकता है। पूर्ण भूतकाल चुनने से मूल में निहित काल-पक्ष की खुली गुंजाइश संकुचित हो जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज काव्यात्मक गद्य। परमेश्वर से सीधे संबोधन के कारण ‘तू’ रखा गया है। ‘शासन करनेवाला’ मूल कृदन्त की क्रियात्मक-व्यक्तिवाचक शक्ति को सुरक्षित रखता है।
