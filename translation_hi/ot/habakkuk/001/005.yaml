source:
  edition: WLC
  text: רְא֤וּ בַ/גּוֹיִם֙ וְֽ/הַבִּ֔יטוּ וְ/הִֽתַּמְּה֖וּ תְּמָ֑הוּ כִּי פֹ֨עַל֙ פֹּעֵ֣ל בִּֽ/ימֵי/כֶ֔ם לֹ֥א תַאֲמִ֖ינוּ כִּ֥י יְסֻפָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/005.yaml
  text: Look among the nations and see[a]; be astonished, be astounded[b]. For I am doing a work in your days that you would not believe if it were told.
translation:
  language: hi
  text: जातियों के बीच देखो और ध्यान दो[a]; चकित हो जाओ, पूरी तरह विस्मित हो जाओ। क्योंकि मैं तुम्हारे दिनों में एक ऐसा कार्य कर रहा हूँ, जिसका यदि वर्णन किया जाए, तो तुम विश्वास नहीं करोगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जातियों को देखो और ध्यान दो।” इब्रानी पूर्वसर्ग का अर्थ “जातियों के बीच” अथवा “जातियों को” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “क्योंकि तुम्हारे दिनों में एक कार्य किया जा रहा है; यदि उसका वर्णन किया जाए, तो तुम विश्वास नहीं करोगे।” इब्रानी में इस खंड का कर्ता स्पष्ट रूप से व्यक्त नहीं है; अंतिम खंड का अनुवाद “जब उसका वर्णन किया जाएगा” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: רְאוּ בַגּוֹיִם וְהַבִּיטוּ
  choice: जातियों के बीच देखो और ध्यान दो
  rationale: बहुवचन आज्ञार्थक क्रियाओं और בַגּוֹיִם के स्थानगत अर्थ को स्वाभाविक हिन्दी में रखा गया है। 'जातियाँ' राजनीतिक/राष्ट्रीय समूहों को दर्शाता है; 'अन्यजाति' धार्मिक-जातीय भेद को अनावश्यक रूप से प्रमुख करता। הביט की अधिक एकाग्र दृष्टि को 'ध्यान दो' व्यक्त करता है।
- source_word: וְהִתַּמְּהוּ תְּמָהוּ
  choice: चकित हो जाओ, पूरी तरह विस्मित हो जाओ
  rationale: एक ही धातु के दो रूपों की पुनरुक्ति तीव्रता प्रकट करती है। हिन्दी में संबंधित दो पदों और 'पूरी तरह' से जोर बनाए रखते हुए अस्वाभाविक शब्दशः पुनरावृत्ति से बचा गया है।
- source_word: פֹעַל פֹּעֵל
  choice: मैं ... एक ऐसा काम कर रहा हूँ
  rationale: संज्ञा और कृदन्त की बलात्मक रचना को सहज हिन्दी में व्यक्त किया गया है। वक्ता का प्रथम पुरुष संदर्भ से निहित है, जबकि 'ऐसा' आगे आने वाले परिणामवाचक उपवाक्य से स्वाभाविक संबंध बनाता है।
- source_word: בִּימֵיכֶם
  choice: तुम्हारे दिनों में
  rationale: मूल काल-सूचक मुहावरे और संबोधित लोगों के अपने समय में घटना की निकटता को सुरक्षित रखता है।
- source_word: לֹא תַאֲמִינוּ כִּי יְסֻפָּר
  choice: जिसके बारे में यदि तुम्हें बताया जाए, तो तुम विश्वास नहीं करोगे
  rationale: अपूर्ण क्रिया और כִּי सहित कर्मवाच्य रूप को शर्तवाचक अर्थ में स्वाभाविक हिन्दी दी गई है। मूल में बताने वाला अनिर्दिष्ट है, इसलिए कर्मवाच्य रखा गया है।
theological_decisions:
- issue: פֹעַל פֹּעֵל में कर्ता स्पष्ट रूप से लिखा नहीं है
  choice: मैं ... काम कर रहा हूँ
  alternative: एक काम किया जा रहा है
  rationale: निकटवर्ती भविष्यवाणी-संदर्भ में वक्ता यहोवा है, इसलिए प्रथम पुरुष पाठ के संवाद-संदर्भ को स्पष्ट करता है। फिर भी हिब्रू की व्याकरणिक अनिर्दिष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: आश्चर्य की दोहरी आज्ञा
  choice: चकित हो जाओ, पूरी तरह विस्मित हो जाओ
  alternative: चकित हो जाओ, चकित हो जाओ
  rationale: दोनों आज्ञार्थक रूप और उनका तीव्र बल सुरक्षित हैं, पर हिन्दी में केवल यांत्रिक पुनरावृत्ति नहीं की गई।
- issue: अविश्वास वाले अंतिम कथन का काल और संबंध
  choice: यदि ... बताया जाए, तो तुम विश्वास नहीं करोगे
  alternative: जब इसका वर्णन किया जाएगा, तब तुम विश्वास नहीं करोगे
  rationale: संदर्भ में बात की अविश्वसनीयता प्रमुख है; शर्तवाचक हिन्दी इस अर्थ को स्पष्ट करती है, जबकि वैकल्पिक काल-संबंध पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रत्यक्ष भविष्यद्वाणी-संबंधी स्वर रखा गया है। बहुवचन संबोधन के लिए 'तुम' प्रयोग हुआ है। वाक्य मूल की आज्ञाओं, तीव्र आश्चर्य और आने वाले काम की अविश्वसनीयता को साधारण पाठक के लिए स्पष्ट रखता है।
