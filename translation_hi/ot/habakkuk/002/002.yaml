lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में निकट लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: וַיַּעֲנֵנִי
  choice: मुझे उत्तर दिया
  rationale: ענה का प्रसंगानुकूल सीधा अर्थ ‘उत्तर देना’ है और प्रथम पुरुष प्रत्यय ‘मुझे’ में सुरक्षित है।
- source_word: וַיֹּאמֶר
  choice: और कहा
  rationale: इब्रानी कथात्मक क्रम को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כְּתוֹב חָזוֹן
  choice: इस दर्शन को लिख
  rationale: כתב के आदेशात्मक बल और חזון के विशिष्ट भविष्यदर्शी संदेश को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּבָאֵר
  choice: साफ़-साफ़ अंकित कर
  rationale: पिएल रूप यहाँ लिखी हुई बात को स्पष्ट और आसानी से पढ़े जाने योग्य बनाने का भाव देता है; ‘अंकित कर’ पटियाओं पर लेखन के प्रसंग के अनुकूल है।
- source_word: עַל הַלֻּחוֹת
  choice: पटियाओं पर
  rationale: לֻחוֹת लेखन की पटियाओं को दर्शाता है; उनकी सामग्री पत्थर थी, यह जोड़कर मूल से अधिक विशिष्ट नहीं किया गया।
- source_word: לְמַעַן
  choice: ताकि
  rationale: उद्देश्य अथवा परिणाम का स्वाभाविक आधुनिक हिन्दी सूचक है।
- source_word: יָרוּץ
  choice: दौड़े
  rationale: רץ के मूल और सजीव अर्थ ‘दौड़ना’ को सुरक्षित रखता है।
- source_word: קוֹרֵא בוֹ
  choice: इसे पढ़नेवाला
  rationale: संज्ञात्मक कृदंत और בּוֹ को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: उद्देश्य-वाक्यांश לְמַעַן יָרוּץ קוֹרֵא בוֹ की व्याख्या
  choice: ताकि इसे पढ़नेवाला दौड़े
  alternative: ताकि इसे पढ़नेवाला इसे लेकर दौड़े; अथवा ताकि कोई इसे दौड़ते-दौड़ते/शीघ्रता से पढ़ सके
  rationale: इब्रानी वाक्यांश संक्षिप्त और वास्तविक रूप से बहुअर्थी है। मुख्य पाठ में ‘पढ़नेवाला’ को ‘दौड़े’ का कर्ता मानने वाला सबसे सीधा व्याकरणिक पाठ रखा गया है; मूल में निहित न होने वाला कर्म ‘इसे लेकर’ नहीं जोड़ा गया। अन्य संभावनाएँ पाद-टिप्पणी में सुरक्षित हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। एकवचन आदेशों में ‘लिख’ और ‘अंकित कर’ मूल के सीधे संबोधन को बनाए रखते हैं। ‘साफ़-साफ़’ पठनीय स्पष्टता को सहज हिन्दी में व्यक्त करता है, जबकि पाद-टिप्पणी अंतिम उपवाक्य की वास्तविक अस्पष्टता सुरक्षित रखती है।
