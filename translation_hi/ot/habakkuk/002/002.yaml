  text: 'Then Yahweh answered me and said: “Write the vision; make it plain on tablets[a], so that one who reads it may run.”'
translation:
  language: hi
  text: तब याहवे ने मुझे उत्तर दिया और कहा, “इस दर्शन को लिख और पटियाओं पर साफ़-साफ़ अंकित कर[a], ताकि इसे पढ़नेवाला दौड़े।”
