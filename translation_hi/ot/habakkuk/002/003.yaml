source:
  edition: WLC
  text: כִּ֣י ע֤וֹד חָזוֹן֙ לַ/מּוֹעֵ֔ד וְ/יָפֵ֥חַ לַ/קֵּ֖ץ וְ/לֹ֣א יְכַזֵּ֑ב אִם יִתְמַהְמָהּ֙ חַכֵּה ל֔/וֹ כִּֽי בֹ֥א יָבֹ֖א לֹ֥א יְאַחֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/003.yaml
  text: For the vision is still for the appointed time[a]; it hastens toward the end and will not lie. If it delays, wait for it, for it will surely come[b]; it will not be late.
translation:
  language: hi
  text: क्योंकि इस दर्शन की पूर्ति का एक नियत समय है; यह अंत की ओर तेजी से बढ़ रहा है[a] और झूठा सिद्ध नहीं होगा। यदि यह देर करे, तो इसकी प्रतीक्षा करो[b], क्योंकि यह निश्चय ही आएगा; यह देर नहीं करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘यह अंत की ओर हाँफ रहा है’ अथवा ‘यह अंत के विषय में बोलता है।’ यहाँ की हिब्रू क्रिया कठिन है; मुख्य पाठ उस भाव को व्यक्त करता है कि दर्शन अपनी नियत पूर्ति की ओर तत्परता से बढ़ रहा है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘यदि वह देर करे, तो उसकी प्रतीक्षा करो।’ हिब्रू सर्वनाम का अनुवाद व्यक्तिगत रूप में किया जा सकता है, यद्यपि इस प्रसंग में उसका सबसे स्वाभाविक संदर्भ ‘दर्शन’ है। इब्रानियों 10:37 में इस पंक्ति का व्यक्तिगत रूप से प्रयोग किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: חָזוֹן
  choice: दर्शन
  rationale: भविष्यद्वक्ता को मिले प्रकाशन के लिए यह मानक और प्रसंगानुकूल हिन्दी शब्द है; इसी दर्शन को लिखने और उसकी पूर्ति की प्रतीक्षा करने की बात हो रही है।
- source_word: לַמּוֹעֵד
  choice: ठहराए हुए समय के लिए
  rationale: מוֹעֵד किसी निश्चित या नियुक्त समय को दर्शाता है। यह अभिव्यक्ति उस समय की पूर्व-निश्चितता को स्पष्ट रखती है।
- source_word: וְיָפֵחַ
  choice: तेजी से बढ़ रहा है
  rationale: यह कठिन क्रिया साँस लेने, हाँफने अथवा आगे बढ़ने का भाव दे सकती है। मुख्य पाठ में दर्शन के अपनी पूर्ति की ओर तत्परता से बढ़ने का अर्थ स्वाभाविक हिन्दी में दिया गया है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: לַקֵּץ
  choice: अंत की ओर
  rationale: קֵץ यहाँ पूर्ति अथवा समाप्ति के निश्चित बिंदु को सूचित करता है और गति-सूचक क्रिया के साथ ‘अंत की ओर’ स्वाभाविक है।
- source_word: וְלֹא יְכַזֵּב
  choice: और झूठा सिद्ध नहीं होगा
  rationale: क्रिया का मूल भाव झूठ बोलना अथवा मिथ्या सिद्ध होना है। हिन्दी में यह रूप दर्शन के मानवीकरण को रखते हुए उसके अविश्वसनीय न ठहरने का अर्थ स्पष्ट करता है।
- source_word: אִם יִתְמַהְמָהּ
  choice: यदि यह देर करे
  rationale: क्रिया ठहरने या विलंब करने को व्यक्त करती है। संक्षिप्त अनुवाद मूल की शर्त और प्रतीत होने वाले विलंब को बनाए रखता है।
- source_word: חַכֵּה לוֹ
  choice: तो इसकी प्रतीक्षा करना
  rationale: पुल्लिंग एकवचन प्रत्यय का निकटतम पूर्वपद חָזוֹן है, जो हिब्रू में भी पुल्लिंग है; इसलिए प्रसंग में दर्शन का निर्देश प्राथमिक है। व्यक्तिगत अर्थ की संभावना पादटिप्पणी में रखी गई है।
- source_word: כִּי בֹא יָבֹא
  choice: क्योंकि यह निश्चय ही आएगा
  rationale: धातु के पूर्ण क्रियारूप के साथ infinitive absolute निश्चितता पर बल देता है; ‘निश्चय ही’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא יְאַחֵר
  choice: यह देर नहीं करेगा
  rationale: यह आगमन के नियत समय से विलंबित न होने को व्यक्त करता है। पहले कथन के साथ मौजूद वास्तविक तनाव को मूल के समान बनाए रखा गया है।
theological_decisions:
- issue: पद के उत्तरार्ध में सर्वनामों का संदर्भ
  choice: मुख्य पाठ में सर्वनाम दर्शन और उसकी पूर्ति को सूचित करते हैं—‘यह/इसकी’।
  alternative: इन्हें व्यक्तिगत रूप में ‘वह/उसकी’ भी पढ़ा जा सकता है; इब्रानियों 10:37 में पंक्ति का ऐसा व्यक्तिगत प्रयोग मिलता है।
  rationale: हिब्रू प्रसंग में निकटतम पूर्वपद חָזוֹן (‘दर्शन’) पुल्लिंग एकवचन है, इसलिए मुख्य पाठ में उसी का संदर्भ स्रोत-पाठ के सबसे निकट है। बाद की व्यक्तिगत ग्रहण-परंपरा को मुख्य पाठ में आरोपित किए बिना पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘दर्शन’, ‘ठहराए हुए समय’ और ‘निश्चय ही’ जैसे परिचित बाइबलीय शब्द रखे गए हैं, पर अत्यधिक संस्कृतनिष्ठ या पुरातन अभिव्यक्तियों से बचा गया है। मूल में ‘देर करे’ और फिर ‘देर नहीं करेगा’ के बीच जो जानबूझकर तनाव है, उसे स्पष्ट किए बिना ज्यों का त्यों रखा गया है।
