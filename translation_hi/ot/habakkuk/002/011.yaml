  yaml_path: translation/ot/habakkuk/002/011.yaml
  text: For a stone will cry out from the wall, and a beam from the woodwork will answer it.
translation:
  language: hi
  text: क्योंकि दीवार से एक पत्थर पुकार उठेगा, और लकड़ी की कड़ी उसे उत्तर देगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶבֶן מִקִּיר
  choice: दीवार में लगा पत्थर
  rationale: מִן का मूल अर्थ ‘से’ है, पर प्रसंग में दीवार का घटक बना पत्थर बोलता है; ‘दीवार में लगा’ इस संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: תִּזְעָק
  choice: पुकार उठेगा
  rationale: זעק तीव्र पुकार या दुहाई देने को व्यक्त करता है; निर्जीव पत्थर के साक्षी बनकर बोलने की काव्यात्मकता बनाए रखता है।
- source_word: כָפִיס מֵעֵץ
  choice: लकड़ी की कड़ी
  rationale: כָפִיס एक निर्माण-संबंधी लकड़ी का सदस्य है, जिसकी सटीक पहचान अनिश्चित है; ‘कड़ी’ भवन में प्रयुक्त लकड़ी के संरचनात्मक टुकड़े का स्वाभाविक और पर्याप्त व्यापक अनुवाद है।
- source_word: יַעֲנֶנָּה
  choice: उसे उत्तर देगी
  rationale: क्रिया ענה का सीधा अर्थ ‘उत्तर देना’ है और स्त्रीलिंग प्रत्यय उस पत्थर की ओर संकेत करता है; हिन्दी में ‘उसे’ संदर्भ को सुरक्षित रखता है।
theological_decisions:
- issue: निर्जीव निर्माण-सामग्री का बोलना
  choice: पत्थर और कड़ी को मानवीकृत साक्षियों की तरह सीधे पुकारते और उत्तर देते दिखाया गया है।
  alternative: इसे केवल रूपक समझाकर ‘वे उसके अन्याय की गवाही देंगे’ कहना।
  rationale: मूल पद की सजीव काव्यात्मक छवि न्याय की धार को स्वयं व्यक्त करती है; व्याख्यात्मक विस्तार जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और श्रव्य हिन्दी। ‘कड़ी’ सामान्य पाठक के लिए ‘शहतीर’ से अधिक सहज है और दुर्लभ हिब्रू निर्माण-शब्द की अनिश्चितता को अनावश्यक रूप से संकीर्ण नहीं करती।
