reference: Habakkuk 2:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי אַתָּ֤ה שַׁלּ֨וֹתָ֙ גּוֹיִ֣ם רַבִּ֔ים יְשָׁלּ֖וּ/ךָ כָּל יֶ֣תֶר עַמִּ֑ים מִ/דְּמֵ֤י אָדָם֙ וַ/חֲמַס אֶ֔רֶץ קִרְיָ֖ה וְ/כָל יֹ֥שְׁבֵי בָֽ/הּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/008.yaml
  text: Because you have plundered many nations[a], all the remnant of the peoples will plunder you—because of human blood and violence done to the land, to the city, and to all who dwell in it.
translation:
  language: hi
  text: 'क्योंकि तूने बहुत-सी जातियों को लूटा है,

    इसलिए बचे हुए सब लोग तुझे लूटेंगे—

    मनुष्य के लहू[a] और भूमि, नगर तथा उस नगर में रहने वाले सभी लोगों पर की गई हिंसा के कारण।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनुष्यों के रक्तपात के कारण।”
    reason: דְּמֵי אָדָם का शाब्दिक रूप ‘मनुष्य का लहू’ है, पर बहुवचन ‘लहू/रक्त’ यहाँ हिंसक रक्तपात का संकेत भी देता है।
lexical_decisions:
- source_word: שַׁלּוֹתָ / יְשָׁלּוּךָ
  choice: लूटा है / तुझे लूटेंगे
  rationale: 'दोनों सजातीय क्रियाओं के लिए एक ही हिन्दी क्रिया रखकर न्यायपूर्ण उलटाव स्पष्ट किया गया है: लूटनेवाला स्वयं लूटा जाएगा।'
- source_word: גּוֹיִם רַבִּים
  choice: बहुत-सी जातियाँ
  rationale: यहाँ גּוֹיִם साम्राज्य के अधीन अनेक राजनीतिक-जातीय समुदायों को दर्शाता है; ‘जातियाँ’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक है।
- source_word: כָּל יֶתֶר עַמִּים
  choice: सभी लोगों के बचे हुए जन
  rationale: יֶתֶר का ‘जो शेष बचा है’ वाला भाव सुरक्षित रखा गया है और עַמִּים को पहले आए גּוֹיִם से हल्के lexical अंतर के साथ व्यक्त किया गया है।
- source_word: מִדְּמֵי אָדָם
  choice: मनुष्य के लहू के कारण
  rationale: מִן को कारणसूचक और אָדָם को समस्त मानवजाति का प्रतिनिधि एकवचन माना गया है। बहुवचन דָּמִים का हिंसक रक्तपात-संबंधी भाव पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וַחֲמַס אֶרֶץ קִרְיָה וְכָל יֹשְׁבֵי בָהּ
  choice: देश, नगर तथा उसमें रहनेवाले सभी लोगों पर की गई हिंसा
  rationale: इब्रानी की संक्षिप्त संरचना में हिंसा के लक्ष्य क्रमशः देश, नगर और उसके निवासी हैं; हिन्दी में संबंध को ‘पर की गई’ से स्वाभाविक रूप से स्पष्ट किया गया है।
theological_decisions:
- issue: אָדָם का सामान्य मानव-संदर्भ
  choice: मनुष्य
  alternative: मानवजाति / मनुष्यों
  rationale: यह पुरुष-विशेष का संकेत नहीं, बल्कि सामूहिक मानव-संदर्भ है। ‘मनुष्य’ स्रोत के प्रतिनिधि एकवचन को बनाए रखते हुए हिन्दी में सामान्य मानव अर्थ देता है।
- issue: דְּמֵי אָדָם में लहू और रक्तपात का संबंध
  choice: मनुष्य के लहू
  alternative: मनुष्यों का खून बहाने
  rationale: मुख्य पाठ में स्रोत की ठोस संज्ञात्मक अभिव्यक्ति रखी गई है; उसका प्रसंगगत अर्थ—हत्या अथवा रक्तपात—पादटिप्पणी में दिया गया है, ताकि अर्थ की तीव्रता बनी रहे और व्याख्या चुपचाप पाठ में न मिला दी जाए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। प्रत्यक्ष संबोधन में एकवचन ‘तू’ भविष्यद्वाणी की तीक्ष्णता और इब्रानी के एकवचन रूप को बनाए रखता है। काव्यात्मक पंक्ति-विन्यास कारण, न्यायपूर्ण उलटाव और दंड के आधार को उभारता है।
