id: HAB.2.13
reference: Habakkuk 2:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/ל֣וֹא הִנֵּ֔ה מֵ/אֵ֖ת יְהוָ֣ה צְבָא֑וֹת וְ/יִֽיגְע֤וּ עַמִּים֙ בְּ/דֵי אֵ֔שׁ וּ/לְאֻמִּ֖ים בְּ/דֵי רִ֥יק יִעָֽפוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/013.yaml
  text: Is it not indeed from Yahweh of hosts that peoples labor for fire[b][a], and nations weary themselves for emptiness?
translation:
  language: hi
  text: क्या यह सचमुच सेनाओं के यहोवा की ओर से नहीं है कि लोग आग के लिए[a] परिश्रम करते हैं, और राष्ट्र व्यर्थता के लिए[b] अपने को थका डालते हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आग के वास्ते,” अर्थात ऐसी वस्तु के लिए जो आग में भस्म हो जाएगी।
    reason: lexical_alternative
  - marker: b
    text: या, “खालीपन के लिए” अथवा “कुछ भी नहीं के लिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא הִנֵּה
  choice: क्या यह सचमुच ... नहीं है
  rationale: अलंकारिक प्रश्न की स्वीकारोन्मुख शक्ति और הִנֵּה का बल, दोनों आधुनिक और स्वाभाविक हिन्दी में सुरक्षित रहते हैं।
- source_word: מֵאֵת
  choice: की ओर से
  rationale: यह स्रोत अथवा उद्गम को व्यक्त करता है और परिणाम पर यहोवा की प्रभुता को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: परमेश्वर के निज नाम को लिप्यंतरित करता है और צְבָאוֹת के व्यापक सैन्य/स्वर्गीय समूह-संबंधी भाव को केवल मानवीय सेना तक सीमित नहीं करता।
- source_word: וְיִיגְעוּ עַמִּים
  choice: लोग ... परिश्रम करते हैं
  rationale: יִיגְעוּ के कठिन श्रम के भाव को गरिमापूर्ण, सामान्य हिन्दी में व्यक्त करता है; עַמִּים को अगले समानांतर לְאֻמִּים से अलग रखा गया है।
- source_word: בְּדֵי אֵשׁ
  choice: आग के लिए
  rationale: संक्षिप्त मूल बिंब को सुरक्षित रखता है; इसका आशय आग में भस्म होने वाली उपलब्धि या आग का ईंधन बनने वाले श्रम से हो सकता है।
- source_word: וּלְאֻמִּים
  choice: और राष्ट्र
  rationale: समानांतर पद में सामूहिक जनसमुदाय का भाव देता है और עַמִּים के अनुवाद 'लोग' से शब्दगत भेद बनाए रखता है।
- source_word: בְּדֵי רִיק
  choice: व्यर्थता के लिए
  rationale: רִיק के खालीपन, निष्फलता और निरर्थक परिणाम के भाव को समेटता है; अधिक व्याख्यात्मक 'कुछ भी नहीं के लिए' को पादटिप्पणी में रखा गया है।
- source_word: יִעָפוּ
  choice: अपने को थका डालते हैं
  rationale: अत्यधिक प्रयास के फलस्वरूप स्वयं चूर हो जाने का प्रबल परिणामात्मक भाव स्वाभाविक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: हिन्दी के सामान्य बाइबलीय प्रयोग में पहचाने जाने योग्य रूप 'यहोवा' निज नाम को शीर्षक से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: מֵאֵת द्वारा व्यक्त कारण-संबंध
  choice: इन राष्ट्रों के श्रम का आग और व्यर्थता में समाप्त होना सेनाओं के यहोवा की ओर से है
  alternative: यहोवा स्वयं उनके दुष्ट इरादों का नैतिक कर्ता है
  rationale: इब्रानी पाठ परिणाम के स्रोत या ईश्वरीय नियमन को बताता है, पर राष्ट्रों की दुष्ट इच्छा का नैतिक कर्तृत्व स्पष्टतः यहोवा पर नहीं रखता। मुख्य पाठ इस तनाव को समझाकर समाप्त नहीं करता।
- issue: वाक्य का अलंकारिक प्रश्न
  choice: क्या यह सचमुच ... नहीं है
  alternative: निश्चय ही यह ... है
  rationale: मूल प्रश्नवाचक रूप अपेक्षित सकारात्मक उत्तर का संकेत देता है; इसे सपाट कथन बनाने के बजाय संरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। समानांतरता में ‘लोग/राष्ट्र’ और ‘परिश्रम/अपने को थका डालते’ का भेद रखा गया है। पादटिप्पणी चिह्न मुख्य पाठ में संबंधित पदों के तुरंत बाद दिए गए हैं।
