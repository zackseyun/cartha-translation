  edition: WLC
  text: ה֚וֹי מַשְׁקֵ֣ה רֵעֵ֔/הוּ מְסַפֵּ֥חַ חֲמָתְ/ךָ֖ וְ/אַ֣ף שַׁכֵּ֑ר לְמַ֥עַן הַבִּ֖יט עַל מְעוֹרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/015.yaml
  text: Woe to him who makes his neighbor drink[a], pouring out your wrath and even making him drunk[c][b], in order to look on their nakedness.
translation:
  language: hi
  text: हाय उस पर जो अपने पड़ोसी को पिलाता है, तेरा क्रोध[a] उंडेलता है और उसे नशे में भी कर देता है[b], उनकी नग्नता[c] देखने के लिए!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरा विष”; यहाँ “क्रोध” के लिए प्रयुक्त इब्रानी शब्द का अर्थ कुछ संदर्भों में ताप या विष भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी वाक्यांश कठिन है। कुछ लोग इसे “अपनी मशक मिलाता है” समझते हैं, या व्यक्ति-परिवर्तन को समतल करके “उसका क्रोध” जैसा अर्थ लेते हैं।
    reason: alternative_reading
  - marker: c
    text: या “उनके गुप्तांगों”; इब्रानी शब्द लज्जाजनक रूप से उजागर नग्नता का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: हाय उस पर
  rationale: यह भविष्यद्वाणी की दंड-घोषणा आरंभ करने वाला विस्मयादिबोधक है; हिन्दी में ‘हाय उस पर’ न्याय और आसन्न विपत्ति दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מַשְׁקֵה
  choice: पिलाता है
  rationale: שׁקה का हिफ़ील कृदंत किसी को पीने के लिए प्रेरित या विवश करने का भाव देता है; ‘पिलाता है’ संक्षिप्त और स्वाभाविक है।
- source_word: רֵעֵהוּ
  choice: अपने पड़ोसी को
  rationale: רֵעַ किसी निकटवर्ती व्यक्ति, साथी या पड़ोसी को दर्शा सकता है; ‘पड़ोसी’ नैतिक और पारस्परिक उल्लंघन का भाव बनाए रखता है।
- source_word: מְסַפֵּחַ
  choice: उसमें ... उड़ेलता
  rationale: रूप और वाक्यांश कठिन हैं; संदर्भ में किसी हानिकारक पदार्थ को पेय में मिलाने या उड़ेलने का भाव संभव है। ‘उसमें ... उड़ेलता’ पेय से संबंध स्पष्ट रखते हुए क्रिया की शत्रुतापूर्ण सक्रियता व्यक्त करता है।
- source_word: חֲמָתְךָ
  choice: अपना क्रोध
  rationale: חֵמָה का सामान्य अर्थ क्रोध या प्रकोप है, किंतु यहाँ विष का अर्थ भी संभव है। मुख्य पाठ सामान्य अर्थ रखता है और पादटिप्पणी वैकल्पिक अर्थ सुरक्षित करती है। ‘अपना’ मसोराई पाठ के द्वितीय पुरुष प्रत्यय को हिन्दी में प्रत्यक्ष संबोधन के रूप में बनाए रखता है।
- source_word: וְאַף שַׁכֵּר
  choice: और उसे मतवाला भी कर देता है
  rationale: אַף वृद्धि या तीव्रता दर्शाता है और שׁכר यहाँ किसी को नशे में करने का अर्थ देता है; यह वाक्यांश उस क्रमिक बढ़ोतरी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְמַעַן הַבִּיט
  choice: ताकि ... को देखे
  rationale: לְמַעַן उद्देश्य बताता है और נבט देखने या निहारने का भाव देता है; ‘ताकि ... देखे’ कृत्य की जानबूझकर की गई मंशा स्पष्ट करता है।
- source_word: מְעוֹרֵיהֶם
  choice: उनकी नग्नता
  rationale: यह शब्द अपमानजनक रूप से उजागर नग्नता, संभवतः गुप्तांगों, की ओर संकेत करता है। ‘नग्नता’ गरिमापूर्ण रहते हुए मूल की लज्जाजनक अनावृत्ति को बनाए रखता है।
theological_decisions:
- issue: तीसरे पुरुष की हाय-घोषणा के बीच חֲמָתְךָ का द्वितीय पुरुष प्रत्यय
  choice: मुख्य पाठ में व्यक्ति-परिवर्तन को ‘अपना क्रोध’ द्वारा बनाए रखा गया है
  alternative: व्याकरण को समतल करके ‘उसका क्रोध’ या पाठ को ‘अपना पात्र’ के अर्थ में लेना
  rationale: मसोराई पाठ में अचानक द्वितीय पुरुष आता है। हिन्दी में ‘अपने पड़ोसी... अपना क्रोध’ अपराधी को संबोधित किए जाने की इस तीक्ष्णता को रखता है; कठिनाई पादटिप्पणी में बताई गई है, चुपचाप दूर नहीं की गई।
- issue: यौन-लज्जा और अपमान की छवि
  choice: ‘उनकी नग्नता को देखे’
  alternative: ‘उनके गुप्तांगों को देखे’ अथवा ‘उनकी लज्जा देखे’
  rationale: मूल पाठ नशा कराकर अनावृत्त करने और देखने की निंदनीय मंशा बताता है। चुना हुआ रूप न तो अर्थ को शिष्टोक्ति में खोता है, न मूल से अधिक विशिष्ट यौन विवरण जोड़ता है।
- issue: מְעוֹרֵיהֶם में बहुवचन प्रत्यय
  choice: ‘उनकी नग्नता’ के रूप में बहुवचन बनाए रखा गया है
  alternative: निकटवर्ती एकवचन ‘पड़ोसी’ के अनुसार ‘उसकी नग्नता’ करना
  rationale: हिब्रू में लक्ष्य पहले एकवचन है, पर अंतिम प्रत्यय बहुवचन है। पाठ की वास्तविक असंगति या सामूहिक विस्तार को समतल न करते हुए बहुवचन सुरक्षित रखा गया है।
translation_notes:
  register: 'आधुनिक मानक हिन्दी का गरिमापूर्ण, स्पष्ट और भविष्यद्वाणी-सुलभ स्वर अपनाया गया है। वाक्य की कठिन हिब्रू संरचना को पूरी तरह समतल नहीं किया गया: द्वितीय पुरुष का अचानक प्रवेश और अंतिम बहुवचन दोनों सुरक्षित हैं। ‘मतवाला’ साहित्यिक किंतु सामान्यतः बोधगम्य है; ‘नग्नता’ स्पष्ट है पर अनावश्यक रूप से चिकित्सकीय या अशिष्ट नहीं।'
