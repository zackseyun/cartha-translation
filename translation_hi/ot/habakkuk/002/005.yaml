  text: וְ/אַף֙ כִּֽי הַ/יַּ֣יִן בּוֹגֵ֔ד גֶּ֥בֶר יָהִ֖יר וְ/לֹ֣א יִנְוֶ֑ה אֲשֶׁר֩ הִרְחִ֨יב כִּ/שְׁא֜וֹל נַפְשׁ֗/וֹ וְ/ה֤וּא כַ/מָּ֨וֶת֙ וְ/לֹ֣א יִשְׂבָּ֔ע וַ/יֶּאֱסֹ֤ף אֵלָי/ו֙ כָּל הַ/גּוֹיִ֔ם וַ/יִּקְבֹּ֥ץ אֵלָ֖י/ו כָּל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/005.yaml
  text: Moreover[a], wine betrays; an arrogant man does not remain at rest. He enlarges his appetite like Sheol, and he is like death and is never satisfied[c][b]. He gathers to himself all the nations and collects to himself all the peoples.
translation:
  language: hi
  text: और तो और[a], दाखमधु धोखा देता है; घमंडी मनुष्य चैन से नहीं टिकता[b]। वह अपनी लालसा को अधोलोक[c] के समान बढ़ा लेता है; वह मृत्यु के समान है और कभी तृप्त नहीं होता। वह सब राष्ट्रों को अपने पास बटोरता और सब जातियों को अपने पास इकट्ठा करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘निश्चय ही’ या ‘इसके अतिरिक्त’ भी हो सकता है। इब्रानी अभिव्यक्ति संक्षिप्त और कुछ कठिन है। कुछ व्याख्याकार इस पंक्ति को घमंडी विजेता के मदमत्त अहंकार से अधिक सीधे जोड़ते हैं।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘घर में नहीं रहता’, ‘स्थिर नहीं रहता’ या ‘निवास नहीं करता’ भी हो सकता है। इब्रानी क्रिया कठिन है; मुख्य पाठ प्रसंग में उसकी बेचैन अस्थिरता को व्यक्त करता है।
    reason: lexical_alternative
  - marker: c
    text: ‘अधोलोक’ से आशय मृतकों के लोक से है; इसका अनुवाद ‘कब्र’ भी किया जा सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְאַף כִּי
  choice: और तो और
  rationale: यह संक्षिप्त इब्रानी पदबंध यहाँ पिछले कथन में एक और बात जोड़ते हुए जोर देता है; ‘और तो और’ उसके संक्रमणकारी और बलात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַיַּיִן בּוֹגֵד
  choice: दाखमधु धोखा देता है
  rationale: मूल पाठ में ‘दाखमधु’ स्पष्ट रूप से कर्ता है और בּוֹגֵד विश्वासघाती या छलपूर्ण व्यवहार को दर्शाता है। मानवीकरण को बनाए रखते हुए ‘धोखा देता है’ सहज और स्पष्ट है।
- source_word: גֶּבֶר יָהִיר
  choice: घमंडी मनुष्य
  rationale: גֶּבֶר यहाँ किसी बलवान पुरुष पर विशेष जोर देने के बजाय न्याय के अधीन अभिमानी व्यक्ति को सूचित करता है; יָהִיר का नैतिक भाव ‘घमंडी’ से स्पष्ट होता है।
- source_word: וְלֹא יִנְוֶה
  choice: चैन से नहीं टिकता
  rationale: दुर्बोध क्रिया में बसने, टिकने या विश्राम करने के अर्थ संभव हैं। संदर्भ की बेचैन और अतृप्त विस्तार-लालसा को व्यक्त करते हुए यह अनुवाद किसी एक संकुचित अर्थ पर आवश्यकता से अधिक आग्रह नहीं करता।
- source_word: הִרְחִיב ... נַפְשׁוֹ
  choice: अपनी लालसा को ... फैला देता है
  rationale: הִרְחִיב का अर्थ चौड़ा या विस्तृत करना है, और נֶפֶשׁ यहाँ व्यक्ति की निगल जाने वाली इच्छा या भूख को सूचित करता है। ‘लालसा’ प्रसंगगत भाव को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: כִּשְׁאוֹל
  choice: अधोलोक के समान
  rationale: שְׁאוֹל मृतकों के लोक की स्रोत-सांस्कृतिक धारणा है। ‘अधोलोक’ हिन्दी पाठक के लिए बोधगम्य रहते हुए इसे केवल भौतिक कब्र तक सीमित नहीं करता।
- source_word: וְהוּא כַמָּוֶת וְלֹא יִשְׂבָּע
  choice: वह मृत्यु के समान है और कभी तृप्त नहीं होता
  rationale: मृत्यु की अतृप्तता का सीधा उपमान सुरक्षित रखा गया है; अपूर्ण क्रिया की निरंतरता को ‘कभी ... नहीं’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיֶּאֱסֹף ... וַיִּקְבֹּץ
  choice: बटोरता ... इकट्ठा करता है
  rationale: समानार्थी क्रियाओं की काव्यात्मक समानांतरता को दो स्वाभाविक हिन्दी क्रियाओं द्वारा बनाए रखा गया है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: अधोलोक
  alternative: कब्र; मृतकों का लोक
  rationale: यह शब्द इस्राएली अभिव्यक्ति में केवल दफनाने की जगह नहीं, बल्कि मृतकों के लोक का बिंब प्रस्तुत करता है। ‘अधोलोक’ उस व्यापक बिंब और उसकी अतृप्तता को बनाए रखता है।
- issue: दाखमधु और घमंडी मनुष्य के बीच संबंध
  choice: दो संक्षिप्त, परस्पर संबद्ध कथनों के रूप में रखा गया
  alternative: दाखमधु से मतवाला घमंडी विजेता
  rationale: मूल इब्रानी अत्यंत संक्षिप्त और कठिन है। पाठ में निहित संबंध को पूरी तरह खोलकर किसी विशेष व्याख्या को मुख्य पाठ में जोड़ना उचित नहीं; इसलिए अस्पष्टता को टिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘दाखमधु’ बाइबलीय-काव्यात्मक प्रसंग में स्पष्ट और प्रतिष्ठित है; ‘अधोलोक’ स्रोत-सांस्कृतिक बिंब को समझने योग्य हिन्दी में सुरक्षित रखता है। समानांतर क्रियाओं और अतृप्तता के रूपक को यथासंभव संरक्षित किया गया है।
