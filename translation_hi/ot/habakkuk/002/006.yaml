id: HAB.2.6
reference: Habakkuk 2:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/לוֹא אֵ֣לֶּה כֻלָּ֗/ם עָלָי/ו֙ מָשָׁ֣ל יִשָּׂ֔אוּ וּ/מְלִיצָ֖ה חִיד֣וֹת ל֑/וֹ וְ/יֹאמַ֗ר ה֚וֹי הַ/מַּרְבֶּ֣ה לֹּא ל֔/וֹ עַד מָתַ֕י וּ/מַכְבִּ֥יד עָלָ֖י/ו עַבְטִֽיט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/006.yaml
  text: Will not all of these take up a taunt against him[a], with mockery and riddles about him, and say, “Woe to him who heaps up what is not his—how long?—and loads himself with pledged goods!”
translation:
  language: hi
  text: 'क्या वे सब उसके विरुद्ध ताना न कसेंगे और उसके विषय में पहेलियों से भरा व्यंग्य न करेंगे? वे कहेंगे,


    “हाय उस पर, जो उस वस्तु का ढेर लगाता है जो उसकी नहीं है—कब तक?—


    और अपने ऊपर गिरवी रखी वस्तुओं का बोझ लादता है![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने ऊपर गाढ़ी मिट्टी का बोझ लादता है।” हिब्रू शब्द दुर्लभ है और संभवतः गिरवी रखी वस्तुओं से जुड़े ऋण तथा बटोरने वाले पर भारी पड़ने वाले बोझ के बीच शब्द-खेल करता है।
    reason: दुर्लभ हिब्रू शब्द का प्राचीन वैकल्पिक अर्थ और संभावित शब्द-खेल सुरक्षित रखना।
lexical_decisions:
- source_word: מָשָׁל
  choice: ताना
  rationale: इस न्याय-संदर्भ में यह सामान्य कहावत नहीं, बल्कि अत्याचारी के विरुद्ध उपहासपूर्ण और निंदात्मक कथन है; ‘ताना’ आधुनिक हिन्दी में इस कार्य और स्वर को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִשָּׂאוּ
  choice: कसेंगे
  rationale: מָשָׁל के साथ इसका मुहावरेदार अर्थ किसी ताने को उठाना या आरम्भ करना है। हिन्दी में ‘ताना कसना’ उसी भाषिक क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מְלִיצָה חִידוֹת
  choice: पहेलियों भरा व्यंग्य
  rationale: दोनों पद मिलकर उपहासपूर्ण, संकेतात्मक और कुछ गूढ़ कथन का बोध कराते हैं। यह रूप व्यंग्य और पहेली, दोनों पक्षों को बनाए रखता है।
- source_word: הוֹי
  choice: हाय उस पर
  rationale: यह भविष्यद्वाणी के न्याय-वचन में विलाप और धिक्कार, दोनों का सूचक है। ‘हाय उस पर’ हिन्दी बाइबलीय शैली में गंभीर और समझने योग्य है।
- source_word: הַמַּרְבֶּה לֹּא לוֹ
  choice: जो उस वस्तु का ढेर लगाता है जो उसकी नहीं है
  rationale: रूप अन्यायपूर्ण संचय को दर्शाता है। यह अनुवाद संचय की दृश्यात्मकता और परायी संपत्ति हथियाने के नैतिक आरोप, दोनों को स्पष्ट रखता है।
- source_word: עַד מָתַי
  choice: कब तक?
  rationale: यह अचानक उठने वाला विरोध और अधीरता का प्रश्न है; विराम-चिह्नों द्वारा इसकी तीखी आलंकारिक शक्ति सुरक्षित रखी गई है।
- source_word: וּמַכְבִּיד עָלָיו
  choice: अपने ऊपर ... का बोझ लादता है
  rationale: हिब्रू में अपने ऊपर भारी करने का चित्र है। ‘बोझ लादता है’ इस आत्म-विनाशकारी संचय की छवि को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: עַבְטִיט
  choice: गिरवी की वस्तुएँ
  rationale: यह दुर्लभ शब्द प्रसंग में ऋण, गिरवी और शोषण से प्राप्त माल की आर्थिक छवि व्यक्त करता प्रतीत होता है। ‘गिरवी की वस्तुएँ’ अर्थ को समझने योग्य बनाता है, जबकि प्राचीन वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: दुर्लभ शब्द עַבְטִיט का अर्थ
  choice: 'आर्थिक छवि: ‘गिरवी की वस्तुएँ’'
  alternative: ‘गाढ़ी मिट्टी’
  rationale: आसपास का वचन अन्यायपूर्ण संचय और शोषण की निंदा करता है, इसलिए गिरवी या ऋण-संबंधी अर्थ प्रसंग में अधिक उपयुक्त है। फिर भी ‘गाढ़ी मिट्टी’ की प्राचीन अनुवाद-परंपरा और भारी बोझ से जुड़े संभावित शब्द-खेल को हटाया नहीं गया, बल्कि पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यद्वाणी के धिक्कार-वचन की गरिमा और काव्यात्मक तीखापन बनाए रखा गया है। ‘ताना कसना’, ‘पहेलियों भरा व्यंग्य’ और ‘बोझ लादना’ सामान्य पाठक के लिए सहज हैं। पंक्ति-विभाजन केवल काव्यात्मक वचन और आकस्मिक ‘कब तक?’ को उभारता है।
