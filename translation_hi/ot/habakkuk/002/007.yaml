source:
  edition: WLC
  text: הֲ/ל֣וֹא פֶ֗תַע יָק֨וּמוּ֙ נֹשְׁכֶ֔י/ךָ וְ/יִקְצ֖וּ מְזַעְזְעֶ֑י/ךָ וְ/הָיִ֥יתָ לִ/מְשִׁסּ֖וֹת לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/007.yaml
  text: Will not your creditors suddenly rise[a], and those who make you tremble awake? Then you will become plunder for them.
translation:
  language: hi
  text: क्या तुम्हारे लेनदार[a] अचानक उठ खड़े न होंगे, और तुम्हें थरथरा देनेवाले जाग न उठेंगे? तब तुम उनके लिए लूट का माल बन जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “तुम्हें काटनेवाले।” इस अभिव्यक्ति में संभवतः काटनेवाले आक्रमणकारियों और अपना धन वसूलनेवाले लेनदारों—दोनों की ओर संकेत करने वाला शब्द-चित्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: क्या ... न होंगे
  rationale: यह आलंकारिक प्रश्न है, जिसका अपेक्षित उत्तर हाँ है; हिन्दी में ‘क्या ... न’ भविष्यकालीन क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: פֶתַע
  choice: अचानक
  rationale: यह आकस्मिकता बतानेवाला क्रियाविशेषण है; ‘अचानक’ संक्षिप्त और सामान्य आधुनिक हिन्दी है।
- source_word: יָקוּמוּ
  choice: उठ खड़े होंगे
  rationale: קום यहाँ विरोध में सक्रिय होकर उठने का भाव देता है; ‘उठ खड़े होना’ शत्रुतापूर्ण कार्रवाई की शुरुआत को स्पष्ट रखता है।
- source_word: נֹשְׁכֶיךָ
  choice: तुम्हारे लेनदार
  rationale: नשׁך का मूल चित्र ‘काटना’ है, पर आर्थिक प्रसंग में यह ब्याज वसूलने अथवा ऋण का दावा रखनेवालों को सूचित कर सकता है। पिछले पद में अनुचित लाभ बटोरनेवाले के विरुद्ध प्रतिफल के संदर्भ में ‘लेनदार’ अर्थ को स्पष्ट करता है, जबकि मूल रूपक पादटिप्पणी में सुरक्षित है।
- source_word: וְיִקְצוּ
  choice: जाग न उठेंगे
  rationale: יקץ का अर्थ ‘जागना’ है। ‘जाग उठना’ पहले खंड के ‘उठ खड़े होना’ के साथ काव्यात्मक समानांतरता और अचानक सक्रिय होने का चित्र बनाए रखता है।
- source_word: מְזַעְזְעֶיךָ
  choice: तुम्हें थरथरा देनेवाले
  rationale: यह शब्द हिलाने, विचलित करने अथवा भय से कंपा देने का कारक भाव रखता है; चुना हुआ वाक्यांश उसकी सजीवता को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: וְהָיִיתָ
  choice: तब तुम ... बन जाओगे
  rationale: यह आगे आनेवाले परिणाम को बताता है। ‘तब’ प्रश्न में घोषित कार्रवाई और उसके फल के संबंध को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: לִמְשִׁסּוֹת
  choice: लूट का माल
  rationale: शब्द उस वस्तु को दर्शाता है जिसे बलपूर्वक लूट के रूप में ले लिया जाए। ‘लूट का माल’ आधुनिक पाठक के लिए स्पष्ट है और लूटनेवाले के स्वयं लुट जाने की उलटबाँसी बनाए रखता है।
- source_word: לָמוֹ
  choice: उनके लिए
  rationale: यह बहुवचन सर्वनाम पहले बताए गए आक्रमणकारियों की ओर संकेत करता है; ‘उनके लिए’ हिन्दी वाक्य में स्वाभाविक है।
