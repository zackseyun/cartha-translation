source:
  edition: WLC
  text: עַל מִשְׁמַרְתִּ֣/י אֶעֱמֹ֔דָה וְ/אֶֽתְיַצְּבָ֖ה עַל מָצ֑וֹר וַ/אֲצַפֶּ֗ה לִ/רְאוֹת֙ מַה יְדַבֶּר בִּ֔/י וּ/מָ֥ה אָשִׁ֖יב עַל תּוֹכַחְתִּֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/001.yaml
  text: I will stand at my guard post and station myself on the rampart[a]; I will keep watch to see what he will speak in me[b], and what I should answer concerning my complaint.
translation:
  language: hi
  text: मैं अपनी पहरे की चौकी पर खड़ा रहूँगा और किलेबंदी पर अपना स्थान लूँगा। मैं चौकसी करूँगा, यह देखने के लिए कि वह मुझमें[a] क्या बोलेगा, और अपनी शिकायत[b] के विषय में मैं क्या उत्तर दूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह मुझसे क्या बोलेगा।” हिब्रू का शाब्दिक रूप “मुझमें” है, जो भीतर दी गई नबूवत-संबंधी वाणी की ओर भी संकेत कर सकता है।
    reason: alternative_reading
  - marker: b
    text: “मेरी शिकायत” का अनुवाद “मेरी फटकार,” “मेरी डाँट,” या “मेरे तर्क/मुकदमे” के विषय में भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁמַרְתִּי
  choice: अपनी पहरे की चौकी
  rationale: यह संज्ञा पहरा देने के कार्य या स्थान को दर्शाती है; यहाँ संतरी के ठोस स्थान की छवि के कारण ‘पहरे की चौकी’ स्वाभाविक और स्पष्ट है।
- source_word: אֶעֱמֹדָה
  choice: खड़ा रहूँगा
  rationale: यह रूप निश्चयपूर्ण भावी अभिप्राय व्यक्त करता है; ‘खड़ा रहूँगा’ प्रतीक्षा में दृढ़ बने रहने का भाव भी देता है।
- source_word: וְאֶתְיַצְּבָה
  choice: अपना स्थान लूँगा
  rationale: हित्पएल रूप स्वयं दृढ़ता से किसी स्थान पर तैनात होने का भाव देता है; यह हिन्दी में स्वाभाविक रहते हुए आत्मवाचक अर्थ बनाए रखता है।
- source_word: מָצוֹר
  choice: किलेबंदी
  rationale: शब्द किलेबंद या घेराबंदी से संबंधित संरचना को सूचित कर सकता है; इस प्रसंग में ऊँचे रक्षात्मक निगरानी-स्थान के लिए ‘किलेबंदी’ पर्याप्त व्यापक है और किसी एक स्थापत्य अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַאֲצַפֶּה
  choice: चौकसी करता रहूँगा
  rationale: क्रिया ध्यान और अपेक्षा के साथ लगातार देखते रहने को व्यक्त करती है; ‘करता रहूँगा’ उसकी निरंतरता बनाए रखता है।
- source_word: מַה יְדַבֶּר בִּי
  choice: वह मुझमें क्या बोलेगा
  rationale: בִּי का निकट रूप ‘मुझमें’ है और यह भीतर होने वाले नबूवत-संबंधी वचन की सम्भावना खुली रखता है; ‘मुझसे’ अर्थात संबोधित वचन भी प्रसंग में सम्भव है और पादटिप्पणी में दिया गया है।
- source_word: אָשִׁיב
  choice: मैं क्या उत्तर दूँगा
  rationale: हिफ़ील रूप यहाँ उत्तर देने का अर्थ देता है। अपूर्ण रूप भावी उत्तर की प्रतीक्षा को सीधे व्यक्त करता है; हिन्दी में ‘दूँगा’ स्वाभाविक है।
- source_word: עַל תּוֹכַחְתִּי
  choice: अपनी शिकायत के विषय में
  rationale: תּוֹכַחַת शिकायत, उलाहना, डाँट या तर्क-विवाद को सूचित कर सकता है। पिछले प्रसंग में नबी की आपत्ति के कारण ‘शिकायत’ मुख्य पाठ में सबसे सहज है, जबकि अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: בִּי में वचन के भीतर बोले जाने और नबी को संबोधित किए जाने के बीच अस्पष्टता
  choice: मुझमें
  alternative: मुझसे
  rationale: हिब्रू पूर्वसर्ग का सीधा अर्थ ‘मुझमें’ है, जिससे आंतरिक नबूवत-संबंधी वाणी सम्भव रहती है। प्रसंग परमेश्वर के उत्तर की प्रतीक्षा का है, इसलिए ‘मुझसे’ भी सम्भव है; पादटिप्पणी दोनों को खुला रखती है।
- issue: תּוֹכַחְתִּי का अर्थ
  choice: मेरी शिकायत
  alternative: मेरे उलाहने, डाँट या तर्क के विषय में
  rationale: हबक्कूक 1:12–17 की आपत्ति को देखते हुए ‘शिकायत’ प्रवाह में स्वाभाविक है, पर शब्द के न्यायिक और भर्त्सनात्मक आयाम को पादटिप्पणी में संरक्षित किया गया है।
- issue: उत्तर देने वाला कौन है
  choice: नबी स्वयं उत्तर देगा
  alternative: कुछ व्याख्याएँ अर्थ को ‘मेरी शिकायत का क्या उत्तर मिलेगा’ की दिशा में ले सकती हैं
  rationale: אָשִׁיב प्रथम पुरुष एकवचन सक्रिय रूप है, इसलिए मुख्य पाठ में ‘मैं क्या उत्तर दूँगा’ रखा गया है और व्याकरणिक कर्ता नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप रखा गया है। संतरी और किलेबंदी की दृश्यात्मकता बनाए रखते हुए कठिन स्थापत्य शब्दों से बचा गया है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में अपने संबंधित वाक्यांशों के तुरंत बाद दिए गए हैं।
