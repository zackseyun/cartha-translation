  text: שָׂבַ֤עְתָּ קָלוֹן֙ מִ/כָּב֔וֹד שְׁתֵ֥ה גַם אַ֖תָּה וְ/הֵֽעָרֵ֑ל תִּסּ֣וֹב עָלֶ֗י/ךָ כּ֚וֹס יְמִ֣ין יְהוָ֔ה וְ/קִיקָל֖וֹן עַל כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/016.yaml
  text: You have had your fill of shame instead of glory. Drink, you also, and show your uncircumcision! The cup from the LORD’s right hand will come around to you, and utter disgrace will be upon your glory.
translation:
  language: hi
  text: तू महिमा के बदले अपमान से भर गया है। अब तू भी पी और अपनी खतनारहितता प्रकट कर! यहोवा के दाहिने हाथ का प्याला घूमकर तेरे पास आएगा, और तेरी महिमा पर घोर अपमान छा जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָלוֹן מִכָּבוֹד
  choice: महिमा के बदले अपमान
  rationale: मִן को यहाँ विरोध अथवा प्रतिस्थापन के अर्थ में लिया गया है; इससे महिमा चाहने वाले का अपमान से भर जाना स्वाभाविक और स्रोत-संगत ढंग से व्यक्त होता है।
- source_word: וְהֵעָרֵל
  choice: अपनी खतनारहित दशा दिखा
  rationale: मसोरेटिक पाठ की हिफ़ील आज्ञा और ערל मूल से जुड़े शारीरिक अनावरण को बनाए रखता है। इसे केवल ‘लड़खड़ा’ कहना संभावित पाठांतर को मुख्य पाठ में रखकर मूल की तीखी छवि मिटा देता।
- source_word: תִּסּוֹב עָלֶיךָ
  choice: घूमकर तेरे पास आएगा
  rationale: סבב की घूमने अथवा क्रम से किसी तक पहुँचने की छवि को सुरक्षित रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: קִיקָלוֹן
  choice: घोर कलंक
  rationale: यह दुर्लभ और संभवतः शब्द-क्रीड़ायुक्त पद है। मुख्य अर्थ अपमान या लज्जा है; ‘घोर कलंक’ प्रसंग में उसकी तीव्रता व्यक्त करता है, जबकि संभावित वमन-संबंधी अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में प्रयुक्त विशिष्ट वाचा-नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी में प्रचलित नामरूप से स्पष्ट किया गया है।
- issue: खतनारहित होने की छवि
  choice: शारीरिक अनावरण और अपमान की छवि को बनाए रखा
  alternative: इसे केवल नशे में लड़खड़ाने या नैतिक अशुद्धता के रूप में समझाना
  rationale: पाठ की कठोर और बहुअर्थी छवि को किसी एक व्याख्यात्मक धर्मवैज्ञानिक अर्थ में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गंभीर और भविष्यवाणी-संबंधी गरिमापूर्ण स्वर रखा गया है। एकवचन ‘तू/तेरे’ मूल के सीधे अभियोग को बनाए रखता है। ‘खतनारहित दशा’ सामान्य पाठक के लिए बोधगम्य है और मूल की शारीरिक तथा अपमानसूचक छवि को नरम नहीं करता।
