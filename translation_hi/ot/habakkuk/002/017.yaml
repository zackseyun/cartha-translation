source:
  edition: WLC
  text: כִּ֣י חֲמַ֤ס לְבָנוֹן֙ יְכַסֶּ֔/ךָּ וְ/שֹׁ֥ד בְּהֵמ֖וֹת יְחִיתַ֑/ן מִ/דְּמֵ֤י אָדָם֙ וַ/חֲמַס אֶ֔רֶץ קִרְיָ֖ה וְ/כָל יֹ֥שְׁבֵי בָֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/017.yaml
  text: For the violence done to Lebanon will cover you[a], and the destruction of beasts will terrify you, because of the blood of man and the violence done to the land, to the city[b], and to all who dwell in it.
translation:
  language: hi
  text: क्योंकि लबानोन पर की गई हिंसा तुम्हें ढक लेगी,[a] और पशुओं का विनाश उन्हें भयभीत कर देगा;[b] यह मनुष्य के रक्तपात और भूमि, नगर तथा उसके सब निवासियों पर की गई हिंसा के कारण होगा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “तुम्हें आ घेरेगी।” इब्रानी में मूल बिंब “ढकने” का है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी के लिखित पाठ में “उन्हें” है, पर इसका संकेत स्पष्ट नहीं है। कुछ पाठ-परंपराएँ अथवा व्याख्याएँ इसे “तुम्हें भयभीत कर देगा” समझती हैं।
    reason: textual_ambiguity
  - marker: c
    text: “मनुष्य के रक्तपात” का अर्थ यहाँ मनुष्यों का रक्त बहाया जाना है; एकवचन “मनुष्य” प्रतिनिधिक अर्थ में प्रयुक्त हो सकता है।
    reason: lexical_clarification
lexical_decisions:
- source_word: חֲמַס לְבָנוֹן
  choice: लबानोन पर की गई हिंसा
  rationale: חָמָס हिंसा, घोर अन्याय या निर्दयतापूर्ण उपद्रव को व्यक्त करता है। यहाँ लबानोन पीड़ित है, इसलिए ‘पर की गई हिंसा’ संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: יְכַסֶּךָּ
  choice: तुम्हें ढक लेगी
  rationale: כסה का मूल बिंब ‘ढकना’ है। प्रसंग में प्रतिशोध का परिणाम अपराधी को आ घेरता है; मुख्य पाठ में इस भविष्यद्वाणी-संबंधी बिंब को सुरक्षित रखा गया है।
- source_word: שֹׁד בְּהֵמוֹת
  choice: पशुओं का विनाश
  rationale: שֹׁד हिंसक विनाश या बरबादी को दर्शाता है और בְּהֵמוֹת व्यापक रूप से पशुओं को। यह अनुवाद घरेलू मवेशियों तक अर्थ को सीमित नहीं करता।
- source_word: יְחִיתַן
  choice: उन्हें भयभीत कर देगा
  rationale: मसोरेटिक व्यंजन-पाठ में क्रिया के साथ तीसरे पुरुष बहुवचन का कर्म-प्रत्यय है, अर्थात ‘उन्हें।’ उसका संकेत अस्पष्ट है; इसलिए उसे ‘तुम्हें’ में बदलकर संदर्भगत कठिनाई को चुपचाप हल नहीं किया गया।
- source_word: מִדְּמֵי אָדָם
  choice: मनुष्य का रक्त बहाने के कारण
  rationale: מִן यहाँ कारण बताता है और बहुवचन דָּמִים रक्तपात का संकेत देता है। ‘रक्त बहाना’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है, जबकि אָדָם के एकवचन प्रतिनिधिक रूप को ‘मनुष्य’ बनाए रखता है।
- source_word: וַחֲמַס אֶרֶץ קִרְיָה
  choice: देश, नगर ... पर हिंसा करने के कारण
  rationale: दोहराया गया חָמָס देश और नगर पर की गई हिंसा को बताता है। קִרְיָה का एकवचन ‘नगर’ रखा गया है, जिसे संदर्भ किसी विशिष्ट अथवा प्रतिनिधिक नगर के रूप में ग्रहण कर सकता है।
- source_word: וְכָל יֹשְׁבֵי בָהּ
  choice: तथा उसके सब निवासियों पर
  rationale: यह पद उस नगर में रहने वाले सभी लोगों को दर्शाता है। ‘निवासी’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी है।
theological_decisions:
- issue: יְחִיתַן के बहुवचन कर्म का अस्पष्ट संकेत
  choice: उन्हें भयभीत कर देगा
  alternative: तुम्हें भयभीत कर देगा
  rationale: प्राप्त मसोरेटिक पाठ ‘उन्हें’ का समर्थन करता है, यद्यपि एकवचन संबोधित व्यक्ति के कारण अनेक अनुवाद ‘तुम्हें’ लेते हैं। मुख्य पाठ स्रोत-रूप की कठिनाई को सुरक्षित रखता है और पादटिप्पणी वैकल्पिक समझ बताती है।
- issue: אָדָם का प्रतिनिधिक अर्थ
  choice: मनुष्य
  alternative: मानवजाति
  rationale: एकवचन אָדָם यहाँ प्रतिनिधिक रूप से मनुष्यों को सूचित कर सकता है। ‘मनुष्य’ स्रोत के व्याकरणिक रूप और भविष्यद्वाणी की शैली को बचाता है, बिना अर्थ को केवल एक पुरुष व्यक्ति तक सीमित किए।
- issue: प्रतिशोध और कारण-संबंध
  choice: यह ... के कारण होगा
  alternative: मनुष्य के रक्त और हिंसा से
  rationale: מִן को कारणवाचक मानना पद के नैतिक प्रतिफल को स्वाभाविक हिन्दी में व्यक्त करता है, पर उससे आगे कोई विशिष्ट दंड-सिद्धांत आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यद्वाणी की गरिमा और ‘ढक लेगी’ जैसे मूल बिंब को सुरक्षित रखा गया है। वाक्य में अर्धविराम कारणवाचक अंतिम खंड को दोनों पूर्ववर्ती दंड-वाक्यों से जोड़ता है।
