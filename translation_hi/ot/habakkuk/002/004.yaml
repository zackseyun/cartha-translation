source:
  edition: WLC
  text: הִנֵּ֣ה עֻפְּלָ֔ה לֹא יָשְׁרָ֥ה נַפְשׁ֖/וֹ בּ֑/וֹ וְ/צַדִּ֖יק בֶּ/אֱמוּנָת֥/וֹ יִחְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/004.yaml
  text: 'Look: his soul is puffed up; it is not upright within him, but the righteous will live by his faithfulness.'
translation:
  language: hi
  text: देखो, उसका मन घमंड से फूला हुआ है; उसके भीतर खराई नहीं है। परन्तु धर्मी अपनी विश्वासयोग्यता से जीवित रहेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले हिब्रू उद्गार को आधुनिक और सहज हिन्दी में व्यक्त करता है।
- source_word: עֻפְּלָה
  choice: घमंड से फूला हुआ है
  rationale: शब्द के अहंकार और फूल उठने के भाव को स्पष्ट रूप से रखता है; दुर्लभ रूप के कारण अर्थ में कुछ अनिश्चितता है।
- source_word: נַפְשׁוֹ
  choice: उसका मन
  rationale: यहाँ נֶפֶשׁ व्यक्ति के भीतरी स्वभाव या मन को दर्शाता है; शाब्दिक 'प्राण' आधुनिक हिन्दी में कम स्वाभाविक होता।
- source_word: יָשְׁרָה
  choice: सीधा
  rationale: नैतिक खराई और ठीक दशा का मूल रूपक बनाए रखता है।
- source_word: בֶּאֱמוּנָתוֹ
  choice: अपनी विश्वासयोग्यता से
  rationale: אֱמוּנָה के दृढ़ता, निष्ठा और भरोसेमंदी के अर्थ को व्यक्त करता है तथा स्वामित्ववाचक प्रत्यय को 'अपनी' से बनाए रखता है।
- source_word: יִחְיֶה
  choice: जीवित रहेगा
  rationale: अपूर्ण क्रिया के भाव को भविष्य/स्थायी परिणाम के रूप में स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: בֶּאֱמוּנָתוֹ में विश्वास बनाम विश्वासयोग्यता
  choice: अपनी विश्वासयोग्यता से
  alternative: अपने विश्वास से
  rationale: हिब्रू אֱמוּנָה का संदर्भगत अर्थ दृढ़ निष्ठा या विश्वासयोग्यता हो सकता है। यह चयन नैतिक विरोध—घमंडी की टेढ़ी भीतरी दशा और धर्मी की स्थिर निष्ठा—को बनाए रखता है, बिना नए नियम के उद्धरणों से अर्थ को पूर्वनिर्धारित किए।
- issue: स्वामित्ववाचक प्रत्यय וֹ का संदर्भ
  choice: धर्मी की अपनी विश्वासयोग्यता
  alternative: परमेश्वर की विश्वासयोग्यता
  rationale: व्याकरण की निकटतम और सहज संगति 'धर्मी' से है; फिर भी पद का व्यापक धर्मवैज्ञानिक प्रयोग अन्य व्याख्याओं को जन्म देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। पहले खंड में 'मन' भीतरी व्यक्ति को स्वाभाविक ढंग से व्यक्त करता है; दूसरे खंड में 'विश्वासयोग्यता' मूल की निष्ठा/दृढ़ता को सुरक्षित रखती है।
