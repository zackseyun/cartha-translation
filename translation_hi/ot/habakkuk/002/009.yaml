base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/009.yaml
  text: Woe to him who gains evil profit for his house, to set his nest on high, to escape from the grasp of harm.
translation:
  language: hi
  text: हाय उस पर जो अपने घर के लिए बुरी कमाई करता है, ताकि अपना घोंसला ऊँचाई पर रखे और अनिष्ट[a] के हाथ से बच निकले!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुराई” या “विपत्ति।”
    reason: इब्रानी רָע का अर्थ प्रसंगानुसार बुराई, अनिष्ट या विपत्ति हो सकता है।
lexical_decisions:
- source_word: בֹּצֵעַ בֶּצַע רָע
  choice: बुरी कमाई करता है
  rationale: यह पदबंध अनुचित या हानिकारक लाभ अर्जित करने का भाव देता है। ‘बुरी कमाई’ मूल के नैतिक मूल्यांकन को बनाए रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: לְבֵיתוֹ
  choice: अपने घर के लिए
  rationale: בַּיִת का अर्थ घर, परिवार या राजवंश तक हो सकता है। ‘घर’ मूल की व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: לָשׂוּם בַּמָּרוֹם קִנּוֹ
  choice: ताकि अपना घोंसला ऊँचाई पर रखे
  rationale: घोंसले का रूपक और उद्देश्यसूचक रचना दोनों सुरक्षित हैं; ऊँचाई सुरक्षा और पहुँच से बाहर होने की धारणा व्यक्त करती है।
- source_word: מִכַּף רָע
  choice: विपत्ति की पकड़ से
  rationale: כַּף का मूल अर्थ हथेली/हाथ है और यहाँ अधिकार या पकड़ का बिंब है। इस संदर्भ में רָע आने वाले अनिष्ट या विपत्ति को दर्शा सकता है।
theological_decisions:
- issue: पद के अंतिम רָע का अर्थ
  choice: मुख्य पाठ में ‘विपत्ति’, और पादटिप्पणी में ‘बुराई’
  alternative: बुराई की पकड़ से
  rationale: इब्रानी शब्द नैतिक बुराई और अनिष्ट/विपत्ति दोनों का अर्थ दे सकता है। प्रसंग में संकट से बचने की कोशिश प्रमुख है, पर वैकल्पिक नैतिक अर्थ भी पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘हाय उस पर’ भविष्यद्वाणी की धिक्कार-घोषणा को व्यक्त करता है, जबकि ‘घोंसला’ और ‘पकड़’ जैसे मूल रूपक बनाए गए हैं।
