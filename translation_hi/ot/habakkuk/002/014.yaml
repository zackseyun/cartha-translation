  text: For the earth will be filled with the knowledge of the glory of Yahweh[a], as the waters cover the sea.
translation:
  language: hi
  text: क्योंकि पृथ्वी[b] यहोवा[a] की महिमा के ज्ञान से भर जाएगी, जैसे जल समुद्र को ढक लेता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम יהוה (य्ह्व्ह) है, जिसे यहाँ ‘यहोवा’ लिखा गया है।
    reason: divine_name
  - marker: b
    text: या, ‘देश’ अथवा ‘भूमि।’ यहाँ समुद्र को ढकने वाले जल की उपमा के व्यापक संदर्भ में ‘पृथ्वी’ चुना गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले न्याय-वचन का कारण या आधार प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस संयोजक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תִּמָּלֵא
  choice: भर जाएगी
  rationale: निफ़अल अपूर्ण रूप भावी निष्क्रिय/परिणामात्मक अर्थ देता है; ‘भर जाएगी’ इसे सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: אֶרֶץ का अर्थ ‘देश/भूमि’ भी हो सकता है, पर समुद्र के व्यापक बिंब के साथ यहाँ सार्वभौमिक विस्तार अधिक उपयुक्त है।
- source_word: לָדַעַת אֶת כְּבוֹד
  choice: महिमा के ज्ञान से
  rationale: מלא के साथ ל + infinitive construct को यहाँ संज्ञात्मक अर्थ में ‘ज्ञान से भरना’ समझना स्वाभाविक है; यह जानने की क्रिया और उसके विषय, दोनों को बनाए रखता है।
- source_word: כְּבוֹד
  choice: महिमा
  rationale: यहोवा के संदर्भ में כבוד के भार, वैभव और प्रकट गौरव को व्यक्त करने वाला प्रचलित और गरिमापूर्ण हिन्दी शब्द है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित रूप द्वारा परमेश्वर के व्यक्तिगत नाम को शीर्षक से प्रतिस्थापित किए बिना रखा गया है।
- source_word: כַּמַּיִם יְכַסּוּ עַל יָם
  choice: जैसे जल समुद्र को ढके रहता है
  rationale: तुलना को स्वाभाविक हिन्दी में व्यक्त किया गया है; अपूर्ण क्रिया का सामान्य/निरंतर भाव ‘ढके रहता है’ से स्पष्ट होता है, जबकि עַל को हिन्दी कर्म-विन्यास में सहज बनाया गया है।
theological_decisions:
- issue: הָאָרֶץ का विस्तार
  choice: सार्वभौमिक ‘पृथ्वी’
  alternative: स्थानीय ‘देश’ या ‘भूमि’
  rationale: शब्द दोनों अर्थ दे सकता है, किंतु समुद्र को ढकने वाले जल की तुलना यहाँ व्यापक, संभवतः सार्वभौमिक क्षितिज की ओर संकेत करती है। वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: लोगों का ज्ञान या ज्ञान की व्यापकता
  choice: ‘महिमा के ज्ञान से’ भरना
  alternative: ‘महिमा को जानने के लिए’ भरना
  rationale: לָדַעַת का अधिक शाब्दिक रूप उद्देश्यसूचक समझा जा सकता है, पर מלא के साथ प्रसंगगत निर्माण ज्ञान की व्यापक उपस्थिति को व्यक्त करता है; अनुवाद अनावश्यक रूप से यह निर्धारित नहीं करता कि ज्ञान केवल सूचना है या अनुभवात्मक पहचान।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। ‘ऐसी…जैसे’ से भविष्यवाणी और उपमा का संबंध स्पष्ट किया गया है। मुख्य पाठ में सार्वभौमिक ‘पृथ्वी’ चुना गया है; स्थानीय अर्थ की वास्तविक शब्दार्थ-संभावना निर्णय-विवरण में सुरक्षित है।
