  text: מָֽה הוֹעִ֣יל פֶּ֗סֶל כִּ֤י פְסָל/וֹ֙ יֹֽצְר֔/וֹ מַסֵּכָ֖ה וּ/מ֣וֹרֶה שָּׁ֑קֶר כִּ֣י בָטַ֞ח יֹצֵ֤ר יִצְר/וֹ֙ עָלָ֔י/ו לַ/עֲשׂ֖וֹת אֱלִילִ֥ים אִלְּמִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/018.yaml
  text: What profit is an idol when its maker has carved it— a cast image and a teacher of lies? For the one who formed it trusts in it[d][c][b][a], making mute idols.
translation:
  language: hi
  text: मूर्ति से क्या लाभ, कि उसके बनानेवाले ने उसे तराशा है—वह ढली हुई प्रतिमा और झूठ की शिक्षिका है?[a] क्योंकि उसका बनानेवाला अपनी बनाई हुई वस्तु पर भरोसा रखता है, गूँगी देव-मूर्तियाँ बनाने के लिए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “झूठ की शिक्षिका”; यहाँ मूर्ति का मानवीकरण किया गया है।
    reason: lexical_alternative
  - marker: b
    text: “देव-मूर्तियाँ” के लिए प्रयुक्त हिब्रू शब्द में “निकम्मी वस्तुएँ” या “शून्य वस्तुएँ” का तिरस्कारपूर्ण भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הוֹעִיל
  choice: क्या लाभ
  rationale: प्रश्नवाचक पद और יעל के हिफ़ील रूप का आशय उपयोगिता या लाभ पर तीखा आलंकारिक प्रश्न करना है।
- source_word: פֶּסֶל
  choice: मूर्ति
  rationale: यह तराशी हुई उपासना-प्रतिमा को सूचित करता है; अगले क्रियापद में तराशने का भाव स्पष्ट होने से सहज हिन्दी में ‘मूर्ति’ पर्याप्त और स्वाभाविक है।
- source_word: כִּי פְסָלוֹ יֹצְרוֹ
  choice: जब उसे उसके गढ़नेवाले ने ही तराशा है
  rationale: כִּי यहाँ मूर्ति के मनुष्य-निर्मित होने की विडंबना स्पष्ट करता है। ‘ही’ उस व्यंग्यात्मक बल को स्वाभाविक हिन्दी में उभारता है।
- source_word: מַסֵּכָה
  choice: ढली हुई प्रतिमा
  rationale: शब्द साँचे में ढालकर बनाई गई, सामान्यतः धातु की, प्रतिमा को दर्शाता है।
- source_word: וּמוֹרֶה שָּׁקֶר
  choice: झूठ सिखानेवाली
  rationale: हिब्रू में मूर्ति को मानवीकृत करके ‘झूठ का शिक्षक’ कहा गया है। स्त्रीलिंग रूप ‘प्रतिमा’ के अनुरूप है और रूपक को बनाए रखता है।
- source_word: יֹצֵר יִצְרוֹ
  choice: उसका रचनेवाला
  rationale: मूल में बनानेवाले और उसकी बनाई वस्तु के लिए एक ही धातु से बने शब्द हैं। हिन्दी में ‘रचनेवाला’ कर्ता को स्पष्ट करता है, जबकि ‘उसी’ उसकी रची वस्तु पर भरोसे की विडंबना बनाए रखता है।
- source_word: עָלָיו
  choice: उसी पर
  rationale: בטח के साथ पूर्वसर्ग भरोसे के लक्ष्य को व्यक्त करता है; ‘उसी पर’ हिन्दी में स्वाभाविक है और मूर्ति पर बल देता है।
- source_word: אֱלִילִים אִלְּמִים
  choice: गूँगी देव-मूर्तियाँ
  rationale: אֱלִילִים झूठे अथवा मूल्यहीन उपास्य देवों की प्रतिमाओं को और אִלְּמִים उनके बोल न सकने को दर्शाता है। ‘देव-मूर्तियाँ’ बहुवचन और धार्मिक संदर्भ दोनों स्पष्ट करता है।
theological_decisions:
- issue: ‘झूठ सिखानेवाली’ का संकेत किसकी ओर है
  choice: यह पद ढली हुई प्रतिमा का मानवीकरण करता है, मानो वह अपने उपासकों को झूठ सिखाती हो।
  alternative: इसे कारीगर अथवा किसी झूठे धार्मिक शिक्षक के लिए समझना।
  rationale: वाक्य-विन्यास में מוֹרֶה שָּׁקֶר, מַסֵּכָה के साथ उसी मूर्ति का दूसरा वर्णन सबसे स्वाभाविक रूप से बनता है; इसलिए भविष्यद्वक्ता का व्यंग्य सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘गढ़नेवाले/तराशा’ और ‘रचनेवाला/बनाता’ के द्वारा मूल की कारीगरी-संबंधी पुनरुक्ति तथा व्यंग्य आंशिक रूप से सुरक्षित हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
