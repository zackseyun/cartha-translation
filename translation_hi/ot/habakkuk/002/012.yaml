  rationale: संशोधन रक्तपात के व्यापक, साधनात्मक अर्थ को सुरक्षित रखता है, हिन्दी वाक्य-विन्यास को सहज बनाता है, और “स्थापना करता है” के द्वारा दूसरे इब्रानी क्रियापद का ‘स्थापित/दृढ़ करने’ का भाव अधिक निकटता से व्यक्त करता है। पादटिप्पणी-चिह्न और दोनों पादटिप्पणियाँ सुरक्षित रखी गई हैं।
