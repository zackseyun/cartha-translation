  text: ה֛וֹי בֹּנֶ֥ה עִ֖יר בְּ/דָמִ֑ים וְ/כוֹנֵ֥ן קִרְיָ֖ה בְּ/עַוְלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/012.yaml
  text: Woe to him who builds a city with bloodshed and establishes a town by injustice[a][b].
translation:
  language: hi
  text: हाय उस पर जो रक्तपात से नगर बनाता है और अन्याय से शहर की स्थापना करता है![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “खूनों से”; यह रक्तपात या रक्त-दोष के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: “शहर की स्थापना करता है” का अनुवाद “नगर बसाता है” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: हाय उस पर
  rationale: यह न्याय की भविष्यवाणी आरम्भ करने वाला धिक्कार और शोक का उद्गार है; ‘हाय उस पर’ आधुनिक हिन्दी में इसकी भविष्यसूचक कठोरता बनाए रखता है।
- source_word: בֹּנֶה
  choice: जो ... बनाता
  rationale: कर्ता के रूप में प्रयुक्त कालवाचक कृदन्त को हिन्दी के स्वाभाविक संबंधवाचक वाक्यांश से व्यक्त किया गया है।
- source_word: עִיר
  choice: नगर
  rationale: यह शहर के लिए सामान्य शब्द है; समानार्थी קִרְיָה से काव्यात्मक भिन्नता बनाए रखने हेतु ‘नगर’ चुना गया है।
- source_word: בְּדָמִים
  choice: खून बहाकर
  rationale: शाब्दिक बहुवचन ‘खूनों से’ रक्तपात अथवा रक्त-दोष का मुहावरा है; ‘खून बहाकर’ साधन और हिंसा दोनों को स्पष्ट तथा स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְכוֹנֵן
  choice: और ... बसाता है
  rationale: क्रिया का अर्थ दृढ़ता से स्थापित करना है; नगर-संदर्भ में ‘बसाता है’ सहज हिन्दी है, जबकि पादटिप्पणी में अधिक औपचारिक विकल्प सुरक्षित रखा गया है।
- source_word: קִרְיָה
  choice: शहर
  rationale: यह עִיר का निकट समानार्थी है; ‘शहर’ समानांतरता और इब्रानी की शब्दगत विविधता दोनों बनाए रखता है।
- source_word: בְּעַוְלָה
  choice: अन्याय से
  rationale: यह अनुचित या अधार्मिक आचरण को दर्शाता है और उपसर्ग בְ के साधनात्मक भाव को सीधे व्यक्त करता है।
theological_decisions:
- issue: धिक्कार का स्वरूप
  choice: हिंसा और अन्याय के द्वारा नगरीय सत्ता खड़ी करने वाले के विरुद्ध भविष्यसूचक धिक्कार
  alternative: नागरिक भ्रष्टाचार पर सामान्य विलाप
  rationale: पद रक्तपात और अन्याय को निर्माण तथा स्थापना के साधन बताकर नैतिक दोषारोपण करता है। अनुवाद इस निंदा को बनाए रखता है, पर इसे किसी बाद की विशिष्ट धर्मवैज्ञानिक व्यवस्था तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नगर/शहर’ की जोड़ी मूल के दो निकट समानार्थी शब्दों की काव्यात्मक समानांतरता दर्शाती है; ‘खून बहाकर’ स्रोत के हिंसक आशय को स्पष्ट करता है।
