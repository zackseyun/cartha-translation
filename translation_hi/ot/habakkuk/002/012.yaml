review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prophetic denunciation, civic construction, bloodshed, and injustice. However, “खून बहाकर” can imply that the builder personally sheds blood, whereas בְּדָמִים more broadly denotes bloodshed/bloodguilt as the means. “रक्तपात से” preserves the instrumental and idiomatic force more closely.
  naturalness: “हाय उस पर, जो” is understandable but the comma unnecessarily interrupts the standard Hindi relative construction. “हाय उस पर जो …” is smoother. “शहर की स्थापना करता है” is more precise and dignified than “शहर बसाता है” for כּוֹנֵן, which concerns establishing or securing a city rather than merely populating a settlement.
  terminology: “रक्तपात” is a natural modern Hindi equivalent for the Hebrew plural idiom. “नगर/शहर” appropriately retains the Hebrew pair of near-synonyms without implying a firm size distinction. “अन्याय” correctly renders עַוְלָה.
  issues:
  - severity: medium
    issue: “खून बहाकर” narrows the instrumental phrase.
    rationale: The Hebrew plural “bloods” idiom refers to bloodshed or bloodguilt. The participial subject need not be presented as personally performing every act of killing; “रक्तपात से” maintains the broader means/association.
  - severity: low
    issue: Comma and wording in “हाय उस पर, जो …” are less natural.
    rationale: 'Hindi more naturally reads the relative clause continuously: “हाय उस पर जो …”.'
  - severity: low
    issue: “बसाता है” is somewhat less exact for כּוֹנֵן.
    rationale: The verb emphasizes establishing or making firm. “शहर की स्थापना करता है” reflects this without adding interpretation.
  revised_text: हाय उस पर जो रक्तपात से नगर बनाता है और अन्याय से शहर की स्थापना करता है![a][b]
  revised_footnotes:
