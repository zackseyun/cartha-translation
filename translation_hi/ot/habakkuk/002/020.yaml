id: HAB.2.20
reference: Habakkuk 2:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יהוָ֖ה בְּ/הֵיכַ֣ל קָדְשׁ֑/וֹ הַ֥ס מִ/פָּנָ֖י/ו כָּל הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/020.yaml
  text: But Yahweh is in his holy temple[c][b][a]; let all the earth be silent before him.
translation:
  language: hi
  text: परन्तु याहवे[a] अपने पवित्र मन्दिर[b] में है; सारी पृथ्वी[c] उसके सामने चुप रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परमेश्वर के नाम को ‘यहोवा’ भी लिखा जाता है; अनेक अनुवाद यहाँ ‘प्रभु’ लिखते हैं।
    reason: alternative_reading
  - marker: b
    text: हिब्रू शब्द का अर्थ ‘राजमहल’ या ‘पवित्रस्थान’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू में ‘सारी पृथ्वी’; सन्दर्भ में इसका संकुचित अर्थ ‘सारा देश’ या ‘सारी भूमि’ भी सम्भव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: परन्तु याहवे
  rationale: वाव को पिछले पद के निर्जीव देवताओं के साथ विरोध दिखाने के लिए ‘परन्तु’ कहा गया है। परमेश्वर के निजी वाचा-नाम יהוה को ‘याहवे’ के रूप में लिप्यन्तरित किया गया है।
- source_word: בְּהֵיכַל קָדְשׁוֹ
  choice: अपने पवित्र मन्दिर में है
  rationale: हिब्रू का वाक्य क्रियारहित है; स्वाभाविक हिन्दी में ‘है’ जोड़ा गया है। הֵיכָל का अर्थ मन्दिर, राजमहल या पवित्रस्थान हो सकता है; यहाँ उपासना-संबंधी सन्दर्भ में ‘मन्दिर’ उपयुक्त है।
- source_word: הַס
  choice: चुप रहे
  rationale: यह श्रद्धापूर्ण मौन की आज्ञा देने वाला उद्गार है। ‘चुप रहे’ संक्षिप्त, स्वाभाविक और आदेशात्मक बल को सुरक्षित रखता है।
- source_word: מִפָּנָיו
  choice: उसके सामने
  rationale: शाब्दिक अर्थ ‘उसके मुख/उपस्थिति के सामने’ है; ‘उसके सामने’ आधुनिक हिन्दी में उसकी उपस्थिति और उसके प्रति श्रद्धा दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָּל הָאָרֶץ
  choice: सारी पृथ्वी
  rationale: אָרֶץ का अर्थ ‘पृथ्वी’ या ‘देश/भूमि’ हो सकता है। इस चरम सार्वभौमिक आह्वान में ‘सारी पृथ्वी’ अधिक उपयुक्त है, जबकि संकुचित अर्थ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा-नाम सीधे प्रयुक्त है। उसका लिप्यन्तरण नाम की विशिष्टता बनाए रखता है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: הֵיכָל में परमेश्वर के निवास का आशय
  choice: मन्दिर
  alternative: राजमहल; पवित्रस्थान
  rationale: ‘मन्दिर’ उपासना और पवित्रता के प्रसंग को बनाए रखता है, पर यह निश्चित नहीं करता कि यहाँ केवल पृथ्वी का मन्दिर अभिप्रेत है या स्वर्गीय निवास; मूल की यह खुली अर्थ-सम्भावना सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘मन्दिर’ का प्रचलित रूप अपनाया गया है। अर्धविराम मूल पद के दो परस्पर जुड़े कथनों—याहवे की पवित्र उपस्थिति और समस्त पृथ्वी को मौन रहने की आज्ञा—को स्पष्ट करता है।
