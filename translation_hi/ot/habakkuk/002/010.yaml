reference: Habakkuk 2:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יָעַ֥צְתָּ בֹּ֖שֶׁת לְ/בֵיתֶ֑/ךָ קְצוֹת עַמִּ֥ים רַבִּ֖ים וְ/חוֹטֵ֥א נַפְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/010.yaml
  text: You have devised shame for your house by cutting off many peoples[a], and have sinned against your own life.
translation:
  language: hi
  text: तूने बहुत-से जनसमूहों का नाश करके अपने घर के लिए लज्जा की योजना बनाई है, और अपने ही जीवन[a] के विरुद्ध पाप किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने ही प्राण” अथवा “स्वयं।”
    reason: נֶפֶשׁ के ‘जीवन,’ ‘प्राण’ और ‘स्वयं’ अर्थ सम्भव हैं।
lexical_decisions:
- source_word: יָעַצְתָּ
  choice: तूने ... योजना बनाई है
  rationale: यह יעץ का काल पूर्ण, द्वितीय पुरुष एकवचन रूप है। संदर्भ में इसका अर्थ जानबूझकर कोई विनाशकारी योजना बनाना है; इसलिए सामान्य ‘सलाह देना’ की अपेक्षा ‘योजना बनाना’ अधिक उपयुक्त है।
- source_word: בֹּשֶׁת
  choice: लज्जा
  rationale: यह शब्द नैतिक अपमान और सार्वजनिक बदनामी दोनों को व्यक्त कर सकता है। ‘लज्जा’ संक्षिप्त और गरिमापूर्ण है।
- source_word: לְבֵיתֶךָ
  choice: अपने घर के लिए
  rationale: בַּיִת घर, परिवार या वंश को सूचित कर सकता है। ‘घर’ इस अर्थ-विस्तार को किसी एक अर्थ तक सीमित नहीं करता।
- source_word: קְצוֹת
  choice: नाश करके
  rationale: इस संदर्भ में क्रिया का अर्थ बहुत-से जनसमूहों को समाप्त करना या मिटा देना है। ‘नाश करके’ हिन्दी में स्वाभाविक रूप से इसके साधनात्मक संबंध को भी स्पष्ट करता है।
- source_word: עַמִּים רַבִּים
  choice: बहुत-से जनसमूहों
  rationale: עַמִּים अलग-अलग peoples को सूचित करता है। ‘जनसमूहों’ आधुनिक राष्ट्र-राज्य का अर्थ आरोपित किए बिना सामूहिक बहुवचन को बनाए रखता है।
- source_word: וְחוֹטֵא
  choice: और ... पाप किया है
  rationale: पूर्ववर्ती पूर्ण क्रिया के बाद आया यह कृदन्त क्रमिक मौखिक आरोप की तरह काम करता है। हिन्दी में समान पूर्ण क्रिया से इसे व्यक्त करना स्पष्ट और स्वाभाविक है।
- source_word: נַפְשֶׁךָ
  choice: अपने ही जीवन
  rationale: נֶפֶשׁ का अर्थ जीवन, प्राण या स्वयं व्यक्ति हो सकता है। न्याय के इस संदर्भ में ‘अपने ही जीवन’ अपराध की आत्म-विनाशकारी दिशा स्पष्ट करता है, जबकि ‘ही’ आत्म-संदर्भ पर बल देता है।
theological_decisions:
- issue: भविष्यद्वाणी के न्याय-संदर्भ में נֶפֶשׁ का अर्थ
  choice: जीवन
  alternative: प्राण; स्वयं
  rationale: पद हिंसा के अपराधी पर ही लौट आने वाले विनाश को दर्शाता है। ‘जीवन’ ठोस परिणाम को स्पष्ट करता है और मनुष्य की प्रकृति के बारे में बाद की किसी तकनीकी धारणा को पाठ में नहीं जोड़ता; अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गंभीर और भविष्यद्वाणी-सुलभ संबोधन रखा गया है। एकवचन अपराधी को सम्बोधित करने के लिए ‘तू’ मूल इब्रानी के सीधे और कठोर स्वर को बनाए रखता है।
