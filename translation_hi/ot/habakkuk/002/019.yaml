  text: ה֣וֹי אֹמֵ֤ר לָ/עֵץ֙ הָקִ֔יצָ/ה ע֖וּרִי לְ/אֶ֣בֶן דּוּמָ֑ם ה֣וּא יוֹרֶ֔ה הִנֵּה ה֗וּא תָּפוּשׂ֙ זָהָ֣ב וָ/כֶ֔סֶף וְ/כָל ר֖וּחַ אֵ֥ין בְּ/קִרְבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/019.yaml
  text: Woe to the one who says to wood[a], “Wake up!” and to silent stone, “Arise!” Can it teach? Look— it is overlaid with gold and silver, yet there is no breath at all within it.
translation:
  language: hi
  text: हाय उस पर जो लकड़ी से कहता है, “जाग उठ!” और मौन पत्थर से, “उठ!” क्या वह सिखा सकता है? देखो, वह सोने और चाँदी से मढ़ा हुआ है, फिर भी उसके भीतर कोई साँस[a] भी नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आत्मा’। इब्रानी शब्द का अर्थ ‘साँस’, ‘हवा’ या ‘आत्मा’ हो सकता है। यहाँ इससे इस बात पर बल पड़ता है कि मूर्ति के भीतर जीवन नहीं है।
    reason: इब्रानी רוּחַ की वास्तविक अर्थगत व्यापकता को सुरक्षित रखना।
lexical_decisions:
- source_word: הוֹי
  choice: हाय उस पर
  rationale: यह भविष्यवाणी की निंदा और आने वाले न्याय की घोषणा है; यह प्रयोग आधुनिक हिन्दी में उस गंभीर चेतावनी को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לָעֵץ
  choice: लकड़ी से
  rationale: यहाँ पेड़ नहीं, मूर्ति बनाने की निर्जीव सामग्री अभिप्रेत है; ‘लकड़ी’ पत्थर के समानांतर भौतिक पदार्थ के अर्थ को बनाए रखती है।
- source_word: הָקִיצָה
  choice: जाग उठ!
  rationale: निर्जीव मूर्ति को संबोधित आज्ञा की विडंबना और काव्यात्मक तीव्रता दोनों सुरक्षित रहती हैं।
- source_word: עוּרִי
  choice: उठ!
  rationale: दूसरी आज्ञा पहली के समानांतर है, पर अलग क्रिया रखकर मूल की काव्यात्मक विविधता बचाई गई है।
- source_word: לְאֶבֶן דּוּמָם
  choice: चुप पत्थर से
  rationale: דּוּמָם पत्थर की मौनता और बोलने में असमर्थता बताता है; ‘चुप पत्थर’ संक्षिप्त, सहज और व्यंग्यपूर्ण है।
- source_word: הוּא יוֹרֶה
  choice: क्या वह शिक्षा देगा?
  rationale: संदर्भ में यह आलंकारिक प्रश्न है, जो निर्जीव मूर्ति से मार्गदर्शन पाने की मूर्खता उजागर करता है; भविष्यत् रूप मूल के अपूर्ण क्रिया-रूप की खुली कालिक छाया भी रखता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह मूर्ति की प्रत्यक्ष विडंबना की ओर ध्यान खींचता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: תָּפוּשׂ זָהָב וָכֶסֶף
  choice: सोने और चाँदी से मढ़ा हुआ
  rationale: यह मूर्ति पर बहुमूल्य धातुओं की परत चढ़ाए जाने का कारीगरी-संबंधी अर्थ स्पष्ट और सटीक रूप से व्यक्त करता है।
- source_word: וְכָל רוּחַ אֵין בְּקִרְבּוֹ
  choice: फिर भी उसके भीतर कोई साँस नहीं है
  rationale: यहाँ רוּחַ मूर्ति के निर्जीव होने पर बल देता है। ‘कोई ... नहीं’ כָל के पूर्ण निषेध को व्यक्त करता है, जबकि पाद-टिप्पणी ‘आत्मा’ की अर्थ-संभावना सुरक्षित रखती है।
theological_decisions:
- issue: अंतिम वाक्यांश में רוּחַ का अर्थ
  choice: साँस
  alternative: आत्मा
  rationale: मूर्ति-विरोधी संदर्भ में मुख्य बात यह है कि मूर्ति में जीवन नहीं है। ‘साँस’ जीवनदायी श्वास का ठोस अर्थ स्पष्ट करती है, जबकि ‘आत्मा’ की वास्तविक शाब्दिक संभावना पाद-टिप्पणी में रखी गई है और किसी विशिष्ट आध्यात्मिक मानव-विज्ञान को पाठ पर आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूर्ति को दी गई आज्ञाओं की विडंबना और भविष्यवाणी की निंदात्मक धार सुरक्षित है। पाद-टिप्पणी का चिह्न उसी शब्द ‘साँस’ पर रखा गया है जिससे वह वास्तव में संबंधित है।
