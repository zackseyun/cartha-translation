  text: וַ/יְהִי֙ בַּ/חֲצִ֣י הַ/לַּ֔יְלָה וַ/יֶּחֱרַ֥ד הָ/אִ֖ישׁ וַ/יִּלָּפֵ֑ת וְ/הִנֵּ֣ה אִשָּׁ֔ה שֹׁכֶ֖בֶת מַרְגְּלֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/008.yaml
  text: And it happened at midnight that the man trembled and turned himself[a], and behold[b], a woman was lying at his feet.
translation:
  language: hi
  text: आधी रात को ऐसा हुआ कि वह पुरुष काँप उठा और मुड़ा[a]; और देखो, एक स्त्री उसके पैरों के पास[b] लेटी हुई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस दुर्लभ इब्रानी क्रिया का ठीक अर्थ अनिश्चित है; इसका आशय चौंककर मुड़ना, पलटना, ऐंठना या झुकना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘उसके पैरों के पास’ है; इब्रानी अभिव्यक्ति पैरों या निचली टांगों के आसपास के स्थान को अधिक व्यापक रूप से भी सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ऐसा हुआ
  rationale: यह कथात्मक क्रम में अगली घटना प्रस्तुत करता है; आधुनिक हिन्दी में स्वाभाविक रहते हुए इब्रानी की घटना-सूचक शैली को बनाए रखता है।
- source_word: בַּחֲצִי הַלַּיְלָה
  choice: आधी रात को
  rationale: शाब्दिक अर्थ ‘रात के मध्य में’ है; ‘आधी रात को’ इसका संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: וַיֶּחֱרַד
  choice: काँप उठा
  rationale: क्रिया भय, चौंकने या अचानक व्याकुल होने से उत्पन्न शारीरिक कंपकंपी बता सकती है; ‘काँप उठा’ प्रतिक्रिया को रखता है और कारण को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הָאִישׁ
  choice: वह पुरुष
  rationale: संदर्भ में यह बोअज़ को सूचित करता है। ‘वह पुरुष’ पूर्वपरिचित पात्र का संकेत देता है और मूल संज्ञा के निकट है।
- source_word: וַיִּלָּפֵת
  choice: मुड़ा
  rationale: यह दुर्लभ और अर्थ की दृष्टि से कठिन क्रिया है; प्रसंग में शरीर के मुड़ने, पलटने या ऐंठने जैसी गति संभव है। ‘मुड़ा’ सावधान और पठनीय चयन है, जबकि पादटिप्पणी अनिश्चितता सुरक्षित रखती है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह अचानक ध्यान जाने या आश्चर्यपूर्ण खोज का संकेत देता है; ‘और देखो’ आधुनिक हिन्दी में उसका कथात्मक बल बनाए रखता है।
- source_word: אִשָּׁה
  choice: एक स्त्री
  rationale: यहाँ संज्ञा का सामान्य अर्थ ‘स्त्री’ है; ‘पत्नी’ कहना प्रसंग से असंगत होगा।
- source_word: שֹׁכֶבֶת
  choice: लेटी हुई थी
  rationale: कृदंत उस समय स्त्री की जारी अवस्था या मुद्रा दिखाता है; ‘लेटी हुई थी’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַרְגְּלֹתָיו
  choice: उसके पैरों की ओर
  rationale: यह रूप पैरों अथवा पैरों के स्थान/क्षेत्र को सूचित कर सकता है। ‘पैरों की ओर’ स्थानगत अर्थ देता है और किसी अनावश्यक यौनार्थ को मुख्य पाठ में आरोपित नहीं करता।
theological_decisions:
- issue: दृश्य को यौन अथवा व्यंजनापूर्ण अर्थ में पढ़ने की संभावना
  choice: रूत को सीधे-सादे ढंग से उस पुरुष के पैरों की ओर लेटी हुई बताया गया है।
  alternative: ‘उसके पैरों/निचले पैरों के स्थान पर’ जैसे अधिक संकेतपूर्ण शब्दों द्वारा संभावित व्यंजना को उभारना।
  rationale: इब्रानी पाठ स्पष्ट रूप से किसी यौन क्रिया का वर्णन नहीं करता। इसलिए अनुवाद कथात्मक तनाव और स्थान-संबंधी शब्द की व्यापकता बनाए रखता है, पर ऐसा नैतिक या यौन निष्कर्ष नहीं जोड़ता जो पाठ स्वयं नहीं कहता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘और देखो’ मूल के आकस्मिक खोज-बोध को कुछ ऊँचे किंतु समझने योग्य कथात्मक स्वर में सुरक्षित रखता है। दुर्लभ क्रिया और स्थान-सूचक पद की वास्तविक अस्पष्टता पादटिप्पणियों में स्पष्ट की गई है।
