  yaml_path: translation/ot/ruth/003/003.yaml
  text: Wash yourself[a], anoint yourself, and put your cloak on; then go down to the threshing floor[c][b]. Do not make yourself known to the man until he has finished eating and drinking.
translation:
  language: hi
  text: स्नान कर लो[a], अपने शरीर पर तेल लगाओ और अपना बाहरी वस्त्र पहन लो[b]; फिर खलिहान में नीचे जाओ[c]। जब तक वह पुरुष खा-पी न चुका हो, तब तक उस पुरुष को अपने को प्रकट मत करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने आपको धो लो।” इब्रानी क्रिया शरीर धोने या स्नान करने—दोनों अर्थों में प्रयुक्त हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “अपना वस्त्र पहन लो।” इब्रानी शब्द सामान्य रूप से किसी वस्त्र या बाहरी ओढ़ने के कपड़े को दर्शाता है; कुछ अनुवाद इसे अधिक विशिष्ट रूप से उत्सव के या सबसे अच्छे कपड़े मानते हैं।
    reason: lexical_alternative
  - marker: c
    text: 'यहाँ इब्रानी व्यंजन-पाठ का रूप असामान्य है; संदर्भ में इसे सामान्यतः रूत को दिया गया नाओमी का अगला निर्देश समझा जाता है: “खलिहान में नीचे जाओ।”'
    reason: textual_variant
lexical_decisions:
- source_word: וְרָחַצְתְּ
  choice: नहा-धो लो
  rationale: רחץ शरीर धोने या स्नान करने को दर्शा सकता है। ‘नहा-धो लो’ आधुनिक हिन्दी में स्वाभाविक है और शरीर को तैयार करने का भाव स्पष्ट करता है।
- source_word: וָסַכְתְּ
  choice: अपने शरीर पर तेल लगाओ
  rationale: סוך का सामान्य अर्थ तेल या मरहम लगाना है। यह ‘इत्र लगाओ’ की अपेक्षा स्रोत के अधिक निकट और सामान्य पाठक के लिए स्पष्ट है।
- source_word: וְשַׂמְתְּ שמלתך עָלַיִךְ
  choice: अपना ओढ़ना पहन लो
  rationale: שִׂמְלָה सामान्यतः वस्त्र, विशेषकर बाहरी वस्त्र या ओढ़ने के कपड़े को सूचित करता है। ‘ओढ़ना’ बाहरी वस्त्र का भाव रखता है और ‘सबसे अच्छे कपड़े’ जैसी अनकही व्याख्या नहीं जोड़ता।
- source_word: וירדתי הַגֹּרֶן
  choice: फिर खलिहान में उतर जाओ
  rationale: व्यंजन-पाठ का रूप असामान्य है, पर संदर्भ में इसे रूत को दिया गया स्त्रीलिंग एकवचन निर्देश समझा जाता है। גֹּרֶן के लिए ‘खलिहान’ प्रचलित और सटीक हिन्दी शब्द है।
- source_word: אַל תִּוָּדְעִי
  choice: अपने आपको उस पर प्रकट न करना
  rationale: ידע के निफ़अल रूप में यहाँ स्वयं को ज्ञात या प्रकट करने का भाव है। यह अनदेखे रहने की रूत की जिम्मेदारी और इब्रानी मुहावरे दोनों को बनाए रखता है।
- source_word: לָאִישׁ
  choice: उस पुरुष पर
  rationale: इब्रानी में बोअज़ का नाम नहीं, बल्कि संदर्भ के विशिष्ट पुरुष का उल्लेख है। ‘उस पुरुष’ स्रोत की अभिव्यक्ति को बनाए रखता है।
- source_word: עַד כַּלֹּתוֹ לֶאֱכֹל וְלִשְׁתּוֹת
  choice: जब तक वह पुरुष खा-पी न चुके
  rationale: כלה के साथ क्रियारूप कार्य के पूरा होने को व्यक्त करते हैं। ‘खा-पी न चुके’ हिन्दी में स्वाभाविक रूप से यही कालिक पूर्णता दर्शाता है।
