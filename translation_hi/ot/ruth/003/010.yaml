  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר בְּרוּכָ֨ה אַ֤תְּ לַֽ/יהוָה֙ בִּתִּ֔/י הֵיטַ֛בְתְּ חַסְדֵּ֥/ךְ הָ/אַחֲר֖וֹן מִן הָ/רִאשׁ֑וֹן לְ/בִלְתִּי לֶ֗כֶת אַחֲרֵי֙ הַ/בַּ֣חוּרִ֔ים אִם דַּ֖ל וְ/אִם עָשִֽׁיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/010.yaml
  text: And he said[a], “May you be blessed by Yahweh, my daughter. You have made this last kindness greater than the first by not going after the young men, whether poor or rich.”
translation:
  language: hi
  text: उसने कहा, “मेरी बेटी, याहवे तुम्हें आशीष दे! तुमने इस बार पहले से भी बढ़कर निष्ठा दिखाई है[a], इस बात से कि तुम जवान पुरुषों के पीछे नहीं गईं—चाहे वे निर्धन हों या धनी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “निष्ठा” के लिए आए इब्रानी शब्द חֶסֶד का अनुवाद “दयालुता,” “अटल प्रेम,” या “निष्ठावान प्रेम” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוּכָה אַתְּ לַיהוָה
  choice: याहवे तुम्हें आशीष दे
  rationale: स्त्रीलिंग विशेषण בְּרוּכָה और לַיהוָה मिलकर आशीर्वाद-सूचक सूत्र बनाते हैं। हिंदी में यह कामना-वाचक रूप स्वाभाविक है और याहवे के व्यक्तिगत नाम को सुरक्षित रखता है।
- source_word: בִּתִּי
  choice: मेरी बेटी
  rationale: यह बोअज़ की ओर से आयु और सामाजिक वरिष्ठता दर्शाने वाला स्नेहपूर्ण संबोधन है; पारिवारिक रूपक को ज्यों का त्यों रखता है।
- source_word: הֵיטַבְתְּ חַסְדֵּךְ הָאַחֲרוֹן מִן הָרִאשׁוֹן
  choice: तुमने पहले से बढ़कर अब निष्ठा दिखाई है
  rationale: हिफ़ील הֵיטַבְתְּ और מן-वाली तुलना रूत के वर्तमान חֶסֶד को उसके पहले कार्य से श्रेष्ठ बताती है। हिंदी में यह रूप तुलना को स्पष्ट और सहज रखता है।
- source_word: חַסְדֵּךְ
  choice: निष्ठा
  rationale: यहाँ חֶסֶד रूत की नाओमी और उसके परिवार के प्रति ठोस, संबंधपरक वफ़ादारी और भलाई को व्यक्त करता है। ‘निष्ठा’ प्रसंग में केवल सामान्य दयालुता से अधिक उपयुक्त है; अन्य अर्थ फुटनोट में दिए गए हैं।
- source_word: לְבִלְתִּי לֶכֶת אַחֲרֵי
  choice: क्योंकि तुम ... के पीछे नहीं गईं
  rationale: अनन्त क्रिया-रचना बताती है कि वर्तमान निष्ठा किस प्रकार प्रकट हुई। ‘पीछे जाना’ विवाह-संबंधी विकल्प अपनाने की मूल इब्रानी छवि को बनाए रखता है।
- source_word: הַבַּחוּרִים
  choice: किसी जवान पुरुष
  rationale: बहुवचन का आशय संभावित युवा विवाह-योग्य पुरुषों से है। ‘किसी ... पुरुष’ के साथ गरीब-धनी का एकवचन वितरण हिंदी में स्वाभाविक है और पूरे वर्ग को समेटता है।
- source_word: אִם דַּל וְאִם עָשִׁיר
  choice: चाहे वह गरीब हो या धनी
  rationale: यह दोनों आर्थिक सिरों का उल्लेख करके सभी संभावित जवान पुरुषों को समेटता है। ‘गरीब’ और ‘धनी’ सीधे तथा सामान्य हिंदी शब्द हैं।
theological_decisions:
- issue: कथात्मक प्रशंसा में חֶסֶד का अर्थ
  choice: निष्ठा
  alternative: दयालुता; अटल प्रेम; विश्वासयोग्यता
  rationale: बोअज़ रूत की ऐसी संबंधपरक वफ़ादारी की प्रशंसा करता है जो नाओमी के परिवार की भलाई और वंश की निरंतरता चाहती है, न कि केवल व्यक्तिगत रोमानी या आर्थिक लाभ। ‘निष्ठा’ इस प्रसंगगत बल को व्यक्त करती है, जबकि शब्द की अर्थ-समृद्धि फुटनोट में सुरक्षित है।
- issue: יְהוָה का निरूपण
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत चतुरक्षरीय नाम है। ‘याहवे’ शीर्षक से प्रतिस्थापित किए बिना उस नाम को लिप्यंतरित करता है।
translation_notes:
  register: आधुनिक मानक हिंदी; बोअज़ का संबोधन स्नेहपूर्ण और गरिमापूर्ण रखा गया है। वाक्य को सामान्य पाठक के लिए सहज बनाया गया है, साथ ही ‘पीछे जाना’ की मूल छवि और חֶסֶד की अर्थगत व्यापकता सुरक्षित रखी गई है।
