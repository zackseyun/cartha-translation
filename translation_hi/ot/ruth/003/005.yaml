lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: तब उसने कहा
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है। आधुनिक हिन्दी में ‘तब’ प्रसंग का स्वाभाविक क्रम व्यक्त करता है, बिना संयोजक का अनावश्यक भार बढ़ाए।
- source_word: אֵלֶיהָ
  choice: उससे
  rationale: אֶל के साथ तृतीय पुरुष स्त्रीलिंग एकवचन प्रत्यय सम्बोधन की दिशा बताता है; ‘उससे’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כֹּל אֲשֶׁר
  choice: जो कुछ ... वह सब
  rationale: यह रचना समग्रता और सम्बन्धवाचक उपवाक्य दोनों को स्पष्ट, सहज हिन्दी में बनाए रखती है।
- source_word: תֹּאמְרִי
  choice: तू ... कहेगी
  rationale: काल अपूर्ण 2 स्त्रीलिंग एकवचन यहाँ नाओमी द्वारा दिए जाने वाले निर्देश को सूचित करता है। ‘कहेगी’ भावी निर्देश और स्त्रीलिंग सम्बोधन दोनों को स्पष्ट रखता है।
- source_word: אֶעֱשֶׂה
  choice: मैं करूँगी
  rationale: काल अपूर्ण 1 सामान्य एकवचन रूत के संकल्प या अभिप्राय को व्यक्त करता है। हिन्दी क्रिया वक्ता के स्त्रीलिंग को स्वाभाविक रूप से दर्शाती है; कोई अतिरिक्त कर्म नहीं जोड़ा गया।
