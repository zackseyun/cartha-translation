base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/009.yaml
  text: He said[a], “Who are you?” And she said, “I am Ruth, your servant. Spread your wing over your servant[b], for you are a redeemer.”
translation:
  language: hi
  text: उसने कहा, “तुम कौन हो?” उसने उत्तर दिया, “मैं आपकी दासी रूत हूँ। अपना पंख[a] अपनी दासी के ऊपर फैला दीजिए, क्योंकि आप छुड़ानेवाले संबंधी[b] हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने वस्त्र का छोर।” हिब्रू शब्द का अर्थ “पंख” या वस्त्र का छोर हो सकता है; यहाँ संरक्षण और विवाह-संबंधी निवेदन, दोनों की प्रतिध्वनि हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात ऐसा निकट संबंधी जिसे परिवार के किसी सदस्य के अधिकारों और हितों की रक्षा तथा पुनःस्थापना करने का मान्य दायित्व था।
    reason: cultural_explanation
lexical_decisions:
- source_word: מִי אָתּ
  choice: तुम कौन हो?
  rationale: सीधा पहचान-संबंधी प्रश्न है; हिन्दी संवाद में स्वाभाविक रूप रखा गया है।
- source_word: אֲמָתֶךָ / אֲמָתְךָ
  choice: आपकी दासी / अपनी दासी
  rationale: אמה स्त्री सेविका को सूचित करता है। ‘दासी’ रूत की विनम्र आत्म-पहचान को संक्षेप और गरिमा के साथ बनाए रखता है; हिन्दी में संबोधन के अनुसार सर्वनाम-रूप बदला गया है।
- source_word: וּפָרַשְׂתָּ
  choice: फैला दीजिए
  rationale: פרשׂ का अर्थ किसी वस्तु को किसी के ऊपर फैलाना है। विनम्र अनुरोध के लिए आदरसूचक आज्ञार्थ हिन्दी में स्वाभाविक है।
- source_word: כְנָפֶךָ
  choice: अपनी चादर का छोर
  rationale: כנף का अर्थ ‘पंख’ और वस्त्र का किनारा, दोनों हो सकता है। इस रात्रिकालीन दृश्य और विवाह-प्रस्ताव के संकेत में ‘चादर का छोर’ सहज हिन्दी है; ‘पंख’ की सुरक्षात्मक प्रतिध्वनि पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: עַל
  choice: पर
  rationale: आवरण के स्थानिक संबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: रूत के अनुरोध का कारण स्पष्ट रूप से प्रस्तुत करता है।
- source_word: גֹאֵל
  choice: छुड़ानेवाले संबंधी
  rationale: גֹאֵל निकट संबंधी की उस मान्य पारिवारिक भूमिका को बताता है जिसमें वह परिवार के अधिकारों और हितों को पुनःस्थापित करता है। संयुक्त पद हिन्दी पाठक को कानूनी-पारिवारिक अर्थ समझाता है और ‘छुड़ानेवाला’ मूल प्रमुख शब्द को बनाए रखता है।
- source_word: אָנֹכִי רוּת
  choice: मैं आपकी दासी रूत हूँ
  rationale: हिब्रू के क्रियारहित परिचय को स्वाभाविक हिन्दी पहचान-वाक्य के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: כְנָפֶךָ में पंख और वस्त्र के छोर की दोहरी छवि
  choice: मुख्य पाठ में ‘अपनी चादर का छोर’ और पाद-टिप्पणी में ‘अपना पंख’ रखा गया है।
  alternative: मुख्य पाठ में ‘अपना पंख’ रखना।
  rationale: तात्कालिक दृश्य में वस्त्र का छोर फैलाना ठोस क्रिया है और विवाह/संरक्षण के निवेदन को स्वाभाविक हिन्दी में स्पष्ट करता है। पाद-टिप्पणी ‘पंख’ की शाब्दिक तथा सुरक्षात्मक प्रतिध्वनि को सुरक्षित रखती है, इसलिए जानबूझकर संभव दोहरे अर्थ को मिटाया नहीं गया।
- issue: גֹאֵל की पारिवारिक और उद्धारात्मक भूमिका
  choice: ‘छुड़ानेवाले संबंधी’
  alternative: केवल ‘छुड़ानेवाले’ या ‘कुटुम्बी-छुड़ानेवाले’
  rationale: रूत की कथा में यह सामान्य उद्धारकर्ता नहीं, बल्कि मान्य दायित्व वाला पारिवारिक संबंधी है। ‘छुड़ानेवाले संबंधी’ कानूनी-पारिवारिक अर्थ को सहज हिन्दी में व्यक्त करता है, बिना भूमिका को केवल विवाह तक सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक संवाद और गरिमापूर्ण कथात्मक शैली। ‘चादर का छोर’ सामान्य पाठक के लिए दृश्य को स्वाभाविक बनाता है; पाद-टिप्पणी मूल ‘पंख’ की साहित्यिक और धर्मवैचारिक बहुअर्थकता बनाए रखती है।
