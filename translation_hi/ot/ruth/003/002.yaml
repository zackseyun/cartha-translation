source:
  edition: WLC
  text: וְ/עַתָּ֗ה הֲ/לֹ֥א בֹ֨עַז֙ מֹֽדַעְתָּ֔/נוּ אֲשֶׁ֥ר הָיִ֖ית אֶת נַעֲרוֹתָ֑י/ו הִנֵּה ה֗וּא זֹרֶ֛ה אֶת גֹּ֥רֶן הַ/שְּׂעֹרִ֖ים הַ/לָּֽיְלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/002.yaml
  text: And now[a], is not Boaz our relative, with whose young women you have been? Look[b], he is winnowing barley at the threshing floor tonight.
translation:
  language: hi
  text: और अब, क्या बोअज़ हमारा रिश्तेदार[a] नहीं है, जिसकी युवतियों[b] के साथ तुम रही हो? देखो, वह आज रात खलिहान में जौ फटक रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमारे कुल का जन।” इब्रानी शब्द केवल परिचित व्यक्ति नहीं, बल्कि किसी रिश्तेदार या कुल-संबंधी को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उसकी दासियों।” इब्रानी शब्द बोअज़ की स्त्री कामगारों या सेविकाओं को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक וְ और समयसूचक עַתָּה दोनों को रखते हुए नाओमी की बात के अगले चरण का स्वाभाविक आरंभ करता है।
- source_word: הֲלֹא
  choice: क्या ... नहीं है
  rationale: यह सहमति की अपेक्षा करने वाला आलंकारिक प्रश्न है; हिन्दी में यह संरचना उसी बल को स्वाभाविक रूप से व्यक्त करती है।
- source_word: מֹדַעְתָּנוּ
  choice: हमारा रिश्तेदार
  rationale: संदर्भ में यह शब्द केवल परिचित व्यक्ति नहीं, बल्कि रिश्तेदारी या कुल-संबंध से जुड़े व्यक्ति को दर्शाता है।
- source_word: אֲשֶׁר הָיִית אֶת נַעֲרוֹתָיו
  choice: जिसकी युवतियों के साथ तुम रही हो
  rationale: सापेक्ष उपवाक्य और रूत के बोअज़ की स्त्री कामगारों के साथ रहने—अर्थात उनके साथ खेत में काम करने—दोनों को बनाए रखता है, बिना अनावश्यक रूप से दासता का भाव जोड़ने के।
- source_word: הִנֵּה
  choice: देखो
  rationale: आगामी परिस्थिति की ओर ध्यान खींचने वाले संकेतक का सरल, आधुनिक और प्रत्यक्ष हिन्दी रूप।
- source_word: זֹרֶה
  choice: फटक रहा है
  rationale: कृदन्त वर्तमान या निकटवर्ती गतिविधि बताता है; हिन्दी का अपूर्ण वर्तमान दृश्य की सक्रियता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶת גֹּרֶן הַשְּׂעֹרִים
  choice: खलिहान में जौ
  rationale: इब्रानी में शाब्दिक रूप से ‘जौ का खलिहान’ क्रिया का कर्म है, जहाँ खलिहान का प्रयोग उसमें पड़े अनाज के लिए लाक्षणिक रूप से हुआ है। हिन्दी में ‘खलिहान में जौ फटक रहा है’ आशय और कृषि-दृश्य दोनों को स्पष्ट तथा स्वाभाविक रखता है।
- source_word: הַלָּיְלָה
  choice: आज रात
  rationale: समयवाचक प्रयोग का आधुनिक हिन्दी में स्वाभाविक समतुल्य।
