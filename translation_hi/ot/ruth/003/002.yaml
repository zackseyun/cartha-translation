  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘फटकना’ पारंपरिक कृषि-क्रिया के लिए सटीक और प्रचलित हिन्दी शब्द है। पादटिप्पणी-चिह्न उन्हीं शब्दों के बाद रखे गए हैं जिनकी वैकल्पिक व्याख्या दी गई है।
