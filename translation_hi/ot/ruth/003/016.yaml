base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/016.yaml
  text: When she came to her mother-in-law[a], she said, “Who are you, my daughter?” Then she told her all that the man had done for her.
translation:
  language: hi
  text: जब वह अपनी सास के पास पहुँची, तो सास ने पूछा, “मेरी बेटी, तू कौन है?”[a] तब उसने उसे वह सब बताया जो उस पुरुष ने उसके लिए किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक व्याख्यात्मक रूप में: “मेरी बेटी, तेरी भेंट का क्या परिणाम हुआ?” इब्रानी में शाब्दिक रूप से, “तू कौन है?” है। इसका आशय संभवतः यह पूछना है कि रूत की भेंट का क्या परिणाम हुआ या अब उसकी स्थिति क्या है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּבוֹא אֶל חֲמוֹתָהּ
  choice: जब वह अपनी सास के पास पहुँची
  rationale: आख्यान की घटना-श्रृंखला को स्वाभाविक हिन्दी में व्यक्त करता है; חֲמוֹתָהּ का अर्थ स्पष्ट रूप से ‘उसकी सास’ है।
- source_word: מִי אַתְּ בִּתִּי
  choice: मेरी बेटी, तू कौन है?
  rationale: इब्रानी के शाब्दिक और जानबूझकर अस्पष्ट प्रश्न ‘तू कौन है?’ को बनाए रखता है; ‘मेरी बेटी’ नाओमी के स्नेहपूर्ण संबोधन को व्यक्त करता है।
- source_word: וַתַּגֶּד לָהּ
  choice: तब उसने उसे ... बताया
  rationale: हिफ़ील रूप का अर्थ ‘बताना/सूचित करना’ है; ‘तब’ आख्यान के क्रम को सहज बनाता है।
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה לָהּ הָאִישׁ
  choice: वह सब ... जो उस पुरुष ने उसके लिए किया था
  rationale: ‘वह सब’ रिपोर्ट की पूर्णता व्यक्त करता है; לָהּ को प्रसंगानुसार हितकारी ‘उसके लिए’ अनूदित किया गया है और הָאִישׁ के अनुसार बोअज़ का नाम न जोड़कर ‘उस पुरुष’ रखा गया है।
theological_decisions:
- issue: नाओमी के प्रश्न מִי אַתְּ का आशय
  choice: मुख्य पाठ में शाब्दिक ‘तू कौन है?’
  alternative: ‘मेरी बेटी, तेरा काम कैसा रहा?’ या ‘अब तेरी स्थिति क्या है?’
  rationale: प्रश्न रूत की बदली हुई स्थिति अथवा भेंट के परिणाम की ओर संकेत कर सकता है, पर मूल पाठ इस आशय को स्पष्ट नहीं करता; इसलिए उसकी वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। नाओमी और रूत के निकट पारिवारिक संबंध को दिखाने के लिए ‘तू’ रखा गया है। वक्ता की पहचान स्पष्ट करने हेतु दूसरी बार ‘सास’ जोड़ा गया है, क्योंकि हिन्दी में केवल ‘उसने’ अस्पष्ट हो सकता था।
