  text: וִ/יהִ֣י בְ/שָׁכְב֗/וֹ וְ/יָדַ֨עַתְּ֙ אֶת הַ/מָּקוֹם֙ אֲשֶׁ֣ר יִשְׁכַּב שָׁ֔ם וּ/בָ֛את וְ/גִלִּ֥ית מַרְגְּלֹתָ֖י/ו ו/שכבתי וְ/הוּא֙ יַגִּ֣יד לָ֔/ךְ אֵ֖ת אֲשֶׁ֥ר תַּעַשִֽׂי/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/004.yaml
  text: Then[a], when he lies down, note the place where he lies. Then go, uncover his feet, and lie down[b], and he will tell you what you should do.
translation:
  language: hi
  text: जब वह लेट जाए, तब ध्यान से देख लेना कि वह कहाँ लेटा है। फिर जाकर उसके पाँव उघाड़ देना[a] और लेट जाना[b]। वह तुम्हें बताएगा कि तुम्हें क्या करना है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः “उसके पाँवों के पास की जगह” अथवा “उसके शरीर का निचला भाग”; इब्रानी अभिव्यक्ति केवल पाँवों के बजाय उनके आसपास के भाग का अधिक विशिष्ट संकेत दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: लिखित इब्रानी रूप का अर्थ “और मैं लेट जाऊँगी” है, पर प्रसंग और पारम्परिक पठन इसे “और तुम लेट जाना” समझते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: וִיהִי בְשָׁכְבוֹ
  choice: जब वह लेट जाए, तब
  rationale: היה का यह रूप और בְ लगा infinitive अगली घटना का समय बताते हैं। यह हिन्दी में निर्देशों का स्वाभाविक क्रम व्यक्त करता है।
- source_word: וְיָדַעַתְּ אֶת־הַמָּקוֹם
  choice: उस जगह को ध्यान से देख लेना
  rationale: ידע का मूल अर्थ ‘जानना’ है, पर यहाँ रूत को बोअज़ के लेटने की ठीक जगह पहचानने और याद रखने का निर्देश है।
- source_word: אֲשֶׁר יִשְׁכַּב שָׁם
  choice: जहाँ वह लेटा हो
  rationale: यह सम्बन्धवाचक उपवाक्य सोने की जगह की पहचान कराता है; हिन्दी में ‘वहाँ’ को दोहराना अनावश्यक है।
- source_word: וּבָאת
  choice: फिर जाकर
  rationale: בוא प्रसंग और दृष्टिकोण के अनुसार ‘आना’ या ‘जाना’ हो सकता है। नाओमी रूत को वहाँ जाने का निर्देश दे रही है, इसलिए ‘जाकर’ स्वाभाविक है।
- source_word: וְגִלִּית מַרְגְּלֹתָיו
  choice: उसके पाँव उघाड़ देना
  rationale: גלה का अर्थ ‘उघाड़ना’ है और מַרְגְּלוֹתָיו पाँवों अथवा पाँवों के आसपास के भाग को सूचित कर सकता है। मुख्य पाठ संक्षिप्त और प्रत्यक्ष है; व्यापक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: וְשָׁכָבְתִּי
  choice: और लेट जाना
  rationale: लिखित रूप प्रथम पुरुष ‘और मैं लेटी’ है, पर पारम्परिक पठन और प्रसंग इसे रूत के लिए स्त्रीलिंग एकवचन आदेश, ‘और तुम लेट जाना’, समझते हैं। हिन्दी में कर्ता निर्देश-क्रम से स्पष्ट है।
- source_word: וְהוּא יַגִּיד לָךְ
  choice: वह तुम्हें बताएगा
  rationale: Hiphil में נגד का सामान्य अर्थ ‘बताना’ है। अलग सर्वनाम से मिलने वाला हल्का बल हिन्दी में ‘वह’ से बना रहता है।
- source_word: אֵת אֲשֶׁר תַּעַשִׂין
  choice: कि तुम्हें क्या करना है
  rationale: यह बोअज़ द्वारा आगे दिए जाने वाले निर्देश को व्यक्त करता है; ‘करना है’ आधुनिक हिन्दी में निर्देशात्मक भाव स्वाभाविक रूप से देता है।
theological_decisions:
- issue: पाँव उघाड़ने और पास लेटने के निर्देश में सम्भावित यौन संकेत
  choice: मुख्य पाठ में क्रियाओं को प्रत्यक्ष रखा गया है और उन्हें न तो स्पष्टतः यौन बनाया गया है, न स्पष्टतः निर्दोष।
  alternative: इसे यौन आमंत्रण का व्यंजक मानना, अथवा केवल बोअज़ को जगाने का व्यावहारिक उपाय मानना।
  rationale: इब्रानी कथन में जानबूझकर या प्रसंगगत अस्पष्टता बनी रहती है। अनुवाद को किसी एक व्याख्या द्वारा उस तनाव को समाप्त नहीं करना चाहिए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ध्यान से देख लेना’ व्यावहारिक पहचान का भाव देता है; ‘उघाड़ देना’ मूल क्रिया की प्रत्यक्षता और कथात्मक अस्पष्टता दोनों बनाए रखता है।
