review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the address, reassurance, promise, and commendation. However, “मेरे नगर-द्वार पर आनेवाले सभी लोग” adds the specific idea of people who come to the gate and omits the source expression “my people.” The Hebrew uses “gate” metonymically for the town’s public community/forum; it does not specifically refer to visitors arriving there.
  naturalness: The intimate singular forms “तू/तेरे” are natural in this elevated biblical dialogue, and the sentence is clear. “मेरे लोगों के नगर-द्वार पर सभी लोग” is a natural enough way to retain the public-gate image while conveying the idiomatic communal reference.
  terminology: “योग्य स्त्री” is a sound, broad rendering of אֵשֶׁת־חַיִל. The alternatives should remain available, while the cultural explanation of the gate should be anchored to “नगर-द्वार,” not combined under an anchor after “स्त्री.”
  issues:
  - severity: medium
    issue: “नगर-द्वार पर आनेवाले सभी लोग” introduces ‘arriving/coming people’ and does not represent “my people.”
    rationale: כָּל־שַׁעַר עַמִּי is an idiomatic metonymy involving the gate and Boaz’s community. It supports ‘everyone among my people/the public community at the gate,’ not specifically passersby or visitors.
  - severity: low
    issue: The combined footnote is anchored only after “योग्य स्त्री,” although its cultural explanation concerns “नगर-द्वार.”
    rationale: Separate anchors make both the lexical alternative and the cultural note traceable to the words they explain.
