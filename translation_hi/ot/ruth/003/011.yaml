language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֗ה בִּתִּ/י֙ אַל תִּ֣ירְאִ֔י כֹּ֥ל אֲשֶׁר תֹּאמְרִ֖י אֶֽעֱשֶׂה לָּ֑/ךְ כִּ֤י יוֹדֵ֨עַ֙ כָּל שַׁ֣עַר עַמִּ֔/י כִּ֛י אֵ֥שֶׁת חַ֖יִל אָֽתְּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/011.yaml
  text: And now[a], my daughter, do not fear. All that you say, I will do for you[b], for all the gate of my people knows that you are a woman of noble character.
translation:
  language: hi
  text: और अब, मेरी बेटी, मत डर। जो कुछ तू कहती है, वह सब मैं तेरे लिए करूँगा, क्योंकि मेरे लोगों के नगर-द्वार[a] पर सभी लोग जानते हैं कि तू एक योग्य स्त्री[b] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: नगर-द्वार सार्वजनिक सभा, नागरिक मान्यता और कानूनी कार्यवाही का स्थान था। मूल वाक्यांश में “द्वार” नगर के सार्वजनिक समुदाय के लिए भी प्रयुक्त हुआ है; अर्थात्, मेरे लोगों में सभी जानते हैं।
    reason: cultural_note_and_idiomatic_clarification
  - marker: b
    text: “योग्य स्त्री” का अनुवाद “सद्गुणी स्त्री,” “सामर्थी स्त्री,” “उत्तम स्त्री,” या “उत्तम चरित्रवाली स्त्री” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתִּי
  choice: मेरी बेटी
  rationale: शाब्दिक और स्वाभाविक संबोधन; यहाँ यह बोअज़ का स्नेहपूर्ण और संरक्षण देने वाला संबोधन है, जैविक संबंध का दावा नहीं।
- source_word: אַל תִּירְאִי
  choice: मत डर
  rationale: निषेधात्मक आज्ञा को आधुनिक, सहज और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: כֹּל אֲשֶׁר תֹּאמְרִי אֶעֱשֶׂה לָּךְ
  choice: जो कुछ तू कहती है, वह सब मैं तेरे लिए करूँगा
  rationale: मूल के व्यापक और सीधे कथन को बनाए रखता है; 'कहती है' को संदर्भानुसार केवल 'माँगती है' तक सीमित नहीं करता।
- source_word: כָּל שַׁעַר עַמִּי
  choice: मेरे नगर-द्वार पर आनेवाले सभी लोग
  rationale: '''द्वार'' के सामुदायिक और सार्वजनिक अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है, जबकि प्राचीन नगर-द्वार की सांस्कृतिक छवि भी बनाए रखता है।'
- source_word: אֵשֶׁת חַיִל
  choice: एक योग्य स्त्री
  rationale: חַיִל में निहित सामर्थ्य, सद्गुण, क्षमता और सम्मान की व्यापकता को संक्षिप्त हिन्दी में व्यक्त करता है; वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: אֵשֶׁת חַיִל की प्रशंसा का अनुवाद
  choice: एक योग्य स्त्री
  alternative: सद्गुणी स्त्री; सामर्थी स्त्री; उत्तम चरित्रवाली स्त्री
  rationale: यह चयन वाक्यांश को केवल नैतिकता, घरेलूपन या युद्ध-संबंधी वीरता तक सीमित नहीं करता, बल्कि रूत की सार्वजनिक रूप से पहचानी गई योग्यता, सामर्थ्य और प्रतिष्ठा को समेटता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; बोअज़ और रूत के बीच एकवचन आत्मीय संबोधन के लिए ‘तू/तेरे’ रखा गया है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है।
