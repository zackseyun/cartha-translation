  text: לִ֣ינִי הַ/לַּ֗יְלָה וְ/הָיָ֤ה בַ/בֹּ֨קֶר֙ אִם יִגְאָלֵ֥/ךְ טוֹב֙ יִגְאָ֔ל וְ/אִם לֹ֨א יַחְפֹּ֧ץ לְ/גָֽאֳלֵ֛/ךְ וּ/גְאַלְתִּ֥י/ךְ אָנֹ֖כִי חַי יְהוָ֑ה שִׁכְבִ֖י עַד הַ/בֹּֽקֶר׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/013.yaml
  text: Stay here tonight[a], and in the morning, if he will redeem you, good—let him redeem you. But if he does not desire to redeem you, then I myself will redeem you, as Yahweh lives. Lie down until the morning.
translation:
  language: hi
  text: आज रात यहीं ठहरो। सुबह यदि वह तुम्हें छुड़ाए[a], तो अच्छा है—वह तुम्हें छुड़ाए। लेकिन यदि वह तुम्हें छुड़ाना न चाहे, तो याहवे के जीवन की शपथ, मैं स्वयं तुम्हें छुड़ाऊँगा। सुबह तक लेटी रहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “छुड़ाना” निकट संबंधी की पारिवारिक-कानूनी भूमिका को दर्शाता है। ऐसे संबंधी से परिवार से जुड़े अधिकारों और दायित्वों के संबंध में कार्य करने की अपेक्षा हो सकती थी; उसे कभी-कभी “परिवार का छुड़ानेवाला” कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִינִי הַלַּיְלָה
  choice: आज रात यहीं ठहरो
  rationale: लון का अर्थ रात बिताना या ठहरना है। स्त्रीलिंग आज्ञा और प्रसंग को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है; “यहीं” तत्काल प्रसंग में उसी स्थान पर रहने का भाव स्पष्ट करता है।
- source_word: וְהָיָה בַבֹּקֶר
  choice: सुबह
  rationale: यह पदबंध अगली सुबह होने वाली बात का परिचय देता है। हिन्दी में संक्षिप्त “सुबह” क्रम और समय दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אִם יִגְאָלֵךְ
  choice: यदि वह तुम्हें छुड़ाएगा
  rationale: גאל को “छुड़ाना” देकर मूल का प्रमुख उद्धार-संबंधी शब्द बनाए रखा गया है। यहाँ इसका विशेष पारिवारिक-कानूनी अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: טוֹב יִגְאָל
  choice: तो अच्छा है—वह तुम्हें छुड़ाए
  rationale: टוֹב की संक्षिप्त स्वीकृति और उसके बाद की अनुमोदनात्मक क्रिया को उसी संक्षिप्तता और बल के साथ रखा गया है।
- source_word: לֹא יַחְפֹּץ לְגָאֳלֵךְ
  choice: वह तुम्हें छुड़ाना न चाहे
  rationale: חפץ इच्छा या तत्परता को व्यक्त करता है। “न चाहे” आधुनिक हिन्दी में इसके इच्छात्मक भाव को सहजता से रखता है।
- source_word: וּגְאַלְתִּיךְ אָנֹכִי
  choice: मैं स्वयं तुम्हें छुड़ाऊँगा
  rationale: אָנֹכִי के स्पष्ट बल को “स्वयं” द्वारा व्यक्त किया गया है, जिससे बोअज़ की व्यक्तिगत प्रतिज्ञा उभरती है।
- source_word: חַי יְהוָה
  choice: जीवित याहवे की शपथ
  rationale: यह हिब्रू की प्रचलित शपथ-विधि है। हिन्दी रूप इसे शपथ के रूप में स्पष्ट करता है और יְהוָה को व्यक्तिगत नाम “याहवे” के रूप में रखता है।
- source_word: שִׁכְבִי עַד הַבֹּקֶר
  choice: सुबह तक लेटी रहो
  rationale: स्त्रीलिंग आज्ञा שִׁכְבִי का सीधा अर्थ लेटे रहने का है। यह अनावश्यक अतिरिक्त अर्थ जोड़े बिना स्थिति की निरंतरता व्यक्त करता है।
theological_decisions:
- issue: रूत के पारिवारिक-कानूनी प्रसंग में גאל का अनुवाद
  choice: मुख्य पाठ में “छुड़ाना” और पादटिप्पणी में निकट संबंधी के अधिकार-कर्तव्य की व्याख्या
  alternative: “निकट संबंधी का कर्तव्य निभाना” या “परिवार के छुड़ानेवाले के रूप में काम करना”
  rationale: “छुड़ाना” मूल के उद्धार-विषयक संबंध और पूरे ग्रंथ की शब्दगत कड़ी को बनाए रखता है, जबकि पादटिप्पणी यह स्पष्ट करती है कि यहाँ सामान्य बचाव नहीं, बल्कि निकट संबंधी की पारिवारिक-कानूनी भूमिका अभिप्रेत है।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। “याहवे” नाम को शीर्षक से प्रतिस्थापित किए बिना उसका प्रचलित लिप्यंतरण प्रस्तुत करता है।
- issue: חַי יְהוָה शपथ-विधि का अर्थ
  choice: जीवित याहवे की शपथ
  alternative: याहवे के जीवन की शपथ; याहवे जीवित है
  rationale: चुना हुआ रूप इसे स्पष्ट रूप से शपथ के रूप में संप्रेषित करता है, साथ ही परमेश्वर के जीवित होने पर आधारित मूल सूत्र का भाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। स्त्रीलिंग संबोधन को “ठहरो,” “लेटी रहो” और “तुम्हें” से स्वाभाविक रूप में व्यक्त किया गया है। कानूनी-पारिवारिक शब्द גאל की विषयगत प्रतिध्वनि मुख्य पाठ में रखकर उसका विशिष्ट अर्थ पादटिप्पणी में समझाया गया है।
