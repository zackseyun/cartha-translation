source:
  edition: WLC
  text: וַ/תֹּ֕אמֶר שֵׁשׁ הַ/שְּׂעֹרִ֥ים הָ/אֵ֖לֶּה נָ֣תַן לִ֑/י כִּ֚י אָמַ֣ר אַל תָּב֥וֹאִי רֵיקָ֖ם אֶל חֲמוֹתֵֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/017.yaml
  text: She said[a], “He gave me these six measures of barley, for he said, ‘Do not go to your mother-in-law empty-handed.’”
translation:
  language: hi
  text: उसने कहा, “उसने मुझे जौ की ये छह मात्राएँ[a] दीं, क्योंकि उसने कहा, ‘अपनी सास के पास खाली हाथ मत जाना।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “जौ के ये छह” है। माप की विशेष इकाई नहीं बताई गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: उसने कहा
  rationale: कथात्मक वय्यिक्तोल यहाँ रूत द्वारा नाओमी को बताई गई बात का परिचय देता है; हिन्दी में आरम्भिक संयोजक के बिना वाक्य स्वाभाविक है।
- source_word: שֵׁשׁ הַשְּׂעֹרִים הָאֵלֶּה
  choice: जौ की ये छह मात्राएँ
  rationale: मूल पाठ में संख्या ‘छह’ और ‘जौ’ है, पर माप की इकाई नहीं बताई गई। अर्थ स्पष्ट करने के लिए सामान्य शब्द ‘मात्राएँ’ रखा गया है और अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: נָתַן לִי
  choice: उसने मुझे ... दीं
  rationale: काल रूप पूर्ण भूतकालीन कार्य बताता है; हिन्दी में सामान्य भूतकाल सहज है। ‘दीं’ का सामंजस्य स्त्रीलिंग बहुवचन ‘मात्राएँ’ से है।
- source_word: כִּי אָמַר
  choice: क्योंकि उसने कहा
  rationale: כִּי उपहार देने का कारण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस व्याख्यात्मक सम्बन्ध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אַל תָּבֹאִי
  choice: मत जाना
  rationale: स्त्रीलिंग एकवचन निषेधात्मक रूप है। बोअज़ रूत से उसकी सास के पास लौटने की बात कह रहा है, इसलिए हिन्दी में ‘जाना’ दृष्टिकोण के अनुकूल है।
- source_word: רֵיקָם
  choice: खाली हाथ
  rationale: यह क्रियाविशेषण यहाँ बिना उपहार या सामग्री के लौटने का भाव देता है; ‘खाली हाथ’ उसका स्वाभाविक हिन्दी मुहावरा है।
- source_word: אֶל חֲמוֹתֵךְ
  choice: अपनी सास के पास
  rationale: חֲמוֹת का अर्थ ‘सास’ है। प्रत्यक्ष कथन में सम्बन्धवाचक प्रत्यय को हिन्दी में ‘अपनी’ और אֶל को ‘के पास’ से स्वाभाविक रूप दिया गया है।
