base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/007.yaml
  text: And Boaz ate and drank[a], and his heart was merry, and he went to lie down at the end of the grain heap. Then she came quietly, uncovered his feet[b], and lay down.
translation:
  language: hi
  text: बोअज़ ने खाया और पिया, और उसका मन प्रसन्न हुआ[a]। वह अनाज के ढेर के छोर पर लेटने गया। तब रूत चुपचाप आई, उसने उसके पाँव उघाड़ दिए[b] और लेट गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक भाव, “उसका हृदय अच्छा हुआ।” इसका अर्थ यह भी हो सकता है, “उसका मन आनन्दित हुआ” या “वह प्रसन्नचित्त था।” हिब्रू मुहावरा प्रसन्नता बताता है, पर अपने-आप यह नहीं बताता कि वह नशे में था।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसके पाँव उघाड़ दिए।” कुछ व्याख्याकार इसे एक साधारण वास्तविक क्रिया मानते हैं; अन्य इसमें सम्भावित सांकेतिक अर्थ देखते हैं। हिब्रू कथन स्वयं संयत है और यौन गतिविधि का स्पष्ट वर्णन नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאכַל ... וַיֵּשְׁתְּ
  choice: खाया-पिया
  rationale: दोनों क्रमिक क्रियाओं को स्वाभाविक हिन्दी युग्म में रखा गया है; पीने की वस्तु पाठ में निर्दिष्ट नहीं है।
- source_word: וַיִּיטַב לִבּוֹ
  choice: उसका मन प्रसन्न हुआ
  rationale: हिब्रू मुहावरे में हृदय के अच्छा या सुखद होने का भाव है। यह प्रसन्नता बताता है, पर अपने-आप नशे की अवस्था नहीं।
- source_word: וַיָּבֹא לִשְׁכַּב
  choice: लेटने चला गया
  rationale: आख्यान के दृष्टिकोण से गति को स्वाभाविक हिन्दी में व्यक्त किया गया है; क्रिया लेटने की है, स्पष्टतः सोने की नहीं।
- source_word: בִּקְצֵה הָעֲרֵמָה
  choice: अनाज के ढेर के सिरे पर
  rationale: קצה का अर्थ सिरा या छोर और עֲרֵמָה का अर्थ ढेर है; खलिहान के प्रसंग से अनाज स्पष्ट किया गया है।
- source_word: בַלָּט
  choice: चुपचाप
  rationale: यह गुप्त या शांत ढंग से आने का भाव देता है; 'चुपचाप' अनावश्यक नैतिक संकेत जोड़े बिना प्रसंग के अनुकूल है।
- source_word: וַתְּגַל מַרְגְּלֹתָיו
  choice: उसने उसके पाँवों पर से ओढ़ना हटा दिया
  rationale: मूलतः 'उसके पाँव खोल दिए' का भाव है। हिन्दी में यह रूप दृश्य क्रिया को स्पष्ट करता है, जबकि 'पाँव' को बनाए रखकर मूल की संयत अभिव्यक्ति और व्याख्यात्मक अस्पष्टता सुरक्षित रहती है।
- source_word: וַתִּשְׁכָּב
  choice: लेट गई
  rationale: यह 'लेटना' क्रिया का सीधा अनुवाद है; पाठ में यौन क्रिया स्पष्टतः नहीं कही गई है।
theological_decisions:
- issue: क्या रूत की क्रियाओं से यौन गतिविधि को स्पष्ट रूप से सूचित किया जाए
  choice: मुख्य पाठ में संयत, प्रत्यक्ष क्रियावर्णन रखा गया है और यौन गतिविधि नहीं जोड़ी गई।
  alternative: अनुवाद को अधिक व्याख्यात्मक बनाकर प्रलोभन या यौन संपर्क का संकेत देना।
  rationale: हिब्रू पाठ केवल उसके चुपचाप आने, बोअज़ के पाँव खोलने और लेट जाने का वर्णन करता है। संभव संकेतार्थों को पादटिप्पणी में स्वीकारते हुए मुख्य पाठ मूल की अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण आख्यान-शैली रखी गई है। 'पाँवों पर से ओढ़ना हटा दिया' स्वाभाविक हिन्दी में क्रिया स्पष्ट करता है, जबकि पादटिप्पणी मूल की शाब्दिक अभिव्यक्ति और उसकी सम्भावित अस्पष्टता सुरक्षित रखती है।
