  text: So she lay at his feet until morning[a], and she got up before one man could recognize another. And he said[b], “Do not let it be known that the woman came to the threshing floor.”
translation:
  language: hi
  text: और वह भोर तक उसके पैरों के पास लेटी रही। इससे पहले कि एक व्यक्ति दूसरे को पहचान सके[a], वह उठ गई। और वह बोला[b], “यह मालूम न होने पाए कि वह स्त्री खलिहान में आई थी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इससे पहले कि एक पुरुष अपने साथी को पहचान सके।” यह इब्रानी मुहावरा उस धुँधले समय को दर्शाता है जब लोग एक-दूसरे को साफ़ पहचान नहीं सकते थे।
    reason: lexical_alternative
  - marker: b
    text: प्रसंग के अनुसार वक्ता संभवतः बोअज़ है, हालाँकि इब्रानी पाठ केवल “और वह बोला” कहता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מרגלתיו
  choice: उसके पैरों के पास
  rationale: यह शब्द उसके पैरों या लेटने की जगह के पैरों वाले सिरे को दर्शाता है। यह चयन स्वाभाविक हिन्दी में स्थान बताता है और दृश्य में ऐसी कोई बात नहीं जोड़ता जिसे मूल पाठ स्पष्ट नहीं करता।
- source_word: עד הבקר
  choice: भोर तक
  rationale: यह समय-सीमा को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है; प्रसंग में अगले वाक्य का कम रोशनी वाला समय भी ध्यान में रहता है।
- source_word: בטרום יכיר איש את רעהו
  choice: इससे पहले कि एक व्यक्ति दूसरे को पहचान सके
  rationale: यह इब्रानी समयसूचक रचना और कम प्रकाश में परस्पर पहचान सकने की क्षमता—दोनों को व्यक्त करता है।
- source_word: אל יוודע
  choice: यह मालूम न होने पाए
  rationale: निषेधात्मक कर्मवाच्य भाव को बनाए रखते हुए यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: האשה
  choice: वह स्त्री
  rationale: इब्रानी निश्चित उपपद को दर्शाता है और प्रसंग की विशिष्ट स्त्री, रूत, की ओर संकेत करता है।
- source_word: הגרן
  choice: खलिहान
  rationale: अनाज दाँवने के स्थान के लिए प्रचलित और सहज हिन्दी शब्द है।
- source_word: ויאמר
  choice: तब उसने कहा
  rationale: मूल में वक्ता पुल्लिंग एकवचन में निहित है, पर उसका नाम नहीं दिया गया; इसलिए नाम जोड़े बिना सर्वनाम रखा गया है।
theological_decisions:
- issue: ויאמר के वक्ता की पहचान
  choice: मुख्य पाठ में “तब उसने कहा” रखा गया है।
  alternative: स्पष्टता के लिए “तब बोअज़ ने कहा” लिखा जा सकता है।
  rationale: प्रसंग से वक्ता संभवतः बोअज़ है, पर इब्रानी पाठ उसका नाम नहीं देता। अनावश्यक विशिष्टता जोड़ने से बचते हुए यह अस्पष्टता सुरक्षित रखी गई है।
- issue: रूत का बोअज़ के पैरों के पास लेटना
  choice: सीधा स्थानसूचक वर्णन “उसके पैरों के पास लेटी रही” रखा गया है।
  alternative: यौन संबंध का संकेत देने वाली व्याख्यात्मक भाषा जोड़ना, अथवा ऐसे किसी संकेत का स्पष्ट खंडन जोड़ना।
  rationale: यह पद स्थान और समय बताता है; वह न तो स्पष्ट रूप से यौन कृत्य बताता है, न उसका स्पष्ट खंडन करता है। इसलिए कथानक का तनाव बिना निष्कर्ष थोपे सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। छोटे वाक्यों से घटनाक्रम स्पष्ट होता है। “भोर,” “खलिहान,” और “मालूम न होने पाए” सामान्य पाठकों के लिए बोधगम्य हैं तथा मूल की कथात्मक गंभीरता बनाए रखते हैं।
