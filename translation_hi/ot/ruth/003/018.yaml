  text: וַ/תֹּ֨אמֶר֙ שְׁבִ֣י בִתִּ֔/י עַ֚ד אֲשֶׁ֣ר תֵּֽדְעִ֔י/ן אֵ֖יךְ יִפֹּ֣ל דָּבָ֑ר כִּ֣י לֹ֤א יִשְׁקֹט֙ הָ/אִ֔ישׁ כִּֽי אִם כִּלָּ֥ה הַ/דָּבָ֖ר הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/018.yaml
  text: Then she said[a], “Wait, my daughter, until you learn how the matter will fall out[b], for the man will not rest unless he has settled the matter today.”
translation:
  language: hi
  text: तब उसने कहा, “मेरी बेटी, यहीं ठहरी रहो, जब तक तुम्हें पता न चल जाए कि इस मामले का क्या नतीजा निकलता है; क्योंकि वह आदमी आज इस मामले को पूरा किए बिना चैन नहीं लेगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁבִי
  choice: यहीं ठहरी रहो
  rationale: मूल क्रिया का अर्थ ‘बैठना/ठहरे रहना’ है; प्रसंग में नाओमी रूत से वहीं रहकर परिणाम की प्रतीक्षा करने को कहती है। यह चयन उस व्यावहारिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בִתִּי
  choice: मेरी बेटी
  rationale: मूल पाठ में स्नेहपूर्ण संबोधन और प्रथम पुरुष संबंध दोनों स्पष्ट हैं।
- source_word: תֵּדְעִין
  choice: तुम्हें पता न चले
  rationale: यहाँ ידע भावी रूप से किसी बात के ज्ञात हो जाने को दर्शाता है; ‘पता चले’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אֵיךְ יִפֹּל דָּבָר
  choice: बात का क्या परिणाम होता है
  rationale: इब्रानी मुहावरे का शाब्दिक रूप ‘बात कैसे गिरेगी’ है, पर उसका आशय मामले के परिणाम से है। हिन्दी में शाब्दिक रूप अप्राकृतिक और अस्पष्ट होता, इसलिए अर्थगत मुहावरा अपनाया गया।
- source_word: הָאִישׁ
  choice: वह पुरुष
  rationale: मूल में निश्चित संज्ञा ‘वह पुरुष’ है, जो प्रसंगतः बोअज़ को सूचित करती है; नाम जोड़े बिना स्रोत की अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: יִשְׁקֹט
  choice: चैन नहीं लेगा
  rationale: क्रिया का मूल भाव शांत या निष्क्रिय रहने का है; यहाँ बोअज़ की तत्परता व्यक्त करने के लिए ‘चैन नहीं लेगा’ स्वाभाविक हिन्दी है।
- source_word: כִּי אִם כִּלָּה
  choice: पूरा किए बिना
  rationale: इब्रानी में अपवादात्मक शर्त और कार्य को समाप्त करने का भाव है। हिन्दी की ‘किए बिना’ रचना इस आशय को संक्षेप और स्पष्टता से देती है।
- source_word: הַדָּבָר
  choice: इस मामले
  rationale: דבר यहाँ छुटकारे और विवाह से जुड़ी लंबित बात को सूचित करता है; ‘मामला’ पर्याप्त रूप से व्यापक और प्रसंगानुकूल है।
- source_word: הַיּוֹם
  choice: आज
  rationale: समय-सूचक पद का सीधा और स्वाभाविक हिन्दी अनुवाद।
theological_decisions:
- issue: הָאִישׁ की पहचान
  choice: वह पुरुष
  alternative: बोअज़
  rationale: प्रसंग में संकेत बोअज़ की ओर है, किंतु पद स्वयं उसका नाम नहीं लेता; इसलिए अंतर्निहित संदर्भ को नाम में बदलकर स्पष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और कथात्मक रूप रखा गया है। नाओमी का स्नेहपूर्ण संबोधन तथा बोअज़ की तत्काल और दृढ़ तत्परता सुरक्षित है; इब्रानी के ‘बात कैसे गिरेगी’ मुहावरे को अप्राकृतिक शाब्दिक हिन्दी के बजाय अर्थ-समान अभिव्यक्ति दी गई है।
