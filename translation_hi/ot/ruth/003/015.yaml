  text: Then he said[a], “Bring the cloak that is on you and hold it out.” So she held it out, and he measured six measures of barley and put it on her[b]. Then he went into the city.
translation:
  language: hi
  text: तब उसने कहा, “वह ओढ़नी जो तुमने ओढ़ रखी है, इधर लाओ और उसे थामे रहो।” उसने उसे थाम लिया। तब उसने छह नाप जौ[a] नापकर उसके ऊपर रख दिया। फिर वह नगर में गया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘छह जौ’ है; माप की इकाई नहीं बताई गई है। इसलिए स्पष्टता के लिए ‘नाप’ जोड़ा गया है।
    reason: lexical_alternative
  - marker: b
    text: कुछ प्राचीन संस्करणों और अनेक अनुवादों में है, ‘फिर वह नगर में गई।’ मसोरेटिक पाठ में है, ‘फिर वह नगर में गया।’
    reason: textual_variant
lexical_decisions:
- source_word: הָבִי
  choice: आगे फैलाकर
  rationale: स्त्रीलिंग एकवचन आज्ञा में वस्त्र को प्रस्तुत करने का भाव है; अगले आदेश के साथ मिलाकर स्वाभाविक हिन्दी में इसे वस्त्र आगे फैलाने के रूप में व्यक्त किया गया है।
- source_word: הַמִּטְפַּחַת
  choice: ओढ़नी
  rationale: यह शरीर पर ओढ़ा हुआ ऐसा वस्त्र है जिसे जौ रखने के लिए फैलाया जा सकता था। ‘ओढ़नी’ आधुनिक हिन्दी में स्वाभाविक है और ‘घूँघट’ जैसे भ्रामक संकुचित अर्थ से बचती है।
- source_word: וְאֶחֳזִי בָהּ
  choice: उसे ... थामे रहो
  rationale: אחז का मूल भाव पकड़ने या थामने का है; प्रसंग में वस्त्र को अनाज लेने के लिए फैलाकर थामे रखना अभिप्रेत है।
- source_word: וַיָּמָד
  choice: नापकर
  rationale: מדד यहाँ अनाज की निश्चित मात्रा नापने की क्रिया बताता है।
- source_word: שֵׁשׁ שְׂעֹרִים
  choice: छः नाप जौ
  rationale: इब्रानी में शाब्दिक रूप से ‘छः जौ’ है और माप की इकाई नहीं बताई गई। हिन्दी में अर्थ स्पष्ट करने के लिए सामान्य शब्द ‘नाप’ जोड़ा गया है, बिना किसी विशिष्ट इकाई का अनुमान लगाए।
- source_word: וַיָּשֶׁת עָלֶיהָ
  choice: उस पर रख दिए
  rationale: स्त्रीलिंग सर्वनाम स्वाभाविक रूप से ओढ़नी की ओर संकेत कर सकता है; हिन्दी वाक्य जौ की नापी हुई मात्राओं को वस्त्र पर रखने की भौतिक क्रिया स्पष्ट करता है।
- source_word: וַיָּבֹא הָעִיר
  choice: फिर वह नगर में गया
  rationale: मसोरेटिक पाठ में क्रिया पुल्लिंग है, इसलिए मुख्य पाठ पुरुष कर्ता का अनुसरण करता है। पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: अंतिम उपवाक्य וַיָּבֹא הָעִיר का कर्ता
  choice: फिर वह नगर में गया
  alternative: फिर वह नगर में गई
  rationale: यह मुख्यतः पाठगत और व्याख्यात्मक प्रश्न है। दिए गए मसोरेटिक पाठ की क्रिया पुल्लिंग है, जबकि कुछ प्राचीन अनुवाद और अनेक आधुनिक अनुवाद स्त्रीलिंग पाठ का अनुसरण करते हैं। मुख्य पाठ WLC को मानता है और विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘ओढ़नी’ सामान्य पाठक के लिए सहज है; ‘छः नाप’ मूल पाठ की अनिर्दिष्ट इकाई को बनाए रखता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
