source:
  edition: WLC
  text: וַ/תֹּ֥אמֶר לָ֖/הּ נָעֳמִ֣י חֲמוֹתָ֑/הּ בִּתִּ֞/י הֲ/לֹ֧א אֲבַקֶּשׁ לָ֛/ךְ מָנ֖וֹחַ אֲשֶׁ֥ר יִֽיטַב לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/001.yaml
  text: Then Naomi her mother-in-law said to her[a], “My daughter, should I not seek a resting place for you, that it may go well with you?”
translation:
  language: hi
  text: तब उसकी सास नाओमी ने उससे कहा, “मेरी बेटी, क्या मैं तेरे लिए विश्राम-स्थान न ढूँढ़ूँ[a], जिससे तेरा भला हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विश्राम,” “सुरक्षा” अथवा “एक घर।” सन्दर्भ में नाओमी रूत के स्थिर कल्याण की व्यवस्था चाहती है, सम्भवतः विवाह के द्वारा; पर इब्रानी में “विश्राम-स्थान” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम और अनुक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נָעֳמִי חֲמוֹתָהּ
  choice: उसकी सास नाओमी
  rationale: नाम को प्रचलित हिन्दी बाइबलीय रूप ‘नाओमी’ में रखा गया है और सम्बन्धसूचक पद स्पष्ट करता है कि वह रूत की सास है।
- source_word: בִּתִּי
  choice: मेरी बेटी
  rationale: यह स्नेहपूर्ण पारिवारिक सम्बोधन का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: הֲלֹא אֲבַקֶּשׁ לָךְ
  choice: क्या मैं तेरे लिए ... न ढूँढ़ूँ
  rationale: ‘क्या ... न’ सहमति की अपेक्षा रखने वाले आलंकारिक प्रश्न को बनाए रखता है; ‘ढूँढ़ूँ’ नाओमी के सक्रिय प्रयत्न को सहज हिन्दी में व्यक्त करता है।
- source_word: מָנוֹחַ
  choice: कोई विश्राम-स्थान
  rationale: इब्रानी शब्द विश्राम अथवा स्थिर और सुरक्षित ठिकाने का भाव रखता है। सन्दर्भ में विवाह के द्वारा रूत का स्थायी कल्याण सम्भावित है, पर मुख्य पाठ में ‘पति’ जोड़ने के बजाय मूल रूपक सुरक्षित रखा गया है।
- source_word: אֲשֶׁר יִיטַב לָךְ
  choice: जहाँ तेरा भला हो
  rationale: यह उद्देश्य या लाभकारी परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है और कल्याण के व्यापक अर्थ को बनाए रखता है।
theological_decisions:
- issue: מָנוֹחַ का विवाह-संबंधी निहितार्थ
  choice: मुख्य पाठ में ‘विश्राम-स्थान’ रखकर निहितार्थ को पादटिप्पणी में समझाया गया है।
  alternative: ‘घर’, ‘सुरक्षा’ या सीधे ‘पति’ कहना।
  rationale: अध्याय के सन्दर्भ में नाओमी सम्भवतः विवाह द्वारा रूत के स्थायी कल्याण की व्यवस्था चाहती है, फिर भी इब्रानी पाठ स्वयं ‘विश्राम’ या ‘विश्राम-स्थान’ कहता है। अनुवाद को इस रूपक और उसकी अर्थगत खुली जगह को बनाए रखना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण कथात्मक रूप अपनाया गया है। नाओमी और रूत के निकट पारिवारिक सम्बन्ध के अनुरूप ‘तेरे/तेरा’ रखा गया है। पादटिप्पणी-चिह्न [a] उसी पद के तुरन्त बाद रखा गया है जिसे वह स्पष्ट करता है।
