source:
  edition: WLC
  text: וְ/עַתָּה֙ כִּ֣י אָמְנָ֔ם כִּ֥י אם גֹאֵ֖ל אָנֹ֑כִי וְ/גַ֛ם יֵ֥שׁ גֹּאֵ֖ל קָר֥וֹב מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/012.yaml
  text: And now[a], it is true that I am a redeemer[b], yet there is also a redeemer closer than I.
translation:
  language: hi
  text: और अब, यह सच है कि मैं छुड़ानेवाला[a] हूँ; फिर भी एक और छुड़ानेवाला है, जो मुझसे अधिक निकट संबंधी[b] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “छुड़ानेवाला संबंधी”; इब्रानी शब्द उस निकट संबंधी को सूचित करता है जिसके पास परिवार की संपत्ति और हितों के छुटकारे से जुड़े मान्य दायित्व और अधिकार होते थे।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “अधिक निकट” का अर्थ शारीरिक रूप से पास होना नहीं, बल्कि पारिवारिक संबंध में अधिक निकट होना और इसलिए छुटकारे का पहला अधिकार रखना है।
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक וְ और कथन को आगे बढ़ाने वाले עַתָּה—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כִּי אָמְנָם כִּי אִם
  choice: यह सच है कि
  rationale: यह पदसमूह बोअज़ के कथन की पुष्टि करता है। हिन्दी में यह अभिव्यक्ति उसके स्वीकारात्मक बल को सहज ढंग से व्यक्त करती है, बिना अनावश्यक विरोध का भाव जोड़े।
- source_word: גֹאֵל
  choice: छुड़ानेवाला
  rationale: यह शब्द उस निकट संबंधी को सूचित करता है जिसे परिवार की संपत्ति और हितों के छुटकारे से जुड़े मान्य दायित्व तथा अधिकार प्राप्त थे। मुख्य पाठ में संक्षिप्त शब्द रखा गया है और सांस्कृतिक अर्थ टिप्पणी में स्पष्ट किया गया है।
- source_word: אָנֹכִי
  choice: मैं … हूँ
  rationale: स्वतंत्र सर्वनाम की स्पष्टता और हल्के बल को बनाए रखते हुए हिन्दी के आवश्यक संयुक्त वाक्य-विन्यास का प्रयोग किया गया है।
- source_word: וְגַם יֵשׁ
  choice: फिर भी एक और … है
  rationale: וְגַם का योगात्मक अर्थ बना रहता है, जबकि प्रसंग में यह तथ्य बोअज़ के दावे को सीमित करता है; इसलिए ‘फिर भी’ स्वाभाविक रियायती संबंध व्यक्त करता है।
- source_word: קָרוֹב מִמֶּנִּי
  choice: मुझसे अधिक निकट संबंधी
  rationale: यहाँ निकटता स्थान की नहीं, पारिवारिक संबंध और उससे जुड़े छुटकारे के प्राथमिक अधिकार की है। ‘निकट संबंधी’ हिन्दी में इस प्रसंगगत अर्थ को स्पष्ट करता है।
theological_decisions:
- issue: कानूनी-पारिवारिक प्रसंग में גֹאֵל का अनुवाद
  choice: छुड़ानेवाला
  alternative: छुड़ानेवाला संबंधी / निकट संबंधी जो परिवार का छुटकारा कराए
  rationale: ‘छुड़ानेवाला’ मूल शब्द के छुटकारे संबंधी अर्थ को बनाए रखता है, जबकि लंबा विकल्प मुख्य पाठ में व्याख्यात्मक हो जाता। टिप्पणी यह स्पष्ट करती है कि यहाँ सामान्य या केवल आत्मिक छुटकारा नहीं, बल्कि इस्राएली परिवार-व्यवस्था में निकट संबंधी की मान्य भूमिका अभिप्रेत है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथन। ‘छुड़ानेवाला’ पारंपरिक धार्मिक शब्दावली से परिचित पाठकों के लिए बोधगम्य है, और पादटिप्पणी उसके विशिष्ट पारिवारिक-कानूनी अर्थ को स्पष्ट करती है।
