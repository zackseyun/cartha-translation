  text: So she went down to the threshing floor and did according to all that her mother-in-law had commanded her[a].
translation:
  language: hi
  text: तब वह खलिहान में उतर गई और उसने वह सब किया जो उसकी सास ने उसे करने की आज्ञा दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: तब वह…उतर गई
  rationale: ירד नीचे की ओर जाने को व्यक्त करता है; ‘उतर गई’ दिशात्मक अर्थ बनाए रखता है, और आरंभिक וַ का स्वाभाविक कथात्मक क्रम ‘तब’ से व्यक्त होता है।
- source_word: הַגֹּרֶן
  choice: खलिहान में
  rationale: גֹּרֶן अनाज की मड़ाई के स्थान को दर्शाता है। आधुनिक हिन्दी में ‘खलिहान’ इसका सहज और प्रचलित समतुल्य है; गंतव्य के साथ हिन्दी में ‘में’ स्वाभाविक है।
- source_word: וַתַּעַשׂ
  choice: और उसने…किया
  rationale: עשה का व्यापक अर्थ ‘करना’ है; आगे आने वाली अनुरूपता की अभिव्यक्ति के साथ ‘किया’ सीधा और स्वाभाविक है।
- source_word: כְּכֹל אֲשֶׁר
  choice: वैसा ही…जैसा
  rationale: यह रचना पहले दिए गए पूरे निर्देश के अनुरूप कार्य करने को व्यक्त करती है। ‘वैसा ही…जैसा’ पूर्ण अनुरूपता को स्वाभाविक हिन्दी में संप्रेषित करता है।
- source_word: צִוַּתָּה
  choice: आज्ञा दी थी
  rationale: צוה में आदेश देने का बल है; ‘आज्ञा दी थी’ उसे ‘समझाया’ या ‘बताया’ कहकर हल्का नहीं करता। ‘थी’ पूर्ववर्ती निर्देश को कथाक्रम में स्पष्ट करता है।
- source_word: חֲמוֹתָהּ
  choice: उसकी सास
  rationale: חֲמוֹתָהּ विशेष रूप से ‘उसकी सास’ को दर्शाता है और स्त्रीलिंग एकवचन स्वामित्व को सुरक्षित रखता है।
