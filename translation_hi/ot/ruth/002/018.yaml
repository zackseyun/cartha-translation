  text: וַ/תִּשָּׂא֙ וַ/תָּב֣וֹא הָ/עִ֔יר וַ/תֵּ֥רֶא חֲמוֹתָ֖/הּ אֵ֣ת אֲשֶׁר לִקֵּ֑טָה וַ/תּוֹצֵא֙ וַ/תִּתֶּן לָ֔/הּ אֵ֥ת אֲשֶׁר הוֹתִ֖רָה מִ/שָּׂבְעָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/018.yaml
  text: She picked it up and went into the city[a], and her mother-in-law saw what she had gleaned. Then she brought out and gave her what she had left over after she was satisfied.
translation:
  language: hi
  text: रूत ने उसे उठाया और नगर में गई। उसकी सास ने देखा कि उसने क्या बीन लिया था। तब उसने वह भोजन निकालकर अपनी सास को दिया जो उसके पेट भर खाने के बाद बचा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשָּׂא
  choice: उसने उसे उठाया
  rationale: נשׂא का मूल अर्थ उठाना या ले जाना है। यहाँ रूत बटोरे हुए अनाज को उठाकर घर ले जाती है; हिंदी में ‘उठाया’ भौतिक क्रिया को सहज रूप से व्यक्त करता है।
- source_word: הָעִיר
  choice: नगर
  rationale: עִיר का सीधा अर्थ नगर या शहर है। बेतलेहेम के आकार पर अतिरिक्त निष्कर्ष लगाए बिना ‘नगर’ कथात्मक और गरिमापूर्ण हिंदी है।
- source_word: חֲמוֹתָהּ
  choice: उसकी सास
  rationale: यह संबंधसूचक शब्द रूत की सास नाओमी को दर्शाता है; आधुनिक हिंदी में ‘सास’ स्वाभाविक और सटीक है।
- source_word: אֵת אֲשֶׁר לִקֵּטָה
  choice: कि उसने कितना अनाज बीनकर इकट्ठा किया था
  rationale: לקט कटाई करने वालों के पीछे बची बालियाँ बीनने की विशिष्ट क्रिया है। ‘बीनकर इकट्ठा किया’ इसे सामान्य पाठक के लिए स्पष्ट करता है; ‘कितना’ देखी गई उपज की मात्रा के स्वाभाविक हिंदी भाव को व्यक्त करता है।
- source_word: וַתּוֹצֵא
  choice: निकालकर
  rationale: हिफ़इल रूप का अर्थ बाहर निकालना है। प्रसंग में रूत अपने पास रखा भोजन निकालती है, इसलिए ‘निकालकर’ सहज है।
- source_word: וַתִּתֶּן לָהּ
  choice: अपनी सास को दिया
  rationale: לָהּ का संदर्भ सास से है। सर्वनाम की संभावित अस्पष्टता से बचने के लिए हिंदी में संबंध को दोहराना स्वाभाविक है।
- source_word: אֵת אֲשֶׁר הוֹתִרָה
  choice: जो ... बच गया था
  rationale: יתר के हिफ़इल का अर्थ शेष छोड़ना है। भोजन के प्रसंग में ‘बच गया था’ स्पष्ट और मुहावरेदार है।
- source_word: מִשָּׂבְעָהּ
  choice: पेट भर खाने के बाद
  rationale: שׂבע तृप्ति या भरपेट होने की अवस्था बताता है। पिछले पद के भोजन-प्रसंग में ‘पेट भर खाने के बाद’ अर्थ को स्वाभाविक हिंदी में स्पष्ट करता है।
