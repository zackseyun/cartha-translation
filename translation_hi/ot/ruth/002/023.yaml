base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/023.yaml
  text: So she stayed close to Boaz's young women to glean[a], until the end of the barley harvest and the wheat harvest[b]. And she lived with her mother-in-law.
translation:
  language: hi
  text: इस प्रकार वह बोअज़ की युवतियों के साथ ही रहकर बालें बीनती रही[a], जब तक जौ की कटनी और गेहूँ की कटनी समाप्त नहीं हो गई। और वह अपनी सास के साथ रहती रही[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बोअज़ की युवतियों से लिपटी रही।” इब्रानी क्रिया निकटता से जुड़े रहने पर विशेष बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह अपनी सास के साथ ठहरी रही” या “निवास करती रही।” इब्रानी क्रिया का अर्थ प्रसंग के अनुसार रहना, ठहरना या निवास करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּדְבַּק
  choice: साथ लगी रही
  rationale: דבק निकटता से जुड़े रहने या साथ लगे रहने का भाव देता है। कथा के संदर्भ में यह लगातार बोअज़ की युवतियों के साथ रहने को स्वाभाविक हिन्दी में व्यक्त करता है और मूल क्रिया की प्रबलता भी बनाए रखता है।
- source_word: בְּנַעֲרוֹת בֹּעַז
  choice: बोअज़ की युवतियों के साथ
  rationale: נַעֲרוֹת यहाँ बोअज़ के यहाँ काम करने वाली युवतियों को सूचित करता है। 'के साथ' דבק के साथ आए בְ का स्वाभाविक हिन्दी रूप है।
- source_word: לְלַקֵּט
  choice: बालें बीनने के लिए
  rationale: इस क्रिया का आशय कटनी के बाद खेत में छूटी बालें बीनना है। केवल 'बीनना' की अपेक्षा यह रूप सामान्य पाठक के लिए कृषि-संदर्भ स्पष्ट करता है।
- source_word: עַד כְּלוֹת
  choice: जब तक ... समाप्त न हो गई
  rationale: यह रचना किसी अवधि के पूर्ण होने तक जारी रहने का अर्थ देती है; हिन्दी में यह कालगत सीमा स्वाभाविक ढंग से व्यक्त होती है।
- source_word: קְצִיר הַשְּׂעֹרִים וּקְצִיר הַחִטִּים
  choice: जौ और गेहूँ—दोनों की कटनी
  rationale: मूल में जौ की कटनी और गेहूँ की कटनी अलग-अलग उल्लिखित हैं। 'दोनों' विस्तृत अवधि को स्पष्ट करता है, जबकि दोनों फसलों का क्रम सुरक्षित रहता है।
- source_word: וַתֵּשֶׁב
  choice: रहती रही
  rationale: ישב का अर्थ बैठना, ठहरना या निवास करना हो सकता है। यहाँ सास के साथ निरंतर निवास का अर्थ प्रसंगानुकूल है; अपूर्णतासूचक हिन्दी रूप कथानक में अवधि को व्यक्त करता है।
- source_word: אֶת חֲמוֹתָהּ
  choice: अपनी सास के साथ
  rationale: ישב के साथ यह पद किसी व्यक्ति के साथ रहने का संबंध व्यक्त करता है। हिन्दी में 'के साथ' आवश्यक और स्वाभाविक है।
