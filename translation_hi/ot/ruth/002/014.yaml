base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/014.yaml
  text: At mealtime Boaz said to her[a], “Come here and eat some bread, and dip your piece in the sour wine.” So she sat beside the reapers, and he passed her roasted grain. She ate and was satisfied, and she had some left over.
translation:
  language: hi
  text: भोजन के समय बोअज़ ने उससे कहा, “यहाँ आओ, कुछ रोटी खाओ और अपनी रोटी का टुकड़ा खट्टे दाखरस[a] में डुबोओ।” तब वह फसल काटनेवालों के बगल में बैठ गई। बोअज़ ने उसकी ओर भुना हुआ अनाज बढ़ाया। उसने खाया, तृप्त हुई, और उसके पास कुछ बच रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सिरके में।” इब्रानी शब्द חֹמֶץ का अर्थ सिरका या खट्टा दाखरस हो सकता है; खेत में किए जा रहे इस भोजन के संदर्भ में खट्टा दाखरस अभिप्रेत होना अधिक संभावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת הָאֹכֶל
  choice: भोजन के समय
  rationale: यह पदबंध काम करनेवालों के भोजन करने के समय को दर्शाता है। यह हिंदी में स्वाभाविक है और मूल का कालगत अर्थ बनाए रखता है।
- source_word: גֹּשִׁי הֲלֹם
  choice: यहाँ आओ
  rationale: स्त्रीलिंग आज्ञार्थक क्रिया और स्थानवाचक क्रियाविशेषण मिलकर निकट आने का सीधा निमंत्रण देते हैं।
- source_word: וְאָכַלְתְּ מִן הַלֶּחֶם
  choice: कुछ रोटी खाओ
  rationale: מִן यहाँ अंशवाचक अर्थ रखता है; ‘कुछ रोटी’ इसे सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: וְטָבַלְתְּ פִּתֵּךְ בַּחֹמֶץ
  choice: अपना टुकड़ा खट्टे दाखरस में डुबोओ
  rationale: פַּת रोटी के टुकड़े या कौर को सूचित कर सकता है, इसलिए ‘टुकड़ा’ मूल की हल्की व्यापकता बनाए रखता है। חֹמֶץ सिरका अथवा खट्टा दाख-पेय हो सकता है; खेत-मज़दूरों के भोजन के संदर्भ में ‘खट्टा दाखरस’ संभावित आशय को स्पष्ट करता है, जबकि दूसरा अर्थ पादटिप्पणी में रखा गया है।
- source_word: מִצַּד הַקּוֹצְרִים
  choice: कटनी करनेवालों के पास
  rationale: यह उनके बगल या निकट बैठने की स्थिति बताता है। ‘कटनी करनेवाले’ कृषि-संदर्भ को स्पष्ट और सामान्य हिंदी में बनाए रखता है।
- source_word: וַיִּצְבָּט לָהּ קָלִי
  choice: बोअज़ ने उसकी ओर भुना हुआ अनाज बढ़ाया
  rationale: दुर्लभ क्रिया का संदर्भगत अर्थ भोजन उसकी ओर बढ़ाने या उसे देने का है। ‘उसकी ओर ... बढ़ाया’ उस प्रत्यक्ष क्रिया को बनाए रखता है; קָלִי भुने हुए अनाज को दर्शाता है।
- source_word: וַתִּשְׂבַּע
  choice: तृप्त हुई
  rationale: क्रिया भरपेट खाने और संतुष्ट हो जाने का अर्थ देती है; ‘तृप्त हुई’ संक्षिप्त, प्रतिष्ठित और सटीक है।
- source_word: וַתֹּתַר
  choice: कुछ बचा भी लिया
  rationale: स्त्रीलिंग एकवचन क्रियाओं की श्रृंखला में रूत ही कर्ता बनी रहती है। यह अनुवाद दर्शाता है कि खाने के बाद भी उसके पास भोजन शेष था।
