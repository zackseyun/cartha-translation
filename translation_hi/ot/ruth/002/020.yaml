  text: וַ/תֹּ֨אמֶר נָעֳמִ֜י לְ/כַלָּתָ֗/הּ בָּר֥וּךְ הוּא֙ לַ/יהוָ֔ה אֲשֶׁר֙ לֹא עָזַ֣ב חַסְדּ֔/וֹ אֶת הַ/חַיִּ֖ים וְ/אֶת הַ/מֵּתִ֑ים וַ/תֹּ֧אמֶר לָ֣/הּ נָעֳמִ֗י קָר֥וֹב לָ֨/נוּ֙ הָ/אִ֔ישׁ מִֽ/גֹּאֲלֵ֖/נוּ הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/020.yaml
  text: Naomi said to her daughter-in-law[a], “Blessed be he by Yahweh, whose kindness has not forsaken the living or the dead.” Then Naomi said to her, “The man is a close relative of ours[b]; he is one of our redeemers.”
translation:
  language: hi
  text: नाओमी ने अपनी बहू से कहा, “वह यहोवा की ओर से आशीष पाए[a], जिसने जीवितों और मृतकों के प्रति अपनी कृपा नहीं छोड़ी।” फिर नाओमी ने उससे कहा, “वह पुरुष हमारा निकट संबंधी है; वह हमारे छुड़ानेवालों में से एक है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह यहोवा की ओर से आशीष पाए—वह जिसने जीवितों और मृतकों के प्रति अपनी कृपा नहीं छोड़ी।” इस पाठ में “अपनी कृपा” का संदर्भ यहोवा की नहीं, बोअज़ की कृपा से है।
    reason: alternative_reading
  - marker: b
    text: अर्थात परिवार का ऐसा निकट संबंधी, जिसे परिवार के किसी सदस्य या उसकी संपत्ति को छुड़ाने का मान्य अधिकार अथवा दायित्व था।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ הוּא לַיהוָה
  choice: वह यहोवा की ओर से आशीष पाए
  rationale: इब्रानी की क्रियारहित आशीर्वचन-उक्ति को स्वाभाविक आधुनिक हिन्दी में कामनात्मक कथन के रूप में व्यक्त किया गया है। לַיהוָה यहाँ आशीष के स्रोत के रूप में यहोवा की ओर संकेत करता है।
- source_word: חַסְדּוֹ
  choice: अपनी करुणा
  rationale: חֶסֶד में करुणा, कृपा और निष्ठापूर्ण प्रेम के अर्थ समाहित हो सकते हैं। प्रसंग में ‘करुणा’ सरल और गरिमापूर्ण है तथा सर्वनाम के संदर्भ की वास्तविक अस्पष्टता को बनाए रखता है।
- source_word: לֹא עָזַב
  choice: नहीं छोड़ी
  rationale: עזב का मूल अर्थ छोड़ना या त्याग देना है। ‘नहीं छोड़ी’ हिन्दी में करुणा के साथ स्वाभाविक है और इब्रानी रूपक को अनावश्यक रूप से विस्तार नहीं देता।
- source_word: אֶת הַחַיִּים וְאֶת הַמֵּתִים
  choice: जीवितों और मृतकों के प्रति
  rationale: इब्रानी वाव के सीधे संयुक्त अर्थ ‘और’ को बनाए रखा गया है; ‘के प्रति’ हिन्दी में करुणा के लक्ष्य को स्पष्ट करता है।
- source_word: קָרוֹב לָנוּ
  choice: हमारा निकट संबंधी
  rationale: קָרוֹב यहाँ स्थानिक निकटता नहीं बल्कि पारिवारिक संबंध की निकटता बताता है।
- source_word: מִגֹּאֲלֵנוּ
  choice: हमारे छुड़ानेवालों में से एक
  rationale: גאל से बना यह रूप उस निकट संबंधी को दर्शाता है जिसके पास परिवार के सदस्य या संपत्ति को छुड़ाने का मान्य अधिकार अथवा दायित्व था। मुख्य पाठ में अर्थानुवाद रखा गया है और कानूनी-पारिवारिक आशय पादटिप्पणी में समझाया गया है।
theological_decisions:
- issue: 'आशीर्वचन में सर्वनामों का संदर्भ: नाओमी बोअज़ को आशीष देती है, पर ‘अपनी करुणा’ यहोवा की है या बोअज़ की'
  choice: ‘वह’ बोअज़ को सूचित करता है और ‘जिसने... अपनी करुणा’ का निकटतम पूर्वपद यहोवा माना गया है।
  alternative: ‘अपनी करुणा’ बोअज़ की करुणा भी समझी जा सकती है।
  rationale: प्रसंग में आशीष पानेवाला पुरुष बोअज़ है, जबकि संबंधवाचक उपवाक्य व्याकरणतः निकट स्थित ‘यहोवा’ से जुड़ सकता है। फिर भी इब्रानी दूसरी व्याख्या की अनुमति देता है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘यहोवा’ से दिव्य नाम को व्यक्त किया गया है। ‘छुड़ानेवाला’ पारंपरिक कानूनी अवधारणा का अर्थ देता है, जबकि पादटिप्पणी उसके पारिवारिक-सामाजिक आशय को स्पष्ट करती है।
