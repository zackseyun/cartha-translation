source:
  edition: WLC
  text: עֵינַ֜יִ/ךְ בַּ/שָּׂדֶ֤ה אֲשֶׁר יִקְצֹרוּ/ן֙ וְ/הָלַ֣כְתִּ אַחֲרֵי/הֶ֔ן הֲ/ל֥וֹא צִוִּ֛יתִי אֶת הַ/נְּעָרִ֖ים לְ/בִלְתִּ֣י נָגְעֵ֑/ךְ וְ/צָמִ֗ת וְ/הָלַכְתְּ֙ אֶל הַ/כֵּלִ֔ים וְ/שָׁתִ֕ית מֵ/אֲשֶׁ֥ר יִשְׁאֲב֖וּ/ן הַ/נְּעָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/009.yaml
  text: Keep your eyes on the field where they are harvesting[a], and follow behind them. Have I not commanded the young men not to touch you? When you are thirsty, go to the jars and drink from what the young men have drawn.
translation:
  language: hi
  text: अपनी नज़र उस खेत पर रखना जहाँ वे फसल काट रही हैं, और उनके पीछे-पीछे चलती रहना। क्या मैंने जवानों को आज्ञा नहीं दी कि वे तुम्हें न छुएँ[a]? जब तुम्हें प्यास लगे, तो घड़ों के पास जाकर जो पानी जवानों ने भरा है, उसमें से पी लेना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या प्रसंग के अनुसार, “तुम पर हाथ न डालें।” इब्रानी में शाब्दिक अर्थ “तुम्हें न छुएँ” है; इसमें उत्पीड़न या हमले से सुरक्षा भी शामिल हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַיִךְ בַּשָּׂדֶה
  choice: अपनी नज़र उस खेत पर रखना
  rationale: इब्रानी में शाब्दिक रूप से ‘तुम्हारी आँखें खेत पर’ है, जिसमें निर्देश निहित है। यह हिंदी प्रयोग ध्यान बनाए रखने की आज्ञा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲשֶׁר יִקְצֹרוּן
  choice: जहाँ वे कटनी कर रही हों
  rationale: सापेक्ष उपवाक्य खेत को वहाँ चल रही कटनी से पहचानता है। स्त्रीलिंग बहुवचन संदर्भ अगले स्त्रीलिंग प्रत्यय के अनुरूप रखा गया है, जबकि संज्ञा जोड़कर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: וְהָלַכְתְּ אַחֲרֵיהֶן
  choice: और उनके पीछे-पीछे चलती रहना
  rationale: ‘पीछे-पीछे’ स्थानिक संबंध को स्पष्ट रखता है; स्त्रीलिंग एकवचन क्रिया रूत को दिए जा रहे निर्देश के अनुरूप है।
- source_word: הֲלוֹא צִוִּיתִי
  choice: क्या मैंने ... आज्ञा नहीं दी
  rationale: हिब्रू की आश्वासन देने वाली आलंकारिक प्रश्न-रचना को ज्यों का त्यों बनाए रखा गया है।
- source_word: הַנְּעָרִים
  choice: जवानों
  rationale: यहाँ शब्द बोअज़ के पुरुष कामगारों को दर्शाता है। ‘जवान’ लिंग और सामाजिक संदर्भ दोनों को बिना ‘सेवक’ का अतिरिक्त भाव जोड़े व्यक्त करता है।
- source_word: לְבִלְתִּי נָגְעֵךְ
  choice: कि वे तुम्हें न छुएँ
  rationale: נגע का मूल अर्थ ‘छूना’ है। मुख्य पाठ शाब्दिक व्यापकता बनाए रखता है; प्रसंग में उत्पीड़न या हमला भी निहित हो सकता है, जिसे पादटिप्पणी में बताया गया है।
- source_word: וְצָמִת
  choice: जब तुम्हें प्यास लगे
  rationale: अपेक्षित परिस्थिति को आधुनिक हिंदी में स्वाभाविक शर्त-कालिक अभिव्यक्ति से प्रस्तुत किया गया है।
- source_word: הַכֵּלִים
  choice: घड़ों
  rationale: शब्द सामान्यतः पात्रों के लिए है, पर पानी पीने और भरने के इस प्रसंग में ‘घड़े’ संभावित ठोस अर्थ को स्पष्ट और सहज बनाता है।
- source_word: וְשָׁתִית מֵאֲשֶׁר יִשְׁאֲבוּן הַנְּעָרִים
  choice: जवानों का भरा हुआ पानी पी लेना
  rationale: हिंदी में पानी को स्पष्ट करना आवश्यक और स्वाभाविक है। ‘भरा हुआ’ पीने से पहले पानी खींचे/भरे जाने की क्रिया को व्यक्त करता है।
theological_decisions:
- issue: נגע के आशय की सीमा
  choice: मुख्य पाठ में ‘न छुएँ’
  alternative: ‘तुम पर हाथ न डालें’
  rationale: मूल क्रिया सामान्य रूप से ‘छूना’ कहती है, जबकि संदर्भ हानिकारक स्पर्श, उत्पीड़न या हमले की ओर संकेत कर सकता है। मुख्य पाठ में व्यापक मूल अर्थ और पादटिप्पणी में प्रासंगिक तीव्र अर्थ रखने से अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण संवादात्मक स्तर रखा गया है। ‘नज़र रखना,’ ‘पीछे-पीछे चलना’ और ‘प्यास लगना’ सामान्य पाठक के लिए स्वाभाविक हैं; आलंकारिक प्रश्न तथा मूल पाठ की संभावित अस्पष्टता सुरक्षित रखी गई है।
