  text: When she rose to glean[a], Boaz commanded his young men, saying, “Let her glean even among the sheaves[b], and do not humiliate her.”
translation:
  language: hi
  text: जब वह बालें बीनने के लिए उठी, तब बोअज़ ने अपने नौजवान खेत-मज़दूरों को आज्ञा दी, “उसे पूलों के बीच भी बालें बीनने देना, और उसे अपमानित न करना।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם לְלַקֵּט
  choice: जब वह बालें बीनने के लिए उठी
  rationale: क्रमवाचक वाव कथा को आगे बढ़ाता है और यहाँ बोअज़ की प्रतिक्रिया से समय-संबंध जोड़ता है। לקט के लिए प्रचलित हिंदी कृषि-अभिव्यक्ति ‘बालें बीनना’ कार्य को स्पष्ट करती है।
- source_word: וַיְצַו ... לֵאמֹר
  choice: बोअज़ ने ... आज्ञा दी
  rationale: צוה का निर्देशात्मक बल ‘आज्ञा दी’ से स्वाभाविक और पर्याप्त रूप से व्यक्त होता है; हिंदी में प्रत्यक्ष कथन से पहले ‘कहते हुए’ जोड़ना अनावश्यक रूप से भारी होता।
- source_word: נְעָרָיו
  choice: अपने जवानों
  rationale: נַעַר का मूल युवा पुरुष-संदर्भ सुरक्षित रहता है और प्रसंग में ये बोअज़ के अधीन खेत में काम करने वाले पुरुष हैं।
- source_word: גַּם בֵּין הָעֳמָרִים
  choice: पूलों के बीच भी
  rationale: גַּם अनुमति के असामान्य विस्तार पर बल देता है। בֵּין का सीधा स्थानिक अर्थ ‘बीच’ है, और עֳמָרִים कटे अनाज के बँधे पूल हैं।
- source_word: תְּלַקֵּט
  choice: बीनने देना
  rationale: यह अपूर्ण क्रिया यहाँ अनुमतिपरक आदेश का कार्य करती है; ‘देना’ उसी भाव को सहज हिंदी में प्रकट करता है।
- source_word: וְלֹא תַכְלִימוּהָ
  choice: और उसे अपमानित न करना
  rationale: כלם के हिफ़ील रूप में किसी को लज्जित, अपमानित या नीचा दिखाने का कारण बनने का भाव है; ‘अपमानित’ सामाजिक अनादर की गंभीरता को व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘पूल’ कृषि-प्रसंग का सटीक शब्द है; ‘बालें बीनना’ सामान्य पाठक के लिए gleaning को स्पष्ट करता है। मूल की कोई महत्वपूर्ण धर्मवैज्ञानिक अस्पष्टता यहाँ नहीं है।
