base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/013.yaml
  text: Then she said[a], “May I find favor in your eyes, my lord, because you have comforted me and because you have spoken to the heart of your servant, though I am not like one of your female servants.”
translation:
  language: hi
  text: तब उसने कहा, “मेरे स्वामी, मुझे आपकी दृष्टि में अनुग्रह मिले, क्योंकि आपने मुझे सांत्वना दी है और अपनी दासी के मन को ढाढ़स बँधाया है[a], यद्यपि मैं आपकी दासियों में से एक के समान भी नहीं हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आपने अपनी दासी के हृदय से बात की है”; अर्थात् आपने अपनी दासी से स्नेह और आश्वासन की बातें कही हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: मुझ पर आपकी कृपादृष्टि बनी रहे
  rationale: यह विनम्र इच्छा या निवेदन व्यक्त करने वाला इब्रानी मुहावरा है। ‘कृपादृष्टि’ मूल के ‘आपकी आँखों में अनुग्रह’ की छवि और आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנִי
  choice: हे मेरे स्वामी
  rationale: यह बोअज़ के लिए आदरपूर्ण मानवीय संबोधन है, परमेश्वर की उपाधि नहीं। ‘मेरे स्वामी’ सामाजिक विनम्रता को बनाए रखता है।
- source_word: נִחַמְתָּנִי
  choice: आपने मुझे सांत्वना दी है
  rationale: यहाँ נחם असुरक्षा और दुःख की स्थिति में सांत्वना देने का भाव रखता है।
- source_word: דִבַּרְתָּ עַל־לֵב
  choice: मन को ढाढ़स बँधाया है
  rationale: मूल मुहावरे का शाब्दिक अर्थ ‘हृदय से/हृदय पर बात करना’ है और प्रसंग में कोमलता से आश्वस्त करना अभिप्रेत है। यह चयन हिन्दी में उसी भाव को सहजता से व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: שִׁפְחָתֶךָ / שִׁפְחֹתֶיךָ
  choice: अपनी दासी / आपकी दासियों
  rationale: शब्द स्त्री सेविका या दासी को सूचित करता है। रूत की विनम्र आत्म-संज्ञा और बोअज़ के घराने की स्त्री सेविकाओं—दोनों के लिए ‘दासी’ संक्षिप्त, स्वाभाविक और लिंग-विशिष्ट है।
- source_word: וְאָנֹכִי לֹא אֶהְיֶה כְּאַחַת
  choice: यद्यपि मैं ... एक के समान भी नहीं हूँ
  rationale: यह खंड बोअज़ की कृपा और रूत की अपनी निम्न सामाजिक स्थिति के बोध के बीच विरोध दर्शाता है। ‘भी’ उसकी विनम्रता के बल को स्वाभाविक हिन्दी में सामने लाता है।
