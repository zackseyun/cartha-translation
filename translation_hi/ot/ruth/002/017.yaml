base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/017.yaml
  text: So she gleaned in the field until evening[a], and beat out what she had gleaned, and it was about an ephah of barley.
translation:
  language: hi
  text: इस प्रकार वह शाम तक खेत में बालियाँ बीनती रही। फिर उसने जो बीन रखा था, उसे पीटकर दाने अलग किए; और लगभग एक एपा[a] जौ निकला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एपा प्राचीन काल में सूखी वस्तुओं को मापने की एक इकाई थी, जो लगभग 20–22 लीटर के बराबर थी।
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּלַקֵּט
  choice: बालें बीनती रही
  rationale: रूत के प्रसंग में לקט कटाई करने वालों के पीछे छूटी हुई बालें बीनने को दर्शाता है। यह चयन कृषि और व्यवस्था-संबंधी अर्थ को सहज आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: בַּשָּׂדֶה
  choice: खेत में
  rationale: שָׂדֶה का सामान्य और प्रसंगानुकूल अर्थ ‘खेत’ है।
- source_word: עַד הָעָרֶב
  choice: शाम तक
  rationale: यह उसके काम की समय-सीमा बताता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וַתַּחְבֹּט
  choice: उसे पीटकर दाने अलग किए
  rationale: חבט यहाँ बटोरी हुई बालियों को पीटकर उनसे अनाज के दाने अलग करने की क्रिया है। अनुवाद क्रिया को सामान्य पाठक के लिए स्पष्ट करता है, बिना बड़े पैमाने की मड़ाई का अनुचित संकेत दिए।
- source_word: אֵת אֲשֶׁר לִקֵּטָה
  choice: जो कुछ बीना था
  rationale: सम्बन्धवाचक रचना रूत द्वारा बटोरी गई बालियों को सूचित करती है; ‘बीना’ पहले प्रयुक्त कृषि-क्रिया से शब्दार्थगत संगति रखता है।
- source_word: כְּאֵיפָה
  choice: लगभग एक एपा
  rationale: उपसर्ग כְּ मात्रा के अनुमान को व्यक्त करता है। प्राचीन माप אֵיפָה को ऐतिहासिक नाम ‘एपा’ के रूप में रखा गया है और आधुनिक अनुमान पाद-टिप्पणी में दिया गया है।
- source_word: שְׂעֹרִים
  choice: जौ
  rationale: שְׂעֹרִים यहाँ एकत्र किए गए अनाज, अर्थात जौ, को दर्शाता है।
- source_word: וַיְהִי
  choice: निकला
  rationale: इस परिणामसूचक वाक्य में हिन्दी का ‘निकला’ कूटने के बाद प्राप्त जौ की मात्रा को स्वाभाविक ढंग से व्यक्त करता है।
