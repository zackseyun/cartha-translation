  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बालें बीनना’ साधारण बटोरने के बजाय प्रसंग की विशिष्ट कृषि-क्रिया को व्यक्त करता है। पाद-टिप्पणी का चिह्न सम्बद्ध माप ‘एपा’ के तुरंत बाद रखा गया है।
