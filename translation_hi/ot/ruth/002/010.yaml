id: RUT.2.10
reference: Ruth 2:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תִּפֹּל֙ עַל פָּנֶ֔י/הָ וַ/תִּשְׁתַּ֖חוּ אָ֑רְצָ/ה וַ/תֹּ֣אמֶר אֵלָ֗י/ו מַדּוּעַ֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ לְ/הַכִּירֵ֔/נִי וְ/אָּנֹכִ֖י נָכְרִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/010.yaml
  text: Then she fell on her face and bowed to the ground and said to him[a], “Why have I found favor in your eyes, that you should take notice of me, though I am a foreign woman?”
translation:
  language: hi
  text: तब वह मुँह के बल गिर पड़ी और भूमि तक झुककर दण्डवत किया। उसने उससे कहा, “आपकी दृष्टि में मुझ पर कृपा क्यों हुई कि आपने मुझ पर ध्यान दिया[a], जबकि मैं एक परदेशी स्त्री हूँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझे पहचाना,” “मेरा मान रखा,” अथवा “मुझे स्वीकार किया।”
    reason: לְהַכִּירֵנִי के अर्थ-क्षेत्र में ध्यान देने के साथ पहचानने, मान देने और स्वीकार करने के भाव भी संभव हैं।
lexical_decisions:
- source_word: וַתִּפֹּל עַל־פָּנֶיהָ
  choice: वह मुँह के बल गिर पड़ी
  rationale: यह इब्रानी बिंब और गहरी विनम्रता की शारीरिक मुद्रा को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: וַתִּשְׁתַּחוּ אָרְצָה
  choice: भूमि तक झुककर उसे प्रणाम किया
  rationale: यह भूमि की ओर दंडवत झुकने और सामाजिक आदर के भाव को व्यक्त करता है, बिना इसे परमेश्वर की आराधना ठहराए।
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: मुझ पर आपकी कृपादृष्टि हुई
  rationale: यह 'आपकी आँखों में अनुग्रह पाना' मुहावरे के बिंब को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है तथा अनावश्यक धार्मिक पारिभाषिकता से बचता है।
- source_word: לְהַכִּירֵנִי
  choice: आपने मुझ पर ध्यान दिया
  rationale: इस प्रसंग में हिफ़ील रूप का अर्थ पहचानना, मान देना या ध्यान देना हो सकता है; 'ध्यान दिया' बोअज़ के अनुकूल ध्यान को सहज हिन्दी में व्यक्त करता है।
- source_word: וְאָנֹכִי
  choice: जबकि मैं
  rationale: संयोजक और स्वतंत्र सर्वनाम से उत्पन्न विरोधात्मक अथवा रियायती भाव को हिन्दी में स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: נָכְרִיָּה
  choice: एक परदेशी स्त्री
  rationale: स्त्रीलिंग एकवचन को स्पष्ट रखता है और रूत की विदेशी/बाहरी सामाजिक स्थिति को आधुनिक, गरिमापूर्ण हिन्दी में बताता है।
theological_decisions:
- issue: וַתִּשְׁתַּחוּ में संभावित आराधनात्मक अर्थ
  choice: बोअज़ के सामने आदर और विनम्रता की शारीरिक मुद्रा के रूप में 'प्रणाम किया'
  alternative: '''आराधना की'' अथवा धार्मिक उपासना सूचित करने वाला अनुवाद'
  rationale: कथा के प्रसंग में रूत बोअज़ के प्रति सामाजिक सम्मान प्रकट कर रही है; पाठ उसे ईश्वरीय आराधना करते हुए नहीं बताता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में आदरसूचक 'आप' रखा गया है। भाषा साधारण पाठक के लिए सहज किंतु गरिमापूर्ण है। 'मुँह के बल' और 'भूमि तक झुककर प्रणाम' दोनों क्रमिक क्रियाओं को सुरक्षित रखते हैं।
