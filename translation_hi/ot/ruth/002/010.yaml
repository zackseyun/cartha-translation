  revision_rationale: The revision preserves the Hebrew sequence and its ground-directed gesture more precisely, while keeping the non-cultic social-deference sense. It also more visibly reflects the idiom of favor in Boaz's eyes, without imposing theological meaning. The alternative-rendering footnote remains accurate and correctly anchored.
