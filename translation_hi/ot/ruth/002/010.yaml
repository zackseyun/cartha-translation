- from: तब वह मुँह के बल गिर पड़ी और भूमि तक झुककर उसे प्रणाम किया। उसने उससे कहा, “मुझ पर आपकी कृपादृष्टि क्यों हुई कि आपने मुझ पर ध्यान दिया[a], जबकि मैं एक परदेशी स्त्री हूँ?”
  to: तब वह मुँह के बल गिर पड़ी और भूमि तक झुककर दण्डवत किया। उसने उससे कहा, “आपकी दृष्टि में मुझ पर कृपा क्यों हुई कि आपने मुझ पर ध्यान दिया[a], जबकि मैं एक परदेशी स्त्री हूँ?”
  rationale: The revision preserves the Hebrew sequence and its ground-directed gesture more precisely, while keeping the non-cultic social-deference sense. It also more visibly reflects the idiom of favor in Boaz's eyes, without imposing theological meaning. The alternative-rendering footnote remains accurate and correctly anchored.
  reviewer_model: gpt-5.6-terra
