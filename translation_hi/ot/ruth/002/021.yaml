base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/021.yaml
  text: Then Ruth the Moabite said[a], “He also said to me, ‘You are to stay close by my young women until they have finished all my harvest.’”
translation:
  language: hi
  text: तब मोआबी रूत ने कहा, “उन्होंने मुझसे यह भी कहा, ‘मेरे जवान सेवकों[a] के साथ ही रहना, जब तक वे मेरी सारी फसल काट न चुकें।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ-परंपरा के केरे-पाठ में, “मेरी जवान सेविकाओं के साथ।”
    reason: textual_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: רוּת הַמּוֹאֲבִיָּה
  choice: मोआबी रूत
  rationale: व्यक्तिनाम ‘रूत’ और स्त्रीलिंग जातिवाचक विशेषण ‘मोआबी’ को प्रचलित, संक्षिप्त हिन्दी रूप में रखा गया है।
- source_word: גַּם כִּי אָמַר אֵלַי
  choice: उन्होंने मुझसे यह भी कहा
  rationale: גַּם कथन में एक और बात जोड़ता है; आदरसूचक ‘उन्होंने’ बोअज़ के लिए स्वाभाविक हिन्दी प्रयोग है।
- source_word: עִם הַנְּעָרִים אֲשֶׁר לִי
  choice: मेरे जवान सेवक ... उन्हीं के साथ
  rationale: נְעָרִים पुल्लिंग बहुवचन है और इस कृषि-संदर्भ में जवान पुरुष सेवकों को सूचित कर सकता है। अनुवाद मूल के पुल्लिंग रूप को बनाए रखता है, उसे निकटवर्ती पदों के स्त्रीलिंग ‘जवान स्त्रियों’ के अनुसार नहीं बदलता।
- source_word: תִּדְבָּקִין
  choice: लगी रहना
  rationale: דבק का मूल भाव निकट जुड़े या साथ बने रहने का है। यहाँ व्यावहारिक निर्देश के रूप में ‘लगी रहना’ सहज हिन्दी है और स्त्री संबोधन से मेल खाता है।
- source_word: עַד אִם כִּלּוּ אֵת כָּל הַקָּצִיר אֲשֶׁר לִי
  choice: जब तक ... मेरी सारी फसल काट न चुकें
  rationale: यह वाक्य काम की अंतिम सीमा बताता है। ‘काट न चुकें’ पूर्णता का भाव देता है और ‘मेरी सारी’ से כָּל तथा אֲשֶׁר לִי दोनों सुरक्षित रहते हैं।
