  register: भाषा आधुनिक, कथात्मक और सम्मानपूर्ण रखी गई है। मूल इब्रानी के पुल्लिंग נְעָרִים को संदर्भ के दबाव में स्त्रीलिंग नहीं बनाया गया; ‘जवान सेवक’ सामान्य पाठक के लिए अर्थ और लिंग दोनों स्पष्ट करता है।
