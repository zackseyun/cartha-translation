source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ בֹּ֨עַז אֶל ר֜וּת הֲ/ל֧וֹא שָׁמַ֣עַתְּ בִּתִּ֗/י אַל תֵּלְכִי֙ לִ/לְקֹט֙ בְּ/שָׂדֶ֣ה אַחֵ֔ר וְ/גַ֛ם לֹ֥א תַעֲבוּרִ֖י מִ/זֶּ֑ה וְ/כֹ֥ה תִדְבָּקִ֖י/ן עִם נַעֲרֹתָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/008.yaml
  text: 'Then Boaz said to Ruth, “Listen, my daughter: do not go to glean in another field, and also do not go away from here, but stay close with my young women.”'
translation:
  language: hi
  text: तब बोअज़ ने रूत से कहा, “सुनो, मेरी बेटी! किसी दूसरे खेत में बालें बीनने मत जाना, और यहाँ से कहीं और भी मत जाना, बल्कि मेरी युवतियों के साथ ही रहना।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא שָׁמַעַתְּ
  choice: सुनो
  rationale: शाब्दिक रूप ‘क्या तुमने नहीं सुना?’ है, पर इस प्रसंग में यह ध्यान आकर्षित करने वाला आग्रह है; आधुनिक हिंदी में ‘सुनो’ उसी संवादात्मक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בִּתִּי
  choice: मेरी बेटी
  rationale: यह स्नेह और संरक्षण प्रकट करने वाला संबोधन है; इसे सीधे बनाए रखा गया है।
- source_word: לִלְקֹט
  choice: बालें बीनने
  rationale: क्रिया कटाई के बाद खेत में छूटी उपज बटोरने को दर्शाती है; रूत के प्रसंग में ‘बालें बीनना’ स्पष्ट और स्वाभाविक है।
- source_word: לֹא תַעֲבוּרִי מִזֶּה
  choice: यहाँ से कहीं और भी मत जाना
  rationale: वाक्यांश का अर्थ इस स्थान को छोड़कर आगे/दूसरी जगह जाने से रोकना है; ‘कहीं और’ प्रसंगगत दिशा को स्पष्ट करता है।
- source_word: תִדְבָּקִין עִם נַעֲרֹתָי
  choice: मेरी युवतियों के साथ ही रहना
  rationale: דבק निकट बने रहने का भाव देता है और עִם साथ का संबंध व्यक्त करता है। ‘साथ ही रहना’ निकटता और निरंतर संगति दोनों को सहज हिंदी में रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक, सम्मानपूर्ण और बोलचाल में स्वाभाविक हिंदी। बोअज़ का स्वर स्नेहपूर्ण किन्तु निर्देशात्मक रखा गया है। ‘युवतियों’ से उसके खेत में काम करने वाली स्त्री-कर्मियों का संकेत मिलता है।
