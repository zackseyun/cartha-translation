base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/011.yaml
  text: Then Boaz answered and said to her[a], “I have been fully told all that you have done for your mother-in-law after the death of your husband, and how you left your father and your mother and the land of your birth, and went to a people whom you did not know before.”
translation:
  language: hi
  text: तब बोअज़ ने उसे उत्तर दिया, “तुमने अपने पति की मृत्यु के बाद अपनी सास के लिए जो कुछ किया है, वह सब मुझे अच्छी तरह बताया गया है—और यह भी कि तुम अपने पिता, अपनी माता और अपनी जन्मभूमि को छोड़कर ऐसे लोगों के पास चली गईं, जिन्हें तुम इससे पहले नहीं जानती थीं।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “जिन्हें तुम कल या उसके पिछले दिन नहीं जानती थीं।”'
    reason: हिब्रू मुहावरे תְּמוֹל שִׁלְשׁוֹם का शाब्दिक रूप सुरक्षित रखना।
lexical_decisions:
- source_word: הֻגֵּד הֻגַּד לִי
  choice: वह सब मुझे अच्छी तरह बताया गया है
  rationale: क्रिया के साथ प्रयुक्त धातु का निरपेक्ष रूप कथन की तीव्रता या निश्चितता बढ़ाता है। यह अनुवाद कर्मवाच्य को बनाए रखते हुए स्वाभाविक हिन्दी में पूरी तरह सूचना मिलने का भाव व्यक्त करता है।
- source_word: כֹּל אֲשֶׁר עָשִׂית אֶת חֲמוֹתֵךְ
  choice: तुमने अपनी सास के लिए जो कुछ किया है
  rationale: כֹּל की समग्रता को ‘जो कुछ’ से और प्रसंग में निहित हितकारी भाव को ‘के लिए’ से व्यक्त किया गया है।
- source_word: אַחֲרֵי מוֹת אִישֵׁךְ
  choice: अपने पति की मृत्यु के बाद
  rationale: मूल की संज्ञात्मक रचना और उसके गंभीर स्वर को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: וַתַּעַזְבִי אָבִיךְ וְאִמֵּךְ
  choice: तुम अपने पिता, अपनी माता ... को छोड़कर
  rationale: मूल में माता और पिता का अलग-अलग उल्लेख है; इसलिए इसे ‘माता-पिता’ में संक्षिप्त नहीं किया गया। ‘छोड़कर’ प्रसंग में स्वाभाविक है और अनावश्यक रूप से नकारात्मक अर्थ नहीं जोड़ता।
- source_word: וְאֶרֶץ מוֹלַדְתֵּךְ
  choice: अपनी जन्मभूमि
  rationale: यह מוֹלֶדֶת के जन्मस्थान अथवा मूल देश के अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַתֵּלְכִי אֶל עַם
  choice: ऐसे लोगों के पास चली आईं
  rationale: הלך की गति को बनाए रखते हुए हिन्दी में बोअज़ के दृष्टिकोण से आगमन स्वाभाविक ढंग से व्यक्त किया गया है। עַם को राजनीतिक ‘राष्ट्र’ के बजाय समुदाय-सूचक ‘लोगों’ से अनूदित किया गया है।
- source_word: אֲשֶׁר לֹא יָדַעַתְּ
  choice: जिन्हें तुम ... नहीं जानती थीं
  rationale: ידע यहाँ किसी समुदाय से पहले का परिचय या निकट जानकारी न होने का भाव रखता है; ‘जानती थीं’ इस व्यक्तिगत परिचय को स्पष्ट करता है।
- source_word: תְּמוֹל שִׁלְשׁוֹם
  choice: इससे पहले
  rationale: यह मुहावरा शाब्दिक रूप से ‘कल या परसों’ कहकर पूर्वकालीन अपरिचय दर्शाता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
