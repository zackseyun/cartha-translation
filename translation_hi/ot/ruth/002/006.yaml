  text: Then the young man who was set over the reapers answered and said[a], “She is a young Moabite woman who returned with Naomi from the fields of Moab.”
translation:
  language: hi
  text: तब कटनी करनेवालों के ऊपर नियुक्त युवक ने उत्तर दिया, “वह एक मोआबी युवती है, जो नाओमी के साथ मोआब के खेतों से लौटी है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मोआब के खेत से”; इब्रानी एकवचन शब्द का सामूहिक अर्थ मोआब की कृषि-भूमि हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: उत्तर दिया
  rationale: कथात्मक संदर्भ में ענה का सामान्य अर्थ ‘उत्तर देना’ है; हिन्दी में इसके बाद सीधा कथन स्वाभाविक है, इसलिए ‘और कहा’ की पुनरुक्ति आवश्यक नहीं।
- source_word: הַנַּעַר
  choice: जवान
  rationale: נַעַר युवक अथवा सेवक को सूचित कर सकता है। यहाँ उसकी भूमिका अगले पदबंध से स्पष्ट होती है, इसलिए ‘मुखिया’ जैसे पद को संज्ञा में जोड़ने के बजाय व्यापक अर्थ रखा गया है।
- source_word: הַנִּצָּב עַל הַקּוֹצְרִים
  choice: कटनी करनेवालों पर नियुक्त
  rationale: नצב के खड़े या नियुक्त होने और עַל के पर्यवेक्षकीय संबंध—दोनों को यह पदबंध संक्षेप में व्यक्त करता है।
- source_word: הַקּוֹצְרִים
  choice: कटनी करनेवालों
  rationale: קצר के कृदन्त रूप का सीधा, सामान्य और कृषि-संदर्भ के अनुकूल हिन्दी रूप।
- source_word: נַעֲרָה מוֹאֲבִיָּה
  choice: मोआबी युवती
  rationale: נַעֲרָה के लिए आधुनिक, सम्मानजनक ‘युवती’ और स्त्रीलिंग जातिवाचक מוֹאֲבִיָּה के लिए ‘मोआबी’ मूल अर्थ को स्पष्ट रखते हैं।
- source_word: הִיא
  choice: यह वही ... है
  rationale: स्वतंत्र सर्वनाम पहचान पर बल देता है। प्रसंग में पूछी गई स्त्री की पहचान बताते हुए ‘यह वही ... है’ स्वाभाविक हिन्दी है।
- source_word: הַשָּׁבָה
  choice: जो ... लौटी है
  rationale: שוב के लौटने के अर्थ और स्त्रीलिंग कृदन्त को सुरक्षित रखता है; पूर्ण वर्तमान रूप वर्तमान पहचान से जुड़े पूर्व आगमन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עִם נָעֳמִי
  choice: नाओमी के साथ
  rationale: साधारण संगति का सीधा और स्वाभाविक अनुवाद।
- source_word: מִשְּׂדֵה מוֹאָב
  choice: मोआब के खेतों से
  rationale: एकवचन שְׂדֵה यहाँ सामूहिक अथवा क्षेत्रीय अर्थ में कृषि-भूमि को सूचित कर सकता है; हिन्दी बहुवचन प्रसंग में स्वाभाविक है, जबकि शाब्दिक एकवचन पादटिप्पणी में रखा गया है।
