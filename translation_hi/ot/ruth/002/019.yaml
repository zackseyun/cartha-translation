base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/019.yaml
  text: And her mother-in-law said to her[a], “Where did you glean today, and where have you worked? Blessed be the one who took notice of you.” So she told her mother-in-law with whom she had worked, and she said, “The name of the man with whom I worked today is Boaz.”
translation:
  language: hi
  text: उसकी सास ने उससे पूछा, “आज तुमने कहाँ बालियाँ बटोरीं और कहाँ काम किया? जिसने तुम पर ध्यान दिया, वह धन्य हो।” तब उसने अपनी सास को उस व्यक्ति के बारे में बताया, जिसके साथ उसने काम किया था। उसने कहा, “जिस पुरुष के साथ मैंने आज काम किया, उसका नाम बोअज़ है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲמוֹתָהּ
  choice: उसकी सास
  rationale: संदर्भ में यह रूत की सास नाओमी के लिए सामान्य और स्वाभाविक आधुनिक हिन्दी संबंध-सूचक शब्द है।
- source_word: לִקַּטְתְּ
  choice: बालें बटोरीं
  rationale: क्रिया खेत में फसल कटने के बाद बची हुई बालें चुनने को सूचित करती है; हिन्दी में यह वाक्यांश कृषि-संदर्भ को स्पष्ट और सहज रखता है।
- source_word: עָשִׂית
  choice: काम किया
  rationale: मूल क्रिया का सामान्य अर्थ ‘करना’ है, पर यहाँ खेत में किए गए श्रम का संदर्भ है; ‘काम किया’ उसी प्रसंगगत अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהִי מַכִּירֵךְ בָּרוּךְ
  choice: जिसने तुम पर ध्यान दिया, वह धन्य हो
  rationale: מכיר यहाँ पहचानने या अनुकूल ध्यान देने वाले व्यक्ति को दर्शाता है; यह अनुवाद उसकी कृपापूर्ण दृष्टि को व्यक्त करते हुए मूल आशीर्वाद-रूप को बनाए रखता है।
- source_word: אֵת אֲשֶׁר עָשְׂתָה עִמּוֹ
  choice: उसने किसके यहाँ काम किया था
  rationale: इब्रानी का अधिक शाब्दिक अर्थ ‘उसने उसके साथ जो किया’ है। खेत और उसके स्वामी के संदर्भ में ‘किसके यहाँ काम किया’ हिन्दी में स्वाभाविक है और किसी भ्रामक आशय से बचाता है।
- source_word: אֲשֶׁר עָשִׂיתִי עִמּוֹ
  choice: जिस पुरुष के यहाँ मैंने आज काम किया
  rationale: עִמּוֹ का शाब्दिक अर्थ ‘उसके साथ’ है, किंतु रूत ने बोअज़ के खेत में उसके संरक्षण के अधीन काम किया था; ‘उसके यहाँ’ हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בֹּעַז
  choice: बोअज़
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण; अंतिम व्यंजन की ध्वनि को ‘ज़’ से व्यक्त किया गया है।
