lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... पूछा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; हिन्दी में ‘तब’ स्वाभाविक क्रम दर्शाता है। प्रत्यक्ष प्रश्न के कारण ‘कहा’ की अपेक्षा ‘पूछा’ अधिक सहज है।
- source_word: בֹּעַז
  choice: बोअज़
  rationale: इब्रानी नाम का देवनागरी लिप्यंतरण।
- source_word: לְנַעֲרוֹ
  choice: अपने उस जवान से
  rationale: נַעַר का मूल अर्थ ‘जवान/युवक’ है; पद में उसकी पर्यवेक्षकीय भूमिका अगली उपवाक्यांश से स्पष्ट होती है, इसलिए ‘सेवक’ या ‘मुखिया’ कहकर अर्थ को सीमित नहीं किया गया।
- source_word: הַנִּצָּב עַל הַקּוֹצְרִים
  choice: जो कटनी करनेवालों पर नियुक्त था
  rationale: निफ़अल कृदंत नियुक्त या तैनात किए जाने का भाव और עַל पर्यवेक्षण का संबंध व्यक्त करता है।
- source_word: לְמִי
  choice: किसकी
  rationale: इब्रानी मुहावरा संबंध, घराने या संबद्धता के विषय में पूछता है; ‘किसकी’ उसकी संक्षिप्त और स्वाभाविक हिन्दी अभिव्यक्ति है, जबकि संभावित सामाजिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: הַנַּעֲרָה הַזֹּאת
  choice: यह युवती
  rationale: נַעֲרָה के लिए आधुनिक, सम्मानजनक ‘युवती’ चुना गया; ‘यह’ संकेतवाचक का सीधा रूप है।
