id: RUT.2.1
reference: Ruth 2:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּֽ/לְ/נָעֳמִ֞י מידע לְ/אִישָׁ֗/הּ אִ֚ישׁ גִּבּ֣וֹר חַ֔יִל מִ/מִּשְׁפַּ֖חַת אֱלִימֶ֑לֶךְ וּ/שְׁמ֖/וֹ בֹּֽעַז׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/001.yaml
  text: Naomi had a relative of her husband[a], a man of great worth, from the clan of Elimelech[b], and his name was Boaz.
translation:
  language: hi
  text: नाओमी के पति का एक संबंधी था, जो एलीमेलेक के कुल का एक प्रतिष्ठित और संपन्न पुरुष था[a]। उसका नाम बोअज़ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बड़े सामर्थ्य वाला पुरुष,” “प्रभावशाली पुरुष,” अथवा “धनी पुरुष”; इब्रानी पदबंध में सामर्थ्य, योग्यता, प्रतिष्ठा और संपन्नता के भाव सम्मिलित हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: מידע
  choice: संबंधी
  rationale: यह शब्द किसी परिचित या जुड़े हुए व्यक्ति को सूचित कर सकता है; एलीमेलेक के कुल का होने की अगली सूचना यहाँ पारिवारिक संबंध की ओर संकेत करती है, पर आगे आने वाली छुड़ाने वाले संबंधी की विशिष्ट भूमिका को अभी व्यक्त नहीं करती।
- source_word: לְאִישָׁהּ
  choice: नाओमी के पति का
  rationale: पूर्वसर्ग और प्रत्यय संबंध को सीधे नाओमी से नहीं, उसके पति से जोड़ते हैं।
- source_word: אִישׁ גִּבּוֹר חַיִל
  choice: एक प्रतिष्ठित और संपन्न पुरुष
  rationale: रूत के गैर-सैनिक प्रसंग में यह पदबंध सामर्थ्य, योग्यता, सामाजिक प्रतिष्ठा और संपन्नता का व्यापक भाव रखता है; यह अनुवाद युद्ध-संबंधी अर्थ थोपे बिना मुख्य सामाजिक-आर्थिक आशय को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: מִמִּשְׁפַּחַת
  choice: कुल का
  rationale: מִשְׁפָּחָה प्रायः निकट परिवार से व्यापक नातेदारी-समूह को दर्शाता है; हिंदी में ‘कुल’ इस प्रसंग के वंशगत और सामाजिक संबंध को संक्षेप में व्यक्त करता है।
- source_word: וּשְׁמוֹ
  choice: उसका नाम ... था
  rationale: यह इब्रानी कथा में पात्र-परिचय की सामान्य शैली है और हिंदी कथात्मक भूतकाल में स्वाभाविक है।
- source_word: בֹּעַז
  choice: बोअज़
  rationale: व्यक्तिनाम का मूल उच्चारण दर्शाने वाला मानक देवनागरी लिप्यंतरण।
- source_word: וּלְנָעֳמִי
  choice: नाओमी के ... था
  rationale: आरंभिक וְ कथा में नई जानकारी जोड़ता है; हिंदी में बिना कृत्रिम ‘अब’ या ‘और’ के वाक्य आरंभ करना स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘कुल’ व्यापक नातेदारी-समूह को दर्शाता है। वाक्य-विन्यास को स्वाभाविक बनाने के लिए एलीमेलेक के कुल वाली सूचना मुख्य वर्णन के साथ रखी गई है; किसी कृत्रिम काल-सूचक ‘अब’ को नहीं जोड़ा गया।
