reference: Ruth 2:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְשַׁלֵּ֥ם יְהוָ֖ה פָּעֳלֵ֑/ךְ וּ/תְהִ֨י מַשְׂכֻּרְתֵּ֜/ךְ שְׁלֵמָ֗ה מֵ/עִ֤ם יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר בָּ֖את לַ/חֲס֥וֹת תַּֽחַת כְּנָפָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/012.yaml
  text: May Yahweh repay your work[a], and may your reward be full from Yahweh, the God of Israel, under whose wings you have come to seek refuge.
translation:
  language: hi
  text: याहवे तुम्हारे कार्य का प्रतिफल दें[a], और तुम्हें इस्राएल के परमेश्वर याहवे से पूरा पुरस्कार मिले, जिनके पंखों के नीचे तुम शरण लेने आई हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, दूसरे खंड में, “तुम्हारी मजदूरी पूरी हो।” इब्रानी में “प्रतिफल दें” और “पूरा” एक ही शब्द-मूल से जुड़े हैं।
    reason: “पुरस्कार” के लिए प्रयुक्त इब्रानी शब्द का “मजदूरी” अर्थ भी हो सकता है; पादटिप्पणी मूल के שׁלם शब्द-मूल की प्रतिध्वनि भी स्पष्ट करती है।
lexical_decisions:
- source_word: יְשַׁלֵּם
  choice: प्रतिफल दें
  rationale: पिएल रूप यहाँ बोअज़ की आशीष या कामना व्यक्त करता है; ‘प्रतिफल दें’ इस इच्छार्थक भाव और किए गए कार्य के प्रत्युत्तर—दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: פָּעֳלֵךְ
  choice: तुम्हारे किए
  rationale: शब्द का अर्थ कार्य या कर्म है; प्रसंग में यह रूत के निष्ठापूर्ण कामों को समग्र रूप से इंगित करता है और आधुनिक हिन्दी में सहज है।
- source_word: וּתְהִי
  choice: और ... मिले
  rationale: यह पहले इच्छार्थक वाक्य के समानांतर आशीष की कामना जारी रखता है; हिन्दी में ‘मिले’ इसी भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מַשְׂכֻּרְתֵּךְ
  choice: तुम्हें ... पुरस्कार
  rationale: संज्ञा का अर्थ मजदूरी अथवा पुरस्कार हो सकता है; यहाँ परमेश्वर से मिलने वाले प्रतिदान के संदर्भ में ‘पुरस्कार’ अधिक स्वाभाविक है।
- source_word: שְׁלֵמָה
  choice: पूरा
  rationale: यह पूर्णता या भरपूरी बताता है और पहले खंड के שׁלם मूल से शब्दगत प्रतिध्वनि रखता है।
- source_word: מֵעִם
  choice: से
  rationale: यहाँ पूर्वसर्ग पुरस्कार के स्रोत को दर्शाता है—वह याहवे से मिलता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: सम्बन्धवाची इब्रानी रचना का सीधा और प्रचलित हिन्दी रूप।
- source_word: לַחֲסוֹת
  choice: शरण लेने
  rationale: क्रिया आश्रय या सुरक्षा पाने के लिए शरण लेने का भाव व्यक्त करती है; प्रयोजनसूचक रचना भी बनी रहती है।
- source_word: תַּחַת כְּנָפָיו
  choice: जिनके पंखों के नीचे
  rationale: सुरक्षा की मूल रूपकात्मक छवि को ‘पंखों’ के रूप में सुरक्षित रखा गया है, उसे केवल अमूर्त ‘सुरक्षा’ में नहीं बदला गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: पंखों के नीचे शरण लेने की छवि
  choice: रूपक को ज्यों का त्यों रखना
  alternative: ‘जिनकी सुरक्षा में तुम आई हो’
  rationale: मूल की सजीव सुरक्षात्मक छवि अर्थ की धार्मिक और काव्यात्मक गहराई वहन करती है; इसे अमूर्त व्याख्या में समतल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्त्रीलिंग ‘आई हो’ मूल में रूत को संबोधित स्त्रीलिंग रूप के अनुरूप है। आशीष का इच्छार्थक भाव ‘दें’ और ‘मिले’ से व्यक्त हुआ है।
