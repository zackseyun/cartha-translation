base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/022.yaml
  text: Then Naomi said to Ruth her daughter-in-law[a], “It is good, my daughter, that you go out with his young women, so that they do not come upon you in another field.”
translation:
  language: hi
  text: तब नाओमी ने अपनी बहू रूत से कहा, “मेरी बेटी, अच्छा है कि तू उसकी युवतियों के साथ बाहर जाए, ताकि दूसरे खेत में लोग तुझे परेशान न करें।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दूसरे खेत में लोग तुझसे न मिलें” अथवा “तुझ पर हमला न करें।” इब्रानी क्रिया का अर्थ केवल किसी से मिलना या सामना होना भी हो सकता है, और हानि पहुँचाने वाला सामना भी; यहाँ रूत की सुरक्षा के लिए नाओमी की चिंता नकारात्मक अर्थ का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כַּלָּתָהּ
  choice: अपनी बहू
  rationale: यह शब्द 3 स्त्रीलिंग एकवचन प्रत्यय सहित नाओमी से रूत का संबंध स्पष्ट रूप से ‘उसकी बहू’ बताता है; हिन्दी वाक्य में ‘अपनी बहू’ स्वाभाविक है।
- source_word: טוֹב
  choice: यह अच्छा है
  rationale: साधारण सकारात्मक मूल्यांकन को बनाए रखता है और इसे ‘सबसे अच्छा’ बनाकर अतिशयोक्तिपूर्ण नहीं करता।
- source_word: בִּתִּי
  choice: मेरी बेटी
  rationale: यहाँ यह स्नेह और पारिवारिक संबंध का संबोधन है, जैविक मातृत्व का दावा नहीं।
- source_word: כִּי
  choice: कि
  rationale: यह नाओमी द्वारा अच्छा मानी गई बात की विषयवस्तु प्रस्तुत करता है।
- source_word: תֵצְאִי
  choice: तू ... जाए
  rationale: मूल क्रिया का अर्थ ‘बाहर जाना/जाना’ है; ‘बीनने’ को मुख्य पाठ में जोड़ना संदर्भ से प्राप्त सूचना को क्रिया में आयात करना होता।
- source_word: נַעֲרוֹתָיו
  choice: उसकी युवतियों
  rationale: स्त्रीलिंग बहुवचन बोअज़ के साथ काम करने वाली युवतियों को दर्शाता है; ‘युवतियाँ’ आधुनिक और गरिमापूर्ण है तथा उनकी सेवकीय स्थिति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וְלֹא יִפְגְּעוּ בָךְ
  choice: ताकि ... लोग तुझे परेशान न करें
  rationale: פגע का अर्थ मिलना या हानिकारक ढंग से सामना करना हो सकता है। दूसरे खेत में रूत की सुरक्षा की चिंता के संदर्भ में नकारात्मक भाव उपयुक्त है; अनिश्चित बहुवचन कर्ता को स्वाभाविक हिन्दी में ‘लोग’ से व्यक्त किया गया है।
- source_word: בְּשָׂדֶה אַחֵר
  choice: किसी दूसरे खेत में
  rationale: स्थानवाचक पदबंध का सरल, स्वाभाविक हिन्दी रूप। ‘किसी’ अनिश्चित दूसरे खेत की हिन्दी अभिव्यक्ति को सहज बनाता है।
