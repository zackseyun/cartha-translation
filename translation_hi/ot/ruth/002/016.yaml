source:
  edition: WLC
  text: וְ/גַ֛ם שֹׁל תָּשֹׁ֥לּוּ לָ֖/הּ מִן הַ/צְּבָתִ֑ים וַ/עֲזַבְתֶּ֥ם וְ/לִקְּטָ֖ה וְ/לֹ֥א תִגְעֲרוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/016.yaml
  text: And also[a], you must surely pull out some for her from the bundles and leave it, so that she may gather it[b], and you must not rebuke her.
translation:
  language: hi
  text: और उसके लिए अनाज के बँधे हुए पूलों[a] में से भी कुछ बालें जान-बूझकर निकालकर छोड़ देना, ताकि वह उन्हें बीन ले; और उसे डाँटना मत।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनाज के बँधे हुए गट्ठरों।” इब्रानी शब्द इकट्ठे किए गए डंठलों के समूहों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: और … भी
  rationale: संयोजक और योगात्मक बल—दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है और इस निर्देश को पिछले निर्देश से जोड़ता है।
- source_word: שֹׁל תָּשֹׁלּוּ
  choice: जान-बूझकर निकालकर
  rationale: इनफिनिटिव एब्सोल्यूट के साथ क्रिया का प्रयोग कार्य पर बल देता है। प्रसंग में आशय बालों को अनायास गिरने देने का नहीं, बल्कि रूत के लिए उन्हें इरादतन पूलों से निकालने का है।
- source_word: לָהּ
  choice: उसके लिए
  rationale: 'पूर्वसर्ग यहाँ लाभार्थक अर्थ देता है: यह कार्य रूत के लाभ के लिए किया जाना है।'
- source_word: מִן הַצְּבָתִים
  choice: अनाज के बँधे हुए पूलों में से
  rationale: צְבָתִים काटकर इकट्ठे किए गए डंठलों के बँधे समूहों को दर्शाता है। यह चयन कृषि-संदर्भ को स्पष्ट और आधुनिक हिन्दी में बोधगम्य रखता है।
- source_word: וַעֲזַבְתֶּם
  choice: छोड़ देना
  rationale: निकाली गई बालों को वहीं पड़े रहने देने की आज्ञा को सहज और ठीक ढंग से व्यक्त करता है।
- source_word: וְלִקְּטָה
  choice: ताकि वह उन्हें बीन ले
  rationale: לָקַט कटे खेत में बची उपज बीनने की मानक क्रिया है। ‘बीन ले’ हिन्दी में इसी कृषि-कर्म को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְלֹא תִגְעֲרוּ בָהּ
  choice: और उसे डाँटना मत
  rationale: גער की कड़ी झिड़की या फटकार का भाव साधारण आधुनिक हिन्दी में स्पष्ट रखता है।
