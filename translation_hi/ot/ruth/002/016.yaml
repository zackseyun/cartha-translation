  register: भाषा आधुनिक, गरिमापूर्ण और ग्रामीण कटाई-बीनाई के प्रसंग में सहज रखी गई है। ‘कुछ बालें’ प्रसंग से स्पष्ट निहित कर्म को हिन्दी में व्यक्त करता है, जबकि ‘जान-बूझकर’ इब्रानी की बलात्मक रचना और इरादतन किए जाने वाले कार्य को सामने लाता है।
