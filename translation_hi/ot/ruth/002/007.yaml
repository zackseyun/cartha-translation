base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/007.yaml
  text: She said[a], ‘Please let me glean and gather among the sheaves after the reapers.’ So she came and has remained from morning until now; she has sat in the house only a little.
translation:
  language: hi
  text: उसने कहा, “कृपया, मुझे कटाई करनेवालों के पीछे पूलों के बीच बालें बीनने और उन्हें इकट्ठा करने दीजिए।” तब वह आई और सुबह से अब तक यहीं रही है; वह घर में बस थोड़ी देर बैठी है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने आश्रय में बस थोड़ी देर विश्राम किया है।” अंतिम खंड का इब्रानी पाठ कठिन है; यहाँ “घर” से आशय कामगारों का आश्रय हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֲלַקֳטָה נָּא
  choice: कृपया मुझे ... बालें बीनने ... दीजिए
  rationale: सहभावक रूप और विनय-सूचक נָּא को स्वाभाविक, आदरपूर्ण हिन्दी निवेदन में व्यक्त किया गया है; कृषि-संदर्भ में ‘बालें बीनना’ सामान्य पाठक के लिए ‘glean’ का स्पष्ट अर्थ देता है।
- source_word: וְאָסַפְתִּי
  choice: और इकट्ठी करने
  rationale: לקט से भेद बनाए रखते हुए बिनी हुई बालों को एकत्र करने का भाव व्यक्त करता है।
- source_word: בָעֳמָרִים
  choice: पूलों के बीच
  rationale: עֳמָרִים बँधे हुए अनाज के पूलों को सूचित करता है; ‘बीच’ स्थानगत अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַחֲרֵי הַקּוֹצְרִים
  choice: कटाई करनेवालों के पीछे
  rationale: स्थानगत क्रम को सीधे और सहज हिन्दी में सुरक्षित रखता है।
- source_word: וַתָּב֣וֹא וַֽתַּעֲמֹד
  choice: तब वह आई और ... यहीं लगी रही है
  rationale: शाब्दिक ‘खड़ी रही’ के बजाय अगले काल-विस्तार के साथ क्रिया की निरंतरता और काम में बने रहने का प्रसंगगत भाव व्यक्त किया गया है।
- source_word: מֵאָז הַבֹּקֶר וְעַד עַתָּה
  choice: सुबह से अब तक
  rationale: आरंभ-बिंदु से वर्तमान समय तक की अवधि का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: זֶה שִׁבְתָּהּ הַבַּיִת מְעָט
  choice: वह छप्पर में बस थोड़ी देर बैठी है
  rationale: कठिन और संक्षिप्त इब्रानी खंड का संभावित आशय है कि उसने कामगारों के आश्रय में बहुत कम समय बिताया; ‘छप्पर’ खेत के अस्थायी आश्रय को सामान्य हिन्दी में स्पष्ट करता है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित है।
