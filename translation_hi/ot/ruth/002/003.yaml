base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/003.yaml
  text: So she went and came and gleaned in the field behind the reapers[a], and she happened to come to the portion of the field belonging to Boaz, who was from the family of Elimelech.
translation:
  language: hi
  text: तब वह गई और खेत में पहुँची और काटनेवालों के पीछे-पीछे बालें बीनती रही। संयोग से[a] वह खेत के उस भाग में पहुँची जो बोअज़ का था; बोअज़ एलीमेलेक के परिवार का था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक भाव: “उसके साथ संयोग हुआ।” यह इब्रानी मुहावरा मानवीय दृष्टि से हुई आकस्मिक घटना को व्यक्त करता है; साथ ही पुस्तक की व्यापक कथा पाठक को इसमें परमेश्वर के विधान को देखने के लिए भी आमंत्रित करती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ וַתָּבוֹא
  choice: वह गई और खेत में पहुँची
  rationale: दोनों क्रमिक गति-क्रियाओं को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक कथात्मक प्रवाह दिया गया है।
- source_word: וַתְּלַקֵּט
  choice: बालें बीनने लगी
  rationale: काटनेवालों के पीछे छूटे अनाज को चुनने की प्राचीन प्रथा को सामान्य हिन्दी पाठक के लिए स्पष्ट करता है; केवल ‘बीनने’ की अपेक्षा ‘बालें’ कृषि-संदर्भ बताता है।
- source_word: אַחֲרֵי הַקֹּצְרִים
  choice: काटनेवालों के पीछे-पीछे
  rationale: यहाँ אַחֲרֵי स्थान और क्रम दोनों दर्शाता है—रूत फसल काटनेवालों के पीछे बची बालें बीनती है।
- source_word: וַיִּקֶר מִקְרֶהָ
  choice: संयोग से वह ... पहुँची
  rationale: सजातीय क्रिया-संज्ञा वाला इब्रानी मुहावरा मानवीय दृष्टि से आकस्मिक घटना व्यक्त करता है। यह हिन्दी में स्वाभाविक है और कथानक की विडंबना सुरक्षित रखता है।
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: खेत के उस भाग में
  rationale: חֶלְקָה भूमि के हिस्से या भूखंड को बताता है। ‘भाग’ सहज और पर्याप्त रूप से सटीक है।
- source_word: לְבֹעַז
  choice: जो बोअज़ का था
  rationale: लामेद द्वारा व्यक्त स्वामित्व को स्पष्ट और स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: מִמִּשְׁפַּחַת אֱלִימֶלֶךְ
  choice: एलीमेलेक के परिवार का था
  rationale: מִשְׁפָּחָה परिवार अथवा कुल-समूह को सूचित कर सकता है। ‘परिवार’ आधुनिक पाठकों के लिए व्यापक और सुबोध है।
theological_decisions:
- issue: संयोग और परमेश्वर के विधान के बीच कथात्मक तनाव
  choice: मुख्य पाठ में ‘संयोग से’ रखा गया
  alternative: परमेश्वर ने उसे बोअज़ के खेत में पहुँचाया
  rationale: मूल इब्रानी मानवीय दृष्टि से घटना को संयोग के रूप में कहता है, जबकि पूरी कथा पाठक को परमेश्वर के विधान की संभावना देखने देती है। अनुवाद इस तनाव को किसी एक व्याख्या से समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बालें बीनने लगी’ प्राचीन कटाई-संदर्भ को बिना तकनीकी शब्दावली के स्पष्ट करता है। नामों के रूप ‘बोअज़’ और ‘एलीमेलेक’ रखे गए हैं।
