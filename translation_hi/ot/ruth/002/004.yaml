theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: पद में चतुरक्षरीय व्यक्तिगत नाम יהוה सीधे प्रयुक्त है। ‘याहवे’ नाम को उपाधि में बदले बिना प्रस्तुत करता है।
- issue: עִמָּכֶם को कथन या आशीर्वचन मानना
  choice: याहवे तुम्हारे साथ रहे
  alternative: याहवे तुम्हारे साथ है
  rationale: रूथ और कटनी करनेवालों के उत्तर का अभिवादन-संदर्भ कामना या आशीर्वचन की ओर संकेत करता है, यद्यपि इब्रानी वाक्य में क्रिया व्यक्त नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फसल काटनेवाले’ सामान्य पाठक के लिए ‘लवनेवाले’ से अधिक स्पष्ट है। संवाद में बहुवचन ‘तुम्हारे’ और एकवचन ‘तुम्हें’ मूल पाठ के वचन-भेद को सुरक्षित रखते हैं।
