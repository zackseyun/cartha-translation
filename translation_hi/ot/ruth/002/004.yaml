  text: और देखो,[a] बोअज़ बेतलेहेम से आया। उसने फसल काटनेवालों से कहा, “याहवे तुम्हारे साथ रहे।” उन्होंने उससे कहा, “याहवे तुम्हें आशीष दे।”[b]
  philosophy: optimal-equivalence
  footnotes:
