  register: आधुनिक मानक हिन्दी; संवाद विनम्र, आत्मीय और गरिमापूर्ण रखा गया है। रूत के लिए आदरसूचक निवेदन और नाओमी के मातृसुलभ संबोधन का अंतर स्वाभाविक हिन्दी प्रयोग से व्यक्त किया गया है।
