base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/002.yaml
  text: And Ruth the Moabite said to Naomi[a], “Please let me go to the field and glean among the ears of grain after him in whose eyes I find favor.” And she said to her, “Go[b], my daughter.”
translation:
  language: hi
  text: और मोआबी रूत ने नाओमी से कहा, “कृपया मुझे खेत में जाने दीजिए, ताकि मैं उस व्यक्ति के पीछे अनाज की बालियों के बीच बीनूँ, जिसकी नज़र में मुझे अनुग्रह मिले।” नाओमी ने उससे कहा, “जा, मेरी बेटी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמּוֹאֲבִיָּה
  choice: मोआबी
  rationale: यह जातिवाचक विशेषण रूत के मोआबी मूल को रेखांकित करता है; ‘मोआबी’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: אֵלְכָה נָּא
  choice: कृपया मुझे ... जाने दीजिए
  rationale: कोहोर्टेटिव के साथ נָא विनम्र अनुमति-निवेदन व्यक्त करता है, जिसे हिन्दी में यह प्रयोग स्वाभाविक रूप से दर्शाता है।
- source_word: הַשָּׂדֶה
  choice: खेत
  rationale: कृषि और कटनी के प्रसंग में ‘खेत’ सीधा और स्वाभाविक समतुल्य है।
- source_word: וַאֲלַקֳטָּה
  choice: बीनूँ
  rationale: לקט कटनी के बाद बची उपज चुनकर इकट्ठी करने को दर्शाता है; हिन्दी में ‘बीनना’ इसी क्रिया को सहज रूप से व्यक्त करता है।
- source_word: בַשִּׁבֳּלִים
  choice: अनाज की बालियाँ
  rationale: שִׁבֳּלִים अनाज की बालियों को दर्शाता है, बँधे हुए पूलों को नहीं।
- source_word: אַחַר אֲשֶׁר אֶמְצָא חֵן בְּעֵינָיו
  choice: उस व्यक्ति के पीछे ... जिसकी दृष्टि में मुझ पर कृपा हो
  rationale: यह अनिश्चित पुरुषवाचक एकवचन संदर्भ और ‘दृष्टि में कृपा पाना’ वाले इब्रानी मुहावरे, दोनों को बनाए रखता है।
- source_word: חֵן
  choice: कृपा
  rationale: यहाँ शब्द किसी व्यक्ति की अनुकूल दृष्टि या अनुमति का सूचक है; ‘कृपा’ मुहावरे को गरिमापूर्ण और बोधगम्य रखता है।
- source_word: לְכִי בִתִּי
  choice: जा, मेरी बेटी
  rationale: सरल आज्ञा और आत्मीय पारिवारिक संबोधन दोनों को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
