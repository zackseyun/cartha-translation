  yaml_path: translation/ot/ruth/001/014.yaml
  text: Then they lifted up their voices and wept again. Orpah kissed her mother-in-law[a], but Ruth clung to her.
translation:
  language: hi
  text: तब वे फिर ऊँचे स्वर में रोईं। ओरपा ने अपनी सास को चूमा[a], पर रूत उससे लिपटी रही।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और रूत उससे लिपटी रही।” इब्रानी संयोजक का सामान्य अर्थ “और” है, लेकिन प्रसंग ओरपा के चूमने और रूत के उससे लिपटे रहने के बीच विरोध का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשֶּׂנָה קוֹלָן
  choice: वे ऊँचे स्वर से रोने लगीं
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘उन्होंने अपनी आवाज़ उठाई’ है। हिंदी में ‘ऊँचे स्वर से रोने लगीं’ सुनाई देने वाले विलाप को स्वाभाविक ढंग से व्यक्त करता है और अगले क्रियापद ‘रोने’ के साथ सहज वाक्य बनाता है।
- source_word: וַתִּבְכֶּינָה
  choice: रोने लगीं
  rationale: क्रिया का अर्थ रोना या विलाप करना है। स्त्रीलिंग बहुवचन रूप को हिंदी में स्पष्ट रखा गया है।
- source_word: עוֹד
  choice: फिर
  rationale: यहाँ यह पहले हुए रोने की पुनरावृत्ति बताता है; इसलिए ‘फिर’ स्वाभाविक और संदर्भानुकूल है।
- source_word: וַתִּשַּׁק
  choice: चूमा
  rationale: क्रिया का सीधा अर्थ ‘चूमना’ है; किसी विस्तार की आवश्यकता नहीं है।
- source_word: לַחֲמוֹתָהּ
  choice: अपनी सास को
  rationale: संज्ञा विशेष रूप से ‘सास’ को दर्शाती है और स्त्रीलिंग एकवचन प्रत्यय ओरपा की ओर संकेत करता है। हिंदी में कर्ता-संबंध स्पष्ट करने के लिए ‘अपनी’ स्वाभाविक है।
- source_word: דָּבְקָה בָּהּ
  choice: उससे लिपटी रही
  rationale: דבק दृढ़ता से जुड़े रहने या चिपके रहने का भाव देता है। ‘लिपटी रही’ भावनात्मक और संबंधपरक निकटता के साथ निरंतरता भी व्यक्त करता है, बिना अनावश्यक धार्मिक अर्थ जोड़े।
- source_word: וְ
  choice: पर
  rationale: मूल संयोजक सामान्यतः ‘और’ है, किंतु प्रसंग में ओरपा के चूमने और रूत के उससे जुड़े रहने के बीच विरोध उभरता है। ‘पर’ उस प्रसंगगत विरोध को स्पष्ट करता है; मूल ‘और’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: עָרְפָּה
  choice: ओरपा
  rationale: व्यक्तिनाम का आधुनिक मानक हिंदी में प्रचलित बाइबिलीय लिप्यंतरण।
- source_word: רוּת
  choice: रूत
  rationale: व्यक्तिनाम का इब्रानी उच्चारण के निकट और हिंदी में प्रचलित बाइबिलीय लिप्यंतरण।
