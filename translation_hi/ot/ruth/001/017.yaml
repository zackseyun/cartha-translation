reference: Ruth 1:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בַּ/אֲשֶׁ֤ר תָּמ֨וּתִי֙ אָמ֔וּת וְ/שָׁ֖ם אֶקָּבֵ֑ר כֹּה֩ יַעֲשֶׂ֨ה יְהוָ֥ה לִ/י֙ וְ/כֹ֣ה יֹסִ֔יף כִּ֣י הַ/מָּ֔וֶת יַפְרִ֖יד בֵּינִ֥/י וּ/בֵינֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/017.yaml
  text: Where you die[a], I will die, and there I will be buried. May Yahweh do so to me, and more also[b], if anything but death separates me from you.
translation:
  language: hi
  text: जहाँ तुम मरोगी, वहीं मैं भी मरूँगी, और वहीं मैं दफनाई जाऊँगी। याहवे मेरे साथ ऐसा ही करे, और इससे भी बढ़कर करे,[a] यदि मृत्यु के सिवा कोई और बात मुझे तुमसे अलग करे।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह इब्रानी शपथ-सूत्र है, जिसमें बोलने वाली अपने ऊपर दैवी दण्ड आने की प्रार्थना करती है। अधिक शाब्दिक रूप: “याहवे मेरे साथ ऐसा करे, और ऐसा ही और बढ़ाए।” दण्ड का स्वरूप नहीं बताया गया है।'
    reason: इब्रानी शपथ-सूत्र और उसके अनिर्दिष्ट दण्ड को स्पष्ट करना।
  - marker: b
    text: 'इब्रानी का शाब्दिक क्रम है: “यदि/कि मृत्यु मेरे और तुम्हारे बीच अलगाव करे।” शपथ के प्रसंग में इसका मुहावरेदार अर्थ है कि मृत्यु के अतिरिक्त कोई बात उन्हें अलग न करे।'
    reason: मूल वाक्य की संक्षिप्तता, संबंध-वाचक ढाँचे और मुहावरेदार शपथार्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: בַּאֲשֶׁר
  choice: जहाँ
  rationale: पूर्वसर्ग בְּ और सम्बन्धवाचक אֲשֶׁר मिलकर स्थान का बोध कराते हैं। ‘जहाँ’ स्वाभाविक हिन्दी में ‘जिस स्थान पर’ का अर्थ ठीक से व्यक्त करता है।
- source_word: תָּמוּתִי אָמוּת
  choice: तुम मरोगी, वहीं मैं भी मरूँगी
  rationale: मूल में ‘मरना’ क्रिया की पुनरावृत्ति गंभीर प्रतिज्ञा बनाती है। ‘भी’ रूत के नाओमी के साथ उसी नियति को स्वीकार करने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְשָׁם אֶקָּבֵר
  choice: और वहीं मुझे दफनाया जाएगा
  rationale: אֶקָּבֵר, קבר का निफ़अल रूप, कर्मवाच्य अर्थ देता है। ‘वहीं’ पिछले स्थान-सूचक वाक्यांश से स्पष्ट सम्बन्ध बनाए रखता है।
- source_word: כֹּה יַעֲשֶׂה יְהוָה לִי וְכֹה יֹסִיף
  choice: याहवे मेरे साथ ऐसा ही करे, बल्कि इससे भी बढ़कर करे
  rationale: यह दैवी दण्ड को अपने ऊपर बुलाने वाली पारम्परिक इब्रानी शपथ-रीति है। अनिर्दिष्ट ‘ऐसा’ को बनाए रखा गया है और וְכֹה יֹסִיף की तीव्रता ‘बल्कि इससे भी बढ़कर’ से व्यक्त की गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; इसलिए उसे उपाधि से बदलने के बजाय हिन्दी लिप्यन्तरण ‘याहवे’ दिया गया है।
- source_word: כִּי הַמָּוֶת יַפְרִיד
  choice: यदि मृत्यु के सिवा कोई और बात … अलग करे
  rationale: शपथ के प्रसंग में כִּי उसकी शर्त प्रस्तुत करता है। प्रचलित अर्थ में मृत्यु ही एकमात्र स्वीकार्य वियोग है; फिर भी मूल की संक्षिप्तता और सम्भावित अधिक शाब्दिक पठन को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בֵּינִי וּבֵינֵךְ
  choice: मुझे तुमसे
  rationale: शाब्दिक ‘मेरे और तुम्हारे बीच’ की अपेक्षा, יַפְרִיד के साथ ‘मुझे तुमसे अलग करे’ आधुनिक हिन्दी में अधिक स्वाभाविक है और वही सम्बन्धगत अर्थ रखता है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: यहाँ मूल पाठ सीधे चार-अक्षरीय दैवी नाम का प्रयोग करता है। ‘याहवे’ उस व्यक्तिगत वाचा-नाम को उपाधि में बदले बिना प्रस्तुत करता है।
- issue: रूत की शपथ में मृत्यु का स्थान
  choice: यदि मृत्यु के सिवा कोई और बात मुझे तुमसे अलग करे
  alternative: यदि मृत्यु मुझे तुमसे अलग करे
  rationale: मुख्य पाठ उस पारम्परिक समझ को व्यक्त करता है कि केवल मृत्यु ही दोनों को अलग कर सकती है। चूँकि इब्रानी वाक्य अत्यन्त संक्षिप्त है और उसमें ‘सिवा कोई और बात’ प्रत्यक्ष रूप से नहीं लिखा, अधिक शाब्दिक सम्भावना पादटिप्पणी में दी गई है।
- issue: आत्म-शाप की अनिर्दिष्ट भाषा
  choice: मेरे साथ ऐसा ही करे, बल्कि इससे भी बढ़कर करे
  alternative: मुझे कठोर दण्ड दे
  rationale: मूल शपथ दण्ड का स्वरूप स्पष्ट नहीं करती। अनिर्दिष्ट सूत्र को बनाए रखने से पाठ में अनुपस्थित कोई विशेष दण्ड या धार्मिक व्याख्या नहीं जोड़ी जाती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। स्त्रीलिंग क्रियारूप नाओमी और रूत के अनुरूप हैं। ‘दफनाया जाएगा’ सामान्य पाठक के लिए स्पष्ट है, जबकि शपथ-वाक्य में मूल की गंभीर और औपचारिक ध्वनि बनाए रखी गई है।
