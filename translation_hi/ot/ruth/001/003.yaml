  yaml_path: translation/ot/ruth/001/003.yaml
  text: Then Elimelech[a], Naomi’s husband, died, and she was left, and her two sons.
translation:
  language: hi
  text: फिर नाओमी का पति एलीमेलेक मर गया, और वह अपने दोनों बेटों के साथ रह गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: फिर ... मर गया
  rationale: वय्यिक़्तोल कथानक को आगे बढ़ाता है; ‘फिर’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֱלִימֶלֶךְ
  choice: एलीमेलेक
  rationale: व्यक्तिनाम को हिन्दी ध्वन्यात्मक रूप में लिप्यंतरित किया गया है।
- source_word: אִישׁ נָעֳמִי
  choice: नाओमी का पति
  rationale: इस संबंध में אִישׁ का अर्थ सामान्यतः ‘पति’ है; यह वैवाहिक संबंध को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: וַתִּשָּׁאֵר
  choice: रह गई
  rationale: שׁאר यहाँ मृत्यु के बाद जीवित/शेष रह जाने को व्यक्त करता है; ‘रह गई’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: הִיא וּשְׁנֵי בָנֶיהָ
  choice: वह अपने दोनों बेटों के साथ
  rationale: स्पष्ट सर्वनाम और संयुक्त सहभागी समूह को हिन्दी में ‘वह अपने दोनों बेटों के साथ रह गई’ कहने से मूल आशय सहजता से व्यक्त होता है।
