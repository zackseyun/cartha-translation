base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/016.yaml
  text: But Ruth said[a], “Do not press me to leave you, to turn back from following after you. For where you go, I will go; and where you lodge, I will lodge. Your people will be my people[d][c][b], and your God my God.”
translation:
  language: hi
  text: परन्तु रूत ने कहा, “मुझसे यह आग्रह न करो[a] कि मैं तुम्हें छोड़ दूँ और तुम्हारे पीछे चलना छोड़कर लौट जाऊँ[b]। क्योंकि जहाँ तुम जाओगी, वहाँ मैं जाऊँगी; और जहाँ तुम रात बिताओगी[c], वहाँ मैं रात बिताऊँगी। तुम्हारे लोग मेरे लोग, और तुम्हारा परमेश्वर मेरा परमेश्वर[d]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘मुझ पर दबाव न डालो’, ‘मुझसे विनती न करो’ या ‘मुझसे ज़ोर देकर न कहो’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘तुम्हारे पीछे से लौट जाऊँ’; यह इब्रानी मुहावरा तुम्हारे पीछे चलना छोड़कर लौट जाने का अर्थ देता है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात ‘जहाँ तुम ठहरोगी’; इब्रानी क्रिया विशेष रूप से रात बिताने का भाव भी दे सकती है।
    reason: lexical_alternative
  - marker: d
    text: 'इब्रानी में ये दोनों उपवाक्य क्रियारहित हैं: ‘तुम्हारे लोग मेरे लोग, और तुम्हारा परमेश्वर मेरा परमेश्वर।’ प्रसंग के अनुसार ‘हैं/है’ अथवा ‘होंगे/होगा’ समझा जा सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּפְגְּעִי בִי
  choice: मुझसे यह आग्रह न करो
  rationale: פגע ב यहाँ किसी से बार-बार आग्रह करने, उस पर दबाव डालने या ज़ोर देने का भाव रखता है। ‘आग्रह न करो’ स्वाभाविक आधुनिक हिन्दी में रूत की विनती व्यक्त करता है, बिना शारीरिक टकराव का अर्थ दिए।
- source_word: לְעָזְבֵךְ
  choice: तुम्हें छोड़कर
  rationale: עזב का सामान्य अर्थ ‘छोड़ना’ है। यहाँ ‘त्यागना’ की अपेक्षा ‘छोड़ना’ प्रसंगानुकूल और सहज है।
- source_word: לָשׁוּב מֵאַחֲרָיִךְ
  choice: तुम्हारे पीछे से लौट जाऊँ
  rationale: इसमें שׁוב का ‘लौटना’ और מֵאַחֲרָיִךְ का शाब्दिक दिशात्मक भाव ‘तुम्हारे पीछे से’ सुरक्षित रहता है; आशय है नाओमी के पीछे चलना छोड़कर लौट जाना।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי रूत की विनती का कारण प्रस्तुत करता है।
- source_word: אֶל אֲשֶׁר תֵּלְכִי אֵלֵךְ
  choice: जहाँ तुम जाओगी, वहाँ मैं जाऊँगी
  rationale: गन्तव्य बताने वाली इब्रानी सम्बन्धवाचक रचना और उसका समानान्तर काव्यात्मक रूप दोनों सुरक्षित हैं।
- source_word: וּבַאֲשֶׁר תָּלִינִי אָלִין
  choice: जहाँ तुम रात बिताओगी, वहाँ मैं रात बिताऊँगी
  rationale: לון प्रायः रात ठहरने या रात बिताने को दर्शाता है। ‘रात बिताना’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: עַמֵּךְ עַמִּי
  choice: तुम्हारे लोग मेरे लोग
  rationale: मूल इब्रानी में क्रिया नहीं है। हिन्दी की संक्षिप्त क्रियारहित रचना उस काव्यात्मक बल को और वर्तमान अथवा भावी सम्बन्ध की सम्भावना को सुरक्षित रखती है।
- source_word: וֵאלֹהַיִךְ אֱלֹהָי
  choice: और तुम्हारा परमेश्वर मेरा परमेश्वर
  rationale: मूल की क्रियारहित, सघन स्वीकारोक्ति हिन्दी में स्वाभाविक रूप से सुरक्षित रहती है। रूप और प्रसंग एकवचन ‘परमेश्वर’ का समर्थन करते हैं।
theological_decisions:
- issue: लोग और परमेश्वर से पहचान कराने वाले क्रियारहित उपवाक्यों का काल
  choice: 'दोनों को हिन्दी में क्रियारहित रखना: ‘तुम्हारे लोग मेरे लोग, और तुम्हारा परमेश्वर मेरा परमेश्वर’'
  alternative: दोनों में ‘होंगे/होगा’ या ‘हैं/है’ जोड़ना
  rationale: इब्रानी दोनों उपवाक्यों में योजक क्रिया नहीं देता। हिन्दी में भी क्रियारहित वाक्य स्वाभाविक और प्रभावपूर्ण है तथा वर्तमान पहचान और भावी प्रतिज्ञा के बीच मूल की सम्भावित अर्थ-व्याप्ति को अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में आत्मीय स्त्रीलिंग एकवचन के लिए ‘तुम’ का प्रयोग किया गया है। भाषा सरल, गरिमापूर्ण और काव्यात्मक समानान्तरता के अनुकूल रखी गई है।
