  text: When she saw that she was determined to go with her[a], she stopped speaking to her.
translation:
  language: hi
  text: जब नाओमी ने देखा कि रूत उसके साथ जाने के लिए दृढ़ निश्चय किए हुए थी, तो उसने उससे बात करना बंद कर दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “उससे बोलना छोड़ दिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: जब नाओमी ने देखा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है। हिन्दी में ‘जब ... देखा’ अगले खंड के साथ स्वाभाविक काल-संबंध बनाता है; प्रसंग से कर्ता नाओमी स्पष्ट है, इसलिए अस्पष्ट सर्वनाम के स्थान पर नाम दिया गया है।
- source_word: כִּי
  choice: कि
  rationale: यह नाओमी द्वारा देखी या समझी गई बात की विषयवस्तु प्रस्तुत करता है।
- source_word: מִתְאַמֶּצֶת
  choice: दृढ़ है
  rationale: אמץ का हित्वपेल रूप अपने को दृढ़ करने और पक्के संकल्प का भाव देता है। ‘दृढ़ है’ इस भाव को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है, बिना ‘अड़ी हुई’ के संभावित नकारात्मक रंग के।
- source_word: הִיא
  choice: रूत
  rationale: स्वतंत्र सर्वनाम कर्ता पर बल देता है। हिन्दी में प्रसंगगत स्पष्टता के लिए रूत का नाम रखा गया है; इससे मूल आशय नहीं बदलता।
- source_word: לָלֶכֶת
  choice: जाने के लिए
  rationale: यात्रा के प्रसंग में הלך का स्वाभाविक अर्थ ‘जाना’ है।
- source_word: אִתָּהּ
  choice: उसके साथ
  rationale: यह रूत के नाओमी के साथ जाने के संकल्प को दर्शाता है।
- source_word: וַתֶּחְדַּל
  choice: बंद कर दिया
  rationale: חדל का अर्थ रुकना या छोड़ देना है। ‘बंद कर दिया’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: לְדַבֵּר אֵלֶיהָ
  choice: उससे बात करना
  rationale: אֶל दिशा-सूचक ‘की ओर/से’ है; इस वाक्य-विन्यास में ‘उससे बात करना’ स्वाभाविक हिन्दी है।
