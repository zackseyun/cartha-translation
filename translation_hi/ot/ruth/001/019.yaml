base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/019.yaml
  text: So the two of them went on until they came to Bethlehem. And when they came to Bethlehem[a], the whole town was stirred because of them, and the women said, “Is this Naomi?”
translation:
  language: hi
  text: इस प्रकार वे दोनों बेतलेहेम तक चलती रहीं। जब वे बेतलेहेम पहुँचीं, तो उनके कारण पूरे नगर में हलचल मच गई, और स्त्रियों ने कहा, “क्या यह नाओमी है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלַכְנָה שְׁתֵּיהֶם
  choice: वे दोनों चलती रहीं
  rationale: स्त्रीलिंग बहुवचन क्रिया और ‘दोनों’ को बनाए रखते हुए यात्रा के जारी रहने का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: עַד בֹּאנָה
  choice: जब तक कि वे ... न पहुँच गईं
  rationale: עַד के यात्रा-अंत बोध को हिन्दी की स्वाभाविक ‘जब तक ... न’ रचना में व्यक्त किया गया है।
- source_word: בֵּית לָחֶם
  choice: बेतलेहेम
  rationale: स्थान-नाम को हिन्दी में प्रचलित बाइबलीय लिप्यंतरण के अनुसार रखा गया है।
- source_word: וַיְהִי כְּבֹאנָה
  choice: जब वे ... पहुँचीं
  rationale: इब्रानी कथात्मक सूत्र की काल-सूचक भूमिका को सहज हिन्दी में रखा गया है; ‘और ऐसा हुआ’ जैसी कृत्रिम शब्दशः रचना से बचा गया है।
- source_word: וַתֵּהֹם
  choice: हलचल मच गई
  rationale: המה यहाँ पूरे नगर की सामूहिक उत्तेजना या व्याकुल प्रतिक्रिया बताता है; ‘हलचल मच गई’ न तो अत्यधिक तीव्र है, न भाव को सपाट करता है।
- source_word: כָּל הָעִיר
  choice: पूरे नगर
  rationale: עִיר के सामुदायिक स्थान-बोध को आधुनिक, गरिमापूर्ण हिन्दी में ‘नगर’ से व्यक्त किया गया है।
- source_word: עֲלֵיהֶן
  choice: उनके कारण
  rationale: पूर्वसर्ग यहाँ उन दोनों के आगमन को हलचल का कारण या अवसर बताता है।
- source_word: וַתֹּאמַרְנָה
  choice: स्त्रियाँ कहने लगीं
  rationale: क्रिया का स्त्रीलिंग बहुवचन रूप वक्ताओं के स्त्रियाँ होने को स्पष्ट करता है; हिन्दी में इसे प्रत्यक्ष रूप से व्यक्त किया गया है।
- source_word: הֲזֹאת נָעֳמִי
  choice: क्या यह नाओमी है?
  rationale: प्रश्न और आश्चर्यपूर्ण पहचान को बिना ‘सचमुच’ जैसे अतिरिक्त व्याख्यात्मक शब्द जोड़े सीधे रखा गया है।
