source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר נָעֳמִי֙ לִ/שְׁתֵּ֣י כַלֹּתֶ֔י/הָ לֵ֣כְנָה שֹּׁ֔בְנָה אִשָּׁ֖ה לְ/בֵ֣ית אִמָּ֑/הּ יעשה יְהוָ֤ה עִמָּ/כֶם֙ חֶ֔סֶד כַּ/אֲשֶׁ֧ר עֲשִׂיתֶ֛ם עִם הַ/מֵּתִ֖ים וְ/עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/008.yaml
  text: And Naomi said to her two daughters-in-law[a], “Go, return, each to her mother’s house. May Yahweh show you kindness, as you have shown it to the dead and to me.”
translation:
  language: hi
  text: तब नाओमी ने अपनी दोनों बहुओं से कहा, “जाओ, तुम दोनों अपनी-अपनी माँ के घर लौट जाओ। याहवे तुम्हारे साथ वैसी ही भलाई करे, जैसी तुमने मरे हुओं के साथ और मेरे साथ की है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַלֹּתֶיהָ
  choice: अपनी दोनों बहुओं
  rationale: संदर्भ में כַּלָּה का अर्थ पुत्र की पत्नी है; ‘बहू’ इसका स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: לֵכְנָה שֹּׁבְנָה
  choice: जाओ, ... लौट जाओ
  rationale: दोनों स्त्रीलिंग बहुवचन आज्ञार्थक क्रियाओं को रखकर नाओमी के आग्रह का बल सुरक्षित किया गया है।
- source_word: אִשָּׁה לְבֵית אִמָּהּ
  choice: तुम दोनों अपनी-अपनी माँ के घर
  rationale: אִשָּׁה का प्रयोग यहाँ वितरणात्मक है। ‘अपनी-अपनी’ प्रत्येक स्त्री के अपनी माँ के घर लौटने का भाव स्वाभाविक हिन्दी में स्पष्ट करता है, और ‘माँ का घर’ मूल की विशिष्ट अभिव्यक्ति को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: חֶסֶד
  choice: करुणा
  rationale: इस आशीष के संदर्भ में ‘करुणा’ कृपालु और निष्ठापूर्ण व्यवहार को सहज हिन्दी में व्यक्त करती है; शब्द के निष्ठावान प्रेम संबंधी व्यापक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: עֲשִׂיתֶם עִם הַמֵּתִים וְעִמָּדִי
  choice: जैसी तुमने मरे हुओं के साथ और मेरे साथ की है
  rationale: עשה עם חסד की अभिव्यक्ति को पूर्वोक्त ‘करुणा’ से जोड़कर स्वाभाविक हिन्दी दी गई है। बहुवचन ‘मरे हुओं’ को मूल के अनुसार बनाए रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया; हिन्दी पाठकों में सुस्थापित नामरूप ‘यहोवा’ चुना गया है।
- issue: חֶסֶד का अर्थ-क्षेत्र
  choice: करुणा
  alternative: अटल प्रेम / निष्ठावान प्रेम / वाचा की निष्ठा
  rationale: यहाँ नाओमी मोआबी बहुओं के मृत परिजनों और अपने प्रति किए गए व्यवहार के अनुरूप ईश्वरीय भलाई की प्रार्थना करती है। मुख्य पाठ में सहज ‘करुणा’ रखा गया, जबकि निष्ठा का संभावित भाव पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। स्त्रियों को संबोधित बहुवचन के वितरणात्मक भाव के लिए ‘तुम दोनों अपनी-अपनी’ रखा गया है।
