source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֲלֵי/הֶ֔ן אַל תִּקְרֶ֥אנָה לִ֖/י נָעֳמִ֑י קְרֶ֤אןָ לִ/י֙ מָרָ֔א כִּי הֵמַ֥ר שַׁדַּ֛י לִ֖/י מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/020.yaml
  text: But she said to them[a], “Do not call me Naomi; call me Mara, for the Almighty has made me very bitter.”
translation:
  language: hi
  text: पर उसने उनसे कहा, “मुझे नाओमी न कहो; मुझे मारा[a] कहो, क्योंकि सर्वशक्तिमान ने मुझे बहुत कड़वा बना दिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नाओमी” नाम का अर्थ “मनभावनी” या “सुखद” के निकट है, जबकि “मारा” का अर्थ “कड़वी” है।
    reason: नामों के बीच मूल इब्रानी शब्दालंकार और नाओमी द्वारा नाम बदलने की माँग का आशय स्पष्ट करना।
lexical_decisions:
- source_word: וַתֹּאמֶר אֲלֵיהֶן
  choice: पर उसने उनसे कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, जबकि प्रसंग में नाओमी का उत्तर सुधार और विरोध प्रकट करता है; इसलिए ‘पर’ स्वाभाविक है। स्त्रीलिंग बहुवचन प्रत्यय का संदर्भ बैतलहम की स्त्रियों से है, जिसे हिन्दी ‘उनसे’ में प्रसंग स्पष्ट करता है।
- source_word: אַל תִּקְרֶאנָה לִי נָעֳמִי
  choice: मुझे नाओमी न कहो
  rationale: קרא यहाँ किसी व्यक्ति को किसी नाम से पुकारने के अर्थ में है। बहुवचन स्त्रीलिंग आज्ञार्थक रूप का हिन्दी में स्वाभाविक सामूहिक रूप ‘कहो’ है।
- source_word: קְרֶאןָ לִי מָרָא
  choice: मुझे मारा कहो
  rationale: पिछले खंड की समानांतर रचना और दोनों नामों का अलंकारिक विरोध बनाए रखा गया है। מָרָא को नाम के रूप में लिप्यंतरित किया गया है; उसका अर्थ पादटिप्पणी में दिया गया है।
- source_word: כִּי הֵמַר שַׁדַּי לִי מְאֹד
  choice: क्योंकि सर्वशक्तिमान ने मुझे बहुत कड़वाहट से भर दिया है
  rationale: הֵמַר का हिफ़ील रूप ‘कड़वा करना’ व्यक्त करता है। यह हिन्दी अभिव्यक्ति नाओमी के अनुभव और ‘मारा’ के साथ मूल शब्दालंकार दोनों को बनाए रखती है; מְאֹד का बल ‘बहुत’ से व्यक्त है।
- source_word: שַׁדַּי
  choice: सर्वशक्तिमान
  rationale: ईश्वरीय उपाधि को अर्थपूर्ण और हिन्दी में प्रचलित रूप से अनूदित किया गया है, न कि नाम की तरह लिप्यंतरित।
theological_decisions:
- issue: ईश्वरीय उपाधि שַׁדַּי का अनुवाद
  choice: सर्वशक्तिमान
  alternative: शद्दाय
  rationale: यहाँ इसे ईश्वर की उपाधि के रूप में समझकर अर्थानुवाद किया गया है। ‘सर्वशक्तिमान’ पारदर्शी और प्रचलित हिन्दी रूप है, जबकि ‘शद्दाय’ मूल ध्वनि तो रखता है पर सामान्य पाठक को अर्थ नहीं बताता।
- issue: नाओमी के कथन में परमेश्वर की क्रिया
  choice: ने मुझे बहुत कड़वाहट से भर दिया है
  alternative: ने मेरे साथ बहुत कठोर व्यवहार किया है
  rationale: मूल הֵמַר में ‘कड़वा करना’ का भाव है। चुना हुआ रूप नाओमी के अपने अनुभवजन्य कथन को उसी तीखेपन के साथ रखता और ‘मारा’ से जुड़े शब्दालंकार को बचाता है; यह कथन की धर्मवैचारिक वैधता पर अनुवादक का निर्णय नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। नामों को लिप्यंतरित रखा गया है और उनके अर्थ पादटिप्पणी में दिए गए हैं।
