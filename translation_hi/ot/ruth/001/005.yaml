lexical_decisions:
- source_word: וַיָּמ֥וּתוּ
  choice: तब ... मर गए
  rationale: वाव-परिणामी कथानक को अगली घटना की ओर बढ़ाता है; आधुनिक हिन्दी में ‘तब ... मर गए’ स्वाभाविक क्रम व्यक्त करता है।
- source_word: גַם שְׁנֵיהֶם
  choice: वे दोनों भी
  rationale: ‘भी’ पहले हुई मृत्यु के बाद इस अतिरिक्त हानि को दर्शाता है, और ‘दोनों’ दोनों पुत्रों के एक साथ उल्लेख पर बल बनाए रखता है।
- source_word: מַחְלוֹן וְכִלְיוֹן
  choice: महलोन और किल्योन
  rationale: व्यक्तिनामों का स्रोत-आधारित देवनागरी लिप्यंतरण किया गया है।
- source_word: וַתִּשָּׁאֵר
  choice: रह गई
  rationale: שׁאר का अर्थ ‘बचा/रह जाना’ है; शोक और वियोग के इस प्रसंग में ‘रह गई’ स्वाभाविक और मार्मिक है।
- source_word: הָאִשָּׁה
  choice: वह स्त्री
  rationale: इब्रानी पाठ यहाँ नाओमी का नाम या ‘पत्नी’ नहीं, बल्कि ‘स्त्री’ कहता है; संकेतवाचक ‘वह’ हिन्दी में निश्चितता को स्वाभाविक बनाता है।
- source_word: מִשְּׁנֵי יְלָדֶיהָ
  choice: अपने दोनों बच्चों के बिना
  rationale: पूर्वसर्ग यहाँ वंचित हो जाने का भाव देता है। יְלָדִים सामान्यतः ‘बच्चे/संतान’ है; यद्यपि प्रसंग में वे वयस्क पुत्र हैं, ‘बच्चों’ से मूल शब्द और माता का संबंधपरक दृष्टिकोण सुरक्षित रहता है।
- source_word: וּמֵאִישָׁהּ
  choice: और अपने पति के बिना
  rationale: संबंधसूचक रूप में אִישׁ का अर्थ यहाँ ‘पति’ है; दोहराया गया पूर्वसर्ग वियोग को व्यक्त करता है।
