base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/004.yaml
  text: And they took for themselves Moabite wives. The name of the one was Orpah[a], and the name of the other was Ruth. And they lived there about ten years.
translation:
  language: hi
  text: और उन्होंने मोआबी स्त्रियों से[a] विवाह किया। एक का नाम ओर्पा था और दूसरी का नाम रूत। वे वहाँ लगभग दस वर्ष रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, शाब्दिक रूप से, “उन्होंने अपने लिए मोआबी पत्नियाँ लीं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ לָהֶם נָשִׁים
  choice: उन्होंने ... स्त्रियों से विवाह किया
  rationale: यह इब्रानी मुहावरा पत्नी बनाने, अर्थात विवाह करने, के अर्थ में है। शाब्दिक ‘अपने लिए पत्नियाँ लीं’ की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से सटीक है।
- source_word: נָשִׁים מֹאֲבִיּוֹת
  choice: मोआबी स्त्रियों
  rationale: यह पद स्त्रियों की मोआबी पहचान बताता है; ‘विवाह किया’ के साथ ‘स्त्रियों’ कहना स्वाभाविक हिन्दी है।
- source_word: שֵׁם הָאַחַת ... וְשֵׁם הַשֵּׁנִית
  choice: एक का नाम ... और दूसरी का नाम
  rationale: यह मूल के समानांतर नामकरण-वाक्य को सहज हिन्दी में रखते हुए दोनों स्त्रियों के बीच भेद स्पष्ट करता है।
- source_word: עָרְפָּה
  choice: ओर्पा
  rationale: व्यक्तिवाचक नाम का हिन्दी ध्वन्यंतरण।
- source_word: רוּת
  choice: रूत
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी ध्वन्यंतरण।
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: वे वहाँ ... रहे
  rationale: יָשַׁב यहाँ किसी स्थान पर निवास करने के अर्थ में है; अवधि के साथ ‘रहे’ स्वाभाविक हिन्दी है।
- source_word: כְּעֶשֶׂר שָׁנִים
  choice: लगभग दस वर्ष
  rationale: उपसर्ग כְּ यहाँ अनुमानित अवधि प्रकट करता है, इसलिए ‘लगभग’ को स्पष्ट रखा गया है।
