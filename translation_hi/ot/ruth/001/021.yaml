id: RUT.1.21
reference: Ruth 1:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲנִי֙ מְלֵאָ֣ה הָלַ֔כְתִּי וְ/רֵיקָ֖ם הֱשִׁיבַ֣/נִי יְהוָ֑ה לָ֣/מָּה תִקְרֶ֤אנָה לִ/י֙ נָעֳמִ֔י וַֽ/יהוָה֙ עָ֣נָה בִ֔/י וְ/שַׁדַּ֖י הֵ֥רַֽע לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/021.yaml
  text: I went away full[a], but Yahweh has brought me back empty. Why do you call me Naomi[b], when Yahweh has testified against me and the Almighty has brought calamity on me?
translation:
  language: hi
  text: मैं भरी-पूरी होकर गई थी, पर याहवे मुझे खाली लौटा लाया है। तुम मुझे नाओमी क्यों कहती हो, जब याहवे ने मेरे विरुद्ध गवाही दी है[a] और सर्वशक्तिमान ने मुझ पर विपत्ति डाली है[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे विरुद्ध उत्तर दिया है।” इब्रानी क्रिया किसी के विरुद्ध उत्तर देने या गवाही देने का भाव रख सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “मेरी हानि की है।” इब्रानी अभिव्यक्ति नाओमी पर आई विपत्ति या प्रतिकूलता को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָה
  choice: भरी-पूरी
  rationale: यह विधेयात्मक विशेषण नाओमी की पहले की दशा बताता है। ‘भरी-पूरी’ स्वाभाविक हिन्दी में परिवार और जीवन की संपन्नता का व्यापक भाव रखता है तथा ‘खाली’ के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: הָלַכְתִּי
  choice: मैं ... होकर गई थी
  rationale: क्रिया का मूल अर्थ ‘मैं गई’ है। स्त्री वक्ता के अनुरूप रूप रखा गया है और पूर्व दशा को सहज हिन्दी में क्रिया से जोड़ा गया है।
- source_word: וְרֵיקָם
  choice: खाली
  rationale: यह क्रियाविशेषणात्मक रूप से ‘खाली/खाली हाथ’ का अर्थ देता है। ‘खाली’ अधिक संक्षिप्त है और מְלֵאָה के साथ मूल पाठ का तीखा विरोध सुरक्षित रखता है।
- source_word: הֱשִׁיבַנִי
  choice: मुझे ... लौटा लाया है
  rationale: שוב का हिफ़ील रूप कारणवाचक है—‘लौटा लाना।’ यह अनुवाद स्पष्ट रूप से याहवे की कर्तृता बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है; उसके स्थान पर कोई उपाधि नहीं रखी गई।
- source_word: לָמָּה תִקְרֶאנָה לִי נָעֳמִי
  choice: तुम मुझे नाओमी क्यों कहती हो
  rationale: क्रिया स्त्रीलिंग बहुवचन है और बेतलेहेम की स्त्रियों को संबोधित करती है। हिन्दी में ‘तुम ... कहती हो’ इस संबोधन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נָעֳמִי
  choice: नाओमी
  rationale: व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है। नाम के अर्थ को मुख्य पाठ में जोड़कर व्याख्या नहीं की गई।
- source_word: עָנָה בִי
  choice: मेरे विरुद्ध गवाही दी है
  rationale: इस संरचना में ענה का न्यायिक भाव ‘किसी के विरुद्ध उत्तर देना/गवाही देना’ हो सकता है। ‘गवाही दी है’ अगले खंड की विपत्ति से इसे अलग रखते हुए उस भाव को स्पष्ट करता है।
- source_word: שַׁדַּי
  choice: सर्वशक्तिमान
  rationale: ईश्वरीय उपाधि का अर्थानुवाद किया गया है; यह सम्मानपूर्ण और सामान्य हिन्दी में बोधगम्य है।
- source_word: הֵרַע לִי
  choice: मुझ पर विपत्ति डाली है
  rationale: רעע का हिफ़ील यहाँ हानि या विपत्ति पहुँचाने का भाव देता है। यह अभिव्यक्ति दैवी कर्तृता को बनाए रखती है, पर हिन्दी में परमेश्वर पर नैतिक बुराई करने का अनावश्यक आरोप नहीं लगाती।
theological_decisions:
- issue: नाओमी के दुःख में परमेश्वर की कर्तृता का चित्रण
  choice: याहवे ने ‘मेरे विरुद्ध गवाही दी है’ और सर्वशक्तिमान ने ‘मुझ पर विपत्ति डाली है।’
  alternative: इसे नरम करके कहना कि परमेश्वर ने केवल विपत्ति आने दी।
  rationale: इब्रानी पाठ नाओमी की कटु परिस्थिति को सीधे याहवे और शद्दै की कार्रवाई से जोड़ता है। अनुवाद इस धार्मिक तनाव को नरम या हल नहीं करता; साथ ही ‘विपत्ति’ नैतिक बुराई और आपदा के बीच हिन्दी में आवश्यक भेद बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। नाओमी के कथन की भावनात्मक तीव्रता के लिए ‘भरी-पूरी/खाली’ का सीधा विरोध और परमेश्वर की कर्तृता का प्रबल स्वर सुरक्षित रखा गया है।
