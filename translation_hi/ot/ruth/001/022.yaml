base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/022.yaml
  text: So Naomi returned[a], and Ruth the Moabite, her daughter-in-law, with her, who returned from the fields of Moab. And they came to Bethlehem at the beginning of the barley harvest.
translation:
  language: hi
  text: इस प्रकार नाओमी लौटी, और उसकी बहू मोआबी रूत भी उसके साथ लौटी, जो मोआब के खेतों से लौटकर आई थी। वे जौ की कटनी के आरम्भ में बेतलेहेम पहुँचीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּשָׁב
  choice: लौट आई
  rationale: שׁוב का सीधा अर्थ लौटना है। स्त्रीलिंग क्रिया-रूप नाओमी को कर्ता के रूप में स्पष्ट करता है और हिन्दी में ‘लौट आई’ स्वाभाविक है।
- source_word: הַמּוֹאֲבִיָּה
  choice: मोआबी
  rationale: स्त्रीलिंग जातिवाचक विशेषण को संक्षिप्त और प्रमुख जातीय पहचान के रूप में बनाए रखता है।
- source_word: כַלָּתָהּ
  choice: उसकी बहू
  rationale: यह मानक और स्वाभाविक हिन्दी संबंध-सूचक पद है।
- source_word: הַשָּׁבָה
  choice: जो ... लौटी थी
  rationale: स्त्रीलिंग एकवचन कृदन्त को निकटतम पद रूत से जोड़ते हुए उसकी क्रियात्मक विशेषता बनाए रखी गई है; हिन्दी में संबंधवाचक उपवाक्य अधिक स्वाभाविक है।
- source_word: מִשְּׂדֵי מוֹאָב
  choice: मोआब के खेतों से
  rationale: שָׂדֶה के बहुवचन का शाब्दिक चित्र सुरक्षित रखा गया है, जबकि पादटिप्पणी इसके व्यापक भौगोलिक अर्थ को बताती है।
- source_word: בֵּית לֶחֶם
  choice: बैतलहम
  rationale: स्थान-नाम का हिन्दी बाइबलीय रूप प्रयोग किया गया है।
- source_word: בִּתְחִלַּת קְצִיר שְׂעֹרִים
  choice: जौ की कटनी के आरम्भ में
  rationale: समय-सूचक रचना और जौ की फसल की कटनी, दोनों को स्पष्ट तथा सहज हिन्दी में रखा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कटनी’ कृषि-संदर्भ को स्पष्ट करती है, और मूल के स्त्रीलिंग बहुवचन भाव को ‘पहुँचीं’ में बनाए रखा गया है।
