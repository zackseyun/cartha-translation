source:
  edition: WLC
  text: וַ/תֹּ֗אמֶר הִנֵּה֙ שָׁ֣בָה יְבִמְתֵּ֔/ךְ אֶל עַמָּ֖/הּ וְ/אֶל אֱלֹהֶ֑י/הָ שׁ֖וּבִי אַחֲרֵ֥י יְבִמְתֵּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/015.yaml
  text: And she said[a], “Look, your sister-in-law has gone back to her people and to her gods[b]. Go back after your sister-in-law.”
translation:
  language: hi
  text: तब उसने कहा, “देख, तेरी सह-बहू[a] अपने लोगों और अपने देवताओं[b] के पास लौट गई है। तू अपनी सह-बहू के पीछे लौट जा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल शब्द विवाह-संबंध से बनी स्त्री रिश्तेदार के लिए है। यहाँ ओरपा और रूत एक ही परिवार में भाइयों से विवाहित थीं; उनके पतियों का आयुक्रम ज्ञात नहीं है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘उसके देवताओं’; कुछ अनुवाद ‘उसके देवता’ करते हैं, पर बहुवचन संभवतः मोआब के देवी-देवताओं की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: तब उसने कहा
  rationale: कथात्मक wayyiqtol नाओमी के कथन का परिचय देता है। हिंदी में ‘तब उसने कहा’ प्रसंग का स्वाभाविक प्रवाह बनाए रखता है।
- source_word: הִנֵּה
  choice: देख
  rationale: यह ध्यान आकर्षित करने वाला संकेतक है; ‘देख’ आधुनिक, सीधा और बोलचाल में स्वाभाविक है।
- source_word: שָׁבָה / שׁוּבִי
  choice: लौट गई है / लौट जा
  rationale: दोनों रूपों में मूल धातु שוב की पुनरावृत्ति को ‘लौटना’ से बनाए रखा गया है—पहला पूर्ण क्रिया और दूसरा स्त्रीलिंग एकवचन आज्ञार्थक है।
- source_word: יְבִמְתֵּךְ
  choice: तेरी जेठानी
  rationale: यह विवाह-संबंध से बनी स्त्री रिश्तेदार को दर्शाता है। प्रसंग में ओरपा रूत के दिवंगत पति के भाई की पत्नी थी, इसलिए ‘जेठानी’ स्वाभाविक हिंदी संबंधसूचक शब्द है; आयुक्रम स्पष्ट न होने के कारण टिप्पणी जोड़ी गई है।
- source_word: אֶל עַמָּהּ
  choice: अपने लोगों के पास
  rationale: עַם यहाँ जातीय-सामुदायिक समूह को दर्शाता है; ‘अपने लोग’ आधुनिक हिंदी में इसी अर्थ को सहजता से व्यक्त करता है।
- source_word: וְאֶל אֱלֹהֶיהָ
  choice: और अपने देवताओं के पास
  rationale: संदर्भ मोआबी उपासना का है। रूप बहुवचन अर्थ की अनुमति देता है और यहाँ ‘देवताओं’ से संभावित बहुदेववादी संदर्भ सुरक्षित रहता है।
- source_word: אַחֲרֵי
  choice: के पीछे
  rationale: मूल पाठ में किसी के पीछे चलने या उसी मार्ग पर जाने का स्थानिक रूपक है; ‘के पीछे’ उसे सीधे बनाए रखता है।
theological_decisions:
- issue: मोआबी उपासना के संदर्भ में אֱלֹהֶיהָ का वचन
  choice: अपने देवताओं
  alternative: अपने देवता
  rationale: אֱלֹהִים कभी एकवचन अर्थ भी दे सकता है, पर यहाँ मोआब के लोगों और उनकी धार्मिक पहचान की ओर लौटने का संदर्भ है। बहुवचन ‘देवताओं’ मूल रूप और संभावित मोआबी बहुदेववादी संदर्भ को अधिक स्वाभाविक रूप से दर्शाता है, जबकि पादटिप्पणी वास्तविक भाषिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सीधी संवाद-शैली। पारिवारिक निकटता और एकवचन स्त्री संबोधन के कारण ‘तेरी/तू’ रखा गया है। ‘लौट’ की पुनरावृत्ति मूल שוב की पुनरावृत्ति को सुरक्षित रखती है।
