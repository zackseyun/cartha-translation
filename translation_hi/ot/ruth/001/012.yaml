  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שֹׁ֤בְנָה בְנֹתַ/י֙ לֵ֔כְןָ כִּ֥י זָקַ֖נְתִּי מִ/הְי֣וֹת לְ/אִ֑ישׁ כִּ֤י אָמַ֨רְתִּי֙ יֶשׁ לִ֣/י תִקְוָ֔ה גַּ֣ם הָיִ֤יתִי הַ/לַּ֨יְלָה֙ לְ/אִ֔ישׁ וְ/גַ֖ם יָלַ֥דְתִּי בָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/012.yaml
  text: Turn back[a], my daughters; go on, for I am too old to belong to a husband. Even if I were to say[b], ‘There is still hope for me’—even if I were with a husband tonight and even bore sons—
translation:
  language: hi
  text: लौट जाओ[a], मेरी बेटियो; चली जाओ, क्योंकि मैं किसी पुरुष की पत्नी बनने के लिए बहुत बूढ़ी हो चुकी हूँ। भले ही मैं कहूँ, ‘मेरे लिए आशा है,’[b] भले ही आज रात ही किसी पुरुष की पत्नी बन जाऊँ और बेटे भी जनूँ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वापस जाओ।”
    reason: שׁוּב के दिशात्मक अर्थ के लिए स्वाभाविक हिन्दी विकल्प।
  - marker: b
    text: 'हिब्रू में काल्पनिक शर्तों की एक शृंखला है: “क्योंकि यदि मैं कहूँ, ‘मेरे लिए आशा है,’ भले ही आज रात ही मैं किसी पुरुष की हो जाऊँ और बेटे भी जनूँ—”'
    reason: मूल की काल्पनिक वाक्यरचना तथा ‘किसी पुरुष की होना’ वाले वैवाहिक संबंध-मुहावरे को दिखाने के लिए।
lexical_decisions:
- source_word: שֹׁבְנָה
  choice: लौट जाओ
  rationale: स्त्रीलिंग बहुवचन आज्ञार्थक रूप है; प्रसंग में नाओमी दोनों बहुओं से अपने साथ आगे न आने और वापस जाने को कहती है।
- source_word: בְנֹתַי
  choice: मेरी बेटियो
  rationale: स्नेहपूर्ण पारिवारिक संबोधन को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: לֵכְןָ
  choice: चली जाओ
  rationale: दूसरा स्त्रीलिंग बहुवचन आज्ञार्थक है; हिन्दी में यह उन्हें अपनी राह चले जाने की बात स्वाभाविक ढंग से व्यक्त करता है।
- source_word: זָקַנְתִּי
  choice: मैं इतनी बूढ़ी हो चुकी हूँ
  rationale: पूर्ण क्रिया से उत्पन्न वर्तमान अवस्था व्यक्त होती है; ‘इतनी’ आगे बताए गए परिणाम से संबंध स्पष्ट करती है।
- source_word: מִהְיוֹת לְאִישׁ
  choice: किसी पुरुष की पत्नी नहीं बन सकती
  rationale: शाब्दिक संरचना ‘किसी पुरुष के लिए/की होना’ विवाह-संबंध की ओर संकेत करती है। हिन्दी में ‘पत्नी बनना’ अर्थ को स्वाभाविक रखता है, जबकि पादटिप्पणी मूल मुहावरे की सीमा बताती है।
- source_word: כִּי אָמַרְתִּי
  choice: यदि मैं कहती भी
  rationale: यहाँ כִּי काल्पनिक शर्तों की शृंखला आरम्भ करता है; ‘भी’ अत्यन्त असंभाव्य परिस्थिति का भाव देता है।
- source_word: יֶשׁ לִי תִקְוָה
  choice: मेरे लिए आशा है
  rationale: हिब्रू की अस्तित्ववाचक रचना को निकटता से सुरक्षित रखता है और अनावश्यक रूप से ‘अभी भी’ नहीं जोड़ता।
- source_word: גַּם הָיִיתִי הַלַּיְלָה לְאִישׁ
  choice: यदि आज रात ही मेरी शादी हो जाती
  rationale: काल्पनिक तत्काल वैवाहिक संबंध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है; ‘ही’ הלילה के समयगत जोर को उभारता है।
- source_word: וְגַם יָלַדְתִּי בָנִים
  choice: और मैं बेटे भी जनती
  rationale: जन्म देने की क्रिया और स्पष्ट पुरुषवाची बहुवचन ‘बेटे’ दोनों को बनाए रखता है।
theological_decisions:
- issue: देवर-विवाह और वंश-निरंतरता के प्रसंग में संतान का पुरुषवाची उल्लेख
  choice: बेटे
  alternative: संतान / बच्चे
  rationale: मूल में בָנִים स्पष्ट रूप से ‘बेटे’ है और नाओमी का तर्क संभावित पुरुष उत्तराधिकारियों पर निर्भर है; इसलिए इसे लिंग-निरपेक्ष नहीं किया गया।
- issue: काल्पनिक शर्तों की शृंखला
  choice: यदि…भी… और यदि… और…भी
  alternative: क्योंकि यदि मैं कहती…
  rationale: हिब्रू वाक्य की तर्कगत शर्त और बढ़ती हुई असंभाव्यता को सुरक्षित रखते हुए हिन्दी में उसे कारणवाचक कथन न बनने देना आवश्यक है।
translation_notes:
  register: आधुनिक मानक हिन्दी; नाओमी के स्नेहपूर्ण संबोधन और गंभीर, निराशापूर्ण तर्क को बनाए रखा गया है। ‘पत्नी बन सकती’ तथा ‘शादी हो जाती’ सामान्य पाठक के लिए स्वाभाविक हैं, जबकि पादटिप्पणी हिब्रू के संबंधवाचक मुहावरे और काल्पनिक शृंखला को सुरक्षित रखती है।
