revisions:
- from: तब वह उस स्थान से, जहाँ वह रह रही थी,[a] अपनी दोनों बहुओं के साथ निकल पड़ी। वे यहूदा देश लौटने के लिए मार्ग पर चलने लगीं।
  to: तब वह उस स्थान से, जहाँ वह थी, अपनी दोनों बहुओं के साथ निकल पड़ी[a], और वे यहूदा देश लौटने के लिए मार्ग पर चलीं।
  rationale: 'The wording “जहाँ वह थी” preserves the Hebrew’s understated relative clause without imposing a progressive sense. “मार्ग पर चलीं” renders the plural narrative verb without adding that the women only began their journey. The single sentence retains the Hebrew coordination: Naomi departed with her daughters-in-law, and the three went on the road to return to the land of Judah.'
