base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/007.yaml
  text: So she went out from the place where she had been[a], and her two daughters-in-law with her, and they went on the way to return to the land of Judah.
translation:
  language: hi
  text: तब वह उस स्थान से, जहाँ वह थी, अपनी दोनों बहुओं के साथ निकल पड़ी[a], और वे यहूदा देश लौटने के लिए मार्ग पर चलीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक स्वाभाविक रूप में, “उस स्थान को छोड़ दिया।” इब्रानी क्रिया का शाब्दिक अर्थ “निकल गई” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: तब वह ... निकल पड़ी
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘निकल पड़ी’ יצא की वास्तविक प्रस्थान-गतिशीलता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מִן הַמָּקוֹם אֲשֶׁר הָיְתָה שָׁמָּה
  choice: उस स्थान से, जहाँ वह रह रही थी
  rationale: सम्बन्धवाचक उपवाक्य नाओमी के पिछले निवास-स्थान की पहचान करता है; हिन्दी में यह सहज है और केवल क्षणिक उपस्थिति के बजाय प्रसंगगत निवास व्यक्त करता है।
- source_word: וּשְׁתֵּי כַלֹּתֶיהָ עִמָּהּ
  choice: अपनी दोनों बहुओं के साथ
  rationale: इस प्रसंग में כַּלָּה का अर्थ ‘बहू’ है। हिन्दी की स्वाभाविक पद-रचना के लिए ‘उसके साथ उसकी दोनों बहुएँ’ की अपेक्षा यह रूप चुना गया।
- source_word: וַתֵּלַכְנָה בַדֶּרֶךְ
  choice: वे ... मार्ग पर चलने लगीं
  rationale: स्त्रीलिंग बहुवचन क्रिया तीनों स्त्रियों को सूचित करती है। ‘मार्ग पर चलने लगीं’ यात्रा की वास्तविक स्थिति को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לָשׁוּב
  choice: लौटने के लिए
  rationale: שׁוּב का मूल अर्थ ‘लौटना’ है और रूत 1 में इसकी विषयगत पुनरावृत्ति महत्त्वपूर्ण है।
- source_word: אֶל אֶרֶץ יְהוּדָה
  choice: यहूदा देश
  rationale: אֶרֶץ को छोड़े बिना हिन्दी में भूभाग का स्वाभाविक संकेत देने के लिए ‘देश’ चुना गया।
