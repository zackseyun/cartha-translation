  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण संवाद। नाओमी के लिए निकटता-सूचक ‘तुम’ रखा गया है। मुख्य पाठ में प्रतिवाद की स्वाभाविकता और पादटिप्पणी में हिब्रू की शाब्दिक अस्पष्टता दोनों सुरक्षित हैं।
