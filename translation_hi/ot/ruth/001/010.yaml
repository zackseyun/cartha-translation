  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “क्योंकि हम तुम्हारे साथ तुम्हारे लोगों के पास लौटेंगी,” या “निश्चय ही हम तुम्हारे साथ तुम्हारे लोगों के पास लौटेंगी।”'
    reason: כִּי के संयोजक अथवा बलसूचक अर्थ की वास्तविक सम्भावना को सुरक्षित रखना।
lexical_decisions:
- source_word: וַתֹּאמַרְנָה
  choice: पर उन्होंने कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; पिछले पद में नाओमी के आग्रह के विपरीत उत्तर होने के कारण आधुनिक हिन्दी में ‘पर’ स्वाभाविक है। स्त्रीलिंग बहुवचन क्रिया का आशय सन्दर्भ में दोनों बहुओं से स्पष्ट है।
- source_word: לָּהּ
  choice: उससे
  rationale: לְ के साथ तृतीय पुरुष स्त्रीलिंग एकवचन प्रत्यय अप्रत्यक्ष कर्म नाओमी को सूचित करता है; हिन्दी में ‘उससे कहा’ स्वाभाविक प्रयोग है।
- source_word: כִּי
  choice: नहीं
  rationale: यहाँ כִּי नाओमी के प्रस्ताव का दृढ़ प्रतिवाद आरम्भ करता है। ‘नहीं’ संवाद की शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है; ‘क्योंकि/निश्चय ही’ जैसी अधिक शाब्दिक सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: אִתָּךְ
  choice: तुम्हारे साथ
  rationale: पूर्वसर्ग אֵת और स्त्रीलिंग एकवचन प्रत्यय नाओमी के साथ जाने का भाव व्यक्त करते हैं।
- source_word: נָשׁוּב
  choice: हम लौटेंगी
  rationale: שׁוּב का मूल भाव ‘लौटना’ है और रूत 1 में बार-बार आने वाले इसी धातु-मूल से शब्दगत सम्बन्ध बना रहता है। वक्ता स्त्रियाँ हैं, इसलिए हिन्दी में स्त्रीलिंग बहुवचन रखा गया है।
- source_word: לְעַמֵּךְ
  choice: तुम्हारे लोगों के पास
  rationale: עַם नाओमी के जातीय-सामुदायिक लोगों को सूचित करता है, केवल निकट कुटुम्ब को नहीं। गमन के लक्ष्य के लिए हिन्दी में ‘लोगों के पास’ स्वाभाविक है।
