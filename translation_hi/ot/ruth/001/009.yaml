- source_word: מְנוּחָה
  choice: विश्राम
  rationale: मूल शब्द के प्रमुख अर्थ को सुरक्षित रखता है; प्रसंग में इसमें वैवाहिक घर की स्थिरता और सुरक्षा भी निहित है।
- source_word: אִשָּׁה בֵּית אִישָׁהּ
  choice: तुम दोनों अपने-अपने पति के घर में
  rationale: स्त्रीलिंग एकवचन की वितरणात्मक अभिव्यक्ति को दोनों बहुओं के संदर्भ में स्पष्ट और स्वाभाविक हिन्दी देता है।
- source_word: וַתִּשַּׁק לָהֶן
  choice: तब उसने उन्हें चूमा
  rationale: सरल कथात्मक क्रम को स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: וַתִּשֶּׂאנָה קוֹלָן וַתִּבְכֶּינָה
  choice: वे फूट-फूटकर रोने लगीं
  rationale: ‘अपनी आवाज़ उठाकर रोना’ इब्रानी मुहावरे का स्वाभाविक हिन्दी समतुल्य है और सुनाई देने वाले तीव्र विलाप का भाव व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में प्रयुक्त परमेश्वर के व्यक्तिवाचक नाम को सुरक्षित रखने के लिए उसका निकट लिप्यंतरण किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रखी गई है। ‘फूट-फूटकर रोने लगीं’ मूल इब्रानी मुहावरे का अर्थपरक, स्वाभाविक रूप है।
