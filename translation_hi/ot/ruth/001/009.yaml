  text: May Yahweh grant that you find rest[a], each of you in the house of her husband." Then she kissed them, and they lifted up their voices and wept.
translation:
  language: hi
  text: याहवे तुम्हें यह वरदान दे कि तुम दोनों अपने-अपने पति के घर में विश्राम[a] पाओ।” तब उसने उन्हें चूमा, और वे ऊँची आवाज़ में रोईं।
