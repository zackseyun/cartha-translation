  text: הֲ/לָהֵ֣ן תְּשַׂבֵּ֗רְנָה עַ֚ד אֲשֶׁ֣ר יִגְדָּ֔לוּ הֲ/לָהֵן֙ תֵּֽעָגֵ֔נָה לְ/בִלְתִּ֖י הֱי֣וֹת לְ/אִ֑ישׁ אַ֣ל בְּנֹתַ֗/י כִּֽי מַר לִ֤/י מְאֹד֙ מִ/כֶּ֔ם כִּֽי יָצְאָ֥ה בִ֖/י יַד יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/013.yaml
  text: Would you wait for them until they were grown? Would you refrain from belonging to a man for them? No[a], my daughters, for it is much more bitter for me than for you, because the hand of Yahweh has gone out against me.
translation:
  language: hi
  text: क्या तुम उनके बड़े होने तक उनकी बाट जोहती रहतीं? क्या तुम उनके लिए किसी पुरुष से विवाह करने से अपने को रोके रखतीं?[a] नहीं, मेरी बेटियो! क्योंकि मेरी दशा तुम्हारी दशा से कहीं अधिक कड़वी है, क्योंकि यहोवा का हाथ मेरे विरुद्ध निकल पड़ा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दुर्लभ इब्रानी क्रिया का अर्थ सम्भवतः, ‘क्या तुम उनके लिए अविवाहित रहतीं?’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׂבֵּרְנָה
  choice: बाट जोहती रहतीं
  rationale: क्रिया שׂבר यहाँ आशा रखते हुए प्रतीक्षा करने का भाव देती है। प्रसंग में नाओमी काल्पनिक पुत्रों के बड़े होने तक प्रतीक्षा करने की बात कर रही है; ‘बाट जोहती रहतीं’ इस दीर्घ प्रतीक्षा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַד אֲשֶׁר יִגְדָּלוּ
  choice: उनके बड़े होने तक
  rationale: काल्पनिक पुत्रों के विवाह योग्य आयु तक बढ़ने का समयसूचक भाव सीधे और स्वाभाविक रूप से व्यक्त होता है।
- source_word: תֵּעָגֵנָה לְבִלְתִּי הֱיוֹת לְאִישׁ
  choice: विवाह करने से रुकी रहतीं
  rationale: दुर्लभ क्रिया עגן का सटीक अर्थ कुछ अनिश्चित है, पर साथ का वाक्यांश ‘किसी पुरुष की न होना’ विवाह से रुके रहने की ओर संकेत करता है। मुख्य पाठ अर्थ स्पष्ट करता है और पादटिप्पणी दुर्लभ क्रिया की वैकल्पिक छाया सुरक्षित रखती है।
- source_word: אַל בְּנֹתַי
  choice: नहीं, मेरी बेटियो!
  rationale: אַל यहाँ केवल निषेधाज्ञा नहीं, बल्कि नाओमी की भावपूर्ण अस्वीकृति है। हिन्दी में ‘नहीं, मेरी बेटियो!’ उसका संवादात्मक बल स्वाभाविक रूप से रखता है।
- source_word: כִּי מַר לִי מְאֹד מִכֶּם
  choice: क्योंकि मेरा दुःख तुम्हारे दुःख से कहीं अधिक कड़वा है
  rationale: מַר की ‘कड़वा’ रूपक-छवि और מִכֶּם का तुलनात्मक अर्थ दोनों रखे गए हैं। ‘दुःख’ जोड़ने से हिन्दी में आशय स्पष्ट होता है, बिना तुलना मिटाए।
- source_word: יָצְאָה בִי יַד יְהוָה
  choice: यहोवा का हाथ मेरे विरुद्ध उठा है
  rationale: ‘हाथ’ की मूल बिंबात्मक भाषा और विरोधी दिशा दोनों सुरक्षित हैं। शाब्दिक ‘निकल गया है’ हिन्दी में अप्राकृतिक होता; ‘उठा है’ दैवी प्रतिकूल कार्रवाई का भाव स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: नाओमी द्वारा अपने दुःख में दैवी सक्रियता का कथन
  choice: क्योंकि यहोवा का हाथ मेरे विरुद्ध उठा है
  alternative: क्योंकि यहोवा ने मुझे दुःख दिया है
  rationale: मूल पाठ नाओमी के दुःख को यहोवा के ‘हाथ’ से जोड़ता और उसे अपने विरुद्ध बताता है। अनुवाद इस तनावपूर्ण कथन को न तो नरम करता है, न उसे वस्तुनिष्ठ धर्मवैज्ञानिक निष्कर्ष में बदलता है; वक्ता की धारणा और मूल रूपक दोनों बने रहते हैं।
- issue: מִכֶּם में तुलना का आशय
  choice: मेरा दुःख तुम्हारे दुःख से कहीं अधिक कड़वा है
  alternative: तुम्हारे कारण मेरा दुःख अत्यन्त कड़वा है
  rationale: पूर्वसर्ग מן यहाँ तुलनात्मक अर्थ में समझा गया है, जैसा प्रसंग और सामान्य व्याख्या समर्थन करते हैं। फिर भी हिब्रू की संक्षिप्तता में ‘तुम्हारे कारण/तुम्हारी ओर से’ की संभावना पूरी तरह असंभव नहीं है, इसलिए इसे पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज संवादात्मक स्तर रखा गया है। नाओमी के भावपूर्ण प्रश्नों और सम्बोधन को स्वाभाविक बनाने के लिए ‘बाट जोहती रहतीं’, ‘नहीं, मेरी बेटियो!’ जैसे रूप चुने गए हैं। मुख्य पाठ में पादटिप्पणी [a] उपस्थित है; तुलनात्मक वाक्य के लिए दी गई अतिरिक्त पादटिप्पणी [b] भी मुख्य पाठ में अपेक्षित थी, इसलिए प्रकाशन-पाठ में ‘कड़वा है[b]’ होना चाहिए।
