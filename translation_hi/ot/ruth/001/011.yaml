  text: וַ/תֹּ֤אמֶר נָעֳמִי֙ שֹׁ֣בְנָה בְנֹתַ֔/י לָ֥/מָּה תֵלַ֖כְנָה עִמִּ֑/י הַֽ/עֽוֹד לִ֤/י בָנִים֙ בְּֽ/מֵעַ֔/י וְ/הָי֥וּ לָ/כֶ֖ם לַ/אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/011.yaml
  text: But Naomi said[a], “Turn back, my daughters. Why would you go with me? Do I still have sons in my womb, that they may become husbands for you?”
translation:
  language: hi
  text: लेकिन नाओमी ने कहा, “लौट जाओ, मेरी बेटियो[a]। तुम मेरे साथ क्यों चलोगी? क्या मेरे गर्भ में अब भी बेटे हैं कि वे तुम्हारे पति बनें?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘मेरी बेटियाँ’ है; नाओमी अपनी बहुओं को पारिवारिक स्नेह से इस प्रकार संबोधित कर रही है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: लेकिन नाओमी ने कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, पर इस प्रसंग में नाओमी का कथन बहुओं के साथ चलने के संकल्प के प्रतिवाद में है; इसलिए ‘लेकिन’ स्वाभाविक रूप से विरोध दर्शाता है।
- source_word: שֹׁבְנָה
  choice: लौट जाओ
  rationale: שׁוב का स्त्रीलिंग बहुवचन आदेश है। ‘लौट जाओ’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בְנֹתַי
  choice: मेरी बेटियो
  rationale: शाब्दिक अर्थ ‘मेरी बेटियाँ’ है; संबोधन में ‘मेरी बेटियो’ नाओमी का पारिवारिक स्नेह बनाए रखता है, जबकि संदर्भगत पहचान पादटिप्पणी में स्पष्ट की गई है।
- source_word: לָמָּה תֵלַכְנָה עִמִּי
  choice: तुम मेरे साथ क्यों चलोगी?
  rationale: अपूर्ण क्रिया यहाँ भावी/संभावनात्मक आलंकारिक प्रश्न है। ‘क्यों चलोगी?’ नाओमी की रोकने वाली अपील को सहज हिन्दी में व्यक्त करता है।
- source_word: הַעוֹד לִי
  choice: क्या ... अब भी ... हैं
  rationale: עוֹד निरंतरता या शेष होने का भाव देता है; ‘अब भी’ इस अर्थ को स्पष्ट रखता है।
- source_word: בָנִים
  choice: बेटे
  rationale: इब्रानी में विशेष रूप से पुत्रों का उल्लेख है, जो आगे विवाह की संभावना के तर्क के लिए आवश्यक है।
- source_word: בְּמֵעַי
  choice: मेरे गर्भ में
  rationale: מֵעֶה भीतर के अंगों को दर्शा सकता है; संतान-जन्म के इस संदर्भ में ‘गर्भ’ सटीक और स्वाभाविक है।
- source_word: וְהָיוּ לָכֶם לַאֲנָשִׁים
  choice: कि वे तुम्हारे पति बनें
  rationale: यह संभावित परिणाम व्यक्त करता है। אֲנָשִׁים यहाँ सामान्य ‘पुरुष’ नहीं, विवाह-संबंध में ‘पति’ है। ‘बनें’ मूल की संभावनात्मकता को बिना अनावश्यक व्याख्या के बनाए रखता है।
