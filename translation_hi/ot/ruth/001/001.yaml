id: RUT.1.1
reference: Ruth 1:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/ימֵי֙ שְׁפֹ֣ט הַ/שֹּׁפְטִ֔ים וַ/יְהִ֥י רָעָ֖ב בָּ/אָ֑רֶץ וַ/יֵּ֨לֶךְ אִ֜ישׁ מִ/בֵּ֧ית לֶ֣חֶם יְהוּדָ֗ה לָ/גוּר֙ בִּ/שְׂדֵ֣י מוֹאָ֔ב ה֥וּא וְ/אִשְׁתּ֖/וֹ וּ/שְׁנֵ֥י בָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/001.yaml
  text: It happened in the days when the judges judged that there was a famine in the land[c][b][a], and a man went from Bethlehem of Judah to sojourn in the fields of Moab—he and his wife and his two sons.
translation:
  language: hi
  text: जिन दिनों न्यायी न्याय करते थे[a], उन दिनों ऐसा हुआ कि देश में अकाल पड़ा। तब यहूदा के बैतलहम का एक पुरुष अपनी पत्नी और अपने दो बेटों के साथ मोआब के मैदानों[c] में परदेशी होकर रहने[b] के लिए गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन दिनों न्यायी शासन करते थे।” इब्रानी में एक ही मूल शब्द की पुनरावृत्ति है; शाब्दिक रूप से, “न्यायियों के न्याय करने के दिनों में।”
    reason: lexical_alternative
  - marker: b
    text: इसका भाव अपने देश से बाहर एक परदेशी के रूप में निवास करने का है; इससे स्थायी रूप से बसना आवश्यक रूप से अभिप्रेत नहीं है।
    reason: cultural_note
  - marker: c
    text: या, “मोआब के भूभाग में” अथवा “मोआब देश में।” शाब्दिक रूप से, “मोआब के मैदानों में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ऐसा हुआ
  rationale: यह कथा आरम्भ करने वाला इब्रानी रूप है। ‘ऐसा हुआ’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक ‘अब’ नहीं जोड़ता।
- source_word: בִּימֵי
  choice: जिन दिनों … उन दिनों
  rationale: इब्रानी काल-सूचक मुहावरे को स्पष्ट और प्रवाहपूर्ण हिन्दी वाक्य-विन्यास में प्रस्तुत करता है।
- source_word: שְׁפֹט הַשֹּׁפְטִים
  choice: न्यायी न्याय करते थे
  rationale: मूल में ‘न्याय’ धातु की पुनरावृत्ति को बनाए रखता है और न्याय करने तथा शासन करने के बीच की अर्थ-व्याप्ति को संकुचित नहीं करता।
- source_word: רָעָב
  choice: अकाल
  rationale: किसी क्षेत्र में भोजन की गंभीर कमी के लिए यही सटीक और सामान्य हिन्दी शब्द है।
- source_word: בָּאָרֶץ
  choice: देश में
  rationale: यहाँ הארץ उस देश या भूभाग को सूचित करता है जहाँ कथा आरम्भ होती है; ‘देश में’ सहज है और पाठ में न दिया गया कोई विशिष्ट नाम नहीं जोड़ता।
- source_word: אִישׁ
  choice: एक पुरुष
  rationale: यह एक विशिष्ट पुरुष को सूचित करता है, जिसका नाम अगले पद में बताया जाता है।
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: यहूदा के बैतलहम का
  rationale: स्थान-संबंध को स्वाभाविक हिन्दी में व्यक्त करता और बैतलहम को यहूदा से संबद्ध करता है।
- source_word: לָגוּר
  choice: परदेशी होकर रहने
  rationale: גור अपने स्थान से बाहर परदेशी या बाहरी व्यक्ति के रूप में निवास करने का भाव रखता है; हिन्दी पदबंध इस सांस्कृतिक अर्थ को सुरक्षित रखता है।
- source_word: בִּשְׂדֵי מוֹאָב
  choice: मोआब के मैदानों में
  rationale: बहुवचन שְׂדֵי का ठोस भू-दृश्य बनाए रखता है; प्रसंग में यह पूरे मोआबी भूभाग के लिए भी प्रयुक्त हो सकता है।
- source_word: הוּא וְאִשְׁתּוֹ וּשְׁנֵי בָנָיו
  choice: अपनी पत्नी और अपने दो बेटों के साथ
  rationale: साथ गए परिवार के सभी सदस्यों को स्पष्ट रखता है और हिन्दी में मूल की सूची को स्वाभाविक ढंग से व्यक्त करता है।
