translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘न्यायी न्याय करते थे’ जानबूझकर मूल की शब्द-पुनरावृत्ति बचाता है, जबकि पादटिप्पणी अधिक सहज विकल्प देती है। ‘परदेशी होकर रहने’ से अस्थायी अथवा बाहरी निवासी का भाव व्यक्त होता है, और ‘मैदानों’ से मूल का कृषिपरक भू-दृश्य सुरक्षित रहता है।
