source:
  edition: WLC
  text: וַ/תָּ֤קָם הִיא֙ וְ/כַלֹּתֶ֔י/הָ וַ/תָּ֖שָׁב מִ/שְּׂדֵ֣י מוֹאָ֑ב כִּ֤י שָֽׁמְעָה֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב כִּֽי פָקַ֤ד יְהוָה֙ אֶת עַמּ֔/וֹ לָ/תֵ֥ת לָ/הֶ֖ם לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/006.yaml
  text: Then she arose with her daughters-in-law and returned from the fields of Moab[a], because in the field of Moab she had heard that Yahweh had visited his people to give them food.
translation:
  language: hi
  text: तब वह अपनी बहुओं के साथ उठी और मोआब के प्रदेश से लौटने चली, क्योंकि उसने मोआब के प्रदेश में सुना था कि याहवे ने अपने लोगों को भोजन[a] देने के लिए उनकी सुधि ली थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “रोटी”; इब्रानी לֶחֶם का अर्थ विशेष रूप से रोटी भी हो सकता है और व्यापक रूप से भोजन या आहार भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: तब वह ... उठी
  rationale: वाव-क्रमिक क्रिया कथा में अगली घटना को आगे बढ़ाती है; ‘तब’ और ‘उठी’ उसके क्रम तथा क्रिया-चित्र दोनों को बनाए रखते हैं।
- source_word: וְכַלֹּתֶיהָ
  choice: अपनी बहुओं के साथ
  rationale: हिब्रू में शाब्दिक रूप से ‘वह और उसकी बहुएँ’ है; हिन्दी में सहभागिता को ‘के साथ’ कहना स्वाभाविक है।
- source_word: וַתָּשָׁב
  choice: लौटने लगी
  rationale: שׁוב का अर्थ लौटना है। अगले पदों में यात्रा आरम्भ होने का वर्णन है, इसलिए यहाँ ‘लौटने लगी’ अभिप्रेत गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִשְּׂדֵי מוֹאָב
  choice: मोआब के प्रदेश से
  rationale: שׂדה का बहुवचन यहाँ खेतों से अधिक व्यापक भूभाग या देहात को सूचित करता है; ‘प्रदेश’ आधुनिक हिन्दी में उस क्षेत्रीय अर्थ को स्पष्ट करता है।
- source_word: שָׁמְעָה
  choice: उसने ... सुना था
  rationale: पूर्ण क्रिया लौटने के निर्णय से पहले मिली सूचना की पृष्ठभूमि देती है; ‘सुना था’ उस पूर्वकालिक संबंध को स्पष्ट करता है।
- source_word: בִּשְׂדֵה מוֹאָב
  choice: मोआब में
  rationale: एकवचन שׂדה यहाँ क्षेत्रीय अर्थ में है। ‘मोआब में’ हिन्दी में स्वाभाविक है और स्थान को बिना कृत्रिम ‘खेत’ के स्पष्ट करता है।
- source_word: פָּקַד
  choice: सुधि लेकर
  rationale: इस संदर्भ में פקד परमेश्वर के अनुग्रहपूर्ण ध्यान और हस्तक्षेप को दर्शाता है। ‘सुधि लेना’ उस भाव को बनाए रखता है, जबकि सहायता के ठीक प्रकार को जरूरत से अधिक निश्चित नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह उपाधि नहीं, इब्रानी चतुरक्षरीय व्यक्तिगत नाम है; हिन्दी लिप्यंतरण ‘याहवे’ नाम को प्रत्यक्ष रखता है।
- source_word: עַמּוֹ
  choice: अपनी प्रजा
  rationale: עם यहाँ परमेश्वर से संबंध रखने वाले समुदाय को दर्शाता है; ‘प्रजा’ इस सामुदायिक और वाचा-संबंधी भाव को गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: לָתֵת לָהֶם לָחֶם
  choice: उन्हें भोजन दिया है
  rationale: לֶחֶם का मूल अर्थ ‘रोटी’ है, पर यहाँ अकाल के अंत और सामान्य आहार-प्रबंध का संकेत है। ‘भोजन’ संदर्भगत अर्थ स्पष्ट करता है; शाब्दिक विकल्प पाद-टिप्पणी में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: פקד में ईश्वरीय कार्य का स्वरूप
  choice: अपनी प्रजा की सुधि लेकर
  alternative: अपनी प्रजा की सहायता करके
  rationale: ‘सुधि लेना’ अनुग्रहपूर्ण ध्यान और हस्तक्षेप दोनों की गुंजाइश रखता है; ‘सहायता करना’ अर्थ को अधिक स्पष्ट तो करता है, पर मूल क्रिया की व्यापकता को कुछ सीमित कर देता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मोआब के प्रदेश’ क्षेत्रीय अर्थ स्पष्ट करता है, जबकि दूसरी बार पुनरुक्ति से बचने के लिए स्वाभाविक ‘मोआब में’ रखा गया है। ईश्वरीय नाम को ‘याहवे’ के रूप में प्रत्यक्ष रखा गया है।
