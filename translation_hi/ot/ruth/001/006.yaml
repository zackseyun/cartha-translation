revisions:
- from: तब वह अपनी बहुओं के साथ उठी और मोआब के प्रदेश से लौटने लगी, क्योंकि उसने मोआब में सुना था कि याहवे ने अपनी प्रजा की सुधि लेकर उन्हें भोजन[a] दिया है।
  to: तब वह अपनी बहुओं के साथ उठी और मोआब के प्रदेश से लौटने चली, क्योंकि उसने मोआब के प्रदेश में सुना था कि याहवे ने अपने लोगों को भोजन[a] देने के लिए उनकी सुधि ली थी।
  rationale: The revision removes the added inceptive sense, restores the past-background report and the purpose infinitive, and uses natural modern Hindi for “his people.” Repeating “मोआब के प्रदेश” also reflects the deliberate recurrence of שׂדה in the Hebrew without forcing an unnatural literal rendering of “field.”
