    reason: lexical_alternative
  revision_rationale: The revision removes the added inceptive sense, restores the past-background report and the purpose infinitive, and uses natural modern Hindi for “his people.” Repeating “मोआब के प्रदेश” also reflects the deliberate recurrence of שׂדה in the Hebrew without forcing an unnatural literal rendering of “field.”
