source:
  edition: WLC
  text: וַ/תֹּאמַ֤רְנָה הַ/נָּשִׁים֙ אֶֽל נָעֳמִ֔י בָּר֣וּךְ יְהוָ֔ה אֲ֠שֶׁר לֹ֣א הִשְׁבִּ֥ית לָ֛/ךְ גֹּאֵ֖ל הַ/יּ֑וֹם וְ/יִקָּרֵ֥א שְׁמ֖/וֹ בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/014.yaml
  text: Then the women said to Naomi[a], “Blessed be Yahweh, who has not left you without a redeemer today[c][b], and may his name be renowned in Israel.”
translation:
  language: hi
  text: तब स्त्रियों ने नाओमी से कहा, “धन्य हो याहवे, जिसने आज तुम्हें छुड़ानेवाले[a][b] से वंचित नहीं रखा। उसका नाम इस्राएल में प्रसिद्ध हो[c]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘छुड़ानेवाला’ का अर्थ ‘निकट संबंधी छुड़ानेवाला’ या ‘परिवार का रक्षक-छुड़ानेवाला’ भी हो सकता है—अर्थात ऐसा निकट संबंधी जो परिवार की वंश-परंपरा और संपत्ति की रक्षा तथा पुनर्स्थापना करे।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘छुड़ानेवाला’ विशेष रूप से नवजात बालक को नाओमी का पुनर्स्थापक बता सकता है; पर कुछ लोग अध्याय में बोअज़ की छुड़ानेवाले की भूमिका को भी इसमें सम्मिलित समझते हैं।
    reason: alternative_reading
  - marker: c
    text: इब्रानी में शाब्दिक रूप से, ‘उसका नाम इस्राएल में पुकारा जाए’; भाव यह है कि उसका नाम इस्राएल में पुकारा, जाना या सम्मानित किया जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְנָה
  choice: तब ... ने कहा
  rationale: वय्यिक़्तोल रूप कथा में अगली घटना को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इस क्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַנָּשִׁים
  choice: स्त्रियों
  rationale: निश्चित बहुवचन संज्ञा है और प्रसंग में उपस्थित समुदाय की स्त्रियों को सूचित करती है।
- source_word: בָּרוּךְ יְהוָה
  choice: याहवे धन्य है
  rationale: यह इब्रानी आशीर्वाद-वाक्य की गरिमा बनाए रखता है और परमेश्वर के व्यक्तिगत नाम को लिप्यंतरित करता है।
- source_word: אֲשֶׁר לֹא הִשְׁבִּית לָךְ
  choice: जिसने ... तुम्हें ... से वंचित नहीं रखा
  rationale: שבת के हिफ़ील रूप का प्रसंगगत अर्थ है किसी को छुड़ानेवाले से रहित न होने देना; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: גֹּאֵל
  choice: छुड़ानेवाला
  rationale: यह शब्द परिवार के निकट संबंधी की कानूनी-सामाजिक भूमिका सहित छुटकारा और पुनर्स्थापना का भाव रखता है। मुख्य पाठ में सरल शब्द रखा गया है और विशिष्ट पारिवारिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: הַיּוֹם
  choice: आज
  rationale: समय-सूचक पद का सीधा और स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: וְיִקָּרֵא שְׁמוֹ
  choice: उसका नाम ... प्रसिद्ध हो
  rationale: शाब्दिक अर्थ ‘उसका नाम पुकारा जाए’ है, पर इस आशीर्वाद में आशय उसके नाम के जाने और सम्मानित होने से है; ‘प्रसिद्ध हो’ उस मुहावरेदार अर्थ को व्यक्त करता है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल में
  rationale: उस क्षेत्र और समुदाय को दर्शाता है जिसमें उसका नाम प्रसिद्ध होगा।
theological_decisions:
- issue: גֹּאֵל (‘छुड़ानेवाला’) का अभिप्रेत व्यक्ति
  choice: मुख्य पाठ में ‘छुड़ानेवाला’ किस व्यक्ति को सूचित करता है, यह निश्चित नहीं किया गया।
  alternative: यह विशेष रूप से नवजात बालक को नाओमी का पुनर्स्थापक कह सकता है; या अध्याय में बोअज़ की छुड़ानेवाले की भूमिका को व्यापक रूप से ध्यान में रख सकता है।
  rationale: जन्म के तुरंत बाद का प्रसंग और आगे आनेवाला ‘उसका नाम’ नवजात बालक की ओर संकेत करते हैं, फिर भी पूरी कथा में बोअज़ की कानूनी-पारिवारिक भूमिका सक्रिय है। इसलिए मूल पाठ की वास्तविक संदिग्धता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘याहवे’ से יהוה का व्यक्तिगत नाम सुरक्षित है। ‘छुड़ानेवाला’ सामान्य पाठक के लिए बोधगम्य है, जबकि उसकी पारिवारिक-कानूनी विशेषता पादटिप्पणी में दी गई है।
