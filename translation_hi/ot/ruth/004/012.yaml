  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וִ/יהִ֤י בֵֽיתְ/ךָ֙ כְּ/בֵ֣ית פֶּ֔רֶץ אֲשֶׁר יָלְדָ֥ה תָמָ֖ר לִֽ/יהוּדָ֑ה מִן הַ/זֶּ֗רַע אֲשֶׁ֨ר יִתֵּ֤ן יְהוָה֙ לְ/ךָ֔ מִן הַֽ/נַּעֲרָ֖ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/012.yaml
  text: And may your house be like the house of Perez[a], whom Tamar bore to Judah[b], from the offspring that Yahweh will give you by this young woman.
translation:
  language: hi
  text: और तुम्हारा घराना पेरेस के घराने के समान हो—पेरेस को तामार ने यहूदा से जन्म दिया था—उस संतान से जो याहवे तुम्हें इस युवती से देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִיהִי
  choice: और ... हो
  rationale: यहाँ रूप आशीर्वाद या कामना व्यक्त करता है; हिन्दी में ‘हो’ स्वाभाविक आशीर्वचन है।
- source_word: בֵיתְךָ / כְּבֵית פֶּרֶץ
  choice: तुम्हारा घराना / पेरेस का घराना
  rationale: संदर्भ भौतिक भवन का नहीं, परिवार और वंश-परंपरा का है। ‘घराना’ हिन्दी में इस वंशगत अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲשֶׁר יָלְדָה תָמָר לִיהוּדָה
  choice: जिसे तामार ने यहूदा के लिए जन्म दिया
  rationale: सम्बन्धवाचक उपवाक्य और ילד के प्रसव-संबंधी अर्थ को सीधे रखता है; לִיהוּדָה का ‘यहूदा के लिए’ औपचारिक समानता और वंशावली-संबंध दोनों बनाए रखता है।
- source_word: מִן הַזֶּרַע
  choice: उस संतान के द्वारा
  rationale: זֶרַע का शाब्दिक अर्थ ‘बीज’ है, पर यहाँ वह संतान को दर्शाता है। מִן का अर्थ संदर्भ में उस भावी संतान के माध्यम/स्रोत से घराने के पेरेस के घराने जैसा बनने की कामना है; ‘के द्वारा’ इसे बिना अनुचित कारणार्थ जोड़े सुबोध बनाता है।
- source_word: אֲשֶׁר יִתֵּן יְהוָה לְךָ
  choice: जो याहवे तुम्हें ... देगा
  rationale: अपूर्ण रूप आशीर्वचन के भीतर अपेक्षित भावी दान को व्यक्त करता है; ‘देगा’ सरल और स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिवाचक दिव्य नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: מִן הַנַּעֲרָה הַזֹּאת
  choice: इस युवती से
  rationale: נַעֲרָה के लिए ‘युवती’ आधुनिक हिन्दी में आयु-संकेत सुरक्षित रखता है, और ‘से’ मातृ-स्रोत के अर्थ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: יְהוָה दिव्य नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में चतुरक्षरीय व्यक्तिवाचक नाम स्पष्ट रूप से उपस्थित है; ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है।
- issue: בֵּית का वंशगत अर्थ
  choice: घराना
  alternative: घर / परिवार / वंश
  rationale: यह आशीर्वाद भावी संतान और वंश-वृद्धि के विषय में है। ‘घराना’ परिवार और वंश दोनों की व्यापकता रखता है, जबकि ‘घर’ आधुनिक हिन्दी में भौतिक भवन समझा जा सकता है।
- issue: מִן הַזֶּרַע का संबंध
  choice: उस संतान के द्वारा
  alternative: उस संतान से / उस वंश के कारण
  rationale: מִן को कारणार्थक बनाना आवश्यक नहीं है। यहाँ भावी संतान वह माध्यम या स्रोत है जिसके द्वारा बोअज़ का घराना पेरेस के घराने जैसा होगा; इसलिए ‘के द्वारा’ संबंध को स्पष्ट रखते हुए कारणार्थ जोड़ने से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज आशीर्वचन। ‘घराना’ वंशगत आशय को सामान्य पाठक के लिए स्पष्ट करता है। वाक्य की दो डैशों वाली संरचना सम्बन्धवाचक टिप्पणी को मुख्य आशीर्वाद से अलग पहचानने में सहायता करती है।
