  text: וַ/אֲנִ֨י אָמַ֜רְתִּי אֶגְלֶ֧ה אָזְנְ/ךָ֣ לֵ/אמֹ֗ר קְ֠נֵה נֶ֥גֶד הַֽ/יֹּשְׁבִים֮ וְ/נֶ֣גֶד זִקְנֵ֣י עַמִּ/י֒ אִם תִּגְאַל֙ גְּאָ֔ל וְ/אִם לֹ֨א יִגְאַ֜ל הַגִּ֣ידָ/ה לִּ֗/י ו/אדע כִּ֣י אֵ֤ין זוּלָֽתְ/ךָ֙ לִ/גְא֔וֹל וְ/אָנֹכִ֖י אַחֲרֶ֑י/ךָ וַ/יֹּ֖אמֶר אָנֹכִ֥י אֶגְאָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/004.yaml
  text: So I thought I should inform you[a], saying, ‘Buy it in the presence of those sitting here and in the presence of the elders of my people. If you will redeem it, redeem it; but if he will not redeem it, tell me, so that I may know, for there is no one besides you to redeem it, and I am after you.’ And he said[b], ‘I will redeem it.’
translation:
  language: hi
  text: 'तब मैंने सोचा कि मैं तुम्हें यह बात बता दूँ[a]: ‘यहाँ बैठे लोगों और मेरे लोगों के बुज़ुर्गों के सामने इसे खरीद लो। यदि तुम इसे छुड़ाओगे, तो छुड़ा लो; पर यदि वह इसे नहीं छुड़ाएगा, तो मुझे बता दो, ताकि मैं जान लूँ; क्योंकि तुम्हारे सिवा इसे छुड़ानेवाला कोई नहीं है, और तुम्हारे बाद मैं हूँ।’ तब उसने कहा[b], ‘मैं इसे छुड़ाऊँगा।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “मैं तुम्हारा कान खोलूँ,” अर्थात् “मैं तुम्हें बता दूँ” या “तुम्हें अवगत करा दूँ।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पाठ में “यदि वह इसे नहीं छुड़ाएगा” है; प्रसंग के कारण कुछ लोग इसे “यदि तुम इसे नहीं छुड़ाओगे” समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: אֶגְלֶה אָזְנְךָ
  choice: मैं तुम्हें यह बात बता दूँ
  rationale: शाब्दिक अर्थ ‘तुम्हारा कान खोलूँ’ है, पर यह किसी को बात से अवगत कराने का मुहावरा है। आधुनिक हिन्दी में यह चयन स्वाभाविक और स्पष्ट है।
- source_word: קְנֵה
  choice: इसे मोल ले लो
  rationale: קנה का अर्थ खरीदना या प्राप्त करना है। भूमि के कानूनी लेन-देन के प्रसंग में ‘मोल ले लो’ सामान्य पाठक के लिए स्पष्ट रहते हुए क्रय का भाव बनाए रखता है।
- source_word: נֶגֶד הַיֹּשְׁבִים ... וְנֶגֶד זִקְנֵי עַמִּי
  choice: यहाँ बैठे लोगों और मेरी प्रजा के पुरनियों के सामने
  rationale: נגד सार्वजनिक उपस्थिति और साक्ष्य का भाव देता है; participle के कारण ‘यहाँ बैठे लोगों’ और सामुदायिक अगुओं के लिए ‘पुरनियों’ का प्रयोग कानूनी सभा का संदर्भ बनाए रखता है।
- source_word: תִּגְאַל ... גְּאָל
  choice: यदि तुम इसे छुड़ाओगे, तो छुड़ा लो
  rationale: גאל की पुनरावृत्ति को जोर सहित सुरक्षित रखा गया है। ‘छुड़ाना’ पारिवारिक-कानूनी अधिकार के अंतर्गत संपत्ति वापस लेने का भाव देता है।
- source_word: וְאִם לֹא יִגְאַל
  choice: पर यदि वह इसे नहीं छुड़ाएगा
  rationale: मसोरेटिक पाठ के तृतीय पुरुष एकवचन को जानबूझकर सुरक्षित रखा गया है, यद्यपि सीधे संबोधन के बीच यह परिवर्तन असामान्य है। अधिक सहज द्वितीय-पुरुष अर्थ पादटिप्पणी में दिया गया है।
- source_word: אֵין זוּלָתְךָ לִגְאוֹל וְאָנֹכִי אַחֲרֶיךָ
  choice: तुम्हारे सिवा इसे छुड़ानेवाला कोई नहीं है, और तुम्हारे बाद मैं हूँ
  rationale: यह वाक्य छुड़ाने के अधिकार या दायित्व की क्रम-व्यवस्था बताता है। ‘तुम्हारे बाद मैं हूँ’ हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: אָנֹכִי אֶגְאָל
  choice: मैं इसे छुड़ाऊँगा
  rationale: उत्तर में निकट संबंधी संपत्ति छुड़ाने का अधिकार स्वीकार करता है; प्रसंग से निहित कर्म ‘इसे’ स्पष्टता के लिए रखा गया है।
theological_decisions:
- issue: पारिवारिक-कानूनी प्रसंग में גאל का अनुवाद
  choice: छुड़ाना
  alternative: निकट संबंधी के नाते वापस मोल लेना
  rationale: ‘छुड़ाना’ मूल शब्द की कानूनी और व्यापक बाइबिलीय प्रतिध्वनि बनाए रखता है, जबकि विस्तृत विकल्प संबंधी की भूमिका को पाठ में व्याख्यात्मक रूप से जोड़ देता।
- issue: द्वितीय पुरुष से तृतीय पुरुष में अचानक परिवर्तन
  choice: यदि वह इसे नहीं छुड़ाएगा
  alternative: यदि तुम इसे नहीं छुड़ाओगे
  rationale: WLC के स्वरांकित मसोरेटिक पाठ में יִגְאַל तृतीय पुरुष है। असहजता को सुधारे बिना मुख्य पाठ में सुरक्षित रखा गया है और प्रसंगानुकूल द्वितीय-पुरुष समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। ‘पुरनियों’ से नगर-समुदाय के मान्य अगुओं का भाव और ‘छुड़ाना’ से पारिवारिक-कानूनी मोचन का प्रमुख शब्द सुरक्षित रहता है। मुख्य पाठ में मसोरेटिक पाठ का असामान्य तृतीय पुरुष जानबूझकर बनाए रखा गया है।
