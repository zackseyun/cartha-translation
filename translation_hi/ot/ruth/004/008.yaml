translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। कानूनी पद का पूरा आशय मुख्य पाठ को बोझिल किए बिना पादटिप्पणी में दिया गया है। ‘इसे’ का प्रयोग प्रसंग में निहित खरीद-विषय को हिन्दी में स्पष्ट करता है, जबकि मूल का संक्षिप्त कथन बना रहता है।
