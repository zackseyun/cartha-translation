base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/008.yaml
  text: So the redeemer said to Boaz[b][a], “Buy it for yourself,” and he took off his sandal.
translation:
  language: hi
  text: तब छुड़ानेवाले[a] ने बोअज़ से कहा, “इसे अपने लिए खरीद लो।” फिर उस छुड़ानेवाले ने अपना सैंडल उतार दिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निकट संबंधी छुड़ानेवाला।” इब्रानी शब्द ऐसे निकट संबंधी को दर्शाता है जिस पर परिवार की संपत्ति या वंश को छुड़ाने का कानूनी दायित्व था।
    reason: lexical_alternative
  - marker: b
    text: इस लेन-देन में सैंडल उतारना एक प्रचलित कानूनी चिह्न था; रूत 4:7 देखें।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַגֹּאֵל
  choice: छुड़ानेवाले
  rationale: रूत के प्रसंग में यह निकट संबंधी के उस वैधानिक दायित्व को दर्शाता है जिसके अंतर्गत वह पारिवारिक संपत्ति या वंश की रक्षा के लिए उसे छुड़ाता है। संक्षिप्त मुख्य-पाठ के साथ पादटिप्पणी कानूनी-पारिवारिक अर्थ स्पष्ट करती है।
- source_word: לְבֹעַז
  choice: बोअज़ से
  rationale: पूर्वसर्ग לְ यहाँ कथन के संबोधित व्यक्ति को दर्शाता है; हिन्दी में ‘से कहा’ स्वाभाविक है।
- source_word: קְנֵה
  choice: मोल ले लो
  rationale: कנה का आज्ञार्थक रूप इस लेन-देन में खरीदने या प्राप्त करने का भाव रखता है; ‘मोल ले लो’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: לָךְ
  choice: अपने लिए
  rationale: पूर्वसर्ग और सर्वनाम-प्रत्यय यह बताते हैं कि बोअज़ स्वयं यह खरीद अपने जिम्मे ले।
- source_word: וַיִּשְׁלֹף
  choice: और उसने ... उतार दी
  rationale: क्रिया का अर्थ खींचकर निकालना या उतारना है; पादत्राण के संदर्भ में ‘उतार दी’ सबसे सहज है।
- source_word: נַעֲלוֹ
  choice: अपनी जूती
  rationale: यह प्राचीन पादत्राण को दर्शाता है। ‘जूती’ आधुनिक हिन्दी में सहज है और ‘अपनी’ से इब्रानी का तृतीय-पुरुष स्वामित्व प्रसंगानुसार व्यक्त होता है।
