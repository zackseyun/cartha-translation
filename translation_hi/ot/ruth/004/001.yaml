base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/001.yaml
  text: Boaz had gone up to the gate and sat down there[a], and behold, the kinsman-redeemer of whom Boaz had spoken was passing by. So he said, "Turn aside, sit down here[b], so-and-so." And he turned aside and sat down.
translation:
  language: hi
  text: बोअज़ नगर-द्वार तक ऊपर चढ़कर गया और वहाँ बैठ गया।[a] तभी, देखो, जिस छुड़ानेवाले संबंधी की बात बोअज़ ने की थी, वह उधर से जा रहा था। बोअज़ ने उससे कहा, “इधर आओ, यहाँ बैठो, ऐ अमुक।”[b] तब वह इधर मुड़ा और बैठ गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राचीन इस्राएल में नगर-द्वार सार्वजनिक सभा तथा कानूनी और नागरिक कार्यवाही का स्थान भी होता था।
    reason: cultural_note
  - marker: b
    text: मूल इब्रानी में यहाँ ‘पलोनी अलमोनी’ है—ऐसा मुहावरा जिसमें उस व्यक्ति का नाम जानबूझकर नहीं बताया गया; अर्थ लगभग ‘अमुक व्यक्ति’ या ‘फलाँ’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה הַשַּׁעַר
  choice: नगर-द्वार पर गया
  rationale: עָלָה का मूल अर्थ ‘ऊपर जाना’ है, पर यहाँ द्वार तक जाने की स्वाभाविक हिन्दी अभिव्यक्ति चुनी गई है। ‘नगर-द्वार’ स्थान और प्रसंग को स्पष्ट करता है।
- source_word: וְהִנֵּה
  choice: तभी
  rationale: यह ध्यान खींचने वाला कथात्मक संकेत है। आधुनिक हिन्दी में ‘तभी’ घटना के संयोग और जीवंतता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַגֹּאֵל
  choice: छुड़ानेवाला संबंधी
  rationale: גֹּאֵל में निकट संबंध और परिवार की संपत्ति अथवा अधिकार छुड़ाने की वैधानिक भूमिका दोनों निहित हैं; यह पद दोनों पहलुओं को बनाए रखता है।
- source_word: עֹבֵר
  choice: उधर से जा रहा था
  rationale: इब्रानी कृदंत चल रही क्रिया को दर्शाता है; यह हिन्दी रूप उसी अपूर्ण पक्ष को व्यक्त करता है।
- source_word: סוּרָה שְׁבָה פֹה
  choice: इधर आकर यहाँ बैठो
  rationale: शाब्दिक ‘मुड़ो’ की अपेक्षा निमंत्रण के आशय को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि अगले वाक्य में मुड़कर आने की प्रतिक्रिया बनी रहती है।
- source_word: פְּלֹנִי אַלְמֹנִי
  choice: अरे भाई
  rationale: यह जानबूझकर नाम न बताने वाला संबोधन है। मुख्य पाठ में स्वाभाविक पुरुष-संबोधन रखा गया है और इसकी विशिष्ट अनाम प्रकृति को पादटिप्पणी में समझाया गया है।
- source_word: וַיָּסַר וַיֵּשֶׁב
  choice: वह मुड़कर आया और बैठ गया
  rationale: यह बोअज़ के बुलावे पर उस व्यक्ति की प्रतिक्रिया और दोनों क्रमिक क्रियाओं को स्पष्ट रखता है।
theological_decisions:
- issue: גֹּאֵל की पारिवारिक और वैधानिक भूमिका
  choice: छुड़ानेवाला संबंधी
  alternative: छुड़ानेवाला / निकट संबंधी
  rationale: केवल ‘छुड़ानेवाला’ संबंध का पहलू खो देता है और केवल ‘निकट संबंधी’ छुड़ाने की भूमिका; संयुक्त पद मूल की अर्थ-सीमा को बेहतर बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘नगर-द्वार’ सांस्कृतिक स्थल को स्पष्ट करता है। संबोधन में कृत्रिम ‘श्रीमान फलाँ’ से बचते हुए बोलचाल की स्वाभाविकता रखी गई है; मूल की अनाम अभिव्यक्ति पादटिप्पणी में सुरक्षित है।
