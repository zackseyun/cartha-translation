source:
  edition: WLC
  text: וְ/הָ֤יָה לָ/ךְ֙ לְ/מֵשִׁ֣יב נֶ֔פֶשׁ וּ/לְ/כַלְכֵּ֖ל אֶת שֵׂיבָתֵ֑/ךְ כִּ֣י כַלָּתֵ֤/ךְ אֲֽשֶׁר אֲהֵבַ֨תֶ/ךְ֙ יְלָדַ֔תּ/וּ אֲשֶׁר הִיא֙ ט֣וֹבָה לָ֔/ךְ מִ/שִּׁבְעָ֖ה בָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/015.yaml
  text: And he will be to you a restorer of life and a sustainer of your old age[a], for your daughter-in-law, who loves you[c][b], has borne him—she who is better to you than seven sons.
translation:
  language: hi
  text: वह तुम्हारे जीवन को फिर से सँभालेगा[a] और तुम्हारे बुढ़ापे का सहारा बनेगा[b], क्योंकि तुम्हारी बहू, जो तुमसे प्रेम करती है, ने उसे जन्म दिया है—वह बहू तुम्हारे लिए सात बेटों[c] से भी बढ़कर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “जीवन/प्राण को लौटा देनेवाला।”'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “तुम्हारे सफेद बालों का,” अर्थात तुम्हारी वृद्धावस्था का।
    reason: lexical_alternative
  - marker: c
    text: “सात बेटे” पूर्णता या भरपूरी का बोध करानेवाली संख्या है। आशय यह है कि रूत नाओमी के लिए अनेक बेटों के आदर्श आशीष से भी अधिक मूल्यवान है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: वह … डालेगा … और … करेगा
  rationale: संदर्भ में यह रूप बालक के विषय में भविष्यसूचक परिणाम बताता है। हिन्दी का सामान्य भविष्यकाल इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְמֵשִׁיב נֶפֶשׁ
  choice: तुम्हारे जीवन में नई जान डालेगा
  rationale: מֵשִׁיב का अर्थ लौटाना या पुनःस्थापित करना है और נֶפֶשׁ यहाँ ठोस अर्थ में जीवन/व्यक्ति को दर्शाता है। यह हिन्दी मुहावरा नाओमी के जीवन के पुनर्जीवन का भाव स्वाभाविक ढंग से रखता है, बिना इसे अमूर्त ‘आत्मा’ के विषय में कथन बनाए।
- source_word: וּלְכַלְכֵּל
  choice: भरण-पोषण करेगा
  rationale: כלכל के पोषण, निर्वाह और सहारा देने के अर्थ को ‘भरण-पोषण’ स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֶת שֵׂיבָתֵךְ
  choice: बुढ़ापे में तुम्हारा
  rationale: שֵׂיבָה का शाब्दिक बिंब ‘सफेद बाल’ है, पर यहाँ आशय वृद्धावस्था है। ‘बुढ़ापे में’ हिन्दी में संबंध और समय दोनों को स्वाभाविक बनाता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले कथन का कारण प्रस्तुत करता है; ‘क्योंकि’ उस व्याख्यात्मक संबंध को साफ रखता है।
- source_word: כַלָּתֵךְ
  choice: तुम्हारी बहू
  rationale: रूत और नाओमी के संबंध के लिए यही सामान्य और सटीक हिन्दी पद है।
- source_word: אֲשֶׁר אֲהֵבַתֶךְ
  choice: जो तुमसे प्रेम करती है
  rationale: पूर्ण क्रिया स्थापित और प्रमाणित प्रेम-संबंध को बताती है; वर्तमानकाल हिन्दी में उसके जारी रहनेवाले प्रेम को सहजता से व्यक्त करता है।
- source_word: יְלָדַתּוּ
  choice: ने उसे जन्म दिया है
  rationale: पुल्लिंग एकवचन प्रत्यय अभी उल्लिखित बालक की ओर संकेत करता है। ‘उसे जन्म दिया है’ बिना अनावश्यक शब्द जोड़े इस संकेत को बनाए रखता है।
- source_word: אֲשֶׁר הִיא טוֹבָה לָךְ
  choice: यह बहू तुम्हारे लिए … से भी बढ़कर है
  rationale: स्त्रीलिंग הִיא का संदर्भ बहू से है। हिन्दी में केवल ‘वह’ कहने से बालक संदर्भित समझा जा सकता था, इसलिए ‘यह बहू’ स्त्रीलिंग संदर्भ को स्पष्ट करता है; ‘बढ़कर’ तुलनात्मक मूल्य और लाभ दोनों का भाव रखता है।
- source_word: מִשִּׁבְעָה בָּנִים
  choice: सात बेटों से
  rationale: मूल में ‘बेटे’ स्पष्ट रूप से पुल्लिंग है और सात पूर्णता का पारंपरिक अंक है; इसलिए इसे लिंग-निरपेक्ष नहीं किया गया।
theological_decisions:
- issue: נֶפֶשׁ का अनुवाद
  choice: जीवन
  alternative: प्राण; आत्मा; स्वयं
  rationale: संदर्भ नाओमी के पारिवारिक पुनर्स्थापन और भविष्य के निर्वाह का है, मनुष्य की अमूर्त आत्मा पर धर्मवैज्ञानिक कथन का नहीं। ‘जीवन में नई जान’ ठोस अर्थ को सुरक्षित रखता है।
- issue: מִשִּׁבְעָה בָּנִים में लिंग-सूचक तुलना
  choice: सात बेटे
  alternative: सात संतानें
  rationale: इब्रानी पाठ स्पष्टतः ‘बेटे’ कहता है और तुलना उस प्राचीन सामाजिक अपेक्षा को दर्शाती है जिसमें बेटे वृद्धावस्था के सहारे माने जाते थे। मूल का सांस्कृतिक और लिंग-सूचक स्वरूप बनाए रखा गया है।
- issue: הִיא का संदर्भ
  choice: रूत अर्थात बहू
  alternative: नवजात बालक
  rationale: इब्रानी स्त्रीलिंग सर्वनाम व्याकरणतः बहू की ओर लौटता है। हिन्दी में संभावित सर्वनामगत भ्रम को ‘यह बहू’ कहकर दूर किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आत्मीय, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली रखी गई है। ‘नई जान डालना’ परिचित हिन्दी मुहावरा है; ‘भरण-पोषण’ वृद्धावस्था में निर्वाह और देखभाल दोनों को समेटता है। मूल के स्त्रीलिंग सर्वनाम को स्पष्ट करने के लिए अंतिम खंड में ‘यह बहू’ कहा गया है।
