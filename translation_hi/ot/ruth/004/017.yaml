base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/017.yaml
  text: Then the neighbor women gave him a name[a], saying, “A son has been born to Naomi.” And they named him Obed. He was the father of Jesse, the father of David.
translation:
  language: hi
  text: तब पड़ोस की स्त्रियों ने उसका नाम रखते हुए कहा, “नाओमी के लिए एक बेटा पैदा हुआ है।” और उन्होंने उसका नाम ओबेद रखा। वह यिशै का पिता था, और यिशै दाऊद का पिता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְּׁכֵנוֹת
  choice: पड़ोस की स्त्रियाँ
  rationale: स्त्रीलिंग बहुवचन संज्ञा निकट रहने वाली स्त्रियों को सूचित करती है; यह आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: וַתִּקְרֶאנָה לוֹ שֵׁם
  choice: उसका नाम रखते हुए
  rationale: इब्रानी मुहावरा उसके लिए नाम पुकारने/रखने की क्रिया बताता है। हिन्दी में यह वाक्य-विन्यास अगले कथन को नामकरण की घोषणा के रूप में स्वाभाविक ढंग से जोड़ता है।
- source_word: יֻלַּד בֵּן לְנָעֳמִי
  choice: नाओमी के लिए एक बेटा पैदा हुआ है
  rationale: कर्मवाच्य क्रिया और לְ नाओमी को लाभार्थी अथवा प्राप्तकर्ता के रूप में रखते हैं। यह शब्दावली नाओमी के पुनर्स्थापित परिवार की साहित्यिक दृष्टि को बनाए रखती है, उसे जैविक माता नहीं बताती।
- source_word: וַתִּקְרֶאנָה שְׁמוֹ עוֹבֵד
  choice: उन्होंने उसका नाम ओबेद रखा
  rationale: मानक इब्रानी नामकरण सूत्र का सहज आधुनिक हिन्दी रूप।
- source_word: עוֹבֵד
  choice: ओबेद
  rationale: व्यक्तिवाचक नाम को अर्थानुवाद करने के बजाय हिन्दी में प्रचलित रूप से लिप्यंतरित किया गया है।
- source_word: אֲבִי יִשַׁי אֲבִי דָוִד
  choice: यिशै का पिता और दाऊद का दादा
  rationale: पहला אֲבִי ओबेद का यिशै से संबंध बताता है; दूसरा यिशै का दाऊद से। हिन्दी में ‘दादा’ समान वंश-संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִשַׁי
  choice: यिशै
  rationale: इब्रानी नाम का स्रोत-सन्निकट और हिन्दी बाइबलीय प्रयोग में सुबोध लिप्यंतरण।
- source_word: דָוִד
  choice: दाऊद
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नामरूप।
theological_decisions:
- issue: घोषणा ‘नाओमी के लिए एक बेटा पैदा हुआ है’ में नवजात से नाओमी का संबंध
  choice: मुख्य पाठ में ‘नाओमी के लिए’ को यथावत रखना
  alternative: ‘नाओमी का पोता पैदा हुआ है’ या ‘नाओमी को एक बेटा मिला है’
  rationale: इब्रानी पाठ पड़ोस की स्त्रियों की दृष्टि से रूत के बच्चे द्वारा नाओमी के परिवार और वंश की पुनर्स्थापना व्यक्त करता है। ‘पोता’ कहने से जानबूझकर उपस्थित पारिवारिक और साहित्यिक तनाव समाप्त हो जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्रोत की संक्षिप्त वंशावली शैली बनाए रखते हुए अंतिम संबंध को हिन्दी में स्वाभाविक ‘दादा’ से व्यक्त किया गया है।
