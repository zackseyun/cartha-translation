source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר בֹּ֔עַז בְּ/יוֹם קְנוֹתְ/ךָ֥ הַ/שָּׂדֶ֖ה מִ/יַּ֣ד נָעֳמִ֑י וּ֠/מֵ/אֵת ר֣וּת הַ/מּוֹאֲבִיָּ֤ה אֵֽשֶׁת הַ/מֵּת֙ קניתי לְ/הָקִ֥ים שֵׁם הַ/מֵּ֖ת עַל נַחֲלָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/005.yaml
  text: Then Boaz said[a], “On the day you acquire the field from the hand of Naomi, you also acquire Ruth the Moabite, the wife of the dead man[c][b], in order to raise up the name of the dead on his inheritance.”
translation:
  language: hi
  text: तब बोअज़ ने कहा[a], “जिस दिन तुम नाओमी के हाथ से वह खेत मोल लेते हो, उसी दिन तुम मोआबी रूत को भी, जो मृतक की पत्नी थी[b], ग्रहण करते हो, ताकि मृतक का नाम उसकी विरासत पर कायम रहे[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी मसोरा-पाठ में यहाँ शाब्दिक रूप से “मैंने मोआबी रूत को ग्रहण किया” या “मैं मोआबी रूत को ग्रहण करता हूँ” है; प्रसंग के आधार पर बहुत-से लोग इसका अर्थ “तुम रूत को भी ग्रहण करते हो” समझते हैं।
    reason: textual_variant
  - marker: b
    text: शाब्दिक रूप से, “मृतक की पत्नी।”
    reason: lexical_alternative
  - marker: c
    text: अर्थात् मृतक के वंश और उसकी पैतृक संपत्ति से जुड़े उसके परिवार के अधिकार को कायम रखने के लिए।
    reason: cultural_note
lexical_decisions:
- source_word: בְּיוֹם קְנוֹתְךָ
  choice: जिस दिन तुम ... मोल लेते हो
  rationale: यह कानूनी लेन-देन के समय को व्यक्त करने वाले इब्रानी मुहावरे को स्वाभाविक हिन्दी में रखता है। ‘मोल लेना’ खेत के छुटकारे के प्रसंग में קנה के अर्थ को स्पष्ट करता है।
- source_word: הַשָּׂדֶה מִיַּד נָעֳמִי
  choice: नाओमी के हाथ से वह खेत
  rationale: ‘हाथ से’ स्वामित्व अथवा अधिकार से हस्तांतरण का इब्रानी कानूनी मुहावरा सुरक्षित रखता है; ‘वह खेत’ प्रसंग में चर्चा के विशिष्ट भूखंड को दर्शाता है।
- source_word: וּמֵאֵת רוּת הַמּוֹאֲבִיָּה ... קניתי
  choice: उसी दिन तुम मोआबी रूत को भी ... ग्रहण करते हो
  rationale: मसोरा-पाठ की वाक्यरचना कठिन है और קניתי प्रथम पुरुष में है, पर संवाद का प्रसंग निकट संबंधी को संबोधित द्वितीय पुरुष अर्थ की माँग करता है। ‘ग्रहण करते हो’ विवाह-संबंधी दायित्व को वस्तु की खरीद जैसा कहने से बचाता है; पाठगत कठिनाई पादटिप्पणी में सुरक्षित है।
- source_word: אֵשֶׁת הַמֵּת
  choice: उस मरे हुए पुरुष की पत्नी थी
  rationale: यह मूल के ‘मरे हुए की पत्नी’ को निकटता से व्यक्त करता है और ‘विधवा’ जैसा व्याख्यात्मक संक्षेप नहीं अपनाता। भूतकाल ‘थी’ वर्तमान वैधव्य को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: לְהָקִים שֵׁם הַמֵּת
  choice: उस मरे हुए का नाम ... बना रहे
  rationale: शाब्दिक ‘नाम खड़ा करना’ हिन्दी में अस्वाभाविक है। ‘नाम बना रहे’ वंश, स्मृति और पारिवारिक दावे को कायम रखने का आशय सहज रूप से देता है।
- source_word: עַל נַחֲלָתוֹ
  choice: उसकी विरासत पर
  rationale: עַל के स्थानिक-कानूनी संबंध को निकटता से बनाए रखता है और मृतक के नाम को उसकी पैतृक संपत्ति से जोड़ता है।
theological_decisions:
- issue: रूत से संबंधित कठिन वाक्यरचना और קניתי का प्रथम पुरुष रूप
  choice: 'मुख्य पाठ में निकट संबंधी को संबोधित प्रसंगानुकूल अर्थ: ‘तुम ... रूत को भी ... ग्रहण करते हो।’'
  alternative: 'मसोरा-पाठ का अधिक शाब्दिक रूप: ‘मैंने मोआबी रूत को ... ग्रहण किया है’ अथवा ‘मैं ग्रहण करता हूँ।’'
  rationale: कथानक में बोअज़ निकट संबंधी को समझा रहा है कि खेत छुड़ाने के साथ मृतक की पत्नी के प्रति दायित्व भी आता है। फिर भी मूल पाठ का प्रथम पुरुष रूप वास्तविक पाठगत तनाव है, इसलिए उसे [a] में स्पष्ट किया गया है।
- issue: ‘नाम खड़ा करने’ का सामाजिक-धार्मिक आशय
  choice: मुख्य पाठ में ‘नाम ... बना रहे’, और पादटिप्पणी में वंश तथा विरासत से जुड़े दावे का सांस्कृतिक स्पष्टीकरण।
  alternative: अधिक शाब्दिक ‘मरे हुए का नाम उसकी विरासत पर खड़ा करना।’
  rationale: मुहावरे का उद्देश्य मृत पुरुष के वंश और पैतृक संपत्ति से उसके नाम का संबंध कायम रखना है। हिन्दी में अर्थ स्पष्ट किया गया है, पर इसे किसी बाद की विशिष्ट धार्मिक व्यवस्था या सम्प्रदायगत सिद्धान्त से नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ कानूनी-कथात्मक शैली अपनाई गई है। ‘मोल लेना’ खेत के लिए और ‘ग्रहण करना’ रूत के संबंध में प्रयुक्त है, ताकि मूल दायित्व स्पष्ट रहे पर स्त्री को संपत्ति जैसा प्रस्तुत करने वाली अनावश्यक हिन्दी न बने। सभी पाठगत और सांस्कृतिक स्पष्टीकरण चिह्नित पादटिप्पणियों में रखे गए हैं।
