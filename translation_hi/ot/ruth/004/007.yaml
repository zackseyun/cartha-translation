base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/007.yaml
  text: 'This was formerly the custom in Israel concerning redemption and exchange[a], to confirm any matter: a man removed his sandal and gave it to his neighbor[c][b], and this was the attestation in Israel.'
translation:
  language: hi
  text: 'पुराने समय में इस्राएल में छुड़ाने और अदला-बदली[a] के विषय में किसी भी मामले[b] को पुष्ट करने की रीति यह थी: एक व्यक्ति अपनी जूती उतारकर अपने साथी को दे देता था। इस्राएल में यही प्रमाण[c] था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘विनिमय’।
    reason: lexical_alternative
  - marker: b
    text: या, ‘हर लेन-देन को पुष्ट करने’।
    reason: lexical_alternative
  - marker: c
    text: या, ‘गवाही’।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנִים
  choice: पहले
  rationale: यह पद किसी पुराने प्रचलन की व्याख्या करता है। ‘पहले’ स्वाभाविक आधुनिक हिन्दी में कालगत अर्थ को स्पष्ट रखता है।
- source_word: הַגְּאוּלָּה
  choice: छुड़ाने
  rationale: रूत 4 के पारिवारिक-कानूनी संदर्भ में यह निकट संबंधी द्वारा संपत्ति या अधिकार छुड़ाने की क्रिया को सूचित करता है; क्रियात्मक हिन्दी पद सामान्य पाठक के लिए सहज है।
- source_word: הַתְּמוּרָה
  choice: अदला-बदली
  rationale: यह विनिमय या प्रतिस्थापन का बोध देता है। ‘अदला-बदली’ मूल अर्थ को बिना किसी विशेष कानूनी प्रक्रिया को अनावश्यक रूप से निश्चित किए व्यक्त करता है।
- source_word: לְקַיֵּם כָּל דָּבָר
  choice: किसी भी मामले को पक्का करने
  rationale: לְקַיֵּם का अर्थ स्थापित या पुष्ट करना है और כָּל דָּבָר व्यापक है। यह रूप कानूनी भाव और मूल की व्यापकता दोनों बनाए रखता है।
- source_word: שָׁלַף
  choice: उतारकर
  rationale: जूती के साथ प्रयुक्त होने पर ‘उतारना’ आधुनिक हिन्दी में स्वाभाविक रूप से निकालने की ठोस क्रिया व्यक्त करता है।
- source_word: נַעֲלוֹ
  choice: अपनी जूती
  rationale: נַעַל पादत्राण को सूचित करता है। ‘जूती’ प्राचीन संदर्भ में उपयुक्त और सामान्य हिन्दी में सुबोध है; सम्बन्धसूचक प्रत्यय को ‘अपनी’ से व्यक्त किया गया है।
- source_word: לְרֵעֵהוּ
  choice: अपने साथी को
  rationale: רֵעַ का अर्थ साथी, सहचर या दूसरा सम्बद्ध व्यक्ति हो सकता है। ‘अपने साथी’ मूल की संबंधपरक व्यापकता बनाए रखता है और प्रसंग में सौदे के दूसरे पक्ष की ओर संकेत करता है।
- source_word: הַתְּעוּדָה
  choice: प्रमाण
  rationale: यहाँ शब्द उस कार्य या चिह्न को सूचित करता है जो मामले को विधिवत प्रमाणित करता था। ‘प्रमाण’ हिन्दी में कानूनी-साक्ष्य संबंधी अर्थ को संक्षेप और स्वाभाविक रूप में व्यक्त करता है।
