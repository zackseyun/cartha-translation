  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/גֹּאֵ֗ל לֹ֤א אוּכַל֙ ל/גאול לִ֔/י פֶּן אַשְׁחִ֖ית אֶת נַחֲלָתִ֑/י גְּאַל לְ/ךָ֤ אַתָּה֙ אֶת גְּאֻלָּתִ֔/י כִּ֥י לֹא אוּכַ֖ל לִ/גְאֹֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/006.yaml
  text: Then the redeemer said[a], “I cannot redeem it for myself, lest I ruin my own inheritance. Redeem for yourself my right of redemption[b], for I cannot redeem it.”
translation:
  language: hi
  text: तब छुड़ाने का अधिकार रखने वाले ने कहा,[a] “मैं इसे अपने लिए नहीं छुड़ा सकता, कहीं ऐसा न हो कि मैं अपनी ही विरासत बिगाड़ दूँ। मेरे छुड़ाने के अधिकार को तुम अपने लिए इस्तेमाल करो,[b] क्योंकि मैं इसे नहीं छुड़ा सकता।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “छुड़ाने का अधिकार रखने वाला” बोअज़ से अधिक निकट संबंधी था और इसलिए परिवार की संपत्ति छुड़ाने का पहला अधिकार उसी का था।
    reason: cultural_note
  - marker: b
    text: शाब्दिक रूप से “मेरे छुटकारे को तुम अपने लिए छुड़ा लो।” यहाँ आशय उस कानूनी अधिकार और दायित्व से है जिसके द्वारा निकट संबंधी परिवार की संपत्ति वापस लेता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגֹּאֵל
  choice: छुड़ाने का अधिकार रखने वाला
  rationale: यह रूप उस निकट संबंधी को सूचित करता है जिसे परिवार की संपत्ति छुड़ाने का अधिकार और दायित्व था। केवल ‘छुड़ाने वाला’ की अपेक्षा यह कानूनी अर्थ सामान्य हिन्दी पाठक के लिए अधिक स्पष्ट करता है।
- source_word: לִגְאֹל / גְּאַל
  choice: छुड़ाना / छुड़ाओ
  rationale: גאל शब्द-समूह की पुनरावृत्ति को बनाए रखते हुए पारिवारिक संपत्ति को वापस प्राप्त करने की कानूनी क्रिया व्यक्त की गई है।
- source_word: גְּאֻלָּתִי
  choice: मेरे छुड़ाने के अधिकार
  rationale: शाब्दिक ‘मेरे छुटकारे’ से आशय अस्पष्ट हो सकता है; प्रसंग में संज्ञा उस व्यक्ति के संपत्ति छुड़ाने के अधिकार और दायित्व को दर्शाती है।
- source_word: לִי
  choice: अपने लिए
  rationale: व्यक्तिगत हित या लाभ का भाव व्यक्त करता है और उसकी अपनी विरासत पर पड़ने वाले प्रभाव से जुड़ता है।
- source_word: פֶּן אַשְׁחִית
  choice: कहीं ऐसा न हो कि मैं ... बिगाड़ दूँ
  rationale: פֶּן आशंका प्रकट करता है और שׁחת का हिफ़ील रूप यहाँ विरासत को गंभीर आर्थिक या कानूनी हानि पहुँचाने के अर्थ में है।
- source_word: נַחֲלָתִי
  choice: अपनी ही विरासत
  rationale: पैतृक संपत्ति का अर्थ बनाए रखता है; ‘ही’ दूसरी संपत्ति के विपरीत उसकी अपनी विरासत पर बल देता है।
- source_word: לְךָ אַתָּה
  choice: तुम अपने लिए
  rationale: स्वतंत्र सर्वनाम का जोर स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: उसके पहले कथन का कारण अथवा स्पष्टीकरण प्रस्तुत करता है।
theological_decisions:
- issue: גאל की कानूनी और व्यापक धार्मिक अर्थ-छाया
  choice: प्रसंगानुसार पारिवारिक संपत्ति छुड़ाने के अधिकार की भाषा
  alternative: ‘उद्धार करना’ या केवल ‘छुड़ाना’ बिना स्पष्टीकरण के
  rationale: यह पद मुख्यतः परिवार और भूमि से संबंधित कानूनी व्यवस्था की बात करता है; धार्मिक उद्धार का अर्थ आरोपित नहीं किया गया, जबकि मूल शब्द-समूह की एकरूपता ‘छुड़ाना’ से बनी रहती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। मूल के גאל शब्द-समूह की पुनरावृत्ति ‘छुड़ाना’ से सुरक्षित रखी गई है, पर कानूनी-सांस्कृतिक आशय को मुख्य पाठ और पादटिप्पणियों में स्पष्ट किया गया है।
