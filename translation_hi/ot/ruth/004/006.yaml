  source_fidelity: 'The translation accurately conveys the repeated גאל word-group in its legal-family setting: the nearer redeemer says he cannot redeem for his own benefit because doing so may harm his inheritance, and he directs Boaz to exercise his redemption right. The apprehensive force of פֶּן and the emphatic sense of לְךָ אַתָּה are retained.'
  naturalness: The Hindi is modern, clear, and suitably dignified. “छुड़ाने का अधिकार रखने वाला” is somewhat explanatory, but it is idiomatic enough and usefully prevents a misleading purely salvific sense. “कहीं ऐसा न हो कि...” naturally conveys the Hebrew warning construction.
  terminology: “विरासत,” “छुड़ाना,” and “छुड़ाने का अधिकार” consistently express the patrimonial and legal context without importing denominational interpretation. The notes appropriately explain the cultural-legal background and the lexical sense of the redemption noun.
