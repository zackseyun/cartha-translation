lexical_decisions:
- source_word: וְ/חֶצְרוֹן
  choice: हेस्रोन
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण; आरम्भिक וְ को हिन्दी वंशावली की स्वाभाविक वाक्य-रचना में अलग से व्यक्त नहीं किया गया।
- source_word: הוֹלִיד
  choice: से … उत्पन्न हुआ
  rationale: हिफ़ील रूप यहाँ वंशोत्पत्ति का संबंध बताता है। हिन्दी में यह प्रयोग स्वाभाविक, संक्षिप्त और पुरुष-वंशावली के अर्थ के अनुकूल है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित कर्म का व्याकरणिक चिह्न है; हिन्दी में इसका स्वतंत्र शाब्दिक समकक्ष आवश्यक नहीं।
- source_word: רָם
  choice: राम
  rationale: हिब्रू व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: וְ/רָם
  choice: और राम
  rationale: וְ दोनों वंशावली खंडों को जोड़ता है; हिन्दी में इसे स्पष्ट रूप से ‘और’ कहा गया है।
- source_word: עַמִּינָדָב
  choice: अम्मीनादाब
  rationale: हिब्रू नाम का निकट लिप्यंतरण; द्वित्वित מּ को ‘म्म’ से दर्शाया गया है।
