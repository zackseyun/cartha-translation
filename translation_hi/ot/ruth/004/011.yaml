base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/011.yaml
  text: Then all the people who were at the gate[a], and the elders, said, “We are witnesses. May Yahweh make the woman who is coming into your house like Rachel and Leah, who together built up the house of Israel. And may you prosper in Ephrathah and proclaim a name in Bethlehem.”
translation:
  language: hi
  text: तब फाटक पर उपस्थित सभी लोगों और बुज़ुर्गों ने कहा, “हम गवाह हैं। याहवे उस स्त्री को, जो तुम्हारे घर आ रही है, राहेल और लिआ के समान बनाए, जिन्होंने दोनों मिलकर इस्राएल का घराना बसाया। तुम एप्राता में समृद्ध होओ[a] और बेतलेहेम में नाम कमाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘वीरता के काम करो’, ‘सामर्थ्य दिखाओ’ या ‘अपनी योग्यता दिखाओ’ भी हो सकता है; इब्रानी पदबंध सामर्थ्य, वीरता, धन और सफल उन्नति का भाव दे सकता है।
    reason: חַיִל के व्यापक अर्थ-क्षेत्र और पदबंध की वास्तविक अनिश्चितता को सुरक्षित रखना।
lexical_decisions:
- source_word: עֵדִים
  choice: हम गवाह हैं
  rationale: इब्रानी में केवल संज्ञा ‘गवाह’ है; हिन्दी प्रत्यक्ष कथन में निहित क्रिया को स्पष्ट करना स्वाभाविक है।
- source_word: יִתֵּן יְהוָה
  choice: याहवे ... बनाए
  rationale: נתן का मूल अर्थ ‘देना’ है, पर तुलना के साथ इस आशीर्वचन में ‘के समान बनाए’ आशय को स्वाभाविक रूप से व्यक्त करता और कामनासूचक बल बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: הָאִשָּׁה הַבָּאָה אֶל בֵּיתֶךָ
  choice: उस स्त्री को, जो तुम्हारे घर आ रही है
  rationale: वर्तमान कृदन्त के निकट/चल रहे प्रवेश और विवाह द्वारा घर में आने की ठोस छवि को बनाए रखता है।
- source_word: אֲשֶׁר בָּנוּ שְׁתֵּיהֶם אֶת בֵּית יִשְׂרָאֵל
  choice: जिन दोनों ने मिलकर इस्राएल का घराना बसाया
  rationale: ‘बनाने’ की मूल रूपक-छवि और वंश अथवा परिवार स्थापित करने का सन्दर्भ हिन्दी के स्वाभाविक मुहावरे ‘घराना बसाया’ में व्यक्त होता है; ‘दोनों’ שְׁתֵּיהֶם को स्पष्ट करता है।
- source_word: וַעֲשֵׂה חַיִל
  choice: तुम ... सामर्थ्य दिखाओ
  rationale: חַיִל के सामर्थ्य, वीरता, योग्यता, धन और सफलता तक फैले अर्थ-क्षेत्र को किसी एक संकीर्ण अर्थ में सीमित किए बिना अपेक्षाकृत निकटता से प्रस्तुत करता है।
- source_word: בְּאֶפְרָתָה
  choice: एप्राता में
  rationale: स्थान-नाम का इब्रानी के अनुसार लिप्यंतरण किया गया है।
- source_word: וּקְרָא שֵׁם
  choice: नाम कमाओ
  rationale: शाब्दिक ‘नाम पुकारो’ यहाँ हिन्दी में अस्पष्ट होगा; यह स्वाभाविक मुहावरा प्रतिष्ठा या यश प्राप्त करने का भाव देता है और ‘नाम’ की इब्रानी छवि बनाए रखता है।
- source_word: בְּבֵית לָחֶם
  choice: बेतलेहेम में
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण और स्थानीय प्रतिष्ठा का भाव रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: आशीर्वचन का व्याकरणिक बल
  choice: ‘बनाए’ तथा आज्ञार्थक रूपों को मंगलकामना के रूप में रखना
  alternative: निश्चयात्मक भविष्यवाणी के रूप में अनुवाद
  rationale: सन्दर्भ सार्वजनिक वैवाहिक आशीर्वचन का है; रूप आदेश/कामना का बल रखते हैं, न कि अनिवार्यतः सुनिश्चित भविष्यवाणी का।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक आशीर्वचन के अनुकूल रखी गई है। ‘पुरनियों’ बाइबिलीय सामाजिक पद के लिए परिचित हिन्दी है; ‘घराना बसाया’ और ‘नाम कमाओ’ सहज हिन्दी मुहावरे हैं, जबकि मूल की पारिवारिक और प्रतिष्ठा-संबंधी छवियाँ बनाए रखते हैं। पाद-टिप्पणी का चिह्न उसी विवादित पदबंध के बाद रखा गया है जिससे वह सम्बन्धित है।
