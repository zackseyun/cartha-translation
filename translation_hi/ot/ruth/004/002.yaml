  text: Then he took ten men from the elders of the city and said[a], “Sit here,” and they sat down.
translation:
  language: hi
  text: तब उसने नगर के बुज़ुर्गों में से दस पुरुषों को चुना[a] और कहा, “यहाँ बैठिए।” वे बैठ गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लिया।” इब्रानी क्रिया का अर्थ किसी उद्देश्य के लिए लोगों को लेना हो सकता है; यहाँ संभवतः कानूनी कार्यवाही के लिए उन्हें चुनना अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: उसने ... बुलाया
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर इस सार्वजनिक न्यायिक प्रसंग में इसका आशय कुछ पुरुषों को कार्यवाही के लिए चुनकर बुलाना है। हिंदी में ‘दस पुरुषों को लिया’ अस्वाभाविक है; ‘बुलाया’ स्वाभाविक रहते हुए प्रयोजनगत अर्थ व्यक्त करता है, और ‘चुना’ को पादटिप्पणी में रखा गया है।
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: दस पुरुषों
  rationale: यह पदबंध सार्वजनिक कार्यवाही में भाग लेने वाले दस वयस्क पुरुषों को स्पष्ट रूप से सूचित करता है।
- source_word: מִזִּקְנֵי הָעִיר
  choice: नगर के पुरनियों में से
  rationale: ‘में से’ מן के अंशवाचक भाव को बनाए रखता है। ‘पुरनिये’ यहाँ नगर के मान्य वरिष्ठ अगुवों के लिए प्रचलित बाइबलीय पद है।
- source_word: וַיֹּאמֶר
  choice: कहा
  rationale: सामान्य कथात्मक क्रिया का सीधा और स्वाभाविक अनुवाद।
- source_word: שְׁבוּ פֹה
  choice: यहाँ बैठिए
  rationale: बहुवचन आज्ञा को संदर्भानुकूल आदरसूचक हिंदी में व्यक्त किया गया है; פֹה का सीधा अर्थ ‘यहाँ’ है।
- source_word: וַיֵּשֵׁבוּ
  choice: वे बैठ गए
  rationale: यह आज्ञा के प्रत्युत्तर में पूर्ण हुई क्रिया को स्वाभाविक हिंदी में व्यक्त करता है।
