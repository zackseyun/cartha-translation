  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקַּח
  choice: लिया
  rationale: לקח का सामान्य कथात्मक अर्थ यहाँ ‘लेना’ है; बच्चे के साथ अगली शारीरिक क्रिया भी इसी अर्थ का समर्थन करती है।
- source_word: הַיֶּלֶד
  choice: बच्चे को
  rationale: יֶלֶד का अर्थ ‘बालक’ या ‘बच्चा’ हो सकता है; प्रसंग में नवजात शिशु होने के कारण ‘बच्चा’ अधिक स्वाभाविक है।
- source_word: וַתְּשִׁתֵהוּ
  choice: उसे ... रखा
  rationale: क्रिया का अर्थ ‘रखना/स्थापित करना’ है; हिंदी में बच्चे को गोद में रखने के लिए ‘रखा’ सहज और सटीक है।
- source_word: בְחֵיקָהּ
  choice: अपनी गोद में
  rationale: חֵיק छाती अथवा गोद के क्षेत्र को सूचित करता है; आधुनिक हिंदी में ‘गोद’ दृश्य और संबंध दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַתְּהִי לוֹ
  choice: उसकी ... बन गई
  rationale: היה + ל यहाँ नई भूमिका या संबंध बनने का भाव देता है; ‘बन गई’ इस कथात्मक परिणाम को स्पष्ट रखता है।
- source_word: לְאֹמֶנֶת
  choice: पालन-पोषण करनेवाली
  rationale: אֹמֶנֶת उस स्त्री को बताता है जो बच्चे की देखभाल करती और उसे पालती है। यह हिंदी अभिव्यक्ति आधुनिक ‘नर्स’ के चिकित्सकीय अर्थ से बचते हुए शब्द की व्यापक भूमिका को व्यक्त करती है।
