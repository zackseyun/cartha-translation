lexical_decisions:
- source_word: וְאֵלֶּה
  choice: यह है
  rationale: वाव सहित संकेतवाचक पद एक नए वंशावली-खंड का सूत्रवत परिचय देता है। हिंदी में ‘यह है’ स्वाभाविक है; अलग से ‘और’ जोड़ना आवश्यक नहीं, क्योंकि यहाँ उसका मुख्य कार्य खंड-संयोजक है।
- source_word: תּוֹלְדוֹת
  choice: वंशावली
  rationale: इस संदर्भ में पद किसी व्यक्ति से आगे चलने वाली वंश-श्रृंखला का परिचय देता है। ‘वंशावली’ सूत्रात्मक अर्थ को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है; ‘पीढ़ियाँ’ अधिक शब्दशः विकल्प है।
- source_word: פֶּרֶץ
  choice: पेरेस
  rationale: हिब्रू नाम का आधुनिक हिंदी देवनागरी लिप्यंतरण।
- source_word: הוֹלִיד
  choice: से ... उत्पन्न हुआ
  rationale: हिफ़इल रूप वंशावली में पिता से संतान उत्पन्न होने का संबंध बताता है। यह हिंदी में ‘जन्म दिया’ की अस्वाभाविक पुरुष-विषयक अभिव्यक्ति से बचते हुए संबंध को स्वाभाविक ढंग से रखता है।
- source_word: אֶת
  choice: '[कर्म-सूचक चिह्न; अनूदित नहीं]'
  rationale: यह निश्चित प्रत्यक्ष कर्म का व्याकरणिक चिह्न है और हिंदी में इसका पृथक अनुवाद आवश्यक नहीं।
- source_word: חֶצְרוֹן
  choice: हेस्रोन
  rationale: हिब्रू नाम का आधुनिक हिंदी देवनागरी लिप्यंतरण।
