- source_word: נַחְשׁוֹן
  choice: नहशोन
  rationale: व्यक्तिवाचक नाम का इब्रानी रूप के निकट देवनागरी लिप्यंतरण।
- source_word: וְ
  choice: और
  rationale: दो वंशावली-वाक्यांशों को जोड़ने वाला साधारण समुच्चयबोधक।
- source_word: שַׂלְמָה
  choice: सलमा
  rationale: इस पद के इब्रानी रूप שַׂלְמָה का सीधा देवनागरी लिप्यंतरण; समानांतर वंशावलियों से सामंजस्य बैठाने के लिए ‘सलमोन’ नहीं अपनाया गया।
