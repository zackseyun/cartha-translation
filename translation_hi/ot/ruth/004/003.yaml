id: RUT.4.3
reference: Ruth 4:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ לַ/גֹּאֵ֔ל חֶלְקַת֙ הַ/שָּׂדֶ֔ה אֲשֶׁ֥ר לְ/אָחִ֖י/נוּ לֶ/אֱלִימֶ֑לֶךְ מָכְרָ֣ה נָעֳמִ֔י הַ/שָּׁ֖בָה מִ/שְּׂדֵ֥ה מוֹאָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/003.yaml
  text: Then he said to the redeemer[a], “Naomi, who has returned from the fields of Moab[c][b], is selling the portion of the field that belonged to our brother Elimelech.”
translation:
  language: hi
  text: तब उसने उस छुड़ानेवाले से कहा, “मोआब देश से लौटी नाओमी हमारे भाई एलीमेलेक के खेत का हिस्सा[a] बेच रही है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खेत का भूखंड।”
    reason: lexical_alternative
  - marker: b
    text: या “बेच चुकी है”; हिब्रू क्रिया को पूर्ण हो चुकी कार्रवाई के रूप में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब उसने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसका क्रमिक बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: לַגֹּאֵל
  choice: उस छुड़ानेवाले से
  rationale: גֹּאֵל निकट संबंधी की पारिवारिक-कानूनी भूमिका को दर्शाता है। ‘छुड़ानेवाला’ पद की व्यापकता बनाए रखता है; प्रसंग उसके संबंधी होने को स्पष्ट करता है।
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: खेत का हिस्सा
  rationale: חֶלְקָה किसी खेत के भाग अथवा भूखंड को दर्शाता है; यह चयन मूल संरचना के निकट और सहज हिन्दी है।
- source_word: אֲשֶׁר לְאָחִינוּ לֶאֱלִימֶלֶךְ
  choice: हमारे भाई एलीमेलेक के
  rationale: लामेद वाली रचना स्वामित्व या संबंध व्यक्त करती है। ‘भाई’ यहाँ व्यापक कुल-संबंध की भाषा हो सकती है, इसलिए मूल की अस्पष्टता रखी गई है।
- source_word: מָכְרָה
  choice: बेच रही है
  rationale: पूर्ण क्रिया-रूप को चल रही कानूनी बातचीत में वर्तमान लेन-देन के रूप में समझा जा सकता है; इससे यह अनावश्यक निष्कर्ष नहीं निकलता कि बिक्री पहले ही पूरी हो चुकी थी।
- source_word: נָעֳמִי
  choice: नाओमी
  rationale: हिब्रू नाम का हिन्दी में प्रचलित और पहचाना जाने वाला रूप।
- source_word: הַשָּׁבָה
  choice: लौटी
  rationale: यह रूप नाओमी को लौटकर आई हुई स्त्री के रूप में पहचानता है; संक्षिप्त हिन्दी वाक्यांश पूर्ण हो चुके लौटने को व्यक्त करता है।
- source_word: מִשְּׂדֵה מוֹאָב
  choice: मोआब देश से
  rationale: शाब्दिक ‘मोआब के खेत/मैदान से’ यहाँ मोआब के भूभाग या देश के लिए मुहावरा है; ‘मोआब देश’ साधारण पाठक के लिए अर्थ स्पष्ट करता है।
theological_decisions:
- issue: גֹּאֵל की पारिवारिक-कानूनी भूमिका
  choice: छुड़ानेवाला
  alternative: निकट संबंधी / संबंधी-छुड़ानेवाला
  rationale: एक ही व्याख्यात्मक संयुक्त पद से भूमिका को सीमित करने के बजाय मूल पद की व्यापक कानूनी और पारिवारिक अर्थ-सीमा बनाए रखी गई है।
- issue: מָכְרָה का कालगत अर्थ
  choice: बेच रही है
  alternative: बेच चुकी है / बेच दी है
  rationale: हिब्रू पूर्ण रूप पूर्ण बिक्री का संकेत दे सकता है, पर वार्ता का प्रसंग प्रस्तावित या वर्तमान लेन-देन का अर्थ भी स्वीकार करता है; वैकल्पिक पाठ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज कानूनी-कथात्मक शैली रखी गई है। ‘मोआब देश’ हिब्रू मुहावरे का स्वाभाविक हिन्दी अर्थ देता है; ‘खेत का हिस्सा’ मूल बिंब को बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
