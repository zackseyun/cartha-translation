base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/009.yaml
  text: Then Boaz said to the elders and all the people[b][a], “You are witnesses today that I have acquired from the hand of Naomi all that belonged to Elimelech and all that belonged to Chilion and Mahlon.”
translation:
  language: hi
  text: तब बोअज़ ने बुज़ुर्गों और सभी लोगों से कहा, “आज आप गवाह हैं कि मैंने नाओमी के हाथ से[b] वह सब कुछ प्राप्त कर लिया है[a] जो एलीमेलेक का था, और वह सब कुछ जो किल्योन और महलोन का था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खरीद लिया है” अथवा “मोल ले लिया है”; हिब्रू क्रिया कानूनी लेन-देन में खरीदकर प्राप्त करने को भी दर्शा सकती है।
    reason: lexical_alternative
  - marker: b
    text: “नाओमी के हाथ से” एक हिब्रू मुहावरा है, जिसका अर्थ नाओमी के कब्ज़े, अधिकार या नियंत्रण से है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לַזְּקֵנִים וְכָל הָעָם
  choice: बुज़ुर्गों और सभी लोगों से
  rationale: ‘बुज़ुर्ग’ यहाँ समुदाय के मान्य वरिष्ठ जनों को दर्शाता है, और ‘सभी लोगों’ से दूसरे पूरे समूह का उल्लेख बना रहता है।
- source_word: עֵדִים אַתֶּם הַיּוֹם
  choice: आज आप इस बात के गवाह हैं
  rationale: हिब्रू के विधेय-प्रथम वाक्य को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है; ‘इस बात के’ आगे आने वाली गवाही की विषय-वस्तु से जोड़ता है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי गवाही की विषय-वस्तु प्रस्तुत करता है, कारण नहीं।
- source_word: קָנִיתִי
  choice: अपने अधिकार में ले लिया है
  rationale: कानूनी लेन-देन में क्रिया किसी संपत्ति या अधिकार को प्राप्त करने का अर्थ देती है। यह हिन्दी अभिव्यक्ति हस्तांतरण बताती है, पर नकद खरीद को अनिवार्य नहीं ठहराती।
- source_word: אֶת כָּל אֲשֶׁר לֶאֱלִימֶלֶךְ
  choice: वह सब कुछ ... जो एलीमेलेक का था
  rationale: हिब्रू का ‘जो एलीमेलेक के लिए/का था’ स्वामित्व सूचित करता है; यह हिन्दी में सहज रूप है।
- source_word: וְאֵת כָּל אֲשֶׁר לְכִלְיוֹן וּמַחְלוֹן
  choice: और वह सब कुछ भी, जो किल्योन और महलोन का था
  rationale: पहले खंड के समानांतर ढाँचे और दोनों नामों से जुड़ी संपत्ति को सुरक्षित रखा गया है।
- source_word: מִיַּד נָעֳמִי
  choice: नाओमी के हाथ से
  rationale: मूल का कानूनी-सांस्कृतिक मुहावरा बनाए रखा गया है; पादटिप्पणी स्पष्ट करती है कि आशय नाओमी के अधिकार या अधीनता से है।
theological_decisions:
- issue: बोअज़ के लेन-देन का स्वरूप
  choice: ‘अपने अधिकार में ले लिया’ द्वारा संपत्ति अथवा अधिकार के कानूनी हस्तांतरण को व्यक्त करना
  alternative: ‘खरीद लिया’ या ‘मोल ले लिया’
  rationale: קנה खरीद द्वारा प्राप्त करने का अर्थ दे सकता है, पर अपने आप में भुगतान की रीति को आवश्यक रूप से निर्दिष्ट नहीं करता। चुना हुआ रूप व्यक्तियों की खरीद का अनुचित संकेत दिए बिना कानूनी अधिग्रहण व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। कानूनी प्रसंग का भाव सुरक्षित है, जबकि अत्यधिक तकनीकी या सांप्रदायिक शब्दावली से बचा गया है।
