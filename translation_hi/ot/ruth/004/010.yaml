source:
  edition: WLC
  text: וְ/גַ֣ם אֶת ר֣וּת הַ/מֹּאֲבִיָּה֩ אֵ֨שֶׁת מַחְל֜וֹן קָנִ֧יתִי לִ֣/י לְ/אִשָּׁ֗ה לְ/הָקִ֤ים שֵׁם הַ/מֵּת֙ עַל נַ֣חֲלָת֔/וֹ וְ/לֹא יִכָּרֵ֧ת שֵׁם הַ/מֵּ֛ת מֵ/עִ֥ם אֶחָ֖י/ו וּ/מִ/שַּׁ֣עַר מְקוֹמ֑/וֹ עֵדִ֥ים אַתֶּ֖ם הַ/יּֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/010.yaml
  text: And also Ruth the Moabite[a], the wife of Mahlon, I have acquired for myself as a wife, to raise up the name of the dead over his inheritance, so that the name of the dead may not be cut off from among his brothers and from the gate of his place[c][b]. You are witnesses today.
translation:
  language: hi
  text: और मोआबी रूत को भी, जो महलोन की पत्नी थी, मैंने अपने लिए पत्नी के रूप में प्राप्त किया है[a], ताकि उसकी विरासत पर मृतक का नाम स्थापित करूँ, जिससे मृतक का नाम उसके भाइयों के बीच से और उसके नगर के फाटक से मिट न जाए[c]। आज तुम गवाह हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “प्राप्त किया है” का अनुवाद “अपने लिए मोल लिया है” भी हो सकता है। इब्रानी क्रिया कानूनी लेन-देन में प्राप्त करने या खरीदने का भाव रख सकती है।
    reason: lexical_alternative
  - marker: c
    text: नगर का फाटक वह सार्वजनिक स्थान था जहाँ कानूनी मामलों का निर्णय होता और उनकी गवाही दी जाती थी।
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם
  choice: और ... भी
  rationale: पूर्ववर्ती कानूनी घोषणा से संबंध और इसके योगात्मक बल, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: רוּת הַמֹּאֲבִיָּה
  choice: मोआबी रूत
  rationale: जातिवाचक विशेषण और व्यक्तिनाम को आधुनिक हिन्दी के स्वाभाविक क्रम में प्रस्तुत करता है।
- source_word: אֵשֶׁת מַחְלוֹן
  choice: जो महलोन की पत्नी थी
  rationale: मूल में प्रयुक्त ‘महलोन की पत्नी’ को सुरक्षित रखता है; ‘विधवा’ का ऐसा विशिष्ट शब्द नहीं जोड़ता जो इब्रानी में नहीं है। सन्दर्भानुसार भूतकाल हिन्दी में स्वाभाविक है।
- source_word: קָנִיתִי לִי לְאִשָּׁה
  choice: उसे भी मैंने अपनी पत्नी बनाने के लिए ग्रहण किया है
  rationale: קנה के कानूनी-अर्जन भाव और स्पष्ट वैवाहिक उद्देश्य को बनाए रखते हुए हिन्दी में स्त्री को वस्तु की तरह ‘खरीदने’ का अनावश्यक रूप से प्रबल संकेत देने से बचता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: לְהָקִים שֵׁם הַמֵּת עַל נַחֲלָתוֹ
  choice: ताकि मृतक का नाम उसकी विरासत से जुड़ा रहे
  rationale: ‘नाम खड़ा करने’ के इब्रानी मुहावरे का आशय—मृतक के वंश और पैतृक संपत्ति से उसकी कानूनी पहचान बनाए रखना—सुगम हिन्दी में व्यक्त करता है।
- source_word: וְלֹא יִכָּרֵת שֵׁם הַמֵּת
  choice: और मृतक का नाम ... मिट न जाए
  rationale: इब्रानी ‘काट न दिया जाए’ का परिणामगत अर्थ आधुनिक हिन्दी में स्वाभाविक ढंग से देता है, जबकि नाम और वंश के लोप की गंभीरता बनाए रखता है।
- source_word: מֵעִם אֶחָיו
  choice: उसके भाइयों के बीच से
  rationale: मूल के पुल्लिंग बहुवचन ‘उसके भाइयों’ को व्यापक ‘रिश्तेदारों’ में बदले बिना सुरक्षित रखता है।
- source_word: וּמִשַּׁעַר מְקוֹמוֹ
  choice: उसके नगर के फाटक से
  rationale: ‘उसके स्थान के फाटक’ को स्वाभाविक हिन्दी में देता है और प्राचीन नगर-फाटक की सार्वजनिक-कानूनी भूमिका बनाए रखता है।
- source_word: עֵדִים אַתֶּם הַיּוֹם
  choice: आज तुम इसके गवाह हो
  rationale: सभा को संबोधित औपचारिक कानूनी घोषणा को स्पष्ट, वर्तमान हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: रूत के संबंध में बोअज़ की कानूनी-विमोचनात्मक कार्रवाई
  choice: ‘अपनी पत्नी बनाने के लिए ग्रहण किया है’
  alternative: ‘अपनी पत्नी बनाने के लिए खरीद लिया है’
  rationale: קנה में अर्जित करने या खरीदने का लेन-देन संबंधी बल है, पर यह पद विवाह, विरासत और मृतक का नाम बनाए रखने की संयुक्त कानूनी व्यवस्था का वर्णन करता है। मुख्य पाठ इस पूरे आशय को रखता है और अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- issue: मृतक का नाम ‘खड़ा करना’ और विरासत
  choice: ‘मृतक का नाम उसकी विरासत से जुड़ा रहे’
  alternative: ‘मृतक का नाम उसकी विरासत पर खड़ा करूँ’
  rationale: शाब्दिक रूप हिन्दी में अस्पष्ट और अप्राकृतिक होगा। चुना हुआ पाठ वंश, नाम और पैतृक संपत्ति के बीच कानूनी संबंध को स्पष्ट करता है, बिना इसे किसी विशिष्ट सांप्रदायिक व्याख्या में सीमित किए।
- issue: אֶחָיו का दायरा
  choice: ‘उसके भाइयों’
  alternative: ‘उसके रिश्तेदारों’
  rationale: कुल-संबंधी संदर्भ में अर्थ व्यापक हो सकता है, फिर भी मूल शब्द स्पष्टतः ‘भाइयों’ कहता है; अतः वास्तविक अस्पष्टता को व्याख्यात्मक विस्तार से नहीं मिटाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सार्वजनिक कानूनी घोषणा के अनुरूप शैली रखी गई है। ‘विरासत’, ‘मृतक’ और ‘गवाह’ जैसे सर्वसुलभ औपचारिक शब्द चुने गए हैं; अत्यधिक संस्कृतनिष्ठ या पुरातन अभिव्यक्तियों से बचा गया है।
