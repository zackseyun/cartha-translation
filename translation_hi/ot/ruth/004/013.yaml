base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/013.yaml
  text: So Boaz took Ruth[a], and she became his wife. He went in to her, and Yahweh granted her conception, and she bore a son.
translation:
  language: hi
  text: तब बोअज़ ने रूत को ग्रहण किया, और वह उसकी पत्नी हो गई। वह उसके पास गया, और याहवे ने उसे गर्भधारण कराया[a]; फिर उसने एक पुत्र को जन्म दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “याहवे ने उसे गर्भधारण दिया”; या, “याहवे ने उसे गर्भ धारण करने योग्य किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: ग्रहण किया
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर विवाह के संदर्भ में ‘ग्रहण किया’ आधुनिक हिन्दी में अधिक स्वाभाविक और गरिमापूर्ण है; अगला खंड वैवाहिक अर्थ को स्पष्ट करता है।
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: वह उसकी पत्नी हो गई
  rationale: यह इब्रानी मुहावरा औपचारिक वैवाहिक संबंध को व्यक्त करता है और क्रमिक कथन को बनाए रखता है।
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: वह उसके पास गया
  rationale: यह यौन-संबंध के लिए प्रयुक्त इब्रानी शिष्टोक्ति है। हिन्दी वाक्य स्रोत की संयत भाषा और प्रसंगगत संकेत दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וַיִּתֵּן יְהוָה לָהּ הֵרָיוֹן
  choice: यहोवा ने उसे गर्भवती होने की सामर्थ्य दी
  rationale: हֵרָיוֹן गर्भधारण अथवा गर्भावस्था को दर्शाता है। यह स्वाभाविक हिन्दी में परमेश्वर की सक्रिय भूमिका और ‘देने’ की स्रोत-छवि को सुरक्षित रखता है।
- source_word: וַתֵּלֶד בֵּן
  choice: उसने एक पुत्र को जन्म दिया
  rationale: यह ילד और בֵּן का स्पष्ट, स्वाभाविक तथा कथात्मक हिन्दी रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; इसलिए उसे उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: रूत के गर्भधारण में परमेश्वर की भूमिका
  choice: यहोवा ने उसे गर्भवती होने की सामर्थ्य दी
  alternative: यहोवा ने उसे गर्भधारण दिया
  rationale: मूल वाक्य गर्भधारण को यहोवा द्वारा दी गई वस्तु या क्षमता के रूप में प्रस्तुत करता है। मुख्य पाठ इस ईश्वरीय सक्रियता को स्वाभाविक हिन्दी में रखता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर बाइबलीय कथा के अनुरूप गरिमापूर्ण और संयत रखी गई है। यौन-संबंध के उल्लेख में मूल की शिष्टोक्ति सुरक्षित है।
