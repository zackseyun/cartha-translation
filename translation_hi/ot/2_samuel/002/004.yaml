source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ אַנְשֵׁ֣י יְהוּדָ֔ה וַ/יִּמְשְׁחוּ שָׁ֧ם אֶת דָּוִ֛ד לְ/מֶ֖לֶךְ עַל בֵּ֣ית יְהוּדָ֑ה וַ/יַּגִּ֤דוּ לְ/דָוִד֙ לֵ/אמֹ֔ר אַנְשֵׁי֙ יָבֵ֣ישׁ גִּלְעָ֔ד אֲשֶׁ֥ר קָבְר֖וּ אֶת שָׁאֽוּל־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/004.yaml
  text: Then the men of Judah came[a], and there they anointed David king over the house of Judah. And they told David, saying, "The men of Jabesh-gilead were the ones who buried Saul."
translation:
  language: hi
  text: तब यहूदा के पुरुष आए और वहाँ उन्होंने दाऊद का यहूदा के घराने पर राजा के रूप में अभिषेक किया। फिर उन्होंने दाऊद को बताया, “शाऊल को दफनाने वाले याबेश-गिलाद के पुरुष थे।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सरल रूप में, “याबेश-गिलाद के पुरुषों ने शाऊल को दफनाया था।”
    reason: अंतिम संबंधवाचक उपवाक्य को पहचान पर बल देने वाली रचना या साधारण कथन—दोनों रूपों में समझा जा सकता है।
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: आए
  rationale: בוא का सामान्य आख्यानात्मक अर्थ यहाँ किसी स्थान पर आने या पहुँचने का है; हिंदी में “आए” प्रसंग के प्रवाह के अनुकूल है।
- source_word: אַנְשֵׁי יְהוּדָה
  choice: यहूदा के पुरुष
  rationale: אַנְשֵׁי का अर्थ विशेष रूप से “पुरुष” है; संभवतः यहाँ गोत्र के पुरुष प्रतिनिधि या अगुए अभिप्रेत हैं।
- source_word: וַיִּמְשְׁחוּ שָׁם אֶת דָּוִד לְמֶלֶךְ
  choice: वहाँ उन्होंने दाऊद का अभिषेक करके उसे … राजा बनाया
  rationale: राजकीय संदर्भ में משׁח के अभिषेक संबंधी अर्थ को रखा गया है, जबकि לְמֶלֶךְ का स्वाभाविक हिंदी परिणाम “राजा बनाया” से व्यक्त होता है।
- source_word: עַל בֵּית יְהוּדָה
  choice: यहूदा के घराने का
  rationale: בֵּית की सामूहिक और गोत्रीय छवि “घराने” से सुरक्षित रहती है; हिंदी में राजा के अधिकार-क्षेत्र को “घराने का राजा” स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: फिर उन्होंने दाऊद को बताया
  rationale: नגד हिफ़ील का अर्थ बताना या सूचना देना है। לֵאמֹר को अलग से “यह कहते हुए” करना हिंदी में अनावश्यक और बोझिल होता, इसलिए उसका कार्य सीधे कथन से व्यक्त किया गया है।
- source_word: אַנְשֵׁי יָבֵישׁ גִּלְעָד
  choice: याबेश-गिलाद के पुरुष
  rationale: स्थान-नाम को प्रचलित संयुक्त रूप में रखा गया है और אַנְשֵׁי की पुरुषवाचक विशिष्टता सुरक्षित रखी गई है।
- source_word: אֲשֶׁר קָבְרוּ אֶת שָׁאוּל
  choice: शाऊल को दफनाने वाले … थे
  rationale: यह रचना सूचना में व्यक्तियों की पहचान पर बल देती है, पर साधारण संबंधवाचक अनुवाद भी व्याकरणतः संभव है।
theological_decisions:
- issue: אַנְשֵׁי में लिंग-विशिष्ट सामूहिक भाषा
  choice: दोनों स्थानों पर “पुरुष”
  alternative: “लोग” या “अगुए”
  rationale: इब्रानी शब्द पुरुषवाचक है। “लोग” इसे अनावश्यक रूप से तटस्थ कर देता और “अगुए” ऐसी भूमिका जोड़ता है जो पाठ में स्पष्ट नहीं है।
- issue: “यहूदा के घराने” की सामूहिक छवि
  choice: “यहूदा के घराने” को बनाए रखना
  alternative: “यहूदा” या “यहूदा के गोत्र”
  rationale: בֵּית की घराना-आधारित सामूहिक छवि को सुरक्षित रखा गया है, बिना उसे केवल भूभाग या अधिक स्पष्ट गोत्रीय पद में सीमित किए।
- issue: अंतिम संबंधवाचक उपवाक्य में पहचान का बल
  choice: “शाऊल को दफनाने वाले … थे”
  alternative: “याबेश-गिलाद के पुरुषों ने शाऊल को दफनाया था”
  rationale: मुख्य पाठ में संभावित पहचानसूचक बल व्यक्त किया गया है, जबकि सरल वाक्य-विन्यास को पादटिप्पणी में वास्तविक वैकल्पिक अनुवाद के रूप में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण आख्यानात्मक शैली अपनाई गई है। “अभिषेक,” “घराना,” और “दफनाना” जैसे परिचित शब्द मूल के राजकीय, सामूहिक और अंत्येष्टि-संबंधी अर्थों को स्पष्ट रखते हैं।
