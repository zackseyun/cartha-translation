translation:
  language: hi
  text: तब अब्नेर ने योआब से कहा, “युवक ज़रा उठें और हमारे सामने मुकाबला करें।” योआब ने कहा, “वे उठें।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנְּעָרִים
  choice: युवक
  rationale: यह बहुवचन संज्ञा संदर्भ में दोनों पक्षों के युवा योद्धाओं को सूचित करती है; ‘युवक’ स्वाभाविक है और मूल की आयु-संबंधी अभिव्यक्ति बनाए रखता है।
- source_word: וִישַׂחֲקוּ
  choice: मुकाबला करें
  rationale: שׂחק का मूल अर्थ खेलना या क्रीड़ा करना हो सकता है, पर अगले पदों में सशस्त्र घातक संघर्ष होने के कारण यहाँ ‘मुकाबला करें’ प्रसंगानुकूल है, बिना क्रिया को सीधे ‘लड़ें’ या ‘मारें’ बनाने के।
- source_word: לְפָנֵינוּ
  choice: हमारे सामने
  rationale: स्थानिक और दर्शक-संबंधी अर्थ को सीधे तथा स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: נָא
  choice: अनुवाद में विनम्र प्रस्ताव के रूप में निहित
  rationale: נָא अनुरोध/प्रस्ताव को नरम करता है; हिंदी में अलग ‘कृपया’ जोड़ना इस सैन्य संवाद में कुछ अस्वाभाविक लगता है, इसलिए ‘युवक उठें…’ की प्रस्तावात्मक शैली में इसका बल रखा गया है।
theological_decisions: []
