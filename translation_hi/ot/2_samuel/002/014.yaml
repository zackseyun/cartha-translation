  register: आधुनिक मानक हिंदी का संक्षिप्त, गरिमापूर्ण कथात्मक गद्य। नाम ‘अब्नेर’ और ‘योआब’ प्रचलित बाइबलीय रूपों में रखे गए हैं। मूल की पुनरुक्ति ‘उठें… वे उठें’ सुरक्षित रखी गई है।
