base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/024.yaml
  text: Joab and Abishai pursued Abner[a], and the sun went down; and they came as far as the hill of Ammah[b], which is opposite Giah on the way to the wilderness of Gibeon.
translation:
  language: hi
  text: योआब और अबीशै ने अबनेर का पीछा किया, और सूरज डूब गया; तब वे अम्मा की पहाड़ी तक पहुँचे, जो गीह के सामने[a], गिबोन के निर्जन प्रदेश की ओर जाने वाले मार्ग पर[b] थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गीह के आगे”; इब्रानी अभिव्यक्ति किसी स्थान के सामने, सम्मुख या आगे की स्थिति बता सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “गिबोन के निर्जन प्रदेश के मार्ग पर”; इब्रानी में मार्ग और दिशा का संबंध कुछ अस्पष्ट है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ ... אַחֲרֵי אַבְנֵר
  choice: अबनेर का पीछा करते रहे
  rationale: רדף और אַחֲרֵי मिलकर सैन्य संदर्भ में लगातार पीछा करने का भाव देते हैं; हिंदी में यह स्वाभाविक और स्पष्ट है।
- source_word: וְהַשֶּׁמֶשׁ בָּאָה
  choice: जब सूरज डूबा
  rationale: शाब्दिक रूप से 'सूरज आया' सूर्यास्त का इब्रानी मुहावरा है। 'सूरज डूबा' आधुनिक हिंदी में उसी समय-संदर्भ को स्पष्ट करता है; 'जब' वाक्य के कालगत संबंध को सहज बनाता है।
- source_word: וְהֵמָּה בָּאוּ עַד
  choice: तब वे ... तक पहुँचे
  rationale: עַד गति की अंतिम सीमा बताता है। 'तक पहुँचे' हिंदी में उस स्थान तक पहुँचने का अर्थ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: גִּבְעַת אַמָּה
  choice: अम्मा नामक पहाड़ी
  rationale: यह स्थाननाम से जुड़ी construct chain है। 'अम्मा नामक पहाड़ी' हिंदी पाठक के लिए स्पष्ट है और 'अम्मा' को सामान्य संबंधवाचक शब्द समझे जाने से बचाता है।
- source_word: אֲשֶׁר עַל־פְּנֵי גִיחַ
  choice: जो गीह के सामने है
  rationale: עַל־פְּנֵי भौगोलिक स्थिति में 'सामने' या 'सम्मुख' का अर्थ दे सकता है। 'सामने' दिशा को अनावश्यक रूप से निश्चित किए बिना मूल अस्पष्टता रखता है।
- source_word: דֶּרֶךְ מִדְבַּר גִּבְעוֹן
  choice: गिबोन के निर्जन प्रदेश की ओर जाने वाले मार्ग पर
  rationale: דֶּרֶךְ मार्ग/रास्ता और מִדְבָּר निर्जन अथवा वन्य प्रदेश को सूचित करता है। यह रूप मार्ग और गंतव्य-संबंध दोनों को सहज हिंदी में रखता है।
- source_word: יוֹאָב / אֲבִישַׁי / אַבְנֵר / אַמָּה / גִּיחַ / גִּבְעוֹן
  choice: योआब / अबीशै / अबनेर / अम्मा / गीह / गिबोन
  rationale: व्यक्तियों और स्थानों के नाम मूल इब्रानी उच्चारण के निकट, हिंदी में प्रचलित बाइबलीय लिप्यंतरण-पद्धति के अनुसार दिए गए हैं।
