  text: असाहेल अब्नेर का पीछा करता रहा, और अब्नेर का पीछा करते हुए न दाईं ओर मुड़ा, न बाईं ओर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: पीछा करता रहा
  rationale: רדף सक्रिय और लगातार पीछा करने को व्यक्त करता है; हिंदी का यह रूप कथा में जारी कार्रवाई को स्वाभाविक ढंग से दर्शाता है।
- source_word: אַחֲרֵי אַבְנֵר
  choice: अब्नेर का
  rationale: हिंदी में ‘पीछा करना’ के साथ संबंधकारक ‘का’ स्वाभाविक है और इब्रानी ‘अब्नेर के पीछे’ का आशय सुरक्षित रखता है।
- source_word: וְלֹא נָטָה לָלֶכֶת
  choice: न ... मुड़ा
  rationale: נטה यहाँ चलते हुए अपने मार्ग से हटने या मुड़ने का बोध देता है; ‘मुड़ा’ भौतिक दिशा का चित्र स्पष्ट रखता है। अलग से ‘चलने में’ जोड़ना हिंदी में अनावश्यक और बोझिल होता।
- source_word: עַל הַיָּמִין וְעַל הַשְּׂמֹאול
  choice: न दाईं ओर ... न बाईं ओर
  rationale: यह मानक दिशात्मक मुहावरे को स्पष्ट, स्वाभाविक आधुनिक हिंदी में बनाए रखता है।
- source_word: מֵאַחֲרֵי אַבְנֵר
  choice: अब्नेर के पीछे से
  rationale: यह इब्रानी की स्थानिक अभिव्यक्ति ‘अब्नेर के पीछे से’ को निकटता से सुरक्षित रखता है और बताता है कि असाहेल पीछा करते हुए अपनी दिशा से नहीं हटा।
- source_word: עֲשָׂהאֵל / אַבְנֵר
  choice: असाहेल / अब्नेर
  rationale: व्यक्तिनामों के प्रचलित हिंदी बाइबलीय लिप्यंतरण अपनाए गए हैं।
