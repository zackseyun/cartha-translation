base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/022.yaml
  text: Abner said again to Asahel[a], “Turn aside from following me. Why should I strike you to the ground? Then how could I lift up my face to Joab your brother?”
translation:
  language: hi
  text: अब्नेर ने फिर असाहेल से कहा, “मेरा पीछा छोड़कर हट जा। मैं क्यों तुझे मारकर धरती पर गिराऊँ? फिर मैं तेरे भाई योआब को मुँह कैसे दिखाऊँगा[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “फिर मैं तेरे भाई योआब की ओर अपना मुख कैसे उठा सकूँगा?”
    reason: हिब्रू के मूल शारीरिक मुहावरे को दिखाने के लिए।
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד אַבְנֵר לֵאמֹר
  choice: अब्नेर ने फिर ... कहा
  rationale: ‘फिर’ हिब्रू की पुनरावृत्तिमूलक अभिव्यक्ति ‘उसने फिर और कहा’ का स्वाभाविक हिन्दी रूप है।
- source_word: סוּר לְךָ מֵאַחֲרָי
  choice: मेरा पीछा छोड़कर हट जा
  rationale: यह रूप סוּר के हटने के आदेश और מֵאַחֲרַי के ‘मेरे पीछे चलने/मेरा पीछा करने’ के भाव, दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: לָמָּה אַכֶּכָּה אַרְצָה
  choice: मैं क्यों तुझे मारकर धरती पर गिराऊँ?
  rationale: נכה को ‘मारना’ और אַרְצָה को ‘धरती पर गिराना’ अनूदित किया गया है; इससे मृत्यु को अनावश्यक रूप से स्पष्ट किए बिना प्रहार की घातक संभावना और दृश्यात्मकता बनी रहती है।
- source_word: וְאֵיךְ אֶשָּׂא פָנַי
  choice: फिर मैं ... को मुँह कैसे दिखाऊँगा
  rationale: शाब्दिक ‘अपना मुख कैसे उठाऊँ’ हिन्दी में ‘मुँह कैसे दिखाऊँ’ के स्वाभाविक मुहावरे से व्यक्त होता है, जो लज्जा या सामना न कर सकने का भाव रखता है।
- source_word: אֶל יוֹאָב אָחִיךָ
  choice: तेरे भाई योआब को
  rationale: मुहावरे के साथ אֶל उस व्यक्ति को सूचित करता है जिसका सामना करना होगा; हिन्दी में ‘योआब को मुँह दिखाना’ स्वाभाविक है।
- source_word: אַבְנֵר / עֲשָׂהאֵל / יוֹאָב
  choice: अब्नेर / असाहेल / योआब
  rationale: नामों का देवनागरी में प्रचलित बाइबलीय लिप्यंतरण किया गया है।
