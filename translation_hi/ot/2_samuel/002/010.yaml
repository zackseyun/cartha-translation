source:
  edition: WLC
  text: בֶּן אַרְבָּעִ֨ים שָׁנָ֜ה אִֽישׁ בֹּ֣שֶׁת בֶּן שָׁא֗וּל בְּ/מָלְכ/וֹ֙ עַל יִשְׂרָאֵ֔ל וּ/שְׁתַּ֥יִם שָׁנִ֖ים מָלָ֑ךְ אַ֚ךְ בֵּ֣ית יְהוּדָ֔ה הָי֖וּ אַחֲרֵ֥י דָוִֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/010.yaml
  text: Ish-bosheth son of Saul was forty years old when he began to reign over Israel[a], and he reigned two years[c][b]. But the house of Judah followed David.
translation:
  language: hi
  text: शाऊल का पुत्र ईशबोशेत[a] चालीस वर्ष का था जब वह इस्राएल पर राजा बना, और उसने दो वर्ष तक राज्य किया। परन्तु यहूदा का घराना[b] दाऊद के पक्ष में रहा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संबंधित प्राचीन परंपराओं में इस नाम का एक अन्य रूप ‘एशबाल’ मिलता है; यहाँ मसोरेटिक पाठ में ‘ईशबोशेत’ है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक अर्थ ‘यहूदा का घर’; यह यहूदा के गोत्र अथवा उसके राजनीतिक समुदाय के लिए सामूहिक अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक रूप से ‘दाऊद के पीछे था’; भावार्थ: दाऊद के प्रति निष्ठावान था या उसके साथ था।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  choice: चालीस वर्ष का था
  rationale: यह आयु बताने वाला मानक इब्रानी मुहावरा है; स्वाभाविक आधुनिक हिन्दी में इसका सीधा अर्थ दिया गया है।
- source_word: אִישׁ בֹּשֶׁת
  choice: ईशबोशेत
  rationale: मसोरेटिक पाठ में आए व्यक्तिगत नाम का हिन्दी लिप्यंतरण रखा गया है; संबंधित परंपरा में मिलने वाले एशबाल रूप को पादटिप्पणी में बताया गया है।
- source_word: בְּמָלְכוֹ עַל יִשְׂרָאֵל
  choice: जब वह इस्राएल पर राजा बना
  rationale: यह पदबंध उसके राजा बनने के समय उसकी आयु बताता है। यह हिन्दी में स्वाभाविक है और इस्राएल पर उसके राजकीय अधिकार का भाव बनाए रखता है।
- source_word: וּשְׁתַּיִם שָׁנִים מָלָךְ
  choice: और उसने दो वर्ष तक राज्य किया
  rationale: राज्यकाल की अवधि बताने वाले इब्रानी सूत्र का स्पष्ट और निकट हिन्दी रूप।
- source_word: אַךְ
  choice: परन्तु
  rationale: यहाँ यह शब्द ईशबोशेत के इस्राएल पर राज्य और दाऊद के प्रति यहूदा की निष्ठा के बीच विरोध दर्शाता है।
- source_word: בֵּית יְהוּדָה
  choice: यहूदा का घराना
  rationale: ‘घर’ की सामूहिक छवि को बनाए रखते हुए यह अभिव्यक्ति यहूदा के गोत्रीय-राजनीतिक समुदाय को दर्शाती है।
- source_word: הָיוּ אַחֲרֵי דָוִד
  choice: दाऊद के पक्ष में रहा
  rationale: शाब्दिक रूप से ‘दाऊद के पीछे थे’ राजनीतिक समर्थन अथवा निष्ठा का मुहावरा है; चुना हुआ रूप आधुनिक हिन्दी में अर्थ स्पष्ट करता है।
theological_decisions:
- issue: इस्राएल और यहूदा के बीच राजनीतिक विभाजन
  choice: ‘इस्राएल’ और ‘यहूदा का घराना’ दोनों को पाठ के अनुसार अलग रखा गया है।
  alternative: ‘सारा इस्राएल’ जैसे समेकित शब्दों का प्रयोग करना।
  rationale: पद स्वयं ईशबोशेत के अधिकार-क्षेत्र और दाऊद के प्रति यहूदा की निष्ठा के बीच तनाव बनाए रखता है; अनुवाद इसे समतल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। राजकीय सूत्र को संक्षिप्त रखा गया है, जबकि इब्रानी सामूहिक अभिव्यक्ति और निष्ठा-सूचक मुहावरे की बारीकियाँ पादटिप्पणियों में सुरक्षित हैं।
