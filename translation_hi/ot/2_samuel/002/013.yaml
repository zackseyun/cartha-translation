  yaml_path: translation/ot/2_samuel/002/013.yaml
  text: And Joab the son of Zeruiah and the servants of David went out and met them together by the pool of Gibeon. And these sat on one side of the pool[a], and those on the other side of the pool.
translation:
  language: hi
  text: तब सरूयाह का पुत्र योआब और दाऊद के सेवक निकले और गिबोन के जलकुंड[a] के पास उनसे एक साथ मिले। फिर ये जलकुंड के इस ओर और वे जलकुंड के उस ओर बैठ गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘जलकुंड’ का अनुवाद ‘जलाशय’ भी हो सकता है; इब्रानी शब्द किसी बनाए हुए कुंड या पानी के भंडार को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב בֶּן צְרוּיָה
  choice: तब सरूयाह का पुत्र योआब
  rationale: कथात्मक וְ को स्वाभाविक हिन्दी में ‘तब’ से व्यक्त किया गया है; वंश-सूचक पद और नाम सुरक्षित रखे गए हैं।
- source_word: וְ/עַבְדֵי דָוִד
  choice: और दाऊद के सेवक
  rationale: עֲבָדִים का मूल अर्थ ‘सेवक’ रखा गया है; प्रसंग सैन्य है, पर मूल शब्द स्वयं ‘सैनिक’ नहीं कहता।
- source_word: יָצְאוּ
  choice: निकले
  rationale: יצא का सामान्य और प्रसंगानुकूल सीधा हिन्दी रूप।
- source_word: וַֽ/יִּפְגְּשׁוּ/ם
  choice: उन लोगों से मिले
  rationale: क्रिया के कर्मवाचक प्रत्यय को ‘उन लोगों’ से स्पष्ट किया गया है, जिसका संकेत पिछले पद में अब्नेर और उसके साथियों की ओर है।
- source_word: עַל בְּרֵכַת גִּבְעוֹן
  choice: गिबोन के जलकुंड के पास
  rationale: בְּרֵכָה निर्मित जलकुंड अथवा जलाशय हो सकता है; ‘जलकुंड’ दृश्य और संरचना दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: יַחְדָּו
  choice: वे सब वहाँ इकट्ठे हुए
  rationale: हिब्रू क्रियाविशेषण का आशय दोनों दलों के एक ही स्थान पर आमने-सामने आ जाने से है; अलग वाक्य हिन्दी में अस्पष्टता से बचाता है।
- source_word: וַ/יֵּשְׁבוּ אֵלֶּה ... וְ/אֵלֶּה
  choice: एक दल ... और दूसरा दल ... बैठ गया
  rationale: शाब्दिक ‘ये ... और वे’ के स्थान पर दोनों विरोधी समूहों का अंतर आधुनिक हिन्दी में स्पष्ट किया गया है, बिना किसी अतिरिक्त पहचान को जोड़े।
- source_word: עַל הַ/בְּרֵכָה מִ/זֶּה ... עַל הַ/בְּרֵכָה מִ/זֶּה
  choice: जलकुंड के एक ओर ... उसकी दूसरी ओर
  rationale: हिब्रू स्थान-सूचक मुहावरे का स्वाभाविक अर्थ जलकुंड की विपरीत ओरों पर बैठना है।
