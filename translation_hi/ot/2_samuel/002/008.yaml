source:
  edition: WLC
  text: וְ/אַבְנֵ֣ר בֶּן נֵ֔ר שַׂר צָבָ֖א אֲשֶׁ֣ר לְ/שָׁא֑וּל לָקַ֗ח אֶת אִ֥ישׁ בֹּ֨שֶׁת֙ בֶּן שָׁא֔וּל וַ/יַּעֲבִרֵ֖/הוּ מַחֲנָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/008.yaml
  text: But Abner son of Ner[a], the commander of Saul’s army, took Ish-bosheth son of Saul and brought him over to Mahanaim.
translation:
  language: hi
  text: परन्तु नेर के पुत्र अब्नेर ने, जो शाऊल की सेना का सेनापति था, शाऊल के पुत्र ईशबोशेत[a] को लिया और उसे महनैम ले गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 इतिहास 8:33 और 9:39 में ईशबोशेत को एशबाल कहा गया है।
    reason: इसी व्यक्ति के नाम का वैकल्पिक रूप अन्य बाइबलीय पाठों में सुरक्षित है।
lexical_decisions:
- source_word: וְ/אַבְנֵר
  choice: परन्तु ... अब्नेर
  rationale: וְ सामान्यतः ‘और’ है, पर यहाँ पिछले पद में दाऊद के अभिषेक के विपरीत घटनाक्रम आरम्भ होता है; इसलिए ‘परन्तु’ कथात्मक विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בֶּן נֵר
  choice: नेर के पुत्र
  rationale: हिब्रू संबंधसूचक संरचना का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: שַׂר צָבָא אֲשֶׁר לְ/שָׁאוּל
  choice: जो शाऊल की सेना का सेनापति था
  rationale: שַׂר צָבָא सैन्य प्रमुख को सूचित करता है; संबंधवाचक उपवाक्य मूल की संरचना और शाऊल से सेना के संबंध को बनाए रखता है।
- source_word: לָקַח
  choice: लिया
  rationale: क्रिया का मूल अर्थ ‘लेना’ है; प्रसंग किसी अधिक बलपूर्ण अर्थ, जैसे ‘पकड़ लिया’, को अनिवार्य नहीं करता।
- source_word: אִישׁ בֹּשֶׁת
  choice: ईशबोशेत
  rationale: WLC के व्यंजन-पाठ में दिए व्यक्ति-नाम का लिप्यंतरण; समान व्यक्ति के वैकल्पिक नाम ‘एशबाल’ को पादटिप्पणी में रखा गया है।
- source_word: וַ/יַּעֲבִרֵ/הוּ
  choice: उसे ... ले गया
  rationale: עבר के हिफ़ील रूप का अर्थ किसी को पार ले जाना अथवा उस पार पहुँचाना है। गंतव्य महनैम स्पष्ट है, पर पद मार्ग या नदी का उल्लेख नहीं करता; इसलिए हिन्दी में अनावश्यक भौगोलिक विवरण जोड़े बिना स्वाभाविक causative भाव रखा गया है।
- source_word: מַחֲנָיִם
  choice: महनैम
  rationale: स्थान-नाम का हिन्दी लिप्यंतरण।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज कथात्मक शैली अपनाई गई है। ‘परन्तु’ से पिछले पद के साथ विरोध स्पष्ट किया गया है; नामों का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
