source:
  edition: WLC
  text: וְ/עַתָּ֣ה תֶּחֱזַ֣קְנָה יְדֵי/כֶ֗ם וִֽ/הְיוּ֙ לִ/בְנֵי חַ֔יִל כִּי מֵ֖ת אֲדֹנֵי/כֶ֣ם שָׁא֑וּל וְ/גַם אֹתִ֗/י מָשְׁח֧וּ בֵית יְהוּדָ֛ה לְ/מֶ֖לֶךְ עֲלֵי/הֶֽם׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/007.yaml
  text: Let your hands be strong[a], and be valiant men, for your lord Saul is dead, and the house of Judah also has anointed me king over them.
translation:
  language: hi
  text: अब तुम्हारे हाथ दृढ़ हों[a], और तुम वीर पुरुष बनो; क्योंकि तुम्हारा स्वामी शाऊल मर गया है, और यहूदा के घराने ने मुझे भी उन पर राजा होने के लिए अभिषिक्त किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: “तुम्हारे हाथ दृढ़ हों।” यह हिब्रू मुहावरा साहस और सामर्थ्य का भाव व्यक्त करता है।'
    reason: हिब्रू की ठोस छवि और मुहावरेदार अर्थ को संक्षेप में स्पष्ट करता है, बिना अतिरिक्त अनुप्रयोग जोड़े।
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: וְעַתָּה में स्पष्ट रूप से ‘और/इसलिए’ तथा ‘अब’ दोनों हैं। प्रसंग में यह पिछले कथन से निष्कर्ष निकालते हुए आगे की प्रेरणा प्रस्तुत करता है, इसलिए ‘इसलिए अब’ स्वाभाविक और स्रोत-संगत है।
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  choice: तुम्हारे हाथ दृढ़ हों
  rationale: हिब्रू मुहावरे की ठोस छवि को बनाए रखता है और साहस तथा कार्य के लिए तत्परता व्यक्त करता है। इसका आशय केवल शारीरिक बल नहीं है।
- source_word: וִהְיוּ לִבְנֵי חַיִל
  choice: और तुम वीर पुरुष बनो
  rationale: בְּנֵי חַיִל साहस, सामर्थ्य और विशेषकर सैन्य योग्यता वाले पुरुषों को दर्शाता है। ‘वीर पुरुष’ आधुनिक हिन्दी में स्पष्ट है और मूल के पुल्लिंग बहुवचन को बनाए रखता है।
- source_word: כִּי מֵת אֲדֹנֵיכֶם שָׁאוּל
  choice: क्योंकि तुम्हारा स्वामी शाऊल मर गया है
  rationale: כִּי कारण प्रस्तुत करता है। אֲדֹנֵיכֶם यहाँ मानवीय राजनीतिक अधिपति के अर्थ में है, इसलिए ‘स्वामी’ उपयुक्त है।
- source_word: וְגַם אֹתִי מָשְׁחוּ בֵית יְהוּדָה
  choice: और यहूदा के घराने ने मुझे भी ... अभिषिक्त किया है
  rationale: ‘मुझे भी’ אֹתִי पर पड़े बल और גַם के योगात्मक अर्थ को सुरक्षित रखता है। ‘यहूदा का घराना’ सामूहिक वंशीय-राजनीतिक पदनाम को अक्षुण्ण रखता है।
- source_word: לְמֶלֶךְ עֲלֵיהֶם
  choice: अपने ऊपर राजा होने के लिए
  rationale: यह अभिषेक के उद्देश्य तथा उन पर दाऊद के राजकीय अधिकार, दोनों को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: לִבְנֵי חַיִל का लिंग और अर्थ
  choice: वीर पुरुष
  alternative: वीर बनो / साहसी लोग बनो
  rationale: मूल में पुल्लिंग बहुवचन है और प्रसंग शाऊल के पुरुष समर्थकों से संबोधन का है। ‘वीर पुरुष’ इस ऐतिहासिक और व्याकरणिक विशेषता को अनावश्यक रूप से तटस्थ नहीं करता।
- issue: אֲדֹנֵיכֶם का संबोधन
  choice: तुम्हारा स्वामी
  alternative: तुम्हारा प्रभु / तुम्हारा शासक
  rationale: यहाँ शब्द शाऊल के लिए राजनीतिक-सम्मानसूचक अर्थ में है, परमेश्वर के लिए उपाधि नहीं। ‘स्वामी’ इस भेद को स्वाभाविक हिन्दी में बनाए रखता है।
- issue: दाऊद के अभिषेक का कथन
  choice: यहूदा के घराने ने मुझे भी अपने ऊपर राजा होने के लिए अभिषिक्त किया है
  alternative: यहूदा के घराने ने भी मुझे अपने ऊपर राजा अभिषिक्त किया है
  rationale: गַם का निकट संबंध ‘मुझे’ से रखते हुए यह अनुवाद दाऊद को अभिषिक्त किए जाने की अतिरिक्त परिस्थिति पर बल देता है और यह अस्पष्ट दावा नहीं करता कि अभिषेक करने वाला घराना स्वयं भी किसी अन्य कर्ता के साथ जोड़ा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन के योग्य रखी गई है। ‘इसलिए अब’ मूल के וְעַתָּה को स्पष्ट रूप से दर्शाता है; इसे हटाना स्रोत में उपस्थित काल-सूचक तत्व को खो देता।
