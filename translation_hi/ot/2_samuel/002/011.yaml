  text: दाऊद हेब्रोन में यहूदा के घराने पर सात वर्ष और छः महीने तक राजा रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי מִסְפַּר הַיָּמִים
  choice: तक ... रहा
  rationale: शाब्दिक अर्थ ‘दिनों की संख्या थी’ है, पर यह इब्रानी मुहावरा अवधि बताता है। हिंदी में कालावधि के साथ ‘तक ... रहा’ स्वाभाविक और अर्थ-सटीक है।
- source_word: אֲשֶׁר הָיָה דָוִד מֶלֶךְ
  choice: दाऊद ... राजा रहा
  rationale: यह संबंधवाचक संरचना दाऊद के राजत्व की अवधि बताती है; हिंदी में यह संक्षिप्त और स्वाभाविक रूप है।
- source_word: בְּחֶבְרוֹן
  choice: हेब्रोन में
  rationale: पूर्वसर्ग ב यहाँ स्थान सूचित करता है।
- source_word: עַל בֵּית יְהוּדָה
  choice: यहूदा के घराने पर
  rationale: ‘घराने’ से בֵּית का सामूहिक भाव सुरक्षित रहता है और यह स्पष्ट होता है कि आशय यहूदा से संबद्ध समुदाय से है।
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: सात वर्ष और छः महीने
  rationale: मूल में दी गई अवधि का सीधा और स्वाभाविक अनुवाद।
