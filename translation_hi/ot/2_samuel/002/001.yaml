base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/001.yaml
  text: After this[a], David inquired of Yahweh, saying, “Shall I go up into one of the cities of Judah?” And Yahweh said to him, “Go up.” Then David said, “Where shall I go up?” And he said, “To Hebron.”
translation:
  language: hi
  text: इसके बाद दाऊद ने याहवे[a] से पूछा, “क्या मैं यहूदा के नगरों में से किसी एक में जाऊँ?” याहवे ने उससे कहा, “जाओ।” तब दाऊद ने पूछा, “मैं कहाँ जाऊँ?” उसने कहा, “हेब्रोन।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “YHWH”; परंपरागत रूप से “प्रभु” अनुवाद किया जाता है।'
    reason: ईश्वरीय नाम के इब्रानी मूल रूप और उसके पारंपरिक अनुवाद की जानकारी।
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह इब्रानी कथात्मक सूत्र पिछले घटनाक्रम के बाद का समय बताता है। ‘इसके बाद’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: यहोवा से मार्गदर्शन पूछा
  rationale: שׁאל के साथ ב और परमेश्वर का नाम यहाँ केवल प्रश्न पूछने के बजाय ईश्वरीय दिशा जानने का भाव देता है। यह प्रयोग उस आशय को सामान्य हिन्दी में स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में प्रयुक्त व्यक्तिगत ईश्वरीय नाम YHWH को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है; इसे केवल पदवी ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- source_word: הַאֶעֱלֶה / עֲלֵה
  choice: क्या मैं ... जाऊँ? / जा
  rationale: עלה में ऊँचाई की ओर जाने का भौगोलिक संकेत हो सकता है, पर आधुनिक हिन्दी में इस गंतव्य के लिए ‘जाना’ अधिक स्वाभाविक है। प्रश्न और उत्तर में एक ही क्रिया का संबंध बनाए रखा गया है।
- source_word: בְּאַחַת עָרֵי יְהוּדָה
  choice: यहूदा के नगरों में से किसी एक में
  rationale: वाक्यांश यहूदा के अनेक नगरों में से एक नगर की ओर जाने और उसमें प्रवेश करने का भाव देता है।
- source_word: אָנָה
  choice: कहाँ
  rationale: यह शब्द गंतव्य पूछता है; ‘मैं कहाँ जाऊँ?’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: חֶבְרֹנָה
  choice: हेब्रोन
  rationale: स्थान-नाम के साथ लगा दिशासूचक ה उस ओर जाने का अर्थ देता है, जो हिन्दी संवाद में प्रश्न ‘कहाँ जाऊँ?’ के उत्तर ‘हेब्रोन’ से स्पष्ट हो जाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में चतुरक्षरी व्यक्तिगत नाम है। हिन्दी पाठकों के बीच स्थापित रूप ‘यहोवा’ व्यक्तिगत नाम को सुरक्षित रखता है; पादटिप्पणी मूल व्यंजन YHWH और वैकल्पिक उच्चारण ‘याहवे’ बताती है।
- issue: दाऊद के पूछने का स्वरूप
  choice: मार्गदर्शन पूछा
  alternative: पूछा; परामर्श लिया
  rationale: इस प्रयोग में दाऊद ईश्वरीय निर्देशन चाहता है। ‘मार्गदर्शन पूछा’ इस संदर्भगत अर्थ को व्यक्त करता है, पर उत्तर पाने की विधि के विषय में मूल से अधिक कुछ नहीं कहता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण कथात्मक हिन्दी। छोटे प्रत्यक्ष संवाद मूल की गति और क्रियाओं की पुनरावृत्ति को यथासंभव बनाए रखते हैं।
