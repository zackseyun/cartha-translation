  language: hi
  text: परन्तु[a] दाऊद के सेवकों ने बिन्यामीन के लोगों और अब्नेर के लोगों पर प्रहार किया, और उनमें से तीन सौ साठ पुरुष मर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘और’। इब्रानी संयोजक का सामान्य अर्थ ‘और’ है; मुख्य पाठ में पिछले पद में बताई गई हानि के विपरीत को दिखाने के लिए ‘परन्तु’ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַבְדֵי דָוִד
  choice: परन्तु दाऊद के सेवकों ने
  rationale: आरम्भिक וְ सामान्यतः ‘और’ है, पर पिछले पद में दाऊद के पक्ष की हानि के विपरीत यहाँ दूसरे पक्ष की हानि बताई गई है; इसलिए ‘परन्तु’ प्रसंगगत विरोध को स्वाभाविक रूप से व्यक्त करता है। עַבְדֵי युद्ध में दाऊद की सेवा करने वाले लोगों को दर्शाता है, इसलिए ‘सेवकों’ उपयुक्त है।
- source_word: הִכּוּ
  choice: प्रहार किया
  rationale: נכה का मूल अर्थ मारना या प्रहार करना है। अलग क्रिया מֵתוּ मृत्यु का परिणाम स्पष्ट करती है, इसलिए दोनों क्रियाओं को एक ही ‘मार डाला’ में नहीं समेटा गया।
- source_word: מִ/בִּנְיָמִן וּ/בְ/אַנְשֵׁי אַבְנֵר
  choice: बिन्यामीन के लोगों और अब्नेर के आदमियों में से
  rationale: बिन्यामीन यहाँ गोत्र के लोगों का द्योतक है। दोनों पदबंध उन समूहों को बताते हैं जिनमें से हताहत हुए; हिन्दी में समानांतर ‘में से’ स्वाभाविक है।
- source_word: שְׁלֹשׁ מֵאוֹת וְ/שִׁשִּׁים אִישׁ
  choice: 360 पुरुषों
  rationale: संख्या और युद्धरत वयस्क पुरुषों के संदर्भ को सीधे व्यक्त किया गया है।
- source_word: מֵתוּ
  choice: और वे मर गए
  rationale: इब्रानी पाठ मृत्यु को הִכּוּ से अलग क्रिया द्वारा स्पष्ट रूप से कहता है; अनुवाद इस कथन को बनाए रखता है।
