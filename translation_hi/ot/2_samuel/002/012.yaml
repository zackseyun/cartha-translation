  text: וַ/יֵּצֵא֙ אַבְנֵ֣ר בֶּן נֵ֔ר וְ/עַבְדֵ֖י אִֽישׁ בֹּ֣שֶׁת בֶּן שָׁא֑וּל מִֽ/מַּחֲנַ֖יִם גִּבְעֽוֹנָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/012.yaml
  text: Then Abner son of Ner[a], and the servants of Ish-bosheth son of Saul, went out from Mahanaim to Gibeon.
translation:
  language: hi
  text: तब नेर का पुत्र अब्नेर और शाऊल के पुत्र ईशबोशेत[a] के सेवक महनैम से गिबोन की ओर निकले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसी व्यक्ति को 1 इतिहास 8:33 और 9:39 में ‘एशबाल’ कहा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: तब ... निकले
  rationale: वाव-परिणामी कथा को आगे बढ़ाता है, इसलिए ‘तब’ स्वाभाविक है। इब्रानी क्रिया एकवचन है, पर उसके बाद अब्नेर और सेवकों का संयुक्त कर्ता आता है; अतः स्वाभाविक हिन्दी में बहुवचन ‘निकले’ रखा गया है।
- source_word: אַבְנֵר בֶּן נֵר
  choice: नेर का पुत्र अब्नेर
  rationale: व्यक्तिनामों का देवनागरी लिप्यंतरण किया गया है और पितृनाम-संबंध को स्वाभाविक हिन्दी क्रम में व्यक्त किया गया है।
- source_word: וְעַבְדֵי
  choice: और ... के सेवक
  rationale: עֶבֶד का मूल अर्थ ‘सेवक’ है। यहाँ सैन्य-राजनीतिक प्रसंग होने पर भी ‘सेवक’ मूल शब्द का संबंध बनाए रखता है और उनकी विशिष्ट पदवी अनावश्यक रूप से तय नहीं करता।
- source_word: אִישׁ בֹּשֶׁת
  choice: ईशबोशेत
  rationale: मसोरेटी पाठ में यही नाम है। इतिहास की पुस्तक में सुरक्षित वैकल्पिक रूप ‘एशबाल’ को पादटिप्पणी में बताया गया है।
- source_word: בֶּן שָׁאוּל
  choice: शाऊल के पुत्र
  rationale: यह पितृनाम-सूचक वाक्यांश ईशबोशेत की पहचान बताता है; हिन्दी में संबंधकारक के साथ स्वाभाविक रूप से रखा गया है।
- source_word: מִמַּחֲנַיִם
  choice: महनैम से
  rationale: उपसर्ग מִן प्रस्थान-बिंदु बताता है और उसका अनुवाद ‘से’ किया गया है; स्थाननाम का लिप्यंतरण ‘महनैम’ है।
- source_word: גִּבְעֹנָה
  choice: गिबोन को
  rationale: स्थाननाम से जुड़ा दिशासूचक ה गिबोन की ओर गति दर्शाता है। ‘गिबोन को निकले’ गंतव्य को स्पष्ट करते हुए हिन्दी में स्वाभाविक है।
