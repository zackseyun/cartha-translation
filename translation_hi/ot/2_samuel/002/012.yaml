translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। नामों का देवनागरी में प्रचलित बाइबलीय लिप्यंतरण किया गया है। पादटिप्पणी-चिह्न उस नाम के बाद रखा गया है जिससे टिप्पणी वास्तव में संबंधित है।
