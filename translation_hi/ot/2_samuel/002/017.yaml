translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। इब्रानी सैन्य मुहावरे ‘के सामने पराजित हुए’ को स्वाभाविक हिन्दी ‘से हार गए’ में व्यक्त किया गया है, जबकि עַבְדֵי का ‘सेवक’ रूप मुख्य पाठ में सुरक्षित है।
