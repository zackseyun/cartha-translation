  text: וַ/תְּהִ֧י הַ/מִּלְחָמָ֛ה קָשָׁ֥ה עַד מְאֹ֖ד בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יִּנָּ֤גֶף אַבְנֵר֙ וְ/אַנְשֵׁ֣י יִשְׂרָאֵ֔ל לִ/פְנֵ֖י עַבְדֵ֥י דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/017.yaml
  text: The battle was very fierce that day[b][a], and Abner and the men of Israel were defeated before the servants of David.
translation:
  language: hi
  text: उस दिन युद्ध बहुत ही भयंकर हुआ, और अब्नेर तथा इस्राएल के लोग दाऊद के सेवकों[a] से हार गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “दाऊद के सेवकों” से आशय दाऊद के अधीन लड़ने वाले लोगों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּלְחָמָה
  choice: युद्ध
  rationale: यहाँ מִלְחָמָה किसी लंबे युद्ध-अभियान के बजाय उस दिन की विशेष मुठभेड़ को दर्शाता है; हिन्दी में ‘युद्ध’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: קָשָׁה עַד מְאֹד
  choice: बहुत ही भयंकर
  rationale: קָשָׁה का मूल भाव ‘कठिन/कड़ा/भीषण’ है और עַד מְאֹד अत्यधिक तीव्रता बताता है। युद्ध के लिए ‘बहुत ही भयंकर’ सहज हिन्दी में इस तीव्रता को व्यक्त करता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह सामान्य कालवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: וַיִּנָּגֶף
  choice: हार गए
  rationale: निफ़अल रूप युद्ध के प्रसंग में शत्रु के सामने पराजित होने का अर्थ देता है। ‘हार गए’ सामान्य आधुनिक हिन्दी में सामरिक पराजय स्पष्ट करता है।
- source_word: אַבְנֵר
  choice: अब्नेर
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וְאַנְשֵׁי יִשְׂרָאֵל
  choice: तथा इस्राएल के लोग
  rationale: אַנְשֵׁי का शाब्दिक अर्थ ‘लोग/पुरुष’ है। प्रसंग इन्हें युद्धरत दल के रूप में पहचानता है, पर मूल में ‘सैनिक’ नहीं है; इसलिए ‘लोग’ स्रोत की व्यापकता बनाए रखता है।
- source_word: לִפְנֵי
  choice: से
  rationale: सैन्य पराजय के साथ हिन्दी में ‘से हार गए’ स्वाभाविक रूप से उसी संबंध को व्यक्त करता है जिसे इब्रानी לִפְנֵי (‘के सामने’) दर्शाता है।
- source_word: עַבְדֵי דָוִד
  choice: दाऊद के सेवकों
  rationale: עֶבֶד का औपचारिक रूप ‘सेवक’ है; यहाँ इसका आशय दाऊद की सेवा में रहने वाले सैन्य अनुचरों या लड़ाकों से है, जिसे पादटिप्पणी स्पष्ट करती है।
