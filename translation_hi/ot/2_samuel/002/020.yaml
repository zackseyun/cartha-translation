  text: तब अब्नेर ने पीछे मुड़कर कहा, “क्या तुम असाहेल हो?” उसने कहा, “मैं हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֶן
  choice: मुड़कर
  rationale: פנה का मूल अर्थ ‘मुड़ना’ है; पीछा किए जाने के इस प्रसंग में ‘मुड़कर’ स्वाभाविक और सटीक है।
- source_word: אַחֲרָיו
  choice: पीछे
  rationale: यह स्थान-सूचक पद अब्नेर के अपने पीछे की दिशा बताता है; ‘पीछे मुड़कर’ आधुनिक हिन्दी में स्वाभाविक रूप से पूरा भाव व्यक्त करता है।
- source_word: הֲאַתָּה זֶה
  choice: क्या तुम ही ... हो?
  rationale: सर्वनाम और संकेतवाचक का यह मेल पहचान सुनिश्चित करने वाला प्रश्न है; ‘तुम ही’ हिन्दी में उस पहचान-संबंधी बल को सहज ढंग से बनाए रखता है।
- source_word: עֲשָׂהאֵל
  choice: असाहेल
  rationale: व्यक्तिनाम को उसके इब्रानी रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: אָנֹכִי
  choice: हाँ, मैं ही हूँ
  rationale: स्वतंत्र सर्वनाम यहाँ आत्म-पहचान का पूरा उत्तर है। हिन्दी संवाद में ‘हाँ’ प्रश्न की पुष्टि को स्वाभाविक बनाता है और ‘मैं ही हूँ’ אָנֹכִי के बल को व्यक्त करता है।
