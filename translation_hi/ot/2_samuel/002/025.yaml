  text: וַ/יִּֽתְקַבְּצ֤וּ בְנֵֽי בִנְיָמִן֙ אַחֲרֵ֣י אַבְנֵ֔ר וַ/יִּהְי֖וּ לַ/אֲגֻדָּ֣ה אֶחָ֑ת וַ/יַּ֣עַמְד֔וּ עַ֥ל רֹאשׁ גִּבְעָ֖ה אֶחָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/025.yaml
  text: Then the sons of Benjamin gathered together behind Abner[a], became one band[b], and took their stand on the top of one hill.
translation:
  language: hi
  text: तब बिन्यामीन के वंशज अब्नेर के पीछे[a] इकट्ठे हुए, एक दल[b] बन गए और एक पहाड़ी की चोटी पर डटकर खड़े हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अब्नेर का अनुसरण करते हुए।” इब्रानी पदबंध स्थान की दृष्टि से “पीछे” अथवा निष्ठा और नेतृत्व की दृष्टि से “के पीछे चलना” व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “एक जत्था” अथवा “एक समूह।” इब्रानी शब्द एक साथ संगठित हुए दल को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: इकट्ठे हुए
  rationale: हित्पाएल रूप सामूहिक रूप से एकत्र होने का भाव देता है; युद्ध के इस प्रसंग में यह स्वाभाविक और स्पष्ट है।
- source_word: בְנֵי בִנְיָמִן
  choice: बिन्यामीन के वंशज
  rationale: शाब्दिक अर्थ ‘बिन्यामीन के पुत्र’ है, पर आधुनिक हिन्दी में जनजातीय पहचान के लिए ‘वंशज’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: אַחֲרֵי אַבְנֵר
  choice: अब्नेर के पीछे
  rationale: यह पदबंध स्थान की दृष्टि से ‘पीछे’ और निष्ठा या नेतृत्व की दृष्टि से ‘अनुसरण करते हुए’—दोनों अर्थ दे सकता है; मुख्य पाठ में स्थानगत चित्र रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: לַאֲגֻדָּה אֶחָת
  choice: एक दल
  rationale: אֲגֻדָּה एक साथ बँधे या संगठित समूह को दर्शाता है; युद्ध-वृत्तांत में ‘दल’ संक्षिप्त और स्वाभाविक है।
- source_word: וַיַּעַמְדוּ
  choice: डटकर खड़े हो गए
  rationale: यहाँ עמד केवल खड़े होने की मुद्रा नहीं, बल्कि युद्ध में मोर्चा लेने या स्थिर होकर सामना करने का भाव रखता है।
- source_word: עַל רֹאשׁ גִּבְעָה אֶחָת
  choice: एक पहाड़ी की चोटी पर
  rationale: स्थलाकृतिक प्रयोग में רֹאשׁ का अर्थ ‘चोटी’ है; ‘एक पहाड़ी’ इब्रानी के אֶחָת को भी बनाए रखता है।
