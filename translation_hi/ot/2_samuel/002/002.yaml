base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/002.yaml
  text: 'So David went up there[a], and also his two wives: Ahinoam the Jezreelite and Abigail, the wife of Nabal the Carmelite.'
translation:
  language: hi
  text: तब दाऊद वहाँ ऊपर गया, और उसकी दोनों पत्नियाँ भी गईं—यिज्रेल की अहीनोअम और कर्मेलवासी नाबाल की पत्नी अबीगैल।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संदर्भ में अबीगैल दाऊद की पत्नी है; फिर भी इब्रानी पाठ उसकी पहचान ‘नाबाल की पत्नी’ के रूप में करता है और नाबाल को कर्मेलवासी बताता है।
    reason: historical_clarification
lexical_decisions:
- source_word: וַיַּעַל שָׁם
  choice: वहाँ गया
  rationale: עלה में ऊपर जाने का भाव हो सकता है, पर हिन्दी में इस यात्रा-वर्णन के लिए ‘वहाँ गया’ स्वाभाविक है; ‘ऊपर गया’ यहाँ अनावश्यक रूप से भौगोलिक दिशा पर बल दे सकता है।
- source_word: וְגַם שְׁתֵּי נָשָׁיו
  choice: और उसकी दोनों पत्नियाँ भी उसके साथ गईं
  rationale: ‘भी’ וְגַם का योगात्मक भाव व्यक्त करता है। हिन्दी में स्पष्ट और सहज वाक्य के लिए निहित क्रिया तथा ‘उसके साथ’ जोड़े गए हैं।
- source_word: אֲחִינֹעַם הַיִּזְרְעֵלִית
  choice: यिज्रेली अहीनोअम
  rationale: जातिवाचक विशेषण स्त्री के यिज्रेल से संबंध या मूल को बताता है; ‘यिज्रेली’ स्रोत की संक्षिप्त शैली बनाए रखता है।
- source_word: וַאֲבִיגַיִל אֵשֶׁת נָבָל הַכַּרְמְלִי
  choice: और कर्मेली नाबाल की पत्नी अबीगैल
  rationale: הַכַּרְמְלִי व्याकरणतः नाबाल का विशेषण है और उसे कर्मेल से संबंधित बताता है। ‘नाबाल की पत्नी’ स्रोत में प्रयुक्त पहचान को बनाए रखता है, यद्यपि इस समय अबीगैल दाऊद की पत्नी थी।
theological_decisions:
- issue: अबीगैल को ‘नाबाल की पत्नी’ कहना
  choice: स्रोत की ऐतिहासिक पहचान को मुख्य पाठ में बनाए रखा गया
  alternative: ‘नाबाल की विधवा’ या ‘पहले नाबाल की पत्नी’
  rationale: इब्रानी पाठ केवल אֵשֶׁת נָבָל कहता है। ‘विधवा’ या ‘पहले’ अर्थ की दृष्टि से संदर्भानुकूल हैं, लेकिन वे स्रोत में स्पष्ट रूप से उपस्थित नहीं हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। नामों के रूप प्रचलित हिन्दी बाइबलीय वर्तनी के निकट हैं। ‘कर्मेली नाबाल’ से इब्रानी विशेषण का संबंध नाबाल के साथ स्पष्ट होता है।
