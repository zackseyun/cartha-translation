  yaml_path: translation/ot/2_samuel/002/032.yaml
  text: They carried Asahel and buried him in his father's tomb[a], which was at Bethlehem. Then Joab and his men traveled all night[b], and daybreak came upon them at Hebron.
translation:
  language: hi
  text: वे असाहेल को ले गए और उसे उसके पिता की कब्र[a] में दफनाया, जो बैतलहम में थी। फिर योआब और उसके लोग रात भर चलते रहे, और हेब्रोन में उनके लिए भोर हो गई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके पिता की समाधि में।” इब्रानी शब्द קֶבֶר किसी कब्र अथवा समाधि/पारिवारिक कब्रगाह को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “हेब्रोन में उन पर भोर हुई।” इब्रानी मुहावरे का शाब्दिक अर्थ है, “हेब्रोन में उनके लिए उजाला हो गया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: उठाकर ले गए
  rationale: क्रिया נשׂא यहाँ असाहेल के शव को दफनाने के लिए उठाकर ले जाने को व्यक्त करती है; यह हिंदी में स्वाभाविक है और केवल ‘उठाया’ से अधिक स्पष्ट है।
- source_word: עֲשָׂהאֵל
  choice: असाहेल
  rationale: व्यक्तिनाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
- source_word: וַיִּקְבְּרֻהוּ
  choice: उसे ... दफनाया
  rationale: קבר की सामान्य क्रिया का स्पष्ट और वर्तमान हिंदी रूप।
- source_word: בְּקֶבֶר אָבִיו
  choice: उसके पिता की कब्र में
  rationale: קֶבֶר ‘कब्र’ या ‘समाधि/कब्रगाह’ हो सकता है। मुख्य पाठ में सामान्य और सुबोध ‘कब्र’ रखा गया है तथा वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: אֲשֶׁר בֵּית לָחֶם
  choice: जो बैतलहम में थी
  rationale: संबंधवाचक उपवाक्य कब्र का स्थान बताता है; हिंदी में स्पष्टता के लिए स्त्रीलिंग क्रिया जोड़ी गई है।
- source_word: וַיֵּלְכוּ כָל הַלַּיְלָה
  choice: रात भर चलते रहे
  rationale: הלך व्यापक रूप से चलने/जाने को दर्शाता है। ‘चलते रहे’ निरंतर रात्रिकालीन यात्रा बताता है, बिना ‘कूच’ जैसे सैन्य अर्थ को अनावश्यक रूप से निश्चित किए।
- source_word: יוֹאָב וַאֲנָשָׁיו
  choice: योआब और उसके लोग
  rationale: אֲנָשָׁיו का सीधा अर्थ ‘उसके लोग/पुरुष’ है; सैन्य संदर्भ कायम रहता है, पर ‘सैनिक’ जोड़कर अर्थ सीमित नहीं किया गया।
- source_word: וַיֵּאֹר לָהֶם
  choice: उनके लिए भोर हो गई
  rationale: इब्रानी मुहावरे का निकट और सुबोध रूप, जिसका शाब्दिक भाव ‘उनके लिए उजाला हुआ’ है।
- source_word: בְּחֶבְרוֹן
  choice: हेब्रोन पहुँचते-पहुँचते
  rationale: स्थानसूचक בְ को कथानक में गंतव्य/आगमन के भाव के साथ स्वाभाविक हिंदी में व्यक्त किया गया है; मूल का आशय है कि हेब्रोन में उनके लिए उजाला हुआ।
