id: 2SA.2.5
reference: 2 Samuel 2:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח דָּוִד֙ מַלְאָכִ֔ים אֶל אַנְשֵׁ֖י יָבֵ֣ישׁ גִּלְעָ֑ד וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם בְּרֻכִ֤ים אַתֶּם֙ לַֽ/יהוָ֔ה אֲשֶׁ֨ר עֲשִׂיתֶ֜ם הַ/חֶ֣סֶד הַ/זֶּ֗ה עִם אֲדֹֽנֵי/כֶם֙ עִם שָׁא֔וּל וַֽ/תִּקְבְּר֖וּ אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/005.yaml
  text: Then David sent messengers to the men of Jabesh-gilead and said to them[a], “Blessed are you by Yahweh, because you have shown this kindness to your lord, to Saul[b], and have buried him.”
translation:
  language: hi
  text: तब दाऊद ने याबेश-गिलाद के पुरुषों के पास संदेशवाहक भेजकर उनसे कहा, “याहवे की ओर से तुम धन्य हो,[a] क्योंकि तुमने अपने स्वामी शाऊल के प्रति यह निष्ठापूर्ण भलाई[b] की और उसे दफनाया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे तुम्हें आशीष दे।” इब्रानी अभिव्यक्ति धन्य होने का कथन है, पर आशीर्वचन के रूप में भी समझी जा सकती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द ख़ेसेद है; संदर्भ के अनुसार इसका अर्थ भलाई, निष्ठा, कृपा या अटल प्रेम हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  choice: संदेशवाहक
  rationale: कथा के इस प्रसंग में यह शब्द दाऊद द्वारा भेजे गए मानवीय प्रतिनिधियों को दर्शाता है; ‘संदेशवाहक’ अर्थ को स्पष्ट रखता है और स्वर्गदूत का अनुचित बोध नहीं कराता।
- source_word: אַנְשֵׁי יָבֵישׁ גִּלְעָד
  choice: याबेश-गिलाद के पुरुष
  rationale: इब्रानी पदबंध स्पष्ट रूप से पुल्लिंग बहुवचन ‘पुरुषों’ का है; स्थान-नाम को याबेश-गिलाद के रूप में लिप्यंतरित किया गया है।
- source_word: בְּרֻכִים אַתֶּם לַיהוָה
  choice: याहवे की ओर से तुम धन्य हो
  rationale: निष्क्रिय कृदंत בְּרֻכִים को कथनात्मक ‘धन्य हो’ से व्यक्त किया गया है, केवल इच्छा के रूप में नहीं। לַיהוָה को यहाँ आशीष के स्रोत के अर्थ में स्वाभाविक हिन्दी ‘याहवे की ओर से’ कहा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम चतुरक्षरी יהוה को किसी उपाधि से बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: חֶסֶד
  choice: निष्ठापूर्ण भलाई
  rationale: यहाँ חֶסֶד शाऊल को दफनाने में दिखाई गई ठोस भलाई के साथ निष्ठा का भाव भी रखता है; यह अनुवाद दोनों पहलुओं को संक्षेप में बनाए रखता है।
- source_word: אֲדֹנֵיכֶם
  choice: अपने स्वामी
  rationale: यह शब्द शाऊल के साथ प्रजा के राजनीतिक और आदरसूचक संबंध को दर्शाता है; ‘स्वामी’ इस संदर्भ में ‘प्रभु’ से कम अस्पष्ट है।
- source_word: עִם שָׁאוּל
  choice: शाऊल के प्रति
  rationale: עִם का मूल अर्थ ‘के साथ’ है, पर חֶסֶד करने के संदर्भ में आधुनिक हिन्दी में ‘के प्रति’ अपेक्षित संबंध को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַתִּקְבְּרוּ אֹתוֹ
  choice: और उसे दफनाया
  rationale: यह पूर्ण हो चुकी वह क्रिया है जिसमें उनकी निष्ठापूर्ण भलाई प्रकट हुई; सरल भूतकाल हिन्दी कथन में स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: בְּרֻכִים אַתֶּם का कथन या आशीर्वचनात्मक इच्छा होना
  choice: तुम धन्य हो
  alternative: तुम्हें आशीष मिले
  rationale: בְּרֻכִים निष्क्रिय कृदंत है और सीधे तौर पर उनकी धन्य स्थिति बताता है, यद्यपि पूरे सूत्र में आशीर्वचनात्मक बल भी सुना जा सकता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- issue: חֶסֶד में भलाई और निष्ठा का संबंध
  choice: निष्ठापूर्ण भलाई
  alternative: कृपा; भलाई; निष्ठा
  rationale: इस कार्य में शाऊल के प्रति निष्ठा और उसके शव को सम्मानपूर्वक दफनाने की भलाई दोनों निहित हैं; किसी एक पहलू तक अर्थ को सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘दफनाया’ सामान्य पाठकों के लिए स्वाभाविक है; ‘निष्ठापूर्ण भलाई’ मूल शब्द חֶסֶד की अर्थ-व्याप्ति को अत्यधिक तकनीकी भाषा के बिना सामने लाता है। सभी पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद दिए गए हैं।
