base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/027.yaml
  text: Joab said[a], “As God lives, if you had not spoken, then from the morning the people would have gone up[b], each from following his brother.”
translation:
  language: hi
  text: योआब ने कहा, “जैसे परमेश्वर जीवित है, यदि तुमने न कहा होता, तो सुबह से ही लोग लौट गए होते[a]—हर एक अपने भाई का पीछा छोड़कर।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “ऊपर चले गए होते।”
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי הָאֱלֹהִים
  choice: जीवित परमेश्वर की शपथ
  rationale: यह इब्रानी का प्रचलित शपथ-सूत्र है। हिंदी में यह अभिव्यक्ति उसके आशय और गंभीरता को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: לוּלֵא דִּבַּרְתָּ
  choice: यदि तुम न बोले होते
  rationale: לוּלֵא यहाँ एक अवास्तविक प्रतिकूल शर्त प्रस्तुत करता है। क्रिया का कर्म इब्रानी की तरह अनकहा रखा गया है।
- source_word: כִּי אָז
  choice: तो
  rationale: दोनों अव्यय मिलकर शर्त के परिणाम को प्रस्तुत करते हैं; हिंदी में ‘तो’ इसे स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: מֵהַבֹּקֶר
  choice: सुबह से ही
  rationale: पूर्वसर्ग מִן के आरंभ-बिंदु वाले मूल अर्थ को बनाए रखते हुए यह आधुनिक हिंदी में स्वाभाविक है।
- source_word: נַעֲלָה
  choice: लौट गए होते
  rationale: עלה का मूल अर्थ ‘ऊपर जाना’ है, पर इस सैनिक प्रसंग में इसका संकेत पीछा छोड़कर चले जाने या लौटने की ओर है। मुख्य पाठ में प्रसंगानुकूल अर्थ रखा गया है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: אִישׁ מֵאַחֲרֵי אָחִיו
  choice: हर एक अपने भाई का पीछा छोड़कर
  rationale: शाब्दिक चित्र ‘हर एक अपने भाई के पीछे से’ है। युद्ध के प्रसंग में यह अपने साथी इस्राएली का पीछा करना बंद करने को दर्शाता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। शपथ-सूत्र की गंभीरता बनाए रखी गई है; सैन्य प्रसंग में अस्पष्ट पड़ने वाले ‘ऊपर जाना’ को मुख्य पाठ में प्रसंगानुकूल ‘लौटना’ कहा गया है, जबकि उसका शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
