  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֕ה יַֽעַשׂ יְהוָ֥ה עִמָּ/כֶ֖ם חֶ֣סֶד וֶ/אֱמֶ֑ת וְ/גַ֣ם אָנֹכִ֗י אֶעֱשֶׂ֤ה אִתְּ/כֶם֙ הַ/טּוֹבָ֣ה הַ/זֹּ֔את אֲשֶׁ֥ר עֲשִׂיתֶ֖ם הַ/דָּבָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/006.yaml
  text: And now may Yahweh show you steadfast love and faithfulness[a]. And I also will do this good to you[c][b], because you have done this thing.
translation:
  language: hi
  text: और अब यहोवा आपके प्रति अटल प्रेम और विश्वासयोग्यता दिखाए।[a] और मैं भी आपके लिए यह भलाई करूँगा,[b] क्योंकि आपने यह काम किया है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और अब यहोवा आपके प्रति अटल प्रेम और विश्वासयोग्यता दिखाएगा।” इब्रानी क्रिया को आशीर्वाद की कामना या भविष्य के कथन के रूप में समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या “मैं भी आपके लिए यह उपकार करूँगा।” इब्रानी में शाब्दिक रूप से “यह भलाई” है।
    reason: lexical_alternative
  - marker: c
    text: “यह काम” पिछले पद में बताए गए शाऊल को दफनाने के काम को सूचित करता है।
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में प्रचलित लिप्यंतरण से व्यक्त किया गया है।
- source_word: יַעַשׂ ... חֶסֶד וֶאֱמֶת
  choice: अटल प्रेम और विश्वासयोग्यता का व्यवहार करे
  rationale: यह मुहावरेदार हिन्दी में दोनों गुणों को यहोवा के व्यवहार के रूप में व्यक्त करता है; חֶסֶד की स्थिर निष्ठा और אֱמֶת की भरोसेमंद विश्वसनीयता सुरक्षित रहती है।
- source_word: עִמָּכֶם
  choice: आपके साथ
  rationale: मूल के संबंधसूचक भाव को बनाए रखता है और हिन्दी में ‘व्यवहार करना’ के साथ स्वाभाविक है।
- source_word: וְגַם אָנֹכִי
  choice: और मैं भी
  rationale: גם और बलाघाती אָנֹכִי दोनों का योगात्मक तथा व्यक्तिगत बल सुरक्षित है।
- source_word: הַטּוֹבָה הַזֹּאת
  choice: यह भलाई
  rationale: मूल का शाब्दिक अर्थ ‘यह भलाई’ है; इसे ‘कृपा’ या ‘दयालुता’ कहने से पहले आए חֶסֶד के साथ अनावश्यक रूप से अर्थ मिला दिया जाता।
- source_word: אֲשֶׁר עֲשִׂיתֶם הַדָּבָר הַזֶּה
  choice: क्योंकि आपने यह काम किया है
  rationale: संदर्भ में यह दाऊद की प्रत्युत्तर-भलाई का कारण बताता है और पिछले पद में शाऊल को दफनाने की ओर संकेत करता है।
theological_decisions:
- issue: יַעַשׂ का विधिलिंगात्मक या साधारण भविष्य अर्थ
  choice: 'आशीर्वचन/कामना: ‘व्यवहार करे’'
  alternative: 'भविष्य कथन: ‘व्यवहार करेगा’'
  rationale: दाऊद के आशीर्वाद के संदर्भ में विधिलिंगात्मक अर्थ अधिक उपयुक्त है, पर इब्रानी अपूर्ण क्रिया का भविष्यसूचक पाठ भी संभव है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सम्मानसूचक और गरिमापूर्ण रखी गई है। ‘अटल प्रेम’ तथा ‘विश्वासयोग्यता’ सामान्य पाठक के लिए स्पष्ट रहते हुए मूल के संबंधपरक और निष्ठापूर्ण भाव को व्यक्त करते हैं।
