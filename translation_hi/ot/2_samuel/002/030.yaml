  text: וְ/יוֹאָ֗ב שָׁ֚ב מֵ/אַחֲרֵ֣י אַבְנֵ֔ר וַ/יִּקְבֹּ֖ץ אֶת כָּל הָ/עָ֑ם וַ/יִּפָּ֨קְד֜וּ מֵ/עַבְדֵ֥י דָוִ֛ד תִּשְׁעָֽה עָשָׂ֥ר אִ֖ישׁ וַ/עֲשָׂה אֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/030.yaml
  text: And Joab returned from pursuing Abner[a], and he gathered all the people. When they were counted, nineteen men of David’s servants were missing, besides Asahel.
translation:
  language: hi
  text: तब योआब अब्नेर का पीछा छोड़कर लौट आया और उसने अपने सभी लोगों को इकट्ठा किया। गिनती करने पर दाऊद के सेवकों में से उन्नीस पुरुष और असाहेल[a] कम पाए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “उन्नीस पुरुष और असाहेल।” अर्थात् असाहेल उन उन्नीस के अतिरिक्त था।'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב מֵאַחֲרֵי אַבְנֵר
  choice: अब्नेर का पीछा छोड़कर लौट आया
  rationale: शाब का मूल अर्थ ‘लौटना’ है और ‘अब्नेर के पीछे से’ युद्ध के प्रसंग में उसका पीछा करना बंद करके लौटने को दर्शाता है। यह हिन्दी में आशय को स्वाभाविक और स्पष्ट रखता है।
- source_word: וַיִּקְבֹּץ אֶת כָּל הָעָם
  choice: उसने अपने सभी लोगों को इकट्ठा किया
  rationale: आम का मूल अर्थ ‘लोग’ है; प्रसंग में ये योआब के साथ लड़ने वाले लोग हैं। ‘अपने सभी लोगों’ से मूल शब्द की व्यापकता और सैन्य संदर्भ दोनों बने रहते हैं।
- source_word: וַיִּפָּקְדוּ
  choice: गिनती करने पर ... कम पाए गए
  rationale: निफ़अल रूप यहाँ गणना के बाद अनुपस्थित पाए जाने का भाव देता है। आगे दी गई मृतकों की संख्या के संदर्भ में ‘कम पाए गए’ स्वाभाविक हिन्दी है।
- source_word: מֵעַבְדֵי דָוִד
  choice: दाऊद के सेवकों में से
  rationale: अवादिम का शाब्दिक अर्थ ‘सेवक’ है; राजकीय और सैनिक प्रसंग में यह दाऊद की सेवा में रहने वाले पुरुषों को सूचित करता है।
- source_word: תִּשְׁעָה עָשָׂר אִישׁ וַעֲשָׂה אֵל
  choice: उन्नीस पुरुष और असाहेल
  rationale: मसोराई पाठ उन्नीस पुरुषों के साथ असाहेल को अलग से जोड़ता है। ‘और’ मूल संयोजन को सीधे बनाए रखता है, जबकि पादटिप्पणी गणना का आशय स्पष्ट करती है।
