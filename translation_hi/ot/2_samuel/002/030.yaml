  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली अपनाई गई है। ‘लोगों’ मूल शब्द के निकट है, जबकि प्रसंग से उनके योद्धा होने का अर्थ स्पष्ट होता है।
