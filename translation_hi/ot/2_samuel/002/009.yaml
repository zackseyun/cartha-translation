  yaml_path: translation/ot/2_samuel/002/009.yaml
  text: and made him king over Gilead[a], over the Ashurites, over Jezreel, over Ephraim, over Benjamin, and over all Israel.
translation:
  language: hi
  text: और उसने उसे गिलाद, आशूरी लोगों[a], यिज्रेल, एप्रैम, बिन्यामीन और समस्त इस्राएल पर राजा बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘आशूरी’ है, जिसका यहाँ सामूहिक अर्थ ‘आशूरी लोग’ हो सकता है। कुछ लोग इसे ‘आशेर’ मानते हैं, अर्थात आशेर का गोत्र या प्रदेश।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּמְלִכֵהוּ
  choice: और उसने उसे ... पर राजा बनाया
  rationale: מלך के हिफ़ईल रूप और तृतीय पुरुष एकवचन प्रत्यय का अर्थ किसी को राजा बनाना या राजपद पर स्थापित करना है; यह हिंदी प्रयोग कारक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶל / עַל
  choice: पर
  rationale: राजा बनाए जाने के बाद आए भूभागों और समुदायों के साथ ये संबंधसूचक शब्द उसके शासन-क्षेत्र को दर्शाते हैं; हिंदी में ‘पर राजा बनाया’ स्वाभाविक है।
- source_word: הַגִּלְעָד
  choice: गिलाद
  rationale: इस क्षेत्रीय नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: הָאֲשׁוּרִי
  choice: अश्शूरियों
  rationale: मसोरेटिक स्वरांकन इसे निश्चित उपपद सहित जातिवाचक एकवचन के रूप में प्रस्तुत करता है, जिसका सामूहिक अर्थ हो सकता है; इसलिए मुख्य पाठ में बहुवचन समुदायवाचक रूप रखा गया है, जबकि ‘आशेर’ की समझ पादटिप्पणी में दी गई है।
- source_word: יִזְרְעֶאל
  choice: यिज्रेल
  rationale: स्थाननाम का स्रोत-सन्निकट और हिंदी में सुबोध लिप्यंतरण।
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: गोत्रनाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: בִּנְיָמִן
  choice: बिन्यामीन
  rationale: गोत्रनाम का स्रोत-सन्निकट, प्रचलित हिंदी लिप्यंतरण।
- source_word: יִשְׂרָאֵל כֻּלֹּה
  choice: समस्त इस्राएल
  rationale: כֻּלֹּה पूरे विस्तार पर बल देता है; ‘समस्त इस्राएल’ इस व्यापकता को संक्षिप्त और गरिमापूर्ण हिंदी में व्यक्त करता है।
