    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנָשָׁיו אֲשֶׁר עִמּוֹ
  choice: अपने साथ के पुरुषों को
  rationale: यह पदबंध दाऊद के साथ रहने वाले पुरुष साथियों को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है; पुरुषवाचक संदर्भ भी सुरक्षित रहता है।
- source_word: הֶעֱלָה
  choice: ऊपर ले गया
  rationale: हिफ़ईल रूप किसी को ऊपर ले जाने का भाव देता है और पहाड़ी क्षेत्र में स्थित हेब्रोन की ओर भौगोलिक चढ़ाई का संकेत सुरक्षित रखता है।
- source_word: אִישׁ וּבֵיתוֹ
  choice: हर एक को उसके घराने समेत
  rationale: אִישׁ का वितरणात्मक अर्थ ‘हर एक’ है, जबकि בֵּיתוֹ यहाँ भवन नहीं बल्कि परिवार या गृहस्थी को सूचित करता है; ‘घराना’ इस सामूहिक अर्थ को बनाए रखता है।
- source_word: וַיֵּשְׁבוּ
  choice: वे ... बस गए
  rationale: स्थान-परिवर्तन के इस प्रसंग में क्रिया स्थायी या अपेक्षाकृत स्थिर निवास ग्रहण करने का भाव देती है; ‘बस गए’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְּעָרֵי חֶבְרוֹן
  choice: हेब्रोन के नगरों में
  rationale: बहुवचन עָרֵי को ‘नगरों’ से व्यक्त किया गया है। संबंधसूचक रचना हेब्रोन से संबद्ध आसपास की बस्तियों या नगरों का संकेत दे सकती है, न कि केवल एक नगर-केंद्र का।
- source_word: חֶבְרוֹן
  choice: हेब्रोन
  rationale: इब्रानी व्यक्तिवाचक स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
