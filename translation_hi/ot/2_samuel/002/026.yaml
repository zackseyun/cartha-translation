base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/026.yaml
  text: Then Abner called to Joab and said[a], “Must the sword devour forever? Do you not know that it will be bitter in the end? How long will it be before you tell the people to turn back from following their brothers?”
translation:
  language: hi
  text: तब अब्नेर ने योआब को पुकारकर कहा, “क्या तलवार सदा यूँ ही निगलती रहेगी? क्या तुम नहीं जानते कि अंत में परिणाम कड़वा होगा? तुम कब तक लोगों से नहीं कहोगे कि वे अपने भाइयों का पीछा करना छोड़कर लौट जाएँ[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने भाइयों के पीछे-पीछे चलना छोड़कर लौट जाएँ।”
    reason: मूल इब्रानी पदबंध מֵאַחֲרֵי (‘के पीछे/पीछे-पीछे’) का अधिक शाब्दिक वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: הֲלָנֶצַח
  choice: सदा
  rationale: यह पदबंध युद्ध के अनंत काल तक चलते रहने पर आलंकारिक प्रश्न करता है; ‘सदा’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: תֹּאכַל חֶרֶב
  choice: तलवार ... निगलती रहेगी
  rationale: इब्रानी में तलवार को खाने वाली वस्तु के रूप में व्यक्त किया गया है। ‘निगलना’ इस सजीव और हिंसक रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מָרָה ... בָּאַחֲרוֹנָה
  choice: अंत कड़वा होगा
  rationale: यह अनवरत युद्ध के अंतिम परिणाम की कटुता व्यक्त करता है। हिन्दी में ‘अंत कड़वा होगा’ मूल रूपक और भविष्यकाल दोनों को सुरक्षित रखता है।
- source_word: וְעַד מָתַי לֹא תֹאמַר לָעָם
  choice: तुम कब तक लोगों से नहीं कहोगे
  rationale: मूल की प्रश्नात्मक संरचना और कार्रवाई में हो रही देरी को बनाए रखते हुए यह आधुनिक हिन्दी में सहज है; ‘कहोगे’ को ‘आज्ञा दोगे’ बनाकर सैन्य अधिकार को अनावश्यक रूप से प्रबल नहीं किया गया।
- source_word: לָשׁוּב מֵאַחֲרֵי אֲחֵיהֶם
  choice: अपने भाइयों का पीछा करना छोड़कर लौट जाएँ
  rationale: युद्ध के प्रसंग में מֵאַחֲרֵי पीछा करने का भाव देता है, जबकि לָשׁוּב मुड़ने या लौटने का। अनुवाद दोनों भावों को स्पष्ट रखता है और אֲחֵיהֶם के पारिवारिक बल को ‘भाइयों’ से सुरक्षित करता है।
