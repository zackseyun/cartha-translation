base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/029.yaml
  text: And Abner and his men traveled through the Arabah all that night[a], crossed the Jordan, went through all the Bithron, and came to Mahanaim.
translation:
  language: hi
  text: अब्नेर और उसके लोग उस सारी रात अराबा से होकर चलते रहे, फिर यरदन पार कर गए, पूरे बित्रोन से होकर गए और महनैम पहुँचे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बित्रोन” संभवतः किसी स्थान का नाम है; इसका अर्थ “घाटी” या “दर्रा-क्षेत्र” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֲרָבָה
  choice: अराबा से होकर
  rationale: यात्रा-विवरण में यह सामान्य मैदान के बजाय यरदन घाटी के भौगोलिक क्षेत्र का नाम जान पड़ता है; इसलिए नाम का लिप्यंतरण रखा गया है।
- source_word: כֹּל הַלַּיְלָה הַהוּא
  choice: उस सारी रात
  rationale: यह इब्रानी पदबंध पूरी रात की अवधि व्यक्त करता है; हिंदी में यह स्वाभाविक और निकट समतुल्य है।
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: यरदन पार किया
  rationale: क्रिया और प्रत्यक्ष कर्म का संयोजन नदी को पार करने का स्पष्ट अर्थ देता है।
- source_word: כָּל הַבִּתְרוֹן
  choice: पूरे बित्रोन से होकर
  rationale: यह स्थान या क्षेत्र का नाम हो सकता है, जबकि इसकी व्युत्पत्ति कटी हुई घाटी या दर्रे की ओर संकेत कर सकती है; लिप्यंतरण अनिश्चितता को समय से पहले हल नहीं करता।
- source_word: מַחֲנָיִם
  choice: महनैम
  rationale: यह स्थान-नाम है, इसलिए इसका अनुवाद करने के बजाय प्रचलित हिंदी रूप में लिप्यंतरण किया गया है।
- source_word: הָלְכוּ / וַיֵּלְכוּ / וַיָּבֹאוּ
  choice: चलते रहे … होकर गए … पहुँचे
  rationale: क्रियाओं का क्रम लंबी यात्रा, क्षेत्र से गुजरने और गंतव्य पर पहुँचने की कथात्मक प्रगति बनाए रखता है।
- source_word: וַאֲנָשָׁיו
  choice: उसके लोग
  rationale: मूलतः 'उसके पुरुष/लोग'; सैन्य संदर्भ स्पष्ट है, पर 'सैनिक' कहना मूल से अधिक व्याख्यात्मक होता।
