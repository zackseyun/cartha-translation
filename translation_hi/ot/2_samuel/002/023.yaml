base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/023.yaml
  text: But he refused to turn aside[a], so Abner struck him in the belly with the butt end of the spear, and the spear came out behind him; and he fell there and died on the spot. And everyone who came to the place where Asahel had fallen and died stood still.
translation:
  language: hi
  text: पर वह मुड़ने को तैयार नहीं हुआ। तब अब्नेर ने भाले के पिछले सिरे से उसके पेट[a] में ऐसा मारा कि भाला उसके पीछे से निकल गया। वह वहीं गिर पड़ा और वहीं मर गया। जो कोई उस स्थान पर आया जहाँ असाहेल गिरकर मर गया था, वह ठिठककर खड़ा रह गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू शब्द חֹמֶשׁ का ठीक शारीरिक अर्थ अनिश्चित है। कुछ पुराने अनुवादों में इसका अर्थ “पाँचवीं पसली” किया गया है; यहाँ संभवतः पेट या उदर का भाग अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן לָסוּר
  choice: पर वह मुड़ने को तैयार नहीं हुआ
  rationale: מָאֵן स्पष्ट अनिच्छा अथवा इनकार व्यक्त करता है, और סוּר का मूल भाव रास्ते या पीछा करने से हटना है। यह हिंदी रूप प्रसंग में स्वाभाविक रहते हुए दोनों भावों को बनाए रखता है।
- source_word: וַיַּכֵּהוּ
  choice: ऐसा मारा
  rationale: נכה के प्रहार का सीधा वर्णन है; परिणामवाची अगले उपवाक्य से इसे सहज रूप से जोड़ने के लिए हिंदी में ‘ऐसा मारा कि’ स्वाभाविक है।
- source_word: בְּאַחֲרֵי הַחֲנִית
  choice: भाले के पिछले सिरे से
  rationale: शब्दसमूह भाले के पीछे वाले भाग को सूचित करता है। ‘पिछला सिरा’ सामान्य पाठक के लिए स्पष्ट है और नोक से अलग भाग को बताता है।
- source_word: אֶל הַחֹמֶשׁ
  choice: उसके पेट में
  rationale: חֹמֶשׁ एक कठिन शारीरिक पद है। इस युद्ध-वर्णन में पेट या उदर इसका संभावित सामान्य आशय है; अधिक विशिष्ट पारंपरिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַתֵּצֵא הַחֲנִית מֵאַחֲרָיו
  choice: भाला उसके पीछे से निकल गया
  rationale: यह हिब्रू की स्थानिक अभिव्यक्ति के निकट है और भाले के शरीर को आर-पार कर जाने का परिणाम स्पष्ट करता है।
- source_word: וַיִּפָּל שָׁם וַיָּמָת תַּחְתָּו
  choice: वह वहीं गिर पड़ा और वहीं मर गया
  rationale: תַּחְתָּו यहाँ उसी स्थान पर तत्काल मरने का भाव देता है। दो बार ‘वहीं’ कहना हिब्रू के क्रम और स्थानगत जोर को सहज हिंदी में रखता है।
- source_word: וַיַּעֲמֹדוּ
  choice: ठिठककर खड़ा रह गया
  rationale: עמד यहाँ केवल खड़े होने के बजाय घटनास्थल पर रुक जाने को दर्शाता है। एकवचन ‘जो कोई...वह’ हिंदी में כָּל הַבָּא के वितरणात्मक भाव को व्यक्त करता है।
