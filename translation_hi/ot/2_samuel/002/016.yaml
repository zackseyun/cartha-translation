  text: Each man seized his companion by the head[a], and his sword was in his companion’s side, so they fell together. Therefore that place, which is in Gibeon, was called Helkath-hazzurim.
translation:
  language: hi
  text: हर एक ने अपने सामने वाले का सिर पकड़ लिया, और उसकी तलवार उसके सामने वाले के पहलू में थी; वे एक साथ गिर पड़े। इसलिए गिबोन में स्थित उस स्थान का नाम हेल्कत-हस्सूरीम[a] पड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हेल्कत-हस्सूरीम इब्रानी स्थान-नाम का लिप्यंतरण है। इसका ठीक अर्थ अनिश्चित है; प्रस्तावित अर्थों में “पहलुओं का मैदान,” “धारदार तलवारों का मैदान,” और इनसे मिलते-जुलते अन्य अर्थ शामिल हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲזִקוּ אִישׁ בְּרֹאשׁ רֵעֵהוּ
  choice: हर एक ने अपने सामने वाले का सिर पकड़ लिया
  rationale: חזק यहाँ युद्ध में बलपूर्वक पकड़ने को दर्शाता है। אִישׁ का प्रयोग वितरणात्मक है, और רֵעֵהוּ इस संदर्भ में प्रत्येक योद्धा के सामने वाले प्रतिद्वंद्वी को सूचित करता है; ‘अपने सामने वाले’ मित्रता का अनावश्यक भाव नहीं लाता।
- source_word: וְחַרְבּוֹ בְּצַד רֵעֵהוּ
  choice: और अपनी तलवार उसके पहलू में घोंप दी
  rationale: इब्रानी वाक्यांश संक्षिप्त और क्रियारहित है, पर युद्ध के प्रसंग में तलवार का दूसरे के צַד में जाना निहित है। स्वाभाविक हिन्दी के लिए ‘घोंप दी’ से क्रिया स्पष्ट की गई है; ‘पहलू’ शरीर के पार्श्व का गरिमापूर्ण और सटीक संकेत देता है।
- source_word: וַיִּפְּלוּ יַחְדָּו
  choice: इस तरह वे सब एक साथ गिर पड़े
  rationale: יַחְדָּו सामूहिकता और एक ही समय पर गिरने पर बल देता है। ‘इस तरह’ पूर्ववर्ती पारस्परिक वार के परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: इसलिए ... उस स्थान का नाम ... पड़ा
  rationale: इब्रानी में नाम रखने वाला व्यक्ति अनिर्दिष्ट है। हिन्दी का ‘नाम पड़ा’ उसी अनिर्दिष्ट भाव को स्वाभाविक रूप से रखता है, और ‘इसलिए’ घटना तथा स्थान-नाम के परिणामात्मक संबंध को दर्शाता है।
- source_word: חֶלְקַת הַצֻּרִים
  choice: हेल्कत-हस्सूरीम
  rationale: यह स्थान-नाम लिप्यंतरित किया गया है, क्योंकि इसकी व्युत्पत्ति और ठीक अर्थ अनिश्चित हैं। अर्थ का अनुमान मुख्य पाठ पर थोपने के बजाय विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: गिबोन में
  rationale: संबंधवाचक उपवाक्य नामित स्थान का स्थान-निर्देश करता है; हिन्दी में इसे संक्षिप्त रूप से वाक्य में समाहित करना स्वाभाविक है।
