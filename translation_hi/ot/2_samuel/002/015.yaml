  choice: तब वे उठे
  rationale: קום का कथात्मक रूप अगले कार्य को बताता है; ‘उठे’ स्वाभाविक और स्रोत के निकट है।
- source_word: וַיַּעַבְרוּ
  choice: आगे आए
  rationale: עבר यहाँ निर्धारित मुकाबले के स्थान की ओर जाने या पार होकर आने को सूचित करता है। संदर्भ में ‘आगे आए’ स्वाभाविक है और गति की दिशा को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בְמִסְפָּר
  choice: गिनती के अनुसार
  rationale: यह दोनों पक्षों से गिने हुए, समान दल के आगे आने को दर्शाता है और हिन्दी में स्पष्ट है।
- source_word: שְׁנֵים עָשָׂר
  choice: बारह
  rationale: मूल संख्या का सीधा अनुवाद।
- source_word: לְבִנְיָמִן וּלְאִישׁ בֹּשֶׁת
  choice: बिन्यामीन और ... ईशबोशेत की ओर से
  rationale: לְ यहाँ पक्ष अथवा संबद्धता व्यक्त करता है; ‘की ओर से’ प्रतिनिधित्व के भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: בֶּן שָׁאוּל
  choice: शाऊल के पुत्र
  rationale: पहचान बताने वाली मूल वंश-सूचना को यथावत रखा गया है।
- source_word: מֵעַבְדֵי דָוִד
  choice: दाऊद के सेवकों में से
  rationale: מִן का ‘में से’ अर्थ और עֲבָדִים का मूल ‘सेवक’ अर्थ दोनों सुरक्षित रहते हैं; सैनिक संदर्भ में ये राजकीय सेवक/अनुचर हैं।
