base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/015.yaml
  text: 'So they arose and crossed over by number: twelve for Benjamin and for Ish-bosheth the son of Saul[d][c][b][a], and twelve from the servants of David.'
translation:
  language: hi
  text: तब वे उठे और गिनती के अनुसार पार गए:[a] बिन्यामीन और शाऊल के पुत्र ईशबोशेत की ओर से बारह,[b][c] और दाऊद के सेवकों में से बारह।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस ओर गए।” इब्रानी क्रिया किसी निर्धारित स्थान की ओर बढ़ने या पार जाने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “बिन्यामीन में से।” इब्रानी संबंधसूचक शब्द उद्गम या पक्ष-संबंध—दोनों बता सकता है; यहाँ संभवतः वे बिन्यामीन और ईशबोशेत के पक्ष का प्रतिनिधित्व करते हैं।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में “ईशबोशेत”; पुराने नियम की परंपरा में अन्यत्र इससे संबंधित नामरूप “एशबाल” मिलता है।
    reason: alternative_reading
  - marker: d
    text: या “दाऊद के जनों में से।” यहाँ “सेवक” राजकीय अथवा सैनिक सेवा में रहने वाले लोगों को भी कहा जा सकता है।
    reason: lexical_alternative
