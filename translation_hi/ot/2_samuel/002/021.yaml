  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक स्तर रखा गया है। अब्नेर की आज्ञा के लिए निकट और तात्कालिक एकवचन ‘मुड़ जा/ले ले’ प्रयुक्त है। ‘युद्ध-सामान’ सामान्य पाठक के लिए स्पष्ट है और मूल की शब्दार्थगत अनिश्चितता को पाद-टिप्पणी सहित सुरक्षित रखता है।
