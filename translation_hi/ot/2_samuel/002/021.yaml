  yaml_path: translation/ot/2_samuel/002/021.yaml
  text: Then Abner said to him[a], “Turn aside to your right or to your left, and seize one of the young men for yourself, and take his gear for yourself.” But Asahel was not willing to turn aside from following him.
translation:
  language: hi
  text: तब अब्नेर ने उससे कहा, “अपने दाहिने या बाएँ मुड़ जा, और जवानों में से किसी एक को पकड़ ले और उसका युद्ध-सामान[a] अपने लिए ले ले।” लेकिन असाहेल उसका पीछा करना छोड़कर हटने को तैयार नहीं हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसका कवच।” इब्रानी शब्द सम्भवतः गिरे हुए योद्धा से उतारे गए साज-सामान को दर्शाता है; ठीक किस वस्तु की बात है, यह निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נְטֵה לְךָ עַל יְמִינְךָ אֹו עַל שְׂמֹאלֶךָ
  choice: अपने दाहिने या बाएँ मुड़ जा
  rationale: पीछा करते हुए वर्तमान मार्ग से एक ओर हटने की आज्ञा है। यह अभिव्यक्ति दूसरे पुरुष एकवचन संबोधन और दोनों दिशाओं को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: וֶאֱחֹז לְךָ אֶחָד מֵהַנְּעָרִים
  choice: उन जवानों में से किसी एक को पकड़कर
  rationale: אחז का बल ‘पकड़ना/धर लेना’ है। נְעָרִים का मूल अर्थ ‘जवान’ है; सैनिक कहना प्रसंगानुकूल होता, पर मूल से अधिक विशिष्ट होता। ‘अपने लिए’ को अगले संयुक्त कार्य के साथ रखने से हिन्दी सहज रहती है और לְךָ का लाभार्थक भाव सुरक्षित रहता है।
- source_word: וְקַח לְךָ אֶת חֲלִצָתוֹ
  choice: उसका युद्ध-सामान अपने लिए ले ले
  rationale: חֲלִצָה यहाँ सम्भवतः किसी योद्धा से उतारा गया साज-सामान या कवच दर्शाता है। ‘युद्ध-सामान’ युद्ध-प्रसंग को स्पष्ट करता है, पर केवल ‘कवच’ या सामान्य ‘लूट’ जैसी अनावश्यक निश्चितता से बचता है।
- source_word: וְלֹא אָבָה עֲשָׂהאֵל
  choice: लेकिन असाहेल ... तैयार नहीं हुआ
  rationale: אבה इच्छा या सहमति व्यक्त करता है। ‘तैयार नहीं हुआ’ आधुनिक हिन्दी में अनिच्छा को स्वाभाविक ढंग से व्यक्त करता है, बिना इसे अत्यधिक कठोर ‘इनकार किया’ बनाने के।
- source_word: לָסוּר מֵאַחֲרָיו
  choice: उसका पीछा छोड़कर हटने
  rationale: סור में हटने या एक ओर हो जाने और מֵאַחֲרָיו में उसके पीछे लगे रहने से अलग होने का भाव है। संयुक्त हिन्दी वाक्यांश पीछा करने की दृश्यात्मकता बनाए रखता है।
