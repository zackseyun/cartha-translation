base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/018.yaml
  text: 'The three sons of Zeruiah were there: Joab[a], Abishai, and Asahel. And Asahel was swift on his feet like one of the gazelles that are in the field.'
translation:
  language: hi
  text: 'सरूयाह के तीनों बेटे वहाँ थे: योआब, अबीशै और असाहेल। असाहेल दौड़ने में मैदान में रहनेवाले किसी चिकारे[a] के समान तेज़ था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैदान में रहनेवाले किसी हिरन के समान।” इब्रानी शब्द צְבִי हिरन-जैसे वन्य पशु के लिए कुछ व्यापक अर्थ में भी प्रयुक्त हो सकता है, यद्यपि यहाँ “चिकारा” अधिक सटीक है।
    reason: lexical_alternative
