  choice: योआब, अबीशै और असाहेल
  rationale: व्यक्तिनामों को हिन्दी बाइबलीय प्रयोग के अनुरूप लिप्यंतरित किया गया है।
- source_word: קַל בְּרַגְלָיו
  choice: पैरों का बहुत तेज़ था
  rationale: इब्रानी मुहावरा दौड़ने की तीव्र गति बताता है; यह हिन्दी में स्वाभाविक रूप से उसी शारीरिक बिंब को बनाए रखता है। ‘बहुत’ हिन्दी में विशेषता की प्रबलता को सहज बनाता है, बिना तुलना का अर्थ बदले।
- source_word: כְּאַחַד הַצְּבָיִם
  choice: चिकारे की तरह
  rationale: צְבִי यहाँ गति के लिए प्रसिद्ध gazelle-जैसे वन्य पशु को सूचित करता है; उत्तर भारतीय पाठकों के लिए ‘चिकारा’ अधिक सटीक और बोधगम्य नाम है। एकवचन हिन्दी तुलना इब्रानी ‘उनमें से एक’ का स्वाभाविक अर्थ देती है।
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: मैदान में रहनेवाले
  rationale: यह पशु के खुले मैदानी प्राकृतिक निवास को बताता है और मूल के स्थान-सूचक भाव को संक्षेप में रखता है।
