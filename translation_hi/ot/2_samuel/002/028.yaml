base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/028.yaml
  text: Then Joab blew the trumpet[a], and all the people stood still, and they no longer pursued Israel or continued to fight.
translation:
  language: hi
  text: तब योआब ने तुरही[a] फूँकी, और सब लोग रुक गए; फिर उन्होंने इस्राएल का पीछा नहीं किया और न ही आगे लड़ाई की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सींग।” इब्रानी शब्द שׁוֹפָר उस सींग को दर्शाता है जिसे संकेत देने के लिए वाद्य के रूप में फूँका जाता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַע
  choice: फूँका
  rationale: שׁוֹפָר जैसे संकेत देने वाले वाद्य के साथ תקע का अर्थ उसे फूँकना या बजाना है; हिंदी में ‘नरसिंगा फूँका’ स्वाभाविक और सटीक है।
- source_word: בַּשּׁוֹפָר
  choice: नरसिंगा
  rationale: שׁוֹפָר सींग से बना संकेत-वाद्य है। ‘नरसिंगा’ आधुनिक हिंदी पाठक के लिए ऐसे फूँककर बजाए जाने वाले वाद्य को स्पष्ट करता है, जबकि ‘तुरही’ इसके सींग होने की विशेषता कम स्पष्ट करती है।
- source_word: וַיַּעַמְדוּ כָּל הָעָם
  choice: सब लोग रुक गए
  rationale: עמד का मूल अर्थ ‘खड़ा होना’ है, पर यहाँ सैन्य पीछा रोक देने का भाव है। ‘रुक गए’ प्रसंगगत अर्थ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: הָעָם
  choice: सब लोग
  rationale: मूल में ‘लोग’ है; प्रसंग में इससे योआब के सैनिक अभिप्रेत हैं, पर मुख्य पाठ में मूल की व्यापक अभिव्यक्ति बनाए रखी गई है।
- source_word: יִרְדְּפוּ עוֹד אַחֲרֵי יִשְׂרָאֵל
  choice: फिर इस्राएल का पीछा नहीं किया
  rationale: רדף אחרי का अर्थ ‘पीछा करना’ और निषेध के साथ עוֹד का अर्थ ‘फिर/आगे और नहीं’ है।
- source_word: וְלֹא יָסְפוּ עוֹד לְהִלָּחֵם
  choice: न आगे युद्ध किया
  rationale: יסף + infinitive किसी काम को आगे जारी रखने या फिर करने का भाव देता है। संक्षिप्त समानांतर वाक्यांश मूल की पुनरुक्त निषेधात्मक संरचना को बनाए रखता है।
