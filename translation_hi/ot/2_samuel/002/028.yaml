  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘इस पर’ से नरसिंगा फूँकने और सेना के रुकने का संबंध स्पष्ट होता है। ‘इस्राएल’ मूल के सामूहिक नाम को बनाए रखता है; उसे व्याख्यात्मक रूप से ‘इस्राएली सैनिक’ नहीं बनाया गया।
