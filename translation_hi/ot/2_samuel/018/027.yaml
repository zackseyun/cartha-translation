  text: וַ/יֹּ֨אמֶר֙ הַ/צֹּפֶ֔ה אֲנִ֤י רֹאֶה֙ אֶת מְרוּצַ֣ת הָ/רִאשׁ֔וֹן כִּ/מְרֻצַ֖ת אֲחִימַ֣עַץ בֶּן צָד֑וֹק וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אִֽישׁ ט֣וֹב זֶ֔ה וְ/אֶל בְּשׂוֹרָ֥ה טוֹבָ֖ה יָבֽוֹא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/027.yaml
  text: Then the watchman said[a], “I see the running of the first one is like the running of Ahimaaz the son of Zadok.” And the king said, “He is a good man[b], and he comes with good news.”
translation:
  language: hi
  text: तब पहरेदार ने कहा, “मुझे पहले आदमी की दौड़ सादोक के पुत्र अहीमाअस की दौड़ जैसी दिखाई दे रही है।” राजा ने कहा, “वह भला आदमी है और शुभ समाचार लेकर आ रहा है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और वह शुभ समाचार लेकर आएगा”; हिब्रू क्रिया को भविष्यकाल में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: पहरेदार
  rationale: यह कृदन्त संज्ञा निगरानी करने वाले व्यक्ति को दर्शाती है; कथा के इस प्रसंग में ‘पहरेदार’ स्वाभाविक और स्पष्ट है।
- source_word: מְרוּצַת הָרִאשׁוֹן
  choice: पहले आदमी की दौड़
  rationale: मूल पाठ की संज्ञा ‘दौड़’ और पहले आने वाले व्यक्ति का संकेत दोनों सुरक्षित रहते हैं।
- source_word: כִּמְרֻצַת
  choice: की दौड़ जैसी
  rationale: तुलनासूचक כ और मूल में ‘दौड़’ शब्द की पुनरावृत्ति को सहज हिन्दी में बनाए रखता है।
- source_word: אֲחִימַעַץ בֶּן צָדוֹק
  choice: सादोक के पुत्र अहीमाअस
  rationale: नामों का हिन्दी लिप्यंतरण करते हुए בן के संबंध को स्पष्ट रूप से व्यक्त किया गया है।
- source_word: אִישׁ טוֹב זֶה
  choice: वह भला आदमी है
  rationale: मूलतः ‘यह एक भला आदमी है’ के भाव को प्रसंगानुकूल, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאֶל בְּשׂוֹרָה טוֹבָה יָבוֹא
  choice: और शुभ समाचार लेकर आ रहा है
  rationale: בְּשׂוֹרָה טוֹבָה को ‘शुभ समाचार’ और निकट आते दूत के विषय में अनुमान को वर्तमान प्रगतिशील हिन्दी में व्यक्त किया गया है; हिब्रू क्रिया का भावी अर्थ भी संभव है।
