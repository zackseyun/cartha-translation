base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/026.yaml
  text: Then the watchman saw another man running[a], and the watchman called to the gatekeeper and said, “Look, a man is running by himself.” And the king said, “He also brings news.”
translation:
  language: hi
  text: तब पहरेदार ने एक और आदमी को दौड़ते देखा, और उसने फाटक के रखवाले को पुकारकर कहा, “देखो, एक आदमी अकेला दौड़ता आ रहा है।” राजा ने कहा, “यह भी समाचार लेकर आ रहा है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह भी एक संदेशवाहक है”; इब्रानी कृदंत का अर्थ समाचार लाने वाला हो सकता है, और उसमें प्रायः शुभ समाचार का भाव भी होता है।
    reason: मְבַשֵּׂר के वैकल्पिक शब्दार्थ को दर्शाता है, बिना समाचार के शुभ होने को निश्चित किए।
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: पहरेदार
  rationale: यह צפה से बना कृदंत है और निगरानी करने वाले व्यक्ति को दर्शाता है। नगर-द्वार के प्रसंग में ‘पहरेदार’ स्वाभाविक और स्पष्ट है।
- source_word: אִישׁ אַחֵר
  choice: एक और आदमी
  rationale: यह पहले धावक से अलग एक अतिरिक्त व्यक्ति को सूचित करता है; ‘एक और आदमी’ आधुनिक हिन्दी में सहज है।
- source_word: רָץ
  choice: दौड़ते / दौड़ा आ रहा है
  rationale: कृदंत जारी क्रिया को व्यक्त करता है। पहले वाक्य में ‘दौड़ते देखा’ और प्रत्यक्ष पुकार में ‘दौड़ा आ रहा है’ उसी गतिशील दृश्य को स्वाभाविक हिन्दी में रखते हैं।
- source_word: הַשֹּׁעֵר
  choice: फाटक का रखवाला
  rationale: नगर के फाटक की रखवाली करने वाले अधिकारी के लिए यह स्पष्ट और प्रचलित हिन्दी अभिव्यक्ति है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला सूचक अव्यय है; ‘देखो’ इसके तात्कालिक बल को सहज रूप से व्यक्त करता है।
- source_word: לְבַדּוֹ
  choice: अकेला
  rationale: यह बताता है कि धावक किसी दल के साथ नहीं, बल्कि स्वयं अकेला आ रहा था।
- source_word: גַּם זֶה
  choice: यह भी
  rationale: यह दूसरे धावक को पहले धावक की ही श्रेणी में रखता है और זֶה के संकेतात्मक भाव को बनाए रखता है।
- source_word: מְבַשֵּׂר
  choice: समाचार ला रहा है
  rationale: בשׂר का पिएल कृदंत समाचार लाने वाले को दर्शा सकता है और प्रायः शुभ समाचार का संकेत देता है। यहाँ ‘समाचार’ मूल की संभावित सकारात्मक छाया को अनावश्यक रूप से निश्चित किए बिना प्रसंग के अनुकूल है।
