translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज कथा-शैली। योआब का संदेशवाहक से संबोधन एकवचन और प्रत्यक्ष है, इसलिए ‘जा/तूने’ रखा गया है। ‘झुककर प्रणाम किया’ सम्मानसूचक शारीरिक क्रिया को स्पष्ट करता है, आराधना का भाव आरोपित नहीं करता।
