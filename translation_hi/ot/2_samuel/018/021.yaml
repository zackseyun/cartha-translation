base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/021.yaml
  text: Then Joab said to the Cushite[a], “Go, tell the king what you have seen.” And the Cushite bowed down to Joab and ran.
translation:
  language: hi
  text: तब योआब ने कूशवासी[a] से कहा, “जा, और जो कुछ तूने देखा है, वह राजा को बता।” कूशवासी ने योआब के सामने झुककर प्रणाम किया और दौड़ पड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, यदि इसे व्यक्तिगत नाम माना जाए, ‘कूशी’; परंपरागत अनुवाद: ‘इथियोपियाई।’'
    reason: इब्रानी כּוּשִׁי सामान्यतः कूश से संबंध रखने वाले व्यक्ति के लिए जातिवाचक पद है, पर इसे व्यक्तिगत नाम ‘कूशी’ भी माना जा सकता है। ‘इथियोपियाई’ पारंपरिक भौगोलिक अनुवाद है।
lexical_decisions:
- source_word: כּוּשִׁי
  choice: कूशी
  rationale: इब्रानी जातिवाचक शब्द को ‘कूशी’ के रूप में रखा गया है, जो कूश देश अथवा जाति से संबंध बताता है। प्रसंग में इसे व्यक्तिगत नाम मानना भी संभव है, इसलिए पादटिप्पणी में वास्तविक अस्पष्टता सुरक्षित रखी गई है।
- source_word: לֵךְ
  choice: जा
  rationale: एकवचन आज्ञार्थक रूप का सीधा और स्वाभाविक हिन्दी अनुवाद; निकटवर्ती ‘तूने’ के साथ संबोधन-संगति रखता है।
- source_word: הַגֵּד
  choice: बता
  rationale: हिफ़ील आज्ञार्थक का अर्थ किसी बात को ज्ञात कराना या समाचार देना है; आधुनिक सामान्य हिन्दी में ‘बता’ सीधा और स्वाभाविक है।
- source_word: אֲשֶׁר רָאִיתָה
  choice: जो कुछ तूने देखा है
  rationale: सापेक्ष वाक्यांश को सहज हिन्दी में प्रस्तुत किया गया है; पूर्ण क्रिया का वर्तमान-प्रासंगिक भाव ‘देखा है’ से व्यक्त होता है।
- source_word: וַיִּשְׁתַּחוּ
  choice: झुककर प्रणाम किया
  rationale: यह शारीरिक रूप से झुककर आदर प्रकट करने का भाव देता है, बिना इसे आराधना के अर्थ में सीमित किए या पूर्ण दण्डवत् को अनिवार्य माने।
- source_word: וַיָּרֹץ
  choice: दौड़ पड़ा
  rationale: रוץ के सीधे अर्थ ‘दौड़ना’ को रखा गया है; ‘पड़ा’ प्रस्थान और कथा की गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक रूप से आगे बढ़ती कथा को आधुनिक हिन्दी में ‘तब’ स्वाभाविक ढंग से व्यक्त करता है।
