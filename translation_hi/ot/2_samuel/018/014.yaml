translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। पहले वाक्य में इब्रानी की संक्षिप्तता और तनाव बनाए रखा गया है। पेड़ के लिए अपेक्षाकृत कम परिचित लेकिन वनस्पतिगत रूप से अधिक सटीक ‘तारपीन का पेड़’ मुख्य पाठ में है, जबकि परिचित पारंपरिक विकल्प पादटिप्पणी में दिया गया है।
