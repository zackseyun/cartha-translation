base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/014.yaml
  text: Joab said[a], “Not so[b]; I will not wait before you.” Then he took three spears in his hand and drove them into the heart of Absalom while he was still alive in the heart of the terebinth.
translation:
  language: hi
  text: योआब ने कहा, “ऐसा नहीं; मैं तुम्हारे सामने देर नहीं करूँगा।” तब उसने अपने हाथ में तीन भाले[a] लिए और उन्हें अबशालोम के हृदय में घोंप दिया, जब वह तारपीन के पेड़[b] के बीच अभी जीवित था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तीन छड़ें” अथवा “तीन डंडे।” इब्रानी शब्द का अर्थ छड़ी, डंडा या राजदंड भी हो सकता है; यहाँ प्रसंग से नुकीले हथियारों का अर्थ अधिक संभावित है।
    reason: lexical_alternative
  - marker: b
    text: या, “बलूत का पेड़।” इब्रानी शब्द אֵלָה प्रायः टेरिबिन्थ अर्थात तारपीन के पेड़ के लिए आता है, पर कुछ अनुवाद इसे सामान्य रूप से बलूत कहते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹחִילָה
  choice: देर नहीं करूँगा
  rationale: हिफ़ील रूप यहाँ प्रतीक्षा करने अथवा देर लगाने का भाव देता है। यह चयन आधुनिक और स्वाभाविक हिन्दी में योआब की तुरंत कार्रवाई करने की बात व्यक्त करता है।
- source_word: לְפָנֶיךָ
  choice: तुम्हारे सामने
  rationale: यह मूल इब्रानी के ‘तुम्हारे मुख/उपस्थिति के सामने’ वाले मुहावरे को सहज हिन्दी में निकटता से रखता है।
- source_word: שְׁבָטִים
  choice: भाले
  rationale: शब्द का सामान्य अर्थ छड़ी या डंडा भी हो सकता है, पर सैनिक प्रसंग और उन्हें हृदय में घोंपने की क्रिया यहाँ नुकीले हथियारों की ओर संकेत करती है; शब्दगत विकल्प पादटिप्पणी में रखा गया है।
- source_word: וַיִּתְקָעֵם
  choice: उन्हें ... घोंप दिया
  rationale: תקע यहाँ किसी वस्तु को बलपूर्वक भीतर धँसाने की क्रिया बताता है; ‘घोंप दिया’ हिन्दी में इस हिंसक और सप्रयास क्रिया को स्पष्ट करता है।
- source_word: בְּלֵב אַבְשָׁלוֹם
  choice: अबशालोम के हृदय में
  rationale: मूल पाठ सीधे ‘हृदय’ कहता है, इसलिए इसे ‘सीने’ जैसे अधिक सामान्य शब्द से नहीं बदला गया।
- source_word: עוֹדֶנּוּ חַי
  choice: अभी जीवित था
  rationale: यह इस बात पर बल देता है कि वार किए जाते समय अबशालोम मरा नहीं था।
- source_word: בְּלֵב הָאֵלָה
  choice: तारपीन के पेड़ के बीच
  rationale: אֵלָה सामान्यतः टेरिबिन्थ अर्थात तारपीन के पेड़ को दर्शाता है। पेड़ के संदर्भ में इब्रानी ‘हृदय’ का स्वाभाविक हिन्दी अर्थ ‘बीच’ है; शाब्दिक ‘पेड़ के हृदय में’ अस्वाभाविक होता।
