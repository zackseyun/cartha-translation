  text: तब योआब के हथियार उठानेवाले दस जवानों ने अबशालोम को घेर लिया, उस पर प्रहार किया और उसे मार डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: घेर लिया
  rationale: सבב यहाँ किसी व्यक्ति के चारों ओर आकर उसे घेर लेने की सामरिक क्रिया बताता है; ‘घेर लिया’ स्वाभाविक और सटीक हिन्दी है।
- source_word: עֲשָׂרָה נְעָרִים
  choice: दस जवानों
  rationale: נְעָרִים इस सैनिक प्रसंग में बच्चों के बजाय अधीनस्थ युवा पुरुषों को सूचित करता है; ‘जवान’ उनके सैन्य संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נֹשְׂאֵי כְּלֵי יוֹאָב
  choice: योआब के हथियार ढोनेवाले
  rationale: इस पदबंध का शाब्दिक अर्थ योआब के सामान या हथियार उठानेवाले है। ‘हथियार ढोनेवाले’ बहुवचन को बनाए रखता है और ‘शस्त्रवाहक’ की अपेक्षा आम पाठक के लिए अधिक स्पष्ट है।
- source_word: וַיַּכּוּ
  choice: उसे मारकर
  rationale: נכה का अर्थ प्रहार करना या मारना है। ‘मारकर’ अगली क्रिया के साथ स्वाभाविक हिन्दी क्रम बनाता है, फिर भी प्रहार और हत्या को अलग क्रियाओं के रूप में रखता है।
- source_word: וַיְמִיתֻהוּ
  choice: उसकी हत्या कर दी
  rationale: מות के हिफ़ील रूप का अर्थ किसी को मरवा देना या मार डालना है। यहाँ ‘हत्या कर दी’ पूर्ववर्ती ‘मारकर’ से स्पष्ट भेद रखते हुए परिणाम को व्यक्त करता है।
- source_word: אַבְשָׁלוֹם
  choice: अबशालोम
  rationale: इब्रानी नाम का प्रचलित मानक हिन्दी बाइबलीय लिप्यंतरण ‘अबशालोम’ है।
