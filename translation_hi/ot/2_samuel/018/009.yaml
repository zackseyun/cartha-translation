  text: Absalom happened to come before David’s servants while Absalom was riding on the mule. The mule went under the thick branches of a large terebinth[a], and his head got caught in the terebinth, so that he was left hanging between heaven and earth while the mule that was under him passed on.
translation:
  language: hi
  text: अबशालोम दाऊद के सेवकों के सामने आ पड़ा। उस समय वह खच्चर पर सवार था। खच्चर एक बड़े तेरेबिन्थ वृक्ष[a] की घनी शाखाओं के नीचे से गुज़रा, और अबशालोम का सिर उस वृक्ष में फँस गया। वह आकाश और धरती के बीच लटका रह गया, जबकि वह खच्चर जो उसके नीचे था, आगे निकल गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक बड़े बलूत की घनी शाखाओं के नीचे।” इब्रानी אֵלָה का अधिक सटीक अर्थ “तेरेबिन्थ” है, पर इसे अधिक सामान्य रूप से बड़े वृक्ष के लिए भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּרֵא ... לִפְנֵי עַבְדֵי דָוִד
  choice: अबशालोम का सामना दाऊद के सेवकों से हो गया
  rationale: निफ़अल रूप आकस्मिक मुठभेड़ का भाव देता है, न कि जानबूझकर मिलने का। ‘सामना ... हो गया’ आधुनिक हिन्दी में इस अनपेक्षित घटना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַבְדֵי דָוִד
  choice: दाऊद के सेवक
  rationale: सैन्य प्रसंग में यह दाऊद के अधीनस्थ जनों या सैनिकों को सूचित कर सकता है; ‘सेवक’ मूल शब्द की व्यापकता बनाए रखता है।
- source_word: רֹכֵב עַל הַפֶּרֶד
  choice: खच्चर पर सवार था
  rationale: प्रतिभागी क्रिया उस समय अबशालोम की स्थिति बताती है; यह हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: תַּחַת שׂוֹבֶךְ הָאֵלָה הַגְּדוֹלָה
  choice: एक बड़े बलूत की घनी शाखाओं के नीचे
  rationale: שׂוֹבֶךְ उलझी या घनी डालियों का समूह है। אֵלָה की सटीक वनस्पति पहचान अनिश्चित है; मुख्य पाठ में परिचित ‘बलूत’ और पाद-टिप्पणी में ‘तेरेबिन्थ’ विकल्प दिया गया है।
- source_word: וַיֶּחֱזַק רֹאשׁוֹ בָאֵלָה
  choice: अबशालोम का सिर उस बलूत में फँस गया
  rationale: शाब्दिक अर्थ ‘उसका सिर पेड़ में मजबूती से पकड़ा गया’ है। ‘फँस गया’ अनैच्छिक उलझाव को सहज हिन्दी में व्यक्त करता है; मूल में बालों का उल्लेख नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: וַיֻּתַּן בֵּין הַשָּׁמַיִם וּבֵין הָאָרֶץ
  choice: वह आकाश और धरती के बीच लटका रह गया
  rationale: נתן का कर्मवाच्य यहाँ परिणामस्वरूप निलंबित रह जाने को दर्शाता है। ‘लटका रह गया’ दृश्य को स्पष्ट करता है, जबकि पारंपरिक अभिव्यक्ति ‘आकाश और धरती के बीच’ सुरक्षित रहती है।
- source_word: עָבָר
  choice: आगे निकल गया
  rationale: क्रिया खच्चर की निरंतर आगे की गति बताती है; ‘आगे निकल गया’ हिन्दी कथन में स्पष्ट और स्वाभाविक है।
