translation:
  language: hi
  text: या यदि मैंने उसके प्राण के विरुद्ध छल किया होता—और राजा से कोई बात छिपी नहीं रहती—तो तुम स्वयं दूर खड़े रहते।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשִׂיתִי בְנַפְשׁוֹ שֶׁקֶר
  choice: मैं उसके प्राण के विरुद्ध विश्वासघात करता
  rationale: शाब्दिक संरचना ‘उसके प्राण के विरुद्ध झूठ/छल करना’ है; प्रसंग में अबशालोम की जान लेकर राजाज्ञा से विश्वासघात करने का भाव है। ‘विश्वासघात’ स्वाभाविक हिन्दी में नैतिक और राजनिष्ठा-संबंधी दोनों आयाम रखता है।
- source_word: וְכָל־דָּבָר לֹא־יִכָּחֵד מִן־הַמֶּלֶךְ
  choice: और कोई भी बात राजा से छिपी नहीं रहती
  rationale: इब्रानी का सामान्य और व्यापक कथन वर्तमानकालीन हिन्दी में रखा गया है; ‘דָּבָר’ की बात/मामला दोनों अर्थ-सीमा में ‘बात’ सहज है।
- source_word: וְאַתָּה תִּתְיַצֵּב מִנֶּגֶד
  choice: तो तुम स्वयं अलग खड़े रहते
  rationale: מִנֶּגֶד दूरी या अलगाव में खड़े रहने का संकेत देता है। यह अनुवाद इस आशय को रखता है कि योआब सहायता या संरक्षण न देता, बिना इसे अधिक स्पष्ट ‘मेरे विरुद्ध’ बनाकर निहित संबंध को सीमित किए।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य के मध्य का कथन डैशों में रखा गया है ताकि सैनिक की मुख्य काल्पनिक शर्त और उसके परिणाम का संबंध स्पष्ट रहे, जबकि मूल की प्रवाहमान संरचना भी बनी रहे।
