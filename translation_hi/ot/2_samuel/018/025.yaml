  choice: शुभ समाचार
  alternative: समाचार
  rationale: शब्द केवल खबर के लिए भी प्रयुक्त हो सकता है, पर इस कथा-संदर्भ में अकेले दौड़कर आने वाले संदेशवाहक के विषय में राजा का अनुमान अनुकूल समाचार का है। यह संदर्भगत भाव है, कोई सांप्रदायिक व्याख्या नहीं।
