  text: Then the watchman called out and told the king. And the king said[a], “If he is by himself, there is news in his mouth.” And he kept coming nearer and nearer.
translation:
  language: hi
  text: तब पहरेदार ने पुकारकर राजा को सूचना दी। राजा ने कहा, “यदि वह अकेला है, तो उसके मुँह में समाचार[a] है।” और वह लगातार निकट आता गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शुभ समाचार।” इब्रानी शब्द का अर्थ केवल “समाचार” भी हो सकता है, यद्यपि इस प्रसंग में अनुकूल समाचार का संकेत हो सकता है।
    reason: lexical_alternative
