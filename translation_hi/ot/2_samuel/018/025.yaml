  choice: पहरेदार
  rationale: यह शब्द निगरानी के लिए नियुक्त व्यक्ति को दर्शाता है; नगर-द्वार और युद्ध के प्रसंग में ‘पहरेदार’ सहज और सटीक है।
- source_word: וַיִּקְרָא
  choice: पुकारकर
  rationale: यह ऊँची आवाज़ में सूचना देने का भाव व्यक्त करता है और अगले क्रियापद के साथ स्वाभाविक हिन्दी बनाता है।
- source_word: וַיַּגֵּד לַמֶּלֶךְ
  choice: राजा को सूचना दी
  rationale: हिफ़ील रूप यहाँ बताने या खबर देने के अर्थ में है; ‘सूचना दी’ पहरेदार की औपचारिक भूमिका के अनुकूल है।
- source_word: אִם לְבַדּוֹ
  choice: यदि वह अकेला है
  rationale: मूल पाठ सीधे उस व्यक्ति की अकेली अवस्था बताता है; गति का अतिरिक्त अर्थ नहीं जोड़ा गया।
- source_word: בְּשׂוֹרָה
  choice: शुभ समाचार
  rationale: संज्ञा समाचार को दर्शाती है और प्रायः अनुकूल समाचार का भाव रखती है; इस प्रसंग में राजा का निष्कर्ष सकारात्मक खबर की ओर संकेत करता है।
- source_word: בְּפִיו
  choice: उसके मुँह में
  rationale: मूल इब्रानी मुहावरे और उसकी सजीव छवि को सुरक्षित रखा गया है; हिन्दी में भी अर्थ समझ में आता है।
- source_word: וַיֵּלֶךְ הָלוֹךְ וְקָרֵב
  choice: वह निकट से निकट आता गया
  rationale: यह निरंतर बढ़ती निकटता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
