  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל הַ/כּוּשִׁ֔י הֲ/שָׁל֥וֹם לַ/נַּ֖עַר לְ/אַבְשָׁל֑וֹם וַ/יֹּ֣אמֶר הַ/כּוּשִׁ֗י יִהְי֤וּ כַ/נַּ֨עַר֙ אֹֽיְבֵי֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ וְ/כֹ֛ל אֲשֶׁר קָ֥מוּ עָלֶ֖י/ךָ לְ/רָעָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/032.yaml
  text: Then the king said to the Cushite[a], “Is it well with the young man Absalom?” And the Cushite said, “May the enemies of my lord the king, and all who rise up against you for evil[b], be like that young man.”
translation:
  language: hi
  text: तब राजा ने कूशवासी से पूछा, “क्या युवक अबशालोम कुशल से है?[a]” कूशवासी ने उत्तर दिया, “मेरे प्रभु राजा के शत्रु और वे सभी जो आपकी हानि करने के लिए आपके विरुद्ध उठ खड़े हों, उस युवक के समान हों!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “क्या युवक अबशालोम सुरक्षित है?” भी हो सकता है। इब्रानी शब्द शालोम का शाब्दिक भाव ‘शांति/कुशल-क्षेम’ है, जो केवल जीवित बचने से अधिक व्यापक है।
    reason: lexical_alternative
  - marker: b
    text: कूशवासी सीधे यह नहीं कहता कि अबशालोम मर गया है। वह संकेत देता है कि अबशालोम का वही परिणाम हुआ जो राजा के शत्रुओं के लिए उचित है।
    reason: cultural_note
lexical_decisions:
- source_word: הַכּוּשִׁי
  choice: कूशवासी
  rationale: यह कूश देश के निवासी के लिए प्रयुक्त जाति-भौगोलिक पद है। ‘कूशवासी’ मूल संकेत को बनाए रखता है और आधुनिक ‘इथियोपियाई’ जैसी अपेक्षाकृत संकीर्ण पहचान आरोपित नहीं करता।
- source_word: הֲשָׁלוֹם
  choice: क्या ... कुशल से है?
  rationale: שָׁלוֹם यहाँ व्यापक कुशल-क्षेम या भलाई पूछता है, केवल जीवित अथवा सुरक्षित होने की बात नहीं। यह हिंदी में स्वाभाविक प्रश्न है और मूल की व्यापकता बचाता है।
- source_word: לַנַּעַר / כַנַּעַר
  choice: युवक / उस युवक के समान
  rationale: נַעַר प्रसंग के अनुसार लड़के, जवान या युवक को सूचित कर सकता है। अबशालोम वयस्क है, इसलिए ‘युवक’ उपयुक्त है; ‘उस युवक’ पहले उल्लिखित अबशालोम की ओर संकेत करते हुए उत्तर की अप्रत्यक्षता बनाए रखता है।
- source_word: לְאַבְשָׁלוֹם
  choice: अबशालोम
  rationale: व्यक्तिनाम को हिंदी बाइबलीय परंपरा के अनुरूप लिप्यंतरित किया गया है।
- source_word: יִהְיוּ
  choice: '... हों!'
  rationale: यह रूप इच्छा अथवा अभिशापसूचक कामना व्यक्त करता है। हिंदी संभावनार्थक ‘हों’ उसी बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֹיְבֵי אֲדֹנִי הַמֶּלֶךְ
  choice: मेरे प्रभु राजा के शत्रु
  rationale: इससे मूल का आदरसूचक राज-दरबारी संबोधन और संबंधवाचक संरचना बनी रहती है।
- source_word: קָמוּ עָלֶיךָ
  choice: आपके विरुद्ध उठ खड़े हों
  rationale: यह इब्रानी मुहावरा शत्रुतापूर्ण विरोध या विद्रोह को सूचित करता है; ‘विरुद्ध उठ खड़े होना’ उसका स्वाभाविक हिंदी समतुल्य है।
- source_word: לְרָעָה
  choice: आपकी हानि करने के लिए
  rationale: यह वाक्यांश बुरे या हानिकारक उद्देश्य को बताता है। प्रसंग में ‘हानि करने के लिए’ स्पष्ट और स्वाभाविक है, जबकि नैतिक रूप से तटस्थ नहीं बनता।
- source_word: וַיֹּאמֶר
  choice: पूछा / उत्तर दिया
  rationale: शाब्दिक अर्थ ‘कहा’ है, पर संवाद में पहले कथन का आशय प्रश्न और दूसरे का आशय उत्तर है; इन क्रियाओं से अर्थ बिना अतिरिक्त व्याख्या के स्वाभाविक हिंदी में आता है।
theological_decisions:
- issue: कूशवासी के उत्तर में अबशालोम की मृत्यु का अप्रत्यक्ष संकेत
  choice: मृत्यु को मुख्य पाठ में स्पष्ट न करके ‘उस युवक के समान हों’ रखा गया
  alternative: ‘उनका भी वही अंत हो जो अबशालोम का हुआ’
  rationale: मूल वक्ता सीधे यह नहीं कहता कि अबशालोम मर गया है। अप्रत्यक्ष कथन दाऊद के प्रति संवेदनशीलता और शत्रुओं के लिए कामना—दोनों का तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कूशवासी’ और ‘मेरे प्रभु राजा’ मूल की भौगोलिक तथा दरबारी भाषा बचाते हैं; संवाद में अप्रत्यक्ष और भावनात्मक तनाव को स्पष्ट व्याख्या से समतल नहीं किया गया।
