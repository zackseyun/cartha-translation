translation:
  language: hi
  text: वहाँ इस्राएल के लोग दाऊद के सेवकों के सामने हार गए, और उस दिन वहाँ भारी संहार हुआ—बीस हज़ार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּנָּגְפוּ
  choice: हार गए
  rationale: निफ़ाल रूप युद्ध में पराजित होने या मार खाने का भाव देता है। ‘हार गए’ सहज आधुनिक हिन्दी में सैन्य पराजय स्पष्ट करता है, बिना यह कहे कि प्रत्येक व्यक्ति मारा गया।
- source_word: עַם יִשְׂרָאֵל
  choice: इस्राएल के लोग
  rationale: यह मूल इब्रानी का निकट अनुवाद है। प्रसंग में इससे इस्राएली लड़ाके अभिप्रेत हैं, फिर भी ‘लोग’ मूल की व्यापक अभिव्यक्ति बनाए रखता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: युद्ध-वर्णन में यह विरोधी के सामने पराजित होने का प्रचलित भाव व्यक्त करता है और हिन्दी में स्वाभाविक है।
- source_word: עַבְדֵי דָוִד
  choice: दाऊद के सेवक
  rationale: עֶבֶד का अर्थ सेवक, अधीनस्थ या अनुचर हो सकता है। यहाँ ये दाऊद के सैनिक हैं, पर ‘सेवक’ मूल पद और उनकी अधीनता दोनों को सुरक्षित रखता है।
- source_word: הַמַּגֵּפָה
  choice: संहार
  rationale: מַגֵּפָה अन्य प्रसंगों में महामारी या प्रहार का अर्थ दे सकता है, पर यहाँ युद्ध में बड़े पैमाने पर हुई घातक मार का उल्लेख है। ‘संहार’ इस प्रसंगगत अर्थ को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: גְדוֹלָה
  choice: बहुत बड़ा
  rationale: मूल विशेषण ‘बड़ा/महान’ है। ‘बहुत बड़ा संहार’ हिन्दी में स्वाभाविक ढंग से उसकी तीव्रता व्यक्त करता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह मूल कालवाचक अभिव्यक्ति का सीधा और स्वाभाविक अनुवाद है।
- source_word: עֶשְׂרִים אָלֶף
  choice: बीस हज़ार पुरुष
  rationale: इब्रानी में केवल संख्या है। युद्ध के प्रसंग में हिन्दी में ‘पुरुष’ जोड़ने से स्पष्ट होता है कि यह लड़ाकों या हताहतों की गिनती है; इसे पादटिप्पणी में बताया गया है।
