  text: The king said[a], “Turn aside; stand here.” So he turned aside and stood.
translation:
  language: hi
  text: राजा ने कहा[a], “एक ओर हटकर यहाँ खड़े हो जाओ।” तब वह एक ओर हटकर खड़ा हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुड़कर यहाँ खड़े हो जाओ।” इब्रानी क्रिया सामान्य रूप से मुड़ने का अर्थ दे सकती है, लेकिन इस प्रसंग में संभवतः अगले संदेशवाहक के लिए जगह बनाने को एक ओर हटना अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने कहा
  rationale: אמר के सामान्य कथात्मक रूप का स्वाभाविक हिन्दी समतुल्य; यह सीधे कथन का परिचय देता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित पद संदर्भ में पहले से ज्ञात राजा की ओर संकेत करता है; हिन्दी में ‘राजा’ स्वाभाविक रूप से वही निश्चित संदर्भ व्यक्त करता है।
- source_word: סֹב
  choice: एक ओर हटकर
  rationale: סבב के आज्ञार्थक रूप में सामान्यतः मुड़ने का भाव है, पर इस प्रसंग में अगले संदेशवाहक के लिए जगह देने हेतु किनारे हटना अधिक संभावित है। यह चयन प्रसंगगत गति को स्पष्ट करता है, जबकि पादटिप्पणी मूल की व्यापक संभावना बचाती है।
- source_word: הִתְיַצֵּב
  choice: खड़े हो जाओ
  rationale: יצב के हित्पाएल आज्ञार्थक का अर्थ अपने को किसी स्थान पर खड़ा करना या स्थिति लेना है; आधुनिक हिन्दी में यह सहज और स्पष्ट आदेश है।
- source_word: כֹּה
  choice: यहाँ
  rationale: इस आदेश में यह क्रियाविशेषण स्थान बताता है; ‘यहाँ’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: וַיִּסֹּב
  choice: वह एक ओर हटकर
  rationale: आदेश סֹב और उसके पालन के बीच शब्दगत संबंध बनाए रखता है तथा प्रसंग में किनारे हटने की क्रिया व्यक्त करता है।
- source_word: וַיַּעֲמֹד
  choice: खड़ा हो गया
  rationale: עמד की साधारण कथात्मक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है और आदेश के पूर्ण पालन का संकेत देता है।
