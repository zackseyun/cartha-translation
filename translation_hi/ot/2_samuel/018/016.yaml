id: 2SA.18.16
reference: 2 Samuel 18:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּתְקַ֤ע יוֹאָב֙ בַּ/שֹּׁפָ֔ר וַ/יָּ֣שָׁב הָ/עָ֔ם מִ/רְדֹ֖ף אַחֲרֵ֣י יִשְׂרָאֵ֑ל כִּֽי חָשַׂ֥ךְ יוֹאָ֖ב אֶת הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/016.yaml
  text: Then Joab blew the trumpet[a], and the people turned back from pursuing Israel[c][b], because Joab restrained the people.
translation:
  language: hi
  text: तब योआब ने नरसिंगा[a] फूँका, और लोग इस्राएल का पीछा करना छोड़कर लौट आए[b], क्योंकि योआब ने लोगों को रोक दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सींग।” इब्रानी ‘शोफ़ार’ संकेत देने के लिए फूँका जाने वाला सींग था, जो प्रायः मेढ़े का सींग होता था।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “इस्राएल” से अबशालोम के पक्ष में लड़ रही इस्राएली सेना अभिप्रेत है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְקַע
  choice: फूँका
  rationale: שׁוֹפָר के साथ תקע का अर्थ किसी संकेत देने वाले नरसिंगे को फूँकना है; हिंदी में यह स्वाभाविक और ठोस क्रिया है।
- source_word: בַּשֹּׁפָר
  choice: नरसिंगा
  rationale: שׁוֹפָר संकेत देने के लिए प्रयुक्त पशु-सींग का वाद्य है। ‘नरसिंगा’ सैन्य संकेत के प्रसंग में सुबोध है, जबकि पादटिप्पणी उसके भौतिक स्वरूप को स्पष्ट करती है।
- source_word: וַיָּשָׁב הָעָם מִרְדֹף
  choice: लोग ... पीछा करना छोड़कर लौट आए
  rationale: שׁוּב और מִן सहित धातुरूप पीछा करने से हटकर लौटने को व्यक्त करते हैं। हिंदी में यह क्रम अर्थ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: אַחֲרֵי יִשְׂרָאֵל
  choice: इस्राएल का
  rationale: मूल पाठ का नाम ‘इस्राएल’ बनाए रखा गया है; प्रसंग में इससे अबशालोम के पक्ष की इस्राएली सेना अभिप्रेत है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי पीछा रुकने का कारण बताता है।
- source_word: חָשַׂךְ אֶת הָעָם
  choice: लोगों को रोक दिया
  rationale: חשׂך में रोकने, थामने अथवा बचाए रखने की अर्थ-सीमा है। इस सैन्य प्रसंग में योआब द्वारा अपने लोगों की आगे की कार्रवाई रोकना सर्वाधिक स्वाभाविक है, पर ‘बचा लिया’ जैसा उद्देश्य आरोपित नहीं किया गया।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, कथात्मक और सहज शैली रखी गई है। ‘लोग’ मूल הָעָם के अनुरूप है, यद्यपि प्रसंग में योआब के सैनिक अभिप्रेत हैं।
