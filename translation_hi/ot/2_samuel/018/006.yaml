lexical_decisions:
- source_word: הָעָם
  choice: दाऊद की सेना
  rationale: मूल शब्द का सामान्य अर्थ ‘लोग’ है, पर यहाँ प्रसंग दाऊद के युद्ध-दल का है। ‘दाऊद की सेना’ दोनों पक्षों की पहचान स्पष्ट करते हुए स्वाभाविक हिन्दी देता है।
- source_word: הַשָּׂדֶה
  choice: मैदान में
  rationale: שָׂדֶה का अर्थ ‘मैदान/खुला प्रदेश’ है। ‘निकली’ के साथ ‘मैदान में’ हिन्दी में स्वाभाविक रूप से गमन का भाव व्यक्त करता है।
- source_word: לִקְרַאת
  choice: का सामना करने
  rationale: इसका मूल भाव ‘मिलने/सामना करने’ का है। युद्ध के प्रसंग में ‘सामना करने’ विरोधी मुठभेड़ को स्वाभाविक रूप से व्यक्त करता है, बिना अतिरिक्त विवरण जोड़े।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: मूल पाठ के जातीय नाम को ज्यों का त्यों रखा गया है; प्रसंग में यह अबशालोम के पक्ष की सेनाओं को सूचित करता है।
- source_word: הַמִּלְחָמָה
  choice: लड़ाई
  rationale: यहाँ शब्द किसी व्यापक युद्ध के बजाय उस विशेष मुठभेड़ को दर्शाता है; आधुनिक सामान्य हिन्दी में ‘लड़ाई’ सहज और सटीक है।
- source_word: וַתְּהִי
  choice: हुई
  rationale: घटना-सूचक संज्ञा के साथ ‘हुई’ मूल के ‘होना/घटित होना’ भाव का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: בְּיַעַר אֶפְרָיִם
  choice: एप्रैम के वन में
  rationale: संरचना को सीधा रखते हुए יַעַר को ‘वन’ और स्थाननाम אֶפְרָיִם को ‘एप्रैम’ दिया गया है; पाठ से बाहर जाकर भौगोलिक प्रश्न हल नहीं किया गया।
