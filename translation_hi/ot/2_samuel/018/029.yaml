base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/029.yaml
  text: And the king said[a], “Is it well with the young man Absalom?” Ahimaaz said, “I saw a great commotion when Joab sent the king’s servant and your servant, but I did not know what it was.”
translation:
  language: hi
  text: राजा ने पूछा, “क्या उस जवान अबशालोम का कुशल-मंगल है?” अहीमाअस ने कहा, “जब योआब ने राजा के सेवक और आपके सेवक को भेजा, तब मैंने बड़ी हलचल[a] देखी; पर मैं नहीं जानता था कि बात क्या थी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बड़ी भीड़” अथवा “बड़ा कोलाहल”; इब्रानी शब्द भीड़, शोर या उथल-पुथल को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: क्या ... का कुशल-मंगल है?
  rationale: प्रश्नवाचक प्रसंग में यह शब्द अबशालोम की दशा और भलाई पूछता है। ‘कुशल-मंगल’ सुरक्षा तक अर्थ को सीमित किए बिना स्वाभाविक हिन्दी में समग्र कुशलता व्यक्त करता है।
- source_word: לַנַּעַר לְאַבְשָׁלוֹם
  choice: उस जवान अबशालोम
  rationale: נַעַר यहाँ ‘जवान/युवक’ है। ‘उस जवान अबशालोम’ मूल की परोक्ष पहचान और दाऊद के भावनात्मक लगाव के साथ उसकी दूरी—दोनों को बनाए रखता है।
- source_word: הֶהָמוֹן הַגָּדוֹל
  choice: बड़ी हलचल
  rationale: הָמוֹן भीड़, शोर या उपद्रव/हलचल को सूचित कर सकता है। प्रसंग में ‘बड़ी हलचल’ इस अर्थ-व्याप्ति को सहज रूप में व्यक्त करती है, जबकि अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: לִשְׁלֹחַ
  choice: जब ... भेजा
  rationale: ל से जुड़े infinitive construct को यहाँ कालवाचक उपवाक्य के रूप में लेना प्रसंग और आधुनिक हिन्दी दोनों में स्वाभाविक है।
- source_word: עֶבֶד הַמֶּלֶךְ
  choice: राजा के सेवक
  rationale: עֶבֶד इस प्रसंग में राजकीय अधीनस्थ या दूत को दर्शाता है; ‘सेवक’ उसकी भूमिका को अनावश्यक रूप से दासत्व पर बल दिए बिना व्यक्त करता है।
- source_word: וְאֶת עַבְדֶּךָ
  choice: और आपके सेवक
  rationale: अहीमाअस अपने लिए दरबारी विनम्रता का सूत्र प्रयोग करता है। ‘आपके सेवक’ उस आत्म-संदर्भ और आदरभाव को सुरक्षित रखता है।
- source_word: וְלֹא יָדַעְתִּי מָה
  choice: पर मैं नहीं जानता था कि बात क्या थी
  rationale: इब्रानी वाक्यांश जानबूझकर संक्षिप्त है—‘मैं नहीं जानता था क्या।’ हिन्दी में ‘कि बात क्या थी’ निहित आशय को बिना नया तथ्य जोड़े स्वाभाविक बनाता है।
