  yaml_path: translation/ot/2_samuel/018/024.yaml
  text: David was sitting between the two gates[a], and the watchman went up to the roof of the gate by the wall. He lifted up his eyes and looked, and behold, a man was running alone.
translation:
  language: hi
  text: दाऊद दोनों फाटकों[a] के बीच बैठा हुआ था। पहरेदार शहरपनाह के पास फाटक की छत पर चढ़ गया। उसने आँखें उठाकर देखा, और देखो, एक आदमी अकेला दौड़ रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दोनों फाटक-भवनों के बीच”; इब्रानी में अक्षरशः “दोनों फाटकों के बीच” है। सम्भवतः आशय किलेबंद प्रवेश-द्वार के भीतर के स्थान से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: बैठा हुआ था
  rationale: इब्रानी कृदन्त उस समय दाऊद की जारी अवस्था को दिखाता है; ‘बैठा हुआ था’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בֵּין שְׁנֵי הַשְּׁעָרִים
  choice: दोनों फाटकों के बीच
  rationale: मूल पाठ अक्षरशः ‘दो फाटकों के बीच’ कहता है। सम्भवतः यह किलेबन्द प्रवेश-द्वार के बाहरी और भीतरी फाटक के बीच का स्थान है, पर पाठ इससे अधिक स्पष्ट नहीं करता।
- source_word: הַצֹּפֶה
  choice: पहरेदार
  rationale: यह उस व्यक्ति के लिए प्रयुक्त कृदन्त-संज्ञा है जो निगरानी करता है; नगर-रक्षा के प्रसंग में ‘पहरेदार’ सहज और स्पष्ट है।
- source_word: אֶל גַּג הַשַּׁעַר אֶל הַחוֹמָה
  choice: शहरपनाह के पास वाले फाटक की छत पर
  rationale: वाक्यांश फाटक की ऊपरी छत और शहरपनाह से उसके स्थानिक सम्बन्ध को बताता है। यह अनुवाद स्थापत्य के बारे में अनावश्यक निश्चितता जोड़े बिना अर्थ स्पष्ट करता है।
- source_word: וַיִּשָּׂא אֶת עֵינָיו
  choice: उसने आँखें उठाकर देखा
  rationale: इब्रानी मुहावरे की छवि को बनाए रखते हुए यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וַיַּרְא וְהִנֵּה
  choice: देखा, और देखो
  rationale: यह क्रम देखने की क्रिया और अचानक सामने आए दृश्य, दोनों को उभारता है; ‘और देखो’ הִנֵּה की संकेतात्मक शक्ति बनाए रखता है।
- source_word: אִישׁ
  choice: एक पुरुष
  rationale: संज्ञा एक पुरुष व्यक्ति को दर्शाती है; ‘पुरुष’ लिंग-सटीक है और यहाँ अज्ञात धावक के लिए उपयुक्त है।
- source_word: רָץ
  choice: दौड़ा आ रहा था
  rationale: कृदन्त पहरेदार की दृष्टि में उस व्यक्ति को दौड़ने की जारी क्रिया में प्रस्तुत करता है। प्रसंग में वह नगर की ओर संदेश लेकर आ रहा है, इसलिए हिन्दी का ‘आ रहा था’ दृश्य की दिशा स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְבַדּוֹ
  choice: अकेला
  rationale: यह स्पष्ट करता है कि धावक के साथ कोई और नहीं था और हिन्दी में संक्षिप्त तथा स्वाभाविक है।
