  text: Then David mustered the people who were with him and appointed over them commanders of thousands and commanders of hundreds[a][b].
translation:
  language: hi
  text: तब दाऊद ने अपने साथ के लोगों का सैनिकों के रूप में निरीक्षण किया[a] और उनके ऊपर हज़ारों के अधिकारी और सैकड़ों के अधिकारी नियुक्त किए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी गिनती की” अथवा “सैनिकों की गणना की”; इब्रानी क्रिया सैन्य संदर्भ में केवल गिनने के बजाय सैनिकों का निरीक्षण या उनकी व्यवस्था करने का भाव भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “हज़ारों के अधिकारी और सैकड़ों के अधिकारी।” “लोगों” से यहाँ दाऊद के साथ की सैन्य शक्ति का संकेत है; संख्याएँ सैन्य दलों या इकाइयों को भी सूचित कर सकती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: सैनिक गिनती ली
  rationale: सैन्य संदर्भ में פקד का अर्थ केवल संख्या गिनना नहीं, बल्कि सैनिकों की गणना, निरीक्षण और व्यवस्थित जमाव करना भी है; यह अभिव्यक्ति उस व्यापक सैन्य-प्रशासनिक भाव को सहज हिन्दी में देती है।
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: अपने साथ के लोगों
  rationale: עם का मूल अर्थ ‘लोग’ सुरक्षित रखा गया है, और אֲשֶׁר אִתּוֹ को स्वाभाविक हिन्दी में व्यक्त किया गया है; संदर्भ से स्पष्ट है कि ये दाऊद के साथ की लड़ाकू टुकड़ी हैं।
- source_word: וַיָּשֶׂם עֲלֵיהֶם
  choice: उन पर ... नियुक्त किए
  rationale: שׂים עַל यहाँ अधिकार के पद पर रखने या नियुक्त करने का संकेत देता है।
- source_word: שָׂרֵי
  choice: प्रधान
  rationale: שׂר सैन्य नेता या अधिकारी को दर्शाता है; ‘प्रधान’ हिन्दी बाइबलीय गद्य में dignified और समझने योग्य है, जबकि संदर्भ इसके सैन्य पद को स्पष्ट करता है।
- source_word: אֲלָפִים וְשָׂרֵי מֵאוֹת
  choice: हज़ार-हज़ार और सौ-सौ के प्रधान
  rationale: यह मानक सैन्य-प्रशासनिक जोड़ी है। पुनरुक्त संख्या-रूप हिन्दी में संबंधित सैनिक समूहों पर अधिकारियों का अर्थ स्पष्ट करता है, पर इकाइयों की सटीक संरचना को आवश्यकता से अधिक निश्चित नहीं करता।
