  text: וַ/יֹּ֤אמֶר הָ/אִישׁ֙ אֶל יוֹאָ֔ב ו/לא אָנֹכִ֜י שֹׁקֵ֤ל עַל כַּפַּ/י֙ אֶ֣לֶף כֶּ֔סֶף לֹֽא אֶשְׁלַ֥ח יָדִ֖/י אֶל בֶּן הַ/מֶּ֑לֶךְ כִּ֣י בְ/אָזְנֵ֜י/נוּ צִוָּ֣ה הַ/מֶּ֗לֶךְ אֹ֠תְ/ךָ וְ/אֶת אֲבִישַׁ֤י וְ/אֶת אִתַּי֙ לֵ/אמֹ֔ר שִׁמְרוּ מִ֕י בַּ/נַּ֖עַר בְּ/אַבְשָׁלֽוֹם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/012.yaml
  text: But the man said to Joab[a], “Even if I were weighing out a thousand pieces of silver on my palms, I would not put out my hand against the king’s son; for in our hearing the king commanded you and Abishai and Ittai, saying[b], ‘Guard for me the young man Absalom.’”
translation:
  language: hi
  text: पर उस आदमी ने योआब से कहा, “चाहे मेरी हथेलियों पर चाँदी के एक हज़ार टुकड़े तौले जाते[a], फिर भी मैं राजा के पुत्र पर हाथ न उठाता; क्योंकि राजा ने हमारे सुनते हुए तुम्हें, अबीशै और इत्तै को यह आज्ञा दी थी[b], ‘मेरे लिए उस जवान अबशालोम की रक्षा करना।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “मेरी हथेलियों पर एक हज़ार चाँदी तौली जाती।” इसका आशय वजन से दी जाने वाली बड़ी रकम प्राप्त करना है।
    reason: lexical_alternative
  - marker: b
    text: पद के अंत में इब्रानी पाठ कठिन है; शब्दशः उसमें “रक्षा करो मी उस जवान अबशालोम” आता है, जहाँ “मी” (מִי) कठिन शब्द है। बहुत से लोग 18:5 के समानांतर कथन के आधार पर इसका अर्थ, “मेरे लिए उस जवान अबशालोम की रक्षा करना,” समझते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: שֹׁקֵל עַל כַּפַּי אֶלֶף כֶּסֶף
  choice: चाहे मेरी हथेलियों पर चाँदी के एक हज़ार टुकड़े तौलकर रख दिए जाते
  rationale: इब्रानी वाक्यांश हथेलियों पर चाँदी तौले जाने, अर्थात बड़ी रकम दिए जाने, का चित्र प्रस्तुत करता है। इकाई का नाम मूल में नहीं है, इसलिए ‘शेकेल’ जोड़ने के बजाय ‘चाँदी के ... टुकड़े’ रखा गया है।
- source_word: לֹא אֶשְׁלַח יָדִי אֶל
  choice: फिर भी मैं ... पर हाथ न उठाता
  rationale: यह हिंसक कार्रवाई करने का मुहावरा है। ‘हाथ उठाना’ हिन्दी में स्वाभाविक है और मूल की हस्त-छवि को बनाए रखता है।
- source_word: בֶּן הַמֶּלֶךְ
  choice: राजा के पुत्र
  rationale: यह सीधा संबंधसूचक पदबंध है; ‘पुत्र’ प्रसंग के अनुरूप गरिमापूर्ण और स्पष्ट है।
- source_word: בְאָזְנֵינוּ
  choice: हमारे सुनते हुए
  rationale: शाब्दिक अर्थ ‘हमारे कानों में’ है, पर आशय है कि उपस्थित लोगों ने आज्ञा स्वयं सुनी थी।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: क्रिया राजकीय अधिकार से दिए गए स्पष्ट आदेश को व्यक्त करती है।
- source_word: שִׁמְרוּ
  choice: रक्षा करना
  rationale: इस प्रसंग में क्रिया का आशय अबशालोम को सुरक्षित रखना है; हिन्दी में ‘रक्षा करना’ स्वाभाविक है और सैन्य संदर्भ के अनुकूल है।
- source_word: מִי בַּנַּעַר בְּאַבְשָׁלוֹם
  choice: मेरे लिए उस जवान अबशालोम की रक्षा करना
  rationale: मसोरा-पाठ का מִי कठिन है। 18:5 के समानांतर आदेश और संदर्भ के आधार पर मुख्य पाठ में ‘मेरे लिए’ रखा गया है, जबकि पाठगत कठिनाई को पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: הָאִישׁ
  choice: उस आदमी
  rationale: निश्चित उपपद कथा में पहले से उल्लिखित विशिष्ट व्यक्ति की ओर संकेत करता है।
- source_word: וְלֹא אָנֹכִי
  choice: फिर भी मैं ... न उठाता
  rationale: सर्वनाम वक्ता के दृढ़ इनकार पर बल देता है; हिन्दी में concessive रचना ‘चाहे... फिर भी’ इस बल को स्वाभाविक रूप से व्यक्त करती है।
theological_decisions:
- issue: अबशालोम के विषय में राजा की आज्ञा में कठिन मसोरा-पाठ מִי
  choice: मेरे लिए उस जवान अबशालोम की रक्षा करना
  alternative: उस जवान अबशालोम की रक्षा करना / कौन उस जवान अबशालोम के साथ...
  rationale: पाठ को बिना सूचना दिए संशोधित मान लेने के बजाय संदर्भ-संगत अर्थ मुख्य पाठ में दिया गया है और वास्तविक पाठगत अस्पष्टता पाद-टिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘हाथ उठाना’ और ‘हमारे सुनते हुए’ जैसे स्वाभाविक हिन्दी प्रयोग मूल इब्रानी बिंब और आशय दोनों को यथासंभव बनाए रखते हैं। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
