  text: וַ/יִּקְח֣וּ אֶת אַבְשָׁל֗וֹם וַ/יַּשְׁלִ֨יכוּ אֹת֤/וֹ בַ/יַּ֨עַר֙ אֶל הַ/פַּ֣חַת הַ/גָּד֔וֹל וַ/יַּצִּ֧בוּ עָלָ֛י/ו גַּל אֲבָנִ֖ים גָּד֣וֹל מְאֹ֑ד וְ/כָל יִשְׂרָאֵ֔ל נָ֖סוּ אִ֥ישׁ ל/אהל/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/017.yaml
  text: And they took Absalom and threw him into the great pit in the forest[a], and they set up over him a very large heap of stones. And all Israel fled[b], each man to his tent.
translation:
  language: hi
  text: उन्होंने अबशालोम को लेकर वन में उस बड़े गड्ढे में फेंक दिया और उसके ऊपर पत्थरों का बहुत बड़ा ढेर लगा दिया। और सब इस्राएली अपने-अपने डेरे की ओर भाग गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: उठाकर
  rationale: संदर्भ में मृत देह को लेकर गड्ढे तक पहुँचाने का भाव है; हिंदी में संयुक्त क्रिया ‘उठाकर ... फेंक दिया’ स्वाभाविक है और मूल से अतिरिक्त हिंसा नहीं जोड़ती।
- source_word: וַיַּשְׁלִיכוּ
  choice: फेंक दिया
  rationale: שׁלך द्वारा व्यक्त बलपूर्वक और अपमानजनक निपटान को वर्तमान हिंदी में स्पष्ट रूप से व्यक्त करता है।
- source_word: בַיַּעַר
  choice: वन में
  rationale: יער का सीधा, गरिमापूर्ण और प्रसंगानुकूल हिंदी पर्याय।
- source_word: אֶל הַפַּחַת הַגָּדוֹל
  choice: उस बड़े गड्ढे में
  rationale: פחת यहाँ गड्ढा या गर्त है; निकटवर्ती निश्चित पद के कारण ‘उस’ हिंदी में स्वाभाविक है।
- source_word: וַיַּצִּבוּ עָלָיו
  choice: उसके ऊपर ... लगा दिया
  rationale: पत्थरों के ढेर को उसके ऊपर स्थापित करने का भौतिक चित्र बनाए रखता है; ‘लगा दिया’ आधुनिक हिंदी में ढेर खड़ा करने के लिए स्वाभाविक है।
- source_word: גַּל אֲבָנִים גָּדוֹל מְאֹד
  choice: पत्थरों का एक बहुत बड़ा ढेर
  rationale: גל का पारदर्शी अर्थ ‘ढेर’ है और גדול מאד की तीव्रता ‘बहुत बड़ा’ से सुरक्षित रहती है।
- source_word: וְכָל יִשְׂרָאֵל
  choice: फिर सब इस्राएली
  rationale: सामूहिक ‘इस्राएल’ को हिंदी में लोगों के संदर्भ में ‘सब इस्राएली’ कहना स्पष्ट और स्वाभाविक है।
- source_word: נָסוּ
  choice: भाग गए
  rationale: נוס का सामान्य अर्थ भय या पराजय में भागना है; यह आधुनिक कथात्मक हिंदी में ‘पलायन कर गए’ से अधिक सहज है।
- source_word: אִישׁ לְאֹהָלוֹ
  choice: अपने-अपने डेरे को
  rationale: वितरणात्मक אישׁ को हिंदी का स्वाभाविक ‘अपने-अपने’ व्यक्त करता है और אהל की मूल छवि ‘डेरे’ में बनी रहती है।
theological_decisions:
- issue: אִישׁ לְאֹהָלוֹ में पुल्लिंग वितरणात्मक रूप
  choice: अपने-अपने डेरे को
  alternative: हर पुरुष अपने डेरे को
  rationale: इब्रानी אישׁ यहाँ रूढ़ वितरणात्मक अभिव्यक्ति है। हिंदी में ‘अपने-अपने’ सभी संबंधित सैनिकों के अलग-अलग लौटने का भाव अधिक स्वाभाविक रूप से देता है, बिना अनावश्यक रूप से ‘पुरुष’ जोड़ने के।
- issue: לְאֹהָלוֹ का शाब्दिक अथवा मुहावरेदार अर्थ
  choice: डेरे को
  alternative: अपने-अपने घर को
  rationale: ‘डेरा’ मूल की तंबू/निवास वाली छवि सुरक्षित रखता है और हिंदी में समझने योग्य है; ‘घर’ मुहावरे का भाव खोलता, पर स्रोत की ठोस छवि खो देता।
translation_notes:
  register: आधुनिक मानक हिंदी की गरिमापूर्ण कथात्मक शैली। सरल क्रियाएँ और प्रचलित बाइबलीय नाम-रूप अपनाए गए हैं। पाठ में कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘गड्ढा’, ‘ढेर’ और ‘डेरे’ अर्थ को पर्याप्त स्पष्टता से व्यक्त करते हैं।
