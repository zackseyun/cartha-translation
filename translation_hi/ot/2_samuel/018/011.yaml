base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/011.yaml
  text: Then Joab said to the man who had told him[a], “Look, you saw him[b]; why then did you not strike him there to the ground? And I would have been obliged to give you ten pieces of silver and one belt.”
translation:
  language: hi
  text: तब योआब ने उस आदमी से, जिसने उसे यह समाचार दिया था, कहा, “देखो, तुमने उसे देखा था; फिर तुमने उसे वहीं प्रहार करके धरती पर क्यों नहीं गिरा दिया? और तुम्हें चाँदी के दस टुकड़े[a] और एक कमरबंद देना मेरा दायित्व होता।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में शाब्दिक रूप से ‘दस चाँदी’ है; कोई निश्चित इकाई नहीं बताई गई है।
    reason: lexical_alternative
  - marker: b
    text: इस इब्रानी मुहावरे का अधिक शाब्दिक रूप है, ‘तुम्हें देना मुझ पर होता।’ इसका अर्थ ‘मैं तुम्हें चाँदी के दस टुकड़े और एक कमरबंद देता’ भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּגִּיד לֹו
  choice: जिसने उसे यह समाचार दिया था
  rationale: निश्चित उपपद के साथ कृदंत यहाँ संज्ञा के समान प्रयुक्त है—‘उसे समाचार देनेवाला।’ प्रसंग में पहले दिए जा चुके समाचार को स्वाभाविक हिन्दी में व्यक्त करने के लिए भूतपूर्ण रूप चुना गया है।
- source_word: וְהִנֵּה
  choice: क्या!
  rationale: यहाँ यह शब्द योआब की आश्चर्य और उलाहने से भरी तीखी प्रतिक्रिया प्रकट करता है। ‘क्या!’ आधुनिक हिन्दी में उस उद्गारात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: רָאִיתָ
  choice: तुमने उसे देखा था
  rationale: इब्रानी में कर्म प्रसंग से समझा जाता है; हिन्दी में स्पष्टता के लिए ‘उसे’ जोड़ा गया है, जिसका संकेत अबशालोम की ओर है।
- source_word: הִכִּיתוֹ שָׁם אָרְצָה
  choice: वहीं उस पर प्रहार करके उसे भूमि पर ... गिरा दिया
  rationale: נכה का मूल भाव प्रहार करना है और אָרְצָה दिशा सूचक रूप में ‘भूमि की ओर/भूमि पर’ है। यह अनुवाद जानलेवा आशय की संभावना बनाए रखते हुए सीधे ‘मार डालना’ कहकर अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וְעָלַי לָתֶת לְךָ
  choice: तुम्हें ... देना मेरा दायित्व होता
  rationale: עָלַי और धात्वर्थक संज्ञा का मुहावरा दायित्व या उत्तरदायित्व व्यक्त करता है—शाब्दिक रूप से ‘तुम्हें देना मुझ पर होता।’ हिन्दी रूप इस बाध्यकारी भाव को सुरक्षित रखता है।
- source_word: עֲשָׂרָה כֶסֶף
  choice: चाँदी के दस टुकड़े
  rationale: मूल पाठ में शाब्दिक रूप से ‘दस चाँदी’ है और माप या मुद्रा की इकाई नहीं दी गई। इसलिए ‘शेकेल’ या ‘सिक्के’ जैसी अधिक विशिष्ट धारणा जोड़ने के बजाय ‘टुकड़े’ रखा गया है।
- source_word: חֲגֹרָה אֶחָת
  choice: एक कमरबंद
  rationale: חֲגֹרָה कमर में बाँधी जानेवाली पेटी या पट्टी है। ‘कमरबंद’ आधुनिक, स्पष्ट और प्रसंगानुकूल हिन्दी समतुल्य है; ‘एक’ मूल की संख्या को भी बनाए रखता है।
theological_decisions:
- issue: योआब के कथन में प्रतिफल देने का भाव साधारण भविष्यगत क्रिया है या दायित्व
  choice: ‘देना मेरा दायित्व होता’—दायित्व का भाव सुरक्षित रखा गया है।
  alternative: ‘मैं तुम्हें ... देता’
  rationale: इब्रानी עָלַי + धात्वर्थक संज्ञा केवल संभावित देने की क्रिया नहीं, बल्कि वक्ता पर आनेवाले दायित्व का संकेत देती है। इसे किसी धार्मिक या नैतिक अनुमोदन के रूप में नहीं, केवल योआब के कथन के रूप में प्रस्तुत किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। योआब के उद्गार और उलाहने को स्वाभाविक संवाद शैली में व्यक्त किया गया है। ‘प्रहार’ मूल क्रिया की व्यापकता बनाए रखता है, जबकि ‘भूमि पर गिरा देना’ प्रसंग की हिंसक तीव्रता स्पष्ट करता है।
