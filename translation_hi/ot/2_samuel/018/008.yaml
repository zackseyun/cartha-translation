lexical_decisions:
- source_word: נפצית
  choice: फैल गया
  rationale: निफ़अल कृदंत युद्ध के विस्तृत क्षेत्र में फैल जाने या बिखर जाने का भाव देता है। ‘फैल गया’ आधुनिक हिन्दी में स्वाभाविक है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: पूरे प्रदेश में
  rationale: यहाँ הָאָרֶץ का संदर्भ युद्ध के स्थानीय भूभाग से है, पूरी पृथ्वी से नहीं। ‘पूरे प्रदेश में’ व्यापक भौगोलिक विस्तार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַיַּעַר
  choice: वन
  rationale: יַעַר वनाच्छादित क्षेत्र को दर्शाता है। ‘वन’ कथा की गरिमा और सजीव चित्र दोनों बनाए रखता है।
- source_word: לֶאֱכֹל / אָכְלָה
  choice: निगल लिया / निगला
  rationale: ‘खाने’ की इब्रानी उपमा यहाँ मृत्यु का कारण बनने के अर्थ में है। ‘निगलना’ वन और तलवार दोनों के मानवीकरण तथा मूल की पुनरावृत्ति को बनाए रखता है।
- source_word: וַיֶּרֶב ... מֵאֲשֶׁר
  choice: जितने...उससे अधिक
  rationale: רבה और מֵאֲשֶׁר मिलकर स्पष्ट तुलना करते हैं कि तलवार की अपेक्षा वन के कारण अधिक लोग मरे। यह रचना हिन्दी में तुलना को साफ और स्वाभाविक बनाती है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह समय-सूचक वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप है।
