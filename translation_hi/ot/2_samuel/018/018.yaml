  yaml_path: translation/ot/2_samuel/018/018.yaml
  text: Absalom had taken and set up for himself in his lifetime the pillar that is in the Valley of the King[a], for he said, “I have no son to keep my name in remembrance.” So he called the pillar by his own name, and it is called Absalom’s Monument to this day.
translation:
  language: hi
  text: अबशालोम ने अपने जीवनकाल में एक स्मारक-स्तंभ लेकर अपने लिए खड़ा किया था, जो राजा की घाटी में है, क्योंकि उसने कहा था, “मेरा कोई पुत्र नहीं है जो मेरे नाम को स्मरण में बनाए रखे।” इसलिए उसने उस स्मारक-स्तंभ का नाम अपने नाम पर रखा, और आज तक वह “अबशालोम का हाथ”[a] कहलाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ “अबशालोम का हाथ” है। यहाँ “हाथ” स्मारक या स्मृति-चिह्न के अर्थ में प्रयुक्त हुआ है।
    reason: मूल इब्रानी की विशिष्ट अभिव्यक्ति को सुरक्षित रखते हुए उसका प्रसंगगत अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: לָקַח וַיַּצֶּב לוֹ
  choice: अपने लिए ... खड़ा किया था
  rationale: लָקַח के साथ וַיַּצֶּב का संयुक्त भाव स्तंभ को अपने लिए स्थापित करने का है; हिंदी में ‘खड़ा किया था’ पूर्वकालीन वर्णन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְחַיּו
  choice: अपने जीवनकाल में
  rationale: यह पद स्पष्ट करता है कि अबशालोम ने यह काम जीवित रहते किया था।
- source_word: מַצֶּבֶת
  choice: स्मारक-स्तंभ
  rationale: शब्द एक खड़े किए गए पत्थर या स्तंभ को दर्शाता है; प्रसंग में उसका स्मारकीय उद्देश्य भी स्पष्ट है, इसलिए संयुक्त पद ठोस रूप और प्रयोजन दोनों बचाता है।
- source_word: בְּעֵמֶק הַמֶּלֶךְ
  choice: राजा की घाटी में
  rationale: स्थाननाम का निकट और सहज हिंदी रूप।
- source_word: בַּעֲבוּר הַזְכִּיר שְׁמִי
  choice: जो मेरे नाम की स्मृति बनाए रखे
  rationale: हिफ़ील infinitive नाम को याद बनाए रखने या स्मरण कराने का प्रयोजन व्यक्त करता है।
- source_word: וַיִּקְרָא לַמַּצֶּבֶת עַל שְׁמוֹ
  choice: उस स्मारक-स्तंभ को अपना नाम दिया
  rationale: हिब्रू मुहावरे का अर्थ है कि उसने स्तंभ का नाम अपने नाम पर रखा; यह हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: יַד אַבְשָׁלוֹם
  choice: अबशालोम का हाथ
  rationale: ‘हाथ’ मूल पाठ की असामान्य किंतु जानबूझकर प्रयुक्त संज्ञा है और यहाँ स्मारक या चिह्न के अर्थ में है; मुख्य पाठ में इसे सुरक्षित रखकर पादटिप्पणी में अर्थ स्पष्ट किया गया है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: नाम के लेखक के समय तक प्रचलित रहने का मानक हिंदी कथन।
