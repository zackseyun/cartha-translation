base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/031.yaml
  text: And behold[a], the Cushite came, and the Cushite said, “Let my lord the king receive the good news[b], for Yahweh has vindicated you today from the hand of all who rose up against you.”
translation:
  language: hi
  text: और देखो, कूशी[a] आ पहुँचा। कूशी ने कहा, “मेरे प्रभु राजा, शुभ समाचार सुनें! क्योंकि यहोवा ने आज आपको उन सबके हाथ से न्याय दिलाया है जो आपके विरुद्ध उठ खड़े हुए थे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात कूश देश का व्यक्ति; परंपरागत रूप से इसे “इथियोपियाई” भी कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह कथानक में नए आगमन को सजीव और तत्काल रूप से सामने लाने वाले संकेतक का स्वाभाविक हिन्दी रूप है।
- source_word: הַכּוּשִׁי
  choice: कूशी
  rationale: निश्चित उपपद सहित प्रयुक्त जातीय/भौगोलिक संबोधन को व्यक्ति के नाम के बजाय कूश के निवासी के रूप में रखा गया है।
- source_word: בָּא
  choice: आ पहुँचा
  rationale: संदर्भ में दूत के आगमन को साधारण ‘आया’ की अपेक्षा अधिक स्वाभाविक कथात्मक हिन्दी में व्यक्त करता है।
- source_word: יִתְבַּשֵּׂר
  choice: शुभ समाचार सुनें
  rationale: हित्पएल अपूर्ण रूप यहाँ विनम्र इच्छासूचक घोषणा है; हिन्दी में यह राजकीय संबोधन के साथ सहज है और संदेश पाने का भाव रखता है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: मेरे प्रभु राजा
  rationale: यह दरबारी सम्मानसूचक संबोधन है; ‘प्रभु’ यहाँ राजा के लिए है, देवत्व का संकेत नहीं।
- source_word: שְׁפָטְךָ
  choice: आपके पक्ष में न्याय किया है
  rationale: שׁפט के न्यायिक अर्थ को बनाए रखते हुए यह स्पष्ट करता है कि यहोवा ने दाऊद के पक्ष में निर्णय किया; केवल ‘आपका न्याय किया’ हिन्दी में उसके विरुद्ध न्याय का अर्थ दे सकता था।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: הַיּוֹם
  choice: आज
  rationale: मूल के कालगत बल का सीधा और स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: מִיַּד כָּל הַקָּמִים עָלֶיךָ
  choice: उन सबके विरुद्ध ... जो आपके विरुद्ध उठ खड़े हुए थे
  rationale: ‘हाथ से’ का शाब्दिक रूप इस वाक्य में असहज और अस्पष्ट होता; न्यायिक-उद्धारकारी संबंध को ‘विरुद्ध’ से व्यक्त किया गया, जबकि קום על की विद्रोही क्रिया ‘उठ खड़े हुए’ में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; इसलिए उसे उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में रखा गया है।
- issue: שְׁפָטְךָ का न्यायिक और उद्धारकारी भाव
  choice: आपके पक्ष में न्याय किया है
  alternative: आपको निर्दोष ठहराया है / आपको न्याय दिलाया है / आपके लिए न्याय किया है
  rationale: मूल क्रिया न्याय करने की भाषा रखती है, पर प्रसंग में कार्य राजा के पक्ष में और उसके विरोधियों के विरुद्ध है। मुख्य पाठ न्यायिक रूपक को रखता है और पादटिप्पणी अन्य संभव अर्थछटाएँ बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘मेरे प्रभु राजा’ दरबारी सम्मान को बनाए रखता है। विस्मयादिबोधक चिह्न शुभ समाचार की घोषणा का उत्साह व्यक्त करता है। जातीय पद ‘कूशी’ को नाम न बनाकर उसके मूल अर्थ सहित पादटिप्पणी दी गई है।
