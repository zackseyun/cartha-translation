  text: וַ/יֹּ֨סֶף ע֜וֹד אֲחִימַ֤עַץ בֶּן צָדוֹק֙ וַ/יֹּ֣אמֶר אֶל יוֹאָ֔ב וִ֣/יהִי מָ֔ה אָרֻֽצָה נָּ֥א גַם אָ֖נִי אַחֲרֵ֣י הַ/כּוּשִׁ֑י וַ/יֹּ֣אמֶר יוֹאָ֗ב לָֽ/מָּה זֶּ֞ה אַתָּ֥ה רָץ֙ בְּנִ֔/י וּ/לְ/כָ֖ה אֵין בְּשׂוֹרָ֥ה מֹצֵֽאת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/022.yaml
  text: Then Ahimaaz son of Zadok said again to Joab[a], “Whatever happens, please let me also run after the Cushite.” But Joab said, “Why would you run, my son[b], since you have no message that will bring reward?”
translation:
  language: hi
  text: तब सादोक के पुत्र अहीमास ने योआब से फिर कहा, “जो भी हो,[a] कृपया मुझे भी उस कूशी के पीछे दौड़ने दीजिए।” लेकिन योआब ने कहा, “मेरे बेटे, तुम क्यों दौड़ोगे? तुम्हारे पास ऐसा कोई समाचार नहीं है जो तुम्हारे लिए लाभदायक सिद्ध हो।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चाहे परिणाम कुछ भी हो।”
    reason: lexical_alternative
  - marker: b
    text: अंतिम इब्रानी वाक्यांश कठिन है। इसका अर्थ “तुम्हें इस समाचार के लिए कोई प्रतिफल नहीं मिलेगा” या “तुम्हारे पास ऐसा समाचार नहीं है जिसका अनुकूल स्वागत हो” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד
  choice: फिर कहा
  rationale: इस इब्रानी मुहावरे का शाब्दिक अर्थ ‘फिर और जोड़ा’ है, पर यहाँ यह अहीमास द्वारा अपना अनुरोध दोहराने को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וִיהִי מָה
  choice: चाहे परिणाम कुछ भी हो
  rationale: यह परिणाम की परवाह न करते हुए आग्रह करने का भाव देता है; चुना हुआ रूप आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: אָרֻצָה נָּא
  choice: कृपया मुझे ... दौड़ने दीजिए
  rationale: कोहोर्टेटिव रूप और נָא विनम्र किंतु दृढ़ अनुरोध व्यक्त करते हैं।
- source_word: גַם אֲנִי
  choice: मुझे भी
  rationale: अहीमास अपने को पहले भेजे गए धावक के अतिरिक्त भेजने पर बल देता है।
- source_word: הַכּוּשִׁי
  choice: उस कूशी
  rationale: यह जातिसूचक नाम का सीधा ऐतिहासिक लिप्यंतरण है और आधुनिक ‘इथियोपियाई’ जैसी संभावित भौगोलिक अनैतिहासिकता से बचता है।
- source_word: לָמָּה זֶּה אַתָּה רָץ
  choice: तुम क्यों दौड़ोगे?
  rationale: संदर्भ में योआब अहीमास के प्रस्तावित दौड़ने पर आपत्ति कर रहा है। हिन्दी का यह प्रश्न उस आशय को स्वाभाविक रूप से व्यक्त करता है, यद्यपि זֶה का संकेतात्मक बल अलग शब्द से नहीं दोहराया गया।
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: यह संभवतः स्नेहपूर्ण या वरिष्ठता-सूचक संबोधन है, न कि वास्तविक पुत्रत्व का कथन।
- source_word: אֵין בְּשׂוֹרָה מֹצֵאת
  choice: तुम्हारे लिए ऐसा कोई समाचार नहीं है जिसका अच्छा फल मिले
  rationale: इब्रानी पदबंध संक्षिप्त और कठिन है। ‘अच्छा फल मिले’ उसके अनुकूल परिणाम, अनुकूल स्वागत या धावक को मिलने वाले प्रतिफल—इन संभावनाओं को अनावश्यक रूप से एक ही अर्थ में सीमित नहीं करता।
theological_decisions:
- issue: अंतिम कठिन पदबंध में समाचार के ‘फल’ का आशय
  choice: अच्छा फल मिले
  alternative: समाचार सुनाने पर तुम्हें कोई इनाम नहीं मिलेगा / तुम्हारे पास ऐसा समाचार नहीं है जिसका अच्छा स्वागत हो
  rationale: मूल इब्रानी यह स्पष्ट नहीं करता कि अपेक्षित परिणाम धावक का प्रतिफल है या समाचार का अनुकूल स्वागत। मुख्य पाठ में व्यापक अभिव्यक्ति रखकर इस वास्तविक अस्पष्टता को बचाया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कूशी’ ऐतिहासिक जातिसूचक नाम को बनाए रखता है। अंतिम वाक्य में मूल की अर्थगत अस्पष्टता मुख्य पाठ और पादटिप्पणी दोनों में सुरक्षित रखी गई है।
