source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הָ/עָ֜ם לֹ֣א תֵצֵ֗א כִּי֩ אִם נֹ֨ס נָנ֜וּס לֹא יָשִׂ֧ימוּ אֵלֵ֣י/נוּ לֵ֗ב וְ/אִם יָמֻ֤תוּ חֶצְיֵ֨/נוּ֙ לֹֽא יָשִׂ֤ימוּ אֵלֵ֨י/נוּ֙ לֵ֔ב כִּֽי עַתָּ֥ה כָמֹ֖/נוּ עֲשָׂרָ֣ה אֲלָפִ֑ים וְ/עַתָּ֣ה ט֔וֹב כִּי תִֽהְיֶה לָּ֥/נוּ מֵ/עִ֖יר ל/עזיר־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/003.yaml
  text: But the people said[a], “You must not go out, for if we flee, they will not pay attention to us; and if half of us die, they will not pay attention to us. For you are worth ten thousand of us[c][b]; so now it is better that you be ready to help us from the city.”
translation:
  language: hi
  text: पर लोगों ने कहा, “आप बाहर न जाएँ। क्योंकि यदि हम भाग भी जाएँ, तो वे हमारी ओर ध्यान नहीं देंगे[a]; और यदि हममें से आधे लोग मर भी जाएँ, तो भी वे हमारी ओर ध्यान नहीं देंगे। क्योंकि आप हममें से दस हज़ार के बराबर हैं[b]। इसलिए अब अच्छा यही है कि आप नगर से हमारी सहायता करने के लिए तैयार रहें[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वे हमारी ओर अपना मन नहीं लगाएंगे”; यह एक मुहावरा है, जिसका अर्थ है कि वे हमें अपनी मुख्य चिंता या लक्ष्य नहीं मानेंगे।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पदबंध की बनावट असामान्य है; इसका शाब्दिक रूप लगभग “क्योंकि अब हमारे समान दस हज़ार” है। प्रसंग में इसका आशय है कि दाऊद का महत्त्व उनके दस हज़ार सैनिकों के बराबर है।
    reason: textual_ambiguity
  - marker: c
    text: अन्तिम वाक्यांश का सम्भावित अर्थ है कि दाऊद नगर में रहकर आवश्यकता पड़ने पर सहायता या अतिरिक्त सैनिक उपलब्ध कराएँ।
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תֵצֵא
  choice: आप बाहर न जाएँ
  rationale: निषेध के साथ अपूर्ण क्रिया यहाँ प्रबल आग्रह/मनाही व्यक्त करती है। यह हिन्दी में आदरपूर्ण, स्वाभाविक और प्रसंगानुकूल है।
- source_word: כִּי אִם נֹס נָנוּס
  choice: क्योंकि यदि हम भाग भी जाएँ
  rationale: धातु के infinitive absolute और finite verb का मेल क्रिया पर बल देता है; ‘भाग भी जाएँ’ उस बल को सहज हिन्दी में व्यक्त करता है।
- source_word: לֹא יָשִׂימוּ אֵלֵינוּ לֵב
  choice: वे हमारी ओर ध्यान नहीं देंगे
  rationale: शाब्दिक मुहावरा ‘हमारी ओर मन लगाना’ है; युद्ध के प्रसंग में इसका अर्थ हमें अपना मुख्य लक्ष्य या चिंता न मानना है।
- source_word: וְאִם יָמֻתוּ חֶצְיֵנוּ
  choice: और यदि हममें से आधे लोग मर भी जाएँ
  rationale: मूल क्रिया का सीधा अर्थ ‘मरना’ है। युद्ध के कारण ‘मारे जाएँ’ सम्भव है, पर ‘मर जाएँ’ मूल की शब्दार्थगत व्यापकता बनाए रखता है।
- source_word: כִּי עַתָּה כָמֹנוּ עֲשָׂרָה אֲלָפִים
  choice: क्योंकि आप हममें से दस हज़ार के बराबर हैं
  rationale: यह वाक्य दाऊद के तुलनात्मक महत्त्व को बताता है। हिन्दी में ‘दस हज़ार के बराबर’ स्वाभाविक है, जबकि शाब्दिक बनावट की कठिनाई को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְעַתָּה טוֹב
  choice: इसलिए अब अच्छा यही है
  rationale: טוֹב यहाँ अधिक उचित विकल्प प्रस्तुत करता है; ‘अच्छा यही है’ निर्णय की वरीयता को सहज हिन्दी में व्यक्त करता है।
- source_word: מֵעִיר לְעָזִיר
  choice: नगर से हमारी सहायता करने के लिए तैयार रहें
  rationale: מֵעִיר स्रोत/स्थान ‘नगर से’ बताता है और לְעָזִיר सहायता देने का भाव रखता है। ‘तैयार रहें’ प्रसंग में उपलब्ध सहायता को स्पष्ट करता है, जबकि इसका सैन्य आशय पादटिप्पणी में बताया गया है।
