- source_word: וּבִשַּׂרְתָּ
  choice: तुम समाचार सुना सकते हो
  rationale: संदर्भ में यह किसी दूसरे दिन समाचार देने की अनुमति या संभावना व्यक्त करता है; इसलिए केवल भविष्यवाणी की अपेक्षा ‘सुना सकते हो’ अधिक उपयुक्त है।
- source_word: לֹא תְבַשֵּׂר
  choice: समाचार मत सुनाओ
  rationale: यहाँ לֹא के साथ अपूर्ण क्रिया वर्तमान परिस्थिति के लिए निषेध व्यक्त करती है। हिंदी का ‘मत सुनाओ’ योआब की सीधी आज्ञा को स्पष्ट और स्वाभाविक रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह योआब के निषेध का कारण प्रस्तुत करता है।
- source_word: בֶּן הַמֶּלֶךְ
  choice: राजा का पुत्र
  rationale: इब्रानी संबंध-संरचना का सीधा, गरिमापूर्ण और स्वाभाविक हिंदी रूप।
- source_word: מֵת
  choice: मर गया है
  rationale: यह परिणामी अवस्था को व्यक्त करता है और हिंदी में घटना तथा उसकी वर्तमान प्रासंगिकता दोनों को स्वाभाविक रूप से बताता है।
- source_word: הַיּוֹם הַזֶּה
  choice: आज
  rationale: दोनों occurrences में इब्रानी काल-सूचक पदबंध का सहज आधुनिक हिंदी रूप।
