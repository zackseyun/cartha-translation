  yaml_path: translation/ot/2_samuel/018/020.yaml
  text: Joab said to him[a], “You are not a bearer of news today. You may carry news on another day, but today you must not carry news, because the king’s son is dead.”
translation:
  language: hi
  text: योआब ने उससे कहा, “आज तुम समाचार पहुँचाने के लिए उचित व्यक्ति नहीं हो। किसी और दिन तुम समाचार पहुँचा सकते हो, पर आज समाचार मत पहुँचाओ, क्योंकि राजा का पुत्र मर गया है।”[क]
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: ‘समाचार’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ ‘शुभ समाचार’ भी हो सकता है। लेकिन यहाँ राजा के पुत्र की मृत्यु के संदर्भ में तटस्थ ‘समाचार’ रखा गया है।
    reason: lexical_alternative
