lexical_decisions:
- source_word: אִישׁ אֶחָד
  choice: एक आदमी
  rationale: यह इब्रानी पदबंध के एकवचन और पुरुष-संदर्भ को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: וַיַּרְא
  choice: यह देखा
  rationale: क्रिया का अर्थ ‘देखा’ है; हिन्दी में प्रसंग से निहित दृश्य के लिए ‘यह’ जोड़ने से कथन स्वाभाविक और स्पष्ट बनता है।
- source_word: וַיַּגֵּד לְיוֹאָב
  choice: योआब को इसकी सूचना दी
  rationale: נגד यहाँ किसी देखी हुई बात की खबर देने को व्यक्त करता है। ‘सूचना दी’ कथात्मक प्रसंग में स्पष्ट और सहज है।
- source_word: הִנֵּה
  choice: देखिए
  rationale: यह ध्यान आकर्षित करने वाला अव्यय है। ‘देखिए’ उसके संवादात्मक बल को बिना पुरातन भाषा के व्यक्त करता है।
- source_word: תָּלוּי
  choice: लटका हुआ
  rationale: निष्क्रिय कृदंत किसी को लटकी हुई अवस्था में बताता है; यह अनुवाद उस अवस्था को स्पष्ट रूप से बनाए रखता है।
- source_word: בָּאֵלָה
  choice: तेरेबिन्थ वृक्ष में
  rationale: אֵלָה विशेषतः तेरेबिन्थ वृक्ष का द्योतक हो सकता है। ‘में’ वृक्ष या उसकी डालियों के बीच लटके होने की इब्रानी अभिव्यक्ति को बनाए रखता है; अधिक परिचित वैकल्पिक वृक्ष-नाम पादटिप्पणी में दिया गया है।
