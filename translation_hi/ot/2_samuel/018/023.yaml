  text: But he said[a], “Whatever happens, let me run.” So he said to him[c][b], “Run.” Then Ahimaaz ran by the way of the plain and passed the Cushite.
translation:
  language: hi
  text: पर उसने कहा, “चाहे जो हो, मुझे दौड़ने दीजिए।” तब योआब ने उससे कहा, “दौड़।” तब अहीमास मैदान के रास्ते से दौड़ा और कूशी को पीछे छोड़ दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “कूशी से आगे निकल गया” या “कूशी को पार कर गया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי מָה אָרוּץ
  choice: चाहे जो हो, मुझे दौड़ने दीजिए
  rationale: यह इब्रानी मुहावरा परिणाम की परवाह किए बिना दौड़ने के अहीमास के आग्रह को व्यक्त करता है। प्रसंग में यह केवल घोषणा नहीं, अनुमति माँगने का आग्रह है।
- source_word: רוּץ
  choice: दौड़
  rationale: रוץ का सीधा आज्ञार्थक रूप है; संक्षिप्त आदेश को बनाए रखा गया है।
- source_word: דֶּרֶךְ הַכִּכָּר
  choice: तराई के रास्ते से
  rationale: דֶּרֶךְ मार्ग या रास्ता और הַכִּכָּר समतल तराई को दर्शाता है। मुख्य पाठ में इसे विशेष रूप से यरदन की तराई कहना इब्रानी से अधिक निश्चित होगा।
- source_word: וַיַּעֲבֹר אֶת־הַכּוּשִׁי
  choice: कूशी को पीछे छोड़ दिया
  rationale: עבר सकर्मक प्रयोग में आगे निकलने या पार कर जाने का भाव देता है। दौड़ के प्रसंग में स्वाभाविक हिन्दी ‘पीछे छोड़ दिया’ इस अर्थ को स्पष्ट करती है।
- source_word: הַכּוּשִׁי
  choice: कूशी
  rationale: यह कूश से संबंधित व्यक्ति का जातीय-भौगोलिक पदनाम है; ‘इथियोपियाई’ की अपेक्षा मूल पदनाम को अधिक सीधे सुरक्षित रखता है।
- source_word: אֲחִימַעַץ
  choice: अहीमास
  rationale: व्यक्तिनाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: לֹו
  choice: उससे
  rationale: सर्वनाम का स्पष्ट हिन्दी रूप दिया गया है; वक्ता योआब को निकटवर्ती प्रसंग से स्पष्ट करके स्वाभाविकता बढ़ाई गई है।
