translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। अहीमास के आग्रह और योआब के संक्षिप्त आदेश की संवादात्मक तीव्रता बनाए रखी गई है। ‘तराई’ भौगोलिक संकेत देता है, पर मुख्य पाठ में ‘यरदन की तराई’ जोड़कर मूल से अधिक विशिष्टता नहीं लाई गई।
