  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ הַ/מֶּ֔לֶךְ אֲשֶׁר יִיטַ֥ב בְּ/עֵינֵי/כֶ֖ם אֶעֱשֶׂ֑ה וַ/יַּעֲמֹ֤ד הַ/מֶּ֨לֶךְ֙ אֶל יַ֣ד הַ/שַּׁ֔עַר וְ/כָל הָ/עָם֙ יָֽצְא֔וּ לְ/מֵא֖וֹת וְ/לַ/אֲלָפִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/004.yaml
  text: The king said to them[a], “What seems good in your eyes, I will do.” So the king stood beside the gate[c][b], and all the people went out by hundreds and by thousands.
translation:
  language: hi
  text: राजा ने उनसे कहा, “जो तुम्हारी दृष्टि में अच्छा हो, वही मैं करूँगा।” तब राजा फाटक के पास खड़ा हो गया,[a] और सब लोग सैकड़ों और हज़ारों के दलों में बाहर निकले।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “फाटक की बगल में।” इब्रानी में शाब्दिक रूप से “फाटक के हाथ की ओर” है—अर्थात उसके पास।
    reason: lexical_alternative
  - marker: b
    text: अर्थात संगठित सैनिक दलों में।
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר יִיטַב בְּעֵינֵיכֶם
  choice: जो तुम्हारी दृष्टि में अच्छा हो
  rationale: यह बिंबात्मक इब्रानी मुहावरे को बनाए रखते हुए स्वाभाविक हिन्दी में उनके निर्णय या सम्मति को व्यक्त करता है।
- source_word: אֶעֱשֶׂה
  choice: वही मैं करूँगा
  rationale: עשה का सीधा भाव रखा गया है; ‘वही’ हिन्दी में पूर्ववर्ती संबंधवाचक वाक्य को स्वाभाविक रूप से पूरा करता है।
- source_word: אֶל יַד הַשַּׁעַר
  choice: फाटक के पास
  rationale: शाब्दिक रूप से ‘फाटक के हाथ की ओर’ निकटता बताने वाला मुहावरा है; ‘के पास’ उसके स्थानगत अर्थ को सहज हिन्दी में देता है।
- source_word: וְכָל הָעָם
  choice: और सब लोग
  rationale: सैनिक संदर्भ होने पर भी मूल में ‘लोग’ है; इसलिए व्यापक मूल शब्दावली को सुरक्षित रखा गया है।
- source_word: יָצְאוּ
  choice: बाहर निकले
  rationale: यह יצא के सामान्य अर्थ को व्यक्त करता है और अनावश्यक रूप से ‘कूच किया’ जैसी अधिक विशिष्ट सैनिक क्रिया नहीं जोड़ता।
- source_word: לְמֵאוֹת וְלַאֲלָפִים
  choice: सैकड़ों और हज़ारों के दलों में
  rationale: संख्यात्मक संरचना को रखते हुए प्रसंग में निहित संगठित सैनिक इकाइयों का अर्थ स्पष्ट और स्वाभाविक हिन्दी में व्यक्त होता है।
