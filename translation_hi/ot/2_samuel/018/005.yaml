base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/005.yaml
  text: And the king commanded Joab and Abishai and Ittai[a], saying, “Deal gently for my sake with the young man Absalom.” And all the people heard when the king commanded all the commanders concerning Absalom.
translation:
  language: hi
  text: राजा ने योआब, अबीशै और इत्तै को आज्ञा दी, “मेरी खातिर उस जवान अबशालोम के साथ नरमी बरतना।”[a] और जब राजा ने अबशालोम के विषय में सभी सेनानायकों को आज्ञा दी, तब सब लोगों ने सुना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी खातिर उस जवान के साथ नरमी बरतना—अबशालोम।” इब्रानी में विनती और अबशालोम की पहचान अत्यंत संक्षिप्त ढंग से साथ रखी गई हैं।
    reason: इब्रानी वाक्य-विन्यास की संक्षिप्तता और ‘उस जवान’ के साथ अबशालोम की पहचानात्मक संरचना को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: राजा ने ... आज्ञा दी
  rationale: צוה राजकीय अधिकार के साथ आदेश देने को व्यक्त करता है; ‘आज्ञा दी’ आधुनिक और गरिमापूर्ण हिन्दी में इसका स्वाभाविक रूप है।
- source_word: אֶת יוֹאָב וְאֶת אֲבִישַׁי וְאֶת אִתַּי
  choice: योआब, अबीशै और इत्तै को
  rationale: व्यक्तिनामों का स्रोत-आधारित देवनागरी लिप्यंतरण किया गया है; बार-बार आए कर्मचिह्न אֶת को हिन्दी में एक ही ‘को’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: לְאַט
  choice: नरमी बरतना
  rationale: यह रूप संयम और कोमल व्यवहार का भाव देता है। युद्ध के प्रसंग में ‘नरमी बरतना’ स्पष्ट करता है कि अबशालोम के साथ कठोरता न की जाए।
- source_word: לִי
  choice: मेरी खातिर
  rationale: यह दाऊद की निजी विनती और पितृस्नेह का संबंधपरक बल बनाए रखता है; केवल ‘मेरे लिए’ की अपेक्षा आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: לַנַּעַר
  choice: उस जवान
  rationale: נַעַר लड़के, युवक या जवान को सूचित कर सकता है। अबशालोम वयस्क है, पर राजा उसे पितृभाव से संबोधित करता है; ‘जवान’ दोनों पहलुओं को बनाए रखता है।
- source_word: לְאַבְשָׁלוֹם
  choice: अबशालोम
  rationale: दूसरा ל संक्षिप्त रूप से ‘उस जवान’ की पहचान अबशालोम के रूप में करता है। मुख्य पाठ में सहज हिन्दी के लिए दोनों को साथ रखा गया है और इब्रानी की संक्षिप्तता को पादटिप्पणी में बताया गया है।
- source_word: וְכָל הָעָם שָׁמְעוּ
  choice: तब सब लोगों ने सुना
  rationale: הָעָם का मूल अर्थ ‘लोग’ है। सैन्य प्रसंग होते हुए भी सामान्य पद को बनाए रखा गया है; वाक्य सार्वजनिक रूप से सुने गए आदेश पर बल देता है।
- source_word: בְּצַוֹּת הַמֶּלֶךְ
  choice: जब राजा ने ... आज्ञा दी
  rationale: ב के साथ infinitive construct समकालिक परिस्थिति दर्शाता है; हिन्दी में ‘जब ... तब’ इसकी स्वाभाविक अभिव्यक्ति है।
- source_word: כָּל הַשָּׂרִים
  choice: सभी सेनानायकों
  rationale: सैन्य प्रसंग में שָׂרִים सेना के अधिकारियों या कमांडरों को दर्शाता है; ‘सेनानायक’ यहाँ सामान्य ‘सरदार’ से अधिक सटीक है।
- source_word: עַל דְּבַר אַבְשָׁלוֹם
  choice: अबशालोम के विषय में
  rationale: यह मुहावरा ‘के विषय में’ या ‘के संबंध में’ के अर्थ में है; चुना हुआ रूप संक्षिप्त और गरिमापूर्ण है।
