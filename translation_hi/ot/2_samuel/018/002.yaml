source:
  edition: WLC
  text: וַ/יְשַׁלַּ֨ח דָּוִ֜ד אֶת הָ/עָ֗ם הַ/שְּׁלִשִׁ֤ית בְּ/יַד יוֹאָב֙ וְ֠/הַ/שְּׁלִשִׁית בְּ/יַ֨ד אֲבִישַׁ֤י בֶּן צְרוּיָה֙ אֲחִ֣י יוֹאָ֔ב וְ/הַ֨/שְּׁלִשִׁ֔ת בְּ/יַ֖ד אִתַּ֣י הַ/גִּתִּ֑י וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל הָ/עָ֔ם יָצֹ֥א אֵצֵ֛א גַּם אֲנִ֖י עִמָּ/כֶֽם־־־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/002.yaml
  text: 'David sent out the troops: one third under Joab[a], one third under Abishai son of Zeruiah, Joab’s brother, and one third under Ittai the Gittite. And the king said to the troops, “I myself will surely go out with you.”'
translation:
  language: hi
  text: 'दाऊद ने सैनिकों को भेजा: एक तिहाई योआब के अधीन[a], एक तिहाई योआब के भाई, सरूयाह के पुत्र अबीशै के अधीन, और एक तिहाई गित्ती इत्तै के अधीन। तब राजा ने सैनिकों से कहा, “मैं स्वयं भी निश्चय ही तुम्हारे साथ निकलूँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘के हाथ में’; यह किसी के अधिकार या कमान के अधीन होने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: भेजा
  rationale: सैन्य प्रसंग में इसका अर्थ सेना को कार्रवाई के लिए रवाना करना है; ‘भेजा’ स्वाभाविक और स्पष्ट है।
- source_word: הָעָם
  choice: सैनिकों
  rationale: शाब्दिक अर्थ ‘लोग’ है, पर निकटवर्ती युद्ध-संदर्भ में दाऊद की लड़ाकू सेना अभिप्रेत है।
- source_word: הַשְּׁלִשִׁית / הַשְּׁלִשִׁת
  choice: एक तिहाई
  rationale: दोहराया गया रूप सेना के तीन बराबर दलों में से प्रत्येक को सूचित करता है।
- source_word: בְּיַד
  choice: के अधीन
  rationale: शाब्दिक रूप से ‘के हाथ में’ सैन्य अधिकार या कमान का मुहावरा है; ‘के अधीन’ हिंदी में उसका स्वाभाविक समतुल्य है।
- source_word: אֲבִישַׁי בֶּן צְרוּיָה אֲחִי יוֹאָב
  choice: योआब के भाई, सरूयाह के पुत्र अबीशै
  rationale: दोनों पारिवारिक पहचानों को स्पष्ट, स्वाभाविक हिंदी क्रम में सुरक्षित रखता है।
- source_word: אִתַּי הַגִּתִּי
  choice: गित्ती इत्तै
  rationale: व्यक्ति के नाम और गत नगर से उसकी पहचान, दोनों को बनाए रखता है।
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: तब राजा ने ... कहा
  rationale: कथात्मक क्रम को आधुनिक हिंदी में सहज ढंग से व्यक्त करता और ‘राजा’ पदनाम को बनाए रखता है।
- source_word: יָצֹא אֵצֵא
  choice: निश्चय ही ... निकलूँगा
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute कथन को प्रबल करता है; ‘निश्चय ही’ उस बल को व्यक्त करता है।
- source_word: גַּם אֲנִי
  choice: मैं स्वयं भी
  rationale: גם का समावेशी अर्थ और स्वतंत्र सर्वनाम का व्यक्तिगत बल, दोनों सुरक्षित रहते हैं।
- source_word: עִמָּכֶם
  choice: तुम्हारे साथ
  rationale: युद्ध में साथ जाने का सीधा और स्वाभाविक अनुवाद है।
