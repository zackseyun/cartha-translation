  yaml_path: translation/ot/2_samuel/018/019.yaml
  text: Then Ahimaaz the son of Zadok said[a], “Please let me run and bring news to the king[b], for Yahweh has delivered him from the hand of his enemies.”
translation:
  language: hi
  text: तब सादोक के पुत्र अहीमास ने कहा, “कृपया मुझे दौड़कर राजा को शुभ समाचार सुनाने दीजिए, क्योंकि यहोवा ने उसे उसके शत्रुओं के हाथ से न्याय दिलाया है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा ने उसके पक्ष में न्याय करके उसे उसके शत्रुओं के हाथ से छुड़ाया है।” इब्रानी क्रिया में उसके पक्ष में न्याय करने और इस प्रकार उसे छुड़ाने—दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲחִימַעַץ בֶּן צָדוֹק אָמַר
  choice: तब सादोक के पुत्र अहीमास ने कहा
  rationale: वाव कथानक को आगे बढ़ाता है, इसलिए स्वाभाविक हिन्दी में ‘तब’; पुत्र-संबंध और कथन-क्रिया सीधे रूप में रखे गए हैं।
- source_word: אָרוּצָה נָּא
  choice: कृपया मुझे दौड़कर ... दीजिए
  rationale: कोहोर्टेटिव वक्ता की इच्छा/अनुमति की याचना व्यक्त करता है और נָא विनम्र आग्रह जोड़ता है।
- source_word: וַ/אֲבַשְּׂרָה אֶת הַ/מֶּלֶךְ
  choice: राजा को शुभ समाचार सुनाने
  rationale: पिएल בשׂר समाचार पहुँचाने को दर्शाता है और विजय के इस प्रसंग में समाचार अनुकूल है; ‘शुभ समाचार’ उस प्रसंगगत भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ इसे संदेश की विषयवस्तु प्रस्तुत करने वाला माना गया है; कारणसूचक ‘क्योंकि’ भी व्याकरणतः संभव है।
- source_word: שְׁפָטוֹ יְהוָה
  choice: यहोवा ने ... उसका न्याय किया है
  rationale: שׁפט के न्यायिक अर्थ और राजा के पक्ष में दिए गए निर्णय—दोनों को बनाए रखने के लिए अपेक्षाकृत शाब्दिक रूप चुना गया है; ‘उसे छुड़ाया’ परिणाम को स्पष्ट करता, पर न्यायिक तनाव घटा देता।
- source_word: מִיַּד אֹיְבָיו
  choice: उसके शत्रुओं के हाथ से
  rationale: ‘हाथ’ सत्ता या नियंत्रण का स्रोत-रूपक है और हिन्दी में समझने योग्य है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में आए परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: שְׁפָטוֹ का न्यायिक और उद्धारात्मक अर्थ
  choice: उसका न्याय किया है
  alternative: उसे छुड़ाया है / उसे न्याय दिलाया है
  rationale: मूल क्रिया שׁפט है, इसलिए मुख्य पाठ न्यायिक शब्दावली सुरक्षित रखता है। शत्रुओं के हाथ से बचाव इसका प्रसंगगत परिणाम है, जिसे केवल ‘छुड़ाया’ कहने पर मूल का न्यायिक पहलू दब सकता है।
- issue: ईश्वरीय नाम יְהוָה
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: व्यक्तिगत नाम को नाम के रूप में ही रखना स्रोत-साक्ष्य के सबसे निकट है; ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और कथात्मक रखी गई है। अहीमास की विनम्र अनुमति-याचना के लिए ‘कृपया ... दीजिए’ और בשׂר के प्रसंगगत अनुकूल समाचार के लिए ‘शुभ समाचार’ चुना गया है।
