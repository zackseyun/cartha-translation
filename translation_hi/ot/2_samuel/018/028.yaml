base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/028.yaml
  text: Ahimaaz called out and said to the king[a], “Peace!” Then he bowed down before the king with his face to the ground and said, “Blessed be Yahweh your God[b], who has delivered up the men who lifted their hand against my lord the king.”
translation:
  language: hi
  text: अहीमास ने पुकारकर राजा से कहा, “कुशल है!”[a] फिर उसने राजा के सामने भूमि पर मुँह के बल दण्डवत् किया और कहा, “आपके परमेश्वर याहवे धन्य हों, जिन्होंने उन आदमियों को सौंप दिया जिन्होंने मेरे स्वामी, राजा के विरुद्ध हाथ उठाया था।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सब कुशल है!” इब्रानी शब्द शालोम यहाँ केवल अभिवादन नहीं, कुशल-मंगल या अनुकूल समाचार की घोषणा भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “हवाले कर दिया” या “सौंप दिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: पुकारकर
  rationale: यह क्रिया ऊँची आवाज़ में राजा को समाचार देने का भाव रखती है; ‘पुकारकर’ आधुनिक और स्वाभाविक हिन्दी है।
- source_word: שָׁלוֹם
  choice: कुशल है!
  rationale: दूत के समाचार देने के प्रसंग में यह केवल अभिवादन नहीं, बल्कि सब ठीक होने या अनुकूल समाचार की घोषणा भी हो सकती है। ‘कुशल है!’ इस कार्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּשְׁתַּחוּ ... לְאַפָּיו אָרְצָה
  choice: भूमि तक मुँह झुकाकर ... दण्डवत् किया
  rationale: यह पूर्ण शारीरिक प्रणाम का ठोस चित्र व्यक्त करता है; हिन्दी में ‘दण्डवत् किया’ और साथ का वर्णन मुद्रा को स्पष्ट रखते हैं।
- source_word: בָּרוּךְ יְהוָה אֱלֹהֶיךָ
  choice: आपका परमेश्वर यहोवा धन्य है
  rationale: यह स्तुति का पारंपरिक सूत्र है। ‘धन्य है’ हिन्दी में गरिमापूर्ण और सहज है तथा ‘आपका’ राजा के प्रति सम्मानसूचक संबोधन रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में व्यापक रूप से पहचाना जाने वाला दैवी नाम है और मूल के व्यक्तिवाचक नाम को उपाधि से प्रतिस्थापित नहीं करता।
- source_word: סִגַּר
  choice: आपके हाथ में कर दिया
  rationale: क्रिया का अर्थ किसी को दूसरे के अधिकार में सौंप देना है। हिन्दी मुहावरा सैन्य प्रसंग में स्वाभाविक है, यद्यपि मूल में ‘आपके हाथ में’ स्पष्टतः नहीं है; इसलिए पादटिप्पणी में शाब्दिक विकल्प दिया गया है।
- source_word: הָאֲנָשִׁים
  choice: उन पुरुषों
  rationale: निश्चित बहुवचन उन विशिष्ट पुरुष विरोधियों की ओर संकेत करता है; ‘पुरुषों’ लिंग और संदर्भ दोनों को बनाए रखता है।
- source_word: נָשְׂאוּ אֶת יָדָם
  choice: हाथ उठाया था
  rationale: मूल का सजीव मुहावरा बनाए रखा गया है; प्रसंग में इसका अर्थ शत्रुतापूर्ण विद्रोह करना स्पष्ट है।
- source_word: בַּאדֹנִי הַמֶּלֶךְ
  choice: मेरे स्वामी राजा के विरुद्ध
  rationale: दरबारी आदर और राजा के प्रति अधीनता का भाव सुरक्षित रहता है।
theological_decisions:
- issue: दैवी नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिवाचक दैवी नाम को ‘प्रभु’ जैसी उपाधि से नहीं बदला गया। ‘यहोवा’ आधुनिक हिन्दी पाठकों में अधिक परिचित रूप है, जबकि ‘याहवे’ स्रोत उच्चारण के निकटतर वैकल्पिक लिप्यंतरण है।
- issue: सौंपे जाने का कर्ता और परिणाम
  choice: परमेश्वर ने विरोधियों को राजा के हाथ में कर दिया
  alternative: परमेश्वर ने विरोधियों को सौंप दिया
  rationale: स्रोत की क्रिया दैवी विजय और विरोधियों को अधिकार में देने का भाव रखती है। हिन्दी मुख्य पाठ उस संदर्भगत लक्ष्य को स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक रूप सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली रखी गई है। राजा के लिए ‘आप’ और ‘मेरे स्वामी राजा’ दरबारी सम्मान व्यक्त करते हैं। ‘दण्डवत्’ परिचित धार्मिक-सांस्कृतिक शब्द है, और साथ का शारीरिक वर्णन उसके अर्थ को स्पष्ट करता है।
