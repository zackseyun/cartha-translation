lexical_decisions:
- source_word: וַיַּרְא
  choice: जब ... ने देखा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; अगले कार्य के साथ समय-संबंध को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘जब’ उपयुक्त है।
- source_word: אֲרָם
  choice: अराम
  rationale: एकवचन रूप वाले मूल व्यक्तिवाचक नाम को सुरक्षित रखा गया है; प्रसंग में यह सामूहिक रूप से अरामियों अथवा उनकी सेना को दर्शाता है।
- source_word: כִּי
  choice: कि
  rationale: यह अराम द्वारा देखी गई बात की विषयवस्तु प्रस्तुत करता है, कारण नहीं।
- source_word: נִגַּף
  choice: हार गया है
  rationale: निफ़अल रूप युद्ध में पराजित होने का अर्थ देता है; यह आधुनिक हिन्दी में स्पष्ट है और हार के ढंग को अनावश्यक रूप से विशिष्ट नहीं बनाता।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: युद्ध के प्रसंग में इसका अर्थ विरोधी के सम्मुख अथवा उसकी शक्ति के आगे पराजित होना है; ‘के सामने’ मूल बिंब को बनाए रखता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: मूल व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וַיֵּאָסְפוּ
  choice: इकट्ठे हुए
  rationale: निफ़अल का अर्थ एकत्र या जमा होना है; ‘इकट्ठे हुए’ सहज और स्पष्ट है, जबकि ‘फिर से मोर्चाबंद हुए’ मूल से अधिक व्याख्यात्मक होता।
- source_word: יָחַד
  choice: सब एक साथ
  rationale: क्रियाविशेषण का अर्थ ‘एक साथ’ है; ‘सब’ सामूहिक कर्ता को हिन्दी में स्पष्ट और स्वाभाविक बनाता है।
