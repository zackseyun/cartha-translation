  yaml_path: translation/ot/2_samuel/010/017.yaml
  text: When it was reported to David[a], he gathered all Israel, crossed the Jordan, and came to Helam. Then Aram drew up in battle formation to meet David and fought with him.
translation:
  language: hi
  text: जब दाऊद को इसकी खबर दी गई, तब उसने समस्त इस्राएल को इकट्ठा किया, यरदन पार किया और हेलाम पहुँचा। तब अरामियों ने दाऊद का सामना करने के लिए युद्ध के लिए मोर्चा बाँधा और उससे युद्ध किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִד
  choice: जब दाऊद को इसकी खबर दी गई
  rationale: निफ़अल कर्मवाच्य रूप सूचना देने वाले को अनिर्दिष्ट रखता है। आरंभिक वाव को स्वाभाविक हिन्दी कथानुक्रम में ‘जब... तब’ से व्यक्त किया गया है; ‘इसकी’ पूर्ववर्ती घटनाओं की खबर की ओर संकेत करती है।
- source_word: וַיֶּאֱסֹף אֶת כָּל יִשְׂרָאֵל
  choice: उसने समस्त इस्राएल को इकट्ठा किया
  rationale: ‘इकट्ठा किया’ אָסַף का सामान्य अर्थ रखता है। ‘समस्त इस्राएल’ मूल के व्यापक सामूहिक पद को बनाए रखता है और अनावश्यक रूप से ‘सेना’ नहीं जोड़ता।
- source_word: וַיַּעֲבֹר אֶת הַיַּרְדֵּן
  choice: यरदन पार किया
  rationale: עָבַר के साथ नदी का सीधा कर्म यहाँ नदी पार करने को दर्शाता है; यह हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: וַיָּבֹא חֵלָמָה
  choice: हेलाम पहुँचा
  rationale: स्थाननाम के दिशासूचक ה को आगमन के अर्थ में स्वाभाविक हिन्दी ‘पहुँचा’ से व्यक्त किया गया है।
- source_word: וַיַּעַרְכוּ אֲרָם
  choice: अरामियों ने ... युद्ध की पाँत बाँधी
  rationale: सैन्य प्रसंग में עָרַךְ युद्ध के लिए सेना सजाने या पंक्तिबद्ध करने को दर्शाता है। ‘अरामियों’ हिन्दी में राष्ट्रवाचक सामूहिक ‘अराम’ के लोगों को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִקְרַאת דָּוִד
  choice: दाऊद का सामना करने के लिए
  rationale: לִקְרַאת का मूल भाव मिलने या सामने आने का है; युद्ध के प्रसंग में ‘सामना करने’ से उसकी शत्रुतापूर्ण दिशा स्पष्ट होती है, बिना ‘विरुद्ध’ को सीधे मूल में आरोपित किए।
- source_word: וַיִּלָּחֲמוּ עִמּוֹ
  choice: उससे युद्ध किया
  rationale: לחם के साथ עִם का मुहावरा किसी के साथ अर्थात उसके विरुद्ध युद्ध करने को दर्शाता है। हिन्दी में ‘उससे युद्ध किया’ इस अर्थ को स्वाभाविक रूप से व्यक्त करता है और सहयोगी भाव पैदा नहीं करता।
