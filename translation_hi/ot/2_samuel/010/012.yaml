base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/012.yaml
  text: Be strong[a], and let us be strong for our people and for the cities of our God[b], and may Yahweh do what is good in his eyes.
translation:
  language: hi
  text: “दृढ़ बनो, और हम अपने लोगों और अपने परमेश्वर के नगरों के लिए दृढ़ हों[a]। यहोवा जो उसकी दृष्टि में अच्छा है, वही करे।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हम अपने को दृढ़ करें” अथवा “हम दृढ़ता दिखाएँ।” इब्रानी क्रिया आत्मवाचक है और अपने को दृढ़ करने या दृढ़ता दिखाने का भाव रखती है।
    reason: lexical_alternative
  - marker: b
    text: या “यहोवा जो उसकी दृष्टि में अच्छा है, वही करेगा।” इब्रानी क्रियारूप को साधारण भविष्य के रूप में भी समझा जा सकता है; मुख्य पाठ में इसे यहोवा की इच्छा के प्रति समर्पण की कामना के रूप में लिया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזַק
  choice: हिम्मत बाँधो
  rationale: पुल्लिंग एकवचन आज्ञार्थक रूप सीधे साहस और दृढ़ता का आह्वान करता है। आधुनिक हिन्दी में यह स्वाभाविक है और युद्ध-संदर्भ के अनुकूल है।
- source_word: וְנִתְחַזַּק
  choice: और हम ... दृढ़ता से खड़े हों
  rationale: हित्पएल कोहोर्टेटिव में स्वयं को दृढ़ करने अथवा दृढ़ता दिखाने का भाव है। यह रूप उस आत्मप्रेरक और सामूहिक भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּעַד
  choice: के लिए
  rationale: यहाँ अपने लोगों और नगरों की रक्षा अथवा उनके हित में लड़ने का अर्थ है; ‘के लिए’ संक्षिप्त और स्वाभाविक है।
- source_word: עַמֵּנוּ
  choice: अपने लोगों
  rationale: עַם का सामान्य अर्थ ‘लोग/प्रजा’ है, केवल ‘सेना’ नहीं; इसलिए व्यापक सामुदायिक अर्थ बनाए रखा गया है।
- source_word: עָרֵי אֱלֹהֵינוּ
  choice: अपने परमेश्वर के नगरों
  rationale: सम्बन्धसूचक इब्रानी पदबंध को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है तथा नगरों का परमेश्वर से सम्बन्ध सुरक्षित है।
- source_word: יהוה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ द्वारा प्रस्तुत किया गया है।
- source_word: יַעֲשֶׂה הַטּוֹב בְּעֵינָיו
  choice: वही करे जो उसकी दृष्टि में अच्छा है
  rationale: इब्रानी मुहावरे ‘उसकी आँखों में अच्छा’ को गरिमापूर्ण हिन्दी ‘उसकी दृष्टि में अच्छा’ से व्यक्त किया गया है; yiqtol की संभावित कामनार्थक शक्ति मुख्य पाठ में सुरक्षित है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ हिन्दी पाठकों के लिए परिचित रूप है और इसे केवल उपाधि में नहीं बदलता।
- issue: יַעֲשֶׂה को कामना या साधारण भविष्य के रूप में पढ़ना
  choice: वही करे
  alternative: वही करेगा
  rationale: पूर्ववर्ती प्रोत्साहन के बाद यह परिणाम को परमेश्वर की इच्छा पर छोड़ने वाली कामना के रूप में स्वाभाविक है; फिर भी साधारण भविष्य का व्याकरणिक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सैन्य प्रसंग का साहस और सामूहिक आत्मदृढ़ता स्वाभाविक हिन्दी में व्यक्त किए गए हैं। ‘उसकी दृष्टि में अच्छा’ मूल इब्रानी मुहावरे को निकटता से सुरक्षित रखता है।
