- source_word: וַיַּעֲרֹךְ
  choice: युद्ध-पंक्ति में खड़ा किया
  rationale: सैनिक प्रसंग में ערך का अर्थ सेना को युद्ध के लिए क्रमबद्ध करना या मोर्चाबंदी करना है।
- source_word: לִקְרַאת
  choice: का सामना करने के लिए
  rationale: मूल अर्थ ‘मिलने/सामने जाने के लिए’ है; युद्ध के प्रसंग में ‘सामना करना’ स्वाभाविक और अर्थ-सटीक है।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोनियों
  rationale: शाब्दिक रूप ‘अम्मोन के पुत्र’ है, पर आधुनिक हिन्दी में उस जाति के लिए ‘अम्मोनी’ अधिक स्वाभाविक है; शाब्दिक रूप पादटिप्पणी में रखा गया है।
