  language: hi
  text: और शेष लोगों को उसने अपने भाई अबीशै के अधिकार में सौंप दिया,[a] और उसने उन्हें अम्मोनियों[b] का सामना करने के लिए युद्ध-पंक्ति में खड़ा किया।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने भाई अबीशै के हाथ में दे दिया”; यह सैनिकों को उसके अधिकार में सौंपने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अम्मोन के पुत्रों।”
    reason: lexical_alternative
  - marker: c
    text: या “उन्हें युद्ध के लिए क्रमबद्ध किया।” इब्रानी क्रिया का आशय सैनिकों को युद्ध-पंक्ति में लगाने से है।
    reason: lexical_alternative
