base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/016.yaml
  text: Hadadezer sent and brought out the Arameans who were beyond the River[a], and they came to Helam[c][b], with Shobak the commander of Hadadezer’s army before them.
translation:
  language: hi
  text: हददेजेर ने भेजा और नदी के पार के अरामियों को बाहर निकाला[a]। वे हेलाम आए, और हददेजेर की सेना का प्रधान शोबक[b] उनके आगे था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, संभवतः फरात नदी के पार के।
    reason: cultural_note
  - marker: b
    text: इस नाम का एक प्रचलित वैकल्पिक रूप ‘शोबाख’ है।
    reason: lexical_alternative
  - marker: c
    text: ‘उनके आगे’ का आशय संभवतः यह है कि वह उनका नेतृत्व करते हुए सबसे आगे था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: दूत भेजकर
  rationale: क्रिया का मूल अर्थ ‘भेजना’ है; हिंदी में अगली कारक क्रिया के साथ ‘दूत भेजकर’ स्वाभाविक है और निहित माध्यम को न्यूनतम रूप से स्पष्ट करता है।
- source_word: וַיֹּצֵא אֶת אֲרָם
  choice: अरामियों को बाहर बुलाया
  rationale: हिफ़ील रूप का कारक भाव सुरक्षित रहता है। प्रसंग में हददेजेर दूरवर्ती अरामी सैनिकों को युद्ध के लिए निकलवाता है; ‘बाहर बुलाया’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: אֲרָם
  choice: अरामियों
  rationale: यहाँ शब्द भूभाग मात्र नहीं, अरामी लोगों अथवा उनकी सेना को सूचित करता है। ‘अरामी’ इब्रानी जातिनाम को सीधे दर्शाता है और आधुनिक ‘सीरियाई’ से जुड़ी काल-विसंगति से बचता है।
- source_word: מֵעֵבֶר הַנָּהָר
  choice: महानद के पार के
  rationale: इब्रानी में अक्षरशः ‘नदी के पार’ है और इस निश्चित पद में नदी से आशय फरात है। हिंदी बाइबलीय भौगोलिक प्रयोग ‘महानद’ मुख्य पाठ में संकेत बनाए रखता है; पहचान पादटिप्पणी में स्पष्ट की गई है।
- source_word: וַיָּבֹאוּ חֵילָם
  choice: वे हेलाम आए
  rationale: חֵילָם को स्थाननाम मानकर लिप्यंतरित किया गया है। क्रिया का साधारण कथात्मक अर्थ ‘आए’ रखा गया है।
- source_word: וְשׁוֹבַךְ
  choice: शोबक
  rationale: मसोरेटी व्यंजन और अंतिम כ के अनुसार ‘शोबक’ निकट लिप्यंतरण है; प्रचलित वैकल्पिक रूप पादटिप्पणी में दिया गया है।
- source_word: שַׂר צְבָא
  choice: सेना का प्रधान
  rationale: यह सैन्य नेतृत्व का पद है। ‘सेना का प्रधान’ dignified और सामान्य हिंदी में स्पष्ट है।
- source_word: לִפְנֵיהֶם
  choice: उनके आगे था
  rationale: अक्षरशः स्थानसूचक अर्थ ‘उनके सामने/आगे’ सुरक्षित रखा गया है; सैन्य प्रसंग में नेतृत्व का संभावित आशय पादटिप्पणी में बताया गया है।
