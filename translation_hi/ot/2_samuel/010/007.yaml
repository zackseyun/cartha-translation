  text: जब दाऊद ने सुना, तो उसने योआब और वीर योद्धाओं की पूरी सेना[a] को भेजा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “योआब और पूरी सेना, अर्थात वीर योद्धाओं, को भेजा।” इब्रानी में “वीर योद्धाओं” को “सेना” का समानाधिकरण समझा जा सकता है, या इसे यह बताने वाला संबंधसूचक पद माना जा सकता है कि सेना किन लोगों की थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע דָּוִד
  choice: जब दाऊद ने यह सुना
  rationale: שׁמע का मूल अर्थ ‘सुनना’ है। क्रमिक इब्रानी कथन को स्वाभाविक हिन्दी में कारण-काल संबंध दिखाने के लिए ‘जब…तो’ से व्यक्त किया गया है। ‘यह’ संदर्भ की ओर संकेत करता है, पर कोई अनकहा विशिष्ट कर्म नहीं जोड़ता।
- source_word: וַיִּשְׁלַח
  choice: उसने … भेजा
  rationale: שׁלח के सामान्य अर्थ ‘भेजना’ को सीधे और स्वाभाविक हिन्दी में रखा गया है।
- source_word: אֶת יוֹאָב
  choice: योआब
  rationale: אֶת केवल निश्चित कर्म का चिह्न है और अलग से अनूदित नहीं होता; नाम को प्रचलित हिन्दी लिप्यंतरण में दिया गया है।
- source_word: וְאֵת כָּל הַצָּבָא
  choice: और … पूरी सेना को
  rationale: צָבָא यहाँ सैन्य दल या सेना है। כָּל को ‘पूरी’ से व्यक्त किया गया है, और हिन्दी का कर्म-चिह्न ‘को’ समन्वित दोनों कर्मों पर लागू होता है।
- source_word: הַגִּבֹּרִים
  choice: वीर योद्धाओं की
  rationale: גִּבֹּרִים शक्तिशाली या वीर लड़ाकों को दर्शाता है। ‘वीर योद्धा’ आधुनिक हिन्दी में स्पष्ट है; संबंधकारक रूप मुख्य पाठ में इसे सेना का विनिर्देशन मानता है, जबकि व्याकरणिक वैकल्पिक समझ पादटिप्पणी में सुरक्षित है।
