- source_word: וְהָלַכְתִּי לְהוֹשִׁיעַ לָךְ
  choice: तो मैं जाकर तुम्हारी सहायता करूँगा
  rationale: הלך के साथ उद्देश्यसूचक infinitive सचमुच जाने और बचाने/छुड़ाने का भाव रखता है। ‘जाकर सहायता करूँगा’ सैनिक सहयोग के प्रसंग में गति और उद्देश्य दोनों को बनाए रखता है।
