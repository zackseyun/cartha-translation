  yaml_path: translation/ot/2_samuel/010/005.yaml
  text: When they told David[a], he sent to meet them, for the men were greatly humiliated. And the king said, “Stay at Jericho until your beards have grown[b], and then return.”
translation:
  language: hi
  text: जब दाऊद को यह बताया गया, तो उसने उनसे मिलने के लिए भेजा[a], क्योंकि वे पुरुष बहुत अपमानित थे[b]। राजा ने उनसे कहा, “जब तक तुम्हारी दाढ़ियाँ बढ़ न जाएँ, तब तक यरीहो में ठहरे रहो; उसके बाद लौट आना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, ‘उसने उनसे मिलने के लिए भेजा’ है; किसे भेजा गया, यह स्पष्ट रूप से नहीं कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘बहुत लज्जित थे’ या ‘बहुत अपमानित किए गए थे’ भी हो सकता है। हिब्रू शब्द सार्वजनिक रूप से लज्जित या अपमानित होने पर बल देता है।
    reason: lexical_alternative
