  rationale: शाब्दिक अर्थ ‘उसने उनसे मिलने के लिए भेजा’ है। हिन्दी में भेजे गए व्यक्तियों को पूरी तरह अनकहा रखना अस्वाभाविक है, इसलिए संदर्भ से निहित ‘लोगों’ को रखा गया और पादटिप्पणी में मूल की अनिर्दिष्टता स्पष्ट की गई है।
- source_word: נִכְלָמִים מְאֹד
  choice: बहुत अपमानित थे
  rationale: כלם का निफ़अल रूप सार्वजनिक रूप से लज्जित या अपमानित किए जाने की दशा बताता है, और מְאֹד उसकी तीव्रता व्यक्त करता है।
- source_word: שְׁבוּ בִירֵחוֹ
  choice: यरीहो में ठहरे रहो
  rationale: यहाँ ישׁב का अर्थ अस्थायी रूप से रहना या ठहरना है; ‘ठहरे रहो’ आधुनिक हिन्दी में प्रसंगानुकूल है।
- source_word: עַד יְצַמַּח זְקַנְכֶם
  choice: जब तक तुम्हारी दाढ़ियाँ फिर से न बढ़ जाएँ
  rationale: צמח का अर्थ उगना या बढ़ना है। पिछले पद में दाढ़ियाँ काटे जाने के कारण ‘फिर से’ संदर्भगत पुनर्वृद्धि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְשַׁבְתֶּם
  choice: उसके बाद लौट आना
  rationale: שׁוב का अर्थ लौटना है। ‘उसके बाद’ עד-वाक्य से निहित समय-क्रम को स्पष्ट और स्वाभाविक बनाता है।
