  text: וַ/יָּ֣נָס אֲרָם֮ מִ/פְּנֵ֣י יִשְׂרָאֵל֒ וַ/יַּהֲרֹ֨ג דָּוִ֜ד מֵ/אֲרָ֗ם שְׁבַ֤ע מֵאוֹת֙ רֶ֔כֶב וְ/אַרְבָּעִ֥ים אֶ֖לֶף פָּרָשִׁ֑ים וְ/אֵ֨ת שׁוֹבַ֧ךְ שַׂר צְבָא֛/וֹ הִכָּ֖ה וַ/יָּ֥מָת שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/018.yaml
  text: Aram fled from before Israel[a], and David killed seven hundred charioteers and forty thousand horsemen from Aram. He also struck down Shobach, the commander of their army[b], and he died there.
translation:
  language: hi
  text: अराम के लोग इस्राएल के सामने से भाग गए। दाऊद ने अराम के सात सौ रथ-सैनिकों[a] और चालीस हज़ार घुड़सवारों को मार डाला। उसने उनकी सेना के सेनापति शोबक[b] को भी मारा, और वह वहीं मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से “सात सौ रथ/रथ-दल” है। सटीक संकेत रथ-सेना की ओर हो सकता है, इसलिए यहाँ “रथ-सैनिक” कहा गया है। 1 इतिहास 19:18 में “सात हज़ार रथ” है।
    reason: textual_variant
  - marker: b
    text: या “उसकी सेना के सेनापति।” हिब्रू प्रत्यय एकवचन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס אֲרָם מִפְּנֵי יִשְׂרָאֵל
  choice: अराम के लोग इस्राएल के सामने से भाग गए
  rationale: אֲרָם यहाँ सामूहिक रूप से अरामी लोगों को दर्शाता है। हिंदी में ‘अराम के लोग’ स्वाभाविक और स्पष्ट है; ‘सामने से भाग गए’ מִפְּנֵי के युद्ध-संदर्भ वाले भाव को बनाए रखता है।
- source_word: וַיַּהֲרֹג דָּוִד
  choice: दाऊद ने ... मार डाला
  rationale: הרג का सीधा अर्थ मार डालना है। यह आधुनिक हिंदी में स्पष्ट है और आगे प्रयुक्त נכה से शब्दगत भेद भी रखता है।
- source_word: שְׁבַע מֵאוֹת רֶכֶב
  choice: सात सौ रथ-सैनिकों
  rationale: רֶכֶב का शाब्दिक अर्थ ‘रथ/रथ-दल’ है। युद्ध में मारे जाने वालों की गिनती के संदर्भ में ‘रथ-सैनिक’ संभावित मानवीय अभिप्राय को स्वाभाविक ढंग से व्यक्त करता है, जबकि कठिन हिब्रू पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְאַרְבָּעִים אֶלֶף פָּרָשִׁים
  choice: चालीस हज़ार घुड़सवारों
  rationale: פָּרָשִׁים के लिए ‘घुड़सवार’ सीधा, प्रचलित और सैन्य संदर्भ में उपयुक्त हिंदी शब्द है।
- source_word: וְאֵת שׁוֹבַךְ
  choice: शोबक
  rationale: यह रूप मासोरेटी स्वरांकन שׁוֹבַךְ का हिंदी लिप्यंतरण है।
- source_word: שַׂר צְבָאוֹ
  choice: उनकी सेना के सेनापति
  rationale: שַׂר का सैन्य संदर्भ में अर्थ ‘सेनापति’ और צָבָא का अर्थ ‘सेना’ है। मुख्य पाठ में ‘उनकी’ निकटवर्ती सामूहिक ‘अराम के लोग’ के अनुसार स्वाभाविक है; एकवचन हिब्रू प्रत्यय का विकल्प पादटिप्पणी में दिया गया है।
- source_word: הִכָּה וַיָּמָת שָׁם
  choice: ऐसा मारा कि वह वहीं मर गया
  rationale: נכה का अर्थ प्रहार करना/मारना व्यापक है और अगला खंड उस प्रहार का घातक परिणाम बताता है। संयुक्त हिंदी वाक्य कारण-परिणाम को बिना अतिरिक्त विवरण जोड़े स्वाभाविक रूप से व्यक्त करता है।
