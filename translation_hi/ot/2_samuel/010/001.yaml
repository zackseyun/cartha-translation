lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: इसके बाद
  rationale: इब्रानी कथात्मक संक्रमण का स्वाभाविक और संक्षिप्त हिन्दी रूप।
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: अम्मोनियों का राजा
  rationale: शाब्दिक अर्थ ‘अम्मोन के पुत्रों का राजा’ है, पर यह जाति-सूचक इब्रानी मुहावरा है; आधुनिक हिन्दी में ‘अम्मोनियों’ स्पष्ट और स्वाभाविक है।
- source_word: וַיִּמְלֹךְ
  choice: राजा बना
  rationale: क्रिया का अर्थ राज करना या राजा बनना हो सकता है; उत्तराधिकार के इस प्रसंग में ‘राजा बना’ लक्ष्य भाषा में घटना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: राजकीय उत्तराधिकार के संदर्भ में इब्रानी पदबंध का सटीक हिन्दी समतुल्य।
