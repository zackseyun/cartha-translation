base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/008.yaml
  text: Then the sons of Ammon came out and drew up for battle at the entrance of the gate[b][a], while Aram of Zobah and Rehob and the men of Tob and Maacah were by themselves in the field.
translation:
  language: hi
  text: तब अम्मोन के पुत्र[a] बाहर निकले और फाटक के प्रवेश-द्वार पर युद्ध के लिए मोर्चा बाँधा। उधर सोबा और रहोब के अरामी, तोब के लोग[b] और माका के लोग उनसे अलग मैदान में थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अम्मोनी लोग।” इब्रानी में शाब्दिक रूप से “अम्मोन के पुत्र” है।
    reason: lexical_alternative
  - marker: b
    text: या, “ईश-तोब।” इब्रानी אִישׁ טוֹב का अर्थ “तोब के लोग” हो सकता है, अथवा इसे स्थाननाम “ईश-तोब” समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: बाहर निकले
  rationale: सैन्य प्रसंग में יצא का स्वाभाविक अर्थ नगर से बाहर निकलना है।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोन के पुत्र
  rationale: इब्रानी जातिनाम की संरचना को बनाए रखता है; अधिक मुहावरेदार विकल्प ‘अम्मोनी’ पादटिप्पणी में दिया गया है।
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: युद्ध के लिए मोर्चा बाँधा
  rationale: यह सैन्य मुहावरा सेना को युद्ध-विन्यास में लगाने का भाव देता है और आधुनिक हिन्दी में सहज है।
- source_word: פֶּתַח הַשָּׁעַר
  choice: फाटक के प्रवेश पर
  rationale: פתח स्थान के खुलने या प्रवेश-स्थल को सूचित करता है; अनुवाद नगर के फाटक के निकट की स्थिति स्पष्ट करता है।
- source_word: וַאֲרַם צוֹבָא וּרְחוֹב
  choice: सोबा और रहोब के अरामी
  rationale: अֲרַם को ऐतिहासिक नाम ‘अराम/अरामी’ के रूप में रखा गया है, न कि बाद का भौगोलिक नाम ‘सीरिया’; वाक्यांश को दोनों स्थानों से आए अरामी दलों के रूप में स्वाभाविक हिन्दी दी गई है।
- source_word: וְאִישׁ טוֹב
  choice: तोब के लोग
  rationale: אִישׁ טוֹב को तोब से आए लोगों के अर्थ में पढ़ा गया है; ‘ईश-तोब’ स्थाननाम की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: וּמַעֲכָה
  choice: माका के लोग
  rationale: माका से आए सहयोगी दल का आशय हिन्दी में स्पष्ट करने के लिए ‘के लोग’ जोड़ा गया है।
- source_word: לְבַדָּם
  choice: उनसे अलग
  rationale: यह अम्मोनी सेना और सहयोगी दलों की अलग-अलग तैनाती को स्पष्ट करता है।
- source_word: בַּשָּׂדֶה
  choice: मैदान में
  rationale: שׂדה का निकट और निष्पक्ष अर्थ ‘मैदान’ है; ‘खुले मैदान’ जैसा अतिरिक्त अर्थ नहीं जोड़ा गया।
