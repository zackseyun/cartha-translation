lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: आगे बढ़े
  rationale: נגשׁ का मूल अर्थ ‘निकट आना’ है, पर לַמִּלְחָמָה के साथ सैन्य प्रसंग में इसका आशय युद्ध में भिड़ने के लिए आगे बढ़ना है।
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: और उसके साथ के लोग
  rationale: यह עָם के सामान्य अर्थ ‘लोग’ के निकट रहते हुए प्रसंग में योआब के साथ की युद्धरत टुकड़ी को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לַמִּלְחָמָה
  choice: युद्ध करने के लिए
  rationale: पूर्वसर्ग לְ यहाँ उद्देश्य अथवा युद्ध की ओर गति दर्शाता है; हिंदी में यह प्रयोग दोनों भावों को सहज रूप से समेटता है।
- source_word: בַּאֲרָם
  choice: अराम से
  rationale: בְּ विरोधी पक्ष के साथ युद्ध करने के अर्थ में है। मूल पाठ के स्थान/जननाम ‘अराम’ को बनाए रखा गया है; पादटिप्पणी स्पष्ट करती है कि आशय अरामी सेना से है।
- source_word: וַיָּנֻסוּ
  choice: भाग गए
  rationale: נוּס का सीधा अर्थ भय या पराजय के कारण भागना है; ‘पीछे हटे’ अनावश्यक रूप से व्यवस्थित सैन्य वापसी का संकेत दे सकता है।
- source_word: מִפָּנָיו
  choice: उसके सामने से
  rationale: यह हिब्रू मुहावरे ‘उसके मुख/सामने से भागना’ को स्वाभाविक हिंदी में रखता है। एकवचन प्रत्यय का संदर्भ योआब से है।
- source_word: יוֹאָב
  choice: योआब
  rationale: व्यक्तिनाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
