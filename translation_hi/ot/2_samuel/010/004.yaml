source:
  edition: WLC
  text: וַ/יִּקַּ֨ח חָנ֜וּן אֶת עַבְדֵ֣י דָוִ֗ד וַ/יְגַלַּח֙ אֶת חֲצִ֣י זְקָנָ֔/ם וַ/יִּכְרֹ֧ת אֶת מַדְוֵי/הֶ֛ם בַּ/חֵ֖צִי עַ֣ד שְׁתֽוֹתֵי/הֶ֑ם וַֽ/יְשַׁלְּחֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/004.yaml
  text: So Hanun took David’s servants[a], shaved off half of their beards, cut off their garments in the middle up to their buttocks, and sent them away.
translation:
  language: hi
  text: तब हानून ने दाऊद के सेवकों को अपने पास लिया, उनकी दाढ़ियों का आधा भाग मूँड दिया और उनके वस्त्रों को बीच में से, उनके नितंबों[a] तक काट डाला; फिर उन्हें भेज दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “उनके बैठने के अंग तक” या “उनके गुप्तांगों तक” भी हो सकता है। यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और शरीर के किस अंग की ओर संकेत करता है, इस पर मतभेद है। आशय यह है कि हानून ने उनके वस्त्र बहुत छोटे काटकर उन्हें लज्जाजनक ढंग से उघाड़ दिया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: पकड़कर
  rationale: मूल क्रिया का सामान्य अर्थ ‘लेना’ है, पर इस अपमानजनक कार्रवाई के प्रसंग में हिन्दी में ‘पकड़कर’ स्वाभाविक रूप से बताता है कि हानून ने उन्हें अपने वश में करके यह किया; ‘बंदी बना लिया’ जैसी अधिक प्रबल धारणा नहीं जोड़ी गई।
- source_word: עַבְדֵי דָוִד
  choice: दाऊद के सेवकों
  rationale: עבד का अर्थ सेवक, दास या राजकीय अधिकारी हो सकता है। यहाँ वे राजकीय सेवा में भेजे गए दूत हैं, इसलिए ‘सेवक’ व्यापक और प्रसंगानुकूल है।
- source_word: וַיְגַלַּח אֶת חֲצִי זְקָנָם
  choice: उनकी आधी-आधी दाढ़ी मुँड़वा दी
  rationale: वाक्य प्रत्येक सेवक की दाढ़ी का आधा भाग मुँड़ाने का संकेत देता है। ‘आधी-आधी’ हिन्दी में इस वितरणात्मक अर्थ को स्पष्ट करता है; कर्तृवाचक रूप राजकीय आदेश से कराए गए कार्य के लिए स्वाभाविक है।
- source_word: וַיִּכְרֹת אֶת מַדְוֵיהֶם בַּחֵצִי
  choice: उनके वस्त्रों को बीच से ... काट दिया
  rationale: כרת काटने या काट डालने और מַדְוֵי वस्त्रों को सूचित करता है। ‘बीच से’ मूल के स्थानगत अर्थ को बनाए रखता है, जबकि वस्त्र का प्रकार अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: עַד שְׁתוֹתֵיהֶם
  choice: नितंबों तक
  rationale: दुर्लभ शब्द שְׁתוֹתֵיהֶם का सटीक शारीरिक संकेत विवादित है; ‘नितंब’ सम्भावित प्रत्यक्ष अर्थ देता है और सार्वजनिक अपमान के प्रसंग को स्पष्ट रखता है। अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: וַיְשַׁלְּחֵם
  choice: उन्हें विदा कर दिया
  rationale: שלח यहाँ अपमान करने के बाद उन्हें भेज देने को बताता है। ‘विदा कर दिया’ सहज कथात्मक हिन्दी है, यद्यपि प्रसंग इसे व्यंग्यात्मक और अपमानजनक बनाता है।
