  to: तब हानून ने दाऊद के सेवकों को अपने पास लिया, उनकी दाढ़ियों का आधा भाग मूँड दिया और उनके वस्त्रों को बीच में से, उनके नितंबों[a] तक काट डाला; फिर उन्हें भेज दिया।
