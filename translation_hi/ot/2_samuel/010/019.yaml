source:
  edition: WLC
  text: וַ/יִּרְא֨וּ כָֽל הַ/מְּלָכִ֜ים עַבְדֵ֣י הֲדַדְעֶ֗זֶר כִּ֤י נִגְּפוּ֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּשְׁלִ֥מוּ אֶת יִשְׂרָאֵ֖ל וַ/יַּֽעַבְד֑וּ/ם וַ/יִּֽרְא֣וּ אֲרָ֔ם לְ/הוֹשִׁ֥יעַ ע֖וֹד אֶת בְּנֵ֥י עַמּֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/019.yaml
  text: When all the kings who were servants of Hadadezer saw that they had been defeated before Israel, they made peace with Israel and served them. So Aram was afraid to save the sons of Ammon anymore.
translation:
  language: hi
  text: जब हददएज़ेर के अधीन सभी राजाओं ने देखा कि वे इस्राएल के सामने हार गए हैं, तो उन्होंने इस्राएल से संधि कर ली और उसके अधीन हो गए। इसलिए अराम फिर अम्मोनियों को बचाने से डर गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַבְדֵי הֲדַדְעֶזֶר
  choice: हददएज़ेर के अधीन
  rationale: शाब्दिक अर्थ ‘हददएज़ेर के सेवक’ है; राजाओं के राजनीतिक आश्रित या अधीनस्थ होने का आशय आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: נִגְּפוּ לִפְנֵי יִשְׂרָאֵל
  choice: इस्राएल के सामने हार गए
  rationale: निफ़ाल क्रिया पराजित होने को व्यक्त करती है; ‘के सामने’ स्रोत के לִפְנֵי को बनाए रखता है।
- source_word: וַיַּשְׁלִמוּ אֶת־יִשְׂרָאֵל
  choice: इस्राएल से संधि कर ली
  rationale: इस संदर्भ में שלם का अर्थ शांति स्थापित करना या संधि करना है।
- source_word: וַיַּעַבְדוּם
  choice: उसके अधीन हो गए
  rationale: शाब्दिक रूप ‘उन्होंने उनकी सेवा की’; प्रत्यय का आशय इस्राएल है, जिसे हिन्दी में एक सामूहिक इकाई मानकर एकवचन सर्वनाम से व्यक्त किया गया है।
- source_word: וַיִּרְאוּ אֲרָם
  choice: अरामियों ने ... साहस नहीं किया
  rationale: וַיִּרְאוּ का अर्थ ‘वे डर गए’ है; निषेधात्मक आशय अगले उद्देश्यवाचक पद के साथ स्वाभाविक हिन्दी में ‘साहस नहीं किया’ से व्यक्त होता है। अराम को यहाँ उसके लोगों/सेनाओं के सामूहिक अर्थ में ‘अरामियों’ कहा गया है।
- source_word: לְהוֹשִׁיעַ
  choice: सहायता करने
  rationale: मूल क्रिया का बुनियादी अर्थ बचाना या छुड़ाना है; सैन्य गठबंधन के इस प्रसंग में ‘सहायता करना’ स्वाभाविक और संदर्भानुकूल है, जबकि विजय की गारंटी निहित नहीं की गई।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोनियों
  rationale: शाब्दिक ‘अम्मोन के पुत्र’ एक जातिनाम है; आधुनिक हिन्दी में ‘अम्मोनी’ अधिक सहज है।
theological_decisions:
- issue: לְהוֹשִׁיעַ का अर्थ
  choice: सहायता करने
  alternative: बचाने
  rationale: यहाँ अरामी सेनाओं द्वारा अम्मोनियों को सैन्य सहायता देने की बात है। ‘सहायता’ प्रसंग को स्पष्ट करती है और किसी विशेष धर्मवैचारिक अर्थ को आरोपित नहीं करती।
- issue: अराम का व्याकरणिक व्यक्तिकरण
  choice: अरामियों ने ... साहस नहीं किया
  alternative: अराम डर गया
  rationale: स्रोत का सामूहिक स्थाननाम हिन्दी में लोगों के रूप में स्वाभाविक किया गया है; भय का भाव बरकरार है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। राजनीतिक अधीनता और सैन्य सहायता के प्रसंग को स्पष्ट रखते हुए मूल की कारणात्मक गति (‘इसलिए’) संरक्षित की गई है।
