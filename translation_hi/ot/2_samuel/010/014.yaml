  yaml_path: translation/ot/2_samuel/010/014.yaml
  text: And when the sons of Ammon saw that Aram had fled[a], they fled before Abishai and entered the city[c][b]. Then Joab returned from against the sons of Ammon and came to Jerusalem.
translation:
  language: hi
  text: जब अम्मोनियों ने देखा कि अराम भाग गया था, तो वे अबीशै के सामने से भागकर नगर में चले गए। तब योआब अम्मोनियों के विरुद्ध युद्ध से हट गया और यरूशलेम आया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי עַמּוֹן
  choice: अम्मोनी
  rationale: शाब्दिक अर्थ ‘अम्मोन के पुत्र’ है, पर आधुनिक हिन्दी में इस जातीय समुदाय के लिए ‘अम्मोनी’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: רָאוּ כִּי נָס אֲרָם
  choice: देखा कि अराम भाग गया है
  rationale: ‘देखा कि’ इब्रानी बोध-वाक्य को बनाए रखता है; ‘अराम’ मूल के देश/जनसमुदाय-सूचक नाम को सुरक्षित रखता है और पूर्ण क्रिया उनके पहले ही भाग जाने को व्यक्त करती है।
- source_word: וַיָּנֻסוּ מִפְּנֵי אֲבִישַׁי
  choice: वे भी अबीशै के सामने से भागकर
  rationale: ‘सामने से भागना’ מִפְּנֵי के सैन्य प्रसंग में पीछे हटने का स्वाभाविक हिन्दी रूप है; ‘भी’ दोनों सेनाओं के समान पलायन-संबंध को स्पष्ट करता है।
- source_word: וַיָּבֹאוּ הָעִיר
  choice: नगर में घुस गए
  rationale: दिशासूचक प्रयोग का अर्थ नगर के भीतर जाना है; युद्ध के प्रसंग में ‘घुस गए’ शरण लेने हेतु किलाबंद नगर में प्रवेश को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיָּשָׁב יוֹאָב מֵעַל בְּנֵי עַמּוֹן
  choice: तब योआब अम्मोनियों से लड़ना छोड़कर
  rationale: מֵעַל का सैन्य आशय अम्मोनियों के विरुद्ध जारी कार्रवाई से हटना है। हिन्दी में ‘लड़ना छोड़कर’ इस अर्थ को लकड़ीले शाब्दिक रूप के बिना स्पष्ट करता है।
- source_word: וַיָּבֹא יְרוּשָׁלִָם
  choice: यरूशलेम लौट आया
  rationale: पूर्ववर्ती וַיָּשָׁב वापसी को सूचित करता है और गंतव्य यरूशलेम है; संयुक्त हिन्दी अभिव्यक्ति पुनरुक्ति से बचते हुए दोनों क्रियाओं का आशय देती है।
