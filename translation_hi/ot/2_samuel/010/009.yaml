base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/009.yaml
  text: When Joab saw that the battle line was set against him in front and in the rear[b][a], he chose from all the choice men of Israel and arrayed them to meet Aram.
translation:
  language: hi
  text: जब योआब ने देखा कि युद्ध-पंक्ति उसके विरुद्ध सामने और पीछे दोनों ओर लगी हुई थी, तब उसने इस्राएल के सब चुने हुए योद्धाओं में से कुछ को चुनकर अराम का सामना करने के लिए युद्ध-पंक्ति में खड़ा किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “अराम” से अरामी सेना अभिप्रेत है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: देखा
  rationale: मूल क्रिया का सामान्य अर्थ दृश्य बोध है, जो यहाँ सामरिक स्थिति को पहचान लेने तक विस्तृत है; ‘देखा’ इब्रानी कथन-शैली को बनाए रखता है।
- source_word: פְּנֵי הַמִּלְחָמָה
  choice: युद्ध-पंक्ति
  rationale: शाब्दिक रूप ‘युद्ध का मुख’ है; सैन्य प्रसंग में यह युद्ध-मोर्चे अथवा पंक्ति को सूचित करता है।
- source_word: הָיְתָה אֵלָיו
  choice: उसके विरुद्ध ... लगी हुई है
  rationale: यह योआब की ओर मुख किए युद्ध-मोर्चों की स्थिति बताता है; हिंदी में यह प्रयोग सामरिक घेराव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִפָּנִים וּמֵאָחוֹר
  choice: सामने और पीछे दोनों ओर
  rationale: स्थानिक विरोध और दो दिशाओं से उपस्थित संकट दोनों स्पष्ट होते हैं।
- source_word: וַיִּבְחַר מִכֹּל בְּחוּרֵי בְיִשְׂרָאֵל
  choice: इस्राएल के सब चुने हुए योद्धाओं में से कुछ को चुनकर
  rationale: מִכֹּל चयन के व्यापक समूह को और בְּחוּרֵי श्रेष्ठ अथवा चुनिंदा युद्धयोग्य पुरुषों को दर्शाता है। हिंदी में चयन की क्रिया के कारण ‘कुछ को’ निहित अर्थ स्पष्ट करता है, बिना यह कहे कि सभी चुने गए।
- source_word: וַיַּעֲרֹךְ
  choice: युद्ध-पंक्ति में खड़ा किया
  rationale: सैन्य प्रसंग में ערך का अर्थ सैनिकों को युद्ध-विन्यास में लगाना है; यह आधुनिक हिंदी में ‘सुसज्जित किया’ से अधिक स्पष्ट है।
- source_word: לִקְרַאת אֲרָם
  choice: अराम का सामना करने के लिए
  rationale: לִקְרַאת यहाँ युद्ध में आमने-सामने होने का भाव रखता है; ‘सामना करने’ से सैन्य अर्थ स्वाभाविक बनता है।
- source_word: אֲרָם
  choice: अराम
  rationale: मूल भौगोलिक-जातीय नाम को सुरक्षित रखा गया है; इस प्रसंग में यह अरामी सेना का सामूहिक संकेत है।
