  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘युद्ध-पंक्ति’ और ‘युद्ध-पंक्ति में खड़ा किया’ सामरिक मुहावरे को समझने योग्य हिंदी में व्यक्त करते हैं। मुख्य पाठ में [a] का चिह्न उसी दावे के बाद रखा गया है जिसे टिप्पणी स्पष्ट करती है।
