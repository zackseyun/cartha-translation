translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, कथात्मक और गरिमापूर्ण रूप अपनाया गया है। मूल पाठ की पुनरुक्ति—‘दाऊद के सेवक’—बनाए रखी गई है। शोक-संदर्भ स्पष्ट करने के लिए मुख्य पाठ में व्याख्यात्मक ‘मृत्यु’ नहीं जोड़ा गया।
