  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶעֱשֶׂה חֶ֣סֶד עִם חָנ֣וּן בֶּן נָחָ֗שׁ כַּ/אֲשֶׁר֩ עָשָׂ֨ה אָבִ֤י/ו עִמָּדִ/י֙ חֶ֔סֶד וַ/יִּשְׁלַ֨ח דָּוִ֧ד לְ/נַחֲמ֛/וֹ בְּ/יַד עֲבָדָ֖י/ו אֶל אָבִ֑י/ו וַ/יָּבֹ֨אוּ֙ עַבְדֵ֣י דָוִ֔ד אֶ֖רֶץ בְּנֵ֥י עַמּֽוֹן־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/002.yaml
  text: And David said[a], “I will show kindness to Hanun son of Nahash, just as his father showed kindness to me.” So David sent by the hand of his servants to comfort him concerning his father, and David’s servants came into the land of the Ammonites.
translation:
  language: hi
  text: दाऊद ने कहा, “मैं नाहाश के पुत्र हानून के साथ भलाई करूँगा, जैसे उसके पिता ने मेरे साथ भलाई की थी।” इसलिए दाऊद ने उसके पिता के विषय में उसे सांत्वना देने के लिए अपने सेवक भेजे। और दाऊद के सेवक अम्मोनियों के देश में पहुँचे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶסֶד
  choice: कृपा
  rationale: राजनयिक और पारस्परिक संबंध के इस प्रसंग में यह शब्द उपकारपूर्ण निष्ठा या सद्भाव को व्यक्त करता है। ‘कृपा’ दोनों प्रयोगों में संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: חָנוּן בֶּן נָחָשׁ
  choice: नाहाश के पुत्र हानून
  rationale: हिब्रू वंश-संबंध को स्पष्ट रखते हुए नामों का प्रचलित देवनागरी लिप्यंतरण किया गया है।
- source_word: כַּאֲשֶׁר
  choice: जैसे
  rationale: यह तुलना और प्रत्युत्तर में किए जाने वाले सद्व्यवहार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עָשָׂה ... חֶסֶד
  choice: कृपा दिखाई
  rationale: עשה और חסד के संयुक्त प्रयोग के लिए यह स्वाभाविक हिन्दी अभिव्यक्ति है और दोनों पक्षों के सद्व्यवहार को बनाए रखती है।
- source_word: לְנַחֲמוֹ
  choice: उसे सांत्वना देने के लिए
  rationale: נחם का यह रूप शोकग्रस्त व्यक्ति को ढाढ़स देने या संवेदना प्रकट करने के अर्थ में है।
- source_word: אֶל אָבִיו
  choice: उसके पिता के विषय में
  rationale: मूल पाठ संबंध को बताता है; प्रसंग पिता की मृत्यु पर सांत्वना देने का है, पर अनुवाद मृत्यु शब्द को अनावश्यक रूप से नहीं जोड़ता।
- source_word: בְּיַד עֲבָדָיו
  choice: अपने सेवकों के हाथ ... संदेश भेजा
  rationale: ‘हाथ से’ वाला हिब्रू अभिकरण-सूचक मुहावरा सुरक्षित रहता है, जबकि ‘संदेश’ निहित कर्म को हिन्दी में स्पष्ट और स्वाभाविक बनाता है।
- source_word: אֶרֶץ בְּנֵי עַמּוֹן
  choice: अम्मोनियों का देश
  rationale: ‘अम्मोन के पुत्रों’ के स्थान पर इस जातिनाम का मानक और सहज हिन्दी रूप प्रयुक्त हुआ है।
