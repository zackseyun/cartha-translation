  text: וַ/יִּרְאוּ֙ בְּנֵ֣י עַמּ֔וֹן כִּ֥י נִבְאֲשׁ֖וּ בְּ/דָוִ֑ד וַ/יִּשְׁלְח֣וּ בְנֵֽי עַמּ֡וֹן וַ/יִּשְׂכְּרוּ֩ אֶת אֲרַ֨ם בֵּית רְח֜וֹב וְ/אֶת אֲרַ֣ם צוֹבָ֗א עֶשְׂרִ֥ים אֶ֨לֶף֙ רַגְלִ֔י וְ/אֶת מֶ֤לֶךְ מַֽעֲכָה֙ אֶ֣לֶף אִ֔ישׁ וְ/אִ֣ישׁ ט֔וֹב שְׁנֵים עָשָׂ֥ר אֶ֖לֶף אִֽישׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/006.yaml
  text: When the sons of Ammon saw that they had become odious to David[a], the sons of Ammon sent and hired the Arameans of Beth-rehob and the Arameans of Zobah, twenty thousand foot soldiers, and the king of Maacah with one thousand men, and the men of Tob[c][b], twelve thousand men.
translation:
  language: hi
  text: जब अम्मोनियों ने देखा कि वे दाऊद के लिए घृणित हो गए थे[a], तब उन्होंने संदेश भेजकर बेत-रहोब के अरामियों[c] और सोबा के अरामियों के बीस हज़ार पैदल सैनिकों को, माका के राजा को उसके एक हज़ार पुरुषों समेत, और तोब के पुरुषों[b] के बारह हज़ार पुरुषों को भाड़े पर रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “वे दाऊद के लिए दुर्गंध बन गए थे।”
    reason: lexical_alternative
  - marker: b
    text: या संभवतः “ईश-तोब”; इसे किसी स्थान या कुल का नाम समझा जा सकता है। यहाँ इसका अनुवाद “तोब के पुरुष” किया गया है।
    reason: alternative_reading
  - marker: c
    text: इब्रानी में “अराम”; परंपरागत रूप से “सीरिया” या “सीरियाई।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोनी
  rationale: शाब्दिक रूप ‘अम्मोन के पुत्र’ है, पर आधुनिक हिन्दी में जातिवाचक ‘अम्मोनी’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: נִבְאֲשׁוּ בְּדָוִד
  choice: दाऊद के लिए घृणित हो गए
  rationale: क्रिया में मूलतः दुर्गंध का बिंब है और मुहावरे में अप्रिय या घृणित हो जाने का अर्थ देती है; मुख्य पाठ में स्वाभाविक अर्थ रखा गया और शाब्दिक बिंब पादटिप्पणी में सुरक्षित किया गया।
- source_word: וַיִּשְׁלְחוּ וַיִּשְׂכְּרוּ
  choice: दूत भेजकर ... भाड़े पर बुलाया
  rationale: ‘भेजा’ का कर्म इब्रानी में अव्यक्त है। हिन्दी में केवल ‘भेजा और भाड़े पर लिया’ असहज होता, इसलिए प्रसंगानुसार ‘दूत’ जोड़ा गया और सैन्य सहायता मँगाने का भाव स्पष्ट किया गया।
- source_word: אֲרַם בֵּית רְחוֹב / אֲרַם צוֹבָא
  choice: बेत-रहोब के अरामी / सोबा के अरामी
  rationale: אֲרַם का ऐतिहासिक जातिनाम ‘अराम/अरामी’ सीधे प्रतिबिंबित होता है; पारंपरिक ‘सीरिया/सीरियाई’ बाद की भौगोलिक शब्दावली है।
- source_word: עֶשְׂרִים אֶלֶף רַגְלִי
  choice: बीस हज़ार पैदल सैनिक
  rationale: רַגְלִי पैदल सेना को दर्शाता है; यह आधुनिक हिन्दी में स्पष्ट सैन्य पद है।
- source_word: מֶלֶךְ מַעֲכָה אֶלֶף אִישׁ
  choice: माका के राजा को उसके एक हज़ार पुरुषों समेत
  rationale: संख्या राजा के साथ आए दल की है। ‘उसके ... समेत’ हिन्दी में संबंध स्पष्ट करता है, बिना राजा को संख्या में असंगत रूप से रखने के।
- source_word: אִישׁ טוֹב
  choice: तोब के पुरुष
  rationale: प्रसंग और 1 इतिहास 19:6 का समानांतर पाठ इसे तोब स्थान के लोगों के रूप में समझने का समर्थन करते हैं; फिर भी ‘ईश-तोब’ नाम के रूप में पढ़ना संभव है, इसलिए विकल्प पादटिप्पणी में दिया गया।
- source_word: שְׁנֵים עָשָׂר אֶלֶף אִישׁ
  choice: बारह हज़ार पुरुष
  rationale: इब्रानी संख्या और सामान्य सैन्य संज्ञा का सीधा, स्वाभाविक अनुवाद है।
