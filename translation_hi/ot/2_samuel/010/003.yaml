base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/003.yaml
  text: And the princes of the Ammonites said to Hanun their lord[a], “Is David honoring your father in your sight because he has sent comforters to you? Has not David sent his servants to you in order to search the city, to spy it out[c][b], and to overthrow it?”
translation:
  language: hi
  text: तब अम्मोनियों के हाकिमों ने अपने स्वामी हानून से कहा, “क्या तुम समझते हो कि दाऊद तुम्हारे पिता का आदर करता है, क्योंकि उसने तुम्हारे पास सांत्वना देनेवाले दूत भेजे हैं?[a] क्या दाऊद ने अपने सेवकों को तुम्हारे पास इसीलिए नहीं भेजा कि वे नगर की जाँच-पड़ताल करें, उसकी जासूसी करें और उसे नष्ट कर दें?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “क्या दाऊद तुम्हारी दृष्टि में तुम्हारे पिता का आदर कर रहा है क्योंकि उसने तुम्हारे पास सांत्वना देनेवाले भेजे हैं?”'
    reason: इब्रानी मुहावरे बְּעֵינֶיךָ (‘तुम्हारी दृष्टि में’) और वाक्य-संरचना का अधिक शाब्दिक विकल्प देना।
lexical_decisions:
- source_word: שָׂרֵי בְנֵי עַמּוֹן
  choice: अम्मोनियों के हाकिमों
  rationale: שָׂרִים राजकीय अधिकारियों, प्रधानों या शासकीय अगुओं को सूचित करता है। ‘हाकिमों’ से दरबारी-राजनीतिक पद और हानून के अधीन उनका अधिकार स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: אֲדֹנֵיהֶם
  choice: अपने स्वामी
  rationale: यहाँ אדון मनुष्य के लिए प्रयुक्त अधिकार-सूचक उपाधि है। ‘स्वामी’ राजकीय अधीनता को बनाए रखता है और इसे ईश्वरीय उपाधि नहीं बनाता।
- source_word: הַמְכַבֵּד ... אֶת אָבִיךָ
  choice: तुम्हारे पिता का सम्मान करने के लिए
  rationale: כבד यहाँ आदर या सम्मान दिखाने के अर्थ में है, धार्मिक महिमा करने के अर्थ में नहीं। प्रश्न को स्वाभाविक हिन्दी में उद्देश्यवाचक रूप दिया गया है।
- source_word: בְּעֵינֶיךָ
  choice: क्या तुम्हें लगता है
  rationale: शाब्दिक मुहावरा ‘तुम्हारी आँखों में’ है; प्रसंग में यह हानून की धारणा या आकलन को चुनौती देता है। ‘क्या तुम्हें लगता है’ आधुनिक हिन्दी में उसी भाव को स्पष्ट रखता है।
- source_word: מְנַחֲמִים
  choice: शोक प्रकट करनेवाले दूत
  rationale: संज्ञीकृत कृदन्त का आशय पिता की मृत्यु पर सांत्वना देने आए लोगों से है। हिन्दी में ‘शोक प्रकट करनेवाले दूत’ प्रसंग और राजकीय दूत-मंडल दोनों को सहज रूप से बताता है।
- source_word: הֲלוֹא
  choice: क्या ... नहीं
  rationale: यह सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न आरम्भ करता है। हिन्दी का ‘क्या ... नहीं’ सलाहकारों के संदेहपूर्ण आरोप को कथावाचक की पुष्टि बनाए बिना सुरक्षित रखता है।
- source_word: חֲקוֹר אֶת הָעִיר
  choice: नगर की छानबीन करें
  rationale: חקר का अर्थ जाँचने या पूरी तरह खोजने से है। ‘छानबीन’ अगले सैन्य-जासूसी पद से अनावश्यक रूप से एकरूप हुए बिना गहन जाँच का भाव देता है।
- source_word: וּלְרַגְּלָהּ
  choice: उसकी जासूसी करें
  rationale: पिएल रूप רגל का अर्थ किसी स्थान की गुप्त सैन्य जानकारी लेना है। स्त्रीलिंग प्रत्यय ‘नगर’ की ओर संकेत करता है।
- source_word: וּלְהָפְכָהּ
  choice: उसे उलट दें
  rationale: הפך का मूल बिंब ‘उलटना’ है और यहाँ शत्रुतापूर्ण संदर्भ में नगर को परास्त या ध्वस्त करने का आशय देता है। ‘उलट दें’ उस बिंब और अर्थ-विस्तार दोनों को खुला रखता है।
- source_word: עֲבָדָיו
  choice: अपने सेवकों
  rationale: עבד यहाँ दाऊद के अधीन राजकीय दूतों के लिए है। ‘सेवकों’ मूल अधीनता को रखता है, जबकि संदर्भ से उनका दूत होना स्पष्ट है।
theological_decisions:
- issue: सलाहकारों का राजकीय संदेह बनाम कथावाचक की तथ्य-पुष्टि
  choice: दोनों आरोपों को आलंकारिक प्रश्नों के रूप में रखना
  alternative: आरोप को निश्चित तथ्य की तरह कथन में बदल देना
  rationale: इब्रानी पाठ हानून के हाकिमों की बात उद्धृत करता है; कथावाचक उनके संदेह को सत्य घोषित नहीं करता। प्रश्नवाचक रूप इस तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हाकिम’, ‘स्वामी’, ‘छानबीन’ और ‘जासूसी’ राजदरबार तथा संभावित सैन्य षड्यंत्र का स्वर बनाए रखते हैं। मुख्य पाठ का [a] चिह्न संबंधित पादटिप्पणी से मेल खाता है।
