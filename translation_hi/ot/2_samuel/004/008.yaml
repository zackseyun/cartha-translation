  text: וַ֠/יָּבִאוּ אֶת רֹ֨אשׁ אִֽישׁ בֹּ֥שֶׁת אֶל דָּוִד֮ חֶבְרוֹן֒ וַ/יֹּֽאמְרוּ֙ אֶל הַ/מֶּ֔לֶךְ הִנֵּֽה רֹ֣אשׁ אִֽישׁ בֹּ֗שֶׁת בֶּן שָׁאוּל֙ אֹֽיִבְ/ךָ֔ אֲשֶׁ֥ר בִּקֵּ֖שׁ אֶת נַפְשֶׁ֑/ךָ וַ/יִּתֵּ֣ן יְ֠הוָה לַֽ/אדֹנִ֨/י הַ/מֶּ֤לֶךְ נְקָמוֹת֙ הַ/יּ֣וֹם הַ/זֶּ֔ה מִ/שָּׁא֖וּל וּ/מִ/זַּרְעֽ/וֹ־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/008.yaml
  text: They brought the head of Ish-bosheth to David at Hebron[a], and said to the king, “Here is the head of Ish-bosheth son of Saul, your enemy, who sought your life. Yahweh has given my lord the king vengeance today on Saul and on his offspring.”
translation:
  language: hi
  text: वे ईश्बोशेत का सिर हेब्रोन में दाऊद के पास ले आए और राजा से कहा, “देखिए, यह शाऊल के पुत्र, आपके शत्रु ईश्बोशेत का सिर है, जिसने आपके प्राण लेने की कोशिश की थी। आज याहवे ने मेरे प्रभु राजा को शाऊल और उसके वंश से बदला[a] दिलाया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘बदले’ (बहुवचन) है; यह बलवाचक बहुवचन के रूप में ‘बदला’ या ‘बदले के कार्य’ दर्शा सकता है।
    reason: स्रोत के बहुवचन रूप और उसके संभावित बलवाचक अथवा कार्य-बहुल अर्थ को सुरक्षित करना।
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: वे ... ले आए
  rationale: कथात्मक क्रम में प्रयुक्त क्रिया בוא यहाँ किसी वस्तु को दाऊद के पास लाने का अर्थ देती है; हिंदी में ‘ले आए’ स्वाभाविक और सटीक है।
- source_word: רֹאשׁ אִישׁ בֹּשֶׁת
  choice: ईशबोशेत का सिर
  rationale: רֹאשׁ यहाँ काटे गए वास्तविक सिर को दर्शाता है। व्यक्ति के नाम के लिए इसी पद में उपलब्ध मसोराई रूप का लिप्यंतरण किया गया है।
- source_word: חֶבְרוֹן
  choice: हेब्रोन
  rationale: स्थान-नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: הִנֵּה
  choice: देखिए, यह ... है
  rationale: प्रस्तुतीकरण और ध्यान आकर्षित करने वाली शक्ति को आधुनिक, आदरयुक्त हिंदी में व्यक्त करता है।
- source_word: אֹיִבְךָ
  choice: आपके शत्रु
  rationale: राजा को संबोधित बहुवचन-आदर के साथ संज्ञा का सीधा अनुवाद।
- source_word: בִּקֵּשׁ אֶת נַפְשֶׁךָ
  choice: जो आपके प्राण लेना चाहता था
  rationale: यह इब्रानी मुहावरा किसी की जान लेने का प्रयत्न या इच्छा दर्शाता है; शाब्दिक ‘प्राण को खोजता था’ आधुनिक हिंदी में भ्रामक होता।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה का हिंदी में निकट और स्पष्ट लिप्यंतरण।
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: मेरे प्रभु राजा को
  rationale: दरबारी आदरसूचक संबोधन और प्रथम पुरुष एकवचन संबंध—‘मेरे’—दोनों सुरक्षित रखे गए हैं।
- source_word: נְקָמוֹת
  choice: बदला
  rationale: स्रोत में बहुवचन रूप तीव्रता अथवा बदले के कार्यों को सूचित कर सकता है; मुख्य पाठ में स्वाभाविक सामूहिक एकवचन रखा गया है और रूपगत जानकारी पादटिप्पणी में दी गई है।
- source_word: מִשָּׁאוּל וּמִזַּרְעוֹ
  choice: शाऊल और उसके वंश से
  rationale: מן को बदला लिए जाने के लक्ष्य के रूप में और זֶרַע को सामूहिक अर्थ में ‘वंश’ के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है; उसे उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- issue: हत्यारों का यह दावा कि याहवे ने राजा को बदला दिलाया
  choice: दावे को बिना संपादकीय टिप्पणी के प्रत्यक्ष कथन के रूप में बनाए रखना
  alternative: ‘उनके अनुसार’ अथवा ‘मानो याहवे ने’ जैसे संदेहसूचक शब्द जोड़ना
  rationale: यह कथन पात्रों के प्रत्यक्ष भाषण में है। मूल पाठ यहाँ उनकी बात पर अनुवादक की टिप्पणी नहीं जोड़ता; आगे का प्रसंग उसका मूल्यांकन करता है।
translation_notes:
  register: आधुनिक मानक हिंदी, देवनागरी और आदरयुक्त राजकीय संबोधन का प्रयोग किया गया है। वाक्य को सहज रखा गया है, पर पात्रों के दावे और स्रोत की धर्मवैज्ञानिक तनावपूर्ण स्थिति को बिना व्याख्यात्मक जोड़ के सुरक्षित रखा गया है।
