  text: जब शाऊल के पुत्र ने सुना कि अब्नेर हेब्रोन में मर गया था, तो उसके हाथ ढीले पड़ गए[a], और सारा इस्राएल घबरा गया।
  philosophy: optimal-equivalence
  footnotes:
