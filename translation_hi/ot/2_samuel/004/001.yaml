    reason: मुहावरे के अभिप्राय को स्पष्ट करते हुए मूल शारीरिक रूपक को मुख्य पाठ में सुरक्षित रखना।
lexical_decisions:
- source_word: בֶּן שָׁאוּל
  choice: शाऊल के पुत्र
  rationale: यह रचना इशबोशेत की पहचान अप्रत्यक्ष रूप से करती है। पद में न आया हुआ उसका नाम जोड़ने के बजाय इब्रानी अभिव्यक्ति को स्वाभाविक हिन्दी में रखा गया है।
- source_word: כִּי
  choice: कि
  rationale: यह उसने जो समाचार सुना, उसकी विषय-वस्तु प्रस्तुत करता है।
- source_word: מֵת
  choice: मर गया था
  rationale: कालगत रूप से अब्नेर की मृत्यु सुनने से पहले घट चुकी थी; हिन्दी में पूर्ण भूतकाल इस संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּחֶבְרוֹן
  choice: हेब्रोन में
  rationale: स्थानवाचक בְּ का सामान्य और सीधा हिन्दी रूप।
- source_word: וַיִּרְפּוּ יָדָיו
  choice: उसके हाथ ढीले पड़ गए
  rationale: इब्रानी शारीरिक रूपक को बनाए रखते हुए शक्ति, साहस या संकल्प चुक जाने का भाव व्यक्त करता है।
- source_word: כָל יִשְׂרָאֵל
  choice: सारा इस्राएल
  rationale: इब्रानी में प्रयुक्त सामूहिक राष्ट्रीय संबोधन को सुरक्षित रखता है।
- source_word: נִבְהָלוּ
  choice: घबरा गया
  rationale: क्रिया विचलित, आतंकित या घबराया हुआ होने का भाव देती है; सामूहिक कर्ता ‘सारा इस्राएल’ के साथ यह वर्तमान हिन्दी में स्वाभाविक है।
