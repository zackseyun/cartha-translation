base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/010.yaml
  text: When someone told me[a], saying, ‘Look, Saul is dead,’ and he thought he was bringing good news in his own eyes[b], I seized him and killed him in Ziklag—that was the reward I gave him for his news.
translation:
  language: hi
  text: जब एक व्यक्ति ने मुझे यह कहते हुए बताया[a], “देखो, शाऊल मर गया है,” और वह अपने ही विचार में शुभ समाचार लानेवाला था, तब मैंने उसे पकड़कर सिकलग में मार डाला—यही वह इनाम था जो मैंने उसे उसके समाचार के बदले दिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक: “जिस व्यक्ति ने मुझे यह कहते हुए बताया, ‘देखो, शाऊल मर गया है,’ ...”'
    reason: lexical_alternative
  - marker: b
    text: अंतिम वाक्यांश इब्रानी में संक्षिप्त और व्यंग्यात्मक है। समाचार देनेवाला इनाम की आशा करता था, पर दाऊद का आशय है कि उसे अपने समाचार के बदले मृत्यु ही मिली।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: जब
  rationale: यहाँ यह शब्द दाऊद द्वारा पिछले कथन के समर्थन में एक खास घटना प्रस्तुत करता है; प्रसंग में काल-सूचक “जब” स्वाभाविक है।
- source_word: הַמַּגִּיד לִי לֵאמֹר
  choice: किसी ने मुझसे कहा
  rationale: लेखयुक्त कृदंत का शाब्दिक अर्थ “जिसने मुझे बताया” है। “किसी ने मुझसे कहा” आधुनिक हिन्दी में सहज है, जबकि [a] में अधिक औपचारिक रूप सुरक्षित रखा गया है।
- source_word: הִנֵּה מֵת שָׁאוּל
  choice: “देखो, शाऊल मर गया है”
  rationale: הִנֵּה ध्यान खींचने वाला शब्द है, जिसे “देखो” स्वाभाविक ढंग से व्यक्त करता है। מֵת यहाँ मृत्यु की पूर्ण अवस्था बताता है; “मर गया है” हिन्दी में इस भाव को स्पष्ट करता है।
- source_word: וְהוּא הָיָה כִמְבַשֵּׂר בְּעֵינָיו
  choice: और वह अपनी ही नज़र में शुभ समाचार देनेवाला था
  rationale: 'रूपक और मुहावरे दोनों को बनाए रखा गया है: כִמְבַשֵּׂר “शुभ समाचार देनेवाले के समान” और בְּעֵינָיו “अपनी नज़र में”। इससे उसका अपना आकलन व्यक्त होता है, बिना कथावाचक की सहमति जोड़े।'
- source_word: וָאֹחֲזָה בוֹ
  choice: मैंने उसे पकड़कर
  rationale: אָחַז का अर्थ मजबूती से पकड़ना या काबू में करना है। “पकड़कर” अगले कार्य से स्वाभाविक रूप से जुड़ता है।
- source_word: וָאֶהְרְגֵהוּ
  choice: मार डाला
  rationale: यह क्रिया सीधे हत्या या जान से मारने को बताती है। “मार डाला” स्पष्ट है और इसमें ऐसा न्यायिक अर्थ नहीं जोड़ा गया जो क्रिया में स्वयं नहीं है।
- source_word: בְּצִקְלָג
  choice: सिकलग में
  rationale: स्थान-नाम को हिन्दी में प्रचलित बाइबलीय लिप्यंतरण के अनुसार दिया गया है।
- source_word: אֲשֶׁר לְתִתִּי לוֹ בְּשֹׂרָה
  choice: यही वह इनाम था जो मैंने उसे उसके समाचार के बदले दिया
  rationale: इब्रानी वाक्यांश संक्षिप्त और व्यंग्यात्मक है। בְּשֹׂרָה समाचार, विशेषकर शुभ समाचार, और उसके लिए मिलने वाले पुरस्कार की धारणा से जुड़ सकता है। हिन्दी रूप अपेक्षित इनाम और वास्तविक दंड के व्यंग्य को स्पष्ट करता है।
