  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। “अपनी ही नज़र में” मूल इब्रानी की मूल्यांकन-संबंधी अस्पष्टता को बनाए रखता है, जबकि विस्मयादिबोधक चिह्न अंतिम कथन के प्रबल व्यंग्य को संकेतित करता है।
