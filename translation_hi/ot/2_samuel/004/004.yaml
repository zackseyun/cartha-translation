base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/004.yaml
  text: Jonathan son of Saul had a son crippled in his feet. He was five years old when the news about Saul and Jonathan came from Jezreel[a], and his nurse picked him up and fled. And as she hurried to flee, he fell and became lame. His name was Mephibosheth.
translation:
  language: hi
  text: शाऊल के पुत्र योनातान का एक पुत्र था, जो दोनों पैरों से विकलांग था।[a] जब शाऊल और योनातान के विषय में समाचार यिज्रेल से आया, तब वह पाँच वर्ष का था। उसकी धाय उसे उठाकर भागी। जब वह भागने की जल्दी में थी, तब बालक गिर पड़ा और लँगड़ा हो गया। उसका नाम मपीबोशेत था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पैरों में आहत”; इसका अनुवाद “दोनों पैरों से लँगड़ा” भी किया जा सकता है।
    reason: नְכֵה רַגְלָיִם के शाब्दिक बिंब और वैकल्पिक, अधिक विशिष्ट अनुवाद को सुरक्षित रखना।
lexical_decisions:
- source_word: נְכֵה רַגְלָיִם
  choice: दोनों पैरों से अशक्त
  rationale: इब्रानी पदबंध पैरों में शारीरिक अक्षमता बताता है। רַגְלָיִם द्विवचन है, इसलिए ‘दोनों पैरों’ स्वाभाविक और सटीक है; ‘अशक्त’ आधुनिक हिन्दी में गरिमापूर्ण है।
- source_word: בֶּן חָמֵשׁ שָׁנִים
  choice: पाँच वर्ष का था
  rationale: आयु बताने का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: בְּבֹא שְׁמֻעַת שָׁאוּל וִיהוֹנָתָן
  choice: जब शाऊल और योनातान के विषय में समाचार ... आया
  rationale: समय-सूचक infinitive construction और उनके विषय में आए समाचार—जिसकी विषयवस्तु पाठ यहाँ स्पष्ट नहीं करता—दोनों सुरक्षित रहते हैं।
- source_word: מִיִּזְרְעֶאל
  choice: यिज्रेल से
  rationale: स्थान से समाचार आने का सीधा और स्वाभाविक अनुवाद।
- source_word: אֹמַנְתּוֹ
  choice: उसकी धाय
  rationale: यह शब्द बच्चे की देखभाल और पालन करने वाली स्त्री को दर्शाता है; कथा-संदर्भ में ‘धाय’ संक्षिप्त और सटीक है।
- source_word: וַתִּשָּׂאֵהוּ
  choice: उसे उठाकर
  rationale: क्रिया उठाने और साथ ले जाने को व्यक्त करती है; भागने से पहले की तत्काल क्रिया हिन्दी में सहज रूप से आती है।
- source_word: וַתָּנֹס
  choice: भागी
  rationale: संकट में पलायन की साधारण कथात्मक क्रिया।
- source_word: בְּחָפְזָהּ לָנוּס
  choice: भागने की जल्दबाज़ी में
  rationale: भागने की हड़बड़ी को परिस्थिति और संभावित कारण दोनों के रूप में स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּפֹּל
  choice: वह गिर गया
  rationale: आगे की पुल्लिंग एकवचन क्रिया से स्पष्ट है कि गिरने वाला बालक है।
- source_word: וַיִּפָּסֵחַ
  choice: लँगड़ा हो गया
  rationale: क्रिया गिरने के परिणामस्वरूप उत्पन्न हुई अवस्था को बताती है; ‘हो गया’ उसका आरंभिक/परिणामी भाव बनाए रखता है।
- source_word: מְפִיבֹשֶׁת
  choice: मपीबोशेत
  rationale: इब्रानी नाम का निकट देवनागरी लिप्यंतरण।
