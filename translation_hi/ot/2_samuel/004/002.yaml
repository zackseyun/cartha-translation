  text: וּ/שְׁנֵ֣י אֲנָשִׁ֣ים שָׂרֵֽי גְדוּדִ֣ים הָי֪וּ בֶן שָׁא֟וּל שֵׁם֩ הָ/אֶחָ֨ד בַּֽעֲנָ֜ה וְ/שֵׁ֧ם הַ/שֵּׁנִ֣י רֵכָ֗ב בְּנֵ֛י רִמּ֥וֹן הַ/בְּאֶֽרֹתִ֖י מִ/בְּנֵ֣י בִנְיָמִ֑ן כִּ֚י גַּם בְּאֵר֔וֹת תֵּחָשֵׁ֖ב עַל בִּנְיָמִֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/002.yaml
  text: 'Saul’s son had two men who were commanders of raiding bands: the name of the one was Baanah[a], and the name of the second was Rechab, sons of Rimmon the Beerothite, from the sons of Benjamin; for Beeroth also was considered part of Benjamin.'
translation:
  language: hi
  text: शाऊल के पुत्र के पास छापामार दलों के दो सेनानायक थे। एक का नाम बाना और दूसरे का नाम रेकाब था। वे बेरोती रिम्मोन के पुत्र और बिन्यामीन के वंशज थे, क्योंकि बेरोत भी बिन्यामीन का भाग माना जाता था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, «बिन्यामीन में गिना जाता था।»
    reason: תֵּחָשֵׁב का शाब्दिक निकट विकल्प; पादटिप्पणी को संबद्ध अंतिम कथन पर रखा गया है।
lexical_decisions:
- source_word: שָׂרֵי גְדוּדִים
  choice: छापामार दलों के सेनानायक
  rationale: שָׂרֵי नेतृत्व अथवा सेनानायकत्व बताता है और גְדוּדִים यहाँ नियमित सैन्य टुकड़ियों से अधिक सशस्त्र छापामार दलों का बोध कराता है।
- source_word: בֶן שָׁאוּל
  choice: शाऊल के पुत्र
  rationale: एकवचन पदबंध पिछले संदर्भ के ईशबोशेत की ओर संकेत करता है; नाम जोड़े बिना संदर्भगत पहचान सुरक्षित रखी गई है।
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: एक का नाम ... और दूसरे का नाम
  rationale: हिब्रू की नामकरण-संरचना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּנֵי רִמּוֹן הַבְּאֶרֹתִי
  choice: बेरोती रिम्मोन के पुत्र
  rationale: दोनों पुरुषों को रिम्मोन के पुत्र और रिम्मोन को बेरोत का निवासी बताने वाले वंशगत तथा स्थानगत संबंध सुरक्षित हैं।
- source_word: מִבְּנֵי בִנְיָמִן
  choice: बिन्यामीन के वंशज
  rationale: शाब्दिक 'बिन्यामीन के पुत्रों में से' का सहज हिन्दी रूप, जो गोत्रीय वंश-संबंध बनाए रखता है।
- source_word: תֵּחָשֵׁב עַל בִּנְיָמִן
  choice: बिन्यामीन का भाग माना जाता था
  rationale: निफ़अल रूप किसी क्षेत्र को बिन्यामीन से संबद्ध अथवा उसमें गिना हुआ बताता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
