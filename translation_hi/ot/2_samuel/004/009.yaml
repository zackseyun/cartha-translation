  text: पर दाऊद ने बेएरोती रिम्मोन के पुत्र रेकाब और उसके भाई बाना को उत्तर दिया, “याहवे[a] के जीवन की शपथ, जिसने मेरे जीवन को हर संकट से छुड़ाया है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH (יהוה); परंपरागत हिंदी रूप: ‘यहोवा’।'
    reason: ईश्वरीय नाम के मूल रूप और प्रचलित वैकल्पिक हिंदी रूप की जानकारी।
lexical_decisions:
- source_word: וַיַּעַן
  choice: उत्तर दिया
  rationale: यह क्रिया संवाद में प्रत्युत्तर को सूचित करती है; ‘उत्तर दिया’ स्वाभाविक हिंदी में कथात्मक सूत्र को बनाए रखता है।
- source_word: רֵכָב וְאֶת־בַּעֲנָה אָחִיו
  choice: रेकाब और उसके भाई बाना
  rationale: אָחִיו एकवचन है और स्वाभाविक रूप से बाना को रेकाब का भाई बताता है। नामों का अनुवाद नहीं, देवनागरी लिप्यंतरण किया गया है।
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  choice: बेरोती रिम्मोन के पुत्र
  rationale: यह पदबंध पिता और उसके मूल-स्थान/निवासी पहचान, दोनों को व्यक्त करता है; हिंदी का यह क्रम संबंध को स्पष्ट और सहज रखता है।
- source_word: חַי יְהוָה
  choice: जीवित याहवे की शपथ
  rationale: यह इब्रानी की प्रचलित गंभीर शपथ-विधि है। हिंदी में ‘की शपथ’ जोड़ने से इसका वाक्यगत कार्य स्पष्ट होता है, जबकि ‘जीवित’ और परमेश्वर का व्यक्तिगत नाम सुरक्षित रहते हैं।
- source_word: פָּדָה
  choice: छुड़ाया है
  rationale: פדה संकट से मुक्त कराने या छुड़ाने का बोध देता है। इस संदर्भ में ‘छुड़ाया है’ साधारण पाठक के लिए स्वाभाविक है और पूर्ण क्रिया की वर्तमान प्रासंगिकता बनाए रखता है।
- source_word: נַפְשִׁי
  choice: मेरे जीवन को
  rationale: यहाँ נֶפֶשׁ खतरे में पड़े दाऊद के जीवन/स्वयं को दर्शाता है, केवल अभौतिक ‘आत्मा’ को नहीं।
- source_word: מִכָּל־צָרָה
  choice: हर संकट से
  rationale: צָרָה संकट, विपत्ति या क्लेश को सूचित करता है; כָּל की व्यापकता ‘हर’ से व्यक्त होती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका निकट देवनागरी लिप्यंतरण है; पादटिप्पणी पाठकों को इब्रानी रूप से अवगत कराती है।
- issue: נַפְשִׁי का मानव-स्वरूप संबंधी अर्थ
  choice: मेरे जीवन को
  alternative: मेरे प्राण को / मेरी आत्मा को / मुझे
  rationale: संदर्भ दाऊद को सभी संकटों से जीवित बचाए जाने का है। इसलिए ऐसा अनुवाद चुना गया है जो ‘आत्मा’ को शरीर से अलग किसी तकनीकी अर्थ में अनावश्यक रूप से निर्धारित न करे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। शपथ-विधि को शब्दशः कठोर बनाने के बजाय हिंदी में स्पष्ट किया गया है। पद अगले वाक्य में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है।
