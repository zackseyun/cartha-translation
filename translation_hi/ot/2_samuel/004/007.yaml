source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ הַ/בַּ֗יִת וְ/הֽוּא שֹׁכֵ֤ב עַל מִטָּת/וֹ֙ בַּ/חֲדַ֣ר מִשְׁכָּב֔/וֹ וַ/יַּכֻּ֨/הוּ֙ וַ/יְמִתֻ֔/הוּ וַ/יָּסִ֖ירוּ אֶת רֹאשׁ֑/וֹ וַ/יִּקְחוּ֙ אֶת רֹאשׁ֔/וֹ וַ/יֵּֽלְכ֛וּ דֶּ֥רֶךְ הָ/עֲרָבָ֖ה כָּל הַ/לָּֽיְלָה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/007.yaml
  text: They came into the house while he was lying on his bed in his bedroom[a], and they struck him and put him to death. Then they removed his head, took his head[c][b], and went by way of the Arabah all night.
translation:
  language: hi
  text: वे घर के भीतर आए। उस समय वह अपने सोने के कमरे[a] में अपने बिस्तर पर लेटा हुआ था। उन्होंने उस पर वार किया और उसे मार डाला। फिर उन्होंने उसका सिर अलग कर दिया[b], उसका सिर साथ लिया, और सारी रात अराबा[c] के मार्ग से चलते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस कमरे में जहाँ वह सोता था।”
    reason: lexical_alternative
  - marker: b
    text: या, “उन्होंने उसका सिर काट दिया।” इब्रानी क्रिया का अधिक शाब्दिक अर्थ “उसका सिर हटा दिया” है।
    reason: lexical_alternative
  - marker: c
    text: अराबा यरदन की दरार-घाटी और मैदानी क्षेत्र का भौगोलिक नाम है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ הַבַּיִת
  choice: वे घर के भीतर आए
  rationale: בוא और दिशासूचक הַבַּיִת का स्वाभाविक अर्थ घर में प्रवेश करना है; यह हिन्दी में कथा की गति को स्पष्ट रखता है।
- source_word: וְהוּא שֹׁכֵב עַל מִטָּתוֹ
  choice: उस समय वह ... अपने बिस्तर पर लेटा हुआ था
  rationale: यह परिस्थितिसूचक उपवाक्य उनके प्रवेश के समय उसकी अवस्था बताता है।
- source_word: בַּחֲדַר מִשְׁכָּבוֹ
  choice: अपने सोने के कमरे में
  rationale: रचना का शाब्दिक भाव उसके सोने या लेटने का कमरा है; यह आधुनिक हिन्दी में स्वाभाविक है और 'शयनकक्ष' से अधिक सामान्य पाठक-सुलभ है।
- source_word: וַיַּכֻּהוּ
  choice: उन्होंने उस पर वार किया
  rationale: נכה हिंसक प्रहार को व्यक्त करता है। 'वार किया' अगले स्वतंत्र क्रिया-रूप 'मार डाला' को अपने में नहीं मिलाता।
- source_word: וַיְמִתֻהוּ
  choice: उसे मार डाला
  rationale: מות का हिफ़ील रूप मृत्यु कारित करने का अर्थ देता है; हिन्दी में 'मार डाला' उसका स्पष्ट और स्वाभाविक रूप है।
- source_word: וַיָּסִירוּ אֶת רֹאשׁוֹ
  choice: उन्होंने उसका सिर अलग कर दिया
  rationale: हिफ़ील סור का मूल अर्थ हटाना या अलग करना है; प्रसंग में सिर को शरीर से अलग करना अभिप्रेत है, पर 'काट दिया' साधन को मूल से अधिक स्पष्ट करता।
- source_word: וַיִּקְחוּ אֶת רֹאשׁוֹ
  choice: उसका सिर साथ लिया
  rationale: לקח का सामान्य अर्थ लेना है। 'साथ लिया' अगले यात्रा-वर्णन से संबंध स्पष्ट करता और मूल में 'सिर' की कठोर पुनरावृत्ति बनाए रखता है।
- source_word: וַיֵּלְכוּ דֶּרֶךְ הָעֲרָבָה
  choice: अराबा के मार्ग से चलते रहे
  rationale: דֶּרֶךְ स्थान-नाम के साथ 'के मार्ग से' का अर्थ देता है; अराबा को भौगोलिक नाम के रूप में लिप्यंतरित किया गया है।
- source_word: כָּל הַלָּיְלָה
  choice: सारी रात
  rationale: यह आधुनिक हिन्दी में पूरे रातभर की अवधि का सहज रूप है।
