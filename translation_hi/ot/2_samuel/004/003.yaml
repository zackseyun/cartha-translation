  yaml_path: translation/ot/2_samuel/004/003.yaml
  text: But the Beerothites fled to Gittaim and have lived there as sojourners to this day[a].
translation:
  language: hi
  text: परन्तु बेरोती लोग गित्तैम को भाग गए थे और आज तक वहाँ परदेशियों के रूप में रहते आए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבְרְחוּ
  choice: भाग गए थे
  rationale: ברח के काल रूप का अर्थ ‘भाग जाना’ है। प्रसंग में यह आसपास की घटनाओं की पृष्ठभूमि बताता है, इसलिए हिन्दी का पूर्ण भूतकाल स्वाभाविक है।
- source_word: הַבְּאֵרֹתִים
  choice: बेरोती लोग
  rationale: यह बेरोत के निवासियों का बहुवचन जातिवाचक नाम है; ‘बेरोती लोग’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: גִּתָּיְמָה
  choice: गित्तैम को
  rationale: स्थान-नाम के साथ दिशासूचक ה गति को दर्शाता है; ‘गित्तैम को’ गन्तव्य को स्पष्ट करता है।
- source_word: וַיִּהְיוּ שָׁם
  choice: वहाँ ... रहते आए हैं
  rationale: עַד הַיּוֹם הַזֶּה के साथ यह अतीत से कथाकार के वर्तमान तक जारी निवास व्यक्त करता है।
- source_word: גָּרִים
  choice: परदेशियों के रूप में
  rationale: גור गैर-स्थानीय निवासी के रूप में रहने की सामाजिक स्थिति दर्शाता है; ‘परदेशी’ इस अर्थ को सामान्य हिन्दी में व्यक्त करता है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: यह कथाकार के समय तक स्थिति जारी रहने का स्वाभाविक हिन्दी मुहावरा है।
- source_word: וַ
  choice: परन्तु
  rationale: संयोजक यहाँ पिछले कथन के साथ हल्का विरोध और पृष्ठभूमि-स्पष्टीकरण प्रस्तुत करता है।
