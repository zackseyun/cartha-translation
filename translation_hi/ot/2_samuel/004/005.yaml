  text: וַ/יֵּ֨לְכ֜וּ בְּנֵֽי רִמּ֤וֹן הַ/בְּאֵֽרֹתִי֙ רֵכָ֣ב וּ/בַעֲנָ֔ה וַ/יָּבֹ֨אוּ֙ כְּ/חֹ֣ם הַ/יּ֔וֹם אֶל בֵּ֖ית אִ֣ישׁ בֹּ֑שֶׁת וְ/ה֣וּא שֹׁכֵ֔ב אֵ֖ת מִשְׁכַּ֥ב הַֽ/צָּהֳרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/005.yaml
  text: The sons of Rimmon the Beerothite[a], Rekab and Baanah, went and came to the house of Ish-bosheth in the heat of the day[b], while he was lying down for his midday rest.
translation:
  language: hi
  text: तब बेरोती रिम्मोन के पुत्र रेकाब और बाना चल पड़े और दिन की तपती गर्मी में ईशबोशेत के घर पहुँचे। उस समय वह दोपहर के विश्राम के लिए लेटा हुआ था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  choice: बेरोती रिम्मोन के पुत्र
  rationale: בְּנֵי का सामान्य अर्थ ‘पुत्र’ है, और यहाँ रेकाब तथा बाना को तुरंत नाम से बताए जाने के कारण वास्तविक पारिवारिक संबंध सबसे स्वाभाविक है। הַבְּאֵרֹתִי को आधुनिक हिंदी में स्थान-संबंधी विशेषण के रूप में ‘बेरोती’ रखा गया है।
- source_word: רֵכָב וּבַעֲנָה
  choice: रेकाब और बाना
  rationale: नामों का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: וַיֵּלְכוּ
  choice: चल पड़े
  rationale: הלך की गति-सूचक कथात्मक क्रिया को स्वाभाविक हिंदी में व्यक्त करता है और अगली क्रिया ‘पहुँचे’ के साथ घटनाक्रम स्पष्ट रखता है।
- source_word: וַיָּבֹאוּ
  choice: पहुँचे
  rationale: בוא के ‘आना/पहुँचना’ अर्थ को אֶל־בֵּית के साथ स्वाभाविक हिंदी में ‘घर पहुँचे’ कहा गया है; इससे घर के भीतर प्रवेश का अनावश्यक दावा नहीं किया जाता।
- source_word: כְּחֹם הַיּוֹם
  choice: दिन की तपती गरमी में
  rationale: वाक्यांश दिन के गरम या सबसे गरम समय को दर्शाता है। यह अनुवाद मूल बिंब बनाए रखते हुए सहज हिंदी देता है और इसे ठीक बारह बजे तक सीमित नहीं करता।
- source_word: בֵּית אִישׁ־בֹּשֶׁת
  choice: ईशबोशेत के घर
  rationale: इब्रानी संबंधवाचक रचना का सीधा और स्वाभाविक हिंदी रूप; व्यक्ति के नाम का अनुवाद नहीं, लिप्यंतरण किया गया है।
- source_word: וְהוּא שֹׁכֵב אֵת מִשְׁכַּב הַצָּהֳרָיִם
  choice: उस समय वह दोपहर का विश्राम कर रहा था
  rationale: शाब्दिक ‘दोपहर का लेटना’ हिंदी में अस्वाभाविक है। ‘दोपहर का विश्राम’ आशय को गरिमापूर्ण और सुबोध ढंग से व्यक्त करता है, जबकि ‘सो रहा था’ कहकर नींद की अवस्था निश्चित नहीं करता।
