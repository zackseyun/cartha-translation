base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/006.yaml
  text: And there they came into the midst of the house[a], taking wheat, and they struck him in the belly. Then Rekab and Baanah his brother escaped.
translation:
  language: hi
  text: और वे गेहूँ लेते हुए घर के भीतर तक आए[a] और उन्होंने उसके पेट में वार किया। फिर रेकाब और बाना, उसका भाई, बच निकले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “घर के बीच तक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנָּה
  choice: और वे
  rationale: यह संयोजन अगले घटनाक्रम की ओर संकेत करता है। हिंदी में कर्ता के साथ ‘और वे’ स्वाभाविक कथा-प्रवाह देता है; ‘देखो’ यहाँ अनावश्यक रूप से नाटकीय होता।
- source_word: עַד תּוֹךְ הַבַּיִת
  choice: घर के भीतर तक
  rationale: עַד और תּוֹךְ मिलकर घर के अंदरूनी भाग तक पहुँचने का भाव देते हैं। यह अभिव्यक्ति सहज हिंदी में उस गहरे प्रवेश को बनाए रखती है।
- source_word: לֹקְחֵי חִטִּים
  choice: गेहूँ लेनेवाले बनकर
  rationale: शाब्दिक रूप से यह ‘गेहूँ लेनेवाले’ है। प्रसंग में कृदंत प्रवेश के ढंग या भूमिका को बताता है; ‘बनकर’ इस संक्षिप्त हिब्रू रचना को स्वाभाविक हिंदी में व्यक्त करता है, बिना स्पष्ट रूप से ‘बहाना’ जोड़ने के।
- source_word: וַיַּכֻּהוּ
  choice: उन्होंने उसके ... वार किया
  rationale: נכה का मूल अर्थ मारना या प्रहार करना है। परिणाम मृत्यु है, पर इस उपवाक्य में क्रिया स्वयं वार का वर्णन करती है, इसलिए ‘मार डाला’ नहीं किया गया।
- source_word: אֶל הַחֹמֶשׁ
  choice: पेट में
  rationale: חֹמֶשׁ शरीर के पेट अथवा उदर-भाग को सूचित करता है। ‘पेट’ आधुनिक सामान्य हिंदी में स्पष्ट है; पारंपरिक ‘पाँचवीं पसली के नीचे’ संभावित पर कम निश्चित व्याख्या है।
- source_word: נִמְלָטוּ
  choice: बच निकले
  rationale: מלט के निफ़अल रूप का अर्थ संकट या पकड़ से निकल जाना है। ‘बच निकले’ सफल पलायन को स्वाभाविक हिंदी में व्यक्त करता है।
