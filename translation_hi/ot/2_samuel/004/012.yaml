source:
  edition: WLC
  text: וַ/יְצַו֩ דָּוִ֨ד אֶת הַ/נְּעָרִ֜ים וַ/יַּהַרְג֗וּ/ם וַֽ/יְקַצְּצ֤וּ אֶת יְדֵי/הֶם֙ וְ/אֶת רַגְלֵי/הֶ֔ם וַ/יִּתְל֥וּ עַל הַ/בְּרֵכָ֖ה בְּ/חֶבְר֑וֹן וְ/אֵ֨ת רֹ֤אשׁ אִֽישׁ בֹּ֨שֶׁת֙ לָקָ֔חוּ וַ/יִּקְבְּר֥וּ בְ/קֶֽבֶר אַבְנֵ֖ר בְּ/חֶבְרֽוֹן־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/012.yaml
  text: Then David commanded the young men[a], and they killed them and cut off their hands and their feet and hung them by the pool at Hebron. But they took the head of Ish-bosheth and buried it in the tomb of Abner at Hebron.
translation:
  language: hi
  text: तब दाऊद ने जवानों को आज्ञा दी। उन्होंने उन दोनों को मार डाला, उनके हाथ और पाँव काट दिए, और उन्हें हेब्रोन के तालाब के पास[a] लटका दिया। परन्तु उन्होंने ईशबोशेत का सिर लेकर उसे हेब्रोन में अब्नेर की कब्र में दफना दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तालाब पर।”
    reason: इब्रानी संबंधबोधक עַל यहाँ तालाब के निकट या उस स्थान पर होने का व्यापक स्थानसूचक अर्थ दे सकता है।
lexical_decisions:
- source_word: וַיְצַו דָּוִד
  choice: तब दाऊद ने ... आज्ञा दी
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी क्रम व्यक्त करता है और צוה की आदेशात्मक शक्ति ‘आज्ञा दी’ में बनी रहती है।
- source_word: הַנְּעָרִים
  choice: जवानों
  rationale: נְעָרִים का अर्थ युवक, सेवक या परिचारक हो सकता है। ‘जवानों’ मूल का आयु-संबंधी अर्थ बनाए रखता है और दाऊद के आदेश का पालन करने वाले लोगों के लिए स्वाभाविक है।
- source_word: וַיַּהַרְגוּם
  choice: उन्होंने उन दोनों को मार डाला
  rationale: הרג सामान्यतः ‘मार डालना’ है। प्रसंग में कर्मी रेकाब और बाना दो व्यक्ति हैं, इसलिए स्वाभाविक हिन्दी में ‘उन दोनों’ कहा गया है।
- source_word: וַיְקַצְּצוּ אֶת יְדֵיהֶם וְאֶת רַגְלֵיהֶם
  choice: उनके हाथ और पाँव काट दिए
  rationale: קצץ का अर्थ काट देना या अलग कर देना है। दोनों अंगों का स्पष्ट उल्लेख मूल की कठोरता को बिना नरम किए बनाए रखता है।
- source_word: וַיִּתְלוּ עַל הַבְּרֵכָה
  choice: उन्हें ... तालाब के पास लटका दिया
  rationale: תלה का सीधा अर्थ ‘लटकाना’ है। यहाँ עַל स्थानसूचक व्यापक अर्थ में तालाब के पास/पर होने का संकेत दे सकता है; मुख्य पाठ में ‘के पास’ आधुनिक हिन्दी में सर्वाधिक स्वाभाविक है।
- source_word: בְּחֶבְרוֹן
  choice: हेब्रोन के ... / हेब्रोन में
  rationale: तालाब के साथ ‘हेब्रोन के तालाब’ स्वाभाविक संबंध व्यक्त करता है, जबकि दफनाने के स्थान के लिए ‘हेब्रोन में’ उपयुक्त है।
- source_word: רֹאשׁ אִישׁ בֹּשֶׁת
  choice: ईशबोशेत का सिर
  rationale: यह सीधी संबंधवाचक रचना है; व्यक्ति के नाम को प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: לָקָחוּ
  choice: लेकर
  rationale: לקח का सामान्य अर्थ ‘लेना’ है। संयुक्त क्रिया ‘लेकर ... दफना दिया’ हिन्दी में कथा-क्रम को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: וַיִּקְבְּרוּ בְקֶבֶר אַבְנֵר
  choice: उसे ... अब्नेर की कब्र में दफना दिया
  rationale: कर्म के रूप में सिर निहित है, जिसे हिन्दी में ‘उसे’ से स्पष्ट किया गया है। קבר के लिए ‘कब्र’ और क्रिया के लिए ‘दफना दिया’ सहज तथा अर्थनिष्ठ हैं।
theological_decisions:
- issue: दाऊद के कार्य का नैतिक या धर्मवैचारिक मूल्यांकन
  choice: घटना को मूल पाठ की तरह सीधे वर्णित किया गया है, बिना अतिरिक्त नैतिक टिप्पणी के।
  alternative: ‘न्यायपूर्वक मृत्युदण्ड दिया’ जैसे स्पष्ट न्यायिक शब्द जोड़ना।
  rationale: यह पद आदेश, हत्या, अंग काटने और सार्वजनिक प्रदर्शन का वर्णन करता है, पर इसी वाक्य में उनका स्पष्ट धर्मवैचारिक मूल्यांकन नहीं करता। अनुवाद को कथा की कठोरता और नैतिक तनाव दोनों बनाए रखने चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधी, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध शैली अपनाई गई है। हिंसक विवरण को न तो नरम किया गया है, न अधिक नाटकीय। फुटनोट-चिह्न [a] उसी वाक्यांश पर रखा गया है जिससे उसका भाषिक विकल्प संबंधित है।
