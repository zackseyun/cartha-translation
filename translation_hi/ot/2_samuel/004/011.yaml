source:
  edition: WLC
  text: אַ֞ף כִּֽי אֲנָשִׁ֣ים רְשָׁעִ֗ים הָרְג֧וּ אֶת אִישׁ צַדִּ֛יק בְּ/בֵית֖/וֹ עַל מִשְׁכָּב֑/וֹ וְ/עַתָּ֗ה הֲ/ל֨וֹא אֲבַקֵּ֤שׁ אֶת דָּמ/וֹ֙ מִ/יֶּדְ/כֶ֔ם וּ/בִעַרְתִּ֥י אֶתְ/כֶ֖ם מִן הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/011.yaml
  text: How much more[a], when wicked men have killed a righteous man in his own house on his bed[b], should I not now require his blood from your hand and purge you from the land?
translation:
  language: hi
  text: तो फिर, कितना अधिक, जब दुष्ट लोगों ने एक धर्मी व्यक्ति को उसी के घर में, उसके बिछौने पर मार डाला है, तो क्या मैं अब तुमसे उसके खून का हिसाब न माँगूँ[a] और तुम्हें इस देश में से मिटा न दूँ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसका खून तुम्हारे हाथ से माँगूँ।” यह इब्रानी मुहावरा उसके बहाए गए खून के लिए उन्हें जवाबदेह ठहराने का अर्थ देता है।
    reason: lexical_alternative
  - marker: b
    text: “इस देश में से मिटा दूँ” यहाँ हत्यारों को न्यायिक दंड देकर देश से हटा देने या नष्ट कर देने की बात है, केवल अनुष्ठानिक शुद्धि की नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: אַף כִּי
  choice: तो फिर, जब
  rationale: यह पद 10 की अपेक्षाकृत छोटी घटना से इस बड़ी घटना की ओर तर्क को आगे बढ़ाता है। ‘तो फिर, जब’ आधुनिक हिन्दी में इस अधिक प्रबल निष्कर्ष को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲנָשִׁים רְשָׁעִים
  choice: दुष्ट लोगों
  rationale: यह मूल के स्पष्ट नैतिक मूल्यांकन को सहज और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: הָרְגוּ
  choice: मार डाला है
  rationale: मूल क्रिया सामान्यतः ‘मारना’ है; प्रसंग हत्या का है, पर मुख्य पाठ में उससे अधिक विशिष्ट क्रिया थोपना आवश्यक नहीं। पूर्ण हो चुके काम की वर्तमान प्रासंगिकता ‘है’ से व्यक्त होती है।
- source_word: אִישׁ צַדִּיק
  choice: एक धर्मी मनुष्य
  rationale: ‘धर्मी’ צַדִּיק का निकट और बाइबिलीय रूप से परिचित अर्थ है; यह केवल कानूनी ‘निर्दोष’ तक अर्थ को सीमित नहीं करता।
- source_word: בְּבֵיתוֹ עַל מִשְׁכָּבוֹ
  choice: उसी के घर में, उसके बिछौने पर
  rationale: ‘उसी के’ निजी और सुरक्षित स्थान में किए गए अपराध की गंभीरता उभारता है; ‘बिछौना’ מִשְׁכָּב का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: הֲלוֹא אֲבַקֵּשׁ אֶת דָּמוֹ מִיֶּדְכֶם
  choice: क्या मैं अब उसके खून का हिसाब तुम्हारे हाथों से न लूँ
  rationale: यह प्रश्न की अपेक्षित सकारात्मक प्रतिक्रिया और ‘हाथ से खून माँगने’ के न्यायिक मुहावरे, दोनों को बनाए रखता है। ‘हिसाब लेना’ साधारण पाठक के लिए जवाबदेही का आशय स्पष्ट करता है।
- source_word: וּבִעַרְתִּי אֶתְכֶם מִן הָאָרֶץ
  choice: और तुम्हें इस देश से मिटा न दूँ
  rationale: בער यहाँ न्यायिक रूप से अपराधियों को दूर कर देने का बोध देता है। ‘मिटा दूँ’ उसकी कठोरता बनाए रखता है, जबकि ‘इस देश से’ הארץ को प्रसंगानुकूल रूप देता है।
theological_decisions:
- issue: खून की जवाबदेही के मुहावरे को व्यक्तिगत प्रतिशोध या न्यायिक उत्तरदायित्व के रूप में प्रस्तुत करना
  choice: ‘उसके खून का हिसाब तुम्हारे हाथों से लेना’ के रूप में न्यायिक मुहावरा बनाए रखा गया
  alternative: ‘उसके खून का बदला तुमसे लेना’ या ‘उसकी हत्या के लिए तुम्हें उत्तरदायी ठहराना’
  rationale: मूल में ‘खून’ और ‘हाथ’ की ठोस न्यायिक भाषा है। ‘हिसाब लेना’ उसका अर्थ समझने योग्य बनाता है, पर उसे केवल निजी बदले तक सीमित नहीं करता।
- issue: ‘देश से मिटाना’ को धार्मिक शुद्धि या दंडात्मक निष्कासन समझना
  choice: इसे अपराधियों को न्यायिक दंड द्वारा देश से दूर करने के अर्थ में प्रस्तुत किया गया
  alternative: इसे केवल अनुष्ठानिक शुद्धि समझना
  rationale: प्रसंग में दाऊद हत्यारों के विरुद्ध दंड घोषित करता है; इसलिए यहाँ शुद्धि की भाषा का ठोस न्यायिक परिणाम है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और न्यायिक गंभीरता वाली रखी गई है। ‘धर्मी’, ‘खून का हिसाब’ और ‘देश से मिटा देना’ मूल की नैतिक तथा कानूनी बनावट को साधारण पाठक के लिए समझने योग्य रूप में सुरक्षित रखते हैं।
