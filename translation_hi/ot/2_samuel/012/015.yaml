base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/015.yaml
  text: Then Nathan went to his house[a], and Yahweh struck the child whom Uriah’s wife had borne to David[c][b], and it became sick.
translation:
  language: hi
  text: फिर नातान अपने घर चला गया। और यहोवा ने उस बच्चे पर प्रहार किया, जिसे ऊरिय्याह की पत्नी ने दाऊद के लिए जन्म दिया था, और वह बीमार पड़ गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: फिर ... चला गया
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘फिर’ स्वाभाविक हिन्दी में घटनाक्रम स्पष्ट करता है।
- source_word: בֵּיתוֹ
  choice: अपने घर
  rationale: इब्रानी का सीधा अर्थ ‘उसका घर’ है; हिन्दी में कर्ता नातान की ओर संकेत करने के लिए ‘अपने घर’ अधिक स्वाभाविक है।
- source_word: וַיִּגֹּף
  choice: मारा
  rationale: नָגַף हानिकारक रीति से प्रहार करने को व्यक्त करता है। ‘मारा’ प्रत्यक्ष दैवी कर्तृत्व बनाए रखता है, जबकि बीमारी का स्वरूप अगले खंड से स्पष्ट होता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: הַיֶּלֶד
  choice: उस बच्चे को
  rationale: संदर्भ में एक छोटे बच्चे की बात है; हिन्दी कथाप्रवाह में ‘उस बच्चे’ पूर्वोक्त शिशु की पहचान स्पष्ट करता है।
- source_word: אֲשֶׁר יָלְדָה אֵשֶׁת אוּרִיָּה לְדָוִד
  choice: जिसे ऊरिय्याह की पत्नी ने दाऊद के लिए जन्म दिया था
  rationale: सापेक्ष उपवाक्य और לְדָוִד दोनों सुरक्षित हैं। ‘ऊरिय्याह की पत्नी’ को बतशेबा नाम से नहीं बदला गया, जिससे मूल कथा का नैतिक रूप से अर्थपूर्ण संबोधन बना रहता है।
- source_word: וַיֵּאָנַשׁ
  choice: और वह बीमार पड़ गया
  rationale: क्रिया बच्चे के बीमार हो जाने को बताती है। पुल्लिंग ‘वह’ हिन्दी में ‘बच्चे’ से स्वाभाविक रूप से मेल खाता है और रोग की तीव्रता को अनावश्यक रूप से नहीं बढ़ाता।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ के व्यक्तिगत नाम को उपाधि से प्रतिस्थापित न करके हिन्दी में परिचित लिप्यंतरण दिया गया है।
- issue: बच्चे की बीमारी में परमेश्वर का प्रत्यक्ष कर्तृत्व
  choice: यहोवा ने उस बच्चे को मारा
  alternative: यहोवा ने उस बच्चे को पीड़ित किया
  rationale: इब्रानी पाठ कर्तृत्व सीधे यहोवा को देता है। ‘मारा’ इस तनाव को नरम किए बिना נָגַף की प्रहार-संबंधी शक्ति रखता है; अंतिम खंड परिणाम को बीमारी के रूप में बताता है।
- issue: बच्चे की माता का संबोधन
  choice: ऊरिय्याह की पत्नी
  alternative: बतशेबा
  rationale: मूल कथाकार यहाँ स्त्री का नाम नहीं लेता। इस पदनाम को बनाए रखने से कथा में ऊरिय्याह के साथ हुए अन्याय की जानबूझकर रखी गई स्मृति सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य-विन्यास इब्रानी घटनाक्रम और उसके कठोर धार्मिक तनाव को स्पष्ट रूप से बनाए रखता है।
