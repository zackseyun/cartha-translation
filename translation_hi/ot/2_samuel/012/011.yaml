base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/011.yaml
  text: 'Thus says Yahweh: Behold[a], I am raising up disaster against you from your own house, and I will take your wives before your eyes and give them to your neighbor[b], and he will lie with your wives in the sight of this sun.'
translation:
  language: hi
  text: 'याहवे यों कहता है: देख, मैं तेरे ही घराने से तेरे विरुद्ध विपत्ति खड़ी कर रहा हूँ। मैं तेरी आँखों के सामने तेरी पत्नियों को लेकर तेरे साथी[a] को दे दूँगा, और वह इस सूर्य के सामने[b] तेरी पत्नियों के साथ सोएगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ “पड़ोसी,” “साथी” या “परिचित” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “इस सूर्य के सामने”; अर्थात खुलेआम और सबके सामने।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट इब्रानी नाम को लिप्यंतरित करता है और उसे सामान्य उपाधि में नहीं बदलता।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: भविष्यद्वक्ताओं की मानक संदेशवाहक घोषणा को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: הִנְנִי
  choice: देख, मैं ... करने वाला हूँ
  rationale: ध्यान आकर्षित करने वाले कण का बल बनाए रखते हुए आगामी कार्रवाई की निकटता और निश्चितता व्यक्त करता है।
- source_word: מֵקִים ... רָעָה
  choice: विपत्ति खड़ी करने वाला हूँ
  rationale: רָעָה यहाँ नैतिक बुराई नहीं, न्यायस्वरूप आने वाली विपत्ति है; 'खड़ी करना' מֵקִים की छवि को बनाए रखता है।
- source_word: מִבֵּיתֶךָ
  choice: तेरे ही घराने से
  rationale: '''घर'' यहाँ दाऊद के परिवार अथवा राजघराने का द्योतक है; ''ही'' विपत्ति के उसी के घर के भीतर से उठने पर बल देता है।'
- source_word: לְעֵינֶיךָ
  choice: तेरी आँखों के सामने
  rationale: इब्रानी की ठोस दृष्टिगत छवि और दाऊद की जानकारी में होने का भाव सुरक्षित रखता है।
- source_word: לְרֵעֶיךָ
  choice: तेरे निकट के व्यक्ति
  rationale: רֵעַ का अर्थ पड़ोसी, साथी या निकट संबंध वाला व्यक्ति हो सकता है। यह चयन संदर्भ में निकटता को व्यक्त करता है, पर किसी विशिष्ट संबंध को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וְשָׁכַב עִם
  choice: के साथ सोएगा
  rationale: हिन्दी में समझ में आने वाला यौन-संबंधसूचक शिष्टोक्ति है और मूल की गंभीरता बनाए रखती है।
- source_word: לְעֵינֵי הַשֶּׁמֶשׁ הַזֹּאת
  choice: इस सूर्य की आँखों के सामने
  rationale: मूल की असामान्य और ठोस अभिव्यक्ति को सुरक्षित रखता है; पादटिप्पणी इसका सार्वजनिक रूप से होने वाला आशय स्पष्ट करती है।
theological_decisions:
- issue: ईश्वरीय न्याय के संदर्भ में רָעָה का अर्थ
  choice: विपत्ति
  alternative: बुराई
  rationale: इस न्यायिक प्रसंग में शब्द का आशय दाऊद पर आने वाली हानि या विपत्ति है, न कि परमेश्वर द्वारा नैतिक बुराई करना। अनुवाद न्याय के ईश्वरीय कर्तृत्व को बनाए रखता है, पर नैतिक दुष्टता का अर्थ आरोपित नहीं करता।
- issue: לְרֵעֶיךָ में संबंध की पहचान
  choice: तेरे निकट के व्यक्ति
  alternative: तेरे पड़ोसी / तेरे साथी
  rationale: मूल संज्ञा संबंध की सटीक प्रकृति को खुला छोड़ती है। अनुवाद उस अस्पष्टता को सुरक्षित रखता है और बाद की कथा के आधार पर नाम या संबंध को पद में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वक्तीय शैली रखी गई है। दाऊद को सीधे संबोधन के कारण एकवचन 'तू/तेरा' रूप मूल की निकट और तीखी वाणी को दर्शाता है। 'घराने' से पारिवारिक-राजवंशीय क्षेत्र स्पष्ट होता है।
