  choice: घोर तिरस्कार किया है
  rationale: इनफिनिटिव ऐब्सोल्यूट और सीमित क्रिया की पुनरुक्ति तिरस्कार की तीव्रता को दर्शाती है; ‘घोर’ उस बल को सहज हिन्दी में रखता है।
- source_word: אֶת אֹיְבֵי יְהוָה
  choice: यहोवा के शत्रुओं का
  rationale: प्रदत्त मसोराई पाठ में सीधा कर्म ‘यहोवा के शत्रु’ है; कठिन होने पर भी मुख्य पाठ में इसी वाक्य-विन्यास को बनाए रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בַּדָּבָר הַזֶּה
  choice: इस बात के द्वारा
  rationale: דבר यहाँ पूरे प्रसंग या किए गए काम की ओर संकेत करता है; ‘बात’ अर्थ की व्यापकता बनाए रखती है।
- source_word: גַּם
  choice: इसलिए
  rationale: यहाँ परिणाम की अतिरिक्त अथवा बलात्मक कड़ी को हिन्दी वाक्य में स्पष्ट और स्वाभाविक बनाने के लिए कारण-परिणाम संबंध के रूप में व्यक्त किया गया है।
- source_word: הַבֵּן הַיִּלּוֹד לְךָ
  choice: जो पुत्र तुम्हारे यहाँ जन्मा है
  rationale: בן का पुरुषवाचक अर्थ ‘पुत्र’ सुरक्षित है और participial construction स्वाभाविक हिन्दी में व्यक्त हुई है।
- source_word: מוֹת יָמוּת
  choice: निश्चय ही मर जाएगा
  rationale: इनफिनिटिव ऐब्सोल्यूट के साथ imperfect मृत्यु की सुनिश्चितता पर जोर देता है।
theological_decisions:
- issue: ‘यहोवा के शत्रुओं’ वाले कठिन उपवाक्य में कर्ता-कर्म संबंध
  choice: 'मसोराई पाठ पर आधारित अर्थ: दाऊद ने ‘यहोवा के शत्रुओं का घोर तिरस्कार किया।’'
  alternative: 'व्याख्यात्मक अथवा संशोधित पाठ: दाऊद ने यहोवा के शत्रुओं को निन्दा करने का अवसर दिया।'
  rationale: प्रदत्त WLC पाठ में את के बाद ‘यहोवा के शत्रु’ क्रिया के प्रत्यक्ष कर्म के रूप में आते हैं। प्रसंगगत कठिनाई के बावजूद मूल-पाठ-प्रधान अनुवाद इसे मुख्य पाठ में रखता है और अधिक प्रचलित व्याख्यात्मक अर्थ को पादटिप्पणी में सुरक्षित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। कठिन मसोराई वाक्य-विन्यास को समतल किए बिना मुख्य पाठ में रखा गया है; वैकल्पिक प्रचलित अर्थ पादटिप्पणी में दिया गया है।
