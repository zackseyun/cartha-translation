  text: फिर भी[a], क्योंकि इस बात से तुमने यहोवा के शत्रुओं का घोर तिरस्कार किया है, तुम्हारे यहाँ जन्मा पुत्र भी निश्चय ही मर जाएगा।
  philosophy: optimal-equivalence
  footnotes:
