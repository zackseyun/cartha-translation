base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/019.yaml
  text: When David saw that his servants were whispering[a], David understood that the child was dead. So David said to his servants, “Is the child dead?” And they said, “He is dead.”
translation:
  language: hi
  text: जब दाऊद ने देखा कि उसके सेवक आपस में फुसफुसा रहे थे, तो वह समझ गया कि बच्चा मर गया है। दाऊद ने अपने सेवकों से कहा, “क्या बच्चा मर गया है?” उन्होंने कहा, “मर गया।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: देखा
  rationale: यहाँ ראה प्रत्यक्ष देखने से उत्पन्न जानकारी को व्यक्त करता है; ‘देखा’ सीधा और स्वाभाविक है।
- source_word: מִתְלַחֲשִׁים
  choice: आपस में फुसफुसा रहे हैं
  rationale: לחש का हित्पएल कृदंत धीमे, गोपनीय ढंग से परस्पर बोलने का भाव देता है; ‘आपस में’ पारस्परिकता को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: וַיָּבֶן
  choice: समझ गया
  rationale: בין यहाँ देखे गए संकेतों से निष्कर्ष समझ लेने को दर्शाता है; यह आधुनिक हिंदी में सहज कथात्मक अभिव्यक्ति है।
- source_word: מֵת
  choice: मर गया है / मर गया
  rationale: स्रोत में मृत्यु की अवस्था व्यक्त है। हिंदी में इस प्रसंग में ‘मर गया है’ प्रश्न में और संक्षिप्त उत्तर में ‘मर गया’ स्वाभाविक है।
- source_word: הַיָּלֶד
  choice: बच्चा
  rationale: יֶלֶד का अर्थ बालक या बच्चा हो सकता है; संदर्भ में शिशु होने के कारण ‘बच्चा’ उपयुक्त है।
- source_word: עֲבָדָיו
  choice: उसके सेवक / अपने सेवकों
  rationale: राजकीय गृहस्थी के इस संदर्भ में עֶבֶד के लिए ‘सेवक’ उपयुक्त है; ‘अपने’ हिंदी में दाऊद की ओर स्वाभाविक रूप से संकेत करता है।
- source_word: הֲמֵת הַיֶּלֶד
  choice: क्या बच्चा मर गया है?
  rationale: प्रश्नवाचक הֲ और मृत्यु-सूचक विधेय को यह हिंदी अभिव्यक्ति स्वाभाविक ढंग से प्रस्तुत करती है, बिना घटना और अवस्था के भेद को अनावश्यक रूप से कठोर बनाने के।
- source_word: וַיֹּאמֶר ... וַיֹּאמְרוּ
  choice: कहा ... कहा
  rationale: אמר के सामान्य अर्थ ‘कहना’ को बनाए रखा गया है; प्रश्न और उत्तर वाक्य के रूप से स्वतः स्पष्ट हैं।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण कथात्मक शैली। सेवकों के अंतिम उत्तर में इब्रानी के संक्षिप्त מֵת को ‘मर गया’ रखकर उसकी संक्षिप्तता सुरक्षित की गई है; हिंदी में अलग सर्वनाम जोड़ना आवश्यक नहीं है।
