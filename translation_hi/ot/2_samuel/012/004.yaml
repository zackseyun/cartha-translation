  text: וַ/יָּ֣בֹא הֵלֶךְ֮ לְ/אִ֣ישׁ הֶֽ/עָשִׁיר֒ וַ/יַּחְמֹ֗ל לָ/קַ֤חַת מִ/צֹּאנ/וֹ֙ וּ/מִ/בְּקָר֔/וֹ לַ/עֲשׂ֕וֹת לָ/אֹרֵ֖חַ הַ/בָּא ל֑/וֹ וַ/יִּקַּ֗ח אֶת כִּבְשַׂת֙ הָ/אִ֣ישׁ הָ/רָ֔אשׁ וַֽ/יַּעֲשֶׂ֔/הָ לָ/אִ֖ישׁ הַ/בָּ֥א אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/004.yaml
  text: A traveler came to the rich man[a], and he spared taking from his own flock and from his own herd to prepare for the traveler who had come to him. So he took the ewe lamb of the poor man and prepared it for the man who had come to him.
translation:
  language: hi
  text: एक यात्री धनी आदमी के पास आया, और उसने अपने भेड़-बकरियों के झुंड और गाय-बैलों में से कुछ लेकर अपने यहाँ आए अतिथि के लिए भोजन तैयार करने से परहेज़ किया। इसके बजाय उसने गरीब आदमी की मेमनी ले ली और उसे उस आदमी के लिए तैयार किया जो उसके यहाँ आया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵלֶךְ
  choice: यात्री
  rationale: यह शब्द यात्रा पर निकले व्यक्ति को दर्शाता है; ‘यात्री’ आधुनिक हिन्दी में स्वाभाविक है और केवल सामाजिक ‘अतिथि’ कहने से अधिक सटीक है।
- source_word: וַיַּחְמֹל
  choice: उचित न समझा
  rationale: मूल क्रिया सामान्यतः ‘तरस खाना/बख्श देना’ कहती है, पर यहाँ भाव यह है कि धनी व्यक्ति ने अपने पशुओं में से लेने से स्वयं को रोका। यह हिन्दी प्रयोग उस प्रसंगगत अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִצֹּאנוֹ וּמִבְּקָרוֹ
  choice: अपने झुंड या अपने पशुओं में से
  rationale: צאן छोटे पालतू पशुओं के झुंड और בקר बड़े पशुओं को सूचित करता है। हिन्दी में अनावश्यक भारीपन से बचते हुए दोनों संग्रहवाचक श्रेणियाँ रखी गई हैं; संयोजक ו का आशय ‘और’ है, किंतु ‘में से कुछ’ के साथ हिन्दी में ‘या’ अधिक स्वाभाविक चयन-संबंध बताता है।
- source_word: לַעֲשׂוֹת / וַיַּעֲשֶׂהָ
  choice: भोजन तैयार करना / भोजन तैयार किया
  rationale: भोजन के प्रसंग में עשה का आशय पकाकर या अन्य रीति से भोजन तैयार करना है; ‘भोजन’ निहित संदर्भ को स्पष्ट करता है, पर पकाने की किसी खास विधि को नहीं जोड़ता।
- source_word: לָאֹרֵחַ
  choice: यात्री
  rationale: यह निकटार्थी शब्द यात्री या आतिथ्य पाने वाले अतिथि को सूचित कर सकता है। मुख्य पाठ में ‘यात्री’ पहले शब्द से अर्थगत संबंध बनाए रखता है; भिन्न हिब्रू शब्दों की सूचना पादटिप्पणी में दी गई है।
- source_word: כִּבְשַׂת
  choice: मेमनी
  rationale: हिब्रू विशेष रूप से मादा मेमने का उल्लेख करता है; ‘मेमनी’ हिन्दी में संक्षिप्त और स्वाभाविक रूप से यह लिंग-विशिष्टता बनाए रखता है।
- source_word: הָאִישׁ הָרָאשׁ
  choice: गरीब आदमी
  rationale: רָאשׁ यहाँ निर्धन या अभावग्रस्त व्यक्ति को दर्शाता है; ‘गरीब आदमी’ धनी आदमी के साथ स्पष्ट सामाजिक-आर्थिक विरोध रखता है।
- source_word: הַבָּא לוֹ / הַבָּא אֵלָיו
  choice: उसके यहाँ आया / अपने यहाँ आए
  rationale: संज्ञार्थक कृदंत आगमन करने वाले व्यक्ति का वर्णन करता है। ‘के यहाँ’ आतिथ्य के प्रसंग में हिन्दी का स्वाभाविक रूप है।
