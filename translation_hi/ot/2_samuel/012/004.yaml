- from: एक यात्री उस धनी आदमी के यहाँ आया। धनी आदमी ने अपने झुंड या अपने पशुओं में से कुछ लेकर उस आए हुए यात्री के लिए भोजन तैयार करना उचित न समझा। इसके बजाय उसने उस गरीब आदमी की मेमनी लेकर अपने यहाँ आए उस आदमी के लिए भोजन तैयार किया।
  to: एक यात्री धनी आदमी के पास आया, और उसने अपने भेड़-बकरियों के झुंड और गाय-बैलों में से कुछ लेकर अपने यहाँ आए अतिथि के लिए भोजन तैयार करने से परहेज़ किया। इसके बजाय उसने गरीब आदमी की मेमनी ले ली और उसे उस आदमी के लिए तैयार किया जो उसके यहाँ आया था।
  rationale: The revision replaces the source-inaccurate disjunction with “और,” removes the added evaluative nuance of “उचित न समझा,” retains the feminine ewe lamb as the thing prepared, and supplies a lexical footnote for the distinct but related Hebrew terms for the arriving visitor and the guest.
