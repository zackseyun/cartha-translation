  yaml_path: translation/ot/2_samuel/012/013.yaml
  text: Then David said to Nathan[a], “I have sinned against Yahweh.” And Nathan said to David, “Yahweh also has taken away your sin[b]; you shall not die.”
translation:
  language: hi
  text: तब दाऊद ने नातान से कहा, “मैंने यहोवा के विरुद्ध पाप किया है।” नातान ने दाऊद से कहा, “यहोवा ने भी तुम्हारा पाप दूर कर दिया है[a]; तुम नहीं मरोगे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारा पाप हटा दिया है।” इब्रानी क्रिया का शाब्दिक भाव “पार करा दिया है” है; यहाँ आशय पाप अथवा उसके दोष को दूर करने से है।
    reason: lexical_alternative
  - marker: b
    text: या “तुम्हें मृत्यु नहीं होगी।” इब्रानी में सीधे “तुम नहीं मरोगे” कहा गया है; न्यायिक संदर्भ मृत्युदंड से बचाए जाने का संकेत दे सकता है, पर यह बात शब्दों में स्पष्ट नहीं की गई।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: मैंने ... पाप किया है
  rationale: काल पूर्ण किए गए कार्य को वर्तमान प्रासंगिकता सहित व्यक्त करता है; यह दाऊद की सीधी स्वीकारोक्ति है।
- source_word: לַיהוָה
  choice: यहोवा के विरुद्ध
  rationale: חטא के साथ ל यहाँ संबंध या लक्ष्य बताता है; आधुनिक हिन्दी में ‘के विरुद्ध पाप करना’ स्वाभाविक और अर्थ-सटीक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में वाचा का व्यक्तिगत ईश्वरीय नाम है; इसे उपाधि से बदलने के बजाय हिन्दी में प्रचलित रूप ‘यहोवा’ रखा गया है।
- source_word: גַּם
  choice: भी
  rationale: यह दाऊद की स्वीकारोक्ति के प्रत्युत्तर में यहोवा की कार्रवाई को जोड़ता और बल देता है, बिना उसके आशय को अधिक स्पष्ट करके सीमित किए।
- source_word: הֶעֱבִיר
  choice: दूर कर दिया है
  rationale: עבר का हिफ़ील रूप शाब्दिकतः ‘पार करा देना/हटा देना’ है; पाप के साथ यहाँ उसे दूर करने का भाव है।
- source_word: חַטָּאתְךָ
  choice: तुम्हारा पाप
  rationale: शब्द पाप, दोष या पापबलि बता सकता है; यहाँ दाऊद द्वारा अभी स्वीकार किए गए अपराध का सीधा संदर्भ ‘पाप’ है।
- source_word: לֹא תָמוּת
  choice: तुम नहीं मरोगे
  rationale: नकारयुक्त अपूर्ण क्रिया सीधे मृत्यु न होने की बात कहती है। हिन्दी भविष्यकाल मूल कथन की न्यायिक गंभीरता रखता है, पर ‘मृत्युदंड नहीं दिया जाएगा’ जैसी व्याख्या नहीं जोड़ता।
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: तब ... कहा ... कहा
  rationale: पहला ‘तब’ कथानक की क्रमिकता दिखाता है; दूसरे वाक्य में हिन्दी की स्वाभाविकता के लिए संयोजक दोहराना आवश्यक नहीं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम स्पष्ट रूप से उपस्थित है। हिन्दी पाठकों के लिए परिचित नाम-रूप ‘यहोवा’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: הֶעֱבִיר חַטָּאתְךָ में क्षमा या पाप हटाए जाने का स्वरूप
  choice: यहोवा ने भी तुम्हारा पाप दूर कर दिया है
  alternative: यहोवा ने भी तुम्हारा पाप हटा दिया है / पार कर दिया है
  rationale: पाठ पाप के हटाए जाने और दाऊद के न मरने की घोषणा करता है, पर प्रायश्चित की प्रक्रिया नहीं समझाता। इसलिए किसी बाद की धर्मवैज्ञानिक प्रणाली को जोड़े बिना मूल तनाव बनाए रखा गया है।
- issue: לֹא תָמוּת का न्यायिक आशय
  choice: तुम नहीं मरोगे
  alternative: तुम्हें मृत्युदंड नहीं दिया जाएगा
  rationale: संदर्भ न्यायिक अर्थ सुझा सकता है, किंतु इब्रानी पाठ केवल ‘नहीं मरोगे’ कहता है; मुख्य पाठ उसी व्यापक कथन को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। स्वीकारोक्ति संक्षिप्त रखी गई है और नातान का उत्तर गंभीर, न्यायिक स्वर में है। ‘दूर कर दिया है’ सामान्य पाठक के लिए सहज है तथा मूल क्रिया के हटाने वाले अर्थ को बनाए रखता है।
