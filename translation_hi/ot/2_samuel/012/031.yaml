base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/031.yaml
  text: And he brought out the people who were in it and put them to work with saws[a], iron picks, and iron axes, and made them labor at the brick kiln. Thus he did to all the cities of the Ammonites[c][b]. Then David and all the people returned to Jerusalem.
translation:
  language: hi
  text: उसने उसमें के लोगों को बाहर निकालकर उन्हें आरों[a], लोहे की गैंतियों और लोहे की कुल्हाड़ियों के काम में लगा दिया और उनसे ईंट के भट्ठे पर मज़दूरी कराई[b]। अम्मोनियों के सभी नगरों के साथ उसने ऐसा ही किया[c]। फिर दाऊद और सब लोग यरूशलेम लौट आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्हें आरे, लोहे के नुकीले औज़ारों और लोहे के काटनेवाले औज़ारों के पास या उन पर लगाया।” इन औज़ारों के सटीक नाम अनिश्चित हैं।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू पाठ कठिन है। पारम्परिक अनुवाद है, “उन्हें ईंट के भट्ठे में से गुज़ारा”; कुछ लोग इसे बेगार के बजाय मृत्युदंड का वर्णन समझते हैं।
    reason: alternative_reading
  - marker: c
    text: इसी घटना के समान रूप से कठिन समानांतर विवरण के लिए 1 इतिहास 20:3 देखें।
    reason: cross_reference
lexical_decisions:
- source_word: הוֹצִיא
  choice: बाहर निकालकर
  rationale: हिफ़ील रूप का सामान्य अर्थ ‘बाहर निकालना’ है; यह कारक भाव को सहज हिन्दी में रखता है।
- source_word: וַיָּשֶׂם
  choice: काम करने में लगा दिया
  rationale: शाब्दिक अर्थ ‘रखा/लगाया’ है। औज़ारों की सूची के संदर्भ में यह बंदियों को श्रम में लगाने की सम्भावित व्याख्या व्यक्त करता है, बिना हिंसक अर्थ को मुख्य पाठ में निश्चित किए।
- source_word: בַּמְּגֵרָה
  choice: आरों
  rationale: מְגֵרָה का अर्थ ‘आरा’ है। एकवचन यहाँ सामूहिक अथवा साधनवाचक हो सकता है, इसलिए हिन्दी में बहुवचन स्वाभाविक है।
- source_word: בַחֲרִצֵי הַבַּרְזֶל
  choice: लोहे की कुदालों
  rationale: यह कठिन पद नुकीले लोहे के औज़ारों अथवा दाँवने के उपकरणों को सूचित कर सकता है। श्रम-संदर्भ में ‘कुदालों’ सम्भाव्य और बोधगम्य है; अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: בְמַגְזְרֹת הַבַּרְזֶל
  choice: लोहे की कुल्हाड़ियों
  rationale: पद व्यापक रूप से काटने के लोहे के उपकरणों का बोध कराता है। ‘कुल्हाड़ियों’ एक सम्भाव्य ठोस अनुवाद है; सटीक पहचान अनिश्चित है।
- source_word: וְהֶעֱבִיר אוֹתָם ב/מלכן
  choice: उनसे ईंट के भट्ठे पर मज़दूरी कराई
  rationale: व्यंजन-पाठ और वाक्य-विन्यास कठिन हैं। मुख्य पाठ श्रम-संबंधी अर्थ अपनाता है, जो समानांतर विवरण और विजय के बाद बंदियों से काम कराने के प्रसंग के अनुकूल है; शाब्दिक और दंडात्मक सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: וְכֵן יַעֲשֶׂה
  choice: उसने ऐसा ही किया
  rationale: हिब्रू की सारांशात्मक कथन-शैली का स्वाभाविक हिन्दी रूप।
- source_word: לְכֹל עָרֵי בְנֵי עַמּוֹן
  choice: अम्मोनियों के सभी नगरों के साथ
  rationale: בְנֵי עַמּוֹן के लिए आधुनिक हिन्दी में स्वाभाविक जातिनाम ‘अम्मोनी’ है।
- source_word: וַיָּשָׁב ... יְרוּשָׁלִָם
  choice: यरूशलेम लौट आए
  rationale: שוב और गन्तव्य का मानक कथात्मक अर्थ सहज हिन्दी में ‘लौटना’ है; संयुक्त कर्ता के कारण बहुवचन रखा गया है।
theological_decisions:
- issue: क्या दाऊद ने अम्मोनी बंदियों को औज़ारों और भट्ठे द्वारा मार डाला या उनसे कठोर बेगार कराई?
  choice: औज़ारों और ईंट के भट्ठे पर उनसे बलपूर्वक श्रम कराया
  alternative: उन्हें आरों और लोहे के उपकरणों से दंडित या मार डाला और भट्ठे में से गुज़ारा
  rationale: וַיָּשֶׂם तथा וְהֶעֱבִיר ... במלכן का हिब्रू पाठ एक से अधिक अर्थ ग्रहण कर सकता है। मुख्य पाठ प्रसंग और 1 इतिहास 20:3 के समानांतर विवरण के आधार पर श्रम वाला अर्थ लेता है, पर दंडात्मक/वध-संबंधी पारम्परिक व्याख्या को पादटिप्पणी में स्पष्ट रूप से बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘मज़दूरी कराई’ कठोर अधीनस्थ श्रम को स्पष्ट करता है; पाठ में ‘बेगार’ न रखकर अधिक व्यापक रूप से समझ आने वाली अभिव्यक्ति चुनी गई है। सभी पाठगत और अर्थगत अनिश्चितताएँ पादटिप्पणियों में सुरक्षित हैं।
