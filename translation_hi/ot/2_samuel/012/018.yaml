base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/018.yaml
  text: And on the seventh day the child died. And David’s servants were afraid to tell him that the child was dead[a], for they said, “Behold, while the child was still alive, we spoke to him, and he did not listen to our voice. How then can we say to him, ‘The child is dead’? He may do harm.”
translation:
  language: hi
  text: सातवें दिन वह बच्चा मर गया। दाऊद के सेवक उन्हें यह बताने से डरते थे कि बच्चा मर गया है, क्योंकि उन्होंने कहा, “देखो, जब बच्चा जीवित था, तब हमने उनसे बात की, पर उन्होंने हमारी बात नहीं मानी। अब हम उनसे कैसे कहें, ‘बच्चा मर गया है’? कहीं वे कुछ बुरा न कर बैठें[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वे कोई अनिष्ट कर सकते हैं,” “उनकी प्रतिक्रिया बुरी हो सकती है,” अथवा संभवतः “वे अपने आप को हानि पहुँचा सकते हैं।” हिब्रू अभिव्यक्ति संक्षिप्त है और यह स्पष्ट नहीं करती कि सेवकों को ठीक किस कार्य का भय था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: सातवें दिन
  rationale: कथात्मक क्रम और समय-सूचना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘और ऐसा हुआ’ अनावश्यक रूप से शब्दशः होता।
- source_word: וַיָּמָת הַיָּלֶד
  choice: वह बच्चा मर गया
  rationale: יֶלֶד के लिए ‘बच्चा’ प्रसंगानुकूल है और शिशु की आयु से मेल खाता है।
- source_word: וַיִּרְאוּ עַבְדֵי דָוִד לְהַגִּיד לוֹ
  choice: दाऊद के सेवक उसे यह बताने से डरते थे
  rationale: यहाँ ירא श्रद्धा नहीं, आशंका या भय व्यक्त करता है; हिन्दी में यह रचना सहज है।
- source_word: וְלֹא שָׁמַע בְּקוֹלֵנוּ
  choice: पर उन्होंने हमारी बात नहीं मानी
  rationale: ‘हमारी आवाज़ नहीं सुनी’ हिन्दी में केवल श्रवण का अर्थ दे सकता है; मुहावरे का आशय बात न मानना है। दाऊद के लिए आदरसूचक बहुवचन रखा गया है।
- source_word: וְעָשָׂה רָעָה
  choice: कहीं वे कुछ बुरा न कर बैठें
  rationale: संक्षिप्त हिब्रू अभिव्यक्ति किसी अनिष्टकारी प्रतिक्रिया की आशंका जताती है, पर उसके स्वरूप या लक्ष्य को निर्दिष्ट नहीं करती। हिन्दी वाक्य उसी अनिश्चितता को बनाए रखता है।
theological_decisions:
- issue: וְעָשָׂה רָעָה में आशंकित कार्य का स्वरूप
  choice: कहीं वे कुछ बुरा न कर बैठें
  alternative: वे अपने आप को हानि पहुँचा सकते हैं; वे कोई अनिष्ट कर सकते हैं; उनकी प्रतिक्रिया बुरी हो सकती है
  rationale: मूल पाठ यह नहीं बताता कि दाऊद स्वयं को हानि पहुँचाएगा, किसी और को हानि पहुँचाएगा, या किसी अन्य प्रकार का बुरा कार्य करेगा। इसलिए अनिश्चितता को मुख्य पाठ में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। दाऊद को संबोधित करते हुए आदरसूचक ‘उनसे/उन्होंने/वे’ का प्रयोग किया गया है। ‘देखो’ הִנֵּה का स्वाभाविक वर्तमान हिन्दी समतुल्य है।
