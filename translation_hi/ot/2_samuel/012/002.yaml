  yaml_path: translation/ot/2_samuel/012/002.yaml
  text: The rich man had very many sheep and cattle[a].
translation:
  language: hi
  text: धनी मनुष्य के पास बहुत बड़ी संख्या में भेड़-बकरियाँ और गाय-बैल थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक धनी मनुष्य के पास बहुत-सी भेड़-बकरियाँ और गाय-बैल थे।”
    reason: לְעָשִׁיר को संदर्भानुसार निश्चित (‘धनी मनुष्य’) या अनिश्चित (‘एक धनी मनुष्य’) समझा जा सकता है; साथ ही הַרְבֵּה מְאֹד का संक्षिप्त स्वाभाविक रूप ‘बहुत-से/बहुत-सी’ हो सकता है।
lexical_decisions:
- source_word: לְעָשִׁיר הָיָה
  choice: धनी मनुष्य के पास ... थे
  rationale: לְ के साथ היה यहाँ स्वामित्व बताने वाली रचना है; आधुनिक हिन्दी में ‘के पास ... थे’ इसका स्वाभाविक और स्पष्ट रूप है। संदर्भ में धनी व्यक्ति पहले से उल्लिखित है, इसलिए निश्चित भाव रखा गया है।
- source_word: צֹאן
  choice: भेड़-बकरियाँ
  rationale: צֹאן सामूहिक रूप से छोटे पालतू पशुओं, विशेषकर भेड़ों और बकरियों, को दर्शाता है। ‘भेड़-बकरियाँ’ हिन्दी में इसके अर्थ-क्षेत्र को ‘भेड़ें’ की तुलना में अधिक पूरा व्यक्त करता है।
- source_word: וּבָקָר
  choice: और गाय-बैल
  rationale: בָּקָר बड़े पालतू पशुओं अर्थात मवेशियों के लिए सामूहिक शब्द है। ‘गाय-बैल’ सामान्य आधुनिक हिन्दी में ठोस और सहज है।
- source_word: הַרְבֵּה מְאֹד
  choice: बहुत बड़ी संख्या में
  rationale: यह पदबंध अत्यधिक संख्या पर बल देता है। चुना हुआ रूप मूल की तीव्रता बनाए रखते हुए स्वाभाविक हिन्दी देता है।
