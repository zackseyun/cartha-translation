base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/017.yaml
  text: The elders of his house stood beside him to raise him up from the ground[a], but he was unwilling[b], and he would not eat bread with them.
translation:
  language: hi
  text: उसके घर के बुज़ुर्ग[a] उसे भूमि से उठाने के लिए उसके पास खड़े हुए; पर वह राज़ी न हुआ और उसने उनके साथ रोटी खाई[b] नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके घराने के बुज़ुर्ग।” इब्रानी में शाब्दिक रूप से “उसके घर के बुज़ुर्ग” है।
    reason: lexical_alternative
  - marker: b
    text: “रोटी खाना” भोजन करने के लिए प्रयुक्त इब्रानी अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: आ खड़े हुए
  rationale: קום का ठोस क्रियार्थ रखा गया है; प्रसंग में घर के पुरनियों का दाऊद के पास खड़े होकर उसे उठाने का प्रयास व्यक्त होता है।
- source_word: זִקְנֵי בֵיתוֹ
  choice: उसके घर के पुरनिये
  rationale: इब्रानी रचना का शाब्दिक अर्थ ‘उसके घर के पुरनिये’ है। ‘पुरनिये’ यहाँ परिवार के केवल वृद्ध सदस्यों के बजाय राजकीय घराने के वरिष्ठ जनों या अधिकारियों को भी सूचित कर सकता है।
- source_word: עָלָיו
  choice: उसके पास
  rationale: עַל का मूल अर्थ ‘पर/ऊपर’ है, पर यहाँ भूमि पर पड़े दाऊद को उठाने के लिए उसके निकट खड़े होने का भाव है। स्वाभाविक हिन्दी में ‘उसके पास’ दृश्य को बिना अनावश्यक कठोरता के व्यक्त करता है।
- source_word: לַהֲקִימוֹ
  choice: ताकि उसे ... उठाएँ
  rationale: קום के हिफ़ील रूप का कारक अर्थ, ‘उसे उठाना/खड़ा करना,’ स्पष्ट रखा गया है।
- source_word: מִן הָאָרֶץ
  choice: भूमि पर से
  rationale: אֶרֶץ यहाँ व्यापक ‘देश/पृथ्वी’ नहीं, उस स्थान की भूमि है जिस पर दाऊद पड़ा था।
- source_word: וְלֹא אָבָה
  choice: पर वह राज़ी न हुआ
  rationale: אָבָה इच्छा या सहमति का अभाव बताता है; ‘राज़ी न हुआ’ ‘इनकार कर दिया’ से कम प्रबल और मूल के अधिक निकट है।
- source_word: וְלֹא בָרָא אִתָּם לָחֶם
  choice: और उसने उनके साथ रोटी नहीं खाई
  rationale: इब्रानी में ‘रोटी खाना’ भोजन करने का सामान्य मुहावरा है। ‘रोटी’ को बनाए रखने से मूल की ठोस अभिव्यक्ति और उपवास का प्रसंग दोनों सुरक्षित रहते हैं।
