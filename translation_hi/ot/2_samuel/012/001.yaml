reference: 2 Samuel 12:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֧ח יְהוָ֛ה אֶת נָתָ֖ן אֶל דָּוִ֑ד וַ/יָּבֹ֣א אֵלָ֗י/ו וַ/יֹּ֤אמֶר ל/וֹ֙ שְׁנֵ֣י אֲנָשִׁ֗ים הָיוּ֙ בְּ/עִ֣יר אֶחָ֔ת אֶחָ֥ד עָשִׁ֖יר וְ/אֶחָ֥ד רָֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/001.yaml
  text: Then Yahweh sent Nathan to David. He came to him and said to him[a], “There were two men in one city, one rich and one poor.”
translation:
  language: hi
  text: तब याहवे ने नातान को दाऊद के पास भेजा। वह उसके पास आया और उससे कहा, “एक नगर में दो आदमी थे[a]—एक धनी और दूसरा निर्धन।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक नगर में दो आदमी रहते थे।” इब्रानी में अधिक शाब्दिक रूप से, “एक नगर में दो आदमी थे।”
    reason: הָיוּ अस्तित्व को व्यक्त करता है; प्रसंग के अनुसार ‘रहते थे’ भी स्वाभाविक अनुवाद है, पर वह मूल से थोड़ा अधिक स्पष्ट है।
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: भेजा
  rationale: कथात्मक संदर्भ में שׁלח का सीधा और स्वाभाविक हिन्दी अर्थ ‘भेजा’ है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֶת נָתָן
  choice: नातान को
  rationale: אֶת कर्म-सूचक है; नाम נָתָן को प्रचलित हिन्दी बाइबलीय रूप ‘नातान’ में रखा गया है।
- source_word: אֶל דָּוִד
  choice: दाऊद के पास
  rationale: אֶל यहाँ नातान के भेजे जाने की दिशा या गंतव्य बताता है; ‘के पास’ स्वाभाविक हिन्दी है और ‘विरुद्ध’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: וַיָּבֹא אֵלָיו
  choice: वह उसके पास आया
  rationale: בוא אֶל का सीधा भाव ‘किसी के पास आना’ है; कर्ता नातान और सर्वनाम का संदर्भ दाऊद है।
- source_word: וַיֹּאמֶר לוֹ
  choice: और उससे कहा
  rationale: इब्रानी में अप्रत्यक्ष कर्म स्पष्ट है; हिन्दी में ‘उससे कहा’ उसे स्वाभाविक ढंग से बनाए रखता है।
- source_word: שְׁנֵי אֲנָשִׁים
  choice: दो आदमी
  rationale: यहाँ दो पुरुष व्यक्तियों की बात है; ‘दो आदमी’ साधारण, स्पष्ट और प्रसंगानुकूल हिन्दी है।
- source_word: הָיוּ בְּעִיר אֶחָת
  choice: एक नगर में ... थे
  rationale: अस्तित्वसूचक היה और शाब्दिक ‘एक नगर में’ को सुरक्षित रखा गया है; ‘रहते थे’ सम्भव है, पर वह निवास का भाव कुछ अधिक स्पष्ट करता है।
- source_word: אֶחָד עָשִׁיר וְאֶחָד רָאשׁ
  choice: एक धनी और दूसरा निर्धन
  rationale: עָשִׁיר और רָאשׁ का सीधा विरोध ‘धनी’ और ‘निर्धन’ से स्पष्ट होता है। दूसरे אֶחָד के लिए ‘दूसरा’ हिन्दी में जोड़ी का स्वाभाविक विन्यास है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका निकट लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता; स्वरांकन की प्राचीन अनिश्चितता बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कथा की गति के लिए ‘तब’ और प्रत्यक्ष संवाद का संक्षिप्त विन्यास अपनाया गया है; धनी और निर्धन के तीखे विरोध को यथावत रखा गया है।
