  text: וְ/עַתָּ֣ה מֵ֗ת לָ֤/מָּה זֶּה֙ אֲנִ֣י צָ֔ם הַ/אוּכַ֥ל לַ/הֲשִׁיב֖/וֹ ע֑וֹד אֲנִי֙ הֹלֵ֣ךְ אֵלָ֔י/ו וְ/ה֖וּא לֹֽא יָשׁ֥וּב אֵלָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/023.yaml
  text: But now he is dead. Why should I fast any longer? Can I bring him back again? I am going to him[a], but he will not return to me.
translation:
  language: hi
  text: पर अब वह मर चुका है। मैं अब और उपवास क्यों करूँ? क्या मैं उसे फिर से वापस ला सकता हूँ? मैं उसके पास जा रहा हूँ[a], पर वह मेरे पास नहीं लौटेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उसके पास जाऊँगा।” इब्रानी कृदन्त निश्चित भविष्य को भी व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: पर अब
  rationale: यह प्रसंग में बच्चे की मृत्यु से पहले और बाद में दाऊद के व्यवहार के बीच स्पष्ट विरोध दिखाता है।
- source_word: מֵת
  choice: वह मर चुका है
  rationale: इब्रानी रूप यहाँ मृत्यु की वर्तमान परिणामी अवस्था व्यक्त करता है; यह हिन्दी में स्वाभाविक है।
- source_word: לָמָּה זֶּה אֲנִי צָם
  choice: मैं अब और उपवास क्यों करूँ?
  rationale: शाब्दिक संरचना के बजाय आलंकारिक प्रश्न का स्वाभाविक हिन्दी रूप दिया गया है; अगले עוֹד का भाव भी इसी वाक्य में रखा गया है।
- source_word: הַאוּכַל לַהֲשִׁיבוֹ עוֹד
  choice: क्या मैं उसे फिर लौटा सकता हूँ?
  rationale: हिफ़ील रूप का अर्थ ‘वापस लाना’ है; प्रसंग जीवन में वापस लाने की ओर संकेत करता है, पर अनावश्यक व्याख्यात्मक विस्तार नहीं किया गया।
- source_word: אֲנִי הֹלֵךְ אֵלָיו
  choice: मैं उसके पास जा रहा हूँ
  rationale: वर्तमान कृदन्त की गतिशील अभिव्यक्ति को बनाए रखता है; यह निश्चित भविष्य भी व्यक्त कर सकता है, जिसे पादटिप्पणी में बताया गया है।
- source_word: וְהוּא לֹא יָשׁוּב אֵלַי
  choice: पर वह मेरे पास नहीं लौटेगा
  rationale: विरोध स्पष्ट करता है और שוב की ‘लौटना’ संबंधी शब्दगत कड़ी को सुरक्षित रखता है।
theological_decisions:
- issue: क्या दाऊद का कथन मृत बच्चे के साथ सचेत परलोकिक पुनर्मिलन सिखाता है
  choice: ‘मैं उसके पास जा रहा हूँ’ के रूप में कथन को सीधा रखा गया है और ‘जाने’ की प्रकृति को परिभाषित नहीं किया गया।
  alternative: इसे केवल दाऊद की भावी मृत्यु और मृतकों के लोक में जाने का कथन, या बच्चे से व्यक्तिगत परलोकिक पुनर्मिलन का संकेत माना जा सकता है।
  rationale: इब्रानी पाठ केवल यह कहता है कि दाऊद बच्चे के पास जाएगा, जबकि बच्चा उसके पास नहीं लौटेगा। अनुवाद को मध्यवर्ती अवस्था अथवा शिशुओं के उद्धार संबंधी कोई विशिष्ट सिद्धान्त नहीं जोड़ना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘मर चुका है’ परिणामी अवस्था को, और ‘अब और उपवास’ जारी क्रिया के रुकने को स्वाभाविक ढंग से व्यक्त करता है।
