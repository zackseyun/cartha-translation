  text: וְ/עַתָּ֗ה אֱסֹף֙ אֶת יֶ֣תֶר הָ/עָ֔ם וַ/חֲנֵ֥ה עַל הָ/עִ֖יר וְ/לָכְדָ֑/הּ פֶּן אֶלְכֹּ֤ד אֲנִי֙ אֶת הָ/עִ֔יר וְ/נִקְרָ֥א שְׁמִ֖/י עָלֶֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/028.yaml
  text: Now gather the rest of the troops[a], camp against the city, and capture it, lest I capture the city and it be called by my name.
translation:
  language: hi
  text: अब बाकी सैनिकों को इकट्ठा करो, नगर के विरुद्ध पड़ाव डालो और उसे जीत लो; कहीं ऐसा न हो कि मैं ही नगर को जीत लूँ और वह मेरे नाम से कहलाए।[क]
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: शाब्दिक रूप से, “मेरा नाम उस पर पुकारा जाए।” यह मुहावरा नगर के किसी व्यक्ति के नाम से कहलाने और उसे जीतने का श्रेय उस व्यक्ति को मिलने का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब
  rationale: यह तत्काल अगला कदम उठाने वाला संवाद-सूचक है; आधुनिक हिन्दी में ‘अब’ स्वाभाविक और स्पष्ट है।
- source_word: אֱסֹף אֶת יֶתֶר הָעָם
  choice: बाकी सैनिकों को इकट्ठा करो
  rationale: घेराबंदी के सैनिक संदर्भ में הָעָם शेष युद्धबल को दर्शाता है; ‘सैनिकों’ से आशय साफ़ होता है।
- source_word: וַחֲנֵה עַל הָעִיר
  choice: नगर के सामने पड़ाव डालो
  rationale: חנה का मूल अर्थ पड़ाव डालना है, और עַל यहाँ नगर के विरुद्ध सैन्य स्थिति बताता है। ‘घेराबंदी करो’ निहितार्थ है, पर मूल क्रिया से अधिक व्याख्यात्मक होता।
- source_word: וְלָכְדָהּ
  choice: और उसे जीत लो
  rationale: לכד युद्ध में नगर पर अधिकार करने के अर्थ में है; हिन्दी में नगर को ‘जीत लेना’ सहज और सटीक है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह आशंकित या अवांछित परिणाम की चेतावनी व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אֶלְכֹּד אֲנִי אֶת הָעִיר
  choice: मैं ही नगर को जीत लूँ
  rationale: स्वतंत्र सर्वनाम אֲנִי कर्ता पर बल देता है, जिसे ‘ही’ से व्यक्त किया गया है; पहले आए לכד के साथ ‘जीत’ की संगति भी रखी गई है।
- source_word: וְנִקְרָא שְׁמִי עָלֶיהָ
  choice: और उस पर मेरा नाम पड़ जाए
  rationale: शाब्दिक संरचना ‘मेरा नाम उस पर पुकारा जाए’ है। हिन्दी मुहावरा ‘उस पर मेरा नाम पड़ना’ नाम और विजय-श्रेय दोनों के संबंध को बनाए रखते हुए सहज है।
theological_decisions:
- issue: नगर पर योआब का नाम पुकारे जाने का अर्थ
  choice: उस पर मेरा नाम पड़ जाए
  alternative: नगर मेरे नाम से कहलाए / नगर को जीतने का श्रेय मुझे मिले
  rationale: इब्रानी मुहावरा नामकरण, अधिकार और विजय के श्रेय के बीच कुछ अर्थगत विस्तार रखता है। मुख्य पाठ अपेक्षाकृत निकट और स्वाभाविक रूप देता है, बिना इसे केवल औपचारिक नामकरण या केवल सम्मान तक सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सैन्य कथा के अनुरूप संक्षिप्त, आदेशात्मक और गरिमापूर्ण शैली। ‘नगर’ और ‘पड़ाव डालो’ सामान्य पाठक के लिए स्पष्ट हैं।
