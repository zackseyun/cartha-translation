base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/012.yaml
  text: For you did it in secret[a], but I will do this thing before all Israel and before the sun.
translation:
  language: hi
  text: क्योंकि तूने यह काम छिपकर किया, पर मैं यह काम सारे इस्राएल के सामने और सूर्य के सामने[a] करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दिन के उजाले में”; शाब्दिक अर्थ, “सूर्य के सामने।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में घोषित न्याय का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका स्वाभाविक explanatory force रखता है।
- source_word: עָשִׂיתָ
  choice: तूने यह काम किया
  rationale: क्रिया दाऊद के पहले बताए अपराध की ओर संकेत करती है। ‘यह काम’ हिन्दी में उस निहित कर्म को स्वाभाविक ढंग से व्यक्त करता है, बिना उसे आवश्यकता से अधिक स्पष्ट किए।
- source_word: בַסָּתֶר
  choice: छिपकर
  rationale: इसका अर्थ गुप्त या छिपे ढंग से करना है और आगे आने वाली सार्वजनिकता के साथ स्पष्ट विरोध बनता है।
- source_word: וַאֲנִי
  choice: पर मैं
  rationale: वाव सामान्यतः ‘और’ हो सकता है, पर यहाँ दाऊद के गुप्त कार्य और परमेश्वर के सार्वजनिक कार्य के बीच विरोध प्रमुख है।
- source_word: אֶעֱשֶׂה
  choice: करूँगा
  rationale: प्रथम पुरुष की सीधी भविष्यकालीन क्रिया को बनाए रखता है।
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: यह काम
  rationale: ‘यह काम’ घोषित न्याय के कार्य की ओर संकेत करता है और हिन्दी में ‘यह बात’ से अधिक क्रियात्मक तथा स्वाभाविक है।
- source_word: נֶגֶד כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल के सामने
  rationale: नֶגֶד की सार्वजनिक उपस्थिति या दृष्टि में होने की भावना को स्पष्ट, सहज हिन्दी में रखता है।
- source_word: וְנֶגֶד הַשָּׁמֶשׁ
  choice: और सूर्य के सामने
  rationale: मूल का सजीव शाब्दिक बिंब सुरक्षित रखा गया है; इसका मुहावरेदार अर्थ ‘दिन के उजाले में’ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: घोषित न्याय में कर्तृत्व
  choice: 'प्रथम पुरुष में परमेश्वर का सीधा कर्तृत्व बनाए रखना: ‘मैं ... करूँगा’'
  alternative: ‘मैं ऐसा करवाऊँगा’
  rationale: इब्रानी पाठ में प्रथम पुरुष की सीधी क्रिया है। ऐतिहासिक माध्यमों के द्वारा न्याय पूरा होने की संभावना के बावजूद, इस पद के स्पष्ट कथन को नरम करके causative नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। दाऊद को संबोधन में एकवचन ‘तू’ बाइबलीय प्रत्यक्ष संबोधन की निकटता और तीक्ष्णता बनाए रखता है। ‘सूर्य के सामने’ मूल बिंब को सुरक्षित रखता है, जबकि पादटिप्पणी उसका सामान्य मुहावरेदार अर्थ बताती है।
