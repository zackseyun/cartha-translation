  choice: के विरुद्ध युद्ध किया
  rationale: निफ़अल रूप यहाँ युद्ध में भिड़ने या किसी के विरुद्ध लड़ने का भाव देता है; यह चयन सैन्य संदर्भ और विरोधात्मक अर्थ दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: רַבַּת בְּנֵי עַמּוֹן
  choice: अम्मोनियों के रब्बा नगर
  rationale: रब्बा स्थान का नाम है और ‘अम्मोनियों के’ आधुनिक हिन्दी में उसके जातीय-राजनीतिक संबंध को स्पष्ट करता है; ‘नगर’ जोड़ने से अपरिचित पाठक स्थाननाम को सहजता से पहचानता है।
- source_word: וַיִּלְכֹּד
  choice: पर अधिकार कर लिया
  rationale: לכד सैन्य संदर्भ में पकड़ लेने, जीत लेने या अपने अधिकार में करने को व्यक्त करता है; नगर के साथ ‘पर अधिकार कर लिया’ स्वाभाविक और सटीक हिन्दी है।
- source_word: עִיר הַמְּלוּכָה
  choice: राजनगर
  rationale: इब्रानी पद का शाब्दिक भाव ‘राजत्व/राजसत्ता का नगर’ है। ‘राजनगर’ निकट और गरिमापूर्ण हिन्दी है तथा इसे बिना प्रमाण केवल ‘राजधानी’ मानकर अर्थ को संकुचित नहीं करता।
