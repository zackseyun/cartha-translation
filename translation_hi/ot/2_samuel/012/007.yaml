  edition: WLC
  text: וַ/יֹּ֧אמֶר נָתָ֛ן אֶל דָּוִ֖ד אַתָּ֣ה הָ/אִ֑ישׁ כֹּה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אָנֹכִ֞י מְשַׁחְתִּ֤י/ךָֽ לְ/מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל וְ/אָנֹכִ֥י הִצַּלְתִּ֖י/ךָ מִ/יַּ֥ד שָׁאֽוּל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/007.yaml
  text: 'Then Nathan said to David[a], “You are the man! Thus says Yahweh, the God of Israel: I anointed you king over Israel, and I delivered you from the hand of Saul.”'
translation:
  language: hi
  text: 'तब नातान ने दाऊद से कहा, “तुम ही वह आदमी हो![a] इस्राएल का परमेश्वर याहवे यों कहता है: ‘मैंने ही तुम्हारा अभिषेक करके तुम्हें इस्राएल का राजा बनाया, और मैंने ही तुम्हें शाऊल के हाथ से छुड़ाया।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “तुम वही आदमी हो!” भी हो सकता है। हिब्रू में शाब्दिक रूप से “तुम वह आदमी हो” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַתָּה הָאִישׁ
  choice: तुम ही वह आदमी हो!
  rationale: यह क्रियारहित, अत्यंत ज़ोरदार वाक्य नातान के दृष्टान्त का चरमबिंदु है। ‘ही’ आरोप की तीव्रता व्यक्त करता है, जबकि ‘वह आदमी’ हिब्रू के निश्चित उपपद को सहज हिन्दी में रखता है।
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: यह भविष्यद्वक्ताओं का मानक संदेशवाहक सूत्र है; हिन्दी में यह औपचारिक और साथ ही सहज है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: सम्बन्धवाचक पदबंध और वाचा-संबंधी उपाधि को सीधे तथा प्रचलित हिन्दी रूप में व्यक्त करता है।
- source_word: אָנֹכִי ... וְאָנֹכִי
  choice: मैंने ही ... और मैंने ही
  rationale: स्वतंत्र सर्वनाम की पुनरावृत्ति से उत्पन्न ईश्वरीय कर्तृत्व के बल को हिन्दी में ‘ही’ और पुनरावृत्ति द्वारा सुरक्षित रखा गया है।
- source_word: מְשַׁחְתִּיךָ לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: तुम्हारा अभिषेक करके तुम्हें इस्राएल का राजा बनाया
  rationale: राजकीय अभिषेक और पद-नियुक्ति दोनों को स्पष्ट करता है; ‘इस्राएल के ऊपर राजा’ की अपेक्षा यह आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: הִצַּלְתִּיךָ מִיַּד שָׁאוּל
  choice: तुम्हें शाऊल के हाथ से छुड़ाया
  rationale: ‘हाथ से’ शत्रुतापूर्ण अधिकार या सामर्थ्य की हिब्रू छवि को बनाए रखता है, और ‘छुड़ाया’ वास्तविक संकट से उद्धार को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रचलित विद्वत्तापूर्ण उच्चारण के निकट लिप्यंतरित करता है।
- issue: אָנֹכִי की बलात्मकता
  choice: दोनों खंडों में ‘मैंने ही’
  alternative: दोनों खंडों में केवल ‘मैंने’
  rationale: मूल में स्वतंत्र सर्वनाम दो बार आया है; ‘ही’ परमेश्वर के अपने कार्य पर दिए गए बल को व्यक्त करता है, बिना कोई अतिरिक्त धार्मिक निष्कर्ष जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और वाचनयोग्य रखी गई है। भविष्यद्वक्तीय सूत्र में औपचारिकता बनी रहती है, जबकि नातान का आरोप संक्षिप्त और तीखा है। मुख्य पाठ का [a] चिह्न संबंधित पादटिप्पणी से मेल खाता है।
