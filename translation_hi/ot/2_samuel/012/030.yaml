  text: וַ/יִּקַּ֣ח אֶת עֲטֶֽרֶת מַלְכָּ/ם֩ מֵ/עַ֨ל רֹאשׁ֜/וֹ וּ/מִשְׁקָלָ֨/הּ כִּכַּ֤ר זָהָב֙ וְ/אֶ֣בֶן יְקָרָ֔ה וַ/תְּהִ֖י עַל רֹ֣אשׁ דָּוִ֑ד וּ/שְׁלַ֥ל הָ/עִ֛יר הוֹצִ֖יא הַרְבֵּ֥ה מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/030.yaml
  text: He took the crown of their king from his head[a]. Its weight was a talent of gold, and in it was a precious stone, and it was placed on David’s head[b]. He brought out the spoil of the city in very great quantity.
translation:
  language: hi
  text: उसने उनके राजा के सिर पर से उसका मुकुट उतार लिया[a]। उसका भार सोने का एक किक्कार[b] था, और उसमें एक बहुमूल्य पत्थर था; उसे दाऊद के सिर पर रखा गया। उसने नगर की बहुत बड़ी लूट बाहर निकाली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मिल्कोम का मुकुट।” यहाँ के इब्रानी शब्द को “उनके राजा” के बजाय अम्मोनियों के देवता मिल्कोम का नाम भी समझा जा सकता है; इस नाम को “मल्काम” भी लिखा जाता है।
    reason: alternative_reading
  - marker: b
    text: किक्कार भार की एक बहुत बड़ी प्राचीन इकाई थी। इसका भार प्रायः लगभग 34 किलोग्राम माना जाता है, हालाँकि प्राचीन मान अलग-अलग थे।
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: मुकुट
  rationale: राजकीय संदर्भ में यह स्वाभाविक और व्यापक रूप से समझा जाने वाला हिन्दी पर्याय है।
- source_word: מַלְכָּם
  choice: उनके राजा
  rationale: प्रदत्त स्वरांकन और रूपरचना इसे ‘उनका राजा’ बताती है; अम्मोनियों के देवता मिल्कोम के नाम की सम्भव वैकल्पिक व्याख्या पादटिप्पणी में रखी गई है।
- source_word: מֵעַל רֹאשׁוֹ
  choice: उसके सिर पर से
  rationale: यह מִן और עַל के संयुक्त दिशात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּכַּר זָהָב
  choice: एक किक्कार सोना
  rationale: כִּכָּר प्राचीन भार-माप है; पारम्परिक हिन्दी बाइबलीय शब्द ‘किक्कार’ को सांस्कृतिक स्पष्टीकरण के साथ रखा गया है।
- source_word: וְאֶבֶן יְקָרָה
  choice: और उसमें एक बहुमूल्य रत्न था
  rationale: इब्रानी वाक्यांश संक्षिप्त है। ‘उसमें’ रत्न का मुकुट से सम्बन्ध स्पष्ट करता है, पर उसे किस प्रकार लगाया गया था यह निर्धारित नहीं करता।
- source_word: וַתְּהִי עַל רֹאשׁ דָּוִד
  choice: फिर वह दाऊद के सिर पर रखा गया
  rationale: यह मुकुट के दाऊद के सिर पर आने के परिणामी भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: וּשְׁלַל הָעִיר הוֹצִיא הַרְבֵּה מְאֹד
  choice: वह नगर से बहुत बड़ी मात्रा में लूट का माल निकालकर ले गया
  rationale: ‘लूट का माल’ युद्ध में प्राप्त सामग्री को स्पष्ट करता है; ‘निकालकर ले गया’ הוֹצִיא के कारणवाचक/दिशात्मक भाव और प्रसंगगत निष्कासन दोनों को व्यक्त करता है।
theological_decisions:
- issue: מַלְכָּם को ‘उनके राजा’ समझा जाए या अम्मोनी देवता ‘मिल्कोम’ का नाम
  choice: उनके राजा
  alternative: मिल्कोम (जिसे मल्काम भी लिखा जाता है)
  rationale: मसोरेटिक स्वरांकन और वाक्य में ‘उसके सिर पर से’ सामान्य संज्ञा ‘उनके राजा’ का समर्थन करते हैं। फिर भी देवता के नाम वाली व्याख्या प्राचीन संदर्भ में वास्तविक सम्भावना है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप रखा गया है। ‘किक्कार’ जैसे सांस्कृतिक माप को मूल रूप में रखकर पादटिप्पणी में समझाया गया है; वास्तविक शाब्दिक अस्पष्टता को मुख्य पाठ और पादटिप्पणी के माध्यम से सुरक्षित रखा गया है।
