    text: या “सारी सेना” या “सभी सैनिक”; इब्रानी में शाब्दिक अर्थ “सब लोग” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: इकट्ठा किया
  rationale: אסף का मूल अर्थ लोगों को एक साथ करना है। युद्ध के प्रसंग के बावजूद यह क्रिया अपने आप में औपचारिक सैनिक जमावड़े को स्पष्ट नहीं करती।
- source_word: כָּל הָעָם
  choice: सब लोगों
  rationale: इब्रानी में शाब्दिक रूप से 'सब लोग' है। प्रसंग में आशय दाऊद की सेना या सैनिकों से हो सकता है, पर मुख्य पाठ मूल की व्यापक अभिव्यक्ति को बनाए रखता है।
- source_word: רַבָּתָה
  choice: रब्बा जाकर
  rationale: स्थान-नाम רַבָּה के साथ दिशासूचक ה है, जो रब्बा की ओर जाने का भाव देता है; स्वाभाविक हिन्दी में इसे 'रब्बा जाकर' व्यक्त किया गया है।
- source_word: וַיִּלָּחֶם בָּהּ
  choice: उसके विरुद्ध युद्ध किया
  rationale: לחם के साथ ב यहाँ नगर के विरुद्ध युद्ध करने को व्यक्त करता है। हिन्दी में नगर के लिए 'उसके' स्वाभाविक है।
- source_word: וַיִּלְכְּדָהּ
  choice: उसे जीत लिया
  rationale: לכד युद्ध के प्रसंग में किसी नगर पर अधिकार करने या उसे जीत लेने का अर्थ देता है। 'जीत लिया' सामान्य आधुनिक हिन्दी में स्पष्ट और सहज है।
