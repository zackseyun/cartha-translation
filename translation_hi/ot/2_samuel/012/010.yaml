  text: וְ/עַתָּ֗ה לֹא תָס֥וּר חֶ֛רֶב מִ/בֵּיתְ/ךָ֖ עַד עוֹלָ֑ם עֵ֚קֶב כִּ֣י בְזִתָ֔/נִי וַ/תִּקַּ֗ח אֶת אֵ֨שֶׁת֙ אוּרִיָּ֣ה הַ/חִתִּ֔י לִ/הְי֥וֹת לְ/ךָ֖ לְ/אִשָּֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/010.yaml
  text: Now therefore[a], the sword shall never depart from your house[b], because you have despised me and have taken the wife of Uriah the Hittite to be your wife.
translation:
  language: hi
  text: इसलिए अब तलवार तुम्हारे घराने[a] से कभी दूर न होगी, क्योंकि तुमने मेरा तिरस्कार किया और हित्ती ऊरिय्याह की पत्नी को अपनी पत्नी बनाने के लिए ले लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी ‘घर’ का अर्थ परिवार, गृह-परिवार या राजवंश भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह पद पिछले अभियोग से निकलने वाले परिणामस्वरूप न्याय की घोषणा करता है; यह अनुवाद कालगत और निष्कर्षसूचक दोनों भाव रखता है।
- source_word: לֹא תָסוּר ... עַד עוֹלָם
  choice: कभी दूर न होगी
  rationale: סור का अर्थ यहाँ हटना या दूर होना है, और עַד עוֹלָם के साथ यह लगातार बने रहने वाले न्याय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֶרֶב
  choice: तलवार
  rationale: मूल रूपक को बनाए रखता है और हिंसक संघर्ष तथा न्याय के भाव को बिना व्याख्यात्मक विस्तार के व्यक्त करता है।
- source_word: מִבֵּיתְךָ
  choice: तुम्हारे घराने से
  rationale: ‘घराना’ हिन्दी में परिवार, गृह-परिवार और वंश की व्यापकता को समेट सकता है; पादटिप्पणी वास्तविक अर्थगत विस्तार स्पष्ट करती है।
- source_word: עֵקֶב כִּי
  choice: क्योंकि
  rationale: घोषित दण्ड का कारण सरल और स्पष्ट आधुनिक हिन्दी में बताता है।
- source_word: בְזִתָנִי
  choice: तुमने मेरा तिरस्कार किया
  rationale: प्रथम पुरुष एकवचन प्रत्यय और בזה के अवमानना-सूचक अर्थ को सीधे सुरक्षित रखता है।
- source_word: וַתִּקַּח
  choice: ले लिया
  rationale: दाऊद के पूर्ण किए हुए कार्य को स्पष्ट करता है और अगले उद्देश्यसूचक वाक्यांश से स्वाभाविक रूप से जुड़ता है।
- source_word: אֵשֶׁת אוּרִיָּה הַחִתִּי
  choice: हित्ती उरिय्याह की पत्नी
  rationale: उस स्त्री के उरिय्याह के साथ विद्यमान वैवाहिक संबंध पर मूल पाठ का जोर बनाए रखता है।
- source_word: לִהְיוֹת לְךָ לְאִשָּׁה
  choice: अपनी पत्नी बनाने के लिए
  rationale: मुहावरे का स्वाभाविक हिन्दी रूप है और उसे अपनी पत्नी के रूप में ग्रहण करने का आशय स्पष्ट करता है।
theological_decisions:
- issue: ‘तुमने मेरा तिरस्कार किया’ में प्रथम पुरुष का संदर्भ
  choice: ‘मेरा’ को परमेश्वर के सीधे कथन के रूप में बनाए रखा गया
  alternative: ‘तुमने यहोवा के वचन/आज्ञा का तिरस्कार किया’
  rationale: इब्रानी में स्पष्ट प्रथम पुरुष एकवचन ‘मेरा’ है। यह उरिय्याह और उसकी पत्नी के विरुद्ध किए गए पाप को स्वयं परमेश्वर के प्रति तिरस्कार के रूप में प्रस्तुत करने वाला धार्मिक तनाव सुरक्षित रखता है।
- issue: ‘तुम्हारे घराने’ का दायरा
  choice: व्यापक ‘घराने’ का प्रयोग
  alternative: केवल ‘परिवार’ या केवल ‘राजवंश’
  rationale: בַּיִת यहाँ परिवार, गृह-परिवार और राजवंश तक संकेत कर सकता है; किसी एक अर्थ तक सीमित करना मूल की वास्तविक व्यापकता को घटा देता।
- issue: עַד עוֹלָם की अवधि
  choice: ‘कभी दूर न होगी’
  alternative: ‘सदा तक दूर न होगी’
  rationale: यह स्थायी या अनिश्चित रूप से दीर्घ न्याय की शक्ति को स्वाभाविक हिन्दी में रखता है, बिना उसकी अवधि के दार्शनिक अर्थ को आवश्यकता से अधिक निश्चित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा भविष्यद्वाणी-संबंधी न्याय-वचन। ‘घराने’ से मूल की अर्थगत व्यापकता रखी गई है; ‘मेरा तिरस्कार’ को नरम या व्याख्यात्मक नहीं बनाया गया।
