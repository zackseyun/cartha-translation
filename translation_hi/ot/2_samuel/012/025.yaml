base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/025.yaml
  text: And he sent word through Nathan the prophet[a], and he called his name Jedidiah[b], because of Yahweh.
translation:
  language: hi
  text: उसने नातान नबी के द्वारा[b] संदेश भेजा और उसका नाम यदीद्याह[a] रखा, याहवे के कारण।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यदीद्याह’ नाम का सम्भावित अर्थ है, ‘याहवे का प्रिय।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘नातान नबी के हाथ से।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: संदेश भेजा
  rationale: क्रिया का मूल अर्थ ‘भेजा’ है; नातान नबी के माध्यम से किए गए कार्य के संदर्भ में संप्रेषण निहित है, इसलिए आधुनिक हिन्दी में ‘संदेश भेजा’ स्वाभाविक है।
- source_word: בְּיַד נָתָן הַנָּבִיא
  choice: नातान नबी के द्वारा
  rationale: शाब्दिक रूप से ‘नातान नबी के हाथ से’; यहाँ בְּיַד माध्यम या प्रतिनिधित्व बताने वाला मुहावरा है।
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: उसका नाम … रखा
  rationale: इब्रानी मुहावरे ‘उसका नाम पुकारा’ का स्वाभाविक आधुनिक हिन्दी अर्थ ‘उसका नाम … रखा’ है।
- source_word: יְדִידְיָהּ
  choice: यदीद्याह
  rationale: व्यक्तिनाम का लिप्यंतरण किया गया है; इसके संभावित अर्थ को पादटिप्पणी में रखा गया है।
- source_word: בַּעֲבוּר
  choice: क्योंकि … ने ऐसा चाहा
  rationale: यह पद कारण या आधार व्यक्त करता है। केवल ‘के कारण’ हिन्दी में अस्पष्ट और अस्वाभाविक हो सकता है; सन्दर्भानुसार यह वाक्य नामकरण को याहवे की इच्छा से जोड़ता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ‘भेजा’ और ‘नाम रखा’ क्रियाओं का कर्ता
  choice: मुख्य पाठ में ‘उसने’ और ‘उसका’ रखकर कर्ता को अनावश्यक रूप से स्पष्ट नहीं किया गया।
  alternative: दोनों क्रियाओं का कर्ता स्पष्ट रूप से ‘याहवे’ लिखना; अथवा दूसरी क्रिया का कर्ता नातान मानना।
  rationale: पिछले वाक्य में याहवे निकटतम कर्ता है और सन्दर्भ में उसका कर्ता होना सम्भावित है, पर इब्रानी में इन क्रियाओं के साथ संज्ञात्मक कर्ता दुबारा नहीं आया। सर्वनाम स्रोत की व्याकरणिक अस्पष्टता को सुरक्षित रखते हैं।
- issue: בַּעֲבוּר יְהוָה का आशय
  choice: ‘क्योंकि याहवे ने ऐसा चाहा’
  alternative: ‘याहवे के कारण’ अथवा ‘याहवे के लिए’
  rationale: पदबंध कारण/आधार बताता है। चुना हुआ रूप नामकरण के पीछे याहवे की पहल व्यक्त करता है, पर बच्चे के नाम के अर्थ और इस कारण-पदबंध को एक ही बात घोषित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘नबी’ प्रचलित बाइबिलीय पद है। पादटिप्पणी-चिह्न उसी शब्द-समूह के बाद रखे गए हैं जिसकी वे व्याख्या करते हैं।
