base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/008.yaml
  text: And I gave you your master's house and your master's wives into your bosom[a], and I gave you the house of Israel and Judah; and if that had been too little[b], I would have added to you such and such things.
translation:
  language: hi
  text: और मैंने तेरे स्वामी का घराना तुझे दे दिया, और तेरे स्वामी की पत्नियों को तेरी गोद में दे दिया[a]। मैंने इस्राएल और यहूदा का घराना भी तुझे दे दिया। और यदि यह कम पड़ता, तो मैं तुझे ऐसी-ऐसी और भी चीज़ें देता[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “तेरी गोद में।” यह इब्रानी मुहावरा निकट ग्रहण या अधिकार में दिए जाने का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी अभिव्यक्ति का अर्थ “ऐसी ही और भी चीज़ें” अथवा “इससे भी अधिक” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: मैंने...दे दिया
  rationale: נתן के क़ाल वय्यिक्तोल रूप को बीती हुई घटनाओं की क्रमिक पुनर्गणना के रूप में स्वाभाविक हिन्दी भूतकाल में व्यक्त किया गया है।
- source_word: בֵּית אֲדֹנֶיךָ
  choice: तेरे स्वामी का घराना
  rationale: בַּיִת यहाँ केवल भवन नहीं, बल्कि शाही घराने, संपत्ति और अधिकार-क्षेत्र के व्यापक अर्थ को धारण कर सकता है; ‘घराना’ मूल बिंब और व्यापक आशय दोनों को बनाए रखता है।
- source_word: נְשֵׁי אֲדֹנֶיךָ
  choice: तेरे स्वामी की पत्नियाँ
  rationale: यह रचना का सीधा अर्थ है। ‘स्वामी’ मानवीय अधिपति को स्पष्ट करता है और परमेश्वर के लिए प्रयुक्त उपाधि से अनावश्यक भ्रम नहीं पैदा करता।
- source_word: בְּחֵיקֶךָ
  choice: तेरी गोद में
  rationale: חֵיק का ठोस अर्थ छाती से लगा भाग या गोद है। ‘गोद में’ आधुनिक हिन्दी में ग्रहण, निकटता और अधिकार के इब्रानी मुहावरे को अपेक्षाकृत स्वाभाविक रूप से बनाए रखता है।
- source_word: בֵּית יִשְׂרָאֵל וִיהוּדָה
  choice: इस्राएल और यहूदा का घराना
  rationale: ‘घराना’ मूल के בֵּית को सुरक्षित रखता है और दाऊद के अधीन प्रजा अथवा राजकीय क्षेत्र के व्यापक संकेत को बिना ‘राज्य’ जोड़कर निर्धारित किए व्यक्त करता है।
- source_word: וְאִם מְעָט
  choice: यदि यह थोड़ा होता
  rationale: शर्तात्मक अपर्याप्तता को निकटता से व्यक्त किया गया है; प्रसंग इसे वास्तविक शिकायत नहीं, बल्कि काल्पनिक स्थिति के रूप में समझने देता है।
- source_word: וְאֹסִפָה לְּךָ
  choice: मैं तुझे...और भी...देता
  rationale: יסף के हिफ़ील का मूल भाव ‘और जोड़ना’ है। हिन्दी में ‘और भी देता’ शर्तात्मक अर्थ को स्वाभाविक रखता है।
- source_word: כָּהֵנָּה וְכָהֵנָּה
  choice: ऐसी-ऐसी और भी वस्तुएँ
  rationale: दोहराया हुआ संकेतवाचक पद अनिश्चित रूप से इसी प्रकार की अतिरिक्त चीज़ों की ओर संकेत करता है; अनुवाद उस अनिश्चित और संचयी भाव को बचाता है।
theological_decisions:
- issue: क्या पद को इस तरह व्यक्त किया जाए कि शाऊल की पत्नियों का दाऊद को दिया जाना परमेश्वर की ओर से दाम्पत्य अनुमोदन घोषित हो
  choice: मूल कथन के अनुसार ‘तेरी गोद में दे दिया’ रखा गया है, पर इसे स्पष्ट दाम्पत्य अनुमोदन या विस्तृत वैवाहिक दावे में नहीं बदला गया।
  alternative: ‘तेरे हरम में दे दिया’ अथवा ‘तेरी देखभाल में सौंप दिया’
  rationale: इब्रानी पाठ राजकीय उत्तराधिकार और अधिकार से जुड़ा हस्तांतरण बताता है, पर उसकी सटीक सामाजिक या दाम्पत्य प्रकृति को स्पष्ट नहीं करता। अनुवाद इस तनाव और अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक स्वर रखा गया है। परमेश्वर द्वारा दाऊद को सीधे संबोधन के अनुरूप एकवचन निकटवर्ती ‘तेरे/तुझे’ का प्रयोग किया गया है। ‘घराना’ द्वारा בַּיִת की भवन, राजवंश और अधिकार-क्षेत्र संबंधी अर्थ-व्याप्ति को खुला रखा गया है।
