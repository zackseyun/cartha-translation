    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: तब ... भेजे
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: इस मानवीय और सैनिक संदर्भ में यह शब्द संदेश पहुँचाने वाले मनुष्यों के लिए है; ‘दूत’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: נִלְחַמְתִּי בְרַבָּה
  choice: मैंने रब्बा के विरुद्ध युद्ध किया है
  rationale: בְ के साथ नगर का नाम यहाँ घेराबंदी या आक्रमण का लक्ष्य बताता है। पूर्ण क्रिया को वर्तमान परिणाम से जुड़ी पूर्ण कार्रवाई के रूप में रखा गया है।
- source_word: רַבָּה
  choice: रब्बा
  rationale: स्थान-नाम का लिप्यंतरण किया गया है; आसपास के प्रसंग से अम्मोनियों का रब्बा स्पष्ट है, इसलिए अतिरिक्त पहचान मुख्य पाठ में नहीं जोड़ी गई।
- source_word: גַּם
  choice: भी
  rationale: यह युद्ध करने और नगर पर अधिकार करने—दो उपलब्धियों के बीच योगात्मक संबंध व्यक्त करता है।
- source_word: לָכַדְתִּי
  choice: अधिकार कर लिया है
  rationale: सैनिक प्रसंग में यह किसी नगर या उसके हिस्से को अपने नियंत्रण में ले लेने का स्वाभाविक हिन्दी प्रयोग है।
- source_word: עִיר הַמָּיִם
  choice: जल-नगर
  rationale: यह संक्षिप्त रूप हिब्रू की संबंधवाचक अभिव्यक्ति की अस्पष्टता बनाए रखता है और किसी विशिष्ट भौगोलिक व्याख्या को मुख्य पाठ में निश्चित नहीं करता।
