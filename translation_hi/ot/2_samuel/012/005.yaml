  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף דָּוִ֛ד בָּ/אִ֖ישׁ מְאֹ֑ד וַ/יֹּ֨אמֶר֙ אֶל נָתָ֔ן חַי יְהוָ֕ה כִּ֣י בֶן מָ֔וֶת הָ/אִ֖ישׁ הָ/עֹשֶׂ֥ה זֹֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/005.yaml
  text: Then David burned with anger against the man greatly[a], and he said to Nathan, “As Yahweh lives, the man who has done this is a son of death!”
translation:
  language: hi
  text: तब दाऊद का क्रोध उस मनुष्य पर बहुत भड़क उठा, और उसने नातान से कहा, “याहवे के जीवन की शपथ, जिस मनुष्य ने यह किया है, वह मृत्यु का पुत्र है![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘मृत्यु का पुत्र’; अर्थात् ऐसा व्यक्ति जो मरने या मृत्यु-दण्ड पाने के योग्य है।
    reason: शाब्दिक इब्रानी मुहावरे का अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּחַר אַף דָּוִד ... מְאֹד
  choice: दाऊद का क्रोध ... बहुत भड़क उठा
  rationale: यह अभिव्यक्ति क्रोध के जलने या भड़कने के इब्रानी बिंब को स्वाभाविक हिन्दी में बनाए रखती है; ‘बहुत’ מְאֹד की तीव्रता को स्पष्ट करता है।
- source_word: בָּאִישׁ
  choice: उस मनुष्य पर
  rationale: संदर्भ में यह नातान के दृष्टान्त के धनी मनुष्य को सूचित करता है और दाऊद के क्रोध का लक्ष्य बताता है।
- source_word: חַי יְהוָה
  choice: याहवे के जीवन की शपथ
  rationale: यह इब्रानी शपथ-सूत्र की गंभीरता और ‘याहवे जीवित है’ के मूल भाव को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: כִּי
  choice: प्रत्यक्ष कथन में निहित
  rationale: यहाँ כִּי शपथ के बाद घोषणा की विषयवस्तु प्रस्तुत करता है; हिन्दी में अलग संयोजक जोड़े बिना प्रत्यक्ष कथन स्वाभाविक है।
- source_word: בֶן מָוֶת
  choice: मृत्यु का पुत्र
  rationale: मूल इब्रानी मुहावरे की तीखी न्यायिक भाषा को मुख्य पाठ में सुरक्षित रखा गया है; उसका आशय पादटिप्पणी में स्पष्ट है।
- source_word: הָעֹשֶׂה זֹאת
  choice: जिस मनुष्य ने यह किया है
  rationale: इब्रानी कृदन्तीय वाक्यांश को स्पष्ट और स्वाभाविक हिन्दी सम्बन्धवाचक उपवाक्य में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसे शीर्षक से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: בֶן מָוֶת को शाब्दिक या अर्थानुसार प्रस्तुत करना
  choice: मृत्यु का पुत्र
  alternative: मृत्यु-दण्ड के योग्य; मरने योग्य
  rationale: मुख्य पाठ मूल मुहावरे और उसकी कठोरता को बनाए रखता है, जबकि पादटिप्पणी पाठक को उसका अभिप्रेत न्यायिक अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘क्रोध ... भड़क उठा’ स्वाभाविक हिन्दी में मूल बिंब और तीव्रता दोनों बनाए रखता है; ‘मृत्यु का पुत्र’ जानबूझकर स्रोत-सन्निकट है और पादटिप्पणी से स्पष्ट किया गया है।
