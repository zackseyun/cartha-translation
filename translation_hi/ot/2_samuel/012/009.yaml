base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/009.yaml
  text: Why have you despised the word of Yahweh[a], to do what is evil in his sight? You struck down Uriah the Hittite with the sword, and took his wife for yourself as a wife[c][b], and killed him with the sword of the Ammonites.
translation:
  language: hi
  text: तूने यहोवा[a] के वचन का तिरस्कार करके उसकी दृष्टि में बुरा काम क्यों किया? तूने हित्ती ऊरिय्याह को तलवार से मार डाला, और उसकी पत्नी को अपने लिए पत्नी के रूप में ले लिया[b], तथा उसे अम्मोनियों की तलवार से मार डाला।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा के वचन को तुच्छ क्यों जाना?”
    reason: בזה में तिरस्कार, अवमानना, और तुच्छ समझने का भाव है।
  - marker: b
    text: शाब्दिक रूप से, “उसकी पत्नी को अपने लिए पत्नी के रूप में ले लिया”; यह भाषा दाऊद द्वारा ऊरिय्याह की पत्नी को अपने लिए हथिया लेने पर बल देती है।
    reason: मूल इब्रानी की जानबूझकर दोहराई गई वैवाहिक और स्वार्थपरक अभिव्यक्ति समझाने के लिए।
  - marker: c
    text: शाब्दिक रूप से, “अम्मोन के पुत्रों की तलवार से”; अर्थात दाऊद ने अम्मोनियों को माध्यम बनाकर ऊरिय्याह की मृत्यु कराई।
    reason: प्राचीन जातिनाम और दाऊद की परोक्ष किंतु वास्तविक एजेंसी स्पष्ट करने के लिए।
lexical_decisions:
- source_word: מַדּוּעַ
  choice: क्यों
  rationale: सीधा प्रश्नवाचक शब्द नातान के आरोप की तीक्ष्णता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בָּזִיתָ
  choice: तुच्छ जाना
  rationale: यह क्रिया केवल आज्ञा न मानने की नहीं, बल्कि तिरस्कार और अवमानना की भावना व्यक्त करती है।
- source_word: דְּבַר יְהוָה
  choice: यहोवा के वचन
  rationale: ‘वचन’ मूल अभिव्यक्ति की व्यापकता बनाए रखता है, जिसमें परमेश्वर की आज्ञा और प्रकट इच्छा दोनों सम्मिलित हो सकती हैं; יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינָיו
  choice: वह काम किया जो उसकी दृष्टि में बुरा है
  rationale: यह स्वाभाविक हिन्दी में इब्रानी की नैतिक मूल्यांकन वाली अभिव्यक्ति को सुरक्षित रखता है।
- source_word: הִכִּיתָ בַחֶרֶב
  choice: तलवार से मार डाला
  rationale: נכה का हिंसक अर्थ और तलवार की साधनात्मक भूमिका दोनों स्पष्ट होते हैं; हिन्दी में ‘मार डाला’ मृत्यु के परिणाम को स्वाभाविक ढंग से बताता है।
- source_word: לָקַחְתָּ לְּךָ לְאִשָּׁה
  choice: उसकी पत्नी को अपनी पत्नी बनाने के लिए ले लिया
  rationale: मूल की कुछ पुनरुक्तिपूर्ण भाषा को पठनीय हिन्दी में रखते हुए दाऊद द्वारा उसे अपने लिए हथिया लेने और पत्नी बनाने—दोनों बातों को व्यक्त करता है।
- source_word: הָרַגְתָּ
  choice: मरवा डाला
  rationale: व्याकरण में दाऊद कर्ता है, पर अगला वाक्यांश अम्मोनियों को माध्यम बताता है; हिन्दी का प्रेरणार्थक रूप दाऊद की दोषपूर्ण एजेंसी को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּחֶרֶב בְּנֵי עַמּוֹן
  choice: अम्मोनियों की तलवार से
  rationale: ‘अम्मोनियों’ בני עמון का प्रचलित जातिनाम है; ‘तलवार’ युद्ध में उनके हाथों हुई मृत्यु और दाऊद द्वारा उनके माध्यम के उपयोग को बनाए रखती है।
- source_word: אוּרִיָּה הַחִתִּי
  choice: हित्ती ऊरिय्याह
  rationale: व्यक्तिनाम और जातीय पहचान दोनों को पारंपरिक, सुबोध हिन्दी रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। हिन्दी बाइबिल परंपरा में परिचित ‘यहोवा’ सामान्य पाठक के लिए पहचानने योग्य है और नाम को सामान्य उपाधि ‘प्रभु’ में नहीं बदलता।
- issue: ऊरिय्याह की मृत्यु में दाऊद की एजेंसी
  choice: मरवा डाला
  alternative: मार डाला
  rationale: इब्रानी दाऊद को हत्या का उत्तरदायी ठहराती है और साथ ही अम्मोनियों की तलवार को माध्यम बताती है। प्रेरणार्थक हिन्दी प्रत्यक्ष वार और परोक्ष षड्यंत्र के बीच के तनाव को मिटाए बिना उसकी जिम्मेदारी स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सीधे आरोप वाली रखी गई है। ‘तूने’ प्रसंग की भविष्यद्वक्ताई सीधी फटकार और एकवचन संबोधन को दर्शाता है। ‘मार डाला/मरवा डाला’ का अंतर मूल में पहले हिंसक प्रहार और फिर अम्मोनी माध्यम से हत्या की पुनरुक्ति को हिन्दी में अर्थपूर्ण बनाता है।
