source:
  edition: WLC
  text: וַ/יְנַחֵ֣ם דָּוִ֗ד אֵ֚ת בַּת שֶׁ֣בַע אִשְׁתּ֔/וֹ וַ/יָּבֹ֥א אֵלֶ֖י/הָ וַ/יִּשְׁכַּ֣ב עִמָּ֑/הּ וַ/תֵּ֣לֶד בֵּ֗ן ו/יקרא אֶת שְׁמ/וֹ֙ שְׁלֹמֹ֔ה וַ/יהוָ֖ה אֲהֵבֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/024.yaml
  text: Then David comforted Bathsheba his wife[a], and he went in to her and lay with her. She bore a son, and he named him Solomon[b]. And Yahweh loved him.
translation:
  language: hi
  text: तब दाऊद ने अपनी पत्नी बतशेबा को सांत्वना दी। वह उसके पास गया और उसके साथ सोया। उसने एक पुत्र को जन्म दिया, और दाऊद ने उसका नाम सुलैमान रखा। याहवे ने उस पुत्र से प्रेम किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְנַחֵם
  choice: सांत्वना दी
  rationale: पिएल रूप यहाँ बच्चे की मृत्यु के बाद शोकग्रस्त व्यक्ति को ढाढ़स देने का अर्थ व्यक्त करता है; ‘सांत्वना दी’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: בַּת שֶׁבַע אִשְׁתּוֹ
  choice: अपनी पत्नी बतशेबा
  rationale: इब्रानी पाठ बतशेबा को स्पष्ट रूप से दाऊद की पत्नी कहता है; इस कथात्मक रूप से महत्त्वपूर्ण पहचान को बनाए रखा गया है।
- source_word: וַיָּבֹא אֵלֶיהָ וַיִּשְׁכַּב עִמָּהּ
  choice: वह उसके पास गया और उसके साथ सोया
  rationale: पहले पदबंध को स्वाभाविक हिन्दी में रखा गया है और दूसरे पदबंध द्वारा यौन संबंध का इब्रानी शिष्टोक्ति-संकेत स्पष्ट बना रहता है, बिना अनावश्यक रूप से अशिष्ट हुए।
- source_word: וַתֵּלֶד בֵּן
  choice: उसने एक पुत्र को जन्म दिया
  rationale: यह इब्रानी कथन का स्पष्ट और स्वाभाविक आधुनिक हिन्दी समतुल्य है।
- source_word: וַיִּקְרָא אֶת שְׁמוֹ שְׁלֹמֹה
  choice: दाऊद ने उसका नाम सुलैमान रखा
  rationale: क्रिया पुल्लिंग एकवचन है; निकटतम कथात्मक कर्ता दाऊद है। हिन्दी में अस्पष्ट सर्वनाम से बचने के लिए नाम दोहराया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित निकट लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: אֲהֵבוֹ
  choice: उससे प्रेम किया
  rationale: אהב का सीधा अर्थ ‘प्रेम करना’ है और प्रत्यय नवजात पुत्र की ओर संकेत करता है; हिन्दी में ‘उससे प्रेम किया’ स्वाभाविक है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है और ‘यहोवा’ की अपेक्षा मूल उच्चारण-साक्ष्य के अधिक निकट है।
- issue: नाम रखने वाले व्यक्ति की पहचान
  choice: दाऊद ने उसका नाम रखा
  alternative: उसने उसका नाम रखा
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन है और संदर्भ में दाऊद स्वाभाविक कर्ता है। हिन्दी में ‘उसने’ बतशेबा की ओर भी समझा जा सकता था, इसलिए कथात्मक अर्थ स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। मूल की यौन शिष्टोक्ति को ‘उसके पास गया और उसके साथ सोया’ के रूप में पर्याप्त निकटता से रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
