- source_word: עָשָׂה אֶת־הַדָּבָר הַזֶּה
  choice: उसने ऐसा काम किया
  rationale: דָּבָר यहाँ ‘काम/कृत्य’ के अर्थ में है; ‘ऐसा काम किया’ इब्रानी अभिव्यक्ति का बल बनाए रखते हुए मुहावरेदार हिन्दी देता है।
- source_word: לֹא חָמָל
