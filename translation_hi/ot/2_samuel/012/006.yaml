  rationale: חמל दया के कारण किसी को या किसी वस्तु को हानि से बचाने अथवा छोड़ देने का भाव रखता है; ‘दया नहीं की’ संदर्भ में नैतिक कठोरता को स्पष्ट करता है और मूल की अर्थ-सीमा भी बनाए रखता है।
