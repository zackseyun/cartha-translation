source:
  edition: WLC
  text: וְ/לָ/רָ֣שׁ אֵֽין כֹּ֗ל כִּי֩ אִם כִּבְשָׂ֨ה אַחַ֤ת קְטַנָּה֙ אֲשֶׁ֣ר קָנָ֔ה וַ/יְחַיֶּ֕/הָ וַ/תִּגְדַּ֥ל עִמּ֛/וֹ וְ/עִם בָּנָ֖י/ו יַחְדָּ֑ו מִ/פִּתּ֨/וֹ תֹאכַ֜ל וּ/מִ/כֹּס֤/וֹ תִשְׁתֶּה֙ וּ/בְ/חֵיק֣/וֹ תִשְׁכָּ֔ב וַ/תְּהִי ל֖/וֹ כְּ/בַֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/003.yaml
  text: But the poor man had nothing except one little ewe lamb[a], which he had bought. He kept it alive, and it grew up with him and with his children together; it would eat from his morsel and drink from his cup and lie in his bosom[c][b], and it was like a daughter to him.
translation:
  language: hi
  text: परन्तु उस गरीब के पास एक छोटी-सी मेमनी के सिवा कुछ भी न था, जिसे उसने खरीदा था। उसने उसे जीवित रखा, और वह उसके और उसके बेटों के साथ-साथ बड़ी हुई। वह उसके कौर में से खाती, उसके प्याले में से पीती और उसकी गोद में लेटती थी[a]; वह उसके लिए बेटी के समान थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “गोद में” का अनुवाद “छाती से लगकर” या “बाहों में” भी किया जा सकता है; यहाँ घर के भीतर गहरे स्नेह का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשׁ
  choice: गरीब
  rationale: यह संज्ञा निर्धन या अभावग्रस्त व्यक्ति को दर्शाती है; पिछले पद के धनी व्यक्ति के साथ इसका स्पष्ट विरोध बना रहता है।
- source_word: אֵין כֹּל כִּי אִם
  choice: के सिवा कुछ भी न था
  rationale: यह इब्रानी मुहावरा पूर्ण अभाव और केवल एक अपवाद को व्यक्त करता है; हिन्दी में यह स्वाभाविक और अर्थ-सटीक है।
- source_word: כִּבְשָׂה אַחַת קְטַנָּה
  choice: एक छोटी-सी मादा मेमनी
  rationale: כִּבְשָׂה मादा मेमने को दर्शाता है; 'छोटी-सी' उसके छोटे आकार और कथा के स्नेहपूर्ण भाव, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר קָנָה
  choice: जिसे उसने खरीदा था
  rationale: קנה यहाँ खरीदने या प्राप्त करने के अर्थ में है; प्रसंग में क्रय का सीधा अर्थ उपयुक्त है।
- source_word: וַיְחַיֶּהָ
  choice: उसने उसे जीवित रखा
  rationale: חיה के हिफ़ील रूप का प्रत्यक्ष अर्थ जीवन बनाए रखना या जीवित रखना है; यह उसके निरन्तर पालन की ओर संकेत करता है, बिना क्रिया को केवल 'पालना' बना देने के।
- source_word: וַתִּגְדַּל
  choice: बड़ी हुई
  rationale: यह क्रिया बढ़ने या बड़ा होने को व्यक्त करती है; घर में पाली जा रही मेमनी के परिपक्व होने का स्वाभाविक हिन्दी वर्णन है।
- source_word: עִמּוֹ וְעִם בָּנָיו יַחְדָּו
  choice: उसके और उसके बेटों के साथ-साथ
  rationale: בָּנָיו का औपचारिक अर्थ 'उसके बेटे' है और יַחְדָּו के सामूहिक बल को 'साथ-साथ' बनाए रखता है।
- source_word: מִפִּתּוֹ
  choice: उसके कौर में से
  rationale: פַּת रोटी या भोजन के छोटे टुकड़े अथवा कौर को दर्शाता है; यह अपने भोजन को घनिष्ठता से बाँटने की छवि बनाए रखता है।
- source_word: מִכֹּסוֹ
  choice: उसके प्याले में से
  rationale: כּוֹס पीने के प्याले को दर्शाता है; हिन्दी में यह स्वाभाविक और चित्रात्मक है।
- source_word: בְחֵיקוֹ תִשְׁכָּב
  choice: उसकी गोद में लेटती थी
  rationale: חֵיק का अर्थ गोद, वक्षस्थल या बाहों के निकट का स्थान हो सकता है और שכב का अर्थ लेटना है; 'गोद में लेटना' घरेलू स्नेह की छवि को सहज हिन्दी में रखता है।
- source_word: וַתְּהִי לוֹ כְּבַת
  choice: वह उसके लिए बेटी के समान थी
  rationale: इब्रानी में स्पष्ट उपमा है; यह अनुवाद मेमनी को शाब्दिक संतान बनाए बिना पारिवारिक स्नेह को सुरक्षित रखता है।
theological_decisions:
- issue: मेमनी के लिए मानवीय और पारिवारिक घरेलू चित्रण
  choice: घनिष्ठ पारिवारिक भाषा को सीधे बनाए रखना
  alternative: भावुकता घटाने के लिए चित्रण को नरम करना
  rationale: इब्रानी दृष्टान्त जानबूझकर मेमनी को परिवार के प्रिय सदस्य जैसा दिखाकर करुणा और अन्याय की तीव्रता बढ़ाता है; अनुवाद में इस प्रभाव को कम नहीं किया गया।
- issue: בָּנָיו का अनुवाद
  choice: बेटों
  alternative: बच्चों
  rationale: मूल रूप स्पष्टतः पुल्लिंग बहुवचन 'उसके बेटे' है। हिन्दी में 'बेटों' स्वाभाविक भी है और स्रोत की विशिष्टता को बनाए रखता है; व्यापक 'बच्चों' की आवश्यकता नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किन्तु गरिमापूर्ण रखी गई है। 'छोटी-सी मादा मेमनी', 'कौर', 'प्याला' और 'गोद' कथा की कोमल घरेलू छवि को सामान्य पाठक के लिए स्पष्ट रखते हैं।
