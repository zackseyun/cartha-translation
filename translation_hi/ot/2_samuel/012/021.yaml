base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/021.yaml
  text: Then his servants said to him[a], “What is this thing that you have done? While the child was alive, you fasted and wept; but when the child died, you got up and ate bread.”
translation:
  language: hi
  text: तब उसके सेवकों ने उससे कहा, “आपने यह क्या किया है? जब बच्चा जीवित था, तब आपने उपवास किया और रोए; लेकिन जब बच्चा मर गया, तब आप उठे और भोजन किया।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ עֲבָדָיו אֵלָיו
  choice: तब उसके सेवकों ने उससे कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, इसलिए ‘तब’ स्वाभाविक है। राजदरबार के संदर्भ में עֲבָדָיו के लिए ‘सेवक’ उपयुक्त है।
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר עָשִׂיתָה
  choice: यह क्या बात है जो आपने की है?
  rationale: यह अनुवाद मूल प्रश्न की ठोस अभिव्यक्ति और सेवकों के आश्चर्य को बनाए रखता है; सम्मानसूचक ‘आप’ आधुनिक हिंदी में राजा से संबोधन के अनुकूल है।
- source_word: בַּעֲבוּר הַיֶּלֶד חַי
  choice: जब तक बच्चा जीवित था, तब तक
  rationale: संदर्भ में यह पदबंध बच्चे के जीवित रहने की अवधि बताता है और अगले खंड के साथ स्पष्ट कालगत विरोध बनाता है।
- source_word: צַמְתָּ וַתֵּבְךְּ
  choice: आपने उपवास किया और रोते रहे
  rationale: ‘उपवास किया’ צום का सीधा अर्थ देता है। ‘रोते रहे’ उस अवधि में जारी शोक को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וְכַאֲשֶׁר מֵת הַיֶּלֶד
  choice: लेकिन जब बच्चा मर गया
  rationale: ‘लेकिन’ पहले और बाद के व्यवहार का निहित विरोध स्पष्ट करता है; מֵת को गतिशील रूप में ‘मर गया’ अनूदित किया गया है।
- source_word: קַמְתָּ וַתֹּאכַל לָחֶם
  choice: तब आप उठे और भोजन किया
  rationale: קום के लिए ‘उठे’ सहज है। אָכַל לֶחֶם हिब्रू मुहावरा सामान्यतः भोजन करने को दर्शाता है, इसलिए हिंदी में ‘भोजन किया’ अर्थ को बिना अनावश्यक सांस्कृतिक अस्पष्टता के संप्रेषित करता है।
