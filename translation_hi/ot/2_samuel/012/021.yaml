translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली। दाऊद के लिए सम्मानसूचक ‘आप’ रखा गया है। हिब्रू मुहावरे ‘रोटी खाना’ को लक्ष्य-भाषा के स्वाभाविक समतुल्य ‘भोजन करना’ से व्यक्त किया गया है, इसलिए पादटिप्पणी आवश्यक नहीं है।
