  text: וַ/יָּקָם֩ דָּוִ֨ד מֵ/הָ/אָ֜רֶץ וַ/יִּרְחַ֣ץ וַ/יָּ֗סֶךְ וַ/יְחַלֵּף֙ שמלת/ו וַ/יָּבֹ֥א בֵית יְהוָ֖ה וַ/יִּשְׁתָּ֑חוּ וַ/יָּבֹא֙ אֶל בֵּית֔/וֹ וַ/יִּשְׁאַ֕ל וַ/יָּשִׂ֥ימוּ ל֛/וֹ לֶ֖חֶם וַ/יֹּאכַֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/020.yaml
  text: Then David got up from the ground[a], washed, anointed himself, and changed his clothes. He went into the house of Yahweh and bowed down. Then he went to his house, asked, and they set bread before him, and he ate.
translation:
  language: hi
  text: तब दाऊद भूमि से उठा, नहाया, तेल लगाया और अपने वस्त्र बदले। वह याहवे के भवन में गया और उसने दण्डवत किया[a]। फिर वह अपने घर गया, उसने माँगा, और उसके सामने रोटी रखी गई और उसने खाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आराधना की”; हिब्रू क्रिया श्रद्धा या आराधना में शारीरिक रूप से झुकने अथवा दण्डवत होने को दर्शा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם מֵהָאָרֶץ
  choice: भूमि पर से उठा
  rationale: यह दाऊद के शोक करते हुए भूमि पर पड़े रहने के बाद उठने की ठोस क्रिया व्यक्त करता है।
- source_word: וַיִּרְחַץ
  choice: नहाया
  rationale: संदर्भ में शोक की अवस्था समाप्त करने के लिए शरीर धोना अभिप्रेत है; आधुनिक हिन्दी में ‘नहाया’ स्वाभाविक है।
- source_word: וַיָּסֶךְ
  choice: तेल लगाया
  rationale: सוך का अर्थ शरीर पर तेल लगाना है। यह अनुष्ठानिक अभिषेक का अनावश्यक संकेत दिए बिना उस समय की शारीरिक क्रिया बताता है।
- source_word: וַיְחַלֵּף שִׂמְלֹתוֹ
  choice: अपने वस्त्र बदले
  rationale: हिब्रू का एकवचन संज्ञा यहाँ पहनावे को सामूहिक रूप से दर्शाती है; हिन्दी में बहुवचन स्वाभाविक है।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: בית יהוה उपासना-स्थान को सूचित करता है और יהוה को उसके व्यक्तिगत नाम ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: וַיִּשְׁתָּחוּ
  choice: दण्डवत किया
  rationale: क्रिया श्रद्धा से झुकने या भूमि पर दण्डवत होने को दर्शाती है; यह शारीरिक क्रिया को बनाए रखती है और ‘आराधना की’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करती।
- source_word: וַיִּשְׁאַל
  choice: भोजन माँगा
  rationale: हिब्रू में कर्म व्यक्त नहीं है, पर अगली क्रिया—उसके सामने रोटी रखना—से माँगी गई वस्तु स्पष्ट होती है। स्वाभाविक हिन्दी के लिए निहित कर्म व्यक्त किया गया है।
- source_word: לֶחֶם
  choice: रोटी
  rationale: मूल शब्द का सीधा अर्थ ‘रोटी’ है, यद्यपि यह व्यापक रूप से भोजन का भी द्योतक हो सकता है।
- source_word: וַיָּשִׂימוּ לוֹ לֶחֶם
  choice: उसके सामने रोटी रखी गई
  rationale: हिब्रू में कर्ता अनिर्दिष्ट बहुवचन है। हिन्दी का कर्मवाच्य उस अनिर्दिष्ट कर्ता को स्वाभाविक रूप से बनाए रखता है।
- source_word: וַיֹּאכַל
  choice: उसने खाया
  rationale: सरल कथात्मक समापन को सीधे रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: וַיִּשְׁתָּחוּ में शारीरिक प्रणाम और आराधना का संबंध
  choice: दण्डवत किया
  alternative: आराधना की
  rationale: संदर्भ में आराधना निहित है, पर हिब्रू क्रिया श्रद्धापूर्वक झुकने की शारीरिक क्रिया भी व्यक्त करती है। मुख्य पाठ में क्रिया को बनाए रखकर वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। छोटे समन्वित वाक्यों से हिब्रू क्रियाक्रम की गति बनी रहती है। ‘तेल लगाया’ सामान्य शारीरिक क्रिया को स्पष्ट करता है, जबकि ‘दण्डवत किया’ मूल की अर्थगत व्यापकता सुरक्षित रखता है।
