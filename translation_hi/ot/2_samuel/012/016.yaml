  text: וַ/יְבַקֵּ֥שׁ דָּוִ֛ד אֶת הָ/אֱלֹהִ֖ים בְּעַ֣ד הַ/נָּ֑עַר וַ/יָּ֤צָם דָּוִד֙ צ֔וֹם וּ/בָ֥א וְ/לָ֖ן וְ/שָׁכַ֥ב אָֽרְצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/016.yaml
  text: And David sought God on behalf of the boy[b][a]. David fasted a fast, and he went in and spent the night and lay on the ground.
translation:
  language: hi
  text: तब दाऊद ने उस बालक[a] के लिए परमेश्वर से विनती की। दाऊद ने उपवास रखा[b]; फिर वह भीतर गया, रात बिताई और भूमि पर लेटा रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘बालक’ दाऊद के उस पुत्र को सूचित करता है जो बीमार था (पद 15, 18)। इसका अनुवाद ‘बच्चा’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में बल देने के लिए एक ही मूल की क्रिया और संज्ञा साथ प्रयुक्त हैं; इसका शाब्दिक रूप ‘उपवास किया, उपवास’ जैसा है।
    reason: source_form
lexical_decisions:
- source_word: וַיְבַקֵּשׁ ... אֶת הָאֱלֹהִים
  choice: परमेश्वर से विनती की
  rationale: בקש का मूल भाव ‘खोजना/चाहना’ है, पर इस प्रसंग में परमेश्वर की ओर बालक के लिए आग्रहपूर्वक मुड़ना अभिप्रेत है। हिन्दी में ‘परमेश्वर को खोजा’ यहाँ भ्रामक और अस्वाभाविक होगा; ‘विनती की’ प्रार्थनापूर्ण आग्रह को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּעַד הַנָּעַר
  choice: उस बालक के लिए
  rationale: בְּעַד यहाँ दूसरे के हित में की गई विनती का भाव देता है। הַנַּעַר संदर्भ में दाऊद के बीमार पुत्र को सूचित करता है; ‘बालक’ आधुनिक हिन्दी में सम्मानपूर्ण और प्रसंगानुकूल है।
- source_word: וַיָּצָם דָּוִד צוֹם
  choice: दाऊद ने उपवास रखा
  rationale: हिब्रू में एक ही मूल के क्रिया और संज्ञा का प्रयोग बल देने के लिए हुआ है। उसका शब्दशः अनुकरण हिन्दी में अस्वाभाविक होता, इसलिए सहज वाक्य मुख्य पाठ में रखा गया और बलयुक्त रचना को पादटिप्पणी में बताया गया है।
- source_word: וּבָא
  choice: फिर वह भीतर गया
  rationale: בוא यहाँ किसी स्थान के भीतर जाने को दर्शाता है। ‘भीतर गया’ दिशा को बनाए रखता है, जबकि ‘फिर’ हिन्दी कथानुक्रम को स्पष्ट करता है।
- source_word: וְלָן
  choice: रात वहीं बिताई
  rationale: לון का अर्थ रात बिताना या रात भर ठहरना है। ‘वहीं’ प्रसंगगत स्थान-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, बिना किसी विशिष्ट कमरे या भवन को मान लेने के।
- source_word: וְשָׁכַב אָרְצָה
  choice: भूमि पर लेटा रहा
  rationale: שכב और אָרְצָה मिलकर भूमि पर लेटने की मुद्रा बताते हैं। ‘भूमि’ मूल के ‘धरती/ज़मीन’ भाव को बनाए रखता है; ‘फर्श’ कहना उस अंदरूनी सतह को निश्चित कर देता जिसे हिब्रू निर्दिष्ट नहीं करता।
