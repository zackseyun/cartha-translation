source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בְּ/עוֹד֙ הַ/יֶּ֣לֶד חַ֔י צַ֖מְתִּי וָֽ/אֶבְכֶּ֑ה כִּ֤י אָמַ֨רְתִּי֙ מִ֣י יוֹדֵ֔עַ יחנ/ני יְהוָ֖ה וְ/חַ֥י הַ/יָּֽלֶד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/022.yaml
  text: He said[a], “While the child was still alive, I fasted and wept, because I said, ‘Who knows? Yahweh may be gracious to me, and the child may live.’”
translation:
  language: hi
  text: उसने कहा, “जब बच्चा अभी जीवित था, तब मैंने उपवास किया और रोया, क्योंकि मैंने कहा, ‘कौन जानता है?[क] शायद याहवे मुझ पर अनुग्रह करे और बच्चा जीवित रहे।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “कौन कह सकता है? याहवे मुझ पर कृपा करे, और बच्चा जीवित रहे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹד הַיֶּלֶד חַי
  choice: जब तक बच्चा जीवित था
  rationale: בְּעוֹד जारी अवस्था को समय-संबंधी ढंग से व्यक्त करता है। ‘जब तक ... जीवित था’ स्वाभाविक हिन्दी में बच्चे के उस समय तक जीवित रहने की अवस्था को स्पष्ट करता है।
- source_word: צַמְתִּי
  choice: मैंने उपवास किया
  rationale: צום का सीधा अर्थ उपवास करना है; किसी विस्तार की आवश्यकता नहीं।
- source_word: וָאֶבְכֶּה
  choice: और रोया
  rationale: בכה रोने या विलाप करने को दर्शाता है। ‘रोया’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: כִּי אָמַרְתִּי
  choice: क्योंकि मैंने सोचा
  rationale: כִּי कारण बताता है और אָמַרְתִּי यहाँ मन में कही गई बात को सूचित करता है; हिन्दी में ‘मैंने सोचा’ इस आत्मसंवाद को सहजता से व्यक्त करता है।
- source_word: מִי יוֹדֵעַ
  choice: कौन जानता है?
  rationale: यह मुहावरा अनिश्चितता और आशा दोनों व्यक्त करता है; इसका सीधा हिन्दी रूप स्वाभाविक है।
- source_word: יְחָנֵּנִי
  choice: शायद ... मुझ पर अनुग्रह करे
  rationale: חנן कृपा या अनुग्रह दिखाने का भाव रखता है। ‘मुझ पर अनुग्रह करे’ व्यक्तिगत कर्म और अपात्र कृपा की बारीकी बनाए रखता है; ‘शायद’ מִי יוֹדֵעַ से उत्पन्न अनिश्चितता को हिन्दी में स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में प्रचलित, पहचाने जाने योग्य रूप ‘यहोवा’ व्यक्तिगत दिव्य नाम को किसी उपाधि से बदले बिना प्रस्तुत करता है।
- source_word: וְחַי הַיָּלֶד
  choice: और बच्चा जीवित रहे
  rationale: इस संदर्भ में यह दाऊद की आशा का संभावित परिणाम है, निश्चित भविष्यवाणी नहीं। ‘जीवित रहे’ उस संभाव्यता और कामना को बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम है। हिन्दी के सामान्य पाठकों के लिए स्थापित रूप ‘यहोवा’ नाम को सुरक्षित रखते हुए सहज पहचान देता है।
- issue: परमेश्वर की प्रतिक्रिया के विषय में दाऊद की आशा
  choice: शायद यहोवा मुझ पर अनुग्रह करे और बच्चा जीवित रहे
  alternative: यहोवा मुझ पर अनुग्रह करेगा और बच्चा जीवित रहेगा
  rationale: מִי יוֹדֵעַ अनिश्चितता प्रकट करता है। इसलिए हिन्दी पाठ आशा व्यक्त करता है, न कि निश्चित दावा; इस प्रकार मूल का धर्मवैज्ञानिक तनाव बना रहता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और मौखिक कथन के लिए स्वाभाविक रखी गई है। छोटे, स्पष्ट वाक्यांश दाऊद के स्पष्टीकरण और उसकी अनिश्चित आशा को सहज रूप से व्यक्त करते हैं।
