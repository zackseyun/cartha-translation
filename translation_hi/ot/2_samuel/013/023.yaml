  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘ऊन कतरनेवाले काम कर रहे थे’ से मूल के बहुवचन कर्ता सुरक्षित रहते हैं, जबकि हिंदी में दृश्य स्पष्ट होता है। ‘बुलाया’ को ‘निमंत्रित किया’ पर वरीयता दी गई है ताकि मूल क्रिया की संभावित व्यापकता बनी रहे।
