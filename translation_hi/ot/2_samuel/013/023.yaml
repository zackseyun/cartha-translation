base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/023.yaml
  text: It happened after two full years that Absalom had sheep shearers at Baal-hazor[a], which is near Ephraim, and Absalom invited all the king’s sons.
translation:
  language: hi
  text: दो पूरे वर्ष[a] बीतने के बाद ऐसा हुआ कि बाल-हासोर में, जो एप्रैम के पास है, अबशालोम के यहाँ भेड़ों के ऊन कतरनेवाले थे। तब अबशालोम ने राजा के सभी पुत्रों को बुलाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘दो वर्ष दिन’; यह पूरे दो वर्ष की अवधि बताने वाला मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁנָתַיִם יָמִים
  choice: पूरे दो वर्ष बीतने पर
  rationale: शाब्दिक रूप से ‘दो वर्ष दिन’ पूर्ण दो-वर्षीय अवधि बताने वाला इब्रानी मुहावरा है। हिंदी में यह रूप अवधि की पूर्णता और उसके बीतने—दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: גֹזְזִים
  choice: भेड़ों का ऊन कतरनेवाले
  rationale: यह גזז धातु का बहुवचन कृदंत है और प्रसंग में भेड़ों का ऊन कतरनेवाले श्रमिकों को दर्शाता है; निहित कर्म ‘भेड़ों का ऊन’ स्पष्ट करने से आधुनिक हिंदी पाठक अर्थ तुरंत समझता है।
- source_word: בְּבַעַל חָצוֹר
  choice: बाल-हासोर में
  rationale: स्थान-नाम को अनूदित न करके देवनागरी में लिप्यंतरित किया गया है; ‘में’ ऊन कतरने के कार्य का स्थान स्वाभाविक रूप से बताता है।
- source_word: אֲשֶׁר עִם אֶפְרָיִם
  choice: जो एप्रैम के पास है
  rationale: यहाँ עִם भौगोलिक निकटता या संबद्धता व्यक्त करता है। ‘के पास’ संभावित भौगोलिक अर्थ को सहज हिंदी में देता है।
- source_word: וַיִּקְרָא
  choice: बुलाया
  rationale: मूल क्रिया का सामान्य अर्थ ‘बुलाना’ है। प्रसंग में यह निमंत्रण का कार्य कर सकती है, पर ‘बुलाया’ मूल की व्यापकता बनाए रखता है और अर्थ को अनावश्यक रूप से केवल औपचारिक निमंत्रण तक सीमित नहीं करता।
- source_word: לְכָל בְּנֵי הַמֶּלֶךְ
  choice: राजा के सभी पुत्रों को
  rationale: यह संबंधवाचक रचना का सीधा, स्पष्ट और स्वाभाविक आधुनिक हिंदी रूप है।
- source_word: וַיְהִי
  choice: ऐसा हुआ
  rationale: यह सामान्य इब्रानी कथात्मक संक्रमण है। ‘ऐसा हुआ’ कथा की अगली घटना आरंभ करता है, जबकि स्रोत में न होने वाला ‘अब’ नहीं जोड़ता।
