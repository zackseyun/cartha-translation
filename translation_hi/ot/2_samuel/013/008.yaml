  text: וַ/תֵּ֣לֶךְ תָּמָ֗ר בֵּ֛ית אַמְנ֥וֹן אָחִ֖י/הָ וְ/ה֣וּא שֹׁכֵ֑ב וַ/תִּקַּ֨ח אֶת הַ/בָּצֵ֤ק ו/תלוש וַ/תְּלַבֵּ֣ב לְ/עֵינָ֔י/ו וַ/תְּבַשֵּׁ֖ל אֶת הַ/לְּבִבֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/008.yaml
  text: So Tamar went to the house of her brother Amnon[a], while he was lying down. She took the dough, kneaded it, shaped it into cakes in his sight[b], and cooked the cakes.
translation:
  language: hi
  text: तब तामार अपने भाई अम्नोन के घर गई। वह लेटा हुआ था। तामार ने आटा लिया, उसे गूँधा, अम्नोन की आँखों के सामने उसकी टिकियाँ[a] बनाईं और फिर उन्हें पकाया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दिल के आकार की टिकियाँ।” यहाँ प्रयुक्त इब्रानी क्रिया और संज्ञा दुर्लभ हैं और संभवतः “हृदय” के लिए प्रयुक्त शब्द से जुड़े आकार की ओर संकेत करती हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “टिकियों को उबालकर पकाया।” इब्रानी क्रिया विशेष रूप से उबालने के अर्थ में आ सकती है, हालाँकि यहाँ इसका अर्थ सामान्य रूप से पकाना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ
  choice: तब ... गई
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ क्रम और पिछले निर्देश के बाद की कार्रवाई दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בֵּית אַמְנוֹן אָחִיהָ
  choice: अपने भाई अम्नोन के घर
  rationale: गंतव्य और 3 स्त्रीलिंग एकवचन संबंधसूचक प्रत्यय को सहज तथा स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: וְהוּא שֹׁכֵב
  choice: वह लेटा हुआ था
  rationale: यह परिस्थितिसूचक उपवाक्य अम्नोन की अवस्था बताता है; ‘लेटा हुआ’ इब्रानी के निकट है और ‘बिस्तर पर’ जैसी अतिरिक्त धारणा नहीं जोड़ता।
- source_word: הַבָּצֵק
  choice: आटा
  rationale: भोजन बनाने के इस प्रसंग में हिन्दी में ‘आटा’ गूँधे जाने वाले dough के लिए स्वाभाविक शब्द है।
- source_word: וְתָלֹשׁ
  choice: उसे गूँधा
  rationale: לוש आटा गूँधने की क्रिया का सामान्य शब्द है; सर्वनाम हिन्दी वाक्य में कर्म को स्पष्ट करता है।
- source_word: וַתְּלַבֵּב ... הַלְּבִבוֹת
  choice: उसकी टिकियाँ बनाईं ... उन्हें
  rationale: दुर्लभ क्रिया और संज्ञा आटे से अलग-अलग खाद्य वस्तुएँ बनाने की ओर संकेत करती हैं। ‘टिकियाँ’ आकार दिए गए आटे की वस्तुओं के लिए सहज हिन्दी है, जबकि संभावित हृदयाकार अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לְעֵינָיו
  choice: उसकी आँखों के सामने
  rationale: इब्रानी मुहावरे का अर्थ है कि काम उसकी दृष्टि में हुआ; यह हिन्दी में स्पष्ट और स्रोत के बिंब के निकट है।
- source_word: וַתְּבַשֵּׁל
  choice: पकाया
  rationale: בשׁל सामान्यतः पकाने और कई प्रसंगों में विशेषतः उबालने को दर्शा सकता है। मुख्य पाठ में ‘पकाया’ अनिश्चित विधि को खुला रखता है।
