    issue: Ambiguous antecedent in ‘उसकी आँखों के सामने’.
    rationale: The Hebrew suffix in לְעֵינָיו refers to Amnon. In Hindi, the nearest prior antecedent is ‘आटा’, so explicitly saying ‘अम्नोन की आँखों के सामने’ makes the reference unambiguous without adding meaning.
  - severity: low
    issue: Footnote b’s alternative wording is grammatically incomplete in context.
    rationale: ‘या, “उबाला”’ does not specify what was boiled. ‘टिकियों को उबालकर पकाया’ clearly expresses the lexical alternative for וַתְּבַשֵּׁל.
