base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/030.yaml
  text: While they were on the way[a], the report came to David, saying, “Absalom has struck down all the king’s sons, and not one of them is left.”
translation:
  language: hi
  text: 'जब वे मार्ग में थे, तब दाऊद तक यह खबर[a] पहुँची: “अबशालोम ने राजा के सभी पुत्रों को मार डाला है; उनमें से एक भी जीवित नहीं बचा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रिपोर्ट”; इब्रानी शब्द का अर्थ अपुष्ट खबर या अफ़वाह भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֵמָּה בַדֶּרֶךְ
  choice: जब वे मार्ग में ही थे
  rationale: इब्रानी कथात्मक सूत्र और परिस्थितिसूचक वाक्यांश का स्वाभाविक हिन्दी रूप; ‘ही’ उस समय उनके मार्ग में होने पर बल देता है।
- source_word: הַשְּׁמֻעָה
  choice: यह खबर
  rationale: शब्द का अर्थ खबर, सूचना या अफ़वाह हो सकता है। प्रसंग में सूचना बाद में गलत सिद्ध होती है, इसलिए मुख्य पाठ में स्वाभाविक ‘खबर’ और पादटिप्पणी में उसकी अपुष्ट प्रकृति रखी गई है।
- source_word: בָאָה אֶל דָּוִד
  choice: दाऊद तक ... पहुँची
  rationale: ‘दाऊद के पास आई’ की अपेक्षा आधुनिक हिन्दी में अधिक स्वाभाविक, और सूचना के उस तक पहुँचने का अर्थ सुरक्षित रखता है।
- source_word: לֵאמֹר
  choice: 'पहुँची:'
  rationale: हिन्दी में उद्धरण से पहले विराम-चिह्न प्रत्यक्ष वचन के परिचय को स्वाभाविक ढंग से व्यक्त करता है; अलग से ‘यह कहते हुए’ अनावश्यक होता।
- source_word: הִכָּה
  choice: मार डाला है
  rationale: נכה का मूल अर्थ प्रहार करना है, पर यहाँ कथित परिणाम मृत्यु है। ‘मार डाला’ साधारण हिन्दी में घातक हिंसा स्पष्ट करता है।
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: राजा के सभी पुत्रों
  rationale: सीधा, लिंग-विशिष्ट और प्रसंगानुकूल अनुवाद।
- source_word: וְלֹא נוֹתַר מֵהֶם אֶחָד
  choice: उनमें से एक भी जीवित नहीं बचा
  rationale: יתר के ‘शेष रहना/बचना’ अर्थ को व्यक्त करता है। ‘जीवित’ कथित हत्याओं के प्रसंग में निहित अर्थ स्पष्ट करता है और हिन्दी में स्वाभाविक है।
