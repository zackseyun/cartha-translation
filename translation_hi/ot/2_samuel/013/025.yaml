  yaml_path: translation/ot/2_samuel/013/025.yaml
  text: But the king said to Absalom, “No, my son, please let us not all go, lest we be a burden on you.” And he pressed him, but he was not willing to go; so he blessed him.
translation:
  language: hi
  text: परन्तु राजा ने अबशालोम से कहा, “नहीं, मेरे बेटे, कृपया हम सब न जाएँ, कहीं हम तुम्हारे लिए बोझ न बन जाएँ।” अबशालोम ने उससे आग्रह किया, फिर भी राजा जाने को तैयार नहीं हुआ; तब राजा ने उसे आशीर्वाद दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל נָא נֵלֵךְ כֻּלָּנוּ
  choice: हम सब न चलें
  rationale: निषेधात्मक आग्रह को स्वाभाविक आधुनिक हिन्दी में रखा गया है; נָא की विनम्रता प्रसंग और संबोधन से व्यक्त होती है।
- source_word: וְלֹא נִכְבַּד עָלֶיךָ
  choice: कहीं ऐसा न हो कि हम तुम पर बोझ बन जाएँ
  rationale: כבד के निफ़अल रूप का यहाँ अर्थ मेज़बान पर भारी या बोझ होना है।
- source_word: וַיִּפְרָץ בּוֹ
  choice: अबशालोम उससे बहुत आग्रह करता रहा
  rationale: मुहावरा लगातार और ज़ोर देकर आग्रह करने का भाव देता है; कर्ता अबशालोम को हिन्दी में अस्पष्टता से बचाने के लिए स्पष्ट किया गया है।
- source_word: וְלֹא אָבָה לָלֶכֶת
  choice: राजा जाने को तैयार नहीं हुआ
  rationale: אבה इच्छा या सहमति न देने को व्यक्त करता है; प्रसंग से राजा कर्ता है।
- source_word: וַיְבָרֲכֵהוּ
  choice: लेकिन उसने उसे आशीर्वाद दिया
  rationale: ברך का सामान्य अर्थ ‘आशीर्वाद देना’ सुरक्षित रखा गया है; विरोधात्मक संबंध हिन्दी में ‘लेकिन’ से स्पष्ट होता है।
