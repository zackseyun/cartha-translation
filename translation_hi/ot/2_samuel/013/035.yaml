  text: וַ/יֹּ֤אמֶר יֽוֹנָדָב֙ אֶל הַ/מֶּ֔לֶךְ הִנֵּ֥ה בְנֵֽי הַ/מֶּ֖לֶךְ בָּ֑אוּ כִּ/דְבַ֥ר עַבְדְּ/ךָ֖ כֵּ֥ן הָיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/035.yaml
  text: Then Jonadab said to the king[a], “Look, the king’s sons have come; as your servant said, so it has happened.”
translation:
  language: hi
  text: तब योनादाब ने राजा से कहा, “देखिए, राजा के पुत्र आ गए हैं। जैसा आपके दास ने कहा था, वैसा ही हुआ है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब … ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ घटनाक्रम की क्रमिकता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יֽוֹנָדָב
  choice: योनादाब
  rationale: व्यक्तिवाचक नाम का मानक हिन्दी लिप्यंतरण।
- source_word: אֶל הַמֶּלֶךְ
  choice: राजा से
  rationale: यह मानव राजा दाऊद को सूचित करता है; हिन्दी में ‘कहा’ के साथ ‘से’ स्वाभाविक है।
- source_word: הִנֵּה
  choice: देखिए
  rationale: यह ध्यान आकर्षित करने वाला निदर्शक अव्यय है। राजदरबार के संबोधन में आदरसूचक ‘देखिए’ तात्कालिकता और सामाजिक स्तर दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְנֵי הַמֶּלֶךְ
  choice: राजा के पुत्र
  rationale: समास-श्रृंखला का सीधा और स्वाभाविक अनुवाद; बहुवचन प्रसंग में महत्त्वपूर्ण है।
- source_word: בָּאוּ
  choice: आ गए हैं
  rationale: पूर्ण क्रिया उपस्थित दृश्य में उनके पहुँच चुकने की पुष्टि करती है; हिन्दी पूर्ण वर्तमान इस तात्कालिक पुष्टि को स्पष्ट करता है।
- source_word: כִּדְבַר עַבְדְּךָ
  choice: जैसा आपके दास ने कहा था
  rationale: דבר यहाँ कही हुई बात को सूचित करता है। ‘आपके दास’ योनादाब का दरबारी आत्म-संदर्भ सुरक्षित रखता है।
- source_word: כֵּן הָיָה
  choice: वैसा ही हुआ है
  rationale: यह योनादाब की पिछली बात के ठीक सिद्ध होने की पुष्टि करता है और Hebrew ‘जैसा…वैसा’ संबंध को बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘देखिए’ तथा ‘आपके दास’ से राजदरबार का आदरसूचक स्तर सुरक्षित रहता है, जबकि वाक्य-संरचना सामान्य हिन्दी पाठक के लिए स्पष्ट है।
