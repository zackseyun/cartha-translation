  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “इसे” और “इसके” अम्नोन के तिरस्कारपूर्ण व्यवहार को बिना अतिरिक्त व्याख्यात्मक संज्ञा जोड़े व्यक्त करते हैं; “द्वार” कथात्मक-बाइबलीय गरिमा बनाए रखता है।
