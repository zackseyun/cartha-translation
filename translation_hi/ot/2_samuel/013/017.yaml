  text: וַ/יִּקְרָ֗א אֶֽת נַעֲר/וֹ֙ מְשָׁ֣רְת֔/וֹ וַ/יֹּ֕אמֶר שִׁלְחוּ נָ֥א אֶת זֹ֛את מֵ/עָלַ֖/י הַ/ח֑וּצָ/ה וּ/נְעֹ֥ל הַ/דֶּ֖לֶת אַחֲרֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/017.yaml
  text: Then he called his young man who served him and said[a], “Please send this one away from me, outside[b], and bolt the door behind her.”
translation:
  language: hi
  text: तब उसने अपने जवान सेवक को बुलाकर कहा, “कृपया इसे[a] मेरे पास से बाहर भेज दो और उसके पीछे दरवाज़े की चिटकनी लगा दो[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में स्त्रीलिंग “यह” है, जो यहाँ तामार के प्रति जानबूझकर दूरी और तिरस्कार का भाव प्रकट करता है।
    reason: lexical_alternative
  - marker: b
    text: या “दरवाज़े पर ताला लगा दो।” इब्रानी क्रिया का अर्थ चिटकनी, अर्गला या ताला लगाकर बंद करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרוֹ מְשָׁרְתוֹ
  choice: अपनी सेवा करनेवाले जवान
  rationale: נַעַר यहाँ जवान पुरुष अथवा सेवक को सूचित करता है, और מְשָׁרְתוֹ उसके सेवा करने के कार्य को स्पष्ट करता है। यह अनुवाद दोनों तत्वों को बनाए रखता है।
- source_word: שִׁלְחוּ נָא
  choice: निकाल दो
  rationale: שׁלח का यहाँ अर्थ किसी को अपने पास से बाहर भेज देना है। हिन्दी में “निकाल दो” आदेश की तीव्रता और प्रसंगानुकूल निष्कासन को स्वाभाविक ढंग से व्यक्त करता है; נָא से जुड़ी विनती अथवा आग्रह की छाया इस कठोर प्रसंग में अलग शब्द जोड़ने पर भ्रामक रूप से विनम्र लग सकती है।
- source_word: זֹאת
  choice: इसे
  rationale: स्त्रीलिंग संकेतवाचक זֹאת तामार की ओर दूरी और तिरस्कार के साथ संकेत करता है। “इसे” बिना कोई संज्ञा जोड़े हिन्दी में उसी उपेक्षापूर्ण संकेत को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵעָלַי הַחוּצָה
  choice: मेरे पास से बाहर
  rationale: מֵעָלַי का शाब्दिक भाव “मेरे ऊपर से” है, पर यहाँ आशय अपने निकट अथवा उपस्थिति से हटाना है; הַחוּצָה बाहर की दिशा बताता है।
- source_word: וּנְעֹל הַדֶּלֶת
  choice: द्वार की चिटकनी लगा दो
  rationale: נעל का अर्थ द्वार को अर्गला, चिटकनी या ताला लगाकर सुरक्षित बंद करना हो सकता है। प्राचीन द्वार के प्रसंग में “चिटकनी लगा दो” ठोस और सहज है।
- source_word: אַחֲרֶיהָ
  choice: इसके पीछे
  rationale: द्वार बंद करने के प्रसंग में “उसके बाद” की अपेक्षा “इसके पीछे” स्थानगत और स्वाभाविक अर्थ देता है।
