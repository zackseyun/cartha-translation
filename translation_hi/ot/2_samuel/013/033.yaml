translation_notes:
  register: आधुनिक मानक हिंदी; राजकीय संबोधन में गरिमा रखी गई है और वाक्य को सामान्य पाठक के लिए सहज बनाया गया है। ‘मन’ मुख्य पाठ में स्वाभाविक हिंदी देता है, जबकि पादटिप्पणी मूल के ‘हृदय’ वाले मुहावरे को दर्शाती है।
