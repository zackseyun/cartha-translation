  text: וְ/עַתָּ֡ה אַל יָשֵׂם֩ אֲדֹנִ֨/י הַ/מֶּ֤לֶךְ אֶל לִבּ/וֹ֙ דָּבָ֣ר לֵ/אמֹ֔ר כָּל בְּנֵ֥י הַ/מֶּ֖לֶךְ מֵ֑תוּ כִּֽי אִם אַמְנ֥וֹן לְ/בַדּ֖/וֹ מֵֽת־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/033.yaml
  text: Now let not my lord the king take this matter to heart[a], saying, ‘All the king’s sons are dead,’ for Amnon alone is dead.
translation:
  language: hi
  text: अब मेरे प्रभु राजा इस बात को मन में न रखें[a] कि ‘राजा के सभी पुत्र मर गए हैं,’ क्योंकि केवल अम्नोन ही मरा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक अर्थ: “इस बात को अपने हृदय पर न रखें।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब
  rationale: यह योनादाब की सुधारात्मक बात आरम्भ करने वाला प्रसंग-सूचक है; ‘अब’ स्वाभाविक और संक्षिप्त है।
- source_word: אַל יָשֵׂם ... אֶל לִבּוֹ
  choice: मन में न रखें
  rationale: इब्रानी मुहावरे में किसी बात को हृदय पर रखने का भाव है। हिंदी में ‘मन में रखना’ अर्थ को सहज रूप से व्यक्त करता है, जबकि पादटिप्पणी शाब्दिक चित्र को सुरक्षित रखती है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: मेरे प्रभु राजा
  rationale: राजदरबार में प्रयुक्त आदरसूचक संबोधन को औपचारिक और बोधगम्य हिंदी में बनाए रखता है।
- source_word: דָּבָר
  choice: इस बात
  rationale: संदर्भ में यह राजपुत्रों की मृत्यु के समाचार की ओर संकेत करता है; ‘बात’ पर्याप्त व्यापक और स्वाभाविक है।
- source_word: לֵאמֹר
  choice: कि
  rationale: यह आगे आने वाली धारणा अथवा कथन की विषयवस्तु प्रस्तुत करता है; हिंदी में ‘कि’ अधिक स्वाभाविक है।
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: राजा के सभी पुत्र
  rationale: मूल के संबंध-वाचक पदबंध और पुरुष-संतानों के स्पष्ट उल्लेख को सीधे बनाए रखता है।
- source_word: מֵתוּ
  choice: मर गए हैं
  rationale: प्रत्यक्ष कथन में माने जा रहे परिणाम की वर्तमान स्थिति को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: כִּי אִם
  choice: क्योंकि केवल
  rationale: 'यह पहले कथन का सुधार और अपवाद प्रकट करता है: सब नहीं, केवल अम्नोन। ‘क्योंकि’ पूर्ववर्ती निषेध का आधार भी बताता है।'
- source_word: לְבַדּוֹ
  choice: केवल ... ही
  rationale: अम्नोन तक सीमित होने के जोर को हिंदी की स्वाभाविक ‘केवल ... ही’ रचना से व्यक्त करता है।
- source_word: מֵת
  choice: मरा है
  rationale: अम्नोन की मृत्यु से उत्पन्न वर्तमान स्थिति को पूर्ववर्ती बहुवचन कथन के समान ढंग से रखता है।
