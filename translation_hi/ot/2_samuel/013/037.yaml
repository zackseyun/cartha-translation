  text: וְ/אַבְשָׁל֣וֹם בָּרַ֔ח וַ/יֵּ֛לֶךְ אֶל תַּלְמַ֥י בֶּן עמיחור מֶ֣לֶךְ גְּשׁ֑וּר וַ/יִּתְאַבֵּ֥ל עַל בְּנ֖/וֹ כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/037.yaml
  text: But Absalom fled and went to Talmai son of Ammihur[a], king of Geshur. And he mourned for his son all the days.
translation:
  language: hi
  text: परन्तु अबशालोम भागकर अम्मीहूर के पुत्र, गशूर के राजा तल्मै के पास चला गया। और दाऊद[a] अपने पुत्र के लिए हर दिन शोक करता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “शोक करता रहा” का कर्ता स्पष्ट रूप से नहीं दिया गया है; प्रसंग से इसे दाऊद समझा जाता है।
    reason: निहित कर्ता और उसकी प्रसंगगत पहचान को स्पष्ट करना।
lexical_decisions:
- source_word: וְ/אַבְשָׁל֣וֹם בָּרַ֔ח
  choice: परन्तु अबशालोम भागकर
  rationale: संयोजक וְ को प्रसंग के विरोधात्मक मोड़ के कारण ‘परन्तु’ किया गया है; בָּרַח का सीधा और स्वाभाविक अर्थ ‘भागना’ है।
- source_word: וַ/יֵּ֛לֶךְ אֶל תַּלְמַ֥י
  choice: तल्मै के पास चला गया
  rationale: הלך אל को आधुनिक हिन्दी में व्यक्ति के गंतव्य के लिए स्वाभाविक रूप से ‘के पास चला गया’ कहा गया है।
- source_word: בֶּן עמיחור מֶ֣לֶךְ גְּשׁ֑וּר
  choice: गशूर के राजा अम्मीहूर के पुत्र
  rationale: इब्रानी संबंध-रचना को स्पष्ट हिन्दी क्रम में रखा गया है और व्यक्तिनामों का देवनागरी लिप्यंतरण किया गया है।
- source_word: וַ/יִּתְאַבֵּ֥ל
  choice: और दाऊद[a] ... शोक करता रहा
  rationale: Hitpael क्रिया शोक मनाने को व्यक्त करती है। इब्रानी में कर्ता निहित है; हिन्दी में वाक्य की स्पष्टता के लिए प्रसंगानुसार ‘दाऊद’ रखा गया और पाठगत निहितता फुटनोट में बताई गई है।
- source_word: עַל בְּנ֖/וֹ
  choice: अपने पुत्र के लिए
  rationale: शोक के साथ עַל का स्वाभाविक हिन्दी रूप ‘के लिए’ है; एकवचन ‘पुत्र’ मूल पाठ के अनुरूप है और प्रसंग में अम्मोन की ओर संकेत करता है।
- source_word: כָּל הַ/יָּמִֽים
  choice: हर दिन ... करता रहा
  rationale: शाब्दिक ‘सारे दिन’ की अपेक्षा यह आधुनिक हिन्दी में निरंतर/दिन-प्रतिदिन शोक का स्वाभाविक और अर्थसंगत रूप है।
theological_decisions:
- issue: וַיִּתְאַבֵּל का निहित कर्ता
  choice: मुख्य पाठ में ‘दाऊद’ और फुटनोट चिह्न
  alternative: केवल ‘वह’
  rationale: इब्रानी क्रिया का कर्ता व्यक्त नहीं है, पर निकट व्यापक प्रसंग दाऊद की ओर संकेत करता है। हिन्दी में अस्पष्ट सर्वनाम भ्रामक हो सकता है, इसलिए दाऊद को स्पष्ट करते हुए मूल की निहितता फुटनोट में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक और सामान्य पाठक के लिए सहज शैली। ‘परन्तु’, ‘शोक करता रहा’ और हिन्दी-सुलभ नाम-क्रम के द्वारा औपचारिकता तथा स्वाभाविकता का संतुलन रखा गया है।
