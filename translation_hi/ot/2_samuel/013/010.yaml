translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘भीतर का कमरा’ एकांत आंतरिक कक्ष का भाव देता है; पुनरावृत्ति बनाए रखी गई है। अंतिम क्रिया को हिन्दी में स्वाभाविक गति-अभिव्यक्ति ‘पास गई’ से प्रस्तुत किया गया है, जबकि कमरे के भीतर प्रवेश स्पष्ट रखा गया है।
