  yaml_path: translation/ot/2_samuel/013/010.yaml
  text: Then Amnon said to Tamar[a], “Bring the food into the inner room, so that I may eat from your hand.” So Tamar took the cakes she had made and brought them into the inner room to Amnon her brother.
translation:
  language: hi
  text: तब अम्नोन ने तामार से कहा, “भोजन भीतर के कमरे में ले आओ, ताकि मैं तुम्हारे हाथ से खाऊँ।” तब तामार अपनी बनाई हुई टिकियाँ लेकर भीतर के कमरे में अपने भाई अम्नोन के पास गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבִיאִי
  choice: ले आओ
  rationale: हिफ़ील स्त्रीलिंग एकवचन आज्ञार्थक यहाँ तामार को भोजन अम्नोन के पास लाने का निर्देश देता है; ‘ले आओ’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הַבִּרְיָה
  choice: भोजन
  rationale: यह तैयार खाने को दर्शाता है; ‘भोजन’ पर्याप्त व्यापक है और आगे आने वाले विशेष खाद्य-पदार्थ לְבִבוֹת से इसे अलग रखता है।
- source_word: הַחֶדֶר / הֶחָדְרָה
  choice: भीतर के कमरे में
  rationale: חֶדֶר घर के अंदर स्थित कक्ष को दर्शाता है और दिशासूचक प्रत्यय दूसरे प्रयोग में उसके भीतर जाने का भाव देता है। दोनों स्थानों पर एक समान अनुवाद एकांत स्थान पर कथात्मक बल बनाए रखता है।
- source_word: וְאֶבְרֶה
  choice: ताकि मैं ... खाऊँ
  rationale: ברה का अर्थ यहाँ खाना है; आज्ञा के बाद प्रयुक्त इच्छार्थक रूप को उद्देश्यसूचक हिन्दी वाक्यांश स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִיָּדֵךְ
  choice: तुम्हारे हाथ से
  rationale: इब्रानी के एकवचन मुहावरे को निकटता से रखते हुए यह अम्नोन के आग्रह की जानबूझकर माँगी गई निजी निकटता भी सुरक्षित रखता है।
- source_word: הַלְּבִבוֹת
  choice: टिकियाँ
  rationale: यह पिछले प्रसंग में तामार द्वारा तैयार किए गए विशेष आकार के खाद्य-पदार्थों के लिए है; ‘टिकियाँ’ आधुनिक हिन्दी में आकार और खाद्य-वस्तु दोनों का स्वाभाविक संकेत देता है, बिना उनकी ठीक विधि को अनावश्यक रूप से निश्चित किए।
- source_word: אָחִיהָ
  choice: अपने भाई
  rationale: सम्बन्धवाचक पद को स्पष्ट रखना इस कथा के नैतिक और पारिवारिक तनाव के लिए आवश्यक है।
