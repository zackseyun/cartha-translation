source:
  edition: WLC
  text: וַ/אֲנִ֗י אָ֤נָה אוֹלִיךְ֙ אֶת חֶרְפָּתִ֔/י וְ/אַתָּ֗ה תִּהְיֶ֛ה כְּ/אַחַ֥ד הַ/נְּבָלִ֖ים בְּ/יִשְׂרָאֵ֑ל וְ/עַתָּה֙ דַּבֶּר נָ֣א אֶל הַ/מֶּ֔לֶךְ כִּ֛י לֹ֥א יִמְנָעֵ֖/נִי מִמֶּֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/013.yaml
  text: As for me[a], where could I carry my disgrace? And you—you would be like one of the fools in Israel. So now, please speak to the king[c][b], for he will not withhold me from you.
translation:
  language: hi
  text: और मैं अपनी बदनामी लेकर कहाँ जाऊँगी? और तुम—इस्राएल के नीच लोगों में से एक हो जाओगे।[a] इसलिए अब कृपया राजा से बात करो,[b] क्योंकि वह मुझे तुमसे नहीं रोकेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “मूर्खों में से एक”; यहाँ प्रयुक्त इब्रानी शब्द नैतिक रूप से निर्लज्ज, नीच या निंदनीय व्यक्ति का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात, “वह मुझे तुम्हें देने से इनकार नहीं करेगा।” तामार सचमुच राजा की अनुमति की आशा कर रही थी या अम्नोन को रोकने के लिए समय पाने का प्रयास कर रही थी—पद इसे स्पष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: אָנָה אוֹלִיךְ אֶת־חֶרְפָּתִי
  choice: मैं अपनी बदनामी लेकर कहाँ जाऊँगी?
  rationale: प्रश्नवाचक क्रियाविशेषण और गति-सूचक हिफ़ील क्रिया के रूपक को बनाए रखते हुए חֶרְפָּה के सार्वजनिक अपमान और सामाजिक बदनामी के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כְּאַחַד הַנְּבָלִים
  choice: नीच लोगों में से एक जैसे
  rationale: נָבָל यहाँ केवल बौद्धिक मूर्खता नहीं, बल्कि नैतिक नीचता, निर्लज्जता और निंदनीय आचरण का बोध कराता है। 'नीच लोग' इस नैतिक निंदा को आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: דַּבֶּר־נָא
  choice: अब राजा से बात करो
  rationale: आज्ञार्थक क्रिया के साथ विनय-सूचक נָא है। प्रसंग में तामार की आग्रहपूर्ण अपील को सहज हिन्दी में व्यक्त किया गया है; 'अब' וְעַתָּה को दर्शाता है।
- source_word: לֹא יִמְנָעֵנִי מִמֶּךָּ
  choice: वह मुझे तुमसे नहीं रोकेगा
  rationale: מנע का मूल भाव रोकना या अलग रखना है। यह अनुवाद इब्रानी वाक्य-विन्यास और उसके विवाह-संबंधी निहितार्थ दोनों को बिना अत्यधिक व्याख्या के सुरक्षित रखता है।
theological_decisions:
- issue: राजा से तामार की अपील का आशय
  choice: तामार के कथन को सीधे इस रूप में प्रस्तुत किया गया है कि राजा उसे अम्नोन से नहीं रोकेगा।
  alternative: वह सचमुच विवाह की अनुमति मिलने की आशा कर रही थी, अथवा हमले को टालने के लिए रणनीतिक रूप से ऐसा कह रही थी।
  rationale: पद स्वयं यह स्पष्ट नहीं करता कि प्रस्ताव कानूनी या व्यावहारिक रूप से संभव था, या केवल समय पाने का प्रयास था। इसलिए मुख्य पाठ और टिप्पणी इस तनाव को अनिर्णीत रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गंभीर और कथात्मक शैली रखी गई है। गति के रूपक ('बदनामी लेकर कहाँ जाऊँगी') को सुरक्षित रखा गया है और नैतिक अर्थ वाले נְבָלִים को केवल बौद्धिक 'मूर्खता' तक सीमित नहीं किया गया।
