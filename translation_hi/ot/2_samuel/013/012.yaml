  text: उसने उससे कहा, “नहीं, मेरे भाई! मेरा बलात्कार मत कर[a], क्योंकि इस्राएल में ऐसा नहीं किया जाता। यह घोर निंदनीय काम मत कर[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा उल्लंघन मत कर” अथवा “मुझे अपमानित मत कर।” इब्रानी क्रिया यौन हिंसा के साथ अपमान और लज्जित करने का भाव भी रखती है।
    reason: lexical_alternative
  - marker: b
    text: या “यह जघन्य काम मत कर।” इब्रानी शब्द केवल मूर्खता नहीं, बल्कि नैतिक रूप से घोर लज्जाजनक और निंदनीय कृत्य को दर्शाता है।
    reason: lexical_alternative
