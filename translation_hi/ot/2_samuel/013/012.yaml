- source_word: כִּי לֹא יֵעָשֶׂה כֵן בְּיִשְׂרָאֵל
  choice: क्योंकि इस्राएल में ऐसा नहीं किया जाता
  rationale: निफ़अल की अवैयक्तिक रचना को बनाए रखते हुए इस्राएल के सामुदायिक नैतिक मानदंड की अपील व्यक्त होती है।
- source_word: הַנְּבָלָה הַזֹּאת
  choice: यह घोर निंदनीय काम
  rationale: נְבָלָה सामान्य मूर्खता नहीं, बल्कि सामाजिक और नैतिक व्यवस्था का उल्लंघन करने वाला लज्जाजनक, जघन्य कृत्य है; ‘घोर निंदनीय काम’ आधुनिक हिन्दी में इसकी गंभीरता स्पष्ट करता है।
