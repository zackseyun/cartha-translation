  text: But she said to him[a], “No, because this great wrong of sending me away is greater than the other that you did to me.” But he would not listen to her.
translation:
  language: hi
  text: पर उसने उससे कहा[a], “नहीं! क्योंकि मुझे निकाल देने का यह बड़ा अन्याय उस दूसरे अन्याय से भी बड़ा है जो तुमने मेरे साथ किया है।” पर उसने उसकी बात सुननी नहीं चाही।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “नहीं/मत करो, क्योंकि मुझे निकाल देने का यह बड़ा अन्याय उस दूसरे अन्याय से भी बड़ा है जो तुमने मेरे साथ किया है।” इब्रानी वाक्य अत्यंत संक्षिप्त और व्याकरण की दृष्टि से कठिन है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: नहीं!
  rationale: यह शब्द सामान्यतः निषेध व्यक्त करता है, पर यहाँ संक्षिप्त और कठिन वाक्य में तामार की तीखी आपत्ति है; स्वाभाविक हिन्दी में ‘नहीं!’ उस बल को व्यक्त करता है।
- source_word: אוֹדֹת
  choice: क्योंकि
  rationale: यह आगे कही गई आपत्ति का आधार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: यह बड़ी बुराई
  rationale: רָעָה यहाँ नैतिक बुराई और किए गए घोर अन्याय दोनों का भाव रखता है। ‘बुराई’ तुलनात्मक कथन की नैतिक तीव्रता बनाए रखती है।
- source_word: מֵאַחֶרֶת אֲשֶׁר עָשִׂיתָ עִמִּי
  choice: उस दूसरी बुराई से भी बड़ी है जो तुमने मेरे साथ की है
  rationale: स्त्रीलिंग ‘दूसरी’ का संकेत पहले की רָעָה की ओर है; हिन्दी में संज्ञा को दोहराने से तुलना स्पष्ट होती है, बिना पूर्व कृत्य को पाठ से अधिक विशिष्ट किए।
- source_word: לְשַׁלְּחֵנִי
  choice: मुझे निकाल देना
  rationale: संदर्भ में क्रिया का अर्थ उसे अपने पास से बाहर भेजना है। ‘निकाल देना’ अस्वीकृति और जबरन विदा किए जाने का भाव स्वाभाविक हिन्दी में देता है।
- source_word: וְלֹא אָבָה לִשְׁמֹעַ לָהּ
  choice: पर उसने उसकी बात सुननी नहीं चाही
  rationale: אָבָה इच्छा या अनिच्छा को व्यक्त करता है; यह अनुवाद केवल न सुनने के बजाय उसके जानबूझकर इनकार को सुरक्षित रखता है।
- source_word: לּוֹ
  choice: उससे
  rationale: ‘उससे कहा’ आधुनिक हिन्दी में अप्रत्यक्ष कर्म का स्वाभाविक रूप है।
