base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/036.yaml
  text: And as soon as he finished speaking[a], behold, the king’s sons came, and they raised their voices and wept. The king also, and all his servants, wept with very great weeping.
translation:
  language: hi
  text: जब वह अपनी बात कह चुका था, तभी देखो, राजा के पुत्र आ गए। उन्होंने ऊँचे स्वर में विलाप किया और रोए। राजा और उसके सभी सेवक भी फूट-फूटकर रोए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “बहुत बड़े रोने के साथ रोए”—यह अत्यन्त गहरे शोक को व्यक्त करने वाली बलाघातपूर्ण अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ לְדַבֵּר
  choice: जब वह अपनी बात पूरी कर चुका, तभी
  rationale: इब्रानी कथात्मक सूत्र और कालवाचक उपवाक्य को स्वाभाविक हिन्दी में व्यक्त करते हुए घटनाओं का तत्काल क्रम सुरक्षित रखा गया है।
- source_word: וְהִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला कथात्मक संकेत है; ‘देखो’ आगमन की आकस्मिकता और दृश्य की जीवंतता बनाए रखता है।
- source_word: בְנֵי הַמֶּלֶךְ
  choice: राजा के पुत्र
  rationale: सम्बन्धवाचक रचना का सीधा, गरिमापूर्ण और स्वाभाविक हिन्दी रूप।
- source_word: בָּאוּ
  choice: आ गए
  rationale: ‘आ गए’ आगमन और घटनास्थल पर पहुँचने के पूर्ण भाव को सामान्य हिन्दी में व्यक्त करता है।
- source_word: וַיִּשְׂאוּ קוֹלָם
  choice: उन्होंने ऊँचे स्वर से विलाप किया
  rationale: शाब्दिक अर्थ ‘अपनी आवाज़ उठाई’ है, पर शोक के प्रसंग में यह मुहावरा ऊँचे स्वर के विलाप को दर्शाता है।
- source_word: וַיִּבְכּוּ
  choice: और रोने लगे
  rationale: यह वास्तविक रोने को व्यक्त करता है और पूर्ववर्ती ऊँचे स्वर के विलाप से स्वाभाविक रूप से जुड़ता है।
- source_word: וְגַם
  choice: भी
  rationale: राजपुत्रों के साथ राजा और उसके सेवकों के शोक में सम्मिलित होने का योगात्मक भाव सुरक्षित है।
- source_word: וְכָל עֲבָדָיו
  choice: और उसके सभी सेवक
  rationale: עֲבָדָיו दरबारी सेवकों अथवा परिचारकों को सूचित कर सकता है; ‘सेवक’ व्यापक अर्थ को बिना अनावश्यक पद-निर्धारण के बनाए रखता है।
- source_word: בָּכוּ בְּכִי גָּדוֹל מְאֹד
  choice: फूट-फूटकर रोए
  rationale: इब्रानी सजातीय कर्म और ‘बहुत बड़ा’ की तीव्रता को स्वाभाविक आधुनिक हिन्दी में प्रबल शोक के रूप में व्यक्त किया गया है; शाब्दिक बनावट पादटिप्पणी में दी गई है।
