  yaml_path: translation/ot/2_samuel/013/002.yaml
  text: Amnon was so distressed that he made himself sick because of Tamar his sister[a], for she was a virgin[b], and it seemed impossible in Amnon’s eyes to do anything to her.
translation:
  language: hi
  text: अपनी बहन तामार के कारण अम्नोन इतना व्याकुल था कि वह बीमार पड़ गया[a]। तामार कुँवारी थी, इसलिए अम्नोन को उसके साथ कुछ भी कर पाना असंभव-सा लगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी बहन तामार के कारण अम्नोन इतना व्याकुल था कि उसने अपने को बीमार कर लिया।” इब्रानी अभिव्यक्ति का अर्थ या तो स्वयं को बीमार कर लेना या व्याकुलता के कारण बीमार पड़ जाना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “असंभव-सा लगा” का अर्थ है कि अम्नोन को उसके साथ कुछ करने का कोई संभव उपाय दिखाई नहीं देता था।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֶר
  choice: इतना व्याकुल था
  rationale: यह क्रिया यहाँ अम्नोन की तीव्र मानसिक व्यथा और भीतर के दबाव को व्यक्त करती है; ‘व्याकुल’ आधुनिक हिंदी में स्वाभाविक और गरिमापूर्ण है।
- source_word: לְהִתְחַלּוֹת
  choice: कि वह बीमार पड़ गया
  rationale: हित्पएल रूप का अर्थ ‘बीमार पड़ना’ या ‘अपने को बीमार कर लेना’ दोनों हो सकता है। मुख्य पाठ में सहज परिणामसूचक अर्थ रखा गया है और वैकल्पिक आत्मवाचक अर्थ पादटिप्पणी में दिया गया है।
- source_word: בַּעֲבוּר
  choice: के कारण
  rationale: इस प्रसंग में यह संबंध कारण बताता है, लाभ या उद्देश्य नहीं।
- source_word: אֲחֹתוֹ
  choice: अपनी बहन
  rationale: रिश्ते को स्पष्ट रखना कथा के नैतिक तनाव के लिए आवश्यक है।
- source_word: בְתוּלָה
  choice: कुँवारी
  rationale: यह इब्रानी शब्द के कौमार्य-संबंधी अर्थ को सीधे और सामान्य आधुनिक हिंदी में व्यक्त करता है।
- source_word: וַיִּפָּלֵא בְּעֵינֵי אַמְנוֹן
  choice: अम्नोन को ... असंभव-सा लगा
  rationale: इब्रानी मुहावरा अम्नोन की दृष्टि में किसी उपाय का अत्यंत कठिन या पहुँच से बाहर होना बताता है। ‘असंभव-सा’ दृष्टिकोणगत भाव को बनाए रखता है, बिना पूर्ण वस्तुगत असंभवता घोषित किए।
- source_word: לַעֲשׂוֹת לָהּ מְאוּמָה
  choice: उसके साथ कुछ भी करना
  rationale: מְאוּמָה का अर्थ ‘कुछ भी’ है। प्रसंग में ‘के साथ’ हिंदी में स्वाभाविक है और आगे होने वाले अपराध को समय से पहले अधिक विशिष्ट नहीं बनाता।
