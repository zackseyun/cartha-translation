  text: וּ/לְ/אַמְנ֣וֹן רֵ֗עַ וּ/שְׁמ/וֹ֙ יֽוֹנָדָ֔ב בֶּן שִׁמְעָ֖ה אֲחִ֣י דָוִ֑ד וְ/י֣וֹנָדָ֔ב אִ֥ישׁ חָכָ֖ם מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/003.yaml
  text: Amnon had a friend[a], whose name was Jonadab son of Shimeah, David’s brother; and Jonadab was a very shrewd man.
translation:
  language: hi
  text: अम्नोन का एक मित्र था, जिसका नाम योनादाब था। वह दाऊद के भाई शिमा का पुत्र था। योनादाब बहुत चतुर व्यक्ति था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहुत बुद्धिमान व्यक्ति” अथवा “बहुत चालाक व्यक्ति।” इब्रानी शब्द व्यापक अर्थ में बुद्धि या कुशलता बता सकता है; यहाँ “चतुर” इसलिए रखा गया है कि आगे योनादाब की सूझ नैतिक रूप से संदिग्ध सलाह में दिखाई देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵעַ
  choice: मित्र
  rationale: यह संज्ञा मित्र, साथी या निकट सहयोगी को सूचित कर सकती है। इस संबंधपरक कथानक में ‘मित्र’ स्वाभाविक और सटीक है।
- source_word: וּלְאַמְנוֹן
  choice: अम्नोन का ... था
  rationale: इब्रानी में ‘अम्नोन के लिए/पास’ वाला स्वामित्व-सूचक प्रयोग है; हिन्दी में इसे स्वाभाविक रूप से ‘अम्नोन का एक मित्र था’ कहा गया है। आरम्भिक ו को अलग से ‘और’ बनाना आवश्यक नहीं।
- source_word: וּשְׁמוֹ יוֹנָדָב
  choice: जिसका नाम योनादाब था
  rationale: इब्रानी नामकरण-वाक्य को प्रवाहपूर्ण आधुनिक हिन्दी में संबंधवाचक उपवाक्य के रूप में व्यक्त किया गया है।
- source_word: בֶּן שִׁמְעָה אֲחִי דָוִד
  choice: वह दाऊद के भाई शिमा का पुत्र था
  rationale: रचना स्पष्ट करती है कि शिमा दाऊद का भाई था और योनादाब शिमा का पुत्र। अलग वाक्य हिन्दी में संबंध की अस्पष्टता से बचाता है।
- source_word: אִישׁ חָכָם מְאֹד
  choice: बहुत चतुर व्यक्ति
  rationale: חָכָם का मूल अर्थ व्यापक रूप से बुद्धिमान/कुशल है, पर आगामी प्रसंग में उसकी सूझ नैतिक रूप से संदिग्ध सलाह में प्रकट होती है। ‘चतुर’ बौद्धिक क्षमता रखता है, पर अनिवार्य नैतिक प्रशंसा नहीं जोड़ता।
theological_decisions:
- issue: योनादाब की חָכָם विशेषता का नैतिक मूल्यांकन
  choice: बहुत चतुर व्यक्ति
  alternative: बहुत बुद्धिमान व्यक्ति / बहुत चालाक व्यक्ति
  rationale: ‘बुद्धिमान’ अनावश्यक सकारात्मक नैतिक अनुमोदन दे सकता है, जबकि ‘चालाक’ मूल शब्द की अपेक्षा पहले ही नकारात्मक निर्णय सुना सकता है। ‘चतुर’ कथानक की नैतिक तनातनी बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। वंश-संबंध स्पष्ट करने के लिए दीर्घ इब्रानी वाक्य को छोटे वाक्यों में बाँटा गया है। व्यक्तिनामों के प्रचलित हिन्दी बाइबलीय रूप—अम्नोन, योनादाब, शिमा और दाऊद—प्रयुक्त हैं।
