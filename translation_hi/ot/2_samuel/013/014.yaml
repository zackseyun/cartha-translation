reference: 2 Samuel 13:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לֹ֥א אָבָ֖ה לִ/שְׁמֹ֣עַ בְּ/קוֹלָ֑/הּ וַ/יֶּחֱזַ֤ק מִמֶּ֨/נָּה֙ וַ/יְעַנֶּ֔/הָ וַ/יִּשְׁכַּ֖ב אֹתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/014.yaml
  text: But he would not listen to her[a], and he was stronger than she was[c][b], and he violated her and lay with her.
translation:
  language: hi
  text: लेकिन उसने उसकी बात मानने से इनकार कर दिया[a]। वह उससे अधिक बलवान था[b]; उसने उसका बलात्कार किया[c] और उसके साथ संभोग किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “उसकी आवाज़ सुनने को तैयार नहीं हुआ।”
    reason: lexical_alternative
  - marker: b
    text: या, “उसने बल के द्वारा उस पर काबू पा लिया।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी क्रिया का अर्थ “अपमानित किया” या “दुर्दशा में डाला” भी हो सकता है; यहाँ इसका आशय यौन हिंसा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: इनकार कर दिया
  rationale: नकार के साथ यह क्रिया इच्छा या सहमति न होने को व्यक्त करती है। यहाँ यह जानबूझकर उसकी विनती न मानने का भाव देती है।
- source_word: לִשְׁמֹעַ בְּקוֹלָהּ
  choice: उसकी बात मानने
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘उसकी आवाज़ सुनना’ है, पर संदर्भ में आशय उसकी विनती पर ध्यान देकर उसे मानना है।
- source_word: וַיֶּחֱזַק מִמֶּנָּה
  choice: वह उससे अधिक बलवान था
  rationale: חזק के साथ מן शक्ति में प्रबल होने या बल के द्वारा किसी पर हावी होने का भाव देता है। इस अनुवाद में मूल का तुलनात्मक रूप और घटनाओं का क्रम दोनों बने रहते हैं।
- source_word: וַיְעַנֶּהָ
  choice: उसने उसका बलात्कार किया
  rationale: ענה का व्यापक अर्थ दबाना, अपमानित करना या दुर्दशा में डालना हो सकता है; इस स्पष्ट यौन-हिंसा के संदर्भ में यह जबरन यौन उल्लंघन को दर्शाता है। आधुनिक हिन्दी में ‘बलात्कार किया’ घटना को बिना नरम किए स्पष्ट करता है।
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: उसके साथ संभोग किया
  rationale: यह इब्रानी प्रयोग यौन-संबंध को व्यक्त करता है। ‘संभोग किया’ इस हिंसक संदर्भ में ‘उसके साथ सोया’ की अपेक्षा अधिक स्पष्ट है और सहमति का भ्रामक संकेत नहीं देता।
theological_decisions:
- issue: यौन हिंसा की स्पष्टता और ענה की शब्दार्थगत व्यापकता
  choice: मुख्य पाठ में ‘बलात्कार किया’
  alternative: ‘उसका अपमान किया’ या ‘उसके साथ ज़बरदस्ती की’
  rationale: संदर्भ में असहमति, शारीरिक प्रभुत्व और उसके बाद संभोग स्पष्ट हैं। इसलिए मुख्य पाठ में हिंसा को अस्पष्ट नहीं किया गया, जबकि पादटिप्पणी में क्रिया की व्यापक शब्दार्थ-सीमा सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और स्पष्ट रखी गई है। यौन हिंसा को शिष्टोक्ति से ढका नहीं गया, पर वर्णन को अनावश्यक रूप से चित्रात्मक भी नहीं बनाया गया। वाक्य-विन्यास मूल इब्रानी के क्रम—इनकार, शारीरिक प्रभुत्व, उल्लंघन और संभोग—को बनाए रखता है।
