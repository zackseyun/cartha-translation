source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֞וּ נַעֲרֵ֤י אַבְשָׁלוֹם֙ לְ/אַמְנ֔וֹן כַּ/אֲשֶׁ֥ר צִוָּ֖ה אַבְשָׁל֑וֹם וַ/יָּקֻ֣מוּ כָּל בְּנֵ֣י הַ/מֶּ֗לֶךְ וַֽ/יִּרְכְּב֛וּ אִ֥ישׁ עַל פִּרְדּ֖/וֹ וַ/יָּנֻֽסוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/029.yaml
  text: So Absalom’s young men did to Amnon as Absalom had commanded[a]. Then all the king’s sons arose[b], and each mounted his mule and fled.
translation:
  language: hi
  text: तब अबशालोम के जवानों[a] ने अम्नोन के साथ वैसा ही किया, जैसा अबशालोम ने आज्ञा दी थी[b]। तब राजा के सभी पुत्र उठ खड़े हुए; हर एक अपने खच्चर पर सवार हुआ और वे भाग गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ “जवान,” “सेवक” या “परिचारक” हो सकता है। यहाँ वे अबशालोम की आज्ञा पूरी करने वाले उसके आदमी हैं।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से, “अम्नोन के साथ वैसा ही किया, जैसा अबशालोम ने आज्ञा दी थी।” पिछले पद में आज्ञा स्पष्ट है: जब अम्नोन का मन दाखमधु से प्रसन्न हो, तब उसे मार डालना।'
    reason: cross_reference
lexical_decisions:
- source_word: נַעֲרֵי אַבְשָׁלוֹם
  choice: अबशालोम के जवानों
  rationale: נַעַר का अर्थ प्रसंग के अनुसार जवान, सेवक या परिचारक हो सकता है। ‘जवानों’ मूल शब्द की आयु-संबंधी छाया बनाए रखता है, जबकि पाद-टिप्पणी सेवा-संबंधी अर्थ की संभावना बताती है।
- source_word: וַיַּעֲשׂוּ לְאַמְנוֹן
  choice: अम्नोन के साथ वैसा ही किया
  rationale: यह मूल की संक्षिप्त अभिव्यक्ति को बनाए रखता है और हिंसक कार्रवाई का विवरण पिछले पद से ग्रहण करने देता है, उसे इस पद में अनावश्यक रूप से नहीं जोड़ता।
- source_word: כַּאֲשֶׁר צִוָּה
  choice: जैसा ... ने आज्ञा दी थी
  rationale: यह अबशालोम की पहले दी गई आज्ञा के ठीक अनुरूप किए गए कार्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיָּקֻמוּ
  choice: उठ खड़े हुए
  rationale: यह अचानक हुई प्रतिक्रिया को स्पष्ट और स्वाभाविक कथात्मक हिन्दी में व्यक्त करता है।
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: राजा के सभी पुत्र
  rationale: यह इब्रानी संबंधवाचक रचना का सीधा और प्रसंगानुकूल अनुवाद है।
- source_word: וַיִּרְכְּבוּ אִישׁ עַל פִּרְדּוֹ
  choice: हर एक अपने खच्चर पर सवार हुआ
  rationale: אִישׁ यहाँ वितरणार्थक ‘हर एक’ है और פֶּרֶד का विशिष्ट अर्थ ‘खच्चर’ है।
- source_word: וַיָּנֻסוּ
  choice: वे भाग गए
  rationale: נוּס संकट से तत्काल भाग निकलने को दर्शाता है; ‘भाग गए’ आधुनिक हिन्दी में स्पष्ट और सहज है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली रखी गई है। मूल की संक्षिप्तता और क्रियाओं की तीव्र क्रमबद्धता सुरक्षित है। ‘जवानों’ की अर्थगत व्यापकता पाद-टिप्पणी में स्पष्ट की गई है।
