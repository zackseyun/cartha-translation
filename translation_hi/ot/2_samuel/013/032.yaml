base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/032.yaml
  text: Then Jonadab son of Shimeah[a], David’s brother, answered and said, “Let not my lord say, ‘They have killed all the young men, the king’s sons,’ for Amnon alone is dead[b]. For this had been determined by Absalom from the day he violated Tamar his sister.”
translation:
  language: hi
  text: तब दाऊद के भाई शिमा के पुत्र योनादाब ने उत्तर दिया, “मेरे प्रभु यह न कहें, ‘उन्होंने सब युवकों—राजा के पुत्रों—को मार डाला है।’ केवल अम्नोन ही मरा है, क्योंकि जिस दिन उसने अपनी बहन तामार का बलात्कार किया था, उसी दिन से अबशालोम के कहने पर[a] यह बात ठान ली गई थी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अबशालोम के कहने पर” का अर्थ “अबशालोम के आदेश पर” या “अबशालोम के ठहरे हुए इरादे के अनुसार” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ने उत्तर दिया
  rationale: हिब्रू कथात्मक युग्म का स्वाभाविक और गरिमापूर्ण हिन्दी रूप; अलग से ‘और कहा’ जोड़ना हिन्दी में अनावश्यक पुनरुक्ति होता।
- source_word: אֲחִי דָוִד
  choice: दाऊद के भाई
  rationale: यह पदबंध शिमा की पहचान दाऊद के भाई के रूप में करता है; हिन्दी संबंध-रचना स्पष्ट है।
- source_word: אַל יֹאמַר אֲדֹנִי
  choice: मेरे प्रभु यह न कहें
  rationale: निषेधात्मक भाव और दरबारी आदर दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: הַנְּעָרִים בְּנֵי הַמֶּלֶךְ
  choice: सब जवानों—राजा के पुत्रों—को
  rationale: נְעָרִים के लिए ‘जवान’ और व्याख्यात्मक समानाधिकरण के रूप में ‘राजा के पुत्र’ मूल संरचना को स्पष्ट रखते हैं।
- source_word: הֵמִיתוּ
  choice: उन्होंने ... मार डाला है
  rationale: हिफ़ील रूप का कारणात्मक अर्थ ‘मार डालना’ है और बहुवचन क्रिया अनिर्दिष्ट हमलावरों को दर्शाती है।
- source_word: אַמְנוֹן לְבַדּוֹ מֵת
  choice: केवल अम्नोन ही मरा है
  rationale: לְבַדּוֹ की विशिष्टता को ‘केवल ... ही’ स्पष्ट रूप से व्यक्त करता है।
- source_word: עַל פִּי אַבְשָׁלוֹם ... הָיְתָה שׂוּמָה
  choice: अबशालोम के कहने पर यह बात ठान ली गई थी
  rationale: עַל־פִּי का ‘कहने/वचन पर’ भाव और שׂוּמָה का स्थापित अथवा निश्चित कर लिया गया संकल्प—दोनों सुरक्षित रहते हैं; कर्ता की अस्पष्टता भी निष्क्रिय रचना में बनी रहती है।
- source_word: מִיּוֹם עַנֹּתוֹ
  choice: जिस दिन उसने ... का बलात्कार किया था, उसी दिन से
  rationale: इस प्रसंग में פיעל ענה यौन हिंसा को सूचित करता है; ‘बलात्कार’ घटना को बिना शिष्टोक्ति से ढके सटीक और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֲחֹתוֹ
  choice: अपनी बहन
  rationale: कर्ता अम्नोन की ओर लौटने वाला स्वाभाविक हिन्दी संबंधसूचक रूप; तामार अम्नोन और अबशालोम दोनों की बहन थी।
theological_decisions:
- issue: अबशालोम की भूमिका और योजना का निर्धारण
  choice: अबशालोम के कहने पर यह बात ठान ली गई थी
  alternative: अबशालोम ने यह निश्चय कर लिया था
  rationale: मूल עַל־פִּי और निष्क्रिय/resultative הָיְתָה שׂוּמָה को सीधे सक्रिय मानसिक संकल्प में बदलना अर्थ को अनावश्यक रूप से निश्चित कर देता; चुना हुआ रूप आदेश, वचन या ठहरे हुए इरादे की संभावित छायाओं को बनाए रखता है।
- issue: ענה की यौन-अपराध संबंधी तीव्रता
  choice: बलात्कार किया
  alternative: अपमानित किया / दुष्कर्म किया
  rationale: निकटवर्ती कथा-संदर्भ में यह बलपूर्वक यौन संबंध है; स्पष्ट शब्द पीड़िता के साथ हुई हिंसा को अस्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, कथात्मक और दरबारी गरिमा के साथ। ‘मेरे प्रभु’ आदरसूचक संबोधन रखता है; ‘बलात्कार’ प्रसंग की यौन हिंसा को स्पष्ट करता है। मुख्य पाठ का [a] चिह्न उसी अस्पष्ट हिब्रू मुहावरे पर लगाया गया है जिसकी वैकल्पिक व्याख्याएँ पादटिप्पणी में दी गई हैं।
