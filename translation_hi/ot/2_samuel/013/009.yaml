base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/009.yaml
  text: Then she took the pan and poured them out before him[a], but he refused to eat. And Amnon said[b], “Send everyone out from me.” So everyone went out from him.
translation:
  language: hi
  text: तब उसने परोसने का बरतन लिया और पकवान उसके सामने उँडेल दिए[a], पर उसने खाने से इनकार कर दिया। तब अम्नोन ने कहा, “सब लोगों को मेरे पास से बाहर भेज दो।” और सब लोग उसके पास से चले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके सामने परोस दिए”; इब्रानी क्रिया का शाब्दिक अर्थ “उँडेलना” है, और यहाँ इसका प्रयोग भोजन परोसने के संदर्भ में हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂרֵת
  choice: परोसने का बरतन
  rationale: यह शब्द यहाँ उस बरतन को सूचित करता है जिससे तामार तैयार पकवान अम्नोन के सामने परोसती है। 'परोसने का बरतन' संदर्भ को स्पष्ट रखता है और किसी अनिश्चित आकार के बरतन को अनावश्यक रूप से 'कड़ाही' या 'थाली' नहीं बनाता।
- source_word: וַתִּצֹק לְפָנָיו
  choice: उसके सामने उँडेल दिए
  rationale: יצק का मूल अर्थ 'उँडेलना' है। हिंदी में यह ठोस पकवान को बरतन से निकालकर सामने रखने की ठोस क्रिया को स्वाभाविक ढंग से व्यक्त करता है; बहुवचन 'पकवान' पिछले संदर्भ से ग्रहण किया गया है।
- source_word: וַיְמָאֵן לֶאֱכֹל
  choice: उसने खाने से इनकार कर दिया
  rationale: מָאֵן जानबूझकर मना करने या इनकार करने को व्यक्त करता है, केवल इच्छा न होने को नहीं।
- source_word: הוֹצִיאוּ
  choice: बाहर भेज दो
  rationale: יצא का हिफ़ील आज्ञार्थक रूप किसी को बाहर जाने के लिए बाध्य करने की क्रिया बताता है। सेवकों को दिए आदेश में 'बाहर भेज दो' स्वाभाविक और कारणवाचक है।
- source_word: כָל אִישׁ
  choice: सब लोगों को
  rationale: शाब्दिक रूप 'हर पुरुष' है, किंतु इस प्रसंग में यह उपस्थित सभी व्यक्तियों के लिए सामूहिक अभिव्यक्ति है। 'सब लोगों को' आधुनिक हिंदी में अपेक्षित व्यापकता स्पष्ट करता है।
- source_word: מֵעָלַי / מֵעָלָיו
  choice: मेरे पास से / उसके पास से
  rationale: यह इब्रानी मुहावरा किसी की उपस्थिति या निकटता से दूर जाने को दर्शाता है। हिंदी में 'पास से' आदेश और उसके पूरा होने के बीच का समानांतर भाव बनाए रखता है।
