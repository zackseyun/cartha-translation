id: 2SA.13.28
reference: 2 Samuel 13:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְצַו֩ אַבְשָׁל֨וֹם אֶת נְעָרָ֜י/ו לֵ/אמֹ֗ר רְא֣וּ נָ֠א כְּ/ט֨וֹב לֵב אַמְנ֤וֹן בַּ/יַּ֨יִן֙ וְ/אָמַרְתִּ֣י אֲלֵי/כֶ֔ם הַכּ֧וּ אֶת אַמְנ֛וֹן וַ/הֲמִתֶּ֥ם אֹת֖/וֹ אַל תִּירָ֑אוּ הֲ/ל֗וֹא כִּ֤י אָֽנֹכִי֙ צִוִּ֣יתִי אֶתְ/כֶ֔ם חִזְק֖וּ וִ/הְי֥וּ לִ/בְנֵי חָֽיִל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/028.yaml
  text: 'Then Absalom commanded his young men[a], saying, “Please watch: when Amnon’s heart is merry with wine, and I say to you, ‘Strike Amnon,’ then kill him. Do not fear. Have I not myself commanded you? Be strong, and be men of valor.”'
translation:
  language: hi
  text: तब अबशालोम ने अपने जवानों[a] को आज्ञा दी, “ध्यान रखना, जब दाखमधु पीकर अम्नोन का मन प्रसन्न हो जाए और मैं तुमसे कहूँ, ‘अम्नोन को मारो,’ तब उसे जान से मार डालना। डरना मत। क्या मैंने स्वयं तुम्हें आज्ञा नहीं दी है? दृढ़ रहो और वीर पुरुष बनो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने सेवकों” अथवा “अपने अनुचरों।”
    reason: נְעָרָיו प्रसंग के अनुसार जवानों, सेवकों या निजी अनुचरों को सूचित कर सकता है।
lexical_decisions:
- source_word: נְעָרָיו
  choice: अपने जवानों
  rationale: נַעַר युवक, सेवक, परिचारक या निजी अनुचर का अर्थ दे सकता है। यहाँ हिंसक आदेश पूरा करने वाले अबशालोम के निजी जन अभिप्रेत हैं; ‘जवानों’ मूल के आयु और पुरुषवाचक भाव को बनाए रखता है।
- source_word: רְאוּ נָא
  choice: ध्यान रखना
  rationale: ראה का आज्ञार्थ और נָא यहाँ चौकस होकर संकेत की प्रतीक्षा करने का निर्देश देते हैं। ‘ध्यान रखना’ स्वाभाविक आधुनिक हिन्दी में आदेश का बल व्यक्त करता है।
- source_word: כְּטוֹב לֵב אַמְנוֹן בַּיַּיִן
  choice: जब दाखमधु पीकर अम्नोन का मन प्रसन्न हो जाए
  rationale: शाब्दिक मुहावरा ‘मन दाखमधु से अच्छा होना’ प्रसन्न और मदिरा से ढीली हुई अवस्था बताता है, आवश्यक रूप से पूर्ण मतवालापन नहीं। यह रूप मन की प्रसन्नता और दाखमधु, दोनों को स्पष्ट रखता है।
- source_word: הַכּוּ אֶת אַמְנוֹן
  choice: अम्नोन को मारो
  rationale: נכה का अर्थ प्रहार करना या मारना है। हिन्दी ‘मारो’ संकेत-आज्ञा के रूप में स्वाभाविक है, जबकि अगला वाक्यांश परिणाम को स्पष्टतः प्राणघातक बताता है।
- source_word: וַהֲמִתֶּם אֹתוֹ
  choice: तब उसे जान से मार डालना
  rationale: מות का हिफ़ईल रूप ‘मृत्यु का कारण बनना, मार डालना’ है। ‘जान से मार डालना’ पहले ‘मारो’ से इसका स्पष्ट प्राणघातक अर्थ अलग करता है।
- source_word: אַל תִּירָאוּ
  choice: डरना मत
  rationale: सीधा निषेध है; यह आधुनिक हिन्दी में संक्षिप्त और बलपूर्ण है।
- source_word: הֲלוֹא כִּי אָנֹכִי צִוִּיתִי אֶתְכֶם
  choice: क्या मैंने स्वयं तुम्हें आज्ञा नहीं दी है?
  rationale: प्रश्न अलंकारिक है और אָנֹכִי के बल को ‘स्वयं’ व्यक्त करता है; अबशालोम अपने अधिकार और उत्तरदायित्व का हवाला देता है।
- source_word: חִזְקוּ
  choice: दृढ़ रहो
  rationale: חזק साहस, शक्ति और संकल्प के लिए प्रयुक्त होता है। इस हिंसक आदेश के प्रसंग में ‘दृढ़ रहो’ मानसिक संकल्प पर स्वाभाविक बल देता है।
- source_word: וִהְיוּ לִבְנֵי חָיִל
  choice: वीर पुरुष बनो
  rationale: בני חיל पुरुषवाचक, युद्ध-संबंधी मुहावरा है, जिसका आशय वीर और साहसी पुरुषों से है। ‘वीर पुरुष’ स्रोत के लिंग और प्रसंग दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: לִבְנֵי חָיִל में पुरुषवाचक अभिव्यक्ति
  choice: वीर पुरुष बनो
  alternative: वीर बनो / साहसी बनो
  rationale: आज्ञा पुरुष अनुचरों को दी गई है और इब्रानी मुहावरा स्पष्ट रूप से पुरुषवाचक है। लिंग-निरपेक्ष रूप स्रोत की सामाजिक और व्याकरणिक विशेषता को कम कर देता।
- issue: दाखमधु से अम्नोन की अवस्था
  choice: मन प्रसन्न हो जाए
  alternative: मतवाला हो जाए
  rationale: मूल मुहावरा प्रसन्न या मदिरा से खुली हुई मनःस्थिति बताता है, लेकिन अनिवार्यतः पूर्ण नशे की अवस्था नहीं; इसलिए ‘मतवाला’ अर्थ को आवश्यकता से अधिक निश्चित कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘दाखमधु’ बाइबलीय परिवेश के अनुरूप है; ‘ध्यान रखना’ और ‘जान से मार डालना’ साधारण पाठक के लिए आदेश का क्रम स्पष्ट करते हैं।
