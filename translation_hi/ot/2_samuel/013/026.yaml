  text: וַ/יֹּ֨אמֶר֙ אַבְשָׁל֔וֹם וָ/לֹ֕א יֵֽלֶךְ נָ֥א אִתָּ֖/נוּ אַמְנ֣וֹן אָחִ֑/י וַ/יֹּ֤אמֶר ל/וֹ֙ הַ/מֶּ֔לֶךְ לָ֥/מָּה יֵלֵ֖ךְ עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/026.yaml
  text: Then Absalom said[a], “If not, please let my brother Amnon go with us.” But the king said to him, “Why should he go with you?”
translation:
  language: hi
  text: तब अबशालोम ने कहा[a], “यदि नहीं, तो कृपया मेरे भाई अम्नोन को हमारे साथ जाने दीजिए।” पर राजा ने उससे कहा, “वह तुम्हारे साथ क्यों जाए?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक स्पष्ट रूप में, “यदि आप नहीं जाएँगे, तो कृपया मेरे भाई अम्नोन को हमारे साथ जाने दीजिए।” हिब्रू वाक्य संक्षिप्त और लुप्तपदीय है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा / पर ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है। पहले कथन में ‘तब’ और राजा की प्रत्युत्तरात्मक प्रतिक्रिया में ‘पर’ स्वाभाविक हिन्दी है।
- source_word: וָלֹא
  choice: यदि नहीं
  rationale: यह पिछले पद में राजा के इनकार के उत्तर में आया संक्षिप्त, लुप्तपदीय वाक्यांश है। ‘यदि नहीं’ उसकी संक्षिप्तता और संदर्भगत अर्थ दोनों बनाए रखता है।
- source_word: נָא
  choice: कृपया
  rationale: यह विनम्र अनुरोध सूचित करने वाला निपात है; ‘कृपया’ आधुनिक हिन्दी में स्वाभाविक और आदरपूर्ण है।
- source_word: יֵלֶךְ
  choice: जाने दीजिए / क्यों जाए
  rationale: अबशालोम के अनुरोध में जुस्सिव भाव को ‘जाने दीजिए’ व्यक्त करता है; राजा के आलंकारिक प्रश्न में अपूर्ण क्रिया का स्वाभाविक रूप ‘क्यों जाए’ है।
- source_word: אִתָּנוּ
  choice: हमारे साथ
  rationale: प्रथम पुरुष बहुवचन प्रत्यय सहित संगति-सूचक संबंधबोधक का सीधा और स्वाभाविक अनुवाद।
- source_word: אַמְנוֹן אָחִי
  choice: मेरे भाई अम्नोन
  rationale: हिब्रू में शाब्दिक क्रम ‘अम्नोन, मेरा भाई’ है, पर आधुनिक हिन्दी में ‘मेरे भाई अम्नोन’ अधिक स्वाभाविक है और अर्थ पूर्णतः सुरक्षित रहता है।
- source_word: לָמָה
  choice: क्यों
  rationale: सरल प्रश्नवाचक का सबसे स्वाभाविक हिन्दी समतुल्य।
- source_word: עִמָּךְ
  choice: तुम्हारे साथ
  rationale: द्वितीय पुरुष पुल्लिंग एकवचन प्रत्यय अबशालोम की ओर संकेत करता है; हिन्दी में ‘तुम्हारे साथ’ स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। राजा को संबोधित करते समय ‘दीजिए’ आदरसूचक है, जबकि राजा का अबशालोम से ‘तुम्हारे’ कहना संबंध और प्रसंग के अनुरूप है।
