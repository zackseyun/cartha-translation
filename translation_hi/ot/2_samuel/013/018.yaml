  text: וְ/עָלֶ֨י/הָ֙ כְּתֹ֣נֶת פַּסִּ֔ים כִּי֩ כֵ֨ן תִּלְבַּ֧שְׁןָ בְנוֹת הַ/מֶּ֛לֶךְ הַ/בְּתוּלֹ֖ת מְעִילִ֑ים וַ/יֹּצֵ֨א אוֹתָ֤/הּ מְשָֽׁרְת/וֹ֙ הַ/ח֔וּץ וְ/נָעַ֥ל הַ/דֶּ֖לֶת אַחֲרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/018.yaml
  text: She was wearing a richly ornamented robe[a], for this is how the virgin daughters of the king used to dress. Then his attendant put her outside and bolted the door behind her.
translation:
  language: hi
  text: उसने खूब सजा हुआ अंगरखा[a] पहन रखा था, क्योंकि राजा की कुँवारी बेटियाँ ऐसे ही वस्त्र पहना करती थीं। तब अम्नोन के सेवक ने उसे बाहर निकाल दिया और उसके पीछे द्वार की साँकल चढ़ा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कई रंगों का अंगरखा” अथवा “बाँहों वाला लंबा अंगरखा”; इस परिधान-संबंधी पद का सटीक अर्थ अनिश्चित है।
    reason: כְּתֹנֶת פַּסִּים के सटीक रूप या सजावट पर विद्वानों में मतभेद है, इसलिए वास्तविक शब्दार्थगत अनिश्चितता को सुरक्षित रखा गया है।
lexical_decisions:
- source_word: כְּתֹנֶת פַּסִּים
  choice: खूब सजा हुआ अंगरखा
  rationale: यह पदबंध किसी विशिष्ट और प्रतिष्ठित परिधान को दर्शाता है, पर פַּסִּים का ठीक अर्थ अनिश्चित है। मुख्य पाठ में स्वाभाविक हिन्दी के लिए ‘खूब सजा हुआ अंगरखा’ रखा गया है और अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: כִּי כֵן תִּלְבַּשְׁןָ ... מְעִילִים
  choice: क्योंकि ... ऐसे ही वस्त्र पहना करती थीं
  rationale: यह रचना प्रचलित रीति या आदतन किए जाने वाले काम को बताती है। ‘पहना करती थीं’ उस भाव को सहज आधुनिक हिन्दी में व्यक्त करता है और מְעִילִים के वस्त्र-संबंधी अर्थ को भी समेटता है।
- source_word: בְנוֹת הַמֶּלֶךְ הַבְּתוּלֹת
  choice: राजा की कुँवारी बेटियाँ
  rationale: हिब्रू पाठ राजकीय पहचान और कुँवारेपन—दोनों को स्पष्ट रूप से व्यक्त करता है; हिन्दी अनुवाद दोनों को बनाए रखता है।
- source_word: מְשָׁרְתוֹ
  choice: उसके सेवक
  rationale: कथा-संदर्भ में यह अम्नोन की व्यक्तिगत सेवा करने वाले व्यक्ति को दर्शाता है। ‘सेवक’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: וַיֹּצֵא אוֹתָהּ הַחוּץ
  choice: उसे बाहर निकाल दिया
  rationale: कारक रूप का सीधा अर्थ उसे बाहर कर देना है। ‘निकाल दिया’ प्रसंग की कठोरता व्यक्त करता है, बिना अनावश्यक बलप्रयोग जोड़ने के।
- source_word: וְנָעַל הַדֶּלֶת אַחֲרֶיהָ
  choice: उसके पीछे द्वार की साँकल चढ़ा दी
  rationale: נעל केवल द्वार बंद करने से अधिक, उसे ताला या साँकल लगाकर सुरक्षित बंद करने का भाव रखता है। यह हिन्दी अभिव्यक्ति उस जानबूझकर किए गए अंतिम कार्य को स्पष्ट करती है।
