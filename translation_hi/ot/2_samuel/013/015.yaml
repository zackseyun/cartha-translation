base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/015.yaml
  text: Then Amnon hated her with very great hatred[a], because the hatred with which he hated her was greater than the love with which he had loved her. And Amnon said to her, “Get up, go.”
translation:
  language: hi
  text: तब अम्नोन को उससे बहुत ही बड़ी घृणा हो गई, क्योंकि जिस घृणा से वह उससे घृणा करता था, वह उस प्रेम से बढ़कर थी जिससे उसने उससे प्रेम किया था। अम्नोन ने उससे कहा, “उठ, जा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से दो संक्षिप्त आज्ञाएँ हैं: “उठ, जा।” ये शब्द अम्नोन द्वारा उसे कठोरता से निकाल देने को व्यक्त करते हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂנָאֶהָ
  choice: तब अम्नोन उससे ... घृणा करने लगा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है, इसलिए ‘तब’ स्वाभाविक है। स्त्रीलिंग एकवचन प्रत्यय का अर्थ ‘उससे’ है। ‘घृणा करने लगा’ प्रेम से घृणा की ओर आए तीखे परिवर्तन को सहज हिन्दी में व्यक्त करता है।
- source_word: שִׂנְאָה גְּדוֹלָה מְאֹד
  choice: बहुत ही अधिक घृणा
  rationale: यह पद घृणा की तीव्रता पर असाधारण बल देता है। ‘बहुत ही अधिक’ मूल के גְּדוֹלָה מְאֹד के emphatic संचय को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले कथन का कारण अथवा स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका सीधा समतुल्य है।
- source_word: גְדוֹלָה הַשִּׂנְאָה ... מֵאַהֲבָה
  choice: वह ... प्रेम से भी बढ़कर थी
  rationale: מִן यहाँ तुलना दर्शाता है। ‘से भी बढ़कर’ घृणा और पहले के प्रेम के बीच मूल तुलना को स्पष्ट रखता है।
- source_word: אֲשֶׁר שְׂנֵאָהּ
  choice: जिस घृणा से वह अब उससे घृणा करता था
  rationale: सम्बन्धवाचक रचना को बनाए रखा गया है। ‘अब’ इब्रानी का अलग शब्द नहीं है, पर पिछले प्रेम के विपरीत वर्तमान घृणा का कालगत सम्बन्ध हिन्दी में स्वाभाविक रूप से स्पष्ट करता है।
- source_word: אֲשֶׁר אֲהֵבָהּ
  choice: जिससे उसने उससे प्रेम किया था
  rationale: पूर्ण क्रिया उस प्रेम को वर्तमान घृणा से पहले का बताती है। ‘किया था’ इस पूर्वकालिक सम्बन्ध को व्यक्त करता है।
- source_word: קוּמִי לֵכִי
  choice: उठ, चली जा
  rationale: दोनों स्त्रीलिंग एकवचन आज्ञाएँ हैं। यह संक्षिप्त रूप अम्नोन की कठोर और अचानक विदाई को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: אַהֲבָה को प्रसंग के आधार पर वासना के रूप में परिभाषित करना
  choice: प्रेम
  alternative: वासना
  rationale: मूल पाठ ‘प्रेम’ का सामान्य शब्द प्रयोग करता है। कथा का प्रसंग उसके प्रेम के विकृत स्वरूप पर प्रश्न उठाता है, पर अनुवाद में उसे सीधे ‘वासना’ कहना मूल की शब्दावली और निहित तनाव को व्याख्यात्मक ढंग से हल कर देगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल की पुनरुक्ति—घृणा, घृणा करना, प्रेम, प्रेम करना—जानबूझकर बनाए रखी गई है, क्योंकि वही भावनात्मक उलटाव और कथन की तीव्रता को उभारती है।
