base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/001.yaml
  text: After this[a], Absalom son of David had a beautiful sister whose name was Tamar, and Amnon son of David loved her.
translation:
  language: hi
  text: इसके बाद दाऊद के पुत्र अबशालोम की एक सुन्दर बहन थी, जिसका नाम तामार था; और दाऊद का पुत्र अम्नोन उससे प्रेम करता था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस पर मोहित था” या “उसकी कामना करता था।” इब्रानी क्रिया का सामान्य अर्थ “प्रेम करना” है, पर आगे की कथा दिखाती है कि अम्नोन का यह प्रेम विकृत था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: इसके बाद
  rationale: कथात्मक सूत्र और कालसूचक पद को मिलाकर स्वाभाविक हिन्दी में घटनाक्रम की अगली कड़ी स्पष्ट की गई है।
- source_word: וּלְאַבְשָׁלוֹם בֶּן דָּוִד אָחוֹת
  choice: दाऊद के पुत्र अबशालोम की एक ... बहन थी
  rationale: इब्रानी के स्वामित्वसूचक निर्माण को सहज हिन्दी संबंधकारक वाक्य में व्यक्त किया गया और ‘दाऊद के पुत्र’ की वंशगत पहचान बनाए रखी गई।
- source_word: יָפָה
  choice: सुन्दर
  rationale: यहाँ स्त्रीलिंग विशेषण शारीरिक सौन्दर्य बताता है; ‘सुन्दर’ सीधा, गरिमापूर्ण और सामान्य हिन्दी शब्द है।
- source_word: וּשְׁמָהּ תָּמָר
  choice: जिसका नाम तामार था
  rationale: सरल नामकरण उपवाक्य को स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: וַיֶּאֱהָבֶהָ
  choice: उससे प्रेम करने लगा
  rationale: אהב प्रेम का सामान्य इब्रानी क्रिया-पद है। कथात्मक रूप आरम्भ/विकास का भाव देता है; आगे की कथा को समय से पहले व्याख्यायित किए बिना मूल शब्द ‘प्रेम’ रखा गया है।
- source_word: אַמְנוֹן בֶּן דָּוִד
  choice: दाऊद का पुत्र अम्नोन
  rationale: ‘दाऊद का पुत्र’ दोहराकर राजपरिवार के संबंधों पर मूल पाठ का बल सुरक्षित रखा गया है।
theological_decisions:
- issue: नैतिक रूप से दूषित प्रसंग में אהב का अनुवाद
  choice: प्रेम करने लगा
  alternative: उस पर मोहित हो गया / उसकी कामना करने लगा
  rationale: आगे का वृत्तांत अम्नोन के तथाकथित प्रेम को विकृत और हिंसक सिद्ध करता है, पर इस पद में प्रेम की सामान्य क्रिया ही है। मुख्य पाठ में उसी को रखकर साहित्यिक और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; सामान्य पाठक के लिए सहज किंतु गरिमापूर्ण शैली। पारिवारिक पहचानों की पुनरावृत्ति और मूल के नैतिक-साहित्यिक तनाव को बनाए रखा गया है।
