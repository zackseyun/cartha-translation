  yaml_path: translation/ot/2_samuel/013/011.yaml
  text: When she brought it near to him to eat[a], he seized her and said to her, “Come, lie with me, my sister.”
translation:
  language: hi
  text: जब वह उसके खाने के लिए भोजन उसके पास लाई[a], तो उसने उसे पकड़ लिया और उससे कहा, “आ, मेरी बहन, मेरे साथ सो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब वह उसके खाने के लिए उसके पास गई”; इब्रानी क्रिया का अर्थ तामार का उसके पास जाना या भोजन को उसके पास लाना—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגֵּשׁ אֵלָיו לֶאֱכֹל
  choice: जब वह उसे खिलाने के लिए उसके पास लाई
  rationale: नגשׁ यहाँ या तो तामार के पास आने या भोजन को पास लाने का अर्थ दे सकता है। प्रसंग में वह भोजन परोस रही है; हिन्दी में निहित भोजन को ‘उसे’ से व्यक्त करना स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है। לֶאֱכֹל का आशय यहाँ उसके खाने के लिए, अर्थात उसे खिलाने के लिए है।
- source_word: וַיַּחֲזֶק בָּהּ
  choice: उसने उसे पकड़ लिया
  rationale: חזק ב किसी को दृढ़ता या बल से पकड़ने को बताता है। ‘पकड़ लिया’ सहज हिन्दी है और प्रसंग की जबरदस्ती को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: בּוֹאִי
  choice: आ
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: שִׁכְבִי עִמִּי
  choice: मेरे साथ सो
  rationale: यह इब्रानी में यौन संबंध का प्रचलित मुहावरा है। आधुनिक हिन्दी में ‘मेरे साथ सो’ उसी यौन माँग को स्पष्ट और संक्षिप्त रूप में व्यक्त करता है।
- source_word: אֲחוֹתִי
  choice: मेरी बहन
  rationale: शाब्दिक संबंध-सूचक संबोधन को बनाए रखना आवश्यक है, क्योंकि भाई-बहन का संबंध इस घटना की नैतिक भयावहता का केंद्रीय अंग है।
theological_decisions:
- issue: यौन आज्ञा को शिष्टोक्ति से धुँधला न करना
  choice: मेरे साथ सो
  alternative: मेरे साथ लेट
  rationale: ‘मेरे साथ लेट’ आधुनिक हिन्दी में केवल शारीरिक मुद्रा भी समझा जा सकता है, जबकि इब्रानी पदबंध का यौन आशय है। चुना हुआ रूप उस आशय को स्पष्ट रखता है, पर अश्लील या सनसनीखेज भाषा नहीं अपनाता।
- issue: रिश्ते के संबोधन को बनाए रखना
  choice: मेरी बहन
  alternative: संबोधन को छोड़ देना
  rationale: यह संबोधन आकस्मिक नहीं है; इससे अपराध की पारिवारिक और नैतिक गंभीरता तीव्र होती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। हिंसा और यौन आशय को न तो नरम किया गया है, न अनावश्यक रूप से अधिक तीखा।
