  text: וַ/יִּבְרַ֖ח אַבְשָׁל֑וֹם וַ/יִּשָּׂ֞א הַ/נַּ֤עַר הַ/צֹּפֶה֙ אֶת עינ/ו וַ/יַּ֗רְא וְ/הִנֵּ֨ה עַם רַ֜ב הֹלְכִ֥ים מִ/דֶּ֛רֶךְ אַחֲרָ֖י/ו מִ/צַּ֥ד הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/034.yaml
  text: But Absalom fled[a]. And the young man who was watching lifted up his eyes and saw, and behold, many people were coming by the road behind him[c][b], from the side of the mountain.
translation:
  language: hi
  text: परन्तु अबशालोम भाग गया। तब निगरानी कर रहे युवक ने आँखें उठाईं और देखा कि बहुत-से लोग उसके पीछे की सड़क से, पहाड़ की ढलान से, चले आ रहे हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू में स्थान-संबंधी वाक्यांश संक्षिप्त है और उसका संबंध पूरी तरह स्पष्ट नहीं है। इसका अनुवाद यह भी हो सकता है: “पहाड़ की ढलान से, उसके पीछे की सड़क के रास्ते।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: भाग गया
  rationale: ברח भागने या बच निकलने को व्यक्त करता है; प्रसंग में सरल और स्वाभाविक हिन्दी 'भाग गया' उपयुक्त है।
- source_word: הַנַּעַר הַצֹּפֶה
  choice: पहरा दे रहे जवान
  rationale: נַעַר के 'जवान/सेवक' और צֹפֶה के 'निगरानी करने वाला'—दोनों भावों को रखता है, बिना उसे अनिवार्यतः औपचारिक पहरेदार का पद दिए।
- source_word: וַיִּשָּׂא ... אֶת עֵינוֹ
  choice: आँखें उठाकर देखा
  rationale: हिब्रू मुहावरे का रूप भी कुछ हद तक सुरक्षित रहता है और आधुनिक हिन्दी में अर्थ स्पष्ट है।
- source_word: וַיַּרְא וְהִנֵּה
  choice: देखा, और क्या देखता है कि
  rationale: यह स्वाभाविक हिन्दी कथन अचानक दिखाई पड़ी बात की ओर ध्यान खींचने वाले הִנֵּה का कथात्मक बल बनाए रखता है।
- source_word: עַם רַב
  choice: बहुत-से लोग
  rationale: सामूहिक עַם और परिमाणसूचक רַב का सीधा अनुवाद है; 'भीड़' जैसा अतिरिक्त निहितार्थ नहीं जोड़ता।
- source_word: הֹלְכִים
  choice: चले आ रहे हैं
  rationale: הלך मूलतः चलने/जाने को बताता है, पर निगरानी करने वाले की दृष्टि से लोग निकट आते दिखाई देते हैं; इसलिए हिन्दी में 'चले आ रहे हैं' स्वाभाविक है।
- source_word: מִדֶּרֶךְ אַחֲרָיו מִצַּד הָהָר
  choice: उसके पीछे की सड़क से, पहाड़ की ओर से
  rationale: स्थान-संबंधी संक्षिप्त और कुछ अस्पष्ट हिब्रू को निकटता से व्यक्त करता है; सर्वनाम का संदर्भ और दोनों संबंधबोधकों का ठीक आपसी संबंध पूरी तरह स्पष्ट नहीं है।
