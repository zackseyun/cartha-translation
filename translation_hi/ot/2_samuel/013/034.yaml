  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी अपनाई गई है। 'पहरा दे रहे जवान' स्रोत के दोनों पदों को समेटता है। मुख्य पाठ में भौगोलिक वाक्यांश की वास्तविक अस्पष्टता को अत्यधिक स्पष्ट किए बिना रखा गया है और वैकल्पिक विन्यास पादटिप्पणी में दिया गया है।
