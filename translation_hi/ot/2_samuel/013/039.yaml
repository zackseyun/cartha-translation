source:
  edition: WLC
  text: וַ/תְּכַל֙ דָּוִ֣ד הַ/מֶּ֔לֶךְ לָ/צֵ֖את אֶל אַבְשָׁל֑וֹם כִּֽי נִחַ֥ם עַל אַמְנ֖וֹן כִּֽי מֵֽת־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/039.yaml
  text: And King David longed to go out to Absalom, for he was comforted concerning Amnon, since he was dead.
translation:
  language: hi
  text: राजा दाऊद का मन अबशालोम के पास जाने के लिए तरसता रहा[a], क्योंकि अम्नोन की मृत्यु पर उसका शोक शांत हो चुका था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस इब्रानी वाक्य का अर्थ अनिश्चित है। इसका अनुवाद यह भी हो सकता है: “राजा दाऊद ने अबशालोम के पास जाने का विचार छोड़ दिया।”'
    reason: וַתְּכַל की अर्थ-सीमा और वाक्य की असामान्य व्याकरणिक बनावट से दो विपरीत व्याख्याएँ संभव हुई हैं।
lexical_decisions:
- source_word: וַתְּכַל
  choice: मन…तरसता रहा
  rationale: כּלה का मूल अर्थ समाप्त होना या चुक जाना है, पर किसी व्यक्ति की ओर जाने के संदर्भ में यह तीव्र अभिलाषा से व्याकुल होने का भाव दे सकता है। स्त्रीलिंग क्रिया के कारण यहाँ ‘मन/प्राण’ जैसा कोई निहित संज्ञापद मानना स्वाभाविक है।
- source_word: לָצֵאת אֶל־אַבְשָׁלוֹם
  choice: अबशालोम के पास जाने के लिए
  rationale: शाब्दिक ‘अबशालोम की ओर निकलना’ को स्वाभाविक हिन्दी में व्यक्त किया गया है; आशय उससे मिलने या उसके पास जाने का है।
- source_word: נִחַם עַל־אַמְנוֹן
  choice: अम्नोन की मृत्यु पर उसका शोक शांत हो चुका था
  rationale: נחם निफ़अल यहाँ सांत्वना मिलने और शोक के कम हो जाने का भाव देता है। अंतिम उपवाक्य ‘क्योंकि वह मर चुका था’ को संक्षेप में ‘मृत्यु पर’ में समाहित किया गया है।
theological_decisions:
- issue: दाऊद की अबशालोम के प्रति मनोदशा
  choice: उसका मन अबशालोम के पास जाने के लिए तरसता रहा
  alternative: उसने अबशालोम के पास जाने का विचार छोड़ दिया
  rationale: व्यंजनरहित पाठ और כּלה की अर्थ-सीमा के कारण दोनों व्याख्याएँ प्रस्तावित हुई हैं। निकटवर्ती संदर्भ (2 शमूएल 14:1) और पारंपरिक मासोरेटिक समझ तीव्र अभिलाषा के पक्ष में है, फिर भी वैकल्पिक व्याख्या को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘मन…तरसता रहा’ मूल की भावात्मक तीव्रता और निहित स्त्रीलिंग संज्ञा को स्वाभाविक रूप से व्यक्त करता है; पाठगत अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
