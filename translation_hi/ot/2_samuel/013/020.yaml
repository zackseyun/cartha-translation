source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלֶ֜י/הָ אַבְשָׁל֣וֹם אָחִ֗י/הָ הַ/אֲמִינ֣וֹן אָחִי/ךְ֮ הָיָ֣ה עִמָּ/ךְ֒ וְ/עַתָּ֞ה אֲחוֹתִ֤/י הַחֲרִ֨ישִׁי֙ אָחִ֣י/ךְ ה֔וּא אַל תָּשִׁ֥יתִי אֶת לִבֵּ֖/ךְ לַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/תֵּ֤שֶׁב תָּמָר֙ וְ/שֹׁ֣מֵמָ֔ה בֵּ֖ית אַבְשָׁל֥וֹם אָחִֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/020.yaml
  text: Then Absalom her brother said to her[a], “Has Amnon your brother been with you? But now, my sister, keep silent; he is your brother. Do not take this matter to heart.” So Tamar remained, devastated[b], in the house of Absalom her brother.
translation:
  language: hi
  text: तब उसके भाई अबशालोम ने उससे कहा,[a] “क्या तेरा भाई अम्नोन तेरे साथ था? पर अब, मेरी बहन, चुप रह; वह तेरा भाई है। इस बात को अपने मन पर मत ले।” तब तामार अपने भाई अबशालोम के घर में उजड़ी हुई-सी[b] रहने लगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “क्या तेरा भाई अम्नोन तेरे साथ था?” यह यौन हिंसा की ओर संकेत करने वाली एक परोक्ष अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: या “उजाड़” अथवा “विध्वस्त।” इब्रानी शब्द उजड़ जाने, विनाश और स्तब्ध वीरानी का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲמִינוֹן
  choice: अम्नोन
  rationale: व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण; प्रश्नवाचक הֲ का अर्थ वाक्य-रचना में व्यक्त किया गया है।
- source_word: הָיָה עִמָּךְ
  choice: तेरे साथ था
  rationale: इब्रानी की संयत, परोक्ष अभिव्यक्ति को बनाए रखता है; प्रसंग में यह यौन हिंसा की ओर संकेत करती है।
- source_word: הַחֲרִישִׁי
  choice: चुप रह
  rationale: स्त्रीलिंग एकवचन आज्ञार्थ का स्वाभाविक और सीधा आधुनिक हिन्दी रूप।
- source_word: אָחִיךְ הוּא
  choice: वह तेरा भाई है
  rationale: अबशालोम के विचलित करने वाले पारिवारिक तर्क को बिना नरम किए ज्यों का त्यों रखता है।
- source_word: אַל תָּשִׁיתִי אֶת־לִבֵּךְ לַדָּבָר הַזֶּה
  choice: इस बात को अपने मन पर मत ले
  rationale: ‘हृदय रखना/लगाना’ वाले इब्रानी मुहावरे का सहज हिन्दी समतुल्य, जो इस घटना को मन में बसाए रखने या उससे भीतर तक व्यथित होने का भाव देता है।
- source_word: וַתֵּשֶׁב
  choice: रहने लगी
  rationale: यहाँ बैठने से अधिक किसी घर में आगे बने रहने की परिणामी अवस्था व्यक्त होती है।
- source_word: שֹׁמֵמָה
  choice: उजड़ी हुई-सी
  rationale: शब्द में उजाड़, विनाश और स्तब्ध कर देने वाली टूटन का व्यापक भाव है; हिन्दी में यह तामार की भावनात्मक और सामाजिक दशा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בֵּית אַבְשָׁלוֹם
  choice: अबशालोम के घर में
  rationale: मूल के ठोस घरेलू और पारिवारिक परिवेश को स्पष्ट रखता है।
theological_decisions:
- issue: यौन हिंसा के लिए कथात्मक परोक्षोक्ति
  choice: मुख्य पाठ में “तेरे साथ था” रखकर इब्रानी की परोक्ष अभिव्यक्ति सुरक्षित रखी गई है।
  alternative: “क्या तेरे भाई अम्नोन ने तेरे साथ बलात्कार किया?” अथवा “क्या वह तेरे साथ सोया था?”
  rationale: अधिक स्पष्ट रूप घटना की व्याख्या तो करता, पर मूल की जानबूझकर संयत शब्दावली को बदल देता। आसपास का प्रसंग संकेत का आशय स्पष्ट करता है।
- issue: שֹׁמֵמָה में भावनात्मक और सामाजिक उजाड़
  choice: “उजड़ी हुई-सी”
  alternative: “उजाड़,” “विध्वस्त,” अथवा “स्तब्ध और असहाय”
  rationale: मूल शब्द केवल दुःख नहीं, बल्कि जीवन के उजड़ जाने और वीरान दशा का तनाव रखता है; चुना गया रूप अर्थ-सीमा को किसी एक मनोवैज्ञानिक अर्थ तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। अबशालोम और तामार भाई-बहन हैं, इसलिए संवाद में स्वाभाविक निकटता के लिए ‘तेरा/मेरी बहन’ प्रयुक्त है। मूल की परोक्षता और उसके भीतर का नैतिक तनाव बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
