  text: तब अम्नोन लेट गया और बीमार होने का ढोंग किया। जब राजा उसे देखने आया, तो अम्नोन ने राजा से कहा, “कृपया मेरी बहन तामार को आने दीजिए, ताकि वह मेरी आँखों के सामने दो पकवान[a] बनाए और मैं उसके हाथ से खाऊँ।”
  philosophy: optimal-equivalence
