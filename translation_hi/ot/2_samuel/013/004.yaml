  yaml_path: translation/ot/2_samuel/013/004.yaml
  text: He said to him[a], “Why are you so gaunt, son of the king, morning after morning? Will you not tell me?” And Amnon said to him, “I love Tamar[b], the sister of my brother Absalom.”
translation:
  language: hi
  text: उसने उससे कहा, “हे राजपुत्र, तुम हर सुबह इतने दुबले क्यों दिखाई देते हो?[a] क्या तुम मुझे नहीं बताओगे?” अम्नोन ने उससे कहा, “मैं अपने भाई अबशालोम की बहन तामार से प्रेम करता हूँ।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप से, “सुबह दर सुबह।”
    reason: हिब्रू בַּבֹּקֶר בַּבֹּקֶר के दोहराव और उसके आवृत्तिमूलक अर्थ को दर्शाने के लिए।
  - marker: b
    text: या “मैं तामार पर मोहित हूँ।” हिब्रू में अधिक शाब्दिक रूप से, “मैं तामार से प्रेम करता हूँ।”
    reason: אָהֵב के सीधे अर्थ और संदर्भानुसार सम्भव भावात्मक अर्थ—दोनों को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: מַדּוּעַ
  choice: क्यों
  rationale: कारण पूछने वाले सीधे प्रश्न के लिए आधुनिक हिन्दी में यह स्वाभाविक और पर्याप्त है।
- source_word: כָּכָה דַּל
  choice: इतने दुबले क्यों दिखाई देते हो
  rationale: דַּל यहाँ आर्थिक निर्धनता के बजाय अम्नोन की प्रतिदिन दिखाई देने वाली क्षीण दशा बताता है; ‘दुबले दिखाई देते हो’ संदर्भ में स्पष्ट और स्वाभाविक है।
- source_word: בֶּן הַמֶּלֶךְ
  choice: हे राजपुत्र
  rationale: शाब्दिक ‘राजा के पुत्र’ की संबोधनात्मक शक्ति को संक्षिप्त, प्रतिष्ठित और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: हर सुबह
  rationale: दोहराव से प्रकट नियमित आवृत्ति को सहज आधुनिक हिन्दी में व्यक्त करता है; अधिक रूपात्मक विकल्प पादटिप्पणी में रखा गया है।
- source_word: הֲלוֹא תַּגִּיד לִי
  choice: क्या तुम मुझे नहीं बताओगे?
  rationale: הֲלוֹא में निहित अपेक्षा और आग्रह को स्वाभाविक हिन्दी प्रश्न में बनाए रखता है।
- source_word: אֲחוֹת אַבְשָׁלֹם אָחִי
  choice: अपने भाई अबशालोम की बहन
  rationale: हिब्रू के संबंधपरक बल को स्पष्ट और मुहावरेदार हिन्दी में बनाए रखता है।
- source_word: אֲנִי אֹהֵב
  choice: मैं ... से प्रेम करता हूँ
  rationale: सामान्य हिब्रू क्रिया אָהֵב का सीधा अर्थ सुरक्षित रखता है और इस वाक्य में निहित न होने वाली नैतिक अथवा मनोवैज्ञानिक व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: तामार के प्रति अम्नोन के कथन को कैसे व्यक्त किया जाए
  choice: मैं ... तामार से प्रेम करता हूँ
  alternative: मैं तामार पर मोहित हूँ / मैं तामार को चाहता हूँ
  rationale: मूल में सामान्य क्रिया אָהֵב है। आगे की कथा अम्नोन की विकृत कामना प्रकट करती है, पर इस पद में अनुवाद को वह निष्कर्ष पहले से नहीं जोड़ना चाहिए।
- issue: अबशालोम और तामार के संबंध का उल्लेख
  choice: अपने भाई अबशालोम की बहन तामार
  alternative: तामार, जो मेरे भाई अबशालोम की बहन है
  rationale: मूल के संबंधपरक कथन को बनाए रखते हुए हिन्दी में सुबोध क्रम चुना गया है; इससे कोई अतिरिक्त पारिवारिक निष्कर्ष नहीं जोड़ा जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘राजपुत्र’ संबोधन की संक्षिप्तता और सामाजिक स्थिति दोनों व्यक्त करता है। मुख्य पाठ में मूल की अपेक्षापूर्ण प्रश्नवाचकता और ‘प्रेम’ की वास्तविक शाब्दिक अस्पष्टता बनाए रखी गई है।
