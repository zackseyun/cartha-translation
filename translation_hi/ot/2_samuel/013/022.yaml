base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/022.yaml
  text: And Absalom did not speak with Amnon[a], either bad or good[b], because Absalom hated Amnon because he had violated Tamar his sister.
translation:
  language: hi
  text: अबशालोम ने अम्नोन से न बुरी, न भली कोई बात की,[a] क्योंकि अबशालोम अम्नोन से घृणा करता था, इस कारण कि उसने अबशालोम की बहन तामार का यौन अपमान किया था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बुरे से लेकर भले तक [कोई बात नहीं की]।” यह एक मुहावरा है, जिसका अर्थ है कि अबशालोम ने अम्नोन से किसी भी प्रकार की बात नहीं की।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी क्रिया का अनुवाद “अपमानित किया” या “दीन किया” भी हो सकता है। इस प्रसंग में यह तामार के साथ किए गए यौन उल्लंघन को दर्शाती है।
    reason: lexical_alternative
