base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/031.yaml
  text: Then the king arose[a], tore his garments, and lay on the ground, and all his servants were standing with their garments torn.
translation:
  language: hi
  text: तब राजा उठ खड़ा हुआ[a], उसने अपने वस्त्र फाड़े और भूमि पर लेट गया। उसके सभी सेवक भी अपने वस्त्र फाड़े हुए खड़े थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वस्त्र फाड़ना इब्रानी बाइबल में शोक, गहरे दुःख या भयावह समाचार पर व्यथा प्रकट करने की प्रचलित रीति थी।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठ खड़ा हुआ
  rationale: קום का कथात्मक रूप राजा की तत्काल शारीरिक प्रतिक्रिया व्यक्त करता है; आधुनिक हिन्दी में ‘उठ खड़ा हुआ’ स्वाभाविक और स्पष्ट है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: मूल पाठ ज्ञात राजकीय व्यक्ति को उसके पद से संबोधित करता है, इसलिए दाऊद नाम जोड़ने के बजाय ‘राजा’ रखा गया है।
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: उसने अपने वस्त्र फाड़े
  rationale: קרע और בגד का यह संयोजन शोक या आघात में वस्त्र फाड़ने की प्रचलित क्रिया बताता है; ‘वस्त्र’ गरिमापूर्ण और सहज है।
- source_word: וַיִּשְׁכַּב אָרְצָה
  choice: भूमि पर लेट गया
  rationale: שכב के साथ दिशासूचक אָרְצָה भूमि की ओर जाकर लेटने का भाव देता है; यह हिन्दी अभिव्यक्ति गति और परिणामी मुद्रा दोनों स्पष्ट करती है।
- source_word: וְכָל־עֲבָדָיו
  choice: उसके सभी सेवक
  rationale: עבדים यहाँ राजा के सेवकों अथवा दरबारी परिचारकों के लिए व्यापक पद है; ‘सेवक’ बिना अनावश्यक पद-विशेष जोड़े सीधा अर्थ देता है।
- source_word: נִצָּבִים
  choice: खड़े थे
  rationale: निफ़अल कृदंत दृश्य में जारी अवस्था को व्यक्त करता है; ‘खड़े थे’ हिन्दी में उस स्थिर दृश्य को स्वाभाविक रूप से प्रस्तुत करता है।
- source_word: קְרֻעֵי בְגָדִים
  choice: अपने वस्त्र फाड़े हुए
  rationale: निष्क्रिय कृदंत फटे हुए वस्त्रों की परिणामी अवस्था बताता है; हिन्दी में ‘वस्त्र फाड़े हुए’ उसी अवस्था को सहजता से व्यक्त करता है।
theological_decisions: []
