  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक और सामान्य पाठक के लिए सहज शैली रखी गई है। ‘वस्त्र’ औपचारिकता बनाए रखता है, जबकि वाक्य-विन्यास वर्तमान हिन्दी के अनुरूप है।
