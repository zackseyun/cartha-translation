  rationale: אֵת कर्म-सूचक चिह्न है और इसका अलग अनुवाद नहीं होता; नाम का प्रचलित हिन्दी लिप्यंतरण किया गया है।
- source_word: וְאֵת כָּל בְּנֵי הַמֶּלֶךְ
  choice: और राजा के सभी पुत्रों को
  rationale: सम्बन्धवाचक इब्रानी पदबंध को सहज, गरिमापूर्ण आधुनिक हिन्दी में प्रस्तुत किया गया है।
