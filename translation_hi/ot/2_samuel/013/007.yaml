  text: 'तब दाऊद ने तामार को घर पर यह संदेश भेजा: “कृपया अपने भाई अम्नोन के घर जाओ और उसके लिए स्वास्थ्यवर्धक व्यंजन[a] तैयार करो।”'
  philosophy: optimal-equivalence
  footnotes:
