    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶל תָּמָר ... לֵאמֹר
  choice: तामार के पास यह संदेश भेजा
  rationale: क्रिया का मूल अर्थ ‘भेजना’ है; व्यक्ति के साथ לֵאמֹר द्वारा संदेश आरंभ होने के कारण हिन्दी में ‘संदेश भेजा’ स्वाभाविक और संदर्भानुकूल है।
- source_word: הַבַּיְתָה
  choice: घर पर
  rationale: दिशासूचक प्रत्यय सामान्यतः ‘घर की ओर/घर को’ बता सकता है, पर यहाँ तामार के स्थान का संकेत है। ‘घर पर’ इस प्रसंगगत अर्थ को सहज हिन्दी में रखता है और यह अस्पष्टता नहीं मिटाता कि अभिप्रेत घर कौन-सा है।
- source_word: לְכִי נָא
  choice: कृपया ... जाओ
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप के साथ נָא अनुरोध को नम्र बनाता है; ‘कृपया ... जाओ’ दोनों पहलुओं को व्यक्त करता है।
- source_word: בֵּית אַמְנוֹן אָחִיךְ
  choice: अपने भाई अम्नोन के घर
  rationale: यह ‘अम्नोन, तुम्हारा भाई, का घर’ अर्थ देने वाली संबंध-रचना है। हिन्दी में ‘अपने भाई अम्नोन के घर’ स्पष्ट और स्वाभाविक है।
- source_word: וַעֲשִׂי לוֹ
  choice: उसके लिए ... तैयार करो
  rationale: עשה का अर्थ व्यापक रूप से ‘करना/बनाना’ है; भोजन के संदर्भ में ‘तैयार करो’ आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: הַבִּרְיָה
  choice: रोगी का भोजन
  rationale: यह संज्ञा रोगी या स्वास्थ्यलाभ कर रहे व्यक्ति के लिए तैयार भोजन को सूचित करती है। ‘रोगी का भोजन’ सामान्य ‘भोजन’ से अधिक स्रोत-सटीक है, जबकि उसकी ठीक व्यंजन-प्रकृति अनिर्धारित रखता है।
