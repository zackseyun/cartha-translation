translation:
  language: hi
  text: जब राजा दाऊद ने ये सारी बातें सुनीं, तो वह बहुत क्रोधित हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ דָּוִד
  choice: जब राजा दाऊद
  rationale: कथात्मक क्रम में וְ को कालवाचक संबंध ‘जब’ से व्यक्त करना स्वाभाविक है; ‘राजा दाऊद’ नाम और पदवी का सीधा, प्रचलित हिन्दी रूप है।
- source_word: שָׁמַע
  choice: ने ... सुनीं
  rationale: क्रिया का मूल अर्थ ‘सुनना’ है और यहाँ घटनाओं का समाचार मिलने को दर्शाता है।
- source_word: כָּל הַ/דְּבָרִים הָ/אֵלֶּה
  choice: ये सारी बातें
  rationale: דְּבָרִים यहाँ पहले बताई गई घटनाओं या मामलों को समेटता है; ‘बातें’ आधुनिक हिन्दी में स्वाभाविक और अर्थ की व्यापकता बनाए रखता है।
- source_word: וַ/יִּחַר ל֖/וֹ מְאֹד
  choice: तो वह बहुत क्रोधित हुआ
  rationale: इब्रानी मुहावरा शाब्दिक रूप से उसके लिए अत्यधिक ‘जलने’ को व्यक्त करता है, जिसका आशय तीव्र क्रोध है। ‘बहुत क्रोधित हुआ’ स्पष्ट, गरिमापूर्ण और स्वाभाविक हिन्दी है।
