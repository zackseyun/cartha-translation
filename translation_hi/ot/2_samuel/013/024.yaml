translation:
  language: hi
  text: तब अबशालोम ने राजा के पास आकर कहा, “देखिए, आपके सेवक के यहाँ भेड़ों की ऊन कतरने का काम चल रहा है। कृपया राजा और उनके सेवक आपके सेवक के साथ चलें।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֹזְזִים
  choice: भेड़ों की ऊन कतरने का काम
  rationale: इब्रानी बहुवचन कृदंत का शाब्दिक अर्थ ‘कतरनेवाले’ है, पर प्रसंग में भेड़ों की ऊन कतरने के आयोजन या काम का संकेत है; हिंदी में अर्थ स्पष्ट करने के लिए स्वाभाविक विस्तार किया गया।
- source_word: עַבְדֶּךָ
  choice: आपके सेवक
  rationale: अबशालोम राजा से विनम्र आत्म-संदर्भ में तीसरे पुरुष का प्रयोग करता है; इसे ‘आपका सेवक’ के रूप में सुरक्षित रखा गया।
- source_word: יֵלֶךְ נָא
  choice: कृपया ... चलें
  rationale: נָא विनम्र निवेदन दर्शाता है और יֵלֶךְ तीसरे पुरुष में सम्मानपूर्ण आमंत्रण है; आधुनिक हिंदी में ‘कृपया ... चलें’ स्वाभाविक है।
