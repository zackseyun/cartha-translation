  yaml_path: translation/ot/2_samuel/013/005.yaml
  text: Jehonadab said to him[a], “Lie down on your bed and pretend to be sick. When your father comes to see you, say to him, ‘Please let Tamar my sister come and give me food, and let her prepare the meal in my sight[c][b], so that I may watch and eat from her hand.’”
translation:
  language: hi
  text: योनादाब ने उससे कहा, “अपने बिस्तर पर लेट जा और बीमार होने का ढोंग कर। जब तेरा पिता तुझे देखने आए, तो उससे कहना, ‘कृपया मेरी बहन तामार को आने दीजिए और वह मुझे भोजन दे तथा मेरे सामने भोजन[a] तैयार करे, ताकि मैं देख सकूँ और उसके हाथ से खाऊँ।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का आशय संभवतः बीमार या स्वास्थ्यलाभ कर रहे व्यक्ति के लिए विशेष रूप से तैयार भोजन से है।
    reason: cultural_note
lexical_decisions:
- source_word: שְׁכַב עַל מִשְׁכָּבְךָ
  choice: अपने बिस्तर पर लेट जा
  rationale: यह शाब्दिक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְהִתְחָל
  choice: बीमार होने का ढोंग कर
  rationale: हित्पाएल रूप यहाँ संदर्भानुसार बीमारी का दिखावा करने का निर्देश देता है, वास्तव में बीमार पड़ने का नहीं।
- source_word: וּבָא אָבִיךָ לִרְאוֹתֶךָ
  choice: जब तेरा पिता तुझे देखने आए
  rationale: आज्ञाओं के बाद आया क्रमिक वाक्य हिन्दी में समयसूचक उपवाक्य के रूप में स्वाभाविक है।
- source_word: תָּבֹא נָא תָמָר אֲחוֹתִי
  choice: कृपया मेरी बहन तामार को आने दीजिए
  rationale: נָא की विनम्र विनती और पिता से तामार को आने देने का अनुरोध दोनों सुरक्षित हैं।
- source_word: וְתַבְרֵנִי לֶחֶם
  choice: ताकि वह मुझे भोजन दे
  rationale: ברה यहाँ रोगी को पोषण या भोजन देने के अर्थ में है; इसे बाद के עשה ‘तैयार करे’ से अलग रखा गया है। לֶחֶם यहाँ व्यापक अर्थ में भोजन है।
- source_word: וְעָשְׂתָה לְעֵינַי אֶת־הַבִּרְיָה
  choice: मेरे सामने रोगी का भोजन तैयार करे
  rationale: הַבִּרְיָה विशेषतः रोगी या स्वास्थ्यलाभ कर रहे व्यक्ति के लिए तैयार भोजन का संकेत दे सकता है; לְעֵינַי का दृश्य तत्व ‘मेरे सामने’ में बना रहता है।
- source_word: לְמַעַן אֲשֶׁר אֶרְאֶה
  choice: जिससे मैं उसे बनते हुए देखूँ
  rationale: ראה का प्रत्यक्ष देखने का अर्थ रखा गया है। ‘उसे बनते हुए’ हिन्दी में पिछले दृश्य-तैयारी प्रसंग को स्वाभाविक ढंग से जोड़ता है, यद्यपि इब्रानी में कोई व्यक्त कर्म नहीं है।
- source_word: וְאָכַלְתִּי מִיָּדָהּ
  choice: और उसके हाथ से खाऊँ
  rationale: यह तामार द्वारा व्यक्तिगत रूप से भोजन दिए जाने की कथानकगत महत्ता को सुरक्षित रखता है।
