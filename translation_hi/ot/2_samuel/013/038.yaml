  text: But Absalom fled and went to Geshur[b][a], and he was there three years.
translation:
  language: hi
  text: परन्तु अबशालोम भागकर गशूर चला गया[a] और वहाँ तीन वर्ष रहा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और अबशालोम भागकर गशूर चला गया।” इब्रानी संयोजक का अनुवाद प्रसंग के अनुसार “और” या “परन्तु” किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “और वह वहाँ तीन वर्ष था”; इसका अनुवाद “और वह वहाँ तीन वर्ष ठहरा” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשָׁלוֹם
  choice: परन्तु अबशालोम
  rationale: वाव को प्रसंग में पिछले कथन के बाद विरोध अथवा कथा की पुनरारम्भ-सूचना के रूप में ‘परन्तु’ कहना स्वाभाविक है; ‘और’ भी सम्भव है।
- source_word: בָּרַח
  choice: भागकर
  rationale: क्रिया ברח का सामान्य अर्थ ‘भागना’ या ‘पलायन करना’ है; ‘भागकर’ वर्तमान हिन्दी में सहज और संक्षिप्त है।
- source_word: וַ/יֵּלֶךְ
  choice: चला गया
  rationale: הלך यहाँ कथात्मक क्रम में किसी स्थान को जाने का संकेत देता है; ‘चला गया’ स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: גְּשׁוּר
  choice: गशूर
  rationale: स्थान-नाम का मानक हिन्दी लिप्यन्तरण।
- source_word: וַ/יְהִי שָׁם
  choice: और वहाँ ... रहा
  rationale: शाब्दिक अर्थ ‘और वह वहाँ था’ है, किन्तु अवधि के साथ ‘वहाँ रहा’ हिन्दी में स्वाभाविक है और निरन्तर निवास का आशय ठीक व्यक्त करता है।
- source_word: שָׁלֹשׁ שָׁנִים
  choice: तीन वर्ष
  rationale: संख्या और समयावधि का सीधा तथा मानक अनुवाद।
