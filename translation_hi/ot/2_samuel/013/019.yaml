  text: Then Tamar put ashes on her head[a], tore the robe of many colors that was on her, put her hand on her head, and went away, going and crying out.
translation:
  language: hi
  text: तब तामार ने अपने सिर पर राख डाली और जो विशेष वस्त्र उसने पहना हुआ था, उसे फाड़ डाला। फिर उसने अपने सिर पर अपना हाथ रख लिया और चलती गई और चिल्लाती रही।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵפֶר
  choice: राख
  rationale: यह शोक के चिह्न के रूप में सिर पर डाली जाने वाली राख है; हिन्दी में सामूहिक पदार्थ के लिए एकवचन ‘राख’ स्वाभाविक है।
- source_word: וַתִּקַּח ... עַל רֹאשָׁהּ
  choice: अपने सिर पर राख डाली
  rationale: शाब्दिक संरचना ‘राख ली ... सिर पर’ है, पर आशय सिर पर राख डालने की प्रचलित शोक-क्रिया है।
- source_word: כְתֹנֶת הַפַּסִּים
  choice: विशिष्ट चोगा
  rationale: पदबंध का ठीक स्वरूप अनिश्चित है, जबकि निकटवर्ती संदर्भ इसे राजा की कुँवारी बेटियों के पहने हुए खास वस्त्र के रूप में पहचानता है। ‘विशिष्ट’ अनिश्चित रंग अथवा बाँहों की बनावट को निश्चित नहीं करता।
- source_word: אֲשֶׁר עָלֶיהָ
  choice: अपने पहने हुए
  rationale: यह स्वाभाविक हिन्दी में उस चोगे को उसके शरीर पर पहना हुआ बताता है।
- source_word: קָרָעָה
  choice: फाड़ डाला
  rationale: यह शोक में वस्त्र फाड़ने की ठोस और पूर्ण क्रिया को व्यक्त करता है।
- source_word: וַתָּשֶׂם יָדָהּ עַל רֹאשָׁהּ
  choice: अपना हाथ सिर पर रखा
  rationale: मूल के शारीरिक संकेत को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: וַתֵּלֶךְ הָלוֹךְ וְזָעָקָה
  choice: चिल्लाती हुई चली गई
  rationale: चलते जाने और साथ-साथ ऊँचे स्वर में पुकारने की जारी क्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: זָעָקָה
  choice: चिल्लाती हुई
  rationale: क्रिया ऊँचे स्वर की पुकार दर्शाती है; यह चयन उसे केवल विलाप या शब्दयुक्त विरोध के रूप में सीमित नहीं करता।
