base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/001.yaml
  text: Again the anger of Yahweh burned against Israel[a], and he incited David against them, saying, “Go[b], count Israel and Judah.”
translation:
  language: hi
  text: याहवे का क्रोध फिर इस्राएल पर भड़क उठा[a], और उसने दाऊद को उनके विरुद्ध उकसाया और कहा, “जा[b], इस्राएल और यहूदा को गिन।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 इतिहास 21:1 में कहा गया है कि शैतान इस्राएल के विरुद्ध खड़ा हुआ और उसने दाऊद को उकसाया। यहाँ मुख्य पाठ 2 शमूएल के इब्रानी वाक्य के स्पष्ट कर्ता का अनुसरण करता है और दोनों वृत्तांतों के बीच के तनाव को सामंजस्य बैठाकर मिटाता नहीं।
    reason: cross_reference
  - marker: b
    text: या “संख्या निर्धारित कर,” अथवा “जनगणना कर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף אַף יְהוָה לַחֲרוֹת
  choice: याहवे का क्रोध फिर ... भड़क उठा
  rationale: यह इब्रानी वाक्य-विन्यास क्रोध के दोबारा भड़कने को व्यक्त करता है। ‘फिर ... भड़क उठा’ मूल रूपक और पुनरावृत्ति—दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम के रूप में चतुरक्षरी नाम का लिप्यंतरण किया गया है, शीर्षक से उसका स्थान नहीं लिया गया।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल पर
  rationale: क्रोध के इस मुहावरे में संबंधवाचक उपसर्ग क्रोध के लक्ष्य को दिखाता है; हिन्दी में ‘पर’ स्वाभाविक है।
- source_word: וַיָּסֶת
  choice: उसने ... उकसाते हुए कहा
  rationale: हिफ़ील क्रिया किसी को कार्य के लिए उकसाने या प्रेरित करने का भाव रखती है। संयुक्त हिन्दी रचना अगले לֵאמֹר के साथ स्वाभाविक बैठती है।
- source_word: בָּהֶם
  choice: उनके विरुद्ध
  rationale: वाक्यांश कुछ कठिन और अर्थगत रूप से खुला है। प्रसंग में यह दाऊद को इस्राएल के संबंध में, प्रतिकूल परिणाम वाले कार्य के लिए उकसाने का संकेत देता है; ‘उनके विरुद्ध’ इस दिशा को बनाए रखता है।
- source_word: לֵךְ
  choice: जा
  rationale: एकवचन पुल्लिंग आज्ञार्थक का सीधा और संक्षिप्त हिन्दी रूप।
- source_word: מְנֵה
  choice: गिन
  rationale: क्रिया का मूल अर्थ गिनना या संख्या निर्धारित करना है। ‘गिन’ संक्षिप्त है और जनगणना की व्याख्यात्मक संभावना को पादटिप्पणी में सुरक्षित रखता है।
- source_word: יִשְׂרָאֵל וְאֶת יְהוּדָה
  choice: इस्राएल और यहूदा
  rationale: मूल पाठ दोनों नामों को अलग-अलग रखता है; बिना व्याख्यात्मक विस्तार के वही भेद बनाए रखा गया है।
theological_decisions:
- issue: 1 इतिहास 21:1 की समानांतर कथा की तुलना में दाऊद को उकसाने वाली सत्ता
  choice: उसने दाऊद को ... उकसाते हुए कहा
  alternative: किसी ने दाऊद को उकसाया; अथवा इतिहास की पुस्तक के आधार पर ‘शैतान ने दाऊद को उकसाया’
  rationale: 2 शमूएल के इब्रानी वाक्य में וַיָּסֶת का सर्वाधिक स्वाभाविक कर्ता पहले उल्लिखित याहवे है। मुख्य पाठ उसी व्याकरणिक अर्थ को रखता है और 1 इतिहास 21:1 से उत्पन्न तनाव का सामंजस्य करके उसे मिटाता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। ‘याहवे,’ ‘इस्राएल,’ ‘दाऊद’ और ‘यहूदा’ के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं। आज्ञा में एकवचन ‘जा’ मूल के सीधे संबोधन को बनाए रखता है।
