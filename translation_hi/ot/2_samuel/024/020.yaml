  text: Araunah looked out and saw the king and his servants passing by him[a]. So Araunah went out and bowed down to the king with his face to the ground.
translation:
  language: hi
  text: अरौना ने बाहर झाँककर देखा कि राजा और उसके सेवक उसकी ओर बढ़ते हुए[a] आ रहे थे। तब अरौना बाहर निकला और राजा के सामने मुँह के बल भूमि पर झुक गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसके पास से गुज़रते हुए।’ इब्रानी अभिव्यक्ति राजा और उसके सेवकों की अरौना के संबंध में गति बताती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁקֵף
  choice: बाहर झाँककर देखा
  rationale: क्रिया किसी स्थान या खुले भाग से बाहर देखने का भाव देती है; यह सामान्य ‘देखा’ से अधिक विशिष्ट और हिन्दी में स्वाभाविक है।
- source_word: וַיַּרְא
  choice: देखा
  rationale: ראה का सीधा अर्थ रखा गया है; संयुक्त वाक्यांश ‘बाहर झाँककर देखा’ इब्रानी की क्रमिक क्रियाओं को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֲבָדָיו
  choice: उसके सेवक
  rationale: राजकीय संदर्भ में עבד राजा के सेवकों या परिचारकों को दर्शा सकता है; ‘सेवक’ सबसे सीधा और पर्याप्त रूप से व्यापक शब्द है।
- source_word: עֹבְרִים עָלָיו
  choice: उसकी ओर आ रहे हैं
  rationale: עבר के कृदन्त और על का यह संयोजन अरौना के संबंध में उनकी गति बताता है। प्रसंग में राजा अरौना के खलिहान पर पहुँच रहा है, इसलिए ‘उसकी ओर आ रहे हैं’ स्वाभाविक है, यद्यपि ‘उसके पास से जा रहे हैं’ भी शब्दगत रूप से संभव है।
- source_word: וַיֵּצֵא
  choice: बाहर निकला
  rationale: יצא का सीधा और आधुनिक हिन्दी में स्वाभाविक अनुवाद।
- source_word: וַיִּשְׁתַּחוּ
  choice: झुक गया
  rationale: यहाँ क्रिया मनुष्य राजा के सामने दण्डवत होने या सम्मान प्रकट करने की शारीरिक मुद्रा बताती है; इसे ‘आराधना की’ कहना संदर्भ से अधिक अर्थ जोड़ देगा।
- source_word: אַפָּיו אָרְצָה
  choice: मुँह के बल भूमि पर
  rationale: यह मुहावरा गहरी दण्डवत मुद्रा दर्शाता है; हिन्दी अभिव्यक्ति शारीरिक क्रिया को स्पष्ट और स्वाभाविक ढंग से रखती है।
- source_word: אֲרַוְנָה
  choice: अरौना
  rationale: शमूएल के इब्रानी नामरूप का देवनागरी लिप्यंतरण; इतिहास की समानांतर कथा का ‘ओर्नान’ यहाँ नहीं अपनाया गया।
theological_decisions:
- issue: राजा के सामने अरौना के झुकने की प्रकृति
  choice: मानवीय राजा के सामने सम्मानसूचक दण्डवत मुद्रा—‘राजा के सामने ... झुक गया’
  alternative: ‘राजा की आराधना की’
  rationale: שׁחה आराधना और मनुष्य के सामने सम्मानसूचक दण्डवत—दोनों के लिए आ सकती है। यहाँ कर्म मानव राजा दाऊद है और ‘मुँह के बल भूमि पर’ शारीरिक मुद्रा स्पष्ट करता है; अतः ‘आराधना’ का धार्मिक अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘मुँह के बल भूमि पर’ पूर्ण दण्डवत मुद्रा को स्पष्ट करता है। पाठ में कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि प्रसंग ‘उसकी ओर आ रहे हैं’ का समर्थन करता है और मुख्य पाठ सहज है।
