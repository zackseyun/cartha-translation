base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/002.yaml
  text: So the king said to Joab[a], the commander of the army who was with him, “Go about now through all the tribes of Israel, from Dan to Beer-sheba, and count the people, so that I may know the number of the people.”
translation:
  language: hi
  text: तब राजा ने उस सेनापति योआब से, जो उसके साथ था, कहा, “अब इस्राएल के सभी गोत्रों में, दान से लेकर बेर्शेबा तक, घूम आओ और लोगों की गिनती[a] करो, ताकि मैं लोगों की संख्या जान सकूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोगों का पंजीकरण करो।” इब्रानी क्रिया का अर्थ लोगों को गिनना या उनके नाम दर्ज करना हो सकता है; कभी-कभी इसका प्रयोग सैनिक संदर्भ में भी होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक रूप से घटनाक्रम व्यक्त करता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: मूल पाठ यहाँ दाऊद का नाम नहीं, उसकी उपाधि देता है; इसलिए उपाधि ही रखी गई है।
- source_word: שַׂר הַחַיִל
  choice: सेनापति
  rationale: यह पद सेना के प्रधान अधिकारी को दर्शाता है; ‘सेनापति’ संक्षिप्त, स्पष्ट और प्रचलित हिन्दी है।
- source_word: אֲשֶׁר אִתּוֹ
  choice: अपने साथ उपस्थित
  rationale: योआब के राजा के साथ होने का भाव स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: שׁוּט נָא
  choice: अब ... घूम आओ
  rationale: שׁוּט किसी क्षेत्र में घूमने या उसका चक्कर लगाने को दर्शाता है और נָא आदेश को कुछ नरम करता है; ‘अब’ और ‘घूम आओ’ मिलकर राजकीय निर्देश को सहज हिन्दी में रखते हैं।
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी गोत्रों में
  rationale: गति-सूचक क्रिया के साथ यह वाक्यांश सभी गोत्रीय क्षेत्रों में भ्रमण का संकेत देता है।
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: दान से लेकर बेर्शेबा तक
  rationale: यह पूरे देश की उत्तर-दक्षिण सीमा बताने वाला पारंपरिक युग्म है; स्थान-नामों का हिन्दी लिप्यंतरण किया गया है।
- source_word: וּפִקְדוּ
  choice: गिनती करो
  rationale: संदर्भ में क्रिया जनगणना या नाम दर्ज करने को सूचित करती है। मुख्य पाठ में सरल ‘गिनती’ रखा गया है और पंजीकरण की निकटवर्ती सम्भावना पादटिप्पणी में दी गई है।
- source_word: אֶת הָעָם
  choice: लोगों की
  rationale: עָם का व्यापक अर्थ ‘लोग’ है। सैन्य संदर्भ के बावजूद इसे केवल सैनिकों तक सीमित नहीं किया गया।
- source_word: וְיָדַעְתִּי
  choice: ताकि मैं ... जान सकूँ
  rationale: संदर्भ में यह आदेश का उद्देश्य बताता है; ‘ताकि’ उस प्रयोजन को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: מִסְפַּר הָעָם
  choice: लोगों की संख्या
  rationale: यह मूल रचना का सीधा और सहज हिन्दी रूप है।
theological_decisions:
- issue: सैन्य-प्रशासनिक संदर्भ में הָעָם का दायरा
  choice: लोग
  alternative: योद्धा / सैनिक
  rationale: योआब सेनापति है और गणना का सैन्य प्रयोजन हो सकता है, फिर भी मूल पाठ में सामान्य संज्ञा עָם है, कोई विशिष्ट सैनिक शब्द नहीं। इसलिए अनुवाद उसके दायरे को अनावश्यक रूप से संकीर्ण नहीं करता।
- issue: וּפִקְדוּ में गणना और पंजीकरण का संबंध
  choice: गिनती करो
  alternative: पंजीकरण करो / सैनिक सेवा के लिए नाम दर्ज करो
  rationale: क्रिया संख्या लेने के साथ औपचारिक नामांकन का अर्थ भी दे सकती है। मुख्य पाठ में सर्वाधिक स्पष्ट अर्थ रखा गया है, जबकि सैन्य नामांकन को निश्चित मानकर पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘गोत्र’, ‘सेनापति’ और ‘बेर्शेबा’ जैसे स्थापित बाइबलीय शब्द बनाए गए हैं। हिन्दी के ‘करो’ रूप में एकवचन और बहुवचन दोनों सम्भव होने से शׁוּט के एकवचन और וּפִקְדוּ के बहुवचन के बीच मूल पाठ का सूक्ष्म बदलाव बिना कृत्रिम विस्तार के खुला रहता है।
