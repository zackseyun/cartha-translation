  yaml_path: translation/ot/2_samuel/024/014.yaml
  text: Then David said to Gad[a], “I am in great distress. Let us fall, please, into the hand of Yahweh, for his mercies are many[b]; but let me not fall into the hand of man.”
translation:
  language: hi
  text: तब दाऊद ने गाद से कहा, “मैं बड़े संकट में हूँ। आओ, हम याहवे के हाथ में पड़ें, क्योंकि उसकी दयाएँ बहुत हैं[a]; पर मैं मनुष्य के हाथ में न पड़ूँ[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि उसकी करुणा अपार है।” इब्रानी में शाब्दिक रूप से, “क्योंकि उसकी दयाएँ बहुत हैं।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में, “मनुष्य के हाथ में”; अर्थात् मनुष्य के अधिकार या नियंत्रण में।
    reason: lexical_alternative
lexical_decisions:
- source_word: צַר לִי מְאֹד
  choice: मैं बड़े संकट में हूँ
  rationale: यह पदबंध दाऊद की तीव्र व्यक्तिगत व्यथा और कठिन परिस्थिति दोनों को व्यक्त करता है। यह हिंदी में स्वाभाविक है और मूल की भावनात्मक तीव्रता बनाए रखता है।
- source_word: נִפְּלָה נָּא
  choice: हम ... ही पड़ें
  rationale: प्रथम पुरुष बहुवचन कोहोर्टेटिव के कारण ‘हम’ रखा गया है; इससे दाऊद का स्वयं को प्रजा के साथ न्याय के अधीन मानना प्रकट होता है। ‘ही’ आगे आने वाले विरोध को उभारता है और נָא की आग्रहपूर्ण भाव-छाया को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בְיַד יְהוָה
  choice: याहवे के हाथ में
  rationale: ‘हाथ में पड़ना’ किसी के अधिकार या नियंत्रण में सौंपे जाने का इब्रानी मुहावरा है। हिंदी में भी यह रूप अर्थपूर्ण और स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम है; इसलिए किसी उपाधि से बदलने के बजाय उसका लिप्यंतरण किया गया है।
- source_word: כִּי רַבִּים רחמיו
  choice: क्योंकि उसकी करुणाएँ बहुत हैं
  rationale: बहुवचन רחמיו और बहुवचन विशेषण רַבִּים को बनाए रखा गया है। ‘करुणाएँ’ परमेश्वर की अनेक दयापूर्ण अभिव्यक्तियों का भाव देता है, यद्यपि हिंदी में एकवचन ‘करुणा’ भी संभव है।
- source_word: וּבְיַד אָדָם
  choice: पर ... मनुष्य के हाथ में
  rationale: एकवचन אָדָם यहाँ सामान्य रूप से मानव को दर्शाता है और याहवे के साथ जानबूझकर विरोध बनाता है। ‘मनुष्य’ आधुनिक हिंदी में इस सामान्य अर्थ को स्पष्ट रखता है।
- source_word: אַל אֶפֹּלָה
  choice: मैं ... न पड़ूँ
  rationale: निषेध के साथ प्रथम पुरुष एकवचन रूप दाऊद की इच्छा या विनती व्यक्त करता है। ‘मैं न पड़ूँ’ इस भाव को सीधे बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: यहाँ मूल में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: אָדָם का याहवे के साथ विरोध
  choice: मनुष्य
  alternative: मनुष्यों / मानव-हाथों
  rationale: मूल का सामान्य एकवचन मानव-सत्ता को ईश्वरीय सत्ता के सामने रखता है। ‘मनुष्य’ उस एकवचन और आलंकारिक विरोध दोनों को सुरक्षित रखता है।
- issue: רחמיו का बहुवचन
  choice: करुणाएँ
  alternative: करुणा बहुत बड़ी है
  rationale: बहुवचन पाठ परमेश्वर की बहुआयामी अथवा बार-बार प्रकट होने वाली करुणा को व्यक्त कर सकता है। इसे एकवचन में बदलना संभव है, पर मूल की संख्या को सुरक्षित रखना अधिक पारदर्शी है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है, पर शैली कथात्मक और गरिमापूर्ण रखी गई है। ‘हाथ में पड़ना’ मूल मुहावरे को सुरक्षित रखते हुए हिंदी में भी सहज है। ईश्वरीय नाम ‘याहवे’ के रूप में दिया गया है।
