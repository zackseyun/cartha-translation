source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ דָּוִ֨ד אֶל יְהוָ֜ה בִּ/רְאֹת֣/וֹ אֶֽת הַ/מַּלְאָ֣ךְ הַ/מַּכֶּ֣ה בָ/עָ֗ם וַ/יֹּ֨אמֶר֙ הִנֵּ֨ה אָנֹכִ֤י חָטָ֨אתִי֙ וְ/אָנֹכִ֣י הֶעֱוֵ֔יתִי וְ/אֵ֥לֶּה הַ/צֹּ֖אן מֶ֣ה עָשׂ֑וּ תְּהִ֨י נָ֥א יָדְ/ךָ֛ בִּ֖/י וּ/בְ/בֵ֥ית אָבִֽ/י־׀־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/017.yaml
  text: Then David said to the LORD, when he saw the angel striking the people, “Look, I have sinned, and I have done wrong; but these sheep—what have they done? Please let your hand be against me and against my father's house.”
translation:
  language: hi
  text: जब दाऊद ने उस स्वर्गदूत को लोगों को मारते देखा, तब उसने यहोवा से कहा, “देख, पाप मैंने किया है और मैंने बुरा काम किया है; पर इन भेड़ों ने क्या किया है? कृपा करके तेरा हाथ मेरे और मेरे पिता के घराने के विरुद्ध हो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित और स्पष्ट रूप में रखा गया है।
- source_word: הַמַּלְאָךְ
  choice: स्वर्गदूत
  rationale: संदर्भ में यह ईश्वर का भेजा हुआ अलौकिक दूत है; आधुनिक हिन्दी में ‘स्वर्गदूत’ सहज और गरिमापूर्ण है।
- source_word: הַמַּכֶּה
  choice: मारते
  rationale: हिब्रू कृदंत का अर्थ लोगों पर प्राणघातक प्रहार करना है; ‘मारते’ इसकी तीव्रता बनाए रखता है।
- source_word: הִנֵּה
  choice: देख
  rationale: दाऊद की आकस्मिक और भावपूर्ण स्वीकारोक्ति को सीधे संबोधन के रूप में व्यक्त करता है।
- source_word: הֶעֱוֵיתִי
  choice: दोषी मैं ही हूँ
  rationale: क्रिया नैतिक कुटिलता/गलत काम करने की स्वीकारोक्ति बताती है; कर्ता की पुनरुक्ति पर बल रखने के लिए ‘मैं ही’ रखा गया है।
- source_word: הַצֹּאן
  choice: इन भेड़ों
  rationale: शाब्दिक चरवाही रूपक को सुरक्षित रखा गया है, जिसमें लोग निर्दोष झुंड के रूप में दिखते हैं।
- source_word: יָדְךָ
  choice: तेरा हाथ
  rationale: ईश्वरीय प्रहार या दंड के हिब्रू रूपक को बिना व्याख्यात्मक विस्तार के ज्यों का त्यों रखा गया है।
- source_word: בֵית אָבִי
  choice: मेरे पिता के घराने
  rationale: ‘घर’ यहाँ केवल भवन नहीं, बल्कि परिवार/वंश को दर्शाता है; ‘घराना’ आधुनिक हिन्दी में यह अर्थ स्पष्ट करता है।
theological_decisions:
- issue: दाऊद की दोष-स्वीकारोक्ति और लोगों की निर्दोषता का तनाव
  choice: ‘पाप मैंने किया है और दोषी मैं ही हूँ; पर इन भेड़ों ने क्या किया है?’
  alternative: लोगों को पूर्णतः पापरहित घोषित करना या दाऊद के कथन को कथावाचक का अंतिम निर्णय बनाना
  rationale: पाठ दाऊद का भावपूर्ण प्रश्न प्रस्तुत करता है; अनुवाद उसके दृष्टिकोण को रखता है, उससे आगे कोई धर्मवैचारिक निष्कर्ष नहीं जोड़ता।
- issue: दंड का दाऊद और उसके पिता के घराने पर आने का निवेदन
  choice: ‘तेरा हाथ मेरे और मेरे पिता के घराने के विरुद्ध हो’
  alternative: ‘मुझे और मेरे परिवार को दंड दे’
  rationale: ‘हाथ’ के मूल रूपक और निवेदन की संरचना को सुरक्षित रखा गया है, ताकि दंड की प्रकृति को अनावश्यक रूप से सीमित न किया जाए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सीधी किंतु गरिमापूर्ण रखी गई है। ‘देख’ भावपूर्ण बाइबिलीय उद्गार है; ‘इन भेड़ों’ मूल रूपक को बनाए रखता है। वाक्यक्रम को हिन्दी की स्वाभाविकता के अनुरूप बदला गया है, जबकि दाऊद की दोहरी आत्म-स्वीकारोक्ति का बल सुरक्षित है।
