  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּבֹא גָ֥ד אֶל דָּוִ֖ד בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֹּ֣אמֶר ל֗/וֹ עֲלֵה֙ הָקֵ֤ם לַֽ/יהוָה֙ מִזְבֵּ֔חַ בְּ/גֹ֖רֶן ארניה הַ/יְבֻסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/018.yaml
  text: That day Gad came to David and said to him[c][b][a], “Go up and set up an altar to Yahweh on the threshing floor of Araunah the Jebusite.”
translation:
  language: hi
  text: उसी दिन गाद दाऊद के पास आया और उससे कहा, “ऊपर जा और यबूसी अरौना[a] के खलिहान पर याहवे के लिए एक वेदी खड़ी कर।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 इतिहास 21:18 में यह नाम ‘ओरनान’ है।
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: आया
  rationale: בוא का कथात्मक रूप यहाँ गाद के दाऊद के पास आने को व्यक्त करता है; ‘प्रवेश किया’ अनावश्यक रूप से विशिष्ट होता।
- source_word: בַּיּוֹם הַהוּא
  choice: उसी दिन
  rationale: यह इब्रानी के निश्चित समय-संकेत ‘उस दिन’ को स्वाभाविक हिन्दी में व्यक्त करता है और पिछले प्रसंग से संबंध भी बनाए रखता है।
- source_word: עֲלֵה
  choice: ऊपर जा
  rationale: עלה के दिशात्मक अर्थ ‘ऊपर जाना/चढ़ना’ को बनाए रखता है; केवल ‘जा’ कहने से यह तत्व छूट जाता।
- source_word: הָקֵם
  choice: खड़ी कर
  rationale: קום के हिफ़ईल आज्ञार्थक का मूल भाव ‘खड़ा करना/स्थापित करना’ है; वेदी के संदर्भ में ‘खड़ी कर’ सहज और स्रोत के निकट है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל यहाँ समर्पण अथवा उद्देश्य बताता है। ‘के लिए’ आधुनिक हिन्दी में स्वाभाविक है और वेदी के याहवे को समर्पित होने का भाव रखता है।
- source_word: בְּגֹרֶן
  choice: खलिहान पर
  rationale: वेदी को उस स्थल पर खड़ा करने के संदर्भ में ב का स्थानवाचक अर्थ ‘पर’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: ארניה
  choice: अरौना
  rationale: शमूएल की इब्रानी परंपरा में आए नाम-रूप को लिप्यंतरित किया गया है; समानांतर इतिहासवृत्त में ‘ओरनान’ मिलता है।
- source_word: הַיְבֻסִי
  choice: यबूसी
  rationale: यह अरौना की जातीय पहचान बताने वाला मानक जातिवाचक रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में चार-अक्षरीय वाचा-नाम יהוה स्पष्ट रूप से है। उसका लिप्यंतरण मूल की विशिष्टता बनाए रखता है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: לַיהוָה में संबंध का अर्थ
  choice: याहवे के लिए
  alternative: याहवे को
  rationale: ל समर्पण और लक्ष्य दोनों व्यक्त कर सकता है। हिन्दी में ‘के लिए’ वेदी के समर्पण का भाव सहजता से देता है, जबकि ‘को’ भी व्याकरणतः संभव है; मूल की सीमा से आगे कोई विशिष्ट बलिदानी सिद्धांत नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘वेदी खड़ी कर’ स्रोत के क्रियात्मक रूप के निकट है, जबकि ‘ऊपर जा’ स्थान की ओर गति को सुरक्षित रखता है। नामों के लिए प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं।
