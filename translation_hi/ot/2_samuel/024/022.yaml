  text: וַ/יֹּ֤אמֶר אֲרַ֨וְנָה֙ אֶל דָּוִ֔ד יִקַּ֥ח וְ/יַ֛עַל אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ הַ/טּ֣וֹב ב/עינ/ו רְאֵה֙ הַ/בָּקָ֣ר לָ/עֹלָ֔ה וְ/הַ/מֹּרִגִּ֛ים וּ/כְלֵ֥י הַ/בָּקָ֖ר לָ/עֵצִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/022.yaml
  text: Then Araunah said to David[a], “Let my lord the king take and offer up what is good in his eyes. Look, the oxen are for the burnt offering[b], and the threshing sledges and the implements of the oxen are for the wood.”
translation:
  language: hi
  text: तब अरौना ने दाऊद से कहा, “मेरे प्रभु राजा, जो उनकी दृष्टि में अच्छा हो[a], उसे ले लें और चढ़ाएँ। देखिए, होम-बलि के लिए बैल हैं, और ईंधन की लकड़ी के रूप में अनाज दाँवने के तख्ते और बैलों के साज-सामान[b] हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उन्हें उचित लगे।” हिब्रू मुहावरे का शाब्दिक अर्थ है, “जो उनकी आँखों में अच्छा हो।”
    reason: lexical_alternative
  - marker: b
    text: हिब्रू पद व्यापक है और इसका संकेत बैलों के साथ इस्तेमाल होने वाले लकड़ी के उपकरणों की ओर हो सकता है, जिन्हें ईंधन बनाया जाना था।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: יִקַּח
  choice: ले लें
  rationale: प्रत्यक्ष कथन में यह रूप आदरपूर्वक अनुमति और निमंत्रण व्यक्त करता है; हिंदी में आदरसूचक बहुवचन इस दरबारी विनम्रता को स्वाभाविक रूप से रखता है।
- source_word: וְיַעַל
  choice: और चढ़ा दें
  rationale: बलिदान के प्रसंग में עלה का अर्थ वेदी पर अर्पित करना है। ‘चढ़ा दें’ आगे आए עֹלָה (‘होम-बलि’) के साथ अर्थगत संबंध भी बनाए रखता है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: मेरे प्रभु राजा
  rationale: यह सम्मानसूचक संबोधन और राजकीय उपाधि का संयुक्त प्रयोग है; हिंदी में यह गरिमापूर्ण और बोधगम्य है।
- source_word: הַטּוֹב בְּעֵינָיו
  choice: जो उनकी दृष्टि में अच्छा हो
  rationale: हिब्रू मुहावरे को पारदर्शी रूप में रखा गया है। ‘उनकी’ राजा के लिए आदरसूचक तृतीय पुरुष है और मूल पाठ में संबोधन से तृतीय पुरुष की ओर हुए बदलाव को सुरक्षित रखता है।
- source_word: רְאֵה
  choice: देखिए
  rationale: यह सामने उपलब्ध वस्तुओं की ओर ध्यान खींचने वाला संबोधन है; ‘देखिए’ आधुनिक हिंदी में स्वाभाविक और सम्मानसूचक है।
- source_word: הַבָּקָר
  choice: बैल
  rationale: ये दाँवने के काम में लगाए जाने वाले पशु हैं और बलि के लिए प्रस्तुत किए जा रहे हैं; प्रसंग में व्यापक ‘मवेशी’ की अपेक्षा ‘बैल’ अधिक सटीक है।
- source_word: לָעֹלָה
  choice: होम-बलि के लिए
  rationale: עֹלָה उस बलि को दर्शाता है जो वेदी पर पूरी तरह जलाई जाती थी; ‘होम-बलि’ हिंदी बाइबलीय प्रयोग में संक्षिप्त और स्थापित पद है।
- source_word: הַמֹּרִגִּים
  choice: अनाज दाँवने के तख्ते
  rationale: מֹרַג अनाज दाँवने के लिए प्रयुक्त भारी तख्ते या पटरे जैसा उपकरण था। यह रूप वस्तु के कार्य को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: כְלֵי הַבָּקָר
  choice: बैलों के साज-सामान
  rationale: כְּלִי व्यापक शब्द है और यहाँ बैलों से जुड़े लकड़ी के उपकरणों को सूचित करता है। ‘साज-सामान’ किसी एक वस्तु, जैसे केवल जुए, तक अर्थ को अनुचित रूप से सीमित नहीं करता।
- source_word: לָעֵצִים
  choice: जलाने की लकड़ी के लिए
  rationale: संदर्भ में इन लकड़ी के उपकरणों को बलि की आग के ईंधन के रूप में इस्तेमाल करना है; यह अनुवाद उस प्रयोजन को स्पष्ट करता है।
