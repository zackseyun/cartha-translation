base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/016.yaml
  text: When the angel stretched out his hand toward Jerusalem to destroy it[a], Yahweh relented concerning the calamity and said to the angel who was destroying the people, “Enough[b]; now withdraw your hand.” And the angel of Yahweh was by the threshing floor of Araunah the Jebusite.
translation:
  language: hi
  text: जब स्वर्गदूत ने यरूशलेम को नष्ट करने के लिए उसकी ओर अपना हाथ बढ़ाया, तब याहवे ने उस विपत्ति के विषय में अपना मन बदल लिया[a] और लोगों का नाश कर रहे स्वर्गदूत से कहा, “बस! अब अपना हाथ रोक ले।” उस समय याहवे का स्वर्गदूत अरौना यबूसी के खलिहान के पास था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे उस विपत्ति से रुक गया।” इब्रानी में शाब्दिक भाव “विपत्ति के विषय में मन बदलना/पछताना” है। यहाँ רָעָה का अर्थ नैतिक बुराई नहीं, बल्कि विपत्ति या आपदा है।
    reason: lexical_alternative
  - marker: b
    text: 1 इतिहास 21:15 के समानांतर वृत्तांत में अरौना को “ओर्नान” कहा गया है।
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: अपना हाथ बढ़ाया
  rationale: שׁלח + יד क्रिया करने के लिए हाथ आगे बढ़ाने का मुहावरा है; यह चयन मूल की सजीव छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַמַּלְאָךְ
  choice: स्वर्गदूत
  rationale: इस प्रसंग में यह महामारी और न्याय को कार्यान्वित करने वाला अलौकिक दूत है; इसलिए सामान्य ‘दूत’ की अपेक्षा ‘स्वर्गदूत’ अधिक स्पष्ट है।
- source_word: לְשַׁחֲתָהּ
  choice: उसे नष्ट करने के लिए
  rationale: स्त्रीलिंग प्रत्यय यरूशलेम की ओर संकेत करता है और שׁחת यहाँ विनाशकारी कार्रवाई व्यक्त करता है।
- source_word: וַיִּנָּחֶם יְהוָה אֶל הָרָעָה
  choice: याहवे ने उस विपत्ति के विषय में अपना मन फेर लिया
  rationale: निफ़अल נחם यहाँ घोषित विनाश से रुकने या अपना रुख बदलने का भाव देता है। ‘विपत्ति’ רָעָה को नैतिक बुराई के बजाय आई हुई आपदा के अर्थ में प्रस्तुत करता है, जबकि ‘के विषय में’ אֶל की दिशा को बचाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: הַמַּשְׁחִית בָּעָם
  choice: लोगों का नाश कर रहे
  rationale: वर्तमान कृदंत स्वर्गदूत की जारी विनाशकारी कार्रवाई बताता है; हिन्दी में संबंधवाचक कृदंतीय पद स्वाभाविक है।
- source_word: רַב
  choice: बस!
  rationale: यहाँ רַב पर्याप्तता बताने वाला संक्षिप्त उद्गार है; ‘बस!’ उसकी तात्कालिक आज्ञात्मक शक्ति व्यक्त करता है।
- source_word: עַתָּה הֶרֶף יָדֶךָ
  choice: अब अपना हाथ रोक ले
  rationale: הרף कार्रवाई बंद करने की आज्ञा है। ‘हाथ रोक ले’ मूल बिंब और मुहावरे का अर्थ दोनों बनाए रखता है।
- source_word: מַלְאַךְ יְהוָה
  choice: याहवे का स्वर्गदूत
  rationale: रचना-संबंध को सहज हिन्दी में रखा गया है और दूत की आगे की धार्मिक पहचान तय नहीं की गई।
- source_word: הָיָה עִם
  choice: के पास था
  rationale: स्थानवाचक प्रसंग में עִם निकटता दर्शाता है; ‘के पास’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: גֹּרֶן
  choice: खलिहान
  rationale: यह अनाज दाँवने या मड़ाई करने के स्थान का प्रचलित और बोधगम्य हिन्दी शब्द है।
- source_word: הָאֹרְנָה
  choice: अरौना
  rationale: शमूएल की पुस्तक में आए नाम के रूप को देवनागरी में लिप्यंतरित किया गया है; इतिहास-वृत्तांत के समानांतर पाठ का ‘ओर्नान’ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: וַיִּנָּחֶם יְהוָה में परमेश्वर के लिए मानवीय भाव और रुख की भाषा
  choice: याहवे ने उस विपत्ति के विषय में अपना मन फेर लिया
  alternative: याहवे उस विपत्ति पर पछताया / याहवे विपत्ति लाने से रुक गया
  rationale: चयन न्याय की कार्रवाई से याहवे के मुड़ने को स्पष्ट करता है, पर यह नहीं कहता कि उसने कोई नैतिक भूल की थी। साथ ही मूल पाठ में परमेश्वर के रुख के परिवर्तन जैसी सुनाई देने वाली वास्तविक तनावपूर्ण भाषा पूरी तरह हटाई नहीं गई है।
- issue: מַלְאַךְ יְהוָה की पहचान
  choice: याहवे का स्वर्गदूत
  alternative: परमेश्वर का दृश्य प्रकट रूप / एक सृजित स्वर्गदूत
  rationale: पद केवल इस पात्र को याहवे का स्वर्गदूत कहता है; अनुवाद यह तय नहीं करता कि वह सृजित दूत है या परमेश्वर का विशेष प्रकट रूप।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बस!’ तथा ‘अपना हाथ रोक ले’ आज्ञा की तात्कालिकता और मूल के हाथ वाले बिंब को बनाए रखते हैं। पादटिप्पणी-चिह्नों को उनकी वास्तविक विषयवस्तु से संबंधित स्थानों पर रखा गया है।
