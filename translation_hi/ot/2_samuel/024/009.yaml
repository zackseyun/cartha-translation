source:
  edition: WLC
  text: וַ/יִּתֵּ֥ן יוֹאָ֛ב אֶת מִסְפַּ֥ר מִפְקַד הָ/עָ֖ם אֶל הַ/מֶּ֑לֶךְ וַ/תְּהִ֣י יִשְׂרָאֵ֡ל שְׁמֹנֶה֩ מֵא֨וֹת אֶ֤לֶף אִֽישׁ חַ֨יִל֙ שֹׁ֣לֵֽף חֶ֔רֶב וְ/אִ֣ישׁ יְהוּדָ֔ה חֲמֵשׁ מֵא֥וֹת אֶ֖לֶף אִֽישׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/009.yaml
  text: 'Joab gave the number of the census of the people to the king: Israel was eight hundred thousand valiant men who drew the sword[a], and the men of Judah were five hundred thousand men.'
translation:
  language: hi
  text: योआब ने प्रजा की गिनती का कुल आँकड़ा राजा को दिया। इस्राएल में तलवार खींचने वाले आठ लाख वीर योद्धा थे[a], और यहूदा के पुरुष पाँच लाख थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 इतिहास 21:5 के समानांतर विवरण में संख्याएँ अलग हैं—इस्राएल के ग्यारह लाख और यहूदा के चार लाख सत्तर हज़ार। यहाँ संख्याओं में सामंजस्य बैठाए बिना 2 शमूएल के इब्रानी पाठ का अनुसरण किया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: מִסְפַּר מִפְקַד הָעָם
  choice: प्रजा की गिनती का कुल आँकड़ा
  rationale: यह पदबंध जनगणना या सैन्य गिनती से प्राप्त संख्या को दर्शाता है। ‘कुल आँकड़ा’ अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַתְּהִי יִשְׂרָאֵל
  choice: इस्राएल में ... थे
  rationale: सामूहिक नाम के साथ आए परिणामसूचक वाक्य को हिन्दी में अस्तित्ववाचक रचना से स्वाभाविक रूप दिया गया है।
- source_word: שְׁמֹנֶה מֵאוֹת אֶלֶף
  choice: आठ लाख
  rationale: हिन्दी संख्या-पद्धति में 800,000 का स्वाभाविक और ठीक रूप ‘आठ लाख’ है।
- source_word: אִישׁ חַיִל
  choice: वीर योद्धा
  rationale: सैन्य जनगणना के संदर्भ में यह पद सामर्थ्यवान या युद्ध-योग्य पुरुषों को सूचित करता है; ‘वीर योद्धा’ इसके सैनिक और पराक्रमी दोनों भाव रखता है।
- source_word: שֹׁלֵף חֶרֶב
  choice: तलवार खींचने वाले
  rationale: मूल के ठोस सैन्य बिंब को बनाए रखा गया है; यह युद्ध करने योग्य पुरुषों के लिए प्रयुक्त अभिव्यक्ति है।
- source_word: וְאִישׁ יְהוּדָה
  choice: यहूदा के पुरुष
  rationale: एकवचन रूप यहाँ सामूहिक अर्थ रखता है, इसलिए हिन्दी में बहुवचन स्वाभाविक है।
- source_word: חֲמֵשׁ מֵאוֹת אֶלֶף אִישׁ
  choice: पाँच लाख थे
  rationale: 500,000 को हिन्दी संख्या-पद्धति में ‘पाँच लाख’ कहा गया है। निकटवर्ती ‘पुरुष’ के कारण अंत में उसकी पुनरावृत्ति आवश्यक नहीं और अर्थ पूर्णतः सुरक्षित है।
theological_decisions:
- issue: 1 इतिहास 21:5 के समानांतर विवरण से संख्यात्मक भिन्नता
  choice: 2 शमूएल के मसोरेटिक पाठ के अनुसार इस्राएल के आठ लाख और यहूदा के पाँच लाख पुरुष
  alternative: 1 इतिहास की संख्याओं से सामंजस्य बैठाना या सैनिक श्रेणियों के आधार पर अंतर की व्याख्या मुख्य पाठ में जोड़ना
  rationale: अनुवाद स्रोत-पाठ की संख्याएँ बिना सामंजस्यकारी अनुमान के प्रस्तुत करता है। समानांतर विवरण का अंतर पाद-टिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण वर्णनात्मक गद्य। ‘प्रजा की गिनती’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘तलवार खींचने वाले’ मूल के सैन्य बिंब को सुरक्षित रखता है।
