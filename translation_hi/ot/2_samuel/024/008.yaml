translation:
  language: hi
  text: वे पूरे देश में घूमे, और नौ महीने और बीस दिन के अंत में यरूशलेम पहुँचे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁטוּ
  choice: वे ... घूमे
  rationale: שׁוט किसी क्षेत्र में इधर-उधर जाकर उसे छानने का भाव देता है। जनगणना के लिए किए गए व्यापक भ्रमण के संदर्भ में ‘घूमे’ स्वाभाविक है और लक्ष्यहीन भटकने का अनावश्यक भाव नहीं जोड़ता।
- source_word: בְּכָל הָאָרֶץ
  choice: पूरे देश में
  rationale: ב + כל + הארץ यहाँ समूचे संबंधित भूभाग में आवागमन को व्यक्त करता है। संदर्भ में ‘देश’ ‘पृथ्वी’ या ‘भूमि’ से अधिक स्पष्ट है।
- source_word: וַיָּבֹאוּ ... יְרוּשָׁלִָם
  choice: यरूशलेम लौट आए
  rationale: בוא का मूल अर्थ ‘आना/पहुँचना’ है। दल यरूशलेम से भेजा गया था (24:4), इसलिए हिंदी में ‘लौट आए’ गंतव्य और कथानक को स्वाभाविक रूप से व्यक्त करता है; लौटने का भाव निकट संदर्भ से स्पष्ट है।
- source_word: מִקְצֵה
  choice: पूरे होने पर
  rationale: समयावधि के साथ यह उसकी समाप्ति-बिंदु को दर्शाता है। ‘पूरे होने पर’ आधुनिक हिंदी में सहज है और ‘अंत में’ की संभावित क्रमसूचक अस्पष्टता से बचता है।
- source_word: תִשְׁעָה חֳדָשִׁים וְעֶשְׂרִים יוֹם
  choice: नौ महीने और बीस दिन
  rationale: यह अवधि का सीधा संख्यात्मक कथन है; हिंदी में यही स्वाभाविक और सटीक रूप है।
- source_word: יְרוּשָׁלִָם
  choice: यरूशलेम
  rationale: स्थान-नाम का प्रचलित मानक हिंदी लिप्यंतरण।
