id: 2SA.24.25
reference: 2 Samuel 24:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּבֶן֩ שָׁ֨ם דָּוִ֤ד מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה וַ/יַּ֥עַל עֹל֖וֹת וּ/שְׁלָמִ֑ים וַ/יֵּעָתֵ֤ר יְהוָה֙ לָ/אָ֔רֶץ וַ/תֵּעָצַ֥ר הַ/מַּגֵּפָ֖ה מֵ/עַ֥ל יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/025.yaml
  text: There David built an altar to Yahweh and offered up burnt offerings and peace offerings[a]. So Yahweh responded to the land[c][b], and the plague was restrained from Israel.
translation:
  language: hi
  text: वहाँ दाऊद ने याहवे[a] के लिए एक वेदी बनाई और होमबलियाँ तथा मेलबलियाँ[b] चढ़ाईं। तब याहवे ने देश के लिए की गई विनती स्वीकार की[c], और इस्राएल पर से महामारी थम गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘याहवे’ इब्रानी में परमेश्वर के नाम YHWH का रूप है।
    reason: lexical_alternative
  - marker: b
    text: ‘मेलबलियाँ’ का अनुवाद ‘शांति-बलियाँ’ या ‘सहभागिता-बलियाँ’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी पदबंध का अर्थ यह भी व्यक्त किया जा सकता है: “याहवे ने देश के लिए प्रार्थना सुनी” या “याहवे देश के प्रति अनुकूल हुए।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן שָׁם דָּוִד מִזְבֵּחַ
  choice: वहाँ दाऊद ने एक वेदी बनाई
  rationale: वाक्यक्रम और स्थानसूचक שָׁם को बनाए रखते हुए सहज आधुनिक हिन्दी; מִזְבֵּחַ के लिए प्रचलित ‘वेदी’ सटीक है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: לְ यहाँ वेदी के समर्पण अथवा उद्देश्य को दर्शाता है; परमेश्वर के विशिष्ट नाम יהוה को ‘याहवे’ लिखा गया है।
- source_word: וַיַּעַל עֹלוֹת
  choice: होमबलियाँ चढ़ाईं
  rationale: עלה का बलिदान-संबंधी प्रयोग ‘चढ़ाना’ है और עֹלוֹת के लिए ‘होमबलियाँ’ हिन्दी बाइबलीय भाषा में स्थापित तथा संक्षिप्त शब्द है।
- source_word: וּשְׁלָמִים
  choice: मेलबलियाँ
  rationale: यह शांति, संगति और साझे भोज से जुड़ी बलि-श्रेणी है; ‘मेलबलियाँ’ उसका प्रचलित हिन्दी नाम है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וַיֵּעָתֵר יְהוָה לָאָרֶץ
  choice: तब याहवे ने देश के लिए की गई विनती स्वीकार की
  rationale: עתר का निफ़ाल रूप विनती के प्रति अनुकूल उत्तर देने का भाव रखता है। हिन्दी में ‘विनती स्वीकार की’ इस अंतर्निहित भाव को स्वाभाविक रूप से व्यक्त करता है; לָאָרֶץ को ‘देश के लिए’ रखा गया है।
- source_word: וַתֵּעָצַר הַמַּגֵּפָה מֵעַל יִשְׂרָאֵל
  choice: इस्राएल पर से महामारी थम गई
  rationale: ‘थम गई’ महामारी के रोक दिए जाने का परिणाम सहज हिन्दी में व्यक्त करता है और מֵעַל का ‘पर से’ संबंध भी बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में विशिष्ट वाचा-नाम יהוה है। ‘याहवे’ उसे सामान्य उपाधि में बदले बिना प्रत्यक्ष नाम के रूप में प्रस्तुत करता है।
- issue: וַיֵּעָתֵר में ईश्वरीय प्रत्युत्तर का अर्थ
  choice: याहवे ने देश के लिए की गई विनती स्वीकार की
  alternative: याहवे देश के प्रति अनुकूल हुए; याहवे ने देश के लिए प्रार्थना सुनी
  rationale: क्रिया स्वयं विनती के अनुकूल प्रत्युत्तर का संकेत देती है, यद्यपि इस वाक्य में विनती करने वाले का नाम नहीं है। चुना हुआ रूप उस निहित अर्थ को रखता है, पर विनतीकर्ता या विस्तृत धर्मवैज्ञानिक कारण नहीं जोड़ता।
- issue: महामारी रुकने में कर्तृत्व की अभिव्यक्ति
  choice: महामारी थम गई
  alternative: महामारी रोक दी गई
  rationale: इब्रानी निष्क्रिय रूप महामारी के रोके जाने को बताता है, पर कर्ता को व्याकरणतः नहीं कहता। हिन्दी का परिणामसूचक रूप घटना को परमेश्वर के अनुकूल प्रत्युत्तर से जोड़ता है, बिना अलग से कर्ता जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘वेदी’, ‘होमबलियाँ’ और ‘मेलबलियाँ’ जैसे स्थापित धार्मिक शब्द संदर्भ की सटीकता बनाए रखते हैं; कठिन इब्रानी प्रत्युत्तर-वाक्य को मुख्य पाठ में स्वाभाविक हिन्दी और पादटिप्पणी में वैकल्पिक रूपों सहित प्रस्तुत किया गया है।
