  text: וַ/יַּ֤ךְ לֵב דָּוִד֙ אֹת֔/וֹ אַחֲרֵי כֵ֖ן סָפַ֣ר אֶת הָ/עָ֑ם וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל יְהוָ֗ה חָטָ֤אתִי מְאֹד֙ אֲשֶׁ֣ר עָשִׂ֔יתִי וְ/עַתָּ֣ה יְהוָ֔ה הַֽעֲבֶר נָא֙ אֶת עֲוֺ֣ן עַבְדְּ/ךָ֔ כִּ֥י נִסְכַּ֖לְתִּי מְאֹֽד־־־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/010.yaml
  text: After that[a], David’s heart struck him after he had counted the people. And David said to Yahweh, “I have sinned greatly in what I have done. And now, Yahweh, please take away the guilt of your servant[c][b], for I have acted very foolishly.”
translation:
  language: hi
  text: लोगों की गिनती[a] करने के बाद दाऊद के मन ने उसे धिक्कारा[b]। तब दाऊद ने याहवे से कहा, “मैंने यह काम करके बहुत बड़ा पाप किया है। अब, हे याहवे, कृपा करके अपने दास का दोष[c] दूर कर दे, क्योंकि मैंने बहुत मूर्खता का काम किया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लोगों की संख्या गिनने” अथवा “लोगों की जनगणना करने।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “दाऊद के हृदय ने उसे मारा”; यह मुहावरा अंतरात्मा के धिक्कारने या गहरी ग्लानि को व्यक्त करता है।
    reason: cultural_note
  - marker: c
    text: या “अपने दास का अधर्म” अथवा “अपने दास का अपराध।” इब्रानी शब्द अधर्म, उससे उत्पन्न दोष, और कभी-कभी उसके दंड को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ לֵב דָּוִד אֹתוֹ
  choice: दाऊद के मन ने उसे धिक्कारा
  rationale: यह इब्रानी मुहावरे के ‘मन ने उसे मारा’ वाले सजीव बिंब को काफी हद तक बनाए रखते हुए आधुनिक हिन्दी में अंतःकरण की तीव्र ग्लानि व्यक्त करता है।
- source_word: אַחֲרֵי כֵן סָפַר אֶת־הָעָם
  choice: लोगों की गिनती करने के बाद
  rationale: 'वाक्यांश घटना का समय बताता है: दाऊद की अंतरात्मा लोगों को गिनने के बाद उसे धिक्कारती है। ‘गिनती’ मूल क्रिया ספר का सीधा और सहज अर्थ है।'
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम का हिन्दी लिप्यंतरण किया गया है, किसी उपाधि से उसका स्थान नहीं लिया गया।
- source_word: חָטָאתִי מְאֹד אֲשֶׁר עָשִׂיתִי
  choice: मैंने यह काम करके बहुत बड़ा पाप किया है
  rationale: यह सहज हिन्दी में पाप की स्वीकारोक्ति और מְאֹד की तीव्रता, दोनों को व्यक्त करता है।
- source_word: הַעֲבֶר נָא
  choice: कृपा करके ... दूर कर दे
  rationale: यहाँ עבר का हिफ़ील रूप दोष को हटा देने की विनती है; ‘दूर कर दे’ हिन्दी में स्पष्ट और प्रार्थनापूर्ण है।
- source_word: עֲוֺן עַבְדְּךָ
  choice: अपने दास का दोष
  rationale: עָוֹן के अपराध, दोष और फलस्वरूप दंड तक फैले अर्थ-क्षेत्र में इस प्रार्थना के संदर्भ में ‘दोष’ उपयुक्त है; टिप्पणी अन्य संभावनाएँ सुरक्षित रखती है।
- source_word: כִּי נִסְכַּלְתִּי מְאֹד
  choice: क्योंकि मैंने बहुत मूर्खता का काम किया है
  rationale: यह क्रियात्मक अर्थ ‘बहुत मूर्खतापूर्वक व्यवहार किया’ को साधारण, स्वाभाविक हिन्दी में व्यक्त करता है और तीव्रतासूचक शब्द को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में वाचा का व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि में बदले बिना आधुनिक हिन्दी लिपि में प्रस्तुत करता है।
- issue: दाऊद की विनती में עָוֹן का अर्थ
  choice: दोष
  alternative: अधर्म; अपराध; दंड
  rationale: संदर्भ में दाऊद पाप स्वीकार करके उससे जुड़े नैतिक दोष को दूर करने की विनती करता है। फिर भी शब्द की व्यापक अर्थ-सीमा को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रार्थनापरक रूप अपनाया गया है। ‘दास’ राजकीय और धार्मिक विनम्रता के पारंपरिक संदर्भ को बनाए रखता है; भाषा को अनावश्यक रूप से पुरातन नहीं बनाया गया।
