  text: But the king’s word prevailed against Joab and against the commanders of the army, so Joab and the commanders of the army went out from before the king to count the people of Israel.
translation:
  language: hi
  text: परन्तु राजा का आदेश योआब और सेना के अधिकारियों पर भारी पड़ा। इसलिए योआब और सेना के अधिकारी राजा के सामने से इस्राएल की प्रजा की गिनती करने निकल गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱזַק דְּבַר הַמֶּלֶךְ
  choice: राजा की बात ... पर प्रबल हुई
  rationale: यह हिब्रू मुहावरा बताता है कि योआब और प्रधानों की आपत्ति के बावजूद राजा का आदेश प्रभावी रहा; ‘प्रबल हुई’ मूल की शक्ति और तनाव बनाए रखता है।
- source_word: שָׂרֵי הֶחָיִל
  choice: सेना के प्रधान
  rationale: संदर्भ में חַיִל सैन्य बल को और שָׂרֵי उसके अधिकारियों/प्रधानों को सूचित करता है।
- source_word: מִלִּפְנֵי הַמֶּלֶךְ
  choice: राजा के सामने से
  rationale: मूल स्थान-संबंधी अभिव्यक्ति को स्वाभाविक हिन्दी में निकटता से रखा गया है।
- source_word: לִפְקֹד אֶת־הָעָם אֶת־יִשְׂרָאֵל
  choice: इस्राएल के लोगों की गिनती करें
  rationale: इस प्रसंग में פקד का अर्थ जनगणना/गिनती करना है; appositional ‘लोगों, अर्थात इस्राएल’ को सहज हिन्दी में ‘इस्राएल के लोगों’ कहा गया है।
theological_decisions:
- issue: राजा के आदेश और योआब की आपत्ति के बीच तनाव
  choice: ‘राजा की बात ... पर प्रबल हुई’
  alternative: ‘राजा का आदेश मानना ही पड़ा’
  rationale: चुना गया रूप मूल की अपेक्षाकृत औपचारिक और अस्पष्ट अभिव्यक्ति को बनाए रखता है तथा योआब की मनःस्थिति के विषय में अतिरिक्त निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, स्पष्ट रूप; ‘परन्तु’, ‘प्रबल हुई’ और ‘प्रधान’ मूल की औपचारिक कथन-शैली को बनाए रखते हैं।
