base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/024.yaml
  text: But the king said to Araunah[a], “No, but I will surely buy it from you for a price[c][b]. I will not offer to Yahweh my God burnt offerings that cost me nothing.” So David bought the threshing floor and the cattle for fifty shekels of silver.
translation:
  language: hi
  text: परन्तु राजा ने अरौना से कहा, “नहीं, मैं इसे तुमसे दाम देकर ही खरीदूँगा। मैं अपने परमेश्वर यहोवा को ऐसी होमबलियाँ नहीं चढ़ाऊँगा जो मुझे कुछ भी खर्च न पड़ी हों।” तब दाऊद ने खलिहान और मवेशियों को पचास शेकेल चाँदी देकर खरीद लिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 इतिहास 21:25 में दाऊद पूरे स्थान के लिए छः सौ शेकेल सोना देता है; यहाँ खलिहान और मवेशियों का मूल्य पचास शेकेल चाँदी बताया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: אֲרַוְנָה
  choice: अरौना
  rationale: इस पद के इब्रानी नाम का देवनागरी लिप्यंतरण; इतिहास की समानांतर कथा का ‘ओर्नान’ यहाँ नहीं अपनाया गया।
- source_word: קָנוֹ אֶקְנֶה
  choice: खरीदूँगा ही
  rationale: क्रिया के साथ infinitive absolute की बलवत्ता को स्वाभाविक हिन्दी में ‘ही’ से व्यक्त किया गया है।
- source_word: בִּמְחִיר
  choice: दाम देकर
  rationale: मूल में खरीद-मूल्य अथवा भुगतान का स्पष्ट व्यावसायिक अर्थ है।
- source_word: לַיהוָה אֱלֹהַי
  choice: अपने परमेश्वर यहोवा को
  rationale: प्रथम पुरुष संबंध ‘मेरे परमेश्वर’ को हिन्दी वाक्य में स्वाभाविक रूप से ‘अपने परमेश्वर’ कहा गया और वाचा-नाम को ‘यहोवा’ रूप में रखा गया।
- source_word: עֹלוֹת
  choice: होमबलियाँ
  rationale: पूरी तरह वेदी पर जलाए जाने वाले बलिदान के लिए प्रचलित और संक्षिप्त हिन्दी शब्द।
- source_word: חִנָּם
  choice: जो मुझे बिना दाम के मिली हों
  rationale: शाब्दिक अर्थ ‘मुफ़्त/बिना मूल्य’ है; प्रसंग में दाऊद अपने लिए बिना भुगतान प्राप्त बलियाँ चढ़ाने से इनकार करता है।
- source_word: הַגֹּרֶן
  choice: खलिहान
  rationale: अनाज दाँवने के स्थान के लिए सामान्य आधुनिक हिन्दी बाइबलीय शब्द।
- source_word: הַבָּקָר
  choice: बैलों
  rationale: यह सामूहिक संज्ञा मवेशियों को सूचित कर सकती है; इस बलिदान और कृषि-प्रसंग में ‘बैल’ स्वाभाविक है, यद्यपि व्यापक ‘मवेशी’ भी संभव है।
- source_word: בְּכֶסֶף שְׁקָלִים חֲמִשִּׁים
  choice: पचास शेकेल चाँदी में
  rationale: मूल की राशि और धातु दोनों को बनाए रखते हुए सहज हिन्दी मूल्य-वाक्यांश।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; उसे ‘प्रभु’ में बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया।
- issue: חִנָּם में बलिदान की व्यक्तिगत लागत
  choice: जो मुझे बिना दाम के मिली हों
  alternative: मुफ़्त की होमबलियाँ
  rationale: अनुवाद भुगतान-विहीन प्राप्ति का प्रसंगगत आशय स्पष्ट करता है, पर यह अतिरिक्त सिद्धान्त नहीं जोड़ता कि हर स्वीकार्य बलिदान को अनिवार्यतः आर्थिक पीड़ा देनी चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दाम देकर ही’ मूल के जोर को दर्शाता है। ‘होमबलियाँ’ बलिदानी पारिभाषिकता बनाए रखता है। मुख्य पाठ के एकमात्र पादटिप्पणी-चिह्न [a] को संबंधित वाक्य के बाद रखा गया है।
