base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/013.yaml
  text: So Gad came to David and told him[a], and said to him[c][b], “Shall seven years of famine come to you in your land? Or will you flee three months before your adversaries while they pursue you? Or shall there be three days of pestilence in your land? Now know and see what answer I should return to the one who sent me.”
translation:
  language: hi
  text: तब गाद दावीद के पास आया और उसे यह बात बताई। उसने उससे कहा, “क्या तेरे देश में सात वर्ष तक अकाल पड़े[a]? या तू अपने शत्रुओं[b] के सामने से तीन महीने तक भागता रहेगा और वे तेरा पीछा करते रहेंगे? या तेरे देश में तीन दिन तक महामारी हो[c]? अब सोच-विचार कर देख कि जिसने मुझे भेजा है, उसे मैं क्या उत्तर दूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: समानांतर विवरण, 1 इतिहास 21:12, में “तीन वर्ष तक अकाल” है।
    reason: textual_variant
  - marker: b
    text: या “विरोधियों।”
    reason: lexical_alternative
  - marker: c
    text: या “प्लेग।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא גָד אֶל דָּוִד
  choice: तब गाद दावीद के पास आया
  rationale: בוא का सामान्य कथात्मक अर्थ ‘आना’ है। ‘के पास आया’ गाद के दावीद के निकट पहुँचने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיַּגֶּד לוֹ
  choice: उसे यह बात बताई
  rationale: נגד के हिफ़ील रूप का अर्थ ‘बताना/सूचित करना’ है। ‘यह बात’ हिन्दी में सकर्मक प्रयोग को सहज बनाता है, बिना कोई अतिरिक्त विषय-वस्तु जोड़े।
- source_word: שֶׁבַע שָׁנִים רָעָב
  choice: सात वर्ष तक अकाल
  rationale: רָעָב यहाँ व्यक्तिगत भूख नहीं, व्यापक अकाल को दर्शाता है। WLC के ‘सात वर्ष’ को मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: נֻסְךָ לִפְנֵי צָרֶיךָ
  choice: तू अपने शत्रुओं के सामने से तीन महीने तक भागता रहे
  rationale: इब्रानी वाक्यांश संक्षिप्त और कुछ हद तक लुप्तपदीय है। यह रूप भागने की अवधि और शत्रुओं से दूर भागने का भाव स्पष्ट तथा स्वाभाविक हिन्दी में रखता है।
- source_word: צָרֶיךָ
  choice: अपने शत्रुओं
  rationale: צַר का अर्थ विरोधी, बैरी या शत्रु हो सकता है। ‘शत्रु’ आधुनिक मानक हिन्दी में स्पष्ट और गरिमापूर्ण है; ‘विरोधी’ भी सम्भव है।
- source_word: וְהוּא רֹדְפֶךָ
  choice: और वे तेरा पीछा करते रहें
  rationale: इब्रानी में सर्वनाम व्याकरणतः एकवचन है, पर वह पहले आए बहुवचन ‘शत्रुओं’ को सामूहिक रूप से संदर्भित करता प्रतीत होता है। हिन्दी में बहुवचन से अर्थ और व्याकरण दोनों स्वाभाविक रहते हैं।
- source_word: שְׁלֹשֶׁת יָמִים דֶּבֶר
  choice: तीन दिन तक महामारी
  rationale: דֶּבֶר व्यापक घातक रोग या महामारी को सूचित करता है। ‘महामारी’ वर्तमान हिन्दी में स्पष्ट है और ‘मरी’ जैसे अप्रचलित विकल्प से अधिक सुबोध है।
- source_word: עַתָּה דַּע וּרְאֵה
  choice: अब सोच-विचार कर देख
  rationale: शाब्दिक ‘अब जान और देख’ हिन्दी में अस्वाभाविक होगा। संयुक्त आज्ञाओं का आशय परिस्थिति पर विचार करके निर्णय करना है, जिसे यह वाक्यांश बिना अतिव्याख्या के व्यक्त करता है।
- source_word: מָה אָשִׁיב שֹׁלְחִי דָּבָר
  choice: जिसने मुझे भेजा है, उसे मैं क्या उत्तर दूँ
  rationale: השיב דבר उत्तर वापस पहुँचाने का मुहावरा है। ‘जिसने मुझे भेजा है’ שֹׁלְחִי को स्वाभाविक रूप से व्यक्त करता है और प्रेषक की पहचान पाठ से आगे बढ़कर स्पष्ट नहीं करता।
theological_decisions:
- issue: 2 शमूएल 24:13 और 1 इतिहास 21:12 में अकाल की अवधि का संख्यात्मक अंतर
  choice: मुख्य पाठ में WLC के अनुसार ‘सात वर्ष’
  alternative: 1 इतिहास 21:12 के समान ‘तीन वर्ष’
  rationale: प्रदत्त इब्रानी आधार-पाठ स्पष्ट रूप से ‘सात वर्ष’ पढ़ता है। समानांतर विवरण में ‘तीन वर्ष’ होने के कारण अंतर को मुख्य पाठ में सामंजस्य बैठाकर मिटाने के बजाय पादटिप्पणी में पारदर्शी रूप से सुरक्षित रखा गया है।
- issue: गाद को भेजनेवाले की पहचान
  choice: ‘जिसने मुझे भेजा है’
  alternative: ‘यहोवा, जिसने मुझे भेजा है’
  rationale: इस पद में प्रेषक के लिए केवल ‘मुझे भेजनेवाला’ कहा गया है। संदर्भ से पहचान समझी जा सकती है, पर अनुवाद में ईश्वरीय नाम जोड़ना स्रोत-पाठ से आगे जाना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सहज शैली रखी गई है। दावीद को संबोधन में एकवचन ‘तू/तेरा’ मूल इब्रानी के एकवचन रूपों और ऐतिहासिक कथन-शैली को सुरक्षित रखता है। तीनों विकल्प प्रश्नात्मक रूप में समानांतर रखे गए हैं; पुराने या अत्यधिक संस्कृतनिष्ठ शब्दों से बचते हुए ‘अकाल,’ ‘शत्रु’ और ‘महामारी’ जैसे सर्वबोध्य शब्द चुने गए हैं।
