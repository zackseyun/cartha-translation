review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the command, the messenger formula, David as addressee, the unstated noun after “three,” the personal force of “choose for yourself,” and the divine name. However, “मैं वही तेरे साथ करूँगा” is not an adequately clear Hindi rendering of the adverse, enacted result in וְאֶעֱשֶׂה לָּךְ; it can sound like a vague statement of how one will deal with David rather than that the selected matter will be brought upon him.
  naturalness: The overall Hindi is modern and readable. “यों कहता है” is a more idiomatic and established Hindi equivalent for the formal prophetic formula than “यह कहता है.” “उसे तेरे ऊपर ले आऊँगा” is clear and natural in this judgment-setting context.
  terminology: “याहवे” consistently represents יהוה and is appropriate. “तीन बातें,” accompanied by the note, appropriately supplies a minimal Hindi noun without prematurely identifying the items as punishments or options.
  issues:
  - severity: medium
    issue: The final clause “मैं वही तेरे साथ करूँगा” is semantically vague and weakly idiomatic for the selected consequence being enacted upon David.
    rationale: 'The Hebrew has an adverse dative in a context of impending judgment: “and I will do [it] to you.” Hindi “तेरे साथ करूँगा” can mean simply “deal with you” and does not clearly make the chosen item the thing that comes upon David. “उसे तेरे ऊपर ले आऊँगा” clearly conveys the contextual force, while “उसे” retains the implied referent.'
  - severity: low
    issue: “याहवे यह कहता है” is less idiomatic as a prophetic announcement formula.
    rationale: “याहवे यों कहता है” is concise, natural modern Hindi and retains the formal force of כֹּה אָמַר.
