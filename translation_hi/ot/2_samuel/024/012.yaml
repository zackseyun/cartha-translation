source:
  edition: WLC
  text: הָל֞וֹךְ וְ/דִבַּרְתָּ֣ אֶל דָּוִ֗ד כֹּ֚ה אָמַ֣ר יְהוָ֔ה שָׁלֹ֕שׁ אָנֹכִ֖י נוֹטֵ֣ל עָלֶ֑י/ךָ בְּחַר לְ/ךָ֥ אַֽחַת מֵ/הֶ֖ם וְ/אֶֽעֱשֶׂה לָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/012.yaml
  text: 'Go and speak to David[a], ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
translation:
  language: hi
  text: 'जा और दाऊद से कह, ‘याहवे यों कहता है: मैं तेरे सामने तीन बातें[a] रख रहा हूँ। उनमें से अपने लिए एक चुन ले, और मैं उसे तेरे ऊपर ले आऊँगा।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में केवल ‘तीन’ है; संज्ञा प्रसंग से समझी जाती है। इसका अनुवाद ‘तीन बातें’ या ‘तीन विकल्प’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ וְדִבַּרְתָּ
  choice: जा और ... से कह
  rationale: इन्फिनिटिव एब्सोल्यूट और सीमित क्रिया मिलकर आज्ञा को पुष्ट करते हैं। आधुनिक हिन्दी में ‘जा और ... से कह’ इस आज्ञात्मक क्रम को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यह कहता है
  rationale: यह भविष्यद्वक्ताओं के संदेश का मानक सूत्र है। ‘यह कहता है’ औपचारिकता बनाए रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में परमेश्वर का व्यक्तिगत नाम सीधे आया है; इसलिए किसी उपाधि से बदलने के बजाय उसका लिप्यंतरण किया गया है।
- source_word: שָׁלֹשׁ
  choice: तीन बातें
  rationale: इब्रानी में केवल स्त्रीलिंग संख्या ‘तीन’ है और संज्ञा प्रसंग से समझी जाती है। हिन्दी में वाक्य को स्वाभाविक बनाने के लिए सामान्य शब्द ‘बातें’ जोड़ा गया है; इसकी अंतर्निहित प्रकृति पादटिप्पणी में बताई गई है।
- source_word: אָנֹכִי נוֹטֵל עָלֶיךָ
  choice: मैं तेरे सामने ... रख रहा हूँ
  rationale: प्रसंग में दाऊद को तीन में से एक चुनना है। ‘सामने रख रहा हूँ’ प्रस्तुत किए जा रहे चुनावों का भाव स्वाभाविक हिन्दी में देता है, जबकि आसन्न दंड का भार अगले वाक्य में बना रहता है।
- source_word: בְּחַר לְךָ אַחַת מֵהֶם
  choice: उनमें से अपने लिए एक चुन ले
  rationale: यह अंश विभाजक अर्थ ‘उनमें से एक’ और नैतिक दातृकारक לְךָ का व्यक्तिगत उत्तरदायित्व—‘अपने लिए’—दोनों बनाए रखता है।
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: और मैं वही तेरे साथ करूँगा
  rationale: न्याय के इस प्रसंग में לְךְ का अर्थ लाभकारी ‘तेरे लिए’ नहीं, बल्कि दाऊद पर होने वाली कार्रवाई है। ‘तेरे साथ करूँगा’ प्रतिकूल भाव को बिना अतिरिक्त क्रिया आयात किए व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: तीन प्रस्तुत बातों का स्वरूप
  choice: सामान्य ‘बातें’ और व्याख्यात्मक पादटिप्पणी
  alternative: तीन विकल्प / तीन दंड
  rationale: इब्रानी यहाँ संज्ञा नहीं बताता। ‘विकल्प’ चुनाव के प्रसंग को स्पष्ट करता, और ‘दंड’ अगले पदों की जानकारी पहले ही जोड़ देता; इसलिए सामान्य शब्द चुनकर मूल की खुली अभिव्यक्ति बचाई गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दाऊद को संबोधन मूल के एकवचन और निकट/प्रत्यक्ष ‘तू’ रूप में है; इसलिए ‘जा’, ‘तेरे’ और ‘चुन ले’ प्रयुक्त हुए हैं।
