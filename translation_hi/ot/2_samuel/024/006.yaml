  text: וַ/יָּבֹ֨אוּ֙ הַ/גִּלְעָ֔דָ/ה וְ/אֶל אֶ֥רֶץ תַּחְתִּ֖ים חָדְשִׁ֑י וַ/יָּבֹ֨אוּ֙ דָּ֣נָ/ה יַּ֔עַן וְ/סָבִ֖יב אֶל צִידֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/006.yaml
  text: They came to Gilead and to the land of Tahtim-hodshi[a], and they came to Dan-jaan[b], and around to Sidon.
translation:
  language: hi
  text: वे गिलाद और तहतीम-होदशी[a] के देश में आए। फिर वे दान-यान[b] आए और चारों ओर से होते हुए सीदोन पहुँचे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी ‘तहतीम-होदशी’ का अर्थ अस्पष्ट है। कुछ विद्वान पाठ में संशोधन करके इसका अर्थ ‘कादेश में हित्तियों का देश’ या इससे मिलता-जुलता कुछ मानते हैं, पर इस स्थान की पहचान निश्चित नहीं है।
    reason: alternative_reading
  - marker: b
    text: ‘दान-यान’ संभवतः किसी स्थान का नाम है; उसकी ठीक पहचान निश्चित नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: वे आए / पहुँचे
  rationale: בוא का क्रमिक कथात्मक रूप यात्रा के अगले पड़ाव पर पहुँचने को बताता है। पहली दो घटनाओं में मूल की पुनरावृत्ति के अनुरूप ‘आए’ रखा गया है; अंतिम गंतव्य के साथ स्वाभाविक हिन्दी के लिए ‘पहुँचे’ प्रयुक्त है।
- source_word: הַגִּלְעָדָה
  choice: गिलाद
  rationale: स्थान-नाम पर लगा दिशासूचक ה गति की दिशा बताता है; हिन्दी में क्रिया ‘आए’ और संयुक्त परसर्ग से यह अर्थ स्वाभाविक रूप से व्यक्त होता है।
- source_word: אֶרֶץ
  choice: देश
  rationale: यहाँ אֶרֶץ किसी भौगोलिक भूभाग या प्रदेश को दर्शाता है; ‘देश’ पारंपरिक, स्पष्ट और संक्षिप्त हिन्दी विकल्प है।
- source_word: תַּחְתִּים חָדְשִׁי
  choice: तहतीम-होदशी
  rationale: इब्रानी पद पाठगत और भौगोलिक दृष्टि से अस्पष्ट है। अनुमानित पहचान को मुख्य पाठ में बैठाने के बजाय स्थान-नाम के रूप में लिप्यंतरण किया गया है।
- source_word: דָּנָה יַּעַן
  choice: दान-यान
  rationale: इसे अनिश्चित पहचान वाले संयुक्त स्थान-नाम के रूप में लिया गया है। דנה का दिशासूचक रूप हिन्दी की गति-सूचक क्रिया में समाहित है।
- source_word: וְסָבִיב
  choice: और घूमते हुए
  rationale: סביב यहाँ चक्कर लगाते या आसपास से होकर आगे बढ़ते हुए मार्ग का संकेत देता है। ‘घूमते हुए’ संक्षिप्त हिन्दी में उस गतिशील अर्थ को सुरक्षित रखता है।
- source_word: אֶל צִידוֹן
  choice: सीदोन तक
  rationale: אֶל गंतव्य की ओर गति बताता है। यात्रा-विवरण में ‘तक पहुँचे’ स्वाभाविक हिन्दी है और सीदोन को मार्ग के अगले लक्ष्य के रूप में प्रस्तुत करता है।
