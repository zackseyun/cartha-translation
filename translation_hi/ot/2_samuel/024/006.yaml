translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज यात्रा-वृत्तांत शैली रखी गई है। अस्पष्ट स्थान-नामों का अर्थ अनुमान से तय न करके देवनागरी में लिप्यंतरण किया गया है; दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
