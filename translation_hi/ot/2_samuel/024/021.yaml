base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/021.yaml
  text: And Araunah said[a], “Why has my lord the king come to his servant?” And David said, “To buy the threshing floor from you, to build an altar to Yahweh, so that the plague may be stopped from being upon the people.”
translation:
  language: hi
  text: अरौना ने कहा, “मेरे स्वामी राजा अपने दास के पास[a] क्यों आए हैं?” दाऊद ने कहा, “इस खलिहान को तुमसे मोल लेने के लिए, ताकि मैं याहवे के लिए एक वेदी बनाऊँ और लोगों पर से महामारी थम जाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके दास के पास”; यह राजदरबार में अपने लिए प्रयुक्त विनम्र तृतीय-पुरुष संबोधन है, जिसका आशय “आपके दास के पास” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: क्यों
  rationale: यह राजा के आने का कारण पूछने वाला सीधा प्रश्न है; आधुनिक हिन्दी में ‘क्यों’ स्वाभाविक और सटीक है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: मेरे स्वामी राजा
  rationale: इससे आदरसूचक संबोधन और राजकीय पदवी दोनों बने रहते हैं।
- source_word: עַבְדּוֹ
  choice: अपने दास के पास
  rationale: इब्रानी में औपचारिक राजदरबारी आत्म-संदर्भ के लिए तीसरे पुरुष ‘उसके दास’ का प्रयोग है; हिन्दी में ‘अपने दास’ उसी विनम्र आशय को अधिक स्वाभाविक ढंग से व्यक्त करता है, और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: לִקְנוֹת מֵעִמְּךָ אֶת הַגֹּרֶן
  choice: तुमसे यह खलिहान मोल लेने के लिए
  rationale: लेन-देन का अर्थ स्पष्ट रखते हुए ‘मोल लेना’ गरिमापूर्ण और सामान्य हिन्दी है; निर्दिष्ट स्थल के लिए ‘यह खलिहान’ संदर्भानुकूल है।
- source_word: לִבְנוֹת מִזְבֵּחַ
  choice: एक वेदी बनाऊँ
  rationale: उद्देश्यसूचक infinitive को स्वाभाविक हिन्दी वाक्य-रचना में उद्देश्य के रूप में व्यक्त किया गया है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: इब्रानी व्यक्तिनाम יהוה को उपाधि से बदलने के बजाय हिन्दी में ‘याहवे’ लिप्यंतरित किया गया है; ל यहाँ समर्पण/उद्देश्य दर्शाता है।
- source_word: וְתֵעָצַר הַמַּגֵּפָה מֵעַל הָעָם
  choice: और लोगों पर पड़ी महामारी रुक जाए
  rationale: निफ़अल क्रिया का निष्क्रिय/resultative भाव ‘रुक जाए’ में बना है; ‘लोगों पर पड़ी’ מֵעַל הָעָם के बोझ हटने वाले स्थानिक बिंब को स्वाभाविक हिन्दी में दर्शाता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिनाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदले बिना और किसी संप्रदायगत व्याख्या को जोड़े बिना प्रस्तुत करता है।
- issue: महामारी रुकने का भाव
  choice: रुक जाए
  alternative: निश्चय ही रुक जाएगी
  rationale: इब्रानी अपूर्ण क्रिया यहाँ अभिप्रेत परिणाम/उद्देश्य व्यक्त करती है; हिन्दी संभाव्य रूप परिणाम को निश्चित भविष्यवाणी बनाए बिना वही तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। राजदरबारी आदर ‘मेरे स्वामी राजा’ में सुरक्षित है, जबकि दाऊद का उत्तर संक्षिप्त और बोलचाल में स्वाभाविक है।
