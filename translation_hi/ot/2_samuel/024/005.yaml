base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/005.yaml
  text: They crossed the Jordan and camped at Aroer[a], on the right side of the city that is in the middle of the valley of Gad[c][b], and toward Jazer.
translation:
  language: hi
  text: वे यरदन पार करके अरोएर में, उस नगर की दाहिनी ओर[a], जो गाद की घाटी[b] के बीच में है, डेरा डाला; फिर वे याजेर की ओर[c] गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “नगर के दाहिने।” कुछ लोग इसे भौगोलिक रूप से “नगर के दक्षिण में” समझते हैं, पर इब्रानी पाठ स्वयं “दाहिनी ओर” कहता है।'
    reason: lexical_alternative
  - marker: b
    text: या “गाद के नाले/खड्ड के बीच में।” इब्रानी शब्द घाटी, खड्ड अथवा मौसमी जलधारा की तलहटी के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “और याजेर को गए।” इब्रानी संबंधबोधक शब्द किसी स्थान की ओर दिशा अथवा उस स्थान तक जाना—दोनों सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: वे यरदन पार करके
  rationale: यात्रा-वर्णन में עבר और उसके कर्म के रूप में ‘यरदन’ नदी पार करने को सूचित करता है। हिंदी में ‘यरदन पार करके’ स्वाभाविक और संक्षिप्त है।
- source_word: וַיַּחֲנוּ בַעֲרוֹעֵר
  choice: अरोएर में ... डेरे डालने लगे
  rationale: חנה का अर्थ पड़ाव डालना है और स्थाननाम के साथ ב को हिंदी में ‘में’ स्वाभाविक रूप से व्यक्त किया गया है। वाक्य-विन्यास के कारण स्थान-संबंधी विस्तार क्रिया से पहले रखा गया है।
- source_word: יְמִין הָעִיר
  choice: उस नगर की दाहिनी ओर
  rationale: ימין का प्रत्यक्ष अर्थ ‘दाहिनी ओर’ है। इसे ‘दक्षिण’ कहने से संभावित भौगोलिक व्याख्या मूल पाठ में जोड़ दी जाती, इसलिए स्थानगत अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: אֲשֶׁר בְּתוֹךְ הַנַּחַל הַגָּד
  choice: जो गाद की घाटी के बीच में है
  rationale: संबंधवाचक उपवाक्य निकटवर्ती ‘नगर’ को विशेषित करता है। נחל घाटी, खड्ड या मौसमी जलधारा की तलहटी को सूचित कर सकता है; मुख्य पाठ में सुबोध ‘घाटी’ चुना गया है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְאֶל יַעְזֵר
  choice: फिर वे याजेर की ओर गए
  rationale: אל दिशा अथवा गंतव्य दोनों बता सकता है। ‘की ओर गए’ दिशा को स्पष्ट करता है, पर याजेर पहुँचने का अनावश्यक दावा नहीं करता। संयोजक ו को प्रसंगानुकूल ‘फिर’ से व्यक्त किया गया है।
