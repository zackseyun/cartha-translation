  text: तब दाऊद गाद के वचन के अनुसार ऊपर गया, जैसा याहवे ने आज्ञा दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: ऊपर गया
  rationale: עלה की दिशात्मक बारीकी ‘ऊपर जाना’ को सुरक्षित रखता है; केवल ‘गया’ कहने से यह भाव खो जाता।
- source_word: דָּוִד
  choice: दाऊद
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित और आसानी से पहचाना जाने वाला नाम-रूप।
- source_word: כִּדְבַר
  choice: के वचन के अनुसार
  rationale: כ + דבר का स्पष्ट अर्थ ‘के वचन के अनुसार’ है; इससे गाद द्वारा दिए गए संदेश या निर्देश का उल्लेख बना रहता है।
- source_word: גָּד
  choice: गाद
  rationale: हिन्दी में इस नबी के नाम का प्रचलित लिप्यंतरण।
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: गाद के वचन और यहोवा की आज्ञा के बीच सटीक अनुरूपता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: क्रिया का अर्थ ‘आज्ञा देना’ है; ‘दी थी’ यह स्पष्ट करता है कि यहोवा की आज्ञा दाऊद के जाने से पहले दी गई थी।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णी ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले व्यक्तिनाम ‘यहोवा’ के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में निजी ईश्वरीय नाम है। हिन्दी पाठकों के बीच सुविदित ‘यहोवा’ उसका पारंपरिक लिप्यंतरण है; इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ऊपर गया’ मूल की दिशात्मकता बचाता है, और ‘ठीक वैसे ही जैसे’ दोनों आदेशों के अनुरूप संबंध को स्पष्ट करता है।
