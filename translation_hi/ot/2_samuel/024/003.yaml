base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/003.yaml
  text: But Joab said to the king[a], “May Yahweh your God add to the people a hundred times as many as they are, and may the eyes of my lord the king see it. But why does my lord the king delight in this thing?”
translation:
  language: hi
  text: पर योआब ने राजा से कहा, “याहवे, आपका परमेश्वर, प्रजा की संख्या को उसकी वर्तमान संख्या से सौ गुना कर दे, और मेरे प्रभु राजा की आँखें इसे देखें[a]। पर, मेरे प्रभु राजा, इस बात की इच्छा क्यों रखते हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘और मेरे प्रभु राजा की आँखें देखें।’ हिब्रू में ‘देखें’ का कर्म स्पष्ट नहीं है; आशय यह है कि राजा प्रजा की ऐसी वृद्धि देखने के लिए जीवित रहें।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: पर ... ने ... कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, पर प्रसंग में योआब राजा की आज्ञा पर आपत्ति कर रहा है; इसलिए विरोधसूचक ‘पर’ स्वाभाविक है।
- source_word: יוֹאָב
  choice: योआब
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וְיוֹסֵף
  choice: बढ़ाए
  rationale: यहाँ क्रिया इच्छा अथवा आशीष व्यक्त करती है; हिन्दी में संभावनार्थक रूप इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: याहवे आपका परमेश्वर
  rationale: ईश्वरीय निज नाम को ‘याहवे’ के रूप में रखा गया है और द्वितीय पुरुष एकवचन संबंध को आदरसूचक ‘आपका’ से व्यक्त किया गया है।
- source_word: אֶל הָעָם
  choice: प्रजा को
  rationale: עָם का मूल अर्थ ‘लोग/प्रजा’ है। राजकीय संदर्भ में ‘प्रजा’ स्वाभाविक है और इसे केवल सेना तक सीमित नहीं करता।
- source_word: כָּהֵם וְכָהֵם מֵאָה פְעָמִים
  choice: जितनी वह अब है उससे सौ गुना
  rationale: हिब्रू मुहावरे का आशय वर्तमान संख्या की सौ गुनी वृद्धि है; ‘अब’ तुलना के वर्तमान आधार को स्पष्ट करता है।
- source_word: וְעֵינֵי אֲדֹנִי הַמֶּלֶךְ רֹאוֹת
  choice: और मेरे प्रभु राजा की आँखें यह देखें
  rationale: हिब्रू की दृष्टि-संबंधी अभिव्यक्ति और इच्छा का स्वर सुरक्षित रखा गया है। कर्म मूल में अप्रकट है; हिन्दी वाक्य की स्वाभाविकता के लिए ‘यह’ जोड़ा गया है।
- source_word: לָמָּה חָפֵץ בַּדָּבָר הַזֶּה
  choice: इस बात की इच्छा क्यों रखते हैं
  rationale: חָפֵץ किसी बात को चाहने या उसमें रुचि रखने को व्यक्त करता है; आदरसूचक बहुवचन राजकीय संबोधन के अनुरूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय ईश्वरीय निज नाम है। ‘याहवे’ उसका लिप्यंतरण करता है, किसी उपाधि से उसका स्थानापन्न नहीं करता।
- issue: योआब की शुभकामना में राजा के देखने का आशय
  choice: आँखें यह देखें
  alternative: राजा तब तक जीवित रहें और इसे देखें
  rationale: संदर्भ में दीर्घायु होकर वृद्धि देखने का आशय निहित है, पर मूल पाठ इसे स्पष्टतः नहीं कहता; इसलिए चित्रात्मक और कुछ हद तक अप्रकट अभिव्यक्ति सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। राजा के लिए ‘आपका/रखते हैं’ आदरसूचक रूप तथा दरबारी संबोधन ‘मेरे प्रभु राजा’ बनाए रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि अप्रकट कर्म को मुख्य पाठ में सहज ‘यह’ से व्यक्त किया गया है।
