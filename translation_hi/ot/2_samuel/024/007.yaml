  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। जातिनाम और स्थाननाम प्रचलित हिन्दी बाइबलीय रूपों में दिए गए हैं। स्रोत में मौजूद नेगेव/दक्षिण की अर्थगत अस्पष्टता पादटिप्पणी द्वारा सुरक्षित है।
