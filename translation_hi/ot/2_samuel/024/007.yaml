base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/007.yaml
  text: They came to the fortified city of Tyre and to all the cities of the Hivites and the Canaanites[a], and they went out to the Negev of Judah, to Beersheba.
translation:
  language: hi
  text: वे सोर के गढ़ और हिव्वियों तथा कनानियों के सभी नगरों में पहुँचे। फिर वे निकलकर यहूदा के नेगेव[a] में बेर्शेबा तक गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदा के दक्षिणी भाग।” इब्रानी शब्द नेगेव किसी विशिष्ट क्षेत्र के नाम को भी सूचित कर सकता है और सामान्य रूप से दक्षिणी क्षेत्र को भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְצַר צֹר
  choice: सोर का गढ़
  rationale: מִבְצָר का मूल अर्थ किलेबंद स्थान या गढ़ है। इब्रानी में ‘नगर’ शब्द स्पष्ट रूप से नहीं है, इसलिए ‘गढ़’ स्रोत की संक्षिप्त भौगोलिक अभिव्यक्ति को बनाए रखता है।
- source_word: וְכָל עָרֵי הַחִוִּי וְהַכְּנַעֲנִי
  choice: और हिव्वियों तथा कनानियों के सभी नगरों में
  rationale: जातिनामों को मानक हिन्दी बहुवचन में रखा गया है। गति-सूचक क्रिया के साथ ‘में’ गंतव्य पर पहुँचने का स्वाभाविक हिन्दी रूप है।
- source_word: וַיֵּצְאוּ
  choice: फिर वे ... गए
  rationale: יצא का शाब्दिक अर्थ ‘निकलना’ है, पर इस यात्रा-वृत्तांत में यह मार्ग के अगले चरण की ओर बढ़ने को सूचित करता है। ‘फिर ... गए’ आधुनिक हिन्दी में स्वाभाविक रूप से क्रम और गति दोनों व्यक्त करता है।
- source_word: אֶל נֶגֶב יְהוּדָה
  choice: यहूदा के नेगेव में
  rationale: भौगोलिक यात्रा-संदर्भ में נֶגֶב को क्षेत्रनाम ‘नेगेव’ के रूप में रखना उचित है; इसकी सामान्य अर्थ-संभावना ‘दक्षिणी क्षेत्र’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בְּאֵר שָׁבַע
  choice: बेर्शेबा
  rationale: इस प्रसिद्ध स्थाननाम का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है। ‘तक’ इसे यात्रा के अंतिम उल्लिखित पड़ाव के रूप में स्पष्ट करता है।
