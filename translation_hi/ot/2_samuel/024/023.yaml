translation:
  language: hi
  text: राजा अरौना ने यह सब राजा को दिया।[a] और अरौना ने राजा से कहा, “याहवेह, आपके परमेश्वर, आपको स्वीकार करें।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शब्दशः: “अरौना राजा।” अरौना के लिए ‘राजा’ उपाधि संदर्भ में असामान्य है, फिर भी मूल पाठ में उपस्थित है।'
    reason: alternative_reading
  - marker: b
    text: या “आपसे प्रसन्न हों” अथवा “आप पर कृपा करें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: यह सब
  rationale: यह पद पिछले पद में बलिदान के लिए दी गई सभी वस्तुओं की ओर संकेत करता है; ‘यह सब’ समग्रता और संदर्भ दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נָתַן
  choice: दे दिया
  rationale: कथात्मक पूर्ण क्रिया को स्वाभाविक हिन्दी भूतकाल में व्यक्त किया गया है।
- source_word: אֲרַוְנָה
  choice: अरौना
  rationale: शमूएल में आए इब्रानी नाम का प्रचलित हिन्दी लिप्यंतरण; इतिहास की समानांतर कथा का ‘ओर्नान’ यहाँ नहीं लाया गया।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: अरौना के बाद आए असामान्य उपाधिक प्रयोग को मूल पाठ के अनुसार मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: לַמֶּלֶךְ
  choice: राजा को
  rationale: ל यहाँ प्राप्तकर्ता दाऊद को चिह्नित करता है।
- source_word: וַיֹּאמֶר
  choice: और ... ने ... कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; यह हिन्दी में सीधा और स्वाभाविक रूप है।
- source_word: יְהוָה
  choice: याहवेह
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम का देवनागरी लिप्यंतरण किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהֶיךָ
  choice: आपके परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय को राजा दाऊद के लिए सम्मानसूचक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: יִרְצֶךָ
  choice: आपको स्वीकार करें
  rationale: רצה यहाँ अनुकूल स्वीकृति व्यक्त करता है; यह अनुवाद बलिदान-संबंधी संदर्भ के अनुकूल है और अर्थ को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवेह
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में वाचा-नाम प्रत्यक्ष रूप से है; लिप्यंतरण नाम और उपाधि के भेद को बनाए रखता है।
- issue: अरौना के लिए ‘राजा’ उपाधि को बनाए रखना
  choice: मुख्य पाठ में ‘राजा अरौना’
  alternative: केवल ‘अरौना’
  rationale: इब्रानी पाठ स्पष्टतः אֲרַוְנָה הַמֶּלֶךְ कहता है। संदर्भ में असामान्य होने पर भी इसे चुपचाप हटाना मूल की वास्तविक कठिनाई को मिटा देता।
- issue: יִרְצֶךָ का आशय
  choice: आपको स्वीकार करें
  alternative: आपसे प्रसन्न हों अथवा आप पर कृपा करें
  rationale: क्रिया अनुकूल स्वीकृति, प्रसन्नता या कृपा का भाव रख सकती है; मुख्य पाठ में संदर्भानुकूल ‘स्वीकार करें’ रखा गया और व्यापक अर्थ-पट्टी पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सम्मानसूचक रूप अपनाया गया है। दाऊद को संबोधन में ‘आपके/आपको’ रखा गया है। असामान्य इब्रानी उपाधि को सहज बनाने के लिए हटाया नहीं गया।
