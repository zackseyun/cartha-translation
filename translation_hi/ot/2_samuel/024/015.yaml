  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן יְהוָ֥ה דֶּ֨בֶר֙ בְּ/יִשְׂרָאֵ֔ל מֵ/הַ/בֹּ֖קֶר וְ/עַד עֵ֣ת מוֹעֵ֑ד וַ/יָּ֣מָת מִן הָ/עָ֗ם מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע שִׁבְעִ֥ים אֶ֖לֶף אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/015.yaml
  text: So Yahweh sent a plague on Israel from the morning until the appointed time[a], and seventy thousand men of the people died, from Dan to Beersheba.
translation:
  language: hi
  text: तब यहोवा ने सुबह से नियत समय तक[a] इस्राएल पर महामारी भेजी, और दान से लेकर बेर्शेबा तक लोगों में से सत्तर हज़ार पुरुष मर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ठहराए हुए समय तक।” इब्रानी पदबंध किसी नियत या निश्चित समय का अर्थ दे सकता है; यहाँ “सभा के समय तक” अर्थ कम संभावित है।
    reason: वैकल्पिक पाठार्थ
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: भेजी
  rationale: क्रिया का मूल अर्थ ‘दिया’ है, पर דֶּבֶר के साथ न्याय के इस प्रसंग में ‘महामारी भेजी’ स्वाभाविक हिंदी है और परमेश्वर की प्रत्यक्ष भूमिका बनाए रखती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: דֶּבֶר
  choice: महामारी
  rationale: यह आधुनिक हिंदी में व्यापक रूप से समझा जाने वाला शब्द है और प्राणघातक संक्रामक प्रकोप के अर्थ को स्पष्ट करता है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल पर
  rationale: यह विपत्ति के राष्ट्र पर पड़ने और न्याय के भाव को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: מֵהַבֹּקֶר
  choice: सुबह से
  rationale: इब्रानी में दिए गए आरंभिक समय को संक्षिप्त और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וְעַד עֵת מוֹעֵד
  choice: ठहराए हुए समय तक
  rationale: מוֹעֵד यहाँ सबसे संभावित रूप से निश्चित या नियुक्त समय बताता है; यह अभिव्यक्ति मूल की कुछ अस्पष्टता भी बनाए रखती है।
- source_word: וַיָּמָת
  choice: मर गए
  rationale: एकवचन क्रिया यहाँ सामूहिक कर्ता के साथ परिणाम बताती है; हिंदी में बहुवचन ‘मर गए’ स्वाभाविक है।
- source_word: מִן הָעָם
  choice: लोगों में से
  rationale: यह स्पष्ट करता है कि मरने वाले इस्राएली प्रजा के बीच से थे और מִן के चयनात्मक भाव को बनाए रखता है।
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: दान से लेकर बेर्शेबा तक
  rationale: यह पूरे इस्राएली भूभाग को सूचित करने वाली पारंपरिक भौगोलिक अभिव्यक्ति का सीधा और स्पष्ट हिंदी रूप है।
- source_word: שִׁבְעִים אֶלֶף אִישׁ
  choice: सत्तर हज़ार पुरुष
  rationale: אִישׁ संख्या के बाद वितरणात्मक रूप में पुल्लिंग है; ‘पुरुष’ मूल की लैंगिक विशिष्टता को सुरक्षित रखता है।
theological_decisions:
- issue: न्याय में परमेश्वर की भूमिका
  choice: यहोवा ने ... महामारी भेजी
  alternative: यहोवा ने महामारी आने दी
  rationale: इब्रानी पाठ कार्य को सीधे यहोवा से जोड़ता है; ‘आने दी’ कहना मूल में निहित न होने वाली शिथिलता जोड़ देता।
- issue: עֵת מוֹעֵד का अर्थ
  choice: ठहराए हुए समय तक
  alternative: नियत समय तक; सभा के समय तक
  rationale: प्रसंग में समय-सीमा सबसे संभावित है। ‘ठहराए हुए समय’ निश्चित समय का अर्थ देता है, जबकि संभावित वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य-क्रम हिंदी की स्वाभाविकता के अनुसार है, जबकि मूल पाठ की प्रत्यक्ष दैवी भूमिका, भौगोलिक विस्तार और पुरुषवाची संख्या सुरक्षित हैं।
