base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/011.yaml
  text: When David arose in the morning[a], the word of Yahweh had come to Gad the prophet, David’s seer, saying,
translation:
  language: hi
  text: 'जब दाऊद सुबह उठा, तब याहवे का वचन गाद नबी के पास आ चुका था[a], जो दाऊद का द्रष्टा था:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “याहवे का वचन गाद नबी के पास था।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם דָּוִד בַּבֹּקֶר
  choice: जब दाऊद सुबह उठा
  rationale: समय-सूचक वाक्यांश और कथात्मक क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּדְבַר יְהוָה
  choice: यहोवा का वचन
  rationale: प्रकाशना से जुड़ी मानक भविष्यवाणी-सूचक अभिव्यक्ति में 'वचन' बनाए रखा गया है और परमेश्वर के निज नाम को 'यहोवा' रूप में लिप्यंतरित किया गया है।
- source_word: הָיָה אֶל
  choice: के पास आ चुका था
  rationale: भविष्यवाणी-संबंधी प्रसंग में इस इब्रानी मुहावरे का स्वाभाविक अर्थ वचन का किसी व्यक्ति के पास आना है; पूर्वपूर्ण काल सुबह दाऊद के उठने से पहले घटित होने की संभावित समय-संबंधी व्याख्या दर्शाता है।
- source_word: גָּד הַנָּבִיא
  choice: गाद नबी
  rationale: व्यक्तिवाचक नाम का हिन्दी लिप्यंतरण और נָבִיא का प्रचलित पदनाम रखा गया है।
- source_word: חֹזֵה דָוִד
  choice: दाऊद के दर्शी
  rationale: חֹזֶה को נָבִיא से अलग पदनाम के रूप में सुरक्षित रखते हुए उसके राजकीय संबंध को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप अगले पद में आने वाले सीधे कथन का परिचय देता है; हिन्दी में अपूर्ण उद्धरणात्मक 'यह कहते हुए' की अपेक्षा द्विबिंदु अधिक स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के निज वाचा-नाम को पदवी से प्रतिस्थापित न करके हिन्दी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण 'यहोवा' में रखा गया है।
- issue: הָיָה אֶל का कालगत संबंध
  choice: आ चुका था
  alternative: के पास था / आया
  rationale: संदर्भ में यह सम्भवतः दाऊद के उठने से पहले गाद को वचन मिलने का संकेत देता है; फिर भी मूल मुहावरे की अधिक शाब्दिक संरचना पादटिप्पणी में दी गई है।
