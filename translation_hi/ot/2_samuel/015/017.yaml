- source_word: בְּרַגְלָיו
  choice: पैदल चले
  rationale: शाब्दिक रूप से ‘उसके पैरों पर/पास’ वाला यह मुहावरा उसके साथ पैदल जाने का भाव देता है। ‘उसके साथ के’ पहले ही संगति स्पष्ट करता है।
- source_word: וַיַּעַמְדוּ
  choice: रुक गए
  rationale: यात्रा-वर्णन में עמד का अर्थ ठहरना या रुकना स्वाभाविक है।
- source_word: בֵּית הַמֶּרְחָק
  choice: दूरवाले घर
  rationale: इब्रानी पदबंध का अपेक्षाकृत औपचारिक अर्थ ‘दूरी/दूर स्थान का घर’ है। इसे ‘आखिरी घर’ बनाकर व्याख्या को मुख्य पाठ में निश्चित नहीं किया गया; स्थान-नाम की संभावना पादटिप्पणी में रखी गई है।
