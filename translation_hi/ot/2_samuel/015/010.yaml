source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח אַבְשָׁלוֹם֙ מְרַגְּלִ֔ים בְּ/כָל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר כְּ/שָׁמְעֲ/כֶם֙ אֶת ק֣וֹל הַ/שֹּׁפָ֔ר וַ/אֲמַרְתֶּ֕ם מָלַ֥ךְ אַבְשָׁל֖וֹם בְּ/חֶבְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/010.yaml
  text: Then Absalom sent spies throughout all the tribes of Israel, saying, “As soon as you hear the sound of the trumpet, then say, ‘Absalom has become king in Hebron.’”
translation:
  language: hi
  text: तब अबशालोम ने इस्राएल के सभी गोत्रों में गुप्तचर भेजकर कहलवाया, “जैसे ही तुम नरसिंगे की आवाज़ सुनो, कहना, ‘अबशालोम हेब्रोन में राजा बन गया है।’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְרַגְּלִים
  choice: गुप्तचर
  rationale: इस शब्द का मूल अर्थ भेद लेने या जासूसी करने के लिए भेजे गए लोग है; ‘गुप्तचर’ आधुनिक, स्वाभाविक और प्रसंगानुकूल है।
- source_word: שׁוֹפָר
  choice: नरसिंगा
  rationale: यह पशु के सींग से बने संकेत-वाद्य को दर्शाता है; ‘नरसिंगा’ सामान्य पाठक के लिए समझने योग्य पारंपरिक हिन्दी पद है।
- source_word: מָלַךְ
  choice: राजा बन गया है
  rationale: यह पूर्ण क्रिया यहाँ राजत्व ग्रहण करने की घोषणा व्यक्त करती है; इससे केवल शासन करने की सामान्य क्रिया के बजाय राजा बनने का भाव स्पष्ट रहता है।
- source_word: בְּחֶבְרוֹן
  choice: हेब्रोन में
  rationale: स्थानवाचक בְ का सीधा अर्थ ‘में’ है और नगर का नाम प्रचलित बाइबलीय रूप में रखा गया है।
theological_decisions:
- issue: अबशालोम के राजत्व की घोषणा
  choice: उद्धरण के भीतर दावे के रूप में ‘राजा बन गया है’
  alternative: ‘राज्य करता है’ या वर्णनकर्ता की ओर से तथ्यात्मक घोषणा
  rationale: मूल पाठ इसे गुप्तचरों द्वारा लोगों से कहलवाए जाने वाले शब्दों के रूप में रखता है। अनुवाद दावे को सत्यापित तथ्य या वैध अभिषेक नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘भेजकर कहलवाया’ לֵאמֹר के निर्देशात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
