source:
  edition: WLC
  text: וְ/אִם֙ כֹּ֣ה יֹאמַ֔ר לֹ֥א חָפַ֖צְתִּי בָּ֑/ךְ הִנְ/נִ֕י יַֽעֲשֶׂה לִּ֕/י כַּ/אֲשֶׁ֥ר ט֖וֹב בְּ/עֵינָֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/026.yaml
  text: But if he says[a], ‘I take no pleasure in you,’ here I am[b]; let him do to me as seems good in his eyes.
translation:
  language: hi
  text: परन्तु यदि वह कहे, “मैं तुझसे प्रसन्न नहीं हूँ,”[a] तो मैं यहाँ हूँ; वह मेरे साथ वही करे जो उसकी दृष्टि में अच्छा लगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुझमें आनन्दित नहीं हूँ।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “जो उसकी आँखों में अच्छा हो”; इसका अर्थ है, “जो उसे अच्छा या उचित लगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह पिछले पद में व्यक्त अनुकूल सम्भावना के विपरीत दूसरी सशर्त सम्भावना प्रस्तुत करता है।
- source_word: כֹּה יֹאמַר
  choice: वह कहे
  rationale: כֹּה यहाँ प्रत्यक्ष कथन का परिचय देने वाला मुहावरा है; हिन्दी में अलग अनुवाद आवश्यक नहीं। अपूर्ण क्रिया काल्पनिक शर्त को व्यक्त करती है।
- source_word: לֹא חָפַצְתִּי בָּךְ
  choice: मैं तुझसे प्रसन्न नहीं हूँ
  rationale: חפץ प्रसन्नता या आनन्द लेने का भाव रखता है। यह चयन सम्बन्धपरक और मूल्यांकनात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הִנְנִי
  choice: देख, मैं उपस्थित हूँ
  rationale: यह आत्म-प्रस्तुति का सूत्र है, जो तत्परता और समर्पण दर्शाता है; 'देख' से हिब्रू अभिव्यक्ति की संकेतात्मक शक्ति बनी रहती है।
- source_word: יַעֲשֶׂה לִּי
  choice: वह मेरे साथ ... करे
  rationale: यह रूप स्वेच्छापूर्ण समर्पण और अनुमति का भाव देता है। हिन्दी विधिलिंग उस अर्थ को स्वाभाविक ढंग से रखता है।
- source_word: כַּאֲשֶׁר טוֹב בְּעֵינָיו
  choice: वही ... जो उसकी दृष्टि में अच्छा हो
  rationale: हिब्रू मुहावरे की 'दृष्टि' वाली छवि को रखते हुए इसका अर्थ—जो उसे अच्छा या उचित लगे—स्पष्ट रहता है।
theological_decisions:
- issue: एकवचन पुल्लिंग सर्वनामों का सन्दर्भ
  choice: सन्दर्भ से परमेश्वर के लिए सामान्य रूप में 'वह/उसकी' रखा गया
  alternative: '''यहोवा'' को स्पष्ट रूप से दोहराना, अथवा आदरसूचक ''वे/उनकी'' प्रयोग करना'
  rationale: हिब्रू पाठ यहाँ ईश्वरीय नाम नहीं दोहराता, बल्कि एकवचन सर्वनाम रखता है। हिन्दी में उसी संरचना को रखने से मूल की अभिव्यक्ति सुरक्षित रहती है और पिछले सन्दर्भ से व्यक्ति स्पष्ट है।
- issue: הִנְנִי में समर्पण का भाव
  choice: '''देख, मैं उपस्थित हूँ'' के बाद विधिलिंग में परमेश्वर की इच्छा के प्रति समर्पण व्यक्त किया'
  alternative: केवल 'मैं यहाँ हूँ' या अधिक व्याख्यात्मक 'मैं अपने को उसके हाथ में सौंपता हूँ'
  rationale: मूल सूत्र को बनाए रखते हुए अगले वाक्य से समर्पण स्पष्ट होता है; अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। दाऊद से एकवचन सम्बोधन के अनुरूप 'तुझसे' रखा गया है। परमेश्वर के लिए हिब्रू के एकवचन सर्वनामों को सामान्य हिन्दी रूप में सुरक्षित रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
