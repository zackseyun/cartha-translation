  yaml_path: translation/ot/2_samuel/015/001.yaml
  text: After this[a], Absalom made for himself a chariot and horses[b], and fifty men running before him.
translation:
  language: hi
  text: इसके बाद अबशालोम ने अपने लिए एक रथ, घोड़े और पचास ऐसे आदमी जुटाए[a] जो उसके आगे-आगे दौड़ते थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने लिए बनवाए” अथवा “अपने लिए उपलब्ध किए।” इब्रानी क्रिया बनाने या जुटाने—दोनों अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: किसी व्यक्ति के आगे दौड़ने वाले पचास आदमी राजसी ठाट-बाट वाले जुलूस या अनुरक्षण का संकेत दे सकते हैं; यह अबशालोम के सार्वजनिक आत्म-प्रदर्शन को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מֵאַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह इब्रानी कथात्मक सूत्र के समय-संबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיַּעַשׂ לוֹ
  choice: अपने लिए ... जुटाए
  rationale: עשה לוֹ यहाँ अपने लिए बनाने, उपलब्ध कराने या प्राप्त करने का अर्थ दे सकता है। रथ और घोड़ों के प्रसंग में ‘जुटाए’ स्वाभाविक है और आत्महित का भाव बनाए रखता है।
- source_word: אַבְשָׁלוֹם
  choice: अबशालोम
  rationale: नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: מֶרְכָּבָה וְסֻסִים
  choice: एक रथ और घोड़े
  rationale: मूल सूची को सीधे और बिना ‘राजकीय’ जैसे व्याख्यात्मक विशेषण के रखा गया है।
- source_word: וַחֲמִשִּׁים אִישׁ רָצִים לְפָנָיו
  choice: और पचास आदमी उसके आगे-आगे दौड़ते थे
  rationale: कृदंत רָצִים को चल रही/नियत गतिविधि के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है; לְפָנָיו का गतिशील अर्थ ‘आगे-आगे’ से स्पष्ट होता है।
theological_decisions:
- issue: अबशालोम के जुलूस का राजनीतिक प्रतीकवाद
  choice: मुख्य पाठ में केवल रथ, घोड़ों और आगे दौड़ने वाले आदमियों का वर्णन
  alternative: इसे स्पष्ट रूप से ‘राजसी जुलूस’ या राजपद का दावा कहना
  rationale: मूल पाठ राजसी आत्म-प्रदर्शन का संकेत देता है, पर इस पद में उसकी खुली व्याख्या नहीं करता। इसलिए संकेत को सुरक्षित रखते हुए निष्कर्ष फुटनोट में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जुटाए’ वस्तुओं और सेवक-दल की व्यवस्था के प्रसंग में स्वाभाविक है; मूल क्रिया की दूसरी सम्भावनाएँ फुटनोट में सुरक्षित हैं।
