base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/035.yaml
  text: Are not Zadok and Abiathar the priests there with you? And whatever matter you hear from the king’s house, you shall report to Zadok and Abiathar the priests.
translation:
  language: hi
  text: क्या सादोक और एब्यातार याजक वहाँ तुम्हारे साथ नहीं हैं? राजमहल से जो भी बात तुम सुनो, उसे सादोक और एब्यातार याजकों को बता देना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: यह पद सादोक और एब्यातार की धार्मिक सेवकाई का सामान्य और प्रतिष्ठित हिन्दी बाइबलीय पद है।
- source_word: כָּל הַדָּבָר
  choice: जो भी बात
  rationale: यहाँ דָּבָר का अर्थ संदर्भानुसार समाचार, विषय या बात हो सकता है; स्वाभाविक हिन्दी में ‘जो भी बात’ इस व्यापकता को बनाए रखता है।
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: राजमहल से
  rationale: शाब्दिक ‘राजा के घर से’ यहाँ राजा के दरबार या महल को सूचित करता है; ‘राजमहल’ आधुनिक हिन्दी में आशय स्पष्ट करता है।
- source_word: תַּגִּיד
  choice: बता देना
  rationale: हिफ़ील क्रिया सूचना पहुँचाने या बताने का निर्देश देती है; प्रसंग में यह सहज और सटीक अभिव्यक्ति है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष कथन। प्रश्न की अपेक्षात्मक नकारात्मक संरचना को ‘क्या ... नहीं हैं?’ के रूप में बनाए रखा गया है।
