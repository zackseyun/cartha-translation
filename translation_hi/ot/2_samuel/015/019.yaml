  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל אִתַּ֣י הַ/גִּתִּ֔י לָ֧/מָּה תֵלֵ֛ךְ גַּם אַתָּ֖ה אִתָּ֑/נוּ שׁ֣וּב וְ/שֵׁ֤ב עִם הַ/מֶּ֨לֶךְ֙ כִּֽי נָכְרִ֣י אַ֔תָּה וְ/גַם גֹּלֶ֥ה אַתָּ֖ה לִ/מְקוֹמֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/019.yaml
  text: Then the king said to Ittai the Gittite[a], “Why are you also going with us? Return and stay with the king[c][b], for you are a foreigner and also an exile from your own place.”
translation:
  language: hi
  text: तब राजा ने गित्ती इत्तै से कहा, “तुम भी हमारे साथ क्यों जा रहे हो?[a] लौट जाओ और राजा के साथ रहो,[b] क्योंकि तुम परदेशी हो और अपने स्थान से निर्वासित भी हो।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम भी हमारे साथ क्यों जाओगे?”
    reason: इब्रानी अपूर्ण क्रिया को भविष्यकालीन भाव में भी समझा जा सकता है।
  - marker: b
    text: यहाँ “राजा के साथ” का आशय यरूशलेम में शासन कर रहे राजकीय अधिकार के अधीन रहना हो सकता है; इब्रानी पाठ स्पष्ट रूप से यह नहीं बताता कि किस राजा की बात है।
    reason: मूल पाठ में संदर्भ अस्पष्ट है और किसी नाम से उसकी पहचान नहीं की गई है।
  - marker: c
    text: या, “और तुम अपने स्थान की ओर/के संबंध में भी निर्वासित हो।” इब्रानी अभिव्यक्ति संक्षिप्त है और इत्तै की विस्थापित दशा तथा उसके अपने स्थान से संबंध पर बल दे सकती है।
    reason: לִמְקוֹמֶךָ का दिशात्मक या संबंधवाचक संबंध संक्षिप्त इब्रानी पदबंध में पूरी तरह स्पष्ट नहीं है; मुख्य पाठ प्रसंगानुकूल अर्थ देता है।
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: तब राजा ने ... कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘राजा’ मूल की उपाधि को बनाए रखता है।
- source_word: אִתַּי הַגִּתִּי
  choice: गित्ती इत्तै
  rationale: व्यक्तिनाम को ‘इत्तै’ लिप्यंतरित किया गया है और जातिवाचक विशेषण ‘गित्ती’ उसके गत नगर से संबंध को दर्शाता है।
- source_word: לָמָּה תֵלֵךְ גַּם אַתָּה אִתָּנוּ
  choice: तुम भी हमारे साथ क्यों जा रहे हो?
  rationale: अपूर्ण क्रिया को प्रसंगानुसार वर्तमान प्रगतिशील अर्थ में लिया गया है; ‘भी’ גַּם को सुरक्षित रखता है।
- source_word: שׁוּב וְשֵׁב
  choice: लौट जाओ और ... रहो
  rationale: दोनों आज्ञार्थक क्रियाओं को अलग रखा गया है। यहाँ ישׁב का आशय बैठना नहीं, बल्कि ठहरना या निवास करना है।
- source_word: עִם הַמֶּלֶךְ
  choice: राजा के साथ
  rationale: मूल पाठ की अभिव्यक्ति को बिना किसी व्यक्ति का नाम जोड़कर ज्यों का त्यों रखा गया है, क्योंकि यहाँ ‘राजा’ का अभिप्रेत व्यक्ति स्पष्ट रूप से निर्दिष्ट नहीं है।
- source_word: נָכְרִי
  choice: परदेशी
  rationale: यह इत्तै की गैर-स्थानीय स्थिति व्यक्त करता है और आधुनिक हिन्दी में ‘अजनबी’ की अपेक्षा अधिक सटीक है।
- source_word: וְגַם גֹּלֶה אַתָּה לִמְקוֹמֶךָ
  choice: और अपने स्थान से निर्वासित भी हो
  rationale: גֹּלֶה विस्थापित या निर्वासित व्यक्ति को दर्शाता है। हिन्दी में ‘अपने स्थान से’ अर्थ को सहज बनाता है, जबकि पादटिप्पणी मूल के संक्षिप्त और शाब्दिक रूप ‘अपने स्थान को’ की अस्पष्टता बताती है।
theological_decisions:
- issue: ‘राजा के साथ रहो’ में ‘राजा’ का संदर्भ
  choice: मुख्य पाठ में केवल ‘राजा के साथ’ रखा गया है।
  alternative: ‘राजा अबशालोम के साथ’, ‘यरूशलेम में राजा के साथ’, या ‘मेरे साथ’
  rationale: इब्रानी पाठ नाम नहीं देता और उपाधि को दोहराता है। किसी एक व्यक्ति की पहचान जोड़ना पाठ की वास्तविक अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
- issue: לִמְקוֹמֶךָ का संबंध और दिशा
  choice: मुख्य पाठ में स्वाभाविक हिन्दी ‘अपने स्थान से निर्वासित’ रखा गया है।
  alternative: ‘अपने स्थान को निर्वासित’ या ‘अपने स्थान पर निर्वासित’
  rationale: इब्रानी में לִ־ सामान्यतः ‘को/की ओर’ है, पर पूरी अभिव्यक्ति अत्यंत संक्षिप्त है। मुख्य पाठ विस्थापित स्थिति का प्रसंगगत अर्थ देता है और पादटिप्पणी शाब्दिक कठिनाई सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘गित्ती’ बाइबलीय जातिवाचक संज्ञा के रूप में सुरक्षित है; ‘परदेशी’ और ‘निर्वासित’ सामान्य पाठक के लिए स्पष्ट हैं। मूल की दो प्रमुख अस्पष्टताएँ—‘राजा’ का संदर्भ और अंतिम संक्षिप्त पदबंध—मुख्य पाठ तथा पादटिप्पणियों में बिना सांप्रदायिक व्याख्या थोपे सुरक्षित रखी गई हैं।
