  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज राजदरबारी कथन। ‘हम वैसा ही करेंगे’ हिब्रू में निहित आज्ञापालन को स्वाभाविक हिन्दी में स्पष्ट करता है; किसी संप्रदायगत व्याख्या का समावेश नहीं किया गया।
