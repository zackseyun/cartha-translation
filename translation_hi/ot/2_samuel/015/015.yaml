translation:
  language: hi
  text: राजा के सेवकों ने राजा से कहा, “मेरे स्वामी राजा जो कुछ चुनें, हम आपके सेवक हाज़िर हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: कहा
  rationale: אמר का सामान्य कथात्मक रूप है, जो प्रत्यक्ष वचन का परिचय देता है; आधुनिक हिन्दी में ‘कहा’ स्वाभाविक है।
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: राजा के सेवकों
  rationale: दरबारी संदर्भ में עבד राजकीय सेवक या आश्रित अधिकारी को दर्शा सकता है; ‘सेवक’ दासत्व को अनावश्यक रूप से प्रमुख किए बिना उपयुक्त अर्थ देता है।
- source_word: כְּכֹל אֲשֶׁר יִבְחַר
  choice: जो कुछ चुनें, हम वैसा ही करेंगे
  rationale: शाब्दिक भाव ‘उस सबके अनुसार जो ... चुनें’ है। हिन्दी में यह रूप राजा की इच्छा के पूर्ण पालन की तत्परता को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: हमारे स्वामी राजा
  rationale: यह सम्मानसूचक राजदरबारी संबोधन है। वक्ता सामूहिक हैं, इसलिए हिन्दी में भावानुकूल ‘हमारे’ रखा गया है, यद्यपि हिब्रू रूप व्याकरणतः एकवचन ‘मेरे स्वामी’ है।
- source_word: הִנֵּה עֲבָדֶיךָ
  choice: हम, आपके सेवक, यहाँ उपस्थित हैं
  rationale: הִנֵּה यहाँ प्रस्तुति और तत्काल उपलब्धता दर्शाता है। यह हिन्दी रूप सेवकों की उपस्थित तत्परता व्यक्त करता और עבד की पुनरावृत्ति बचाता है।
