lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: कहा
  rationale: इब्रानी कथात्मक क्रिया אמר के सामान्य और स्वाभाविक अर्थ को व्यक्त करता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: संदर्भ में ज्ञात राजा दाऊद की ओर संकेत करने वाले निश्चित संज्ञा-रूप को नाम जोड़कर अधिक स्पष्ट किए बिना बनाए रखता है।
- source_word: לֵךְ בְּשָׁלוֹם
  choice: कुशल से जाओ
  rationale: प्रस्थान के समय प्रयुक्त आशीर्वादात्मक इब्रानी मुहावरे का स्वाभाविक, गरिमापूर्ण हिन्दी रूप है और בְּשָׁלוֹם के भाव को सुरक्षित रखता है।
- source_word: וַיָּקָם
  choice: वह उठा
  rationale: קום की कथात्मक क्रिया को सीधे व्यक्त करता है और आगे जाने से पहले उठने की क्रमिक क्रिया बनाए रखता है।
- source_word: וַיֵּלֶךְ
  choice: चला गया
  rationale: הלך की गतिसूचक क्रिया का संदर्भानुकूल और सहज हिन्दी रूप है।
- source_word: חֶבְרוֹנָה
  choice: हेब्रोन
  rationale: स्थान-नाम के साथ लगी दिशासूचक ה को हिन्दी की ‘चला गया’ रचना में गंतव्य के रूप में स्वाभाविक ढंग से व्यक्त किया गया है।
