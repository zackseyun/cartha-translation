    text: या “यदि तुम मेरे साथ पार जाओगे।” इब्रानी क्रिया का अधिक शाब्दिक अर्थ “पार जाना” या “उस पार जाना” हो सकता है; प्रसंग में इसका अर्थ “आगे बढ़ना” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... דָּוִד
  choice: दाऊद ने ... कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; आधुनिक हिन्दी में अलग से ‘तब’ या ‘और’ जोड़े बिना यह स्वाभाविक है।
- source_word: לוֹ
  choice: उससे
  rationale: इब्रानी पाठ में पुरुषवाचक सर्वनाम है, नाम नहीं; इसलिए प्रसंग से हूशै का नाम जोड़ने के बजाय सर्वनाम रखा गया है।
- source_word: אִם
  choice: यदि
  rationale: यह सीधे रूप में शर्त प्रस्तुत करता है और गरिमापूर्ण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: עָבַרְתָּ אִתִּי
  choice: तुम मेरे साथ आगे चलोगे
  rationale: עבר का मूल अर्थ ‘पार जाना/आगे निकलना’ हो सकता है; यहाँ दाऊद के साथ यात्रा जारी रखने का भाव है। ‘आगे चलोगे’ उस संदर्भगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: וְהָיִתָ עָלַי
  choice: तो तुम मेरे लिए ... बनोगे
  rationale: היה + על यहाँ दाऊद पर पड़ने वाले परिणाम या भार को दर्शाता है; हिन्दी में ‘मेरे लिए ... बनोगे’ इसका स्वाभाविक रूप है।
- source_word: לְמַשָּׂא
  choice: बोझ
  rationale: מַשָּׂא किसी उठाए जाने वाले भार या बोझ को दर्शाता है; व्यक्ति के साथ होने के प्रभाव के संदर्भ में ‘बोझ’ स्पष्ट और स्वाभाविक है।
