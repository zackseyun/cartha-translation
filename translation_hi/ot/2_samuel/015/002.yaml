  yaml_path: translation/ot/2_samuel/015/002.yaml
  text: Absalom would rise early and stand beside the road to the gate. Whenever any man had a dispute and came to the king for judgment[a], Absalom would call to him and say, “From what city are you?” And he would say, “Your servant is from one of the tribes of Israel.”
translation:
  language: hi
  text: अबशालोम भोर में जल्दी उठता और फाटक की ओर जाने वाले रास्ते के किनारे खड़ा हो जाता था। जब भी कोई व्यक्ति अपना मुकदमा[a] लेकर न्याय के लिए राजा के पास आता, तब अबशालोम उसे पुकारकर पूछता, “तुम किस नगर के हो?” वह उत्तर देता, “आपका सेवक इस्राएल के किसी एक गोत्र से है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपना विवाद” अथवा “अपनी शिकायत”; इब्रानी शब्द רִיב न्यायिक प्रसंग में विवाद, शिकायत या कानूनी मामला सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁכִּים
  choice: सवेरे जल्दी उठता
  rationale: क्रिया का अर्थ सवेरे उठना है; प्रसंग में बार-बार की जाने वाली क्रिया को हिंदी के अभ्यस्त भूतकाल से व्यक्त किया गया है।
- source_word: וְעָמַד
  choice: खड़ा हो जाता था
  rationale: मूल अर्थ ‘खड़ा होना’ है; संयुक्त अभ्यस्त क्रिया अबशालोम की नियमित गतिविधि दिखाती है।
- source_word: עַל יַד דֶּרֶךְ הַשָּׁעַר
  choice: फाटक की ओर जाने वाले रास्ते के किनारे
  rationale: עַל יַד का स्थानवाचक अर्थ ‘के किनारे/पास’ है और דֶּרֶךְ הַשַּׁעַר फाटक की ओर जाने वाले मार्ग को सूचित करता है।
- source_word: רִיב
  choice: मुकदमा
  rationale: न्यायिक प्रसंग में यह शब्द विवाद, शिकायत या कानूनी मामला सूचित कर सकता है; ‘मुकदमा’ यहाँ स्वाभाविक है, जबकि व्यापक अर्थ फुटनोट में सुरक्षित रखा गया है।
- source_word: לָבוֹא אֶל־הַמֶּלֶךְ לַמִּשְׁפָּט
  choice: न्याय के लिए राजा के पास आता
  rationale: מִשְׁפָּט यहाँ न्यायिक निर्णय या न्याय पाने की प्रक्रिया को दर्शाता है; ‘न्याय के लिए’ अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וַיִּקְרָא ... אֵלָיו
  choice: उसे पुकारकर
  rationale: क्रिया का अर्थ किसी को पुकारना है; इसे औपचारिक रूप से बुलाने या समन करने के अर्थ में अधिक प्रबल नहीं बनाया गया।
- source_word: אֵי מִזֶּה עִיר אַתָּה
  choice: तुम किस नगर के हो?
  rationale: यह मूल प्रश्न का स्वाभाविक आधुनिक हिंदी रूप है और व्यक्ति के नगरगत मूल के बारे में पूछता है।
- source_word: מֵאַחַד שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के गोत्रों में से एक का
  rationale: संक्षिप्त इब्रानी उत्तर गोत्रीय संबंध बताता है; हिंदी में ‘का’ इस संबंध को सहजता से व्यक्त करता है।
- source_word: עַבְדֶּךָ
  choice: आपका सेवक
  rationale: यहाँ शब्द सम्मानसूचक आत्म-संदर्भ है; ‘सेवक’ सामाजिक विनम्रता को व्यक्त करता है, बिना दासत्व पर अनावश्यक बल दिए।
