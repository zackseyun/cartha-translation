    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא הַמַּגִּיד
  choice: तब एक संदेशवाहक ने ... आकर
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है। הַמַּגִּיד समाचार लाने वाले व्यक्ति को दर्शाता है; हिन्दी में पहली बार परिचय के लिए ‘एक संदेशवाहक’ स्वाभाविक है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: प्रत्यक्ष कथन का परिचय देने वाले इस इन्फिनिटिव को हिन्दी में ‘कहा’ से सहज और सटीक रूप मिलता है।
- source_word: הָיָה לֶב
  choice: मन ... हो गया है
  rationale: ‘हृदय/मन होना’ यहाँ भीतरी झुकाव और निष्ठा का बोध कराता है। הָיָה में बदली हुई स्थिति का भाव हो सकता है, जिसे ‘हो गया है’ व्यक्त करता है।
- source_word: אִישׁ יִשְׂרָאֵל
  choice: इस्राएल के पुरुषों
  rationale: एकवचन אִישׁ यहाँ सामूहिक अर्थ में है। ‘पुरुषों’ मूल के पुल्लिंग और सम्भावित राजनीतिक-सैन्य संदर्भ को बनाए रखता है।
- source_word: אַחֲרֵי
  choice: की ओर
  rationale: शाब्दिक अर्थ ‘पीछे’ है, पर इस प्रयोग में किसी के पक्ष में झुकने या उसका अनुसरण करने का भाव है। ‘की ओर’ मूल रूपक को रखते हुए हिन्दी में निष्ठा के बदलने का संकेत देता है।
- source_word: אַבְשָׁלוֹם
  choice: अबशालोम
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबिलीय लिप्यंतरण।
