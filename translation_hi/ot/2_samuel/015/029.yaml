  text: So Zadok and Abiathar returned the ark of God to Jerusalem, and they stayed there.
translation:
  language: hi
  text: तब सादोक और एब्यातार परमेश्वर के सन्दूक को यरूशलेम को वापस ले गए, और वहीं ठहरे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: वापस ले गए
  rationale: 'שׁוב का हिफ़ील रूप यहाँ सकर्मक और कारणवाचक अर्थ रखता है: उन्होंने सन्दूक को यरूशलेम लौटाया। ‘वापस ले गए’ आधुनिक हिन्दी में इस अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।'
- source_word: צָדוֹק
  choice: सादोक
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: וְאֶבְיָתָר
  choice: और एब्यातार
  rationale: संयोजक को बनाए रखते हुए व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: אֶת אֲרוֹן הָאֱלֹהִים
  choice: परमेश्वर के सन्दूक को
  rationale: मूल पाठ के संक्षिप्त पद ‘परमेश्वर का सन्दूक’ को सुरक्षित रखा गया है; ‘वाचा’ जैसा अतिरिक्त विचार नहीं जोड़ा गया। ‘को’ सकर्मक क्रिया के कर्म को स्पष्ट करता है।
- source_word: יְרוּשָׁלָם
  choice: यरूशलेम
  rationale: गंतव्य का भाव ‘वापस ले गए’ से स्वाभाविक रूप से स्पष्ट होता है, इसलिए अलग परसर्ग आवश्यक नहीं है।
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: और वहीं ठहरे
  rationale: ישׁב का प्रसंगानुकूल अर्थ यहाँ वहाँ बने रहना या ठहरना है। ‘वहीं ठहरे’ सहज आधुनिक हिन्दी है और שָׁם के स्थान-संदर्भ को स्पष्ट रखता है।
