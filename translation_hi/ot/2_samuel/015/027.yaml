base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/027.yaml
  text: Then the king said to Zadok the priest[a], “Are you a seer? Return to the city in peace, and your two sons with you, Ahimaaz your son and Jonathan son of Abiathar.”
translation:
  language: hi
  text: तब राजा ने सादोक याजक से कहा, “क्या तुम दर्शी हो?[a] नगर लौट जाओ, सकुशल; और तुम दोनों के दो पुत्र तुम्हारे साथ हों—अहीमास, तुम्हारा पुत्र, और योनातान, एब्यातार का पुत्र।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “तुम देखते हो न?” हिब्रू शब्द का अर्थ ‘दर्शी’ भी हो सकता है और ‘देखने या समझने’ के विषय में प्रश्न भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/רוֹאֶה
  choice: क्या तुम दर्शी हो?
  rationale: प्रश्नवाचक הֲ और רֹאֶה के ‘देखने वाला/दर्शी’ अर्थ को बनाए रखता है। संदर्भ में यह सादोक की देखने-समझने और सूचना पहुँचाने की भूमिका की ओर संकेत कर सकता है; वैकल्पिक पाठार्थ पादटिप्पणी में रखा गया है।
- source_word: שֻׁבָ/ה הָ/עִיר
  choice: नगर लौट जाओ
  rationale: שוב के स्त्रीलिंग एकवचन आदेश और गंतव्य ‘नगर’ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּ/שָׁלוֹם
  choice: कुशल से
  rationale: यहाँ שָׁלוֹם सुरक्षित और सकुशल लौटने का भाव देता है; ‘कुशल से’ हिन्दी में स्वाभाविक है और केवल संघर्ष-विहीनता तक अर्थ को सीमित नहीं करता।
- source_word: שְׁנֵי בְנֵי/כֶם אִתְּ/כֶם
  choice: तुम्हारे साथ तुम्हारे दोनों पुत्र भी जाएँ
  rationale: हिब्रू में ‘तुम दोनों के दो पुत्र’ का आशय सादोक और एब्यातार के क्रमशः एक-एक पुत्र से है। हिन्दी वाक्य में संबोधन सादोक से है, पर बाद में दोनों पुत्रों की स्पष्ट पहचान मूल की संरचना और आशय को सुरक्षित रखती है।
- source_word: וַ/אֲחִימַעַץ בִּנְ/ךָ וִ/יהוֹנָתָן בֶּן אֶבְיָתָר
  choice: तुम्हारा पुत्र अहीमास और एब्यातार का पुत्र योनातान
  rationale: दोनों पुत्रों की समानांतर पहचान स्पष्ट रखी गई है और व्यक्तिवाचक नामों का प्रचलित हिन्दी लिप्यंतरण किया गया है।
theological_decisions:
- issue: सादोक के लिए הֲרֹאֶה का अर्थ
  choice: मुख्य पाठ में ‘क्या तुम दर्शी हो?’
  alternative: ‘तुम देखते हो न?’ या ‘क्या तुम समझते हो?’
  rationale: मूल रूप को पदवी/भूमिका ‘दर्शी’ अथवा देखने-समझने संबंधी प्रश्न, दोनों प्रकार से ग्रहण किया जा सकता है। मुख्य पाठ संज्ञात्मक संभावना को रखता है और पादटिप्पणी वास्तविक अस्पष्टता बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली। ‘याजक’, ‘दर्शी’ और ‘नगर’ जैसे बाइबलीय किंतु सामान्यतः बोधगम्य शब्द रखे गए हैं। ‘कुशल से’ שָׁלוֹם के संदर्भगत सुरक्षित वापसी के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
