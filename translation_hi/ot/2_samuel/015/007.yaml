source:
  edition: WLC
  text: וַ/יְהִ֕י מִ/קֵּ֖ץ אַרְבָּעִ֣ים שָׁנָ֑ה וַ/יֹּ֤אמֶר אַבְשָׁלוֹם֙ אֶל הַ/מֶּ֔לֶךְ אֵ֣לֲכָה נָּ֗א וַ/אֲשַׁלֵּ֛ם אֶת נִדְרִ֛/י אֲשֶׁר נָדַ֥רְתִּי לַֽ/יהוָ֖ה בְּ/חֶבְרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/007.yaml
  text: And at the end of forty years, Absalom said to the king, “Please let me go and pay the vow that I vowed to the LORD in Hebron.”
translation:
  language: hi
  text: चालीस वर्ष[a] बीतने पर अबशालोम ने राजा से कहा, “कृपया मुझे जाने दीजिए, ताकि मैं हेब्रोन जाकर यहोवा के लिए मानी हुई अपनी मन्नत पूरी करूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन पाठ-परंपराओं में “चार वर्ष” है।
    reason: मसोरेटिक ‘चालीस’ कालक्रम की दृष्टि से कठिन है, जबकि प्राचीन साक्ष्य में ‘चार’ का पाठ भी मिलता है; पाठक को वास्तविक पाठांतर से अवगत कराना आवश्यक है।
lexical_decisions:
- source_word: מִקֵּץ אַרְבָּעִים שָׁנָה
  choice: चालीस वर्ष बीतने पर
  rationale: मसोरेटिक पाठ के ‘चालीस वर्ष के अंत में’ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; संख्या-संबंधी प्राचीन पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אֵלֲכָה נָּא
  choice: कृपया मुझे ... जाने दीजिए
  rationale: सहवाची रूप और נָא मिलकर राजा से विनम्र अनुमति माँगने का भाव देते हैं।
- source_word: וַאֲשַׁלֵּם אֶת־נִדְרִי
  choice: ताकि मैं ... अपनी मन्नत पूरी करूँ
  rationale: שׁלם के पिएल रूप का अर्थ मन्नत का दायित्व पूरा करना/चुकाना है; हिन्दी में ‘मन्नत पूरी करना’ इसका सहज और प्रचलित रूप है।
- source_word: לַיהוָה
  choice: यहोवा से
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी के परिचित रूप ‘यहोवा’ में रखा गया है; ‘मन्नत मानना’ के साथ हिन्दी में ‘से’ स्वाभाविक है।
- source_word: בְּחֶבְרוֹן
  choice: हेब्रोन
  rationale: स्थान-सूचक पद को ‘जाने’ के साथ रखा गया है, क्योंकि अगले पद के अनुसार मन्नत गशूर में मानी गई थी और उसे हेब्रोन में पूरा किया जाना था।
theological_decisions:
- issue: בְּחֶבְרוֹן का वाक्यगत संबंध
  choice: हेब्रोन को मन्नत पूरी करने के स्थान के रूप में व्यक्त किया गया
  alternative: ‘जो मन्नत मैंने हेब्रोन में यहोवा से मानी थी’
  rationale: अगला पद स्पष्ट करता है कि अबशालोम ने मन्नत गशूर में रहते समय मानी थी; इसलिए हेब्रोन को मन्नत मानने का स्थान बताना संदर्भ से टकराता है।
- issue: אַרְבָּעִים (‘चालीस’) का पाठांतर
  choice: मुख्य पाठ में WLC/मसोरेटिक पाठ ‘चालीस’ रखा गया
  alternative: ‘चार वर्ष’
  rationale: दिए गए मूल-भाषा स्रोत का पाठ ‘चालीस’ है; कालक्रम की कठिनाई को मुख्य पाठ में अनुमान से नहीं बदला गया, बल्कि पाठांतर पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मन्नत पूरी करना’ धार्मिक संदर्भ में प्रचलित हिन्दी है। राजा को संबोधन में ‘दीजिए’ विनम्र निवेदन को दर्शाता है।
