base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/031.yaml
  text: And it was told David[a], saying, “Ahithophel is among the conspirators with Absalom.” And David said, “O Yahweh, please turn Ahithophel’s counsel into foolishness.”
translation:
  language: hi
  text: दाऊद को यह सूचना दी गई, “अहीतोपेल अबशालोम के साथ षड्यंत्रकारियों में शामिल है।” तब दाऊद ने कहा, “हे याहवे, कृपा करके अहीतोपेल की सलाह को मूर्खतापूर्ण बना दे[a]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अहीतोपेल की सलाह को विफल कर दे।” हिब्रू में अधिक शाब्दिक रूप से उसकी सलाह को मूर्खतापूर्ण बना देने की प्रार्थना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּיד
  choice: यह सूचना दी गई
  rationale: हिफ़ील क्रिया का अर्थ ‘बताया/सूचित किया गया’ है। कर्मवाच्य प्रयोग मूल में कर्ता के अनिर्दिष्ट रहने को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष उद्धरण द्वारा व्यक्त
  rationale: हिब्रू का उद्धरण-सूचक रूप हिन्दी में अलग से ‘यह कहते हुए’ जोड़ने के बजाय सीधे उद्धरण आरम्भ करके अधिक स्वाभाविक ढंग से व्यक्त होता है।
- source_word: בַּקֹּשְׁרִים
  choice: षड्यंत्रकारियों में
  rationale: बहुवचन रूप किसी अमूर्त षड्यंत्र से अधिक षड्यंत्र रचने वाले समूह को दर्शाता है।
- source_word: עִם
  choice: के साथ
  rationale: यह अबशालोम से अहीतोपेल की संगति और पक्षधरता को सीधे व्यक्त करता है।
- source_word: סַכֶּל
  choice: मूर्खता में बदल दे
  rationale: पिएल आज्ञार्थक रूप सलाह को मूर्ख या निष्फल कर देने की प्रार्थना है। यह अनुवाद केवल ‘विफल कर दे’ कहने की अपेक्षा मूल के ‘मूर्खता’ संबंधी भाव को स्पष्ट रखता है।
- source_word: נָא
  choice: कृपा करके
  rationale: यह विनती और आग्रह का सूचक है; ‘कृपा करके’ प्रार्थना के आदरपूर्ण और याचनापूर्ण स्वर को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עֲצַת
  choice: सलाह
  rationale: यहाँ शब्द अहीतोपेल की रणनीतिक मंत्रणा को दर्शाता है। ‘सलाह’ आधुनिक पाठक के लिए स्पष्ट है और प्रसंग में पर्याप्त गंभीरता रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
theological_decisions:
- issue: प्रत्यक्ष संबोधन में יְהוָה का अनुवाद
  choice: हे याहवे
  alternative: हे प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है, इसलिए उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। ‘हे’ हिन्दी में प्रत्यक्ष संबोधन को स्वाभाविक बनाता है।
- issue: अहीतोपेल की सलाह के विषय में प्रार्थना का आशय
  choice: सलाह को मूर्खता में बदल दे
  alternative: सलाह को विफल कर दे
  rationale: मूल शब्द सलाह को मूर्ख ठहराने और उसे निष्फल करने—दोनों की ओर संकेत कर सकता है। मुख्य पाठ शाब्दिक चित्र को बचाता है, जबकि पादटिप्पणी परिणामपरक अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘यह सूचना दी गई’ मूल के अनिर्दिष्ट सूचक को बनाए रखता है; नामों के लिए प्रचलित हिन्दी बाइबलीय रूप दाऊद, अहीतोपेल और अबशालोम प्रयुक्त हुए हैं।
