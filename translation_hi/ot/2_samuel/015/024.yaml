base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/024.yaml
  text: And look[a], Zadok also came, and all the Levites with him, carrying the ark of the covenant of God. And they set down the ark of God[c][b], and Abiathar went up until all the people had finished crossing over from the city.
translation:
  language: hi
  text: और देखो, सादोक भी आया, और उसके साथ के सभी लेवी परमेश्वर की वाचा का संदूक उठाए हुए थे। उन्होंने परमेश्वर का संदूक नीचे रख दिया[b], और एब्यातार ऊपर गया[c], जब तक कि सभी लोग नगर से पार निकल गए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात यरूशलेम से।
    reason: cross_reference
  - marker: b
    text: या, ‘उन्होंने परमेश्वर का संदूक स्थापित किया।’ इब्रानी क्रिया का अर्थ उसे नीचे रखना या किसी स्थान पर स्थापित करना हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘एब्यातार ऊपर आया।’ इब्रानी में शाब्दिक रूप से ‘ऊपर गया’ है; यहाँ कथा में गति का सटीक भाव अनिश्चित है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह अभिव्यक्ति कथा में एक नए दृश्य की ओर सजीव ढंग से ध्यान खींचती है। ‘और देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसके संवादगत बल को बनाए रखता है।
- source_word: גַם צָדוֹק וְכָל־הַלְוִיִּם אִתּוֹ
  choice: सादोक भी अपने साथ के सभी लेवियों समेत वहाँ था
  rationale: इब्रानी वाक्यांश क्रियारहित है; ‘वहाँ था’ हिन्दी में आवश्यक पूर्ति देता है, पर स्रोत में निहित न होने के कारण ‘आया’ जैसी गति नहीं जोड़ता। ‘भी’ גַם के योगसूचक अर्थ को रखता है।
- source_word: נֹשְׂאִים
  choice: उठाए हुए थे
  rationale: कृदन्त लेवियों की जारी अवस्था और कार्य बताता है। यह हिन्दी में संदूक को ले जाने का स्वाभाविक वर्णन है।
- source_word: אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: परमेश्वर की वाचा का संदूक
  rationale: पूरी इब्रानी संबंध-श्रृंखला और ‘वाचा’ की स्पष्ट भाषा को सुरक्षित रखा गया है।
- source_word: וַיַּצִּקוּ
  choice: नीचे रख दिया
  rationale: इस प्रसंग में क्रिया संदूक को रख देने या किसी स्थान पर स्थापित करने को दर्शाती है। ‘नीचे रख दिया’ तत्काल कथात्मक क्रिया को स्पष्ट करता है; व्यापक विकल्प पादटिप्पणी में दिया गया है।
- source_word: וַיַּעַל אֶבְיָתָר
  choice: एब्यातार ऊपर गया
  rationale: עלה के मूल ऊर्ध्वगामी अर्थ को बिना किसी याजकीय गतिविधि का अनुमान जोड़े सुरक्षित रखा गया है।
- source_word: עַד תֹּם כָּל־הָעָם לַעֲבוֹר מִן־הָעִיר
  choice: जब तक कि सब लोग नगर से निकलकर पार नहीं हो गए
  rationale: עַד תֹּם की समाप्ति-सीमा और עבר की पार जाने की गति को सहज हिन्दी काल-वाक्य में व्यक्त किया गया है। ‘नगर’ को मुख्य पाठ में विशिष्ट नाम से नहीं बदला गया।
theological_decisions:
- issue: ‘नगर’ का संदर्भ
  choice: मुख्य पाठ में ‘नगर’
  alternative: यरूशलेम
  rationale: इब्रानी में सामान्य पद ‘नगर’ है। प्रसंग से यरूशलेम अभिप्रेत है, लेकिन उस पहचान को मुख्य पाठ में स्रोत की शब्दावली के स्थान पर नहीं रखा गया; पादटिप्पणी इसे स्पष्ट करती है।
- issue: וַיַּעַל אֶבְיָתָר का आशय
  choice: एब्यातार ऊपर गया
  alternative: एब्यातार ऊपर आया
  rationale: मूल क्रिया का सीधा अर्थ ऊपर जाना है। कथात्मक दृष्टिकोण की अनिश्चितता को वैकल्पिक अनुवाद में रखा गया है और बलि चढ़ाने जैसी व्याख्यात्मक धारणा नहीं जोड़ी गई।
- issue: सादोक के आने की क्रिया
  choice: वहाँ था
  alternative: आया
  rationale: इस उपवाक्य में इब्रानी की कोई व्यक्त क्रिया नहीं है। हिन्दी की व्याकरणिक आवश्यकता पूरी करने के लिए अस्तित्वसूचक क्रिया दी गई है, जिससे स्रोत से परे गति का दावा नहीं जुड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘वाचा का संदूक’ स्थापित बाइबलीय पदावली है। दृश्यसूचक ‘और देखो’ को पुरातन ‘और निहारो’ की अपेक्षा चुना गया है। सभी पादटिप्पणी-चिह्न संबंधित पदों के बाद मुख्य पाठ में रखे गए हैं।
