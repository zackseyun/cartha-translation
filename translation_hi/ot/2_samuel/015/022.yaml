  text: Then David said to Ittai, “Go on and cross over.” So Ittai the Gittite crossed over, along with all his men and all the little ones who were with him.
translation:
  language: hi
  text: तब दाऊद ने इत्तै से कहा, “आगे बढ़ो और पार जाओ।” तब गित्ती इत्तै अपने सब आदमियों और अपने साथ के सब बाल-बच्चों समेत पार गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ וַעֲבֹר
  choice: आगे बढ़ो और पार जाओ
  rationale: दोनों आज्ञार्थक क्रियाओं को अलग रखते हुए לֵךְ के प्रसंगगत आगे बढ़ने के भाव और עֲבֹר के पार जाने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַגִּתִּי
  choice: गित्ती
  rationale: यह इत्तै की भौगोलिक/जातीय पहचान, अर्थात् गत नगर के निवासी, को पारंपरिक संक्षिप्त रूप में बनाए रखता है।
- source_word: כָל אֲנָשָׁיו
  choice: अपने सब आदमियों
  rationale: सैनिक-सहचरों के इस समूह के लिए 'आदमियों' प्रसंगानुकूल है और मूल के व्यापक पद को अनावश्यक रूप से केवल 'सैनिक' तक सीमित नहीं करता।
- source_word: כָל הַטַּף
  choice: सब बाल-बच्चों
  rationale: הַטַּף प्रायः आश्रित छोटे बच्चों/परिवार के नन्हे सदस्यों को सूचित करता है; 'बाल-बच्चों' से हिन्दी में समूहगत और पारिवारिक भाव स्वाभाविक रूप से आता है।
