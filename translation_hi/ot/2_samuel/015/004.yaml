base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/004.yaml
  text: Then Absalom would say[a], “If only I were appointed judge in the land! Then every man who has a dispute or a case could come to me[c][b], and I would give him justice.”
translation:
  language: hi
  text: तब अबशालोम कहता था,[a] “काश, कोई मुझे देश में न्यायाधीश नियुक्त कर देता! तब जिस किसी का कोई विवाद या मुकदमा होता, वह मेरे पास आता, और मैं उसे न्याय दिलाता।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “कौन मुझे देश में न्यायाधीश नियुक्त करेगा?” इब्रानी कथन प्रश्न के रूप में है, पर यहाँ वह अबशालोम की इच्छा व्यक्त करता है।'
    reason: lexical_alternative
  - marker: b
    text: या “मैं उसे सही ठहराता” अथवा “मैं उसके पक्ष में निर्णय देता।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब अबशालोम कहा करता था
  rationale: आसपास के प्रसंग में यह अबशालोम की बार-बार कही जाने वाली बात है; हिंदी का ‘कहा करता था’ इस पुनरावृत्त भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִי יְשִׂמֵנִי
  choice: काश, कोई मुझे ... नियुक्त कर देता
  rationale: शाब्दिक प्रश्न ‘कौन मुझे नियुक्त करेगा?’ यहाँ जानकारी माँगने के बजाय प्रबल इच्छा व्यक्त करने वाला आलंकारिक कथन है। ‘कोई’ मूल के अनिर्दिष्ट מִי को बनाए रखता है।
- source_word: שֹׁפֵט
  choice: न्यायी
  rationale: यह न्यायिक मामलों का निर्णय करने वाले पद को सूचित करता है; ‘न्यायी’ बाइबलीय प्रसंग में गरिमापूर्ण और समझने योग्य है।
- source_word: בָּאָרֶץ
  choice: इस देश में
  rationale: אָרֶץ का यहाँ आशय उस भू-राजनीतिक क्षेत्र से है जहाँ अबशालोम पद चाहता था; हिंदी में ‘इस देश में’ स्वाभाविक है।
- source_word: כָּל אִישׁ אֲשֶׁר
  choice: जिस किसी का
  rationale: व्याकरणतः पुल्लिंग एकवचन होने पर भी अभिव्यक्ति सामान्य रूप से किसी भी व्यक्ति को समेटती है; ‘जिस किसी’ यह व्यापक अर्थ स्वाभाविक हिंदी में देता है।
- source_word: רִיב וּמִשְׁפָּט
  choice: कोई विवाद या मुकदमा
  rationale: रִיב विवाद या कानूनी झगड़े और מִשְׁפָּט न्यायिक मामला सूचित करता है; ‘विवाद या मुकदमा’ दोनों पहलुओं को स्पष्ट रखता है।
- source_word: וְעָלַי יָבוֹא
  choice: वह मेरे पास आ सकता था
  rationale: यह अबशालोम की कल्पित स्थिति का परिणाम है और उसके पास न्याय पाने के लिए पहुँच को व्यक्त करता है।
- source_word: וְהִצְדַּקְתִּיו
  choice: मैं उसे न्याय दिलाता
  rationale: צדק के हिफ़ील रूप का न्यायिक अर्थ किसी को सही ठहराना या उसके पक्ष में न्याय करना हो सकता है। ‘न्याय दिलाता’ सामान्य पाठक के लिए स्पष्ट है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
