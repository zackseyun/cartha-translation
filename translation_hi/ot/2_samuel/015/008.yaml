base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/008.yaml
  text: For your servant made a vow while I was dwelling in Geshur in Aram[a], saying, ‘If Yahweh indeed brings me back to Jerusalem[c][b], then I will serve Yahweh.’
translation:
  language: hi
  text: क्योंकि आपके सेवक ने अराम के गशूर में रहते समय यह मन्नत मानी थी[a], ‘यदि याहवे निश्चय ही मुझे यरूशलेम लौटा लाए[b], तो मैं याहवे की सेवा करूँगा[c]।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘मन्नत’ और ‘मानी’ एक ही मूल-धातु से हैं; यह पुनरुक्ति मन्नत पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘लौटा लाना’ क्रिया का बलसूचक प्रयोग है; इसलिए “निश्चय ही”।
    reason: lexical_alternative
  - marker: c
    text: या, “मैं याहवे की आराधना करूँगा।” यहाँ “सेवा करना” परमेश्वर को दी जाने वाली आराधनात्मक सेवा भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר נָדַר
  choice: मन्नत मानी
  rationale: इब्रानी में एक ही धातु से बनी संज्ञा और क्रिया का प्रयोग बल देने के लिए हुआ है। आधुनिक हिन्दी में ‘मन्नत मानी’ स्वाभाविक है और धार्मिक प्रतिज्ञा का अर्थ स्पष्ट रखता है।
- source_word: עַבְדְּךָ
  choice: आपके सेवक
  rationale: राजा को संबोधित करते हुए यह विनम्र आत्म-संदर्भ है; ‘आपके सेवक’ दरबारी आदर और मूल रूपक दोनों बनाए रखता है।
- source_word: בְּשִׁבְתִּי
  choice: रहते समय
  rationale: पूर्वसर्ग सहित infinitive construct उस अवधि को बताता है जिसमें मन्नत मानी गई थी; ‘रहते समय’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בִגְשׁוּר בַּאֲרָם
  choice: अराम के गशूर में
  rationale: यह गशूर को अराम से संबद्ध या उसके क्षेत्र में स्थित बताता है। हिन्दी में यह रूप सहज है और संबंध को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: אִם ישיב יְשִׁיבֵנִי
  choice: यदि यहोवा निश्चय ही मुझे ... लौटा लाए
  rationale: मसोराई पाठ में infinitive absolute और finite verb की पुनरुक्ति वापसी की क्रिया पर बल देती है; ‘निश्चय ही’ उस बल को व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וְעָבַדְתִּי אֶת יְהוָה
  choice: तो मैं यहोवा की सेवा करूँगा
  rationale: עבד का मूल अर्थ सेवा करना है और परमेश्वर के संदर्भ में इसमें आराधनात्मक सेवा भी सम्मिलित हो सकती है; ‘सेवा करूँगा’ इस व्यापकता को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। आधुनिक हिन्दी बाइबलीय प्रयोग में पहचान योग्य ‘यहोवा’ चुना गया, जबकि ‘याहवे’ अधिक समीपी विद्वत् लिप्यंतरण है।
- issue: עבד का परमेश्वर के संदर्भ में अर्थ
  choice: सेवा करूँगा
  alternative: आराधना करूँगा
  rationale: ‘सेवा’ मूल शब्द की व्यापक अर्थ-सीमा को बचाती है; संदर्भ में यह आराधनात्मक सेवा को समेट सकती है, पर केवल अनुष्ठानिक आराधना तक अर्थ सीमित नहीं करती।
translation_notes:
  register: भाषा आधुनिक, सहज और सम्मानपूर्ण रखी गई है। अबशालोम के राजा से विनम्र आत्म-संदर्भ को ‘आपके सेवक’ से व्यक्त किया गया है। प्रतिज्ञा के धार्मिक स्वर के लिए ‘मन्नत’ और शर्त के बल के लिए ‘निश्चय ही’ प्रयुक्त हैं।
