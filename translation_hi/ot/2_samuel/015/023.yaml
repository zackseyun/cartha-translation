  yaml_path: translation/ot/2_samuel/015/023.yaml
  text: And all the land was weeping with a loud voice[a], and all the people were crossing over. The king also crossed over the Kidron Valley[b], and all the people were crossing over on the road toward the wilderness.
translation:
  language: hi
  text: सारा देश ऊँचे स्वर से रो रहा था, और सब लोग पार जा रहे थे। राजा भी किद्रोन घाटी[b] को पार कर गया, और सब लोग निर्जन प्रदेश की ओर जाने वाले मार्ग पर पार जा रहे थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “सब लोग निर्जन प्रदेश के मार्ग से पार जा रहे थे।”
    reason: lexical_alternative
  - marker: b
    text: '“किद्रोन घाटी”: परंपरागत अनुवाद “किद्रोन नाला” है। इब्रानी शब्द נחל किसी वादी, खड्ड, घाटी या मौसमी जलधारा को सूचित कर सकता है।'
    reason: cultural_note
lexical_decisions:
- source_word: כָל הָאָרֶץ
  choice: सारा देश
  rationale: यहाँ אֶרֶץ पूरे संसार के बजाय उस क्षेत्र और उसके निवासियों को सामूहिक रूप से सूचित करता है। ‘सारा देश’ इब्रानी रूपक को बनाए रखता है।
- source_word: בּוֹכִים קוֹל גָּדוֹל
  choice: ऊँचे स्वर से रो रहा था
  rationale: सामूहिक कर्ता के साथ बहुवचन कृदंत स्वाभाविक है; हिन्दी में ‘सारा देश ... रो रहा था’ सामूहिक शोक को सहज ढंग से व्यक्त करता है। קוֹל גָּדוֹל का आशय सुनाई देनेवाला ऊँचा विलाप है।
- source_word: כָל הָעָם
  choice: सब लोग
  rationale: עָם यहाँ दाऊद के साथ चलनेवाले पूरे समुदाय को दर्शाता है, केवल सैनिकों को नहीं।
- source_word: עֹבְרִים / עֹבֵר
  choice: पार जा रहे थे / पार कर गया
  rationale: עבר यहाँ घाटी या सीमा को पार करने की गति दर्शाता है। लोगों की जारी गतिविधि के लिए अपूर्ण प्रगतिशील रूप और राजा की विशिष्ट क्रिया के लिए पूर्ण भूतकाल स्वाभाविक है।
- source_word: בְּנַחַל קִדְרוֹן
  choice: किद्रोन घाटी
  rationale: נחל का अर्थ वादी, खड्ड, घाटी या मौसमी जलधारा हो सकता है। आधुनिक पाठक के लिए ‘किद्रोन घाटी’ स्पष्ट भौगोलिक अभिव्यक्ति है।
- source_word: עַל פְּנֵי דֶרֶךְ אֶת הַמִּדְבָּר
  choice: जंगल की ओर जानेवाले मार्ग पर आगे बढ़ रहे थे
  rationale: मूल वाक्यांश संक्षिप्त और कुछ अस्पष्ट है; यह जंगल की दिशा में जानेवाले मार्ग पर गति को सूचित करता है। यह अनुवाद दिशा और जारी यात्रा दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
