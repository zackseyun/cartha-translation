  yaml_path: translation/ot/2_samuel/015/005.yaml
  text: And whenever a man came near to bow down to him[a], he would reach out his hand, take hold of him, and kiss him.
translation:
  language: hi
  text: जब भी कोई पुरुष उसके सामने झुकने के लिए पास आता[a], तब वह अपना हाथ बढ़ाकर उसे थाम लेता और चूमता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे सम्मान देने के लिए।” इब्रानी क्रिया सम्मानपूर्वक झुकने या दण्डवत करने का भाव दे सकती है; यहाँ इसका अर्थ अनिवार्य रूप से धार्मिक आराधना नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: जब भी ... तब ... था
  rationale: कथात्मक संदर्भ में यह बार-बार होने वाले व्यवहार को व्यक्त करता है; हिन्दी में ‘जब भी ... तब ... था’ स्वाभाविक रूप से आदतन क्रिया दर्शाता है।
- source_word: בִּקְרָב
  choice: पास आता
  rationale: यह अबशालोम की ओर निकट आने की गति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: इब्रानी संज्ञा एकवचन पुल्लिंग है; ‘कोई पुरुष’ उसके व्याकरणिक और प्रसंगगत अर्थ को बनाए रखता है।
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  choice: उसके सामने झुकने के लिए
  rationale: यह सम्मान प्रकट करने वाली शारीरिक मुद्रा को सुरक्षित रखता है और इसे संकीर्ण धार्मिक अर्थ में ‘आराधना’ नहीं बनाता।
- source_word: וְשָׁלַח אֶת יָדוֹ
  choice: अपना हाथ बढ़ाकर
  rationale: हाथ आगे करने की इब्रानी अभिव्यक्ति का स्वाभाविक हिन्दी रूप है।
- source_word: וְהֶחֱזִיק לוֹ
  choice: उसे थाम लेता
  rationale: यह पकड़ने के सामाजिक और स्नेहपूर्ण भाव को व्यक्त करता है तथा ‘जकड़ना’ जैसे अनावश्यक कठोर अर्थ से बचता है।
- source_word: וְנָשַׁק לוֹ
  choice: चूमता था
  rationale: मूल क्रिया का सीधा अर्थ ‘चूमना’ है; राजनीतिक-सामाजिक अभिवादन का निहितार्थ बिना अतिरिक्त व्याख्या के बना रहता है।
theological_decisions:
- issue: השתחוה का धार्मिक अथवा सामाजिक अर्थ
  choice: उसके सामने झुकना
  alternative: उसे दण्डवत करना / उसकी आराधना करना
  rationale: इस प्रसंग में क्रिया सम्मान या निष्ठा प्रकट करने के लिए झुकने का संकेत देती है; ‘आराधना’ अनावश्यक रूप से धार्मिक अर्थ को सीमित कर देगी, जबकि ‘दण्डवत’ पूर्ण भूमि-प्रणाम को अधिक निश्चित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। आदतन क्रिया को ‘जब भी ... तब ... था’ से और सम्मानसूचक शारीरिक मुद्रा को ‘सामने झुकने’ से व्यक्त किया गया है।
