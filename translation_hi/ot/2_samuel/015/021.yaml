source:
  edition: WLC
  text: וַ/יַּ֧עַן אִתַּ֛י אֶת הַ/מֶּ֖לֶךְ וַ/יֹּאמַ֑ר חַי יְהוָ֗ה וְ/חֵי֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כִּ֠י אִם בִּ/מְק֞וֹם אֲשֶׁ֥ר יִֽהְיֶה שָּׁ֣ם אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ אִם לְ/מָ֨וֶת֙ אִם לְ/חַיִּ֔ים כִּי שָׁ֖ם יִהְיֶ֥ה עַבְדֶּֽ/ךָ־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/021.yaml
  text: Then Ittai answered the king and said[a], “As Yahweh lives, and as my lord the king lives, surely in whatever place my lord the king may be, whether for death or for life[b], there your servant will be.”
translation:
  language: hi
  text: तब इत्तै ने राजा को उत्तर दिया और कहा, “याहवे के जीवन की और मेरे प्रभु राजा के जीवन की शपथ[a], मेरे प्रभु राजा जहाँ कहीं भी होंगे, चाहे मृत्यु के लिए हो या जीवन के लिए[b], आपका सेवक भी वहीं होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह एक प्राचीन हिब्रू शपथ-सूत्र है: “याहवे के जीवन की और मेरे प्रभु राजा के जीवन की शपथ।”'
    reason: cultural_note
  - marker: b
    text: 'शाब्दिक: “मृत्यु के लिए या जीवन के लिए।” यह राजा के साथ हर परिस्थिति में रहने की दृढ़ प्रतिज्ञा व्यक्त करता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן אִתַּי אֶת הַמֶּלֶךְ וַיֹּאמַר
  choice: तब इत्तै ने राजा को उत्तर दिया
  rationale: हिब्रू कथात्मक संवाद-सूत्र को स्वाभाविक हिन्दी में व्यक्त करता है; וַיֹּאמַר को अलग से ‘कहा’ जोड़ना हिन्दी में अनावश्यक पुनरुक्ति होता।
- source_word: חַי יְהוָה וְחֵי אֲדֹנִי הַמֶּלֶךְ
  choice: जीवित याहवे की और मेरे प्रभु राजा के जीवन की शपथ
  rationale: यह गंभीर हिब्रू शपथ-सूत्र है। हिन्दी में ‘शपथ’ स्पष्ट करने से कथन का शपथात्मक बल बना रहता है, जबकि याहवे का व्यक्तिगत नाम सुरक्षित रहता है।
- source_word: כִּי אִם
  choice: '[शपथ के बाद दृढ़ प्रतिज्ञा के रूप में व्यक्त]'
  rationale: इस शपथ-संदर्भ में यह शर्त नहीं, बल्कि कथन को दृढ़ करने वाला प्रयोग है। हिन्दी शपथ-सूत्र और आगे की निश्चित प्रतिज्ञा उसका बल स्वाभाविक रूप से व्यक्त करते हैं; अलग ‘निश्चय ही’ जोड़ना आवश्यक नहीं।
- source_word: בִּמְקוֹם אֲשֶׁר יִהְיֶה שָּׁם
  choice: जहाँ कहीं रहेंगे
  rationale: खुले स्थान-संबंधी अर्थ को सहज आधुनिक हिन्दी में रखता है और इत्तै की असीम निष्ठा व्यक्त करता है।
- source_word: אִם לְמָוֶת אִם לְחַיִּים
  choice: चाहे मृत्यु के लिए, चाहे जीवन के लिए
  rationale: हिब्रू की समानांतर और कुछ असामान्य संरचना को जानबूझकर निकटता से रखा गया है, ताकि परिणाम या परिस्थिति संबंधी निहित अस्पष्टता मिटे नहीं।
- source_word: עַבְדֶּךָ
  choice: आपका सेवक
  rationale: राजा के सामने विनम्र आत्म-संबोधन है; यहाँ ‘दास’ कहने से बंधुआ स्थिति पर अनावश्यक बल पड़ सकता है।
- source_word: אִתַּי
  choice: इत्तै
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा-संबंधी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदले बिना और ‘यहोवा’ वाले अपेक्षाकृत बाद के स्वरूप को अपनाए बिना प्रस्तुत करता है।
- issue: राजा के जीवन के साथ शपथ-सूत्र
  choice: मेरे प्रभु राजा के जीवन की शपथ
  alternative: जैसे मेरे प्रभु राजा जीवित हैं
  rationale: यह राजा को ईश्वर के बराबर ठहराने वाला धर्मवैज्ञानिक कथन नहीं, बल्कि प्राचीन शपथ-सूत्र का दूसरा समानांतर खंड है; अनुवाद उसके सांस्कृतिक रूप को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। राजकीय आदर के लिए ‘मेरे प्रभु राजा’ और ‘आपका सेवक’ रखा गया है। शपथ और मृत्यु–जीवन की समानांतर हिब्रू संरचना को अत्यधिक समतल नहीं किया गया।
