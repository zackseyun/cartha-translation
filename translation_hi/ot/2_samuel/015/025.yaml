  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ לְ/צָד֔וֹק הָשֵׁ֛ב אֶת אֲר֥וֹן הָ/אֱלֹהִ֖ים הָ/עִ֑יר אִם אֶמְצָ֥א חֵן֙ בְּ/עֵינֵ֣י יְהוָ֔ה וֶ/הֱשִׁבַ֕/נִי וְ/הִרְאַ֥/נִי אֹת֖/וֹ וְ/אֶת נָוֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/025.yaml
  text: Then the king said to Zadok[a], “Return the ark of God to the city. If I find favor in the eyes of Yahweh, he will bring me back and let me see it and its dwelling place.”
translation:
  language: hi
  text: तब राजा ने सादोक से कहा, “परमेश्वर के सन्दूक को नगर में वापस ले जाओ। यदि मैं यहोवा की दृष्टि में अनुग्रह पाऊँ, तो वह मुझे वापस ले आएगा और मुझे इसे और इसके निवास-स्थान को देखने देगा।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मुझे उसे और उसके निवास-स्थान को देखने देगा।” इब्रानी सर्वनामों को परमेश्वर और उसके निवास-स्थान की ओर संकेत करने वाला भी समझा जा सकता है, यद्यपि निकटतम पूर्वपद “परमेश्वर का सन्दूक” है।
    reason: alternative_reading
lexical_decisions:
- source_word: הָשֵׁב
  choice: वापस ले जाओ
  rationale: שׁוב के हिफ़ील आज्ञार्थक रूप में सादोक को सन्दूक नगर में लौटाने की आज्ञा दी गई है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: परमेश्वर का सन्दूक
  rationale: मूल पाठ में स्पष्टतः אֱלֹהִים है; इसलिए इसे यहोवा का सन्दूक कहकर परिचित पदबंध से समरूप नहीं किया गया।
- source_word: הָעִיר
  choice: नगर में
  rationale: सन्दर्भ में निश्चित संज्ञा गंतव्य का बोध कराती है; 'नगर में वापस ले जाओ' हिन्दी में स्वाभाविक रूप से दिशात्मक अर्थ व्यक्त करता है।
- source_word: אִם אֶמְצָא חֵן בְּעֵינֵי יְהוָה
  choice: यदि मैं यहोवा की दृष्टि में अनुग्रह पाऊँ
  rationale: यह चयन इब्रानी मुहावरे की छवि और उसके सम्बन्धपरक भाव को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: दिव्य नाम को हिन्दी में प्रचलित लिप्यंतरण 'यहोवा' से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וֶהֱשִׁבַנִי
  choice: वह मुझे वापस ले आएगा
  rationale: שׁוב का हिफ़ील रूप कारणवाचक वापसी बताता है; कथा-सन्दर्भ में दाऊद का आशय यरूशलेम वापस लाए जाने से है।
- source_word: וְהִרְאַנִי
  choice: मुझे ... देखने देगा
  rationale: ראה के हिफ़ील का शाब्दिक अर्थ 'मुझे दिखाएगा/देखने देगा' है; यहाँ यह वाक्य-विन्यास हिन्दी में स्वाभाविक रहते हुए ईश्वरीय अनुमति और प्रबन्ध का भाव रखता है।
- source_word: אֹתוֹ
  choice: इसे
  rationale: निकटतम पूर्वपद सन्दूक है, जो इब्रानी में पुल्लिंग होते हुए हिन्दी में निर्जीव वस्तु के रूप में 'इसे' से स्वाभाविक ढंग से निर्दिष्ट होता है।
- source_word: נָוֵהוּ
  choice: इसके निवास-स्थान
  rationale: נָוֶה निवास या बसेरे का स्थान बता सकता है। यहाँ 'निवास-स्थान' पर्याप्त रूप से व्यापक है और दाऊद के समय अस्तित्व में न आए मन्दिर को अनावश्यक रूप से निर्दिष्ट नहीं करता।
theological_decisions:
- issue: '''इसे और इसके निवास-स्थान'' के सर्वनामों का सन्दर्भ'
  choice: मुख्य पाठ में इन्हें सन्दूक और नगर में उसके निवास-स्थान से जोड़ा गया है।
  alternative: इन्हें परमेश्वर और उसके निवास-स्थान की ओर संकेत करने वाला समझा जा सकता है।
  rationale: निकटतम व्याकरणिक पूर्वपद 'परमेश्वर का सन्दूक' है, इसलिए सन्दूक प्राथमिक सन्दर्भ है। फिर भी सन्दूक परमेश्वर की उपस्थिति से जुड़ा है और इब्रानी पुल्लिंग सर्वनाम परमेश्वर-केंद्रित समझ की गुंजाइश छोड़ते हैं; इस अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रजिस्टर अपनाया गया है। 'सन्दूक' बाइबलीय सन्दर्भ में परिचित है; 'नगर', 'दृष्टि में अनुग्रह' और 'निवास-स्थान' मूल की औपचारिकता तथा अर्थगत तनाव को बनाए रखते हैं।
