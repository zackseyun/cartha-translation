base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/012.yaml
  text: And Absalom sent for Ahithophel the Gilonite[a], David’s counselor, from his city, from Giloh, while he was offering the sacrifices. And the conspiracy grew strong[c][b], and the people kept increasing with Absalom.
translation:
  language: hi
  text: और अबशालोम ने दाऊद के सलाहकार, गीलोवासी अहीतोपेल को उसके नगर गीलो से बुलवाया, जब वह बलियाँ चढ़ा रहा था।[a] षड्यंत्र बल पकड़ता गया,[b] और अबशालोम के साथ लोगों की संख्या लगातार बढ़ती गई।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अहीतोपेल को भेजा”; हिब्रू क्रिया का अधिक शाब्दिक अनुवाद ऐसा हो सकता है, पर प्रसंग में संभवतः अर्थ है कि अबशालोम ने उसे विद्रोह में सम्मिलित होने के लिए बुलाया।
    reason: lexical_alternative
  - marker: b
    text: या, “साज़िश बल पकड़ती गई।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “लोग अबशालोम के साथ जाते और बहुत होते गए”; यह लगातार बढ़ते समर्थन को व्यक्त करने वाला प्रयोग है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: बुलवा भेजा
  rationale: व्यक्ति को सीधे कर्म के रूप में लेने वाला यह क्रियापद प्रसंग में अहीतोपेल को विद्रोह में सम्मिलित होने के लिए बुलाने का भाव देता है; हिंदी में ‘बुलवा भेजा’ इस आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַגִּלֹנִי
  choice: गीलोवासी
  rationale: यह गीलो से बना स्थानवाचक संबोधन है; ‘गीलोवासी’ आधुनिक हिंदी में संक्षिप्त और स्पष्ट है।
- source_word: יוֹעֵץ דָּוִד
  choice: दाऊद के सलाहकार
  rationale: समास-संबंध अहीतोपेल की दाऊद के लिए परामर्शदाता की भूमिका बताता है; ‘सलाहकार’ वर्तमान हिंदी में सहज है।
- source_word: מֵעִירוֹ מִגִּלֹה
  choice: उसके नगर गीलो से
  rationale: हिब्रू के सामान्य संज्ञा ‘उसका नगर’ और स्थाननाम ‘गीलो’ दोनों को रखकर उनके समानाधिकरण संबंध को स्वाभाविक हिंदी में व्यक्त किया गया है।
- source_word: בְּזָבְחוֹ אֶת־הַזְּבָחִים
  choice: बलि चढ़ाते समय
  rationale: पूर्वसर्ग सहित infinitive construct समकालीन क्रिया दर्शाता है। हिंदी में मूल की धातु-संज्ञा पुनरुक्ति को बिना अस्वाभाविक बनाए बलि संबंधी अर्थ सुरक्षित रहता है।
- source_word: הַקֶּשֶׁר
  choice: षड्यंत्र
  rationale: अबशालोम के संगठित राजनीतिक विद्रोह के संदर्भ में यह शब्द गुप्त मिलीभगत और सत्ता-विरोधी योजना दोनों को व्यक्त करता है।
- source_word: אַמִּץ
  choice: बल पकड़ता गया
  rationale: וַיְהִי के साथ यह षड्यंत्र की विकसित होती शक्ति बताता है; ‘बल पकड़ता गया’ स्थिर अवस्था के बजाय क्रमिक प्रगति दर्शाता है।
- source_word: הוֹלֵךְ וָרָב
  choice: लगातार बढ़ती गई
  rationale: यह रचना निरंतर बढ़ोतरी का भाव देती है; हिंदी चयन उसी कालगत और क्रमिक बल को स्वाभाविक रूप में रखता है।
- source_word: הָעָם
  choice: लोगों की संख्या
  rationale: सामूहिक ‘लोग’ को बढ़ने वाली संख्या के रूप में व्यक्त करने से हिंदी में अर्थ स्पष्ट होता है, जबकि अबशालोम का बढ़ता जनसमर्थन सुरक्षित रहता है।
- source_word: אֶת אַבְשָׁלוֹם
  choice: अबशालोम के साथ
  rationale: यहाँ אֶת संगति अथवा पक्षधरता का अर्थ देता है; ‘के साथ’ हिब्रू की निकटता और राजनीतिक संबद्धता दोनों बनाए रखता है।
