  text: וַ/יְהִ֤י דָוִד֙ בָּ֣א עַד הָ/רֹ֔אשׁ אֲשֶֽׁר יִשְׁתַּחֲוֶ֥ה שָׁ֖ם לֵ/אלֹהִ֑ים וְ/הִנֵּ֤ה לִ/קְרָאת/וֹ֙ חוּשַׁ֣י הָ/אַרְכִּ֔י קָר֨וּעַ֙ כֻּתָּנְתּ֔/וֹ וַ/אֲדָמָ֖ה עַל רֹאשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/032.yaml
  text: When David came to the summit[a], where he worshiped God, behold[b], Hushai the Archite came to meet him with his tunic torn and dirt on his head.
translation:
  language: hi
  text: जब दाऊद उस चोटी पर पहुँचा, जहाँ वह परमेश्वर को दण्डवत् करता था,[a] तो देखो,[b] अर्की हूशै उससे मिलने आया; उसका अंगरखा फटा हुआ था और उसके सिर पर मिट्टी पड़ी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जहाँ उसने परमेश्वर को दण्डवत् किया।” हिब्रू क्रिया नियमित रूप से किए जाने वाले कार्य या अतीत में किए गए एक कार्य—दोनों को व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: “देखो” उस हिब्रू कथात्मक सूचक का भाव व्यक्त करता है जो हूशै के अचानक सामने आने पर विशेष ध्यान खींचता है।
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: चोटी
  rationale: शाब्दिक अर्थ ‘सिर’ है, पर इस स्थलाकृतिक प्रसंग में ऊँचे स्थान की चोटी अभिप्रेत है।
- source_word: אֲשֶׁר יִשְׁתַּחֲוֶה שָׁם לֵאלֹהִים
  choice: जहाँ वह परमेश्वर को दण्डवत् करता था
  rationale: יִשְׁתַּחֲוֶה का मूल भाव झुककर दण्डवत् करना है और परमेश्वर के संदर्भ में यह उपासना का कार्य है। हिंदी का अपूर्ण भूतकाल habitual और प्रसंगगत past—दोनों की कुछ गुंजाइश रखता है।
- source_word: וְהִנֵּה
  choice: तभी उसने देखा
  rationale: यह हिब्रू कथात्मक सूचक हूशै के अचानक सामने आने पर ध्यान खींचता है; यह प्रयोग आधुनिक हिंदी में स्वाभाविक रूप से वही जीवंतता देता है।
- source_word: לִקְרָאתוֹ
  choice: उससे मिलने आ रहा है
  rationale: यह पद दाऊद की ओर भेंट के लिए होने वाली गति बताता है; संदर्भ से गति का क्रियापद स्वाभाविक रूप से पूरा किया गया है।
- source_word: חוּשַׁי הָאַרְכִּי
  choice: एरेकी हूशै
  rationale: व्यक्तिनाम को ‘हूशै’ और जाति/स्थान-सूचक उपाधि को हिंदी बाइबलीय शैली के अनुरूप ‘एरेकी’ रूप में लिप्यंतरित किया गया है।
- source_word: קָרוּעַ כֻּתָּנְתּוֹ
  choice: उसका अंगरखा फटा हुआ था
  rationale: כֻּתֹּנֶת शरीर पर पहने जाने वाले अंगरखे जैसे वस्त्र को दर्शाता है; קָרוּעַ उसकी फटी हुई दशा बताता है।
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  choice: उसके सिर पर मिट्टी पड़ी थी
  rationale: אֲדָמָה का अर्थ मिट्टी/भूमि है; शोक-संकेत के इस प्रसंग में ‘सिर पर मिट्टी’ स्रोत के शब्द को ‘धूल’ से अधिक ठीक रूप में सुरक्षित रखता है।
theological_decisions:
- issue: יִשְׁתַּחֲוֶה के कालगत बल की अस्पष्टता
  choice: दण्डवत् करता था
  alternative: दण्डवत् किया
  rationale: हिब्रू अपूर्ण क्रिया यहाँ नियमित अतीत या प्रसंगगत अतीत का संकेत दे सकती है। हिंदी का ‘करता था’ संभावित प्रचलित क्रिया को व्यक्त करता है, जबकि पादटिप्पणी सरल अतीत की संभावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी अपनाई गई है। ‘दण्डवत्’ स्रोत के शारीरिक झुकने और उपासना—दोनों भावों को रखता है; वाक्य-विभाजन हूशै की दशा को साफ और पठनीय बनाता है।
