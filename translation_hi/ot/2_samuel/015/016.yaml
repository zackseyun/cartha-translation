  yaml_path: translation/ot/2_samuel/015/016.yaml
  text: So the king went out[a], and all his household after him on foot; and the king left ten women, concubines, to keep the house.
translation:
  language: hi
  text: तब राजा निकल गया, और उसका सारा घराना उसके पीछे पैदल चला[a]। राजा दस स्त्रियों को, जो उपपत्नियाँ थीं, घर की रखवाली करने के लिए छोड़ गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “और उसका सारा घराना उसके पैरों के पास।” यह इब्रानी मुहावरा बताता है कि वे उसके पीछे पैदल चले।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: निकल गया
  rationale: יצא यहाँ कथात्मक क्रम में प्रस्थान को व्यक्त करता है; ‘निकल गया’ ठोस गति और प्रसंग दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: मूल पाठ दाऊद का नाम न लेकर उसकी उपाधि का प्रयोग करता है, इसलिए अनुवाद में भी ‘राजा’ रखा गया है।
- source_word: וְכָל־בֵּיתוֹ
  choice: उसका सारा घराना
  rationale: यहाँ בַּיִת भौतिक मकान नहीं, राजा से संबंधित लोगों के समूह को दर्शाता है; ‘घराना’ इस अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּרַגְלָיו
  choice: उसके पीछे ... पैदल चला
  rationale: शाब्दिक रूप ‘उसके पैरों पर/पास’ है; इस इब्रानी मुहावरे में राजा के पीछे पैदल जाने का भाव है। मुख्य पाठ अर्थ को स्वाभाविक ढंग से देता है और पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: וַיַּעֲזֹב
  choice: छोड़ गया
  rationale: עזב यहाँ पीछे छोड़ देने के अर्थ में है; ‘त्याग दिया’ अनावश्यक रूप से अधिक भावात्मक या नैतिक अर्थ जोड़ सकता है।
- source_word: עֶשֶׂר נָשִׁים פִּלַגְשִׁים
  choice: दस स्त्रियों को, जो उसकी उपपत्नियाँ थीं
  rationale: मूल के ‘स्त्रियाँ’ और ‘उपपत्नियाँ’ दोनों पद सुरक्षित रखे गए हैं; संबंधवाचक उपवाक्य हिन्दी में उनके समानाधिकरण को स्पष्ट और स्वाभाविक बनाता है।
- source_word: לִשְׁמֹר
  choice: देखभाल करने के लिए
  rationale: שׁמר में रक्षा, निगरानी और संभाल का अर्थ-क्षेत्र है। निवास के संदर्भ में ‘देखभाल करना’ उद्देश्य को स्वाभाविक रूप से व्यक्त करता है, बिना केवल सैन्य पहरे का अर्थ थोपे।
- source_word: הַבָּיִת
  choice: भवन
  rationale: यहाँ בַּיִת पहले आए ‘घराने’ से भिन्न, भौतिक राजनिवास को सूचित करता है। ‘भवन’ इस भेद को स्पष्ट रखते हुए ‘महल’ जैसा अतिरिक्त विशिष्टीकरण नहीं जोड़ता।
