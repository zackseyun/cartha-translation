id: 2SA.15.34
reference: 2 Samuel 15:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִם הָ/עִ֣יר תָּשׁ֗וּב וְ/אָמַרְתָּ֤ לְ/אַבְשָׁלוֹם֙ עַבְדְּ/ךָ֨ אֲנִ֤י הַ/מֶּ֨לֶךְ֙ אֶֽהְיֶ֔ה עֶ֣בֶד אָבִ֤י/ךָ וַֽ/אֲנִי֙ מֵ/אָ֔ז וְ/עַתָּ֖ה וַ/אֲנִ֣י עַבְדֶּ֑/ךָ וְ/הֵפַרְתָּ֣ה לִ֔/י אֵ֖ת עֲצַ֥ת אֲחִיתֹֽפֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/034.yaml
  text: But if you return to the city and say to Absalom, ‘I will be your servant, O king; as I was your father’s servant in the past, so now I will be your servant,’ then you will frustrate Ahithophel’s counsel for me.
translation:
  language: hi
  text: पर यदि तुम नगर में लौटकर अबशालोम से कहो, ‘हे राजा, मैं आपका सेवक रहूँगा। जैसे मैं पहले आपके पिता का सेवक था, वैसे ही अब आपका सेवक रहूँगा,’ तो तुम मेरे लिए अहीतोपेल की सम्मति विफल कर सकोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעִיר
  choice: नगर
  rationale: यह निश्चित पद ‘उस नगर’ अर्थात प्रसंगानुसार यरूशलेम को सूचित करता है; हिंदी में ‘नगर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: עַבְדְּךָ / עֶבֶד / עַבְדֶּךָ
  choice: आपका सेवक / सेवक
  rationale: राजदरबारी निष्ठा और अधीन सेवा का भाव रखता है; ‘दास’ की अपेक्षा इस प्रसंग में ‘सेवक’ अधिक स्वाभाविक है।
- source_word: מֵאָז
  choice: पहले
  rationale: अतीत से चली आई पूर्व सेवा का संकेत संक्षेप और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וְהֵפַרְתָּ
  choice: विफल कर सकोगे
  rationale: हिफ़ील क्रिया यहाँ योजना को निष्फल या नाकाम करने के अर्थ में है; प्रसंगगत संभाव्यता को हिंदी में ‘सकोगे’ से स्पष्ट किया गया है।
- source_word: עֲצַת אֲחִיתֹפֶל
  choice: अहीतोपेल की सम्मति
  rationale: עֵצָה यहाँ राजनीतिक सलाह/युक्ति है; ‘सम्मति’ बाइबलीय गरिमा के साथ सलाह के अर्थ को रखती है।
theological_decisions:
- issue: हूशै द्वारा अबशालोम के सामने निष्ठा प्रकट करने की प्रस्तावित भाषा
  choice: कथन को प्रत्यक्ष रूप में रखा गया, बिना उसकी नैतिकता पर अतिरिक्त टिप्पणी किए
  alternative: इसे स्पष्टतः छल या झूठ कहकर व्याख्यायित करना
  rationale: मूल पद योजना बताता है, पर इसी पद में नैतिक निर्णय नहीं देता; अनुवाद को वह निर्णय आयात नहीं करना चाहिए।
- issue: ‘मैं आपके पिता का सेवक था’ और ‘अब आपका सेवक’ के बीच संबंध
  choice: ‘जैसे... वैसे ही...’
  alternative: 'दो स्वतंत्र कथन: ‘मैं पहले... था, और अब...’'
  rationale: मासोरेटिक पाठ की असमतल वाक्यरचना तुलना/संक्रमण की अनुमति देती है; प्रसंग और प्राचीन संस्करणों से समर्थित तुलना को स्वाभाविक हिंदी में रखा गया है, बिना आशय को सिद्धांतगत रूप से बढ़ाए।
translation_notes:
  register: आधुनिक मानक हिंदी, आदरसूचक ‘आप’ और राजदरबारी संबोधन ‘हे राजा’ के साथ। वाक्य को सामान्य पाठक के लिए प्रवाहपूर्ण रखा गया है, जबकि मूल की राजनीतिक और नैतिक तनावपूर्ण स्थिति पर कोई अतिरिक्त व्याख्या नहीं जोड़ी गई।
