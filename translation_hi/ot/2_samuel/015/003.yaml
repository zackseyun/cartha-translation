  text: Then Absalom said to him[a], “Look, your claims are good and right[b], but there is no one from the king to hear you.”
translation:
  language: hi
  text: तब अबशालोम उससे कहता था, “देखो, तुम्हारा मामला अच्छा और न्यायसंगत है; लेकिन राजा की ओर से कोई नहीं है जो तुम्हारा मामला सुने।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אַבְשָׁלוֹם
  choice: तब अबशालोम उससे कहता
  rationale: वाव-क्रम कथा को आगे बढ़ाता है। व्यापक प्रसंग में यह अबशालोम की बार-बार की जाने वाली कार्रवाई है, इसलिए हिन्दी का अपूर्ण पक्ष ‘कहता’ स्वाभाविक है; ‘उससे’ इब्रानी सर्वनाम को व्यक्त करता है।
- source_word: רְאֵה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला आज्ञार्थक प्रयोग है; ‘देखो’ आधुनिक और सहज हिन्दी है।
- source_word: דְבָרֶךָ
  choice: तुम्हारा मामला
  rationale: דָּבָר का अर्थ ‘वचन/बात/मामला’ हो सकता है; न्यायिक प्रसंग में ‘मामला’ उपयुक्त है और अनावश्यक रूप से बहुवचन दावों का संकेत नहीं देता।
- source_word: טוֹבִים וּנְכֹחִים
  choice: अच्छा और न्यायसंगत
  rationale: ‘अच्छा’ טוֹב का व्यापक मूल्यांकन बनाए रखता है, जबकि ‘न्यायसंगत’ נְכֹחִים की सही, सीधी अथवा उचित होने की न्यायिक छाया को स्वाभाविक हिन्दी में व्यक्त करता है। इब्रानी में विशेषण बहुवचन हैं, पर हिन्दी में ‘मामला’ के साथ व्याकरणानुसार एकवचन रखा गया है।
- source_word: וְשֹׁמֵעַ אֵין לְךָ מֵאֵת הַמֶּלֶךְ
  choice: लेकिन राजा की ओर से तुम्हारी सुनवाई करने वाला कोई नहीं है
  rationale: שֹׁמֵעַ का अर्थ यहाँ न्यायिक मामला सुनने वाला व्यक्ति है। מֵאֵת הַמֶּלֶךְ राजा की ओर से स्रोत अथवा अधिकार का संकेत देता है; अनुवाद किसी औपचारिक नियुक्ति को मूल से अधिक स्पष्ट नहीं करता।
