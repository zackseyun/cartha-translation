source:
  edition: WLC
  text: הִנֵּה שָׁ֤ם עִמָּ/ם֙ שְׁנֵ֣י בְנֵי/הֶ֔ם אֲחִימַ֣עַץ לְ/צָד֔וֹק וִ/יהוֹנָתָ֖ן לְ/אֶבְיָתָ֑ר וּ/שְׁלַחְתֶּ֤ם בְּ/יָדָ/ם֙ אֵלַ֔/י כָּל דָּבָ֖ר אֲשֶׁ֥ר תִּשְׁמָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/036.yaml
  text: 'Look[a], their two sons are there with them: Ahimaaz for Zadok, and Jonathan for Abiathar[b]. You shall send to me by their hand every matter that you hear.'
translation:
  language: hi
  text: देखो, उनके दोनों बेटे वहाँ उनके साथ हैं—सादोक का बेटा अहीमास और एब्यातार का बेटा योनातान। तुम जो भी बात[b] सुनो, उसे उनके हाथ[a] मेरे पास भेज देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ‘उनके द्वारा’ या ‘उनके माध्यम से।’ इब्रानी में शाब्दिक रूप से ‘उनके हाथ’ है, जो माध्यम या संदेशवाहक के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जो कुछ तुम सुनो’ अथवा ‘हर समाचार जो तुम सुनो।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह शब्द सुनने वालों का ध्यान आगे कही जाने वाली बात की ओर खींचता है; ‘देखो’ आधुनिक हिन्दी में इसके बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׁם עִמָּם
  choice: वहाँ उनके साथ हैं
  rationale: स्थानवाचक क्रियाविशेषण और संबंधसूचक पदबंध दोनों को बनाए रखता है और स्पष्ट करता है कि बेटे याजकों के साथ उसी स्थान पर हैं।
- source_word: שְׁנֵי בְנֵיהֶם
  choice: उनके दोनों बेटे
  rationale: यह सीधा संबंधवाचक अनुवाद है और सादोक तथा एब्यातार के एक-एक बेटे की ओर संकेत करता है।
- source_word: אֲחִימַעַץ לְצָדוֹק וִיהוֹנָתָן לְאֶבְיָתָר
  choice: सादोक का बेटा अहीमास और एब्यातार का बेटा योनातान
  rationale: यहाँ לְ संबंध अथवा संबद्धता बताता है; पिछले वाक्यांश में ‘बेटे’ आ चुका है, इसलिए हिन्दी में पुत्र-संबंध स्पष्ट करना स्वाभाविक और संदर्भानुकूल है।
- source_word: וּשְׁלַחְתֶּם
  choice: तुम ... भेज देना
  rationale: इस निर्देशात्मक संदर्भ में रूप आज्ञा अथवा अपेक्षित आगामी कार्य व्यक्त करता है; ‘भेज देना’ हिन्दी में दृढ़ किंतु स्वाभाविक निर्देश है।
- source_word: בְּיָדָם
  choice: उनके हाथ
  rationale: इब्रानी का शाब्दिक मुहावरा सुरक्षित रखा गया है; हिन्दी में भी ‘किसी के हाथ भेजना’ संदेश पहुँचाने की मध्यस्थता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל דָּבָר
  choice: जो भी बात
  rationale: דָּבָר का अर्थ ‘बात’, ‘विषय’ या ‘समाचार’ हो सकता है; ‘जो भी बात’ इसकी व्यापकता बनाए रखता है और सूचना-संग्रह के संदर्भ में सहज है।
- source_word: אֲשֶׁר תִּשְׁמָעוּ
  choice: सुनो
  rationale: यह שׁמע का सीधा अर्थ है और प्राप्त होने वाली सूचना के संदर्भ में उपयुक्त है।
