base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/018.yaml
  text: And all his servants were passing by at his side[a], and all the Cherethites, and all the Pelethites, and all the Gittites—six hundred men who had come on foot with him from Gath—were passing on before the king.
translation:
  language: hi
  text: उसके सभी सेवक उसकी बगल से होकर आगे बढ़ रहे थे; सभी करेती, सभी पलेती, और सभी गती भी—वे छह सौ पुरुष, जो गत से उसके साथ पैदल आए थे[a]—राजा के सामने से होकर आगे बढ़ रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो गत से उसके पीछे-पीछे आए थे।” इब्रानी में शाब्दिक रूप से “जो उसके पाँव के साथ गत से आए थे” है; यह किसी के साथ उसके दल में चलने या पैदल साथ आने का मुहावरा हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: उसके सभी सेवक
  rationale: עֶבֶד का अर्थ सेवक, अनुचर या राजकीय अधिकारी हो सकता है। यहाँ मूल अर्थ को बिना पद का अनावश्यक निर्धारण किए रखने के लिए ‘सेवक’ चुना गया है।
- source_word: עֹבְרִים עַל יָדוֹ
  choice: उसके पास से होकर आगे बढ़ रहे थे
  rationale: עַל־יָד का स्थानसूचक अर्थ ‘पास/बगल में’ है। जुलूस के प्रसंग में यह हिन्दी अभिव्यक्ति स्थान और गतिशीलता दोनों को स्वाभाविक रूप से व्यक्त करती है।
- source_word: הַכְּרֵתִי
  choice: करेती
  rationale: यह दाऊद की सेवा में एक विशिष्ट समुदाय अथवा दल का नाम है, इसलिए इसका अर्थ लगाने के बजाय लिप्यंतरण किया गया है।
- source_word: הַפְּלֵתִי
  choice: पलेती
  rationale: यह भी विशिष्ट समुदाय अथवा दल का नाम है; इसे लिप्यंतरित किया गया है।
- source_word: הַגִּתִּים
  choice: गती
  rationale: यह गत से संबंधित लोगों का जातिवाचक नाम है। संक्षिप्त जातिनाम बनाए रखने के लिए ‘गती’ चुना गया है।
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: छः सौ पुरुष
  rationale: אִישׁ गणना में वयस्क पुरुषों को सूचित करता है। प्रसंग सैन्य हो सकता है, पर मूल पद में ‘सैनिक’ स्पष्ट नहीं है, इसलिए ‘पुरुष’ रखा गया है।
- source_word: אֲשֶׁר בָּאוּ בְרַגְלוֹ מִגַּת
  choice: जो गत से उसके साथ पैदल आए थे
  rationale: בְרַגְלוֹ में ‘पाँव’ का ठोस बिंब है और यह किसी के साथ पैदल आने अथवा उसके दल में साथ चलने का मुहावरा हो सकता है। मुख्य पाठ में ठोस अर्थ रखा गया और विकल्प पादटिप्पणी में दिया गया है।
- source_word: עֹבְרִים עַל פְּנֵי הַמֶּלֶךְ
  choice: राजा के सामने से होकर आगे बढ़ रहे थे
  rationale: עַל־פְּנֵי का अर्थ ‘सामने/सम्मुख’ है। जुलूस की निरंतर गति व्यक्त करने के लिए ‘सामने से होकर आगे बढ़ रहे थे’ स्वाभाविक है।
