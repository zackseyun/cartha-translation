  yaml_path: translation/ot/2_samuel/015/037.yaml
  text: So Hushai[a], David’s friend, came into the city, as Absalom was entering Jerusalem.
translation:
  language: hi
  text: इस प्रकार दाऊद का मित्र हूशै नगर में पहुँचा, उसी समय अबशालोम यरूशलेम में प्रवेश कर रहा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और अबशालोम यरूशलेम में आया।” हिब्रू संयोजक का अनुवाद साधारण “और” भी किया जा सकता है, और क्रिया को सामान्य भूतकाल में भी समझा जा सकता है।
    reason: वैकल्पिक व्याकरणिक पठन और कालगत संबंध की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיָּבֹא
  choice: पहुँचा
  rationale: בוא का अर्थ ‘आना/पहुँचना/प्रवेश करना’ हो सकता है। नगर के संदर्भ में ‘पहुँचा’ स्वाभाविक हिन्दी है और गति के लक्ष्य को स्पष्ट रखता है।
- source_word: חוּשַׁי
  choice: हूशै
  rationale: व्यक्तिनाम का मूल हिब्रू उच्चारणानुसार देवनागरी लिप्यंतरण।
- source_word: רֵעֶה דָוִד
  choice: दाऊद का मित्र
  rationale: רֵעֶה यहाँ मित्र या साथी को सूचित करता है; ‘मित्र’ सीधा अर्थ देता है और सलाहकार जैसा अधिक विशिष्ट पद नहीं जोड़ता।
- source_word: הָעִיר
  choice: नगर
  rationale: मूल पाठ में यरूशलेम का नाम दोहराने के बजाय निश्चित सामान्य संज्ञा ‘नगर’ है, इसलिए वही भेद सुरक्षित रखा गया है।
- source_word: וְאַבְשָׁלֹם
  choice: उसी समय अबशालोम
  rationale: וְ को संदर्भ में समकालिक क्रियाओं को जोड़ने वाला माना गया है; ‘उसी समय’ हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है। साधारण क्रमसूचक ‘और’ भी संभव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: יָבֹא
  choice: प्रवेश कर रहा था
  rationale: पूर्ववर्ती wayyiqtol के बाद आया yiqtol रूप पृष्ठभूमिगत या समकालिक चलती क्रिया के रूप में समझा जा सकता है; अपूर्ण भूतकाल हिन्दी में इस पक्षगत अंतर को व्यक्त करता है।
- source_word: יְרוּשָׁלִָם
  choice: यरूशलेम
  rationale: स्थाननाम का हिन्दी में प्रचलित बाइबलीय रूप।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘नगर’ द्वारा मूल की सामान्य संज्ञा सुरक्षित रखी गई है, जबकि ‘उसी समय…प्रवेश कर रहा था’ समकालिक पठन व्यक्त करता है; वैकल्पिक क्रमिक पठन पादटिप्पणी में दिया गया है।
