base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/011.yaml
  text: Two hundred men from Jerusalem went with Absalom[a], invited, and they went innocently, not knowing anything.
translation:
  language: hi
  text: यरूशलेम से दो सौ पुरुष अबशालोम के साथ गए। वे बुलाए गए थे और निष्कपट भाव से[a] जा रहे थे; उन्हें कुछ भी मालूम नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी निर्दोषता में” अथवा “खरे मन से”; इब्रानी अभिव्यक्ति से संकेत मिलता है कि वे अबशालोम की योजना से अनजान और निश्चिंत होकर गए थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלְכוּ אֶת־אַבְשָׁלוֹם
  choice: अबशालोम के साथ गए
  rationale: הלך का मूल अर्थ ‘जाना’ है और אֶת־אַבְשָׁלוֹם यहाँ साथ होने का भाव देता है; इसलिए यह सहज और स्रोत-संगत अनुवाद है।
- source_word: מָאתַיִם אִישׁ
  choice: दो सौ पुरुष
  rationale: संख्या के बाद אִישׁ पुरुषों की गणना करता है; ‘पुरुष’ आधुनिक मानक हिन्दी में स्पष्ट और उपयुक्त है।
- source_word: מִירוּשָׁלַםִ
  choice: यरूशलेम से
  rationale: מִן उद्गम या प्रस्थान-स्थान सूचित करता है।
- source_word: קְרֻאִים
  choice: बुलाए गए थे
  rationale: קרא का कर्मवाच्य कृदन्त यहाँ निमंत्रित किए जाने का भाव रखता है। ‘बुलाए गए थे’ स्रोत के ‘बुलाए हुए’ अर्थ को बिना ‘अतिथि’ जोड़ने के स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהֹלְכִים
  choice: और ... जा रहे थे
  rationale: कृदन्त चालू परिस्थिति का वर्णन करता है; हिन्दी का अपूर्ण भूतकाल इस वर्णनात्मक भाव को सहजता से व्यक्त करता है।
- source_word: לְתֻמָּם
  choice: निष्कपट भाव से
  rationale: תֹּם/תֻּם में निष्कपटता, निर्दोषता, सरलता या खराई का अर्थ हो सकता है। अगले वाक्यांश से यहाँ षड्यंत्र से अनजान, निष्कपट होकर जाने का भाव प्रमुख है, पर पादटिप्पणी मूल की अर्थ-व्याप्ति बचाती है।
- source_word: וְלֹא יָדְעוּ כָּל־דָּבָר
  choice: उन्हें कुछ भी मालूम नहीं था
  rationale: यह हिन्दी की स्वाभाविक अभिव्यक्ति है और मूल के ‘उन्होंने कोई बात नहीं जानी’ का पूरा निषेध बनाए रखती है।
