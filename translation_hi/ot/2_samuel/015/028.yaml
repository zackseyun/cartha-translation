  yaml_path: translation/ot/2_samuel/015/028.yaml
  text: See[b][a], I will wait at the fords of the wilderness until word comes from you to inform me.
translation:
  language: hi
  text: देखो, मैं मरुभूमि के पार उतरने के स्थानों पर ठहरा रहूँगा[b][a], जब तक तुम्हारी ओर से मुझे कोई समाचार न मिल जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मरुभूमि के घाटों पर।”
    reason: lexical_alternative
  - marker: b
    text: या “मैं ठहरा हुआ हूँ” अथवा “मैं प्रतीक्षा करूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: देखो
  rationale: बहुवचन आज्ञार्थक रूप यहाँ ध्यान आकर्षित करने वाला सीधा सम्बोधन है; ‘देखो’ आधुनिक हिन्दी में इसकी स्वाभाविक और स्पष्ट अभिव्यक्ति है।
- source_word: אָנֹכִי
  choice: मैं
  rationale: स्वतंत्र सर्वनाम कर्ता पर बल देता है; हिन्दी में व्यक्त ‘मैं’ इस बल को पर्याप्त रूप से व्यक्त करता है।
- source_word: מִתְמַהְמֵהַּ
  choice: ठहरा रहूँगा
  rationale: हित्पाएल कृदन्त का भाव देर करने, ठहरे रहने या प्रतीक्षा करने का है। प्रसंग में दाऊद समाचार मिलने तक वहीं रहने की बात करता है; ‘ठहरा रहूँगा’ क्रिया की स्थानगत और कालगत धारणा दोनों बचाता है।
- source_word: בְּעַבְרוֹת
  choice: घाटों पर
  rationale: बहुवचन संज्ञा पार उतरने के स्थानों, विशेषतः नदी के उथले घाटों, को सूचित कर सकती है। ‘घाटों पर’ हिन्दी में संक्षिप्त और प्रसंगानुकूल है; पाठगत रूप ‘मैदानी भागों’ के रूप में भी समझा गया है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
- source_word: הַמִּדְבָּר
  choice: मरुभूमि
  rationale: यह शब्द निर्जन, वनहीन या खुली उजाड़ भूमि को दर्शाता है, केवल रेतीले रेगिस्तान को नहीं। ‘मरुभूमि’ गरिमापूर्ण और सामान्य बाइबलीय हिन्दी में सुबोध है।
- source_word: עַד בּוֹא דָבָר
  choice: जब तक ... कोई सन्देश ... न आ जाए
  rationale: यहाँ דָבָר किसी बात मात्र के बजाय समाचार या सूचना का अर्थ देता है। हिन्दी की ‘जब तक ... न’ रचना सीमा-बोध को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: מֵעִמָּכֶם
  choice: तुम्हारी ओर से
  rationale: पूर्वसर्गीय पद सन्देश के स्रोत को बताता है; ‘तुम्हारी ओर से’ आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: לְהַגִּיד לִי
  choice: मुझे बताने के लिए
  rationale: हिफ़ील infinitive का अर्थ किसी बात को ज्ञात कराना या सूचना देना है। यह अनुवाद उद्देश्य-सूचक रचना को बनाए रखता है और सन्देशवाहक के प्रसंग में सहज है।
