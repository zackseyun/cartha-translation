- from: दाऊद जैतून पहाड़ की चढ़ाई पर चढ़ता जा रहा था और रोता जा रहा था। उसका सिर ढका हुआ था और वह नंगे पाँव चल रहा था। उसके साथ के सभी लोगों ने भी अपने-अपने सिर ढक रखे थे[a], और वे चढ़ते हुए रोते जा रहे थे[b]।
  to: दाऊद जैतून पर्वत की चढ़ाई पर चढ़ता हुआ रोता जा रहा था। उसका सिर ढका हुआ था, और वह नंगे पाँव चल रहा था। उसके साथ के सभी लोगों ने अपना-अपना सिर ढक लिया था[a], और वे चढ़ते जाते और रोते जाते थे[b]।
