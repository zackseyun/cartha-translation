  text: וְ/דָוִ֡ד עֹלֶה֩ בְ/מַעֲלֵ֨ה הַ/זֵּיתִ֜ים עֹלֶ֣ה וּ/בוֹכֶ֗ה וְ/רֹ֥אשׁ ל/וֹ֙ חָפ֔וּי וְ/ה֖וּא הֹלֵ֣ךְ יָחֵ֑ף וְ/כָל הָ/עָ֣ם אֲשֶׁר אִתּ֗/וֹ חָפוּ֙ אִ֣ישׁ רֹאשׁ֔/וֹ וְ/עָל֥וּ עָלֹ֖ה וּ/בָכֹֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/030.yaml
  text: And David was going up the ascent of the Mount of Olives[a], going up and weeping, with his head covered, and he was walking barefoot. And all the people who were with him each covered his head, and they went up[c][b], weeping as they went.
translation:
  language: hi
  text: दाऊद जैतून पर्वत की चढ़ाई पर चढ़ता हुआ रोता जा रहा था। उसका सिर ढका हुआ था, और वह नंगे पाँव चल रहा था। उसके साथ के सभी लोगों ने अपना-अपना सिर ढक लिया था[a], और वे चढ़ते जाते और रोते जाते थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में, “हर एक ने अपना सिर ढका”; इब्रानी में वितरणात्मक एकवचन है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में चढ़ने की क्रिया दोहराई गई है: “वे चढ़े, चढ़ते और रोते हुए”; यह निरंतरता और सजीव बल व्यक्त करती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלֵה הַזֵּיתִים
  choice: जैतून पहाड़ की चढ़ाई
  rationale: מַעֲלֵה ऊपर जाने वाली चढ़ाई या मार्ग को दर्शाता है; הַזֵּיתִים यहाँ प्रचलित स्थलनाम जैतून पहाड़ है।
- source_word: עֹלֶה ... עֹלֶה וּבוֹכֶה
  choice: चढ़ता जा रहा था और रोता जा रहा था
  rationale: दोहराए गए कृदंत जारी और सजीव क्रिया व्यक्त करते हैं; हिंदी में ‘जा रहा था’ की पुनरावृत्ति इस दुहराव और अवधि को स्वाभाविक ढंग से बनाए रखती है।
- source_word: וְרֹאשׁ לוֹ חָפוּי
  choice: उसका सिर ढका हुआ था
  rationale: यह दाऊद की शोकपूर्ण अवस्था बताता है और ढकने के ढंग के बारे में अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: יָחֵף
  choice: नंगे पाँव
  rationale: आधुनिक हिंदी में इसका सहज और सटीक समतुल्य है।
- source_word: כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: उसके साथ के सभी लोग
  rationale: הָעָם व्यापक समूह को सूचित करता है; ‘लोग’ मूल में निहित न होने वाला विशेष सैनिक अर्थ नहीं जोड़ता।
- source_word: חָפוּ אִישׁ רֹאשׁוֹ
  choice: अपने-अपने सिर ढक रखे थे
  rationale: אִישׁ का वितरणात्मक एकवचन प्रत्येक व्यक्ति पर क्रिया लागू करता है; ‘अपने-अपने’ हिंदी में इसे स्पष्ट और स्वाभाविक बनाता है।
- source_word: וְעָלוּ עָלֹה וּבָכֹה
  choice: वे चढ़ते हुए रोते जा रहे थे
  rationale: ससीम क्रिया और धात्वर्थक निरपेक्ष रूप क्रिया की निरंतरता और बल को सजीव बनाते हैं; हिंदी वाक्यांश अर्थ और लय को बिना अस्वाभाविक शब्दशः पुनरावृत्ति के व्यक्त करता है।
