    issue: Place-name phrasing
    rationale: “जैतून पहाड़ की चढ़ाई” is somewhat awkward in modern standard Hindi. “जैतून पर्वत की चढ़ाई” is more idiomatic and preserves the conventional topographical designation.
  - severity: low
    issue: Final intensified ascent is somewhat smoothed
    rationale: “वे चढ़ते हुए रोते जा रहे थे” conveys ongoing action but does not as clearly retain the ascent-and-weeping repetition of וְעָלוּ עָלֹה וּבָכֹה. A revised Hindi phrase can preserve this without wooden literalism.
  - severity: low
    issue: Completed head-covering action
    rationale: The Hebrew uses a perfect verb for each member of the group covering his head. “ढक लिया था” represents this more directly than the stative “ढक रखे थे.”
