source:
  edition: WLC
  text: תְּמ֣וֹל בּוֹאֶ֗/ךָ וְ/הַ/יּ֞וֹם אנוע/ך עִמָּ֨/נוּ֙ לָ/לֶ֔כֶת וַ/אֲנִ֣י הוֹלֵ֔ךְ עַ֥ל אֲשֶׁר אֲנִ֖י הוֹלֵ֑ךְ שׁ֣וּב וְ/הָשֵׁ֧ב אֶת אַחֶ֛י/ךָ עִמָּ֖/ךְ חֶ֥סֶד וֶ/אֱמֶֽת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/020.yaml
  text: You came only yesterday[a], and today should I make you wander with us, while I go wherever I can go? Return, and take your brothers back with you[c][b]. May steadfast love and faithfulness be with you.
translation:
  language: hi
  text: तुम्हें आए तो कल ही हुआ है; क्या आज मैं तुम्हें हमारे साथ भटकने के लिए मजबूर करूँ, जबकि मैं स्वयं जहाँ भी जा सकूँ, जा रहा हूँ?[a] लौट जाओ और अपने भाइयों[b] को भी अपने साथ वापस ले जाओ। अटल प्रेम और विश्वासयोग्यता[c] तुम्हारे साथ रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “जबकि मैं जहाँ जा रहा हूँ, जा रहा हूँ।” इब्रानी अभिव्यक्ति दीर्घवृत्तीय है और दाऊद के पलायन की अनिश्चितता प्रकट करती है।
    reason: lexical_alternative
  - marker: b
    text: “भाइयों” से संभवतः इत्तै के साथ आए उसके संबंधी या साथी अभिप्रेत हैं।
    reason: cultural_note
  - marker: c
    text: इब्रानी में यहाँ कोई क्रिया नहीं है; इसे प्रसंगानुसार आशीर्वचन माना गया है। “अटल प्रेम और विश्वासयोग्यता” निष्ठावान प्रेम और भरोसेमंदता का प्रचलित इब्रानी युग्म है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: תְּמוֹל בּוֹאֶךָ
  choice: तुम्हें आए अभी कल ही हुआ है
  rationale: शाब्दिक रूप से ‘कल तुम्हारा आना’; यह स्वाभाविक हिन्दी में इत्तै के बहुत हाल में आने पर दाऊद के बल को व्यक्त करता है।
- source_word: אֲנוּעֲךָ
  choice: मैं तुम्हें ... भटकाता फिरूँ
  rationale: נוע का कारक रूप अस्थिरता में इधर-उधर फिराने का भाव रखता है; ‘भटकाता फिरूँ’ कारकता और अनिश्चित निर्वासन दोनों को व्यक्त करता है।
- source_word: עִמָּנוּ לָלֶכֶת
  choice: हमारे साथ
  rationale: ‘जाने के लिए हमारे साथ’ का आशय हिन्दी क्रिया ‘भटकाता फिरूँ’ में स्वाभाविक रूप से समाहित है।
- source_word: וַאֲנִי הוֹלֵךְ עַל אֲשֶׁר אֲנִי הוֹלֵךְ
  choice: जबकि मैं स्वयं जहाँ भी जा सकूँ, जा रहा हूँ
  rationale: इब्रानी वाक्यांश दीर्घवृत्तीय और जानबूझकर अनिश्चित है। यह रूप दाऊद की उड़ान की अनिश्चितता व्यक्त करता है, और पादटिप्पणी अधिक शाब्दिक संरचना सुरक्षित रखती है।
- source_word: שׁוּב וְהָשֵׁב
  choice: लौट जाओ और ... वापस ले जाओ
  rationale: पहली क्रिया साधारण आज्ञार्थक ‘लौटना’ है और दूसरी उसी धातु का कारक रूप है, इसलिए दोनों का भेद रखा गया है।
- source_word: אַחֶיךָ
  choice: अपने भाइयों
  rationale: मूल पाठ का शाब्दिक संबंधसूचक शब्द सुरक्षित रखा गया है; प्रसंगगत संभावित अर्थ पादटिप्पणी में दिया गया है।
- source_word: חֶסֶד וֶאֱמֶת
  choice: अटल प्रेम और विश्वासयोग्यता
  rationale: यह प्रचलित इब्रानी युग्म निष्ठावान प्रेम और भरोसेमंद सच्चाई का भाव रखता है; चयन दोनों शब्दों का नैतिक और संबंधपरक भार बनाए रखता है।
theological_decisions:
- issue: पद के अंत में חֶסֶד וֶאֱמֶת का क्रियारहित प्रयोग
  choice: अटल प्रेम और विश्वासयोग्यता तुम्हारे साथ रहें
  alternative: अटल प्रेम और विश्वासयोग्यता
  rationale: इब्रानी में क्रिया व्यक्त नहीं है। प्रसंग में इसे आशीर्वचन के रूप में समझना स्वाभाविक है, पर क्रिया के लोप को पादटिप्पणी में स्पष्ट किया गया है ताकि व्याकरणिक खुलापन न छिपे।
- issue: दाऊद की यात्रा की अनिश्चितता
  choice: जहाँ भी जा सकूँ
  alternative: जहाँ मैं जा रहा हूँ, वहीं जा रहा हूँ
  rationale: मूल अभिव्यक्ति अनिश्चित और दीर्घवृत्तीय है। मुख्य पाठ में उसका संप्रेषणीय आशय दिया गया है, जबकि अधिक शाब्दिक रूप पादटिप्पणी में रखा गया है; इसे ईश्वरीय विवशता या निश्चित गंतव्य के रूप में नहीं समझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। दाऊद के प्रश्न में अपनापन और व्यावहारिक चिंता बनाए रखने के लिए ‘तुम’ रूप प्रयुक्त है। मूल की अनिश्चितता को मुख्य पाठ और पादटिप्पणी के संतुलन से सुरक्षित रखा गया है।
