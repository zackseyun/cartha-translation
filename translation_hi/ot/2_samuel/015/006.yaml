base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/006.yaml
  text: Absalom did this to all Israel who came to the king for judgment[a], and Absalom stole the hearts of the men of Israel.
translation:
  language: hi
  text: अबसालोम उन सभी इस्राएलियों के साथ ऐसा ही करता था, जो न्याय के लिए राजा के पास आते थे। और अबसालोम ने इस्राएल के पुरुषों का मन चुरा लिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् उसने इस्राएल के पुरुषों को चुपके से या छलपूर्वक अपने पक्ष में कर लिया। इब्रानी में शाब्दिक रूप से “मन चुरा लिया” है।
    reason: मूल इब्रानी रूपक का भाव स्पष्ट करते हुए उसकी छवि और नकारात्मक संकेत को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיַּעַשׂ ... כַּדָּבָר הַזֶּה
  choice: ऐसा ही करता था
  rationale: यहाँ अपूर्ण भूतकाल में बार-बार किए जाने वाले उस व्यवहार का उल्लेख है जिसका वर्णन पिछले पद में हुआ है। इसलिए ‘करता था’ प्रचलित क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְכָל יִשְׂרָאֵל
  choice: उन सभी इस्राएलियों के साथ
  rationale: यह वाक्यांश अबसालोम के व्यवहार से प्रभावित इस्राएली जनसमूह को दर्शाता है; हिंदी में ‘सभी इस्राएलियों के साथ’ स्वाभाविक और स्पष्ट है।
- source_word: אֲשֶׁר יָבֹאוּ
  choice: जो ... आते थे
  rationale: अपूर्ण क्रिया कथात्मक संदर्भ में नियमित रूप से घटने वाली भूतकालीन क्रिया बताती है।
- source_word: לַמִּשְׁפָּט
  choice: न्याय के लिए
  rationale: מִשְׁפָּט यहाँ न्यायिक सुनवाई या निर्णय के लिए प्रयुक्त है; ‘न्याय के लिए’ संक्षिप्त और सामान्य हिंदी है।
- source_word: אֶל הַמֶּלֶךְ
  choice: राजा के पास
  rationale: यह न्यायिक अधिकारी के रूप में राजा के निकट आने को व्यक्त करता है।
- source_word: וַיְגַנֵּב ... אֶת לֵב
  choice: मन चुरा लिए
  rationale: शाब्दिक ‘चुराना’ मूल इब्रानी रूपक और छिपे ढंग से निष्ठा प्राप्त करने के नकारात्मक संकेत को बनाए रखता है। सामूहिक एकवचन ‘मन’ को हिंदी में बहुवचन जनसमूह के अनुसार ‘मन’ के साथ बहुवचन क्रिया से स्वाभाविक बनाया गया है।
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: इस्राएल के लोगों
  rationale: אַנְשֵׁי का मूल अर्थ ‘पुरुष/लोग’ है, पर इस राजनीतिक-सामूहिक संदर्भ में यह इस्राएल की जनता के प्रतिनिधि समूह को सूचित कर सकता है। ‘लोगों’ आधुनिक हिंदी में स्वाभाविक है और संदर्भगत दायरे को अनावश्यक रूप से केवल पुरुषों तक सीमित नहीं करता।
theological_decisions:
- issue: אַנְשֵׁי יִשְׂרָאֵל में लिंग-सूचक अभिव्यक्ति
  choice: इस्राएल के लोगों
  alternative: इस्राएल के पुरुषों
  rationale: यद्यपि אֲנָשִׁים रूपतः पुल्लिंग है, यह सामूहिक राजनीतिक समुदाय के सदस्यों के लिए भी प्रयुक्त होता है। संदर्भ राजा के पास आने वाले पूरे इस्राएली जनसमूह और उनकी निष्ठा की बात करता है; इसलिए ‘लोगों’ अर्थगत विस्तार को सुरक्षित रखता है, जबकि ‘पुरुषों’ संभावित रूप से अनावश्यक संकीर्णता ला सकता है।
- issue: ‘मन चुराने’ के रूपक का अर्थ
  choice: रूपक को मुख्य पाठ में बनाए रखा
  alternative: अपने पक्ष में कर लिया / मन जीत लिए
  rationale: ‘चुरा लिए’ अबसालोम द्वारा गुप्त या छलपूर्ण ढंग से निष्ठा प्राप्त करने की मूल नकारात्मक छवि सुरक्षित रखता है। अधिक स्पष्ट अर्थ पादटिप्पणी में दिया गया है, ताकि मूल की अर्थगत तनावशीलता न मिटे।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘करता था’ से बार-बार होने वाली क्रिया स्पष्ट होती है। ‘मन चुरा लिए’ मूल रूपक को बनाए रखता है और पादटिप्पणी उसका आशय बताती है।
