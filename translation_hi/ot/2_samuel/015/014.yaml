  register: भाषा आधुनिक, गरिमापूर्ण और तात्कालिक संकट के अनुरूप है। ‘भाग चलें’ भय या कायरता का अतिरिक्त मूल्यांकन किए बिना मूल के ברח को व्यक्त करता है। इब्रानी तलवार-मुहावरे का अर्थ मुख्य पाठ में स्वाभाविक रूप से खोला गया है।
