review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents David’s exhortation to flee, the lack of escape from Absalom, the urgency, and the threatened calamity. However, the final clause changes the Hebrew object from “the city” (הָעִיר) to “the people of the city.” Although the idiom implies lethal violence against a city’s inhabitants, the translation should retain the city as the stated object and may explain the idiom in a note.
  naturalness: The Hindi is generally clear and suitably urgent. “अपने साथ रहनेवाले” can suggest people residing with David rather than simply those present with him; “जो उसके साथ थे” is more direct. “शीघ्र आकर” adds a nuance of coming that is not necessary; “जल्दी से हमें पकड़ ले” is natural and closer to the Hebrew.
  terminology: “सेवक,” “भाग चलें,” “विपत्ति,” and “तलवार की धार” are appropriate in modern formal Hindi. Rendering the sword idiom as “नगर को तलवार की धार से नाश कर डाले” retains the Hebrew’s reference to the city without unnecessarily making “people” explicit.
  issues:
  - severity: medium
    issue: The final clause renders “strike the city” as “नगर के लोगों को ... मार डाले.”
    rationale: The Hebrew explicitly says that Absalom would strike “the city.” The phrase may entail slaughter within the city, but the translation should not replace the stated object with “the people of the city.”
  - severity: low
    issue: “अपने साथ रहनेवाले” is less precise than “who were with him.”
    rationale: It may imply ongoing co-residence. The source only identifies David’s servants as being with him in Jerusalem.
  - severity: low
    issue: “शीघ्र आकर” adds an explicit motion nuance.
    rationale: The Hebrew says that he may hasten and overtake them; it does not separately say “come.”
  revised_text: तब दाऊद ने यरूशलेम में अपने साथ रहनेवाले सभी सेवकों से कहा, “उठो, हम भाग चलें, क्योंकि अबशालोम से बच निकलने का हमारे लिए कोई रास्ता नहीं होगा। जल्दी निकलो, कहीं वह जल्दी से हमें पकड़ ले, हम पर विपत्ति ले आए और नगर को तलवार की धार से नाश कर डाले।”
