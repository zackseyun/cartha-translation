base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/014.yaml
  text: Then David said to all his servants who were with him in Jerusalem[a], “Arise, and let us flee, for there will be no escape for us from Absalom. Hurry to depart[c][b], lest he quickly overtake us and bring disaster upon us and strike the city with the edge of the sword.”
translation:
  language: hi
  text: तब दाऊद ने यरूशलेम में अपने साथ रहनेवाले सभी सेवकों से कहा, “उठो, हम भाग चलें, क्योंकि अबशालोम से बच निकलने का हमारे लिए कोई रास्ता नहीं होगा। जल्दी निकलो, कहीं वह जल्दी से हमें पकड़ ले, हम पर विपत्ति ले आए और नगर को तलवार की धार से नाश कर डाले।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו
  choice: अपने ... सेवकों
  rationale: राजदरबार के संदर्भ में यह दाऊद के अधीन अधिकारियों और परिचारकों के लिए स्वाभाविक है; ‘दासों’ से बंधुआ स्थिति अनावश्यक रूप से निश्चित हो जाती।
- source_word: קוּמוּ וְנִבְרָחָה
  choice: उठो, हम भाग चलें
  rationale: बहुवचन आज्ञा और वक्ता को सम्मिलित करनेवाले cohortative भाव, दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: פְלֵיטָה
  choice: बच निकलने का ... कोई रास्ता
  rationale: यहाँ संज्ञा का आशय अबशालोम के खतरे से जीवित बचकर निकलना है; वाक्यांश हिन्दी में स्पष्ट और सहज है।
- source_word: מַהֲרוּ לָלֶכֶת
  choice: जल्दी निकलो
  rationale: शाब्दिक ‘जाने में जल्दी करो’ के बजाय तत्काल प्रस्थान की आज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פֶּן יְמַהֵר וְהִשִּׂגָנוּ
  choice: कहीं ऐसा न हो कि वह शीघ्र आकर हमें पकड़ ले
  rationale: פֶּן की आशंकासूचक शक्ति और पीछा करके जा पकड़ने के अर्थ को सुरक्षित रखता है।
- source_word: וְהִדִּיחַ עָלֵינוּ אֶת הָרָעָה
  choice: हम पर विपत्ति ले आए
  rationale: רָעָה यहाँ नैतिक बुराई नहीं, हानिकारक विपत्ति या अनिष्ट को सूचित करता है।
- source_word: וְהִכָּה הָעִיר לְפִי חָרֶב
  choice: नगर के लोगों को तलवार से मार डाले
  rationale: ‘नगर को तलवार के मुँह से मारना’ सामूहिक वध का इब्रानी मुहावरा है; हिन्दी में लक्षित मानव समुदाय को स्पष्ट कर अर्थ पहुँचाया गया है।
