base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/042.yaml
  text: And behold[a], all the men of Israel came to the king and said to the king, “Why have our brothers, the men of Judah, stolen you away and brought the king and his household across the Jordan[b], and all David’s men with him?”
translation:
  language: hi
  text: और देखो, इस्राएल के सब पुरुष[a] राजा के पास आए और राजा से कहने लगे, “हमारे भाइयों—यहूदा के पुरुषों—ने आपको क्यों चुरा लिया और राजा, उनके घराने, और दाऊद के सब लोगों को उनके साथ यरदन के पार क्यों ले आए?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “इस्राएल का हर पुरुष” और आगे “यहूदा का पुरुष” है; दोनों पद यहाँ समूहों के प्रतिनिधियों के लिए सामूहिक पुल्लिंग भाषा में प्रयुक्त हैं।
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: तभी
  rationale: यहाँ הִנֵּה कथा में अचानक ध्यान खींचते हुए अगले घटनाक्रम को सामने लाता है। हिंदी में ‘तभी’ इस कथात्मक परिवर्तन और तात्कालिकता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: इस्राएल के सब पुरुष
  rationale: אִישׁ एकवचन रूप में होते हुए भी यहाँ सामूहिक अर्थ रखता है। ‘सब पुरुष’ मूल के प्रतिनिधिक पुल्लिंग प्रयोग को बनाए रखता है।
- source_word: בָּאִים
  choice: आए
  rationale: वर्णनात्मक प्रसंग में इस कृदंत का स्वाभाविक हिंदी रूप पूर्ण भूतकाल है।
- source_word: גְּנָבוּךָ
  choice: आपको हमसे चुरा लिया
  rationale: גנב का मूल अर्थ ‘चुराना’ है। यहाँ यह राजनीतिक आरोप के रूप में रूपक है—यहूदा ने दूसरे इस्राएलियों को सम्मिलित किए बिना राजा को अपने अधिकार में कर लिया। ‘हमसे’ प्रसंग में निहित वंचित किए जाने के भाव को स्पष्ट करता है।
- source_word: אַחֵינוּ אִישׁ יְהוּדָה
  choice: हमारे भाइयों, यहूदा के पुरुषों
  rationale: ‘भाइयों’ से इस्राएली कुलों का पारिवारिक संबंध और विवाद की विडंबना बनी रहती है; ‘यहूदा के पुरुषों’ सामूहिक אִישׁ का सटीक रूप है।
- source_word: וַיַּעֲבִרוּ
  choice: यरदन पार ... ले आए
  rationale: עבר के हिफ़ील रूप का अर्थ किसी को पार कराना या पार ले जाना है। ‘पार ले आए’ causative अर्थ और राजा के लौटाए जाने, दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בֵּיתוֹ
  choice: उनके घराने
  rationale: यहाँ בַּיִת भवन नहीं, राजा के परिवार और गृहस्थ मंडली का द्योतक है; ‘घराना’ इस सामूहिक अर्थ को व्यक्त करता है।
- source_word: וְכָל אַנְשֵׁי דָוִד עִמּוֹ
  choice: उनके साथ दाऊद के सब लोगों
  rationale: यह वाक्यांश दाऊद के साथ रहने वाले पूरे दल को पार ले जाने की क्रिया में सम्मिलित करता है। हिंदी में ‘लोगों’ सामान्य दल या अनुचरों के लिए स्वाभाविक है और ‘उनके साथ’ עִמּוֹ को बनाए रखता है।
