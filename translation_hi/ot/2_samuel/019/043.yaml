  text: וַ/יַּעַן֩ כָּל אִ֨ישׁ יְהוּדָ֜ה עַל אִ֣ישׁ יִשְׂרָאֵ֗ל כִּֽי קָר֤וֹב הַ/מֶּ֨לֶךְ֙ אֵלַ֔/י וְ/לָ֤/מָּה זֶּה֙ חָרָ֣ה לְ/ךָ֔ עַל הַ/דָּבָ֖ר הַ/זֶּ֑ה הֶ/אָכ֤וֹל אָכַ֨לְנוּ֙ מִן הַ/מֶּ֔לֶךְ אִם נִשֵּׂ֥את נִשָּׂ֖א לָֽ/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/043.yaml
  text: Then every man of Judah answered the man of Israel[a], “Because the king is a close relative to me[b]. So why has this matter made you angry? Have we eaten at all at the king’s expense? Or has he given us any gift?”
translation:
  language: hi
  text: तब यहूदा के सब पुरुषों ने इस्राएलियों[a] को उत्तर दिया, “क्योंकि राजा हमारा निकट संबंधी है[b]। फिर तुम इस बात पर क्यों क्रोधित हो? क्या हमने राजा की ओर से कुछ भी खाया है? या क्या हमारे लिए कुछ लाया गया है?[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “इस्राएल का पुरुष” एकवचन में है, पर यहाँ वह इस्राएलियों के समूह का सामूहिक बोध कराता है।
    reason: भाषिक रूप और सामूहिक अर्थ स्पष्ट करना।
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “राजा मेरे निकट है”; यहाँ संभवतः पारिवारिक या कबीलाई निकटता का भाव है।
    reason: मूल की अभिव्यक्ति और संभावित अर्थभेद सुरक्षित रखना।
  - marker: c
    text: अंतिम इब्रानी वाक्यांश कठिन है। इसका अनुवाद “या क्या हमें कुछ दिया गया है?” भी हो सकता है।
    reason: पाठ की वास्तविक अस्पष्टता और वैकल्पिक अर्थ बताना।
lexical_decisions:
- source_word: וַיַּעַן
  choice: तब ... उत्तर दिया
  rationale: यह कथात्मक क्रम में अगली प्रतिक्रिया प्रस्तुत करता है; ‘तब’ स्वाभाविक हिन्दी प्रवाह देता है।
- source_word: כָּל אִישׁ יְהוּדָה ... אִישׁ יִשְׂרָאֵל
  choice: यहूदा के सब पुरुषों ... इस्राएल के पुरुषों
  rationale: इब्रानी में एकवचन रूप सामूहिक अर्थ में प्रयुक्त हैं। हिन्दी में बहुवचन से दोनों जनसमूहों के बीच का संवाद स्पष्ट और स्वाभाविक रहता है।
- source_word: כִּי קָרוֹב הַמֶּלֶךְ אֵלַי
  choice: क्योंकि राजा हमारा निकट संबंधी है
  rationale: קָרוֹב यहाँ केवल भौगोलिक निकटता नहीं, बल्कि दाऊद और यहूदा के कबीलाई/पारिवारिक संबंध को सूचित करता है। सामूहिक वक्ता के कारण ‘हमारा’ चुना गया है।
- source_word: וְלָמָּה זֶּה חָרָה לְךָ עַל הַדָּבָר הַזֶּה
  choice: फिर इस बात पर तुम क्यों क्रोधित हुए?
  rationale: חָרָה का मुहावरेदार अर्थ ‘क्रोधित होना’ है; הַדָּבָר הַזֶּה विवादाधीन बात को दर्शाता है।
- source_word: הֶאָכוֹל אָכַלְנוּ מִן הַמֶּלֶךְ
  choice: क्या हमने राजा के यहाँ से कुछ भी खाया है?
  rationale: धातु की पुनरुक्ति से आए बल को ‘कुछ भी’ व्यक्त करता है। ‘राजा के यहाँ से’ मूल מִן הַמֶּלֶךְ की ठोस छवि को बनाए रखता है और उससे लाभ पाने का आशय भी संदर्भ में समझ आता है।
- source_word: אִם נִשֵּׂאת נִשָּׂא לָנוּ
  choice: या क्या हमारे लिए कुछ उठा लाया गया है?
  rationale: कठिन इब्रानी वाक्यांश में נשׂא की ‘उठाना/ले जाना’ छवि और निष्क्रिय रूप सुरक्षित रखे गए हैं; अनिर्दिष्ट वस्तु के लिए ‘कुछ’ जोड़ा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली। सामूहिक संबोधन के लिए ‘तुम’ रखा गया है; अंतिम कठिन उपवाक्य को अत्यधिक स्पष्ट करके मूल की अस्पष्टता मिटाई नहीं गई।
