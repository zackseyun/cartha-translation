base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/001.yaml
  text: Then the king was deeply shaken[a], and he went up to the chamber over the gate and wept. As he went, he said, “My son Absalom! My son, my son Absalom! If only I had died instead of you, Absalom, my son[b], my son!”
translation:
  language: hi
  text: तब राजा बहुत व्याकुल हो उठा और फाटक के ऊपर की कोठरी[a] में गया और रोया। चलते हुए वह कहता रहा, “मेरे बेटे अबशालोम! मेरे बेटे, मेरे बेटे अबशालोम! काश, तेरी जगह मैं मर गया होता[b], अबशालोम, मेरे बेटे, मेरे बेटे!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “फाटक की ऊपरी कोठरी।”
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक मुहावरा है, “कौन देता कि मैं तेरी जगह मर गया होता?” यह प्रबल इच्छा व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְגַּז
  choice: बहुत व्याकुल हो उठा
  rationale: רגז काँपने, उद्विग्न होने या गहरे भावनात्मक रूप से विचलित होने का भाव दे सकता है। शोक के इस प्रसंग में यह चयन राजा की तीव्र आंतरिक व्यथा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עֲלִיַּת הַשַּׁעַר
  choice: फाटक के ऊपर की कोठरी
  rationale: עֲלִיָּה ऊपरी कक्ष को और הַשַּׁעַר नगर-द्वार अथवा फाटक को दर्शाता है; यह अनुवाद स्थान की वास्तु-संबंधी स्थिति स्पष्ट रखता है।
- source_word: וַיֵּבְךְּ
  choice: रोने लगा
  rationale: בכה का अर्थ रोना है। प्रसंग में क्रिया के आरम्भ और जारी रहने का स्वाभाविक हिन्दी रूप ‘रोने लगा’ है।
- source_word: וְכֹה אָמַר בְּלֶכְתּוֹ
  choice: जाते-जाते वह कहता गया
  rationale: यह रूप चलते रहने के साथ जारी विलाप को व्यक्त करता है और हिब्रू की परिस्थितिवाचक अभिव्यक्ति को सहज हिन्दी में सुरक्षित रखता है।
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: मूल में बार-बार आया यह संबोधन विलाप की करुणा का केंद्र है, इसलिए प्रत्येक पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: מִי יִתֵּן
  choice: काश
  rationale: शाब्दिक रूप से ‘कौन देगा?’ वाला यह हिब्रू मुहावरा तीव्र इच्छा व्यक्त करता है; आधुनिक हिन्दी में ‘काश’ उसी भाव को स्पष्ट और संक्षिप्त रूप से पहुँचाता है।
- source_word: מוּתִי אֲנִי תַחְתֶּיךָ
  choice: तेरी जगह मैं मर गया होता
  rationale: वाक्यांश मृत पुत्र के स्थान पर स्वयं मर जाने की असंभव, अतीत-विषयक इच्छा व्यक्त करता है; यह हिन्दी रूप उस प्रतिकल्पित विलाप को स्वाभाविक रूप देता है।
- source_word: אַבְשָׁלוֹם
  choice: अबशालोम
  rationale: व्यक्तिनाम को प्रचलित हिन्दी बाइबलीय लिप्यंतरण के अनुसार प्रस्तुत किया गया है।
