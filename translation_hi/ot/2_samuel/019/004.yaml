translation:
  language: hi
  text: उस दिन लोग नगर में चुपके से आए, जैसे लोग युद्ध में भागते समय लज्जित होकर चुपके से खिसक जाते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְגַּנֵּב / יִתְגַּנֵּב
  choice: चुपके से आए / चुपके से लौटते हैं
  rationale: हित्पएल रूप यहाँ चोरी करने का नहीं, किसी की नज़र में आए बिना दबे पाँव आने-जाने का भाव देता है। पहले प्रयोग में नगर में प्रवेश स्पष्ट किया गया है; दूसरे में युद्ध से भागने वालों की लज्जित वापसी का स्वाभाविक हिन्दी रूप रखा गया है।
- source_word: הַנִּכְלָמִים
  choice: लज्जित हों
  rationale: यह शब्द अपमान और शर्म का भाव व्यक्त करता है; ‘लज्जित’ dignified और सामान्य आधुनिक हिन्दी में उपयुक्त है।
- source_word: בְּנוּסָם בַּמִּלְחָמָה
  choice: युद्ध से भागने के कारण
  rationale: 'בְּ को प्रसंग में कारणसूचक समझा गया है: उनकी लज्जा युद्ध से पलायन के कारण है। ‘युद्ध में भागते समय’ भी संभव है, पर हिन्दी में उससे अर्थ कुछ अस्पष्ट हो सकता है।'
