  rationale: प्रत्यक्ष कर्म और शोक के प्रसंग में यहाँ शरीर के अंग का ठोस अर्थ है। हिन्दी में इस क्रिया के साथ ‘अपना मुँह’ स्वाभाविक है।
- source_word: וַיִּזְעַק
  choice: पुकार उठा
  rationale: यह शब्द तीव्र और ऊँची पुकार व्यक्त करता है। ‘पुकार उठा’ शोक की आकस्मिक तीव्रता बनाए रखता है, पर ‘विलाप किया’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: קוֹל גָּדוֹל
  choice: ऊँची आवाज़ में
  rationale: इब्रानी मुहावरे का अर्थ ऊँची अथवा प्रबल आवाज़ है। यह हिन्दी में स्पष्ट और स्वाभाविक रूप है।
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: एकवचन पुल्लिंग संज्ञा प्रथम पुरुष संबंधसूचक प्रत्यय के साथ दाऊद और अबशालोम का संबंध सीधे व्यक्त करती है। संबोधन में ‘मेरे बेटे’ स्वाभाविक और भावपूर्ण है।
- source_word: אַבְשָׁלוֹם
  choice: अबशालोम
  rationale: नाम का मानक हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: אַבְשָׁלוֹם / בְּנִי की पुनरावृत्ति
  choice: “मेरे बेटे अबशालोम! अबशालोम, मेरे बेटे, मेरे बेटे!”
  rationale: मूल पाठ की पूरी पुनरावृत्ति दाऊद के गहरे शोक को व्यक्त करती है; इसलिए उसे सहज विराम-चिह्नों के साथ यथावत रखा गया है।
