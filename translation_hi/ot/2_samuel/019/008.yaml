source:
  edition: WLC
  text: וְ/עַתָּה֙ ק֣וּם צֵ֔א וְ/דַבֵּ֖ר עַל לֵ֣ב עֲבָדֶ֑י/ךָ כִּי֩ בַ/יהוָ֨ה נִשְׁבַּ֜עְתִּי כִּי אֵינְ/ךָ֣ יוֹצֵ֗א אִם יָלִ֨ין אִ֤ישׁ אִתְּ/ךָ֙ הַ/לַּ֔יְלָה וְ/רָעָ֧ה לְ/ךָ֣ זֹ֗את מִ/כָּל הָ/רָעָה֙ אֲשֶׁר בָּ֣אָה עָלֶ֔י/ךָ מִ/נְּעֻרֶ֖י/ךָ עַד עָֽתָּה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/008.yaml
  text: Now get up[a], go out, and speak to the heart of your servants, for I swear by Yahweh that if you do not go out, not a man will stay with you tonight, and this will be worse for you than all the trouble that has come upon you from your youth until now.
translation:
  language: hi
  text: अब उठ, बाहर जा और अपने सेवकों से उनका मन जीतने वाली बातें कर[a]; क्योंकि मैं यहोवा की शपथ खाकर कहता हूँ कि यदि तू बाहर नहीं जाएगा, तो आज रात एक भी आदमी तेरे साथ नहीं ठहरेगा। यह तेरे लिए उस सारी विपत्ति से भी अधिक बुरा होगा जो तेरी जवानी से लेकर अब तक तुझ पर आई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने सेवकों के हृदय से बात कर”; यह एक हिब्रू मुहावरा है जिसका अर्थ उनसे स्नेहपूर्वक, ढाढ़स बँधाते हुए या मनाने के ढंग से बात करना है।
    reason: हिब्रू मुहावरे का शाब्दिक बिंब और उसके अर्थ-क्षेत्र को स्पष्ट करता है।
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: संदर्भ में यह तत्काल और तर्कसंगत परिवर्तन का संकेत है; ‘इसलिए अब’ योआब के पिछले कथन से आग्रह को स्वाभाविक रूप से जोड़ता है।
- source_word: קוּם צֵא
  choice: उठ, बाहर जा
  rationale: दोनों आज्ञार्थक क्रियाओं को अलग-अलग और ठोस रूप में बनाए रखा गया है।
- source_word: וְדַבֵּר עַל־לֵב
  choice: मन से बात कर
  rationale: हिब्रू मुहावरे के हृदय/अंतरमन संबंधी बिंब को स्वाभाविक हिन्दी में यथासंभव सुरक्षित रखता है; आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: עֲבָדֶיךָ
  choice: अपने सेवकों
  rationale: राजकीय और सैन्य संदर्भ में यह राजा के अधीन लोगों को दर्शाता है, न कि आवश्यक रूप से दासत्व की स्थिति को।
- source_word: כִּי בַיהוָה נִשְׁבַּעְתִּי
  choice: क्योंकि मैं यहोवा की शपथ खाकर कहता हूँ
  rationale: हिब्रू शपथ-घोषणा की वर्तमान वाक्यगत शक्ति को स्पष्ट और मुहावरेदार हिन्दी में व्यक्त करता है।
- source_word: אֵינְךָ יוֹצֵא אִם יָלִין אִישׁ אִתְּךָ הַלַּיְלָה
  choice: यदि तू बाहर नहीं जाएगा, तो आज रात एक भी आदमी तेरे साथ नहीं ठहरेगा
  rationale: शर्त और उसके परिणाम को स्पष्ट रखता है; ‘एक भी आदमी’ पूर्ण परित्याग की बलाघाती भावना व्यक्त करता है।
- source_word: וְרָעָה לְךָ זֹאת מִכָּל־הָרָעָה
  choice: यह तेरे लिए उन सब विपत्तियों से भी अधिक बुरा होगा
  rationale: מִן से व्यक्त तुलना को स्वाभाविक हिन्दी में स्पष्ट करता है; רָעָה यहाँ नैतिक बुराई के बजाय संकट या विपत्ति है।
- source_word: מִנְּעֻרֶיךָ עַד עָתָּה
  choice: तेरी जवानी से लेकर अब तक
  rationale: दाऊद के युवाकाल से वर्तमान संकट तक की पूरी अवधि को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। हिन्दी पाठकों के लिए प्रचलित नामरूप ‘यहोवा’ चुना गया है, जिससे इसे सामान्य उपाधि ‘प्रभु’ में विलीन किए बिना व्यक्तिगत वाचा-नाम के रूप में रखा जाए।
- issue: רָעָה का अर्थ
  choice: विपत्तियाँ / अधिक बुरा
  alternative: बुराई / अनिष्ट
  rationale: इस ऐतिहासिक संदर्भ में शब्द दाऊद पर आई प्रतिकूल घटनाओं और संकटों को दर्शाता है, नैतिक पाप को नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सीधी राजकीय चेतावनी। दाऊद को संबोधन में एकवचन ‘तू/तेरे’ मूल के निकट और तीखे प्रसंगानुकूल है। लंबे हिब्रू वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है।
