  yaml_path: translation/ot/2_samuel/019/024.yaml
  text: And the king said to Shimei[a], “You shall not die.” And the king swore to him.
translation:
  language: hi
  text: तब राजा ने शिमी से कहा, “तुम नहीं मरोगे[a]।” और राजा ने उसे शपथपूर्वक वचन दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक व्याख्यात्मक अनुवाद: “तुम्हें मृत्युदंड नहीं दिया जाएगा।” हिब्रू में शाब्दिक रूप से “तुम नहीं मरोगे” है, जो यहाँ मृत्युदंड से क्षमा देने की राजकीय प्रतिज्ञा का अर्थ दे सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: हिब्रू कथात्मक क्रम में अगली घटना को प्रस्तुत करता है; ‘तब’ आधुनिक हिन्दी में इस क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित संज्ञा प्रसंग में पहले से ज्ञात राजा को सूचित करती है; हिन्दी में यहाँ ‘राजा’ स्वाभाविक है।
- source_word: אֶל שִׁמְעִי
  choice: शिमी से
  rationale: वाणी के संबोधित व्यक्ति को हिन्दी में ‘से’ के द्वारा स्वाभाविक ढंग से व्यक्त किया गया है; नाम का मानक लिप्यंतरण ‘शिमी’ रखा गया है।
- source_word: לֹא תָמוּת
  choice: तू नहीं मरेगा
  rationale: निषेधात्मक अपूर्ण क्रिया यहाँ दृढ़ राजकीय आश्वासन या निर्णय व्यक्त कर सकती है। यह शाब्दिक अर्थ और उसकी संभावित व्यापकता को बनाए रखता है, जबकि निष्पादन से क्षमा का आशय प्रसंग में निहित रहने देता है।
- source_word: וַיִּשָּׁבַע
  choice: और ... ने शपथ खाई
  rationale: निफ़अल रूप का अर्थ शपथ खाना है। यह हिन्दी में संक्षिप्त, स्पष्ट और प्रचलित अभिव्यक्ति है।
- source_word: לוֹ
  choice: उससे
  rationale: सर्वनाम शिमी की ओर संकेत करता है और शपथ के संबोधित व्यक्ति को व्यक्त करता है; अनावश्यक नाम-पुनरावृत्ति से बचते हुए हिब्रू संबंध को सुरक्षित रखता है।
theological_decisions:
- issue: לֹא תָמוּת में मृत्यु बनाम मृत्युदंड का आशय
  choice: मुख्य पाठ में ‘तू नहीं मरेगा’
  alternative: ‘तुझे मार डाला नहीं जाएगा’
  rationale: हिब्रू का शाब्दिक कथन मृत्यु का निषेध है, जो प्रसंग में राजकीय क्षमा और मृत्युदंड से बचाने का वचन हो सकता है। मुख्य पाठ में व्यापक और वास्तविक अस्पष्टता रखी गई है; अधिक व्याख्यात्मक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। राजा का सीधा संबोधन ‘तू’ मूल इब्रानी के एकवचन संबोधन और प्राचीन राजकीय प्रसंग के अनुरूप है; इसका उद्देश्य असम्मानजनक बोलचाल नहीं, बल्कि प्रत्यक्ष और अधिकारपूर्ण कथन को व्यक्त करना है।
