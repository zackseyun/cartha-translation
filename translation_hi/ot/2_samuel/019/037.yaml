  text: For your servant would only cross the Jordan a little way with the king[a]; why should the king repay me with this reward?
translation:
  language: hi
  text: क्योंकि आपका सेवक राजा के साथ यरदन के पार बस थोड़ी दूर तक जाएगा; फिर राजा मुझे यह प्रतिफल क्यों दे?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजा मुझे यह प्रतिदान क्यों दे?” इब्रानी में क्रिया और उसी धातु से बनी संज्ञा (גמל) साथ प्रयुक्त हैं, जिससे प्रतिदान या पारिश्रमिक के भाव पर बल पड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּ/מְעַט
  choice: क्योंकि ... बस थोड़ी दूर तक
  rationale: כִּי को प्रसंगानुसार कारणसूचक ‘क्योंकि’ और מְעַט को यात्रा की सीमित दूरी बताने वाले ‘बस थोड़ी दूर तक’ के रूप में व्यक्त किया गया है।
- source_word: יַעֲבֹר
  choice: पार ... जाएगा
  rationale: यहाँ अपूर्ण क्रिया इच्छित या संभावित कार्य को दर्शाती है; विनम्र उत्तर के प्रसंग में सामान्य हिन्दी भविष्यत् रूप स्वाभाविक है।
- source_word: עַבְדְּךָ
  choice: आपका सेवक
  rationale: राजा को संबोधित करते समय यह आत्म-विनम्रता की प्रचलित अभिव्यक्ति है; यहाँ दासत्व पर बल नहीं है।
- source_word: אֶת הַיַּרְדֵּן
  choice: यरदन के पार
  rationale: עבר के साथ यह नदी पार करने का अर्थ देता है; ‘यरदन के पार’ आधुनिक हिन्दी में सहज है।
- source_word: אֶת הַמֶּלֶךְ
  choice: राजा के साथ
  rationale: यहाँ אֶת कर्मचिह्न नहीं, साथ होने का बोध कराने वाला संबंधसूचक पद है।
- source_word: וְלָמָּה
  choice: फिर ... क्यों
  rationale: यह राजा के प्रस्तावित उपकार को विनम्रतापूर्वक अस्वीकार करने वाला आलंकारिक प्रश्न आरम्भ करता है।
- source_word: יִגְמְלֵנִי ... הַגְּמוּלָה הַזֹּאת
  choice: मुझे ऐसा प्रतिफल ... दे
  rationale: क्रिया और सजातीय संज्ञा גמל/גמולה में प्रतिदान का भाव और धातुमूल की पुनरुक्ति है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और पुनरुक्ति का संकेत पादटिप्पणी में दिया गया है।
