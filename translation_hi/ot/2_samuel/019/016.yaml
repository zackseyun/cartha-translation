base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/016.yaml
  text: Then the king returned and came as far as the Jordan[a], and Judah came to Gilgal to go to meet the king, to bring the king across the Jordan.
translation:
  language: hi
  text: तब राजा लौटकर यरदन तक आया। यहूदा[a] राजा से मिलने और राजा को यरदन पार कराने के लिए गिलगाल आया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् यहूदा के लोग। इब्रानी में “यहूदा” नाम पूरे गोत्र या उसके लोगों के लिए सामूहिक रूप से प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: लौटकर
  rationale: שׁוב के कथात्मक रूप का स्वाभाविक अर्थ यहाँ निर्वासन से लौटना है; संयुक्त क्रिया अगले कार्य से सहज रूप से जुड़ती है।
- source_word: וַיָּבֹא עַד הַיַּרְדֵּן
  choice: यरदन तक आया
  rationale: עַד गंतव्य की सीमा तक पहुँचने का भाव देता है और इस चरण पर नदी पार कर लेने का संकेत नहीं देता।
- source_word: וִיהוּדָה
  choice: यहूदा
  rationale: मूल पाठ में प्रदेश/गोत्र का नाम सामूहिक अर्थ में आया है; मुख्य पाठ उसी संक्षिप्त अभिव्यक्ति को रखता है और पादटिप्पणी उसका अर्थ स्पष्ट करती है।
- source_word: בָּא
  choice: आया था
  rationale: पूर्ववर्ती कथात्मक क्रियाओं के बाद यह पूर्ण रूप पृष्ठभूमि में पहले हो चुकी यहूदा की पहुँच को व्यक्त कर सकता है; हिन्दी में ‘आया था’ यह संबंध स्वाभाविक ढंग से दिखाता है।
- source_word: הַגִּלְגָּלָה
  choice: गिलगाल
  rationale: स्थान-नाम के साथ दिशासूचक ה वहाँ जाने का भाव देता है, जिसे हिन्दी में ‘गिलगाल आया था’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: לָלֶכֶת לִקְרַאת
  choice: मिलने के लिए
  rationale: दोनों क्रियारूप उद्देश्य और सामने जाकर भेंट करने का भाव देते हैं; हिन्दी में ‘मिलने के लिए’ अर्थ को स्पष्ट और अनावश्यक शब्दाडंबर के बिना व्यक्त करता है।
- source_word: לְהַעֲבִיר אֶת הַמֶּלֶךְ אֶת הַיַּרְדֵּן
  choice: राजा को यरदन पार कराने के लिए
  rationale: עבר का हिफ़ील रूप किसी को पार कराने का कारक भाव रखता है; यह अनुवाद किसी नाव या विशेष साधन की कल्पना जोड़े बिना वही अर्थ देता है।
