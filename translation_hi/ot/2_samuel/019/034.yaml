base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/034.yaml
  text: And the king said to Barzillai[a], “You cross over with me, and I will provide for you with me in Jerusalem.”
translation:
  language: hi
  text: तब राजा ने बर्जिल्लै से कहा, “तुम मेरे साथ पार चलो, और मैं यरूशलेम में अपने साथ तुम्हारा भरण-पोषण करूँगा[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारी आवश्यकताएँ पूरी करूँगा” अथवा “तुम्हें संभालूँगा।” हिब्रू क्रिया का अर्थ किसी की ज़रूरतें पूरी करके उसका निर्वाह करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: हिब्रू कथात्मक क्रम को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है; ‘तब’ घटनाक्रम को दिखाता है, बिना अतिरिक्त कारणात्मक अर्थ जोड़े।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित संज्ञा है और प्रसंग में दाऊद की ओर संकेत करती है; हिन्दी में ‘राजा’ स्वाभाविक है।
- source_word: בַּרְזִלָּי
  choice: बर्जिल्लै
  rationale: व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אַתָּה עֲבֹר אִתִּי
  choice: तुम मेरे साथ पार चलो
  rationale: स्वतंत्र सर्वनाम אַתָּה को ‘तुम’ से बनाए रखा गया है। עֲבֹר इस प्रसंग में यरदन पार करने का ठोस भाव रखता है, इसलिए ‘पार चलो’ चुना गया।
- source_word: וְכִלְכַּלְתִּי אֹתְךָ
  choice: और ... तुम्हारा भरण-पोषण करूँगा
  rationale: כלכל यहाँ किसी की आवश्यकताएँ पूरी करके उसे संभालने या उसका निर्वाह करने का अर्थ देता है; ‘भरण-पोषण करना’ वर्तमान हिन्दी में इस निरंतर देखभाल को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: עִמָּדִי
  choice: अपने साथ
  rationale: राजा की संगति और निकट उपस्थिति का मूल भाव बनाए रखता है, बिना इसे अधिक व्याख्यायित करके ‘अपनी देखरेख में’ बनाने के।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानवाचक בְּ का सीधा और स्वाभाविक हिन्दी रूप।
