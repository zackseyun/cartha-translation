translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पार चलो’ नदी पार करने के प्रसंग को स्पष्ट रखता है, जबकि ‘अपने साथ’ मूल पाठ में दोहराई गई राजकीय संगति को सुरक्षित रखता है। पाद-टिप्पणी का चिह्न उस क्रिया-वाक्यांश के बाद रखा गया है जिससे वह संबंधित है।
