base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/009.yaml
  text: Then the king arose and sat in the gate[a]. And they told all the people, saying, “Look, the king is sitting in the gate.” Then all the people came before the king. But Israel had fled[b], each man to his tent.
translation:
  language: hi
  text: तब राजा उठा और नगर-द्वार पर बैठा। सब लोगों को यह समाचार दिया गया, “देखो, राजा नगर-द्वार पर बैठा है।” तब सब लोग राजा के सामने आए। पर[b] इस्राएल के लोग भाग गए थे, हर आदमी अपने डेरे की ओर[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “हर आदमी अपने डेरे की ओर।” यह अपने निवास-स्थान या गोत्रीय क्षेत्र की ओर तितर-बितर हो जाने का मुहावरा है।'
    reason: cultural_note
  - marker: b
    text: 'या: “और इस्राएल के लोग भाग गए थे, हर आदमी अपने डेरे की ओर।” इब्रानी संयोजक का सामान्य अर्थ “और” है; यहाँ संदर्भगत विरोध दिखाने के लिए मुख्य पाठ में “पर” रखा गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: तब राजा उठा
  rationale: קום का काल-वाचक रूप कथा में अगली घटना को आगे बढ़ाता है; ‘तब’ इस क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיֵּשֶׁב בַּשָּׁעַר
  choice: नगर-द्वार पर जा बैठा
  rationale: ישב यहाँ राजा के सार्वजनिक रूप से अपना स्थान ग्रहण करने को दर्शाता है। प्राचीन नगर-द्वार केवल दरवाज़ा नहीं, सार्वजनिक सभा और प्रशासन का स्थान था; इसलिए ‘नगर-द्वार’ संदर्भ स्पष्ट करता है। हिन्दी में स्थान के लिए ‘पर’ स्वाभाविक है।
- source_word: הִגִּידוּ לֵאמֹר
  choice: सब लोगों को यह समाचार दिया गया
  rationale: נגד के हिफ़ील का अर्थ ‘बताना/समाचार देना’ है। इब्रानी में कर्ता अनिर्दिष्ट बहुवचन है; हिन्दी का कर्मवाच्य उस अनिर्दिष्ट कर्ता को बिना गढ़े स्वाभाविक रूप से बनाए रखता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला सूचक अव्यय है; ‘देखो’ आधुनिक और सीधा है तथा कथन की तात्कालिकता बनाए रखता है।
- source_word: יוֹשֵׁב
  choice: बैठा है
  rationale: कृदन्त राजा की उस समय दिखाई देने वाली वर्तमान अवस्था बताता है; ‘बैठा है’ हिन्दी में इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיָּבֹא כָל הָעָם לִפְנֵי הַמֶּלֶךְ
  choice: तब सब लोग राजा के सामने आए
  rationale: בוא + לפני का सीधा अर्थ राजा के सामने अथवा उसकी उपस्थिति में आना है; अनावश्यक औपचारिक या समारोहिक अर्थ जोड़े बिना यही दृश्य सुरक्षित रहता है।
- source_word: וְיִשְׂרָאֵל נָס
  choice: पर इस्राएल के लोग भाग गए थे
  rationale: נָס का पूर्ण रूप तत्काल दृश्य से पहले घट चुकी पृष्ठभूमि की स्थिति बताता है, इसलिए ‘भाग गए थे’ उपयुक्त है। וְ को संदर्भगत विरोध दिखाने के लिए ‘पर’ किया गया है, जबकि अधिक सीधा ‘और’ भी संभव है। ‘इस्राएल के लोग’ हिन्दी में सामूहिक जनसमूह को स्पष्ट करता है।
- source_word: אִישׁ לְאֹהָלָיו
  choice: हर पुरुष अपने डेरे को
  rationale: शाब्दिक वितरक अभिव्यक्ति ‘एक पुरुष अपने डेरे को’ का आशय प्रत्येक पुरुष का अपने निवास या गोत्रीय स्थान की ओर तितर-बितर होना है। ‘हर पुरुष’ स्पष्ट पुल्लिंग रूप को बनाए रखता है और ‘डेरा’ मूल बिंब को सुरक्षित रखता है।
theological_decisions:
- issue: אִישׁ का लिंग-विशिष्ट वितरक अर्थ
  choice: हर पुरुष
  alternative: हर एक / सब लोग
  rationale: मूल पाठ में स्पष्ट पुल्लिंग एकवचन वितरक संज्ञा है। उसे लिंग-निरपेक्ष करने के बजाय ‘हर पुरुष’ रखा गया है, यद्यपि यह पूरे समूह के बिखरने का मुहावरा है।
- issue: וְיִשְׂרָאֵל में संयोजक का संबंध
  choice: पर इस्राएल के लोग भाग गए थे
  alternative: और इस्राएल के लोग भाग गए थे
  rationale: ‘पर’ राजा के पास इकट्ठे हुए लोगों और पहले ही भाग चुके इस्राएल के व्यापक दल के बीच संदर्भगत विरोध स्पष्ट करता है। फिर भी मूल וְ का सामान्य अर्थ ‘और’ है, इसलिए विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘नगर-द्वार’ प्राचीन सार्वजनिक स्थल को स्पष्ट करता है। मूल का ‘डेरा’ वाला बिंब और पुल्लिंग वितरक अभिव्यक्ति सुरक्षित रखी गई है। अंग्रेज़ी परामर्श-पाठ में [a] का चिह्न ‘gate’ के बाद था, पर उसकी पादटिप्पणी स्पष्टतः אִישׁ לְאֹהָלָיו से संबंधित है; इसलिए हिन्दी मुख्य पाठ में [a] को ‘डेरे को’ के बाद उचित स्थान पर रखा गया है।
