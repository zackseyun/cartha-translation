  text: וַ/יַּ֣עַן אִֽישׁ יִשְׂרָאֵל֩ אֶת אִ֨ישׁ יְהוּדָ֜ה וַ/יֹּ֗אמֶר עֶֽשֶׂר יָד֨וֹת לִ֣/י בַ/מֶּלֶךְ֮ וְ/גַם בְּ/דָוִד֮ אֲנִ֣י מִמְּ/ךָ֒ וּ/מַדּ֨וּעַ֙ הֱקִלֹּתַ֔/נִי וְ/לֹא הָיָ֨ה דְבָרִ֥/י רִאשׁ֛וֹן לִ֖/י לְ/הָשִׁ֣יב אֶת מַלְכִּ֑/י וַ/יִּ֨קֶשׁ֙ דְּבַר אִ֣ישׁ יְהוּדָ֔ה מִ/דְּבַ֖ר אִ֥ישׁ יִשְׂרָאֵֽל־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/044.yaml
  text: Then the man of Israel answered the man of Judah and said[a], “I have ten shares in the king, and in David also I have more than you[d][c][b]. Why then did you treat me lightly? Was not my word first in bringing back my king?” But the word of the men of Judah was harsher than the word of the men of Israel.
translation:
  language: hi
  text: इस्राएल के लोगों ने यहूदा के लोगों को उत्तर दिया, “राजा पर हमारा दस हिस्सों का अधिकार है[a], और दाऊद पर भी हमारा दावा तुमसे बढ़कर है[b]। फिर तुमने हमें इतना तुच्छ क्यों समझा? अपने राजा को वापस लाने की बात सबसे पहले हमने ही नहीं उठाई थी[c]?” लेकिन यहूदा के लोगों की बातें इस्राएल के लोगों की बातों से अधिक कठोर थीं[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “राजा में मेरे दस हाथ हैं।” यह एक मुहावरा है जिसका अर्थ दस हिस्से या दावे हैं—संभवतः यहूदा के मुकाबले दस उत्तरी गोत्रों के दावे की ओर संकेत है।
    reason: cultural_note
  - marker: b
    text: या, “दाऊद में भी हमारा हिस्सा तुमसे अधिक है।” इब्रानी कथन संक्षिप्त है, पर तुलना अधिक दावे या हिस्से की है।
    reason: lexical_alternative
  - marker: c
    text: या, “अपने राजा को वापस लाने का प्रस्ताव सबसे पहले हमारा ही नहीं था?”
    reason: alternative_reading
  - marker: d
    text: या, “यहूदा के लोगों की बातें इस्राएल के लोगों की बातों से अधिक तीखी/प्रबल थीं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל / אִישׁ יְהוּדָה
  choice: इस्राएल के लोग / यहूदा के लोग
  rationale: यहाँ एकवचन אִישׁ सामूहिक और प्रतिनिधिक अर्थ में प्रयुक्त है। हिन्दी में बहुवचन समूहों के विवाद को स्वाभाविक रूप से व्यक्त करता है और पद के अंतिम वाक्य के सामूहिक आशय के अनुरूप है।
- source_word: עֶשֶׂר יָדוֹת לִי בַמֶּלֶךְ
  choice: राजा पर हमारा दस हिस्सों का अधिकार है
  rationale: יָדוֹת का शाब्दिक अर्थ ‘हाथ’ है, पर इस मुहावरे में वह हिस्से या दावे को दर्शाता है। यह अनुवाद दस उत्तरी गोत्रों के दावे को स्पष्ट करता है।
- source_word: וְגַם בְּדָוִד אֲנִי מִמְּךָ
  choice: दाऊद पर भी हमारा दावा तुमसे बढ़कर है
  rationale: इब्रानी वाक्यांश संक्षिप्त और तुलनात्मक है। प्रसंग सामान्य श्रेष्ठता का नहीं, दाऊद पर अधिक हिस्से या अधिकार के दावे का है।
- source_word: הֱקִלֹּתַנִי
  choice: तुमने हमें इतना तुच्छ क्यों समझा
  rationale: हिफ़ील रूप किसी को हल्का, महत्वहीन या तुच्छ मानकर व्यवहार करने का भाव देता है। ‘तुच्छ समझा’ आधुनिक हिन्दी में अपमान और उपेक्षा दोनों को व्यक्त करता है।
- source_word: וְלֹא הָיָה דְבָרִי רִאשׁוֹן לִי לְהָשִׁיב אֶת מַלְכִּי
  choice: अपने राजा को वापस लाने की बात सबसे पहले हमने ही नहीं उठाई थी?
  rationale: דָּבָר का अर्थ ‘बात’, ‘वचन’ या ‘प्रस्ताव’ हो सकता है। कठिन और संक्षिप्त इब्रानी वाक्य का मुख्य आशय राजा की वापसी का विषय पहले उठाने का दावा है।
- source_word: מַלְכִּי
  choice: अपने राजा
  rationale: प्रथम पुरुष संबंधसूचक प्रत्यय को समूह-वाचक हिन्दी कथन में ‘अपने’ द्वारा सुरक्षित रखा गया है; इससे राजा के प्रति निष्ठा और निजी दावे का बल बना रहता है।
- source_word: וַיִּקֶשׁ דְּבַר אִישׁ יְהוּדָה מִדְּבַר אִישׁ יִשְׂרָאֵל
  choice: यहूदा के लोगों की बातें इस्राएल के लोगों की बातों से अधिक कठोर थीं
  rationale: קשה यहाँ वाणी की कठोरता, तीव्रता या उग्रता बताता है। ‘अधिक कठोर’ मूल तुलना को बिना अनावश्यक व्याख्या के बनाए रखता है।
