translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक-पाठ के योग्य रूप अपनाया गया है। समूहों के लिए बहुवचन और संवाद में ‘हम/तुम’ का प्रयोग किया गया है, क्योंकि इब्रानी एकवचन यहाँ सामूहिक प्रतिनिधिक अर्थ रखता है। कठिन इब्रानी मुहावरों को मुख्य पाठ में अर्थपूर्ण हिन्दी में व्यक्त करके शाब्दिक रूप और वैकल्पिक अर्थ पादटिप्पणियों में दिए गए हैं।
