base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/021.yaml
  text: For your servant knows that I have sinned[a]. And look, I have come today as the first of all the house of Joseph[b] to come down to meet my lord the king.
translation:
  language: hi
  text: क्योंकि आपका सेवक जानता है कि मैंने पाप किया है। और देखिए, आज मैं यूसुफ के पूरे घराने[a][b] में सबसे पहले अपने प्रभु राजा से मिलने नीचे आया हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “यूसुफ का घराना” यूसुफ से निकले गोत्रों, विशेषकर एप्रैम और मनश्शे से जुड़े उत्तरी गोत्र-समूहों, की ओर संकेत करता है।
    reason: cultural_note
  - marker: b
    text: या, “यूसुफ के पूरे घराने में से।” इब्रानी संरचना का अर्थ यह भी समझा जा सकता है कि वह यूसुफ के पूरे समूह में से राजा से मिलने नीचे आने वाला पहला व्यक्ति था।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יָדַע עַבְדְּךָ
  choice: क्योंकि आपका सेवक जानता है
  rationale: כִּי यहाँ पिछली विनती का कारण प्रस्तुत करता है; राजकीय संबोधन में עַבְדְּךָ के विनम्र आत्मनिर्देश को ‘आपका सेवक’ स्वाभाविक रूप से व्यक्त करता है। पूर्ण क्रिया יָדַע वर्तमान बोध की अवस्था बताती है।
- source_word: כִּי אֲנִי חָטָאתִי
  choice: कि मैंने पाप किया है
  rationale: חטא के नैतिक और धार्मिक भार को ‘पाप किया’ से बनाए रखा गया है; हिंदी पूर्ण काल अतीत के कार्य की वर्तमान स्वीकारोक्ति को व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: और देखिए
  rationale: यह ध्यान आकर्षित करने वाला सूचक है। ‘देखिए’ आधुनिक, आदरसूचक और प्रसंगानुकूल है, जबकि अत्यधिक पुरातन शैली से बचता है।
- source_word: בָאתִי הַיּוֹם רִאשׁוֹן
  choice: आज ... मैं ही पहला हूँ ... नीचे आया हूँ
  rationale: בָאתִי को वक्ता की वर्तमान उपस्थिति के परिणाम सहित ‘आया हूँ’ कहा गया है। ‘मैं ही पहला हूँ’ רִאשׁוֹן के विधेयात्मक और बलात्मक अर्थ को स्वाभाविक हिंदी में रखता है।
- source_word: לְכָל בֵּית יוֹסֵף
  choice: यूसुफ के पूरे घराने में से
  rationale: לְ की यहाँ कुछ अस्पष्ट संरचना को समूह के भीतर प्रथम होने के अर्थ में समझा गया है। ‘में से’ इस आशय को स्पष्ट करता है, जबकि वैकल्पिक संबंध को पादटिप्पणी में रखा गया है।
- source_word: בֵּית יוֹסֵף
  choice: यूसुफ का घराना
  rationale: जनजातीय-सामूहिक पदनाम को मुख्य पाठ में यथासंभव सीधे रूप में रखा गया है; उसका ऐतिहासिक संकेत पादटिप्पणी में समझाया गया है।
- source_word: לָרֶדֶת לִקְרַאת אֲדֹנִי הַמֶּלֶךְ
  choice: अपने प्रभु राजा से मिलने नीचे आया हूँ
  rationale: לָרֶדֶת की स्थलाकृतिक दिशा ‘नीचे’ से सुरक्षित है और לִקְרַאת को उद्देश्यसूचक ‘से मिलने’ कहा गया है। दोहरे हिंदी infinitive की अस्वाभाविकता से बचने के लिए इसे मुख्य क्रिया के साथ जोड़ा गया है।
