base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/010.yaml
  text: And all the people were disputing throughout all the tribes of Israel[a], saying, “The king delivered us from the hand of our enemies, and he rescued us from the hand of the Philistines[c][b], but now he has fled from the land because of Absalom.”
translation:
  language: hi
  text: और इस्राएल के सभी गोत्रों में सब लोग आपस में विवाद कर रहे थे[a]। वे कह रहे थे, “राजा ने हमें हमारे शत्रुओं के हाथ से छुड़ाया और पलिश्तियों के हाथ से भी बचाया[b], लेकिन अब वह अबशालोम के कारण देश से भाग गया है[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आपस में बहस कर रहे थे” अथवा “मतभेद में थे।” इब्रानी शब्द केवल साधारण बातचीत नहीं, बल्कि गोत्रों में फैले विवाद या विचार-विमर्श का संकेत देता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हमारे शत्रुओं के हाथ से” और “पलिश्तियों के हाथ से।” यहाँ “हाथ” किसी की शक्ति या अधिकार का इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: या “अबशालोम से दूर भाग गया है” अथवा “अबशालोम के सामने से भाग गया है।” इब्रानी पदबंध अबशालोम के कारण या उससे हटकर भागने का भाव दे सकता है।
    reason: lexical_alternative
