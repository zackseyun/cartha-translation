  yaml_path: translation/ot/2_samuel/019/041.yaml
  text: Then the king crossed over to Gilgal[a], and Kimham crossed over with him. And all the people of Judah escorted the king across, and also half the people of Israel.
translation:
  language: hi
  text: तब राजा पार होकर गिलगाल पहुँचा, और किम्हाम भी उसके साथ पार हुआ। यहूदा के सभी लोगों ने राजा को पार पहुँचाया,[a] और इस्राएल के आधे लोगों ने भी ऐसा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राजा को पार ले गए।” इस प्रसंग में इब्रानी क्रिया प्रत्यक्ष कर्म के साथ कारक अर्थ भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: पार होकर ... पहुँचा
  rationale: यह क्रिया प्रसंग में यरदन पार करने को व्यक्त करती है; गंतव्यसूचक הַגִּלְגָּלָה के साथ यह स्वाभाविक हिन्दी में गति और पहुँचने, दोनों को स्पष्ट करती है।
- source_word: הַגִּלְגָּלָה
  choice: गिलगाल पहुँचा
  rationale: स्थान-नाम के अंत का दिशासूचक ה गिलगाल की ओर गति बताता है; हिन्दी में ‘गिलगाल पहुँचा’ सहज है।
- source_word: וְכִמְהָן
  choice: और किम्हाम
  rationale: व्यक्तिनाम का हिन्दी लिप्यंतरण किया गया है।
- source_word: עָבַר עִמּוֹ
  choice: उसके साथ पार हुआ
  rationale: राजा के लिए प्रयुक्त उसी पार करने की क्रिया को दोहराकर कथात्मक संबंध बनाए रखा गया है।
- source_word: וְכָל עַם יְהוּדָה
  choice: यहूदा के सभी लोग
  rationale: यह पद यहूदा के लोगों या समर्थकों को सामूहिक रूप से दर्शाता है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וַיַּעַבְרוּ אֶת־הַמֶּלֶךְ
  choice: राजा को पार पहुँचाया
  rationale: प्रत्यक्ष कर्म के साथ עבר यहाँ सकर्मक/कारक अर्थ रख सकता है—लोग राजा को नदी के पार ले गए या पहुँचाने में सहभागी हुए।
- source_word: וְגַם
  choice: और ... भी
  rationale: अतिरिक्त समूह को जोड़ने वाला बल हिन्दी की स्वाभाविक युग्मित रचना से व्यक्त किया गया है।
- source_word: חֲצִי עַם יִשְׂרָאֵל
  choice: इस्राएल के आधे लोग
  rationale: मात्रात्मक अर्थ और यहूदा तथा इस्राएल के बीच कथात्मक भेद दोनों सुरक्षित रहते हैं।
