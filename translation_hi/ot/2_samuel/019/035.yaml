  text: וַ/יֹּ֥אמֶר בַּרְזִלַּ֖י אֶל הַ/מֶּ֑לֶךְ כַּ/מָּ֗ה יְמֵי֙ שְׁנֵ֣י חַיַּ֔/י כִּי אֶעֱלֶ֥ה אֶת הַ/מֶּ֖לֶךְ יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/035.yaml
  text: Barzillai said to the king[a], “How many are the days of the years of my life, that I should go up with the king to Jerusalem?”
translation:
  language: hi
  text: बर्जिल्लै ने राजा से कहा, “मेरे जीवन के वर्षों के दिन ही कितने हैं कि मैं राजा के साथ यरूशलेम जाऊँ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने…कहा
  rationale: हिब्रू कथा-वर्णन में यह सामान्य कथात्मक क्रिया है; आधुनिक हिन्दी में ‘ने…कहा’ इसका स्वाभाविक रूप है।
- source_word: בַּרְזִלַּי
  choice: बर्जिल्लै
  rationale: व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: אֶל הַמֶּלֶךְ
  choice: राजा से
  rationale: मूल पाठ में उपाधि ‘राजा’ है, ‘राजा दाऊद’ नहीं; हिन्दी में बोलने के प्रसंग में ‘राजा से कहा’ स्वाभाविक है।
- source_word: כַּמָּה
  choice: कितने
  rationale: प्रश्नवाचक शब्द की संख्यात्मकता बनाए रखता है; ‘ही’ से प्रसंग का आलंकारिक बल स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: יְמֵי שְׁנֵי חַיַּי
  choice: मेरे जीवन के वर्षों के दिन
  rationale: मूल की परतदार और जोरदार अभिव्यक्ति को सरल करके केवल ‘मेरे जीवन के वर्ष’ नहीं किया गया, यद्यपि हिन्दी में इसकी असामान्य बनावट भी कुछ हद तक बनी रहती है।
- source_word: כִּי
  choice: कि
  rationale: 'यहाँ आलंकारिक प्रश्न के अगले आशय को जोड़ता है: इतने दिन कहाँ हैं कि वह राजा के साथ जाए।'
- source_word: אֶעֱלֶה
  choice: मैं…जाऊँ
  rationale: सम्भावना या अपेक्षा का भाव हिन्दी के सम्भावनार्थक ‘जाऊँ’ से व्यक्त होता है। यरूशलेम के लिए प्रयुक्त ‘ऊपर जाना’ हिन्दी में यांत्रिक लगता, इसलिए स्वाभाविक ‘जाऊँ’ चुना गया।
- source_word: אֶת הַמֶּלֶךְ
  choice: राजा के साथ
  rationale: इस प्रसंग में אֶת संगति या साथ जाने का भाव देता है, न कि राजा को क्रिया का सीधा कर्म बनाता है।
- source_word: יְרוּשָׁלִָם
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी में प्रचलित बाइबलीय रूप।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘मेरे जीवन के वर्षों के दिन’ मूल हिब्रू की विशिष्ट अभिव्यक्ति को जानबूझकर बनाए रखता है, जबकि वाक्य के शेष भाग को सहज हिन्दी में रखा गया है।
