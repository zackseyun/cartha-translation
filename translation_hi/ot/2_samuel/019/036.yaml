source:
  edition: WLC
  text: בֶּן שְׁמֹנִ֣ים שָׁנָה֩ אָנֹכִ֨י הַ/יּ֜וֹם הַ/אֵדַ֣ע בֵּין ט֣וֹב לְ/רָ֗ע אִם יִטְעַ֤ם עַבְדְּ/ךָ֙ אֶת אֲשֶׁ֤ר אֹכַל֙ וְ/אֶת אֲשֶׁ֣ר אֶשְׁתֶּ֔ה אִם אֶשְׁמַ֣ע ע֔וֹד בְּ/ק֖וֹל שָׁרִ֣ים וְ/שָׁר֑וֹת וְ/לָ/מָּה֩ יִֽהְיֶ֨ה עַבְדְּ/ךָ֥ עוֹד֙ לְ/מַשָּׂ֔א אֶל אֲדֹנִ֖/י הַ/מֶּֽלֶךְ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/036.yaml
  text: I am eighty years old today[a]. Can I still distinguish between good and evil? Can your servant taste what I eat and what I drink? Can I still hear the voice of male singers and female singers? Why then should your servant still be a burden to my lord the king?
translation:
  language: hi
  text: आज मैं अस्सी वर्ष का हूँ। क्या मैं भले और बुरे के बीच भेद कर सकता हूँ?[a] क्या आपका सेवक जो मैं खाता और पीता हूँ, उसका स्वाद चख सकता है? क्या मैं अब भी गायकों और गायिकाओं का स्वर सुन सकता हूँ? फिर आपका सेवक मेरे प्रभु राजा के लिए क्यों बोझ बना रहे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अर्थ “क्या मैं अच्छे और बुरे में अंतर समझ सकता हूँ?” भी हो सकता है। इब्रानी अभिव्यक्ति नैतिक या व्यावहारिक विवेक, दोनों को सूचित कर सकती है; यहाँ वृद्धावस्था और क्षीण होती इंद्रियों का प्रसंग निर्णय-क्षमता के व्यापक अर्थ की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שְׁמֹנִים שָׁנָה אָנֹכִי הַיּוֹם
  choice: आज मैं अस्सी वर्ष का हूँ
  rationale: आयु बताने वाले इब्रानी मुहावरे का स्वाभाविक आधुनिक हिन्दी रूप; הַיּוֹם को स्पष्ट रूप से ‘आज’ रखा गया है।
- source_word: הַאֵדַע בֵּין טוֹב לְרָע
  choice: क्या मैं भले और बुरे के बीच भेद कर सकता हूँ?
  rationale: ידע בין यहाँ पहचानने या विवेक करने की क्षमता बताता है। ‘भले और बुरे’ मूल शब्दों के व्यापक नैतिक तथा व्यावहारिक अर्थ की अस्पष्टता बनाए रखता है।
- source_word: אִם יִטְעַם עַבְדְּךָ אֶת אֲשֶׁר אֹכַל וְאֶת אֲשֶׁר אֶשְׁתֶּה
  choice: क्या आपका सेवक जो खाता-पीता है, उसका स्वाद पहचान सकता है?
  rationale: रूपक नहीं, वृद्धावस्था में स्वाद की क्षीण होती संवेदना अभिप्रेत है। दो समान उपवाक्यों को स्वाभाविक हिन्दी में संक्षिप्त किया गया है।
- source_word: עַבְדְּךָ
  choice: आपका सेवक
  rationale: राजा के सामने विनम्र दरबारी आत्म-संबोधन है; यहाँ ‘दास’ की सामाजिक स्थिति पर बल नहीं है।
- source_word: אֶשְׁמַע עוֹד בְּקוֹל שָׁרִים וְשָׁרוֹת
  choice: क्या मैं अब भी गानेवालों और गानेवालियों की आवाज़ सुन सकता हूँ?
  rationale: עוֹד को ‘अब भी’ और दोनों लिंग-सूचक रूपों को ‘गानेवालों और गानेवालियों’ द्वारा सुरक्षित रखा गया है।
- source_word: לְמַשָּׂא
  choice: बोझ
  rationale: राजा के लिए असुविधा या दायित्व बनने का रूपकात्मक अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: मेरे प्रभु राजा
  rationale: मानवीय राजा के लिए आदरसूचक दरबारी संबोधन को सुरक्षित रखता है।
theological_decisions:
- issue: טוֹב לְרָע का नैतिक या व्यावहारिक आशय
  choice: भले और बुरे के बीच भेद
  alternative: अच्छे और बुरे में अंतर
  rationale: मूल अभिव्यक्ति नैतिक विवेक और सामान्य व्यावहारिक निर्णय—दोनों अर्थ ग्रहण कर सकती है। मुख्य पाठ निकट शब्दावली रखता है और पादटिप्पणी प्रसंगगत व्यापकता बताती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; राजा के प्रति दरबारी आदर बनाए रखा गया है। अलंकारिक प्रश्नों की क्रमिकता और वृद्ध वक्ता की क्षीण होती स्वाद, श्रवण तथा निर्णय-क्षमता स्पष्ट रखी गई है।
