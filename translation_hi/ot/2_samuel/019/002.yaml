  yaml_path: translation/ot/2_samuel/019/002.yaml
  text: And it was reported to Joab, “Look, the king is weeping and mourning over Absalom.”
translation:
  language: hi
  text: योआब को यह समाचार दिया गया, “देखो, राजा अबशालोम के लिए रो रहा है और शोक मना रहा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: यह समाचार दिया गया
  rationale: होफाल रूप सूचना दिए जाने का निष्क्रिय भाव व्यक्त करता है और सूचना देने वाले अज्ञात व्यक्ति को निर्दिष्ट नहीं करता।
- source_word: לְיוֹאָב
  choice: योआब को
  rationale: पूर्वसर्ग और व्यक्तिनाम का स्वाभाविक हिन्दी रूप।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान खींचने वाला संकेतक अव्यय है; “देखो” उसकी तात्कालिकता को आधुनिक, सहज हिन्दी में बनाए रखता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: मूल पाठ दाऊद के नाम के बजाय निश्चित उपाधि का प्रयोग करता है, इसलिए उपाधि ही रखी गई है।
- source_word: בֹּכֶה
  choice: रो रहा है
  rationale: कृदन्त जारी क्रिया को दर्शाता है; हिन्दी का प्रगतिशील रूप इस पक्ष को स्पष्ट रखता है।
- source_word: וַיִּתְאַבֵּל
  choice: और शोक मना रहा है
  rationale: हितपएल रूप शोक करने की क्रिया बताता है; संदर्भ में इसे जारी अवस्था के रूप में पहले कृदन्त के साथ समन्वित किया गया है।
- source_word: עַל אַבְשָׁלֹם
  choice: अबशालोम के लिए
  rationale: शोकसूचक क्रिया के साथ עַל शोक के व्यक्ति अथवा कारण को चिह्नित करता है; “के लिए” स्वाभाविक हिन्दी है और संबंध को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाता।
