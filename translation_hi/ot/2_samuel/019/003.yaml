base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/003.yaml
  text: So the victory on that day was turned into mourning for all the people[a], because on that day the people heard it said[b], “The king is grieved over his son.”
translation:
  language: hi
  text: इस प्रकार उस दिन की विजय सभी लोगों के लिए शोक में बदल गई[a], क्योंकि उस दिन लोगों ने सुना कि[b], “राजा अपने पुत्र के लिए शोकित है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस दिन का छुटकारा सभी लोगों के लिए शोक बन गया।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “लोगों ने सुना, कहते हुए”; यह किसी समाचार या कही जा रही बात को सुनने का इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּשֻׁעָה
  choice: विजय
  rationale: युद्ध के इस संदर्भ में यह शब्द युद्ध में मिली सफलता या छुटकारे को सूचित करता है; आधुनिक हिन्दी में ‘विजय’ सबसे स्वाभाविक है।
- source_word: וַתְּהִי ... לְאֵבֶל
  choice: शोक में बदल गई
  rationale: इब्रानी परिणामसूचक रचना विजय के सामूहिक शोक बन जाने का तीखा उलटाव व्यक्त करती है; यह हिन्दी में स्वाभाविक रूप से उसे सुरक्षित रखती है।
- source_word: אֵבֶל
  choice: शोक
  rationale: यह सार्वजनिक या सामूहिक मातम को सूचित करता है; ‘शोक’ वर्तमान हिन्दी में गरिमापूर्ण और संदर्भानुकूल है।
- source_word: הָעָם
  choice: लोगों
  rationale: यद्यपि संदर्भ में दाऊद के योद्धा सम्मिलित हैं, मूल शब्द सामान्यतः ‘लोग’ है; इसलिए स्रोत की व्यापकता बनाए रखी गई है।
- source_word: כִּי שָׁמַע ... לֵאמֹר
  choice: क्योंकि ... लोगों ने यह कहते सुना
  rationale: मूल की ‘सुना, कहते हुए’ रिपोर्टसूचक इब्रानी रचना को निकटता से रखते हुए यह हिन्दी में समझने योग्य है।
- source_word: נֶעֱצַב
  choice: शोकित है
  rationale: निफ़अल रूप पीड़ा या शोक की अवस्था बताता है; ‘शोकित है’ राजा के पुत्र-वियोग की गंभीरता व्यक्त करता है।
- source_word: עַל בְּנוֹ
  choice: अपने पुत्र के कारण
  rationale: यहाँ עַל शोक के कारण या विषय को चिह्नित करता है; ‘के कारण’ स्वाभाविक हिन्दी है और संबंध को स्पष्ट रखता है।
