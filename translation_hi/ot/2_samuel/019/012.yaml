base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/012.yaml
  text: And King David sent to Zadok and to Abiathar the priests[a], saying, “Speak to the elders of Judah, saying, ‘Why should you be the last to bring the king back to his house, when the word of all Israel has come to the king, to his house?’”
translation:
  language: hi
  text: 'राजा दाऊद ने याजकों सादोक और एब्यातार के पास यह संदेश भेजा: “यहूदा के पुरनियों से कहो, ‘राजा को उसके घर वापस लाने में तुम सबसे पीछे क्यों रहो? समस्त इस्राएल की बात राजा तक, उसके घर तक पहुँच चुकी है[a]।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समस्त इस्राएल का संदेश/प्रस्ताव राजा तक, उसके घर तक पहुँच चुका है।” इब्रानी में “बात” का अर्थ व्यापक है और इससे दाऊद को वापस लाने के विषय में गोत्रों का संदेश, प्रस्ताव या निवेदन अभिप्रेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח אֶל
  choice: के पास यह संदेश भेजा
  rationale: यहाँ राजा ने याजकों को बुलाया नहीं, बल्कि उनके माध्यम से बात पहुँचाने के लिए संदेश भेजा; यह स्वाभाविक हिन्दी में क्रिया का आशय स्पष्ट करता है।
- source_word: הַמֶּלֶךְ דָּוִד
  choice: राजा दाऊद
  rationale: हिन्दी में उपाधि और नाम का स्वाभाविक तथा गरिमापूर्ण क्रम।
- source_word: הַכֹּהֲנִים
  choice: याजकों
  rationale: सादोक और एब्यातार के धार्मिक पद का सीधा बहुवचन रूप।
- source_word: זִקְנֵי יְהוּדָה
  choice: यहूदा के पुरनियों
  rationale: ‘पुरनिये’ इस्राएली समुदाय के मान्य वरिष्ठ अगुवों और प्रतिनिधियों के लिए प्रचलित बाइबलीय हिन्दी पद है।
- source_word: לָמָּה תִהְיוּ אַחֲרֹנִים
  choice: तुम सबसे पीछे क्यों रहो?
  rationale: अपूर्ण क्रिया के भावी/प्रेरक और आलंकारिक प्रश्न के बल को सहज हिन्दी में बनाए रखता है।
- source_word: לְהָשִׁיב אֶת־הַמֶּלֶךְ
  choice: राजा को ... वापस लाने में
  rationale: हिफ़ील रूप राजा को स्वयं लौटने देने के बजाय उसे वापस लाने के कारक अर्थ को व्यक्त करता है।
- source_word: אֶל־בֵּיתוֹ
  choice: उसके घर
  rationale: ‘घर’ मूल शब्द की व्यापकता बनाए रखता है; ‘महल’ कहना अनावश्यक रूप से अधिक विशिष्ट होता।
- source_word: וּדְבַר כָּל־יִשְׂרָאֵל
  choice: समस्त इस्राएल की बात
  rationale: דבר की व्यापक अर्थ-सीमा—बात, संदेश, प्रस्ताव या निवेदन—को किसी एक अर्थ में सीमित नहीं करता।
- source_word: בָּא אֶל־הַמֶּלֶךְ אֶל־בֵּיתוֹ
  choice: राजा के पास, उसके घर तक पहुँच चुकी है
  rationale: पूर्ण क्रिया की पहले से घट चुकी स्थिति और कठिन पुनरुक्ति दोनों को पठनीय हिन्दी में सुरक्षित रखता है।
