base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/026.yaml
  text: And when he came to Jerusalem to meet the king[a], the king said to him, “Why did you not go with me, Mephibosheth?”
translation:
  language: hi
  text: जब वह राजा से मिलने यरूशलेम आया, तब राजा ने उससे कहा, “मपीबोशेत, तुम मेरे साथ क्यों नहीं गए?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: जब... तब
  rationale: इब्रानी कथात्मक सूत्र यहाँ नए दृश्य का समय-संबंधी परिचय देता है; हिंदी में ‘जब... तब’ इसे स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: בָא יְרוּשָׁלַם
  choice: वह यरूशलेम आया
  rationale: בוא का सामान्य अर्थ ‘आना’ है; पद में पुरुष का उल्लेख पिछले संदर्भ से समझ में आता है।
- source_word: לִקְרַאת הַמֶּלֶךְ
  choice: राजा से मिलने
  rationale: לִקְרַאת किसी के सामने जाकर उससे मिलने का भाव देता है; ‘से मिलने’ आधुनिक हिंदी में सीधा और स्वाभाविक है।
- source_word: וַיֹּאמֶר לוֹ הַמֶּלֶךְ
  choice: राजा ने उससे कहा
  rationale: इब्रानी में आए स्पष्ट कर्ता ‘राजा’ और परोक्ष कर्म ‘उससे’ दोनों सुरक्षित रखे गए हैं।
- source_word: לָמָּה לֹא הָלַכְתָּ עִמִּי
  choice: तुम मेरे साथ क्यों नहीं गए
  rationale: הלך का मूल भाव ‘जाना’ है; इसलिए अधिक मुहावरेदार संभावित ‘आए’ के बजाय मूल दृष्टिकोण को बनाए रखते हुए ‘गए’ चुना गया है।
- source_word: מְפִיבֹשֶׁת
  choice: मपीबोशेत
  rationale: नाम का देवनागरी लिप्यंतरण इब्रानी उच्चारण के निकट रखा गया है।
