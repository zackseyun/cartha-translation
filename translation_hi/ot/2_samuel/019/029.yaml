source:
  edition: WLC
  text: כִּי֩ לֹ֨א הָיָ֜ה כָּל בֵּ֣ית אָבִ֗/י כִּ֤י אִם אַנְשֵׁי מָ֨וֶת֙ לַ/אדֹנִ֣/י הַ/מֶּ֔לֶךְ וַ/תָּ֨שֶׁת֙ אֶֽת עַבְדְּ/ךָ֔ בְּ/אֹכְלֵ֖י שֻׁלְחָנֶ֑/ךָ וּ/מַה יֶּשׁ לִ֥/י עוֹד֙ צְדָקָ֔ה וְ/לִ/זְעֹ֥ק ע֖וֹד אֶל הַ/מֶּֽלֶךְ־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/029.yaml
  text: For all my father's house were nothing but men deserving death before my lord the king[a], yet you set your servant among those who eat at your table. So what further right do I have[b], that I should cry out any more to the king?
translation:
  language: hi
  text: क्योंकि मेरे पिता का पूरा घराना मेरे प्रभु राजा की दृष्टि में मृत्यु-दण्ड के योग्य लोगों के सिवा कुछ न था[a]; फिर भी आपने अपने दास को अपनी मेज़ पर भोजन करनेवालों में स्थान दिया। इसलिए मेरा अब और क्या न्यायोचित दावा है[b] कि मैं राजा से फिर दुहाई दूँ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘मृत्यु के लोग’; अर्थात ऐसे लोग जो मृत्यु-दण्ड के अधीन या उसके योग्य थे।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘न्यायोचित दावा’ इब्रानी त्सेदाकाह का अनुवाद है। इस प्रसंग में इसका अर्थ मुख्यतः व्यक्तिगत नैतिक धार्मिकता नहीं, बल्कि न्यायसंगत दावा या अधिकार है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי לֹא הָיָה ... כִּי אִם
  choice: के सिवा कुछ न था
  rationale: यह रचना प्रबल सीमितता व्यक्त करती है; हिंदी में यह वाक्यांश उसी बल को स्वाभाविक ढंग से प्रकट करता है।
- source_word: כָּל בֵּית אָבִי
  choice: मेरे पिता का पूरा घराना
  rationale: ‘घराना’ यहाँ विस्तृत परिवार और राजवंशीय संबंध दोनों को सहज रूप से व्यक्त करता है।
- source_word: אַנְשֵׁי מָוֶת
  choice: मृत्यु-दण्ड के योग्य लोग
  rationale: यह मुहावरा पहले से मरे हुए लोगों का नहीं, बल्कि प्राणदण्ड के पात्र या उसके अधीन लोगों का संकेत करता है।
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: मेरे प्रभु राजा की दृष्टि में
  rationale: संबंधसूचक ל यहाँ राजा के न्याय या आकलन के सम्मुख उनकी स्थिति बताता है।
- source_word: וַתָּשֶׁת
  choice: फिर भी आपने ... स्थान दिया
  rationale: मूल क्रिया ‘रखना/स्थापित करना’ है; संदर्भ में ‘स्थान दिया’ स्वाभाविक है और ‘फिर भी’ पहले कथन के साथ निहित विरोध स्पष्ट करता है।
- source_word: עַבְדְּךָ
  choice: अपने दास
  rationale: दरबारी विनम्र आत्म-संबोधन को बनाए रखने के लिए ‘दास’ चुना गया है।
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  choice: अपनी मेज़ पर भोजन करनेवालों में
  rationale: यह राजा के आश्रित अथवा सम्मानित सहभोजियों में सम्मिलित किए जाने की सामाजिक छवि को सुरक्षित रखता है।
- source_word: וּמַה יֶּשׁ לִי עוֹד צְדָקָה
  choice: मेरा अब और क्या न्यायोचित दावा है
  rationale: צְדָקָה यहाँ व्यक्तिगत नैतिक धार्मिकता से अधिक न्यायसंगत अधिकार या दावे के अर्थ में है; ‘न्यायोचित दावा’ उस अर्थ को स्पष्ट रखते हुए मूल अवधारणा से जुड़ा है।
- source_word: וְלִזְעֹק עוֹד אֶל הַמֶּלֶךְ
  choice: कि मैं राजा से फिर दुहाई दूँ
  rationale: זעק की पुकार, विनती और शिकायत की भावभूमि को ‘दुहाई देना’ संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
