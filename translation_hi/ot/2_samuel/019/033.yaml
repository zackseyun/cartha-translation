  edition: WLC
  text: וּ/בַרְזִלַּי֙ זָקֵ֣ן מְאֹ֔ד בֶּן שְׁמֹנִ֖ים שָׁנָ֑ה וְ/הֽוּא כִלְכַּ֤ל אֶת הַ/מֶּ֨לֶךְ֙ בְּ/שִׁיבָת֣/וֹ בְ/מַחֲנַ֔יִם כִּֽי אִ֛ישׁ גָּד֥וֹל ה֖וּא מְאֹֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/033.yaml
  text: Barzillai was very old[a], eighty years old, and he had provided for the king during his stay in Mahanaim, for he was a very wealthy man.
translation:
  language: hi
  text: बरज़िल्लै बहुत बूढ़ा था—उसकी आयु अस्सी वर्ष थी। जब राजा महनैम में ठहरा हुआ था, तब बरज़िल्लै ने उसकी आवश्यकताएँ पूरी की थीं, क्योंकि वह बहुत धनी व्यक्ति था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह बहुत प्रतिष्ठित व्यक्ति था।” इब्रानी में शाब्दिक अर्थ “वह बहुत बड़ा व्यक्ति था” है; यह अभिव्यक्ति धन, प्रतिष्ठा या प्रभाव का बोध करा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן מְאֹד
  choice: बहुत बूढ़ा था
  rationale: यह विधेयात्मक इब्रानी पदबंध आयु की अत्यधिक वृद्धावस्था बताता है; आधुनिक हिन्दी में यह सहज और स्पष्ट है।
- source_word: בֶּן שְׁמֹנִים שָׁנָה
  choice: उसकी आयु अस्सी वर्ष थी
  rationale: इब्रानी मुहावरे ‘अस्सी वर्ष का पुत्र’ का स्वाभाविक हिन्दी रूप।
- source_word: כִלְכַּל אֶת הַמֶּלֶךְ
  choice: राजा की आवश्यकताएँ पूरी की थीं
  rationale: כלכל यहाँ भोजन-सामग्री सहित व्यावहारिक और भौतिक आवश्यकताओं की पूर्ति करने का भाव रखता है।
- source_word: בְּשִׁיבָתוֹ בְמַחֲנַיִם
  choice: जब राजा महनैम में ठहरा हुआ था
  rationale: ישב यहाँ निवास करने या ठहरने के अर्थ में है; सर्वनाम का निकटतम और प्रसंगानुकूल संदर्भ राजा है।
- source_word: אִישׁ גָּדוֹל הוּא מְאֹד
  choice: वह बहुत धनी व्यक्ति था
  rationale: प्रसंग में राजा की आवश्यकताएँ पूरी करने की क्षमता मुख्यतः उसकी प्रचुर संपत्ति की ओर संकेत करती है, यद्यपि मूल अभिव्यक्ति प्रतिष्ठा और प्रभाव को भी समेट सकती है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। लंबे समन्वित इब्रानी वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है। वास्तविक शाब्दिक व्यापकता को पाद-टिप्पणी में सुरक्षित रखा गया है।
