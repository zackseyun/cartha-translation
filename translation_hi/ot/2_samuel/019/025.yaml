  register: भाषा आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और कथात्मक रखी गई है। वाक्य-क्रम को स्वाभाविक हिन्दी के अनुरूप बदला गया है, जबकि उपेक्षित व्यक्तिगत देखभाल के तीनों विवरण और समय-सीमा सुरक्षित रखे गए हैं।
