base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/025.yaml
  text: And Mephibosheth son of Saul came down to meet the king[a]. He had not cared for his feet, nor trimmed his mustache, nor washed his clothes[c][b], from the day the king left until the day he came in peace.
translation:
  language: hi
  text: और शाऊल का पुत्र मपीबोशेत राजा से मिलने नीचे आया। जिस दिन राजा गया था, उस दिन से लेकर उस दिन तक जब वह सकुशल आया,[c] उसने न तो अपने पैरों की देखभाल की थी,[a] न अपनी मूँछ सँवारी थी,[b] और न अपने कपड़े धोए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “उसने अपने पैर नहीं किए।” इसका आशय पैरों की सामान्य देखभाल या उन्हें सँवारने की उपेक्षा से है।
    reason: lexical_alternative
  - marker: b
    text: या “न अपने ऊपरी होंठ के बालों की देखभाल की थी।” इब्रानी शब्द विशेष रूप से ऊपरी होंठ या वहाँ के बालों को सूचित करता है, अनिवार्य रूप से पूरी दाढ़ी को नहीं।
    reason: lexical_alternative
  - marker: c
    text: या “जब वह शांति से आया” अथवा “जब वह सुरक्षित पहुँचा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַד
  choice: नीचे आया
  rationale: क्रिया का मूल अर्थ ‘नीचे जाना/आना’ है; कथा के दृष्टिकोण से राजा से मिलने आते हुए मपीबोशेत के लिए ‘नीचे आया’ स्वाभाविक है।
- source_word: לִקְרַאת הַמֶּלֶךְ
  choice: राजा से मिलने
  rationale: यह इब्रानी पदबंध किसी की ओर जाकर उससे मिलने का भाव व्यक्त करता है।
- source_word: וְלֹא עָשָׂה רַגְלָיו
  choice: उसने ... अपने पैरों की देखभाल नहीं की थी
  rationale: शाब्दिक रूप ‘अपने पैर नहीं किए’ है। ठीक किस प्रकार की देखभाल अभिप्रेत है, यह अनिश्चित होने के कारण व्यापक और स्वाभाविक अभिव्यक्ति रखी गई है।
- source_word: וְלֹא עָשָׂה שְׂפָמוֹ
  choice: न अपनी मूँछ सँवारी थी
  rationale: שָׂפָם ऊपरी होंठ अथवा वहाँ के बालों को सूचित करता है; शोकजनित उपेक्षा के प्रसंग में ‘मूँछ सँवारना’ सटीक और सहज है।
- source_word: וְאֶת בְּגָדָיו לֹא כִבֵּס
  choice: और न अपने कपड़े धोए थे
  rationale: כִבֵּס का सामान्य अर्थ कपड़ों को धोना है; आधुनिक हिन्दी में यह सीधी और स्वाभाविक अभिव्यक्ति है।
- source_word: לְמִן הַיּוֹם לֶכֶת הַמֶּלֶךְ
  choice: जिस दिन राजा गया था, उस दिन से
  rationale: इब्रानी पाठ राजा के जाने के दिन को आरंभ-बिंदु बनाता है; ‘गया’ मूल क्रिया के साधारण स्तर को बनाए रखता है।
- source_word: עַד הַיּוֹם אֲשֶׁר בָּא בְשָׁלוֹם
  choice: उस दिन तक जब वह सकुशल लौटा
  rationale: בְשָׁלוֹם सुरक्षित और कुशल-मंगल अवस्था में आने का भाव दे सकता है। प्रसंग में राजा की वापसी स्पष्ट है; ‘सकुशल लौटा’ हिन्दी में स्वाभाविक है और ‘घर’ जैसी अनुपस्थित सूचना नहीं जोड़ता।
