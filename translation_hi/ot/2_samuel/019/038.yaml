- source_word: עַבְדְּךָ
  choice: आपका सेवक / अपने सेवक
  rationale: राजा के सामने बर्जिल्लै का यह विनम्र आत्म-संदर्भ है; यहाँ ‘सेवक’ दरबारी आदर को ‘दास’ से अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְאָמֻת
  choice: ताकि मैं ... मरूँ
  rationale: अनुरोध के बाद conjunction और imperfect को उद्देश्य के रूप में समझना प्रसंगानुकूल है।
- source_word: בְּעִירִי
  choice: अपने नगर में
  rationale: प्रथम पुरुष स्वामित्व को हिंदी के आत्मवाचक प्रयोग द्वारा स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: עִם קֶבֶר אָבִי וְאִמִּי
  choice: अपने पिता और अपनी माता की कब्र के पास
  rationale: עִם का मूल अर्थ ‘साथ’ है, पर दफनाने के इस प्रसंग में ‘कब्र के पास’ अभिप्रेत स्थान-संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: पर देखिए, ... यहाँ है
  rationale: प्रस्तुतिवाचक बल और बर्जिल्लै के लौटने तथा किम्हाम के जाने के बीच विरोध, दोनों सुरक्षित हैं।
- source_word: כִמְהָם
  choice: किम्हाम
  rationale: व्यक्तिनाम का ध्वन्यात्मक देवनागरी लिप्यंतरण।
- source_word: יַעֲבֹר עִם
  choice: वह ... के साथ पार जाए
  rationale: प्रसंग में imperfect का इच्छार्थक/निवेदनात्मक बल है और ‘पार जाए’ यरदन पार करने की कथा-प्रतिध्वनि बनाए रखता है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: मेरे प्रभु राजा
  rationale: राजा के लिए सम्मानपूर्ण दरबारी संबोधन को सीधे और गरिमापूर्ण हिंदी में रखा गया है।
- source_word: וַעֲשֵׂה לוֹ
  choice: आप उसके लिए ... करें
  rationale: עשה עם ל यहाँ किसी के हित में करने का भाव देता है; ‘उसके लिए’ संभावित नकारात्मक ‘उसके साथ’ से बचाता है।
- source_word: אֵת אֲשֶׁר טוֹב בְּעֵינֶיךָ
  choice: वही ... जो आपकी दृष्टि में अच्छा हो
  rationale: मूल हिब्रू दृष्टि-संबंधी मुहावरे को समझने योग्य हिंदी में सुरक्षित रखा गया है।
