base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/038.yaml
  text: Please let your servant return[a], that I may die in my own city, by the grave of my father and my mother. But here is your servant Kimham; let him cross over with my lord the king[b], and do for him what is good in your eyes.
translation:
  language: hi
  text: कृपया अपने सेवक को लौट जाने दीजिए, ताकि मैं अपने नगर में, अपने पिता और अपनी माता की कब्र के पास मरूँ।[a] पर देखिए, आपका सेवक किम्हाम यहाँ है। वह मेरे प्रभु राजा के साथ पार जाए, और आप उसके लिए वही करें जो आपकी दृष्टि में अच्छा हो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक अर्थ है, ‘मेरे पिता और मेरी माता की कब्र के साथ’; यहाँ भाव संभवतः पारिवारिक कब्र के पास मरने और वहीं दफनाए जाने का है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जो आपको अच्छा लगे।’
    reason: lexical_alternative
