  text: मपीबोशेत ने राजा से कहा, “वह सब कुछ भी ले ले; अब जब मेरे प्रभु राजा सकुशल[a] अपने घर आ गए हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “शांति से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने ... कहा
  rationale: इब्रानी कथा में यह אמר का सामान्य वर्णनात्मक रूप है; आधुनिक हिन्दी में ‘ने ... कहा’ स्वाभाविक है।
- source_word: מְפִיבֹשֶׁת
  choice: मपीबोशेत
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: אֶל הַמֶּלֶךְ
  choice: राजा से
  rationale: मूल में निश्चित उपाधि ‘राजा’ है, दाऊद नाम नहीं; हिन्दी में बोलने की दिशा के लिए ‘राजा से कहा’ स्वाभाविक है।
- source_word: גַּם אֶת הַכֹּל יִקָּח
  choice: वह सब कुछ ही ले ले
  rationale: अपूर्ण क्रिया यहाँ अनुमति अथवा स्वेच्छापूर्ण त्याग का भाव देती है। ‘ही’ גַּם के बल को और ‘सब कुछ’ הַכֹּל की संपूर्णता को व्यक्त करता है।
- source_word: אַחֲרֵי אֲשֶׁר
  choice: क्योंकि
  rationale: शाब्दिक रूप से यह ‘इसके बाद कि’ हो सकता है, पर प्रसंग में मपीबोशेत के त्याग का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में इस कारणात्मक संबंध को स्पष्ट रखता है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: मेरे प्रभु राजा
  rationale: दरबारी आदरसूचक संबोधन को बिना किसी अतिरिक्त धार्मिक अर्थ के सुरक्षित रखा गया है।
- source_word: בָּא ... אֶל בֵּיתוֹ
  choice: अपने घर ... लौट आए हैं
  rationale: मूलतः ‘अपने घर आए हैं’; प्रसंग में राजा की वापसी है, इसलिए ‘लौट आए हैं’ स्वाभाविक और संदर्भानुकूल है।
- source_word: בְּשָׁלוֹם
  choice: कुशल से
  rationale: यहाँ अर्थ सुरक्षित और सकुशल पहुँचने का है। अधिक शाब्दिक विकल्प ‘शान्ति से’ पादटिप्पणी में दिया गया है।
