id: 2SA.19.6
reference: 2 Samuel 19:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּבֹ֥א יוֹאָ֛ב אֶל הַ/מֶּ֖לֶךְ הַ/בָּ֑יִת וַ/יֹּאמֶר֩ הֹבַ֨שְׁתָּ הַ/יּ֜וֹם אֶת פְּנֵ֣י כָל עֲבָדֶ֗י/ךָ הַֽ/מְמַלְּטִ֤ים אֶֽת נַפְשְׁ/ךָ֙ הַ/יּ֔וֹם וְ/אֵ֨ת נֶ֤פֶשׁ בָּנֶ֨י/ךָ֙ וּ/בְנֹתֶ֔י/ךָ וְ/נֶ֣פֶשׁ נָשֶׁ֔י/ךָ וְ/נֶ֖פֶשׁ פִּלַגְשֶֽׁי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/006.yaml
  text: Then Joab came into the house to the king and said[a], “Today you have put to shame all your servants who today saved your life, and the lives of your sons and your daughters[c][b], and the lives of your wives and your concubines.”
translation:
  language: hi
  text: तब योआब घर[a] में राजा के पास आया और कहा, “आज आपने अपने उन सभी सेवकों को लज्जित किया[b] है, जिन्होंने आज आपके प्राण[c], आपके बेटे-बेटियों के प्राण, और आपकी पत्नियों तथा उपपत्नियों के प्राण बचाए हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “घर” से सम्भवतः राजा का निवास या महल अभिप्रेत है।
    reason: cultural_note
  - marker: b
    text: शाब्दिक रूप से, “अपने सभी सेवकों के चेहरों को लज्जित किया।”
    reason: lexical_alternative
  - marker: c
    text: यहाँ “प्राण” के लिए प्रयुक्त हिब्रू शब्द का अर्थ इस प्रसंग में शारीरिक जीवन या जान है, न कि अलग से “आत्मा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּיִת
  choice: घर
  rationale: मूल शब्द का सामान्य अर्थ ‘घर’ है; इस प्रसंग में इससे राजकीय निवास या महल अभिप्रेत हो सकता है, जिसे टिप्पणी में स्पष्ट किया गया है।
- source_word: הֹבַשְׁתָּ אֶת־פְּנֵי
  choice: लज्जित किया
  rationale: हिब्रू में शाब्दिक रूप से ‘चेहरों को लज्जित किया’ है। स्वाभाविक आधुनिक हिन्दी में ‘लज्जित किया’ सार्वजनिक अपमान और कारक भाव दोनों व्यक्त करता है।
- source_word: עֲבָדֶיךָ
  choice: आपके ... सेवकों
  rationale: ‘सेवक’ राजा के अधीन लोगों, राजकर्मियों और योद्धाओं को समेटने वाला व्यापक तथा प्रसंगानुकूल शब्द है।
- source_word: הַמְמַלְּטִים
  choice: जिन्होंने ... बचाए हैं
  rationale: यह क्रिया संकट अथवा मृत्यु से छुड़ाने या बचाने का बोध देती है; यहाँ प्राणरक्षा स्पष्ट रूप से अभिप्रेत है।
- source_word: נֶפֶשׁ
  choice: प्राण
  rationale: इस प्रसंग में शब्द का अर्थ भौतिक जीवन है, कोई पृथक अमूर्त ‘आत्मा’ नहीं। ‘प्राण बचाना’ स्वाभाविक हिन्दी प्रयोग है।
- source_word: פִּלַגְשֶׁיךָ
  choice: आपकी ... उपपत्नियों
  rationale: ‘उपपत्नी’ मान्य किन्तु पत्नी से निम्न सामाजिक दर्जे वाले वैवाहिक/यौन संबंध की ऐतिहासिक श्रेणी को बिना अनावश्यक अपमानजनक रंग के व्यक्त करता है।
- source_word: וַיָּבֹא ... וַיֹּאמֶר
  choice: तब ... आया और कहा
  rationale: यह रूप कथा को क्रमशः आगे बढ़ाता है; ‘तब ... और कहा’ उस कथात्मक प्रवाह को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: पारिवारिक-सामाजिक श्रेणियों का नैतिक मूल्यांकन जोड़े बिना अनुवाद
  choice: पत्नियों तथा उपपत्नियों
  alternative: पत्नियों तथा रखैलों
  rationale: मूल पाठ दोनों सामाजिक श्रेणियों का सीधा उल्लेख करता है। ‘उपपत्नी’ ऐतिहासिक भेद को बनाए रखता है, जबकि ‘रखैल’ आधुनिक हिन्दी में अनावश्यक रूप से अपमानजनक या अवैध संबंध का संकेत दे सकता है।
- issue: נֶפֶשׁ को आत्मा या जीवन के अर्थ में समझना
  choice: प्राण
  alternative: आत्मा
  rationale: यहाँ युद्ध-संकट से दाऊद और उसके परिवार की शारीरिक जान बचाए जाने की बात है; अतः ‘प्राण’ प्रसंगानुकूल है और शरीर-आत्मा संबंधी कोई अतिरिक्त सिद्धान्त आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानसूचक ‘आप’ रखा गया है, क्योंकि योआब राजा से बोल रहा है। भाषा गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज है। मूल की पुनरुक्ति को आंशिक रूप से बनाए रखते हुए ‘प्राण’ को प्रत्येक पारिवारिक समूह के साथ दोहराया गया है।
