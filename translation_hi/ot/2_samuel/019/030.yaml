  text: וַ/יֹּ֤אמֶר ל/וֹ֙ הַ/מֶּ֔לֶךְ לָ֛/מָּה תְּדַבֵּ֥ר ע֖וֹד דְּבָרֶ֑י/ךָ אָמַ֕רְתִּי אַתָּ֣ה וְ/צִיבָ֔א תַּחְלְק֖וּ אֶת הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/030.yaml
  text: 'Then the king said to him[b][a], “Why do you keep speaking of your affairs? I have decided: you and Ziba shall divide the land.”'
translation:
  language: hi
  text: 'तब राजा ने उससे कहा, “तुम अपने मामलों के बारे में और क्यों बोलते हो? मैंने कह दिया है[a]: तुम और सीबा उस भूमि[b] को बाँट लो।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैंने कहा।”
    reason: lexical_alternative
  - marker: b
    text: या “खेत।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... הַמֶּלֶךְ
  choice: तब राजा ने उससे कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम को स्पष्ट करता है। לֹו (‘उससे’) को भी मूल पाठ के अनुसार रखा गया है।
- source_word: תְּדַבֵּר עוֹד דְּבָרֶיךָ
  choice: तुम अपने मामले के बारे में और क्यों बोलते हो?
  rationale: עוֹד आगे या और बोलते रहने का भाव देता है, जबकि דְּבָרֶיךָ यहाँ विवाद से जुड़े ‘मामले’ को सूचित कर सकता है। यह अनुवाद राजा की अधीरता को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: אָמַרְתִּי
  choice: मैंने कह दिया है
  rationale: रूपतः इसका अर्थ ‘मैंने कहा’ है; प्रसंग में पूर्णताबोधक ‘कह दिया है’ राजा के घोषित और निर्णायक आदेश का बल भी बनाए रखता है, पर इसे केवल ‘मैंने निर्णय किया है’ कहकर अर्थ को संकीर्ण नहीं करता।
- source_word: אַתָּה וְצִיבָא
  choice: तुम और सीबा
  rationale: सम्बोधित व्यक्ति के लिए स्पष्ट सर्वनाम रखा गया है और צִיבָא का प्रचलित हिन्दी लिप्यंतरण ‘सीबा’ लिया गया है।
- source_word: תַּחְלְקוּ
  choice: बाँट लो
  rationale: यह अपूर्ण क्रिया यहाँ राजा के आदेश अथवा निर्णय को व्यक्त करती है। ‘बाँट लो’ आधुनिक हिन्दी में स्वाभाविक और अधिकारपूर्ण निर्देश है।
- source_word: הַשָּׂדֶה
  choice: भूमि
  rationale: शब्द का मूल अर्थ ‘खेत’ है, पर संपत्ति-विवाद के प्रसंग में यह भू-संपत्ति के व्यापक अर्थ में प्रयुक्त हो सकता है; ‘भूमि’ उस संदर्भ को स्वाभाविक रूप से व्यक्त करती है और शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। राजा के कथन का अधिकारपूर्ण और कुछ अधीर स्वर बनाए रखा गया है; साथ ही אָמַרְתִּי और הַשָּׂדֶה की शब्दार्थगत व्यापकता पादटिप्पणियों में सुरक्षित रखी गई है।
