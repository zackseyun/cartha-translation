  text: לְ/אַֽהֲבָה֙ אֶת שֹׂ֣נְאֶ֔י/ךָ וְ/לִ/שְׂנֹ֖א אֶת אֹהֲבֶ֑י/ךָ כִּ֣י הִגַּ֣דְתָּ הַ/יּ֗וֹם כִּ֣י אֵ֤ין לְ/ךָ֙ שָׂרִ֣ים וַ/עֲבָדִ֔ים כִּ֣י יָדַ֣עְתִּי הַ/יּ֗וֹם כִּ֠י לא אַבְשָׁל֥וֹם חַי֙ וְ/כֻלָּ֤/נוּ הַ/יּוֹם֙ מֵתִ֔ים כִּי אָ֖ז יָשָׁ֥ר בְּ/עֵינֶֽי/ךָ־־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/007.yaml
  text: to love those who hate you and to hate those who love you[a]. For you have made it clear today that commanders and servants mean nothing to you; for I know today that if Absalom were alive and all of us were dead today[b], then it would be right in your eyes.
translation:
  language: hi
  text: जो आपसे बैर रखते हैं उनसे प्रेम करके और जो आपसे प्रेम करते हैं उनसे बैर रखकर। क्योंकि आज आपने स्पष्ट कर दिया है कि सेनापतियों और सेवकों का आपके लिए कोई महत्त्व नहीं है[a]। आज मैं जानता हूँ कि यदि अबशालोम जीवित होता और आज हम सब मर गए होते[b], तो यह आपकी दृष्टि में ठीक होता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “आपने आज बता दिया है कि आपके लिए न सेनापति हैं, न सेवक।” इस इब्रानी मुहावरे का आशय है कि आपकी दृष्टि में उनका कोई महत्त्व नहीं है।'
    reason: lexical_alternative
  - marker: b
    text: 'इसका अनुवाद यह भी हो सकता है: “काश, अबशालोम जीवित होता और आज हम सब मर गए होते।” योआब के शब्द दाऊद के कथन की सीधी रिपोर्ट नहीं, बल्कि एक तीखा प्रतितथ्यात्मक आरोप हैं।'
    reason: alternative_reading
lexical_decisions:
- source_word: לְאַהֲבָה אֶת שֹׂנְאֶיךָ
  choice: अपने बैरियों से प्रेम करके
  rationale: आरंभिक उद्देश्य/क्रियार्थक रूप पिछले वाक्य के आरोप को आगे बढ़ाता है। ‘बैरियों’ से कृदंत का प्रसंगगत अर्थ और ‘प्रेम’ से मूल विरोध सुरक्षित रहता है।
- source_word: וְלִשְׂנֹא אֶת אֹהֲבֶיךָ
  choice: और अपने प्रेम करनेवालों से बैर रखकर
  rationale: पहले खंड के समानांतर रचना रखी गई है और ‘प्रेम करनेवालों’ द्वारा मूल कृदंत का क्रियात्मक बल बचाया गया है।
- source_word: הִגַּדְתָּ הַיּוֹם
  choice: आज आपने साफ़ कर दिया है
  rationale: यहाँ क्रिया केवल मौखिक घोषणा नहीं, बल्कि दाऊद के व्यवहार से प्रकट हुई बात बताती है।
- source_word: שָׂרִים וַעֲבָדִים
  choice: सेनापति और सेवक
  rationale: सैन्य-राजकीय प्रसंग में שָׂרִים के लिए ‘सेनापति’ उपयुक्त है; עֲבָדִים राजकीय सेवा में लगे लोगों को व्यापक रूप से दर्शाता है।
- source_word: אֵין לְךָ שָׂרִים וַעֲבָדִים
  choice: सेनापति और सेवक आपके लिए कोई मायने नहीं रखते
  rationale: शाब्दिक ‘आपके लिए सेनापति और सेवक नहीं हैं’ का आशय उनके अस्तित्व का निषेध नहीं, बल्कि दाऊद की दृष्टि में उनका मूल्य न होना है।
- source_word: יָדַעְתִּי הַיּוֹם
  choice: आज मैं जान गया हूँ
  rationale: पूर्ण क्रिया आज की घटनाओं से निकले योआब के वर्तमान निष्कर्ष को व्यक्त करती है।
- source_word: לֹא אַבְשָׁלוֹם חַי וְכֻלָּנוּ הַיּוֹם מֵתִים
  choice: यदि अबशालोम जीवित होता और आज हम सब मारे गए होते
  rationale: प्रसंग में यह तीखा प्रतितथ्यात्मक आरोप है। हिंदी की ‘यदि...होता...होते’ रचना इसे स्वाभाविक रूप से व्यक्त करती है।
- source_word: יָשָׁר בְּעֵינֶיךָ
  choice: यह आपकी दृष्टि में ठीक होता
  rationale: ‘दृष्टि में ठीक’ मूल इब्रानी मुहावरे और उसके नैतिक मूल्यांकन दोनों को बनाए रखता है।
theological_decisions:
- issue: दाऊद की मनःस्थिति के विषय में योआब का आरोप
  choice: कथन को योआब के तीखे प्रतितथ्यात्मक आरोप के रूप में रखा गया है
  alternative: इसे दाऊद की कही हुई बात या उसके वास्तविक अभिप्राय की निष्पक्ष रिपोर्ट मानना
  rationale: पाठ में योआब दाऊद के शोक से निष्कर्ष निकालकर उसे झकझोर रहा है; अनुवाद को आरोप की तीव्रता बचानी चाहिए, पर उसे दाऊद का प्रत्यक्ष कथन नहीं बनाना चाहिए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी रखी गई है। पद का आरंभ पिछले पद से जुड़ी क्रियात्मक रचना होने के कारण ‘करके’ के साथ रखा गया है। दाऊद के लिए आदरसूचक ‘आप’ प्रयुक्त है, जबकि आरोप की कठोरता को नरम नहीं किया गया।
