  text: And he swayed the heart of every man of Judah as one man, and they sent word to the king, “Return, you and all your servants.”
translation:
  language: hi
  text: उसने यहूदा के सभी पुरुषों का मन इस तरह अपनी ओर कर लिया, मानो वे एक ही मनुष्य हों। तब उन्होंने राजा के पास संदेश भेजा, “आप अपने सभी सेवकों समेत लौट आइए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּט אֶת־לְבַב
  choice: मन इस तरह अपनी ओर कर लिया
  rationale: मुहावरे का अर्थ किसी के मन को अपनी ओर मोड़ना या समर्थन प्राप्त करना है। यह स्वाभाविक हिन्दी में प्रभाव और सहमति—दोनों भावों को व्यक्त करता है।
- source_word: כְּאִישׁ אֶחָד
  choice: मानो वे एक ही मनुष्य हों
  rationale: इब्रानी उपमा को बनाए रखते हुए यह उनकी एकमत प्रतिक्रिया को व्यक्त करता है।
- source_word: שׁוּב אַתָּה וְכָל־עֲבָדֶיךָ
  choice: आप अपने सभी सेवकों समेत लौट आइए
  rationale: राजा को संबोधित आज्ञार्थक क्रिया का सम्मानपूर्ण और स्वाभाविक हिन्दी रूप; 'सेवक' עֲבָדִים के राजकीय आश्रितों/अधिकारियों के व्यापक अर्थ को खुला रखता है।
theological_decisions:
- issue: וַיַּט का कर्ता
  choice: सर्वनाम ‘उसने’ को बनाए रखा
  alternative: पिछले संदर्भ के आधार पर कर्ता का नाम स्पष्ट करना
  rationale: मूल पद में कर्ता नाम से नहीं दिया गया है; इसलिए पाठ की संदर्भाधीनता और वास्तविक अस्पष्टता को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; राजकीय संबोधन में सम्मानसूचक ‘आप’ और ‘आइए’ का प्रयोग। भाषा सहज किंतु गरिमापूर्ण रखी गई है।
