  yaml_path: translation/ot/2_samuel/019/019.yaml
  text: The ferryboat crossed over to bring the king’s household across and to do what was good in his sight[c][b][a], and Shimei son of Gera fell before the king as he was crossing the Jordan.
translation:
  language: hi
  text: राजा के घराने[b] को पार उतारने और राजा की दृष्टि में जो अच्छा था वह करने के लिए पार उतारने वाली नाव[a] पार गई। जब राजा यरदन पार कर रहा था, तब गेरा का पुत्र शिमई राजा के सामने गिर पड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पार लगानेवाली नाव’; इब्रानी शब्द नदी पार करने के साधन को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: ‘राजा का घराना’ राजमहल के भवन को नहीं, बल्कि राजपरिवार और राजा के साथ के लोगों को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: הָעֲבָרָה
  choice: पार उतारनेवाली नाव
  rationale: संज्ञा नदी पार कराने के साधन को दर्शाती है; प्रसंग में नाव स्वाभाविक है, जबकि वर्णनात्मक रूप इब्रानी शब्द की कार्यगत अस्पष्टता को भी कुछ हद तक बनाए रखता है।
- source_word: וְעָבְרָה
  choice: उस पार गई
  rationale: स्त्रीलिंग एकवचन पूर्ण क्रिया הָעֲבָרָה से मेल खाती है और कथा में नाव के पार जाने की घटना बताती है।
- source_word: לַעֲבִיר אֶת בֵּית הַמֶּלֶךְ
  choice: राजा के घराने को पार उतारने
  rationale: हिफ़ील रूप का कारक भाव ‘पार कराना’ है; ‘घराना’ यहाँ राजपरिवार और उससे जुड़े लोगों का सामूहिक संकेत है, भवन का नहीं।
- source_word: וְלַעֲשׂוֹת הַטּוֹב בְּעֵינָיו
  choice: जो उसकी दृष्टि में अच्छा था, वह करने
  rationale: यह रूप इब्रानी मुहावरे की छवि बनाए रखता है और हिन्दी में समझने योग्य है; आशय राजा की इच्छा या प्रसन्नता के अनुसार काम करना है।
- source_word: נָפַל לִפְנֵי הַמֶּלֶךְ
  choice: उसके सामने गिर पड़ा
  rationale: मूल पाठ की ठोस क्रिया को बनाए रखा गया है; प्रसंग से दीनता और विनती की मुद्रा प्रकट होती है, बिना उसे अधिक स्पष्ट करके सीमित किए।
- source_word: בְּעָבְרוֹ בַּיַּרְדֵּן
  choice: जब राजा यरदन पार कर रहा था
  rationale: कालवाचक क्रियार्थक रूप को स्वाभाविक हिन्दी में व्यक्त किया गया है। निकट प्रसंग में प्रत्यय का संदर्भ राजा से लेना सर्वाधिक स्वाभाविक है।
theological_decisions:
- issue: בְּעָבְרוֹ में कर्ता की अंतर्निहित अस्पष्टता
  choice: कर्ता को ‘राजा’ के रूप में स्पष्ट किया
  alternative: ‘जब वह यरदन पार कर रहा था’
  rationale: वाक्य में राजा प्रमुख निकटवर्ती पुरुषवाचक संदर्भ है और शिमई का उसके सामने गिरना इसी दृश्य से मेल खाता है; यह निर्णय किसी सिद्धान्तगत आग्रह पर आधारित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली रखी गई है। ‘दृष्टि में अच्छा’ मूल इब्रानी मुहावरे को स्वाभाविक रूप में सुरक्षित रखता है; इसे अलग पादटिप्पणी की आवश्यकता नहीं समझी गई।
