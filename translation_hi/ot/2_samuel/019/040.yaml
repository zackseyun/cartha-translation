base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/040.yaml
  text: All the people crossed the Jordan[a], and the king crossed over. Then the king kissed Barzillai and blessed him, and he returned to his own place.
translation:
  language: hi
  text: सारे लोग यरदन पार गए, और राजा भी पार गया। तब राजा ने बर्जिल्लै को चूमा और उसे आशीर्वाद दिया। फिर वह अपने स्थान पर लौट गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वह’ से सबसे स्वाभाविक रूप से बर्जिल्लै का संकेत मिलता है; अर्थात, बर्जिल्लै अपने स्थान पर लौट गया।
    reason: कर्ता के संदर्भ को स्पष्ट करना, जबकि मुख्य पाठ में हिब्रू की अस्पष्टता बनाए रखना।
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: पार गए
  rationale: עבר यहाँ यरदन नदी को पार करने की ठोस क्रिया बताता है। आधुनिक हिन्दी में बहुवचन कर्ता ‘सारे लोग’ के साथ ‘पार गए’ स्वाभाविक है।
- source_word: כָּל הָעָם
  choice: सारे लोग
  rationale: עָם का व्यापक अर्थ ‘लोग’ है। प्रसंग में इसे केवल सैनिकों तक सीमित करना आवश्यक नहीं है।
- source_word: אֶת הַיַּרְדֵּן
  choice: यरदन
  rationale: यह यरदन नदी का नाम है। हिन्दी बाइबलीय प्रयोग में ‘यरदन पार गए’ स्वाभाविक है; ‘नदी’ जोड़ना आवश्यक नहीं।
- source_word: וְהַמֶּלֶךְ עָבָר
  choice: और राजा भी पार गया
  rationale: मूल में राजा को अलग कर्ता बनाकर עבר की पुनरावृत्ति हुई है। ‘भी’ हिन्दी में इस समानांतर क्रिया को सहज रूप से व्यक्त करता है।
- source_word: וַיִּשַּׁק
  choice: चूमा
  rationale: נשק का यहाँ सीधा अर्थ ‘चूमना’ है और यह स्नेह तथा विदाई का संकेत है।
- source_word: לְבַרְזִלַּי
  choice: बर्जिल्लै
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: וַיְבָרֲכֵהוּ
  choice: उसे आशीर्वाद दिया
  rationale: ברך का स्पष्ट अर्थ ‘आशीर्वाद देना’ है। विदाई का प्रसंग होने पर भी मूल क्रिया को सामान्य विदाई में नहीं बदला गया।
- source_word: וַיָּשָׁב לִמְקֹמוֹ
  choice: फिर वह अपने स्थान को लौट गया
  rationale: इससे מקום का सामान्य अर्थ ‘स्थान’ सुरक्षित रहता है और उसे अनावश्यक रूप से ‘घर’ नहीं बनाया जाता। सर्वनाम मूल की कर्ता-संबंधी हल्की अस्पष्टता बनाए रखता है।
theological_decisions:
- issue: וַיָּשָׁב में निहित कर्ता की पहचान
  choice: मुख्य पाठ में ‘वह’ रखकर कर्ता को अनिर्दिष्ट रहने दिया गया
  alternative: ‘बर्जिल्लै अपने स्थान को लौट गया’
  rationale: निकटतम पूर्वपद और प्रसंग के अनुसार बर्जिल्लै सबसे स्वाभाविक कर्ता है, पर हिब्रू क्रिया में नाम दोहराया नहीं गया। इसलिए मुख्य पाठ मूल की अस्पष्टता बचाता है और पादटिप्पणी संभावित संदर्भ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। छोटे वाक्यों से घटनाक्रम स्पष्ट होता है। ‘अपने स्थान’ मूल अभिव्यक्ति के निकट है, जबकि ‘वह’ कर्ता की वास्तविक अस्पष्टता को सुरक्षित रखता है।
