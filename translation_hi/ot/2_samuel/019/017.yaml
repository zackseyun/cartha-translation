- source_word: בֶּן הַיְמִינִי
  choice: बिन्यामीनी
  rationale: संदर्भ में यह वंश अथवा गोत्र की पहचान है, न कि दूसरा पितृनाम।
- source_word: אֲשֶׁר מִבַּחוּרִים
  choice: बहूरीम का रहनेवाला
  rationale: यह शिमई के मूल स्थान को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיֵּרֶד
  choice: नीचे गया
  rationale: इब्रानी की स्थलाकृतिक गति का ठोस अर्थ बनाए रखा गया है।
- source_word: עִם אִישׁ יְהוּדָה
  choice: यहूदा के लोगों के साथ
  rationale: אִישׁ रूप में एकवचन है, पर यहाँ सामूहिक अर्थ में समझा जा सकता है; 'लोगों' में स्त्री-पुरुष सभी सम्मिलित हो सकते हैं और हिन्दी में यह स्वाभाविक है।
- source_word: לִקְרַאת
  choice: से मिलने
  rationale: यह किसी के सामने जाकर भेंट करने के उद्देश्य को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַמֶּלֶךְ דָּוִד
  choice: राजा दाऊद
  rationale: राजकीय उपाधि और नाम का हिन्दी में प्रचलित क्रम रखा गया है।
