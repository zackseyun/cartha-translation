base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/014.yaml
  text: And say to Amasa[a], ‘Are you not my bone and my flesh? May God do so to me, and more also, if you are not commander of the army before me all the days in place of Joab.’
translation:
  language: hi
  text: और अमासा[a] से कहो, ‘क्या तुम मेरी हड्डी और मेरा मांस नहीं हो? परमेश्वर मेरे साथ ऐसा ही, बल्कि इससे भी अधिक करे, यदि तुम योआब के स्थान पर जीवन भर मेरे समक्ष सेना के सेनापति न रहो।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: “सभी दिन”; यहाँ निरंतर या स्थायी कार्यकाल का भाव है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַעֲמָשָׂא תֹּמְרוּ
  choice: और अमासा से कहो
  rationale: द्वितीय पुरुष बहुवचन निर्देश को स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: הֲלוֹא
  choice: क्या ... नहीं
  rationale: यह सहमति की अपेक्षा करने वाले आलंकारिक प्रश्न का रूप बनाए रखता है।
- source_word: עַצְמִי וּבְשָׂרִי
  choice: मेरी हड्डी और मेरा मांस
  rationale: रक्त-संबंध सूचित करने वाले सजीव इब्रानी मुहावरे को व्याख्यात्मक ‘मेरे रिश्तेदार’ में बदलने के बजाय यथासंभव अक्षुण्ण रखा गया है।
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  choice: परमेश्वर मेरे साथ ऐसा ही, वरन् इससे भी अधिक करे
  rationale: शाप का स्वरूप अनिर्दिष्ट रखते हुए शपथ-सूत्र की गंभीरता और संरचना बचाई गई है।
- source_word: אִם לֹא
  choice: यदि ... न
  rationale: शपथ के कथ्य को प्रस्तुत करने वाली सशर्त इब्रानी रचना हिन्दी में भी स्वाभाविक रूप से रखी गई है।
- source_word: שַׂר צָבָא
  choice: सेनापति
  rationale: यह सेना के सर्वोच्च कमांडर के लिए संक्षिप्त, स्पष्ट और प्रचलित हिन्दी पद है।
- source_word: תִּהְיֶה לְפָנַי
  choice: मेरे सेनापति ... रहो
  rationale: शाब्दिक ‘मेरे सामने’ यहाँ राजा की सेवा और अधिकार के अधीन पद धारण करने का भाव देता है; हिन्दी में ‘मेरे सेनापति’ वही संबंध स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָּל הַיָּמִים
  choice: जीवन भर
  rationale: शाब्दिक अर्थ ‘सारे दिन’ है; नियुक्ति के प्रसंग में यह निरंतर अथवा स्थायी कार्यकाल को सूचित करता है। ‘जीवन भर’ हिन्दी का सहज मुहावरा है, यद्यपि इसमें आजीवन कार्यकाल का अपेक्षाकृत स्पष्ट अर्थ आता है।
- source_word: תַּחַת יוֹאָב
  choice: योआब के स्थान पर
  rationale: תַּחַת यहाँ अधीनता नहीं, बल्कि प्रतिस्थापन दर्शाता है।
theological_decisions:
- issue: शपथ-सूत्र में אֱלֹהִים का वचन और संदर्भ
  choice: परमेश्वर
  alternative: देवता
  rationale: रूपात्मक रूप से बहुवचन होने पर भी इस इब्रानी प्रयोग और इस्राएली राजकीय शपथ के संदर्भ में इसका आशय एकवचन परमेश्वर है।
- issue: शपथ में अनिर्दिष्ट दंड
  choice: ‘ऐसा ही, वरन् इससे भी अधिक करे’ को अनिर्दिष्ट रखना
  alternative: ‘मुझे कठोर दंड दे’ जैसी स्पष्ट व्याख्या
  rationale: मूल पाठ दंड का स्वरूप नहीं बताता; उसे स्पष्ट कर देना मूल की जानबूझकर छोड़ी गई अस्पष्टता को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक रूप से सहज रखी गई है। रिश्तेदारी के मुहावरे और शपथ-सूत्र की सांस्कृतिक बनावट सुरक्षित है; पद-संबंधी वाक्यांश को स्वाभाविक हिन्दी में संक्षिप्त किया गया है।
