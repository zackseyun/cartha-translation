  text: וַ/יַּ֨עַן אֲבִישַׁ֤י בֶּן צְרוּיָה֙ וַ/יֹּ֔אמֶר הֲ/תַ֣חַת זֹ֔את לֹ֥א יוּמַ֖ת שִׁמְעִ֑י כִּ֥י קִלֵּ֖ל אֶת מְשִׁ֥יחַ יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/022.yaml
  text: But Abishai son of Zeruiah answered and said[a], “Should Shimei not be put to death for this, because he cursed Yahweh’s anointed?”
translation:
  language: hi
  text: पर सरूयाह के पुत्र अबीशै ने उत्तर में कहा, “क्या इस कारण[a] शिमई को मृत्युदंड न दिया जाए, क्योंकि उसने याहवे के अभिषिक्त को शाप दिया है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसके बदले में।” इब्रानी मुहावरा पूछता है कि क्या इस कृत्य के फलस्वरूप शिमई को मृत्युदंड दिया जाना चाहिए।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ने उत्तर दिया
  rationale: दोनों इब्रानी क्रियाएँ उत्तर देने और कहने की क्रमिक अभिव्यक्ति बनाती हैं; स्वाभाविक हिन्दी में ‘उत्तर दिया’ संवाद की प्रतिक्रिया को स्पष्ट रखते हुए अनावश्यक दोहराव से बचता है।
- source_word: אֲבִישַׁי בֶּן צְרוּיָה
  choice: सरूयाह के पुत्र अबीशै
  rationale: नामों का देवनागरी लिप्यंतरण किया गया है और इब्रानी संबंधसूचक पद को यथावत रखा गया है।
- source_word: הֲתַחַת זֹאת
  choice: क्या इस कारण
  rationale: यह इब्रानी मुहावरा पूछता है कि क्या इस कृत्य के कारण दंड दिया जाना चाहिए; ‘इस कारण’ उसका कारणवाचक बल सहज हिन्दी में व्यक्त करता है।
- source_word: לֹא יוּמַת
  choice: मार न डाला जाए
  rationale: מות का होफाल रूप किसी के द्वारा मृत्युदंड दिए जाने का निष्क्रिय-कारक भाव रखता है, केवल मर जाने का नहीं।
- source_word: קִלֵּל
  choice: शाप दिया
  rationale: यहाँ क्रिया शिमई द्वारा दाऊद को दिए गए गंभीर मौखिक शाप को सूचित करती है और पूर्व कथा से संबंध बनाए रखती है।
- source_word: מְשִׁיחַ יְהוָה
  choice: याहवे के अभिषिक्त
  rationale: रचना उस व्यक्ति को दर्शाती है जिसे याहवे ने राजकीय पद के लिए अभिषिक्त किया है; हिन्दी में संबंध और धार्मिक पद दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरी वाचा-नाम सीधे आया है; ‘याहवे’ उसका आधुनिक विद्वत्तापरक लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: מְשִׁיחַ का आशय
  choice: अभिषिक्त
  alternative: अभिषिक्त राजा
  rationale: मूल में संज्ञा ‘अभिषिक्त’ ही है। प्रसंग में दाऊद राजा है, पर ‘राजा’ जोड़ने के बजाय मूल की संक्षिप्तता और संभावित व्यापक धार्मिक प्रतिध्वनि सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। न्यायिक भाव के लिए ‘मार न डाला जाए’ और राजकीय-धार्मिक पद के लिए ‘अभिषिक्त’ चुना गया है।
