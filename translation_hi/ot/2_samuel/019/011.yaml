  yaml_path: translation/ot/2_samuel/019/011.yaml
  text: And Absalom[a], whom we anointed over us, died in battle. So now why are you silent about bringing the king back?
translation:
  language: hi
  text: और अबशालोम, जिसे हमने अपने ऊपर अभिषिक्त किया था, युद्ध में मर गया। इसलिए अब राजा को वापस लाने के विषय में तुम चुप क्यों हो?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजा को फिर से स्थापित करने के विषय में तुम चुप क्यों हो?”
    reason: לְהָשִׁיב (‘वापस लाना’) का प्रसंगानुकूल वैकल्पिक अनुवाद ‘फिर से स्थापित करना’ हो सकता है, जबकि मूल पाठ की राजनीतिक भाषा बनी रहती है।
lexical_decisions:
- source_word: וְאַבְשָׁלוֹם
  choice: और अबशालोम
  rationale: वाव पिछले कथन से संबंध बनाए रखता है; सामान्य संयोजक के रूप में ‘और’ अनावश्यक विरोधाभास जोड़े बिना इस प्रवाह को सुरक्षित रखता है।
- source_word: אֲשֶׁר מָשַׁחְנוּ עָלֵינוּ
  choice: जिसका हमने अपने ऊपर राजा के रूप में अभिषेक किया था
  rationale: מָשַׁח का मूल अर्थ ‘अभिषेक करना’ है और यहाँ यह राजकीय स्थापना को व्यक्त करता है। ‘राजा के रूप में’ हिंदी में अभिप्राय स्पष्ट करता है, जबकि ‘अभिषेक’ मूल की राजनीतिक-धार्मिक गरिमा बनाए रखता है।
- source_word: מֵת בַּמִּלְחָמָה
  choice: युद्ध में मारा गया
  rationale: संदर्भ में अबशालोम की मृत्यु युद्ध में हुई; हिंदी में ‘युद्ध में मारा गया’ स्वाभाविक है और घटना का पूर्ण होना व्यक्त करता है।
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह पिछले तथ्य से निकलने वाले व्यावहारिक निष्कर्ष को प्रस्तुत करता है; ‘इसलिए अब’ संबंध और निष्कर्ष दोनों दर्शाता है।
- source_word: מַחֲרִשִׁים
  choice: चुप क्यों हो
  rationale: חרשׁ का हिफ़ील रूप यहाँ चुप रहने या कुछ न कहने का भाव देता है। ‘चुप हो’ सहज हिंदी है और इसे केवल ‘हिचकिचाने’ के रूप में व्याख्यायित नहीं करता।
- source_word: לְהָשִׁיב אֶת־הַמֶּלֶךְ
  choice: राजा को वापस लाने के विषय में
  rationale: שׁוּב के हिफ़ील का अर्थ ‘वापस लाना’ है। ‘के विषय में’ चुप रहने की क्रिया के साथ स्वाभाविक हिंदी संबंध बनाता है और ‘राजा’ की मूल राजनीतिक पहचान सुरक्षित रखता है।
theological_decisions:
- issue: अबशालोम के लिए राजकीय स्थापना के क्रियापद מָשַׁח का अनुवाद
  choice: अभिषेक किया था
  alternative: राजा बनाया था
  rationale: वर्णन में अबशालोम का स्थान विवादास्पद होने पर भी इब्रानी पाठ अभिषेक के सामान्य राजकीय क्रियापद का प्रयोग करता है। ‘अभिषेक’ बनाए रखने से अनुवाद कोई अतिरिक्त नैतिक या संप्रदायगत निर्णय नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिंदी में रखी गई है। ‘अभिषेक’ बाइबलीय-राजकीय पद है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए स्पष्ट बनाया गया है।
