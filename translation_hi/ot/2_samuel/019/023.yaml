base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/023.yaml
  text: And David said[a], “What have I to do with you, sons of Zeruiah, that you should be an adversary to me today? Shall any man be put to death in Israel today? For do I not know that today I am king over Israel?”
translation:
  language: hi
  text: दाऊद ने कहा, “हे सरूयाह के बेटो, मेरा तुमसे क्या लेना-देना है कि आज तुम मेरे विरोधी[a] बनो? क्या आज इस्राएल में किसी मनुष्य को मृत्यु-दंड दिया जाए? क्या मैं नहीं जानता कि आज मैं इस्राएल का राजा हूँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “मेरे लिए एक सातान,” अर्थात् “मेरे लिए एक विरोधी/प्रतिपक्षी।” यहाँ यह व्यक्तिवाचक नाम नहीं है।'
    reason: मूल शब्द के जातिवाचक अर्थ को स्पष्ट करना और उसे व्यक्तिवाचक नाम समझे जाने से बचाना।
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  choice: मेरा तुमसे क्या लेना-देना
  rationale: यह इब्रानी मुहावरा दूरी जताने और डाँटने के लिए प्रयुक्त हुआ है। यह हिन्दी अभिव्यक्ति उसके भाव और प्रश्नात्मक रूप दोनों को स्वाभाविक ढंग से रखती है।
- source_word: בְּנֵי צְרוּיָה
  choice: हे सरूयाह के बेटो
  rationale: यह योआब और अबीशै को संबोधित करने वाला ठोस पारिवारिक पद है। सम्बोधन को स्पष्ट करने के लिए ‘हे’ रखा गया है और ‘बेटो’ मूल के पुल्लिंग बहुवचन को सुरक्षित रखता है।
- source_word: כִּי תִהְיוּ לִי הַיּוֹם לְשָׂטָן
  choice: जो आज तुम मेरे विरोधी बन रहे हो
  rationale: यहाँ שָׂטָן व्यक्तिवाचक नाम नहीं, बल्कि विरोध करने वाले के अर्थ में जातिवाचक संज्ञा है। ‘बन रहे हो’ इस अवसर पर उनके द्वारा अपनाई जा रही विरोधी भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יוּמַת אִישׁ
  choice: किसी मनुष्य को मार डाला जाए
  rationale: हुफ़अल रूप किसी के द्वारा प्राण लिए जाने का निष्क्रिय अर्थ देता है। प्रश्न के प्रसंग में यह राजकीय दंड की ओर संकेत करता है, पर अनावश्यक रूप से कोई अतिरिक्त कानूनी शब्दावली नहीं जोड़ता।
- source_word: אִישׁ
  choice: किसी मनुष्य
  rationale: एकवचन पुल्लिंग संज्ञा यहाँ व्यापक प्रतिनिधिक अर्थ में है। ‘मनुष्य’ मूल का मानवीय और सामान्य संदर्भ बनाए रखता है।
- source_word: הֲלוֹא יָדַעְתִּי
  choice: क्या मैं नहीं जानता
  rationale: नकारयुक्त प्रश्न पुष्टि की अपेक्षा रखने वाला आलंकारिक प्रश्न है। हिन्दी में यही प्रश्नात्मक संरचना सुरक्षित रखी गई है।
- source_word: מֶלֶךְ עַל יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: यद्यपि עַל का मूल अर्थ ‘ऊपर/पर’ है, हिन्दी में राजकीय अधिकार का स्वाभाविक और स्पष्ट रूप ‘इस्राएल का राजा’ है; ‘इस्राएल पर राजा’ अप्राकृतिक लगेगा।
theological_decisions:
- issue: שָׂטָן का अर्थ
  choice: जातिवाचक संज्ञा ‘विरोधी’
  alternative: व्यक्तिवाचक नाम ‘शैतान’
  rationale: इस ऐतिहासिक कथानक में यह शब्द सरूयाह के बेटों द्वारा दाऊद का विरोध या उसके मार्ग में बाधा बनने को बताता है। इसे ‘शैतान’ कहना तत्काल प्रसंग से असमर्थित बाद की दानव-संबंधी धारणा आरोपित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक और सहज शैली रखी गई है। दाऊद की फटकार, दोनों आलंकारिक प्रश्नों और ‘आज’ की पुनरावृत्ति को बनाए रखा गया है।
