source:
  edition: WLC
  text: וַ/יְרַגֵּ֣ל בְּ/עַבְדְּ/ךָ֔ אֶל אֲדֹנִ֖/י הַ/מֶּ֑לֶךְ וַ/אדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ כְּ/מַלְאַ֣ךְ הָ/אֱלֹהִ֔ים וַ/עֲשֵׂ֥ה הַ/טּ֖וֹב בְּ/עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/028.yaml
  text: He slandered your servant to my lord the king, but my lord the king is like the angel of God; so do what is good in your eyes.
translation:
  language: hi
  text: उसने मेरे प्रभु राजा से आपके सेवक के विरुद्ध चुगली की। पर मेरे प्रभु राजा परमेश्वर के दूत के समान हैं; इसलिए जो आपकी दृष्टि में अच्छा हो, वही कीजिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְרַגֵּל
  choice: बदनामी की
  rationale: इस संदर्भ में क्रिया का अर्थ किसी के विरुद्ध अपवाद या झूठी हानिकारक बातें कहना है; ‘बदनामी की’ आधुनिक हिन्दी में स्वाभाविक और अर्थानुकूल है।
- source_word: בְּעַבְדְּךָ
  choice: आपके सेवक की
  rationale: मपीबोशेत अपने लिए विनम्र तृतीय-पुरुष संबोधन करता है; हिन्दी में इसे बनाए रखा गया है।
- source_word: כְּמַלְאַךְ הָאֱלֹהִים
  choice: परमेश्वर के दूत के समान
  rationale: מַלְאָךְ का मूल अर्थ ‘दूत’ है और इस राजकीय संदर्भ में बुद्धिमान विवेक की उपमा है; ‘स्वर्गदूत’ कहकर अर्थ को अनावश्यक रूप से संकीर्ण नहीं किया गया।
- source_word: וַעֲשֵׂה הַטּוֹב בְּעֵינֶיךָ
  choice: इसलिए जो आपकी दृष्टि में अच्छा हो, वही कीजिए
  rationale: हिब्रू मुहावरे को गरिमापूर्ण, स्पष्ट हिन्दी में रखा गया है; संयोजक וַ का प्रसंगगत परिणामार्थ ‘इसलिए’ से व्यक्त किया गया।
theological_decisions:
- issue: ‘परमेश्वर के दूत’ की पहचान
  choice: परमेश्वर के दूत के समान
  alternative: परमेश्वर के स्वर्गदूत के समान
  rationale: पाठ उपमा देता है, किसी विशिष्ट अलौकिक सत्ता या मसीही पहचान को निश्चित नहीं करता; अतः मूल की व्यापकता सुरक्षित रखी गई है।
- issue: अंतिम आदेश का संबंध
  choice: इसलिए
  alternative: और
  rationale: यह वाक्य राजा के ईश्वरदत्त-जैसे विवेक की प्रशंसा के आधार पर उसके निर्णय को स्वीकार करता है; ‘इसलिए’ संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है, यद्यपि हिब्रू וַ सामान्य संयोजक भी हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; विनम्र दरबारी संबोधन और मूल की गरिमा सुरक्षित रखते हुए वाक्य को सामान्य पाठक के लिए सहज रखा गया है।
