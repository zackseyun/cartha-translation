  text: And Barzillai the Gileadite had come down from Rogelim[a], and he crossed the Jordan with the king to send him off at the Jordan.
translation:
  language: hi
  text: और गिलाद का निवासी बर्जिल्लै रोगलीम से उतरकर आया था। वह राजा के साथ यरदन पार गया, ताकि राजा को यरदन के पार तक पहुँचाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरदन पर उसे विदा करने के लिए।” अंतिम इब्रानी पदबंध की रचना कठिन है; इसका अर्थ राजा को यरदन के पार तक साथ पहुँचाना, अथवा यरदन पर उसे विदा करना, समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַרְזִלַּי
  choice: बर्जिल्लै
  rationale: व्यक्तिनाम का हिब्रू उच्चारण के निकट, हिंदी देवनागरी में लिप्यंतरण।
- source_word: הַגִּלְעָדִי
  choice: गिलादी
  rationale: क्षेत्र-सूचक विशेषण को संक्षिप्त और हिंदी बाइबलीय प्रयोग के अनुरूप रखा गया है।
- source_word: יָרַד מֵרֹגְלִים
  choice: रोगलीम से उतरकर आया था
  rationale: קטל रूप पूर्ववर्ती परिस्थिति को दर्शा सकता है; ‘आया था’ अगली घटना से पहले उसके आगमन को स्पष्ट करता है, जबकि ‘उतरकर’ मूल गति-बोध बनाए रखता है।
- source_word: וַיַּעֲבֹר אֶת הַמֶּלֶךְ הַיַּרְדֵּן
  choice: वह राजा के साथ यरदन पार गया
  rationale: עבר का सामान्य अर्थ ‘पार जाना’ है। אֶת הַמֶּלֶךְ को प्रसंगानुसार सहगमन के रूप में व्यक्त करना स्वाभाविक है; राजा को कर्म मानकर शाब्दिक अनुवाद हिंदी में अर्थहीन होता।
- source_word: לְשַׁלְּחוֹ
  choice: ताकि ... उसे विदा करे
  rationale: उद्देश्यवाचक infinitive में राजा को आगे की यात्रा पर विदा करने या साथ छोड़ने का भाव है; ‘विदा करे’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: אֶת בַירדן
  choice: यरदन के पास
  rationale: पाठ में कठिन या असामान्य रचना है; בַירדן स्थान-सूचक रूप में नदी के पास विदाई को दर्शा सकता है। यह अनुवाद ‘पार’ की पुनरावृत्ति से उत्पन्न अनावश्यक निश्चितता से बचता है।
