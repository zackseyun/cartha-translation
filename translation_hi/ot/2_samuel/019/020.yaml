base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/020.yaml
  text: And he said to the king[a], “Do not let my lord count me guilty, and do not remember how your servant did wrong on the day my lord the king went out from Jerusalem[b], so that the king should take it to heart.”
translation:
  language: hi
  text: उसने राजा से कहा, “मेरे प्रभु, मुझे दोषी न ठहराएँ[a], और उस बुराई को याद न करें जो आपके सेवक ने उस दिन की थी जब मेरे प्रभु राजा यरूशलेम से निकले थे, ताकि राजा उसे मन में न रखें[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप के निकट: “मेरे लिए अपराध न गिनें।” इब्रानी मुहावरे का रूप न्यायिक है—किसी के विरुद्ध दोष गिनना।'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “उसे अपने हृदय में रखें।” यह मुहावरा किसी बात को गंभीरता से लेने या मन में बनाए रखने का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲשָׁב לִי עָוֺן
  choice: मेरे अपराध का दोष मुझ पर न लगाएँ
  rationale: इब्रानी मुहावरे में अपराध या दोष को किसी के नाम गिनने का न्यायिक भाव है। यह हिंदी रूप उस भाव को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תִּזְכֹּר
  choice: याद न करें
  rationale: मूल क्रिया का सीधा अर्थ ‘याद करना’ है। प्रसंग में इसके साथ दंड देने के लिए स्मरण रखने का संकेत है, पर अनुवाद मूल की तरह उस संकेत को निहित रहने देता है।
- source_word: הֶעֱוָה
  choice: जो बुराई की थी
  rationale: यहाँ क्रिया गलत या विकृत आचरण को सूचित करती है। ‘बुराई की’ आधुनिक हिंदी में सहज है और अपराध-स्वीकार का नैतिक भार बनाए रखती है।
- source_word: עַבְדְּךָ
  choice: आपके सेवक
  rationale: राजा के सामने स्वयं के लिए यह दरबारी विनम्रता की अभिव्यक्ति है; ‘सेवक’ हिंदी में इसी सामाजिक और सम्मानसूचक प्रयोग को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יָצָא ... מִירוּשָׁלָם
  choice: यरूशलेम से निकले थे
  rationale: यह मूल के ‘यरूशलेम से बाहर जाने’ को निकटता से रखता है और दाऊद के नगर छोड़ने के कथानक में स्वाभाविक है।
- source_word: לָשׂוּם ... אֶל לִבּוֹ
  choice: उसे मन में न रखें
  rationale: शाब्दिक चित्र ‘हृदय पर रखना’ है। प्रसंग में आशय बात को गंभीरता से लेकर किसी के विरुद्ध बनाए रखने का है; ‘मन में रखना’ उस भाव को सहज हिंदी में बनाए रखता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: मूल पाठ नाम के बजाय ‘राजा’ को दोहराता है। अनुवाद दरबारी शैली और व्यक्ति-परिवर्तन सहित इस पुनरावृत्ति को बनाए रखता है।
- source_word: אֲדֹנִי
  choice: मेरे प्रभु
  rationale: यह राजा के लिए आदरसूचक संबोधन है, परमेश्वर का नाम नहीं। ‘मेरे प्रभु’ प्रथम पुरुष संबंध और विनम्रता दोनों को सुरक्षित रखता है।
