base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/039.yaml
  text: Then the king said[a], “Let Kimham cross over with me, and I will do for him what seems good in your eyes; and whatever you choose to lay on me, I will do for you.”
translation:
  language: hi
  text: तब राजा ने कहा, “किम्हाम मेरे साथ पार उतरे। जो तुम्हारी दृष्टि में अच्छा हो, वह मैं उसके लिए करूँगा; और जो कुछ तुम मुझ पर डालना चाहो[a], वह मैं तुम्हारे लिए करूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कुछ तुम मुझसे माँगो, वह मैं तुम्हारे लिए करूँगा।” इब्रानी अभिव्यक्ति कुछ संक्षिप्त है; शाब्दिक रूप से, “जो कुछ तुम मुझ पर चुनो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: तब राजा ने कहा
  rationale: वाव-परिणामी कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम का क्रम स्पष्ट करता है।
- source_word: אִתִּי יַעֲבֹר כִּמְהָם
  choice: किम्हाम मेरे साथ पार जाए
  rationale: यहाँ अपूर्ण क्रिया आज्ञार्थक/इच्छार्थक भाव रखती है। ‘पार जाए’ राजा के निर्णय या निमंत्रण को व्यक्त करता है और यरदन पार करने के प्रसंग में עבר की पुनरावृत्ति बनाए रखता है।
- source_word: כִּמְהָם
  choice: किम्हाम
  rationale: व्यक्तिवाचक नाम का मूल उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: וַאֲנִי אֶעֱשֶׂה לּוֹ
  choice: वह मैं उसके लिए करूँगा
  rationale: עשה का अर्थ व्यापक है; अनुवाद यह स्पष्ट करता है कि राजा किम्हाम के हित में कार्य करेगा, पर लाभ का स्वरूप अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֶת הַטּוֹב בְּעֵינֶיךָ
  choice: जो तुम्हारी दृष्टि में अच्छा हो
  rationale: यह हिन्दी में स्वाभाविक रहते हुए ‘तुम्हारी आँखों में अच्छा’ वाले इब्रानी मुहावरे की निर्णय/पसंद संबंधी छवि को निकटता से व्यक्त करता है।
- source_word: וְכֹל אֲשֶׁר תִּבְחַר עָלַי
  choice: और जो कुछ तुम मुझ पर रखना चाहो
  rationale: इब्रानी प्रयोग संक्षिप्त और कुछ अस्पष्ट है। यह रूप עלי (‘मुझ पर’) को बनाए रखता है और राजा द्वारा दायित्व स्वीकार करने का भाव देता है; अधिक सहज वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: אֶעֱשֶׂה לָּךְ
  choice: वह मैं तुम्हारे लिए करूँगा
  rationale: अंतिम वाक्यांश बरज़िल्लै से की गई राजा की व्यक्तिगत प्रतिज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है।
