source:
  edition: WLC
  text: אַחַ֣/י אַתֶּ֔ם עַצְמִ֥/י וּ/בְשָׂרִ֖/י אַתֶּ֑ם וְ/לָ֧/מָּה תִהְי֛וּ אַחֲרֹנִ֖ים לְ/הָשִׁ֥יב אֶת הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/013.yaml
  text: You are my brothers[a]; you are my own bone and flesh[c][b]. So why should you be the last to bring back the king?
translation:
  language: hi
  text: तुम मेरे भाई[a] हो; तुम मेरी ही हड्डी और मेरा मांस हो[b]। फिर राजा को वापस लाने में तुम सबसे पीछे क्यों रहो?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक भावानुसार, “मेरे सगे-सम्बन्धी”; मूल में “मेरे भाई।”
    reason: lexical_alternative
  - marker: b
    text: “मेरी हड्डी और मेरा मांस” निकट रक्त-संबंध बताने वाला इब्रानी मुहावरा है।
    reason: cultural_note
  - marker: c
    text: दाऊद अपने लिए तृतीय पुरुष में “राजा” कहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: मेरे भाई
  rationale: शाब्दिक अर्थ को बनाए रखता है; प्रसंग में यह यहूदा के लोगों के साथ दाऊद की निकट कुलगत रिश्तेदारी को व्यक्त करता है।
- source_word: עַצְמִי וּבְשָׂרִי
  choice: मेरी ही हड्डी और मेरा मांस
  rationale: रक्त-संबंध की इब्रानी ठोस उपमा को सुरक्षित रखता है; ‘ही’ आत्मीयता और अपनेपन के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְלָמָה
  choice: फिर ... क्यों
  rationale: पहले दिए रिश्तेदारी के आधार से निकलने वाली तर्कपूर्ण अपील को सहज हिन्दी में व्यक्त करता है।
- source_word: תִּהְיוּ אַחֲרֹנִים
  choice: तुम सबसे पीछे क्यों रहो
  rationale: अपूर्ण क्रिया के आलंकारिक और आग्रहपूर्ण भाव को दर्शाता है तथा दूसरों की तुलना में देर करने का अर्थ बनाए रखता है।
- source_word: לְהָשִׁיב
  choice: वापस लाने में
  rationale: हिफ़ील रूप का कारणवाचक अर्थ—किसी को लौटाकर लाना—सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶת־הַמֶּלֶךְ
  choice: राजा को
  rationale: दाऊद द्वारा अपने लिए प्रयुक्त मूल के तृतीय-पुरुष राजकीय संबोधन को सुरक्षित रखता है।
