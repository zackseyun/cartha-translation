  yaml_path: translation/ot/2_samuel/019/027.yaml
  text: And he has slandered your servant to my lord the king[a], for your servant said, ‘I will saddle the donkey for myself so that I may ride on it and go with the king,’ because your servant is lame.
translation:
  language: hi
  text: उसने कहा, “हे मेरे स्वामी महाराज, मेरे सेवक ने मुझे धोखा दिया है[a], क्योंकि आपके सेवक ने कहा था, ‘मैं अपने लिए गधे पर काठी कसूँगा, ताकि मैं उस पर सवार होकर महाराज के साथ जाऊँ,’ क्योंकि आपका सेवक लंगड़ा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे साथ विश्वासघात किया है” या “मुझे बदनाम किया है।” इब्रानी क्रिया धोखा देने, भटकाने, या कपटपूर्ण व्यवहार करने का अर्थ दे सकती है। इस प्रसंग में सेवक द्वारा राजा के सामने गलत बात पहुँचाने का भाव भी संभव है।
    reason: lexical_alternative
