  choice: हे मेरे स्वामी महाराज
  rationale: यह संबोधन राजदरबार की विनम्रता और राजा के प्रति अधीनता दोनों को बनाए रखता है।
- source_word: אֶחְבְּשָׁה לִּי הַחֲמוֹר
  choice: मेरे लिए गधे पर काठी कस दे
  rationale: חבש पशु को सवारी के लिए तैयार करने, विशेषतः काठी कसने, को दर्शाता है। प्रसंग के अनुसार वक्ता अपने सेवक को ऐसा करने के लिए कह रहा था; हिन्दी में प्रत्यक्ष आदेश आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְאֶרְכַּב עָלֶיהָ
  choice: ताकि मैं उस पर सवार होकर
  rationale: लगातार क्रियाओं के उद्देश्य-संबंध को ‘ताकि’ से स्पष्ट किया गया है।
- source_word: וְאֵלֵךְ אֶת הַמֶּלֶךְ
  choice: महाराज के साथ जाऊँ
  rationale: הלך के साथ את यहाँ साथ जाने या संगति का भाव देता है, दिशा का नहीं।
- source_word: פִסֵּחַ
  choice: पैरों से अशक्त
  rationale: शारीरिक रूप से चलने की अक्षमता को स्पष्ट, सम्मानजनक और वर्तमान हिन्दी में व्यक्त करता है।
- source_word: עַבְדְּךָ
  choice: आपका सेवक
  rationale: राजा के सामने विनम्र आत्म-संदर्भ की दरबारी शैली को सुरक्षित रखता है।
