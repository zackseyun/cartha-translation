  text: and a thousand men from Benjamin with him[a], and Ziba, the servant of Saul’s house, with his fifteen sons and his twenty servants; they crossed the Jordan before the king.
translation:
  language: hi
  text: और बिन्यामीन के एक हज़ार पुरुष उसके साथ थे। शाऊल के घराने का सेवक सीबा भी अपने पंद्रह पुत्रों और बीस सेवकों के साथ था। वे राजा के सामने[a] यरदन पार गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राजा से आगे।” इब्रानी वाक्यांश का अर्थ राजा की उपस्थिति में या उससे आगे—दोनों हो सकता है।
    reason: lexical_alternative
