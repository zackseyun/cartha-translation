base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/023.yaml
  text: The messenger said to David[a], “The men were stronger than we were, and they came out against us into the open field[b]; but we pressed them back as far as the entrance of the gate.”
translation:
  language: hi
  text: संदेशवाहक ने दाऊद से कहा, “वे लोग हम पर प्रबल हो गए और मैदान में हमारे विरुद्ध निकल आए; पर हम उन्हें फाटक के प्रवेशद्वार तक पीछे धकेल दिया।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हम उन पर हो गए।” यह सैन्य मुहावरा है, जिसका अर्थ है कि हमने उन पर पलटकर धावा बोला या उन्हें पीछे धकेला।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: संदेशवाहक
  rationale: इस सैन्य वृत्तांत में यह शब्द किसी स्वर्गदूत के लिए नहीं, बल्कि युद्ध का समाचार लाने वाले मनुष्य के लिए प्रयुक्त है।
- source_word: כִּי
  choice: उद्धृत समाचार का आरंभ, अलग शब्द से अनूदित नहीं
  rationale: यहाँ כִּי संदेश की विषय-वस्तु प्रस्तुत करता है; हिंदी में ‘कहा’ के बाद सीधे कथन देना स्वाभाविक है।
- source_word: גָבְרוּ עָלֵינוּ
  choice: हम पर प्रबल हो गए
  rationale: यह चयन גבר के ‘प्रबल होना/बढ़त पाना’ और עַל के विरोधात्मक भाव को निकटता से सुरक्षित रखता है।
- source_word: הָאֲנָשִׁים
  choice: वे पुरुष
  rationale: मूल पाठ में सामान्य शब्द ‘पुरुष’ है; संदर्भ से स्पष्ट है कि ये शत्रु-पक्ष के लड़ाके हैं, इसलिए ‘सैनिक’ जोड़ना आवश्यक नहीं।
- source_word: וַיֵּצְאוּ אֵלֵינוּ הַשָּׂדֶה
  choice: निकलकर मैदान में हमारे विरुद्ध आ गए
  rationale: यह नगर से बाहर निकलने, मैदान में आने और युद्ध के लिए सामने आने—तीनों भावों को सहज हिंदी में व्यक्त करता है।
- source_word: וַנִּהְיֶה עֲלֵיהֶם
  choice: हम उन्हें ... पीछे धकेलते गए
  rationale: शाब्दिक रूप ‘हम उन पर हो गए’ है, पर सैन्य संदर्भ और आगे दिए गए स्थानिक छोर से पलटकर आक्रमण करने तथा शत्रु को पीछे हटाने का भाव निकलता है।
- source_word: עַד פֶּתַח הַשָּׁעַר
  choice: नगर-द्वार के प्रवेश तक
  rationale: פֶּתַח प्रवेश/मुहाना और שַׁעַר नगर-द्वार को दर्शाता है; ‘तक’ पीछा किए जाने की सीमा स्पष्ट करता है।
