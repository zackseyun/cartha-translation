  yaml_path: translation/ot/2_samuel/011/013.yaml
  text: David invited him[a], and he ate and drank before him, and he made him drunk. In the evening he went out to lie on his bed with the servants of his lord[d][c][b], but he did not go down to his house.
translation:
  language: hi
  text: दाऊद ने उसे बुलाया,[a] और उसने दाऊद के सामने[b] खाया-पिया। दाऊद ने उसे नशे में कर दिया। शाम को वह अपने स्वामी के सेवकों के साथ अपने बिछौने पर लेटने चला गया, पर वह अपने घर नहीं उतरा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दाऊद ने उसे अपने पास बुलाया” या “दाऊद ने उसे बुलाने भेजा।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक अर्थ “उसके सामने,” अर्थात दाऊद की उपस्थिति में।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में “अपने घर नहीं उतरा।” यहाँ “उतरा” को सरल करके “घर नहीं गया” नहीं किया गया है, क्योंकि यही दिशासूचक क्रिया आसपास के वर्णन में भी आती है।
    reason: lexical_alternative
