  choice: दाऊद ने उसे बुलवाया
  rationale: קרא ל किसी व्यक्ति को बुलाने या अपने पास बुलवाने का भाव देता है। भोज के संदर्भ में यह स्वाभाविक हिन्दी है और दाऊद की पहल भी स्पष्ट रखता है।
- source_word: לְפָנָיו
  choice: दाऊद के सामने
  rationale: शाब्दिक अर्थ ‘उसके सामने/उसकी उपस्थिति में’ है। संज्ञा ‘दाऊद’ दोहराने से हिन्दी में सर्वनाम-संदर्भ की अस्पष्टता दूर होती है।
- source_word: וַיְשַׁכְּרֵהוּ
  choice: दाऊद ने उसे मतवाला कर दिया
  rationale: שׁכר का हिफ़ील रूप कारणवाचक है; दाऊद ने ऊरिय्याह को नशे की अवस्था में पहुँचाया। ‘मतवाला कर दिया’ इस सक्रिय कारणभाव को गरिमापूर्ण, सहज हिन्दी में रखता है।
- source_word: בָּעֶרֶב
  choice: शाम को
  rationale: यह कथा के अगले चरण का समय बताता है; ‘शाम को’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לִשְׁכַּב בְּמִשְׁכָּבוֹ
  choice: अपने बिछौने पर लेटने
  rationale: שׁכב का मूल भाव लेटना है, अनिवार्य रूप से सोना नहीं। מִשְׁכָּב के लिए ‘बिछौना’ यहाँ घर के स्थायी पलंग के बजाय सोने की जगह का भाव भी बनाए रखता है।
- source_word: עִם עַבְדֵי אֲדֹנָיו
  choice: अपने स्वामी के सेवकों के साथ
  rationale: अֲדֹנָיו ऊरिय्याह के स्वामी, अर्थात दाऊद, की ओर संकेत करता है। ‘अपने स्वामी के सेवकों’ से मूल की संबंध-संरचना बनी रहती है।
- source_word: וְאֶל בֵּיתוֹ לֹא יָרָד
  choice: पर अपने घर नहीं उतरा
  rationale: ירד के दिशासूचक अर्थ ‘उतरना’ को आसपास की कथा में उसकी पुनरावृत्ति के कारण सुरक्षित रखा गया है। ‘पर’ अपेक्षित कार्य के न होने का विरोधात्मक संबंध स्वाभाविक हिन्दी में व्यक्त करता है।
