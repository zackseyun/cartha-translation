  text: מִֽי הִכָּ֞ה אֶת אֲבִימֶ֣לֶךְ בֶּן יְרֻבֶּ֗שֶׁת הֲ/לֽוֹא אִשָּׁ֡ה הִשְׁלִ֣יכָה עָלָי/ו֩ פֶּ֨לַח רֶ֜כֶב מֵ/עַ֤ל הַֽ/חוֹמָה֙ וַ/יָּ֣מָת בְּ/תֵבֵ֔ץ לָ֥/מָּה נִגַּשְׁתֶּ֖ם אֶל הַֽ/חוֹמָ֑ה וְ/אָ֣מַרְתָּ֔ גַּ֗ם עַבְדְּ/ךָ֛ אוּרִיָּ֥ה הַ/חִתִּ֖י מֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/021.yaml
  text: Who struck down Abimelech son of Jerubbesheth? Was it not a woman who threw an upper millstone on him from the wall[a], so that he died at Thebez? Why did you go near the wall?’ Then you shall say[c][b], ‘Your servant Uriah the Hittite is dead also.’
translation:
  language: hi
  text: “यरुब्बेशेत[a] के पुत्र अबीमेलेक को किसने मारा था? क्या एक स्त्री ने दीवार के ऊपर से चक्की का ऊपरी पाट[b] उस पर नहीं फेंका था, जिससे वह तेबेस में मर गया?[c] तुम दीवार के पास क्यों गए?” तब तुम कहना, “आपका सेवक हित्ती ऊरिय्याह भी मर गया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘यरुब्बेशेत’; न्यायियों 9:1 से तुलना करें, जहाँ ‘यरुब्बाल’ है।
    reason: alternative_reading
  - marker: b
    text: या “चक्की के पाट का एक टुकड़ा”; इब्रानी पद संभवतः ऊपरी पाट को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ जिस घटना का उल्लेख है, उसके लिए न्यायियों 9:53 देखें।
    reason: cross_reference
lexical_decisions:
- source_word: הִכָּה
  choice: मारा था
  rationale: नכה का मूल अर्थ ‘मारना/प्रहार करना’ है। यहाँ प्रहार का परिणाम मृत्यु है; ‘मारा था’ हिंदी में इस घातक संदर्भ को स्वाभाविक रूप से व्यक्त करते हुए क्रिया की ठोस शक्ति बनाए रखता है।
- source_word: אֲבִימֶלֶךְ בֶּן־יְרֻבֶּשֶׁת
  choice: यरुब्बेशेत के पुत्र अबीमेलेक
  rationale: मसोरेटिक पाठ में नाम ‘यरुब्बेशेत’ है; न्यायियों 9 के अधिक परिचित ‘यरुब्बाल’ से इसका सामंजस्य नहीं किया गया।
- source_word: הֲלוֹא
  choice: क्या ... नहीं
  rationale: यह नकारात्मक आलंकारिक प्रश्न सकारात्मक उत्तर की अपेक्षा करता है; हिंदी की यह रचना उसी बल को सुरक्षित रखती है।
- source_word: אִשָּׁה
  choice: एक स्त्री
  rationale: अनिश्चित अर्थ सहित सीधा और स्वाभाविक अनुवाद।
- source_word: הִשְׁלִיכָה
  choice: फेंका था
  rationale: क्रिया की सामान्य और ठोस गति को आधुनिक हिंदी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: פֶּלַח רֶכֶב
  choice: चक्की का ऊपरी पाट
  rationale: यह पद चक्की के एक खंड, संभवतः हाथ-चक्की के ऊपरी पाट, को सूचित करता है। मुख्य पाठ में संभावित अभिप्राय दिया गया और शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: מֵעַל הַחוֹמָה
  choice: नगर की दीवार के ऊपर से
  rationale: מֵעַל ऊँचे स्थान से नीचे की ओर गति को दर्शाता है; ‘ऊपर से’ इसे स्पष्ट रखता है। ‘नगर की दीवार’ सैन्य प्रसंग में सामान्य पाठक के लिए स्पष्ट है।
- source_word: וַיָּמָת בְּתֵבֵץ
  choice: जिससे वह तेबेस में मर गया
  rationale: वाव से जुड़ा अगला कथन फेंके गए पाट के परिणाम को बताता है; ‘जिससे’ हिंदी में उस संबंध को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: לָמָּה נִגַּשְׁתֶּם אֶל־הַחוֹמָה
  choice: तुम नगर की दीवार के पास क्यों गए?
  rationale: נגשׁ का अर्थ निकट जाना है। अनावश्यक तीव्रता जोड़े बिना प्रश्न और निहित फटकार सुरक्षित रहती है।
- source_word: וְאָמַרְתָּ
  choice: तब तुम कहना
  rationale: संदेशवाहक को दी गई आज्ञा और घटनाक्रम का क्रम संक्षिप्त, स्वाभाविक हिंदी में व्यक्त होता है।
- source_word: גַּם
  choice: भी
  rationale: ऊरिय्याह की मृत्यु को अन्य हताहतों के साथ जोड़ने वाला योगात्मक बल सुरक्षित रहता है।
- source_word: עַבְדְּךָ
  choice: आपका सेवक
  rationale: राजा को संबोधित करते समय עבד अधीनता और दरबारी विनम्रता का पद है; ‘सेवक’ इस प्रसंग के सामाजिक भाव के अनुकूल है।
- source_word: אוּרִיָּה הַחִתִּי
  choice: हित्ती ऊरिय्याह
  rationale: जातीय विशेषण को नाम से पहले रखना हिंदी में सहज है और स्रोत की पहचान को पूरा रखता है।
theological_decisions:
- issue: अबीमेलेक की मृत्यु के लिए स्त्री के प्रहार को उत्तरदायी बताना
  choice: ‘जिससे वह ... मर गया’ के रूप में स्रोत का कारणात्मक कथन बनाए रखा
  alternative: न्यायियों 9:54 के आधार पर उसके हथियार ढोने वाले को प्रत्यक्ष हत्यारा बताना
  rationale: यह पद स्त्री द्वारा फेंके गए पाट और अबीमेलेक की मृत्यु को सीधे जोड़ता है। समानांतर वृत्तांत में बाद की घटना होने पर भी इस पद के आलंकारिक कथन को चुपचाप संशोधित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण कथात्मक शैली रखी गई है। प्रत्यक्ष कथन के भीतर प्रश्न और निर्देश की संरचना सुरक्षित है। ‘नगर की दीवार’ सामान्य पाठक के लिए ‘शहरपनाह’ से अधिक पारदर्शी है; नामों का देवनागरी लिप्यंतरण प्रचलित हिंदी बाइबलीय रूपों के निकट रखा गया है।
