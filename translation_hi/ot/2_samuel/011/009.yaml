- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  choice: राजमहल के द्वार पर
  rationale: פֶּתַח प्रवेश-द्वार को सूचित करता है। בֵּית הַמֶּלֶךְ का शाब्दिक अर्थ ‘राजा का घर’ है, पर इस राजकीय संदर्भ में ‘राजमहल’ आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: אֵת כָּל עַבְדֵי אֲדֹנָיו
  choice: अपने स्वामी के सब सेवकों के साथ
  rationale: אֵת यहाँ संगति/साथ होने का भाव देता है; עֲבָדִים के लिए ‘सेवक’ उपयुक्त है और אֲדֹנָיו मानवीय अधिकारी दाऊद के लिए ‘अपने स्वामी’ है।
- source_word: וְלֹא יָרַד אֶל בֵּיתוֹ
  choice: और अपने घर नहीं गया
  rationale: हिब्रू में ‘नीचे नहीं गया’ है, पर हिन्दी में गंतव्य के साथ ‘अपने घर नहीं गया’ अधिक स्वाभाविक है; स्थानगत ‘नीचे’ का भाव पादटिप्पणी में सुरक्षित है।
