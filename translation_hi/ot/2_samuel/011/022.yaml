  text: So the messenger went and came and told David all that Joab had sent him to say[a].
translation:
  language: hi
  text: तब दूत गया और आकर उसने दाऊद को वह सब बताया जो योआब ने उसे कहने के लिए भेजा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “वह सब जो योआब ने उसे भेजा था।” प्रसंग में अर्थ है कि दूत ने वह सब बताया जो योआब ने उसे कहने के लिए भेजा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: दूत
  rationale: यहाँ सैन्य संदेश पहुँचाने वाला मनुष्य अभिप्रेत है; इसलिए ‘दूत’ स्वाभाविक है, ‘स्वर्गदूत’ नहीं।
- source_word: וַיֵּלֶךְ ... וַיָּבֹא
  choice: गया और आकर
  rationale: यह चयन इब्रानी कथात्मक क्रम—‘गया’ और ‘आया’—को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַיַּגֵּד לְדָוִד
  choice: उसने दाऊद को ... बताया
  rationale: हिफ़ील क्रिया का अर्थ यहाँ सूचना देना या बताना है; यह हिन्दी में सरल और प्रसंगानुकूल है।
- source_word: אֵת כָּל אֲשֶׁר
  choice: वह सब
  rationale: यह संदेश की संपूर्ण विषयवस्तु को व्यक्त करता है और כָּל की व्यापकता बनाए रखता है।
- source_word: שְׁלָחוֹ יוֹאָב
  choice: जिसके लिए योआब ने उसे भेजा था
  rationale: इब्रानी का शाब्दिक अर्थ ‘जो योआब ने उसे भेजा’ है। हिन्दी में यह रूप दूत को भेजने के संप्रेषणात्मक उद्देश्य को स्पष्ट करता है, पर विशिष्ट कथन जोड़ता नहीं।
- source_word: לְדָוִד
  choice: दाऊद
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
