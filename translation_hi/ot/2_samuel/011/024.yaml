  rationale: ירה के क्रियात्मक अर्थ और מוֹרִים के सैन्य संदर्भ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; केवल ‘चलानेवालों’ जैसा असहज शाब्दिक रूप टाला गया है।
- source_word: אֶל עֲבָדֶיךָ
  choice: आपके सेवकों पर
  rationale: तीर चलाने के साथ אֶל को हिन्दी में स्वाभाविक रूप से ‘पर’ कहा गया है, जबकि ‘सेवक’ राजदरबारी संबोधन की विनम्रता बनाए रखता है।
- source_word: מֵעַל הַחוֹמָה
  choice: दीवार के ऊपर से
  rationale: מֵעַל की ऊँचे स्थान से होने वाली क्रिया को स्पष्ट और सरल हिन्दी में व्यक्त करता है।
- source_word: וַיָּמֻתוּ מֵעַבְדֵי הַמֶּלֶךְ
  choice: राजा के सेवकों में से कुछ मर गए
  rationale: מִן के अंशवाचक प्रयोग को ‘में से कुछ’ द्वारा सुरक्षित रखा गया है और מוּת को अनावश्यक रूप से ‘मारे गए’ नहीं बनाया गया।
- source_word: וְגַם
  choice: भी
  rationale: उरिय्याह की मृत्यु को पिछली मृत्यु-सूचना में अतिरिक्त और चरम सूचना के रूप में जोड़ता है।
- source_word: עַבְדְּךָ אוּרִיָּה הַחִתִּי
  choice: आपका सेवक हित्ती उरिय्याह
  rationale: दरबारी विनम्र संबोधन और उरिय्याह की जातीय पहचान दोनों सुरक्षित हैं।
- source_word: מֵת
  choice: मर गया
  rationale: इब्रानी स्थिति-सूचक रूप का कथात्मक संदर्भ में स्वाभाविक हिन्दी समतुल्य है; ‘मृत है’ की संभावना पादटिप्पणी में दी गई है।
