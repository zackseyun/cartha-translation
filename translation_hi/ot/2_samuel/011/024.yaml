  text: The archers shot at your servants from atop the wall[a], and some of the king’s servants died[b]; your servant Uriah the Hittite also died.
translation:
  language: hi
  text: धनुर्धारियों ने दीवार के ऊपर से आपके सेवकों पर तीर चलाए, और राजा के सेवकों में से कुछ मर गए[a]; आपका सेवक हित्ती ऊरिय्याह भी मर गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पूर्वसर्ग का अर्थ यहाँ अंशवाचक हो सकता है: ‘राजा के सेवकों में से कुछ’।'
    reason: lexical_alternative
  - marker: b
    text: या, ‘मृत है’; इब्रानी रूप मृत्यु के परिणामस्वरूप बनी अवस्था भी व्यक्त कर सकता है।
    reason: lexical_alternative
