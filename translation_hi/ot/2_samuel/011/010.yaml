reference: 2 Samuel 11:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּגִּ֤דוּ לְ/דָוִד֙ לֵ/אמֹ֔ר לֹֽא יָרַ֥ד אוּרִיָּ֖ה אֶל בֵּית֑/וֹ וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אוּרִיָּ֗ה הֲ/ל֤וֹא מִ/דֶּ֨רֶךְ֙ אַתָּ֣ה בָ֔א מַדּ֖וּעַ לֹֽא יָרַ֥דְתָּ אֶל בֵּיתֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/010.yaml
  text: They told David[a], saying, “Uriah did not go down to his house.” So David said to Uriah[b], “Have you not come from a journey? Why did you not go down to your house?”
translation:
  language: hi
  text: लोगों ने दाऊद को बताया, “ऊरिय्याह अपने घर नहीं उतरा[a]।” तब दाऊद ने ऊरिय्याह से कहा, “क्या तुम यात्रा[b] से नहीं आए हो? तुम अपने घर क्यों नहीं उतरे?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “अपने घर उतरना” है, अर्थात अपने घर जाना। संभवतः यह ऊँचे स्थान या राजकीय परिसर से निवास की ओर जाने को दर्शाता है।
    reason: cultural_note
  - marker: b
    text: या “मार्ग से।” इब्रानी अभिव्यक्ति का अर्थ यात्रा करके आना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: लोगों ने दाऊद को बताया
  rationale: क्रिया बहुवचन है, पर कर्ता अनिर्दिष्ट है। ‘लोगों ने ... बताया’ हिन्दी में स्वाभाविक ढंग से सूचना दिए जाने को व्यक्त करता है; प्रत्यक्ष कथन के कारण לֵאמֹר का कार्य विराम-चिह्नों से स्पष्ट हो जाता है।
- source_word: לֹא יָרַד אוּרִיָּה אֶל־בֵּיתוֹ / לֹא יָרַדְתָּ אֶל־בֵּיתֶךָ
  choice: ऊरिय्याह अपने घर नीचे नहीं गया / तुम अपने घर नीचे क्यों नहीं गए
  rationale: יָרַד का मूल अर्थ ‘नीचे जाना’ है। दोनों स्थानों पर समान अभिव्यक्ति रखकर इब्रानी की अर्थपूर्ण पुनरावृत्ति और भौगोलिक/दरबारी दिशा-सूचक भाव सुरक्षित रखा गया है।
- source_word: וַיֹּאמֶר דָּוִד אֶל־אוּרִיָּה
  choice: तब दाऊद ने ऊरिय्याह से कहा
  rationale: ‘तब’ कथा की अगली घटना और सूचना पर दाऊद की प्रतिक्रिया को सहज आधुनिक हिन्दी में जोड़ता है।
- source_word: הֲלוֹא
  choice: क्या ... नहीं
  rationale: यह नकारात्मक प्रश्न सकारात्मक उत्तर की अपेक्षा रखता है। हिन्दी का ‘क्या ... नहीं’ उसी आलंकारिक बल को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: מִדֶּרֶךְ
  choice: यात्रा से
  rationale: דֶּרֶךְ का मूल अर्थ ‘मार्ग’ है, पर इस प्रयोग में मार्ग से आने अर्थात यात्रा करके आने का भाव है। ‘यात्रा से’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בָא
  choice: आए हो
  rationale: בוא की सामान्य क्रिया ‘आना’ है। ‘लौटना’ प्रसंग में संभव होता, पर वह मूल पाठ से अधिक विशिष्ट अर्थ जोड़ देता।
- source_word: מַדּוּעַ
  choice: क्यों
  rationale: कारण पूछने वाले इस सामान्य प्रश्नवाचक का सीधा और स्वाभाविक हिन्दी समतुल्य ‘क्यों’ है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘नीचे जाना’ सामान्य हिन्दी में कुछ असामान्य लग सकता है, फिर भी मूल पाठ की दोहरी पुनरावृत्ति और स्थानिक संकेत बनाए रखने के लिए इसे रखा गया है तथा पादटिप्पणी में स्पष्ट किया गया है। दाऊद के प्रश्न में ‘तुम’ तत्काल और सीधा संबोधन देता है, जबकि क्रियारूप स्वाभाविक आधुनिक हिन्दी के अनुसार हैं।
