  text: וַ/יִּשְׁלַח֩ דָּוִ֨ד מַלְאָכִ֜ים וַ/יִּקָּחֶ֗/הָ וַ/תָּב֤וֹא אֵלָי/ו֙ וַ/יִּשְׁכַּ֣ב עִמָּ֔/הּ וְ/הִ֥יא מִתְקַדֶּ֖שֶׁת מִ/טֻּמְאָתָ֑/הּ וַ/תָּ֖שָׁב אֶל בֵּיתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/004.yaml
  text: So David sent messengers and took her[a], and she came to him, and he lay with her. Now she was purifying herself from her uncleanness. Then she returned to her house.
translation:
  language: hi
  text: तब दाऊद ने दूत भेजकर उसे बुलवा लिया[a]। वह उसके पास आई, और वह उसके साथ सोया। और वह अपनी अशुद्धता से शुद्ध हो रही थी[b]। फिर वह अपने घर लौट गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे ले आया।” हिब्रू में शाब्दिक अर्थ “उसे ले लिया” है; यहाँ भाव यह हो सकता है कि दाऊद ने दूतों के द्वारा उसे अपने पास बुलवा लिया।
    reason: शाब्दिक अर्थ और प्रसंगानुकूल कारक भाव दोनों को सुरक्षित रखना।
  - marker: b
    text: या, “वह अपनी अशुद्धता से शुद्ध हो चुकी थी।” हिब्रू इस उपवाक्य को मासिक धर्म के बाद की अनुष्ठानिक शुद्धि के विषय में पृष्ठभूमिगत टिप्पणी के रूप में भी व्यक्त कर सकता है।
    reason: हिब्रू कृदंत के कालगत/पृष्ठभूमिगत कार्य की वैकल्पिक समझ को सुरक्षित रखना, बिना नैतिक निष्कर्ष जोड़े।
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד מַלְאָכִים
  choice: दाऊद ने दूत भेजकर
  rationale: שלח और מַלְאָכִים को स्वाभाविक हिन्दी कथा-शैली में व्यक्त करता है; यहाँ מַלְאָכִים मनुष्य-दूत हैं।
- source_word: וַיִּקָּחֶהָ
  choice: उसे बुलवा लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर भेजे गए दूतों के प्रसंग में कारक क्रिया ‘बुलवा लिया’ हिन्दी में स्वाभाविक है और दाऊद की पहल तथा अधिकारपूर्ण कार्रवाई को बनाए रखती है। शाब्दिक ‘उसे ले लिया’ हिन्दी में यौन क्रिया का संकेत देकर अगली पंक्ति को समय से पहले मिला सकता है।
- source_word: וַתָּבוֹא אֵלָיו
  choice: वह उसके पास आई
  rationale: गति-सूचक क्रिया और אֵלָיו का सीधा, सहज अनुवाद।
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: वह उसके साथ सोया
  rationale: שכב עם का प्रचलित बाइबिलीय यौन मुहावरा आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण ढंग से व्यक्त होता है।
- source_word: וְהִיא מִתְקַדֶּשֶׁת מִטֻּמְאָתָהּ
  choice: उस समय वह अपनी अशुद्धता से शुद्ध हो रही थी
  rationale: हित्पअेल कृदंत को पृष्ठभूमि में चल रही धार्मिक शुद्धि के रूप में रखा गया है। ‘अशुद्धता’ טֻמְאָה की अनुष्ठानिक श्रेणी को व्यक्त करती है, नैतिक दोष को नहीं।
- source_word: וַתָּשָׁב אֶל־בֵּיתָהּ
  choice: फिर वह अपने घर लौट गई
  rationale: कथा के अगले क्रम और בית के सामान्य अर्थ को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: अनुष्ठानिक शुद्धि वाले उपवाक्य का समय और आशय
  choice: 'इसे पृष्ठभूमि में जारी प्रक्रिया के रूप में अनूदित किया गया: ‘उस समय वह अपनी अशुद्धता से शुद्ध हो रही थी।’'
  alternative: ‘वह अपनी अशुद्धता से शुद्ध हो चुकी थी।’
  rationale: हिब्रू कृदंत स्वाभाविक रूप से समकालीन अथवा पृष्ठभूमिगत स्थिति बता सकता है, जबकि प्रसंग इसे पहले पूरी हो चुकी शुद्धि भी समझने की गुंजाइश देता है। मुख्य पाठ कृदंत का रूप बनाए रखता है और पाद-टिप्पणी वास्तविक कालगत अस्पष्टता बताती है। यह मासिक धर्म के बाद की अनुष्ठानिक शुद्धि का संकेत है; इससे बतशेबा के नैतिक दोष या निर्दोषता पर अतिरिक्त निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, संक्षिप्त और गरिमापूर्ण कथा-शैली। यौन क्रिया को स्पष्ट किन्तु अश्लीलता-विहीन मुहावरे में और טֻמְאָה को नैतिक नहीं, अनुष्ठानिक ‘अशुद्धता’ के रूप में व्यक्त किया गया है।
