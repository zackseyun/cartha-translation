base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/017.yaml
  text: The men of the city came out and fought against Joab[a], and some of the people among David’s servants fell[b]; Uriah the Hittite also died.
translation:
  language: hi
  text: नगर के पुरुष बाहर निकले और योआब के विरुद्ध लड़े। दाऊद के सेवकों में से कुछ लोग गिर पड़े[a], और हित्ती ऊरिय्याह भी मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी का शाब्दिक क्रम है, ‘लोगों में से, दाऊद के सेवकों में से, कुछ गिर पड़े’; यह अंशवाचक अभिव्यक्ति बताती है कि दाऊद के कुछ सेवक युद्ध में हताहत हुए।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: बाहर निकले
  rationale: יצא का अर्थ बाहर निकलना है। हिंदी में ‘बाहर निकले’ स्वाभाविक है और आने-जाने की दृष्टि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אַנְשֵׁי הָעִיר
  choice: नगर के पुरुष
  rationale: यह रचना शाब्दिक रूप से ‘नगर के पुरुष’ है और संदर्भ में पुरुष योद्धाओं को सूचित करती है।
- source_word: וַיִּלָּחֲמוּ אֶת יוֹאָב
  choice: योआब के विरुद्ध लड़े
  rationale: युद्ध-संबंधी इस इब्रानी प्रयोग में योआब विरोधी पक्ष है; ‘के विरुद्ध’ वैरपूर्ण मुठभेड़ को स्पष्ट और स्वाभाविक रूप में व्यक्त करता है।
- source_word: וַיִּפֹּל
  choice: गिर पड़े
  rationale: युद्ध में हताहत होने के लिए प्रयुक्त इब्रानी मुहावरे ‘गिरना’ को बनाए रखा गया है; बहुवचन हिंदी में उस समूह के कुछ सदस्यों के लिए स्वाभाविक है।
- source_word: מִן הָעָם מֵעַבְדֵי דָוִד
  choice: दाऊद के सेवकों में से कुछ लोग
  rationale: 'दोनों מן-वाक्यांश अंशवाचक हैं: दाऊद के सेवकों में से कुछ व्यक्ति। यह हिंदी में अर्थ स्पष्ट रखते हुए मूल की संरचना का प्रतिनिधित्व करता है।'
- source_word: וַיָּמָת גַּם אוּרִיָּה הַחִתִּי
  choice: और हित्ती ऊरिय्याह भी मर गया
  rationale: גם का योगात्मक बल ‘भी’ से व्यक्त किया गया है, जिससे अन्य हताहतों के साथ ऊरिय्याह की मृत्यु पर कथात्मक जोर बना रहता है।
- source_word: הַחִתִּי
  choice: हित्ती
  rationale: यह ऊरिय्याह की जातीय पहचान का प्रचलित हिंदी बाइबलीय रूप है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘गिर पड़े’ युद्ध-संदर्भ के मूल मुहावरे को सुरक्षित रखता है, जबकि अगला खंड ऊरिय्याह के विषय में स्पष्ट रूप से ‘मर गया’ कहता है।
