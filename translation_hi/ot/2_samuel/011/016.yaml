  text: So when Joab was watching the city[a], he stationed Uriah in the place where he knew the mighty men were.
translation:
  language: hi
  text: जब योआब नगर पर निगरानी रख रहा था, तब उसने ऊरिय्याह को उस स्थान पर तैनात किया जहाँ वह जानता था कि पराक्रमी योद्धा[a] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सक्षम लड़ाके” अथवा “दुर्जेय योद्धा।” इब्रानी पद אַנְשֵׁי חַיִל यहाँ युद्ध में निपुण और शक्तिशाली पुरुषों को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁמֹר ... אֶל־הָעִיר
  choice: जब ... नगर पर निगरानी रख रहा था
  rationale: בְּ के साथ infinitive construct यहाँ समयसूचक उपवाक्य बनाता है। सैन्य प्रसंग में שׁמר का भाव नगर की गतिविधियों पर नज़र रखने का है; यह अनुवाद मूल की निगरानी की धारणा को बनाए रखता है और केवल पूर्वसर्ग के आधार पर ‘नगर के विरुद्ध’ जैसा अधिक तीखा अर्थ नहीं जोड़ता।
- source_word: וַיִּתֵּן אֶת־אוּרִיָּה
  choice: उसने ऊरिय्याह को ... तैनात किया
  rationale: נתן का मूल अर्थ ‘रखना/देना’ है, पर सैनिक को रणनीतिक स्थान पर रखने के प्रसंग में ‘तैनात किया’ स्वाभाविक और सटीक है।
- source_word: הַמָּקוֹם
  choice: उस स्थान
  rationale: מקום का सामान्य अर्थ ‘स्थान’ है; संकेतवाचक ‘उस’ प्रसंग में निर्दिष्ट रणनीतिक जगह को स्पष्ट करता है।
- source_word: יָדַע
  choice: वह जानता था
  rationale: ידע का सीधा अर्थ ‘जानना’ है; यहाँ किसी अधिक व्याख्यात्मक अर्थ की आवश्यकता नहीं है।
- source_word: אַנְשֵׁי חַיִל
  choice: पराक्रमी योद्धा
  rationale: यह पद सक्षम, शक्तिशाली या दुर्जेय लड़ाकों को सूचित करता है। ‘पराक्रमी योद्धा’ सैन्य अर्थ स्पष्ट करता है और इसे दाऊद के किसी विशिष्ट दल की तकनीकी उपाधि नहीं बनाता।
- source_word: שָׁם
  choice: जहाँ ... थे
  rationale: ‘जहाँ’ के प्रयोग में שָׁם का स्थानवाचक अर्थ स्वाभाविक रूप से समाहित है; अलग से ‘वहाँ’ जोड़ना हिंदी में अनावश्यक पुनरुक्ति होता।
- source_word: וַיְהִי
  choice: जब ... तब
  rationale: וַיְהִי अगले घटनाक्रम को समयसूचक ढंग से आरंभ करता है। हिंदी में ‘जब ... तब’ सहज कथात्मक संबंध व्यक्त करता है।
