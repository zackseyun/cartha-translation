translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सहज किंतु गरिमापूर्ण रखी गई है। सैन्य प्रसंग को ‘निगरानी’ और ‘तैनात’ से स्पष्ट किया गया है, जबकि मूल के किसी संभावित तकनीकी या सांप्रदायिक अर्थ को नहीं जोड़ा गया। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न ‘city’ के बाद था, पर उसकी विषयवस्तु אַנְשֵׁי חַיִל से संबंधित है; इसलिए हिंदी में चिह्न उचित रूप से ‘पराक्रमी योद्धा’ के बाद रखा गया है।
