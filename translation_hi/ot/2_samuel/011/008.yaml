  text: Then David said to Uriah[a], “Go down to your house and wash your feet.” So Uriah went out from the king’s house[b], and a present from the king went out after him.
translation:
  language: hi
  text: तब दाऊद ने ऊरिय्याह से कहा, “अपने घर उतर जा और अपने पैर धो।” तब ऊरिय्याह राजा के भवन से निकल गया, और राजा की ओर से एक भेंट[a] उसके पीछे भेजी गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राजा की ओर से भेजा गया अंश।” इब्रानी शब्द का अर्थ ऐसी वस्तु हो सकता है जो ले जाई या भेजी जाए; यह भोजन के अंश या उपहार के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵד
  choice: उतर जा
  rationale: क्रिया ירד के दिशासूचक अर्थ ‘नीचे जाना/उतरना’ को सुरक्षित रखता है और राजभवन से घर जाने के प्रसंग में स्वाभाविक है।
- source_word: לְבֵיתְךָ
  choice: अपने घर
  rationale: בית का सीधा अर्थ ‘घर’ है; संबंधसूचक प्रत्यय को ‘अपने’ से व्यक्त किया गया है।
- source_word: וּרְחַץ רַגְלֶיךָ
  choice: और अपने पैर धो
  rationale: मूल ठोस अभिव्यक्ति को बनाए रखता है; इसमें यात्रा के बाद विश्राम और ताज़गी पाने का सांस्कृतिक संकेत भी हो सकता है, पर उसे मुख्य पाठ में स्पष्ट नहीं किया गया।
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: राजा के भवन से
  rationale: शाब्दिक ‘राजा के घर से’ को प्रसंगानुकूल ‘राजा के भवन से’ किया गया है, जो राजकीय निवास को स्पष्ट करता है और अनावश्यक रूप से आधुनिक ‘महल’ नहीं थोपता।
- source_word: מַשְׂאַת הַמֶּלֶךְ
  choice: राजा की ओर से भेजी गई भेंट
  rationale: מַשְׂאֵת किसी उठाई, पहुँचाई या भेजी गई वस्तु, अंश अथवा उपहार को सूचित कर सकता है। यहाँ ऊरिय्याह के पीछे भेजी गई वस्तु के लिए ‘भेंट’ स्वाभाविक है; ‘भेजी गई’ क्रियात्मक प्रसंग स्पष्ट करता है।
- source_word: אַחֲרָיו
  choice: उसके पीछे
  rationale: ऊरिय्याह के बाद किसी वस्तु के भेजे जाने का क्रम और दिशा दोनों स्वाभाविक हिंदी में व्यक्त होते हैं।
