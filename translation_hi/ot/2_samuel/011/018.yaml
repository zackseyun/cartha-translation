translation:
  language: hi
  text: तब योआब ने दाऊद के पास संदेश भेजकर युद्ध का पूरा समाचार बताया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: संदेश भेजकर
  rationale: שׁלח का मूल अर्थ ‘भेजना’ है। अगले क्रियापद ‘बताया’ के साथ यह किसी दूत अथवा संदेश के द्वारा समाचार भेजने का भाव देता है; आधुनिक हिन्दी में ‘संदेश भेजकर’ स्वाभाविक है।
- source_word: יוֹאָב
  choice: योआब
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וַיַּגֵּד לְדָוִד
  choice: दाऊद के पास ... उसे ... बताया
  rationale: हिफ़ील נגד का अर्थ ‘बताना/सूचित करना’ है। לְדָוִד संदेश के प्राप्तकर्ता को दर्शाता है; हिन्दी में ‘दाऊद के पास संदेश भेजकर उसे ... बताया’ संबंध को स्पष्ट और सहज रखता है।
- source_word: אֵת כָּל דִּבְרֵי הַמִּלְחָמָה
  choice: युद्ध का पूरा समाचार
  rationale: शाब्दिक रूप ‘युद्ध की सारी बातें’ है, पर कथात्मक प्रसंग में דִּבְרֵי युद्ध के विवरण अथवा समाचार को सूचित करता है। ‘पूरा समाचार’ כָּל के समग्र भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמִּלְחָמָה
  choice: युद्ध
  rationale: מִלְחָמָה युद्ध या लड़ाई को दर्शाता है। इस सैन्य कार्रवाई के संदर्भ में ‘युद्ध’ गरिमापूर्ण और सामान्य हिन्दी विकल्प है।
