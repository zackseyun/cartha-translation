translation:
  language: hi
  text: जब ऊरिय्याह उसके पास आया, तब दाऊद ने योआब के कुशल-क्षेम, सैनिकों के कुशल-क्षेम और युद्ध की स्थिति के बारे में पूछा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: आया
  rationale: בוא का सामान्य अर्थ ‘आना’ है; אֵלָיו के साथ यह स्वाभाविक रूप से ‘उसके पास आया’ बनता है।
- source_word: אֵלָיו
  choice: उसके पास
  rationale: यह दाऊद की ओर आने को व्यक्त करता है; निकटवर्ती संदर्भ से सर्वनाम का संकेत स्पष्ट है।
- source_word: וַיִּשְׁאַל
  choice: पूछा
  rationale: שׁאל यहाँ हाल-चाल और युद्ध की स्थिति जानने के लिए किए गए प्रश्न को दर्शाता है।
- source_word: לִשְׁלוֹם
  choice: कुशल-क्षेम … स्थिति
  rationale: שָׁלוֹם की तीन समानांतर आवृत्तियाँ व्यक्ति या सेना के संबंध में कुशलता और युद्ध के संबंध में उसकी दशा या प्रगति का बोध कराती हैं। हिन्दी में ‘युद्ध का कुशल-क्षेम’ अस्वाभाविक है, इसलिए तीसरी आवृत्ति को ‘युद्ध की स्थिति’ कहा गया है।
- source_word: יוֹאָב
  choice: योआब
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: הָעָם
  choice: सैनिकों
  rationale: עָם का मूल अर्थ ‘लोग’ है, पर सैन्य अभियान के इस संदर्भ में इसका संकेत योआब के अधीन लड़ रहे सैनिकों की ओर है।
- source_word: הַמִּלְחָמָה
  choice: युद्ध
  rationale: מִלְחָמָה यहाँ चल रहे सैन्य अभियान या युद्ध को दर्शाता है।
