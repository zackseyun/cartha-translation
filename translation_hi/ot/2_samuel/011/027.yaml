  edition: WLC
  text: וַ/יַּעֲבֹ֣ר הָ/אֵ֗בֶל וַ/יִּשְׁלַ֨ח דָּוִ֜ד וַ/יַּאַסְפָ֤/הּ אֶל בֵּית/וֹ֙ וַ/תְּהִי ל֣/וֹ לְ/אִשָּׁ֔ה וַ/תֵּ֥לֶד ל֖/וֹ בֵּ֑ן וַ/יֵּ֧רַע הַ/דָּבָ֛ר אֲשֶׁר עָשָׂ֥ה דָוִ֖ד בְּ/עֵינֵ֥י יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/027.yaml
  text: When the mourning was over[a], David sent and brought her into his house, and she became his wife and bore him a son. But the thing that David had done was evil in the eyes of Yahweh.
translation:
  language: hi
  text: जब शोक का समय बीत गया, तब दाऊद ने उसे बुलवा लिया और अपने घर ले आया। वह उसकी पत्नी हो गई और उसने दाऊद के एक पुत्र को जन्म दिया। परन्तु दाऊद ने जो काम किया था, वह यहोवा की दृष्टि में बुरा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֵבֶל
  choice: शोक का समय
  rationale: यह ऊरिय्याह की मृत्यु के बाद मनाए गए सामाजिक और रीति-संबंधी शोक को सूचित करता है; केवल आंतरिक दुःख की अपेक्षा यह वाक्यांश प्रसंग को अधिक स्पष्ट करता है।
- source_word: וַיַּעֲבֹר
  choice: बीत गया
  rationale: समय अथवा अवधि के विषय में यह स्वाभाविक हिन्दी है और इब्रानी के क्रमिक कथन को बनाए रखती है।
- source_word: וַיִּשְׁלַח
  choice: बुलवा लिया
  rationale: इब्रानी में शाब्दिक रूप से 'भेजा' है, पर आगे स्त्री को घर लाने के संदर्भ में इसका आशय किसी को भेजकर उसे बुलवाना है।
- source_word: וַיַּאַסְפָהּ אֶל־בֵּיתוֹ
  choice: उसे अपने घर ले आया
  rationale: אָסַף यहाँ उसे अपने घराने में लाने को व्यक्त करता है; हिन्दी में यह सहज और अर्थ-सटीक है।
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: वह उसकी पत्नी हो गई
  rationale: यह रचना स्त्री की वैवाहिक स्थिति में आए परिवर्तन को दर्शाती है।
- source_word: וַתֵּלֶד לוֹ בֵּן
  choice: उसने उसके लिए एक पुत्र को जन्म दिया
  rationale: अप्रत्यक्ष कर्म לוֹ को बनाए रखते हुए यह आधुनिक हिन्दी में स्पष्ट है।
- source_word: הַדָּבָר אֲשֶׁר עָשָׂה דָוִד
  choice: दाऊद ने जो काम किया था
  rationale: דָּבָר यहाँ कथन नहीं, बल्कि किए गए कार्य या मामले को सूचित करता है।
- source_word: וַיֵּרַע
  choice: बुरा था
  rationale: यह केवल अप्रसन्नता नहीं, बल्कि नैतिक मूल्यांकन व्यक्त करता है; 'बुरा' मूल की स्पष्ट निन्दा को बनाए रखता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: यह प्रचलित हिन्दी मुहावरा इब्रानी के दृष्टि-रूपक और परमेश्वर के नैतिक मूल्यांकन दोनों को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम की प्रचलित बाइबलीय लिप्यन्तरण-परम्परा के अनुसार, इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: दाऊद के कार्य पर कथावाचक का नैतिक निर्णय
  choice: यहोवा की दृष्टि में बुरा था
  alternative: यहोवा को अप्रिय लगा
  rationale: וַיֵּרַע में स्पष्ट नैतिक निन्दा है। 'अप्रिय लगा' इसे केवल प्रतिक्रिया या रुचि का विषय बना सकता है और मूल की शक्ति को कम कर सकता है।
- issue: यहोवा नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत नाम יהוה है; हिन्दी पाठक के लिए परिचित 'यहोवा' इस नाम को उपाधि में बदले बिना प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। वाक्य-विन्यास इब्रानी घटनाक्रम का अनुसरण करता है, पर अत्यधिक शाब्दिक या अस्वाभाविक पदावली से बचता है।
