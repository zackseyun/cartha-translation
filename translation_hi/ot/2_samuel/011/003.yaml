base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/003.yaml
  text: So David sent and inquired about the woman, and someone said, “Is this not Bathsheba, the daughter of Eliam, the wife of Uriah the Hittite?”
translation:
  language: hi
  text: तब दाऊद ने उस स्त्री के विषय में पूछताछ करने के लिए किसी को भेजा। किसी ने[a] कहा, “क्या यह बतशेबा नहीं है—एलीआम की बेटी और हित्ती ऊरिय्याह की पत्नी?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से “उसने कहा” है; वक्ता का नाम नहीं बताया गया है।
    reason: मूल पाठ में क्रिया का कर्ता अस्पष्ट है; मुख्य पाठ का ‘किसी ने’ प्रसंगानुकूल है, पर शाब्दिक रूप को दर्ज करना आवश्यक है।
lexical_decisions:
- source_word: וַיִּדְרֹשׁ לָאִשָּׁה
  choice: उस स्त्री के विषय में पूछताछ करने
  rationale: क्रिया דָּרַשׁ यहाँ किसी व्यक्ति के बारे में जानकारी लेने या पूछताछ करने का भाव देती है; ‘के विषय में’ हिब्रू संबंधसूचक לְ का स्वाभाविक हिन्दी रूप है।
- source_word: בַּת שֶׁבַע
  choice: बतशेबा
  rationale: हिब्रू नाम का प्रचलित और पहचानने योग्य हिन्दी लिप्यंतरण।
- source_word: הַחִתִּי
  choice: हित्ती
  rationale: जातीय पहचान को विशेषण के रूप में रखा गया है, जैसा स्रोत में है।
theological_decisions:
- issue: וַיֹּאמֶר में वक्ता की पहचान
  choice: किसी ने कहा
  alternative: उसने कहा
  rationale: हिब्रू क्रिया व्याकरणतः पुल्लिंग एकवचन ‘उसने कहा’ है, पर कोई स्पष्ट कर्ता नहीं दिया गया। प्रसंग में दाऊद द्वारा भेजे गए व्यक्ति या किसी अन्य सूचनादाता का कथन अभिप्रेत हो सकता है। ‘किसी ने’ दाऊद को वक्ता मान लेने से बचता है, जबकि पादटिप्पणी मूल की व्याकरणिक अनिश्चितता बताती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। नामों और संबंधों की स्रोत-पाठ वाली क्रमबद्ध पहचान बनाए रखने के लिए डैश का प्रयोग किया गया है।
