  text: उसने संदेशवाहक को आदेश दिया, “जब तुम राजा को युद्ध की सारी बातें[a] बता चुके हो,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युद्ध का पूरा हाल।”
