lexical_decisions:
- source_word: וַיְצַו
  choice: उसने … आदेश दिया
  rationale: צוה का अर्थ अधिकारपूर्वक आदेश देना या निर्देश देना है; प्रसंग में ‘आदेश दिया’ उसका बल और कथात्मक शैली बनाए रखता है।
- source_word: הַמַּלְאָךְ
  choice: संदेशवाहक
  rationale: מַלְאָךְ मनुष्य द्वारा भेजे गए दूत या स्वर्गदूत, दोनों के लिए आ सकता है। यहाँ युद्ध का समाचार पहुँचाने वाला मनुष्य अभिप्रेत है, इसलिए ‘संदेशवाहक’ स्पष्ट और स्वाभाविक है।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष कथन द्वारा व्यक्त
  rationale: यह रूप प्रत्यक्ष वचन का परिचय देता है। हिन्दी में ‘आदेश दिया’ के बाद सीधे उद्धरण से इसका कार्य स्वाभाविक रूप से व्यक्त हो जाता है; अलग से ‘यह कहते हुए’ जोड़ना आवश्यक नहीं है।
- source_word: כְּכַלּוֹתְךָ
  choice: जब तुम … बता चुको
  rationale: כְּ के साथ infinitive construct यहाँ समयसूचक उपवाक्य बनाता है। ‘जब … बता चुको’ कार्य के पूरा हो जाने और उसके बाद की क्रमिकता को सहज हिन्दी में व्यक्त करता है।
- source_word: כָּל דִּבְרֵי הַמִּלְחָמָה
  choice: युद्ध की सारी बातें
  rationale: דְּבָרִים का अर्थ ‘बातें’, ‘मामले’ या प्रसंगानुसार समाचार/विवरण हो सकता है। ‘युद्ध की सारी बातें’ मूल की व्यापकता बनाए रखते हुए हिन्दी में स्वाभाविक है।
- source_word: לְדַבֵּר אֶל הַמֶּלֶךְ
  choice: राजा को … बता चुको
  rationale: शाब्दिक अर्थ ‘राजा से बोलना’ है, पर यहाँ संदेशवाहक द्वारा युद्ध का वृत्तांत देने का भाव है। ‘राजा को … बता चुको’ इस संप्रेषणात्मक कार्य को सहज रूप से व्यक्त करता है।
