  text: וַ/יְהִי֩ לִ/תְשׁוּבַ֨ת הַ/שָּׁנָ֜ה לְ/עֵ֣ת צֵ֣את הַ/מַּלְאֿכִ֗ים וַ/יִּשְׁלַ֣ח דָּוִ֡ד אֶת יוֹאָב֩ וְ/אֶת עֲבָדָ֨י/ו עִמּ֜/וֹ וְ/אֶת כָּל יִשְׂרָאֵ֗ל וַ/יַּשְׁחִ֨תוּ֙ אֶת בְּנֵ֣י עַמּ֔וֹן וַ/יָּצֻ֖רוּ עַל רַבָּ֑ה וְ/דָוִ֖ד יוֹשֵׁ֥ב בִּ/ירוּשָׁלִָֽם׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/001.yaml
  text: At the turn of the year[a], at the time when kings go out to battle, David sent Joab, his servants with him, and all Israel. They devastated the Ammonites and besieged Rabbah[b], but David remained in Jerusalem.
translation:
  language: hi
  text: वर्ष के लौटने के समय[a], जब दूत निकला करते थे[b], दाऊद ने योआब को, उसके साथ अपने सेवकों को, और समस्त इस्राएल को भेजा। उन्होंने अम्मोनियों को तबाह किया और रब्बा को घेर लिया; पर दाऊद यरूशलेम में ही रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘वर्ष के लौटने पर’; संभवतः वसंत ऋतु के सैन्य-अभियान का समय।
    reason: cultural_note
  - marker: b
    text: 'एक अन्य प्राचीन और प्रचलित पठन: ‘जब राजा युद्ध के लिए निकला करते थे।’ 1 इतिहास 20:1 का समानांतर पाठ और यहाँ का सैन्य प्रसंग इस पठन का समर्थन करते हैं; प्रस्तुत इब्रानी पाठ में ‘दूत’ है।'
    reason: alternative_reading
lexical_decisions:
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: वर्ष के लौटने के समय
  rationale: यह इब्रानी मुहावरे के ‘वर्ष के लौटने/फिरने’ के रूप को बनाए रखता है; प्रसंग में संभवतः वसंत के सैन्य-अभियान का समय अभिप्रेत है, पर मुख्य पाठ में ‘वसंत’ कहना अधिक व्याख्यात्मक होता।
- source_word: לְעֵת צֵאת הַמַּלְאָכִים
  choice: जब दूत बाहर निकला करते थे
  rationale: प्रस्तुत WLC पाठ में आलेफ़ सहित מַלְאָכִים और उसकी स्वर-संरचना ‘दूतों’ को दर्शाती है। समानांतर पाठ और सैन्य प्रसंग ‘राजाओं’ की प्राचीन/प्रचलित वैकल्पिक पठन-परंपरा का समर्थन करते हैं, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַיִּשְׁלַח
  choice: भेजा
  rationale: कथात्मक प्रसंग में שלח का सहज और सटीक हिन्दी रूप।
- source_word: עֲבָדָיו
  choice: अपने सेवकों
  rationale: राजकीय सेवा में लगे लोगों के लिए व्यापक मूल अर्थ को बनाए रखता है; ‘अधिकारियों’ या ‘सैनिकों’ से अनावश्यक रूप से अर्थ संकीर्ण नहीं होता।
- source_word: כָּל יִשְׂרָאֵל
  choice: समस्त इस्राएल
  rationale: मूल की सामूहिक अभिव्यक्ति को बनाए रखता है, जो प्रसंग में इस्राएल की युद्ध-सेना को सूचित कर सकती है।
- source_word: וַיַּשְׁחִתוּ
  choice: तबाह किया
  rationale: हिफ़ील क्रिया की विनाशकारी सैन्य कार्रवाई व्यक्त होती है, पर पूर्ण संहार का अनिवार्य संकेत नहीं दिया जाता क्योंकि इसके बाद घेराबंदी जारी है।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोनियों
  rationale: जाति-सूचक इब्रानी पद ‘अम्मोन के पुत्रों’ का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: וַיָּצֻרוּ עַל רַבָּה
  choice: रब्बा को घेर लिया
  rationale: צור עם על नगर की घेराबंदी को दर्शाता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: יוֹשֵׁב
  choice: ही रहा
  rationale: शाब्दिक ‘बैठा/रह रहा था’ के बजाय कथात्मक विरोध को व्यक्त करता है कि सेना निकल गई, पर दाऊद यरूशलेम में ठहरा रहा।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थान-नाम का मानक हिन्दी रूप।
theological_decisions:
- issue: לְעֵת צֵאת הַמַּלְאָכִים का पाठ और अर्थ
  choice: जब दूत बाहर निकला करते थे
  alternative: जब राजा युद्ध के लिए निकला करते थे
  rationale: प्रस्तुत मासोरेटिक स्रोत-पाठ आलेफ़ सहित ‘दूतों’ पढ़ता है, इसलिए उसे मुख्य पाठ में प्राथमिकता दी गई है। फिर भी 1 इतिहास 20:1 का समानांतर पाठ ‘राजाओं’ कहता है और युद्ध-अभियान का प्रसंग उस पठन को बल देता है। वास्तविक पाठगत तनाव को मिटाने के बजाय वैकल्पिक पठन पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘ही रहा’ सेना के निकलने और दाऊद के यरूशलेम में ठहरे रहने का विरोध उभारता है, बिना उसके उद्देश्य या दोष को इस पद में स्पष्ट रूप से जोड़ने के।
