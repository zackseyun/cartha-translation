lexical_decisions:
- source_word: וַתַּהַר
  choice: गर्भवती हुई
  rationale: הרה गर्भ धारण करने अथवा गर्भवती होने की घटना व्यक्त करता है। ‘गर्भवती हुई’ आधुनिक हिन्दी में स्वाभाविक है और यहाँ घटना के भाव को बनाए रखता है।
- source_word: הָאִשָּׁה
  choice: वह स्त्री
  rationale: אִשָּׁה का अर्थ संदर्भ के अनुसार ‘स्त्री’ या ‘पत्नी’ हो सकता है। इस उपवाक्य में वैवाहिक संबंध स्पष्ट रूप से नहीं कहा गया है, इसलिए ‘वह स्त्री’ इब्रानी के सबसे निकट है और पिछली कथा में बतशेबा की ओर संकेत करता है।
- source_word: וַתִּשְׁלַח
  choice: संदेश भिजवाकर
  rationale: שׁלח का शाब्दिक अर्थ ‘भेजना’ है, पर अगले कथन-क्रियापद और दाऊद की ओर संप्रेषण के संदर्भ में संदेश भेजना अभिप्रेत है। ‘संदेश भिजवाकर’ हिन्दी में स्वाभाविक रूप से किसी माध्यम से सूचना पहुँचाने का भाव देता है।
- source_word: וַתַּגֵּד
  choice: कहा
  rationale: Hiphil נגד का अर्थ बताना, सूचित करना या निवेदन करना है। ‘कहा’ प्रत्यक्ष उद्धरण के साथ सरल और स्वाभाविक हिन्दी है; ‘संदेश भिजवाकर’ पहले ही सूचना-संचार का माध्यम स्पष्ट करता है।
- source_word: לְדָוִד
  choice: दाऊद
  rationale: दाऊद हिन्दी बाइबल परंपरा में דָוִד का प्रचलित और सहज नाम-रूप है।
- source_word: הָרָה אָנֹכִי
  choice: मैं गर्भवती हूँ
  rationale: विशेषण הָרָה और सर्वनाम אָנֹכִי वर्तमान अवस्था व्यक्त करते हैं। ‘मैं गर्भवती हूँ’ इसका स्वाभाविक आधुनिक हिन्दी रूप है।
