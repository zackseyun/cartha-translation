base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/025.yaml
  text: Then David said to the messenger[a], “Thus you shall say to Joab, ‘Do not let this matter be evil in your eyes, for the sword devours one as well as another[c][b]. Strengthen your attack against the city and overthrow it.’ And encourage him.”
translation:
  language: hi
  text: तब दाऊद ने दूत से कहा, “तुम योआब से यह कहना, ‘यह बात तुम्हारी दृष्टि में बुरी न हो,[a] क्योंकि तलवार एक को भी, दूसरे को भी निगलती है।[b] नगर पर अपना आक्रमण और तेज़ कर और उसे ढा दे।’ और उसका हौसला बढ़ाना।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह बात तुम्हें बुरी न लगे।” इब्रानी का शाब्दिक अर्थ है, “यह बात तुम्हारी आँखों में बुरी न हो।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी मुहावरे का शाब्दिक रूप है, “क्योंकि तलवार ऐसे और ऐसे निगलती है”; आशय है कि तलवार एक व्यक्ति को भी और दूसरे को भी मारती है।
    reason: idiom_explanation
  - marker: c
    text: या, “और उसे दृढ़ करना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: दूत
  rationale: इस प्रसंग में यह मनुष्य-संदेशवाहक है; ‘दूत’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: כֹּה תֹאמַר
  choice: तुम ... यह कहना
  rationale: यह पहुँचाए जाने वाले संदेश का परिचय देने वाला सूत्र है; हिन्दी में यह रूप स्वाभाविक रहते हुए निर्देश का बल बनाए रखता है।
- source_word: אַל יֵרַע בְּעֵינֶיךָ
  choice: यह बात तुम्हारी दृष्टि में बुरी न हो
  rationale: इब्रानी मुहावरे की ‘आँखों में बुरा होना’ वाली छवि और नैतिक रंग को हिन्दी के प्रचलित ‘दृष्टि में’ रूप से सुरक्षित रखा गया है।
- source_word: כִּי כָזֹה וְכָזֶה תֹּאכַל הֶחָרֶב
  choice: क्योंकि तलवार इसको भी, उसको भी निगलती है
  rationale: ‘इस प्रकार और उस प्रकार’ के अनिश्चित इब्रानी मुहावरे को युद्ध में तलवार के भेदभाव न करने के अर्थ सहित व्यक्त किया गया है, और ‘निगलती है’ से मूल रूपक बचा रहता है।
- source_word: הַחֲזֵק מִלְחַמְתְּךָ אֶל הָעִיר
  choice: नगर के विरुद्ध अपना युद्ध और प्रबल कर
  rationale: חזק और מלחמה दोनों की मूल छवि को रखते हुए ‘और प्रबल कर’ से आक्रमण तेज करने का प्रसंगगत अर्थ स्पष्ट होता है।
- source_word: וְהָרְסָהּ
  choice: और उसे ढा दे
  rationale: नगर के विषय में הרס का अर्थ गिराना या ध्वस्त करना है; ‘ढा दे’ सजीव और सीधा सैन्य-संदर्भीय रूप है।
- source_word: וְחַזְּקֵהוּ
  choice: फिर उसका हौसला बढ़ाना
  rationale: पुल्लिंग एकवचन प्रत्यय सबसे स्वाभाविक रूप से योआब की ओर संकेत करता है। ‘हौसला बढ़ाना’ व्यक्ति को दृढ़ करने का स्वाभाविक आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: וְחַזְּקֵהוּ का संदर्भ और वाक्य-सीमा
  choice: 'इसे दाऊद द्वारा दूत को दिया गया अतिरिक्त निर्देश माना गया: ‘फिर उसका हौसला बढ़ाना।’'
  alternative: 'इसे योआब के लिए भेजे गए उद्धृत संदेश का अंतिम आदेश माना जा सकता है: ‘और उसे दृढ़ कर।’'
  rationale: निकटतम स्वाभाविक पुरुषवाचक संदर्भ योआब है, जबकि आदेश का कर्ता संदेशवाहक है। फिर भी इब्रानी में उद्धरण-चिह्न नहीं हैं, इसलिए वाक्य-सीमा की कुछ अस्पष्टता फुटनोट में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक स्तर रखा गया है। ‘दृष्टि में बुरी’ और ‘तलवार ... निगलती है’ जैसे मूल इब्रानी बिंब जानबूझकर सुरक्षित हैं; कठिन मुहावरे और अंतिम आदेश की वाक्य-सीमा फुटनोटों में स्पष्ट की गई है।
