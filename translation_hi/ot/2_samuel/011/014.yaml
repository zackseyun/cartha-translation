  yaml_path: translation/ot/2_samuel/011/014.yaml
  text: In the morning[a], David wrote a letter to Joab and sent it by the hand of Uriah.
translation:
  language: hi
  text: सुबह दाऊद ने योआब को एक पत्र लिखा और उसे उरिय्याह के हाथ भेज दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: सुबह
  rationale: यह इब्रानी कथानक में अगले घटनाक्रम का समय बताता है। हिंदी में केवल ‘सुबह’ स्वाभाविक रूप से काल-संक्रमण व्यक्त करता है; ‘और ऐसा हुआ कि सुबह’ अनावश्यक रूप से बोझिल होता।
- source_word: וַיִּכְתֹּב
  choice: लिखा
  rationale: लिखने की सामान्य क्रिया के लिए सहज और सीधा हिंदी पर्याय।
- source_word: סֵפֶר
  choice: एक पत्र
  rationale: शब्द सामान्यतः लिखित दस्तावेज़ को सूचित कर सकता है, पर योआब को भेजे गए संदेश के इस प्रसंग में ‘पत्र’ उसका स्वाभाविक संप्रेषणात्मक अर्थ है।
- source_word: אֶל יוֹאָב
  choice: योआब को
  rationale: אֶל यहाँ पत्र के प्राप्तकर्ता को चिह्नित करता है; हिंदी में ‘को’ स्वाभाविक है।
- source_word: וַיִּשְׁלַח
  choice: भेज दिया
  rationale: कथानक में पत्र को रवाना करने की पूर्ण घटना को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: בְּיַד אוּרִיָּה
  choice: उरिय्याह के हाथ
  rationale: मूल का शाब्दिक मुहावरा बनाए रखा गया है। हिंदी में ‘के हाथ भेजना’ स्वाभाविक है और यह अर्थ भी सुरक्षित रखता है कि उरिय्याह स्वयं पत्र लेकर गया।
- source_word: דָּוִד / יוֹאָב / אוּרִיָּה
  choice: दाऊद / योआब / उरिय्याह
  rationale: व्यक्तिनामों के प्रचलित हिंदी बाइबलीय रूप अपनाए गए हैं।
theological_decisions: []
