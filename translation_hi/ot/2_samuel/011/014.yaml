  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल इब्रानी का ‘उरिय्याह के हाथ’ मुहावरा हिंदी में भी स्पष्ट और स्वाभाविक होने के कारण मुख्य पाठ में सुरक्षित रखा गया है; इसलिए अलग पाठ-टिप्पणी आवश्यक नहीं है।
