base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/002.yaml
  text: Then at evening time David arose from his bed and walked on the roof of the king’s house[a], and from the roof he saw a woman bathing[b]; and the woman was very beautiful in appearance.
translation:
  language: hi
  text: शाम के समय दाऊद अपने बिस्तर से उठा और राजमहल की छत पर टहल रहा था। छत से उसने एक स्त्री को नहाते हुए देखा[a]। वह स्त्री देखने में बहुत सुंदर थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी वाक्य का अर्थ यह भी हो सकता है: “उसने छत पर एक स्त्री को नहाते हुए देखा।”'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וַיְהִי לְעֵת הָעֶרֶב
  choice: शाम के समय
  rationale: इब्रानी कथात्मक सूत्र और समय-सूचक वाक्यांश को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; अलग से ‘और ऐसा हुआ’ कहना हिन्दी में अनावश्यक रूप से बोझिल होता।
- source_word: וַיָּקָם ... מֵעַל מִשְׁכָּבוֹ
  choice: अपने बिस्तर से उठा
  rationale: קום और משכב का सीधा, स्वाभाविक अर्थ देता है; यहाँ ‘बिस्तर’ लेटने के स्थान के लिए सामान्य हिन्दी शब्द है।
- source_word: וַיִּתְהַלֵּךְ
  choice: टहलने लगा
  rationale: हित्पएल रूप की जारी अथवा इधर-उधर चलने की क्रिया को व्यक्त करता है, बिना दाऊद की मनोदशा या उद्देश्य का अनुमान लगाए।
- source_word: עַל גַּג בֵּית הַמֶּלֶךְ
  choice: राजमहल की छत पर
  rationale: शाब्दिक ‘राजा के घर’ का प्रसंगानुकूल और सामान्य हिन्दी समतुल्य ‘राजमहल’ है; גג समतल छत को सूचित करता है।
- source_word: וַיַּרְא אִשָּׁה רֹחֶצֶת
  choice: उसने एक स्त्री को नहाते हुए देखा
  rationale: स्त्रीलिंग कृदंत רֹחֶצֶת की जारी क्रिया को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מֵעַל הַגָּג
  choice: छत से
  rationale: दाऊद के देखने के स्थान को दर्शाने वाला सर्वाधिक स्वाभाविक पाठ है, पर इब्रानी में इसके दूसरे संभावित संबंध को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: טוֹבַת מַרְאֶה מְאֹד
  choice: देखने में बहुत सुंदर थी
  rationale: מראה के दृश्य रूप-सौंदर्य पर बल को बनाए रखते हुए आधुनिक हिन्दी में सहज अभिव्यक्ति देता है।
theological_decisions:
- issue: מֵעַל הַגָּג का वाक्यगत संबंध
  choice: 'इसे दाऊद के देखने के स्थान के रूप में लिया गया: ‘छत से उसने... देखा।’'
  alternative: 'इसे स्त्री के नहाने के स्थान से जोड़ना: ‘उसने छत पर एक स्त्री को नहाते देखा।’'
  rationale: शब्दक्रम दोनों संबंधों की कुछ गुंजाइश देता है। प्रमुख पाठ में स्वाभाविक स्थान-सूचक अर्थ चुना गया है, लेकिन वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में रखी गई है; इससे घटना के बारे में अनावश्यक निष्कर्ष नहीं निकाला जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सरल और गरिमापूर्ण रखी गई है। ‘राजमहल’ प्रसंगानुकूल है और ‘टहलने लगा’ क्रिया की जारी प्रकृति दर्शाता है। मुख्य पाठ में केवल वही पादटिप्पणी रखी गई है जो इब्रानी की वास्तविक वाक्यगत अस्पष्टता सुरक्षित करती है।
