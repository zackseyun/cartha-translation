  text: וַ/יִּכְתֹּ֥ב בַּ/סֵּ֖פֶר לֵ/אמֹ֑ר הָב֣וּ אֶת אֽוּרִיָּ֗ה אֶל מוּל֙ פְּנֵ֤י הַ/מִּלְחָמָה֙ הַֽ/חֲזָקָ֔ה וְ/שַׁבְתֶּ֥ם מֵ/אַחֲרָ֖י/ו וְ/נִכָּ֥ה וָ/מֵֽת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/015.yaml
  text: He wrote in the letter[a], saying, "Set Uriah at the front of the hardest fighting, then withdraw from behind him so that he may be struck down and die."
translation:
  language: hi
  text: उसने पत्र में लिखा, “ऊरिय्याह को सबसे भीषण लड़ाई के अग्रिम मोर्चे पर[a] तैनात करो। फिर उसके पीछे से हट जाओ, ताकि वह मारा जाए और मर जाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वहाँ, जहाँ लड़ाई सबसे घमासान हो।”
    reason: यह वैकल्पिक रूप इब्रानी पदबंध के स्थानगत और तीव्रतासूचक भाव को अधिक मुहावरेदार हिन्दी में व्यक्त करता है।
lexical_decisions:
- source_word: וַיִּכְתֹּב בַּסֵּפֶר לֵאמֹר
  choice: उसने पत्र में लिखा
  rationale: कथात्मक भूतकाल और पत्र में लिखे निर्देश का स्वाभाविक हिन्दी रूप; לֵאמֹר को उद्धरण आरम्भ होने से स्पष्ट माना गया है।
- source_word: הָבוּ אֶת אוּרִיָּה
  choice: ऊरिय्याह को … तैनात करो
  rationale: बहुवचन आज्ञार्थक הָבוּ यहाँ युद्ध में किसी व्यक्ति को नियत स्थान पर लगाने का निर्देश देता है; ‘तैनात करो’ सैन्य प्रसंग में स्वाभाविक है।
- source_word: אֶל מוּל פְּנֵי הַמִּלְחָמָה הַחֲזָקָה
  choice: भीषण युद्ध के अगले मोर्चे पर
  rationale: מוּל פְּנֵי सामने और सीधे जोखिम में होने का भाव देता है, जबकि הַחֲזָקָה युद्ध की तीव्रता बताता है। हिन्दी में यह रूप सैन्य स्थिति और भीषणता दोनों को संक्षेप में रखता है।
- source_word: וְשַׁבְתֶּם מֵאַחֲרָיו
  choice: फिर उसके पीछे से हट जाओ
  rationale: पीछे से समर्थन वापस लेने और उसे जानबूझकर असुरक्षित छोड़ने की सामरिक क्रिया को स्पष्ट रखते हुए मूल पदबंध के निकट है।
- source_word: וְנִכָּה וָמֵת
  choice: ताकि वह मारा जाए और मर जाए
  rationale: נכה के निफ़अल रूप और उसके बाद आए अलग क्रिया וָמֵת दोनों को बनाए रखा गया है; हिन्दी में जानबूझकर बनी पुनरुक्ति मूल के दो चरणों और घातक उद्देश्य को सुरक्षित रखती है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। सैन्य प्रसंग के कारण ‘तैनात करो’ और ‘अगले मोर्चे’ का प्रयोग किया गया है; अंतिम दो इब्रानी क्रियाओं की तनावपूर्ण पुनरुक्ति को सरल करने के बजाय सुरक्षित रखा गया है।
