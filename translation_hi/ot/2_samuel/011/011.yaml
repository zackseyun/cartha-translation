  text: וַ/יֹּ֨אמֶר אוּרִיָּ֜ה אֶל דָּוִ֗ד הָ֠/אָרוֹן וְ/יִשְׂרָאֵ֨ל וִֽ/יהוּדָ֜ה יֹשְׁבִ֣ים בַּ/סֻּכּ֗וֹת וַ/אדֹנִ֨/י יוֹאָ֜ב וְ/עַבְדֵ֤י אֲדֹנִ֨/י עַל פְּנֵ֤י הַ/שָּׂדֶה֙ חֹנִ֔ים וַ/אֲנִ֞י אָב֧וֹא אֶל בֵּיתִ֛/י לֶ/אֱכֹ֥ל וְ/לִ/שְׁתּ֖וֹת וְ/לִ/שְׁכַּ֣ב עִם אִשְׁתִּ֑/י חַיֶּ֨/ךָ֙ וְ/חֵ֣י נַפְשֶׁ֔/ךָ אִֽם אֶעֱשֶׂ֖ה אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/011.yaml
  text: Uriah said to David[a], “The ark, and Israel and Judah, are staying in shelters, and my lord Joab and the servants of my lord are camped in the open field. Shall I then go to my house to eat and to drink and to lie with my wife? As surely as you live, and as your soul lives[c][b], I will not do this thing.”
translation:
  language: hi
  text: ऊरिय्याह ने दाऊद से कहा, “सन्दूक और इस्राएल तथा यहूदा अस्थायी छप्परों में रह रहे हैं,[a] और मेरे स्वामी योआब तथा मेरे स्वामी के सेवक खुले मैदान में डेरा डाले हुए हैं। तो क्या मैं अपने घर जाकर खाऊँ-पीऊँ और अपनी पत्नी के साथ सोऊँ?[b] आपके जीवन और आपके प्राण की शपथ, मैं ऐसा काम नहीं करूँगा।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का शाब्दिक अर्थ ‘छप्परों’ या ‘अस्थायी आश्रयों’ से है—यानी मैदान में बनाए गए अस्थायी निवास।
    reason: lexical_alternative
  - marker: b
    text: यह आलंकारिक प्रश्न है, जिसके द्वारा ऊरिय्याह ऐसा करने से दृढ़तापूर्वक इनकार करता है।
    reason: alternative_reading
  - marker: c
    text: इब्रानी शपथ-सूत्र शाब्दिक रूप से है, ‘आप जीवित हैं और आपके प्राण जीवित हैं, यदि मैं ऐसा काम करूँ।’ शपथ के बाद ‘यदि’ यहाँ प्रबल निषेध व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרוֹן
  choice: सन्दूक
  rationale: इब्रानी में निश्चित उपपद के साथ केवल ‘सन्दूक’ है। यह चयन ‘परमेश्वर का सन्दूक’ या ‘वाचा का सन्दूक’ जैसा ऐसा विस्तार नहीं जोड़ता जो इस पद में नहीं है।
- source_word: יֹשְׁבִים בַּסֻּכּוֹת
  choice: अस्थायी छप्परों में रह रहे हैं
  rationale: סֻכּוֹת अस्थायी झोंपड़ियों, छप्परों या आश्रयों को दर्शाता है। ‘अस्थायी छप्परों’ से युद्धक्षेत्र के अस्थायी निवास का भाव स्वाभाविक आधुनिक हिन्दी में स्पष्ट होता है।
- source_word: אֲדֹנִי
  choice: मेरे स्वामी
  rationale: यहाँ यह किसी मनुष्य के लिए आदरसूचक पद है, दिव्य नाम नहीं। ‘मेरे स्वामी’ सामाजिक संबंध और ऊरिय्याह की सम्मानपूर्ण वाणी दोनों को बनाए रखता है।
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: खुले मैदान में
  rationale: शाब्दिक मुहावरा ‘मैदान की सतह पर’ खुले और असुरक्षित युद्धक्षेत्र में होने का भाव देता है; ‘खुले मैदान में’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: חֹנִים
  choice: डेरा डाले हुए हैं
  rationale: कृदन्त चल रही सैनिक छावनी की स्थिति बताता है। यह हिन्दी अभिव्यक्ति उस निरन्तर अवस्था को स्वाभाविक रूप से व्यक्त करती है।
- source_word: וַאֲנִי אָבוֹא אֶל בֵּיתִי
  choice: तो क्या मैं अपने घर जाकर
  rationale: रूपतः यह प्रथम-पुरुष अपूर्ण क्रिया है, पर सन्दर्भ में तीखा आलंकारिक प्रश्न है। ‘तो क्या मैं’ पिछली परिस्थितियों से इसका संबंध और ऊरिय्याह का इनकार दोनों स्पष्ट करता है।
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת וְלִשְׁכַּב עִם אִשְׁתִּי
  choice: खाऊँ-पीऊँ और अपनी पत्नी के साथ सोऊँ
  rationale: ‘साथ सोना’ हिन्दी में संयमित और समझ में आने वाला यौन संकेत है, और मूल के शिष्टोक्ति-स्वर को अनावश्यक रूप से स्पष्ट किए बिना बनाए रखता है।
- source_word: חַיֶּךָ וְחֵי נַפְשֶׁךָ
  choice: आपके जीवन की और आपके प्राण की शपथ
  rationale: यह संबोधित व्यक्ति के जीवन को साक्षी बनाकर कही गई गंभीर शपथ है। ‘जीवन’ और ‘प्राण’ दोनों रखने से मूल की दोहरी अभिव्यक्ति बनी रहती है।
- source_word: אִם אֶעֱשֶׂה אֶת הַדָּבָר הַזֶּה
  choice: मैं ऐसा काम नहीं करूँगा
  rationale: शपथ-सूत्र के बाद אִם अधूरी शर्त के रूप में प्रबल निषेध व्यक्त करता है। हिन्दी में केवल ‘यदि मैं ऐसा करूँ’ भ्रामक होगा, इसलिए निहित निषेध को स्पष्ट किया गया है।
theological_decisions:
- issue: शपथ-सूत्र के बाद אִם का अर्थ
  choice: 'मुख्य पाठ में प्रबल निषेध: ‘मैं ऐसा काम नहीं करूँगा’'
  alternative: 'शाब्दिक अधूरा वाक्य: ‘यदि मैं ऐसा काम करूँ’'
  rationale: मूल में शपथ के परिणाम या दण्ड को अनकहा छोड़कर אִם के द्वारा दृढ़ निषेध प्रकट किया गया है। अनकहे दण्ड को गढ़े बिना निषेध स्पष्ट करना मूल की शक्ति और तनाव दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, आदरपूर्ण और कथात्मक हिन्दी अपनाई गई है। दाऊद के लिए ‘आप’ तथा योआब के लिए ‘मेरे स्वामी’ से ऊरिय्याह की सैनिक और दरबारी मर्यादा व्यक्त होती है। वाक्य में आलंकारिक प्रश्न और गंभीर शपथ की क्रमिक तीव्रता बनाए रखी गई है।
