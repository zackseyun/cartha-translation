  register: भाषा आधुनिक, कथात्मक और गरिमापूर्ण रखी गई है। ‘भड़क उठे’ राजा के तीव्र क्रोध को स्वाभाविक हिन्दी में व्यक्त करता है। ‘प्रहार करेंगे’ जानबूझकर व्यापक रखा गया है, क्योंकि इब्रानी क्रिया से प्रक्षेप्य का प्रकार निश्चित नहीं होता; वैकल्पिक अर्थ पाद-टिप्पणी में दिए गए हैं।
