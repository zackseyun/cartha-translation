  text: וְ/הָיָ֗ה אִֽם תַּעֲלֶה֙ חֲמַ֣ת הַ/מֶּ֔לֶךְ וְ/אָמַ֣ר לְ/ךָ֔ מַדּ֛וּעַ נִגַּשְׁתֶּ֥ם אֶל הָ/עִ֖יר לְ/הִלָּחֵ֑ם הֲ/ל֣וֹא יְדַעְתֶּ֔ם אֵ֥ת אֲשֶׁר יֹר֖וּ מֵ/עַ֥ל הַ/חוֹמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/020.yaml
  text: And if the king’s anger rises and he says to you[a], ‘Why did you go so near the city to fight? Did you not know what they would shoot from the wall?’
translation:
  language: hi
  text: और यदि राजा का क्रोध भड़क उठे और वह तुमसे कहे, ‘तुम लड़ने के लिए नगर के इतने पास क्यों गए? क्या तुम नहीं जानते थे कि वे नगर की दीवार के ऊपर से क्या-क्या चला सकते हैं[a]?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘क्या-क्या तीर चला सकते हैं’ अथवा ‘क्या-क्या फेंक सकते हैं।’ इब्रानी क्रिया का अर्थ तीर या अन्य प्रक्षेप्य चलाना, और व्यापक अर्थ में फेंकना, हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: और यदि
  rationale: यह पद पिछले कथन से जुड़ी एक संभावित स्थिति प्रस्तुत करता है; ‘और यदि’ वाव के कथात्मक संबंध और אִם की शर्त—दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: תַּעֲלֶה חֲמַת הַמֶּלֶךְ
  choice: राजा का क्रोध भड़क उठे
  rationale: חֵמָה तीव्र क्रोध का बोध कराता है और עלה उसके उठने का; ‘भड़क उठे’ आधुनिक हिन्दी में दोनों भावों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְאָמַר לְךָ
  choice: और वह तुमसे कहे
  rationale: शर्तसूचक प्रसंग में यह अनुमानित भावी कथन है; हिन्दी में ‘कहे’ इस संभावित स्थिति के अनुकूल है।
- source_word: נִגַּשְׁתֶּם אֶל הָעִיר
  choice: तुम नगर के इतने पास क्यों गए
  rationale: נגשׁ का अर्थ निकट जाना है। प्रसंग में आपत्ति केवल नगर की ओर बढ़ने पर नहीं, बल्कि शहरपनाह के खतरनाक रूप से निकट जाने पर है; ‘इतने पास’ उस भर्त्सनात्मक स्वर को स्पष्ट करता है।
- source_word: לְהִלָּחֵם
  choice: लड़ने के लिए
  rationale: यह उद्देश्यसूचक क्रियारूप है; ‘लड़ने के लिए’ संक्षिप्त, सहज और सैन्य प्रसंगानुकूल है।
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: क्या तुम नहीं जानते थे
  rationale: नकारात्मक प्रश्न अपेक्षित सकारात्मक उत्तर के साथ भर्त्सना व्यक्त करता है; यह अनुवाद उसी आलंकारिक बल को बनाए रखता है।
- source_word: אֵת אֲשֶׁר יֹרוּ
  choice: कि वे ... प्रहार करेंगे
  rationale: ירה हिफ़ील में तीर चलाने या किसी वस्तु को फेंकने, दोनों का संकेत दे सकता है। कर्म यहाँ व्यक्त नहीं है, इसलिए ‘प्रहार करेंगे’ मूल की अनिश्चितता को किसी खास अस्त्र तक सीमित किए बिना सैन्य अर्थ बनाए रखता है।
- source_word: מֵעַל הַחוֹמָה
  choice: शहरपनाह के ऊपर से
  rationale: מֵעַל में ‘ऊपर से’ का स्थानिक भाव है। ‘शहरपनाह’ किलेबंद नगर की रक्षात्मक दीवार के लिए स्पष्ट और प्रसंगानुकूल हिन्दी शब्द है।
