  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אוּרִיָּ֗ה שֵׁ֥ב בָּ/זֶ֛ה גַּם הַ/יּ֖וֹם וּ/מָחָ֣ר אֲשַׁלְּחֶ֑/ךָּ וַ/יֵּ֨שֶׁב אוּרִיָּ֧ה בִ/ירוּשָׁלִַ֛ם בַּ/יּ֥וֹם הַ/ה֖וּא וּ/מִֽ/מָּחֳרָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/012.yaml
  text: Then David said to Uriah[a], “Stay here today also, and tomorrow I will send you away.” So Uriah stayed in Jerusalem that day and the next day.
translation:
  language: hi
  text: तब दाऊद ने ऊरिय्याह से कहा, “आज भी यहीं रहो, और कल मैं तुम्हें विदा कर दूँगा।” इस पर ऊरिय्याह उस दिन और अगले दिन भी[a] यरूशलेम में रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उसके अगले दिन।”
    reason: מִמָּחֳרָת के ‘अगले/उसके अगले दिन’ वाले निकटवर्ती भाषिक विकल्प को दर्शाता है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שֵׁב בָּזֶה
  choice: यहीं रहो
  rationale: इस प्रसंग में ישׁב का अर्थ बैठना नहीं, कुछ समय उसी स्थान पर ठहरे रहना है; ‘यहीं रहो’ सहज और प्रसंगानुकूल है।
- source_word: גַּם הַיּוֹם
  choice: आज भी
  rationale: גַּם के समावेशी बल को ‘भी’ से स्पष्ट रूप से बनाए रखा गया है।
- source_word: וּמָחָר אֲשַׁלְּחֶךָּ
  choice: और कल मैं तुम्हें विदा कर दूँगा
  rationale: שׁלח यहाँ ऊरिय्याह को यरूशलेम से जाने देना या रवाना करना दर्शाता है; ‘विदा कर दूँगा’ आधुनिक, गरिमापूर्ण हिन्दी है और अनावश्यक कठोरता नहीं जोड़ता।
- source_word: וַיֵּשֶׁב
  choice: इस पर ... रहा
  rationale: वाव कथा की अगली परिणामी घटना प्रस्तुत करता है; ‘इस पर’ दाऊद के निर्देश के बाद ऊरिय्याह के रुकने को स्वाभाविक रूप से जोड़ता है।
- source_word: בִירוּשָׁלִַם
  choice: यरूशलेम में
  rationale: स्थानवाचक בְּ और प्रचलित हिन्दी नाम-रूप को सीधे व्यक्त किया गया है।
- source_word: בַּיּוֹם הַהוּא וּמִמָּחֳרָת
  choice: उस दिन और अगले दिन भी
  rationale: दोनों दिनों की समयावधि को स्पष्ट, सहज हिन्दी में व्यक्त करता है; अंतिम מִמָּחֳרָת अगले दिन की ओर संकेत करता है।
