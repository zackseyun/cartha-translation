  register: भाषा आधुनिक मानक हिन्दी की है। संवाद में सरलता और कथा-वर्णन में गरिमा रखी गई है। ‘ऊरिय्याह’ और ‘यरूशलेम’ नाम-रूपों का प्रयोग किया गया है; किसी सांप्रदायिक व्याख्या को नहीं जोड़ा गया।
