  yaml_path: translation/ot/2_samuel/011/026.yaml
  text: When Uriah’s wife heard that Uriah her husband was dead[a], she mourned for her husband.
translation:
  language: hi
  text: जब ऊरिय्याह की पत्नी ने सुना कि उसका पति ऊरिय्याह मर गया था[a], तो उसने अपने पति के लिए शोक मनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मर चुका था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁמַע
  choice: ने सुना
  rationale: काल रूप में שׁמע का सामान्य अर्थ ‘सुनना’ है; यहाँ सूचना मिलने के अर्थ में भी आधुनिक हिन्दी में ‘सुना’ स्वाभाविक और मूल के निकट है।
- source_word: אֵשֶׁת אוּרִיָּה
  choice: ऊरिय्याह की पत्नी
  rationale: सम्बन्धवाचक रचना का यह सहज हिन्दी रूप है और स्त्री को उसके नाम के बजाय उसी सम्बन्धसूचक पहचान से प्रस्तुत करता है जो इब्रानी पाठ में है।
- source_word: כִּי
  choice: कि
  rationale: यह उसके सुनने की विषय-वस्तु आरम्भ करता है, इसलिए ‘कि’ उपयुक्त है।
- source_word: מֵת
  choice: मर गया है
  rationale: מֵת ऊरिय्याह की मृत अवस्था बताता है। ‘मर गया है’ हिन्दी में सुनाई गई हाल की सूचना के रूप में स्वाभाविक है; ‘मर चुका था’ भी कालगत विकल्प है।
- source_word: אוּרִיָּה אִישָׁהּ
  choice: उसका पति ऊरिय्याह
  rationale: इब्रानी समानाधिकरण में नाम और वैवाहिक सम्बन्ध दोनों स्पष्ट हैं; यह क्रम हिन्दी में स्वाभाविक रहते हुए दोनों को सुरक्षित रखता है।
- source_word: וַתִּסְפֹּד
  choice: उसने ... शोक मनाया
  rationale: ספד मृत व्यक्ति के लिए औपचारिक शोक या विलाप को दर्शाता है। ‘शोक मनाया’ आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: עַל
  choice: के लिए
  rationale: शोक के प्रसंग में עַל का स्वाभाविक हिन्दी रूप ‘के लिए’ है।
- source_word: בַּעְלָהּ
  choice: अपने पति
  rationale: वैवाहिक प्रसंग में בַּעַל का अर्थ ‘पति’ है; ‘अपने’ कर्ता की ओर लौटते सम्बन्ध को हिन्दी में स्पष्ट और सहज बनाता है।
theological_decisions: []
