  register: आधुनिक मानक हिन्दी; कथा-शैली सरल, गरिमापूर्ण और मूल इब्रानी के सम्बन्धसूचक दोहराव के प्रति सजग है। ‘ऊरिय्याह’ नाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
