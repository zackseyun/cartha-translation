  yaml_path: translation/ot/2_samuel/011/006.yaml
  text: So David sent word to Joab, “Send Uriah the Hittite to me.” And Joab sent Uriah to David.
translation:
  language: hi
  text: तब दाऊद ने योआब के पास यह संदेश भेजा, “हित्ती ऊरिय्याह को मेरे पास भेज दो।” और योआब ने ऊरिय्याह को दाऊद के पास भेज दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד אֶל יוֹאָב
  choice: तब दाऊद ने योआब के पास यह संदेश भेजा
  rationale: שׁלח का मूल अर्थ ‘भेजना’ है। यहाँ भेजी गई वस्तु निहित है और तुरंत बाद सीधा आदेश आता है, इसलिए स्वाभाविक हिन्दी में ‘यह संदेश भेजा’ संप्रेषित आदेश को स्पष्ट करता है। कथा-क्रम के वַ को ‘तब’ से व्यक्त किया गया है।
- source_word: שְׁלַח אֵלַי
  choice: मेरे पास भेज दो
  rationale: आज्ञार्थक שְׁלַח की सीधाई बनाए रखते हुए ‘भेज दो’ सहज आधुनिक हिन्दी है; אֵלַי का अर्थ ‘मेरे पास’ है, इसमें ‘वापस’ का भाव नहीं जोड़ा गया।
- source_word: אֶת אוּרִיָּה הַחִתִּי
  choice: हित्ती ऊरिय्याह
  rationale: אֶת अनूदित न होने वाला निश्चित कर्म-सूचक है। הַחִתִּי जातीय पहचान को ‘हित्ती’ से और אוּרִיָּה को प्रचलित हिन्दी बाइबलीय रूप ‘ऊरिय्याह’ से व्यक्त किया गया है। हिन्दी में विशेषण को नाम से पहले रखना स्वाभाविक है।
- source_word: וַיִּשְׁלַח יוֹאָב אֶת אוּרִיָּה אֶל דָּוִד
  choice: और योआब ने ऊरिय्याह को दाऊद के पास भेज दिया
  rationale: दूसरी घटना के क्रम को ‘और’ से रखा गया है। दोहराए गए שׁלח के लिए फिर ‘भेज’ रखा गया; ‘दिया’ आदेश के पूरा किए जाने को स्वाभाविक हिन्दी में व्यक्त करता है, बिना कोई अतिरिक्त दिशा या उद्देश्य जोड़े।
