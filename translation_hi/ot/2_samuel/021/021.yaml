  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्यक्रम हिन्दी की स्वाभाविकता के अनुसार है, जबकि मूल पाठ का सामूहिक ‘इस्राएल’, युद्ध-संबंधी चुनौती और पारिवारिक पहचान सुरक्षित हैं।
