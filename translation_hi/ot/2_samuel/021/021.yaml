base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/021.yaml
  text: And he defied Israel[a], and Jonathan the son of Shimei, David’s brother, struck him down.
translation:
  language: hi
  text: उसने इस्राएल को ललकारा, और दाऊद के भाई शिमी[a] के पुत्र योनातान ने उसे मार गिराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों और 1 इतिहास 20:7 के समानांतर वर्णन में “शिमी” के स्थान पर “शिमा” या “शिमआ” है।
    reason: textual_variant
lexical_decisions:
- source_word: וַיְחָרֵף
  choice: ललकारा
  rationale: सैन्य प्रसंग में חרף अपमानपूर्ण चुनौती देने का भाव रखता है। ‘ललकारा’ आधुनिक हिन्दी में इस विरोधी चुनौती को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: אֶת יִשְׂרָאֵל
  choice: इस्राएल को
  rationale: मूल पाठ में सीधा कर्म राष्ट्रीय समुदाय ‘इस्राएल’ है; सामूहिक अर्थ को बिना विस्तार के सुरक्षित रखा गया है।
- source_word: וַיַּכֵּהוּ
  choice: उसे मार गिराया
  rationale: נכה का मूल अर्थ प्रहार करना है, और इस युद्ध-संदर्भ में प्रहार घातक है। ‘मार गिराया’ प्रहार की छवि और परिणाम दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוֹנָתָן
  choice: योनातान
  rationale: हिब्रू व्यक्तिगत नाम का हिन्दी बाइबलीय रूप।
- source_word: בֶּן שמעי
  choice: शिमी के पुत्र
  rationale: दिए गए व्यंजनात्मक पाठ שמעי का अनुसरण करते हुए नाम ‘शिमी’ रखा गया है; समानांतर पाठ का भिन्न रूप पादटिप्पणी में दिया गया है।
- source_word: אֲחִי דָוִד
  choice: दाऊद के भाई
  rationale: निर्मित पदबंध का सीधा अर्थ ‘दाऊद का भाई’ है। इसे वंशावली-संबंध स्पष्ट रखने के लिए ‘शिमी’ से जोड़ा गया है।
