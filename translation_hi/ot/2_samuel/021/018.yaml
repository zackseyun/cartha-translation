source:
  edition: WLC
  text: וַֽ/יְהִי֙ אַֽחֲרֵי כֵ֔ן וַ/תְּהִי ע֧וֹד הַ/מִּלְחָמָ֛ה בְּ/ג֖וֹב עִם פְּלִשְׁתִּ֑ים אָ֣ז הִכָּ֗ה סִבְּכַי֙ הַ/חֻ֣שָׁתִ֔י אֶת סַ֕ף אֲשֶׁ֖ר בִּ/ילִדֵ֥י הָ/רָפָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/018.yaml
  text: After this[a], there was again war with the Philistines at Gob, and then Sibbecai the Hushathite struck down Saph[b], who was among the descendants of Rapha.
translation:
  language: hi
  text: इसके बाद पलिश्तियों के साथ गोब में फिर युद्ध हुआ। तब हूशावासी सिब्बकै ने सफ़[a] को मार गिराया, जो रापा की संतानों में से था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में “सफ़”; 1 इतिहास 20:4 के समानांतर वृत्तांत में नाम “सिप्पै” है।
    reason: textual_variant
  - marker: b
    text: या “जो दैत्य की संतानों में से था”; इब्रानी वाक्यांश किसी रापा नामक व्यक्ति अथवा दैत्य/रपाई वंश का संकेत दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह स्वाभाविक हिन्दी काल-संक्रमण है और कथा के क्रम को बिना विस्तार के बनाए रखता है।
- source_word: וַתְּהִי עוֹד הַמִּלְחָמָה
  choice: फिर युद्ध हुआ
  rationale: ‘फिर’ עוֹד में निहित संघर्ष की पुनरावृत्ति को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּגֹב
  choice: गोब में
  rationale: युद्ध के स्थान के लिए ב का ‘में’ अनुवाद हिन्दी में सहज है और स्थान-नाम को लिप्यंतरित रखता है।
- source_word: עִם פְּלִשְׁתִּים
  choice: पलिश्तियों के साथ
  rationale: यह जातीय नाम का प्रचलित हिन्दी रूप है और עִם के संबंध को सीधे व्यक्त करता है।
- source_word: אָז
  choice: तब
  rationale: यह अगले घटनाक्रम का संकेत देने वाला संक्षिप्त और स्वाभाविक कथात्मक शब्द है।
- source_word: הִכָּה
  choice: मार गिराया
  rationale: युद्ध के प्रसंग में נכה के प्रहार और घातक पराजय, दोनों भावों को यह हिन्दी मुहावरा स्वाभाविक रूप से व्यक्त करता है।
- source_word: סִבְּכַי הַחֻשָׁתִי
  choice: हूशावासी सिब्बकै
  rationale: व्यक्तिनाम को लिप्यंतरित किया गया है और जातिवाचक उपाधि को साधारण पाठक के लिए स्वाभाविक ‘हूशावासी’ के रूप में दिया गया है।
- source_word: סַף
  choice: सफ़
  rationale: मुख्य पाठ में मसोराई पाठ के नाम को लिप्यंतरित रखा गया है; समानांतर पाठ का भिन्न नाम पादटिप्पणी में दिया गया है।
- source_word: אֲשֶׁר בִּילִדֵי הָרָפָה
  choice: जो रापा की संतानों में से था
  rationale: यह वंश-संबंध को व्यक्त करते हुए הָרָפָה को मुख्य पाठ में नाम के रूप में सुरक्षित रखता है और ‘दैत्य’ वाली व्याख्या को आरोपित नहीं करता।
theological_decisions:
- issue: क्या הָרָפָה को व्यक्तिनाम ‘रापा’ माना जाए या ‘दैत्य’ जैसे सामान्य वर्णन के रूप में अनूदित किया जाए
  choice: मुख्य पाठ में व्यक्तिनाम/वंश-पूर्वज के रूप में ‘रापा’
  alternative: ‘दैत्य’ अथवा दैत्यवंश से संबंधित व्यक्ति
  rationale: ‘संतानों में से’ जैसे वंशसूचक वाक्यांश में नाम या वंश-पूर्वज का संकेत स्वाभाविक है। फिर भी इब्रानी रूप दूसरी व्याख्या की गुंजाइश रखता है, इसलिए उसे पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। व्यक्तिनामों का हिन्दी लिप्यंतरण किया गया है; दुर्बोध जातिवाचक उपाधि को ‘हूशावासी’ के रूप में सहज बनाया गया है। पाठगत भिन्नता और रापा/दैत्य की वास्तविक अस्पष्टता मुख्य पाठ को बोझिल किए बिना पादटिप्पणियों में सुरक्षित है।
