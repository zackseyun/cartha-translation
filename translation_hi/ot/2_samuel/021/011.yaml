translation:
  language: hi
  text: दाऊद को अय्या की बेटी और शाऊल की उपपत्नी रिस्पा के किए हुए काम के बारे में बताया गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: तब ... को बताया गया
  rationale: נגד के होफ़अल रूप का निष्क्रिय भाव बनाए रखा गया है; कथा में וַ को स्वाभाविक क्रमसूचक ‘तब’ से व्यक्त किया गया है।
- source_word: לְדָוִד
  choice: दाऊद को
  rationale: לְ यहाँ सूचना पाने वाले अप्रत्यक्ष कर्म को चिह्नित करता है; हिंदी में ‘को’ इसका स्वाभाविक रूप है।
- source_word: אֵת אֲשֶׁר
  choice: कि ... क्या
  rationale: यह रचना सूचना की विषय-वस्तु प्रस्तुत करती है। ‘बताया गया कि ... क्या किया था’ आधुनिक हिंदी में स्वाभाविक है और पूरे संबंधवाचक खंड को कर्म के रूप में रखती है।
- source_word: עָשְׂתָה
  choice: किया था
  rationale: पूर्ण क्रिया सूचना दिए जाने से पहले घटित कार्य को दर्शाती है; हिंदी का पूर्ण भूतकाल कथा-क्रम को स्पष्ट करता है।
- source_word: רִצְפָּה
  choice: रिस्पा
  rationale: इब्रानी नाम का देवनागरी में निकट और प्रचलित लिप्यंतरण।
- source_word: בַת אַיָּה
  choice: अय्या की बेटी
  rationale: वंश-सूचक पहचान को सीधे और स्वाभाविक हिंदी में व्यक्त किया गया है।
- source_word: פִּלֶגֶשׁ שָׁאוּל
  choice: शाऊल की उपपत्नी
  rationale: निर्माण-संबंध और स्त्री की सामाजिक स्थिति दोनों को बिना शिष्टोक्ति के सुरक्षित रखा गया है।
