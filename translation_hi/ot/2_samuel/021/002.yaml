base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/002.yaml
  text: So the king called the Gibeonites and spoke to them[a]. Now the Gibeonites were not from the sons of Israel, but from the remnant of the Amorites; and the sons of Israel had sworn to them[c][b]. But Saul had sought to strike them down in his zeal for the sons of Israel and Judah.
translation:
  language: hi
  text: तब राजा ने गिबोनियों को बुलाकर उनसे बात की। गिबोनी इस्राएली नहीं थे, बल्कि एमोरियों के बचे हुए लोगों में से थे[a]; और इस्राएलियों ने उनसे शपथ ली थी। परन्तु शाऊल ने इस्राएल और यहूदा के पक्ष में अपने उत्साह के कारण उन्हें मार डालने का प्रयास किया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “एमोरी के बचे हुए भाग में से”; यहाँ एकवचन जातिनाम पूरे एमोरी लोगों को सूचित करता है।
    reason: मूल इब्रानी में जातिनाम के एकवचन और יֶתֶר (“बचा हुआ भाग/शेष”) की अभिव्यक्ति स्पष्ट करना।
  - marker: b
    text: “उत्साह” के लिए प्रयुक्त इब्रानी शब्द का अर्थ प्रसंग के अनुसार “जोश” या “ईर्ष्यापूर्ण जलन” भी हो सकता है।
    reason: קנא की अर्थगत व्यापकता तथा शाऊल की प्रेरणा की नैतिक अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּקְרָא הַמֶּלֶךְ לַגִּבְעֹנִים
  choice: तब राजा ने गिबोनियों को बुलाकर
  rationale: קרא का प्रसंगानुकूल अर्थ किसी को अपने पास बुलाना है। 'बुलाकर' स्वाभाविक हिन्दी है और अगले क्रियापद से सहजता से जुड़ता है।
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: उनसे बात की
  rationale: शाब्दिक अर्थ 'उनसे कहा' है, पर कही गई बात इस पद में नहीं दी गई; इसलिए 'बात की' आधुनिक हिन्दी में स्वाभाविक है और अर्थ से आगे नहीं जाता।
- source_word: לֹא מִבְּנֵי יִשְׂרָאֵל הֵמָּה
  choice: इस्राएल के वंशजों में से नहीं
  rationale: בני का वंशगत और राष्ट्रीय भाव सुरक्षित रहता है, जबकि हिन्दी में शाब्दिक 'इस्राएल के पुत्र' की अपेक्षा यह अधिक स्वाभाविक है।
- source_word: מִיֶּתֶר הָאֱמֹרִי
  choice: एमोरियों के बचे हुए लोगों में से
  rationale: יֶתֶר का अर्थ बचा हुआ भाग या शेष जन है। यह पदबंध 'शेष' की तुलना में सामान्य पाठक के लिए अधिक स्पष्ट है।
- source_word: נִשְׁבְּעוּ לָהֶם
  choice: उनसे शपथ खाई थी
  rationale: पूर्णभूत रूप पहले की गई शपथ को व्यक्त करता है; हिन्दी मुहावरे में किसी पक्ष से शपथ खाना स्वाभाविक है।
- source_word: וַיְבַקֵּשׁ שָׁאוּל לְהַכֹּתָם
  choice: शाऊल ने ... उन्हें मार डालने का प्रयास किया
  rationale: בקשׁ के साथ infinitive यहाँ इरादा/प्रयास दर्शाता है और נכה इस संदर्भ में घातक प्रहार, अर्थात मार डालना, व्यक्त करता है।
- source_word: בְּקַנֹּאתוֹ
  choice: अपने जोश में
  rationale: קנא यहाँ इस्राएल और यहूदा के पक्ष में तीव्र उत्साह या पक्षधरता दर्शाता है। 'जोश' स्वाभाविक है और शब्द की नैतिक अस्पष्टता को पूरी तरह सकारात्मक नहीं बनाता।
theological_decisions:
- issue: בני ישראל का अनुवाद
  choice: इस्राएल के वंशज
  alternative: इस्राएली; इस्राएल के पुत्र
  rationale: यह राष्ट्रीय समुदाय का नाम है, पर इस पद में उनके वंश और गिबोनियों की अलग उत्पत्ति पर जोर है। 'वंशज' उस संबंध को रखते हुए सहज हिन्दी देता है।
- issue: קנא में शाऊल की प्रेरणा
  choice: जोश
  alternative: जलन; उत्साह
  rationale: संदर्भ में ईर्ष्या की अपेक्षा इस्राएल और यहूदा के लिए उग्र पक्षधरता अभिप्रेत है। 'जोश' उस तीव्रता को रखता है और शाऊल के कृत्य को धार्मिक रूप से उचित घोषित नहीं करता।
- issue: इस्राएल की शपथ और शाऊल की कार्रवाई का संबंध
  choice: फिर भी
  alternative: और
  rationale: हिब्रू ו क्रमसूचक हो सकता है, किंतु शपथ और शाऊल के हिंसक प्रयास के बीच स्पष्ट विरोध है। 'फिर भी' इस निहित तनाव को व्यक्त करता है, उसे नया सिद्धान्त बनाकर नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। जातिनाम 'गिबोनी' और 'एमोरी' के प्रचलित हिन्दी रूप अपनाए गए हैं। लंबे व्याख्यात्मक वाक्य को मूल प्रवाह बनाए रखते हुए स्पष्ट खंडों में प्रस्तुत किया गया है।
