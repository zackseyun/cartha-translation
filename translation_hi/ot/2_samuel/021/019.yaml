  text: וַ/תְּהִי ע֧וֹד הַ/מִּלְחָמָ֛ה בְּ/ג֖וֹב עִם פְּלִשְׁתִּ֑ים וַ/יַּ֡ךְ אֶלְחָנָן֩ בֶּן יַעְרֵ֨י אֹרְגִ֜ים בֵּ֣ית הַלַּחְמִ֗י אֵ֚ת גָּלְיָ֣ת הַ/גִּתִּ֔י וְ/עֵ֣ץ חֲנִית֔/וֹ כִּ/מְנ֖וֹר אֹרְגִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/019.yaml
  text: And there was again war at Gob with the Philistines[a], and Elhanan son of Jaare-oregim the Bethlehemite struck down Goliath the Gittite[b], and the shaft of his spear was like a weaver’s beam.
translation:
  language: hi
  text: फिर गोब में पलिश्तियों के साथ युद्ध हुआ।[a] तब बेतलेहेमवासी यारे-ओरेगीम के पुत्र एल्हानान ने गती गोलियत को मार गिराया;[b] उसके भाले का डंडा जुलाहे के करघे की धरन के समान था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '1 इतिहास 20:5 में समानांतर विवरण का पाठ भिन्न है: वहाँ एल्हानान द्वारा गोलियत के भाई लहमी को मारे जाने की बात है। अनेक विद्वान मानते हैं कि शमूएल की इस पंक्ति में कोई कठिन या बिगड़ा हुआ पाठ सुरक्षित रह गया है और उसके अनुसार इसे समझने का सामंजस्य बैठाते हैं।'
    reason: textual_variant
  - marker: b
    text: हिब्रू में पिता का नाम ‘यारे-ओरेगीम’ कठिन है। कुछ विद्वान मानते हैं कि ‘ओरेगीम’ (‘जुलाहे’) शब्द पद के अंत से अनजाने में यहाँ भी दोहरा दिया गया था।
    reason: textual_variant
lexical_decisions:
- source_word: בְּגוֹב
  choice: गोब में
  rationale: स्थानवाचक नाम के साथ בְּ को स्वाभाविक आधुनिक हिन्दी में ‘में’ किया गया है; ‘गोब’ का लिप्यंतरण रखा गया है।
- source_word: וַיַּךְ
  choice: मार गिराया
  rationale: युद्ध के प्रसंग में נכה का अर्थ प्राणघातक रूप से मारना है; ‘मार गिराया’ क्रिया की युद्ध-संबंधी शक्ति बनाए रखता है।
- source_word: יַעְרֵי אֹרְגִים
  choice: यारे-ओरेगीम
  rationale: मसोरेटिक पाठ के कठिन संयुक्त नाम को बिना संशोधन या इतिहास-वृत्तांत के समानांतर पाठ से सामंजस्य किए लिप्यंतरित किया गया है।
- source_word: בֵּית הַלַּחְמִי
  choice: बेतलेहेमवासी
  rationale: हिब्रू का यह रूप किसी व्यक्ति के बेतलेहेम से होने को दर्शाता है; ‘बेतलेहेमवासी’ इसका सहज हिन्दी रूप है।
- source_word: אֵת גָּלְיָת הַגִּתִּי
  choice: गती गोलियत को
  rationale: मसोरेटिक पाठ सीधे ‘गती गोलियत’ को कर्म के रूप में प्रस्तुत करता है; मुख्य पाठ में इसी कठिन पाठ को सुरक्षित रखा गया है।
- source_word: וְעֵץ חֲנִיתוֹ
  choice: उसके भाले का डंडा
  rationale: עֵץ का मूल अर्थ ‘लकड़ी’ है, पर भाले के संदर्भ में ‘डंडा’ उसके लकड़ी के लंबे भाग को सामान्य हिन्दी में स्पष्ट करता है।
- source_word: כִּמְנוֹר אֹרְגִים
  choice: जुलाहे के करघे की धरन के समान
  rationale: यह उपमा भाले के डंडे की मोटाई बताती है। מְנוֹר करघे की भारी आड़ी धरन को सूचित करता है; इसीलिए केवल ‘करघे’ कहने के बजाय ‘करघे की धरन’ रखा गया है।
theological_decisions:
- issue: दाऊद द्वारा गोलियत को मारे जाने के विवरण और 1 इतिहास 20:5 के समानांतर पाठ से प्रत्यक्ष तनाव
  choice: 'मुख्य पाठ में मसोरेटिक वाचन रखा गया है: एल्हानान ने गती गोलियत को मार गिराया।'
  alternative: ‘एल्हानान ने गोलियत के भाई लहमी को मार गिराया’ पढ़ना।
  rationale: दिए गए हिब्रू पाठ में कर्म के रूप में गोलियत का नाम स्पष्ट है। तनाव को चुपचाप सुलझाने के बजाय पाठ में सुरक्षित और पादटिप्पणी में समानांतर वाचन बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। नामों का हिन्दी बाइबिलीय शैली के निकट लिप्यंतरण किया गया है। कठिन मसोरेटिक पाठ को मुख्य वाक्य में ज्यों का त्यों अर्थानुसार सुरक्षित रखा गया है और पाठांतरों को पादटिप्पणियों में स्पष्ट किया गया है।
