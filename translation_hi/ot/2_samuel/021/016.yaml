- source_word: וּמִשְׁקַל קֵינוֹ
  choice: जिसके भाले का भार
  rationale: युद्ध के प्रसंग में קֵין को परंपरागत रूप से भाला अथवा भाले का दंड समझा जाता है; हिंदी में संबंधवाचक रचना स्वाभाविक है।
- source_word: שְׁלֹשׁ מֵאוֹת מִשְׁקַל נְחֹשֶׁת
  choice: तीन सौ शेकेल काँसा
  rationale: प्राचीन भार-मात्रा 'शेकेल' को पारदर्शिता के लिए बनाए रखा गया है। सैन्य-संदर्भ में נְחֹשֶׁת के लिए 'काँसा' उपयुक्त है।
- source_word: וְהוּא חָגוּר חֲדָשָׁה
  choice: नई तलवार बाँधे हुए था
  rationale: חֲדָשָׁה स्त्रीलिंग विशेषण है और उसका संज्ञा-पद लुप्त है। युद्ध-संदर्भ में परंपरागत रूप से 'तलवार' की पूर्ति की जाती है, पर अनिश्चितता पादटिप्पणी में स्पष्ट है।
- source_word: וַיֹּאמֶר לְהַכּוֹת אֶת דָּוִד
  choice: उसने दाऊद को मार गिराने की ठानी
  rationale: शाब्दिक रूप 'दाऊद को मारने के लिए कहा' यहाँ इरादा या दृढ़ निश्चय व्यक्त करने वाला मुहावरा है। 'ठानी' हिंदी में वही आशय स्वाभाविक रूप से देता है और युद्ध-संदर्भ में 'मार गिराने' को बनाए रखता है।
