  yaml_path: translation/ot/2_samuel/021/016.yaml
  text: And Ishbi-benob[a], who was among the descendants of Rapha, whose spear weighed three hundred shekels of bronze, and who was girded with a new sword[c][b], said that he would strike down David.
translation:
  language: hi
  text: और यिश्बी-बनोब[a], जो रापा के वंशजों में से था[b], जिसके भाले का भार काँसे के तीन सौ शेकेल था, और जो नई तलवार बाँधे हुए था[c], उसने कहा कि वह दाऊद को मार गिराएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी नाम का रूप अनिश्चित है। यहाँ परंपरागत समझ के अनुसार ‘यिश्बी-बनोब’ दिया गया है; इसे ‘येश्बी-बनोब’ अथवा व्यंजनों को अलग तरह से बाँटकर भी पढ़ा जा सकता है।
    reason: textual_variant
  - marker: b
    text: शाब्दिक रूप से, ‘रापा से जन्मे लोगों में से’। संभवतः यह रपाई वंश से जुड़े दैत्याकार योद्धाओं के कुल को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में केवल ‘नई’ है; संज्ञा लुप्त है। परंपरागत रूप से यहाँ ‘तलवार’ समझी जाती है।
    reason: lexical_alternative
