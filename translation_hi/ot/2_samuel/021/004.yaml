base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/004.yaml
  text: The Gibeonites said to him[a], “We have no claim for silver or gold against Saul or against his house, and it is not for us to put any man in Israel to death.” Then he said[b], “What do you say that I should do for you?”
translation:
  language: hi
  text: गिबोनियों ने उससे कहा,[a] “शाऊल या उसके घराने से चाँदी या सोने का हमारा कोई दावा नहीं है, और इस्राएल में किसी मनुष्य को मृत्युदंड देना हमारे अधिकार में नहीं है।” तब उसने कहा, “तुम क्या कहते हो कि मैं तुम्हारे लिए करूँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शाऊल और उसके घराने के साथ हमारा मामला चाँदी या सोने का नहीं है।” इब्रानी अभिव्यक्ति मुहावरेदार है और सम्भवतः धन के रूप में प्रतिपूर्ति की ओर संकेत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין לִי כֶּסֶף וְזָהָב עִם שָׁאוּל וְעִם בֵּיתוֹ
  choice: शाऊल और उसके घराने से हमें चाँदी या सोना नहीं चाहिए
  rationale: इब्रानी मुहावरा इस प्रसंग में धन-संबंधी प्रतिपूर्ति या दावे को अस्वीकार करता है। सहज हिन्दी में यह चयन उसी आशय को स्पष्ट करता है, जबकि वक्ताओं के सामूहिक उत्तर के कारण एकवचन לִי को बहुवचन ‘हमें’ से व्यक्त किया गया है।
- source_word: וְאֵין לָנוּ אִישׁ לְהָמִית בְּיִשְׂרָאֵל
  choice: और इस्राएल में किसी मनुष्य को मार डालना हमारे अधिकार में नहीं है
  rationale: यह वाक्यांश किसी व्यक्ति की अनुपलब्धता नहीं, बल्कि उसे मृत्युदंड देने के अधिकार या विशेषाधिकार के अभाव को सूचित करता है।
- source_word: אִישׁ
  choice: किसी मनुष्य को
  rationale: यह सामान्य अर्थ में एक व्यक्ति को सूचित करता है; ‘मनुष्य’ मूल के एकवचन मानवीय संज्ञा-रूप को बनाए रखता है।
- source_word: מָה אַתֶּם אֹמְרִים אֶעֱשֶׂה לָכֶם
  choice: तुम क्या कहते हो कि मैं तुम्हारे लिए करूँ?
  rationale: मूल की संक्षिप्त रचना को स्वाभाविक हिन्दी में रखते हुए दाऊद द्वारा उनकी माँग पूछने का भाव सुरक्षित रखा गया है।
