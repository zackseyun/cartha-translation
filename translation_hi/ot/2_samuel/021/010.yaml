  text: וַ/תִּקַּ֣ח רִצְפָּה֩ בַת אַיָּ֨ה אֶת הַ/שַּׂ֜ק וַ/תַּטֵּ֨/הוּ לָ֤/הּ אֶל הַ/צּוּר֙ מִ/תְּחִלַּ֣ת קָצִ֔יר עַ֛ד נִתַּךְ מַ֥יִם עֲלֵי/הֶ֖ם מִן הַ/שָּׁמָ֑יִם וְ/לֹֽא נָתְנָה֩ ע֨וֹף הַ/שָּׁמַ֜יִם לָ/נ֤וּחַ עֲלֵי/הֶם֙ יוֹמָ֔ם וְ/אֶת חַיַּ֥ת הַ/שָּׂדֶ֖ה לָֽיְלָה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/010.yaml
  text: Then Rizpah the daughter of Aiah took sackcloth and spread it out for herself on the rock[a], from the beginning of harvest until water was poured on them from the heavens. And she did not allow the birds of the sky to rest on them by day, nor the wild animals of the field by night.
translation:
  language: hi
  text: तब अय्या की बेटी रिस्पा ने टाट लिया और उसे अपने लिए चट्टान पर बिछा दिया, और कटनी के आरम्भ से लेकर आकाश से उन पर पानी बरसने तक उसे बिछाए रखा।[a] उसने दिन में आकाश के पक्षियों को उन पर उतरने नहीं दिया, और न रात में मैदान के जंगली जानवरों को उन पर आने दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “जब आकाश से उन पर पानी उंडेला गया।” आशय सम्भवतः वर्षा होने से है।'
    reason: मुख्य पाठ में स्वाभाविक ‘पानी बरसने’ के साथ इब्रानी נתך के ‘उंडेले जाने’ के बिंब को सुरक्षित रखता है।
lexical_decisions:
- source_word: הַשַּׂק
  choice: टाट
  rationale: שַׂק शोक में प्रयुक्त मोटे कपड़े को दर्शाता है। आधुनिक हिन्दी में ‘टाट’ संक्षिप्त और स्वाभाविक है तथा प्रसंग में शोक-वस्त्र का भाव रखता है।
- source_word: וַתַּטֵּהוּ לָהּ אֶל הַצּוּר
  choice: उसे अपने लिए चट्टान पर बिछा लिया
  rationale: נטה यहाँ कपड़े को फैलाने या तानने का भाव देता है; לָהּ को ‘अपने लिए’ और אֶל־הַצּוּר को प्रसंगानुसार ‘चट्टान पर’ व्यक्त किया गया है।
- source_word: מִתְּחִלַּת קָצִיר
  choice: कटनी के आरम्भ से
  rationale: मूल पाठ केवल कटनी की शुरुआत कहता है; किसी विशेष फसल का नाम जोड़ना उचित नहीं।
- source_word: עַד נִתַּךְ מַיִם עֲלֵיהֶם מִן הַשָּׁמָיִם
  choice: जब आकाश से उन पर पानी बरसा
  rationale: נתך का मूल भाव उंडेले या बरसाए जाने का है। हिन्दी में ‘पानी बरसा’ वर्षा के आशय को स्वाभाविक रूप से व्यक्त करता है, जबकि अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: לָנוּחַ עֲלֵיהֶם
  choice: उन पर बैठने
  rationale: पक्षियों के विषय में נוח का आशय उतरकर बैठना या टिकना है; ‘बैठने’ सहज आधुनिक हिन्दी है।
- source_word: חַיַּת הַשָּׂדֶה
  choice: मैदान के जंगली जानवर
  rationale: यह पद खुले भूभाग में रहने वाले वन्य पशुओं को दर्शाता है। ‘मैदान के जंगली जानवर’ मूल बिंब और आधुनिक बोध दोनों बनाए रखता है।
- source_word: יוֹמָם ... לָיְלָה
  choice: दिन में ... रात में
  rationale: ये कालवाचक पद हिन्दी में स्वाभाविक समानांतरता के साथ व्यक्त किए गए हैं।
theological_decisions:
- issue: ‘उन पर’ का संकेत
  choice: बहुवचन सर्वनाम को बनाए रखा गया
  alternative: स्पष्ट करके ‘शवों पर’ कहना
  rationale: मूल पाठ यहाँ केवल עֲלֵיהֶם, ‘उन पर’, कहता है। संदर्भ शवों की ओर संकेत करता है, पर अनुवाद ने मूल की संदर्भ-निर्भर अभिव्यक्ति को सुरक्षित रखा है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘वह ... वहीं रही’ मूल में निहित दीर्घ पहरे को हिन्दी में स्पष्ट करता है, यद्यपि क्रिया प्रत्यक्ष रूप से दुहराई नहीं गई। अंतिम खंड में पक्षियों के लिए ‘उन पर बैठने’ और जंगली जानवरों के लिए ‘उनके पास आने’ का प्रयोग हिन्दी की स्वाभाविकता हेतु किया गया है; मूल में दूसरे खंड की क्रिया पहले खंड से ग्रहण की जाती है।
