base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/001.yaml
  text: There was a famine in the days of David for three years[a], year after year. And David sought the face of Yahweh, and Yahweh said, “It is because of Saul and his bloodguilty house[b], because he put the Gibeonites to death.”
translation:
  language: hi
  text: दाऊद के दिनों में तीन वर्ष तक, वर्ष पर वर्ष, अकाल पड़ा। तब दाऊद ने याहवे की खोज की[a]। याहवे ने कहा, “यह शाऊल और उसके रक्तपात के दोषी घराने के कारण हुआ है[b], क्योंकि उसने गिबोनियों को मार डाला था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे से पूछा”; शाब्दिक रूप से, “याहवे के मुख को खोजा।”
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में “रक्तों का घराना”; यह रक्तपात के दोषी परिवार या राजवंश के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: अकाल
  rationale: कथा के संदर्भ में यह पूरे देश को प्रभावित करने वाली गंभीर खाद्य-कमी को दर्शाता है; इसलिए सामान्य ‘भूख’ के बजाय ‘अकाल’ उपयुक्त है।
- source_word: שָׁלֹשׁ שָׁנִים שָׁנָה אַחֲרֵי שָׁנָה
  choice: लगातार तीन वर्ष तक—एक के बाद एक वर्ष
  rationale: हिब्रू में अवधि और निरंतरता दोनों पर बल है। हिन्दी में दोनों तत्व रखे गए हैं, भले ही उनमें जानबूझकर कुछ पुनरुक्ति है।
- source_word: וַיְבַקֵּשׁ ... אֶת־פְּנֵי יְהוָה
  choice: याहवे के मुख की खोज की
  rationale: यह हिब्रू मुहावरे ‘याहवे के मुख को खोजना’ का निकट अनुवाद है। असामान्य पर अर्थपूर्ण चित्र को मुख्य पाठ में सुरक्षित रखा गया है और पादटिप्पणी में स्वाभाविक अर्थ दिए गए हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू के व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֶל שָׁאוּל וְאֶל בֵּית הַדָּמִים
  choice: शाऊल और उसके रक्तपात के दोषी घराने के कारण
  rationale: उत्तर अकाल का कारण बताता है। ‘घराना’ परिवार या राजवंश का भाव देता है, और ‘रक्तपात के दोषी’ नैतिक तथा न्यायिक दोष को स्पष्ट करता है। ‘उसके’ संबंध को हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל אֲשֶׁר הֵמִית אֶת־הַגִּבְעֹנִים
  choice: क्योंकि उसने गिबोनियों को मार डाला था
  rationale: एकवचन क्रिया का कर्ता शाऊल है। भूतपूर्व घटना के कारण वर्तमान अकाल होने का संबंध हिन्दी के पूर्ण भूतकाल से स्पष्ट होता है।
- source_word: הַגִּבְעֹנִים
  choice: गिबोनी
  rationale: इस जनसमूह के नाम का प्रचलित और सहज हिन्दी रूप।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: शाऊल के घराने से संबंधित कारणवाचक कथन
  choice: अकाल शाऊल और उसके रक्तपात के दोषी घराने के कारण हुआ
  alternative: 'अधिक शब्दशः: ‘शाऊल की ओर और रक्तों के घराने की ओर’'
  rationale: संदर्भ में याहवे का उत्तर अकाल का कारण बताता है। हिन्दी में ‘के कारण’ इस संबंध को स्पष्ट करता है, जबकि रक्तपात के सामूहिक या वंशगत दोष का तनाव ‘घराने’ में बना रहता है।
- issue: הֵמִית के एकवचन कर्ता की पहचान
  choice: ‘उसने’ से शाऊल की ओर संकेत
  alternative: इसे पूरे घराने की सामूहिक कार्रवाई के रूप में स्पष्ट करना
  rationale: हिब्रू क्रिया एकवचन है और निकटतम स्पष्ट व्यक्ति शाऊल है; इसलिए मुख्य उत्तरदायित्व उसी पर रखा गया है, बिना घराने की रक्त-दोषिता हटाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘मुख की खोज’ मूल हिब्रू की सजीव पर कुछ अपरिचित अभिव्यक्ति को सुरक्षित रखता है; पादटिप्पणी सामान्य हिन्दी अर्थ स्पष्ट करती है। आरंभ में ऐसा कोई अतिरिक्त ‘अब’ नहीं जोड़ा गया जिसका मूल में स्वतंत्र कालवाचक शब्द न हो।
