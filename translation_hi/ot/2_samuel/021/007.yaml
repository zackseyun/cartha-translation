source:
  edition: WLC
  text: וַ/יַּחְמֹ֣ל הַ/מֶּ֔לֶךְ עַל מְפִי בֹ֖שֶׁת בֶּן יְהוֹנָתָ֣ן בֶּן שָׁא֑וּל עַל שְׁבֻעַ֤ת יְהוָה֙ אֲשֶׁ֣ר בֵּֽינֹתָ֔/ם בֵּ֣ין דָּוִ֔ד וּ/בֵ֖ין יְהוֹנָתָ֥ן בֶּן שָׁאֽוּל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/007.yaml
  text: But the king spared Mephibosheth son of Jonathan[a], son of Saul, because of the oath of Yahweh that was between them, between David and Jonathan son of Saul.
translation:
  language: hi
  text: परन्तु राजा ने शाऊल के पुत्र योनातान के पुत्र मपीबोशेत को बख्श दिया, क्योंकि यहोवा की वह शपथ[a] उनके बीच, अर्थात् दाऊद और शाऊल के पुत्र योनातान के बीच, थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् सम्भवतः वह शपथ जो दाऊद और योनातान ने यहोवा के नाम से, या यहोवा को साक्षी मानकर, खाई थी।
    reason: ‘यहोवा की शपथ’ की सम्भावित प्रसंगगत व्याख्या बताते हुए मूल अभिव्यक्ति की अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: וַיַּחְמֹל
  choice: छोड़ दिया
  rationale: यहाँ क्रिया का ठोस कथात्मक अर्थ उसे मृत्यु के लिए न सौंपना है; ‘छोड़ दिया’ साधारण आधुनिक हिन्दी में इस आशय को स्पष्ट करता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: इब्रानी पाठ के निश्चित पदनाम को बनाए रखा गया है; प्रसंग में यह दाऊद है।
- source_word: מְפִיבֹשֶׁת
  choice: मपीबोशेत
  rationale: व्यक्तिनाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: בֶּן יְהוֹנָתָן בֶּן שָׁאוּל
  choice: शाऊल के पुत्र योनातान के पुत्र
  rationale: दो बार आए בֶּן की वंशावली-संरचना को स्वाभाविक हिन्दी संबंध-क्रम में सुरक्षित रखा गया है।
- source_word: עַל
  choice: क्योंकि
  rationale: यहाँ यह राजा के निर्णय का कारण बताता है।
- source_word: שְׁבֻעַת יְהוָה
  choice: यहोवा की शपथ
  rationale: समास की औपचारिक संरचना और उसकी वास्तविक अर्थगत अस्पष्टता को बनाए रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: दिव्य नाम को हिन्दी में प्रचलित निकट लिप्यंतरण द्वारा प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֲשֶׁר בֵּינֹתָם בֵּין דָּוִד וּבֵין יְהוֹנָתָן
  choice: दाऊद और ... योनातान के बीच ... थी
  rationale: ‘उनके बीच’ का संकेत जिन दो व्यक्तियों की ओर है, उन्हें हिन्दी वाक्य में सीधे रखकर पुनरुक्ति घटाई गई है, पर द्विपक्षीय संबंध सुरक्षित है।
theological_decisions:
- issue: ‘यहोवा की शपथ’ का अर्थ
  choice: मुख्य पाठ में शाब्दिक और अस्पष्ट अभिव्यक्ति ‘यहोवा की शपथ’
  alternative: यहोवा के नाम से खाई गई शपथ / यहोवा को साक्षी मानकर खाई गई शपथ
  rationale: प्रसंग में सम्भवतः दाऊद और योनातान द्वारा यहोवा के नाम से खाई गई शपथ अभिप्रेत है, पर मुख्य पाठ इसे निर्णायक रूप से नहीं खोलता; पादटिप्पणी सम्भावित अर्थ स्पष्ट करती है।
- issue: ‘राजा’ का संदर्भ
  choice: ‘राजा’ बनाए रखा गया
  alternative: दाऊद
  rationale: प्रसंग राजा को दाऊद के रूप में पहचानता है, पर मूल पाठ यहाँ पदनाम का उपयोग करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किन्तु सहज कथात्मक शैली। इब्रानी वंशावली-संरचना को यथासम्भव सुरक्षित रखते हुए हिन्दी पदक्रम स्वाभाविक रखा गया है।
