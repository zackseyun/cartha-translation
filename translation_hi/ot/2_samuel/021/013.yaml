    text: या, “जिनके शव सार्वजनिक रूप से प्रदर्शित किए गए थे।” इब्रानी शब्द उन मार डाले गए लोगों की ओर संकेत करता है जिनके शव सार्वजनिक रूप से खंभों या दाँवों पर लगाए गए थे; दंड की ठीक विधि निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל מִשָּׁם
  choice: वह वहाँ से ... ले आया
  rationale: עלה के हिफ़ील रूप में ऊपर लाने या किसी स्थान से ले आने का भाव है। प्रसंग में शव-अवशेष वापस लाए जा रहे हैं; सहज हिन्दी में ‘ले आया’ इस गति को स्पष्ट रखता है।
- source_word: עַצְמוֹת
  choice: हड्डियाँ
  rationale: मूल शब्द का सीधा अर्थ ‘हड्डियाँ’ है। ‘अवशेष’ अधिक सामान्य होता, पर यहाँ मूल की ठोस और बार-बार दोहराई गई अभिव्यक्ति को सुरक्षित रखा गया है।
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: उसके पुत्र योनातान
  rationale: यह स्पष्ट करता है कि योनातान शाऊल का पुत्र है और आधुनिक हिन्दी में स्वाभाविक भी है।
- source_word: וַיַּאַסְפוּ
  choice: उन्होंने ... इकट्ठी कीं
  rationale: क्रिया बहुवचन में है; इसलिए इसे एकवचन कर्ता के साथ मिलाकर नहीं बदला गया।
- source_word: הַמּוּקָעִים
  choice: खूँटों पर लटकाए गए लोग
  rationale: यह शब्द दंडित व्यक्तियों को सार्वजनिक रूप से खूँटे या स्तंभ पर प्रदर्शित करने की ओर संकेत करता है। ‘लटकाए गए’ हिन्दी में बोधगम्य है, जबकि ‘खूँटों पर’ मूल की अधिक विशिष्ट छवि को बनाए रखता है; दंड की ठीक विधि की अनिश्चितता पादटिप्पणी में दी गई है।
