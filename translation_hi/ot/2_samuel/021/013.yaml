  text: वह वहाँ से शाऊल की हड्डियाँ और उसके पुत्र योनातान की हड्डियाँ निकाल लाया; और उन्होंने खंभों पर चढ़ाए गए लोगों[a] की हड्डियाँ इकट्ठी कीं।
  philosophy: optimal-equivalence
  footnotes:
