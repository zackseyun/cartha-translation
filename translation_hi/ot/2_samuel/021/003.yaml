source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל הַ/גִּבְעֹנִ֔ים מָ֥ה אֶעֱשֶׂ֖ה לָ/כֶ֑ם וּ/בַ/מָּ֣ה אֲכַפֵּ֔ר וּ/בָרְכ֖וּ אֶת נַחֲלַ֥ת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/003.yaml
  text: David said to the Gibeonites[a], “What shall I do for you, and with what shall I make atonement[b], that you may bless the inheritance of Yahweh?”
translation:
  language: hi
  text: दाऊद ने गिबोनियों से कहा, “मैं तुम्हारे लिए क्या करूँ और किससे प्रायश्चित करूँ, ताकि तुम यहोवा की विरासत को आशीर्वाद दो?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और यहोवा की विरासत को आशीर्वाद दो।” इब्रानी को अधिक शाब्दिक रूप से एक समन्वित उपवाक्य के रूप में भी पढ़ा जा सकता है। “यहोवा की विरासत” से आशय इस्राएल, अर्थात यहोवा के अपने लोगों से है।
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने ... कहा
  rationale: אמר का कथात्मक वय्यिक्तोल रूप है; सामान्य कथन-परिचय को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: הַגִּבְעֹנִים
  choice: गिबोनियों
  rationale: गिबोन नगर के लोगों के लिए प्रयुक्त जातिवाचक बहुवचन; प्रचलित हिन्दी नामरूप रखा गया है।
- source_word: מָה אֶעֱשֶׂה לָכֶם
  choice: मैं तुम्हारे लिए क्या करूँ
  rationale: प्रश्नवाचक शब्द और अपूर्ण क्रिया विचार-विमर्शात्मक भाव व्यक्त करते हैं; यह हिन्दी में स्वाभाविक और खुला प्रश्न है।
- source_word: וּבַמָּה
  choice: और किसके द्वारा
  rationale: ב का साधनवाचक अर्थ सुरक्षित रहता है; केवल ‘कैसे’ कहने की अपेक्षा मूल के अधिक निकट है।
- source_word: אֲכַפֵּר
  choice: प्रायश्चित करूँ
  rationale: כפר के पिएल रूप का यहाँ गंभीर दोष को दूर करने और संबंध सुधारने का प्रायश्चितात्मक अर्थ है; ‘भरपाई करूँ’ इसकी धार्मिक-नैतिक गंभीरता को कम कर देता।
- source_word: וּבָרְכוּ
  choice: ताकि तुम ... आशीर्वाद दो
  rationale: संदर्भ में संयोजक वाव के साथ यह रूप दाऊद के प्रस्तावित कार्य का इच्छित उद्देश्य या परिणाम बताता है।
- source_word: נַחֲלַת יְהוָה
  choice: यहोवा की विरासत
  rationale: נחלה का मूल अर्थ विरासत है; यहाँ इससे यहोवा के अपने लोग, इस्राएल, अभिप्रेत हैं।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में परमेश्वर के व्यक्तिगत नाम का परिचित लिप्यंतरण है और इसे केवल उपाधि से नहीं बदलता।
theological_decisions:
- issue: रक्तदोष और वाचा-भंग के संदर्भ में כפר का अनुवाद
  choice: प्रायश्चित करूँ
  alternative: भरपाई करूँ / दोष दूर करूँ
  rationale: यह शब्द केवल सामाजिक क्षतिपूर्ति नहीं, बल्कि गंभीर सामुदायिक दोष के निवारण का भाव रखता है; ‘प्रायश्चित’ उस धार्मिक और नैतिक भार को बनाए रखता है।
- issue: अंतिम उपवाक्य וּבָרְכוּ אֶת נַחֲלַת יְהוָה का संबंध
  choice: 'उद्देश्य/परिणाम: ‘ताकि तुम ... आशीर्वाद दो’'
  alternative: 'साधारण समन्वय: ‘और ... को आशीर्वाद दो’'
  rationale: संदर्भ में दाऊद पूछता है कि कौन-सा कार्य गिबोनियों को इस्राएल के प्रति आशीर्वाद की स्थिति में लाएगा। फिर भी इब्रानी में साधारण समन्वय की व्याकरणिक संभावना बनी रहती है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘प्रायश्चित’ मूल के धार्मिक-नैतिक भार को रखता है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए स्वाभाविक रखा गया है।
