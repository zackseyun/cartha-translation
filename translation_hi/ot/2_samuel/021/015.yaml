base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/015.yaml
  text: And there was war again between the Philistines and Israel[a], and David went down with his servants with him, and they fought against the Philistines, and David grew weary.
translation:
  language: hi
  text: फिर पलिश्तियों और इस्राएल के बीच युद्ध हुआ। दाऊद अपने सेवकों[a] के साथ नीचे गया, और उन्होंने पलिश्तियों से युद्ध किया। तब दाऊद थक गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने आदमियों।” इब्रानी में “अपने सेवकों” है; राजा के संदर्भ में यह अभिव्यक्ति उसकी सेवा में रहनेवाले लोगों, जिनमें सैनिक भी शामिल थे, के लिए प्रयुक्त हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי עוֹד מִלְחָמָה
  choice: फिर ... युद्ध हुआ
  rationale: यह स्वाभाविक हिन्दी में युद्ध की पुनरावृत्ति व्यक्त करता है; עוֹד का अर्थ यहाँ ‘फिर’ है।
- source_word: לַפְּלִשְׁתִּים אֶת יִשְׂרָאֵל
  choice: पलिश्तियों और इस्राएल के बीच
  rationale: इब्रानी की यह रचना दोनों पक्षों के पारस्परिक विरोध को बताती है; ‘के बीच’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וַיֵּרֶד
  choice: नीचे गया
  rationale: ירד की दिशात्मक भावना को बनाए रखता है और सम्भवतः युद्धस्थल की ओर उतरने का संकेत देता है।
- source_word: וַעֲבָדָיו עִמּוֹ
  choice: अपने सेवकों के साथ
  rationale: עֲבָדָיו का मूल अर्थ ‘उसके सेवक’ है; हिन्दी में ‘अपने सेवकों के साथ’ स्वाभाविक रूप से עִמּוֹ को भी समाहित करता है।
- source_word: וַיִּלָּחֲמוּ אֶת פְּלִשְׁתִּים
  choice: उन्होंने पलिश्तियों से युद्ध किया
  rationale: यह सैन्य संघर्ष को स्पष्ट, वर्तमान मानक हिन्दी में व्यक्त करता है।
- source_word: וַיָּעַף
  choice: थक गया
  rationale: क्रिया युद्ध के दौरान दाऊद के थक या शिथिल हो जाने को दर्शाती है; ‘थक गया’ सरल और सटीक है।
