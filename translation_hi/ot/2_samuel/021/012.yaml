base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/012.yaml
  text: Then David went and took the bones of Saul and the bones of Jonathan his son from the citizens of Jabesh-gilead[a], who had stolen them from the public square of Beth-shan[c][b], where the Philistines had hung them on the day the Philistines struck down Saul on Gilboa.
translation:
  language: hi
  text: तब दाऊद गया और शाऊल तथा उसके पुत्र योनातान की हड्डियाँ[a] याबेश-गिलाद के निवासियों से ले लीं। वे उन्हें बेत-शान के चौक से चुरा लाए थे, जहाँ पलिश्तियों ने उन्हें उस दिन लटका दिया था[b], जिस दिन उन्होंने गिलबोआ[c] में शाऊल को मार गिराया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अवशेष”; इब्रानी में शाब्दिक रूप से “हड्डियाँ” है।
    reason: lexical_alternative
  - marker: b
    text: “लटका दिया था” का अनुवाद “प्रदर्शन के लिए टाँग दिया था” भी हो सकता है; इब्रानी क्रिया का सीधा अर्थ “लटकाना” है।
    reason: lexical_alternative
  - marker: c
    text: गिलबोआ उस पर्वतीय क्षेत्र का नाम है जहाँ शाऊल मारा गया था (देखें 1 शमूएल 31:8–13)।
    reason: cross_reference
lexical_decisions:
- source_word: עַצְמוֹת
  choice: हड्डियाँ
  rationale: इब्रानी संज्ञा का सीधा अर्थ ‘हड्डियाँ’ है; दफ़नाने के इस प्रसंग में यह ‘अवशेष’ से अधिक ठोस और मूल-पाठ के निकट है।
- source_word: בַּעֲלֵי יָבֵישׁ גִּלְעָד
  choice: गिलाद के याबेश के निवासी
  rationale: स्थान-नाम के साथ בַּעֲלֵי यहाँ उस नगर से संबंधित लोगों या निवासियों को सूचित करता है; आधुनिक हिन्दी में ‘निवासी’ स्वाभाविक और समावेशी है।
- source_word: גָּנְבוּ
  choice: चुरा लाए थे
  rationale: क्रिया का मूल अर्थ ‘चुराना’ है और यह काम दाऊद की कार्रवाई से पहले हुआ था; ‘लाए’ प्रसंग में वहाँ से शव निकालकर ले जाने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵרְחֹב בֵּית שַׁן
  choice: बेत-शान के चौक से
  rationale: רְחֹב नगर के खुले सार्वजनिक चौक को दर्शाता है; ‘चौक’ संक्षिप्त और सहज हिन्दी है।
- source_word: תלוּם שָׁם
  choice: उन्हें ... लटका दिया था
  rationale: תלה का सबसे सीधा अर्थ ‘लटकाना’ है। ‘सूली पर चढ़ाना’ या ‘प्रदर्शन के लिए रखना’ अनावश्यक रूप से अधिक विशिष्ट होगा।
- source_word: הַכּוֹת ... אֶת שָׁאוּל
  choice: शाऊल को मार गिराया
  rationale: נכה यहाँ शाऊल पर हुए घातक प्रहार को व्यक्त करता है; ‘मार गिराया’ कथात्मक और स्वाभाविक है तथा केवल ‘हराया’ से अधिक ठीक अर्थ देता है।
- source_word: בַּגִּלְבֹּעַ
  choice: गिलबोआ में
  rationale: इब्रानी में केवल स्थान-नाम है। हिन्दी में पर्वतीय क्षेत्र के संदर्भ में ‘में’ सहज है; ‘गिलबोआ पर्वत पर’ व्याख्यात्मक विस्तार होता।
- source_word: וַיֵּלֶךְ ... וַיִּקַּח
  choice: तब दाऊद जाकर ... ले आया
  rationale: वाव-क्रम कथा को आगे बढ़ाता है। हिन्दी में ‘तब ... जाकर ... ले आया’ गति और वस्तुओं को दाऊद के पास लाने, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: उसके पुत्र योनातान
  rationale: सर्वनाम का स्वाभाविक निकटवर्ती संदर्भ शाऊल है; यह हिन्दी क्रम संबंध को स्पष्ट रखते हुए इब्रानी आशय को बनाए रखता है।
