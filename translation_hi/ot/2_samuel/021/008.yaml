base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/008.yaml
  text: So the king took the two sons of Rizpah daughter of Aiah[a], whom she had borne to Saul—Armoni and Mephibosheth—and the five sons of Michal daughter of Saul, whom she had borne to Adriel son of Barzillai the Meholathite.
translation:
  language: hi
  text: तब राजा ने अय्याह की बेटी रिस्पा के उन दो बेटों—अर्मोनी और मपीबोशेत—को, जिन्हें उसने शाऊल के लिए जन्म दिया था, और शाऊल की बेटी मीकल[a] के उन पाँच बेटों को ले लिया, जिन्हें उसने महोलावासी बर्जिल्लै के बेटे अद्रीएल के लिए जन्म दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों और प्राचीन अनुवादों में ‘मीकल’ के स्थान पर ‘मेरब’ है; 1 शमूएल 18:19 से तुलना करें, जहाँ अद्रीएल का विवाह शाऊल की बेटी मेरब से बताया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: इसलिए ... ले लिया
  rationale: वाव-क्रमागत रूप कथा को आगे बढ़ाता है; संदर्भ में परिणामात्मक क्रम को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: मूल पाठ दाऊद का नाम न देकर पदवी का प्रयोग करता है, इसलिए पदवी ही रखी गई है।
- source_word: שְׁנֵי בְּנֵי
  choice: उन दो बेटों
  rationale: गिने हुए निश्चित समूह को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רִצְפָּה בַת אַיָּה
  choice: अय्याह की बेटी रिस्पा
  rationale: בַת का स्वाभाविक हिन्दी संबंधसूचक अनुवाद किया गया और नामों का देवनागरी लिप्यंतरण किया गया है।
- source_word: אֲשֶׁר יָלְדָה לְשָׁאוּל
  choice: जिन्हें उसने शाऊल से जन्म दिया था
  rationale: ילד के साथ ל यहाँ पिता को चिह्नित करता है; हिन्दी में 'शाऊल से जन्म दिया' इसी संबंध को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: אַרְמֹנִי וְאֶת מְפִבֹשֶׁת
  choice: अर्मोनी और मपीबोशेत
  rationale: दोनों व्यक्तिनामों का स्रोत-रूप के निकट प्रचलित बाइबिलीय हिन्दी लिप्यंतरण किया गया है।
- source_word: חֲמֵשֶׁת בְּנֵי
  choice: उन पाँच बेटों
  rationale: दूसरे निश्चित समूह को पहले समूह के समानांतर स्वाभाविक हिन्दी में रखा गया है।
- source_word: מִיכַל בַּת שָׁאוּל
  choice: शाऊल की बेटी मीकल
  rationale: WLC के मुख्य पाठ में मीकल है; पाठगत कठिनाई को हल किए बिना इसी पाठ को मुख्य पंक्ति में रखा गया है।
- source_word: אֲשֶׁר יָלְדָה לְעַדְרִיאֵל
  choice: जिन्हें उसने ... अद्रीएल से जन्म दिया था
  rationale: पहले समान वाक्यांश के अनुरूप अनुवाद करके हिब्रू की समानांतर रचना सुरक्षित रखी गई है।
- source_word: בֶּן בַּרְזִלַּי הַמְּחֹלָתִי
  choice: महोलावासी बर्जिल्लै के बेटे
  rationale: वंश-संबंध और भौगोलिक पहचान दोनों को सहज आधुनिक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: अद्रीएल के पुत्रों की माता के रूप में ‘मीकल’ से उत्पन्न ऐतिहासिक/पाठगत तनाव
  choice: मुख्य पाठ में WLC का ‘मीकल’ रखा गया और पाठांतर को पादटिप्पणी में दिया गया।
  alternative: शाऊल की बेटी मेरब
  rationale: मूल हिब्रू पाठ को चुपचाप 1 शमूएल 18:19 के अनुरूप बदलना उचित नहीं होगा। पादटिप्पणी पाठक को महत्वपूर्ण प्राचीन पाठांतर और संबंधित कठिनाई दोनों से अवगत कराती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज कथात्मक शैली अपनाई गई है। लंबे हिब्रू वाक्य की समानांतर संरचना बनाए रखते हुए डैश से दोनों पुत्रों के नाम स्पष्ट किए गए हैं। ‘महोलावासी’ भौगोलिक विशेषण का सामान्य हिन्दी रूप है।
