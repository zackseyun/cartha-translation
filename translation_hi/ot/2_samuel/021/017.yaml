  text: וַ/יַּֽעֲזָר ל/וֹ֙ אֲבִישַׁ֣י בֶּן צְרוּיָ֔ה וַ/יַּ֥ךְ אֶת הַ/פְּלִשְׁתִּ֖י וַ/יְמִיתֵ֑/הוּ אָ֣ז נִשְׁבְּעוּ֩ אַנְשֵׁי דָוִ֨ד ל֜/וֹ לֵ/אמֹ֗ר לֹא תֵצֵ֨א ע֤וֹד אִתָּ֨/נוּ֙ לַ/מִּלְחָמָ֔ה וְ/לֹ֥א תְכַבֶּ֖ה אֶת נֵ֥ר יִשְׂרָאֵֽל־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/017.yaml
  text: But Abishai son of Zeruiah came to his aid[a], struck the Philistine, and killed him. Then David’s men swore to him, saying, “You must not go out with us to battle any longer, lest you extinguish the lamp of Israel.”
translation:
  language: hi
  text: पर सरूयाह के पुत्र अबीशै ने दाऊद की सहायता की, उस पलिश्ती पर वार किया और उसे मार डाला। तब दाऊद के लोगों ने उनसे शपथ खाकर कहा, “अब से आप हमारे साथ युद्ध में नहीं जाएँगे, कहीं ऐसा न हो कि आप इस्राएल का दीपक[a] बुझा दें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल का प्रकाश।” इब्रानी में शाब्दिक रूप से “दीपक” है—यह राष्ट्र के जीवन और स्थिरता में दाऊद की महत्त्वपूर्ण भूमिका का रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזָר לוֹ
  choice: दाऊद की सहायता की
  rationale: עזר का अर्थ ‘सहायता करना’ है। सर्वनाम के स्थान पर ‘दाऊद’ रखने से हिन्दी में संदर्भ स्पष्ट रहता है और युद्ध में हस्तक्षेप का भाव स्वाभाविक ढंग से व्यक्त होता है।
- source_word: אֲבִישַׁי בֶּן צְרוּיָה
  choice: सरूयाह के पुत्र अबीशै
  rationale: व्यक्तिनामों का प्रचलित हिन्दी लिप्यंतरण किया गया है और בן को स्वाभाविक संबंधसूचक वाक्यांश ‘के पुत्र’ से व्यक्त किया गया है।
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי
  choice: उस पलिश्ती पर वार किया
  rationale: נכה का मूल भाव ‘मारना/प्रहार करना’ है। अगले क्रियापद में मृत्यु स्पष्ट कही गई है, इसलिए ‘मार गिराया’ जैसी पुनरुक्ति से बचते हुए ‘वार किया’ चुना गया है।
- source_word: וַיְמִיתֵהוּ
  choice: और उसे मार डाला
  rationale: מות के हिफ़ील रूप का अर्थ यहाँ मृत्यु का कारण बनना है; ‘मार डाला’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: אָז נִשְׁבְּעוּ אַנְשֵׁי דָוִד לוֹ
  choice: तब दाऊद के लोगों ने उनसे शपथ खाकर कहा
  rationale: נשבע विधिवत शपथ लेने को दर्शाता है। ‘उनसे’ दाऊद के प्रति आदरसूचक संबोधन को बनाए रखता है, और ‘शपथ खाकर कहा’ हिन्दी में उद्धृत शपथ का स्वाभाविक परिचय है।
- source_word: לֹא תֵצֵא עוֹד אִתָּנוּ לַמִּלְחָמָה
  choice: अब से आप हमारे साथ युद्ध में नहीं जाएँगे
  rationale: शपथ के संदर्भ में अपूर्ण क्रिया दृढ़ निषेध व्यक्त करती है। ‘नहीं जाएँगे’ यहाँ साधारण भविष्य नहीं, बल्कि शपथबद्ध रोक है; ‘आप’ राजा दाऊद के लिए स्वाभाविक आदरसूचक रूप है।
- source_word: וְלֹא תְכַבֶּה
  choice: कहीं ऐसा न हो कि आप … बुझा दें
  rationale: यद्यपि इब्रानी में वाक्यांश ‘और नहीं’ से जुड़ा है, प्रसंग में यह उस आशंकित परिणाम को बताता है जिससे बचना है। हिन्दी का ‘कहीं ऐसा न हो कि’ इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: נֵר יִשְׂרָאֵל
  choice: इस्राएल का दीपक
  rationale: נֵר का ठोस अर्थ ‘दीपक’ है। इसे बनाए रखने से दाऊद की राष्ट्र को जीवन और स्थिरता देने वाली भूमिका का मूल इब्रानी रूपक सुरक्षित रहता है।
theological_decisions:
- issue: दाऊद के लिए इस्राएल को बनाए रखने वाले प्रकाश का रूपक
  choice: मुख्य पाठ में ‘इस्राएल का दीपक’
  alternative: इस्राएल का प्रकाश
  rationale: इब्रानी पाठ अमूर्त व्याख्या के बजाय दीपक का ठोस रूपक देता है। ‘दीपक’ राजकीय और जीवनदायी साहित्यिक छवि को बिना अतिरिक्त धर्मवैज्ञानिक अर्थ आरोपित किए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दाऊद को संबोधित करते समय आदरसूचक ‘आप/उनसे’ का प्रयोग किया गया है। युद्ध-वर्णन संक्षिप्त रखा गया है और ‘दीपक’ का मूल रूपक मुख्य पाठ में सुरक्षित है।
