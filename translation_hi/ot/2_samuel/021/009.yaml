  text: וַֽ/יִּתְּנֵ֞/ם בְּ/יַ֣ד הַ/גִּבְעֹנִ֗ים וַ/יֹּקִיעֻ֤/ם בָּ/הָר֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יִּפְּל֥וּ שבעתים יָ֑חַד ו/הם הֻמְת֜וּ בִּ/ימֵ֤י קָצִיר֙ בָּ/רִ֣אשֹׁנִ֔ים תחלת קְצִ֥יר שְׂעֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/009.yaml
  text: He gave them into the hand of the Gibeonites[a], and they hanged them on the mountain before Yahweh, and the seven of them fell together. They were put to death in the first days of harvest, at the beginning of the barley harvest.
translation:
  language: hi
  text: उसने उन्हें गिबोनियों के हाथ में सौंप दिया। उन्होंने उन्हें यहोवा के सामने पहाड़ पर लटका दिया[a], और वे सातों एक साथ गिर पड़े। उन्हें कटनी के आरम्भिक दिनों में, जौ की कटनी के आरम्भ में, मार डाला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें भेदकर लटका दिया” अथवा “सार्वजनिक रूप से प्रदर्शित किया।” इब्रानी क्रिया सार्वजनिक रूप से टाँगने या प्रदर्शित करने के व्यापक अर्थ में हो सकती है; इससे मृत्युदंड की ठीक विधि निश्चित नहीं होती।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵם בְּיַד הַגִּבְעֹנִים
  choice: उसने उन्हें गिबोनियों के हाथ में सौंप दिया
  rationale: נתן के साथ בְּיַד का मुहावरा किसी को दूसरे के अधिकार या वश में सौंपने का भाव देता है; इसलिए केवल ‘दे दिया’ की अपेक्षा ‘हाथ में सौंप दिया’ अधिक स्पष्ट और स्वाभाविक है।
- source_word: וַיֹּקִיעֻם
  choice: उन्होंने उन्हें ... लटका दिया
  rationale: क्रिया सार्वजनिक रूप से टाँगने, सूली पर चढ़ाने या प्रदर्शित करने का संकेत दे सकती है। मुख्य पाठ में सहज हिन्दी ‘लटका दिया’ रखा गया है और विधि की अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: בָּהָר
  choice: पहाड़ पर
  rationale: निश्चित एकवचन הַר का सीधा अर्थ ‘पहाड़’ है; प्रसंग में स्थानवाचक ‘पहाड़ पर’ स्वाभाविक है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: यह वाक्यांश घटना को यहोवा की उपस्थिति में अथवा उसके सम्मुख घटित बताता है और उसके वाचागत-न्यायिक तनाव को बनाए रखता है।
- source_word: וַיִּפְּלוּ שבעתים יָחַד
  choice: और वे सातों एक साथ गिर पड़े
  rationale: ‘गिर पड़े’ मृत्यु के लिए प्रयुक्त इब्रानी बिम्ब को बनाए रखता है; ‘वे सातों’ संख्यात्मक भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: הֻמְתוּ
  choice: उन्हें ... मार डाला गया
  rationale: מות के होफ़ाल रूप का कारणवाचक कर्मवाच्य भाव हिन्दी के ‘मार डाला गया’ से स्पष्ट होता है।
- source_word: בִּימֵי קָצִיר בָּרִאשֹׁנִים
  choice: कटनी के आरम्भिक दिनों में
  rationale: यह कटनी के मौसम के शुरुआती दिनों का काल-सूचक वाक्यांश है।
- source_word: תחלת קְצִיר שְׂעֹרִים
  choice: जौ की कटनी के आरम्भ में
  rationale: यह पिछली काल-सूचना को अधिक ठीक रूप से जौ की कटनी का आरम्भ बताकर स्पष्ट करता है।
theological_decisions:
- issue: यקע द्वारा बताई गई मृत्युदंड की विधि
  choice: मुख्य पाठ में ‘लटका दिया’, साथ में पादटिप्पणी
  alternative: ‘सूली पर चढ़ा दिया’ या ‘सार्वजनिक रूप से प्रदर्शित किया’
  rationale: इब्रानी क्रिया सार्वजनिक मृत्युदंड या शवों को सार्वजनिक रूप से टाँगने/प्रदर्शित करने को सूचित कर सकती है, पर ठीक विधि निश्चित नहीं करती। इसलिए मुख्य पाठ पठनीय है और पादटिप्पणी वास्तविक शाब्दिक अनिश्चितता बनाए रखती है।
- issue: לִפְנֵי יְהוָה का धार्मिक-न्यायिक भाव
  choice: ‘यहोवा के सामने’
  alternative: ‘यहोवा की उपस्थिति में’
  rationale: ‘सामने’ मूल वाक्यांश की निकटता बनाए रखता है और यह तय नहीं करता कि इसका अर्थ केवल स्थानगत, धार्मिक या न्यायिक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज कथात्मक शैली रखी गई है। ‘गिबोनियों’, ‘कटनी’ और ‘यहोवा’ जैसे प्रचलित बाइबलीय पदों का उपयोग किया गया है; साथ ही इब्रानी क्रम और ‘गिर पड़े’ के मृत्यु-बिम्ब को यथासम्भव सुरक्षित रखा गया है।
