base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/022.yaml
  text: These four were born to the Rapha in Gath[a], and they fell by the hand of David and by the hand of his servants.
translation:
  language: hi
  text: ये चारों गत में राफा से उत्पन्न हुए थे[a], और वे दाऊद और उसके सेवकों के हाथों मारे गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राफा को जन्मे थे,” “दैत्य के वंशज थे,” अथवा “रफाईम के वंशज थे।” इब्रानी पाठ संभवतः गत से जुड़े दैत्यवंश से उनके संबंध का संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַרְבַּעַת אֵלֶּה
  choice: ये चारों
  rationale: संख्या और संकेतवाचक के इस मेल का स्वाभाविक हिन्दी रूप ‘ये चारों’ है; ‘पुरुष’ मूल में स्पष्ट नहीं है।
- source_word: יֻלְּדוּ
  choice: वंश में जन्मे थे
  rationale: यहाँ ילד का निष्क्रिय रूप जन्म और वंशगत संबंध बताता है। ‘वंश में जन्मे’ हिन्दी में उस आशय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְהָרָפָה
  choice: राफा के वंश में
  rationale: इसे राफा नामक पूर्वज अथवा उससे जुड़े वंश की ओर संकेत मानते हुए नाम को बनाए रखा गया है; ‘दैत्य’ या ‘रफाई’ कहकर अस्पष्टता को मुख्य पाठ में हल नहीं किया गया।
- source_word: בְּגַת
  choice: गत में
  rationale: स्थानवाचक प्रयोग का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: וַיִּפְּלוּ
  choice: मारे गए
  rationale: युद्ध-संदर्भ में ‘गिरे’ का अर्थ मृत्यु है। आधुनिक हिन्दी में ‘मारे गए’ अपेक्षित अर्थ को अधिक स्वाभाविक ढंग से संप्रेषित करता है।
- source_word: בְיַד
  choice: के हाथों
  rationale: अभिकर्ता बताने वाले इब्रानी मुहावरे को हिन्दी के समान मुहावरे ‘के हाथों’ से व्यक्त किया गया है।
- source_word: עֲבָדָיו
  choice: उसके सेवकों
  rationale: राजकीय और सैनिक संदर्भ में यह राजा की सेवा में रहने वाले व्यक्तियों को दर्शाता है; ‘सेवकों’ मूल शब्द से निकट है और अनावश्यक विशिष्टता नहीं जोड़ता।
theological_decisions:
- issue: הָרָפָה की पहचान
  choice: राफा नामक या उपाधिसूचक पूर्वज/वंश से संबंध, मुख्य पाठ में ‘राफा के वंश में’
  alternative: ‘राफा से,’ ‘दैत्य के वंश में,’ अथवा ‘रफाइयों में’
  rationale: पद पिछले दैत्याकार योद्धाओं के वृत्तांतों का सार देता और इन चारों को गत की राफा/रफा परंपरा से जोड़ता है। इब्रानी रूप व्यक्ति, कुल-पूर्वज या दैत्यवंश की ओर संकेत कर सकता है, इसलिए नाम को बनाए रखते हुए टिप्पणी में विकल्प दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘के हाथों’ मूल इब्रानी मुहावरे को स्वाभाविक हिन्दी में बनाए रखता है; ‘मारे गए’ युद्ध में ‘गिरने’ के आशय को स्पष्ट करता है।
