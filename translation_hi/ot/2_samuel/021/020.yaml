base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/020.yaml
  text: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six and six, twenty-four in number[c][b]; he also was born to the Rapha.
translation:
  language: hi
  text: फिर गत में युद्ध हुआ। वहाँ असाधारण कद-काठी का एक पुरुष था[a]। उसके हाथों और पैरों में छह-छह उँगलियाँ थीं[b]—कुल चौबीस। वह भी राफा के वंश से था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहुत बड़े डील-डौल का एक पुरुष”; अधिक शाब्दिक रूप से, “माप का पुरुष।”
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से, “उसके हाथों की उँगलियाँ और उसके पैरों की उँगलियाँ”; आशय है कि प्रत्येक हाथ और प्रत्येक पैर में छह उँगलियाँ थीं।
    reason: lexical_clarification
  - marker: c
    text: या “राफा से उत्पन्न हुआ था।” संभवतः यह राफा या रफाई लोगों से वंशगत संबंध की ओर संकेत है; वे असाधारण कद-काठी से जुड़े माने जाते थे।
    reason: alternative_reading
lexical_decisions:
- source_word: מִלְחָמָה
  choice: युद्ध
  rationale: यह संज्ञा व्यापक सशस्त्र संघर्ष को दर्शाती है; बार-बार होने वाले युद्ध के प्रसंग में ‘युद्ध’ स्वाभाविक है।
- source_word: בְּגַת
  choice: गत में
  rationale: स्थानवाचक בְ का यहाँ स्वाभाविक हिन्दी रूप ‘में’ है।
- source_word: אִישׁ מדין
  choice: बहुत बड़े डील-डौल का एक पुरुष
  rationale: दुर्लभ पद מדין को माप या शारीरिक आकार से जुड़ा मानते हुए यह अनुवाद असाधारण देहाकार का अर्थ सहज हिन्दी में देता है, जबकि शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: אֶצְבְּעֹת יָדָיו ... אֶצְבְּעֹת רַגְלָיו
  choice: उसके हाथों और पैरों में ... उँगलियाँ
  rationale: हिब्रू हाथों और पैरों की उँगलियों का स्पष्ट उल्लेख करता है। हिन्दी में दोनों के लिए ‘उँगलियाँ’ स्वाभाविक है।
- source_word: שֵׁשׁ וָשֵׁשׁ
  choice: छह-छह
  rationale: यह हिब्रू की पुनरुक्ति को बनाए रखता है और प्रत्येक हाथ तथा पैर में छह उँगलियाँ होने का भाव व्यक्त करता है।
- source_word: עֶשְׂרִים וְאַרְבַּע מִסְפָּר
  choice: कुल चौबीस
  rationale: यह गिनती के सार को संक्षिप्त और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יֻלַּד לְהָרָפָה
  choice: राफा के वंश में जन्मा था
  rationale: ילד के कर्मवाच्य रूप और לְ का मेल जन्म अथवा वंश-संबंध दर्शाता है। यह हिन्दी रूप तत्काल पुत्रत्व का अनावश्यक दावा किए बिना वंशगत संबंध व्यक्त करता है।
theological_decisions:
- issue: הָרָפָה की पहचान
  choice: ‘राफा’ को वंश-सूचक व्यक्तिवाचक नाम मानना
  alternative: ‘दैत्य’ अथवा ‘रफाई लोग’
  rationale: पाठ आकार का केवल वर्णन करने के बजाय जन्म/वंश का संबंध बताता है। नाम को बनाए रखने से किसी विशिष्ट पहचान को मुख्य पाठ में थोपे बिना रफाई परंपरा से संभावित संबंध खुला रहता है।
translation_notes:
  register: आधुनिक, सुबोध और गरिमापूर्ण हिन्दी रखी गई है। ‘डील-डौल’ सामान्य पाठक के लिए सहज है, जबकि दुर्लभ हिब्रू पद की शाब्दिक अनिश्चितता पादटिप्पणी में सुरक्षित है। छोटे वाक्य असाधारण शारीरिक विवरण और कुल संख्या को स्पष्ट बनाते हैं।
