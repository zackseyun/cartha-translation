  text: וַ/יֹּֽאמְרוּ֙ אֶל הַ/מֶּ֔לֶךְ הָ/אִישׁ֙ אֲשֶׁ֣ר כִּלָּ֔/נוּ וַ/אֲשֶׁ֖ר דִּמָּה לָ֑/נוּ נִשְׁמַ֕דְנוּ מֵֽ/הִתְיַצֵּ֖ב בְּ/כָל גְּבֻ֥ל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/005.yaml
  text: They said to the king[a], “The man who consumed us, and who planned against us[b], so that we should be destroyed from having a place within all the territory of Israel—”
translation:
  language: hi
  text: उन्होंने राजा से कहा, “जिस मनुष्य ने हमारा नाश किया और हमारे विरुद्ध ऐसी योजना बनाई कि हम मिट जाएँ और इस्राएल के पूरे क्षेत्र में कहीं भी हमारा कोई स्थान न रहे—”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּלָּנוּ
  choice: हमारा नाश किया
  rationale: כלה के पिएल रूप का अर्थ यहाँ समाप्त कर देना या नष्ट कर देना है। ‘हमारा नाश किया’ आरोप की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דִּמָּה לָנוּ
  choice: हमारे विरुद्ध ऐसी योजना बनाई
  rationale: इस प्रसंग में דמה का अर्थ शत्रुतापूर्ण योजना बनाना है; לָנוּ को प्रसंगानुसार ‘हमारे विरुद्ध’ व्यक्त किया गया है।
- source_word: נִשְׁמַדְנוּ
  choice: कि हम मिट जाएँ
  rationale: שׁמד के निफ़अल रूप में विनष्ट या उन्मूलित होने का भाव है। यहाँ इसे पिछली योजना के आशय या परिणाम के रूप में रखा गया है, जैसा कि इब्रानी वाक्य की संरचना अनुमति देती है।
- source_word: מֵהִתְיַצֵּב
  choice: कहीं भी हमारा कोई स्थान न रहे
  rationale: התייצב का मूल भाव खड़े होने या स्वयं को स्थापित रखने का है। इस संदर्भ में यह इस्राएल में समुदाय के रूप में बने रहने और स्थान पाने को सूचित करता है।
- source_word: בְּכָל גְּבֻל יִשְׂרָאֵל
  choice: इस्राएल के पूरे क्षेत्र में कहीं भी
  rationale: גְּבוּל यहाँ केवल सीमा-रेखा नहीं, बल्कि इस्राएल का समस्त भू-क्षेत्र है; כָּל की व्यापकता को ‘पूरे...कहीं भी’ से स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: הָאִישׁ
  choice: जिस मनुष्य ने
  rationale: निश्चित संज्ञा पहले उल्लिखित शाऊल की ओर संकेत करती है। हिन्दी संबंधवाचक वाक्य में ‘जिस मनुष्य ने’ स्वाभाविक और मूल के निकट है।
