source:
  edition: WLC
  text: וַ/יִּקְבְּר֣וּ אֶת עַצְמוֹת שָׁא֣וּל וִ/יהוֹנָֽתָן בְּ֠נ/וֹ בְּ/אֶ֨רֶץ בִּנְיָמִ֜ן בְּ/צֵלָ֗ע בְּ/קֶ֨בֶר֙ קִ֣ישׁ אָבִ֔י/ו וַֽ/יַּעֲשׂ֔וּ כֹּ֥ל אֲשֶׁר צִוָּ֖ה הַ/מֶּ֑לֶךְ וַ/יֵּעָתֵ֧ר אֱלֹהִ֛ים לָ/אָ֖רֶץ אַֽחֲרֵי כֵֽן־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/014.yaml
  text: They buried the bones of Saul and of Jonathan his son in the land of Benjamin[a], in Zela, in the tomb of Kish his father. They did all that the king had commanded, and after that God responded to the plea for the land.
translation:
  language: hi
  text: उन्होंने शाऊल और उसके पुत्र योनातान की हड्डियों को बिन्यामीन के प्रदेश में, सेला में, शाऊल के पिता कीश की कब्र में दफनाया। उन्होंने वह सब किया जिसकी आज्ञा राजा ने दी थी। इसके बाद परमेश्वर ने देश के लिए की गई विनती स्वीकार की[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर ने देश के लिए प्रार्थना सुन ली।” इब्रानी क्रिया का आशय विनती के प्रति अनुकूल उत्तर देना है।
    reason: עתר के निफ़अल रूप में निहित विनती और अनुकूल उत्तर के भाव के लिए वैकल्पिक हिन्दी अभिव्यक्ति।
lexical_decisions:
- source_word: וַיִּקְבְּרוּ
  choice: उन्होंने ... दफनाया
  rationale: קבר का सीधा अर्थ दफनाना है। हिन्दी कथा-शैली में आरम्भिक וַ को अलग से ‘और’ कहे बिना घटनाक्रम स्वाभाविक रूप से बना रहता है।
- source_word: עַצְמוֹת
  choice: हड्डियों
  rationale: मूल पाठ के ठोस शब्द ‘हड्डियाँ’ को ‘अवशेष’ जैसे व्यापक शब्द से बदलने के बजाय यथावत रखा गया है।
- source_word: שָׁאוּל וִיהוֹנָתָן בְּנוֹ
  choice: शाऊल और उसके पुत्र योनातान की
  rationale: ‘उसके पुत्र’ से योनातान का शाऊल से सम्बन्ध स्पष्ट और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: בְּאֶרֶץ בִּנְיָמִן
  choice: बिन्यामीन के प्रदेश में
  rationale: אֶרֶץ के क्षेत्रीय अर्थ को ‘प्रदेश’ व्यक्त करता है और केवल ‘बिन्यामीन में’ की अपेक्षा मूल की पूर्णता बचाता है।
- source_word: בְּצֵלָע
  choice: सेला में
  rationale: स्थान-नाम का आधुनिक हिन्दी देवनागरी में लिप्यंतरण किया गया है।
- source_word: בְּקֶבֶר קִישׁ אָבִיו
  choice: शाऊल के पिता कीश की कब्र में
  rationale: קֶבֶר के लिए ‘कब्र’ स्वाभाविक है। सर्वनाम के आशय को स्पष्ट करते हुए कीश को शाऊल का पिता कहा गया है; इससे हिन्दी में योनातान को निकटतम सम्भावित पूर्वपद मान लेने की भ्रांति टलती है।
- source_word: וַיַּעֲשׂוּ כֹּל אֲשֶׁר צִוָּה הַמֶּלֶךְ
  choice: उन्होंने वह सब किया जिसकी आज्ञा राजा ने दी थी
  rationale: सम्बन्धवाचक उपवाक्य और आज्ञा की पूर्वपूर्णता दोनों सुरक्षित रहते हैं, जबकि वाक्य सहज आधुनिक हिन्दी में है।
- source_word: וַיֵּעָתֵר אֱלֹהִים
  choice: परमेश्वर ने ... विनती स्वीकार की
  rationale: עתר के निफ़अल रूप में विनती के प्रति अनुकूल उत्तर देने का भाव है। ‘विनती स्वीकार की’ हिन्दी में इस भाव को स्वाभाविक ढंग से व्यक्त करता है, यद्यपि विनती करने वाले का उल्लेख मूल में नहीं है।
- source_word: לָאָרֶץ
  choice: देश के लिए
  rationale: ל यहाँ देश के हित या उसके सम्बन्ध में की गई विनती का संकेत देता है। ‘देश के लिए’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: אַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह मानक कालवाचक अभिव्यक्ति पूर्ववर्ती कार्यों के बाद होने वाली घटना को स्पष्ट करती है।
theological_decisions:
- issue: וַיֵּעָתֵר אֱלֹהִים לָאָרֶץ का अर्थ
  choice: परमेश्वर ने देश के लिए की गई विनती स्वीकार की
  alternative: परमेश्वर ने देश के लिए प्रार्थना सुन ली; परमेश्वर ने देश के विषय में की गई विनती का अनुकूल उत्तर दिया
  rationale: इब्रानी क्रिया विनती के प्रति अनुकूल प्रतिक्रिया को अंतर्निहित रूप से व्यक्त करती है, लेकिन पद विनती करने वाले या विनती के शब्दों का उल्लेख नहीं करता। इसलिए ‘विनती स्वीकार की’ अर्थ को स्पष्ट करता है, पर ‘देश को चंगा किया’ जैसी अधिक व्याख्यात्मक परिणति नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। व्यक्तियों और स्थानों के नाम प्रचलित हिन्दी बाइबलीय रूपों में हैं। अंतिम वाक्य में मूल क्रिया का प्रार्थनात्मक आशय स्पष्ट किया गया है और [a] वहीं लगाया गया है जहाँ उसका सम्बन्ध है।
