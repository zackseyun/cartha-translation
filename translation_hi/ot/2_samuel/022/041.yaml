  text: You gave me the necks of my enemies[a]; I destroyed those who hated me.
translation:
  language: hi
  text: तूने मेरे शत्रुओं की गर्दनें मुझे दे दीं[a]; जो मुझसे घृणा करते थे, उनका मैंने नाश कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “तूने मेरे शत्रुओं की गर्दन/पीठ मुझे दे दी।” यह शत्रुओं के पीठ फेरकर भागने और विजेता के सामने पराजित होने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבַי
  choice: मेरे शत्रुओं
  rationale: אֹיֵב का सामान्य अर्थ ‘शत्रु’ है और प्रथम पुरुष एकवचन प्रत्यय ‘मेरे’ की माँग करता है। यह आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: תַּתָּה לִּי עֹרֶף
  choice: तूने ... की गर्दनें मेरे हाथ में कर दीं
  rationale: इब्रानी में शाब्दिक चित्र ‘मेरे लिए गर्दन/गर्दन का पिछला भाग देना’ है, जो शत्रुओं के पीठ फेरकर भागने और विजेता के वश में आने का मुहावरा है। ‘मेरे हाथ में कर दीं’ हिन्दी में इस विजय और अधिकार के भाव को स्वाभाविक रखते हुए ‘गर्दनें’ का मूल चित्र भी बचाता है।
- source_word: מְשַׂנְאַי
  choice: जो मुझसे घृणा करते थे
  rationale: שׂנא का कृदन्त प्रथम पुरुष प्रत्यय सहित उन लोगों को दर्शाता है जिनकी पहचान वक्ता से घृणा करने वालों के रूप में है। काव्यात्मक भूतकाल के संदर्भ में ‘करते थे’ स्वाभाविक है।
- source_word: וָאַצְמִיתֵם
  choice: उनका मैंने नाश कर दिया
  rationale: हिफ़ील रूप यहाँ मिटा देने, समाप्त करने या नाश करने का प्रबल अर्थ देता है। ‘नाश कर दिया’ सटीक, सहज और प्रसंगानुकूल है।
