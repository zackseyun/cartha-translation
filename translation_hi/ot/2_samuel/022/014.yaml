  text: Yahweh thundered from heaven[a], and the Most High gave his voice.
translation:
  language: hi
  text: 'याहवे स्वर्ग से गरज उठा,

    और परमप्रधान ने अपना स्वर सुनाया।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “अपनी आवाज़ दी।” यह “गरज उठा” के समानांतर एक काव्यात्मक अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְעֵם
  choice: गरजा
  rationale: रעם के हिफ़ील रूप का यहाँ अर्थ गरज उत्पन्न करना है। ‘गरजा’ आधुनिक हिन्दी में स्वाभाविक है और तूफ़ान के बीच परमेश्वर के प्रकट होने की काव्यात्मक छवि को बनाए रखता है।
- source_word: מִן שָׁמַיִם
  choice: स्वर्ग से
  rationale: שָׁמַיִם का अर्थ ‘आकाश’ अथवा ‘स्वर्ग’ हो सकता है। याहवे के प्रकट होने के इस प्रसंग में ‘स्वर्ग से’ स्थानगत और धर्मवैचारिक—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय उसके प्रचलित हिन्दी लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: וְעֶלְיוֹן
  choice: और परमप्रधान
  rationale: עֶלְיוֹן यहाँ याहवे के समानांतर प्रयुक्त ईश्वरीय उपाधि है। ‘परमप्रधान’ उसकी सर्वोच्चता का भाव संक्षिप्त और प्रतिष्ठित हिन्दी में बनाए रखता है।
- source_word: יִתֵּן קוֹלוֹ
  choice: अपनी आवाज़ दी
  rationale: इब्रानी का शाब्दिक काव्यात्मक मुहावरा ‘अपनी आवाज़ दी’ है। इसे बनाए रखने से पहले चरण के ‘गरजा’ के साथ समानांतरता सुरक्षित रहती है; अधिक स्वाभाविक वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का सीधे प्रयोग करता है; इसलिए उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित न करके लिप्यंतरित किया गया है।
- issue: יְהוָה और עֶלְיוֹן का संबंध
  choice: दोनों को इब्रानी काव्य-समानांतरता में एक ही परमेश्वर के नाम और उपाधि के रूप में प्रस्तुत करना
  alternative: ‘परमप्रधान’ को स्वतंत्र संबोधन अथवा अलग कर्ता के रूप में समझना
  rationale: दोनों अर्ध-पंक्तियाँ समान क्रिया-चित्र प्रस्तुत करती हैं, पर अनुवाद केवल ‘और’ के साथ मूल संरचना रखता है और कोई अतिरिक्त व्याख्यात्मक पहचान-वाक्य नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘अपनी आवाज़ दी’ सामान्य गद्य की अपेक्षा अधिक शाब्दिक है, पर मूल समानांतरता बचाने के लिए इसे मुख्य पाठ में रखा गया है और स्वाभाविक विकल्प पादटिप्पणी में दिया गया है।
