base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/027.yaml
  text: With the pure you show yourself pure[a], but with the crooked you show yourself twisted.
translation:
  language: hi
  text: 'निर्मल जन के साथ तू अपने को निर्मल दिखाता है,

    और कुटिल जन के साथ तू अपने को टेढ़ा दिखाता है[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस इब्रानी क्रिया का प्रयोग दुर्लभ है और इसका अर्थ निश्चित नहीं है। अनुवाद संभव है: “तू चतुराई से पेश आता है” या “तू उसके विरुद्ध हो जाता है।” यहाँ “टेढ़ा” कुटिल जन को उसके आचरण के अनुरूप मिलने वाले प्रत्युत्तर की काव्यात्मक छवि है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָר
  choice: निर्मल जन
  rationale: यह विशेषण शुद्धता या स्वच्छता का बोध कराता है। ‘निर्मल’ आधुनिक हिन्दी में स्वाभाविक है और अगले सजातीय क्रिया-रूप के साथ काव्यात्मक शब्द-साम्य बनाए रखता है। ‘जन’ जोड़ने से विशेषण का संज्ञात्मक प्रयोग सहज हो जाता है।
- source_word: תִּתָּבָר
  choice: तू अपने को निर्मल दिखाता है
  rationale: हित्पाएल रूप का आत्मवाचक भाव व्यक्त करता है और נָבָר के साथ मूल का शब्द-साम्य सुरक्षित रखता है।
- source_word: עִקֵּשׁ
  choice: कुटिल जन
  rationale: यह नैतिक टेढ़ेपन और छलपूर्ण आचरण का सूचक है। ‘कुटिल’ ‘निर्मल’ के विपरीत स्पष्ट तथा गरिमापूर्ण हिन्दी है।
- source_word: תִּתַּפָּל
  choice: तू अपने को टेढ़ा दिखाता है
  rationale: दुर्लभ और कठिन क्रिया का नकारात्मक, प्रत्युत्तरात्मक भाव सीधे रखा गया है। ‘टेढ़ा’ कुटिल व्यक्ति के प्रति उसी के अनुरूप परमेश्वर के व्यवहार की तनावपूर्ण काव्यात्मक छवि को बिना चुपचाप नरम किए सुरक्षित रखता है।
- source_word: עִם
  choice: के साथ
  rationale: यह संबंध और अनुरूप व्यवहार दोनों व्यक्त करता है; दोनों समानांतर पंक्तियों में ‘के साथ’ स्वाभाविक है।
theological_decisions:
- issue: कुटिल मनुष्य के प्रति परमेश्वर की प्रतिक्रिया को कैसे व्यक्त किया जाए
  choice: तू अपने को टेढ़ा दिखाता है
  alternative: तू चतुराई से पेश आता है; तू विरोधी बन जाता है
  rationale: मुख्य पाठ दुर्लभ इब्रानी क्रिया के कठोर और जानबूझकर तनावपूर्ण रूपक को बनाए रखता है, न तो परमेश्वर को नैतिक रूप से कुटिल घोषित करता है और न ही अर्थ को पहले से ‘चतुर’ कहकर सुलझाता है। ‘अपने को…दिखाता है’ संबंधपरक और आत्मवाचक भाव स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, काव्यात्मक समानांतरता और एकवचन निकट संबोधन ‘तू’ के साथ। ‘निर्मल/निर्मल’ का शब्द-साम्य और ‘कुटिल/टेढ़ा’ का अर्थ-साम्य मूल की संरचना को सुनने योग्य बनाते हैं।
