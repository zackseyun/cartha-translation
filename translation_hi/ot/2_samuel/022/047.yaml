  text: Yahweh lives[a], and blessed be my rock, and exalted be God, the rock of my salvation.
translation:
  language: hi
  text: याहवे जीवित हैं! मेरी चट्टान धन्य हो! परमेश्वर—मेरे उद्धार की चट्टान[a]—ऊँचे ठहरें!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी उद्धारक चट्टान,” अथवा “मेरे छुटकारे की चट्टान।”
    reason: צור ישעי पदबंध में ‘उद्धार’ को संबंध, गुण अथवा छुटकारे के अर्थ में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: חַי יְהוָה
  choice: याहवे जीवित हैं
  rationale: यह विधिविहीन इब्रानी पदबंध स्तुतिपरक घोषणा है, न कि शपथ का सूत्र। हिन्दी में आदरसूचक बहुवचन के साथ ‘जीवित हैं’ स्वाभाविक और स्पष्ट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को लिप्यंतरित करके सुरक्षित रखा गया है।
- source_word: וּבָרוּךְ
  choice: धन्य हो
  rationale: स्तुति के संदर्भ में यह रूप आशीर्वचनात्मक जयघोष व्यक्त करता है; ‘धन्य हो’ उस भाव को सहज हिन्दी में बनाए रखता है।
- source_word: צוּרִי
  choice: मेरी चट्टान
  rationale: צוּר के ठोस रूपक को ‘शरण’ जैसे व्याख्यात्मक शब्द से बदलने के बजाय ज्यों का त्यों रखा गया है।
- source_word: וְיָרֻם
  choice: महान ठहराए जाएँ
  rationale: जुस्सिव भाव स्तुतिपरक कामना या जयघोष है। शाब्दिक ‘ऊँचा किया जाए’ की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक है और परमेश्वर के उत्कर्ष की घोषणा को बनाए रखता है।
- source_word: אֱלֹהֵי צוּר יִשְׁעִי
  choice: परमेश्वर—मेरे उद्धार की चट्टान
  rationale: काव्यात्मक समानांतरता के आधार पर ‘परमेश्वर’ और ‘मेरे उद्धार की चट्टान’ को समानाधिकरण में समझा गया है; इससे असामान्य संधिबद्ध रचना को अनावश्यक रूप से निर्णीत किए बिना अर्थ स्पष्ट रहता है।
- source_word: צור ישעי
  choice: मेरे उद्धार की चट्टान
  rationale: ‘चट्टान’ मूल रूपक को और ‘उद्धार’ יֶשַׁע के व्यापक बचावकारी अर्थ को सुरक्षित रखते हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में विशिष्ट ईश्वरीय नाम है; उसका लिप्यंतरण नाम और उपाधि के भेद को बनाए रखता है।
- issue: परमेश्वर के लिए צוּר का रूपक
  choice: चट्टान
  alternative: शरण; दृढ़ आश्रय
  rationale: मूल का रूपक परमेश्वर की स्थिरता और रक्षक सामर्थ्य को व्यक्त करता है, इसलिए उसे व्याख्यात्मक शब्द से नहीं बदला गया।
- issue: אֱלֹהֵי צוּר יִשְׁעִי की वाक्यरचना
  choice: परमेश्वर—मेरे उद्धार की चट्टान
  alternative: मेरे उद्धार की चट्टान के परमेश्वर
  rationale: रूपात्मक रूप से संधिबद्ध पठन संभव है, पर वह अर्थ की दृष्टि से असामान्य है। काव्यात्मक समानांतरता समानाधिकरण वाले पठन का समर्थन करती है, जबकि पादटिप्पणी निकटवर्ती पदबंध के वैकल्पिक अर्थ बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और स्तुतिपरक हिन्दी अपनाई गई है। तीन विस्मयादिबोधक खंड मूल की काव्यात्मक घोषणाओं को उभारते हैं। परमेश्वर के लिए आदरसूचक बहुवचन क्रिया-रूप हिन्दी की स्वाभाविक धार्मिक शैली के अनुरूप हैं।
