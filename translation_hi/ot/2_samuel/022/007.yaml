  yaml_path: translation/ot/2_samuel/022/007.yaml
  text: In my distress I call on Yahweh[a]; I call to my God. He hears my voice from his temple[b], and my cry for help reaches his ears.
translation:
  language: hi
  text: 'अपने संकट में मैं याहवे को पुकारता हूँ;

    मैं अपने परमेश्वर को पुकारता हूँ।

    वह अपने मंदिर[a] से मेरी आवाज़ सुनता है[b],

    और मेरी दुहाई उसके कानों तक पहुँचती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मंदिर’ का अनुवाद ‘राजमहल’ या ‘पवित्रस्थान’ भी हो सकता है; यहाँ संकेत परमेश्वर के स्वर्गीय निवास की ओर हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उसने ... सुनी।’ इब्रानी कथात्मक क्रिया का औपचारिक भूतकालीन अनुवाद।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לִי
  choice: अपने संकट में
  rationale: यह पदबंध उस प्रतिकूल अवस्था को व्यक्त करता है जिसमें वक्ता था। ‘अपने संकट में’ संक्षिप्त, स्वाभाविक और काव्यात्मक हिन्दी है।
- source_word: אֶקְרָא
  choice: मैंने … पुकारा
  rationale: दोनों प्रयोगों में एक ही हिन्दी क्रिया रखकर मूल की पुनरावृत्ति सुरक्षित की गई है। गीत के कथात्मक प्रसंग और इसके बाद आए וַיִּשְׁמַע के अनुसार भूतकाल स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में उसका लिप्यंतरण किया गया है।
- source_word: אֱלֹהַי
  choice: मेरे परमेश्वर
  rationale: एकवचन संज्ञा और प्रथम पुरुष एकवचन प्रत्यय का सीधा अर्थ ‘मेरे परमेश्वर’ है।
- source_word: וַיִּשְׁמַע
  choice: उसने … सुनी
  rationale: इब्रानी कथात्मक क्रिया का भूतकालीन रूप रखा गया है और स्त्रीलिंग ‘आवाज़’ के अनुसार हिन्दी वाक्य बनाया गया है।
- source_word: מֵהֵיכָלוֹ
  choice: अपने मंदिर से
  rationale: הֵיכָל मंदिर, राजमहल या पवित्र निवास का बोध करा सकता है। परमेश्वर के निवास के संदर्भ में ‘मंदिर’ मुख्य पाठ में सबसे परिचित और उपयुक्त है; अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: קוֹלִי
  choice: मेरी आवाज़
  rationale: यह मूल पद का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: שַׁוְעָתִי
  choice: मेरी दुहाई
  rationale: שַׁוְעָה संकट में सहायता के लिए उठाई गई पुकार है। ‘दुहाई’ इस सहायता-विनती को संक्षेप में व्यक्त करती है।
- source_word: בְּאָזְנָיו
  choice: उसके कानों तक पहुँची
  rationale: शाब्दिक चित्र ‘उसके कानों में’ है। ‘कानों तक पहुँची’ आधुनिक हिन्दी में स्वाभाविक रहते हुए सुन लिए जाने की वही सजीव छवि बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसे एक उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है और ‘Jehovah/यहोवा’ की अपेक्षा इब्रानी नाम के संभावित उच्चारण के अधिक निकट है।
- issue: הֵיכָל में परमेश्वर के निवास का स्वरूप
  choice: मंदिर
  alternative: राजमहल; पवित्रस्थान
  rationale: शब्द में राजकीय और पवित्र—दोनों अर्थछायाएँ संभव हैं और यहाँ परमेश्वर का स्वर्गीय निवास अभिप्रेत हो सकता है। मुख्य पाठ में ‘मंदिर’ रखा गया है, जबकि अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। समानांतर काव्य-पंक्तियों और ‘पुकारा’ की पुनरावृत्ति को बनाए रखा गया है।
