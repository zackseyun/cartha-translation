  text: For who is God besides Yahweh? And who is a rock besides our God?[a]
translation:
  language: hi
  text: क्योंकि याहवे के सिवा परमेश्वर कौन है? और हमारे परमेश्वर के सिवा चट्टान कौन है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे परमेश्वर के सिवा ‘चट्टान’ कौन है?” इब्रानी में “चट्टान” परमेश्वर के लिए बार-बार प्रयुक्त रूपक है और कभी-कभी लगभग एक उपाधि के समान काम करता है।
    reason: मूल रूपक के सामान्य संज्ञा और लगभग उपाधि-सदृश प्रयोग—दोनों संभावित बलों को सुरक्षित रखना।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले स्तुतिगान का आधार बताता है और इब्रानी संयोजक का व्याख्यात्मक कारण-संबंध बनाए रखता है।
- source_word: מִי
  choice: कौन
  rationale: अलंकारिक प्रश्न के लिए सीधा और स्वाभाविक हिन्दी रूप।
- source_word: אֵל
  choice: परमेश्वर
  rationale: इस एकेश्वरवादी संदर्भ में सच्चे परमेश्वर का बोध कराता है; आधुनिक हिन्दी बाइबलीय प्रयोग में स्पष्ट और गरिमापूर्ण है।
- source_word: מִבַּלְעֲדֵי
  choice: के सिवा
  rationale: 'बहिष्करण का भाव सहज हिन्दी में व्यक्त करता है: यहोवा से अलग कोई परमेश्वर नहीं।'
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: וּמִי
  choice: और ... कौन
  rationale: दूसरे समानांतर अलंकारिक प्रश्न को पहले से जोड़ता है और काव्यात्मक समानांतरता बनाए रखता है।
- source_word: צוּר
  choice: चट्टान
  rationale: स्थिरता, सामर्थ्य और सुरक्षा का मूल इब्रानी रूपक सीधे सुरक्षित रहता है; इसे व्याख्यात्मक शब्द जैसे ‘शरण’ से नहीं बदला गया।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: प्रथम पुरुष बहुवचन प्रत्यय का सामुदायिक और वाचागत भाव स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है; हिन्दी में प्रचलित नामरूप ‘यहोवा’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: צוּר को सामान्य रूपक मानें या औपचारिक उपाधि
  choice: चट्टान
  alternative: चट्टान (उपाधि के रूप में विशेष शैलीगत बल के साथ)
  rationale: वाक्य-विन्यास अलंकारिक तुलना प्रस्तुत करता है, इसलिए मुख्य पाठ में सामान्य संज्ञा स्वाभाविक है; फिर भी यह शब्द परमेश्वर के लिए लगभग उपाधि की तरह भी प्रयुक्त हो सकता है, जिसे पादटिप्पणी में बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों अलंकारिक प्रश्नों तथा इब्रानी काव्यात्मक समानांतरता को बनाए रखा गया है। ईश्वरीय नाम के लिए हिन्दी में परिचित ‘यहोवा’ और צוּר के लिए सीधा रूपक ‘चट्टान’ चुना गया है।
