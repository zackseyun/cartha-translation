lexical_decisions:
- source_word: וַיֹּצֵא
  choice: उसने मुझे निकालकर...पहुँचाया
  rationale: हिफ़ील रूप का कारक अर्थ ‘बाहर निकालना/ले आना’ है। संयुक्त अभिव्यक्ति हिन्दी में स्वाभाविक है और उद्धार के चित्र को बनाए रखती है।
- source_word: לַמֶּרְחָב
  choice: खुले स्थान में
  rationale: מֶרְחָב चौड़े, खुले या विस्तृत स्थान को सूचित करता है और यहाँ संकट अथवा घिरे होने के विपरीत स्वतंत्रता व राहत का चित्र प्रस्तुत करता है।
- source_word: יְחַלְּצֵנִי
  choice: उसने मुझे बचाया
  rationale: पिएल रूप में חלץ का अर्थ निकालना, छुड़ाना या बचाना हो सकता है। ‘बचाया’ आधुनिक हिन्दी में स्वाभाविक है और पहली पंक्ति के समानांतर है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह बचाव का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: חָפֵץ בִּי
  choice: वह मुझसे प्रसन्न था
  rationale: חפץ ב किसी व्यक्ति में प्रसन्नता या आनंद होने का भाव रखता है। ‘मुझसे प्रसन्न था’ सहज हिन्दी है; अधिक भावपूर्ण विकल्प ‘उसने मुझमें आनंद लिया’ पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: परमेश्वर द्वारा बचाए जाने का कारण
  choice: क्योंकि वह मुझसे प्रसन्न था
  alternative: क्योंकि उसने मुझमें आनंद लिया
  rationale: पद दाऊद के बचाव को परमेश्वर की अनुकूल प्रसन्नता से जोड़ता है। अनुवाद इस संबंधपरक कथन को बनाए रखता है, पर योग्यता या प्रतिफल के विषय में ऐसा व्यापक सिद्धान्त नहीं जोड़ता जिसे यह पद स्वयं व्यक्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘खुले स्थान’ मूल रूपक को सामान्य पाठक के लिए स्पष्ट रखता है; दोनों पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
