  register: आधुनिक मानक हिन्दी में काव्यात्मक गरिमा और सीधे संबोधन को बनाए रखा गया है। ‘तूने’ भजन-सदृश ईश्वरीय संबोधन में निकटता और मूल इब्रानी के एकवचन संबोधन को व्यक्त करता है; भाषा को न तो अत्यधिक संस्कृतनिष्ठ बनाया गया है, न बोलचाल की अनौपचारिकता दी गई है।
