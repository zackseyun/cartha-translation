  text: וַ/תַּזְרֵ֥/נִי חַ֖יִל לַ/מִּלְחָמָ֑ה תַּכְרִ֥יעַ קָמַ֖/י תַּחְתֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/040.yaml
  text: You armed me with strength for battle[b][a]; you caused those who rose against me to bow beneath me.
translation:
  language: hi
  text: तूने युद्ध के लिए मुझे सामर्थ्य से सुसज्जित किया[a]; तूने मेरे विरुद्ध उठने वालों को मेरे नीचे झुका दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तूने युद्ध के लिए सामर्थ्य से मेरी कमर बाँधी।’ इब्रानी क्रिया में कमर बाँधकर किसी को तैयार या समर्थ करने का बिंब है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तूने मेरे विरोधियों को मेरे अधीन कर दिया।’ मूल क्रिया उन्हें झुकाने या घुटने टेकने पर विवश करने का भाव रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּזְרֵנִי
  choice: तूने मुझे सुसज्जित किया
  rationale: क्रिया में कमर बाँधने और इस प्रकार किसी कार्य के लिए तैयार या समर्थ करने का बिंब है। ‘सुसज्जित किया’ आधुनिक हिन्दी में युद्ध के लिए तैयार करने का भाव स्वाभाविक रूप से व्यक्त करता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: חַיִל
  choice: सामर्थ्य
  rationale: यहाँ शब्द बल, शक्ति या युद्ध-सामर्थ्य को सूचित करता है। ‘सामर्थ्य’ उस शक्ति को व्यक्त करता है जिससे वक्ता युद्ध के लिए सक्षम किया गया।
- source_word: לַמִּלְחָמָה
  choice: युद्ध के लिए
  rationale: संज्ञा युद्ध या लड़ाई को दर्शाती है; इस काव्यात्मक और राजकीय प्रसंग में ‘युद्ध के लिए’ सहज और गरिमापूर्ण है।
- source_word: תַּכְרִיעַ
  choice: तूने ... झुका दिया
  rationale: हिफ़ील रूप का अर्थ किसी को झुकाना, घुटने टेकने पर विवश करना या नीचे कर देना है। ‘झुका दिया’ मूल शारीरिक बिंब को बनाए रखता है।
- source_word: קָמַי
  choice: मेरे विरुद्ध उठने वालों
  rationale: यह קוּם से बना रूप है और शाब्दिक रूप से उन लोगों को दर्शाता है जो वक्ता के विरुद्ध उठ खड़े होते हैं। अनुवाद ने इस क्रियात्मक बिंब को सुरक्षित रखा है।
- source_word: תַּחְתֵּנִי
  choice: मेरे नीचे
  rationale: इसका सीधा स्थान-संबंधी अर्थ ‘मेरे नीचे’ है। यह शत्रुओं को वक्ता के अधीन किए जाने के साथ-साथ मूल पद के ठोस काव्य-बिंब को भी बनाए रखता है।
