  text: I call on Yahweh[a], who is worthy of praise, and I am saved from my enemies.
translation:
  language: hi
  text: 'मैं स्तुति के योग्य याहवे[a] को पुकारता हूँ,

    और अपने शत्रुओं से बचाया जाता हूँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रशंसित” अथवा “जिसकी स्तुति की जानी चाहिए।” इब्रानी कर्मवाच्य कृदंत याहवे के लिए उस व्यक्ति का भाव व्यक्त करता है जिसकी स्तुति की जानी चाहिए।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהֻלָּל
  choice: स्तुति के योग्य
  rationale: पुअल कर्मवाच्य कृदंत यहाँ याहवे का गुण बताता है—वह जिसकी स्तुति की जानी चाहिए। ‘स्तुति के योग्य’ इस भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֶקְרָא
  choice: मैं ... को पुकारता हूँ
  rationale: परमेश्वर के नाम के साथ קרא का अर्थ सहायता और प्रार्थना में उसे पुकारना है; ‘पुकारता हूँ’ हिन्दी में इस भाव को सहज रूप से रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: וּמֵאֹיְבַי
  choice: और अपने शत्रुओं से
  rationale: וּ समन्वय और מִן छुटकारे के स्रोत को व्यक्त करते हैं; मूल में ‘हाथ से’ जैसा कोई विस्तार नहीं है।
- source_word: אִוָּשֵׁעַ
  choice: बचाया जाता हूँ
  rationale: ישׁע का निफ़अल अपूर्ण प्रथम पुरुष एकवचन कर्मवाच्य उद्धार का भाव देता है। काव्यात्मक, सामान्य सत्य के संदर्भ में वर्तमानकालीन ‘बचाया जाता हूँ’ उपयुक्त है और एजेंसी को मूल की तरह अव्यक्त रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: पद में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: אִוָּשֵׁעַ का कालगत भाव
  choice: बचाया जाता हूँ
  alternative: बचाया जाऊँगा
  rationale: इब्रानी अपूर्ण रूप भविष्य अथवा सामान्य/बार-बार होने वाली क्रिया दोनों व्यक्त कर सकता है। इस स्तुतिगीत में पूर्ववर्ती ‘पुकारता हूँ’ के साथ सामान्य अनुभव का वर्तमान भाव स्वाभाविक है, जबकि भविष्यकाल भी व्याकरणतः संभव है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक दो-पंक्तीय रूप। ‘बचाया जाता हूँ’ ने इब्रानी कर्मवाच्य और सामान्य सत्य के भाव को बनाए रखा है।
