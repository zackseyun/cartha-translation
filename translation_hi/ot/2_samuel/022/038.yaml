- source_word: אֹיְבַי
  choice: अपने शत्रुओं
  rationale: אויב पर प्रथम पुरुष एकवचन प्रत्यय का सीधा अर्थ ‘मेरे शत्रु’ है; हिंदी वाक्य में ‘अपने शत्रुओं’ अधिक स्वाभाविक है और वही संबंध व्यक्त करता है।
- source_word: וָאַשְׁמִידֵם
  choice: और उनका नाश कर दिया
  rationale: हिफ़िल में שׁמד नष्ट या विनष्ट करने का प्रबल अर्थ देता है। ‘नाश कर दिया’ गरिमापूर्ण और आधुनिक हिंदी में स्पष्ट है।
- source_word: וְלֹא אָשׁוּב
  choice: मैं...पीछे नहीं लौटा
  rationale: इस युद्ध-संदर्भ में שׁוב का आशय पीछा छोड़कर पीछे लौटना है।
- source_word: עַד כַּלּוֹתָם
  choice: जब तक उनका अंत न हो गया
  rationale: כלה के पूर्ण करने, समाप्त होने या भस्म कर देने जैसे अर्थ हो सकते हैं। प्रत्यय के कर्ता अथवा कर्म-संबंध की संभावित अस्पष्टता को देखते हुए यह अभिव्यक्ति शत्रुओं के पूर्ण अंत को बताती है, बिना अनावश्यक रूप से यह तय किए कि क्रिया सक्रिय है या निष्क्रिय।
