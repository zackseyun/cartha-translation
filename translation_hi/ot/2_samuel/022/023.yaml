id: 2SA.22.23
reference: 2 Samuel 22:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֥י כָל משפט/ו לְ/נֶגְדִּ֑/י וְ/חֻקֹּתָ֖י/ו לֹא אָס֥וּר מִמֶּֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/023.yaml
  text: For all his judgments were before me[a], and I did not turn away from his statutes.
translation:
  language: hi
  text: 'क्योंकि उसके सभी न्याय-विधान मेरे सामने थे,

    और मैं उसकी विधियों से नहीं हटा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार बताता है और हिब्रू के कारणसूचक अर्थ को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: כָל מִשְׁפָּטָיו
  choice: उसके सभी न्याय-विधान
  rationale: כָל की समग्रता और מִשְׁפָּטָיו के न्यायिक तथा विधिक भाव—दोनों को संक्षिप्त, गरिमापूर्ण हिंदी में व्यक्त करता है।
- source_word: לְנֶגְדִּי
  choice: मेरे सामने थे
  rationale: मूल रूपक को सुरक्षित रखते हुए निरंतर दृष्टि या चेतना में होने का अर्थ देता है।
- source_word: וְחֻקֹּתָיו
  choice: और उसकी विधियों
  rationale: חֻקּוֹת के निर्धारित नियमों या अधिनियमों के भाव को व्यक्त करता है और न्याय-विधान से शब्दगत भेद बनाए रखता है।
- source_word: לֹא אָסוּר
  choice: मैं ... नहीं हटा
  rationale: סוּר के मुड़ने या हट जाने के मूल भाव को निकटता से व्यक्त करता है; संदर्भ में इसका नैतिक आशय भी स्पष्ट है।
- source_word: מִמֶּנָּה
  choice: उसकी विधियों से
  rationale: स्त्रीलिंग एकवचन सर्वनाम का संदर्भ काव्यात्मक रूप से कुछ अस्पष्ट है; हिंदी में निकटवर्ती חֻקֹּתָיו को दोहराने से वाक्य स्वाभाविक और स्पष्ट रहता है।
theological_decisions:
- issue: वाचा-व्यवस्था से जुड़े दो अलग हिब्रू पदों का अनुवाद
  choice: מִשְׁפָּטָיו को “न्याय-विधान” और חֻקֹּתָיו को “विधियाँ” कहा गया है।
  alternative: दोनों को सामान्य रूप से “नियम”, “आज्ञाएँ” या “व्यवस्था” कहना।
  rationale: मूल पद्य में दो भिन्न विधिक शब्द समानांतर रूप में आए हैं। उनका भेद बनाए रखना स्रोत-पाठ का सम्मान करता है और किसी एक व्यापक धर्मवैज्ञानिक श्रेणी में उन्हें समतल नहीं करता।
- issue: מִמֶּנָּה के संदर्भ की व्याख्या
  choice: इसे निकटवर्ती “उसकी विधियों” के संदर्भ में स्पष्ट किया गया है।
  alternative: “उनसे” कहकर न्याय-विधानों और विधियों—दोनों को सामूहिक संदर्भ मानना।
  rationale: हिब्रू सर्वनाम स्त्रीलिंग एकवचन है और उसका प्रयोग काव्यात्मक या सामूहिक हो सकता है। चुना हुआ पाठ निकटतम पूर्वपद से संबंध रखता है, पर किसी व्यापक धर्मवैज्ञानिक निष्कर्ष को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी, काव्यात्मक परंतु सहज और गरिमापूर्ण। “न्याय-विधान” तथा “विधियाँ” कानूनी शब्दावली का भेद बनाए रखते हैं; पंक्ति-विभाजन हिब्रू समानांतरता को उभारता है।
