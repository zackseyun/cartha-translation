source:
  edition: WLC
  text: עָלָ֤ה עָשָׁן֙ בְּ/אַפּ֔/וֹ וְ/אֵ֥שׁ מִ/פִּ֖י/ו תֹּאכֵ֑ל גֶּחָלִ֖ים בָּעֲר֥וּ מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/009.yaml
  text: Smoke went up from his nostrils[a], and consuming fire from his mouth; coals blazed from him.
translation:
  language: hi
  text: उसके नथनों से धुआँ उठा[a], और उसके मुँह से भस्म करनेवाली आग निकली; उससे अंगारे धधक उठे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी नाक से।” जिस इब्रानी शब्द का अर्थ “नाक/नथना” है, वह मुहावरे में “क्रोध” भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָשָׁן
  choice: धुआँ उठा
  rationale: ऊपर उठने की ठोस गति और काव्यात्मक दृश्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּאַפּוֹ
  choice: उसके नथनों से
  rationale: אַף के ठोस अर्थ ‘नाक/नथना’ को रखा गया है; मुँह से आग निकलने वाले समानांतर चित्र के कारण यहाँ शारीरिक बिंब प्रमुख है। गति के संदर्भ में בְּ को हिन्दी में स्वाभाविक रूप से ‘से’ कहा गया है।
- source_word: וְאֵשׁ מִפִּיו תֹּאכֵל
  choice: और उसके मुँह से भस्म करनेवाली आग निकली
  rationale: ‘मुँह से’ मूल समानांतरता को बनाए रखता है। תֹּאכֵל का सक्रिय, निगलने/नष्ट करने वाला भाव ‘भस्म करनेवाली’ से व्यक्त होता है; ‘निकली’ हिन्दी वाक्य को पूर्ण और दृश्य को स्पष्ट करता है, यद्यपि यह गति मूल में प्रसंग से निहित है।
- source_word: גֶּחָלִים בָּעֲרוּ
  choice: अंगारे धधक उठे
  rationale: בָּעֲרוּ के जलने या प्रज्वलित होने के सजीव काव्यात्मक भाव को ‘धधक उठे’ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִמֶּנּוּ
  choice: उससे
  rationale: 'מן के स्रोत-संबंधी अर्थ को संक्षेप और सीधे रूप में रखता है: अंगारों की ज्वाला उसी से निकलती या भड़कती है।'
theological_decisions:
- issue: ईश्वर के लिए मानवरूपी काव्यात्मक भाषा
  choice: ‘नथनों’ और ‘मुँह’ के ठोस शारीरिक बिंब को बनाए रखा गया है।
  alternative: אַף को मुहावरे के अनुसार ‘क्रोध’ मानकर ‘उसके क्रोध से धुआँ उठा’ कहना।
  rationale: यह ईशप्रकाशन का काव्यात्मक वर्णन है। ‘मुँह’ के समानांतर ‘नथनों’ को बनाए रखने से मूल चित्र, परमेश्वर के क्रोध और सामर्थ्य की तीव्रता, तथा पाठ की धर्मवैचारिक तान सुरक्षित रहती है; इसे केवल अमूर्त ‘क्रोध’ में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘नथनों,’ ‘भस्म करनेवाली,’ और ‘धधक उठे’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल के प्रबल ईशप्रकाशनीय बिंब को सुरक्षित रखते हैं।
