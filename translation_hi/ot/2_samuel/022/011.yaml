base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/011.yaml
  text: He rode on a cherub and flew[a]; he appeared on the wings of the wind.
translation:
  language: hi
  text: वह करूब पर सवार होकर उड़ा; वह पवन के पंखों पर दिखाई दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: सवार होकर
  rationale: רכב का सामान्य अर्थ सवारी करना है; संयुक्त क्रिया अगले क्रियापद के साथ हिंदी में स्वाभाविक प्रवाह देती है।
- source_word: עַל כְּרוּב
  choice: करूब पर
  rationale: एकवचन כְּרוּב के लिए प्रचलित बाइबलीय शब्द ‘करूब’ रखा गया है और עַל को ‘पर’ से व्यक्त किया गया है।
- source_word: וַיָּעֹף
  choice: उड़ा
  rationale: עוף का सीधा अर्थ ‘उड़ना’ है; इससे काव्यात्मक चित्र बिना अतिरिक्त अर्थ जोड़े बना रहता है।
- source_word: וַיֵּרָא
  choice: दिखाई दिया
  rationale: ראה के निफ़अल रूप का स्वाभाविक हिंदी प्रतिरूप है; इसमें ‘देखा गया’ और ‘प्रकट हुआ’ के बीच की वास्तविक अर्थगत गुंजाइश बनी रहती है।
- source_word: כַּנְפֵי רוּחַ
  choice: पवन के पंखों पर
  rationale: כָּנָף की ठोस छवि ‘पंख’ से और इस प्रसंग में רוּחַ का अर्थ ‘पवन’ से सुरक्षित रहता है।
theological_decisions:
- issue: ईश्वरीय योद्धा के दर्शन-संबंधी काव्यात्मक चित्र का अनुवाद
  choice: करूब पर सवारी, उड़ान और पवन के पंखों पर दिखाई देने की ठोस छवियाँ बनाए रखना
  alternative: चित्र को अमूर्त करके केवल परमेश्वर के आगमन या सामर्थ्य का वर्णन करना
  rationale: मूल पद ईश्वर-दर्शन का सजीव काव्यात्मक चित्र देता है; अनुवाद इसे व्यवस्थित धार्मिक व्याख्या में बदलने के बजाय उसकी तनावपूर्ण और रहस्यमय भाषा सुरक्षित रखता है।
- issue: וַיֵּרָא में दृश्यता अथवा प्रकट होने का भाव
  choice: दिखाई दिया
  alternative: प्रकट हुआ / देखा गया
  rationale: ‘दिखाई दिया’ आधुनिक हिंदी में स्वाभाविक है और निफ़अल रूप के ‘देखा गया’ तथा ‘प्रकट हुआ’ दोनों संभावित भावों को अत्यधिक निश्चित किए बिना व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सुबोध और काव्यात्मक रूप; ‘वायु’ की अपेक्षा ‘पवन’ पद की काव्यात्मक गति के अनुकूल है, जबकि ‘करूब’ स्थापित बाइबलीय पारिभाषिक शब्द है।
