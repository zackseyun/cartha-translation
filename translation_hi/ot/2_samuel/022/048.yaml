translation:
  language: hi
  text: वही परमेश्वर है, जो मुझे प्रतिशोध दिलाता है और जातियों को मेरे अधीन करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֵל
  choice: वही परमेश्वर है
  rationale: निश्चित पद सहित इस पदबंध को स्तुतिपरक पहचान-वाक्य के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: הַנֹּתֵן נְקָמוֹת לִי
  choice: जो मुझे बदला लेने देता है
  rationale: बहुवचन נְקָמוֹת यहाँ प्रतिशोध/न्यायोचित बदले के कार्यों को सूचित करता है; לִי को संशोधन के अनुरूप ‘मुझे’ रखा गया है, न कि ‘मेरे लिए’। ‘देता है’ को हिन्दी में क्रियात्मक अर्थ स्पष्ट करने हेतु ‘लेने देता है’ कहा गया है।
- source_word: וּמוֹרִיד
  choice: और ... कर देता है
  rationale: हिफ़ील रूप का कारक अर्थ सुरक्षित रखते हुए लोगों को नीचे लाने/अधीन करने की क्रिया व्यक्त की गई है।
- source_word: עַמִּים
  choice: जाति-जाति के लोगों को
  rationale: बहुवचन का आशय अनेक जनसमूहों या राष्ट्रों से है; यह हिन्दी प्रयोग सामान्य पाठक के लिए स्वाभाविक है।
- source_word: תַּחְתֵּנִי
  choice: मेरे अधीन
  rationale: शाब्दिक ‘मेरे नीचे’ का राजनीतिक-विजयी आशय आधुनिक हिन्दी में ‘मेरे अधीन’ से स्पष्ट और स्वाभाविक बनता है।
theological_decisions:
- issue: प्रतिशोध का कर्ता और लाभार्थी
  choice: मुझे बदला लेने देता है
  alternative: मेरे लिए बदला लेता है
  rationale: हिब्रू לִי का सीधा रूप ‘मुझे/मेरे लिए’ दोनों की गुंजाइश रख सकता है, पर नवीनतम निर्णीत पाठ ‘to me’ को सुरक्षित रखने के लिए परमेश्वर द्वारा दाऊद को प्रतिशोध प्रदान/सामर्थ्य देने का भाव चुना गया है।
- issue: अन्य जनसमूहों का नीचे किया जाना
  choice: मेरे अधीन कर देता है
  alternative: मेरे नीचे गिरा देता है
  rationale: संदर्भ सैन्य और राजकीय अधीनता का है; अनावश्यक भौतिक या संहारात्मक अर्थ जोड़े बिना वही संबंध व्यक्त किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और स्तुतिपरक शैली। भाषा सामान्य पाठक के लिए सहज रखी गई है; ‘बदला’ कठोर भाव को कम किए बिना ‘प्रतिशोध’ की अपेक्षा अधिक सामान्य है।
