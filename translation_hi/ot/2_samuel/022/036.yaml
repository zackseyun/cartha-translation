    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: तूने दी
  rationale: נתן का क़ाल वय्यिक्तोल रूप बीते हुए कथात्मक कार्य को व्यक्त करता है; परमेश्वर से सीधे संबोधन के लिए ‘तूने ... दी’ स्वाभाविक है।
- source_word: לִי
  choice: मुझे
  rationale: हिन्दी में परोक्ष कर्म ‘मुझे’ के द्वारा सहज रूप से व्यक्त होता है।
- source_word: מָגֵן
  choice: ढाल
  rationale: मूल के ठोस युद्ध-संबंधी बिंब को अमूर्त ‘रक्षा’ में बदले बिना सुरक्षित रखता है।
- source_word: יִשְׁעֶךָ
  choice: अपने उद्धार की
  rationale: ישׁע से निकला यह रूप परमेश्वर द्वारा दिए गए छुटकारे/उद्धार को दर्शाता है; ‘उद्धार’ संबंधवाचक रचना और धार्मिक अनुगूँज दोनों बनाए रखता है।
- source_word: וַעֲנֹתְךָ
  choice: तेरी दीनता
  rationale: यह कठिन हिब्रू रूप ענה से संबंधित है और इसके अर्थ पर मतभेद है। ‘दीनता’ परमेश्वर के अनुग्रहपूर्वक झुककर वक्ता को ऊँचा उठाने के चौंकाने वाले भाव तथा मूल की धर्मवैचारिक खिंचाव को बनाए रखती है।
- source_word: תַּרְבֵּנִי
  choice: मुझे महान बनाया
  rationale: רבה का हिफ़ील रूप ‘बड़ा/महान करना’ दर्शाता है; छुटकारे के बाद वक्ता की उन्नति के संदर्भ में यह स्वाभाविक और परिणामसूचक है।
theological_decisions:
- issue: परमेश्वर के लिए וַעֲנֹתְךָ का अर्थ
  choice: तेरी दीनता
  alternative: तेरी कोमलता; तेरा कृपापूर्वक झुकना; तेरी सहायता
  rationale: मूल शब्द कई अर्थों की संभावना रखता है। ‘दीनता’ उस धर्मवैचारिक तनाव को सुरक्षित रखती है जिसमें परमेश्वर स्वयं झुककर अपने सेवक को महान बनाता है; पादटिप्पणी वैकल्पिक अर्थों को खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक संबोधन रखा गया है। ‘तू/तेरी’ निकट और प्रत्यक्ष दैवी संबोधन के रूप में प्रयुक्त है; सैन्य बिंब ‘ढाल’ तथा कठिन धर्मवैचारिक अभिव्यक्ति ‘दीनता’ को जानबूझकर सुरक्षित रखा गया है।
