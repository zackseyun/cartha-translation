base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/051.yaml
  text: He gives great salvation to his king and shows covenant faithfulness to his anointed[c][b][a], to David and to his offspring forever.
translation:
  language: hi
  text: वह अपने राजा को महान उद्धार देता है[a] और अपने अभिषिक्त के प्रति—दाऊद और उसके वंश के प्रति—सदा तक वाचा की निष्ठा दिखाता है[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने राजा को बड़े-बड़े छुटकारे देता है” अथवा “बड़ी-बड़ी विजयें देता है।”
    reason: lexical_alternative
  - marker: b
    text: या, “अपने अभिषिक्त के प्रति अटल प्रेम दिखाता है।” इब्रानी शब्द में निष्ठावान प्रेम और वाचागत प्रतिबद्धता, दोनों के भाव हैं।
    reason: lexical_alternative
  - marker: c
    text: “अपने अभिषिक्त” का अनुवाद “अपने मसीह” भी हो सकता है। यहाँ इसका पहला संदर्भ दाऊद से है, और यह दाऊदी राजवंश तथा व्यापक मसीही प्रतिज्ञा की अनुगूँज भी रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מגדיל יְשׁוּעוֹת
  choice: महान उद्धार देता है
  rationale: हिफ़ील कृदन्त מגדיל का मूल भाव ‘महान करता है’ है और बहुवचन יְשׁוּעוֹת छुटकारे अथवा विजय के कार्यों को दर्शा सकता है। सहज हिन्दी में ‘महान उद्धार देता है’ कारक भाव और सामूहिक अर्थ दोनों को व्यक्त करता है।
- source_word: מַלְכּוֹ
  choice: अपने राजा को
  rationale: तीसरे पुरुष एकवचन प्रत्यय सहित संज्ञा का सीधा अर्थ ‘उसके/अपने राजा’ है; वाक्य के कर्ता के संदर्भ में ‘अपने राजा’ स्वाभाविक हिन्दी है।
- source_word: וְעֹשֶׂה חֶסֶד
  choice: और ... पर वाचा की निष्ठा दिखाता है
  rationale: חֶסֶד में अटल प्रेम, निष्ठा और वाचागत प्रतिबद्धता के संयुक्त भाव हैं। दाऊदी वाचा के प्रसंग में ‘वाचा की निष्ठा’ इसका संबंधपरक और प्रतिज्ञामूलक बल स्पष्ट करती है।
- source_word: לִמְשִׁיחוֹ
  choice: अपने अभिषिक्त जन पर
  rationale: מָשִׁיחַ का शाब्दिक अर्थ ‘अभिषिक्त’ है। यहाँ पहला ऐतिहासिक संदर्भ दाऊद और दाऊदी राजा है; ‘अभिषिक्त जन’ इस अर्थ को रखते हुए व्यापक मसीही अनुगूँज को खुला रखता है।
- source_word: לְדָוִד וּלְזַרְעוֹ
  choice: दाऊद और उसके वंश पर
  rationale: זֶרַע व्याकरणतः एकवचन सामूहिक संज्ञा है। ‘वंश’ आधुनिक हिन्दी में स्वाभाविक है और दाऊदी वंश-प्रतिज्ञा का सामूहिक तथा वाचागत भाव बनाए रखता है।
- source_word: עַד עוֹלָם
  choice: सदा तक
  rationale: यह दीर्घस्थायी निरंतरता का प्रचलित, गरिमापूर्ण हिन्दी रूप है और वाचा की स्थायी प्रतिज्ञा के प्रसंग में उपयुक्त है।
theological_decisions:
- issue: दाऊदी वाचा के प्रसंग में חֶסֶד का अनुवाद
  choice: वाचा की निष्ठा
  alternative: अटल प्रेम; निष्ठावान प्रेम; कृपा
  rationale: पद यहोवा की अपने राजा और उसके वंश के प्रति प्रतिज्ञाबद्ध निष्ठा पर बल देता है। यह रूप केवल भावनात्मक प्रेम तक अर्थ को सीमित नहीं करता, फिर भी वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखता है।
- issue: מְשִׁיחוֹ का अनुवाद
  choice: अपने अभिषिक्त जन
  alternative: अपने मसीह
  rationale: तात्कालिक ऐतिहासिक संदर्भ दाऊद और दाऊदी राजा है। ‘अभिषिक्त जन’ मूल शब्दार्थ को सुरक्षित रखता है और बाद की मसीही पूर्ति को मुख्य पाठ में आरोपित किए बिना उसकी अनुगूँज बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप। ‘अभिषिक्त जन’ ऐतिहासिक और मसीही दोनों आयामों के बीच मूल पाठ की तनावपूर्ण व्यापकता बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
