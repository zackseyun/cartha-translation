lexical_decisions:
- source_word: חֶבְלֵי
  choice: रस्सियों
  rationale: यह शब्द बाँधने या जकड़ने वाली रस्सियों का बिंब देता है। समानांतर पद में आए ‘फंदे’ के साथ यह अर्थ स्वाभाविक है और ‘पीड़ाओं’ जैसा अनावश्यक अर्थ-निर्णय नहीं करता।
- source_word: שְׁאוֹל
  choice: अधोलोक
  rationale: यह मृतकों के लोक के लिए प्रयुक्त इब्रानी शब्द है। ‘अधोलोक’ हिंदी पाठक के लिए बोधगम्य रहते हुए इसे केवल ‘कब्र’ या अमूर्त ‘मृत्यु’ तक सीमित नहीं करता।
- source_word: סַבֻּנִי
  choice: मुझे चारों ओर से घेर लिया
  rationale: क्रिया का मूल अर्थ घेरना या चारों ओर से घेरा डालना है; यह हिंदी में स्पष्ट और स्वाभाविक अभिव्यक्ति है।
- source_word: קִדְּמֻנִי
  choice: मेरे सामने आ खड़े हुए
  rationale: क्रिया सामने आने, मिलने या सामना करने का भाव रखती है। यह चयन शत्रुतापूर्ण मुठभेड़ का काव्यात्मक बिंब बनाए रखता है।
- source_word: מֹקְשֵׁי
  choice: फंदे
  rationale: शब्द ऐसे फंदे या जाल को दर्शाता है जो किसी को पकड़ ले; ‘रस्सियों’ के समानांतर यह सजीव और स्वाभाविक है।
- source_word: מָוֶת
  choice: मृत्यु
  rationale: मूल संज्ञा का सीधा और प्रसंगानुकूल अनुवाद।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: अधोलोक
  alternative: शीओल; कब्र; मृतकों का लोक
  rationale: ‘अधोलोक’ मृत्यु के क्षेत्र या मृतकों के लोक का व्यापक भाव बचाता है और शब्द को केवल दफनाने की जगह के अर्थ में सीमित नहीं करता। ‘शीओल’ अधिक रूप-संरक्षक विकल्प है, इसलिए पादटिप्पणी में दिया गया है।
- issue: קִדְּמֻנִי में मुठभेड़ का भाव
  choice: मेरे सामने आ खड़े हुए
  alternative: मुझसे आ मिले; मेरा सामना किया
  rationale: मूल क्रिया सामने आने या मिलने के बीच अर्थ-व्याप्ति रखती है। मुख्य पाठ प्रसंग के संकटपूर्ण भाव को व्यक्त करता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण काव्यात्मक गद्य। ‘रस्सियों’ और ‘फंदे’ से मूल समानांतर बिंब सुरक्षित रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
