base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/033.yaml
  text: God is my strong refuge[a], and he makes my way blameless.
translation:
  language: hi
  text: परमेश्वर मेरा दृढ़ शरणस्थान है, और वह मेरे मार्ग को निष्कलंक बनाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, व्यंजन-पाठ का अधिक शाब्दिक अनुसरण करते हुए, “और वह अपने ही मार्ग को निष्कलंक बनाता है।” भजन 18:32 का समानांतर “मेरे मार्ग” का समर्थन करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הָאֵל
  choice: परमेश्वर
  rationale: सप्रत्यय אֵל यहाँ इस्राएल के परमेश्वर के लिए उपाधि/नाम की तरह प्रयुक्त है; आधुनिक मानक हिन्दी में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: מָעוּזִּי חָיִל
  choice: मेरा सामर्थी शरणस्थान
  rationale: מָעוֹז सुरक्षा देने वाले आश्रय या दृढ़ स्थान को और חָיִל सामर्थ्य को व्यक्त करता है। यह अनुवाद सुरक्षा और शक्ति दोनों अर्थों को रखता है, पर अनावश्यक रूप से सैन्य ‘गढ़’ तक सीमित नहीं करता।
- source_word: וַיַּתֵּר
  choice: वह ... बनाता है
  rationale: यह कठिन क्रिया इस रचना और भजन 18:32 के समानांतर में मार्ग को सुस्थापित या पूर्ण बनाने का भाव देती है; ‘बनाता है’ संक्षिप्त और अगले विधेय के साथ स्वाभाविक है।
- source_word: תָּמִים
  choice: निर्दोष
  rationale: शब्द अखंडता, खराई और दोषरहित होने का भाव रखता है। ‘निर्दोष’ आधुनिक हिन्दी में स्वाभाविक है और ‘सिद्ध’ से उत्पन्न पूर्ण पापहीनता का अनावश्यक अर्थ आरोपित नहीं करता।
- source_word: דרכו
  choice: मेरे मार्ग को
  rationale: व्यंजनात्मक/मसोरेटिक रूप ‘उसके मार्ग’ की ओर संकेत कर सकता है, पर भजन 18:32 का समानांतर ‘मेरे मार्ग’ का समर्थन करता है। मुख्य पाठ में यही संगत पाठ रखा गया है और वास्तविक विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: अंतिम शब्द में सर्वनाम का पाठ
  choice: परमेश्वर वक्ता के मार्ग को निर्दोष बनाता है
  alternative: परमेश्वर अपने मार्ग को निर्दोष बनाता है
  rationale: 2 शमूएल का उपलब्ध रूप ‘उसके मार्ग’ समझा जा सकता है, जबकि भजन 18:32 का समानांतर ‘मेरे मार्ग’ का समर्थन करता है। प्रसंग में वक्ता के मार्ग का उल्लेख अधिक संगत है, किंतु पाठगत अस्पष्टता को पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण काव्यात्मक गद्य। ‘सामर्थी शरणस्थान’ मूल के सुरक्षा और शक्ति—दोनों पहलुओं को संजोता है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में सम्मिलित है।
