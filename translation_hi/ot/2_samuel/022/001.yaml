reference: 2 Samuel 22:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר דָּוִד֙ לַֽ/יהוָ֔ה אֶת דִּבְרֵ֖י הַ/שִּׁירָ֣ה הַ/זֹּ֑את בְּ/יוֹם֩ הִצִּ֨יל יְהוָ֥ה אֹת֛/וֹ מִ/כַּ֥ף כָּל אֹיְבָ֖י/ו וּ/מִ/כַּ֥ף שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/001.yaml
  text: And David spoke to Yahweh the words of this song on the day when Yahweh delivered him from the hand of all his enemies and from the hand of Saul[a].
translation:
  language: hi
  text: जिस दिन याहवे ने दाऊद को उसके सब शत्रुओं के हाथ से और शाऊल के हाथ से छुड़ाया, उस दिन दाऊद ने याहवे से इस गीत के शब्द[a] कहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में स्पष्ट रूप से “इस गीत के शब्द” है; केवल “यह गीत” नहीं।
    reason: मूल पाठ की विशिष्ट अभिव्यक्ति और ‘शब्द’ के स्पष्ट उल्लेख को रेखांकित करना।
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: कहे
  rationale: דבר का सामान्य अर्थ ‘बोलना/कहना’ है। प्रसंग गीत का है, फिर भी इब्रानी पाठ ‘गाया’ नहीं बल्कि ‘इस गीत के शब्द कहे’ कहता है; इसलिए मूल अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: לַיהוָה / יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को उसके प्रचलित हिन्दी रूप ‘यहोवा’ में रखा गया है, सामान्य उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: इस गीत के शब्द
  rationale: अनुवाद में דִּבְרֵי (‘शब्द’) और הַשִּׁירָה (‘गीत’) दोनों को स्पष्ट रखा गया है; केवल ‘यह गीत’ कहने से मूल का एक तत्व छूट जाता।
- source_word: בְּיוֹם
  choice: जिस दिन … उस दिन
  rationale: यह हिन्दी में स्वाभाविक कालवाचक रचना है और इब्रानी के ‘दिन’ संबंधी स्पष्ट उल्लेख को बनाए रखती है।
- source_word: הִצִּיל
  choice: छुड़ाया
  rationale: נצל यहाँ शत्रुओं के अधिकार और खतरे से बचाने या मुक्त करने को व्यक्त करता है; ‘छुड़ाया’ इस सैन्य-संकट के प्रसंग में सहज हिन्दी है।
- source_word: מִכַּף
  choice: के हाथ से
  rationale: כף का शाब्दिक हाथ/हथेली का रूपक रखा गया है; यहाँ यह शत्रु के वश या अधिकार को दर्शाता है।
- source_word: כָּל אֹיְבָיו
  choice: उसके सब शत्रुओं
  rationale: यह सामूहिक इब्रानी पदबंध का सीधा और स्वाभाविक हिन्दी अनुवाद है।
- source_word: שָׁאוּל
  choice: शाऊल
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय लिप्यंतरण।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ वाचा-संबंधी व्यक्तिगत नाम יהוה का दो बार प्रयोग करता है। उसे ‘यहोवा’ रखने से नाम और ‘प्रभु’ जैसी उपाधि के बीच का भेद बना रहता है।
- issue: לַיהוָה में दाऊद के कथन की दिशा
  choice: यहोवा से … कहे
  alternative: यहोवा के लिए … गाया
  rationale: ל उपसर्ग यहाँ संबोधित व्यक्ति की ओर कथन को निर्देशित करता है। ‘यहोवा से … कहे’ उस संबंध को रखता है और मूल में न आए क्रिया ‘गाया’ को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जिस दिन … उस दिन’ से मूल की कालवाचक रचना स्पष्ट होती है, जबकि ‘हाथ से’ मूल रूपक को सुरक्षित रखता है।
