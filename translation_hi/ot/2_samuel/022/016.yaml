id: 2SA.22.16
reference: 2 Samuel 22:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֵּֽרָאוּ֙ אֲפִ֣קֵי יָ֔ם יִגָּל֖וּ מֹסְד֣וֹת תֵּבֵ֑ל בְּ/גַעֲרַ֣ת יְהוָ֔ה מִ/נִּשְׁמַ֖ת ר֥וּחַ אַפּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/016.yaml
  text: Then the channels of the sea were seen[a]; the foundations of the world were laid bare at the rebuke of Yahweh[b], at the blast of the breath of his nostrils.
translation:
  language: hi
  text: 'तब समुद्र की नालियाँ दिखाई दीं,

    और जगत[b] की नींवें उघड़ गईं—

    याहवे[a] की फटकार से,

    उसके नथनों की साँस के झोंके से।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘याहवे’ इब्रानी में परमेश्वर का व्यक्तिगत नाम है; परंपरागत अनुवादों में इसके स्थान पर प्रायः ‘प्रभु’ लिखा जाता है।
    reason: divine_name
  - marker: b
    text: या, “बसे हुए संसार की नींवें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָאוּ
  choice: दिखाई दीं
  rationale: निफ़अल रूप की निष्क्रिय अर्थ-छाया को बनाए रखता है और काव्यात्मक दृश्य को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֲפִקֵי יָם
  choice: समुद्र की नालियाँ
  rationale: אֲפִיקִים जलधाराओं के मार्ग, नालियों या पाटों को सूचित कर सकता है। यहाँ समुद्र का छिपा तल प्रकट होने का चित्र है; ‘नालियाँ’ मूल रूपक को ‘सोते’ जैसे अधिक विशिष्ट अर्थ तक सीमित नहीं करती।
- source_word: יִגָּלוּ
  choice: उघड़ गईं
  rationale: निफ़अल रूप का अर्थ ‘खोल दी गईं/प्रकट हो गईं’ है। ‘उघड़ गईं’ समानांतर पंक्ति की प्रबल, दृश्यात्मक काव्य-भाषा को स्वाभाविक हिन्दी में रखता है।
- source_word: מֹסְדוֹת תֵּבֵל
  choice: जगत की नींवें
  rationale: מֹסְדוֹת का अर्थ ‘नींवें’ है और תֵּבֵל काव्य में संसार, विशेषकर बसा हुआ संसार, सूचित कर सकता है। ‘जगत’ संक्षिप्त और गरिमापूर्ण है; व्यापक ब्रह्मांडीय अर्थ बचा रहता है।
- source_word: בְּגַעֲרַת
  choice: की फटकार से
  rationale: גְּעָרָה दैवी डाँट या फटकार है। ‘से’ यहाँ साधन अथवा कारण दोनों का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले इब्रानी व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में प्रतिलिपित किया गया है।
- source_word: מִנִּשְׁמַת רוּחַ אַפּוֹ
  choice: उसके नथनों की साँस के झोंके से
  rationale: यह अनुवाद אַף के मूर्त अर्थ ‘नाक/नथने’ और प्रचंड श्वास के काव्यात्मक, मानवरूपी चित्र को बनाए रखता है; इसे केवल अमूर्त ‘क्रोध’ में नहीं बदलता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; अथवा ‘प्रभु’ जैसी पारंपरिक प्रतिस्थापन-उपाधि
  rationale: मूल पद में व्यक्तिगत नाम יְהוָה है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है और पाठ में नाम तथा उपाधि का भेद बनाए रखता है।
- issue: אַפּוֹ में शारीरिक बिंब अथवा क्रोध का भाव
  choice: उसके नथनों
  alternative: उसके क्रोध
  rationale: אַף का शाब्दिक अर्थ नाक/नथना और लाक्षणिक अर्थ क्रोध हो सकता है। निकटवर्ती ‘साँस/वायु’ के कारण यहाँ शारीरिक बिंब प्रमुख है; फिर भी उससे जुड़े दैवी क्रोध का भाव समाप्त नहीं होता।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण काव्य-शैली अपनाई गई है। समानांतर पंक्तियाँ और दैवी प्रकटाव का प्रबल दृश्यात्मक बिंब सुरक्षित रखा गया है। ‘नालियाँ’ सामान्य पाठक के लिए बोधगम्य रहते हुए समुद्र के उजागर जलमार्गों का मूल रूपक बनाए रखती है।
