base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/003.yaml
  text: my God[a], my rock, in whom I take refuge, my shield and the horn of my salvation, my stronghold and my refuge[c][b], my savior—you save me from violence.
translation:
  language: hi
  text: मेरा परमेश्वर[a], मेरी चट्टान—मैं उसी में शरण लेता हूँ; मेरी ढाल और मेरे उद्धार का सींग[b], मेरा ऊँचा गढ़ और मेरा शरणस्थान, मेरा उद्धारकर्ता[c]—तू मुझे हिंसा से बचाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी चट्टान का परमेश्वर”; इब्रानी रचना का अधिक शाब्दिक अनुवाद ऐसा हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी काव्य में “सींग” सामर्थ्य और विजयी शक्ति का बिंब है।
    reason: cultural_note
  - marker: c
    text: या, “मेरा छुड़ानेवाला।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי צוּרִי
  choice: मेरा परमेश्वर, मेरी चट्टान
  rationale: इब्रानी रचना का अधिक शाब्दिक अर्थ ‘मेरी चट्टान का परमेश्वर’ हो सकता है, पर काव्य में परमेश्वर के संबोधनों की समानांतर शृंखला को देखते हुए समानाधिकरण वाला यह अनुवाद स्वाभाविक है; वैकल्पिक रचना पाद-टिप्पणी में सुरक्षित है।
- source_word: אֶחֱסֶה בּוֹ
  choice: मैं उसी में शरण लेता हूँ
  rationale: חסה का अर्थ सुरक्षा के लिए शरण लेना है। ‘उसी में’ इब्रानी पूर्वसर्ग और बल को बनाए रखता है तथा हिन्दी में ‘चट्टान’ के व्याकरणिक स्त्रीलिंग से पैदा होने वाली अनावश्यक संदिग्धता से बचता है।
- source_word: מָגִנִּי
  choice: मेरी ढाल
  rationale: सुरक्षा का ठोस रूपक सीधे और स्वाभाविक ढंग से सुरक्षित रहता है।
- source_word: קֶרֶן יִשְׁעִי
  choice: मेरे उद्धार का सींग
  rationale: शाब्दिक ‘सींग’ इब्रानी में सामर्थ्य और विजयी शक्ति का बिंब है। असामान्य होने पर भी इसे सांस्कृतिक टिप्पणी सहित बनाए रखना काव्यात्मक चित्र को समतल करने से बेहतर है।
- source_word: מִשְׂגַּבִּי
  choice: मेरा ऊँचा गढ़
  rationale: यह संज्ञा ऊँचे, सुरक्षित और सुदृढ़ स्थान को व्यक्त करती है; ‘ऊँचा गढ़’ उसके स्थानगत और रक्षात्मक दोनों पक्षों को संप्रेषित करता है।
- source_word: וּמְנוּסִי
  choice: मेरा शरणस्थान
  rationale: यह भागकर सुरक्षा पाने के स्थान का बोध देता है; ‘शरणस्थान’ संक्षिप्त, स्पष्ट और पिछले ‘गढ़’ से अलग है।
- source_word: מֹשִׁעִי
  choice: मेरा उद्धारकर्ता
  rationale: ישׁע से बना यह रूप बचाने या छुड़ाने वाले को दर्शाता है। ‘उद्धारकर्ता’ काव्यात्मक पदवी के रूप में स्वाभाविक है; ‘छुड़ानेवाला’ सम्भव विकल्प है।
- source_word: מֵחָמָס תֹּשִׁיעֵנִי
  choice: तू मुझे हिंसा से बचाता है
  rationale: חָמָס को अमूर्त ‘हिंसा’ ही रखा गया है, इसलिए पाठ में हिंसक लोगों जैसे अनकहे कर्ता नहीं जोड़े गए। इब्रानी अपूर्ण क्रिया यहाँ परमेश्वर के चरित्रगत या निरंतर बचाव को वर्तमान काल में व्यक्त कर सकती है।
theological_decisions:
- issue: परमेश्वर के लिए ठोस काव्यात्मक रूपकों की शृंखला
  choice: ‘चट्टान,’ ‘ढाल,’ ‘सींग,’ ‘ऊँचा गढ़’ और ‘शरणस्थान’ जैसे मूल बिंब बनाए गए।
  alternative: इन सबको ‘रक्षक’ या ‘शक्ति का स्रोत’ जैसे अमूर्त अर्थों में खोल देना।
  rationale: ठोस बिंब पद की युद्ध-संबंधी और सुरक्षात्मक काव्य-शक्ति बनाए रखते हैं और व्याख्या को मूल पाठ की जगह नहीं लेने देते।
- issue: מֹשִׁעִי का पदवी-सदृश अनुवाद
  choice: मेरा उद्धारकर्ता
  alternative: मेरा छुड़ानेवाला
  rationale: ‘उद्धारकर्ता’ मूल क्रिया के बचाने के अर्थ को ठीक व्यक्त करता है, जबकि पाद-टिप्पणी निकट वैकल्पिक अर्थ को सुरक्षित रखती है; इससे बाद की किसी विशिष्ट धर्मसैद्धांतिक धारणा को पाठ में नहीं जोड़ा गया।
- issue: अंतिम अपूर्ण क्रिया का काल
  choice: तू मुझे हिंसा से बचाता है
  alternative: तू मुझे हिंसा से बचाएगा
  rationale: काव्यिक संदर्भ में अपूर्ण रूप को परमेश्वर की चरित्रगत अथवा निरंतर क्रिया समझना सम्भव है। भविष्यकाल भी व्याकरणतः सम्भव है, पर प्रसंग की स्तुतिपरक पदवी-शृंखला के साथ वर्तमानकाल अधिक स्वाभाविक है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, काव्यात्मक पर सामान्य पाठक के लिए सुबोध रखी गई है। ‘उसी में’ मूल के पुल्लिंग संकेत का भाव सुरक्षित रखता है और हिन्दी संज्ञा ‘चट्टान’ के स्त्रीलिंग के कारण परमेश्वर के संदर्भ को धुँधला होने से बचाता है। विराम-चिह्न संबोधनों की सघन काव्यात्मक शृंखला और अंतिम प्रत्यक्ष कथन के बीच संबंध स्पष्ट करते हैं।
