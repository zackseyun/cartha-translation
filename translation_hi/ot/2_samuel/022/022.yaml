id: 2SA.22.22
reference: 2 Samuel 22:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֥י שָׁמַ֖רְתִּי דַּרְכֵ֣י יְהוָ֑ה וְ/לֹ֥א רָשַׁ֖עְתִּי מֵ/אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/022.yaml
  text: For I have kept the ways of Yahweh[a], and have not wickedly departed from my God.
translation:
  language: hi
  text: 'क्योंकि मैंने याहवे के मार्गों का पालन किया है,

    और अपने परमेश्वर से विमुख होकर दुष्टता नहीं की है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और अपने परमेश्वर के विरुद्ध दुष्टता नहीं की है।”
    reason: इब्रानी में ‘से’ का अर्थ विमुख होना हो सकता है, जबकि इस क्रिया के साथ इसे ‘के विरुद्ध’ भी समझा जा सकता है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताता है और हिन्दी काव्यात्मक प्रवाह में स्वाभाविक है।
- source_word: שָׁמַרְתִּי
  choice: मैंने…पालन किया है
  rationale: שׁמר का अर्थ ‘रखना, मानना, पालन करना’ है; मार्गों के साथ ‘पालन करना’ स्वाभाविक हिन्दी है और इब्रानी पूर्ण क्रिया के वर्तमान-संबद्ध भाव को व्यक्त करता है।
- source_word: דַּרְכֵי
  choice: मार्गों
  rationale: बहुवचन דֶּרֶךְ यहाँ आचरण या परमेश्वर द्वारा ठहराए जीवन-मार्गों को दर्शाता है; ‘मार्गों’ मूल रूपक को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: רָשַׁעְתִּי
  choice: दुष्टता नहीं की है
  rationale: क्रिया का मूल नैतिक अर्थ ‘दुष्टता करना/दोषी ठहरना’ है; हिन्दी में ‘दुष्टता करना’ स्पष्ट और स्वाभाविक है।
- source_word: מֵאֱלֹהָי
  choice: अपने परमेश्वर से विमुख होकर
  rationale: מִן का सामान्य पृथक्करण-सूचक अर्थ ‘से’ है। ‘विमुख होकर’ दुष्टता की क्रिया के साथ उसके संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि ‘के विरुद्ध’ भी संभव है।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में परमेश्वर का व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है, न कि किसी उपाधि से प्रतिस्थापित करता है।
- issue: רָשַׁעְתִּי מֵאֱלֹהָי का संबंध
  choice: अपने परमेश्वर से विमुख होकर दुष्टता नहीं की है
  alternative: अपने परमेश्वर के विरुद्ध दुष्टता नहीं की है
  rationale: इब्रानी מִן सामान्यतः ‘से’ या अलगाव दर्शाता है, पर इस असामान्य संयोजन में ‘के विरुद्ध’ का संबंध भी संभव है। मुख्य पाठ अलगाव और नैतिक दुष्टता दोनों को बनाए रखता है; वैकल्पिक संबंध पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर काव्य-पंक्तियाँ मूल पद की संरचना को उभारती हैं; ‘मार्गों’ का पारंपरिक रूपक सुरक्षित रखा गया है।
