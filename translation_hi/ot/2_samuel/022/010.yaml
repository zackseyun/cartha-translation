    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: झुका दिया
  rationale: נטה का यहाँ कर्म שָׁמַיִם है; यह चयन आकाश के नीचे की ओर झुकाए जाने की सजीव काव्यात्मक छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: हिब्रू बहुवचन रूप यहाँ आकाश/आकाशमण्डल का बोध कराता है। आधुनिक हिन्दी में ‘आकाश’ स्वाभाविक, गरिमापूर्ण और इस ब्रह्माण्डीय काव्य-चित्र के अनुकूल है।
- source_word: וַיֵּרַד
  choice: नीचे उतर आया
  rationale: ירד की नीचे आने की गति को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַעֲרָפֶל
  choice: घना अन्धकार
  rationale: עֲרָפֶל उस सघन अन्धकार या काली घटा को सूचित कर सकता है जो प्रभु के प्रकट होने से जुड़ी है। ‘घना अन्धकार’ इसकी सघनता और रहस्यमय ईश-प्रकाशनात्मक वातावरण को सुरक्षित रखता है।
- source_word: תַּחַת
  choice: के नीचे
  rationale: स्थान-सूचक सम्बन्ध का सीधा और स्वाभाविक अनुवाद।
- source_word: רַגְלָיו
  choice: उसके पाँवों
  rationale: मूल का ठोस शारीरिक बिम्ब ज्यों का त्यों रखा गया है; इसे ‘पदचिह्नों’ जैसे अर्थानुवाद में नहीं बदला गया।
theological_decisions:
- issue: परमेश्वर के प्रकट होने का मानवरूपी और स्थानिक चित्रण
  choice: ‘नीचे उतर आया’ और ‘उसके पाँवों के नीचे’ की शारीरिक तथा स्थानिक छवि को बनाए रखा गया।
  alternative: इसे नरम करके ‘उसने स्वर्ग से अपने को प्रकट किया’ जैसा गैर-शारीरिक वर्णन देना।
  rationale: हिब्रू काव्य परमेश्वर के प्रकट होने को मानवरूपी भाषा में चित्रित करता है। इसका स्पष्टीकरण करके तनाव मिटाने के बजाय मूल काव्यात्मक और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्यात्मक शैली। ‘आकाश को झुका दिया’ ब्रह्माण्डीय बिम्ब को सजीव रखता है और ‘पाँवों’ का प्रयोग मूल की मानवरूपी छवि को बिना व्याख्यात्मक नरमी के सुरक्षित रखता है।
