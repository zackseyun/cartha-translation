base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/042.yaml
  text: They cried for help[a], but there was no one to save; they cried to Yahweh, but he did not answer them.
translation:
  language: hi
  text: उन्होंने सहायता के लिए पुकारा[a], पर बचाने वाला कोई न था; उन्होंने याहवे को पुकारा, पर उसने उन्हें उत्तर नहीं दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ “उन्होंने देखा” या “उन्होंने सहायता की ओर देखा” भी समझा जा सकता है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: יִשְׁעוּ
  choice: उन्होंने सहायता के लिए पुकारा
  rationale: संदर्भ में यह संकट के समय उद्धार की गुहार को व्यक्त करता है और अगले पदांश ‘बचाने वाला’ के साथ स्वाभाविक समानांतर बनाता है। शब्दरूप की व्याख्या ‘उन्होंने देखा’ के अर्थ में भी की गई है, इसलिए इसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְאֵין מֹשִׁיעַ
  choice: पर बचाने वाला कोई न था
  rationale: וְ यहाँ विफल पुकार के विपरीत परिणाम को जोड़ता है, इसलिए ‘पर’ स्वाभाविक है। מֹשִׁיעַ कृदंत रूप में किसी बचाने वाले व्यक्ति को दर्शाता है; ‘उद्धारकर्ता’ जैसी उपाधि के बजाय साधारण वर्णन रखा गया है।
- source_word: אֶל יְהוָה
  choice: उन्होंने याहवे को पुकारा
  rationale: मूल में दूसरे पदांश में क्रिया लुप्त है, पर पहले पदांश से समझी जाती है। स्पष्ट और स्वाभाविक हिन्दी के लिए ‘उन्होंने…पुकारा’ दोहराया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट इब्रानी नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: וְלֹא עָנָם
  choice: पर उसने उन्हें उत्तर नहीं दिया
  rationale: ענה का यहाँ अर्थ पुकार का उत्तर देना है। एकवचन कर्ता पिछले पदांश के याहवे को सूचित करता है और बहुवचन प्रत्यय ‘उन्हें’ है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ विशिष्ट वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है; ‘प्रभु’ उसे उपाधि बना देता, जबकि ‘यहोवा’ बाद की मिश्रित उच्चारण-परंपरा को दर्शाता है।
- issue: याहवे द्वारा शत्रुओं की पुकार का उत्तर न देना
  choice: कथन को बिना व्याख्यात्मक नरमी के रखा गया
  alternative: उसने उनकी सहायता नहीं की
  rationale: मूल स्पष्ट रूप से कहता है कि उसने उन्हें उत्तर नहीं दिया। इसे केवल सहायता न करने तक सीमित करना कथन के धर्मवैचारिक तनाव को कम कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर रचना को स्पष्ट करने के लिए दूसरे खंड में निहित क्रिया ‘उन्होंने…पुकारा’ दोहराई गई है।
