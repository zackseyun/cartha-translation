  text: I was blameless before him[b][a], and I kept myself from my iniquity.
translation:
  language: hi
  text: मैं उसके सामने निर्दोष रहा[a], और मैंने अपने आप को अपने अधर्म से बचाए रखा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं उसके साथ खरा/सम्पूर्ण रहा।” इब्रानी विशेषण केवल दोष से मुक्त होने के बजाय अखंडता या सम्पूर्णता पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “मैंने अपने आप को अपने पाप/दोष से बचाए रखा।” इब्रानी शब्द प्रसंग के अनुसार अधर्म, पाप या दोष का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה
  choice: मैं ... रहा
  rationale: काव्यात्मक आख्यान में היה का यह रूप भूतकालीन स्थिति बताता है; हिन्दी में संयोजक का भाव अगले खंड के 'और' से स्वाभाविक रूप से जुड़ता है।
- source_word: תָמִים
  choice: निर्दोष
  rationale: यहाँ शब्द नैतिक अखंडता और खरी चाल को दर्शाता है; 'निर्दोष' दावे की शक्ति बनाए रखता है, पर अपने आप पूर्ण पापरहितता अनिवार्य नहीं करता।
- source_word: לוֹ
  choice: उसके सामने
  rationale: शाब्दिक अर्थ 'उसके लिए/उसके प्रति' हो सकता है, पर प्रसंग में यह परमेश्वर की दृष्टि में व्यक्ति की स्थिति का संबंधपरक और मूल्यांकनात्मक भाव व्यक्त करता है।
- source_word: וָאֶשְׁתַּמְּרָה
  choice: मैंने अपने आप को ... बचाए रखा
  rationale: שׁמר का आत्मवाचक रूप स्वयं को सावधानी से रोकने या बचाए रखने का भाव देता है; यह हिन्दी प्रयोग उस आत्मवाचक बल को स्पष्ट रखता है।
- source_word: מֵעֲוֺנִי
  choice: अपने अधर्म से
  rationale: עָוֹן में अधर्म, पाप या दोष का अर्थ हो सकता है। 'अधर्म' नैतिक गंभीरता और प्रथम पुरुष संबंध—'मेरा/अपने'—दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: क्या दाऊद का कथन पूर्ण पापरहितता का दावा करता है
  choice: परमेश्वर के सामने नैतिक अखंडता/निर्दोष चाल का प्रबल दावा
  alternative: पूर्ण नैतिक निष्पापता का दावा
  rationale: תָמִים का अर्थ अखंड या खरा भी हो सकता है, और अगला खंड अपने अधर्म से सचेत रूप से बचे रहने की बात करता है। इसलिए अनुवाद कथन की शक्ति को घटाता नहीं, किंतु ऐसी पूर्ण पापरहितता भी नहीं जोड़ता जिसे इब्रानी अनिवार्य नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। 'निर्दोष' के साथ पादटिप्पणी मूल के अखंडता/सम्पूर्णता वाले अर्थ-क्षेत्र को बनाए रखती है, और 'अपने आप को ... बचाए रखा' आत्मवाचक क्रिया को स्पष्ट करता है।
