  yaml_path: translation/ot/2_samuel/022/035.yaml
  text: He trains my hands for battle[b][a], and my arms can bend a bow of bronze.
translation:
  language: hi
  text: वह मेरे हाथों को युद्ध के लिए प्रशिक्षित करता है[a], और मेरी भुजाओं से काँसे का धनुष झुक जाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लड़ाई के लिए।”
    reason: lexical_alternative
  - marker: b
    text: या “मेरी भुजाएँ काँसे के धनुष को झुका सकती हैं”; हिब्रू रचना में धनुष के भुजाओं द्वारा झुकाए जाने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלַמֵּד
  choice: प्रशिक्षित करता है
  rationale: למד का यह कृदन्त व्यावहारिक युद्ध-कौशल सिखाने का भाव रखता है; आधुनिक हिन्दी में ‘प्रशिक्षित करता है’ इस संदर्भ में स्वाभाविक और सटीक है।
- source_word: יָדַי
  choice: मेरे हाथों को
  rationale: मूल के बहुवचन और प्रथम पुरुष संबंध को रखते हुए ठोस शारीरिक बिंब सुरक्षित किया गया है।
- source_word: לַמִּלְחָמָה
  choice: युद्ध के लिए
  rationale: מלחמה युद्ध या लड़ाई दोनों को सूचित कर सकता है; यहाँ ‘युद्ध’ गरिमापूर्ण और संदर्भानुकूल है।
- source_word: וְנִחַת
  choice: झुका देती हैं
  rationale: दुर्लभ क्रिया-रूप का आशय धनुष को बलपूर्वक झुकाने से है। कर्तृवाच्य हिन्दी मूल शब्द-क्रम और भुजाओं की सामर्थ्य को सुरक्षित रखती है, यद्यपि क्रिया की व्याख्या पर कुछ अनिश्चितता है।
- source_word: קֶשֶׁת נְחוּשָׁה
  choice: काँसे के धनुष को
  rationale: קֶשֶׁת हथियार ‘धनुष’ है और נְחוּשָׁה धातु को सूचित करता है; ‘काँसा’ इस सुदृढ़ धातु-धनुष के लिए प्रचलित हिन्दी चयन है।
- source_word: זְרֹעֹתַי
  choice: मेरी भुजाएँ
  rationale: बहुवचन को बनाए रखते हुए ‘हाथों’ के समानांतर शारीरिक सामर्थ्य का बिंब सुरक्षित किया गया है।
theological_decisions:
- issue: युद्ध-कौशल में परमेश्वर की भूमिका
  choice: वक्ता अपने युद्ध-प्रशिक्षण और शारीरिक सामर्थ्य का श्रेय परमेश्वर को देता है।
  alternative: इसे सभी विश्वासियों के आत्मिक संघर्ष का सामान्य रूपक मानना।
  rationale: तात्कालिक संदर्भ वास्तविक युद्ध और दाऊद के छुटकारे का है; अनुवाद न तो इसे सार्वभौमिक युद्ध-सिद्धान्त बनाता है, न आत्मिक रूपक में बदलता है।
- issue: धनुष झुकाने में सामर्थ्य और क्रिया का संबंध
  choice: ‘मेरी भुजाएँ ... झुका देती हैं’ कहकर वक्ता की परमेश्वर-प्रदत्त सामर्थ्य व्यक्त की गई है।
  alternative: ‘मेरी भुजाओं से ... झुकाया जाता है’ अथवा ‘मेरी भुजाएँ ... झुका सकती हैं।’
  rationale: हिब्रू की संक्षिप्त और कुछ कठिन रचना को अनावश्यक रूप से स्पष्ट किए बिना सक्रिय शारीरिक बिंब रखा गया है; वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण काव्यात्मक गद्य; ‘हाथों’ और ‘भुजाओं’ की समानांतर देहात्मक छवि तथा युद्ध का ऐतिहासिक आशय बनाए रखा गया है।
