base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/012.yaml
  text: He made darkness a shelter around him[a], a massing of waters, thick clouds of the skies.
translation:
  language: hi
  text: उसने अपने चारों ओर अंधकार को आश्रय बनाया[a]—जल का जमाव, आकाश के घने बादल।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने अंधकार को अपने चारों ओर आश्रय-स्थल ठहराया—जल का एकत्रित पुंज, आकाश के घने बादल।” इब्रानी पंक्ति अत्यंत काव्यात्मक है। “आश्रय” के लिए बहुवचन रूप है, और “जल का जमाव” वाला दुर्लभ पद “जल का एकत्रित पुंज” अथवा अधिक व्याख्यात्मक रूप में “वर्षा से भरे काले बादल” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁת
  choice: बनाया
  rationale: क्रिया का मूल अर्थ ‘रखना/स्थापित करना’ है; इस वाक्य-विन्यास में ‘आश्रय बनाया’ स्वाभाविक हिन्दी है और किसी वस्तु को एक कार्य देने का भाव बनाए रखता है।
- source_word: חֹשֶׁךְ
  choice: अंधकार
  rationale: यह संज्ञा का सीधा और गरिमापूर्ण हिन्दी रूप है तथा परमेश्वर के प्रकट होने से जुड़े तूफ़ानी आवरण का बिंब सुरक्षित रखता है।
- source_word: סְבִיבֹתָיו
  choice: अपने चारों ओर
  rationale: यह घिराव के स्थानिक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है; कर्ता ही प्रत्यय ‘उसके’ का संदर्भ है।
- source_word: סֻכּוֹת
  choice: आश्रय
  rationale: इब्रानी रूप बहुवचन ‘आश्रय-स्थल/छप्पर’ है, पर अंधकार के सामूहिक आवरण के लिए हिन्दी में एकवचन ‘आश्रय’ अधिक स्वाभाविक है। बहुवचन की संभावना पादटिप्पणी में रखी गई है।
- source_word: חַשְׁרַת מַיִם
  choice: जल का जमाव
  rationale: यह दुर्लभ और अनिश्चित पद जल के एकत्रित, सघन पुंज का संकेत देता है। ‘जल का जमाव’ उसकी ठोस तूफ़ानी छवि और अर्थगत अस्पष्टता दोनों को यथासंभव सुरक्षित रखता है।
- source_word: עָבֵי שְׁחָקִים
  choice: आकाश के घने बादल
  rationale: עָבֵי बादलों की सघनता और שְׁחָקִים ऊँचे आकाश का बोध कराता है; चुना हुआ रूप स्पष्ट, काव्यात्मक और आधुनिक हिन्दी में स्वाभाविक है।
