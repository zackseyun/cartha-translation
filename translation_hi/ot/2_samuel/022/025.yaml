  text: And Yahweh repaid me according to my righteousness[b][a], according to my cleanness before his eyes.
translation:
  language: hi
  text: और यहोवा ने मुझे मेरी धार्मिकता के अनुसार, उसकी दृष्टि में मेरी शुद्धता के अनुसार प्रतिफल दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: प्रतिफल दिया
  rationale: यहाँ שוב का प्रयोग प्रत्युपकार या किए के अनुरूप फल देने के अर्थ में है। ‘प्रतिफल दिया’ हिन्दी में स्वाभाविक है और केवल सकारात्मक ‘पुरस्कार’ की अपेक्षा व्यापक अर्थ बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ द्वारा प्रस्तुत किया गया है।
- source_word: לִי
  choice: मुझे
  rationale: यह क्रिया का अप्रत्यक्ष कर्म है; ‘प्रतिफल दिया’ के साथ ‘मुझे’ स्वाभाविक हिन्दी है।
- source_word: כְּצִדְקָתִי
  choice: मेरी धार्मिकता के अनुसार
  rationale: צדקה यहाँ नैतिक अथवा वाचागत खराई और सही आचरण को व्यक्त करता है। ‘धार्मिकता’ इस दावे को बिना संकुचित या नरम किए बनाए रखती है।
- source_word: כְּבֹרִי
  choice: मेरी शुद्धता के अनुसार
  rationale: בֹּר स्वच्छता या शुद्धता को दर्शाता है। हिन्दी में ‘शुद्धता’ व्यक्ति की नैतिक निर्मलता के लिए ‘स्वच्छता’ से अधिक स्वाभाविक है। पद में ‘हाथ’ नहीं है, इसलिए उसे जोड़ा नहीं गया।
- source_word: לְנֶגֶד עֵינָיו
  choice: जो उसकी आँखों के सामने थी
  rationale: यह चयन इब्रानी के ठोस बिंब ‘उसकी आँखों के सामने’ को बनाए रखता है और सम्बन्धवाचक संरचना से स्पष्ट करता है कि वाक्यांश निकटवर्ती ‘शुद्धता’ को विशेषित करता है। इसका मुहावरेदार अर्थ ‘उसकी दृष्टि में’ है।
theological_decisions:
- issue: दाऊद का अपनी धार्मिकता और शुद्धता का दावा
  choice: प्रथम पुरुष में किए गए सीधे दावे को बिना नरम किए रखा गया है।
  alternative: इसे सापेक्ष वाचागत निष्ठा, किसी विशेष प्रसंग में निर्दोषता, या निष्पापता से भिन्न धार्मिकता के रूप में स्पष्ट करना।
  rationale: इब्रानी पाठ सीधे कहता है कि यहोवा ने दाऊद को उसकी धार्मिकता और शुद्धता के अनुसार प्रतिफल दिया। अनुवाद इस धर्मवैचारिक तनाव को बनाए रखता है और व्याख्यात्मक समाधान को मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए बोधगम्य रखी गई है। ‘और’ से आरम्भ करके इब्रानी וַ־ का प्रवाह सुरक्षित है। ‘प्रतिफल दिया’ अपेक्षाकृत औपचारिक है, पर भजनात्मक प्रसंग के अनुकूल और सहज है।
