  text: He sent from on high[a]; he took me[b]; he drew me out of many waters.
translation:
  language: hi
  text: उसने ऊँचाई से हाथ बढ़ाया[a]; उसने मुझे थाम लिया; उसने मुझे बहुत-से जलों[b] में से बाहर खींच लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से ‘उसने ऊँचाई से भेजा’ या ‘उसने ऊँचाई से बढ़ाया’ है; किसे भेजा या बढ़ाया गया, यह निर्दिष्ट नहीं है। ‘हाथ’ उद्धार के प्रसंग से जोड़ा गया है।
    reason: शाब्दिक विकल्प और निहित कर्म को स्पष्ट करना
  - marker: b
    text: शाब्दिक रूप से ‘बहुत-से जलों में से’; इसे ‘विशाल जलराशियों में से’ या ‘प्रचण्ड जलों में से’ भी समझा जा सकता है।
    reason: मूल काव्यात्मक अभिव्यक्ति के वैकल्पिक अर्थ बताना
lexical_decisions:
- source_word: יִשְׁלַח
  choice: हाथ बढ़ाया
  rationale: मूल क्रिया का सामान्य अर्थ ‘भेजना’ है और प्रसंग में इसका भाव ऊपर से सहायता के लिए कुछ बढ़ाने का है। हिंदी में ‘हाथ बढ़ाया’ उद्धार की क्रिया को स्वाभाविक रूप से व्यक्त करता है; जोड़ा गया ‘हाथ’ निहित कर्म को स्पष्ट करता है, इसलिए शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: מִמָּרוֹם
  choice: ऊँचाई से
  rationale: यह शब्द किसी ऊँचे स्थान को दर्शाता है। ‘ऊँचाई से’ काव्यात्मक स्थान-बोध बनाए रखता है और मूल से अधिक स्पष्ट रूप से ‘स्वर्ग से’ नहीं कहता।
- source_word: יִקָּחֵנִי
  choice: मुझे थाम लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है; बचाव के इस दृश्य में ‘थाम लिया’ आधुनिक हिंदी में स्वाभाविक है और सुरक्षित पकड़ लेने का भाव देता है।
- source_word: יַמְשֵׁנִי
  choice: मुझे ... बाहर खींच लिया
  rationale: हिफ़िल रूप पानी में से किसी को खींचकर बाहर निकालने को व्यक्त करता है; ‘बाहर खींच लिया’ इस चित्र को स्पष्ट और स्वाभाविक रूप में रखता है।
- source_word: מִמַּיִם רַבִּים
  choice: अपार जलराशि में से
  rationale: शाब्दिक रूप से ‘बहुत जलों में से।’ ‘अपार जलराशि’ हिंदी में सहज काव्यात्मक अभिव्यक्ति है और जल की प्रचुरता तथा विशालता का चित्र बनाए रखती है।
theological_decisions:
- issue: ऊपर से होने वाले परमेश्वर के उद्धार का स्थानिक चित्र
  choice: ‘ऊँचाई से’ रखा गया है।
  alternative: ‘स्वर्ग से’
  rationale: मूल शब्द ऊँचाई बताता है, पर इस पद में सीधे ‘स्वर्ग’ नहीं कहता। चुना गया रूप परमेश्वर के ऊपर से हस्तक्षेप करने का काव्यात्मक चित्र बनाए रखते हुए अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- issue: पहली क्रिया में निहित कर्म
  choice: ‘हाथ बढ़ाया’
  alternative: ‘भेजा’ या ‘ऊपर से बढ़ाया’
  rationale: हिब्रू में क्रिया के साथ भेजी या बढ़ाई गई वस्तु स्पष्ट नहीं है। बचाव के प्रसंग में ‘हाथ’ स्वाभाविक रूप से निहित समझा जाता है, पर इस पूर्ति को पादटिप्पणी द्वारा पारदर्शी रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘ऊँचाई,’ ‘थाम लिया’ और ‘अपार जलराशि’ सामान्य पाठक के लिए सहज हैं तथा उद्धार के मूल जल-चित्र को बनाए रखते हैं।
