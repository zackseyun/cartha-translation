  text: Then the earth reeled and quaked; the foundations of the heavens trembled and shook, because he was angry.
translation:
  language: hi
  text: तब पृथ्वी डगमगाई और काँप उठी; आकाश की नींवें थरथराईं और हिल गईं, क्योंकि वह क्रोधित था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַשׁ
  choice: डगमगाई
  rationale: क्रिया רעש यहाँ पृथ्वी के प्रबल रूप से हिलने या डोलने को व्यक्त करती है; निकटवर्ती भिन्न क्रियाओं की पुनरुक्ति बनाए रखने के लिए इसे अगले पद 'काँप उठी' से अलग रखा गया है।
- source_word: וַתִּתְגָּעַשׁ
  choice: काँप उठी
  rationale: געש का अर्थ उथल-पुथल या प्रचंड कंपन है; पृथ्वी के लिए सहज आधुनिक हिन्दी में 'काँप उठी' इस तीव्रता को व्यक्त करता है।
- source_word: מוֹסְדוֹת הַשָּׁמַיִם
  choice: आकाश की नींवें
  rationale: इब्रानी ब्रह्मांड-वर्णन के ठोस रूपक को स्पष्ट किए बिना यथावत रखा गया है। बहुवचन מוֹסְדוֹת के लिए 'नींवें' चुना गया है।
- source_word: יִרְגָּזוּ
  choice: थरथराईं
  rationale: רגז भय, व्याकुलता या कंपन का संकेत दे सकता है; इस भौतिक ब्रह्मांडीय प्रसंग में 'थरथराईं' उपयुक्त है।
- source_word: וַיִּתְגָּעֲשׁוּ
  choice: हिल गईं
  rationale: नींवों के प्रचंड रूप से हिलने का स्वाभाविक हिन्दी वर्णन; पूर्ववर्ती 'थरथराईं' के साथ दोहरी क्रिया संरक्षित रहती है।
- source_word: כִּי חָרָה לוֹ
  choice: क्योंकि वह क्रोधित हुआ था
  rationale: חרה לו का शाब्दिक भाव 'उसका क्रोध भड़क उठा' है; सरल और dignified हिन्दी में कारणात्मक उपवाक्य दिया गया है, जबकि पूर्वपदों से स्पष्ट परमेश्वर के लिए सर्वनाम रखा गया है।
theological_decisions:
- issue: ईश्वरीय क्रोध का मानवीय भाव-भाषा में वर्णन
  choice: क्योंकि वह क्रोधित हुआ था
  alternative: क्योंकि उसका क्रोध भड़क उठा था
  rationale: मूल में परमेश्वर के क्रोध को प्रत्यक्ष कारण बताया गया है। अनुवाद इस कथन को न तो रूपक घोषित करता है, न उसकी तीव्रता को धर्मवैज्ञानिक व्याख्या से बढ़ाता है।
- issue: प्राचीन ब्रह्मांड-चित्र में आकाश की नींवें
  choice: आकाश की नींवें
  alternative: धरती की नींवें
  rationale: शमूएल के मसोराई पाठ में הַשָּׁמַיִם 'आकाश' है; समानांतर भजन 18 के भिन्न पाठ के आधार पर इसे बदला नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। समानार्थी गति-क्रियाओं की शृंखला को अलग-अलग हिन्दी क्रियाओं से बनाए रखा गया है।
