  text: בְּנֵ֥י נֵכָ֖ר יִבֹּ֑לוּ וְ/יַחְגְּר֖וּ מִ/מִּסְגְּרוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/046.yaml
  text: Foreigners lose heart and come trembling out of their strongholds[a][b][c].
translation:
  language: hi
  text: परदेशी हिम्मत हार जाते हैं और अपने गढ़ों से काँपते हुए बाहर आते हैं[a][b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परदेशी मुरझा जाते हैं।” इब्रानी क्रिया का अधिक शाब्दिक अर्थ मुरझाना या फीका पड़ना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ इब्रानी क्रिया का अर्थ कठिन है; अन्य सम्भावनाएँ हैं, “दबकते हुए आते हैं,” “लँगड़ाते हुए आते हैं,” या अधिक शाब्दिक रूप से, “अपनी कमर बाँधते हैं।”
    reason: lexical_alternative
  - marker: c
    text: या, “अपने किलों से”; अथवा, कम सम्भावना से, “अपने बंदीगृहों/घेरों से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: परदेशी
  rationale: यह रचना शाब्दिक रूप से ‘पराएपन के पुत्र’ है, पर इब्रानी मुहावरे में इसका अर्थ विदेशी या परदेशी लोग है। ‘परदेशी’ सहज, सामूहिक और काव्यात्मक है।
- source_word: יִבֹּלוּ
  choice: हिम्मत हार जाते हैं
  rationale: נבל का मूल अर्थ ‘मुरझाना’ या ‘फीका पड़ना’ है। युद्ध-विजय के इस काव्यात्मक संदर्भ में यह साहस और शक्ति चुकने का भाव देता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: וְיַחְגְּרוּ
  choice: काँपते हुए बाहर आते हैं
  rationale: यहाँ क्रिया कठिन है। חגר सामान्यतः ‘कमर बाँधना’ दर्शाती है, पर समानांतर संदर्भ में भयभीत दशा में निकलने का भाव सम्भव है। मुख्य पाठ संदर्भानुकूल अर्थ देता है और वास्तविक शाब्दिक तथा व्याख्यात्मक विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: מִמִּסְגְּרוֹתָם
  choice: अपने गढ़ों से
  rationale: מִסְגְּרוֹת घिरे या बंद स्थानों को सूचित कर सकता है। सैन्य विजय-गीत में ‘गढ़’ सबसे स्वाभाविक है, जबकि ‘किले’ तथा ‘बंदीगृहों/घेरों’ की सम्भावनाएँ पादटिप्पणी में दी गई हैं।
