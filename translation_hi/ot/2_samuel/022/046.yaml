  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण काव्यात्मक भाषा। ‘हिम्मत हार जाते हैं’ और ‘काँपते हुए बाहर आते हैं’ संदर्भगत अर्थ स्पष्ट करते हैं, जबकि कठिन इब्रानी क्रियाओं और संज्ञा की वास्तविक अस्पष्टता पादटिप्पणियों में रखी गई है।
