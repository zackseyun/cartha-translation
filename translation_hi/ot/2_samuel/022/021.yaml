  text: יִגְמְלֵ֥/נִי יְהוָ֖ה כְּ/צִדְקָתִ֑/י כְּ/בֹ֥ר יָדַ֖/י יָשִׁ֥יב לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/021.yaml
  text: Yahweh has dealt with me according to my righteousness[b][a]; according to the cleanness of my hands he has repaid me.
translation:
  language: hi
  text: याहवे ने मेरी धार्मिकता के अनुसार मेरे साथ व्यवहार किया[a]; मेरे हाथों की शुद्धता[b] के अनुसार उसने मुझे प्रतिफल दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझे प्रतिफल दिया।” इब्रानी क्रिया का अर्थ किसी के आचरण के अनुरूप उसके साथ व्यवहार करना या उसे उसका फल देना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “हाथों की शुद्धता” एक इब्रानी मुहावरा है, जिसका अर्थ अपने कामों में निर्दोषता या नैतिक शुद्धता है।
    reason: cultural_note
lexical_decisions:
- source_word: יִגְמְלֵנִי
  choice: मेरे साथ व्यवहार किया
  rationale: גמל किसी व्यक्ति के आचरण के अनुरूप उसके साथ व्यवहार करने या उसे प्रतिफल देने का भाव रखता है। यह चयन व्यापक अर्थ को बनाए रखता है, जबकि समानांतर पंक्ति सकारात्मक प्रतिफल का संकेत देती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिन्दी में प्रचलित ध्वन्यात्मक रूप में रखा गया है।
- source_word: כְּצִדְקָתִי
  choice: मेरी धार्मिकता के अनुसार
  rationale: צדקה यहाँ वक्ता के सीधे और उचित आचरण को दर्शाता है। यह अनुवाद प्रथम पुरुष के स्पष्ट दावे और उसके धार्मिक तनाव को बिना नरम किए सुरक्षित रखता है।
- source_word: כְּבֹר יָדַי
  choice: मेरे हाथों की शुद्धता
  rationale: בֹּר शुद्धता या स्वच्छता को व्यक्त करता है। हाथों की शुद्धता का ठोस काव्यात्मक रूप बनाए रखा गया है; इसका आशय कर्मों की निर्दोषता है।
- source_word: יָשִׁיב לִי
  choice: उसने मुझे प्रतिफल दिया
  rationale: שוב का हिफ़ईल रूप यहाँ किसी के आचरण के अनुरूप उसे लौटाने या प्रतिदान देने के अर्थ में है। 'प्रतिफल दिया' हिन्दी में सकारात्मक प्रतिदान को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: क्या वक्ता की धार्मिकता और शुद्ध हाथों के दावे को निरपेक्ष निष्पापता या परमेश्वर के सामने उद्धार कमाने के अर्थ में प्रस्तुत किया जाए
  choice: वक्ता के अपने धार्मिक और शुद्ध आचरण के दावे को मूल पाठ के अनुसार सीधे रखा गया है।
  alternative: दावे को नरम करना, या इसे निरपेक्ष निष्पापता अथवा कर्मों से उद्धार की शिक्षा के रूप में विस्तार देना।
  rationale: इब्रानी पाठ स्पष्टतः 'मेरी धार्मिकता' और 'मेरे हाथों की शुद्धता' कहता है। अनुवाद इस कथन को सुरक्षित रखता है, पर इसमें उससे व्यापक कोई धर्मसैद्धांतिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, काव्यात्मक गरिमा के साथ रखी गई है। 'धार्मिकता' मूल के प्रत्यक्ष धार्मिक शब्द को सुरक्षित रखता है; 'हाथों की शुद्धता' की ठोस इब्रानी छवि को अर्थ खोलकर मुख्य पाठ में बदलने के बजाय पादटिप्पणी में समझाया गया है।
