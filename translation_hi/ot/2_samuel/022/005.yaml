  rationale: क्रिया चारों ओर से घिर जाने या घेरे में आ जाने का बोध कराती है।
- source_word: מִשְׁבְּרֵי
  choice: प्रचंड लहरों
  rationale: शब्द टूटकर चढ़ आने वाली समुद्री लहरों या हिलोरों को सूचित करता है। ‘प्रचंड लहरें’ हिन्दी में जल की हिंसक और संकटपूर्ण छवि को स्पष्ट रखता है।
- source_word: מָוֶת
  choice: मृत्यु
  rationale: मूल शब्द का सीधा अर्थ है; यहाँ मृत्यु को चारों ओर से घेरने वाली लहरों के रूप में चित्रित किया गया है।
- source_word: נַחֲלֵי
  choice: उफनती धाराओं
  rationale: यह नालों, जलधाराओं या आकस्मिक वेगवान प्रवाहों के लिए प्रयुक्त हो सकता है। काव्यात्मक समानांतरता में ‘उफनती धाराएँ’ उसके भयावह वेग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְלִיַּעַל
  choice: दुष्टता
  rationale: इस प्रसंग में इसे सामान्य संज्ञा मानकर निकृष्टता, दुष्टता या विनाशकारी बुराई के अर्थ में लिया गया है। ‘दुष्टता’ सामान्य पाठक के लिए स्वाभाविक है और बाद में विकसित व्यक्तिवाचक अर्थ को मुख्य पाठ में आरोपित नहीं करता।
- source_word: יְבַעֲתֻנִי
  choice: मुझे भयभीत कर दिया
  rationale: क्रिया तीव्र आतंक या घबराहट उत्पन्न होने का भाव देती है; यह हिन्दी अभिव्यक्ति उसकी तीव्रता को स्पष्ट रखती है।
theological_decisions:
- issue: בְלִיַּעַל को सामान्य संज्ञा माना जाए या व्यक्तिवाचक नाम
  choice: मुख्य पाठ में सामान्य संज्ञा के रूप में ‘दुष्टता’
  alternative: ‘बेलियाल की धाराएँ’
  rationale: इस प्राचीन काव्यात्मक संदर्भ में यह शब्द दुष्टता, निकृष्टता या विनाशकारी बुराई का संकेत दे सकता है। इसे अनिवार्यतः एक दुष्ट आत्मिक व्यक्ति का नाम मानना पाठ से अधिक विकसित दानव-विज्ञान आरोपित कर सकता है; फिर भी वास्तविक भाषिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
