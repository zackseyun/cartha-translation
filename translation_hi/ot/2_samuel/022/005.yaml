lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इसके व्याख्यात्मक-कारणसूचक बल को स्वाभाविक रूप से व्यक्त करता है।
