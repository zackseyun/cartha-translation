base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/029.yaml
  text: For you are my lamp[a], O Yahweh[b], and Yahweh lights up my darkness.
translation:
  language: hi
  text: क्योंकि हे याहवे, आप ही मेरे दीपक हैं[a], और याहवे मेरे अँधेरे को प्रकाश देते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘मेरे दीपक’; अर्थ की दृष्टि से ‘मेरी ज्योति’ भी सम्भव है, पर इब्रानी में ठोस चित्र दीपक का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या कारण बताता है; ‘क्योंकि’ इसके संयोजक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אַתָּה
  choice: आप ही
  rationale: ईश्वर को सीधे संबोधित करने वाले द्वितीय पुरुष एकवचन को आदरसूचक ‘आप’ से व्यक्त किया गया है; ‘ही’ विधेय के साथ आए सर्वनाम के बल को स्वाभाविक हिन्दी में उभारता है।
- source_word: נֵירִי
  choice: मेरे दीपक
  rationale: נֵיר ठोस रूप से दीपक को सूचित करता है, केवल अमूर्त प्रकाश को नहीं; इसलिए मूल रूपक सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: प्रत्यक्ष संबोधन में परमेश्वर के व्यक्तिगत नाम को ‘यहोवा’ के रूप में रखा गया है और हिन्दी संबोधन के लिए ‘हे’ जोड़ा गया है।
- source_word: וַיהוָה
  choice: और यहोवा
  rationale: संयोजक और दोहराया गया दिव्य नाम मूल की समानांतर रचना को बनाए रखते हैं।
- source_word: יַגִּיהַּ
  choice: उजाला कर देते हैं
  rationale: नगा के हिफ़ील रूप का भाव प्रकाश उत्पन्न करना है; यह वाक्यांश आधुनिक हिन्दी में उसके कारक और काव्यात्मक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חָשְׁכִּי
  choice: मेरे अँधेरे को
  rationale: प्रथम पुरुष प्रत्यय सहित संज्ञा का सीधा अर्थ ‘मेरा अँधेरा’ है; इसे संकट, निराशा या किसी विशेष परिस्थिति के रूप में सीमित नहीं किया गया।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ दोनों खंडों में टेट्राग्रामटन का प्रयोग करता है। उपाधि से बदलने के बजाय व्यक्तिगत नाम को रखा गया है; ‘यहोवा’ हिन्दी पाठकों में प्रचलित रूप है।
- issue: ‘मेरे अँधेरे’ का आशय
  choice: रूपक को खुला रखा गया
  alternative: मेरे संकट को / मेरे जीवन का अँधेरा
  rationale: मूल पाठ अँधेरे के ठोस और रूपकात्मक अर्थों के बीच की व्यापकता को स्पष्ट नहीं करता; इसलिए किसी एक आध्यात्मिक या परिस्थितिजन्य अर्थ को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक ईश्वरीय संबोधन और गरिमापूर्ण काव्यात्मक लय। ‘दीपक’ मूल के ठोस रूपक को बचाता है, जबकि ‘उजाला कर देते हैं’ सहज आधुनिक प्रयोग है।
