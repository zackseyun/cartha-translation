id: 2SA.22.31
reference: 2 Samuel 22:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הָ/אֵ֖ל תָּמִ֣ים דַּרְכּ֑/וֹ אִמְרַ֤ת יְהוָה֙ צְרוּפָ֔ה מָגֵ֣ן ה֔וּא לְ/כֹ֖ל הַ/חֹסִ֥ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/031.yaml
  text: As for God[a], his way is blameless; the word of Yahweh is proven; he is a shield to all who take refuge in him.
translation:
  language: hi
  text: 'परमेश्वर का मार्ग निर्दोष है;

    याहवे का वचन परखा हुआ[a] है;

    वह उन सभी के लिए ढाल है

    जो उसमें शरण लेते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुद्ध किया हुआ” अथवा “जाँचा हुआ”; इब्रानी शब्द अग्नि में धातु को शुद्ध करके परखने की छवि जगाता है।
    reason: צְרוּפָה के धातु-शोधन रूपक और उसके ‘परखा/विश्वसनीय सिद्ध’ अर्थ—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: הָאֵל
  choice: परमेश्वर
  rationale: यह पद के आरम्भ में परमेश्वर को विषय के रूप में प्रमुखता देता है। हिन्दी में सरल कर्ता-विन्यास इस बल को स्वाभाविक रूप से व्यक्त करता है; ‘जहाँ तक परमेश्वर की बात है’ काव्य-पंक्ति को अनावश्यक रूप से भारी बनाता।
- source_word: תָּמִים
  choice: निर्दोष
  rationale: यहाँ अर्थ है दोष या कमी से रहित। ‘निर्दोष’ परमेश्वर के कार्य-मार्ग की अखंडता को स्पष्ट करता है, जबकि ‘सिद्ध’ आधुनिक पाठक को अपेक्षाकृत अमूर्त लग सकता है।
- source_word: דַּרְכּוֹ
  choice: उसका मार्ग
  rationale: ‘मार्ग’ परमेश्वर के आचरण और कार्य करने के ढंग, दोनों की रूपकात्मक व्यापकता बनाए रखता है।
- source_word: אִמְרַת יְהוָה
  choice: याहवे का वचन
  rationale: אִמְרָה कथन, वचन या कही हुई बात को दर्शाता है। ‘वचन’ काव्यात्मक और व्यापक है तथा इसे केवल किसी एक प्रतिज्ञा तक सीमित नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यंजनात्मक नाम YHWH को शीर्षक से बदलने के बजाय हिन्दी में उसके प्रचलित लिप्यंतरण ‘याहवे’ द्वारा प्रस्तुत किया गया है।
- source_word: צְרוּפָה
  choice: परखा हुआ
  rationale: यह शब्द धातु को अग्नि में शोधने और इस प्रकार उसकी असलियत जाँचने की छवि जगाता है। ‘परखा हुआ’ स्पष्ट हिन्दी में विश्वसनीय सिद्ध होने का भाव देता है; मूल धातु-शोधन रूपक को पादटिप्पणी में रखा गया है।
- source_word: מָגֵן
  choice: ढाल
  rationale: ‘ढाल’ मूल की ठोस सुरक्षात्मक छवि को सीधे बनाए रखता है।
- source_word: לְכֹל הַחֹסִים בּוֹ
  choice: उन सभी के लिए … जो उसमें शरण लेते हैं
  rationale: חסה संकट में आश्रय या सुरक्षा पाने के लिए शरण लेने को व्यक्त करता है। यह अनुवाद अमूर्त ‘भरोसा करने’ की अपेक्षा ढाल और आश्रय की संयुक्त छवि सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है; साथ ही किसी विशिष्ट सांप्रदायिक व्याख्या को नहीं जोड़ता।
- issue: צְרוּפָה में शोधन और परीक्षण का रूपक
  choice: परखा हुआ
  alternative: शुद्ध किया हुआ; तपा हुआ; कसौटी पर खरा
  rationale: मुख्य पाठ में ‘परखा हुआ’ वचन की प्रमाणित विश्वसनीयता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है। पादटिप्पणी बताती है कि इब्रानी में धातु को अग्नि में शुद्ध करने की ठोस छवि भी निहित है, इसलिए रूपक को पूरी तरह छिपाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त और काव्यात्मक रखी गई है। समानांतर पंक्तियाँ मूल पद की काव्य-रचना को उभारती हैं। ‘मार्ग’, ‘वचन’, ‘ढाल’ और ‘शरण लेना’ जैसे परिचित शब्द गरिमापूर्ण बाइबिलीय शैली बनाए रखते हुए सामान्य पाठक के लिए सुबोध हैं।
