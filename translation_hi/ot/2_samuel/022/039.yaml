  yaml_path: translation/ot/2_samuel/022/039.yaml
  text: I consumed them and shattered them[a], and they did not rise[b]; they fell under my feet.
translation:
  language: hi
  text: मैंने उन्हें नष्ट कर दिया[a] और चकनाचूर कर दिया[b]; वे नहीं उठे। वे मेरे पैरों तले गिर पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भस्म कर दिया”; इब्रानी क्रिया का मूल अर्थ “खा जाना” या “निगल लेना” है और यहाँ युद्ध के रूपक में विनाश करने के अर्थ में है।
    reason: lexical_alternative
  - marker: b
    text: या, “कुचल दिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲכַלֵּם
  choice: मैंने उन्हें मिटा डाला
  rationale: אכל का मूल अर्थ ‘खाना/निगलना’ है, पर युद्ध-संदर्भ में इसका विस्तृत अर्थ ‘भस्म करना, नष्ट कर देना’ है। हिन्दी में ‘उन्हें खा गया’ अनचाहा शाब्दिक अर्थ दे सकता है; ‘मिटा डाला’ विनाश की तीव्रता और काव्यात्मकता बनाए रखता है।
- source_word: וָאֶמְחָצֵם
  choice: चकनाचूर कर दिया
  rationale: מחץ प्रहार करके कुचलने या चूर करने का बोध देता है। ‘चकनाचूर कर दिया’ निर्णायक और हिंसक पराजय की सजीव युद्ध-छवि को बनाए रखता है।
- source_word: וְלֹא יְקוּמוּן
  choice: वे फिर उठ न सके
  rationale: शाब्दिक रूप से ‘वे नहीं उठे।’ प्रसंग में पराजय की स्थायी परिणति स्पष्ट करने के लिए स्वाभाविक हिन्दी ‘फिर उठ न सके’ चुना गया है; पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: וַיִּפְּלוּ
  choice: वे ... गिर पड़े
  rationale: נפל का सीधा अर्थ ‘गिरना’ है। ‘गिर पड़े’ हिन्दी में पूर्ण हुई क्रिया और काव्यात्मक गति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תַּחַת רַגְלָי
  choice: मेरे पैरों तले
  rationale: यह अधीनता और पूर्ण पराजय की छवि है। ‘पैरों तले’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और काव्यात्मक है।
theological_decisions:
- issue: दाऊद के विजय-गीत में हिंसक युद्ध-चित्रण
  choice: पूर्ण विनाश और अधीनता की प्रथम-पुरुष भाषा को बिना नरम किए बनाए रखना
  alternative: ‘मैंने उन्हें पूरी तरह हरा दिया’ जैसा नरम भावानुवाद
  rationale: इब्रानी पाठ विनाश, कुचलने और पैरों तले गिरने की तीखी काव्यात्मक भाषा का प्रयोग करता है। आधुनिक संवेदनशीलता के कारण इस तीव्रता को घटाना स्रोत के युद्ध-चित्रण को बदल देगा।
- issue: וְלֹא יְקוּמוּן में परिणाम बनाम सामर्थ्य
  choice: मुख्य पाठ में ‘वे फिर उठ न सके’, साथ में शाब्दिक विकल्प की पादटिप्पणी
  alternative: ‘वे फिर नहीं उठे’
  rationale: इब्रानी रूप सीधे तौर पर ‘नहीं उठे’ कहता है और असमर्थता स्पष्ट रूप से अंकित नहीं करता। स्वाभाविक हिन्दी मुख्य पाठ परिणाम की निर्णायकता व्यक्त करता है, जबकि पादटिप्पणी मूल की अधिक औपचारिक रचना संरक्षित करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर विजय-गीत के अनुरूप संक्षिप्त, गरिमापूर्ण और तीव्र काव्यात्मक लहजा रखा गया है। ‘चकनाचूर’ और ‘पैरों तले’ युद्ध तथा अधीनता की मूल छवियों को सजीव रखते हैं।
