lexical_decisions:
- source_word: וְאֶשְׁחָקֵם
  choice: मैंने उन्हें कुचलकर ... कर दिया
  rationale: שׁחק का अर्थ यहाँ कुचलना या पीसकर चूर करना है। यह प्रयोग धूल की उपमा के साथ हिंसक और परिणामसूचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כַּעֲפַר אָרֶץ
  choice: धरती की धूल के समान
  rationale: עפר का सामान्य अर्थ धूल या भुरभुरी मिट्टी है; यह अनुवाद इब्रानी संबंध-रचना को स्पष्ट और गरिमापूर्ण हिन्दी में रखता है।
- source_word: כְּטִיט חוּצוֹת
  choice: गलियों की कीचड़ के समान
  rationale: טיט कीचड़ या दलदल-जैसी गीली मिट्टी है और חוצות नगर की गलियों अथवा खुले सार्वजनिक स्थानों को सूचित करता है। संदर्भ में 'गलियों की कीचड़' स्पष्ट और सजीव है।
- source_word: אֲדִקֵּם
  choice: मैंने उन्हें बारीक पीसा
  rationale: דקק के हिफ़ील रूप में बारीक कुचलने या पीसने का भाव है। 'बारीक पीसा' पहले क्रियापद से अर्थगत संबंध रखते हुए उसकी तीव्रता और परिणति व्यक्त करता है।
- source_word: אֶרְקָעֵם
  choice: रौंद डाला
  rationale: רקע का मूल भाव पीटकर चपटा करने, फैलाने या पाँव से दबाने तक जा सकता है। युद्ध और गली की कीचड़ की छवि में 'रौंद डाला' सर्वाधिक स्वाभाविक है; दूसरी सम्भावना पादटिप्पणी में सुरक्षित है।
