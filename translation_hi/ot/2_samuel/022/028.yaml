  text: You save an afflicted people[b][a], but your eyes are on the haughty to bring them low.
translation:
  language: hi
  text: 'तू पीड़ित लोगों[a] को बचाता है,

    पर तेरी आँखें घमंडियों[b] पर लगी हैं;

    तू उन्हें नीचा करता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गरीब लोगों” अथवा “दीन लोगों।” इब्रानी विशेषण गरीब, पीड़ित, सताए हुए या दीन लोगों को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अभिमानियों।” इब्रानी शब्द का मूल भाव “ऊँचे” का है और यहाँ घमंडी या अपने को ऊँचा समझने वाले लोगों के लिए प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם
  choice: लोगों
  rationale: एकवचन सामूहिक संज्ञा यहाँ व्यक्तियों के समुदाय को दर्शाती है; आधुनिक हिन्दी में ‘लोगों’ स्वाभाविक है और काव्यात्मक समानांतरता के अनुकूल है।
- source_word: עָנִי
  choice: पीड़ित
  rationale: यह विशेषण गरीब, दीन, सताया हुआ या दुःख झेलने वाला अर्थ दे सकता है। ‘पीड़ित’ आर्थिक अर्थ तक सीमित हुए बिना उनकी दुःखपूर्ण और दबाई हुई दशा व्यक्त करता है।
- source_word: תּוֹשִׁיעַ
  choice: तू ... बचाता है
  rationale: हिफ़ील रूप का व्यापक अर्थ बचाना या छुड़ाना है। ‘बचाता है’ संक्षिप्त, स्वाभाविक और अर्थ की व्यापकता को बनाए रखता है।
- source_word: עֵינֶיךָ
  choice: तेरी आँखें
  rationale: मूल पाठ के ठोस और सजीव मुहावरे को हिन्दी में स्पष्ट रूप से बनाए रखा गया है।
- source_word: רָמִים
  choice: घमंडियों
  rationale: शाब्दिक रूप से यह ‘ऊँचे लोगों’ को दर्शा सकता है, पर इस विरोधात्मक प्रसंग में नैतिक रूप से अपने को ऊँचा समझने वालों का भाव प्रमुख है। ‘घमंडियों’ पीड़ित लोगों के साथ इसका नैतिक विरोध स्पष्ट करता है।
- source_word: תַּשְׁפִּיל
  choice: नीचा करे
  rationale: हिफ़ील रूप का अर्थ किसी को नीचा करना या दीन करना है। यह चुनाव मूल की ऊँचा–नीचा शब्द-छवि को सुरक्षित रखता है।
- source_word: וְ
  choice: पर
  rationale: मूल संयोजक सामान्यतः ‘और’ है, किंतु दोनों पंक्तियों में पीड़ितों को बचाने और घमंडियों को नीचा करने का विरोध है; इसलिए हिन्दी में ‘पर’ संबंध को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: नैतिक विरोध बनाम केवल सामाजिक-आर्थिक विरोध
  choice: पद में पीड़ित लोगों को बचाने और घमंडियों को नीचा करने का विरोध व्यक्त किया गया है।
  alternative: इसे केवल आर्थिक रूप से गरीब लोगों और सामाजिक रूप से ऊँचे लोगों का विरोध माना जा सकता है।
  rationale: עָנִי और רָמִים में सामाजिक अर्थ की संभावना बनी रहती है, पर काव्यात्मक समानांतरता नैतिक-धार्मिक विरोध भी दर्शाती है। मुख्य पाठ इस विरोध को स्पष्ट करता है, जबकि पादटिप्पणियाँ शब्दों की व्यापकता बनाए रखती हैं।
- issue: ‘तेरी आँखें ... ताकि’ का संबंध
  choice: परमेश्वर की दृष्टि घमंडियों पर उन्हें नीचा करने के उद्देश्य से लगी है।
  alternative: मूल वाक्य को अधिक शाब्दिक रूप से ‘तेरी आँखें घमंडियों पर हैं; तू उन्हें नीचा करता है’ कहा जा सकता है।
  rationale: ‘ताकि’ हिन्दी में वाक्य-संबंध को सहज बनाता है और परामर्शी अंग्रेज़ी पाठ के परिणाम/उद्देश्य भाव के अनुरूप है, यद्यपि इब्रानी में यह संबंध स्पष्ट उद्देश्यवाचक कण से नहीं बताया गया।
translation_notes:
  register: समकालीन, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। दाऊद द्वारा परमेश्वर को सीधे संबोधित किए जाने के कारण एकवचन निकट संबोधन ‘तू/तेरी’ रखा गया है। पंक्ति-विभाजन मूल की काव्यात्मक समानांतरता दिखाता है।
