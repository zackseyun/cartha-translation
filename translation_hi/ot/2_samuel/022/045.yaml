  text: परदेशी लोग मेरे प्रति झूठी अधीनता दिखाते हैं[a]; सुनते ही[b] वे मेरी आज्ञा मानते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे सामने दुबक जाते हैं’ अथवा ‘अनिच्छा से मेरे अधीन हो जाते हैं।’ इब्रानी क्रिया में बनावटी या विवश अधीनता का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘कान के सुनने पर’; अर्थात् जैसे ही वे सुनते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: परदेशी लोग
  rationale: शाब्दिक अर्थ ‘परदेश के पुत्र’ है, पर यह इब्रानी मुहावरा विदेशी लोगों को दर्शाता है। आधुनिक हिन्दी में ‘परदेशी लोग’ स्वाभाविक और अर्थ-सटीक है।
- source_word: יִתְכַּחֲשׁוּ לִי
  choice: मेरे सामने झूठी अधीनता दिखाते हैं
  rationale: כחש का हित्पएल रूप यहाँ विजय के संदर्भ में अनिच्छुक, बनावटी या कपटपूर्ण समर्पण का भाव रखता है; केवल ‘अधीन होते हैं’ कहने से यह महत्त्वपूर्ण सूक्ष्मता मिट जाती।
- source_word: לִשְׁמֹעַ אֹזֶן
  choice: मेरे बारे में सुनते ही
  rationale: शाब्दिक मुहावरा ‘कान के सुनने पर’ तत्काल प्रतिक्रिया को व्यक्त करता है। ‘सुनते ही’ उस बल को स्वाभाविक हिन्दी में रखता है; संदर्भानुसार निहित विषय ‘मेरे बारे में’ स्पष्ट किया गया है।
- source_word: יִשָּׁמְעוּ לִי
  choice: वे मेरी आज्ञा मानते हैं
  rationale: שׁמע के साथ ל यहाँ केवल सुनने के बजाय ध्यान देने और आज्ञापालन करने का अर्थ देता है।
theological_decisions:
- issue: परदेशियों की अधीनता का स्वरूप
  choice: झूठी अधीनता दिखाते हैं
  alternative: मेरे अधीन हो जाते हैं / मेरे सामने दुबकते हैं
  rationale: मूल क्रिया स्वेच्छापूर्ण निष्ठा और भयभीत या कपटपूर्ण समर्पण के बीच तनाव रखती है। मुख्य पाठ में बनावटी अधीनता का प्रबल शाब्दिक भाव रखा गया और वैकल्पिक संभावना पादटिप्पणी में दी गई।
