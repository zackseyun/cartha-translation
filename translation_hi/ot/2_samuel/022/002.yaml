  text: 'And he said: “The LORD is my rock and my fortress and my deliverer for me.”'
translation:
  language: hi
  text: 'उसने कहा: “यहोवा मेरी चट्टान, मेरा गढ़ और मेरा छुड़ानेवाला है।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “और मेरा छुड़ानेवाला मेरे लिए।”'
    reason: हिब्रू के अतिरिक्त לִי (‘मेरे लिए’) को दर्शाना, जिसका हितसूचक/बलवर्धक भाव स्वाभाविक हिंदी मुख्य पाठ में ‘मेरा छुड़ानेवाला’ में समाहित है।
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को सामान्य हिंदी बाइबलीय रूप में प्रस्तुत किया गया है; इसे केवल उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- source_word: סַלְעִי
  choice: मेरी चट्टान
  rationale: ‘चट्टान’ सुरक्षा, स्थिरता और आश्रय के मूल रूपक को बनाए रखता है।
- source_word: מְצֻדָתִי
  choice: मेरा गढ़
  rationale: यह दुर्ग या सुरक्षित शरणस्थान के अर्थ को संक्षिप्त और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: מְפַלְטִי
  choice: मेरा छुड़ानेवाला
  rationale: कर्तृवाचक रूप उस व्यक्ति को दर्शाता है जो संकट से बचाता या निकालता है।
- source_word: לִי
  choice: अर्थ में समाहित; पादटिप्पणी में ‘मेरे लिए’
  rationale: अंतिम לִי संबंध/हित पर बल देता है, पर मुख्य हिंदी वाक्य में ‘मेरा छुड़ानेवाला’ के बाद ‘मेरे लिए’ अनावश्यक पुनरुक्ति लगेगी; इसलिए स्रोत की स्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: व्यक्तिगत नाम और उपाधि के बीच स्रोत-पाठ का भेद बनाए रखा गया है, बिना किसी सांप्रदायिक व्याख्या को जोड़े।
- issue: अंतिम לִי की अभिव्यक्ति
  choice: मुख्य पाठ में स्वाभाविक संबंधसूचक रूप, पादटिप्पणी में शाब्दिक बल
  alternative: ‘और मेरे लिए मेरा छुड़ानेवाला’
  rationale: हिब्रू का बल सुरक्षित रहता है, जबकि अस्वाभाविक हिंदी पुनरुक्ति से बचा जाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिंदी। काव्यात्मक रूपकों को यथावत रखा गया है और वाक्य को अत्यधिक संस्कृतनिष्ठ नहीं बनाया गया।
