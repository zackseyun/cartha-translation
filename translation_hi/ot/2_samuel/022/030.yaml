id: 2SA.22.30
reference: 2 Samuel 22:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֥י בְ/כָ֖ה אָר֣וּץ גְּד֑וּד בֵּ/אלֹהַ֖/י אֲדַלֶּג שֽׁוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/030.yaml
  text: For by you I can run against a troop[c][b][a]; by my God I can leap over a wall.
translation:
  language: hi
  text: क्योंकि तेरे द्वारा मैं एक सैनिक-दल पर धावा बोल सकता हूँ[a][b]; अपने परमेश्वर के द्वारा मैं दीवार लाँघ सकता हूँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे साथ” अथवा “तेरे सहारे”; हिब्रू संबंधबोधक शब्द साथ या साधन—दोनों का भाव दे सकता है। यहाँ इसे परमेश्वर द्वारा मिली सामर्थ्य के अर्थ में लिया गया है।
    reason: lexical_alternative
  - marker: b
    text: या “एक छापामार दल।”
    reason: lexical_alternative
  - marker: c
    text: या “गढ़ की दीवार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के आधार या व्याख्या को प्रस्तुत करता है और काव्यगत संबंध बनाए रखता है।
- source_word: בְכָה
  choice: तेरे द्वारा
  rationale: 'בְּ को यहाँ साधन के अर्थ में लिया गया है: परमेश्वर दाऊद को कार्य करने में समर्थ बनाता है; साथ होने का अर्थ भी संभव है।'
- source_word: אָרוּץ
  choice: मैं ... धावा बोल सकता हूँ
  rationale: रוץ का मूल अर्थ दौड़ना है; सैन्य प्रसंग में गְּדוּד के साथ यह किसी दल पर दौड़कर आक्रमण करने का भाव देता है। अपूर्ण रूप यहाँ परमेश्वर से मिली सामर्थ्य व्यक्त कर सकता है।
- source_word: גְּדוּד
  choice: एक सैनिक-दल
  rationale: यह सैनिक टुकड़ी, सशस्त्र दल या छापामार दल को सूचित कर सकता है; 'सैनिक-दल' आधुनिक हिन्दी में स्पष्ट है।
- source_word: בֵּאלֹהַי
  choice: अपने परमेश्वर के द्वारा
  rationale: पहले चरण के समान साधन या सामर्थ्य के स्रोत का भाव रखते हुए 'मेरे परमेश्वर' के व्यक्तिगत संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲדַלֶּג
  choice: मैं ... लाँघ सकता हूँ
  rationale: पिएल रूप का अर्थ उछलकर या छलाँग लगाकर पार करना है; हिन्दी में 'लाँघना' संक्षिप्त और स्वाभाविक है तथा सामर्थ्य का भाव बनाए रखता है।
- source_word: שׁוּר
  choice: दीवार
  rationale: यह विशेषकर रक्षात्मक या किलेबंद दीवार को दर्शाता है; सामान्य पाठक के लिए 'दीवार' सीधा और स्पष्ट है।
theological_decisions:
- issue: युद्ध-संबंधी चित्रण में परमेश्वर से मिली सामर्थ्य
  choice: '''मैं ... सकता हूँ'' द्वारा ऐसी क्षमता व्यक्त की गई है जो परमेश्वर के द्वारा मिलती है।'
  alternative: केवल वर्तमान क्रिया के रूप में 'मैं धावा बोलता हूँ ... मैं दीवार लाँघता हूँ।'
  rationale: काव्यात्मक प्रसंग में हिब्रू अपूर्ण क्रियाएँ समर्थ की गई क्षमता या बार-बार के अनुभव को व्यक्त कर सकती हैं। इससे पद का केंद्र परमेश्वर-प्रदत्त विजय पर रहता है, बिना उससे आगे कोई व्यवस्थित धर्मसिद्धांत जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, काव्यात्मक और सहज शैली। समानांतर दोनों चरणों में 'के द्वारा' और 'सकता हूँ' रखकर मूल की संरचना तथा परमेश्वर-प्रदत्त सामर्थ्य का भाव सुरक्षित रखा गया है।
