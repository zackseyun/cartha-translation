  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हिरनियाँ’ मादा हिरनों को दर्शाता है; यह फुर्ती और कठिन जगहों पर दृढ़ पग का काव्यात्मक चित्र है।
    reason: lexical_alternative
