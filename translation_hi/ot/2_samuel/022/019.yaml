  yaml_path: translation/ot/2_samuel/022/019.yaml
  text: They confronted me in the day of my calamity[b][a], but Yahweh was my support.
translation:
  language: hi
  text: मेरी विपत्ति के दिन उन्होंने मेरा सामना किया[a], पर याहवे[b] मेरा सहारा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे मेरी विपत्ति के दिन मुझ पर आ पड़े” अथवा “मुझसे आ भिड़े।”
    reason: इब्रानी क्रिया का अर्थ आगे आकर मिलना, आ पड़ना या शत्रुतापूर्वक सामना करना हो सकता है।
  - marker: b
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम YHWH है, जिसे यहाँ “याहवे” लिखा गया है; अनेक अनुवादों में इसके स्थान पर “प्रभु” लिखा जाता है।
    reason: दिव्य नाम के हिन्दी प्रतिलेखन और पारंपरिक उपाधीय विकल्प को स्पष्ट करना।
lexical_decisions:
- source_word: יְקַדְּמֻנִי
  choice: उन्होंने मेरा सामना किया
  rationale: पिएल रूप यहाँ शत्रुतापूर्ण प्रसंग में आगे आकर किसी का सामना करने का भाव देता है। यह अनुवाद विरोधी बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּיוֹם אֵידִי
  choice: मेरी विपत्ति के दिन
  rationale: אֵיד भारी विपत्ति, विनाश या दुर्भाग्य को सूचित करता है; ‘विपत्ति’ अर्थ की व्यापकता बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: וַיְהִי
  choice: पर ... बना
  rationale: वाव का मूल संयोजक बल है, किंतु प्रसंग में शत्रुओं के आक्रमण और यहोवा के सहारे के बीच स्पष्ट विरोध है; इसलिए ‘पर’ संबंध को सहज रूप से दिखाता है। ‘बना’ यहाँ संकट में सहारा सिद्ध होने का भाव देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित रूप ‘यहोवा’ व्यक्तिगत दिव्य नाम को शीर्षक से बदले बिना प्रस्तुत करता है। मूल व्यंजनात्मक नाम YHWH का सटीक उच्चारण निश्चित नहीं है।
- source_word: מִשְׁעָן לִי
  choice: मेरा सहारा
  rationale: מִשְׁעָן मूलतः वह वस्तु है जिस पर टेका जाए; रूपक में ‘मेरा सहारा’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है, इसलिए उसे केवल उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। हिन्दी पाठकों में पहचाने जाने वाले ‘यहोवा’ रूप को मुख्य पाठ में रखा गया और उच्चारण-संबंधी अनिश्चितता को पादटिप्पणी में स्पष्ट किया गया।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और काव्यात्मक गरिमा वाली रखी गई है। ‘सामना किया’ शत्रुतापूर्ण संदर्भ व्यक्त करता है, जबकि पादटिप्पणी मूल क्रिया की व्यापकता बचाती है।
