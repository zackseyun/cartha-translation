  text: עַל כֵּ֛ן אוֹדְ/ךָ֥ יְהוָ֖ה בַּ/גּוֹיִ֑ם וּ/לְ/שִׁמְ/ךָ֖ אֲזַמֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/050.yaml
  text: Therefore I will praise you among the nations[a], O Yahweh, and I will sing praise to your name.
translation:
  language: hi
  text: 'इसलिए, हे याहवे, मैं राष्ट्रों के बीच तेरी स्तुति करूँगा,

    और तेरे नाम का भजन गाऊँगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पद पिछले वर्णन से निष्कर्ष निकालता है; ‘इसलिए’ उसके परिणामसूचक बल को स्वाभाविक और संक्षिप्त रूप में व्यक्त करता है।
- source_word: אוֹדְךָ
  choice: मैं तेरी स्तुति करूँगा
  rationale: हिफ़ील रूप यहाँ धन्यवाद देने और प्रशंसा करने, दोनों का भाव रख सकता है। अगले चरण के ‘भजन गाऊँगा’ के समानांतर ‘स्तुति’ उपयुक्त है, जबकि धन्यवाद का भाव भी इसमें पूरी तरह बाहर नहीं होता।
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम है। संबोधन को स्पष्ट रखने के लिए ‘हे’ और प्रचलित हिन्दी लिप्यंतरण ‘यहोवा’ लिया गया है।
- source_word: בַּגּוֹיִם
  choice: जाति-जाति के लोगों के बीच
  rationale: גּוֹיִם यहाँ इस्राएल से बाहर की विभिन्न जातियों या राष्ट्रों को दर्शाता है। यह हिन्दी अभिव्यक्ति अंतरराष्ट्रीय और मानवीय दोनों पहलुओं को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: וּלְשִׁמְךָ
  choice: और तेरे नाम का
  rationale: לְ के साथ זמר का अर्थ नाम की स्तुति में गाना है। हिन्दी में ‘तेरे नाम का भजन गाऊँगा’ स्वाभाविक है और ‘नाम’ को बनाए रखता है, जो पहचान और प्रतिष्ठा का भी बोध कराता है।
- source_word: אֲזַמֵּר
  choice: भजन गाऊँगा
  rationale: पिअेल रूप संगीत के साथ स्तुति गाने का भाव देता है। ‘भजन गाऊँगा’ आधुनिक हिन्दी में उपासना-संबंधी अर्थ को सहजता से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत दिव्य नाम है। ‘यहोवा’ हिन्दी बाइबल-परंपरा में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण है और मूल में उपस्थित नाम को किसी उपाधि से नहीं बदलता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी; दाऊद के सीधे संबोधन के अनुरूप एकवचन निकटता-सूचक ‘तेरी/तेरे’ रखा गया है। दोनों काव्य-पंक्तियों का समानांतर भाव सुरक्षित है।
