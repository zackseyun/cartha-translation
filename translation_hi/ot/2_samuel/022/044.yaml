  text: וַֽ/תְּפַלְּטֵ֔/נִי מֵ/רִיבֵ֖י עַמִּ֑/י תִּשְׁמְרֵ֨/נִי֙ לְ/רֹ֣אשׁ גּוֹיִ֔ם עַ֥ם לֹא יָדַ֖עְתִּי יַעַבְדֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/044.yaml
  text: You delivered me from the strivings of my people[a]; you kept me as the head of nations[c][b]; a people I had not known served me.
translation:
  language: hi
  text: तूने मुझे मेरी प्रजा के झगड़ों से छुड़ाया[a]; तूने मुझे राष्ट्रों का प्रधान बनाए रखा[b]; जिन लोगों को मैं नहीं जानता था, वे मेरी सेवा करते हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरी प्रजा के विवादों से।’ इब्रानी वाक्यांश दाऊद की अपनी प्रजा के भीतर की कलह या उससे जुड़े संघर्षों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तूने मुझे राष्ट्रों के प्रधान के रूप में सुरक्षित रखा।’
    reason: lexical_alternative
  - marker: c
    text: या ‘जिन लोगों को मैं नहीं जानता, वे मेरी सेवा करेंगे।’ काव्य में इब्रानी अपूर्ण क्रिया भविष्य का भाव भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּפַלְּטֵנִי
  choice: तूने मुझे ... छुड़ाया
  rationale: हिफ़ील रूप किसी को बच निकलने देने या छुड़ाने का भाव देता है; ‘छुड़ाया’ काव्यात्मक संदर्भ में स्वाभाविक और स्पष्ट है।
- source_word: מֵרִיבֵי עַמִּי
  choice: मेरी प्रजा के झगड़ों से
  rationale: רִיב विवाद, झगड़े या कलह को व्यक्त कर सकता है। संबंधसूचक रचना यह अस्पष्टता रहने देती है कि ये प्रजा के भीतर के झगड़े थे या उससे जुड़े संघर्ष।
- source_word: תִּשְׁמְרֵנִי
  choice: तूने मुझे ... बनाए रखा
  rationale: שׁמר का अर्थ रखना, रक्षा करना या बनाए रखना है। भूमिका-सूचक לְרֹאשׁ के साथ ‘बनाए रखा’ संरक्षण और पद की निरंतरता दोनों दर्शाता है।
- source_word: לְרֹאשׁ גּוֹיִם
  choice: राष्ट्रों का प्रधान
  rationale: רֹאשׁ यहाँ रूपक रूप में मुखिया या शासक है; ‘प्रधान’ आधुनिक हिंदी में गरिमापूर्ण है और शारीरिक ‘सिर’ के भ्रामक अर्थ से बचता है।
- source_word: עַם לֹא יָדַעְתִּי
  choice: जिन लोगों को मैं नहीं जानता था
  rationale: एकवचन सामूहिक עַם को हिंदी में स्वाभाविक सामूहिक बहुवचन से व्यक्त किया गया है; पूर्व अपरिचय का भाव बना रहता है।
- source_word: יַעַבְדֻנִי
  choice: वे मेरी सेवा करने लगे
  rationale: עבד यहाँ राजकीय सेवा या अधीनता का संकेत देता है। काव्यात्मक अपूर्ण रूप को पूर्ववर्ती उद्धार के परिणामस्वरूप आरंभ हुई सेवा के रूप में प्रस्तुत किया गया है, जबकि भविष्यात्मक संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: विदेशी राष्ट्रों पर राजकीय प्रभुत्व
  choice: मुख्य पाठ में दाऊद के ऐतिहासिक-राजकीय संदर्भ को रखा गया है।
  alternative: मुख्य पाठ में इसे प्रत्यक्ष मसीही भविष्यवाणी के रूप में स्पष्ट करना।
  rationale: पद अपने तात्कालिक संदर्भ में दाऊद के उद्धार और राजत्व का वर्णन करता है। व्यापक धर्मवैज्ञानिक अर्थ संभव हो सकता है, पर उसे अनुवाद में आरोपित नहीं किया गया।
- issue: יַעַבְדֻנִי का कालगत मूल्य
  choice: 'परिणामी भूतकाल: ‘सेवा करने लगे।’'
  alternative: 'भविष्यात्मक: ‘मेरी सेवा करेंगे।’'
  rationale: काव्यात्मक अपूर्ण क्रिया भूतकालीन गीत में परिणामी या निरंतर क्रिया बता सकती है, पर भविष्य की छाया भी संभव है; इसलिए विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, एकवचन आत्मीय/काव्यात्मक ईश-संबोधन ‘तू’; भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है।
