  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। परमेश्वर के लिए निकट और पारंपरिक एकवचन संबोधन ‘तू’ प्रयुक्त है। समानांतर पदबंधों और ठोस ऊर्ध्वगामी बिंब को सुरक्षित रखा गया है।
