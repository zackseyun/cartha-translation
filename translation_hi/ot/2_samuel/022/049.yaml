translation:
  language: hi
  text: जो मुझे मेरे शत्रुओं से बाहर निकालता है; तू मुझे मेरे विरुद्ध उठनेवालों से ऊँचा उठाता है; तू मुझे हिंसक मनुष्य से बचाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמוֹצִיאִי
  choice: जो मुझे ... बाहर निकालता है
  rationale: हिफ़ील रूप के ठोस बिंब ‘बाहर निकालना’ को सुरक्षित रखा गया है। पिछले संदर्भ में परमेश्वर का वर्णन जारी रहने के कारण हिन्दी में ‘जो’ स्वाभाविक है।
- source_word: מֵאֹיְבָי
  choice: मेरे शत्रुओं से
  rationale: पूर्वसर्ग और प्रथम पुरुष एकवचन प्रत्यय का सीधा तथा स्वाभाविक हिन्दी रूप।
- source_word: וּמִקָּמַי
  choice: मेरे विरुद्ध उठनेवालों से
  rationale: קום की क्रियात्मक छवि और विरोधी भाव दोनों को ‘विरुद्ध उठनेवाले’ व्यक्त करता है।
- source_word: תְּרוֹמְמֵנִי
  choice: तू मुझे ... से ऊँचा उठाता है
  rationale: रום की ऊर्ध्वगामी छवि और विरोधियों पर विजय का भाव बनाए रखता है; हिन्दी काव्य में भी स्वाभाविक है।
- source_word: מֵאִישׁ חֲמָסִים
  choice: हिंसक मनुष्य से
  rationale: איש के व्याकरणिक एकवचन और חמסים के हिंसा-सूचक गुणात्मक अर्थ को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תַּצִּילֵנִי
  choice: तू मुझे ... बचाता है
  rationale: נצל के छुड़ाने/बचाने के अर्थ को आधुनिक और सहज हिन्दी में व्यक्त करता है।
theological_decisions: []
