  yaml_path: translation/ot/2_samuel/022/026.yaml
  text: With the faithful you show yourself faithful; with the blameless warrior you show yourself blameless.
translation:
  language: hi
  text: निष्ठावान के साथ तू अपने को निष्ठावान दिखाता है; निर्दोष वीर के साथ तू अपने को निर्दोष दिखाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָסִיד / תִּתְחַסָּד
  choice: निष्ठावान / अपने को निष्ठावान दिखाता है
  rationale: मूल में एक ही חסד-धातु की शब्द-क्रीड़ा है। ‘निष्ठावान’ वाचा-संबंधी दृढ़ निष्ठा का भाव देता है और दोनों पदों में शब्द-साम्य बनाए रखता है।
- source_word: גִּבּוֹר
  choice: वीर
  rationale: यह शब्द सामर्थ्यवान पुरुष या योद्धा को सूचित कर सकता है; दाऊद के युद्धगीत के प्रसंग में ‘वीर’ स्वाभाविक है और अनावश्यक विस्तार से बचता है।
- source_word: תָּמִים / תִּתַּמָּם
  choice: निर्दोष / अपने को निर्दोष दिखाता है
  rationale: मूल की पुनरुक्ति को बनाए रखते हुए नैतिक खराई और निष्कपटता का भाव व्यक्त करता है; इसका अर्थ निरपेक्ष पापहीनता ठहराना आवश्यक नहीं।
theological_decisions:
- issue: परमेश्वर के व्यवहार और मनुष्य के चरित्र के बीच समानांतर संबंध
  choice: ‘के साथ तू अपने को ... दिखाता है’
  alternative: ‘के प्रति तू ... रहता है’
  rationale: हिब्रू की आत्मवाचक क्रिया-रचना को स्पष्ट रखता है और यह तनाव सुरक्षित रखता है कि पद परमेश्वर के प्रकट व्यवहार का वर्णन करता है।
- issue: תָּמִים का धर्मवैज्ञानिक दायरा
  choice: निर्दोष
  alternative: खरा / सिद्ध
  rationale: ‘निर्दोष’ समानांतरता और पारंपरिक नैतिक भाव को बनाए रखता है, पर पाठ स्वयं पूर्ण पापहीनता की कोई व्यवस्थित परिभाषा नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक समानांतरता और द्वितीय पुरुष एकवचन ‘तू’ रखा गया है, जो आसपास के स्तुतिगीत में परमेश्वर को सीधे संबोधन के अनुरूप है।
