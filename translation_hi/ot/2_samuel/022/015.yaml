translation:
  language: hi
  text: उसने तीर भेजे और उन्हें तितर-बितर कर दिया; बिजली की चमक से उन्हें व्याकुल कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: चलाकर
  rationale: שלח का मूल अर्थ ‘भेजना’ है, पर तीरों के साथ आधुनिक हिन्दी में ‘तीर चलाना’ स्वाभाविक है और प्रक्षेपण के काव्यात्मक युद्ध-बिंब को बनाए रखता है।
- source_word: חִצִּים
  choice: तीर
  rationale: חִצִּים का मानक और स्पष्ट हिन्दी रूप ‘तीर’ है।
- source_word: וַיְפִיצֵם
  choice: उन्हें तितर-बितर कर दिया
  rationale: यह क्रिया शत्रुओं को बिखेरने या भगाने का भाव देती है; ‘तितर-बितर कर दिया’ कारणवाचक बल और युद्ध-संदर्भ दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בָּרָק
  choice: बिजली चमकाकर
  rationale: בָּרָק का अर्थ ‘बिजली/बिजली की चमक’ है। अगले क्रियापद के साथ संक्षिप्त हिब्रू वाक्य को हिन्दी में जोड़ने के लिए ‘चमकाकर’ निहित क्रिया को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: וַיְהֻמֵּם
  choice: उन्हें घबरा दिया
  rationale: המם का अर्थ भ्रमित, व्याकुल या परास्त कर देना हो सकता है। ‘घबरा दिया’ संक्षिप्त, सहज हिन्दी में उत्पन्न आतंक और अव्यवस्था को व्यक्त करता है, बिना केवल सैन्य पराजय तक अर्थ सीमित किए।
theological_decisions:
- issue: ‘उन्हें’ का संदर्भ
  choice: दोनों सर्वनामों को प्रसंग में निहित शत्रुओं के लिए रखा गया है।
  alternative: वस्तु को और अस्पष्ट छोड़ा जा सकता था, या ‘शत्रुओं’ को स्पष्ट रूप से जोड़ा जा सकता था।
  rationale: हिब्रू के बहुवचन कर्म-प्रत्यय किसी समूह की ओर संकेत करते हैं, और निकटवर्ती ईश्वरीय युद्ध-संदर्भ में शत्रु सबसे स्वाभाविक संदर्भ हैं। ‘शत्रु’ शब्द जोड़ने के बजाय ‘उन्हें’ मूल की संक्षिप्तता बनाए रखता है।
- issue: המם के प्रभाव की व्याख्या
  choice: ‘घबरा दिया’
  alternative: ‘परास्त कर दिया’ या ‘भ्रम में डाल दिया’
  rationale: मूल क्रिया में भ्रम, आतंक और युद्ध में अस्त-व्यस्त होने की अर्थ-सीमा है। चुना हुआ रूप इस तनाव को किसी एक संकीर्ण सैन्य परिणाम में नहीं बाँधता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली। समानांतर युद्ध-बिंब सुरक्षित रखा गया है; जहाँ हिब्रू में क्रिया लुप्त है वहाँ हिन्दी की स्वाभाविकता के लिए ‘चमकाकर’ जोड़ा गया है।
