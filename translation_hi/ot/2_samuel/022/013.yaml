  text: From the brightness before him[a], coals of fire blazed forth.
translation:
  language: hi
  text: उसके सामने की चमक में से[a] आग के अंगारे धधक उठे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके सामने की दीप्ति में से आग के अंगारे भड़क उठे।”
    reason: ‘चमक/दीप्ति’ और ‘धधक उठे/भड़क उठे’ मूल शब्दों के सम्भव काव्यात्मक विकल्प हैं।
lexical_decisions:
- source_word: מִנֹּגַהּ
  choice: चमक से
  rationale: נֹגַהּ का अर्थ चमक, दीप्ति या प्रकाश है; उपसर्ग מִן स्रोत को दर्शाता है। ‘चमक से’ सहज आधुनिक हिन्दी में ईश्वरीय प्रकटता के प्रकाशमय बिंब को बनाए रखता है।
- source_word: נֶגְדּוֹ
  choice: उसके सामने की
  rationale: נֶגֶד के साथ तीसरे पुरुष एकवचन प्रत्यय का स्थानिक अर्थ ‘उसके सामने’ है। ‘सामने की चमक’ हिन्दी में स्वाभाविक है और ‘उपस्थिति’ जैसा विस्तार नहीं जोड़ता।
- source_word: בָּעֲרוּ
  choice: धधक उठे
  rationale: בער का मूल अर्थ जलना या प्रज्वलित होना है। ‘धधक उठे’ काव्यात्मक दृश्य की तीव्रता और आरम्भगत भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גַּחֲלֵי אֵשׁ
  choice: आग के अंगारे
  rationale: यह इब्रानी समास का निकट और हिन्दी में स्वाभाविक रूप है; इससे अग्निमय अंगारों का काव्य-बिंब सुरक्षित रहता है।
theological_decisions:
- issue: ईश्वरीय प्रकटता का बिंब और निहित कर्ता
  choice: पंक्ति में अंगारों को उसके सामने की चमक से धधकते हुए बताया गया है; कोई अतिरिक्त ईश्वरीय क्रिया नहीं जोड़ी गई।
  alternative: ‘उसकी चमक ने आग के अंगारों को भड़का दिया’ जैसे स्पष्ट कारणात्मक रूप में अनुवाद करना।
  rationale: इब्रानी काव्य संक्षिप्त है और चमक को स्पष्ट व्याकरणिक कर्ता नहीं बनाता। स्रोत-संबंध और दृश्यक्रम को बनाए रखने से धार्मिक अर्थ का अनावश्यक विस्तार नहीं होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और काव्यात्मक। ‘आग के अंगारे’ मूल समास के निकट है, जबकि ‘धधक उठे’ सहज हिन्दी में दृश्य की तीव्रता व्यक्त करता है।
