lexical_decisions:
- source_word: תַּרְחִיב
  choice: खुली जगह देता है
  rationale: רחב के हिफ़ील रूप का अर्थ किसी चीज़ को चौड़ा या विस्तृत करना है। हिंदी में यह अभिव्यक्ति कदम रखने और चलने के लिए पर्याप्त स्थान देने का भाव स्वाभाविक ढंग से व्यक्त करती है।
- source_word: צַעֲדַי
  choice: मेरे कदमों को
  rationale: צעד का सामान्य अर्थ ‘कदम’ या ‘डग’ है। मूल शारीरिक और काव्यात्मक बिंब बनाए रखने के लिए ‘कदमों’ को रखा गया है।
- source_word: תַּחְתֵּנִי
  choice: मेरे पैरों तले
  rationale: शाब्दिक अर्थ ‘मेरे नीचे’ है। ‘मेरे पैरों तले’ हिंदी में स्वाभाविक है और सुरक्षित आधार का स्थानिक बिंब स्पष्ट करता है।
- source_word: וְלֹא
  choice: और ... नहीं
  rationale: सरल संयोजक और निषेध को उसी समानांतर संबंध में रखा गया है; इसे उद्देश्यसूचक ‘ताकि’ नहीं बनाया गया।
- source_word: מָעֲדוּ
  choice: नहीं डगमगाते
  rationale: מעד में फिसलने, लड़खड़ाने या अस्थिर हो जाने का अर्थ हो सकता है। टखनों के साथ ‘डगमगाते’ स्थिरता का भाव और शारीरिक बिंब दोनों बनाए रखता है।
- source_word: קַרְסֻלַּי
  choice: मेरे टखने
  rationale: यह शब्द सामान्यतः पैर के बजाय टखने के भाग को सूचित करता है, इसलिए अधिक विशिष्ट शारीरिक शब्द रखा गया है।
