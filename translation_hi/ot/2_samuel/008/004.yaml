base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/004.yaml
  text: David captured from him 1,700 horsemen and 20,000 foot soldiers[a]. Then David hamstrung all the chariot horses[c][b], but left enough for 100 chariots.
translation:
  language: hi
  text: दाऊद ने उससे 1,700[a] घुड़सवार और 20,000 पैदल सैनिक बंदी बना लिए। फिर दाऊद ने रथों के सभी घोड़ों की पिछली टाँगों की कण्डराएँ काट दीं, पर 100 रथों के लिए पर्याप्त घोड़े छोड़ दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में “1,700 घुड़सवार” है; 1 इतिहास 18:4 के समानांतर वृत्तांत में “7,000 घुड़सवार” है।
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: बंदी बना लिए
  rationale: לכד युद्ध के प्रसंग में पकड़ने या अधिकार में लेने को व्यक्त करता है; सैनिकों के लिए ‘बंदी बना लिए’ स्वाभाविक और स्पष्ट है।
- source_word: מִמֶּנּוּ
  choice: उससे
  rationale: इब्रानी प्रत्यय एकवचन है और संदर्भ में पराजित राजा हददेजेर की ओर संकेत करता है।
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת פָּרָשִׁים
  choice: 1,700 घुड़सवार
  rationale: פָּרָשִׁים घुड़सवार सेना को दर्शाता है; संख्या सामुएल के मसोरेटिक पाठ के अनुसार रखी गई है।
- source_word: וְעֶשְׂרִים אֶלֶף אִישׁ רַגְלִי
  choice: 20,000 पैदल सैनिक
  rationale: शाब्दिक अर्थ ‘पाँव के बीस हजार पुरुष’ है; आधुनिक सैन्य संदर्भ में ‘पैदल सैनिक’ स्पष्ट है।
- source_word: וַיְעַקֵּר
  choice: पिछली टाँगों की नसें काट दीं
  rationale: עקר यहाँ घोड़ों को युद्ध के अयोग्य बनाने के लिए उनकी पिछली टाँगों की नसें काटने को दर्शाता है; यह हिन्दी में ‘पंगु कर दिया’ से अधिक ठोस और स्रोत-संगत है।
- source_word: אֶת כָּל הָרֶכֶב
  choice: रथों के सभी घोड़ों
  rationale: רֶכֶב का मूल संकेत रथ-दल है, पर ‘नसें काटने’ की क्रिया के कारण यहाँ रथ खींचने वाले घोड़े लाक्षणिक रूप से अभिप्रेत हैं।
- source_word: וַיּוֹתֵר מִמֶּנּוּ מֵאָה רָכֶב
  choice: पर 100 रथों के लिए पर्याप्त घोड़े छोड़ दिए
  rationale: יתר का अर्थ बचा रहने देना है; ‘100 रथ’ उस मात्रा को बताता है जिसके लिए घोड़े सुरक्षित रखे गए।
