  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण कथात्मक गद्य। तकनीकी ‘घुटने की नस काटना’ जैसी संभावित भ्रामक अभिव्यक्ति के बजाय शारीरिक क्रिया को सामान्य पाठक के लिए स्पष्ट किया गया है। पादटिप्पणी-चिह्न संबंधित संख्या के तुरंत बाद रखने के बजाय पद के अंत में रखा गया है, और पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
