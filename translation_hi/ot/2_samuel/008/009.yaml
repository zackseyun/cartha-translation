    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ने सुना
  rationale: שׁמע का सीधा और स्वाभाविक अर्थ यहाँ समाचार सुनना है; कथात्मक क्रम को हिंदी में ‘जब ... ने सुना’ से व्यक्त किया गया है।
- source_word: תֹּעִי
  choice: तोई
  rationale: मुख्य पाठ में WLC/मसोरेटिक पाठ के नाम-रूप תֹּעִי का देवनागरी लिप्यंतरण रखा गया है।
- source_word: מֶלֶךְ חֲמָת
  choice: हमात के राजा
  rationale: यह संबंधसूचक पदबंध राजा और उसके राज्य/नगर की सीधी पहचान कराता है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי सुनी गई बात की विषय-वस्तु प्रस्तुत करता है, कारण नहीं।
- source_word: הִכָּה
  choice: मार गिराया है
  rationale: नכה के सैनिक प्रसंग में प्रहार करके परास्त या मार गिराने के ठोस भाव को बनाए रखता है; ‘हरा दिया’ की अपेक्षा मूल की हिंसक तीव्रता अधिक स्पष्ट है।
- source_word: אֵת כָּל חֵיל
  choice: की सारी सेना को
  rationale: חַיִל यहाँ सामूहिक सैन्य बल को सूचित करता है; आधुनिक हिंदी में ‘सारी सेना’ स्पष्ट और स्वाभाविक है।
- source_word: הֲדַדְעָזֶר
  choice: हददेजेर
  rationale: हिब्रू व्यक्तिगत नाम का हिंदी में निकट देवनागरी लिप्यंतरण।
