    text: या, “न्याय और जो उचित है।” इब्रानी युग्म “न्याय और धार्मिकता” आदर्श राजकीय शासन के लिए प्रयुक्त एक प्रचलित अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: राज किया
  rationale: यहाँ क्रिया दाऊद के राजा के रूप में शासन करने को व्यक्त करती है, केवल उसके राजा बनने को नहीं।
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल पर
  rationale: עַל शासन के क्षेत्र को और כָּל उसकी व्यापकता को दर्शाता है।
- source_word: וַיְהִי ... עֹשֶׂה
  choice: करता रहा
  rationale: וַיְהִי के साथ कृदंत निरंतर अथवा नियमित कार्य का भाव देता है; ‘करता रहा’ इस पक्ष को स्वाभाविक हिन्दी में रखता है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: राजकीय संदर्भ में यह उचित न्याय-व्यवस्था और न्यायपूर्ण शासन को सूचित करता है।
- source_word: וּצְדָקָה
  choice: धार्मिकता
  rationale: यह नैतिक खराई और उचित आचरण का भाव रखता है; ‘न्याय’ से अलग संज्ञा बनाए रखने पर इब्रानी युग्म की पूर्णता सुरक्षित रहती है।
- source_word: לְכָל עַמּוֹ
  choice: अपनी सारी प्रजा के लिए
  rationale: לְ यहाँ शासन के लाभार्थियों का बोध कराता है, और ‘अपनी प्रजा’ तृतीय पुरुष एकवचन प्रत्यय को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: राजकीय सारांश में מִשְׁפָּט וּצְדָקָה का अनुवाद
  choice: न्याय और धार्मिकता
  alternative: न्याय और जो उचित था
  rationale: दोनों संज्ञाओं को अलग रखने से आदर्श राजकीय शासन के वैधानिक और नैतिक दोनों पक्ष सुरक्षित रहते हैं; किसी एक पक्ष में दोनों को समेटा नहीं जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली। ‘प्रजा’ राजकीय संदर्भ में ‘लोगों’ से अधिक सटीक है। निरंतर क्रिया का भाव ‘करता रहा’ से व्यक्त किया गया है।
