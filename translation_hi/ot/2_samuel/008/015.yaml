  verdict: revise
  source_fidelity: The draft accurately represents David's reign over all Israel and the comprehensive scope of his people. However, “इस प्रकार” has no counterpart in the Hebrew, and “न्याय और धार्मिकता करता रहा” is not idiomatic Hindi for the royal administration denoted by the Hebrew construction.
  naturalness: “राज किया” is understandable, but “राज्य करता था” more naturally conveys ongoing reign in this summary statement. “न्याय और धार्मिकता लागू करता था” gives clear modern Hindi expression to the administrative, ongoing sense without reducing the two terms to one.
  terminology: “न्याय” appropriately renders מִשְׁפָּט. “धार्मिकता” preserves the distinction from justice, though its governing sense is best made clear by the verb “लागू करता था.” The royal term “प्रजा” is suitable in this context.
  issues:
  - severity: low
    issue: The opening phrase “इस प्रकार” is added.
    rationale: The Hebrew begins directly, “And David reigned”; it contains no inferential phrase equivalent to “इस प्रकार.”
  - severity: medium
    issue: “न्याय और धार्मिकता करता रहा” is an unnatural collocation in modern Hindi.
    rationale: In this royal context, the Hebrew describes administering or carrying out justice and righteousness. “लागू करता था” expresses this naturally and retains the durative force.
  - severity: low
    issue: The audit footnote is absent and its English anchor does not correspond to its subject.
    rationale: The note concerns the phrase “justice and righteousness,” not “all Israel.” In Hindi it should be anchored to “धार्मिकता” (or the full pair).
