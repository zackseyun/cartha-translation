  yaml_path: translation/ot/2_samuel/008/003.yaml
  text: David struck down Hadadezer son of Rehob[a], king of Zobah[c][b], when he went to restore his power at the River.
translation:
  language: hi
  text: दाऊद ने रहोब के पुत्र हददेज़ेर[a], सोबा के राजा, को पराजित किया, जब वह नदी[c] के पास अपना अधिकार फिर से स्थापित करने[b] गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘हददेज़ेर’; कुछ पाठ-परंपराओं और 1 इतिहास के समानांतर वर्णन में ‘हदरेज़ेर’ है।
    reason: textual_variant
  - marker: b
    text: इसका अनुवाद ‘अपना नियंत्रण फिर से पाने’ या ‘अपना प्रभुत्व फिर से स्थापित करने’ भी हो सकता है; शाब्दिक अर्थ है, ‘अपना हाथ फिर से स्थापित करने।’
    reason: lexical_alternative
  - marker: c
    text: संभवतः फ़रात नदी।
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּךְ
  choice: पराजित किया
  rationale: नכה युद्ध के प्रसंग में प्रहार करने और परास्त करने का भाव देता है। यहाँ ‘पराजित किया’ स्वाभाविक हिन्दी में सैन्य परिणाम व्यक्त करता है, पर यह नहीं कहता कि उसे मार डाला गया।
- source_word: הֲדַדְעֶזֶר
  choice: हददेज़ेर
  rationale: WLC के व्यंजन-पाठ और स्वरांकन के अनुसार नाम का लिप्यंतरण किया गया है; वैकल्पिक पाठ ‘हदरेज़ेर’ पादटिप्पणी में रखा गया है।
- source_word: בֶּן־רְחֹב
  choice: रहोब के पुत्र
  rationale: इब्रानी पितृनाम-संबंध को आधुनिक और स्पष्ट हिन्दी में सीधे व्यक्त करता है।
- source_word: מֶלֶךְ צוֹבָה
  choice: सोबा के राजा
  rationale: सम्बद्ध संज्ञा-रचना का सीधा अनुवाद है; स्थाननाम का लिप्यंतरण किया गया है।
- source_word: בְּלֶכְתּוֹ
  choice: जब वह ... गया था
  rationale: בְּ के साथ infinitive construct यहाँ कालगत परिस्थिति बताता है। हिन्दी वाक्य में ‘जब वह ... गया था’ यह संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְהָשִׁיב
  choice: फिर से स्थापित करने
  rationale: שׁוב के हिफ़ील रूप में लौटाने, बहाल करने या पुनः स्थापित करने का अर्थ है। यह चयन राजनीतिक-सैन्य प्रसंग के अनुकूल है और पुनर्स्थापना का भाव बनाए रखता है।
- source_word: יָדוֹ
  choice: अपना अधिकार
  rationale: शाब्दिक अर्थ ‘अपना हाथ’ है, पर इस प्रसंग में ‘हाथ’ सामर्थ्य, नियंत्रण या प्रभुत्व का मुहावरा है। ‘अधिकार’ पठनीय है और अत्यधिक विशिष्ट व्याख्या से बचता है।
- source_word: בַּנְּהַר
  choice: नदी के पास
  rationale: נהר यहाँ निश्चित अर्थ में प्रयुक्त है और संभवतः फ़रात को सूचित करता है। मुख्य पाठ सामान्य ‘नदी’ रखता है; संभावित पहचान पादटिप्पणी में दी गई है।
