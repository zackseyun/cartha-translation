- source_word: הַמֶּלֶךְ דָּוִד
  choice: राजा दाऊद
  rationale: उपाधि और नाम का यह क्रम स्वाभाविक मानक हिंदी है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: यह इब्रानी शब्द ताँबा या काँसा दोनों को सूचित कर सकता है। मंदिर की वस्तुओं से जुड़े समानांतर प्रसंग में ‘काँसा’ उपयुक्त पारंपरिक अर्थ है; वास्तविक शब्दगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: הַרְבֵּה מְאֹד
  choice: बहुत ही अधिक
  rationale: दोहरी परिमाणात्मक तीव्रता को सरल, वर्तमान हिंदी में बलपूर्वक व्यक्त करता है।
