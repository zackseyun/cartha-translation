  text: And from Betah and from Berothai[a], cities of Hadadezer[c][b], King David took very much bronze.
translation:
  language: hi
  text: और हददेजेर के नगरों, बेतह और बेरोतै[a][b], से राजा दाऊद ने बहुत अधिक काँसा[c] लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 इतिहास 18:8 के समानांतर वृत्तांत में इन स्थानों के नाम तिभहत और कून हैं; यहाँ के इब्रानी पाठ में बेतह और बेरोतै हैं।
    reason: cross_reference
  - marker: b
    text: या “बेरोताह”; कुछ अनुवादों में संबंधित स्थान-नाम के रूप के आधार पर यह रूप मिलता है।
    reason: lexical_alternative
  - marker: c
    text: या “ताँबा”; इब्रानी शब्द प्रसंग के अनुसार ताँबे या काँसे के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
