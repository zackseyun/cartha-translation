- source_word: וּמִבֵּרֹתַי
  choice: और बेरोतै से
  rationale: स्थान-नाम को इसी पद के इब्रानी रूप के निकट लिप्यंतरित किया गया है; समानांतर वृत्तांत का भिन्न नाम पादटिप्पणी में दिया गया है।
- source_word: עָרֵי הֲדַדְעָזֶר
  choice: हददेजेर के नगरों
  rationale: सम्बन्धवाचक रचना इन नगरों का हददेजेर से स्वामित्व या अधीनता का संबंध दिखाती है। हिंदी में इसे दोनों नगर-नामों से पहले रखना स्वाभाविक है।
- source_word: לָקַח
