  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। कठिन इब्रानी पद को मुख्य पाठ में लिप्यंतरित करके उसकी वास्तविक अस्पष्टता सुरक्षित रखी गई है और आवश्यक व्याख्या पादटिप्पणी में दी गई है।
