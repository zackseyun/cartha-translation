  text: וַֽ/יְהִי֙ אַֽחֲרֵי כֵ֔ן וַ/יַּ֥ךְ דָּוִ֛ד אֶת פְּלִשְׁתִּ֖ים וַ/יַּכְנִיעֵ֑/ם וַ/יִּקַּ֥ח דָּוִ֛ד אֶת מֶ֥תֶג הָ/אַמָּ֖ה מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/001.yaml
  text: And after this[a], David struck the Philistines and subdued them, and David took Metheg-ammah from the hand of the Philistines.
translation:
  language: hi
  text: इसके बाद दाऊद ने पलिश्तियों पर प्रहार किया और उन्हें अपने अधीन कर लिया। दाऊद ने पलिश्तियों के हाथ से मेतेग-हाअम्मा[a] ले लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पद का शाब्दिक अर्थ ‘माता-नगर की लगाम’ है; इसका अर्थ निश्चित नहीं है। संभव है कि यह प्रधान नगर पर नियंत्रण का मुहावरा हो। तुलना करें 1 इतिहास 18:1, जहाँ ‘गत और उसके अधीनस्थ नगर’ लिखा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह वाक्यांश कथा में अगले घटनाक्रम का समय-संक्रमण बताता है। ‘इसके बाद’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से शब्दशः ‘और ऐसा हुआ’ नहीं जोड़ता।
- source_word: וַיַּךְ
  choice: प्रहार किया
  rationale: נכה का मूल भाव ‘मारना/प्रहार करना’ है और सैन्य प्रसंग में पराजित करना भी सूचित कर सकता है। ‘प्रहार किया’ ठोस क्रियात्मक भाव बनाए रखता है, जबकि अगली क्रिया परिणाम स्पष्ट करती है।
- source_word: פְּלִשְׁתִּים
  choice: पलिश्ती
  rationale: इस जनसमूह के नाम का प्रचलित हिन्दी रूप।
- source_word: וַיַּכְנִיעֵם
  choice: उन्हें अपने अधीन कर लिया
  rationale: हिफ़ील रूप का अर्थ दबाना या अधीनता में लाना है। यह हिन्दी अभिव्यक्ति सैन्य और राजनीतिक परिणाम दोनों को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: וַיִּקַּח
  choice: ले लिया
  rationale: לקח की सामान्य और व्यापक क्रिया ‘लेना’ है। इससे कठिन कर्म-पद की व्याख्या मुख्य पाठ में पहले से निश्चित नहीं होती।
- source_word: מֶתֶג הָאַמָּה
  choice: मेतेग-हाअम्मा
  rationale: यह अत्यंत कठिन और संभवतः मुहावरेदार पद है। इसे नाम के रूप में लिप्यंतरित करने से अनिश्चित अर्थ को मुख्य पाठ में ‘प्रधान नगर’ या किसी अन्य निश्चित व्याख्या से नहीं बाँधा जाता; शाब्दिक अर्थ और संभावित आशय पादटिप्पणी में दिए गए हैं।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: इब्रानी मुहावरे का शाब्दिक चित्र बनाए रखता है और हिन्दी में अधिकार अथवा नियंत्रण से छुड़ाकर लेने के अर्थ में समझ में आता है।
