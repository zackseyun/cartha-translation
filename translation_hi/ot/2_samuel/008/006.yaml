  text: וַ/יָּ֨שֶׂם דָּוִ֤ד נְצִבִים֙ בַּ/אֲרַ֣ם דַּמֶּ֔שֶׂק וַ/תְּהִ֤י אֲרָם֙ לְ/דָוִ֔ד לַ/עֲבָדִ֖ים נוֹשְׂאֵ֣י מִנְחָ֑ה וַ/יֹּ֤שַׁע יְהוָה֙ אֶת דָּוִ֔ד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/006.yaml
  text: And David placed garrisons in Aram of Damascus[a], and Aram became servants to David, bringing tribute[c][b]. And Yahweh gave David victory wherever he went.
translation:
  language: hi
  text: दाऊद ने दमिश्क के अराम में सैनिक चौकियाँ[a] स्थापित कीं। तब अराम दाऊद की सेवा में आ गया और कर[b] पहुँचाने लगा। दाऊद जहाँ कहीं गया, वहाँ याहवे ने उसे विजय दिलाई[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रतिनिधि अधिकारी” अथवा “तैनात सैनिक दल।” इब्रानी शब्द दोनों प्रकार के प्रशासनिक-सैनिक नियंत्रण का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “भेंट।” इब्रानी शब्द का अर्थ भेंट, चढ़ावा या कर हो सकता है; यहाँ आश्रित राज्य द्वारा दिया जाने वाला कर अभिप्रेत जान पड़ता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “याहवे ने दाऊद को बचाया/छुड़ाया।” सैन्य संदर्भ में इसका भाव उसे विजय दिलाना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: स्थापित कीं
  rationale: שׂים का मूल अर्थ ‘रखना/स्थापित करना’ है; सैनिक चौकियों के साथ ‘स्थापित कीं’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: נְצִבִים
  choice: सैनिक चौकियाँ
  rationale: विजय और क्षेत्रीय नियंत्रण के इस प्रसंग में यह शब्द तैनात सैनिक दलों अथवा उनकी चौकियों की ओर संकेत करता है। शब्द में अधिकारियों/प्रतिनिधियों की सम्भावना भी है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: בַּאֲרַם דַּמֶּשֶׂק
  choice: दमिश्क के अराम में
  rationale: अֲרָם को पारंपरिक ‘सीरिया’ से बदलने के बजाय स्रोत के जातीय-भौगोलिक नाम ‘अराम’ के रूप में रखा गया है; पूरा पदबंध दमिश्क-केंद्रित अरामी राज्य को दर्शाता है।
- source_word: וַתְּהִי אֲרָם לְדָוִד לַעֲבָדִים
  choice: अराम दाऊद का सेवक बन गया
  rationale: यहाँ राष्ट्रीय अधीनता व्यक्त होती है। ‘सेवक’ עֲבָדִים से सीधा संबंध बनाए रखता है, जबकि संदर्भ स्पष्ट करता है कि बात राजनीतिक अधीनता की है।
- source_word: נוֹשְׂאֵי מִנְחָה
  choice: कर लाने लगा
  rationale: מִנְחָה का अर्थ भेंट, चढ़ावा या कर हो सकता है; विजित आश्रित राज्य के प्रसंग में नियमित कर सर्वाधिक संभावित है।
- source_word: וַיֹּשַׁע
  choice: विजय दिलाई
  rationale: ישׁע के हिफ़ील रूप का मूल भाव बचाना/छुड़ाना है; सैन्य प्रसंग में ‘विजय दिलाई’ उसका सहज अर्थ व्यक्त करता है, और अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में रखा गया है।
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: जहाँ कहीं गया, वहाँ
  rationale: इब्रानी मुहावरे की व्यापकता को सहज आधुनिक हिन्दी में व्यक्त करता है और उसे केवल सैन्य कूच तक सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: राजनीतिक संदर्भ में עֲבָדִים
  choice: सेवक
  alternative: अधीन; दास
  rationale: ‘सेवक’ मूल शब्द की रूपकात्मक राजनीतिक भाषा को बनाए रखता है। ‘अधीन’ अधिक व्याख्यात्मक है और ‘दास’ आधुनिक पाठक को व्यक्तिगत गुलामी का अनावश्यक रूप से संकीर्ण संकेत दे सकता है।
- issue: וַיֹּשַׁע में उद्धार और सैन्य विजय का संबंध
  choice: विजय दिलाई
  alternative: बचाया/छुड़ाया
  rationale: युद्ध-विजयों के निकट संदर्भ में परिणाम ‘विजय’ है, पर क्रिया का मूल उद्धारकारी भाव पादटिप्पणी में रखा गया है ताकि धार्मिक तनाव न मिटे।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘अराम’ और ‘याहवे’ जैसे स्रोत-समीप नाम सुरक्षित हैं। राजनीतिक अधीनता, कर और ईश्वरीय उद्धार-विजय के अर्थों को स्पष्ट रखते हुए संभावित वैकल्पिक अर्थ पादटिप्पणियों में दिए गए हैं।
