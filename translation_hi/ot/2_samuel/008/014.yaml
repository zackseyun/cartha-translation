  edition: WLC
  text: וַ/יָּ֨שֶׂם בֶּ/אֱד֜וֹם נְצִבִ֗ים בְּ/כָל אֱדוֹם֙ שָׂ֣ם נְצִבִ֔ים וַ/יְהִ֥י כָל אֱד֖וֹם עֲבָדִ֣ים לְ/דָוִ֑ד וַ/יּ֤וֹשַׁע יְהוָה֙ אֶת דָּוִ֔ד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/014.yaml
  text: He placed garrisons in Edom[a]; throughout all Edom he placed garrisons, and all Edom became servants to David[b]. And Yahweh gave David victory wherever he went.
translation:
  language: hi
  text: उसने एदोम में सैनिक चौकियाँ[a] स्थापित कीं; पूरे एदोम में उसने सैनिक चौकियाँ स्थापित कीं, और सारा एदोम दाऊद के अधीन सेवक बन गया। जहाँ कहीं भी वह गया, वहाँ याहवे ने दाऊद को विजय दी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अधिकारी” अथवा “राज्यपाल।” इब्रानी शब्द का अर्थ यहाँ तैनात सैन्य दलों, उनकी चौकियों या नियुक्त अधिकारियों से हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “याहवे ने दाऊद को जहाँ कहीं वह गया, बचाया/छुड़ाया।” इस सैन्य संदर्भ में उसी क्रिया का भाव “विजय दी” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם / שָׂם
  choice: स्थापित कीं
  rationale: שׂים का मूल अर्थ ‘रखना/स्थापित करना’ है। सैनिक चौकियों के संदर्भ में ‘स्थापित कीं’ स्वाभाविक है और क्रिया को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाता।
- source_word: נְצִבִים
  choice: सैनिक चौकियाँ
  rationale: विजय और क्षेत्रीय नियंत्रण के इस संदर्भ में यह पद तैनात सैन्य दलों अथवा उनके ठिकानों का संकेत देता है। ‘सैनिक चौकियाँ’ आधुनिक हिन्दी में संभावित सैन्य अर्थ स्पष्ट करता है; ‘अधिकारी/राज्यपाल’ भी सम्भव है, इसलिए पादटिप्पणी दी गई है।
- source_word: בֶּאֱדוֹם / בְּכָל אֱדוֹם
  choice: एदोम में / पूरे एदोम में
  rationale: ב स्थान सूचित करता है और בְכָל पूरे क्षेत्र में व्यापक स्थापना का भाव देता है।
- source_word: וַיְהִי כָל אֱדוֹם עֲבָדִים לְדָוִד
  choice: सारा एदोम दाऊद के अधीन सेवक बन गया
  rationale: ‘सारा एदोम’ राष्ट्र के लोगों के लिए सामूहिक प्रयोग है। עֲבָדִים राजनीतिक पराधीनता अथवा दासत्व दोनों व्यक्त कर सकता है; इस विजय-वर्णन में ‘अधीन सेवक’ पराधीनता का बल बनाए रखता है, बिना आधुनिक निजी दासत्व की संकीर्ण धारणा थोपे।
- source_word: וַיּוֹשַׁע
  choice: विजय दी
  rationale: ישׁע के हिफ़ील रूप का अर्थ ‘बचाना/छुड़ाना/विजय देना’ हो सकता है। सैन्य सारांश में ‘विजय दी’ प्रसंगानुकूल और स्वाभाविक है, जबकि वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; हिन्दी में उसका लिप्यंतरण ‘याहवे’ किया गया है, न कि उसकी जगह कोई उपाधि रखी गई है।
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: जहाँ कहीं वह गया
  rationale: यह इब्रानी मुहावरा दाऊद की गतिविधियों में सर्वत्र सफलता व्यक्त करता है। यह हिन्दी रूप स्वाभाविक है और ‘कूच किया’ जैसा अतिरिक्त सैन्य अर्थ नहीं जोड़ता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि से नहीं बदलता।
- issue: עֲבָדִים में दासत्व और राजनीतिक अधीनता का संबंध
  choice: अधीन सेवक
  alternative: दास / प्रजा
  rationale: विजित राष्ट्र के संदर्भ में पद कठोर पराधीनता व्यक्त करता है, पर यह अनिवार्य रूप से प्रत्येक एदोमी की निजी दासता का विवरण नहीं देता। ‘अधीन सेवक’ राजनीतिक अधीनता और सेवा दोनों को बनाए रखता है।
- issue: וַיּוֹשַׁע में उद्धार और सैन्य विजय
  choice: विजय दी
  alternative: बचाया / छुड़ाया
  rationale: इस अध्याय का सैन्य संदर्भ विजय के अर्थ को प्रमुख बनाता है, फिर भी मूल क्रिया के उद्धार-संबंधी अर्थ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। इब्रानी की पुनरावृत्ति (‘एदोम में… पूरे एदोम में’) को बलाघात के लिए बनाए रखा गया है। ‘सारा एदोम’ राष्ट्र के लिए सामूहिक अभिव्यक्ति के रूप में सुरक्षित है।
