base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/011.yaml
  text: King David also dedicated them to Yahweh[b][a], along with the silver and the gold that he had dedicated from all the nations that he had subdued.
translation:
  language: hi
  text: राजा दाऊद ने उन्हें भी[b] यहोवा को उस चाँदी और सोने के साथ अर्पित कर दिया, जो उसने उन सभी जातियों में से अर्पित किया था जिन्हें उसने अपने अधीन किया था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जीत लिया था।” इब्रानी क्रिया बलपूर्वक लोगों को अपने नियंत्रण में लाने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: “उन्हें” से पिछली आयत में बताई गई वस्तुएँ अभिप्रेत हैं।
    reason: cross_reference
lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: यह अव्यय पिछले पद में बताई गई वस्तुओं को पहले से अर्पित धन-संपत्ति के साथ जोड़ता है।
- source_word: אֹתָם
  choice: उन्हें
  rationale: इब्रानी सर्वनाम पिछली आयत में उल्लिखित वस्तुओं की ओर संकेत करता है; मुख्य पाठ में उसकी सामान्यता बनाए रखी गई है।
- source_word: הִקְדִּישׁ
  choice: अर्पित कर दिया
  rationale: यह परमेश्वर के लिए अलग करके समर्पित करने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַמֶּלֶךְ דָּוִד
  choice: राजा दाऊद
  rationale: उपाधि और नाम का मानक तथा स्वाभाविक हिन्दी क्रम।
- source_word: לַיהוָה
  choice: यहोवा को
  rationale: मूल पाठ में आए व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी के प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: עִם הַכֶּסֶף וְהַזָּהָב
  choice: उस चाँदी और सोने के साथ
  rationale: עִם का सहचारी संबंध और निश्चित बहुमूल्य धातुओं का संकेत स्पष्ट रहता है।
- source_word: מִכָּל הַגּוֹיִם
  choice: उन सभी जातियों से
  rationale: מִן स्रोत को और גּוֹיִם यहाँ राजनीतिक-जातीय समुदायों को सूचित करता है।
- source_word: אֲשֶׁר כִּבֵּשׁ
  choice: जिन्हें उसने अपने अधीन कर लिया था
  rationale: כּבש का बलपूर्वक नियंत्रण में लाने का अर्थ सुरक्षित रहता है, बिना स्थायी विलय का अर्थ अनिवार्य किए।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल का व्यक्तिगत वाचा-नाम सामान्य उपाधि से नहीं बदला गया; ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है।
- issue: כִּבֵּשׁ की सैन्य-राजनीतिक शक्ति
  choice: अपने अधीन कर लिया था
  alternative: जीत लिया था
  rationale: चुना हुआ रूप नियंत्रण स्थापित करने का अर्थ देता है और क्रिया में निहित बलपूर्वक वश में करने के भाव को पादटिप्पणी में स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। लम्बे इब्रानी वाक्य को हिन्दी में दो वाक्यों में बाँटा गया है, जबकि संबंध और पूर्वकालिकता सुरक्षित हैं।
