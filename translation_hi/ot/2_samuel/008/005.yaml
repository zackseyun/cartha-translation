  text: और दमिश्क का अराम[a] सोबा के राजा हददेजेर[b] की सहायता करने आया, और दाऊद ने अराम के बाईस हज़ार पुरुषों को मार गिराया।
  philosophy: optimal-equivalence
  footnotes:
