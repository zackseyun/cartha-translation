    text: इब्रानी אֲרַם का अनुवाद पारंपरिक ‘सीरिया’ के बजाय ‘अराम’ किया गया है; यहाँ यह दमिश्क-केंद्रित अरामी राज्य को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: कुछ बाइबलीय स्थलों और अनुवादों में हददेजेर नाम का रूप ‘हदरेजेर’ मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּבֹא
  choice: आया
  rationale: कथात्मक क्रम में בוא के इस रूप का स्वाभाविक हिन्दी अनुवाद ‘आया’ है; कर्ता ‘अराम’ को एक राज्य/समुदाय के रूप में एकवचन माना गया है।
- source_word: אֲרַם דַּמֶּשֶׂק
  choice: दमिश्क का अराम
  rationale: यह पद दमिश्क-केंद्रित अरामी राज्य या समुदाय को सूचित करता है। ‘अराम’ मूल नाम सुरक्षित रखता है और बाद के भू-राजनीतिक नाम ‘सीरिया’ को आरोपित नहीं करता।
- source_word: לַעְזֹר
  choice: की सहायता करने
  rationale: עזר का सीधा अर्थ सहायता करना है; यह आधुनिक मानक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: לַהֲדַדְעֶזֶר
  choice: हददेजेर
  rationale: यहाँ के इब्रानी रूप הֲדַדְעֶזֶר का निकट देवनागरी लिप्यंतरण है; दूसरे स्थलों पर मिलने वाले वैकल्पिक रूप को पादटिप्पणी में रखा गया है।
- source_word: מֶלֶךְ צוֹבָה
  choice: सोबा के राजा
  rationale: इब्रानी संबंध-रचना का स्वाभाविक हिन्दी रूप है और यह हददेजेर की उपाधि बताता है।
- source_word: וַיַּךְ
  choice: मार गिराया
  rationale: सैन्य प्रसंग में נכה प्राणघातक प्रहार या युद्ध में मार डालने का संकेत दे सकता है। ‘मार गिराया’ क्रिया की शक्ति बनाए रखता है, जबकि केवल ‘हराया’ से अधिक सटीक है।
- source_word: בַּאֲרָם
  choice: अराम के
  rationale: נכה के साथ ב यहाँ उस समुदाय को चिह्नित करता है जिसके लोगों पर दाऊद ने प्रहार किया। आगे ‘पुरुषों’ की संख्या होने के कारण ‘अराम के’ स्वाभाविक हिन्दी है।
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף אִישׁ
  choice: बाईस हज़ार पुरुषों
  rationale: मूल में אִישׁ स्पष्ट रूप से ‘पुरुष’ है। ‘सैनिक’ प्रसंगानुकूल होने पर भी मूल से अधिक व्याख्यात्मक होता।
