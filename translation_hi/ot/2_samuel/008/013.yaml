    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעַשׂ ... שֵׁם
  choice: अपने लिए नाम कमाया
  rationale: हिब्रू मुहावरे का अर्थ यश या प्रतिष्ठा प्राप्त करना है। आधुनिक हिन्दी में ‘नाम कमाया’ स्वाभाविक है और मूल रूपक को भी बनाए रखता है।
- source_word: בְּשֻׁבוֹ
  choice: जब ... लौटा
  rationale: पूर्वसर्ग सहित infinitive construct यहाँ समय-संबंध व्यक्त करता है; हिन्दी में यह संरचना स्पष्ट और सहज है।
- source_word: מֵהַכּוֹתוֹ
  choice: मारकर
  rationale: נכה का युद्ध-संदर्भ में अर्थ प्रहार करके मार गिराना है। यह अनुवाद क्रिया की तीव्रता रखता है, जबकि युद्ध की अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: אֶת אֲרָם
  choice: अराम
  rationale: मुख्य पाठ WLC के मासोरेटिक पाठ ‘अराम’ का अनुसरण करता है; बाद के भूराजनीतिक नाम ‘सीरिया’ से बचा गया है।
- source_word: בְּגֵיא מֶלַח
  choice: नमक की घाटी में
  rationale: स्थान-नाम का सीधा, सुबोध हिन्दी रूप।
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: अठारह हज़ार सैनिकों
  rationale: हिब्रू में संख्या के बाद संज्ञा नहीं है। युद्ध-संदर्भ के अनुसार ‘सैनिकों’ की पूर्ति हिन्दी में अर्थ स्पष्ट करती है, पर संख्या को हताहतों तक सीमित समझने की हल्की व्याख्या भी जोड़ती है।
theological_decisions:
- issue: पराजित शत्रु की पहचान
  choice: मुख्य पाठ में ‘अराम’
  alternative: ‘एदोम’
  rationale: WLC के मासोरेटिक पाठ में ‘अराम’ है, इसलिए मूल-पाठ की प्राथमिकता के अनुसार वही मुख्य पंक्ति में रखा गया है। किंतु कुछ प्राचीन पाठ-साक्ष्य, 1 इतिहास 18:12 का समानांतर वर्णन और नमक की घाटी का संदर्भ ‘एदोम’ की ओर संकेत करते हैं; इसलिए इस महत्त्वपूर्ण पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘नाम कमाया’ सामान्य पाठक के लिए स्वाभाविक है और हिब्रू मुहावरे को सुरक्षित रखता है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में उपस्थित है।
