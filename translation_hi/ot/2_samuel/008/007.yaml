    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: ले लीं
  rationale: कथात्मक संदर्भ में לקח का सामान्य अर्थ ‘लेना’ है। स्त्रीलिंग बहुवचन ‘ढालें’ के अनुसार ‘ले लीं’ स्वाभाविक है और अनावश्यक रूप से ‘छीनना’ या ‘कब्ज़ा करना’ नहीं जोड़ता।
- source_word: שִׁלְטֵי הַזָּהָב
  choice: सोने की वे ढालें
  rationale: पारंपरिक और प्रसंगानुकूल अर्थ ‘ढालें’ है; ‘सोने की’ इब्रानी संबंध-रचना को सहज आधुनिक हिन्दी में व्यक्त करता है। ‘तरकश’ एक अल्पमत lexical प्रस्ताव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: אֲשֶׁר הָיוּ אֶל
  choice: जो ... के पास थीं
  rationale: इब्रानी वाक्यांश अधिकार या संबद्धता व्यक्त कर सकता है। ‘के पास थीं’ मूल की अपेक्षाकृत शाब्दिक अस्पष्टता बनाए रखता है और पूर्ण स्वामित्व का दावा नहीं करता।
- source_word: עַבְדֵי הֲדַדְעָזֶר
  choice: हददेजेर के सेवकों
  rationale: עבדים इस प्रसंग में राजा के अधीन सेवकों या राजकीय अनुचरों को सूचित करता है; ‘सेवक’ आधुनिक हिन्दी में पर्याप्त व्यापक और तटस्थ है।
- source_word: וַיְבִיאֵם
  choice: और उन्हें ... ले आया
  rationale: हिफ़िल रूप का अर्थ ‘ले आना’ है; ‘उन्हें’ का संकेत ढालों की ओर है।
- source_word: יְרוּשָׁלִָם
  choice: यरूशलेम
  rationale: स्थान-नाम का प्रचलित हिन्दी रूप।
