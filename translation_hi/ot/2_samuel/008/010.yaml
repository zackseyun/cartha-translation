  text: וַ/יִּשְׁלַ֣ח תֹּ֣עִי אֶת יֽוֹרָם בְּנ֣/וֹ אֶל הַ/מֶּֽלֶךְ דָּ֠וִד לִ/שְׁאָל ל֨/וֹ לְ/שָׁל֜וֹם וּֽ/לְ/בָרֲכ֗/וֹ עַל֩ אֲשֶׁ֨ר נִלְחַ֤ם בַּ/הֲדַדְעֶ֨זֶר֙ וַ/יַּכֵּ֔/הוּ כִּי אִ֛ישׁ מִלְחֲמ֥וֹת תֹּ֖עִי הָיָ֣ה הֲדַדְעָ֑זֶר וּ/בְ/יָד֗/וֹ הָי֛וּ כְּלֵֽי כֶ֥סֶף וּ/כְלֵֽי זָהָ֖ב וּ/כְלֵ֥י נְחֹֽשֶׁת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/010.yaml
  text: Then Toi sent Joram his son to King David to ask about his welfare and to bless him because he had fought against Hadadezer and struck him down[a], for Hadadezer had been at war with Toi; and in his hand were articles of silver, articles of gold[b], and articles of bronze.
translation:
  language: hi
  text: तब तोई ने अपने पुत्र योराम को राजा दाऊद के पास उनका कुशल-मंगल पूछने और उन्हें आशीर्वाद देने के लिए भेजा, क्योंकि दाऊद ने हददएजेर से युद्ध करके उसे पराजित किया था; हददएजेर तोई से युद्ध करता था। योराम अपने साथ चाँदी, सोने और काँसे की वस्तुएँ लाया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: तब ... भेजा
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक क्रमसूचक है।
- source_word: תֹּעִי
  choice: तोई
  rationale: शमूएल के इब्रानी रूप का देवनागरी लिप्यंतरण।
- source_word: יֽוֹרָם בְּנוֹ
  choice: अपने पुत्र योराम को
  rationale: इब्रानी संबंध को स्पष्ट और स्वाभाविक हिन्दी पदक्रम में व्यक्त करता है।
- source_word: לִשְׁאָל לוֹ לְשָׁלוֹם
  choice: उनका कुशल-मंगल पूछने
  rationale: ‘शांति/कुशलता पूछने’ के इब्रानी मुहावरे का सहज हिन्दी समतुल्य।
- source_word: וּלְבָרֲכוֹ
  choice: और उन्हें आशीर्वाद देने
  rationale: ברך का सीधा अर्थ सुरक्षित है; राजनयिक संदर्भ में बधाई का भाव भी निहित हो सकता है।
- source_word: עַל אֲשֶׁר נִלְחַם בַּהֲדַדְעֶזֶר וַיַּכֵּהוּ
  choice: क्योंकि दाऊद ने हददएजेर से युद्ध करके उसे पराजित किया था
  rationale: सर्वनाम का संदर्भ हिन्दी में ‘दाऊद’ से स्पष्ट किया गया; נכה का सैन्य संदर्भ में स्वाभाविक अर्थ ‘पराजित किया’ है।
- source_word: כִּי אִישׁ מִלְחֲמוֹת תֹּעִי הָיָה הֲדַדְעָזֶר
  choice: हददएजेर तोई से युद्ध करता रहता था
  rationale: संक्षिप्त इब्रानी मुहावरे ‘तोई के साथ युद्धों का पुरुष’ को सतत शत्रुता के स्वाभाविक हिन्दी रूप में व्यक्त करता है।
- source_word: וּבְיָדוֹ הָיוּ
  choice: योराम अपने साथ ... लाया था
  rationale: शाब्दिक ‘उसके हाथ में थे’ का प्रसंगगत आशय है कि दूत वस्तुएँ साथ लेकर आया; कर्ता को स्पष्ट किया गया है।
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב וּכְלֵי נְחֹשֶׁת
  choice: चाँदी, सोने और काँसे की वस्तुएँ
  rationale: כְּלִי व्यापक शब्द है; ‘वस्तुएँ’ पात्र, उपकरण या अन्य निर्मित चीज़ों के बीच अनावश्यक संकीर्णता से बचता है।
