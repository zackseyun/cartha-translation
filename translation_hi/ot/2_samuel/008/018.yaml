source:
  edition: WLC
  text: וּ/בְנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע וְ/הַ/כְּרֵתִ֖י וְ/הַ/פְּלֵתִ֑י וּ/בְנֵ֥י דָוִ֖ד כֹּהֲנִ֥ים הָיֽוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/018.yaml
  text: Benaiah son of Jehoiada was over the Kerethites and the Pelethites, and David’s sons were priests.[a]
translation:
  language: hi
  text: और यहोयादा का पुत्र बनायाह करेती और पलेती लोगों का प्रधान था, और दाऊद के पुत्र याजक थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुख्य मंत्री” अथवा “राजकीय अधिकारी।” इब्रानी शब्द सामान्यतः “याजक” के लिए प्रयुक्त होता है, लेकिन राजकीय प्रशासन के इस संदर्भ के कारण कुछ लोग यहाँ इसका व्यापक दरबारी अर्थ समझते हैं।
    reason: वैकल्पिक अर्थ को दर्ज करते हुए मुख्य पाठ में इब्रानी का सामान्य अर्थ और उससे उत्पन्न तनाव सुरक्षित रखना।
lexical_decisions:
- source_word: וּבְנָיָהוּ בֶּן יְהוֹיָדָע
  choice: यहोयादा का पुत्र बनायाह
  rationale: व्यक्तिगत नामों का अनुवाद करने के बजाय प्रचलित हिंदी बाइबलीय रूपों में लिप्यंतरण किया गया है।
- source_word: וְהַכְּרֵתִי וְהַפְּלֵתִי
  choice: करेती और पलेती लोग
  rationale: इन परस्पर संबद्ध समूह-संज्ञाओं को उनकी जातीय या सैनिक पहचान अधिक निश्चित किए बिना इब्रानी के निकट लिप्यंतरित किया गया है।
- source_word: כֹּהֲנִים
  choice: याजक
  rationale: यह इब्रानी शब्द का सामान्य और सीधा अर्थ है। राजकीय प्रशासन के इस संदर्भ में ‘मुख्य मंत्री’ या ‘राजकीय अधिकारी’ अर्थ संभव माना गया है, पर उसे मुख्य पाठ में रखकर मूल की धार्मिक-ऐतिहासिक कठिनाई को समाप्त नहीं किया गया।
- source_word: הָיוּ
  choice: थे
  rationale: היה के सामान्य संबंधसूचक अर्थ को स्वाभाविक हिंदी में ‘थे’ से व्यक्त किया गया है; ‘के रूप में सेवा करते थे’ अधिक व्याख्यात्मक होता।
- source_word: וּבְנָיָהוּ ... וְהַכְּרֵתִי וְהַפְּלֵתִי
  choice: बनायाह ... करेती और पलेती लोगों का प्रधान था
  rationale: मसोरेटिक पाठ में पदसूचक क्रिया स्पष्ट रूप से नहीं दी गई है, किंतु पूर्ववर्ती प्रशासनिक सूची और समानांतर पाठ के आधार पर संबंध को स्वाभाविक हिंदी में ‘का प्रधान था’ से व्यक्त किया गया है।
theological_decisions:
- issue: दाऊद के पुत्रों के लिए כֹּהֲנִים का अर्थ
  choice: मुख्य पाठ में ‘याजक’
  alternative: ‘मुख्य मंत्री’ या ‘राजकीय अधिकारी’
  rationale: ‘याजक’ शब्द मूल इब्रानी का सामान्य अर्थ सुरक्षित रखता है, भले ही दाऊद के पुत्रों की भूमिका के विषय में ऐतिहासिक और धार्मिक तनाव उत्पन्न हो। संभावित दरबारी अर्थ को पादटिप्पणी में दिया गया है ताकि अनुवाद उस तनाव को चुपचाप न सुलझाए।
- issue: बनायाह और करेती-पलेती समूहों के बीच संबंध
  choice: ‘का प्रधान था’
  alternative: 'अधिक शाब्दिक संयोजन: ‘बनायाह ... और करेती और पलेती’'
  rationale: इब्रानी की संक्षिप्त सूची में संबंधसूचक पद लुप्त है। संदर्भ बनायाह की इन अंगरक्षक टुकड़ियों पर अधिकारपूर्ण भूमिका दर्शाता है; इसलिए हिंदी में आवश्यक पूर्ति की गई है, बिना उनकी सटीक सैन्य संरचना तय किए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण हिंदी में रखी गई है। ‘याजक’ हिंदी बाइबलीय प्रयोग में परिचित है। करेती और पलेती को अनिश्चित समूह-संज्ञाओं के रूप में लिप्यंतरित किया गया है। पादटिप्पणी का चिह्न [a] मुख्य पाठ में उपस्थित है।
