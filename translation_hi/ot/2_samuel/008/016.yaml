  text: וְ/יוֹאָ֥ב בֶּן צְרוּיָ֖ה עַל הַ/צָּבָ֑א וִ/יהוֹשָׁפָ֥ט בֶּן אֲחִיל֖וּד מַזְכִּֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/016.yaml
  text: And Joab son of Zeruiah was over the army[b][a], and Jehoshaphat son of Ahilud was recorder.
translation:
  language: hi
  text: और सरूयाह का पुत्र योआब सेना का प्रभारी था[a], और अहीलूद का पुत्र यहोशापात राजकीय अभिलेख-अधिकारी था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सेना की कमान संभालता था।”
    reason: lexical_alternative
  - marker: b
    text: यह राजदरबार का एक अधिकारी था, जो अभिलेख रखने और आवश्यक विषय राजा के सामने प्रस्तुत करने का काम करता था; इसके लिए “राजकीय सचिव” या “वृत्तांत-अधिकारी” भी कहा जा सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: עַל הַצָּבָא
  choice: सेना का प्रभारी था
  rationale: पदाधिकारियों की इस सूची में עַל अधिकार और देखरेख का भाव व्यक्त करता है। यह अनुवाद इब्रानी संरचना के निकट रहते हुए आधुनिक हिन्दी में स्वाभाविक है और औपचारिक पदनाम ‘सेनापति’ से अधिक व्यापक मूल अभिव्यक्ति को अनावश्यक रूप से सीमित नहीं करता।
- source_word: מַזְכִּיר
  choice: राजकीय अभिलेख-अधिकारी
  rationale: यह राजदरबार के ऐसे अधिकारी का पदनाम है जो अभिलेख रखने और राजा के सामने विषय प्रस्तुत करने से जुड़ा था। ‘राजकीय अभिलेख-अधिकारी’ आधुनिक पाठक के लिए स्पष्ट है और ‘सचिव’ के आज के व्यापक अर्थ अथवा ‘इतिहासकार’ के लेखक-संबंधी अर्थ से बचता है।
- source_word: בֶּן
  choice: का पुत्र
  rationale: वंशपरक पहचान में בֶּן का सीधा और स्वाभाविक हिन्दी रूप ‘का पुत्र’ है; इससे सूची की औपचारिक शैली बनी रहती है।
- source_word: וְ / וִ
  choice: और
  rationale: उपसर्गयुक्त समुच्चयबोधक पदाधिकारियों को साधारण सूचीबद्ध ढंग से जोड़ता है; ‘और’ इब्रानी की समानांतर रचना को सुरक्षित रखता है।
- source_word: יוֹאָב / צְרוּיָה / יְהוֹשָׁפָט / אֲחִילוּד
  choice: योआब / सरूयाह / यहोशापात / अहीलूद
  rationale: व्यक्तिनामों को उनके इब्रानी रूपों के अनुरूप प्रचलित हिन्दी बाइबलीय वर्तनी में लिप्यंतरित किया गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पदाधिकारियों की संक्षिप्त सूची वाली इब्रानी शैली को बनाए रखते हुए तकनीकी राजकीय पदों को स्पष्ट हिन्दी में व्यक्त किया गया है।
