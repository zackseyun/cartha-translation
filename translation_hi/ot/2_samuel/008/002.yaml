base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/002.yaml
  text: He struck Moab and measured them with a line[a], making them lie down on the ground. He measured off two lengths of line for death and a full length of line to keep alive. So Moab became David’s servants[b], bringing tribute.
translation:
  language: hi
  text: दाऊद ने मोआब पर प्रहार किया। उसने मोआबियों को भूमि पर लिटाकर रस्सी[a] से नापा। उसने मार डालने के लिए रस्सी की दो लंबाइयाँ और जीवित रखने के लिए रस्सी की एक पूरी लंबाई नापी।[b] इस प्रकार मोआबी दाऊद के सेवक हो गए और उसे कर लाते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नापने की डोरी’।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी पाठ में दाऊद भूमि पर लेटे मोआबियों को नापता है: दो नापे हुए हिस्से मृत्यु के लिए और एक पूरा हिस्सा जीवन के लिए ठहराया गया—अर्थात कुछ को मार डाला गया और कुछ को जीवित छोड़ा गया।'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ אֶת־מוֹאָב
  choice: मोआब पर प्रहार किया
  rationale: נכה का मूल अर्थ ‘मारना/प्रहार करना’ है। ‘प्रहार किया’ सैन्य कार्रवाई की ठोसता बनाए रखता है और इसे केवल ‘पराजित किया’ कहकर परिणाम पर केंद्रित नहीं करता।
- source_word: וַיְמַדְּדֵם בַּחֶבֶל
  choice: मोआबियों को ... रस्सी से नापा
  rationale: מדד का अर्थ ‘नापना’ और חבל का अर्थ रस्सी अथवा नापने की डोरी हो सकता है। सर्वनाम का आशय मोआब के लोगों से है, इसलिए हिन्दी में ‘मोआबियों’ स्पष्ट किया गया है।
- source_word: הַשְׁכֵּב אוֹתָם אַרְצָה
  choice: उन्हें भूमि पर लिटाकर
  rationale: हिफ़ील रूप उन्हें भूमि पर लेटने के लिए विवश किए जाने को व्यक्त करता है। ‘लिटाकर’ यह कारक भाव स्वाभाविक और संक्षिप्त हिन्दी में रखता है।
- source_word: שְׁנֵי חֲבָלִים לְהָמִית
  choice: मार डालने के लिए रस्सी की दो लंबाइयाँ
  rationale: यह अनुवाद दो नापी हुई लंबाइयों और मृत्यु के उद्देश्य को बनाए रखता है, बिना मुख्य पाठ में अनुपात को ‘दो-तिहाई’ बनाकर अधिक स्पष्ट करने के।
- source_word: וּמְלֹא הַחֶבֶל לְהַחֲיוֹת
  choice: जीवित रखने के लिए रस्सी की एक पूरी लंबाई
  rationale: מְלֹא הַחֶבֶל एक पूरी रस्सी-भर नाप को और חיה का हिफ़ील ‘जीवित रखना’ को व्यक्त करता है। ‘एक’ हिन्दी में निहित एक पूर्ण माप को स्वाभाविक बनाता है।
- source_word: וַתְּהִי מוֹאָב לְדָוִד לַעֲבָדִים
  choice: मोआबी दाऊद के सेवक हो गए
  rationale: यह राजनीतिक अधीनता का संदर्भ है। ‘सेवक’ עֲבָדִים का सीधा रूप है; ‘दास’ यहाँ सामाजिक स्थिति को आवश्यकता से अधिक विशिष्ट कर सकता है।
- source_word: נֹשְׂאֵי מִנְחָה
  choice: उसे कर चढ़ाने लगे
  rationale: राजकीय संदर्भ में מִנְחָה अधीन राज्य द्वारा दिया जाने वाला कर या नजराना है, न कि अनिवार्य रूप से उपासना की भेंट। ‘कर चढ़ाना’ नियमित राजकीय दायित्व को स्पष्ट करता है।
theological_decisions:
- issue: मोआबियों को रस्सी से नापकर मृत्यु और जीवन के लिए बाँटना
  choice: नापने, मार डालने और जीवित रखने की कठोर छवि को मुख्य पाठ में सीधे बनाए रखा गया है।
  alternative: इसे केवल सामान्य अधीनता कहना, या मुख्य पाठ में स्पष्ट रूप से ‘दो-तिहाई मारे गए और एक-तिहाई बचाए गए’ लिखना।
  rationale: इब्रानी पाठ एक ठोस और भयावह प्रक्रिया बताता है, किंतु अनुपात को भिन्नों में व्यक्त नहीं करता। इसलिए न तो हिंसा को नरम किया गया है और न निहित अनुपात को पाठ से अधिक निश्चित बनाया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, कथात्मक और स्पष्ट शैली रखी गई है। ‘भूमि’, ‘प्रहार’ और ‘जीवित रखना’ गरिमापूर्ण हैं, जबकि वाक्यरचना सामान्य पाठक के लिए सरल है। हिंसक विवरण को न तो अलंकृत किया गया है, न नरम।
