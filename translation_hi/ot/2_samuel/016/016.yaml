  yaml_path: translation/ot/2_samuel/016/016.yaml
  text: And when Hushai the Archite[a], David’s friend, came to Absalom, Hushai said to Absalom, “Long live the king! Long live the king!”
translation:
  language: hi
  text: जब दाऊद का मित्र अर्की हूशै अबशालोम के पास आया, तो उसने अबशालोम से कहा, “राजा चिरंजीवी हो![a] राजा चिरंजीवी हो!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “राजा जीवित रहे!” यह इब्रानी में राजकीय जयघोष है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: जब
  rationale: इब्रानी कथात्मक सूत्र अगले घटनाक्रम का समय बताता है। हिंदी में ‘जब’ स्वाभाविक रूप से यह संबंध व्यक्त करता है; मुख्य वाक्य में ‘तो’ क्रम को स्पष्ट करता है।
- source_word: בָּא
  choice: आया
  rationale: सामान्य गतिसूचक क्रिया यहाँ अबशालोम के पास हूशै के पहुँचने को व्यक्त करती है।
- source_word: חוּשַׁי הָאַרְכִּי
  choice: एरेकी हूशै
  rationale: व्यक्तिनाम חוּשַׁי का रूप ‘हूशै’ रखा गया है और הָאַרְכִּי को उसके क्षेत्रीय/वंशगत विशेषण के रूप में ‘एरेकी’ लिप्यंतरित किया गया है।
- source_word: רֵעֶה דָוִד
  choice: दाऊद का मित्र
  rationale: संबंधवाचक पदबंध हूशै और दाऊद के व्यक्तिगत तथा राजनीतिक संबंध को संक्षेप और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֶל אַבְשָׁלוֹם
  choice: अबशालोम के पास / अबशालोम से
  rationale: पहले प्रयोग में אֶל आगमन की दिशा और दूसरे में संबोधन की दिशा बताता है; प्रसंग के अनुसार दोनों को स्वाभाविक हिंदी में अलग ढंग से व्यक्त किया गया है।
- source_word: וַיֹּאמֶר
  choice: कहा
  rationale: प्रत्यक्ष कथन आरंभ कराने वाली אמר की सामान्य और स्वाभाविक हिंदी अभिव्यक्ति है।
- source_word: יְחִי הַמֶּלֶךְ
  choice: राजा चिरंजीवी हो!
  rationale: यह राजकीय जयघोष के रूप में प्रयुक्त इच्छार्थक कथन है। ‘चिरंजीवी हो’ जीवन की कामना और सार्वजनिक अभिवादन—दोनों को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: יְחִי הַמֶּלֶךְ (repeated)
  choice: राजा चिरंजीवी हो!
  rationale: इब्रानी की पुनरावृत्ति जोरदार सार्वजनिक जयघोष और हूशै की निष्ठा से जुड़ी कथात्मक अस्पष्टता को बनाए रखती है।
theological_decisions:
- issue: अबशालोम के प्रति हूशै के जयघोष की अस्पष्टता
  choice: बिना व्याख्यात्मक विस्तार के सामान्य राजकीय जयघोष को बनाए रखा गया है।
  alternative: शब्दों में व्यंग्य या छल का संकेत स्पष्ट रूप से जोड़ना।
  rationale: यह पद अपने आप में हूशै के कथन को सामान्य राजकीय अभिवादन की तरह प्रस्तुत करता है। व्यापक प्रसंग में उसकी निष्ठा की रणनीतिक अस्पष्टता है, इसलिए अनुवाद उसे पहले से हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। नामों के प्रचलित हिंदी बाइबलीय रूप अपनाए गए हैं। अनावश्यक ‘और ऐसा हुआ’ से बचते हुए इब्रानी कथाक्रम को ‘जब…तो’ से व्यक्त किया गया है।
