source:
  edition: WLC
  text: וַ/עֲצַ֣ת אֲחִיתֹ֗פֶל אֲשֶׁ֤ר יָעַץ֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם כַּ/אֲשֶׁ֥ר יִשְׁאַל בִּ/דְבַ֣ר הָ/אֱלֹהִ֑ים כֵּ֚ן כָּל עֲצַ֣ת אֲחִיתֹ֔פֶל גַּם לְ/דָוִ֖ד גַּ֥ם לְ/אַבְשָׁלֹֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/023.yaml
  text: The counsel of Ahithophel that he gave in those days was as if one inquired of God[a]; so was all the counsel of Ahithophel both to David and to Absalom.
translation:
  language: hi
  text: उन दिनों अहीतोपेल जो सलाह देता था, वह ऐसी थी मानो परमेश्वर से मार्गदर्शन माँगा जाता हो[a]। अहीतोपेल की सारी सलाह दाऊद के लिए भी और अबशालोम के लिए भी ऐसी ही थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मानो परमेश्वर की बात/वचन के विषय में पूछा जाता हो।” इब्रानी पदबंध परमेश्वर से मार्गदर्शन लेने के अर्थ में एक मुहावरा हो सकता है। तुलना बताती है कि अहीतोपेल की सलाह को बहुत भरोसेमंद माना जाता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת
  choice: सलाह
  rationale: यहाँ राजकीय परामर्शदाता द्वारा दी गई सम्मति अभिप्रेत है। आधुनिक हिन्दी में ‘सलाह’ स्वाभाविक और स्पष्ट है तथा पद में इसकी पुनरावृत्ति बनाए रखी गई है।
- source_word: יָעַץ
  choice: देता था
  rationale: ‘सलाह देता था’ हिन्दी का स्वाभाविक प्रयोग है और इब्रानी क्रिया के बार-बार/सामान्यतः परामर्श देने के भाव को प्रसंगानुकूल व्यक्त करता है।
- source_word: בַּיָּמִים הָהֵם
  choice: उन दिनों
  rationale: यह इब्रानी कालवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: כַּאֲשֶׁר יִשְׁאַל
  choice: मानो कोई ... पूछ रहा हो
  rationale: अनिर्दिष्ट कर्ता और तुलना के भाव को बनाए रखता है; इसे किसी निश्चित व्यक्ति की घटना नहीं बनाता।
- source_word: בִּדְבַר הָאֱלֹהִים
  choice: परमेश्वर से वचन पूछ रहा हो
  rationale: דבר का ‘वचन/बात’ संबंधी संकेत बचाते हुए यह ईश्वरीय मार्गदर्शन पूछने का भाव देता है। पदबंध की सम्भावित मुहावरेदार समझ फुटनोट में दी गई है।
- source_word: כֵּן
  choice: ऐसा ही मान था
  rationale: पूर्ववर्ती तुलना को दूसरी पंक्ति में संक्षेप और स्वाभाविक हिन्दी में फिर लागू करता है।
- source_word: כָּל עֲצַת אֲחִיתֹפֶל
  choice: अहीतोपेल की हर सलाह
  rationale: כָּל के वितरणात्मक बल को ‘हर’ स्पष्ट करता है और हिन्दी में स्वाभाविक है।
- source_word: גַּם לְדָוִד גַּם לְאַבְשָׁלֹם
  choice: चाहे दाऊद के लिए हो, चाहे अबशालोम के लिए
  rationale: दोहराए गए גַּם ... גַּם की समांतरता और दोनों व्यक्तियों के लिए समान रूप से लागू होने का भाव सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय पूछताछ से तुलना का आशय
  choice: लोग अहीतोपेल की सलाह को ऐसा मान देते थे मानो ईश्वरीय मार्गदर्शन पूछा गया हो; कथन तुलना करता है, उसे परमेश्वर का प्रेरित प्रकाशन घोषित नहीं करता।
  alternative: इसे केवल अतिशयोक्ति, अथवा व्यवहारतः दैवी वाणी के समान कार्य करने वाली सलाह के रूप में समझा जा सकता है।
  rationale: इब्रानी में כַּאֲשֶׁר द्वारा तुलना की गई है, पहचान नहीं। ‘ऐसा माना जाता था’ सामाजिक प्रतिष्ठा स्पष्ट करता है, जबकि ‘मानो’ मूल धार्मिक तनाव और तुलना को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण ऐतिहासिक-वर्णन शैली। ‘परामर्श’ की अपेक्षा ‘सलाह’ सामान्य पाठक के लिए अधिक स्वाभाविक है। आरम्भ में कोई अतिरिक्त ‘अब’ नहीं जोड़ा गया, क्योंकि स्रोत में उसका स्पष्ट समतुल्य नहीं है।
