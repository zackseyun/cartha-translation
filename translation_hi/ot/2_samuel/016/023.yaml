    reason: lexical_alternative
  revision_rationale: The revision replaces an unidiomatic literalism with the natural Hindi sense of seeking divine guidance, while the note retains the Hebrew word/matter (‘बात/वचन’) element and signals the idiomatic uncertainty. It also renders the repeated גַּם ... גַּם with repeated “भी,” and avoids introducing a claim that Ahithophel’s counsel was itself divine revelation.
