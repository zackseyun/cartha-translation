base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/017.yaml
  text: Absalom said to Hushai[a], “Is this your loyalty to your friend? Why did you not go with your friend?”
translation:
  language: hi
  text: अबशालोम ने हूशै से कहा, “क्या अपने मित्र के प्रति तुम्हारी निष्ठा यही है?[a] तुम अपने मित्र के साथ क्यों नहीं गए?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘निष्ठा’ के लिए इब्रानी शब्द का अर्थ ‘भलाई’ या ‘अटल प्रेम’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדְּךָ
  choice: तुम्हारी निष्ठा
  rationale: חֶסֶד के अर्थ-क्षेत्र में कृपा, अटल प्रेम और निष्ठा आते हैं। यहाँ अबशालोम दाऊद के प्रति हूशै की मित्रता और राजनीतिक वफादारी पर प्रश्न कर रहा है, इसलिए ‘निष्ठा’ प्रसंग के लिए स्वाभाविक और सटीक है।
- source_word: רֵעֶךָ
  choice: अपने मित्र
  rationale: רֵעַ का अर्थ मित्र, साथी या संगी हो सकता है। यहाँ संकेत दाऊद की ओर है; ‘मित्र’ दोहराए गए आरोप को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לָמָּה לֹא הָלַכְתָּ אֶת רֵעֶךָ
  choice: तुम अपने मित्र के साथ क्यों नहीं गए?
  rationale: הלך के साथ אֶת यहाँ किसी के साथ जाने का भाव देता है। यह अनुवाद इब्रानी की सरल क्रिया-रचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: זֶה חַסְדְּךָ אֶת רֵעֶךָ
  choice: क्या अपने मित्र के प्रति तुम्हारी निष्ठा यही है?
  rationale: इब्रानी में यह क्रियारहित, आलंकारिक प्रश्न है। हिन्दी में ‘क्या ... यही है?’ अबशालोम के अविश्वास और कटाक्ष को स्वाभाविक ढंग से व्यक्त करता है; ‘के प्रति’ सम्बन्धगत व्यवहार को स्पष्ट करता है।
- source_word: וַיֹּאמֶר
  choice: ने ... से कहा
  rationale: यह सामान्य कथात्मक क्रिया ‘कहा’ है। उद्धरण के प्रश्नवाचक रूप से पूछने का भाव स्वयं स्पष्ट हो जाता है।
