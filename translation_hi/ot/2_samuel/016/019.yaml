  text: And secondly[a], whom should I serve? Should it not be before his son? As I served before your father, so I will be before you.
translation:
  language: hi
  text: 'और दूसरी बात: मैं किसकी सेवा करूँ? क्या मैं उसके पुत्र के सामने सेवा न करूँ? जैसे मैंने तुम्हारे पिता के सामने सेवा की, वैसे ही तुम्हारे सामने रहूँगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַשֵּׁנִית
  choice: और दूसरी बात
  rationale: यह हूशै के दूसरे तर्क को प्रस्तुत करने वाला संवाद-सूचक पद है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: לְמִי אֲנִי אֶעֱבֹד
  choice: मैं किसकी सेवा करूँ?
  rationale: राजदरबारी प्रसंग में עבד निष्ठापूर्वक सेवा करने को दर्शाता है; प्रश्न की विचारात्मक/अलंकारिक शक्ति को हिन्दी संभावनार्थक रूप बनाए रखता है।
- source_word: הֲלוֹא לִפְנֵי בְנוֹ
  choice: क्या उसके पुत्र के सामने नहीं?
  rationale: הֲלוֹא अपेक्षित सकारात्मक उत्तर वाला अलंकारिक प्रश्न है। 'के सामने' मूल के לִפְנֵי को बनाए रखता और अगले समानांतर वाक्यांशों से जोड़ता है।
- source_word: כַּאֲשֶׁר עָבַדְתִּי לִפְנֵי אָבִיךָ
  choice: जैसे मैंने तुम्हारे पिता के सामने सेवा की
  rationale: अनुवाद राजदरबारी मुहावरे और मूल की स्पष्ट तुलना दोनों को सुरक्षित रखता है।
- source_word: כֵּן אֶהְיֶה לְפָנֶיךָ
  choice: वैसे ही तुम्हारे सामने रहूँगा
  rationale: मूल यहाँ עבד को दोहराने के बजाय היה, 'होना/रहना,' प्रयोग करता है; 'रहूँगा' इस शब्दगत परिवर्तन और दरबार में उपस्थित रहने के भाव को सुरक्षित रखता है।
