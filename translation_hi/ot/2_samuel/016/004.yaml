  text: Then the king said to Ziba, “Look, all that belongs to Mephibosheth is yours.” And Ziba said, “I bow down; may I find favor in your eyes, my lord the king.”
translation:
  language: hi
  text: तब राजा ने सीबा से कहा, “देखो, जो कुछ मपीबोशेत का है, वह सब तुम्हारा है।” सीबा ने कहा, “मैं दण्डवत करता हूँ। हे मेरे स्वामी राजा, मुझे आपकी दृष्टि में कृपा मिले।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यहाँ ध्यान खींचने और तत्काल राजकीय घोषणा पर बल देने वाला स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: הִשְׁתַּחֲוֵיתִי
  choice: मैं दण्डवत करता हूँ
  rationale: राजा के सामने झुककर सम्मान प्रकट करने की क्रिया को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: मुझ पर आपकी कृपादृष्टि बनी रहे
  rationale: शाब्दिक मुहावरे ‘आपकी आँखों में अनुग्रह पाऊँ’ का स्वाभाविक हिन्दी समतुल्य; निवेदन के भाव और दरबारी विनम्रता को बनाए रखता है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: हे मेरे स्वामी राजा
  rationale: संबोधन, अधीनता और राजकीय पद—तीनों को सुरक्षित रखता है।
