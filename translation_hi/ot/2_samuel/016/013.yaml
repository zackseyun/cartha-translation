base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/013.yaml
  text: So David and his men went on the road[a], while Shimei went along on the hillside opposite him, going along and cursing[c][b], and throwing stones opposite him and flinging dust.
translation:
  language: hi
  text: इस प्रकार दाऊद और उसके लोग मार्ग पर आगे बढ़ते गए। उधर शिमी उसके सामने की पहाड़ी ढलान पर चलता जाता हुआ उसे कोसता जाता था, उसकी ओर पत्थर फेंकता और धूल उछालता जाता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּדָּרֶךְ
  choice: मार्ग पर
  rationale: דֶּרֶךְ यहाँ दाऊद के चलने के ठोस मार्ग को दर्शाता है; ‘मार्ग पर’ स्वाभाविक और स्रोत के निकट है।
- source_word: בְּצֵלַע הָהָר
  choice: पहाड़ की ढलान पर
  rationale: צֵלַע का मूल भाव ‘बगल/पार्श्व’ है; पहाड़ के संदर्भ में ‘ढलान’ दृश्य को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לְעֻמָּתוֹ
  choice: उसके सामने / उसकी ओर
  rationale: पहली बार यह शिमी की दाऊद के सामने या समानांतर स्थिति बताता है; दूसरी बार पत्थर फेंकने की दिशा को ‘उसकी ओर’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: הֹלֵךְ ... הָלוֹךְ וַיְקַלֵּל
  choice: साथ-साथ चलता हुआ उसे कोसता जाता था
  rationale: दोहराई गई गति-संरचना निरंतर चलते रहने और कोसते जाने का भाव देती है; हिन्दी की ‘करता जाता था’ रचना उस कालगत प्रवाह को बचाती है।
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  choice: पत्थर फेंकता
  rationale: यहाँ प्रसंग औपचारिक मृत्युदंड का नहीं बल्कि चलते हुए पत्थर फेंककर सताने का है, इसलिए ‘पथराव’ या ‘पत्थरों से मार डालना’ से अधिक सटीक ‘पत्थर फेंकता’ है।
- source_word: וְעִפַּר בֶּעָפָר
  choice: धूल उछालता
  rationale: सजातीय धातु-संज्ञा प्रयोग धूल/मिट्टी फेंकने की क्रिया को बल देता है; ‘धूल उछालता’ सजीव और स्वाभाविक हिन्दी है।
- source_word: וַאֲנָשָׁיו
  choice: उसके लोग
  rationale: यह दाऊद के साथ चल रहे अनुयायियों या साथियों को दर्शाता है; ‘उसके लोग’ सामान्य पाठक के लिए सहज और प्रसंगानुकूल है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘आगे बढ़ते गए’, ‘कोसता जाता था’ और ‘उछालता जाता था’ निरंतर गति तथा बार-बार होती शत्रुतापूर्ण कार्रवाइयों को व्यक्त करते हैं।
