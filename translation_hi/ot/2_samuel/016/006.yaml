base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/006.yaml
  text: And he threw stones at David and at all the servants of King David[a], while all the people and all the mighty men were at his right hand and at his left.
translation:
  language: hi
  text: और उसने दाऊद और राजा दाऊद के सभी सेवकों पर पत्थर फेंके,[a] और सभी लोग तथा सभी वीर योद्धा दाऊद के दाएँ और बाएँ थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने दाऊद और राजा दाऊद के सभी सेवकों को पत्थरों से मारा।” इब्रानी क्रिया का अधिक शाब्दिक अनुवाद ऐसा हो सकता है, लेकिन यहाँ आशय पत्थर मारकर औपचारिक रूप से मृत्युदंड देने का नहीं, बल्कि उन पर शत्रुतापूर्वक पत्थर फेंकने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  choice: उसने ... पर पत्थर फेंके
  rationale: पिएल क्रिया סקל और साधनसूचक בָּאֲבָנִים यहाँ किसी औपचारिक पथराव-दंड की अपेक्षा शत्रुतापूर्वक पत्थर फेंकने की क्रिया बताते हैं। यह हिंदी में ठोस और स्वाभाविक है।
- source_word: עַבְדֵי
  choice: सेवकों
  rationale: यह शब्द राजकीय सेवा में लगे लोगों को व्यापक रूप से सूचित करता है; ‘दासों’ से बंधुआ स्थिति का अनावश्यक अर्थ निकल सकता है और ‘अधिकारियों’ से अर्थ बहुत संकरा हो जाएगा।
- source_word: הַמֶּלֶךְ דָּוִד
  choice: राजा दाऊद
  rationale: यह उपाधि और नाम दोनों को स्वाभाविक आधुनिक हिंदी में बनाए रखता है।
- source_word: כָּל הָעָם
  choice: सभी लोग
  rationale: עַם दाऊद के साथ चल रहे पूरे जनसमूह को सूचित कर सकता है, केवल सैनिकों को नहीं।
- source_word: הַגִּבֹּרִים
  choice: सभी वीर योद्धा
  rationale: גִּבּוֹרִים में वीरता और युद्ध-संबंधी भूमिका दोनों निहित हैं; ‘वीर योद्धा’ आधुनिक पाठक के लिए स्पष्ट है और दाऊद के विशिष्ट लड़ाकों की संभावित ओर संकेत बनाए रखता है।
- source_word: מִימִינוֹ וּמִשְּׂמֹאלוֹ
  choice: दाऊद के दाएँ और बाएँ
  rationale: इब्रानी प्रत्यय व्याकरणतः ‘उसके’ है, पर संदर्भ में उसका सबसे स्वाभाविक पूर्वपद दाऊद है। हिंदी में नाम दोहराने से संदर्भ स्पष्ट होता है और सुरक्षा देने वाली दोनों ओर की स्थिति व्यक्त होती है।
