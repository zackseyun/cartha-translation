lexical_decisions:
- source_word: וְ/אַבְשָׁל֗וֹם
  choice: अबसालोम
  rationale: नाम का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है। आरम्भिक וְ को अलग से ‘और’ बनाना हिन्दी में आवश्यक नहीं; अगले संयुक्त पद में उसका संबंध स्वाभाविक रूप से व्यक्त है।
- source_word: וְ/כָל הָ/עָם֙ אִ֣ישׁ יִשְׂרָאֵ֔ל
  choice: और उसके साथ इस्राएल के सब लोग[a]
  rationale: כָל הָעָם का अर्थ ‘सब लोग’ रखा गया है। אִישׁ יִשְׂרָאֵל को उसी समूह की पहचान बताने वाला पद मानकर ‘इस्राएल के’ में व्यक्त किया गया है। ‘उसके साथ’ स्रोत में अलग शब्द नहीं है, पर बहुवचन क्रिया और बाद के אִתּוֹ के संदर्भ से अबसालोम के साथ आए समूह का संबंध हिन्दी में स्पष्ट करता है; शाब्दिक संरचना पाद-टिप्पणी में दी गई है।
- source_word: בָּ֖אוּ יְרוּשָׁלִָ֑ם
  choice: यरूशलेम आए
  rationale: בוא का सामान्य कथात्मक अर्थ ‘आना’ है; गंतव्य हिन्दी में बिना ‘को’ के स्वाभाविक रूप से व्यक्त होता है।
- source_word: וַ/אֲחִיתֹ֖פֶל אִתּֽ/וֹ
  choice: अहीतोपेल भी उसके साथ था
  rationale: इब्रानी में यह नाममात्र वाक्यांश है; हिन्दी में ‘था’ जोड़ा गया है। ‘भी’ וְ की संयोजक/समावेशी भूमिका को स्वाभाविक ढंग से व्यक्त करता है। ‘उसके’ का निकटतम और प्रसंगानुकूल संदर्भ अबसालोम है।
