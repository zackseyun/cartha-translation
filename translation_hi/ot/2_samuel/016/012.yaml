  edition: WLC
  text: אוּלַ֛י יִרְאֶ֥ה יְהוָ֖ה ב/עונ/י וְ/הֵשִׁ֨יב יְהוָ֥ה לִ/י֙ טוֹבָ֔ה תַּ֥חַת קִלְלָת֖/וֹ הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/012.yaml
  text: Perhaps Yahweh will look on my affliction[a], and Yahweh will repay me with good in place of his cursing this day.
translation:
  language: hi
  text: शायद यहोवा मेरी दुर्दशा पर ध्यान दे और उसके आज के शाप देने के बदले मुझे भलाई दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוּלַי
  choice: शायद
  rationale: दाऊद की अनिश्चित किंतु आशापूर्ण बात को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יִרְאֶה
  choice: ध्यान दे
  rationale: ראה के मूल अर्थ ‘देखना’ को ב के साथ इस प्रसंग में ‘किसी दशा पर ध्यान देना’ के भाव में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से प्रतिस्थापित करने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा सुरक्षित रखता है।
- source_word: ב/עונ/י
  choice: मेरे दुःख पर
  rationale: पारंपरिक पठन और तत्कालीन प्रसंग दाऊद की पीड़ा या दुर्दशा की ओर संकेत करते हैं; लिखित रूप से संभव ‘मेरे अधर्म’ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: וְהֵשִׁיב ... לִי טוֹבָה
  choice: मेरे साथ भलाई करे
  rationale: शाब्दिक ‘मेरे लिए भलाई लौटा दे’ का स्वाभाविक हिन्दी रूप, जो प्रतिफलस्वरूप मिलने वाली भलाई का आशय स्पष्ट करता है।
- source_word: תַּחַת
  choice: के बदले
  rationale: प्रतिस्थापन अथवा प्रतिफल के अर्थ को संक्षिप्त और स्पष्ट रूप से व्यक्त करता है।
- source_word: קִלְלָתוֹ
  choice: उसकी इस शाप-वाणी
  rationale: शिमी द्वारा उस समय बोले जा रहे अपशब्दों और शाप देने की क्रिया को दर्शाता है; ‘इस’ अगले समयवाचक वाक्यांश के बल को भी स्वाभाविक हिन्दी में जोड़ता है।
- source_word: הַיּוֹם הַזֶּה
  choice: आज की
  rationale: ‘इस दिन’ का स्वाभाविक आधुनिक हिन्दी रूप है और घटना की वर्तमानता बनाए रखता है।
theological_decisions:
- issue: ב/עונ/י का केतीव/क़ेरे-संबंधी अर्थ
  choice: मेरे दुःख
  alternative: मेरे अधर्म
  rationale: प्रसंग और पारंपरिक पठन दाऊद की वर्तमान पीड़ा की ओर संकेत करते हैं, जबकि लिखित व्यंजनात्मक रूप ‘मेरे अधर्म’ का अर्थ दे सकता है। मुख्य पाठ में प्रसंगानुकूल पठन और पाद-टिप्पणी में वैकल्पिक लिखित रूप रखकर पाठगत तथा धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शाप-वाणी’ कथानक में चल रहे मौखिक शाप को स्पष्ट करती है, जबकि ‘मेरे साथ भलाई करे’ प्रतिफल के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
