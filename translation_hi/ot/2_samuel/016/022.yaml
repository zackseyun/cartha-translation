base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/022.yaml
  text: So they pitched the tent for Absalom on the roof[a], and Absalom went in to his father's concubines in the sight of all Israel.
translation:
  language: hi
  text: तब उन्होंने अबशालोम के लिए छत पर तंबू लगाया, और अबशालोम सारे इस्राएल की आँखों के सामने[a] अपने पिता की उपपत्नियों के पास गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सारे इस्राएल के सामने”; अर्थात खुलेआम, सबकी दृष्टि में।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּטּוּ
  choice: उन्होंने ... तंबू लगाया
  rationale: נטה का अर्थ यहाँ तंबू को फैलाकर खड़ा करना है; आधुनिक हिंदी में ‘तंबू लगाया’ स्वाभाविक और सटीक है।
- source_word: הָאֹהֶל
  choice: तंबू
  rationale: हिब्रू में संज्ञा निश्चित है; प्रसंग में यह सार्वजनिक कृत्य के लिए लगाया गया विशिष्ट तंबू है। हिंदी में प्रसंग इसकी निश्चितता स्पष्ट कर देता है।
- source_word: עַל הַגָּג
  choice: छत पर
  rationale: यह सीधा स्थान-सूचक अनुवाद है और कृत्य की सार्वजनिक दृश्यता बनाए रखता है।
- source_word: וַיָּבֹא ... אֶל
  choice: के पास गया
  rationale: हिब्रू यौन-संबंधसूचक शिष्टोक्ति को हिंदी की स्वाभाविक बाइबलीय शिष्टोक्ति से व्यक्त किया गया है; प्रसंग अर्थ को स्पष्ट करता है और अनावश्यक स्पष्टता नहीं जोड़ता।
- source_word: פִּלַגְשֵׁי אָבִיו
  choice: अपने पिता की उपपत्नियों
  rationale: यह संबंधवाचक रचना का सीधा अनुवाद है; ‘उपपत्नियाँ’ राजकीय और प्राचीन सामाजिक संदर्भ में dignified तथा समझने योग्य शब्द है।
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल की आँखों के सामने
  rationale: यह मूल मुहावरे की चित्रात्मकता और घटना के खुले, सार्वजनिक स्वरूप दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: राजकीय विद्रोह और यौन अधिकार-हरण के संदर्भ में यौन मुहावरे का अनुवाद
  choice: ‘अपने पिता की उपपत्नियों के पास गया’ के रूप में हिब्रू शिष्टोक्ति बनाए रखी गई।
  alternative: ‘अपने पिता की उपपत्नियों से यौन-संबंध बनाए’ या ‘उनके साथ सोया’
  rationale: मूल पाठ कृत्य को शिष्टोक्ति में बताता है। चुना गया रूप उसके अर्थ, गंभीरता और साहित्यिक संयम को बनाए रखता है, बिना उसे अधिक चिकित्सकीय, बोलचाल का या स्पष्ट बनाए।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण कथात्मक शैली रखी गई है। ‘तंबू लगाया’, ‘छत पर’ और ‘के पास गया’ सामान्य पाठक के लिए स्वाभाविक हैं; मूल की शिष्टोक्ति और सार्वजनिकता की चित्रात्मक भाषा सुरक्षित रखी गई है।
