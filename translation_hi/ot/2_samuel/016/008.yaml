source:
  edition: WLC
  text: הֵשִׁיב֩ עָלֶ֨י/ךָ יְהוָ֜ה כֹּ֣ל דְּמֵ֣י בֵית שָׁא֗וּל אֲשֶׁ֤ר מָלַ֨כְתָּ֙ תחת/ו וַ/יִּתֵּ֤ן יְהוָה֙ אֶת הַ/מְּלוּכָ֔ה בְּ/יַ֖ד אַבְשָׁל֣וֹם בְּנֶ֑/ךָ וְ/הִנְּ/ךָ֙ בְּ/רָ֣עָתֶ֔/ךָ כִּ֛י אִ֥ישׁ דָּמִ֖ים אָֽתָּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/008.yaml
  text: Yahweh has brought back upon you all the blood of the house of Saul[a], in whose place you reigned, and Yahweh has given the kingdom into the hand of Absalom your son. And look, you are in your calamity[c][b], because you are a man of bloodshed.
translation:
  language: hi
  text: याहवे ने शाऊल के घराने के सारे रक्तपात को तुम पर लौटा दिया है[a], जिसके स्थान पर तुम राजा बने थे; और याहवे ने राज्य तुम्हारे बेटे अबशालोम के हाथ में दे दिया है। और देखो, तुम अपनी विपत्ति में हो[b], क्योंकि तुम खून बहाने वाले मनुष्य हो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “शाऊल के घराने के सारे खून।” इसका अर्थ “शाऊल के घराने का सारा रक्त” या “शाऊल के घराने का सारा रक्तदोष” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपनी बुराई में।” इब्रानी शब्द नैतिक बुराई और विपत्ति—दोनों अर्थ दे सकता है; यहाँ संभवतः दाऊद पर आई विपत्ति अभिप्रेत है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “खूनों का मनुष्य”; अर्थात ऐसा मनुष्य जो रक्तपात, हिंसा या रक्तदोष से चिह्नित हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב עָלֶיךָ
  choice: तुम पर लौटा दिया है
  rationale: हिफ़ील रूप के कारण किसी वस्तु को वापस उसी पर लाने का भाव है। यह अनुवाद प्रतिफल के आशय को व्यक्त करते हुए इब्रानी बिंब को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: כָּל דְּמֵי בֵית שָׁאוּל
  choice: शाऊल के घराने के सारे खून का बदला
  rationale: दְּמֵי का शाब्दिक रूप बहुवचन 'खूनों' है और प्रसंग में रक्तपात अथवा रक्तदोष का संकेत देता है। मुख्य पाठ में स्वाभाविक हिन्दी के लिए 'खून का बदला' रखा गया है और विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: אֲשֶׁר מָלַכְתָּ תַּחְתָּיו
  choice: जिसके स्थान पर तुम राजा बने थे
  rationale: תחתיו यहाँ शाऊल के स्थान पर उत्तराधिकारी के रूप में राजा बनने का अर्थ देता है।
- source_word: וַיִּתֵּן ... אֶת־הַמְּלוּכָה בְּיַד
  choice: राज्य ... के हाथ में दे दिया है
  rationale: '''हाथ में देना'' अधिकार और नियंत्रण सौंपने का इब्रानी मुहावरा है और हिन्दी में भी सहज है।'
- source_word: וְהִנְּךָ
  choice: और देखो
  rationale: הנה ध्यान आकर्षित करने वाला कथन-कण है; 'देखो' आधुनिक और गरिमापूर्ण हिन्दी है।
- source_word: בְּרָעָתֶךָ
  choice: अपनी विपत्ति में
  rationale: רָעָה नैतिक बुराई या आई हुई विपत्ति दोनों बता सकता है। यहाँ अबशालोम के विद्रोह से दाऊद पर आई आपदा प्रसंगानुकूल है, जबकि अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: אִישׁ דָּמִים
  choice: खून बहानेवाले मनुष्य
  rationale: यह मुहावरा हिंसा या रक्तदोष से चिह्नित व्यक्ति को दर्शाता है। चुना हुआ रूप आधुनिक हिन्दी में स्पष्ट है और आरोप की तीव्रता बनाए रखता है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; लिप्यंतरण उसे उपाधि से प्रतिस्थापित नहीं करता।
- issue: בְּרָעָתֶךָ का आशय
  choice: अपनी विपत्ति में
  alternative: अपनी बुराई में
  rationale: तात्कालिक प्रसंग दाऊद पर आई आपदा की ओर संकेत करता है। पादटिप्पणी नैतिक 'बुराई' की वास्तविक शाब्दिक संभावना बनाए रखती है और शिमी के आरोप को कथावाचक का निर्णय नहीं बनाती।
- issue: शिमी के कथन में दैवी प्रतिफल का दावा
  choice: आरोप को सीधे कथन के रूप में बनाए रखा
  alternative: इसे कथावाचक द्वारा प्रमाणित दैवी निर्णय की तरह स्पष्ट करना
  rationale: यह पात्र का भाषण है। अनुवाद उसके दावे की शक्ति को कम नहीं करता, पर उसमें कथावाचकीय अनुमोदन भी नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। 'याहवे', 'शाऊल' और 'अबशालोम' स्रोत-नामों के निकट लिप्यंतरण हैं। वाक्य में शिमी के तीखे आरोप का स्वर सुरक्षित रखा गया है; नैतिक बुराई और अनुभव की गई विपत्ति के बीच मूल अस्पष्टता पादटिप्पणी में दी गई है।
