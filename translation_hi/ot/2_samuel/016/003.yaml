base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/003.yaml
  text: Then the king said[a], “And where is your master's son?” Ziba said to the king, “Look, he is staying in Jerusalem, for he said, ‘Today the house of Israel will restore to me the kingdom of my father.’”
translation:
  language: hi
  text: तब राजा ने पूछा, “और तुम्हारे स्वामी का पुत्र कहाँ है?” सीबा ने राजा से कहा, “देखिए, वह यरूशलेम में ठहरा हुआ है[a], क्योंकि उसने कहा, ‘आज इस्राएल का घराना मेरे पिता का राज्य मुझे लौटा देगा।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह यरूशलेम में रह रहा है।” इब्रानी कृदन्त का अर्थ किसी स्थान पर लगातार रहना या वहीं बने रहना भी हो सकता है, केवल शाब्दिक रूप से बैठना नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने पूछा / ... ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; प्रश्नवाचक कथन के कारण पहले प्रयोग में ‘पूछा’ स्वाभाविक हिन्दी है, जबकि दूसरे में ‘कहा’ रखा गया है।
- source_word: וְאַיֵּה בֶּן אֲדֹנֶיךָ
  choice: और तुम्हारे स्वामी का पुत्र कहाँ है?
  rationale: संयोजक וְ को ‘और’ से तथा אֲדֹנֶיךָ को सामाजिक संबंध सूचक ‘तुम्हारे स्वामी’ से व्यक्त किया गया है।
- source_word: הִנֵּה
  choice: देखिए
  rationale: यह ध्यान आकर्षित करने वाला निपात है; ‘देखिए’ आधुनिक, आदरपूर्ण और संवाद में स्वाभाविक है।
- source_word: יוֹשֵׁב
  choice: ठहरा हुआ है
  rationale: यह कृदन्त यहाँ केवल शाब्दिक रूप से ‘बैठा है’ नहीं, बल्कि किसी स्थान पर बने रहने या ठहरे रहने का अर्थ दे सकता है। ‘ही’ उसके वहीं बने रहने पर प्रसंगगत बल देता है।
- source_word: כִּי אָמַר
  choice: क्योंकि उसने कहा है
  rationale: כִּי सीबा द्वारा बताए गए कारण को प्रस्तुत करता है; पूर्ण क्रिया को हिन्दी की स्वाभाविक रिपोर्टित वाणी में ‘कहा है’ से व्यक्त किया गया है।
- source_word: יָשִׁיבוּ לִי
  choice: मुझे लौटा देगा
  rationale: שׁוב के हिफ़ील रूप का अर्थ यहाँ किसी वस्तु को वापस करना या पुनः सौंपना है; सामूहिक कर्ता ‘घराना’ के साथ हिन्दी में एकवचन क्रिया स्वाभाविक है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: इब्रानी के सामूहिक-राष्ट्रीय पदबंध को केवल ‘इस्राएल’ न बनाकर ‘घराना’ के द्वारा सुरक्षित रखा गया है।
- source_word: מַמְלְכוּת אָבִי
  choice: मेरे पिता का राज्य
  rationale: संबंधवाचक संरचना का सीधा और स्वाभाविक हिन्दी रूप, जो शाऊल के राजवंश संबंधी दावे को बिना विस्तार जोड़े व्यक्त करता है।
theological_decisions:
- issue: मपीबोशेत के उद्देश्य के विषय में सीबा की रिपोर्ट
  choice: सीबा के आरोप को सामान्य प्रत्यक्ष कथन के रूप में अनूदित किया गया है, पर उसे अनुवादक की ओर से सत्य घोषित नहीं किया गया।
  alternative: ‘उसने दावा किया’ या ‘कथित रूप से’ जैसे संदेह सूचक शब्द जोड़ना।
  rationale: इब्रानी पाठ केवल सीबा की कही बात दर्ज करता है। इस पद में अतिरिक्त संदेह या समर्थन जोड़ना व्यापक कथा के मूल्यांकन को समय से पहले अनुवाद में आरोपित करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली रखी गई है। राजा से संबोधन में ‘देखिए’ आदरपूर्ण है। ‘इस्राएल का घराना’ मूल सामूहिक अभिव्यक्ति को बनाए रखता है।
