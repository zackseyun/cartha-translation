  text: וַ/יָּבֹ֥א הַ/מֶּ֛לֶךְ וְ/כָל הָ/עָ֥ם אֲשֶׁר אִתּ֖/וֹ עֲיֵפִ֑ים וַ/יִּנָּפֵ֖שׁ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/014.yaml
  text: The king and all the people who were with him arrived weary[b][a], and they refreshed themselves there.
translation:
  language: hi
  text: राजा और उसके साथ के सब लोग थके-माँदे पहुँचे, और उसने[a] वहाँ दम लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल इब्रानी में क्रिया एकवचन है: “उसने वहाँ दम लिया।” कुछ लोग इसे पूरे समूह के लिए सामूहिक अर्थ में समझते हैं: “उन्होंने वहाँ दम लिया।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: पहुँचे
  rationale: בוא यहाँ यात्रा के अंतिम बिंदु तक आने का भाव देता है। संयुक्त कर्ता के कारण स्वाभाविक हिन्दी में बहुवचन क्रिया रखी गई है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: मूल पाठ दाऊद का नाम लेने के बजाय निश्चित पदवी ‘राजा’ का प्रयोग करता है; वही बनाए रखा गया है।
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: और उसके साथ के सब लोग
  rationale: यह मूल के संबंधवाचक वाक्यांश को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עֲיֵפִים
  choice: थके-माँदे
  rationale: यह बहुवचन विशेषण शारीरिक थकावट बताता है; ‘थके-माँदे’ साधारण पाठक के लिए स्वाभाविक और भावपूर्ण है।
- source_word: וַיִּנָּפֵשׁ
  choice: उसने ... दम लिया
  rationale: क्रिया एकवचन है और साँस सँभालने, विश्राम पाने या तरोताज़ा होने का भाव देती है। ‘दम लिया’ उस पुनःशक्ति पाने के अर्थ को संक्षेप में व्यक्त करते हुए एकवचन को सुरक्षित रखता है।
- source_word: שָׁם
  choice: वहाँ
  rationale: स्थानसूचक क्रियाविशेषण का सीधा और स्वाभाविक अनुवाद।
theological_decisions:
- issue: וַיִּנָּפֵשׁ की एकवचन क्रिया और पहले आए बहुवचन समूह के बीच वचन का तनाव
  choice: मुख्य पाठ में ‘उसने’ रखकर व्याकरणिक एकवचन सुरक्षित रखा गया है।
  alternative: ‘उन्होंने वहाँ दम लिया,’ जिसमें राजा और उसके साथ के सभी लोग सामूहिक कर्ता समझे जाते हैं।
  rationale: मसोरेटिक पाठ में क्रिया स्पष्टतः एकवचन है, अतः उसे चुपचाप बहुवचन करना उचित नहीं। फिर भी प्रसंग सामूहिक अर्थ की संभावना देता है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘थके-माँदे’ और ‘दम लिया’ सामान्य पाठक के लिए बोधगम्य हैं तथा मूल की शारीरिक थकान और पुनःशक्ति पाने की छवि को बनाए रखते हैं।
