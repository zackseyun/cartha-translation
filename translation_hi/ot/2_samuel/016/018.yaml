  text: וַ/יֹּ֣אמֶר חוּשַׁי֮ אֶל אַבְשָׁלֹם֒ לֹ֕א כִּי֩ אֲשֶׁ֨ר בָּחַ֧ר יְהוָ֛ה וְ/הָ/עָ֥ם הַ/זֶּ֖ה וְ/כָל אִ֣ישׁ יִשְׂרָאֵ֑ל לא אֶהְיֶ֖ה וְ/אִתּ֥/וֹ אֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/018.yaml
  text: Hushai said to Absalom[a], “No, for the one whom Yahweh and this people and all the men of Israel have chosen—I will be his[c][b], and with him I will remain.”
translation:
  language: hi
  text: हूशै ने अबशालोम से कहा, “नहीं, बल्कि मैं उसी का[a] होऊँगा जिसे यहोवा, इस प्रजा और इस्राएल का हर एक पुरुष ने चुना है; और मैं उसी के साथ रहूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू व्यंजन-पाठ में ‘नहीं’; केरे में ‘उसका/उसके लिए’ है।
    reason: textual_variant
lexical_decisions:
- source_word: לֹא כִּי
  choice: नहीं! जिसे...
  rationale: यह पदबंध पहले दृढ़ अस्वीकार और फिर उसके स्पष्टीकरण को व्यक्त करता है। हिन्दी में विस्मयादिबोधक के बाद सम्बन्धवाचक वाक्य स्वाभाविक रूप से वही प्रभाव देता है।
- source_word: אֲשֶׁר בָּחַר
  choice: जिसे ... ने चुना है
  rationale: सम्बन्धवाचक खंड प्रसंग में पहले से सामने उपस्थित एक निश्चित व्यक्ति की ओर संकेत करता है; पूर्ण क्रिया को ‘चुना है’ से व्यक्त किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि किसी उपाधि से।
- source_word: וְהָעָם הַזֶּה
  choice: इस प्रजा ने
  rationale: एकवचन सामूहिक संज्ञा और निकटवाची संकेतवाचक को यथावत रखते हुए ‘इस प्रजा’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: וְכָל אִישׁ יִשְׂרָאֵל
  choice: और इस्राएल के हर एक पुरुष ने
  rationale: यह चयन כָל + אִישׁ की वितरणात्मक शक्ति तथा मूल के व्याकरणिक पुल्लिंग को बनाए रखता है।
- source_word: לא אֶהְיֶה
  choice: मैं उसी का होऊँगा
  rationale: मसोरेटिक पाठ में לֹא लिखा है, पर प्रसंग और वाक्य-विन्यास में निष्ठा अथवा पक्ष-संबंध का लुप्त पूरक निहित है। ‘उसी का’ हिन्दी में इस अर्थ को स्पष्ट करता है।
- source_word: וְאִתּוֹ אֵשֵׁב
  choice: और उसी के साथ रहूँगा
  rationale: יָשַׁב का मूल अर्थ ‘बैठना’ हो सकता है, पर यहाँ निरंतर साथ और निष्ठा के संदर्भ में ‘रहना’ स्वाभाविक अर्थ है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। हिन्दी बाइबलीय प्रयोग में सुविज्ञ और सहज रूप ‘यहोवा’ रखते हुए उसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: אִישׁ יִשְׂרָאֵל में लिंग और वितरणात्मकता
  choice: इस्राएल के हर एक पुरुष
  alternative: इस्राएल के सभी लोग
  rationale: मूल की पुल्लिंग एकवचन संज्ञा और ‘हर एक’ के वितरणात्मक बल को सुरक्षित रखा गया है; सामान्यीकृत विकल्प मूल की विशिष्ट अभिव्यक्ति को समतल कर देता।
- issue: לא אֶהְיֶה की पाठगत कठिनाई
  choice: मैं उसी का होऊँगा
  alternative: क्या मैं उसका नहीं होऊँगा?
  rationale: व्यंजन-पाठ का לא औपचारिक रूप से ‘नहीं’ है, किंतु इस स्थान पर वाक्य का आशय हूशै की घोषित निष्ठा है। मुख्य पाठ में सहज निष्ठा-वाचक अर्थ रखा गया, बिना इसे प्रश्न बनाकर अतिरिक्त संरचना आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद दृढ़ किंतु गरिमापूर्ण है। ‘प्रजा’, ‘हर एक पुरुष’ और ‘उसी का होऊँगा’ मूल की सामूहिकता, वितरणात्मकता और निष्ठा के भाव को सहज रूप में रखते हैं।
