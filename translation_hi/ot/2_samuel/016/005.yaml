  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप रखा गया है। नामों के लिए प्रचलित हिन्दी बाइबलीय वर्तनी ‘दाऊद’, ‘शाऊल’, ‘शिमई’, ‘गेरा’ और ‘बहूरीम’ अपनाई गई है। मुख्य पाठ का [a] चिह्न संबंधित पादटिप्पणी से मेल खाता है।
