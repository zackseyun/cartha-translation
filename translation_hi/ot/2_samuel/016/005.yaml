base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/005.yaml
  text: When King David came to Bahurim[a], behold, a man came out from there, from the clan of the house of Saul, whose name was Shimei son of Gera; he came out continually, cursing as he came.
translation:
  language: hi
  text: जब राजा दाऊद बहूरीम पहुँचा, तो देखो, वहाँ से शाऊल के घराने के एक कुल का एक व्यक्ति निकल आया। उसका नाम गेरा का पुत्र शिमई था। वह निकलता हुआ लगातार कोसता आया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह निकलता गया और कोसता गया।” इब्रानी में “निकलना” क्रिया को विशेष रूप से प्रबल किया गया है (कृदंत और पूर्णार्थक अनंत रूप), जो संभवतः बार-बार या लगातार होती क्रिया बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַמֶּלֶךְ דָּוִד עַד בַּחוּרִים
  choice: जब राजा दाऊद बहूरीम पहुँचा
  rationale: वाव + पूर्ण क्रिया कथा को आगे बढ़ाती है; ‘जब’ अगले दृश्य के लिए स्वाभाविक कालगत भूमिका बनाता है। עַד के गंतव्य तक पहुँचने के भाव को ‘पहुँचा’ व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: तो देखो
  rationale: अचानक सामने आए उल्लेखनीय दृश्य की जीवंत, संकेतात्मक शक्ति बनाए रखता है।
- source_word: מִשָּׁם אִישׁ יוֹצֵא
  choice: वहाँ से ... एक व्यक्ति निकल आया
  rationale: कृदंत दृश्य में घट रही क्रिया दिखाता है; हिन्दी में ‘निकल आया’ कथात्मक और स्वाभाविक है।
- source_word: מִמִּשְׁפַּחַת בֵּית שָׁאוּל
  choice: शाऊल के घराने के कुल का
  rationale: מִשְׁפָּחָה के विस्तृत रक्त-संबंधी समूह को ‘कुल’ और בֵּית के वंशीय/राजघराने के अर्थ को ‘घराना’ से व्यक्त किया गया है।
- source_word: וּשְׁמוֹ שִׁמְעִי בֶן גֵּרָא
  choice: उसका नाम गेरा का पुत्र शिमई था
  rationale: मूल की पहचान-सूचना और पिता-पुत्र संबंध को स्पष्ट, प्रतिष्ठित आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: יֹצֵא יָצוֹא וּמְקַלֵּל
  choice: वह कोसता हुआ लगातार आगे निकलता आया
  rationale: कृदंत + infinitive absolute की प्रबलित अथवा निरंतर गति को ‘लगातार’ से और साथ चल रही מְקַלֵּל की क्रिया को ‘कोसता हुआ’ से व्यक्त किया गया है। ‘आगे निकलता आया’ स्थल से बाहर निकलते हुए दाऊद की दिशा में बढ़ने का दृश्य देता है, पर पुनरावृत्ति/निरंतरता की व्याख्यात्मक अनिश्चितता पादटिप्पणी में रखी गई है।
