base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/002.yaml
  text: Then the king said to Ziba[a], “What are these for?” And Ziba said, “The donkeys are for the king’s household to ride on, and the bread and summer fruit are for the young men to eat[c][b], and the wine is for the weary in the wilderness to drink.”
translation:
  language: hi
  text: तब राजा ने सीबा से पूछा, “ये सब किसलिए हैं?”[a] सीबा ने कहा, “गधे राजा के घराने के लोगों की सवारी के लिए हैं; रोटी और गर्मियों के फल[b] जवानों[c] के खाने के लिए हैं; और दाखमधु निर्जन प्रदेश में थके हुए के पीने के लिए है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन सबको लाने का तुम्हारा क्या मतलब है?” हिब्रू मुहावरे का शाब्दिक रूप है, “ये तुम्हारे लिए क्या हैं?”
    reason: lexical_alternative
  - marker: b
    text: या, “गर्मियों की उपज।” हिब्रू शब्द गर्मियों के मौसम में इकट्ठे किए गए फलों या उपज को व्यापक रूप से सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “परिचारकों” अथवा “सेवकों”।
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֵלֶּה לָּךְ
  choice: ये सब किसलिए हैं?
  rationale: हिब्रू मुहावरे का शाब्दिक रूप ‘ये तुम्हारे लिए क्या हैं?’ है। प्रसंग में राजा लाई गई वस्तुओं का प्रयोजन पूछ रहा है; इसलिए यह स्वाभाविक हिन्दी अर्थ को स्पष्ट रखते हुए मुहावरे की खुली बनावट को पादटिप्पणी में सुरक्षित रखता है।
- source_word: הַחֲמוֹרִים
  choice: गधे
  rationale: पशु के लिए सामान्य और वर्तमान हिन्दी शब्द।
- source_word: לְבֵית הַמֶּלֶךְ
  choice: राजा के घराने के लोगों
  rationale: בַּיִת यहाँ केवल भवन नहीं, बल्कि राजा के साथ के परिवार/दल को सूचित करता है। ‘घराने के लोगों’ से सवारी करने वाले व्यक्ति भी स्वाभाविक रूप से व्यक्त होते हैं।
- source_word: לִרְכֹּב
  choice: सवारी के लिए
  rationale: उद्देश्यसूचक infinitive को सहज हिन्दी में संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: הַלֶּחֶם
  choice: रोटी
  rationale: मूल शब्द का सीधा अर्थ रखा गया है; इसे व्यापक ‘भोजन’ बनाना आवश्यक नहीं, क्योंकि फल अलग से उल्लिखित हैं।
- source_word: הַקַּיִץ
  choice: गरमी के फल
  rationale: यह शब्द गरमी में इकट्ठे किए जाने वाले फल या उपज को व्यापक रूप से सूचित कर सकता है। किसी विशेष फल, जैसे अंजीर, को अनावश्यक रूप से निर्दिष्ट नहीं किया गया।
- source_word: הַנְּעָרִים
  choice: जवानों
  rationale: शब्द का मूल अर्थ जवान पुरुष हो सकता है, जबकि प्रसंग में सेवक या परिचारक भी अभिप्रेत हो सकते हैं; मुख्य पाठ में कम व्याख्यात्मक अर्थ और पादटिप्पणी में विकल्प रखा गया है।
- source_word: הַיַּיִן
  choice: दाखमधु
  rationale: יין के लिए स्पष्ट, dignified और प्रचलित बाइबलीय हिन्दी पद, जो अंगूर से बने मद्य को सूचित करता है।
- source_word: הַיָּעֵף
  choice: थके हुए व्यक्ति
  rationale: हिब्रू का एकवचन विशेषण सामान्य या प्रतिनिधिक अर्थ में है। हिन्दी में ‘व्यक्ति’ जोड़ने से यह सामूहिक अर्थ को बहुवचन बनाए बिना स्वाभाविक होता है।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: מִדְבָּר निर्जन वनप्रदेश या wilderness को दर्शाता है, केवल रेतीले मरुस्थल को नहीं। कथा के प्रसंग में ‘जंगल’ सामान्य हिन्दी पाठक के लिए स्वाभाविक है।
