  text: וַ/יֹּ֤אמֶר אֲחִיתֹ֨פֶל֙ אֶל אַבְשָׁלֹ֔ם בּ֚וֹא אֶל פִּלַגְשֵׁ֣י אָבִ֔י/ךָ אֲשֶׁ֥ר הִנִּ֖יחַ לִ/שְׁמ֣וֹר הַ/בָּ֑יִת וְ/שָׁמַ֤ע כָּל יִשְׂרָאֵל֙ כִּֽי נִבְאַ֣שְׁתָּ אֶת אָבִ֔י/ךָ וְ/חָ֣זְק֔וּ יְדֵ֖י כָּל אֲשֶׁ֥ר אִתָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/021.yaml
  text: Ahithophel said to Absalom[a], “Go in to your father’s concubines, whom he left to keep the house, and all Israel will hear that you have become odious to your father[c][b], and the hands of all who are with you will be strengthened.”
translation:
  language: hi
  text: अहीतोपेल ने अबशालोम से कहा, “अपने पिता की उन उपपत्नियों के पास जा[a], जिन्हें वह राजमहल की रखवाली करने के लिए छोड़ गया था। तब समस्त इस्राएल सुनेगा कि तू अपने पिता की दृष्टि में घृणित हो गया है[b], और तेरे साथ के सब लोगों के हाथ मजबूत हो जाएँगे[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘के पास जा’ यौन संबंध बनाने के लिए प्रयुक्त इब्रानी शिष्टोक्ति है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी क्रिया का शाब्दिक बिंब दुर्गंधयुक्त या अत्यंत अप्रिय हो जाने का है।
    reason: lexical_alternative
  - marker: c
    text: ‘हाथ मजबूत हो जाएँगे’ साहस और संकल्प बढ़ने का इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹא אֶל
  choice: के पास जा
  rationale: यहाँ इब्रानी पदबंध यौन संबंध का शिष्टोक्तिपूर्ण संकेत है। हिन्दी में ‘के पास जा’ मूल की परोक्षता बनाए रखता है; अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: פִּלַגְשֵׁי
  choice: उपपत्नियों
  rationale: यह मान्य किन्तु पत्नी से निम्न वैवाहिक-सामाजिक दर्जे वाली स्त्रियों के लिए प्रचलित और सटीक हिन्दी शब्द है।
- source_word: הִנִּיחַ לִשְׁמוֹר הַבָּיִת
  choice: राजमहल की देखभाल करने के लिए छोड़ गया
  rationale: ‘घर’ यहाँ दाऊद के राजकीय निवास को सूचित करता है; ‘राजमहल’ प्रसंग को स्वाभाविक हिन्दी में स्पष्ट करता है, जबकि שמר के संरक्षण/देखभाल के भाव को बनाए रखता है।
- source_word: וְשָׁמַע כָּל יִשְׂרָאֵל
  choice: तब समस्त इस्राएल सुनेगा
  rationale: आज्ञा के परिणाम को ‘तब’ स्वाभाविक रूप से व्यक्त करता है; ‘समस्त इस्राएल’ सामूहिक जनता को दर्शाता है।
- source_word: נִבְאַשְׁתָּ אֶת אָבִיךָ
  choice: तू अपने पिता के लिए घिनौना हो गया है
  rationale: निफ़अल क्रिया का मूल भाव दुर्गंधयुक्त, घृणित या अप्रिय हो जाना है। यह चयन उसके तीखे रूपक और पिता की दृष्टि में असह्य हो जाने के राजनीतिक-संबंधपरक अर्थ को सुरक्षित रखता है।
- source_word: וְחָזְקוּ יְדֵי
  choice: हाथ दृढ़ हो जाएँगे
  rationale: मूल इब्रानी बिंब को बनाए रखा गया है; यह साहस और संकल्प बढ़ने का मुहावरा है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: כָּל אֲשֶׁר אִתָּךְ
  choice: तेरे साथ के सभी लोगों
  rationale: यह मूल के संबंधपरक शब्दों को रखता है और केवल औपचारिक राजनीतिक समर्थकों तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: राजनीतिक परामर्श में यौन शिष्टोक्ति
  choice: मुख्य पाठ में ‘अपने पिता की ... उपपत्नियों के पास जा’ रखकर यौन अर्थ को पादटिप्पणी में स्पष्ट करना
  alternative: ‘अपने पिता की उपपत्नियों से यौन संबंध बना’
  rationale: इससे मूल इब्रानी की शिष्टोक्ति और प्रसंग की गंभीरता दोनों बनी रहती हैं; कथन न तो अस्पष्ट छोड़ा जाता है, न अनावश्यक रूप से भोंडा बनाया जाता है।
- issue: पिता के लिए घिनौना हो जाने का अर्थ
  choice: ‘तू अपने पिता के लिए घिनौना हो गया है’
  alternative: ‘तूने अपने पिता से खुली दुश्मनी मोल ले ली है’
  rationale: राजनीतिक विच्छेद प्रसंग में निहित है, पर मुख्य पाठ मूल क्रिया की दुर्गंध/घृणा की तीव्र छवि को बनाए रखता है और उस निहितार्थ को व्याख्यात्मक कथन से प्रतिस्थापित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी। संवाद में ‘तू/तेरे’ का प्रयोग प्राचीन राजकीय संबोधन और एकवचन इब्रानी रूप के अनुरूप है। यौन प्रसंग को शिष्टोक्ति के साथ रखा गया है, जबकि पादटिप्पणी उसका आशय साफ करती है।
