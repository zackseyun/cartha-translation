source:
  edition: WLC
  text: וְ/כֹֽה אָמַ֥ר שִׁמְעִ֖י בְּ/קַֽלְל֑/וֹ צֵ֥א צֵ֛א אִ֥ישׁ הַ/דָּמִ֖ים וְ/אִ֥ישׁ הַ/בְּלִיָּֽעַל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/007.yaml
  text: And Shimei said as he cursed him[a], “Get out, get out[b], man of bloodshed and worthless man!”
translation:
  language: hi
  text: और शिमई ने उसे शाप देते हुए इस प्रकार कहा, “निकल जा, निकल जा, हे रक्तपात के दोषी[a] और निकम्मे आदमी[b]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘रक्तों का आदमी’; यह इब्रानी मुहावरा रक्तपात या रक्त-दोष के लिए प्रयुक्त होता है। अनुवाद ‘खूनी आदमी’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अनुवाद ‘दुष्ट आदमी’ भी हो सकता है। यहाँ इब्रानी पद नैतिक रूप से निकम्मे या नीच व्यक्ति के लिए प्रयुक्त मुहावरा है; इसे व्यक्तिवाचक नाम ‘बलियाल’ समझना आवश्यक नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֹה אָמַר
  choice: और ... इस प्रकार कह रहा था
  rationale: यह पद शिमई के शाप के शब्दों का परिचय देता है। ‘इस प्रकार’ כֹה का भाव रखता है, और प्रसंग में जारी शाप-वचन के लिए ‘कह रहा था’ स्वाभाविक है।
- source_word: שִׁמְעִי
  choice: शिमई
  rationale: व्यक्तिनाम को प्रचलित हिन्दी बाइबलीय लिप्यंतरण के अनुसार रखा गया है।
- source_word: בְּקַלְלוֹ
  choice: उसे शाप देते हुए
  rationale: पूर्वसर्ग सहित क्रियार्थक संज्ञा और तृतीय पुरुष एकवचन प्रत्यय मुख्य क्रिया के साथ-साथ होने वाली क्रिया बताते हैं; ‘उसे’ प्रसंग में दाऊद को सूचित करता है।
- source_word: צֵא צֵא
  choice: निकल जा, निकल जा
  rationale: दोहराई गई आज्ञा तिरस्कारपूर्वक चले जाने की तीव्र मांग व्यक्त करती है; पुनरुक्ति को बनाए रखा गया है।
- source_word: אִישׁ הַדָּמִים
  choice: रक्तपात के दोषी
  rationale: बहुवचन ‘रक्तों’ का इब्रानी मुहावरा रक्तपात अथवा रक्त-दोष की ओर संकेत करता है। यह रूप हिंसक हत्या के दोष का भाव रखता है, पर ‘रक्तपिपासु’ कहकर मनोभाव को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וְאִישׁ הַבְּלִיָּעַל
  choice: और निकम्मे आदमी
  rationale: यहाँ בְּלִיָּעַל नैतिक निकृष्टता या निकम्मेपन का अपमानसूचक सामान्य पद है। ‘आदमी’ संबोधन को स्वाभाविक हिन्दी में दोनों विशेषणों के साथ रखा गया है।
theological_decisions:
- issue: בְּלִיָּעַל को सामान्य अपमानसूचक पद या व्यक्तिवाचक नाम मानना
  choice: निकम्मे आदमी
  alternative: दुष्ट आदमी; बलियाल के जन
  rationale: इस पुराने नियम के प्रसंग में शब्द नैतिक निकृष्टता का सामान्य अपमानसूचक पद है। ‘बलियाल’ जैसा व्यक्तिवाचक रूप बाद की दानवीय धारणाएँ आयात कर सकता है, जिनकी यहाँ आवश्यकता नहीं है।
- issue: אִישׁ הַדָּמִים में निहित आरोप
  choice: रक्तपात के दोषी
  alternative: खूनी; रक्तपिपासु; खून के आदमी
  rationale: यह चयन रक्त-दोष अथवा रक्तपात की वास्तविक अर्थ-सीमा को बनाए रखता है और शिमई के आरोप को कथावाचक द्वारा प्रमाणित तथ्य में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण है, पर शिमई के कठोर, तिरस्कारपूर्ण संबोधन की तीव्रता भी बनाए रखती है। ‘रक्तपात’ सामान्य बोलचाल के ‘खून-खराबे’ से अधिक औपचारिक है, जबकि ‘निकम्मा’ בְּלִיָּעַל के अपमानसूचक बल को सहज हिन्दी में व्यक्त करता है।
