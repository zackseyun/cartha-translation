  text: וַ/יֹּ֨אמֶר דָּוִ֤ד אֶל אֲבִישַׁי֙ וְ/אֶל כָּל עֲבָדָ֔י/ו הִנֵּ֥ה בְנִ֛/י אֲשֶׁר יָצָ֥א מִ/מֵּעַ֖/י מְבַקֵּ֣שׁ אֶת נַפְשִׁ֑/י וְ/אַ֨ף כִּֽי עַתָּ֜ה בֶּן הַ/יְמִינִ֗י הַנִּ֤חוּ ל/וֹ֙ וִֽ/יקַלֵּ֔ל כִּ֥י אָֽמַר ל֖/וֹ יְהוָֽה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/011.yaml
  text: Then David said to Abishai and to all his servants[a], “Look, my son, who came out from my own body, is seeking my life; how much more now this Benjaminite! Leave him alone, and let him curse, for Yahweh has told him to.”
translation:
  language: hi
  text: तब दाऊद ने अबीशै और अपने सभी सेवकों से कहा, “देखो, मेरा अपना बेटा, जो मेरे ही शरीर से उत्पन्न हुआ, मेरी जान लेना चाहता है; तो फिर यह बिन्यामीनी ऐसा क्यों न करे! उसे छोड़ दो और शाप देने दो, क्योंकि याहवे ने उसे ऐसा करने को कहा है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “क्योंकि याहवे ने उससे कहा है।” इब्रानी पाठ यह स्पष्ट नहीं करता कि याहवे ने क्या कहा; प्रसंग से शाप देने की बात समझी जाती है।
    reason: शाब्दिक विकल्प और मूल पाठ में निहित आशय की अस्पष्टता बताने के लिए।
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करके दाऊद की तुलना पर बल देता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְנִי אֲשֶׁר יָצָא מִמֵּעַי
  choice: मेरा अपना बेटा, जो मेरे ही शरीर से उत्पन्न हुआ
  rationale: यह प्राकृतिक वंश का जीवंत शारीरिक बिंब बनाए रखता है, पर पुरुष वक्ता के लिए भ्रामक ‘मेरे गर्भ से’ से बचता है।
- source_word: מְבַקֵּשׁ אֶת נַפְשִׁי
  choice: मेरी जान लेना चाहता है
  rationale: इब्रानी मुहावरे का आशय किसी की हत्या करने का प्रयत्न है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וְאַף כִּי עַתָּה
  choice: तो फिर … ऐसा क्यों न करे
  rationale: हिन्दी का यह आलंकारिक प्रश्न ‘कितना अधिक’ वाले इब्रानी तर्क को सहज ढंग से व्यक्त करता है।
- source_word: בֶּן הַיְמִינִי
  choice: यह बिन्यामीनी
  rationale: यह बिन्यामीन गोत्र के सदस्य को सूचित करने वाला संक्षिप्त और प्रचलित रूप है।
- source_word: הַנִּחוּ לוֹ וִיקַלֵּל
  choice: उसे छोड़ दो और शाप देने दो
  rationale: बहुवचन आज्ञा और उसके बाद शिमी को शाप देते रहने की अनुमति—दोनों को बनाए रखता है।
- source_word: כִּי אָמַר לוֹ יְהוָה
  choice: क्योंकि याहवे ने उसे ऐसा करने को कहा है
  rationale: संदर्भ में निहित शाप देने की क्रिया को हिन्दी में स्पष्ट करता है; शाब्दिक रूप और उसकी अस्पष्टता पादटिप्पणी में दी गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत इब्रानी नाम का देवनागरी लिप्यंतरण है, न कि उसके स्थान पर कोई उपाधि।
theological_decisions:
- issue: क्या दाऊद शिमी के शाप को सीधे ईश्वरीय आदेश मानता है या केवल ईश्वरीय अनुमति?
  choice: 'दाऊद के कथन को सीधे आदेश के रूप में रखा गया: “याहवे ने उसे ऐसा करने को कहा है।”'
  alternative: “याहवे ने उसे ऐसा करने दिया है।”
  rationale: इब्रानी पाठ में अनुमति का शब्द नहीं है; वह दाऊद के मुख से इस कार्य को याहवे के कहने से जोड़ता है। इसलिए ईश्वरीय प्रेरणा और मानवीय बुरे कर्म के बीच का तनाव नरम नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप। ‘मेरी जान लेना चाहता है’ मुहावरे का अर्थ स्पष्ट करता है, जबकि ‘मेरे ही शरीर से उत्पन्न हुआ’ मूल के जीवंत वंश-संबंधी बिंब को बनाए रखता है।
