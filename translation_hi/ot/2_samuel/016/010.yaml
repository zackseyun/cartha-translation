source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ מַה לִּ֥/י וְ/לָ/כֶ֖ם בְּנֵ֣י צְרֻיָ֑ה כי יְקַלֵּ֗ל ו/כי יְהוָה֙ אָ֤מַר ל/וֹ֙ קַלֵּ֣ל אֶת דָּוִ֔ד וּ/מִ֣י יֹאמַ֔ר מַדּ֖וּעַ עָשִׂ֥יתָה כֵּֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/010.yaml
  text: But the king said[a], “What have I to do with you, sons of Zeruiah? If he is cursing because Yahweh has said to him, ‘Curse David,’ then who can say, ‘Why have you done so?’”
translation:
  language: hi
  text: पर राजा ने कहा[a], “हे सरूयाह के बेटों, मेरा तुमसे क्या लेना-देना? यदि वह इसलिए शाप दे रहा है कि यहोवा ने उससे कहा है, ‘दाऊद को शाप दे,’ तो कौन कह सकता है, ‘तूने ऐसा क्यों किया?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि वह शाप दे रहा है, क्योंकि यहोवा ने उससे कहा है, ‘दाऊद को शाप दे।’” इब्रानी के कणों को सशर्त अर्थ के बजाय व्याख्यात्मक अर्थ में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  choice: मेरा तुमसे क्या लेना-देना?
  rationale: यह इब्रानी मुहावरा संबंध से दूरी बनाने या झिड़कने का भाव व्यक्त करता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: בְּנֵי צְרֻיָה
  choice: हे सरूयाह के बेटो
  rationale: सम्बोधन का रूप बनाए रखते हुए योआब और अबीशै की पहचान उनकी माता सरूयाह के पुत्रों के रूप में की गई है।
- source_word: יְקַלֵּל / קַלֵּל
  choice: शाप दे रहा है / शाप दे
  rationale: दोनों रूपों में एक ही हिन्दी क्रिया रखकर मूल की शाब्दिक कड़ी और दाऊद के विरुद्ध अपशब्दयुक्त शाप का भाव सुरक्षित रखा गया है।
- source_word: כִּי ... וְכִי
  choice: यदि ... इसलिए ... कि
  rationale: कठिन कण-क्रम को मुख्य पाठ में सशर्त-कारणात्मक रूप दिया गया है, जबकि व्याख्यात्मक सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וּמִי יֹאמַר
  choice: तो कौन कह सकता है
  rationale: यह केवल भविष्यकालीन कथन नहीं, बल्कि चुनौती देने के अधिकार या सामर्थ्य पर अलंकारिक प्रश्न है।
- source_word: מַדּוּעַ עָשִׂיתָה כֵּן
  choice: तूने ऐसा क्यों किया?
  rationale: एकवचन सम्बोधन को बनाए रखते हुए वाक्य को स्वाभाविक आधुनिक हिन्दी में रखा गया है।
theological_decisions:
- issue: शिमी के शाप देने में यहोवा की भूमिका
  choice: दाऊद इसे इस सम्भावना के रूप में रखता है कि शिमी यहोवा के कहने पर शाप दे रहा है।
  alternative: इसे केवल ईश्वरीय अनुमति मानना, या बिना किसी सशर्तता के एक निर्विवाद प्रत्यक्ष आदेश बताना।
  rationale: इब्रानी कथन ‘यहोवा ने उससे कहा’ की कठिन धार्मिक धार को बनाए रखता है; अनुवाद न तो इसे केवल अनुमति बनाता है और न पद की अलंकारिक-सशर्त संरचना से अधिक निर्णायक करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। सम्बोधन में ‘हे ... बेटो’ और उद्धृत प्रश्न में ‘तूने’ मूल के व्यक्ति-वचन को स्पष्ट रखते हैं।
