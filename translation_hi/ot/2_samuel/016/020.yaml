- source_word: מַה נַּעֲשֶׂה
  choice: हमें क्या करना चाहिए?
  rationale: प्रथम पुरुष बहुवचन का स्वाभाविक और प्रसंगानुकूल हिंदी रूप; विचार-विमर्श का भाव व्यक्त करता है।
- source_word: עֵצָה
