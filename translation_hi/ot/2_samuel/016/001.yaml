base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/001.yaml
  text: When David had passed a little beyond the summit[a], behold, Ziba the servant of Mephibosheth was there to meet him, with a pair of saddled donkeys, and on them were two hundred loaves of bread, a hundred clusters of raisins, a hundred summer fruits[c][b], and a skin of wine.
translation:
  language: hi
  text: जब दाऊद चोटी से थोड़ा आगे निकल गया,[a] तो मपीबोशेत का सेवक[b] सीबा उससे मिलने आया। उसके साथ काठी कसे हुए दो गधे थे, जिन पर दो सौ रोटियाँ, किशमिश के सौ गुच्छे, ग्रीष्मकालीन फल सौ,[c] और दाखरस की एक मशक लदी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चोटी से थोड़ी दूर।” हिब्रू में शाब्दिक रूप से “सिर से थोड़ा” है; यहाँ “सिर” पहाड़ी की चोटी के अर्थ में है।
    reason: lexical_alternative
  - marker: b
    text: “सेवक” का अनुवाद “युवक” या “परिचारक” भी हो सकता है; यहाँ प्रसंग सीबा की मपीबोशेत के सेवक की भूमिका की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: c
    text: “ग्रीष्मकालीन फल” विशेष रूप से अंजीर हो सकते हैं, पर हिब्रू शब्द का अर्थ अधिक व्यापक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מֵהָרֹאשׁ
  choice: चोटी से थोड़ा आगे
  rationale: रֹאשׁ का मूल अर्थ ‘सिर’ है, पर इस स्थल-संबंधी प्रसंग में यह पहाड़ी की चोटी को दर्शाता है; यह रूप स्थानिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: तो ... आया
  rationale: हिब्रू कथन-सूचक अचानक दृश्य में आने पर ध्यान खींचता है। हिन्दी में ‘तो’ और प्रत्यक्ष आगमन की रचना उस कथात्मक जीवंतता को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: נַעַר מְפִי בֹשֶׁת
  choice: मपीबोशेत का सेवक
  rationale: נַעַר का अर्थ ‘युवक’, ‘परिचारक’ या ‘सेवक’ हो सकता है; सीबा और मपीबोशेत के संबंध के इस प्रसंग में ‘सेवक’ उपयुक्त है, जबकि विकल्प पादटिप्पणी में रखा गया है।
- source_word: צֶמֶד חֲמֹרִים
  choice: दो गधे
  rationale: צֶמֶד एक जोड़ी को सूचित करता है; सरल आधुनिक हिन्दी में निश्चित संख्या ‘दो’ अर्थ को स्पष्ट रखती है।
- source_word: חֲבֻשִׁים
  choice: काठी कसे हुए
  rationale: सामान ढोने के लिए तैयार गधों के संदर्भ में यह बँधे या साज-सज्जित होने की अपेक्षा काठी कसे होने को दर्शाता है।
- source_word: מָאתַיִם לֶחֶם
  choice: दो सौ रोटियाँ
  rationale: गणनीय खाद्य इकाइयों के लिए ‘रोटियाँ’ स्वाभाविक हिन्दी है और हिब्रू की संख्या को स्पष्ट रखता है।
- source_word: צִמּוּקִים
  choice: किशमिश के सौ गुच्छे
  rationale: शब्द सूखे अंगूरों के दबे हुए समूहों या गुच्छों को दर्शा सकता है; ‘गुच्छे’ इसे केवल खुली किशमिश या निश्चित रूप से टिकिया मानने से बचाता है।
- source_word: קַיִץ
  choice: ग्रीष्मकालीन फलों के सौ हिस्से
  rationale: קַיִץ पके ग्रीष्मकालीन फल, प्रायः अंजीर, को सूचित कर सकता है। ‘ग्रीष्मकालीन फल’ व्यापक अर्थ बचाता है और ‘हिस्से’ संख्या के साथ हिब्रू की अनिर्दिष्ट इकाई को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: נֵבֶל יָיִן
  choice: दाखमधु की एक मशक
  rationale: נֵבֶל यहाँ चमड़े के पात्र को दर्शाता है; ‘मशक’ संक्षिप्त, प्रचलित और भौतिक रूप से उपयुक्त है।
