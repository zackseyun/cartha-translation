language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע דָּוִד֙ מֵ/אַ֣חֲרֵי כֵ֔ן וַ/יֹּ֗אמֶר נָקִ֨י אָנֹכִ֧י וּ/מַמְלַכְתִּ֛/י מֵ/עִ֥ם יְהוָ֖ה עַד עוֹלָ֑ם מִ/דְּמֵ֖י אַבְנֵ֥ר בֶּן נֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/028.yaml
  text: Afterward[a], when David heard of it, he said[b], “I and my kingdom are forever innocent before Yahweh of the blood of Abner son of Ner.”
translation:
  language: hi
  text: इसके बाद[a], जब दाऊद ने यह सुना, तो उसने कहा, “मैं और मेरा राज्य नेर के पुत्र अबनेर के लहू[b] से यहोवा के सामने सदा निर्दोष हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इसके पश्चात्” अथवा “बाद में।”
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से “अबनेर के लहुओं से”; यह रक्तपात के लिए उत्तरदायित्व का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह कालसूचक पद पिछले वर्णित घटनाक्रम के बाद की बात बताता है; ‘इसके बाद’ आधुनिक और स्वाभाविक हिन्दी है।
- source_word: וַיִּשְׁמַע דָּוִד
  choice: जब दाऊद ने यह सुना
  rationale: क्रिया का अर्थ ‘सुनना’ है; ‘यह’ पिछले प्रसंग में अबनेर की हत्या के समाचार की ओर स्वाभाविक संकेत करता है।
- source_word: נָקִי
  choice: निर्दोष
  rationale: यह शब्द नैतिक और न्यायिक दोष से मुक्त होने को व्यक्त करता है।
- source_word: אָנֹכִי וּמַמְלַכְתִּי
  choice: मैं और मेरा राज्य
  rationale: दाऊद अपने साथ अपने अधीन राज्य को भी इस रक्तपात की जिम्मेदारी से अलग घोषित करता है।
- source_word: מֵעִם יְהוָה
  choice: यहोवा के सामने
  rationale: यह अभिव्यक्ति यहोवा को साक्षी और न्यायी मानते हुए उसके सम्मुख निर्दोष होने का भाव देती है।
- source_word: עַד עוֹלָם
  choice: सदा
  rationale: यह स्थायी और निरंतर निर्दोषता की घोषणा को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִדְּמֵי
  choice: के खून के विषय में
  rationale: हिब्रू में शाब्दिक रूप से बहुवचन ‘खूनों से’ है, जो रक्तपात की जिम्मेदारी का मुहावरा है; हिन्दी में यह चयन ठोस चित्र और आशय दोनों रखता है।
- source_word: אַבְנֵר בֶּן נֵר
  choice: अबनेर बिन नेर
  rationale: ‘बिन’ हिन्दी बाइबलीय नामावली में संक्षिप्त और समझ में आने वाला पितृनाम-सूचक रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘यहोवा’ आधुनिक हिन्दी बाइबल पाठकों में व्यापक रूप से पहचाना जाने वाला नामरूप है और इसे सामान्य उपाधि से नहीं बदलता।
- issue: दाऊद की निर्दोषता के दावे का दायरा
  choice: दावे को उसी के कथन के रूप में रखा गया है
  alternative: वर्णनकर्ता द्वारा दाऊद को वस्तुतः निर्दोष घोषित करना
  rationale: हिब्रू पाठ ‘उसने कहा’ के अंतर्गत दाऊद की घोषणा प्रस्तुत करता है; अनुवाद उसके दावे को न तो पुष्ट करता है, न कमजोर।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘खून’ सामान्य पाठक के लिए ‘रक्त’ से अधिक स्वाभाविक है, जबकि वाक्य का न्यायिक-नैतिक भाव ‘निर्दोष’ और ‘यहोवा के सामने’ से सुरक्षित रहता है।
