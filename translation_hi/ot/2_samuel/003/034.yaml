base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/034.yaml
  text: Your hands were not bound[a], and your feet were not put into bronze fetters; as one falls before sons of injustice, so you have fallen. And all the people wept over him even more.
translation:
  language: hi
  text: 'तेरे हाथ बाँधे नहीं गए थे,


    और तेरे पाँव काँसे की बेड़ियों में नहीं जकड़े गए थे।


    जैसे कोई अन्याय के पुत्रों[a] के सामने गिरता है,


    वैसे ही तू गिर पड़ा।


    और सब लोग उसके लिए और भी अधिक रोने लगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात दुष्ट लोगों या कुकर्मियों के सामने। इब्रानी में शाब्दिक रूप से ‘अन्याय के पुत्रों’ है।
    reason: इब्रानी मुहावरे का स्वाभाविक अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: יָדֶךָ לֹא אֲסֻרוֹת
  choice: तेरे हाथ बाँधे नहीं गए थे
  rationale: निष्क्रिय रूप अֲסֻרוֹת हाथों के बँधे होने को दर्शाता है। हिन्दी में ‘बाँधे नहीं गए थे’ स्वाभाविक है और बंदी बनाए जाने की निहित तुलना बनाए रखता है।
- source_word: וְרַגְלֶיךָ לֹא לִנְחֻשְׁתַּיִם הֻגָּשׁוּ
  choice: और तेरे पाँव काँसे की बेड़ियों में नहीं जकड़े गए थे
  rationale: נְחֻשְׁתַּיִם धातु, विशेषतः काँसे/ताँबे, की पैरों वाली बेड़ियों को सूचित करता है। ‘काँसे की बेड़ियों’ से सामग्री और बंधन दोनों बने रहते हैं; ‘जकड़े गए’ शाब्दिक ‘पहुँचाए गए’ के बजाय इस मुहावरे का स्वाभाविक हिन्दी अर्थ देता है।
- source_word: כִּנְפוֹל
  choice: जैसे कोई ... गिरता है
  rationale: כְּ उपसर्गयुक्त infinitive construct यहाँ तुलना प्रकट करता है। सामान्य कर्ता ‘कोई’ जोड़ने से हिन्दी सहज रहती है।
- source_word: לִפְנֵי בְנֵי עַוְלָה
  choice: अन्याय के पुत्रों के सामने
  rationale: मुख्य पाठ में इब्रानी का सजीव मुहावरा ‘अन्याय के पुत्र’ सुरक्षित रखा गया है; पादटिप्पणी में इसका सामान्य हिन्दी आशय ‘दुष्ट लोगों’ दिया गया है।
- source_word: נָפָלְתָּ
  choice: तू गिर पड़ा
  rationale: पूर्ण क्रिया शोकगीत में घट चुकी दुखद मृत्यु को बताती है। ‘गिर पड़ा’ हिन्दी में आकस्मिक और घातक पतन की पूर्णता स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיֹּסִפוּ כָל הָעָם לִבְכּוֹת עָלָיו
  choice: तब सब लोग उसके लिए और भी अधिक रोने लगे
  rationale: יָסַף + infinitive किसी काम को जारी रखने अथवा और अधिक करने का अर्थ देता है। संदर्भ में दाऊद के विलाप के बाद रोना बढ़ने का भाव उपयुक्त है; ‘उसके लिए’ עָלָיו के शोक-संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
