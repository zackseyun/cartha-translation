  text: दूसरा, किलआब, जो कर्मेलवासी नाबाल की पत्नी अबीगैल से हुआ; और तीसरा, अबशालोम, जो गशूर के राजा तल्मै की बेटी माका का पुत्र था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁנֵהוּ
  choice: दूसरा
  rationale: क्रमसूचक अर्थ को स्वाभाविक और संक्षिप्त हिन्दी में रखा गया है; पिछले पद से दाऊद के पुत्रों की सूची का संदर्भ स्पष्ट है।
- source_word: כִלְאָב
  choice: किलआब
  rationale: इब्रानी नाम का निकट देवनागरी लिप्यंतरण।
- source_word: הַכַּרְמְלִי
  choice: कर्मेली
  rationale: यह नाबाल की कर्मेल से संबद्धता बताने वाला जातिवाचक/स्थान-संबंधी विशेषण है।
- source_word: אַבְשָׁלוֹם
  choice: अबशालोम
  rationale: इब्रानी उच्चारण के निकट और हिन्दी में सुबोध लिप्यंतरण।
- source_word: גְּשׁוּר
  choice: गशूर
  rationale: स्थान-नाम का इब्रानी के निकट देवनागरी लिप्यंतरण।
theological_decisions:
- issue: אֵשֶׁת נָבָל में अबीगैल का परिचय
  choice: नाबाल कर्मेली की पत्नी अबीगैल
  alternative: नाबाल कर्मेली की विधवा अबीगैल
  rationale: मूल पाठ शाब्दिक रूप से ‘नाबाल की पत्नी’ कहता है। नाबाल की मृत्यु का पूर्व संदर्भ ज्ञात होने पर भी यहाँ ‘विधवा’ जोड़ना मूल की स्पष्ट अभिव्यक्ति से आगे जाता।
- issue: सूची में पितृत्व की अंतर्निहित अभिव्यक्ति
  choice: जो ... से हुआ
  alternative: उसका पुत्र ... अबीगैल से
  rationale: इब्रानी सूची पूर्ववर्ती संदर्भ से दाऊद के पुत्रों को गिनाती है। हिन्दी में संबंध स्पष्ट किया गया, पर दाऊद का नाम अनावश्यक रूप से नहीं दोहराया गया।
