  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। नामों के रूप ‘योआब’, ‘अबीशै’, ‘अब्नेर’, ‘असाहेल’ और ‘गिबोन’ रखे गए हैं। वाक्य में कारण और घटनाओं का कालक्रम स्पष्ट है, पर ‘हत्या’ जैसे अधिक निर्णायक नैतिक-कानूनी शब्द से बचा गया है।
