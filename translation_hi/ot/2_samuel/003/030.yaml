base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/030.yaml
  text: So Joab and Abishai his brother killed Abner because he had killed Asahel their brother at Gibeon in the battle[a].
translation:
  language: hi
  text: इस प्रकार योआब और उसके भाई अबीशै ने अब्नेर को मार डाला, क्योंकि उसने गिबोन की लड़ाई में उनके भाई असाहेल को मार डाला था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और योआब और उसके भाई अबीशै ने अब्नेर को मार डाला।” इब्रानी संयोजक का अनुवाद केवल “और” भी किया जा सकता है; “इस प्रकार” आसपास के प्रसंग के साथ उसके व्याख्यात्मक संबंध को स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְגוּ
  choice: मार डाला
  rationale: यह הרג की सामान्य वध-सूचक क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘हत्या की’ कानूनी या नैतिक निर्णय को मूल पाठ से अधिक स्पष्ट कर देता।
- source_word: לְאַבְנֵר
  choice: अब्नेर को
  rationale: הרג के बाद ל यहाँ कर्म को चिह्नित करता है; हिन्दी में ‘को’ के साथ सीधा कर्म स्वाभाविक है।
- source_word: עַל אֲשֶׁר
  choice: क्योंकि
  rationale: यह पदबंध योआब और अबीशै के कार्य का कारण बताता है; ‘क्योंकि’ इसका स्पष्ट और सहज हिन्दी समतुल्य है।
- source_word: הֵמִית
  choice: मार डाला था
  rationale: מות के हिफ़ील रूप का अर्थ यहाँ प्राण लेना है। ‘था’ इस घटना को अब्नेर के मारे जाने से पहले की घटना के रूप में स्पष्ट करता है।
- source_word: אָחִיו / אֲחִיהֶם
  choice: उसके भाई / उनके भाई
  rationale: पहला संबंध अबीशै को योआब का भाई बताता है और दूसरा असाहेल को उन दोनों का भाई; सर्वनामों का भेद मूल पाठ के पारिवारिक संबंध और प्रतिशोध के कारण को बनाए रखता है।
- source_word: בְּגִבְעוֹן
  choice: गिबोन में
  rationale: स्थानवाचक בְּ को हिन्दी में नगर अथवा युद्धस्थल के लिए स्वाभाविक ‘में’ से व्यक्त किया गया है।
- source_word: בַּמִּלְחָמָה
  choice: लड़ाई में
  rationale: सप्रत्यय संज्ञा उस विशिष्ट, पूर्ववर्णित लड़ाई की ओर संकेत करती है; प्रसंग में ‘गिबोन की लड़ाई’ यह विशिष्टता स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְ / וַ
  choice: इस प्रकार
  rationale: आरंभिक संयोजक पद पिछले प्रसंग का निष्कर्ष अथवा व्याख्यात्मक सार प्रस्तुत करता है। ‘इस प्रकार’ उस संबंध को व्यक्त करता है, जबकि ‘और’ अधिक शाब्दिक विकल्प है।
