base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/006.yaml
  text: While the war continued between the house of Saul and the house of David[a], Abner was strengthening himself in the house of Saul.
translation:
  language: hi
  text: जब शाऊल के घराने और दाऊद के घराने के बीच युद्ध चल रहा था, तब अब्नेर शाऊल के घराने में अपनी शक्ति बढ़ा रहा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शाऊल के घराने में शक्तिशाली होता जा रहा था।” इब्रानी क्रिया का अर्थ शक्तिशाली होना या अपनी शक्ति बढ़ाना हो सकता है; यहाँ आत्मवाचक रूप संभवतः यह संकेत देता है कि अब्नेर शाऊल के घराने में अपनी स्थिति मजबूत कर रहा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: जब… तब
  rationale: यह कथात्मक रूप आगे की स्थिति का परिचय देता है। हिन्दी में कालसूचक आश्रित वाक्य के साथ ‘तब’ स्वाभाविक रूप से उसका संबंध मुख्य वाक्य से जोड़ता है; कोई अलग ‘अब’ नहीं जोड़ा गया।
- source_word: בִּהְיוֹת הַמִּלְחָמָה
  choice: युद्ध चलता रहा
  rationale: ב के साथ infinitive construct और היה जारी रहने वाली परिस्थिति व्यक्त करते हैं; यह अनुवाद युद्ध की निरंतरता बनाए रखता है।
- source_word: בֵּין בֵּית שָׁאוּל וּבֵין בֵּית דָּוִד
  choice: शाऊल के घराने और दाऊद के घराने के बीच
  rationale: ‘घराना’ परिवार, राजवंश और उससे जुड़े राजनीतिक दल—इन परस्पर जुड़े अर्थों को खुला रखता है; ‘राजवंश’ अकेला अधिक संकीर्ण होता।
- source_word: וְאַבְנֵר
  choice: अब्नेर
  rationale: नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: הָיָה מִתְחַזֵּק
  choice: अपने आपको शक्तिशाली बनाता गया
  rationale: हित्पएल रूप के आत्मवाचक और क्रमशः सुदृढ़ होने के भाव को व्यक्त करता है, जबकि केवल ‘शक्तिशाली होता गया’ उसकी अपनी सक्रिय भूमिका को कम स्पष्ट करता।
- source_word: בְּבֵית שָׁאוּל
  choice: शाऊल के घराने में
  rationale: ב उस क्षेत्र या सत्ता-आधार को सूचित करता है जिसके भीतर अब्नेर अपनी स्थिति मजबूत कर रहा था; ‘घराना’ पारिवारिक और राजनीतिक दोनों आयाम बनाए रखता है।
