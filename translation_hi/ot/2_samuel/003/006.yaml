    issue: Aspectual phrasing is slightly unnatural and potentially over-sequential.
    rationale: 'The Hebrew construction depicts an ongoing situation: while war was occurring, Abner was strengthening himself. ‘युद्ध चल रहा था’ and ‘बढ़ा रहा था’ convey this contemporaneity more directly than ‘चलता रहा’ and ‘बनाता गया।’'
