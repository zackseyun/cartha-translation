base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/035.yaml
  text: Then all the people came to urge David to eat bread while it was still day[a], but David swore, saying, “May God do so to me, and more also[b], if before the sun goes down I taste bread or anything at all.”
translation:
  language: hi
  text: तब सब लोग दाऊद के पास आए और दिन रहते उसे रोटी[a] खाने के लिए मनाने लगे। पर दाऊद ने शपथ खाकर कहा, “परमेश्वर मेरे साथ ऐसा ही करे, और इससे भी अधिक करे, यदि मैं सूर्यास्त से पहले रोटी या कुछ भी चखूँ!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘रोटी’ का अर्थ यहाँ अधिक व्यापक रूप से ‘भोजन’ भी हो सकता है; अनुवाद में मूल का ठोस शब्द रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: यह शपथ लेते समय अपने ऊपर शाप बुलाने का प्रचलित सूत्र है। इब्रानी में यह नहीं बताया गया कि परमेश्वर वास्तव में क्या करे।
    reason: cultural_note
lexical_decisions:
- source_word: לְהַבְרוֹת
  choice: खाने के लिए मनाने लगे
  rationale: हिफ़ील रूप इस प्रसंग में दाऊद को भोजन कराने या भोजन लेने के लिए आग्रह करने का भाव देता है। ‘मनाने लगे’ लोगों के प्रयत्न को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֶחֶם
  choice: रोटी
  rationale: यह शब्द व्यापक अर्थ में ‘भोजन’ भी हो सकता है, पर यहाँ ठोस शब्द ‘रोटी’ बनाए रखने से इब्रानी अभिव्यक्ति और उपवास का प्रसंग सुरक्षित रहता है।
- source_word: בְּעוֹד הַיּוֹם
  choice: दिन रहते
  rationale: इसका अर्थ है कि दिन अभी समाप्त नहीं हुआ था; ‘दिन रहते’ संक्षिप्त, स्वाभाविक हिन्दी है और आगे के सूर्यास्त-संदर्भ से मेल खाता है।
- source_word: וַיִּשָּׁבַע
  choice: शपथ खाकर कहा
  rationale: यह शपथ लेने की गंभीर क्रिया को आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יֹסִיף
  choice: परमेश्वर मेरे साथ ऐसा ही करे, और इससे भी अधिक करे
  rationale: यह पारंपरिक आत्म-शापयुक्त शपथ-वाक्य है। अनुवाद दंड का स्वरूप जोड़े बिना सूत्र की जानबूझकर छोड़ी गई अनिश्चितता बनाए रखता है।
- source_word: כִּי אִם
  choice: यदि
  rationale: शपथ के प्रसंग में यह आत्म-शाप की शर्त प्रस्तुत करता है; हिन्दी में ‘यदि’ इसे स्पष्ट और स्वाभाविक बनाता है।
- source_word: לִפְנֵי בּוֹא הַשֶּׁמֶשׁ
  choice: सूर्यास्त से पहले
  rationale: शाब्दिक चित्र सूर्य के आने/प्रवेश करने का है, पर प्रसंगगत अर्थ सूर्य का डूबना है; ‘सूर्यास्त से पहले’ सटीक और सहज है।
- source_word: אֶטְעַם
  choice: चखूँ
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘चखना’ है। इसे बनाए रखने से शपथ का व्यापक जोर व्यक्त होता है कि दाऊद थोड़ी-सी मात्रा भी नहीं लेगा।
- source_word: אוֹ כָל מְאוּמָה
  choice: या और कुछ भी
  rationale: यह रोटी से आगे किसी भी वस्तु को शामिल करते हुए पूर्ण निषेध प्रकट करता है।
theological_decisions:
- issue: शपथ-वाक्य में निहित आत्म-शाप
  choice: दंड को अनिर्दिष्ट रखते हुए ‘परमेश्वर मेरे साथ ऐसा ही करे, और इससे भी अधिक करे’
  alternative: ‘परमेश्वर मुझे इससे भी कठोर दंड दे’
  rationale: इब्रानी में दंड स्पष्ट नहीं किया गया है। उसे सीधे ‘दंड’ कहना अर्थ को समझाता तो है, पर मूल की अलंकारिक अनिश्चितता को समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किन्तु गरिमापूर्ण शैली रखी गई है। ‘दिन रहते’, ‘मनाने लगे’ और ‘सूर्यास्त से पहले’ सामान्य पाठक के लिए स्वाभाविक हैं; शपथ-सूत्र को कुछ औपचारिक रखा गया है ताकि उसकी गंभीरता और मूल की अनिर्दिष्टता बनी रहे।
