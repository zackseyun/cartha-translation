- source_word: בָּא
  choice: आया था
  rationale: अब्नेर की समाप्त हो चुकी भेंट के संदर्भ में हिन्दी का सामान्य भूतकाल स्वाभाविक है।
- source_word: לָדַעַת
  choice: पता लगाने
  rationale: दोनों प्रयोग उद्देश्य और जानकारी हासिल करने का भाव व्यक्त करते हैं; हिन्दी में अनावश्यक पुनरावृत्ति से बचते हुए इसे एक संयुक्त उद्देश्य-वाक्य में स्वाभाविक बनाया गया है।
- source_word: מוֹצָאֲךָ וְאֶת מבואך
  choice: तुम्हारे आने-जाने
  rationale: हिब्रू क्रम शाब्दिक रूप से 'बाहर जाना और भीतर आना' है; हिन्दी का रूढ़ युग्म 'आना-जाना' व्यक्ति की समस्त गतिविधियों और आवाजाही को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָּל אֲשֶׁר אַתָּה עֹשֶׂה
  choice: तुम्हारे हर काम
  rationale: मूल का आशय दाऊद की चल रही समस्त गतिविधियों से है; यह संक्षिप्त हिन्दी अभिव्यक्ति उसी व्यापकता को बनाए रखती है।
