  choice: तुम ... जानते हो
  rationale: काल रूप यहाँ वर्तमान ज्ञान की अवस्था व्यक्त करता है; योआब दाऊद से उस बात को पहचानने का दावा करता है।
- source_word: אַבְנֵר בֶּן נֵר
  choice: अब्नेर बिन नेर
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण और वंश-सूचक संक्षिप्त, स्वाभाविक रूप।
- source_word: כִּי
  choice: कि
  rationale: यह उस बात की विषयवस्तु प्रस्तुत करता है जिसे दाऊद जानता है।
- source_word: לְפַתֹּתְךָ
  choice: तुम्हें धोखा देने
