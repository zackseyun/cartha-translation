base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/025.yaml
  text: You know Abner son of Ner[a], that he came to deceive you, and to learn your going out and your coming in[b], and to learn all that you are doing.
translation:
  language: hi
  text: तुम नेर के पुत्र अब्नेर को जानते हो कि वह तुम्हें धोखा देने आया था,[a] और तुम्हारे आने-जाने[b] तथा तुम्हारे हर काम का पता लगाने आया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हें फुसलाने” अथवा “बहकाने।” हिब्रू क्रिया के ये अर्थ भी हो सकते हैं; यहाँ विरोधपूर्ण प्रसंग में “धोखा देने” उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “तुम्हारे बाहर जाने और भीतर आने”; यह व्यक्ति की समस्त आवाजाही या गतिविधियों के लिए प्रयुक्त अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
