- source_word: מְבַקְשִׁים אֶת דָּוִד לְמֶלֶךְ עֲלֵיכֶם
  choice: चाहते आए हो कि दाऊद तुम्हारा राजा बने
  rationale: בקשׁ के प्रसंगगत अर्थ ‘इच्छा/प्रयत्न करना’ और निरंतरता को सहज आधुनिक हिन्दी में व्यक्त करता है।
