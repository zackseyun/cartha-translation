  yaml_path: translation/ot/2_samuel/003/023.yaml
  text: When Joab and all the army that was with him arrived, they told Joab, saying, “Abner son of Ner came to the king, and he sent him away, and he went in peace.”
translation:
  language: hi
  text: जब योआब और उसके साथ की सारी सेना आई, तब उन्होंने योआब को बताया, “नेर का पुत्र अब्नेर राजा के पास आया था। राजा ने उसे विदा कर दिया, और वह कुशल से चला गया।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאוּ
  choice: लौट आई
  rationale: संदर्भ में योआब और उसकी सेना छापामार अभियान से वापस आ रहे हैं; हिन्दी में ‘लौट आई’ इस आगमन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַצָּבָא
  choice: सेना
  rationale: यहाँ शब्द योआब के साथ के सैन्य दल को सूचित करता है; ‘सेना’ सरल और प्रसंगानुकूल है।
- source_word: וַיַּגִּדוּ
  choice: यह समाचार दिया गया
  rationale: हिब्रू में बताने वालों की पहचान अनिर्दिष्ट है। हिन्दी का कर्मवाच्य इसी अनिर्दिष्टता को बनाए रखता है।
- source_word: וַיְשַׁלְּחֵהוּ
  choice: राजा ने उसे विदा कर दिया
  rationale: हिब्रू क्रिया का अर्थ यहाँ किसी को जाने देना या विदा करना है; कर्ता पिछले वाक्यांश के ‘राजा’ से स्वाभाविक रूप से समझा जाता है।
- source_word: בְּשָׁלוֹם
  choice: कुशल से
  rationale: इसका आशय सुरक्षित और बिना हानि के चले जाने से है; ‘कुशल से’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
