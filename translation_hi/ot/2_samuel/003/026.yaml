base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/026.yaml
  text: Then Joab went out from David and sent messengers after Abner[a], and they brought him back from the well of Sirah. But David did not know it.
translation:
  language: hi
  text: तब योआब दाऊद के पास से निकल गया और उसने अब्नेर के पीछे दूत भेजे। वे उसे सीरा के कुएँ[a] से वापस ले आए, पर दाऊद को इसका पता नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “बोर-सीरा से”; इस दशा में इब्रानी पद को “सीरा का कुआँ” न मानकर एक स्थान-नाम माना जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: निकल गया
  rationale: कथा-क्रम में यह क्रिया किसी के पास से बाहर जाने को व्यक्त करती है; आधुनिक हिन्दी में ‘निकल गया’ स्वाभाविक और ठोस गति-सूचक है।
- source_word: מֵעִם דָּוִד
  choice: दाऊद के पास से
  rationale: מֵעִם का अर्थ किसी की संगति या उपस्थिति से दूर जाना है; ‘के पास से’ इस भाव को सहज हिन्दी में सुरक्षित रखता है।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: इस प्रसंग में यह शब्द मनुष्य संदेशवाहकों के लिए है, इसलिए ‘दूत’ उपयुक्त है।
- source_word: אַחֲרֵי אַבְנֵר
  choice: अब्नेर के पीछे
  rationale: यह पद पीछे जाने या पीछा करने का भाव रखता है; ‘के पीछे’ मूल की संक्षिप्तता और प्रसंगगत अर्थ दोनों बनाए रखता है।
- source_word: וַיָּשִׁבוּ אֹתוֹ
  choice: वे उसे ... वापस ले आए
  rationale: שׁוב का हिफ़ील रूप कारक अर्थ देता है—उन्होंने उसे लौटाया; ‘वापस ले आए’ हिन्दी में स्वाभाविक रूप से यही अर्थ व्यक्त करता है।
- source_word: מִבּוֹר הַסִּרָה
  choice: सीरा के कुएँ से
  rationale: בּוֹר कुआँ, हौद या गड्ढा सूचित कर सकता है। यहाँ ‘सीरा का कुआँ’ पारंपरिक और सुबोध अर्थ है; स्थान-नाम की वैकल्पिक समझ पादटिप्पणी में रखी गई है।
- source_word: וְדָוִד לֹא יָדָע
  choice: पर दाऊद को इसका पता नहीं था
  rationale: यह योआब की कार्रवाई से दाऊद की अनभिज्ञता बताता है। ‘पर’ प्रसंग का विरोध स्पष्ट करता है और ‘इसका पता नहीं था’ आधुनिक हिन्दी में स्वाभाविक है।
