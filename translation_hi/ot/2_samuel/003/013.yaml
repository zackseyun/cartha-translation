  text: וַ/יֹּ֣אמֶר ט֔וֹב אֲנִ֕י אֶכְרֹ֥ת אִתְּ/ךָ֖ בְּרִ֑ית אַ֣ךְ דָּבָ֣ר אֶחָ֡ד אָנֹכִי֩ שֹׁאֵ֨ל מֵ/אִתְּ/ךָ֤ לֵ/אמֹר֙ לֹא תִרְאֶ֣ה אֶת פָּנַ֔/י כִּ֣י אִם לִ/פְנֵ֣י הֱבִיאֲ/ךָ֗ אֵ֚ת מִיכַ֣ל בַּת שָׁא֔וּל בְּ/בֹאֲ/ךָ֖ לִ/רְא֥וֹת אֶת פָּנָֽ/י־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/013.yaml
  text: 'He said[a], “Good. I will make a covenant with you. Only one thing I ask of you: You shall not see my face unless you first bring Michal, Saul’s daughter, when you come to see my face.”'
translation:
  language: hi
  text: 'उसने कहा, “अच्छा। मैं तुम्हारे साथ वाचा बाँधूँगा। पर मैं तुमसे केवल एक बात माँगता हूँ: तुम मेरा मुख नहीं देखोगे[a], जब तक कि मेरा मुख देखने आने पर तुम पहले शाऊल की बेटी मीकल को न ले आओ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम मेरे सामने उपस्थित नहीं होगे, जब तक कि मेरे सामने आने पर तुम पहले शाऊल की बेटी मीकल को न ले आओ।” इब्रानी में शाब्दिक रूप से “मेरा मुख देखना” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: अच्छा
  rationale: यह अब्नेर के प्रस्ताव पर संक्षिप्त सहमति व्यक्त करता है और इब्रानी की संक्षिप्तता बनाए रखता है।
- source_word: אֶכְרֹת ... בְּרִית
  choice: वाचा बाँधूँगा
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘वाचा काटना’ है; हिन्दी में ‘वाचा बाँधना’ स्वाभाविक और औपचारिक वाचागत अर्थ को सुरक्षित रखने वाला प्रयोग है।
- source_word: אַךְ דָּבָר אֶחָד אָנֹכִי שֹׁאֵל מֵאִתְּךָ
  choice: पर मैं तुमसे केवल एक बात माँगता हूँ
  rationale: यह एकमात्र शर्त या माँग को स्पष्ट करता है, बिना उसके बल को अनावश्यक रूप से ‘आज्ञा’ या ‘अनिवार्य माँग’ बनाने के।
- source_word: לֹא תִרְאֶה אֶת פָּנַי
  choice: तुम मेरा मुख नहीं देखोगे
  rationale: ‘मेरा मुख देखना’ मूल इब्रानी अभिव्यक्ति को बनाए रखता है; प्रसंग में इसका आशय राजा के सामने आने या उससे भेंट करने से भी हो सकता है।
- source_word: כִּי אִם לִפְנֵי הֱבִיאֲךָ
  choice: जब तक कि ... पहले ... न ले आओ
  rationale: यह अपवादात्मक शर्त और मीकल को पहले लाने की समयगत प्राथमिकता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִיכַל בַּת שָׁאוּל
  choice: शाऊल की बेटी मीकल
  rationale: पहचानसूचक इब्रानी पदबंध का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: בְּבֹאֲךָ לִרְאוֹת אֶת פָּנָי
  choice: जब तुम मेरा मुख देखने आते समय
  rationale: मूल में ‘मेरा मुख देखना’ की पुनरावृत्ति है; इसे अर्थगत जोर और वाक्य-संबंध बनाए रखने के लिए सुरक्षित रखा गया है। ‘आते समय’ आगमन की परिस्थिति बताता है।
theological_decisions:
- issue: ‘मुख देखना’ का दरबारी या व्यक्तिगत अर्थ
  choice: मुख्य पाठ में मूल अभिव्यक्ति ‘मेरा मुख देखना’ रखी गई
  alternative: ‘मेरे सामने उपस्थित होना’ या ‘मुझसे मिलने आना’
  rationale: मूल अभिव्यक्ति में प्रत्यक्ष भेंट और राजकीय उपस्थिति—दोनों की छाया संभव है; मुख्य पाठ को किसी एक अर्थ तक सीमित न करके विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘वाचा’ औपचारिक संबंध का अर्थ बनाए रखती है; ‘मुख’ मूल मुहावरे और उसके राजकीय भाव को सुरक्षित रखता है।
