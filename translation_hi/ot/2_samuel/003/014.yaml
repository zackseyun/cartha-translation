base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/014.yaml
  text: Then David sent messengers to Ish-bosheth son of Saul[a], saying, “Give me my wife Michal[b], whom I betrothed to myself for a hundred Philistine foreskins.”
translation:
  language: hi
  text: तब दाऊद ने शाऊल के पुत्र ईशबोशेत के पास दूत भेजकर कहा, “मेरी पत्नी मीकल को मुझे दे दो, जिससे मैंने अपने लिए सौ पलिश्तियों के अग्रचर्मों के बदले मंगनी की थी।”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक भावानुकूल अनुवाद: “जिसे मैंने सौ पलिश्तियों के अग्रचर्म देकर अपनी पत्नी के रूप में पाया था।” हिब्रू में अधिक शाब्दिक रूप से है, “जिससे मैंने अपने लिए मंगनी की थी।”'
    reason: lexical_alternative
  - marker: b
    text: देखें 1 शमूएल 18:25–27, जहाँ शाऊल द्वारा माँगे गए वधू-मूल्य के रूप में पलिश्तियों के अग्रचर्म देकर दाऊद के मीकल को पाने का वृत्तांत है।
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: तब दाऊद ने ... दूत भेजकर
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रम व्यक्त करता है, और ‘भेजकर कहा’ לֵאמֹר सहित वाक्य को सहज बनाता है।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: मानवीय संदेशवाहकों के लिए सामान्य और प्रसंगानुकूल हिन्दी शब्द।
- source_word: אֶל אִישׁ בֹּשֶׁת בֶּן שָׁאוּל
  choice: शाऊल के पुत्र ईशबोशेत के पास
  rationale: हिब्रू संबंध और नाम को स्पष्ट, स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: תְּנָה
  choice: मुझे दे दो
  rationale: נתן के आज्ञार्थक रूप का सीधा, वर्तमान हिन्दी समतुल्य; प्रसंग में दाऊद की मांग स्पष्ट रहती है।
- source_word: אֶת אִשְׁתִּי אֶת מִיכַל
  choice: मेरी पत्नी मीकल
  rationale: दोहराए गए कर्मचिह्न वाली समानाधिकरण संरचना को स्वाभाविक हिन्दी में संक्षिप्त किया गया है।
- source_word: אֲשֶׁר אֵרַשְׂתִּי לִי
  choice: मैंने ... उसे अपने लिए मंगनी की थी
  rationale: ארשׂ का विशिष्ट अर्थ मंगनी करना है; ‘अपने लिए’ לִי को बनाए रखता है और दाऊद के पूर्व वैवाहिक दावे को बिना समतल किए व्यक्त करता है।
- source_word: בְּמֵאָה עָרְלוֹת פְּלִשְׁתִּים
  choice: सौ पलिश्तियों की खलड़ियों के बदले
  rationale: בְּ यहाँ वधू-मूल्य या विनिमय का आधार बताता है। ‘खलड़ियाँ’ शरीर के अंग का सीधा हिन्दी नाम है और कठोर मूल अभिव्यक्ति को नरम नहीं करता।
theological_decisions:
- issue: मीकल की वैवाहिक स्थिति का शब्दांकन
  choice: אִשְׁתִּי को ‘मेरी पत्नी’ और אֵרַשְׂתִּי को ‘मंगनी की थी’ अनूदित किया गया है।
  alternative: दोनों को सामान्यीकृत करके ‘जिससे मैंने विवाह किया था’ कहना।
  rationale: मूल पाठ दाऊद द्वारा मीकल को ‘पत्नी’ कहने और अपने दावे को पूर्व मंगनी/वधू-मूल्य पर आधारित करने की वैधानिक-वैवाहिक तनातनी को बनाए रखता है; अनुवाद इसे चुपचाप सुलझाता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी, स्पष्ट और गरिमापूर्ण कथात्मक शैली। ‘खलड़ियों’ जैसे ठोस शब्द से मूल की कठोरता सुरक्षित रखी गई है। दोनों पाद-टिप्पणी चिह्न मुख्य पाठ में उसी दावे के बाद रखे गए हैं जिससे वे संबंधित हैं।
