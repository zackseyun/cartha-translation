reference: 2 Samuel 3:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יָחֻ֨לוּ֙ עַל רֹ֣אשׁ יוֹאָ֔ב וְ/אֶ֖ל כָּל בֵּ֣ית אָבִ֑י/ו וְֽ/אַל יִכָּרֵ֣ת מִ/בֵּ֣ית יוֹאָ֡ב זָ֠ב וּ/מְצֹרָ֞ע וּ/מַחֲזִ֥יק בַּ/פֶּ֛לֶךְ וְ/נֹפֵ֥ל בַּ/חֶ֖רֶב וַ/חֲסַר לָֽחֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/029.yaml
  text: May it fall on the head of Joab and on all his father’s house[a], and may there never be cut off from the house of Joab one who has a discharge, or is leprous, or holds a staff, or falls by the sword[b], or lacks bread.
translation:
  language: hi
  text: वे योआब के सिर पर और उसके पिता के पूरे घराने पर आ पड़ें। योआब के घराने में स्राव से पीड़ित, चर्मरोग से ग्रस्त[a], तकली पकड़नेवाला[b], तलवार से मारा जानेवाला या रोटी का मोहताज व्यक्ति कभी कम न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत अनुवाद ‘कोढ़ी’ है; इब्रानी शब्द आधुनिक हैन्सन रोग के अलावा अशुद्ध ठहराने वाले विभिन्न चर्मरोगों को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या संभवतः, “लाठी का सहारा लेनेवाला।” इब्रानी पद का सामान्य अर्थ ‘तकली पकड़नेवाला’ है, लेकिन इस वाक्यांश की व्याख्या अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחֻלוּ עַל רֹאשׁ
  choice: वे ... के सिर पर ... आ पड़ें
  rationale: बहुवचन क्रिया को बनाए रखता है; प्रसंग में इसका संकेत पिछले पद में उल्लिखित अब्नेर के बहाए गए खून अथवा उसके रक्त-दोष की ओर है। ‘सिर पर आ पड़ना’ दायित्व और दंड के लिए स्वाभाविक हिन्दी मुहावरा है।
- source_word: כָּל בֵּית אָבִיו
  choice: उसके पिता के सारे घराने
  rationale: पैतृक परिवार और वंश से जुड़े इब्रानी भाव को बिना अत्यधिक व्याख्या के व्यक्त करता है।
- source_word: אַל יִכָּרֵת מִבֵּית יוֹאָב
  choice: योआब के घराने में ... की कभी कमी न हो
  rationale: शाब्दिक ‘कभी काटा न जाए’ हिन्दी में अस्पष्ट होता। यह अभिशाप-सूत्र का आशय स्पष्ट करता है कि ये विपत्तियाँ उसके वंश में कभी समाप्त न हों।
- source_word: זָב
  choice: स्राव से पीड़ित
  rationale: दीर्घकालिक शारीरिक स्राव और उससे जुड़ी विधिगत अशुद्धता का संकेत देता है, पर रोग का अनावश्यक रूप से सटीक निदान नहीं करता।
- source_word: מְצֹרָע
  choice: गंभीर चर्मरोगी
  rationale: यह शब्द आधुनिक हैन्सन रोग तक सीमित नहीं है; व्यापक और गंभीर त्वचा-दशाओं को समेटने वाला अनुवाद चुना गया है।
- source_word: מַחֲזִיק בַּפֶּלֶךְ
  choice: तकली पकड़नेवाले
  rationale: פֶּלֶךְ का सामान्य ठोस अर्थ ‘तकली’ है। वाक्यांश का सामाजिक या शारीरिक निहितार्थ अनिश्चित होने के कारण चित्र को व्याख्यायित करने के बजाय सुरक्षित रखा गया है।
- source_word: נֹפֵל בַּחֶרֶב
  choice: तलवार से मारे जानेवाले
  rationale: इब्रानी मुहावरे ‘तलवार से गिरना’ का स्वाभाविक आधुनिक हिन्दी अर्थ देता है और हिंसक मृत्यु को स्पष्ट रखता है।
- source_word: חֲסַר לָחֶם
  choice: रोटी के मोहताज
  rationale: ‘रोटी’ के मूल बिंब और जीविका के अभाव—दोनों को सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: दाऊद के कथन का स्वरूप
  choice: योआब और उसके घराने के विरुद्ध न्याय की अभिशापात्मक कामना
  alternative: भविष्य में होने वाली घटनाओं की सीधी भविष्यवाणी
  rationale: कामनार्थक क्रिया-रूप और निषेधात्मक अभिशाप-सूत्र इसे केवल भविष्यवाणी नहीं, बल्कि दंड की कामना के रूप में प्रस्तुत करते हैं।
- issue: आरंभिक बहुवचन का संदर्भ
  choice: पिछले पद के रक्तपात/खून की ओर संकेत करने वाला ‘वे’
  alternative: निहित एकवचन ‘रक्त-दोष’ या ‘अभिशाप’
  rationale: इब्रानी क्रिया बहुवचन है और निकट प्रसंग में ‘अब्नेर का खून’ बहुवचन रूप में आया है। अनुवाद बहुवचन की वास्तविक व्याकरणिक अस्पष्टता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामान्य पाठक के लिए सुबोध रखी गई है। अभिशाप की कठोरता को नरम नहीं किया गया। सूची को सहज हिन्दी वाक्य-विन्यास में रखा गया है, जबकि ‘सिर पर आ पड़ना,’ ‘घराना,’ ‘तकली,’ ‘तलवार’ और ‘रोटी’ जैसे मूल बिंब सुरक्षित हैं।
