  rationale: यह स्थान-नाम है, इसलिए इसका अनुवाद न करके देवनागरी में लिप्यंतरण किया गया है।
- source_word: לֵךְ שׁוּב
  choice: जा, लौट जा
  rationale: दोनों आज्ञार्थक क्रियाओं को बनाए रखा गया है, जिससे मूल का जोर हिन्दी में स्पष्ट रहता है।
- source_word: וַיָּשֹׁב
  choice: और वह लौट गया
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘और’ मूल संयोजन को सरल, स्वाभाविक हिन्दी में बनाए रखता है।
