base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/027.yaml
  text: When Abner returned to Hebron[a], Joab drew him aside into the middle of the gate to speak with him privately, and there he struck him in the belly, so that he died, for the blood of Asahel his brother.
translation:
  language: hi
  text: जब अब्नेर हेब्रोन लौट आया, तब योआब उसे फाटक के भीतर एक ओर ले गया, ताकि उससे अकेले में बात करे। वहाँ उसने अब्नेर के पेट में वार किया[a], और वह मर गया। यह उसने अपने भाई असाहेल के खून के कारण किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में पारंपरिक रूप से: “पाँचवीं पसली में”; यहाँ आशय पेट या उदर के क्षेत्र पर वार करने से है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: लौट आया
  rationale: שׁוב का सामान्य अर्थ ‘लौटना’ है; प्रसंग में अब्नेर विदा किए जाने के बाद हेब्रोन वापस आया।
- source_word: וַיַּטֵּהוּ
  choice: उसे एक ओर ... ले गया
  rationale: हिफ़ील रूप यहाँ किसी को उसके मार्ग से मोड़कर अलग स्थान पर ले जाने का भाव देता है; यह दिशा और अलग किए जाने, दोनों को व्यक्त करता है।
- source_word: אֶל־תּוֹךְ הַשַּׁעַר
  choice: फाटक के बीच में
  rationale: תּוֹךְ मध्य या भीतरी भाग को और שַׁעַר फाटक अथवा उसके प्रवेश-क्षेत्र को दर्शाता है; यह अनुवाद स्थान की संरचना को अनावश्यक रूप से अधिक निश्चित नहीं करता।
- source_word: לְדַבֵּר אִתּוֹ בַּשֶּׁלִי
  choice: उससे अकेले में बात करे
  rationale: बַּשֶּׁלִי दुर्लभ और अर्थ की दृष्टि से कठिन है; इसमें निश्चिंतता, शांति, गोपनीयता या एकांत का भाव हो सकता है। प्रसंग में ‘अकेले में’ स्वाभाविक है, पर छल या बहाने का भाव नहीं जोड़ता।
- source_word: וַיַּכֵּהוּ שָׁם הַחֹמֶשׁ
  choice: वहाँ उसने अब्नेर के पेट में वार किया[a]
  rationale: חֹמֶשׁ का पारंपरिक अनुवाद ‘पाँचवीं पसली’ है, पर इन मृत्यु-वर्णनों में इससे पेट या उदर के क्षेत्र पर घातक वार समझा जाता है। ‘पेट में वार किया’ आधुनिक हिन्दी में स्पष्ट है; पारंपरिक रूप पादटिप्पणी में रखा गया है।
- source_word: וַיָּמָת
  choice: और वह मर गया
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘और वह मर गया’ इब्रानी की सरल घटनाक्रम-रचना को बनाए रखता है।
- source_word: בְּדַם עֲשָׂהאֵל אָחִיו
  choice: अपने भाई असाहेल के खून के कारण
  rationale: בְּ यहाँ कारण या प्रतिशोध की प्रेरणा व्यक्त करता है। ‘के कारण’ मूल की संक्षिप्तता रखता है और स्पष्ट रूप से ‘बदला लेने’ की व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: असाहेल के खून और योआब की कार्रवाई का संबंध
  choice: ‘खून के कारण’ के रूप में कारण व्यक्त किया गया
  alternative: ‘खून का बदला लेने के लिए’
  rationale: मूल पाठ कारण/प्रेरणा बताता है, पर योआब के कृत्य को स्पष्टतः वैध रक्त-प्रतिशोध घोषित नहीं करता; इसलिए अधिक व्याख्यात्मक विकल्प से बचा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘फाटक के बीच में’ मूल के स्थान-सूचक पद के निकट है। कठिन בַּשֶּׁלִי के लिए ‘अकेले में’ चुना गया है, जबकि उसकी वास्तविक अर्थगत अनिश्चितता को निर्णय-टिप्पणी में स्वीकार किया गया है। सर्वनाम-संदेह से बचने के लिए वार वाले वाक्य में ‘अब्नेर’ दोहराया गया है।
