base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/002.yaml
  text: Sons were born to David in Hebron[a], and his firstborn was Amnon, by Ahinoam the Jezreelitess.
translation:
  language: hi
  text: हेब्रोन में दाऊद के पुत्र जन्मे। उसका ज्येष्ठ पुत्र अम्नोन था, जो यिज्रेल की रहनेवाली[a] अहीनोअम से हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यिज्रेली स्त्री” अथवा “यिज्रेल की स्त्री।”
    reason: हिब्रू में स्त्रीलिंग स्थानवाची विशेषण है, जिसे हिन्दी में विशेषण या मूल-स्थान बताने वाले वाक्यांश के रूप में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: ו/ילדו
  choice: उत्पन्न हुए
  rationale: हिब्रू क्रिया यहाँ निष्क्रिय/अव्यक्त भाव में है और पुत्रों के जन्म पर बल देती है; ‘उत्पन्न हुए’ वंशावली-संदर्भ में स्वाभाविक और गरिमापूर्ण है।
- source_word: לְ/דָוִד
  choice: दाऊद के
  rationale: हिन्दी में ‘दाऊद के पुत्र उत्पन्न हुए’ उस संबंध को स्वाभाविक ढंग से व्यक्त करता है जिसे हिब्रू ל चिह्नित करता है।
- source_word: בָּנִים
  choice: पुत्र
  rationale: हिब्रू शब्द विशेष रूप से पुरुष संतानों को सूचित करता है, इसलिए सामान्य ‘सन्तानें’ के बजाय ‘पुत्र’ चुना गया।
- source_word: בְּ/חֶבְרוֹן
  choice: हेब्रोन में
  rationale: स्थानसूचक ב का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: בְכוֹר/וֹ
  choice: उसका पहलौठा
  rationale: ‘पहलौठा’ जन्मक्रम तथा संभावित पारिवारिक-कानूनी महत्व—दोनों को ‘सबसे बड़ा’ से अधिक ठीक प्रकार बनाए रखता है।
- source_word: אַמְנוֹן
  choice: अम्नोन
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: לַ/אֲחִינֹעַם
  choice: अहीनोअम से जन्मा था
  rationale: इस जन्म-सूची में ל मातृत्व-संबंध बताता है; हिन्दी में ‘से जन्मा था’ अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: הַ/יִּזְרְעֵאלִת
  choice: यिज्रेल की रहनेवाली
  rationale: स्त्रीलिंग स्थानवाची विशेषण को साधारण आधुनिक हिन्दी में उसके मूल-स्थान के संकेत सहित व्यक्त किया गया है।
