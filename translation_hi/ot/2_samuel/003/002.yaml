  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। अंग्रेज़ी परामर्श-पाठ में पाद-टिप्पणी का चिह्न ‘Hebron’ के बाद था, पर टिप्पणी वास्तव में הַיִּזְרְעֵאלִת से संबंधित है; इसलिए हिन्दी मुख्य पाठ में [a] को ‘यिज्रेल की रहनेवाली’ के बाद रखा गया है।
