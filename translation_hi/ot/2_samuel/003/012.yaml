  edition: WLC
  text: וַ/יִּשְׁלַח֩ אַבְנֵ֨ר מַלְאָכִ֧ים אֶל דָּוִ֛ד תחת/ו לֵ/אמֹ֖ר לְ/מִי אָ֑רֶץ לֵ/אמֹ֗ר כָּרְתָ֤/ה בְרִֽיתְ/ךָ֙ אִתִּ֔/י וְ/הִנֵּה֙ יָדִ֣/י עִמָּ֔/ךְ לְ/הָסֵ֥ב אֵלֶ֖י/ךָ אֶת כָּל יִשְׂרָאֵֽל׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/012.yaml
  text: Then Abner sent messengers to David on his behalf[a], saying, “To whom does the land belong?” saying, “Make your covenant with me, and behold[b], my hand is with you to bring all Israel over to you.”
translation:
  language: hi
  text: तब अब्नेर ने अपनी ओर से[a] दाऊद के पास दूत भेजकर यह कहलवाया, “देश किसका है?”[b] उसने यह भी कहा, “मेरे साथ अपनी वाचा बाँधिए। देखिए, मेरा हाथ आपके साथ है[c], और मैं सारे इस्राएल को आपकी ओर मोड़ दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से इसका अर्थ “उसके स्थान पर” भी लिया जा सकता है; यहाँ भाव है कि दूत अब्नेर का प्रतिनिधित्व कर रहे थे।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी प्रश्न बहुत संक्षिप्त है और देश पर अधिकार या उचित शासन के दावे की ओर संकेत कर सकता है।
    reason: ambiguity
  - marker: c
    text: “मेरा हाथ आपके साथ है” समर्थन, सामर्थ्य और प्रभाव देने का मुहावरा है।
    reason: idiom
lexical_decisions:
- source_word: תחתו
  choice: अपनी ओर से
  rationale: यहाँ תחתו दूत भेजने में अब्नेर की ओर से प्रतिनिधित्व का भाव देता है। यह हिन्दी में स्वाभाविक है और राजनीतिक संदर्भ के अनुकूल है।
- source_word: לְמִי אָרֶץ
  choice: देश किसका है?
  rationale: संक्षिप्त इब्रानी प्रश्न को संक्षिप्त ही रखा गया है। ‘देश’ यहाँ भूभाग के साथ उस पर अधिकार या शासन का संकेत भी दे सकता है।
- source_word: כָּרְתָה בְרִיתְךָ אִתִּי
  choice: मेरे साथ अपनी वाचा बाँधिए
  rationale: כרת ברית का सामान्य अर्थ वाचा बाँधना है। ‘अपनी’ संज्ञा पर लगे द्वितीय पुरुष प्रत्यय को व्यक्त करता है। आदरसूचक क्रिया दाऊद को संबोधन के लिए स्वाभाविक हिन्दी है।
- source_word: וְהִנֵּה יָדִי עִמָּךְ
  choice: देखिए, मेरा हाथ आपके साथ है
  rationale: ‘हाथ’ का मूल रूपक बनाए रखा गया है; यह अब्नेर के समर्थन, प्रभाव और सामर्थ्य का राजनीतिक आशय रखता है।
- source_word: לְהָסֵב אֵלֶיךָ
  choice: आपकी ओर मोड़ दूँगा
  rationale: यहाँ क्रिया राजनीतिक निष्ठा को दाऊद की ओर फेरने का भाव देती है। ‘ओर मोड़ना’ दिशात्मक अर्थ और रूपक दोनों को बनाए रखता है।
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल
  rationale: यह पूरे सामूहिक राष्ट्र अथवा गोत्रों को सूचित करता है, केवल अलग-अलग व्यक्तियों को नहीं।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: इस राजनीतिक प्रसंग में यह शब्द मानवीय संदेशवाहकों के लिए है; ‘दूत’ हिन्दी में स्पष्ट और प्रचलित है।
theological_decisions:
- issue: לְמִי אָרֶץ में अब्नेर के प्रश्न का आशय
  choice: इसे सीधे प्रश्न ‘देश किसका है?’ के रूप में रखा गया
  alternative: ‘देश मेरे अधिकार में है’ अथवा ‘देश पर किसे शासन करना चाहिए?’
  rationale: इब्रानी कथन संक्षिप्त और कुछ हद तक अर्थगर्भित है। प्रश्नरूप बनाए रखने से यह अनिर्णीत रहता है कि अब्नेर उचित राजत्व की बात कर रहा है या देश की निष्ठा बदल सकने के अपने प्रभाव का दावा कर रहा है।
- issue: ‘मेरा हाथ आपके साथ है’ का रूपक
  choice: ‘हाथ’ का रूपक मुख्य पाठ में सुरक्षित रखा गया
  alternative: ‘मैं आपका समर्थन करूँगा’
  rationale: स्पष्ट व्याख्या अधिक सहज होती, पर मूल में हाथ समर्थन के साथ सामर्थ्य और प्रभाव भी व्यक्त करता है; इसलिए रूपक को सपाट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। दाऊद के लिए आदरसूचक ‘आप’ और ‘बाँधिए’ प्रयुक्त हैं। दो बार आए לֵאמֹר को जड़वत दोहराने के बजाय ‘यह कहलवाया’ और ‘यह भी कहा’ से संरचनात्मक पुनरावृत्ति सुरक्षित रखते हुए स्वाभाविक हिन्दी दी गई है।
