source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ אֶל עֲבָדָ֑י/ו הֲ/ל֣וֹא תֵדְע֔וּ כִּי שַׂ֣ר וְ/גָד֗וֹל נָפַ֛ל הַ/יּ֥וֹם הַ/זֶּ֖ה בְּ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/038.yaml
  text: Then the king said to his servants[a], “Do you not know that a prince and a great man has fallen today in Israel?”
translation:
  language: hi
  text: तब राजा ने अपने सेवकों से कहा, “क्या तुम नहीं जानते कि आज इस्राएल में एक प्रधान और महान पुरुष गिर पड़ा है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित संज्ञा का सीधा अनुवाद; प्रसंग दाऊद की पहचान स्पष्ट करता है, इसलिए नाम जोड़ना आवश्यक नहीं।
- source_word: עֲבָדָיו
  choice: अपने सेवकों से
  rationale: राजकीय प्रसंग में עֶבֶד के मूल अर्थ ‘सेवक’ को बनाए रखता है; ‘अधिकारियों’ से पद का अनावश्यक निर्धारण हो सकता है।
- source_word: הֲלוֹא תֵדְעוּ
  choice: क्या तुम नहीं जानते
  rationale: निषेधयुक्त प्रश्नवाचक रचना सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न है; यह रूप उसके बल को सुरक्षित रखता है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי उस बात की विषयवस्तु प्रस्तुत करता है जिसे श्रोताओं को जानना चाहिए।
- source_word: שַׂר
  choice: प्रधान
  rationale: שַׂר किसी प्रमुख, शासक, सेनापति या उच्च अधिकारी को सूचित कर सकता है। अब्नेर के सैनिक-राजनीतिक महत्व को देखते हुए ‘प्रधान’ गरिमा और व्यापकता दोनों बनाए रखता है, बिना उसे राजवंशीय ‘राजकुमार’ ठहराए।
- source_word: וְגָדוֹל
  choice: और महान पुरुष
  rationale: विशेषण यहाँ संज्ञा के समान प्रयुक्त होकर व्यक्ति की प्रतिष्ठा और महत्ता पर बल देता है; ‘महान पुरुष’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: נָפַל
  choice: गिर पड़ा है
  rationale: मृत्यु के लिए प्रयुक्त ऊँची शैली के रूपक ‘गिरना’ को बनाए रखता है और पूर्ण घटना की वर्तमान प्रासंगिकता व्यक्त करता है।
- source_word: הַיּוֹם הַזֶּה
  choice: आज
  rationale: शाब्दिक ‘इस दिन’ का स्वाभाविक आधुनिक हिन्दी समतुल्य।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल में
  rationale: राष्ट्रीय क्षेत्र के भीतर हुई इस उल्लेखनीय मृत्यु को स्वाभाविक ढंग से व्यक्त करता है।
