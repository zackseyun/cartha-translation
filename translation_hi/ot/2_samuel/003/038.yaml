  register: आधुनिक मानक हिन्दी; वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रखा गया है। ‘प्रधान’ शַׂר की व्यापक पद-संबंधी अर्थछाया को सुरक्षित रखता है, और ‘गिर पड़ा है’ मृत्यु के मूल इब्रानी रूपक को बनाए रखता है।
