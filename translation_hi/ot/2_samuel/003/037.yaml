base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/037.yaml
  text: So all the people and all Israel knew on that day that it was not from the king to put Abner son of Ner to death[a].
translation:
  language: hi
  text: तब उस दिन सब लोगों और सारे इस्राएल ने जान लिया कि नेर के पुत्र अब्नेर को मार डालना राजा की ओर से नहीं था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘यह राजा की ओर से नहीं था’ अथवा ‘राजा ने इसका आदेश नहीं दिया था।’ इब्रानी में इस बात के स्रोत या उद्गम पर बल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדְעוּ
  choice: जान लिया
  rationale: यह रूप किसी तथ्य को जान लेने या पहचान लेने का वर्णन करता है; ‘जान लिया’ कथा में उस समय बनी समझ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָל הָעָם וְכָל יִשְׂרָאֵל
  choice: सब लोगों और सारे इस्राएल
  rationale: इब्रानी के दोनों सामूहिक पदों को अलग-अलग बनाए रखता है और ‘इस्राएल’ के राष्ट्रीय, सामूहिक अर्थ को सुरक्षित रखता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: सामान्य कालवाचक अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: לֹא הָיְתָה מֵהַמֶּלֶךְ
  choice: राजा की ओर से नहीं आई थी
  rationale: ‘की ओर से’ स्रोत या उद्गम के इब्रानी भाव को बनाए रखता है; ‘नहीं आई थी’ हिन्दी में इस मुहावरे को पठनीय बनाता है और राजा की कानूनी निर्दोषता या स्पष्ट आज्ञा के बारे में अतिरिक्त दावा नहीं जोड़ता।
- source_word: לְהָמִית
  choice: मार डालने
  rationale: हिफ़ील रूप के ‘मृत्यु का कारण बनने’ के अर्थ को स्पष्ट करता है, पर ‘मृत्युदंड देना’ जैसे न्यायिक आशय को नहीं जोड़ता।
- source_word: אֶת אַבְנֵר בֶּן נֵר
  choice: नेर के पुत्र अब्नेर को
  rationale: वंशसूचक संबंध को स्पष्ट, मानक हिन्दी क्रम में रखा गया है और व्यक्तिनामों का लिप्यंतरण किया गया है।
theological_decisions:
- issue: अब्नेर की मृत्यु में दाऊद की संलिप्तता का स्तर
  choice: हत्या की बात राजा की ओर से नहीं आई थी
  alternative: राजा निर्दोष था; अथवा राजा ने हत्या की आज्ञा नहीं दी थी
  rationale: इब्रानी कथन स्रोत या उद्गम पर केंद्रित है। यह कानूनी निर्दोषता या किसी स्पष्ट आदेश के अभाव को सीधे नहीं कहता, इसलिए अनुवाद उसी सीमित दावे और उसके तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘सब लोगों’ और ‘सारे इस्राएल’ की इब्रानी पुनरुक्ति जानबूझकर सुरक्षित रखी गई है। मुख्य पाठ में स्रोत-संबंधी मुहावरा रखा गया है और अधिक व्याख्यात्मक विकल्प पादटिप्पणी में दिए गए हैं।
