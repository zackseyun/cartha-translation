  text: May God do so to Abner[a], and more also, if, just as Yahweh has sworn to David, so I do for him—
translation:
  language: hi
  text: परमेश्वर अब्नेर के साथ ऐसा ही करे, और उससे भी अधिक करे, क्योंकि जैसे याहवे ने दाऊद से जो शपथ खाई है, वैसे ही मैं उसके लिए करूँगा—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה אֱלֹהִים לְאַבְנֵר וְכֹה יֹסִיף לוֹ
  choice: परमेश्वर अब्नेर के साथ ऐसा ही करे, बल्कि इससे भी अधिक करे
  rationale: यह इब्रानी की प्रचलित आत्म-दंडात्मक शपथ-विधि है। वक्ता अपने लिए तीसरे पुरुष में अपना नाम ‘अब्नेर’ कहता है; हिन्दी में इसे बनाए रखने से शपथ की औपचारिक तीव्रता सुरक्षित रहती है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ शब्द एकवचन अर्थ में इस्राएल के परमेश्वर के लिए प्रयुक्त है; ‘परमेश्वर’ सहज और गरिमापूर्ण हिन्दी है।
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसा ... जैसा
  rationale: यह याहवे की शपथ और अब्नेर के संकल्प के बीच स्पष्ट अनुरूपता व्यक्त करता है।
- source_word: נִשְׁבַּע
  choice: शपथ खाई है
  rationale: पूर्ण क्रिया अतीत में ली गई ऐसी शपथ बताती है जिसका प्रभाव वर्तमान प्रसंग में बना हुआ है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: כִּי כֵן אֶעֱשֶׂה לוֹ
  choice: यदि मैं दाऊद के लिए ठीक वैसा न करूँ
  rationale: शपथ-विधि में निहित शर्त को स्वाभाविक हिन्दी में स्पष्ट किया गया है। नकार मूल में प्रत्यक्ष नहीं है, पर आत्म-दंडात्मक शपथ के अर्थ में निहित है; सकारात्मक, भविष्याभिमुख संरचना को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में विशिष्ट वाचा-नाम है। ‘याहवे’ उसका सीधा लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: अब्नेर की शपथ में निहित शर्त
  choice: यदि मैं ... न करूँ
  alternative: जैसा याहवे ने दाऊद से शपथ खाई है, वैसा ही मैं उसके लिए करूँगा
  rationale: मुख्य पाठ में इब्रानी आत्म-दंडात्मक शपथ का व्यवहारगत अर्थ स्वाभाविक हिन्दी में दिया गया है। चूँकि मूल अंतिम खंड को सकारात्मक रूप में भी पढ़ने देता है, उस संरचना को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के अनुकूल रखी गई है। ‘बल्कि इससे भी अधिक’ शपथ की तीव्रता व्यक्त करता है। वाक्य के अंत का दीर्घ विराम अगले पद में जारी कथन को दर्शाता है।
