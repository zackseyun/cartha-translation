  text: Abner also spoke in the hearing of Benjamin[b][a], and Abner also went to speak in the hearing of David at Hebron all that seemed good in the eyes of Israel and in the eyes of the whole house of Benjamin.
translation:
  language: hi
  text: अब्नेर ने बिन्यामीन के लोगों से भी बात की, और अब्नेर हेब्रोन में दाऊद से वह सब कहने भी गया जो इस्राएल की दृष्टि में और बिन्यामीन के पूरे घराने की दृष्टि में अच्छा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּאָזְנֵי
  choice: से बात की / को बताए
  rationale: शाब्दिक अर्थ ‘कानों में’ है, पर यहाँ यह बोलने-सुनाने का मुहावरा है। दोनों प्रसंगों में स्वाभाविक हिन्दी के अनुसार अलग किंतु समतुल्य रूप रखे गए हैं।
- source_word: בִנְיָמִין
  choice: बिन्यामीन के लोग
  rationale: पहला प्रयोग गोत्र के लोगों के लिए सामूहिक नाम है; हिन्दी में केवल ‘बिन्यामीन’ कहने से व्यक्ति का भ्रम हो सकता है।
- source_word: לְדַבֵּר
  choice: बताए
  rationale: दाऊद के सामने प्रस्ताव अथवा सहमति की बात पहुँचाने के प्रसंग में ‘बताए’ स्वाभाविक है और क्रिया का अर्थ अनावश्यक रूप से विस्तृत नहीं करता।
- source_word: בְּחֶבְרוֹן
  choice: हेब्रोन
  rationale: गति-सूचक ‘गया’ के साथ स्थान का नाम बिना अतिरिक्त परसर्ग के स्वाभाविक हिन्दी देता है।
- source_word: אֵת כָּל אֲשֶׁר טוֹב בְּעֵינֵי
  choice: वह सब ... जो ... को अच्छा लगा था
  rationale: ‘आँखों में अच्छा’ का स्रोत-मुहावरा स्वीकृति या प्रसन्नता दर्शाता है; यह रूप अर्थ को स्पष्ट और सहज रखता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: यहाँ राष्ट्र अथवा उसके लोगों के लिए सामूहिक नाम है और बिन्यामीन के घराने के साथ रखा गया है।
- source_word: כָּל בֵּית בִּנְיָמִן
  choice: बिन्यामीन का पूरा घराना
  rationale: ‘घराना’ मूल के पारिवारिक-गोत्रीय भाव को बनाए रखता है, जबकि ‘पूरा’ כָּל के समग्र अर्थ को व्यक्त करता है।
- source_word: גַּם ... גַּם
  choice: भी ... फिर
  rationale: पहला ‘भी’ पिछली गतिविधि से जोड़ता है; दूसरे स्थान पर हिन्दी कथन-प्रवाह में ‘फिर’ उसी अतिरिक्त अगले कार्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיְדַבֵּר ... וַיֵּלֶךְ
  choice: बात की ... गया
  rationale: सरल भूतकालीन कथात्मक क्रियाएँ मूल घटनाक्रम को स्पष्ट रखती हैं।
