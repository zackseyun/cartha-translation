base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/018.yaml
  text: Now then[a], do it, for Yahweh has spoken concerning David, saying, ‘By the hand of my servant David I will save my people Israel from the hand of the Philistines and from the hand of all their enemies.’
translation:
  language: hi
  text: तो अब[a] यह करो, क्योंकि यहोवा ने दाऊद के विषय में कहा है, ‘अपने सेवक दाऊद के हाथ से मैं अपनी प्रजा इस्राएल को पलिश्तियों के हाथ से और उनके सभी शत्रुओं के हाथ से बचाऊँगा।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तो अब यह करो, क्योंकि यहोवा ने दाऊद के विषय में कहा है, ‘मेरा सेवक दाऊद मेरी प्रजा इस्राएल को पलिश्तियों के हाथ से और उनके सभी शत्रुओं के हाथ से बचाएगा।’” हिब्रू वाक्य को दाऊद के कर्ता होने के रूप में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह पद पिछले विचार से वर्तमान कार्रवाई की ओर संक्रमण कराता है; ‘इसलिए अब’ प्रसंगगत निष्कर्ष और तात्कालिकता दोनों व्यक्त करता है।
- source_word: עֲשׂוּ
  choice: ऐसा करो
  rationale: द्वितीय पुरुष बहुवचन आज्ञार्थक रूप प्रस्तावित कार्य को पूरा करने की सीधी आज्ञा देता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आज्ञा का आधार प्रस्तुत करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में परमेश्वर के व्यक्तिगत नाम के परिचित लिप्यंतरण को रखा गया है।
- source_word: אָמַר אֶל דָּוִד לֵאמֹר
  choice: दाऊद के विषय में कहा है
  rationale: यद्यपि אֶל सामान्यतः ‘से/को’ है, अब्नेर जिस कथन को उद्धृत करता है उसमें दाऊद तृतीय पुरुष में ‘मेरे सेवक’ कहलाता है; इसलिए यहाँ ‘दाऊद के विषय में’ प्रसंग में अधिक सुसंगत है।
- source_word: בְּיַד דָּוִד עַבְדִּי
  choice: अपने सेवक दाऊद के हाथ से
  rationale: ‘हाथ से’ साधन या माध्यम के हिब्रू मुहावरे को बनाए रखता है और दाऊद की नियुक्त भूमिका स्पष्ट करता है।
- source_word: הוֹשִׁיעַ
  choice: मैं ... बचाऊँगा
  rationale: रूप स्वरचिह्नित पाठ में होशीअ, प्रथम पुरुष एकवचन हिफ़ील, है; उद्धृत वाणी में यहोवा वक्ता और उद्धारकर्ता हैं।
- source_word: עַמִּי יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल
  rationale: वाचा-संबंधी स्वामित्व और जातीय नाम दोनों स्वाभाविक हिन्दी क्रम में सुरक्षित हैं।
- source_word: מִיַּד פְּלִשְׁתִּים וּמִיַּד כָּל אֹיְבֵיהֶם
  choice: पलिश्तियों के हाथ से और उनके सब शत्रुओं के हाथ से
  rationale: दोहराए गए ‘हाथ से’ मुहावरे और כָּל की व्यापकता को सुरक्षित रखा गया है।
theological_decisions:
- issue: הוֹשִׁיעַ का कर्ता
  choice: 'यहोवा: ‘मैं ... बचाऊँगा’'
  alternative: 'दाऊद: ‘मेरा सेवक दाऊद ... बचाएगा’'
  rationale: WLC का स्वरचिह्नित रूप הוֹשִׁיעַ प्रथम पुरुष एकवचन को दर्शाता है, अतः मुख्य पाठ में यहोवा को उद्धार का कर्ता और दाऊद को माध्यम रखा गया है। फिर भी संभावित वैकल्पिक वाक्य-संबंध को पादटिप्पणी में दर्ज किया गया है।
- issue: אָמַר אֶל דָּוִד का संबंध
  choice: ‘दाऊद के विषय में कहा है’
  alternative: ‘दाऊद से कहा है’
  rationale: אֶל का सामान्य अर्थ ‘से/को’ हो सकता है, पर उद्धरण में ‘अपने सेवक दाऊद’ का तृतीय-पुरुष उल्लेख इसे दाऊद के विषय में कही गई वाणी समझने के पक्ष में है।
