  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘प्रजा’, ‘सेवक’ और ‘के हाथ से’ जैसे परिचित बाइबलीय पद साहित्यिक बनावट और मूल के मुहावरों को सुरक्षित रखते हैं।
