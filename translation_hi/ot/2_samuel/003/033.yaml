  to: तब राजा ने अब्नेर पर विलाप किया और कहा, “क्या अब्नेर को मूर्ख की मौत मरना था?”
  rationale: 'The revision changes only the introduction from «अब्नेर के लिए विलाप करते हुए कहा» to «अब्नेर पर विलाप किया और कहा» to represent the formal lament verb more directly and to preserve the Hebrew sequence of lamenting and speaking. The quoted rhetorical question is retained: its idiomatic Hindi conveys the protest and grief of the Hebrew without overexplaining the morally disgraceful sense of «मूर्ख».'
