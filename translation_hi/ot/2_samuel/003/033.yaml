  yaml_path: translation/ot/2_samuel/003/033.yaml
  text: And the king lamented over Abner and said[a], “Should Abner die as a fool dies?”
translation:
  language: hi
  text: तब राजा ने अब्नेर पर विलाप किया और कहा, “क्या अब्नेर को मूर्ख की मौत मरना था?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְקֹנֵן
  choice: विलाप करते हुए
  rationale: क्रिया קונן औपचारिक शोकगीत या विलाप करने को दर्शाती है। यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक है और अगले उद्धृत काव्य-वचन से भी जुड़ती है।
- source_word: אֶל אַבְנֵר
  choice: अब्नेर के लिए
  rationale: विलाप की क्रिया के साथ אֶל विलाप के विषय या व्यक्ति को सूचित करता है। हिन्दी में ‘अब्नेर के लिए विलाप’ स्वाभाविक है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: यह निश्चित संज्ञा कथा-संदर्भ में दाऊद को सूचित करती है; मूल की भाँति उपाधि को बनाए रखा गया है।
- source_word: וַיֹּאמַר
  choice: कहा
  rationale: मूल में सामान्य कथात्मक ‘कहना’ क्रिया है, इसलिए काव्यात्मक प्रसंग के बावजूद सरल ‘कहा’ उपयुक्त है।
- source_word: הַכְּמוֹת נָבָל
  choice: मूर्ख की मौत
  rationale: शाब्दिक भाव ‘मूर्ख की मृत्यु के समान’ है। ‘मूर्ख की मौत मरना’ हिन्दी का स्वाभाविक तुलनात्मक मुहावरा है और अपमानजनक प्रकार की मृत्यु का भाव बनाए रखता है।
- source_word: יָמוּת
  choice: मरना था
  rationale: अपूर्ण क्रिया यहाँ विलापपूर्ण आलंकारिक प्रश्न में आती है। ‘क्या ... मरना था?’ दुःख और विरोध दोनों को स्वाभाविक हिन्दी में व्यक्त करता है, बिना अनिवार्यता को सिद्धान्ततः तय किए।
- source_word: נָבָל
  choice: मूर्ख
  rationale: נָבָל बौद्धिक मूर्खता के साथ नैतिक नीचता या अपमान का भाव भी रख सकता है। ‘मूर्ख’ सीधा और पारंपरिक समतुल्य है; प्रसंग शर्मनाक मृत्यु का गहरा भाव देता है।
- source_word: אַבְנֵר
  choice: अब्नेर
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है।
