source:
  edition: WLC
  text: וְ/הַ/שִּׁשִּׁ֣י יִתְרְעָ֔ם לְ/עֶגְלָ֖ה אֵ֣שֶׁת דָּוִ֑ד אֵ֛לֶּה יֻלְּד֥וּ לְ/דָוִ֖ד בְּ/חֶבְרֽוֹן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/005.yaml
  text: and the sixth[a], Ithream, by Eglah, David’s wife. These were born to David in Hebron.
translation:
  language: hi
  text: और छठा यित्राम था, जो दाऊद की पत्नी[a] एग्ला से हुआ। ये दाऊद के पुत्र हेब्रोन में पैदा हुए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “दाऊद की पत्नी” है। प्रसंग में एग्ला को दाऊद की पत्नियों में से एक बताया गया है; इसका अर्थ यह नहीं कि वही उसकी एकमात्र पत्नी थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשִּׁשִּׁי
  choice: और छठा
  rationale: संयोजक और क्रमवाचक शब्द पिछली आयतों में दी गई दाऊद के पुत्रों की सूची को आगे बढ़ाते हैं। ‘पुत्र’ प्रसंग से स्पष्ट है और अगले वाक्य में व्यक्त किया गया है।
- source_word: יִתְרְעָם
  choice: यित्राम
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित और सहज देवनागरी लिप्यंतरण।
- source_word: לְעֶגְלָה
  choice: एग्ला से
  rationale: इस वंशावली-सूत्र में לְ माता को सूचित करता है; आधुनिक हिन्दी में मातृत्व बताने के लिए ‘से हुआ’ स्वाभाविक है।
- source_word: אֵשֶׁת דָּוִד
  choice: दाऊद की पत्नी
  rationale: इब्रानी संबंधवाचक रचना का सीधा और स्वाभाविक हिन्दी रूप; यह अपने आप यह दावा नहीं करती कि एग्ला दाऊद की एकमात्र पत्नी थी।
- source_word: אֵלֶּה
  choice: ये
  rationale: यह संकेतवाचक शब्द पिछली पूरी सूची का सार प्रस्तुत करता है।
- source_word: יֻלְּדוּ לְדָוִד
  choice: दाऊद के पुत्र ... पैदा हुए थे
  rationale: यָלַד के कर्मवाच्य और לְדָוִד का आशय दाऊद से पुत्र-संबंध है। हिन्दी में यह रूप स्पष्ट और स्वाभाविक है तथा अनावश्यक रूप से कर्तृत्व की व्याख्या नहीं करता।
- source_word: בְּחֶבְרוֹן
  choice: हेब्रोन में
  rationale: पूर्वसर्ग स्थान को सूचित करता है, अर्थात इन पुत्रों का जन्म हेब्रोन में हुआ।
theological_decisions:
- issue: ‘दाऊद की पत्नी’ से संभावित एकमात्र-पत्नी का अर्थ
  choice: मुख्य पाठ में इब्रानी का सीधा रूप ‘दाऊद की पत्नी’ रखा और टिप्पणी में प्रसंग स्पष्ट किया।
  alternative: ‘दाऊद की एक पत्नी’
  rationale: ‘एक पत्नी’ प्रसंगगत अर्थ को स्पष्ट करता, पर इब्रानी में संख्या ‘एक’ नहीं है। इसलिए मूल की रचना सुरक्षित रखते हुए संभावित गलतफहमी को पाद-टिप्पणी में दूर किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। पहले वाक्य में सूची की संक्षिप्त शैली बनाए रखी गई, जबकि निहित जन्म-संबंध को ‘जो ... से हुआ’ द्वारा स्वाभाविक हिन्दी में व्यक्त किया गया है।
