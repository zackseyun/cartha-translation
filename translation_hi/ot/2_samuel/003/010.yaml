base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/010.yaml
  text: to transfer the kingdom from the house of Saul and to establish the throne of David over Israel and over Judah[a], from Dan to Beer-sheba.
translation:
  language: hi
  text: कि राज्य को शाऊल के घराने से स्थानांतरित करके दाऊद के सिंहासन को इस्राएल पर और यहूदा पर—दान से लेकर बेर्शेबा तक[a]—स्थापित करूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दान से लेकर बेर्शेबा तक’ उत्तर से दक्षिण तक पूरे देश को सूचित करने वाला भौगोलिक मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: לְהַעֲבִיר
  choice: हटाकर
  rationale: हिफ़ील रूप यहाँ राज्य को एक राजवंश से दूसरे को सौंपे जाने का भाव देता है। हिंदी में ‘हटाकर’ स्रोत के कारणात्मक और राजनीतिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַמַּמְלָכָה
  choice: राज्य
  rationale: यह शब्द राज्य, राजसत्ता या शाही शासन को सूचित कर सकता है। यहाँ ‘राज्य’ व्यापक और स्वाभाविक है तथा संदर्भ में सत्ता के हस्तांतरण का अर्थ स्पष्ट रखता है।
- source_word: מִבֵּית שָׁאוּל
  choice: शाऊल के घराने से
  rationale: ‘घराना’ हिंदी में परिवार के साथ राजवंश का भाव भी रखता है और इब्रानी ‘घर’ की वंशगत छवि को सहजता से सुरक्षित करता है।
- source_word: וּלְהָקִים
  choice: स्थापित करूँ
  rationale: हिफ़ील में यहाँ किसी शासन या सिंहासन को दृढ़ता से कायम करने का अर्थ है। प्रथम पुरुष क्रिया का प्रयोग पिछले पद में आरंभ हुई शपथ की वाक्य-रचना के अनुरूप है।
- source_word: אֶת כִּסֵּא דָוִד
  choice: दाऊद के सिंहासन को
  rationale: ‘सिंहासन’ स्रोत की ठोस राजकीय छवि को बनाए रखता है और उसे केवल अमूर्त ‘शासन’ में नहीं बदलता।
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה
  choice: इस्राएल और यहूदा पर
  rationale: ‘पर’ राजकीय अधिकार का अर्थ देता है। हिंदी में इसे दोनों नामों के बाद अलग-अलग दोहराना अस्वाभाविक होता, जबकि संयुक्त पद मूल का दोहरा राजनीतिक क्षेत्र स्पष्ट रखता है।
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: दान से लेकर बेर्शेबा तक
  rationale: यह उत्तर से दक्षिण तक पूरे देश को सूचित करने वाला भौगोलिक मुहावरा है। ‘से लेकर ... तक’ सीमा-विस्तार को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בְּאֵר שָׁבַע
  choice: बेर्शेबा
  rationale: यह आधुनिक हिंदी पाठकों के लिए प्रचलित और पठनीय लिप्यंतरण है।
theological_decisions:
- issue: ‘शाऊल का घराना’ और ‘दाऊद का सिंहासन’ में राजवंशीय तथा राजकीय भाषा
  choice: ठोस बाइबलीय बिंबों को ‘घराना’ और ‘सिंहासन’ के रूप में बनाए रखा गया।
  alternative: शाऊल के राजवंश से राजसत्ता लेकर दाऊद का शासन स्थापित करूँ
  rationale: मूल राजनीतिक सत्ता के हस्तांतरण की बात करता है, पर उसे ‘घर’ और ‘सिंहासन’ की ठोस भाषा में व्यक्त करता है। इन बिंबों को बनाए रखने से पाठ की राजवंशीय बनावट सुरक्षित रहती है और बाद की कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ी जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। यह पद पिछले पद में आरंभ हुई शपथ का आश्रित अंश है; इसलिए आरंभ में ‘कि’ और अंत में प्रथम पुरुष ‘करूँ’ रखा गया है।
