base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/031.yaml
  text: Then David said to Joab and to all the people who were with him[a], “Tear your clothes, gird yourselves with sackcloth, and mourn before Abner.” And King David was walking behind the bier.
translation:
  language: hi
  text: तब दाऊद ने योआब और उसके साथ के सब लोगों से कहा, “अपने वस्त्र फाड़ो, कमर में टाट बाँधो और अब्नेर के आगे विलाप करो।” राजा दाऊद अर्थी[a] के पीछे-पीछे चल रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शव ले जाने वाली खाट।” इब्रानी शब्द का सामान्य अर्थ “बिछौना” या “खाट” है, पर यहाँ उससे वह खाट अभिप्रेत है जिस पर अब्नेर का शव ले जाया जा रहा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְעוּ בִגְדֵיכֶם
  choice: अपने वस्त्र फाड़ो
  rationale: शोक के प्रसंग में वस्त्र फाड़ने की प्रचलित क्रिया को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: חִגְרוּ שַׂקִּים
  choice: कमर में टाट बाँधो
  rationale: חגר का मूल भाव कमर में बाँधने का है; यह अनुवाद शोक के लिए टाट धारण करने की क्रिया को स्पष्ट रखते हुए इब्रानी बिंब भी बचाता है।
- source_word: וְסִפְדוּ
  choice: विलाप करो
  rationale: ספד मृत व्यक्ति के लिए सार्वजनिक या विधिवत शोक-विलाप को दर्शाता है; केवल ‘शोक मनाओ’ की अपेक्षा ‘विलाप करो’ अधिक सटीक है।
- source_word: לִפְנֵי אַבְנֵר
  choice: अब्नेर के आगे
  rationale: शाब्दिक स्थानगत अभिव्यक्ति को बनाए रखता है; अंतिम यात्रा के प्रसंग में आशय अब्नेर के शव या उसे ले जाने वाली अर्थी के आगे चलकर विलाप करना है।
- source_word: הֹלֵךְ אַחֲרֵי
  choice: पीछे-पीछे चल रहा था
  rationale: कृदंत की जारी क्रिया और शवयात्रा में स्थानगत अर्थ, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמִּטָּה
  choice: अर्थी
  rationale: מִטָּה सामान्यतः खाट या बिछौना है, पर यहाँ वह मंच या खाट अभिप्रेत है जिस पर अब्नेर का शव ले जाया जा रहा था; प्रसंगानुसार ‘अर्थी’ सबसे स्पष्ट हिन्दी शब्द है।
- source_word: וְהַמֶּלֶךְ דָּוִד
  choice: राजा दाऊद
  rationale: दाऊद की राजकीय भूमिका को सहज हिन्दी पदक्रम में व्यक्त करता है।
