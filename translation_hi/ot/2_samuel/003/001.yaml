source:
  edition: WLC
  text: וַ/תְּהִ֤י הַ/מִּלְחָמָה֙ אֲרֻכָּ֔ה בֵּ֚ין בֵּ֣ית שָׁא֔וּל וּ/בֵ֖ין בֵּ֣ית דָּוִ֑ד וְ/דָוִד֙ הֹלֵ֣ךְ וְ/חָזֵ֔ק וּ/בֵ֥ית שָׁא֖וּל הֹלְכִ֥ים וְ/דַלִּֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/001.yaml
  text: The war between the house of Saul and the house of David was prolonged[a], and David kept growing stronger[b], while the house of Saul kept growing weaker.
translation:
  language: hi
  text: शाऊल के घराने[b] और दाऊद के घराने के बीच युद्ध लम्बा खिंचता गया[a]। दाऊद लगातार शक्तिशाली होता गया, जबकि शाऊल का घराना लगातार कमज़ोर होता गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युद्ध बहुत समय तक चलता रहा।” इब्रानी विशेषण का शाब्दिक अर्थ “लम्बा” है; यहाँ वह युद्ध की अवधि को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: “घराना” किसी परिवार, वंश-परम्परा या शासक राजवंश को दर्शा सकता है; यहाँ इब्रानी शब्द में पारिवारिक और राजनीतिक—दोनों भाव सम्भवतः निहित हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: था / खिंचता गया
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; हिन्दी में अलग आरम्भिक संयोजक जोड़े बिना स्वाभाविक कथात्मक प्रवाह रखा गया है।
- source_word: הַמִּלְחָמָה
  choice: युद्ध
  rationale: यह शब्द दोनों घरानों के बीच चल रहे व्यापक सैन्य-राजनीतिक संघर्ष को दर्शाता है।
- source_word: אֲרֻכָּה
  choice: लम्बा खिंचता गया
  rationale: विशेषण का शाब्दिक अर्थ ‘लम्बा’ है और यहाँ युद्ध की अवधि अभिप्रेत है; यह हिन्दी प्रयोग उसकी निरन्तरता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בֵּין בֵּית שָׁאוּל וּבֵין בֵּית דָּוִד
  choice: शाऊल के घराने और दाऊद के घराने के बीच
  rationale: ‘घराना’ पारिवारिक वंश और शासक राजवंश—दोनों अर्थ-छायाओं को बनाए रखता है।
- source_word: וְדָוִד הֹלֵךְ וְחָזֵק
  choice: दाऊद लगातार शक्तिशाली होता गया
  rationale: הלך के साथ अगला गुणसूचक पद क्रमिक और जारी बढ़ोतरी व्यक्त करता है।
- source_word: וּבֵית שָׁאוּל הֹלְכִים וְדַלִּים
  choice: शाऊल का घराना लगातार कमज़ोर होता गया
  rationale: सामूहिक कर्ता के सदस्यों में जारी गिरावट को स्वाभाविक हिन्दी एकवचन ‘घराना’ के साथ व्यक्त किया गया है।
- source_word: דַלִּים
  choice: कमज़ोर
  rationale: सन्दर्भ आर्थिक निर्धनता नहीं, बल्कि घटती सैन्य और राजनीतिक शक्ति दर्शाता है।
