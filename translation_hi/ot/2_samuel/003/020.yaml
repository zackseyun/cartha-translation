language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּבֹ֨א אַבְנֵ֤ר אֶל דָּוִד֙ חֶבְר֔וֹן וְ/אִתּ֖/וֹ עֶשְׂרִ֣ים אֲנָשִׁ֑ים וַ/יַּ֨עַשׂ דָּוִ֧ד לְ/אַבְנֵ֛ר וְ/לַ/אֲנָשִׁ֥ים אֲשֶׁר אִתּ֖/וֹ מִשְׁתֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/020.yaml
  text: Abner came to David at Hebron[a], and twenty men were with him. And David made a feast for Abner and for the men who were with him.
translation:
  language: hi
  text: अब्नेर बीस पुरुषों को अपने साथ लेकर हेब्रोन में दाऊद के पास आया। तब दाऊद ने अब्नेर और जो पुरुष उसके साथ थे, उनके लिए भोज का आयोजन किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भोज तैयार किया’ अथवा ‘दावत दी’।
    reason: मूल इब्रानी मुहावरे עשה + משתה के हिन्दी में कई स्वाभाविक अनुवाद संभव हैं।
lexical_decisions:
- source_word: וַיָּבֹא
  choice: आया
  rationale: בוא का अर्थ दृष्टिकोण के अनुसार ‘आना’ या ‘जाना’ हो सकता है। कथा का केंद्र हेब्रोन में दाऊद के पास पहुँचना है, इसलिए ‘आया’ स्वाभाविक है।
- source_word: אֶל דָּוִד חֶבְרוֹן
  choice: हेब्रोन में दाऊद के पास
  rationale: ‘हेब्रोन’ से यहाँ दाऊद का स्थान सूचित होता है; हिन्दी में स्थानसूचक ‘में’ जोड़ना स्पष्ट और स्वाभाविक है।
- source_word: וְאִתּוֹ עֶשְׂרִים אֲנָשִׁים
  choice: बीस पुरुषों को अपने साथ लेकर
  rationale: मूल इब्रानी वाक्यांश क्रियारहित है और अब्नेर के साथ बीस वयस्क पुरुषों की उपस्थिति बताता है। हिन्दी में यह रूप प्रवाहपूर्ण है और पुरुष-संदर्भ को बनाए रखता है।
- source_word: וַיַּעַשׂ ... מִשְׁתֶּה
  choice: भोज का आयोजन किया
  rationale: עשה + משתה का आशय किसी के लिए भोज देना या आयोजित करना है। ‘भोज का आयोजन किया’ आधुनिक हिन्दी में स्वाभाविक है और ‘बनाया’ की संभावित भ्रामक शाब्दिकता से बचता है।
- source_word: מִשְׁתֶּה
  choice: भोज
  rationale: यह शब्द भोज या दावत को दर्शाता है, जिसमें मदिरापान निहित हो सकता है पर यहाँ उसे स्पष्ट करना आवश्यक नहीं। ‘भोज’ dignified और व्यापक हिन्दी विकल्प है।
- source_word: לְאַבְנֵר וְלַאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: अब्नेर और उसके साथ आए पुरुषों के लिए
  rationale: यह अनुवाद दोनों लाभार्थियों—अब्नेर और उसके साथ के पुरुषों—को स्पष्ट रखता है और इब्रानी संबंधवाचक वाक्यांश का अर्थ सहज हिन्दी में देता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘पुरुष’ मूल אֲנָשִׁים के इस प्रसंग में वयस्क पुरुष साथियों के अर्थ को बनाए रखता है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न ‘हेब्रोन’ के बाद था, किंतु उसकी सामग्री भोज वाले मुहावरे से संबंधित है; इसलिए स्रोत-साक्ष्य के अनुसार चिह्न को ‘आयोजन किया’ के बाद रखा गया है।
