base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/032.yaml
  text: They buried Abner in Hebron[a], and the king lifted up his voice and wept at Abner’s grave, and all the people wept.
translation:
  language: hi
  text: उन्होंने अब्नेर को हेब्रोन में दफ़नाया। राजा ने अपनी आवाज़ उठाकर अब्नेर की कब्र पर[a] रोया, और सब लोग रोए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अब्नेर की कब्र की ओर।” इब्रानी पूर्वसर्ग का शाब्दिक अर्थ दिशा सूचित कर सकता है; इस शोक-प्रसंग में “कब्र पर” स्वाभाविक अर्थ है।
    reason: इब्रानी אֶל के दिशा-सूचक वैकल्पिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּקְבְּרוּ
  choice: उन्होंने ... दफ़नाया
  rationale: קבר का काल-वाचक कथात्मक रूप दफ़नाने की पूर्ण घटना बताता है; आरंभिक וַ को अलग से 'और' कहना स्वाभाविक हिन्दी में आवश्यक नहीं।
- source_word: בְּחֶבְרוֹן
  choice: हेब्रोन में
  rationale: यहाँ ב स्थान सूचित करता है; नगर के भीतर दफ़नाए जाने के लिए 'में' स्वाभाविक है।
- source_word: וַיִּשָּׂא הַמֶּלֶךְ אֶת־קוֹלוֹ וַיֵּבְךְּ
  choice: तब राजा फूट-फूटकर रोया
  rationale: '''अपनी आवाज़ उठाकर रोना'' इब्रानी मुहावरा ऊँची आवाज़ में शोकपूर्वक रोने को व्यक्त करता है; ''फूट-फूटकर रोया'' आधुनिक हिन्दी में उसी भाव को स्वाभाविक ढंग से संप्रेषित करता है।'
- source_word: אֶל־קֶבֶר אַבְנֵר
  choice: अब्नेर की कब्र पर
  rationale: אֶל सामान्यतः 'की ओर' होता है, पर शोक और दफ़न के प्रसंग में कब्र के पास/उस पर विलाप करने का स्थानगत अर्थ अधिक स्वाभाविक है; मूल दिशा-सूचक संभावना फुटनोट में रखी गई है।
- source_word: וַיִּבְכּוּ כָּל־הָעָם
  choice: और सब लोग भी रोए
  rationale: בכה की पुनरावृत्ति 'रोए' से बनाए रखी गई है; 'भी' राजा के साथ लोगों के सम्मिलित शोक को स्वाभाविक हिन्दी में स्पष्ट करता है।
