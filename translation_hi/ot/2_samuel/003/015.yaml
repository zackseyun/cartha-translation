  text: So Ish-bosheth sent and took her from her husband[b][a], from Paltiel the son of Laish.
translation:
  language: hi
  text: तब ईश-बोशेत ने भेजा और उसे उसके पति, लैश के पुत्र पल्तीएल, के पास से ले लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: लोगों को भेजकर
  rationale: क्रिया का मूल अर्थ ‘भेजा’ है। किसे भेजा गया, यह इब्रानी में व्यक्त नहीं है; हिन्दी में अगली क्रिया के साथ स्वाभाविक वाक्य बनाने के लिए अनिर्दिष्ट ‘लोगों को’ स्पष्ट किया गया है।
- source_word: אִישׁ בֹּשֶׁת
  choice: ईशबोशेत
  rationale: व्यक्तिनाम का इब्रानी उच्चारणानुसार देवनागरी लिप्यंतरण किया गया है।
- source_word: וַיִּקָּחֶהָ
  choice: उसे ... ले लिया
  rationale: לקח का अर्थ यहाँ ‘उसे लिया’ है; ‘ले लिया’ हिन्दी में स्थान से हटाकर अपने अधिकार में लेने का भाव स्वाभाविक रूप से देता है, जबकि ‘छीन लिया’ मूल क्रिया से अधिक प्रबल होता।
- source_word: מֵעִם ... מֵעִם
  choice: उसके पति ... के पास से
  rationale: מֵעִם किसी व्यक्ति के साथ या अधिकार से अलग किए जाने को दर्शाता है। हिन्दी ‘के पास से’ इसे स्वाभाविक रूप से व्यक्त करता है; दोहराव को नाम के समानाधिकरण वाली रचना में समाहित किया गया है।
- source_word: אִישׁ
  choice: उसके पति
  rationale: शाब्दिक अर्थ ‘पुरुष’ है, पर प्रसंग में यह मीकल के वैवाहिक साथी को सूचित करता है। सम्बन्ध को मुख्य पाठ में स्पष्ट किया गया है और शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: פַּלְטִיאֵל
  choice: पलतीएल
  rationale: इस पद के मसोराई इब्रानी रूप פַּלְטִיאֵל का निकट देवनागरी लिप्यंतरण है।
- source_word: בֶּן לוש
  choice: लैश के पुत्र
  rationale: בֶּן का सामान्य अर्थ ‘पुत्र’ है; לוש नाम को प्रचलित बाइबलीय रूप ‘लैश’ में लिप्यंतरित किया गया है।
theological_decisions:
- issue: אִישׁ की सम्बन्धपरक पहचान
  choice: उसके पति
  alternative: उस पुरुष
  rationale: प्रसंग इस पुरुष को मीकल के पति के रूप में पहचानता है, पर इब्रानी संज्ञा स्वयं केवल ‘पुरुष’ कहती है। सहज हिन्दी के लिए सम्बन्ध स्पष्ट किया गया और मूल की शब्दगत अस्पष्टता पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। इब्रानी कथात्मक क्रम को ‘तब ... भेजकर ... ले लिया’ में स्वाभाविक बनाया गया है। व्यक्तिनाम स्रोत-पाठ के अनुसार लिप्यंतरित हैं और सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
