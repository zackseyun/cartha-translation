source:
  edition: WLC
  text: וְ/אָנֹכִ֨י הַ/יּ֥וֹם רַךְ֙ וּ/מָשׁ֣וּחַ מֶ֔לֶךְ וְ/הָ/אֲנָשִׁ֥ים הָ/אֵ֛לֶּה בְּנֵ֥י צְרוּיָ֖ה קָשִׁ֣ים מִמֶּ֑/נִּי יְשַׁלֵּ֧ם יְהוָ֛ה לְ/עֹשֵׂ֥ה הָ/רָעָ֖ה כְּ/רָעָתֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/039.yaml
  text: And I am still weak today[a], though anointed king; and these men, the sons of Zeruiah, are too harsh for me[b]. May Yahweh repay the evildoer according to his evil.
translation:
  language: hi
  text: और आज भी मैं कमज़ोर हूँ[a], यद्यपि मैं अभिषिक्त राजा हूँ; और ये लोग, सरूयाह के बेटे, मेरे लिए बहुत कठोर हैं। याहवे बुराई करनेवाले को उसकी बुराई के अनुसार प्रतिफल दे![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और आज भी मैं कोमल हूँ।” हिब्रू विशेषण का अर्थ “कोमल/नरम” हो सकता है, और इस प्रसंग में “कमज़ोर” भी।
    reason: lexical_alternative
  - marker: b
    text: या, “याहवे बुराई करनेवाले को उसकी बुराई के अनुसार प्रतिफल देगा।” हिब्रू क्रिया को साधारण भविष्य के रूप में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: רַךְ
  choice: कमज़ोर
  rationale: इस प्रसंग में दाऊद अपनी राजनीतिक और व्यावहारिक असमर्थता व्यक्त कर रहा है। शाब्दिक अर्थ ‘कोमल/नरम’ संभव है, पर आधुनिक हिन्दी में ‘कमज़ोर’ प्रसंग का आशय अधिक स्पष्ट करता है।
- source_word: וּמָשׁוּחַ מֶלֶךְ
  choice: यद्यपि राजा के रूप में मेरा अभिषेक हो चुका है
  rationale: हिब्रू का क्रियारहित पद दाऊद की कमज़ोरी और अभिषिक्त राजा होने की स्थिति के बीच विरोध दर्शाता है; ‘यद्यपि’ इस निहित रियायती भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּנֵי צְרוּיָה
  choice: सरूयाह के बेटे
  rationale: यह योआब और उसके भाइयों के लिए पारिवारिक पदनाम है। हिन्दी में ‘सरूयाह के बेटे’ मूल अभिव्यक्ति को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: קָשִׁים מִמֶּנִּי
  choice: मेरे लिए बहुत कठोर हैं
  rationale: קָשִׁים उनकी कठोरता और दाऊद के लिए उन्हें वश में करने की कठिनाई—दोनों का संकेत दे सकता है। यह अनुवाद मूल रूपक को बनाए रखते हुए उनकी निर्दयता को सामने लाता है।
- source_word: יְשַׁלֵּם
  choice: प्रतिफल दे
  rationale: यहाँ अपूर्ण क्रिया को इच्छा अथवा न्याय की प्रार्थना के रूप में लिया गया है। ‘प्रतिफल दे’ न्यायोचित प्रत्युत्तर का भाव देता है और अनावश्यक रूप से निजी प्रतिशोध नहीं सुझाता।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू चतुरक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित निकट लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: לְעֹשֵׂה הָרָעָה
  choice: बुराई करनेवाले
  rationale: यह कृदन्तीय पद बुराई करने वाले व्यक्ति को सूचित करता है; हिन्दी में यह सीधा और स्वाभाविक है।
- source_word: כְּרָעָתוֹ
  choice: उसकी बुराई के अनुसार
  rationale: यह वाक्यांश अपराध के अनुरूप प्रतिफल का भाव रखता है। निकट अनुवाद मूल की नैतिक और न्यायिक भाषा को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में व्यक्तिगत परमेश्वर-नाम है; उसे ‘याहवे’ रूप में रखना पाठ की विशिष्टता को सुरक्षित रखता है और किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: दाऊद के अंतिम कथन का बल
  choice: कामनासूचक/प्रार्थनात्मक—‘याहवे ... प्रतिफल दे!’
  alternative: साधारण भविष्य—‘याहवे ... प्रतिफल देगा।’
  rationale: प्रसंग में दाऊद न्याय परमेश्वर पर छोड़ता है, इसलिए कामनासूचक अर्थ उपयुक्त है; फिर भी हिब्रू अपूर्ण क्रिया साधारण भविष्य भी व्यक्त कर सकती है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर राजकीय अभिषेक और दैवी न्याय के प्रसंग के अनुरूप गरिमापूर्ण रखी गई है। ‘आज भी’ दाऊद की वर्तमान तक बनी हुई कमज़ोरी को स्वाभाविक हिन्दी में व्यक्त करता है; ‘बहुत कठोर’ मूल की अर्थगत व्यापकता को अनावश्यक रूप से केवल ‘अधिक शक्तिशाली’ या ‘निर्दयी’ तक सीमित नहीं करता।
