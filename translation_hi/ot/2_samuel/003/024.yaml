  text: Then Joab came to the king and said[a], “What have you done? Look, Abner came to you. Why is this—you sent him away, and he has gone on his way?”
translation:
  language: hi
  text: तब योआब राजा के पास आया और बोला, “आपने यह क्या किया? देखिए, अब्नेर आपके पास आया। तो फिर आपने उसे क्यों विदा कर दिया? वह तो चला ही गया है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “वह गया, जाते हुए”—यह जोर देने वाली रचना है, जिसका अर्थ है कि वह निश्चय ही या पूरी तरह जा चुका है।
    reason: lexical_alternative
