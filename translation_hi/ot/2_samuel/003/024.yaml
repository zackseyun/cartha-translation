- source_word: וַיָּבֹא
  choice: तब ... आया
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; आधुनिक हिन्दी में “तब” घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶל הַמֶּלֶךְ
  choice: राजा के पास
