- source_word: מֶה עָשִׂיתָה
  choice: आपने यह क्या किया?
  rationale: पूर्ण हो चुके काम पर योआब की विस्मयभरी फटकार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הִנֵּה
  choice: देखिए
  rationale: ध्यान खींचने वाले बल को आधुनिक, सम्मानसूचक संबोधन में बनाए रखता है।
- source_word: בָא אַבְנֵר אֵלֶיךָ
  choice: अब्नेर आपके पास आया था
  rationale: पूर्व में घट चुकी और वर्तमान आरोप की पृष्ठभूमि बनी घटना को हिन्दी के पूर्ण भूतकाल से स्पष्ट किया गया है।
- source_word: לָמָּה זֶּה
  choice: तो फिर ... क्यों
  rationale: साधारण “क्यों” से अधिक तीखे और निष्कर्षात्मक प्रश्नवाचक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שִׁלַּחְתּוֹ
  choice: उसे ... विदा कर दिया
  rationale: पिएल रूप यहाँ किसी को जाने देना या विदा करना बताता है और दाऊद की सक्रिय भूमिका बनाए रखता है।
- source_word: וַיֵּלֶךְ הָלוֹךְ
  choice: वह तो चला ही गया है
  rationale: क्रिया के साथ प्रयुक्त निरपेक्ष धातुरूप के जोर को “तो” और “ही” द्वारा सहज हिन्दी में व्यक्त करता है।
