source:
  edition: WLC
  text: וְ/כָל הָ/עָ֣ם הִכִּ֔ירוּ וַ/יִּיטַ֖ב בְּ/עֵֽינֵי/הֶ֑ם כְּ/כֹל֙ אֲשֶׁ֣ר עָשָׂ֣ה הַ/מֶּ֔לֶךְ בְּ/עֵינֵ֥י כָל הָ/עָ֖ם טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/036.yaml
  text: And all the people recognized it[a], and it was good in their eyes; for everything the king did was good in the eyes of all the people.
translation:
  language: hi
  text: और सब लोगों ने यह बात समझ ली[a], और यह उन्हें अच्छी लगी; जैसे राजा ने जो कुछ किया, वह सब लोगों को अच्छा लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस बात को पहचान लिया” अथवा “इस पर ध्यान दिया।”
    reason: इब्रानी क्रिया का अर्थ प्रसंग में पहचानना, समझना या ध्यान देना हो सकता है।
lexical_decisions:
- source_word: הִכִּירוּ
  choice: यह बात समझ ली
  rationale: हिफ़िल रूप यहाँ पहचानने, जान लेने या भाँप लेने का भाव देता है। प्रसंग से निहित कर्म को ‘यह बात’ कहने पर हिन्दी स्वाभाविक रहती है और लोगों द्वारा दाऊद की मंशा समझ लेने का भाव व्यक्त होता है।
- source_word: וַיִּיטַב בְּעֵינֵיהֶם
  choice: यह उन्हें अच्छी लगी
  rationale: शाब्दिक मुहावरा ‘उनकी आँखों में अच्छी थी’ अनुमोदन या प्रसन्नता व्यक्त करता है। ‘उन्हें अच्छी लगी’ आधुनिक हिन्दी में उसी अर्थ का स्वाभाविक रूप है।
- source_word: כְּכֹל אֲשֶׁר עָשָׂה הַמֶּלֶךְ
  choice: जैसे राजा ने जो कुछ किया
  rationale: כְּ की तुलनात्मक शक्ति को ‘जैसे’ द्वारा बनाए रखा गया है; इसे कारणसूचक ‘क्योंकि’ बनाकर अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: בְּעֵינֵי כָל הָעָם טוֹב
  choice: वह सब लोगों को अच्छा लगा
  rationale: यह पहले आए ‘अच्छी लगी’ के साथ स्रोत की पुनरुक्ति बनाए रखता है और सार्वजनिक अनुमोदन को सहज हिन्दी में व्यक्त करता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: मूल पाठ में व्यक्तिगत नाम के बजाय पदवी है, इसलिए कथात्मक शैली को बनाए रखते हुए ‘राजा’ रखा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘उन्हें अच्छी लगी’ इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप है, जबकि ‘जैसे’ मूल की तुलनात्मक संरचना और उसकी संभावित अर्थगत खुलावट को बनाए रखता है।
