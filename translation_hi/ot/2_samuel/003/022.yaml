base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/022.yaml
  text: And behold[a], David’s servants and Joab came in from a raid and brought much plunder with them. But Abner was not with David in Hebron, because he had sent him away[b], and he had gone in peace.
translation:
  language: hi
  text: और देखो, दाऊद के सेवक और योआब एक छापे[a] से लौटे और अपने साथ बहुत-सी लूट लाए। पर अब्नेर दाऊद के साथ हेब्रोन में नहीं था, क्योंकि दाऊद ने उसे विदा कर दिया था और वह शान्ति से विदा हो गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘छापा मारने वाले दल से।’ इब्रानी गदूद किसी दल या टुकड़ी के लिए भी हो सकता है; आगे लूट का उल्लेख होने के कारण यहाँ ‘छापा’ चुना गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह पद कथा में एक नए और सजीव घटनाक्रम की ओर ध्यान खींचता है; ‘और देखो’ आधुनिक हिन्दी में इस संकेतात्मक बल को बनाए रखता है।
- source_word: עַבְדֵי דָוִד
  choice: दाऊद के सेवक
  rationale: यहाँ शब्द दाऊद की सेवा में रहने वाले लोगों या सैनिक अनुचरों के लिए है; ‘सेवक’ मूल के निकट रहते हुए दासत्व का अनावश्यक अर्थ नहीं थोपता।
- source_word: מֵהַגְּדוּד
  choice: एक छापे से
  rationale: גְּדוּד दल या छापामार अभियान दोनों का बोध करा सकता है; आगे लूट का उल्लेख होने से यहाँ अभियान अर्थात ‘छापा’ अधिक स्वाभाविक है।
- source_word: וְשָׁלָל רָב
  choice: बहुत-सी लूट
  rationale: सैन्य संघर्ष में प्राप्त माल के लिए ‘लूट’ सहज आधुनिक हिन्दी है और רָב की मात्रा भी स्पष्ट करती है।
- source_word: וְאַבְנֵר אֵינֶנּוּ עִם דָּוִד בְּחֶבְרוֹן
  choice: पर अब्नेर दाऊद के साथ हेब्रोन में नहीं था
  rationale: वाव यहाँ लौटते दल और अब्नेर की अनुपस्थिति के बीच विरोध दिखाता है, इसलिए ‘पर’ उपयुक्त है।
- source_word: כִּי שִׁלְּחוֹ
  choice: क्योंकि दाऊद ने उसे विदा कर दिया था
  rationale: इब्रानी में कर्ता सर्वनाम से निहित है, पर प्रसंग से दाऊद स्पष्ट है; हिन्दी में नाम देने से अस्पष्टता दूर होती है। पूर्वकालिक क्रिया के लिए ‘कर दिया था’ रखा गया है।
- source_word: וַיֵּלֶךְ בְּשָׁלוֹם
  choice: और वह सकुशल चला गया था
  rationale: ‘शांति में जाना’ यहाँ सुरक्षित और अच्छे संबंधों के साथ विदा होने का मुहावरा है; ‘सकुशल’ उसका स्वाभाविक हिन्दी रूप है।
