base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/008.yaml
  text: Then Abner became very angry because of Ish-bosheth’s words[a], and he said, “Am I a dog’s head that belongs to Judah? To this day I have shown covenant loyalty to the house of Saul your father, to his brothers, and to his friends, and have not delivered you into David’s hand; yet today you charge me with guilt concerning this woman.”
translation:
  language: hi
  text: तब ईशबोशेत की बातों पर अब्नेर बहुत क्रोधित हुआ और उसने कहा, “क्या मैं यहूदा के किसी कुत्ते का सिर हूँ?[a] आज तक मैं तुम्हारे पिता शाऊल के घराने, उनके भाइयों और उनके मित्रों के प्रति निष्ठावान रहा हूँ और मैंने तुम्हें दाऊद के हाथ में नहीं सौंपा; फिर भी आज तुम उस स्त्री के विषय में मुझ पर दोष लगाते हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “यहूदा के किसी कुत्ते का सिर।” यह एक कठिन अपमानसूचक मुहावरा है। इसका आशय संभवतः “यहूदा के पक्ष का कोई तुच्छ कुत्ता” जैसा है, पर अनुवाद में रूपक और उसकी अस्पष्टता बनाए रखी गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְאַבְנֵר מְאֹד
  choice: अब्नेर बहुत क्रोधित हुआ
  rationale: חרה का क्रोध भड़कने वाला मुहावरा और מְאֹד की तीव्रता स्वाभाविक आधुनिक हिन्दी में व्यक्त होती है।
- source_word: עַל דִּבְרֵי אִישׁ בֹּשֶׁת
  choice: ईशबोशेत की बातों पर
  rationale: עַל यहाँ क्रोध के कारण को दर्शाता है; 'बातों पर' हिन्दी में स्रोत के 'शब्दों' के निकट और स्वाभाविक है।
- source_word: הֲרֹאשׁ כֶּלֶב אָנֹכִי אֲשֶׁר לִיהוּדָה
  choice: क्या मैं यहूदा का कोई कुत्ते का सिर हूँ?
  rationale: कठिन अपमानसूचक रूपक 'कुत्ते का सिर' और यहूदा से उसके संबंध की वास्तविक अस्पष्टता को व्याख्यात्मक रूप से समतल किए बिना सुरक्षित रखा गया है। 'कोई' तिरस्कारपूर्ण अलंकारिक प्रश्न को हिन्दी में स्वाभाविक बनाता है।
- source_word: הַיּוֹם אֶעֱשֶׂה חֶסֶד
  choice: आज तक मैं ... निष्ठावान रहा हूँ
  rationale: पहला הַיּוֹם अब्नेर की अब तक की सेवा को समेटता है और बाद के 'फिर भी आज' से विरोध बनाता है। חֶסֶד इस राजवंशीय-संबंधपरक प्रसंग में केवल दया नहीं, विश्वस्त निष्ठा है।
- source_word: עִם בֵּית שָׁאוּל אָבִיךָ
  choice: तुम्हारे पिता शाऊल के घराने ... के प्रति
  rationale: '''घराना'' राजवंशीय अर्थ को व्यक्त करता है और ''के प्रति निष्ठावान'' स्वाभाविक हिन्दी संयोजन है।'
- source_word: אֶל אֶחָיו וְאֶל מֵרֵעֵהוּ
  choice: उनके भाइयों और उनके मित्रों
  rationale: אֶחָיו और מֵרֵעֵהוּ के सीधे संबंधपरक अर्थों को क्रमशः 'भाइयों' और 'मित्रों' से रखा गया है।
- source_word: וְלֹא הִמְצִיתִךָ בְּיַד דָּוִד
  choice: मैंने तुम्हें दाऊद के हाथ में नहीं सौंपा
  rationale: '''हाथ में सौंपना'' दूसरे के अधिकार या वश में देने के इब्रानी मुहावरे को हिन्दी में भी सुरक्षित रखता है।'
- source_word: וַתִּפְקֹד עָלַי עֲוֺן הָאִשָּׁה
  choice: फिर भी आज तुम उस स्त्री के विषय में मुझ पर दोष लगाते हो
  rationale: פקד על + עָוֺן का आरोप लगाने या जवाबदेह ठहराने का भाव स्पष्ट है; 'उस स्त्री' पूर्व प्रसंग की रिस्पा की ओर संकेत करता है, बिना उसका नाम जोड़े।
theological_decisions:
- issue: חֶסֶד का संबंधपरक अर्थ
  choice: निष्ठावान रहा हूँ
  alternative: वाचा की निष्ठा दिखाई है / कृपा की है
  rationale: राजनीतिक और पारिवारिक निष्ठा का भार रखा गया है, पर जहाँ पाठ स्पष्ट रूप से किसी औपचारिक वाचा का उल्लेख नहीं करता वहाँ 'वाचा' शब्द नहीं जोड़ा गया।
- issue: पहले הַיּוֹם का कालगत बल
  choice: आज तक
  alternative: आज
  rationale: अब्नेर अपने पूर्व आचरण का बचाव कर रहा है; आगे के הַיּוֹם ('आज तुम...') के साथ विरोध इस पूर्वव्यापी अर्थ का समर्थन करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सुबोध गद्य। अलंकारिक प्रश्न की कठोरता, राजवंशीय निष्ठा और आरोप की कानूनी-नैतिक धार को बनाए रखा गया है।
