base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/007.yaml
  text: Saul had a concubine whose name was Rizpah daughter of Aiah. And Ish-bosheth said to Abner[a], “Why did you go in to my father’s concubine?”
translation:
  language: hi
  text: शाऊल की एक उपपत्नी थी, जिसका नाम अय्या की बेटी रिस्पा था। ईशबोशेत ने अब्नेर से कहा[a], “तुम मेरे पिता की उपपत्नी के पास क्यों गए?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक स्पष्ट रूप से: “तुमने मेरे पिता की उपपत्नी के साथ यौन-संबंध क्यों बनाए?” इब्रानी में शाब्दिक रूप से “के पास जाना” है, जो यहाँ यौन-संबंध के लिए प्रचलित शिष्टोक्ति है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשָׁאוּל
  choice: शाऊल की ... थी
  rationale: लामेद की स्वामित्वसूचक अस्तित्ववाचक रचना को स्वाभाविक हिन्दी में ‘शाऊल की ... थी’ से व्यक्त किया गया है; वाव को अनावश्यक कालसूचक ‘अब’ नहीं बनाया गया।
- source_word: פִּלֶגֶשׁ / פִּילֶגֶשׁ
  choice: उपपत्नी
  rationale: यह इब्रानी सामाजिक-वैधानिक श्रेणी को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है और इसे सामान्य ‘पत्नी’ में नहीं मिला देता।
- source_word: וּשְׁמָהּ רִצְפָּה בַת אַיָּה
  choice: जिसका नाम अय्या की बेटी रिस्पा था
  rationale: परिचयात्मक वाक्यांश और वंशसूचक संबंध दोनों को स्वाभाविक हिन्दी क्रम में सुरक्षित रखा गया है।
- source_word: וַיֹּאמֶר
  choice: ईशबोशेत ने ... कहा
  rationale: इब्रानी में कर्ता निहित है; पिछले संदर्भ से वक्ता ईशबोशेत है। हिन्दी में अस्पष्टता से बचने के लिए नाम स्पष्ट किया गया है।
- source_word: מַדּוּעַ בָּאתָה אֶל
  choice: तुम ... के पास क्यों गए
  rationale: בוא אל के शाब्दिक मुहावरे को हिन्दी में ‘के पास गए’ रखा गया है, जिससे मूल का यौन संकेत प्रत्यक्ष अशिष्टता के बिना बना रहता है; फुटनोट अर्थ स्पष्ट करता है।
- source_word: פִּילֶגֶשׁ אָבִי
  choice: मेरे पिता की उपपत्नी
  rationale: इब्रानी संबंधवाचक संरचना का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: अब्नेर पर लगाए गए आरोप की स्पष्टता
  choice: मुख्य पाठ में मूल का शिष्टोक्ति-युक्त ‘के पास गए’ बनाए रखा
  alternative: ‘के साथ यौन-संबंध बनाए’
  rationale: मूल इब्रानी यौन संबंध का संकेत देता है, पर उसे शिष्टोक्ति में कहता है। स्पष्ट वैकल्पिक अर्थ फुटनोट में देकर मूल की शैली और आशय दोनों सुरक्षित रखे गए हैं।
translation_notes:
  register: 'आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। व्यक्तिनामों के रूप: शाऊल, अय्या, रिस्पा, ईशबोशेत और अब्नेर। मुख्य पाठ में मूल इब्रानी की यौन शिष्टोक्ति सुरक्षित है और उसका स्पष्ट अर्थ फुटनोट में दिया गया है।'
