base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/021.yaml
  text: Abner said to David[a], “I will arise and go, and I will gather all Israel to my lord the king, so that they may make a covenant with you, and you shall reign over all that your soul desires.” Then David sent Abner away[c][b], and he went in peace.
translation:
  language: hi
  text: अब्नेर ने दाऊद से कहा, “मैं उठूँगा और जाऊँगा, और सारे इस्राएल को मेरे प्रभु राजा के पास इकट्ठा करूँगा, ताकि वे आपके साथ वाचा बाँधें[a] और आप उस सब पर राज करें जिसकी आपकी आत्मा अभिलाषा करती है[b]।” तब दाऊद ने अब्नेर को विदा किया, और वह शांति से चला गया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “आपके साथ वाचा काटें।”
    reason: lexical_alternative
  - marker: b
    text: या, “उस सब पर जिसकी आप इच्छा करते हैं”; इब्रानी में, “जिसकी आपकी आत्मा अभिलाषा करती है।”
    reason: lexical_alternative
  - marker: c
    text: “शांति से चला गया” इब्रानी मुहावरा है, जिसका अर्थ है कि वह सुरक्षित रूप से और शांतिपूर्ण संबंधों के साथ विदा हुआ।
    reason: cultural_note
lexical_decisions:
- source_word: אָקוּמָה וְאֵלֵכָה
  choice: मैं उठकर जाऊँगा
  rationale: दोनों विध्यर्थक रूप अब्नेर के दृढ़ निश्चय को व्यक्त करते हैं। हिन्दी में भविष्यकाल इस घोषित अभिप्राय को स्वाभाविक ढंग से रखता है।
- source_word: וְאֶקְבְּצָה
  choice: इकट्ठा करूँगा
  rationale: यह राजनीतिक रूप से इस्राएल के सभी गोत्रों को दाऊद के पास एकत्र करने का भाव व्यक्त करता है।
- source_word: אֶל אֲדֹנִי הַמֶּלֶךְ
  choice: अपने प्रभु राजा के पास
  rationale: दिशासूचक उपसर्ग और अब्नेर का सम्मानपूर्ण राजकीय सम्बोधन दोनों सुरक्षित रहते हैं।
- source_word: כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल
  rationale: यह समस्त इस्राएली समुदाय अथवा गोत्रों के लिए प्रचलित सामूहिक अभिव्यक्ति है।
- source_word: וְיִכְרְתוּ אִתְּךָ בְּרִית
  choice: ताकि वे आपके साथ वाचा बाँधें
  rationale: כרת ברית का शाब्दिक अर्थ ‘वाचा काटना’ है, पर हिन्दी में ‘वाचा बाँधना’ स्पष्ट और प्रतिष्ठित मुहावरा है। प्रसंग में संयोजक उद्देश्य का भाव दे सकता है।
- source_word: וּמָלַכְתָּ
  choice: और आप ... पर राज करें
  rationale: क्रिया राजत्व का प्रयोग करने को दर्शाती है; ‘राज करें’ हिन्दी में सीधा और स्वाभाविक है।
- source_word: בְּכֹל אֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ
  choice: उस सब पर ... जिसकी आपकी आत्मा इच्छा करती है
  rationale: यह रूप ‘पर’ के शासन-सम्बन्धी भाव और נֶפֶשׁ की स्पष्ट उपस्थिति दोनों को बनाए रखता है, यद्यपि साधारण हिन्दी में केवल ‘जिसकी आप इच्छा करते हैं’ भी सम्भव है।
- source_word: וַיְשַׁלַּח דָּוִד אֶת אַבְנֵר
  choice: दाऊद ने अब्नेर को विदा किया
  rationale: प्रसंग में क्रिया का अर्थ उसे वहाँ से जाने देना या विदा करना है; ‘भेजा’ अनावश्यक रूप से किसी गन्तव्य का संकेत दे सकता है।
- source_word: וַיֵּלֶךְ בְּשָׁלוֹם
  choice: वह शान्ति से चला गया
  rationale: यह इब्रानी अभिव्यक्ति उसके सुरक्षित और मैत्रीपूर्ण शर्तों पर प्रस्थान को बताती है; मुख्य पाठ मूल मुहावरे का रूप बनाए रखता है।
theological_decisions:
- issue: वाचा बाँधने की अभिव्यक्ति
  choice: आपके साथ वाचा बाँधें
  alternative: आपके साथ वाचा काटें; आपके साथ वाचा करें
  rationale: यहाँ राजनीतिक वाचा का प्रसंग है। ‘वाचा बाँधना’ मूल मुहावरे का आशय स्पष्ट करता है, जबकि शाब्दिक ‘काटना’ पादटिप्पणी में सुरक्षित है।
- issue: नֶפֶשׁ को इच्छा के आसन के रूप में व्यक्त करना
  choice: जिसकी आपकी आत्मा इच्छा करती है
  alternative: जिसकी आप इच्छा करते हैं; जिसकी आपका मन इच्छा करता है
  rationale: मूल में נֶפֶשׁ स्पष्ट रूप से उपस्थित है। ‘आत्मा’ उस मानवशास्त्रीय शब्दावली को बनाए रखती है, बिना उसे ‘मन’ या केवल सर्वनाम में बदलकर समतल किए।
- issue: वְיִכְרְתוּ का सम्बन्ध
  choice: ताकि वे ... वाचा बाँधें
  alternative: और वे ... वाचा बाँधेंगे
  rationale: पूर्ववर्ती ‘इकट्ठा करने’ के बाद यह रूप उद्देश्य अथवा अपेक्षित परिणाम व्यक्त कर सकता है। मुख्य पाठ उद्देश्य को चुनता है, पर इसे कठोर धार्मिक निष्कर्ष नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सम्मानपूर्ण राजकीय सम्बोधन के साथ रखी गई है। ‘प्रभु राजा’, ‘वाचा बाँधें’ और ‘राज करें’ गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध हैं। मूल की ‘आत्मा’ और ‘शान्ति से’ वाली अभिव्यक्तियाँ पारदर्शिता के लिए मुख्य पाठ में रखी गई हैं और पादटिप्पणियों से स्पष्ट की गई हैं।
