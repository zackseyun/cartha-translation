  choice: मारे गए लोगों के लहू से
  rationale: מִן को स्रोत अथवा अलगाव के अर्थ में रखते हुए युद्ध का सजीव बिंब सुरक्षित रखा गया है; חֲלָלִים यहाँ युद्ध में मारे गए लोगों को दर्शाता है।
- source_word: מֵחֵלֶב גִּבּוֹרִים
  choice: वीरों की चर्बी से
  rationale: חֵלֶב का मूल अर्थ ‘चर्बी’ है; शौर्य-काव्य में यह शरीर के पुष्ट या उत्तम भाग का संकेत भी दे सकता है। शाब्दिक और तीखा युद्ध-बिंब मुख्य पाठ में रखा गया है। גִּבּוֹרִים के लिए काव्यात्मक ‘वीरों’ चुना गया है।
- source_word: קֶשֶׁת יְהוֹנָתָן
  choice: योनातान का धनुष
  rationale: इब्रानी संबंधवाचक संरचना को स्वाभाविक हिन्दी संबंधकारक में व्यक्त किया गया है।
- source_word: לֹא נָשׂוֹג אָחוֹר
  choice: पीछे नहीं हटा
  rationale: נסוג और אָחוֹר मिलकर पीछे हटने या लौटने का भाव देते हैं। धनुष के मानवीकरण और उसकी अचूक युद्ध-सफलता, दोनों को बिना अधिक व्याख्या के सुरक्षित रखा गया है।
- source_word: וְחֶרֶב שָׁאוּל
  choice: और शाऊल की तलवार
  rationale: समानांतर काव्य-पंक्ति में स्वाभाविक हिन्दी संबंधकारक अपनाया गया है।
- source_word: לֹא תָשׁוּב רֵיקָם
  choice: खाली नहीं लौटी
  rationale: यह मुहावरा बताता है कि तलवार बिना प्रभाव डाले नहीं लौटी। ‘खाली नहीं लौटी’ मूल मानवीकरण और संक्षिप्त काव्यात्मकता को बनाए रखता है।
