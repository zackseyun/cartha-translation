base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/022.yaml
  text: From the blood of the slain[a], from the fat of the mighty, Jonathan’s bow did not turn back[b], and Saul’s sword did not return empty.
translation:
  language: hi
  text: 'मारे गए लोगों के लहू से, वीरों की चर्बी[a] से,

    योनातान का धनुष पीछे नहीं हटा[b],

    और शाऊल की तलवार खाली नहीं लौटी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “चर्बी” का अर्थ यहाँ वीरों का पुष्ट अथवा उत्तम भाग भी हो सकता है; इससे युद्ध में मिली सफलता का बिंब और तीव्र होता है।
    reason: lexical_alternative
  - marker: b
    text: या “पीछे नहीं खिंचा।” इब्रानी क्रिया पीछे हटने या लौटने का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
