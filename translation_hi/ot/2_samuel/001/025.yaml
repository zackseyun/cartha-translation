source:
  edition: WLC
  text: אֵ֚יךְ נָפְל֣וּ גִבֹּרִ֔ים בְּ/ת֖וֹךְ הַ/מִּלְחָמָ֑ה יְה֣וֹנָתָ֔ן עַל בָּמוֹתֶ֖י/ךָ חָלָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/025.yaml
  text: How the mighty have fallen in the midst of the battle! Jonathan lies slain on your heights[a].
translation:
  language: hi
  text: हाय, युद्ध के बीच वीर कैसे गिर पड़े! योनातान तेरे ऊँचे स्थानों पर मारा पड़ा है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे ऊँचे स्थानों” में “तेरे” से इस्राएल या उसकी भूमि को काव्यात्मक रूप से संबोधित किया गया है। इब्रानी शब्द का अर्थ “ऊँचा भूभाग” भी हो सकता है।
    reason: इब्रानी दूसरे पुरुष एकवचन प्रत्यय के संदर्भ की वास्तविक अस्पष्टता और בָּמוֹת के भू-आकृति संबंधी अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: אֵיךְ
  choice: हाय, ... कैसे
  rationale: यह प्रश्न नहीं, शोक का विस्मयादिबोधक उद्घोष है। ‘हाय’ और ‘कैसे’ मिलकर विलाप की तीव्रता तथा अध्याय में दोहराई गई काव्यात्मक पंक्ति को स्वाभाविक हिन्दी में रखते हैं।
- source_word: נָפְלוּ
  choice: गिर पड़े
  rationale: पूर्ण हो चुकी दुखद घटना को सजीव विलाप के रूप में व्यक्त करता है और हिन्दी में युद्ध में मारे जाने का स्वाभाविक व्यंजक है।
- source_word: גִבֹּרִים
  choice: वीर
  rationale: यहाँ सामर्थी योद्धाओं के लिए प्रयुक्त है; ‘वीर’ संक्षिप्त, गरिमापूर्ण और काव्यात्मक है।
- source_word: בְּתוֹךְ הַמִּלְחָמָה
  choice: युद्ध के बीच
  rationale: בְּתוֹךְ का संघर्ष के मध्य होने वाला भाव सुरक्षित रखता है, केवल ‘युद्ध में’ की अपेक्षा अधिक सटीक है।
- source_word: יְהוֹנָתָן
  choice: योनातान
  rationale: इब्रानी नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: עַל בָּמוֹתֶיךָ
  choice: तुम अपने ऊँचे स्थानों पर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय को सीधे योनातान से जोड़ने की वास्तविक व्याकरणिक संभावना सुरक्षित रखी गई है। בָּמוֹת यहाँ ऊँचे भूभागों को सूचित कर सकता है।
- source_word: חָלָל
  choice: मारे पड़े हो
  rationale: חָלָל का अर्थ मारा गया व्यक्ति है; क्रियारहित इब्रानी पद को स्वाभाविक हिन्दी विधेय के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: בָּמוֹתֶיךָ में द्वितीय पुरुष प्रत्यय का संदर्भ
  choice: 'मुख्य पाठ में योनातान को सीधा संबोधन: ‘तुम अपने ऊँचे स्थानों पर’'
  alternative: 'भूमि अथवा इस्राएल को काव्यात्मक संबोधन: ‘तेरे ऊँचे स्थानों पर’'
  rationale: निकटवर्ती ‘योनातान’ के साथ पुल्लिंग एकवचन संबोधन व्याकरणतः सीधा और संभव है, जबकि भूमि/इस्राएल का व्यक्तिकरण भी संदर्भ में संभव है। मुख्य पाठ निकटतम व्याकरणिक संबंध रखता है और पादटिप्पणी दूसरी व्याख्या सुरक्षित करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। ‘हाय’ विलाप का भाव स्पष्ट करता है; वाक्य विन्यास सामान्य पाठक के लिए सहज रखते हुए इब्रानी के सीधे संबोधन और अस्पष्टता को पादटिप्पणी में संरक्षित करता है।
