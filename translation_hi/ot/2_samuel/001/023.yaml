reference: 2 Samuel 1:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שָׁא֣וּל וִ/יהוֹנָתָ֗ן הַ/נֶּאֱהָבִ֤ים וְ/הַ/נְּעִימִם֙ בְּ/חַיֵּי/הֶ֔ם וּ/בְ/מוֹתָ֖/ם לֹ֣א נִפְרָ֑דוּ מִ/נְּשָׁרִ֣ים קַ֔לּוּ מֵ/אֲרָי֖וֹת גָּבֵֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/023.yaml
  text: Saul and Jonathan[a], beloved and pleasant in their lives, were not parted in their death; they were swifter than eagles[c][b], they were stronger than lions.
translation:
  language: hi
  text: शाऊल और योनातान अपने जीवन में प्रिय और मनोहर[a] थे, और अपनी मृत्यु में भी वे अलग न हुए। वे उकाबों[b] से अधिक तेज़ और सिंहों से अधिक बलवान[c] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मनोहर’ का अनुवाद ‘रमणीय’ या ‘मनभावन’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उकाबों’ के स्थान पर ‘बड़े शिकारी पक्षियों’ या ‘गिद्धों’ का भाव भी संभव है, क्योंकि इब्रानी शब्द व्यापक अर्थ में किसी बड़े शिकारी पक्षी को सूचित कर सकता है; यहाँ ‘उकाब’ पारंपरिक और सबसे स्वाभाविक अनुवाद है।
    reason: lexical_alternative
  - marker: c
    text: ‘अधिक बलवान’ का अनुवाद ‘अधिक पराक्रमी’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאוּל וִיהוֹנָתָן
  choice: शाऊल और योनातान
  rationale: दोनों व्यक्तिनामों के लिए हिन्दी बाइबलीय परंपरा में प्रचलित और स्पष्ट लिप्यंतरण अपनाया गया है।
- source_word: הַנֶּאֱהָבִים
  choice: प्रिय
  rationale: אהב से बने इस कर्मवाच्य/विशेषणात्मक रूप का अर्थ है कि वे प्रेम किए जाने वाले थे। ‘प्रिय’ संक्षिप्त, स्वाभाविक और विलाप के सम्मानपूर्ण काव्य-स्वर के अनुकूल है।
- source_word: וְהַנְּעִימִם
  choice: और मनोहर
  rationale: נעים सुखद, रमणीय या मनभावन होने का भाव व्यक्त करता है। ‘मनोहर’ आधुनिक हिन्दी में सहज रहते हुए ‘प्रिय’ के साथ काव्यात्मक समानांतरता बनाए रखता है और इसे नैतिक सद्गुण या केवल शारीरिक सुंदरता तक सीमित नहीं करता।
- source_word: בְּחַיֵּיהֶם
  choice: अपने जीवन में
  rationale: यह पद उनके जीवित रहने के समय या जीवन के क्षेत्र को सूचित करता है। यह अनुवाद अगले पद ‘अपनी मृत्यु में’ के साथ इब्रानी समानांतरता को बनाए रखता है।
- source_word: וּבְמוֹתָם
  choice: और अपनी मृत्यु में भी
  rationale: इब्रानी में ‘मृत्यु’ एकवचन है और उसके साथ बहुवचन संबंधसूचक प्रत्यय है। हिन्दी में एकवचन रखकर सामूहिक भाव तथा ‘जीवन में/मृत्यु में’ का काव्यात्मक विरोध सुरक्षित किया गया है; ‘भी’ संबंध की निरंतरता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא נִפְרָדוּ
  choice: वे अलग न हुए
  rationale: פרד के निफ़अल रूप में अलग या पृथक होने का भाव है। ‘अलग न हुए’ हिन्दी में स्वाभाविक है और कर्मवाच्य को अनावश्यक रूप से कठोर बनाए बिना पारस्परिक/अकर्मक अर्थ सुरक्षित रखता है।
- source_word: מִנְּשָׁרִים קַלּוּ
  choice: वे उकाबों से अधिक तेज़ थे
  rationale: इस तुलनात्मक प्रसंग में קלל गति या फुर्ती को दर्शाता है। נשר बड़े शिकारी पक्षी के लिए व्यापक शब्द हो सकता है, पर काव्यात्मक तुलना में ‘उकाब’ पारंपरिक और स्वाभाविक विकल्प है; संभावित ‘गिद्ध’ अर्थ फुटनोट में रखा गया है।
- source_word: מֵאֲרָיוֹת גָּבֵרוּ
  choice: सिंहों से अधिक बलवान थे
  rationale: גבר यहाँ शक्ति या श्रेष्ठ सामर्थ्य व्यक्त करता है। ‘अधिक बलवान’ आधुनिक पाठक के लिए स्पष्ट है और सिंहों के साथ तुलनात्मक संरचना को सीधे बनाए रखता है।
theological_decisions:
- issue: दाऊद के शाऊल और योनातान-विषयक विलाप का स्वर
  choice: पद को दोनों के प्रति सम्मानपूर्ण काव्यात्मक प्रशंसा के रूप में प्रस्तुत किया गया है, शाऊल के बारे में विलाप के सकारात्मक चित्रण को बिना घटाए।
  alternative: शाऊल की पिछली असफलताओं के कारण प्रशंसा को नरम करना, या इसे निष्कलंक आदर्शीकरण में बदल देना।
  rationale: यह अंत्येष्टि-विलाप है और शाऊल तथा योनातान दोनों की उन्नत काव्यात्मक भाषा में प्रशंसा करता है। अनुवाद व्यापक कथा में शाऊल से जुड़ी नैतिक और धर्मवैचारिक जटिलता का समाधान किए बिना इस पद के स्मरणात्मक स्वर को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर विलाप के अनुरूप गरिमामय और हल्की काव्यात्मक ऊँचाई रखती है। ‘प्रिय और मनोहर’, ‘जीवन में/मृत्यु में’ तथा दो तुलनात्मक पंक्तियों की समानांतरता मूल पद की संरचना और स्मरणात्मक लय को प्रतिबिंबित करती है।
