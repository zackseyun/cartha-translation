  text: בְּנוֹת֙ יִשְׂרָאֵ֔ל אֶל שָׁא֖וּל בְּכֶ֑ינָה הַ/מַּלְבִּֽשְׁ/כֶ֤ם שָׁנִי֙ עִם עֲדָנִ֔ים הַֽ/מַּעֲלֶה֙ עֲדִ֣י זָהָ֔ב עַ֖ל לְבוּשְׁ/כֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/024.yaml
  text: Daughters of Israel[a], weep over Saul, who clothed you in scarlet with luxuries[b], who put ornaments of gold on your clothing.
translation:
  language: hi
  text: 'इस्राएल की बेटियो, शाऊल पर विलाप करो,


    जो तुम्हें विलास की वस्तुओं[a] सहित किरमिजी वस्त्र पहनाता था,


    जो तुम्हारे वस्त्रों पर सोने के आभूषण[b] लगाता था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “साज-सज्जा,” “मनभावनी वस्तुएँ” अथवा “आभूषण” सहित।
    reason: עֲדָנִים का सटीक आशय अनिश्चित है; इसमें विलास, सजावट या मनभावनी वस्तुओं का भाव हो सकता है।
  - marker: b
    text: या “सोने के गहने।”
    reason: עֲדִי זָהָב आभूषण अथवा गहनों का द्योतक हो सकता है।
lexical_decisions:
- source_word: בְּנוֹת יִשְׂרָאֵל
  choice: इस्राएल की बेटियो
  rationale: प्रत्यक्ष संबोधन और इब्रानी काव्यात्मक मुहावरे को बनाए रखता है; ‘स्त्रियो’ की अपेक्षा मूल रूप के अधिक निकट है।
- source_word: אֶל שָׁאוּל בְּכֶינָה
  choice: शाऊल के लिए विलाप करो
  rationale: शोकगीत के प्रसंग में אֶל शोक के विषय को सूचित करता है, और क्रिया केवल रोने के बजाय औपचारिक शोक-विलाप का भाव रखती है।
- source_word: הַמַּלְבִּשְׁכֶם שָׁנִי
  choice: जो तुम्हें ... लाल रंग के वस्त्र पहनाता था
  rationale: कृदंत की पुनरावृत्त/अभ्यस्त क्रिया को ‘पहनाता था’ व्यक्त करता है। שָׁנִי लाल/किरमिजी रंग अथवा उस रंग के कपड़े का द्योतक है; सहज हिन्दी में वस्त्र का आशय स्पष्ट किया गया है।
- source_word: עִם עֲדָנִים
  choice: सुख-सुविधाओं सहित
  rationale: עֲדָנִים के सुख, वैभव और विलास के अर्थ-क्षेत्र को व्यक्त करता है, जबकि वैकल्पिक ‘साज-सज्जा’ को पादटिप्पणी में रखा गया है।
- source_word: הַמַּעֲלֶה עֲדִי זָהָב
  choice: जो ... सोने के आभूषण सजाता था
  rationale: עלה यहाँ वस्त्र पर चढ़ाने/लगाने का भाव देता है; ‘सजाता था’ हिन्दी में स्वाभाविक है और आभूषण लगाने की क्रिया व्यक्त करता है।
- source_word: עַל לְבוּשְׁכֶן
  choice: तुम्हारे वस्त्रों पर
  rationale: पूर्वसर्ग और संज्ञा का सीधा, स्वाभाविक हिन्दी प्रतिरूप है।
