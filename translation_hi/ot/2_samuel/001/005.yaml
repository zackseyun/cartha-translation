  yaml_path: translation/ot/2_samuel/001/005.yaml
  text: Then David said to the young man who told him, “How do you know that Saul and Jonathan his son are dead?”
translation:
  language: hi
  text: तब दाऊद ने उस युवक से, जो उसे समाचार दे रहा था, पूछा, “तुम्हें कैसे पता चला कि शाऊल और उसके पुत्र योनातान मर गए हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... पूछा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; हिन्दी में प्रश्नवाचक प्रत्यक्ष कथन के साथ ‘तब ... पूछा’ स्वाभाविक है और कथानक का क्रम बनाए रखता है।
- source_word: הַנַּעַר
  choice: जवान
  rationale: נַעַר यहाँ युद्ध का समाचार देने में सक्षम युवक को सूचित करता है; ‘जवान’ आधुनिक हिन्दी में आयु और प्रसंग दोनों के अनुकूल है।
- source_word: הַמַּגִּיד לוֹ
  choice: उसे समाचार देनेवाले
  rationale: कृदन्त उस जवान की पहचान दाऊद को सूचना देनेवाले व्यक्ति के रूप में कराता है। ‘समाचार’ जोड़ना प्रसंगगत रिपोर्टिंग के अर्थ को स्पष्ट करता है।
- source_word: אֵיךְ יָדַעְתָּ
  choice: तुम्हें कैसे पता चला
  rationale: इब्रानी पूर्ण क्रिया पूर्व में प्राप्त ज्ञान का संकेत देती है; ‘कैसे पता चला’ हिन्दी में उस ज्ञान के आधार के विषय में स्वाभाविक प्रश्न है।
- source_word: כִּי
  choice: कि
  rationale: यह ज्ञात बात की विषयवस्तु प्रस्तुत करता है।
- source_word: מֵת
  choice: मर गए हैं
  rationale: इब्रानी में संयुक्त कर्ता के साथ एकवचन रूप है, पर हिन्दी में दोनों व्यक्तियों के लिए बहुवचन आवश्यक है; पूर्ण वर्तमान उनकी मृत्यु की वर्तमान वास्तविकता और पूर्व घटना दोनों व्यक्त करता है।
- source_word: בְּנוֹ
  choice: उसका पुत्र
  rationale: सर्वनाम शाऊल की ओर संकेत करता है और योनातान को उसके पुत्र के रूप में पहचानता है।
- source_word: שָׁאוּל וִיהוֹנָתָן
  choice: शाऊल और ... योनातान
  rationale: नामों को प्रचलित हिन्दी बाइबलीय वर्तनी में लिप्यंतरित किया गया है।
