translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप। ‘पुत्र’ संबंध के लिए गरिमापूर्ण है, जबकि ‘जवान’ נַעַר का प्रसंगानुकूल सामान्य रूप देता है। कोई पादटिप्पणी आवश्यक नहीं है।
