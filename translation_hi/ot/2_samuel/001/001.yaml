  yaml_path: translation/ot/2_samuel/001/001.yaml
  text: After the death of Saul[a], when David had returned from striking down the Amalekites, David stayed in Ziklag two days.
translation:
  language: hi
  text: शाऊल की मृत्यु के बाद, जब दाऊद अमालेकियों[a] को मारकर लौट आया था, तब वह दो दिन तक सिकलग में रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘अमालेक’ है, जो यहाँ सामूहिक रूप से अमालेकी लोगों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[अलग शब्द के रूप में व्यक्त नहीं]'
  rationale: यहाँ यह कथात्मक क्रम को आगे बढ़ाने वाला सूत्र है। स्वाभाविक हिन्दी में समयसूचक उपवाक्य और ‘तब’ इसके कथात्मक संबंध को पर्याप्त रूप से व्यक्त करते हैं।
- source_word: אַחֲרֵי מוֹת שָׁאוּל
  choice: शाऊल की मृत्यु के बाद
  rationale: इब्रानी संज्ञात्मक समय-वाक्यांश को औपचारिक और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: וְדָוִד שָׁב
  choice: जब दाऊद ... लौट आया था
  rationale: पूर्ण भूतकाल मुख्य कथात्मक क्रिया से पहले पूरी हुई वापसी को स्पष्ट करता है।
- source_word: מֵהַכּוֹת
  choice: मारकर
  rationale: נכה की सैन्य हिंसा को बनाए रखता है, पर पूरे समुदाय के संहार का अनावश्यक दावा नहीं करता। ‘से लौटना’ का संबंध हिन्दी में पूर्वकालिक कृदंत द्वारा स्वाभाविक रूप से व्यक्त होता है।
- source_word: אֶת הָעֲמָלֵק
  choice: अमालेकियों
  rationale: एकवचन जातिनाम ‘अमालेक’ यहाँ सामूहिक रूप से अमालेकी लोगों का सूचक है; हिन्दी में बहुवचन जातिनाम अधिक स्पष्ट और स्वाभाविक है।
- source_word: וַיֵּשֶׁב
  choice: रहा
  rationale: दो दिन की सीमित अवधि के संदर्भ में ‘रहा’ स्वाभाविक है और स्थायी निवास का अर्थ नहीं देता।
- source_word: בְּצִקְלָג
  choice: सिकलग में
  rationale: स्थाननाम और स्थानीय पूर्वसर्ग का मानक हिन्दी रूप।
- source_word: יָמִים שְׁנָיִם
  choice: दो दिन तक
  rationale: अवधि को आधुनिक हिन्दी में स्पष्ट और सहज ढंग से व्यक्त करता है।
