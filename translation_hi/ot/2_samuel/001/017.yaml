  rationale: इस विलाप-प्रसंग में עַל शोक के विषय या जिनके लिए शोक किया गया उन्हें चिह्नित करता है। हिंदी में ‘के लिए’ स्वाभाविक है और शोक-संबंध स्पष्ट करता है।
- source_word: שָׁאוּל
