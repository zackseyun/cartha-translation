base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/002.yaml
  text: On the third day[a], behold, a man came from the camp, from Saul, with his clothes torn and dirt on his head. And when he came to David[c][b], he fell to the ground and bowed down.
translation:
  language: hi
  text: तीसरे दिन, देखो, एक आदमी छावनी से, शाऊल के पास से[a], आया; उसके कपड़े फटे हुए थे और उसके सिर पर मिट्टी थी[b]। जब वह दाऊद के पास आया, तब वह भूमि पर गिर पड़ा और दण्डवत् किया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शाऊल के साथ से” या “शाऊल की ओर से।” इब्रानी अभिव्यक्ति उस आदमी का शाऊल से संबंध या निकटता बताती है; यह आवश्यक नहीं कि शाऊल ने उसे सीधे भेजा हो।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “उसके सिर पर मिट्टी।” यह शोक या विलाप का प्रचलित संकेत था।
    reason: cultural_note
  - marker: c
    text: या, “उसने स्वयं को भूमि तक झुका दिया।” यह क्रिया प्रसंग के अनुसार गहरा सम्मान, अधीनता, या श्रद्धापूर्वक झुकना बता सकती है।
    reason: lexical_alternative
