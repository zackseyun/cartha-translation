- source_word: מִן־הַמַּחֲנֶה מֵעִם שָׁאוּל
  choice: शाऊल की छावनी से
  rationale: यह आदमी के शाऊल से जुड़े सैन्य पड़ाव या पक्ष से आने का स्वाभाविक हिन्दी रूप है और शाऊल द्वारा सीधे भेजे जाने का अर्थ नहीं जोड़ता।
- source_word: וּבְגָדָיו קְרֻעִים
  choice: उसके कपड़े फटे हुए थे
  rationale: यह शोकसूचक दशा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַאֲדָמָה עַל־רֹאשׁוֹ
  choice: उसके सिर पर मिट्टी पड़ी थी
  rationale: אֲדָמָה का मूल अर्थ भूमि या मिट्टी है; यहाँ सिर पर मिट्टी डालना शोक का संकेत है।
- source_word: וַיִּפֹּל אַרְצָה
  choice: भूमि पर गिरकर
  rationale: दिशासूचक रूप אַרְצָה नीचे भूमि की ओर गिरने को दर्शाता है।
- source_word: וַיִּשְׁתָּחוּ
  choice: दण्डवत् हुआ
  rationale: यह सम्मान या अधीनता में भूमि तक झुकने का संक्षिप्त और प्रसंगानुकूल हिन्दी रूप है, बिना इसे उपासना ठहराए।
theological_decisions:
- issue: וַיִּשְׁתָּחוּ में सम्मान और उपासना के बीच अर्थ-सीमा
  choice: दण्डवत् हुआ
  alternative: आराधना की / प्रणाम किया
  rationale: इस मानवीय राजकीय प्रसंग में क्रिया गहरा सम्मान या अधीनता सूचित करती है। ‘आराधना की’ अनावश्यक धार्मिक अर्थ जोड़ती, जबकि केवल ‘प्रणाम किया’ शारीरिक रूप से भूमि तक झुकने की तीव्रता घटा सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘छावनी’ सैन्य संदर्भ स्पष्ट करती है; ‘दण्डवत् हुआ’ गहरे सम्मान की देहभंगिमा को साधारण पाठक के लिए संक्षेप में व्यक्त करता है।
