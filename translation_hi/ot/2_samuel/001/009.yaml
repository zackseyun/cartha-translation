base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/009.yaml
  text: And he said to me[a], ‘Please stand over me and put me to death, for anguish has seized me[b], though my life is still in me.’
translation:
  language: hi
  text: तब उसने मुझसे कहा, “कृपा करके मेरे ऊपर खड़ा हो और मुझे मार डाल, क्योंकि पीड़ा ने मुझे जकड़ लिया है[a], जबकि मेरा प्राण अब भी मुझमें है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऐंठन ने मुझे जकड़ लिया है” अथवा “दौरे ने मुझे पकड़ लिया है”; यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और उसका ठीक अर्थ अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “क्योंकि मेरा सारा प्राण अब भी मुझमें है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: तब उसने मुझसे कहा
  rationale: वय्यिक्तोल कथा के अगले क्रम को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ सहज कथात्मक संबंध व्यक्त करता है।
- source_word: עֲמָד נָא עָלַי
  choice: कृपा करके मेरे ऊपर खड़े होकर
  rationale: עָמַד का मूल अर्थ ‘खड़ा होना’ है और עַל घायल पड़े व्यक्ति के ऊपर स्थान लेने का भाव देता है; נָא की विनम्र विनती ‘कृपा करके’ से व्यक्त होती है।
- source_word: וּמֹתְתֵנִי
  choice: मुझे मार डाल
  rationale: מות के कारक रूप का सीधा अर्थ मृत्यु देना है। ‘मार डाल’ युद्धभूमि के प्रसंग में स्वाभाविक और स्पष्ट है, बिना अनावश्यक शिष्टोक्ति के।
- source_word: אֲחָזַנִי
  choice: ने मुझे जकड़ लिया है
  rationale: אָחַז किसी वस्तु या दशा के बलपूर्वक पकड़ लेने का भाव रखता है; ‘जकड़ लिया’ उसकी तीव्रता बनाए रखता है।
- source_word: הַשָּׁבָץ
  choice: पीड़ा
  rationale: यह दुर्लभ शब्द है और इसका ठीक अर्थ अनिश्चित है। ‘पीड़ा’ अतिनिर्धारण से बचती है; शारीरिक अर्थ की संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: כִּי כָל עוֹד נַפְשִׁי בִּי
  choice: जबकि मेरा प्राण अब भी मुझमें है
  rationale: נֶפֶשׁ यहाँ जीवित होने या जीवन-शक्ति का संकेत देता है। ‘प्राण ... मुझमें है’ मूल बिंब रखता है, और ‘जबकि’ प्रसंग में כִּי के संभावित विरोधार्थक संबंध को व्यक्त करता है।
theological_decisions:
- issue: נֶפֶשׁ का अर्थ
  choice: प्राण
  alternative: आत्मा
  rationale: इस प्रसंग में शब्द तकनीकी रूप से देह से अलग अमूर्त आत्मा की शिक्षा नहीं देता, बल्कि जीवित प्राण या जीवन को दर्शाता है; ‘प्राण’ इस अर्थ और मूल अभिव्यक्ति दोनों को सुरक्षित रखता है।
- issue: अंतिम כִּי का वाक्य-संबंध
  choice: जबकि
  alternative: क्योंकि
  rationale: रूप की दृष्टि से כִּי कारणसूचक हो सकता है, पर यहाँ शाऊल के अभी जीवित होने और मृत्यु माँगने के बीच विरोध का भाव प्रसंगानुकूल है। कारणसूचक संभावना को पूरी तरह सिद्ध मानकर पाठ को समतल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। प्रत्यक्ष वचन में विनती की तीव्रता बनाए रखने के लिए ‘मार डाल’ चुना गया है; दुर्लभ चिकित्सकीय शब्द का अर्थ मुख्य पाठ में सामान्य रखा गया और उसकी अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
