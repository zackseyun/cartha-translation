    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּבִי
  choice: तेरा गौरव
  rationale: צְבִי का अर्थ ‘सुंदरता,’ ‘वैभव/गौरव’ या ठोस अर्थ में ‘चिकारा/हिरन’ हो सकता है। शाऊल और योनातान पर इस विलाप में ‘तेरा गौरव’ इस्राएल को किए गए संबोधन और अगली पदबंध की द्वितीय पुरुष एकवचन रचना के साथ स्वाभाविक है, जबकि विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יִשְׂרָאֵל
  choice: हे इस्राएल
  rationale: ‘हे’ से विलाप में निहित प्रत्यक्ष संबोधन स्पष्ट और स्वाभाविक होता है।
- source_word: בָּמוֹתֶיךָ
  choice: तेरी ऊँचाइयों
  rationale: यह भौगोलिक ऊँचे स्थानों का काव्यात्मक बोध बनाए रखता है और अनावश्यक रूप से पूजा-स्थलों का अर्थ आरोपित नहीं करता।
- source_word: חָלָל
  choice: मारा पड़ा है
  rationale: यह मारे गए व्यक्ति की अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है; यहाँ केवल घायल होने के बजाय युद्ध में मारे जाने का भाव है।
- source_word: אֵיךְ נָפְלוּ גִבּוֹרִים
  choice: हाय, वीर कैसे गिर पड़े हैं
  rationale: ‘हाय’ विलापात्मक विस्मय को स्वाभाविक हिन्दी में सामने लाता है; ‘वीर’ גִבּוֹרִים की काव्यात्मक व्यापकता और ‘गिर पड़े हैं’ पूर्ण हुई घटना की वर्तमान मार्मिकता बनाए रखते हैं।
theological_decisions:
- issue: ‘गौरव’ की पहचान
  choice: पद में इसे किसी एक व्यक्ति के नाम से स्पष्ट नहीं किया गया
  alternative: इसे सीधे ‘शाऊल’ या ‘शाऊल और योनातान’ कहना
  rationale: मूल काव्यात्मक रूप צְבִי को रूपक के रूप में रखता है; किसी विशिष्ट पहचान को पाठ में जोड़ना वास्तविक अस्पष्टता को समय से पहले समाप्त कर देगा।
