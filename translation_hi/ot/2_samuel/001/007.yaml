    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן אַחֲרָיו
  choice: उसने पीछे मुड़कर
  rationale: शाब्दिक रूप ‘उसने अपने पीछे की ओर रुख किया’ है; आधुनिक हिन्दी में ‘पीछे मुड़कर’ स्थानगत अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיִּרְאֵנִי
  choice: मुझे देखा
  rationale: ראה और प्रथम पुरुष एकवचन प्रत्यय का सीधा अर्थ ‘मुझे देखा’ है।
- source_word: וַיִּקְרָא אֵלַי
  choice: मुझे पुकारा
  rationale: קרא के साथ אֶל किसी व्यक्ति को पुकारने का अर्थ देता है; ‘पुकारा’ यहाँ ‘बुलवाया’ जैसे अधिक प्रबल भाव से बचता है।
- source_word: וָאֹמַר
  choice: मैंने कहा
  rationale: אמר का सामान्य अर्थ ‘कहना’ है; संवाद के कारण ‘उत्तर दिया’ संभव है, पर ‘कहा’ स्रोत के अधिक निकट है।
- source_word: הִנֵּנִי
  choice: मैं यहाँ हूँ
  rationale: यह स्वयं को उपस्थित और उपलब्ध बताने वाला पारंपरिक उत्तर है; वर्तमान हिन्दी में स्पष्ट और स्वाभाविक है।
