base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/015.yaml
  text: Then David called one of the young men and said[a], “Come near; strike him down.” So he struck him, and he died.
translation:
  language: hi
  text: तब दाऊद ने जवानों में से एक को बुलाया और कहा, “पास आ और उस पर वार कर।”[a] उसने उसे मारा, और वह मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उस पर वार कर” का अनुवाद “उस पर हमला कर” भी हो सकता है। इब्रानी पद (פְּגַע בּוֹ) व्यापक रूप से हिंसक आक्रमण का अर्थ दे सकता है; यहाँ प्रसंग से उसका घातक परिणाम स्पष्ट है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: बुलाकर
  rationale: कרא यहाँ किसी को अपने पास बुलाने का सामान्य कथात्मक अर्थ देता है; ‘बुलाकर’ अगले क्रियापद के साथ स्वाभाविक हिन्दी वाक्य बनाता है।
- source_word: לְאַחַד מֵהַנְּעָרִים
  choice: जवानों में से एक को
  rationale: נְעָרִים आयु और अधीनस्थ स्थिति दोनों का संकेत दे सकता है। ‘जवानों’ मूल शब्द का सीधा अर्थ रखता है और अनावश्यक रूप से ‘सेवक’ या ‘अंगरक्षक’ जैसी निश्चित भूमिका नहीं जोड़ता।
- source_word: גַּשׁ
  choice: पास आ
  rationale: נגשׁ का आज्ञार्थ निकट आने को कहता है; ‘पास आ’ आधुनिक हिन्दी में सहज और सीधा है।
- source_word: פְּגַע בּוֹ
  choice: उस पर वार कर
  rationale: פגע ב हिंसक प्रहार या हमला करने का अर्थ दे सकता है। प्रसंग में आदेश घातक है, पर मूल क्रिया सामान्य ‘मार डालना’ क्रिया नहीं है; इसलिए ‘वार कर’ हिंसा को व्यक्त करते हुए क्रिया और परिणाम के बीच का भेद बनाए रखता है।
- source_word: וַיַּכֵּהוּ
  choice: उसने उसे मारा
  rationale: נכה का मूल अर्थ प्रहार करना या मारना है। अगला खंड मृत्यु का परिणाम अलग से बताता है, इसलिए उसे ‘मार डाला’ में समेटा नहीं गया।
- source_word: וַיָּמֹת
  choice: और वह मर गया
  rationale: מות मृत्यु को बताने वाली सामान्य क्रिया है और यहाँ कथात्मक क्रम को आगे बढ़ाती है; सीधा अनुवाद मूल की क्रिया-परिणाम संरचना बनाए रखता है।
