id: 2SA.1.20
reference: 2 Samuel 1:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַל תַּגִּ֣ידוּ בְ/גַ֔ת אַֽל תְּבַשְּׂר֖וּ בְּ/חוּצֹ֣ת אַשְׁקְל֑וֹן פֶּן תִּשְׂמַ֨חְנָה֙ בְּנ֣וֹת פְּלִשְׁתִּ֔ים פֶּֽן תַּעֲלֹ֖זְנָה בְּנ֥וֹת הָ/עֲרֵלִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/020.yaml
  text: Do not tell it in Gath[a]; do not proclaim the news in the streets of Ashkelon, lest the daughters of the Philistines rejoice[b], lest the daughters of the uncircumcised exult.
translation:
  language: hi
  text: 'गत में यह बात मत बताओ;

    अश्कलोन की सड़कों[a] पर इसका समाचार मत सुनाओ,

    कहीं ऐसा न हो कि पलिश्ती बेटियाँ आनन्द मनाएँ,

    कहीं ऐसा न हो कि खतनारहित लोगों की बेटियाँ[b] उल्लास से झूम उठें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अश्कलोन के चौकों में।”
    reason: חוּצוֹת सड़कों के साथ नगर के खुले सार्वजनिक चौकों को भी सूचित कर सकता है।
  - marker: b
    text: “खतनारहित लोगों” मूल इब्रानी का शाब्दिक रूप है; यहाँ यह पलिश्तियों के लिए वाचा-संबंधी तिरस्कारसूचक पद है।
    reason: शाब्दिक अर्थ और पद की धार्मिक-सांस्कृतिक धार स्पष्ट करना।
lexical_decisions:
- source_word: תַּגִּידוּ
  choice: यह बात मत बताओ
  rationale: נגד का अर्थ ‘बताना/सूचित करना’ है। इब्रानी में कर्म निहित है; हिन्दी में प्रसंगानुसार ‘यह बात’ जोड़ने से शाऊल और योनातान की मृत्यु के समाचार का संकेत स्वाभाविक रूप से स्पष्ट होता है।
- source_word: בְגַת
  choice: गत में
  rationale: בְ स्थानसूचक है और גַת नगर का नाम है; हिन्दी बाइबलीय रूप ‘गत’ रखा गया है।
- source_word: תְּבַשְּׂרוּ
  choice: इसका समाचार मत सुनाओ
  rationale: בשר के पिएल रूप में समाचार लाने या घोषित करने का भाव है। ‘समाचार सुनाओ’ सार्वजनिक घोषणा का अर्थ देता है और पहली पंक्ति के ‘बताओ’ के साथ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: בְּחוּצֹת אַשְׁקְלוֹן
  choice: अश्कलोन की सड़कों पर
  rationale: חוּצוֹת नगर की सड़कों अथवा खुले सार्वजनिक स्थानों को सूचित कर सकता है। ‘सड़कों पर’ आधुनिक हिन्दी में स्वाभाविक है; ‘चौकों में’ को पादटिप्पणी में रखा गया है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह नकारात्मक आशंका या परिणाम प्रस्तुत करता है। हिन्दी में यह रूप दोनों समानांतर उपवाक्यों की चेतावनीपूर्ण लय बनाए रखता है।
- source_word: תִּשְׂמַחְנָה
  choice: आनन्द मनाएँ
  rationale: שמח प्रसन्न होने या आनन्दित होने का सामान्य भाव व्यक्त करता है; यह शोकगीत के विपरीत शत्रुओं के उत्सव को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: בְּנוֹת פְּלִשְׁתִּים
  choice: पलिश्ती बेटियाँ
  rationale: शाब्दिक ‘पलिश्तियों की बेटियाँ’ का संक्षिप्त और स्वाभाविक हिन्दी रूप है; स्त्रियों को उत्सव मनाने वाली सामूहिक काव्यात्मक छवि के रूप में बनाए रखता है।
- source_word: תַּעֲלֹזְנָה
  choice: उल्लास से झूम उठें
  rationale: עלז प्रबल, उमंगभरे हर्ष को व्यक्त करता है। यह चयन पहले क्रियापद ‘आनन्द मनाएँ’ से भाव की तीव्रता बढ़ाता है।
- source_word: בְּנוֹת הָעֲרֵלִים
  choice: खतनारहित लोगों की बेटियाँ
  rationale: עֲרֵלִים का शाब्दिक अर्थ ‘खतनारहित लोग’ है। इसे सामान्यीकृत अपमानसूचक शब्द में बदलने के बजाय मूल की वाचा-संबंधी और polemical धार सुरक्षित रखी गई है।
theological_decisions:
- issue: वाचा-संबंधी तिरस्कारसूचक עֲרֵלִים का अनुवाद
  choice: खतनारहित लोग
  alternative: अन्यजाति / अशुद्ध लोग
  rationale: मूल शब्द सीधे खतने की अनुपस्थिति को बताता है और इस प्रकार वाचा की पहचान से जुड़ी बयानबाजी रखता है। ‘अन्यजाति’ या ‘अशुद्ध’ अर्थ का सामान्यीकरण करते और मूल की शारीरिक-वाचा संबंधी भाषा को मिटा देते।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और शोकगीत के अनुकूल रखी गई है। समानांतर ‘कहीं ऐसा न हो कि’ संरचना और दूसरे आनंदसूचक क्रियापद की बढ़ी हुई तीव्रता मूल काव्य का प्रभाव बनाए रखते हैं।
