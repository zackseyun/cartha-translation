base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/003.yaml
  text: David said to him[a], “Where have you come from?” He said to him, “I have escaped from the camp of Israel.”
translation:
  language: hi
  text: दाऊद ने उससे कहा, “तुम कहाँ से आए हो?” उसने उससे कहा, “मैं इस्राएल की छावनी से बचकर निकला हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵי מִזֶּה
  choice: कहाँ से
  rationale: यह इब्रानी मुहावरा किसी के आने के स्थान या स्रोत के विषय में पूछता है। आधुनिक हिन्दी में ‘कहाँ से’ स्वाभाविक और अर्थ-सटीक है।
- source_word: תָּבוֹא
  choice: आए हो
  rationale: प्रत्यक्ष संवाद में यह रूप अभी-अभी पूरी हुई यात्रा के आरम्भ-स्थान के विषय में प्रश्न करता है; ‘आए हो’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִמַּחֲנֵה יִשְׂרָאֵל
  choice: इस्राएल की छावनी से
  rationale: מַחֲנֶה सैन्य छावनी को सूचित करता है। सम्बन्धकारक रचना को हिन्दी में स्वाभाविक ‘इस्राएल की छावनी’ से व्यक्त किया गया है।
- source_word: נִמְלָטְתִּי
  choice: मैं ... बचकर निकला हूँ
  rationale: मूल क्रिया संकट से सफलतापूर्वक निकल भागने या बच निकलने का भाव देती है। ‘बचकर निकला हूँ’ खतरे से निकल आने और वर्तमान परिणाम—दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: कहा ... कहा
  rationale: मूल पाठ दोनों कथनों के लिए एक ही सामान्य क्रिया दोहराता है। हिन्दी में भी यह पुनरावृत्ति स्पष्ट और स्वाभाविक है; ‘पूछा ... उत्तर दिया’ जैसी व्याख्यात्मक विविधता नहीं जोड़ी गई।
- source_word: דָּוִד
  choice: दाऊद
  rationale: नाम का प्रचलित मानक हिन्दी बाइबलीय रूप रखा गया है।
