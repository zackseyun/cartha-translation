  edition: WLC
  text: הָרֵ֣י בַ/גִּלְבֹּ֗עַ אַל טַ֧ל וְ/אַל מָטָ֛ר עֲלֵי/כֶ֖ם וּ/שְׂדֵ֣י תְרוּמֹ֑ת כִּ֣י שָׁ֤ם נִגְעַל֙ מָגֵ֣ן גִּבּוֹרִ֔ים מָגֵ֣ן שָׁא֔וּל בְּלִ֖י מָשִׁ֥יחַ בַּ/שָּֽׁמֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/021.yaml
  text: Mountains of Gilboa[a], let there be no dew or rain upon you, nor fields of offerings; for there the shield of the mighty was defiled, the shield of Saul[b], not anointed with oil.
translation:
  language: hi
  text: गिलबो के पर्वतों, तुम पर न ओस पड़े, न वर्षा हो, और न भेंटों के खेत[a] हों; क्योंकि वहीं वीरों की ढाल कलंकित हुई—शाऊल की ढाल[b], जिस पर तेल नहीं लगाया गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस कठिन इब्रानी पद का अनुवाद “और न उपजाऊ खेत,” “और न पहली उपज के खेत,” या “और न उठाई हुई भेंटों के खेत” भी हो सकता है। यहाँ प्रयुक्त शब्द प्रायः परमेश्वर के लिए अलग की गई भेंटों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम वाक्यांश को शाऊल की ढाल पर तेल न लगाए जाने के अर्थ में समझा जा सकता है, न कि आवश्यक रूप से शाऊल के अभिषिक्त होने के उल्लेख के रूप में। युद्ध से पहले चमड़े की ढाल पर तेल लगाना उसकी देखभाल और तैयारी का एक प्रचलित तरीका था।
    reason: cultural_note
lexical_decisions:
- source_word: הָרֵי בַגִּלְבֹּעַ
  choice: गिलबो पर्वतों
  rationale: यह गिलबो के पर्वतीय क्षेत्र को सीधे संबोधित करने वाला संबंध-वाचक पद है। हिन्दी में संबोधन का बहुवचन रूप कविता की गरिमा और प्रत्यक्ष संबोधन दोनों बनाए रखता है।
- source_word: אַל טַל וְאַל מָטָר עֲלֵיכֶם
  choice: तुम पर न ओस पड़े, न वर्षा हो
  rationale: אַל से व्यक्त शाप-सदृश कामना को स्वाभाविक हिन्दी इच्छार्थक निषेध में रखा गया है और पर्वतों से प्रत्यक्ष संबोधन सुरक्षित है।
- source_word: וּשְׂדֵי תְרוּמֹת
  choice: और न भेंटों के खेत रहें
  rationale: इब्रानी पद कठिन है। תְרוּמוֹת प्रायः परमेश्वर के लिए अलग की गई भेंटों को दर्शाता है; इसलिए मुख्य पाठ में इस धार्मिक अर्थ को पारदर्शी रूप से रखा गया है और अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: כִּי שָׁם
  choice: क्योंकि वहीं
  rationale: यह पूर्ववर्ती शाप-सदृश कामना का कारण बताता है; 'वहीं' स्थल पर काव्यात्मक बल बनाए रखता है।
- source_word: נִגְעַל
  choice: अपवित्र हुई
  rationale: निफ़अल रूप अपवित्र या कलंकित होने का भाव दे सकता है। युद्ध में पड़ी ढाल के अपमान को व्यक्त करते हुए यह अनिश्चितता को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: מָגֵן גִּבּוֹרִים
  choice: वीरों की ढाल
  rationale: גִּבּוֹרִים युद्ध के वीर या पराक्रमी पुरुष हैं। 'वीरों' शोकगीत के ऊँचे काव्यात्मक स्वर में संक्षिप्त और सहज है।
- source_word: מָגֵן שָׁאוּל
  choice: शाऊल की ढाल
  rationale: सामान्य 'वीरों की ढाल' के बाद विशेष रूप से शाऊल की ढाल कहने वाली समानाधिकरणात्मक पुनरुक्ति सुरक्षित रखी गई है।
- source_word: בְּלִי מָשִׁיחַ בַּשָּׁמֶן
  choice: जिस पर तेल नहीं लगाया गया था
  rationale: यह वाक्यांश सबसे स्वाभाविक रूप से ढाल पर तेल लगाने या मलने की प्रथा को सूचित करता है। हिन्दी में 'तेल लगाया गया' सामान्य पाठक के लिए स्पष्ट है और 'अभिषिक्त' शब्द से उत्पन्न अनपेक्षित मसीही अर्थ से बचता है।
theological_decisions:
- issue: מָשִׁיחַ को धार्मिक उपाधि मानने या ढाल पर तेल लगाने की क्रिया मानने की संभावना
  choice: इसे शाऊल की ढाल पर तेल न लगाए जाने के रूप में प्रस्तुत किया गया है।
  alternative: इसे शाऊल स्वयं के 'अभिषिक्त' होने से संबंधित माना जा सकता है।
  rationale: בַּשָּׁמֶן ('तेल से') के साथ इसका निकट संबंध और युद्ध-सामग्री का प्रसंग ढाल को तेल से तैयार करने का अर्थ अधिक समर्थित करते हैं। फिर भी पादटिप्पणी पाठक को बताती है कि यह शाऊल की उपाधि के बजाय ढाल की दशा का संदर्भ है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण शोकगीत-शैली रखी गई है। वाक्य विन्यास काव्यात्मक है, पर सामान्य पाठक के लिए सहज है। कठिन धार्मिक-कृषि पद को मुख्य पाठ में औपचारिक निकटता के साथ रखा गया और विकल्प पादटिप्पणी में दिए गए हैं।
