base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/004.yaml
  text: David said to him[a], “What happened? Please tell me.” He said, “The people fled from the battle, and many of the people also fell and died[c][b]; and Saul and Jonathan his son are also dead.”
translation:
  language: hi
  text: दाऊद ने उससे कहा[a], “क्या हुआ? कृपया मुझे बताओ।” उसने कहा, “लोग युद्ध से भाग गए, और लोगों में से बहुत-से गिर पड़े[b] और मर गए; शाऊल और उसका पुत्र योनातान भी मर गए हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बात क्या थी?”
    reason: lexical_alternative
  - marker: b
    text: युद्ध के वर्णन में “गिरना” प्रायः मारे जाने का संकेत देता है; इसके बाद आए “मर गए” शब्द परिणाम को स्पष्ट करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה הָיָה הַדָּבָר
  choice: क्या हुआ?
  rationale: शाब्दिक अर्थ ‘बात क्या थी?’ है, पर प्रसंग में दाऊद घटनाओं का समाचार पूछ रहा है। ‘क्या हुआ?’ आधुनिक हिन्दी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: הַגֶּד נָא לִי
  choice: मुझे बताओ
  rationale: הַגֶּד का अर्थ ‘बताओ/समाचार दो’ है और נָא अनुरोध या आग्रह प्रकट करता है। हिन्दी में प्रसंग और स्वर के अनुसार ‘मुझे बताओ’ स्वाभाविक है।
- source_word: אֲשֶׁר נָס הָעָם מִן הַמִּלְחָמָה
  choice: लोग युद्ध से भाग गए
  rationale: נָס स्पष्टतः ‘भाग गए’ है। הָעָם सामूहिक रूप से युद्ध में गए लोगों को सूचित करता है; ‘लोग’ मूल की व्यापकता बनाए रखता है।
- source_word: וְגַם הַרְבֵּה נָפַל מִן הָעָם וַיָּמֻתוּ
  choice: और लोगों में से बहुत-से मारे गए और मर गए
  rationale: युद्ध के प्रसंग में נָפַל का भाव ‘गिर पड़े/मारे गए’ है, जबकि וַיָּמֻתוּ मृत्यु को अलग से स्पष्ट करता है। ‘मारे गए और मर गए’ दोनों क्रियाओं को बनाए रखता है, यद्यपि हिन्दी में जानबूझकर कुछ पुनरुक्ति सुनाई देती है।
- source_word: וְגַם שָׁאוּל וִיהוֹנָתָן בְּנוֹ מֵתוּ
  choice: शाऊल और उसका पुत्र योनातान भी मर गए हैं
  rationale: מֵתוּ पूर्ण हुई मृत्यु की सूचना देता है; समाचार सुनाते समय हिन्दी का ‘मर गए हैं’ स्वाभाविक है। ‘उसका पुत्र’ मूल के בְּנוֹ को स्पष्ट रूप से सुरक्षित रखता है।
