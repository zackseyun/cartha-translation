base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/006.yaml
  text: And the young man who told him said[a], “I happened to be on Mount Gilboa, and behold, Saul was leaning on his spear, and behold[c][b], the chariots and the horsemen were closing in on him.”
translation:
  language: hi
  text: तब जो जवान उसे समाचार दे रहा था, उसने कहा, “मैं संयोगवश गिलबोआ पर्वत पर आ पड़ा था[a]। और वहाँ शाऊल अपने भाले का सहारा लिए हुए था; और देखो, रथ-दल और घुड़सवार उसके बिलकुल निकट पहुँच रहे थे[b][c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे “मैं संयोगवश गिलबोआ पर्वत पर था” भी कहा जा सकता है। इब्रानी मुहावरा वहाँ आकस्मिक रूप से उपस्थित होने के भाव पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: या “रथ और घुड़सवार,” “रथ-दल और सवार,” अथवा “रथ-दल और अश्वारोही।”
    reason: lexical_alternative
  - marker: c
    text: या “उसे जा पकड़ा था,” “उसे पकड़ लिया था,” अथवा “उसका बहुत निकट से पीछा कर रहे थे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: जवान
  rationale: यहाँ נַעַר अमालेकी संदेशवाहक युवक को सूचित करता है। ‘जवान’ स्वाभाविक है और ‘बालक’ या पद-सूचक ‘सेवक’ की भ्रामक ध्वनि से बचता है।
- source_word: הַמַּגִּיד לוֹ
  choice: जो उसे यह समाचार दे रहा था
  rationale: נגד का कृदंत उस जवान को दाऊद के सामने समाचार सुनानेवाले के रूप में पहचानता है; हिन्दी में यह अभिव्यक्ति प्रसंग को स्पष्ट और सहज रखती है।
- source_word: נִקְרֹא נִקְרֵיתִי
  choice: मैं संयोग से ... था
  rationale: धातु קרה के क्रियार्थक संज्ञा और सीमित क्रिया का मेल आकस्मिक उपस्थिति पर बल देता है। ‘संयोग से’ उस बल को पठनीय हिन्दी में व्यक्त करता है।
- source_word: בְּהַר הַגִּלְבֹּעַ
  choice: गिलबोआ पर्वत पर
  rationale: नामित पर्वत के साथ הַר का सीधा और प्रचलित भौगोलिक रूप।
- source_word: וְהִנֵּה
  choice: वहाँ मैंने देखा कि ... और
  rationale: הִנֵּה दृश्य की ओर जीवंत ध्यान खींचता है। आधुनिक हिन्दी में ‘वहाँ मैंने देखा कि’ पहले प्रयोग का कथात्मक बल स्वाभाविक रूप से देता है; दूसरे प्रयोग का प्रवाह ‘और’ में निहित है।
- source_word: נִשְׁעָן עַל חֲנִיתוֹ
  choice: अपने भाले का सहारा लिए हुए था
  rationale: निफ़ाल कृदंत शारीरिक सहारे को बताता है। यह हिन्दी में ‘भाले पर झुका था’ की संभावित अस्पष्टता से बचते हुए अर्थ को ठीक व्यक्त करता है।
- source_word: הָרֶכֶב
  choice: रथ
  rationale: רֶכֶב सामूहिक अर्थ में रथ-दल या रथों को सूचित कर सकता है। हिन्दी में ‘रथ’ सामूहिक सैन्य संदर्भ में सहज है।
- source_word: בַעֲלֵי הַפָּרָשִׁים
  choice: घुड़सवार
  rationale: शाब्दिक रूप से घोड़ों के स्वामी/सवार; सैन्य प्रसंग में ‘घुड़सवार’ सबसे स्पष्ट और सामान्य समतुल्य है।
- source_word: הִדְבִּקֻהוּ
  choice: उसके बिलकुल निकट आ पहुँचे थे
  rationale: דבק का हिफ़ील रूप पीछा करते हुए पकड़ लेने, जा मिलने या निकट पहुँचने का अर्थ दे सकता है। मुख्य पाठ निकट आ पहुँचने का भाव रखता है और पूर्णतः पकड़ लिए जाने को अनिवार्य नहीं बनाता।
