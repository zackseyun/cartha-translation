  yaml_path: translation/ot/2_samuel/001/013.yaml
  text: David said to the young man who told him[a], “Where are you from?” And he said, “I am the son of an Amalekite sojourner.”
translation:
  language: hi
  text: दाऊद ने उस युवक से, जिसने उसे समाचार दिया था, पूछा, “तुम कहाँ के हो?” उसने उत्तर दिया, “मैं एक अमालेकी परदेशी का बेटा हूँ[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं एक परदेशी का बेटा हूँ—एक अमालेकी।” हिब्रू वाक्यांश का अर्थ यह हो सकता है कि उसका पिता अमालेकी परदेशी था, या कि वक्ता अपने को एक परदेशी का बेटा और अमालेकी बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: जवान
  rationale: नַעַר यहाँ एक युवा पुरुष को सूचित करता है; प्रसंग में सेवक का अर्थ अनिवार्य नहीं है। ‘जवान’ स्वाभाविक और संक्षिप्त आधुनिक हिन्दी है।
- source_word: הַמַּגִּיד לוֹ
  choice: जो उसे समाचार दे रहा था
  rationale: נגד का कृदन्त उस जवान को दाऊद तक समाचार पहुँचानेवाले व्यक्ति के रूप में पहचानता है। अपूर्णतासूचक ‘दे रहा था’ हिब्रू कृदन्त की प्रसंगगत भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֵי מִזֶּה
  choice: तुम कहाँ के हो?
  rationale: यह हिब्रू मुहावरा व्यक्ति के मूल स्थान या पृष्ठभूमि के विषय में पूछता है; यह हिन्दी में सीधा और बोलचाल का स्वाभाविक प्रश्न है।
- source_word: בֶּן אִישׁ
  choice: का बेटा
  rationale: शाब्दिक ‘एक पुरुष का बेटा’ हिन्दी में अनावश्यक और अस्वाभाविक है। सम्बन्धसूचक ‘का बेटा’ वंशगत पहचान को स्पष्ट रखता है।
- source_word: גֵּר
  choice: परदेशी
  rationale: גֵּר अपने मूल समुदाय से बाहर रह रहे गैर-स्थानीय निवासी को दर्शाता है। ‘परदेशी’ आधुनिक पाठक के लिए बोधगम्य है और केवल अस्थायी यात्री का अर्थ थोपे बिना बाहरी मूल की धारणा बनाए रखता है।
- source_word: עֲמָלֵקִי
  choice: अमालेकी
  rationale: यह अमालेक से सम्बन्धित जातीय पहचान है; हिन्दी बाइबलीय नाम-रूप के अनुसार ‘अमालेकी’ उपयुक्त है।
- source_word: אָנֹכִי
  choice: मैं … हूँ
  rationale: स्वतन्त्र सर्वनाम स्पष्ट आत्म-पहचान पर बल देता है; हिन्दी में ‘मैं … हूँ’ उसी कथन को स्वाभाविक रूप देता है।
theological_decisions:
- issue: גֵּר עֲמָלֵקִי में विशेषण का सम्बन्ध
  choice: मुख्य पाठ में ‘अमालेकी परदेशी’ को पिता की पहचान के रूप में लिया गया है।
  alternative: वाक्यांश को ‘एक परदेशी का बेटा—एक अमालेकी’ समझा जा सकता है, जिसमें ‘अमालेकी’ वक्ता की वंशगत पहचान को अधिक सीधे उभारता है।
  rationale: हिब्रू पदक्रम पिता को एक अमालेकी गैर-स्थानीय निवासी के रूप में पढ़ने की अनुमति देता है, पर संक्षिप्त नाममात्र वाक्य रचना सम्बन्ध में कुछ अस्पष्टता छोड़ती है। पादटिप्पणी इस वास्तविक व्याकरणिक तनाव को सुरक्षित रखती है और कोई साम्प्रदायिक निष्कर्ष नहीं जोड़ती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘परदेशी’ सामान्य पाठक के लिए ‘प्रवासी निवासी’ से अधिक स्वाभाविक है, जबकि पादटिप्पणी सामाजिक और वंशगत सम्बन्ध की हिब्रू अस्पष्टता को स्पष्ट करती है।
