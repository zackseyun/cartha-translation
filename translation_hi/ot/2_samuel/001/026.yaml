base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/026.yaml
  text: I am distressed over you[a], my brother Jonathan; you were very pleasant to me. Your love to me was wonderful, surpassing the love of women.
translation:
  language: hi
  text: मेरे भाई योनातान, मैं तेरे लिए व्याकुल हूँ! तू मुझे बहुत प्रिय था। मेरे प्रति तेरा प्रेम अद्भुत था—स्त्रियों के प्रेम[a] से भी बढ़कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्त्रियों के प्रति प्रेम से भी बढ़कर” अथवा “स्त्रियों द्वारा किए जाने वाले प्रेम से भी बढ़कर।” यह इब्रानी काव्यात्मक तुलना स्वयं यह स्पष्ट नहीं करती कि तुलना ठीक किस प्रकार के प्रेम से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צַר לִי עָלֶיךָ
  choice: तेरे कारण मैं व्याकुल हूँ
  rationale: צַר לִי गहरे निजी दुःख और व्याकुलता को व्यक्त करता है; עָלֶיךָ यहाँ शोक के कारण अथवा विषय की ओर संकेत करता है।
- source_word: אָחִי יְהוֹנָתָן
  choice: हे मेरे भाई योनातान
  rationale: אָחִי का सीधा अर्थ ‘मेरे भाई’ रखा गया है; संबोधन को स्वाभाविक हिंदी में ‘हे’ से व्यक्त किया गया है। नाम का मानक हिंदी रूप ‘योनातान’ है।
- source_word: נָעַמְתָּ לִּי מְאֹד
  choice: तू मुझे बहुत प्रिय था
  rationale: נעם यहाँ मनोहर, सुखद अथवा प्रिय होने का भाव देता है। ‘बहुत प्रिय’ हिंदी में स्वाभाविक है और आत्मीयता को अनावश्यक रूप से किसी आधुनिक श्रेणी में सीमित नहीं करता।
- source_word: נִפְלְאַתָה אַהֲבָתְךָ לִי
  choice: मेरे प्रति तेरा प्रेम अद्भुत था
  rationale: נִפְלְאַתָה असाधारण अथवा विस्मयकारी होने का भाव देता है; לִי को स्वाभाविक हिंदी में ‘मेरे प्रति’ कहा गया है।
- source_word: מֵאַהֲבַת נָשִׁים
  choice: स्त्रियों के प्रेम से भी बढ़कर
  rationale: तुलनात्मक מִן को ‘से भी बढ़कर’ से व्यक्त किया गया है। ‘स्त्रियों के प्रेम’ मूल की अस्पष्टता बनाए रखता है कि आशय स्त्रियों द्वारा किए जाने वाले प्रेम से है या स्त्रियों के प्रति प्रेम से।
theological_decisions:
- issue: ‘स्त्रियों के प्रेम’ के साथ दाऊद की तुलना का स्वरूप
  choice: तुलना को बिना यौन, रोमानी या केवल मैत्रीपूर्ण श्रेणी निर्धारित किए शाब्दिक और काव्यात्मक रूप में बनाए रखना
  alternative: इसे विशेष रूप से स्त्रियों द्वारा दिए गए प्रेम, स्त्रियों के प्रति प्रेम, वैवाहिक प्रेम अथवा किसी आधुनिक यौन श्रेणी के रूप में स्पष्ट करना
  rationale: इब्रानी पद तुलना की सटीक दिशा या प्रेम की आधुनिक श्रेणी निर्धारित नहीं करता। इसलिए मुख्य पाठ और पादटिप्पणी वास्तविक व्याख्यात्मक तनाव को सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और विलाप के अनुरूप आत्मीय हिंदी। दाऊद के सीधे संबोधन के कारण एकवचन आत्मीय ‘तू/तेरा’ रखा गया है।
