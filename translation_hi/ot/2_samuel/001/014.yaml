source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֵלָ֖י/ו דָּוִ֑ד אֵ֚יךְ לֹ֣א יָרֵ֔אתָ לִ/שְׁלֹ֨חַ֙ יָֽדְ/ךָ֔ לְ/שַׁחֵ֖ת אֶת מְשִׁ֥יחַ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/014.yaml
  text: Then David said to him[b][a], “How were you not afraid to put out your hand to destroy Yahweh’s anointed?”
translation:
  language: hi
  text: तब दाऊद ने उससे कहा, “यहोवा के अभिषिक्त[a] को नष्ट करने के लिए अपना हाथ बढ़ाने से तू कैसे नहीं डरा?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात वह राजा जो यहोवा के लिए अभिषिक्त था। यहाँ संकेत शाऊल की ओर है।
    reason: cultural_note
  - marker: b
    text: ‘कैसे’ स्तब्धता और उलाहना व्यक्त करता है; भावानुसार इसका अनुवाद ‘तू क्यों नहीं डरा...?’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו דָּוִד
  choice: तब दाऊद ने उससे कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में उसके क्रमिक बल को व्यक्त करता है। אֵלָיו का सीधा अर्थ ‘उससे’ है।
- source_word: אֵיךְ לֹא יָרֵאתָ
  choice: तू ... कैसे नहीं डरा?
  rationale: אֵיךְ का मूल अर्थ ‘कैसे’ है और यहाँ स्तब्धता तथा कठोर उलाहना व्यक्त करता है। हिन्दी में प्रश्न के अंत में यह विन्यास स्वाभाविक है।
- source_word: לִשְׁלֹחַ יָדְךָ
  choice: उस पर हाथ उठाने
  rationale: शाब्दिक रूप से ‘अपना हाथ बढ़ाने/भेजने’ वाला यह इब्रानी मुहावरा किसी के विरुद्ध हिंसक कार्रवाई करने को दर्शाता है। ‘उस पर हाथ उठाना’ आधुनिक हिन्दी का समान और स्पष्ट मुहावरा है।
- source_word: לְשַׁחֵת
  choice: नष्ट करने
  rationale: שׁחת का अर्थ-क्षेत्र मार डालने तक सीमित नहीं, बल्कि नष्ट या बरबाद करने तक विस्तृत है; ‘नष्ट करना’ मूल की व्यापकता बनाए रखता है।
- source_word: מְשִׁיחַ יְהוָה
  choice: यहोवा के अभिषिक्त
  rationale: निर्माण का अर्थ ‘यहोवा का अभिषिक्त’ है और यहाँ शाऊल को यहोवा द्वारा राजा के रूप में अभिषिक्त किए जाने की ओर संकेत है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि पदवी ‘प्रभु’ से।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम है; ‘यहोवा’ हिन्दी पाठकों के लिए परिचित लिप्यंतरण है और नाम को पदवी से प्रतिस्थापित नहीं करता।
- issue: शाऊल के लिए מְשִׁיחַ
  choice: अभिषिक्त
  alternative: मसीह
  rationale: इस ऐतिहासिक प्रसंग में शब्द शाऊल के राजकीय अभिषेक को दर्शाता है। ‘मसीह’ कहने से बाद की विशिष्ट मसीहाई पदवी का अर्थ अनावश्यक रूप से आ सकता है।
- issue: לִשְׁלֹחַ יָדְךָ का हिंसक मुहावरा
  choice: उस पर हाथ उठाने
  alternative: अपना हाथ बढ़ाने
  rationale: हिन्दी मुहावरा लक्ष्य के विरुद्ध हिंसक कार्रवाई स्पष्ट करता है, जबकि ‘हाथ बढ़ाना’ सहायता देने का अर्थ भी दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक पर गरिमापूर्ण शैली अपनाई गई है। एकवचन ‘तू’ दाऊद के अधीनस्थ संदेशवाहक को दिए गए सीधे और कठोर उलाहने के अनुकूल है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
