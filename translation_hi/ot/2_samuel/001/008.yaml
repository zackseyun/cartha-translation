lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: उसने मुझसे पूछा
  rationale: शाब्दिक अर्थ ‘उसने मुझसे कहा’ है, पर इसके बाद सीधा प्रश्न आता है; आधुनिक स्वाभाविक हिन्दी में ‘पूछा’ कथन की क्रिया को ठीक प्रकार व्यक्त करता है।
- source_word: מִי אַתָּה
  choice: तुम कौन हो?
  rationale: इब्रानी का सीधा, पुल्लिंग एकवचन प्रश्न हिन्दी में इसी स्वाभाविक रूप में आता है।
- source_word: וַיֹּאמֶר אֵלָיו
  choice: मैंने उससे कहा
  rationale: मसोरेटी पाठ में क्रिया रूप ‘उसने कहा’ है, किन्तु אֵלָיו (‘उससे/उसको’) और संवाद-संदर्भ के अनुसार अमालेकी व्यक्ति शाऊल को अपना उत्तर सुना रहा है; इसलिए आशय प्रथम पुरुष में दिया गया है और पाठगत रूप को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: עֲמָלֵקִי אָנֹכִי
  choice: मैं अमालेकी हूँ
  rationale: जातिवाचक संज्ञा और स्पष्ट प्रथम पुरुष सर्वनाम से आत्म-पहचान व्यक्त होती है; हिन्दी में ‘हूँ’ आवश्यक है।
