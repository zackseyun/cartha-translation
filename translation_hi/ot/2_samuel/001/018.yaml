  language: hi
  text: 'और उसने कहा कि यहूदा के लोगों को “धनुष” सिखाया जाए। देखो, यह याशार की पुस्तक में लिखा है:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְלַמֵּד
  choice: सिखाया जाए
  rationale: हिफ़ील infinitive यहाँ निर्देश/उद्देश्य व्यक्त करता है कि यहूदा के लोगों को कुछ सिखाया जाए।
- source_word: בְּנֵי יְהוּדָה
  choice: यहूदा के पुत्रों
  rationale: मूल अभिव्यक्ति का औपचारिक रूप सुरक्षित रखा गया है; संदर्भ में इसका अर्थ यहूदा के लोग है।
- source_word: קָשֶׁת
  choice: “धनुष”
  rationale: शाब्दिक अर्थ ‘धनुष’ है; उद्धरण-चिह्न इसे संभवतः शोकगीत के शीर्षक के रूप में दर्शाते हैं, जबकि मूल की संक्षिप्तता और संभावित अस्पष्टता बनी रहती है।
- source_word: סֵפֶר הַיָּשָׁר
  choice: याशार की पुस्तक
  rationale: पारंपरिक नाम का लिप्यंतरण किया गया है; विशेष ग्रंथ-संज्ञा के रूप में पहचान बनी रहती है।
theological_decisions:
- issue: קָשֶׁת को गीत का शीर्षक मानना या हथियार चलाने का प्रशिक्षण
  choice: उद्धरण-चिह्नों सहित “धनुष”
  alternative: धनुष चलाना सिखाया जाए
  rationale: अगली पंक्ति में पुस्तक में लिखे होने का उल्लेख इसे रचना के नाम के रूप में समझने का समर्थन करता है, पर मूल में शीर्षक स्पष्ट रूप से चिह्नित नहीं है; इसलिए शब्द का शाब्दिक रूप रखा गया है।
translation_notes:
