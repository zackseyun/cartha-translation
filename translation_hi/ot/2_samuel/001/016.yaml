base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/016.yaml
  text: Then David said to him[a], “Your blood is on your own head, for your own mouth has testified against you, saying[b], ‘I myself killed Yahweh’s anointed.’”
translation:
  language: hi
  text: तब दाऊद ने उससे कहा, “तेरा खून तेरे ही सिर पर है[a], क्योंकि तेरे अपने मुँह ने यह कहकर तेरे विरुद्ध गवाही दी है[b], ‘मैंने स्वयं यहोवा के अभिषिक्त जन को मार डाला।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात तेरी मृत्यु की जिम्मेदारी तेरी अपनी है। इसे अधिक औपचारिक ढंग से “तेरा खून तेरे ही सिर पर हो” भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तेरे मुँह ने तेरे विरुद्ध उत्तर दिया है”; इस कानूनी संदर्भ में इसका अर्थ है कि उसके अपने कथन ने उसके विरुद्ध गवाही दी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו דָּוִד
  choice: तब दाऊद ने उससे कहा
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम को व्यक्त करता है, और אֵלָיו का स्पष्ट अनुवाद ‘उससे’ है।
- source_word: דָּמֶיךָ עַל רֹאשֶׁךָ
  choice: तेरा खून तेरे ही सिर पर हो
  rationale: इब्रानी न्यायिक मुहावरे और उसके दृश्य बिंब को बनाए रखते हुए यह उसके अपने मारे जाने की जिम्मेदारी उसी पर ठहराता है; ‘ही’ आत्म-जिम्मेदारी पर बल देता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह दाऊद के निर्णय का कारण प्रस्तुत करता है और आधुनिक हिन्दी में स्पष्ट तथा स्वाभाविक है।
- source_word: פִּיךָ עָנָה בְךָ
  choice: तेरे अपने मुँह ने तेरे विरुद्ध गवाही दी है
  rationale: कानूनी संदर्भ में ענה בְּ का अर्थ किसी के विरुद्ध साक्ष्य देना है। ‘मुँह’ की देह-अंग उपमा बनाए रखने से स्वयं अपने कथन द्वारा दोषी ठहरने का बल सुरक्षित रहता है।
- source_word: לֵאמֹר
  choice: यह कहकर
  rationale: इसके बाद आने वाले कथन को गवाही की विषयवस्तु के रूप में सहज हिन्दी में जोड़ता है।
- source_word: אָנֹכִי
  choice: मैंने स्वयं
  rationale: स्वतंत्र सर्वनाम אָנֹכִי पर बल है; ‘स्वयं’ स्वीकारोक्ति की आत्म-दोषारोपक प्रमुखता को व्यक्त करता है।
- source_word: מֹתַתִּי
  choice: मार डाला
  rationale: यह क्रिया मृत्यु कारित करने को सीधे व्यक्त करती है; स्वीकारोक्ति के संदर्भ में ‘मार डाला’ स्वाभाविक और स्पष्ट है।
- source_word: מְשִׁיחַ יְהוָה
  choice: यहोवा के अभिषिक्त जन
  rationale: यह शाऊल के लिए राजकीय पदवी है। ‘अभिषिक्त जन’ अर्थ का अनुवाद करता है और इसे बाद की पारिभाषिक ‘मसीहा’ संज्ञा बनाकर नहीं प्रस्तुत करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ परमेश्वर के व्यक्तिगत वाचा-नाम को पदवी से प्रतिस्थापित किए बिना प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला नाम-रूप है और इसे केवल ‘प्रभु’ जैसी पदवी में नहीं बदलता।
- issue: राजकीय संदर्भ में מְשִׁיחַ का अनुवाद
  choice: अभिषिक्त जन
  alternative: मसीहा; अभिषिक्त
  rationale: यहाँ संकेत शाऊल की ओर है, जिसे राजा के रूप में अभिषिक्त किया गया था। अर्थसूचक अनुवाद बाद के मसीह-विषयक अर्थ को इस कथानक पर अनावश्यक रूप से आरोपित नहीं करता।
- issue: דָּמֶיךָ עַל רֹאשֶׁךָ की वाच्यता
  choice: तेरा खून तेरे ही सिर पर हो
  alternative: तेरा खून तेरे ही सिर पर है
  rationale: व्यंजनात्मक इब्रानी रूप वर्तमान कथन और न्यायिक घोषणा—दोनों ढंग से समझा जा सकता है। हिन्दी में ‘हो’ औपचारिक न्यायिक सूत्र को सुरक्षित रखता है; पादटिप्पणी जिम्मेदारी का आशय स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। न्यायिक स्वर तथा मूल के ‘खून’, ‘सिर’ और ‘मुँह’ वाले बिंब सुरक्षित हैं। सर्वनाम ‘तेरा/तेरे’ मूल के एकवचन और प्रसंग के प्रत्यक्ष संबोधन के अनुरूप हैं।
