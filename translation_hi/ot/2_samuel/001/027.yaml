id: 2SA.1.27
reference: 2 Samuel 1:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֵ֚יךְ נָפְל֣וּ גִבּוֹרִ֔ים וַ/יֹּאבְד֖וּ כְּלֵ֥י מִלְחָמָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/027.yaml
  text: How the mighty have fallen[b][a], and the weapons of war have perished!
translation:
  language: hi
  text: 'हाय, कैसे वीर गिर पड़े,

    और युद्ध के हथियार[a][b] नष्ट हो गए!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “युद्ध के उपकरण” अथवा “युद्ध का कवच-सामान।” इब्रानी पद केवल आक्रमण के हथियारों को नहीं, बल्कि व्यापक रूप से युद्ध-सामग्री को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “युद्ध के हथियार” से शाऊल और योनातान स्वयं—इस्राएल की युद्ध-शक्ति के रूप में—भी अभिप्रेत हो सकते हैं; फिर भी इसे वास्तविक युद्ध-सामग्री के अर्थ में पढ़ना भी संभव है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיךְ
  choice: हाय, कैसे
  rationale: यह प्रश्न नहीं, शोकपूर्ण विस्मय का उद्घोष है; ‘हाय, कैसे’ विलाप की भाव-तीव्रता और काव्यात्मकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נָפְלוּ
  choice: गिर पड़े
  rationale: पूर्ण हुई घटना और उसके दुखद परिणाम को व्यक्त करते हुए हिन्दी के विलापात्मक काव्य में स्वाभाविक है।
- source_word: גִבּוֹרִים
  choice: वीर
  rationale: यहाँ शब्द पराक्रमी योद्धाओं को सूचित करता है; ‘वीर’ संक्षिप्त, गरिमापूर्ण और काव्यात्मक है।
- source_word: וַיֹּאבְדוּ
  choice: नष्ट हो गए
  rationale: אבד के ‘नष्ट होना/खो जाना’ अर्थ को व्यक्त करता है और वास्तविक युद्ध-सामग्री तथा रूपकात्मक मानवीय संदर्भ—दोनों की संभावना खुली रखता है।
- source_word: כְּלֵי מִלְחָמָה
  choice: युद्ध के हथियार
  rationale: शाब्दिक अर्थ ‘युद्ध की वस्तुएँ/सामग्री’ है; यह सहज हिन्दी रूप व्यापक सैन्य उपकरण और संभावित रूपकात्मक अर्थ, दोनों को वहन कर सकता है।
theological_decisions:
- issue: ‘युद्ध के हथियार’ का संभावित रूपकात्मक संदर्भ
  choice: मुख्य पाठ में प्रत्यक्ष अर्थ रखा और पादटिप्पणी में शाऊल तथा योनातान के लिए रूपक होने की संभावना बताई
  alternative: इसे सीधे शाऊल और योनातान अथवा इस्राएल की युद्ध-शक्ति के रूप में अनूदित करना
  rationale: मूल इब्रानी व्यंजना को निश्चित नहीं करता; इसलिए वास्तविक सैन्य सामग्री और मृत वीरों के रूपक—दोनों अर्थ खुले रखने चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक विलाप। पंक्ति-विभाजन इब्रानी काव्य की समानांतर संरचना उभारता है; ‘हाय, कैसे’ אֵיךְ की शोकपूर्ण विस्मयात्मक शक्ति को स्पष्ट करता है।
