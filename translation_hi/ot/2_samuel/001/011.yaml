  text: Then David took hold of his clothes and tore them[a], and so did all the men who were with him.
translation:
  language: hi
  text: तब दाऊद ने अपने वस्त्र पकड़कर उन्हें फाड़ डाला[a], और जो सभी पुरुष उसके साथ थे, उन्होंने भी ऐसा ही किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘उसका वस्त्र’ एकवचन है, पर ‘फाड़ डाला’ के साथ कर्म-प्रत्यय बहुवचन है। हिंदी में शोक के इस मुहावरे के लिए ‘वस्त्र’ बहुवचन रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲזֵק
  choice: पकड़कर
  rationale: यह क्रिया वस्त्र फाड़ने से पहले उसे पकड़ने की शारीरिक क्रिया व्यक्त करती है; हिंदी में संयुक्त क्रिया-रचना स्वाभाविक और स्रोत के निकट है।
- source_word: בִּבְגָדוֹ
  choice: अपने वस्त्र को
  rationale: इब्रानी में संज्ञा एकवचन है। हिंदी में ‘वस्त्र’ शोक में कपड़ा फाड़ने की प्रथा के संदर्भ में स्वाभाविक, गरिमापूर्ण और अर्थतः पर्याप्त है।
- source_word: וַיִּקְרָעֵם
  choice: फाड़ डाला
  rationale: प्रत्यय रूपतः बहुवचन है, संभवतः वस्त्र-संबंधी सामूहिक भाव या पाठगत असंगति दिखाता है; हिंदी में पहले आए एकवचन ‘वस्त्र’ के साथ स्पष्ट अन्वय के लिए कर्म को दोहराए बिना ‘फाड़ डाला’ रखा गया है।
- source_word: וְגַם
  choice: ने भी ऐसा ही किया
  rationale: यह दाऊद की क्रिया को साथ के पुरुषों तक विस्तारित करता है; हिंदी में यह दीर्घवृत्त को सहज रूप से पूरा करता है।
- source_word: כָּל הָאֲנָשִׁים
  choice: सभी पुरुषों
  rationale: הָאֲנָשִׁים यहाँ पुरुष साथियों को सूचित करता है; ‘पुरुषों’ से लिंग-सटीक अर्थ बना रहता है।
- source_word: אֲשֶׁר אִתּוֹ
  choice: उसके साथ के
  rationale: यह संबंधवाचक पद दाऊद के साथ उपस्थित पुरुषों की पहचान करता है; चुना हुआ रूप संक्षिप्त और स्वाभाविक हिंदी है।
