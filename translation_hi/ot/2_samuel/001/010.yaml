  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָ/אֶעֱמֹ֤ד עָלָי/ו֙ וַ/אֲמֹ֣תְתֵ֔/הוּ כִּ֣י יָדַ֔עְתִּי כִּ֛י לֹ֥א יִֽחְיֶ֖ה אַחֲרֵ֣י נִפְל֑/וֹ וָ/אֶקַּ֞ח הַ/נֵּ֣זֶר אֲשֶׁ֣ר עַל רֹאשׁ֗/וֹ וְ/אֶצְעָדָה֙ אֲשֶׁ֣ר עַל זְרֹע֔/וֹ וָ/אֲבִיאֵ֥/ם אֶל אֲדֹנִ֖/י הֵֽנָּה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/010.yaml
  text: So I stood over him and put him to death[a], because I knew that he would not live after he had fallen. Then I took the crown that was on his head and the armlet that was on his arm[b], and I brought them here to my lord.
translation:
  language: hi
  text: तब मैं उसके ऊपर खड़ा हो गया और मैंने उसे मार डाला[a], क्योंकि मैं जानता था कि गिर पड़ने के बाद वह जीवित नहीं बचेगा। फिर मैंने उसके सिर पर रखा मुकुट और उसकी बाँह पर बँधा बाजूबंद[b] उतार लिया और उन्हें यहाँ अपने स्वामी के पास ले आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अमालेकी द्वारा दाऊद को सुनाया गया वृत्तांत है। शाऊल की मृत्यु के पहले वृत्तांत के लिए 1 शमूएल 31:4–5 देखें।
    reason: cross_reference
  - marker: b
    text: या ‘बाँह का आभूषण।’ इब्रानी शब्द बाँह पर पहने जानेवाले आभूषण को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱמֹד עָלָיו
  choice: मैं उसके ऊपर खड़ा हो गया
  rationale: עמד के साथ על यहाँ गिरे हुए शाऊल के ऊपर खड़े होने की स्थिति बताता है। यह अनुवाद निकटता और प्रभुत्वपूर्ण स्थिति—दोनों को बनाए रखता है।
- source_word: וַאֲמֹתְתֵהוּ
  choice: मैंने उसे मार डाला
  rationale: מות का हिफ़ील रूप स्पष्ट रूप से किसी की मृत्यु कराने को व्यक्त करता है। आधुनिक हिन्दी में ‘मार डाला’ सीधा और स्वाभाविक है।
- source_word: כִּי יָדַעְתִּי כִּי לֹא יִחְיֶה
  choice: क्योंकि मैं जानता था कि ... वह जीवित नहीं बचेगा
  rationale: वक्ता के बताए कारण और भविष्य-सापेक्ष कथन को स्पष्ट रखते हुए दोनों כִּי का स्वाभाविक हिन्दी वाक्य में प्रतिनिधित्व किया गया है।
- source_word: אַחֲרֵי נִפְלוֹ
  choice: गिर पड़ने के बाद
  rationale: नפל के क्रियार्थक संज्ञा-रूप का कालगत अर्थ सुरक्षित है; यह पहले घट चुकी गिरने की क्रिया को दर्शाता है।
- source_word: הַנֵּזֶר
  choice: मुकुट
  rationale: यहाँ נזר शाऊल के राजकीय शिरोभूषण को दर्शाता है। ‘मुकुट’ आधुनिक पाठक के लिए स्पष्ट और गरिमापूर्ण है।
- source_word: וְאֶצְעָדָה
  choice: बाजूबंद
  rationale: यह आभूषण बाँह पर पहना गया था; इसलिए हिन्दी ‘बाजूबंद’ कलाई के कंगन की अपेक्षा संदर्भ के अधिक अनुकूल है।
- source_word: זְרֹעוֹ
  choice: उसकी बाँह
  rationale: זרוע का सामान्य अर्थ ‘बाँह’ है; पद में इसे और संकीर्ण करके ‘अग्रबाहु’ कहने का आधार नहीं है।
- source_word: וָאֲבִיאֵם ... הֵנָּה
  choice: उन्हें यहाँ ... ले आया
  rationale: हिब्रू कथात्मक भूतकाल और वक्ता के वर्तमान स्थान की ओर संकेत—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶל אֲדֹנִי
  choice: अपने स्वामी के पास
  rationale: אדני यहाँ दाऊद के लिए मानवीय आदरसूचक संबोधन है, परमेश्वर का नाम या उपाधि नहीं। ‘स्वामी’ अधीनस्थ का सम्मानपूर्ण संबोधन बनाए रखता है।
theological_decisions:
- issue: शाऊल की मृत्यु के विषय में अमालेकी का दावा
  choice: 'अमालेकी के कथन को सीधे उसके अपने वृत्तांत के रूप में अनुवादित किया गया है: वह कहता है कि उसने शाऊल को मार डाला।'
  alternative: 1 शमूएल 31:4–5 के साथ सामंजस्य बैठाने के लिए मुख्य पाठ में इस कथन को डींग या झूठ के रूप में नरम करना।
  rationale: यह प्रत्यक्ष कथन है; अनुवाद को वही प्रस्तुत करना चाहिए जिसका वक्ता दावा करता है। पहले के वृत्तांत से उत्पन्न तनाव को मुख्य पाठ में चुपचाप हल नहीं किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मुकुट,’ ‘बाजूबंद’ और ‘स्वामी’ सामान्य पाठकों के लिए बोधगम्य हैं। मुख्य पाठ अमालेकी के दावे को बिना ऐतिहासिक या धर्मवैज्ञानिक सामंजस्य थोपे प्रस्तुत करता है।
