source:
  edition: WLC
  text: וַֽ/יִּסְפְּדוּ֙ וַ/יִּבְכּ֔וּ וַ/יָּצֻ֖מוּ עַד הָ/עָ֑רֶב עַל שָׁא֞וּל וְ/עַל יְהוֹנָתָ֣ן בְּנ֗/וֹ וְ/עַל עַ֤ם יְהוָה֙ וְ/עַל בֵּ֣ית יִשְׂרָאֵ֔ל כִּ֥י נָפְל֖וּ בֶּ/חָֽרֶב־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/012.yaml
  text: They mourned[a], wept, and fasted until evening for Saul, for Jonathan his son, for the people of Yahweh, and for the house of Israel[b], because they had fallen by the sword.
translation:
  language: hi
  text: उन्होंने शाऊल और उसके पुत्र योनातान, याहवे की प्रजा और इस्राएल के घराने के लिए विलाप किया, रोए और शाम तक उपवास किया, क्योंकि वे तलवार से मारे गए थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְפְּדוּ
  choice: विलाप किया
  rationale: ספד मृतकों के लिए औपचारिक शोक या विलाप को व्यक्त करता है; ‘विलाप किया’ अगले क्रियापद ‘रोए’ से अर्थगत भेद भी बनाए रखता है।
- source_word: וַיִּבְכּוּ
  choice: रोए
  rationale: בכה का सीधा और स्वाभाविक हिन्दी अर्थ ‘रोना’ है।
- source_word: וַיָּצֻמוּ
  choice: उपवास किया
  rationale: צום शोक या भक्ति के प्रसंग में भोजन से विरत रहने को दर्शाता है; ‘उपवास किया’ मानक हिन्दी अभिव्यक्ति है।
- source_word: עַד הָעָרֶב
  choice: शाम तक
  rationale: यह शोक और उपवास की समय-सीमा बताता है; ‘शाम तक’ सहज आधुनिक हिन्दी है।
- source_word: עַל
  choice: के लिए
  rationale: यहाँ बार-बार आया עַל उन व्यक्तियों और समुदायों को प्रस्तुत करता है जिनकी मृत्यु के कारण शोक किया गया।
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: उसके पुत्र योनातान
  rationale: इब्रानी क्रम योनातान को शाऊल के पुत्र के रूप में पहचानता है; हिन्दी में सर्वनाम को नाम से पहले रखना अधिक स्वाभाविक है।
- source_word: עַם יְהוָה
  choice: यहोवा की प्रजा
  rationale: निर्माण-सम्बन्ध को स्पष्ट रखते हुए यह covenant समुदाय के सामूहिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वरीय व्यक्तिगत नाम को हिन्दी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि किसी उपाधि से बदला गया है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: ‘घराना’ בֵּית के सामूहिक, वंशगत और राष्ट्रीय भाव को बनाए रखते हुए हिन्दी में बोधगम्य है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उनके शोक का कारण प्रस्तुत करता है।
- source_word: נָפְלוּ בֶּחָרֶב
  choice: तलवार से मारे गए थे
  rationale: यद्यपि נפל का शाब्दिक अर्थ ‘गिरना’ है, युद्ध के प्रसंग में यह मृत्यु का रूढ़ संकेत है; ‘मारे गए थे’ अर्थ स्पष्ट करता है और ‘तलवार’ की मूल छवि बचाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित न करके हिन्दी में परिचित नामरूप ‘यहोवा’ रखा गया है; ‘याहवे’ सम्भव वैकल्पिक लिप्यंतरण है।
- issue: עַם יְהוָה और בֵּית יִשְׂרָאֵל का सम्बन्ध
  choice: यहोवा की प्रजा और इस्राएल का घराना—दोनों पद बनाए रखे
  alternative: दोनों को एक ही समुदाय के समानार्थी वर्णन मानकर एक पद में समेटना
  rationale: मूल पाठ दोनों अभिव्यक्तियों को וְעַל के साथ अलग-अलग रखता है। सम्भव अर्थगत अतिव्यापन के बावजूद अनुवाद उस दोहराव और तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। मूल की क्रमिक क्रियाएँ और शोक के चारों विषय सुरक्षित हैं; अनावश्यक व्याख्यात्मक विस्तार नहीं जोड़ा गया।
