base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/014.yaml
  text: And David was dancing with all his might before Yahweh[b][a], and David was wearing a linen ephod.
translation:
  language: hi
  text: दाऊद अपनी पूरी शक्ति से याहवे के सामने नाच रहा था[a], और दाऊद सन का एपोद पहने हुए था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घूम रहा था” या “उछल-कूद कर रहा था”; इब्रानी शब्द उत्सव में की गई जोरदार शारीरिक गति का चित्र देता है।
    reason: lexical_alternative
  - marker: b
    text: एपोद याजकीय या उपासना-संबंधी एक विशिष्ट वस्त्र था; यहाँ दाऊद ने सन का एपोद पहन रखा था।
    reason: cultural_note
lexical_decisions:
- source_word: מְכַרְכֵּר
  choice: नाच रहा था
  rationale: यह कृदंत उत्सव में हो रही जोरदार शारीरिक गति को दर्शाता है। ‘नाच रहा था’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है; घूमने या उछलने का भाव सम्भव है, पर मूल क्रिया किसी एक विशिष्ट गति को अनिवार्य नहीं करती।
- source_word: בְּכָל עֹז
  choice: अपनी पूरी शक्ति से
  rationale: यह पदबंध सम्पूर्ण सामर्थ्य और तीव्र प्रयास व्यक्त करता है। यह हिन्दी प्रयोग मूल के बल को सहज रूप में बनाए रखता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहवे के सामने
  rationale: לִפְנֵי का अर्थ ‘के सामने/की उपस्थिति में’ है। ‘के सामने’ संक्षिप्त और स्वाभाविक है, जबकि יְהוָה को व्यक्तिगत नाम ‘यहवे’ के रूप में रखा गया है।
- source_word: חָגוּר
  choice: पहने हुए था
  rationale: यह रूप किसी वस्त्र को कमर से बाँधे या धारण किए होने की दशा बताता है। ‘पहने हुए था’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: אֵפוֹד
  choice: एपोद
  rationale: यह इस्राएली उपासना से जुड़ा एक विशिष्ट वस्त्र है जिसका हिन्दी में सटीक सामान्य पर्याय नहीं है; इसलिए तकनीकी शब्द का लिप्यंतरण किया गया है।
- source_word: בָּד
  choice: सन का
  rationale: यहाँ शब्द वस्त्र की लिनन सामग्री को सूचित करता है। हिन्दी बाइबिलीय प्रयोग में ‘सन का’ संक्षिप्त और परिचित है तथा मूल से अधिक गुणवत्ता नहीं जोड़ता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे आया है। ‘यहवे’ उसका आधुनिक हिन्दी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी वाक्य की पुनरुक्ति ‘और दाऊद’ को बनाए रखा गया है। दोनों पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
