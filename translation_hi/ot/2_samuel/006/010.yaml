  yaml_path: translation/ot/2_samuel/006/010.yaml
  text: So David was not willing to bring the ark of Yahweh to himself into the City of David[b][a], but David turned it aside to the house of Obed-edom the Gittite.
translation:
  language: hi
  text: दाऊद यहोवा के संदूक को अपने पास दाऊद के नगर[क] में ले जाने को तैयार नहीं था; इसलिए उसने उसे गातवासी[ख] ओबेद-एदोम के घर की ओर मोड़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, ‘दाऊद के नगर तक/ऊपर।’ हिब्रू पूर्वसर्ग गंतव्य की ओर अथवा ऊपर की ओर गति का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: ख
    text: अर्थात्, गात का निवासी; या, ‘गित्ती।’
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: तैयार नहीं हुआ
  rationale: यह इच्छा अथवा सहमति न होने का भाव रखता है, बिना ‘इनकार किया’ जैसी अधिक प्रबल विरोधात्मक ध्वनि जोड़े।
- source_word: לְהָסִיר אֵלָיו
  choice: अपने पास ... ले जाने
  rationale: הֵסִיר का मूल भाव हटाने या दूसरी ओर करने का है, पर इस प्रसंग में संदूक को दाऊद के अपने स्थान तक स्थानांतरित करना अभिप्रेत है; यह हिन्दी में स्वाभाविक रूप से उस दिशा को व्यक्त करता है।
- source_word: אֲרוֹן יְהוָה
  choice: यहोवा का संदूक
  rationale: सम्बन्धवाचक हिब्रू रचना को सहज हिन्दी में रखा गया है और व्यक्तिगत दिव्य नाम को लिप्यंतरित किया गया है।
- source_word: עַל עִיר דָוִד
  choice: दाऊदपुर में
  rationale: עַל यहाँ गंतव्य की ओर गति दर्शा सकता है। ‘में’ नगर के भीतर ले जाने का प्रसंगानुकूल, स्वाभाविक हिन्दी रूप है।
- source_word: וַיַּטֵּהוּ
  choice: उसे मोड़कर ... पहुँचा दिया
  rationale: נטה का दिशा बदलने का ठोस भाव सुरक्षित है; ‘पहुँचा दिया’ लक्ष्य-स्थान पर रखे जाने को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: ओबेद-एदोम के घर
  rationale: यहाँ בֵּית का तत्काल आशय वह निवास है जहाँ संदूक रखा गया।
- source_word: הַגִּתִּי
  choice: गित्ती
  rationale: हिब्रू जातिवाचक/स्थानवाचक विशेषण का पारंपरिक संक्षिप्त रूप सुरक्षित रखा गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम प्रत्यक्ष है। आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ से इसे उपाधि ‘प्रभु’ में बदले बिना नाम के रूप में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी। ‘दाऊदपुर’ हिन्दी बाइबलीय परंपरा में ‘दाऊद का नगर’ का संक्षिप्त स्थाननाम है। मूल के עַל में ऊपर की ओर जाने की संभावित छाया है, किंतु इस वाक्य में मुख्य अर्थ गंतव्य है; इसलिए मुख्य पाठ में अप्राकृतिक ‘ऊपर’ नहीं जोड़ा गया।
