reference: 2 Samuel 6:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּבִ֜אוּ אֶת אֲר֣וֹן יְהוָ֗ה וַ/יַּצִּ֤גוּ אֹת/וֹ֙ בִּ/מְקוֹמ֔/וֹ בְּ/ת֣וֹךְ הָ/אֹ֔הֶל אֲשֶׁ֥ר נָטָה ל֖/וֹ דָּוִ֑ד וַ/יַּ֨עַל דָּוִ֥ד עֹל֛וֹת לִ/פְנֵ֥י יְהוָ֖ה וּ/שְׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/017.yaml
  text: They brought in the ark of Yahweh and set it in its place[a], inside the tent that David had pitched for it. And David offered burnt offerings and peace offerings before Yahweh.
translation:
  language: hi
  text: वे याहवे का संदूक भीतर लाए और उसे उसके स्थान पर, उस तंबू के अंदर रख दिया जिसे दाऊद ने उसके लिए खड़ा किया था। फिर दाऊद ने याहवे के सामने होमबलियाँ और मेलबलियाँ[a] चढ़ाईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शांति-बलियाँ”; इसे “संगति-बलियाँ” अथवा “कल्याण-बलियाँ” भी समझा जा सकता है।
    reason: इब्रानी שְׁלָמִים के अर्थ-क्षेत्र में शांति, सहभागिता और कुशल-कल्याण के परस्पर जुड़े भाव हैं; कोई एक हिंदी पद उन सभी को पूरी तरह व्यक्त नहीं करता।
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: याहवे का संदूक
  rationale: אֲרוֹן का मूल अर्थ ‘संदूक’ है; पद में ‘वाचा’ शब्द नहीं है, इसलिए उसे जोड़ा नहीं गया। יְהוָה को व्यक्तिगत नाम के रूप में ‘याहवे’ लिखा गया है।
- source_word: וַיָּבִאוּ
  choice: वे ... भीतर लाए
  rationale: בוא के हिफ़ील रूप में किसी वस्तु को भीतर या निर्धारित स्थान तक लाने का भाव है।
- source_word: וַיַּצִּגוּ אֹתוֹ בִּמְקוֹמוֹ
  choice: उसे उसके स्थान पर ... रख दिया
  rationale: יצג यहाँ किसी वस्तु को उसके नियत स्थान पर स्थापित करने का अर्थ देता है; यह हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: בְּתוֹךְ הָאֹהֶל אֲשֶׁר נָטָה לוֹ דָּוִד
  choice: उस तंबू के अंदर ... जिसे दाऊद ने उसके लिए खड़ा किया था
  rationale: בְּתוֹךְ आंतरिक स्थान सूचित करता है और נטה तंबू के संदर्भ में उसे तानने या खड़ा करने का अर्थ देता है। לוֹ संदर्भानुसार संदूक की ओर संकेत करता है।
- source_word: וַיַּעַל דָּוִד עֹלוֹת
  choice: दाऊद ने ... होमबलियाँ ... चढ़ाईं
  rationale: बलिदान-संदर्भ में עלה का अर्थ अर्पित या चढ़ाना है; עֹלוֹת पूर्णतः जलाई जाने वाली बलियों के लिए प्रचलित पद ‘होमबलियाँ’ है।
- source_word: וּשְׁלָמִים
  choice: और मेलबलियाँ
  rationale: שְׁלָמִים ऐसी बलियों का नाम है जिनमें शांति, कुशलता और सहभागी संगति के अर्थ जुड़े हैं। ‘मेलबलियाँ’ संक्षिप्त और हिंदी बाइबिलीय प्रयोग में समझने योग्य है; अन्य संभावित अर्थ पाद-टिप्पणी में दिए गए हैं।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का सीधा अर्थ ‘के सामने/की उपस्थिति में’ है; ‘के सामने’ मूल अभिव्यक्ति को स्वाभाविक हिंदी में बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार-अक्षरी व्यक्तिगत नाम יְהוָה है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत आधुनिक लिप्यंतरण है और नाम को उपाधि से प्रतिस्थापित नहीं करता।
- issue: שְׁלָמִים में निहित बलिदानी अर्थ
  choice: मेलबलियाँ
  alternative: शांति-बलियाँ; संगति-बलियाँ; कल्याण-बलियाँ
  rationale: इब्रानी पद के अर्थ-क्षेत्र में शांति, कल्याण और सहभागी भोज/संगति सभी शामिल हो सकते हैं। मुख्य पाठ में परिचित संक्षिप्त रूप रखा गया और अन्य अर्थों को पाद-टिप्पणी में देकर अस्पष्टता सुरक्षित रखी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘संदूक’, ‘तंबू’, ‘होमबलियाँ’ और ‘मेलबलियाँ’ जैसे संक्षिप्त बाइबिलीय शब्दों का उपयोग किया गया है। मूल में अनुपस्थित ‘वाचा’ नहीं जोड़ा गया।
