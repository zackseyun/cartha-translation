    text: “पेरेस-उज्जा” नाम इब्रानी में “उज्जा पर टूट पड़ना” या “उज्जा पर प्रकोप” जैसा अर्थ देता है। यह उसी वाक्य में ‘टूट पड़ा’ के लिए प्रयुक्त इब्रानी शब्द के साथ शब्द-क्रीड़ा करता है।
