  text: और दाऊद क्रोधित हुआ, क्योंकि यहोवा उज्जा पर टूट पड़ा था; और उसने उस स्थान का नाम पेरेस-उज्जा[a] रखा। वह आज तक इसी नाम से जाना जाता है।
  philosophy: optimal-equivalence
  footnotes:
