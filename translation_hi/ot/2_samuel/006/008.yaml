lexical_decisions:
- source_word: וַיִּחַר לְדָוִד
  choice: दाऊद क्रोधित हुआ
  rationale: यह इब्रानी मुहावरा दाऊद के क्रोध को व्यक्त करता है। ‘क्रोधित हुआ’ आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: פָּרַץ יְהוָה פֶּרֶץ בְּעֻזָּה
  choice: यहोवा ने उज्जा पर प्रहार किया था
  rationale: मूल में क्रिया और उसी धातु से बने संज्ञा-पद द्वारा अचानक और विनाशकारी प्रहार पर बल दिया गया है। हिन्दी में सजातीय शब्द-क्रीड़ा को अक्षरशः रखना अस्वाभाविक होता; ‘प्रहार किया’ घटना की सीधी ईश्वरीय कार्रवाई और कठोरता को बनाए रखता है, जबकि शब्द-क्रीड़ा पादटिप्पणी में स्पष्ट की गई है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित बाइबलीय रूप ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: उसने उस स्थान का नाम ... रखा
  rationale: नामकरण के इब्रानी सूत्र का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: פֶּרֶץ עֻזָּה
  choice: पेरेस-उज्जा
  rationale: स्थान-नाम को लिप्यंतरित किया गया है; उसमें निहित פרץ की शब्द-क्रीड़ा पादटिप्पणी में समझाई गई है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: उसका यही नाम आज तक है
  rationale: इब्रानी काल-सूत्र का प्रसंगानुकूल, स्पष्ट हिन्दी रूप, जो स्थान के नाम के बने रहने को व्यक्त करता है।
theological_decisions:
- issue: उज्जा की मृत्यु के प्रसंग में ईश्वरीय कार्रवाई की प्रत्यक्षता
  choice: यहोवा ने उज्जा पर प्रहार किया था
  alternative: उज्जा के साथ यह दुर्घटना हुई थी
