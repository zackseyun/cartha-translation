- issue: दाऊद के क्रोध का लक्ष्य
  choice: दाऊद क्रोधित हुआ, क्योंकि यहोवा ने उज्जा पर प्रहार किया था
  alternative: दाऊद यहोवा पर क्रोधित हुआ
  rationale: לְדָוִד दाऊद की भावावस्था को स्पष्ट करता है, पर पद क्रोध का लक्ष्य अलग से व्याकरणिक रूप में नहीं बताता। इसलिए हिन्दी में यह नहीं जोड़ा गया कि दाऊद सीधे यहोवा पर क्रोधित था; मूल की संभावित तनावपूर्ण अस्पष्टता बनी रहती है।
