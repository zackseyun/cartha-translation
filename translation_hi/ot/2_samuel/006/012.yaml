source:
  edition: WLC
  text: וַ/יֻּגַּ֗ד לַ/מֶּ֣לֶךְ דָּוִד֮ לֵ/אמֹר֒ בֵּרַ֣ךְ יְהוָ֗ה אֶת בֵּ֨ית עֹבֵ֤ד אֱדֹם֙ וְ/אֶת כָּל אֲשֶׁר ל֔/וֹ בַּ/עֲב֖וּר אֲר֣וֹן הָ/אֱלֹהִ֑ים וַ/יֵּ֣לֶךְ דָּוִ֗ד וַ/יַּעַל֩ אֶת אֲר֨וֹן הָ/אֱלֹהִ֜ים מִ/בֵּ֨ית עֹבֵ֥ד אֱדֹ֛ם עִ֥יר דָּוִ֖ד בְּ/שִׂמְחָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/012.yaml
  text: And it was reported to King David[a], saying, “Yahweh has blessed the house of Obed-edom and all that belongs to him because of the ark of God.” So David went and brought up the ark of God from the house of Obed-edom to the city of David with rejoicing.
translation:
  language: hi
  text: 'राजा दाऊद को यह समाचार दिया गया: “याहवे ने परमेश्वर के सन्दूक के कारण ओबेद-एदोम के घराने को और जो कुछ उसका था, आशीष दी है।” तब दाऊद गया और परमेश्वर के सन्दूक को ओबेद-एदोम के घर से आनन्द के साथ दाऊद के नगर में ले आया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: यह समाचार दिया गया
  rationale: होफ़ाल का अज्ञात कर्ता वाला निष्क्रिय भाव सुरक्षित रहता है और हिन्दी में स्वाभाविक समाचार-सूचना व्यक्त होती है।
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: ओबेद-एदोम का घराना
  rationale: पहले प्रयोग में בֵּית का आशय केवल भवन नहीं, उसके परिवार और गृहस्थी से भी है; इसलिए ‘घराना’ प्रसंगानुकूल है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम YHWH का लिप्यंतरण किया गया है, किसी उपाधि से प्रतिस्थापित नहीं।
- source_word: וְאֶת כָּל אֲשֶׁר לוֹ
  choice: और उसकी सारी सम्पत्ति
  rationale: शाब्दिक अर्थ ‘जो कुछ उसका है’ है; ‘सारी सम्पत्ति’ आधुनिक हिन्दी में उसके अधिकार की सभी वस्तुओं को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: בַּעֲבוּר אֲרוֹן הָאֱלֹהִים
  choice: परमेश्वर के सन्दूक के कारण
  rationale: בַּעֲבוּר यहाँ कारण बताता है और आशीष को सन्दूक की उपस्थिति से जोड़ता है।
- source_word: וַיַּעַל
  choice: ले आया
  rationale: हिफ़ील रूप सन्दूक को ऊपर की ओर, यरूशलेम स्थित दाऊदपुर तक ले जाने को बताता है; लक्ष्य स्पष्ट होने के कारण हिन्दी में ‘ले आया’ स्वाभाविक है।
- source_word: עִיר דָּוִד
  choice: दाऊदपुर
  rationale: यह दाऊद के नगर के लिए प्रचलित संक्षिप्त हिन्दी स्थान-संज्ञा है और गन्तव्य को स्पष्ट रखती है।
- source_word: בְּשִׂמְחָה
  choice: आनन्द मनाते हुए
  rationale: ‘आनन्द के साथ’ की अपेक्षा यह रूप जुलूस के उल्लासपूर्ण ढंग को अधिक स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में वाचा का व्यक्तिगत नाम सीधे प्रयुक्त है। लिप्यंतरण मूल भेद को बनाए रखता है और नाम को उपाधि में नहीं बदलता।
- issue: सन्दूक के कारण आशीष
  choice: कारणात्मक सम्बन्ध को स्पष्ट रखा गया
  alternative: सन्दूक के निमित्त
  rationale: בַּעֲבוּר का सामान्य कारणात्मक अर्थ है; पाठ जैसा सम्बन्ध बताता है वैसा ही रखा गया है, बिना यह विस्तार किए कि सन्दूक ने स्वयं आशीष दी।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘सन्दूक’ धार्मिक वस्तु के स्थापित नाम के रूप में रखा गया है; ‘दाऊदपुर’ से עיר דוד का संक्षिप्त और स्वाभाविक स्थाननाम प्रस्तुत होता है।
