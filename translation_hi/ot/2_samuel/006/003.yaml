  text: They set the ark of God on a new cart and brought it from the house of Abinadab[a], which was on the hill; and Uzzah and Ahio, the sons of Abinadab, were driving the new cart.
translation:
  language: hi
  text: उन्होंने परमेश्वर के सन्दूक को एक नई गाड़ी पर रखकर अबीनादाब के उस घर से, जो पहाड़ी पर था,[a] ले चले; और अबीनादाब के पुत्र उज्जा और अहयो उस नई गाड़ी को हाँक रहे थे।
  philosophy: optimal-equivalence
  footnotes:
