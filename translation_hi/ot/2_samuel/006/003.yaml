- source_word: מִבֵּית אֲבִינָדָב
  choice: अबीनादाब के घर से
  rationale: सम्बन्धवाचक इब्रानी रचना का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: जो पहाड़ी पर था
  rationale: संज्ञा पर निश्चित उपपद होने के कारण मुख्य पाठ में स्थलाकृतिक अर्थ रखा गया है; स्थान-नाम की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: וְעֻזָּא וְאַחְיוֹ
  choice: उज्जा और अहयो
  rationale: व्यक्तिवाचक नामों का देवनागरी लिप्यन्तरण किया गया है।
- source_word: בְּנֵי אֲבִינָדָב
  choice: अबीनादाब के पुत्र
  rationale: इस कथात्मक प्रसंग में בְּנֵי का सबसे स्वाभाविक अर्थ वास्तविक पुत्र है।
- source_word: נֹהֲגִים
  choice: हाँक रहे थे
  rationale: נהג पशुओं अथवा वाहन को हाँकने या चलाने को दर्शाता है; प्राचीन गाड़ी के लिए 'हाँकना' आधुनिक हिन्दी में सटीक है।
