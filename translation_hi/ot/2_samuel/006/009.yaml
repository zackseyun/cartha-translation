id: 2SA.6.9
reference: 2 Samuel 6:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּרָ֥א דָוִ֛ד אֶת יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֹּ֕אמֶר אֵ֛יךְ יָב֥וֹא אֵלַ֖/י אֲר֥וֹן יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/009.yaml
  text: And David feared Yahweh that day[a], and he said, “How can the ark of Yahweh come to me?”
translation:
  language: hi
  text: उस दिन दाऊद याहवे से डर गया। उसने कहा, “याहवे का संदूक मेरे पास कैसे आएगा?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “कैसे आएगा?” का आशय यह भी हो सकता है, “कैसे आ सकता है?” उज्जा की मृत्यु के बाद यह प्रश्न व्यावहारिक अनिश्चितता, भय, या अपने को अयोग्य समझने की भावना व्यक्त कर सकता है।
    reason: मूल प्रश्न की संभाव्य और भावी छायाओं तथा उसके प्रसंगगत भाव को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּרָא
  choice: डर गया
  rationale: काल क्रिया ירא और याहवे को प्रत्यक्ष कर्म के रूप में रखती है। उज्जा की मृत्यु के तत्काल संदर्भ में यह वास्तविक भय को व्यक्त करती है; केवल ‘श्रद्धा की’ कहना प्रसंग की तीव्रता घटा देता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम יהוה का लिप्यंतरण किया गया है, किसी उपाधि से प्रतिस्थापित नहीं।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह इब्रानी कालवाचक पद का स्वाभाविक और सटीक आधुनिक हिन्दी रूप है।
- source_word: אֵיךְ יָבֹא
  choice: कैसे आएगा
  rationale: यह प्रश्न की भावी और संभाव्य दोनों छायाओं को हिन्दी में स्वाभाविक ढंग से बनाए रखता है; ‘कैसे आ सकता है’ संभावना को अधिक स्पष्ट करके मूल की अस्पष्टता कुछ घटा देता।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: अक्षरशः ‘मेरी ओर/मेरे पास’; ‘मेरे घर’ या ‘मेरे नगर’ कहना मूल से अधिक विशिष्ट होता।
- source_word: אֲרוֹן יְהוָה
  choice: याहवे का संदूक
  rationale: सम्बन्धसूचक इब्रानी पदबंध का सीधा और प्रचलित बाइबलीय हिन्दी रूप; ‘संदूक’ पवित्र वाचा-संदूक के लिए स्पष्ट है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है और स्रोत-रूप के निकट है।
- issue: दाऊद के प्रश्न का आशय
  choice: प्रश्न को ‘कैसे आएगा?’ के रूप में खुला रखा
  alternative: ‘मेरे पास कैसे आ सकता है?’
  rationale: संदर्भ में यह व्यावहारिक अनिश्चितता, भय, अथवा अपने को अयोग्य समझने की भावना व्यक्त कर सकता है। मूल इन संभावनाओं में से किसी एक को स्पष्ट रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। छोटे वाक्य कथात्मक तनाव बनाए रखते हैं। दिव्य नाम का रूप ‘याहवे’ पूरे पद में एकसमान है।
