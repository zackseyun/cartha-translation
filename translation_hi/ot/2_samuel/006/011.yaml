id: 2SA.6.11
reference: 2 Samuel 6:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֵּשֶׁב֩ אֲר֨וֹן יְהוָ֜ה בֵּ֣ית עֹבֵ֥ד אֱדֹ֛ם הַ/גִּתִּ֖י שְׁלֹשָׁ֣ה חֳדָשִׁ֑ים וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת עֹבֵ֥ד אֱדֹ֖ם וְ/אֶת כָּל בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/011.yaml
  text: And the ark of Yahweh remained in the house of Obed-edom the Gittite for three months[b][a], and Yahweh blessed Obed-edom and all his household.
translation:
  language: hi
  text: याहवे का संदूक ओबेद-एदोम गित्ती[a] के घर में तीन महीने तक रहा। और याहवे ने ओबेद-एदोम और उसके पूरे घराने[b] को आशीष दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात गात नगर से संबंधित व्यक्ति।
    reason: cultural_note
  - marker: b
    text: शाब्दिक रूप से ‘उसका पूरा घर’; इब्रानी अभिव्यक्ति उसके परिवार या समूची घरेलू व्यवस्था को भी सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: रहा
  rationale: यहाँ संदूक कर्ता है और अवधि भी दी गई है; इसलिए ‘रहा’ निरंतर उपस्थिति का स्वाभाविक हिन्दी भाव देता है, बिना क्रिया को अत्यधिक शाब्दिक ‘बैठा’ बनाने के।
- source_word: אֲרוֹן יְהוָה
  choice: याहवे का संदूक
  rationale: सम्बन्धवाचक रचना को सीधे और स्वाभाविक हिन्दी में रखा गया है; אֲרוֹן के लिए स्थापित शब्द ‘संदूक’ है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: ओबेद-एदोम गित्ती के घर में
  rationale: इस पहले प्रयोग में בֵּית भौतिक निवास-स्थान बताता है, जहाँ संदूक रखा रहा।
- source_word: עֹבֵד אֱדֹם
  choice: ओबेद-एदोम
  rationale: व्यक्तिनाम का मानक देवनागरी लिप्यंतरण किया गया है।
- source_word: הַגִּתִּי
  choice: गित्ती
  rationale: जातिवाचक/स्थान-संबंधी विशेषण को संक्षिप्त रूप में सुरक्षित रखा गया है; उसका गात से संबंध पादटिप्पणी में स्पष्ट किया गया है।
- source_word: שְׁלֹשָׁה חֳדָשִׁים
  choice: तीन महीने तक
  rationale: ‘तक’ हिन्दी में अवधि के साथ स्वाभाविक है और मूल के अर्थ में कुछ नहीं जोड़ता।
- source_word: וַיְבָרֶךְ
  choice: आशीष दी
  rationale: ברך का प्रचलित और अर्थ-संगत हिन्दी अनुवाद है।
- source_word: וְאֶת כָּל בֵּיתוֹ
  choice: और उसके पूरे घराने को
  rationale: यहाँ בֵּיתוֹ केवल भवन नहीं, बल्कि परिवार और घरेलू समुदाय को व्यापक रूप से सूचित कर सकता है; ‘घराना’ उस सामाजिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है; ‘यहोवा’ पारंपरिक वैकल्पिक लिप्यंतरण है।
- issue: כָּל בֵּיתוֹ का आशय
  choice: उसका पूरा घराना
  alternative: उसका पूरा घर
  rationale: इब्रानी ‘घर’ परिवार, सेवकों और घरेलू व्यवस्था सहित व्यापक समूह को सूचित कर सकता है। ‘घराना’ इस संभावना को व्यक्त करता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दोनों मूल वाक्यांशों को हिन्दी में दो वाक्यों के रूप में प्रस्तुत किया गया है। ‘गित्ती’ और ‘घराना’ से जुड़ी सांस्कृतिक तथा अर्थगत जानकारी पादटिप्पणियों में दी गई है, और उनके चिह्न मुख्य पाठ में सही स्थानों पर हैं।
