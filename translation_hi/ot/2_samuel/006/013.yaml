base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/013.yaml
  text: And when those carrying the ark of Yahweh had gone six steps[b][a], he sacrificed an ox and a fattened calf.
translation:
  language: hi
  text: जब याहवे के संदूक को ले जानेवाले छह कदम[a] चल चुके, तब उसने एक बैल और एक मोटा किया हुआ पशु[b] बलि चढ़ाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘छह डग’।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘एक मोटा किया हुआ पशु’; परंपरागत रूप से यहाँ इसे मोटा किया हुआ बछड़ा समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: याहवे का संदूक
  rationale: אֲרוֹן को उसके स्थापित पवित्र-संदूक संबंधी अर्थ में ‘संदूक’ और परमेश्वर के व्यक्तिगत नाम יְהוָה को ‘याहवे’ के रूप में रखा गया है।
- source_word: וַיְהִי כִּי
  choice: जब
  rationale: यह इब्रानी कथात्मक रचना समय-संबंधी परिस्थिति प्रस्तुत करती है; आधुनिक हिन्दी में ‘जब’ स्वाभाविक है।
- source_word: צָעֲדוּ
  choice: चल चुके
  rationale: क्रिया कदम बढ़ाकर आगे जाने का बोध देती है; ‘छह कदम’ के साथ ‘चल चुके’ उस पूर्ण हुई गति को सहज रूप से व्यक्त करता है।
- source_word: נֹשְׂאֵי
  choice: उठानेवाले
  rationale: यह कृदंत संदूक को उठाकर ले जा रहे लोगों की पहचान कराता है; ‘उठानेवाले’ संक्षिप्त और सुबोध है।
- source_word: שִׁשָּׁה צְעָדִים
  choice: छह कदम
  rationale: यह संख्या और कदमों की सीधी अभिव्यक्ति है; ‘छह डग’ भी संभव है।
- source_word: וַיִּזְבַּח
  choice: उसने … बलि चढ़ाया
  rationale: एकवचन क्रिया का संदर्भ प्रसंगानुसार दाऊद है, पर मूल की तरह नाम दोहराए बिना सर्वनाम रखा गया है।
- source_word: שׁוֹר
  choice: एक बैल
  rationale: शब्द गोवंश के पशु, विशेषतः बैल, को सूचित कर सकता है; यहाँ ‘बैल’ स्पष्ट और प्रचलित है।
- source_word: מְרִיא
  choice: एक मोटा किया हुआ पशु
  rationale: इब्रानी शब्द किसी मोटे किए हुए पशु को दर्शाता है और उसकी जाति निश्चित नहीं करता; इसलिए ‘बछड़ा’ जोड़ने के बजाय व्यापक अर्थ सुरक्षित रखा गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: बलि चढ़ानेवाले एकवचन कर्ता की पहचान
  choice: उसने
  alternative: दाऊद ने
  rationale: प्रसंग में कर्ता स्वाभाविक रूप से दाऊद है, किंतु इस पद के इब्रानी पाठ में उसका नाम नहीं दोहराया गया; सर्वनाम मूल की अभिव्यक्ति और प्रसंगगत पहचान दोनों बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उठानेवाले’ और ‘बलि चढ़ाया’ प्रचलित धार्मिक शब्दावली हैं। मूल की अस्पष्टता बनाए रखने के लिए מְרִיא को मुख्य पाठ में ‘पशु’ कहा गया है, ‘बछड़ा’ नहीं।
