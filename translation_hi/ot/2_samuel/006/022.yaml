  text: וּ/נְקַלֹּ֤תִי עוֹד֙ מִ/זֹּ֔את וְ/הָיִ֥יתִי שָׁפָ֖ל בְּ/עֵינָ֑/י וְ/עִם הָֽ/אֲמָהוֹת֙ אֲשֶׁ֣ר אָמַ֔רְתְּ עִמָּ֖/ם אִכָּבֵֽדָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/022.yaml
  text: And I will make myself even more contemptible than this[a], and I will be lowly in my own eyes; but with the servant girls of whom you have spoken, with them I will be honored.
translation:
  language: hi
  text: मैं इससे भी अधिक तुच्छ हो जाऊँगा और अपनी ही दृष्टि में नीचा होऊँगा; पर जिन दासियों[a] की तूने बात की, उन्हीं के साथ मेरा सम्मान होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेविकाओं।” इब्रानी शब्द निम्न घरेलू-सामाजिक स्थिति वाली स्त्रियों के लिए प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְקַלֹּתִי
  choice: मैं ... तुच्छ हो जाऊँगा
  rationale: קלל के निफ़अल रूप में हल्का, तुच्छ या कम आदर योग्य समझे जाने का भाव है। यह अनुवाद दाऊद के स्वेच्छा से और अधिक दीन होने के आशय को व्यक्त करता है, पर इब्रानी क्रिया को प्रत्यक्ष कारणवाचक नहीं बनाता।
- source_word: עוֹד מִזֹּאת
  choice: इससे भी अधिक
  rationale: עוֹד तीव्रता बढ़ाता है और מִזֹּאת मीकल के पिछले आरोप से तुलना करता है; इसलिए यह स्वाभाविक हिंदी में तुलनात्मक बल बनाए रखता है।
- source_word: וְהָיִיתִי שָׁפָל בְּעֵינָי
  choice: और अपनी ही दृष्टि में नीचा होऊँगा
  rationale: שָׁפָל का अर्थ नीचा या दीन है। ‘अपनी ही दृष्टि में’ मूल मुहावरे और आत्म-मूल्यांकन के भाव को सुरक्षित रखता है; ‘नीचा’ सामाजिक मान-अपमान के संदर्भ को ‘विनम्र’ से अधिक स्पष्ट रखता है।
- source_word: הָאֲמָהוֹת
  choice: दासियों
  rationale: אָמָהוֹת निम्न घरेलू-सामाजिक स्थिति वाली स्त्री दासियों या सेविकाओं को सूचित करता है। ‘दासियों’ उस स्थिति-भेद को आधुनिक हिंदी में संक्षेप और स्पष्ट रूप से बनाए रखता है।
- source_word: אֲשֶׁר אָמַרְתְּ
  choice: जिन ... की तूने बात की
  rationale: यह स्त्रीलिंग एकवचन संबोधन के साथ पिछले पद में मीकल द्वारा कही गई बात की ओर सीधा संकेत करता है।
- source_word: עִמָּם
  choice: उन्हीं के बीच
  rationale: עם का मूल भाव ‘साथ’ है, पर यहाँ वह उस सामाजिक समूह या क्षेत्र को बताता है जिसमें दाऊद को सम्मान मिलेगा। हिंदी में ‘उनके बीच’ इस अर्थ को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אִכָּבֵדָה
  choice: मेरा सम्मान होगा
  rationale: כבד के निफ़अल रूप का भाव सम्मानित होने का है। यह पद के आरंभ में ‘तुच्छ’ और ‘नीचा’ के साथ मान-अपमान का विरोध स्पष्ट रखता है और ‘महिमावान’ जैसे अतिरिक्त धार्मिक अर्थ से बचता है।
theological_decisions:
- issue: אָמָהוֹת के लिए सामाजिक-स्थिति संबंधी शब्दावली
  choice: मुख्य पाठ में ‘दासियों’
  alternative: ‘सेविकाओं’ या ‘दासी लड़कियों’
  rationale: यहाँ दाऊद के राजकीय दर्जे और मीकल द्वारा बताई गई निम्न सामाजिक स्थिति की स्त्रियों के बीच स्पष्ट विरोध है। ‘दासियों’ उस ऐतिहासिक स्थिति को नरम किए बिना व्यक्त करता है; पादटिप्पणी अधिक सामान्य विकल्प बताती है।
- issue: अंतिम वाक्य में सम्मान का कर्ता या सामाजिक क्षेत्र
  choice: ‘उन्हीं के बीच मेरा सम्मान होगा’
  alternative: ‘उन्हीं के द्वारा मेरा सम्मान होगा’
  rationale: इब्रानी עִמָּם का सामान्य अर्थ ‘उनके साथ’ है, न कि स्पष्ट रूप से ‘उनके द्वारा’। इसलिए अनुवाद जानबूझकर यह निश्चित नहीं करता कि वे स्त्रियाँ सम्मान देने वाली हैं या उनके बीच दाऊद सम्मान पाएगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिंदी। मीकल के लिए स्त्रीलिंग एकवचन ‘तूने’ मूल के प्रत्यक्ष और तीखे संबोधन को बनाए रखता है। मान-अपमान की शब्दावली पूरे पद में एकरूप रखी गई है।
