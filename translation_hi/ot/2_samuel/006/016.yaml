reference: 2 Samuel 6:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָה֙ אֲר֣וֹן יְהוָ֔ה בָּ֖א עִ֣יר דָּוִ֑ד וּ/מִיכַ֨ל בַּת שָׁא֜וּל נִשְׁקְפָ֣ה בְּעַ֣ד הַ/חַלּ֗וֹן וַ/תֵּ֨רֶא אֶת הַ/מֶּ֤לֶךְ דָּוִד֙ מְפַזֵּ֤ז וּ/מְכַרְכֵּר֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/תִּ֥בֶז ל֖/וֹ בְּ/לִבָּֽ/הּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/016.yaml
  text: As the ark of Yahweh was coming into the city of David[a], Michal daughter of Saul looked out through the window and saw King David leaping and whirling before Yahweh, and she despised him in her heart.
translation:
  language: hi
  text: जब यहोवा का संदूक दाऊद के नगर में आ रहा था, तब शाऊल की बेटी मीकल ने खिड़की से बाहर देखा और राजा दाऊद को यहोवा के सामने उछलते और घूमते देखा; और उसने मन-ही-मन उसे तुच्छ समझा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה ... בָּא
  choice: जब ... आ रहा था
  rationale: आरंभिक कथात्मक संरचना और कृदंत जारी परिस्थिति को व्यक्त करते हैं; हिंदी में ‘जब ... आ रहा था’ स्वाभाविक रूप से उसी समय चल रही पृष्ठभूमि देता है।
- source_word: אֲרוֹן יְהוָה
  choice: यहोवा का संदूक
  rationale: रचना-संबंध को सीधे रखा गया है और יהוה को उसके व्यक्तिवाचक वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: עִיר דָּוִד
  choice: दाऊदपुर
  rationale: यह स्थापित स्थानवाचक पद है; ‘दाऊदपुर’ संक्षिप्त, स्वाभाविक हिंदी रूप है और ‘दाऊद का नगर’ के अर्थ को सुरक्षित रखता है।
- source_word: מִיכַל בַּת שָׁאוּל
  choice: शाऊल की बेटी मीकल
  rationale: संबंधसूचक पहचान को स्वाभाविक हिंदी क्रम में रखा गया है; यह कथानक में उसके शाऊल से संबंध को उभारता है।
- source_word: נִשְׁקְפָה בְּעַד הַחַלּוֹן
  choice: खिड़की से बाहर देखा
  rationale: क्रिया बंद या ऊँचे स्थान से बाहर देखने का बोध देती है; ‘बाहर देखा’ दिशा को रखता है, बिना अनावश्यक रूप से ‘नीचे’ जोड़ने के।
- source_word: מְפַזֵּז וּמְכַרְכֵּר
  choice: उछलते और घूमते
  rationale: दोनों विरल क्रियाओं की अलग-अलग गतिशील छवियाँ सुरक्षित हैं—पहली उत्साहपूर्ण उछलने और दूसरी घूमने की गति बताती है।
- source_word: וַתִּבֶז לוֹ בְּלִבָּהּ
  choice: मन-ही-मन उसे तुच्छ समझा
  rationale: ‘मन-ही-मन’ आंतरिक प्रतिक्रिया को और ‘तुच्छ समझा’ בזה की अवमानना को स्पष्ट, स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल में उपाधि नहीं, चार अक्षरों वाला व्यक्तिवाचक ईश्वरीय नाम है। आधुनिक हिंदी पाठकों में परिचित नामरूप ‘यहोवा’ मूल की नामात्मक प्रकृति बनाए रखता है।
- issue: दाऊद की गतिविधि का वर्णन
  choice: उछलते और घूमते
  alternative: नाचते हुए
  rationale: मूल दो विशिष्ट क्रियाएँ देता है। केवल ‘नाचते’ कहना उन्हें एक सामान्य क्रिया में मिला देता; चुना हुआ रूप उत्साहपूर्ण शारीरिक गति को बनाए रखता है, पर उसका धार्मिक मूल्यांकन नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सरल कथात्मक शैली। वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है। ‘मन-ही-मन’ सामान्य पाठक के लिए सहज है और मूल के ‘अपने हृदय में’ का भाव रखता है।
