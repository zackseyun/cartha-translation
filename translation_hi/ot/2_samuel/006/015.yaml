base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/015.yaml
  text: So David and all the house of Israel were bringing up the ark of Yahweh with shouting and with the sound of the horn[a][b].
translation:
  language: hi
  text: इस प्रकार दाऊद और इस्राएल का सारा घराना जयजयकार और नरसिंगे की ध्वनि के साथ यहोवा के सन्दूक को ऊपर ले जा रहे थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उल्लासपूर्ण जयध्वनि के साथ।” “नरसिंगा” के लिए इब्रानी शब्द शोफ़ार है, जो सामान्यतः पशु के सींग, प्रायः मेंढ़े के सींग, से बना फूँक-वाद्य था।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלִים
  choice: ऊपर ले जा रहे थे
  rationale: हिफ़ील कृदन्त चल रही सामूहिक क्रिया को दर्शाता है; यह रूप यरूशलेम की ओर सन्दूक को ऊपर ले जाने का भाव स्वाभाविक हिन्दी में रखता है।
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: इस्राएल का सारा घराना
  rationale: ‘घराना’ इब्रानी ‘घर’ के सामूहिक और पारिवारिक भाव को बचाता है; केवल ‘सारा इस्राएल’ कहने से यह रूपक मिट जाता।
- source_word: אֲרוֹן יְהוָה
  choice: यहोवा का सन्दूक
  rationale: אֲרוֹן के लिए प्रचलित बाइबलीय हिन्दी ‘सन्दूक’ और वाचा के नाम יְהוָה के लिए परिचित रूप ‘यहोवा’ रखा गया है।
- source_word: תְרוּעָה
  choice: जयजयकार करते
  rationale: यह शब्द ऊँची पुकार, विशेषतः उल्लासपूर्ण सामूहिक जयध्वनि, दर्शा सकता है। प्रसंग उत्सव का है और अगले पदांश में नरसिंगे की ध्वनि अलग से आती है।
- source_word: קוֹל שׁוֹפָר
  choice: नरसिंगा फूँकते हुए
  rationale: शाब्दिक अर्थ ‘शोफ़ार की ध्वनि के साथ’ है। आधुनिक हिन्दी में वाद्य की ध्वनि को स्वाभाविक ढंग से व्यक्त करने के लिए यह क्रियात्मक रूप चुना गया; ‘नरसिंगा’ सींग से बने या सींग-जैसे फूँक-वाद्य का बोध देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम को सामान्य उपाधि ‘प्रभु’ से नहीं बदला गया। ‘यहोवा’ हिन्दी बाइबल पाठकों में व्यापक रूप से पहचाना जाने वाला रूप है, जबकि ‘याहवे’ ध्वन्यात्मक पुनर्निर्माण के अधिक निकट माना जाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘घराना’ स्रोत की सामूहिक-पारिवारिक अभिव्यक्ति बचाता है; ‘सन्दूक’ और ‘नरसिंगा’ परिचित बाइबलीय शब्दावली हैं।
