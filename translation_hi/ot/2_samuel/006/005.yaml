base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/005.yaml
  text: And David and all the house of Israel were celebrating before Yahweh with all kinds of cypress wood instruments[a], and with lyres, harps, tambourines, rattles[c][b], and cymbals.
translation:
  language: hi
  text: दाऊद और इस्राएल का सारा घराना याहवे के सामने सरू की लकड़ी से बने हर प्रकार के वाद्यों[a], लायरों, वीणाओं, डफों, खड़खड़ों[b] और झाँझों के साथ उत्सव मना रहे थे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘हर प्रकार की सरू की लकड़ियों के साथ’ है। संभवतः आशय सरू की लकड़ी से बने विभिन्न वाद्यों से है; पेड़ की सटीक जाति भी निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: इस वाद्य की सटीक पहचान अनिश्चित है; संभवतः ये खड़खड़े, सिस्ट्रम या हिलाकर बजाए जाने वाले किसी अन्य प्रकार के वाद्य थे।
    reason: lexical_alternative
  - marker: c
    text: इसका अनुवाद ‘याहवे के सामने खेल रहे थे’ या ‘आनंद मना रहे थे’ भी हो सकता है। इब्रानी क्रिया खेलपूर्ण, आनंदमय उत्सव को व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֲקִים
  choice: उत्सव मना रहा था
  rationale: पिएल रूप यहाँ जुलूस के सामूहिक, आनंदपूर्ण और वाद्य-संगीत से युक्त उत्सव को दर्शाता है। यह चुनाव केवल खेल-कूद का अर्थ देने से बचता है, जबकि शब्द की उत्सवी व्यापकता बनाए रखता है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: यह इब्रानी मुहावरा याहवे की उपस्थिति में किए गए कार्य को व्यक्त करता है; परमेश्वर के व्यक्तिगत वाचा-नाम को याहवे के रूप में रखा गया है।
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: इस्राएल का सारा घराना
  rationale: इब्रानी के सामूहिक पारिवारिक-राष्ट्रीय पदबंध को केवल ‘सारा इस्राएल’ बनाकर सपाट करने के बजाय बनाए रखता है। एकवचन क्रिया हिंदी में ‘घराना’ के अनुसार है।
- source_word: בְּכֹל עֲצֵי בְרוֹשִׁים
  choice: सरू की लकड़ी के सब प्रकार के वाद्यों
  rationale: मूल पदबंध शाब्दिक रूप से कठिन और अधूरा-सा है—‘सरू की सब लकड़ियों से’। प्रसंग में वाद्य निहित जान पड़ते हैं; मुख्य पाठ में इसे स्पष्ट किया गया और अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: כִנֹּרוֹת
  choice: लायरों
  rationale: כִּנּוֹר को सामान्यतः लायर-प्रकार का तारवाद्य माना जाता है। ‘लायर’ इसे अगले अलग तारवाद्य से अलग रखता है।
- source_word: נְבָלִים
  choice: वीणाओं
  rationale: यह כִּנּוֹר से भिन्न तारवाद्य है। सटीक बनावट अनिश्चित है, पर ‘वीणा’ आधुनिक हिंदी पाठक के लिए समझने योग्य व्यापक समतुल्य है।
- source_word: תֻפִּים
  choice: डफों
  rationale: תֹּף हाथ से बजाया जाने वाला चौखटे वाला ढोल था; ‘डफ’ संक्षिप्त और सामान्य हिंदी पद है।
- source_word: מְנַעַנְעִים
  choice: खड़खड़ों
  rationale: यह दुर्लभ पद संभवतः हिलाकर ध्वनि उत्पन्न करने वाले वाद्यों को बताता है। ‘खड़खड़ा’ क्रिया-विधि को सहज रूप में व्यक्त करता है, जबकि सटीक पहचान पादटिप्पणी में खुली रखी गई है।
- source_word: צֶלְצֶלִים
  choice: झाँझों
  rationale: यह आपस में टकराकर बजाए जाने वाले धातु के वाद्यों का स्वाभाविक और प्रचलित हिंदी नाम है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे उपस्थित है। ‘याहवे’ उसका आधुनिक विद्वत्तापूर्ण लिप्यंतरण है और नाम को किसी उपाधि से नहीं बदलता।
- issue: מְשַׂחֲקִים की उत्सवी गतिविधि
  choice: उत्सव मना रहा था
  alternative: खेल रहा था / आनंद कर रहा था / वाद्य बजा रहा था
  rationale: शब्द में खेलपूर्ण और आनंदपूर्ण उत्सव की अर्थ-छाया है। वाद्य-सूची के प्रसंग में ‘उत्सव मनाना’ उपासना-जुलूस के आनंद को व्यक्त करता है, पर इसे केवल वादन तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण कथात्मक रजिस्टर रखा गया है। ‘घराना’ इब्रानी सामूहिक अभिव्यक्ति को बचाता है। दुर्लभ प्राचीन वाद्यों के लिए जहाँ संभव था वहाँ समझने योग्य हिंदी नाम दिए गए हैं और वास्तविक शाब्दिक अनिश्चितता पादटिप्पणियों में सुरक्षित रखी गई है।
