lexical_decisions:
- source_word: וַיֹּסֶף עוֹד
  choice: फिर
  rationale: यहाँ יסף + עוד का मुहावरा किसी काम को दोबारा करने का भाव देता है; आधुनिक हिन्दी में ‘फिर’ स्वाभाविक और संक्षिप्त है।
- source_word: אֶת כָּל
  choice: सभी
  rationale: אֶת निश्चित कर्म का चिह्न है और כָּל समग्रता व्यक्त करता है; हिन्दी में ‘सभी’ दोनों के वाक्यगत आशय को सहज रूप से प्रकट करता है।
- source_word: בָּחוּר
  choice: चुने हुए पुरुषों
  rationale: इस शब्द का अर्थ ‘जवान’ भी हो सकता है, पर सैन्य जमावड़े और बड़ी गिनती के इस संदर्भ में चुने हुए अथवा उत्तम पुरुष अधिक उपयुक्त है; अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल के
  rationale: यहाँ בְ समूह से संबंध अथवा उसमें से चयन को दर्शाता है; ‘इस्राएल के’ स्वाभाविक हिन्दी में उस संबंध को व्यक्त करता है।
- source_word: שְׁלֹשִׁים אָלֶף
  choice: कुल तीस हज़ार
  rationale: संख्या का सीधा अनुवाद ‘तीस हज़ार’ है; ‘कुल’ इसे पहले आए ‘सभी’ पुरुषों की संख्या के रूप में स्पष्ट और स्वाभाविक ढंग से जोड़ता है।
