  text: וַ/יָּ֥שָׁב דָּוִ֖ד לְ/בָרֵ֣ךְ אֶת בֵּית֑/וֹ וַ/תֵּצֵ֞א מִיכַ֤ל בַּת שָׁאוּל֙ לִ/קְרַ֣את דָּוִ֔ד וַ/תֹּ֗אמֶר מַה נִּכְבַּ֨ד הַ/יּ֜וֹם מֶ֣לֶךְ יִשְׂרָאֵ֗ל אֲשֶׁ֨ר נִגְלָ֤ה הַ/יּוֹם֙ לְ/עֵינֵ֨י אַמְה֣וֹת עֲבָדָ֔י/ו כְּ/הִגָּל֥וֹת נִגְל֖וֹת אַחַ֥ד הָ/רֵקִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/020.yaml
  text: Then David returned to bless his household[a]. But Michal daughter of Saul came out to meet David and said, “How honored the king of Israel was today, uncovering himself today in the sight of the servant girls of his servants[c][b], as one of the vulgar fellows shamelessly uncovers himself!”
translation:
  language: hi
  text: तब दाऊद अपने घराने को आशीर्वाद देने के लिए लौट आया। पर शाऊल की बेटी मीकल दाऊद से मिलने बाहर आई और बोली, “आज इस्राएल के राजा का कितना सम्मान हुआ है! उसने आज अपने दासों की दासियों की आँखों के सामने अपने आपको उघाड़ा, जैसे निकम्मों में से कोई बेशर्मी से अपने आपको उघाड़ता है!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “आज इस्राएल के राजा का कितना सम्मान हुआ है!” यहाँ मीकल की बात व्यंग्यपूर्ण है। “दासियों” का अनुवाद “सेविकाओं” भी किया जा सकता है; इब्रानी शब्द निम्न सामाजिक स्थिति वाली स्त्री आश्रितों को सूचित करता है। अंतिम वाक्यांश का अर्थ “जैसे निकम्मे लोगों में से कोई अपने आपको पूरी तरह उघाड़ देता है” भी हो सकता है।
    reason: व्यंग्य, सामाजिक-स्थिति संबंधी शब्द, और जोरदार इब्रानी अभिव्यक्ति की वैकल्पिक बारीकियाँ स्पष्ट करना।
lexical_decisions:
- source_word: לְבָרֵךְ
  choice: आशीर्वाद देने के लिए
  rationale: यहाँ ברך दाऊद के अपने घराने के लोगों को आशीर्वाद देने के उद्देश्य को व्यक्त करता है; यह स्वाभाविक और निकट अनुवाद है।
- source_word: בֵּיתוֹ
  choice: अपने घराने
  rationale: בית यहाँ केवल भवन नहीं, बल्कि उसमें रहने वाले परिवार और आश्रितों को सूचित करता है, जिन्हें दाऊद आशीर्वाद देने लौटता है।
- source_word: מִיכַל בַּת שָׁאוּל
  choice: शाऊल की बेटी मीकल
  rationale: यह रूप कथानक में मीकल की शाऊल से पहचान पर दिए गए जोर को बनाए रखता है।
- source_word: מַה נִּכְבַּד הַיּוֹם
  choice: आज ... ने क्या ही सम्मान पाया है
  rationale: כבד का सम्मान-सूचक मूल अर्थ रखते हुए प्रसंग में स्पष्ट व्यंग्य को पाठक के लिए खुला रखा गया है।
- source_word: נִגְלָה
  choice: अपने आपको उघाड़ता फिरा
  rationale: निफ़अल रूप स्वयं को उघाड़ने को व्यक्त करता है; ‘फिरा’ सार्वजनिक और तिरस्कारपूर्ण चित्र को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: לְעֵינֵי
  choice: आँखों के सामने
  rationale: हिब्रू मुहावरे का सहज हिन्दी समतुल्य है और कार्य के सार्वजनिक होने पर बल बनाए रखता है।
- source_word: אַמְהוֹת עֲבָדָיו
  choice: अपने सेवकों की दासियों
  rationale: אמה की बंधुआ और निम्न सामाजिक स्थिति को ‘दासियों’ द्वारा बनाए रखा गया है, जबकि עבדיו को इस संदर्भ में स्वाभाविक रूप से ‘सेवकों’ कहा गया है।
- source_word: כְּהִגָּלוֹת נִגְלוֹת
  choice: बेशर्मी से अपने आपको उघाड़ता है
  rationale: दोहराव से उत्पन्न तीव्र और अपमानजनक बल को हिन्दी में ‘बेशर्मी से’ व्यक्त करता है।
- source_word: אַחַד הָרֵקִים
  choice: कोई निकम्मा आदमी
  rationale: ריקים सामाजिक रूप से तुच्छ और चरित्रहीन व्यक्तियों के लिए अपमानसूचक शब्द है; ‘निकम्मा आदमी’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण रहते हुए तिरस्कार व्यक्त करता है।
theological_decisions:
- issue: אַמְהוֹת में सामाजिक स्थिति
  choice: दासियाँ
  alternative: सेविकाएँ / नौकरानियाँ
  rationale: यह पद निम्न दर्जे की बंधुआ स्त्रियों को सूचित कर सकता है, और मीकल का ताना सामाजिक पदानुक्रम पर निर्भर है; इसलिए नरम शब्द चुनकर इस तत्व को मिटाया नहीं गया।
- issue: मीकल के कथन का व्यंग्य
  choice: सम्मान-सूचक शब्द को मूल पाठ की तरह रखते हुए व्यंग्य प्रसंग से व्यक्त होने दिया
  alternative: ‘आज इस्राएल के राजा ने अपनी कैसी दुर्गति कराई’ जैसे स्पष्ट व्याख्यात्मक रूप
  rationale: हिब्रू कथन ऊपर से सम्मान की भाषा बोलता है, किंतु आशय व्यंग्यात्मक है। अनुवाद इस तनाव को स्पष्ट व्याख्या से समाप्त नहीं करता।
- issue: दाऊद के उघड़ने की सीमा
  choice: अपने आपको उघाड़ता
  alternative: नंगा हो गया / वस्त्र खिसक गए
  rationale: גלה उघाड़ने या खुल जाने को बताता है, पर पद स्वयं पूर्ण नग्नता की सीमा निश्चित नहीं करता; इसलिए अधिक निश्चित भाषा से बचा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, कथात्मक और गरिमापूर्ण शैली। मीकल की कटु व्यंग्योक्ति को स्वाभाविक विस्मयादिबोधक वाक्य से व्यक्त किया गया है। मुख्य पाठ में बंधुआ स्थिति के लिए ‘दासियाँ’ रखा गया है, किंतु दाऊद के עבדיו के लिए प्रसंगानुसार ‘सेवक’ रखा गया है।
