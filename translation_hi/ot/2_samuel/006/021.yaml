id: 2SA.6.21
reference: 2 Samuel 6:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִד֮ אֶל מִיכַל֒ לִ/פְנֵ֣י יְהוָ֗ה אֲשֶׁ֨ר בָּֽחַר בִּ֤/י מֵֽ/אָבִי/ךְ֙ וּ/מִ/כָּל בֵּית֔/וֹ לְ/צַוֺּ֨ת אֹתִ֥/י נָגִ֛יד עַל עַ֥ם יְהוָ֖ה עַל יִשְׂרָאֵ֑ל וְ/שִׂחַקְתִּ֖י לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/021.yaml
  text: David said to Michal[a], “It was before Yahweh, who chose me above your father and above all his house, to appoint me ruler over the people of Yahweh, over Israel—and I celebrated before Yahweh.”
translation:
  language: hi
  text: दाऊद ने मीकल से कहा, “यह याहवे के सामने था—उसके सामने, जिसने तुम्हारे पिता और उसके सारे घराने के स्थान पर मुझे चुना, ताकि मुझे याहवे की प्रजा, इस्राएल पर शासक नियुक्त करे। और मैं याहवे के सामने उत्सव मनाऊँगा।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं याहवे के सामने नाचूँगा।” इब्रानी क्रिया नृत्य तक सीमित नहीं है; वह हर्षपूर्ण, खेलपूर्ण या उत्सवी आचरण भी व्यक्त कर सकती है।
    reason: शब्दार्थ का वैकल्पिक अनुवाद और मूल क्रिया की व्यापकता स्पष्ट करना।
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: यह स्थान और संबंध सूचित करने वाला वाक्यांश है। ‘के सामने’ सहज हिन्दी में किसी की उपस्थिति में किए गए कार्य का भाव देता है और पद में इसकी पुनरावृत्ति बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम का लिप्यंतरण किया गया है, ताकि मूल पाठ में प्रयुक्त व्यक्तिगत नाम किसी उपाधि से न बदले।
- source_word: אֲשֶׁר בָּחַר בִּי מֵאָבִיךְ וּמִכָּל בֵּיתוֹ
  choice: जिसने तुम्हारे पिता और उसके सारे घराने के स्थान पर मुझे चुना
  rationale: בחר के साथ מן यहाँ अलग करके चुनाव करने का तुलनात्मक भाव देता है। हिन्दी में ‘के स्थान पर’ शाऊल और उसके राजवंश के बजाय दाऊद के चुने जाने को स्वाभाविक ढंग से व्यक्त करता है; ‘घराना’ पारिवारिक और राजवंशीय दोनों अर्थों को सम्भव रखता है।
- source_word: לְצַוֹּת אֹתִי
  choice: मुझे ... नियुक्त करे
  rationale: צוה का सामान्य अर्थ ‘आज्ञा देना’ है, पर इस पद में पदाधिकारी बनाकर अधिकार सौंपने का भाव है; इसलिए ‘नियुक्त करे’ प्रसंगानुकूल है।
- source_word: נָגִיד
  choice: शासक
  rationale: נָגִיד अधिकार प्राप्त अगुए या शासक को सूचित करता है। ‘शासक’ राजकीय अधिकार को स्पष्ट करता है, पर इसे अनावश्यक रूप से ‘राजा’ नहीं बनाता।
- source_word: עַל עַם יְהוָה עַל יִשְׂרָאֵל
  choice: याहवे की प्रजा, इस्राएल पर
  rationale: ‘याहवे की प्रजा’ वाचा-संबंधी पहचान को बनाए रखता है और ‘इस्राएल’ को उसी प्रजा की पुनर्व्याख्या के रूप में रहने देता है।
- source_word: וְשִׂחַקְתִּי
  choice: और मैं ... उत्सव मनाऊँगा
  rationale: שׂחק हर्षपूर्ण, खेलपूर्ण या उत्सवी आचरण का व्यापक शब्द है और इस प्रसंग में पहले आए अधिक नृत्य-विशिष्ट शब्दों से अलग है। क्रिया-रूप को दाऊद के आगे भी ऐसा करने के संकल्प के रूप में भविष्यकाल में रखा गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत नाम आया है; उसका लिप्यंतरण नाम और उपाधि के भेद को सुरक्षित रखता है।
- issue: अन्तिम क्रिया שׂחק को विशेष रूप से नृत्य कहना या व्यापक उत्सवी क्रिया
  choice: उत्सव मनाऊँगा
  alternative: नाचूँगा
  rationale: यहाँ שׂחק प्रयुक्त है, न कि निकटवर्ती पदों में आए नृत्य के अधिक विशिष्ट शब्द। इसलिए मुख्य पाठ में व्यापक अर्थ रखा गया है और प्रसंग से सम्भव नृत्य वाला अर्थ पादटिप्पणी में दिया गया है।
- issue: וְשִׂחַקְתִּי का काल और भाव
  choice: मैं उत्सव मनाऊँगा
  alternative: मैंने उत्सव मनाया
  rationale: दाऊद के उत्तर में यह रूप उसके आगामी/जारी संकल्प को व्यक्त कर सकता है। भविष्यकाल उस प्रवाह को सुरक्षित रखता है, जबकि आरम्भ का ‘यह ... के सामने था’ पिछले कार्य की ओर संकेत करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आरम्भिक खंड की इब्रानी वाक्य-रचना को स्पष्ट करने के लिए ‘यह ... था—उसके सामने’ प्रयोग किया गया है। ‘घराना’ राजवंशीय अर्थ को बनाए रखता है और ‘प्रजा’ सामान्य आधुनिक पाठक के लिए स्वाभाविक है।
