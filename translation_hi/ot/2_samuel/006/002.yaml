base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/002.yaml
  text: David arose and went[a], with all the people who were with him, from Baale-judah to bring up from there the ark of God, which is called by the Name, the name of Yahweh of Armies[d][c][b], who is enthroned above the cherubim.
translation:
  language: hi
  text: दाऊद उठा और अपने साथ के सभी लोगों को लेकर बाले-यहूदा से गया, ताकि वहाँ से परमेश्वर के सन्दूक को ऊपर ले आए—उस सन्दूक को जिस पर करूबों के ऊपर विराजमान सेनाओं के यहवे का नाम पुकारा जाता है।[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'या, अधिक शाब्दिक रूप से: “जो उस नाम से कहलाता है—करूबों के ऊपर विराजमान सेनाओं के यहवे के नाम से।” इब्रानी नामकरण-सूत्र संकुचित है।'
    reason: lexical_alternative
  - marker: c
    text: “करूबों के ऊपर विराजमान” का अनुवाद “करूबों के बीच निवास करनेवाला” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: उठा ... गया
  rationale: दोनों क्रमिक क्रियाओं को बनाए रखा गया है; קום कार्य के आरम्भ और הלך जाने को व्यक्त करता है।
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: अपने साथ के सभी लोगों को लेकर
  rationale: दाऊद के साथ पूरी संगति के जाने का भाव स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: מִבַּעֲלֵי יְהוּדָה
  choice: यहूदा के बाले
  rationale: सन्दर्भ इसे स्थान-नाम बताता है, यद्यपि इब्रानी रूप असामान्य है; विकल्प पादटिप्पणी में रखा गया है।
- source_word: לְהַעֲלוֹת מִשָּׁם
  choice: वहाँ से ... ऊपर ले आए
  rationale: हिफ़ील रूप का ‘ऊपर लाना’ अर्थ सुरक्षित है और यरूशलेम की ओर सन्दूक ले जाने के प्रसंग के अनुकूल है।
- source_word: אֵת אֲרוֹן הָאֱלֹהִים
  choice: परमेश्वर का सन्दूक
  rationale: वर्णनात्मक प्रसंग में यह स्थापित और सुबोध हिन्दी पद है।
- source_word: אֲשֶׁר נִקְרָא שֵׁם שֵׁם יְהוָה צְבָאוֹת ... עָלָיו
  choice: जिस पर उस नाम का, अर्थात् ... सेनाओं के यहवे के नाम का, आह्वान किया गया है
  rationale: निष्क्रिय נקרא और עָלָיו को स्पष्ट रखते हुए संकुचित नामकरण-वाक्य की गम्भीरता और वास्तविक व्याकरणिक जटिलता बचाई गई है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहवे
  rationale: व्यक्तिगत वाचा-नाम को ‘यहवे’ और צבאות को आधुनिक पाठक के लिए पारदर्शी ‘सेनाओं’ से व्यक्त किया गया है।
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: करूबों के ऊपर विराजमान
  rationale: ישב यहाँ राजकीय विराजमानता का संकेत देता है; ‘ऊपर’ सन्दूक के करूबों से सम्बद्ध चित्र को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है; लिप्यन्तरण उसे सामान्य उपाधि में बदलने से बचाता है।
- issue: צבאות का अर्थ
  choice: सेनाओं के
  alternative: गणों के
  rationale: ‘सेनाओं’ से सैन्य और स्वर्गीय समूहों का व्यापक भाव आधुनिक हिन्दी में अधिक स्पष्ट रहता है।
- issue: सन्दूक पर नाम पुकारे जाने का सूत्र
  choice: जिस पर ... नाम का आह्वान किया गया है
  alternative: जो उस नाम से कहलाता है; जो उस नाम को धारण करता है
  rationale: נקרא और עָלָיו की औपचारिक संरचना को सुरक्षित रखा गया है और सन्दूक तथा ईश्वरीय नाम के सम्बन्ध को केवल स्वामित्व मानकर नहीं सुलझाया गया।
- issue: करूबों से यहवे का सम्बन्ध
  choice: करूबों के ऊपर विराजमान
  alternative: करूबों के बीच निवास करनेवाला; करूबों पर विराजमान
  rationale: वाक्यांश राजसिंहासन की छवि सुझाता है, पर स्थानगत सूक्ष्मता विवादित है; विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘सन्दूक’, ‘करूब’ और ‘विराजमान’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं। मूल के अत्यन्त संकुचित नामकरण-वाक्य को मुख्य पाठ में औपचारिक रूप से सुरक्षित रखते हुए उसके प्रमुख विकल्प पादटिप्पणियों में दिए गए हैं।
