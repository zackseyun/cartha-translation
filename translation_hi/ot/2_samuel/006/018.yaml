reference: 2 Samuel 6:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְכַ֣ל דָּוִ֔ד מֵ/הַעֲל֥וֹת הָ/עוֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יְבָ֣רֶךְ אֶת הָ/עָ֔ם בְּ/שֵׁ֖ם יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/018.yaml
  text: When David had finished offering the burnt offering and the peace offerings[a], he blessed the people in the name of Yahweh of hosts.
translation:
  language: hi
  text: जब दाऊद होमबलि और मेलबलियाँ[a] चढ़ा चुका था, तब उसने लोगों को सेनाओं के याहवे[b] के नाम से आशीर्वाद दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शान्ति-बलियाँ,” “सहभागिता-बलियाँ” अथवा “कुशल-मंगल की बलियाँ।” हिब्रू शब्द ऐसे बलिदानों के वर्ग को दर्शाता है जिनमें मेल, कुशलता और सहभागिता के भाव जुड़े हैं।
    reason: שְׁלָמִים की अर्थ-व्याप्ति किसी एक हिंदी पद में पूरी तरह व्यक्त नहीं होती।
  - marker: b
    text: 'हिब्रू उपाधि: “याहवे सेनाओं का।” इसे “सेनाओं का याहवे” भी अनुवादित किया जा सकता है।'
    reason: ईश्वरीय नाम יהוה के लिए ‘याहवे’ और צְבָאוֹת की शाब्दिक उपाधि को पारदर्शी बनाना।
lexical_decisions:
- source_word: וַיְכַל
  choice: चढ़ा चुका
  rationale: क्रिया כלה पूर्ववर्ती कार्य की पूर्णता बताती है; हिंदी कथा-क्रम में संयुक्त रूप ‘चढ़ा चुका’ स्वाभाविक है।
- source_word: מֵהַעֲלוֹת
  choice: चढ़ा
  rationale: עלה का हिफ़ील infinitive बलिदान के संदर्भ में वेदी पर अर्पित करने, अर्थात ‘चढ़ाने’, का अर्थ देता है।
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: עֹלָה उस बलिदान का मानक नाम है जो वेदी पर पूर्णतः जलाया जाता था; ‘होमबलि’ हिंदी बाइबलीय प्रयोग में संक्षिप्त और पहचाना हुआ पद है।
- source_word: וְהַשְּׁלָמִים
  choice: और मेलबलियाँ
  rationale: שְׁלָמִים सहभागिता, कुशलता और मेल से जुड़े बलिदानों का वर्ग है; ‘मेलबलियाँ’ अर्थ का प्रमुख पहलू रखता है और बहुवचन को दर्शाता है।
- source_word: וַיְבָרֶךְ
  choice: आशीर्वाद दिया
  rationale: ברך का यहाँ सीधा अर्थ आशीर्वाद देना है।
- source_word: אֶת־הָעָם
  choice: लोगों को
  rationale: עָם यहाँ एकत्र समुदाय को सामूहिक रूप से दर्शाता है; ‘लोगों’ सामान्य और स्वाभाविक हिंदी है।
- source_word: בְּשֵׁם
  choice: के नाम से
  rationale: यह वाक्यांश उस नाम के अधिकार या आह्वान के अंतर्गत आशीर्वाद देने को व्यक्त करता है; ‘के नाम से’ सहज हिंदी है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम יהוה को हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि पदवी ‘प्रभु’ से।
- source_word: צְבָאוֹת
  choice: सेनाओं के
  rationale: צְבָאוֹת का मूल अर्थ सैन्य दल या सेनाएँ है; ‘सेनाओं के यहोवा’ हिब्रू उपाधि की संरचना और व्यापक सामर्थ्य-सूचक अर्थ को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम स्पष्ट रूप से है। हिंदी पाठकों में ‘यहोवा’ इसका स्थापित लिप्यंतरण है; ‘प्रभु’ नाम को पदवी में बदल देता, जबकि ‘याहवे’ अधिक स्रोत-सन्निकट वैकल्पिक लिप्यंतरण है।
- issue: יהוה צבאות की व्याख्या
  choice: सेनाओं के यहोवा
  alternative: स्वर्गीय सेनाओं के यहोवा; सर्वशक्तिमान यहोवा
  rationale: सिर्फ ‘सेनाओं’ कहना मूल की व्यापक और कुछ हद तक खुली हुई उपाधि को सुरक्षित रखता है; ‘स्वर्गीय’ या ‘सर्वशक्तिमान’ जोड़ने से व्याख्या पाठ में समा जाती।
- issue: שְׁלָמִים बलिदानों का नाम
  choice: मेलबलियाँ
  alternative: शान्ति-बलियाँ; सहभागिता-बलियाँ; कुशल-मंगल की बलियाँ
  rationale: यह बलिदान-वर्ग मेल, कुशलता और सामुदायिक सहभागिता से जुड़ा है। ‘मेलबलियाँ’ संक्षिप्त और समझने योग्य है, पर पद की अर्थ-व्याप्ति को पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। बलिदान-संबंधी पारंपरिक संक्षिप्त पदों को आवश्यक पादटिप्पणियों के साथ रखा गया है।
