  text: וַ/יְחַלֵּ֨ק לְ/כָל הָ/עָ֜ם לְ/כָל הֲמ֣וֹן יִשְׂרָאֵל֮ לְ/מֵ/אִ֣ישׁ וְ/עַד אִשָּׁה֒ לְ/אִ֗ישׁ חַלַּ֥ת לֶ֨חֶם֙ אַחַ֔ת וְ/אֶשְׁפָּ֣ר אֶחָ֔ד וַ/אֲשִׁישָׁ֖ה אֶחָ֑ת וַ/יֵּ֥לֶךְ כָּל הָ/עָ֖ם אִ֥ישׁ לְ/בֵיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/019.yaml
  text: He distributed to all the people[a], to the whole multitude of Israel, from man to woman, to each person one loaf of bread, one portion of meat, and one raisin cake. Then all the people went away[b], each to his house.
translation:
  language: hi
  text: उसने सब लोगों को[a], यानी इस्राएल की सारी भीड़ को—पुरुष से लेकर स्त्री तक—हर एक को एक रोटी, मांस का एक भाग[b] और किशमिश की एक टिकिया बाँटी। तब सब लोग अपने-अपने घर चले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पुरुष से लेकर स्त्री तक”; अर्थात वहाँ इकट्ठे हुए स्त्री-पुरुष सभी लोग।
    reason: cultural_note
  - marker: b
    text: या “एक माप/भाग।” इब्रानी शब्द אֶשְׁפָּר दुर्लभ है। बहुत-से विद्वान 1 इतिहास 16:3 के समानांतर विवरण के आधार पर इसे यहाँ मांस का एक भाग समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלֵּק
  choice: उसने ... बाँटी
  rationale: पिएल रूप यहाँ भीड़ के प्रत्येक सदस्य को खाद्य-वस्तुएँ बाँटने का बोध देता है। हिंदी में वस्तुओं की सूची के अनुसार स्त्रीलिंग बहुवचन क्रिया स्वाभाविक है।
- source_word: לְכָל הָעָם / לְכָל הֲמוֹן יִשְׂרָאֵל
  choice: सब लोगों को—इस्राएल की सारी भीड़ में
  rationale: दोनों समानार्थी-से वाक्यांशों को बनाए रखकर मूल का विस्तार और बल सुरक्षित रखा गया है।
- source_word: לְמֵאִישׁ וְעַד אִשָּׁה
  choice: पुरुष से लेकर स्त्री तक
  rationale: यह अभिव्यक्ति उपस्थित समुदाय के स्त्री-पुरुष सभी लोगों को सम्मिलित करती है; मूल की सीमा-सूचक रचना भी बनी रहती है।
- source_word: לְאִישׁ
  choice: हर एक को
  rationale: निकट संदर्भ स्त्रियों और पुरुषों दोनों को स्पष्टतः शामिल करता है; इसलिए वितरणार्थक भाव को लिंग-समावेशी और स्वाभाविक हिंदी में व्यक्त किया गया है।
- source_word: חַלַּת לֶחֶם אַחַת
  choice: एक रोटी
  rationale: חַלָּה यहाँ रोटी अथवा रोटी की टिकिया है। 'एक रोटी' आधुनिक हिंदी में स्पष्ट और ठोस है।
- source_word: אֶשְׁפָּר אֶחָד
  choice: मांस का एक भाग
  rationale: दुर्लभ शब्द אֶשְׁפָּר का अर्थ अनिश्चित है। प्रसंग और 1 इतिहास 16:3 के समानांतर विवरण के आधार पर खाद्य-पदार्थ, संभवतः मांस का भाग, सर्वाधिक संभावित है; अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: אֲשִׁישָׁה אֶחָת
  choice: किशमिश की एक टिकिया
  rationale: यह दबाए हुए फलों की टिकिया, प्रायः किशमिश की टिकिया, के अर्थ में समझा जाता है। यह हिंदी में सहज और विशिष्ट है।
- source_word: וַיֵּלֶךְ כָּל הָעָם אִישׁ לְבֵיתוֹ
  choice: तब सब लोग अपने-अपने घर चले गए
  rationale: '''अपने-अपने घर'' इब्रानी के वितरणार्थक एकवचन ''हर व्यक्ति अपने घर'' को स्वाभाविक हिंदी में व्यक्त करता है।'
