base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/006.yaml
  text: When they came to Nacon’s threshing floor[a], Uzza reached out to the ark of God and took hold of it[b], because the oxen stumbled.
translation:
  language: hi
  text: जब वे नाखोन के खलिहान तक पहुँचे[a], तब उज्जा ने परमेश्वर के सन्दूक की ओर हाथ बढ़ाकर उसे थाम लिया, क्योंकि बैल लड़खड़ा गए थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नाकोन के खलिहान”; अथवा, कम सम्भावना से, “स्थिर/स्थापित खलिहान।”
    reason: lexical_alternative
  - marker: b
    text: या “बैल फिसल गए थे”; अथवा सम्भवतः “बैलों ने उसे गिरने या उलटने की स्थिति में ला दिया था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן
  choice: खलिहान
  rationale: यहाँ शब्द उस समतल स्थान को दर्शाता है जहाँ अनाज की मड़ाई की जाती थी। आधुनिक हिन्दी में ‘खलिहान’ इसका स्वाभाविक और संक्षिप्त समतुल्य है।
- source_word: נָכוֹן
  choice: नाकोन
  rationale: बिना निश्चित उपपद का यह रूप यहाँ स्थान अथवा व्यक्ति के नाम के रूप में सबसे स्वाभाविक जान पड़ता है। विशेषणात्मक अर्थ की वास्तविक सम्भावना पादटिप्पणी में रखी गई है।
- source_word: וַיִּשְׁלַח
  choice: हाथ बढ़ाकर
  rationale: मूल क्रिया का सामान्य अर्थ ‘बढ़ाना/फैलाना’ है; सन्दूक की ओर की गई क्रिया में हाथ निहित है। हिन्दी में ‘हाथ बढ़ाकर’ क्रिया-क्रम को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: परमेश्वर का सन्दूक
  rationale: पूरे इब्रानी पदबंध को बनाए रखते हुए सन्दूक की पवित्र पहचान स्पष्ट की गई है।
- source_word: וַיֹּאחֶז בּוֹ
  choice: उसे थाम लिया
  rationale: אחז का अर्थ पकड़ना अथवा थाम लेना है। ‘थाम लिया’ इस प्रसंग में सहारा देने की तत्काल क्रिया को स्वाभाविक ढंग से बताता है, पर मूल से अधिक हिंसक भाव नहीं जोड़ता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह संयोजक उज्जा की क्रिया का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
- source_word: שָׁמְטוּ
  choice: लड़खड़ा गए थे
  rationale: क्रिया फिसलने, छूटने या गिरने देने का भाव व्यक्त कर सकती है। बैलों को कर्ता मानते हुए ‘लड़खड़ा गए थे’ सम्भावित घटना को सहज हिन्दी में व्यक्त करता है, जबकि अन्य सम्भावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: הַבָּקָר
  choice: बैल
  rationale: गाड़ी खींचने के इस प्रसंग में व्यापक ‘मवेशी’ की अपेक्षा ‘बैल’ अधिक सटीक और स्वाभाविक है।
theological_decisions:
- issue: उज्जा की क्रिया का तात्कालिक कारण
  choice: उज्जा ने सन्दूक को इसलिए थामा क्योंकि बैल लड़खड़ा गए थे।
  alternative: बैल फिसल गए थे; अथवा बैलों ने सन्दूक को गिरने या उलटने की स्थिति में ला दिया था।
  rationale: इब्रानी पाठ कारणसूचक उपवाक्य देता है, जिसमें बैल कर्ता हैं और क्रिया का अर्थ कुछ खुला हुआ है। अनुवाद घटना की सम्भावित यांत्रिकी को निश्चित नहीं करता और यह दावा नहीं जोड़ता कि सन्दूक वास्तव में गिर चुका था।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘खलिहान’, ‘हाथ बढ़ाकर’ और ‘थाम लिया’ ग्रामीण दृश्य तथा क्रिया-क्रम को बिना अनावश्यक विस्तार के स्पष्ट करते हैं। नामों का रूप हिन्दी बाइबलीय प्रयोग के अनुरूप रखा गया है, जबकि נָכוֹן और שָׁמְטוּ की वास्तविक अनिश्चितताएँ पादटिप्पणियों में सुरक्षित हैं।
