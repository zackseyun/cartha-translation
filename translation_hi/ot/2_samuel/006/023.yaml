lexical_decisions:
- source_word: וּ/לְ/מִיכַל
  choice: और ... मीकल के
  rationale: वाव कथा की पिछली बात से संबंध बनाए रखता है, और לְ के साथ आया इब्रानी अस्तित्ववाचक मुहावरा हिन्दी में ‘मीकल के ... नहीं हुई’ द्वारा स्वाभाविक रूप से व्यक्त होता है।
- source_word: בַּת שָׁאוּל
  choice: शाऊल की बेटी
  rationale: यह संबंधसूचक पद मीकल की वंशगत पहचान सीधे और स्वाभाविक हिन्दी में बताता है।
- source_word: לֹא הָיָה לָהּ
  choice: के ... कोई ... नहीं हुई
  rationale: इब्रानी का शाब्दिक भाव ‘उसके लिए नहीं था’ अधिकार/प्राप्ति का मुहावरा है; प्रसंग में हिन्दी का ‘उसके कोई संतान नहीं हुई’ अधिक स्वाभाविक है।
- source_word: יָלֶד
  choice: संतान
  rationale: यह एकवचन संज्ञा यहाँ सामान्य रूप से बच्चे को सूचित कर सकती है और आवश्यक रूप से पुत्र तक सीमित नहीं है; ‘संतान’ हिन्दी में लिंग-निरपेक्ष तथा प्रसंगानुकूल है।
- source_word: עַד יוֹם מוֹתָהּ
  choice: अपनी मृत्यु के दिन तक
  rationale: यह मूल की कालवाचक अभिव्यक्ति को निकटता से रखते हुए आजीवन निःसंतान रहने का भाव स्पष्ट करता है।
theological_decisions:
- issue: ‘अपनी मृत्यु के दिन तक’ से उत्पन्न कालगत आशय
  choice: कालवाचक वाक्यांश को सीधे रखा गया है, जिससे उसके पूरे जीवन में संतान न होने का कथन बना रहे।
  alternative: ‘वह जीवन भर निःसंतान रही’ कहकर मुहावरे का आशय स्पष्ट करना।
  rationale: सीधा अनुवाद मूल की अभिव्यक्ति और उसके कथात्मक तनाव को सुरक्षित रखता है, पर मृत्यु के बाद संतान होने जैसी असंगत धारणा आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘संतान’ औपचारिक होते हुए भी प्रचलित है और मूल की लिंगगत व्यापकता सुरक्षित रखती है।
