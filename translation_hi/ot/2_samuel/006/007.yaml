base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/007.yaml
  text: And the anger of Yahweh burned against Uzzah[a], and God struck him there for the error, and he died there beside the ark of God.
translation:
  language: hi
  text: और उज्जा पर याहवे का क्रोध भड़क उठा। परमेश्वर ने उस भूल के कारण[a] उस पर वहीं प्रहार किया, और वह वहीं परमेश्वर के सन्दूक के पास मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उस अपराध के कारण,’ ‘उसके उतावले काम के कारण,’ अथवा सम्भवतः ‘क्योंकि उसने अपना हाथ बढ़ाया।’ इब्रानी वाक्यांश कठिन है और इसे कई प्रकार से समझा गया है।
    reason: दुर्लभ शब्द שַׁל के वैकल्पिक अर्थों और मूल पाठ की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: क्रोध भड़क उठा
  rationale: यह स्वाभाविक हिन्दी मुहावरा इब्रानी में क्रोध के जलने की सजीव छवि को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय उसका हिन्दी लिप्यंतरण किया गया है।
- source_word: בְּעֻזָּה
  choice: उज्जा पर
  rationale: इस क्रोधसूचक मुहावरे में בְּ उस व्यक्ति को चिह्नित करता है जिसके विरुद्ध क्रोध हुआ; हिन्दी में ‘उज्जा पर’ स्वाभाविक है।
- source_word: וַיַּכֵּהוּ
  choice: उसे ... मारा
  rationale: नכה का मूल अर्थ ‘मारना/प्रहार करना’ है। मृत्यु का परिणाम अगली उपवाक्य में अलग रखा गया है।
- source_word: שָׁם
  choice: वहीं
  rationale: दोनों बार प्रयुक्त इब्रानी स्थानवाचक शब्द को दोनों बार रखा गया है, जिससे घटना-स्थान पर कथात्मक बल बना रहता है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: मूल पाठ यहाँ याहवे नाम के बजाय אֱלֹהִים का प्रयोग करता है; हिन्दी में इस भिन्नता को सुरक्षित रखा गया है।
- source_word: עַל הַשַּׁל
  choice: उस भूल के कारण
  rationale: שַׁל दुर्लभ और कठिन शब्द है। ‘भूल’ एक सम्भावित अर्थ देता है, पर अस्पष्टता को पूरी तरह समाप्त नहीं करता; अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: וַיָּמָת
  choice: मर गया
  rationale: साधारण कथात्मक क्रिया को सीधी और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: עִם אֲרוֹן הָאֱלֹהִים
  choice: परमेश्वर के सन्दूक के पास
  rationale: यहाँ עִם स्थानिक अर्थ में है; ‘के पास’ हिन्दी में स्थान को स्पष्ट करता है और साथ चलने का अर्थ नहीं देता।
theological_decisions:
- issue: עַל הַשַּׁל में उज्जा की मृत्यु के कारण का निरूपण
  choice: उस भूल के कारण
  alternative: उस अपराध के कारण; उसके उतावले काम के कारण; क्योंकि उसने अपना हाथ बढ़ाया
  rationale: इब्रानी שַׁל अत्यन्त दुर्लभ और अर्थ की दृष्टि से अनिश्चित है। मुख्य पाठ में संक्षिप्त सम्भावित अर्थ रखा गया है और अन्य पाठार्थ पादटिप्पणी में दिए गए हैं, ताकि व्याख्यात्मक और धर्मवैज्ञानिक तनाव को कृत्रिम रूप से समाप्त न किया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक गद्य। ‘सन्दूक’ बाइबिलीय वस्तु के लिए परिचित शब्द है; वाक्यरचना सरल रखी गई है और मूल पाठ में ‘याहवे’ तथा ‘परमेश्वर’ की भिन्नता बनाए रखी गई है।
