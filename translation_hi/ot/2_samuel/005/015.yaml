lexical_decisions:
- source_word: יִבְחָר
  choice: यिभार
  rationale: व्यक्तिवाचक नाम को अनुवाद करने के बजाय हिब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है; आरंभिक योद को ‘य’ से दर्शाया गया है।
- source_word: אֱלִישׁוּעַ
  choice: एलीशूअ
  rationale: व्यक्तिवाचक नाम का स्रोत-आधारित लिप्यंतरण; अंतिम अयिन की उपस्थिति को ‘अ’ से संकेतित किया गया है, बिना अत्यधिक तकनीकी चिह्न लगाए।
- source_word: נֶפֶג
  choice: नेपेग
  rationale: दाऊद के पुत्रों की सूची में आया व्यक्तिवाचक नाम; हिब्रानी व्यंजन और स्वरों के निकट सरल देवनागरी लिप्यंतरण।
- source_word: יָפִיעַ
  choice: यापीअ
  rationale: व्यक्तिवाचक नाम का हिब्रानी के निकट लिप्यंतरण; आरंभिक योद ‘य’ और अंतिम अयिन को ‘अ’ से संकेतित किया गया है।
- source_word: וְ
  choice: और
  rationale: हिब्रानी में प्रत्येक नाम से पहले संयोजक दोहराया गया है। स्वाभाविक आधुनिक हिन्दी सूची-शैली में अल्पविराम और अंतिम नाम से पहले ‘और’ रखा गया है; स्रोत की पुनरावृत्ति पादटिप्पणी में बताई गई है।
