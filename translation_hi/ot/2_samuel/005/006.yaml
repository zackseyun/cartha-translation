base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/006.yaml
  text: And the king and his men went to Jerusalem[a], to the Jebusites, the inhabitants of the land. And they said to David, “You will not come in here, for even the blind and the lame will turn you away,” saying[b], “David will not come in here.”
translation:
  language: hi
  text: राजा और उसके लोग यरूशलेम की ओर, उस देश के निवासी यबूसियों के पास गए। उन्होंने[a] दाऊद से कहा, “तुम यहाँ भीतर नहीं आ पाओगे, क्योंकि अंधे और लँगड़े भी तुम्हें दूर हटा देंगे,”[b] यह कहते हुए, “दाऊद यहाँ भीतर नहीं आ पाएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “उसने कहा” है; यह एकवचन संभवतः यबूसी निवासियों के लिए सामूहिक अर्थ में प्रयुक्त हुआ है।
    reason: textual_variant
  - marker: b
    text: 'इस इब्रानी वाक्यांश का अर्थ कठिन है। सम्भव अर्थ है: “जब तक तुम अंधों और लँगड़ों को हटा न दो।” यहाँ सम्भवतः यबूसी व्यंग्य कर रहे थे कि नगर इतना सुरक्षित है कि अंधे और लँगड़े भी दाऊद को भीतर आने से रोक सकते हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: गए
  rationale: कथात्मक क्रम में क्रिया का सामान्य अर्थ ‘गए’ है; ‘चढ़ाई की’ सैन्य भाव को मूल से अधिक स्पष्ट कर देता।
- source_word: הַמֶּלֶךְ וַאֲנָשָׁיו
  choice: राजा और उसके लोग
  rationale: शाब्दिक अर्थ ‘राजा और उसके पुरुष/लोग’ है। संदर्भ में वे उसके योद्धा हो सकते हैं, पर ‘लोग’ मूल की व्यापकता बनाए रखता है।
- source_word: אֶל הַיְבֻסִי יוֹשֵׁב הָאָרֶץ
  choice: उस देश के निवासी यबूसियों के पास
  rationale: एकवचन जातिवाचक ‘यबूसी’ और एकवचन कृदंत यहाँ सामूहिक अर्थ रखते हैं; हिन्दी में बहुवचन स्वाभाविक है। אֶל का मूल भाव ‘के पास/की ओर’ रखा गया है।
- source_word: וַיֹּאמֶר
  choice: उन्होंने कहा
  rationale: मसोराई पाठ में क्रिया एकवचन है, पर निकटवर्ती सामूहिक कर्ता यबूसी हैं और कथन उन्हीं का है; हिन्दी में निहित सामूहिक अर्थ को बहुवचन से व्यक्त किया गया है, तथा एकवचन रूप पादटिप्पणी में सुरक्षित है।
- source_word: לֹא תָבוֹא הֵנָּה
  choice: तुम यहाँ भीतर नहीं आ पाओगे
  rationale: गढ़वाले नगर के संदर्भ में ‘भीतर आना’ उपयुक्त है। अपूर्ण क्रिया यहाँ निषेध से अधिक चुनौतीपूर्ण असमर्थता/दृढ़ भविष्यवाणी व्यक्त करती है।
- source_word: כִּי אִם הֱסִירְךָ הַעִוְרִים וְהַפִּסְחִים
  choice: अंधे और लँगड़े ही तुम्हें दूर हटा देंगे
  rationale: इब्रानी वाक्यरचना कठिन है। הֱסִירְךָ को ‘तुम्हें हटा देना/दूर कर देना’ समझने पर व्यंग्य का आशय बनता है कि नगर इतना सुरक्षित है कि अंधे और लँगड़े भी दाऊद को रोक देंगे। कठिनाई पादटिप्पणी में बताई गई है।
- source_word: לֵאמֹר לֹא יָבוֹא דָוִד הֵנָּה
  choice: अर्थात्, “दाऊद यहाँ भीतर नहीं आ पाएगा”
  rationale: दूसरा לֵאמֹר पहले व्यंग्य का आशय या पुनर्कथन प्रस्तुत करता है। ‘अर्थात्’ पुनरुक्ति का संबंध स्पष्ट करता है और उद्धृत कथन बनाए रखता है।
theological_decisions:
- issue: अपंगता-सूचक शब्दों का अपमानजनक व्यंग्य में प्रयोग
  choice: ‘अंधे और लँगड़े’ को ऐतिहासिक कथन के ठोस शब्दों के रूप में बनाए रखा गया
  alternative: ‘हमारे सबसे निर्बल लोग’ जैसा अर्थानुवाद
  rationale: यह कथाकार का अपंग व्यक्तियों पर निर्णय नहीं, बल्कि यबूसियों की शत्रुतापूर्ण डींग है। ठोस शब्द हटाने से मूल कथन और अगले पदों से उसका संबंध अस्पष्ट हो जाएगा।
- issue: कठिन इब्रानी खंड में कर्ता और कर्म
  choice: ‘अंधे और लँगड़े’ को दाऊद को दूर हटाने वाला कर्ता समझा गया
  alternative: ‘जब तक तुम अंधों और लँगड़ों को हटा न दो’
  rationale: प्रत्यययुक्त क्रिया को दाऊद के हटाए जाने के अर्थ में पढ़ना संदर्भगत व्यंग्य को स्पष्ट करता है, किंतु इब्रानी की कठिनता और वैकल्पिक समझ पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण कथात्मक शैली रखी गई है। ‘यबूसी’, ‘दाऊद’ और ‘यरूशलेम’ प्रचलित बाइबलीय नामरूप हैं। ‘लँगड़े’ मूल के ठोस अर्थ को बिना व्याख्यात्मक नरमी के व्यक्त करता है; उद्धरण से स्पष्ट है कि यह यबूसियों का व्यंग्य है।
