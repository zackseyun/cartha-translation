source:
  edition: WLC
  text: וַ֠/יִּשְׁלַח חִירָ֨ם מֶֽלֶךְ צֹ֥ר מַלְאָכִים֮ אֶל דָּוִד֒ וַ/עֲצֵ֣י אֲרָזִ֔ים וְ/חָרָשֵׁ֣י עֵ֔ץ וְ/חָֽרָשֵׁ֖י אֶ֣בֶן קִ֑יר וַ/יִּבְנֽוּ בַ֖יִת לְ/דָוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/011.yaml
  text: And Hiram king of Tyre sent messengers to David[a], and cedar logs, and craftsmen of wood, and craftsmen of stone walling[b]; and they built a house for David.
translation:
  language: hi
  text: सोर के राजा हीराम ने दाऊद के पास दूत, देवदार की लकड़ियाँ, लकड़ी के कारीगर और पत्थर की दीवार बनानेवाले कारीगर[a] भेजे। उन्होंने दाऊद के लिए एक भवन[b] बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजमिस्त्री।” इब्रानी पदबंध में “पत्थर” और “दीवार” दोनों शब्द आते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “एक महल।” इब्रानी में शाब्दिक अर्थ “घर” है, जो राजकीय संदर्भ में महल को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: भेजे
  rationale: कथात्मक गद्य में שלח का सामान्य और स्वाभाविक हिन्दी प्रतिरूप; संयुक्त वाक्य में बाद की सामग्रियों और कारीगरों पर भी यही क्रिया लागू होती है।
- source_word: חִירָם מֶלֶךְ צֹר
  choice: सोर के राजा हीराम
  rationale: इब्रानी संबंध-रचना को स्वाभाविक हिन्दी पदक्रम में रखा गया है; צֹר के लिए प्रचलित हिन्दी बाइबलीय रूप ‘सोर’ और חִירָם के लिए ‘हीराम’ लिया गया है।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: यह शब्द सामान्य संदेशवाहकों अथवा राजनयिक प्रतिनिधियों, दोनों के लिए प्रयुक्त हो सकता है; ‘दूत’ उस व्यापकता को बनाए रखता है।
- source_word: וַעֲצֵי אֲרָזִים
  choice: देवदार की लकड़ियाँ
  rationale: शाब्दिक रूप से देवदार के वृक्ष/काष्ठ; निर्माण-संदर्भ में ‘लकड़ियाँ’ ठोस और सहज है, पर तैयार तख्तों जैसी अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: חָרָשֵׁי עֵץ
  choice: लकड़ी के कारीगर
  rationale: חָרָשׁ कुशल शिल्पकार को दर्शाता है; ‘बढ़ई’ की अपेक्षा यह व्यापक है और मूल के निकट रहता है।
- source_word: חָרָשֵׁי אֶבֶן קִיר
  choice: पत्थर की दीवार बनानेवाले कारीगर
  rationale: कठिन इब्रानी पदबंध में ‘पत्थर’ और ‘दीवार’ दोनों स्पष्ट हैं। यह हिन्दी अभिव्यक्ति दोनों घटकों को बचाते हुए काम का अर्थ स्वाभाविक रूप से बताती है।
- source_word: וַיִּבְנוּ
  choice: उन्होंने ... बनाया
  rationale: बहुवचन कर्ता संदर्भ में भेजे गए कारीगर हैं; हिन्दी में स्पष्ट सर्वनाम से नया वाक्य सहज बनता है।
- source_word: בַיִת לְדָוִד
  choice: दाऊद के लिए एक भवन
  rationale: בַיִת का मूल अर्थ घर/भवन है, जबकि राजकीय संदर्भ में महल भी अभिप्रेत हो सकता है। ‘भवन’ मुख्य पाठ में इस अर्थ-क्षेत्र को खुला रखता है और ‘महल’ को टिप्पणी में दिया गया है।
