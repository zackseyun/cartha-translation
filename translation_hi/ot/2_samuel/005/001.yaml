  text: וַ/יָּבֹ֜אוּ כָּל שִׁבְטֵ֧י יִשְׂרָאֵ֛ל אֶל דָּוִ֖ד חֶבְר֑וֹנָ/ה וַ/יֹּאמְר֣וּ לֵ/אמֹ֔ר הִנְ/נ֛וּ עַצְמְ/ךָ֥ וּֽ/בְשָׂרְ/ךָ֖ אֲנָֽחְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/001.yaml
  text: Then all the tribes of Israel came to David at Hebron and said[a], “Look[b], we are your bone and your flesh.”
translation:
  language: hi
  text: तब इस्राएल के सभी गोत्र हेब्रोन[b] में दाऊद के पास आए और बोले, “देखिए, हम आपकी हड्डी और आपका मांस हैं।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आपकी हड्डी और आपका मांस’ निकट संबंध और साझा पारिवारिक पहचान का इब्रानी मुहावरा है।
    reason: cultural_note
  - marker: b
    text: या, ‘हेब्रोन को’; इब्रानी में ‘हेब्रोन’ का रूप दिशासूचक प्रत्यय लिए हुए है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: तब ... आए
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ क्रम को स्वाभाविक हिन्दी में व्यक्त करता है और בוא का सामान्य अर्थ ‘आना’ है।
- source_word: כָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी गोत्र
  rationale: यह सामूहिक राष्ट्रीय अभिव्यक्ति को सीधे और स्पष्ट रूप में रखता है।
- source_word: אֶל דָּוִד חֶבְרוֹנָה
  choice: हेब्रोन में दाऊद के पास
  rationale: אֶל दाऊद की ओर गति बताता है, जबकि स्थान-नाम का दिशासूचक रूप हेब्रोन को गंतव्य बनाता है। हिन्दी में यह क्रम व्यक्ति और स्थान दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: और बोले
  rationale: यह सामान्य इब्रानी वचन-आरंभ सूत्र है; दोनों क्रियाओं को अलग-अलग रखना हिन्दी में अनावश्यक पुनरुक्ति होगा।
- source_word: הִנּוּ
  choice: देखिए
  rationale: यह ध्यान आकर्षित करने वाला बलयुक्त कण है। ‘देखिए’ आधुनिक, आदरसूचक और स्वाभाविक हिन्दी है।
- source_word: עַצְמְךָ וּבְשָׂרְךָ
  choice: आपकी हड्डी और आपका मांस
  rationale: शाब्दिक रूपक और मूल क्रम सुरक्षित रहते हैं; यह निकट रक्त-संबंध तथा साझा पारिवारिक पहचान का मुहावरा है।
- source_word: אֲנָחְנוּ
  choice: हम ... हैं
  rationale: इब्रानी का क्रियारहित वाक्य हिन्दी में स्वाभाविक रूप से योजक क्रिया ‘हैं’ के साथ व्यक्त होता है।
theological_decisions:
- issue: सगोत्रता के सूत्र का राजनीतिक और धर्मवैचारिक बल
  choice: ‘हम आपकी हड्डी और आपका मांस हैं’ के रूप में मूल पारिवारिक रूपक को बनाए रखना
  alternative: ‘हम आपके अपने लोग हैं’ या ‘हम आपके संबंधी हैं’
  rationale: गोत्र दाऊद से साझा रक्त-संबंध और राष्ट्रीय एकता की अपील करते हैं। शाब्दिक रूपक पारिवारिक और राजकीय दोनों बलों को सुरक्षित रखता है, बिना किसी अतिरिक्त व्याख्या को मूल पाठ में मिलाए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्मानसूचक बहुवचन के कारण ‘देखिए’, ‘आपकी/आपका’ का प्रयोग। भाषा सहज किंतु गरिमापूर्ण रखी गई है।
