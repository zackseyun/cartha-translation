lexical_decisions:
- source_word: וַיֵּלֶךְ ... הָלוֹךְ וְגָדוֹל
  choice: निरन्तर बढ़ता और महान होता गया
  rationale: यह इब्रानी रचना सीमित क्रिया और infinitive absolute के मेल से लगातार प्रगति और बढ़ती महानता पर बल देती है। हिंदी में यह वाक्यांश उस क्रमिक, जारी वृद्धि को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: דָּוִד
  choice: दाऊद
  rationale: व्यक्तिनाम का प्रचलित मानक हिंदी रूप।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुराक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित व्यक्तिनाम-रूप से प्रस्तुत किया गया है।
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: सेनाओं का परमेश्वर
  rationale: צְבָאוֹת का मूल अर्थ सेनाएँ या संगठित दल है। यह अनुवाद पद को केवल स्वर्गीय सेनाओं तक सीमित किए बिना उसकी व्यापकता बनाए रखता है।
- source_word: עִמּוֹ
  choice: उसके साथ था
  rationale: यह दाऊद के साथ परमेश्वर की उपस्थिति और सहायता का सीधा, स्वाभाविक हिंदी अनुवाद है।
theological_decisions:
- issue: יהוה दिव्य नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में निजी दिव्य नाम सीधे आया है। हिंदी पाठकों के लिए परिचित 'यहोवा' उस नाम को उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: צְבָאוֹת की दिव्य उपाधि का आशय
  choice: सेनाओं का परमेश्वर
  alternative: सेनाओं का ईश्वर; स्वर्गीय सेनाओं का परमेश्वर
  rationale: मूल शब्द सेनाओं/दलसमूहों को सूचित करता है, पर यह पद स्वयं उन्हें केवल स्वर्गीय नहीं कहता; इसलिए व्यापक अर्थ सुरक्षित रखा गया है।
translation_notes:
