  yaml_path: translation/ot/2_samuel/005/009.yaml
  text: So David lived in the stronghold and called it the City of David[a]. And David built all around from the Millo inward.
translation:
  language: hi
  text: तब दाऊद उस गढ़ में रहने लगा और उसने उसे “दाऊद का नगर” कहा। दाऊद ने मिल्लो[a] से भीतर की ओर चारों तरफ निर्माण किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मिल्लो” संभवतः यरूशलेम में किसी ज्ञात संरचना या सीढ़ीदार भराव का नाम है। अंतिम वाक्यांश का अनुवाद “मिल्लो से और भीतर की ओर” या “मिल्लो से भीतरी भाग की ओर” भी हो सकता है।
    reason: मिल्लो की सटीक पहचान और מִן הַמִּלּוֹא וָבָיְתָה के स्थानिक संबंध में शाब्दिक अनिश्चितता को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: रहने लगा
  rationale: यहाँ ישב का अर्थ जीते हुए गढ़ में निवास स्थापित करना है; ‘रहने लगा’ कथा के क्रम और आरंभिक बसाव, दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בַּמְּצֻדָה
  choice: उस गढ़ में
  rationale: מְצֻדָה एक किलेबंद सुरक्षित स्थान को सूचित करता है। ‘गढ़’ संक्षिप्त, स्वाभाविक और सैन्य-सुरक्षा का भाव रखने वाला शब्द है।
- source_word: וַיִּקְרָא לָהּ
  choice: उसने उसे … कहा
  rationale: קרא + ל यहाँ नामकरण या पदनाम देने को व्यक्त करता है; ‘कहा’ मूल अभिव्यक्ति के निकट है और हिंदी में सहज है।
- source_word: עִיר דָּוִד
  choice: दाऊद का नगर
  rationale: यह स्थान का विशिष्ट नाम है। ‘दाऊद का नगर’ अर्थ को स्पष्ट और प्रचलित बाइबिलीय हिंदी में व्यक्त करता है।
- source_word: וַיִּבֶן
  choice: निर्माण किया
  rationale: בנה का मूल अर्थ ‘बनाना/निर्माण करना’ है। पाठ स्पष्ट रूप से ‘किलेबंदी’ या ‘पुनर्निर्माण’ नहीं कहता, इसलिए अधिक विशिष्ट अर्थ नहीं जोड़ा गया।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: סביב आसपास या घेरे में विस्तार का भाव देता है; ‘चारों ओर’ उसका स्वाभाविक हिंदी रूप है।
- source_word: מִן הַמִּלּוֹא
  choice: मिल्लो से
  rationale: מִלּוֹא यरूशलेम की किसी ज्ञात संरचना, भराव या सीढ़ीदार सहारे का तकनीकी नाम हो सकता है। सटीक पहचान अनिश्चित होने के कारण मुख्य पाठ में इसका लिप्यंतरण रखा गया है।
- source_word: וָבָיְתָה
  choice: भीतर की ओर
  rationale: दिशासूचक रूप का संभावित स्थानिक अर्थ ‘अंदर/भीतरी भाग की ओर’ है। यह अनिश्चित वास्तु-विन्यास को अनावश्यक रूप से निश्चित किए बिना वाक्य का सबसे संभावित अर्थ देता है।
