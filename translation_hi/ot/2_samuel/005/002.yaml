  edition: WLC
  text: גַּם אֶתְמ֣וֹל גַּם שִׁלְשׁ֗וֹם בִּ/הְי֨וֹת שָׁא֥וּל מֶ֨לֶךְ֙ עָלֵ֔י/נוּ אַתָּ֗ה הייתה מוציא ו/ה/מבי אֶת יִשְׂרָאֵ֑ל וַ/יֹּ֨אמֶר יְהוָ֜ה לְ/ךָ֗ אַתָּ֨ה תִרְעֶ֤ה אֶת עַמִּ/י֙ אֶת יִשְׂרָאֵ֔ל וְ/אַתָּ֛ה תִּהְיֶ֥ה לְ/נָגִ֖יד עַל יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/002.yaml
  text: Also previously[a], when Saul was king over us, you were the one who led Israel out and brought them in. And Yahweh said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over Israel.’
translation:
  language: hi
  text: पहले भी[a], जब शाऊल हमारा राजा था, तब आप ही इस्राएल को बाहर ले जाते और वापस लाते थे[b]। और याहवे ने आपसे कहा था, ‘तुम मेरी प्रजा इस्राएल की चरवाही करोगे, और तुम इस्राएल के ऊपर शासक[c] होगे।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “कल भी और परसों भी”; यह पहले के समय के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: “बाहर ले जाना और वापस लाना” लोगों के कामकाज में, विशेषकर युद्ध में, उनका नेतृत्व करने का इब्रानी मुहावरा है।
    reason: idiom_explanation
  - marker: c
    text: या “अगुआ” अथवा “प्रधान”; यहाँ प्रयुक्त इब्रानी शब्द सामान्यतः “राजा” के लिए प्रयुक्त शब्द से भिन्न है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֶתְמוֹל גַּם שִׁלְשׁוֹם
  choice: पहले भी
  rationale: शाब्दिक रूप से ‘कल भी और परसों भी’; प्रसंग में यह पूर्व समय या पहले से चली आ रही स्थिति का मुहावरा है। ‘पहले भी’ स्वाभाविक हिन्दी में इसका कालगत बल बनाए रखता है।
- source_word: בִּהְיוֹת שָׁאוּל מֶלֶךְ עָלֵינוּ
  choice: जब शाऊल हम पर राजा था
  rationale: בְּ के साथ infinitive construct समयसूचक उपवाक्य बनाता है; यह अनुवाद सम्बन्ध को सीधे और स्वाभाविक रूप में व्यक्त करता है।
- source_word: אַתָּה
  choice: आप ही
  rationale: स्वतंत्र सर्वनाम पर बल है। सभा द्वारा दाऊद को संबोधन में आदरसूचक ‘आप’ और निश्चयार्थक ‘ही’ उस बल को व्यक्त करते हैं।
- source_word: מוצא וְהַמֵּבִיא
  choice: इस्राएल को बाहर ले जाते और वापस लाते थे
  rationale: यह जोड़ा नेतृत्व करने, विशेषकर युद्ध में लोगों को ले जाने और लौटा लाने, का मुहावरा है। दृश्यात्मक भाषा को बनाए रखते हुए ‘वापस’ हिन्दी में आशय स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: पाठ में परमेश्वर का विशिष्ट वाचा-नाम है; हिन्दी बाइबलीय परम्परा में प्रचलित रूप ‘यहोवा’ रखा गया है।
- source_word: תִרְעֶה
  choice: चरवाही करोगे
  rationale: क्रिया राजकीय नेतृत्व के लिए चरवाहे का रूपक प्रयोग करती है। इसे ‘शासन’ में समतल करने के बजाय मूल रूपक सुरक्षित रखा गया है।
- source_word: נָגִיד
  choice: शासक
  rationale: यह सामान्य ‘राजा’ शब्द से भिन्न है और नियुक्त अगुए या अधिपति को सूचित करता है। ‘शासक’ आधुनिक हिन्दी में स्पष्ट है और उस भेद को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में टेट्राग्रामटन प्रत्यक्ष रूप से है। ‘यहोवा’ आधुनिक हिन्दी पाठकों के लिए स्थापित और पहचाना हुआ नाम है; इसे उपाधि ‘प्रभु’ से नहीं बदला गया।
- issue: תִרְעֶה में राजकीय चरवाहा-रूपक
  choice: मेरी प्रजा इस्राएल की चरवाही करोगे
  alternative: मेरी प्रजा इस्राएल पर शासन करोगे
  rationale: इब्रानी पाठ चरवाही की भाषा द्वारा परमेश्वर-नियुक्त राजकीय दायित्व व्यक्त करता है। अनुवाद उस धार्मिक और साहित्यिक रूपक को सुरक्षित रखता है।
- issue: נָגִיד और מֶלֶךְ के बीच भेद
  choice: शासक
  alternative: राजा
  rationale: इसी पद में ‘राजा’ के लिए מֶלֶךְ आया है, जबकि दाऊद के लिए परमेश्वर के कथन में נָגִיד है। दोनों को एक ही शब्द से अनूदित न करके मूल का अर्थगत तनाव बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। इस्राएल के पुरनियों द्वारा दाऊद को सीधे संबोधन में ‘आप’ प्रयुक्त है; परमेश्वर के दाऊद से कथन में निकट, एकवचन ‘तुम’ रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में सम्बद्ध शब्द या वाक्यांश के बाद दिए गए हैं।
