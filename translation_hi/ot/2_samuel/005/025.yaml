  yaml_path: translation/ot/2_samuel/005/025.yaml
  text: And David did so[a], just as Yahweh had commanded him[b], and he struck down the Philistines from Geba as far as Gezer.
translation:
  language: hi
  text: दाऊद ने वैसा ही किया, जैसा याहवे ने उसे आज्ञा दी थी। उसने पलिश्तियों को गेबा[a] से लेकर गेजेर के निकट तक[b] पराजित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘गेबा’ है। कुछ अनुवाद पाठांतर या समानांतर वृत्तांत के आधार पर यहाँ दूसरा स्थान-नाम देते हैं।
    reason: textual_variant
  - marker: b
    text: 'शाब्दिक अर्थ: ‘तुम्हारे गेजेर आने तक’; अर्थात गेजेर के पहुँच-मार्ग या उसके आस-पास तक।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ דָּוִד כֵּן
  choice: दाऊद ने वैसा ही किया
  rationale: ‘वैसा ही किया’ पहले दी गई आज्ञा की ओर संकेत करता है और עשה כן के संक्षिप्त इब्रानी मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כַּאֲשֶׁר צִוָּהוּ
  choice: जैसा ... ने उसे आज्ञा दी थी
  rationale: यह दाऊद के कार्य और पहले दी गई आज्ञा के बीच ठीक अनुरूपता दिखाता है; ‘दी थी’ पूर्ववर्ती आज्ञा को स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम का हिन्दी लिप्यंतरण है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וַיַּךְ
  choice: मार गिराया
  rationale: सैनिक प्रसंग में נכה प्रबल और निर्णायक आघात को दर्शाता है। ‘मार गिराया’ इस बल को रखता है, जबकि केवल ‘मारा’ अपेक्षाकृत अस्पष्ट होता।
- source_word: פְּלִשְׁתִּים
  choice: पलिश्तियों
  rationale: इस प्राचीन जाति के लिए प्रचलित हिन्दी नाम।
- source_word: מִגֶּבַע
  choice: गेबा से
  rationale: मसोरेटी पाठ के स्थान-नाम גבע को सीधे दर्शाता है; समानांतर पाठ के आधार पर इसे किसी दूसरे स्थान-नाम में नहीं बदला गया।
- source_word: עַד בֹּאֲךָ גָזֶר
  choice: गेजेर के निकट तक
  rationale: शाब्दिक रूप से ‘तुम्हारे गेजेर आने तक’ वाला मुहावरा गेजेर के पहुँच-क्षेत्र या निकटवर्ती स्थान तक की भौगोलिक सीमा बताता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत इब्रानी नाम को नाम के रूप में बनाए रखा गया है। ‘प्रभु’ एक उपाधि है, जबकि ‘यहोवा’ एक वैकल्पिक पारंपरिक लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी कथा की संक्षिप्तता बनाए रखते हुए वाक्य को हिन्दी में स्पष्टता के लिए दो भागों में बाँटा गया है। फुटनोट-चिह्न उन शब्दों के साथ रखे गए हैं जिनसे उनकी टिप्पणियाँ वास्तव में संबंधित हैं।
