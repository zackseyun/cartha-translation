lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: तब पलिश्ती
  rationale: वाव कथा के अगले घटनाक्रम को जोड़ता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक प्रवाह देता है। פְלִשְׁתִּים के लिए प्रचलित जातिनाम ‘पलिश्ती’ रखा गया है।
- source_word: בָּאוּ
  choice: आए
  rationale: בוא के काल रूप को इस कथात्मक प्रसंग में सरल भूतकाल ‘आए’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַ/יִּנָּטְשׁוּ
  choice: फैल गए
  rationale: यहाँ נטשׁ किसी क्षेत्र में सैनिकों के फैलकर मोर्चा लेने का संकेत देता है। ‘फैल गए’ स्रोत की छवि और उसकी कुछ अस्पष्टता बनाए रखता है; अधिक तकनीकी विकल्प पादटिप्पणी में दिया गया है।
- source_word: בְּ/עֵמֶק
  choice: की घाटी में
  rationale: בְ स्थानसूचक है और עֵמֶק का स्वाभाविक हिन्दी अर्थ ‘घाटी’ है; हिन्दी शब्दक्रम में स्थाननाम के साथ ‘रपाईम की घाटी में’ रखा गया है।
- source_word: רְפָאִים
  choice: रपाईम
  rationale: यहाँ यह स्थाननाम עֵמֶק רְפָאִים का अंग है, इसलिए इसका अनुवाद करने के बजाय देवनागरी में लिप्यंतरण किया गया है।
