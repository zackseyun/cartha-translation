source:
  edition: WLC
  text: וִ֠/יהִי ב/שמע/ך אֶת ק֧וֹל צְעָדָ֛ה בְּ/רָאשֵׁ֥י הַ/בְּכָאִ֖ים אָ֣ז תֶּחֱרָ֑ץ כִּ֣י אָ֗ז יָצָ֤א יְהוָה֙ לְ/פָנֶ֔י/ךָ לְ/הַכּ֖וֹת בְּ/מַחֲנֵ֥ה פְלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/024.yaml
  text: And when you hear the sound of marching in the tops of the balsam trees[a], then act decisively, for then Yahweh has gone out before you to strike down the camp of the Philistines.
translation:
  language: hi
  text: और जब तुम बाका वृक्षों[a] की चोटियों में कदमों की आहट सुनो, तब दृढ़ता से आगे बढ़ना, क्योंकि तब यहोवा पलिश्तियों की छावनी पर प्रहार करने के लिए तुम्हारे आगे निकल गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में एक वृक्ष का नाम है जिसकी ठीक-ठीक जाति अनिश्चित है; इसे बलसाम वृक्ष भी समझा गया है, और पुराने अनुवादों में कभी-कभी शहतूत कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי בְשָׁמְעֲךָ
  choice: और जब तुम ... सुनो
  rationale: वाव + היה और ב के साथ क्रिया-वाचक संज्ञा भविष्य की समयगत परिस्थिति प्रस्तुत करते हैं; आधुनिक हिन्दी में यह रूप स्वाभाविक और स्रोत के निकट है।
- source_word: קוֹל צְעָדָה
  choice: कदमों की आहट
  rationale: קוֹל का अर्थ ध्वनि और צְעָדָה का अर्थ कदम बढ़ाना या कूच करना है। वृक्षों की चोटियों में सुनाई देने वाली ध्वनि के लिए ‘कदमों की आहट’ सहज है और सैन्य संकेत भी बनाए रखती है।
- source_word: בְּרָאשֵׁי הַבְּכָאִים
  choice: बाका वृक्षों की चोटियों में
  rationale: רָאשֵׁי को ‘चोटियों’ और अनिश्चित वृक्ष-नाम הַבְּכָאִים को लिप्यंतरित ‘बाका’ किया गया है, ताकि संदिग्ध वनस्पति-परिचय को किसी निश्चित जाति में न बदला जाए।
- source_word: אָז תֶּחֱרָץ
  choice: तब निर्णायक रूप से आगे बढ़ना
  rationale: חרץ यहाँ तत्पर, दृढ़ और निर्णायक सैन्य कार्रवाई का निर्देश देता है। ‘आगे बढ़ना’ प्रसंगगत गति को और ‘निर्णायक रूप से’ उसकी दृढ़ता को व्यक्त करता है।
- source_word: יָצָא יְהוָה לְפָנֶיךָ
  choice: यहोवा तुम्हारे आगे ... निकल चुका होगा
  rationale: युद्ध में परमेश्वर के दाऊद से आगे निकलने का भाव सुरक्षित है। भविष्य के संकेत के समय तक पूरी हो चुकी क्रिया के लिए हिन्दी का भविष्य पूर्ण रूप उपयुक्त है।
- source_word: לְהַכּוֹת בְּמַחֲנֵה פְלִשְׁתִּים
  choice: पलिश्तियों की छावनी पर प्रहार करने के लिए
  rationale: נכה के युद्ध-संदर्भ को ‘प्रहार करना’ और מַחֲנֶה के मूल अर्थ को ‘छावनी’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: हिब्रू पाठ में वाचा का विशिष्ट नाम है। हिन्दी बाइबलीय परंपरा में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है; ‘याहवे’ अधिक संभावित विद्वत्तापूर्ण उच्चारण है, पर मूल उच्चारण पूर्णतः निश्चित नहीं है।
- issue: יָצָא की कालगत व्याख्या
  choice: निकल चुका होगा
  alternative: निकल गया है
  rationale: वचन दाऊद द्वारा भविष्य में संकेत सुनने की स्थिति बताता है; उस समय तक यहोवा का आगे निकलना आरम्भ/पूर्ण हो चुका होगा। हिन्दी में भविष्य पूर्ण इस सापेक्ष काल को स्पष्ट करता है, बिना दैवी कार्रवाई को केवल रूपक या केवल मानवीय युद्धनीति बनाने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘बाका’ के साथ पादटिप्पणी मूल की वनस्पति-संबंधी अनिश्चितता बचाती है। सैन्य प्रसंग को स्पष्ट रखने के लिए ‘निर्णायक रूप से आगे बढ़ना’ और ‘छावनी पर प्रहार’ चुने गए हैं।
