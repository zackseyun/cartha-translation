  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקַּח֩ דָּוִ֨ד ע֜וֹד פִּֽלַגְשִׁ֤ים וְ/נָשִׁים֙ מִ/יר֣וּשָׁלִַ֔ם אַחֲרֵ֖י בֹּא֣/וֹ מֵ/חֶבְר֑וֹן וַ/יִּוָּ֥לְדּוּ ע֛וֹד לְ/דָוִ֖ד בָּנִ֥ים וּ/בָנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/013.yaml
  text: And David took more concubines and wives in Jerusalem after he came from Hebron[a], and more sons and daughters were born to David.
translation:
  language: hi
  text: और हेब्रोन से आने के बाद दाऊद ने यरूशलेम से[a] और रखैलें और पत्नियाँ ग्रहण कीं, और दाऊद के और बेटे-बेटियाँ पैदा हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरूशलेम में।” इब्रानी में शाब्दिक रूप से “यरूशलेम से” है; प्रसंग में इसका अर्थ “यरूशलेम में” भी समझा जा सकता है।
    reason: शाब्दिक ‘से’ और प्रसंगानुकूल स्थानवाचक ‘में’—दोनों संभावनाओं को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּקַּח
  choice: रख लीं
  rationale: इस प्रसंग में לקח स्त्रियों को पत्नी या रखैल के रूप में ग्रहण करने का बोध देता है। हिंदी में ‘रख लीं’ कथन की सीधाई बनाए रखते हुए दोनों संबंधों के साथ स्वाभाविक है।
- source_word: עוֹד
  choice: और
  rationale: दोनों स्थानों पर यह पहले से विद्यमान संख्या में वृद्धि दर्शाता है; आधुनिक हिंदी में ‘और’ इसका सहज रूप है।
- source_word: פִּלַגְשִׁים
  choice: रखैलें
  rationale: यह पत्नियों से अलग सामाजिक-वैवाहिक श्रेणी है; हिंदी का प्रचलित बाइबलीय शब्द इस भेद को बनाए रखता है।
- source_word: וְנָשִׁים
  choice: पत्नियाँ
  rationale: ‘रखैलों’ के साथ समन्वय और राजपरिवार के प्रसंग में נָשִׁים का अर्थ यहाँ वैवाहिक पत्नियाँ है।
- source_word: מִירוּשָׁלִַם
  choice: यरूशलेम से
  rationale: מן उपसर्ग का सामान्य और औपचारिक अर्थ ‘से’ है। इसे मुख्य पाठ में बनाए रखने से इब्रानी रचना और उसकी संभावित अस्पष्टता सुरक्षित रहती है।
- source_word: אַחֲרֵי בֹּאוֹ מֵחֶבְרוֹן
  choice: हेब्रोन से आने के बाद
  rationale: यह दाऊद के हेब्रोन से आने के बाद की समय-स्थिति को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וַיִּוָּלְדוּ
  choice: पैदा हुए
  rationale: ילד का निफ़अल रूप जन्म लेने का अर्थ देता है; ‘पैदा हुए’ सामान्य आधुनिक हिंदी में स्वाभाविक है।
- source_word: לְדָוִד
  choice: दाऊद के
  rationale: जन्म-सूत्र में לְ संबंध अथवा पितृत्व बताता है; हिंदी में संबंधकारक ‘दाऊद के’ सहज रूप से यही अर्थ देता है।
- source_word: בָּנִים וּבָנוֹת
  choice: बेटे-बेटियाँ
  rationale: मूल पाठ दोनों को अलग-अलग नाम देता है; संयुक्त हिंदी रूप उस विशिष्टता को संक्षेप और स्वाभाविक ढंग से सुरक्षित रखता है।
theological_decisions:
- issue: दाऊद के बहुविवाह का कथात्मक वर्णन
  choice: पद को बिना नैतिक टिप्पणी जोड़े वर्णनात्मक रूप में प्रस्तुत किया गया है।
  alternative: ऐसे शब्द जोड़ना जो दाऊद के आचरण को स्वीकृत या निंदित ठहराएँ।
  rationale: इस पद में इब्रानी पाठ घटना और संतानों के जन्म का वर्णन करता है, पर स्पष्ट नैतिक निर्णय नहीं देता; अनुवाद को अतिरिक्त धार्मिक मूल्यांकन नहीं जोड़ना चाहिए।
- issue: מִירוּשָׁלִַם का स्थान-संबंध
  choice: मुख्य पाठ में ‘यरूशलेम से’ रखा गया है और ‘यरूशलेम में’ को पादटिप्पणी में दिया गया है।
  alternative: मुख्य पाठ में ‘यरूशलेम में’ रखकर מן को स्थानवाचक अर्थ में सहज बनाना।
  rationale: मूल में מן का रूप सचमुच ‘से’ है, लेकिन प्रसंग के आधार पर इसे दाऊद के यरूशलेम में स्त्रियाँ ग्रहण करने के अर्थ में भी समझा जा सकता है। पाठ और पादटिप्पणी दोनों मिलकर इस वास्तविक अस्पष्टता को सुरक्षित रखते हैं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘रखैलें’ और ‘पत्नियाँ’ का भेद सुरक्षित है; ‘बेटे-बेटियाँ’ सामान्य पाठक के लिए सहज है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में संबंधित अस्पष्ट वाक्यांश के बाद दिया गया है।
