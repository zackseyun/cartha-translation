    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹת
  choice: नाम ये हैं
  rationale: यह पदबंध आगे आने वाली नाम-सूची का परिचय देता है। हिन्दी में यह क्रम स्वाभाविक है; आरम्भिक וְ को अलग से ‘और’ कहना आवश्यक नहीं।
- source_word: הַיִּלֹּדִים לוֹ
  choice: दाऊद से जन्मे लोगों
  rationale: निश्चित कर्मवाच्य कृदन्त का शाब्दिक अर्थ ‘जन्मे हुए लोग’ है और לוֹ parentage दर्शाता है। सन्दर्भ से सर्वनाम का आशय दाऊद है, इसलिए हिन्दी में नाम स्पष्ट किया गया है; ‘पुत्र’ कहने से मूल रूप की अपेक्षा अधिक विशिष्टता आ जाती।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: यह जन्म-स्थान बताने वाला सीधा स्थानवाचक पदबंध है।
- source_word: שַׁמּוּעַ
  choice: शम्मूआ
  rationale: इब्रानी नाम का देवनागरी में निकट लिप्यन्तरण।
- source_word: שׁוֹבָב
  choice: शोबाब
  rationale: इब्रानी नाम का देवनागरी में निकट लिप्यन्तरण।
- source_word: נָתָן
  choice: नातान
  rationale: इब्रानी उच्चारण के निकट और हिन्दी में सुबोध लिप्यन्तरण।
- source_word: שְׁלֹמֹה
  choice: सुलैमान
  rationale: इस इब्रानी नाम का हिन्दी बाइबल-परम्परा में व्यापक रूप से पहचाना जाने वाला स्थापित रूप।
theological_decisions:
- issue: הַיִּלֹּדִים का दायरा
  choice: जन्मे लोगों
  alternative: जन्मे पुत्रों / जन्मे बच्चों
  rationale: व्याकरणिक रूप स्वयं ‘जन्मे हुए’ कहता है; यद्यपि सन्दर्भ पुरुष नामों की सूची है, अनुवाद में ‘पुत्र’ जोड़कर मूल की अभिव्यक्ति को अनावश्यक रूप से अधिक विशिष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। वाक्य में ‘दाऊद’ स्पष्ट करने से अकेले पढ़े जाने पर पद सुबोध रहता है। नामों में जहाँ उपयुक्त है वहाँ इब्रानी-निकट लिप्यन्तरण रखा गया है, जबकि सुलैमान का प्रचलित हिन्दी रूप अपनाया गया है।
