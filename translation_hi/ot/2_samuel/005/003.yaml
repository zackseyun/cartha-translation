base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/003.yaml
  text: So all the elders of Israel came to the king at Hebron[a], and King David made a covenant with them at Hebron before Yahweh[b], and they anointed David king over Israel.
translation:
  language: hi
  text: तब इस्राएल के सभी पुरनिए हेब्रोन में राजा के पास आए, और राजा दाऊद ने हेब्रोन में याहवे के सामने उनके साथ वाचा बाँधी[a]; फिर उन्होंने दाऊद का इस्राएल पर राजा के रूप में अभिषेक किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘वाचा काटी’; यह वाचा बाँधने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: आए
  rationale: क़ाल कथात्मक क्रिया בוא यहाँ गंतव्य की ओर आने को व्यक्त करती है; ‘आए’ स्वाभाविक हिन्दी है।
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी पुरनिये
  rationale: ‘सभी’ כָּל की व्यापकता और ‘पुरनिये’ זִקְנֵי के सामुदायिक नेतृत्व-संबंधी अर्थ को बनाए रखता है।
- source_word: אֶל הַמֶּלֶךְ חֶבְרוֹנָה
  choice: हेब्रोन में राजा के पास
  rationale: חֶבְרוֹנָה का दिशासूचक रूप हेब्रोन की ओर गति बताता है; हिन्दी में यह पदबंध स्पष्ट करता है कि वे हेब्रोन में स्थित राजा के पास आए।
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: वाचा बाँधी
  rationale: इब्रानी का शाब्दिक मुहावरा ‘वाचा काटना’ है; ‘वाचा बाँधना’ हिन्दी में गंभीर और स्वाभाविक covenantal अभिव्यक्ति है।
- source_word: לָהֶם
  choice: उनके साथ
  rationale: כרת ברית के प्रसंग में संबंधपरक अर्थ है कि दाऊद ने उन अगुओं के साथ वाचा बाँधी।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: यह औपचारिक वाचा याहवे की उपस्थिति में स्थापित होने का भाव रखता है और לִפְנֵי का सीधा अर्थ सुरक्षित करता है।
- source_word: וַיִּמְשְׁחוּ
  choice: उन्होंने ... अभिषेक किया
  rationale: राजकीय संदर्भ में משׁח तेल से अभिषेक द्वारा राजा नियुक्त किए जाने की विधि को सूचित करता है।
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: उसे इस्राएल का राजा ठहराया
  rationale: यह हिन्दी में नियुक्ति और इस्राएल पर राजकीय अधिकार दोनों को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַמֶּלֶךְ דָּוִד
  choice: राजा दाऊद
  rationale: इब्रानी के उपाधि-नाम संबंध को हिन्दी की प्रचलित संरचना में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत वाचा-नाम को उपाधि में बदलने के बजाय उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण रखा गया है।
- issue: בְּרִית की वाचागत भाषा
  choice: वाचा
  alternative: संधि; समझौता
  rationale: ‘वाचा’ इस राजकीय कार्य की धार्मिक, औपचारिक और पारस्परिक गंभीरता को सुरक्षित रखती है; ‘समझौता’ इसका भार घटा देता।
- issue: अभिषेक और राजकीय नियुक्ति का संबंध
  choice: अभिषेक करके उसे ... राजा ठहराया
  alternative: राजा के रूप में उसका अभिषेक किया
  rationale: यह משׁח की विधिक क्रिया और לְמֶלֶךְ के नियुक्ति-संबंधी परिणाम दोनों को व्यक्त करता है, बिना अभिषेक को केवल प्रतीकात्मक या केवल धार्मिक क्रिया मानकर तनाव मिटाए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक रूप अपनाया गया है। ‘पुरनिये’, ‘वाचा’ और ‘अभिषेक’ जैसे परिचित बाइबलीय शब्द मूल पाठ के सामाजिक और धर्मवैचारिक भार को बनाए रखते हैं; वाक्य-संरचना सामान्य पाठक के लिए सरल रखी गई है।
