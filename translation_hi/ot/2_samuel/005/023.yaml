base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/023.yaml
  text: So David inquired of Yahweh[a], and he said, “You shall not go up; circle around behind them, and come against them opposite the balsam trees.”
translation:
  language: hi
  text: तब दाऊद ने यहोवा से पूछा, और उसने कहा, “ऊपर मत चढ़। घूमकर उनके पीछे जा और बाल्सम के पेड़ों[a] के सामने से उन पर चढ़ आ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बका के पेड़”; परंपरागत अनुवाद “शहतूत के पेड़।” इस इब्रानी शब्द से अभिप्रेत पेड़ की ठीक-ठीक प्रजाति निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: यहोवा से पूछा
  rationale: यहाँ שׁאל के साथ בַּיהוָה का अर्थ युद्ध के विषय में परमेश्वर से मार्गदर्शन माँगना है। हिंदी में ‘यहोवा से पूछा’ स्वाभाविक है और प्रसंग परामर्श का भाव स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम है; उसे सामान्य उपाधि से बदलने के बजाय प्रचलित हिंदी रूप ‘यहोवा’ रखा गया है।
- source_word: לֹא תַעֲלֶה
  choice: ऊपर मत चढ़
  rationale: עלה का मूल स्थानिक अर्थ सुरक्षित रखा गया है; सैन्य प्रसंग से आगे बढ़ने या चढ़ाई करने का आशय स्वतः स्पष्ट होता है। निषेध को स्वाभाविक हिंदी आज्ञा के रूप में व्यक्त किया गया है।
- source_word: הָסֵב אֶל אַחֲרֵיהֶם
  choice: घूमकर उनके पीछे जा
  rationale: यह शत्रु के पिछले भाग की ओर चक्कर लगाकर जाने की सामरिक चाल बताता है।
- source_word: וּבָאתָ לָהֶם
  choice: उन पर आक्रमण कर
  rationale: सैन्य प्रसंग में בוא + ל विरोधी के विरुद्ध बढ़ने का अर्थ देता है; ‘आक्रमण कर’ हिंदी में अपेक्षित आशय स्पष्ट करता है।
- source_word: מִמּוּל
  choice: के सामने से
  rationale: यह किसी स्थान या वस्तु के ठीक सामने अथवा सम्मुख होने का स्थानिक भाव व्यक्त करता है।
- source_word: בְּכָאִים
  choice: बलसान के पेड़
  rationale: यह पेड़ की एक अनिश्चित प्रजाति का नाम है। ‘बलसान’ एक संभावित पहचान है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में विशिष्ट नाम יהוה है। हिंदी पाठकों के बीच पहचाने जाने वाले नामरूप ‘यहोवा’ से इसे प्रस्तुत किया गया है, न कि सामान्य उपाधि ‘प्रभु’ से।
- issue: וַיֹּאמֶר में वक्ता की पहचान
  choice: ‘उसने कहा’ द्वारा व्याकरणिक सर्वनाम बनाए रखना
  alternative: ‘यहोवा ने कहा’
  rationale: हिब्रू में केवल पुल्लिंग एकवचन सर्वनाम निहित है। प्रसंग में वक्ता यहोवा है, पर नाम दोहराए बिना मूल की अभिव्यक्ति और उसकी संरचना सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रत्यक्ष वाणी में संक्षिप्त आज्ञार्थक शैली मूल की सामरिक तत्परता को बनाए रखती है। पादटिप्पणी का चिह्न उसी संदिग्ध वनस्पति-नाम के बाद रखा गया है जिससे वह संबंधित है।
