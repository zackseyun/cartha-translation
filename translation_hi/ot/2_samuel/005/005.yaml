translation:
  language: hi
  text: हेब्रोन में उसने यहूदा पर सात वर्ष और छह महीने तक राज्य किया, और यरूशलेम में उसने समस्त इस्राएल और यहूदा पर तैंतीस वर्ष तक राज्य किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּחֶבְרוֹן
  choice: हेब्रोन में
  rationale: בְּ स्थान सूचित करता है; नगर के भीतर शासन-स्थान के लिए आधुनिक हिन्दी में ‘हेब्रोन में’ स्वाभाविक है।
- source_word: מָלַךְ
  choice: उसने ... राज्य किया
  rationale: यहाँ क्रिया किसी एक क्षण में राजा बनने की नहीं, बल्कि शासन की अवधि का सार प्रस्तुत करती है।
- source_word: עַל יְהוּדָה
  choice: यहूदा पर
  rationale: מָלַךְ के साथ עַל उस जनसमुदाय या राज्य को बताता है जिस पर शासन किया गया।
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: सात वर्ष और छः महीने
  rationale: मूल पाठ की अवधि और क्रम को स्पष्ट, स्वाभाविक हिन्दी में ज्यों का त्यों रखा गया है।
- source_word: וּבִירוּשָׁלַם
  choice: और यरूशलेम में
  rationale: संयोजक और स्थानवाचक पूर्वसर्ग शासन के दूसरे स्थान का परिचय देते हैं।
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנָה
  choice: तैंतीस वर्ष
  rationale: इब्रानी संख्या-रचना को मानक आधुनिक हिन्दी संख्या-रूप में व्यक्त किया गया है।
- source_word: עַל כָּל יִשְׂרָאֵל וִיהוּדָה
  choice: समस्त इस्राएल और यहूदा पर
  rationale: ‘इस्राएल और यहूदा’ दोनों को बनाए रखने से संयुक्त राज्य की व्यापकता और उसके भीतर की राजनीतिक पहचानें मूल पाठ के अनुसार बनी रहती हैं। כָּל के लिए ‘समस्त’ पूर्ण दायरे को स्पष्ट करता है।
