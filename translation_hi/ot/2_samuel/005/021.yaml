  yaml_path: translation/ot/2_samuel/005/021.yaml
  text: And they left their idols there[b][a], and David and his men carried them away.
translation:
  language: hi
  text: वे अपनी मूर्तियाँ वहीं छोड़ गए[a], और दाऊद और उसके लोग उन्हें उठाकर ले गए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी प्रतिमाएँ।” इब्रानी शब्द उपासना में प्रयुक्त प्रतिमाओं के लिए है।
    reason: lexical_alternative
  - marker: b
    text: 1 इतिहास 14:12 आगे बताता है कि दाऊद ने आज्ञा दी और उन मूर्तियों को जला दिया गया। यहाँ शमूएल का इब्रानी पाठ केवल कहता है कि दाऊद और उसके लोग उन्हें उठाकर ले गए।
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: छोड़ गए
  rationale: עזב का यहाँ स्वाभाविक अर्थ पीछे छोड़ जाना है; पलायन के प्रसंग में यह सरल और सटीक है।
- source_word: שָׁם
  choice: वहीं
  rationale: स्थानवाचक क्रियाविशेषण को स्वाभाविक हिन्दी में व्यक्त करता है और पिछले प्रसंग के स्थान की ओर संकेत बनाए रखता है।
- source_word: עֲצַבֵּיהֶם
  choice: अपनी मूर्तियाँ
  rationale: यह शब्द धार्मिक उपासना में प्रयुक्त प्रतिमाओं को सूचित करता है। ‘मूर्तियाँ’ आधुनिक हिन्दी में स्वाभाविक है, जबकि ‘प्रतिमाएँ’ भी सम्भव है।
- source_word: וַיִּשָּׂאֵם
  choice: उन्हें उठाकर ले गए
  rationale: נשא में उठाने, ढोने अथवा ले जाने का अर्थ है। यह रूप भौतिक क्रिया और कर्म-प्रत्यय दोनों को स्पष्ट रखता है, पर उसके उद्देश्य का अनुमान नहीं लगाता।
- source_word: דָּוִד וַאֲנָשָׁיו
  choice: दाऊद और उसके लोग
  rationale: शाब्दिक अर्थ ‘दाऊद और उसके जन/पुरुष’ है। सैन्य प्रसंग में ‘उसके लोग’ सहज हिन्दी है और ‘सैनिक’ कहकर अनावश्यक विशिष्टीकरण नहीं करता।
theological_decisions:
- issue: 1 इतिहास 14:12 के समानांतर वृत्तांत में मूर्तियों को जलाए जाने का उल्लेख
  choice: 2 शमूएल के मसोराई पाठ के अनुसार ‘उठाकर ले गए’ अनुवाद करना
  alternative: इसी पद में सामंजस्य बैठाकर यह कहना कि मूर्तियाँ जला दी गईं
  rationale: इस पद का इब्रानी पाठ केवल बताता है कि दाऊद और उसके लोग उन्हें उठा ले गए। जलाने की अतिरिक्त सूचना समानांतर वृत्तांत में है; उसे मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में रखना मूल-पाठ की प्राथमिकता और दोनों वृत्तांतों के बीच के तनाव को सुरक्षित रखता है।
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण मानक हिन्दी। वाक्य की संक्षिप्त कथात्मक गति बनाए रखी गई है। ‘उठाकर ले गए’ मूल क्रिया की व्यापकता को स्वाभाविक हिन्दी में व्यक्त करता है; समानांतर वृत्तांत की अतिरिक्त सूचना को मुख्य पाठ में नहीं मिलाया गया।
