source:
  edition: WLC
  text: וַ/יֵּ֣דַע דָּוִ֔ד כִּֽי הֱכִינ֧/וֹ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וְ/כִי֙ נִשֵּׂ֣א מַמְלַכְתּ֔/וֹ בַּ/עֲב֖וּר עַמּ֥/וֹ יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/012.yaml
  text: And David knew that Yahweh had established him as king over Israel[a], and that he had exalted his kingdom for the sake of his people Israel.
translation:
  language: hi
  text: दाऊद ने जान लिया कि यहोवा ने उसे इस्राएल पर राजा के रूप में स्थापित किया था और अपनी प्रजा इस्राएल के लिए उसके राज्य को ऊँचा उठाया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी प्रजा इस्राएल के लिए,” यदि “उसकी” का संकेत यहोवा के बजाय दाऊद की ओर माना जाए।
    reason: עַמּוֹ में सर्वनाम के पूर्वपद की वास्तविक व्याकरणिक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיֵּדַע
  choice: तब दाऊद जान गया
  rationale: ידע यहाँ किसी तथ्य को समझ लेने या पहचान लेने को व्यक्त करता है। ‘जान गया’ सीधा, स्वाभाविक और कथात्मक संदर्भ के अनुकूल है।
- source_word: הֱכִינוֹ
  choice: उसे ... दृढ़ता से स्थापित किया है
  rationale: כון के हिफ़ील रूप में स्थिर करने, दृढ़ करने और स्थापित करने का भाव है। राजकीय संदर्भ में यह दाऊद के राजा होने की ईश्वरीय पुष्टि और स्थिरता दोनों व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: इस्राएल का राजा बनाकर
  rationale: לְמֶלֶךְ पद या भूमिका और עַל शासनाधिकार दर्शाता है। हिन्दी में ‘इस्राएल का राजा बनाकर ... स्थापित किया’ दोनों भावों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נִשֵּׂא
  choice: ऊँचा उठाया है
  rationale: נשׂא का यह रूप उन्नत या महान किए जाने का भाव देता है। ‘ऊँचा उठाया’ मूल बिंब को बनाए रखते हुए सहज हिन्दी है।
- source_word: מַמְלַכְתּוֹ
  choice: उसके राज्य को
  rationale: ממלכה राज्य, राजसत्ता या शासन को दर्शा सकता है। ‘राज्य’ व्यापक और इस संदर्भ में सर्वाधिक सीधा विकल्प है; सर्वनाम का स्वाभाविक निकटतम संदर्भ दाऊद है।
- source_word: בַּעֲבוּר
  choice: के लिए
  rationale: यहाँ वाक्यांश प्रयोजन अथवा हित का भाव देता है। आधुनिक हिन्दी में ‘के लिए’ संक्षिप्त और स्वाभाविक है।
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल
  rationale: मुख्य पाठ में प्रत्यय को यहोवा से संबंधित माना गया है, क्योंकि वही स्थापित करने और ऊँचा उठाने वाला कर्ता है तथा इस्राएल को परमेश्वर की प्रजा कहना सामान्य बाइबलीय प्रयोग है। ‘प्रजा’ राजकीय संदर्भ में עם के सामूहिक अर्थ को स्पष्ट करता है।
theological_decisions:
- issue: עַמּוֹ (‘उसकी/अपनी प्रजा’) में प्रत्यय का पूर्वपद
  choice: 'प्रत्यय यहोवा की ओर संकेत करता है: ‘अपनी प्रजा इस्राएल के लिए।’'
  alternative: 'प्रत्यय दाऊद की ओर संकेत कर सकता है: ‘उसकी प्रजा इस्राएल के लिए,’ अर्थात दाऊद की प्रजा।'
  rationale: 'वाक्य में ईश्वरीय कार्य पर बल है: यहोवा दाऊद को स्थापित करता और उसके राज्य को ऊँचा उठाता है। इसलिए इस्राएल को यहोवा की प्रजा समझना अधिक संभावित है, पर इब्रानी पुल्लिंग एकवचन प्रत्यय दाऊद की ओर भी संकेत कर सकता है; इस वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।'
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘दृढ़ता से स्थापित’ मूल क्रिया के स्थिरता-भाव को व्यक्त करता है और ‘ऊँचा उठाया’ इब्रानी बिंब को बनाए रखता है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में स्पष्ट रूप से दिया गया है।
