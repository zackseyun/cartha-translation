    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: पर अधिकार कर लिया
  rationale: לכד किसी स्थान को युद्ध में पकड़ लेने या अपने अधिकार में कर लेने को दर्शाता है। यह प्रयोग आधुनिक हिन्दी में स्वाभाविक है और सैनिक संदर्भ को स्पष्ट रखता है।
- source_word: וַ
  choice: परन्तु
  rationale: यह संयोजक पिछले पद में यबूसियों के आत्मविश्वास के विपरीत दाऊद की सफलता को सामने लाता है; इसलिए केवल ‘और’ की अपेक्षा ‘परन्तु’ प्रसंगगत विरोध को बेहतर व्यक्त करता है।
- source_word: מְצֻדַת
  choice: गढ़
  rationale: מצודה सुरक्षित और किलेबन्द मजबूत स्थान को दर्शाता है। ‘गढ़’ संक्षिप्त, सहज और सैनिक अर्थ वाला आधुनिक हिन्दी शब्द है; ‘दुर्ग’ भी सम्भव है।
- source_word: צִיּוֹן
  choice: सिय्योन
  rationale: स्थानवाचक नाम को हिन्दी बाइबलीय परम्परा में पहचाने जाने वाले लिप्यन्तरण के अनुसार रखा गया है।
- source_word: הִיא
  choice: वही
  rationale: स्वतंत्र सर्वनाम पहले पदबंध को ‘दाऊद का नगर’ के रूप में पहचानता है। ‘वही’ इस समानाधिकरण और पहचान को सहज हिन्दी में व्यक्त करता है।
- source_word: עִיר דָּוִד
  choice: दाऊद का नगर
  rationale: यह סמיכות रचना दाऊद से सम्बद्ध नगर का नाम-सदृश पद है। ‘दाऊद का नगर’ सम्बन्ध को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
