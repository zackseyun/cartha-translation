lexical_decisions:
- source_word: וַיֹּסִפוּ עוֹד ... לַעֲלוֹת
  choice: फिर चढ़ आए
  rationale: יסף के साथ עוֹד और לעלות पिछली सैन्य चढ़ाई की पुनरावृत्ति व्यक्त करते हैं। ‘फिर चढ़ आए’ स्वाभाविक हिन्दी में पुनरावृत्ति और ऊपर की ओर सैन्य बढ़त—दोनों को बनाए रखता है।
- source_word: פְּלִשְׁתִּים
  choice: पलिश्ती
  rationale: इस जाति-नाम का प्रचलित हिन्दी रूप।
- source_word: וַיִּנָּטְשׁוּ
  choice: फैल गए
  rationale: सैन्य प्रसंग में क्रिया का आशय घाटी में विस्तृत क्षेत्र पर मोर्चा लेना या तैनात होना है; ‘फैल गए’ सरल और स्वाभाविक है, जबकि संभावित सैन्य अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בְּעֵמֶק רְפָאִים
  choice: रपाईम की घाटी में
  rationale: עֵמֶק को ‘घाटी’ और स्थान-नाम רְפָאִים को लिप्यंतरित ‘रपाईम’ किया गया है।
