  text: וַ/יֹּ֨אמֶר דָּוִ֜ד בַּ/יּ֣וֹם הַ/ה֗וּא כָּל מַכֵּ֤ה יְבֻסִי֙ וְ/יִגַּ֣ע בַּ/צִּנּ֔וֹר וְ/אֶת הַ/פִּסְחִים֙ וְ/אֶת הַ֣/עִוְרִ֔ים שנאו נֶ֣פֶשׁ דָּוִ֑ד עַל כֵּן֙ יֹֽאמְר֔וּ עִוֵּ֣ר וּ/פִסֵּ֔חַ לֹ֥א יָב֖וֹא אֶל הַ/בָּֽיִת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/008.yaml
  text: And David said on that day[a], “Whoever strikes the Jebusites and reaches the water shaft, and the lame and the blind, whom David’s soul hates.” Therefore they say[c][b], “The blind and the lame shall not come into the house.”
translation:
  language: hi
  text: उस दिन दाऊद ने कहा, “जो कोई यबूसियों को मारे और पानी की सुरंग[a] तक पहुँचे—और उन लँगड़ों और अंधों को, जिनसे दाऊद का मन घृणा करता है।”[b] इसी कारण लोग कहते हैं, “अंधा और लँगड़ा उस घर[c] में प्रवेश न करेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जल-मार्ग,” “नाली,” अथवा “सुरंग”; इब्रानी शब्द संभवतः किसी जल-व्यवस्था या जल-शाफ़्ट को बताता है, पर उसका ठीक अर्थ अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: इस उपवाक्य का इब्रानी वाक्य-विन्यास कठिन है। कुछ लोग “लँगड़ों और अंधों” को पिछले पद में यबूसियों द्वारा किए गए ताने का भाग समझते हैं, न कि दाऊद की चुनौती का सीधा कर्म।
    reason: alternative_reading
  - marker: c
    text: या “राजमहल” या “राजकीय निवास”; इस प्रसंग में “घर” राजकीय निवास को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַכֵּה יְבֻסִי
  choice: जो कोई यबूसियों को मारे
  rationale: כָּל के साथ कृदंत यहाँ अनिश्चित चुनौती-सूचक प्रयोग है। יְבֻסִי रूप में एकवचन होते हुए भी जातिवाचक है, इसलिए हिन्दी में बहुवचन ‘यबूसियों’ स्वाभाविक है।
- source_word: וְיִגַּע
  choice: और ... तक पहुँचे
  rationale: נגע का मूल अर्थ ‘छूना/पहुँचना’ है। सैनिक और स्थलाकृतिक संदर्भ में ‘तक पहुँचे’ स्वाभाविक है और अनावश्यक रूप से ‘वार करे’ का अर्थ नहीं जोड़ता।
- source_word: בַּצִּנּוֹר
  choice: पानी की सुरंग
  rationale: צִנּוֹר का सटीक अर्थ अनिश्चित है, पर यहाँ संभवतः नगर की जल-व्यवस्था से संबंधित मार्ग या शाफ़्ट अभिप्रेत है। ‘पानी की सुरंग’ सामान्य पाठक के लिए स्पष्ट है; विकल्प पाद-टिप्पणी में दिए गए हैं।
- source_word: וְאֶת הַפִּסְחִים וְאֶת הַעִוְרִים
  choice: और उन लँगड़ों और अंधों को भी
  rationale: विशेषण यहाँ संज्ञा के रूप में बहुवचन हैं। ‘भी’ हिन्दी में संक्षिप्त वाक्य-संरचना को पठनीय बनाता है, जबकि अगले पद का संबंध जानबूझकर पूरी तरह स्पष्ट नहीं किया गया।
- source_word: שנאו נֶפֶשׁ דָּוִד
  choice: जिनसे दाऊद का मन घृणा करता है
  rationale: इब्रानी मुहावरे में दाऊद के ‘प्राण/मन’ द्वारा घृणा करने की बात है। ‘दाऊद का मन’ इस तीव्रता को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: עַל כֵּן יֹאמְרוּ
  choice: इसी कारण लोग कहते हैं
  rationale: यह किसी प्रचलित उक्ति का परिचय देता है। इब्रानी में कर्ता अनिश्चित है; हिन्दी का ‘लोग कहते हैं’ उसी अर्थ को सहज रूप में व्यक्त करता है।
- source_word: עִוֵּר וּפִסֵּחַ
  choice: अंधा और लँगड़ा
  rationale: इब्रानी में दोनों एकवचन रूप हैं और कहावत में सामान्य वर्गों का प्रतिनिधित्व करते हैं; हिन्दी में एकवचन जातिवाचक रूप स्वाभाविक और स्रोत के निकट है।
- source_word: לֹא יָבֹא אֶל הַבָּיִת
  choice: उस भवन में प्रवेश न करेगा
  rationale: בַּיִת का अर्थ सामान्य ‘घर’ या प्रसंग में राजकीय निवास हो सकता है। ‘भवन’ दोनों संभावनाओं को खुला रखता है, और ‘प्रवेश न करेगा’ निषेध को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘लँगड़ों और अंधों’ के प्रति दाऊद की घृणा का आशय
  choice: मसोराई पाठ की कठिन अभिव्यक्ति को बनाए रखा गया और दाऊद की घृणा को नरम नहीं किया गया।
  alternative: इसे पिछले पद में यबूसियों के ताने का ही भाग मानना, या ऐसा भावानुवाद करना जिससे घृणा दाऊद की न लगे।
  rationale: इब्रानी वाक्य-विन्यास संक्षिप्त और विवादित है। पाठ को किसी व्यापक धार्मिक विधान—विशेषतः विकलांग व्यक्तियों के मंदिर-प्रवेश—में बदले बिना उसकी वास्तविक असुविधा और तनाव को सुरक्षित रखना उचित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पानी की सुरंग’ तकनीकी अनिश्चितता के बावजूद सहज है; कठिन इब्रानी वाक्य-विन्यास को डैश और पाद-टिप्पणी से सँभाला गया है, बिना उसे किसी एक व्याख्या में पूरी तरह बाँधे।
