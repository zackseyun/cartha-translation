lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: वह तीस वर्ष का था
  rationale: शाब्दिक रूप से ‘तीस वर्ष का पुत्र’ एक इब्रानी मुहावरा है, जिसका स्वाभाविक हिन्दी अर्थ आयु बताना है।
- source_word: בְּמָלְכוֹ
  choice: जब दाऊद राजा बना
  rationale: בְּ के साथ מלך का क्रियार्थक संज्ञा-रूप और प्रत्यय यहाँ राजत्व ग्रहण करने के समय को व्यक्त करता है; यह हिन्दी में स्वाभाविक और मूल की कालगत व्यापकता के अनुरूप है।
- source_word: מָלָךְ
  choice: उसने ... राज्य किया
  rationale: क्रिया מלך राजकीय शासन करने या राज्य करने को दर्शाती है।
- source_word: אַרְבָּעִים שָׁנָה
  choice: चालीस वर्ष तक
  rationale: संख्या और कालवाचक संज्ञा दाऊद के शासन की अवधि बताते हैं; ‘तक’ हिन्दी में अवधि को स्पष्ट और स्वाभाविक बनाता है।
- source_word: דָּוִד
  choice: दाऊद
  rationale: व्यक्तिनाम का प्रचलित मानक हिन्दी बाइबलीय रूप रखा गया है।
