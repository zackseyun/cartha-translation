base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/020.yaml
  text: So David came to Baal-perazim[a], and there David struck them down. He said[b], “Yahweh has broken through my enemies before me like a breakthrough of waters.” Therefore he called the name of that place Baal-perazim.
translation:
  language: hi
  text: तब दावीद बाल-परासीम[a] पहुँचा, और वहाँ दावीद ने उन्हें मार गिराया। दावीद ने कहा, “याहवे मेरे आगे मेरे शत्रुओं पर ऐसे फूट पड़ा है, जैसे पानी की धारा फूट निकलती है।”[b] इसलिए उसने उस स्थान का नाम बाल-परासीम रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बाल-परासीम” नाम का अर्थ लगभग “फूट पड़ने का स्वामी” या “फूट पड़ने का स्थान” है। यह दावीद के कथन में याहवे के “फूट पड़ने” के साथ शब्द-क्रीड़ा करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जैसे बाढ़ का पानी बाँध तोड़कर फूट निकलता है।” इब्रानी में “फूट पड़ा,” पानी के “फूट निकलने,” और “बाल-परासीम” नाम के बीच शब्द-क्रीड़ा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַעַל פְּרָצִים / בַּעַל פְּרָצִים
  choice: बाल-परासीम
  rationale: यह स्थान का नाम है, इसलिए इसका लिप्यंतरण किया गया है। टिप्पणी में इसके अर्थ और פָּרַץ/פֶּרֶץ के साथ शब्द-क्रीड़ा को स्पष्ट किया गया है।
- source_word: וַיַּכֵּם
  choice: उसने उन्हें मार गिराया
  rationale: נכה का युद्ध-संदर्भ में अर्थ प्रहार करके गिराना या मार गिराना है; यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक रहते हुए क्रिया की युद्ध-संबंधी तीव्रता बनाए रखती है।
- source_word: פָּרַץ
  choice: फूट पड़ा है
  rationale: इस क्रिया में टूटकर या वेग से आगे निकलने का भाव है। ‘फूट पड़ा’ पानी की उपमा के साथ स्वाभाविक है और स्थान-नाम के अर्थ से जुड़ी शब्द-क्रीड़ा को यथासंभव बनाए रखता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का हिन्दी लिप्यंतरण किया गया है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֹיְבַי
  choice: मेरे शत्रुओं
  rationale: संज्ञा और प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय का सीधा और स्वाभाविक अनुवाद।
- source_word: לְפָנַי
  choice: मेरे आगे
  rationale: सैन्य संदर्भ में यह दावीद के आगे परमेश्वर की अग्रसर कार्रवाई को व्यक्त करता है और इब्रानी वाक्यांश की स्थानगत अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
- source_word: כְּפֶרֶץ מָיִם
  choice: जैसे पानी फूट पड़ता है
  rationale: यह सहज आधुनिक हिन्दी है और פָּרַץ तथा פֶּרֶץ की ध्वन्यर्थक पुनरावृत्ति को ‘फूट’ के माध्यम से सुरक्षित रखती है।
- source_word: קָרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: उस स्थान का नाम ... रखा
  rationale: इब्रानी नामकरण-वाक्य का अर्थ हिन्दी की स्वाभाविक और गरिमापूर्ण अभिव्यक्ति में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे उपस्थित है। ‘यहवे’ उसका लिप्यंतरण है और नाम को किसी उपाधि में बदलने से बचाता है।
- issue: दावीद की विजय में कर्ता का संबंध
  choice: यहवे को वह कर्ता रखा गया जो शत्रुओं पर फूट पड़ा
  alternative: दावीद को विजेता बताकर केवल सहायता का भाव देना
  rationale: दावीद पहले स्वयं उन्हें मार गिराता है, फिर विजय को यहवे की कार्रवाई बताता है। अनुवाद इस कथात्मक और धर्मवैचारिक तनाव को बिना समतल किए बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। युद्ध की तीव्रता के लिए ‘मार गिराया’ और मूल शब्द-क्रीड़ा के लिए ‘फूट पड़ा’ रखा गया है। स्थान-नाम का अनुवाद मुख्य पाठ में न करके टिप्पणी में उसका अर्थ समझाया गया है।
