base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/019.yaml
  text: And David inquired of Yahweh[a], saying, “Should I go up against the Philistines? Will you give them into my hand?” And Yahweh said to David, “Go up, for I will certainly give the Philistines into your hand.”
translation:
  language: hi
  text: तब दाऊद ने याहवे से पूछा, “क्या मैं पलिश्तियों के विरुद्ध चढ़ाई करूँ? क्या तू उन्हें मेरे हाथ में दे देगा[a]?” याहवे ने दाऊद से कहा, “चढ़ाई कर, क्योंकि मैं निश्चय ही पलिश्तियों को तेरे हाथ में दे दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, “क्या तू उन्हें मेरे वश में कर देगा?” इब्रानी में किसी शत्रु को किसी के “हाथ में देना” उस पर विजय दिलाने का सामान्य मुहावरा है।
    reason: इब्रानी विजय-मुहावरे को स्पष्ट करना और वैकल्पिक स्वाभाविक हिन्दी देना।
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: याहवे से पूछा
  rationale: यहाँ שׁאל परमेश्वर से मार्गदर्शन माँगने को दर्शाता है। ‘पूछा’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और किसी अनुल्लिखित अनुष्ठान को नहीं जोड़ता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यंजनात्मक ईश्वरीय नाम יהוה को एक व्यक्तिगत वाचा-नाम के रूप में प्रस्तुत किया गया है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण हिन्दी लिप्यंतरण है।
- source_word: הַאֶעֱלֶה / עֲלֵה
  choice: क्या मैं ... चढ़ाई करूँ / चढ़ाई कर
  rationale: עלה का मूल भाव ‘ऊपर जाना’ है, पर इस सैनिक प्रसंग में ‘चढ़ाई करना’ लक्ष्य भाषा में स्वाभाविक है। प्रश्न और उत्तर में एक ही अभिव्यक्ति रखकर इब्रानी पुनरावृत्ति बचाई गई है।
- source_word: אֶל פְּלִשְׁתִּים
  choice: पलिश्तियों के विरुद्ध
  rationale: אֶל मूलतः दिशा बताता है, पर युद्ध के प्रसंग में गति शत्रु के विरुद्ध है; हिन्दी में ‘के विरुद्ध’ आशय को स्पष्ट और स्वाभाविक बनाता है।
- source_word: הֲתִתְּנֵם בְּיָדִי
  choice: क्या तू उन्हें मेरे हाथ में कर देगा
  rationale: נתן और ‘हाथ में’ का मुहावरा शत्रु पर अधिकार अथवा विजय दिए जाने को व्यक्त करता है। हिन्दी में मूल हाथ-वाले बिंब को बनाए रखा गया है।
- source_word: כִּי נָתוֹן אֶתֵּן
  choice: क्योंकि मैं निश्चय ही ... कर दूँगा
  rationale: क्रिया के infinitive absolute और finite रूप का संयोजन प्रतिज्ञा पर जोर देता है; ‘निश्चय ही’ उस emphatic certainty को स्पष्ट करता है।
- source_word: בְּיָדֶךָ
  choice: तेरे हाथ में
  rationale: दाऊद के प्रश्न और याहवे के उत्तर के बीच मूल पाठ का समान मुहावरा और समानांतरता सुरक्षित रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं, चार-अक्षरी व्यक्तिगत नाम है। ‘याहवे’ नाम और उपाधि का भेद सुरक्षित रखता है, जबकि पाठ किसी संप्रदाय-विशेष की व्याख्या नहीं जोड़ता।
- issue: शत्रुओं को ‘हाथ में देना’
  choice: मुहावरे का बिंब बनाए रखना
  alternative: उन पर विजय देना / उन्हें तेरे वश में कर देना
  rationale: मूल भाषा में विजय का आशय है, फिर भी ‘हाथ’ का चित्र जानबूझकर दोहराया गया है। मुख्य पाठ उसे सुरक्षित रखता है और पादटिप्पणी अर्थ समझाती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दाऊद और याहवे के सीधे संवाद में एकवचन निकट संबोधन ‘तू/तेरे’ अपनाया गया है, जो हिन्दी बाइबलीय शैली में ईश्वर-संबोधन के लिए प्रचलित है। सैनिक प्रसंग में ‘चढ़ाई करना’ स्वाभाविक है और प्रश्न-उत्तर की मूल पुनरावृत्ति भी बचाता है।
