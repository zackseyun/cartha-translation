source:
  edition: WLC
  text: וְ֠/עַתָּה כֹּֽה תֹאמַ֞ר לְ/עַבְדִּ֣/י לְ/דָוִ֗ד כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲנִ֤י לְקַחְתִּ֨י/ךָ֙ מִן הַ/נָּוֶ֔ה מֵ/אַחַ֖ר הַ/צֹּ֑אן לִֽ/הְי֣וֹת נָגִ֔יד עַל עַמִּ֖/י עַל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/008.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people, over Israel.'
translation:
  language: hi
  text: 'इसलिए अब मेरे सेवक दावीद से यह कहना: सेनाओं का यहोवा यों कहता है, ‘मैंने तुझे चरागाह से, भेड़-बकरियों के झुंड के पीछे चलने से लिया, ताकि तू मेरी प्रजा पर, इस्राएल पर प्रधान हो।’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्रधान’ के स्थान पर ‘शासक’, ‘अगुआ’ या ‘राजकुमार’ भी अनुवाद किया जा सकता है। इब्रानी शब्द शासन के लिए नियुक्त व्यक्ति को दर्शाता है, पर आवश्यक नहीं कि यहाँ विशिष्ट उपाधि ‘राजा’ ही हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह पद पिछले कथन से जुड़ते हुए संदेश के अगले चरण की ओर बढ़ता है; यह अनुवाद कालगत और निष्कर्षात्मक, दोनों बलों को व्यक्त करता है।
- source_word: כֹּה תֹאמַר
  choice: यह कहना
  rationale: आदेशात्मक संदेशवाहक सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לְעַבְדִּי לְדָוִד
  choice: मेरे सेवक दावीद से
  rationale: עבד यहाँ परमेश्वर से दावीद के संबंध का आदरसूचक पद है; ‘दास’ की अपेक्षा ‘सेवक’ प्रसंगानुकूल है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: व्यक्तिगत दिव्य नाम को ‘यहोवा’ और צבאות के व्यापक सैन्य अर्थ को ‘सेनाओं’ से स्पष्ट रूप में रखा गया है।
- source_word: מִן הַנָּוֶה
  choice: चरागाह से
  rationale: नवेह यहाँ पशुओं के चरने या रहने के स्थान को दर्शाता है; ‘चरागाह’ प्रसंग में सहज और स्पष्ट है।
- source_word: מֵאַחַר הַצֹּאן
  choice: भेड़-बकरियों के झुंड के पीछे चलने से
  rationale: शाब्दिक चरवाही-बिंब ‘झुंड के पीछे’ को बनाए रखते हुए צאן के सामूहिक अर्थ को स्पष्ट करता है।
- source_word: נָגִיד
  choice: प्रधान
  rationale: यह शब्द नियुक्त शासक या अगुए को दर्शाता है, पर अनिवार्य रूप से विशिष्ट उपाधि ‘राजा’ नहीं; ‘प्रधान’ इस भेद को बनाए रखता है।
- source_word: עַל עַמִּי עַל יִשְׂרָאֵל
  choice: मेरी प्रजा पर, इस्राएल पर
  rationale: दोहराए गए עַל को सुरक्षित रखा गया है, जिससे मूल का बल और लय बनी रहती है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में परमेश्वर का व्यक्तिगत वाचा-नाम स्पष्ट रूप से आया है; उसे सामान्य उपाधि से बदलने के बजाय नाम के रूप में रखा गया है।
- issue: दावीद के लिए עבד
  choice: सेवक
  alternative: दास
  rationale: यहाँ यह राजकीय-वाचाई संबंध में आदरसूचक designation है, न कि मुख्यतः बंधुआ स्थिति पर बल देने वाला शब्द।
- issue: נָגִיד की राजकीय व्याप्ति
  choice: प्रधान
  alternative: शासक / अगुआ / राजकुमार
  rationale: मूल शब्द शासन के लिए नियुक्त व्यक्ति का अर्थ देता है, पर ‘राजा’ के विशिष्ट पदनाम को अनिवार्य नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। संदेशवाहक सूत्र के लिए ‘यों कहता है’ रखा गया है। चरवाही के मूल बिंब और ‘मेरी प्रजा पर, इस्राएल पर’ की इब्रानी पुनरुक्ति सुरक्षित रखी गई है।
