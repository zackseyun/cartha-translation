source:
  edition: WLC
  text: וַ/יָּבֹא֙ הַ/מֶּ֣לֶךְ דָּוִ֔ד וַ/יֵּ֖שֶׁב לִ/פְנֵ֣י יְהוָ֑ה וַ/יֹּ֗אמֶר מִ֣י אָנֹכִ֞י אֲדֹנָ֤/י יְהוִה֙ וּ/מִ֣י בֵיתִ֔/י כִּ֥י הֲבִיאֹתַ֖/נִי עַד הֲלֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/018.yaml
  text: Then King David went in and sat before Yahweh and said[a], “Who am I, Lord GOD, and what is my house, that you have brought me this far?”
translation:
  language: hi
  text: तब राजा दाऊद भीतर गया और याहवे के सामने बैठकर बोला, “हे प्रभु याहवे, मैं कौन हूँ और मेरा घर[a] क्या है कि तू मुझे यहाँ तक ले आया है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घराना”; यहाँ “घर” का अर्थ परिवार, घराना या वंश भी हो सकता है। पूरे अध्याय में “घर” शब्द भवन और दाऊद के परिवार/वंश—दोनों अर्थों की प्रतिध्वनि रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: भीतर गया
  rationale: בוא यहाँ किसी स्थान में प्रवेश करने की ठोस गति बताता है; स्थान निर्दिष्ट किए बिना ‘भीतर गया’ स्वाभाविक हिन्दी है।
- source_word: וַיֵּשֶׁב
  choice: बैठकर
  rationale: ישב का प्रसंगानुकूल भौतिक अर्थ ‘बैठना’ है; अगले क्रियापद के साथ ‘बैठकर बोला’ सहज हिन्दी वाक्य-विन्यास देता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי उपस्थिति में या सामने होने का बोध देता है; ‘के सामने’ संक्षिप्त और स्वाभाविक है।
- source_word: אֲדֹנָי יְהוִה
  choice: हे प्रभु यहोवा
  rationale: सम्बोधन में אֲדֹנָי को ‘प्रभु’ और वाचा के नाम יהוה को ‘यहोवा’ रखकर दोनों पदों का भेद सुरक्षित रहता है।
- source_word: וּמִי בֵיתִי
  choice: और मेरा घराना क्या है
  rationale: हिब्रू में शाब्दिक रूप से ‘और मेरा घर कौन है’ है, पर हिन्दी में विनम्रता का यह प्रश्न ‘मेरा घराना क्या है’ अधिक स्वाभाविक है।
- source_word: בֵיתִי
  choice: मेरा घराना
  rationale: ‘घराना’ परिवार, वंश और उभरते राजवंश की व्यापकता व्यक्त करता है तथा अध्याय में ‘घर’ के विषयगत अर्थ से संबंध बनाए रखता है।
- source_word: הֲבִיאֹתַנִי
  choice: तू मुझे ... ले आया है
  rationale: בוא के हिफ़ील रूप का कारणवाचक अर्थ ‘ले आना’ है; एकवचन सम्बोधन ‘तू’ मूल के व्याकरण को सुरक्षित रखता है।
- source_word: עַד הֲלֹם
  choice: यहाँ तक
  rationale: यह पद वर्तमान अवस्था या प्राप्त मुकाम तक पहुँचाए जाने की सीमा बताता है; ‘यहाँ तक’ हिन्दी में यही स्थानिक और रूपकात्मक अर्थ देता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम को सामान्य उपाधि ‘प्रभु’ में विलीन नहीं किया गया; हिन्दी पाठकों में परिचित रूप ‘यहोवा’ अपनाया गया है, जबकि उसके साथ אֲדֹנָי का अलग अनुवाद ‘प्रभु’ है।
- issue: בֵיתִי का आशय
  choice: घराना
  alternative: घर / परिवार / वंश
  rationale: इस अध्याय में ‘घर’ शब्द भवन, परिवार और राजवंश के बीच अर्थ-प्रतिध्वनि बनाता है। ‘घराना’ साधारण हिन्दी में पारिवारिक और वंशगत दोनों संकेत देता है; पादटिप्पणी वास्तविक अर्थ-विस्तार स्पष्ट करती है।
- issue: दाऊद द्वारा परमेश्वर को सम्बोधन का वचन
  choice: तू
  alternative: आप
  rationale: हिब्रू क्रिया और सर्वनाम एकवचन हैं। ‘तू’ हिन्दी बाइबलीय प्रार्थना-भाषा में श्रद्धापूर्ण निकटता व्यक्त करता है और संख्या को स्पष्ट रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज प्रार्थना-शैली रखी गई है। ‘बैठकर बोला’ हिन्दी प्रवाह के लिए प्रयुक्त है। ‘घराना’ सामान्य पाठक के लिए समझने योग्य है और वंशगत संकेत भी बनाए रखता है।
