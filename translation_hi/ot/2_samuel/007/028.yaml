  yaml_path: translation/ot/2_samuel/007/028.yaml
  text: And now[a], Lord GOD, you are God, and your words are true[b], and you have spoken this good thing to your servant.
translation:
  language: hi
  text: और अब, हे प्रभु याहवे, आप ही परमेश्वर हैं। आपके वचन सत्य हैं[a], और आपने अपने सेवक से यह अच्छी बात कही है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “आपके वचन सत्य सिद्ध होंगे” अथवा “आपके वचन विश्वसनीय हैं।”'
    reason: हिब्रू יִהְיוּ אֱמֶת में भविष्यात्मक अर्थ संभव है, और אֱמֶת ‘सत्य’ के साथ ‘विश्वसनीयता’ भी व्यक्त कर सकता है।
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: हे प्रभु यहोवा
  rationale: दोनों संबोधनों को अलग-अलग रखते हुए אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘यहोवा’ किया गया है; हिन्दी में यह स्वाभाविक और गरिमापूर्ण है।
- source_word: אַתָּה הוּא הָאֱלֹהִים
  choice: आप ही परमेश्वर हैं
  rationale: הוּא से आने वाले बल को ‘ही’ व्यक्त करता है, जबकि ‘परमेश्वर’ हिन्दी में निश्चित और स्वाभाविक ईश्वरीय संबोधन है।
- source_word: דְבָרֶיךָ
  choice: आपके वचन
  rationale: मूल में संज्ञा बहुवचन है; ‘वचन’ हिन्दी में एक ही रूप से एकवचन और बहुवचन दोनों हो सकता है, और यहाँ क्रिया ‘हैं’ बहुवचन अर्थ स्पष्ट करती है।
- source_word: יִהְיוּ אֱמֶת
  choice: सत्य हैं
  rationale: इम्परफेक्ट रूप और אֱמֶת का अर्थ ‘सत्य/विश्वसनीयता’ दोनों की गुंजाइश रखते हैं। प्रसंग में वर्तमान कथन स्वाभाविक है, पर वैकल्पिक भाव पादटिप्पणी में सुरक्षित है।
- source_word: וַתְּדַבֵּר
  choice: आपने ... कही है
  rationale: क्रिया का मूल अर्थ ‘बोलना/कहना’ है; पूर्ण वर्तमान उस पहले कही गई बात की वर्तमान प्रासंगिकता दिखाता है, बिना इसे सीधे ‘प्रतिज्ञा करना’ बनाने के।
- source_word: אֶל עַבְדְּךָ
  choice: अपने सेवक से
  rationale: राजकीय प्रार्थना में दाऊद की आत्म-पहचान के लिए ‘सेवक’ स्वाभाविक है; हिन्दी में बोलने के साथ ‘से’ प्रयोग होता है।
- source_word: הַטּוֹבָה הַזֹּאת
  choice: इस भलाई की बात
  rationale: स्त्रीलिंग विशेषण के संज्ञीकृत प्रयोग को हिन्दी में स्वाभाविक बनाया गया है और मूल की व्यापकता रखी गई है; ‘प्रतिज्ञा’ या ‘आशीष’ कहना अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: संयुक्त ईश्वरीय संबोधन אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: हे प्रभु यहोवा
  alternative: हे प्रभु याहवे; हे प्रभु परमेश्वर
  rationale: ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला नाम है और मूल में उपस्थित व्यक्तिगत नाम को सामान्य उपाधि में नहीं बदलता।
- issue: יִהְיוּ אֱמֶת का काल और अर्थ
  choice: आपके वचन सत्य हैं
  alternative: आपके वचन सत्य सिद्ध होंगे; आपके वचन विश्वसनीय हैं
  rationale: प्रसंग में दाऊद परमेश्वर के कथन की स्थायी सत्यता स्वीकार करता है। फिर भी हिब्रू इम्परफेक्ट और אֱמֶת की अर्थ-सीमा के कारण भविष्यात्मक तथा ‘विश्वसनीय’ पाठ संभव हैं, जिन्हें पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक ‘आप’, प्रार्थनात्मक और गरिमापूर्ण शैली। वाक्य को हिन्दी में स्पष्टता के लिए दो वाक्यों में बाँटा गया है; मूल की पुनरुक्ति और धर्मवैज्ञानिक तनाव को अनावश्यक रूप से नहीं सुलझाया गया।
