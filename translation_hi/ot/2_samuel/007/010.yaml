source:
  edition: WLC
  text: וְ/שַׂמְתִּ֣י מָ֠קוֹם לְ/עַמִּ֨/י לְ/יִשְׂרָאֵ֤ל וּ/נְטַעְתִּי/ו֙ וְ/שָׁכַ֣ן תַּחְתָּ֔י/ו וְ/לֹ֥א יִרְגַּ֖ז ע֑וֹד וְ/לֹֽא יֹסִ֤יפוּ בְנֵֽי עַוְלָה֙ לְ/עַנּוֹת֔/וֹ כַּ/אֲשֶׁ֖ר בָּ/רִאשׁוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/010.yaml
  text: And I will appoint a place for my people Israel and will plant them[a], so that they may dwell in their own place and be disturbed no more. And the sons of wickedness shall no longer afflict them, as formerly.
translation:
  language: hi
  text: और मैं अपनी प्रजा इस्राएल के लिए एक स्थान ठहराऊँगा और उसे रोपूँगा, ताकि वह अपने ही स्थान में बसे और फिर कभी विचलित न हो। और दुष्टता के पुत्र[a] उसे फिर कभी पीड़ित न करेंगे, जैसा पहले होता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् “दुष्ट लोग” या “कुकर्मी।” इब्रानी में शाब्दिक रूप से “दुष्टता के पुत्र।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי מָקוֹם
  choice: एक स्थान ठहराऊँगा
  rationale: שׂוּם का मूल अर्थ रखना या स्थापित करना है; מָקוֹם के साथ यहाँ परमेश्वर द्वारा सुरक्षित स्थान निर्धारित करने का भाव है।
- source_word: לְעַמִּי לְיִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल के लिए
  rationale: यह पदबंध संबंधसूचक 'मेरी प्रजा' और उसके नाम 'इस्राएल' दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וּנְטַעְתִּיו
  choice: उसे रोपूँगा
  rationale: एकवचन प्रत्यय सामूहिक इस्राएल की ओर संकेत करता है। 'रोपूँगा' सुरक्षित और स्थायी स्थापना के कृषि-रूपक को बचाता है।
- source_word: וְשָׁכַן תַּחְתָּיו
  choice: वह अपने ही स्थान में बसे
  rationale: सामूहिक एकवचन को बनाए रखते हुए תַּחְתָּיו का प्रसंगानुकूल अर्थ अपने निर्धारित स्थान में स्थिर होकर बसना लिया गया है।
- source_word: וְלֹא יִרְגַּז עוֹד
  choice: फिर कभी विचलित न हो
  rationale: רגז में काँपने, अशांत होने या हिला दिए जाने का भाव है; राष्ट्रीय सुरक्षा के प्रसंग में 'विचलित' इस व्यापकता को बनाए रखता है।
- source_word: בְנֵי עַוְלָה
  choice: दुष्टता के पुत्र
  rationale: हिब्रू के स्पष्ट रूपक को मुख्य पाठ में संरक्षित किया गया है; सहज अर्थ पादटिप्पणी में दिया गया है।
- source_word: לְעַנּוֹתוֹ
  choice: उसे पीड़ित न करेंगे
  rationale: Piel रूप यहाँ सताने, दबाने या पीड़ा पहुँचाने का अर्थ देता है; 'पीड़ित करना' पर्याप्त व्यापक और प्रसंगानुकूल है।
- source_word: כַּאֲשֶׁר בָּרִאשׁוֹנָה
  choice: जैसा पहले होता था
  rationale: यह पूर्वकाल के बार-बार होने वाले उत्पीड़न की तुलना को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: इस्राएल के लिए सामूहिक एकवचन क्रियाएँ और प्रत्यय
  choice: हिन्दी में 'उसे' और 'वह' द्वारा सामूहिक एकवचन बनाए रखा
  alternative: लोगों को लक्ष्य मानकर बहुवचन 'उन्हें' और 'वे' करना
  rationale: हिब्रू पाठ इस्राएल को एक सामूहिक इकाई के रूप में एकवचन में रखता है, और हिन्दी में यह राष्ट्रीय सामूहिकता स्वाभाविक तथा बोधगम्य है।
- issue: בְנֵי עַוְלָה का मुहावरा
  choice: मुख्य पाठ में 'दुष्टता के पुत्र'
  alternative: '''दुष्ट लोग'' या ''कुकर्मी'''
  rationale: शाब्दिक, पुरुषवाचक हिब्रू मुहावरे को सुरक्षित रखा गया है और उसके सहज अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज गद्य। 'ठहराऊँगा' और 'रोपूँगा' प्रतिज्ञा तथा कृषि-रूपक दोनों को रखते हैं; सामूहिक इस्राएल के लिए एकवचन प्रयोग मूल की संरचना को दर्शाता है।
