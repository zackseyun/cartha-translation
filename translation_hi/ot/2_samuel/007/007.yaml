source:
  edition: WLC
  text: בְּ/כֹ֥ל אֲשֶֽׁר הִתְהַלַּכְתִּי֮ בְּ/כָל בְּנֵ֣י יִשְׂרָאֵל֒ הֲ/דָבָ֣ר דִּבַּ֗רְתִּי אֶת אַחַד֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר צִוִּ֗יתִי לִ/רְע֛וֹת אֶת עַמִּ֥/י אֶת יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לָ֛/מָּה לֹֽא בְנִיתֶ֥ם לִ֖/י בֵּ֥ית אֲרָזִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/007.yaml
  text: In all the places where I have walked among all the sons of Israel[a], did I ever speak a word to one of the tribes of Israel, whom I commanded to shepherd my people Israel, saying, ‘Why have you not built me a house of cedar?’
translation:
  language: hi
  text: जिन-जिन स्थानों में मैं इस्राएल के सब पुत्रों के बीच चलता-फिरता रहा, क्या मैंने कभी इस्राएल के गोत्रों में से किसी एक से, जिसे मैंने अपनी प्रजा इस्राएल की चरवाही करने की आज्ञा दी थी, एक भी बात कही, ‘तुमने मेरे लिए देवदार का भवन क्यों नहीं बनाया?’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में यहाँ “इस्राएल के गोत्रों में से किसी एक” है; समानांतर पद 1 इतिहास 17:6 में “इस्राएल के न्यायी” मिलता है, जो संभवतः प्रजा की चरवाही के लिए नियुक्त अगुवों की ओर संकेत करता है।
    reason: textual_variant
lexical_decisions:
- source_word: הִתְהַלַּכְתִּי
  choice: चलता-फिरता रहा
  rationale: हित्पाएल रूप परमेश्वर के अपनी प्रजा के बीच गतिशील रूप से उपस्थित रहने को व्यक्त करता है; यह अनुवाद चलने के ठोस रूपक को बनाए रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के सब पुत्रों
  rationale: यह इस्राएल राष्ट्र का पारंपरिक पुरुषवाची पद है; ‘पुत्रों’ मूल की व्याकरणिक और वाचिक बनावट को स्पष्ट रखता है।
- source_word: הֲדָבָר דִּבַּרְתִּי
  choice: क्या मैंने कभी ... यह कहा
  rationale: प्रश्नवाचक संरचना और सजातीय कर्म का बल हिन्दी में ‘कभी’ द्वारा स्वाभाविक रूप से प्रकट होता है।
- source_word: אַחַד שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के गोत्रों में से किसी एक से
  rationale: मसोरेटिक पाठ में ‘गोत्र’ है; इसलिए मुख्य पाठ में उसी को रखा गया है, यद्यपि अगला चरवाही-संबंधी उपवाक्य अगुवों की ओर संकेत करता है।
- source_word: אֲשֶׁר צִוִּיתִי לִרְעוֹת
  choice: जिसे मैंने ... चरवाही करने की आज्ञा दी थी
  rationale: ‘चरवाही’ शासन और देखभाल के मूल चरवाहा-रूपक को बनाए रखती है; संबंधवाचक एकवचन मसोरेटिक पाठ की वास्तविक कठिनता को भी नहीं मिटाता।
- source_word: עַמִּי אֶת יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल
  rationale: यह स्वामित्व और समानाधिकरण दोनों को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: בֵּית אֲרָזִים
  choice: देवदार का भवन
  rationale: ‘भवन’ यहाँ परमेश्वर के लिए स्थायी उपासना-स्थान को सूचित करता है, और ‘देवदार’ निर्माण-सामग्री को बनाए रखता है।
theological_decisions:
- issue: इस्राएल के लिए लिंगसूचक वाचा-संबंधी नाम
  choice: इस्राएल के सब पुत्रों
  alternative: समस्त इस्राएलियों / इस्राएल की सारी प्रजा
  rationale: मूल पुरुषवाची बहुवचन राष्ट्रीय पद के रूप में प्रयुक्त है; मुख्य पाठ उसे अस्पष्ट या लिंग-निरपेक्ष नहीं बनाता।
- issue: ‘गोत्रों’ और अगुवा-संबंधी अर्थ के बीच पाठगत तनाव
  choice: गोत्रों में से किसी एक
  alternative: न्यायियों/शासकों में से किसी एक
  rationale: शमूएल के मसोरेटिक पाठ में ‘गोत्र’ है, जबकि 1 इतिहास 17:6 में ‘न्यायी’ मिलता है और चरवाही वाला उपवाक्य अगुवों की ओर संकेत करता है। मूल पाठ को मुख्य पंक्ति में रखा और समानांतर पाठ को टिप्पणी में बताया गया है।
- issue: एकवचन संबंधवाचक उपवाक्य और सामूहिक गोत्र
  choice: जिसे मैंने ... आज्ञा दी थी
  alternative: जिन अगुवों को मैंने ... आज्ञा दी थी
  rationale: मूल की व्याकरणिक असहजता को अगुवों का बहुवचन जोड़कर चुपचाप हल नहीं किया गया; इससे वास्तविक पाठगत तनाव बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली। ‘चलता-फिरता रहा’ और ‘चरवाही’ मूल के रूपकों को रखते हैं; ‘देवदार का भवन’ सामान्य पाठक के लिए स्पष्ट है। पादटिप्पणी-चिह्न संबंधित उद्धृत प्रश्न के बाद रखा गया है।
