language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל נָתָ֣ן הַ/נָּבִ֔יא רְאֵ֣ה נָ֔א אָנֹכִ֥י יוֹשֵׁ֖ב בְּ/בֵ֣ית אֲרָזִ֑ים וַֽ/אֲרוֹן֙ הָֽ/אֱלֹהִ֔ים יֹשֵׁ֖ב בְּ/ת֥וֹךְ הַ/יְרִיעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/002.yaml
  text: And the king said to Nathan the prophet[a], “See now, I dwell in a house of cedar, but the ark of God dwells within curtains.”
translation:
  language: hi
  text: तब राजा ने नातान नबी से कहा, “देखो, मैं तो देवदार की लकड़ी से बने भवन में रहता हूँ, पर परमेश्वर का सन्दूक तम्बू के परदों के भीतर रहता है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वय्यिक़्तोल कथा को आगे बढ़ाता है; आधुनिक हिन्दी में “तब” स्वाभाविक कथात्मक प्रवाह देता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: मूल में निश्चित पदवी है; यहाँ नाम “दाऊद” जोड़ना आवश्यक नहीं।
- source_word: נָתָן הַנָּבִיא
  choice: नातान नबी
  rationale: व्यक्तिनाम के साथ पदवी को सरल और प्रचलित बाइबलीय हिन्दी में रखा गया है।
- source_word: רְאֵה נָא
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला विनम्र आग्रह है; हिन्दी में “देखो” दोनों शब्दों का स्वाभाविक भाव व्यक्त करता है।
- source_word: אָנֹכִי
  choice: मैं तो
  rationale: स्वतंत्र सर्वनाम के हल्के बल और आगे आने वाले विरोध को “तो” से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: יוֹשֵׁב
  choice: रहता हूँ / रहता है
  rationale: शाब्दिक अर्थ “बैठना” भी हो सकता है, पर यहाँ निवास की तुलना है; इसलिए “रहना” उपयुक्त है।
- source_word: בְּבֵית אֲרָזִים
  choice: देवदार की लकड़ी से बने भवन में
  rationale: यह देवदार की सामग्री या सज्जा वाले राजकीय निवास को दर्शाता है; “भवन” गरिमापूर्ण और स्पष्ट है।
- source_word: וַאֲרוֹן הָאֱלֹהִים
  choice: पर परमेश्वर का सन्दूक
  rationale: וְ यहाँ दाऊद के निवास और सन्दूक के स्थान के बीच विरोध दर्शाता है, इसलिए “पर” चुना गया है।
- source_word: בְּתוֹךְ הַיְרִיעָה
  choice: तम्बू के परदों के भीतर
  rationale: יְרִיעָה तम्बू के कपड़े, परदे या आवरण को सूचित करता है। सामूहिक एकवचन को हिन्दी में बहुवचन “परदों” से स्वाभाविक रूप मिला है।
theological_decisions:
- issue: परमेश्वर के सन्दूक के अस्थायी निवास का वर्णन
  choice: “तम्बू के परदों के भीतर” के रूप में ठोस वस्त्र-चित्र बनाए रखा गया है।
  alternative: “एक परदे के भीतर” या सामान्यीकृत “तम्बू में”
  rationale: मूल शब्द विशेष रूप से तम्बू के परदे या आवरण की ओर संकेत करता है। यह अनुवाद उस चित्र को बचाता है और बाद की मन्दिर-संबंधी धर्मवैचारिक अवधारणाएँ पद में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। “सन्दूक” बाइबलीय संदर्भ में वाचा-सन्दूक के लिए समझने योग्य पारंपरिक शब्द है। मूल की पुनरुक्ति “रहता हूँ/रहता है” को तुलना बनाए रखने के लिए सुरक्षित रखा गया है।
