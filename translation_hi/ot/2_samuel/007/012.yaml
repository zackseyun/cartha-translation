base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/012.yaml
  text: When your days are fulfilled and you lie down with your fathers[a], I will raise up your offspring after you, who will come from your own body[b], and I will establish his kingdom.
translation:
  language: hi
  text: जब तुम्हारे दिन पूरे हो जाएँ और तुम अपने पूर्वजों के साथ सो जाओ[a], तब मैं तुम्हारे बाद तुम्हारी संतान[b] को खड़ा करूँगा, जो तुम्हारे अपने ही शरीर से उत्पन्न होगी[c], और मैं उसका राज्य स्थिर करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पूर्वजों के साथ सो जाना’ मृत्यु के लिए प्रयुक्त इब्रानी मुहावरा है।
    reason: cultural_note
  - marker: b
    text: इब्रानी में शाब्दिक अर्थ ‘तुम्हारा बीज’ है; यह किसी एक वंशज या पूरी संतान/वंश—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से ‘तुम्हारे भीतर के अंगों से’; अर्थात वह तुम्हारी अपनी जैविक संतान होगी।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי יִמְלְאוּ יָמֶיךָ
  choice: जब तुम्हारे दिन पूरे हो जाएँ
  rationale: כִּי यहाँ भावी समय-परिस्थिति का परिचय देता है। यह अनुवाद ‘दिन पूरे होने’ की इब्रानी छवि और गंभीर स्वर को बनाए रखता है।
- source_word: וְשָׁכַבְתָּ אֶת־אֲבֹתֶיךָ
  choice: और तुम अपने पूर्वजों के साथ सो जाओ
  rationale: यह मृत्यु के लिए प्रयुक्त इब्रानी मुहावरा है। रूपक को मुख्य पाठ में बनाए रखते हुए उसका अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וַהֲקִימֹתִי
  choice: तब मैं ... खड़ा करूँगा
  rationale: हिफ़ील रूप यहाँ उत्तराधिकारी को उठाने या सामने लाने का भाव देता है; ‘खड़ा करूँगा’ उत्तराधिकार की छवि को सुरक्षित रखता है।
- source_word: זַרְעֲךָ
  choice: तुम्हारे वंश
  rationale: זֶרַע का अर्थ सन्तान, वंशज या सामूहिक वंश हो सकता है। ‘वंश’ हिन्दी में सामूहिक और प्रतिनिधिक एकवचन—दोनों संभावनाओं को अपेक्षाकृत खुला रखता है।
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: जो तुम्हारे अपने शरीर से उत्पन्न होगा
  rationale: शाब्दिक ‘तुम्हारे भीतर के अंगों से निकलेगा’ जैविक वंश का मुहावरा है। चुना गया रूप आधुनिक हिन्दी में अर्थ स्पष्ट करता है।
- source_word: וַהֲכִינֹתִי אֶת־מַמְלַכְתּוֹ
  choice: और मैं उसका राज्य स्थिर करूँगा
  rationale: כון के हिफ़ील रूप में दृढ़ या स्थिर करने का भाव है। ‘राज्य स्थिर करूँगा’ राजवंशीय प्रतिज्ञा और मूल क्रिया की दृढ़ता दोनों व्यक्त करता है।
theological_decisions:
- issue: दाऊद से की गई प्रतिज्ञा में זַרְעֲךָ का दायरा
  choice: तुम्हारे वंश
  alternative: तुम्हारे वंशज / तुम्हारी सन्तान
  rationale: इब्रानी शब्द सामूहिक वंश अथवा उसके प्रतिनिधि एकवचन के रूप में समझा जा सकता है। ‘वंश’ तत्काल उत्तराधिकारी, आगे चलने वाले राजवंश और व्यापक धर्मवैचारिक संभावना के बीच की मूल अस्पष्टता को बिना किसी एक व्याख्या को थोपे बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पूर्वजों के साथ सो जाना’ और ‘वंश को खड़ा करना’ जैसे मूल रूपक सुरक्षित हैं, जबकि पादटिप्पणियाँ उनके मुहावरेदार अर्थ स्पष्ट करती हैं।
