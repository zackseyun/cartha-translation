  text: और तेरा घराना[a] और तेरा राज्य तेरे सामने[b] सदा के लिए सुदृढ़ किए जाएंगे; तेरा सिंहासन सदा स्थिर रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “घराना” से आशय संभवतः राजघराने, अर्थात राजवंश, से है।
