    text: हिब्रू पाठ में “तेरे सामने”; कुछ प्राचीन पाठ-साक्ष्यों में “मेरे सामने” है।
    reason: textual_variant
lexical_decisions:
- source_word: וְנֶאְמַן
  choice: अटल बने रहेंगे
  rationale: निफ़अल रूप यहाँ दृढ़, सुनिश्चित और टिकाऊ बने रहने का भाव देता है। हिंदी में बहुवचन कर्ताओं ‘घराना’ और ‘राज्य’ के साथ यह अभिव्यक्ति स्वाभाविक है और बाद के ‘स्थिर रहेगा’ से शब्दगत भेद भी बनाए रखती है।
- source_word: בֵּיתְךָ
  choice: तेरा घराना
  rationale: राजकीय प्रतिज्ञा के संदर्भ में בַּיִת भौतिक घर से अधिक दाऊद के वंशगत राजघराने को सूचित करता है। ‘घराना’ मूल रूपक और राजवंशीय अर्थ दोनों को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: וּמַמְלַכְתְּךָ
  choice: और तेरा राज्य
  rationale: מַמְלָכָה के राज्य अथवा राजसत्ता संबंधी अर्थ को ‘राज्य’ सीधे और सहज रूप से व्यक्त करता है।
- source_word: עַד עוֹלָם
  choice: सदा
  rationale: यह पदबंध निरंतर और स्थायी अवधि का बोध कराता है। दोनों स्थानों पर ‘सदा’ दोहराकर मूल का बल सुरक्षित रखा गया है।
- source_word: לְפָנֶיךָ
  choice: तेरे सामने
  rationale: प्रदत्त WLC पाठ में द्वितीय पुरुष एकवचन प्रत्यय है, अर्थात ‘तेरे सामने’। महत्वपूर्ण वैकल्पिक पाठ ‘मेरे सामने’ को पादटिप्पणी में रखा गया है।
- source_word: כִּסְאֲךָ
  choice: तेरा सिंहासन
  rationale: यह राजकीय आसन और उससे सूचित राजसत्ता दोनों के लिए मानक तथा संदर्भानुकूल अनुवाद है।
- source_word: יִהְיֶה נָכוֹן
  choice: स्थिर रहेगा
  rationale: היה के साथ נָכוֹן दृढ़तापूर्वक स्थापित और कायम रहने का भाव देता है। ‘स्थिर रहेगा’ स्वाभाविक हिंदी है और पहले खंड के אמן से भिन्न हिब्रू अभिव्यक्ति को भी दर्शाता है।
theological_decisions:
- issue: वंशगत प्रतिज्ञा और संभावित मसीही अर्थ
  choice: ‘घराना’, ‘राज्य’ और ‘सिंहासन’ को उनके ऐतिहासिक-राजवंशीय अर्थ में रखा गया है, बिना मसीही पूर्ति को मुख्य पाठ में स्पष्ट किए।
  alternative: ‘घराना’ के स्थान पर सीधे ‘राजवंश’ कहना, अथवा अनुवाद में मसीही पूर्ति को अधिक स्पष्ट करना।
  rationale: यह पद अपने तत्काल संदर्भ में दाऊद के राजवंश से प्रतिज्ञा करता है। इसके व्यापक धर्मवैज्ञानिक अर्थ संभव हैं, पर अनुवाद को हिब्रू कथन से आगे जाकर किसी एक पूर्ति को आरोपित नहीं करना चाहिए।
- issue: לְפָנֶיךָ का पाठांतर
  choice: प्रदत्त मसोराई पाठ के अनुसार ‘तेरे सामने’ मुख्य पाठ में रखा गया है।
  alternative: कुछ प्राचीन पाठ-साक्ष्यों के अनुसार ‘मेरे सामने’।
  rationale: द्वितीय पुरुष का पाठ वास्तविक और अर्थपूर्ण है, जबकि प्रथम पुरुष का पाठ भी तत्काल ईश्वरीय वाणी के संदर्भ में महत्वपूर्ण है; इसलिए पाठांतर को दबाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अटल बने रहेंगे’ और ‘स्थिर रहेगा’ मूल की दो अलग अभिव्यक्तियों का अंतर बनाए रखते हैं; विरामचिह्न दोनों समानांतर प्रतिज्ञाओं को स्पष्ट करता है।
