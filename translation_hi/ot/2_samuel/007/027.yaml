  text: כִּֽי אַתָּה֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל גָּלִ֜יתָה אֶת אֹ֤זֶן עַבְדְּ/ךָ֙ לֵ/אמֹ֔ר בַּ֖יִת אֶבְנֶה לָּ֑/ךְ עַל כֵּ֗ן מָצָ֤א עַבְדְּ/ךָ֙ אֶת לִבּ֔/וֹ לְ/הִתְפַּלֵּ֣ל אֵלֶ֔י/ךָ אֶת הַ/תְּפִלָּ֖ה הַ/זֹּֽאת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/027.yaml
  text: For you[a], O Yahweh of hosts, God of Israel, have revealed this to your servant, saying[c][b], ‘I will build you a house.’ Therefore your servant has found it in his heart to pray this prayer to you.
translation:
  language: hi
  text: क्योंकि हे सेनाओं के यहोवा, इस्राएल के परमेश्वर, तूने अपने दास को यह प्रकट किया है[a], ‘मैं तेरे लिए एक घर बनाऊँगा।’[b] इसीलिए तेरे दास ने तुझसे यह प्रार्थना करने का साहस पाया है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तूने अपने दास का कान उघाड़ दिया है”; यह एक इब्रानी मुहावरा है, जिसका अर्थ है कि परमेश्वर ने अपने दास को यह बात प्रकट की।
    reason: lexical_alternative
  - marker: b
    text: “घर” यहाँ निवास-भवन के साथ-साथ घराने या राजवंश का भाव भी रख सकता है।
    reason: lexical_ambiguity
  - marker: c
    text: शाब्दिक रूप से, “तेरे दास ने अपना हृदय पाया है,” अर्थात् उसे यह प्रार्थना करने का साहस या दृढ़ निश्चय मिला है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: दिव्य नाम को ‘यहोवा’ और צְבָאוֹת को ‘सेनाओं’ के रूप में रखकर उपाधि का सैन्य तथा व्यापक सामर्थ्य-संबंधी भाव सुरक्षित रखा गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: यह सीधा संबंधवाचक अनुवाद परमेश्वर की इस्राएल के साथ वाचा-संबंधी पहचान को बनाए रखता है।
- source_word: גָּלִיתָה אֶת אֹזֶן עַבְדְּךָ
  choice: तूने अपने दास पर यह प्रकट किया है
  rationale: शाब्दिक इब्रानी मुहावरा ‘अपने दास का कान खोल दिया’ है; मुख्य पाठ में उसका स्वाभाविक अर्थ दिया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: עַבְדְּךָ
  choice: तेरे दास
  rationale: राजकीय प्रार्थना में यह दाऊद की परमेश्वर के सामने विनम्र अधीनता दर्शाता है; ‘दास’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक और प्रसंगानुकूल है।
- source_word: בַּיִת אֶבְנֶה לָּךְ
  choice: मैं तेरे लिए एक घर बनाऊँगा
  rationale: ‘घर’ शब्द को बनाए रखने से भवन और राजवंश के बीच का प्रसंगगत शब्दार्थ-संबंध सुरक्षित रहता है; इसे केवल ‘मन्दिर’ या ‘राजवंश’ नहीं बनाया गया।
- source_word: עַל כֵּן
  choice: इसीलिए
  rationale: यह परमेश्वर के प्रकाशन और दाऊद की प्रार्थना के बीच परिणामसूचक संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: מָצָא ... אֶת לִבּוֹ
  choice: प्रार्थना करने का साहस पाया है
  rationale: शाब्दिक ‘अपना हृदय पाया’ संकल्प अथवा साहस जुटाने का इब्रानी मुहावरा है; चुना हुआ रूप आधुनिक हिन्दी में उसका आशय स्पष्ट करता है।
- source_word: הַתְּפִלָּה הַזֹּאת
  choice: यह प्रार्थना
  rationale: यह दाऊद द्वारा उसी समय की जा रही विशिष्ट प्रार्थना को सीधे और स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: प्रकाशन के लिए प्रयुक्त इब्रानी मुहावरा
  choice: मुख्य पाठ में ‘अपने दास पर यह प्रकट किया है’
  alternative: ‘अपने दास का कान खोल दिया है’
  rationale: शाब्दिक रूप हिन्दी में अस्पष्ट हो सकता है; अर्थ को मुख्य पाठ में स्वाभाविक बनाया गया है और मूल बिंब पादटिप्पणी में दिया गया है।
- issue: ‘घर’ का अर्थ
  choice: मुख्य पाठ में व्यापक ‘घर’
  alternative: ‘मन्दिर’ अथवा ‘राजवंश/घराना’
  rationale: इस प्रसंग में בַּיִת भौतिक भवन और दाऊद के राजवंश के बीच जानबूझकर अर्थ-संबंध रखता है। किसी एक अर्थ को चुनना पाठ की वाचागत गूँज को अनावश्यक रूप से सीमित कर देता।
- issue: ‘अपना हृदय पाया’ मुहावरे का आशय
  choice: ‘प्रार्थना करने का साहस पाया है’
  alternative: ‘अपने मन में पाया है’
  rationale: चुना हुआ पाठ संकल्प और साहस के मुहावरेदार आशय को स्पष्ट करता है, जबकि पादटिप्पणी मूल अभिव्यक्ति को दर्ज करती है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और प्रार्थनात्मक रखी गई है। परमेश्वर को एकवचन निकट संबोधन ‘तू/तेरे/तुझसे’ दिया गया है, जो हिन्दी बाइबल और भक्तिपरक प्रार्थना-भाषा में आदरपूर्ण है। ‘सेनाओं के यहोवा’ पारंपरिक उपाधि को स्पष्ट रूप में बनाए रखता है।
