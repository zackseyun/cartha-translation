base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/020.yaml
  text: And what more can David say to you? You know your servant[a], Lord GOD.
translation:
  language: hi
  text: और दाऊद आपसे और क्या कहे? हे प्रभु याहवे[a], आप तो अपने दास को जानते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “अदोनाय YHWH” (אֲדֹנָי יְהוִה) है। “याहवे” YHWH का प्रचलित हिन्दी लिप्यंतरण है।
    reason: संयुक्त ईश्वरीय उपाधि के इब्रानी पाठ-रूप और नाम के लिप्यंतरण को स्पष्ट करना।
lexical_decisions:
- source_word: וּמַה יוֹסִיף דָּוִד עוֹד לְדַבֵּר אֵלֶיךָ
  choice: और दाऊद आपसे आगे क्या कहे?
  rationale: יסף + עוד + לדבר का शाब्दिक भाव ‘बोलने में और जोड़ना’ है; आधुनिक हिन्दी में ‘आगे क्या कहे’ उसी आलंकारिक प्रश्न को स्वाभाविक रूप से व्यक्त करता है। आरम्भिक ‘और’ प्रार्थना के पिछले कथन से प्रवाह बनाए रखता है।
- source_word: וְאַתָּה
  choice: आप तो
  rationale: स्वतंत्र सर्वनाम बल देता है। परमेश्वर के सीधे संबोधन में आधुनिक, सम्मानपूर्ण हिन्दी के लिए ‘आप’ और बल के लिए ‘तो’ चुना गया है।
- source_word: יָדַעְתָּ
  choice: जानते हैं
  rationale: पूर्ण क्रिया यहाँ वर्तमान में स्थिर ज्ञान व्यक्त करती है; हिन्दी का सामान्य वर्तमान रूप स्वाभाविक समतुल्य है।
- source_word: עַבְדְּךָ
  choice: अपने दास को
  rationale: प्रार्थना में עבד दाऊद की परमेश्वर के अधीन विनम्र पहचान बताता है। ‘दास’ इस धार्मिक-राजकीय संदर्भ और समर्पण के भाव को ‘सेवक’ से अधिक निकटता से रखता है।
- source_word: אֲדֹנָי יְהוִה
  choice: हे प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के निज नाम יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ से व्यक्त किया गया है। ‘हे’ सीधे संबोधन को स्वाभाविक बनाता है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה में יהוה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे; प्रभु परमेश्वर
  rationale: मूल पाठ में सामान्य उपाधि אֲדֹנָי और वाचा का निज नाम יהוה दोनों हैं। ‘प्रभु यहोवा’ दोनों को अलग-अलग बनाए रखता है और ‘प्रभु प्रभु’ जैसी पुनरुक्ति से बचता है; पादटिप्पणी उच्चारण की अनिश्चितता बताती है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और प्रार्थनात्मक रखी गई है। परमेश्वर के लिए ‘आप’ का प्रयोग आज के सामान्य पाठक को गरिमापूर्ण लगता है, जबकि ‘आप तो’ मूल के बलयुक्त सर्वनाम को दर्शाता है।
