source:
  edition: WLC
  text: וְ/יִגְדַּ֨ל שִׁמְ/ךָ֤ עַד עוֹלָם֙ לֵ/אמֹ֔ר יְהוָ֣ה צְבָא֔וֹת אֱלֹהִ֖ים עַל יִשְׂרָאֵ֑ל וּ/בֵית֙ עַבְדְּ/ךָ֣ דָוִ֔ד יִהְיֶ֥ה נָכ֖וֹן לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/026.yaml
  text: And may your name be magnified forever[a], saying[b], ‘Yahweh of hosts is God over Israel,’ and may the house of your servant David be established before you.
translation:
  language: hi
  text: और आपका नाम सदा महान् हो[a], कि “सेनाओं के याहवे इस्राएल पर परमेश्वर हैं,” और आपके सेवक दाऊद का घर[b] आपके सामने स्थिर रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘आपका नाम सदा महान बनाया जाए।’
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘घर’ से केवल भवन नहीं, बल्कि दाऊद का परिवार और राजवंश अभिप्रेत है।
    reason: cultural_note
lexical_decisions:
- source_word: וְיִגְדַּל
  choice: और ... महान् हो
  rationale: प्रार्थना के संदर्भ में अपूर्ण क्रिया इच्छासूचक भाव व्यक्त करती है। ‘महान् हो’ हिब्रू के सक्रिय/स्थिति-सूचक रूप को सहज हिन्दी में रखता है और अनावश्यक कर्मवाच्य नहीं जोड़ता।
- source_word: שִׁמְךָ
  choice: आपका नाम
  rationale: ‘नाम’ को ज्यों का त्यों रखने से प्रतिष्ठा, यश और प्रकट पहचान से जुड़ा हिब्रू मुहावरा बिना अति-व्याख्या के सुरक्षित रहता है।
- source_word: עַד עוֹלָם
  choice: सदा
  rationale: यह स्थायी और अनंत कालावधि का स्वाभाविक, संक्षिप्त हिन्दी रूप है।
- source_word: לֵאמֹר
  choice: ताकि लोग कहें
  rationale: हिब्रू का उद्धरण-सूचक क्रियारूप आगे आने वाली घोषणा को जोड़ता है। हिन्दी में निहित बोलने वालों को ‘लोग’ कहकर व्यक्त करना वाक्य को स्वाभाविक बनाता है, जबकि प्रयोजन/परिणाम का संबंध बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं के
  rationale: यह ईश्वरीय उपाधि का सीधा रूप है और इसके व्यापक सामर्थ्य-संबंधी अर्थ को केवल मानवीय सेना तक सीमित नहीं करता।
- source_word: אֱלֹהִים עַל יִשְׂרָאֵל
  choice: इस्राएल पर परमेश्वर हैं
  rationale: यहाँ עַל को ‘पर’ कहना इस्राएल पर परमेश्वर की प्रभुता और अधिकार को बनाए रखता है। आदरसूचक ‘हैं’ आधुनिक हिन्दी के ईश्वर-संबोधन के अनुरूप है।
- source_word: וּבֵית עַבְדְּךָ דָוִד
  choice: और आपके सेवक दाऊद का घर
  rationale: ‘घर’ मूल शब्द और अध्याय में भवन तथा राजवंश के बीच के शब्द-खेल को सुरक्षित रखता है; यहाँ उसका आशय दाऊद के परिवार और राजवंश से है।
- source_word: יִהְיֶה נָכוֹן
  choice: स्थिर रहे
  rationale: यह היה के साथ נָכוֹן में निहित दृढ़ता, टिकाऊपन और स्थापित बने रहने के भाव को प्रार्थनात्मक हिन्दी में व्यक्त करता है।
- source_word: לְפָנֶיךָ
  choice: आपके सामने
  rationale: यह मूल स्थानिक मुहावरे के साथ परमेश्वर की उपस्थिति में बने रहने का संबंधपरक भाव भी सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: दाऊद की प्रतिज्ञा में ‘घर’ का अर्थ
  choice: मुख्य पाठ में ‘घर’ बनाए रखना और पादटिप्पणी में राजवंशीय अर्थ स्पष्ट करना
  alternative: राजवंश / वंश
  rationale: בַּיִת का मूल अर्थ ‘घर’ है, पर 2 शमूएल 7 में यह दाऊद के परिवार और राजकीय वंश को भी सूचित करता है। ‘घर’ अध्याय के शब्द-खेल और धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
- issue: אֱלֹהִים עַל יִשְׂרָאֵל में עַל का संबंध
  choice: इस्राएल पर परमेश्वर
  alternative: इस्राएल के परमेश्वर / इस्राएल के लिए परमेश्वर
  rationale: ‘पर’ मूल पूर्वसर्ग के अधिकार और प्रभुता-संबंधी अर्थ को सुरक्षित रखता है; ‘के परमेश्वर’ संबंध को अधिक सामान्य बनाकर इस सूक्ष्मता को मिटा सकता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, आदरसूचक ‘आप’ और ईश्वर के लिए ‘हैं’ के साथ रखी गई है। शैली प्रार्थनात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज है। मूल के प्रमुख मुहावरों—‘नाम’, ‘घर’ और ‘सामने’—को यथासंभव बनाए रखा गया है।
