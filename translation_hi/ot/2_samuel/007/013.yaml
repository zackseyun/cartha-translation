base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/013.yaml
  text: He will build a house for my name[a], and I will establish the throne of his kingdom forever.
translation:
  language: hi
  text: वह मेरे नाम के लिए एक घर[a] बनाएगा, और मैं उसके राज्य का सिंहासन सदा के लिए स्थिर करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे नाम के लिए एक मंदिर।” इब्रानी में शाब्दिक रूप से “मेरे नाम के लिए एक घर” है; इससे इस अध्याय में मंदिर और राजवंश के लिए प्रयुक्त “घर” का शब्द-साम्य बना रहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: वही
  rationale: स्वतंत्र तृतीय पुरुष एकवचन सर्वनाम कर्ता को स्पष्ट रूप से सामने रखता है; हिन्दी में ‘वही’ इस संकेत को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יִבְנֶה
  choice: बनाएगा
  rationale: वचन के इस प्रसंग में काल भविष्य की क्रिया दर्शाता है; ‘बनाएगा’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: בַּיִת
  choice: एक घर
  rationale: मूल शब्द का सीधा अर्थ ‘घर’ है। यहाँ उसका आशय पवित्रस्थान/मन्दिर से है, फिर भी ‘घर’ रखने से अध्याय में मन्दिर और राजवंश के बीच का शब्द-साम्य सुरक्षित रहता है।
- source_word: לִשְׁמִי
  choice: मेरे नाम के लिए
  rationale: यह इब्रानी पदबंध का सीधा और बोधगम्य रूप है तथा उसके वाचा-संबंधी आशय को अनावश्यक व्याख्या के बिना बनाए रखता है।
- source_word: וְכֹנַנְתִּי
  choice: और मैं ... दृढ़ करूँगा
  rationale: प्रतिज्ञा के क्रम में यह भविष्य की ईश्वरीय क्रिया है। ‘दृढ़ करूँगा’ स्थापित करने, स्थिरता देने और कायम रखने का भाव व्यक्त करता है।
- source_word: אֶת כִּסֵּא
  choice: राजगद्दी को
  rationale: राजकीय संदर्भ में כִּסֵּא का अर्थ सिंहासन अथवा राजगद्दी है; साधारण आधुनिक हिन्दी में ‘राजगद्दी’ शासनाधिकार का भाव स्पष्ट करती है।
- source_word: מַמְלַכְתּוֹ
  choice: उसके राज्य की
  rationale: यह राज्य अथवा राजकीय प्रभुत्व को दर्शाता है और ‘राजगद्दी’ के साथ स्वाभाविक सम्बन्ध बनाता है।
- source_word: עַד עוֹלָם
  choice: सदा के लिए
  rationale: वाचा की इस प्रतिज्ञा में पदबंध स्थायी निरन्तरता व्यक्त करता है; ‘सदा के लिए’ उसके पूरे बल को बनाए रखता है।
theological_decisions:
- issue: בַּיִת का अनुवाद ‘घर’ किया जाए या अर्थ खोलकर ‘मन्दिर’
  choice: घर
  alternative: मन्दिर
  rationale: निकट संदर्भ में भावी मन्दिर अभिप्रेत है, पर पूरे अध्याय में ‘घर’ शब्द पवित्रस्थान और राजवंश—दोनों से जुड़ा साहित्यिक तथा धर्मवैचारिक तनाव रखता है। मुख्य पाठ में ‘घर’ उस बहुअर्थकता को सुरक्षित रखता है।
- issue: עַד עוֹלָם की अवधि
  choice: सदा के लिए
  alternative: बहुत लम्बे समय तक
  rationale: दाऊद से की गई इस प्रतिज्ञा में पदबंध स्थायी निरन्तरता का प्रबल दावा करता है; इसे केवल अनिश्चित लम्बी अवधि कहना मूल कथन को कमजोर कर देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘घर’ मूल शब्दावली और अध्याय के शब्द-साम्य को सुरक्षित रखता है; ‘मन्दिर’ को पाद-टिप्पणी में स्पष्ट किया गया है।
