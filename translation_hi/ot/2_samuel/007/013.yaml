    issue: ‘वही’ is unnecessarily emphatic.
    rationale: Although Hebrew explicitly uses the pronoun הוּא, it does not necessarily convey the restrictive emphasis normally carried by Hindi ‘वही.’ Plain ‘वह’ preserves the subject without adding emphasis.
  - severity: low
    issue: ‘राजगद्दी’ is less direct than ‘सिंहासन.’
    rationale: The Hebrew כִּסֵּא literally denotes a throne. ‘सिंहासन’ is standard modern Hindi and maintains the concrete royal metaphor.
