base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/001.yaml
  text: When the king was living in his house[a], and Yahweh had given him rest on every side from all his enemies,
translation:
  language: hi
  text: जब राजा अपने घर[a] में रह रहा था और याहवे ने उसे उसके सभी शत्रुओं से हर ओर विश्राम दिया था,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने राजमहल में।’ इब्रानी में ‘अपने घर में’; यहाँ ‘घर’ रखा गया है, क्योंकि आगे इस अध्याय में इसी शब्द के विभिन्न अर्थों से शब्द-क्रीड़ा होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: जब
  rationale: यह इब्रानी कथात्मक सूत्र एक नए दृश्य की समय-संबंधी भूमिका बाँधता है। आधुनिक हिन्दी में ‘जब’ इसका स्वाभाविक अनुवाद है; अलग से ‘और ऐसा हुआ’ जोड़ना आवश्यक नहीं है।
- source_word: יָשַׁב
  choice: रह रहा था
  rationale: यहाँ क्रिया का अर्थ शारीरिक रूप से ‘बैठना’ नहीं, बल्कि अपने निवास में टिककर रहना है। अपूर्ण भूतकालीन अवस्था को ‘रह रहा था’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: मूल पाठ दाऊद का नाम लेने के बजाय निश्चित राजकीय उपाधि का प्रयोग करता है; हिन्दी में प्रसंग के कारण ‘राजा’ पर्याप्त रूप से निश्चित है।
- source_word: בְּבֵיתוֹ
  choice: अपने घर में
  rationale: בַּיִת का मूल अर्थ ‘घर’ है। राजकीय प्रसंग में ‘राजमहल’ संभव है, पर ‘घर’ अध्याय में आगे आने वाली साहित्यिक शब्द-क्रीड़ा को सुरक्षित रखता है।
- source_word: וַיהוָה
  choice: और याहवे
  rationale: संयोजक को वाक्य-संबंध के लिए रखा गया है और परमेश्वर के व्यक्तिगत वाचा-नाम को नाम के रूप में लिप्यंतरित किया गया है।
- source_word: הֵנִיחַ לוֹ
  choice: उसे … विश्राम दे चुका था
  rationale: नוח के हिफ़ील रूप में यहाँ युद्ध और शत्रुता से विश्राम दिलाने का कारक भाव है। ‘दे चुका था’ राजा के निवास की पृष्ठभूमि से पहले पूर्ण हो चुकी सुरक्षा को स्पष्ट करता है।
- source_word: מִסָּבִיב
  choice: चारों ओर
  rationale: यह चारों दिशाओं से मिली व्यापक सुरक्षा का स्वाभाविक हिन्दी बोध देता है।
- source_word: מִכָּל אֹיְבָיו
  choice: उसके सब शत्रुओं से
  rationale: यह विश्राम के स्रोत या कारण से मुक्ति को व्यक्त करता है और ‘सब’ मूल के כָּל को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय वाचा-नाम के रूप में प्रस्तुत करता है; ‘यहोवा’ पारंपरिक विकल्प है और ‘प्रभु’ सम्मानसूचक प्रतिस्थापन।
- issue: בַּיִת में राजकीय निवास का भाव
  choice: घर
  alternative: राजमहल
  rationale: ‘राजमहल’ प्रसंगानुकूल हो सकता है, पर ‘घर’ मूल शब्द की व्यापकता और आगे याहवे के ‘घर’ तथा दाऊद के ‘घर’ से संबंधित साहित्यिक एवं धर्मवैज्ञानिक तनाव को बिना पहले से सुलझाए बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य के अंत का अल्पविराम मूल और प्रसंग के अनुसार अगले पद में जारी रहने वाले आश्रित वाक्य को दर्शाता है। ‘विश्राम’ युद्ध से मिली सुरक्षा और राहत दोनों भावों को बनाए रखता है।
