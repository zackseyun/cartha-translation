base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/005.yaml
  text: 'Go and say to my servant David[a], ‘Thus says Yahweh: Would you build a house for me to dwell in?’'
translation:
  language: hi
  text: 'जा और मेरे सेवक दाऊद से कह, ‘याहवे यह कहता है: क्या तू मेरे निवास के लिए घर बनाएगा?[a]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे इस प्रकार भी समझा जा सकता है: “क्या तू ही वह है जो मेरे निवास के लिए घर बनाएगा?” इब्रानी में प्रश्न बलपूर्ण और आलंकारिक है।'
    reason: הַאַתָּה में निहित बल तथा प्रश्न के वैकल्पिक, अधिक स्पष्ट हिन्दी विस्तार को दर्शाता है।
lexical_decisions:
- source_word: לֵךְ וְאָמַרְתָּ
  choice: जा और ... कह
  rationale: आज्ञार्थक क्रिया और उसके बाद आए वाव-संयुक्त पूर्ण रूप को दो क्रमिक आदेशों के रूप में रखा गया है; एक पुरुष को संबोधित करते हुए एकवचन ‘जा/कह’ मूल के अनुरूप है।
- source_word: עַבְדִּי אֶל דָּוִד
  choice: मेरे सेवक दाऊद से
  rationale: ‘सेवक’ राजकीय-वाचा संबंधी सम्मानसूचक अर्थ देता है। स्वाभाविक हिन्दी के लिए दाऊद को ‘मेरे सेवक’ के समानाधिकरण में रखा गया है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यह कहता है
  rationale: यह नबी-संदेशवाहक का मानक सूत्र है। वर्तमानकालीन हिन्दी रूप संदेश की प्रत्यक्ष और औपचारिक घोषणा बनाए रखता है।
- source_word: הַאַתָּה תִּבְנֶה
  choice: क्या तू ... बनाएगा?
  rationale: प्रश्नवाचक कण और स्पष्ट सर्वनाम से उत्पन्न बल को ‘क्या तू’ सुरक्षित रखता है; प्रश्न की आलंकारिक प्रकृति को मुख्य पाठ में अतिरिक्त व्याख्या से तय नहीं किया गया।
- source_word: תִּבְנֶה לִּי בַיִת
  choice: मेरे ... लिए भवन बनाएगा
  rationale: ‘भवन’ सामान्य निर्माण और परमेश्वर के निवास-स्थान दोनों के लिए उपयुक्त है तथा आगे के ‘घर/वंश’ वाले शब्दालंकार को समय से पहले केवल ‘मन्दिर’ कहकर सीमित नहीं करता।
- source_word: לְשִׁבְתִּי
  choice: मेरे रहने के लिए
  rationale: लामेद सहित infinitive construct और प्रथम पुरुष प्रत्यय का उद्देश्य-सूचक अर्थ स्पष्ट और स्वाभाविक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है; लिप्यंतरण उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: בַיִת को भवन, घर या मन्दिर कहना
  choice: भवन
  alternative: घर / मन्दिर
  rationale: संदर्भ में उपासना-स्थल अभिप्रेत है, पर मूल शब्द सामान्य ‘घर/भवन’ है। ‘भवन’ हिन्दी में गरिमापूर्ण है और पाठ में समय से पहले विशिष्ट धार्मिक तकनीकी शब्द नहीं जोड़ता।
- issue: הַאַתָּה वाले प्रश्न का बल
  choice: मुख्य पाठ में ‘क्या तू ...?’ और पादटिप्पणी में बल स्पष्ट करना
  alternative: ‘क्या तू ही वह है जो ...?’
  rationale: मूल प्रश्न बलयुक्त और आलंकारिक है, लेकिन उसका सटीक हिन्दी विस्तार एक से अधिक प्रकार से किया जा सकता है; मुख्य पाठ संक्षिप्तता और वास्तविक अस्पष्टता बचाता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। दाऊद को सीधे संबोधित करने वाले एकवचन ‘तू’ से मूल के 2ms रूप और परमेश्वर की राजकीय वाणी का सीधापन सुरक्षित रखा गया है।
