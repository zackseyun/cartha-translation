  text: וּ/מִ֤י כְ/עַמְּ/ךָ֙ כְּ/יִשְׂרָאֵ֔ל גּ֥וֹי אֶחָ֖ד בָּ/אָ֑רֶץ אֲשֶׁ֣ר הָלְכֽוּ אֱ֠לֹהִים לִ/פְדּֽוֹת ל֨/וֹ לְ/עָ֜ם וְ/לָ/שׂ֧וּם ל֣/וֹ שֵׁ֗ם וְ/לַ/עֲשׂ֨וֹת לָ/כֶ֜ם הַ/גְּדוּלָּ֤ה וְ/נֹֽרָאוֹת֙ לְ/אַרְצֶ֔/ךָ מִ/פְּנֵ֣י עַמְּ/ךָ֗ אֲשֶׁ֨ר פָּדִ֤יתָ לְּ/ךָ֙ מִ/מִּצְרַ֔יִם גּוֹיִ֖ם וֵ/אלֹהָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/023.yaml
  text: And who is like your people[a], like Israel, the one nation on the earth whom God went to redeem for himself as a people, to make a name for himself, and to do for you great and fearsome things for your land before your people, whom you redeemed for yourself from Egypt[b], from nations and their gods?
translation:
  language: hi
  text: और तेरी प्रजा, इस्राएल के समान कौन है—पृथ्वी पर वह एकमात्र जाति जिसे परमेश्वर अपने लिए प्रजा के रूप में छुड़ाने, अपने लिए नाम बनाने और तुम लोगों के लिए महान और भयावह[a] कार्य करने के लिए गया—तेरी भूमि के लिए और तेरी प्रजा के सामने? उस प्रजा को तूने अपने लिए मिस्र से छुड़ाया[b], जातियों और उनके देवताओं से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘महान और विस्मयकारी कार्य।’ इब्रानी शब्द ऐसे कार्यों का सूचक हो सकता है जो विस्मय, भय या आतंक उत्पन्न करें।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में अंतिम वाक्यांश कठिन है। अन्य संभावित अर्थ हैं: ‘मिस्र से—जातियों और उसके देवता से’ या ‘मिस्र से, जातियों और देवताओं से।’'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִי כְעַמְּךָ כְיִשְׂרָאֵל
  choice: और तेरी प्रजा इस्राएल के समान कौन है
  rationale: अतुलनीयता व्यक्त करने वाले आलंकारिक प्रश्न और इस्राएल की बलाघातपूर्ण पहचान, दोनों को बनाए रखता है।
- source_word: גּוֹי אֶחָד בָּאָרֶץ
  choice: पृथ्वी पर वह एकमात्र जाति
  rationale: संदर्भ में אֶחָד की विशिष्टता और आलंकारिक उत्कृष्टता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר הָלְכוּ אֱלֹהִים
  choice: जिसे परमेश्वर ... गया
  rationale: אֱלֹהִים का यहाँ एकवचन अर्थ है; ‘गया’ मूल के ठोस गतिशील बिंब को बनाए रखता है।
- source_word: לִפְדּוֹת לוֹ לְעָם
  choice: अपने लिए प्रजा के रूप में छुड़ाने
  rationale: פדה के छुटकारे के भाव तथा अपने लिए एक प्रजा बनाने के वाचागत परिणाम को सुरक्षित रखता है।
- source_word: וְלָשׂוּם לוֹ שֵׁם
  choice: अपने लिए नाम बनाने
  rationale: यश प्राप्त करने के इब्रानी मुहावरे का स्वाभाविक और अर्थनिष्ठ हिन्दी रूप है।
- source_word: וְלַעֲשׂוֹת לָכֶם
  choice: और तुम लोगों के लिए ... काम करने
  rationale: लָכֶם के स्पष्ट द्वितीय पुरुष बहुवचन को बनाए रखता है, उसे पास के एकवचन संबोधनों में विलीन नहीं करता।
- source_word: הַגְּדוּלָּה וְנֹרָאוֹת
  choice: बड़े और भयावह काम
  rationale: महानता के साथ ऐसे कार्यों का भाव रखता है जो विस्मय, भय या आतंक उत्पन्न करते हैं।
- source_word: לְאַרְצְךָ מִפְּנֵי עַמְּךָ
  choice: तेरे देश के लिए और तेरी प्रजा के सामने
  rationale: भूमि-संबंधी अर्थ और מִפְּנֵי के स्थानिक ‘सामने/आगे से’ भाव को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: אֲשֶׁר פָּדִיתָ לְּךָ מִמִּצְרַיִם
  choice: जिसे तूने अपने लिए मिस्र से छुड़ाया
  rationale: פדה की पुनरावृत्ति को ‘छुड़ाया’ से दर्शाता और covenantal possession के לְךָ को ‘अपने लिए’ से सुरक्षित रखता है।
- source_word: גּוֹיִם וֵאלֹהָיו
  choice: जातियों और उनके देवताओं से
  rationale: कठिन संक्षिप्त अंतिम वाक्यांश का प्रसंगानुकूल पाठ है; इब्रानी की वैकल्पिक संभावनाएँ पादटिप्पणी में दी गई हैं।
theological_decisions:
- issue: אֱלֹהִים की संख्या और संदर्भ
  choice: एकवचन ‘परमेश्वर’, अर्थात इस्राएल का परमेश्वर
  alternative: बहुवचन ‘देवता’
  rationale: प्रसंग इस्राएल के परमेश्वर के अद्वितीय उद्धारकारी कार्य की ओर संकेत करता है; बहुवचन अनुवाद आशय को विकृत करेगा।
- issue: לָכֶם और पास के एकवचन संबोधनों के बीच पुरुष-वचन परिवर्तन
  choice: बहुवचन को ‘तुम लोगों के लिए’ और एकवचन को ‘तेरे/तूने’ के रूप में खुलकर बनाए रखना
  alternative: सब संबोधनों को एकवचन बनाकर समतल करना
  rationale: मसोरेटिक पाठ में उपस्थित व्याकरणिक तनाव को सुधारकर हटाने के बजाय सुरक्षित रखा गया है।
- issue: कठिन अंतिम पदबंध גּוֹיִם וֵאלֹהָיו
  choice: ‘जातियों और उनके देवताओं से’
  alternative: ‘मिस्र से—जातियों और उसके देवता से’ अथवा ‘मिस्र से, जातियों और देवताओं से’
  rationale: चुना गया पाठ निर्गमन-विजय के व्यापक प्रसंग में सर्वाधिक सुगम है, पर मूल की कठिनता और दूसरे संभावित पाठ पादटिप्पणी में स्पष्ट रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। परमेश्वर के लिए पारंपरिक एकवचन निकट संबोधन ‘तू/तेरे’ रखा गया है, जबकि मूल के לָכֶם को जानबूझकर ‘तुम लोगों के लिए’ कहा गया है ताकि पाठ का वचन-परिवर्तन न मिटे। दीर्घ इब्रानी वाक्य को डैशों से व्यवस्थित किया गया है, पर उसकी आलंकारिक प्रश्न-रचना और तनाव सुरक्षित हैं।
