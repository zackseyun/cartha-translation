  yaml_path: translation/ot/2_samuel/007/017.yaml
  text: According to all these words and according to all this vision[a], so Nathan spoke to David.
translation:
  language: hi
  text: इन सब वचनों के अनुसार और इस पूरे दर्शन[a] के अनुसार, नातान ने दाऊद से वैसा ही कहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रकाशन।” इब्रानी शब्द भविष्यद्वक्ता को मिले प्रकाशन को दर्शाता है, जो प्रायः दर्शन के रूप में प्राप्त होता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל
  choice: इन सब ... के अनुसार
  rationale: כְּ correspondence को और כֹל समग्रता को व्यक्त करता है। हिंदी में ‘इन सब ... के अनुसार’ स्वाभाविक रहते हुए इब्रानी संरचना को बनाए रखता है।
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: इन सब वचनों
  rationale: यहाँ דְּבָרִים परमेश्वर के बताए हुए संदेश की मौखिक विषय-वस्तु है; इसलिए ‘वचन’ ‘बातों’ की अपेक्षा अधिक सटीक और गरिमापूर्ण है।
- source_word: וּכְכֹל
  choice: और ... पूरे ... के अनुसार
  rationale: संयोजक और दोहराए गए तुलनात्मक पदबंध को रखा गया है, ताकि वचनों और दर्शन के बीच इब्रानी समानांतरता बनी रहे।
- source_word: הַחִזָּיוֹן הַזֶּה
  choice: इस पूरे दर्शन
  rationale: חִזָּיוֹן भविष्यद्वक्ता को प्राप्त दर्शनीय प्रकाशन का संकेत देता है। ‘दर्शन’ इसका सीधा हिंदी प्रतिरूप है; ‘पूरे’ כֹל को व्यक्त करता है।
- source_word: כֵּן
  choice: ठीक वैसा ही
  rationale: כֵּן पहले आए ‘के अनुसार’ पदबंधों को समेटकर नातान के पूरी निष्ठा से वही कहने पर बल देता है। ‘ठीक वैसा ही’ हिंदी में इस अनुवर्ती और तुलनात्मक बल को स्पष्ट करता है।
- source_word: דִּבֶּר
  choice: कहा
  rationale: דבר का मूल अर्थ बोलना है। इस संदर्भ में संदेश किसी व्यक्ति से कहे जाने के कारण ‘कहा’ सहज आधुनिक हिंदी है।
- source_word: נָתָן
  choice: नातान
  rationale: व्यक्तिवाचक नाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
- source_word: אֶל דָּוִד
  choice: दाऊद से
  rationale: אֶל वाणी की दिशा दाऊद की ओर दर्शाता है। हिंदी में ‘दाऊद से कहा’ स्वाभाविक प्रयोग है और अर्थतः ‘दाऊद को कहा’ के समान है।
theological_decisions:
- issue: חִזָּיוֹן में भविष्यद्वाणी के प्रकाशन का स्वरूप
  choice: मुख्य पाठ में ‘दर्शन’
  alternative: ‘प्रकाशन’ या ‘भविष्यदर्शी दर्शन’
  rationale: ‘दर्शन’ इब्रानी शब्द के दर्शनीय और भविष्यद्वक्ताई स्वरूप को सीधे सुरक्षित रखता है। ‘प्रकाशन’ व्यापक अर्थ देता, जबकि ‘भविष्यदर्शी दर्शन’ पाठ में निहित बात को अनावश्यक रूप से विस्तार देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। ‘के अनुसार’ की पुनरावृत्ति इब्रानी समानांतरता को सुरक्षित रखती है, जबकि ‘ठीक वैसा ही कहा’ हिंदी में निष्कर्ष को स्वाभाविक बनाता है।
