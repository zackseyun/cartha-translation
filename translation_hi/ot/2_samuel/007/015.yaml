  yaml_path: translation/ot/2_samuel/007/015.yaml
  text: But my steadfast love will not depart from him[a], as I removed it from Saul[b], whom I removed from before you.
translation:
  language: hi
  text: परन्तु मेरा अटल प्रेम उससे दूर न होगा[a], जैसे मैंने उसे शाऊल से हटा दिया था, जिसे मैंने तुम्हारे सामने से हटा दिया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अटल प्रेम’ का अनुवाद ‘कृपालु प्रेम’ या ‘वाचा की निष्ठा’ भी किया जा सकता है। हिब्रू शब्द वाचा के संबंध में निष्ठावान और स्थिर प्रेम का भाव रखता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: ‘जिसे मैंने तुम्हारे सामने से हटा दिया।’ यह केवल शारीरिक रूप से दूर किए जाने के बजाय दाऊद के संबंध में शाऊल को उसके पद से हटाए जाने की ओर भी संकेत कर सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדִּי
  choice: मेरा अटल प्रेम
  rationale: חֶסֶד यहाँ वाचा के संबंध में परमेश्वर के स्थिर, निष्ठावान प्रेम को व्यक्त करता है। ‘अटल प्रेम’ आधुनिक और सहज हिन्दी में उसकी दृढ़ता तथा संबंधपरक गहराई बनाए रखता है।
- source_word: יָסוּר
  choice: दूर न होगा
  rationale: סור का अर्थ हटना, मुड़ना या दूर होना है। प्रेम को कर्ता मानते हुए ‘दूर न होगा’ स्वाभाविक हिन्दी है और हिब्रू के भाव को सुरक्षित रखता है।
- source_word: מִמֶּנּוּ
  choice: उससे
  rationale: מן और सर्वनाम-प्रत्यय अलगाव का सीधा अर्थ देते हैं; यहाँ संकेत प्रतिज्ञात पुत्र अथवा राजवंशी उत्तराधिकारी की ओर है।
- source_word: כַּאֲשֶׁר
  choice: जैसे
  rationale: यह शाऊल के साथ किए गए व्यवहार से तुलना प्रस्तुत करता है; ‘जैसे’ इसका स्वाभाविक हिन्दी समतुल्य है।
- source_word: הֲסִרֹתִי מֵעִם שָׁאוּל
  choice: मैंने शाऊल से हटा लिया था
  rationale: हिफ़ील रूप कारणात्मक ‘हटा देना’ व्यक्त करता है। कर्म पूर्ववर्ती ‘मेरा अटल प्रेम’ से समझा जाता है; हिन्दी में ‘हटा लिया’ इसे स्पष्ट और स्वाभाविक रखता है।
- source_word: אֲשֶׁר הֲסִרֹתִי מִלְּפָנֶיךָ
  choice: जिसे मैंने तुम्हारे सामने से हटा दिया था
  rationale: מִלְּפָנֶיךָ का शाब्दिक चित्र ‘तुम्हारे सामने से’ है। इसे बनाए रखने से शाऊल को दाऊद के संबंध में हटाए जाने का भाव रहता है और राजपद का अर्थ अनावश्यक रूप से पाठ में नहीं जोड़ा जाता।
theological_decisions:
- issue: दाऊदी वाचा के प्रसंग में חֶסֶד का स्वरूप
  choice: ‘अटल प्रेम’
  alternative: ‘करुणा’, ‘कृपा’ या ‘वाचा की निष्ठा’
  rationale: पद परमेश्वर के दाऊद के वंश के प्रति बने रहने वाले अनुग्रह और शाऊल से उसके हटाए जाने के बीच अंतर करता है। ‘अटल प्रेम’ वाचागत निष्ठा को व्यक्त करता है, पर किसी संकीर्ण धर्मवैज्ञानिक सूत्र को आरोपित नहीं करता।
- issue: ‘तुम्हारे सामने से’ का आशय
  choice: हिब्रू स्थानिक-संबंधपरक अभिव्यक्ति को मुख्य पाठ में बनाए रखना
  alternative: ‘तुम्हारी उपस्थिति से’ या ‘तुम्हारे सामने राजा के पद से’
  rationale: हिब्रू अभिव्यक्ति शाऊल को दाऊद के संबंध में हटाए जाने की ओर संकेत करती है, पर हटाए जाने के ढंग को पूरी तरह स्पष्ट नहीं करती। मूल चित्र बनाए रखने से वास्तविक अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परन्तु’ और ‘अटल प्रेम’ बाइबिलीय गंभीरता बनाए रखते हैं; ‘तुम्हारे सामने से’ मूल हिब्रू की खुली अभिव्यक्ति को सुरक्षित रखता है।
