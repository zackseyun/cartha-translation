base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/021.yaml
  text: Because of your word and according to your heart[a], you have done all this greatness[c][b], to make your servant know it.
translation:
  language: hi
  text: अपने वचन के कारण और अपने हृदय के अनुसार[a], आपने यह सारी महानता[b] की है, ताकि अपने दास को यह ज्ञात कराएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘अपने हृदय के अनुसार’; यहाँ ‘हृदय’ अपने अभिप्राय या इच्छा का बोध कराता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में एकवचन भाव है: ‘यह सारी महानता’; कुछ अनुवाद इसे ‘ये सब महान कार्य’ कहते हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲבוּר דְּבָרְךָ
  choice: अपने वचन के कारण
  rationale: בַּעֲבוּר कारण या आधार व्यक्त करता है, और דָּבָר का अर्थ यहाँ परमेश्वर का कहा हुआ वचन, संभवतः प्रतिज्ञा, है। ‘वचन’ मूल की अर्थ-व्याप्ति को ‘प्रतिज्ञा’ से अधिक सुरक्षित रखता है।
- source_word: וּכְלִבְּךָ
  choice: और अपने मन के अनुसार
  rationale: לֵב आंतरिक इच्छा, अभिप्राय या संकल्प का बोध कराता है। आधुनिक हिन्दी में ‘मन’ स्वाभाविक है और इब्रानी देहात्मक रूपक को पूरी तरह अमूर्त नहीं बनाता।
- source_word: עָשִׂיתָ
  choice: आपने ... की है
  rationale: पूर्ण क्रिया को दाऊद की प्रार्थना में वर्तमान प्रासंगिकता सहित सम्पन्न कार्य के रूप में व्यक्त करता है।
- source_word: אֵת כָּל הַגְּדוּלָּה הַזֹּאת
  choice: यह सारी महानता
  rationale: मूल में एकवचन भाववाचक संज्ञा ‘महानता’ है; इसे बहुवचन ‘महान कार्य’ बनाने के बजाय परमेश्वर के कार्य की एकीकृत महानता सुरक्षित रखी गई है।
- source_word: לְהוֹדִיעַ
  choice: ज्ञात कराएँ
  rationale: ידע के हिफ़ील रूप का कारणवाचक अर्थ ‘जानने देना/ज्ञात कराना’ है। ‘ज्ञात कराएँ’ इसे संक्षिप्त और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: עַבְדֶּךָ
  choice: अपने दास को
  rationale: राजकीय प्रार्थना में यह दाऊद का परमेश्वर के सामने विनम्र आत्म-संबोधन है; ‘दास’ हिन्दी बाइबलीय भाषा में सटीक और परिचित है।
theological_decisions:
- issue: वाचा के प्रसंग में ‘आपके वचन’ का संदर्भ
  choice: अपने वचन के कारण
  alternative: अपनी प्रतिज्ञा के कारण
  rationale: प्रसंग परमेश्वर की दाऊद से कही गई वाचा-संबंधी बात की ओर संकेत करता है, पर मूल में सामान्य शब्द ‘वचन’ है। इसे बनाए रखने से पाठ की व्यापकता और संभावित प्रतिज्ञात्मक अर्थ दोनों सुरक्षित रहते हैं।
- issue: परमेश्वर के लिए ‘हृदय’ संबंधी रूपक
  choice: अपने मन के अनुसार
  alternative: अपनी इच्छा के अनुसार
  rationale: मूल का לֵב परमेश्वर के आंतरिक अभिप्राय या इच्छा को व्यक्त करता है। ‘मन’ रूपकात्मक मानवीय भाषा को बनाए रखता है, जबकि ‘इच्छा’ उसे अधिक व्याख्यात्मक बना देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक ‘आप’ का प्रयोग किया गया है। शैली प्रार्थनापूर्ण, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वचन,’ ‘मन,’ ‘महानता,’ और ‘दास’ मूल की शब्दावली व रूपक के निकट हैं; अस्वाभाविक शब्दशः संरचना से बचने के लिए वाक्य-विन्यास हिन्दी के अनुरूप किया गया है।
