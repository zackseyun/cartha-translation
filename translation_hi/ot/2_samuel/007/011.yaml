source:
  edition: WLC
  text: וּ/לְ/מִן הַ/יּ֗וֹם אֲשֶׁ֨ר צִוִּ֤יתִי שֹֽׁפְטִים֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וַ/הֲנִיחֹ֥תִי לְ/ךָ֖ מִ/כָּל אֹיְבֶ֑י/ךָ וְ/הִגִּ֤יד לְ/ךָ֙ יְהוָ֔ה כִּי בַ֖יִת יַעֲשֶׂה לְּ/ךָ֥ יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/011.yaml
  text: and from the day that I appointed judges over my people Israel[a]. And I have given you rest from all your enemies. Yahweh also declares to you that Yahweh will make a house for you.
translation:
  language: hi
  text: 'और उस दिन से, जब मैंने अपनी प्रजा इस्राएल पर न्यायियों को नियुक्त किया। और मैंने तुझे तेरे सब शत्रुओं से विश्राम दिया है। याहवे तुझे यह भी बताता है कि याहवे तेरे लिए एक घर बनाएगा[a]।


    [a] “घर” से यहाँ संभवतः राजघराना या राजवंश अभिप्रेत है। साथ ही, यह शब्द याहवे के लिए एक घर, अर्थात् मंदिर, बनाने की दाऊद की इच्छा की प्रतिध्वनि भी करता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “घर” से यहाँ संभवतः राजघराना या राजवंश अभिप्रेत है। साथ ही, यह शब्द याहवे के लिए एक घर, अर्थात् मंदिर, बनाने की दाऊद की इच्छा की प्रतिध्वनि भी करता है।
    reason: בַּיִת की भवन और राजवंश संबंधी जानबूझकर रखी गई द्विअर्थकता स्पष्ट करना, बिना उसे निश्चित रूप से केवल एक अर्थ तक सीमित किए।
lexical_decisions:
- source_word: וּלְמִן הַיּוֹם
  choice: और उस दिन से
  rationale: यह पूर्ववर्ती वाक्य से जुड़ी समय-सूचक अभिव्यक्ति है; खण्डित पद-सीमा को समतल किए बिना उसके संयोजक और कालगत बल को बनाए रखती है।
- source_word: צִוִּיתִי שֹׁפְטִים
  choice: मैंने ... न्यायियों को नियुक्त किया
  rationale: צוה का मूल अर्थ ‘आज्ञा देना’ है, पर इस रचना में न्यायियों को अधिकारपूर्वक ठहराने या नियुक्त करने का भाव है।
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल पर
  rationale: עַל यहाँ शासन-अधिकार का संबंध व्यक्त करता है, इसलिए ‘पर’ उपयुक्त है।
- source_word: וַהֲנִיחֹתִי לְךָ מִכָּל אֹיְבֶיךָ
  choice: और मैंने तुझे तेरे सब शत्रुओं से विश्राम दिया है
  rationale: נוח के हिफ़ील रूप में विश्राम या राहत देने का भाव है; पूर्ण क्रिया को वर्तमान परिणाम सहित व्यक्त किया गया है।
- source_word: וְהִגִּיד לְךָ יְהוָה
  choice: याहवे तुझसे यह भी घोषणा करता है
  rationale: נגד के हिफ़ील का अर्थ बताना या घोषणा करना है। ‘भी’ संयोजक וְ के प्रसंगगत मोड़ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी लिप्यन्तरण में रखा गया है।
- source_word: כִּי בַיִת יַעֲשֶׂה לְּךָ יְהוָה
  choice: कि याहवे तेरे लिए एक घर बनाएगा
  rationale: ‘घर’ भवन और वंश—दोनों की साहित्यिक प्रतिध्वनि बनाए रखता है; ‘राजवंश’ कहने से निहित द्विअर्थकता समय से पहले समाप्त हो जाती।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा-नाम प्रत्यक्ष है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित नहीं करता।
- issue: दाऊदी प्रतिज्ञा में בַּיִת का अर्थ
  choice: घर, और पादटिप्पणी में राजघराने/राजवंश का संकेत
  alternative: राजवंश / राजघराना / मन्दिर
  rationale: इब्रानी शब्द दाऊद की मन्दिर बनाने की इच्छा और उसके लिए स्थापित होने वाले वंश के बीच जानबूझकर शब्द-क्रीड़ा करता है; मुख्य पाठ में ‘घर’ इस तनाव को सुरक्षित रखता है।
- issue: וְהִגִּיד में संयोजक וְ का प्रसंगगत बल
  choice: यह भी घोषणा करता है
  alternative: और ... घोषणा करता है / घोषणा करता है
  rationale: ‘भी’ पिछले उपकारों के साथ आने वाली अतिरिक्त दैवी घोषणा को दर्शाता है, यद्यपि साधारण ‘और’ भी व्याकरणतः संभव है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण पर सामान्य पाठक के लिए सुबोध। दाऊद को एकवचन निकट संबोधन ‘तू/तुझे/तेरे’ में रखा गया है, जैसा प्रत्यक्ष दैवी संबोधन में स्वाभाविक है। पद का आरम्भ पिछले पद से व्याकरणिक रूप से जुड़ा है, इसलिए उसके आरम्भिक खण्ड की अपूर्णता को कृत्रिम रूप से नहीं भरा गया।
