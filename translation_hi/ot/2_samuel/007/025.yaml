  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהִ֔ים הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבַּ֤רְתָּ עַֽל עַבְדְּ/ךָ֙ וְ/עַל בֵּית֔/וֹ הָקֵ֖ם עַד עוֹלָ֑ם וַ/עֲשֵׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/025.yaml
  text: And now[a], Yahweh God, confirm forever the word that you have spoken concerning your servant and concerning his house[b], and do as you have spoken.
translation:
  language: hi
  text: और अब, हे याहवे परमेश्वर, तूने अपने दास और उसके घराने[b] के विषय में जो वचन[a] कहा है, उसे सदा के लिए स्थिर कर, और जैसा तूने कहा है वैसा ही कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रतिज्ञा’।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘घराने’ से केवल दाऊद का परिवार या घर-परिवार नहीं, बल्कि उसका राजघराना या राजवंश भी अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: याहवे के बाद सीधे संबोधन में प्रयुक्त सामान्य ईश्वरीय उपाधि के लिए स्वाभाविक और गरिमापूर्ण हिन्दी शब्द।
- source_word: הַדָּבָר
  choice: वचन
  rationale: यहाँ शब्द परमेश्वर द्वारा कही गई बात को दर्शाता है। ‘वचन’ मूल अभिव्यक्ति को बनाए रखता है, जबकि प्रसंग में निहित ‘प्रतिज्ञा’ को पादटिप्पणी में दिया गया है।
- source_word: דִּבַּרְתָּ
  choice: तूने ... कहा है
  rationale: पूर्ण क्रिया परमेश्वर के पहले कहे हुए वचन और उसकी वर्तमान प्रासंगिकता की ओर संकेत करती है; हिन्दी में ‘कहा है’ स्वाभाविक है।
- source_word: עַל
  choice: के विषय में
  rationale: यह परमेश्वर के कथन की विषयवस्तु बताता है और आधुनिक हिन्दी में स्पष्ट है।
- source_word: עַבְדְּךָ
  choice: अपने दास
  rationale: राजकीय प्रार्थना में यह परमेश्वर के सामने दीन सेवक होने की पारंपरिक अभिव्यक्ति है; ‘दास’ इस गंभीर संबोधन को सुरक्षित रखता है।
- source_word: בֵּיתוֹ
  choice: उसके घराने
  rationale: ‘घराना’ हिन्दी में परिवार और वंश, दोनों का भाव रख सकता है और इस अध्याय की राजवंशीय शब्द-क्रीड़ा को ‘राजवंश’ की अपेक्षा अधिक खुला रखता है। राजवंशीय अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: הָקֵם
  choice: स्थिर कर
  rationale: हिफ़िल आज्ञार्थक का आशय कहे हुए वचन को दृढ़ता से कायम करना है; ‘स्थिर कर’ हिन्दी में वचन के साथ स्वाभाविक बैठता है।
- source_word: עַד עוֹלָם
  choice: सदा के लिए
  rationale: यह मुहावरा निरंतर स्थायित्व व्यक्त करता है; ‘सदा के लिए’ आधुनिक और सहज हिन्दी है।
- source_word: וַעֲשֵׂה
  choice: और ... कर
  rationale: मूल की संक्षिप्त और व्यापक क्रिया को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: जैसा तूने कहा है वैसा ही
  rationale: पहले आए ‘कहा है’ को दोहराकर मूल पाठ की प्रतिध्वनि और इस आग्रह को सुरक्षित रखा गया है कि परमेश्वर अपने कथन के अनुसार कार्य करे।
theological_decisions:
- issue: क्या הַדָּבָר का अनुवाद ‘वचन’ किया जाए या वाचा-संबंधी अधिक व्याख्यात्मक ‘प्रतिज्ञा’
  choice: वचन
  alternative: प्रतिज्ञा
  rationale: प्रसंग प्रतिज्ञा का है, पर इब्रानी पाठ शाब्दिक रूप से उस ‘वचन’ की बात करता है जिसे परमेश्वर ने कहा। मुख्य पाठ में ‘वचन’ मूल की अभिव्यक्ति और प्रसंगगत अर्थ के बीच तनाव को बनाए रखता है।
- issue: क्या בֵּיתוֹ को सीधे ‘राजवंश’ कहा जाए
  choice: उसके घराने
  alternative: उसके राजवंश
  rationale: दाऊद के राजवंश का अर्थ इस अध्याय में महत्त्वपूर्ण है, फिर भी ‘घर/घराना’ अध्याय की केंद्रीय वाचाई उपमा है। इसलिए मुख्य पाठ में ‘घराना’ रखा गया और राजवंशीय आशय पादटिप्पणी में बताया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर के लिए एकवचन निकट संबोधन ‘तू’ मूल इब्रानी के सीधे संबोधन और हिन्दी की पारंपरिक भक्तिपरक शैली के अनुरूप है। वाक्य-विन्यास को स्वाभाविक बनाने के लिए संबंधवाचक खंड को ‘जो वचन’ के साथ रखा गया है।
