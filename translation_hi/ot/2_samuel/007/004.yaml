  yaml_path: translation/ot/2_samuel/007/004.yaml
  text: But that night the word of Yahweh came to Nathan[a], saying,
translation:
  language: hi
  text: 'लेकिन उसी रात याहवे का वचन नातान के पास पहुँचा[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “और ऐसा हुआ कि उस रात याहवे का वचन नातान के पास आया, यह कहते हुए:”'
    reason: मूल हिब्रू में וַיְהִי दो बार आया है; मुख्य पाठ स्वाभाविक हिन्दी के लिए कथन को संक्षिप्त करता है, जबकि यह विकल्प उसकी औपचारिक संरचना दिखाता है।
lexical_decisions:
- source_word: וַיְהִי
  choice: लेकिन
  rationale: यह कथात्मक क्रम को आगे बढ़ाता है; पिछले पद में नातान की सहमति के विपरीत अब याहवे का वचन आता है, इसलिए आधुनिक हिन्दी में ‘लेकिन’ प्रसंगगत विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּלַּיְלָה הַהוּא
  choice: उसी रात
  rationale: शाब्दिक अर्थ ‘उस रात’ है; ‘उसी रात’ तत्काल प्रसंग और समय की निश्चितता को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וַיְהִי דְּבַר יְהוָה
  choice: याहवे का वचन ... पहुँचा
  rationale: यह भविष्यद्वाणी-संबंधी प्रचलित सूत्र है। हिब्रू में ‘वचन हुआ’ है, पर प्राप्तकर्ता के साथ आधुनिक हिन्दी में ‘वचन ... पहुँचा’ प्रकाशना के आने का स्वाभाविक अर्थ देता है और ‘वचन’ की बाइबलीय महत्ता बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले ईश्वरीय निज नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में उसके प्रचलित लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: אֶל נָתָן
  choice: नातान के पास
  rationale: אֶל वचन के प्राप्तकर्ता की दिशा बताता है; ‘नातान के पास’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह क्रिया अगले पद में आने वाले सीधे कथन का परिचय देती है। हिन्दी में विसर्ग-चिह्न कथन की भूमिका को ‘यह कहते हुए’ जैसे भारी प्रयोग की अपेक्षा अधिक स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में निज नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है; ‘यहोवा’ एक वैकल्पिक पारंपरिक स्वरूप है और ‘प्रभु’ नाम के स्थान पर उपाधि रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वचन’ भविष्यद्वाणी-संबंधी पारंपरिक शब्दावली को बनाए रखता है; वाक्य के अंत का विसर्ग-चिह्न अगले पद में आने वाले सीधे कथन की भूमिका बाँधता है।
