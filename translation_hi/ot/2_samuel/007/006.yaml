base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/006.yaml
  text: For I have not dwelt in a house from the day I brought up the sons of Israel out of Egypt to this day[b][a], but I have been moving about in a tent and in a tabernacle.
translation:
  language: hi
  text: क्योंकि जिस दिन मैं इस्राएल के पुत्रों को मिस्र से निकाल लाया, उस दिन से लेकर आज तक मैं किसी घर में नहीं रहा,[a] बल्कि तम्बू और निवासस्थान में चलता-फिरता रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएलियों को”; परम्परागत रूप से, “इस्राएल की सन्तान को।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: मैं किसी भवन में नहीं रहा
  rationale: ישׁב का यहाँ अर्थ निवास करना या रहना है। वर्तमान तक फैली अवधि को हिन्दी में ‘नहीं रहा’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּבַיִת
  choice: किसी भवन में
  rationale: בַיִת यहाँ अनिश्चित है और स्थायी निर्मित निवास को दर्शाता है। ‘भवन’ आगे आने वाले तम्बू और निवास-स्थान से स्पष्ट विरोध रखता है, जबकि ‘मन्दिर’ कहना मूल शब्द से अधिक व्याख्यात्मक होता।
- source_word: לְמִיּוֹם הַעֲלֹתִי
  choice: जिस दिन मैं ... निकाल लाया, उस दिन से
  rationale: यह पद समय के आरम्भ-बिन्दु को बताता है। עלה का हिफ़ील निर्गमन-सन्दर्भ में ऊपर ले आने/निकाल लाने का भाव रखता है; हिन्दी में ‘मिस्र से निकाल लाया’ स्वाभाविक है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह अनुवाद इब्रानी के पुल्लिंग बहुवचन संरचनात्मक रूप को बनाए रखता है; अधिक सहज विकल्प ‘इस्राएलियों’ को पादटिप्पणी में दिया गया है।
- source_word: מִמִּצְרַיִם
  choice: मिस्र से
  rationale: מן निर्गमन के स्रोत को व्यक्त करता है; ‘निकाल लाया’ के साथ ‘मिस्र से’ स्पष्ट और स्वाभाविक है।
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: यह प्रचलित हिन्दी कालवाचक अभिव्यक्ति इब्रानी के ‘इस दिन तक’ का निरन्तर समय-बोध रखती है।
- source_word: וָאֶהְיֶה מִתְהַלֵּךְ
  choice: बल्कि ... चलता-फिरता रहा हूँ
  rationale: התהלך निरन्तर इधर-उधर जाने का भाव देता है। ‘बल्कि’ स्थायी भवन में न रहने और चलायमान उपस्थिति के बीच निहित विरोध को स्वाभाविक हिन्दी में दिखाता है।
- source_word: בְּאֹהֶל
  choice: तम्बू में
  rationale: אֹהֶל का मूल अर्थ तम्बू है और यह चलायमान पवित्रस्थान की छवि बनाए रखता है। संयुक्त पद में परसर्ग अन्त में रखकर ‘तम्बू और निवास-स्थान में’ स्वाभाविक हिन्दी बनती है।
- source_word: וּבְמִשְׁכָּן
  choice: और निवास-स्थान में
  rationale: מִשְׁכָּן का शाब्दिक अर्थ निवास-स्थान है और इस प्रसंग में वह चलायमान पवित्र निवास को सूचित करता है। ‘मिलापवाला तम्बू’ जैसी विशेष परम्परागत व्याख्या थोपे बिना मूल के ‘तम्बू’ और ‘निवास-स्थान’ दोनों पद सुरक्षित रखे गए हैं।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का लिंग-सूचक अनुवाद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों / इस्राएल की सन्तान
  rationale: मूल का स्पष्ट पुल्लिंग बहुवचन रूप मुख्य पाठ में रखा गया है, पर सामान्य सामुदायिक अर्थ वाला सहज विकल्प पादटिप्पणी में बताया गया है।
- issue: מִשְׁכָּן के लिए पवित्रस्थान-संबंधी शब्द
  choice: निवास-स्थान
  alternative: पवित्र तम्बू / तम्बू-निवास
  rationale: ‘निवास-स्थान’ शब्द के मूल अर्थ को सुरक्षित रखता है और साथ आए אֹהֶל ‘तम्बू’ को अनावश्यक रूप से दोहराता नहीं। प्रसंग इसे परमेश्वर के चलायमान पवित्र निवास के रूप में स्पष्ट करता है।
- issue: चलायमान उपस्थिति और स्थायी भवन का विरोध
  choice: बल्कि ... चलता-फिरता रहा हूँ
  alternative: और ... चलता रहा हूँ
  rationale: इब्रानी वाव स्वयं केवल संयोजक हो सकता है, पर सन्दर्भ में स्थायी भवन और चलायमान तम्बू के बीच स्पष्ट विरोध है; ‘बल्कि’ उसी निहित सम्बन्ध को व्यक्त करता है, कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य हिन्दी रखी गई है। ‘भवन’ स्थायी निर्मित आवास और चलायमान तम्बू के विरोध को स्पष्ट करता है। ‘निवास-स्थान’ מִשְׁכָּן की शाब्दिक व्यापकता बचाता है; वाक्य में ‘तम्बू और निवास-स्थान में’ मूल के दोनों निकटार्थक पदों को अलग रखता है।
