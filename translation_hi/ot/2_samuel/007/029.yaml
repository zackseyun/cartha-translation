  text: וְ/עַתָּ֗ה הוֹאֵל֙ וּ/בָרֵךְ֙ אֶת בֵּ֣ית עַבְדְּ/ךָ֔ לִ/הְי֥וֹת לְ/עוֹלָ֖ם לְ/פָנֶ֑י/ךָ כִּֽי אַתָּ֞ה אֲדֹנָ֤/י יְהוִה֙ דִּבַּ֔רְתָּ וּ/מִ/בִּרְכָ֣תְ/ךָ֔ יְבֹרַ֥ךְ בֵּֽית עַבְדְּ/ךָ֖ לְ/עוֹלָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/029.yaml
  text: And now[a], please be willing and bless the house of your servant, that it may continue before you forever. For you, Lord Yahweh, have spoken[c][b], and by your blessing the house of your servant will be blessed forever.
translation:
  language: hi
  text: और अब, कृपा करके अपने सेवक के घराने को आशीष देने को प्रसन्न हो, ताकि वह सदा तेरे सामने बना रहे। क्योंकि, हे प्रभु यहोवा,[a] तूने कहा है; और तेरी आशीष से तेरे सेवक का घराना सदा आशीषित रहेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “अदोनाय यहोवा,” अर्थात उपाधि “प्रभु” के साथ परमेश्वर का विशिष्ट नाम “यहोवा।”
    reason: alternative_reading
  - marker: b
    text: “घराना” में यहाँ सेवक का परिवार और वंश—दोनों भाव समाए हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹאֵל וּבָרֵךְ
  choice: कृपा करके ... आशीष देना स्वीकार कर
  rationale: הוֹאֵל में इच्छापूर्वक अथवा अनुग्रहपूर्वक सहमत होने का भाव है। हिंदी में यह विनती का स्वर स्वाभाविक रूप से रखता है और अगले आदेशात्मक וּבָרֵךְ से जुड़ता है।
- source_word: בֵּית עַבְדְּךָ
  choice: अपने सेवक का घराना
  rationale: यहाँ בַּיִת का आशय दाऊद के परिवार और वंश से है। ‘घराना’ सामान्य हिंदी में इस बहुस्तरीय अर्थ को ‘मकान’ से अधिक स्पष्ट रखते हुए केवल ‘राजवंश’ तक सीमित नहीं करता।
- source_word: לִהְיוֹת לְעוֹלָם לְפָנֶיךָ
  choice: ताकि वह सदा तेरे सामने बना रहे
  rationale: शाब्दिक भाव ‘तेरे सामने सदा रहने के लिए’ है। ‘बना रहे’ निरंतर अस्तित्व को व्यक्त करता है, पर ‘स्थापित’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के विशिष्ट नाम יהוה को ‘यहोवा’ के रूप में रखा गया है, जिससे उपाधि और नाम दोनों स्पष्ट रहते हैं।
- source_word: דִּבַּרְתָּ
  choice: तूने यह कहा है
  rationale: पूर्ण क्रिया पहले कही गई प्रतिज्ञा और उसकी वर्तमान प्रासंगिकता बताती है। संदर्भ के कारण हिंदी में ‘यह’ स्वाभाविक है।
- source_word: וּמִבִּרְכָתְךָ
  choice: और तेरी आशीष से
  rationale: מִן यहाँ स्रोत अथवा साधन दर्शाता है; ‘से’ दोनों भावों को सहज हिंदी में व्यक्त करता है।
- source_word: יְבֹרַךְ ... לְעוֹלָם
  choice: सदा आशीषित रहेगा
  rationale: निष्क्रिय अपूर्ण क्रिया को भावी, स्थायी परिणाम के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: ‘घर’ का वंशगत आशय
  choice: घराना
  alternative: घर; राजवंश
  rationale: अध्याय में दाऊद के ‘घर’ का अर्थ उसके परिवार और वंश से जुड़ा है। ‘घराना’ इस आशय को समझने योग्य बनाता है, फिर भी इसे केवल राजनीतिक राजवंश तक सीमित नहीं करता।
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु परमेश्वर
  rationale: मूल में विशिष्ट ईश्वरीय नाम सीधे उपस्थित है। ‘यहोवा’ आधुनिक हिंदी बाइबलीय प्रयोग में पहचाना जाने वाला रूप है; पादटिप्पणी उपाधि-नाम संयोजन स्पष्ट करती है।
- issue: आशीष और प्रतिज्ञा का संबंध
  choice: तेरी आशीष से ... आशीषित रहेगा
  alternative: तेरी आशीष के कारण ... धन्य रहेगा
  rationale: मूल की संज्ञा और उसी धातु की निष्क्रिय क्रिया की पुनरावृत्ति को ‘आशीष’ द्वारा बनाए रखा गया है, ताकि दाऊद की आशा का आधार परमेश्वर की ही आशीष रहे।
translation_notes:
  register: आदरपूर्ण प्रार्थना के अनुरूप परमेश्वर के लिए एकवचन निकट संबोधन ‘तू/तेरे’ रखा गया है। भाषा आधुनिक और सहज है, जबकि ‘आशीष’ तथा ‘यहोवा’ जैसे स्थापित बाइबलीय शब्द सुरक्षित रखे गए हैं।
