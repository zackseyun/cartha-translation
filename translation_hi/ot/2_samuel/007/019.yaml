base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/019.yaml
  text: And even this was too small in your eyes[a], Lord GOD; you have also spoken of your servant’s house for a long time to come, and this is the law of man[c][b], Lord GOD.
translation:
  language: hi
  text: और हे प्रभु यहोवा, यह भी आपकी दृष्टि में छोटी-सी बात थी; आपने अपने दास के घराने[a] के दूर भविष्य के बारे में भी बात की है। और यह मनुष्य की शिक्षा है, हे प्रभु यहोवा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘घराना’ परिवार, वंश या राजवंश को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम इब्रानी वाक्यांश कठिन है। इसका अनुवाद ‘यह मानवजाति के लिए विधान है’, ‘यह मनुष्य की रीति है’, या ‘यह मनुष्य के विषय में शिक्षा है’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְטַן עוֹד זֹאת בְּעֵינֶיךָ
  choice: यह भी आपकी दृष्टि में छोटी-सी बात थी
  rationale: קטן का मूल अर्थ ‘छोटा होना’ है और בְּעֵינֶיךָ मूल्यांकन का मुहावरा है। हिन्दी में ‘आपकी दृष्टि में छोटी-सी बात’ स्रोत की छवि और प्रसंगगत भाव दोनों को स्वाभाविक रूप से रखता है।
- source_word: אֲדֹנָי יְהוִה
  choice: हे प्रभु यहोवा
  rationale: सम्बोधन को ‘हे’ से स्पष्ट किया गया है। संयुक्त ईश्वरीय उपाधि में אֲדֹנָי को ‘प्रभु’ और चार-अक्षरीय नाम को ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וַתְּדַבֵּר גַּם אֶל בֵּית עַבְדְּךָ
  choice: आपने अपने दास के घराने के विषय में भी कहा है
  rationale: דבר אל यहाँ दाऊद के वंश/घराने से संबंधित वचन को सूचित करता है। ‘के विषय में कहा’ हिन्दी में प्रसंग को स्पष्ट करता है, जबकि ‘घराना’ परिवार और राजवंश दोनों अर्थों की गुंजाइश रखता है।
- source_word: לְמֵרָחוֹק
  choice: दूर भविष्य
  rationale: शाब्दिक अर्थ ‘दूर तक/दूर के लिए’ है; इस प्रसंग में दूरी कालगत है और आने वाले बहुत समय की ओर संकेत करती है।
- source_word: תּוֹרַת הָאָדָם
  choice: मनुष्य की शिक्षा
  rationale: תּוֹרָה के व्यापक अर्थ ‘शिक्षा/निर्देश’ को चुना गया है, न कि केवल विधिक ‘व्यवस्था’। הָאָדָם को एकवचन ‘मनुष्य’ रखा गया है। कठिन और संदिग्ध संबंध को निकट रूप में रखा गया है और अन्य संभावनाएँ टिप्पणी में दी गई हैं।
theological_decisions:
- issue: וְזֹאת תּוֹרַת הָאָדָם का अर्थ
  choice: और ... यह मनुष्य की शिक्षा है!
  alternative: ‘यह मानवजाति के लिए विधान है’, ‘यह मनुष्य की रीति है’, या ‘यह मनुष्य के विषय में शिक्षा है’
  rationale: अन्तिम इब्रानी वाक्यांश अत्यंत कठिन है और उसमें संबंधसूचक अर्थ स्पष्ट नहीं है। मुख्य पाठ उसके मूल शब्दों के निकट रहता है; विस्मयचिह्न दाऊद के आश्चर्यपूर्ण संबोधन को व्यक्त करता है, पर किसी विशिष्ट मसीही, राजवंशीय या मानवशास्त्रीय व्याख्या को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दृष्टि में छोटी-सी बात’ इब्रानी मुहावरे को स्वाभाविक हिन्दी में सुरक्षित रखता है। अंतिम खंड की असामान्यता जानबूझकर पूरी तरह समतल नहीं की गई, ताकि मूल की वास्तविक अस्पष्टता बनी रहे।
