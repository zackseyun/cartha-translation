base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/003.yaml
  text: And Nathan said to the king[a], “Go, do all that is in your heart, for Yahweh is with you.”
translation:
  language: hi
  text: तब नातान ने राजा से कहा, “जाओ, जो कुछ तुम्हारे मन में है, वह करो, क्योंकि याहवे तुम्हारे साथ है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमबोधक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נָתָן
  choice: नातान
  rationale: इब्रानी नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֶל הַמֶּלֶךְ
  choice: राजा से
  rationale: मूल पाठ में निश्चित पद ‘राजा’ है, दाऊद नाम नहीं; हिन्दी में ‘कहा’ के साथ ‘से’ स्वाभाविक है।
- source_word: כֹּל אֲשֶׁר בִּלְבָבְךָ
  choice: जो कुछ तुम्हारे मन में है
  rationale: לֵבָב यहाँ आंतरिक इच्छा, विचार या संकल्प का बोध कराता है। ‘मन में’ हिन्दी में इस इब्रानी मुहावरे का व्यापक और सहज समतुल्य है।
- source_word: לֵךְ עֲשֵׂה
  choice: जाओ, ... करो
  rationale: दोनों आज्ञार्थक क्रियाओं को बनाए रखते हुए अनुमति और प्रोत्साहन का संक्षिप्त भाव व्यक्त किया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह नातान की सलाह का कारण प्रस्तुत करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित प्रत्यक्ष लिप्यंतरण से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: עִמָּךְ
  choice: तुम्हारे साथ है
  rationale: उपस्थिति और साथ का सीधा अर्थ सुरक्षित रहता है; समर्थन का भाव पाठ में जोड़कर स्पष्ट नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार-अक्षरीय व्यक्तिगत नाम प्रत्यक्ष रूप से आया है। हिन्दी पाठकों के बीच स्थापित रूप ‘यहोवा’ नाम को उपाधि में बदले बिना सुरक्षित रखता है।
- issue: ‘यहोवा तुम्हारे साथ है’ का आशय
  choice: शाब्दिक साथ/उपस्थिति को बनाए रखा
  alternative: ‘यहोवा तुम्हारा समर्थन करता है’
  rationale: संदर्भ समर्थन का संकेत दे सकता है, पर मूल עִמָּךְ केवल ‘तुम्हारे साथ’ कहता है; इसलिए संभावित धार्मिक तनाव को विस्तार द्वारा हल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हृदय’ के बजाय ‘मन’ सामान्य हिन्दी में इच्छा, विचार और संकल्प—तीनों को अधिक स्वाभाविक ढंग से समेटता है। किसी पाद-टिप्पणी की आवश्यकता नहीं है।
