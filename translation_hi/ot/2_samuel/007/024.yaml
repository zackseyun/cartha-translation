  text: וַ/תְּכ֣וֹנֵֽן לְ֠/ךָ אֶת עַמְּ/ךָ֨ יִשְׂרָאֵ֧ל לְ/ךָ֛ לְ/עָ֖ם עַד עוֹלָ֑ם וְ/אַתָּ֣ה יְהוָ֔ה הָיִ֥יתָ לָ/הֶ֖ם לֵ/אלֹהִֽים־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/024.yaml
  text: And you established your people Israel for yourself to be your people forever[a], and you, Yahweh[b], became their God.
translation:
  language: hi
  text: और आपने अपनी प्रजा इस्राएल को अपने लिए स्थापित किया कि वह सदा के लिए आपकी प्रजा रहे; और आप, याहवे[a], उनके परमेश्वर बने[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में परमेश्वर का नाम YHWH है।
    reason: divine_name
  - marker: b
    text: या, “उनके परमेश्वर थे।” इस प्रसंग में “बने” वाचा स्थापित होने के भाव को अधिक स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּכוֹנֵן
  choice: स्थापित किया
  rationale: כון के इस रूप का अर्थ किसी को दृढ़ अथवा स्थायी रूप से स्थापित करना है। ‘स्थापित किया’ वाचा के संदर्भ और स्वाभाविक आधुनिक हिन्दी—दोनों के अनुकूल है।
- source_word: לְךָ ... לְךָ לְעָם
  choice: अपने लिए ... आपकी प्रजा रहे
  rationale: दोहराया गया לְךָ इस्राएल के याहवे से संबंध और उसके उनके अपने लोग होने पर बल देता है। हिन्दी में इस आशय को स्पष्ट और स्वाभाविक रखने के लिए उद्देश्यवाचक वाक्य-रचना अपनाई गई है।
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल
  rationale: इससे अधिकार-संबंध (‘अपनी प्रजा’) और उस प्रजा का नाम (‘इस्राएल’) दोनों सुरक्षित रहते हैं।
- source_word: עַד עוֹלָם
  choice: सदा तक
  rationale: यह पद निरंतर और स्थायी अवधि व्यक्त करता है; ‘सदा तक’ सरल तथा गरिमापूर्ण हिन्दी है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम YHWH को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: הָיִיתָ לָהֶם לֵאלֹהִים
  choice: उनके परमेश्वर बने
  rationale: היה + ל यहाँ इस्राएल के साथ स्थापित पारस्परिक वाचा-संबंध को व्यक्त कर सकता है। ‘बने’ उस गतिशील भाव को बनाए रखता है, जबकि पद का स्थितिवाचक अर्थ भी पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: वाचा-सूत्र का पारस्परिक रूप
  choice: वह सदा तक आपकी प्रजा रहे ... आप उनके परमेश्वर बने
  alternative: वह सदा तक आपकी प्रजा रहे ... आप उनके परमेश्वर थे
  rationale: मूल पाठ इस्राएल के याहवे की प्रजा होने और याहवे के उनके परमेश्वर होने को परस्पर रखता है। ‘बने’ प्रसंग में वाचा स्थापित किए जाने की गति को व्यक्त करता है, पर हिब्रू का स्थितिवाचक अर्थ भी संभव है।
- issue: ईश्वरीय नाम का निरूपण
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: יְהוָה एक व्यक्तिगत नाम है। ‘याहवे’ उसका सीधा और व्यापक रूप से मान्य लिप्यंतरण है; इससे नाम को उपाधि में नहीं बदला जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक ‘आप’ का प्रयोग किया गया है। वाक्य को सहज बनाने के लिए לְךָ לְעָם को उद्देश्यवाचक रचना ‘कि वह ... आपकी प्रजा रहे’ में व्यक्त किया गया है, जबकि मूल का स्वामित्व और वाचा-संबंध सुरक्षित रखा गया है।
