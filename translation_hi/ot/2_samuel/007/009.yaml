  yaml_path: translation/ot/2_samuel/007/009.yaml
  text: And I was with you wherever you went[a], and I cut off all your enemies from before you. And I will make for you a great name[b], like the name of the great ones who are on the earth.
translation:
  language: hi
  text: जहाँ कहीं भी तू गया, मैं तेरे साथ रहा, और मैंने तेरे सब शत्रुओं को तेरे सामने से मिटा दिया। और मैं तेरा नाम पृथ्वी पर के महान लोगों के नाम के समान महान[a] करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् मैं तुझे बड़ी ख्याति दूँगा। इब्रानी में शब्दशः ‘नाम’ है, जो प्रतिष्ठा या यश का भी बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה עִמְּךָ
  choice: मैं तेरे साथ रहा
  rationale: सरल भूतकाल पूर्व में दाऊद के साथ रही यहोवा की उपस्थिति और सहायता—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּכֹל אֲשֶׁר הָלַכְתָּ
  choice: तू जहाँ कहीं गया
  rationale: यह इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप है और दाऊद के सभी स्थानों तथा परिस्थितियों को समेटता है।
- source_word: וָאַכְרִתָה אֶת כָּל אֹיְבֶיךָ מִפָּנֶיךָ
  choice: मैंने तेरे सब शत्रुओं को तेरे सामने से मिटा दिया
  rationale: כרת के हटाने अथवा नष्ट करने के प्रबल भाव को ‘मिटा दिया’ व्यक्त करता है; ‘तेरे सामने से’ मूल के स्थानगत मुहावरे को बनाए रखता है।
- source_word: וְעָשִׂיתִי לְךָ שֵׁם גָּדוֹל
  choice: मैं तेरा नाम महान करूँगा
  rationale: शाब्दिक ‘तेरे लिए एक महान नाम बनाऊँगा’ हिन्दी में अस्वाभाविक है। यह रूप ‘नाम’ के बाइबिलीय मुहावरे को रखते हुए भावी प्रतिज्ञा और ख्याति के आशय को स्पष्ट करता है।
- source_word: כְּשֵׁם הַגְּדֹלִים אֲשֶׁר בָּאָרֶץ
  choice: पृथ्वी के महान लोगों के नाम के समान
  rationale: ‘महान लोगों’ से הַגְּדֹלִים का व्यापक अर्थ बना रहता है और अनावश्यक रूप से केवल पुरुषों तक सीमित नहीं होता; ‘पृथ्वी’ यहाँ व्यापक विश्व-संदर्भ के अनुकूल है।
theological_decisions:
- issue: प्रतिज्ञात्मक संदर्भ में וְעָשִׂיתִי का कालगत अर्थ
  choice: 'भविष्यकाल: ‘मैं तेरा नाम महान करूँगा’'
  alternative: 'पूर्ण भूतकाल: ‘मैंने तेरा नाम महान किया है’'
  rationale: यद्यपि क्रिया रूप क़ातल है, यहाँ बीते कार्यों के वर्णन से आगे बढ़कर दी जा रही ईश्वरीय प्रतिज्ञा और 1 इतिहास 17:8 का समानांतर भविष्यकाल का समर्थन करते हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। परमेश्वर द्वारा दाऊद को एकवचन निकट संबोधन के लिए ‘तू/तेरे’ रखा गया है। ‘नाम महान करना’ हिन्दी में स्वाभाविक रहते हुए मूल इब्रानी के प्रमुख बाइबिलीय मुहावरे को सुरक्षित रखता है।
