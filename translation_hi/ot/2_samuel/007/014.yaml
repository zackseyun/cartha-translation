  text: אֲנִי֙ אֶהְיֶה לּ֣/וֹ לְ/אָ֔ב וְ/ה֖וּא יִהְיֶה לִּ֣/י לְ/בֵ֑ן אֲשֶׁר֙ בְּ/הַ֣עֲוֺת֔/וֹ וְ/הֹֽכַחְתִּי/ו֙ בְּ/שֵׁ֣בֶט אֲנָשִׁ֔ים וּ/בְ/נִגְעֵ֖י בְּנֵ֥י אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/014.yaml
  text: I will be a father to him[a], and he will be a son to me. When he commits iniquity, I will discipline him with the rod of men and with the blows of the sons of man.
translation:
  language: hi
  text: मैं उसका पिता होऊँगा, और वह मेरा पुत्र होगा। जब वह अधर्म करेगा, तब मैं उसे मनुष्यों की छड़ी और मनुष्यों के प्रहारों से ताड़ना दूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक स्वाभाविक रूप में: “मानवीय प्रहारों से।” इब्रानी में शाब्दिक रूप से “मनुष्य-पुत्रों के प्रहारों से” है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶהְיֶה לּוֹ לְאָב
  choice: मैं उसका पिता ठहरूँगा
  rationale: सम्बन्धसूचक लामेद-रचना को स्वाभाविक हिन्दी में व्यक्त करता है; ‘ठहरूँगा’ वाचा-सूत्र की औपचारिकता बनाए रखता है।
- source_word: וְהוּא יִהְיֶה לִּי לְבֵן
  choice: और वह मेरा पुत्र ठहरेगा
  rationale: पारस्परिक पिता-पुत्र वाचा-सूत्र को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में रखता है।
- source_word: אֲשֶׁר בְּהַעֲוֺתוֹ
  choice: जब वह अधर्म करेगा
  rationale: אֲשֶׁר यहाँ परिस्थिति/समय का परिचय देता है; ‘जब’ अनावश्यक शर्तात्मक अर्थ जोड़े बिना इसे व्यक्त करता है। ‘अधर्म करेगा’ नैतिक गंभीरता बनाए रखता है।
- source_word: וְהֹכַחְתִּיו
  choice: तब मैं उसे ... अनुशासित करूँगा
  rationale: हिफ़िल रूप यहाँ केवल मौखिक फटकार नहीं, सुधारात्मक दण्ड का संकेत देता है, जिसे आगे के साधन स्पष्ट करते हैं।
- source_word: בְּשֵׁבֶט אֲנָשִׁים
  choice: मनुष्यों की छड़ी से
  rationale: मूल रूपक को सुरक्षित रखता है और इस सम्भावना को खुला छोड़ता है कि दण्ड मानवीय साधनों अथवा मानवीय कर्ताओं द्वारा आएगा।
- source_word: וּבְנִגְעֵי בְּנֵי אָדָם
  choice: मानव-पुत्रों के प्रहारों से
  rationale: ‘प्रहार’ נגע का प्रसंगानुकूल अर्थ देता है; ‘मानव-पुत्रों’ से इब्रानी अभिव्यक्ति की संरचना बनी रहती है, जबकि पादटिप्पणी उसका स्वाभाविक हिन्दी अर्थ बताती है।
theological_decisions:
- issue: दाऊद के राजवंश और बाद के मसीही प्रयोग के सम्बन्ध में पुत्रत्व की प्रतिज्ञा का दायरा
  choice: पद को उसके तात्कालिक ऐतिहासिक सन्दर्भ में दाऊद के वंशज राजा के विषय में अनूदित किया गया है, बिना मुख्य पाठ में स्पष्ट मसीही व्याख्या जोड़े।
  alternative: मुख्य पाठ में इसे सीधे मसीही कथन के रूप में व्यक्त करना।
  rationale: इब्रानी पाठ पहले दाऊद की सन्तान और राजवंश के विषय में है। बाद का शास्त्रीय प्रयोग महत्त्वपूर्ण है, पर उसे अनुवाद में जोड़ने से मूल की ऐतिहासिक और धर्मवैज्ञानिक व्यापकता सीमित हो जाएगी।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप। ‘पिता/पुत्र ठहरना’ वाचा-सूत्र की औपचारिकता रखता है; ‘मानव-पुत्रों’ की अपेक्षाकृत शाब्दिक अभिव्यक्ति को पादटिप्पणी से स्पष्ट किया गया है।
