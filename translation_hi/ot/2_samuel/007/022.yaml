  text: עַל כֵּ֥ן גָּדַ֖לְתָּ אֲדֹנָ֣/י יְהוִ֑ה כִּֽי אֵ֣ין כָּמ֗וֹ/ךָ וְ/אֵ֤ין אֱלֹהִים֙ זֽוּלָתֶ֔/ךָ בְּ/כֹ֥ל אֲשֶׁר שָׁמַ֖עְנוּ בְּ/אָזְנֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/022.yaml
  text: Therefore you are great[a], Lord GOD, for there is none like you, and there is no God besides you[b], according to all that we have heard with our ears.
translation:
  language: hi
  text: इसलिए, हे प्रभु याहवे[a], आप महान हैं, क्योंकि हमने अपने कानों से जो कुछ सुना है, उसके अनुसार आपके समान कोई नहीं और आपके सिवा कोई परमेश्वर नहीं है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘अदोनाय YHWH’—अर्थात ‘प्रभु याहवे’।'
    reason: मूल संयुक्त संबोधन और दिव्य नाम को स्पष्ट करना।
  - marker: b
    text: 'या: ‘और आपको छोड़कर कोई देवता नहीं’ अथवा ‘आपके अतिरिक्त कोई परमेश्वर नहीं।’'
    reason: אֱלֹהִים और זוּלָתֶךָ के सम्भव हिन्दी रूपों को दिखाना।
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पिछले प्रसंग में बताए गए परमेश्वर के कार्यों से निकला निष्कर्ष प्रस्तुत करता है।
- source_word: גָּדַלְתָּ
  choice: आप महान हैं
  rationale: कालगत रूप यहाँ परमेश्वर की स्वीकृत अथवा प्रकट महानता की वर्तमान दशा व्यक्त कर सकता है; यह सहज और स्तुतिपरक है।
- source_word: אֲדֹנָי יְהוִה
  choice: हे प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और चतुरक्षरीय व्यक्तिगत नाम יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ से व्यक्त किया गया है; सम्बोधन के कारण ‘हे’ जोड़ा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले कथन का आधार बताने वाला कारणसूचक संयोजक है।
- source_word: אֵין כָּמוֹךָ
  choice: आपके समान कोई नहीं
  rationale: यह इब्रानी की तुलना द्वारा कही गई अतुलनीयता को सीधे और स्वाभाविक हिन्दी में रखता है।
- source_word: וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: और आपके सिवा कोई परमेश्वर नहीं
  rationale: זוּלָתֶךָ का बहिष्कारी अर्थ ‘आपके सिवा/अतिरिक्त’ है; वाक्य परमेश्वर की अद्वितीयता का सीधा अंगीकार करता है।
- source_word: בְּכֹל אֲשֶׁר שָׁמַעְנוּ בְּאָזְנֵינוּ
  choice: ठीक वैसा ही जैसा हमने अपने कानों से सुना है
  rationale: पहला בְּ यहाँ सुनी हुई पूरी गवाही के अनुरूप होने का भाव देता है, और ‘अपने कानों से’ इब्रानी के जोरदार मुहावरे को बनाए रखता है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में दिव्य नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे / प्रभु परमेश्वर
  rationale: मूल में व्यक्तिगत दिव्य नाम स्पष्ट है, इसलिए उसे सामान्य पदवी में विलीन नहीं किया गया। ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला रूप है; पादटिप्पणी मूल नाम और वैकल्पिक लिप्यंतरण बताती है।
- issue: אֵין אֱלֹהִים זוּלָתֶךָ में एकमात्र परमेश्वर होने का दावा
  choice: आपके सिवा कोई परमेश्वर नहीं
  alternative: आपको छोड़ कोई देवता नहीं / आपके अतिरिक्त कोई ईश्वर नहीं
  rationale: यह अनुवाद मूल के स्पष्ट बहिष्कारी दावे को सुरक्षित रखता है, पर उसके ऊपर बाद की दार्शनिक व्याख्या नहीं थोपता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। परमेश्वर को आदरसूचक ‘आप’ से संबोधित किया गया है। ‘अपने कानों से’ मूल की श्रवण-साक्ष्य वाली जोरदार अभिव्यक्ति को बनाए रखता है।
