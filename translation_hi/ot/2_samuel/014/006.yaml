  text: וּ/לְ/שִׁפְחָֽתְ/ךָ֙ שְׁנֵ֣י בָנִ֔ים וַ/יִּנָּצ֤וּ שְׁנֵי/הֶם֙ בַּ/שָּׂדֶ֔ה וְ/אֵ֥ין מַצִּ֖יל בֵּֽינֵי/הֶ֑ם וַ/יַּכּ֧/וֹ הָ/אֶחָ֛ד אֶת הָ/אֶחָ֖ד וַ/יָּ֥מֶת אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/006.yaml
  text: And your servant had two sons[a], and the two of them fought in the field, and there was no one to separate them[b]; then the one struck the other and killed him.
translation:
  language: hi
  text: तेरी दासी के दो बेटे थे।[a] वे दोनों खेत में आपस में लड़ पड़े, और उनके बीच छुड़ाने वाला कोई नहीं था;[b] तब एक ने दूसरे को ऐसा मारा कि वह मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दासी’ स्त्री द्वारा राजा के सामने अपने लिए प्रयुक्त विनम्र संबोधन है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: ‘उनके बीच कोई छुड़ाने वाला नहीं था,’ अर्थात हस्तक्षेप करके उन्हें अलग करने वाला कोई नहीं था।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשִׁפְחָתְךָ
  choice: तेरी दासी
  rationale: שִׁפְחָה स्त्री सेविका या दासी को दर्शाता है और यहाँ राजा के सामने विनम्र आत्म-संबोधन है। ‘तेरी दासी’ आधुनिक हिन्दी में स्वाभाविक है तथा वक्ता का स्त्रीलिंग और नम्रता दोनों बनाए रखता है।
- source_word: שְׁנֵי בָנִים
  choice: दो बेटे
  rationale: בָנִים यहाँ सामान्य ‘संतान’ नहीं, बल्कि पुरुष संतानों को सूचित करता है।
- source_word: וַיִּנָּצוּ
  choice: आपस में लड़ पड़े
  rationale: נצה यहाँ संघर्ष या लड़ाई को दर्शाता है। घातक परिणाम के संदर्भ में ‘लड़ पड़े’ केवल मौखिक झगड़े की अपेक्षा अधिक उपयुक्त है।
- source_word: בַּשָּׂדֶה
  choice: खेत में
  rationale: यह स्थानसूचक पद का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: וְאֵין מַצִּיל בֵּינֵיהֶם
  choice: उनके बीच छुड़ाने वाला कोई नहीं था
  rationale: מַצִּיל का मूल भाव बचाने या छुड़ाने वाले का है; इस झगड़े में इसका आशय हस्तक्षेप करके दोनों को अलग करने वाले से है। अनुवाद मूल रूपक को कुछ हद तक बनाए रखता है।
- source_word: וַיַּכּוֹ הָאֶחָד אֶת הָאֶחָד
  choice: एक ने दूसरे को ऐसा मारा
  rationale: נכה का अर्थ मारना या प्रहार करना है। ‘ऐसा मारा कि’ अगली परिणामसूचक उपवाक्य से सहज हिन्दी संबंध बनाता है, बिना हथियार या प्रहारों की संख्या निर्धारित किए।
- source_word: וַיָּמֶת אֹתוֹ
  choice: कि वह मर गया
  rationale: यह रूप मृत्यु घटित कराने का भाव देता है। हिन्दी में ‘ऐसा मारा कि वह मर गया’ कारण और परिणाम दोनों को स्पष्ट रखते हुए मूल क्रियात्मक तनाव को स्वाभाविक ढंग से व्यक्त करता है।
