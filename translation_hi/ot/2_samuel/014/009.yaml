  yaml_path: translation/ot/2_samuel/014/009.yaml
  text: Then the woman from Tekoa said to the king[a], “On me, my lord the king, be the guilt, and on my father’s house; but the king and his throne are innocent.”
translation:
  language: hi
  text: तब तकोआ की स्त्री ने राजा से कहा, “हे मेरे स्वामी राजा, दोष[a] मुझ पर और मेरे पिता के घराने पर है; पर राजा और उसका सिंहासन निर्दोष हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपराध,” “दोषभाव,” या “दायित्व/उसका परिणाम।” इब्रानी शब्द प्रसंग के अनुसार अपराध, उससे उत्पन्न दोष, या उसकी जवाबदेही को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקוֹעִית
  choice: तकोआ की स्त्री
  rationale: यह स्त्री की भौगोलिक पहचान बताता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: עָלַי
  choice: मुझ पर ... हो
  rationale: वाक्य के आरम्भ में आए इस पद का बल बनाए रखते हुए उत्तरदायित्व अपने ऊपर लेने का भाव व्यक्त करता है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: हे मेरे स्वामी राजा
  rationale: राजदरबार का आदरपूर्ण सम्बोधन और राजा की पदवी दोनों सुरक्षित रहते हैं।
- source_word: הֶעָוֺן
  choice: दोष
  rationale: इस न्यायिक प्रसंग में यह अपराध, दोष अथवा उससे जुड़ी जवाबदेही को सूचित कर सकता है; ‘दोष’ इस अर्थ-व्याप्ति को संक्षेप में रखता है।
- source_word: וְעַל בֵּית אָבִי
  choice: और मेरे पिता के घराने पर
  rationale: ‘पिता का घर’ कुल अथवा परिवार की सामूहिक और कानूनी परिधि का इब्रानी मुहावरा है; ‘घराना’ हिन्दी में इसे सहजता से व्यक्त करता है।
- source_word: וְהַמֶּלֶךְ וְכִסְאוֹ
  choice: परन्तु राजा और उसका सिंहासन
  rationale: संयोजक यहाँ अर्थगत विरोध दिखाता है; ‘सिंहासन’ राजकीय सत्ता और राजवंश का लाक्षणिक संकेत बनाए रखता है।
- source_word: נָקִי
  choice: निर्दोष रहें
  rationale: यह कानूनी या नैतिक जवाबदेही से मुक्त होने का भाव देता है। हिन्दी में संयुक्त कर्ता के साथ बहुवचन क्रिया स्वाभाविक है।
theological_decisions:
- issue: राजा को दोष से मुक्त बताने का कथन
  choice: राजा और उसका सिंहासन निर्दोष रहें
  alternative: राजा और उसका सिंहासन दोषमुक्त रहें
  rationale: कथन को इस मामले से जुड़ी न्यायिक जवाबदेही तक सीमित रखा गया है; यह राजा की सर्वांगीण नैतिक निष्पापता का दावा नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दरबारी सम्बोधन को औपचारिक रखा गया है और इब्रानी वाक्य के उत्तरदायित्व तथा विरोध के बल को स्वाभाविक हिन्दी में सुरक्षित किया गया है।
