base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/033.yaml
  text: Then Joab came to the king and told him[a], and he called for Absalom. So he came to the king and bowed himself with his face to the ground before the king[b], and the king kissed Absalom.
translation:
  language: hi
  text: तब योआब ने राजा के पास जाकर उसे यह बात बताई। राजा ने अबशालोम को बुलवाया[a]। अबशालोम राजा के पास आया और उसके सामने भूमि पर मुँह के बल दण्डवत किया। तब राजा ने अबशालोम को चूमा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अबशालोम को बुलाया।”
    reason: lexical_alternative
  - marker: b
    text: राजा का चूमना संभवतः मेल-मिलाप या फिर से अनुग्रह मिलने का संकेत है, यद्यपि पाठ केवल इतना कहता है कि उसने अबशालोम को चूमा।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא יוֹאָב אֶל־הַמֶּלֶךְ
  choice: योआब ने राजा के पास जाकर
  rationale: בוא यहाँ राजा की ओर जाने और उसके सामने उपस्थित होने को व्यक्त करता है। हिंदी में ‘के पास जाकर’ इस गति को स्वाभाविक ढंग से बताता है।
- source_word: וַיַּגֶּד לוֹ
  choice: उसे यह बात बताई
  rationale: נגד के हिफ़ील रूप का सामान्य अर्थ ‘बताना’ या ‘सूचित करना’ है। ‘यह बात’ हिंदी में सकर्मक कथन को स्वाभाविक बनाता है, बिना कोई नई विषय-वस्तु जोड़े।
- source_word: וַיִּקְרָא אֶל־אַבְשָׁלוֹם
  choice: अबशालोम को बुलवाया
  rationale: राजकीय प्रसंग में קרא אל का आशय अबशालोम को राजा की उपस्थिति में बुलाने से है। ‘बुलवाया’ इस संदर्भ में स्वाभाविक है; अधिक शाब्दिक विकल्प फुटनोट में दिया गया है।
- source_word: וַיִּשְׁתַּחוּ לוֹ
  choice: उसके सामने … दण्डवत किया
  rationale: שׁחה का यह रूप श्रद्धा और अधीनता में झुकने को दर्शाता है। अगले वाक्यांश में शारीरिक मुद्रा स्पष्ट होने के कारण ‘दण्डवत किया’ संक्षिप्त और सटीक है।
- source_word: עַל־אַפָּיו אַרְצָה
  choice: मुँह के बल भूमि पर गिरकर
  rationale: इब्रानी का भाव शाब्दिक रूप से ‘अपने मुँह पर, भूमि की ओर’ है। यह हिंदी अभिव्यक्ति पूर्ण रूप से भूमि पर झुकने की मुद्रा स्पष्ट करती है।
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: राजा के सामने
  rationale: दरबारी प्रसंग में לִפְנֵי का सामान्य और स्वाभाविक हिंदी रूप ‘के सामने’ है।
- source_word: וַיִּשַּׁק הַמֶּלֶךְ לְאַבְשָׁלוֹם
  choice: राजा ने अबशालोम को चूमा
  rationale: נשׁק यहाँ वास्तविक चूमने की क्रिया बताता है। अनुवाद क्रिया को सीधे रखता है और उसके संभावित सांकेतिक अर्थ को मुख्य पाठ में नहीं जोड़ता।
theological_decisions:
- issue: राजा के चूमने का आशय
  choice: मुख्य पाठ में केवल चूमने की क्रिया का सीधा अनुवाद
  alternative: इसे स्पष्ट रूप से मेल-मिलाप या पुनः कृपा-प्राप्ति का औपचारिक संकेत कहना
  rationale: प्रसंग में यह मेल-मिलाप या राजा की कृपा फिर मिलने का संकेत हो सकता है, पर इब्रानी पाठ केवल यह कहता है कि राजा ने अबशालोम को चूमा। इसलिए संभावित आशय फुटनोट में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘दण्डवत’ इस ऐतिहासिक राजदरबारी मुद्रा के लिए व्यापक रूप से समझा जाने वाला शब्द है, और ‘मुँह के बल भूमि पर’ उसके ठोस शारीरिक अर्थ को स्पष्ट करता है।
