  text: וְ֠/עַתָּה אֲשֶׁר בָּ֜אתִי לְ/דַבֵּ֨ר אֶל הַ/מֶּ֤לֶךְ אֲדֹנִ/י֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה כִּ֥י יֵֽרְאֻ֖/נִי הָ/עָ֑ם וַ/תֹּ֤אמֶר שִׁפְחָֽתְ/ךָ֙ אֲדַבְּרָה נָּ֣א אֶל הַ/מֶּ֔לֶךְ אוּלַ֛י יַעֲשֶׂ֥ה הַ/מֶּ֖לֶךְ אֶת דְּבַ֥ר אֲמָתֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/015.yaml
  text: And now I have come to speak this matter to my lord the king[a], because the people have frightened me. And your servant said, ‘Please let me speak to the king[b]; perhaps the king will do the word of his servant.’
translation:
  language: hi
  text: और अब मैं अपने स्वामी राजा से यह बात कहने आई हूँ, क्योंकि लोगों ने मुझे डरा दिया है। तब आपकी दासी ने कहा, ‘कृपया मुझे राजा से बात करने दीजिए; शायद राजा अपनी दासी की बात मान ले।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक ו और समयसूचक עַתָּה दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֲשֶׁר בָּאתִי לְדַבֵּר
  choice: मैं ... कहने आई हूँ
  rationale: वक्ता स्त्री है; पूर्ण वर्तमान उसकी वर्तमान उपस्थिति और उद्देश्य को व्यक्त करता है।
- source_word: אֶל הַמֶּלֶךְ אֲדֹנִי
  choice: अपने स्वामी राजा से
  rationale: राजकीय पद और आदरसूचक संबोधन दोनों को सहज हिन्दी क्रम में रखता है।
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: यह बात
  rationale: דָּבָר यहाँ प्रस्तुत किए जा रहे विषय या निवेदन को दर्शाता है; ‘बात’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: כִּי יֵרְאֻנִי הָעָם
  choice: क्योंकि लोगों ने मुझे डरा दिया है
  rationale: पिएल रूप का कारणवाचक अर्थ ‘डराना’ सुरक्षित रखा गया है, न कि ‘लोग मुझसे डरते हैं।’
- source_word: וַתֹּאמֶר שִׁפְחָתְךָ
  choice: इसलिए आपकी दासी ने सोचा
  rationale: यह विनम्र आत्म-संदर्भ है; यहाँ אָמַר आंतरिक विचार/निश्चय का परिचय देता है, इसलिए हिन्दी में ‘सोचा’ प्रसंगानुकूल है।
- source_word: אֲדַבְּרָה נָּא אֶל הַמֶּלֶךְ
  choice: मैं राजा से विनती करूँ
  rationale: कोहोर्टेटिव और נָא की विनम्र इच्छार्थक शक्ति को व्यक्त करता है; प्रसंग में बोलना एक निवेदन रखना है।
- source_word: אוּלַי
  choice: शायद
  rationale: संभावना और अनिश्चित आशा दोनों को सामान्य, गरिमापूर्ण हिन्दी में रखता है।
- source_word: יַעֲשֶׂה הַמֶּלֶךְ אֶת דְּבַר אֲמָתוֹ
  choice: राजा अपनी दासी की बात मान ले
  rationale: शाब्दिक ‘दासी की बात करेगा’ हिन्दी में अस्वाभाविक है; ‘बात मानना’ अनुरोध पर अनुकूल कार्य करने का अर्थ देता है और स्त्रीलिंग सेविका को स्पष्ट रखता है।
