base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/022.yaml
  text: Then Joab fell with his face to the ground[a], bowed down, and blessed the king. Joab said, “Today your servant knows that I have found favor in your eyes, my lord the king, because the king has done the word of his servant.”
translation:
  language: hi
  text: तब योआब भूमि पर मुँह के बल गिर पड़ा, दण्डवत किया और राजा को आशीर्वाद दिया। योआब ने कहा, “हे मेरे स्वामी राजा, आज आपके इस दास ने जान लिया है कि मैंने आपकी दृष्टि में कृपा पाई है, क्योंकि राजा ने अपने दास की बात मान ली है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “राजा ने अपने दास की बात की है।”'
    reason: इब्रानी עָשָׂה ... אֶת־דְּבַר עַבְדּוֹ के अधिक निकट शाब्दिक रूप को दर्शाने के लिए; मुख्य पाठ में प्रसंगानुकूल अर्थ ‘बात मान ली है’ दिया गया है।
lexical_decisions:
- source_word: וַיִּפֹּל ... אֶל־פָּנָיו אַרְצָה
  choice: भूमि पर मुँह के बल गिर पड़ा
  rationale: यह इब्रानी की शारीरिक मुद्रा को स्वाभाविक और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיִּשְׁתַּחוּ
  choice: दण्डवत करके
  rationale: राजा के सामने पूर्ण विनम्रता से झुकने का भाव देता है; ‘आराधना की’ कहना इस मानवीय राजकीय संदर्भ को अनावश्यक रूप से धार्मिक बना देता।
- source_word: וַיְבָרֶךְ אֶת־הַמֶּלֶךְ
  choice: राजा को आशीर्वाद दिया
  rationale: ברך के मूल अर्थ को बनाए रखता है, जबकि प्रसंग में यह आदर और कृतज्ञता की अभिव्यक्ति है।
- source_word: הַיּוֹם יָדַע עַבְדְּךָ
  choice: आज आपके दास को मालूम हो गया
  rationale: पूर्ण क्रिया से व्यक्त वर्तमान बोध या निश्चय को सहज हिन्दी में दर्शाता है।
- source_word: עַבְדְּךָ
  choice: आपके दास
  rationale: राजदरबार में आत्म-विनय की रूढ़ अभिव्यक्ति है; यहाँ बंधुआ स्थिति पर बल देना आवश्यक नहीं।
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: मैंने आपकी दृष्टि में कृपा पाई है
  rationale: इब्रानी मुहावरे की ‘दृष्टि में’ वाली छवि और कृपा का अर्थ दोनों सुरक्षित रखता है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: हे मेरे स्वामी राजा
  rationale: राजा के प्रति योआब का सम्मानपूर्ण संबोधन सुरक्षित रखता है और हिन्दी में स्वाभाविक है।
- source_word: אֲשֶׁר
  choice: क्योंकि
  rationale: यहाँ यह अगले कथन को योआब के विश्वास का कारण बताने वाले वाक्यांश के रूप में जोड़ता है।
- source_word: עָשָׂה הַמֶּלֶךְ אֶת דְּבַר עַבְדּוֹ
  choice: राजा ने अपने दास की बात मान ली है
  rationale: शाब्दिक रूप ‘अपने दास की बात को किया’ है; प्रसंग में इसका स्वाभाविक अर्थ दास की कही बात या विनती स्वीकार करना है। पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
theological_decisions:
- issue: मानवीय राजा के सामने सम्मान की मुद्रा
  choice: ‘दण्डवत करके’ और ‘मेरे स्वामी राजा’
  alternative: ‘राजा की आराधना की’
  rationale: मूल पाठ राजकीय सम्मान और अधीनता दिखाता है, राजा को ईश्वरीय उपासना का पात्र घोषित नहीं करता।
- issue: राजा द्वारा दास की ‘बात करने’ का अर्थ
  choice: ‘अपने दास की बात मान ली है’
  alternative: ‘अपने दास की बात पूरी की है’
  rationale: मुख्य पाठ में प्रसंगानुकूल हिन्दी मुहावरा रखा गया है, पर शाब्दिक संरचना को पादटिप्पणी में दिया गया है ताकि मूल की अभिव्यक्ति छिपे नहीं।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। राजदरबारी विनम्रता के लिए ‘आपके दास’ और ‘मेरे स्वामी राजा’ बनाए रखे गए हैं; ‘दण्डवत’ मानवीय राजा के प्रति गहरे सम्मान को दर्शाता है, आराधना को नहीं।
