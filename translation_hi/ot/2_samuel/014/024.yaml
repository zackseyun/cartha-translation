base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/024.yaml
  text: But the king said[a], “Let him turn aside to his own house, and let him not see my face.” So Absalom turned aside to his own house and did not see the king’s face.
translation:
  language: hi
  text: परन्तु राजा ने कहा[a], “वह मुड़कर अपने घर चला जाए और मेरा मुख न देखे।” तब अबशालोम मुड़कर अपने घर चला गया और उसने राजा का मुख नहीं देखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “मेरा मुख देखे” और “राजा का मुख देखा”; यह किसी की उपस्थिति में आने या उससे मिलने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: परन्तु राजा ने कहा
  rationale: 'वाव-क्रमिक यहाँ कथा में हल्का विरोध दिखाता है: अबशालोम लौट तो आया, पर राजा ने उसे दर्शन देने से इनकार किया।'
- source_word: יִסֹּב / וַיִּסֹּב (סבב)
  choice: मुड़कर ... चला जाए / मुड़कर ... चला गया
  rationale: क्रिया का दोहराव बनाए रखते हुए राजा के पास जाने के बजाय अपने घर की ओर मोड़े जाने का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: בֵּיתוֹ
  choice: अपने घर
  rationale: प्रत्यययुक्त संज्ञा का सीधा और स्वाभाविक हिन्दी रूप; यह राजा की उपस्थिति से अलग अबशालोम के निवास को दर्शाता है।
- source_word: וּפָנַי ... לֹא יִרְאֶה
  choice: और मेरा मुख न देखे
  rationale: ‘मुख देखना’ उपस्थित होने या दर्शन पाने का इब्रानी मुहावरा है; ठोस अभिव्यक्ति और निषेधात्मक आज्ञा दोनों सुरक्षित रखे गए हैं।
- source_word: וּפְנֵי הַמֶּלֶךְ לֹא רָאָה
  choice: और उसने राजा का मुख नहीं देखा
  rationale: आज्ञा और उसके पालन के बीच मूल पाठ का शब्दगत दोहराव तथा दर्शन से वंचित रहने का कथात्मक बल बना रहता है।
- source_word: אַבְשָׁלוֹם
  choice: अबशालोम
  rationale: नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
theological_decisions:
- issue: ‘मेरा मुख देखना / राजा का मुख देखना’ मुहावरे को शाब्दिक रखना या राजकीय उपस्थिति/दर्शन के रूप में खोलना
  choice: मुख-संबंधी मुहावरा मुख्य पाठ में सुरक्षित रखा गया
  alternative: मेरी उपस्थिति में न आए / उसे राजा के दर्शन नहीं मिले
  rationale: मूल की पुनरुक्ति और कथात्मक तनाव बनाए रखने के लिए मुहावरा शाब्दिक रखा गया है; पादटिप्पणी उसका सामाजिक आशय स्पष्ट करती है, बिना यह तय किए कि औपचारिक राजकीय भेंट की कौन-सी प्रक्रिया अभिप्रेत थी।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रूप। ‘परन्तु’ प्रसंग का विरोध स्पष्ट करता है; ‘मुख’ मूल मुहावरे और उसकी पुनरुक्ति को सुरक्षित रखता है।
