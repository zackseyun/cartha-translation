  yaml_path: translation/ot/2_samuel/014/025.yaml
  text: In all Israel there was not a man as handsome as Absalom[a], so highly praised; from the sole of his foot to the crown of his head there was no blemish in him.
translation:
  language: hi
  text: समूचे इस्राएल में अबशालोम जैसा सुन्दर पुरुष कोई नहीं था; उसकी बहुत अधिक प्रशंसा होती थी।[a] उसके पाँव के तलवे से लेकर सिर की चोटी तक उसमें कोई दोष नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध का अनुवाद ‘वह अत्यन्त प्रशंसनीय था’ या ‘उसकी अत्यधिक प्रशंसा की जाती थी’ भी हो सकता है। यह अबशालोम को मिलने वाली प्रशंसा की असाधारण मात्रा पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְאַבְשָׁלוֹם לֹא הָיָה אִישׁ יָפֶה בְּכָל יִשְׂרָאֵל
  choice: समूचे इस्राएल में अबशालोम जैसा सुन्दर पुरुष कोई नहीं था
  rationale: 'इब्रानी वाक्य तुलना के द्वारा सर्वोच्चता व्यक्त करता है: पूरे इस्राएल में कोई पुरुष सुन्दरता में अबशालोम की बराबरी नहीं करता था। हिन्दी में ‘अबशालोम जैसा ... कोई नहीं’ इस भाव को स्वाभाविक रूप से व्यक्त करता है।'
- source_word: לְהַלֵּל מְאֹד
  choice: उसकी बहुत अधिक प्रशंसा होती थी
  rationale: यह पदबंध प्रशंसा की असाधारण मात्रा बताता है। निष्क्रिय भाव वाला हिन्दी वाक्य मूल के अर्थ को सहज और स्पष्ट रखता है, जबकि प्रशंसा के ठीक आधार को अनावश्यक रूप से नहीं जोड़ता।
- source_word: מִכַּף רַגְלוֹ וְעַד קָדְקֳדוֹ
  choice: उसके पाँव के तलवे से लेकर सिर की चोटी तक
  rationale: यह शरीर के दोनों सिरों का उल्लेख करके सम्पूर्ण शरीर को दर्शाता है। ‘तलवा’ और ‘सिर की चोटी’ दोनों अंगों के स्वाभाविक आधुनिक हिन्दी नाम हैं।
- source_word: לֹא הָיָה בוֹ מוּם
  choice: उसमें कोई दोष नहीं था
  rationale: מוּם यहाँ शारीरिक दाग, विकृति या कमी को सूचित करता है। ‘दोष’ व्यापक और गरिमापूर्ण शब्द है तथा प्रसंग में शारीरिक अर्थ स्पष्ट रहता है।
