  yaml_path: translation/ot/2_samuel/014/016.yaml
  text: For the king will hear[b][a], to deliver his servant from the hand of the man who would destroy me and my son together from the inheritance of God.
translation:
  language: hi
  text: क्योंकि राजा अपनी दासी की बात सुनेगा और उसे उस मनुष्य के हाथ से छुड़ाएगा, जो मुझे और मेरे बेटे को—हम दोनों को—परमेश्वर की विरासत[a] से मिटा देना चाहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “परमेश्वर की विरासत” से आशय संभवतः इस्राएल में परमेश्वर द्वारा दी गई विरासत है; इसका अर्थ “परमेश्वर की अपनी विरासत” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्त्री के विश्वास का आधार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इसका स्वाभाविक संबंध स्पष्ट करता है।
- source_word: יִשְׁמַע
  choice: सुनकर
  rationale: שׁמע में सुनने के साथ ध्यान देने का भाव भी हो सकता है। ‘सुनकर ... छुड़ाएगा’ हिन्दी में अनुवर्ती प्रतिक्रिया को स्वाभाविक रूप से व्यक्त करता है, बिना अर्थ को केवल ‘मानना’ तक सीमित किए।
- source_word: לְהַצִּיל
  choice: छुड़ाएगा
  rationale: נצל का हिफ़ील रूप किसी के अधिकार या संकट से बचाने अथवा छुड़ाने का अर्थ देता है; यहाँ ‘छुड़ाएगा’ उपयुक्त और सहज है।
- source_word: אֲמָתוֹ
  choice: अपनी दासी
  rationale: हिब्रू संज्ञा विशेष रूप से स्त्रीलिंग है और राजदरबार में वक्ता का विनम्र आत्म-संबोधन है; हिन्दी ‘दासी’ लिंग और विनय दोनों को स्पष्ट रखता है।
- source_word: מִכַּף הָאִישׁ
  choice: उस मनुष्य के हाथ से
  rationale: ‘हाथ’ अधिकार या पकड़ का हिब्रू मुहावरा है; इसे बनाए रखने पर मूल की औपचारिक बनावट और अर्थ दोनों सुरक्षित रहते हैं।
- source_word: לְהַשְׁמִיד
  choice: मिटा देना चाहता है
  rationale: यह उस मनुष्य के विनाशकारी उद्देश्य को व्यक्त करता है। ‘मिटा देना’ परिवार की वंश-रेखा और विरासत से उच्छेद के संदर्भ में स्वाभाविक है।
- source_word: יַחַד
  choice: हम दोनों को
  rationale: मूल में माँ और बेटे को एक साथ निशाना बनाए जाने पर बल है; ‘हम दोनों को’ हिन्दी में इस बल को स्पष्ट करता है।
- source_word: מִנַּחֲלַת אֱלֹהִים
  choice: परमेश्वर की विरासत से
  rationale: यह मूल संबंधसूचक संरचना को सुरक्षित रखता है और परमेश्वर द्वारा दी गई विरासत तथा परमेश्वर की अपनी विरासत—दोनों संभावित अर्थों को मुख्य पाठ में खुला छोड़ता है।
theological_decisions:
- issue: ‘परमेश्वर की विरासत’ का अर्थ
  choice: मुख्य पाठ में व्यापक और अस्पष्ट अभिव्यक्ति ‘परमेश्वर की विरासत’ रखी गई है।
  alternative: परमेश्वर द्वारा इस्राएल में बाँटी गई विरासत; अथवा परमेश्वर की अपनी प्रजा/मिल्कियत।
  rationale: तात्कालिक प्रसंग परिवार की वंश-रेखा के मिटने और इस्राएल में उसके हिस्से से वंचित होने से जुड़ा है, पर हिब्रू संबंधसूचक वाक्यांश किसी एक व्याख्या को निर्णायक रूप से नहीं चुनता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘दासी’ को मुख्य पाठ में रखा गया है क्योंकि मूल शब्द स्पष्ट रूप से स्त्रीलिंग है। वाक्य की हिब्रू संरचना को हिन्दी में स्वाभाविक बनाने के लिए ‘सुनकर ... छुड़ाएगा’ और उद्देश्यवाचक infinitive के लिए ‘जो ... चाहता है’ प्रयोग किया गया है।
