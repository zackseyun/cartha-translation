translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और कथात्मक रखी गई है। राजा के लिए ‘आप’ तथा स्त्री के विनम्र आत्म-संबोधन के लिए ‘दासी’ रखा गया है। मूल के ‘हाथ’, ‘दाएँ-बाएँ’ और ‘मुँह में डालना’ जैसे सजीव बिंब जहाँ हिन्दी में बोधगम्य हैं, वहाँ सुरक्षित रखे गए हैं।
