  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ הֲ/יַ֥ד יוֹאָ֛ב אִתָּ֖/ךְ בְּ/כָל זֹ֑את וַ/תַּ֣עַן הָ/אִשָּׁ֣ה וַ/תֹּ֡אמֶר חֵֽי נַפְשְׁ/ךָ֩ אֲדֹנִ֨/י הַ/מֶּ֜לֶךְ אִם אִ֣שׁ לְ/הֵמִ֣ין וּ/לְ/הַשְׂמִ֗יל מִ/כֹּ֤ל אֲשֶׁר דִּבֶּר֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כִּֽי עַבְדְּ/ךָ֤ יוֹאָב֙ ה֣וּא צִוָּ֔/נִי וְ/ה֗וּא שָׂ֚ם בְּ/פִ֣י שִׁפְחָֽתְ/ךָ֔ אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/019.yaml
  text: Then the king said[a], “Is the hand of Joab with you in all this?” And the woman answered and said, “As your soul lives, my lord the king, no one can turn to the right or to the left from anything that my lord the king has spoken, for your servant Joab himself commanded me[b], and he himself put all these words into the mouth of your female servant.”
translation:
  language: hi
  text: तब राजा ने कहा, “क्या इस सारे मामले में तुम्हारे साथ योआब का हाथ है?” स्त्री ने उत्तर दिया, “मेरे स्वामी राजा, आपके प्राण की शपथ![a] आपने जो कुछ कहा है, उससे कोई भी दाएँ या बाएँ नहीं हट सकता।[b] क्योंकि आपके सेवक योआब ने ही मुझे आज्ञा दी थी, और उसी ने ये सारी बातें आपकी दासी के मुँह में डाली थीं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जैसे आपका प्राण जीवित है।” यह दृढ़ शपथ का इब्रानी सूत्र है।
    reason: lexical_alternative
  - marker: b
    text: “दाएँ या बाएँ हटना” इब्रानी मुहावरा है, जिसका अर्थ राजा की कही बात से हटना, उसे टालना या उसका खंडन करना है।
    reason: cultural_note
lexical_decisions:
- source_word: הֲיַד יוֹאָב אִתָּךְ
  choice: क्या ... तुम्हारे साथ योआब का हाथ है?
  rationale: ‘हाथ’ को बनाए रखने से योआब की संलिप्तता और प्रभाव का ठोस इब्रानी बिंब सुरक्षित रहता है; हिन्दी में भी किसी मामले में किसी का ‘हाथ होना’ स्वाभाविक मुहावरा है।
- source_word: בְּכָל זֹאת
  choice: इस सारे मामले में
  rationale: यह पद पूरी योजना और वर्तमान प्रसंग की ओर संकेत करता है; ‘मामले’ से आशय सामान्य पाठक के लिए स्पष्ट होता है।
- source_word: חֵי נַפְשְׁךָ
  choice: आपके जीवन की शपथ
  rationale: यह राजकीय संबोधन में प्रयुक्त दृढ़ शपथ-सूत्र है। यह अनुवाद मूल के ‘आपका प्राण जीवित है’ वाले भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אִם אִישׁ לְהֵמִין וּלְהַשְׂמִיל
  choice: कोई न दाएँ हट सकता है, न बाएँ
  rationale: दिशात्मक रूपक को बनाए रखते हुए यह राजा की बात से तनिक भी हटने, उसे टालने या उसका खंडन करने की असम्भवता व्यक्त करता है।
- source_word: עַבְדְּךָ
  choice: आपके सेवक
  rationale: योआब के लिए दरबारी संबंध में ‘सेवक’ स्वाभाविक है और यहाँ दासत्व को अनावश्यक रूप से प्रमुख नहीं बनाता।
- source_word: צִוָּנִי
  choice: मुझे आज्ञा दी थी
  rationale: क्रिया योआब द्वारा अधिकारपूर्वक निर्देश दिए जाने को व्यक्त करती है; ‘आज्ञा’ राजकीय कथा के अनुरूप है।
- source_word: שָׂם בְּפִי שִׁפְחָתְךָ
  choice: आपकी दासी के मुँह में डाली थीं
  rationale: मूल के सजीव मुहावरे को सुरक्षित रखता है और स्पष्ट करता है कि योआब ने उसे कहने के लिए ठीक ये बातें दी थीं।
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ये सारी बातें
  rationale: דברים का अर्थ ‘शब्द’ या ‘बातें’ दोनों हो सकता है; यहाँ ‘बातें’ आधुनिक हिन्दी में स्वाभाविक है और उसके दिए हुए कथन का आशय बनाए रखता है।
