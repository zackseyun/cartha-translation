  edition: WLC
  text: כִּי מ֣וֹת נָמ֔וּת וְ/כַ/מַּ֨יִם֙ הַ/נִּגָּרִ֣ים אַ֔רְצָ/ה אֲשֶׁ֖ר לֹ֣א יֵאָסֵ֑פוּ וְ/לֹֽא יִשָּׂ֤א אֱלֹהִים֙ נֶ֔פֶשׁ וְ/חָשַׁב֙ מַֽחֲשָׁב֔וֹת לְ/בִלְתִּ֛י יִדַּ֥ח מִמֶּ֖/נּוּ נִדָּֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/014.yaml
  text: For we must surely die and are like water poured out on the ground[a], which cannot be gathered up again. Yet God does not take away life[b], but devises plans so that the banished one will not remain banished from him.
translation:
  language: hi
  text: क्योंकि हम अवश्य मरेंगे और भूमि पर बहाए गए पानी के समान हैं, जिसे फिर इकट्ठा नहीं किया जा सकता। फिर भी परमेश्वर किसी का प्राण नहीं लेता[a], बल्कि ऐसी योजनाएँ बनाता है कि निर्वासित व्यक्ति उससे निर्वासित न रहे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर किसी व्यक्ति का पक्ष नहीं लेता।” इब्रानी वाक्यांश कठिन है और उसका अर्थ अलग ढंग से भी समझा जाता है।
    reason: alternative_reading
  - marker: b
    text: या, “ताकि निर्वासित व्यक्ति उससे दूर न धकेला जाए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के समर्थन में कारण प्रस्तुत करता है और प्रसंग के तर्कपूर्ण संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מוֹת נָמוּת
  choice: हम अवश्य मरेंगे
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute मृत्यु की निश्चितता पर बल देता है; ‘अवश्य मरेंगे’ उस बल को सहज हिन्दी में व्यक्त करता है।
- source_word: וְכַמַּיִם הַנִּגָּרִים אַרְצָה
  choice: और भूमि पर बहाए गए पानी के समान हैं
  rationale: यह उपमा मृत्यु के बाद वापस न लौट सकने को दर्शाती है। ‘बहाए गए पानी’ से अगली पंक्ति में उसे फिर इकट्ठा न कर पाने का संबंध स्पष्ट रहता है।
- source_word: אֲשֶׁר לֹא יֵאָסֵפוּ
  choice: जिसे फिर इकट्ठा नहीं किया जा सकता
  rationale: निफ़ाल रूप यहाँ बिखरे पानी को पुनः एकत्र करने की असंभवता या न हो सकने को व्यक्त करता है।
- source_word: וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ
  choice: फिर भी परमेश्वर किसी का प्राण नहीं लेता
  rationale: कठिन इब्रानी पदबंध को निकटवर्ती मृत्यु-विषयक प्रसंग में जीवन न छीनने के अर्थ में लिया गया है। ‘प्राण’ यहाँ נֶפֶשׁ को जीवित व्यक्ति अथवा जीवन के अर्थ में स्वाभाविक ढंग से व्यक्त करता है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וְחָשַׁב מַחֲשָׁבוֹת
  choice: बल्कि ऐसे उपाय सोचता है
  rationale: सजातीय क्रिया-संज्ञा रचना सोची-समझी योजना बनाने पर बल देती है; ‘उपाय सोचता है’ पुनर्स्थापन के प्रसंग में सहज और अर्थपूर्ण है।
- source_word: לְבִלְתִּי יִדַּח
  choice: कि ... निर्वासित न रहे
  rationale: निफ़ाल क्रिया दूर धकेले या निर्वासित किए जाने को दर्शाती है। प्रसंग में उद्देश्य उस अवस्था को समाप्त करना है, इसलिए ‘निर्वासित न रहे’ उपयुक्त है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: מִמֶּנּוּ נִדָּח
  choice: निर्वासित जन उससे
  rationale: इब्रानी पदक्रम संक्षिप्त है। ‘निर्वासित जन ... उससे’ एकवचन व्यक्ति और परमेश्वर से उसके अलगाव—दोनों को बनाए रखता है।
theological_decisions:
- issue: וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ का अर्थ
  choice: फिर भी परमेश्वर किसी का प्राण नहीं लेता
  alternative: परमेश्वर किसी व्यक्ति का पक्ष नहीं लेता
  rationale: पदबंध व्याकरण और अर्थ दोनों की दृष्टि से कठिन है। मृत्यु, निर्वासन और पुनर्स्थापन के इस प्रसंग में ‘प्राण नहीं लेता’ प्रवाह के अनुकूल है, पर पक्षपात न करने का अर्थ भी संभव होने के कारण उसे पादटिप्पणी में रखा गया है।
- issue: לְבִלְתִּי יִדַּח में निर्वासन की अवस्था अथवा निष्कासन की क्रिया
  choice: निर्वासित जन उससे निर्वासित न रहे
  alternative: निर्वासित जन उससे दूर न धकेला जाए
  rationale: मुख्य पाठ पुनर्स्थापन के उद्देश्य और जारी निर्वासन के अंत को स्पष्ट करता है; वैकल्पिक अनुवाद क्रिया के अधिक प्रत्यक्ष निष्कासन-अर्थ को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। ‘भूमि’, ‘प्राण’, ‘उपाय’ और ‘निर्वासित जन’ औपचारिकता तथा स्पष्टता का संतुलन रखते हैं। कठिन इब्रानी पदबंधों की वास्तविक अस्पष्टता पादटिप्पणियों में संरक्षित है।
