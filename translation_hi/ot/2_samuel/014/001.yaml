base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/001.yaml
  text: Joab son of Zeruiah knew that the king’s heart was toward Absalom[a].
translation:
  language: hi
  text: सरूयाह के पुत्र योआब ने जान लिया कि राजा का मन अबशालोम की ओर था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राजा अबशालोम के लिए तरस रहा था।” इब्रानी अभिव्यक्ति संक्षिप्त है और सामान्य रूप से “राजा का मन अबशालोम की ओर लगा था” भी समझी जा सकती है। कुछ लोग इसे नकारात्मक अर्थ में, “राजा का मन अबशालोम के विरुद्ध था,” समझते हैं; फिर भी आगे का प्रसंग सकारात्मक झुकाव के पक्ष में है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: ने जान लिया
  rationale: ידע का वय्यिक्तोल रूप कथा को आगे बढ़ाता है। हिंदी में ‘जान लिया’ इस बोध को स्वाभाविक रूप से व्यक्त करता है; मूल में कोई स्पष्ट ‘अब’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: יוֹאָב בֶּן צְרֻיָה
  choice: सरूयाह के पुत्र योआब
  rationale: संबंधवाचक रचना को स्वाभाविक हिंदी में रखा गया है और नामों का मानक देवनागरी लिप्यंतरण किया गया है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי उस बात का परिचय देता है जिसे योआब ने जाना।
- source_word: לֵב הַמֶּלֶךְ
  choice: राजा का मन
  rationale: לֵב यहाँ राजा की भीतरी प्रवृत्ति, इच्छा या भाव को दर्शाता है। आधुनिक हिंदी में ‘मन’ यह अर्थ स्वाभाविक ढंग से देता है, जबकि शाब्दिक ‘हृदय’ इस संदर्भ में कम सहज होता।
- source_word: עַל
  choice: की ओर था
  rationale: ‘मन’ के साथ עַל की संक्षिप्त अभिव्यक्ति दिशात्मक है और संदर्भ के अनुसार स्नेह, लालसा, चिंता अथवा विरोध तक समझी जा सकती है। ‘की ओर था’ इसे अनावश्यक रूप से निश्चित नहीं करती।
- source_word: אַבְשָׁלוֹם
  choice: अबशालोम
  rationale: व्यक्तिनाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
theological_decisions:
- issue: अबशालोम के प्रति राजा के मनोभाव की अस्पष्टता
  choice: राजा का मन अबशालोम की ओर था
  alternative: राजा अबशालोम के लिए तरस रहा था; राजा का मन अबशालोम के विरुद्ध था
  rationale: इब्रानी कथन अत्यंत संक्षिप्त है और मनोभाव को स्पष्टतः सकारात्मक या नकारात्मक नहीं बताता। मुख्य पाठ दिशात्मक अभिव्यक्ति बनाए रखता है; आगे का संदर्भ सकारात्मक झुकाव का समर्थन करता है, पर दूसरी व्याख्या को पूरी तरह मिटाता नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मन ... की ओर था’ मूल की संक्षिप्तता और वास्तविक अर्थगत अस्पष्टता को बनाए रखता है।
