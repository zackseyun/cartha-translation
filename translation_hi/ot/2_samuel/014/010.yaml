base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/010.yaml
  text: And the king said[a], “Whoever speaks to you, bring him to me, and he will never touch you again.”
translation:
  language: hi
  text: तब राजा ने कहा, “जो कोई तुमसे कुछ कहे, उसे मेरे पास ले आना; फिर वह तुम्हें कभी हाथ नहीं लगाएगा[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “फिर वह तुम्हें हानि नहीं पहुँचाएगा।” इब्रानी में मूल अर्थ “छूना” है, पर यहाँ इसका आशय शत्रुतापूर्ण ढंग से हाथ लगाने या हानि पहुँचाने से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित पद को प्रसंगानुसार स्वाभाविक हिन्दी में ‘राजा’ कहा गया है।
- source_word: הַמְדַבֵּר אֵלַיִךְ
  choice: जो कोई तुमसे कुछ कहे
  rationale: संज्ञा के रूप में प्रयुक्त निश्चित कृदंत किसी ऐसे व्यक्ति को सूचित करता है जो स्त्री से इस विषय में बोले; ‘जो कोई’ निर्देश के खुले दायरे को व्यक्त करता है। ‘कुछ’ हिन्दी वाक्य को स्वाभाविक बनाता है, बिना कथन की विषयवस्तु निश्चित किए।
- source_word: וַהֲבֵאתוֹ אֵלַי
  choice: उसे मेरे पास ले आना
  rationale: בוא का हिफ़ील रूप यहाँ कारणवाचक है—उसे आने देना/लाना। आज्ञार्थक भाव को सहज हिन्दी में रखा गया है।
- source_word: לֹא יֹסִיף עוֹד
  choice: फिर ... कभी नहीं
  rationale: יסף के साथ עוד पुनरावृत्ति या आगे जारी रहने के निषेध को व्यक्त करता है; ‘फिर ... कभी नहीं’ हिन्दी में उसी बल को स्वाभाविक रूप से देता है।
- source_word: לָגַעַת בָּךְ
  choice: तुम्हें ... हाथ नहीं लगाएगा
  rationale: נגע का मूल अर्थ ‘छूना’ है। ‘हाथ लगाना’ हिन्दी में मूल चित्र बनाए रखता है और प्रसंगानुसार धमकाने, आक्रमण करने या हानि पहुँचाने का भाव भी ग्रहण कर सकता है।
