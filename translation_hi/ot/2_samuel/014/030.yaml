  text: וַ/יֹּ֨אמֶר אֶל עֲבָדָ֜י/ו רְאוּ֩ חֶלְקַ֨ת יוֹאָ֤ב אֶל יָדִ/י֙ וְ/ל/וֹ שָׁ֣ם שְׂעֹרִ֔ים לְכ֖וּ ו/הוצתי/ה בָ/אֵ֑שׁ וַ/יַּצִּ֜תוּ עַבְדֵ֧י אַבְשָׁל֛וֹם אֶת הַ/חֶלְקָ֖ה בָּ/אֵֽשׁ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/030.yaml
  text: Then he said to his servants[a], “Look, Joab’s field is next to mine, and he has barley there. Go and set it on fire.” So Absalom’s servants set the field on fire.
translation:
  language: hi
  text: तब उसने अपने सेवकों से कहा, “देखो, योआब का खेत मेरे खेत के पास है, और उसमें उसकी जौ की फसल खड़ी है। जाओ, उसमें आग लगा दो।” तब अबशालोम के सेवकों ने उस खेत में आग लगा दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶלְקַת
  choice: खेत
  rationale: कथा के कृषि-संदर्भ में यह योआब की खेती की भूमि को दर्शाता है; आधुनिक हिन्दी में ‘खेत’ स्वाभाविक और स्पष्ट है।
- source_word: אֶל יָדִי
  choice: मेरे खेत के पास
  rationale: शाब्दिक अर्थ ‘मेरे हाथ के पास’ है, पर भूमि के संदर्भ में यह निकटता या सटी हुई संपत्ति का मुहावरा है। ‘मेरे खेत के पास’ आशय स्पष्ट करता है।
- source_word: שְׂעֹרִים
  choice: जौ की फसल
  rationale: बहुवचन संज्ञा यहाँ खेत में उगी जौ को दर्शाती है। ‘जौ की फसल खड़ी है’ हिन्दी में कृषि-संदर्भ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְהוּצִיתִהָ / וַיַּצִּתוּ
  choice: आग लगा दो / आग लगा दी
  rationale: हिफ़ील रूप किसी वस्तु को प्रज्वलित करने का सकर्मक भाव देता है; आदेश और उसके पालन में समान अभिव्यक्ति रखने से शब्दगत संगति बनी रहती है।
- source_word: עֲבָדָיו / עַבְדֵי אַבְשָׁלוֹם
  choice: सेवकों / अबशालोम के सेवकों
  rationale: עבד दास या सेवक दोनों अर्थ दे सकता है। राजकीय कथा में बंधुआ स्थिति पर बल नहीं है, इसलिए ‘सेवक’ संदर्भानुकूल है और अनावश्यक विशिष्टीकरण से बचता है।
- source_word: רְאוּ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला बहुवचन आदेश है; सीधे संवाद में ‘देखो’ सहज है।
- source_word: לְכוּ
  choice: जाओ
  rationale: आग लगाने की आज्ञा से पहले आने वाला स्पष्ट बहुवचन गमनादेश है।
