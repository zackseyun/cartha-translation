translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मेरे खेत के पास’ मूल इब्रानी मुहावरे का अर्थ पाठ में स्पष्ट कर देता है, इसलिए अलग पादटिप्पणी आवश्यक नहीं मानी गई। ‘खड़ी है’ कृषि-संदर्भ में जौ की मौजूद फसल को स्वाभाविक हिन्दी में व्यक्त करता है।
