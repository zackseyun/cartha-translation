  text: Then go to the king and speak to him in this way[a]. And Joab put the words in her mouth.
translation:
  language: hi
  text: फिर राजा के पास जाकर उससे इसी प्रकार कहना। और योआब ने वे बातें उसके मुँह में डाल दीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बातें उसके मुँह में डाल दीं’ इब्रानी मुहावरा है, जिसका अर्थ है कि योआब ने उसे ठीक-ठीक बता दिया कि उसे क्या कहना था।
    reason: cultural_note
lexical_decisions:
- source_word: וּבָאת
  choice: फिर ... जाकर
  rationale: संयोजक के साथ पूर्णकालिक रूप यहाँ निर्देशों के क्रम में आज्ञार्थक भाव देता है; स्त्री को अगले कदम के रूप में राजा के पास जाने को कहा गया है।
- source_word: אֶל־הַמֶּלֶךְ
  choice: राजा के पास
  rationale: אֶל गति और दिशा बताता है; हिंदी में ‘राजा के पास’ स्वाभाविक और सटीक है।
- source_word: וְדִבַּרְתְּ אֵלָיו
  choice: उससे ... कहना
  rationale: דבר אֶל का अर्थ उससे बोलना है; इस संदर्भ में हिंदी का ‘कहना’ निर्देशित कथन को सहज ढंग से व्यक्त करता है।
- source_word: כַּדָּבָר הַזֶּה
  choice: इसी प्रकार
  rationale: यह पदबंध आगे दिए जाने वाले कथन की रीति अथवा विषयवस्तु का संकेत करता है; ‘इसी प्रकार’ उसके संकेतात्मक बल को बनाए रखता है।
- source_word: וַיָּשֶׂם
  choice: डाल दीं
  rationale: שׂים का मूल अर्थ रखना या डालना है; ‘बातें मुँह में डालना’ हिंदी में भी समझ आने वाला जीवंत मुहावरा है।
- source_word: אֶת־הַדְּבָרִים
  choice: वे बातें
  rationale: बहुवचन דְּבָרִים यहाँ योआब द्वारा तैयार किए गए कथन को दर्शाता है; ‘वे बातें’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: בְּפִיהָ
  choice: उसके मुँह में
  rationale: स्रोत का सजीव मुहावरा सुरक्षित रखा गया है; संदर्भ में इसका आशय उसे ठीक-ठीक बताना है कि क्या कहना है।
