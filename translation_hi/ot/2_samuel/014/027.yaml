  text: अबशालोम के तीन बेटे और एक बेटी पैदा हुए। उस बेटी का नाम तामार था। वह देखने में सुंदर स्त्री थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּלְדוּ לְאַבְשָׁלוֹם
  choice: अबशालोम के ... पैदा हुई
  rationale: निफ़अल रूप और לְ वाली रचना संतान के जन्म तथा माता-पिता से संबंध को व्यक्त करती है। हिन्दी में मिश्रित लिंग वाले कर्ताओं के साथ निकटतम संज्ञा ‘बेटी’ के अनुसार ‘पैदा हुई’ स्वाभाविक है।
- source_word: שְׁלוֹשָׁה בָנִים וּבַת אַחַת
  choice: तीन बेटे और एक बेटी
  rationale: मूल पाठ में बेटों और बेटी का लिंग तथा उनकी संख्या स्पष्ट है; इसे सीधे और स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: וּשְׁמָהּ תָּמָר
  choice: उसकी बेटी का नाम तामार था
  rationale: स्त्रीलिंग प्रत्यय हाल में उल्लिखित बेटी की ओर संकेत करता है। हिन्दी में केवल ‘उसका नाम’ से अबशालोम का संदर्भ भ्रमित हो सकता था, इसलिए ‘उसकी बेटी’ स्पष्ट किया गया है।
- source_word: תָּמָר
  choice: तामार
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: הִיא הָיְתָה אִשָּׁה יְפַת מַרְאֶה
  choice: वह देखने में बहुत सुंदर स्त्री थी
  rationale: יְפַת מַרְאֶה शारीरिक रूप-सौंदर्य का मुहावरा है। ‘देखने में बहुत सुंदर’ हिन्दी में स्वाभाविक है और אִשָּׁה का स्पष्ट अर्थ ‘स्त्री’ भी बनाए रखता है।
