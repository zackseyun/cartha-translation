  register: भाषा आधुनिक, सहज और गरिमापूर्ण कथात्मक हिन्दी है। योआब के सीधे संबोधन में ‘तेरे’ रखा गया है, जो प्रसंग की टकरावपूर्ण प्रत्यक्षता को बनाए रखता है। पद में ऐसी कोई वास्तविक पाठगत या अर्थगत अस्पष्टता नहीं है जिसके लिए पादटिप्पणी आवश्यक हो।
