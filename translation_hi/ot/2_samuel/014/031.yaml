translation:
  language: hi
  text: तब योआब उठकर अबशालोम के घर गया और उससे कहा, “तेरे सेवकों ने मेरे खेत को आग क्यों लगाई?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: तब योआब उठा
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; ‘तब’ क्रम को और ‘उठा’ इब्रानी कथात्मक अभिव्यक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיָּבֹא אֶל אַבְשָׁלוֹם הַבָּיְתָה
  choice: अबशालोम के घर गया
  rationale: दिशासूचक ה वाला הַבָּיְתָה घर की ओर जाने को दर्शाता है; प्रसंग में यह अबशालोम का निवास है।
- source_word: לָמָּה
  choice: क्यों
  rationale: प्रत्यक्ष प्रश्नवाचक का सरल और स्वाभाविक हिन्दी रूप।
- source_word: הִצִּיתוּ
  choice: आग लगाई
  rationale: יצת का हिफ़ील रूप आग लगाने या प्रज्वलित करने का कारणवाचक अर्थ देता है; ‘आग लगाई’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: עֲבָדֶךָ
  choice: तेरे सेवकों
  rationale: रूप प्रत्यय सहित एकवचन है, पर बहुवचन क्रिया הִצִּיתוּ सामूहिक अर्थ में अनेक सेवकों की ओर संकेत करती है; ‘सेवक’ इस दरबारी प्रसंग में उपयुक्त है।
- source_word: הַחֶלְקָה אֲשֶׁר לִי
  choice: मेरे खेत
  rationale: חֶלְקָה भूमि के किसी खंड या खेत को सूचित करता है और אֲשֶׁר לִי उसका स्वामित्व बताता है; हिन्दी में ‘मेरे खेत’ संक्षिप्त और स्वाभाविक है।
- source_word: בָּאֵשׁ
  choice: में आग
  rationale: यहाँ בְּ साधन को दर्शाता है (‘आग से’); हिन्दी मुहावरे ‘खेत में आग लगाना’ में यही अर्थ स्वाभाविक रूप से व्यक्त होता है।
