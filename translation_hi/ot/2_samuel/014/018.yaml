  yaml_path: translation/ot/2_samuel/014/018.yaml
  text: Then the king answered and said to the woman[a], “Please do not hide from me anything that I ask you.” And the woman said, “Please speak[b], my lord the king.”
translation:
  language: hi
  text: तब राजा ने उत्तर दिया और उस स्त्री से कहा, “कृपया मैं तुझसे जो बात पूछूँ, वह मुझसे मत छिपाना[a]।” स्त्री ने कहा, “मेरे प्रभु राजा, कृपया बोलें[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “मुझसे कोई बात न छिपाना, जो मैं तुझसे पूछता हूँ।”'
    reason: lexical_alternative
  - marker: b
    text: 'अधिक शाब्दिक रूप में: “कृपया मेरे प्रभु राजा बोलें।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: उत्तर देकर ... कहा
  rationale: इब्रानी के दोनों संवाद-क्रियापदों को बनाए रखते हुए हिंदी में स्वाभाविक कथात्मक प्रवाह देता है।
- source_word: הָאִשָּׁה
  choice: उस स्त्री
  rationale: संदर्भ तकोआ की स्त्री का है; ‘उस’ पूर्वोल्लिखित पात्र को स्वाभाविक रूप से संकेत करता है।
- source_word: אַל נָא תְכַחֲדִי
  choice: कृपया ... न छिपाना
  rationale: निषेध और विनम्र आग्रह—दोनों को स्पष्ट करता है; संबोधन की निकट/अधीनस्थ एकवचन शैली को ‘तुझसे’ और ‘न छिपाना’ में रखा गया है।
- source_word: דָּבָר
  choice: बात
  rationale: यहाँ ‘वचन’ या ‘वस्तु’ की अपेक्षा पूछी जाने वाली जानकारी के लिए ‘बात’ सहज और अर्थानुकूल है।
- source_word: אֲשֶׁר אָנֹכִי שֹׁאֵל אֹתָךְ
  choice: जो बात मैं तुझसे पूछूँ
  rationale: राजा जिस प्रश्न को अब रखने वाला है, उसके संदर्भ में हिंदी का संभावनार्थक रूप स्वाभाविक है और इब्रानी कृदंत के तात्कालिक आशय को व्यक्त करता है।
- source_word: יְדַבֶּר נָא
  choice: कृपया कहें
  rationale: तीसरे पुरुष के विनम्र इच्छार्थक प्रयोग को हिंदी के आदरसूचक रूप में व्यक्त करता है; ‘कहें’ संवाद के प्रसंग में ‘बोलें’ से अधिक स्वाभाविक है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: मेरे प्रभु राजा
  rationale: दरबारी आदरसूचक संबोधन और राजकीय पदवी दोनों को बिना सांप्रदायिक अर्थ जोड़े सुरक्षित रखता है।
