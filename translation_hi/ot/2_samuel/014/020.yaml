source:
  edition: WLC
  text: לְ/בַ/עֲב֤וּר סַבֵּב֙ אֶת פְּנֵ֣י הַ/דָּבָ֔ר עָשָׂ֛ה עַבְדְּ/ךָ֥ יוֹאָ֖ב אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/אדֹנִ֣/י חָכָ֗ם כְּ/חָכְמַת֙ מַלְאַ֣ךְ הָ/אֱלֹהִ֔ים לָ/דַ֖עַת אֶֽת כָּל אֲשֶׁ֥ר בָּ/אָֽרֶץ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/020.yaml
  text: In order to change the course of the matter[a], your servant Joab did this thing. But my lord is wise, with the wisdom of the angel of God[b], to know all that is in the land.
translation:
  language: hi
  text: “इस मामले का रुख बदलने के लिए[a] आपके सेवक योआब ने यह काम किया। परन्तु मेरे प्रभु परमेश्वर के दूत की बुद्धि के समान बुद्धिमान हैं, और देश में जो कुछ है वह सब जानते हैं[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बात का चेहरा मोड़ने के लिए”; इसका अर्थ “बात को पलटने” या “उसका रूप बदलने” से भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “पृथ्वी पर जो कुछ है।” इस प्रसंग में सम्भवतः राजा के देश या राज्य का संकेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַעֲבוּר
  choice: के लिए
  rationale: यहाँ यह पद उद्देश्य प्रकट करता है; हिन्दी में ‘के लिए’ इसका सहज और स्पष्ट रूप है।
- source_word: סַבֵּב אֶת־פְּנֵי הַדָּבָר
  choice: इस बात को दूसरा रूप देने
  rationale: इब्रानी मुहावरे में शाब्दिक रूप से ‘बात का चेहरा मोड़ना’ है। ‘दूसरा रूप देना’ उसके रूप या प्रस्तुति को बदलने का भाव बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: עַבְדְּךָ
  choice: आपके सेवक
  rationale: राजा के सामने आदरपूर्ण दरबारी आत्म-संदर्भ के लिए ‘सेवक’ उपयुक्त है।
- source_word: עָשָׂה ... אֶת־הַדָּבָר הַזֶּה
  choice: यह काम किया
  rationale: यह क्रिया और कर्म का सीधा, स्वाभाविक हिन्दी अनुवाद है; ‘काम’ पहले आए ‘बात’ की अनावश्यक पुनरावृत्ति से बचाता है।
- source_word: וַאדֹנִי
  choice: परन्तु मेरे प्रभु
  rationale: वाव यहाँ कथन को व्याख्या से प्रशंसा की ओर ले जाता है और हल्का विरोध अथवा संक्रमण सूचित करता है।
- source_word: חָכָם כְּחָכְמַת מַלְאַךְ הָאֱלֹהִים
  choice: मेरे प्रभु की बुद्धि परमेश्वर के दूत जैसी है
  rationale: यह रूप स्पष्ट तुलना को सुरक्षित रखता है। ‘दूत’ מַלְאָךְ का स्वाभाविक बाइबिलीय हिन्दी रूप है और लेख की अनुपस्थिति/उपस्थिति को हिन्दी पर कृत्रिम रूप से नहीं थोपता।
- source_word: לָדַעַת
  choice: जानते हैं
  rationale: इब्रानी infinitive यहाँ ज्ञान की क्षमता अथवा परिणाम बताता है; हिन्दी में अलग मुख्य वाक्य इसे सहज ढंग से व्यक्त करता है।
- source_word: כָּל אֲשֶׁר בָּאָרֶץ
  choice: देश में होने वाली हर बात
  rationale: राजकीय और स्थानीय प्रसंग में הָאָרֶץ का संभावित अर्थ राज्य या देश है। ‘हर बात’ राजा की राज्य के मामलों की जानकारी को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘परमेश्वर के दूत’ से तुलना
  choice: इसे दाऊद की असाधारण बुद्धि की तुलना के रूप में रखा गया है।
  alternative: इसे दाऊद के लिए दिव्य या सर्वज्ञ होने का अधिक प्रबल दावा समझना।
  rationale: इब्रानी पाठ स्पष्ट तुलनात्मक दरबारी प्रशंसा करता है; अनुवाद तुलना को बनाए रखता है और दाऊद के स्वभाव के विषय में उससे अधिक दावा नहीं जोड़ता।
- issue: הָאָרֶץ का विस्तार
  choice: देश
  alternative: पृथ्वी
  rationale: प्रसंग दाऊद के राज्य के मामलों का है, इसलिए ‘देश’ अधिक संभावित है; फिर भी व्यापक शाब्दिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, आदरपूर्ण और सामान्य पाठक के लिए सहज हिन्दी अपनाई गई है। ‘मेरे प्रभु’ और ‘आपके सेवक’ से दरबारी संबोधन सुरक्षित है। मूल मुहावरे को मुख्य पाठ में स्वाभाविक बनाया गया है और उसका शाब्दिक रूप पादटिप्पणी में दिया गया है।
