- source_word: שְׁנָתַיִם יָמִים
  choice: पूरे दो वर्ष
  rationale: शाब्दिक संरचना ‘दो वर्ष, दिन’ निश्चित और पूर्ण कालावधि का हिब्रू मुहावरा है; ‘पूरे दो वर्ष’ उसकी मुहावरेदार शक्ति को स्पष्ट करता है।
- source_word: וּפְנֵי הַמֶּלֶךְ
  choice: राजा का मुख
  rationale: मूल के ठोस वाक्यांश ‘राजा का मुख’ को बनाए रखा गया है; यहाँ इसका आशय राजा से प्रत्यक्ष भेंट या उसके सामने उपस्थित होने का अवसर है।
- source_word: לֹא רָאָה
  choice: उसने ... नहीं देखा
  rationale: हिब्रू निषेध और पूर्ण क्रिया का सीधा रूप, जो दूसरे समन्वित उपवाक्य को सुरक्षित रखता है।
