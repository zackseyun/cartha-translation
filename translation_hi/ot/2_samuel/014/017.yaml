base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/017.yaml
  text: Then your servant said[a], ‘Please let the word of my lord the king bring rest, for my lord the king is like the angel of God, to hear the good and the evil[b]. And may Yahweh your God be with you.’
translation:
  language: hi
  text: तब आपकी दासी ने कहा, “कृपा करके मेरे स्वामी राजा का वचन शांति का कारण हो, क्योंकि मेरे स्वामी राजा भले और बुरे को सुनने में[b] परमेश्वर के दूत[a] के समान हैं। याहवे आपके परमेश्वर आपके साथ हों।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर के स्वर्गदूत।” इब्रानी शब्द का अर्थ “दूत” या “स्वर्गदूत” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “भले और बुरे को सुनना” का आशय भले-बुरे में भेद करना या न्याय करना हो सकता है।
    reason: idiom_clarification
lexical_decisions:
- source_word: שִׁפְחָתְךָ
  choice: आपकी दासी
  rationale: यह स्त्री वक्ता का विनम्र, दरबारी आत्म-संबोधन है; हिन्दी में ‘दासी’ स्त्रीलिंग और आत्म-नम्रता दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: יִהְיֶה נָּא
  choice: कृपा करके ... हो
  rationale: नָא सहित इच्छार्थक रूप विनम्र निवेदन व्यक्त करता है; यह हिन्दी में उसके आदरसूचक और याचक स्वर को सुरक्षित रखता है।
- source_word: דְּבַר אֲדֹנִי הַמֶּלֶךְ
  choice: मेरे स्वामी राजा का वचन
  rationale: דָּבָר के ‘वचन/बात/निर्णय’ अर्थों में से ‘वचन’ मूल रूप के निकट है और प्रसंग में राजा की निर्णायक घोषणा को भी व्यक्त कर सकता है।
- source_word: לִמְנוּחָה
  choice: चैन देनेवाला
  rationale: מְנוּחָה विश्राम, राहत या शांति का भाव देता है। ‘चैन देनेवाला’ यहाँ राजा के वचन से चिंता और विवाद शांत होने का स्वाभाविक हिन्दी भाव है।
- source_word: כְּמַלְאַךְ הָאֱלֹהִים
  choice: परमेश्वर के दूत के समान
  rationale: מַלְאָךְ का मूल अर्थ ‘दूत’ है और यह स्वर्गदूत के लिए भी प्रयुक्त होता है। मुख्य पाठ में ‘दूत’ मूल की व्यापकता बचाता है; स्वर्गिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: לִשְׁמֹעַ הַטּוֹב וְהָרָע
  choice: भले और बुरे को सुनने में
  rationale: यह मूल के ‘भले और बुरे को सुनना’ को जानबूझकर सुरक्षित रखता है। प्रसंग में इसका न्यायिक आशय दोनों पक्ष सुनकर भेद या निर्णय करना हो सकता है, जिसे पादटिप्पणी बताती है।
- source_word: וַיהוָה אֱלֹהֶיךָ
  choice: याहवे, आपके परमेश्वर
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को ‘याहवे’ से और दूसरे पुरुष एकवचन संबंध को आदरसूचक हिन्दी ‘आपके’ से व्यक्त किया गया है।
- source_word: יְהִי עִמָּךְ
  choice: आपके साथ रहें
  rationale: यह आशीर्वादसूचक इच्छार्थक कथन है; हिन्दी में परमेश्वर के लिए आदरसूचक बहुवचन क्रिया स्वाभाविक है।
theological_decisions:
- issue: יהוה ईश्वरीय नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: מַלְאַךְ का अर्थ
  choice: दूत
  alternative: स्वर्गदूत
  rationale: शब्द ‘दूत’ और ‘स्वर्गदूत’ दोनों अर्थ रख सकता है। ‘परमेश्वर का दूत’ इस पदबंध के अलौकिक संकेत को संभव रखता है, पर मूल की वास्तविक शाब्दिक व्यापकता को बंद नहीं करता।
- issue: ‘भले और बुरे को सुनना’ का न्यायिक आशय
  choice: मूल मुहावरे को मुख्य पाठ में बनाए रखना
  alternative: भले-बुरे में भेद करना / सही-गलत का निर्णय करना
  rationale: לִשְׁמֹעַ का स्पष्ट शाब्दिक अर्थ ‘सुनना’ है, जबकि प्रसंग विवेकपूर्ण न्याय का संकेत देता है। मुख्य पाठ शाब्दिक तनाव बनाए रखता है और पादटिप्पणी संभावित आशय बताती है।
