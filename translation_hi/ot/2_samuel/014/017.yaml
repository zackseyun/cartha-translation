  register: भाषा आधुनिक, सम्मानसूचक और दरबारी विनम्रता के अनुरूप रखी गई है। ‘आपकी दासी’, ‘मेरे स्वामी राजा’ और ‘कृपा करके’ वक्ता की आत्म-नम्रता व्यक्त करते हैं। मुख्य पाठ में मूल के ‘सुनने’ और מַלְאָךְ की अर्थगत व्यापकता को अनावश्यक रूप से नहीं सुलझाया गया है।
