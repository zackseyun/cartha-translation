id: 2SA.14.13
reference: 2 Samuel 14:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ הָֽ/אִשָּׁ֔ה וְ/לָ֧/מָּה חָשַׁ֛בְתָּה כָּ/זֹ֖את עַל עַ֣ם אֱלֹהִ֑ים וּ/מִ/דַּבֵּ֨ר הַ/מֶּ֜לֶךְ הַ/דָּבָ֤ר הַ/זֶּה֙ כְּ/אָשֵׁ֔ם לְ/בִלְתִּ֛י הָשִׁ֥יב הַ/מֶּ֖לֶךְ אֶֽת נִדְּחֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/013.yaml
  text: Then the woman said[a], “Why then have you planned such a thing against the people of God? For in speaking this word, the king is like one who is guilty[b], because the king has not brought back his banished one.”
translation:
  language: hi
  text: तब स्त्री ने कहा, “फिर आपने परमेश्वर की प्रजा के विरुद्ध ऐसी बात क्यों सोची[a] है? यह बात कहने से राजा दोषी के समान ठहरता है[b], क्योंकि राजा अपने निर्वासित को वापस नहीं लाया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऐसी बात क्यों ठानी” अथवा “ऐसी योजना क्यों बनाई।”
    reason: इब्रानी क्रिया सोचने, ठानने और योजना बनाने के अर्थ दे सकती है।
  - marker: b
    text: या “राजा मानो दोषी है”; अर्थात अपने निर्वासित को वापस न लाने के कारण राजा का अपना निर्णय उसी को दोषी जैसी स्थिति में रखता है।
    reason: इब्रानी में तुलना है, और वाक्य का आशय राजा के अपने निर्णय से निकलने वाली दोषिता है।
lexical_decisions:
- source_word: חָשַׁבְתָּה
  choice: सोची है
  rationale: क्रिया में सोचने, ठानने और योजना बनाने का अर्थ-क्षेत्र है। ‘सोची है’ मूल की व्यापकता बनाए रखता है, जबकि संदर्भ इसे जानबूझकर अपनाई गई नीति की ओर संकेत देता है।
- source_word: כָּזֹאת
  choice: ऐसी बात
  rationale: यह संकेतवाचक पद दृष्टान्त से प्रकट हुए उसी प्रकार के आचरण की ओर इशारा करता है और हिन्दी में आरोप का बल स्वाभाविक रूप से बनाए रखता है।
- source_word: עַל עַם אֱלֹהִים
  choice: परमेश्वर की प्रजा के विरुद्ध
  rationale: חשב के साथ עַל यहाँ प्रतिकूल आशय व्यक्त करता है। मूल का व्यापक वाचा-संबंधी पद ‘परमेश्वर की प्रजा’ बिना संकुचित किए रखा गया है।
- source_word: וּמִדַּבֵּר הַמֶּלֶךְ הַדָּבָר הַזֶּה
  choice: यह बात कहने से राजा
  rationale: 'מ के साथ infinitive construct को साधनात्मक/परिस्थितिजन्य समझा गया है: अपने ही निर्णय को बोलने से राजा स्वयं उसी निर्णय के दायरे में आता है।'
- source_word: כְּאָשֵׁם
  choice: दोषी के समान ठहरता है
  rationale: כְּ की तुलनात्मक शक्ति सुरक्षित रखी गई है; स्त्री सीधे अंतिम न्यायादेश सुनाने के बजाय राजा को दोषी जैसी स्थिति में दिखाती है।
- source_word: לְבִלְתִּי
  choice: क्योंकि ... नहीं
  rationale: यह रचना आरोप का आधार बताती है; हिन्दी में कारणसूचक रूप वाक्य-संबंध स्पष्ट और स्वाभाविक बनाता है।
- source_word: הָשִׁיב
  choice: वापस नहीं लाया
  rationale: Hiphil रूप का ठोस अर्थ ‘वापस लाना’ है, जो निर्वासन से व्यक्ति की वापसी के संदर्भ में उपयुक्त है।
- source_word: נִדְּחוֹ
  choice: अपने निर्वासित को
  rationale: निष्क्रिय कृदन्त किसी निकाले या दूर किए गए व्यक्ति को सूचित करता है। यह अनुवाद एकवचन और संबंधवाचक प्रत्यय दोनों को रखता है, बिना मुख्य पाठ में कर्ता या निर्वासन की रीति को अधिक निश्चित किए।
theological_decisions:
- issue: ‘परमेश्वर की प्रजा’ का दायरा
  choice: मूल के व्यापक वाचा-संबंधी पद को यथावत रखना
  alternative: इसे केवल ‘इस्राएल’ अथवा ‘अबशालोम और राजघराने’ के रूप में स्पष्ट करना
  rationale: स्त्री का आरोप अबशालोम के प्रसंग में है, पर इब्रानी पाठ प्रभाव को परमेश्वर की पूरी प्रजा से जोड़ता है। अनुवाद इस आलंकारिक व्यापकता को संकुचित नहीं करता।
- issue: राजा की दोषिता का स्वरूप
  choice: ‘दोषी के समान ठहरता है’ द्वारा तुलना बनाए रखना
  alternative: ‘स्वयं को दोषी ठहराता है’ अथवा ‘दोषी है’
  rationale: כְּ तुलना व्यक्त करता है। संदर्भ बताता है कि राजा का अपना निर्णय उसकी दोषिता को प्रकट करता है, किंतु मुख्य पाठ में इसे सीधी और पूर्ण न्यायिक घोषणा में बदलना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘प्रजा’, ‘निर्वासित’ और ‘दोषी के समान ठहरता है’ राजकीय तथा न्यायिक प्रसंग के अनुकूल हैं; साथ ही वाक्य-संरचना सामान्य पाठक के लिए स्पष्ट रखी गई है।
