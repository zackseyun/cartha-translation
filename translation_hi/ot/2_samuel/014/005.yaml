  text: The king said to her[a], “What is the matter?” She said, “Indeed, I am a widow[b], and my husband has died.”
translation:
  language: hi
  text: राजा ने उससे पूछा[a], “तुम्हें क्या हुआ है?” उसने कहा, “सचमुच, मैं विधवा हूँ[b], और मेरे पति की मृत्यु हो गई है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हें क्या परेशानी है?”
    reason: मַה־לָּךְ एक मुहावरेदार व्यक्तिगत प्रश्न है; इसका अर्थ किसी की परेशानी या स्थिति के विषय में पूछना है।
  - marker: b
    text: या, “हाय, मैं विधवा हूँ।”
    reason: אֲבָל को इस प्रसंग में शोकसूचक उद्गार के रूप में भी समझा जा सकता है।
lexical_decisions:
- source_word: מַה לָּךְ
  choice: तुम्हें क्या हुआ है?
  rationale: यह इब्रानी मुहावरा शाब्दिक रूप से ‘तुम्हारे लिए क्या?’ है और किसी की परेशानी या दशा पूछता है। यह हिंदी में स्वाभाविक ढंग से उसी व्यक्तिगत पूछताछ को व्यक्त करता है।
- source_word: אֲבָל
  choice: सचमुच
  rationale: यहाँ यह विरोधसूचक ‘परन्तु’ नहीं, बल्कि कथन पर बल देने वाला निश्चयार्थक अव्यय है। ‘सचमुच’ उस बल को सहज हिंदी में रखता है; प्रसंगानुसार ‘हाय’ भी संभव है।
- source_word: אִשָּׁה אַלְמָנָה
  choice: मैं विधवा हूँ
  rationale: इब्रानी में ‘विधवा स्त्री’ का भाव है। हिंदी में ‘मैं विधवा हूँ’ स्वाभाविक और अर्थपूर्ण अभिव्यक्ति है।
- source_word: וַיָּמָת אִישִׁי
  choice: मेरे पति की मृत्यु हो गई है
  rationale: इस प्रसंग में אִישִׁי का अर्थ ‘मेरे पति’ है। क्रिया उनकी मृत्यु की घटना बताती है, जिसका परिणाम वर्तमान विधवा-दशा में बना हुआ है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित पद ‘राजा’ का सीधा और स्वाभाविक अनुवाद।
- source_word: וַתֹּאמֶר
  choice: उसने कहा
  rationale: इब्रानी कथात्मक क्रम को हिंदी की स्वाभाविक वार्तालाप शैली में व्यक्त करता है।
