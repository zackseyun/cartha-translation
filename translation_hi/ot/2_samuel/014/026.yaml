  text: וּֽ/בְ/גַלְּח/וֹ֮ אֶת רֹאשׁ/וֹ֒ וְֽ֠/הָיָה מִ/קֵּ֨ץ יָמִ֤ים לַ/יָּמִים֙ אֲשֶׁ֣ר יְגַלֵּ֔חַ כִּֽי כָבֵ֥ד עָלָ֖י/ו וְ/גִלְּח֑/וֹ וְ/שָׁקַל֙ אֶת שְׂעַ֣ר רֹאשׁ֔/וֹ מָאתַ֥יִם שְׁקָלִ֖ים בְּ/אֶ֥בֶן הַ/מֶּֽלֶךְ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/026.yaml
  text: 'Whenever he cut the hair of his head—at the end of every year he would cut it[a], because it was heavy on him—when he cut it, he weighed the hair of his head: two hundred shekels by the king’s stone.'
translation:
  language: hi
  text: जब-जब वह अपने सिर के बाल कटवाता था—वह हर वर्ष के अंत में उन्हें कटवाता था, क्योंकि वे उस पर भारी हो जाते थे—तब वह कटे हुए बालों को तौलता था। राजकीय बाट के अनुसार उनका भार दो सौ शेकेल होता था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से ‘राजा के पत्थर के अनुसार’; अर्थात राजकीय मानक बाट के अनुसार।
    reason: cultural_note
lexical_decisions:
- source_word: וּבְגַלְּחוֹ אֶת־רֹאשׁוֹ
  choice: जब-जब वह अपने सिर के बाल कटवाता था
  rationale: कालसूचक रचना और प्रसंग की बार-बार होने वाली क्रिया को ‘जब-जब’ से व्यक्त किया गया है। ‘सिर’ को काटने के शाब्दिक आभास से बचने के लिए प्रसंगानुसार ‘बाल’ स्पष्ट किया गया है; ‘कटवाता’ आधुनिक हिन्दी में स्वाभाविक है और पूर्णतः मुँडाने का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: מִקֵּץ יָמִים לַיָּמִים
  choice: हर वर्ष के अंत में
  rationale: यह कठिन हिब्रू मुहावरा यहाँ नियमित वार्षिक अंतराल को सूचित करता है; इस अर्थ को सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: כִּי כָבֵד עָלָיו
  choice: क्योंकि वे उस पर भारी हो जाते थे
  rationale: हिब्रू के ‘उस पर भारी’ रूपक को बनाए रखा गया है। हिन्दी में बाल बहुवचन होने के कारण सर्वनाम और क्रिया बहुवचन हैं।
- source_word: וְשָׁקַל אֶת־שְׂעַר רֹאשׁוֹ
  choice: तब वह कटे हुए बालों को तौलता था
  rationale: प्रसंग में तौली जाने वाली वस्तु कटे हुए बाल हैं। अभ्यस्त क्रिया को ‘तौलता था’ से व्यक्त किया गया है।
- source_word: מָאתַיִם שְׁקָלִים
  choice: दो सौ शेकेल
  rationale: शेकेल यहाँ मुद्रा नहीं, भार की इकाई है; प्राचीन माप की अनिश्चितता के कारण आधुनिक भार में अनुमानित परिवर्तन नहीं किया गया।
- source_word: בְּאֶבֶן הַמֶּלֶךְ
  choice: राजकीय बाट के अनुसार
  rationale: אֶבֶן का शाब्दिक अर्थ ‘पत्थर’ है, पर यहाँ वह तौलने के मानक पत्थर-बाट को दर्शाता है। मुख्य पाठ में अर्थ स्पष्ट किया गया और शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
