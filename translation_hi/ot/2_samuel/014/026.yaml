translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वार्षिक रूप से दोहराई जाने वाली क्रिया को ‘जब-जब’ और अपूर्ण भूतकाल से व्यक्त किया गया है। डैश के भीतर की व्याख्यात्मक संरचना मूल वाक्य की पुनरावृत्ति और प्रवाह को सुरक्षित रखती है।
