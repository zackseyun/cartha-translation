  yaml_path: translation/ot/2_samuel/014/029.yaml
  text: So Absalom sent for Joab to send him to the king[a], but he was not willing to come to him. So he sent again a second time, but he was not willing to come.
translation:
  language: hi
  text: तब अबशालोम ने योआब को बुलावा भेजा कि वह उसे राजा के पास भेजे, पर योआब अबशालोम के पास आने को तैयार नहीं हुआ। उसने फिर दूसरी बार बुलावा भेजा, पर वह आने को तैयार नहीं हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח אַבְשָׁלוֹם אֶל יוֹאָב
  choice: अबशालोम ने योआब को बुलावा भेजा
  rationale: שׁלח का मूल अर्थ ‘भेजना’ है, पर אֶל יוֹאָב और आगे दिए उद्देश्य-वाक्यांश के संदर्भ में आशय योआब को अपने पास बुलाने के लिए संदेश भेजना है। ‘बुलावा भेजा’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस भाव को व्यक्त करता है।
- source_word: לִשְׁלֹחַ אֹתוֹ אֶל הַמֶּלֶךְ
  choice: कि वह उसे राजा के पास भेजे
  rationale: हिब्रू उद्देश्यसूचक क्रियारूप और सर्वनाम को निकटता से रखा गया है। इससे योआब की मध्यस्थ भूमिका निहित रहती है और पाठ से अधिक व्याख्या नहीं जोड़ी जाती।
- source_word: וְלֹא אָבָה
  choice: पर ... आने को तैयार नहीं हुआ
  rationale: אָבָה का अर्थ इच्छा या सहमति होना है। ‘तैयार नहीं हुआ’ इस शाब्दिक भाव को बनाए रखता है और ‘उसने इनकार कर दिया’ जैसी अपेक्षाकृत अधिक प्रबल अभिव्यक्ति से बचता है।
- source_word: לָבוֹא אֵלָיו
  choice: उसके पास आने
  rationale: אֵלָיו में निहित दिशा ‘उसके पास’ के द्वारा स्पष्ट रखी गई है; संदर्भ में इसका संकेत अबशालोम की ओर है।
- source_word: עוֹד שֵׁנִית
  choice: फिर दूसरी बार
  rationale: ‘फिर’ עוֹד और ‘दूसरी बार’ שֵׁנִית—दोनों तत्वों को सुरक्षित रखते हैं और हिन्दी में पुनरावृत्ति पर हिब्रू का बल स्वाभाविक ढंग से व्यक्त करते हैं।
- source_word: וַיִּשְׁלַח ... וְלֹא אָבָה ... וַיִּשְׁלַח ... וְלֹא אָבָה
  choice: तब ... भेजा ... पर ... तैयार नहीं हुआ। ... फिर ... भेजा, पर ... तैयार नहीं हुआ
  rationale: दोहराई गई क्रिया और विरोधात्मक क्रम को बनाए रखा गया है, जिससे मूल कथात्मक गति और योआब की लगातार अनिच्छा उभरती है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘बुलावा भेजा’ प्रसंगानुकूल मुहावरेदार अनुवाद है; ‘उसे’ अबशालोम और ‘उसके’ योआब के लिए है, जैसा हिब्रू सर्वनाम-क्रम और संदर्भ संकेत करते हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘आने को तैयार नहीं हुआ’ मूल की अर्थ-सीमा को पर्याप्त रूप से सुरक्षित रखता है।
