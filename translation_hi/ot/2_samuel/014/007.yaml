base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/007.yaml
  text: And look[a], the whole family has risen up against your servant and said, ‘Give up the one who struck his brother, so that we may put him to death for the life of his brother whom he killed; and we will destroy the heir also.’ Thus they would quench my remaining ember[b], leaving my husband neither name nor remnant on the face of the earth.
translation:
  language: hi
  text: और देखिए, सारा परिवार आपकी दासी के विरुद्ध उठ खड़ा हुआ है। वे कहते हैं, ‘जिसने अपने भाई पर प्रहार किया, उसे हमारे हवाले कर दे, ताकि उस भाई के प्राण के बदले, जिसे उसने मार डाला, हम उसे मार डालें; और वारिस को भी नष्ट कर दें।’ इस प्रकार वे मेरे बचे हुए अंगारे[a] को बुझा देंगे और मेरे पति का न तो नाम, न कोई वंश धरती पर बाकी रहने देंगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वैकल्पिक रूप से, ‘मेरा अंतिम कोयला।’ इब्रानी में बचा हुआ जलता अंगारा परिवार के अंतिम जीवित वंशज और वंश बने रहने की आशा का चित्र है।
    reason: lexical_alternative
  - marker: b
    text: ‘नाम’ और ‘वंश’ का आशय केवल प्रतिष्ठा नहीं, बल्कि उस पुरुष की स्मृति और उसके जीवित वंश का बने रहना है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखिए
  rationale: यह कथन की ओर ध्यान खींचता है; आधुनिक हिन्दी में ‘देखिए’ स्वाभाविक और सम्मानसूचक है।
- source_word: כָל הַמִּשְׁפָּחָה
  choice: सारा कुनबा
  rationale: यहाँ शब्द केवल निकट परिवार नहीं, बल्कि विस्तृत पारिवारिक समूह को दर्शाता है; ‘कुनबा’ इस सामूहिक अर्थ को सुबोध ढंग से व्यक्त करता है।
- source_word: שִׁפְחָתֶךָ
  choice: आपकी दासी
  rationale: स्त्री राजा के सामने विनम्र आत्म-संबोधन कर रही है। ‘आपकी दासी’ उसके लिंग और सम्मानपूर्ण भाव दोनों को बनाए रखता है।
- source_word: קָמָה ... עַל
  choice: के विरुद्ध उठ खड़ा हुआ है
  rationale: यह मुहावरा केवल खड़े होने का नहीं, विरोध में सक्रिय हो जाने का भाव देता है।
- source_word: תְּנִי
  choice: हमारे हवाले कर दे
  rationale: न्यायिक प्रसंग में परिवार पुत्र को सौंपने की माँग कर रहा है; ‘हवाले कर दे’ बाध्यकारी सुपुर्दगी को स्पष्ट करता है।
- source_word: מַכֵּה אָחִיו
  choice: जिसने अपने भाई को मारा था
  rationale: नכה का कृदंत पहले प्रहार को व्यक्त करता है और अगला उपवाक्य मृत्यु को स्पष्ट करता है। हिन्दी का ‘मारा’ दोनों अर्थ ले सकता है, इसलिए आगे ‘मार डाला’ के साथ मूल की क्रमिकता बनी रहती है।
- source_word: וּנְמִתֵהוּ בְּנֶפֶשׁ אָחִיו
  choice: उसके भाई के प्राण के बदले ... हम उसे मृत्युदंड दें
  rationale: यह प्राण के बदले प्राण की न्यायिक प्रतिपूर्ति का भाव रखता है; ‘मृत्युदंड दें’ संदर्भ के औपचारिक स्वर को व्यक्त करता है।
- source_word: הַיּוֹרֵשׁ
  choice: वारिस
  rationale: यह जीवित पुत्र की उत्तराधिकार संबंधी भूमिका को संक्षिप्त और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: וְכִבּוּ אֶת גַּחַלְתִּי אֲשֶׁר נִשְׁאָרָה
  choice: वे मेरे बचे हुए अंगारे को बुझा देंगे
  rationale: परिवार की अंतिम जीवित आशा और वंशज के लिए प्रयुक्त अंगारे का रूपक मुख्य पाठ में अक्षुण्ण रखा गया है।
- source_word: שֵׁם וּשְׁאֵרִית
  choice: न तो नाम, न कोई वंश
  rationale: यह केवल प्रतिष्ठा नहीं, मृत पुरुष की स्मृति और बची हुई वंश-परंपरा दोनों के मिट जाने को दर्शाता है।
