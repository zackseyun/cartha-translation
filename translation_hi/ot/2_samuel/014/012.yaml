  naturalness: Revise the request to ‘अपनी दासी को ... कहने दें,’ which clearly and naturally addresses the king for permission. ‘बोलो’ is a more direct Hindi equivalent of the imperative ‘Speak.’
  terminology: ‘दासी’ appropriately preserves the feminine force of שִׁפְחָתְךָ and its deferential courtly use. ‘मेरे प्रभु राजा’ is a suitable respectful rendering of אֲדֹנִי הַמֶּלֶךְ in this historical court setting.
