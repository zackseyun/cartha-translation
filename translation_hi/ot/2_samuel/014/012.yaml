  text: Then the woman said[a], “Please let your servant speak a word to my lord the king.” And he said, “Speak.”
translation:
  language: hi
  text: तब उस स्त्री ने कहा, “कृपया अपनी दासी[a] को मेरे प्रभु राजा से एक बात कहने दें।” उसने कहा, “बोलो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में स्त्रीलिंग शब्द है, जिसका अर्थ ‘दासी’ या ‘सेविका’ है; यह यहाँ विनम्र आत्म-संबोधन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम स्पष्ट करता है।
- source_word: הָאִשָּׁה
  choice: उस स्त्री
  rationale: संदर्भ में वही स्त्री राजा से बोल रही है; हिन्दी कथानक में ‘उस स्त्री’ पूर्वोक्त पात्र की ओर स्वाभाविक संकेत करता है।
- source_word: תְּדַבֶּר נָא
  choice: कृपया ... कहे
  rationale: अपूर्ण क्रिया के साथ נָא विनम्र निवेदन व्यक्त करता है; यह रूप राजा से अनुमति माँगने का आदरपूर्ण भाव रखता है।
- source_word: שִׁפְחָתְךָ
  choice: आपकी दासी
  rationale: इब्रानी शब्द स्त्रीलिंग है और विनम्र आत्म-संबोधन है; ‘आपकी दासी’ हिन्दी में अर्थ और दरबारी नम्रता दोनों बनाए रखता है।
- source_word: אֶל אֲדֹנִי הַמֶּלֶךְ
  choice: मेरे प्रभु राजा से
  rationale: אֲדֹנִי यहाँ मानवीय आदरसूचक संबोधन है; ‘मेरे प्रभु राजा’ राजकीय संदर्भ में गरिमापूर्ण और स्पष्ट है।
- source_word: דָּבָר
  choice: एक बात
  rationale: דָּבָר का अर्थ ‘वचन/बात/विषय’ हो सकता है; इस विनम्र अनुरोध में ‘एक बात’ आधुनिक हिन्दी का स्वाभाविक समतुल्य है।
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: कर्ता राजा है, जो निकट संदर्भ से स्पष्ट है; सर्वनाम इब्रानी की संक्षिप्तता बनाए रखता है।
- source_word: דַּבֵּרִי
  choice: कहो
  rationale: यह स्त्री को संबोधित स्त्रीलिंग एकवचन आज्ञार्थक है; हिन्दी में संक्षिप्त अनुमति/आदेश ‘कहो’ इसके अनुरूप है।
