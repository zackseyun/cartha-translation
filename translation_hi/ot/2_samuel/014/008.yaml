- source_word: עָלָיִךְ
  choice: तेरे विषय में
  rationale: צוה के साथ עַל उस व्यक्ति या मामले को सूचित कर सकता है जिसके संबंध में आदेश दिया जाए। यह रूप लाभार्थक अर्थ को अनावश्यक रूप से निश्चित किए बिना हिब्रू की व्यापकता बनाए रखता है।
