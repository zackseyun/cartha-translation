  text: וַ/תֹּאמֶר֩ יִזְכָּר נָ֨א הַ/מֶּ֜לֶךְ אֶת יְהוָ֣ה אֱלֹהֶ֗י/ךָ מ/הרבית גֹּאֵ֤ל הַ/דָּם֙ לְ/שַׁחֵ֔ת וְ/לֹ֥א יַשְׁמִ֖ידוּ אֶת בְּנִ֑/י וַ/יֹּ֨אמֶר֙ חַי יְהוָ֔ה אִם יִפֹּ֛ל מִ/שַּׂעֲרַ֥ת בְּנֵ֖/ךְ אָֽרְצָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/011.yaml
  text: Then she said[a], “Please let the king remember Yahweh your God, so that the avenger of blood may not continue to destroy, and they may not destroy my son.” And he said, “As Yahweh lives[b], not one hair of your son shall fall to the ground.”
translation:
  language: hi
  text: तब उसने कहा, “राजा कृपा करके अपने परमेश्वर यहोवा को स्मरण करें, ताकि खून का बदला लेने वाला[a] और अधिक विनाश न करे और वे मेरे बेटे को नष्ट न कर दें।” राजा ने कहा, “यहोवा के जीवन की शपथ, तुम्हारे बेटे का एक बाल भी ज़मीन पर नहीं गिरेगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात मारे गए व्यक्ति का वह निकट संबंधी जो उसके खून का बदला लेता था। इसे “रक्त-प्रतिशोधी” भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह इब्रानी मुहावरा पूर्ण सुरक्षा का आश्वासन देता है—उसके बेटे को तनिक भी हानि नहीं होगी।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְכָּר נָא
  choice: राजा कृपा करके ... स्मरण करें
  rationale: आज्ञार्थक भाव के साथ נָא स्त्री की विनम्र और आदरपूर्ण विनती व्यक्त करता है।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर यहोवा
  rationale: व्यक्तिवाचक वाचा-नाम יהוה को ‘यहोवा’ और दूसरे पुरुष के संबंधसूचक रूप को ‘अपने परमेश्वर’ से व्यक्त किया गया है।
- source_word: מֵהַרְבּוֹת גֹּאֵל הַדָּם לְשַׁחֵת
  choice: ताकि खून का बदला लेनेवाला और अधिक विनाश न करे
  rationale: מן के साथ רבה का हिफ़ील क्रियार्थक रूप विनाशकारी कार्रवाई को बढ़ाने या आगे जारी रखने से रोकने की विनती दर्शाता है; ‘और अधिक’ इस कठिन इब्रानी रचना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גֹּאֵל הַדָּם
  choice: खून का बदला लेनेवाला
  rationale: यह निकट संबंधी की उस कानूनी-सामाजिक भूमिका का बोध कराता है जो मारे गए व्यक्ति के खून का बदला लेता था।
- source_word: וְלֹא יַשְׁמִידוּ אֶת־בְּנִי
  choice: और वे मेरे बेटे को नष्ट न कर दें
  rationale: बहुवचन क्रिया के अनिर्दिष्ट कर्ता को ‘वे’ से बनाए रखा गया है, बिना यह तय किए कि उससे ठीक कौन-से लोग अभिप्रेत हैं।
- source_word: חַי יְהוָה
  choice: जीवित यहोवा की शपथ
  rationale: यह इब्रानी की प्रचलित गंभीर शपथ-विधि का स्वाभाविक हिन्दी रूप है।
- source_word: אִם יִפֹּל מִשַּׂעֲרַת בְּנֵךְ אָרְצָה
  choice: तुम्हारे बेटे का एक बाल भी भूमि पर नहीं गिरेगा
  rationale: शपथ के बाद אִם प्रबल निषेध का काम करता है; ‘एक बाल भी ... नहीं’ पूर्ण सुरक्षा का मूल चित्र सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का व्यक्तिवाचक नाम सीधे आया है; हिन्दी में व्यापक रूप से पहचाने जानेवाले ‘यहोवा’ द्वारा इसे उपाधि में बदले बिना रखा गया है।
- issue: राजा की प्रतिज्ञा में सुरक्षा की सीमा
  choice: एक बाल भी भूमि पर नहीं गिरेगा
  alternative: उसे कोई हानि नहीं होगी
  rationale: मूल का सशक्त मुहावरा जस का तस रखा गया है; इसका आशय पूर्ण सुरक्षा है, पर चित्रात्मक भाषा को सामान्य कथन में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और कथात्मक हिन्दी में रखी गई है। स्त्री की विनम्र राज-दरबारी विनती के लिए ‘कृपा करके’ और बहुवचन आदरसूचक क्रिया का प्रयोग किया गया है। कठिन कानूनी पद के अर्थ को मुख्य पाठ में संक्षिप्त रखा गया है और पाद-टिप्पणी में स्पष्ट किया गया है।
