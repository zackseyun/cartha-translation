  text: וַ/יֹּ֣אמֶר אַבְשָׁל֣וֹם אֶל יוֹאָ֡ב הִנֵּ֣ה שָׁלַ֣חְתִּי אֵלֶ֣י/ךָ לֵ/אמֹ֡ר בֹּ֣א הֵ֠נָּה וְ/אֶשְׁלְחָה֩ אֹתְ/ךָ֨ אֶל הַ/מֶּ֜לֶךְ לֵ/אמֹ֗ר לָ֤/מָּה בָּ֨אתִי֙ מִ/גְּשׁ֔וּר ט֥וֹב לִ֖/י עֹ֣ד אֲנִי שָׁ֑ם וְ/עַתָּ֗ה אֶרְאֶה֙ פְּנֵ֣י הַ/מֶּ֔לֶךְ וְ/אִם יֶשׁ בִּ֥/י עָוֺ֖ן וֶ/הֱמִתָֽ/נִי־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/032.yaml
  text: Absalom said to Joab[a], “Look, I sent word to you, saying, ‘Come here, so that I may send you to the king, to say, “Why have I come from Geshur? It would be better for me still to be there.”’ Now then, let me see the king’s face; and if there is guilt in me[b], let him put me to death.”
translation:
  language: hi
  text: 'अबशालोम ने योआब से कहा, “देखो, मैंने तुम्हारे पास यह संदेश भेजा था, ‘यहाँ आओ, ताकि मैं तुम्हें राजा के पास यह कहने के लिए भेजूँ: “मैं गशूर से क्यों आया? मेरे लिए तो अच्छा होता कि मैं अब भी वहीं रहता।”’[a] अब मुझे राजा का मुख देखने दो;[b] और यदि मुझमें कोई दोष है, तो वह मुझे मार डाले।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वाक्य संक्षिप्त है; इसका अनुवाद यह भी हो सकता है, “मेरे लिए अच्छा होता, यदि मैं अब भी वहीं होता।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “राजा का मुख देखूँ”; यह राजा के सामने उपस्थित होने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह अबशालोम की बात पर ध्यान खींचने वाला स्वाभाविक आधुनिक हिन्दी संकेतक है।
- source_word: שָׁלַחְתִּי אֵלֶיךָ
  choice: मैंने तुम्हारे पास यह संदेश भेजा था
  rationale: संदर्भ में इसका अर्थ किसी वस्तु को भेजना नहीं, बल्कि योआब को बुलाने के लिए संदेश भेजना है।
- source_word: בֹּא הֵנָּה
  choice: यहाँ आओ
  rationale: आज्ञार्थक क्रिया और स्थानवाचक अव्यय का सीधा, स्वाभाविक अनुवाद।
- source_word: וְאֶשְׁלְחָה אֹתְךָ אֶל הַמֶּלֶךְ
  choice: ताकि मैं तुम्हें राजा के पास ... भेजूँ
  rationale: यहाँ रूप बुलाने के उद्देश्य को व्यक्त करता है; ‘ताकि’ उस प्रयोजन को स्पष्ट करता है।
- source_word: לָמָּה בָּאתִי מִגְּשׁוּר
  choice: मैं गशूर से क्यों आया?
  rationale: मूल क्रिया प्रथम पुरुष में सक्रिय रूप ‘मैं आया’ है; इसे कर्मवाच्य ‘मुझे क्यों लाया गया’ नहीं बनाया गया।
- source_word: טוֹב לִי עוֹד אֲנִי שָׁם
  choice: मेरे लिए तो अच्छा होता कि मैं अब भी वहीं रहता
  rationale: इब्रानी वाक्य संक्षिप्त और अध्याहृत है। यह हिन्दी अभिव्यक्ति गशूर में बने रहने को अधिक अच्छा बताती है और ‘अब भी’ को सुरक्षित रखती है।
- source_word: וְעַתָּה
  choice: अब
  rationale: यह शिकायत से माँग की ओर कालगत संक्रमण दिखाता है; इसमें अनावश्यक कारणार्थक भाव नहीं जोड़ा गया।
- source_word: אֶרְאֶה פְּנֵי הַמֶּלֶךְ
  choice: मुझे राजा का मुख देखने दो
  rationale: शाब्दिक बिंब सुरक्षित रखा गया है; संदर्भ में यह राजा के सामने उपस्थित होने का मुहावरा है।
- source_word: עָוֹן
  choice: दोष
  rationale: न्यायिक संदर्भ में यह अपराधजन्य दोष या दोषिता को दर्शाता है; ‘दोष’ आधुनिक हिन्दी में सहज है।
- source_word: וֶהֱמִתָנִי
  choice: वह मुझे मरवा डाले
  rationale: हिफ़ील रूप का कारणवाचक अर्थ ‘मुझे मरवा दे’ सुरक्षित है, बिना औपचारिक न्यायिक दंड की अतिरिक्त धारणा जोड़े।
theological_decisions:
- issue: עָוֹן का न्यायिक और नैतिक अर्थ
  choice: दोष
  alternative: पाप / अपराध
  rationale: ‘दोष’ अबशालोम के संभावित अपराध और उससे जुड़ी दोषिता दोनों के लिए पर्याप्त व्यापक है तथा किसी विशेष धर्मशास्त्रीय व्याख्या को नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण पर सहज कथात्मक शैली। मूल की प्रत्यक्षता, उद्धरणों की परतें, ‘राजा का मुख’ वाला इब्रानी बिंब और संक्षिप्त तुलना की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
