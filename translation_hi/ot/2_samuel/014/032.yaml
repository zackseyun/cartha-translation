    issue: “वह मुझे मरवा डाले” may imply that the king arranges for another person to kill Absalom.
    rationale: The Hebrew וֶהֱמִתָנִי is a causative form, but in this idiom it means ‘let him kill/put me to death,’ not specifically ‘have someone kill me.’ Hindi “मार डाले” conveys the intended direct idiomatic sense more accurately.
