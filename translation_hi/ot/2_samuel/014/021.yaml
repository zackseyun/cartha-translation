language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל יוֹאָ֔ב הִנֵּה נָ֥א עָשִׂ֖יתִי אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/לֵ֛ךְ הָשֵׁ֥ב אֶת הַ/נַּ֖עַר אֶת אַבְשָׁלֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/021.yaml
  text: Then the king said to Joab[a], “Behold now, I have done this thing. Go, bring back the young man Absalom.”
translation:
  language: hi
  text: तब राजा ने योआब से कहा, “देखो, मैंने यह काम कर दिया है। अब जाओ और उस जवान अबशालोम को वापस ले आओ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक रूप से क्रम व्यक्त करता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: इब्रानी में निश्चित उपाधि है; इसलिए व्यक्तिगत नाम जोड़ने के बजाय उपाधि रखी गई है।
- source_word: הִנֵּה נָא
  choice: देखो
  rationale: הִנֵּה ध्यान आकर्षित करता है और נָא कथन को कुछ नरम अथवा तात्कालिक बनाता है। ‘देखो’ आधुनिक हिन्दी में दोनों के संयुक्त संवादात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָשִׂיתִי אֶת־הַדָּבָר הַזֶּה
  choice: मैंने यह काम कर दिया है
  rationale: यह मूल के ‘मैंने यह बात/काम किया है’ को निकटता से रखता है और संदर्भगत अर्थ ‘मैंने अनुरोध मान लिया है’ को पाठ में स्पष्ट करके थोपता नहीं।
- source_word: וְלֵךְ
  choice: अब जाओ
  rationale: वाव पिछले कथन से आज्ञा को जोड़ता है; यहाँ ‘अब’ हिन्दी में प्रसंग से निकलने वाले अगले कदम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הָשֵׁב
  choice: वापस ले आओ
  rationale: 'שׁוב का हिफ़ईल रूप कारणवाचक है: योआब को अबशालोम की वापसी करानी है। ‘वापस ले आओ’ इस कारणवाचक अर्थ को स्पष्ट रखता है।'
- source_word: הַנַּעַר
  choice: उस जवान
  rationale: נַעַר का अर्थ लड़का, युवक, सेवक या जवान हो सकता है। अबशालोम वयस्क है, इसलिए ‘जवान’ उसकी आयु-सापेक्ष और स्नेहसूचक पहचान को बिना उसे बालक बताए व्यक्त करता है।
- source_word: אַבְשָׁלוֹם
  choice: अबशालोम
  rationale: व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण; ‘उस जवान अबशालोम’ मूल की समानाधिकरणात्मक संरचना को बनाए रखता है।
