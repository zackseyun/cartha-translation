  text: So Joab arose and went to Geshur[a], and brought Absalom to Jerusalem.
translation:
  language: hi
  text: तब योआब उठा और गशूर को गया, और अबशालोम को यरूशलेम ले आया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “अबशालोम को वापस यरूशलेम ले आया।” संदर्भ उसके निर्वासन से लौटने का संकेत देता है, यद्यपि “वापस” का भाव हिब्रू क्रिया में स्वयं स्पष्ट नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठा
  rationale: קום का यह कथात्मक रूप कार्य करने के लिए उठने को व्यक्त करता है। ‘उठा’ मूल की क्रमिक कथाशैली को बनाए रखता है और केवल ‘चल पड़ा’ कहकर अर्थ को सीमित नहीं करता।
- source_word: וַיֵּלֶךְ
  choice: गया
  rationale: הלך का सामान्य कथात्मक अर्थ ‘जाना’ है; ‘गया’ सहज और मूल के निकट है।
- source_word: גְּשׁוּרָה
  choice: गशूर
  rationale: शब्द के अंत का दिशासूचक ה गशूर की ओर गति दिखाता है; हिन्दी में ‘गशूर गया’ स्वाभाविक रूप से यही संबंध व्यक्त करता है।
- source_word: וַיָּבֵא
  choice: ले आया
  rationale: ביא के हिफ़ील रूप का अर्थ किसी को आने का कारण बनाना, अर्थात ‘लाना’ है। हिन्दी में किसी व्यक्ति को गंतव्य तक लाने के लिए ‘ले आया’ स्वाभाविक है; निर्वासन से वापसी का भाव संदर्भ में है, पर ‘वापस’ मूल क्रिया में स्पष्ट नहीं है।
- source_word: אֶת אַבְשָׁלוֹם
  choice: अबशालोम को
  rationale: אֶת निश्चित कर्म को चिह्नित करता है; हिन्दी में इसे ‘को’ से व्यक्त किया गया है और नाम का प्रचलित हिन्दी रूप ‘अबशालोम’ रखा गया है।
- source_word: יְרוּשָׁלִָם
  choice: यरूशलेम
  rationale: अलग पूर्वसर्ग न होने पर भी वाक्य-संरचना इसे ‘ले आया’ का गंतव्य बताती है; हिन्दी में ‘यरूशलेम ले आया’ यही संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַ
  choice: तब / और
  rationale: क्रमिक वाव रूप घटनाओं को आगे बढ़ाते हैं। आरंभ में ‘तब’ और अगले खंड में ‘और’ आधुनिक हिन्दी में घटनाक्रम को स्पष्ट तथा सहज रखते हैं।
theological_decisions:
- issue: क्या अबशालोम की निर्वासन से वापसी को मुख्य पाठ में स्पष्ट किया जाए
  choice: मुख्य पाठ में केवल ‘ले आया’ रखा गया
  alternative: ‘वापस ले आया’
  rationale: संदर्भ वापसी का संकेत देता है, लेकिन ‘वापस’ के लिए हिब्रू क्रिया में अलग शब्द नहीं है। इसलिए इस संदर्भगत अर्थ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उठा… गया… ले आया’ मूल की संक्षिप्त, क्रमिक कथाशैली को बनाए रखता है। पादटिप्पणी का चिह्न उस क्रिया के बाद रखा गया है जिससे वैकल्पिक अर्थ संबंधित है।
