  text: Then the woman from Tekoa spoke to the king[a]. She fell with her face to the ground and bowed down, and she said, “Save me[b], O king!”
translation:
  language: hi
  text: तब तकोआ की स्त्री ने राजा से बात की। वह भूमि पर मुँह के बल गिर पड़ी और दण्डवत् की, और बोली, “हे राजा, मुझे बचाइए!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקֹעִית
  choice: तकोआ की स्त्री
  rationale: स्त्रीलिंग जातिवाचक विशेषण उसके तकोआ से संबंध या उद्गम को बताता है; यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: וַתֹּאמֶר ... אֶל הַמֶּלֶךְ
  choice: राजा से कहा
  rationale: אָמַר का सीधा अर्थ ‘कहना’ है; हिन्दी में यह आरंभिक संबोधन के लिए स्वाभाविक है।
- source_word: וַתִּפֹּל עַל אַפֶּיהָ אַרְצָה
  choice: मुँह के बल भूमि पर गिरकर
  rationale: यह इब्रानी मुहावरे में वर्णित गहरी विनती की शारीरिक मुद्रा को संक्षिप्त और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: וַתִּשְׁתָּחוּ
  choice: दण्डवत् हुई
  rationale: यहाँ क्रिया सम्मान और विनती में भूमि तक झुकने या प्रणाम करने का भाव रखती है; ‘दण्डवत् हुई’ मुद्रा को स्पष्ट करता है, बिना इसे आराधना मान लेने के।
- source_word: הוֹשִׁיעָה
  choice: मुझे बचाइए
  rationale: יָשַׁע का आज्ञार्थक रूप उद्धार या रक्षा की तत्काल विनती है। कर्म मूल पाठ में अव्यक्त है, पर प्रसंग से स्त्री स्वयं अभिप्रेत है; हिन्दी में ‘मुझे’ जोड़ना स्वाभाविक है।
- source_word: הַמֶּלֶךְ
  choice: हे राजा
  rationale: प्रत्यक्ष संबोधन में ‘हे राजा’ इब्रानी के औपचारिक और विनतीपूर्ण स्वर को स्वाभाविक हिन्दी में बनाए रखता है।
