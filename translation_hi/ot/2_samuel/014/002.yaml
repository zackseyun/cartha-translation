base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/002.yaml
  text: So Joab sent to Tekoa and took from there a wise woman[a], and he said to her, “Please pretend to be mourning, and please put on mourning clothes, and do not anoint yourself with oil[d][c][b], but be like a woman who has been mourning for the dead many days.”
translation:
  language: hi
  text: तब योआब ने तकोआ में संदेश भेजकर वहाँ से एक बुद्धिमान स्त्री को बुलवाया। उसने उससे कहा, “कृपया शोक मनाने का अभिनय करो[a], शोक के वस्त्र पहन लो[b], अपने शरीर पर तेल न लगाओ[c], और ऐसी स्त्री की तरह रहो जो बहुत दिनों से किसी मृत व्यक्ति के लिए शोक मना रही हो[d]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कृपया शोक मनाओ” अथवा “शोक मनाने वाली स्त्री जैसा व्यवहार करो।” इब्रानी क्रिया का अर्थ “शोक मनाना” है, लेकिन प्रसंग दिखाता है कि योआब उसे योजनाबद्ध ढंग से शोक करने वाली की भूमिका अपनाने को कह रहा है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “शोक के वस्त्र।”
    reason: lexical_alternative
  - marker: c
    text: शोक के समय तेल न लगाना दुःख का एक प्रचलित चिह्न था; सामान्यतः तेल शरीर की देखभाल, ताज़गी और उत्सव से जुड़ा था।
    reason: cultural_note
  - marker: d
    text: शाब्दिक रूप के निकट, “बहुत दिनों से किसी मृत व्यक्ति पर शोक मनाती हुई स्त्री जैसी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּקוֹעָה
  choice: तकोआ
  rationale: स्थान-नाम का आधुनिक हिन्दी में ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: אִשָּׁה חֲכָמָה
  choice: एक बुद्धिमान स्त्री
  rationale: חֲכָמָה में बुद्धिमत्ता, कुशलता या चतुराई का भाव हो सकता है। ‘बुद्धिमान’ मूल शब्द की व्यापकता बनाए रखता है और प्रसंग उसकी व्यवहार-कुशलता स्पष्ट करता है।
- source_word: הִתְאַבְּלִי נָא
  choice: कृपया शोक मनाने का अभिनय करो
  rationale: क्रिया का मूल अर्थ ‘शोक मनाना’ है, पर कथा-प्रसंग में योआब उसे एक योजनाबद्ध भूमिका अपनाने को कह रहा है। ‘अभिनय करो’ इस प्रसंगगत आशय को स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: וְלִבְשִׁי נָא בִגְדֵי אֵבֶל
  choice: शोक के वस्त्र पहन लो
  rationale: यह शोक के समय पहने जाने वाले वस्त्रों के लिए प्रयुक्त अभिव्यक्ति है। ‘शोक के वस्त्र’ मूल रूपक और सांस्कृतिक संदर्भ दोनों को बनाए रखता है।
- source_word: וְאַל תָּסוּכִי שֶׁמֶן
  choice: अपने शरीर पर तेल न लगाओ
  rationale: סוך शरीर पर तेल लगाने की सामान्य सज्जा अथवा ताज़गी की प्रथा को दर्शाता है। हिन्दी में ‘तेल लगाना’ ‘तेल से अभिषेक करना’ की अपेक्षा यहाँ अधिक स्पष्ट और स्वाभाविक है।
- source_word: וְהָיִית כְּאִשָּׁה
  choice: ऐसी स्त्री जैसी बन जाओ
  rationale: यह निर्देश उसके बाहरी रूप और व्यवहार दोनों से शोक करने वाली स्त्री जैसी दिखाई देने को कहता है।
- source_word: זֶה יָמִים רַבִּים מִתְאַבֶּלֶת עַל מֵת
  choice: जो बहुत दिनों से किसी मृत व्यक्ति के लिए शोक मना रही हो
  rationale: ‘बहुत दिनों से’ जारी अवस्था को व्यक्त करता है। מֵת अनिश्चित एकवचन है, इसलिए ‘किसी मृत व्यक्ति’ उसके अनिर्दिष्ट भाव को सुरक्षित रखता है।
