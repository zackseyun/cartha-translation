  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। संवाद में ‘कृपया’ נָא की विनम्रता व्यक्त करता है। ‘अभिनय’ प्रसंगगत छलपूर्ण प्रस्तुति को स्पष्ट करता है, जबकि पाद-टिप्पणी इब्रानी क्रिया का अधिक शाब्दिक और कुछ हद तक अस्पष्ट अर्थ सुरक्षित रखती है।
