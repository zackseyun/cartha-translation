  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण कथात्मक संवाद रखा गया है। 'दासी' को पुरातन अलंकरण नहीं, बल्कि स्त्री वक्ता के विनम्र सामाजिक आत्म-संबोधन के रूप में रखा गया है।
