base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/017.yaml
  text: He came near to her[a], and the woman said, “Are you Joab?” He said, “I am.” Then she said to him, “Listen to the words of your servant.” He said, “I am listening.”
translation:
  language: hi
  text: वह उसके पास आया, और उस स्त्री ने पूछा, “क्या तुम योआब हो?” उसने कहा, “मैं हूँ।” तब उसने उससे कहा, “अपनी दासी की बात सुनो।” उसने कहा, “मैं सुन रहा हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרַב אֵלֶיהָ
  choice: वह उसके पास आया
  rationale: קרב का काल रूप कथा में शारीरिक रूप से निकट आने को व्यक्त करता है; यह हिंदी में स्वाभाविक और स्रोत के अनुरूप है।
- source_word: הָאִשָּׁה
  choice: उस स्त्री
  rationale: संदर्भ में אִשָּׁה का अर्थ वयस्क स्त्री है, पत्नी नहीं; पूर्वोक्त पात्र होने के कारण 'उस स्त्री' स्वाभाविक है।
- source_word: הַאַתָּה יוֹאָב
  choice: क्या तुम योआब हो?
  rationale: प्रश्नवाचक ה और स्वतंत्र सर्वनाम पहचान की सीधी पुष्टि माँगते हैं।
- source_word: אָנִי
  choice: मैं ही हूँ
  rationale: अकेला सर्वनाम संक्षिप्त आत्म-पहचान है; हिंदी में 'मैं ही हूँ' इस उत्तर को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שְׁמַע
  choice: सुनो
  rationale: שמע का आज्ञार्थक रूप यहाँ ध्यान देकर सुनने का अनुरोध है; 'सुनो' सरल और सीधा है।
- source_word: דִּבְרֵי אֲמָתֶךָ
  choice: अपनी दासी की बात
  rationale: אמה स्त्रीलिंग सेविका/दासी और विनम्र आत्म-संबोधन है। हिंदी में 'अपनी दासी' लिंग तथा विनय दोनों बचाता है, जबकि बहुवचन 'शब्दों' के स्थान पर एकवचन 'बात' स्वाभाविक सामूहिक अभिव्यक्ति है।
- source_word: שֹׁמֵעַ אָנֹכִי
  choice: मैं सुन रहा हूँ
  rationale: कृदंत और सर्वनाम मिलकर वर्तमान, जारी ध्यान को व्यक्त करते हैं; यह हिंदी में स्वाभाविक प्रगतिशील रूप है।
