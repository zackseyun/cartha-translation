  text: Joab’s men[a], the Kerethites, the Pelethites, and all the mighty men went out after him. They went out from Jerusalem to pursue Sheba son of Bichri.
translation:
  language: hi
  text: योआब के लोग, करेती, पलेती और सभी वीर योद्धा उसके पीछे निकले। वे बिख्री के पुत्र शेबा का पीछा करने के लिए यरूशलेम से निकले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצְאוּ ... אַחֲרָיו
  choice: उसके पीछे निकल पड़े
  rationale: यह इब्रानी मुहावरे की गति और क्रम को स्वाभाविक हिन्दी में व्यक्त करता है तथा सर्वनाम के संदर्भ को पिछले प्रसंग के अनुसार खुला रखता है।
- source_word: אַנְשֵׁי יוֹאָב
  choice: योआब के लोग
  rationale: सम्बन्धवाचक रचना योआब के अधीन पुरुषों को दर्शाती है; ‘योआब के लोग’ सरल और स्वाभाविक हिन्दी है।
- source_word: הַכְּרֵתִי
  choice: करेती
  rationale: यह दाऊद के राजकीय सैनिक-दल से जुड़ा समूह-नाम है; अनुमानित अर्थ देने के बजाय इब्रानी के निकट लिप्यंतरण रखा गया है।
- source_word: הַפְּלֵתִי
  choice: पलेती
  rationale: करेती के साथ आने वाला समूह-नाम होने के कारण इसका लिप्यंतरण किया गया है।
- source_word: כָל הַגִּבֹּרִים
  choice: सभी वीर योद्धा
  rationale: गिब्बोरीम यहाँ पराक्रमी लड़ाकों को सूचित करता है; ‘वीर योद्धा’ सैन्य भाव को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: מִירוּשָׁלִַם
  choice: यरूशलेम से
  rationale: यह प्रस्थान-स्थान को सीधे व्यक्त करता है।
- source_word: לִרְדֹּף אַחֲרֵי
  choice: का पीछा करने के लिए
  rationale: रदफ़ और अख़रे का संयुक्त अर्थ लक्ष्य का पीछा करना है; यह हिन्दी में स्वाभाविक उद्देश्यवाचक अभिव्यक्ति है।
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: बिक्री के पुत्र शेबा
  rationale: इब्रानी पितृनाम-सूत्र को स्पष्ट और प्रचलित हिन्दी क्रम में रखा गया है।
