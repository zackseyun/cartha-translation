  yaml_path: translation/ot/2_samuel/020/018.yaml
  text: Then she said[a], “They used to say in former times[b], ‘Let them surely ask at Abel,’ and so they ended the matter.”
translation:
  language: hi
  text: तब उसने कहा[a], “पुराने समय में लोग कहा करते थे[b], ‘आबेल में अवश्य पूछो,’ और इस प्रकार वे मामला निपटा देते थे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, इस पूरे कथन का अनुवाद इस प्रकार हो सकता है: “पुराने समय में वे निश्चय ही कहा करते थे, ‘आबेल में अवश्य पूछो,’ और इस प्रकार वे बात को समाप्त कर देते थे।” इब्रानी में ‘कहना’ और ‘पूछना’—दोनों क्रियाओं पर विशेष बल है; अंतिम क्रिया का अधिक शाब्दिक अर्थ ‘समाप्त करना’ या ‘पूरा करना’ भी हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: ‘आबेल’ इस प्रसंग में घिरे हुए नगर आबेल-बेत-माका का संक्षिप्त नाम है।
    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּאמֶר לֵאמֹר
  choice: तब उसने कहा
  rationale: कथात्मक क्रम को स्वाभाविक हिन्दी में व्यक्त किया गया है; לֵאמֹר को अलग से ‘यह कहते हुए’ न देकर प्रत्यक्ष कथन के विराम-चिह्नों में समाहित किया गया है।
- source_word: דַּבֵּר יְדַבְּרוּ
  choice: लोग कहा करते थे
  rationale: इनफिनिटिव एब्सोल्यूट और इम्परफेक्ट का संयोजन यहाँ पुराने समय की प्रचलित उक्ति या रीति को दर्शाता है। कर्ता अनिश्चित बहुवचन है, इसलिए हिन्दी में ‘लोग’ स्वाभाविक है।
- source_word: בָרִאשֹׁנָה
  choice: पुराने समय में
  rationale: यह पहले की प्रथा या बीते युग की ओर संकेत करता है, न कि केवल किसी क्रम के पहले चरण की ओर।
- source_word: שָׁאֹל יְשָׁאֲלוּ
  choice: अवश्य पूछो
  rationale: इनफिनिटिव एब्सोल्यूट क्रिया पर बल देता है। उद्धृत कहावत में हिन्दी का आज्ञार्थक रूप उसके निर्देशात्मक और लोकोक्तिपरक स्वर को बनाए रखता है।
- source_word: בְּאָבֵל
  choice: हाबिल में
  rationale: בְ का स्थानवाचक अर्थ ‘में’ सीधे सुरक्षित है। यहाँ ‘हाबिल’ प्रसंग में हाबिल-बेत-माका नगर का संक्षिप्त नाम है।
- source_word: וְכֵן הֵתַמּוּ
  choice: और इस प्रकार वे बात पूरी कर देते थे
  rationale: וְכֵן परिणाम या रीति बताता है और הֵתַמּוּ किसी विषय को अंत अथवा पूर्णता तक पहुँचाने का भाव रखता है। ‘बात पूरी कर देते थे’ मूल की व्यापकता को रखते हुए स्वाभाविक हिन्दी है।
