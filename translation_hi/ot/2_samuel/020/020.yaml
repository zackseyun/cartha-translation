  text: योआब ने उत्तर दिया और कहा, “ऐसा मुझसे कभी न हो—कभी न हो—कि मैं निगल जाऊँ या नाश करूँ!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן יוֹאָב וַיֹּאמַר
  choice: योआब ने उत्तर दिया
  rationale: हिब्रू में उत्तर देने और कहने की क्रमिक अभिव्यक्ति है। स्वाभाविक आधुनिक हिन्दी में ‘उत्तर दिया’ संवाद की भूमिका को स्पष्ट करता है; अलग से ‘और कहा’ जोड़ना अनावश्यक रूप से भारी होता।
- source_word: חָלִילָה חָלִילָה לִי
  choice: मुझसे ऐसा कदापि न हो—कदापि न हो
  rationale: यह मुहावरा किसी बात का प्रबल निषेध करता है। दोहराव को बनाए रखा गया है, जबकि हिन्दी में ‘कदापि न हो’ उस तीव्र अस्वीकार को गरिमापूर्ण और बोधगम्य ढंग से व्यक्त करता है।
- source_word: אִם
  choice: कि
  rationale: חָלִילָה के बाद אִם उस कार्य को प्रस्तुत करता है जिसे वक्ता दृढ़ता से अस्वीकार कर रहा है। हिन्दी में ‘कि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲבַלַּע
  choice: मैं निगल जाऊँ
  rationale: בלע का मूल चित्र ‘निगलना’ है। घेराबंदी के प्रसंग में इसका अर्थ किसी नगर को समेट लेना या मिटा देना हो सकता है, पर अनुवाद में हिब्रू की सजीव उपमा सुरक्षित रखी गई है।
- source_word: וְאִם אַשְׁחִית
  choice: या नाश करूँ
  rationale: שׁחת के हिफ़ील रूप का अर्थ नष्ट करना या बरबादी में डालना है। यहाँ ‘या’ दोनों अस्वीकृत कार्यों को स्वाभाविक हिन्दी में जोड़ता है।
