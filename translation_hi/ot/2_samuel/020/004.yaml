base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/004.yaml
  text: Then the king said to Amasa[a], “Call the men of Judah together for me within three days, and you, remain here.”
translation:
  language: hi
  text: तब राजा ने अमासा से कहा, “तीन दिन के भीतर मेरे लिए यहूदा के पुरुषों[a] को इकट्ठा कर, और तू स्वयं यहीं बना रह।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ पुरुषवाची सामूहिक अभिव्यक्ति है। प्रसंग में इससे सम्भवतः यहूदा के युद्ध के लिए जुटाए जा सकने वाले पुरुष अभिप्रेत हैं, पर मूल शब्द उन्हें स्पष्ट रूप से ‘योद्धा’ नहीं कहता।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम को स्पष्ट रखता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित संज्ञा प्रसंग में दाऊद की ओर संकेत करती है; मूल की तरह पदनाम रखा गया है।
- source_word: הַזְעֶק
  choice: इकट्ठा कर
  rationale: זעק के हिफ़ील आज्ञार्थक का यहाँ अर्थ सार्वजनिक आह्वान करके लोगों को जुटाना है; ‘इकट्ठा कर’ इसका स्वाभाविक और प्रसंगानुकूल हिन्दी रूप है।
- source_word: לִי
  choice: मेरे लिए
  rationale: यह राजा की ओर से और उसके प्रयोजन के लिए किए जाने वाले कार्य को व्यक्त करता है।
- source_word: אֶת אִישׁ יְהוּדָה
  choice: यहूदा के पुरुषों
  rationale: אִישׁ एकवचन रूप में होते हुए भी यहाँ सामूहिक अर्थ रखता है। यह अनुवाद उसके पुरुषवाची सामूहिक स्वर को बनाए रखता है और ‘योद्धाओं’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: שְׁלֹשֶׁת יָמִים
  choice: तीन दिन के भीतर
  rationale: आज्ञा के प्रसंग में यह जुटाने की समय-सीमा बताता है, न कि कार्य की अवधि।
- source_word: וְאַתָּה
  choice: और तू स्वयं
  rationale: मूल में सर्वनाम स्पष्ट रूप से आया है और बल देता है; ‘स्वयं’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פֹּה
  choice: यहाँ
  rationale: स्थानवाचक क्रियाविशेषण का सीधा और स्वाभाविक अनुवाद।
- source_word: עֲמֹד
  choice: उपस्थित रह
  rationale: शाब्दिक अर्थ ‘खड़ा रह’ है, पर राजकीय आदेश के इस प्रसंग में आशय निर्धारित स्थान पर बने रहने और उपलब्ध रहने से है; ‘उपस्थित रह’ इस अर्थ को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
