    rationale: '''दाऊद का साथ छोड़कर ... के पीछे हो लिया'' communicates allegiance transfer but leaves out the Hebrew narrative movement verb. ''... के पीछे चला गया'' preserves both movement and the contextual shift of following.'
  - severity: low
