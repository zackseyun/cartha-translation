source:
  edition: WLC
  text: וַ/יַּ֜עַל כָּל אִ֤ישׁ יִשְׂרָאֵל֙ מֵ/אַחֲרֵ֣י דָוִ֔ד אַחֲרֵ֖י שֶׁ֣בַע בֶּן בִּכְרִ֑י וְ/אִ֤ישׁ יְהוּדָה֙ דָּבְק֣וּ בְ/מַלְכָּ֔/ם מִן הַ/יַּרְדֵּ֖ן וְ/עַד יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/002.yaml
  text: So every man of Israel went up from following David to follow Sheba son of Bichri[a], but the men of Judah held fast to their king[b], from the Jordan to Jerusalem.
translation:
  language: hi
  text: तब इस्राएल का हर पुरुष दाऊद का अनुसरण छोड़कर बिक्री के पुत्र शेबा के पीछे चला गया[a], पर यहूदा के पुरुष यरदन से लेकर यरूशलेम तक अपने राजा से दृढ़ता से जुड़े रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शब्दशः, “ऊपर गया ... शेबा के पीछे।” यह भाषा दाऊद का अनुसरण छोड़कर शेबा के पीछे जाने और, प्रसंग में, निष्ठा बदलने का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: साथ छोड़कर ... हो लिया
  rationale: עלה का मूल अर्थ ‘ऊपर जाना’ है, पर यहाँ מֵאַחֲרֵי और अगले אַחֲרֵי के साथ यह दाऊद से हटकर शेबा के पीछे जाने, अर्थात निष्ठा बदलने, को व्यक्त करता है। शाब्दिक ‘ऊपर चला गया’ हिन्दी में आशय अस्पष्ट कर देता।
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: इस्राएल का हर पुरुष
  rationale: एकवचन सामूहिक पुरुषवाचक अभिव्यक्ति और כָּל + אִישׁ की वितरणात्मक शक्ति को सुरक्षित रखा गया है।
- source_word: מֵאַחֲרֵי דָוִד
  choice: दाऊद का साथ छोड़कर
  rationale: शाब्दिक रूप से ‘दाऊद के पीछे से’ है; प्रसंग में इसका अर्थ उसका अनुसरण और समर्थन छोड़ना है। यह हिन्दी में स्वाभाविक रहते हुए निष्ठा से हटने का भाव देता है।
- source_word: אַחֲרֵי שֶׁבַע בֶּן בִּכְרִי
  choice: बिक्री के पुत्र शेबा के पीछे हो लिया
  rationale: दोहराया गया אַחֲרֵי दाऊद से शेबा की ओर अनुसरण अथवा निष्ठा के स्थानांतरण को दिखाता है; ‘पीछे हो लिया’ मूल बिंब को स्वाभाविक हिन्दी में रखता है।
- source_word: וְאִישׁ יְהוּדָה
  choice: पर यहूदा के पुरुष
  rationale: रूप एकवचन होते हुए भी यह सामूहिक है। ‘पर’ इस्राएल के हटने और यहूदा के टिके रहने के बीच निहित विरोध स्पष्ट करता है।
- source_word: דָּבְקוּ בְמַלְכָּם
  choice: अपने राजा के साथ दृढ़ता से जुड़े रहे
  rationale: דבק चिपके रहने अथवा दृढ़तापूर्वक जुड़े रहने का ठोस बिंब और निष्ठा का भाव रखता है। ‘जुड़े रहे’ उस बिंब को बचाता है, जबकि ‘वफादार रहे’ अधिक व्याख्यात्मक होता।
- source_word: מִן הַיַּרְדֵּן וְעַד יְרוּשָׁלָם
  choice: यरदन से लेकर यरूशलेम तक
  rationale: מִן ... וְעַד की सीमा और यात्रा-विस्तार को सहज, औपचारिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दाऊद से शेबा की ओर जाना राजनीतिक निष्ठा का स्थानांतरण है या केवल भौतिक गति
  choice: मुख्य पाठ में ‘दाऊद का साथ छोड़कर ... पीछे हो लिया’ द्वारा दोनों गतिशील और निष्ठासंबंधी पहलुओं को रखा गया
  alternative: ‘दाऊद के पीछे से ऊपर चढ़ गया और शेबा के पीछे चला’
  rationale: मूल की गति-संबंधी भाषा को पूरी तरह अमूर्त नहीं किया गया, किंतु हिन्दी में ‘ऊपर चढ़ना’ यहाँ अनावश्यक भौगोलिक अर्थ जगा सकता है। चयन प्रसंगगत निष्ठा-परिवर्तन को स्पष्ट करता है, बिना किसी अतिरिक्त धार्मिक निष्कर्ष के।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण कथात्मक शैली। ‘हर पुरुष’ मूल के सामूहिक पुरुषवाचक रूप को बनाए रखता है; ‘दृढ़ता से जुड़े रहे’ דבק के ठोस बिंब और निष्ठा—दोनों को सुरक्षित रखता है।
