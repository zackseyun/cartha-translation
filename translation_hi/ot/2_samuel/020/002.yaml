  terminology: '''इस्राएल,'' ''दाऊद,'' ''शेबा,'' ''बिक्री,'' ''यहूदा,'' ''यरदन,'' and ''यरूशलेम'' are retained consistently. ''हर पुरुष'' appropriately reflects the collective masculine wording without importing a theological interpretation.'
