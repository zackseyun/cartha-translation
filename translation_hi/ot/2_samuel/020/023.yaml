  text: Joab was over all the army of Israel[a], and Benaiah son of Jehoiada was over the Cherethites and the Pelethites.
translation:
  language: hi
  text: योआब सारी इस्राएली सेना का प्रधान था, और यहोयादा का पुत्र बनायाह करेती लोगों[a] और पलेती लोगों का प्रधान था।
