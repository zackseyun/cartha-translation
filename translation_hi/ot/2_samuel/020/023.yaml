    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב
  choice: योआब
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण किया गया है। आरम्भिक וְ सूची के अगले कथन को जोड़ता है; हिन्दी में अलग से ‘और’ या ‘अब’ जोड़ना आवश्यक नहीं है।
- source_word: אֶל כָּל הַ/צָּבָא יִשְׂרָאֵל
  choice: इस्राएल की सारी सेना का प्रधान था
  rationale: यह क्रियारहित प्रशासनिक वाक्यांश योआब के अधिकार-पद को व्यक्त करता है। ‘प्रधान था’ स्वाभाविक हिन्दी में उसके सैन्य नेतृत्व को बताता है, जबकि ‘सारी सेना’ כָּל הַצָּבָא को सुरक्षित रखता है।
- source_word: וּ/בְנָיָה בֶּן יְהוֹיָדָע
  choice: और यहोयादा का पुत्र बनायाह
  rationale: दोनों नामों का प्रचलित हिन्दी लिप्यंतरण किया गया है और पिता-पुत्र का संबंध स्पष्ट रूप से रखा गया है।
- source_word: עַל ה/כרי
  choice: करेती लोगों का प्रधान था
  rationale: עַל इस पद-सूची में अधिकार को दर्शाता है। समूह-नाम का अर्थ अनुमान से तय करने के बजाय उसका लिप्यंतरण किया गया है; लिखित रूप की अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: וְ/עַל הַ/פְּלֵתִי
  choice: और पलेती लोगों का
  rationale: दूसरा समूह पहले के साथ समानांतर है और उसी ‘प्रधान था’ से जुड़ता है। जाति/दल के नाम को व्याख्यायित करने के बजाय लिप्यंतरित किया गया है।
