  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל אֲבִישַׁ֔י עַתָּ֗ה יֵ֧רַֽע לָ֛/נוּ שֶׁ֥בַע בֶּן בִּכְרִ֖י מִן אַבְשָׁל֑וֹם אַ֠תָּה קַ֞ח אֶת עַבְדֵ֤י אֲדֹנֶ֨י/ךָ֙ וּ/רְדֹ֣ף אַחֲרָ֔י/ו פֶּן מָ֥צָא ל֛/וֹ עָרִ֥ים בְּצֻר֖וֹת וְ/הִצִּ֥יל עֵינֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/006.yaml
  text: Then David said to Abishai[a], “Now Sheba son of Bichri will do us more harm than Absalom. You, take your lord’s servants and pursue after him, lest he find fortified cities for himself and escape from our sight.”
translation:
  language: hi
  text: तब दाऊद ने अबीशै से कहा, “अब बिक्री का पुत्र शेबा हमारे लिए अबशालोम से भी अधिक संकट खड़ा करेगा। तुम अपने स्वामी के सेवकों को लेकर उसका पीछा करो, कहीं ऐसा न हो कि वह अपने लिए गढ़वाले नगर पा ले और हमारी आँखों से ओझल हो जाए[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, “और हमारी आँखों को छुड़ा ले जाए”; आशय है हमारी दृष्टि से बच निकलना या हमें चकमा देना।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרַע לָנוּ
  choice: हमारे लिए ... अधिक संकट खड़ा करेगा
  rationale: यहाँ क्रिया का आशय अमूर्त नैतिक बुराई नहीं, बल्कि हानि या मुसीबत पहुँचाना है। यह अभिव्यक्ति तुलना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: बिक्री का पुत्र शेबा
  rationale: व्यक्तिनामों का मानक हिन्दी लिप्यंतरण किया गया है और हिब्रू संबंध-विन्यास सुरक्षित रखा गया है।
- source_word: מִן אַבְשָׁלוֹם
  choice: अबशालोम से भी अधिक
  rationale: מִן यहाँ तुलनात्मक अर्थ देता है; ‘से भी अधिक’ हिन्दी में तुलना के बल को स्पष्ट और सहज रूप से रखता है।
- source_word: אַתָּה קַח
  choice: तुम ... लेकर
  rationale: स्वतंत्र सर्वनाम אַתָּה पर बल है, इसलिए ‘तुम’ को स्पष्ट रखा गया है।
- source_word: עַבְדֵי אֲדֹנֶיךָ
  choice: अपने स्वामी के सेवकों
  rationale: यह अबीशै के स्वामी, अर्थात दाऊद, के अधीन सेवकों को दर्शाता है। ‘सेवक’ पदानुक्रम को रखता है, पर अनावश्यक रूप से दासत्व का अर्थ आरोपित नहीं करता।
- source_word: וּרְדֹף אַחֲרָיו
  choice: उसका पीछा करो
  rationale: सैन्य प्रसंग में यह स्वाभाविक हिन्दी है और רדף אחר की गति तथा उद्देश्य दोनों व्यक्त करती है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह नकारात्मक आशंका को आधुनिक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: מָצָא לוֹ עָרִים בְּצֻרוֹת
  choice: वह अपने लिए गढ़वाले नगर पा ले
  rationale: ‘पा ले’ מצא के मूल अर्थ को रखता है, ‘अपने लिए’ לוֹ के लाभार्थक भाव को दर्शाता है, और ‘गढ़वाले नगर’ रक्षायुक्त शहरी शरणस्थलों का संकेत देता है।
- source_word: וְהִצִּיל עֵינֵינוּ
  choice: हमारी आँखों से ओझल हो जाए
  rationale: हिब्रू का शाब्दिक चित्र ‘हमारी आँखों को छुड़ा ले जाना’ जैसा है। हिन्दी मुहावरा ‘आँखों से ओझल हो जाना’ उस दृश्यात्मकता और बच निकलने के अर्थ दोनों को स्वाभाविक रूप से रखता है।
