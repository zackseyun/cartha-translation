lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: गया
  rationale: यह सामान्य इब्रानी कथात्मक क्रिया है; आधुनिक हिन्दी में “गया” सहज और स्पष्ट है।
- source_word: לְהַזְעִיק
  choice: इकट्ठा करने
  rationale: हिफ़ील रूप यहाँ लोगों को तत्काल एकत्र बुलाने का अर्थ देता है। “इकट्ठा करने” सामान्य पाठक के लिए स्वाभाविक है, जबकि प्रसंग में सैनिक लामबंदी का भाव भी निहित है।
- source_word: אֶת יְהוּדָה
  choice: यहूदा को
  rationale: मूल पाठ सामूहिक रूप से “यहूदा” कहता है; हिन्दी में इसे बनाए रखने से अनावश्यक रूप से “पुरुषों” या “गोत्र” को स्पष्ट नहीं किया जाता।
- source_word: וייחר
  choice: उसने देर कर दी
  rationale: इस प्रसंग में אחר का अर्थ निर्धारित समय से देर करना है; यह हिन्दी अभिव्यक्ति अगले पदबंध के साथ स्वाभाविक बैठती है।
- source_word: מִן הַמּוֹעֵד
  choice: जो समय ठहराया था, उससे
  rationale: מועד निश्चित या ठहराए हुए समय को दर्शाता है, और מן के साथ सीमा से आगे देर होने का भाव आता है।
- source_word: אֲשֶׁר יְעָדוֹ
  choice: दाऊद ने उसके लिए जो समय ठहराया था
  rationale: יעד का अर्थ समय निर्धारित करना है। कर्ता मूल पद में केवल सर्वनाम से व्यक्त है, पर पिछले पद से दाऊद स्पष्ट संदर्भ है; हिन्दी में नाम देने से सर्वनामगत अस्पष्टता दूर होती है।
