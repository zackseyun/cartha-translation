base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/011.yaml
  text: And one of Joab’s young men stood over him and said[a], “Whoever favors Joab, and whoever is for David[b], follow Joab!”
translation:
  language: hi
  text: योआब के जवानों[a] में से एक जन उसके ऊपर खड़ा था और उसने कहा, “जो कोई योआब का पक्षधर है और जो कोई दाऊद का है, वह योआब के पीछे चले![b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जवानों” का अनुवाद “सेवकों” या “परिचारकों” के रूप में भी किया जा सकता है; आशय योआब के अधीन रहने वाले लोगों से है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “योआब के पीछे।” इस प्रसंग में यह उसके पीछे चलने और उसके साथ जुट जाने का आह्वान है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: एक जन
  rationale: אִישׁ यहाँ योआब के लोगों में से किसी एक अनिश्चित व्यक्ति का परिचय देता है। ‘एक जन’ उसके पुरुष होने और अनिश्चितता—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עָמַד עָלָיו
  choice: उसके ऊपर खड़ा होकर
  rationale: עמד के साथ על का अर्थ किसी के ऊपर या पास खड़ा होना हो सकता है। पिछले प्रसंग में अमासा भूमि पर पड़ा है, इसलिए ‘उसके ऊपर खड़ा होकर’ दृश्य को सबसे स्पष्ट रूप से व्यक्त करता है।
- source_word: מִנַּעֲרֵי יוֹאָב
  choice: योआब के जवानों में से
  rationale: נַעַר युवक, सेवक या परिचारक का अर्थ दे सकता है। सैन्य प्रसंग में ‘जवानों’ से अधीनस्थ सैनिकों का भाव स्वाभाविक रूप से व्यक्त होता है, जबकि अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: מִי אֲשֶׁר חָפֵץ בְּיוֹאָב
  choice: जो कोई योआब का पक्षधर है
  rationale: חָפֵץ चाहने, प्रसन्न होने या समर्थन करने का भाव रखता है। यहाँ यह निष्ठा जुटाने की पुकार है, इसलिए ‘पक्षधर’ राजनीतिक और सैन्य समर्थन को स्पष्ट करता है।
- source_word: וּמִי אֲשֶׁר לְדָוִד
  choice: और जो कोई दाऊद का है
  rationale: दाऊद के साथ לְ निष्ठा या संबंध प्रकट करता है। ‘दाऊद का है’ मूल की संक्षिप्त अभिव्यक्ति और उसकी हल्की अस्पष्टता को बनाए रखता है।
- source_word: אַחֲרֵי יוֹאָב
  choice: वह योआब के पीछे हो ले
  rationale: אַחֲרֵי का शाब्दिक अर्थ ‘पीछे’ है, पर इस युद्ध-संबंधी आह्वान में आशय योआब के साथ चलने या उसका अनुसरण करने से है। ‘पीछे हो ले’ दोनों पहलुओं को समेटता है।
