    issue: Awkward directional expression
    rationale: “यहाँ पास आओ” is nonstandard/awkward Hindi. “यहाँ तक आओ” naturally conveys the speaker’s request that Joab come near to her location.
  - severity: low
    issue: Redundant reporting expression
    rationale: “पुकारकर कहा” is understandable but stylistically repetitive. The Hebrew verb means “called out”; “पुकारा” conveys it directly.
