  text: Then a wise woman called out from the city, “Listen! Listen! Please tell Joab, ‘Come near to here, so that I may speak with you.’”
translation:
  language: hi
  text: तब नगर में से एक बुद्धिमान स्त्री ने पुकारा, “सुनो! सुनो! कृपया योआब से कहो, ‘यहाँ तक आओ, ताकि मैं तुमसे बात करूँ।’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה חֲכָמָה
  choice: एक बुद्धिमान स्त्री
  rationale: हिब्रू संज्ञा और विशेषण का सीधा, स्वाभाविक तथा गरिमापूर्ण हिन्दी रूप।
- source_word: מִן הָעִיר
  choice: नगर में से
  rationale: स्त्री की पुकार नगर के भीतर से आने का स्थानिक अर्थ बनाए रखता है।
- source_word: שִׁמְעוּ שִׁמְעוּ
  choice: सुनो! सुनो!
  rationale: बहुवचन आज्ञार्थ और दोहराव की तात्कालिकता को सुरक्षित रखता है; हिन्दी में यही रूप एक या अनेक श्रोताओं को संबोधित कर सकता है।
- source_word: אִמְרוּ נָא
  choice: कृपया ... से कहो
  rationale: נָא की विनम्र विनती और बहुवचन आज्ञार्थ दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: קְרַב עַד הֵנָּה
  choice: यहाँ पास आओ
  rationale: קרב के निकट आने और עד הנה के वक्ता के स्थान तक आने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַאֲדַבְּרָה אֵלֶיךָ
  choice: ताकि मैं तुमसे बात करूँ
  rationale: इच्छासूचक क्रियारूप को उद्देश्य के भाव में दर्शाता है और योआब के लिए एकवचन संबोधन बनाए रखता है।
