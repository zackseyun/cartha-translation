  register: आधुनिक मानक हिन्दी; कथात्मक शैली सरल, गरिमापूर्ण और मौखिक पुकार के अनुरूप है। प्रत्यक्ष कथन के भीतर उद्धरण को स्पष्ट रखने के लिए दोहरे और एकहरे उद्धरण-चिह्न प्रयुक्त हैं।
