  yaml_path: translation/ot/2_samuel/020/021.yaml
  text: That is not the matter[a]. Rather, a man from the hill country of Ephraim, Sheba son of Bichri by name, has raised his hand against the king, against David. Hand him over alone, and I will withdraw from the city.” And the woman said to Joab, “Look[b], his head will be thrown to you over the wall.”
translation:
  language: hi
  text: “बात ऐसी नहीं है। बल्कि एप्रैम के पहाड़ी प्रदेश[a] का एक पुरुष, जिसका नाम बिक्री का पुत्र शेबा है, उसने राजा के विरुद्ध—दाऊद के विरुद्ध—अपना हाथ उठाया है[b]। केवल उसी को मेरे हवाले कर दो, तब मैं नगर के पास से हट जाऊँगा।” स्त्री ने योआब से कहा, “देखो, उसका सिर दीवार के ऊपर से तुम्हारे पास फेंक दिया जाएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परंपरागत अनुवाद: “एप्रैम पर्वत का।” यहाँ इब्रानी अभिव्यक्ति एप्रैम के पहाड़ी क्षेत्र को भी दर्शा सकती है।'
    reason: lexical_alternative
  - marker: b
    text: अर्थात् उसने राजा के विरुद्ध विद्रोह किया है। इब्रानी मुहावरे का शाब्दिक अर्थ है, “अपना हाथ उठाया है।”
    reason: lexical_alternative
