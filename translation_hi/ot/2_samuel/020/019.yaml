source:
  edition: WLC
  text: אָנֹכִ֕י שְׁלֻמֵ֖י אֱמוּנֵ֣י יִשְׂרָאֵ֑ל אַתָּ֣ה מְבַקֵּ֗שׁ לְ/הָמִ֨ית עִ֤יר וְ/אֵם֙ בְּ/יִשְׂרָאֵ֔ל לָ֥/מָּה תְבַלַּ֖ע נַחֲלַ֥ת יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/019.yaml
  text: I am one of the peaceable and faithful in Israel. You are seeking to destroy a city[a], and a mother in Israel. Why would you swallow up the inheritance of Yahweh?
translation:
  language: hi
  text: मैं इस्राएल के शांतिप्रिय और विश्वासयोग्य लोगों में से हूँ। तुम इस्राएल में एक नगर—एक माता—को नष्ट करना चाहते हो।[a] तुम यहोवा की विरासत को क्यों निगल जाओगे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक ऐसे नगर को, जो इस्राएल में माता है”; संभवतः इसका अर्थ इस्राएल का कोई प्रमुख या पालन-पोषण करने वाला नगर है।
    reason: ‘नगर और माता’ के बीच का व्याकरणिक संबंध संभवतः समानाधिकरणीय है, पर मूल अभिव्यक्ति में कुछ अस्पष्टता बनी रहती है।
lexical_decisions:
- source_word: שְׁלֻמֵי אֱמוּנֵי יִשְׂרָאֵל
  choice: इस्राएल के शांतिप्रिय और विश्वासयोग्य लोगों में से
  rationale: दोनों बहुवचन रूप एक समुदाय या वर्ग का संकेत देते हैं; स्त्री स्वयं को उसी समूह में गिनती है। यह रूप शांति और निष्ठा दोनों गुणों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: מְבַקֵּשׁ לְהָמִית
  choice: नष्ट करना चाहते हो
  rationale: शाब्दिक अर्थ ‘मार डालना चाहते हो’ है, पर कर्म ‘नगर’ होने और घेराबंदी के प्रसंग में हिन्दी का ‘नष्ट करना’ अभिप्रेत सामूहिक विनाश को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עִיר וְאֵם בְּיִשְׂרָאֵל
  choice: इस्राएल के एक नगर—एक माता—को
  rationale: वाव से जुड़ी इस अभिव्यक्ति को व्याख्यात्मक रूप से पूरी तरह समतल किए बिना नगर और ‘माता’ की संभवतः समानाधिकरणीय पहचान को डैश द्वारा दर्शाया गया है।
- source_word: תְבַלַּע
  choice: निगल जाना चाहते हो
  rationale: मूल क्रिया के सजीव ‘निगलने’ वाले रूपक को बनाए रखता है; प्रसंग में इसका आशय विनाश करना है।
- source_word: נַחֲלַת יְהוָה
  choice: यहोवा की विरासत
  rationale: נחלה के उत्तराधिकार/धरोहर संबंधी वाच्यार्थ और इस्राएल पर यहोवा के अधिकार के वाचिक बल को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित प्रतिलेखन से प्रस्तुत किया गया है।
theological_decisions:
- issue: ‘इस्राएल में माता’ का रूपक
  choice: नगर को ‘एक माता’ कहने वाला रूपक मुख्य पाठ में बनाए रखा गया है।
  alternative: ‘इस्राएल का एक प्रमुख/पालन-पोषण करने वाला नगर’
  rationale: मूल पाठ की काव्यात्मक और सामाजिक छवि को किसी एक व्याख्या में सीमित नहीं किया गया; संभावित अर्थ पादटिप्पणी में दिया गया है।
- issue: ‘यहोवा की विरासत’
  choice: विरासत को यहोवा से संबद्ध रखा गया है।
  alternative: ‘यहोवा की प्रजा’
  rationale: संदर्भ में प्रजा या नगर अभिप्रेत हो सकता है, पर मूल संज्ञा ‘विरासत’ के वाचा-संबंधी तनाव को स्पष्ट व्याख्या से नहीं बदला गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और बोलचाल में बोधगम्य हिन्दी। स्त्री वक्ता के कारण ‘मैं ... में से हूँ’ स्वाभाविक रूप से लिंग-निरपेक्ष रहता है। डैश मूल के असामान्य ‘नगर और माता’ संबंध को दिखाता है; पादटिप्पणी उसका संभावित अर्थ स्पष्ट करती है।
