  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘तड़पते हुए लोट रहा था’ मूल क्रिया की लोटने वाली गति और घायल अवस्था की पीड़ा दोनों को सुरक्षित रखता है। ‘लहू’ इस हिंसक ऐतिहासिक दृश्य के लिए सजीव किंतु प्रचलित बाइबलीय हिन्दी है। कोई सांप्रदायिक या व्याख्यात्मक विस्तार नहीं जोड़ा गया।
