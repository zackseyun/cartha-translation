base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/012.yaml
  text: Amasa was wallowing in blood in the middle of the highway. When the man saw that all the people were stopping[a], he moved Amasa from the highway into the field and threw a garment over him, because he saw that everyone who came upon him stopped.
translation:
  language: hi
  text: अमासा सड़क के बीचोंबीच लहू में तड़पते हुए लोट रहा था। जब उस आदमी ने देखा कि सब लोग रुक रहे थे, तो उसने अमासा को सड़क से हटाकर खेत में ले गया और उसके ऊपर एक वस्त्र डाल दिया, क्योंकि उसने देखा कि जो कोई उसके पास पहुँचता, वह रुक जाता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִתְגֹּלֵל
  choice: तड़पते हुए लोट रहा था
  rationale: हित्पोलेल कृदंत का मूल बिंब स्वयं लोटने या करवटें बदलने का है। प्रसंग में अमासा घातक रूप से घायल है, इसलिए ‘तड़पते हुए लोट रहा था’ शारीरिक गति और पीड़ा दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; केवल ‘तड़प रहा था’ गति के बिंब को खो देता।
- source_word: בַּדָּם
  choice: लहू में
  rationale: मूल पाठ में ‘लहू में’ का सजीव दृश्य है। ‘अपने लहू में’ अर्थतः संभव है, पर ‘अपने’ मूल में स्पष्ट नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: בְּתוֹךְ הַמְסִלָּה
  choice: सड़क के बीचोंबीच
  rationale: מְסִלָּה मुख्य या निर्मित सड़क को सूचित कर सकता है। आधुनिक हिन्दी में ‘सड़क के बीचोंबीच’ स्थान और अवरोध दोनों को स्पष्ट तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הָאִישׁ
  choice: उस आदमी
  rationale: निश्चित उपपद एक पहचाने हुए व्यक्ति की ओर संकेत करता है। हिन्दी कथन में ‘उस आदमी’ यह निश्चितता ‘एक आदमी’ से अधिक स्पष्ट करता है।
- source_word: כִּי עָמַד כָּל הָעָם
  choice: कि सब लोग रुक रहे हैं
  rationale: עמד यहाँ मार्ग में पड़े अमासा को देखकर लोगों के ठहर जाने को बताता है। अपूर्ण चल रही स्थिति के लिए ‘रुक रहे हैं’ कथानक के प्रवाह के अनुकूल है।
- source_word: וַיַּסֵּב
  choice: हटाकर ... कर दिया
  rationale: हिफ़ील रूप किसी वस्तु को एक ओर करने का भाव देता है। ‘हटाकर खेत में कर दिया’ दिशा और परिणाम स्पष्ट करता है, पर ‘घसीटा’ जैसी ऐसी क्रिया नहीं जोड़ता जो मूल में निर्दिष्ट नहीं है।
- source_word: מִן הַמְסִלָּה הַשָּׂדֶה
  choice: सड़क से हटाकर खेत में
  rationale: रचना सड़क से निकटवर्ती खेत की ओर स्थानांतरण बताती है। हिन्दी में ‘सड़क से ... खेत में’ स्रोत और गंतव्य दोनों को सहज रूप से स्पष्ट करता है।
- source_word: בֶּגֶד
  choice: एक वस्त्र
  rationale: בֶּגֶד कपड़े या पहनावे का सामान्य शब्द है। ‘वस्त्र’ इसकी व्यापकता बनाए रखता है; ‘चादर’ या ‘लबादा’ अनावश्यक विशिष्टता जोड़ते।
- source_word: כָּל הַבָּא עָלָיו
  choice: जो कोई उसके पास पहुँचता
  rationale: यह वाक्यांश घटनास्थल पर आकर अमासा तक पहुँचने वालों को दर्शाता है। ‘उसके पास पहुँचता’ आधुनिक हिन्दी में स्वाभाविक है और जानबूझकर मिलने आने का भाव आवश्यक रूप से नहीं जोड़ता।
- source_word: וְעָמָד
  choice: वह रुक जाता था
  rationale: 'दोहराया गया עמד पहले कथन को पुष्ट करता है: अमासा तक पहुँचने वाला प्रत्येक व्यक्ति रुक जाता था। आदतन परिणाम के लिए हिन्दी का ‘रुक जाता था’ उपयुक्त है।'
