base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/009.yaml
  text: Joab said to Amasa[a], “Is it well with you, my brother?” And Joab took hold of Amasa’s beard with his right hand to kiss him.
translation:
  language: hi
  text: योआब ने अमासा[a] से कहा, “मेरे भाई, क्या तुम कुशल हो?” तब योआब ने उसे चूमने के लिए अपने दाहिने हाथ से अमासा की दाढ़ी पकड़ ली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दाढ़ी पकड़ना और चूमना परिचितों के बीच अभिवादन से जुड़े हाव-भाव थे; यहाँ प्रसंग में यह व्यवहार छलपूर्ण है।
    reason: cultural_note
lexical_decisions:
- source_word: הֲשָׁלוֹם אַתָּה
  choice: क्या तुम कुशल से हो
  rationale: यह इब्रानी मुहावरा सामने वाले की कुशल-क्षेम पूछता है। यह अनुवाद ‘शांति’ के मूल भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אָחִי
  choice: मेरे भाई
  rationale: इब्रानी में प्रथम पुरुष एकवचन का संबंधवाचक प्रत्यय स्पष्ट है; यह संबोधन योआब की दिखाई हुई आत्मीयता को भी बनाए रखता है।
- source_word: וַתֹּחֶז
  choice: पकड़ ली
  rationale: क्रिया का अर्थ पकड़ना या थाम लेना है। अगले पद के आक्रमण को समय से पहले इस पद में आरोपित किए बिना यह क्रिया को स्पष्ट रूप से व्यक्त करता है।
- source_word: יַד יְמִין יוֹאָב
  choice: अपने दाहिने हाथ से
  rationale: यह हिन्दी में स्वाभाविक ढंग से उस मूल विवरण को सुरक्षित रखता है कि योआब ने दाहिने हाथ का उपयोग किया।
- source_word: בִּזְקַן עֲמָשָׂא
  choice: अमासा की दाढ़ी
  rationale: सीधा संबंधवाचक प्रयोग आधुनिक हिन्दी में स्वाभाविक है और अभिवादन से जुड़े सांस्कृतिक संकेत को बनाए रखता है।
- source_word: לִנְשָׁק לוֹ
  choice: उसे चूमने के लिए
  rationale: ל के साथ infinitive उद्देश्य प्रकट करता है; यह अनुवाद उसी उद्देश्य को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
