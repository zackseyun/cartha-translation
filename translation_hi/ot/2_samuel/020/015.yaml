base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/015.yaml
  text: They came and besieged him in Abel-beth-maacah[a], and they cast up a siege ramp against the city, and it stood against the rampart[c][b]; and all the people who were with Joab were destroying it to bring down the wall.
translation:
  language: hi
  text: वे आए और आबेल-बेत-माका में उसे घेर लिया[a]। उन्होंने नगर के विरुद्ध घेराबंदी का टीला[b] बनाया, और वह बाहरी किलेबंदी[c] के सामने खड़ा था। योआब के साथ के सब लोग नगर को नष्ट कर रहे थे, ताकि दीवार गिरा दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘उसके विरुद्ध घेरा डाला’ है। सम्भवतः लक्ष्य शेबा है, यद्यपि घेरा नगर का डाला गया था।
    reason: alternative_reading
  - marker: b
    text: इसके लिए ‘घेराबंदी का बाँध’ या ‘मिट्टी का चढ़ाव’ भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: यह इब्रानी शब्द किसी बाहरी रक्षात्मक निर्माण, परकोटे या मोर्चेबंदी को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּצֻרוּ עָלָיו
  choice: उसे घेर लिया
  rationale: עָלָיו का पुल्लिंग एकवचन प्रत्यय सम्भवतः शेबा को लक्ष्य बनाता है, यद्यपि घेरा नगर का डाला गया था। ‘उसे’ मूल पाठ के इस केंद्रबिंदु को बनाए रखता है।
- source_word: בְּאָבֵלָה בֵּית הַמַּעֲכָה
  choice: आबेल-बेत-माका में
  rationale: स्थान-नाम को हिन्दी देवनागरी में निकट ध्वन्यात्मक लिप्यंतरण के साथ प्रस्तुत किया गया है।
- source_word: וַיִּשְׁפְּכוּ סֹלְלָה
  choice: घेराबंदी का टीला बनाया
  rationale: שׁפך का शाब्दिक अर्थ ‘उंडेलना’ है, पर घेराबंदी के प्रसंग में यह मिट्टी इकट्ठी करके सֹלְלָה, अर्थात आक्रमण के लिए टीला या चढ़ाव, बनाने का मुहावरा है।
- source_word: וַתַּעֲמֹד בַּחֵל
  choice: वह बाहरी किलेबंदी के सामने खड़ा था
  rationale: स्त्रीलिंग क्रिया का स्वाभाविक संबंध स्त्रीलिंग סֹלְלָה से है। חֵל नगर की बाहरी रक्षात्मक किलेबंदी या परकोटे को सूचित कर सकता है; अनुवाद इस सैन्य चित्र को बनाए रखता है।
- source_word: וְכָל הָעָם אֲשֶׁר אֶת יוֹאָב
  choice: योआब के साथ के सब लोग
  rationale: यहाँ אֶת संगति या साथ होने का भाव देता है और प्रसंग में योआब के सैनिकों को दर्शाता है। ‘सब लोग’ मूल के עָם के निकट रहते हुए अर्थ स्पष्ट करता है।
- source_word: מַשְׁחִיתִם לְהַפִּיל הַחוֹמָה
  choice: दीवार को गिराने के लिए उसमें तोड़-फोड़ कर रहे थे
  rationale: बहुवचन कृदंत जारी विनाशकारी कार्रवाई बताता है और उद्देश्यवाचक पद दीवार गिराना स्पष्ट करता है। ‘उसमें’ वस्तु को अत्यधिक निश्चित किए बिना नगर की रक्षात्मक संरचना की ओर संकेत करता है।
