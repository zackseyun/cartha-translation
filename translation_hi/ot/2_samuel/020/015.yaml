  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। सैन्य पदों को स्पष्ट किया गया है, पर ‘उसे’ और रक्षात्मक संरचना की प्रकृति से जुड़ी मूल इब्रानी की अस्पष्टता को टिप्पणियों सहित सुरक्षित रखा गया है।
