lexical_decisions:
- source_word: וְגַם
  choice: और ... भी
  rationale: संयोजक और योगवाचक बल—दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: עִירָא
  choice: ईरा
  rationale: व्यक्तिनाम का हिन्दी लिप्यंतरण।
- source_word: הַיָּאִרִי
  choice: याईरी
  rationale: वंश अथवा कुल-संबंधी विशेषण को संक्षिप्त जातिवाचक रूप में रखा गया है।
- source_word: הָיָה
  choice: था
  rationale: अधिकारियों की सूची में यह साधारण भूतकालीन संबंधसूचक क्रिया है, ‘बन गया’ नहीं।
- source_word: כֹהֵן
  choice: याजक
  rationale: इब्रानी शब्द का सामान्य और प्रत्यक्ष अर्थ ‘याजक’ है; राजदरबार के संदर्भ में सम्भव प्रशासनिक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: हिन्दी में संबंध अथवा सेवा का स्वाभाविक संकेत देता है, जबकि पद के ठीक स्वरूप को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: राजदरबार के संदर्भ में כֹהֵן का अर्थ
  choice: मुख्य पाठ में ‘याजक’
  alternative: ‘मुख्य मंत्री’ या ‘राजकीय सलाहकार’
  rationale: शब्द का सामान्य अर्थ ‘याजक’ है, यद्यपि कुछ राजकीय संदर्भों में यह किसी उच्च दरबारी अधिकारी को सूचित कर सकता है। मूल की अस्पष्टता को बनाए रखने के लिए मुख्य पाठ में प्रत्यक्ष अर्थ और पादटिप्पणी में कार्यात्मक विकल्प दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण प्रशासनिक-वृत्तांत शैली। ‘दाऊद का याजक’ स्वाभाविक हिन्दी है और मूल में निहित संबंध को बनाए रखता है।
