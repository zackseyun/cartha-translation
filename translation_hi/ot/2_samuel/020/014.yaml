  text: वह इस्राएल के सभी गोत्रों के बीच से होता हुआ आबेल और बेत-माका तक गया। तब सभी बेरी लोग[a] इकट्ठे हुए और वे भी उसके पीछे हो लिए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘सभी बेरी लोग।’ कुछ अनुवादों में ‘सभी बिक्री वंश के लोग’ है, जिसे प्रसंग के आधार पर बिक्रि के पुत्र शेबा से जोड़ा जाता है; पर यहाँ मसोरेटिक पाठ सीधे तौर पर ‘बेरी लोग’ का समर्थन करता है।
    reason: alternative_reading
  - marker: b
    text: या, ‘और वे भी उसके पीछे आए।’ इब्रानी मुहावरे का अधिक शाब्दिक अनुवाद ऐसा हो सकता है।
    reason: lexical_alternative
