base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/022.yaml
  text: Then the woman went to all the people in her wisdom[a], and they cut off the head of Sheba son of Bichri and threw it to Joab. Then he blew the trumpet, and they dispersed from the city, each man to his tent; and Joab returned to Jerusalem to the king.
translation:
  language: hi
  text: तब वह स्त्री अपनी बुद्धि से काम लेते हुए सब लोगों के पास गई। उन्होंने बिक्री के पुत्र शेबा का सिर काटकर योआब की ओर फेंक दिया। तब योआब ने नरसिंगा फूँका, और लोग नगर से हटकर तितर-बितर हो गए—हर एक अपने डेरे को चला गया[a]। फिर योआब यरूशलेम में राजा के पास लौट गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “हर व्यक्ति अपने डेरे को।” यह अपने-अपने स्थान लौट जाने के लिए प्रयुक्त एक रूढ़ इब्रानी मुहावरा है।'
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּבוֹא הָאִשָּׁה אֶל כָּל הָעָם
  choice: वह स्त्री ... सब लोगों के पास गई
  rationale: בוא का अर्थ दृष्टिकोण के अनुसार ‘आना’ या ‘जाना’ हो सकता है। बाहरी कथावाचक के दृष्टिकोण से ‘गई’ स्वाभाविक है; עָם को तटस्थ रूप से ‘लोगों’ कहा गया है।
- source_word: בְּחָכְמָתָהּ
  choice: अपनी बुद्धि से काम लेते हुए
  rationale: यह प्रयोग स्त्री की बुद्धि को उसके कार्य के साधन या ढंग के रूप में उभारता है। हिन्दी में यह मूल के संज्ञात्मक बल को बनाए रखते हुए स्वाभाविक है और यह नहीं बताता कि उसने लोगों से ठीक क्या कहा।
- source_word: וַיִּכְרְתוּ אֶת רֹאשׁ שֶׁבַע בֶּן בִּכְרִי
  choice: उन्होंने बिक्री के पुत्र शेबा का सिर काटकर
  rationale: כרת के साथ ‘सिर’ कर्म होने पर स्पष्ट अर्थ सिर काट देना है। इब्रानी पितृनाम को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: וַיַּשְׁלִכוּ אֶל יוֹאָב
  choice: योआब की ओर फेंक दिया
  rationale: אֶל दिशा या लक्ष्य बताता है। ‘की ओर’ मूल की दिशात्मकता को बनाए रखता है और यह अनावश्यक रूप से नहीं कहता कि सिर सीधे योआब को दिया गया।
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: योआब ने नरसिंगा फूँका
  rationale: एकवचन कर्ता संदर्भ में योआब है। שׁוֹפָר के लिए ‘नरसिंगा’ आधुनिक हिन्दी में पशु-सींग से बने संकेत-वाद्य का उपयुक्त पारंपरिक शब्द है।
- source_word: וַיָּפֻצוּ מֵעַל הָעִיר
  choice: लोग नगर के पास से तितर-बितर हो गए
  rationale: מֵעַל הָעִיר का शाब्दिक भाव नगर के ऊपर/विरुद्ध लगी घेराबंदी की स्थिति से हटना है। ‘नगर के पास से’ उस स्थानिक भाव को केवल ‘नगर से’ की अपेक्षा बेहतर रखता है, और פוץ को ‘तितर-बितर’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: אִישׁ לְאֹהָלָיו
  choice: हर एक अपने डेरे को चला गया
  rationale: शाब्दिक चित्र को मुख्य पाठ में रखा गया है; यह अपने-अपने स्थान लौट जाने का रूढ़ मुहावरा भी है।
- source_word: וְיוֹאָב שָׁב יְרוּשָׁלִַם אֶל הַמֶּלֶךְ
  choice: योआब यरूशलेम में राजा के पास लौट गया
  rationale: लक्ष्य के दोनों तत्व—यरूशलेम और राजा—स्पष्ट तथा स्वाभाविक हिन्दी क्रम में रखे गए हैं।
