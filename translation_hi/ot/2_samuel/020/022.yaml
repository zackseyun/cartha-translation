translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। हिंसक क्रिया को मूल के समान प्रत्यक्ष रूप में व्यक्त किया गया है। अंग्रेज़ी परामर्श-पाठ में [a] का स्थान ‘बुद्धि’ के बाद था, पर उसकी सामग्री אִישׁ לְאֹהָלָיו से संबंधित है; इसलिए हिन्दी मुख्य पाठ में चिह्न को सही वाक्यांश के बाद रखा गया है।
