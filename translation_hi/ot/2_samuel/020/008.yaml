base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/008.yaml
  text: When they were by the great stone that is in Gibeon[a], Amasa came before them. Now Joab was dressed in his military garment, and over it was a belt with a sword fastened to his waist in its sheath; and as he went out[c][b], it fell.
translation:
  language: hi
  text: जब वे गिबोन में उस बड़े पत्थर के पास थे, तब अमासा उनके सामने आया।[a] योआब अपनी युद्ध-पोशाक[b] पहने हुए था। उसके ऊपर एक पेटी थी, और म्यान में रखी तलवार उसकी कमर से बँधी थी। जब वह आगे बढ़ा, तो तलवार गिर पड़ी।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘अमासा उनसे मिलने आया’ भी हो सकता है। इब्रानी में शाब्दिक रूप से ‘उनके सामने आया’ है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘अपनी पोशाक’ अथवा ‘वह वस्त्र जो उसने पहन रखा था।’ यहाँ प्रयुक्त इब्रानी शब्द इस सैनिक प्रसंग में युद्ध-पोशाक को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में कर्ता स्पष्ट नहीं कहा गया है। ‘गिर पड़ी’ के लिए प्रयुक्त स्त्रीलिंग क्रिया का संकेत सम्भवतः तलवार की ओर है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: הֵם עִם הָאֶבֶן הַגְּדוֹלָה אֲשֶׁר בְּגִבְעוֹן
  choice: जब वे गिबोन में उस बड़े पत्थर के पास थे
  rationale: स्थानवाचक प्रयोग में עִם का स्वाभाविक हिन्दी रूप ‘के पास’ है; אֲשֶׁר בְּגִבְעוֹן पत्थर का स्थान बताता है।
- source_word: וַעֲמָשָׂא בָּא לִפְנֵיהֶם
  choice: तब अमासा उनके सामने आया
  rationale: לִפְנֵי का मूल स्थानवाचक अर्थ ‘सामने’ रखा गया है; इससे यह तय नहीं किया गया कि वह विशेष रूप से उनसे मिलने आया था।
- source_word: וְיוֹאָב חָגוּר מִדּוֹ לְבֻשׁוֹ
  choice: योआब अपनी युद्ध-पोशाक पहने हुए था
  rationale: מַד किसी विशिष्ट पोशाक, और इस सैनिक प्रसंग में युद्ध-पोशाक, को सूचित कर सकता है। हिन्दी में ‘पहने हुए था’ सुस्पष्ट और स्वाभाविक है।
- source_word: וְעָלָיו חֲגוֹר
  choice: उसके ऊपर उसने एक पेटी बाँध रखी थी
  rationale: वाक्य पोशाक के ऊपर बँधी पेटी का चित्र देता है। ‘पेटी’ हथियार लटकाने वाली कमर-पेटी के लिए सहज आधुनिक शब्द है।
- source_word: חֶרֶב מְצֻמֶּדֶת עַל מָתְנָיו בְּתַעְרָהּ
  choice: म्यान में रखी तलवार उसकी कमर से बँधी थी
  rationale: מְצֻמֶּדֶת निकटता से बाँधे या लगाए जाने को और תַּעַר तलवार की म्यान को दर्शाता है।
- source_word: וְהוּא יָצָא
  choice: जब वह आगे बढ़ा
  rationale: יָצָא का मूल भाव बाहर निकलना या आगे आना है। प्रसंग में ‘आगे बढ़ा’ स्वाभाविक है, जबकि पादटिप्पणी के बिना अनावश्यक स्थानगत विवरण नहीं जोड़ता।
- source_word: וַתִּפֹּל
  choice: तो तलवार गिर पड़ी
  rationale: स्त्रीलिंग क्रिया का सबसे निकट और स्वाभाविक पूर्वपद स्त्रीलिंग חֶרֶב ‘तलवार’ है; हिन्दी में संज्ञा दोहराने से संदर्भ स्पष्ट होता है।
