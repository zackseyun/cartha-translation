translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक और सामान्य पाठक के लिए सहज शैली रखी गई है। ‘युद्ध-पोशाक’ प्रसंग और शब्दार्थ-सीमा दोनों को व्यक्त करता है, जबकि पादटिप्पणी व्यापक विकल्प सुरक्षित रखती है। अस्पष्ट सर्वनाम के स्थान पर मुख्य पाठ में ‘तलवार’ रखा गया है और मूल की व्याकरणिक अनिश्चितता पादटिप्पणी में बताई गई है।
