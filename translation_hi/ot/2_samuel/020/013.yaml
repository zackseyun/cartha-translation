  yaml_path: translation/ot/2_samuel/020/013.yaml
  text: As soon as he had been removed from the highway[a], every man passed on after Joab to pursue Sheba son of Bichri.
translation:
  language: hi
  text: जैसे ही उसे राजमार्ग[a] से हटा दिया गया, सभी पुरुष योआब के पीछे-पीछे बिक्री के पुत्र शेबा का पीछा करने के लिए आगे बढ़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुख्य मार्ग” अथवा “सड़क।” इब्रानी शब्द מְסִלָּה किसी ऊँचे बनाए गए मार्ग या मुख्य सड़क को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: जैसे ही
  rationale: यह कालवाचक उपवाक्य आरम्भ करता है; कथा-संदर्भ में बाधा हटते ही सेना के आगे बढ़ने का तत्काल क्रम व्यक्त होता है।
- source_word: הֹגָה
  choice: उसे ... हटा दिया गया
  rationale: होफ़ल रूप कर्मवाच्य है और किसी वस्तु या व्यक्ति को हटाए जाने का भाव देता है। कर्म संदर्भ से अमासा के शव को सूचित करता है; पद में नाम न दोहराकर मूल की संदर्भगतता रखी गई है।
- source_word: מִן הַמְסִלָּה
  choice: राजमार्ग से
  rationale: מְסִלָּה ऊँचे बनाए गए मार्ग, मुख्य मार्ग या राजमार्ग को सूचित कर सकता है। 'राजमार्ग' इसके अपेक्षाकृत चिह्नित अर्थ को रखता है; अधिक सामान्य विकल्प पादटिप्पणी में दिया गया है।
- source_word: עָבַר
  choice: आगे बढ़े
  rationale: यहाँ क्रिया बाधा हटने के बाद आगे निकलने और अभियान जारी रखने को सूचित करती है; 'आगे बढ़े' आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כָּל אִישׁ
  choice: सब पुरुष
  rationale: इब्रानी का शाब्दिक भाव 'हर पुरुष' है और प्रसंग योआब के साथ चल रहे लड़ाकों का है। हिन्दी में सामूहिक सैन्य दल के लिए 'सब पुरुष' सहज है।
- source_word: אַחֲרֵי יוֹאָב
  choice: योआब के पीछे
  rationale: यह पद योआब का अनुसरण करते हुए आगे जाने का स्थानिक और नेतृत्वगत भाव बनाए रखता है।
- source_word: לִרְדֹּף
  choice: ताकि वे ... पीछा करें
  rationale: लामेद सहित क्रियार्थक रूप उद्देश्य बताता है। उद्देश्य को स्पष्ट और स्वाभाविक हिन्दी उपवाक्य में व्यक्त किया गया है।
- source_word: אַחֲרֵי שֶׁבַע בֶּן בִּכְרִי
  choice: बिक्री के पुत्र शेबा का पीछा
  rationale: नाम और पितृनाम की इब्रानी संरचना सुरक्षित रखी गई है; אַחֲרֵי को רדף के साथ हिन्दी मुहावरे 'पीछा करना' में व्यक्त किया गया है।
