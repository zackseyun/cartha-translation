translation_notes:
  register: आधुनिक मानक हिन्दी में स्पष्ट, गरिमापूर्ण कथात्मक शैली रखी गई है। हिंसक दृश्य की मूल स्पष्टता को न तो नरम किया गया है, न बोलचाल के भद्दे शब्दों से अधिक सनसनीखेज बनाया गया है। किसी पाद-टिप्पणी की आवश्यकता नहीं मानी गई, क्योंकि ‘पेट’ इस प्रसंग में חֹמֶשׁ का सर्वाधिक संभावित अर्थ है और कम संभावित ‘पाँचवीं पसली’ पाठ में वास्तविक अर्थगत अस्पष्टता के बजाय अनुवाद-परंपरा दर्शाता है।
