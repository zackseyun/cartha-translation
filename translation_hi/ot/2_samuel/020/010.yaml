base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/010.yaml
  text: But Amasa was not on guard against the sword that was in Joab’s hand[a], and he struck him with it in the belly, and his entrails spilled out to the ground; he did not strike him again, and he died. Then Joab and Abishai his brother pursued Sheba son of Bichri.
translation:
  language: hi
  text: पर अमासा योआब के हाथ में पकड़ी तलवार से सावधान नहीं था। योआब ने उस तलवार से उसके पेट[क] में वार किया, और उसकी आँतें निकलकर धरती पर बिखर गईं। उसने उस पर फिर वार नहीं किया, और वह मर गया। तब योआब और उसका भाई अबीशै बिख्री के पुत्र शेबा का पीछा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, ‘पाँचवीं पसली के पास।’ इब्रानी अभिव्यक्ति का पारंपरिक अनुवाद ऐसा किया गया है, पर इस संदर्भ में इसका अर्थ अधिक संभवतः पेट या उदर का क्षेत्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמַר
  choice: से सावधान नहीं था
  rationale: निफ़ाल रूप यहाँ किसी दूसरे द्वारा रक्षा किए जाने के बजाय खतरे के प्रति चौकन्ना रहने का भाव देता है। यह सहज आधुनिक हिन्दी में अमासा की असावधानी व्यक्त करता है।
- source_word: חֶרֶב אֲשֶׁר בְּיַד יוֹאָב
  choice: योआब के हाथ में पकड़ी तलवार
  rationale: חֶרֶב का सामान्य अर्थ ‘तलवार’ है और בְּיַד यहाँ हथियार के सचमुच योआब के हाथ में होने को बताता है। ‘पकड़ी’ हिन्दी में इस स्थानिक अर्थ को स्वाभाविक बनाता है।
- source_word: וַיַּכֵּהוּ בָהּ
  choice: उससे उसके ... में वार किया
  rationale: נכה व्यापक रूप से प्रहार करने को दर्शाता है। तलवार और घातक घाव के प्रसंग में ‘वार किया’ स्वाभाविक है, पर ‘भोंक दिया’ जैसी अधिक विशिष्ट क्रिया अनावश्यक रूप से नहीं जोड़ता।
- source_word: אֶל הַחֹמֶשׁ
  choice: उसके पेट में
  rationale: शमूएल की इन युद्ध-कथाओं में חֹמֶשׁ पेट या उदर के क्षेत्र को सूचित करता है। ‘पाँचवीं पसली’ पारंपरिक विकल्प है, पर इस संदर्भ में शब्द का अधिक संभावित सामान्य अर्थ ‘पेट’ है।
- source_word: וַיִּשְׁפֹּךְ מֵעָיו אַרְצָה
  choice: उसकी आँतें निकलकर भूमि पर गिर पड़ीं
  rationale: यह आंतरिक अंगों के बाहर निकलकर धरती पर गिरने का सजीव वर्णन है। ‘आँतें’ स्पष्ट और वर्तमान हिन्दी है, जबकि ‘भूमि’ वर्णन की गंभीरता बनाए रखता है।
- source_word: וְלֹא שָׁנָה לוֹ
  choice: उसने उस पर दोबारा वार नहीं किया
  rationale: शाब्दिक भाव ‘उसके लिए दोहराया नहीं’ है; प्रसंग में छूटी हुई क्रिया वार करना है। हिन्दी में उसे स्पष्ट करना आवश्यक और अर्थानुकूल है।
- source_word: וַיָּמֹת
  choice: फिर भी वह मर गया
  rationale: सरल कथात्मक क्रम में मृत्यु बताई गई है। ‘फिर भी’ हिन्दी में यह संबंध स्पष्ट करता है कि दूसरा वार आवश्यक नहीं हुआ, बिना यह कहे कि वह तत्काल मरा।
- source_word: רָדַף אַחֲרֵי
  choice: पीछा करने लगे
  rationale: यह सैनिक पीछा करने की मानक अभिव्यक्ति है और बहुवचन कर्ताओं के साथ सहज हिन्दी देती है।
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: बिक्री के पुत्र शेबा
  rationale: हिन्दी बाइबलीय नाम-रूप और स्वाभाविक वंश-सूचक संरचना अपनाई गई है।
