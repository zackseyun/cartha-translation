base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/003.yaml
  text: When David came to his house at Jerusalem[a], the king took the ten women, the concubines whom he had left to keep the house, and put them in guarded custody and provided for them, but he did not go in to them. So they were kept confined until the day of their death[c][b], living as widows.
translation:
  language: hi
  text: जब दाऊद यरूशलेम में अपने घर लौटा, तब राजा ने उन दस स्त्रियों—अपनी उपपत्नियों—को, जिन्हें वह घर की देखभाल करने के लिए छोड़ गया था, लेकर निगरानी में अलग रख दिया[a] और उनके भरण-पोषण की व्यवस्था करता रहा; पर वह उनके पास नहीं गया[b]। इस प्रकार वे अपनी मृत्यु के दिन तक बंद रखी गईं और जीते-जी विधवाओं की तरह रहीं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘पहरे या हिरासत के घर में रख दिया।’
    reason: lexical_alternative
  - marker: b
    text: ‘उनके पास नहीं गया’ यौन संबंध न रखने के लिए प्रयुक्त इब्रानी शिष्टोक्ति है।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से, ‘जीवित अवस्था का विधवापन’—अर्थात दाऊद के जीवित रहते हुए भी वे विधवाओं जैसी दशा में रहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: अपने घर
  rationale: בַּיִת यहाँ दाऊद के यरूशलेम स्थित राजकीय निवास को सूचित कर सकता है। ‘घर’ मूल की व्यापकता बनाए रखता है; ‘महल’ अधिक व्याख्यात्मक होता।
- source_word: פִּלַגְשִׁים
  choice: उपपत्नियाँ
  rationale: यह शब्द प्राचीन राजपरिवार में मान्य, पर पत्नी से निम्न सामाजिक-कानूनी दर्जा रखने वाली स्त्रियों के लिए है। ‘उपपत्नियाँ’ इस भेद को बिना अनावश्यक अपमानजनक भाव के व्यक्त करता है।
- source_word: הִנִּיחַ לִשְׁמֹר הַבַּיִת
  choice: घर की देखभाल करने के लिए छोड़ गया था
  rationale: שׁמר में रखवाली और देखरेख दोनों का भाव हो सकता है। प्रसंग में ‘देखभाल’ सहज हिन्दी है और निवास की जिम्मेदारी सौंपे जाने का अर्थ रखता है।
- source_word: בֵּית מִשְׁמֶרֶת
  choice: पहरे में अलग रख दिया
  rationale: शाब्दिक अर्थ ‘पहरे/हिरासत का घर’ है। यह चयन निगरानी और एकांत में रखे जाने, दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיְכַלְכְּלֵם
  choice: उनके भरण-पोषण की व्यवस्था करता रहा
  rationale: क्रिया का अर्थ आवश्यक वस्तुएँ देकर संभालना या पालन करना है। ‘करता रहा’ निरंतर व्यवस्था का भाव स्पष्ट करता है।
- source_word: וַאֲלֵיהֶם לֹא בָא
  choice: वह उनके पास नहीं गया
  rationale: मूल इब्रानी मुहावरे को बनाए रखा गया है; इस प्रसंग में यह यौन संबंध न रखने का शिष्टोक्ति-युक्त संकेत है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: צְרֻרוֹת
  choice: बंद रखी गईं
  rationale: निष्क्रिय कृदंत लगातार बंद या सीमित अवस्था में रखे जाने का परिणामसूचक भाव देता है।
- source_word: עַד יוֹם מֻתָן
  choice: अपनी मृत्यु के दिन तक
  rationale: मूल की संज्ञात्मक अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: אַלְמְנוּת חַיּוּת
  choice: जीवित विधवाओं की तरह रहीं
  rationale: असामान्य इब्रानी पद का आशय है कि पति जीवित होते हुए भी वे विधवाओं जैसी दशा में रहीं। यह रूप उस विरोधाभास को बनाए रखता है।
theological_decisions:
- issue: दाऊद द्वारा उपपत्नियों के साथ किए गए व्यवहार का नैतिक और सामाजिक मूल्यांकन
  choice: कार्यवाही और स्त्रियों की परिणामी दशा का बिना नरमी या औचित्य-स्थापन के वर्णन
  alternative: इसे केवल संरक्षण बताना, अथवा मूल में निहित न होने वाली स्पष्ट निंदा जोड़ना
  rationale: पद पहरे में अलग रखने, भरण-पोषण करने, यौन संबंध न रखने और जीवनभर विधवा-सदृश रहने की स्थिति बताता है। अनुवाद उसी कठोर तनाव को बनाए रखता है और अतिरिक्त नैतिक निर्णय नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक और सामान्य पाठकों के लिए सुबोध स्तर रखा गया है। ‘उपपत्नियाँ’ सामाजिक दर्जे को ‘रखैल’ की अपेक्षा अधिक तटस्थ ढंग से व्यक्त करता है। मूल की शिष्टोक्ति और अंतिम विरोधाभासी अभिव्यक्ति को मुख्य पाठ तथा संक्षिप्त पादटिप्पणियों में सुरक्षित रखा गया है।
