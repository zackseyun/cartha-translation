base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/001.yaml
  text: There happened to be there a worthless man[a], whose name was Sheba son of Bichri, a Benjaminite. He blew the trumpet and said, “We have no share in David, and no inheritance in the son of Jesse. Every man to his tents[d][c][b], O Israel!”
translation:
  language: hi
  text: वहाँ एक दुष्ट व्यक्ति[a] था, जिसका नाम शेबा था; वह बिक्री का पुत्र, बिन्यामीन गोत्र का व्यक्ति था। उसने नरसिंगा[b] फूँका और कहा, “दाऊद में हमारा कोई हिस्सा[c] नहीं, और यिशै के पुत्र में हमारी कोई विरासत नहीं। हे इस्राएल, हर एक अपने डेरे को लौट जाए[d]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निकम्मा व्यक्ति,” “बदमाश”; अधिक शाब्दिक रूप में, “बेलियाल का आदमी।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शोफ़ार—सार्वजनिक संकेत देने के लिए फूँका जाने वाला सींग; परंपरागत रूप से इसे मेढ़े का सींग माना जाता है।
    reason: cultural_note
  - marker: c
    text: या “दाऊद में हमारा कोई भाग नहीं।”
    reason: lexical_alternative
  - marker: d
    text: इब्रानी में शाब्दिक रूप से “हर एक अपने डेरों को।” यह वितरणात्मक मुहावरा है, जिसका अर्थ है कि प्रत्येक व्यक्ति अपने घर या छावनी को लौट जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִקְרָא
  choice: था
  rationale: שָׁם के साथ यह रूप यहाँ किसी के नाम रखे जाने की बात नहीं, बल्कि उसके वहाँ मौजूद होने का परिचय देता है। हिंदी में “वहाँ ... था” स्वाभाविक अस्तित्वसूचक अभिव्यक्ति है।
- source_word: אִישׁ בְּלִיַּעַל
  choice: एक नीच आदमी
  rationale: בְּלִיַּעַל यहाँ किसी दुष्ट सत्ता का व्यक्तिवाचक नाम नहीं, बल्कि चरित्रहीन, निकम्मे या दुष्ट व्यक्ति का वर्णन है। “नीच आदमी” उस निंदात्मक नैतिक अर्थ को सहज हिंदी में व्यक्त करता है।
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: शेबा ... बिक्री का पुत्र
  rationale: व्यक्तिगत नामों का देवनागरी में ध्वन्यात्मक लिप्यंतरण किया गया है और בֶּן का वंशसूचक अर्थ स्पष्ट रखा गया है।
- source_word: אִישׁ יְמִינִי
  choice: बिन्यामीनी
  rationale: यह पद उसकी बिन्यामीन गोत्र से संबद्धता बताता है; “बिन्यामीनी” प्रचलित और संक्षिप्त हिंदी रूप है।
- source_word: וַיִּתְקַע בַּשֹּׁפָר
  choice: उसने नरसिंगा फूँका
  rationale: שׁוֹפָר संकेत देने के लिए फूँका जाने वाला पशु-सींग था। “नरसिंगा” सामान्य “तुरही” से अधिक ठोस रूप से सींग के वाद्य का संकेत देता है, और सांस्कृतिक विवरण पाद-टिप्पणी में सुरक्षित है।
- source_word: אֵין לָנוּ חֵלֶק בְּדָוִד
  choice: दाऊद में हमारा कोई हिस्सा नहीं
  rationale: חֵלֶק का मूल अर्थ हिस्सा या भाग है। यह वाक्य दाऊद के शासन में कोई राजनीतिक भागीदारी या सरोकार न होने का विद्रोही दावा करता है, पर रूपक को यथावत रखता है।
- source_word: וְלֹא נַחֲלָה לָנוּ בְּבֶן יִשַׁי
  choice: और यिशै के पुत्र में हमारी कोई विरासत नहीं
  rationale: נַחֲלָה का “विरासत” अर्थ भूमि, अधिकार और प्राप्त भाग की गूँज बनाए रखता है। दाऊद को राजकीय उपाधि के बजाय “यिशै का पुत्र” कहना मूल की उपेक्षापूर्ण शैली को सुरक्षित रखता है।
- source_word: אִישׁ לְאֹהָלָיו
  choice: हर एक अपने डेरे को चला जाए
  rationale: एकवचन אִישׁ यहाँ वितरणात्मक है। हिंदी में “हर एक” वही बल देता है; “चला जाए” मूल के संक्षिप्त विद्रोही नारे में निहित प्रस्थान की आज्ञा को स्वाभाविक बनाता है।
- source_word: יִשְׂרָאֵל
  choice: हे इस्राएल
  rationale: यह उत्तरी गोत्रों को संबोधित पुकार है। “हे” संबोधन को स्पष्ट करते हुए नारे की ऊँची शैली बनाए रखता है।
theological_decisions:
