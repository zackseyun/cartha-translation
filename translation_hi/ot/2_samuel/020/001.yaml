  choice: चरित्रसूचक अभिव्यक्ति “नीच आदमी”
  alternative: “बेलियाल का आदमी” अथवा “दुष्ट आदमी”
  rationale: इस ऐतिहासिक प्रसंग में यह अभिव्यक्ति शेबा के निकृष्ट या दुष्ट चरित्र का वर्णन करती है; इसे “बेलियाल” नाम देने से बाद के दानव-संबंधी अर्थ अनावश्यक रूप से पाठ में आ सकते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक हिंदी है। विद्रोही घोषणा की नारे जैसी लय बनाए रखी गई है। “नीच आदमी” और “नरसिंगा” जैसे शब्द सहज बोधगम्यता तथा मूल की सांस्कृतिक और नैतिक विशिष्टता के बीच संतुलन रखते हैं।
