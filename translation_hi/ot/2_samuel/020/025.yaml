  yaml_path: translation/ot/2_samuel/020/025.yaml
  text: and Sheva was secretary[a], and Zadok and Abiathar were priests.
translation:
  language: hi
  text: और शेवा सचिव[a] था, और सादोक और एब्यातार याजक थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लेखक’। इब्रानी शब्द किसी लेखक या सचिव को सूचित कर सकता है; इस प्रशासनिक सूची में यह संभवतः राजदरबार के एक अधिकारी का पद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שיא
  choice: शेवा
  rationale: मसोरेटिक पाठ में दिए व्यंजनात्मक नाम को सीधे हिन्दी में लिप्यंतरित किया गया है; समानांतर सूचियों में मिलने वाले भिन्न नामरूप को यहाँ मुख्य पाठ में नहीं मिलाया गया।
- source_word: סֹפֵר
  choice: राजकीय सचिव
  rationale: यह शब्द लिखने वाले व्यक्ति के साथ-साथ राजकीय प्रशासन के अधिकारी को भी सूचित कर सकता है। प्रसंग प्रशासनिक पदों की सूची है, इसलिए ‘राजकीय सचिव’ आधुनिक पाठक को पद स्पष्ट करता है; ‘शास्त्री’ यहाँ भ्रामक हो सकता है।
- source_word: צָדוֹק
  choice: सादोक
  rationale: इब्रानी नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֶבְיָתָר
  choice: एब्यातार
  rationale: इब्रानी नाम का निकट और प्रचलित हिन्दी लिप्यंतरण।
- source_word: כֹּהֲנִים
  choice: याजक
  rationale: उपासना-संबंधी पद के लिए मानक और सहज हिन्दी शब्द; बहुवचन का बोध संयुक्त कर्ता और ‘थे’ से होता है।
- source_word: וְ
  choice: और
  rationale: सूची की समन्वयी संरचना और मूल में संयोजक की पुनरावृत्ति को स्वाभाविक हिन्दी में बनाए रखा गया है।
