base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/021.yaml
  text: After they had gone, they came up out of the well and went and told King David. They said to David, “Get up and cross over the water quickly, for this is what Ahithophel has advised against you.”
translation:
  language: hi
  text: उनके चले जाने के बाद, वे कुएँ से बाहर निकले और जाकर राजा दाऊद को सूचना दी। उन्होंने दाऊद से कहा, “उठिए और शीघ्र पानी के पार चले जाइए, क्योंकि अहीतोपेल ने आपके विरुद्ध ऐसी सलाह दी है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי לֶכְתָּם
  choice: उनके चले जाने के बाद
  rationale: इब्रानी काल-सूचक वाक्यांश को सहज आधुनिक हिन्दी में प्रस्तुत करता है और संदर्भित व्यक्तियों को अनिर्दिष्ट ही रखता है।
- source_word: וַיַּעֲלוּ מֵהַבְּאֵר
  choice: वे कुएँ से बाहर निकले
  rationale: עלה का मूल भाव ‘ऊपर आना’ है; कुएँ के संदर्भ में ‘बाहर निकले’ स्वाभाविक और अर्थ-सटीक हिन्दी है।
- source_word: וַיַּגִּדוּ
  choice: सूचना दी
  rationale: यहाँ क्रिया का अर्थ राजा तक आवश्यक समाचार पहुँचाना है; ‘सूचना दी’ गरिमापूर्ण और स्पष्ट है।
- source_word: קוּמוּ
  choice: उठिए
  rationale: बहुवचन आदेश को हिन्दी के आदरसूचक रूप में व्यक्त किया गया है, जो राजा दाऊद से संबोधन के अनुकूल है।
- source_word: וְעִבְרוּ מְהֵרָה אֶת־הַמַּיִם
  choice: और शीघ्र पानी के पार चले जाइए
  rationale: עבר और מהר का आदेशात्मक तथा तात्कालिक भाव सुरक्षित है; ‘पानी’ स्रोत की सामान्य अभिव्यक्ति को किसी विशेष नदी के नाम में नहीं बदलता।
- source_word: כִּי כָכָה יָעַץ עֲלֵיכֶם אֲחִיתֹפֶל
  choice: क्योंकि अहीतोपेल ने आपके विरुद्ध ऐसी ही सलाह दी है
  rationale: ככה को ‘ऐसी ही’ और עליכם को प्रसंगानुसार ‘आपके विरुद्ध’ रखा गया है; सलाह की अनिष्टकारी दिशा स्पष्ट रहती है।
theological_decisions:
- issue: अहीतोपेल की सलाह का दाऊद से संबंध
  choice: आपके विरुद्ध
  alternative: आपके विषय में
  rationale: עליכם में कुछ संबंधगत विस्तार संभव है, पर निकटवर्ती कथा में सलाह दाऊद को पकड़ने और मारने की है; ‘विरुद्ध’ उस शत्रुतापूर्ण दिशा को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथा-शैली। दाऊद के लिए आदरसूचक बहुवचन क्रिया-रूप रखा गया है। किसी अनावश्यक स्थल-नाम या व्याख्यात्मक विस्तार को नहीं जोड़ा गया।
