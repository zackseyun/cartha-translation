  text: Now send quickly and tell David[a], saying, ‘Do not stay tonight at the fords of the wilderness, but be sure to cross over, lest the king and all the people who are with him be swallowed up.’
translation:
  language: hi
  text: अब तुरन्त संदेश भेजो और दाऊद को यह कहो, “आज रात निर्जन प्रदेश के मैदानों में[a] मत ठहरना, और हर हाल में पार चले जाना; कहीं ऐसा न हो कि राजा और उसके साथ के सभी लोग निगल लिए जाएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्जन प्रदेश के घाटों पर।” इब्रानी पद का सामान्य अर्थ उस प्रदेश के खुले या निचले मैदान हो सकता है; पर अगले आदेश में पार जाने की बात होने के कारण कुछ लोग यहाँ नदी पार करने के घाट समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब
  rationale: यह संवाद में तत्काल अगला कदम उठाने का संकेत देता है और आग्रह की तात्कालिकता बनाए रखता है।
- source_word: שִׁלְחוּ מְהֵרָה וְהַגִּידוּ לְדָוִד לֵאמֹר
  choice: तुरन्त संदेश भेजकर दाऊद से कहो
  rationale: इब्रानी आज्ञाओं और संदेश पहुँचाने के सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; बहुवचन आज्ञा का रूप ‘कहो’ संदर्भानुसार समूह को संबोधित करता है।
- source_word: אַל תָּלֶן הַלַּיְלָה
  choice: आज रात ... मत ठहरना
  rationale: לון का अर्थ रात बिताना या टिकना है; ‘मत ठहरना’ स्पष्ट और सहज है।
- source_word: בְּעַרְבוֹת הַמִּדְבָּר
  choice: निर्जन प्रदेश के मैदानों में
  rationale: עֲרָבוֹת का सामान्य अर्थ निचले खुले मैदान या अराबा-क्षेत्र है। निकट संदर्भ में नदी पार करने की बात होने से ‘घाटों’ की व्याख्या संभव है, पर वह शब्द का निर्विवाद अर्थ नहीं; इसलिए मुख्य पाठ में अधिक प्रत्यक्ष अर्थ रखा गया है और विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: וְגַם עָבוֹר תַּעֲבוֹר
  choice: बल्कि हर हाल में पार चले जाना
  rationale: क्रिया के infinitive absolute और finite verb का मेल प्रबल आग्रह व्यक्त करता है। ‘हर हाल में’ उस जोर को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह चेतावनी और संभावित अनिष्ट को व्यक्त करने वाला स्वाभाविक हिन्दी संयोजन है।
- source_word: יְבֻלַּע
  choice: निगल लिए जाएँ
  rationale: मूल निष्क्रिय क्रिया के ‘निगल लिए जाने’ वाले सजीव रूपक को बनाए रखता है; संदर्भ में इसका आशय घिरकर नष्ट हो जाना है।
- source_word: לַמֶּלֶךְ וּלְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: राजा और उसके साथ के सभी लोग
  rationale: दाऊद के लिए प्रयुक्त राजकीय उपाधि और עָם के व्यापक अर्थ—उसके साथ का पूरा समुदाय—दोनों सुरक्षित रहते हैं।
