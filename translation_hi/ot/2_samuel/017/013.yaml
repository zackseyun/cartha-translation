base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/013.yaml
  text: And if he withdraws into a city[a], then all Israel will bring ropes to that city[b], and we will drag it to the wadi until not even a small stone is found there.
translation:
  language: hi
  text: और यदि वह किसी नगर में जा सिमट जाए, तो समस्त इस्राएल उस नगर तक रस्सियाँ ले आएगा, और हम उसे खींचकर नाले[a] तक ले जाएँगे, यहाँ तक कि वहाँ एक कंकड़ भी नहीं मिलेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बरसाती नदी,” “जलधारा,” अथवा “नदी का पाट।” इब्रानी शब्द נַחַל मौसमी जलधारा या उससे बनी घाटी को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָסֵף
  choice: जा छिपे
  rationale: निफ़अल रूप यहाँ दाऊद के किसी नगर में सिमटकर शरण लेने को सूचित करता है। ‘जा छिपे’ सैन्य प्रसंग में स्वाभाविक है और केवल निष्क्रिय ‘इकट्ठा किया जाए’ से अधिक स्पष्ट है।
- source_word: וְהִשִּׂיאוּ
  choice: ले आएगा
  rationale: रस्सियों को नगर तक लाने/ढोने का भाव है; सामूहिक कर्ता ‘समस्त इस्राएल’ के साथ हिन्दी में एकवचन क्रिया स्वाभाविक है।
- source_word: חֲבָלִים
  choice: रस्सियाँ
  rationale: नगर को खींचने की अतिशयोक्तिपूर्ण छवि में ठोस और सामान्य हिन्दी समतुल्य।
- source_word: וְסָחַבְנוּ אֹתוֹ
  choice: हम उसे खींचकर ... ले जाएँगे
  rationale: סחב का अर्थ घसीटना या खींचना है। सर्वनाम का संदर्भ नगर से लिया गया है; हिन्दी का ‘उसे’ इस संदर्भ को स्वाभाविक रूप से बनाए रखता है।
- source_word: הַנַּחַל
  choice: नाला
  rationale: נחל यहाँ मौसमी जलधारा, उसका पाट, या घाटी-सदृश जलमार्ग हो सकता है। ‘नाला’ साधारण पाठक के लिए सहज है; विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: גַּם צְרוֹר
  choice: एक कंकड़ भी
  rationale: צרור छोटे पत्थर या कंकड़ को सूचित करता है। ‘एक कंकड़ भी नहीं’ पूर्ण विनाश की अतिशयोक्ति को संक्षिप्त और सजीव रखता है।
