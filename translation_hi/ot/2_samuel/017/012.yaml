source:
  edition: WLC
  text: וּ/בָ֣אנוּ אֵלָ֗י/ו ב/אחת הַ/מְּקוֹמֹת֙ אֲשֶׁ֣ר נִמְצָ֣א שָׁ֔ם וְ/נַ֣חְנוּ עָלָ֔י/ו כַּ/אֲשֶׁ֛ר יִפֹּ֥ל הַ/טַּ֖ל עַל הָ/אֲדָמָ֑ה וְ/לֹֽא נ֥וֹתַר בּ֛/וֹ וּ/בְ/כָל הָ/אֲנָשִׁ֥ים אֲשֶׁר אִתּ֖/וֹ גַּם אֶחָֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/012.yaml
  text: Then we will come upon him in one of the places where he is found[a], and we will settle on him just as the dew falls on the ground; and not one will be left of him and of all the men who are with him—not even one.
translation:
  language: hi
  text: तब हम उन स्थानों में से किसी एक में, जहाँ वह पाया जाए, उस पर चढ़ आएँगे और उस पर ऐसे छा जाएँगे[a], जैसे ओस भूमि पर गिरती है। न तो वह बचेगा और न ही उसके साथ के सभी पुरुषों में से एक भी बचेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘उस पर टिक जाएँगे’ या ‘उस पर आकर ठहर जाएँगे’ भी हो सकता है; यहाँ यह क्रिया ओस की तरह पूरी तरह छा जाने वाले आक्रमण का चित्र प्रस्तुत करती है।
    reason: נוּחַ के मूल ‘ठहरने/टिकने’ के अर्थ और सैन्य उपमा में उसके प्रसंगगत ‘छा जाने’ के भाव—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: וּבָאנוּ אֵלָיו
  choice: तब ... उस पर चढ़ आएँगे
  rationale: בוא मूलतः ‘आना’ है, पर यहाँ सैन्य आक्रमण का संदर्भ है। ‘चढ़ आएँगे’ दिशा और शत्रुतापूर्ण आगे बढ़ने—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; ‘तब’ योजना के अगले चरण को दिखाता है।
- source_word: בְאַחַת הַמְּקוֹמוֹת אֲשֶׁר נִמְצָא שָׁם
  choice: उन स्थानों में से किसी एक में, जहाँ वह पाया जाए
  rationale: यह अनिश्चित स्थान को सूचित करता है और נִמְצָא के निष्क्रिय भाव ‘पाया जाए’ को बनाए रखता है।
- source_word: וְנַחְנוּ עָלָיו
  choice: और उस पर ऐसे छा जाएँगे[a]
  rationale: נוח का मूल भाव ‘ठहरना/टिकना/आकर जमना’ है। आक्रमण और ओस की उपमा के संदर्भ में ‘छा जाएँगे’ व्यापक, दबावपूर्ण आवरण को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि अगले खंड के נפל (‘गिरना’) से इसे अलग रखता है।
- source_word: כַּאֲשֶׁר יִפֹּל הַטַּל עַל הָאֲדָמָה
  choice: जैसे ओस भूमि पर गिरती है
  rationale: उपमा को सीधे रखते हुए יִפֹּל का ‘गिरती है’ और אֲדָמָה का ‘भूमि’ अनूदित किया गया है।
- source_word: וְלֹא נוֹתַר ... גַּם אֶחָד
  choice: एक भी बचेगा नहीं
  rationale: נותר के बचे रहने के भाव और גם אחד के प्रबल निषेध को सहज हिन्दी में जोड़ा गया है।
- source_word: בּוֹ וּבְכָל הָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: न तो वह और न उसके साथ के सभी पुरुषों में से
  rationale: वाक्य दाऊद स्वयं और उसके साथ उपस्थित सभी पुरुषों—दोनों तक पूर्ण विनाश की बात फैलाता है। ‘पुरुषों’ से सैन्य-संदर्भ और मूल का लिंग-सूचक शब्द सुरक्षित रहता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘चढ़ आएँगे’ सैन्य संदर्भ को स्पष्ट करता है, जबकि ‘छा जाएँगे’ ओस की उपमा से स्वाभाविक संबंध बनाता है और मूल में נוח तथा נפל के भेद को नहीं मिटाता।
