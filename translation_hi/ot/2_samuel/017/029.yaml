  yaml_path: translation/ot/2_samuel/017/029.yaml
  text: and honey and curds and sheep and cheese from the herd they brought near for David and for the people who were with him to eat[a], for they said[c][b], “The people are hungry and weary and thirsty in the wilderness.”
translation:
  language: hi
  text: और वे दाऊद और उसके साथ रहने वाले लोगों के खाने के लिए मधु, दही,[a] भेड़-बकरियाँ[b] और मवेशियों से बना दुग्ध-पदार्थ[c] ले आए; क्योंकि उन्होंने कहा, “लोग निर्जन प्रदेश में भूखे, थके और प्यासे हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मक्खन” अथवा “मलाई”; इब्रानी शब्द व्यापक अर्थ में दूध से बने पदार्थ को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द सामूहिक रूप से भेड़ों और बकरियों जैसे छोटे पालतू पशुओं को दर्शा सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी पद दुर्लभ है और मवेशियों से सम्बद्ध दुग्ध-पदार्थ को दर्शाता है; इसका ठीक प्रकार निश्चित नहीं है। इसे “पनीर” भी समझा जाता है।
    reason: lexical_alternative
