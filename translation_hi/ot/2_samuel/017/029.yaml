- source_word: חֶמְאָה
  choice: दही
  rationale: बाइबिलीय प्रयोग में यह आधुनिक मथे हुए मक्खन की अपेक्षा गाढ़े या जमे हुए दूध के पदार्थ को अधिक सम्भावित रूप से दर्शाता है; हिन्दी में ‘दही’ सर्वसुलभ निकटतम शब्द है।
- source_word: צֹאן
  choice: भेड़-बकरियाँ
  rationale: सामूहिक इब्रानी संज्ञा छोटे पालतू पशुओं—भेड़ों और बकरियों—दोनों को समेट सकती है; संयुक्त पद मूल की व्यापकता बचाता है।
- source_word: שְׁפוֹת בָּקָר
  choice: गाय के दूध का पनीर
  rationale: दुर्लभ पद मवेशियों से बने दुग्ध-पदार्थ को दर्शाता है। ‘गाय के दूध का पनीर’ ठोस खाद्य-पदार्थ का सम्भावित अर्थ स्पष्ट करता है, जबकि पादटिप्पणी अनिश्चितता बनाए रखती है।
- source_word: הִגִּישׁוּ
  choice: ले आए
  rationale: क्रिया का अर्थ निकट लाना या प्रस्तुत करना है; भोजन-सामग्री पहुँचाने के इस प्रसंग में ‘ले आए’ स्वाभाविक हिन्दी है।
- source_word: לְדָוִד וְלָעָם אֲשֶׁר אִתּוֹ
  choice: दाऊद और उसके साथ के लोगों के लिए
  rationale: यह दाऊद तथा उसके साथ उपस्थित लोगों—दोनों—को सामग्री दिए जाने का अर्थ स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: לֶאֱכֹל
  choice: खाने के लिए
  rationale: उद्देश्यसूचक infinitive का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: כִּי אָמְרוּ
  choice: क्योंकि उन्होंने कहा
  rationale: כִּי यहाँ सामग्री लाने का कारण प्रस्तुत करता है; ‘क्योंकि’ उसका स्पष्ट कारणसूचक बल रखता है।
- source_word: רָעֵב וְעָיֵף וְצָמֵא
  choice: भूखे, थके और प्यासे
  rationale: तीनों समानान्तर विशेषण बिना अनावश्यक तीव्रता जोड़े मूल की लय और अर्थ बनाए रखते हैं।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: מִדְבָּר निर्जन या विरल आबादी वाला वन्य प्रदेश दर्शाता है, केवल रेतीला मरुस्थल नहीं; हिन्दी बाइबिलीय और सामान्य प्रयोग में ‘जंगल’ यह व्यापक अर्थ दे सकता है।
