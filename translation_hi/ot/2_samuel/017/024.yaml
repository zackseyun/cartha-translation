translation:
  language: hi
  text: तब दाऊद महनैम पहुँचा, और अबशालोम तथा उसके साथ इस्राएल के सभी पुरुष यरदन पार कर गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּא
  choice: पहुँचा
  rationale: काल रूप में प्रयुक्त בוא यहाँ किसी गन्तव्य पर आने या पहुँचने को व्यक्त करता है; आधुनिक हिन्दी कथा में “पहुँचा” स्वाभाविक और सटीक है।
- source_word: מַחֲנָיְמָה
  choice: महनैम
  rationale: स्थान-नाम के साथ दिशासूचक ה गति को उस स्थान की ओर दिखाता है; हिन्दी में “महनैम पहुँचा” क्रिया के द्वारा ही यह दिशात्मक अर्थ स्वाभाविक रूप से व्यक्त हो जाता है।
- source_word: עָבַר אֶת־הַיַּרְדֵּן
  choice: यरदन पार किया
  rationale: עבר और प्रत्यक्ष कर्म “यरदन” यहाँ नदी को पार करने का स्पष्ट अर्थ देते हैं।
- source_word: הוּא וְכָל־אִישׁ יִשְׂרָאֵל עִמּוֹ
  choice: अपने साथ इस्राएल के सभी पुरुषों को लेकर
  rationale: यह स्वाभाविक हिन्दी में अबशालोम और उसके साथ गए इस्राएली पुरुषों—दोनों—को नदी पार करने का कर्ता बनाए रखता है। “पुरुषों” से אִישׁ का सामूहिक और व्याकरणतः पुल्लिंग संदर्भ सुरक्षित रहता है।
- source_word: וְ
  choice: तब / और
  rationale: पहला संयोजक कथा को आगे बढ़ाता है, इसलिए “तब”; दूसरा समानांतर घटना जोड़ता है, इसलिए “और” उपयुक्त है।
