  yaml_path: translation/ot/2_samuel/017/007.yaml
  text: Then Hushai said to Absalom[a], “The counsel that Ahithophel has given this time is not good.”
translation:
  language: hi
  text: तब हूशै ने अबशालोम से कहा, “इस बार[a] अहीतोपेल ने जो सलाह दी है, वह अच्छी नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस अवसर पर।”
    reason: इब्रानी पदबंध בַּפַּעַם הַזֹּאת का यह भी स्वाभाविक अर्थ है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इसके क्रमिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חוּשַׁי
  choice: हूशै
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: אֶל־אַבְשָׁלוֹם
  choice: अबशालोम से
  rationale: कहने की क्रिया के साथ हिन्दी में संबोधित व्यक्ति के लिए ‘से’ स्वाभाविक है।
- source_word: לֹא טוֹבָה
  choice: अच्छी नहीं है
  rationale: यह טוֹב के व्यापक और सीधे अर्थ को बनाए रखता है; ‘उचित नहीं’ या ‘सही नहीं’ रणनीतिक मूल्यांकन को अधिक संकीर्ण कर देते।
- source_word: הָעֵצָה
  choice: सलाह
  rationale: עֵצָה का अर्थ सलाह, सम्मति या योजना हो सकता है; यहाँ राजकीय-रणनीतिक परामर्श के संदर्भ में ‘सलाह’ सहज और स्पष्ट है।
- source_word: אֲשֶׁר יָעַץ
  choice: ने जो ... दी है
  rationale: इब्रानी में संज्ञा और उसी मूल की क्रिया का प्रयोग है; हिन्दी में ‘सलाह दी है’ स्वाभाविक रूप से पूर्ण कार्य और संबंधवाचक उपवाक्य दोनों को व्यक्त करता है।
- source_word: אֲחִיתֹפֶל
  choice: अहीतोपेल
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: בַּפַּעַם הַזֹּאת
  choice: इस बार
  rationale: यह पदबंध ‘इस बार’ या ‘इस अवसर पर’ का अर्थ देता है; ‘इस बार’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
