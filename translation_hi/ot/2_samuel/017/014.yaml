  text: וַ/יֹּ֤אמֶר אַבְשָׁלוֹם֙ וְ/כָל אִ֣ישׁ יִשְׂרָאֵ֔ל טוֹבָ֗ה עֲצַת֙ חוּשַׁ֣י הָ/אַרְכִּ֔י מֵ/עֲצַ֖ת אֲחִיתֹ֑פֶל וַ/יהוָ֣ה צִוָּ֗ה לְ/הָפֵ֞ר אֶת עֲצַ֤ת אֲחִיתֹ֨פֶל֙ הַ/טּוֹבָ֔ה לְ/בַ/עֲב֗וּר הָבִ֧יא יְהוָ֛ה אֶל אַבְשָׁל֖וֹם אֶת הָ/רָעָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/014.yaml
  text: Then Absalom and all the men of Israel said[a], “The counsel of Hushai the Archite is better than the counsel of Ahithophel.” For Yahweh had ordained to frustrate the good counsel of Ahithophel[b], so that Yahweh might bring disaster on Absalom.
translation:
  language: hi
  text: तब अबशालोम और इस्राएल के सभी पुरुषों ने कहा, “अर्की हूशै की सलाह अहीतोपेल की सलाह से अच्छी है।” क्योंकि यहोवा ने अहीतोपेल की अच्छी सलाह को निष्फल करने का ठहराया था,[a] ताकि यहोवा अबशालोम पर विपत्ति लाए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा ने आज्ञा दी थी कि अहीतोपेल की अच्छी सलाह निष्फल कर दी जाए।” इब्रानी क्रिया का सामान्य अर्थ “आज्ञा देना” है, पर यहाँ यह यहोवा के प्रभावकारी निर्धारण को भी व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: “विपत्ति” के लिए प्रयुक्त इब्रानी शब्द का अर्थ “बुराई,” “हानि” या “विनाश” भी हो सकता है; यहाँ इसका आशय अबशालोम पर आनेवाली विपत्ति से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְכָל אִישׁ יִשְׂרָאֵל
  choice: और इस्राएल के सभी पुरुषों
  rationale: אִישׁ एकवचन रूप में होते हुए यहाँ सामूहिक अर्थ रखता है; ‘सभी पुरुषों’ मूल की लिंग-स्पष्ट अभिव्यक्ति को बनाए रखता है।
- source_word: טוֹבָה
  choice: अच्छी है
  rationale: מֵעֲצַת के साथ तुलना निहित है; हिन्दी में ‘से अच्छी’ स्वाभाविक तुलनात्मक अभिव्यक्ति है।
- source_word: עֲצַת
  choice: सलाह
  rationale: עֵצָה यहाँ राजकीय और सामरिक परामर्श को दर्शाता है; ‘सलाह’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: חוּשַׁי הָאַרְכִּי
  choice: एरेकी हूशै
  rationale: व्यक्तिनाम और जातिवाचक उपाधि का हिन्दी लिप्यंतरण मूल रूप के निकट रखा गया है।
- source_word: צִוָּה
  choice: ठहराया था
  rationale: क्रिया का सामान्य अर्थ ‘आज्ञा देना’ है, पर इस प्रसंग में यह अहीतोपेल की सलाह के विषय में यहोवा के प्रभावकारी निर्धारण को व्यक्त करती है; वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: לְהָפֵר
  choice: विफल कर दिया जाए
  rationale: פרר का हिफ़ील रूप यहाँ किसी सलाह को निष्प्रभावी या असफल करने का अर्थ देता है।
- source_word: הַטּוֹבָה
  choice: अच्छी
  rationale: मूल पाठ स्वयं अहीतोपेल की सलाह को ‘अच्छी’ कहता है; इसे बनाए रखने से उसकी व्यावहारिक प्रभावशीलता और नैतिक उद्देश्य के बीच का तनाव अनसुलझा रहता है।
- source_word: לְבַעֲבוּר הָבִיא
  choice: ताकि ... लाए
  rationale: यह संरचना उद्देश्य अथवा लक्षित परिणाम व्यक्त करती है; ‘ताकि’ आधुनिक हिन्दी में दोनों संभावनाओं को स्वाभाविक रूप से वहन करता है।
- source_word: הָרָעָה
  choice: विपत्ति
  rationale: רָעָה का अर्थ बुराई, हानि या विपत्ति हो सकता है; यहाँ अबशालोम पर आनेवाले विनाशकारी न्याय के लिए ‘विपत्ति’ प्रसंगानुकूल है।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत वाचा-नाम है; हिन्दी के सामान्य और प्रतिष्ठित रूप ‘यहोवा’ द्वारा इसे उपाधि में बदले बिना व्यक्त किया गया है।
- issue: צִוָּה לְהָפֵר में परमेश्वर की क्रिया
  choice: ने ठहराया था कि ... विफल कर दिया जाए
  alternative: ने आज्ञा दी थी कि ... विफल कर दी जाए
  rationale: मुख्य पाठ प्रसंगगत प्रभावकारी निर्धारण को व्यक्त करता है, जबकि क्रिया का अधिक शाब्दिक ‘आज्ञा देना’ अर्थ पादटिप्पणी में सुरक्षित है; इससे दैवी प्रभुता को किसी विशेष धर्मवैज्ञानिक प्रणाली में सीमित नहीं किया जाता।
- issue: अहीतोपेल की सलाह का הַטּוֹבָה कहलाना
  choice: अच्छी सलाह
  alternative: कारगर सलाह
  rationale: ‘अच्छी’ मूल की खुली अभिव्यक्ति को सुरक्षित रखता है और यह स्पष्ट करने का प्रयास नहीं करता कि अच्छाई नैतिक है या सामरिक प्रभावशीलता की दृष्टि से।
- issue: परमेश्वर द्वारा הָרָעָה लाना
  choice: विपत्ति लाए
  alternative: बुराई लाए
  rationale: इस प्रसंग में शब्द अबशालोम पर आनेवाली हानि और विनाश को दर्शाता है, न कि अनिवार्यतः नैतिक बुराई को; ‘विपत्ति’ इसी न्यायात्मक परिणाम को स्पष्ट करता है।
