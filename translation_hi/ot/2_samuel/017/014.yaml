  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। राजकीय परामर्श के लिए ‘सलाह’ चुना गया है। वाक्य-संरचना मूल के कारणसूचक और उद्देश्यसूचक संबंधों को स्पष्ट रखते हुए हिन्दी में स्वाभाविक बनाई गई है।
