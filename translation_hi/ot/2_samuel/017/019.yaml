  yaml_path: translation/ot/2_samuel/017/019.yaml
  text: Then the woman took a covering and spread it over the mouth of the well[a], and scattered crushed grain on it[b], and the matter was not known.
translation:
  language: hi
  text: तब उस स्त्री ने एक आवरण लेकर उसे कुएँ के मुँह पर फैला दिया और उस पर कूटा हुआ अनाज बिखेर दिया; और किसी को कुछ पता नहीं चला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: उस स्त्री
  rationale: אִשָּׁה का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है; प्रसंग में घर की पहले उल्लिखित स्त्री अभिप्रेत है, इसलिए ‘उस स्त्री’ स्वाभाविक और कम व्याख्यात्मक है।
- source_word: הַמָּסָךְ
  choice: एक ओढ़ना
  rationale: מָסָךְ किसी आवरण, परदे या ढकने की वस्तु को दर्शाता है। यहाँ कुएँ को छिपाने के लिए फैलाए जा सकने वाले आवरण के अर्थ में ‘ओढ़ना’ सहज है, यद्यपि उसकी सामग्री निश्चित नहीं है।
- source_word: עַל פְּנֵי הַבְּאֵר
  choice: कुएँ के मुँह पर
  rationale: शाब्दिक अर्थ ‘कुएँ के मुख/सतह पर’ है; हिन्दी में कुएँ के खुले भाग के लिए ‘मुँह’ स्पष्ट और मुहावरेदार है।
- source_word: וַתִּשְׁטַח
  choice: बिखेर दिया
  rationale: שטח का मूल भाव फैलाने का है; कूटे हुए अनाज को आवरण पर डालकर छिपाने के प्रसंग में ‘बिखेर दिया’ स्वाभाविक है।
- source_word: הָרִפוֹת
  choice: कूटा हुआ अनाज
  rationale: दुर्लभ संज्ञा רִפוֹת कूटे या दरदरे किए हुए अन्न-उत्पाद को सूचित करती है; यह अनुवाद कृषि-संबंधी विवरण को साधारण आधुनिक हिन्दी में बनाए रखता है।
- source_word: וְלֹא נוֹדַע דָּבָר
  choice: इस तरह किसी को कुछ पता नहीं चला
  rationale: शाब्दिक रूप ‘और कोई बात ज्ञात नहीं हुई’ है। प्रसंग में छिपाव का पता न चलना अभिप्रेत है; चुना हुआ रूप हिन्दी में स्वाभाविक है, पर कारणसूचक संबंध को हल्के रूप से स्पष्ट करता है।
theological_decisions: []
