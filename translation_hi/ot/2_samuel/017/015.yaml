lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमागत कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम का क्रम स्वाभाविक रूप से व्यक्त करता है।
- source_word: חוּשַׁי
  choice: हूशै
  rationale: इब्रानी नाम का निकट देवनागरी लिप्यंतरण।
- source_word: אֶל צָדוֹק וְאֶל אֶבְיָתָר הַכֹּהֲנִים
  choice: सादोक और एब्यातार याजकों से
  rationale: ‘याजकों’ को दोनों नामों का समानाधिकरण रखते हुए हिन्दी में सहज वाक्य-विन्यास अपनाया गया है।
- source_word: כָּזֹאת וְכָזֹאת
  choice: यह-यह
  rationale: यह इब्रानी मुहावरा कही गई बात को शब्दशः दोहराए बिना उसका आशय बताता है; ‘यह-यह’ समान अनिश्चित सार-सूचक अर्थ को संक्षेप में बनाए रखता है।
- source_word: יָעַץ
  choice: सलाह दी
  rationale: राजनीतिक और रणनीतिक संदर्भ में यह स्वाभाविक आधुनिक हिन्दी है और परामर्श देने का अर्थ स्पष्ट करती है।
- source_word: אֶת אַבְשָׁלֹם וְאֵת זִקְנֵי יִשְׂרָאֵל
  choice: अबशालोम और इस्राएल के पुरनियों को
  rationale: हिन्दी में ‘सलाह देना’ के साथ ‘को’ लगाकर सलाह पाने वालों का संबंध स्पष्ट किया गया है।
- source_word: יָעַצְתִּי אָנִי
  choice: मैंने ... सलाह दी है
  rationale: स्वतंत्र सर्वनाम אָנִי के जोर को स्पष्ट ‘मैंने’ से रखा गया है; ‘दी है’ हाल में दी गई और वर्तमान प्रसंग में प्रासंगिक सलाह को दर्शाता है।
