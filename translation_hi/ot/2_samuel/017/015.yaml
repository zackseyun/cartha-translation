  text: तब हूशै ने याजक सादोक और याजक एब्यातार से कहा, “अहीतोपेल ने अबशालोम और इस्राएल के बुज़ुर्गों को ऐसी-ऐसी सलाह दी[a], और मैंने ऐसी-ऐसी सलाह दी है।”
  philosophy: optimal-equivalence
  footnotes:
