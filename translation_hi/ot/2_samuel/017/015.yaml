revisions:
- from: तब हूशै ने सादोक और एब्यातार याजकों से कहा, “अहीतोपेल ने अबशालोम और इस्राएल के पुरनियों को यह-यह सलाह दी है, और मैंने यह-यह सलाह दी है।”[a]
  to: तब हूशै ने याजक सादोक और याजक एब्यातार से कहा, “अहीतोपेल ने अबशालोम और इस्राएल के बुज़ुर्गों को ऐसी-ऐसी सलाह दी[a], और मैंने ऐसी-ऐसी सलाह दी है।”
  rationale: Revision is needed chiefly for the Hebrew idiom. “ऐसी-ऐसी” is a natural, non-specific Hindi formulation that does not falsely supply the contents of either counsel. The revision also clarifies that both Zadok and Abiathar are priests and uses modern Hindi “बुज़ुर्गों.” The footnote anchor is placed at the first occurrence of the idiom it explains.
  reviewer_model: gpt-5.6-terra
