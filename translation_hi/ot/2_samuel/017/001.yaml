lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲחִיתֹפֶל
  choice: अहीतोपेल
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֶל אַבְשָׁלֹם
  choice: अबशालोम से
  rationale: ‘कहा’ के साथ हिन्दी में संबोधित व्यक्ति के लिए ‘से’ स्वाभाविक है; नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: אֶבְחֲרָה נָּא
  choice: कृपया मुझे ... चुनने दें
  rationale: कोहोर्टेटिव और נָא विनम्र अनुरोध या प्रस्ताव व्यक्त करते हैं; यह हिन्दी में उसी भाव का स्वाभाविक रूप है।
- source_word: שְׁנֵים עָשָׂר אֶלֶף אִישׁ
  choice: बारह हज़ार पुरुष
  rationale: शाब्दिक अर्थ को सुरक्षित रखता है और इब्रानी से अधिक विशिष्ट सैन्य पद नहीं जोड़ता, यद्यपि प्रसंग सैन्य है।
- source_word: וְאָקוּמָה
  choice: मैं ... उठकर
  rationale: קוּם के ‘उठना’ वाले चित्र को बनाए रखते हुए आगामी तत्काल कार्य से स्वाभाविक रूप से जोड़ा गया है।
- source_word: וְאֶרְדְּפָה אַחֲרֵי דָוִד
  choice: दाऊद का पीछा करूँ
  rationale: רדף और אַחֲרֵי का संयुक्त भाव हिन्दी के स्वाभाविक मुहावरे ‘का पीछा करना’ से व्यक्त होता है।
- source_word: הַלָּיְלָה
  choice: आज रात
  rationale: संदर्भ में वर्तमान रात का संकेत है; आधुनिक हिन्दी में यही स्वाभाविक समतुल्य है।
