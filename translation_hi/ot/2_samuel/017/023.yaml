base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/023.yaml
  text: When Ahithophel saw that his counsel had not been followed[a], he saddled the donkey, arose, and went to his house in his city. He gave orders to his household, then hanged himself and died[c][b]; and he was buried in his father's tomb.
translation:
  language: hi
  text: जब अहीतोपेल ने देखा कि उसकी सलाह पर अमल नहीं किया गया[a], तब उसने गधे पर काठी कसी, उठकर अपने नगर में अपने घर गया। उसने अपने घराने को निर्देश दिए[b], फिर फाँसी लगाकर अपनी जान दे दी[c]। उसे उसके पिता की कब्र में दफनाया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसकी सलाह नहीं की गई”; अर्थात उसकी सलाह को कार्यान्वित नहीं किया गया।
    reason: lexical_alternative
  - marker: b
    text: या, “उसने अपने घर का प्रबंध किया।” इब्रानी में अधिक शाब्दिक अर्थ है, “उसने अपने घर/घराने को निर्देश दिए।”
    reason: lexical_alternative
  - marker: c
    text: या, “उसने अपना गला घोंट लिया और मर गया।” इब्रानी क्रिया फाँसी लगाने या गला घोंटने से मृत्यु को सूचित कर सकती है; यहाँ प्रसंग आत्महत्या का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָתוֹ ... לֹא נֶעֶשְׂתָה
  choice: उसकी सलाह पर अमल नहीं किया गया
  rationale: עֵצָה यहाँ राजनीतिक-रणनीतिक सलाह है और נֶעֶשְׂתָה का शाब्दिक अर्थ ‘नहीं की गई’ है; हिंदी मुहावरे में ‘सलाह पर अमल नहीं किया गया’ दोनों भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיַּחֲבֹשׁ אֶת־הַחֲמוֹר
  choice: उसने गधे पर काठी कसी
  rationale: חבש सवारी के लिए पशु पर काठी कसने को दर्शाता है। הַחֲמוֹר निश्चित है, पर उसमें स्वामित्व-सूचक प्रत्यय नहीं है, इसलिए ‘अपने गधे’ नहीं जोड़ा गया।
- source_word: וַיָּקָם וַיֵּלֶךְ אֶל־בֵּיתוֹ אֶל־עִירוֹ
  choice: उठकर अपने नगर में अपने घर गया
  rationale: क्रमिक क्रियाओं और दोनों गंतव्य-सूचकों को सहज आधुनिक हिंदी में बनाए रखा गया है।
- source_word: וַיְצַו אֶל־בֵּיתוֹ
  choice: उसने अपने घराने को निर्देश दिए
  rationale: צוה אל का निकट अर्थ आदेश या निर्देश देना है और בֵּיתוֹ यहाँ घराने/परिवार को सूचित कर सकता है। ‘अपने घर का प्रबंध किया’ संभावित आशय है, पर मूल से अधिक व्याख्यात्मक है।
- source_word: וַיֵּחָנַק וַיָּמָת
  choice: फाँसी लगाकर अपनी जान दे दी
  rationale: חנק मूलतः गला घुटने/घोंटने से मरने को दर्शाता है; प्रसंग में निफ़अल रूप आत्महत्या का संकेत देता है। हिंदी में ‘फाँसी लगाकर अपनी जान दे दी’ आत्महत्या और परिणामी मृत्यु दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּקֶבֶר אָבִיו
  choice: उसके पिता की कब्र में
  rationale: קֶבֶר का अर्थ कब्र या समाधि हो सकता है; ‘पिता की कब्र’ संबंध को बिना ‘पैतृक कब्रिस्तान’ जैसी अतिरिक्त व्याख्या के बनाए रखता है।
theological_decisions:
- issue: अहीतोपेल की मृत्यु की कर्तृवाच्यता और विधि
  choice: फाँसी लगाकर अपनी जान दे दी
  alternative: उसका गला घुट गया और वह मर गया / उसने अपना गला घोंट लिया
  rationale: व्याकरणिक रूप अकेले कुछ अस्पष्टता रखता है, किंतु कथा-संदर्भ आत्महत्या बताता है। पादटिप्पणी में ‘गला घोंट लिया’ का अधिक शाब्दिक विकल्प सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘घराना’, ‘निर्देश’, ‘काठी कसी’ और ‘दफनाया गया’ सामान्य पाठक के लिए स्पष्ट हैं। मूल की क्रमिकता रखी गई है, पर अनावश्यक रूप से संस्कृतनिष्ठ या शाब्दिक वाक्य-विन्यास से बचा गया है।
