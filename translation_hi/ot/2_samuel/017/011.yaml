base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/011.yaml
  text: But I advise that all Israel be surely gathered to you[a], from Dan to Beersheba, as numerous as the sand that is by the sea, and that you yourself go into battle.
translation:
  language: hi
  text: पर मेरी सलाह है कि दान से लेकर बेर्शेबा तक का, समुद्र-किनारे की रेत के समान असंख्य, समस्त इस्राएल निश्चय ही आपके पास इकट्ठा किया जाए, और आप स्वयं युद्ध में जाएँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “और आपका मुख युद्ध में जाता हुआ”; यह मुहावरा बताता है कि आप स्वयं युद्ध में जाकर नेतृत्व करें।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: पर
  rationale: पूर्ववर्ती योजना के विपरीत हूशै की सलाह प्रस्तुत होने के कारण यहाँ संबंधसूचक अव्यय का विरोधात्मक बल है।
- source_word: יָעַצְתִּי
  choice: मेरी सलाह है
  rationale: क्रिया יעץ के परामर्श देने वाले वाक्-बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הֵאָסֹף יֵאָסֵף
  choice: निश्चय ही ... इकट्ठा किया जाए
  rationale: धातु के infinitive absolute और finite verb का संयोजन क्रिया पर बल देता है; ‘निश्चय ही’ उस तीव्रता को बनाए रखता है।
- source_word: עָלֶיךָ
  choice: आपके पास
  rationale: אסף के साथ על किसी नेता के पास अथवा उसके चारों ओर एकत्र होने का भाव दे सकता है; हिन्दी में ‘आपके पास’ स्वाभाविक है और अस्पष्टता को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: כָל יִשְׂרָאֵל
  choice: समस्त इस्राएल
  rationale: पूरे राष्ट्र अथवा उसकी सैन्य शक्ति को समष्टिगत रूप में व्यक्त करने वाली उक्ति है।
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: दान से लेकर बेर्शेबा तक
  rationale: इस्राएल के समूचे भूभाग को सूचित करने वाला पारंपरिक भौगोलिक युग्म है।
- source_word: כַּחוֹל אֲשֶׁר עַל הַיָּם לָרֹב
  choice: समुद्र के किनारे की रेत के समान असंख्य
  rationale: मूल के समुद्री रेत वाले बिंब और अत्यधिक संख्या, दोनों को सहज हिन्दी में सुरक्षित रखता है।
- source_word: וּפָנֶיךָ הֹלְכִים
  choice: और आप स्वयं ... जाएँ
  rationale: शाब्दिक ‘और आपका मुख जा रहा’ यहाँ व्यक्ति की निजी उपस्थिति का मुहावरा है; ‘आप स्वयं’ अबशालोम के व्यक्तिगत रूप से जाने पर बल देता है।
- source_word: בַּקְרָב
  choice: युद्ध में
  rationale: קרב यहाँ लड़ाई अथवा युद्ध को सूचित करता है; ‘युद्ध में जाएँ’ प्रसंगानुकूल और स्वाभाविक है।
