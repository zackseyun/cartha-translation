base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/006.yaml
  text: When Hushai came to Absalom[a], Absalom said to him, “Ahithophel has spoken in this way. Should we do as he says? If not, you speak.”
translation:
  language: hi
  text: जब हूशै अबशालोम के पास आया, तब अबशालोम ने उससे कहा, “अहीतोपेल ने इस प्रकार कहा है। क्या हम उसकी बात पर अमल करें?[a] यदि नहीं, तो तुम बताओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “क्या हम उसकी बात को करें?” अर्थात अहीतोपेल की सलाह को कार्यान्वित करें।
    reason: मूल हिब्रू मुहावरे के अधिक शाब्दिक रूप और उसके आशय को दर्ज करना।
lexical_decisions:
- source_word: וַיָּבֹא חוּשַׁי אֶל־אַבְשָׁלוֹם
  choice: जब हूशै अबशालोम के पास आया
  rationale: בוא और אֶל की दिशात्मकता को स्वाभाविक हिन्दी कथन में व्यक्त करता है; व्यक्तिनामों का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: וַיֹּאמֶר ... לֵאמֹר
  choice: ने उससे कहा
  rationale: हिब्रू के दोहरे वचन-परिचय को हिन्दी में अनावश्यक रूप से दोहराए बिना सहज संवाद-भूमिका दी गई है।
- source_word: כַּדָּבָר הַזֶּה דִּבֶּר אֲחִיתֹפֶל
  choice: अहीतोपेल ने इस प्रकार कहा है
  rationale: प्रदर्शनवाचक भाव और अभी विचाराधीन पूर्व कथन—दोनों सुरक्षित रहते हैं; ‘सलाह दी है’ संदर्भानुकूल होता, पर मूल से अधिक स्पष्ट व्याख्या जोड़ता।
- source_word: הֲנַעֲשֶׂה אֶת־דְּבָרוֹ
  choice: क्या हम उसकी बात पर अमल करें?
  rationale: शाब्दिक ‘उसकी बात को करें’ हिन्दी में अस्वाभाविक है। ‘बात पर अमल करना’ परामर्श को कार्यान्वित करने का स्वाभाविक और अर्थ-संगत रूप है।
- source_word: אִם־אַיִן אַתָּה דַבֵּר
  choice: यदि नहीं, तो तुम बताओ
  rationale: אִם אַיִן का संक्षिप्त वैकल्पिक भाव ‘यदि नहीं’ से और स्वतंत्र सर्वनाम אַתָּה का बल ‘तुम’ से बना रहता है; ‘बताओ’ इस परामर्श-संदर्भ में स्वाभाविक हिन्दी है।
