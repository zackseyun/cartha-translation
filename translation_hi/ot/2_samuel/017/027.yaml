  text: וַ/יְהִ֕י כְּ/ב֥וֹא דָוִ֖ד מַחֲנָ֑יְמָ/ה וְ/שֹׁבִ֨י בֶן נָחָ֜שׁ מֵ/רַבַּ֣ת בְּנֵֽי עַמּ֗וֹן וּ/מָכִ֤יר בֶּן עַמִּיאֵל֙ מִ/לֹּ֣א דְבָ֔ר וּ/בַרְזִלַּ֥י הַ/גִּלְעָדִ֖י מֵ/רֹגְלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/027.yaml
  text: When David came to Mahanaim, Shobi son of Nahash from Rabbah of the Ammonites, and Machir son of Ammiel from Lo-debar, and Barzillai the Gileadite from Rogelim,
translation:
  language: hi
  text: जब दाऊद महनैम पहुँचा, तब अम्मोनियों के रब्बा नगर से नाहाश का पुत्र शोबी, लो-दबार से अम्मीएल का पुत्र माकीर, और रोगलीम से गिलादी बरजिल्लै,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּבוֹא
  choice: जब ... पहुँचा, तब
  rationale: वाव-क्रम और כְּ के साथ infinitive construct यहाँ नई कथात्मक घटना तथा समय-संबंध व्यक्त करते हैं। हिंदी में ‘जब...तब’ स्वाभाविक रूप से मुख्य कथन की ओर ले जाता है; पद 27 का वाक्य पद 28 में पूरा होता है।
- source_word: מַחֲנָיְמָה
  choice: महनैम पहुँचा
  rationale: स्थानवाचक नाम के साथ दिशासूचक ה गति को व्यक्त करता है; हिंदी में ‘महनैम पहुँचा’ स्वाभाविक है।
- source_word: שֹׁבִי בֶן נָחָשׁ
  choice: नाहाश का पुत्र शोबी
  rationale: व्यक्तिनामों का देवनागरी लिप्यंतरण और patronymic का सामान्य हिंदी क्रम रखा गया है।
- source_word: מֵרַבַּת בְּנֵי עַמּוֹן
  choice: अम्मोनियों के रब्बा नगर से
  rationale: רַבָּה नगर का नाम है और בְּנֵי עַמּוֹן जातीय-राजनीतिक पहचान; ‘नगर’ जोड़ने से बिना अर्थ बदले हिंदी पाठक के लिए संबंध स्पष्ट होता है।
- source_word: וּמָכִיר בֶּן עַמִּיאֵל
  choice: अम्मीएल का पुत्र माकीर
  rationale: नामों को लिप्यंतरित किया गया है और संबंधसूचक संरचना स्वाभाविक हिंदी में दी गई है।
- source_word: מִלֹּא דְבָר
  choice: लो-दबार से
  rationale: स्थाननाम को पारंपरिक ध्वनि के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: וּבַרְזִלַּי הַגִּלְעָדִי
  choice: गिलादी बरजिल्लै
  rationale: הַגִּלְעָדִי क्षेत्रीय पहचान बताता है; ‘गिलादी’ संक्षिप्त और बाइबिलीय हिंदी में सुबोध है।
- source_word: מֵרֹגְלִים
  choice: रोगलीम से
  rationale: स्थाननाम का ध्वन्यात्मक देवनागरी लिप्यंतरण किया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। मूल पद की अधूरी सूची-संरचना सुरक्षित रखी गई है, क्योंकि उसका क्रियात्मक निष्कर्ष अगले पद में आता है। नामों के लिए प्रचलित हिंदी बाइबिलीय रूपों के निकट लिप्यंतरण अपनाया गया है।
