  text: הִנֵּ֨ה עַתָּ֤ה הֽוּא נֶחְבָּא֙ בְּ/אַחַ֣ת הַ/פְּחָתִ֔ים א֖וֹ בְּ/אַחַ֣ד הַ/מְּקוֹמֹ֑ת וְ/הָיָ֗ה כִּ/נְפֹ֤ל בָּ/הֶם֙ בַּ/תְּחִלָּ֔ה וְ/שָׁמַ֤ע הַ/שֹּׁמֵ֨עַ֙ וְ/אָמַ֔ר הָֽיְתָה֙ מַגֵּפָ֔ה בָּ/עָ֕ם אֲשֶׁ֖ר אַחֲרֵ֥י אַבְשָׁלֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/009.yaml
  text: Look[a], right now he is hidden in one of the pits or in one of the other places. And when some of them fall at the first attack, whoever hears it will say[b], ‘There has been a slaughter among the people who follow Absalom.’
translation:
  language: hi
  text: देखो, इस समय वह गड्ढों में से किसी एक में या किसी और जगह छिपा हुआ है। और जब शुरुआत में उनमें से कुछ लोग मारे जाएँगे, तो जो कोई यह सुनेगा, वह कहेगा, ‘अबशालोम के अनुयायियों में मारकाट मच गई है।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה עַתָּה
  choice: देखो, इस समय
  rationale: הִנֵּה की ध्यान आकर्षित करने वाली जीवंतता को ‘देखो’ और עַתָּה की तात्कालिकता को स्वाभाविक आधुनिक हिन्दी में ‘इस समय’ व्यक्त करता है।
- source_word: נֶחְבָּא
  choice: छिपा हुआ है
  rationale: निफ़अल रूप अवस्था पर बल देता है और यह तय नहीं करता कि उसने स्वयं को छिपाया या किसी ने उसे छिपाया; ‘छिपा हुआ है’ इस अनिर्धारित कर्तृत्व को बनाए रखता है।
- source_word: בְּאַחַת הַפְּחָתִים
  choice: किसी गड्ढे में
  rationale: פְּחָתִים भूभाग के गड्ढों, खोखलों या धँसी जगहों को सूचित कर सकता है। मुख्य पाठ में ‘गड्ढे’ सहज है और वैकल्पिक भू-आकृतिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: בְּאַחַד הַמְּקוֹמֹת
  choice: किसी और जगह
  rationale: אוֹ के साथ यह पहली संभावित छिपने की जगह के विपरीत एक व्यापक वैकल्पिक स्थान बताता है।
- source_word: כִּנְפֹל בָּהֶם בַּתְּחִלָּה
  choice: यदि पहले ही हमले में उनमें से कुछ लोग मारे जाएँ
  rationale: युद्ध-संदर्भ में נפל ב समूह के भीतर हताहत होने का संकेत देता है; בַּתְּחִלָּה आरम्भिक मुठभेड़ को दर्शाता है। ‘यदि’ कथन के आशंकित परिणाम को हिन्दी में स्वाभाविक बनाता है।
- source_word: הַשֹּׁמֵעַ
  choice: जो कोई यह सुनेगा
  rationale: संज्ञीकृत कृदन्त का सामान्य और अनिश्चित अर्थ आधुनिक हिन्दी में ‘जो कोई’ से स्पष्ट होता है।
- source_word: מַגֵּפָה
  choice: मारकाट
  rationale: यहाँ शब्द रोग-महामारी नहीं बल्कि युद्ध में भारी प्रहार या जनहानि बताता है। ‘मारकाट’ सैन्य जनहानि की गंभीरता व्यक्त करता है, जबकि ‘हार’ भी संभव है।
- source_word: הָעָם אֲשֶׁר אַחֲרֵי אַבְשָׁלֹם
  choice: अबशालोम के पीछे चलनेवाले लोग
  rationale: אַחֲרֵי यहाँ स्थानिक पीछा नहीं, बल्कि निष्ठा और नेतृत्व-अनुसरण व्यक्त करता है।
