base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/022.yaml
  text: Then David arose[a], and all the people who were with him, and they crossed the Jordan. By morning light, not one was missing who had not crossed the Jordan.
translation:
  language: hi
  text: तब दाऊद और जो लोग उसके साथ थे, वे सभी उठे और यरदन पार कर गए। भोर की रोशनी तक एक भी व्यक्ति ऐसा नहीं था जिसने यरदन पार न किया हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठे
  rationale: קום के सामान्य अर्थ ‘उठना’ को बनाए रखता है और प्रसंग में आगे की यात्रा के लिए उठ खड़े होने का स्वाभाविक संकेत देता है; ‘चल पड़े’ अधिक व्याख्यात्मक होता।
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: और उसके साथ के सब लोग
  rationale: הָעָם पूरे साथ चल रहे समूह को दर्शाता है, इसलिए लिंग-विशिष्ट ‘पुरुष’ के बजाय ‘लोग’ उपयुक्त है।
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: और यरदन पार कर गए
  rationale: עבר के प्रत्यक्ष कर्म ‘यरदन’ के साथ सरल और स्वाभाविक हिन्दी अनुवाद है; ‘कर गए’ पार करने की पूर्णता स्पष्ट करता है।
- source_word: עַד אוֹר הַבֹּקֶר
  choice: सुबह का उजाला होने तक
  rationale: עַד का समयबोध और אוֹר הַבֹּקֶר की ‘सुबह के उजाले’ वाली छवि दोनों सुरक्षित रहते हैं, साथ ही यह उस समय-सीमा को बताता है जिसके भीतर पार उतरना पूरा हुआ।
- source_word: עַד אַחַד לֹא נֶעְדָּר
  choice: उनमें से एक भी ऐसा नहीं था
  rationale: हिब्रू मुहावरे का आशय है कि कोई भी पीछे या अनुपस्थित नहीं रहा। यह हिन्दी में सहज रूप से अगले सम्बन्धवाचक उपवाक्य से जुड़ता है।
- source_word: אֲשֶׁר לֹא עָבַר אֶת הַיַּרְדֵּן
  choice: जिसने यरदन पार न किया हो
  rationale: 'मूल के निषेधात्मक सम्बन्धवाचक वाक्य को बनाए रखता है: एक भी व्यक्ति ऐसा नहीं था जिसने पार न किया हो।'
