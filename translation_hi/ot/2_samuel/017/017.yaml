base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/017.yaml
  text: Jonathan and Ahimaaz were standing at En-rogel[a], and a female servant would go and tell them, and they would go and tell King David[b], for they could not be seen entering the city.
translation:
  language: hi
  text: योनातान और अहीमास ऐन-रोगेल में ठहरे हुए थे[a]। वह दासी[b] जाकर उन्हें समाचार देती थी, और वे जाकर राजा दाऊद को समाचार देते थे, क्योंकि वे नगर में प्रवेश करते हुए दिखाई नहीं दे सकते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “खड़े हुए थे”; प्रसंग में इसका अर्थ वहाँ ठहरे या तैनात रहना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द विशेष रूप से किसी स्त्री सेविका या दासी को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמְדִים
  choice: ठहरे हुए थे
  rationale: עמד का मूल अर्थ ‘खड़ा होना’ है, पर किसी स्थान के साथ यह वहाँ बने रहने या तैनात रहने का भाव भी दे सकता है। प्रसंग में ‘ठहरे हुए थे’ उनकी निरंतर स्थिति को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּעֵין רֹגֵל
  choice: ऐन-रोगेल के पास
  rationale: यह स्थान-नाम है; इसे अनूदित करने के बजाय देवनागरी में लिप्यंतरित किया गया है। בְ का स्थानीय भाव यहाँ ‘के पास’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: הַשִּׁפְחָה
  choice: वह दासी
  rationale: שִׁפְחָה विशेष रूप से स्त्री सेविका या दासी को दर्शाता है। निश्चित उपपद को ध्यान में रखते हुए ‘वह दासी’ रखा गया है।
- source_word: וְהָלְכָה וְהִגִּידָה לָהֶם
  choice: जाकर उन्हें समाचार देती थी
  rationale: वर्णित संचार-व्यवस्था की नियमित या निर्धारित क्रिया को हिन्दी के अभ्यस्त भूतकाल ‘देती थी’ से व्यक्त किया गया है। נגד के हिफ़ील रूप के लिए प्रसंगानुकूल ‘समाचार देना’ चुना गया है।
- source_word: וְהֵם יֵלְכוּ וְהִגִּידוּ
  choice: वे जाकर ... समाचार देते थे
  rationale: 'यह अगली कड़ी की नियमित प्रक्रिया बताता है: संदेश पाकर वे उसे दाऊद तक पहुँचाते थे।'
- source_word: לַמֶּלֶךְ דָּוִד
  choice: राजा दाऊद को
  rationale: उपाधि और नाम का यह क्रम आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כִּי לֹא יוּכְלוּ לְהֵרָאוֹת לָבוֹא הָעִירָה
  choice: क्योंकि वे नगर में प्रवेश करते हुए दिखाई नहीं दे सकते थे
  rationale: כִּי कारण बताता है; ראה का निफ़ाल ‘दिखाई देना’ और दिशासूचक ה वाला הָעִירָה नगर की ओर/नगर में प्रवेश को दर्शाता है। स्रोत के सामर्थ्यसूचक रूप को ‘नहीं दे सकते थे’ से बनाए रखा गया है।
