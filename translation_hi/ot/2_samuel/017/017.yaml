translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण कथात्मक शैली रखी गई है। संचार की नियमित व्यवस्था दिखाने के लिए ‘देती थी/देते थे’ का प्रयोग किया गया है। व्यक्तिनामों को प्रचलित हिन्दी बाइबलीय रूपों में लिप्यंतरित किया गया है।
