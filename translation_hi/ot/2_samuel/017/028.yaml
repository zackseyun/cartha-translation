lexical_decisions:
- source_word: מִשְׁכָּב
  choice: बिछौने
  rationale: यह संज्ञा लेटने की जगह या वस्तु को दर्शाती है। सामग्री की इस सूची में सामूहिक अर्थ वाला “बिछौने” स्वाभाविक है और हिब्रू के एकवचन रूप को अनावश्यक रूप से कठोर नहीं बनाता।
- source_word: סַפּוֹת
  choice: कटोरे
  rationale: शब्द घरेलू उपयोग के कटोरों या तसलों जैसे पात्रों को सूचित करता है। “कटोरे” आधुनिक हिन्दी में स्पष्ट है; निकट विकल्प पाद-टिप्पणी में रखा गया है।
- source_word: כְלִי יוֹצֵר
  choice: मिट्टी के बरतन
  rationale: शाब्दिक अर्थ “कुम्हार के बरतन” है। “मिट्टी के बरतन” पदार्थ और वस्तु दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: חִטִּים
  choice: गेहूँ
  rationale: इस अनाज का मानक हिन्दी नाम।
- source_word: שְׂעֹרִים
  choice: जौ
  rationale: इस अनाज का मानक हिन्दी नाम।
- source_word: קֶמַח
  choice: आटा
  rationale: यह पिसे हुए अनाज को दर्शाता है; हिन्दी में “आटा” सबसे स्वाभाविक और स्पष्ट समतुल्य है।
- source_word: קָלִי
  choice: भुना हुआ अनाज
  rationale: यह आग में भूनकर तैयार किए गए अनाज को दर्शाता है। दोनों occurrences में एक ही अनुवाद रखकर हिब्रू की वास्तविक पुनरावृत्ति सुरक्षित की गई है।
- source_word: פּוֹל
  choice: सेम
  rationale: यह एक प्रकार की फली, सम्भवतः बाकला (फावा/broad bean), को दर्शाता है। मुख्य पाठ में परिचित व्यापक शब्द रखा गया है और अधिक विशिष्ट अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: עֲדָשִׁים
  choice: मसूर
  rationale: इस दलहन का मानक हिन्दी नाम।
