translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली रखी गई है। अबशालोम के लिए एकवचन ‘तुम’ प्रयोग किया गया है, जो ‘तू’ की अपेक्षा आधुनिक पाठकों के लिए कम कठोर है। इब्रानी की भावात्मक तीव्रता को ‘मन कड़वाहट से भरे हैं’ में बनाए रखा गया है, और अस्पष्टताओं को पादटिप्पणियों में सुरक्षित रखा गया है।
