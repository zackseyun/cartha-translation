source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חוּשַׁ֗י אַתָּ֣ה יָ֠דַעְתָּ אֶת אָבִ֨י/ךָ וְ/אֶת אֲנָשָׁ֜י/ו כִּ֧י גִבֹּרִ֣ים הֵ֗מָּה וּ/מָרֵ֥י נֶ֨פֶשׁ֙ הֵ֔מָּה כְּ/דֹ֥ב שַׁכּ֖וּל בַּ/שָּׂדֶ֑ה וְ/אָבִ֨י/ךָ֙ אִ֣ישׁ מִלְחָמָ֔ה וְ/לֹ֥א יָלִ֖ין אֶת הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/008.yaml
  text: Hushai said[a], “You know your father and his men, that they are mighty men and bitter of soul, like a bear robbed of her cubs in the field. And your father is a man of war[b]; he will not spend the night with the troops.”
translation:
  language: hi
  text: हूशै ने कहा, “तुम अपने पिता और उसके आदमियों को जानते हो। वे शूरवीर हैं और उनके मन कड़वाहट से भरे हैं[a], मैदान में अपने बच्चों से वंचित मादा भालू के समान। तुम्हारा पिता युद्ध का अनुभवी व्यक्ति है; वह सैनिकों के साथ रात नहीं बिताएगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वे उग्र हैं” अथवा “वे भड़के हुए हैं”; शाब्दिक रूप से, “मन/प्राण के कड़वे।”
    reason: मूल इब्रानी मुहावरे की शाब्दिक छवि तथा उसके प्रसंगगत अर्थ—कटु, उग्र या भड़की हुई मनःस्थिति—को सुरक्षित रखने के लिए।
  - marker: b
    text: या “वह लोगों के साथ रात नहीं बिताएगा।” यहाँ “लोग” से सम्भवतः दाऊद के साथ की लड़ाकू टुकड़ी का आशय है।
    reason: הָעָם का शाब्दिक अर्थ ‘लोग’ है, पर इस सैनिक प्रसंग में यह दाऊद के साथ के लड़ाकों को सूचित कर सकता है।
lexical_decisions:
- source_word: גִבֹּרִים
  choice: शूरवीर
  rationale: यह शब्द सामर्थ्य और रण-पराक्रम को सूचित करता है; प्रसंग सैनिकों का है, इसलिए ‘शूरवीर’ स्वाभाविक और सटीक है।
- source_word: מָרֵי נֶפֶשׁ
  choice: उनके मन कड़वाहट से भरे हैं
  rationale: यह अभिव्यक्ति इब्रानी के ‘मन/प्राण की कड़वाहट’ वाले बिंब को बनाए रखते हुए आधुनिक हिन्दी में समझने योग्य है और उनकी उग्र मनःस्थिति प्रकट करती है।
- source_word: כְּדֹב שַׁכּוּל
  choice: अपने बच्चों से वंचित रीछनी के समान
  rationale: यह तुलना बच्चों को खो चुकी मादा रीछ की खतरनाक उग्रता का चित्र प्रस्तुत करती है; ‘वंचित’ यह खुला छोड़ता है कि बच्चे मारे गए, खो गए या छीन लिए गए।
- source_word: בַּשָּׂדֶה
  choice: मैदान में
  rationale: स्थानसूचक पद का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: אִישׁ מִלְחָמָה
  choice: युद्ध-कुशल व्यक्ति
  rationale: यह दाऊद को युद्ध में अनुभवी और निपुण व्यक्ति के रूप में चित्रित करता है; हिन्दी में यह ‘युद्ध का पुरुष’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: לֹא יָלִין אֶת־הָעָם
  choice: वह सैनिकों के साथ रात नहीं बिताएगा
  rationale: לין का अर्थ रात बिताना या ठहरना है। इस सैनिक प्रसंग में הָעָם दाऊद के साथ चलनेवाले लड़ाकों को सूचित करता है, इसलिए ‘सैनिकों’ से आशय स्पष्ट होता है।
- source_word: יָדַעְתָּ
  choice: तुम ... जानते हो
  rationale: एकवचन संबोधन को आधुनिक, सामान्य हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲנָשָׁיו
  choice: उसके आदमी
  rationale: मूल का सीधा अर्थ बनाए रखता है; प्रसंग से स्पष्ट है कि ये दाऊद के साथ रहनेवाले लड़ाके हैं।
