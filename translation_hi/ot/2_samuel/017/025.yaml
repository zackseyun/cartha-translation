base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/025.yaml
  text: And Absalom set Amasa over the army in place of Joab. Now Amasa was the son of a man whose name was Ithra the Israelite[a], who had gone in to Abigail the daughter of Nahash, sister of Zeruiah, Joab’s mother.
translation:
  language: hi
  text: और अबशालोम ने योआब के स्थान पर अमासा को सेना का प्रधान नियुक्त किया। अमासा एक पुरुष का पुत्र था, जिसका नाम यित्रा इस्राएली[a] था; वह नाहाश की बेटी अबीगैल के पास गया था। अबीगैल सरूयाह की बहन थी, और सरूयाह योआब की माँ थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में “यित्रा इस्राएली” है। 1 इतिहास 2:17 में “येतेर इश्माएली” है।
    reason: textual_variant
lexical_decisions:
- source_word: שָׂם ... עַל הַצָּבָא
  choice: सेना का प्रधान नियुक्त किया
  rationale: सन्दर्भ में किसी को सेना पर अधिकार देकर स्थापित करने का भाव है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: תַּחַת יוֹאָב
  choice: योआब के स्थान पर
  rationale: यहाँ תַּחַת स्थानगत अधीनता नहीं, बल्कि योआब के बदले सेनापति बनाए जाने को व्यक्त करता है।
- source_word: בֶן אִישׁ וּשְׁמוֹ יִתְרָא
  choice: एक पुरुष का पुत्र था, जिसका नाम यित्रा था
  rationale: इब्रानी की अनिश्चित संज्ञा और उसके बाद दिए गए नाम—दोनों को बनाए रखते हुए हिन्दी वाक्य को सहज रखा गया है।
- source_word: הַיִּשְׂרְאֵלִי
  choice: इस्राएली
  rationale: प्रस्तुत WLC/मसोरेटिक पाठ का सीधा अनुवाद; 1 इतिहास 2:17 का भिन्न पाठ पादटिप्पणी में दिया गया है।
- source_word: אֲשֶׁר בָּא אֶל
  choice: के पास गया था
  rationale: मूल का शिष्टोक्ति-प्रधान मुहावरा बनाए रखा गया है; प्रसंग में यह यौन सम्बन्ध का संकेत देता है, पर उसे अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: אֲבִיגַל בַּת נָחָשׁ
  choice: नाहाश की बेटी अबीगैल
  rationale: वंश-संबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֲחוֹת צְרוּיָה אֵם יוֹאָב
  choice: अबीगैल सरूयाह की बहन थी, और सरूयाह योआब की माँ थी
  rationale: मूल के संबंधों को अस्पष्ट सर्वनाम से बचाते हुए साफ और सहज हिन्दी में प्रस्तुत किया गया है।
theological_decisions:
- issue: यित्रा की जातीय पहचान में पाठांतर
  choice: मुख्य पाठ में ‘इस्राएली’
  alternative: ‘इश्माएली’ (1 इतिहास 2:17)
  rationale: अनुवाद दिए गए WLC पाठ का अनुसरण करता है और वास्तविक पाठांतर को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। व्यक्तियों के पारिवारिक संबंधों को छोटे वाक्यों में खोलकर बताया गया है, जबकि मूल पाठ की शिष्टोक्ति और पाठांतर सुरक्षित रखे गए हैं।
