reference: 2 Samuel 17:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אָשִׁ֥יבָה כָל הָ/עָ֖ם אֵלֶ֑י/ךָ כְּ/שׁ֣וּב הַ/כֹּ֔ל הָ/אִישׁ֙ אֲשֶׁ֣ר אַתָּ֣ה מְבַקֵּ֔שׁ כָּל הָ/עָ֖ם יִהְיֶ֥ה שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/003.yaml
  text: and I will bring back all the people to you[a], as when all return, the man whom you seek will be gone; all the people will be at peace.
translation:
  language: hi
  text: और मैं सब लोगों को आपके पास लौटा लाऊँगा। जब सब लौट आएँगे, तब जिस पुरुष को आप खोज रहे हैं वह नहीं रहेगा[a]; और सब लोग शान्ति से रहेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ यहाँ कठिन है; शब्दशः लगभग, “सबके लौटने के समान—वह पुरुष जिसे आप खोज रहे हैं।” आशय सम्भवतः यह है कि उस एक पुरुष के हट जाने पर बाकी सब लोग लौट आएँगे।
    reason: मूल इब्रानी की वाक्यरचना और आशय दोनों में वास्तविक अस्पष्टता है; मुख्य पाठ अर्थ को सुबोध बनाता है और पादटिप्पणी शाब्दिक कठिनाई सुरक्षित रखती है।
lexical_decisions:
- source_word: וְאָשִׁיבָה
  choice: और मैं ... लौटा लाऊँगा
  rationale: שוב के हिफ़ील रूप का कारक भाव है—वक्ता लोगों को वापस ले आएगा; इसलिए केवल ‘लौटूँगा’ के बजाय ‘लौटा लाऊँगा’ उपयुक्त है।
- source_word: כָל הָעָם
  choice: सब लोगों
  rationale: עָם का सामान्य अर्थ ‘लोग’ है। प्रसंग में किसी पक्ष के अनुयायी अभिप्रेत हो सकते हैं, पर ‘सेना’ कहने से मूल से अधिक विशिष्टता आ जाती।
- source_word: אֵלֶיךָ
  choice: आपके पास
  rationale: दिशासूचक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और अबशालोम को किए गए संबोधन के अनुरूप आदरसूचक रूप रखता है।
- source_word: כְּשׁוּב הַכֹּל
  choice: जब सब लौट आएँगे
  rationale: इब्रानी पदबंध कठिन और सम्भवतः अपूर्ण है। यह अनुवाद लौटने की मूल धारणा को बनाए रखते हुए वाक्य को हिन्दी में समझने योग्य बनाता है; अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: הָאִישׁ אֲשֶׁר אַתָּה מְבַקֵּשׁ
  choice: जिस पुरुष को आप खोज रहे हैं
  rationale: सापेक्ष उपवाक्य और הָאִישׁ के एकवचन पुरुष-संदर्भ को सुरक्षित रखता है; प्रसंग में यह दाऊद की ओर संकेत करता है, पर नाम मूल पाठ में नहीं जोड़ा गया।
- source_word: יִהְיֶה שָׁלוֹם
  choice: शान्ति से रहेंगे
  rationale: यहाँ שָׁלוֹם संघर्ष समाप्त होने के बाद शान्ति और कुशल की अवस्था बताता है। ‘शान्ति से रहेंगे’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: माँगे जा रहे एक पुरुष के हटने और शेष लोगों की वापसी का सम्बन्ध
  choice: ‘वह नहीं रहेगा’ द्वारा प्रसंगगत आशय व्यक्त किया गया, पर उसकी मृत्यु को सीधे नहीं जोड़ा गया
  alternative: ‘उसके मारे जाने पर’ या अत्यन्त शाब्दिक और अस्पष्ट पदक्रम
  rationale: अहीतोपेल की योजना में उस पुरुष का वध अभिप्रेत है, फिर भी इस कठिन इब्रानी खंड में ‘मारा जाएगा’ स्पष्ट क्रिया के रूप में नहीं है। चुना हुआ रूप संकेत को बनाए रखता है और अनावश्यक व्याख्यात्मक निश्चितता से बचता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। अबशालोम के लिए आदरसूचक ‘आप’ रखा गया है। ‘शान्ति’ में दीर्घ स्वर की मानक वर्तनी अपनाई गई है।
