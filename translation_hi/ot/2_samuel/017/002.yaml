base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/002.yaml
  text: I will come upon him while he is weary and weak-handed[a], and I will throw him into panic, so that all the people who are with him will flee; then I will strike down the king alone.
translation:
  language: hi
  text: मैं उस पर उस समय चढ़ाई करूँगा जब वह थका हुआ और हाथ ढीले पड़े हुए[a] होगा। मैं उसे आतंकित कर दूँगा, और उसके साथ के सभी लोग भाग जाएँगे। तब मैं केवल राजा को मार गिराऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘हाथों से ढीला’ है; यह घटे हुए बल या साहस का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבוֹא עָלָיו
  choice: मैं उस पर ... चढ़ाई करूँगा
  rationale: בוא עַל यहाँ शत्रुतापूर्वक किसी पर आने या आक्रमण करने का भाव रखता है। ‘चढ़ाई करूँगा’ सैन्य संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָגֵעַ
  choice: थका हुआ
  rationale: यह विशेषण परिश्रम से उत्पन्न थकान बताता है; ‘थका हुआ’ सरल और संदर्भानुकूल है।
- source_word: וּרְפֵה יָדַיִם
  choice: ढीले हाथों वाला
  rationale: इब्रानी मुहावरे का शाब्दिक चित्र बनाए रखा गया है; इसका आशय घटे हुए बल या साहस से है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: וְהַחֲרַדְתִּי אֹתוֹ
  choice: मैं उसे घबरा दूँगा
  rationale: חרד के हिफ़ील रूप का कारणवाचक अर्थ है—किसी को भय से काँपने या घबराने पर विवश करना।
- source_word: וְנָס כָּל־הָעָם אֲשֶׁר אִתּוֹ
  choice: और उसके साथ के सभी लोग भाग जाएँगे
  rationale: इब्रानी के सरल संयोजन को बनाए रखते हुए אֲשֶׁר אִתּוֹ को स्वाभाविक हिन्दी में ‘उसके साथ के’ कहा गया है।
- source_word: וְהִכֵּיתִי
  choice: मार गिराऊँगा
  rationale: נכה का मूल भाव प्रहार करना है और इस संदर्भ में घातक वार अभिप्रेत है; ‘मार गिराऊँगा’ दोनों पहलुओं को व्यक्त करता है।
- source_word: הַמֶּלֶךְ לְבַדּוֹ
  choice: केवल राजा को
  rationale: मूल पाठ राजा को अकेले लक्ष्य बनाने पर बल देता है। ‘केवल राजा को’ इस केंद्रित अर्थ को स्पष्ट और संक्षिप्त रूप में रखता है।
