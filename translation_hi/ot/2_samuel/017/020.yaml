base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/020.yaml
  text: Absalom’s servants came to the woman at the house and said[a], “Where are Ahimaaz and Jonathan?” The woman said to them, “They crossed over the brook of water.” They searched, but did not find them, so they returned to Jerusalem.
translation:
  language: hi
  text: अबसालोम के सेवक उस स्त्री के घर आए और बोले, “अहीमास और योनातान कहाँ हैं?” उस स्त्री ने उनसे कहा, “वे पानी की धारा पार कर गए।”[a] उन्होंने उन्हें ढूँढ़ा, पर उन्हें नहीं पाया; इसलिए वे यरूशलेम लौट गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पद असामान्य है और जलमार्ग का सटीक प्रकार अनिश्चित है। इसका अनुवाद “नाला” या “जल-नहर” भी किया जा सकता है।
    reason: मִיכַל הַמָּיִם के असामान्य, अनिश्चित जलमार्ग-संबंधी अर्थ के वैध विकल्प सुरक्षित रखता है, बिना असमर्थित पाठालोचनात्मक दावे जोड़े।
lexical_decisions:
- source_word: עַבְדֵי אַבְשָׁלוֹם
  choice: अबसालोम के सेवक
  rationale: यहाँ עֶבֶד अबसालोम की ओर से काम करनेवाले लोगों को दर्शाता है। ‘सेवक’ प्रसंग के अनुकूल है और दासत्व का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: הָאִשָּׁה הַבַּיְתָה
  choice: उस स्त्री के पास उसके घर आए
  rationale: אִשָּׁה यहाँ पहले उल्लिखित स्त्री है, और הַבַּיְתָה घर की ओर आने को दर्शाता है। हिंदी में यह रूप स्थान और आगमन दोनों को स्वाभाविक ढंग से व्यक्त करता है, बिना यह निश्चित किए कि वे घर के भीतर गए।
- source_word: אַיֵּה
  choice: कहाँ हैं
  rationale: यह स्थान पूछनेवाला प्रश्न है; दो व्यक्तियों के कारण हिंदी में बहुवचन ‘हैं’ उचित है।
- source_word: עָבְרוּ
  choice: पार चले गए हैं
  rationale: עבר का मूल भाव पार जाना या आगे निकल जाना है। स्त्री के कथन में यह हिंदी रूप स्वाभाविक है और जलधारा पार करने का भाव बनाए रखता है।
- source_word: מִיכַל הַמָּיִם
  choice: पानी की धारा
  rationale: इब्रानी पद असामान्य और पाठगत रूप से कठिन है। ‘पानी की धारा’ किसी विशिष्ट भू-आकृति को अनावश्यक रूप से निश्चित किए बिना संभावित जलमार्ग का सामान्य, सुबोध अर्थ देता है।
- source_word: וַיְבַקְשׁוּ וְלֹא מָצָאוּ
  choice: उन्होंने उन्हें ढूँढ़ा, पर वे नहीं मिले
  rationale: בקשׁ यहाँ व्यक्तियों की खोज करना है। इब्रानी में कर्म निहित है; हिंदी में ‘उन्हें’ जोड़ना आवश्यक और स्पष्ट है। ‘पर’ खोज के असफल परिणाम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: इसलिए वे यरूशलेम लौट गए
  rationale: שׁוב का अर्थ लौटना है। ‘इसलिए’ खोज असफल होने और लौटने के बीच प्रसंगगत परिणाम-संबंध को सहज हिंदी में व्यक्त करता है।
