- source_word: בְּעֵינֵי ... וּבְעֵינֵי
  choice: '... की दृष्टि में'
  rationale: इब्रानी का शाब्दिक चित्र ‘आँखों में’ है; आधुनिक गरिमापूर्ण हिंदी में ‘दृष्टि में’ मूल्यांकन और अनुमोदन का वही मुहावरेदार भाव सुरक्षित रखता है। दोनों पदों को एक साझा हिंदी संरचना में समेटा गया है।
- source_word: אַבְשָׁלֹם
  choice: अबशालोम
  rationale: व्यक्तिनाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी पुरनियों
  rationale: זִקְנֵי यहाँ केवल वृद्ध पुरुष नहीं, मान्य नेतृत्वकारी पुरनियों को दर्शाता है। ‘पुरनियों’ हिंदी बाइबलीय संदर्भ में इस पद का स्थापित और सटीक रूप है; כָּל को ‘सभी’ से व्यक्त किया गया है।
