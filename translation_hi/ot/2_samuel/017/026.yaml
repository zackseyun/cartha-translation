lexical_decisions:
- source_word: וַיִּחַן
  choice: पड़ाव डाला
  rationale: क्रिया חנה यहाँ सेना के किसी स्थान पर डेरा डालने को व्यक्त करती है। ‘पड़ाव डाला’ स्वाभाविक आधुनिक हिन्दी है और सैन्य प्रसंग को स्पष्ट रखता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: यह नाम यहाँ सामूहिक रूप से अबशालोम के साथ आई इस्राएली सेना के लिए प्रयुक्त है; मूल पाठ की राष्ट्रीय संज्ञा को यथावत रखा गया है।
- source_word: וְאַבְשָׁלֹם
  choice: और अबशालोम
  rationale: संयोजक अबशालोम और इस्राएल को संयुक्त कर्ता बनाता है। हिन्दी में नाम का प्रचलित बाइबलीय रूप रखा गया है।
- source_word: אֶרֶץ הַגִּלְעָד
  choice: गिलाद प्रदेश में
  rationale: אֶרֶץ के साथ स्थाननाम यहाँ गिलाद के भूभाग या क्षेत्र को दर्शाता है। ‘गिलाद प्रदेश’ अर्थ को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
