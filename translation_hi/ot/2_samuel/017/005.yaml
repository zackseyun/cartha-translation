  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘एरेकी’ को हूशै के परिचय-सूचक विशेषण के रूप में संज्ञा से पहले रखा गया है। मुख्य पाठ में इब्रानी मुहावरे का स्वाभाविक अर्थ दिया गया है और उसका शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
