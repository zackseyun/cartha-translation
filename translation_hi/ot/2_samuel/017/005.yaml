  text: Then Absalom said[a], “Please call Hushai the Archite also, and let us hear what he too has to say.”
translation:
  language: hi
  text: तब अबशालोम ने कहा, “कृपया अरकी हूशै को भी बुलाओ, और हम यह भी सुनें कि उसे क्या कहना है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “और हम सुनें कि उसके मुँह में क्या है—वह भी।” इसका अर्थ है, “उसे क्या कहना है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमसूचक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसके क्रमिक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: קְרָא נָא
  choice: कृपया ... बुलाओ
  rationale: आज्ञार्थक क्रिया के साथ נָא अनुरोध या विनम्र आग्रह का भाव देती है, जिसे ‘कृपया’ स्पष्ट करता है।
- source_word: גַּם לְחוּשַׁי
  choice: हूशै को भी
  rationale: पहला גַּם अहितोपेल के अतिरिक्त हूशै को बुलाने का योगात्मक भाव व्यक्त करता है।
- source_word: חוּשַׁי הָאַרְכִּי
  choice: एरेकी हूशै
  rationale: व्यक्तिनाम का लिप्यंतरण ‘हूशै’ है; הָאַרְכִּי को उसके कुल अथवा स्थान-संबंधी परिचय के रूप में ‘एरेकी’ रखा गया है।
- source_word: וְנִשְׁמְעָה
  choice: और हम ... सुनें
  rationale: प्रथम पुरुष बहुवचन कोहोर्टेटिव प्रस्ताव या सामूहिक इच्छा व्यक्त करता है; ‘हम ... सुनें’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: מַה בְּפִיו
  choice: उसे क्या कहना है
  rationale: शाब्दिक अर्थ ‘उसके मुँह में क्या है’ एक इब्रानी मुहावरा है, जिसका आशय उसकी बात या प्रस्ताव सुनना है।
- source_word: גַּם הוּא
  choice: यह भी ... कि उसे
  rationale: दूसरा גַּם हूशै पर अतिरिक्त सलाहकार के रूप में बल देता है; हिन्दी वाक्य में ‘भी’ इस योगात्मक बल को सहज रूप से बनाए रखता है।
