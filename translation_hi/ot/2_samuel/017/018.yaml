  text: וַ/יַּ֤רְא אֹתָ/ם֙ נַ֔עַר וַ/יַּגֵּ֖ד לְ/אַבְשָׁלֹ֑ם וַ/יֵּלְכוּ֩ שְׁנֵי/הֶ֨ם מְהֵרָ֜ה וַ/יָּבֹ֣אוּ אֶל בֵּֽית אִ֣ישׁ בְּ/בַחוּרִ֗ים וְ/ל֥/וֹ בְאֵ֛ר בַּ/חֲצֵר֖/וֹ וַ/יֵּ֥רְדוּ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/018.yaml
  text: But a young man saw them and told Absalom[a], so the two of them went quickly and came to the house of a man in Bahurim, who had a well in his courtyard, and they went down there.
translation:
  language: hi
  text: पर एक युवक ने उन्हें देखा और अबशालोम को बता दिया। तब वे दोनों जल्दी से चले गए और बहूरीम में एक आदमी के घर आए। उसके आँगन में एक कुआँ था, और वे वहाँ नीचे उतर गए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे उसमें उतर गए,” अर्थात कुएँ में।
    reason: इब्रानी में ‘वहाँ’ है, पर प्रसंग के अनुसार संकेत कुएँ की ओर है; वैकल्पिक अनुवाद इसे स्पष्ट करता है।
lexical_decisions:
- source_word: נַעַר
  choice: युवक
  rationale: यह शब्द लड़के, युवक या सेवक को सूचित कर सकता है। प्रसंग में वह स्वतंत्र रूप से देखकर सूचना देता है, इसलिए ‘युवक’ स्वाभाविक है और उसकी आयु या पद को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַיַּגֵּד
  choice: बता दिया
  rationale: हिफ़िल रूप यहाँ किसी को सूचना देने के अर्थ में है। ‘बता दिया’ आधुनिक हिन्दी में सहज है और घटना की पूर्णता भी व्यक्त करता है।
- source_word: שְׁנֵיהֶם
  choice: वे दोनों
  rationale: इब्रानी पाठ स्पष्ट रूप से दो व्यक्तियों की ओर संकेत करता है; ‘वे दोनों’ इसे संक्षिप्त और स्वाभाविक रूप से बनाए रखता है।
- source_word: מְהֵרָה
  choice: जल्दी से
  rationale: यह क्रियाविशेषणात्मक प्रयोग शीघ्रता और परिस्थिति की तात्कालिकता व्यक्त करता है।
- source_word: בֵּית אִישׁ
  choice: एक आदमी के घर
  rationale: यह रचना इब्रानी संबंधवाचक पदबंध का स्वाभाविक हिन्दी रूप है और अज्ञात गृहस्वामी को अनिश्चित ही रखती है।
- source_word: בְּבַחוּרִים
  choice: बहूरीम में
  rationale: यह स्थान-नाम है; ‘बहूरीम’ उसका हिन्दी लिप्यंतरण है और ‘में’ स्थानीय अर्थ को स्पष्ट करता है।
- source_word: בְאֵר
  choice: कुआँ
  rationale: इस शब्द का सामान्य अर्थ ‘कुआँ’ है। अगले पद में उसके मुँह को ढकने का वर्णन भी इस अर्थ के अनुकूल है; ‘हौद’ या ‘जलाशय’ कहना कम प्रत्यक्ष होगा।
- source_word: בַּחֲצֵרוֹ
  choice: उसके आँगन में
  rationale: חָצֵר घर से जुड़ा घिरा हुआ खुला स्थान है; आधुनिक हिन्दी में ‘आँगन’ सबसे सहज और स्पष्ट है।
- source_word: וַיֵּרְדוּ שָׁם
  choice: वे वहीं नीचे उतर गए
  rationale: इब्रानी में शाब्दिक रूप से ‘वे वहाँ नीचे उतर गए’ है। ‘वहीं’ निकटतम बताए गए स्थान की ओर संकेत करता है, जबकि कुएँ को कर्म बनाकर मूल पाठ की हल्की निहितता को पूरी तरह समाप्त नहीं करता।
