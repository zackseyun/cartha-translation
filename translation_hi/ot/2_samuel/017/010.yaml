  text: וְ/ה֣וּא גַם בֶּן חַ֗יִל אֲשֶׁ֥ר לִבּ֛/וֹ כְּ/לֵ֥ב הָ/אַרְיֵ֖ה הִמֵּ֣ס יִמָּ֑ס כִּֽי יֹדֵ֤עַ כָּל יִשְׂרָאֵל֙ כִּי גִבּ֣וֹר אָבִ֔י/ךָ וּ/בְנֵי חַ֖יִל אֲשֶׁ֥ר אִתּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/010.yaml
  text: Even the valiant man whose heart is like a lion’s heart will utterly melt[a], for all Israel knows that your father is a mighty man[b], and that the men with him are valiant men.
translation:
  language: hi
  text: और वह वीर पुरुष भी, जिसका हृदय सिंह के हृदय के समान है, पूरी तरह हिम्मत हार जाएगा[a]; क्योंकि सारा इस्राएल जानता है कि तुम्हारा पिता एक पराक्रमी योद्धा है और उसके साथ के लोग भी वीर हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “गलते हुए गल जाएगा”; यह जोरदार रचना पूरी तरह साहस खो देने का भाव व्यक्त करती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן חַיִל
  choice: वीर पुरुष
  rationale: शाब्दिक मुहावरा ‘सामर्थ्य/वीरता का पुत्र’ साहस और युद्ध-कौशल वाले व्यक्ति को दर्शाता है। ‘वीर पुरुष’ आधुनिक हिंदी में स्वाभाविक है और एकवचन को बनाए रखता है।
- source_word: לִבּוֹ כְּלֵב הָאַרְיֵה
  choice: जिसका हृदय सिंह के हृदय के समान है
  rationale: हिब्रू उपमा और उसके सिंह-संबंधी चित्र को संक्षिप्त विशेषण में बदलने के बजाय स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: הִמֵּס יִמָּס
  choice: पूरी तरह हिम्मत हार जाएगा
  rationale: इनफिनिटिव ऐब्सोल्यूट और सीमित क्रिया का संयोजन तीव्र बल देता है। हिंदी में ‘हिम्मत हार जाना’ साहस के गल जाने की रूपकगत भावना को स्वाभाविक ढंग से व्यक्त करता है; पादटिप्पणी शाब्दिक रूप बताती है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले कथन का कारण प्रस्तुत करता है।
- source_word: יֹדֵעַ כָּל יִשְׂרָאֵל
  choice: सारा इस्राएल जानता है
  rationale: यह स्थापित और व्यापक जानकारी को सीधे तथा स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: גִבּוֹר
  choice: एक पराक्रमी योद्धा
  rationale: यह दाऊद को शक्तिशाली युद्धवीर के रूप में चित्रित करता है; ‘योद्धा’ सैन्य संदर्भ को स्पष्ट करता है और ‘पराक्रमी’ उसकी सामर्थ्य को बनाए रखता है।
- source_word: וּבְנֵי חַיִל אֲשֶׁר אִתּוֹ
  choice: उसके साथ के लोग भी वीर हैं
  rationale: ‘वीरता के पुत्र’ मुहावरे को स्वाभाविक हिंदी में प्रस्तुत करते हुए साथ होने वाले संबंध और חַיִל की वीरता-संबंधी धारणा सुरक्षित रखी गई है।
