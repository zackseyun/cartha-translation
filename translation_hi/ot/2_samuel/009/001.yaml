source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔ד הֲ/כִ֣י יֶשׁ ע֔וֹד אֲשֶׁ֥ר נוֹתַ֖ר לְ/בֵ֣ית שָׁא֑וּל וְ/אֶעֱשֶׂ֤ה עִמּ/וֹ֙ חֶ֔סֶד בַּ/עֲב֖וּר יְהוֹנָתָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/001.yaml
  text: David said[a], “Is there still anyone left of the house of Saul, that I may show kindness to him for Jonathan’s sake?”
translation:
  language: hi
  text: दाऊद ने कहा, “क्या शाऊल के घराने में अब भी कोई बचा हुआ है, जिसके प्रति मैं योनातान के कारण भलाई[a] करूँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निष्ठावान प्रेम दिखाऊँ” अथवा “वाचाई निष्ठा दिखाऊँ”; इब्रानी शब्द प्रायः संबंध या वाचा पर आधारित निष्ठावान कृपा को दर्शाता है, न कि केवल भावना को।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने कहा
  rationale: אמר सामान्य कथात्मक क्रिया है जिसका अर्थ ‘कहना’ है। आगे प्रश्न होने पर भी परिचय में ‘ने कहा’ स्वाभाविक और स्रोत के अधिक निकट है।
- source_word: הֲכִי יֶשׁ עוֹד
  choice: क्या ... अब भी कोई
  rationale: प्रश्नवाचक הֲכִי और अस्तित्वसूचक יֶשׁ עוֹד मिलकर किसी के अब भी मौजूद होने की पुष्टि पूछते हैं।
- source_word: אֲשֶׁר נוֹתַר
  choice: बचा है
  rationale: נותר किसी शेष बचे या जीवित रह गए व्यक्ति को सूचित करता है; ‘बचा है’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: לְבֵית שָׁאוּל
  choice: शाऊल के घराने में
  rationale: בית यहाँ भवन नहीं, परिवार अथवा राजवंश को दर्शाता है; इसलिए ‘घराना’ उपयुक्त है। हिन्दी में अस्तित्व के प्रश्न के साथ ‘घराने में’ स्वाभाविक संबंध व्यक्त करता है।
- source_word: וְאֶעֱשֶׂה עִמּוֹ חֶסֶד
  choice: जिस पर मैं ... कृपा करूँ
  rationale: עשה עם חסד का अर्थ किसी के प्रति दयालु अथवा निष्ठापूर्ण भलाई करना है। ‘कृपा करना’ हिन्दी में व्यक्ति की ओर किए गए अनुग्रह को सहज ढंग से व्यक्त करता है।
- source_word: בַּעֲבוּר יְהוֹנָתָן
  choice: योनातान के कारण
  rationale: בַּעֲבוּר हेतु या आधार बताता है। ‘योनातान के कारण’ स्पष्ट रूप से बताता है कि दाऊद की कार्रवाई योनातान से उसके संबंध के आधार पर है।
theological_decisions:
- issue: חֶסֶד में दया और संबंधपरक निष्ठा का संयुक्त भाव
  choice: मुख्य पाठ में ‘कृपा’
  alternative: ‘निष्ठापूर्ण प्रेम’ अथवा ‘वाचा की निष्ठा’
  rationale: इस प्रसंग में शब्द उदार भलाई को दर्शाता है, पर योनातान के साथ दाऊद की प्रतिबद्धता के कारण इसमें संबंधपरक निष्ठा भी निहित है। मुख्य पाठ को स्वाभाविक रखते हुए यह गहरा भाव पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और कथात्मक है। ‘घराना’ पारिवारिक-राजवंशीय अर्थ रखता है, और ‘कृपा करूँ’ सामान्य पाठक के लिए सहज रहते हुए पादटिप्पणी द्वारा חֶסֶד की व्यापक अर्थछाया को सुरक्षित रखता है।
