base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/006.yaml
  text: Mephibosheth son of Jonathan, son of Saul, came to David and fell on his face and bowed down. David said, “Mephibosheth,” and he said, “Here is your servant.”
translation:
  language: hi
  text: तब योनातान का पुत्र, शाऊल का पुत्र मपीबोशेत दाऊद के पास आया और मुँह के बल गिर पड़ा और दण्डवत किया। दाऊद ने कहा, “मपीबोशेत!” उसने कहा, “यह रहा आपका सेवक।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: मुँह के बल गिरकर
  rationale: इब्रानी मुहावरे की शारीरिक मुद्रा को स्वाभाविक आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: וַיִּשְׁתָּחוּ
  choice: दण्डवत किया
  rationale: राजा के सामने सम्मान और अधीनता प्रकट करने वाले झुकने को संक्षिप्त तथा गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: הִנֵּה עַבְדֶּךָ
  choice: यह रहा आपका सेवक
  rationale: הִנֵּה की प्रस्तुतिकारी शक्ति और עַבְדֶּךָ की विनम्र आत्म-पहचान दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: वंश-संबंध की प्रस्तुति
  choice: शाऊल के पोते और योनातान के पुत्र
  alternative: योनातान का पुत्र, शाऊल का पुत्र
  rationale: इब्रानी में लगातार आए בֶּן संबंधों का आशय मपीबोशेत को योनातान का पुत्र और शाऊल का वंशज बताना है; हिन्दी में चुना गया क्रम संबंधों को बिना doctrinal विस्तार के स्पष्ट करता है।
- issue: עֶבֶד का सामाजिक अर्थ
  choice: सेवक
  alternative: दास
  rationale: राजकीय संबोधन में यह विनम्र अधीनता की आत्म-पहचान है; “सेवक” आधुनिक हिन्दी में इसी भाव को स्वाभाविक रूप से रखता है, जबकि “दास” अनावश्यक रूप से संपत्ति-संबंधी गुलामी को प्रमुख कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक शैली सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल है। दाऊद के लिए एकवचन आदरसूचक “आपका” और मपीबोशेत के लिए सम्मानसूचक बहुवचन क्रिया का प्रयोग किया गया है।
