base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/005.yaml
  text: So King David sent and took him from the house of Machir son of Ammiel[a], from Lo-debar.
translation:
  language: hi
  text: तब राजा दाऊद ने उसे बुलाने के लिए भेजा और उसे अम्मीएल के पुत्र माकीर के घर से, लो-दबार से, ले आया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप से, “राजा दाऊद ने भेजा और उसे अम्मीएल के पुत्र माकीर के घर से, लो-दबार से, ले लिया।” हिब्रू में “भेजा” और “उसे लिया” क्रियाएँ हैं। प्रसंग में इन्हें मुहावरे के अनुसार “उसे बुलाने के लिए भेजा” और “ले आया” भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: दूत भेजे
  rationale: שׁלח का मूल अर्थ ‘भेजना’ है। हिन्दी में भेजे गए व्यक्तियों का उल्लेख निहित छोड़ने की अपेक्षा ‘दूत भेजे’ कथा-संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַמֶּלֶךְ דָּוִד
  choice: राजा दाऊद
  rationale: हिब्रू के पद और नाम को आधुनिक हिन्दी के स्वाभाविक क्रम में रखा गया है।
- source_word: וַיִּקָּחֵהוּ
  choice: उसे ... बुलवा लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर राजा द्वारा दूत भेजने के बाद किसी व्यक्ति को अपने पास मँगाने के प्रसंग में ‘बुलवा लिया’ स्वाभाविक हिन्दी है और राजा की प्रतिनिधियों के माध्यम से हुई कार्रवाई को व्यक्त करता है। अधिक शाब्दिक क्रम पाद-टिप्पणी में दिया गया है।
- source_word: מִבֵּית
  choice: के घर से
  rationale: בַּיִת यहाँ भौतिक घर या गृहस्थी, दोनों का संकेत दे सकता है। ‘घर’ इस संदर्भ में स्वाभाविक है और इस व्यापकता को पर्याप्त रूप से बनाए रखता है।
- source_word: מָכִיר בֶּן עַמִּיאֵל
  choice: अम्मीएल के पुत्र माकीर
  rationale: हिब्रू वंश-संबंध को स्पष्ट रखते हुए नामों का देवनागरी लिप्यंतरण किया गया है। हिन्दी के स्वाभाविक संबंध-क्रम का प्रयोग हुआ है।
- source_word: מִלּוֹ דְבָר
  choice: लो-दबार में
  rationale: लो-दबार को वर्णनात्मक पद नहीं, स्थान-नाम मानकर लिप्यंतरित किया गया है। हिन्दी में किसी घर की अवस्थिति बताने के लिए ‘लो-दबार में ... के घर से’ अधिक स्वाभाविक है, यद्यपि हिब्रू में यहाँ दूसरा מִן, ‘से’, है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘बुलवा लिया’ राजकीय प्रतिनिधियों के माध्यम से हुई कार्रवाई को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पाद-टिप्पणी हिब्रू की अधिक शाब्दिक क्रिया-रचना और उसकी संभावित अर्थ-सीमा को सुरक्षित रखती है।
