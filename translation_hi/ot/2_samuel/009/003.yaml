base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/003.yaml
  text: Then the king said[a], “Is there still anyone left of the house of Saul, that I may show him the kindness of God?” Ziba said to the king, “There is still a son of Jonathan[b], crippled in his feet.”
translation:
  language: hi
  text: तब राजा ने कहा, “क्या शाऊल के घराने में अब भी कोई बचा है, ताकि मैं उस पर परमेश्वर की करुणा[a] दिखाऊँ?” सीबा ने राजा से कहा, “योनातान का एक पुत्र अब भी है; उसके दोनों पैर अशक्त[b] हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर-जैसी करुणा” अथवा “परमेश्वर की वाचागत निष्ठा।”
    reason: חֶסֶד אֱלֹהִים में करुणा और निष्ठावान कृपा का अर्थ-क्षेत्र है। संबंधवाचक रचना को मुख्य पाठ में सीधे रखा गया है; विकल्प उसके संभावित अर्थों को दर्शाते हैं।
  - marker: b
    text: 'शाब्दिक अर्थ: “पैरों से अशक्त”; या “दोनों पैरों से लँगड़ा।”'
    reason: נְכֵה רַגְלָיִם पैरों को प्रभावित करने वाली शारीरिक अक्षमता का वर्णन करता है।
lexical_decisions:
- source_word: הַאֶפֶס עוֹד אִישׁ
  choice: क्या ... अब भी कोई बचा है
  rationale: यह प्रश्न पूछता है कि क्या कोई व्यक्ति अभी शेष है। यह स्वाभाविक हिन्दी में इब्रानी मुहावरे का आशय व्यक्त करता है, बिना उसे नकारात्मक प्रश्न बनाने के।
- source_word: לְבֵית שָׁאוּל
  choice: शाऊल के घराने में
  rationale: यहाँ ‘घराना’ परिवार या वंश को दर्शाता है; ‘में’ शेष बचे सदस्य के बारे में पूछे गए प्रश्न के साथ सहज है।
- source_word: וְאֶעֱשֶׂה עִמּוֹ חֶסֶד אֱלֹהִים
  choice: जिस पर मैं परमेश्वर की-सी करुणा करूँ
  rationale: ‘करुणा करना’ हिन्दी में חֶסֶד के साथ स्वाभाविक है। ‘परमेश्वर की-सी’ उस संबंधवाचक पदबंध की व्यापकता बनाए रखता है, जो परमेश्वर से संबंधित, परमेश्वर के अनुरूप, अथवा असाधारण करुणा सूचित कर सकता है।
- source_word: עוֹד בֵּן לִיהוֹנָתָן
  choice: योनातान का एक बेटा अब भी जीवित है
  rationale: इब्रानी में शेष रहने पर बल है। ‘जीवित है’ प्रसंग में निहित उत्तर को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נְכֵה רַגְלָיִם
  choice: वह दोनों पैरों से अशक्त है
  rationale: द्विवचन ‘पैरों’ को ‘दोनों पैरों’ से स्पष्ट किया गया है। ‘अशक्त’ शारीरिक गतिशीलता की अक्षमता को सम्मानजनक और वर्तमान हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: חֶסֶד אֱלֹהִים का संबंध और अर्थ-क्षेत्र
  choice: परमेश्वर की-सी करुणा
  alternative: परमेश्वर की करुणा; परमेश्वर के प्रति वाचा की निष्ठा
  rationale: इब्रानी संबंधवाचक रचना यह खुला रखती है कि करुणा परमेश्वर की विशेषता वाली, परमेश्वर से संबंधित, अथवा परमेश्वर के सामने बँधी निष्ठा की अभिव्यक्ति है। मुख्य पाठ इसे किसी एक संकीर्ण धर्मवैज्ञानिक अर्थ तक सीमित नहीं करता।
- issue: नְכֵה רַגְלָיִם का वर्णन
  choice: दोनों पैरों से अशक्त
  alternative: दोनों पैरों से लँगड़ा
  rationale: मूल पाठ वास्तविक शारीरिक अक्षमता बताता है। चुनी हुई अभिव्यक्ति अर्थ को बनाए रखते हुए आधुनिक हिन्दी में अनावश्यक रूप से अपमानजनक शब्दावली से बचती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘घराना’ वंशगत अर्थ देता है, ‘करुणा करना’ प्राकृतिक हिन्दी है, और अक्षमता का वर्णन स्पष्ट किंतु सम्मानजनक रखा गया है।
