source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ דָוִ֜ד אַל תִּירָ֗א כִּ֣י עָשֹׂה֩ אֶעֱשֶׂ֨ה עִמְּ/ךָ֥ חֶ֨סֶד֙ בַּֽ/עֲבוּר֙ יְהוֹנָתָ֣ן אָבִ֔י/ךָ וַ/הֲשִׁבֹתִ֣י לְ/ךָ֔ אֶֽת כָּל שְׂדֵ֖ה שָׁא֣וּל אָבִ֑י/ךָ וְ/אַתָּ֗ה תֹּ֥אכַל לֶ֛חֶם עַל שֻׁלְחָנִ֖/י תָּמִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/007.yaml
  text: David said to him[a], “Do not be afraid, for I will surely show you kindness for the sake of Jonathan your father, and I will restore to you all the land of Saul your father[c][b], and you shall always eat bread at my table.”
translation:
  language: hi
  text: दाऊद ने उससे कहा, “मत डर, क्योंकि मैं तेरे पिता योनातान के कारण निश्चय ही तुझ पर कृपा[a] करूँगा। मैं तेरे दादा[b] शाऊल की सारी भूमि तुझे लौटा दूँगा, और तू सदा मेरी मेज़ पर भोजन करेगा।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द ख़ेसेद का अनुवाद “अटल प्रेम,” “निष्ठापूर्ण प्रेम” या “वाचा-निष्ठा” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में “तेरे पिता शाऊल” है। यहाँ “पिता” का अर्थ पूर्वज है; शाऊल मपीबोशेत का दादा था।
    reason: lexical_alternative
  - marker: c
    text: मूल इब्रानी में “मेरी मेज़ पर सदा रोटी खाएगा” है—यह निरंतर भरण-पोषण और साथ भोजन करने का मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָא
  choice: मत डर
  rationale: निषेधात्मक आज्ञा का स्वाभाविक और सीधा आधुनिक हिन्दी रूप, जो दाऊद के आश्वासन को बनाए रखता है।
- source_word: כִּי עָשֹׂה אֶעֱשֶׂה
  choice: क्योंकि मैं ... निश्चय ही ... करूँगा
  rationale: क्रिया के साथ infinitive absolute द्वारा दिए गए बल को ‘निश्चय ही’ से व्यक्त किया गया है।
- source_word: חֶסֶד
  choice: कृपा
  rationale: इस प्रसंग में यह योनातान के कारण दिखाई जाने वाली निष्ठापूर्ण भलाई और अनुग्रहपूर्ण व्यवहार को दर्शाता है; व्यापक अर्थ-क्षेत्र को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בַּעֲבוּר יְהוֹנָתָן אָבִיךָ
  choice: तेरे पिता योनातान के कारण
  rationale: कारण और संबंधपरक अभिप्रेरणा दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַהֲשִׁבֹתִי לְךָ
  choice: मैं ... तुझे लौटा दूँगा
  rationale: हिफ़ील रूप यहाँ संपत्ति को वापस दिलाने या बहाल करने का अर्थ देता है; ‘लौटा दूँगा’ सामान्य पाठक के लिए सहज है।
- source_word: כָּל שְׂדֵה שָׁאוּל
  choice: शाऊल की सारी भूमि
  rationale: एकवचन שָׂדֶה यहाँ सामूहिक रूप से जागीर अथवा भू-संपत्ति को सूचित करता है, इसलिए ‘सारी भूमि’ उपयुक्त है।
- source_word: שָׁאוּל אָבִיךָ
  choice: तेरे दादा शाऊल
  rationale: אָב का अर्थ पूर्वज भी हो सकता है; वंश-संबंध के अनुसार शाऊल मपीबोशेत का दादा था। मुख्य पाठ में स्पष्ट संबंध दिया गया है और शाब्दिक रूप पादटिप्पणी में दर्ज है।
- source_word: תֹּאכַל לֶחֶם עַל שֻׁלְחָנִי תָּמִיד
  choice: तू सदा मेरी मेज़ पर भोजन किया करेगा
  rationale: ‘रोटी खाना’ भोजन और मेज़ की निरंतर संगति का मुहावरा है; हिन्दी में ‘भोजन किया करेगा’ नियमित और स्थायी प्रबंध को स्वाभाविक रूप से प्रकट करता है।
theological_decisions:
- issue: חֶסֶד में निष्ठा और वाचा-संबंधी भाव
  choice: मुख्य पाठ में ‘कृपा’, पादटिप्पणी में ‘अटल प्रेम’, ‘निष्ठापूर्ण प्रेम’ और ‘वाचा-निष्ठा’
  alternative: मुख्य पाठ में ‘निष्ठापूर्ण प्रेम’ अथवा ‘वाचा-निष्ठा’
  rationale: कथा में यह ठोस उपकार है जो दाऊद योनातान से अपने संबंध के कारण करता है। ‘कृपा’ सुबोध है, जबकि पादटिप्पणी मूल शब्द की समृद्ध संबंधपरक और वाचागत छाया को बिना किसी एक व्याख्या को अनिवार्य किए बनाए रखती है।
- issue: שָׁאוּל אָבִיךָ में संबंध-सूचक אָב
  choice: अर्थानुसार ‘तेरे दादा शाऊल’
  alternative: शाब्दिक ‘तेरे पिता शाऊल’
  rationale: इब्रानी में ‘पिता’ का प्रयोग पूर्वज के लिए हो सकता है। मपीबोशेत योनातान का पुत्र और शाऊल का पोता था; इसलिए हिन्दी में ‘दादा’ भ्रम से बचाता है, जबकि शाब्दिक रूप पादटिप्पणी में संरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक रूप। राजकीय प्रसंग और निकट संबोधन को ध्यान में रखते हुए एकवचन ‘तू/तेरे/तुझे’ रखा गया है। ‘मेज़’ और ‘भोजन’ सामान्य आधुनिक पाठक के लिए स्वाभाविक हैं।
