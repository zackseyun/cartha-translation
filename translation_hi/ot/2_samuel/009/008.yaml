    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  choice: उसने दण्डवत् किया
  rationale: हित्पएल रूप आदर और अधीनता में स्वयं झुकने का शारीरिक भाव व्यक्त करता है। राजदरबार के इस प्रसंग में ‘दण्डवत् किया’ स्वाभाविक है और इसे उपासना के रूप में अनावश्यक रूप से सीमित नहीं करता।
- source_word: מֶה עַבְדֶּךָ
  choice: आपका सेवक क्या है
  rationale: इब्रानी के शाब्दिक और आत्म-दीनता से भरे प्रश्न ‘आपका सेवक क्या है?’ को सुरक्षित रखा गया है; ‘मैं कौन हूँ’ अर्थ को अधिक सहज बनाता, पर ‘क्या’ में निहित तुच्छता के भाव को कुछ कम कर देता।
- source_word: כִּי
  choice: कि
  rationale: 'यहाँ כִּי आलंकारिक प्रश्न के अगले आशय को प्रस्तुत करता है: ‘क्या है कि...?’'
- source_word: פָנִיתָ אֶל
  choice: आपने ... की ओर ध्यान दिया है
  rationale: पנה אל का मूल चित्र ‘किसी की ओर मुड़ना’ है, पर प्रसंग में इसका आशय कृपापूर्वक ध्यान देने से है। हिन्दी में ‘की ओर ध्यान दिया’ चित्र और आशय दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַכֶּלֶב הַמֵּת
  choice: मरे हुए कुत्ते
  rationale: यह अत्यन्त आत्म-दीनता और अपने को निकम्मा समझने की रूढ़ अभिव्यक्ति है। ‘मरा हुआ कुत्ता’ इसकी कठोरता को नरम किए बिना सुरक्षित रखता है।
- source_word: אֲשֶׁר כָּמוֹנִי
  choice: मुझ जैसे
  rationale: सम्बन्धवाचक पदबंध को संक्षिप्त और स्वाभाविक हिन्दी में रखा गया है, जिससे मपीबोशेत का अपने ही विषय में किया गया अपमानजनक तुलनात्मक कथन स्पष्ट रहता है।
