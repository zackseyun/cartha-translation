source:
  edition: WLC
  text: וַ/יִּקְרָ֣א הַ/מֶּ֗לֶךְ אֶל צִיבָ֛א נַ֥עַר שָׁא֖וּל וַ/יֹּ֣אמֶר אֵלָ֑י/ו כֹּל֩ אֲשֶׁ֨ר הָיָ֤ה לְ/שָׁאוּל֙ וּ/לְ/כָל בֵּית֔/וֹ נָתַ֖תִּי לְ/בֶן אֲדֹנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/009.yaml
  text: Then the king called Ziba[a], Saul’s servant, and said to him[c][b], “All that belonged to Saul and to all his house I have given to your master’s son.”
translation:
  language: hi
  text: तब राजा ने शाऊल के सेवक सीबा[a] को बुलाकर उससे कहा, “जो कुछ शाऊल और उसके समूचे घराने का था[b], वह मैंने तुम्हारे स्वामी के पुत्र[c] को दे दिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सेवक” के लिए आए इब्रानी शब्द का अनुवाद “युवक” या “परिचारक” भी हो सकता है; यहाँ उससे संभवतः घराने का सेवक या आश्रित अधिकारी अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “और उसके सारे घर का”; यहाँ “घर” से घराना और उससे जुड़ी संपत्ति अभिप्रेत हो सकती है।
    reason: lexical_alternative
  - marker: c
    text: “तुम्हारे स्वामी के पुत्र” से मपीबोशेत अभिप्रेत है। इब्रानी में “पुत्र” शब्द वंशज के व्यापक अर्थ में भी प्रयुक्त हो सकता है; मपीबोशेत शाऊल का पोता था।
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: सेवक
  rationale: यद्यपि इस शब्द का अर्थ “युवक” भी हो सकता है, यहाँ शाऊल के घराने में सीबा की भूमिका के संदर्भ में “सेवक” स्वाभाविक और प्रसंगानुकूल है।
- source_word: כֹּל אֲשֶׁר הָיָה לְשָׁאוּל
  choice: जो कुछ शाऊल ... का था
  rationale: इब्रानी स्वामित्व-सूचक मुहावरे को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּלְכָל בֵּיתוֹ
  choice: और उसके समूचे घराने का
  rationale: בַּיִת यहाँ केवल भवन नहीं, बल्कि शाऊल के घराने और उससे जुड़ी संपत्ति को सूचित कर सकता है; “घराना” मूल की व्यापकता को बनाए रखता है।
- source_word: נָתַתִּי
  choice: मैंने ... दे दिया है
  rationale: पूर्ण की गई उस कार्रवाई को व्यक्त करता है जिसका परिणाम वर्तमान में प्रभावी है।
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: तुम्हारे स्वामी के पुत्र को
  rationale: אֲדוֹן सामाजिक स्वामी या अधिकारी के अर्थ में है, कोई ईश्वरीय उपाधि नहीं; “पुत्र” בֵּן का औपचारिक अनुवाद है और यहाँ वंशज के व्यापक अर्थ में प्रयुक्त है।
- source_word: וַיִּקְרָא ... וַיֹּאמֶר
  choice: तब ... बुलाकर ... कहा
  rationale: क्रमिक कथात्मक क्रियाओं को स्वाभाविक हिन्दी प्रवाह में प्रस्तुत करता है।
