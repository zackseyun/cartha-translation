  text: וּ/מְפִיבֹ֗שֶׁת יֹשֵׁב֙ בִּ/יר֣וּשָׁלִַ֔ם כִּ֣י עַל שֻׁלְחַ֥ן הַ/מֶּ֛לֶךְ תָּמִ֖יד ה֣וּא אֹכֵ֑ל וְ/ה֥וּא פִסֵּ֖חַ שְׁתֵּ֥י רַגְלָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/013.yaml
  text: And Mephibosheth lived in Jerusalem[a], because he always ate at the king’s table[b]. Now he was lame in both his feet.
translation:
  language: hi
  text: और मपीबोशेत यरूशलेम में रहता था, क्योंकि वह सदा राजा की मेज़ पर भोजन करता था। वह दोनों पैरों से लँगड़ा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹשֵׁב
  choice: रहता था
  rationale: नगर के नाम के साथ ישׁב का कृदन्त यहाँ बैठने के बजाय निवास करने का अर्थ देता है; ‘रहता था’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי मपीबोशेत के यरूशलेम में रहने का कारण प्रस्तुत करता है; ‘क्योंकि’ उसके कारणात्मक बल को स्पष्ट रखता है।
- source_word: שֻׁלְחַן הַמֶּלֶךְ
  choice: राजा की मेज़
  rationale: इब्रानी संबंध-रचना का सहज हिन्दी रूप है और राजकीय प्रबंध तथा संगति के मूल बिंब को बनाए रखता है।
- source_word: תָּמִיד
  choice: सदा
  rationale: यह निरन्तर अथवा नियमित रूप से मिलने वाले विशेषाधिकार को व्यक्त करता है; ‘सदा’ संक्षिप्त, गरिमापूर्ण और सहज है।
- source_word: אֹכֵל
  choice: भोजन करता था
  rationale: कृदन्त यहाँ अभ्यस्त क्रिया बताता है; ‘सदा’ के साथ यह रूप नियमित भूतकालीन आचरण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פִסֵּחַ
  choice: लँगड़ा
  rationale: यह विशेषण चलने की शारीरिक अक्षमता को सीधे व्यक्त करता है और मूल कथन से अधिक व्याख्या नहीं जोड़ता।
- source_word: שְׁתֵּי רַגְלָיו
  choice: दोनों पैरों से
  rationale: इब्रानी का शाब्दिक अर्थ ‘उसके दोनों पैर’ है; हिन्दी में ‘दोनों पैरों से लँगड़ा’ इसी विशिष्टता को सहज रूप से रखता है।
- source_word: וְהוּא
  choice: वह ... था
  rationale: वाव यहाँ अंत में एक अतिरिक्त वर्णनात्मक तथ्य जोड़ता है; अलग वाक्य में सरल ‘वह’ हिन्दी प्रवाह को स्वाभाविक रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल और गरिमापूर्ण कथात्मक शैली। व्यक्तिनाम ‘मपीबोशेत’ इब्रानी מְפִיבֹשֶׁת का निकट देवनागरी रूप है। पद की वास्तविक कारणात्मक संरचना और अंतिम शारीरिक-वर्णन दोनों बिना व्याख्यात्मक विस्तार के सुरक्षित रखे गए हैं।
