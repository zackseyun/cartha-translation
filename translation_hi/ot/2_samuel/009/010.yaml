base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/010.yaml
  text: You and your sons and your servants shall work the land for him[a], and you shall bring in the produce, and it shall be bread for your master's son, and he shall eat it. But Mephibosheth, your master's son, shall always eat bread at my table. Now Ziba had fifteen sons and twenty servants.
translation:
  language: hi
  text: तू अपने बेटों और अपने दासों के साथ उसके लिए भूमि जोतेगा और उसकी उपज ले आएगा। वह तेरे स्वामी के पुत्र के लिए रोटी[a] होगी, और वह उसे खाएगा। परन्तु तेरे स्वामी का पुत्र मपीबोशेत सदा मेरी मेज़ पर रोटी खाएगा। सीबा के पंद्रह बेटे और बीस दास थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘रोटी’ का अर्थ प्रसंग के अनुसार ‘भोजन’ या ‘खाद्य-सामग्री’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַדְתָּ לּוֹ אֶת־הָאֲדָמָה
  choice: उसके लिए भूमि जोतेगा
  rationale: עבד के साथ אֲדָמָה यहाँ सामान्य सेवा नहीं, बल्कि भूमि पर कृषि-कार्य बताता है। ‘भूमि जोतना’ आधुनिक हिन्दी में स्वाभाविक और ठोस अभिव्यक्ति है।
- source_word: אַתָּה וּבָנֶיךָ וַעֲבָדֶיךָ
  choice: तू अपने बेटों और अपने दासों समेत
  rationale: עֲבָדִים यहाँ सीबा के अधीन बँधे घरेलू श्रमिकों को सूचित करता है; ‘दास’ उनकी सामाजिक स्थिति को ‘सेवक’ की अपेक्षा अधिक स्पष्ट रूप से व्यक्त करता है।
- source_word: וְהֵבֵאתָ
  choice: उसकी उपज ले आएगा
  rationale: क्रिया का शाब्दिक अर्थ ‘ले आना’ है, जबकि कृषि-संदर्भ से उसका अव्यक्त कर्म भूमि की उपज है। स्पष्टता के लिए ‘उपज’ जोड़ा गया है।
- source_word: וְהָיָה לְבֶן אֲדֹנֶיךָ לֶּחֶם
  choice: वह तेरे स्वामी के पुत्र के लिए रोटी होगी
  rationale: לֶחֶם का मूल अर्थ ‘रोटी’ है, पर यहाँ उसका व्यापक अर्थ भोजन या जीवन-निर्वाह की सामग्री भी हो सकता है। ‘रोटी’ रखने से अगले वाक्यांश की पुनरावृत्ति और मूल बिंब सुरक्षित रहता है।
- source_word: וַאֲכָלוֹ
  choice: और वह उसे खाएगा
  rationale: प्रत्यय पूर्वोक्त उपज/रोटी की ओर संकेत करता है; हिन्दी में ‘उसे’ इस संबंध को स्पष्ट करता है।
- source_word: וּמְפִיבֹשֶׁת ... יֹאכַל תָּמִיד לֶחֶם עַל שֻׁלְחָנִי
  choice: परन्तु ... मपीबोशेत सदा मेरी मेज़ पर रोटी खाएगा
  rationale: ו को प्रसंगानुसार विरोधसूचक ‘परन्तु’ किया गया है। यह खेत की उपज से मिलने वाले निर्वाह और दाऊद की राजकीय मेज़ पर मपीबोशेत के निरन्तर भोजन के बीच अंतर दिखाता है।
- source_word: וּלְצִיבָא חֲמִשָּׁה עָשָׂר בָּנִים וְעֶשְׂרִים עֲבָדִים
  choice: सीबा के पंद्रह बेटे और बीस दास थे
  rationale: इब्रानी का यह क्रियारहित पृष्ठभूमि-वाक्य हिन्दी में स्वाभाविक रूप से ‘थे’ के साथ व्यक्त किया गया है; עֲבָדִים के लिए सामाजिक स्थिति दर्शाने वाला ‘दास’ रखा गया है।
