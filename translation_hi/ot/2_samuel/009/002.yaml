base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/002.yaml
  text: The house of Saul had a servant whose name was Ziba[a], and they called him to David. And the king said to him, “Are you Ziba?” And he said, “Your servant.”
translation:
  language: hi
  text: शाऊल के घराने का एक सेवक था, जिसका नाम सीबा था। लोगों ने उसे दाऊद के पास बुलाया। राजा ने उससे पूछा, “क्या तुम सीबा हो?” उसने उत्तर दिया, “आपका सेवक।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अर्थात, “मैं आपका सेवक हूँ।” इब्रानी में उत्तर संक्षिप्त है: “आपका सेवक।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/בֵית שָׁאוּל
  choice: शाऊल के घराने का एक सेवक था
  rationale: इब्रानी संबंध/अधिकार बताने वाली अस्तित्वसूचक रचना है। हिंदी में ‘शाऊल के घराने का ... था’ स्वाभाविक है और आरंभिक ו को अनावश्यक कालसूचक ‘अब’ नहीं बनाता।
- source_word: עֶבֶד
  choice: सेवक
  rationale: यह शब्द दास या सेवक दोनों अर्थ दे सकता है; यहाँ शाऊल के घराने से जुड़े अधीनस्थ घरेलू व्यक्ति के लिए ‘सेवक’ प्रसंगानुकूल और सहज है।
- source_word: וּשְׁמוֹ צִיבָא
  choice: जिसका नाम सीबा था
  rationale: यह पहचान कराने वाली इब्रानी कथात्मक अभिव्यक्ति का स्वाभाविक हिंदी रूप है।
- source_word: וַיִּקְרְאוּ לוֹ אֶל דָּוִד
  choice: लोगों ने उसे दाऊद के पास बुलाया
  rationale: बहुवचन क्रिया का कर्ता अनिर्दिष्ट है; ‘लोगों ने’ उस अनिश्चितता को बनाए रखता है और दाऊद की उपस्थिति में बुलाए जाने का भाव स्पष्ट करता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित उपाधि प्रसंग में दाऊद को सूचित करती है; हिंदी में सामान्यतः ‘राजा’ पर्याप्त है।
- source_word: הַאַתָּה צִיבָא
  choice: क्या तुम सीबा हो?
  rationale: प्रश्नवाचक ה और सर्वनाम का स्वाभाविक प्रत्यक्ष प्रश्न; राजा से अधीनस्थ की ओर संबोधन में ‘तुम’ उपयुक्त है।
- source_word: עַבְדֶּךָ
  choice: आपका सेवक
  rationale: मूल उत्तर संक्षिप्त और अध्याहृत है—शाब्दिक रूप से ‘आपका सेवक’। इसे ज्यों का त्यों रखने से दरबारी विनम्रता और कथन की संक्षिप्तता बनी रहती है।
