source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר צִיבָא֙ אֶל הַ/מֶּ֔לֶךְ כְּ/כֹל֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֲדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ אֶת עַבְדּ֔/וֹ כֵּ֖ן יַעֲשֶׂ֣ה עַבְדֶּ֑/ךָ וּ/מְפִיבֹ֗שֶׁת אֹכֵל֙ עַל שֻׁלְחָנִ֔/י כְּ/אַחַ֖ד מִ/בְּנֵ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/011.yaml
  text: Ziba said to the king[a], “According to all that my lord the king commands his servant[b], so your servant will do.” And Mephibosheth ate at my table like one of the king’s sons.
translation:
  language: hi
  text: सीबा ने राजा से कहा, “मेरे स्वामी राजा अपने सेवक को जो कुछ आज्ञा दें, आपका सेवक वैसा ही करेगा।” और मपीबोशेत राजा के पुत्रों में से एक के समान मेरी मेज़ पर[a] भोजन करता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘मेरी मेज़।’ व्यक्ति-परिवर्तन को सहज करने के लिए कुछ अनुवाद ‘राजा की मेज़’ करते हैं, पर मसोरेटिक पाठ प्रथम पुरुष को बनाए रखता है, जो संभवतः दाऊद के दृष्टिकोण को दर्शाता है।'
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने ... कहा
  rationale: इब्रानी कथात्मक शैली में אמר का यह सामान्य वाक्य-परिचायक प्रयोग है; आधुनिक हिन्दी में ‘ने ... कहा’ स्वाभाविक है।
- source_word: כְּכֹל אֲשֶׁר יְצַוֶּה
  choice: जो कुछ आज्ञा दें
  rationale: यह כְּכֹל אֲשֶׁר की व्यापकता और צוה के आज्ञा देने के भाव को सहज, आदरसूचक हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: मेरे स्वामी राजा
  rationale: यह राजदरबार के सम्मानसूचक संबोधन को बनाए रखता है और हिन्दी में स्पष्ट है।
- source_word: עַבְדּוֹ / עַבְדֶּךָ
  choice: अपने सेवक / आपका सेवक
  rationale: यहाँ עבד दासत्व पर बल देने के बजाय राजकीय सेवा में विनम्र आत्म-संबोधन है; इसलिए ‘सेवक’ प्रसंगानुकूल है।
- source_word: כֵּן יַעֲשֶׂה
  choice: वैसा ही करेगा
  rationale: यह כֵּן की अनुरूपता और प्रतिज्ञासूचक अपूर्ण क्रिया का भाव सुरक्षित रखता है।
- source_word: אֹכֵל
  choice: भोजन करता था
  rationale: Qal participle नियमित या जारी व्यवस्था का भाव दे सकता है; हिन्दी का अपूर्ण भूतकाल उस स्थायी भोजन-अधिकार को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל שֻׁלְחָנִי
  choice: मेरी मेज़ पर
  rationale: मसोरेटिक पाठ के प्रथम पुरुष एकवचन प्रत्यय ‘मेरी’ को बदले बिना रखा गया है; ‘मेज़ पर भोजन करना’ हिन्दी में स्वाभाविक प्रयोग है।
- source_word: כְּאַחַד מִבְּנֵי הַמֶּלֶךְ
  choice: राजा के पुत्रों में से एक के समान
  rationale: यह तुलना तथा मपीबोशेत को दिए गए राजपुत्र-समान स्थान, दोनों को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: अंतिम उपवाक्य में ‘मेरी मेज़’ का वक्ता
  choice: मसोरेटिक पाठ के प्रथम पुरुष ‘मेरी मेज़’ को मुख्य पाठ में बनाए रखा गया।
  alternative: स्पष्टता के लिए ‘राजा की मेज़’ करना, जैसा कुछ प्राचीन साक्ष्यों और आधुनिक अनुवादों में मिलता है।
  rationale: इब्रानी שֻׁלְחָנִי का सीधा अर्थ ‘मेरी मेज़’ है। सीबा के कथन के बाद व्यक्ति-परिवर्तन असामान्य है, पर उसे चुपचाप समतल करना पाठ की वास्तविक कठिनाई को मिटा देगा; इसलिए प्रथम पुरुष रखा गया और पादटिप्पणी में विकल्प समझाया गया।
- issue: אֹכֵל का कालगत भाव
  choice: ‘भोजन करता था’ द्वारा जारी अथवा नियमित व्यवस्था व्यक्त की गई।
  alternative: ‘भोजन किया’ या ‘भोजन करता है’।
  rationale: सहभागी रूप केवल एक बार की घटना से अधिक, मपीबोशेत की स्थापित स्थिति का संकेत देता है; हिन्दी का ‘करता था’ इस प्रसंग में उपयुक्त है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण किंतु सहज शैली अपनाई गई है। राजदरबारी विनम्रता के लिए ‘मेरे स्वामी राजा’, ‘अपने सेवक’ और ‘आपका सेवक’ रखा गया है। पाठ की असामान्य प्रथम-पुरुष अभिव्यक्ति को मुख्य पाठ में सुरक्षित रखकर पादटिप्पणी में स्पष्ट किया गया है।
