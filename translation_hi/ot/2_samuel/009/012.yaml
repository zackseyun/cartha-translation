id: 2SA.9.12
reference: 2 Samuel 9:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לִ/מְפִיבֹ֥שֶׁת בֵּן קָטָ֖ן וּ/שְׁמ֣/וֹ מִיכָ֑א וְ/כֹל֙ מוֹשַׁ֣ב בֵּית צִיבָ֔א עֲבָדִ֖ים לִ/מְפִיבֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/012.yaml
  text: Mephibosheth had a young son[a], and his name was Mica[b]. And all who lived in the house of Ziba were servants to Mephibosheth.
translation:
  language: hi
  text: मपीबोशेत का एक छोटा बेटा था, जिसका नाम मीका था। और सीबा के घर में रहनेवाले सभी लोग मपीबोशेत के सेवक[a] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दास।” इब्रानी शब्द का अर्थ प्रसंग के अनुसार “सेवक” या “दास” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/מְפִיבֹשֶׁת
  choice: मपीबोशेत का ... था
  rationale: लामेद के साथ यह इब्रानी अस्तित्व–स्वामित्व की रचना है, जिसका स्वाभाविक हिन्दी रूप ‘मपीबोशेत का ... था’ है।
- source_word: בֵּן קָטָן
  choice: एक छोटा बेटा
  rationale: קָטָן यहाँ बेटे की कम आयु या छोटे होने को बताता है। ‘छोटा बेटा’ सहज हिन्दी है और स्रोत की संक्षिप्तता बनाए रखता है।
- source_word: וּ/שְׁמ/וֹ מִיכָא
  choice: जिसका नाम मीका था
  rationale: यह बेटे का नाम बताने वाला उपवाक्य है। ‘जिसका नाम ... था’ हिन्दी में प्रवाहपूर्ण रहते हुए अर्थ को ठीक रखता है।
- source_word: וְ/כֹל מוֹשַׁב בֵּית צִיבָא
  choice: और सीबा के घर में रहनेवाले सभी लोग
  rationale: מוֹשַׁב यहाँ सामूहिक रूप से घर में निवास करने वालों की ओर संकेत करता है। अनुवाद उस सामूहिक मानवीय संदर्भ को स्पष्ट करता है, पर उसे केवल रक्त-संबंधी परिवार तक सीमित नहीं करता।
- source_word: עֲבָדִים
  choice: सेवक
  rationale: עֶבֶד का अर्थ प्रसंग के अनुसार सेवक या दास हो सकता है। यहाँ घरेलू सेवा-व्यवस्था पर बल है; इसलिए मुख्य पाठ में ‘सेवक’ स्वाभाविक है और वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: לִ/מְפִיבֹשֶׁת
  choice: मपीबोशेत के
  rationale: सेवा-संबंध बताने वाले ל का हिन्दी में ‘मपीबोशेत के सेवक’ सहज और निकट अर्थ है; यह अनावश्यक रूप से स्वामित्व की प्रकृति निर्धारित नहीं करता।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। व्यक्तिनामों के लिए हिन्दी बाइबल परंपरा में प्रचलित रूप ‘मपीबोशेत,’ ‘मीका’ और ‘सीबा’ अपनाए गए हैं। अंग्रेज़ी परामर्श-पाठ की पादटिप्पणी-संख्या अर्थ से असंगत दिखाई देती है; इसलिए स्रोत के वास्तविक शब्दार्थ-संदेह को सही स्थान पर चिह्नित किया गया है।
