base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/018.yaml
  text: Abishai[a], the brother of Joab son of Zeruiah, was chief of the Three. He wielded his spear against three hundred and killed them[b], and he had a name among the Three.
translation:
  language: hi
  text: और सरूयाह के पुत्र योआब का भाई अबीशै[a] उन तीनों का प्रधान था। उसने अपना भाला तीन सौ के विरुद्ध उठाया और उन्हें मार डाला[b], और उन तीनों में उसका नाम था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पाठ: “उन तीनों का प्रधान।” 1 इतिहास 11:20 के समानांतर पाठ और इस खंड की पाठगत अनिश्चितता के कारण कुछ व्याख्याकार यहाँ दल को “तीस” समझते हैं।'
    reason: textual_variant
  - marker: b
    text: या “उसने तीन सौ के विरुद्ध अपना भाला चलाया।” इब्रानी बहुत संक्षिप्त है; शाब्दिक रूप से, “उसने तीन सौ मारे हुओं के विरुद्ध अपना भाला उठाया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ הַשְּׁלֹשִׁי
  choice: उन तीनों का प्रधान
  rationale: רֹאשׁ का अर्थ ‘प्रधान/मुखिया’ है। कठिन मसोरी पाठ और इसी पद के अंत में בַּשְּׁלֹשָׁה को ध्यान में रखते हुए मुख्य पाठ में विशिष्ट दल ‘वे तीन’ रखा गया है; ‘तीस’ की संभावना पादटिप्पणी में है।
- source_word: עוֹרֵר אֶת־חֲנִיתוֹ
  choice: अपना भाला चलाया
  rationale: עורר का मूल भाव ‘उठाना/जगा देना’ है; युद्ध के प्रसंग में भाले को सक्रिय रूप से प्रयोग करने का स्वाभाविक हिन्दी रूप ‘भाला चलाया’ है।
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: तीन सौ मारे हुओं पर
  rationale: חָלָל ‘मारा हुआ/घायल होकर गिरा हुआ’ व्यक्ति है। संक्षिप्त इब्रानी वाक्यांश को बिना अलग क्रिया ‘मार डाला’ जोड़े यथासंभव सुरक्षित रखा गया है।
- source_word: וְלוֹ שֵׁם
  choice: उसका नाम था
  rationale: शाब्दिक इब्रानी मुहावरा प्रतिष्ठा या ख्याति सूचित करता है; ‘उसका नाम था’ उस मुहावरे और उसकी संक्षिप्तता दोनों को बनाए रखता है।
- source_word: בַּשְּׁלֹשָׁה
  choice: उन तीनों में
  rationale: בְּ के साथ संख्या यहाँ दल के बीच स्थान या प्रतिष्ठा बताती है; इसलिए ‘उन तीनों में’ रखा गया है।
- source_word: אֲבִישַׁי ... יוֹאָב ... צְרוּיָה
  choice: अबीशै ... योआब ... सरूयाह
  rationale: व्यक्तिनामों का आधुनिक हिन्दी बाइबलीय परंपरा के अनुरूप देवनागरी लिप्यंतरण किया गया है।
