  text: he is like the light of morning when the sun rises[a], a morning without clouds; from brightness, from rain[b], grass from the earth.
translation:
  language: hi
  text: वह भोर के प्रकाश के समान है, जब सूर्य उदय होता है[a]—बादलरहित भोर; वर्षा के बाद की चमक में[b] धरती से कोमल घास निकलती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप: “और भोर के प्रकाश के समान।” इब्रानी पंक्ति संक्षिप्त है और पिछले पद में वर्णित शासक का चित्रण आगे बढ़ाती है।'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में अत्यन्त संक्षिप्त रूप से “चमक से, वर्षा से, धरती से घास” है। इन पूर्वसर्गों का सटीक सम्बन्ध स्पष्ट नहीं है; सम्भवतः वर्षा के बाद उजाले में उगती नई घास का दृश्य अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְאוֹר
  choice: वह ... प्रकाश के समान है
  rationale: וּ के साथ तुलनार्थक כְּ पिछले पद के धर्मी शासक का उपमान आगे बढ़ाता है। इब्रानी में वाक्य क्रियारहित और संक्षिप्त है; स्वाभाविक हिन्दी के लिए संदर्भानुसार ‘वह ... है’ जोड़ा गया है।
- source_word: בֹּקֶר
  choice: भोर
  rationale: दोनों स्थानों पर בֹּקֶר प्रातःकाल को दर्शाता है। ‘भोर’ काव्यात्मक, सहज और उगते सूर्य के प्रसंग के अनुकूल है।
- source_word: יִזְרַח שָׁמֶשׁ
  choice: जब सूर्य उदय होता है
  rationale: זָרַח सूर्य के चमकने या उदित होने को व्यक्त करता है; यह हिन्दी में स्वाभाविक रूप से उस दृश्य को सामने रखता है।
- source_word: בֹּקֶר לֹא עָבוֹת
  choice: बादलरहित भोर
  rationale: शाब्दिक भाव ‘ऐसी भोर जिसमें बादल न हों’ है। संयुक्त विशेषण संक्षिप्तता और काव्यात्मकता बनाए रखता है।
- source_word: מִנֹּגַהּ
  choice: उज्ज्वल धूप से
  rationale: נֹגַהּ का अर्थ चमक या उजाला है। यहाँ वर्षा के बाद के प्रकाश से जुड़ा प्राकृतिक दृश्य है; ‘उज्ज्वल धूप’ साधारण हिन्दी में दृश्य को स्पष्ट करती है।
- source_word: מִמָּטָר
  choice: वर्षा के बाद की
  rationale: मूल में מִן का संक्षिप्त काव्यात्मक प्रयोग है। प्रसंग में वर्षा के बाद चमक और फिर अंकुरित वनस्पति का दृश्य सम्भावित है; इसलिए कालगत सम्बन्ध मुख्य पाठ में दिया गया, जबकि मूल की संपीड़ित रचना पादटिप्पणी में सुरक्षित है।
- source_word: דֶּשֶׁא
  choice: कोमल घास
  rationale: דֶּשֶׁא नई, हरी और अंकुरित वनस्पति को सूचित कर सकता है। ‘कोमल घास’ इस ताजगी को स्पष्ट और सहज ढंग से व्यक्त करती है।
- source_word: מֵאָרֶץ
  choice: धरती में से
  rationale: यह उस भूमि को दर्शाता है जिसमें से घास निकलती है। ‘धरती में से’ मूल के स्रोत-बोध और काव्यात्मक छवि को बनाए रखता है।
theological_decisions:
- issue: उपमा का निहित कर्ता
  choice: पिछले पद के धर्मी शासक को सूचित करने के लिए ‘वह’ स्पष्ट किया गया है।
  alternative: ‘और भोर के प्रकाश के समान...’ कहकर मूल की खंडित, क्रियारहित रचना ज्यों की त्यों छोड़ी जा सकती है।
  rationale: इब्रानी पंक्ति अर्थ के लिए पद 3 पर निर्भर है। हिन्दी में कर्ता स्पष्ट करने से कोई नई धर्मवैज्ञानिक पहचान नहीं जोड़ी जाती, केवल संदर्भगत सम्बन्ध सुबोध होता है।
- issue: अन्तिम पंक्ति के पूर्वसर्गों का सम्बन्ध
  choice: वर्षा के बाद की उज्ज्वल धूप में धरती से कोमल घास निकलने का प्राकृतिक दृश्य व्यक्त किया गया है।
  alternative: 'अधिक शाब्दिक और अस्पष्ट रूप: ‘चमक से, वर्षा से, धरती से घास।’'
  rationale: मूल काव्य अत्यन्त संपीड़ित है और מִן की पुनरावृत्ति के पारस्परिक सम्बन्ध को पूरी तरह स्पष्ट नहीं करता। मुख्य पाठ सम्भावित दृश्य को स्वाभाविक हिन्दी में देता है, पर पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु साधारण पाठक के लिए सहज। ‘भोर’, ‘उज्ज्वल धूप’ और ‘कोमल घास’ से काव्यात्मक प्राकृतिक बिम्ब रखा गया है। मूल की दीर्घवृत्तीय रचना और अन्तिम पंक्ति की अस्पष्टता को मुख्य पाठ में पठनीय बनाया गया है तथा पादटिप्पणियों में अधिक शाब्दिक रूप सुरक्षित रखा गया है।
