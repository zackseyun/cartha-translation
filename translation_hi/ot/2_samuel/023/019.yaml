- source_word: נִכְבָּד
  choice: अधिक सम्मानित
  rationale: כבד का निफ़अल रूप यहाँ प्रतिष्ठित या आदर पाया हुआ होने का भाव देता है; तुलनात्मक रचना के कारण ‘अधिक सम्मानित’ उपयुक्त है।
- source_word: וַיְהִי לָהֶם לְשָׂר
  choice: इसलिए वह उनका प्रधान बना
  rationale: שַׂר सैन्य प्रसंग में अगुआ, प्रधान या सेनानायक को सूचित करता है। ‘प्रधान’ पदनाम को अनावश्यक रूप से अधिक विशिष्ट बनाए बिना नेतृत्व का भाव रखता है।
- source_word: וְעַד הַשְּׁלֹשָׁה לֹא בָא
  choice: फिर भी वह उन तीनों के पद तक नहीं पहुँचा
  rationale: शाब्दिक ‘नहीं आया’ यहाँ दर्जे या प्रतिष्ठा के स्तर तक न पहुँचने का मुहावरा है; ‘पद तक नहीं पहुँचा’ आधुनिक हिन्दी में इसे स्पष्ट करता है।
