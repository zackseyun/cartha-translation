  yaml_path: translation/ot/2_samuel/023/019.yaml
  text: Was he not more honored than the three? So he became their commander[b][a], but he did not attain to the three.
translation:
  language: hi
  text: क्या वह उन तीनों से अधिक सम्मानित न था?[a] और वह उनका प्रधान बना, फिर भी वह उन तीनों के पद तक नहीं पहुँचा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या वह तीनों में सम्मानित न था?” इब्रानी वाक्यांश को कम तुलनात्मक अर्थ में भी समझा जा सकता है, पर वाक्य-विन्यास और निकटवर्ती समानांतर कथन के आधार पर “तीनों से अधिक सम्मानित” अर्थ अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात वह दाऊद के वीरों में सर्वोच्च श्रेणी वाले “तीनों” के पद या प्रतिष्ठा तक नहीं पहुँचा।
    reason: cultural_note
