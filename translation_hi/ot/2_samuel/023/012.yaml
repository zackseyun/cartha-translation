base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/012.yaml
  text: But he took his stand in the middle of the field and defended it[a], and struck down the Philistines; and Yahweh brought about a great victory.
translation:
  language: hi
  text: पर वह खेत के बीच में डटकर खड़ा हो गया और उसे बचाया। उसने पलिश्तियों को मार गिराया, और याहवे ने बड़ी विजय[a] दिलाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बड़ा छुटकारा’ अथवा ‘बड़ा उद्धार।’ इब्रानी शब्द में ये सभी अर्थ हो सकते हैं; यहाँ यह युद्ध में याहवे के बचाने वाले कार्य को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְיַצֵּב
  choice: डटकर खड़ा हो गया
  rationale: हित्पएल रूप जानबूझकर अपना स्थान लेने और दृढ़ता से खड़े रहने का भाव देता है; युद्ध के प्रसंग में यह स्वाभाविक हिन्दी है।
- source_word: בְּתוֹךְ הַחֶלְקָה
  choice: खेत के बीच में
  rationale: חֶלְקָה भूमि के किसी खेत या भूखंड को सूचित कर सकता है; इस युद्ध-वृत्तांत में ‘खेत’ सहज और स्पष्ट है।
- source_word: וַיַּצִּילֶהָ
  choice: उसे बचाया
  rationale: נצל का मूल भाव बचाने या छुड़ाने का है। स्त्रीलिंग प्रत्यय खेत/भूमि की ओर संकेत करता है; ‘उसे बचाया’ इस संदर्भ को बनाए रखता है।
- source_word: וַיַּךְ אֶת־פְּלִשְׁתִּים
  choice: पलिश्तियों को मार गिराया
  rationale: युद्ध के प्रसंग में נכה प्रहार करके गिराने या पराजित करने का अर्थ देता है; ‘मार गिराया’ उसकी प्रबलता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיַּעַשׂ יְהוָה
  choice: याहवे ने ... दिलाई
  rationale: עשה के साथ תְּשׁוּעָה का आशय परिणाम को घटित करने से है। ‘विजय दिलाई’ हिन्दी में परमेश्वर की निर्णायक कर्तृता स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुर्वर्णीय व्यक्तिगत नाम को पदवी से बदलने के बजाय हिन्दी में उसका प्रचलित निकट लिप्यंतरण रखा गया है।
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: बड़ी विजय
  rationale: תְּשׁוּעָה में उद्धार, छुटकारा और विजय के अर्थ संभव हैं; तत्कालीन युद्ध-संदर्भ में ‘बड़ी विजय’ सबसे स्पष्ट है, जबकि अन्य अर्थ पाद-टिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में व्यक्तिगत नाम प्रत्यक्ष रूप से है; ‘याहवे’ उसे पदवी में बदले बिना प्रस्तुत करता है।
- issue: युद्ध-संदर्भ में תְּשׁוּעָה का अर्थ
  choice: विजय
  alternative: छुटकारा अथवा उद्धार
  rationale: यहाँ परिणाम युद्ध में पलिश्तियों पर जय है, इसलिए मुख्य पाठ में ‘विजय’ उपयुक्त है; फिर भी शब्द की व्यापक उद्धार-संबंधी अर्थ-सीमा पाद-टिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। छोटे वाक्यों से युद्ध-क्रिया का क्रम स्पष्ट किया गया है; ‘डटकर’ दृढ़ प्रतिरोध का भाव व्यक्त करता है।
