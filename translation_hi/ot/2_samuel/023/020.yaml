base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/020.yaml
  text: And Benaiah son of Jehoiada[a], son of a valiant man, great in deeds, from Kabzeel—he struck down the two sons of Ariel of Moab, and he went down and struck down the lion in the midst of the pit on a snowy day.
translation:
  language: hi
  text: और यहोयादा का पुत्र बनायाह, कबसेएल के एक पराक्रमी पुरुष का पुत्र था, जिसने बड़े-बड़े काम किए थे। उसने मोआब के दो अरीएलों[a] को मार गिराया। वह बर्फ पड़ने के दिन एक गड्ढे में उतरा और उसने वहाँ उस सिंह को मार गिराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ इब्रानी शब्द אֲרִאֵל (अरीएल) का अर्थ अनिश्चित है। इसका अर्थ ‘सिंह-सदृश पुरुष’, ‘वीर’ हो सकता है, या यह कोई नाम अथवा उपाधि हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חי
  choice: एक पराक्रमी ... पुरुष
  rationale: पाठ में חי का रूप असामान्य है और संभवतः חַיִל से संबंधित पाठ-परंपरा या संक्षिप्त प्रयोग को दर्शाता है। वीरों की सूची के संदर्भ में ‘पराक्रमी पुरुष’ केवल ‘जीवित पुरुष’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: רַב פְּעָלִים
  choice: बड़े-बड़े काम करनेवाले
  rationale: यह अभिव्यक्ति अनेक उल्लेखनीय कारनामों या महान कार्यों के लिए प्रसिद्ध होने का भाव देती है; आधुनिक हिन्दी में यह सहज और गरिमापूर्ण है।
- source_word: מִקַּבְצְאֵל
  choice: कबसेएल के
  rationale: מִן उद्गम या निवास-स्थान बताता है। हिन्दी में व्यक्ति के स्थान-संबंध के लिए ‘कबसेएल के’ स्वाभाविक है।
- source_word: הִכָּה
  choice: मार गिराया
  rationale: युद्ध और वीरतापूर्ण कारनामों के संदर्भ में נכה की हिंसक और निर्णायक क्रिया को व्यक्त करता है, बिना अनावश्यक विवरण जोड़े।
- source_word: שְׁנֵי אֲרִאֵל מוֹאָב
  choice: मोआब के दो अरीएलों
  rationale: אֲרִאֵל का अर्थ यहाँ विवादित है। लिप्यंतरण मूल की अनिश्चितता को सुरक्षित रखता है और ‘वीर’, ‘सिंह-सदृश पुरुष’ या नाम/उपाधि में से किसी एक अर्थ को मुख्य पाठ में थोपता नहीं।
- source_word: יָרַד
  choice: उतरा
  rationale: गड्ढे में नीचे जाने की सामान्य और स्पष्ट हिन्दी अभिव्यक्ति।
- source_word: הָאֲרִי
  choice: एक सिंह
  rationale: संज्ञा स्पष्टतः सिंह को सूचित करती है; हिन्दी कथन में पहली बार उल्लेख होने के कारण ‘एक सिंह’ स्वाभाविक है।
- source_word: בְּתוֹךְ הַבּוֹר
  choice: एक गड्ढे में ... वहाँ
  rationale: בּוֹר के व्यापक अर्थ ‘गड्ढा’ को रखा गया है। वाक्य-विन्यास में ‘वहाँ’ जोड़कर בְּתוֹךְ का भीतर होने का भाव सहज हिन्दी में व्यक्त होता है।
- source_word: בְּיוֹם הַשָּׁלֶג
  choice: बर्फ पड़ने के दिन
  rationale: ‘हिम के दिन’ जैसी कृत्रिम शब्दशः अभिव्यक्ति के बजाय बर्फ से चिह्नित दिन का स्वाभाविक आधुनिक हिन्दी रूप।
theological_decisions:
- issue: רַב פְּעָלִים का संबंध बनायाह से है या उसके पिता से
  choice: इसे निकटवर्ती ‘पराक्रमी पुरुष’ के साथ रखा गया
  alternative: इसे बनायाह के अपने बड़े-बड़े कामों का वर्णन मानना
  rationale: हिब्रू संज्ञा-श्रृंखला में संबंध पूरी तरह निर्विवाद नहीं है। निकटवर्ती पदबंध के साथ रखना वाक्य-संरचना का सीधा पठन है, जबकि बनायाह के आगे वर्णित कारनामे उसके पराक्रम को अलग से स्पष्ट करते हैं। यह निर्णय किसी सिद्धान्तगत निष्कर्ष को प्रभावित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल कथात्मक शैली रखी गई है। विवादित אֲרִאֵל को अर्थ-निर्णय किए बिना देवनागरी में लिप्यंतरित किया गया है और मुख्य पाठ में पाद-टिप्पणी संकेत [a] दिया गया है।
