base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/021.yaml
  text: He also struck down an Egyptian[a], a man of impressive appearance. The Egyptian had a spear in his hand, and he went down to him with a staff, snatched the spear from the Egyptian’s hand[b], and killed him with his own spear.
translation:
  language: hi
  text: उसने एक मिस्री को भी मार गिराया, जो देखने में प्रभावशाली था।[a] उस मिस्री के हाथ में एक भाला था। वह लाठी[b] लेकर मिस्री के पास नीचे उतरा, उसके हाथ से भाला छीन लिया और उसी के भाले से उसे मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो सुंदर था” या “जिसका रूप उल्लेखनीय था।” इब्रानी अभिव्यक्ति सामान्य रूप से उसके बाहरी रूप को बताती है। 1 इतिहास 11:23 के समानांतर विवरण के आधार पर कुछ लोग इसे उसकी असाधारण ऊँचाई का संकेत मानते हैं।
    reason: lexical_alternative
  - marker: b
    text: या “डंडा” अथवा “छड़ी।” इब्रानी शब्द שֵׁבֶט प्रसंग के अनुसार लाठी, डंडा, राजदंड या डंडे-जैसे हथियार को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: मार गिराया
  rationale: नכה का मूल अर्थ ‘मारना/प्रहार करना’ है। युद्ध-संदर्भ में ‘मार गिराया’ स्वाभाविक है और अंतिम खंड में आए स्पष्ट ‘मार डाला’ से कथात्मक भेद बनाए रखता है।
- source_word: אִישׁ מִצְרִי
  choice: एक मिस्री
  rationale: आधुनिक हिन्दी में जातीय पहचान व्यक्त करने का यह संक्षिप्त और स्वाभाविक रूप है।
- source_word: אשר מַרְאֶה (पाठ-परंपरा में אִישׁ מַרְאֶה)
  choice: जो देखने में प्रभावशाली था
  rationale: מַרְאֶה बाहरी रूप या दिखाई देने वाली काया को सूचित करता है। यह अनुवाद सुंदरता या असाधारण ऊँचाई में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וּבְיַד הַמִּצְרִי חֲנִית
  choice: उस मिस्री के हाथ में एक भाला था
  rationale: इब्रानी अस्तित्व/अधिकार-रचना को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיֵּרֶד אֵלָיו
  choice: वह ... उसके पास नीचे उतरा
  rationale: ירד की नीचे जाने या उतरने की स्थानिक छवि सुरक्षित रखी गई है; इसे केवल ‘उस पर चढ़ आया’ जैसे व्याख्यात्मक युद्ध-वाक्य में नहीं बदला गया।
- source_word: בַּשָּׁבֶט
  choice: लाठी
  rationale: שֵׁבֶט के अर्थों में लाठी, डंडा, राजदंड और गदा-जैसा हथियार सम्मिलित हो सकते हैं। यहाँ ‘लाठी’ व्यापक, सहज और अपेक्षाकृत कम व्याख्यात्मक विकल्प है।
- source_word: וַיִּגְזֹל
  choice: छीन लिया
  rationale: גזל में बलपूर्वक ले लेने का भाव है; युद्ध के इस दृश्य में ‘छीन लिया’ उसे ठीक और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיַּהַרְגֵהוּ
  choice: उसे मार डाला
  rationale: הרג के स्पष्ट वध-अर्थ को आधुनिक, सीधी हिन्दी में व्यक्त करता है।
- source_word: בַּחֲנִיתוֹ
  choice: उसी के भाले से
  rationale: सर्वनाम-प्रत्यय का निकटतम और स्वाभाविक संदर्भ मिस्री है, जिससे अभी भाला छीना गया था; ‘उसी के’ युद्ध में हुए उलटाव को स्पष्ट करता है।
- source_word: וְהוּא
  choice: उसने ... भी
  rationale: यह पिछले वीर-कर्मों की सूची को आगे बढ़ाता है; हिन्दी में ‘भी’ उसके योगात्मक बल को सहजता से व्यक्त करता है।
