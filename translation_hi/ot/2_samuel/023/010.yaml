base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/010.yaml
  text: He rose and struck down the Philistines until his hand grew weary and his hand clung to the sword[a]. And Yahweh brought about a great victory on that day[b], and the people returned after him only to strip the slain.
translation:
  language: hi
  text: वह उठ खड़ा हुआ और पलिश्तियों को तब तक मारता रहा, जब तक उसका हाथ थक गया और तलवार से चिपक गया। उस दिन याहवे ने बड़ी विजय दिलाई[a]। लोग उसके पीछे लौटे, पर केवल मारे हुओं का सामान उतारने के लिए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बड़ा छुटकारा’ अथवा ‘महान उद्धार’। इब्रानी शब्द व्यापक अर्थ में बचाव या छुटकारे को दर्शा सकता है; यहाँ उसका संबंध युद्ध में याहवे द्वारा दिए गए निर्णायक छुटकारे से है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात युद्ध के बाद मारे गए शत्रुओं से हथियार, वस्त्र और अन्य लूट का सामान उतारना।
    reason: cultural_note
lexical_decisions:
- source_word: קָם
  choice: उठ खड़ा हुआ
  rationale: यहाँ क्रिया युद्ध में निर्णायक रूप से आगे बढ़कर कार्रवाई करने को व्यक्त करती है; यह हिन्दी में स्वाभाविक और सशक्त है।
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים
  choice: पलिश्तियों को ... मारता रहा
  rationale: सैन्य प्रसंग में נכה प्रहार करने और मार गिराने का भाव रखता है। निरंतर क्रिया अगले ‘जब तक’ खंड के साथ युद्ध की अवधि स्पष्ट करती है।
- source_word: עַד כִּי יָגְעָה יָדוֹ
  choice: जब तक उसका हाथ थक नहीं गया
  rationale: יגע शारीरिक थकावट को दर्शाता है; यह रूप हिन्दी में स्वाभाविक है और मूल के परिणामसूचक भाव को बनाए रखता है।
- source_word: וַתִּדְבַּק יָדוֹ אֶל הַחֶרֶב
  choice: तलवार से चिपक नहीं गया
  rationale: דבק का मूल भाव चिपकने या दृढ़ता से लगे रहने का है। अनुवाद उस सजीव चित्र को रखता है और इसे ऐंठन अथवा अतिशयोक्ति में से किसी एक तक सीमित नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चार-अक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित ध्वन्यात्मक रूप में रखा गया है।
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: बड़ी विजय
  rationale: תשועה का अर्थ छुटकारा, उद्धार या विजय हो सकता है; तत्काल युद्ध-प्रसंग में ‘विजय’ ठोस अर्थ को सबसे स्पष्ट रूप से व्यक्त करता है।
- source_word: וַיַּעַשׂ יְהוָה תְּשׁוּעָה
  choice: याहवे ने ... विजय दिलाई
  rationale: अमूर्त संज्ञा תשועה के साथ עשה को हिन्दी में ‘विजय दिलाई’ कहना स्वाभाविक है और विजय में परमेश्वर की निर्णायक भूमिका स्पष्ट रखता है।
- source_word: וְהָעָם יָשֻׁבוּ אַחֲרָיו
  choice: लोग उसके पीछे लौटे
  rationale: यह मूल की गति और क्रम को बिना ‘सैनिक’ जैसी अनुल्लिखित पहचान जोड़े निकटता से रखता है।
- source_word: אַךְ לְפַשֵּׁט
  choice: पर केवल मारे हुओं का सामान उतारने के लिए
  rationale: युद्ध के बाद פשט गिरे हुए शत्रुओं से हथियार, वस्त्र और लूट का सामान उतारने को दर्शाता है; ‘केवल’ אַךְ के सीमित करने वाले बल को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। लिप्यंतरण उस नाम को बनाए रखता है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: युद्ध के प्रसंग में תְּשׁוּעָה का अर्थ
  choice: विजय
  alternative: बड़ा छुटकारा; महान उद्धार
  rationale: निकट प्रसंग सैन्य है, इसलिए ‘विजय’ तत्काल आशय स्पष्ट करता है; फिर भी पादटिप्पणी शब्द के व्यापक छुटकारे/उद्धार संबंधी अर्थ को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। युद्ध-वर्णन की तीव्रता और हाथ के तलवार से चिपक जाने का सजीव, किंचित अस्पष्ट चित्र सुरक्षित है। पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
