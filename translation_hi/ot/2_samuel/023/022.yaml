base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/022.yaml
  text: These things Benaiah son of Jehoiada did[b][a], and he had a name among the three mighty men.
translation:
  language: hi
  text: ये काम यहोयादा के पुत्र बनायाह ने किए,[a] और तीन वीरों में उसका बड़ा नाम था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात वे वीरतापूर्ण काम जिनका वर्णन इससे पहले हुआ है।
    reason: lexical_clarification
  - marker: b
    text: शाब्दिक रूप से, “और तीन वीरों में उसका नाम था,” अर्थात वह उनके बीच प्रसिद्ध था। दाऊद के योद्धाओं की विस्तृत सूची को ध्यान में रखकर कुछ व्याख्याकार यहाँ “तीस वीरों” से सम्बन्ध मानते हैं; परन्तु यहाँ का हिब्रू पाठ “तीन” कहता है।
    reason: lexical_alternative_and_textual_variant
lexical_decisions:
- source_word: אֵלֶּה עָשָׂה
  choice: ये काम ... ने किए
  rationale: संकेतवाचक शब्द पहले बताए गए वीरतापूर्ण कारनामों की ओर लौटता है; यह हिन्दी में स्वाभाविक और मूल के निकट है।
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: यहोयादा के पुत्र बनायाह
  rationale: सम्बन्धवाचक हिब्रू संरचना को सहज हिन्दी में प्रस्तुत किया गया है और व्यक्तिनामों का लिप्यंतरण किया गया है।
- source_word: וְלוֹ שֵׁם
  choice: उसका बड़ा नाम था
  rationale: शाब्दिक अर्थ 'उसका नाम था' प्रतिष्ठा या यश का हिब्रू मुहावरा है; 'बड़ा नाम था' हिन्दी में उसी मुहावरे का स्वाभाविक समानार्थी है।
- source_word: בִּשְׁלֹשָׁה הַגִּבֹּרִים
  choice: तीन वीरों में
  rationale: प्राप्त हिब्रू पाठ स्पष्ट रूप से 'तीन' पढ़ता है; גִּבֹּרִים यहाँ दाऊद के विशिष्ट वीर योद्धाओं को सूचित करता है।
