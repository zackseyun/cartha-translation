lexical_decisions:
- source_word: אֲבִיעֶזֶר
  choice: अबीएज़ेर
  rationale: व्यक्तिवाचक नाम का अनुवाद करने के बजाय उसके इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: הָעַנְּתֹתִי
  choice: अनातोतवासी
  rationale: यह अनातोत से संबंध या मूल निवास बताने वाला जातिवाचक रूप है; ‘अनातोतवासी’ इब्रानी की संक्षिप्त संज्ञात्मक शैली को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מְבֻנַּי
  choice: मबुन्नै
  rationale: यह व्यक्तिवाचक नाम है; मसोरेटिक पाठ के स्वरांकन के अनुसार इसका देवनागरी लिप्यंतरण किया गया है।
- source_word: הַחֻשָׁתִי
  choice: हूशावासी
  rationale: यह हूशा से संबंध, मूल निवास या कुलीय जुड़ाव सूचित करने वाला जातिवाचक रूप है; ‘हूशावासी’ समानांतर इब्रानी संरचना को स्पष्ट और संक्षिप्त रखता है।
