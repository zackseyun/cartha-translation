  yaml_path: translation/ot/2_samuel/023/002.yaml
  text: The Spirit of Yahweh spoke by me[a], and his word was on my tongue.
translation:
  language: hi
  text: याहवेह की आत्मा मेरे द्वारा बोली[a], और उसका वचन मेरी जीभ पर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे माध्यम से बोली।” इब्रानी संबंधबोधक अव्यय यहाँ माध्यम या साधन का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֥וּחַ יְהוָ֖ה
  choice: याहवेह का आत्मा
  rationale: भविष्यवाणी के इस प्रसंग में רוּחַ परमेश्वर की वाणी के सक्रिय माध्यम को दर्शाता है, इसलिए ‘आत्मा’ उपयुक्त है; יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवेह’ से व्यक्त किया गया है।
- source_word: דִּבֶּר
  choice: बोला
  rationale: यह क्रिया सीधे बोलने को व्यक्त करती है। काव्यात्मक स्मरण के संदर्भ में सामान्य भूतकाल स्वाभाविक है।
- source_word: בִּי
  choice: मेरे द्वारा
  rationale: בְּ यहाँ साधन अथवा माध्यम का भाव दे सकता है। ‘मेरे द्वारा’ मूल संरचना और अर्थ को निकटता से रखता है; सहज विकल्प ‘मेरे माध्यम से’ पादटिप्पणी में दिया गया है।
- source_word: וּמִלָּתוֹ
  choice: और उसका वचन
  rationale: מִלָּה का अर्थ ‘वचन’ या ‘कथन’ है। ‘वचन’ दैवी कथन का शाब्दिक और प्रसंगगत भार बनाए रखता है।
- source_word: עַל לְשׁוֹנִי
  choice: मेरी जीभ पर था
  rationale: यह इब्रानी बिंब का सीधा और आधुनिक हिन्दी में बोधगम्य रूप है; ‘मेरे मुँह में था’ अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवेह
  alternative: यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवेह’ उसे पदवी से बदलने के बजाय वाचा-नाम के रूप में सुरक्षित रखता है।
- issue: רוּחַ का अर्थ
  choice: आत्मा
  alternative: श्वास अथवा हवा
  rationale: दाऊद की भविष्यवाणी और ईश्वरीय वाणी के इस संदर्भ में ‘आत्मा’ सबसे उपयुक्त अर्थ है। यह दैवी प्रेरकता को व्यक्त करता है, पर पद से आगे कोई अतिरिक्त सैद्धान्तिक दावा नहीं जोड़ता।
- issue: בִּי में माध्यम अथवा अंतःस्थिति का भाव
  choice: मेरे द्वारा
  alternative: मुझमें
  rationale: समानांतर वाक्य ‘उसका वचन मेरी जीभ पर था’ माध्यम के अर्थ का समर्थन करता है। फिर भी इब्रानी संबंधबोधक अव्यय की वास्तविक व्यापकता को वैकल्पिक अनुवाद वाली पादटिप्पणी से स्वीकार किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मेरे द्वारा’ मूल की औपचारिक निकटता बनाए रखता है, जबकि पादटिप्पणी अधिक बोलचाल के ‘मेरे माध्यम से’ को सुरक्षित रखती है।
