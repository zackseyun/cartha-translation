base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/015.yaml
  text: And David longed and said[a], “Who will give me water to drink from the well of Bethlehem that is by the gate?”
translation:
  language: hi
  text: दाऊद ने बड़ी लालसा से कहा[a], “कौन मुझे बेतलेहेम के उस कुएँ का पानी पिलाएगा, जो फाटक के पास है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक भावानुसार, “काश, कोई मुझे बेतलेहेम के उस कुएँ का पानी पिला देता, जो फाटक के पास है!” इब्रानी में “कौन...?” का प्रयोग लालसा व्यक्त करने के लिए हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַוֶּה
  choice: बड़ी लालसा से
  rationale: हित्पाएल रूप प्रबल इच्छा या लालसा व्यक्त करता है। ‘बड़ी लालसा से’ स्वाभाविक हिन्दी में भाव की तीव्रता बनाए रखता है।
- source_word: וַיֹּאמַר
  choice: कहा
  rationale: यह सामान्य कथन-क्रिया है; मूल में ‘अपने आप से’ या ‘पुकारकर’ जैसा अतिरिक्त अर्थ स्पष्ट नहीं है।
- source_word: מִי
  choice: कौन ... पिलाएगा
  rationale: मूल के प्रश्नवाचक रूप को बनाए रखता है, जबकि प्रसंग में यह प्रश्न तीव्र अभिलाषा व्यक्त करता है।
- source_word: יַשְׁקֵנִי
  choice: मुझे ... पानी पिलाएगा
  rationale: שקה का हिफ़ील रूप किसी को पीने के लिए देना या पिलाना दर्शाता है; हिन्दी में ‘पानी पिलाना’ इसका स्वाभाविक समतुल्य है।
- source_word: מַיִם
  choice: पानी
  rationale: सामान्य और सीधा हिन्दी अर्थ।
- source_word: מִבֹּאר
  choice: कुएँ का
  rationale: בְּאֵר सामान्यतः कुएँ को दर्शाता है; ‘कुएँ का पानी’ स्रोत-सूचक מִן का स्वाभाविक हिन्दी रूप है।
- source_word: בֵּית לֶחֶם
  choice: बेतलेहेम
  rationale: स्थान-नाम का हिन्दी बाइबलीय लिप्यंतरण।
- source_word: אֲשֶׁר בַּשָּׁעַר
  choice: जो फाटक के पास है
  rationale: यह वाक्यांश उस विशेष कुएँ की पहचान करता है; ‘फाटक के पास’ स्पष्ट और स्वाभाविक है तथा स्थानगत संबंध को अनावश्यक रूप से अधिक निश्चित नहीं करता।
