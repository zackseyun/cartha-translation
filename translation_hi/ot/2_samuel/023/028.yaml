- source_word: הָאֲחֹחִי
  choice: अहोही कुल का
  rationale: संज्ञा के साथ निश्चित उपपद वाला यह कुल-सूचक विशेषण है। ‘अहोही कुल का’ आधुनिक हिन्दी में अर्थ स्पष्ट रखते हुए सूची की संक्षिप्त शैली बनाए रखता है।
- source_word: מַהְרַי
  choice: महरै
  rationale: व्यक्तिनाम का स्रोत-आधारित हिन्दी लिप्यंतरण।
- source_word: הַנְּטֹפָתִי
  choice: नतोफा का
  rationale: यह निश्चित उपपद वाला स्थान अथवा कुल-संबंध सूचक रूप है। ‘नतोफा का’ सामान्य हिन्दी पाठक के लिए स्वाभाविक है और मूल में निहित संबद्धता को अनावश्यक रूप से केवल निवास या जन्मस्थान तक सीमित नहीं करता।
