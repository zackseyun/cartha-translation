id: 2SA.23.37
reference: 2 Samuel 23:37
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: צֶ֖לֶק הָ/עַמֹּנִ֑י נַחְרַי֙ הַ/בְּאֵ֣רֹתִ֔י נשאי כְּלֵ֖י יוֹאָ֥ב בֶּן צְרֻיָֽהס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/037.yaml
  text: Zelek the Ammonite[a], Naharai the Beerothite, armor-bearer of Joab son of Zeruiah;
translation:
  language: hi
  text: अम्मोनी सेलेक; बेरोती नहरै[a], जो सरूयाह के पुत्र योआब का हथियार ढोनेवाला था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस नाम का लिप्यंतरण “नहराई” भी किया जाता है।
    reason: नाम के इब्रानी स्वरों को देवनागरी में व्यक्त करने के एक प्रचलित वैकल्पिक रूप को सुरक्षित रखना।
lexical_decisions:
- source_word: צֶלֶק
  choice: सेलेक
  rationale: व्यक्तिवाचक नाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: הָעַמֹּנִי
  choice: अम्मोनी
  rationale: यह जाति अथवा राष्ट्रीय मूल बतानेवाला विशेषण है; ‘अम्मोनी’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक और संक्षिप्त है।
- source_word: נַחְרַי
  choice: नहरै
  rationale: स्वरीकृत इब्रानी नाम का सहज हिन्दी लिप्यंतरण; वैकल्पिक लिप्यंतरण फुटनोट में दिया गया है।
- source_word: הַבְּאֵרֹתִי
  choice: बेरोती
  rationale: बेरोत नगर से संबंध बतानेवाले इब्रानी विशेषण का संक्षिप्त हिन्दी रूप।
- source_word: נשאי כְּלֵי
  choice: हथियार ढोनेवाला
  rationale: सैन्य प्रसंग में इस पदबंध का आशय किसी योद्धा या सेनापति के हथियार और युद्ध-सामग्री उठानेवाले नियुक्त सेवक से है। ‘हथियार ढोनेवाला’ सामान्य पाठक के लिए स्पष्ट है और केवल शरीर पर पहने जानेवाले कवच तक अर्थ को सीमित नहीं करता।
- source_word: יוֹאָב בֶּן צְרֻיָה
  choice: सरूयाह के पुत्र योआब
  rationale: इब्रानी संबंध-सूचक संरचना को स्वाभाविक हिन्दी में रखते हुए पूरा परिचय सुरक्षित किया गया है।
theological_decisions: []
