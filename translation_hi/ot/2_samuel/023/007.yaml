  text: וְ/אִישׁ֙ יִגַּ֣ע בָּ/הֶ֔ם יִמָּלֵ֥א בַרְזֶ֖ל וְ/עֵ֣ץ חֲנִ֑ית וּ/בָ/אֵ֕שׁ שָׂר֥וֹף יִשָּׂרְפ֖וּ בַּ/שָּֽׁבֶת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/007.yaml
  text: But the man who touches them must arm himself with iron and the shaft of a spear[c][b][a], and they must be completely burned with fire in their place.
translation:
  language: hi
  text: पर जो कोई उन्हें[a] छुए, उसे लोहे और भाले की डंडी से अपने को लैस करना होगा[b]; और वे जहाँ हैं वहीं आग में पूरी तरह जला दिए जाएँगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उन्हें’ पिछले पद में काँटों के समान बताए गए निकम्मे लोगों की ओर संकेत करता है।
    reason: cross_reference
  - marker: b
    text: या ‘उसे लोहे और भाले की डंडी से सुसज्जित होना होगा’; शाब्दिक रूप से, ‘उसे लोहे और भाले की लकड़ी से भर जाना होगा।’
    reason: lexical_alternative
  - marker: c
    text: या ‘वे उसी जगह आग में निश्चय ही जला दिए जाएँगे।’ इब्रानी में क्रिया के साथ उसी धातु का भाववाचक रूप प्रयुक्त है, जो कथन पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: पर जो कोई
  rationale: אִישׁ एकवचन पुल्लिंग होते हुए यहाँ सामान्य रूप से ऐसे किसी भी व्यक्ति को दर्शाता है जो पिछले पद के काँटों से व्यवहार करे। आधुनिक हिन्दी में ‘जो कोई’ इस सामान्य अर्थ को स्वाभाविक ढंग से व्यक्त करता है; आरम्भिक וְ को प्रसंगगत विरोध के कारण ‘पर’ किया गया है।
- source_word: יִגַּע בָּהֶם
  choice: उन्हें छुए
  rationale: נגע का सामान्य अर्थ ‘छूना’ है और काँटों के बिंब में यही सीधा तथा सुसंगत अर्थ है।
- source_word: יִמָּלֵא
  choice: अपने को लैस करना होगा
  rationale: מלא का निफ़अल रूप शाब्दिक रूप से ‘भर जाना’ है, पर लोहे और भाले की डंडी जैसे साधनों के साथ यह उनसे सुसज्जित या लैस होने का भाव देता है।
- source_word: בַרְזֶל
  choice: लोहे
  rationale: मूल संज्ञा केवल ‘लोहा’ कहती है। प्रसंग किसी लोहे के औज़ार का संकेत देता है, पर उसका प्रकार स्पष्ट न होने के कारण अनिर्दिष्टता रखी गई है।
- source_word: וְעֵץ חֲנִית
  choice: और भाले की डंडी
  rationale: शाब्दिक अर्थ ‘भाले की लकड़ी’ है, अर्थात भाले का लकड़ी वाला दंड या डंडी, न कि उसकी नोक।
- source_word: וּבָאֵשׁ
  choice: आग में
  rationale: यहाँ ב साधन या स्थान दोनों का भाव दे सकता है। ‘आग में जला दिए जाएँगे’ हिन्दी में स्वाभाविक है और आग द्वारा विनाश को स्पष्ट करता है।
- source_word: שָׂרוֹף יִשָּׂרְפוּ
  choice: पूरी तरह जला दिए जाएँगे
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute जलाने की क्रिया पर बल देता है; ‘पूरी तरह’ उस बल को आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בַּשָּׁבֶת
  choice: जहाँ हैं वहीं
  rationale: इस दुर्लभ रूप को प्रसंग में सामान्यतः स्थानवाचक, ‘उसी जगह’ या ‘जहाँ वे हैं’, समझा जाता है। यह अनुवाद काँटों को मौके पर जलाने का बिंब बनाए रखता है।
