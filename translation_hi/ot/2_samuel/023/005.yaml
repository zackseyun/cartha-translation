  text: כִּֽי לֹא כֵ֥ן בֵּיתִ֖/י עִם אֵ֑ל כִּי֩ בְרִ֨ית עוֹלָ֜ם שָׂ֣ם לִ֗/י עֲרוּכָ֤ה בַ/כֹּל֙ וּ/שְׁמֻרָ֔ה כִּֽי כָל יִשְׁעִ֥/י וְ/כָל חֵ֖פֶץ כִּֽי לֹ֥א יַצְמִֽיחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/005.yaml
  text: For my house is not so with God[a]; yet he has made with me an everlasting covenant, ordered in every way and kept secure[b]. For this is all my salvation and all my desire—will he not indeed make it grow?
translation:
  language: hi
  text: क्योंकि मेरा घर परमेश्वर के साथ ऐसा नहीं है[a]; फिर भी उसने मेरे साथ सदा की वाचा बाँधी है, जो हर प्रकार से सुव्यवस्थित और सुरक्षित है। क्योंकि यही मेरा समस्त उद्धार और मेरी सारी अभिलाषा है—क्या वह उसे सचमुच फलने-फूलने न देगा?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या मेरा घर परमेश्वर के साथ ऐसा नहीं है?” बहुत से लोग आरम्भिक खंड को नकारात्मक कथन के बजाय सकारात्मक आलंकारिक प्रश्न समझते हैं।
    reason: alternative_reading
  - marker: b
    text: या, “क्योंकि वह उसे निश्चय ही अंकुरित करेगा / फलने-फूलने देगा।” अंतिम खंड का इब्रानी वाक्य कठिन है; इसे आलंकारिक प्रश्न या प्रबल सकारात्मक कथन—दोनों रूपों में समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: आरम्भ में यह पिछले कथन का कारण या स्पष्टीकरण देता है; आगे इसकी भूमिका प्रसंग के अनुसार बदलती है।
- source_word: לֹא כֵן
  choice: ऐसा नहीं है
  rationale: इब्रानी के नकारात्मक और कठिन वाक्य-विन्यास को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: בֵּיתִי
  choice: मेरा घर
  rationale: ‘घर’ परिवार और राजवंश दोनों अर्थों की संभावना बनाए रखता है।
- source_word: עִם אֵל
  choice: परमेश्वर के साथ
  rationale: עִם का स्वाभाविक सम्बन्धसूचक अर्थ ‘के साथ’ है।
- source_word: בְרִית עוֹלָם
  choice: सदा की वाचा
  rationale: עוֹלָם की स्थायी अवधि और वाचाई भाषा दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: שָׂם לִי
  choice: उसने मेरे साथ ... वाचा बाँधी है
  rationale: शाब्दिक अर्थ ‘मेरे लिए रखी’ है, पर वाचा के प्रसंग में ‘वाचा बाँधना’ स्वाभाविक हिन्दी मुहावरा है।
- source_word: עֲרוּכָה בַכֹּל
  choice: हर प्रकार से सुव्यवस्थित
  rationale: वाचा के पूरी तरह क्रमबद्ध और स्थापित होने का भाव व्यक्त करता है।
- source_word: וּשְׁמֻרָה
  choice: सुरक्षित
  rationale: निष्क्रिय भाव में वाचा के संभालकर रखे और सुरक्षित होने को व्यक्त करता है।
- source_word: כָל יִשְׁעִי
  choice: मेरा समस्त उद्धार
  rationale: יֵשַׁע के व्यापक बचाव और उद्धार के अर्थ को बनाए रखता है।
- source_word: וְכָל חֵפֶץ
  choice: मेरी सारी अभिलाषा
  rationale: חֵפֶץ का इच्छा या मनोवांछित वस्तु का भाव यहाँ समानांतर कथन में उपयुक्त है।
- source_word: כִּי לֹא יַצְמִיחַ
  choice: क्या वह उसे सचमुच फलने-फूलने न देगा?
  rationale: הצמיח के कारक अर्थ को स्वाभाविक हिन्दी में व्यक्त करते हुए कठिन अंतिम खंड को सकारात्मक आलंकारिक प्रश्न के रूप में रखता है।
theological_decisions:
- issue: आरम्भिक खंड כִּי לֹא כֵן בֵּיתִי עִם אֵל का आशय
  choice: ‘क्योंकि मेरा घर परमेश्वर के साथ ऐसा नहीं है’ के रूप में नकारात्मक कथन
  alternative: ‘क्या मेरा घर परमेश्वर के साथ ऐसा नहीं है?’ अर्थात सकारात्मक आलंकारिक प्रश्न
  rationale: स्वरचिह्नित इब्रानी पाठ में स्पष्ट नकार है। मुख्य पाठ उस कठिनाई और धर्मवैचारिक तनाव को सुरक्षित रखता है; प्रचलित सकारात्मक समझ पादटिप्पणी में दी गई है।
- issue: अंतिम क्रिया יַצְמִיחַ का अर्थ और अनिर्दिष्ट कर्म
  choice: परमेश्वर उद्धार और अभिलाषा को फलने-फूलने देगा—सकारात्मक आलंकारिक प्रश्न
  alternative: ‘क्योंकि वह उसे नहीं फलाएगा’ या प्रबल सकारात्मक कथन ‘वह अवश्य उसे अंकुरित करेगा’
  rationale: खंड संक्षिप्त और विवादित है। वाचा के सकारात्मक प्रसंग में आलंकारिक प्रश्न उपयुक्त है, पर पादटिप्पणी प्रबल सकारात्मक कथन की संभावना सुरक्षित रखती है। सर्वनाम ‘उसे’ से कर्म की कुछ अस्पष्टता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली अपनाई गई है। ‘घर’ की पारिवारिक और राजवंशीय द्व्यर्थता तथा दोनों कठिन खंडों की वास्तविक अस्पष्टता बनाए रखी गई है।
