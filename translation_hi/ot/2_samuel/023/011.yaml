base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/011.yaml
  text: After him was Shammah son of Agee the Hararite. The Philistines gathered together at Lehi[a], where there was a plot of ground full of lentils, and the people fled from before the Philistines.
translation:
  language: hi
  text: उसके बाद शम्मा था, जो हरारी आगे का पुत्र था। पलिश्ती युद्ध के लिए इकट्ठे हुए[a]। वहाँ खेत का एक टुकड़ा मसूर से भरा था, और लोग पलिश्तियों के सामने से भाग गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी לַחַיָּה का अर्थ निश्चित नहीं है। इसका अर्थ ‘युद्ध के लिए’ हो सकता है; कुछ इसे ‘एक सैन्य दल में’ जैसे अर्थ में लेते हैं, और इसे स्थाननाम ‘लही में’ भी समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: उसके बाद
  rationale: वीर पुरुषों की सूची में क्रमसूचक संबंध को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है; इब्रानी में अनुपस्थित कोई क्रियात्मक अर्थ नहीं जोड़ता।
- source_word: שַׁמָּא בֶן־אָגֵא הָרָרִי
  choice: हरारी आगे का पुत्र शम्मा
  rationale: व्यक्तिनामों और कुल अथवा क्षेत्रसूचक उपाधि का देवनागरी में निकट लिप्यंतरण किया गया है।
- source_word: וַיֵּאָסְפוּ
  choice: इकट्ठे हुए
  rationale: सैन्य प्रसंग में क्रिया का सामान्य आत्मवाचक अर्थ सहज हिन्दी में व्यक्त होता है।
- source_word: לַחַיָּה
  choice: युद्ध के लिए
  rationale: शब्द कठिन है। समानांतर वर्णन 1 इतिहास 11:13 और वर्तमान सैन्य प्रसंग युद्ध के लिए एकत्र होने का अर्थ समर्थित करते हैं; अन्य संभावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: खेत का एक टुकड़ा
  rationale: חֶלְקָה के ठोस अर्थ ‘भाग/भूखंड’ और संबंधवाचक रचना दोनों को साधारण आधुनिक हिन्दी में बनाए रखता है।
- source_word: מְלֵאָה עֲדָשִׁים
  choice: मसूर से भरा था
  rationale: इब्रानी के प्रत्यक्ष वर्णन को सुरक्षित रखता है और ‘बोया हुआ’ जैसा निहितार्थ नहीं जोड़ता।
- source_word: וְהָעָם
  choice: लोग
  rationale: עם का सामान्य अर्थ रखा गया है; इसे स्पष्ट रूप से सैनिक बताना प्रसंग से संभव है, पर मूल पाठ में ऐसा विनिर्देश नहीं है।
- source_word: נָס מִפְּנֵי
  choice: के सामने से भाग गए
  rationale: इब्रानी मुहावरे और पलायन की दिशा को स्वाभाविक हिन्दी में व्यक्त करता है।
