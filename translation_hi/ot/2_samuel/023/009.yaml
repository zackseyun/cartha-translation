base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/009.yaml
  text: And after him was Eleazar son of Dodo[a], son of Ahohi, among the three mighty men with David, when they taunted the Philistines who had gathered there for battle[c][b], and the men of Israel had gone up.
translation:
  language: hi
  text: उसके बाद दूदो का पुत्र, अहोही का पुत्र एलआज़ार[a] था। वह दाऊद के साथ तीन वीरों में से एक था। जब उन्होंने युद्ध के लिए वहाँ इकट्ठे हुए पलिश्तियों को ताना मारा[b], तब इस्राएल के पुरुष ऊपर चले गए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दूदई का पुत्र, एक अहोहीवंशी का पुत्र एलआज़ार।”
    reason: नामों और वंश-सूचक पदों के पाठ तथा विभाजन की वैकल्पिक समझ।
  - marker: b
    text: या “पलिश्तियों को ललकारा।”
    reason: חרף अपमानजनक ताना देने के साथ चुनौती देने या ललकारने का भाव भी व्यक्त कर सकता है।
  - marker: c
    text: शाब्दिक अर्थ “इस्राएल के पुरुष ऊपर चले गए”; इस युद्ध-संदर्भ में इसका अर्थ “पीछे हट गए” हो सकता है।
    reason: עלה के शाब्दिक अर्थ और संभावित प्रसंगगत अर्थ, दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: ו/אחר/ו
  choice: उसके बाद ... था
  rationale: यह पद पिछले वीर के बाद अगले वीर का परिचय देता है। इब्रानी के क्रियारहित परिचयात्मक वाक्य को स्वाभाविक हिन्दी में ‘था’ के साथ व्यक्त किया गया है।
- source_word: אֶלְעָזָר
  choice: एलआज़ार
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בֶּן דדי בֶּן אֲחֹחִי
  choice: अहोही के पुत्र दोदो का पुत्र
  rationale: व्यक्तिनामों और वंश-संबंध की सबसे सीधी समझ को रखा गया है; पाठ की वैकल्पिक व्याख्या पादटिप्पणी में दी गई है।
- source_word: בִּ/שְׁלֹשָׁה גברים
  choice: तीन वीरों में से एक
  rationale: सदस्यता सूचक בְּ और सैनिक-वीरता के संदर्भ में גברים का स्वाभाविक हिन्दी रूप।
- source_word: עִם דָּוִד
  choice: दाऊद के साथ रहनेवाले
  rationale: संगति और संबद्धता को सहज हिन्दी में स्पष्ट करता है, बिना किसी अतिरिक्त पद या भूमिका को जोड़ने के।
- source_word: בְּ/חָֽרְפָם
  choice: जब उन्होंने ... ताना मारा
  rationale: חרף में अपमान, निंदा या चुनौतीपूर्ण ताने का भाव है। ‘ताना मारा’ उसके अर्थ-मूल को आधुनिक हिन्दी में बनाए रखता है; सैन्य संदर्भ में ‘ललकारा’ भी संभव है।
- source_word: בַּ/פְּלִשְׁתִּים נֶאֶסְפוּ שָׁם לַ/מִּלְחָמָה
  choice: युद्ध के लिए वहाँ इकट्ठे हुए पलिश्तियों को
  rationale: निफ़अल נֶאֶסְפוּ को पलिश्तियों से जोड़कर उनके युद्ध के लिए एकत्र होने का भाव व्यक्त किया गया है।
- source_word: וַֽ/יַּעֲל֖וּ אִ֥ישׁ יִשְׂרָאֵֽל
  choice: तब इस्राएली पुरुष ऊपर चले गए
  rationale: עלה का मूल अर्थ ‘ऊपर जाना’ मुख्य पाठ में सुरक्षित रखा गया है। युद्ध-संदर्भ में इसके ‘पीछे हट जाना’ अर्थ की संभावना पादटिप्पणी में दी गई है।
