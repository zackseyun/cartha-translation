base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/008.yaml
  text: 'These are the names of the mighty men who belonged to David: Josheb-basshebeth[a], a Tahkemonite, chief of the Three. He was Adino the Eznite[c][b], who wielded his spear against eight hundred slain at one time.'
translation:
  language: hi
  text: 'दावीद के वीर योद्धाओं के नाम ये हैं: योशेब-बश्शेबेत[a] तहकमोनी, तीनों का प्रधान[b]। वह अदीनो एजनी[c] था। उसने एक ही अवसर पर आठ सौ जनों को मार डाला।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद का इब्रानी पाठ कठिन है। ‘योशेब-बश्शेबेत’ मसोरेटी पाठ के अनुसार है; 1 इतिहास 11:11 के समानांतर पाठ में ‘याशोबाम, एक हकमोनी’ है।
    reason: textual_variant
  - marker: b
    text: कुछ प्राचीन साक्ष्यों और व्याख्याकारों के अनुसार ‘तीनों का प्रधान’ के स्थान पर ‘तीस का प्रधान’ हो सकता है; मसोरेटी पाठ में ‘तीनों का प्रधान’ है।
    reason: alternative_reading
  - marker: c
    text: इब्रानी ‘अदीनो एजनी’ एक अत्यंत कठिन वाक्यांश है। कई विद्वान इसे नाम न मानकर ‘उसने अपना भाला चलाया’ या ‘उसने अपना भाला लहराया’ जैसे अर्थ में समझते हैं।
    reason: lexical_alternative
