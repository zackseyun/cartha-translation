  text: אָמַר֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל לִ֥/י דִבֶּ֖ר צ֣וּר יִשְׂרָאֵ֑ל מוֹשֵׁל֙ בָּ/אָדָ֔ם צַדִּ֕יק מוֹשֵׁ֖ל יִרְאַ֥ת אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/003.yaml
  text: 'The God of Israel has spoken[a]; the Rock of Israel has said to me: One who rules over mankind justly, ruling in the fear of God[b],'
translation:
  language: hi
  text: 'इस्राएल के परमेश्वर ने कहा है; इस्राएल की चट्टान ने मुझसे कहा है: जो मनुष्यों पर न्यायपूर्वक शासन करता है, जो परमेश्वर के भय में शासन करता है[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस कथन को मसीहाई अर्थ वाला भी समझा जा सकता है—अर्थात आदर्श राजा का ऐसा वर्णन जो अंततः मसीह में पूरा होता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर ने कहा है
  rationale: पूर्ण क्रिया भविष्यवाणी-सदृश घोषणा को प्रस्तुत करती है; ‘कहा है’ उसके वर्तमान महत्व को बनाए रखता है।
- source_word: לִי דִבֶּר
  choice: मुझसे कहा है
  rationale: לִי को यहाँ स्वाभाविक रूप से वचन पाने वाले दाऊद की ओर संकेत करने वाला अप्रत्यक्ष कर्म माना गया है।
- source_word: צוּר יִשְׂרָאֵל
  choice: इस्राएल की चट्टान
  rationale: ईश्वर के लिए प्रयुक्त ‘चट्टान’ का रूपक स्थिरता और सुरक्षा का भाव लिए हुए है और इसे परिभाषित करने के बजाय बनाए रखा गया है।
- source_word: מוֹשֵׁל בָּאָדָם
  choice: जो मनुष्यों पर शासन करता है
  rationale: कृदंत को सामान्य सिद्धांत के रूप में और אָדָם को यहाँ सामूहिक मानवता के अर्थ में व्यक्त किया गया है।
- source_word: צַדִּיק
  choice: न्यायपूर्वक
  rationale: संक्षिप्त काव्यात्मक वाक्य में विशेषण शासन करने के ढंग को विधेयात्मक रूप से बताता है; ‘न्यायपूर्वक’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מוֹשֵׁל יִרְאַת אֱלֹהִים
  choice: जो परमेश्वर के भय में शासन करता है
  rationale: इब्रानी की संक्षिप्त रचना को बिना अनावश्यक पूरक जोड़े रखा गया है; ‘परमेश्वर का भय’ श्रद्धापूर्ण जवाबदेही का पारंपरिक बाइबलीय भाव सुरक्षित रखता है।
theological_decisions:
- issue: सामान्य राजकीय सिद्धांत बनाम मसीही संकेत
  choice: मुख्य पाठ इसे न्यायी शासक का सामान्य आदर्श बताता है।
  alternative: इसे उस आदर्श राजा का मसीही संकेत समझा जा सकता है जो अंततः मसीह में पूरा होता है।
  rationale: इब्रानी पाठ मसीह का स्पष्ट नाम नहीं लेता; इसलिए मुख्य अनुवाद सामान्य कथन को बनाए रखता है और संभावित मसीही महत्त्व को पादटिप्पणी में स्वीकार करता है।
- issue: יִרְאַת אֱלֹהִים का भाव
  choice: परमेश्वर के भय में
  alternative: परमेश्वर के प्रति श्रद्धा रखते हुए
  rationale: ‘भय’ मूल शब्द और उसके धर्मवैचारिक तनाव को सुरक्षित रखता है; इसे केवल ‘श्रद्धा’ कहने से उसका अर्थ अनावश्यक रूप से सीमित हो सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर काव्यात्मक संरचना तथा ‘चट्टान’ और ‘परमेश्वर का भय’ जैसे मूल बिंब सुरक्षित रखे गए हैं।
