base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/013.yaml
  text: Then thirty of the thirty chief men went down and came at harvest time to David[a], to the cave of Adullam[c][b], while a band of the Philistines was camped in the Valley of Rephaim.
translation:
  language: hi
  text: तब उन तीस प्रमुख वीरों में से तीस जन नीचे उतरे और कटनी के समय दाऊद के पास, अदुल्लाम की गुफा में आए[a][b]; उस समय पलिश्तियों का एक दल[c] रपाईम की घाटी में डेरा डाले हुए था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पदबंध का शाब्दिक रूप लगभग ‘तीस में से तीस, प्रमुख’ है और उसका अर्थ कठिन है। सम्भव अर्थ हैं: ‘प्रमुख वीरों में से तीस जन’ या अधिक विशेष रूप से दाऊद के विशिष्ट योद्धा-दल ‘तीस’ के सदस्य।'
    reason: alternative_reading
  - marker: b
    text: या ‘कटनी के दौरान’।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी חַיַּת פְּלִשְׁתִּים का शाब्दिक अर्थ ‘पलिश्तियों का जीव/पशु’ है; यहाँ यह मुहावरे के रूप में सैनिक दल या टुकड़ी के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
