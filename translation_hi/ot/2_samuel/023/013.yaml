  choice: नीचे उतरे
  rationale: मूल क्रिया ירד की दिशात्मक भावना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שלשים מֵהַשְּׁלֹשִׁים רֹאשׁ
  choice: उन तीस प्रमुख वीरों में से तीस जन
  rationale: इब्रानी पदबंध संक्षिप्त और कठिन है। यह अनुवाद संख्या और प्रमुख योद्धाओं के समूह—दोनों संकेतों को रखता है, जबकि पादटिप्पणी अन्य सम्भव समझ बताती है।
- source_word: אֶל קָצִיר
  choice: कटनी के समय
  rationale: शाब्दिक रूप से ‘कटनी की ओर’ जैसे पदबंध का सन्दर्भ में सम्भावित कालवाचक अर्थ है; यह आधुनिक हिन्दी में स्पष्ट है।
- source_word: אֶל דָּוִד אֶל מְעָרַת עֲדֻלָּם
  choice: दाऊद के पास अदुल्लाम की गुफा में
  rationale: दोहराए गए אֶל को हिन्दी में स्वाभाविक रूप देते हुए दाऊद और गुफा—दोनों गन्तव्यों को सुरक्षित रखता है।
- source_word: חַיַּת פְּלִשְׁתִּים
  choice: पलिश्तियों का एक दल
  rationale: חַיָּה का मूल अर्थ जीव/पशु हो सकता है, पर यहाँ सैन्य सन्दर्भ में दल या टुकड़ी का मुहावरेदार अर्थ उपयुक्त है।
- source_word: חֹנָה
  choice: डेरा डाले हुए था
  rationale: कर्तृवाचक कृदन्त से व्यक्त जारी पृष्ठभूमि-क्रिया को सहज हिन्दी में दर्शाता है।
- source_word: בְּעֵמֶק רְפָאִים
  choice: रपाईम की तराई में
  rationale: स्थाननाम को लिप्यन्तरित किया गया है और עֵמֶק के लिए प्रसंगानुकूल ‘तराई’ चुना गया है।
