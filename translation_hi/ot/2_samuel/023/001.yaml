id: 2SA.23.1
reference: 2 Samuel 23:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה דִּבְרֵ֥י דָוִ֖ד הָ/אַֽחֲרֹנִ֑ים נְאֻ֧ם דָּוִ֣ד בֶּן יִשַׁ֗י וּ/נְאֻ֤ם הַ/גֶּ֨בֶר֙ הֻ֣קַם עָ֔ל מְשִׁ֨יחַ֙ אֱלֹהֵ֣י יַֽעֲקֹ֔ב וּ/נְעִ֖ים זְמִר֥וֹת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/001.yaml
  text: 'These are the last words of David: An oracle of David son of Jesse[a], an oracle of the man raised on high, the anointed of the God of Jacob[c][b], and the sweet singer of Israel.'
translation:
  language: hi
  text: 'ये दाऊद के अंतिम वचन हैं:


    यिशै के पुत्र दाऊद की वाणी,[a]

    उस पुरुष की वाणी, जिसे ऊँचे पद पर उठाया गया,

    जो याकूब के परमेश्वर का अभिषिक्त है,[b]

    और इस्राएल का मधुर गीतकार है।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “वाणी” के लिए “गंभीर घोषणा” भी हो सकता है। हिब्रू शब्द किसी औपचारिक, गंभीर और प्रायः भविष्यद्वक्ताओं जैसी घोषणा का परिचायक है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “याकूब के परमेश्वर का अभिषिक्त।” यहाँ यह सीधे दाऊद की ओर संकेत करता है, फिर भी इसमें राजकीय और मसीही अनुगूँज है।
    reason: alternative_reading
  - marker: c
    text: या “इस्राएल के गीतों का मनोहर गायक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי ... הָאַחֲרֹנִים
  choice: अंतिम वचन
  rationale: ‘वचन’ यहाँ दाऊद के समापन कथन के लिए स्वाभाविक और गरिमापूर्ण है; ‘अंतिम’ हिब्रू विशेषण का सीधा अर्थ देता है।
- source_word: נְאֻם
  choice: वाणी
  rationale: यह औपचारिक और गंभीर कथन का सूचक है। हिंदी में ‘वाणी’ उसकी ऊँची शैली को बनाए रखती है, जबकि ‘भविष्यवाणी’ कहना अर्थ को अनावश्यक रूप से सीमित कर देता।
- source_word: בֶּן יִשַׁי
  choice: यिशै का पुत्र
  rationale: हिब्रू संबंध-वाक्यांश का सीधा और प्रचलित हिंदी रूप।
- source_word: הַגֶּבֶר
  choice: वह पुरुष
  rationale: मूल शब्द सामान्यतः ‘पुरुष’ है; उसके सम्मान और प्रतिष्ठा का भाव अगले वाक्यांश से सामने आता है।
- source_word: הֻקַם עָל
  choice: जिसे ऊँचे पद पर उठाया गया
  rationale: यह निष्क्रिय क्रिया और ऊँचा किए जाने के भाव दोनों को व्यक्त करता है तथा केवल अमूर्त ‘महान बनाया गया’ से अधिक मूल बिंब सुरक्षित रखता है।
- source_word: מְשִׁיחַ
  choice: अभिषिक्त
  rationale: तात्कालिक संदर्भ में यह दाऊद को परमेश्वर द्वारा अभिषिक्त राजा बताता है। ‘अभिषिक्त’ ऐतिहासिक अर्थ के साथ राजकीय-मसीही अनुगूँज भी बनाए रखता है।
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: याकूब का परमेश्वर
  rationale: हिब्रू संबंध-विन्यास का सीधा अनुवाद।
- source_word: נְעִים זְמִרוֹת יִשְׂרָאֵל
  choice: इस्राएल का मधुर गीतकार
  rationale: यह काव्यात्मक उपाधि का सहज हिंदी रूप है और दाऊद को इस्राएल के गीतों से जोड़ता है, बिना ‘भजन-संहिता’ जैसी बाद की स्पष्ट पहचान आयात किए।
- source_word: וְאֵלֶּה
  choice: ये हैं
  rationale: आरंभिक संयोजक प्रसंग की निरंतरता दिखाता है, पर हिंदी में अलग से ‘और’ लगाना असहज है; ‘ये ... हैं’ स्वाभाविक अनुभाग-आरंभ है।
theological_decisions:
- issue: क्या מְשִׁיחַ को यहाँ प्रत्यक्ष मसीही उपाधि के रूप में लिखा जाए
  choice: अभिषिक्त
  alternative: मसीहा / अभिषिक्त जन
  rationale: वाक्य में इसका प्रत्यक्ष संदर्भ दाऊद से है। ‘अभिषिक्त’ मूल राजकीय अर्थ को स्पष्ट रखता है और शब्द की व्यापक मसीही अनुगूँज को मिटाता भी नहीं है।
- issue: נְאֻם को स्पष्ट भविष्यवाणी कहना
  choice: वाणी
  alternative: भविष्यवाणी / घोषणा
  rationale: यह शब्द गंभीर, अधिकारपूर्ण कथन का औपचारिक सूचक है, लेकिन अकेले इसी के आधार पर कथन की विधा को केवल भविष्यवाणी तक सीमित करना उचित नहीं।
- issue: נְעִים זְמִרוֹת יִשְׂרָאֵל में संबंध की अस्पष्टता
  choice: इस्राएल का मधुर गीतकार
  alternative: इस्राएल के गीतों का मनोहर गायक
  rationale: संक्षिप्त हिब्रू पदबंध को कई प्रकार से जोड़ा जा सकता है। मुख्य पाठ में प्रचलित काव्यात्मक अर्थ रखा गया है और वैकल्पिक संबंध को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में काव्यात्मक, गंभीर और जनसुलभ रखी गई है। समानांतर पंक्तियों से हिब्रू की औपचारिक उद्घोषणा-शैली और दाऊद के लिए प्रयुक्त उपाधियों की लय सुरक्षित रहती है।
