base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/024.yaml
  text: Asahel the brother of Joab was among the Thirty[a]; Elhanan son of Dodo of Bethlehem.
translation:
  language: hi
  text: योआब का भाई असाहेल उन तीस वीरों में था; और बेतलेहेम का एल्हानान, जो दोदो[a] का पुत्र था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘दोडो’; 1 इतिहास 11:26 के समानांतर वर्णन में ‘दोदै’ है।
    reason: वैकल्पिक पाठ-परंपरा को बिना मुख्य पाठ बदलकर सुरक्षित रखना।
lexical_decisions:
- source_word: עֲשָׂה אֵל
  choice: असाहेल
  rationale: व्यंजन-पाठ में अलग लिखे गए अंश ज्ञात व्यक्तिगत नाम עֲשָׂהאֵל को दर्शाते हैं; हिन्दी बाइबलीय नाम-परंपरा के अनुसार ‘असाहेल’ रखा गया।
- source_word: אֲחִי יוֹאָב
  choice: योआब का भाई
  rationale: यह संबंधवाचक रचना पारिवारिक संबंध को सीधे व्यक्त करती है; आधुनिक हिन्दी में यही स्वाभाविक क्रम है।
- source_word: בַּשְּׁלֹשִׁים
  choice: उन तीस वीरों में
  rationale: ב उपसर्ग समूह में सदस्यता बताता है। केवल ‘तीस’ हिन्दी में अस्पष्ट होता, इसलिए संदर्भानुसार ‘वीरों’ जोड़ा गया है, पर असाहेल को किसी विशिष्ट दर्जे में बाँधने से बचा गया है।
- source_word: אֶלְחָנָן
  choice: एल्हानान
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: בֶּן דֹּדֹו
  choice: दोडो का पुत्र
  rationale: मसोरेटिक पाठ דֹּדֹו को व्यक्तिगत नाम ‘दोडो’ के रूप में सुरक्षित रखा गया है; समानांतर पाठ का ‘दोदै’ पादटिप्पणी में दिया गया है, मुख्य पाठ में सामंजस्य नहीं किया गया।
- source_word: בֵּית לָחֶם
  choice: बेतलेहेम का
  rationale: स्थाननाम को पारदर्शी ढंग से मूल-स्थान बताने वाले हिन्दी संबंधसूचक रूप में प्रस्तुत किया गया है।
