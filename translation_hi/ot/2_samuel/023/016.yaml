  text: וַ/יִּבְקְעוּ֩ שְׁלֹ֨שֶׁת הַ/גִּבֹּרִ֜ים בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֗ים וַ/יִּֽשְׁאֲבוּ מַ֨יִם֙ מִ/בֹּ֤אר בֵּֽית לֶ֨חֶם֙ אֲשֶׁ֣ר בַּ/שַּׁ֔עַר וַ/יִּשְׂא֖וּ וַ/יָּבִ֣אוּ אֶל דָּוִ֑ד וְ/לֹ֤א אָבָה֙ לִ/שְׁתּוֹתָ֔/ם וַ/יַּסֵּ֥ךְ אֹתָ֖/ם לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/016.yaml
  text: Then the three mighty men broke through the camp of the Philistines and drew water from the well of Bethlehem that was by the gate[a], and carried it and brought it to David. But he was not willing to drink it; instead[b], he poured it out to Yahweh.
translation:
  language: hi
  text: तब उन तीन वीरों ने पलिश्तियों की छावनी को भेदकर निकल गए और बेतलेहेम के फाटक के पास वाले कुएँ से पानी निकाला। वे उसे लेकर दाऊद के पास आए। पर दाऊद ने उसे पीना नहीं चाहा; इसके बजाय उसने उसे[a] यहोवा के लिए उंडेल दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में यहाँ बहुवचन प्रत्यय है—शाब्दिक रूप से “उन्हें”—जो सम्भवतः ‘पानी’ के लिए प्रयुक्त बहुवचन रूप की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: इस क्रिया में पानी को यहोवा के लिए भेंट के रूप में उंडेलने, अर्थात पेय-भेंट जैसा भाव है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּבְקְעוּ
  choice: छावनी को चीरकर रास्ता बनाया
  rationale: क्रिया विरोधी मोर्चे को भेदकर आगे निकलने का भाव देती है; यह अभिव्यक्ति सैन्य प्रसंग में उस बलपूर्वक प्रवेश को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: שְׁלֹשֶׁת הַגִּבֹּרִים
  choice: उन तीन वीरों
  rationale: गिब्बोरीम दाऊद के विशिष्ट योद्धाओं के लिए लगभग पदनाम की तरह प्रयुक्त है; ‘वीर’ संक्षिप्त, प्रतिष्ठित और आधुनिक हिन्दी में सहज है।
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: पलिश्तियों की छावनी
  rationale: यह पलिश्तियों के सैन्य पड़ाव को स्पष्ट रूप से दर्शाता है।
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: पानी भरा
  rationale: कुएँ से पानी निकालकर पात्र में भरने की क्रिया के लिए यह स्वाभाविक हिन्दी है।
- source_word: מִבֹּאר בֵּית לֶחֶם אֲשֶׁר בַּשַּׁעַר
  choice: बेतलेहेम के फाटक के पास वाले कुएँ से
  rationale: वाक्यांश बेतलेहेम से संबद्ध उस विशेष कुएँ को बताता है जो नगर के फाटक के पास था।
- source_word: וַיִּשְׂאוּ וַיָּבִאוּ אֶל דָּוִד
  choice: वे उसे लेकर दाऊद के पास आए
  rationale: दोनों क्रमिक क्रियाओं—पानी को उठाकर ले जाना और दाऊद तक पहुँचाना—को सहज हिन्दी में बनाए रखता है।
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: दाऊद ने उसे पीना नहीं चाहा
  rationale: אָבָה इच्छा या सहमति का भाव रखता है; ‘नहीं चाहा’ केवल तथ्यात्मक ‘नहीं पिया’ की अपेक्षा इस स्वैच्छिक अस्वीकार को सुरक्षित रखता है।
- source_word: וַיַּסֵּךְ אֹתָם
  choice: उसने उसे उंडेल दिया
  rationale: मुख्य पाठ ठोस क्रिया को बनाए रखता है और क्रिया के अर्घ्य-सदृश धार्मिक संकेत को पादटिप्पणी में स्पष्ट करता है, ताकि अर्थ को आवश्यकता से अधिक निश्चित न किया जाए।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: पूर्वसर्ग समर्पण या अभिमुखता दिखाता है; ‘के लिए’ इस कृत्य के यहोवा को समर्पित होने का भाव रखता है, जबकि मुख्य पाठ इसे किसी निश्चित अनुष्ठानिक श्रेणी में नहीं बाँधता।
theological_decisions:
- issue: पानी उंडेलने के दाऊद के कृत्य का स्वरूप
  choice: यहोवा के लिए पानी सचमुच उंडेलना, जिसमें अर्घ्य या पेय-भेंट जैसा समर्पण-भाव निहित है
  alternative: बिना किसी उपासना-संबंधी अर्थ के केवल पानी न पीने का प्रतीकात्मक कार्य
  rationale: נסך प्रायः अनुष्ठानिक रूप से द्रव उंडेलने का संकेत देता है, और ‘यहोवा के लिए’ इस प्रसंग में समर्पण का बल रखता है। फिर भी मुख्य पाठ केवल क्रिया का वर्णन करता है; पादटिप्पणी उसके संभावित पेय-भेंट-सदृश अर्थ को बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘वीर’, ‘छावनी’ और ‘उंडेल दिया’ सामान्य पाठक के लिए स्पष्ट हैं। जहाँ इब्रानी में पानी के लिए बहुवचन प्रत्यय है, वहाँ स्वाभाविक हिन्दी के अनुसार एकवचन ‘उसे’ रखा गया और पादटिप्पणी में रूपगत अंतर बताया गया।
