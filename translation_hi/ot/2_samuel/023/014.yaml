lexical_decisions:
- source_word: אָז
  choice: उस समय ... उस समय
  rationale: इब्रानी में यह कालवाचक क्रियाविशेषण दोनों उपवाक्यों में दोहराया गया है। हिन्दी में ‘उस समय’ स्वाभाविक है और यह दोहराव मूल के कालगत बल को बनाए रखता है।
- source_word: מְצוּדָה
  choice: गढ़
  rationale: यह दाऊद के सुरक्षित, प्रतिरक्षित स्थान का संक्षिप्त और स्वाभाविक हिन्दी सैन्य-स्थलवाचक रूप है।
- source_word: מַצַּב
  choice: चौकी
  rationale: इस सैन्य प्रसंग में यह पलिश्तियों के स्थापित सैन्य ठिकाने या वहाँ तैनात दल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: פְּלִשְׁתִּים
  choice: पलिश्ती
  rationale: इस जनसमूह के लिए प्रचलित हिन्दी बाइबलीय नाम।
- source_word: בֵּית לָחֶם
  choice: बैतलहम
  rationale: स्थान-नाम का प्रचलित हिन्दी रूप।
- source_word: וְ
  choice: और
  rationale: यह दोनों उपवाक्यों के बीच इब्रानी के साधारण समन्वय को बनाए रखता है; ‘जबकि’ जैसा व्याख्यात्मक संबंध नहीं जोड़ता।
