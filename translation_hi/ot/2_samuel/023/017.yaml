base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/017.yaml
  text: And he said[a], “Far be it from me, O Yahweh, that I should do this! Is it not the blood of the men who went at the risk of their lives?” So he was not willing to drink it[b]. These things the three mighty men did.
translation:
  language: hi
  text: उसने कहा, “हे याहवे, मुझसे ऐसा करना कभी न हो! क्या यह उन पुरुषों का लहू नहीं है, जो अपने प्राण जोखिम में डालकर गए थे?[a]” इसलिए उसने वह पानी पीना स्वीकार नहीं किया।[b] ये काम उन तीन वीरों ने किए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने प्राणों के साथ”; अर्थात वे जानलेवा खतरा उठाकर गए थे।
    reason: lexical_alternative
  - marker: b
    text: 'वैकल्पिक, अधिक शाब्दिक प्रश्न: “क्या यह उन पुरुषों का लहू है...?” दाऊद उस पानी को उनके लहू के समान मानता है, क्योंकि वे उसे अपने प्राण जोखिम में डालकर लाए थे।'
    reason: alternative_reading
lexical_decisions:
- source_word: חָלִילָה לִּי יְהוָה
  choice: हे याहवे, मुझसे ऐसा करना दूर रहे
  rationale: חָלִילָה कड़ी अस्वीकृति और नैतिक घृणा प्रकट करने वाला मुहावरा है। संबोधन के रूप में आए יהוה को ‘हे याहवे’ रखा गया है; हिंदी वाक्यांश दाऊद की व्यक्तिगत अस्वीकृति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: מֵעֲשֹׂתִי זֹאת
  choice: मुझसे ऐसा करना
  rationale: מִן और क्रियार्थक संज्ञा का प्रयोग यहाँ उस काम को करने की प्रबल अस्वीकृति व्यक्त करता है।
- source_word: הֲדַם הָאֲנָשִׁים
  choice: क्या यह उन पुरुषों का लहू नहीं है
  rationale: प्रश्नवाचक הֲ को आलंकारिक प्रश्न के रूप में प्रस्तुत किया गया है। ‘नहीं’ इब्रानी में अलग शब्द के रूप में नहीं है, पर हिंदी में प्रश्न का अभिप्रेत नकारात्मक उत्तर और दाऊद का भाव स्पष्ट करता है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: בְּנַפְשׁוֹתָם
  choice: अपने प्राण जोखिम में डालकर
  rationale: शाब्दिक अर्थ ‘अपने प्राणों के साथ’ है, पर प्रसंग में यह जानलेवा खतरा उठाने का मुहावरा है। चुना हुआ रूप आधुनिक हिंदी में अर्थ स्पष्ट करता है।
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: इसलिए उसने वह पानी पीना स्वीकार नहीं किया
  rationale: אָבָה इच्छा या सहमति को दर्शाता है। प्रत्यय व्याकरणतः बहुवचन है, पर संदर्भित वस्तु पानी है, इसलिए हिंदी में ‘वह पानी’ स्वाभाविक है। संयोजक וְ को यहाँ कथात्मक परिणाम के अनुसार ‘इसलिए’ कहा गया है।
- source_word: שְׁלֹשֶׁת הַגִּבֹּרִים
  choice: उन तीन वीरों
  rationale: גִּבֹּרִים यहाँ दाऊद के विशिष्ट पराक्रमी योद्धाओं के लिए है। ‘वीर’ संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदले बिना निकट देवनागरी लिप्यंतरण देता है।
- issue: पानी को पुरुषों का लहू कहना
  choice: आलंकारिक प्रश्न के रूप में रखा गया
  alternative: ‘क्या मैं इन पुरुषों का लहू पीऊँ?’
  rationale: दाऊद पानी को सचमुच रक्त नहीं ठहराता, बल्कि उसे पीना उन पुरुषों के प्राणों के मूल्य पर मिली वस्तु को अपने लिए लेना मानता है। फिर भी मूल की संक्षिप्त और तनावपूर्ण अभिव्यक्ति को मुख्य पाठ में बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, कथात्मक और गरिमापूर्ण रखी गई है। ‘याहवे’, ‘लहू’, ‘प्राण’ और ‘वीर’ जैसे शब्द बाइबलीय प्रसंग की गंभीरता बनाए रखते हुए सामान्य पाठक के लिए समझने योग्य हैं।
