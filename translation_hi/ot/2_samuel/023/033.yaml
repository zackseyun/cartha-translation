- source_word: הֲרָרִי
  choice: हरारी
  rationale: यह जातीय अथवा स्थान-सूचक विशेषण है; सूची के संदर्भ में वर्णनात्मक ‘पहाड़ी’ के बजाय जातिनाम-सदृश रूप रखा गया है।
- source_word: אֲחִיאָם
  choice: अहिआम
  rationale: व्यक्तिवाचक नाम को मूल उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: בֶּן
  choice: का पुत्र
  rationale: हिब्रू वंश-सूचक रचना को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त किया गया है।
- source_word: שָׁרָר
  choice: शारार
  rationale: व्यक्तिवाचक नाम को मूल स्वर-रूप के निकट लिप्यंतरित किया गया है।
- source_word: הָאֲרָרִי
  choice: अरारी
  rationale: व्यंजन-पाठ इसे पहले आए ‘हरारी’ से अलग ‘अरारी’ बताता है; संभावित सामंजस्यकरण से बचते हुए यह भेद सुरक्षित रखा गया है।
