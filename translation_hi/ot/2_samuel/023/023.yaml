  text: He was honored among the thirty[a], but he did not attain to the three[c][b]; and David appointed him over his bodyguard.
translation:
  language: hi
  text: वह तीस वीरों में सम्मानित था,[a] पर उन तीनों की बराबरी तक नहीं पहुँचा।[b] दाऊद ने उसे अपने अंगरक्षक-दल का अधिकारी नियुक्त किया।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह तीस वीरों से अधिक सम्मानित था।” इब्रानी वाक्यांश का तुलनात्मक अर्थ भी लिया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “पर वह उन तीनों तक नहीं आया”; अर्थात वह उन तीन विशिष्ट वीरों के पद तक नहीं पहुँचा।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में “उसकी मिष्माअत के लिए/पर।” ‘मिष्माअत’ का अर्थ “आदेश”, “अधिकाराधीन दल” या “रक्षक-दल” हो सकता है। यहाँ “अंगरक्षक-दल” सैनिक-दरबारी संदर्भ के अनुसार लिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלֹשִׁים נִכְבָּד
  choice: तीस वीरों में सम्मानित था
  rationale: מִן को यहाँ समूह के भीतर संबंध बताने वाला माना गया है और נִכְבָּד के निफ़अल भाव को ‘सम्मानित था’ से व्यक्त किया गया है। संदर्भ के कारण ‘वीरों’ जोड़ा गया है। तुलनात्मक अर्थ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: וְאֶל הַשְּׁלֹשָׁה לֹא בָא
  choice: पर उन तीनों की बराबरी तक नहीं पहुँचा
  rationale: शाब्दिक ‘उन तीनों तक नहीं आया’ यहाँ पद या प्रतिष्ठा तक पहुँचने का मुहावरा है। ‘बराबरी तक नहीं पहुँचा’ स्वाभाविक हिन्दी में उसी दर्जागत अर्थ को व्यक्त करता है।
- source_word: וַיְשִׂמֵהוּ דָוִד
  choice: दाऊद ने उसे ... नियुक्त किया
  rationale: שׂים का मूल अर्थ रखना/ठहराना है, पर प्रशासनिक-सैनिक प्रसंग में ‘नियुक्त किया’ स्वाभाविक और सटीक है।
- source_word: אֶל מִשְׁמַעְתּוֹ
  choice: अपने अंगरक्षकों का अधिकारी
  rationale: מִשְׁמַעַת का अर्थ आदेश, अधिकाराधीन दल या पहरा हो सकता है। सैनिक-दरबारी संदर्भ में दाऊद के निजी रक्षक-दल का अधिकारी सबसे संभावित अर्थ है, पर अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
