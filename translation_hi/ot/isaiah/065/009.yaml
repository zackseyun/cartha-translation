base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/009.yaml
  text: And I will bring forth offspring from Jacob[a], and from Judah an heir of my mountains; my chosen ones will possess it[b], and my servants will dwell there.
translation:
  language: hi
  text: और मैं याकूब से संतान[a] और यहूदा से अपने पर्वतों का एक उत्तराधिकारी उत्पन्न करूँगा; मेरे चुने हुए उसे विरासत में पाएँगे[b], और मेरे सेवक वहाँ निवास करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘याकूब से वंश’ अथवा ‘याकूब से वंशज।’ इब्रानी शब्द זֶרַע सामूहिक एकवचन है और उसका अर्थ ‘बीज,’ ‘संतान,’ या ‘वंशज’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उसका अधिकार करेंगे।’ ‘उत्तराधिकारी’ और ‘विरासत में पाएँगे’ के लिए मूल पाठ में एक ही इब्रानी मूल ירש प्रयुक्त हुआ है। क्रिया के साथ लगा कर्म-प्रत्यय स्त्रीलिंग एकवचन है, जबकि निकटवर्ती ‘मेरे पर्वतों’ बहुवचन है; उसका पूर्वपद स्पष्ट नहीं है और वह किसी निहित स्त्रीलिंग एकवचन वस्तु, सम्भवतः भूमि, की ओर संकेत कर सकता है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְהוֹצֵאתִי
  choice: और मैं ... उत्पन्न करूँगा
  rationale: हिफ़ील रूप का अर्थ किसी को बाहर लाना या उत्पन्न करना है। वंश के संदर्भ में ‘उत्पन्न करूँगा’ स्वाभाविक है और कारणवाचक भाव बनाए रखता है।
- source_word: מִיַּעֲקֹב זֶרַע
  choice: याकूब में से संतान
  rationale: זֶרַע एक सामूहिक एकवचन है, जिसका अर्थ ‘बीज’, ‘संतान’ या ‘वंशज’ हो सकता है। ‘संतान’ आधुनिक हिन्दी में सामूहिक अर्थ को सहज रूप से व्यक्त करता है।
- source_word: וּמִיהוּדָה יוֹרֵשׁ
  choice: और यहूदा में से ... एक उत्तराधिकारी
  rationale: יוֹרֵשׁ ירש का कृदन्त है और विरासत पाने अथवा अधिकार करने वाले व्यक्ति को दर्शाता है। ‘उत्तराधिकारी’ संक्षिप्त है और अगले पद ‘मेरे पर्वतों’ से उसका संबंध बनाए रखता है।
- source_word: הָרָי
  choice: अपने पर्वतों
  rationale: मूल पाठ में ‘पर्वत’ बहुवचन और प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय के साथ है। सम्भावित भौगोलिक संकेत की व्याख्या किए बिना ठोस चित्र को सुरक्षित रखा गया है।
- source_word: וִירֵשׁוּהָ
  choice: उन पर अधिकार करेंगे
  rationale: ירש में विरासत पाने और अधिकार में लेने, दोनों की अर्थ-छाया है। हिन्दी में बहुवचन ‘पर्वतों’ की ओर संकेत करते हुए ‘उन पर अधिकार करेंगे’ क्षेत्रीय अधिग्रहण का भाव स्वाभाविक ढंग से देता है; मूल के एकवचन स्त्रीलिंग कर्म-प्रत्यय की कठिनाई पादटिप्पणी में सुरक्षित है।
- source_word: בְחִירַי
  choice: मेरे चुने हुए
  rationale: यह उन लोगों के लिए बहुवचन संज्ञार्थक विशेषण है जिन्हें परमेश्वर ने चुना है। यह अनुवाद स्पष्ट है और बाद की पारिभाषिक धर्मवैज्ञानिक धारणाएँ नहीं जोड़ता।
- source_word: וַעֲבָדַי
  choice: मेरे सेवक
  rationale: परमेश्वर और उसके लोगों के संबंध में עבד के लिए ‘सेवक’ सन्दर्भानुकूल और गरिमापूर्ण हिन्दी है।
- source_word: יִשְׁכְּנוּ שָׁמָּה
  choice: वहाँ निवास करेंगे
  rationale: שׁכן स्थायी रूप से रहने या बसने का भाव देता है। ‘निवास करेंगे’ पठनीय और गरिमापूर्ण है।
theological_decisions:
- issue: ‘मेरे पर्वतों’ और विरासत की प्रतिज्ञा का आशय
  choice: ‘अपने पर्वतों’ के ठोस भौगोलिक चित्र को बनाए रखा गया है।
  alternative: इसे सामान्य रूप से ‘देश’ कहना या केवल आत्मिक अथवा युगान्तकारी आशीष के रूप में प्रस्तुत करना।
  rationale: इब्रानी पाठ स्पष्टतः परमेश्वर के ‘पर्वतों’ की बात करता है। अनुवाद भौगोलिक और वाचा-संबंधी आयाम को बनाए रखते हुए उसकी व्यापक पूर्ति का प्रश्न व्याख्या के लिए खुला छोड़ता है।
- issue: וִירֵשׁוּהָ में एकवचन स्त्रीलिंग कर्म-प्रत्यय का संदर्भ
  choice: मुख्य पाठ में निकटवर्ती बहुवचन ‘पर्वतों’ के अनुसार ‘उन पर’ रखा गया और रूपगत अस्पष्टता पादटिप्पणी में बताई गई।
  alternative: ‘उस पर अधिकार करेंगे’ अथवा ‘उसे विरासत में पाएँगे’, जिसमें किसी निहित स्त्रीलिंग एकवचन संज्ञा—सम्भवतः भूमि—का संकेत माना जाए।
  rationale: मूल में ‘मेरे पर्वतों’ पुल्लिंग बहुवचन है, जबकि अगले क्रियापद का कर्म-प्रत्यय स्त्रीलिंग एकवचन है। पाठ को चुपचाप सरल करने के बजाय दोनों सम्भावनाओं को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली अपनाई गई है। ‘संतान’, ‘उत्तराधिकारी’, ‘अधिकार करेंगे’ और ‘निवास करेंगे’ सामान्य पाठकों के लिए स्पष्ट हैं, जबकि मूल के वंश, विरासत और स्थायी बसाव के परस्पर जुड़े भाव सुरक्षित रहते हैं।
