source:
  edition: WLC
  text: הָ/עָ֗ם הַ/מַּכְעִיסִ֥ים אוֹתִ֛/י עַל פָּנַ֖/י תָּמִ֑יד זֹֽבְחִים֙ בַּ/גַּנּ֔וֹת וּֽ/מְקַטְּרִ֖ים עַל הַ/לְּבֵנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/003.yaml
  text: the people who continually provoke me to my face[a], sacrificing in the gardens and burning incense on the bricks.
translation:
  language: hi
  text: 'वे लोग जो मुझे लगातार मेरे सामने ही क्रोध दिलाते हैं,


    बागों में बलि चढ़ाते हैं


    और ईंटों पर[a] धूप जलाते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “ईंटों पर।” सम्भवतः यहाँ अनुचित उपासना के लिए इस्तेमाल की जाने वाली ईंटों से बनी संरचनाएँ या वेदियाँ अभिप्रेत हैं।'
    reason: मूल शब्द केवल सामग्री को बताता है; उपासना-संरचना होने का अर्थ प्रसंग से सम्भावित है, स्पष्ट नहीं।
lexical_decisions:
- source_word: הָעָם
  choice: वे लोग
  rationale: निश्चित समूह का सामूहिक बोध रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति।
- source_word: הַמַּכְעִיסִים אֹתִי
  choice: जो ... मुझे क्रोधित करते हैं
  rationale: हिफ़ील रूप का कारणवाचक अर्थ—परमेश्वर को क्रोध दिलाना—स्पष्ट रूप से व्यक्त होता है।
- source_word: עַל־פָּנַי
  choice: मेरे सामने ही
  rationale: इब्रानी का शाब्दिक चित्र ‘मेरे मुख पर’ है; प्रसंग में निर्लज्जतः परमेश्वर की उपस्थिति में किए गए विरोध को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘ही’ जोड़ा गया है।
- source_word: תָּמִיד
  choice: लगातार
  rationale: बार-बार और निरंतर जारी आचरण का अर्थ देता है।
- source_word: זֹבְחִים בַּגַּנּוֹת
  choice: बागों में बलि चढ़ाते
  rationale: चल रही उपासना-संबंधी क्रिया और उसके स्थान दोनों को बिना ‘देवस्थान’ जैसी अतिरिक्त व्याख्या जोड़े व्यक्त करता है।
- source_word: וּמְקַטְּרִים
  choice: धूप जलाते
  rationale: קטר के उपासना-संबंधी अर्थ को सामान्य और स्पष्ट हिन्दी में व्यक्त करता है; यहाँ धुएँ वाली सुगंधित भेंट अभिप्रेत है।
- source_word: עַל־הַלְּבֵנִים
  choice: ईंटों पर
  rationale: मूल पाठ में केवल ‘ईंटें’ हैं, ‘वेदियाँ’ नहीं; इसलिए संभावित उपासना-संरचना को मुख्य पाठ में निश्चित नहीं किया गया।
theological_decisions:
- issue: עַל־הַלְּבֵנִים का उपासना-संबंधी आशय
  choice: ईंटों पर
  alternative: ईंटों की वेदियों पर
  rationale: बलि और धूप का प्रसंग किसी ईंट-निर्मित उपासना-संरचना की ओर संकेत कर सकता है, पर इब्रानी संज्ञा स्वयं केवल ‘ईंटें’ कहती है। मुख्य पाठ मूल की अस्पष्टता रखता है और संभावित आशय पादटिप्पणी में देता है।
- issue: עַל־פָּנַי में विरोध का भाव
  choice: मेरे सामने ही
  alternative: मेरे मुँह पर
  rationale: ‘मेरे सामने ही’ परमेश्वर की उपस्थिति में खुले और निर्लज्ज विरोध का भाव रखता है, जबकि आधुनिक हिन्दी में ‘मेरे मुँह पर’ इस वाक्य में अनावश्यक रूप से कठोर या अस्वाभाविक लग सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक पंक्ति-विन्यास, सरल किंतु गरिमापूर्ण शब्दावली। ‘मेरे सामने ही’ खुली अवज्ञा का बल देता है और ‘ईंटों पर’ मूल की वास्तविक अस्पष्टता बनाए रखता है।
