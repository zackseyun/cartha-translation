source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הִנֵּ֨ה עֲבָדַ֤/י יֹאכֵ֨לוּ֙ וְ/אַתֶּ֣ם תִּרְעָ֔בוּ הִנֵּ֧ה עֲבָדַ֛/י יִשְׁתּ֖וּ וְ/אַתֶּ֣ם תִּצְמָ֑אוּ הִנֵּ֧ה עֲבָדַ֛/י יִשְׂמָ֖חוּ וְ/אַתֶּ֥ם תֵּבֹֽשׁוּ־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/013.yaml
  text: 'Therefore this is what the Lord GOD says: Look[a], my servants will eat, but you will be hungry; look, my servants will drink, but you will be thirsty; look, my servants will rejoice[b], but you will be put to shame.'
translation:
  language: hi
  text: 'इसलिए प्रभु याहवे यों कहते हैं: “देखो, मेरे सेवक[a] खाएँगे, पर तुम भूखे रहोगे; देखो, मेरे सेवक पिएँगे, पर तुम प्यासे रहोगे; देखो, मेरे सेवक आनन्द मनाएँगे, पर तुम लज्जित किए जाओगे[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अनुवाद “मेरे दास” भी हो सकता है; यहाँ “मेरे सेवक” प्रसंग के अधिक अनुकूल है।
    reason: lexical_alternative
  - marker: b
    text: या “लज्जित होगे।” इब्रानी क्रिया लज्जा अनुभव करने या अपमानित किए जाने—दोनों का बोध करा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले अभियोग से निकलने वाले परिणाम को स्पष्ट करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כֹּה אָמַר
  choice: यों कहते हैं
  rationale: भविष्यद्वक्ताओं के प्रचलित सन्देश-सूत्र का संक्षिप्त, गरिमापूर्ण और स्वाभाविक हिन्दी रूप।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי की उपाधि ‘प्रभु’ और יהוה के व्यक्तिगत वाचा-नाम ‘यहोवा’—दोनों को अलग-अलग सुरक्षित रखता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: हर विरोधी परिणाम की ओर ध्यान खींचने वाले इस कण की बलाघाती पुनरावृत्ति को बनाए रखता है।
- source_word: עֲבָדַי
  choice: मेरे सेवक
  rationale: עבד का अर्थ दास या सेवक हो सकता है; यहाँ परमेश्वर से सम्बन्ध रखने और उसकी सेवा करने वाले लोगों के लिए ‘सेवक’ प्रसंगानुकूल है।
- source_word: תִּרְעָבוּ
  choice: तुम भूखे रहोगे
  rationale: खाने वाले सेवकों के साथ स्पष्ट और मुहावरेदार विरोध प्रस्तुत करता है।
- source_word: תִּצְמָאוּ
  choice: तुम प्यासे रहोगे
  rationale: पीने के विपरीत परिणाम को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יִשְׂמָחוּ
  choice: आनन्द मनाएँगे
  rationale: क्रिया में निहित हर्ष को सक्रिय और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: תֵּבֹשׁוּ
  choice: लज्जित किए जाओगे
  rationale: न्याय के प्रसंग में सार्वजनिक अपमान या लज्जा में डाले जाने का परिणाम व्यक्त करता है, जबकि वैकल्पिक आत्मानुभूत अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְאַתֶּם
  choice: पर तुम
  rationale: मूल संयोजक का यहाँ स्पष्ट विरोधात्मक कार्य है; ‘पर’ सेवकों और सम्बोधित लोगों के परिणामों का अन्तर स्वाभाविक हिन्दी में दिखाता है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में ईश्वरीय नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल में उपाधि और व्यक्तिगत ईश्वरीय नाम दोनों उपस्थित हैं। ‘प्रभु यहोवा’ इस भेद को बनाए रखता है और नाम को केवल सामान्य पदवी में नहीं बदलता।
- issue: תֵּבֹשׁוּ में लज्जा का स्वरूप
  choice: लज्जित किए जाओगे
  alternative: लज्जित होगे
  rationale: न्याय और उलटाव के प्रसंग में बाहरी अपमान का परिणाम प्रमुख जान पड़ता है, पर इब्रानी में भीतर से लज्जा अनुभव करने की सम्भावना भी है; इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में रखी गई है। तीन बार आया “देखो” मूल की बलाघाती समानान्तर रचना को सुरक्षित रखता है; अर्धविराम क्रमिक विरोधों को स्पष्ट करते हैं। शैली गरिमापूर्ण है, पर अनावश्यक रूप से पुरातन नहीं।
