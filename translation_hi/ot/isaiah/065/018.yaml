base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/018.yaml
  text: But be glad and rejoice forever in what I am creating; for behold[a], I am creating Jerusalem as rejoicing, and her people as joy.
translation:
  language: hi
  text: बल्कि जो कुछ मैं रच रहा हूँ, उसमें सदा सर्वदा आनन्दित और उल्लसित रहो; क्योंकि देखो,[a] मैं यरूशलेम को आनन्द और उसके लोगों को हर्ष रच रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं यरूशलेम को उल्लास के लिए और उसके लोगों को हर्ष के लिए रच रहा हूँ।”
    reason: इब्रानी भाववाचक संज्ञाएँ विधेयात्मक (‘आनन्द/हर्ष रच रहा हूँ’) या प्रयोजनात्मक (‘उल्लास/हर्ष के लिए’) समझी जा सकती हैं।
lexical_decisions:
- source_word: כִּי אִם
  choice: बल्कि
  rationale: पद 17 की बात के साथ विरोध दिखाने वाला स्वाभाविक हिन्दी संयोजक; यह कण-युग्म के सुधारात्मक/विरोधात्मक बल को व्यक्त करता है।
- source_word: שִׂישׂוּ וְגִילוּ
  choice: आनन्दित और मग्न रहो
  rationale: दो निकटार्थी आनन्द-सूचक क्रियाओं की काव्यात्मक तीव्रता बनाए रखने के लिए दो अलग लेकिन स्वाभाविक हिन्दी अभिव्यक्तियाँ चुनी गई हैं।
- source_word: עֲדֵי עַד
  choice: सदा-सर्वदा
  rationale: अनवरत और स्थायी अवधि बताने वाले इब्रानी मुहावरे का गरिमापूर्ण तथा प्रचलित हिन्दी रूप।
- source_word: אֲשֶׁר אֲנִי בוֹרֵא
  choice: जो कुछ मैं रच रहा हूँ, उसमें
  rationale: सम्बन्धवाचक उपवाक्य को आनन्द के विषय/अवसर के रूप में रखता है और कृदन्त की वर्तमान अथवा आसन्न सृजनात्मक क्रिया को सुरक्षित रखता है।
- source_word: הִנְנִי
  choice: देखो
  rationale: ईश्वरीय घोषणा पर ध्यान खींचने वाले बल को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: בוֹרֵא
  choice: मैं ... बना रहा हूँ
  rationale: इब्रानी कृदन्त की सजीव वर्तमान/आसन्न क्रिया को दर्शाता है; हिन्दी में परिणामी पूरक के साथ 'बना रहा हूँ' अधिक स्वाभाविक है।
- source_word: יְרוּשָׁלִַם
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी बाइबलीय प्रचलित रूप।
- source_word: גִּילָה
  choice: आनन्द
  rationale: उल्लास/आनन्द का भाववाचक संज्ञा-रूप; यरूशलेम को आनन्द के रूप में रचे जाने की काव्यात्मक परिणति बनाए रखता है।
- source_word: וְעַמָּהּ
  choice: और उसकी प्रजा
  rationale: स्त्रीलिंग प्रत्यय का सम्बन्ध यरूशलेम से रखता है; नगर से सम्बद्ध सामूहिक जन के लिए 'प्रजा' गरिमापूर्ण और स्वाभाविक है।
- source_word: מָשׂוֹשׂ
  choice: हर्ष
  rationale: समानान्तर पंक्ति में आनन्द का निकटार्थी किन्तु अलग शब्द देकर इब्रानी काव्यात्मक समानान्तरता बनाए रखता है।
theological_decisions:
- issue: ברא के बाद גִּילָה और מָשׂוֹשׂ का विधेयात्मक अथवा प्रयोजनात्मक अर्थ
  choice: यरूशलेम को आनन्द और उसकी प्रजा को हर्ष बना रहा हूँ
  alternative: यरूशलेम को आनन्द मनाने के लिए और उसकी प्रजा को हर्षित होने के लिए रच रहा हूँ
  rationale: मुख्य पाठ परिणामसूचक/विधेयात्मक चित्र को सुरक्षित रखता है—नगर और लोग स्वयं आनन्द और हर्ष का मूर्त रूप बनते हैं। इब्रानी में सम्भव प्रयोजनात्मक अर्थ को पादटिप्पणी में रखा गया है, ताकि वास्तविक अस्पष्टता समाप्त न हो।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वाणी-संबंधी स्वर रखा गया है। ‘देखो’ घोषणा का बल बनाए रखता है; ‘रच रहा हूँ’ और ‘बना रहा हूँ’ वर्तमान/आसन्न सृजनात्मक क्रिया को स्वाभाविक हिन्दी में व्यक्त करते हैं।
