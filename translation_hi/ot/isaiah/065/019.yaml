base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/019.yaml
  text: I will rejoice in Jerusalem and delight in my people[a]; no longer will the sound of weeping be heard in her[c][b], or the sound of crying.
translation:
  language: hi
  text: मैं यरूशलेम में आनन्द मनाऊँगा और अपनी प्रजा में हर्षित होऊँगा[a]। उसमें फिर कभी रोने की आवाज़ सुनाई नहीं देगी, न चीत्कार की आवाज़[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं यरूशलेम के कारण आनन्द मनाऊँगा और अपनी प्रजा के कारण हर्षित होऊँगा।” इब्रानी पूर्वसर्ग का शाब्दिक अर्थ “में” है, पर यहाँ संबंध या आनन्द के विषय का भाव भी संभव है।
    reason: lexical_alternative
  - marker: c
    text: या, “संकट की पुकार की आवाज़।” इब्रानी शब्द पीड़ा या संकट में उठी पुकार भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַלְתִּי
  choice: मैं ... आनन्द मनाऊँगा
  rationale: גיל तीव्र आनन्द और उल्लास व्यक्त करता है। भविष्यकाल प्रसंग में आगे आनेवाली नई सृष्टि की प्रतिज्ञाओं के अनुरूप है।
- source_word: בִירוּשָׁלִַם
  choice: यरूशलेम में
  rationale: ב का सीधा स्थानवाचक अर्थ ‘में’ है; इससे परमेश्वर का आनन्द यरूशलेम में केंद्रित दिखता है, यद्यपि संबंधवाचक अर्थ भी संभव है।
- source_word: וְשַׂשְׂתִּי
  choice: और ... हर्षित होऊँगा
  rationale: שׂושׂ भी आनन्द व्यक्त करता है। ‘हर्षित होऊँगा’ पहले क्रियापद से कुछ शब्दगत भिन्नता बनाए रखता है और काव्यात्मक समानांतरता में स्वाभाविक है।
- source_word: בְעַמִּי
  choice: अपनी प्रजा में
  rationale: ב के मूल अर्थ ‘में’ को सुरक्षित रखा गया है। हिन्दी में यह कुछ काव्यात्मक है, पर स्रोत की स्थानवाचक और संबंधवाचक संभावनाओं को समय से पहले सीमित नहीं करता।
- source_word: יִשָּׁמַע
  choice: सुनाई देगी
  rationale: שׁמע के निफ़अल रूप का यहाँ स्वाभाविक निष्क्रिय अर्थ ‘सुनाई देना’ है।
- source_word: בָּהּ
  choice: उसमें
  rationale: स्त्रीलिंग एकवचन सर्वनाम यरूशलेम की ओर संकेत करता है। हिन्दी का ‘उसमें’ स्वाभाविक रूप से नगर को संदर्भित करता है, यद्यपि उसमें व्याकरणिक लिंग स्पष्ट नहीं होता।
- source_word: עוֹד
  choice: फिर न
  rationale: निषेध के साथ עוֹד का अर्थ है कि यह ध्वनि आगे फिर सुनाई नहीं देगी। ‘फिर न’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: קוֹל בְּכִי
  choice: रोने की आवाज़
  rationale: קוֹל का श्रव्य बल ‘आवाज़’ से और בְּכִי का अर्थ ‘रोने’ से स्पष्ट तथा सहज रूप में व्यक्त होता है।
- source_word: וְקוֹל זְעָקָה
  choice: न चीत्कार की आवाज़
  rationale: זְעָקָה संकट या पीड़ा में उठी तीव्र पुकार हो सकती है। ‘चीत्कार’ इसे सामान्य रोने से अलग रखता है और दोनों समानांतर पदों का भेद बचाता है।
theological_decisions:
- issue: यरूशलेम के लिए स्त्रीलिंग सर्वनाम
  choice: स्वाभाविक हिन्दी में ‘उसमें’ रखा गया और उसका संदर्भ यरूशलेम माना गया
  alternative: ‘उस नगरी में’ या व्यक्तिकरण को अधिक स्पष्ट करने वाला रूप
  rationale: मूल इब्रानी का स्त्रीलिंग सर्वनाम नगर यरूशलेम को संदर्भित करता है। हिन्दी में ‘उसमें’ अनावश्यक व्याख्या जोड़े बिना वही संदर्भ बनाए रखता है।
- issue: आनन्द व्यक्त करने वाली दो निकटार्थक क्रियाएँ
  choice: ‘आनन्द मनाऊँगा’ और ‘हर्षित होऊँगा’
  alternative: दोनों के लिए ‘आनन्दित होऊँगा’
  rationale: मूल में גיל और שׂושׂ दो अलग, पर निकटार्थक क्रियाएँ हैं। अलग हिन्दी अभिव्यक्तियाँ पद की काव्यात्मक पूर्णता और शब्दगत भेद बचाती हैं।
- issue: ב का स्थानवाचक या संबंधवाचक अर्थ
  choice: मुख्य पाठ में ‘यरूशलेम में’ और ‘अपनी प्रजा में’
  alternative: ‘यरूशलेम पर/के कारण’ और ‘अपनी प्रजा पर/के कारण’
  rationale: मुख्य पाठ में इब्रानी पूर्वसर्ग का सबसे सीधा अर्थ रखा गया है, जबकि पादटिप्पणी संबंधवाचक अर्थ की वास्तविक संभावना बताती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी रखी गई है। समानांतर काव्य-विन्यास को बनाए रखते हुए ‘आनन्द मनाऊँगा/हर्षित होऊँगा’ और ‘रोने/चीत्कार’ के भेद सुरक्षित किए गए हैं।
