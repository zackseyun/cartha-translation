base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/024.yaml
  text: And it will happen that before they call[a], I will answer; while they are still speaking[b], I will hear.
translation:
  language: hi
  text: और ऐसा होगा कि उनके पुकारने से पहले ही[a] मैं उत्तर दूँगा; वे अभी बोल ही रहे होंगे[b] कि मैं सुनूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके गुहार लगाने से पहले ही।” यह क्रिया पुकारने को दर्शाती है और इसमें प्रार्थनापूर्ण विनती भी शामिल हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “जब वे अभी बोल रहे होंगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: और ऐसा होगा
  rationale: यह भविष्य की स्थिति या परिणाम का परिचय देने वाला भविष्यसूचक सूत्र है; यह हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: טֶרֶם
  choice: से पहले ही
  rationale: यह एक कार्य से पूर्व होने का समयबोध देता है; ‘ही’ उत्तर की तत्परता पर स्वाभाविक बल देता है।
- source_word: יִקְרָאוּ
  choice: वे पुकारें / उनके पुकारने
  rationale: קרא का अर्थ पुकारना या सहायता के लिए आवाज़ देना हो सकता है और प्रसंग में प्रार्थनापूर्ण पुकार भी सूचित हो सकती है; ‘पुकारना’ इस व्यापकता को बनाए रखता है।
- source_word: אֶעֱנֶה
  choice: मैं उत्तर दूँगा
  rationale: ענה का सामान्य अर्थ उत्तर देना है और यह ‘पुकारने’ के साथ स्वाभाविक रूप से जुड़ता है।
- source_word: עוֹד הֵם מְדַבְּרִים
  choice: जब वे बोल ही रहे होंगे
  rationale: यह वाक्यांश जारी और अभी अपूर्ण वाणी को व्यक्त करता है; ‘ही रहे होंगे’ उस कालगत अर्थ को सहज हिन्दी में सुरक्षित रखता है।
- source_word: אֶשְׁמָע
  choice: मैं सुनूँगा
  rationale: שמע का मूल अर्थ सुनना है; यह अनुकूल ध्यान या प्रत्युत्तर का संकेत दे सकता है, पर अनुवाद में उस संकेत को स्पष्ट व्याख्या बनाकर नहीं जोड़ा गया।
theological_decisions:
- issue: क्या प्रार्थना के प्रसंग को अनुवाद में स्पष्ट कर दिया जाए
  choice: ‘पुकारना,’ ‘उत्तर देना,’ और ‘सुनना’ जैसे व्यापक शब्द बनाए रखे गए।
  alternative: ‘उनके प्रार्थना करने से पहले’ अथवा ‘मैं उनकी सुनूँगा।’
  rationale: प्रसंग परमेश्वर से की गई प्रार्थनापूर्ण पुकार की ओर संकेत करता है, लेकिन इब्रानी क्रियाएँ अधिक व्यापक हैं। सामान्य शब्दावली मूल पाठ की अर्थगत खुली जगह और परमेश्वर के शीघ्र प्रत्युत्तर—दोनों को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सरल, गरिमापूर्ण और भविष्यसूचक है। समानांतर उपवाक्यों तथा परमेश्वर के प्रथम पुरुष वचनों को सुरक्षित रखा गया है।
