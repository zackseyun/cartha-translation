base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/006.yaml
  text: 'Look[a], it is written before me: I will not keep silent, but I will repay; indeed[b], I will repay into their lap.'
translation:
  language: hi
  text: 'देखो[a], यह मेरे सामने लिखा हुआ है: मैं चुप नहीं रहूँगा, बल्कि प्रतिफल दूँगा; हाँ, मैं उनकी गोद में प्रतिफल दूँगा।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह मेरे सामने दर्ज है।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उनकी गोद/छाती पर।” हिब्रू चित्र प्रतिफल को सीधे उन्हीं पर लौटाए जाने का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान खींचते हुए एक गंभीर घोषणा आरम्भ करता है; ‘देखो’ आधुनिक हिन्दी में इसके संकेतात्मक बल को स्वाभाविक रूप से रखता है।
- source_word: כְתוּבָה לְפָנַי
  choice: यह मेरे सामने लिखा हुआ है
  rationale: कृदन्त और संबंधसूचक पदबंध किसी दर्ज बात के परमेश्वर के सामने विद्यमान रहने का चित्र देते हैं।
- source_word: לֹא אֶחֱשֶׂה
  choice: मैं चुप नहीं रहूँगा
  rationale: यह भविष्य के दृढ़ निश्चय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי אִם
  choice: बल्कि
  rationale: यह नकारात्मक कथन के बाद उसके विपरीत सकारात्मक कार्य को प्रस्तुत करता है।
- source_word: שִׁלַּמְתִּי
  choice: बदला चुकाऊँगा
  rationale: यद्यपि रूप पूर्णकालिक है, भविष्यद्वाणी की न्याय-घोषणा में यह निश्चित भावी कार्य को व्यक्त करता है; ‘बदला चुकाना’ यहाँ प्रतिफल लौटाने का भाव रखता है।
- source_word: וְשִׁלַּמְתִּי
  choice: हाँ, ... बदला चुकाऊँगा
  rationale: दोहराव प्रतिफल की निश्चितता पर बल देता है; ‘हाँ’ उस प्रबल पुनरुक्ति को स्पष्ट करता है।
- source_word: עַל חֵיקָם
  choice: उनकी गोद में ही
  rationale: यह हिब्रू के गोद/छाती के पास वाले भाग के चित्र को बनाए रखता है और ‘ही’ प्रतिफल के सीधे उन्हीं पर लौटने पर बल देता है।
theological_decisions:
- issue: שִׁלַּמְתִּי / וְשִׁלַּמְתִּי के पक्ष और काल का बल
  choice: 'भावी अर्थ: ‘बदला चुकाऊँगा ... हाँ, ... बदला चुकाऊँगा’'
  alternative: 'भूत/पूर्ण अर्थ: ‘मैंने बदला चुका दिया है’'
  rationale: भविष्यद्वाणी के न्याय-वचन में पूर्ण रूप निश्चित भावी कार्य को प्रस्तुत कर सकता है; निकट संदर्भ आने वाले प्रतिफल की घोषणा है।
- issue: प्रतिफल का स्वरूप
  choice: पाठ के शब्दों से आगे विशिष्ट किए बिना न्यायसंगत बदला
  alternative: दंड अथवा प्रतिशोध के रूप में स्पष्ट व्याख्या
  rationale: שׁלם यहाँ किए हुए का प्रतिफल लौटाने का अर्थ देता है; अनुवाद न्यायिक पारस्परिकता रखता है, पर पाठ से अधिक संकीर्ण निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गंभीर, घोषणात्मक और सामान्य पाठक के लिए सुबोध शैली। ‘बदला चुकाना’ मुहावरेदार है और न्यायिक प्रतिफल का भाव रखता है। प्रत्येक पाद-टिप्पणी चिह्न मुख्य पाठ में दिया गया है।
