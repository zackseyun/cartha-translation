  text: נִדְרַ֨שְׁתִּי֙ לְ/ל֣וֹא שָׁאָ֔לוּ נִמְצֵ֖אתִי לְ/לֹ֣א בִקְשֻׁ֑/נִי אָמַ֨רְתִּי֙ הִנֵּ֣/נִי הִנֵּ֔/נִי אֶל גּ֖וֹי לֹֽא קֹרָ֥א בִ/שְׁמִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/001.yaml
  text: I let myself be sought by those who did not ask[a]; I let myself be found by those who did not seek me. I said, ‘Here I am[b], here I am,’ to a nation that did not call on my name.
translation:
  language: hi
  text: जिन लोगों ने नहीं पूछा, उनके द्वारा मैंने अपने को खोजे जाने दिया[a]; जिन्होंने मुझे नहीं खोजा, उनके द्वारा मैंने अपने को पाए जाने दिया। मैंने उस राष्ट्र से, जिसने मेरा नाम नहीं पुकारा, कहा, “मैं यहाँ हूँ, मैं यहाँ हूँ!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप से, “मैं खोजा गया ... मैं पाया गया।” इब्रानी के निफ़अल रूपों को सामान्य कर्मवाच्य भी समझा जा सकता है, यद्यपि प्रसंग उन लोगों के सामने परमेश्वर के स्वयं को प्रकट करने का संकेत देता है जो उसे खोज नहीं रहे थे।
    reason: lexical_alternative
  - marker: b
    text: पौलुस रोमियों 10:20 में इस पद को गैर-यहूदियों के सम्बन्ध में उद्धृत करता है; इसलिए यहाँ “राष्ट्र” को उस व्यापक विहित-साहित्यिक सन्दर्भ में भी समझा जा सकता है।
    reason: cross_reference
lexical_decisions:
- source_word: נִדְרַשְׁתִּי
  choice: मैं उपलब्ध हुआ
  rationale: निफ़अल रूप का शाब्दिक अर्थ ‘मुझे खोजा/पूछा गया’ हो सकता है, पर यहाँ भाव यह है कि परमेश्वर ने स्वयं को उन लोगों के लिए सुलभ किया जिन्होंने उससे पूछा तक नहीं। ‘उपलब्ध हुआ’ इस आत्म-प्रकटीकरण को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि शाब्दिक कर्मवाच्य पादटिप्पणी में सुरक्षित है।
- source_word: לְלֹא שָׁאָלוּ
  choice: जिन्होंने मुझसे नहीं पूछा, उनके लिए
  rationale: שאל का सामान्य अर्थ ‘पूछना’ है। सन्दर्भ के कारण ‘मुझसे’ निहित सम्बन्ध स्पष्ट करता है और ל को यहाँ लाभार्थी/सम्बन्धसूचक ‘उनके लिए’ के रूप में व्यक्त किया गया है।
- source_word: נִמְצֵאתִי
  choice: उन्हें मैं मिल गया
  rationale: निफ़अल का सीधा अर्थ ‘मैं पाया गया’ है। ‘उन्हें मैं मिल गया’ आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल कर्मवाच्य अर्थ और परमेश्वर की पहल—दोनों को बनाए रखता है।
- source_word: לְלֹא בִקְשֻׁנִי
  choice: जिन्होंने मुझे नहीं खोजा
  rationale: בקשׁ का सीधा अर्थ ‘खोजना’ है और कर्म-प्रत्यय ‘मुझे’ अनिवार्य है।
- source_word: הִנֵּנִי הִנֵּנִי
  choice: मैं यहाँ हूँ, मैं यहाँ हूँ!
  rationale: दोहराव उपलब्धता, उपस्थिति और आग्रह को बल देता है। आधुनिक हिन्दी में यही सबसे स्वाभाविक समतुल्य है; पुनरुक्ति ज्यों की त्यों रखी गई है।
- source_word: גּוֹי
  choice: जाति
  rationale: גוי का मूल अर्थ ‘जाति/राष्ट्र’ है। बाइबलीय हिन्दी में ‘जाति’ किसी जनसमुदाय को दर्शाती है और यहाँ मूल पाठ से अधिक विशिष्ट ‘गैर-यहूदी’ अर्थ मुख्य पाठ में आरोपित नहीं करती।
- source_word: לֹא קֹרָא בִשְׁמִי
  choice: जिसने मेरा नाम नहीं पुकारा
  rationale: सक्रिय קרא और בְּשֵׁם का अर्थ यहाँ किसी के नाम को पुकारना/उसकी दुहाई देना है, न कि ‘मेरे नाम से कहलाना’। ‘मेरा नाम नहीं पुकारा’ सक्रिय व्याकरण और बाइबलीय मुहावरे दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: क्या मुख्य पाठ में परमेश्वर के आत्म-प्रकटीकरण को स्पष्ट करने के लिए निफ़अल रूपों को अनुमतिमूलक बनाया जाए
  choice: पहली पंक्ति में ‘मैं उपलब्ध हुआ’ और समानान्तर पंक्ति में ‘उन्हें मैं मिल गया’ रखा गया, तथा शाब्दिक कर्मवाच्य सम्भावना पादटिप्पणी में दी गई।
  alternative: ‘मुझे खोजा गया ... मैं पाया गया’ अथवा ‘मैंने अपने को खोजे जाने दिया ... मैंने अपने को पाने दिया।’
  rationale: इब्रानी रूप वास्तविक कर्मवाच्य अस्पष्टता रखते हैं। हिन्दी में कठोर कर्मवाच्य अस्वाभाविक और अर्थतः भ्रमकारी हो सकता है, जबकि अत्यधिक अनुमतिमूलक अनुवाद परमेश्वर की पहल को मूल से अधिक स्पष्ट कर देता। चुना हुआ रूप सुलभता और मूल समानान्तरता के बीच सन्तुलन रखता है।
- issue: क्या גּוֹי को मुख्य पाठ में ‘गैर-यहूदी’ कहा जाए
  choice: मुख्य पाठ में ‘जाति’ रखा गया और रोमियों 10:20 में उसके गैर-यहूदियों से सम्बन्धित प्रयोग को पादटिप्पणी में बताया गया।
  alternative: ‘गैर-यहूदी लोग’ या अधिक सामान्य ‘लोग’।
  rationale: इब्रानी शब्द अपने आप में ‘जाति’ कहता है; ‘गैर-यहूदी’ यहाँ सम्भव प्रामाणिक व्याख्या है, विशेषतः पौलुस के उद्धरण में, पर उसे मुख्य पाठ में रखना अर्थ को समय से पहले निश्चित कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जाति’ बाइबलीय जनसमुदाय के अर्थ में प्रयुक्त है, आधुनिक सामाजिक जाति-व्यवस्था के संकीर्ण अर्थ में नहीं। काव्यात्मक समानान्तरता और ‘मैं यहाँ हूँ’ का प्रभावपूर्ण दोहराव सुरक्षित रखा गया है।
