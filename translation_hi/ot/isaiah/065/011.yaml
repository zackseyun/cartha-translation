base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/011.yaml
  text: But you are those who forsake Yahweh[a], who forget my holy mountain, who set a table for Gad[c][b], and who fill mixed wine for Meni.
translation:
  language: hi
  text: परन्तु तुम, जो याहवे को त्याग देते हो, जो मेरे पवित्र पर्वत को भूल जाते हो, जो गाद[a] के लिए मेज़ सजाते हो और मेनी[b] के लिए मिश्रित मदिरा[c] उँडेलते हो—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘गाद’ सम्भवतः भाग्य से जुड़े किसी देवता का नाम था; अथवा, ‘भाग्य के लिए।’
    reason: alternative_reading
  - marker: b
    text: ‘मेनी’ सम्भवतः नियति से जुड़े किसी देवता का नाम था; अथवा, ‘नियति के लिए।’
    reason: alternative_reading
  - marker: c
    text: अथवा, ‘मिश्रित पेय।’ यह पद अर्पण के लिए तैयार किए गए पेय की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: परन्तु तुम
  rationale: स्वतंत्र सर्वनाम के साथ संयोजक पिछले संदर्भ से विरोध प्रकट करता है; ‘परन्तु तुम’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֹזְבֵי יְהוָה
  choice: जो याहवे को त्याग देते हो
  rationale: कृदन्त संबोधित समूह का निरंतर आचरण बताता है; ‘त्याग देना’ वाचा-संबंधी गंभीरता बनाए रखता है।
- source_word: הַשְּׁכֵחִים אֶת הַר קָדְשִׁי
  choice: जो मेरे पवित्र पर्वत को भूल जाते हो
  rationale: मूल अर्थ और समांतर कृदन्त संरचना दोनों सुरक्षित हैं; ‘मेरा पवित्र पर्वत’ सिय्योन का संकेत है, पर पाठ में उसे स्पष्ट करके नहीं जोड़ा गया।
- source_word: הָעֹרְכִים ... שֻׁלְחָן
  choice: मेज़ सजाते हो
  rationale: ערך का यहाँ अर्थ मेज़ पर भोज्य सामग्री व्यवस्थित करना है; ‘मेज़ सजाना’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לַגַּד
  choice: गाद के लिए
  rationale: गַּד को भाग्य से संबद्ध देवता का व्यक्तिवाचक नाम मानकर लिप्यंतरित किया गया है; उसका संभावित अर्थ पादटिप्पणी में दिया गया है।
- source_word: לַמְנִי
  choice: मेनी के लिए
  rationale: מְנִי को नियति से संबद्ध देवता का व्यक्तिवाचक नाम मानकर लिप्यंतरित किया गया है; अर्थगत विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: מִמְסָךְ
  choice: मिश्रित मदिरा
  rationale: यह संज्ञा तैयार या मिलाई हुई पेय-मदिरा को दर्शाती है, संभवतः अर्घ के संदर्भ में; अनुष्ठान की अस्पष्टता को अनावश्यक रूप से स्पष्ट नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा या प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है; उपाधि से बदलने के बजाय उसका हिन्दी लिप्यंतरण किया गया है।
- issue: גַּד और מְנִי नाम हैं या अर्थसूचक शब्द
  choice: मुख्य पाठ में ‘गाद’ और ‘मेनी’
  alternative: ‘भाग्य’ और ‘नियति’
  rationale: संदर्भ में इन्हें देवताओं अथवा देवतुल्य शक्तियों के नाम मानना सर्वाधिक संभावित है, पर उनके अर्थगत संबंध को पादटिप्पणियों में रखा गया है ताकि वास्तविक व्याख्यात्मक तनाव बना रहे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर ‘जो...’ उपवाक्य इब्रानी कृदन्तों की आरोपात्मक लय बनाए रखते हैं। पद अगले वाक्य में जारी रहने के कारण अंत में दीर्घ विराम-चिह्न रखा गया है।
