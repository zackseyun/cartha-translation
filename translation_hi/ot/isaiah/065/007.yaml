base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/007.yaml
  text: your iniquities and the iniquities of your fathers together[a], says Yahweh, because they burned incense on the mountains and reproached me on the hills[b]; so I will measure their former deed into their lap.
translation:
  language: hi
  text: “तुम्हारे अधर्म और तुम्हारे पुरखाओं के अधर्म—दोनों एक साथ,” याहवे कहता है, “क्योंकि उन्होंने पहाड़ों पर धूप जलाई और पहाड़ियों पर मेरी निंदा की; इसलिए मैं उनके पहले के काम[a] का माप उनकी ही गोद में डाल दूँगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनका प्रतिफल।” इब्रानी शब्द פְעֻלָּתָם का अर्थ काम अथवा उसका मिलने वाला प्रतिफल—दोनों हो सकता है; पर इस वाक्य की अगली उक्ति स्वयं बदला चुकाने का भाव व्यक्त करती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “उनकी गोद में।” यह इब्रानी मुहावरा बताता है कि उनके कामों का प्रतिफल सीधे और व्यक्तिगत रूप से उन्हीं को मिलेगा।
    reason: cultural_note
lexical_decisions:
- source_word: עֲוֺנֹתֵיכֶם
  choice: तुम्हारे अधर्म
  rationale: עָוֹן में नैतिक बुराई, दोष और उसके परिणाम का भाव हो सकता है। यहाँ “अधर्म” अपराध की नैतिक गंभीरता बनाए रखता है, पर इसे केवल दण्ड के अर्थ तक सीमित नहीं करता।
- source_word: וַעֲוֺנֹת אֲבוֹתֵיכֶם
  choice: और तुम्हारे पुरखाओं के अधर्म
  rationale: אבות यहाँ पिछली पीढ़ियों के पितरों/पूर्वजों को सूचित करता है। आधुनिक हिन्दी में “पुरखाओं” से वाचा-इतिहास का पारिवारिक और पीढ़ीगत भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: יַחְדָּו
  choice: दोनों एक साथ
  rationale: यह वर्तमान लोगों और उनके पुरखाओं के अधर्म को न्याय में संयुक्त रूप से सामने रखता है। “दोनों एक साथ” इस बल को स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: दिव्य नाम को किसी उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: קִטְּרוּ
  choice: धूप जलाई
  rationale: पिएल रूप का आशय उपासना-सन्दर्भ में सुगन्धित धूप जलाना है। “धूप जलाई” सरल और प्रत्यक्ष हिन्दी है।
- source_word: עַל הֶהָרִים וְעַל הַגְּבָעוֹת
  choice: पहाड़ों पर … पहाड़ियों पर
  rationale: मूल की समानांतर भौगोलिक अभिव्यक्तियों को बनाए रखा गया है; “ऊँचे स्थानों” जैसा व्याख्यात्मक धार्मिक पद नहीं जोड़ा गया।
- source_word: חֵרְפוּנִי
  choice: मेरी निन्दा की
  rationale: חרף में अपमान, तिरस्कार या निन्दा का भाव है। “मेरी निन्दा की” गरिमापूर्ण और सामान्य आधुनिक हिन्दी है तथा अपराध की विधि को अनावश्यक रूप से अधिक निश्चित नहीं करती।
- source_word: וּמַדֹּתִי
  choice: इसलिए मैं … नापकर … डाल दूँगा
  rationale: מדד का मूल अर्थ “नापना” है। हिन्दी वाक्य में “इसलिए” पूर्ववर्ती कारण और आगामी न्याय का परिणाम-संबंध स्पष्ट करता है।
- source_word: פְעֻלָּתָם
  choice: उनके … काम
  rationale: פְּעֻלָּה का अर्थ काम/कर्म अथवा प्रतिफल हो सकता है। मुख्य पाठ में “काम” रखने से मूल की शब्दार्थगत अस्पष्टता अति-व्याख्या द्वारा समाप्त नहीं होती; प्रतिदान का भाव पूरी गोद-वाली उक्ति से मिलता है।
- source_word: רִאשֹׁנָה
  choice: पहले के
  rationale: यह उनके पूर्व या पिछले कर्म की ओर संकेत करता है। “पहले के” आधुनिक हिन्दी में स्वाभाविक है और इसे केवल “सबसे पहला” कर्म नहीं बनाता।
- source_word: עַל חֵיקָם
  choice: उनकी ही गोद में
  rationale: शाब्दिक देह-रूपक को “गोद” से सुरक्षित रखा गया है। “ही” प्रतिफल के सीधे उन्हीं पर लौटने के व्यक्तिगत बल को व्यक्त करता है।
theological_decisions:
- issue: पीढ़ियों के पार अधर्म और न्याय
  choice: वर्तमान श्रोताओं के अधर्म और उनके पुरखाओं के अधर्म को “दोनों एक साथ” रखा गया है, और बहुवचन क्रियाएँ उसी अपराधी ढाँचे में सहभागिता दिखाती हैं।
  alternative: इसे ऐसा कथन माना जा सकता है जिसमें वंशजों को उनकी अपनी सहभागिता से निरपेक्ष होकर केवल पुरखाओं के पापों के लिए दण्ड मिलता है।
  rationale: पद स्वयं “तुम्हारे अधर्म” और “तुम्हारे पुरखाओं के अधर्म” दोनों कहता है। अनुवाद इस पीढ़ीगत तनाव को बनाए रखता है और पद से बाहर का धर्मवैज्ञानिक समाधान आरोपित नहीं करता।
- issue: פְעֻלָּתָם का न्याय-सन्दर्भ में अर्थ
  choice: मुख्य पाठ में “उनके पहले के काम”।
  alternative: “उनका प्रतिफल” या “उनकी मजदूरी”।
  rationale: गोद में नापकर डालने की उक्ति पहले ही प्रतिदान सूचित करती है। “काम” मूल शब्द के कर्म और प्रतिफल—दोनों सम्भव अर्थों को फुटनोट सहित खुला रखता है और अनावश्यक पुनरुक्ति से बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद के आरम्भ का खण्डात्मक स्वर संदर्भानुसार उद्धरण में सुरक्षित है। पहाड़/पहाड़ियों की समानांतर रचना और गोद में नापकर डालने का मूल रूपक बनाए रखा गया है। फुटनोट-चिह्नों को उनके वास्तविक विषयों—“काम” और “गोद”—के ठीक बाद रखा गया है।
