  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹ֤א יִבְנוּ֙ וְ/אַחֵ֣ר יֵשֵׁ֔ב לֹ֥א יִטְּע֖וּ וְ/אַחֵ֣ר יֹאכֵ֑ל כִּֽי כִ/ימֵ֤י הָ/עֵץ֙ יְמֵ֣י עַמִּ֔/י וּ/מַעֲשֵׂ֥ה יְדֵי/הֶ֖ם יְבַלּ֥וּ בְחִירָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/022.yaml
  text: They will not build and another inhabit; they will not plant and another eat. For the days of my people will be like the days of a tree[a], and my chosen ones will wear out the work of their hands.
translation:
  language: hi
  text: वे घर नहीं बनाएँगे, न कोई और उनमें बसेगा; वे पौधे नहीं लगाएंगे, न कोई और उनका फल खाएगा। क्योंकि मेरे लोगों की आयु वृक्ष की आयु के समान होगी, और मेरे चुने हुए अपने हाथों के काम का पूरा लाभ उठाएँगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “अपने हाथों के काम को घिस जाने तक इस्तेमाल करेंगे”; अर्थात वे लंबे समय तक अपने श्रम के फल का पूरा लाभ उठाएँगे।
    reason: יְבַלּוּ के ‘घिसा देना/पूरा इस्तेमाल कर लेना’ वाले ठोस बिंब को सुरक्षित रखते हुए, आशीष के प्रसंग में उसके दीर्घकालीन लाभ के अर्थ को स्पष्ट करता है।
lexical_decisions:
- source_word: יִבְנוּ
  choice: वे घर नहीं बनाएँगे
  rationale: क्रिया का मूल अर्थ ‘बनाना’ है। अगले पदांश में ‘बसने’ के कारण हिन्दी में निहित कर्म ‘घर’ स्पष्ट करना स्वाभाविक है। अपूर्ण क्रिया को पुनर्स्थापना की भावी प्रतिज्ञा के रूप में रखा गया है।
- source_word: וְאַחֵר יֵשֵׁב
  choice: कि उनमें कोई और बसे
  rationale: יָשַׁב का अर्थ यहाँ ‘बसना/निवास करना’ है। बहुवचन ‘उनमें’ पहले स्पष्ट किए गए घरों की ओर संकेत करता है।
- source_word: יִטְּעוּ ... וְאַחֵר יֹאכֵל
  choice: वे पौधे लगाएँगे कि उनका फल कोई और खाए
  rationale: נטע का सामान्य अर्थ ‘लगाना/रोपना’ और אכל का अर्थ ‘खाना’ है। खाने की निहित वस्तु को हिन्दी में स्वाभाविक बनाने के लिए ‘उनका फल’ कहा गया है।
- source_word: כִּי כִימֵי הָעֵץ יְמֵי עַמִּי
  choice: क्योंकि मेरे लोगों की आयु वृक्ष की आयु के समान होगी
  rationale: शाब्दिक ‘दिन’ यहाँ जीवन की अवधि को दर्शाता है। ‘आयु’ हिन्दी में तुलना को स्पष्ट और स्वाभाविक बनाता है, जबकि वृक्ष की दीर्घायु का बिंब बनाए रखता है।
- source_word: וּמַעֲשֵׂה יְדֵיהֶם
  choice: अपने हाथों के काम
  rationale: इब्रानी मुहावरे को निकटता से रखा गया है; इसका आशय उनके श्रम और उससे बनी वस्तुओं या उपज दोनों से हो सकता है।
- source_word: יְבַלּוּ
  choice: पूरा उपभोग करेंगे
  rationale: पिएल रूप का मूल बिंब ‘घिसा देना/अंत तक उपयोग करना’ है। आशीष के प्रसंग में इसका आशय अपने श्रम के फल को उसकी पूरी अवधि तक उपयोग करने और भोगने से है। फुटनोट अधिक शाब्दिक बिंब सुरक्षित रखता है।
- source_word: בְחִירָי
  choice: मेरे चुने हुए
  rationale: बहुवचन विशेष्य रूप का सीधा और धर्मवैचारिक रूप से अनावश्यक भार से मुक्त अनुवाद है।
theological_decisions:
- issue: יְבַלּוּ का अर्थ दीर्घकालीन आशीष के प्रसंग में
  choice: ‘पूरा उपभोग करेंगे’ मुख्य पाठ में
  alternative: ‘घिस जाने तक उपयोग करेंगे’ या ‘पूरा इस्तेमाल करेंगे’
  rationale: यह पद अपने श्रम का फल छिन न जाने और दीर्घकाल तक उसका लाभ पाने की प्रतिज्ञा करता है। मुख्य पाठ प्रसंगगत अर्थ देता है, जबकि फुटनोट मूल क्रिया के ठोस और कुछ हद तक अस्पष्ट बिंब को बनाए रखता है।
- issue: ‘वृक्ष के दिनों’ की कालावधि
  choice: ‘वृक्ष की आयु’
  alternative: ‘वृक्ष के दिनों’
  rationale: यहाँ ‘दिन’ जीवनकाल का सामी मुहावरा है। ‘आयु’ कोई विशिष्ट अंतकालीन समय-सारिणी आरोपित किए बिना हिन्दी पाठक तक वही दीर्घजीवन का आशय पहुँचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण स्तर रखा गया है। समानांतर नकारात्मक वाक्यों की काव्यात्मक संरचना बचाई गई है। ‘घर’ और ‘फल’ जैसे निहित कर्म हिन्दी में अर्थ स्पष्ट करने के लिए जोड़े गए हैं; कोई संप्रदायगत शब्दावली नहीं अपनाई गई।
