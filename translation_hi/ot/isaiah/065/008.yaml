base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/008.yaml
  text: 'Thus says Yahweh: As when new wine is found in a cluster[a], and one says, ‘Do not destroy it, for there is a blessing in it,’ so I will act for the sake of my servants[b], so as not to destroy all of them.'
translation:
  language: hi
  text: 'याहवे यों कहता है:


    “जैसे अंगूर के गुच्छे में नया दाखरस[a] मिलता है और कोई कहता है,


    ‘उसे नष्ट मत करो, क्योंकि उसमें आशीष है,’


    वैसे ही मैं अपने सेवकों के लिए ऐसा करूँगा,


    ताकि सबको नष्ट न करूँ।[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दाखरस” अथवा “ताज़ा दाखरस”; इब्रानी शब्द תִּירוֹשׁ विशेष रूप से नए दाखरस को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “समूचे को नष्ट न करना”; इब्रानी में कर्म निहित है, स्पष्ट रूप से बताया नहीं गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण द्वारा व्यक्त किया गया है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यवाणी की मानक उद्घोषणा को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में बनाए रखता है।
- source_word: תִּירוֹשׁ
  choice: नया दाखमधु
  rationale: यह शब्द सामान्य दाखमधु के बजाय विशेष रूप से नई या ताज़ी दाखमधु को सूचित करता है; पादटिप्पणी में विकल्प दिए गए हैं।
- source_word: אֶשְׁכּוֹל
  choice: अंगूरों का गुच्छा
  rationale: मूल शब्द का अर्थ ‘गुच्छा’ है और प्रसंग से अंगूर स्पष्ट हैं; हिन्दी में पूर्ण चित्र स्पष्ट करने के लिए ‘अंगूरों’ जोड़ा गया है।
- source_word: וְאָמַר
  choice: कोई कहता है
  rationale: इब्रानी क्रिया का कर्ता अनिश्चित है; ‘कोई’ उसी अनिश्चितता को स्वाभाविक हिन्दी में रखता है।
- source_word: אַל תַּשְׁחִיתֵהוּ
  choice: उसे नष्ट मत करो
  rationale: ‘नष्ट करना’ שׁחת के अर्थ को व्यक्त करता है और पद के अंत में उसी धातु की पुनरावृत्ति भी सुरक्षित रखता है।
- source_word: כִּי בְרָכָה בּוֹ
  choice: क्योंकि उसमें आशीष है
  rationale: यह मूल के ठोस ‘आशीष’ रूपक और उसके भीतर होने की धारणा को सीधे बनाए रखता है।
- source_word: כֵּן אֶעֱשֶׂה
  choice: वैसे ही ... ऐसा करूँगा
  rationale: ‘जैसे...वैसे ही’ की तुलना को स्पष्ट रखते हुए עשה को सामान्य हिन्दी ‘करूँगा’ से व्यक्त किया गया है।
- source_word: לְמַעַן עֲבָדַי
  choice: अपने सेवकों के निमित्त
  rationale: ‘निमित्त’ उद्देश्य और उनके प्रति किए जाने वाले विचार, दोनों को गरिमापूर्ण ढंग से व्यक्त करता है; ‘सेवक’ प्रसंगानुकूल है।
- source_word: לְבִלְתִּי הַשְׁחִית הַכֹּל
  choice: ताकि सभी को नष्ट न करूँ
  rationale: प्रसंग में निहित कर्म न्याय के अधीन लोगों का समूह है। हिन्दी में ‘सभी को’ उस अर्थ को स्वाभाविक बनाता है, जबकि पादटिप्पणी मूल में कर्म की अनिर्दिष्टता दर्ज करती है।
theological_decisions:
- issue: अंतिम खंड में ‘सब/समूचा’ का संदर्भ
  choice: ‘सभी को नष्ट न करूँ’—अर्थात न्याय के अधीन पूरे जनसमूह को नष्ट न करना
  alternative: ‘सब कुछ नष्ट न करूँ’ या शाब्दिक रूप से अनिर्दिष्ट ‘समूचे को नष्ट न करना’
  rationale: दृष्टांत अंगूरों के गुच्छे का है, पर उसका अनुप्रयोग परमेश्वर के लोगों और उसके सेवकों पर है। मुख्य पाठ प्रसंगगत मानवीय संदर्भ देता है, और पादटिप्पणी यह सुरक्षित रखती है कि इब्रानी में कर्म स्पष्ट रूप से व्यक्त नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, भविष्यवाणी के अनुरूप गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘यों कहता है’, ‘निमित्त’ और काव्यात्मक पंक्ति-विन्यास औपचारिकता बनाए रखते हैं; कठिन या अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
