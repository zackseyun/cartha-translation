base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/025.yaml
  text: The wolf and the lamb will graze together[a], and the lion will eat straw like the cattle; and dust will be the serpent’s food[c][b]. They will do no evil or destruction on all my holy mountain," says Yahweh.
translation:
  language: hi
  text: भेड़िया और मेमना एक साथ चरेंगे[a], और सिंह मवेशियों के समान भूसा खाएगा; सर्प का भोजन धूल होगा[b]। वे मेरे सारे पवित्र पर्वत पर न तो हानि पहुँचाएँगे, न विनाश करेंगे[c], यहोवा ने कहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मेमना’ के स्थान पर ‘बकरी का बच्चा’ भी संभव है; इब्रानी टालेह छोटे पालतू पशु के बच्चे के लिए अधिक व्यापक रूप से प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: सर्प के धूल खाने का कथन संभवतः उत्पत्ति 3:14 की ओर संकेत करता है।
    reason: cross_reference
  - marker: c
    text: ‘हानि पहुँचाएँगे’ का अनुवाद ‘बुराई करेंगे’ भी हो सकता है; इब्रानी क्रिया हानिकारक काम और नैतिक बुराई, दोनों पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זְאֵב
  choice: भेड़िया
  rationale: इस पशु के लिए मानक और स्वाभाविक हिन्दी शब्द।
- source_word: טָלֶה
  choice: मेमना
  rationale: यह शब्द भेड़ या बकरी जैसे छोटे पालतू पशु के बच्चे को व्यापक रूप से सूचित कर सकता है; भेड़िये के साथ शान्ति-चित्र में ‘मेमना’ स्वाभाविक है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: יִרְעוּ כְאֶחָד
  choice: एक साथ चरेंगे
  rationale: चरने की क्रिया और כְאֶחָד के सामूहिक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כַּבָּקָר
  choice: मवेशियों के समान
  rationale: בָּקָר सामूहिक रूप से गाय-बैल वर्ग के पशुओं को दर्शाता है; ‘मवेशियों’ से अनावश्यक रूप से किसी एक पशु को निश्चित नहीं किया गया।
- source_word: יֹאכַל תֶּבֶן
  choice: भूसा खाएगा
  rationale: תֶּבֶן का सीधा अर्थ ‘भूसा’ है और सिंह के अहिंसक आहार का उलटाव बनाए रखता है।
- source_word: נָחָשׁ
  choice: सर्प
  rationale: गरिमापूर्ण साहित्यिक शैली रखता है और उत्पत्ति 3:14 की सम्भावित प्रतिध्वनि को सुरक्षित करता है।
- source_word: עָפָר לַחְמוֹ
  choice: सर्प का भोजन धूल होगा
  rationale: לֶחֶם का मूल अर्थ रोटी है, पर यहाँ व्यापक अर्थ ‘भोजन’ स्वाभाविक है; वाक्य-विन्यास में धूल को सर्प का भोजन बताया गया है।
- source_word: לֹא יָרֵעוּ
  choice: न तो हानि पहुँचाएँगे
  rationale: हिफ़ील क्रिया רעע यहाँ बुरा करने अथवा हानि पहुँचाने दोनों अर्थ दे सकती है; शान्ति और विनाश के प्रसंग में ‘हानि पहुँचाना’ सुसंगत है, जबकि नैतिक अर्थ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: לֹא יַשְׁחִיתוּ
  choice: न विनाश करेंगे
  rationale: שׁחת की विनाशकारी क्रिया को स्पष्ट रूप से व्यक्त करता है और पहली निषेधात्मक क्रिया के साथ समानान्तरता बनाए रखता है।
- source_word: בְּכָל הַר קָדְשִׁי
  choice: मेरे सारे पवित्र पर्वत पर
  rationale: ‘पर्वत पर’ स्वाभाविक हिन्दी है और כָּל के सम्पूर्ण विस्तार को ‘सारे’ से व्यक्त किया गया है।
- source_word: אָמַר יְהוָה
  choice: यह यहोवा का वचन है
  rationale: नबी-वाणी की समापन उक्ति को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करते हुए ईश्वरीय नाम को ‘यहोवा’ रूप में सुरक्षित रखता है।
theological_decisions:
- issue: सर्प और धूल के कथन में उत्पत्ति 3:14 की सम्भावित प्रतिध्वनि
  choice: मुख्य पाठ में ‘सर्प का भोजन धूल होगा’ रखा गया और संकेत को पादटिप्पणी तक सीमित किया गया।
  alternative: ‘साँप’ कहना या मुख्य पाठ में शाप का स्पष्ट उल्लेख जोड़ना।
  rationale: मूल पद केवल धूल को सर्प का भोजन बताता है। ‘सर्प’ साहित्यिक सम्बन्ध को सम्भव बनाए रखता है, पर अनुल्लिखित व्याख्या मुख्य पाठ में नहीं जोड़ता।
- issue: לֹא יָרֵעוּ का नैतिक अथवा हानिकारक अर्थ
  choice: प्रसंगानुसार ‘हानि पहुँचाएँगे’ मुख्य पाठ में रखा।
  alternative: ‘बुराई करेंगे’ या ‘दुष्टता करेंगे’।
  rationale: क्रिया दोनों अर्थ ग्रहण कर सकती है। अगले पदांश ‘विनाश करेंगे’ और पशुओं की हिंसा समाप्त होने के चित्र के साथ ‘हानि पहुँचाना’ अधिक स्वाभाविक है; व्यापक नैतिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किन्तु गरिमापूर्ण भविष्यवाणी-शैली। पशु-चित्र और काव्यात्मक समानान्तरता को स्पष्ट रखा गया है। ‘यहोवा’ से मूल पाठ के व्यक्तिगत ईश्वरीय नाम יהוה को दर्शाया गया है।
