  text: כִּֽי הִנְ/נִ֥י בוֹרֵ֛א שָׁמַ֥יִם חֲדָשִׁ֖ים וָ/אָ֣רֶץ חֲדָשָׁ֑ה וְ/לֹ֤א תִזָּכַ֨רְנָה֙ הָ/רִ֣אשֹׁנ֔וֹת וְ/לֹ֥א תַעֲלֶ֖ינָה עַל לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/017.yaml
  text: For behold[a], I am creating new heavens and a new earth; and the former things will not be remembered[b], nor will they come to mind.
translation:
  language: hi
  text: क्योंकि देखो, मैं नया आकाश और नई पृथ्वी रच रहा हूँ; पहली बातें याद नहीं की जाएँगी[a], और न वे मन में आएँगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पहली बातें स्मरण नहीं की जाएँगी।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘और न वे हृदय पर चढ़ेंगी’; यह ‘मन में आने’ के अर्थ का इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले प्रसंग के कारण या आधार को प्रस्तुत करता है; ‘क्योंकि’ उसके व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: यह ध्यान आकर्षित करने के साथ वक्ता की उपस्थिति और कथन पर बल देता है; ‘देखो, मैं’ आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: בוֹרֵא
  choice: रच रहा हूँ
  rationale: सहभागी रूप जारी या निश्चित रूप से आरम्भ होने वाली सृजन-क्रिया को सामने रखता है; यह हिन्दी में उसके पक्ष और बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שָׁמַיִם חֲדָשִׁים
  choice: नया आकाश
  rationale: हिन्दी बाइबलीय प्रयोग में ‘आकाश’ प्रायः इब्रानी बहुवचन שָׁמַיִם का स्वाभाविक सामूहिक रूप है और यहाँ सृष्टिगत व्यापकता रखता है।
- source_word: וָאָרֶץ חֲדָשָׁה
  choice: और नई पृथ्वी
  rationale: ‘आकाश’ के समानांतर אֶרֶץ यहाँ केवल किसी भूभाग के बजाय पूरी पृथ्वी को सूचित करता है।
- source_word: הָרִאשֹׁנוֹת
  choice: पिछली बातें
  rationale: स्त्रीलिंग बहुवचन विशेषण यहाँ संज्ञा की तरह प्रयुक्त है; ‘पिछली बातें’ पर्याप्त व्यापक है और पुरानी व्यवस्था को अनावश्यक रूप से विशिष्ट नहीं बनाता।
- source_word: תִזָּכַרְנָה
  choice: याद नहीं की जाएँगी
  rationale: निफ़अल रूप की कर्मवाच्य अस्पष्टता को बनाए रखते हुए यह स्वाभाविक हिन्दी देता है; कर्ता को पाठ से अधिक निश्चित नहीं किया गया।
- source_word: תַעֲלֶינָה עַל לֵב
  choice: मन में आएँगी
  rationale: शाब्दिक रूप से ‘हृदय पर चढ़ेंगी’ इब्रानी मुहावरा है; ‘मन में आएँगी’ उसका स्वाभाविक हिन्दी अर्थ व्यक्त करता है।
theological_decisions:
- issue: प्रतिज्ञात नवीकरण का सृष्टिगत विस्तार
  choice: ‘नया आकाश और नई पृथ्वी’ को पूर्ण सृष्टिगत भाषा के रूप में रखा गया है।
  alternative: इसे केवल निर्वासन के बाद की राजनीतिक या राष्ट्रीय पुनर्स्थापना का रूपक मानना।
  rationale: ‘आकाश और पृथ्वी’ का युग्म सृष्टि-संबंधी व्यापकता रखता है। अनुवाद इस विस्तार को संकुचित नहीं करता, पर किसी विस्तृत अंतकालीन व्यवस्था को भी पद पर आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘देखो’ ने הִנְנִי का ध्यानाकर्षक बल रखा है; ‘रच रहा हूँ’ सहभागी रूप को दर्शाता है। मुख्य पाठ के दोनों पाद-टिप्पणी चिह्न उनके संबंधित विकल्पों के साथ स्पष्ट रूप से दिए गए हैं।
