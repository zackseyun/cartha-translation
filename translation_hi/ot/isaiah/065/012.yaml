base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/012.yaml
  text: And I will destine you for the sword[a], and all of you will bow down for the slaughter, because I called and you did not answer; I spoke and you did not listen. And you did what was evil in my eyes[d][c][b], and chose what I did not delight in.
translation:
  language: hi
  text: और मैं तुम्हें तलवार के लिए ठहराऊँगा[a], और तुम सब वध के लिए झुक जाओगे[b]; क्योंकि मैंने पुकारा, पर तुमने उत्तर नहीं दिया; मैंने कहा, पर तुमने नहीं सुना[c]। और तुमने वही किया जो मेरी दृष्टि में बुरा था, और उसे चुना जिससे मैं प्रसन्न नहीं था[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हें नियुक्त करूँगा” अथवा “तुम्हें गिनूँगा।” हिब्रानी क्रिया पिछले पद के “भाग्य” नामक देवता के साथ शब्द-क्रीड़ा भी कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “घुटने टेकोगे” अथवा “दुबक जाओगे।” हिब्रानी क्रिया का शाब्दिक अर्थ घुटना मोड़ना है; यहाँ यह न्याय के अधीन गिर पड़ने का चित्र प्रस्तुत करती है।
    reason: lexical_alternative
  - marker: c
    text: या “ध्यान नहीं दिया”; निहित अर्थ “आज्ञा नहीं मानी” भी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: या “जिसकी मैंने इच्छा नहीं की” अथवा “जिसमें मुझे आनंद नहीं था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָנִיתִי
  choice: मैं तुम्हें ... ठहराऊँगा
  rationale: מנה का यहाँ अर्थ नियुक्त या नियत करना है। ‘ठहराऊँगा’ न्याय के लिए सौंपे जाने का भाव देता है और पिछले पद में ‘भाग्य’ के साथ संभावित शब्द-क्रीड़ा को पूरी तरह व्याख्यायित नहीं करता।
- source_word: לַחֶרֶב
  choice: तलवार के लिए
  rationale: यह युद्ध या दंड द्वारा मृत्यु के लिए सौंपे जाने का हिब्रानी मुहावरा है; पदबंध की कठोर न्यायिक छवि सुरक्षित रखी गई है।
- source_word: לַטֶּבַח
  choice: वध के लिए
  rationale: טבח का अर्थ वध या संहार है। संक्षिप्त हिंदी समानांतर पद ‘तलवार के लिए’ के साथ स्वाभाविक बैठता है।
- source_word: תִּכְרָעוּ
  choice: घुटने टेकोगे
  rationale: כרע का ठोस अर्थ घुटना मोड़ना या झुकना है। यहाँ न्याय के नीचे गिर पड़ने का संकेत है, पर अनुवाद उस संकेत को स्पष्ट व्याख्या में नहीं बदलता।
- source_word: קָרָאתִי ... עֲנִיתֶם
  choice: मैंने पुकारा, पर तुमने उत्तर नहीं दिया
  rationale: पुकारने और उत्तर देने की मूल समानांतरता तथा व्यक्तिगत संबोधन दोनों सुरक्षित हैं।
- source_word: דִּבַּרְתִּי ... שְׁמַעְתֶּם
  choice: मैंने कहा, पर तुमने नहीं सुना
  rationale: שמע सुनने, ध्यान देने और आज्ञा मानने तक का अर्थ दे सकता है। ‘नहीं सुना’ श्रवण-संबंधी समानांतरता बचाता है और आज्ञा न मानने के निहितार्थ को खुला रखता है।
- source_word: וַתַּעֲשׂוּ הָרַע בְּעֵינַי
  choice: तुमने वही किया जो मेरी दृष्टि में बुरा था
  rationale: ‘मेरी आँखों में’ के हिब्रानी मूल्यांकनात्मक मुहावरे को स्वाभाविक, dignified आधुनिक हिंदी ‘मेरी दृष्टि में’ से व्यक्त किया गया है।
- source_word: וּבַאֲשֶׁר לֹא חָפַצְתִּי בְּחַרְתֶּם
  choice: उसे चुना जिससे मैं प्रसन्न नहीं था
  rationale: חפץ इच्छा, रुचि या प्रसन्नता व्यक्त करता है। यह रूप ईश्वरीय अप्रसन्नता को व्यक्त करता है, बिना उसे किसी विशिष्ट धर्मवैज्ञानिक प्रणाली में सीमित किए।
theological_decisions:
- issue: ईश्वरीय न्याय की सक्रिय भाषा
  choice: ‘मैं तुम्हें तलवार के लिए ठहराऊँगा’
  alternative: ‘मैं तुम्हें तलवार के लिए गिनूँगा’ / ‘मैं तुम्हें तलवार के हवाले कर दूँगा’
  rationale: मूल पाठ में परमेश्वर न्याय घोषित करने वाला सक्रिय कर्ता है। चुना हुआ रूप इस कठोरता को नरम नहीं करता, पर ‘हवाले कर दूँगा’ जैसी व्याख्यात्मक वृद्धि से बचता है।
- issue: שמע का अर्थ
  choice: ‘तुमने नहीं सुना’
  alternative: ‘तुमने ध्यान नहीं दिया’ / ‘तुमने आज्ञा नहीं मानी’
  rationale: ‘आज्ञा नहीं मानी’ संदर्भगत निहितार्थ है, पर मूल क्रिया की सुनने और प्रत्युत्तर देने वाली समानांतरता को सुरक्षित रखने के लिए ‘नहीं सुना’ रखा गया है।
- issue: כרע की न्याय-संबंधी छवि
  choice: ‘घुटने टेकोगे’
  alternative: ‘झुक जाओगे’ / ‘गिर पड़ोगे’
  rationale: मूल क्रिया घुटना मोड़ने की ठोस छवि देती है। संदर्भ में यह वध के सामने धराशायी होने को सूचित करती है, पर अनुवाद उस छवि को केवल ‘मरोगे’ में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिंदी, बहुवचन संबोधन और गरिमापूर्ण भविष्यवाणी-संबंधी शैली। वाक्य-लय में पुकार/उत्तर और कहना/सुनना की समानांतरता रखी गई है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में संबद्ध शब्दों के तुरंत बाद दिए गए हैं।
