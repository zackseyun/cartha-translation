source:
  edition: WLC
  text: אֲשֶׁ֨ר הַ/מִּתְבָּרֵ֜ךְ בָּ/אָ֗רֶץ יִתְבָּרֵךְ֙ בֵּ/אלֹהֵ֣י אָמֵ֔ן וְ/הַ/נִּשְׁבָּ֣ע בָּ/אָ֔רֶץ יִשָּׁבַ֖ע בֵּ/אלֹהֵ֣י אָמֵ֑ן כִּ֣י נִשְׁכְּח֗וּ הַ/צָּרוֹת֙ הָ/רִ֣אשֹׁנ֔וֹת וְ/כִ֥י נִסְתְּר֖וּ מֵ/עֵינָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/016.yaml
  text: whoever blesses himself in the land will bless himself by the God of truth[a], and whoever swears in the land will swear by the God of truth; because the former troubles are forgotten[c][b], and because they are hidden from my eyes.
translation:
  language: hi
  text: जो कोई देश में अपने को धन्य ठहराएगा,[a] वह सत्य के परमेश्वर के द्वारा अपने को धन्य ठहराएगा; और जो कोई देश में शपथ खाएगा, वह सत्य के परमेश्वर की शपथ लेकर शपथ खाएगा; क्योंकि पिछली विपत्तियाँ भुला दी गई हैं और मेरी आँखों से ओझल हो गई हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने लिए आशीष बोलेगा।” इब्रानी क्रिया आत्मवाचक है; इसका अर्थ “अपने को धन्य ठहराएगा” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “देश” के लिए प्रयुक्त इब्रानी शब्द का अर्थ “पृथ्वी” भी हो सकता है। “सत्य के परमेश्वर” का शाब्दिक रूप “आमेन के परमेश्वर” है; यहाँ “आमेन” में दृढ़ता, विश्वासयोग्यता और सत्य का भाव है। या “विश्वासयोग्य परमेश्वर।”
    reason: alternative_reading
lexical_decisions:
- source_word: הַמִּתְבָּרֵךְ / יִתְבָּרֵךְ
  choice: अपने लिए आशीष माँगेगा
  rationale: हित्पएल रूप का आत्मवाचक भाव बनाए रखता है और हिन्दी में उस व्यक्ति का भाव स्वाभाविक रूप से व्यक्त करता है जो परमेश्वर का नाम लेकर अपने लिए आशीष चाहता या अपने को धन्य कहता है।
- source_word: בָּאָרֶץ
  choice: इस देश में
  rationale: प्रसंग में אֶרֶץ को देश/भूमि मानना उपयुक्त है; ‘इस’ हिन्दी में संदर्भित देश को स्पष्ट करता है। व्यापक अर्थ ‘पृथ्वी’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בֵּאלֹהֵי אָמֵן
  choice: सत्यनिष्ठ परमेश्वर के नाम से
  rationale: אָמֵן में दृढ़ता, विश्वसनीयता और सत्य का संयुक्त भाव है। ‘सत्यनिष्ठ’ परमेश्वर की विश्वसनीयता और सत्यता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; ‘के नाम से’ आशीष और शपथ में परमेश्वर को आधार बनाकर पुकारने का अर्थ स्पष्ट करता है।
- source_word: הַנִּשְׁבָּע / יִשָּׁבַע
  choice: शपथ खाएगा
  rationale: निफ़अल का प्रचलित अर्थ ‘शपथ खाना’ है और यह आधुनिक हिन्दी में संक्षिप्त तथा स्वाभाविक है।
- source_word: הַצָּרוֹת הָרִאשֹׁנוֹת
  choice: पिछली विपत्तियाँ
  rationale: צָרוֹת संकट, क्लेश या विपत्तियों को दर्शाता है; ‘पिछली विपत्तियाँ’ पूर्वकालीन कठिनाइयों का गंभीर भाव बनाए रखता है।
- source_word: נִשְׁכְּחוּ
  choice: भुला दी गई हैं
  rationale: पूर्ण हुई क्रिया और उसके वर्तमान परिणाम दोनों व्यक्त होते हैं। हिन्दी का कर्मवाच्य मूल इब्रानी रूप के अनुरूप है।
- source_word: נִסְתְּרוּ מֵעֵינָי
  choice: मेरी आँखों से ओझल हो गई हैं
  rationale: मूल के मानवीकरण और ‘मेरी आँखों से छिपी’ होने की छवि को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: בֵּאלֹהֵי אָמֵן का अर्थ
  choice: सत्यनिष्ठ परमेश्वर
  alternative: सत्य के परमेश्वर; आमेन के परमेश्वर
  rationale: אָמֵן यहाँ असामान्य ईश्वरीय विशेषण है। ‘सत्यनिष्ठ’ उसकी दृढ़ विश्वसनीयता और सत्यता का संयुक्त अर्थ देता है, जबकि केवल लिप्यंतरण ‘आमेन’ सामान्य हिन्दी पाठक के लिए अर्थ अस्पष्ट कर सकता है। विकल्प पादटिप्पणी में दिए गए हैं ताकि मूल की विशिष्टता और अर्थ-तनाव बना रहे।
- issue: בָּאָרֶץ का दायरा
  choice: इस देश में
  alternative: पृथ्वी पर
  rationale: निकट प्रसंग देश/भूमि का अर्थ स्वीकार करता है, पर इब्रानी शब्द व्यापक रूप से पृथ्वी भी दर्शा सकता है। व्यापक नवीकृत-सृष्टि संबंधी संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: पूर्व विपत्तियों का परमेश्वर की आँखों से ओझल होना
  choice: मानवीकरण को बनाए रखा गया
  alternative: परमेश्वर अब उन्हें स्मरण नहीं करेगा
  rationale: व्याख्यात्मक विस्तार से बचते हुए मूल की सशक्त छवि और उसके धर्मवैज्ञानिक तनाव को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ स्तर रखा गया है। समानांतर वाक्य-विन्यास को बनाए रखते हुए अनावश्यक संस्कृतनिष्ठता से बचा गया है।
