source:
  edition: WLC
  text: פֵּרַ֧שְׂתִּי יָדַ֛/י כָּל הַ/יּ֖וֹם אֶל עַ֣ם סוֹרֵ֑ר הַ/הֹלְכִים֙ הַ/דֶּ֣רֶךְ לֹא ט֔וֹב אַחַ֖ר מַחְשְׁבֹתֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/002.yaml
  text: I spread out my hands all day long to a rebellious people[a], who walk in a way that is not good[c][b], following their own thoughts.
translation:
  language: hi
  text: मैंने दिन भर एक विद्रोही प्रजा[b] की ओर अपने हाथ फैलाए रखे[a], जो अपने ही विचारों[c] के अनुसार ऐसे मार्ग पर चलती है जो अच्छा नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने हाथ बढ़ाए रखे।”
    reason: lexical_alternative
  - marker: b
    text: या, “एक हठी प्रजा।”
    reason: lexical_alternative
  - marker: c
    text: या, “अपनी ही योजनाओं” अथवा “अपनी ही युक्तियों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֵּרַשְׂתִּי יָדַי
  choice: मैंने ... अपने हाथ फैलाए रखे
  rationale: क्रिया और द्विवचन संज्ञा के ठोस शारीरिक बिंब को बनाए रखते हुए ‘रखे’ पूरे दिन जारी रहने वाली मुद्रा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: यह आधुनिक हिन्दी में पूरे दिन निरंतरता का स्वाभाविक और सटीक मुहावरा है।
- source_word: עַם סוֹרֵר
  choice: एक विद्रोही प्रजा
  rationale: ‘प्रजा’ सामूहिक जनसमुदाय को व्यक्त करती है और ‘विद्रोही’ סוֹרֵר के मुड़ जाने, अवज्ञा और हठ के नैतिक भाव को समेटता है।
- source_word: הַהֹלְכִים הַדֶּרֶךְ לֹא טוֹב
  choice: जो ... ऐसे मार्ग पर चलती है जो अच्छा नहीं है
  rationale: ‘चलना’ जीवन-आचरण के मूल रूपक को बचाता है, जबकि ‘अच्छा नहीं’ इब्रानी के नकारात्मक पदबंध को ‘बुरा’ या ‘दुष्ट’ बनाकर अनावश्यक रूप से तीव्र नहीं करता।
- source_word: אַחַר מַחְשְׁבֹתֵיהֶם
  choice: अपने ही विचारों के पीछे
  rationale: מַחְשָׁבוֹת का सीधा अर्थ ‘विचार’ है; ‘अपने ही’ स्वामित्व और स्वनिर्देशित आचरण को स्वाभाविक हिन्दी में स्पष्ट करता है, और ‘के पीछे’ אַחַר के अनुसरण-भाव को बनाए रखता है।
theological_decisions:
- issue: अवज्ञाकारी प्रजा के प्रति परमेश्वर की मुद्रा
  choice: ‘अपने हाथ फैलाए रखे’ के मानवरूपी बिंब को अक्षुण्ण रखा गया है।
  alternative: ‘मैं लगातार पुकारता रहा’ या ‘मैं उन तक पहुँचने का प्रयत्न करता रहा।’
  rationale: मूल पाठ परमेश्वर की लगातार खुली या आग्रहपूर्ण मुद्रा और मनुष्य के विद्रोह को साथ रखता है। ठोस बिंब को बचाने से यह तनाव बिना व्याख्यात्मक रूप से सीमित किए बना रहता है।
- issue: प्रजा के आचरण का नैतिक मूल्यांकन
  choice: לֹא טוֹב का अनुवाद ‘अच्छा नहीं है’ किया गया है।
  alternative: ‘बुरा है’ या ‘दुष्ट है।’
  rationale: मूल में ‘अच्छा’ का निषेध है। उसी को बनाए रखना स्रोत से अधिक विशिष्ट या तीव्र नैतिक शब्द आरोपित करने से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। डैश अगले वर्णन को उसी ‘प्रजा’ से स्पष्ट रूप से जोड़ता है। ‘मैंने ... रखे’ वक्ता के व्याकरणिक लिंग को अनावश्यक रूप से प्रकट किए बिना निरंतर क्रिया व्यक्त करता है।
