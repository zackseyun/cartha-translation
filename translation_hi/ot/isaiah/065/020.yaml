source:
  edition: WLC
  text: לֹא יִֽהְיֶ֨ה מִ/שָּׁ֜ם ע֗וֹד ע֤וּל יָמִים֙ וְ/זָקֵ֔ן אֲשֶׁ֥ר לֹֽא יְמַלֵּ֖א אֶת יָמָ֑י/ו כִּ֣י הַ/נַּ֗עַר בֶּן מֵאָ֤ה שָׁנָה֙ יָמ֔וּת וְ/הַ֣/חוֹטֶ֔א בֶּן מֵאָ֥ה שָׁנָ֖ה יְקֻלָּֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/020.yaml
  text: No more shall there be from there an infant of days[a], or an old man who does not fill out his days; for the youth will die a hundred years old[c][b], and the sinner a hundred years old will be accursed.
translation:
  language: hi
  text: वहाँ फिर न तो ऐसा शिशु होगा जो केवल कुछ ही दिन जीवित रहे[a], और न ऐसा वृद्ध जो अपने दिन पूरे न करे;[b] क्योंकि युवक सौ वर्ष की आयु में मरेगा, और पापी सौ वर्ष की आयु में शापित होगा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शब्दशः, “दिनों का शिशु”; अर्थात ऐसा शिशु जो केवल कुछ ही दिन जिए।
    reason: lexical_alternative
  - marker: b
    text: या, “ऐसा वृद्ध जो अपनी आयु पूरी न करे।”
    reason: lexical_alternative
  - marker: c
    text: या, “अभिशप्त होगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: वहाँ
  rationale: हिब्रू में מִן (‘से’) स्पष्ट है, पर इस प्रसंग में ‘वहाँ’ स्वाभाविक हिन्दी में ‘उस स्थान में/से’ का आशय व्यक्त करता है; अधिक शब्दशः रूप ‘वहाँ से’ हिन्दी में अनपेक्षित अर्थ दे सकता है।
- source_word: עוּל יָמִים
  choice: थोड़े दिनों का शिशु
  rationale: शब्दशः बनावट ‘दिनों का शिशु’ है और बहुत कम दिन जीने वाले शिशु की ओर संकेत करती है। मुख्य पाठ हिब्रू बिंब को यथासंभव रखते हुए हिन्दी में समझने योग्य बनाया गया है।
- source_word: זָקֵן אֲשֶׁר לֹא יְמַלֵּא אֶת יָמָיו
  choice: ऐसा वृद्ध जो अपने दिन पूरे न करे
  rationale: מלא + ימים की अभिव्यक्ति को ‘अपने दिन पूरे करना’ निकटता से दर्शाता है और पूर्ण आयु तक जीने का अर्थ देता है।
- source_word: הַנַּעַר
  choice: युवक
  rationale: נַעַר का अर्थ बालक से युवक तक हो सकता है। यहाँ वृद्धावस्था से तुलना और सौ वर्ष की आयु के उल्लेख के कारण ‘युवक’ उपयुक्त है, जबकि आयु-सीमा को आवश्यकता से अधिक निश्चित नहीं किया गया।
- source_word: בֶּן מֵאָה שָׁנָה
  choice: सौ वर्ष का होकर
  rationale: यह आयु बताने वाली सामान्य हिब्रू रचना है; ‘सौ वर्ष का होकर’ स्वाभाविक हिन्दी समतुल्य है।
- source_word: יָמוּת
  choice: मरेगा
  rationale: भविष्यदर्शी प्रसंग में अपूर्ण क्रिया को भविष्यकाल में रखना स्वाभाविक और सीधा है।
- source_word: הַחוֹטֵא
  choice: पापी
  rationale: संज्ञात्मक कृदन्त उस व्यक्ति को बताता है जिसकी पहचान पाप करने वाले के रूप में है; ‘पापी’ संक्षिप्त और स्वाभाविक है।
- source_word: יְקֻלָּל
  choice: शापित होगा
  rationale: पुअल रूप किसी के शाप के अधीन होने को व्यक्त करता है। ‘शापित होगा’ न्यायिक और गंभीर भाव को बनाए रखता है।
theological_decisions:
- issue: नई सृष्टि की भविष्यवाणी के संदर्भ में मृत्यु और शाप से संबंधित कठिन कथनों का अनुवाद
  choice: ‘मरेगा’ और ‘शापित होगा’ को सीधे अनूदित करते हुए असाधारण दीर्घायु और पाप के शाप का कथन बनाए रखा गया है।
  alternative: ‘मरेगा’ को रूपक मानना, अथवा अन्य अंतकाल-संबंधी वचनों से तनाव हटाने के लिए कथन को व्याख्यात्मक रूप से बदलना।
  rationale: हिब्रू पाठ स्पष्ट रूप से मृत्यु और शाप की भाषा का प्रयोग करता है। अनुवाद इस धर्मवैज्ञानिक तनाव को किसी बाद की व्यवस्था के अनुसार हल नहीं करता, बल्कि पाठक के सामने खुला रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। समानांतर वाक्य-विन्यास और भविष्यकाल मूल की भविष्यदर्शी लय बनाए रखते हैं; कठिन कथनों को व्याख्यात्मक सामंजस्य देकर नरम नहीं किया गया।
