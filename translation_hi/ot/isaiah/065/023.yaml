  edition: WLC
  text: לֹ֤א יִֽיגְעוּ֙ לָ/רִ֔יק וְ/לֹ֥א יֵלְד֖וּ לַ/בֶּהָלָ֑ה כִּ֣י זֶ֜רַע בְּרוּכֵ֤י יְהוָה֙ הֵ֔מָּה וְ/צֶאֱצָאֵי/הֶ֖ם אִתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/023.yaml
  text: They will not labor for emptiness[a], nor bear children for calamity, for they are the offspring of those blessed by Yahweh, and their descendants with them.
translation:
  language: hi
  text: 'वे व्यर्थ परिश्रम नहीं करेंगे,

    न विपत्ति के लिए संतान उत्पन्न करेंगे[a],

    क्योंकि वे याहवे से आशीष पाए हुए लोगों की संतान हैं,

    और उनके वंशज उनके साथ होंगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘आतंक के लिए’ अथवा ‘अचानक विनाश के लिए।’ इब्रानी शब्द में घबराहट, आतंक या अचानक आनेवाली विपत्ति का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִיגְעוּ
  choice: परिश्रम करेंगे
  rationale: क्रिया יגע कठिन श्रम या परिश्रम करने का भाव देती है; ‘परिश्रम’ आधुनिक हिन्दी में सहज है और श्रम की तीव्रता बनाए रखता है।
- source_word: לָרִיק
  choice: व्यर्थ
  rationale: רִיק का मूल भाव खालीपन और निष्फलता है। ‘व्यर्थ परिश्रम’ हिन्दी में स्वाभाविक रूप से ऐसे श्रम को व्यक्त करता है जिसका कोई फल न निकले।
- source_word: יֵלְדוּ
  choice: सन्तान को जन्म देंगे
  rationale: ילד यहाँ सन्तान उत्पन्न करने के अर्थ में है। यह अभिव्यक्ति पूरे समुदाय के पारिवारिक भविष्य के सन्दर्भ में स्पष्ट और गरिमापूर्ण है।
- source_word: לַבֶּהָלָה
  choice: विपत्ति के लिए
  rationale: בֶּהָלָה आतंक, घबराहट या अचानक आनेवाली विपत्ति का बोध करा सकता है। प्रसंग में ‘विपत्ति’ बच्चों के विनाश और दुःख के लिए जन्म लेने की बात को स्वाभाविक हिन्दी में व्यक्त करता है; अन्य अर्थ पादटिप्पणी में रखे गए हैं।
- source_word: זֶרַע
  choice: वंश
  rationale: זֶרַע का शाब्दिक अर्थ ‘बीज’ है, पर यहाँ वह सन्तति या वंश को दर्शाता है। ‘वंश’ अगले पदांश के ‘वंशज’ से निकट सम्बन्ध रखते हुए सामुदायिक और पीढ़ीगत भाव बनाए रखता है।
- source_word: בְּרוּכֵי יְהוָה
  choice: याहवे से आशीष पाए लोगों
  rationale: बहुवचन रचनात्मक रूप בְּרוּכֵי उन लोगों को दर्शाता है जिन्हें याहवे ने आशीष दी है। ‘याहवे से आशीष पाए लोग’ स्पष्ट आधुनिक हिन्दी है।
- source_word: וְצֶאֱצָאֵיהֶם
  choice: और उनके वंशज
  rationale: צֶאֱצָאִים आगे की पीढ़ियों या वंशजों को दर्शाता है। ‘वंशज’ पीढ़ीगत निरन्तरता को स्पष्ट करता है।
- source_word: אִתָּם
  choice: उनके साथ रहेंगे
  rationale: शाब्दिक अर्थ ‘उनके साथ’ है। हिन्दी में विधेय पूरा करने और परिवार की बनी रहनेवाली संगति स्पष्ट करने के लिए ‘रहेंगे’ जोड़ा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम יְהוָה है। ‘याहवे’ उस नाम को सामान्य उपाधि में बदले बिना सीधे प्रस्तुत करता है।
- issue: זֶרַע בְּרוּכֵי יְהוָה का सम्बन्ध
  choice: याहवे से आशीष पाए लोगों का वंश
  alternative: याहवे का आशीष पाया हुआ वंश
  rationale: בְּרוּכֵי बहुवचन रचनात्मक रूप है, इसलिए सबसे सीधा व्याकरणिक अर्थ है कि वे याहवे से आशीष पाए लोगों की सन्तति हैं। वैकल्पिक अर्थ भाव की दृष्टि से सम्भव प्रतीत हो सकता है, पर वह रूपविज्ञान को कम सीधे ढंग से दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक समानान्तरता बनाए रखने के लिए पद को चार पंक्तियों में रखा गया है। पादटिप्पणी का चिह्न उसी शब्द-समूह के बाद रखा गया है जिससे वह वास्तव में सम्बन्धित है।
