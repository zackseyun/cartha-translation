source:
  edition: WLC
  text: הִנֵּ֧ה עֲבָדַ֛/י יָרֹ֖נּוּ מִ/טּ֣וּב לֵ֑ב וְ/אַתֶּ֤ם תִּצְעֲקוּ֙ מִ/כְּאֵ֣ב לֵ֔ב וּ/מִ/שֵּׁ֥בֶר ר֖וּחַ תְּיֵלִֽילוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/014.yaml
  text: Look[a], my servants will sing for gladness of heart, but you will cry out from pain of heart[d][c][b], and from a broken spirit you will wail.
translation:
  language: hi
  text: देखो, मेरे सेवक मन की प्रसन्नता के कारण गाएँगे[a], परन्तु तुम मन की पीड़ा के कारण चिल्लाओगे, और आत्मा के टूट जाने के कारण विलाप करोगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आनन्द से जयजयकार करेंगे।’
    reason: lexical_alternative
  - marker: b
    text: या ‘हाहाकार करोगे।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह शब्द ध्यान खींचते हुए कथन पर बल देता है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक है और इसके संकेतात्मक बल को बनाए रखता है।
- source_word: עֲבָדַי
  choice: मेरे सेवक
  rationale: संज्ञा सेवक अथवा दास का अर्थ दे सकती है; यहाँ यशायाह के सन्दर्भ में परमेश्वर से सम्बन्धित और उसकी सेवा करने वाले लोगों के लिए ‘सेवक’ अधिक स्वाभाविक है।
- source_word: יָרֹנּוּ
  choice: गाएँगे
  rationale: क्रिया आनन्द से गाने या ऊँचे स्वर में जयजयकार करने को व्यक्त करती है। ‘गाएँगे’ सकारात्मक, उत्सवपूर्ण भाव और अगले वाक्यांश के साथ सम्बन्ध को सहजता से व्यक्त करता है।
- source_word: מִטּוּב לֵב
  choice: मन की प्रसन्नता के कारण
  rationale: शाब्दिक रूप से यह ‘हृदय की भलाई/भली दशा से’ है, पर यहाँ मुहावरा आन्तरिक प्रसन्नता और कुशलता को दर्शाता है। कारणसूचक מִן को ‘के कारण’ से व्यक्त किया गया है।
- source_word: תִּצְעֲקוּ
  choice: चिल्लाओगे
  rationale: צעק संकट या पीड़ा में ऊँची आवाज़ से पुकारने अथवा चिल्लाने को दर्शाता है। यह सेवकों के आनन्दपूर्ण गान के साथ तीखा विरोध बनाए रखता है।
- source_word: מִכְּאֵב לֵב
  choice: मन की पीड़ा के कारण
  rationale: यह वाक्यांश आन्तरिक दर्द या व्यथा व्यक्त करता है। ‘मन की पीड़ा’ हिन्दी में स्वाभाविक रहते हुए मूल की हृदय-सम्बन्धी छवि और समानान्तरता को सुरक्षित रखता है।
- source_word: מִשֵּׁבֶר רוּחַ
  choice: आत्मा टूट जाने के कारण
  rationale: यह वाक्यांश भीतर के व्यक्ति के टूटने या चूर होने की दशा बताता है। क्रियात्मक हिन्दी रचना मूल रूपक को स्पष्ट और स्वाभाविक बनाती है।
- source_word: תְּיֵלִילוּ
  choice: विलाप करोगे
  rationale: क्रिया ऊँची आवाज़ में शोकपूर्ण विलाप या हाहाकार करने को व्यक्त करती है। ‘विलाप करोगे’ अर्थ की तीव्रता को गरिमापूर्ण आधुनिक हिन्दी में रखता है।
theological_decisions:
- issue: ‘मेरे सेवक’ और ‘तुम’ की पहचान तथा उनके बीच विरोध
  choice: 'पद में उपस्थित विरोध को बिना अधिक विशिष्ट पहचान जोड़े रखा गया है: परमेश्वर के सेवक आनन्दित होंगे, जबकि सम्बोधित लोग दुःख उठाएँगे।'
  alternative: ‘मेरे सेवक’ को स्पष्टतः विश्वासयोग्य बचे हुए लोग और ‘तुम’ को स्पष्टतः धर्मत्यागी इस्राएली कहना।
  rationale: पद दोनों समूहों के बीच स्पष्ट विरोध स्थापित करता है, पर इसी पद में उनकी पहचान को इससे अधिक सीमित नहीं करता। अनुवाद निकटवर्ती सन्दर्भ को उनकी पहचान स्पष्ट करने देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज पर गरिमापूर्ण रखी गई है। ‘मन की प्रसन्नता’ और ‘मन की पीड़ा’ से इब्रानी समानान्तरता सुरक्षित है; ‘आत्मा टूट जाने’ में मूल का आन्तरिक टूटन का रूपक बनाए रखा गया है।
