id: ISA.65.15
reference: Isaiah 65:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הִנַּחְתֶּ֨ם שִׁמְ/כֶ֤ם לִ/שְׁבוּעָה֙ לִ/בְחִירַ֔/י וֶ/הֱמִיתְ/ךָ֖ אֲדֹנָ֣/י יְהוִ֑ה וְ/לַ/עֲבָדָ֥י/ו יִקְרָ֖א שֵׁ֥ם אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/015.yaml
  text: You will leave your name as a curse for my chosen ones[a], and the Lord Yahweh will put you to death[b]; but to his servants he will call another name.
translation:
  language: hi
  text: तुम अपना नाम मेरे चुने हुओं के लिए शाप के रूप में छोड़ जाओगे[a]। प्रभु याहवे तुम्हें मार डालेगा; पर वह अपने सेवकों को एक और नाम देगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शपथ के लिए”—अर्थात तुम्हारा नाम बोलकर दिए जाने वाले शाप के सूत्र में इस्तेमाल होगा।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप में, “वह अपने सेवकों के लिए एक और नाम पुकारेगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנַּחְתֶּם שִׁמְכֶם
  choice: तुम अपना नाम ... छोड़ जाओगे
  rationale: हिफ़ील रूप यहाँ ‘नाम’ को पीछे छोड़ जाने का भाव देता है। ‘छोड़ जाओगे’ आधुनिक हिन्दी में स्वाभाविक है और भावी स्मृति या प्रतिष्ठा की ओर संकेत करता है।
- source_word: לִשְׁבוּעָה
  choice: शाप बनाकर
  rationale: यद्यपि शब्द का सामान्य अर्थ ‘शपथ’ है, न्याय के इस प्रसंग में नाम के किसी शाप-सूत्र में उदाहरण बन जाने का भाव प्रमुख है। अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: לִבְחִירַי
  choice: मेरे चुने हुओं के लिए
  rationale: बहुवचन और प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय दोनों सुरक्षित रहते हैं; यह अभिव्यक्ति सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: וֶהֱמִיתְךָ
  choice: तुम्हें मार डालेगा
  rationale: מות के हिफ़ील का कारक अर्थ स्पष्ट करता है। हिन्दी का ‘मार डालेगा’ दैवी न्याय की कठोरता को बिना पुरातन शब्दावली के व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहवे
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को ‘यहवे’ के रूप में अलग-अलग सुरक्षित रखा गया है।
- source_word: וְלַעֲבָדָיו
  choice: पर अपने सेवकों का
  rationale: וְ यहाँ दो समूहों के विपरीत परिणामों को जोड़ता है, इसलिए ‘पर’ प्रसंगगत विरोध स्पष्ट करता है। עֲבָדָיו के लिए यहाँ ‘सेवकों’ उपयुक्त है क्योंकि परमेश्वर से संबंध और सेवा मुख्य भाव हैं।
- source_word: יִקְרָא שֵׁם אַחֵר
  choice: नाम वह कुछ और रखेगा
  rationale: शाब्दिक ‘दूसरा नाम पुकारेगा’ हिन्दी में अस्वाभाविक है। ‘नाम कुछ और रखना’ नया नाम देने या नया पदनाम निर्धारित करने का वही भाव स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहवे
  alternative: प्रभु परमेश्वर / प्रभु यहोवा
  rationale: मूल पाठ में उपाधि और वाचा-नाम दोनों उपस्थित हैं; ‘प्रभु यहवे’ इस भेद को बनाए रखता है और नाम को केवल उपाधि में नहीं बदलता।
- issue: עֲבָדָיו का सामाजिक और वाचागत भाव
  choice: उसके/अपने सेवक
  alternative: उसके दास
  rationale: इस पद में बंधुआ स्थिति नहीं, बल्कि परमेश्वर से संबंध रखने और उसकी सेवा करने वाला समुदाय प्रमुख है; अतः ‘सेवक’ अधिक उपयुक्त है।
- issue: יִקְרָא שֵׁם אַחֵר का कर्ता और अर्थ
  choice: परमेश्वर अपने सेवकों का नाम कुछ और रखेगा
  alternative: एक और नाम पुकारा जाएगा
  rationale: निकटतम स्पष्ट कर्ता ‘प्रभु यहवे’ है। नया नाम दिए जाने का भाव रखा गया है, पर उस नाम की पहचान या धार्मिक आशय को पाठ से आगे जाकर निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘शाप बनाकर छोड़ जाओगे’ न्याय-संदर्भ के मुहावरे को स्पष्ट करता है, जबकि पादटिप्पणी ‘शपथ’ वाला अधिक शाब्दिक अर्थ सुरक्षित रखती है। वचन में बहुवचन से एकवचन की ओर दिखाई देने वाले इब्रानी परिवर्तन को हिन्दी ‘तुम्हें’ स्वाभाविक रूप से खुला रखता है।
