review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the judgment contrast, the curse-formula sense of לִשְׁבוּעָה, the divine act of putting the addressed group to death, and the granting of a new name to Yahweh’s servants. A small revision improves the transliteration of Yahweh and makes the final Hebrew idiom more natural in Hindi without narrowing its meaning.
  naturalness: ‘नाम ... कुछ और रखेगा’ is understandable, but ‘अपने सेवकों को एक और नाम देगा’ is more idiomatic modern Hindi for assigning a new designation. ‘शाप के रूप में’ states the resulting use of the name clearly.
  terminology: ‘प्रभु याहवे’ preserves both אַדֹנָי and the Tetragrammaton. ‘याहवे’ is a more suitable Hindi transliteration of Yahweh than ‘यहवे.’ ‘सेवकों’ appropriately renders עֲבָדָיו in this covenantal context.
  issues:
  - severity: low
    issue: The divine name is spelled ‘यहवे.’
    rationale: For the project’s Yahweh rendering, ‘याहवे’ better represents the initial Ya- vowel and is more readily recognizable as a Hindi transliteration of Yahweh.
  - severity: low
    issue: The final clause uses ‘अपने सेवकों का नाम वह कुछ और रखेगा.’
    rationale: Though semantically acceptable, ‘अपने सेवकों को एक और नाम देगा’ is more natural Hindi and directly expresses the Hebrew idiom of calling/assigning another name.
  - severity: low
    issue: Footnote a says ‘उनका नाम,’ which can obscure that the name belongs to the directly addressed group.
    rationale: ‘तुम्हारा नाम’ maintains the reference and agrees with the verse’s direct address.
