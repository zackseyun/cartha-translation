  text: הָ/אֹֽמְרִים֙ קְרַ֣ב אֵלֶ֔י/ךָ אַל תִּגַּשׁ בִּ֖/י כִּ֣י קְדַשְׁתִּ֑י/ךָ אֵ֚לֶּה עָשָׁ֣ן בְּ/אַפִּ֔/י אֵ֥שׁ יֹקֶ֖דֶת כָּל הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/005.yaml
  text: who say[a], ‘Keep to yourself; do not come near me, for I am holier than you.’ These are smoke in my nostrils, a fire burning all day long.
translation:
  language: hi
  text: जो कहते हैं, “अपने तक ही रह; मेरे निकट मत आ, क्योंकि मैं तुझसे अधिक पवित्र हूँ।”[a] वे मेरे नथनों में धुआँ और दिन भर जलती रहने वाली आग हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि मैं तेरे लिए अत्यन्त पवित्र हूँ,” अथवा, “क्योंकि मैंने अपने को तुझसे अलग पवित्र रखा है।” इब्रानी वाक्यांश कठिन है और अनुष्ठानिक या नैतिक श्रेष्ठता के दावे को व्यक्त करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הָאֹמְרִים
  choice: जो कहते हैं
  rationale: यह कृदन्त संज्ञा के समान प्रयुक्त होकर पिछले पद में वर्णित लोगों का परिचय आगे बढ़ाता है; हिन्दी में सम्बन्धवाचक उपवाक्य स्वाभाविक है।
- source_word: קְרַב אֵלֶיךָ
  choice: अपने ही पास रह
  rationale: शाब्दिक रूप असामान्य है, पर सन्दर्भ में यह दूसरे को दूरी बनाए रखने की तिरस्कारपूर्ण आज्ञा है। यह अनुवाद उस अलगाव को व्यक्त करते हुए मूल की विचित्र छवि भी कुछ हद तक बनाए रखता है।
- source_word: אַל תִּגַּשׁ בִּי
  choice: मेरे निकट मत आ
  rationale: נגשׁ के साथ ב यहाँ किसी व्यक्ति के पास आने का अर्थ देता है; यह आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: כִּי קְדַשְׁתִּיךָ
  choice: क्योंकि मैं तुझसे अधिक पवित्र हूँ
  rationale: इब्रानी रूप कठिन और संक्षिप्त है। सन्दर्भ में वक्ता अपने को दूसरे से अधिक पवित्र बताकर उससे अलग करता है; मुख्य पाठ में यह अर्थ सबसे सुबोध है, जबकि अन्य सम्भावनाएँ पाद-टिप्पणी में सुरक्षित हैं।
- source_word: עָשָׁן בְּאַפִּי
  choice: मेरे नथनों में धुआँ
  rationale: אף का ठोस अर्थ नाक या नथना है और उससे क्रोध का भाव भी जुड़ सकता है। धुएँ की चुभने वाली मूल छवि को अमूर्त ‘क्रोध’ में नहीं बदला गया।
- source_word: אֵשׁ יֹקֶדֶת כָּל הַיּוֹם
  choice: ऐसी आग जो दिन भर जलती रहती है
  rationale: कृदन्त निरन्तर जलने का भाव देता है और כָּל הַיּוֹם पूरे दिन चलने वाली अवधि बताता है; हिन्दी वाक्यांश इस सतत उत्तेजना को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: כִּי קְדַשְׁתִּיךָ की व्याख्या
  choice: क्योंकि मैं तुझसे अधिक पवित्र हूँ
  alternative: क्योंकि मैं तेरे लिए अत्यन्त पवित्र हूँ; अथवा, क्योंकि मैंने अपने को तुझसे अलग पवित्र रखा है
  rationale: यह कथन व्याकरण की दृष्टि से कठिन है और कई अर्थ सम्भव हैं। चुना गया पाठ सन्दर्भ में निन्दित अहंकारी धार्मिक श्रेष्ठता को स्पष्ट करता है, पर वक्ताओं के दावे को सत्य ठहराता नहीं; वैकल्पिक अर्थ पाद-टिप्पणी में दिए गए हैं ताकि मूल की अनिश्चितता बनी रहे।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किन्तु गरिमापूर्ण शैली अपनाई गई है। ‘तू’ के रूप यहाँ मूल के एकवचन सम्बोधन और वक्ताओं के तिरस्कारपूर्ण स्वर को बनाए रखते हैं। ‘नथनों में धुआँ’ मूल की तीखी देहात्मक उपमा को सुरक्षित रखता है।
