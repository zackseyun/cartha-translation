source:
  edition: WLC
  text: וּ/בָנ֥וּ בָתִּ֖ים וְ/יָשָׁ֑בוּ וְ/נָטְע֣וּ כְרָמִ֔ים וְ/אָכְל֖וּ פִּרְיָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/021.yaml
  text: They will build houses and live in them[b][a]; they will plant vineyards and eat their fruit.
translation:
  language: hi
  text: वे घर बनाएँगे और उनमें बसेंगे[a]; वे दाख की बारियाँ लगाएँगे और उनका फल[b] खाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक औपचारिक रूप में, “उनमें निवास करेंगे।”
    reason: lexical_alternative
  - marker: b
    text: “उनका” अर्थात दाख की बारियों का।
    reason: referent_clarification
lexical_decisions:
- source_word: וּבָנוּ בָתִּים
  choice: वे घर बनाएँगे
  rationale: בנה का सीधा अर्थ ‘बनाना’ और בָּתִּים का अर्थ ‘घर’ है। पुनर्स्थापना की भविष्यसूचक प्रतिज्ञा के संदर्भ में क्रिया को भविष्यकाल में रखा गया है।
- source_word: וְיָשָׁבוּ
  choice: और उनमें बसेंगे
  rationale: ישׁב यहाँ घरों में रहने या बसने के अर्थ में है। ‘बसेंगे’ आधुनिक हिन्दी में स्वाभाविक है और स्थायी निवास का भाव बनाए रखता है।
- source_word: וְנָטְעוּ כְרָמִים
  choice: वे दाख की बारियाँ लगाएँगे
  rationale: נטע का अर्थ ‘लगाना’ और כְּרָמִים का अर्थ अंगूर उगाने के लिए लगाई गई ‘दाख की बारियाँ’ है, न कि केवल अलग-अलग बेलें।
- source_word: וְאָכְלוּ פִּרְיָם
  choice: और उनका फल खाएँगे
  rationale: אכל का ठोस अर्थ ‘खाना’ और פְּרִי का अर्थ ‘फल’ है। बहुवचन प्रत्यय ‘उनका’ निकटवर्ती दाख की बारियों की ओर संकेत करता है।
theological_decisions:
- issue: भविष्यसूचक कथन में इब्रानी पूर्ण क्रियाओं का कालगत अर्थ
  choice: उन्हें भविष्य की प्रतिज्ञाओं के रूप में प्रस्तुत किया गया है
  alternative: उन्हें साधारण भूतकाल या पूर्ण वर्तमान में प्रस्तुत करना
  rationale: यशायाह 65 के पुनर्स्थापना-संदर्भ में ये क्रियाएँ बीती घटनाएँ नहीं, बल्कि परमेश्वर के लोगों के भावी अनुभव को व्यक्त करती हैं। हिन्दी भविष्यकाल इस भविष्यसूचक बल को स्पष्ट और स्वाभाविक रूप से संप्रेषित करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘घर’, ‘बसेंगे’, ‘दाख की बारियाँ’ और ‘फल खाएँगे’ मूल के ठोस कृषि और निवास-संबंधी चित्रों को सुरक्षित रखते हैं।
