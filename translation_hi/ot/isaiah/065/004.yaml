source:
  edition: WLC
  text: הַ/יֹּֽשְׁבִים֙ בַּ/קְּבָרִ֔ים וּ/בַ/נְּצוּרִ֖ים יָלִ֑ינוּ הָ/אֹֽכְלִים֙ בְּשַׂ֣ר הַ/חֲזִ֔יר ו/פרק פִּגֻּלִ֖ים כְּלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/004.yaml
  text: who sit among the graves and spend the night in hidden places[a], who eat pig's flesh, and broth of unclean things is in their vessels[b];
translation:
  language: hi
  text: जो कब्रों के बीच बैठते और छिपी हुई जगहों में रात बिताते हैं,[a] जो सूअर का मांस खाते हैं, और जिनके बरतनों में अशुद्ध वस्तुओं का शोरबा है;[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पहरे वाली जगहों में।” इब्रानी शब्द कठिन है; इसका अर्थ “घिरी हुई जगहों में” भी समझा गया है, यद्यपि इस संदर्भ में इसकी संभावना कम है।
    reason: lexical_alternative
  - marker: b
    text: “शोरबा” के लिए प्रयुक्त इब्रानी शब्द दुर्लभ है; इसका अर्थ “सूप” या “झोल” भी हो सकता है। “अशुद्ध वस्तुओं” का अनुवाद “घिनौनी वस्तुओं” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיֹּשְׁבִים
  choice: जो ... बैठते
  rationale: ישׁב का कालवाचक कृदन्त यहाँ लोगों का वर्णन करता है। ‘बैठते’ ठोस बिंब और कृदन्त की निरंतरता को बनाए रखता है; संदर्भ में इसमें ठहरने का भाव भी हो सकता है।
- source_word: בַּקְּבָרִים
  choice: कब्रों के बीच
  rationale: קברים का अर्थ कब्रें/समाधियाँ है। इस संदर्भ में ב को ‘के बीच’ कहना स्वाभाविक है और मृतकों से जुड़ी गतिविधि का स्थान स्पष्ट करता है, बिना यह कहे कि वे कब्रों के भीतर थे।
- source_word: וּבַנְּצוּרִים
  choice: छिपी हुई जगहों में
  rationale: नְצוּרִים कठिन और विवादित शब्द है। कब्रों तथा रात बिताने के समानांतर संदर्भ में ‘छिपी हुई जगहें’ उपयुक्त और सहज है; ‘पहरे वाली जगहें’ या ‘घिरी हुई जगहें’ जैसी संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: יָלִינוּ
  choice: रात बिताते हैं
  rationale: לין का अर्थ रात भर ठहरना है। यह आधुनिक हिन्दी में स्वाभाविक है और रात्रिकालीन अवधि को स्पष्ट रखता है।
- source_word: הָאֹכְלִים
  choice: जो ... खाते हैं
  rationale: यह दूसरा संज्ञार्थक कृदन्त है, इसलिए ‘जो ... खाते हैं’ पहले वर्णनात्मक खंड की संरचना को आगे बढ़ाता है।
- source_word: בְּשַׂר הַחֲזִיר
  choice: सूअर का मांस
  rationale: शाब्दिक और सहज हिन्दी; यह निषिद्ध भोजन के ठोस बिंब को किसी व्यापक बाद की धर्मवैज्ञानिक श्रेणी में बदले बिना सुरक्षित रखता है।
- source_word: ופרק
  choice: शोरबा
  rationale: यह दुर्लभ शब्द सामान्यतः किसी तरल पकवान या रस के अर्थ में समझा जाता है। ‘शोरबा’ बरतनों वाले अगले पदबंध के साथ स्वाभाविक बैठता है; अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: פִּגֻּלִים
  choice: अशुद्ध वस्तुओं
  rationale: פִּגּוּל बलि और भोजन के संदर्भ में विधिपूर्वक दूषित या घृणित वस्तु को सूचित करता है। ‘अशुद्ध’ धार्मिक शुद्धता का भाव बनाए रखता है, जबकि ‘घिनौनी’ सम्भव वैकल्पिक छटा है।
- source_word: כְּלֵיהֶם
  choice: उनके बरतनों में
  rationale: כְּלִי सामान्यतः पात्र, बरतन या उपकरण हो सकता है। भोजन के संदर्भ में ‘बरतन’ सहज है और ‘पतीला’ जैसे अधिक विशिष्ट अर्थ से बचता है।
theological_decisions:
- issue: धार्मिक रूप से अशुद्ध भोजन का वर्णन
  choice: सूअर का मांस और अशुद्ध वस्तुओं का शोरबा जैसे ठोस शब्द बनाए रखे गए हैं।
  alternative: इसे सामान्य करके ‘निषिद्ध भोजन’ या ‘घिनौनी वस्तुएँ’ कहना।
  rationale: पद अशुद्धता और अनुचित उपासना से जुड़ी प्रथाओं की निंदा करता है। ठोस चित्रण को बनाए रखना उचित है, पर उससे वे व्यापक धर्मवैज्ञानिक निष्कर्ष नहीं जोड़े गए जो इस पद में स्पष्ट नहीं हैं।
- issue: וּבַנְּצוּרִים का संदर्भगत अर्थ
  choice: छिपी हुई जगहों में
  alternative: पहरे वाली जगहों में अथवा घिरी हुई जगहों में
  rationale: रात्रिकालीन और कब्रों से जुड़े संदर्भ में ‘छिपी हुई’ सर्वाधिक संगत प्रतीत होता है, किन्तु इब्रानी शब्द की वास्तविक अनिश्चितता पादटिप्पणी में स्पष्ट रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘कब्र’, ‘रात बिताना’, ‘सूअर का मांस’, ‘शोरबा’ और ‘बरतन’ जैसे प्रचलित शब्द रखे गए हैं। वाक्य को मूल पद की वर्णनात्मक, आरोपसूचक शृंखला के रूप में बनाए रखा गया है।
