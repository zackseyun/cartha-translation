  edition: WLC
  text: וְ/הָיָ֤ה הַ/שָּׁרוֹן֙ לִ/נְוֵה צֹ֔אן וְ/עֵ֥מֶק עָכ֖וֹר לְ/רֵ֣בֶץ בָּקָ֑ר לְ/עַמִּ֖/י אֲשֶׁ֥ר דְּרָשֽׁוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/010.yaml
  text: Sharon will become a pasture for flocks[a], and the Valley of Achor a resting place for cattle[b], for my people who have sought me.
translation:
  language: hi
  text: शारोन भेड़ों के लिए चरागाह[a] बन जाएगा, और आकोर की घाटी गाय-बैलों के विश्राम-स्थान[b]—मेरी उस प्रजा के लिए जिसने मुझे खोजा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘भेड़ों के रहने की जगह’ अथवा ‘भेड़ों के चरने की जगह।’
    reason: lexical_alternative
  - marker: b
    text: आकोर की घाटी पहले के न्याय से जुड़ी है (यहोशू 7:24–26); यहाँ उसे पुनर्स्थापना और सुरक्षित विश्राम की जगह के रूप में दिखाया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיָה
  choice: बन जाएगा
  rationale: भविष्यसूचक संदर्भ में यह रूप भावी परिवर्तन का बोध कराता है; इसलिए केवल ‘होगा’ के बजाय ‘बन जाएगा’ पुनर्स्थापना की गति को स्पष्ट करता है।
- source_word: הַשָּׁרוֹן
  choice: शारोन
  rationale: यह स्थान-नाम है; हिन्दी में स्वाभाविक रूप से लिप्यंतरित किया गया है।
- source_word: לִנְוֵה צֹאן
  choice: भेड़-बकरियों के झुंडों की चरागाह
  rationale: נָוֶה निवास, चरने की जगह या चरागाह को सूचित कर सकता है। ‘चरागाह’ आधुनिक हिन्दी में स्पष्ट है, और צֹאן छोटे पालतू पशुओं—विशेषकर भेड़-बकरियों—के झुंडों को दर्शाता है।
- source_word: וְעֵמֶק עָכוֹר
  choice: और आकोर की घाटी
  rationale: עֵמֶק का अर्थ ‘घाटी’ है और עָכוֹר स्थान-नाम है, जिसे लिप्यंतरित किया गया है।
- source_word: לְרֵבֶץ בָּקָר
  choice: गाय-बैलों के विश्राम की जगह
  rationale: רֵבֶץ लेटने या सुरक्षित विश्राम करने की जगह का बोध कराता है, केवल चरने की जगह का नहीं। בָּקָר को सामान्य पाठक के लिए ठोस और सहज ‘गाय-बैल’ से व्यक्त किया गया है।
- source_word: לְעַמִּי
  choice: मेरी उस प्रजा के लिए
  rationale: לְ यहाँ लाभ या उपयोग का भाव देता है। ‘उस’ आगे आने वाले सम्बन्धवाचक वाक्य से प्रजा को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: אֲשֶׁר דְּרָשׁוּנִי
  choice: जिसने मुझे खोजा है
  rationale: परमेश्वर के संबंध में דָּרַשׁ प्रायः ‘खोजना’ या उसकी ओर मुड़कर उसे चाहना दर्शाता है। पूर्ण क्रिया को वर्तमान प्रासंगिकता सहित व्यक्त करने के लिए ‘खोजा है’ रखा गया है।
theological_decisions:
- issue: ‘मेरी उस प्रजा जिसने मुझे खोजा है’ की पहचान
  choice: वाक्य को परमेश्वर द्वारा अपनी मानी गई, उसे खोजने वाली प्रजा के रूप में खुला रखा गया है।
  alternative: इसे विशेष रूप से केवल इस्राएल के विश्वासयोग्य बचे हुओं या सामूहिक रूप से सम्पूर्ण पुनर्स्थापित इस्राएल के रूप में स्पष्ट करना।
  rationale: इब्रानी पाठ इससे अधिक संकीर्ण पहचान निश्चित नहीं करता; अनुवाद उस धार्मिक तनाव को बिना किसी विशिष्ट सिद्धान्त को आरोपित किए बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और ग्रामीण-पशुपालन की मूल छवि को बनाए रखने वाला पाठ। ‘भेड़-बकरियों’ और ‘गाय-बैलों’ का प्रयोग हिन्दी पाठक के लिए पशु-श्रेणियों को स्वाभाविक और स्पष्ट बनाता है।
