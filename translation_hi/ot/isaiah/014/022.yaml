source:
  edition: WLC
  text: וְ/קַמְתִּ֣י עֲלֵי/הֶ֔ם נְאֻ֖ם יְהוָ֣ה צְבָא֑וֹת וְ/הִכְרַתִּ֨י לְ/בָבֶ֜ל שֵׁ֥ם וּ/שְׁאָ֛ר וְ/נִ֥ין וָ/נֶ֖כֶד נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/022.yaml
  text: And I will rise up against them[a], declares Yahweh of Armies, and I will cut off from Babylon name and remnant, offspring and posterity[b], declares Yahweh.
translation:
  language: hi
  text: “मैं उनके विरुद्ध उठ खड़ा होऊँगा,” सेनाओं का याहवे घोषणा करता है, “और मैं बाबेल से नाम और शेष, संतान और वंशज मिटा दूँगा,” याहवे घोषणा करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְקַמְתִּי עֲלֵיהֶם
  choice: मैं उनके विरुद्ध उठ खड़ा होऊँगा
  rationale: भविष्यसूचक संदर्भ में क्रिया भावी न्यायपूर्ण हस्तक्षेप बताती है; ‘विरुद्ध उठ खड़ा होना’ इब्रानी मुहावरे और उसके विरोधात्मक बल को बनाए रखता है।
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे की यह वाणी है
  rationale: נְאֻם को स्वाभाविक भविष्यद्वक्तात्मक सूत्र ‘की यह वाणी है’ से व्यक्त किया गया है; צְבָאוֹת का अर्थ पारदर्शी रूप से ‘सेनाओं के’ रखा गया है और יְהוָה को व्यक्तिवाचक नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: וְהִכְרַתִּי לְבָבֶל
  choice: मैं बाबेल से … मिटा दूँगा
  rationale: हिफ़ील क्रिया यहाँ पूर्ण उन्मूलन का भाव देती है और לְבָבֶל इस संरचना में बाबेल से किसी वस्तु को हटा देने का अर्थ रखता है। ‘मिटा दूँगा’ आधुनिक हिन्दी में स्वाभाविक रहते हुए न्याय की प्रबलता व्यक्त करता है।
- source_word: שֵׁם וּשְׁאָר
  choice: नाम और शेष
  rationale: ‘नाम’ स्मृति और पहचान तक विस्तृत हो सकता है, जबकि ‘शेष’ जो कुछ या जो कोई बचा रह गया हो उसे समेटता है। संक्षिप्त जोड़ी को जानबूझकर खुला रखा गया है।
- source_word: נִין וָנֶכֶד
  choice: संतान और भावी वंश
  rationale: दोनों शब्द मिलकर आने वाली पीढ़ियों और वंशगत निरंतरता का व्यापक संकेत देते हैं। यह अनुवाद किसी एक निश्चित पीढ़ी, जैसे केवल पुत्र या पौत्र, तक अर्थ को सीमित नहीं करता।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह वाणी है
  rationale: पद के अंत में दोहराए गए भविष्यद्वक्तात्मक सूत्र को उसकी गंभीरता और बल के लिए बनाए रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे पदवी में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: צְבָאוֹת की उपाधि
  choice: सेनाओं के
  alternative: स्वर्गीय सेनाओं के; मेज़बानों के
  rationale: शब्द का सैनिक और सार्वभौम अधिकार-सूचक बल स्पष्ट रहता है; ‘मेज़बानों’ आधुनिक हिन्दी में इस अर्थ को ठीक से संप्रेषित नहीं करता।
- issue: चार संज्ञाओं की व्यापक विनाश-सूचक शृंखला
  choice: नाम और शेष, संतान और भावी वंश
  alternative: नामोनिशान और समस्त वंश
  rationale: मुहावरेदार विकल्प कुल विनाश का अर्थ स्पष्ट करता, पर मूल की चारfold शृंखला और उसके काव्यात्मक तनाव को मिटा देता। इसलिए प्रत्येक घटक को बनाए रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण मानक हिन्दी। भविष्यद्वक्तात्मक घोषणा की पुनरावृत्ति और मूल की चार संज्ञाओं वाली संक्षिप्त काव्यात्मक शृंखला सुरक्षित रखी गई है। ‘मिटा दूँगा’ सामान्य पाठक के लिए ‘काट डालूँगा’ से अधिक स्वाभाविक है, जबकि उन्मूलन का अर्थ बनाए रखता है।
