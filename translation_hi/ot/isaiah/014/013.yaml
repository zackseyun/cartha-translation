base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/013.yaml
  text: But you said in your heart[a], ‘I will ascend to the heavens; I will raise my throne above the stars of God, and I will sit on the mount of assembly in the far reaches of the north.’
translation:
  language: hi
  text: परन्तु तूने अपने मन में कहा, “मैं आकाश तक चढ़ूँगा; मैं अपना सिंहासन परमेश्वर के तारों से भी ऊपर उठाऊँगा; मैं सभा के पर्वत पर, सुदूर उत्तर में[a], बैठूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “ज़ाफ़ोन की ऊँचाइयों पर।” यहाँ “उत्तर” के लिए प्रयुक्त इब्रानी शब्द צָפוֹן प्राचीन निकट-पूर्वी परम्परा में प्रसिद्ध ब्रह्माण्डीय पर्वत ज़ाफ़ोन की ओर संकेत कर सकता है।
    reason: वैकल्पिक पठन और सम्भावित प्राचीन सांस्कृतिक संकेत को सुरक्षित रखना।
lexical_decisions:
- source_word: וְאַתָּה
  choice: परन्तु तूने
  rationale: सन्दर्भ में संयोजक और सर्वनाम मिलकर विरोध प्रकट करते हैं; ‘परन्तु’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है। एकवचन ‘तू’ सम्बोधित राजा के प्रति भविष्यद्वाणी के सीधे और तीखे सम्बोधन को बनाए रखता है।
- source_word: אָמַרְתָּ בִלְבָבְךָ
  choice: अपने मन में कहा था
  rationale: यह इब्रानी मुहावरा भीतर के विचार या स्वयं से कही बात को दर्शाता है। ‘मन में’ आधुनिक हिन्दी में स्वाभाविक है, और ‘कहा था’ प्रसंग में पहले किए गए घमण्डपूर्ण संकल्प को व्यक्त करता है।
- source_word: הַשָּׁמַיִם אֶעֱלֶה
  choice: मैं आकाश तक चढ़ूँगा
  rationale: इब्रानी बहुवचन הַשָּׁמַיִם के लिए हिन्दी में सामूहिक एकवचन ‘आकाश’ स्वाभाविक है। गन्तव्य-सूचक ‘तक’ आरोहण के ऊँचे लक्ष्य को स्पष्ट करता है, बिना ‘स्वर्ग’ के अतिरिक्त धार्मिक अर्थ आरोपित किए।
- source_word: מִמַּעַל לְכוֹכְבֵי אֵל
  choice: परमेश्वर के तारों से भी ऊपर
  rationale: यह स्थान और तुलना—दोनों का ऊर्ध्व भाव स्वाभाविक हिन्दी में रखता है। ‘परमेश्वर के तारे’ मूल बिम्ब को बनाए रखते हैं और उन्हें स्वर्गदूत या शासक मानकर अर्थ निश्चित नहीं करते।
- source_word: אָרִים כִּסְאִי
  choice: मैं अपना सिंहासन ... ऊपर उठाऊँगा
  rationale: रूम के हिफ़ील रूप में ऊँचा करने या उठाने का भाव है। यह चुनाव आत्म-महिमामण्डन के दृश्य बिम्ब को स्पष्ट और स्वाभाविक रखता है।
- source_word: וְאֵשֵׁב
  choice: मैं ... बैठूँगा
  rationale: ישב का सामान्य अर्थ ‘बैठना’ या ‘निवास करना’ है। यहाँ सिंहासन के प्रसंग में ‘बैठूँगा’ राजकीय बिम्ब को सुरक्षित रखता है, पर ‘राज्य करूँगा’ जैसी व्याख्या नहीं जोड़ता।
- source_word: בְּהַר מוֹעֵד
  choice: सभा के पर्वत पर
  rationale: מוֹעֵד यहाँ सम्भवतः नियत सभा को सूचित करता है। ‘सभा का पर्वत’ मूल की ब्रह्माण्डीय या राजकीय छवि को बिना उसे ‘मिलापवाला तम्बू’ मानने के सुरक्षित रखता है।
- source_word: בְּיַרְכְּתֵי צָפוֹן
  choice: सुदूर उत्तर में
  rationale: יַרְכְּתֵי दूरस्थ छोरों या भीतरी सुदूर भागों का बोध कराता है। मुख्य पाठ में צָפוֹן का सामान्य दिशासूचक अर्थ रखा गया है; सम्भावित व्यक्तिवाचक संकेत पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: צָפוֹן में सम्भावित प्राचीन ब्रह्माण्डीय संकेत
  choice: मुख्य पाठ में ‘उत्तर’
  alternative: ‘सापोन की ऊँचाइयों पर’ अथवा ‘सापोन पर्वत पर’
  rationale: צָפוֹן का सामान्य अर्थ ‘उत्तर’ है और यही पाठक के लिए सीधा अर्थ है। फिर भी यह प्राचीन निकट-पूर्वी परम्परा के देव-सभा से जुड़े सापोन पर्वत की ओर संकेत कर सकता है; इस सम्भावना को पादटिप्पणी में रखकर साहित्यिक और धर्मवैज्ञानिक तनाव सुरक्षित रखा गया है।
- issue: ‘परमेश्वर के तारे’ की पहचान
  choice: मूल बिम्ब ‘परमेश्वर के तारे’ को ज्यों का त्यों रखना
  alternative: ‘स्वर्गीय प्राणी’, ‘स्वर्गदूत’ या केवल ‘तारे’
  rationale: यह पद वास्तविक तारों, स्वर्गीय प्राणियों या आकाशीय शक्तियों की ओर संकेत कर सकता है। अनुवाद इनमें से किसी एक व्याख्या को मुख्य पाठ में निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। काव्यात्मक समानान्तरता तथा वक्ता के घमण्डपूर्ण आरोहण का क्रम सुरक्षित है। ‘परमेश्वर के तारे’ और ‘उत्तर/सापोन’ की सम्भावित बहुअर्थता को जानबूझकर समाप्त नहीं किया गया है।
