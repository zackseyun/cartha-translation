id: ISA.14.15
reference: Isaiah 14:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַ֧ךְ אֶל שְׁא֛וֹל תּוּרָ֖ד אֶל יַרְכְּתֵי בֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/015.yaml
  text: But you will be brought down to Sheol[a], to the depths of the pit.
translation:
  language: hi
  text: परन्तु तू अधोलोक[a] में, गड्ढे की गहराइयों में उतारा जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कब्र’ अथवा ‘मृतकों का लोक’।
    reason: שְׁאוֹל के सम्भव अर्थों को दिखाना और मूल की अर्थगत व्यापकता बनाए रखना।
lexical_decisions:
- source_word: אַךְ
  choice: परन्तु
  rationale: यह अव्यय पिछले पदों में ऊपर चढ़ने की डींग के विपरीत तीखा उलटाव दिखाता है। ‘परन्तु’ इस विरोध को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: שְׁאוֹל
  choice: अधोलोक
  rationale: यह शब्द केवल किसी व्यक्ति की कब्र नहीं, बल्कि मृतकों के लोक की धारणा व्यक्त करता है। ‘अधोलोक’ हिन्दी पाठक के लिए बोधगम्य है और बाद की व्यवस्थित ‘नरक’ संबंधी धारणा को पाठ में आरोपित नहीं करता।
- source_word: תּוּרָד
  choice: उतारा जाएगा
  rationale: होफ़अल रूप कारणवाचक कर्मवाच्य है; इसलिए ‘उतारा जाएगा’ मूल के निष्क्रिय भाव और अपमानजनक नीचे किए जाने, दोनों को सुरक्षित रखता है।
- source_word: יַרְכְּתֵי
  choice: गहराइयों में
  rationale: यह शब्द किसी स्थान के भीतरी, दूरस्थ या चरम भागों को बताता है। नीचे उतरने की काव्यात्मक छवि में ‘गहराइयों में’ स्वाभाविक है।
- source_word: בּוֹר
  choice: गड्ढे
  rationale: ‘गड्ढा’ यहाँ पतन और मृत्यु के गर्त की छवि बनाए रखता है तथा ‘अधोलोक’ के साथ काव्यात्मक समानांतरता को बिना अनावश्यक दोहराव के व्यक्त करता है।
theological_decisions:
- issue: काव्यात्मक न्याय के प्रसंग में שְׁאוֹל का अनुवाद
  choice: अधोलोक
  alternative: कब्र; मृतकों का लोक
  rationale: पद अधोलोक में उतरने को ‘गड्ढे की गहराइयों’ के समानांतर रखता है। ‘अधोलोक’ मूल इब्रानी धारणा को समझने योग्य हिन्दी में सुरक्षित रखता है और इसे न तो केवल भौतिक कब्र तक सीमित करता है, न बाद की अधिक निश्चित ‘नरक’ संबंधी धर्मवैज्ञानिक धारणा बना देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक गद्य। ‘तू’ एकवचन संबोधन के तीखे, न्यायसूचक स्वर को बनाए रखता है; ‘परन्तु’ पिछले घमंडी दावे से स्पष्ट विरोध व्यक्त करता है।
