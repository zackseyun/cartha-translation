source:
  edition: WLC
  text: כִּֽי יְהוָ֧ה צְבָא֛וֹת יָעָ֖ץ וּ/מִ֣י יָפֵ֑ר וְ/יָד֥/וֹ הַ/נְּטוּיָ֖ה וּֽ/מִ֥י יְשִׁיבֶֽ/נָּה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/027.yaml
  text: For Yahweh of hosts has purposed[a], and who can annul it? His hand is stretched out[b], and who can turn it back?
translation:
  language: hi
  text: क्योंकि सेनाओं के याहवे ने योजना बनाई है, और कौन उसे निष्फल कर सकता है[a]? उसका हाथ बढ़ा हुआ है[b], और कौन उसे पीछे हटा सकता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कौन उसे रद्द कर सकता है?” इब्रानी क्रिया किसी योजना को तोड़ने, निरस्त करने या विफल करने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसका हाथ फैला हुआ है।” यह चित्र सामान्यतः सक्रिय सामर्थ्य को, और प्रायः न्याय की कार्रवाई को, व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या कारण प्रस्तुत करता है; हिंदी में ‘क्योंकि’ इस तार्किक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को ‘याहवे’ के रूप में रखा गया है और צְבָאוֹת की व्यापक सैन्य तथा स्वर्गीय छवि को ‘सेनाओं’ से व्यक्त किया गया है।
- source_word: יָעָץ
  choice: योजना बनाई है
  rationale: क्रिया किसी उद्देश्य या योजना के ठहराए जाने को व्यक्त करती है; यह आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: יָפֵר
  choice: उसे निष्फल कर सकता है
  rationale: हिफ़ील रूप किसी योजना को तोड़ने, रद्द करने या विफल करने का अर्थ दे सकता है; ‘निष्फल’ संदर्भ में योजना को असफल करने का भाव सुरक्षित रखता है।
- source_word: יָדוֹ הַנְּטוּיָה
  choice: उसका हाथ बढ़ा हुआ है
  rationale: मूल की मानव-सदृश छवि को बनाए रखता है और सक्रिय सामर्थ्य—संदर्भ में न्याय की कार्रवाई—का संकेत देता है।
- source_word: יְשִׁיבֶנָּה
  choice: उसे पीछे हटा सकता है
  rationale: यह बढ़े हुए हाथ को वापस मोड़ने या लौटा देने की चुनौती व्यक्त करता है; हिंदी में ‘पीछे हटा’ सीधा और मुहावरेदार है।
theological_decisions:
- issue: ईश्वरीय उपाधि יְהוָה צְבָאוֹת का अनुवाद
  choice: सेनाओं के याहवे
  alternative: सेनाओं का प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है; ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है। ‘सेनाओं’ को केवल मानवीय सेनाओं तक सीमित नहीं किया गया है।
- issue: याहवे की योजना और बढ़े हुए हाथ के बारे में अलंकारिक प्रश्न
  choice: प्रश्नों को मूल की खुली चुनौती के रूप में रखा गया है
  alternative: 'स्पष्ट कथन: कोई उसे निष्फल या पीछे नहीं हटा सकता'
  rationale: मूल पाठ अलंकारिक प्रश्नों द्वारा ईश्वरीय उद्देश्य और कार्रवाई की अजेयता व्यक्त करता है; प्रश्नात्मक रूप उसकी शक्ति और तनाव दोनों बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। मूल के समानांतर अलंकारिक प्रश्न और ‘बढ़े हुए हाथ’ की ठोस छवि सुरक्षित हैं।
