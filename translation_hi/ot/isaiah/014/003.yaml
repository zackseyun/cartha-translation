id: ISA.14.3
reference: Isaiah 14:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֗ה בְּ/י֨וֹם הָנִ֤יחַ יְהוָה֙ לְ/ךָ֔ מֵֽ/עָצְבְּ/ךָ֖ וּ/מֵ/רָגְזֶ֑/ךָ וּ/מִן הָ/עֲבֹדָ֥ה הַ/קָּשָׁ֖ה אֲשֶׁ֥ר עֻבַּד בָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/003.yaml
  text: And it shall be[a], in the day when Yahweh gives you rest from your pain and your turmoil, and from the hard service with which you were made to serve[b],
translation:
  language: hi
  text: और ऐसा होगा कि जिस दिन याहवे तुम्हें तुम्हारी पीड़ा[a] और व्याकुलता से, और उस कठोर श्रम से विश्राम देगा, जो तुमसे कराया गया था[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे दुःख।”
    reason: עצב का अर्थ पीड़ा के साथ-साथ दुःख भी हो सकता है।
  - marker: b
    text: या, “उस कठोर सेवा से, जो तुम पर लादी गई थी।”
    reason: निष्क्रिय हिब्रू वाक्यांश को लगाए गए श्रम या सेवा के रूप में भी व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: וְהָיָה
  choice: और ऐसा होगा कि
  rationale: यह भविष्य की परिस्थिति का परिचय देने वाला सामान्य भविष्यसूचक सूत्र है; यह हिंदी में स्वाभाविक रहते हुए हिब्रू के संयोजक और भावी अर्थ को बनाए रखता है।
- source_word: בְּיוֹם
  choice: जिस दिन
  rationale: यहाँ ‘दिन में’ समयवाचक उपवाक्य के रूप में प्रयुक्त है; ‘जिस दिन’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: הָנִיחַ
  choice: विश्राम देगा
  rationale: נוח के हिफ़ील रूप का अर्थ विश्राम या राहत देना है। ‘विश्राम देगा’ उसके कारक भाव और आगे आने वाले ‘से’ के साथ संबंध को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; उसे उपाधि से बदलने के बजाय हिंदी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: מֵעָצְבְּךָ
  choice: तुम्हारी पीड़ा से
  rationale: עצב शारीरिक या मानसिक पीड़ा, दुःख अथवा कष्ट को व्यक्त कर सकता है। ‘पीड़ा’ इस व्यापकता को बनाए रखती है।
- source_word: וּמֵרָגְזֶךָ
  choice: और व्याकुलता से
  rationale: רגז अशांति, बेचैनी या भीतर के उद्वेग का बोध देता है; ‘व्याकुलता’ आधुनिक हिंदी में इस संदर्भ के लिए सहज है।
- source_word: הָעֲבֹדָה הַקָּשָׁה
  choice: उस कठोर श्रम से
  rationale: עֲבֹדָה काम, श्रम या सेवा का संकेत देता है और קָשָׁה उसकी कठोरता बताता है। ‘कठोर श्रम’ दमनकारी संदर्भ स्पष्ट करता है, पर मूल से अधिक विशिष्ट दासत्व-व्यवस्था नहीं थोपता।
- source_word: אֲשֶׁר עֻבַּד בָּךְ
  choice: जो तुमसे कराया गया था
  rationale: עבד का निष्क्रिय रूप और בְּ जबरन कराए गए श्रम को व्यक्त करते हैं। यह अनुवाद क्रिया के ‘काम/सेवा कराना’ भाव और दबाव दोनों को स्वाभाविक हिंदी में रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज रखी गई है। पद आगे के वाक्य में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है।
