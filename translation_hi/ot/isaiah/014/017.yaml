source:
  edition: WLC
  text: שָׂ֥ם תֵּבֵ֛ל כַּ/מִּדְבָּ֖ר וְ/עָרָ֣י/ו הָרָ֑ס אֲסִירָ֖י/ו לֹא פָ֥תַח בָּֽיְתָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/017.yaml
  text: who made the world like a wilderness and tore down its cities[a], who did not open the house for his prisoners?
translation:
  language: hi
  text: जिसने संसार को उजाड़ के समान बना दिया और उसके नगरों को ढा दिया, और अपने बंदियों के लिए घर लौटने का मार्ग नहीं खोला?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “अपने बंदियों के लिए घर की ओर नहीं खोला” है; ‘मार्ग’ जैसी वस्तु निहित है। इसका अर्थ “अपने बंदियों को घर नहीं जाने दिया” भी हो सकता है।
    reason: इब्रानी לֹא פָתַח בָּיְתָה में ‘खोलना’ के साथ ‘घर की ओर’ का असामान्य प्रयोग है। पादटिप्पणी शाब्दिक बिंब, निहित वस्तु, और सम्भावित मुहावरेदार अर्थ को सुरक्षित रखती है।
lexical_decisions:
- source_word: שָׂם
  choice: बना दिया
  rationale: यहाँ क्रिया संसार को उजाड़ जैसी दशा में पहुँचा देने का परिणाम व्यक्त करती है; ‘बना दिया’ स्वाभाविक और अर्थानुरूप है।
- source_word: תֵּבֵל
  choice: संसार
  rationale: यह शब्द सामान्यतः आबाद जगत या पृथ्वी को दर्शाता है; ‘संसार’ आधुनिक हिन्दी में व्यापकता को सहज रूप से व्यक्त करता है।
- source_word: כַּמִּדְבָּר
  choice: उजाड़ जैसा
  rationale: उपसर्ग כְּ तुलना व्यक्त करता है। מִדְבָּר केवल रेतीले मरुस्थल तक सीमित नहीं, बल्कि निर्जन और उजाड़ भूभाग भी हो सकता है; इसलिए ‘उजाड़ जैसा’ प्रसंग की विनाशकारी छवि बनाए रखता है।
- source_word: וְעָרָיו
  choice: और उसके नगरों को
  rationale: पुल्लिंग एकवचन प्रत्यय को निकटवर्ती संसार/उसके क्षेत्र से जोड़कर ‘उसके’ रखा गया है; इससे मूल की व्याकरणिक अस्पष्टता अनावश्यक रूप से नहीं मिटती।
- source_word: הָרָס
  choice: ढा दिया
  rationale: क्रिया नगरों को गिराने या नष्ट करने की ठोस छवि देती है; ‘ढा दिया’ संक्षिप्त और स्वाभाविक है।
- source_word: אֲסִירָיו
  choice: अपने बंदियों
  rationale: यह बँधे हुए या कैद किए गए लोगों को दर्शाता है। ‘बंदी’ गरिमापूर्ण और वर्तमान हिन्दी में स्पष्ट है।
- source_word: לֹא פָתַח בָּיְתָה
  choice: घर का रास्ता नहीं खोला
  rationale: פָתַח का मूल बिंब ‘खोलना’ सुरक्षित रखा गया है, जबकि दिशासूचक בָּיְתָה को स्वाभाविक हिन्दी में ‘घर का रास्ता’ कहकर व्यक्त किया गया है। शाब्दिक संरचना और ‘घर नहीं जाने दिया’ वाला अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: बंदियों की मुक्ति या घर वापसी को कितनी स्पष्टता से व्यक्त किया जाए
  choice: घर का रास्ता नहीं खोला
  alternative: अपने बंदियों को घर नहीं जाने दिया / अपने बंदियों को रिहा नहीं किया
  rationale: इब्रानी में ‘खोला’ और दिशासूचक ‘घर की ओर’ की असामान्य संरचना है। मुख्य पाठ मूल बिंब को बनाए रखते हुए हिन्दी में समझने योग्य है और किसी एक व्याख्यात्मक विस्तार को अंतिम नहीं ठहराता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य ‘जिसने’ से आरम्भ होता है क्योंकि यह पिछले पद में आरम्भ हुए प्रश्न का संबंधवाचक विस्तार है। ‘उजाड़ जैसा’ निर्जनता और विनाश दोनों को सामान्य पाठक के लिए स्पष्ट करता है।
