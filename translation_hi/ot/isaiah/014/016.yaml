base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/016.yaml
  text: 'Those who see you will stare at you; they will look closely at you: ‘Is this the man who made the earth tremble[a], who shook kingdoms,’'
translation:
  language: hi
  text: जो तुम्हें देखेंगे, वे तुम्हें घूरेंगे; वे तुम्हें ध्यान से देखेंगे[a] और पूछेंगे, “क्या यही वह आदमी है जो पृथ्वी को थरथराता था, राज्यों को हिला देता था?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे तुम्हें परखेंगे” अथवा “वे तुम्हारे विषय में विचार करेंगे।” इब्रानी क्रिया में केवल देखने के बजाय ध्यानपूर्वक जाँचने या विचार करने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאֶיךָ
  choice: जो तुम्हें देखेंगे
  rationale: कर्ता के रूप में प्रयुक्त बहुवचन कृदंत और द्वितीय पुरुष एकवचन प्रत्यय का स्वाभाविक हिन्दी रूप; सीधे संबोधन को बनाए रखता है।
- source_word: אֵלֶיךָ יַשְׁגִּיחוּ
  choice: वे तुम्हें घूरेंगे
  rationale: हिफ़ील रूप लक्ष्य करके, एकटक और विस्मय से देखने का भाव देता है; प्रसंग में ‘घूरेंगे’ इस तीव्र दृष्टि को सहज हिन्दी में व्यक्त करता है।
- source_word: אֵלֶיךָ יִתְבּוֹנָנוּ
  choice: वे तुम्हें ध्यान से देखेंगे
  rationale: हित्पोलेल रूप सावधानी से देखने, जाँचने या विचार करने का भाव रखता है। मुख्य पाठ में दृश्य समानांतरता रखी गई है, जबकि व्यापक अर्थ-पक्ष पादटिप्पणी में दिया गया है।
- source_word: הֲזֶה הָאִישׁ
  choice: क्या यही वह आदमी है
  rationale: प्रश्नवाचक ה और संकेतवाचक זֶה विस्मयपूर्ण आलंकारिक प्रश्न बनाते हैं; ‘आदमी’ पुल्लिंग एकवचन मानवीय शासक के स्पष्ट उल्लेख को सुरक्षित रखता है।
- source_word: מַרְגִּיז הָאָרֶץ
  choice: जो पृथ्वी को थरथराता था
  rationale: कारक अर्थ वाले हिफ़ील कृदंत को ऐसा हिन्दी रूप दिया गया है जो पृथ्वी को काँपाने और उस अत्याचारी की पूर्ववर्ती निरंतर गतिविधि—दोनों को व्यक्त करता है।
- source_word: מַרְעִישׁ מַמְלָכוֹת
  choice: राज्यों को हिला देता था
  rationale: रעשׁ के हिफ़ील कृदंत में कंपाने या हिला देने का कारक भाव है। यह पिछले खंड के समानांतर, संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: ताना-काव्य में ‘उस आदमी’ का अभिप्रेत व्यक्ति
  choice: मुख्य पाठ में उसे सीधे एक मानवीय पुरुष शासक के रूप में अनूदित किया गया है।
  alternative: मुख्य पाठ में उसकी पहचान शैतान/लूसिफ़र या एक साथ बाबेल के राजा और किसी ब्रह्मांडीय विद्रोही के रूप में करना।
  rationale: इब्रानी पाठ इस पद में הָאִישׁ, ‘वह आदमी,’ कहता है और निकट साहित्यिक प्रसंग बाबेल के राजा पर ताना है। बाद की धर्मवैज्ञानिक पहचान को अनुवाद में जोड़ना मूल पाठ से आगे जाना होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज काव्यात्मक गद्य। दो समानांतर दृष्टि-क्रियाओं और विस्मयपूर्ण प्रश्न की तीव्रता को बनाए रखा गया है। हिन्दी में उद्धरण को स्वाभाविक बनाने के लिए ‘और पूछेंगे’ जोड़ा गया है; यह इब्रानी के प्रत्यक्ष आलंकारिक प्रश्न में निहित वाणी को स्पष्ट करता है।
