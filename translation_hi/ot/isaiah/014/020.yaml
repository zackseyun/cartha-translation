id: ISA.14.20
reference: Isaiah 14:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹֽא תֵחַ֤ד אִתָּ/ם֙ בִּ/קְבוּרָ֔ה כִּֽי אַרְצְ/ךָ֥ שִׁחַ֖תָּ עַמְּ/ךָ֣ הָרָ֑גְתָּ לֹֽא יִקָּרֵ֥א לְ/עוֹלָ֖ם זֶ֥רַע מְרֵעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/020.yaml
  text: You will not be joined with them in burial[a], because you have destroyed your land; you have slain your people. The offspring of evildoers will never be named.
translation:
  language: hi
  text: तुझे उनके साथ दफ़न नहीं किया जाएगा, क्योंकि तूने अपने देश को नष्ट किया; तूने अपने लोगों को मार डाला। कुकर्मियों की संतान[a] का नाम फिर कभी न लिया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘कुकर्मियों का बीज’; या ‘दुष्टों के वंशज’।
    reason: זֶרַע का अर्थ प्रसंग के अनुसार बीज, संतान या वंशज हो सकता है; टिप्पणी इस रूपक और सामूहिक अर्थ को दिखाती है।
lexical_decisions:
- source_word: תֵחַד אִתָּם בִּקְבוּרָה
  choice: तुझे उनके साथ दफ़न नहीं किया जाएगा
  rationale: यह सहज आधुनिक हिन्दी में יחד के ‘साथ मिलाए/सम्मिलित किए जाने’ के भाव और קְבוּרָה के दफ़न-संबंधी अर्थ को व्यक्त करता है, बिना किसी विशिष्ट कब्र या समाधि का अर्थ जोड़े।
- source_word: אַרְצְךָ
  choice: अपने देश को
  rationale: यहाँ אֶרֶץ शासक के अधीन देश या भूभाग को दर्शाता है; ‘देश’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: שִׁחַתָּ
  choice: नष्ट किया
  rationale: שׁחת के पिएल रूप की विनाश या बरबादी की तीव्रता को सीधे व्यक्त करता है।
- source_word: עַמְּךָ הָרָגְתָּ
  choice: तूने अपने लोगों को मार डाला
  rationale: यह शासक द्वारा अपनी ही प्रजा की हत्या किए जाने के आरोप को स्पष्ट रखता है; ‘हत्या की’ की अपेक्षा ‘मार डाला’ मूल क्रिया में निहित क्रिया-फल को बिना अतिरिक्त कानूनी अर्थ के व्यक्त करता है।
- source_word: לֹא יִקָּרֵא לְעוֹלָם
  choice: नाम फिर कभी न लिया जाएगा
  rationale: कרא के निफ़अल और לְעוֹלָם की स्थायी निषेधात्मक शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है, साथ ही स्मरण या प्रतिष्ठा से मिट जाने का संकेत बनाए रखता है।
- source_word: זֶרַע מְרֵעִים
  choice: कुकर्मियों की संतान
  rationale: זֶרַע के सामूहिक ‘संतान/वंश’ और מְרֵעִים के बहुवचन ‘बुराई करने वालों’ को सुरक्षित रखता है; इसे केवल एक ही दुष्ट शासक के निजी वंश तक सीमित नहीं करता।
theological_decisions:
- issue: क्या זֶרַע מְרֵעִים केवल इस अत्याचारी के राजवंश को दर्शाता है या सामान्य रूप से कुकर्मियों की संतति को
  choice: कुकर्मियों की संतान
  alternative: इस कुकर्मी की संतान / दुष्ट के वंशज
  rationale: मूल इब्रानी में מְרֵעִים बहुवचन है और अभिव्यक्ति व्याकरणतः सामान्य है। निकट प्रसंग में यह दोषी शासक के वंश को सम्मिलित कर सकती है, पर अनुवाद इसे केवल उसी तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। भविष्यवाणी के न्यायपूर्ण आरोप की तीव्रता बनाए रखने के लिए ‘नष्ट किया’ और ‘मार डाला’ चुने गए हैं। अर्धविराम दोनों समानांतर आरोपों को स्पष्ट रूप से अलग करता है।
