id: ISA.14.12
reference: Isaiah 14:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֵ֛יךְ נָפַ֥לְתָּ מִ/שָּׁמַ֖יִם הֵילֵ֣ל בֶּן שָׁ֑חַר נִגְדַּ֣עְתָּ לָ/אָ֔רֶץ חוֹלֵ֖שׁ עַל גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/012.yaml
  text: How you have fallen from heaven[a], shining one, son of dawn! You have been cut down to the earth, you who subdued the nations.
translation:
  language: hi
  text: 'तू कैसे आकाश से गिर पड़ा है,

    हे चमकनेवाले[a], भोर के पुत्र!

    तू धरती पर काट गिराया गया है,

    तू जो राष्ट्रों को निर्बल करता था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी הֵילֵל का आशय किसी चमकते हुए खगोलीय रूप से है; इसे “भोर का तारा” या “प्रातःतारा” भी समझा जाता है। कुछ पुराने अनुवादों में इसे परंपरागत रूप से “लूसिफ़र” कहा गया है।
    reason: वैकल्पिक अनुवाद और ऐतिहासिक परंपरा स्पष्ट करना, बिना इसे मुख्य पाठ में व्यक्तिवाचक नाम बनाए।
lexical_decisions:
- source_word: אֵיךְ
  choice: कैसे
  rationale: विस्मय और व्यंग्यपूर्ण विलाप की अलंकारिक शक्ति को बिना अतिरिक्त अर्थ जोड़े व्यक्त करता है।
- source_word: נָפַלְתָּ מִשָּׁמַיִם
  choice: तू आकाश से गिर पड़ा है
  rationale: पूर्ण हो चुके पतन को वर्तमान प्रभाव के साथ व्यक्त करता है; 'आकाश' ऊर्ध्वलोक और धरती के काव्यात्मक विरोध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הֵילֵל
  choice: चमकनेवाले
  rationale: शब्द के प्रकाशमान खगोलीय रूपक को व्यक्त करता है, पर बाद की लैटिन परंपरा के 'लूसिफ़र' को मूल पाठ का स्पष्ट व्यक्तिवाचक नाम नहीं बनाता।
- source_word: בֶּן־שָׁחַר
  choice: भोर के पुत्र
  rationale: मूल इब्रानी का काव्यात्मक और मानवीकृत बिंब निकटता से सुरक्षित रहता है।
- source_word: נִגְדַּעְתָּ לָאָרֶץ
  choice: तू धरती पर काट गिराया गया है
  rationale: निफ़अल की कर्मवाच्य शक्ति और हिंसक अपमान के बिंब को व्यक्त करता है; 'धरती' आकाश के साथ विरोध बनाए रखती है।
- source_word: חוֹלֵשׁ עַל־גּוֹיִם
  choice: तू जो राष्ट्रों को परास्त करता था
  rationale: कृदंत के चरित्रसूचक कार्य और राष्ट्रों पर प्रभुत्व/दमन के भाव को सहज हिन्दी में व्यक्त करता है; भूतकालीन 'करता था' पतित शासक के पूर्व आचरण को स्पष्ट करता है।
theological_decisions:
- issue: क्या הֵילֵל को परंपरागत व्यक्तिवाचक नाम 'लूसिफ़र' के रूप में अनूदित किया जाए
  choice: मुख्य पाठ में वर्णनात्मक संबोधन 'चमकनेवाले'
  alternative: '''लूसिफ़र'', ''भोर का तारा'', या ''प्रातःतारा'''
  rationale: मूल इब्रानी में यह स्पष्ट रूप से व्यक्तिवाचक नाम नहीं, बल्कि प्रकाशमान खगोलीय आकृति का काव्यात्मक पद है। वर्णनात्मक अनुवाद मूल की अनिश्चितता बनाए रखता है और बाद की धार्मिक पहचान को पाठ में आरोपित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण काव्यात्मक हिन्दी; सीधे संबोधन के लिए 'तू' मूल के एकवचन व्यंग्यगीत की तीव्रता बनाए रखता है। पंक्ति-विभाजन इब्रानी समानांतरता और आकाश–धरती विरोध को उभारता है।
