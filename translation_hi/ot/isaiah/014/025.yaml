source:
  edition: WLC
  text: לִ/שְׁבֹּ֤ר אַשּׁוּר֙ בְּ/אַרְצִ֔/י וְ/עַל הָרַ֖/י אֲבוּסֶ֑/נּוּ וְ/סָ֤ר מֵֽ/עֲלֵי/הֶם֙ עֻלּ֔/וֹ וְ/סֻ֨בֳּל֔/וֹ מֵ/עַ֥ל שִׁכְמ֖/וֹ יָסֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/025.yaml
  text: to break Assyria in my land[a], and on my mountains I will trample him; then his yoke will depart from upon them[b], and his burden from upon his shoulder will depart.
translation:
  language: hi
  text: कि मैं अपने देश में अश्शूर को तोड़ दूँगा[a] और अपने पहाड़ों पर उसे रौंद डालूँगा; तब उसका जूआ उन पर से हट जाएगा[b], और उसका बोझ उसके कंधे पर से हट जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अश्शूरी को”; इब्रानी शब्द देश को अथवा उसके प्रतिनिधि शासक या सेना को सूचित कर सकता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में यहाँ “उन पर से” के बाद “उसके कंधे पर से” आता है। यह एकवचन पीड़ित लोगों का मानवीकरण कर सकता है या प्रत्येक व्यक्ति के लिए अलग-अलग लागू हो सकता है।
    reason: number_shift
lexical_decisions:
- source_word: לִשְׁבֹּר
  choice: तोड़ दूँगा
  rationale: שׁבר के मूल रूपक को बनाए रखता है और पिछले पद की शपथ के उद्देश्य/परिणाम को हिन्दी में स्वाभाविक भावी कथन के रूप में व्यक्त करता है।
- source_word: אַשּׁוּר
  choice: अश्शूर
  rationale: यह नाम साम्राज्य को भी सूचित कर सकता है और उसके प्रतिनिधि शासक या सेना को भी; हिन्दी बाइबलीय नाम ‘अश्शूर’ इस द्विअर्थकता को बनाए रखता है।
- source_word: בְּאַרְצִי
  choice: अपने देश में
  rationale: यह परमेश्वर के अधिकार में स्थित भूभाग का स्वाभाविक आधुनिक हिन्दी रूप है; ‘अपने’ का संबंध वक्ता से स्पष्ट है।
- source_word: הָרַי
  choice: अपने पहाड़ों पर
  rationale: बहुवचन और प्रथम पुरुष संबंध को सुरक्षित रखते हुए स्थलाकृतिक तथा स्वामित्व-संबंधी बल बनाए रखता है।
- source_word: אֲבוּסֶנּוּ
  choice: उसे रौंद डालूँगा
  rationale: בוס की प्रबल छवि को स्वाभाविक हिन्दी में व्यक्त करता है; एकवचन कर्मप्रत्यय अश्शूर के मानवीकरण से मेल खाता है।
- source_word: עֻלּוֹ
  choice: उसका जूआ
  rationale: विदेशी प्रभुत्व और दमन के पारंपरिक रूपक को सीधे बनाए रखता है।
- source_word: סֻבֳּלוֹ
  choice: उसका बोझ
  rationale: जूए के समानांतर थोपा हुआ भार या दमन व्यक्त करता है।
- source_word: מֵעֲלֵיהֶם ... מֵעַל שִׁכְמוֹ
  choice: उन पर से ... उसके कंधे पर से
  rationale: मसोरेटी पाठ के बहुवचन से एकवचन में परिवर्तन को समतल किए बिना सुरक्षित रखता है।
- source_word: וְסָר ... יָסוּר
  choice: हट जाएगा ... हट जाएगा
  rationale: दोनों बार סור का समान अनुवाद करके इब्रानी समानांतरता और दमन के दूर होने की छवि बनाए रखता है।
theological_decisions:
- issue: אַשּׁוּר का संकेत
  choice: साम्राज्यगत शक्ति के रूप में अश्शूर, जिसका एकवचन में मानवीकरण हुआ है
  alternative: अश्शूरी राजा या आक्रमणकारी सेना
  rationale: देश में पराजय तथा जूए और बोझ के हटने का संदर्भ सामूहिक राजनीतिक शक्ति की ओर संकेत करता है, जबकि एकवचन सर्वनाम प्रतिनिधि या मानवीकृत अर्थ को खुला रखते हैं।
- issue: पीड़ित पक्ष में वचन-परिवर्तन
  choice: ‘उन पर से’ से ‘उसके कंधे पर से’ का मसोरेटी परिवर्तन सुरक्षित रखा गया
  alternative: दोनों को बहुवचन करके ‘उनके कंधों पर से’ कहना
  rationale: मूल पाठ में मौजूद तनाव को सामंजस्यपूर्ण बनाकर मिटाया नहीं गया; एकवचन पीड़ित जनता का मानवीकरण या प्रत्येक व्यक्ति के लिए वितरणात्मक प्रयोग हो सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘जूआ’ दमन के परिचित बाइबलीय रूपक को बनाए रखता है। पद पिछले वाक्य की निरंतरता है, इसलिए आरंभ में ‘कि’ रखा गया है।
