id: ISA.14.14
reference: Isaiah 14:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֶעֱלֶ֖ה עַל בָּ֣מֳתֵי עָ֑ב אֶדַּמֶּ֖ה לְ/עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/014.yaml
  text: I will ascend above the heights of the clouds[a]; I will make myself like the Most High.
translation:
  language: hi
  text: मैं बादलों की ऊँचाइयों से भी ऊपर चढ़ूँगा; मैं परमप्रधान के समान बनूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं परमप्रधान के समान होऊँगा।”
    reason: इब्रानी क्रिया को अधिक सरल रूप में भी अनूदित किया जा सकता है; मुख्य पाठ का ‘समान बनूँगा’ रूप उसके आत्म-संबंधी और बनने के भाव को अधिक स्पष्ट करता है।
lexical_decisions:
- source_word: אֶעֱלֶה
  choice: मैं … चढ़ूँगा
  rationale: עלה के क़ाल अपूर्ण, प्रथम पुरुष एकवचन का अर्थ ऊपर की ओर जाना है। ‘चढ़ूँगा’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग में निहित आत्म-उत्थान का भाव बनाए रखता है।
- source_word: עַל
  choice: से भी ऊपर
  rationale: चढ़ने की क्रिया और ‘बादलों की ऊँचाइयों’ के साथ עַל यहाँ उनसे अधिक ऊँचा जाने का अर्थ देता है; ‘से भी ऊपर’ इस तुलना और अतिक्रमण को स्पष्ट करता है।
- source_word: בָּמֳתֵי עָב
  choice: बादलों की ऊँचाइयों
  rationale: בָּמֳתֵי ऊँचे स्थानों या ऊँचाइयों को और עָב बादल अथवा घने बादल को दर्शाता है। यह रूप मूल बिंब को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: אֶדַּמֶּה
  choice: मैं … के समान बनूँगा
  rationale: דמה का यह रूप अपने को किसी के समान करने अथवा उसके समान बनने की आकांक्षा व्यक्त करता है। ‘समान बनूँगा’ उस गतिशील और आत्म-संबंधी भाव को ‘समान होऊँगा’ की अपेक्षा अधिक स्पष्ट करता है।
- source_word: לְעֶלְיוֹן
  choice: परमप्रधान के
  rationale: עֶלְיוֹן यहाँ परमेश्वर की उपाधि के रूप में प्रयुक्त है। ‘परमप्रधान’ हिन्दी बाइबलीय प्रयोग में प्रतिष्ठित, संक्षिप्त और धर्मवैचारिक बल को सुरक्षित रखने वाला रूप है।
theological_decisions:
- issue: עֶלְיוֹן को ईश्वरीय उपाधि के रूप में प्रस्तुत करना
  choice: परमप्रधान
  alternative: सर्वोच्च
  rationale: प्रसंग में वक्ता अपने को ईश्वर के समान ऊँचा करने की डींग मारता है। ‘परमप्रधान’ इसे ईश्वरीय उपाधि के रूप में बनाए रखता है, जबकि ‘सर्वोच्च’ केवल सामान्य विशेषण भी समझा जा सकता है।
- issue: אֶדַּמֶּה में समानता और आत्म-उत्थान का संबंध
  choice: परमप्रधान के समान बनूँगा
  alternative: परमप्रधान के समान होऊँगा
  rationale: चुना हुआ रूप वक्ता की स्वयं को ईश्वर-सदृश बनाने या बनने की आकांक्षा व्यक्त करता है, पर यह नहीं बताता कि वह वास्तव में वैसा हो सकेगा; इस प्रकार कथन की डींग और धर्मवैचारिक तनाव दोनों बने रहते हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बादलों की ऊँचाइयों’ मूल काव्य-बिंब को सुरक्षित रखता है, और अर्धविराम समानांतर घमंडी घोषणाओं को जोड़ता है। पादटिप्पणी-चिह्न उसी पदांश के बाद रखा गया है जिससे उसका lexical विकल्प संबंधित है।
