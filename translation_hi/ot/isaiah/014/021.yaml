id: ISA.14.21
reference: Isaiah 14:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הָכִ֧ינוּ לְ/בָנָ֛י/ו מַטְבֵּ֖חַ בַּ/עֲוֺ֣ן אֲבוֹתָ֑/ם בַּל יָקֻ֨מוּ֙ וְ/יָ֣רְשׁוּ אָ֔רֶץ וּ/מָלְא֥וּ פְנֵֽי תֵבֵ֖ל עָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/021.yaml
  text: Prepare slaughter for his sons because of the guilt of their fathers[a], lest they rise up and possess the land[c][b], and fill the face of the world with cities.
translation:
  language: hi
  text: उसके बेटों के लिए वध की तैयारी करो, उनके पिताओं के अपराध के कारण,[a] ऐसा न हो कि वे उठ खड़े हों, देश पर अधिकार कर लें[b] और संसार की सतह को नगरों से भर दें।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनके पिताओं के अधर्म के कारण’; इब्रानी शब्द עָוֹן का अर्थ अपराध, दोष अथवा दोष के फलस्वरूप मिलने वाला दंड हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘देश के वारिस हो जाएँ’; इब्रानी क्रिया का अर्थ ‘उत्तराधिकार पाना,’ ‘अधिकार करना’ या ‘अपने कब्जे में लेना’ हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘संसार के मुख को नगरों से भर दें।’
    reason: literal_rendering
lexical_decisions:
- source_word: הָכִינוּ
  choice: तैयारी करो
  rationale: हिफ़ील बहुवचन आज्ञार्थक रूप किसी वस्तु को तैयार करने की सीधी आज्ञा देता है; हिंदी में ‘वध की तैयारी करो’ स्वाभाविक और स्पष्ट है।
- source_word: לְבָנָיו
  choice: उसके बेटों के लिए
  rationale: मूल पाठ में ‘उसके बेटे’ का स्पष्ट पुल्लिंग बहुवचन है; इसे अधिक व्यापक ‘वंशजों’ में नहीं बदला गया।
- source_word: מַטְבֵּחַ
  choice: वध
  rationale: यह संज्ञा हिंसक संहार या वध को दर्शाती है। ‘वध’ गंभीरता बनाए रखता है और ‘वध-स्थल’ जैसी अनावश्यक स्थानगत व्याख्या से बचता है।
- source_word: בַּעֲוֹן
  choice: अपराध के कारण
  rationale: עָוֹן में अधर्म, दोष और दोष का दंड—तीनों अर्थ-छायाएँ हो सकती हैं। ‘अपराध’ नैतिक दोष को व्यक्त करता है, जबकि पादटिप्पणी अन्य संभावना सुरक्षित रखती है।
- source_word: אֲבוֹתָם
  choice: उनके पिताओं
  rationale: यह शाब्दिक बहुवचन ‘उनके पिता’ है। ‘पिताओं’ अंतरपीढ़ी संबंध को सीधे बनाए रखता है; ‘पुरखों’ की अपेक्षा यह मूल के अधिक निकट है।
- source_word: בַּל יָקֻמוּ
  choice: ऐसा न हो कि वे उठ खड़े हों
  rationale: בַּל नकारात्मक उद्देश्य या आशंकित परिणाम बताता है, और קום यहाँ उठकर सक्रिय या शक्तिशाली होने का भाव रखता है।
- source_word: וְיָרְשׁוּ אָרֶץ
  choice: देश पर अधिकार कर लें
  rationale: ירש का अर्थ उत्तराधिकार पाना, अधिकार करना या अपने कब्जे में लेना हो सकता है। यहाँ साम्राज्यवादी विस्तार के संदर्भ में ‘अधिकार कर लें’ उपयुक्त है। אָרֶץ को ‘देश’ कहना आगे के תֵבֵל (‘संसार’) से भेद बनाए रखता है।
- source_word: וּמָלְאוּ פְנֵי תֵבֵל
  choice: संसार की सतह को ... भर दें
  rationale: यह ‘संसार के मुख’ की इब्रानी छवि को अर्थपूर्ण आधुनिक हिंदी में ‘सतह’ द्वारा व्यक्त करता है और सार्वभौमिक विस्तार का भाव बनाए रखता है।
- source_word: עָרִים
  choice: नगरों से
  rationale: बहुवचन संज्ञा का सीधा अर्थ ‘नगर’ है; इसे पाठ में यथावत रखा गया है।
theological_decisions:
- issue: पिताओं के अपराध के कारण बेटों पर आने वाला न्याय
  choice: बेटों के वध को उनके पिताओं के अपराध से जोड़ने वाले कथन को बिना नरम किए बनाए रखा गया है।
  alternative: यह स्पष्ट जोड़ देना कि बेटों को केवल तभी दंड मिलता है जब वे पिताओं के पाप जारी रखें, या עָוֹן को केवल ‘दंड’ मानना।
  rationale: मूल पद बेटों के लिए तैयार किए जाने वाले वध को पिताओं के עָוֹן से सीधे जोड़ता है। अनुवाद इस धर्मवैचारिक तनाव को अन्य ग्रंथों के आधार पर चुपचाप हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में गंभीर और सार्वजनिक पाठ के योग्य रखी गई है। ‘वध की तैयारी करो’ आज्ञा की कठोरता बनाए रखता है। ‘देश’ और ‘संसार’ अलग रखकर אָרֶץ तथा תֵבֵל का भेद सुरक्षित किया गया है; ‘सतह’ इब्रानी ‘मुख’ की छवि को समझने योग्य बनाता है।
