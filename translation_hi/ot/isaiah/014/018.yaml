  text: כָּל מַלְכֵ֥י גוֹיִ֖ם כֻּלָּ֑/ם שָׁכְב֥וּ בְ/כָב֖וֹד אִ֥ישׁ בְּ/בֵיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/018.yaml
  text: All the kings of the nations[a], all of them, lie in glory[b], each in his own house.
translation:
  language: hi
  text: राष्ट्रों के सभी राजा—वे सब—सम्मान के साथ लेटे हैं,[a] हर एक अपने घर में।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘महिमा में’; यहाँ आशय सम्मानजनक दफन से हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘अपने घर में’; इस संदर्भ में यह उसकी कब्र या समाधि-कक्ष को सूचित कर सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: כָּל מַלְכֵי גוֹיִם
  choice: राष्ट्रों के सभी राजा
  rationale: यह रचना सभी गैर-इस्राएली राष्ट्रों के राजाओं को सामूहिक रूप से दर्शाती है। ‘राष्ट्रों’ यहाँ גוֹיִם का स्वाभाविक और प्रचलित हिन्दी रूप है।
- source_word: כֻּלָּם
  choice: वे सब
  rationale: आरम्भिक ‘सभी’ के बाद आया यह पुनरुक्त सर्वनाम इब्रानी के जोर को बनाए रखता है।
- source_word: שָׁכְבוּ
  choice: लेटे हैं
  rationale: संदर्भ मृत्यु और दफन का है, पर क्रिया मूलतः ‘लेटना’ कहती है। ‘लेटे हैं’ उस स्थायी दशा को स्वाभाविक हिन्दी में व्यक्त करता है और ‘विश्राम करते हैं’ या ‘सोते हैं’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: בְכָבוֹד
  choice: सम्मान के साथ
  rationale: यहाँ כָּבוֹד प्रतिष्ठापूर्ण और सम्मानजनक दफन की दशा को सूचित करता है। ‘सम्मान के साथ’ आधुनिक हिन्दी में स्वाभाविक है; अधिक शाब्दिक ‘महिमा में’ को पाद-टिप्पणी में रखा गया है।
- source_word: אִישׁ בְבֵיתוֹ
  choice: हर एक अपने घर में
  rationale: אִישׁ यहाँ वितरणात्मक अर्थ में ‘हर एक’ है। בְבֵיתוֹ का शाब्दिक बिंब ‘अपने घर में’ रखता है, जबकि संदर्भगत रूप से ‘घर’ कब्र या समाधि-कक्ष हो सकता है।
