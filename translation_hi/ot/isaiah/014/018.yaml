translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। डैश और ‘वे सब’ मूल इब्रानी की बलाघातपूर्ण पुनरुक्ति को बनाए रखते हैं; मृत्यु और दफन का संदर्भ स्पष्ट होने पर भी मुख्य पाठ मूल के ‘लेटे हैं’ और ‘घर’ वाले बिंबों को सुरक्षित रखता है।
