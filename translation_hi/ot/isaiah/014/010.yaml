source:
  edition: WLC
  text: כֻּלָּ֣/ם יַֽעֲנ֔וּ וְ/יֹאמְר֖וּ אֵלֶ֑י/ךָ גַּם אַתָּ֛ה חֻלֵּ֥יתָ כָמ֖וֹ/נוּ אֵלֵ֥י/נוּ נִמְשָֽׁלְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/010.yaml
  text: All of them will answer and say to you[a], ‘You too have become weak like us[b]; you have become like us.’
translation:
  language: hi
  text: वे सब उत्तर देकर तुमसे कहेंगे, “तुम भी हमारी तरह निर्बल हो गए हो[a]; तुम हमारे समान हो गए हो[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम भी हमारी तरह निर्बल कर दिए गए हो।”
    reason: חֻלֵּיתָ का पुअल रूप बाहरी प्रभाव से निर्बल किए जाने का भाव भी दे सकता है।
  - marker: b
    text: या, “तुम हमारी बराबरी पर आ गए हो”; अथवा, “तुम्हें हमारे समान ठहराया गया है।”
    reason: נִמְשָׁלְתָּ में समान होने, तुलनीय ठहराए जाने या बराबरी पर आने की अर्थ-सीमा है।
lexical_decisions:
- source_word: כֻּלָּם
  choice: वे सब
  rationale: यह पदबंध पिछले प्रसंग में वर्णित अधोलोक के सभी मृत राजाओं को सामूहिक रूप से दर्शाता है और मूल के समग्र बल को स्वाभाविक हिन्दी में रखता है।
- source_word: יַעֲנוּ וְיֹאמְרוּ
  choice: उत्तर देकर ... कहेंगे
  rationale: दोनों क्रियाओं का संवादात्मक भाव सुरक्षित रखते हुए यह आधुनिक हिन्दी में सहज है; भविष्य का अर्थ मुख्य क्रिया ‘कहेंगे’ में स्पष्ट है।
- source_word: אֵלֶיךָ
  choice: तुमसे
  rationale: बोलने के संबोधन को हिन्दी के स्वाभाविक प्रयोग में व्यक्त करता है।
- source_word: גַּם אַתָּה
  choice: तुम भी
  rationale: गिरे हुए राजा को अन्य मृतकों में व्यंग्यपूर्वक सम्मिलित किए जाने का भाव सुरक्षित रहता है।
- source_word: חֻלֵּיתָ
  choice: निर्बल हो गए हो
  rationale: पुअल रूप यहाँ बीमारी की अपेक्षा शक्ति खो देने और अशक्त हो जाने का परिणामसूचक अर्थ देता है।
- source_word: כָמוֹנוּ
  choice: हमारी तरह
  rationale: तुलना को संक्षिप्त और सहज हिन्दी में व्यक्त करता है।
- source_word: אֵלֵינוּ נִמְשָׁלְתָּ
  choice: तुम हमारे समान हो गए हो
  rationale: נמשל के ‘समान होना/तुलनीय हो जाना’ अर्थ को स्वाभाविक रूप से व्यक्त करता है और पिछले खंड के जानबूझकर दोहराए गए अपमान को बनाए रखता है।
theological_decisions:
- issue: अधोलोक में बोले गए इस व्यंग्य का स्वरूप
  choice: इसे राजा की शक्ति-हानि और मृतकों की सामान्य दशा में आ जाने पर किया गया काव्यात्मक उपहास माना गया है।
  alternative: इसे परलोक की चेतन अवस्था का विस्तृत सिद्धान्त या अत्यधिक विशिष्ट पौराणिक चित्रण मानकर अनुवाद करना।
  rationale: मूल पद मृतकों को काव्यात्मक रूप से बोलते दिखाता है, पर इससे परलोक के व्यापक सिद्धान्तों का निर्णय नहीं करता; इसलिए चित्र और धार्मिक तनाव दोनों सुरक्षित रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और व्यंग्यात्मक काव्य-स्वर रखा गया है। ‘निर्बल’ शक्ति के लोप को स्पष्ट करता है, जबकि दोनों समानांतर वाक्यांशों की पुनरुक्ति मूल के उपहास को बनाए रखती है।
