source:
  edition: WLC
  text: אַֽל תִּשְׂמְחִ֤י פְלֶ֨שֶׁת֙ כֻּלֵּ֔/ךְ כִּ֥י נִשְׁבַּ֖ר שֵׁ֣בֶט מַכֵּ֑/ךְ כִּֽי מִ/שֹּׁ֤רֶשׁ נָחָשׁ֙ יֵ֣צֵא צֶ֔פַע וּ/פִרְי֖/וֹ שָׂרָ֥ף מְעוֹפֵֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/029.yaml
  text: Do not rejoice, all of you Philistia, because the rod that struck you is broken; for from the root of the serpent will come out a viper, and its fruit will be a flying fiery serpent.
translation:
  language: hi
  text: हे समस्त पलिश्तिया, आनन्द मत मना कि तुझे मारने वाला डंडा टूट गया है; क्योंकि साँप की जड़ से विषधर निकलेगा, और उसका फल उड़ता हुआ अग्निमय सर्प होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְלֶשֶׁת כֻּלֵּךְ
  choice: हे पूरे पलिश्तिया
  rationale: संबोधन और स्त्रीलिंग एकवचन भाव को रखते हुए पूरे देश/प्रदेश को सामूहिक इकाई के रूप में व्यक्त करता है।
- source_word: שֵׁבֶט מַכֵּךְ
  choice: तुझे मारनेवाला डंडा
  rationale: שֵׁבֶט का ठोस चित्र 'डंडा' और participial מַכֵּךְ का प्रहार करने वाला अर्थ सुरक्षित है; राजनीतिक दमन का रूपक पाठ में खुला रहता है।
- source_word: צֶפַע
  choice: विषधर
  rationale: यह किसी घातक विषैले साँप को दर्शाता है; प्रजाति की अनिश्चित पहचान को किसी आधुनिक विशिष्ट प्रजाति से नहीं बाँधता।
- source_word: שָׂרָף מְעוֹפֵף
  choice: उड़ता हुआ अग्निमय सर्प
  rationale: שָׂרָף के अग्नि/जलन-संबंधी बिंब और מְעוֹפֵף के उड़ने के अर्थ, दोनों को स्पष्ट रूप से रखता है।
theological_decisions:
- issue: साँप, विषधर और उड़ते अग्निमय सर्प की पहचान
  choice: रूपकों को मूल सर्प-चित्रों के साथ अनिर्दिष्ट रखा गया
  alternative: इन्हें निश्चित ऐतिहासिक राजाओं या साम्राज्यों के नामों से पहचानना
  rationale: पद स्वयं उन शासकों का नाम नहीं बताता; अनुवाद को व्याख्यात्मक ऐतिहासिक पहचान थोपनी नहीं चाहिए।
- issue: שֵׁבֶט का अर्थ
  choice: डंडा
  alternative: राजदंड
  rationale: संदर्भ में प्रहार का भाव प्रधान है, पर 'डंडा' सत्ता और दमन के रूपक को समाप्त नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधी हिन्दी; पलिश्तिया को संबोधित स्त्रीलिंग एकवचन सर्वनाम 'तुझे' रखा गया है। समांतर सर्प-बिंब और चेतावनी का तीखा स्वर संरक्षित हैं।
