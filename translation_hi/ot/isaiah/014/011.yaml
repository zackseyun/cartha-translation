  text: הוּרַ֥ד שְׁא֛וֹל גְּאוֹנֶ֖/ךָ הֶמְיַ֣ת נְבָלֶ֑י/ךָ תַּחְתֶּ֨י/ךָ֙ יֻצַּ֣ע רִמָּ֔ה וּ/מְכַסֶּ֖י/ךָ תּוֹלֵעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/011.yaml
  text: Your pomp has been brought down to Sheol[a], the sound of your harps; maggots are spread out beneath you[c][b], and worms are your covering.
translation:
  language: hi
  text: तेरा वैभव[a] और तेरी वीणाओं[c] का स्वर शिओल[b] में उतार दिया गया है; तेरे नीचे सड़न के कीड़े बिछाए गए हैं, और कृमि तेरा आवरण हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरा प्रताप,” “तेरा ठाठ-बाट,” अथवा “तेरा घमंड।” हिब्रू शब्द ऊँची शान के साथ अहंकारी गर्व भी व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शिओल मृतकों का लोक है; अन्य संभावित अनुवाद हैं “कब्र” या “मृतकों का लोक।”
    reason: lexical_alternative
  - marker: c
    text: या “तार वाले वाद्य”; “वीणाएँ” हिब्रू शब्द के लिए एक सामान्यीकृत अनुवाद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּרַד
  choice: उतार दिया गया है
  rationale: होफ़ाल रूप कारक-निष्क्रिय अवरोह को व्यक्त करता है। पूर्ण वर्तमान यहाँ अपमानजनक पतन को घटित तथ्य के रूप में प्रस्तुत करता है।
- source_word: שְׁאוֹל
  choice: शिओल
  rationale: हिब्रू संकल्पना को बनाए रखने के लिए लिप्यंतरण चुना गया है; इससे इसे केवल भौतिक कब्र या बाद की ‘नरक’ संबंधी धारणाओं तक सीमित नहीं किया जाता।
- source_word: גְּאוֹנֶךָ
  choice: तेरा वैभव
  rationale: यह शब्द ऊँची शान, राजसी ठाठ और घमंड—इन परस्पर जुड़े भावों को व्यक्त कर सकता है। प्रसंग में राजा की भव्यता प्रमुख है, इसलिए ‘वैभव’ स्वाभाविक है और नैतिक अर्थ को अनावश्यक रूप से निर्णीत नहीं करता।
- source_word: הֶמְיַת
  choice: स्वर
  rationale: संज्ञा ध्वनि या गूँज को सूचित करती है; वाद्य-संगीत के संदर्भ में ‘स्वर’ सहज और गरिमापूर्ण है।
- source_word: נְבָלֶיךָ
  choice: तेरी वीणाओं
  rationale: נבל वीणा या सारंगी जैसे प्राचीन तार वाले वाद्य को दर्शाता है। ‘वीणा’ आधुनिक हिन्दी पाठक के लिए परिचित निकटतम सामान्य पद है।
- source_word: יֻצַּע רִמָּה
  choice: सड़न के कीड़े बिछाए गए हैं
  rationale: निष्क्रिय क्रिया बिस्तर की तरह बिछाने का चित्र देती है, जबकि רִמָּה शव को खाने वाले कीड़ों की ओर संकेत करता है। ‘सड़न के कीड़े’ इस भयावह चित्र को स्पष्ट रखता है।
- source_word: וּמְכַסֶּיךָ תּוֹלֵעָה
  choice: और कृमि तेरा ओढ़ना हैं
  rationale: मूल में नीचे बिछे बिस्तर और ऊपर के आवरण का व्यंग्यात्मक समानांतर चित्र है। ‘ओढ़ना’ उसे बनाए रखता है; ‘कृमि’ दूसरे कीटवाची शब्द को पहले से अलग दर्शाता है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: शिओल
  alternative: कब्र; मृतकों का लोक; अधोलोक
  rationale: पद मृतकों के लोक में उतरने का चित्र देता है। ‘शिओल’ मूल हिब्रू अवधारणा को खुला रखता है और पाठ में निहित न होने वाली बाद की नरक-संबंधी धर्मवैज्ञानिक धारणा आरोपित नहीं करता।
- issue: גְּאוֹן में वैभव और घमंड का तनाव
  choice: वैभव
  alternative: घमंड; ठाठ-बाट; प्रताप
  rationale: राजकीय शान के पतन पर बल होने के कारण ‘वैभव’ मुख्य पाठ में उपयुक्त है। फुटनोट यह सुरक्षित रखता है कि शब्द में अहंकारी ऊँचाई का भाव भी हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सुबोध रूप अपनाया गया है। एकवचन संबोधन ‘तेरा/तेरी’ मूल के प्रत्यक्ष उपहासपूर्ण संबोधन को बनाए रखता है। ‘बिछाए गए’ और ‘ओढ़ना’ मिलकर मृत राजा के लिए बनाए गए विकृत बिस्तर का काव्यात्मक समानांतर चित्र सुरक्षित रखते हैं।
