  text: וְ/רָעוּ֙ בְּכוֹרֵ֣י דַלִּ֔ים וְ/אֶבְיוֹנִ֖ים לָ/בֶ֣טַח יִרְבָּ֑צוּ וְ/הֵמַתִּ֤י בָֽ/רָעָב֙ שָׁרְשֵׁ֔/ךְ וּ/שְׁאֵרִיתֵ֖/ךְ יַהֲרֹֽג׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/030.yaml
  text: The firstborn of the poor will graze[a], and the needy will lie down in safety; and I will kill your root with famine[b], and it will slay your remnant.
translation:
  language: hi
  text: गरीबों के पहलौठे चरेंगे[a], और जरूरतमंद सुरक्षित लेटेंगे; और मैं अकाल से तेरी जड़ को मार डालूँगा, और वह तेरे बचे हुओं को मार डालेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गरीबों में सबसे गरीब।” इब्रानी में शाब्दिक रूप से “गरीबों के पहलौठे” है, जो संभवतः अत्यधिक गरीबी बताने वाला मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यहाँ “वह मार डालेगा” है। इसका कर्ता स्पष्ट नहीं है; इसे अकाल या किसी अनिर्दिष्ट दंडकारी के रूप में समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָעוּ
  choice: चरेंगे
  rationale: रעה के काल रूप का मूल अर्थ पशुओं का चरना है। यह चुनाव अगले पशुपालकीय चित्र ‘लेटेंगे’ के साथ संगति रखता है।
- source_word: בְּכוֹרֵי דַלִּים
  choice: गरीबों के पहलौठे
  rationale: בכור का प्रत्यक्ष अर्थ ‘पहलौठा’ है। संभव मुहावरेदार अर्थ ‘गरीबों में सबसे गरीब’ को मुख्य पाठ में आरोपित न करके पादटिप्पणी में रखा गया है।
- source_word: וְאֶבְיוֹנִים
  choice: जरूरतमंद
  rationale: אביון अभाव और आवश्यकता पर बल देता है; इससे דלים के लिए प्रयुक्त ‘गरीब’ से शब्दार्थगत भेद भी बना रहता है।
- source_word: לָבֶטַח יִרְבָּצוּ
  choice: सुरक्षित लेटेंगे
  rationale: רבץ पशुओं के सुरक्षित होकर लेटने का चित्र देता है और לבטח सुरक्षा को व्यक्त करता है।
- source_word: וְהֵמַתִּי בָרָעָב
  choice: मैं अकाल से ... मार डालूँगा
  rationale: מות का हिफ़ईल रूप मृत्यु का कारण बनने को और ב साधन को व्यक्त करता है; ‘अकाल से’ सहज हिन्दी में वही अर्थ देता है।
- source_word: שָׁרְשֵׁךְ
  choice: तेरी जड़
  rationale: शाब्दिक ‘जड़’ को बनाए रखने से संबोधित जाति के मूल या आधार का भविष्यद्वक्ताई रूपक सुरक्षित रहता है।
- source_word: וּשְׁאֵרִיתֵךְ
  choice: तेरे बचे हुए
  rationale: שארית का अर्थ बचा हुआ भाग या जीवित बचे लोग है। यहाँ ‘बचे हुए’ आधुनिक हिन्दी में स्वाभाविक है और संदर्भगत अर्थ स्पष्ट रखता है।
- source_word: יַהֲרֹג
  choice: वह ... मार डालेगा
  rationale: इब्रानी क्रिया तृतीय पुरुष पुल्लिंग एकवचन है। ‘वह’ प्रथम पुरुष से हुए मूल बदलाव को बनाए रखता है और उसके कर्ता को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: अंतिम तृतीय पुरुष क्रिया का अस्पष्ट कर्ता
  choice: ‘वह ... मार डालेगा’ द्वारा अनिर्दिष्ट तृतीय पुरुष को बनाए रखना
  alternative: ‘अकाल ... मार डालेगा’ अथवा ‘मैं ... मार डालूँगा’
  rationale: मूल पाठ ‘मैं ... मार डालूँगा’ से तृतीय पुरुष पुल्लिंग एकवचन ‘वह मार डालेगा’ पर जाता है। कर्ता अकाल, परमेश्वर, या कोई निहित दंडकारी हो सकता है; इसलिए इस तनाव को मुख्य पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पहलौठे’ की असामान्यता मूल इब्रानी बिंब को बचाने के लिए जानबूझकर रखी गई है; उसका संभव मुहावरेदार अर्थ पादटिप्पणी में दिया गया है। संबोधन का स्त्रीलिंग एकवचन रूप ‘तेरी’ प्रसंग में पलिश्तिया को संबोधित मूल इब्रानी रूप के अनुरूप है।
