source:
  edition: WLC
  text: זֹ֛את הָ/עֵצָ֥ה הַ/יְּעוּצָ֖ה עַל כָּל הָ/אָ֑רֶץ וְ/זֹ֛את הַ/יָּ֥ד הַ/נְּטוּיָ֖ה עַל כָּל הַ/גּוֹיִֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/026.yaml
  text: This is the plan that is planned against all the earth[a], and this is the hand that is stretched out against all the nations.
translation:
  language: hi
  text: यही वह योजना है जो सारी पृथ्वी[a] के विरुद्ध बनाई गई है, और यही वह हाथ है जो सभी राष्ट्रों के विरुद्ध फैलाया गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सारी भूमि’; यदि यहाँ संकेत विश्वव्यापी न होकर किसी क्षेत्र विशेष की ओर समझा जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הָעֵצָה הַיְעוּצָה
  choice: यही वह योजना है जो … ठहराई गई है
  rationale: प्रदर्शनवाचक זֹאת का बल ‘यही’ से व्यक्त होता है। עֵצָה के लिए ‘योजना’ आधुनिक और सहज है; יעץ से बने कर्मवाच्य कृदंत का अर्थ यहाँ सोची और निश्चित की गई योजना है। शाब्दिक पुनरुक्ति ‘योजना बनाई गई’ संभव है, पर ‘ठहराई गई’ हिंदी में योजना की निश्चितता अधिक स्वाभाविक ढंग से व्यक्त करती है।
- source_word: עַל
  choice: के विरुद्ध
  rationale: न्याय के इस प्रसंग में यह संबंधबोधक शब्द लक्ष्य के प्रति विरोधी दिशा व्यक्त करता है।
- source_word: כָּל הָאָרֶץ
  choice: सारी पृथ्वी
  rationale: אָרֶץ का अर्थ ‘देश/भूमि’ भी हो सकता है, किंतु समानांतर वाक्यांश ‘सभी राष्ट्रों’ के कारण यहाँ विश्वव्यापी अर्थ अधिक संभावित है। वास्तविक क्षेत्रीय विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְזֹאת הַיָּד הַנְּטוּיָה
  choice: और यही वह हाथ है जो … बढ़ाया गया है
  rationale: ‘हाथ’ को शक्ति के अमूर्त अर्थ में बदलने के बजाय मूल न्याय-रूपक बनाए रखा गया है। נטה के कर्मवाच्य कृदंत को ‘बढ़ाया गया’ कहना वर्तमान हिंदी में स्वाभाविक और चित्रात्मक है।
- source_word: כָּל הַגּוֹיִם
  choice: सभी राष्ट्रों
  rationale: גּוֹיִם यहाँ इस्राएल से अलग किसी तकनीकी धार्मिक वर्ग के बजाय व्यापक रूप से राष्ट्रों को दर्शाता है।
theological_decisions:
- issue: הָאָרֶץ के न्याय-संबंधी प्रयोग का क्षेत्र
  choice: 'विश्वव्यापी अर्थ: ‘सारी पृथ्वी’'
  alternative: 'क्षेत्रीय अर्थ: ‘सारा देश’ या ‘सारी भूमि’'
  rationale: ‘सभी राष्ट्रों’ के साथ समानांतरता विश्वव्यापी क्षितिज का समर्थन करती है, फिर भी אָרֶץ की वास्तविक अर्थगत अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘यही … और यही’ से इब्रानी समानांतर रचना और संकेतात्मक बल सुरक्षित हैं; ‘हाथ’ का बाइबलीय न्याय-रूपक भी अक्षुण्ण है।
