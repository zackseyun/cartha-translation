  text: All the earth is at rest and quiet[a]; they break out in singing.
translation:
  language: hi
  text: सारी पृथ्वी को विश्राम मिला है, वह शांत है; लोग आनंद से गा उठे हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָחָה
  choice: विश्राम मिला है
  rationale: यह נוח का पूर्णकालिक स्त्रीलिंग एकवचन रूप है, जिसका कर्ता ‘पृथ्वी’ है। ‘विश्राम मिला है’ पूर्व घटना से उत्पन्न वर्तमान शांत अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שָׁקְטָה
  choice: वह शांत है
  rationale: यह שקט का पूर्णकालिक स्त्रीलिंग एकवचन रूप है और נָחָה के साथ मिलकर स्थिर शांति की अवस्था बताता है। स्पष्टता और स्वाभाविकता के लिए कर्ता ‘वह’ दोहराया गया है।
- source_word: כָּל הָאָרֶץ
  choice: सारी पृथ्वी
  rationale: אָרֶץ का अर्थ ‘पृथ्वी’ या ‘देश’ हो सकता है। इस व्यंग्य-गीत के व्यापक संदर्भ और כָּל के सार्वभौमिक बल को देखते हुए ‘सारी पृथ्वी’ उपयुक्त है।
- source_word: פָּצְחוּ
  choice: गा उठे हैं
  rationale: פצח ध्वनि या गीत के अचानक फूट पड़ने का भाव देता है। ‘गा उठे हैं’ आधुनिक हिन्दी में उसी आरंभिक और सजीव बल को सहज रूप से व्यक्त करता है।
- source_word: רִנָּה
  choice: आनंद से
  rationale: רִנָּה ऊँची, प्रायः आनंदपूर्ण पुकार या गीत को दर्शाता है। ‘आनंद से गा उठे हैं’ क्रिया के साथ मिलकर अर्थ को स्वाभाविक हिन्दी में पूरा करता है।
