  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। पहले दो पूर्णकालिक क्रियारूपों की परिणामी वर्तमान अवस्था तथा अंतिम बहुवचन क्रिया की सजीवता को सुरक्षित रखा गया है।
