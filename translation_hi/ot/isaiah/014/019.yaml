source:
  edition: WLC
  text: וְ/אַתָּ֞ה הָשְׁלַ֤כְתָּ מִֽ/קִּבְרְ/ךָ֙ כְּ/נֵ֣צֶר נִתְעָ֔ב לְב֥וּשׁ הֲרֻגִ֖ים מְטֹ֣עֲנֵי חָ֑רֶב יוֹרְדֵ֥י אֶל אַבְנֵי ב֖וֹר כְּ/פֶ֥גֶר מוּבָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/019.yaml
  text: But you are cast out from your grave like a despised branch[a], clothed with the slain, those pierced by the sword, who go down to the stones of the pit[c][b], like a trampled corpse.
translation:
  language: hi
  text: परन्तु तू अपनी कब्र से दूर फेंक दिया गया है—एक घृणित अंकुर[a] के समान; तू तलवार से बेधे गए मारे हुओं[b] से ढका हुआ है, जो गड्ढे के पत्थरों तक उतरते हैं[c]—एक रौंदी हुई लाश के समान।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घृणित डाली।” हिब्रू शब्द का अर्थ “अंकुर” या “डाली” हो सकता है; यहाँ आशय किसी अस्वीकार कर फेंक दी गई वस्तु से है।
    reason: lexical_alternative
  - marker: b
    text: या “तलवार से आर-पार किए गए।” हिब्रू अभिव्यक्ति कठिन है; प्रसंग में आशय युद्ध में मारे गए लोगों से है।
    reason: lexical_alternative
  - marker: c
    text: “गड्ढा” कब्र या मृतकों के लोक के लिए प्रयुक्त काव्यात्मक शब्द है। “गड्ढे के पत्थर” संभवतः पत्थरों से घिरी कब्र का चित्र प्रस्तुत करते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: הָשְׁלַכְתָּ מִקִּבְרְךָ
  choice: तुझे तेरी कब्र से निकाल फेंका गया है
  rationale: होफ़अल रूप का निष्क्रिय और परिणामसूचक भाव सुरक्षित रहता है; מן के साथ यह उचित दफ़न से बाहर निकाल दिए जाने या उससे वंचित होने का चित्र देता है।
- source_word: כְּנֵצֶר נִתְעָב
  choice: एक घृणित डाली के समान
  rationale: נֵצֶר का अर्थ अंकुर या डाली हो सकता है। यहाँ त्यागी हुई वस्तु का चित्र प्रमुख है; ‘डाली’ सहज है और यशायाह 11:1 का मसीही संकेत अनावश्यक रूप से नहीं लाती।
- source_word: לְבוּשׁ הֲרֻגִים
  choice: मारे हुओं से ढका पड़ा है
  rationale: शाब्दिक ‘मारे हुओं को पहने हुए’ हिन्दी में अस्वाभाविक होगा। ‘से ढका’ वस्त्र-सदृश बिंब को रखते हुए दृश्य को स्पष्ट करता है।
- source_word: מְטֹעֲנֵי חָרֶב
  choice: तलवार से बेधे गए
  rationale: हिब्रू पद कठिन है, पर प्रसंग युद्ध में तलवार से मारे गए लोगों का संकेत देता है। ‘बेधे गए’ संभावित अर्थ को व्यक्त करता है, और कठिनाई पाद-टिप्पणी में बताई गई है।
- source_word: יוֹרְדֵי אֶל אַבְנֵי בוֹר
  choice: जो गड्ढे के पत्थरों तक उतरते हैं
  rationale: पत्थरों और गड्ढे, दोनों ठोस काव्यात्मक चित्रों को बनाए रखा गया है; वाक्यांश संभवतः पत्थरों से बनी या पटी कब्र का आभास देता है।
- source_word: כְּפֶגֶר מוּבָס
  choice: एक रौंदी हुई लाश के समान
  rationale: פֶגֶר मनुष्य के मृत शरीर को और מוּבָס पैरों तले रौंदे जाने को दर्शाता है; हिन्दी रूप संक्षिप्त और प्रभावशाली है।
theological_decisions:
- issue: נֵצֶר में संभावित मसीही अनुगूँज
  choice: डाली
  alternative: अंकुर
  rationale: तात्कालिक प्रसंग अपमानित शासक पर व्यंग्य का है। ‘डाली’ मूल अर्थ को रखती है, पर यशायाह 11:1 की मसीही धारणा को इस पद में आरोपित नहीं करती।
- issue: בּוֹר का आशय
  choice: गड्ढा
  alternative: कब्र अथवा मृतकों का लोक
  rationale: ठोस काव्यात्मक बिंब सुरक्षित रखने के लिए ‘गड्ढा’ रखा गया है; मृत्यु और कब्र से उसका संबंध पाद-टिप्पणी में स्पष्ट है, बिना किसी विशिष्ट परलोक-सिद्धान्त को थोपे।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक किंतु सामान्य पाठक के लिए सुबोध रूप। निष्क्रिय क्रिया और शव-संबंधी तीखे बिंब सुरक्षित रखे गए हैं; ‘परन्तु’ भविष्यद्वाणी-साहित्य की औपचारिक लय के अनुकूल है।
