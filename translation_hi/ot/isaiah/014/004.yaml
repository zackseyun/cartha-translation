source:
  edition: WLC
  text: וְ/נָשָׂ֜אתָ הַ/מָּשָׁ֥ל הַ/זֶּ֛ה עַל מֶ֥לֶךְ בָּבֶ֖ל וְ/אָמָ֑רְתָּ אֵ֚יךְ שָׁבַ֣ת נֹגֵ֔שׂ שָׁבְתָ֖ה מַדְהֵבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/004.yaml
  text: 'you will take up this taunt against the king of Babylon[a], and say: “How the oppressor has ceased, the insolence has ceased!”'
translation:
  language: hi
  text: 'तू बाबेल के राजा के विरुद्ध यह ताना कहेगा:


    “कैसे अत्याचारी का अंत हो गया!


    कैसे दमन समाप्त हो गया![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दमन” के लिए प्रयुक्त हिब्रानी शब्द दुर्लभ है और उसका अर्थ अनिश्चित है। इसके संभावित अर्थ “उग्र आक्रमण” या “कठोर दमन” हैं; कुछ प्राचीन परंपराओं और अनुवादों में इसे “सोने का नगर” समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂאתָ הַמָּשָׁל הַזֶּה
  choice: तू ... यह ताना कसकर कहेगा
  rationale: נשא के साथ משל का अर्थ किसी व्यंग्यपूर्ण कथन को आरम्भ करके सुनाना है। हिंदी मुहावरा ‘ताना कसकर कहना’ इस प्रसंग के उपहासपूर्ण स्वर और कथन की क्रिया—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा के विरुद्ध
  rationale: यह ताना शत्रुतापूर्वक राजा को लक्ष्य करता है, इसलिए עַל का ‘विरुद्ध’ अर्थ प्रसंगानुकूल है। ‘बाबेल’ हिब्रानी स्थान-नाम का प्रचलित बाइबलीय रूप है।
- source_word: אֵיךְ
  choice: कैसे
  rationale: यहाँ אֵיךְ विस्मय और उपहास का उद्घोष कराता है। ‘कैसे’ दोनों पंक्तियों में उस अलंकारिक बल को बनाए रखता है।
- source_word: שָׁבַת נֹגֵשׂ
  choice: अत्याचारी का अंत हो गया
  rationale: נֹגֵשׂ उस शासक को दर्शाता है जो लोगों पर दबाव डालता और उनसे कठोरता से वसूली कराता है। ‘अत्याचारी’ सामान्य पाठक के लिए स्पष्ट है; ‘अंत हो गया’ שבת के रुक जाने या समाप्त हो जाने के भाव को स्वाभाविक हिंदी में देता है।
- source_word: שָׁבְתָה מַדְהֵבָה
  choice: उसका अत्याचार समाप्त हो गया
  rationale: מַדְהֵבָה अत्यंत दुर्लभ और अनिश्चित शब्द है। प्रसंग और आधुनिक शब्दकोशीय प्रस्तावों के आधार पर इसे दमनकारी उग्रता या कठोर अत्याचार से जोड़ना पारंपरिक ‘सोने का नगर’ से अधिक संभावित है। ‘समाप्त हो गया’ उसी שבת धातु की पुनरावृत्ति को अर्थ के स्तर पर बनाए रखता है।
theological_decisions:
- issue: दुर्लभ शब्द מַדְהֵבָה का अर्थ
  choice: उसका अत्याचार
  alternative: उग्र आक्रमण; कठोर दमन; सोने का नगर
  rationale: यह मुख्यतः शब्दार्थ संबंधी अनिश्चितता है, कोई सिद्धांतगत निर्णय नहीं। मुख्य पाठ में प्रसंगानुकूल संभावित अर्थ रखा गया है और वास्तविक अनिश्चितता तथा प्रमुख पारंपरिक विकल्प को पाद-टिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के लिए सहज रखी गई है। काव्यात्मक समानांतरता के लिए दोनों पंक्तियाँ ‘कैसे’ से आरम्भ होती हैं। एकवचन संबोधन ‘तू’ भविष्यवक्ता को दिए गए प्रत्यक्ष वचन को दर्शाता है; यह अनादर सूचित नहीं करता।
