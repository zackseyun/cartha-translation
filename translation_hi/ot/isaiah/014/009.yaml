base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/009.yaml
  text: Sheol beneath is stirred up for you[a], to meet your coming; it rouses the shades for you, all the leaders of the earth[b]; it raises from their thrones all the kings of the nations.
translation:
  language: hi
  text: 'नीचे, अधोलोक तुम्हारे आने पर तुमसे मिलने के लिए हलचल में है;

    वह तुम्हारे लिए मृत जनों[a] को जगा रहा है—पृथ्वी के सभी अगुओं[b] को;

    वह सब राष्ट्रों के राजाओं को उनके सिंहासनों से उठा खड़ा करता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द ‘रपाईम’ है; यहाँ इसका अर्थ ‘मृत जन’ या ‘दिवंगत आत्माएँ’ है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘पृथ्वी के नर बकरे’ है; यह प्रमुख शासकों या अगुओं के लिए रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: अधोलोक
  rationale: यह शब्द मृतकों के नीचे स्थित लोक की इब्रानी धारणा को स्वाभाविक हिन्दी में व्यक्त करता है और इसे केवल ‘कब्र’ या बाद की धर्मवैज्ञानिक धारणा वाले ‘नरक’ तक सीमित नहीं करता।
- source_word: מִתַּחַת
  choice: नीचे
  rationale: अधोलोक की स्थानिक, नीचे की ओर की काव्यात्मक छवि को सीधे बनाए रखता है।
- source_word: רָגְזָה
  choice: हलचल में है
  rationale: क्रिया के काँपने, उत्तेजित होने या व्याकुल हो उठने के अर्थ-क्षेत्र को समेटता है और अधोलोक के मानवीकरण के अनुकूल है।
- source_word: לִקְרַאת בּוֹאֶךָ
  choice: तुम्हारे आने पर तुमसे मिलने के लिए
  rationale: आगमन और स्वागत के उद्देश्य—दोनों को स्पष्ट, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עוֹרֵר
  choice: जगा रहा है
  rationale: अधोलोक द्वारा अपने मृत निवासियों को आने वाले राजा के स्वागत के लिए सक्रिय करने की सजीव छवि व्यक्त करता है।
- source_word: רְפָאִים
  choice: मृतात्माओं
  rationale: इस प्रसंग में यह जातीय रपाइयों के बजाय अधोलोक में पड़े मृत जनों को सूचित करता है; ‘मृतात्माओं’ से उसका काव्यात्मक और पारलौकिक स्वर बना रहता है।
- source_word: עַתּוּדֵי אָרֶץ
  choice: पृथ्वी के सभी अगुओं
  rationale: शाब्दिक अर्थ ‘पृथ्वी के नर बकरे’ है, जो यहाँ प्रमुख शासकों के लिए रूपक है। मुख्य पाठ में आशय स्पष्ट किया गया है और मूल रूपक पादटिप्पणी में सुरक्षित है।
- source_word: הֵקִים
  choice: उठा खड़ा करता है
  rationale: 'हिफ़ील रूप के कारणवाचक भाव को व्यक्त करता है: अधोलोक राजाओं को उनके सिंहासनों से उठने के लिए प्रेरित करता है।'
- source_word: מִכִּסְאוֹתָם
  choice: उनके सिंहासनों से
  rationale: राजकीय आसनों की छवि और अगले वाक्यांश में राजाओं के उल्लेख के साथ संबंध सुरक्षित रखता है।
- source_word: כֹּל מַלְכֵי גוֹיִם
  choice: सब राष्ट्रों के राजाओं
  rationale: मूल की सार्वभौमिक व्यापकता और राजनीतिक छवि को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: मृतकों के लोक से संबंधित שְׁאוֹל का अनुवाद
  choice: अधोलोक
  alternative: शिओल; कब्र; नरक; मृतकों का लोक
  rationale: पद में मृतकों के नीचे के लोक का मानवीकरण है। ‘अधोलोक’ उस धारणा को सुबोध हिन्दी में व्यक्त करता है, जबकि ‘नरक’ बाद की विशिष्ट धर्मवैज्ञानिक धारणाएँ जोड़ सकता है और ‘कब्र’ अर्थ को अत्यधिक भौतिक तथा संकीर्ण बना सकता है।
- issue: רְפָאִים की पहचान
  choice: मृतात्माएँ
  alternative: मृत जन; रपाई लोग
  rationale: अधोलोक और मृत राजाओं का संदर्भ यहाँ इसे मृतकों के लिए प्रयुक्त काव्यात्मक पद ठहराता है; इसे प्राचीन जातीय रपाइयों के रूप में लेना प्रसंग के अनुकूल नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक गद्य; समानांतर पंक्तियों और अधोलोक के मानवीकरण को बनाए रखते हुए कठिन इब्रानी रूपकों को मुख्य पाठ में सुबोध बनाया गया है और उनकी शाब्दिक छवि पादटिप्पणियों में दी गई है।
