source:
  edition: WLC
  text: כִּי֩ יְרַחֵ֨ם יְהוָ֜ה אֶֽת יַעֲקֹ֗ב וּ/בָחַ֥ר עוֹד֙ בְּ/יִשְׂרָאֵ֔ל וְ/הִנִּיחָ֖/ם עַל אַדְמָתָ֑/ם וְ/נִלְוָ֤ה הַ/גֵּר֙ עֲלֵי/הֶ֔ם וְ/נִסְפְּח֖וּ עַל בֵּ֥ית יַעֲקֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/001.yaml
  text: For Yahweh will have compassion on Jacob and will again choose Israel[a], and he will settle them on their own land. The foreigner will join them[b], and they will attach themselves to the house of Jacob.
translation:
  language: hi
  text: क्योंकि यहोवा याकूब पर दया करेगा और इस्राएल को फिर से चुनेगा। वह उन्हें उनकी अपनी भूमि पर बसाएगा। परदेशी[a] उनके साथ आ मिलेंगे और याकूब के घराने से जुड़ जाएँगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रवासी” अथवा “निवासी विदेशी।” इब्रानी शब्द גֵּר प्रायः इस्राएलियों के बीच रहने वाले गैर-इस्राएली व्यक्ति को दर्शाता है, केवल कुछ समय के लिए आए हुए बाहरी व्यक्ति को नहीं।
    reason: lexical_alternative
  - marker: b
    text: या “उन्हें याकूब के घराने से जोड़ दिया जाएगा।”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले न्याय-वचन के बाद आनेवाली पुनर्स्थापना का आधार बताता है; ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְרַחֵם
  choice: दया करेगा
  rationale: רחם की कोमल करुणा और दयाभाव को सरल, वर्तमान हिंदी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को हिंदी की प्रचलित बाइबलीय वर्तनी में बनाए रखता है।
- source_word: וּבָחַר עוֹד בְּיִשְׂרָאֵל
  choice: और इस्राएल को फिर से चुनेगा
  rationale: עוֹד चुनाव के नए या पुनर्स्थापित कार्य को सूचित करता है; यह अनुवाद उसके अर्थ को किसी विशेष धर्मवैज्ञानिक योजना तक सीमित नहीं करता।
- source_word: וְהִנִּיחָם עַל אַדְמָתָם
  choice: वह उन्हें उनकी अपनी भूमि पर बसाएगा
  rationale: भूमि में लौटाए जाने के संदर्भ में हिफ़ील क्रिया का अर्थ ठहराना या बसाना है; ‘अपनी’ प्रत्यय और पुनर्स्थापना के भाव को स्पष्ट करता है।
- source_word: הַגֵּר
  choice: परदेशी
  rationale: यह सहज हिंदी शब्द किसी गैर-इस्राएली व्यक्ति को दर्शाता है, जबकि पादटिप्पणी उसके निवासी-प्रवासी होने की अधिक विशिष्ट संभावना सुरक्षित रखती है।
- source_word: וְנִלְוָה הַגֵּר עֲלֵיהֶם
  choice: परदेशी उनके साथ हो जाएगा
  rationale: स्वेच्छा से इस्राएल के समुदाय के साथ जुड़ने का भाव स्वाभाविक हिंदी में व्यक्त होता है।
- source_word: וְנִסְפְּחוּ עַל בֵּית יַעֲקֹב
  choice: और वे याकूब के घराने से जुड़ जाएँगे
  rationale: निफ़ाल रूप के जुड़ने अथवा जोड़ दिए जाने के अर्थ को बनाए रखते हुए ‘घराना’ वंश और समुदाय दोनों की छवि व्यक्त करता है।
theological_decisions:
- issue: इस्राएल को ‘फिर से चुनने’ का आशय
  choice: इसे ‘इस्राएल को फिर से चुनेगा’ के रूप में रखा गया है।
  alternative: इसे केवल राष्ट्रीय-राजनीतिक पुनर्स्थापना, अंतिमकालीन चुनाव, या ‘पसंद करेगा’ के रूप में सीमित किया जा सकता था।
  rationale: मूल पाठ न्याय के बाद परमेश्वर के नए अनुग्रह और वाचागत प्रतिबद्धता की बात करता है, पर उसके राष्ट्रीय, अंतिमकालीन या प्रतीकात्मक विस्तार को स्वयं स्पष्ट नहीं करता।
- issue: הַגֵּר की पहचान और स्थिति
  choice: मुख्य पाठ में ‘परदेशी’ रखा गया है।
  alternative: ‘प्रवासी’ या ‘निवासी विदेशी’ अधिक तकनीकी विकल्प हैं।
  rationale: ‘परदेशी’ सामान्य पाठक के लिए स्पष्ट है और गैर-इस्राएली की व्यापक पहचान को बनाए रखता है; पादटिप्पणी मूल शब्द के संभावित निवासी-प्रवासी अर्थ को बताती है।
- issue: וְנִסְפְּחוּ का वाच्य
  choice: ‘वे ... जुड़ जाएँगे’ रखा गया है।
  alternative: ‘उन्हें ... जोड़ दिया जाएगा।’
  rationale: हिब्रू निफ़ाल स्वयं जुड़ने या जोड़ दिए जाने—दोनों छायाएँ दे सकता है; मुख्य पाठ स्वाभाविक हिंदी देता है और पादटिप्पणी कर्मवाच्य संभावना सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सहज रखी गई है। ‘यहोवा,’ ‘इस्राएल’ और ‘याकूब का घराना’ मूल पाठ की वाचागत तथा पारिवारिक छवियों को सुरक्षित रखते हैं। पादटिप्पणी-चिह्न संबंधित शब्द और वाक्यांश के तुरंत बाद रखे गए हैं।
