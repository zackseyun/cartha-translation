  text: וְ/שַׂמְתִּ֛י/הָ לְ/מוֹרַ֥שׁ קִפֹּ֖ד וְ/אַגְמֵי מָ֑יִם וְ/טֵֽאטֵאתִ֨י/הָ֙ בְּ/מַטְאֲטֵ֣א הַשְׁמֵ֔ד נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/023.yaml
  text: I will make her a possession of the hedgehog and pools of water[a], and I will sweep her with the broom of destruction, declares Yahweh of Armies.
translation:
  language: hi
  text: मैं उसे साही[a] का अधिकार-क्षेत्र और पानी के तालाब बना दूँगा; मैं उसे विनाश की झाड़ू से बुहार दूँगा—सेनाओं के याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू शब्द קִפֹּד किस जीव को बताता है, यह निश्चित नहीं है। इसके संभावित अनुवाद ‘साही,’ ‘उल्लू,’ या पारंपरिक ‘बिटर्न’ हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּיהָ
  choice: मैं उसे ... बना दूँगा
  rationale: שׂוּם यहाँ पूरक पदों के साथ ‘बना देना’ का भाव देता है। स्त्रीलिंग प्रत्यय बाबुल नगरी की ओर संकेत करता है; हिन्दी में स्वाभाविक रूप से ‘उसे’ कहा गया है।
- source_word: לְמוֹרַשׁ
  choice: की जागीर
  rationale: מוֹרָשׁ किसी के अधिकार या कब्ज़े में आई संपत्ति/भूमि को दर्शाता है। ‘जागीर’ उजड़ी नगरी के उस जीव का क्षेत्र बन जाने का चित्र संक्षेप में रखता है।
- source_word: קִפֹּד
  choice: साही
  rationale: जीव की पहचान अनिश्चित है। ‘साही’ आधुनिक हिन्दी में संभावित मरुस्थलीय अथवा खंडहरवासी जीव का सुबोध नाम है; अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: וְאַגְמֵי מָיִם
  choice: और पानी के ताल
  rationale: אַגַם जलाशय, दलदली ताल या सरकंडों वाले पोखर को सूचित कर सकता है। ‘पानी के ताल’ स्पष्ट है और स्थल-विशेष को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: וְטֵאטֵאתִיהָ
  choice: मैं उसे ... बुहार दूँगा
  rationale: क्रिया טאטא का मूल चित्र झाड़ू से बुहारने का है। ‘बुहार दूँगा’ उस सजीव रूपक तथा पूर्णतः साफ कर देने के भाव को बनाए रखता है।
- source_word: בְּמַטְאֲטֵא הַשְׁמֵד
  choice: विनाश की झाड़ू से
  rationale: हिब्रू का साधनसूचक בְּ और संबंध-पदबंध ‘विनाश की झाड़ू’ के रूप में स्वाभाविक तथा चित्रात्मक हिन्दी देते हैं।
- source_word: נְאֻם
  choice: की घोषणा है
  rationale: यह मानक भविष्यद्वाणी-सूत्र है। ‘की घोषणा है’ आधुनिक, गरिमामय और अधिकारपूर्ण है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिब्रू में परमेश्वर का निज नाम है। हिन्दी बाइबलीय प्रयोग में प्रचलित ‘यहोवा’ नाम को शीर्षक से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- source_word: צְבָאוֹת
  choice: सेनाओं के
  rationale: צְבָאוֹת का सीधा अर्थ सेनाएँ/दल है। ‘सेनाओं के यहोवा’ पारंपरिक अस्पष्ट ‘गणों’ की अपेक्षा आधुनिक पाठक के लिए अधिक पारदर्शी है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के निज नाम को ‘प्रभु’ जैसे पद से नहीं बदला गया। हिन्दी में व्यापक रूप से पहचाना जाने वाला नामरूप ‘यहोवा’ चुना गया है।
- issue: स्त्रीलिंग प्रत्ययों का संदर्भ
  choice: उसे
  alternative: उसको/इसे
  rationale: प्रत्यय बाबुल नगरी को स्त्रीलिंग रूप में व्यक्त करते हैं। हिन्दी में ‘उसे’ स्वाभाविक है और संदर्भ को निर्जीव ‘यह’ बनाकर अनावश्यक रूप से नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, संक्षिप्त और भविष्यद्वाणी-सुलभ गरिमा वाली है। ‘विनाश की झाड़ू’ के तीखे मूल रूपक को ज्यों का त्यों रखा गया है; पशु की अनिश्चित पहचान को मुख्य पाठ में सहज विकल्प और पादटिप्पणी में अन्य संभावनाओं के साथ प्रस्तुत किया गया है।
