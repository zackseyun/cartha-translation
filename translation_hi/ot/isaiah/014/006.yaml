  yaml_path: translation/ot/isaiah/014/006.yaml
  text: striking peoples in fury with an unceasing blow[a], ruling nations in anger[b], with unrelenting persecution.
translation:
  language: hi
  text: 'जो रोष में लोगों को ऐसे प्रहार से मारता था जो रुकता न था,[a]

    और क्रोध में राष्ट्रों पर शासन करता था—उसे बिना रोक-टोक खदेड़ा जाता था।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बिना बख्शे प्रहार से।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी का अंतिम खंड संक्षिप्त और वाक्यगत रूप से कठिन है। ‘खदेड़ा जाता था’ निष्क्रिय कृदन्त है और संभवतः पूर्वोक्त शासक की ओर संकेत करता है; इसे “बिना बख्शे उसका पीछा किया जाता था” भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מַכֶּה עַמִּים
  choice: लोगों को ... मारता था
  rationale: हिफ़ील कृदन्त अत्याचारी के लगातार किए जानेवाले कार्य का वर्णन करता है। हिन्दी में भूतकालीन कृदन्त-सदृश वाक्यांश प्रसंग के ताने की शैली में स्वाभाविक है। עַמִּים के लिए ‘लोगों’ रखकर आगे के גּוֹיִם ‘राष्ट्रों’ से भेद बनाए रखा गया है।
- source_word: בְּעֶבְרָה
  choice: रोष में
  rationale: עֶבְרָה प्रचंड और उमड़ते क्रोध को व्यक्त करता है; ‘रोष’ संक्षिप्त, गरिमापूर्ण और काव्यात्मक है।
- source_word: מַכַּת בִּלְתִּי סָרָה
  choice: न रुकनेवाले प्रहार से
  rationale: यह पदबंध शाब्दिक रूप से ऐसे प्रहार का बोध देता है जो हटता या थमता नहीं। यह चुनाव हिंसक बिंब और निरंतरता दोनों को बनाए रखता है।
- source_word: רֹדֶה ... גּוֹיִם
  choice: राष्ट्रों को दबाता था
  rationale: רדה का अर्थ शासन करना, अधीन रखना या कठोरता से दबाना हो सकता है। हिंसक समानांतर पंक्ति में ‘दबाता था’ उसके दमनकारी भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בָאַף
  choice: क्रोध में
  rationale: אַף का शाब्दिक अर्थ ‘नाक’ है, पर यहाँ यह क्रोध का रूढ़ार्थ रखता है।
- source_word: מֻרְדָּף בְּלִי חָשָׂךְ
  choice: बिना रोक-टोक उनका पीछा करते हुए
  rationale: दुर्बोध और संक्षिप्त इब्रानी पद को अत्याचारी द्वारा राष्ट्रों के अथक पीछा और उत्पीड़न के रूप में प्रस्तुत किया गया है। ‘बिना रोक-टोक’ חָשָׂךְ के ‘रोकना/थामना/बख्शना’ अर्थ-क्षेत्र को दर्शाता है; वैकल्पिक वाक्य-संबंध पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: अंतिम उपवाक्य का कर्ता और वाक्य-संबंध
  choice: इसे दमनकारी शासक द्वारा राष्ट्रों का बिना रोक-टोक पीछा किए जाने के वर्णन के रूप में रखा गया है।
  alternative: इब्रानी को राष्ट्रों के लगातार खदेड़े या सताए जाने की निष्क्रिय अभिव्यक्ति के रूप में भी समझा जा सकता है।
  rationale: मसोरेटिक पाठ अत्यंत संक्षिप्त है और מֻרְדָּף का वाक्यगत संबंध अस्पष्ट है। मुख्य पाठ व्यापक प्रसंग में बाबेल के राजा के दमन को सामने रखता है, जबकि पादटिप्पणी वास्तविक व्याकरणिक अस्पष्टता बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण काव्यात्मक शैली अपनाई गई है। ‘रोष/क्रोध’ और ‘लोगों/राष्ट्रों’ के युग्म मूल की समानांतरता तथा शब्द-भेद को बनाए रखते हैं। पद पिछले प्रसंग में वर्णित अत्याचारी के लिए संबंधवाचक ढंग से खुलता है; पंक्ति-विभाजन इब्रानी काव्य-समानांतरता को स्पष्ट करता है।
