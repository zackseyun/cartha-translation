source:
  edition: WLC
  text: הֵילִ֤ילִֽי שַׁ֨עַר֙ זַֽעֲקִי עִ֔יר נָמ֖וֹג פְּלֶ֣שֶׁת כֻּלֵּ֑/ךְ כִּ֤י מִ/צָּפוֹן֙ עָשָׁ֣ן בָּ֔א וְ/אֵ֥ין בּוֹדֵ֖ד בְּ/מוֹעָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/031.yaml
  text: Wail[a], O gate! Cry out, O city! Melt away, all of you, Philistia! For smoke comes from the north[c][b], and there is no straggler in his ranks.
translation:
  language: hi
  text: हे फाटक, विलाप कर[a]! हे नगर, चिल्ला उठ! हे पलिश्त, पूरी की पूरी गल जा[b]! क्योंकि उत्तर दिशा से धुआँ आ रहा है, और उसकी पंक्तियों में कोई भी पिछड़नेवाला नहीं है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हाहाकार कर’; इब्रानी क्रिया ऊँचे स्वर से रोने या शोक मनाने के अर्थ में भी आ सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मूर्छित हो जा’ अथवा ‘भय से ढह जा।’
    reason: lexical_alternative
  - marker: c
    text: या ‘उसके नियत स्थानों पर कोई अकेला या अलग-थलग नहीं है।’ अंतिम इब्रानी उपवाक्य का आशय यह भी हो सकता है कि आक्रमणकारी सेना पूरी तरह एकत्र और सुव्यवस्थित है।
    reason: alternative_reading
lexical_decisions:
- source_word: הֵילִילִי
  choice: विलाप कर
  rationale: यह ילל का स्त्रीलिंग एकवचन आज्ञार्थक रूप है और संकट में ऊँचे स्वर से शोक करने का भाव व्यक्त करता है। ‘विलाप कर’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: שַׁעַר
  choice: हे फाटक
  rationale: फाटक को सीधे संबोधित किया गया है; वह नगर की सार्वजनिक व्यवस्था और सुरक्षा का भी प्रतिनिधित्व करता है।
- source_word: זַעֲקִי
  choice: पुकार उठा
  rationale: זעק की यह आज्ञा संकट में ऊँची आवाज़ से पुकारने का भाव रखती है। ‘पुकार उठा’ उसकी तात्कालिकता को सहज हिन्दी में व्यक्त करता है।
- source_word: עִיר
  choice: हे नगर
  rationale: यह ‘फाटक’ के समानांतर सीधा संबोधन है। ‘नगर’ भविष्यद्वाणी की गरिमा और सामान्य बोधगम्यता दोनों बनाए रखता है।
- source_word: נָמוֹג
  choice: गल जा
  rationale: מוג में पिघलने, ढह जाने अथवा साहस खो देने का रूपक है। ‘गल जा’ मूल रूपक को बनाए रखता है और उसके भावात्मक अर्थ को किसी एक व्याख्या तक सीमित नहीं करता।
- source_word: פְּלֶשֶׁת כֻּלֵּךְ
  choice: हे समूचे पलिश्त
  rationale: पलिश्त को एक सामूहिक स्त्रीलिंग सत्ता के रूप में संबोधित किया गया है। ‘समूचे’ כֻּלֵּךְ के सर्वसमावेशी भाव को व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले दिए गए विलाप और पुकार का कारण प्रस्तुत करता है।
- source_word: מִצָּפוֹן
  choice: उत्तर दिशा से
  rationale: यह आने वाले संकट की दिशा को सीधे व्यक्त करता है।
- source_word: עָשָׁן
  choice: धुआँ
  rationale: शाब्दिक ‘धुआँ’ सम्भवतः बढ़ती सेना या विनाश का चित्र है; अनुवाद रूपक की व्याख्या जोड़े बिना उसे सुरक्षित रखता है।
- source_word: בָּא
  choice: आ रहा है
  rationale: पूर्ण रूप भविष्यद्वाणी के प्रसंग में आसन्न घटना को सजीव रूप से दिखाता है; हिन्दी का वर्तमान प्रगतिशील रूप उसकी निकटता और गति व्यक्त करता है।
- source_word: וְאֵין בּוֹדֵד
  choice: कोई भी पिछड़नेवाला नहीं है
  rationale: בודד समूह से अलग या पीछे रह गए व्यक्ति का बोध दे सकता है। सैन्य प्रसंग में ‘पिछड़नेवाला’ अनुशासित और संगठित आक्रमणकारी दल की छवि स्पष्ट करता है।
- source_word: בְּמוֹעָדָיו
  choice: उसकी पंक्तियों में
  rationale: מועד सामान्यतः नियत समय, सभा या नियत स्थान को दर्शाता है; यहाँ सैन्य प्रसंग में नियत दलों या स्थानों का भाव सम्भावित है। ‘पंक्तियों में’ मुख्य अर्थ को सहज बनाता है, जबकि वैकल्पिक शाब्दिक सम्भावना पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: וְאֵין בּוֹדֵד בְּמוֹעָדָיו अंतिम उपवाक्य का अर्थ
  choice: यह आक्रमणकारी सेना को ऐसी सुव्यवस्थित शक्ति के रूप में दिखाता है जिसकी पंक्तियों में कोई पिछड़ता नहीं।
  alternative: ‘उसके नियत स्थानों में कोई अलग नहीं है’ अथवा ‘उसके नियत समय पर कोई अनुपस्थित नहीं है।’
  rationale: उत्तर से आते धुएँ की सैन्य छवि के साथ अनुशासित सेना का अर्थ प्रसंगानुकूल है। फिर भी מועד और בודד के अर्थ-क्षेत्र के कारण दूसरी सम्भावनाएँ वास्तविक हैं, इसलिए उन्हें पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, भविष्यद्वाणी के अनुरूप संक्षिप्त, तात्कालिक और गरिमापूर्ण रखी गई है। सीधे संबोधनों में ‘हे’ का प्रयोग काव्यात्मक बल देता है, पर भाषा को अत्यधिक पुरातन नहीं बनाता। ‘गल जा’ मूल रूपक को बचाता है; अंतिम उपवाक्य को मुख्य पाठ में सहज सैन्य अर्थ दिया गया है और उसकी वास्तविक भाषिक अस्पष्टता पादटिप्पणी में दर्ज है।
