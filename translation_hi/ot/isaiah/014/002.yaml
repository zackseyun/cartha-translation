base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/002.yaml
  text: Peoples will take them and bring them to their place[a], and the house of Israel will possess them on the land of Yahweh as male servants and female servants. They will become captors of their captors[d][c][b], and they will rule over their oppressors.
translation:
  language: hi
  text: जातियाँ उन्हें ले जाकर उनके अपने स्थान पर पहुँचाएँगी। तब इस्राएल का घराना याहवे की भूमि पर[d] उन्हें अपने अधिकार में कर लेगा[a]—दासों और दासियों के रूप में[b]। वे अपने बंदी बनानेवालों को बंदी बनाएँगे[c], और वे अपने अत्याचारियों पर शासन करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें अपनी विरासत बना लेगा।” इब्रानी क्रिया में अधिकार पाने के साथ विरासत में पाने का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “पुरुष दास और स्त्री दासियाँ”; पाठ दोनों लिंगों का स्पष्ट उल्लेख करता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में “बंदी बनाने” के एक ही मूल शब्द को दोहराकर उलटाव का शब्दालंकार रचा गया है। इसका अनुवाद “वे अपने बंदी बनानेवालों के बंदी बनानेवाले होंगे” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: d
    text: “याहवे” इब्रानी ईश्वरीय नाम YHWH (יהוה) का लिप्यंतरण है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְקָחוּם עַמִּים
  choice: जाति-जाति के लोग उन्हें लेकर
  rationale: לקח का सामान्य अर्थ ‘लेना’ है और עמים बहुवचन में विभिन्न जनसमूहों को दर्शाता है। ‘जाति-जाति के लोग’ आधुनिक हिन्दी में इस बहुवचन सामूहिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וֶהֱבִיאוּם אֶל־מְקוֹמָם
  choice: उनके अपने स्थान पर पहुँचाएँगे
  rationale: הביא का अर्थ ‘लाना/पहुँचाना’ और מְקוֹמָם का अर्थ ‘उनका स्थान’ है। ‘अपने’ से स्पष्ट होता है कि संकेत इस्राएल के स्वदेश की ओर है, बिना पद में कोई नया स्थान जोड़ने के।
- source_word: וְהִתְנַחֲלוּם
  choice: उन्हें अपने अधिकार में कर लेगा
  rationale: נחל के हित्पाएल रूप में यहाँ किसी को अधिकार या विरासत के रूप में प्राप्त करने का भाव है। मुख्य पाठ में ‘अपने अधिकार में कर लेगा’ प्रसंग के स्वामित्व-संबंध को स्पष्ट करता है, जबकि विरासत-संबंधी वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: यह सामूहिक वाचा-संबंधी अभिव्यक्ति का निकट और हिन्दी में बोधगम्य रूप है।
- source_word: עַל אַדְמַת יְהוָה
  choice: याहवे की भूमि पर
  rationale: אדמה ‘भूमि’ और עַל ‘पर’ को सीधे रखा गया है। יְהוָה को व्यक्तिगत ईश्वरीय नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: दास और दासियों के रूप में
  rationale: इब्रानी पाठ बंधुआ स्थिति तथा पुरुष और स्त्री दोनों को स्पष्ट रूप से अलग-अलग बताता है। ‘दास और दासियाँ’ इस कठोर सामाजिक यथार्थ को euphemism के बिना व्यक्त करता है।
- source_word: וְהָיוּ שֹׁבִים לְשֹׁבֵיהֶם
  choice: वे उन्हें बंदी बनाएँगे जिन्होंने उन्हें बंदी बनाया था
  rationale: दोहराए गए שבה मूल के शब्दालंकार और उत्पीड़न के उलटाव को स्वाभाविक हिन्दी में समान क्रिया ‘बंदी बनाना’ दोहराकर सुरक्षित रखा गया है।
- source_word: וְרָדוּ בְּנֹגְשֵׂיהֶם
  choice: वे अपने अत्याचारियों पर शासन करेंगे
  rationale: רדה का अर्थ ‘शासन करना/अधिकार चलाना’ और נגשׂ का अर्थ यहाँ ‘अत्याचारी/दबानेवाला’ है। यह निर्वासन और उत्पीड़न के व्यापक प्रसंग के अनुकूल है।
theological_decisions:
- issue: पूर्व बंदी बनानेवालों को दास बनाने के सामाजिक-राजनीतिक उलटाव का अनुवाद
  choice: दासता और प्रभुत्व की भाषा को सीधे रखा गया है
  alternative: कठोरता घटाने के लिए ‘सेवक-सेविकाएँ’ या केवल सामान्य अधीनता कहना
  rationale: पाठ स्वयं पुरुष और स्त्री दासों का उल्लेख करता और उत्पीड़न के उलटाव को चित्रित करता है। अनुवाद इसे नरम नहीं करता, न इसे बाद की किसी नैतिक या सांप्रदायिक व्यवस्था का समर्थन बनाता है।
- issue: וְהִתְנַחֲלוּם में अधिकार और विरासत का संबंध
  choice: मुख्य पाठ में ‘अपने अधिकार में कर लेगा’, वैकल्पिक विरासत-अर्थ पादटिप्पणी में
  alternative: ‘उन्हें अपनी विरासत बना लेगा’
  rationale: क्रिया में विरासत-संबंधी रंग है, पर इस प्रसंग में मनुष्यों पर स्वामित्व का परिणाम प्रमुख है। दोनों पक्षों को मुख्य पाठ और पादटिप्पणी के माध्यम से सुरक्षित रखा गया है।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा या ‘प्रभु’
  rationale: मूल पाठ में उपाधि नहीं बल्कि चार-अक्षरी व्यक्तिगत नाम है; इसलिए उसका हिन्दी लिप्यंतरण रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘इस्राएल का घराना’ मूल की सामूहिक वाचा-संबंधी अभिव्यक्ति को बचाता है। दासता की कठोर शब्दावली को न तो नरम किया गया है, न अनावश्यक रूप से अधिक तीखा।
