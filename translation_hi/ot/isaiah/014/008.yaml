    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: यह पिछले वर्णन में पेड़ों को एक अतिरिक्त और आश्चर्यजनक सहभागी के रूप में जोड़ता है; हिन्दी में ‘भी’ स्वाभाविक है।
- source_word: בְּרוֹשִׁים
  choice: सरू के पेड़
  rationale: यह शंकुधारी वृक्ष का सामान्य सम्भावित अर्थ है, पर सटीक प्रजाति अनिश्चित होने के कारण विकल्प पादटिप्पणी में रखे गए हैं।
- source_word: שָׂמְחוּ לְךָ
  choice: तेरे कारण आनन्दित हैं
  rationale: לְךָ कारण अथवा अवसर का भाव दे सकता है। प्रसंग में अत्याचारी के पतन के कारण पेड़ों का आनन्दित होना अभिप्रेत है।
- source_word: אַרְזֵי לְבָנוֹן
  choice: लबानोन के देवदार
  rationale: यह प्रसिद्ध लेबनानी देवदारों को सूचित करने वाला स्पष्ट सम्बन्धवाचक पदबंध है।
- source_word: מֵאָז
  choice: जब से ... तब से
  rationale: राजा के गिरने के समय से चली आ रही स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שָׁכַבְתָּ
  choice: तू पड़ा है
  rationale: मूल क्रिया के ‘लेटने/पड़े होने’ के रूपक को बनाए रखता है और उसे सीधे ‘मर गया’ कहकर व्याख्यायित नहीं करता।
- source_word: לֹא יַעֲלֶה
  choice: कोई ... नहीं चढ़ आया
  rationale: ऊपर की ओर आने की मूल स्थानिक छवि को बचाते हुए, अब तक जारी परिणाम को हिन्दी में व्यक्त करता है।
- source_word: הַכֹּרֵת
  choice: लकड़हारा
  rationale: כרת के कृदन्त का प्रसंगानुकूल अर्थ पेड़ काटने वाला व्यक्ति है; ‘लकड़हारा’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: עָלֵינוּ
  choice: हमें काटने
  rationale: शाब्दिक ‘हम पर/हमारे विरुद्ध’ को वृक्ष-कटाई के प्रसंग में स्वाभाविक हिन्दी क्रियात्मक रूप दिया गया है, बिना शत्रुतापूर्ण आशय खोए।
theological_decisions:
- issue: पेड़ों के आनन्दित होने का आलंकारिक बल
  choice: गिरे हुए बाबुली राजा पर किए गए व्यंग्यगीत में पेड़ों का मानवीकरण बनाए रखा गया है।
  alternative: इसे केवल लकड़ी काटने की गतिविधि घटने का शाब्दिक कथन मानना।
  rationale: निकटवर्ती काव्य-सन्दर्भ मानवीकरण और व्यंग्य से भरा है; अनुवाद छवि को व्याख्यात्मक गद्य में समतल नहीं करता।
- issue: שָׁכַבְתָּ का प्रसंगगत अर्थ
  choice: ‘तू पड़ा है’ द्वारा लेटने/पड़े होने का रूपक सुरक्षित रखा गया है।
  alternative: ‘तू मर गया है’ अथवा ‘तू गिरा दिया गया है।’
  rationale: मूल की काव्यात्मक बहुअर्थता मृत्यु और पतन दोनों की ओर संकेत कर सकती है; अनुवाद इसे किसी एक स्पष्ट व्याख्या में सीमित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; सम्बोधित गिरे हुए राजा के लिए काव्यात्मक एकवचन ‘तू/तेरे’ रखा गया है। देवदारों के कथन को स्पष्ट करने के लिए ‘कहते हैं’ जोड़ा गया है।
