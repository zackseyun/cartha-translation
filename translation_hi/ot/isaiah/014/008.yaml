  text: 'Even the cypresses rejoice over you[a], the cedars of Lebanon: ‘Since you have lain down, no woodcutter comes up against us.’'
translation:
  language: hi
  text: सरू के पेड़ भी तुझ पर प्रसन्न हैं[a], लबानोन के देवदार भी कहते हैं, “जब से तू पड़ा है, कोई लकड़हारा हमें काटने नहीं चढ़ आता।”
  philosophy: optimal-equivalence
  footnotes:
