source:
  edition: WLC
  text: נִשְׁבַּ֛ע יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹ֑ר אִם לֹ֞א כַּ/אֲשֶׁ֤ר דִּמִּ֨יתִי֙ כֵּ֣ן הָיָ֔תָה וְ/כַ/אֲשֶׁ֥ר יָעַ֖צְתִּי הִ֥יא תָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/024.yaml
  text: 'Yahweh of Armies has sworn[a], saying: Surely, just as I have planned, so it has come to pass; and just as I have purposed[d][c][b], so it will stand.'
translation:
  language: hi
  text: 'सेनाओं के यहोवा ने शपथ खाई है, यह कहते हुए: “निश्चय ही, जैसा मैंने सोचा है, वैसा ही हुआ है; और जैसा मैंने ठाना है, वैसा ही स्थिर रहेगा।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: शपथ खाकर कहा है
  rationale: पूर्ण क्रिया एक गंभीर और संपन्न शपथ को व्यक्त करती है; לֵאמֹר के साथ यह हिन्दी में स्वाभाविक रूप से प्रत्यक्ष कथन का परिचय देती है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: व्यक्तिगत दिव्य नाम को लिप्यंतरित रखते हुए צְבָאוֹת के सैन्य भाव को आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: אִם לֹא
  choice: निश्चय ही
  rationale: शपथ-संदर्भ में यह शाब्दिक शर्त नहीं, बल्कि दृढ़ अभिपुष्टि का इब्रानी मुहावरा है।
- source_word: דִּמִּיתִי
  choice: मैंने सोचा है
  rationale: क्रिया के ‘सोचना/मन में ठहराना’ अर्थ को बनाए रखता है और समानांतर יָעַצְתִּי से अनावश्यक रूप से एक नहीं करता।
- source_word: הָיָתָה
  choice: होगा
  rationale: इब्रानी पूर्ण रूप को भविष्यसूचक निश्चितता के संदर्भ में स्वाभाविक हिन्दी भविष्य से व्यक्त किया गया है; इसे भूतकाल मानना भी व्याकरणतः संभव है और पादटिप्पणी में दिया गया है।
- source_word: יָעַצְתִּי
  choice: मैंने ठाना है
  rationale: परामर्श करके निश्चित उद्देश्य या संकल्प बनाने का भाव संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תָקוּם
  choice: स्थिर रहेगा
  rationale: ‘खड़ा होना’ के रूपक से यहाँ किसी उद्देश्य के स्थापित और प्रभावी बने रहने का भाव निकलता है।
theological_decisions:
- issue: יְהוָה צְבָאוֹת का अनुवाद
  choice: सेनाओं के यहोवा
  alternative: सेनाओं के प्रभु / सेनाओं के याहवे
  rationale: यह दिव्य नाम और सैन्य उपाधि दोनों को स्पष्ट रखता है, बिना पारंपरिक पदवी को मूल नाम के स्थान पर रखने के।
- issue: אִם לֹא शपथ-सूत्र का बल
  choice: निश्चय ही
  alternative: यदि नहीं
  rationale: शाब्दिक ‘यदि नहीं’ हिन्दी में अधूरी शर्त लगेगी; ‘निश्चय ही’ गंभीर शपथ की दृढ़ता व्यक्त करता है।
- issue: הָיָתָה का कालगत अर्थ
  choice: होगा
  alternative: हो चुका है / हुआ है
  rationale: अगली क्रिया תָקוּם के अपूर्ण रूप और भविष्यसूचक घोषणा के कारण इसे निश्चित भविष्य के रूप में पढ़ा गया है, पर इब्रानी पूर्ण रूप की वास्तविक कालगत अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण, सीधी और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर वाक्य-विन्यास और दिव्य शपथ की दृढ़ता संरक्षित हैं।
