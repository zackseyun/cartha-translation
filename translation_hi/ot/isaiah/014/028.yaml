  text: בִּ/שְׁנַת מ֖וֹת הַ/מֶּ֣לֶךְ אָחָ֑ז הָיָ֖ה הַ/מַּשָּׂ֥א הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/028.yaml
  text: 'In the year of the death of King Ahaz[a], this oracle came:'
translation:
  language: hi
  text: 'राजा आहाज की मृत्यु के वर्ष में यह घोषणा[a] हुई:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह वाणी आई”; अधिक शाब्दिक रूप से, “यह भार था।”
    reason: इब्रानी מַשָּׂא का अर्थ भविष्यसूचक कथन या गंभीर घोषणा हो सकता है; इसका सामान्य शाब्दिक अर्थ ‘भार’ भी है।
lexical_decisions:
- source_word: בִּשְׁנַת מוֹת
  choice: मृत्यु के वर्ष में
  rationale: यह इब्रानी काल-सूचक पदबंध घटना का वर्ष बताता है। हिंदी में यह स्वाभाविक और स्रोत के निकट है।
- source_word: הַמֶּלֶךְ אָחָז
  choice: राजा आहाज
  rationale: पदवी के साथ व्यक्तिनाम को आधुनिक मानक हिंदी के स्वाभाविक क्रम में रखा गया है।
- source_word: הָיָה
  choice: हुई
  rationale: क्रिया का मूल अर्थ ‘था/हुआ’ है। स्त्रीलिंग ‘घोषणा’ के साथ ‘हुई’ इस भविष्यसूचक शीर्षक को सहज हिंदी में व्यक्त करता है और ‘आया’ जैसा अतिरिक्त दिशात्मक भाव नहीं जोड़ता।
- source_word: הַמַּשָּׂא הַזֶּה
  choice: यह घोषणा
  rationale: מַשָּׂא भविष्यवाणी के शीर्षकों में प्रायः किसी गंभीर भविष्यसूचक कथन या घोषणा को सूचित करता है। ‘घोषणा’ सामान्य पाठक के लिए स्पष्ट है, जबकि शाब्दिक ‘भार’ अस्पष्ट हो सकता है; उसकी शब्दगत छवि पाद-टिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: מַשָּׂא को केवल न्याय-संदेश के रूप में स्पष्ट करना
  choice: तटस्थ ‘घोषणा’
  alternative: ‘न्याय की घोषणा’ या ‘दैवी वाणी’
  rationale: इस पद में संदेश की विषयवस्तु या उसके दैवी स्वरूप को संज्ञा से अधिक स्पष्ट करना व्याख्यात्मक विस्तार होता। तटस्थ शब्द मूल की गंभीर भविष्यसूचक प्रकृति को बिना अनावश्यक सिद्धांतगत जोड़ के बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। वाक्य को अगले भविष्यसूचक खंड का शीर्षक बनाने के लिए अंत में द्विबिंदु रखा गया है।
