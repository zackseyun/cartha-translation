  text: וּ/מַֽה יַּעֲנֶ֖ה מַלְאֲכֵי ג֑וֹי כִּ֤י יְהוָה֙ יִסַּ֣ד צִיּ֔וֹן וּ/בָ֥/הּ יֶחֱס֖וּ עֲנִיֵּ֥י עַמּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/032.yaml
  text: And what will one answer the messengers of the nation? That Yahweh has founded Zion[b][a], and in her the afflicted of his people will find refuge.
translation:
  language: hi
  text: और उस जाति के दूतों[a] को क्या उत्तर दिया जाएगा? “याहवे ने सिय्योन की नींव डाली है, और उसी में उसकी प्रजा के पीड़ित लोग[b] शरण लेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दूतों’ का अनुवाद ‘राजदूतों’ या ‘प्रतिनिधियों’ के रूप में भी किया जा सकता है; इब्रानी शब्द राजनयिक संदेशवाहकों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘पीड़ित लोग’ का अनुवाद ‘गरीब लोग’ या ‘दीन लोग’ भी हो सकता है; इब्रानी शब्द संदर्भ के अनुसार आर्थिक गरीबी, दुःख-पीड़ा या दीनता व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַה יַעֲנֶה
  choice: और ... क्या उत्तर दिया जाएगा?
  rationale: संयोजक वाव को ‘और’ से रखा गया है। यַעֲנֶה का कर्ता अनिर्दिष्ट है; हिन्दी का कर्मवाच्य किसी विशिष्ट व्यक्ति को कर्ता बनाए बिना स्वाभाविक ढंग से प्रश्न व्यक्त करता है।
- source_word: מַלְאֲכֵי גוֹי
  choice: उस जाति के दूतों को
  rationale: מַלְאָךְ यहाँ राजनयिक दूत भी हो सकता है। एकवचन גוֹי को संदर्भगत निश्चितता के साथ ‘उस जाति’ कहा गया है, पर उसकी पहचान को और स्पष्ट नहीं किया गया।
- source_word: כִּי
  choice: प्रत्यक्ष उद्धरण का आरम्भ
  rationale: כִּי यहाँ उत्तर की विषयवस्तु प्रस्तुत करता है। हिन्दी में ‘कि’ की अपेक्षा प्रत्यक्ष उद्धरण अधिक स्वाभाविक है और वही संबंध स्पष्ट रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी विशिष्ट नाम יהוה को उपाधि से प्रतिस्थापित करने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: יִסַּד צִיּוֹן
  choice: सिय्योन की नींव डाली है
  rationale: יסד में स्थापना के साथ नींव डालने का स्थापत्य बिंब है; यह हिन्दी अभिव्यक्ति उस बिंब और पूर्ण किए गए कार्य के वर्तमान महत्व दोनों को रखती है।
- source_word: וּבָהּ
  choice: और उसी में
  rationale: स्त्रीलिंग प्रत्यय सिय्योन की ओर संकेत करता है। हिन्दी में ‘उसी में’ संदर्भ को स्पष्ट और स्वाभाविक रखता है; शहर के लिए कृत्रिम स्त्रीलिंग सर्वनाम नहीं थोपा गया।
- source_word: יֶחֱסוּ
  choice: शरण लेंगे
  rationale: חסה का अर्थ शरण लेना या शरण पाना है। ‘शरण लेंगे’ आश्रय के लिए सिय्योन पर निर्भरता को सीधे व्यक्त करता है।
- source_word: עֲנִיֵּי עַמּוֹ
  choice: उसकी प्रजा के पीड़ित लोग
  rationale: עָנִי आर्थिक गरीबी, दुःख-पीड़ा या दीनता सूचित कर सकता है। संदर्भ में ‘पीड़ित’ असुरक्षित और सताए हुए लोगों की दशा को व्यक्त करता है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे उपस्थित है; लिप्यंतरण उसे किसी उपाधि से बदले बिना सुरक्षित रखता है।
- issue: सिय्योन के लिए स्त्रीलिंग प्रत्यय
  choice: उसी में
  alternative: उसमें; उसी के भीतर
  rationale: मूल का स्त्रीलिंग रूप सिय्योन से व्याकरणिक और काव्यात्मक रूप से जुड़ा है। आधुनिक हिन्दी में नगर के लिए ‘उसमें/उसी में’ स्वाभाविक है और संदर्भ नहीं बदलता; सिय्योन का व्यक्तिकरण अनावश्यक रूप से बढ़ाया नहीं गया।
- issue: עֲנִיֵּי की अर्थ-व्याप्ति
  choice: पीड़ित लोग
  alternative: गरीब लोग; दीन लोग
  rationale: संदर्भ शरण चाहने वाली सताई हुई प्रजा का है, फिर भी शब्द की आर्थिक और विनम्रता-संबंधी संभावनाओं को पादटिप्पणी में बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। प्रश्न में अनिर्दिष्ट कर्ता को कर्मवाच्य से सुरक्षित रखा गया है। प्रत्यक्ष उद्धरण उत्तर की सीमा स्पष्ट करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
