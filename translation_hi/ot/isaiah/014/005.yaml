    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבַר
  choice: तोड़ दिया है
  rationale: काल पूर्ण हुई क्रिया को वर्तमान प्रभाव के साथ व्यक्त करता है; यह रूप भविष्यद्वाणी के उपहास-गीत के संदर्भ में स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: מַטֵּה
  choice: लाठी
  rationale: यह शब्द लाठी या छड़ी का अर्थ दे सकता है। समानांतर שֵׁבֶט से इसे अलग रखते हुए ‘लाठी’ सहज और सटीक है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: बहुवचन संज्ञार्थक विशेषण का सामूहिक और लिंग-निरपेक्ष भाव सुरक्षित रहता है।
- source_word: שֵׁבֶט
  choice: राजदंड
  rationale: शासकों के समानांतर प्रयोग में यह शासन के चिह्न अथवा साधन को सूचित करता है।
- source_word: מֹשְׁלִים
  choice: शासकों
  rationale: משל के बहुवचन कृदंत का सीधा अर्थ ‘शासन करनेवाले’ है; ‘शासक’ संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसका लिप्यंतरण करता है और उसे किसी उपाधि से नहीं बदलता।
translation_notes:
