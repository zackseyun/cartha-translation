  text: כְּ/עַ֤ל גְּמֻלוֹת֙ כְּ/עַ֣ל יְשַׁלֵּ֔ם חֵמָ֣ה לְ/צָרָ֔י/ו גְּמ֖וּל לְ/אֹֽיְבָ֑י/ו לָ/אִיִּ֖ים גְּמ֥וּל יְשַׁלֵּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/018.yaml
  text: 'According to their deeds[a], so he will repay: wrath to his adversaries, repayment to his enemies; to the coastlands he will repay what is due.'
translation:
  language: hi
  text: उनके कर्मों के अनुसार वह प्रतिदान करेगा—अपने विरोधियों पर प्रकोप, अपने शत्रुओं को प्रतिफल; तटीय देशों[a] को वह उचित प्रतिफल चुकाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘द्वीपों’। इब्रानी शब्द का अर्थ द्वीप या दूरस्थ समुद्रतटीय भूभाग हो सकता है; यशायाह में यह प्रायः दूर-दराज़ के तटीय राष्ट्रों के लिए व्यापक रूप से प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַל גְּמֻלוֹת כְּעַל
  choice: उनके कर्मों के अनुसार ही
  rationale: आरंभिक दोहराव प्रतिदान के माप और अनुरूपता पर बल देता है। यह हिंदी प्रयोग उसी अनुपातिक भाव को स्वाभाविक ढंग से व्यक्त करता है; संदर्भ के आधार पर निहित कर्ताओं को ‘उनके’ से स्पष्ट किया गया है।
- source_word: יְשַׁלֵּם
  choice: वह बदला देगा
  rationale: पिएल रूप यहाँ किए गए काम का न्यायिक प्रतिदान देने का अर्थ रखता है। ‘बदला देगा’ आधुनिक हिंदी में स्पष्ट है और आगे आने वाले ‘प्रतिफल’ से अर्थगत संबंध बनाए रखता है।
- source_word: חֵמָה
  choice: प्रकोप
  rationale: यह शब्द तीव्र, न्यायकारी क्रोध दर्शाता है। ‘प्रकोप’ गरिमापूर्ण और बोधगम्य है तथा केवल भावावेश के बजाय दंडात्मक क्रोध को व्यक्त करता है।
- source_word: לְצָרָיו
  choice: अपने विरोधियों पर
  rationale: संज्ञा उन लोगों को दर्शाती है जो उसके विरुद्ध खड़े हैं। प्रकोप के साथ स्वाभाविक हिंदी कारक ‘पर’ रखा गया है।
- source_word: גְּמוּל לְאֹיְבָיו
  choice: अपने शत्रुओं को प्रतिफल
  rationale: ‘प्रतिफल’ कर्म के अनुरूप लौटाए जाने वाले परिणाम को व्यक्त करता है और न्यायिक समानांतरता को बनाए रखता है।
- source_word: לָאִיִּים
  choice: दूर-दराज़ के तटीय देशों
  rationale: यशायाह में אִיִּים प्रायः समुद्रपारीय या दूरस्थ तटीय भूभागों और राष्ट्रों के लिए आता है। यह चयन केवल छोटे द्वीपों तक अर्थ को सीमित नहीं करता।
- source_word: גְּמוּל יְשַׁלֵּם
  choice: वह उनका उचित प्रतिफल देगा
  rationale: संज्ञा और क्रिया की इब्रानी पुनरुक्ति प्रतिदान की निश्चितता और उपयुक्तता पर बल देती है। ‘उचित प्रतिफल देगा’ इस बल को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: एकवचन तृतीय पुरुष क्रियाओं का कर्ता
  choice: पद में केवल ‘वह’ रखा गया
  alternative: स्पष्टता के लिए ‘यहोवा’ जोड़ना
  rationale: निकटवर्ती संदर्भ कर्ता को दिव्य योद्धा के रूप में पहचानता है, पर इस पद में इब्रानी पाठ उसका नाम दोबारा नहीं कहता। ‘वह’ कथन-प्रवाह और मूल की अभिव्यक्ति को बनाए रखता है।
- issue: आरंभिक גמל शब्द-समूह का आशय
  choice: न्याय के आधार के रूप में ‘उनके कर्मों के अनुसार’
  alternative: शाब्दिक रूप से ‘प्रतिफलों के अनुसार’
  rationale: पद कर्मों के अनुरूप दैवी प्रतिदान पर बल देता है। चुना हुआ रूप इसे स्पष्ट करता है, जबकि बाद के ‘प्रतिफल’ शब्द प्रतिदान की मूल शब्दावली को सुरक्षित रखते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समांतर न्यायिक संरचना को दीर्घ विराम और अर्धविराम से स्पष्ट किया गया है। पादटिप्पणी-चिह्न को संबंधित पदबंध ‘तटीय देशों’ के बाद रखा गया है।
