    issue: ‘बदला देगा’ may imply personal vengeance.
    rationale: The Hebrew שלם/גמול word group expresses judicial repayment or requital. ‘प्रतिदान करेगा’ better preserves that sense in Hindi without the potentially retaliatory connotation of ‘बदला।’
