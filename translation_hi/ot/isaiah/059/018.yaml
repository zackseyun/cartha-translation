  terminology: ‘प्रकोप,’ ‘विरोधियों,’ ‘शत्रुओं,’ and ‘प्रतिफल’ are suitable modern-standard Hindi terms in this prophetic judicial register. ‘तटीय देशों’ appropriately renders the broad sense of אִיִּים, with the lexical alternative retained in the footnote.
