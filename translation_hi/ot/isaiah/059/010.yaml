base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/010.yaml
  text: We grope for the wall like the blind; like those without eyes we grope[a]. We stumble at noon as in the twilight; among the vigorous we are like the dead.
translation:
  language: hi
  text: 'हम अंधों के समान दीवार टटोलते हैं;

    जिनकी आँखें नहीं हैं, उनके समान हम टटोलते हैं।

    दोपहर में हम ऐसे ठोकर खाते हैं, मानो गोधूलि हो;

    हृष्ट-पुष्ट लोगों के बीच[a] हम मरे हुओं के समान हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दुर्लभ इब्रानी शब्द का अर्थ अनिश्चित है; इसका अनुवाद ‘उपजाऊ स्थानों में’ भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נְגַשְׁשָׁה / נְגַשֵּׁשָׁה
  choice: हम…टटोलते हैं / हम टटोलते फिरते हैं
  rationale: पिएल रूप स्पर्श के सहारे राह या वस्तु खोजने का भाव देता है। ‘टटोलना’ अंधेपन के बिंब को स्वाभाविक हिन्दी में बनाए रखता है; दूसरे प्रयोग में ‘फिरते’ जोड़ने से निरंतर दिशाहीन खोज का भाव स्पष्ट होता है।
- source_word: כַעִוְרִים
  choice: अंधों के समान
  rationale: इब्रानी बहुवचन विशेषण का सामूहिक अर्थ है। यह रूप किसी अतिरिक्त लिंग-सूचक संज्ञा को जोड़े बिना उपमा को सुरक्षित रखता है।
- source_word: קִיר
  choice: दीवार
  rationale: अनिश्चित रूप में आए इब्रानी शब्द का सीधा और स्वाभाविक हिन्दी समतुल्य; संदर्भ में दीवार स्पर्श द्वारा दिशा पाने का साधन है।
- source_word: וּכְאֵין עֵינַיִם
  choice: जिनकी आँखें नहीं हैं, उनके समान
  rationale: यह पहली उपमा को तीव्र करता है। हिन्दी में तुलना और समानांतरता दोनों स्पष्ट रहती हैं, बिना इसे केवल व्याख्यात्मक रूपक में बदलने के।
- source_word: כָּשַׁלְנוּ
  choice: हम…ठोकर खाते हैं
  rationale: כשל का सामान्य अर्थ लड़खड़ाना या ठोकर खाना है। ‘ठोकर खाते हैं’ अंधेपन और दिशाहीन गति के प्रसंग में सटीक तथा सहज है।
- source_word: בַצָּהֳרַיִם
  choice: दोपहर में
  rationale: यह दिन के सबसे उजले समय को दर्शाता है और अगली पंक्ति की धुँधली रोशनी से तीखा विरोध रचता है।
- source_word: כַנֶּשֶׁף
  choice: मानो गोधूलि हो
  rationale: נשף संध्या या धुँधली बेला का संकेत कर सकता है। ‘गोधूलि’ दोपहर के उजाले से विरोध को स्वाभाविक और काव्यात्मक हिन्दी में व्यक्त करती है, जबकि समय को अत्यधिक निश्चित नहीं करती।
- source_word: בָּאַשְׁמַנִּים
  choice: हृष्ट-पुष्ट लोगों के बीच
  rationale: दुर्लभ और अनिश्चित शब्द के लिए संदर्भानुकूल अर्थ ‘बलवान/स्वस्थ लोगों के बीच’ लिया गया है। ‘हृष्ट-पुष्ट’ जीवित और समर्थ लोगों तथा ‘मरे हुओं’ के बीच विरोध को स्पष्ट करता है; अनिश्चितता पाद-टिप्पणी में सुरक्षित है।
- source_word: כַּמֵּתִים
  choice: मरे हुओं के समान
  rationale: यह सामूहिक और तीखी उपमा को बिना नरम किए स्वाभाविक हिन्दी में बनाए रखता है।
