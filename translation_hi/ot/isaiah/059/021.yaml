base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/021.yaml
  text: 'And as for me[a], this is my covenant with them, says Yahweh: my Spirit that is upon you, and my words that I have put in your mouth, shall not depart from your mouth, or from the mouth of your offspring, or from the mouth of your offspring’s offspring, says Yahweh[b], from now and forever.'
translation:
  language: hi
  text: '“और जहाँ तक मेरी बात है, उनके साथ मेरी वाचा यह है,” यहोवा कहता है: “मेरी आत्मा, जो तुम पर है, और मेरे वचन, जिन्हें मैंने तुम्हारे मुँह में रखे हैं, वे तुम्हारे मुँह से, तुम्हारी सन्तान के मुँह से, और तुम्हारी सन्तान की सन्तान[a] के मुँह से न हटेंगे,” यहोवा कहता है, “अब से सदा तक[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारा वंश” और “तुम्हारे वंश का वंश।” इब्रानी में यहाँ ‘बीज’ का अर्थ देने वाला सामूहिक शब्द सन्तान या वंश के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या “अब से लेकर सदा तक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: और जहाँ तक मेरी बात है
  rationale: आरम्भ में आए स्वतंत्र सर्वनाम के बल और प्रसंगगत मोड़ को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: זֹאת בְּרִיתִי אוֹתָם
  choice: उनके साथ मेरी वाचा यह है
  rationale: वाचा के सम्बन्धसूचक प्रयोग को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिवाचक ईश्वरीय नाम को उपाधि में बदलने के बजाय प्रचलित हिन्दी लिप्यन्तरण में रखा गया है।
- source_word: רוּחִי אֲשֶׁר עָלֶיךָ
  choice: मेरी आत्मा, जो तुम पर है
  rationale: इस भविष्यद्वाणी और वाचा के प्रसंग में רוּחַ का उपयुक्त अर्थ ‘आत्मा’ है; עַל को ‘पर’ से सुरक्षित रखा गया है।
- source_word: וּדְבָרַי אֲשֶׁר שַׂמְתִּי בְּפִיךָ
  choice: और मेरे वचन, जिन्हें मैंने तुम्हारे मुँह में रखा है
  rationale: דְבָרַי के बहुवचन को बनाए रखते हुए पूर्ण क्रिया के वर्तमान में बने परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא יָמוּשׁוּ
  choice: कभी न हटेंगे
  rationale: इस मुहावरे में מוּשׁ का अर्थ किसी स्थान से हटना या दूर होना है; ‘कभी न’ निषेध की स्थायी वाचागत शक्ति स्पष्ट करता है।
- source_word: זַרְעֲךָ
  choice: तुम्हारी सन्तान
  rationale: यहाँ זֶרַע सामूहिक रूप में वंश या भावी सन्तति को दर्शाता है; ‘सन्तान’ हिन्दी में स्वाभाविक रहते हुए सामूहिक अर्थ बनाए रखता है।
- source_word: זֶרַע זַרְעֲךָ
  choice: तुम्हारी सन्तान की सन्तान
  rationale: इब्रानी रचना की पीढ़ीगत क्रमवृद्धि को सीधे और समझने योग्य रूप में सुरक्षित रखता है।
- source_word: מֵעַתָּה וְעַד עוֹלָם
  choice: अब से सदा तक
  rationale: वर्तमान समय से आरम्भ होने वाली निरन्तर अवधि को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: वाचा की प्रतिज्ञा में एकवचन ‘तुम’ का सन्दर्भ
  choice: ‘तुम’ को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: नबी, मानवीकृत सिय्योन/इस्राएल, अथवा सामूहिक रूप से सेवक या छुड़ाया हुआ समुदाय
  rationale: इब्रानी पाठ तत्काल सन्दर्भित व्यक्ति या समुदाय को स्पष्ट नाम नहीं देता। ‘तुम’ मूल की अस्पष्टता और सम्भावित सामूहिक आयाम दोनों को बिना किसी एक व्याख्या को थोपे सुरक्षित रखता है।
- issue: רוּחִי का अर्थ
  choice: मेरी आत्मा
  alternative: मेरी हवा या मेरी साँस
  rationale: ईश्वरीय वाचा, अभिषेक और मुख में रखे गए वचनों के प्रसंग में ‘आत्मा’ सबसे सुसंगत अर्थ है, फिर भी मूल शब्द की व्यापक अर्थ-सीमा को सिद्धान्तगत विस्तार से नहीं भरा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वाचा,’ ‘आत्मा’ और ‘वचन’ जैसे स्थापित बाइबलीय शब्द प्रसंग की गम्भीरता बनाए रखते हैं। एकवचन सम्बोधन को ‘तुम’ से ज्यों का त्यों रखा गया है; हिन्दी में इसका रूप संख्या की दृष्टि से कुछ खुला भी रह सकता है, जो मूल की सामूहिक सम्भावना को अनावश्यक रूप से बन्द नहीं करता।
