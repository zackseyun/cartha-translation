source:
  edition: WLC
  text: וַ/תְּהִ֤י הָֽ/אֱמֶת֙ נֶעְדֶּ֔רֶת וְ/סָ֥ר מֵ/רָ֖ע מִשְׁתּוֹלֵ֑ל וַ/יַּ֧רְא יְהוָ֛ה וַ/יֵּ֥רַע בְּ/עֵינָ֖י/ו כִּֽי אֵ֥ין מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/015.yaml
  text: So truth was missing[a], and whoever turned away from evil was plundered. Yahweh saw[b], and it was evil in his eyes that there was no justice.
translation:
  language: hi
  text: सत्य का अभाव था, और जो बुराई से दूर होता था, उसे शिकार बना दिया जाता था[a]। याहवे ने देखा, और उसकी दृष्टि में यह बुरा था[b] कि न्याय नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे लूट लिया जाता था,” “वह अपने आपको शिकार बना देता था,” अथवा “उसके साथ शिकार जैसा व्यवहार किया जाता था।” इब्रानी शब्द दुर्लभ है और इसका आशय है कि बुराई से दूर होने वाला व्यक्ति स्वयं पीड़ित बन जाता था।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसकी आँखों में यह बुरा था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֱמֶת
  choice: सत्य
  rationale: यहाँ सामाजिक, नैतिक और न्यायिक व्यवस्था के पतन की चर्चा है; इसलिए ‘सत्य’ सार्वजनिक और नैतिक अर्थ को स्वाभाविक रूप से व्यक्त करता है, यद्यपि ‘विश्वसनीयता’ की छाया भी संभव है।
- source_word: נֶעְדֶּרֶת
  choice: का लोप हो गया
  rationale: निफ़अल रूप अनुपस्थित या न रहने का भाव देता है। ‘सत्य का लोप हो गया’ आधुनिक, गरिमापूर्ण हिन्दी में उस अभाव को व्यक्त करता है, बिना उससे अधिक अर्थ जोड़े।
- source_word: וְסָר מֵרָע
  choice: जो बुराई से दूर रहता था
  rationale: पुल्लिंग एकवचन कृदंत यहाँ सामान्य प्रतिनिधिक अर्थ रखता है। यह अनुवाद किसी एक पुरुष तक अर्थ को सीमित किए बिना बुराई का सक्रिय त्याग व्यक्त करता है।
- source_word: מִשְׁתּוֹלֵל
  choice: लूट का शिकार बनता था
  rationale: यह दुर्लभ हित्पोलेल रूप लुट जाने, शिकार बनने या शिकार जैसा व्यवहार सहने का अर्थ दे सकता है। चुना गया वाक्यांश लूट और पीड़ित बनने—दोनों भावों को स्वाभाविक हिन्दी में साथ रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित ध्वन्यात्मक रूप ‘याहवे’ से व्यक्त किया गया है।
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: यह उसकी दृष्टि में बुरा था
  rationale: इब्रानी मुहावरे के नैतिक मूल्यांकन को बनाए रखा गया है; केवल ‘उसे अप्रसन्नता हुई’ कहने से यह बल कम हो जाता।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: इस सामाजिक और न्यायिक संदर्भ में यह शब्द उचित कानूनी तथा नैतिक व्यवस्था, अर्थात न्याय, को सूचित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदले बिना दर्शाता है और ‘यहोवा’ की मिश्रित पारंपरिक स्वर-रचना से बचता है।
- issue: וְסָר का सामान्य पुल्लिंग प्रयोग
  choice: जो बुराई से दूर रहता था
  alternative: वह पुरुष जो बुराई से दूर रहता था
  rationale: इब्रानी पुल्लिंग एकवचन यहाँ किसी विशेष पुरुष की पहचान नहीं करता, बल्कि ऐसे हर व्यक्ति का प्रतिनिधित्व करता है; हिन्दी का ‘जो’ इस सामान्य अर्थ को स्वाभाविक रूप से बनाए रखता है।
- issue: याहवे की नैतिक प्रतिक्रिया
  choice: यह उसकी दृष्टि में बुरा था
  alternative: इससे वह अप्रसन्न हुआ
  rationale: मूल में केवल भावनात्मक अप्रसन्नता नहीं, बल्कि न्याय के अभाव पर नैतिक निर्णय भी व्यक्त है; इसलिए ‘बुरा’ बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है और स्वर गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखा गया है। ‘लूट का शिकार’ दुर्लभ इब्रानी क्रिया के लूटे जाने और शिकार बनने के संयुक्त भाव को व्यक्त करता है; उसकी अनिश्चितता पादटिप्पणी में सुरक्षित है।
