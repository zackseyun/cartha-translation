id: ISA.59.6
reference: Isaiah 59:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: קֽוּרֵי/הֶם֙ לֹא יִהְי֣וּ לְ/בֶ֔גֶד וְ/לֹ֥א יִתְכַּסּ֖וּ בְּ/מַֽעֲשֵׂי/הֶ֑ם מַֽעֲשֵׂי/הֶם֙ מַֽעֲשֵׂי אָ֔וֶן וּ/פֹ֥עַל חָמָ֖ס בְּ/כַפֵּי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/006.yaml
  text: Their webs will not become clothing[a], nor will they cover themselves with their deeds; their deeds are deeds of wickedness[b], and the work of violence is in their hands.
translation:
  language: hi
  text: उनके जाले वस्त्र न बनेंगे[a], और न वे अपने कामों से अपने को ढकेंगे; उनके काम दुष्टता के काम हैं[b], और हिंसा का काम उनके हाथों में है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके मकड़ी के जाले।” इब्रानी शब्द काती या बुनी हुई वस्तु को दर्शाता है; “जाले” रूपक को बनाए रखता है, पर उसे आवश्यकता से अधिक विशिष्ट नहीं करता।
    reason: lexical_alternative
  - marker: b
    text: या “उनके काम अधर्म के काम हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: קֽוּרֵיהֶם
  choice: उनके जाले
  rationale: यह शब्द काती या बुनी हुई वस्तु को दर्शाता है। पिछले पद के मकड़ी के जाले वाले संदर्भ से संबंध बनाए रखते हुए ‘जाले’ रूपक को स्वाभाविक ढंग से सुरक्षित रखता है, पर मूल से अधिक स्पष्ट नहीं करता।
- source_word: לְבֶגֶד
  choice: वस्त्र
  rationale: בגד का सामान्य अर्थ वस्त्र या पहनावा है। एकवचन भाववाचक प्रयोग को हिन्दी में ‘वस्त्र’ स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: יִתְכַּסּוּ
  choice: अपने को ढकेंगे
  rationale: हित्पएल रूप आत्मवाचक है; इसलिए ‘अपने को ढकेंगे’ व्याकरण और वस्त्र/आवरण के रूपक दोनों को बनाए रखता है।
- source_word: בְּמַעֲשֵׂיהֶם
  choice: अपने कामों से
  rationale: यहाँ ב साधन का बोध देता है। ‘कामों से’ स्पष्ट करता है कि उनके अपने कर्म ही आवरण का साधन नहीं बन सकते, बिना अनुवाद में अतिरिक्त व्याख्या जोड़े।
- source_word: מַעֲשֵׂיהֶם
  choice: उनके काम
  rationale: मूल में संज्ञा की पुनरावृत्ति बल देने के लिए है; हिन्दी में भी ‘काम’ दोहराकर यह आलंकारिक बल सुरक्षित रखा गया है।
- source_word: מַעֲשֵׂי אָוֶן
  choice: दुष्टता के काम
  rationale: אָוֶן अनर्थ, अधर्म या दुष्टता का अर्थ दे सकता है। नैतिक अभियोग के इस संदर्भ में ‘दुष्टता’ सहज आधुनिक हिन्दी में इसका नैतिक बल व्यक्त करता है।
- source_word: וּפֹעַל חָמָס
  choice: हिंसा का काम
  rationale: פֹעַל एकवचन में काम या कृत्य और חָמָס हिंसा या अन्याय को दर्शाता है। ‘हिंसा का काम’ मूल की एकवचन रचना और ठोस आरोप दोनों बनाए रखता है।
- source_word: בְּכַפֵּיהֶם
  choice: उनके हाथों में
  rationale: כף का शाब्दिक अर्थ हथेली है, पर हिन्दी में ‘हाथों में’ स्वाभाविक मुहावरा है और कर्तृत्व तथा दोष दोनों का संकेत बनाए रखता है।
- source_word: לֹא יִהְיוּ
  choice: न बनेंगे
  rationale: לְבֶגֶד के साथ यहाँ केवल अस्तित्व नहीं, परिणाम या उपयोग का भाव है; ‘वस्त्र न बनेंगे’ इसे सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अपर्याप्त आवरण के रूपक का अर्थ
  choice: जाले, वस्त्र और अपने को ढकने की ठोस छवि को बनाए रखा गया है और नैतिक आशय संदर्भ से उभरने दिया गया है।
  alternative: भावार्थ करके कहना कि वे अपने बुरे कामों से अपना दोष छिपा नहीं सकेंगे।
  rationale: मूल पाठ नैतिक अभियोग को भौतिक रूपक के द्वारा व्यक्त करता है। व्याख्यात्मक भावार्थ रूपक को पहले ही सुलझा देता और ‘दोष छिपाने’ जैसी बात जोड़ता, जो यहाँ प्रत्यक्ष रूप से नहीं कही गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक गद्य रखा गया है। ‘काम’ की पुनरावृत्ति मूल के बलाघात को बनाए रखती है; ‘हाथों में’ शाब्दिक ‘हथेलियों में’ की अपेक्षा अधिक स्वाभाविक है।
