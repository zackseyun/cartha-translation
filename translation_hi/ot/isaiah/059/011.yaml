source:
  edition: WLC
  text: נֶהֱמֶ֤ה כַ/דֻּבִּים֙ כֻּלָּ֔/נוּ וְ/כַ/יּוֹנִ֖ים הָגֹ֣ה נֶהְגֶּ֑ה נְקַוֶּ֤ה לַ/מִּשְׁפָּט֙ וָ/אַ֔יִן לִֽ/ישׁוּעָ֖ה רָחֲקָ֥ה מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/011.yaml
  text: We all growl like bears[a], and like doves we moan continually; we hope for justice, but there is none; for salvation[b], but it is far from us.
translation:
  language: hi
  text: 'हम सब भालुओं की तरह गुर्राते हैं,

    और कबूतरों की तरह कराहते ही रहते हैं;

    हम न्याय की आस लगाए हैं[a], पर न्याय कहीं नहीं;

    हम उद्धार[b] की आस लगाए हैं, पर वह हमसे दूर है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्याय की बाट जोहते हैं”; इब्रानी क्रिया में आशा करने और प्रतीक्षा करने, दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “छुटकारा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶהֱמֶה
  choice: गुर्राते हैं
  rationale: המה भालुओं के संदर्भ में भारी, गूँजती हुई पशु-ध्वनि व्यक्त करता है। ‘गुर्राते हैं’ आधुनिक हिन्दी में इस उपमा को स्वाभाविक रूप से बनाए रखता है।
- source_word: כַדֻּבִּים כֻּלָּנוּ
  choice: हम सब भालुओं की तरह
  rationale: כֻּלָּנוּ की सामूहिकता और כ की स्पष्ट उपमा दोनों सुरक्षित रखी गई हैं।
- source_word: וְכַיּוֹנִים הָגֹה נֶהְגֶּה
  choice: और कबूतरों की तरह कराहते ही रहते हैं
  rationale: ‘कराहते’ शोकपूर्ण ध्वनि को व्यक्त करता है; ‘ही रहते हैं’ infinitive absolute और finite verb के तीव्रतावाचक/निरंतर भाव को सहज हिन्दी में प्रकट करता है।
- source_word: נְקַוֶּה
  choice: आस लगाए हैं
  rationale: קוה में आशा करने और प्रतीक्षा करने, दोनों का भाव हो सकता है। ‘आस लगाए हैं’ हिन्दी में दोनों अर्थों को काफी हद तक साथ रखता है।
- source_word: לַמִּשְׁפָּט
  choice: न्याय
  rationale: यहाँ מִשְׁפָּט अपेक्षित न्यायपूर्ण व्यवस्था या न्यायोचित प्रतिफल को दर्शाता है, केवल अदालती निर्णय को नहीं।
- source_word: וָאַיִן
  choice: पर न्याय कहीं नहीं
  rationale: शाब्दिक ‘और नहीं है’ के पीछे निराश अपेक्षा का विरोधी भाव है; स्पष्टता के लिए हिन्दी में ‘न्याय’ दोहराया गया है।
- source_word: לִישׁוּעָה
  choice: उद्धार
  rationale: יְשׁוּעָה यहाँ संकट से बचाव या छुटकारे के साथ व्यापक धार्मिक अर्थ भी रखता है। ‘उद्धार’ हिन्दी बाइबलीय भाषा में दोनों आयामों को समेटता है।
- source_word: רָחֲקָה מִמֶּנּוּ
  choice: वह हमसे दूर है
  rationale: स्त्रीलिंग क्रिया का कर्ता ‘उद्धार’ है; हिन्दी में संदर्भसूचक ‘वह’ मूल कथन की संक्षिप्तता बनाए रखता है।
theological_decisions:
- issue: भविष्यद्वाणी के विलाप में יְשׁוּעָה का अर्थ
  choice: उद्धार
  alternative: छुटकारा
  rationale: ‘उद्धार’ यशायाह में इस शब्द की व्यापक धार्मिक प्रतिध्वनि बनाए रखता है, फिर भी प्रसंग में अपेक्षित ठोस बचाव को बाहर नहीं करता। पादटिप्पणी ‘छुटकारा’ की संभावित संकीर्ण अर्थछाया दर्ज करती है।
- issue: קוה में आशा और प्रतीक्षा का संबंध
  choice: आस लगाए हैं
  alternative: बाट जोहते हैं
  rationale: मूल क्रिया दोनों भावों की अनुमति देती है। मुख्य पाठ का मुहावरा उन्हें यथासंभव साथ रखता है, जबकि पादटिप्पणी वैकल्पिक अभिव्यक्ति स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक विलाप के अनुकूल रखी गई है। समानांतर पंक्तियाँ हिब्रू काव्य की संरचना को बनाए रखती हैं; ‘कराहते ही रहते हैं’ तीव्र और निरंतर शोक को स्वाभाविक हिन्दी में व्यक्त करता है।
