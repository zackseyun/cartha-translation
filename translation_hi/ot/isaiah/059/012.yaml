reference: Isaiah 59:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי רַבּ֤וּ פְשָׁעֵ֨י/נוּ֙ נֶגְדֶּ֔/ךָ וְ/חַטֹּאותֵ֖י/נוּ עָ֣נְתָה בָּ֑/נוּ כִּֽי פְשָׁעֵ֣י/נוּ אִתָּ֔/נוּ וַ/עֲוֺנֹתֵ֖י/נוּ יְדַֽעֲנֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/012.yaml
  text: For our transgressions are many before you[a], and our sins testify against us; for our transgressions are with us, and we know our iniquities.
translation:
  language: hi
  text: क्योंकि हमारे अपराध तेरे सामने बहुत हैं, और हमारे पाप हमारे विरुद्ध गवाही देते हैं[a]; क्योंकि हमारे अपराध हमारे साथ हैं, और हम अपने अधर्मों को जानते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप से, ‘हमारे विरुद्ध उत्तर देते हैं’; अथवा, ‘हमारे विरुद्ध साक्षी देते हैं।’
    reason: इब्रानी עָנְתָה בָּנוּ में ‘उत्तर देना’ का शाब्दिक अर्थ और संदर्भानुकूल न्यायिक ‘गवाही देना’ का अर्थ दोनों संभव हैं।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: רַבּוּ
  choice: बहुत हैं
  rationale: רבה यहाँ संख्या की अधिकता का परिणामसूचक भाव देता है; ‘बहुत हैं’ सहज और सटीक है।
- source_word: פְשָׁעֵינוּ
  choice: हमारे अपराध
  rationale: פשע में अधिकार के विरुद्ध विद्रोह या सीमा-उल्लंघन का भाव है; ‘अपराध’ सामान्य पाठक के लिए स्पष्ट रहते हुए इसकी नैतिक गंभीरता बनाए रखता है।
- source_word: נֶגְדֶּךָ
  choice: तेरे सामने
  rationale: נגד का मूल स्थानिक भाव ‘सामने’ या ‘दृष्टि में’ है। यह परमेश्वर के सम्मुख अपराधों की उपस्थिति को रखता है और अगले न्यायिक उपवाक्य से अनावश्यक समानता नहीं करता।
- source_word: וְחַטֹּאותֵינוּ
  choice: और हमारे पाप
  rationale: חטאת के लिए ‘पाप’ आधुनिक हिन्दी में स्वाभाविक और प्रचलित समतुल्य है।
- source_word: עָנְתָה בָּנוּ
  choice: हमारे विरुद्ध गवाही देते हैं
  rationale: ענה इस प्रयोग में ‘उत्तर देना’ से विकसित न्यायिक अर्थ ‘गवाही देना’ रखता है। בנו संदर्भ में प्रतिकूल गवाही का भाव देता है; हिन्दी में बहुवचन कर्ता के अनुसार क्रिया रखी गई है।
- source_word: פְשָׁעֵינוּ אִתָּנוּ
  choice: हमारे अपराध हमारे साथ हैं
  rationale: शाब्दिक निकटता बनाए रखते हुए यह अपराधों की निरंतर उपस्थित वास्तविकता व्यक्त करता है।
- source_word: וַעֲוֺנֹתֵינוּ
  choice: और अपने अधर्म के कामों को
  rationale: עון में टेढ़ेपन, दोष और अपराध—तीनों का भाव हो सकता है। ‘अधर्म के काम’ इसे ‘पाप’ और ‘अपराध’ से अलग रखते हुए साधारण आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: יְדַעֲנוּם
  choice: हम जानते हैं
  rationale: ידע का सीधा अर्थ ‘जानना’ है; कर्म-प्रत्यय का आशय पिछले संज्ञापद ‘अपने अधर्म के कामों को’ में व्यक्त है।
theological_decisions:
- issue: एक ही पद में पाप के लिए प्रयुक्त अनेक इब्रानी शब्द
  choice: פשע, חטאת और עון के लिए क्रमशः ‘अपराध’, ‘पाप’ और ‘अधर्म के काम’ रखे गए हैं।
  alternative: तीनों को केवल ‘पाप’ के रूप में अनूदित करना।
  rationale: मूल पाठ दोष के लिए तीन परस्पर संबंधित किन्तु भिन्न शब्दों को एकत्र करता है। भिन्न हिन्दी शब्द इस स्वीकारोक्ति की आलंकारिक और नैतिक गहनता को सुरक्षित रखते हैं।
- issue: עָנְתָה בָּנוּ का न्यायिक या आंतरिक अर्थ
  choice: ‘हमारे विरुद्ध गवाही देते हैं’
  alternative: ‘हमारे भीतर उत्तर देते हैं’ अथवा अधिक शाब्दिक ‘हमारे विरुद्ध उत्तर देते हैं’।
  rationale: संदर्भ सामूहिक दोष-स्वीकार का है और यह प्रयोग न्यायिक गवाही का अर्थ स्वाभाविक रूप से देता है; फिर भी अनुवाद किसी विशिष्ट दंड-सिद्धांत को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। परमेश्वर के लिए एकवचन निकट संबोधन ‘तेरे’ रखा गया है, जो इब्रानी के एकवचन प्रत्यय को दर्शाता है। मूल पाठ की पुनरुक्ति और तीन अलग पाप-संबंधी पदों को यथासंभव सुरक्षित रखा गया है।
