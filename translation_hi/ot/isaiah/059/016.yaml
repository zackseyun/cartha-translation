base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/016.yaml
  text: He saw that there was no man[a], and he was appalled that there was no one to intercede; so his own arm brought him salvation[c][b], and his righteousness upheld him.
translation:
  language: hi
  text: उसने देखा कि कोई पुरुष नहीं था[a], और वह यह देखकर स्तब्ध रह गया कि मध्यस्थता करने वाला कोई नहीं था[b]; तब उसकी अपनी भुजा ने उसे बचाया, और उसकी धार्मिकता ने उसे सहारा दिया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पुरुष’ के लिए इब्रानी में पुल्लिंग एकवचन शब्द है; यहाँ आशय यह है कि कोई मानवीय कर्ता उपस्थित नहीं था।
    reason: cultural_note
  - marker: b
    text: या ‘बीच में पड़ने वाला’ अथवा ‘विनती करने वाला’। इब्रानी कृदन्त किसी दूसरे की ओर से आगे आने वाले व्यक्ति को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘उसके न्याय ने उसे सहारा दिया।’ इब्रानी शब्द धार्मिकता और न्याय—दोनों का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: पुरुष
  rationale: इब्रानी शब्द पुल्लिंग एकवचन है। प्रसंग में इसका आशय किसी मानवीय कर्ता के न होने से है; मुख्य पाठ स्रोत का व्याकरणिक रूप बनाए रखता है और व्यापक आशय पाद-टिप्पणी में स्पष्ट करता है।
- source_word: וַיִּשְׁתּוֹמֵם
  choice: स्तब्ध रह गया
  rationale: यह क्रिया गहरे आश्चर्य, आघात और व्याकुलता का भाव व्यक्त करती है। ‘स्तब्ध रह गया’ आधुनिक हिन्दी में स्वाभाविक रहते हुए प्रसंग की नैतिक गंभीरता को बनाए रखता है।
- source_word: מַפְגִּיעַ
  choice: मध्यस्थता करने वाला
  rationale: פגע का हिफ़ील कृदन्त यहाँ किसी की ओर से बीच में पड़ने या विनती करने वाले व्यक्ति को सूचित करता है। यह अनुवाद उस प्रतिनिधिक भूमिका को स्पष्ट रखता है, जबकि अन्य सम्भव अर्थ पाद-टिप्पणी में दिए गए हैं।
- source_word: וַתּוֹשַׁע לֹו
  choice: उसके लिए उद्धार किया
  rationale: स्त्रीलिंग क्रिया ‘भुजा’ से मेल खाती है और उद्धार सिद्ध करने का भाव देती है। ‘उसके लिए उद्धार किया’ לֹו की हितार्थक अभिव्यक्ति और परमेश्वर की स्वयं आरम्भ की हुई कार्रवाई को बनाए रखता है।
- source_word: זְרֹעוֹ
  choice: उसकी अपनी भुजा
  rationale: '‘भुजा’ सामर्थ्य और निर्णायक कार्य का इब्रानी रूपक है। ‘अपनी’ प्रसंगगत बल को व्यक्त करता है: कोई मानवीय कर्ता न मिलने पर उसी की सामर्थ्य ने कार्य किया।'
- source_word: צִדְקָתוֹ
  choice: उसकी धार्मिकता
  rationale: צדקה में धार्मिकता और न्याय—दोनों की अर्थ-छाया हो सकती है। मुख्य पाठ में व्यापक और प्रचलित ‘धार्मिकता’ रखा गया है; ‘न्याय’ को पाद-टिप्पणी में सुरक्षित किया गया है।
- source_word: סְמָכָתְהוּ
  choice: उसे संभाला
  rationale: क्रिया का अर्थ सहारा देना, थामे रखना या टिकाए रखना है। ‘संभाला’ आधुनिक हिन्दी में स्वाभाविक है और सहायक सामर्थ्य की मूल छवि बनाए रखता है।
theological_decisions:
- issue: सर्वनामों का सन्दर्भ
  choice: सभी सर्वनाम यहोवा की ओर संकेत करते हैं; कोई मानवीय मध्यस्थ न मिलने पर वही स्वयं उद्धार का कार्य करता है।
  alternative: अन्तिम उपवाक्यों को अधिक अमूर्त ढंग से भी समझा जा सकता है—मानो दैवी सामर्थ्य और धार्मिकता कार्यरत हों, बिना आत्म-सन्दर्भ पर विशेष बल दिए।
  rationale: निकटवर्ती प्रसंग और इब्रानी प्रत्यय एक ही कर्ता, यहोवा, की ओर संकेत करते हैं। अनुवाद इस तनाव को बनाए रखता है कि उसकी अपनी भुजा ‘उसके लिए’ उद्धार करती है, और इसे किसी बाद की सिद्धान्तगत श्रेणी से नहीं समझाता।
- issue: צדקה का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: इस प्रसंग में शब्द परमेश्वर की नैतिक सच्चाई और न्यायपूर्ण कार्रवाई दोनों को समेट सकता है। मुख्य पाठ में ‘धार्मिकता’ रखा गया है और वैकल्पिक अर्थ ‘न्याय’ पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘भुजा’ का बाइबलीय रूपक ज्यों का त्यों रखा गया है; अत्यधिक संस्कृतनिष्ठ या सम्प्रदाय-विशिष्ट शब्दावली से बचा गया है।
