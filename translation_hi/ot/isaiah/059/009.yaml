source:
  edition: WLC
  text: עַל כֵּ֗ן רָחַ֤ק מִשְׁפָּט֙ מִמֶּ֔/נּוּ וְ/לֹ֥א תַשִּׂיגֵ֖/נוּ צְדָקָ֑ה נְקַוֶּ֤ה לָ/אוֹר֙ וְ/הִנֵּה חֹ֔שֶׁךְ לִ/נְגֹה֖וֹת בָּ/אֲפֵל֥וֹת נְהַלֵּֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/009.yaml
  text: Therefore justice is far from us[a], and righteousness does not overtake us; we hope for light, but look—darkness; for brightness[c][b], but we walk in deep gloom.
translation:
  language: hi
  text: इसलिए न्याय हमसे दूर है[a], और धार्मिकता हम तक नहीं पहुँचती[b]। हम उजियाले की आशा करते हैं, पर देखो—अंधकार है; प्रकाश की आशा करते हैं[c], पर हम घोर अंधकार में चलते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्णय हमसे दूर है।”
    reason: lexical_alternative
  - marker: b
    text: या, “धार्मिकता हमें नहीं पकड़ती।”
    reason: lexical_alternative
  - marker: c
    text: या, “दीप्ति की आशा करते हैं, पर हम घने अंधेरे में चलते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: यहाँ सामाजिक और न्यायिक उचित व्यवस्था का भाव है; ‘न्याय’ आधुनिक हिन्दी में स्वाभाविक है और समानांतर צְדָקָה से भेद बनाए रखता है।
- source_word: רָחַק
  choice: दूर है
  rationale: पूर्ण क्रिया से उत्पन्न वर्तमान दशा व्यक्त होती है; ‘दूर है’ इसे संक्षिप्त और स्वाभाविक ढंग से बताता है।
- source_word: צְדָקָה
  choice: धार्मिकता
  rationale: מִשְׁפָּט के ‘न्याय’ से अलग शब्द रखकर इब्रानी समानांतरता और नैतिक ठीकपन का भाव सुरक्षित रहता है।
- source_word: תַשִּׂיגֵנוּ
  choice: हमें आ नहीं पकड़ती
  rationale: נשׂג के हिफ़ील रूप में पीछा करके पकड़ लेने या जा मिलने का सजीव बिंब है; यह हिन्दी वाक्य उस गति-बिंब को बनाए रखता है।
- source_word: נְקַוֶּה
  choice: हम ... की आशा करते हैं
  rationale: קוה में प्रतीक्षा और आशा दोनों निहित हैं; विलाप के प्रसंग में ‘आशा करते हैं’ आकांक्षापूर्ण अपेक्षा को स्पष्ट करता है।
- source_word: אוֹר
  choice: उजियाला
  rationale: यह प्रकाश का सीधा और काव्यात्मक रूप से स्वाभाविक हिन्दी पर्याय है, जिसमें उद्धार और कुशलता का रूपक भी बना रहता है।
- source_word: וְהִנֵּה
  choice: पर देखो
  rationale: הִנֵּה अपेक्षा और वास्तविकता के बीच अचानक, ध्यान खींचने वाला विरोध प्रकट करता है; ‘पर देखो’ आधुनिक और सजीव है।
- source_word: חֹשֶׁךְ
  choice: अंधकार
  rationale: शाब्दिक अनुवाद दृश्य बिंब तथा संकट के रूपक, दोनों को सुरक्षित रखता है।
- source_word: נְגֹהוֹת
  choice: प्रकाश
  rationale: बहुवचन संज्ञा चमक या दीप्ति का भाव देती है; हिन्दी में ‘प्रकाश’ सहज है और पहले ‘उजियाले’ के साथ काव्यात्मक समानांतरता रखता है।
- source_word: אֲפֵלוֹת
  choice: घोर अंधकार
  rationale: यह सामान्य अंधेरे से अधिक सघन अंधकार सूचित करता है; ‘घोर अंधकार’ उसके भौतिक और भावात्मक भार को व्यक्त करता है।
- source_word: נְהַלֵּךְ
  choice: हम ... चलते हैं
  rationale: शाब्दिक ‘चलते हैं’ जीवन की अनुभूत दशा या मार्ग के इब्रानी रूपक को बनाए रखता है।
theological_decisions:
- issue: מִשְׁפָּט और צְדָקָה का परस्पर संबंध
  choice: क्रमशः ‘न्याय’ और ‘धार्मिकता’
  alternative: ‘निर्णय’ और ‘न्याय’, अथवा दोनों के लिए ‘न्याय’
  rationale: दो अलग शब्द रखने से सामाजिक-न्यायिक उचितता और नैतिक सहीपन के निकट किंतु भिन्न भाव सुरक्षित रहते हैं; किसी एक धर्मसिद्धान्तीय अर्थ को जबरन नहीं थोपा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य काव्यात्मक गद्य। ‘पर देखो—’ मूल के आकस्मिक विरोध को बनाए रखता है; ‘आ नहीं पकड़ती’ क्रिया के गतिशील बिंब को सुरक्षित रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
