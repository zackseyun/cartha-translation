source:
  edition: WLC
  text: פָּשֹׁ֤עַ וְ/כַחֵשׁ֙ בַּֽ/יהוָ֔ה וְ/נָס֖וֹג מֵ/אַחַ֣ר אֱלֹהֵ֑י/נוּ דַּבֶּר עֹ֣שֶׁק וְ/סָרָ֔ה הֹר֧וֹ וְ/הֹג֛וֹ מִ/לֵּ֖ב דִּבְרֵי שָֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/013.yaml
  text: transgressing and denying Yahweh[a], and turning back from following our God, speaking oppression and revolt[b], conceiving and uttering from the heart words of falsehood.
translation:
  language: hi
  text: याहवे के विरुद्ध अपराध करना और उससे मुकरना, अपने परमेश्वर के पीछे चलने से मुड़ जाना, अत्याचार और विद्रोह की बातें कहना[a], और मन से झूठी बातें गढ़ना और बोलना[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विद्रोह’ का अनुवाद ‘बगावत’ या, इस धार्मिक संदर्भ में, ‘धर्मत्याग’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘हृदय से’; अर्थात ये झूठी बातें केवल बाहरी वचन नहीं, बल्कि भीतर के विचार और इरादे से निकलती हैं।
    reason: cultural_note
lexical_decisions:
- source_word: פָּשֹׁעַ
  choice: अपराध करना
  rationale: यह रूप सक्रिय रूप से मर्यादा तोड़ने और विद्रोह करने का भाव रखता है। ‘अपराध करना’ नैतिक उल्लंघन को स्पष्ट रखता है, पर इसे केवल राजनीतिक विद्रोह तक सीमित नहीं करता।
- source_word: וְכַחֵשׁ בַּיהוָה
  choice: याहवे के विरुद्ध ... उससे मुकरना
  rationale: כחש में झूठ बोलने, विश्वासघात करने या नकारने का भाव हो सकता है। ‘उससे मुकरना’ वाचा-संबंधी अस्वीकृति को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘के विरुद्ध’ इब्रानी ב की प्रतिकूल दिशा को बनाए रखता है।
- source_word: בַּיהוָה
  choice: याहवे
  rationale: יהוה परमेश्वर का विशिष्ट वाचा-नाम है; लिप्यंतरण इसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- source_word: וְנָסוֹג מֵאַחַר אֱלֹהֵינוּ
  choice: अपने परमेश्वर के पीछे चलने से मुड़ जाना
  rationale: מֵאַחַר का शाब्दिक चित्र ‘पीछे से’ है, पर मुहावरे में इसका अर्थ किसी का अनुसरण छोड़ देना है। यह अनुवाद उस चित्र और आशय दोनों को रखता है।
- source_word: עֹשֶׁק
  choice: अत्याचार
  rationale: यह शब्द दमन, शोषण और अन्यायपूर्ण लाभ को सूचित कर सकता है। ‘अत्याचार’ हिन्दी में पर्याप्त व्यापक और सहज है।
- source_word: וְסָרָה
  choice: विद्रोह
  rationale: संज्ञा का अर्थ भटकाव, बगावत या धर्मत्याग हो सकता है। ‘विद्रोह’ गंभीर अवज्ञा को व्यक्त करता है, पर अपेक्षाकृत संकीर्ण धार्मिक शब्दावली नहीं थोपता।
- source_word: הֹרוֹ וְהֹגוֹ
  choice: गढ़ना और बोलना
  rationale: दोनों क्रियाएँ भीतर विचार के जन्म लेने और फिर उसके मुख से प्रकट होने की क्रमिक गति दिखाती हैं। ‘गढ़ना और बोलना’ आधुनिक हिन्दी में स्वाभाविक रूप से यह क्रम व्यक्त करता है।
- source_word: מִלֵּב
  choice: मन से
  rationale: इब्रानी में ‘हृदय से’ भीतर के विचार और इरादे के स्रोत को दर्शाता है। आधुनिक हिन्दी में ‘मन से’ वही अर्थ अधिक स्वाभाविक ढंग से देता है।
- source_word: דִּבְרֵי שָׁקֶר
  choice: झूठी बातें
  rationale: यह पदबंध छल और असत्य से भरे कथनों को दर्शाता है। ‘झूठी बातें’ स्पष्ट, सहज और अर्थनिष्ठ है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में विशिष्ट दिव्य नाम है। ‘याहवे’ उसका नामरूप सुरक्षित रखता है और उसे किसी सामान्य उपाधि से प्रतिस्थापित नहीं करता।
- issue: וְסָרָה को स्पष्टतः धार्मिक शब्द के रूप में प्रस्तुत करना
  choice: विद्रोह
  alternative: धर्मत्याग; बगावत
  rationale: संदर्भ परमेश्वर के प्रति विश्वासघात का है, फिर भी शब्द अपने आप में व्यापक विद्रोह या भटकाव दर्शा सकता है। ‘विद्रोह’ धार्मिक गंभीरता को बनाए रखते हुए अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- issue: כחש ביהוה की अर्थ-सीमा
  choice: याहवे के विरुद्ध ... उससे मुकरना
  alternative: याहवे से विश्वासघात करना; याहवे के विरुद्ध झूठ बोलना
  rationale: क्रिया में नकारने, झूठा व्यवहार करने और विश्वासघात करने के परस्पर जुड़े अर्थ हैं। ‘मुकरना’ इस अस्पष्टता के मुख्य केंद्र—संबंध को नकारना—को सहज हिन्दी में सामने लाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर किंतु सामान्य पाठक के लिए सहज रखी गई है। समानांतर क्रियात्मक संरचना मूल पद की स्वीकारोक्तिपरक सूची को बनाए रखती है। ‘मन’ को मुख्य पाठ में स्वाभाविक हिन्दी के लिए चुना गया है और ‘हृदय’ का शाब्दिक रूप पादटिप्पणी में दिया गया है।
