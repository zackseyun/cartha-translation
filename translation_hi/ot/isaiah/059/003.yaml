  text: כִּ֤י כַפֵּי/כֶם֙ נְגֹאֲל֣וּ בַ/דָּ֔ם וְ/אֶצְבְּעוֹתֵי/כֶ֖ם בֶּֽ/עָוֺ֑ן שִׂפְתֽוֹתֵי/כֶם֙ דִּבְּרוּ שֶׁ֔קֶר לְשׁוֹנְ/כֶ֖ם עַוְלָ֥ה תֶהְגֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/003.yaml
  text: For your hands are defiled with blood[a], and your fingers with iniquity; your lips have spoken falsehood[c][b], your tongue mutters injustice.
translation:
  language: hi
  text: क्योंकि तुम्हारी हथेलियाँ खून से अशुद्ध हो गई हैं[a], और तुम्हारी उँगलियाँ अधर्म से; तुम्हारे होंठों ने झूठ बोला है, तुम्हारी जीभ अन्याय बुदबुदाती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारे हाथ’; इब्रानी शब्द अधिक विशेष रूप से हथेलियों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अन्याय बोलती है।’ इब्रानी क्रिया का अर्थ ‘बुदबुदाना,’ ‘धीमे स्वर में कहना,’ या अधिक सामान्य रूप से ‘बोलना’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण प्रस्तुत करता है; ‘क्योंकि’ इसके कारणसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כַפֵּיכֶם
  choice: तुम्हारी हथेलियाँ
  rationale: כַּף हाथ की हथेली या भीतरी भाग को अधिक विशिष्ट रूप से दर्शाता है; इससे खून लगे होने का मूर्त बिंब सुरक्षित रहता है।
- source_word: נְגֹאֲלוּ
  choice: अशुद्ध हो गई हैं
  rationale: यहाँ क्रिया प्रदूषित या अपवित्र होने का भाव देती है, केवल रंग लग जाने का नहीं; हिन्दी में यह नैतिक दूषण और ठोस बिंब दोनों को व्यक्त करती है।
- source_word: בַדָּם
  choice: खून से
  rationale: पूर्वसर्ग दूषण के पदार्थ या साधन को बताता है; ‘खून से’ स्वाभाविक है और रक्तपात के दोष का संकेत बनाए रखता है।
- source_word: וְאֶצְבְּעוֹתֵיכֶם
  choice: और तुम्हारी उँगलियाँ
  rationale: मूल की देह-अंग वाली समानांतर काव्यात्मक छवि को सीधे बनाए रखता है।
- source_word: בֶּעָוֹן
  choice: अधर्म से
  rationale: עָוֹן में अधर्म, दोष और अपराध का अर्थक्षेत्र है; यहाँ यह खून के समानांतर नैतिक विकृति को दर्शाता है।
- source_word: שִׂפְתוֹתֵיכֶם דִּבְּרוּ שֶׁקֶר
  choice: तुम्हारे होंठों ने झूठ बोला है
  rationale: ‘होंठ’ की मूल छवि और पूर्ण क्रिया का आरोपात्मक भाव सुरक्षित है; ‘झूठ’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: לְשׁוֹנְכֶם
  choice: तुम्हारी जीभ
  rationale: वाणी के अंग का मानवीकरण और पंक्ति का काव्यात्मक समानांतरपन बनाए रखता है।
- source_word: עַוְלָה
  choice: अन्याय
  rationale: यह शब्द अन्याय, गलत आचरण या कुटिलता का बोध देता है; यशायाह 59 के सामाजिक-नैतिक संदर्भ में ‘अन्याय’ उपयुक्त है।
- source_word: תֶהְגֶּה
  choice: बुदबुदाती है
  rationale: הגה धीमे स्वर में बोलने, बुदबुदाने या उच्चारण करने का अर्थ दे सकती है; ‘बुदबुदाती है’ ठोस वाचिक बिंब को बचाता है।
theological_decisions:
- issue: भविष्यद्वाणी के नैतिक आरोपों की अलग-अलग शब्दावली
  choice: ‘खून,’ ‘अधर्म,’ ‘झूठ’ और ‘अन्याय’ को अलग शब्दों के रूप में बनाए रखना
  alternative: सभी पदों को सामान्यतः ‘बुराई’ या ‘गलत काम’ के रूप में व्यक्त करना
  rationale: मूल पद रक्तपात, नैतिक दोष, असत्य और सामाजिक अन्याय के परस्पर संबंधित किंतु भिन्न पहलुओं को एकत्र करता है; उन्हें अलग रखने से आरोप की परतें और न्यायिक-नैतिक तनाव सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और काव्यात्मक शैली रखी गई है। ‘हथेलियाँ’ और ‘बुदबुदाती’ मूल की ठोस देह-अंग तथा ध्वनि-छवियों को सुरक्षित रखते हैं; ‘अधर्म’ भविष्यद्वाणी के नैतिक भार के अनुरूप है।
