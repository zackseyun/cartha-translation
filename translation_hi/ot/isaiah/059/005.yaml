base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/005.yaml
  text: They hatch viper's eggs and weave spider's webs[a]; whoever eats from their eggs dies[b], and what is crushed breaks open into a viper.
translation:
  language: hi
  text: वे विषैले साँप के अंडे सेते हैं और मकड़ी के जाले बुनते हैं।[a] जो उनके अंडों में से खाता है, वह मर जाता है; और जो कुचला जाता है, वह फूटता है और उसमें से एक विषधर साँप निकलता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विषैले साँप’ के लिए ‘विषधर’ या किसी विशेष जहरीले साँप का नाम भी सम्भव है; इब्रानी शब्द किसी जहरीले साँप को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में यह पंक्ति बहुत संक्षिप्त है: लगभग, ‘और जो कुचला जाता है, वह फूटता है—एक विषधर [साँप]।’ ‘जो कुचला जाता है’ का अर्थ कठिन है; तत्काल संदर्भ के आधार पर इसे अंडा समझा जाता है। आशय है कि अंडा कुचलने पर भी उसमें से एक विषैला साँप निकलता है।'
    reason: source_clarity
lexical_decisions:
- source_word: בֵּיצֵי צִפְעוֹנִי
  choice: विषैले साँप के अंडे
  rationale: यह संबंधवाचक पद एक विषधर साँप के अंडों को दर्शाता है। ‘विषैले साँप’ सामान्य आधुनिक हिन्दी में स्पष्ट है और किसी एक अनिश्चित प्रजाति का नाम थोपने से बचता है।
- source_word: בִּקֵּעוּ
  choice: सेते हैं
  rationale: क्रिया का मूल बोध ‘फाड़ना/फूटने देना’ है, पर अंडों के संदर्भ में आशय उनसे बच्चे निकलवाना है। हिन्दी में ‘अंडे सेते हैं’ इस चित्र को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: קוּרֵי עַכָּבִישׁ
  choice: मकड़ी के जाले
  rationale: यह पद मकड़ी द्वारा बनाए गए धागों या जालों को दर्शाता है; ‘मकड़ी के जाले’ सहज और स्पष्ट हिन्दी है।
- source_word: יֶאֱרֹגוּ
  choice: बुनते हैं
  rationale: इब्रानी क्रिया का सामान्य अर्थ ‘बुनना’ है। यह मकड़ी के जाल के चित्र और मनुष्यों के सोचे-समझे दुष्कर्म—दोनों को बनाए रखता है।
- source_word: הָאֹכֵל מִבֵּיצֵיהֶם
  choice: जो उनके अंडों में से खाता है
  rationale: संज्ञीकृत कृदन्त सामान्य रूप से किसी भी खाने वाले व्यक्ति को बताता है, और ‘में से’ מִן उपसर्ग को प्रतिबिंबित करता है।
- source_word: יָמוּת
  choice: मर जाता है
  rationale: यहाँ वर्तमानकालीन रूप कथन की नीतिवचन-सदृश निश्चितता और सजीवता व्यक्त करता है।
- source_word: וְהַזּוּרֶה
  choice: और जो अंडा कुचला जाता है
  rationale: दुर्बोध रूप को संदर्भ के अनुसार ‘कुचला/दबाया गया’ समझा गया है। हिन्दी में ‘अंडा’ स्पष्ट करना आवश्यक संदर्भगत पूर्ति है और नए अर्थ का आयात नहीं करता।
- source_word: תִּבָּקַע אֶפְעֶה
  choice: वह फूटता है और उसमें से एक विषधर साँप निकलता है
  rationale: शाब्दिक संरचना अत्यंत संक्षिप्त है। यह रूप अंडे के फूटने और विषधर के निकलने के दृश्य को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: אֶפְעֶה
  choice: विषधर साँप
  rationale: यह किसी जहरीले साँप का नाम है, पर सटीक प्रजाति अनिश्चित है। ‘विषधर साँप’ खतरे के बोध को रखता है और अनुचित प्रजातिगत निश्चितता से बचता है।
