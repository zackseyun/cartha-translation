base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/007.yaml
  text: Their feet run to evil[a], and they hurry to shed innocent blood; their thoughts are thoughts of iniquity[b]; devastation and destruction are in their highways.
translation:
  language: hi
  text: उनके पाँव बुराई की ओर दौड़ते हैं, और वे निर्दोष का खून बहाने में जल्दी करते हैं; उनके विचार दुष्टता के विचार हैं[a]; तबाही और विनाश उनके राजमार्गों पर हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी योजनाएँ दुष्टता की योजनाएँ हैं”; इब्रानी शब्द का अर्थ विचार, योजनाएँ या षड्यंत्र हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उनके रास्तों पर”; इब्रानी शब्द का शाब्दिक अर्थ सड़क या राजमार्ग है और यहाँ यह उनके आचरण के मार्ग की ओर भी संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵיהֶם
  choice: उनके पाँव
  rationale: मूल का सजीव शारीरिक बिंब रखा गया है; प्रसंग में यह उनके आचरण की ओर भी संकेत करता है।
- source_word: לָרַע יָרֻצוּ
  choice: बुराई की ओर दौड़ते हैं
  rationale: दिशा और तीव्र गति दोनों को बिना ‘बुराई करने’ जैसा व्याख्यात्मक विस्तार जोड़े व्यक्त करता है।
- source_word: וִימַהֲרוּ
  choice: और वे ... उतावले होते हैं
  rationale: यह स्वाभाविक आधुनिक हिन्दी में शीघ्रता के साथ उनकी तत्परता भी व्यक्त करता है।
- source_word: לִשְׁפֹּךְ דָּם נָקִי
  choice: निर्दोष का खून बहाने के लिए
  rationale: हिंसक हत्या के मूल इब्रानी मुहावरे का हिन्दी में प्रचलित और स्पष्ट समतुल्य है।
- source_word: מַחְשְׁבוֹתֵיהֶם מַחְשְׁבוֹת אָוֶן
  choice: उनके विचार दुष्टता के विचार हैं
  rationale: מַחְשְׁבוֹת की काव्यात्मक पुनरावृत्ति सुरक्षित रखी गई है और אָוֶן के नैतिक अर्थ को ‘दुष्टता’ से व्यक्त किया गया है।
- source_word: שֹׁד וָשֶׁבֶר
  choice: उजाड़ और विनाश
  rationale: निकटार्थी विनाशकारी शब्दों की काव्यात्मक जोड़ी को दो अलग संज्ञाओं से बनाए रखा गया है।
- source_word: בִּמְסִלּוֹתָם
  choice: उनके राजमार्गों पर
  rationale: מְסִלָּה के ठोस सड़क/राजमार्ग बिंब को बनाए रखते हुए उनके जीवन-आचरण के मार्ग का निहित संकेत खुला रखा गया है।
theological_decisions:
- issue: אָוֶן का नैतिक स्वर
  choice: दुष्टता
  alternative: अनर्थ / अधर्म
  rationale: इस प्रसंग में दोषपूर्ण मनसा और हिंसक आचरण का नैतिक अभियोग प्रमुख है। ‘दुष्टता’ स्पष्ट है और किसी विशेष सांप्रदायिक अर्थ को नहीं जोड़ता।
- issue: मַחְשְׁבוֹת का अर्थ-क्षेत्र
  choice: विचार
  alternative: योजनाएँ / षड्यंत्र
  rationale: ‘विचार’ मूल की पुनरावृत्ति और व्यापक मानसिक अर्थ को सुरक्षित रखता है; योजनाओं का अर्थ सम्भव होने के कारण उसे पादटिप्पणी में दिया गया है।
- issue: מְסִלּוֹת का ठोस और रूपक अर्थ
  choice: राजमार्ग
  alternative: रास्ते / जीवन-मार्ग
  rationale: ठोस मार्ग-बिंब को प्राथमिकता दी गई है, जबकि आचरण के मार्ग का रूपकात्मक संकेत अनिर्णीत और उपलब्ध रहता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। ‘पाँव’, ‘खून’ और ‘राजमार्ग’ मूल के ठोस बिंबों को बनाए रखते हैं; काव्यात्मक पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है।
