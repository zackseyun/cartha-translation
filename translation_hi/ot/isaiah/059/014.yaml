base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/014.yaml
  text: Justice is turned back[a], and righteousness stands far off; for truth has stumbled in the street[b], and uprightness cannot enter.
translation:
  language: hi
  text: न्याय पीछे हटा दिया गया है, और धार्मिकता दूर खड़ी है; क्योंकि सच्चाई सार्वजनिक चौक में ठोकर खा गई है[a], और खराई भीतर नहीं आ सकती[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सच्चाई सार्वजनिक चौक में ठोकर खाकर गिर पड़ी है।”
    reason: כָשְׁלָה ठोकर खाने, लड़खड़ाने या गिर पड़ने के अर्थ दे सकता है; मुख्य पाठ कम प्रबल ‘ठोकर खाने’ का अर्थ रखता है।
  - marker: b
    text: या, “जो सही है वह भीतर नहीं आ सकता।”
    reason: נְכֹחָה का अर्थ ‘खराई’ या अधिक व्याख्यात्मक रूप में ‘जो सही है’ हो सकता है।
lexical_decisions:
- source_word: וְהֻסַּג אָחוֹר
  choice: पीछे हटा दिया गया है
  rationale: हुफ़अल रूप का कर्मवाच्य भाव सुरक्षित रहता है और न्याय को बलपूर्वक पीछे किए जाने का सजीव चित्र उभरता है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: इस भविष्यद्वक्तीय सामाजिक संदर्भ में यह सार्वजनिक और सामाजिक न्याय को सूचित करता है।
- source_word: צְדָקָה
  choice: धार्मिकता
  rationale: मִשְׁפָּט से निकट संबंध रखते हुए भी अलग नैतिक गुण का संकेत देने के लिए प्रचलित हिंदी शब्द चुना गया है।
- source_word: מֵרָחוֹק תַּעֲמֹד
  choice: दूर खड़ी है
  rationale: मूल के मानवीकरण और दूरी के दृश्य को संक्षिप्त, स्वाभाविक हिंदी में बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले कथन की परिस्थिति का कारण बताने वाला संबंध स्पष्ट करता है।
- source_word: כָשְׁלָה
  choice: ठोकर खाकर गिर पड़ी है
  rationale: כשל ठोकर खाने या लड़खड़ाकर गिरने का अर्थ दे सकता है; यह प्रयोग रूपक को स्वाभाविक हिंदी में स्पष्ट करता है, जबकि पादटिप्पणी कम प्रबल विकल्प सुरक्षित रखती है।
- source_word: בָרְחוֹב
  choice: सार्वजनिक चौक में
  rationale: רְחוֹב नगर के खुले सार्वजनिक स्थान या चौक को सूचित कर सकता है; संदर्भ में न्याय के सार्वजनिक क्षेत्र पर बल है।
- source_word: אֱמֶת
  choice: सच्चाई
  rationale: सामाजिक भ्रष्टता के इस प्रसंग में सार्वजनिक सत्यनिष्ठा और सत्य की मानवीकृत धारणा को सहज हिंदी में व्यक्त करता है।
- source_word: נְכֹחָה
  choice: खराई
  rationale: यह सीधाई, ईमानदारी और जो सही है उसके भाव को एक अमूर्त, मानवीकृत संज्ञा के रूप में व्यक्त करता है।
- source_word: לֹא תוּכַל לָבוֹא
  choice: भीतर नहीं आ सकती
  rationale: प्रवेश से रोके जाने की मूल छवि को स्पष्ट और स्वाभाविक रूप से सुरक्षित रखता है।
theological_decisions:
- issue: מִשְׁפָּט और צְדָקָה की जोड़ी
  choice: न्याय ... धार्मिकता
  alternative: न्याय ... न्यायपरायणता; फैसला ... धार्मिकता
  rationale: दोनों संबंधित वाचा-सामाजिक सद्गुण हैं, पर समानार्थी नहीं। अलग हिंदी शब्द मूल समानांतरता में मौजूद भेद बनाए रखते हैं।
- issue: נְכֹחָה का मानवीकरण
  choice: खराई
  alternative: जो सही है
  rationale: अमूर्त संज्ञा चुनने से न्याय, धार्मिकता और सच्चाई के साथ चल रहा मानवीकरण बना रहता है; अधिक व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। न्याय-संबंधी अमूर्त गुणों के मानवीकरण और सार्वजनिक स्थान की नागरिक छवि को बनाए रखा गया है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
