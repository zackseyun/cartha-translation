review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the verse’s judicial setting, the reliance/speaking participial sequence, and the conception-and-birth metaphor. However, ‘धार्मिकता’ can predominantly suggest personal religiosity in current Hindi, whereas צֶדֶק here has a prominent public moral-juridical sense. ‘न्याय’ is clearer in the main text, with a footnote preserving the broader ‘धार्मिकता’ alternative. ‘अनर्थ’ better conveys עָמָל as harmful mischief/trouble than the somewhat elevated and broad ‘अनिष्ट’.
  naturalness: ‘न्याय की गुहार लगाना’ is a more idiomatic modern Hindi rendering than ‘धार्मिकता की दुहाई देना.’ Adding ‘को’ and ‘में’ in the pregnancy image makes the syntax natural while retaining the metaphor. ‘सत्यनिष्ठा से’ naturally represents the integrity/reliability sense of אֱמוּנָה.
  terminology: Use ‘न्याय’ in the text for צֶדֶק in this forensic context, while noting ‘धार्मिकता’ as an alternative. ‘सत्यनिष्ठा’ retains the breadth of אֱמוּנָה better than ‘सच्चाई’, which can sound limited to factual truth. ‘अधर्म’ is an appropriate modern Hindi equivalent for אָוֶן and preserves the moral force without doctrinal narrowing.
  issues:
  - severity: medium
    issue: ‘धार्मिकता की दुहाई’ is potentially misleading and less idiomatic in this context.
    rationale: In modern Hindi, ‘धार्मिकता’ often evokes piety or religiosity. The Hebrew צֶדֶק retains broader moral-juridical force, and the immediate context is legal-social corruption. ‘न्याय की गुहार’ communicates the primary contextual sense clearly.
  - severity: low
    issue: ‘अनिष्ट का गर्भ धारण करते’ is syntactically compressed and ‘अनिष्ट’ is broader than the Hebrew contextual force.
    rationale: ‘अनर्थ को गर्भ में धारण करते हैं’ is natural Hindi and conveys עָמָל as harmful trouble or mischief while maintaining the pregnancy metaphor.
