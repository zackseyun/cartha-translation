  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֵין קֹרֵ֣א בְ/צֶ֔דֶק וְ/אֵ֥ין נִשְׁפָּ֖ט בֶּ/אֱמוּנָ֑ה בָּט֤וֹחַ עַל תֹּ֨הוּ֙ וְ/דַבֶּר שָׁ֔וְא הָר֥וֹ עָמָ֖ל וְ/הוֹלֵ֥יד אָֽוֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/004.yaml
  text: No one calls for righteousness[a], and no one pleads with faithfulness; trusting in emptiness and speaking falsehood[d][c][b], they conceive trouble and give birth to wickedness.
translation:
  language: hi
  text: कोई भी न्याय की गुहार नहीं लगाता[a], और कोई सत्यनिष्ठा से मुकदमा नहीं लड़ता[b]; निरर्थकता पर भरोसा रखकर[c] और झूठ बोलते हुए, वे अनर्थ को गर्भ में धारण करते हैं और अधर्म को जन्म देते हैं[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धार्मिकता के लिए पुकारता नहीं।”
    reason: lexical_alternative
  - marker: b
    text: या, “सत्य के साथ न्याय-विवाद में नहीं उतरता” अथवा “ईमानदारी से मुकदमा नहीं लड़ता।”
    reason: lexical_alternative
  - marker: c
    text: “निरर्थकता” का अनुवाद “खोखलापन” या “व्यर्थता” भी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: या, “दुष्टता को जन्म देते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵא בְצֶדֶק
  choice: धार्मिकता की दुहाई देता
  rationale: न्यायिक संदर्भ में यह अभिव्यक्ति सही और धर्मसंगत बात के पक्ष में पुकारने का भाव देती है। ‘धार्मिकता’ नैतिक और न्यायिक—दोनों आयामों को बनाए रखती है; ‘दुहाई देना’ आधुनिक हिन्दी में अपील करने का स्वाभाविक मुहावरा है।
- source_word: נִשְׁפָּט בֶּאֱמוּנָה
  choice: सच्चाई से मुकदमा लड़ता
  rationale: निफ़अल रूप को यहाँ न्यायिक विवाद में भाग लेने के अर्थ में समझा गया है। ‘सच्चाई से’ אֱמוּנָה की सत्यनिष्ठा, विश्वसनीयता और ईमानदारी के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: בָּטוֹחַ עַל תֹּהוּ
  choice: व्यर्थता पर भरोसा रखकर
  rationale: בטח का अर्थ भरोसा रखना है, जबकि תֹהוּ यहाँ खोखलेपन, निष्फलता या अवास्तविकता का बोध कराता है। ‘व्यर्थता’ इस व्यापकता को संक्षेप और स्वाभाविक ढंग से रखती है।
- source_word: וְדַבֶּר שָׁוְא
  choice: और झूठ बोलकर
  rationale: שָׁוְא झूठ, छल या निरर्थक बात का संकेत दे सकता है। संदर्भ में ‘झूठ’ नैतिक दोष को स्पष्ट और सामान्य हिन्दी में व्यक्त करता है।
- source_word: הָרוֹ עָמָל
  choice: वे अनिष्ट का गर्भ धारण करते
  rationale: הרה के गर्भधारण रूपक को स्पष्ट रूप से बनाए रखा गया है। עָמָל यहाँ केवल परिश्रम या कष्ट नहीं, बल्कि हानिकारक षड्यंत्र और उपद्रव का भाव रखता है; ‘अनिष्ट’ उस आशय को संप्रेषित करता है।
- source_word: וְהוֹלֵיד אָוֶן
  choice: और दुष्टता को जन्म देते हैं
  rationale: हिफ़ईल रूप पिछले गर्भधारण रूपक को जन्म देने तक आगे बढ़ाता है। ‘दुष्टता’ אָוֶן के नैतिक बुराई वाले अर्थ को स्वाभाविक हिन्दी में प्रकट करती है।
theological_decisions:
- issue: भ्रष्टाचार-विषयक वचन में नैतिक और न्यायिक शब्दों का अनुवाद
  choice: צֶדֶק के लिए ‘धार्मिकता’ और אֱמוּנָה के लिए ‘सच्चाई’ रखकर उनके व्यापक नैतिक-न्यायिक अर्थ को बनाए रखना
  alternative: צֶדֶק के लिए ‘न्याय’ और אֱמוּנָה के लिए ‘ईमानदारी’ या ‘विश्वासयोग्यता’ रखना
  rationale: पद का प्रसंग सामाजिक और न्यायिक भ्रष्टाचार है, फिर भी इब्रानी शब्द केवल अदालती तकनीकी अर्थों तक सीमित नहीं हैं। चुना हुआ पाठ किसी विशिष्ट धार्मिक सिद्धांत को थोपे बिना उनकी व्यापक नैतिक शक्ति बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यद्वक्तात्मक काव्य की गरिमा और गर्भधारण-जन्म के सशक्त रूपक को बनाए रखा गया है। न्यायिक भाषा को अत्यधिक तकनीकी बनाने से बचते हुए ‘दुहाई देना’ और ‘मुकदमा लड़ना’ जैसे सामान्यतः समझे जाने वाले प्रयोग चुने गए हैं।
