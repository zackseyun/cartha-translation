base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/020.yaml
  text: And a Redeemer will come to Zion[a], and to those in Jacob who turn from transgression[d][c][b], declares Yahweh.
translation:
  language: hi
  text: और सिय्योन में एक छुड़ानेवाला[b] आएगा[a], और याकूब में उन लोगों के पास जो अपराध से मुड़ते हैं[c][d]—यहोवा की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सिय्योन के लिए”; इब्रानी पूर्वसर्ग का यह अर्थ भी संभव है, यद्यपि ‘आना’ क्रिया के साथ गंतव्य का अर्थ अधिक स्वाभाविक है।
    reason: lexical_alternative
  - marker: b
    text: “छुड़ानेवाला” इब्रानी गोएल का अनुवाद है—ऐसा व्यक्ति जो छुड़ाता या किसी व्यक्ति अथवा संपत्ति पर अधिकार फिर से स्थापित करता है; इस शब्द में प्रायः वाचा या निकट संबंधी के दायित्व की छाया होती है।
    reason: cultural_note
  - marker: c
    text: या, “याकूब में पश्चाताप करनेवालों के पास”; अथवा, “याकूब में उन लोगों के पास, जो विद्रोह से लौटते हैं।”
    reason: alternative_reading
  - marker: d
    text: पौलुस रोमियों 11:26 में इस पद को उद्धृत करता है। वहाँ यूनानी पाठ-परंपरा के प्रभाव से शब्दावली कुछ भिन्न है।
    reason: cross_reference
lexical_decisions:
- source_word: וּבָא
  choice: और ... आएगा
  rationale: भविष्यसूचक कथन में संयोजक सहित पूर्ण क्रिया का भावी अर्थ है; हिन्दी में ‘आएगा’ स्वाभाविक है।
- source_word: לְצִיּוֹן
  choice: सिय्योन के पास
  rationale: בוא के साथ ל दिशा अथवा गंतव्य बताता है। ‘के पास’ हिन्दी में व्यक्ति-सदृश सिय्योन की ओर आगमन को सहज रूप से व्यक्त करता है।
- source_word: גּוֹאֵל
  choice: छुड़ानेवाला
  rationale: גאל छुड़ाने या अपना अधिकार पुनः स्थापित करने वाले को दर्शाता है और इसमें कभी-कभी निकट संबंधी के दायित्व की पृष्ठभूमि होती है; मुख्य पाठ में उस संबंध को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: וּלְשָׁבֵי פֶשַׁע
  choice: और ... उन लोगों के पास, जो अपराध से फिरते हैं
  rationale: שוב का कृदंत लगातार या पहचाने जाने योग्य नैतिक फिराव व्यक्त करता है; פשע को ‘अपराध’ कहना विद्रोही उल्लंघन की गंभीरता बनाए रखता है।
- source_word: בְּיַעֲקֹב
  choice: याकूब में
  rationale: ב यहाँ समुदाय के भीतर का क्षेत्र दर्शाता है; ‘याकूब में’ मूल की वाचा-संबंधी सामूहिक अभिव्यक्ति सुरक्षित रखता है।
- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की घोषणा है
  rationale: यह स्थापित भविष्यसूचक सूत्र है। ‘घोषणा’ उसके प्रामाणिक स्वर को व्यक्त करती है और יהוה को उसके नाम ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: छुड़ानेवाले की पहचान
  choice: मुख्य पाठ में केवल ‘छुड़ानेवाला’, किसी विशिष्ट पहचान को जोड़े बिना
  alternative: उसे स्पष्ट रूप से मसीहा अथवा स्वयं यहोवा कहना
  rationale: इब्रानी पद उस व्यक्ति को גואל से आगे स्पष्टतः नहीं पहचानता; इसलिए बाद की मसीही व्याख्या को मुख्य पाठ में आरोपित नहीं किया गया।
- issue: שָׁבֵי פֶשַׁע का अर्थ
  choice: जो अपराध से फिरते हैं
  alternative: पश्चातापी; जो विद्रोह से लौटते हैं
  rationale: क्रियात्मक अनुवाद इब्रानी कृदंत का बल बनाए रखता है और व्यवस्थित धर्मशास्त्रीय शब्दावली थोपे बिना नैतिक परिवर्तन व्यक्त करता है।
- issue: रोमियों 11:26 में उद्धरण का भिन्न रूप
  choice: मुख्य पाठ में मसोराई इब्रानी पाठ का अनुवाद
  alternative: नए नियम के यूनानी उद्धरण के अनुसार शब्दावली बदलना
  rationale: यशायाह के इस पद का मूल-पाठ WLC है; पौलुस के उद्धरण में यूनानी परंपरा के प्रभाव से आंशिक अंतर है, जिसे टिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘छुड़ानेवाला’ प्रचलित बाइबलीय अर्थ को बनाए रखते हुए कृत्रिम ‘कुटुम्बी-छुड़ानेवाला’ से बचता है। सभी टिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं; [b] को संबंधित पद ‘छुड़ानेवाला’ के तुरंत बाद रखने के बजाय वाक्यांत में रखना अर्थ-संबंध को कम स्पष्ट करता, इसलिए प्रकाशन में बेहतर क्रम हेतु मुख्य पाठ का आदर्श रूप ‘छुड़ानेवाला[b] आएगा[a] ... फिरते हैं[c][d]’ होगा।
