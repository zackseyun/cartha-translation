  text: הֵ֛ן לֹֽא קָצְרָ֥ה יַד יְהוָ֖ה מֵֽ/הוֹשִׁ֑יעַ וְ/לֹא כָבְדָ֥ה אָזְנ֖/וֹ מִ/שְּׁמֽוֹעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/001.yaml
  text: Look[a], Yahweh’s hand is not too short to save[b], nor is his ear too dull to hear.
translation:
  language: hi
  text: देखो[a], याहवे का हाथ इतना छोटा नहीं है कि वह बचा न सके, और न उसका कान इतना भारी है कि वह सुन न सके।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निहारो’ अथवा ‘निश्चय ही’।
    reason: आरंभिक הֵן ध्यान आकर्षित करता है और आगे के कथन पर बल देता है।
  - marker: b
    text: 'अधिक शब्दशः: ‘याहवे का हाथ बचाने के लिए छोटा नहीं है, और उसका कान सुनने के लिए भारी नहीं है।’'
    reason: मुख्य पाठ में स्वाभाविक हिन्दी के लिए ‘इतना…कि…न सके’ संरचना अपनाई गई है; टिप्पणी मूल हिब्रू के संक्षिप्त समानांतर रूपक को दिखाती है।
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह आरंभिक अव्यय आगे कही जाने वाली बात पर ध्यान खींचते हुए उसे बल देता है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक है और इस संवादात्मक बल को बनाए रखता है।
- source_word: קָצְרָה יַד
  choice: हाथ इतना छोटा नहीं हो गया
  rationale: हाथ की मूल देहात्मक उपमा को बनाए रखा गया है; प्रसंग में हाथ का छोटा होना सामर्थ्य की कमी को सूचित करता है। ‘हो गया’ क्रिया के पूर्ण पक्ष को भी व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को पदवी से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: מֵהוֹשִׁיעַ
  choice: कि वह बचा न सके
  rationale: מִן के साथ क्रियार्थक रूप यहाँ असमर्थता या सीमा का भाव देता है। हिन्दी की ‘इतना…कि…न सके’ संरचना इस भाव को स्वाभाविक रूप में व्यक्त करती है।
- source_word: כָבְדָה אָזְנוֹ
  choice: उसका कान इतना भारी हो गया
  rationale: ‘भारी’ मूल क्रिया के ठोस रूपक को सुरक्षित रखता है, जबकि पूरी वाक्य-संरचना स्पष्ट करती है कि आशय सुनने में असमर्थता से है।
- source_word: מִשְּׁמוֹעַ
  choice: कि वह सुन न सके
  rationale: यहाँ ‘सुनना’ मूल क्रिया का सीधा अर्थ है; ‘ध्यान देना’ या ‘मानना’ जैसी अतिरिक्त व्याख्या नहीं जोड़ी गई।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार-अक्षरीय विशिष्ट ईश्वरीय नाम है। हिन्दी पाठकों के बीच व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को चुना गया, न कि उसे ‘प्रभु’ जैसी पदवी से प्रतिस्थापित किया गया।
- issue: क्या पद परमेश्वर की सामर्थ्य की कमी बताता है
  choice: नकारात्मक रूपक को यथावत रखना
  alternative: सीधे कहना कि ‘यहोवा बचाने और सुनने में समर्थ है’
  rationale: मूल पाठ हाथ के छोटा होने और कान के भारी होने की संभावना का स्पष्ट निषेध करता है। सीधे सिद्धांतात्मक कथन में बदलने से काव्यात्मक चित्र और अगले पदों से उसका तनाव खो जाता।
