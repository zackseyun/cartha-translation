id: ISA.59.8
reference: Isaiah 59:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: דֶּ֤רֶךְ שָׁלוֹם֙ לֹ֣א יָדָ֔עוּ וְ/אֵ֥ין מִשְׁפָּ֖ט בְּ/מַעְגְּלוֹתָ֑/ם נְתִיבֽוֹתֵי/הֶם֙ עִקְּשׁ֣וּ לָ/הֶ֔ם כֹּ֚ל דֹּרֵ֣ךְ בָּ֔/הּ לֹ֥א יָדַ֖ע שָׁלֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/008.yaml
  text: They do not know the way of peace[a], and there is no justice in their paths; they have made their roads crooked for themselves[b]; everyone who walks in them does not know peace.
translation:
  language: hi
  text: 'वे शान्ति का मार्ग नहीं जानते,

    और उनकी पगडंडियों में न्याय[a] नहीं है;

    उन्होंने अपने लिए अपनी राहें टेढ़ी कर ली हैं;

    जो कोई उस राह[b] पर चलता है,

    वह शान्ति नहीं जानता।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उचित निर्णय’ अथवा ‘उचित व्यवस्था’।
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में ‘उस पर’ एकवचन है; यह सम्भवतः ऊपर कही गई राहों को सामूहिक रूप से दर्शाता है।
    reason: textual_clarity
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: मार्ग
  rationale: यह जीवन के आचरण या दिशा का रूपक है; ‘शान्ति का मार्ग’ स्वाभाविक और मूल बिम्ब के अनुरूप है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: इसमें शान्ति के साथ कुशलता और समग्र भलाई का भाव भी हो सकता है, पर यहाँ दोनों आवृत्तियों में ‘शान्ति’ सबसे स्पष्ट और संगत है।
- source_word: יָדָעוּ / יָדַע
  choice: नहीं जानते / नहीं जानता
  rationale: मूल क्रिया केवल बौद्धिक जानकारी नहीं, बल्कि अनुभव और नैतिक परिचय को भी व्यक्त करती है; शाब्दिक पुनरावृत्ति बनाए रखी गई है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: सन्दर्भ में सामाजिक और नैतिक उचितता का अभाव अभिप्रेत है; ‘न्याय’ इसे सामान्य हिन्दी में स्पष्ट करता है।
- source_word: מַעְגְּלוֹתָם
  choice: उनकी पगडंडियों
  rationale: यह पद चलने के चिह्नित मार्ग या पथ को दर्शाता है; ‘पगडंडियाँ’ अगले मार्गवाची पद से कुछ भेद रखते हुए काव्यात्मक बिम्ब को बचाता है।
- source_word: נְתִיבוֹתֵיהֶם
  choice: अपनी राहें
  rationale: ‘राहें’ आधुनिक हिन्दी में स्वाभाविक है और मार्ग-सम्बन्धी समानान्तरता बनाए रखता है।
- source_word: עִקְּשׁוּ
  choice: टेढ़ी कर ली हैं
  rationale: क्रिया का मूल अर्थ मोड़ना या टेढ़ा बनाना है; यह भौतिक बिम्ब और नैतिक संकेत दोनों बनाए रखता है।
- source_word: לָהֶם
  choice: अपने लिए
  rationale: सम्प्रदानवाचक रूप को आत्मवाचक अर्थ में लिया गया है, जिससे उनके अपने किए और अपनाए हुए आचरण का भाव आता है।
- source_word: כֹּל דֹּרֵךְ בָּהּ
  choice: जो कोई उस राह पर चलता है
  rationale: हिब्रू में सर्वनाम एकवचन स्त्रीलिंग है; हिन्दी में ‘उस राह’ कहकर इस एकवचन को स्पष्ट और स्वाभाविक रखा गया है।
theological_decisions:
- issue: מִשְׁפָּט का नैतिक-कानूनी अर्थ
  choice: न्याय
  alternative: निर्णय / उचित व्यवस्था
  rationale: भविष्यद्वक्ता का आरोप केवल न्यायालय के किसी निर्णय तक सीमित नहीं है; ‘न्याय’ व्यापक सामाजिक और नैतिक भाव को बनाए रखता है।
- issue: बहुवचन राहों के बाद בָּהּ का एकवचन
  choice: उस राह पर
  alternative: उन राहों पर
  rationale: मूल का एकवचन सुरक्षित रखा गया है और उसे सामूहिक रूप से उल्लिखित जीवन-राह की ओर संकेत माना गया है; पाद-टिप्पणी में बहुवचन सम्भावना बताई गई है।
- issue: שָׁלוֹם की अर्थ-व्याप्ति
  choice: शान्ति
  alternative: कुशलता / समग्र भलाई
  rationale: ‘शान्ति’ परिचित और सन्दर्भानुकूल है, पर इसे केवल संघर्ष की अनुपस्थिति तक सीमित समझना आवश्यक नहीं; मूल में व्यापक कल्याण का भाव सम्भव है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और पाठयोग्य रखी गई है। ‘मार्ग—पगडंडियाँ—राहें’ से मूल के तीन निकटार्थक मार्गवाची पदों का काव्यात्मक वैविध्य यथासम्भव बचाया गया है। ‘शान्ति’ की दोनों आवृत्तियाँ और ‘जानना’ की नैतिक-अनुभवात्मक पुनरावृत्ति सुरक्षित हैं।
