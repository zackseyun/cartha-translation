source:
  edition: WLC
  text: כִּ֤י אִם עֲוֺנֹֽתֵי/כֶם֙ הָי֣וּ מַבְדִּלִ֔ים בֵּינֵ/כֶ֕ם לְ/בֵ֖ין אֱלֹֽהֵי/כֶ֑ם וְ/חַטֹּֽאותֵי/כֶ֗ם הִסְתִּ֧ירוּ פָנִ֛ים מִ/כֶּ֖ם מִ/שְּׁמֽוֹעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/002.yaml
  text: But your iniquities have become those dividing between you and your God[a], and your sins have hidden his face from you, from hearing.
translation:
  language: hi
  text: पर तुम्हारे अधर्म तुम्हारे और तुम्हारे परमेश्वर के बीच अलगाव बन गए हैं, और तुम्हारे पापों ने उसका मुख तुमसे छिपा दिया है, जिससे वह नहीं सुनता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम वाक्यांश का अधिक शब्दशः अनुवाद: “सुनने से।”'
    reason: मूल इब्रानी की संक्षिप्त संरचना और उसके परिणामसूचक अर्थ को दिखाने के लिए।
lexical_decisions:
- source_word: כִּי אִם
  choice: बल्कि
  rationale: यह पद पिछले पद में परमेश्वर की असमर्थता के निषेध के बाद वास्तविक कारण बताता है; ‘बल्कि’ इस सुधारात्मक विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֲוֺנֹתֵיכֶם
  choice: तुम्हारे अधर्म
  rationale: ‘अधर्म’ עָוֹן के अपराध, दोष और टेढ़े आचरण के अर्थ-क्षेत्र को व्यक्त करता है और आगे आने वाले ‘पापों’ से शब्दगत भेद बनाए रखता है।
- source_word: הָיוּ מַבְדִּלִים
  choice: अलग करते आए हैं
  rationale: यह היה और कृदन्त के संयुक्त रूप की जारी अथवा स्थापित स्थिति को स्वाभाविक हिन्दी में दर्शाता है, बिना असहज शब्दशः संरचना अपनाए।
- source_word: בֵּינֵיכֶם לְבֵין אֱלֹהֵיכֶם
  choice: तुम्हें तुम्हारे परमेश्वर से
  rationale: मूल का अर्थ दो पक्षों के बीच अलगाव है; हिन्दी में ‘तुम्हें…से अलग’ उसी संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְחַטֹּאותֵיכֶם
  choice: और तुम्हारे पापों ने
  rationale: חַטָּאת को ‘पाप’ कहना सामान्य और स्पष्ट है तथा इसे पहले प्रयुक्त עָוֹן के लिए ‘अधर्म’ से अलग रखता है।
- source_word: הִסְתִּירוּ פָנִים מִכֶּם
  choice: उसका मुख तुमसे छिपा दिया है
  rationale: मूल के ‘मुख छिपाने’ वाले मानवरूपी और संबंधपरक बिंब को बनाए रखा गया है; ‘उसका’ संदर्भ से निहित परमेश्वर की ओर संकेत करता है।
- source_word: מִשְּׁמוֹעַ
  choice: जिससे वह नहीं सुनता
  rationale: מן के साथ infinitive construct यहाँ परिणाम व्यक्त करता है। यह हिन्दी में स्वाभाविक है और न सुनने को पिछले कथन का परिणाम बताता है।
theological_decisions:
- issue: परमेश्वर के मुख का मानवरूपी वर्णन
  choice: ‘उसका मुख तुमसे छिपा दिया है’ के बिंब को बनाए रखना
  alternative: ‘उसने तुमसे अपनी कृपा हटा ली है’
  rationale: इब्रानी पाठ स्पष्ट रूप से ‘मुख’ का बिंब रखता है। इसे अमूर्त ‘कृपा’ या ‘उपस्थिति’ में बदलना पाठ की साहित्यिक और संबंधपरक शक्ति को अनावश्यक रूप से सीमित करता।
- issue: परमेश्वर से अलगाव का नैतिक कारण
  choice: लोगों के अधर्म और पाप को अलगाव तथा न सुने जाने का कारण बताना
  alternative: केवल यह कहना कि परमेश्वर उनसे दूर हो गया
  rationale: पद का व्याकरण मानवीय अपराधों को कर्ता और संबंध-विच्छेद का कारण बनाता है; अनुवाद इसी दावे को रखता है, पर उससे आगे कोई व्यवस्थित धर्मसिद्धान्त नहीं जोड़ता।
- issue: מִשְּׁמוֹעַ में परिणाम और उद्देश्य
  choice: ‘जिससे वह नहीं सुनता’—परिणाम
  alternative: ‘ताकि वह न सुने’—उद्देश्य
  rationale: संदर्भ में यह अधिक स्वाभाविक रूप से पापों से उत्पन्न परिणाम है। उद्देश्यसूचक अनुवाद पापों को जानबूझकर परमेश्वर को न सुनने देने वाला कर्ता समझे जाने का जोखिम पैदा करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘अधर्म’ और ‘पाप’ सामान्य धार्मिक शब्दावली में समझने योग्य हैं और मूल के दो अलग शब्दों का भेद रखते हैं। ‘मुख छिपाना’ जानबूझकर सुरक्षित रखा गया है; ‘अलग करते आए हैं’ मूल की चलती/स्थापित अवस्था को असहज शब्दशः हिन्दी के बिना व्यक्त करता है।
