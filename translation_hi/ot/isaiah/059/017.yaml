source:
  edition: WLC
  text: וַ/יִּלְבַּ֤שׁ צְדָקָה֙ כַּ/שִּׁרְיָ֔ן וְ/כ֥וֹבַע יְשׁוּעָ֖ה בְּ/רֹאשׁ֑/וֹ וַ/יִּלְבַּ֞שׁ בִּגְדֵ֤י נָקָם֙ תִּלְבֹּ֔שֶׁת וַ/יַּ֥עַט כַּ/מְעִ֖יל קִנְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/017.yaml
  text: He put on righteousness like a breastplate[a], and a helmet of salvation on his head; he put on garments of vengeance for clothing[c][b], and wrapped himself in zeal as in a cloak.
translation:
  language: hi
  text: उसने धार्मिकता को कवच[a] के समान और उद्धार[b] के शिरस्त्राण को अपने सिर पर पहना; उसने प्रतिशोध के वस्त्र अपनी पोशाक के रूप में पहने और उत्साह[c] को चोगे के समान अपने चारों ओर लपेट लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘कवच’ से आशय धड़ की रक्षा करने वाले युद्ध-कवच से है; अनुवाद ‘छाती का कवच’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उद्धार’ का अनुवाद ‘विजय’ या ‘छुटकारा’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘उत्साह’ का अनुवाद ‘जलन’ भी हो सकता है—यहाँ भाव परमेश्वर की तीव्र, वाचा-निष्ठ लगन का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צְדָקָה
  choice: धार्मिकता
  rationale: यह शब्द नैतिक सहीपन और न्यायपूर्ण आचरण दोनों का भाव रख सकता है। यहाँ परमेश्वर के युद्ध-सदृश हस्तक्षेप में उसके चरित्र और कार्य की सही ठहरने वाली धार्मिकता को बनाए रखने के लिए ‘धार्मिकता’ चुना गया है।
- source_word: שִׁרְיָן
  choice: कवच
  rationale: यह धड़ पर पहने जाने वाले रक्षात्मक युद्ध-कवच को दर्शाता है। ‘कवच’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है; इसकी शारीरिक सीमा पादटिप्पणी में स्पष्ट की गई है।
- source_word: כּוֹבַע
  choice: शिरस्त्राण
  rationale: युद्ध के प्रसंग में यह सिर की रक्षा करने वाले टोप को दर्शाता है। ‘शिरस्त्राण’ वस्त्र-और-कवच रूपक के अनुकूल सटीक और गरिमापूर्ण शब्द है।
- source_word: יְשׁוּעָה
  choice: उद्धार
  rationale: इस संज्ञा में उद्धार, छुटकारा और विजय का अर्थ-क्षेत्र है। यशायाह के व्यापक प्रसंग में परमेश्वर के बचाने वाले हस्तक्षेप के लिए ‘उद्धार’ उपयुक्त है, जबकि युद्ध-संदर्भ के कारण ‘विजय’ की संभावना पादटिप्पणी में रखी गई है।
- source_word: בִּגְדֵי נָקָם
  choice: प्रतिशोध के वस्त्र
  rationale: यह पदबंध दैवी दंडात्मक कार्रवाई को वस्त्र के ठोस रूपक में प्रस्तुत करता है। ‘प्रतिशोध’ मूल की तीव्रता को नरम किए बिना व्यक्त करता है।
- source_word: תִּלְבֹּשֶׁת
  choice: अपनी पोशाक के रूप में
  rationale: यह संज्ञा पहनावे या पोशाक को दर्शाती है और पिछले पदबंध को स्पष्ट करती है। यह अनुवाद मूल की जानबूझकर की गई वस्त्र-संबंधी पुनरुक्ति को यथासंभव बनाए रखता है।
- source_word: וַיַּעַט
  choice: अपने चारों ओर लपेट लिया
  rationale: क्रिया स्वयं को किसी वस्त्र में ढकने या लपेटने का बोध देती है। चुना गया वाक्यांश चोगे के दृश्य रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מְעִיל
  choice: चोगा
  rationale: यह ऊपर से पहने जाने वाले बाहरी वस्त्र को दर्शाता है। ‘चोगा’ वर्तमान हिन्दी में समझने योग्य है और लपेटने की उपमा के अनुकूल है।
- source_word: קִנְאָה
  choice: उत्साह
  rationale: परमेश्वर के विषय में यह शब्द तीव्र, संकल्पपूर्ण और वाचा-निष्ठ लगन को दर्शाता है। ‘उत्साह’ इस सकारात्मक सक्रियता को संप्रेषित करता है; ‘जलन’ की शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: यहोवा के हस्तक्षेप का दैवी योद्धा-चित्रण
  choice: धार्मिकता, उद्धार, प्रतिशोध और उत्साह को कवच तथा वस्त्र के ठोस रूपकों में बनाए रखा गया है।
  alternative: युद्ध-संबंधी चित्रों को हटाकर केवल अमूर्त नैतिक गुणों के रूप में अनुवाद करना।
  rationale: इब्रानी पाठ परमेश्वर को स्वयं युद्ध के लिए सुसज्जित होते हुए चित्रित करता है। इस रूपक को अक्षुण्ण रखने से उसके सक्रिय, धार्मिक और न्यायकारी हस्तक्षेप का धर्मवैज्ञानिक तनाव बना रहता है।
- issue: יְשׁוּעָה में उद्धार और विजय का अर्थ-संबंध
  choice: मुख्य पाठ में ‘उद्धार’, पादटिप्पणी में ‘विजय’ और ‘छुटकारा’।
  alternative: युद्ध-संदर्भ के आधार पर मुख्य पाठ में केवल ‘विजय’ रखना।
  rationale: यशायाह में यह शब्द परमेश्वर के बचाने वाले कार्य को व्यापक रूप से व्यक्त करता है, पर यहाँ का युद्ध-संदर्भ विजय का वास्तविक अर्थ-संकेत भी देता है; अतः अस्पष्टता पादटिप्पणी में संरक्षित है।
- issue: קִנְאָה का उत्साह अथवा जलन
  choice: मुख्य पाठ में ‘उत्साह’, पादटिप्पणी में ‘जलन’।
  alternative: मुख्य पाठ में ‘जलन’ रखना।
  rationale: यहाँ भाव तुच्छ ईर्ष्या नहीं, बल्कि परमेश्वर की तीव्र और संकल्पपूर्ण लगन है। फिर भी मूल शब्द का जलन-संबंधी अर्थ मिटाया नहीं गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और चित्रात्मक रखी गई है। ‘शिरस्त्राण’ अपेक्षाकृत साहित्यिक है, पर युद्ध-कवच के प्रसंग में सटीक और सामान्य पाठक के लिए संदर्भ से स्पष्ट है। मूल की समानांतर रचना तथा वस्त्र पहनने और लपेटने की गतिशील छवि सुरक्षित रखी गई है।
