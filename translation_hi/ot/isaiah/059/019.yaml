source:
  edition: WLC
  text: וְ/יִֽירְא֤וּ מִֽ/מַּעֲרָב֙ אֶת שֵׁ֣ם יְהוָ֔ה וּ/מִ/מִּזְרַח שֶׁ֖מֶשׁ אֶת כְּבוֹד֑/וֹ כִּֽי יָב֤וֹא כַ/נָּהָר֙ צָ֔ר ר֥וּחַ יְהוָ֖ה נֹ֥סְסָה בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/019.yaml
  text: So they will fear the name of Yahweh from the west[a], and his glory from the rising of the sun; for he will come like a rushing river[c][b], driven by the breath of Yahweh.
translation:
  language: hi
  text: 'तब पश्चिम से याहवे के नाम का भय मानेंगे,

    और सूर्योदय से उसकी महिमा का।

    क्योंकि वह वेगवती नदी के समान आएगा,

    जिसे याहवे की श्वास आगे बढ़ाती है।[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'इस अंतिम खंड का इब्रानी पाठ कठिन है। इसका अनुवाद यह भी हो सकता है: “क्योंकि वह वेगवती नदी के समान आएगा, जिसे याहवे की आत्मा आगे बढ़ाती है।”'
    reason: alternative_reading
  - marker: c
    text: 'पारंपरिक अनुवाद: “जब शत्रु बाढ़ के समान आएगा, तब याहवे का आत्मा उसके विरुद्ध झंडा खड़ा करेगा।” यह इब्रानी वाक्य-विन्यास और दुर्लभ क्रिया की दूसरी व्याख्या पर आधारित है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִירְאוּ
  choice: तब ... भय मानेंगे
  rationale: क्रिया ירא भय, श्रद्धामिश्रित भय या आदर व्यक्त कर सकती है। “भय मानेंगे” इसकी प्रबलता और वाचा-संबंधी विस्मय को बनाए रखता है; “तब” प्रसंगगत परिणाम को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: מִמַּעֲרָב
  choice: पश्चिम में
  rationale: शब्द का अर्थ पश्चिम अथवा सूर्यास्त की दिशा है। हिन्दी में “पश्चिम में लोग” उस क्षेत्र के निवासियों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶת שֵׁם יְהוָה
  choice: यहोवा के नाम का
  rationale: यह इब्रानी अभिव्यक्ति परमेश्वर की प्रकट पहचान और प्रतिष्ठा को सूचित करती है। יְהוָה को उसके व्यक्तिगत नाम “यहोवा” से प्रस्तुत किया गया है।
- source_word: וּמִמִּזְרַח שֶׁמֶשׁ
  choice: और सूर्योदय की दिशा में
  rationale: शाब्दिक अर्थ “सूर्य के उदय से” है। चुना हुआ रूप काव्यात्मक चित्र को बनाए रखते हुए आधुनिक हिन्दी में दिशा स्पष्ट करता है।
- source_word: אֶת כְּבוֹדוֹ
  choice: उसकी महिमा का
  rationale: כבוד का अर्थ महिमा, गौरव या वैभव हो सकता है। ईश्वरीय प्रकटता के प्रसंग में “महिमा” सर्वाधिक उपयुक्त है; पिछले खंड से “भय मानेंगे” क्रिया यहाँ अध्याहृत है।
- source_word: כִּי יָבֹא
  choice: क्योंकि वह ... आएगा
  rationale: כִּי कारण प्रस्तुत करता है और יָבֹא पुल्लिंग एकवचन है। सर्वनाम “वह” स्रोत की कठिन विषय-संबंधी अस्पष्टता को कुछ हद तक बनाए रखता है, जबकि प्रसंग ईश्वरीय आगमन की ओर संकेत करता है।
- source_word: כַנָּהָר צָר
  choice: वेगवती नदी के समान
  rationale: נָהָר “नदी” है, जबकि צָר यहाँ कठिन है और दबावपूर्ण अथवा तीव्र गति का भाव दे सकता है। “वेगवती” नदी के चित्र में उस बल को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे सीधे “बाढ़” बनाने के।
- source_word: רוּחַ יְהוָה
  choice: यहोवा की श्वास
  rationale: רוּחַ का अर्थ श्वास, वायु या आत्मा हो सकता है। नदी को आगे बढ़ाने वाले काव्यात्मक चित्र में “श्वास” ठोस बिंब और व्यापक धर्मवैज्ञानिक अनुगूँज दोनों बनाए रखता है।
- source_word: נֹסְסָה בוֹ
  choice: जिसे ... आगे बढ़ाती है
  rationale: यह रूप और पूरा वाक्यांश अत्यंत कठिन है। चुना हुआ अनुवाद यह समझ प्रस्तुत करता है कि यहोवा की רוּחַ नदी-समान आगमन को गति देती है; अन्य प्रमुख व्याख्याएँ पादटिप्पणियों में दी गई हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: स्रोत में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है; “यहोवा” हिन्दी पाठकों के लिए परिचित रूप में उस नाम को सुरक्षित रखता है।
- issue: רוּחַ יְהוָה का अर्थ
  choice: यहोवा की श्वास
  alternative: यहोवा का आत्मा / यहोवा की वायु
  rationale: इस काव्यात्मक नदी-बिंब में “श्वास” ठोस प्रेरक शक्ति को व्यक्त करती है, पर इब्रानी शब्द के आत्मा और वायु अर्थों को अंतिम पादटिप्पणी में स्वीकार किया गया है।
- issue: अंतिम कठिन उपवाक्य की व्याख्या
  choice: ईश्वरीय आगमन वेगवती नदी के समान है, जिसे यहोवा की श्वास आगे बढ़ाती है
  alternative: शत्रु बाढ़ के समान आएगा और यहोवा का आत्मा उसके विरुद्ध झंडा खड़ा करेगा
  rationale: इब्रानी पाठ में “शत्रु” के लिए कोई स्पष्ट संज्ञा नहीं है और पारंपरिक विकल्प दुर्लभ क्रिया तथा वाक्य-विन्यास की दूसरी व्याख्या पर निर्भर है। मुख्य पाठ एक स्रोत-सम्मत, सुसंगत अर्थ देता है और प्रसिद्ध पारंपरिक पाठ को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए स्पष्ट रूप रखा गया है। समानांतर पंक्तियों को बनाए रखा गया है। “भय मानेंगे” श्रद्धा और भय दोनों का तनाव सुरक्षित रखता है; कठिन अंतिम खंड को अत्यधिक निश्चित बनाए बिना पठनीय किया गया है।
