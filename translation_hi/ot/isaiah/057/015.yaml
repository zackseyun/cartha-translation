base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/015.yaml
  text: 'For thus says the One who is high and lifted up[a], who inhabits eternity, whose name is Holy: “I dwell in the high and holy place, and also with the crushed and lowly in spirit[b], to revive the spirit of the lowly and to revive the heart of the crushed.”'
translation:
  language: hi
  text: 'क्योंकि जो ऊँचा और अति उन्नत है,

    जो सदा निवास करता है[a],

    और जिसका नाम पवित्र है, वह यह कहता है:


    “मैं ऊँचे और पवित्र स्थान में निवास करता हूँ,

    और कुचले हुए तथा आत्मा से दीन जन के साथ भी निवास करता हूँ,

    ताकि दीनों की आत्मा को जीवित करूँ

    और कुचले हुओं के हृदय को जीवित करूँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो अनन्तता में निवास करता है।” इब्रानी पदबंध अनन्त अवधि अथवा अनन्तता में निवास—दोनों पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָם וְנִשָּׂא
  choice: ऊँचा और अति उन्नत
  rationale: यह यशायाह की ऊर्ध्वात्मक छवि और परमेश्वर की महानता—दोनों को स्वाभाविक, गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: שֹׁכֵן עַד
  choice: जो सदा निवास करता है
  rationale: यह कृदन्त और עַד के स्थायी, अनन्त निवास के भाव को सहज हिन्दी में व्यक्त करता है; ‘अनन्तता में निवास’ की स्थानवाची सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: קָדוֹשׁ שְׁמוֹ
  choice: जिसका नाम पवित्र है
  rationale: यह क्रियारहित इब्रानी वाक्य का स्वाभाविक हिन्दी रूप है और ‘पवित्र’ को उसके नाम का विधेय बनाए रखता है।
- source_word: מָרוֹם וְקָדוֹשׁ אֶשְׁכּוֹן
  choice: मैं ऊँचे और पवित्र स्थान में निवास करता हूँ
  rationale: ‘स्थान’ को स्पष्ट करके हिन्दी को स्वाभाविक बनाया गया है, जबकि ऊँचाई, पवित्रता और निवास की मूल छवि बनी रहती है।
- source_word: דַּכָּא / נִדְכָּאִים
  choice: कुचला हुआ / कुचले हुए
  rationale: यह मूल शब्द की कुचले या टूटे होने की ठोस छवि को रखता है और केवल पश्चात्ताप का संकरा अर्थ आरोपित नहीं करता।
- source_word: שְׁפַל רוּחַ
  choice: आत्मा में दीन
  rationale: यह רוּחַ को ‘आत्मा’ के रूप में स्पष्ट रखता है और भीतर की दीनता को मूल संरचना के निकट व्यक्त करता है।
- source_word: לְהַחֲיוֹת
  choice: फिर से जिलाना
  rationale: हिफ़ील रूप का अर्थ जीवन देना या पुनर्जीवित करना है; यहाँ ‘फिर से जिलाना’ पुनर्स्थापन का भाव देता है, बिना इसे अनिवार्यतः मृतकों के पुनरुत्थान तक सीमित किए।
- source_word: רוּחַ שְׁפָלִים
  choice: दीनों की आत्मा
  rationale: ‘आत्मा’ और बहुवचन ‘दीनों’ दोनों को बनाए रखता है तथा पहले आए दीनता के शब्द से संगति रखता है।
- source_word: לֵב נִדְכָּאִים
  choice: कुचले हुओं का हृदय
  rationale: ‘हृदय’ की बाइबलीय मानव-सम्बन्धी भाषा और דַּכָּא से शब्दगत सम्बन्ध दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: एक ही पद में परमेश्वर की परात्परता और निकट उपस्थिति
  choice: ऊँचे और पवित्र स्थान में उसके निवास तथा कुचले और दीन व्यक्ति के साथ उसके निवास—दोनों को समान रूप से स्पष्ट रखा गया है।
  alternative: ‘साथ’ को केवल रूपक मानना या उसकी परात्परता अथवा निकटता में से किसी एक को कम कर देना।
  rationale: इब्रानी पाठ दोनों वास्तविकताओं को जानबूझकर साथ रखता है; अनुवाद इस धार्मिक तनाव को हल किए बिना सुरक्षित रखता है।
- issue: דַּכָּא / נִדְכָּאִים का अर्थ
  choice: मुख्य पाठ में ‘कुचला हुआ/कुचले हुए’।
  alternative: ‘खेदित’, ‘पश्चात्तापी’ या ‘टूटे मनवाला’।
  rationale: मूल शब्द का सीधा बिम्ब कुचले या टूटे होने का है। ‘पश्चात्तापी’ सम्भव प्रसंगगत व्याख्या है, पर वह शब्द के अर्थ को अनावश्यक रूप से संकरा कर सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक-पाठ योग्य रूप अपनाया गया है। समानान्तर काव्य-पंक्तियाँ और ‘निवास’ तथा ‘फिर से जिलाऊँ’ की पुनरावृत्ति मूल इब्रानी की संरचना को सुनाई देने देती हैं। ‘आत्मा में दीन’ सामान्य बोलचाल से कुछ ऊँचा है, पर मूल के רוח को सुरक्षित रखने और धार्मिक अर्थ को अनावश्यक रूप से ‘मन’ तक सीमित न करने के लिए उपयुक्त है।
