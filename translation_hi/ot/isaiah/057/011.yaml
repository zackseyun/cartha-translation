  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֶת מִ֞י דָּאַ֤גְתְּ וַ/תִּֽירְאִי֙ כִּ֣י תְכַזֵּ֔בִי וְ/אוֹתִ/י֙ לֹ֣א זָכַ֔רְתְּ לֹא שַׂ֖מְתְּ עַל לִבֵּ֑/ךְ הֲ/לֹ֨א אֲנִ֤י מַחְשֶׁה֙ וּ/מֵ֣/עֹלָ֔ם וְ/אוֹתִ֖/י לֹ֥א תִירָֽאִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/011.yaml
  text: And whom did you dread and fear[a], so that you lied and did not remember me, did not lay it to your heart? Was it not because I have kept silent, and that from long ago[b], that you do not fear me?
translation:
  language: hi
  text: तू किससे चिंतित और भयभीत हुई कि तूने झूठ बोला, मुझे याद नहीं किया और इस बात को मन में नहीं रखा[a]? क्या ऐसा इसलिए नहीं है कि मैं बहुत पहले से चुप रहा हूँ[b] और तू मुझसे नहीं डरती?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने हृदय पर नहीं रखा।” इसका अर्थ है किसी बात पर गंभीरता से ध्यान न देना या उसे मन में न उतारना।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “मैं लंबे समय तक चुप रहा हूँ” या “मैं पुराने समय से चुप रहा हूँ” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּאַגְתְּ וַתִּירְאִי
  choice: इतनी आशंकित और भयभीत हुई
  rationale: दोनों इब्रानी क्रियाओं के भय और चिंताजनक आशंका के संयुक्त भाव को स्वाभाविक हिन्दी में रखते हुए उनकी समानांतरता बनाए रखता है। स्त्रीलिंग एकवचन संबोधन भी सुरक्षित है।
- source_word: כִּי תְכַזֵּבִי
  choice: कि तूने झूठ बोला
  rationale: 'כִּי को यहाँ परिणामसूचक माना गया है: दूसरों से भय ने झूठ बोलने की ओर पहुँचाया। पिएल रूप का सीधा और प्रचलित अर्थ ‘झूठ बोलना’ है।'
- source_word: וְאוֹתִי לֹא זָכַרְתְּ
  choice: मुझे याद नहीं किया
  rationale: זכר के संज्ञानात्मक और वाचागत संकेत को बिना अतिरिक्त व्याख्या जोड़े सीधे व्यक्त करता है।
- source_word: לֹא שַׂמְתְּ עַל לִבֵּךְ
  choice: इस बात को मन में नहीं रखा
  rationale: शाब्दिक ‘अपने हृदय पर नहीं रखा’ की छवि और किसी बात पर गंभीरता से ध्यान देने के मुहावरेदार अर्थ के बीच संतुलन रखता है। निहित कर्म को हिन्दी में ‘इस बात’ के रूप में स्पष्ट किया गया है।
- source_word: מַחְשֶׁה
  choice: चुप रहा हूँ
  rationale: חשה का अर्थ ‘चुप रहना’ है। पूर्ण वर्तमान रूप बीते समय से जारी परमेश्वर की चुप्पी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּמֵעוֹלָם
  choice: बहुत पहले से
  rationale: यहाँ עוֹלָם को अमूर्त अनन्तता नहीं, बल्कि बहुत पुराने समय से चली आ रही अवधि के रूप में समझा गया है।
- source_word: וְאוֹתִי לֹא תִירָאִי
  choice: तू मुझसे ... नहीं डरती
  rationale: अपूर्ण क्रिया का वर्तमान, परिणामसूचक भाव रखता है और परमेश्वर की दीर्घ चुप्पी से संबद्ध निर्भयता को स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर की चुप्पी का अर्थ
  choice: लंबे समय तक परमेश्वर का चुप रहना लोगों के उससे न डरने का अवसर बना बताया गया है।
  alternative: इसे परमेश्वर की उदासीनता, स्वीकृति या पूर्ण अनुपस्थिति की घोषणा मानना।
  rationale: पद परमेश्वर की दीर्घ चुप्पी और संबोधित स्त्री के उससे न डरने के बीच संबंध रखता है, पर उस चुप्पी का व्यापक धर्मवैज्ञानिक अर्थ निश्चित नहीं करता। अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सुबोध हिन्दी। इब्रानी में संबोधन स्त्रीलिंग एकवचन है, इसलिए ‘तू’ और स्त्रीलिंग क्रियारूप रखे गए हैं। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए अंतिम प्रश्न को पुनःक्रमित किया गया है, जबकि परमेश्वर की दीर्घ चुप्पी और भय के अभाव का कारणात्मक संबंध सुरक्षित रखा गया है।
