  text: וְ/אַתֶּ֥ם קִרְבוּ הֵ֖נָּה בְּנֵ֣י עֹנְנָ֑ה זֶ֥רַע מְנָאֵ֖ף וַ/תִּזְנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/003.yaml
  text: But you—come here[a], sons of a sorceress[b], offspring of an adulterer and a prostitute.
translation:
  language: hi
  text: पर तुम, इधर आओ, हे शकुन-विचार करनेवाली के बेटो[a], व्यभिचारी पुरुष और वेश्या की संतान[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘भविष्य बतानेवाली स्त्री।’ इब्रानी शब्द निषिद्ध शकुन-विचार या दिव्य-ज्ञान की क्रिया का संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: यह पंक्ति वास्तविक वंश का आरोप होने के बजाय आत्मिक व्यभिचार और मूर्तिपूजा के लिए प्रयुक्त भविष्यद्वक्तीय रूपक भी हो सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: पर तुम
  rationale: सर्वनाम के साथ संयोजक पिछले प्रसंग के धर्मी जनों से तीखा विरोध प्रकट करता है; आधुनिक हिन्दी में ‘पर तुम’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: קִרְבוּ הֵנָּה
  choice: यहाँ पास आओ
  rationale: बहुवचन आज्ञार्थक क्रिया और स्थानसूचक क्रियाविशेषण दोनों को रखते हुए चुनौतीपूर्ण बुलावे का भाव व्यक्त किया गया है।
- source_word: בְּנֵי עֹנְנָה
  choice: टोना करनेवाली के बेटो
  rationale: בְּנֵי का पुल्लिंग बहुवचन और संबोधनात्मक तीखापन सुरक्षित रखा गया है। עֹנְנָה निषिद्ध शकुन-विचार अथवा भावी-कथन जैसी गूढ़ क्रिया करनेवाली स्त्री को दर्शाता है; ‘टोना करनेवाली’ साधारण पाठक के लिए स्पष्ट और संक्षिप्त है।
- source_word: זֶרַע
  choice: संतान
  rationale: वंश अथवा चरित्रगत संबंध बतानेवाली इस निंदात्मक वंशावली-भाषा में ‘संतान’ स्वाभाविक है और ‘बीज’ की अनावश्यक शब्दशः कठोरता से बचता है।
- source_word: מְנָאֵף
  choice: व्यभिचारी पुरुष
  rationale: पुल्लिंग एकवचन कृदंत को स्पष्ट रखते हुए उस पुरुष का बोध कराया गया है जो परस्त्रीगमन करता है।
- source_word: וַ/תִּזְנֶה
  choice: और वेश्या
  rationale: मूल रूप स्त्रीलिंग एकवचन में वेश्यागमन/वेश्यावृत्ति करनेवाली स्त्री की ओर संकेत करता है। हिन्दी में संज्ञात्मक रूप वाक्य को सहज रखता और स्त्रीलिंग संदर्भ सुरक्षित करता है।
theological_decisions:
- issue: निंदा में प्रयुक्त पारिवारिक और यौन बिंबों का स्वरूप
  choice: मुख्य पाठ श्रोताओं को टोना करनेवाली, व्यभिचारी पुरुष और वेश्या की संतान कहनेवाला तीखा भविष्यद्वक्तीय बिंब ज्यों का त्यों रखता है।
  alternative: इसे उनके वास्तविक माता-पिता और जैविक वंश के बारे में शाब्दिक आरोप माना जा सकता है।
  rationale: निकटवर्ती प्रसंग में मूर्तिपूजा और वाचा के प्रति विश्वासघात की निंदा के लिए पारिवारिक तथा यौन भाषा प्रयुक्त है। फिर भी मूल पद स्वयं रूपक अथवा शाब्दिक अर्थ को निर्णायक रूप से स्पष्ट नहीं करता, इसलिए मुख्य पाठ तनाव को बनाए रखता है और टिप्पणी में संभावना बताता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है, जबकि भविष्यद्वक्ता की तीखी संबोधन-शैली को नरम नहीं किया गया। ‘टोना करनेवाली’ सामान्य पाठक के लिए बोधगम्य है; अधिक तकनीकी अर्थ पादटिप्पणी में दिया गया है।
