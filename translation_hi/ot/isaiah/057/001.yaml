source:
  edition: WLC
  text: הַ/צַּדִּ֣יק אָבָ֔ד וְ/אֵ֥ין אִ֖ישׁ שָׂ֣ם עַל לֵ֑ב וְ/אַנְשֵׁי חֶ֤סֶד נֶֽאֱסָפִים֙ בְּ/אֵ֣ין מֵבִ֔ין כִּֽי מִ/פְּנֵ֥י הָ/רָעָ֖ה נֶאֱסַ֥ף הַ/צַּדִּֽיק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/001.yaml
  text: The righteous man perishes[a], and no one takes it to heart; men of faithful love are gathered away, with no one understanding that the righteous man is gathered away because of evil.
translation:
  language: hi
  text: धर्मी मनुष्य नष्ट हो जाता है, और कोई इस पर ध्यान नहीं देता; प्रेम और निष्ठा से भरे लोग हटा लिए जाते हैं, और कोई नहीं समझता कि धर्मी मनुष्य बुराई से हटा लिया जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַצַּדִּיק
  choice: धर्मी मनुष्य
  rationale: निश्चित उपपद के साथ पुल्लिंग एकवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘धर्मी मनुष्य’ उसके एकवचन, प्रतिनिधिक और नैतिक-वाचा-संबंधी अर्थ को बनाए रखता है।
- source_word: אָבָד
  choice: नाश हो जाता है
  rationale: अर्थ मरने, नष्ट होने या लुप्त हो जाने तक फैल सकता है। यह पद भविष्यद्वक्ता के विलाप का बल रखते हुए मृत्यु को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
- source_word: שָׂם עַל לֵב
  choice: इस बात पर मन नहीं लगाता
  rationale: इब्रानी मुहावरे का अर्थ किसी बात को गंभीरता से हृदय में लेना और उस पर ध्यान देना है। यह हिंदी में स्वाभाविक और भावपूर्ण है।
- source_word: אַנְשֵׁי חֶסֶד
  choice: अटल प्रेम रखने वाले पुरुष
  rationale: חֶסֶד में प्रेम, करुणा और निष्ठा का संयुक्त भाव है। ‘अटल प्रेम’ उसकी स्थायी और वाचा-संबंधी निष्ठा को व्यक्त करता है; ‘पुरुष’ मूल के पुल्लिंग बहुवचन को दर्शाता है।
- source_word: נֶאֱסָפִים / נֶאֱסַף
  choice: उठा लिए जाते हैं / उठा लिया जाता है
  rationale: אסף का निफ़अल मृत्यु के प्रसंग में किसी को समेट लिए जाने या संसार से हटा लिए जाने का शिष्टोक्तिपूर्ण संकेत हो सकता है। एक ही हिंदी क्रिया की पुनरावृत्ति मूल की संरचना बनाए रखती है।
- source_word: בְּאֵין מֵבִין
  choice: फिर भी कोई नहीं समझता
  rationale: पूर्वसर्ग और אין की रचना उस समय उपस्थित समझ की कमी बताती है। हिंदी में यह रूप प्रसंग का विरोधात्मक बल स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כִּי
  choice: कि
  rationale: यह उस बात की विषयवस्तु प्रस्तुत करता है जिसे कोई नहीं समझता।
- source_word: מִפְּנֵי הָרָעָה
  choice: बुराई के कारण
  rationale: מִפְּנֵי कारण अथवा किसी वस्तु के सामने से दूर किए जाने का भाव दे सकता है, और רָעָה नैतिक बुराई अथवा विपत्ति दोनों को सूचित कर सकता है। मुख्य पाठ व्यापक ‘बुराई’ रखता है; संभावित विपत्ति और उससे पहले हटा लिए जाने का अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: क्या הָרָעָה नैतिक ‘बुराई’ है या आने वाली ‘विपत्ति’, और क्या מִפְּנֵי कारण बताता है या उससे बचाकर हटाया जाना
  choice: बुराई के कारण
  alternative: विपत्ति से; आने वाली विपत्ति से पहले
  rationale: इब्रानी पदबंध दोनों दिशाओं की अनुमति देता है। मुख्य पाठ कारणात्मक और व्यापक अर्थ रखता है, जबकि पादटिप्पणी संभावित विपत्ति तथा उससे बचाकर हटा लिए जाने की व्याख्या को स्पष्ट रूप से सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मृत्यु के लिए मूल की शिष्टोक्ति ‘उठा लिया जाता है’ में बनाए रखी गई है, और अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
