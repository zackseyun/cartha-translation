- source_word: אֵין
  choice: नहीं है
  rationale: यह अस्तित्व का निषेध व्यक्त करता है; हिन्दी में ‘शान्ति नहीं है’ स्वाभाविक और पूर्ण निषेध को स्पष्ट रखने वाला रूप है।
- source_word: שָׁלוֹם
