- source_word: אָמַר
  choice: कहते हैं
  rationale: रूप की दृष्टि से यह पूर्ण क्रिया है, पर भविष्यद्वाणी के कथन-सूत्र में वर्तमानकालीन ‘कहते हैं’ हिन्दी में स्वाभाविक है और दिव्य घोषणा को जीवंत रखता है।
- source_word: אֱלֹהַי
  choice: मेरे परमेश्वर
  rationale: प्रथम पुरुष एकवचन स्वत्व-प्रत्यय को स्पष्ट रूप से बनाए रखता है और समानांतर पद के अनुसार पाठ का सामंजस्य नहीं करता।
- source_word: לָרְשָׁעִים
  choice: दुष्टों के लिए
  rationale: ל यहाँ सम्बन्ध या जिसके लिए कुछ उपलब्ध है, उसे सूचित करता है; ‘दुष्ट’ नैतिक श्रेणी को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
theological_decisions:
- issue: दिव्य कथन में वक्ता का सम्बोधन
  choice: मसोराई पाठ के प्रथम पुरुष स्वत्वसूचक रूप के अनुसार ‘मेरे परमेश्वर’
  alternative: यशायाह 48:22 के समानांतर कथन के अनुसार ‘यहोवा’, अथवा स्वत्वसूचकता हटाकर केवल ‘परमेश्वर’
  rationale: इब्रानी मसोराई पाठ אֱלֹהַי अर्थात् ‘मेरे परमेश्वर’ पढ़ता है। समानांतर पद से सामंजस्य बैठाने या भाषा को सरल करने के लिए इस प्रथम पुरुष रूप को हटाना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भविष्यद्वाणी-शैली अपनाई गई है। ‘मेरे परमेश्वर’ को मूल इब्रानी के अनुसार सुरक्षित रखा गया है। पादटिप्पणी-चिह्न सम्बद्ध शब्द और पूरे कथन के बाद लगाए गए हैं।
