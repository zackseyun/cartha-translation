source:
  edition: WLC
  text: עַל מִי֙ תִּתְעַנָּ֔גוּ עַל מִ֛י תַּרְחִ֥יבוּ פֶ֖ה תַּאֲרִ֣יכוּ לָשׁ֑וֹן הֲ/לֽוֹא אַתֶּ֥ם יִלְדֵי פֶ֖שַׁע זֶ֥רַע שָֽׁקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/004.yaml
  text: At whom do you sport yourselves? Against whom do you open your mouth wide and stick out your tongue? Are you not children of transgression[c][b][a], offspring of deceit?
translation:
  language: hi
  text: तुम किस पर उपहास करते हो?[a] तुम किसके विरुद्ध मुँह चौड़ा खोलते और जीभ बाहर निकालते हो?[b] क्या तुम विद्रोह की संतान और छल की संतान नहीं हो?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “तुम किस पर अपने को आनंदित करते हो?” संदर्भ में इसका आशय किसी पर प्रसन्न होकर इतराने या उसका उपहास करने से है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “जीभ लंबी करते हो”; यह उपहास में जीभ बाहर निकालने का संकेत है।
    reason: lexical_alternative
  - marker: c
    text: “विद्रोह की संतान” और “छल की संतान” पारिवारिक भाषा में दिए गए रूपक हैं; ये ऐसे लोगों को बताते हैं जिनका चरित्र विद्रोह और छल से पहचाना जाता है।
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְעַנָּגוּ
  choice: उपहास करते हो
  rationale: क्रिया का मूल भाव अपने को प्रसन्न करने या आनंद लेने का है, पर अगले समानांतर वाक्यांश तिरस्कारपूर्ण हाव-भाव दिखाते हैं। इसलिए संदर्भगत उपहास का भाव व्यक्त किया गया है, जबकि अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: תַּרְחִיבוּ פֶה
  choice: मुँह पूरा खोलते
  rationale: यह चयन इब्रानी के ‘मुँह चौड़ा करने’ वाले सजीव चित्र को स्वाभाविक हिन्दी में बनाए रखता है और उद्दंड उपहास के भाव को संदर्भ से उभरने देता है।
- source_word: תַּאֲרִיכוּ לָשׁוֹן
  choice: जीभ बाहर निकालते
  rationale: शाब्दिक अर्थ ‘जीभ लंबी करते’ है; हिन्दी में उपहास के इस हाव-भाव के लिए ‘जीभ बाहर निकालना’ स्पष्ट और स्वाभाविक है।
- source_word: הֲלוֹא
  choice: क्या ... नहीं हो?
  rationale: यह सहमति की अपेक्षा रखने वाले आलंकारिक प्रश्न को सीधे और स्वाभाविक रूप में व्यक्त करता है।
- source_word: יִלְדֵי פֶשַׁע
  choice: विद्रोह की संतान
  rationale: ‘संतान’ लिंग-निरपेक्ष रूप से वंशगत रूपक को बनाए रखता है। פֶשַׁע के लिए ‘विद्रोह’ परमेश्वर के विरुद्ध जानबूझकर किए गए उल्लंघन के भविष्यद्वक्ताई भाव को व्यक्त करता है।
- source_word: זֶרַע שָׁקֶר
  choice: झूठ का वंश
  rationale: ‘वंश’ זֶרַע के वंशावली-संबंधी रूपक को सुरक्षित रखता है, और ‘झूठ’ שָׁקֶר के सामान्य अर्थ को सरल, वर्तमान हिन्दी में देता है।
theological_decisions:
- issue: भविष्यद्वक्ताई आरोप में वंश-संबंधी नैतिक भाषा
  choice: ‘विद्रोह की संतान और झूठ का वंश’ के रूप में पारिवारिक रूपक को मुख्य पाठ में बनाए रखा गया है और पादटिप्पणी में उसके नैतिक आशय को स्पष्ट किया गया है।
  alternative: इसे पूरी तरह अर्थानुवाद करके ‘विद्रोही और झूठे लोग’ कहा जा सकता था, या इसे शारीरिक वंश के दावे के रूप में समझा जा सकता था।
  rationale: इब्रानी में ‘किसी वस्तु की संतान’ और ‘किसी वस्तु का वंश’ व्यक्ति के चरित्र या पहचान को रूपक द्वारा बताते हैं। रूपक बनाए रखने से पाठ की तीक्ष्णता सुरक्षित रहती है, जबकि टिप्पणी अनुचित जैविक, जातीय या तत्त्वमीमांसक निष्कर्ष से बचाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण भविष्यद्वक्ताई आरोप। ‘उपहास’, ‘विद्रोह’, ‘संतान’ और ‘वंश’ पाठ की तीक्ष्णता तथा इब्रानी रूपकों को बनाए रखते हैं; क्रियाएँ बहुवचन संबोधन में हैं।
