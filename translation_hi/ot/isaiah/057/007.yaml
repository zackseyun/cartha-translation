base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/007.yaml
  text: On a high and lofty mountain you set your bed[b][a]; there too you went up to sacrifice a sacrifice.
translation:
  language: hi
  text: एक ऊँचे और ऊँचा उठे हुए पहाड़ पर तूने अपना बिछौना लगाया[b]; वहाँ भी[a] तू बलि चढ़ाने के लिए ऊपर गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वहीं भी।’
    reason: lexical_alternative
  - marker: b
    text: इस प्रसंग में ‘बिछौना’ संभवतः मूर्तिपूजक उपासना के रूपक के रूप में प्रयुक्त अनुचित यौन छवि का संकेत है।
    reason: cultural_note
lexical_decisions:
- source_word: עַל הַר
  choice: एक ... पहाड़ पर
  rationale: यह स्थानसूचक वाक्यांश है; הַר का सामान्य अर्थ ‘पहाड़’ है।
- source_word: גָּבֹהַּ וְנִשָּׂא
  choice: ऊँचे और उन्नत
  rationale: दोनों विशेषण ऊँचाई पर बल देते हैं; यह रूप उनकी पुनरुक्त तीव्रता को बनाए रखता है।
- source_word: שַׂמְתְּ
  choice: तूने ... लगाया
  rationale: स्त्रीलिंग एकवचन संबोधन के साथ ‘लगाया’ बिछौने के लिए स्वाभाविक हिन्दी है और ‘रखा/स्थापित किया’ का भाव देता है।
- source_word: מִשְׁכָּבֵךְ
  choice: अपना बिछौना
  rationale: यह लेटने के स्थान या बिस्तर को दर्शाता है और प्रसंग में निहित यौन तथा मूर्तिपूजक संकेत को बिना स्पष्ट व्याख्या जोड़े बनाए रखता है।
- source_word: גַּם שָׁם
  choice: वहाँ भी
  rationale: גַּם का योगात्मक बल सहज हिन्दी में ‘भी’ से व्यक्त होता है; ‘वहीं तक’ जैसी अतिरिक्त व्याख्या नहीं जोड़ी गई।
- source_word: עָלִית
  choice: तू ... ऊपर गई
  rationale: क्रिया का शाब्दिक आरोहण-संबंधी अर्थ और स्त्रीलिंग एकवचन संबोधन दोनों सुरक्षित हैं।
- source_word: לִזְבֹּחַ זָבַח
  choice: बलि चढ़ाने के लिए
  rationale: हिब्रू का क्रिया-सजातीय संज्ञा संयोजन हिन्दी में शब्दशः दोहराने पर अस्वाभाविक होगा; ‘बलि चढ़ाना’ उपासना-संबंधी अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: मूर्तिपूजा और आध्यात्मिक व्यभिचार के प्रसंग में ‘बिछौना’ का रूपक
  choice: मुख्य पाठ में ठोस चित्र ‘अपना बिछौना’ बनाए रखना
  alternative: अपनी व्यभिचारी उपासना का स्थान
  rationale: हिब्रू रूपक को स्वयं आरोप व्यक्त करने देता है; मुख्य पाठ में उसका अर्थ खोलना अनुवाद से आगे बढ़कर व्याख्या करना होता।
- issue: זבח की उपासना-संबंधी भाषा
  choice: बलि चढ़ाने के लिए
  alternative: बलि का वध करने के लिए
  rationale: प्रसंग ऊँचे स्थान पर अनुचित उपासना का है; ‘बलि चढ़ाना’ सांप्रदायिक विशिष्टता जोड़े बिना धार्मिक-कर्मकांड संबंधी अर्थ रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। स्त्रीलिंग एकवचन संबोधन को ‘तूने/गई’ से स्पष्ट रखा गया है। ‘बिछौना’ रूपक को मुख्य पाठ में समझाकर सीमित नहीं किया गया।
