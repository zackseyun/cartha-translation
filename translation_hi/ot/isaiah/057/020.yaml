  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सहज रूप। ‘उफनते समुद्र’ और ‘उछालता है’ से चित्र सजीव रहता है; ‘कीचड़ और गारा’ मूल के दो निकटार्थक पदों का भेद बनाए रखता है।
