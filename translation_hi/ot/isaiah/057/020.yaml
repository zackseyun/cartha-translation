base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/020.yaml
  text: But the wicked are like the tossing sea[a], for it cannot be quiet[b], and its waters toss up mire and mud.
translation:
  language: hi
  text: परन्तु दुष्ट लोग उफनते समुद्र के समान हैं[a], जो शांत नहीं रह सकता; उसका जल कीचड़ और गारा उछालता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धकेले जाते हुए समुद्र के समान।” इब्रानी क्रिया का अधिक व्याख्यात्मक अनुवाद “अशांत” भी हो सकता है, पर उसका मूल बिंब समुद्र के धकेले या मथे जाने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרְשָׁעִים
  choice: परन्तु दुष्ट लोग
  rationale: רְשָׁעִים व्यक्तियों को दर्शाता है; पिछले पद की शांति के विपरीत भाव के कारण וְ को स्वाभाविक हिन्दी में ‘परन्तु’ किया गया है।
- source_word: כַּיָּם נִגְרָשׁ
  choice: उस उफनते समुद्र के समान
  rationale: כְּ तुलना सूचित करता है और נִגְרָשׁ समुद्र के धकेले, मथे या अशांत किए जाने का चित्र देता है। ‘उफनते’ आधुनिक हिन्दी में समुद्र की गतिशील अशांति को स्वाभाविक रूप से व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: כִּי הַשְׁקֵט לֹא יוּכָל
  choice: जो शांत नहीं रह सकता
  rationale: הַשְׁקֵט का अर्थ शांत या स्थिर होना और לֹא יוּכָל असमर्थता व्यक्त करता है। सम्बन्धवाचक रचना हिन्दी में तुलना की व्याख्या सहजता से जोड़ती है।
- source_word: וַיִּגְרְשׁוּ מֵימָיו
  choice: उसका जल ... उछालता है
  rationale: גרשׁ यहाँ समुद्र के जल द्वारा पदार्थ को बाहर या ऊपर फेंकने का बिंब देता है। ‘उछालता है’ समुद्री गति के सन्दर्भ में स्पष्ट और वर्तमान हिन्दी है।
- source_word: רֶפֶשׁ וָטִיט
  choice: कीचड़ और गारा
  rationale: दोनों निकटार्थक शब्द गंदले, दलदली पदार्थ का युग्म बनाते हैं। ‘कीचड़ और गारा’ हिन्दी में भेद बनाए रखते हुए स्वाभाविक है।
theological_decisions:
- issue: आरम्भिक संयोजक का विरोधसूचक बल
  choice: परन्तु दुष्ट लोग
  alternative: और दुष्ट लोग
  rationale: पिछले पद में धार्मिक जन की शांति और यहाँ दुष्टों की अशांति के बीच प्रसंगगत विरोध है; ‘परन्तु’ इस प्रवाह को स्पष्ट करता है, बिना कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
- issue: समुद्र की दशा का बिंब
  choice: उफनता समुद्र
  alternative: धकेला जाता समुद्र / अशांत समुद्र
  rationale: मूल גרשׁ में धकेले या खदेड़े जाने का भाव है। ‘उफनता’ लक्ष्य भाषा में जीवंत और सहज है, जबकि पादटिप्पणी अधिक शाब्दिक बिंब सुरक्षित रखती है।
- issue: समुद्र के जल द्वारा गंदले पदार्थ का निष्कासन
  choice: उछालता है
  alternative: बाहर फेंकता है
  rationale: क्रिया समुद्र के जल से कीचड़ और गारे के ऊपर या बाहर फेंके जाने को दर्शाती है; ‘उछालता’ दृश्य बिंब को बिना नैतिक अर्थ जोड़े बनाए रखता है।
