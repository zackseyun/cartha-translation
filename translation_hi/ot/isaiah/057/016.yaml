id: ISA.57.16
reference: Isaiah 57:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י לֹ֤א לְ/עוֹלָם֙ אָרִ֔יב וְ/לֹ֥א לָ/נֶ֖צַח אֶקְּצ֑וֹף כִּי ר֨וּחַ֙ מִ/לְּ/פָנַ֣/י יַֽעֲט֔וֹף וּ/נְשָׁמ֖וֹת אֲנִ֥י עָשִֽׂיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/016.yaml
  text: For I will not contend forever[a], nor will I be angry without end, for the spirit would grow faint before me[b], and the breaths that I have made.
translation:
  language: hi
  text: क्योंकि मैं सदा विवाद नहीं करूँगा, न सदा क्रोधित रहूँगा; क्योंकि मेरे सामने प्राण और मेरे बनाए हुए जीवन-श्वासें क्षीण हो जाएँगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעוֹלָם
  choice: सदा
  rationale: नकारात्मक वाक्य में यह अनंत अवधि का भाव देता है; समानांतर पद לָנֶצַח के साथ ‘सदा’ सहज और काव्यात्मक है।
- source_word: אָרִיב
  choice: वाद-विवाद करता नहीं रहूँगा
  rationale: ריב में विरोध करने और न्यायिक विवाद का भाव है। ‘वाद-विवाद’ इस अर्थ-सीमा को बनाए रखता है, बिना इसे केवल मुक़दमे तक सीमित किए।
- source_word: לָנֶצַח
  choice: सदा
  rationale: यह לְעוֹלָם के समानांतर निरंतर, अंतहीन अवधि को व्यक्त करता है। हिंदी में पुनरावृत्ति मूल की काव्यात्मक समानता को बनाए रखती है।
- source_word: אֶקְּצֹף
  choice: क्रोधित रहूँगा
  rationale: קצף क्रोध या रोष को दर्शाता है; यह चयन स्पष्ट, वर्तमान और गरिमापूर्ण हिंदी है।
- source_word: רוּחַ
  choice: आत्मा
  rationale: संदर्भ में यह मनुष्य की ईश्वर-प्रदत्त जीवनदायिनी आत्मा या श्वास को सूचित करता है, परमेश्वर के आत्मा को नहीं। मूल की lexical ambiguity को पादटिप्पणी में रखा गया है।
- source_word: מִלְּפָנַי
  choice: मेरे सामने
  rationale: शाब्दिक ‘मेरे सम्मुख से’ की अपेक्षा ‘मेरे सामने’ स्वाभाविक हिंदी है और परमेश्वर की उपस्थिति अथवा उसके प्रकोप के सामने निर्बल होने का भाव बनाए रखता है।
- source_word: יַעֲטוֹף
  choice: शक्तिहीन हो जाएगी
  rationale: עטף यहाँ मूर्छित, दुर्बल या विफल हो जाने का भाव देता है। ‘शक्तिहीन हो जाएगी’ जीवधारी के क्रमशः चुक जाने को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: נְשָׁמוֹת
  choice: श्वासें
  rationale: נשמה का ठोस अर्थ ‘श्वास’ है। बहुवचन ‘श्वासें’ जीवन-श्वास और सृष्टि की छवि को सुरक्षित रखता है; ‘प्राण’ या ‘जीवन’ की व्याख्यात्मक संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: אֲנִי עָשִׂיתִי
  choice: जिन्हें मैंने बनाया है
  rationale: यह עשׂה के सामान्य अर्थ ‘बनाना’ को निकटता से रखता है। हिंदी का ‘मैंने’ कर्ता को पर्याप्त रूप से स्पष्ट करता है; अतिरिक्त आत्मवाचक बल मूल से अधिक जोर डाल सकता था।
theological_decisions:
- issue: רוּחַ और נְשָׁמוֹת की मानवशास्त्रीय भाषा
  choice: मुख्य पाठ में ‘आत्मा’ और ‘श्वासें’ रखकर इन्हें मनुष्य की सृजित जीवन-शक्ति के रूप में प्रस्तुत किया गया है।
  alternative: רוּחַ को ‘श्वास’ और נְשָׁמוֹת को ‘प्राण’, ‘जीवन’ या ‘आत्माएँ’ कहा जा सकता है।
  rationale: प्रसंग बताता है कि निरंतर दैवी क्रोध के सामने परमेश्वर द्वारा रचा गया जीवधारी चुक जाएगा। यहाँ पवित्र आत्मा का संकेत देना या ‘आत्मा’ को किसी विकसित पारिभाषिक मानवशास्त्र में बाँधना मूल से अधिक निश्चितता जोड़ता।
- issue: दैवी वाद-विवाद की अवधि
  choice: दोनों समानांतर पदों में ‘सदा’ रखकर इस कथन को व्यक्त किया गया है कि परमेश्वर का विरोध और क्रोध अंतहीन नहीं रहेगा।
  alternative: दूसरे पद को ‘बिना अंत के’ या ‘अनंत काल तक’ कहा जा सकता है।
  rationale: समान पुनरावृत्ति मूल के समानार्थी काव्यात्मक समानांतर को सुरक्षित रखती है और इस कथन के आश्वासन को बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के व्यक्त करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में गरिमापूर्ण और काव्यात्मक रखी गई है। ‘वाद-विवाद’ न्यायिक और संबंधपरक विरोध, दोनों की संभावना बनाए रखता है। ‘श्वासें’ साधारण गद्य में कम प्रचलित बहुवचन है, पर मूल की जीवन-श्वास वाली ठोस छवि और ‘जिन्हें मैंने बनाया है’ के सृष्टि-संबंधी बल को सुरक्षित रखने के लिए जानबूझकर चुना गया है।
