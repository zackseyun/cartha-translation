- from: क्योंकि मैं सदा वाद-विवाद करता नहीं रहूँगा, न सदा क्रोधित रहूँगा; क्योंकि मेरे सामने आत्मा[a] शक्तिहीन हो जाएगी, और वे श्वासें[b] भी, जिन्हें मैंने बनाया है।
  to: क्योंकि मैं सदा विवाद नहीं करूँगा, न सदा क्रोधित रहूँगा; क्योंकि मेरे सामने प्राण और मेरे बनाए हुए जीवन-श्वासें क्षीण हो जाएँगी।
