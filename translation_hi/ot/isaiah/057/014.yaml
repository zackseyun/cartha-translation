id: ISA.57.14
reference: Isaiah 57:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אָמַ֥ר סֹֽלּוּ סֹ֖לּוּ פַּנּוּ דָ֑רֶךְ הָרִ֥ימוּ מִכְשׁ֖וֹל מִ/דֶּ֥רֶךְ עַמִּֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/014.yaml
  text: And it will be said[a], “Build up, build up; clear the way; remove the stumbling block from the way of my people.”
translation:
  language: hi
  text: और कहा जाएगा[a], “मार्ग बनाओ, मार्ग बनाओ; रास्ता साफ़ करो; मेरी प्रजा के मार्ग से ठोकर का कारण दूर करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “ऊँचा करो, ऊँचा करो; मार्ग तैयार करो।” इब्रानी में सड़क बनाने या उसे ऊँचा उठाने का बिंब है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: और कहा जाएगा
  rationale: इब्रानी रूप में कर्ता स्पष्ट नहीं है। प्रसंग में यह अनिर्दिष्ट घोषणा-सूत्र की तरह समझा जा सकता है; इसलिए निष्क्रिय प्रयोग स्वाभाविक हिन्दी में मूल की संक्षिप्तता और अस्पष्टता बनाए रखता है।
- source_word: סֹלּוּ סֹלּוּ
  choice: मार्ग बनाओ, मार्ग बनाओ
  rationale: סלל यहाँ सड़क या राजमार्ग बनाने अथवा उसे ऊँचा उठाने का बिंब देता है। दोहराव आज्ञा के बल को व्यक्त करता है और ज्यों का त्यों रखा गया है।
- source_word: פַּנּוּ דָרֶךְ
  choice: रास्ता साफ़ करो
  rationale: פנה का आशय हटाकर स्थान बनाना या मार्ग साफ़ करना है। यह अभिव्यक्ति आधुनिक हिन्दी में सहज है और मार्ग से अवरोध हटाने का बिंब बनाए रखती है।
- source_word: הָרִימוּ
  choice: दूर करो
  rationale: रूप का शाब्दिक अर्थ ‘उठाओ’ है, पर מִכְשׁוֹל के साथ इसका आशय उसे उठाकर मार्ग से हटा देना है। ‘दूर करो’ हिन्दी में इस प्रसंग का स्वाभाविक और स्पष्ट अनुवाद है।
- source_word: מִכְשׁוֹל
  choice: ठोकर का कारण
  rationale: यह शब्द ऐसी वस्तु या बाधा को दर्शाता है जिससे कोई ठोकर खाए। ‘ठोकर का कारण’ इसके मूर्त और रूपकात्मक दोनों अर्थों को सुरक्षित रखता है।
- source_word: מִדֶּרֶךְ עַמִּי
  choice: मेरी प्रजा के मार्ग से
  rationale: מן हटाने या अलग करने का भाव देता है, और עַמִּי मार्ग के साथ संबंध प्रकट करता है। यह अनुवाद स्थानिक अर्थ और ‘मेरी प्रजा’ दोनों को बनाए रखता है।
theological_decisions:
- issue: आरम्भिक घोषणा में वक्ता की पहचान
  choice: कर्ता को अनिर्दिष्ट रखते हुए ‘कहा जाएगा’
  alternative: ‘उसने कहा,’ जिसमें परमेश्वर को निहित कर्ता माना जाए; अथवा ‘कोई कहेगा’
  rationale: इब्रानी पाठ कर्ता को स्पष्ट रूप से नहीं बताता। निष्क्रिय हिन्दी प्रयोग किसी विशेष वक्ता को आरोपित किए बिना इस धर्मवैचारिक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानार्थी ‘मार्ग’ और ‘रास्ता’ का प्रयोग हिन्दी में अनावश्यक पुनरावृत्ति घटाता है, जबकि मूल के मार्ग-निर्माण और बाधा हटाने के बिंब सुरक्षित रहते हैं।
