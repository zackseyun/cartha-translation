  text: वह शान्ति में प्रवेश करता है[a]; वे अपनी शय्याओं पर विश्राम करते हैं—हर वह व्यक्ति जो अपनी खराई में चलता है[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वह शान्ति में आता है।’ प्रसंग में इब्रानी क्रिया का अनुवाद दोनों प्रकार से किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में वचन बदलता है: ‘वह प्रवेश करता है ... वे विश्राम करते हैं ... जो अपनी खराई में चलता है।’'
    reason: alternative_reading
  - marker: c
    text: या ‘जो उसके सामने सीधा चलता है’ अथवा ‘जो सीधी चाल चलता है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבוֹא
  choice: प्रवेश करता है
  rationale: בוא का क़ाल अपूर्ण, तृतीय पुरुष एकवचन रूप है। काव्यात्मक प्रसंग में यह धर्मी व्यक्ति के शान्ति की अवस्था में आने को व्यक्त करता है; ‘प्रवेश करता है’ स्वाभाविक हिन्दी है, जबकि ‘आता है’ को पादटिप्पणी में रखा गया है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: यह शब्द शान्ति, कुशलता और सम्पूर्ण कल्याण का भाव रखता है। ‘शान्ति’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है तथा व्यापक अर्थ की गुंजाइश बनाए रखता है।
- source_word: יָנוּחוּ
  choice: वे ... विश्राम करते हैं
  rationale: נוח का क़ाल अपूर्ण, तृतीय पुरुष बहुवचन रूप है। यह धर्मियों को एक समूह के रूप में दिखाता है और मृत्यु में विश्राम के काव्यात्मक चित्र को बिना स्पष्ट व्याख्या जोड़े बनाए रखता है।
- source_word: עַל מִשְׁכְּבוֹתָם
  choice: अपनी शय्याओं पर
  rationale: शाब्दिक अर्थ ‘उनकी शय्याओं/लेटने के स्थानों पर’ है। ‘शय्याओं’ मृत्यु में विश्राम के रूपक को सुरक्षित रखते हुए गरिमापूर्ण और समझने योग्य हिन्दी देता है।
- source_word: הֹלֵךְ
  choice: जो ... चलता है
  rationale: הלך का पुल्लिंग एकवचन कृदन्त है। वर्तमानकालिक ‘चलता है’ उसके निरन्तर या चरित्रगत आचरण को दर्शाता और कृदन्त की कालगत खुलावट को बनाए रखता है।
- source_word: נְכֹחוֹ
  choice: अपनी खराई में
  rationale: यह संक्षिप्त पद सीधेपन या खराई का भाव व्यक्त करता है और इसमें तृतीय पुरुष एकवचन प्रत्यय है। ‘अपनी खराई में’ नैतिक अर्थ तथा एकवचन व्यक्ति से सम्बन्ध को सुरक्षित रखता है; अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: पद में एकवचन और बहुवचन का परिवर्तन
  choice: पहले खंड में एकवचन ‘वह ... प्रवेश करता है’, दूसरे में बहुवचन ‘वे ... विश्राम करते हैं’, और अन्त में वितरणात्मक एकवचन ‘हर वह व्यक्ति’ रखा गया है।
  alternative: पूरे पद को केवल एकवचन या केवल बहुवचन में एकरूप करना।
  rationale: इब्रानी पाठ स्वयं एकवचन से बहुवचन और फिर एकवचन कृदन्त की ओर जाता है। इस तनाव को मिटाने के बजाय हिन्दी में स्पष्ट किन्तु दृश्यमान रखा गया है।
- issue: मृत्यु और विश्राम का चित्र
  choice: शान्ति में प्रवेश और शय्याओं पर विश्राम का रूपक ज्यों का त्यों रखा गया है।
  alternative: इसे स्पष्ट रूप से कब्र में दफ़न होना या स्वर्गीय विश्राम कहना।
  rationale: प्रसंग मृत्यु में धर्मी के लिए शान्ति और विश्राम का सांत्वनापूर्ण चित्र देता है, पर मध्यावस्था के स्वरूप का विस्तार नहीं करता; इसलिए कोई अतिरिक्त सिद्धान्त नहीं जोड़ा गया।
- issue: נְכֹחוֹ का नैतिक और दिशात्मक अर्थ
  choice: मुख्य पाठ में ‘अपनी खराई में’ रखा गया है।
  alternative: ‘उसके सामने सीधा चलता है’ या ‘सीधी चाल चलता है’।
  rationale: पद का रूप संक्षिप्त और व्याख्यात्मक रूप से खुला है। मुख्य पाठ नैतिक सीधेपन को व्यक्त करता है, जबकि दिशात्मक सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज काव्यात्मक गद्य रखा गया है। ‘शय्याओं’ स्रोत के ‘बिछौनों/लेटने के स्थानों’ वाले रूपक को बचाता है, और ‘खराई’ नैतिक सीधेपन को बिना किसी सम्प्रदायगत व्याख्या के व्यक्त करता है।
