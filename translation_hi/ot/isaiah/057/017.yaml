  text: בַּ/עֲוֺ֥ן בִּצְע֛/וֹ קָצַ֥פְתִּי וְ/אַכֵּ֖/הוּ הַסְתֵּ֣ר וְ/אֶקְצֹ֑ף וַ/יֵּ֥לֶךְ שׁוֹבָ֖ב בְּ/דֶ֥רֶךְ לִבּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/017.yaml
  text: Because of the iniquity of his unjust gain I was angry[a], and I struck him; I hid myself and was angry[b], and he went on backsliding in the way of his heart.
translation:
  language: hi
  text: उसके अन्यायपूर्ण लाभ के पाप के कारण मैं क्रोधित हुआ[a] और मैंने उसे मारा; मैंने अपने को छिपाया और क्रोधित हुआ[b], और वह अपने मन की राह पर भटकता चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसके लोभ के पाप के कारण।’ हिब्रू शब्द लोभी इच्छा अथवा लोभ से पाए गए लाभ, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘मैंने अपना मुख छिपा लिया और क्रोधित हुआ।’ ‘मुख छिपाना’ बाइबल का सामान्य मुहावरा है, यद्यपि यहाँ हिब्रू पाठ में ‘मुख’ शब्द स्पष्ट रूप से नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲוֺן
  choice: अधर्म के कारण
  rationale: यहाँ ב उपसर्ग प्रसंगानुसार कारण बताता है। ‘अधर्म के कारण’ עָוֺן के नैतिक अर्थ और वाक्य के कारणात्मक संबंध, दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: בִּצְעוֹ
  choice: उसके अन्यायपूर्ण लाभ
  rationale: בֶּצַע लोभ से प्राप्त लाभ अथवा लोभपूर्ण लालसा, दोनों का बोध करा सकता है। मुख्य पाठ में ‘अन्यायपूर्ण लाभ’ उसके आर्थिक और नैतिक पक्ष को बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में है।
- source_word: קָצַפְתִּי / וְאֶקְצֹף
  choice: मैं क्रोधित हुआ / क्रोधित रहा
  rationale: קצף का अर्थ क्रोधित होना है। पहली क्रिया को ‘क्रोधित हुआ’ और दूसरी को प्रसंगानुकूल ‘क्रोधित रहा’ कहने से पुनरावृत्ति भी बनी रहती है और आधुनिक हिन्दी सहज रहती है।
- source_word: וְאַכֵּהוּ
  choice: और मैंने उसे मारा
  rationale: נכה के हिफ़ील रूप का मूल अर्थ मारना या प्रहार करना है। ‘मारा’ दंडात्मक कार्रवाई को ठोस और स्पष्ट रखता है।
- source_word: הַסְתֵּר
  choice: मैं छिप गया
  rationale: स्रोत में סתר का infinitive absolute रूप है और ‘मुख’ शब्द स्पष्टतः नहीं है। ‘मैं छिप गया’ इस संक्षिप्त अभिव्यक्ति को बिना अतिरिक्त संज्ञा जोड़े स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: וַיֵּלֶךְ שׁוֹבָב
  choice: वह ... भटकता चला गया
  rationale: הלך के साथ שׁוֹבָב निरंतर विमुख अथवा भटके हुए आचरण को व्यक्त करता है। ‘भटकता चला गया’ जारी रहने का भाव और राह का रूपक दोनों स्वाभाविक हिन्दी में रखता है।
- source_word: בְּדֶרֶךְ לִבּוֹ
  choice: अपने मन की राह पर
  rationale: यह वाक्यांश मन की प्रवृत्ति या इच्छा द्वारा निर्देशित आचरण का रूपक है। ‘अपने मन की राह पर’ हिब्रू बिंब को संक्षिप्त और बोधगम्य ढंग से बनाए रखता है।
theological_decisions:
- issue: הַסְתֵּר में परमेश्वर के छिपने की अभिव्यक्ति
  choice: मैं छिप गया
  alternative: मैंने अपना मुख छिपा लिया
  rationale: हिब्रू पाठ में ‘मुख’ स्पष्ट नहीं है, यद्यपि विस्तृत बाइबलीय मुहावरे में यह अर्थ संभव है। इसलिए मुख्य पाठ अतिरिक्त शब्द नहीं जोड़ता और प्रचलित मुहावरे को पादटिप्पणी में सुरक्षित रखता है।
- issue: בִּצְעוֹ में न्याय का नैतिक आधार
  choice: उसके अन्यायपूर्ण लाभ
  alternative: उसके लोभ
  rationale: शब्द भीतर की लोभी इच्छा और उससे पाए गए अनुचित लाभ, दोनों को सूचित कर सकता है। मुख्य पाठ ठोस आर्थिक अर्थ रखता है, जबकि वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘भटकता चला गया’ निरंतर विमुखता को सामान्य पाठक के लिए स्पष्ट करता है; ‘अपने मन की राह’ मूल रूपक को सुरक्षित रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
