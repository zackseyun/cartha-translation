id: ISA.57.10
reference: Isaiah 57:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/רֹ֤ב דַּרְכֵּ/ךְ֙ יָגַ֔עַתְּ לֹ֥א אָמַ֖רְתְּ נוֹאָ֑שׁ חַיַּ֤ת יָדֵ/ךְ֙ מָצָ֔את עַל כֵּ֖ן לֹ֥א חָלִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/010.yaml
  text: In the multitude of your ways you grew weary[a], yet you did not say, ‘It is hopeless.’ You found renewed strength in your hand[c][b]; therefore you did not grow weak.
translation:
  language: hi
  text: अपने अनेक मार्गों में तुम थक गईं, फिर भी तुमने नहीं कहा, “कोई आशा नहीं है।”[a] तुम्हें अपने हाथ में नया बल मिला;[b] इसलिए तुम निर्बल नहीं हुईं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह निराशाजनक है।” इब्रानी अभिव्यक्ति निराशा या आगे के प्रयास को निष्फल मान लेने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “तुमने अपने हाथ का जीवन/जीवन-बल पाया।” इस कठिन पदबंध का आशय काम जारी रखने के लिए नई शक्ति या क्षमता मिलना हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “तुम शिथिल नहीं हुईं”; अथवा, “तुम मूर्छित नहीं हुईं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב דַּרְכֵּךְ
  choice: अपने अनेक मार्गों के कारण
  rationale: רֹב बहुलता या अधिकता और דְּרָכִים मार्गों अथवा अपनाए गए उपायों को दर्शाता है। यह रूपक को बनाए रखते हुए उस थका देने वाली बहुविध खोज को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָגַעַתְּ
  choice: तुम थक गईं
  rationale: क्रिया परिश्रम से उत्पन्न थकावट बताती है। स्त्रीलिंग रूप उस स्त्रीरूप में संबोधित समुदाय के व्याकरण को प्रतिबिंबित करता है।
- source_word: נוֹאָשׁ
  choice: अब कोई आशा नहीं है
  rationale: यह निराश होकर प्रयास को व्यर्थ मान लेने का भाव देता है। उद्धरण के रूप में यह आधुनिक हिन्दी में सहज है; मूल में 'अब' स्पष्ट नहीं है, पर प्रसंगगत निष्कर्ष को स्वाभाविक बनाता है।
- source_word: חַיַּת יָדֵךְ
  choice: अपने हाथ में नया बल
  rationale: शाब्दिक रूप से कठिन पदबंध 'तेरे हाथ का जीवन/जीवन-बल' है। यहाँ 'हाथ' सामर्थ्य या कार्य-क्षमता का बिंब है और חַיַּת जीवन-शक्ति को सूचित करता है; इसलिए मुख्य पाठ में अर्थसंगत रूप रखा गया और शाब्दिक बिंब पादटिप्पणी में सुरक्षित है।
- source_word: מָצָאת
  choice: मिला
  rationale: מצא का मूल अर्थ पाना या मिलना है। हिन्दी में 'तुम्हें ... मिला' उसी प्राप्ति को सहज ढंग से व्यक्त करता है।
- source_word: עַל־כֵּן
  choice: इसलिए
  rationale: यह पिछले कथन से परिणाम का संबंध स्पष्ट करता है।
- source_word: לֹא חָלִית
  choice: तुम निर्बल नहीं हुईं
  rationale: חלה बीमार, दुर्बल या शिथिल होने का अर्थ दे सकता है। यहाँ लगातार प्रयास के संदर्भ में 'निर्बल नहीं हुईं' उपयुक्त है, जबकि अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
theological_decisions:
- issue: मूर्तिपूजक प्रयासों में दृढ़ बने रहने का मूल्यांकन
  choice: मुख्य पाठ लगातार प्रयास का वर्णन करता है, पर उसे प्रशंसनीय धैर्य कहकर नहीं सराहता।
  alternative: इसे कठिन यात्रा में सामान्य अथवा सराहनीय दृढ़ता के रूप में पढ़ा जा सकता है।
  rationale: यशायाह 57 का व्यापक संदर्भ संबोधित समुदाय की अविश्वासयोग्यता और मूर्तिपूजक खोज को धिक्कारता है। फिर भी यह मूल्यांकन अनुवाद में अतिरिक्त शब्द जोड़कर थोपने के बजाय संदर्भ से उभरने दिया गया है।
- issue: חַיַּת יָדֵךְ में शक्ति के फिर मिलने का भाव
  choice: इसे कार्य करते रहने के लिए मिले नए बल के रूप में व्यक्त किया गया है।
  alternative: शाब्दिक रूप 'अपने हाथ का जीवन' रखा जा सकता है, अथवा केवल 'अपनी शक्ति' कहा जा सकता है।
  rationale: मूल पदबंध संक्षिप्त और अस्पष्ट है। अर्थपूर्ण हिन्दी के लिए मुहावरे का संभावित आशय मुख्य पाठ में दिया गया है, पर उसकी ठोस 'हाथ/जीवन' छवि पादटिप्पणी में बताई गई है ताकि अस्पष्टता पूरी तरह न मिटे।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी अपनाई गई है। स्त्रीलिंग संबोधन मूल के स्त्रीलिंग क्रियारूपों को दर्शाता है। 'तुम' वर्तमान हिन्दी में 'तू' से अधिक स्वाभाविक और कम अपमानसूचक है, जबकि भविष्यवाणी के सीधे संबोधन की शक्ति बनाए रखता है।
