source:
  edition: WLC
  text: וַ/תָּשֻׁ֤רִי לַ/מֶּ֨לֶךְ֙ בַּ/שֶּׁ֔מֶן וַ/תַּרְבִּ֖י רִקֻּחָ֑יִ/ךְ וַ/תְּשַׁלְּחִ֤י צִרַ֨יִ/ךְ֙ עַד מֵ֣/רָחֹ֔ק וַ/תַּשְׁפִּ֖ילִי עַד שְׁאֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/009.yaml
  text: You journeyed to the king with oil[a], and multiplied your perfumes; you sent your envoys far away[b], and debased yourself even to Sheol.
translation:
  language: hi
  text: तू तेल लेकर राजा के पास गई[a]; तूने अपने सुगंधित लेप बहुत बढ़ाए। तूने अपने दूत बहुत दूर भेजे और अपने को अधोलोक तक नीचा किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “मोलेक के पास,” यदि “राजा” उस देवता की ओर संकेत करने वाली उपाधि है।
    reason: alternative_reading
  - marker: b
    text: अधोलोक से आशय मृतकों का लोक है।
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּשֻׁרִי
  choice: तू ... गई
  rationale: क्रिया कठिन है, पर राजा के पास तेल लेकर जाने और दूत भेजने के प्रसंग में जाना या प्रस्थान करना सबसे स्वाभाविक अर्थ है। हिंदी में ‘गई’ स्त्रीलिंग संबोधन को स्पष्ट और सहज रखता है।
- source_word: לַמֶּלֶךְ
  choice: राजा के पास
  rationale: व्यंजन-पाठ का सीधा अर्थ ‘राजा’ है। मोलेक की ओर संकेत संभव है, पर उसे मुख्य पाठ में निश्चित न करके पादटिप्पणी में रखा गया है।
- source_word: בַּשֶּׁמֶן
  choice: तेल लेकर
  rationale: שמן का ठोस अर्थ ‘तेल’ है; यहाँ यह सुगंधित तेल, भेंट या प्रणय/कूटनीतिक तैयारी का संकेत दे सकता है।
- source_word: וַתַּרְבִּי רִקֻּחָיִךְ
  choice: अपने सुगंध-द्रव्यों को बहुत बढ़ाया
  rationale: רקחים मिश्रित सुगंधित पदार्थों को सूचित करता है। ‘सुगंध-द्रव्य’ अर्थ-सीमा बनाए रखता है और רבה की प्रचुरता को ‘बहुत बढ़ाया’ व्यक्त करता है।
- source_word: צִרַיִךְ
  choice: अपने दूत
  rationale: यह शब्द संदेशवाहकों या राजनयिक प्रतिनिधियों के लिए प्रयुक्त है। ‘दूत’ आधुनिक हिंदी में संक्षिप्त और दोनों संभावनाओं के लिए पर्याप्त व्यापक है।
- source_word: עַד מֵרָחֹק
  choice: दूर-दूर तक
  rationale: यह अत्यधिक दूरी व्यक्त करता है; ‘दूर-दूर तक’ स्वाभाविक हिंदी में व्यापक पहुँच का भाव देता है।
- source_word: וַתַּשְׁפִּילִי
  choice: अपने आपको ... गिरा दिया
  rationale: मूल क्रिया नीचा करने को व्यक्त करती है। नकारात्मक प्रसंग में यह आत्म-अपमान या पतन का बोध देती है; हिंदी वाक्यांश उस तीखे आरोप को बनाए रखता है।
- source_word: עַד שְׁאוֹל
  choice: अधोलोक तक
  rationale: שְׁאוֹל मृतकों के लोक को सूचित करता है, केवल व्यक्तिगत कब्र को नहीं। ‘अधोलोक’ हिंदी में इसका सुलभ और गरिमापूर्ण समतुल्य है।
theological_decisions:
- issue: ‘राजा’ से सामान्य शासक अभिप्रेत है या मोलेक देवता की ओर संकेत
  choice: मुख्य पाठ में ‘राजा’
  alternative: मोलेक
  rationale: मसोरेटिक पाठ स्पष्टतः ‘राजा’ पढ़ता है और प्रसंग राजनीतिक गठबंधन अथवा मूर्तिपूजक बेवफाई—दोनों की छवि सह सकता है। मोलेक की संभावना को पादटिप्पणी में रखकर वास्तविक व्याख्यात्मक अस्पष्टता सुरक्षित की गई है।
translation_notes:
  register: आधुनिक मानक हिंदी; स्त्रीलिंग एकवचन ‘तू’ मूल के सीधे, अभियोगात्मक संबोधन को बनाए रखता है। भाषा सरल किंतु गरिमापूर्ण है। ‘सुगंध-द्रव्य’ और ‘अधोलोक’ जैसे पद मूल की ठोस तथा सांस्कृतिक छवियों को बिना अनावश्यक सांप्रदायिक व्याख्या के सुरक्षित रखते हैं।
