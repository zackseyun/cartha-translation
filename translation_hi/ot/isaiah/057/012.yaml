  text: I myself will declare your righteousness and your works[b][a], but they will not profit you.
translation:
  language: hi
  text: मैं स्वयं तेरी धार्मिकता[a] और तेरे कामों को प्रकट करूँगा, पर वे तुझे लाभ नहीं पहुँचाएँगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरी न्यायपरायणता’; इब्रानी शब्द का अर्थ संदर्भ के अनुसार ‘धार्मिकता’ या ‘न्यायपरायणता’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘वे तेरे किसी काम न आएँगे’ अथवा ‘वे तेरी सहायता नहीं करेंगे।’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: मैं स्वयं
  rationale: स्वतंत्र सर्वनाम कर्ता पर बल देता है; ‘मैं स्वयं’ उस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אַגִּיד
  choice: वर्णन करूँगा
  rationale: נגד के हिफ़ील रूप का अर्थ बताना, घोषित करना या प्रकट करना हो सकता है। यहाँ परमेश्वर द्वारा संबोधित व्यक्ति की कथित धार्मिकता और कामों को सामने रखने के न्यायिक-सा भाव के लिए ‘वर्णन करूँगा’ स्वाभाविक है, बिना ‘पोल खोलूँगा’ जैसा अतिरिक्त अर्थ जोड़े।
- source_word: צִדְקָתֵךְ
  choice: तेरी धार्मिकता
  rationale: צדקה का मूल अर्थ धार्मिकता या न्यायपरायणता है। संदर्भ में यह कथित धार्मिकता संभवतः व्यंग्यात्मक है, पर मुख्य पाठ में व्यंग्य को स्पष्ट करके अर्थ को समय से पहले तय नहीं किया गया।
- source_word: וְאֶת מַעֲשַׂיִךְ
  choice: और तेरे कामों का
  rationale: מַעֲשִׂים के लिए ‘काम’ सरल, व्यापक और प्रचलित हिन्दी है तथा अच्छे या बुरे कर्म का निर्णय संदर्भ पर छोड़ता है।
- source_word: וְלֹא יוֹעִילוּךְ
  choice: पर वे तेरे किसी काम न आएँगे
  rationale: יעל के हिफ़ील रूप में लाभ पहुँचाने या सहायता करने का अर्थ है। यह हिन्दी मुहावरा दोनों अर्थों को स्वाभाविक रूप से व्यक्त करता है; ‘पर’ पूर्ववर्ती दावे और निष्फलता के बीच निहित विरोध स्पष्ट करता है।
theological_decisions:
- issue: ‘तेरी धार्मिकता’ का संदर्भगत स्वर
  choice: साधारण रूप ‘तेरी धार्मिकता’ रखा गया, ताकि विडंबना या दोषारोपण संदर्भ से प्रकट हो।
  alternative: ‘तेरी तथाकथित धार्मिकता’ अथवा ‘तेरे धर्म के काम’
  rationale: संदर्भ झूठी भक्ति या आत्म-धार्मिकता की भर्त्सना की ओर संकेत करता है, किंतु ‘तथाकथित’ जोड़ना मूल से अधिक स्पष्ट व्याख्या होती।
- issue: कामों की निष्फलता
  choice: ‘वे तेरे किसी काम न आएँगे’
  alternative: ‘वे तुझे लाभ नहीं पहुँचाएँगे’ अथवा ‘वे तेरी सहायता नहीं करेंगे’
  rationale: मूल क्रिया लाभ और सहायता दोनों अर्थ दे सकती है। चुनी हुई अभिव्यक्ति इस अर्थ-परास को बनाए रखते हुए कर्मों की उद्धार या रक्षा करने में असमर्थता को अनावश्यक रूप से सिद्धांतबद्ध नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। एकवचन स्त्रीलिंग संबोधन के लिए ‘तेरी/तेरे’ रखा गया है, क्योंकि इब्रानी प्रत्यय स्त्रीलिंग एकवचन हैं और निकट संदर्भ में यरूशलेम/समुदाय का व्यक्तिकरण है। पदक्रम मूल के निकट है, जबकि अंतिम क्रिया को स्वाभाविक हिन्दी मुहावरे में व्यक्त किया गया है।
