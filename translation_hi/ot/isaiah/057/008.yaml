base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/008.yaml
  text: Behind the door and the doorpost you set up your memorial[a]; for away from me you uncovered yourself and went up; you made your bed wide, and you made a covenant for yourself with them; you loved their bed[c][b]; you looked on a hand.
translation:
  language: hi
  text: दरवाज़े और चौखट के पीछे तुमने अपना स्मृति-चिह्न रखा[a]; क्योंकि मुझसे दूर होकर तुमने अपने को उघाड़ा और ऊपर चढ़ गई; तुमने अपना बिछौना चौड़ा किया और अपने लिए उनके साथ वाचा बाँधी[b]; तुमने उनके बिछौने से प्रेम किया; तुमने एक हाथ को देखा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपना स्मरण-चिह्न रखा।” इब्रानी शब्द किसी स्मारक, स्मरण कराने वाले चिह्न या प्रतीक को दर्शा सकता है; इस प्रसंग में यह छिपाकर रखा गया मूर्तिपूजक चिह्न हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक मुहावरा “अपने लिए उनके साथ काटा” है। इब्रानी में वाचा बाँधने की भाषा प्रयुक्त हुई है, यद्यपि यहाँ “वाचा” संज्ञा स्पष्ट रूप से नहीं लिखी गई।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में “तुमने एक हाथ को देखा।” यह वाक्यांश अस्पष्ट है। “हाथ” यहाँ किसी स्मारक या खड़े किए गए चिह्न को अथवा किसी यौन संकेत को भी दर्शा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחַר הַדֶּלֶת וְהַמְּזוּזָה
  choice: दरवाज़े और उसकी चौखट के पीछे
  rationale: אַחַר का स्थानवाचक अर्थ ‘पीछे’ है और מְזוּזָה दरवाज़े की बाजू की चौखट/द्वार-स्तंभ को दर्शाता है, देहरी को नहीं। ‘उसकी’ जोड़ने से हिन्दी में दोनों संज्ञाओं का संबंध स्वाभाविक रूप से स्पष्ट होता है।
- source_word: שַׂמְתְּ זִכְרוֹנֵךְ
  choice: तुमने अपना स्मृति-चिह्न रखा
  rationale: זִכָּרוֹן स्मरण कराने वाली ठोस वस्तु या चिह्न हो सकता है। प्रसंग में यह मूर्तिपूजक प्रतीक हो सकता है, पर मुख्य पाठ में ‘मूर्ति’ कहना मूल की अस्पष्टता को अनावश्यक रूप से समाप्त कर देगा।
- source_word: כִּי מֵאִתִּי גִּלִּית
  choice: क्योंकि मुझसे दूर होकर तुमने अपने को उघाड़ा
  rationale: מֵאִתִּי अलगाव का भाव देता है, जबकि גלה यहाँ अपने को उघाड़ने के लज्जाजनक अथवा यौन संकेत को बनाए रखता है।
- source_word: וַתַּעֲלִי
  choice: और ऊपर चढ़ गई
  rationale: עלה का मूल अर्थ ऊपर जाना/चढ़ना है। इससे ऊँचे पूजा-स्थल की संभावित अनुगूँज बनी रहती है, पर उसे मुख्य पाठ में निश्चित नहीं किया जाता।
- source_word: הִרְחַבְתְּ מִשְׁכָּבֵךְ
  choice: तुमने अपना बिछौना चौड़ा किया
  rationale: हिफ़ील रूप ‘चौड़ा किया’ और מִשְׁכָּב ‘बिछौना/शयन-स्थान’ है। यह अनुवाद मूल के यौन रूपक को ज्यों का त्यों रखता है।
- source_word: וַתִּכְרָת לָךְ מֵהֶם
  choice: अपने लिए उनके साथ वाचा बाँधी
  rationale: כרת का शाब्दिक अर्थ ‘काटना’ है, पर यह वाचा करने का स्थापित सामी मुहावरा है। मूल में בְּרִית संज्ञा व्यक्त नहीं है, इसलिए यह बात पादटिप्पणी में बताई गई है।
- source_word: אָהַבְתְּ מִשְׁכָּבָם
  choice: तुमने उनके बिछौने से प्रेम किया
  rationale: यह शब्दशः यौन रूपक को सुरक्षित रखता है और इसे केवल मूर्तिपूजा या केवल राजनीतिक गठबंधन के अर्थ में सीमित नहीं करता।
- source_word: יָד חָזִית
  choice: तुमने एक हाथ को देखा
  rationale: יָד का सामान्य अर्थ ‘हाथ’ और חזה का अर्थ देखना/निहारना है। वाक्यांश अत्यंत कठिन और अस्पष्ट है; इसलिए मुख्य पाठ में निकटस्थ अर्थ और पादटिप्पणी में संभावित अर्थ दिए गए हैं।
theological_decisions:
- issue: यहूदा के धर्मत्याग के लिए यौन और मूर्तिपूजक रूपक
  choice: मुख्य पाठ में उघाड़ने, बिछौने और प्रेम करने की यौन छवियाँ बनाए रखी गईं।
  alternative: पूरे पद को सीधे मूर्तिपूजा अथवा राजनीतिक संधियों का वर्णन बनाना।
  rationale: यशायाह की भाषा वाचा-विहीनता को यौन बेवफ़ाई, मूर्तिपूजा और संभवतः अनुचित गठबंधनों की परस्पर जुड़ी छवियों में प्रस्तुत करती है। किसी एक व्याख्या को मुख्य पाठ में थोपना मूल का तनाव मिटा देगा।
- issue: וַתִּכְרָת में वाचागत आशय
  choice: ‘वाचा बाँधी’
  alternative: ‘समझौता किया’ अथवा शाब्दिक ‘काटा’
  rationale: ‘वाचा बाँधना’ हिन्दी में खרת के स्थापित वाचागत मुहावरे को व्यक्त करता है; फिर भी संज्ञा के मूल पाठ में न होने की सूचना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली रखी गई है। स्त्रीलिंग एकवचन इब्रानी संबोधन को ‘तुम’ और ‘चढ़ गई’ से दर्शाया गया है। ‘स्मृति-चिह्न’, ‘वाचा’ और ‘बिछौना’ मूल की ठोस छवियों और धार्मिक-यौन तनाव को सुरक्षित रखते हैं।
