source:
  edition: WLC
  text: בְּ/חַלְּקֵי נַ֣חַל חֶלְקֵ֔/ךְ הֵ֥ם הֵ֖ם גּוֹרָלֵ֑/ךְ גַּם לָ/הֶ֞ם שָׁפַ֥כְתְּ נֶ֨סֶךְ֙ הֶעֱלִ֣ית מִנְחָ֔ה הַ֥/עַל אֵ֖לֶּה אֶנָּחֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/006.yaml
  text: Among the smooth stones of the valley is your portion[a]; they, they are your lot. Even to them you have poured out a drink offering; you have offered up a grain offering[b]. Shall I relent because of these things?
translation:
  language: hi
  text: नाले के चिकने पत्थरों के बीच तेरा हिस्सा है[a]; वे ही, वे ही तेरा भाग हैं। उनके लिए भी तूने पेयबलि उंडेली है और अन्नबलि चढ़ाई है। क्या इन बातों के कारण मैं अपना मन बदलूँ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नाले के हिस्सों में तेरा हिस्सा है।” इब्रानी पद सम्भवतः नाले की तलहटी के चिकने पत्थरों की ओर संकेत करता है, जो यहाँ मूर्तिपूजा के प्रसंग के अनुकूल है।
    reason: lexical_alternative
  - marker: b
    text: या, “क्या इन बातों पर मुझे सांत्वना मिलेगी?” इब्रानी क्रिया का अर्थ सांत्वना पाना या शांत होना भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּחַלְּקֵי נַחַל
  choice: घाटी के नाले के चिकने पत्थरों में
  rationale: חַלְּקֵי को चिकनेपन से संबंधित मानकर नाले की तलहटी के चिकने पत्थरों के रूप में लिया गया है; मूर्तिपूजक उपासना का संदर्भ और आगे आने वाला बहुवचन सर्वनाम इस अर्थ के अनुकूल हैं।
- source_word: חֶלְקֵךְ
  choice: तेरा भाग
  rationale: חלק किसी को मिले भाग या हिस्से को दर्शाता है और अगले גורל के साथ आवंटन-संबंधी समानांतरता बनाए रखता है।
- source_word: הֵם הֵם
  choice: वे ही, वे ही
  rationale: दोहराव का स्पष्ट अनुवाद इब्रानी के बलाघात और व्यंग्यपूर्ण आरोप को सुरक्षित रखता है।
- source_word: גּוֹרָלֵךְ
  choice: तेरा बँटवारा
  rationale: גורל चिट्ठी डालकर मिले हिस्से या आवंटन को सूचित करता है; 'बँटवारा' आधुनिक हिन्दी में इसी भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נֶסֶךְ
  choice: पेयबलि
  rationale: यह उंडेली जाने वाली बलि का पारिभाषिक शब्द है; 'पेयबलि उंडेली' क्रिया और बलिदानी अर्थ दोनों को स्पष्ट रखता है।
- source_word: הֶעֱלִית מִנְחָה
  choice: अन्नबलि चढ़ाई
  rationale: बलिदानी संदर्भ में עלה का हिफ़ील रूप चढ़ाने और מנחה अन्नबलि को दर्शाता है; यह हिन्दी में स्वाभाविक धार्मिक शब्दावली है।
- source_word: הַעַל אֵלֶּה אֶנָּחֵם
  choice: क्या इन बातों के कारण मैं मान जाऊँ?
  rationale: निफ़ाल נחם यहाँ अपना रुख बदलने या दण्ड से पीछे हटने का भाव दे सकता है। प्रश्नात्मक और नकारात्मक आशय रखते हुए 'मान जाऊँ' किसी अतिरिक्त दण्ड-विवरण को पाठ में नहीं जोड़ता।
theological_decisions:
- issue: समापन के आलंकारिक प्रश्न का अर्थ
  choice: परमेश्वर के मान जाने या अपने घोषित रुख से हटने का प्रश्न
  alternative: इन कार्यों से परमेश्वर को सांत्वना मिलने या उसके शांत/प्रसन्न होने का प्रश्न
  rationale: आसपास का प्रसंग मूर्तिपूजक उपासना की निन्दा करता है, इसलिए प्रश्न का अपेक्षित उत्तर नकारात्मक है। मुख्य पाठ נחם के 'मान जाने/पीछे हटने' वाले अर्थ को रखता है, जबकि 'सांत्वना मिलने' की वास्तविक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। स्त्रीलिंग एकवचन सम्बोधन के अनुरूप 'तूने' और 'तेरा' का प्रयोग हुआ है। 'वे ही, वे ही' जानबूझकर रखा गया है ताकि मूल का emphatic दोहराव न मिटे।
