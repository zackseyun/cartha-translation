  yaml_path: translation/ot/isaiah/057/018.yaml
  text: I have seen his ways[a], and I will heal him; I will lead him and restore comforts to him and to his mourners.
translation:
  language: hi
  text: मैंने उसके चालचलन को देखा है, और मैं उसे चंगा करूँगा; मैं उसकी अगुवाई करूँगा और उसे तथा उसके लिए शोक मनानेवालों को सांत्वनाएँ प्रदान करूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּרָכָיו
  choice: उसके चालचलन
  rationale: बहुवचन ‘मार्ग’ यहाँ व्यक्ति के आचरण या जीवन-व्यवहार को सूचित करता है। ‘चालचलन’ आधुनिक हिन्दी में यह नैतिक अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: רָאִיתִי
  choice: मैंने ... देखा है
  rationale: पूर्ण क्रिया को वर्तमान प्रासंगिकता सहित रखा गया है; परमेश्वर का देखा हुआ आचरण आगे की प्रतिज्ञाओं की पृष्ठभूमि है।
- source_word: וְאֶרְפָּאֵהוּ
  choice: मैं उसे चंगा करूँगा
  rationale: רפא का सामान्य अर्थ ‘चंगा करना’ है; यह यहाँ शारीरिक और रूपकात्मक पुनर्स्थापन, दोनों की गुंजाइश बनाए रखता है।
- source_word: וְאַנְחֵהוּ
  choice: मैं उसकी अगुवाई करूँगा
  rationale: נחה के हिफ़ील रूप का अर्थ अगुवाई या मार्गदर्शन करना है। ‘अगुवाई करूँगा’ परमेश्वर द्वारा व्यक्तिगत रूप से दिशा देने का भाव रखता है।
- source_word: וַאֲשַׁלֵּם
  choice: फिर से ... दूँगा
  rationale: पिएल שׁלם यहाँ सांत्वना को लौटा देने, पूरा करने या बहाल करने का भाव रखता है। सहज हिन्दी में ‘फिर से ... दूँगा’ पुनर्स्थापन को स्पष्ट करता है।
- source_word: נִחֻמִים
  choice: सांत्वना
  rationale: इब्रानी संज्ञा बहुवचन है, पर हिन्दी में ‘सांत्वना’ सामान्यतः भाववाचक एकवचन के रूप में अधिक स्वाभाविक है।
- source_word: לּוֹ
  choice: उसे
  rationale: ל उस व्यक्ति को सांत्वना पानेवाले के रूप में चिह्नित करता है; हिन्दी में ‘उसे’ सहज है।
- source_word: וְלַאֲבֵלָיו
  choice: तथा उसके लिए शोक मनानेवालों को
  rationale: सप्रत्यय אֲבֵלָיו का अर्थ उसके शोक मनानेवाले या उसके लिए विलाप करनेवाले लोग है। विस्तृत रूप सम्बन्ध को ‘उसके शोकाकुल जन’ की अपेक्षा अधिक स्पष्ट करता है।
theological_decisions:
- issue: पुनर्स्थापन के प्रसंग में ‘उसके चालचलन’ का नैतिक बल
  choice: पद कहता है कि परमेश्वर ने उस व्यक्ति का चालचलन देखा है, फिर भी उसे चंगा करने और उसकी अगुवाई करने की प्रतिज्ञा करता है।
  alternative: ‘उसके मार्ग’ कहकर मुहावरे को अक्षरशः रखा जा सकता है, या पद में स्पष्ट न होने पर भी इसे पश्चात्ताप के रूप में व्याख्यायित किया जा सकता है।
  rationale: इब्रानी पाठ व्यक्ति के ‘मार्गों’ का उल्लेख करता है, लेकिन इसी पद में उसके पश्चात्ताप को स्पष्ट नहीं करता। ‘फिर भी’ निहित विरोध को हिन्दी में स्पष्ट करता है और परमेश्वर के पूर्ण ज्ञान तथा दया के बीच तनाव को बनाए रखता है, बिना पश्चात्ताप को पाठ में जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चालचलन’ नैतिक जीवन-व्यवहार को व्यक्त करता है; ‘चंगा’ मूल की उपचार-छवि बनाए रखता है। ‘फिर भी’ इब्रानी वाक्यक्रम में निहित विरोध को स्वाभाविक हिन्दी में सामने लाता है। पादटिप्पणी-चिह्न उसी शब्द पर रखा गया है जिससे उसका सम्बन्ध है।
