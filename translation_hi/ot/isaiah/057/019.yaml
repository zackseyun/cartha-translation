id: ISA.57.19
reference: Isaiah 57:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בּוֹרֵ֖א נוב שְׂפָתָ֑יִם שָׁל֨וֹם שָׁל֜וֹם לָ/רָח֧וֹק וְ/לַ/קָּר֛וֹב אָמַ֥ר יְהוָ֖ה וּ/רְפָאתִֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/019.yaml
  text: 'Creating the fruit of the lips: Peace[a], peace to the one far off and to the one near, says Yahweh[c][b], and I will heal him.'
translation:
  language: hi
  text: 'यहोवा, जो होठों का फल उत्पन्न करता है, कहता है: “दूरवाले[a] को और निकटवाले[a] को शांति, शांति[b]; और मैं उसे चंगा करूँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दूरवाला” और “निकटवाला” तात्कालिक रूप से बिखरे हुए और पास रहनेवाले परमेश्वर के लोगों को सूचित कर सकते हैं; बाद के पवित्रशास्त्र में यह भाषा अधिक व्यापक रूप से भी प्रतिध्वनित होती है।
    reason: cross_reference
  - marker: b
    text: “शांति, शांति” में इब्रानी की बलसूचक पुनरुक्ति सुरक्षित रखी गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹרֵא
  choice: उत्पन्न करनेवाला
  rationale: काल (Qal) कृदन्त की संक्षिप्त, निरन्तर विशेषता को बनाए रखता है और इसका कर्ता यहोवा ही समझा जाता है; इसे अनावश्यक रूप से पूर्ण क्रिया में नहीं बदला गया।
- source_word: נוב שְׂפָתָיִם
  choice: होठों का फल
  rationale: 'मूल रूपक को सुरक्षित रखता है: होठ जो उत्पन्न करते हैं, अर्थात वाणी; इसे केवल ‘स्तुति’ कहना अर्थ को आवश्यकता से अधिक सीमित कर देता।'
- source_word: שָׁלוֹם שָׁלוֹם
  choice: शान्ति, शान्ति
  rationale: इब्रानी पुनरुक्ति के बल और शालोम के व्यापक अर्थ—शान्ति, कुशल और सम्पूर्णता—को सुरक्षित रखता है।
- source_word: לָרָחוֹק וְלַקָּרוֹב
  choice: दूरवाले को और निकटवाले को
  rationale: לְ को प्राप्तकर्ता के रूप में व्यक्त करता है और एकवचन विशेषणों के संज्ञात्मक प्रयोग को स्वाभाविक हिन्दी में रखता है।
- source_word: אָמַר יְהוָה
  choice: यहोवा कहता है
  rationale: भविष्यद्वाणी की घोषणा में אָמַר का वर्तमान घोषणात्मक बल स्वाभाविक हिन्दी में व्यक्त होता है; परमेश्वर के व्यक्तिगत नाम को ‘यहोवा’ के रूप में रखा गया है।
- source_word: וּרְפָאתִיו
  choice: और मैं उसे चंगा करूँगा
  rationale: सन्दर्भ में वाव सहित पूर्ण क्रिया को प्रतिज्ञात्मक/परिणामसूचक भविष्य के रूप में लिया गया है; ‘चंगा करना’ शारीरिक और पुनर्स्थापनात्मक दोनों अनुगूँजें बनाए रखता है।
theological_decisions:
- issue: ‘दूरवाला’ और ‘निकटवाला’ किसे कहते हैं
  choice: दोनों पदों को बिना स्पष्ट पहचान निर्धारित किए सामान्य वर्णन के रूप में रखा गया है।
  alternative: इन्हें केवल बिखरे हुए और देश में रहनेवाले इस्राएली मानना, अथवा यहूदियों और अन्यजातियों पर व्यापक रूप से लागू करना।
  rationale: तात्कालिक सन्दर्भ परमेश्वर के लोगों की पुनर्स्थापना की ओर संकेत करता है, पर इब्रानी पाठ स्वयं इन समूहों की स्पष्ट पहचान नहीं देता; इसलिए मूल की खुली हुई अर्थ-सम्भावना सुरक्षित रखी गई है।
- issue: ‘होठों का फल’ का आशय
  choice: रूपक को मुख्य पाठ में यथावत रखा गया है।
  alternative: इसे सीधे ‘स्तुति’ या ‘अंगीकार’ कहना।
  rationale: यह वाक्यांश सम्भवतः स्तुति या अंगीकार की वाणी की ओर संकेत करता है, लेकिन पाठ उसका अर्थ केवल उसी तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण, सहज शैली अपनाई गई है। ‘होठों का फल’ और ‘शान्ति, शान्ति’ जैसे मूल इब्रानी बिम्ब और पुनरुक्ति जानबूझकर सुरक्षित रखे गए हैं।
