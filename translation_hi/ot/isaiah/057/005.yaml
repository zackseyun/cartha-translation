base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/005.yaml
  text: you who burn with lust among the terebinths[a], under every green tree, who slaughter the children in the wadis[b], under the clefts of the rocks.
translation:
  language: hi
  text: तुम जो तेरेबिन्थ वृक्षों[a] के बीच और हर हरे-भरे पेड़ के नीचे वासना से जलते हो, और जो नदी-घाटियों[b] में, चट्टानों की दरारों के नीचे, बच्चों का वध करते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बांज वृक्षों।” इब्रानी शब्द सामान्य रूप से पवित्र माने जाने वाले बड़े वृक्षों की ओर भी संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “घाटियों में।” यहाँ ऐसी खड्डें या घाटियाँ अभिप्रेत हो सकती हैं जिनमें मौसम के अनुसार जलधारा बहती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֵּחָמִים
  choice: वासना से जलते हो
  rationale: संदर्भ में यह बहुवचन कृदंत मूर्तिपूजक और संभवतः काम-संबंधी अनुष्ठानों के बीच कामोत्तेजना या भीतर से भड़कने का भाव देता है। यह अनुवाद उस आरोप को आधुनिक हिन्दी में स्पष्ट करता है, पर उसके साथ कोई अतिरिक्त सांप्रदायिक व्याख्या नहीं जोड़ता।
- source_word: בָּאֵלִים
  choice: तेरेबिन्थ वृक्षों के बीच
  rationale: समानांतर वाक्यांश ‘हर हरे-भरे पेड़ के नीचे’ से यहाँ ‘देवताओं’ की अपेक्षा बड़े पवित्र माने जाने वाले वृक्षों का अर्थ अधिक संभावित है। विशिष्ट वृक्ष-संज्ञा को मुख्य पाठ में रखा गया है और ‘बांज’ का विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: תַּחַת כָּל עֵץ רַעֲנָן
  choice: हर हरे-भरे पेड़ के नीचे
  rationale: यह मूल बिंब और अवैध उपासना-स्थलों से जुड़ी प्रचलित इब्रानी अभिव्यक्ति, दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: שֹׁחֲטֵי הַיְלָדִים
  choice: बच्चों का वध करते हो
  rationale: ‘वध’ मूल क्रिया की हिंसा और उसके संभावित बलिदानी संदर्भ को बनाए रखता है, जबकि ‘बलि चढ़ाते’ कहकर संदर्भ से अधिक स्पष्टता नहीं जोड़ता।
- source_word: בַּנְּחָלִים
  choice: नदी-घाटियों में
  rationale: נחל ऐसी घाटी या खड्ड को सूचित कर सकता है जिसमें मौसमी जलधारा बहती है। ‘नदी-घाटी’ हिन्दी पाठक के लिए ‘वाडी’ की अपेक्षा अधिक बोधगम्य है।
- source_word: תַּחַת סְעִפֵי הַסְּלָעִים
  choice: चट्टानों की दरारों के नीचे
  rationale: चट्टानों के साथ סְעִפִים शाखाओं या विभाजनों से विकसित अर्थ में दरारों, फटी जगहों अथवा निकली हुई शिलाओं को सूचित करता है। ‘दरारों’ छिपे हुए पथरीले स्थान का स्वाभाविक हिन्दी बिंब देता है।
theological_decisions:
- issue: आरंभिक कृदंत में निहित काम-संबंधी और उपासना-संबंधी भाव को कितना स्पष्ट किया जाए
  choice: ‘वासना से जलते हो’
  alternative: ‘अपने आपको भड़काते हो’ या ‘तप्त होते हो’
  rationale: वृक्षों के नीचे की मूर्तिपूजा और आगे उल्लिखित बाल-वध का संदर्भ काम-संबंधी धार्मिक उन्माद की ओर संकेत करता है। चुना हुआ पाठ इस प्रबल संभावित अर्थ को व्यक्त करता है, किंतु इसे किसी विशिष्ट संप्रदाय की धर्मशिक्षा में नहीं बदलता।
- issue: אֵלִים को वृक्ष माना जाए या देवता
  choice: ‘तेरेबिन्थ वृक्षों’
  alternative: ‘देवताओं के बीच’
  rationale: ‘हर हरे-भरे पेड़ के नीचे’ वाला निकट समानांतर वृक्ष-अर्थ का दृढ़ समर्थन करता है। फिर भी इब्रानी रूप की शब्दगत अस्पष्टता को निर्णय-सूची में स्वीकार किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। ‘तेरेबिन्थ’ अपरिचित वनस्पति-संज्ञा होने पर भी मूल की विशिष्टता बचाता है; पादटिप्पणी परिचित विकल्प देती है। अर्धविराम पद के दो समानांतर आरोपों को स्पष्ट करता है।
