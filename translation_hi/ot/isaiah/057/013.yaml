id: ISA.57.13
reference: Isaiah 57:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/זַֽעֲקֵ/ךְ֙ יַצִּילֻ֣/ךְ קִבּוּצַ֔יִ/ךְ וְ/אֶת כֻּלָּ֥/ם יִשָּׂא ר֖וּחַ יִקַּח הָ֑בֶל וְ/הַ/חוֹסֶ֥ה בִ/י֙ יִנְחַל אֶ֔רֶץ וְ/יִירַ֖שׁ הַר קָדְשִֽׁ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/013.yaml
  text: When you cry out[a], let your gathered idols rescue you! But the wind will carry all of them off; a breath will take them away[c][b]. But whoever takes refuge in me will inherit the land and possess my holy mountain.
translation:
  language: hi
  text: जब तू पुकारे, तो तेरे इकट्ठे किए हुए देवता[a] तुझे बचाएँ! परन्तु उन सबको हवा उड़ा ले जाएगी; एक फूँक उन्हें ले जाएगी।[b] लेकिन जो मुझमें शरण लेता है, वह देश[c] का उत्तराधिकारी होगा और मेरे पवित्र पर्वत का अधिकारी होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “तेरे संग्रह” या “तेरे इकट्ठे किए हुए”; इससे देवता, सहयोगी या भरोसे की दूसरी वस्तुएँ अभिप्रेत हो सकती हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “हवा” और “फूँक/वाष्प” एक काव्यात्मक जोड़ा बनाते हैं, जो दिखाता है कि वे कितनी आसानी से मिट जाएँगे।
    reason: cultural_note
  - marker: c
    text: या “पृथ्वी”; इब्रानी शब्द के दोनों अर्थ हो सकते हैं, यद्यपि यहाँ पवित्र पर्वत का संदर्भ “देश” के पक्ष में है।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּזַעֲקֵךְ
  choice: जब तू पुकारे
  rationale: בְּ के साथ क्रियारूप यहाँ समयसूचक अर्थ देता है। स्त्रीलिंग एकवचन संबोधन बनाए रखने के लिए ‘तू’ रखा गया है।
- source_word: יַצִּילֻךְ
  choice: तुझे बचाएँ
  rationale: अपूर्ण काल का रूप संदर्भ में व्यंग्यपूर्ण चुनौती है—जिन पर तूने भरोसा किया, वे ही तुझे बचाकर दिखाएँ।
- source_word: קִבּוּצַיִךְ
  choice: तेरे इकट्ठे किए हुए देवता
  rationale: शब्द का मूल अर्थ ‘तेरे संग्रह/इकट्ठे किए हुए’ है। मूर्तिपूजा के निकट संदर्भ में देवता अभिप्रेत जान पड़ते हैं, पर वास्तविक शाब्दिक व्यापकता को पादटिप्पणी में रखा गया है।
- source_word: יִשָּׂא רוּחַ
  choice: हवा उड़ा ले जाएगी
  rationale: רוּחַ यहाँ הָבֶל के समानांतर ‘हवा’ है; נשׂא का प्रसंगानुकूल अर्थ आसानी से उड़ा ले जाना है।
- source_word: יִקַּח הָבֶל
  choice: एक फूँक उन्हें ले जाएगी
  rationale: הָבֶל का ठोस अर्थ साँस, वाष्प या क्षणिक फूँक हो सकता है। ‘फूँक’ वस्तुओं की असहायता और कविता की संक्षिप्तता व्यक्त करती है।
- source_word: וְהַחוֹסֶה בִי
  choice: लेकिन जो मुझमें शरण लेता है
  rationale: कृदंत निरंतर भरोसे और आश्रय लेने की मुद्रा बताता है; ‘जो’ प्रतिनिधिक एकवचन को सहज हिन्दी में रखता है।
- source_word: יִנְחַל אֶרֶץ
  choice: वह देश का उत्तराधिकारी होगा
  rationale: נחל विरासत में पाने का भाव रखता है। सिय्योन-केंद्रित संदर्भ में אֶרֶץ के लिए ‘देश’ उपयुक्त है, जबकि ‘पृथ्वी’ की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: וְיִירַשׁ הַר קָדְשִׁי
  choice: मेरे पवित्र पर्वत का अधिकारी होगा
  rationale: ירשׁ का अर्थ अधिकार या कब्ज़ा पाना है। ‘उत्तराधिकारी’ की पुनरावृत्ति से बचते हुए समानांतर उत्तराधिकार-भाव बनाए रखा गया है।
theological_decisions:
- issue: קִבּוּצַיִךְ का अभिप्रेत संदर्भ
  choice: मुख्य पाठ में इकट्ठे किए हुए देवता
  alternative: तेरे संग्रह, तेरे इकट्ठे किए हुए लोग, या सहयोगी
  rationale: अध्याय का मूर्तिपूजा-विरोधी संदर्भ देवताओं/मूर्तियों की ओर संकेत करता है, पर शब्द स्वयं इतना विशिष्ट नहीं है; इसलिए अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
- issue: אֶרֶץ का विस्तार
  choice: देश
  alternative: पृथ्वी
  rationale: अगली पंक्ति के ‘मेरे पवित्र पर्वत’ और सिय्योन-संदर्भ के कारण वाचा का देश अधिक संभावित है; फिर भी व्यापक ‘पृथ्वी’ अर्थ भाषिक रूप से संभव है।
- issue: दूसरे पुरुष का लिंग और वचन
  choice: स्त्रीलिंग एकवचन को हिन्दी के ‘तू/तेरे’ से बनाए रखा
  alternative: लिंग-अस्पष्ट आदरसूचक ‘तुम/आप’
  rationale: इब्रानी रूप स्पष्टतः स्त्रीलिंग एकवचन हैं और सम्भवतः सामूहिक व्यक्तित्व को संबोधित करते हैं। हिन्दी में ‘तू’ काव्यात्मक-भविष्यवाणी के प्रत्यक्ष और कठोर स्वर को रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधी हिन्दी। भविष्यवाणी के व्यंग्यपूर्ण चुनौती-स्वर को विस्मयादिबोधक वाक्य से रखा गया है। स्त्रीलिंग एकवचन इब्रानी संबोधन के लिए ‘तू’ का प्रयोग किया गया है; ‘देवता’ संदर्भगत स्पष्टता देता है, जबकि शाब्दिक अस्पष्टता पादटिप्पणी में संरक्षित है।
