  yaml_path: translation/ot/isaiah/026/004.yaml
  text: Trust in the LORD forever, for in Yah, the LORD, is an everlasting rock.
translation:
  language: hi
  text: 'यहोवा पर सदा-सर्वदा भरोसा रखो,

    क्योंकि याह, अर्थात् यहोवा, युगों की चट्टान है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में ‘याह’ के पहले בְ (शाब्दिकतः ‘में’) है: ‘क्योंकि याह, यहोवा, में युगों की चट्टान [है]।’ इस संक्षिप्त वाक्यांश का अर्थ ‘क्योंकि याह, अर्थात् यहोवा, युगों की चट्टान है’ भी लिया जाता है।'
    reason: मूल के בְּיָהּ और יָהּ יהוה के संक्षिप्त, व्याख्यात्मक रूप से कठिन संबंध को दर्ज करते हुए मुख्य पाठ को स्वाभाविक हिन्दी में रखा गया है।
lexical_decisions:
- source_word: בִּטְחוּ
  choice: भरोसा रखो
  rationale: बहुवचन आज्ञार्थक क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और सामूहिक संबोधन बनाए रखता है।
- source_word: בַיהוָה
  choice: यहोवा पर
  rationale: वाचा-नाम יהוה को नाम के रूप में प्रस्तुत किया गया है; उपसर्ग ב यहाँ भरोसे के लक्ष्य के लिए हिन्दी के स्वाभाविक ‘पर’ से व्यक्त है।
- source_word: עֲדֵי עַד
  choice: सदा-सर्वदा
  rationale: तीव्र और निरंतर कालबोध को सहज, काव्यात्मक हिन्दी में सुरक्षित रखता है।
- source_word: יָהּ
  choice: याह
  rationale: यह יהוה का संक्षिप्त ईश्वरीय नाम है; इसे सामान्य उपाधि में बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: צוּר עוֹלָמִים
  choice: सनातन चट्टान
  rationale: צוּר के ठोस रूपक ‘चट्टान’ और עוֹלָמִים के स्थायी कालबोध दोनों को संक्षेप में सुरक्षित रखता है।
theological_decisions:
- issue: בְּיָהּ יְהוָה में उपसर्ग ב और दो ईश्वरीय नामों का संबंध
  choice: ‘याह—यहोवा—में’
  alternative: ‘याह यहोवा सनातन चट्टान है’ अथवा ‘यहोवा परमेश्वर सनातन चट्टान है’
  rationale: मसोरेटिक पाठ में יָהּ से पहले उपस्थित ב को बनाए रखा गया है और יָהּ तथा יהוה दोनों नामों को स्पष्ट किया गया है। वैकल्पिक अनुवाद वाक्य को अधिक सहज बनाते हैं, पर उपसर्ग को लुप्त या दोनों नामों को उपाधि में बदल सकते हैं।
translation_notes:
  register: भाषा आधुनिक, श्रद्धापूर्ण और काव्यात्मक रखी गई है। ‘सदा-सर्वदा’ पद्य की लय बनाए रखता है; ‘याह—यहोवा—में’ जानबूझकर कुछ असामान्य है, क्योंकि यह मूल की संक्षिप्त और तनावपूर्ण अभिव्यक्ति को बिना चुपचाप सरल किए सुरक्षित रखता है।
