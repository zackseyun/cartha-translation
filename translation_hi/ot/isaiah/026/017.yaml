source:
  edition: WLC
  text: כְּמ֤וֹ הָרָה֙ תַּקְרִ֣יב לָ/לֶ֔דֶת תָּחִ֥יל תִּזְעַ֖ק בַּ/חֲבָלֶ֑י/הָ כֵּ֛ן הָיִ֥ינוּ מִ/פָּנֶ֖י/ךָ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/017.yaml
  text: Like a pregnant woman who is about to give birth writhes and cries out in her labor pains[a], so were we before you, O Yahweh.
translation:
  language: hi
  text: जैसे गर्भवती स्त्री के प्रसव का समय निकट आता है और वह प्रसव-पीड़ाओं में तड़पती और पुकार उठती है, वैसे ही हम तेरे सामने[a] थे, हे याहवे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरी उपस्थिति में’; इब्रानी वाक्यांश का शाब्दिक अर्थ है ‘तेरे मुख के सामने।’ कुछ लोग इसका अर्थ ‘तेरे कारण’ लेते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: כְּמוֹ
  choice: जैसे
  rationale: यह उपमा का आरम्भ करता है; ‘जैसे’ आधुनिक हिन्दी में स्वाभाविक है और כֵּן के ‘वैसे ही’ से स्पष्ट रूप से जुड़ता है।
- source_word: הָרָה
  choice: गर्भवती स्त्री
  rationale: शब्द गर्भवती स्त्री को सूचित करता है; यह चयन स्पष्ट, सहज और प्रसंगानुकूल है।
- source_word: תַּקְרִיב לָלֶדֶת
  choice: जिसका प्रसव निकट आने पर
  rationale: קרב का हिफ़ील रूप और ‘जन्म देने’ का क्रियारूप प्रसव का समय पास आने का भाव देते हैं; हिन्दी में यह अभिव्यक्ति स्वाभाविक है।
- source_word: תָּחִיל
  choice: तड़पती
  rationale: प्रसव के संदर्भ में यह देह की ऐंठन और व्याकुलता का सजीव भाव रखता है, न कि केवल सामान्य पीड़ा का।
- source_word: תִּזְעַק
  choice: पुकार उठती है
  rationale: यह ऊँची और आकस्मिक पुकार का भाव व्यक्त करता है, पर ‘चीखती’ की अपेक्षा स्रोत से अधिक तीव्रता नहीं जोड़ता।
- source_word: בַּחֲבָלֶיהָ
  choice: प्रसव-पीड़ा में
  rationale: इस प्रसंग में חבלים जन्म देने की पीड़ाओं को सूचित करता है; ‘प्रसव-पीड़ा’ आधुनिक हिन्दी में सटीक और सुबोध है।
- source_word: כֵּן
  choice: वैसे ही
  rationale: यह उपमा के निष्कर्ष को चिह्नित करता है और आरम्भिक ‘जैसे’ के साथ स्वाभाविक हिन्दी संरचना बनाता है।
- source_word: הָיִינוּ
  choice: हम ... थे
  rationale: काल पूर्ण रूप में समुदाय की दशा बताता है; हिन्दी भूतकाल स्रोत के रूप और संदर्भ को बनाए रखता है।
- source_word: מִפָּנֶיךָ
  choice: तेरे सामने
  rationale: शाब्दिक रूप से यह ‘तेरे मुख/उपस्थिति के सामने’ है। ‘तेरे सामने’ उपस्थिति और संबंध का भाव रखता है, जबकि कारणसूचक अर्थ को मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चार-अक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: हे याहवे
  alternative: हे प्रभु; हे यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापरक हिन्दी लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: מִפָּנֶיךָ का अर्थ
  choice: तेरे सामने
  alternative: तेरी उपस्थिति में; तेरे कारण
  rationale: वाक्यांश में उपस्थिति और संभावित कारणात्मक छाया दोनों हो सकती हैं। मुख्य पाठ में ‘तेरे सामने’ मूल रूपक के निकट रहते हुए तनाव बनाए रखता है; वैकल्पिक कारणात्मक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘जैसे ... वैसे ही’ से इब्रानी उपमा की संरचना स्पष्ट रहती है; ‘तड़पती और पुकार उठती है’ प्रसव का सजीव बिंब बनाए रखता है। सर्वनाम ‘तेरे’ और संबोधन ‘हे याहवे’ काव्यात्मक प्रार्थना के निकट और सम्मानपूर्ण भाव के अनुरूप हैं।
