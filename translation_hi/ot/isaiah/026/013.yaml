id: ISA.26.13
reference: Isaiah 26:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהֵ֔י/נוּ בְּעָל֥וּ/נוּ אֲדֹנִ֖ים זֽוּלָתֶ֑/ךָ לְ/בַד בְּ/ךָ֖ נַזְכִּ֥יר שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/013.yaml
  text: O Yahweh our God[a], other lords besides you have ruled over us, but through you alone we make mention of your name.
translation:
  language: hi
  text: हे यहोवा, हमारे परमेश्वर, तेरे सिवा दूसरे प्रभुओं ने हम पर प्रभुता की है; परन्तु केवल तेरे द्वारा[a] ही हम तेरे नाम का स्मरण करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “केवल तुझमें ही हम तेरे नाम का स्मरण करते हैं।” यहाँ प्रयुक्त इब्रानी संबंधबोधक शब्द का अर्थ “तेरे द्वारा” या “तुझमें”—दोनों हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: ईश्वर के व्यक्तिवाचक नाम को लिप्यंतरित किया गया है; संबोधन को व्यक्त करने के लिए ‘हे’ रखा गया है।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: यहाँ יְהוָה के साथ एकवचन उपाधि है और प्रथम पुरुष बहुवचन प्रत्यय का अर्थ ‘हमारे’ है।
- source_word: בְּעָלוּנוּ
  choice: हम पर प्रभुता की है
  rationale: क्रिया בעל यहाँ स्वामित्व या अधिकार चलाने का भाव रखती है; यह अनुवाद אֲדֹנִים के साथ मूल का शब्दगत संबंध भी बनाए रखता है।
- source_word: אֲדֹנִים
  choice: दूसरे प्रभुओं
  rationale: बहुवचन संज्ञा को ऐसा ही खुला रखा गया है ताकि वह मानवीय शासकों, विदेशी स्वामियों अथवा प्रतिद्वंद्वी शक्तियों में से किसी एक तक सीमित न हो।
- source_word: זוּלָתֶךָ
  choice: तेरे सिवा
  rationale: यह बहिष्करण का स्वाभाविक हिन्दी रूप है और यहोवा से भिन्न प्रभुओं का विरोध स्पष्ट करता है।
- source_word: לְבַד
  choice: केवल
  rationale: विशिष्टता और अनन्यता पर बल देने वाला सहज हिन्दी क्रियाविशेषण।
- source_word: בְּךָ
  choice: तेरे द्वारा
  rationale: ב को करणार्थक समझते हुए मुख्य पाठ में ‘तेरे द्वारा’ रखा गया है; स्थान/आश्रय के अर्थ वाला ‘तुझमें’ भी सम्भव है और पादटिप्पणी में सुरक्षित है।
- source_word: נַזְכִּיר
  choice: हम ... स्मरण करते हैं
  rationale: זכר के हिफ़ील रूप में स्मरण कराने, उल्लेख करने या आदरपूर्वक याद करने का भाव हो सकता है; ‘नाम का स्मरण करना’ हिन्दी में स्वाभाविक धार्मिक अभिव्यक्ति है और अर्थ को ‘घोषणा’ तक सीमित नहीं करता।
- source_word: שְׁמֶךָ
  choice: तेरे नाम का
  rationale: ‘नाम’ को बिना व्याख्यात्मक विस्तार के रखा गया है, जिससे उसका वाचा और आराधना से जुड़ा अर्थ संदर्भ में बना रहता है।
theological_decisions:
- issue: यहोवा और ‘दूसरे प्रभुओं’ के बीच विरोध
  choice: ‘दूसरे प्रभुओं’ को बिना अतिरिक्त पहचान दिए रखा गया है।
  alternative: इसे विदेशी मानवीय शासकों अथवा मूर्तियों/झूठे देवताओं के रूप में स्पष्ट करना।
  rationale: मूल भाषा दोनों दिशाओं के लिए खुली है। ‘हम पर प्रभुता की’ राजनीतिक दमन के अनुकूल है, पर प्रतिद्वंद्वी देवशक्तियों का संकेत निषिद्ध नहीं करता; इसलिए अनुवाद तनाव को नहीं सुलझाता।
- issue: בְּךָ לְבַד का अर्थ
  choice: मुख्य पाठ में ‘केवल तेरे द्वारा’।
  alternative: ‘केवल तुझमें’ अथवा ‘केवल तेरे सहारे’।
  rationale: ב करण, क्षेत्र या आश्रय व्यक्त कर सकता है। पठनीय मुख्य विकल्प चुना गया है और वास्तविक भाषिक अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण प्रार्थनात्मक स्वर रखा गया है। ‘यहोवा’ मूल के व्यक्तिवाचक ईश्वरीय नाम को दर्शाता है। ‘प्रभुओं ने ... प्रभुता की’ जानबूझकर रखा गया शब्दगत संबंध है, जो मूल इब्रानी में संज्ञा और क्रिया के संबंध को प्रतिबिंबित करता है।
