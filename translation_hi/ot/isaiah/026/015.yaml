  edition: WLC
  text: יָסַ֤פְתָּ לַ/גּוֹי֙ יְהוָ֔ה יָסַ֥פְתָּ לַ/גּ֖וֹי נִכְבָּ֑דְתָּ רִחַ֖קְתָּ כָּל קַצְוֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/015.yaml
  text: You have increased the nation[a], O Yahweh; you have increased the nation; you have gained glory[b]; you have extended all the borders of the land.
translation:
  language: hi
  text: 'हे याहवे, तूने राष्ट्र को बढ़ाया है;

    तूने राष्ट्र को बढ़ाया है।

    तूने महिमा पाई है[a];

    तूने देश की सभी सीमाओं को दूर तक बढ़ा दिया है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तू महिमावान हुआ है,’ ‘तू सम्मानित हुआ है,’ अथवा ‘तूने अपने को महिमावान किया है।’
    reason: lexical_alternative
  - marker: b
    text: या ‘तूने पृथ्वी के सभी छोरों को दूर तक बढ़ा दिया है।’ इब्रानी अभिव्यक्ति का अर्थ ‘देश की सीमाएँ’ या ‘पृथ्वी के छोर’ हो सकता है; इस संदर्भ में देश की सीमाओं का विस्तार अधिक संभावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַפְתָּ
  choice: तूने बढ़ाया है
  rationale: יסף के साथ ל और सामूहिक संज्ञा यहाँ संख्या या विस्तार में वृद्धि का भाव देता है। दोहराव को मूल पाठ के अनुसार बनाए रखा गया है।
- source_word: לַגּוֹי
  choice: राष्ट्र को
  rationale: גּוֹי का सामान्य अर्थ ‘राष्ट्र’ है। मूल का निश्चित, एकवचन रूप बनाए रखा गया है।
- source_word: יְהוָה
  choice: हे याहवे
  rationale: ईश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिंदी में ध्वन्यात्मक रूप ‘याहवे’ दिया गया है; हे संबोधन मूल वाक्य के प्रत्यक्ष संबोधन को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: נִכְבָּדְתָּ
  choice: तूने महिमा पाई है
  rationale: כבד के निफ़अल रूप में यहाँ महिमावान या सम्मानित ठहरने का परिणामसूचक भाव है। ‘महिमा पाई है’ कर्तृत्व को अनावश्यक रूप से निश्चित किए बिना सहज हिंदी देता है; अन्य संभव बारीकियाँ पादटिप्पणी में रखी गई हैं।
- source_word: רִחַקְתָּ
  choice: दूर तक फैला दी हैं
  rationale: רחק का मूल भाव दूर करना या दूर होना है। सीमाओं के साथ यह उन्हें दूर तक पहुँचा देने, अर्थात क्षेत्र का विस्तार करने, का अर्थ देता है।
- source_word: כָּל קַצְוֵי אָרֶץ
  choice: देश की सारी सीमाएँ
  rationale: קצה का अर्थ छोर, किनारा या सीमा हो सकता है और ארץ का अर्थ देश या पृथ्वी। राष्ट्र की वृद्धि के संदर्भ में प्रादेशिक अर्थ ‘देश की सारी सीमाएँ’ अधिक उपयुक्त है, जबकि व्यापक विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: נִכְבָּדְתָּ में महिमा और कर्तृत्व का संबंध
  choice: तूने महिमा पाई है
  alternative: तू महिमावान हुआ है; तेरी महिमा हुई है; तू सम्मानित हुआ है
  rationale: निफ़अल रूप परिणामसूचक, भाववाच्य या आत्मवाचक छाया रख सकता है। चुना गया रूप इस बात को खुला रखता है कि महिमा कैसे प्रकट या प्राप्त हुई।
- issue: אָרֶץ का दायरा
  choice: देश
  alternative: पृथ्वी
  rationale: राष्ट्र को बढ़ाने और सीमाओं को दूर तक फैलाने का निकट संदर्भ प्रादेशिक अर्थ का समर्थन करता है। फिर भी ‘पृथ्वी के छोर’ भाषिक रूप से संभव है और पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। काव्यात्मक समानांतरता और ‘राष्ट्र को बढ़ाया है’ की पुनरावृत्ति सुरक्षित रखी गई है। ईश्वर के लिए एकवचन निकट संबोधन ‘तू’ बाइबिलीय प्रार्थना-काव्य की सीधी आत्मीयता व्यक्त करता है, अनादर नहीं।
