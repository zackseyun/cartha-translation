source:
  edition: WLC
  text: יְהוָ֕ה תִּשְׁפֹּ֥ת שָׁל֖וֹם לָ֑/נוּ כִּ֛י גַּ֥ם כָּֽל מַעֲשֵׂ֖י/נוּ פָּעַ֥לְתָּ לָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/012.yaml
  text: O Yahweh[a], you will establish peace for us[b], for indeed you have accomplished all our works for us.
translation:
  language: hi
  text: हे यहोवा, तू हमारे लिए शांति[a] स्थापित करेगा, क्योंकि वास्तव में हमारे सारे काम भी तूने हमारे लिए सम्पन्न किए हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘शांति’ के इब्रानी शब्द में कुशलता, भलाई और सम्पूर्णता का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तूने हमारे सारे काम हममें किए हैं।” यहाँ इब्रानी का अधिक सीधा अर्थ “हमारे लिए” है, पर इसे परमेश्वर द्वारा अपने लोगों के भीतर कार्य करने के अर्थ में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: वाचा के व्यक्तिगत नाम को प्रचलित हिन्दी रूप ‘यहोवा’ में रखा गया है। प्रत्यक्ष सम्बोधन को स्वाभाविक हिन्दी प्रार्थना-शैली में ‘हे’ से व्यक्त किया गया है।
- source_word: תִּשְׁפֹּת
  choice: स्थापित करेगा
  rationale: क्रिया यहाँ शान्ति को ठहराने या कायम करने का भाव देती है। ‘स्थापित करेगा’ भावी आश्वासन और कर्ता के रूप में परमेश्वर की भूमिका दोनों को स्पष्ट रखता है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: ‘शान्ति’ इसका मानक और सन्दर्भानुकूल अनुवाद है; इब्रानी शब्द में निहित कुशलता और समग्र भलाई का व्यापक भाव पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לָנוּ
  choice: हमारे लिए
  rationale: शान्ति स्थापित करने के साथ ל लाभार्थक है, इसलिए ‘हमारे लिए’ स्वाभाविक और अर्थसंगत है।
- source_word: כִּי גַּם
  choice: क्योंकि वास्तव में ... भी
  rationale: ‘क्योंकि’ पिछले कथन का आधार बताता है, ‘वास्तव में’ बल को व्यक्त करता है, और ‘भी’ גַּם के समावेशी/बलात्मक स्वर को सुरक्षित रखता है।
- source_word: כָּל מַעֲשֵׂינוּ
  choice: हमारे सारे काम
  rationale: यह सरल और व्यापक पदबंध मानवीय कामों, कार्यों या उपलब्धियों में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: פָּעַלְתָּ
  choice: तूने ही ... सम्पन्न किए हैं
  rationale: ‘सम्पन्न किए हैं’ कार्य को प्रभावी रूप से पूरा कराने का भाव देता है; ‘ही’ इब्रानी कथन में परमेश्वर की निर्णायक भूमिका को स्वाभाविक हिन्दी में उभारता है।
- source_word: לָּנוּ
  choice: हमारे लिए
  rationale: अन्तिम לָנוּ को सबसे सीधे रूप में लाभार्थक ‘हमारे लिए’ समझा गया है। ‘हममें’ सम्भव व्याख्या है, पर इस पूर्वसर्ग का कम प्रत्यक्ष अर्थ होने के कारण उसे पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ‘हमारे सारे काम’ और परमेश्वर की सक्रियता का सम्बन्ध
  choice: लोगों के कामों को बनाए रखते हुए उनके सम्पन्न होने का श्रेय अन्ततः परमेश्वर की ओर से उनके लिए किए गए कार्य को दिया गया है।
  alternative: ‘तूने हमारे सारे काम हममें किए हैं’ अथवा ‘तूने हमारे सभी उपक्रमों को सफल किया है।’
  rationale: इब्रानी पाठ मानवीय ‘कामों’ और परमेश्वर की निर्णायक सक्रियता को साथ रखता है। अनुवाद इस तनाव को किसी विशिष्ट सैद्धान्तिक सूत्र में नहीं बदलता; ‘हमारे लिए’ पूर्वसर्ग ל का अधिक सीधा अर्थ है, जबकि ‘हममें’ की सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। परमेश्वर को प्रत्यक्ष प्रार्थनात्मक सम्बोधन में ‘तू’ कहा गया है, जो हिन्दी बाइबलीय और भक्तिपरक शैली में निकटता तथा एकवचन दोनों व्यक्त करता है। ‘सम्पन्न किए हैं’ औपचारिकता बनाए रखते हुए सामान्य पाठक के लिए बोधगम्य है।
