source:
  edition: WLC
  text: אֹ֥רַח לַ/צַּדִּ֖יק מֵֽישָׁרִ֑ים יָשָׁ֕ר מַעְגַּ֥ל צַדִּ֖יק תְּפַלֵּֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/007.yaml
  text: The path of the righteous is level; O Upright One[a], you make the way of the righteous smooth.
translation:
  language: hi
  text: 'धर्मी का मार्ग समतल है;

    हे सीधे, आप धर्मी की राह को समतल करते हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹרַח
  choice: मार्ग
  rationale: यह किसी पथ या जीवन-चाल को सूचित करता है; ‘मार्ग’ काव्यात्मक समानांतरता और गरिमापूर्ण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לַצַּדִּיק
  choice: धर्मी का
  rationale: लामेद यहाँ संबंध अथवा हित दोनों का संकेत दे सकता है; ‘धर्मी का मार्ग’ मूल की संबंधपरक अस्पष्टता को सहज हिन्दी में बनाए रखता है।
- source_word: מֵישָׁרִים
  choice: समतल
  rationale: बहुवचन संज्ञा होते हुए भी यहाँ विधेयात्मक रूप से मार्ग के सम और बाधारहित होने का ठोस चित्र देती है।
- source_word: יָשָׁר
  choice: हे सीधे-सच्चे परमेश्वर
  rationale: अगली क्रिया द्वितीय पुरुष पुल्लिंग एकवचन है, इसलिए इसे परमेश्वर के लिए संबोधन मानना वाक्य-विन्यास की दृष्टि से स्वाभाविक है। ‘सीधे-सच्चे’ नैतिक खराई का भाव साधारण हिन्दी में व्यक्त करता है; स्पष्ट संबोधन के लिए ‘परमेश्वर’ जोड़ा गया है। वैकल्पिक विशेषणात्मक पठन पाद-टिप्पणी में रखा गया है।
- source_word: מַעְגַּל
  choice: राह
  rationale: यह पगडंडी, पटरी या चलने की दिशा को दर्शाता है; ‘राह’ पहले अर्धांश के ‘मार्ग’ के साथ समानांतर है और अनावश्यक शब्द-पुनरावृत्ति से बचाता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: मूल का एकवचन प्रतिनिधिक अथवा सामूहिक अर्थ रखता है; ‘धर्मी’ बिना अनावश्यक लैंगिक विस्तार के इसे सुरक्षित रखता है।
- source_word: תְּפַלֵּס
  choice: समतल करते हैं
  rationale: פלס का पिएल रूप मार्ग को समतल करने अथवा ठीक बनाने का अर्थ दे सकता है; यह सड़क के रूपक और पहले अर्धांश के ‘समतल’ से मेल खाता है।
theological_decisions:
- issue: יָשָׁר को मार्ग का विशेषण माना जाए या परमेश्वर के लिए संबोधन
  choice: 'संबोधन: ‘हे सीधे-सच्चे परमेश्वर’'
  alternative: 'विशेषणात्मक पठन: ‘धर्मी का मार्ग सीधा है; आप धर्मी की राह को समतल करते हैं।’'
  rationale: תְּפַלֵּס द्वितीय पुरुष पुल्लिंग एकवचन है, जिससे परमेश्वर को सीधा संबोधन स्वाभाविक प्रतीत होता है। फिर भी יָשָׁר व्याकरणतः मार्ग का विशेषण भी हो सकता है; इस वास्तविक अस्पष्टता को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक स्तर रखा गया है। ‘आप’ से परमेश्वर के प्रति आदरसूचक संबोधन व्यक्त हुआ है। दोनों अर्धांशों के मार्ग-रूपक और ‘समतल’ की पुनरावृत्ति को जानबूझकर रखा गया है।
