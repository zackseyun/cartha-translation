  text: יִֽחְי֣וּ מֵתֶ֔י/ךָ נְבֵלָתִ֖/י יְקוּמ֑וּ/ן הָקִ֨יצוּ וְ/רַנְּנ֜וּ שֹׁכְנֵ֣י עָפָ֗ר כִּ֣י טַ֤ל אוֹרֹת֙ טַלֶּ֔/ךָ וָ/אָ֖רֶץ רְפָאִ֥ים תַּפִּֽיל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/019.yaml
  text: Your dead will live[a]; my dead bodies will rise. Awake and shout for joy, you who dwell in the dust! For your dew is a dew of lights[c][b], and the earth will cast out the dead.
translation:
  language: hi
  text: तेरे मृत जन जीवित होंगे; मेरे मृत शरीर उठ खड़े होंगे[a]। हे मिट्टी में रहने वालो, जागो और आनंद से जयजयकार करो! क्योंकि तेरी ओस ज्योतियों की ओस है[b], और पृथ्वी मृतकों को बाहर निकाल देगी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरा शव उठेगा।” इब्रानी में ‘मेरा शव’ एकवचन रूप है, लेकिन उसके साथ बहुवचन क्रिया आई है; इसलिए मुख्य पाठ में इसे सामूहिक अर्थ में “मेरे मृत शरीर” कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “तेरी ओस प्रकाश की ओस है” अथवा “तेरी ओस चमकती हुई ओस है।” इब्रानी पदबंध कठिन है और जीवन देने वाली, प्रकाशमय ओस का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “पृथ्वी छायाओं को बाहर निकाल देगी।” इब्रानी רְפָאִים अधोलोक में माने गए दिवंगत मृतकों, अर्थात छायामय मृतकों, को सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מֵתֶיךָ
  choice: तेरे मृत जन
  rationale: यह शब्द ‘मृत’ का बहुवचन रूप है, जिसके साथ द्वितीय पुरुष एकवचन संबंधसूचक प्रत्यय है। ‘तेरे मृत जन’ सीधे संबोधन को बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: נְבֵלָתִי
  choice: मेरे मृत शरीर
  rationale: נְבֵלָה का सामान्य अर्थ शव या मृत शरीर है। रूप एकवचन है, पर उसके बाद बहुवचन क्रिया יְקוּמוּן आती है; इसलिए मुख्य पाठ में सामूहिक/बहुवचन अर्थ व्यक्त किया गया है और रूपगत कठिनाई पादटिप्पणी में रखी गई है।
- source_word: יְקוּמוּן
  choice: उठ खड़े होंगे
  rationale: קום का मूल भाव उठना या खड़ा होना है। यहाँ मृत्यु से उठने के संदर्भ में ‘उठ खड़े होंगे’ पहले खंड के ‘जीवित होंगे’ से भेद भी बनाए रखता है।
- source_word: הָקִיצוּ
  choice: जागो
  rationale: यह बहुवचन आज्ञार्थक रूप है और मिट्टी में रहने वाले मृतकों को मृत्यु-निद्रा से जागने का आह्वान करता है।
- source_word: וְרַנְּנוּ
  choice: आनन्द से जयजयकार करो
  rationale: רנן उल्लासपूर्ण पुकार, जयघोष या आनन्दगान का भाव देता है। यह अनुवाद ध्वनि और आनन्द दोनों को स्पष्ट करता है।
- source_word: שֹׁכְנֵי עָפָר
  choice: मिट्टी में रहने वालो
  rationale: सहभागी रूप वाले सीधे संबोधन और कब्र/मृत्यु की ‘मिट्टी’ वाली काव्यात्मक छवि को सुरक्षित रखा गया है।
- source_word: טַל אוֹרֹת
  choice: ज्योतियों की ओस
  rationale: इब्रानी बहुवचन אוֹרֹת कठिन और असामान्य है। अपेक्षाकृत रूपनिष्ठ ‘ज्योतियों की ओस’ जीवनदायी, प्रकाशमय ओस की छवि को बिना निश्चित रूप से समझाए बनाए रखता है।
- source_word: רְפָאִים
  choice: मृतकों
  rationale: इस संदर्भ में यह अधोलोक के दिवंगत मृतकों को सूचित करता है, जातीय ‘रपाई’ को नहीं। स्पष्ट हिन्दी अर्थ मुख्य पाठ में और अधिक चित्रात्मक विकल्प पादटिप्पणी में दिया गया है।
- source_word: תַּפִּיל
  choice: बाहर निकाल देगी
  rationale: נפל के हिफ़ील रूप में यहाँ पृथ्वी द्वारा मृतकों को अपने भीतर से गिरा देने, निकालने या छोड़ देने का बलपूर्ण चित्र है। ‘बाहर निकाल देगी’ इस क्रिया को सहज हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: काव्यात्मक-भविष्यद्वाणी के संदर्भ में पुनरुत्थान की भाषा
  choice: पद को वास्तविक मृतकों के जीवित होने और उठने की सशक्त देहधारी पुनरुत्थान-छवि के रूप में अनूदित किया गया है।
  alternative: इसे केवल राष्ट्र के रूपकात्मक पुनर्जीवन के रूप में प्रस्तुत करना।
  rationale: ‘मृत जन जीवित होंगे,’ ‘मृत शरीर उठ खड़े होंगे,’ मिट्टी में रहने वालों का जागना, और पृथ्वी द्वारा मृतकों को बाहर निकालना पुनरुत्थान की भाषा को प्रबल बनाते हैं। साथ ही पाठ में निहित सामूहिक राष्ट्रीय आशा को नकारने वाला कोई व्याख्यात्मक विस्तार नहीं जोड़ा गया।
- issue: ‘मेरे मृत शरीर’ में वक्ता और प्रथम पुरुष संबंध
  choice: मसोरेटिक पाठ के प्रथम पुरुष संबंधसूचक भाव ‘मेरे’ को मुख्य पाठ में रखा गया है।
  alternative: इसे ‘उनके मृत शरीर’ या ‘तेरे मृत शरीर’ बनाकर सामंजस्य स्थापित करना।
  rationale: वक्ता की ठीक पहचान विवादित है; इसलिए इब्रानी पाठ के प्रथम पुरुष रूप को किसी व्याख्यात्मक संशोधन से नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, काव्यात्मक पर सहज और गरिमापूर्ण रखी गई है। ‘मृत जन/मृत शरीर,’ ‘मिट्टी में रहने वालो,’ और ‘ज्योतियों की ओस’ मूल की समानांतरता तथा असामान्य बिंबों को सुरक्षित रखते हैं; कठिन पाठगत विकल्प पादटिप्पणियों में स्पष्ट किए गए हैं।
