source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֔וּא יוּשַׁ֥ר הַ/שִּׁיר הַ/זֶּ֖ה בְּ/אֶ֣רֶץ יְהוּדָ֑ה עִ֣יר עָז לָ֔/נוּ יְשׁוּעָ֥ה יָשִׁ֖ית חוֹמ֥וֹת וָ/חֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/001.yaml
  text: 'In that day this song will be sung in the land of Judah: “We have a strong city[c][b][a]; he sets salvation as walls and rampart.”'
translation:
  language: hi
  text: 'उस दिन यह गीत यहूदा की भूमि में गाया जाएगा:


    “हमारा नगर दृढ़ है;[a]


    वह उद्धार को दीवारों और परकोटे के रूप में स्थापित करता है।”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे पास एक दृढ़ नगर है”; या, “हमारे पास एक किलाबंद नगर है।”
    reason: हिब्रू की संबंधसूचक रचना और עָז के ‘दृढ़/शक्तिशाली’ भाव के वैकल्पिक स्वाभाविक अनुवाद।
  - marker: b
    text: हिब्रू में “स्थापित करता है” का कर्ता स्पष्ट नहीं है, यद्यपि प्रसंग में सामान्यतः इसे परमेश्वर के लिए समझा जाता है। “परकोटा” חֵל का अनुवाद है, जो नगर की बाहरी रक्षात्मक किलेबंदी को सूचित करता है; “दीवारों” मूल के बहुवचन חוֹמוֹת को दर्शाता है।
    reason: अव्यक्त कर्ता की वास्तविक अस्पष्टता तथा חוֹמוֹת और חֵל के रक्षात्मक स्थापत्य-संबंधी अर्थ और संख्या को स्पष्ट करना।
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यसूचक साहित्य का स्वाभाविक कालवाचक मुहावरा है और आधुनिक हिन्दी में सहज है।
- source_word: יוּשַׁר
  choice: गाया जाएगा
  rationale: होफल रूप का कर्मवाच्य अर्थ स्पष्ट और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: הַשִּׁיר הַזֶּה
  choice: यह गीत
  rationale: मूल में केवल ‘यह गीत’ है; ‘स्तुतिगीत’ जोड़ना अनावश्यक व्याख्या होगी।
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: यहूदा देश में
  rationale: אֶרֶץ के भौगोलिक-राष्ट्रीय भाव को स्पष्ट रखते हुए हिन्दी की स्वाभाविक पदावली अपनाई गई है।
- source_word: עִיר עָז לָנוּ
  choice: हमारा नगर दृढ़ है
  rationale: לָנוּ को स्वामित्वसूचक स्वाभाविक हिन्दी में व्यक्त किया गया है और עָז का सामर्थ्य-सुरक्षा संबंधी भाव ‘दृढ़’ से सुरक्षित रहता है।
- source_word: יְשׁוּעָה
  choice: उद्धार
  rationale: यह शब्द बचाव और व्यापक धार्मिक अर्थ दोनों को धारण करता है; ‘विजय’ की अपेक्षा मूल की अर्थ-सीमा बेहतर बनाए रखता है।
- source_word: יָשִׁית
  choice: ठहराता है
  rationale: שׂים के ‘रखना/नियुक्त करना/बनाना’ अर्थ को यहाँ प्रतिरक्षा के रूप में उद्धार की स्थापना के भाव सहित व्यक्त करता है।
- source_word: חוֹמוֹת
  choice: शहरपनाह
  rationale: बहुवचन हिब्रू रूप नगर को घेरे हुए रक्षात्मक दीवारों का बोध कराता है; हिन्दी में ‘शहरपनाह’ इसी दुर्ग-रचना को संक्षेप में व्यक्त करता है।
- source_word: וָחֵל
  choice: बाहरी रक्षा-दीवार
  rationale: חֵל नगर की बाहरी रक्षात्मक किलेबंदी को सूचित करता है; यह पद सामान्य पाठक के लिए ‘परकोटा’ या ‘बुलवर्क’ से अधिक स्पष्ट है।
theological_decisions:
- issue: יָשִׁית (‘ठहराता है’) का अव्यक्त कर्ता
  choice: एकवचन कर्ता को ‘वह’ के रूप में अव्यक्त पहचान सहित बनाए रखा गया है।
  alternative: ‘परमेश्वर’ या ‘यहोवा’ को स्पष्ट कर्ता बना देना; अथवा निर्वैयक्तिक रूप अपनाना।
  rationale: मूल क्रिया एकवचन है, पर कर्ता का नाम नहीं दिया गया। प्रसंग में परमेश्वर संभावित कर्ता है, फिर भी उसे स्पष्ट रूप से जोड़ना मूल की अंतर्निहित अस्पष्टता को समाप्त कर देता।
- issue: יְשׁוּעָה का अर्थ
  choice: उद्धार
  alternative: छुटकारा या विजय
  rationale: यह चयन तत्काल सुरक्षा और यशायाह में शब्द के व्यापक उद्धार-संबंधी भार दोनों को खुला रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। काव्यात्मक पंक्ति-विन्यास रखा गया है। ‘नगर’, ‘दृढ़’, ‘उद्धार’ और ‘शहरपनाह’ जैसे परिचित बाइबलीय शब्दों के साथ दुर्लभ स्थापत्य पद חֵל को स्पष्ट हिन्दी में प्रस्तुत किया गया है।
