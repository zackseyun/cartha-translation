id: ISA.26.21
reference: Isaiah 26:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי הִנֵּ֤ה יְהוָה֙ יֹצֵ֣א מִ/מְּקוֹמ֔/וֹ לִ/פְקֹ֛ד עֲוֺ֥ן יֹֽשֵׁב הָ/אָ֖רֶץ עָלָ֑י/ו וְ/גִלְּתָ֤ה הָ/אָ֨רֶץ֙ אֶת דָּמֶ֔י/הָ וְ/לֹֽא תְכַסֶּ֥ה ע֖וֹד עַל הֲרוּגֶֽי/הָ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/021.yaml
  text: For look, the LORD is coming out from his place to punish the iniquity of the inhabitant of the earth upon him, and the earth will uncover her blood and will no longer cover her slain.
translation:
  language: hi
  text: क्योंकि देखो, यहोवा अपने स्थान से निकल रहा है, ताकि पृथ्वी के निवासी के अधर्म का दण्ड उसी पर लाए; और पृथ्वी अपने ऊपर बहाए गए खून को प्रकट कर देगी और अपने मारे हुओं को फिर न ढकेगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला सूचक है; ‘देखो’ इसकी तात्कालिकता और गंभीरता को सीधे बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के विशिष्ट नाम को सामान्य उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
- source_word: לִפְקֹד
  choice: दण्ड ... लाए
  rationale: इस न्याय-संदर्भ में क्रिया का अर्थ अपराध का लेखा लेकर उसका दण्ड देना है; हिन्दी में यह प्रयोग स्वाभाविक है।
- source_word: עֲוֺן
  choice: अधर्म
  rationale: यह शब्द अपराध/दोष और उसके दण्डनीय भार दोनों का संकेत दे सकता है; ‘अधर्म’ इस नैतिक-धार्मिक अर्थ को बनाए रखता है।
- source_word: דָּמֶיהָ
  choice: अपने ऊपर बहाए गए खून
  rationale: बहुवचन ‘खूनों’ से आशय रक्तपात और बहाए गए रक्त से है; हिन्दी में यह रूप अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: הֲרוּגֶיהָ
  choice: अपने मारे हुओं
  rationale: यह पृथ्वी पर हिंसा से मारे गए लोगों को दर्शाता है और पृथ्वी के स्त्रीलिंगी मानवीकरण को भी बनाए रखता है।
theological_decisions:
- issue: अधर्म और दण्ड के बीच עָלָיו का संबंध
  choice: ‘दण्ड उसी पर लाए’
  alternative: ‘उसके अधर्म के कारण उसे दण्ड दे’
  rationale: मूल का ‘उस पर’ न्याय के व्यक्ति पर आ पड़ने का चित्र बनाए रखता है और अधर्म को केवल कारण के रूप में पुनर्व्याख्यायित नहीं करता।
- issue: पृथ्वी द्वारा खून प्रकट करना
  choice: पृथ्वी को मानवीकृत कर्ता बनाए रखा गया
  alternative: ‘पृथ्वी पर बहाया गया खून प्रकट हो जाएगा’
  rationale: मूल में पृथ्वी स्वयं अपना खून खोलती और अपने मारे हुओं को ढकना बंद करती है; यह काव्यात्मक और न्याय-संबंधी तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, काव्यात्मक और सार्वजनिक-पाठ योग्य शैली। वाक्य की समानांतर संरचना तथा पृथ्वी का मानवीकरण सुरक्षित रखा गया है।
