source:
  edition: WLC
  text: לֵ֤ךְ עַמִּ/י֙ בֹּ֣א בַ/חֲדָרֶ֔י/ךָ וּֽ/סְגֹ֥ר דלתי/ך בַּעֲדֶ֑/ךָ חֲבִ֥י כִ/מְעַט רֶ֖גַע עַד יעבור זָֽעַם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/020.yaml
  text: Go[a], my people, enter your rooms, and shut your doors behind you[c][b]; hide yourselves for a little moment until the wrath has passed by.
translation:
  language: hi
  text: जा, मेरी प्रजा, अपने कमरों[a] में प्रवेश कर और अपने पीछे द्वार बंद कर ले; क्षण-भर छिपी रह, जब तक रोष[b] टल न जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भीतरी कक्ष।”
    reason: lexical_alternative
  - marker: b
    text: या “प्रकोप।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ עַמִּי
  choice: हे मेरी प्रजा, जा
  rationale: प्रत्यक्ष संबोधन और एकवचन आज्ञा को रखा गया है। ‘प्रजा’ यहाँ परमेश्वर के लोगों के लिए स्वाभाविक, सामूहिक और गरिमापूर्ण हिन्दी शब्द है।
- source_word: בֹּא בַחֲדָרֶיךָ
  choice: अपने कमरों में प्रवेश कर
  rationale: חדר भीतर के कमरे या निजी कक्ष को सूचित कर सकता है। ‘कमरों’ से सामान्य पाठक को अर्थ तुरंत समझ आता है, जबकि भीतरी कक्ष का विकल्प पादटिप्पणी में दिया गया है।
- source_word: וּסְגֹר דלתיך בַּעֲדֶךָ
  choice: अपने पीछे अपने द्वार बंद कर ले
  rationale: בעדך के मुहावरेदार अर्थ को ‘अपने पीछे’ से व्यक्त किया गया है; ‘बंद कर ले’ आश्रय के लिए की गई क्रिया का स्वाभाविक हिन्दी रूप है।
- source_word: חֲבִי
  choice: छिप जा
  rationale: इब्रानी में आज्ञा एकवचन है और ‘मेरी प्रजा’ को एक सामूहिक इकाई के रूप में संबोधित करती है। हिन्दी में ‘प्रजा’ के साथ एकवचन आज्ञा इस रूप को स्वाभाविक ढंग से बनाए रखती है।
- source_word: כִמְעַט רֶגַע
  choice: क्षण-भर के लिए
  rationale: यह संक्षिप्त अवधि को व्यक्त करता है। ‘क्षण-भर’ आधुनिक हिन्दी में सहज है और मूल की संक्षिप्तता तथा गंभीरता बनाए रखता है।
- source_word: עַד יַעֲבוֹר
  choice: जब तक ... टल न जाए
  rationale: यह छिपे रहने की अंतिम सीमा बताता है। रोष के संदर्भ में ‘टल न जाए’ हिन्दी में स्वाभाविक है और संकट के पास से निकल जाने का भाव रखता है।
- source_word: זָעַם
  choice: रोष
  rationale: यह न्यायकारी क्रोध या प्रकोप का अर्थ रखता है। ‘रोष’ गरिमापूर्ण और अर्थगर्भित है, पर मूल की तरह यह नहीं जोड़ता कि रोष किसका है।
theological_decisions:
- issue: זָעַם का कर्ता और आशय
  choice: ‘रोष’ रखा गया और उसका कर्ता अनकहा छोड़ा गया।
  alternative: ‘प्रकोप’ या व्याख्यात्मक रूप से ‘यहोवा का क्रोध’।
  rationale: पद में यह स्पष्ट नहीं कहा गया कि रोष किसका है। संदर्भ ईश्वरीय न्याय की ओर संकेत कर सकता है, पर अनुवाद में ‘यहोवा का’ जोड़ना मूल की वास्तविक अस्पष्टता को समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गंभीर और भविष्यद्वक्ताई संबोधन रखा गया है। ‘प्रजा’ को सामूहिक एकवचन मानकर सभी आज्ञाएँ एकवचन में हैं। शब्दावली सामान्य पाठक के लिए सुबोध है, जबकि ‘रोष’ पद की न्याय-संबंधी गंभीरता को बनाए रखता है।
