id: ISA.26.5
reference: Isaiah 26:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י הֵשַׁח֙ יֹשְׁבֵ֣י מָר֔וֹם קִרְיָ֖ה נִשְׂגָּבָ֑ה יַשְׁפִּילֶ֤/נָּה יַשְׁפִּילָ/הּ֙ עַד אֶ֔רֶץ יַגִּיעֶ֖/נָּה עַד עָפָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/005.yaml
  text: For he has brought down those who dwell on high[a], the lofty city; he lays it low, he lays it low to the earth; he brings it down to the dust.
translation:
  language: hi
  text: क्योंकि उसने ऊँचाई पर बसनेवालों को—ऊँची नगरी को—नीचे गिरा दिया है; वह उसे नीचे करता है, उसे धरती तक नीचे करता है; उसे धूल तक पहुँचा देता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद निकटवर्ती स्तुति और भरोसे का कारण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ उसका व्याख्यात्मक संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: הֵשַׁח
  choice: नीचा कर दिया है
  rationale: שׁחח के हिफ़ील रूप में किसी को नीचा करने या गिराने का कारक भाव है; यह चयन ठोस ऊँचाई और अपमान—दोनों संकेत बनाए रखता है।
- source_word: יֹשְׁבֵי מָרוֹם
  choice: ऊँचे स्थान पर रहनेवालों
  rationale: शाब्दिक स्थानगत अर्थ को बनाए रखता है और साथ ही प्रतिष्ठा, सुरक्षा या घमंड का संभावित रूपक खुला छोड़ता है।
- source_word: קִרְיָה נִשְׂגָּבָה
  choice: उस ऊँची नगरी को
  rationale: ‘नगरी’ काव्यात्मक किंतु सुबोध है और נִשְׂגָּבָה की ऊँचे पर स्थापित अथवा उन्नत होने की छवि को सुरक्षित रखता है। इसे पूर्ववर्ती पदबंध की समानाधिकरणीय व्याख्या के रूप में रखा गया है।
- source_word: יַשְׁפִּילֶנָּה יַשְׁפִּילָהּ
  choice: वह उसे झुकाकर ... ले आता है
  rationale: दोनों रूपों की संयुक्त, तीव्र करनेवाली क्रिया को हिन्दी में सतत गिराए जाने की गति से व्यक्त किया गया है; अनावश्यक कठोर शब्दशः पुनरावृत्ति से बचते हुए बल बना रहता है।
- source_word: עַד אֶרֶץ
  choice: धरती तक
  rationale: אֶרֶץ का निकट lexical correspondence रखता है और समानांतर ‘धूल’ के साथ नगरी के पूर्ण पतन की छवि देता है।
- source_word: יַגִּיעֶנָּה
  choice: उसे ... पहुँचा देता है
  rationale: נגע के हिफ़ील का शाब्दिक कारक अर्थ ‘पहुँचाना/छुआ देना’ है; इससे मूल की ठोस गति बनी रहती है।
- source_word: עַד עָפָר
  choice: धूल तक
  rationale: עָפָר की काव्यात्मक तथा अपमान और पूर्ण पतन से जुड़ी छवि को सीधे सुरक्षित रखता है।
theological_decisions:
- issue: ‘ऊँची नगरी’ को किसी निश्चित ऐतिहासिक नगर या शक्ति के रूप में पहचानना
  choice: नामरहित और सामान्य संदर्भ बनाए रखना
  alternative: बाबेल, मानवीय घमंड, या कोई विशिष्ट शत्रु नगर
  rationale: इब्रानी पाठ नगर का नाम नहीं बताता; अनुवाद को यह व्याख्यात्मक खुलापन बनाए रखना चाहिए।
- issue: יֹשְׁבֵי מָרוֹם और קִרְיָה נִשְׂגָּבָה का वाक्यगत संबंध
  choice: ‘ऊँची नगरी’ को ऊँचे स्थान पर रहनेवालों से समानाधिकरण में दिखाना
  alternative: दो अलग कर्मों—ऊँचे निवासियों और ऊँची नगरी—के रूप में पढ़ना
  rationale: काव्यगत विन्यास समानाधिकरण का समर्थन करता है, पर मूल की संक्षिप्तता में कुछ वाक्यगत खुलापन है; डैश संबंध दिखाता है, किसी अतिरिक्त पहचान को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण और काव्यात्मक, पर सामान्य पाठक के लिए सहज। ‘नगरी’ यशायाह की काव्यभाषा के अनुकूल है। मुख्य पाठ में [a] चिह्न उपस्थित है।
