  text: יְהוָ֖ה בַּ/צַּ֣ר פְּקָד֑וּ/ךָ צָק֣וּ/ן לַ֔חַשׁ מוּסָרְ/ךָ֖ לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/016.yaml
  text: O Yahweh[a], in distress they sought you[c][b]; they poured out a whispered prayer when your discipline was upon them.
translation:
  language: hi
  text: हे यहोवा, संकट में उन्होंने तुझे खोजा[a]; जब तेरा अनुशासन[c] उन पर था, तब उन्होंने फुसफुसाकर प्रार्थना की[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वे तेरी ओर फिरे,’ ‘उन्होंने तेरी सुधि ली,’ अथवा ‘उन्होंने तुझसे भेंट की’; इब्रानी क्रिया का अर्थ किसी पर ध्यान देना, उसे खोजना या उससे भेंट करना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से सम्भवतः ‘उन्होंने फुसफुसाहट उंडेली’; यह संक्षिप्त इब्रानी अभिव्यक्ति दुःख में की गई धीमी विनती या बुदबुदाहट का वर्णन कर सकती है।
    reason: lexical_alternative
  - marker: c
    text: ‘तेरा अनुशासन’ का अनुवाद ‘तेरी ताड़ना,’ ‘तेरा सुधार’ या ‘तेरी शिक्षा’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण ‘यहोवा’ में रखा गया है; सम्बोधन को ‘हे’ से व्यक्त किया गया है।
- source_word: בַּצַּר
  choice: संकट में
  rationale: यहाँ צַר किसी शाब्दिक संकरे स्थान के बजाय विपत्ति या क्लेश की दशा बताता है; ‘संकट में’ सहज और व्यापक हिन्दी है।
- source_word: פְּקָדוּךָ
  choice: उन्होंने तुझे खोजा
  rationale: פקד का अर्थ ध्यान देना, सुधि लेना, भेंट करना या किसी की ओर फिरना हो सकता है। संकट और प्रार्थना के इस प्रसंग में ‘खोजा’ उपयुक्त है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: צָקוּן
  choice: उन्होंने ... की
  rationale: צוק यहाँ किसी वाणी को उंडेलने या बाहर निकालने का भाव देता है। हिन्दी में ‘प्रार्थना उंडेली’ की अपेक्षा ‘फुसफुसाकर प्रार्थना की’ अधिक स्वाभाविक है; उंडेलने का चित्र पादटिप्पणी में दिया गया है।
- source_word: לַחַשׁ
  choice: फुसफुसाकर प्रार्थना
  rationale: לחש धीमी फुसफुसाहट या बुदबुदाहट का द्योतक है। प्रसंग इसे दबी हुई विनती के रूप में समझने का समर्थन करता है, पर मूल की संक्षिप्तता और व्यापकता पादटिप्पणी में बताई गई है।
- source_word: מוּסָרְךָ
  choice: तेरा अनुशासन
  rationale: מוּסָר में शिक्षा, सुधार और ताड़ना के अर्थ सम्मिलित हो सकते हैं। ‘अनुशासन’ सुधारात्मक आयाम को बनाए रखते हुए अत्यधिक दंडात्मक अर्थ आरोपित नहीं करता।
- source_word: לָמוֹ
  choice: उन पर
  rationale: सर्वनामयुक्त पूर्वसर्ग को यहाँ परमेश्वर के अनुशासन के उन पर होने से जोड़ा गया है; ‘उन पर’ हिन्दी में यह सम्बन्ध स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: परमेश्वर के מוּסָר का स्वरूप
  choice: तेरा अनुशासन
  alternative: तेरी ताड़ना; तेरी शिक्षा
  rationale: पद में दुःख लोगों को परमेश्वर की ओर मोड़ता है। ‘अनुशासन’ सुधारात्मक अर्थ को रखता है, पर इसे केवल शिक्षा या केवल दंड तक सीमित नहीं करता।
- issue: לַחַשׁ का प्रार्थनात्मक अर्थ
  choice: फुसफुसाकर प्रार्थना की
  alternative: फुसफुसाहट निकाली; बुदबुदाए
  rationale: परमेश्वर को संकट में खोजने का प्रसंग दबी हुई प्रार्थना का संकेत देता है। फिर भी मूल शब्द अपने आप में केवल धीमी वाणी भी बता सकता है, इसलिए यह अनिश्चितता पादटिप्पणी में रखी गई है।
- issue: פקד द्वारा परमेश्वर की ओर प्रतिक्रिया
  choice: तुझे खोजा
  alternative: तेरी ओर फिरे; तेरी सुधि ली; तुझसे भेंट की
  rationale: क्रिया का अर्थ-क्षेत्र व्यापक है। संकट और विनती के सन्दर्भ में ‘खोजा’ उपयुक्त है, लेकिन अन्य सम्भव अर्थों को निर्णायक रूप से नकारा नहीं गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। एकवचन सम्बोधन में ‘तू/तेरा’ बाइबलीय काव्य की निकटता और हिन्दी की प्रचलित धार्मिक शैली के अनुरूप है। वाक्य-क्रम को स्वाभाविक हिन्दी के लिए हल्का पुनर्गठित किया गया है, जबकि मूल की अर्थगत अनिश्चितताएँ पादटिप्पणियों में सुरक्षित हैं।
