source:
  edition: WLC
  text: מֵתִים֙ בַּל יִחְי֔וּ רְפָאִ֖ים בַּל יָקֻ֑מוּ לָ/כֵ֤ן פָּקַ֨דְתָּ֙ וַ/תַּשְׁמִידֵ֔/ם וַ/תְּאַבֵּ֥ד כָּל זֵ֖כֶר לָֽ/מוֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/014.yaml
  text: The dead do not live[a]; the shades do not rise. Therefore you have punished them and destroyed them[c][b], and you have made all memory of them perish.
translation:
  language: hi
  text: मरे हुए जीवित नहीं होंगे; मृतात्माएँ[a] नहीं उठेंगी। इसलिए तूने उन्हें दण्ड दिया[b] और उनका नाश कर दिया; तूने उनकी सारी स्मृति मिटा दी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू शब्द का अर्थ यहाँ अधोलोक में पड़े मृतक हैं, न कि रपाई कहलाने वाली प्राचीन जाति।
    reason: lexical_alternative
  - marker: b
    text: या “तूने उनसे लेखा लिया”; हिब्रू क्रिया का अर्थ कृपा या न्याय के लिए ध्यान देना भी हो सकता है, पर यहाँ प्रसंग दण्ड का समर्थन करता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “तूने उनका सारा स्मरण नष्ट कर दिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵתִים
  choice: मरे हुए
  rationale: बहुवचन संज्ञार्थक प्रयोग है; हिन्दी में यह सामूहिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּל יִחְיוּ
  choice: जीवित नहीं होंगे
  rationale: काव्यात्मक निषेध के साथ अपूर्ण क्रिया वर्तमान दशा और आगे की असम्भावना दोनों का संकेत दे सकती है; हिन्दी में भविष्यत् रूप इस न्याय की अपरिवर्तनीयता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: רְפָאִים
  choice: मृतात्माएँ
  rationale: यहाँ समान्तर पंक्ति और अधोलोक-संबंधी प्रयोग के कारण अर्थ प्राचीन रपाई जाति नहीं, बल्कि मृतकों की आत्माएँ है।
- source_word: בַּל יָקֻמוּ
  choice: नहीं उठेंगी
  rationale: קום का सीधा अर्थ सुरक्षित रहता है और मृत्यु से उठने अथवा फिर खड़े होने की काव्यात्मक अनुगूँज खुली रहती है।
- source_word: לָכֵן
  choice: इसलिए
  rationale: पूर्व कथन और उसके परिणाम के बीच स्पष्ट तार्किक संबंध व्यक्त करता है।
- source_word: פָּקַדְתָּ
  choice: तूने उन्हें दण्ड दिया
  rationale: פקד के व्यापक अर्थ-क्षेत्र में यहाँ विनाशकारी न्याय का प्रसंग दण्ड अथवा लेखा लेने का अर्थ समर्थित करता है।
- source_word: וַתַּשְׁמִידֵם
  choice: उनका नाश कर दिया
  rationale: शक्तिशाली विनाशवाचक अर्थ को बनाए रखता है, पर दार्शनिक पूर्ण-विलोपन का अतिरिक्त दावा नहीं जोड़ता।
- source_word: וַתְּאַבֵּד כָּל זֵכֶר לָמוֹ
  choice: तूने उनकी सारी स्मृति मिटा दी
  rationale: हिन्दी का स्वाभाविक मुहावरा है और उनके समस्त स्मरण के लुप्त किए जाने का अर्थ स्पष्ट करता है।
theological_decisions:
- issue: רְפָאִים का अभिप्राय
  choice: अधोलोक के मृतक—‘मृतात्माएँ’
  alternative: रपाई नामक प्राचीन जाति
  rationale: ‘मरे हुए’ के साथ समान्तरता और ‘जीवित होना/उठना’ क्रियाएँ यहाँ मृत प्राणियों की ओर संकेत करती हैं, किसी जातीय समूह की ओर नहीं।
- issue: ‘नहीं उठेंगी’ का धर्मवैज्ञानिक आशय
  choice: कविता में न्याय पाए इन शत्रु शासकों या शक्तियों के अपरिवर्तनीय पतन का कथन
  alternative: सभी मृतकों के पुनरुत्थान का सार्वभौमिक निषेध
  rationale: सीधा कथन सुरक्षित रखा गया है, पर इसे सम्पूर्ण पुनरुत्थान-सिद्धान्त पर सार्वभौमिक घोषणा मानकर तनाव को चुपचाप हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुबोध शैली। परमेश्वर के लिए एकवचन ‘तू’ बाइबिलीय काव्य की सीधी संबोधन-शैली को बनाए रखता है।
