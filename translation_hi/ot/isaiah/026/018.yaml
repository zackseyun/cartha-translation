id: ISA.26.18
reference: Isaiah 26:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הָרִ֣ינוּ חַ֔לְנוּ כְּמ֖וֹ יָלַ֣דְנוּ ר֑וּחַ יְשׁוּעֹת֙ בַּל נַ֣עֲשֶׂה אֶ֔רֶץ וּ/בַֽל יִפְּל֖וּ יֹשְׁבֵ֥י תֵבֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/018.yaml
  text: We were pregnant[a], we writhed in labor; as it were, we gave birth to wind. We accomplished no deliverance in the earth[c][b], and the inhabitants of the world were not born.
translation:
  language: hi
  text: हमने गर्भ धारण किया[a], हम प्रसव-पीड़ा से तड़पे; मानो हमने हवा[b] को जन्म दिया। हम धरती पर कोई उद्धार नहीं कर पाए, और संसार के निवासी गिरे नहीं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम गर्भवती हुए।”
    reason: lexical_alternative
  - marker: b
    text: या, “साँस” अथवा “आत्मा”; इब्रानी शब्द का अर्थ “हवा,” “साँस” या “आत्मा” हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “संसार के निवासियों ने जन्म नहीं लिया” अथवा “संसार के निवासी जन्म लेकर नहीं आए।” इब्रानी क्रिया का सामान्य अर्थ “गिरना” है, पर यहाँ कुछ लोग इसे पद की प्रसव-छवि के अनुसार जन्म लेने के अर्थ में समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: הָרִינוּ
  choice: हम गर्भवती हुए
  rationale: क्रिया הרה गर्भवती होने या गर्भधारण करने को व्यक्त करती है। मुख्य पाठ में गर्भावस्था का भाव रखा गया है, जबकि गर्भधारण का निकट विकल्प पादटिप्पणी में दिया गया है।
- source_word: חַלְנוּ
  choice: हम प्रसव-पीड़ा से तड़पे
  rationale: प्रसव के संदर्भ में חול/חיל पीड़ा और तड़पने का बोध देता है; यह अनुवाद चित्र की तीव्रता को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: כְּמוֹ
  choice: मानो
  rationale: यह तुलना के साथ कुछ विडंबनापूर्ण या काल्पनिक भाव प्रस्तुत करता है और हिन्दी में स्वाभाविक रूप से अगले रूपक से जुड़ता है।
- source_word: יָלַדְנוּ
  choice: हमने ... को जन्म दिया
  rationale: ילד प्रसव और जन्म देने की सामान्य क्रिया है; हिन्दी में यही सर्वाधिक स्पष्ट और स्वाभाविक अभिव्यक्ति है।
- source_word: רוּחַ
  choice: हवा
  rationale: רוּחַ का अर्थ हवा, साँस या आत्मा हो सकता है। निष्फल प्रसव के इस रूपक में 'हवा' खाली और व्यर्थ परिणाम को सबसे स्पष्ट रूप से व्यक्त करती है, जबकि अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: יְשׁוּעֹת
  choice: छुटकारे के ... काम
  rationale: ישׁועה का बहुवचन उद्धार या छुटकारे के कार्यों को सूचित कर सकता है। 'छुटकारे के काम' बहुवचन का भाव बनाए रखता है और हिन्दी में עשה के साथ स्वाभाविक है।
- source_word: אֶרֶץ
  choice: धरती पर
  rationale: אֶרֶץ का अर्थ देश या धरती हो सकता है। अगले खंड के תֵבֵל, 'संसार,' के साथ व्यापक समानांतरता के कारण 'धरती' उपयुक्त है।
- source_word: יִפְּלוּ
  choice: गिरे नहीं
  rationale: נפל का सामान्य अर्थ 'गिरना' है। प्रसव-संबंधी संदर्भ में इसे 'जन्म लेना' भी समझा गया है; उस प्रासंगिक विकल्प को पादटिप्पणी में रखा गया है ताकि अस्पष्टता न मिटे।
- source_word: יֹשְׁבֵי תֵבֵל
  choice: संसार के निवासी
  rationale: यह תבל में रहने वालों के लिए मानक काव्यात्मक अभिव्यक्ति है; 'संसार के निवासी' संक्षिप्त, गरिमापूर्ण और स्पष्ट है।
theological_decisions:
- issue: प्रसव के रूपक में רוּחַ का अर्थ
  choice: हवा
  alternative: साँस; आत्मा
  rationale: संदर्भ गर्भावस्था और प्रसव के बाद निष्फलता का विलाप करता है। 'आत्मा' चुनने से ऐसा सकारात्मक आत्मिक अर्थ आ सकता है जिसे संदर्भ अनिवार्य नहीं करता; इसलिए अन्य अर्थ पादटिप्पणी में रखे गए हैं।
- issue: अंतिम खंड में יִפְּלוּ का अर्थ
  choice: गिरे नहीं
  alternative: जन्म नहीं लिया; जन्म लेकर नहीं आए
  rationale: मुख्य पाठ में נפל का सामान्य शाब्दिक अर्थ रखा गया है। फिर भी पूरे पद की प्रसव-छवि जन्म-संबंधी अर्थ को संभव बनाती है, इसलिए उस व्याख्या को पादटिप्पणी में स्पष्ट रूप से सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण काव्यात्मक गद्य रखा गया है। प्रसव की विस्तृत छवि को स्पष्ट रखा गया है, और רוּחַ तथा יִפְּלוּ की वास्तविक अर्थगत अस्पष्टताओं को मुख्य पाठ एवं पादटिप्पणियों के संयोजन से सुरक्षित किया गया है।
