  text: תִּרְמְסֶ֖/נָּה רָ֑גֶל רַגְלֵ֥י עָנִ֖י פַּעֲמֵ֥י דַלִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/006.yaml
  text: The foot tramples it— the feet of the poor[b][a], the steps of the needy.
translation:
  language: hi
  text: पाँव उसे रौंदता है[a]—दीनों के पाँव, निर्बलों[b] के कदम।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे “पाँव उसे रौंदेगा” भी अनुवाद किया जा सकता है; हिब्रू क्रिया संदर्भ में भविष्य का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: “निर्बल” का अनुवाद “जरूरतमंद,” “साधनहीन” या “निम्न स्थिति के लोग” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּרְמְסֶנָּה
  choice: उसे रौंदता है
  rationale: रמס का अर्थ ‘रौंदना/पैरों तले कुचलना’ है। स्त्रीलिंग कर्म-प्रत्यय निकटवर्ती संदर्भ की ‘ऊँची नगरी’ (पद 5) की ओर संकेत करता है; हिन्दी में उसके लिए ‘उसे’ स्वाभाविक है। वर्तमान काल काव्यात्मक दृश्य को सजीव रखता है, यद्यपि संदर्भ में भविष्यकाल भी सम्भव है।
- source_word: רָגֶל
  choice: पाँव
  rationale: एकवचन संज्ञा यहाँ सामूहिक और काव्यात्मक रूप में प्रयुक्त है; आगे के समानांतर पद इसे विस्तार देते हैं।
- source_word: רַגְלֵי עָנִי
  choice: दीनों के पाँव
  rationale: עָנִי गरीबी, पीड़ा और सामाजिक दमन से दबे व्यक्ति को सूचित कर सकता है। ‘दीन’ इन अर्थ-छायाओं को संक्षिप्त और गरिमापूर्ण ढंग से रखता है; सामूहिक आशय के कारण हिन्दी में बहुवचन स्वाभाविक है।
- source_word: פַּעֲמֵי
  choice: कदम
  rationale: शब्द का अर्थ ‘कदम/पदचिह्न’ है। ‘कदम’ पहले अर्धांश के ‘पाँव’ के साथ स्वाभाविक काव्यात्मक समानांतर बनाता है।
- source_word: דַלִּים
  choice: निर्बलों
  rationale: דַלִּים उन लोगों को सूचित करता है जो कमजोर, साधनहीन, निम्न दशा में या जरूरतमंद हैं। ‘निर्बल’ עָנִי के लिए प्रयुक्त ‘दीन’ से शब्दार्थगत भेद बनाए रखता है।
theological_decisions:
- issue: ‘उसे’ में स्त्रीलिंग प्रत्यय का संदर्भ
  choice: इसे पद 5 में नीची की गई ऊँची नगरी का संकेत माना गया है।
  alternative: कर्म को अनिर्दिष्ट छोड़ना।
  rationale: निकटवर्ती संदर्भ में ऊँची नगरी को भूमि तक गिराने का वर्णन है; पद 6 उसी चित्र को आगे बढ़ाता है। ‘उसे’ मूल पाठ के सर्वनामिक कर्म को बनाए रखता है और कोई अतिरिक्त धर्मसैद्धान्तिक निष्कर्ष नहीं जोड़ता।
- issue: क्रिया का काल
  choice: सजीव काव्यात्मक वर्तमान—‘रौंदता है’।
  alternative: भविष्यकाल—‘रौंदेगा’।
  rationale: हिब्रू अपूर्ण क्रिया संदर्भ में वर्तमान-जैसी सजीवता या भविष्य का बोध दे सकती है। मुख्य पाठ में काव्यात्मक वर्तमान रखा गया है और भविष्य की सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘दीन’ और ‘निर्बल’ समानांतर हिब्रू शब्दों की निकटता के साथ उनका हल्का अर्थभेद भी सुरक्षित रखते हैं।
