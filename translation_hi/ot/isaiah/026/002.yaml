review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the imperative to open the plural gates, the purposive/resultative clause, the collective singular ‘righteous nation,’ and the attributive participle describing that nation. The primary rendering of אֱמֻנִים as ‘विश्वासयोग्यता’ is semantically defensible, but the Hindi collocation is unnecessarily stiff.
  naturalness: ‘धर्मी जाति’ can be understood as a caste in contemporary Hindi, despite the explanatory note. ‘धर्मी राष्ट्र’ more naturally conveys גוֹי in this context. Recasting the final apposition as a relative clause also removes the somewhat strained dash construction and permits agreement with ‘राष्ट्र.’
  terminology: ‘धर्मी’ appropriately renders צַדִּיק. ‘निष्ठा’ is a clear, idiomatic modern-Hindi equivalent for covenantal faithfulness and does not reduce the term to inward belief. The footnote preserves the viable semantic alternatives of truth and faith.
  issues:
  - severity: medium
    issue: ‘जाति’ is potentially misleading for גוֹי.
    rationale: In modern standard Hindi, ‘जाति’ commonly denotes caste. Although it can mean a people or nation in elevated biblical usage, ‘राष्ट्र’ is clearer here and corresponds directly to the source’s collective national sense.
  - severity: medium
    issue: ‘विश्वासयोग्यता बनाए रखती है’ is stylistically cumbersome.
    rationale: The abstract noun is intelligible but unusually bureaucratic, and the feminine verb follows ‘जाति.’ A relative clause with ‘राष्ट्र’ and the idiomatic noun ‘निष्ठा’ better conveys the Hebrew participial characterization.
  - severity: low
    issue: The footnote’s ‘सत्य पर बनी रहती है’ does not directly express the lexical alternative ‘keeps truth.’
    rationale: The alternative should reflect the Hebrew semantic option without introducing the different image of remaining founded upon truth.
  revised_text: फाटक खोलो, ताकि वह धर्मी राष्ट्र भीतर आए जो निष्ठा बनाए रखता है।[a]
