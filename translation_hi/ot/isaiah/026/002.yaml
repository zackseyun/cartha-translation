revisions:
- from: फाटकों को खोलो, ताकि धर्मी जाति भीतर आए—वह जो विश्वासयोग्यता बनाए रखती है।[a]
  to: फाटक खोलो, ताकि वह धर्मी राष्ट्र भीतर आए जो निष्ठा बनाए रखता है।[a]
  rationale: The revision replaces potentially caste-associated ‘जाति’ with ‘राष्ट्र,’ renders the nation’s defining participial clause in natural Hindi, and uses ‘निष्ठा’ as an idiomatic equivalent of faithfulness. The note retains the source term’s disputed or context-sensitive range without imposing a narrower theological interpretation.
