  yaml_path: translation/ot/isaiah/026/002.yaml
  text: Open the gates[a], that the righteous nation may enter, the one that keeps faithfulness.
translation:
  language: hi
  text: फाटक खोलो, ताकि वह धर्मी राष्ट्र भीतर आए जो निष्ठा बनाए रखता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो सत्यनिष्ठ रहता है,” अथवा “जो विश्वास रखता है।” इब्रानी אֱמֻנִים प्रसंग के अनुसार निष्ठा, भरोसेमंदी, सत्य या विश्वास का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְחוּ
  choice: खोलो
  rationale: פתח का काल इम्पेरेटिव बहुवचन है; ‘खोलो’ सीधी और स्वाभाविक हिन्दी आज्ञा है।
- source_word: שְׁעָרִים
  choice: फाटकों को
  rationale: बहुवचन ‘फाटक’; प्रसंग में नगर के प्रवेश-द्वार अभिप्रेत हैं। हिन्दी में कर्मचिह्न ‘को’ आज्ञा को स्वाभाविक बनाता है।
- source_word: וְיָבֹא
  choice: ताकि … भीतर आए
  rationale: आज्ञा के बाद वाव सहित अपूर्ण क्रिया उद्देश्य अथवा परिणाम व्यक्त करती है। फाटकों के बिंब के कारण ‘भीतर आए’ उपयुक्त है।
- source_word: גוֹי צַדִּיק
  choice: धर्मी जाति
  rationale: גוי सामूहिक जन-समुदाय अथवा राष्ट्र को और צדיק उसकी नैतिक-वाचागत धार्मिकता को व्यक्त करता है। ‘जाति’ यहाँ बाइबिलीय अर्थ में जन-समुदाय है, सामाजिक वर्ण नहीं।
- source_word: שֹׁמֵר
  choice: जो … बनाए रखती है
  rationale: एकवचन कृदंत जाति का गुण बताता है। ‘बनाए रखती है’ निष्ठा को लगातार थामे रहने का भाव स्वाभाविक हिन्दी में देता है।
- source_word: אֱמֻנִים
  choice: विश्वासयोग्यता
  rationale: אמן से बना यह बहुवचन अमूर्त/तीव्र रूप स्थिर निष्ठा, भरोसेमंदी या सत्य का बोध करा सकता है। ‘विश्वासयोग्यता’ यहाँ आचरणगत दृढ़ निष्ठा को व्यक्त करती है।
theological_decisions:
- issue: धर्मी जाति के संबंध में אֱמֻנִים का अर्थ
  choice: विश्वासयोग्यता
  alternative: सत्य; विश्वास; निष्ठा
  rationale: यह चयन जाति की स्थिर, भरोसेमंद निष्ठा को सामने रखता है और इसे केवल मन के विश्वास तक सीमित नहीं करता। इब्रानी की अर्थ-व्याप्ति को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘धर्मी जाति’ मूल की सामूहिक और वाचागत ध्वनि बनाए रखता है; विराम-चिह्न के बाद का वाक्यांश उसी जाति का वर्णन करता है।
