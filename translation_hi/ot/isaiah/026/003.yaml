source:
  edition: WLC
  text: יֵ֣צֶר סָמ֔וּךְ תִּצֹּ֖ר שָׁל֣וֹם שָׁל֑וֹם כִּ֥י בְ/ךָ֖ בָּטֽוּחַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/003.yaml
  text: You keep in perfect peace the mind that is stayed on you[c][b][a], because it trusts in you.
translation:
  language: hi
  text: स्थिर मन[b][c] को आप पूर्ण शांति[a] में सुरक्षित रखते हैं, क्योंकि वह आप पर भरोसा रखता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘शांति, शांति’ है; पुनरावृत्ति भरपूर या पूर्ण शांति पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: ‘मन’ के लिए ‘प्रवृत्ति’, ‘अभिप्राय’ या ‘मन की दशा’ भी संभव है।
    reason: lexical_alternative
  - marker: c
    text: 'एक अधिक व्यक्तिगत अनुवाद संभव है: ‘जिसका मन स्थिर है, उसे आप पूर्ण शांति में सुरक्षित रखते हैं।’ मूल इब्रानी में ‘मन’ सीधे वाक्य का अंग है; अलग से ‘व्यक्ति’ या ‘वह मनुष्य’ नहीं लिखा है।'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵצֶר
  choice: मन
  rationale: यह शब्द रचना, प्रवृत्ति, अभिप्राय या भीतरी मानसिक दशा को सूचित कर सकता है। इस प्रसंग में भरोसे और स्थिरता के साथ इसका संबंध होने के कारण ‘मन’ सहज और अर्थानुकूल है।
- source_word: סָמוּךְ
  choice: आप पर टिका है
  rationale: סמך से बना यह रूप सहारा पाए हुए, दृढ़ता से स्थित या निर्भर होने का भाव देता है। ‘आप पर टिका’ स्थिरता और परमेश्वर पर निर्भरता—दोनों को व्यक्त करता है।
- source_word: תִּצֹּר
  choice: बनाए रखते हैं
  rationale: נצר का अर्थ रखना, रक्षा करना या सुरक्षित बनाए रखना है। शांति के साथ ‘बनाए रखते हैं’ आधुनिक हिन्दी में स्वाभाविक है और निरंतर संरक्षण का भाव देता है।
- source_word: שָׁלוֹם שָׁלוֹם
  choice: पूर्ण शांति
  rationale: इब्रानी में ‘शांति’ की पुनरावृत्ति उसके भरपूर या संपूर्ण होने पर बल देती है। ‘पूर्ण शांति’ इस बल को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי पहले कथन का कारण बताता है; इसलिए ‘क्योंकि’ संबंध को स्पष्ट रखता है।
- source_word: בְךָ
  choice: आप पर
  rationale: בטח के साथ ב भरोसे के आधार या लक्ष्य को दर्शाता है। हिन्दी में ‘आप पर भरोसा रखना’ स्वाभाविक प्रयोग है।
- source_word: בָּטוּחַ
  choice: वह ... भरोसा रखता है
  rationale: यह रूप भरोसा रखने या निश्चिंत होने की दशा बताता है और व्याकरणतः ‘मन’ से मेल खाता है। ‘वह’ का निकटतम पूर्वपद ‘मन’ है, जिससे मूल पाठ का मानवीय व्यक्तित्व जोड़े बिना उसका व्याकरणिक संबंध बना रहता है।
theological_decisions:
- issue: कर्ता-संदर्भ और मनुष्य की भीतरी दशा
  choice: ‘मन’ को सीधे वाक्य का विषय/कर्म-संदर्भ बनाए रखना
  alternative: ‘जिस व्यक्ति का मन आप पर टिका है, उसे...’
  rationale: मूल इब्रानी में स्पष्ट पुरुषवाचक सर्वनाम नहीं, बल्कि יֵצֶר (‘मन/प्रवृत्ति’) है। हिन्दी वाक्य में ‘मन’ को प्रत्यक्ष रखना इस असामान्य पर अर्थपूर्ण रचना को सुरक्षित रखता है; पादटिप्पणी अधिक व्यक्तिगत पारंपरिक रूप बताती है।
- issue: שָׁלוֹם की पुनरावृत्ति
  choice: पूर्ण शांति
  alternative: शांति, शांति
  rationale: पुनरावृत्ति तीव्रता और परिपूर्णता प्रकट करती है। ‘पूर्ण शांति’ इसका अर्थ सहज हिन्दी में देता है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- issue: ईश्वर को संबोधित करने का हिन्दी रूप
  choice: आदरार्थक ‘आप’
  alternative: एकवचन ‘तू’
  rationale: इब्रानी में संबोधन व्याकरणिक रूप से एकवचन है, पर हिन्दी में आदरार्थक ‘आप’ संख्या के बजाय सम्मान प्रकट करता है और सामान्य आधुनिक पाठक के लिए dignified तथा स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, काव्यात्मक और आदरपूर्ण रखी गई है। ‘आप पर टिका’ भरोसे की संबंधपरकता को व्यक्त करता है, और ‘पूर्ण शांति’ इब्रानी पुनरावृत्ति की तीव्रता को स्वाभाविक हिन्दी में प्रस्तुत करता है।
