  text: נַפְשִׁ֤/י אִוִּיתִ֨י/ךָ֙ בַּ/לַּ֔יְלָה אַף רוּחִ֥/י בְ/קִרְבִּ֖/י אֲשַֽׁחֲרֶ֑/ךָּ כִּ֞י כַּ/אֲשֶׁ֤ר מִשְׁפָּטֶ֨י/ךָ֙ לָ/אָ֔רֶץ צֶ֥דֶק לָמְד֖וּ יֹשְׁבֵ֥י תֵבֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/009.yaml
  text: My soul has desired you in the night[a]; indeed, my spirit within me seeks you early. For when your judgments are in the earth[c][b], the inhabitants of the world learn righteousness.
translation:
  language: hi
  text: रात में मेरे प्राण ने तुझे चाहा है; हाँ, मेरे भीतर की आत्मा तुझे भोर में खोजती है। क्योंकि जब तेरे न्याय पृथ्वी पर होते हैं, तब संसार के निवासी धार्मिकता सीखते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तब संसार के निवासी न्याय सीखते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשִׁי
  choice: मेरा प्राण
  rationale: यहाँ נֶפֶשׁ वक्ता के भीतरी व्यक्तित्व और अभिलाषा को दर्शाता है; ‘मेरा प्राण’ काव्यात्मक समानांतरता और मानवीय गहराई बनाए रखता है।
- source_word: אִוִּיתִיךָ
  choice: तेरी लालसा करता है
  rationale: क्रिया प्रबल चाह या उत्कंठा व्यक्त करती है। यह हिंदी में स्वाभाविक ढंग से उस स्थायी गहरी अभिलाषा को व्यक्त करता है।
- source_word: בַּלַּיְלָה
  choice: रात में
  rationale: इब्रानी काल-सूचक पद का सीधा और स्वाभाविक हिंदी रूप।
- source_word: אַף
  choice: हाँ
  rationale: यह समानांतर दूसरी पंक्ति को बल देकर आगे बढ़ाता है; ‘हाँ’ उसका पुष्टिकारक और तीव्रकारी भाव व्यक्त करता है।
- source_word: רוּחִי בְקִרְבִּי
  choice: मेरे भीतर मेरी आत्मा
  rationale: רוּחַ यहाँ נֶפֶשׁ के समानांतर वक्ता के अंतरतम को दर्शाता है; शब्दक्रम काव्यात्मक बल बनाए रखता है।
- source_word: אֲשַׁחֲרֶךָּ
  choice: भोर होते ही तुझे खोजती है
  rationale: שׁחר में प्रातःकाल खोजने का बिंब और तत्परतापूर्वक खोजने का भाव दोनों हैं। मुख्य पाठ में भोर का बिंब सुरक्षित रखा गया है।
- source_word: כִּי כַּאֲשֶׁר
  choice: क्योंकि जब
  rationale: संयोजन पिछली लालसा का कारण बताते हुए वह परिस्थिति प्रस्तुत करता है जिसमें संसार के निवासी सीखते हैं।
- source_word: מִשְׁפָּטֶיךָ
  choice: तेरे न्याय
  rationale: מִשְׁפָּט यहाँ परमेश्वर के न्यायिक निर्णयों अथवा न्याय के कार्यों को दर्शाता है; ‘तेरे न्याय’ संक्षिप्त और स्रोत के निकट है।
- source_word: לָאָרֶץ
  choice: पृथ्वी पर होते हैं
  rationale: इब्रानी पद अत्यंत संक्षिप्त है, शाब्दिक रूप से ‘पृथ्वी के लिए/पर’। ‘पृथ्वी पर होते हैं’ आगमन जैसी अतिरिक्त धारणा जोड़े बिना वाक्य को स्वाभाविक बनाता है।
- source_word: צֶדֶק
  choice: धार्मिकता
  rationale: צֶדֶק में नैतिक सहीपन और न्याय दोनों अर्थ-छायाएँ हैं। ‘धार्मिकता’ नैतिक-ईशवैज्ञानिक आयाम बनाए रखती है और वैकल्पिक ‘न्यायपूर्ण आचरण’ पादटिप्पणी में दिया गया है।
- source_word: לָמְדוּ
  choice: सीखते हैं
  rationale: पूर्ण क्रिया यहाँ सामान्य अथवा परिणामसूचक सत्य व्यक्त करती है; हिंदी वर्तमानकाल इस भाव को सहज रूप से देता है।
- source_word: יֹשְׁבֵי תֵבֵל
  choice: संसार के निवासी
  rationale: यह पद बसे हुए समस्त संसार में रहने वाले लोगों को दर्शाता है और उसके सार्वभौमिक विस्तार को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय न्याय के संदर्भ में צֶדֶק का अनुवाद
  choice: धार्मिकता
  alternative: न्यायपूर्ण आचरण
  rationale: यह शब्द परमेश्वर के सामने सही नैतिक जीवन और न्यायपूर्ण व्यवहार, दोनों को समेट सकता है। मुख्य पाठ में ‘धार्मिकता’ व्यापक नैतिक-ईशवैज्ञानिक अर्थ रखती है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। एकवचन संबोधन के लिए निकट और भक्तिपरक ‘तू/तेरा’ रूप अपनाया गया है। ‘प्राण’ और ‘आत्मा’ की समानांतरता, भोर का बिंब, तथा ‘धार्मिकता/न्यायपूर्ण आचरण’ की अर्थगत व्यापकता सुरक्षित रखी गई है।
