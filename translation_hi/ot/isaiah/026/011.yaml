id: ISA.26.11
reference: Isaiah 26:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְהוָ֛ה רָ֥מָה יָדְ/ךָ֖ בַּל יֶחֱזָי֑וּ/ן יֶחֱז֤וּ וְ/יֵבֹ֨שׁוּ֙ קִנְאַת עָ֔ם אַף אֵ֖שׁ צָרֶ֥י/ךָ תֹאכְלֵֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/011.yaml
  text: O Yahweh[a], your hand is lifted up, but they do not see. They will see and be put to shame by the zeal for your people; indeed[b], the fire for your enemies will consume them.
translation:
  language: hi
  text: हे यहोवा, तेरा हाथ उठा हुआ है, फिर भी वे नहीं देखते। वे प्रजा के प्रति तेरे उत्साह[a] को देखकर लज्जित होंगे; निश्चय ही आग तेरे शत्रुओं को भस्म कर देगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रजा का उत्साह।” इब्रानी पदबंध संक्षिप्त है और उसके एक से अधिक अर्थ सम्भव हैं।
    reason: alternative_reading
  - marker: b
    text: या, “तेरे शत्रुओं की आग उन्हें भस्म कर देगी।” इब्रानी शब्द-विन्यास इस संबंध की भी सम्भावना देता है, यद्यपि संदर्भ में शत्रुओं के विरुद्ध न्याय की आग अधिक संगत है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: दिव्य नाम को उसके प्रचलित हिन्दी रूप में रखा गया है और सम्बोधन को ‘हे’ से व्यक्त किया गया है।
- source_word: רָמָה יָדְךָ
  choice: तेरा हाथ उठा हुआ है
  rationale: ऊँचे उठे हाथ की मूल छवि को बनाए रखता है और उसे किसी एक प्रकार की दैवी कार्रवाई तक सीमित नहीं करता।
- source_word: בַּל יֶחֱזָיוּן
  choice: फिर भी वे नहीं देखते
  rationale: ‘देखना’ मूल क्रिया की सरलता रखता है; ‘फिर भी’ उठे हुए हाथ और उनके न देखने के विरोध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: יֶחֱזוּ וְיֵבֹשׁוּ
  choice: वे ... को देखकर लज्जित होंगे
  rationale: भावी प्रत्यावर्तन—अभी न देखना, पर अन्ततः देखकर लज्जित होना—को सहज हिन्दी में व्यक्त करता है।
- source_word: קִנְאַת עָם
  choice: तेरी प्रजा के लिए तेरे उत्साह
  rationale: सन्दर्भ में इसे अपनी प्रजा के पक्ष में यहोवा के प्रबल उत्साह के रूप में लिया गया है, पर संक्षिप्त इब्रानी पदबंध की वैकल्पिक व्याख्या पादटिप्पणी में सुरक्षित है।
- source_word: אַף
  choice: निश्चय ही
  rationale: अगले न्याय-वाक्य पर दिए गए बल को व्यक्त करता है।
- source_word: אֵשׁ צָרֶיךָ תֹאכְלֵם
  choice: तेरे शत्रुओं के लिए आग उन्हें भस्म कर देगी
  rationale: इब्रानी की संकुचित संरचना और ‘आग’ द्वारा भक्षण की छवि को रखता है; वैकल्पिक वाक्य-संबंध पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: קִנְאַת עָם का संबंध
  choice: यहोवा का अपनी प्रजा के लिए उत्साह
  alternative: प्रजा का उत्साह
  rationale: निकटवर्ती ‘तेरे शत्रु’ और दैवी न्याय का प्रसंग प्रथम अर्थ का समर्थन करते हैं, किन्तु इब्रानी रचना दोनों संबंधों की सम्भावना छोड़ती है।
- issue: אֵשׁ צָרֶיךָ का संबंध
  choice: तेरे शत्रुओं के लिए आग
  alternative: तेरे शत्रुओं की आग
  rationale: दैवी न्याय के प्रसंग में आग को शत्रुओं के विरुद्ध समझना अधिक संगत है, फिर भी इब्रानी संज्ञा-समूह दूसरे संबंध की व्याकरणिक सम्भावना रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। परमेश्वर के प्रति एकवचन निकट सम्बोधन ‘तेरा/तेरे’ मूल इब्रानी के अनुरूप रखा गया है। सभी वास्तविक अर्थगत अस्पष्टताएँ पादटिप्पणियों में सुरक्षित हैं।
