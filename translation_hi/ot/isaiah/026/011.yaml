- from: हे यहोवा, तेरा हाथ उठा हुआ है, फिर भी वे नहीं देखते। वे तेरी प्रजा के लिए तेरे उत्साह[a] को देखकर लज्जित होंगे; निश्चय ही तेरे शत्रुओं के लिए आग उन्हें भस्म कर देगी।[b]
  to: हे यहोवा, तेरा हाथ उठा हुआ है, फिर भी वे नहीं देखते। वे प्रजा के प्रति तेरे उत्साह[a] को देखकर लज्जित होंगे; निश्चय ही आग तेरे शत्रुओं को भस्म कर देगी।[b]
