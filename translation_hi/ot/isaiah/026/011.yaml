review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the raised hand, the people's present failure to perceive it, their future shame, and the fire imagery. However, it unnecessarily specifies both “your people” and “your zeal” in the main text where the compact Hebrew קִנְאַת עָם leaves the relationship less explicit. Its rendering of אֵשׁ צָרֶיךָ as “तेरे शत्रुओं के लिए आग उन्हें...” is syntactically awkward in Hindi and obscures the clause's sense.
  naturalness: Most of the verse is clear and suitably dignified. “तेरे शत्रुओं के लिए आग उन्हें भस्म कर देगी” is not idiomatic Hindi because the purposive phrase and pronoun create an unclear construction. The revised wording is natural while retaining the judgment image.
  terminology: “यहोवा,” “प्रजा,” “उत्साह,” “लज्जित,” and “भस्म कर देगी” suit modern standard Hindi and the elevated biblical register. “प्रजा के प्रति तेरे उत्साह” communicates divine zeal without making the people explicitly possessive in the translated line.
  issues:
  - severity: medium
    issue: The main text over-specifies the possessive relation in कִנְאַת עָם.
    rationale: “तेरी प्रजा के लिए तेरे उत्साह” makes both the people and the zeal explicitly Yahweh's, whereas the Hebrew only says “zeal of/for [the] people” in a compressed construction. The likely contextual sense may be represented, but the wording should avoid unnecessary specification and retain the alternative in the note.
  - severity: medium
    issue: The final fire clause is unnatural and unclear in Hindi.
    rationale: “तेरे शत्रुओं के लिए आग उन्हें भस्म कर देगी” does not naturally express whether the fire is directed against the enemies or belongs to them. “आग तेरे शत्रुओं को भस्म कर देगी” is idiomatic and expresses the contextual reading; the alternate construal remains in the footnote.
  revised_text: हे यहोवा, तेरा हाथ उठा हुआ है, फिर भी वे नहीं देखते। वे प्रजा के प्रति तेरे उत्साह[a] को देखकर लज्जित होंगे; निश्चय ही आग तेरे शत्रुओं को भस्म कर देगी।[b]
