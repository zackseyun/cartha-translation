id: ISA.26.8
reference: Isaiah 26:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַ֣ף אֹ֧רַח מִשְׁפָּטֶ֛י/ךָ יְהוָ֖ה קִוִּינ֑וּ/ךָ לְ/שִׁמְ/ךָ֥ וּֽ/לְ/זִכְרְ/ךָ֖ תַּאֲוַת נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/008.yaml
  text: Indeed[a], in the path of your judgments, O Yahweh, we have waited for you[b]; for your name and your remembrance are the desire of the soul.
translation:
  language: hi
  text: निश्चय ही, हे याहवे, तेरे न्यायों[a] के मार्ग पर हमने तेरी बाट जोही है; तेरा नाम और तेरा स्मरण[b] प्राण की अभिलाषा हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरा न्याय” अथवा “तेरी विधियाँ।”
    reason: lexical_alternative
  - marker: b
    text: या, “तेरी स्मृति।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: निश्चय ही
  rationale: यहाँ यह कण कथन पर बल देता है; ‘निश्चय ही’ उसके निश्चयात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֹרַח
  choice: मार्ग
  rationale: यह मूल रूपक को बनाए रखता है और न्यायों के संदर्भ में गरिमापूर्ण, स्वाभाविक हिन्दी है।
- source_word: מִשְׁפָּטֶיךָ
  choice: तेरे न्यायों
  rationale: बहुवचन रूप को बनाए रखते हुए यह परमेश्वर के न्यायपूर्ण निर्णयों और इतिहास में उसके न्यायकारी कार्यों—दोनों की संभावना खुली रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का लिप्यंतरण किया गया है, किसी उपाधि से उसका स्थान नहीं लिया गया।
- source_word: קִוִּינוּךָ
  choice: हमने तेरी बाट जोही है
  rationale: यह קוה में निहित आशाभरी प्रतीक्षा और पूर्ण क्रिया की वर्तमान प्रासंगिकता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְשִׁמְךָ
  choice: तेरा नाम
  rationale: ‘नाम’ परमेश्वर के प्रकट व्यक्तित्व और यश दोनों का संकेत दे सकता है; मूल की संक्षिप्तता सुरक्षित रखी गई है।
- source_word: וּלְזִכְרְךָ
  choice: तेरा स्मरण
  rationale: यह זֵכֶר की ‘स्मरण/स्मृति’ संबंधी व्यापकता तथा ‘तेरा नाम’ के साथ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: תַּאֲוַת נָפֶשׁ
  choice: प्राण की अभिलाषा
  rationale: यह एकवचन काव्यात्मक נֶפֶשׁ को अनावश्यक रूप से ‘हमारे प्राण’ में नहीं बदलता और तीव्र आंतरिक चाह को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; इसलिए उसका लिप्यंतरण करके नाम और उपाधि का भेद सुरक्षित रखा गया है।
- issue: מִשְׁפָּטֶיךָ का संदर्भगत अर्थ
  choice: तेरे न्यायों
  alternative: तेरा न्याय अथवा तेरी विधियाँ
  rationale: ‘न्यायों’ परमेश्वर की न्यायपूर्ण व्यवस्था और उसके न्यायकारी निर्णयों के बीच की मूल अर्थगत व्यापकता को किसी एक अर्थ में सीमित नहीं करता।
- issue: תַּאֲוַת נָפֶשׁ में कर्ता की पहचान
  choice: प्राण की अभिलाषा
  alternative: हमारे प्राण की अभिलाषा
  rationale: पहले पुरुष बहुवचन संदर्भ सामूहिक आशय सुझाता है, पर इब्रानी पदबंध में अधिकारवाचक ‘हमारा’ स्पष्ट नहीं है; इसलिए काव्यात्मक अनिश्चितता बनाए रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘बाट जोही है’ आशाभरी प्रतीक्षा का स्वाभाविक मुहावरा है; सर्वनामों में निकट, एकवचन ‘तेरा/तेरी’ मूल इब्रानी के संबोधन के अनुरूप है।
