source:
  edition: WLC
  text: יֻחַ֤ן רָשָׁע֙ בַּל לָמַ֣ד צֶ֔דֶק בְּ/אֶ֥רֶץ נְכֹח֖וֹת יְעַוֵּ֑ל וּ/בַל יִרְאֶ֖ה גֵּא֥וּת יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/010.yaml
  text: Though favor is shown to the wicked[a], he does not learn righteousness; in a land of uprightness he acts unjustly[e][d][c][b], and he does not see the majesty of Yahweh.
translation:
  language: hi
  text: चाहे दुष्ट पर कृपा की जाए[a], फिर भी वह धार्मिकता नहीं सीखता; सत्यनिष्ठा के देश में भी वह अन्याय करता है[b], और यहोवा के प्रताप को नहीं देखता[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि दुष्ट पर कृपा की जाए।” हिब्रू आरम्भ को रियायती के बजाय शर्तसूचक भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “सत्यनिष्ठा के देश” का अर्थ “खराई के देश,” “न्यायपूर्ण देश” या “सीधे देश” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ “देखता” में पहचानने या समझने का भाव हो सकता है; “प्रताप” का अनुवाद “महत्ता,” “ऊँचाई” या “उत्कर्ष” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֻחַן רָשָׁע
  choice: चाहे दुष्ट पर कृपा की जाए
  rationale: חנן के होफ़ाल रूप का निष्क्रिय अर्थ ‘कृपा की जाए’ है। संदर्भ में आरम्भिक उपवाक्य का रियायती भाव स्वाभाविक है, जबकि शर्तसूचक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בַּל לָמַד צֶדֶק
  choice: फिर भी वह धार्मिकता नहीं सीखता
  rationale: למד का सामान्य अर्थ ‘सीखना’ और צדק का व्यापक नैतिक अर्थ ‘धार्मिकता’ है; ‘फिर भी’ हिन्दी में विरोध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: בְּאֶרֶץ נְכֹחוֹת
  choice: सीधेपन के देश में भी
  rationale: נְכֹחוֹת में सीधेपन, सही व्यवस्था और नैतिक खराई का भाव है। ‘सीधेपन का देश’ मूल रूपक को बनाए रखता है; ‘भी’ रियायती विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְעַוֵּל
  choice: वह अन्याय करता है
  rationale: עול के पिएल रूप में अन्यायपूर्ण अथवा गलत आचरण का अर्थ है। यह संक्षिप्त और सामान्य पाठक के लिए स्पष्ट है।
- source_word: וּבַל יִרְאֶה
  choice: और ... नहीं देखता
  rationale: ראה का प्रत्यक्ष अर्थ ‘देखना’ है, जिसमें यहाँ पहचानने या समझने का भाव भी हो सकता है; मुख्य पाठ मूल बिंब को बनाए रखता है।
- source_word: גֵּאוּת יְהוָה
  choice: यहोवा की महिमा
  rationale: גאות ऊँचाई, उत्कर्ष या प्रताप/महिमा को व्यक्त करता है। ‘महिमा’ आधुनिक हिन्दी में दिव्य वैभव के लिए सहज है, जबकि वैकल्पिक सूक्ष्म अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से प्रतिस्थापित किया गया है।
theological_decisions:
- issue: आरम्भिक उपवाक्य का रियायती अथवा शर्तसूचक अर्थ
  choice: 'रियायती: ‘चाहे दुष्ट पर कृपा की जाए’'
  alternative: 'शर्तसूचक: ‘यदि दुष्ट पर कृपा की जाए’'
  rationale: संदर्भ कृपा मिलने के बावजूद दुष्ट के न बदलने पर बल देता है। फिर भी हिब्रू में सम्भव शर्तसूचक पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ‘देखना’ का प्रत्यक्ष या बोधात्मक अर्थ
  choice: मुख्य पाठ में ‘देखता’
  alternative: ‘पहचानता’ या ‘समझता’
  rationale: मूल क्रिया के दृश्य बिंब को बनाए रखते हुए उसके बोधात्मक अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और संक्षिप्त शैली रखी गई है। प्रतिनिधिक एकवचन ‘दुष्ट’ और मूल के नैतिक विरोध—कृपा, धार्मिकता, सीधापन, अन्याय—को बनाए रखा गया है।
