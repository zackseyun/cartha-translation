reference: Isaiah 47:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שְׁבִ֥י דוּמָ֛ם וּ/בֹ֥אִי בַ/חֹ֖שֶׁךְ בַּת כַּשְׂדִּ֑ים כִּ֣י לֹ֤א תוֹסִ֨יפִי֙ יִקְרְאוּ לָ֔/ךְ גְּבֶ֖רֶת מַמְלָכֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/005.yaml
  text: Sit in silence[a], and go into darkness, daughter of the Chaldeans; for no longer will they call you the mistress of kingdoms.
translation:
  language: hi
  text: मौन बैठ, और अँधेरे में चली जा, हे कसदियों की बेटी; क्योंकि अब से तुझे राज्यों की स्वामिनी[a] नहीं कहा जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राज्यों की मालकिन।”
    reason: גְּבֶרֶת के लिए अधिक बोलचाल का वैकल्पिक शब्द; ‘स्वामिनी’ और ‘मालकिन’ दोनों प्रभुत्व रखने वाली स्त्री का भाव दे सकते हैं।
lexical_decisions:
- source_word: שְׁבִי דוּמָם
  choice: मौन बैठ
  rationale: स्त्रीलिंग एकवचन आज्ञा और क्रियाविशेषण को संक्षिप्त, स्वाभाविक हिन्दी में रखते हुए थोपी गई चुप्पी और अपमान के दृश्य को बनाए रखता है।
- source_word: וּבֹאִי בַחֹשֶׁךְ
  choice: और अँधेरे में चली जा
  rationale: בוא की गति और חֹשֶׁךְ की ठोस भविष्यद्वाणी-संबंधी छवि दोनों को सुरक्षित रखता है; हिन्दी में ‘चली जा’ संबोधित स्त्री के लिए स्वाभाविक है।
- source_word: בַּת כַּשְׂדִּים
  choice: हे कसदियों की बेटी
  rationale: नगर और जाति के स्त्री-रूपक को ज्यों का त्यों रखता है और सम्बोधन को हिन्दी में स्पष्ट करता है।
- source_word: לֹא תוֹסִיפִי יִקְרְאוּ לָךְ
  choice: अब तुझे ... नहीं कहा जाएगा
  rationale: निषेध के साथ יסף की ‘अब आगे नहीं’ वाली अर्थछाया और अनिश्चित बहुवचन कर्ता को स्वाभाविक हिन्दी कर्मवाच्य में व्यक्त करता है।
- source_word: גְּבֶרֶת מַמְלָכוֹת
  choice: राज्यों की स्वामिनी
  rationale: साम्राज्यवादी प्रभुत्व और स्त्रीलिंग उपाधि को सुरक्षित रखता है, पर ‘रानी’ कहकर किसी विशिष्ट राजकीय पद को अनावश्यक रूप से नहीं जोड़ता।
theological_decisions:
- issue: अँधेरे का रूपक—न्याय, अपमान और गुमनामी
  choice: मुख्य पाठ में ठोस शब्द ‘अँधेरा’ बनाए रखा गया है।
  alternative: गुमनामी या निराशा
  rationale: मूल इब्रानी की सजीव छवि को बिना व्याख्यात्मक अर्थ थोपे पाठक के सामने रहने देता है।
- issue: बाबेल/कसदिया का स्त्री के रूप में मानवीकरण
  choice: ‘कसदियों की बेटी’ और स्त्रीलिंग ‘स्वामिनी’ रखा गया है।
  alternative: मानवीकरण हटाकर केवल ‘बाबेल’ कहना
  rationale: मूल पाठ राष्ट्र/नगर को सीधे एक स्त्री के रूप में सम्बोधित करता है; यही रूप न्याय और पदच्युति की वाणी का अंग है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सरल, गरिमापूर्ण और भविष्यद्वाणी के काव्यात्मक मानवीकरण के अनुरूप है। स्त्रीलिंग एकवचन सम्बोधन और आज्ञाएँ स्पष्ट रखी गई हैं।
