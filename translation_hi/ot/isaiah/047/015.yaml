base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/015.yaml
  text: So have those with whom you labored become to you—your merchants from your youth[a]. Each one wanders to his own quarter; there is no one to save you.
translation:
  language: hi
  text: जिनके साथ तूने परिश्रम किया, वे तेरे लिए ऐसे ही निकले—तेरे वे व्यापारी जो तेरी युवावस्था से तेरे साथ रहे हैं। हर एक अपनी ओर भटक गया[a]; तुझे बचानेवाला कोई नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर एक अपनी-अपनी दिशा में भटक गया,” “हर एक अपने हिस्से की ओर भटक गया,” या “हर एक अपने पार्श्व की ओर भटक गया।” इब्रानी अभिव्यक्ति संक्षिप्त है और किसी निश्चित गन्तव्य से अधिक उनके अलग-अलग दिशाओं में बिखर जाने पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן הָיוּ לָךְ
  choice: वे तेरे लिए ऐसे ही निकले
  rationale: 'यह निष्कर्षसूचक כֵּן और परिणाम व्यक्त करने वाले הָיוּ לָךְ को स्वाभाविक हिन्दी में रखता है: जिन पर भरोसा था, वे अन्ततः व्यर्थ सिद्ध हुए।'
- source_word: אֲשֶׁר יָגָעַתְּ
  choice: जिनके लिए तू परिश्रम करती रही
  rationale: יגע श्रम या कठिन परिश्रम को दर्शाता है। सम्बन्ध का सटीक प्रकार इब्रानी में स्पष्ट नहीं है; ‘जिनके लिए’ सहज है और अनावश्यक रूप से व्यापारिक साझेदारी निश्चित नहीं करता।
- source_word: סֹחֲרַיִךְ מִנְּעוּרַיִךְ
  choice: तेरे वे व्यापारी जो तेरी युवावस्था से तेरे साथ थे
  rationale: סֹחֲרַיִךְ का सीधा अर्थ ‘तेरे व्यापारी’ है, और מִנְּעוּרַיִךְ पुराने, दीर्घकालीन सम्बन्ध को दिखाता है। ‘तेरे साथ थे’ हिन्दी में कालगत सम्बन्ध स्पष्ट करता है, बिना उसे मूल क्रिया का स्वतंत्र दावा बनाए।
- source_word: אִישׁ לְעֶבְרוֹ תָּעוּ
  choice: वे हर एक अपनी-अपनी दिशा में भटक गए
  rationale: אִישׁ का वितरणात्मक भाव ‘हर एक’ से और לְעֶבְרוֹ का अनिश्चित दिशात्मक भाव ‘अपनी-अपनी दिशा में’ से व्यक्त होता है। תָּעוּ पूर्ण बहुवचन है, इसलिए ‘भटक गए’ उपयुक्त है।
- source_word: אֵין מוֹשִׁיעֵךְ
  choice: तुझे बचानेवाला कोई नहीं है
  rationale: מוֹשִׁיעֵךְ उद्धार या बचाव करने वाले व्यक्ति को दर्शाता है। यह रूप तत्काल संकट से बचाने और व्यापक धार्मिक अनुगूँज—दोनों को बनाए रखता है।
theological_decisions:
- issue: מוֹשִׁיעֵךְ का अनुवाद
  choice: तुझे बचानेवाला
  alternative: तुझे छुड़ानेवाला / तेरा उद्धारकर्ता
  rationale: ‘बचानेवाला’ तत्काल न्याय और संकट के प्रसंग में स्पष्ट है, फिर भी मूल शब्द की उद्धार-संबंधी गंभीरता को मिटाता नहीं और किसी विशेष सम्प्रदायगत अर्थ को नहीं जोड़ता।
- issue: व्यापारियों के बिखराव का स्वरूप
  choice: अपनी-अपनी दिशा में भटक गए
  alternative: हर एक अपने हिस्से/ओर चला गया
  rationale: इब्रानी संक्षिप्त और कुछ हद तक अस्पष्ट है। ‘भटक गए’ תעה को बनाए रखता है, जबकि ‘दिशा’ किसी निश्चित भूभाग या नियोजित गन्तव्य को अनावश्यक रूप से स्थापित नहीं करती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण मानक हिन्दी; बाबेल को सम्बोधित स्त्रीलिंग एकवचन ‘तू/तेरे/तुझे’ रखा गया है। वाक्य का निष्कर्षात्मक और व्यंग्यपूर्ण बल बनाए रखते हुए अस्पष्ट दिशात्मक पद को मुख्य पाठ और पादटिप्पणी में खुला रखा गया है।
