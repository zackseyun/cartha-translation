base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/002.yaml
  text: Take the millstones and grind flour[a]; uncover your veil, strip off your skirt, uncover the leg[c][b], cross over the rivers.
translation:
  language: hi
  text: चक्की के पाट उठा और आटा पीस; अपने सिर का आवरण हटा दे,[a] अपना निचला वस्त्र हटा दे,[b] अपनी टाँग उघाड़,[c] और नदियाँ पार कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी लटें खोल दे” अथवा “अपने बाल खोल दे।”
    reason: lexical_alternative
  - marker: b
    text: या “अपने वस्त्र का दामन हटा दे।”
    reason: lexical_alternative
  - marker: c
    text: या “अपनी जाँघ उघाड़।”
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחִי רֵחַיִם
  choice: चक्की के पाट उठा
  rationale: स्त्रीलिंग एकवचन आज्ञा और हाथ से चलने वाली चक्की के ठोस चित्र को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְטַחֲנִי קָמַח
  choice: और आटा पीस
  rationale: טחן का अर्थ ‘पीसना’ और קמח का अर्थ ‘आटा’ है; वाक्य दासियों से जुड़े श्रम का चित्र प्रस्तुत करता है।
- source_word: גַּלִּי צַמָּתֵךְ
  choice: अपने सिर का आवरण हटा दे
  rationale: צַמָּה के अर्थ में सिर का आवरण, लटें या बाल संभव हैं। प्रसंग में आवरण हटाने का अर्थ मुख्य पाठ में स्वाभाविक है और अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: חֶשְׂפִּי שֹׁבֶל
  choice: अपना घाघरा उठा ले
  rationale: שֹׁבֶל बहते या नीचे लटकते वस्त्र, उसके दामन अथवा किनारे को सूचित कर सकता है। नदी पार करने के प्रसंग में वस्त्र उठाना स्वाभाविक है; ‘घाघरा’ स्त्री के लंबे निचले वस्त्र का सहज आधुनिक चित्र देता है।
- source_word: גַּלִּי שׁוֹק
  choice: अपनी टाँग उघाड़
  rationale: שׁוֹק टाँग, विशेषकर निचली टाँग, का बोध करा सकता है; कुछ संदर्भों में जाँघ भी संभव है। ‘टाँग’ यहाँ पानी में उतरने के चित्र के अनुकूल और पर्याप्त व्यापक है।
- source_word: עִבְרִי נְהָרוֹת
  choice: और नदियाँ पार कर
  rationale: עבר की आज्ञा और נהרות के बहुवचन को सीधे तथा मुहावरेदार हिन्दी में रखा गया है।
theological_decisions:
- issue: अपमान और अनावरण के चित्र का स्वरूप
  choice: राजसी गरिमा छिनने और श्रम तथा विस्थापन के लिए विवश किए जाने का क्रमिक चित्र, बिना इसे इब्रानी से अधिक यौनार्थक बनाए
  alternative: अनावरण को अधिक स्पष्ट यौन अपमान के रूप में प्रस्तुत करना
  rationale: पाठ में लज्जा और दीनता स्पष्ट हैं, पर शब्दावली नदी पार करने के लिए वस्त्र उठाने का व्यावहारिक चित्र भी देती है। अनुवाद दोनों आयामों को खुला रखता है और अर्थ को अनावश्यक रूप से तीव्र नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्त्रीलिंग एकवचन आज्ञार्थक रूप रखे गए हैं। भाषा सीधी और गरिमापूर्ण है। ‘घाघरा’ सामान्य पाठक के लिए लंबे स्त्री-वस्त्र का स्पष्ट बिंब देता है, जबकि अधिक शाब्दिक ‘दामन’ पादटिप्पणी में सुरक्षित है।
