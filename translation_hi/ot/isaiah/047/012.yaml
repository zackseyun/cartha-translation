- from: अब अपने मंत्रों और अपने बहुत-से जादू-टोनों[a] के साथ खड़ी हो जा, जिनके लिए तू अपनी जवानी से परिश्रम करती आई है। शायद तू लाभ उठा सके[b], शायद तू आतंक फैला सके।
  to: अब अपने मंत्र-प्रयोगों[a] और अपने बहुत-से टोने-टोटकों के साथ खड़ी हो जा, जिनमें तू अपनी जवानी से परिश्रम करती आई है। शायद तू लाभ उठा सके[b], शायद तू भय उत्पन्न कर सके।
  rationale: The revision corrects the relation expressed by the Hebrew relative clause, clarifies the two distinct occult-practice terms, and uses a more semantically neutral Hindi expression for causing fear. It preserves the source's irony implicitly, its feminine singular address, and the ambiguity reflected in the English audit trail.
