id: ISA.47.12
reference: Isaiah 47:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עִמְדִי נָ֤א בַ/חֲבָרַ֨יִ/ךְ֙ וּ/בְ/רֹ֣ב כְּשָׁפַ֔יִ/ךְ בַּ/אֲשֶׁ֥ר יָגַ֖עַתְּ מִ/נְּעוּרָ֑יִ/ךְ אוּלַ֛י תּוּכְלִ֥י הוֹעִ֖יל אוּלַ֥י תַּעֲרֽוֹצִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/012.yaml
  text: Stand now with your enchantments and with your many sorceries[a], in which you have labored from your youth; perhaps you may be able to profit[b], perhaps you may inspire terror.
translation:
  language: hi
  text: अब अपने मंत्र-प्रयोगों[a] और अपने बहुत-से टोने-टोटकों के साथ खड़ी हो जा, जिनमें तू अपनी जवानी से परिश्रम करती आई है। शायद तू लाभ उठा सके[b], शायद तू भय उत्पन्न कर सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने मंत्रों के साथ”; इब्रानी पद जादुई बंधनों, मंत्रों या मंत्र-प्रयोगों को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: या “शायद तू प्रबल हो सके”; अंतिम इब्रानी क्रिया में किसी को भयभीत करने या उस पर धाक जमाने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמְדִי נָא
  choice: अब ... खड़ी हो जा
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक और נָא को स्वाभाविक हिन्दी में रखा गया है; प्रसंगगत व्यंग्य को बिना अतिरिक्त व्याख्या जोड़े उभरने दिया गया है।
- source_word: בַחֲבָרַיִךְ
  choice: अपने मंत्रों के साथ
  rationale: यहाँ חֲבָרִים जादुई बंधनों या मंत्रोच्चारों को सूचित करता है; ‘मंत्र’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: וּבְרֹב כְּשָׁפַיִךְ
  choice: अपने बहुत-से जादू-टोनों
  rationale: רֹב की बहुलता और כְּשָׁפִים की अनेक जादुई क्रियाओं को सहज हिन्दी में व्यक्त करता है।
- source_word: בַּאֲשֶׁר יָגַעַתְּ
  choice: जिनके लिए तू ... परिश्रम करती आई है
  rationale: יגע में श्रम और थकाने वाले प्रयत्न का भाव है; हिन्दी में दीर्घकालीन अभ्यास को स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: מִנְּעוּרַיִךְ
  choice: अपनी जवानी से
  rationale: दीर्घकाल से चली आ रही साधना का सीधा कालवाचक अर्थ सुरक्षित है।
- source_word: אוּלַי תּוּכְלִי הוֹעִיל
  choice: शायद तू लाभ उठा सके
  rationale: יכל के साथ הפעיל रूप הועיל लाभ या फायदा प्राप्त करने की क्षमता व्यक्त करता है; ‘लाभ उठा सके’ हिन्दी में स्पष्ट है।
- source_word: אוּלַי תַּעֲרוֹצִי
  choice: शायद तू आतंक फैला सके
  rationale: ערץ यहाँ भयभीत या आतंकित करने का अर्थ दे सकता है; यह अनिश्चित संभावना और कारक भाव दोनों सुरक्षित रखता है।
theological_decisions:
- issue: बाबुल को संबोधन का स्वर
  choice: आज्ञाओं और ‘शायद’ वाले वाक्यों को शाब्दिक रूप में रखते हुए व्यंग्य को प्रसंग से प्रकट होने देना
  alternative: मुख्य पाठ में स्पष्ट रूप से उपहास या निरर्थकता जोड़ना
  rationale: व्यापक संदर्भ बाबुल की तांत्रिक प्रथाओं पर न्यायपूर्ण उपहास है, पर मूल पद स्वयं व्याख्यात्मक शब्द नहीं जोड़ता।
- issue: תַּעֲרוֹצִי का अर्थ
  choice: आतंक फैला सके
  alternative: प्रबल हो सके / विजय पा सके
  rationale: क्रिया भय उत्पन्न करने का अर्थ रख सकती है; वैकल्पिक विजय-संबंधी समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; बाबुल को स्त्रीलिंग एकवचन ‘तू’ से संबोधित करके मूल के व्याकरण और न्याय-वाणी की सीधी, तीखी शैली को बनाए रखा गया है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध है।
