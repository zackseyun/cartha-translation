source:
  edition: WLC
  text: וְ/עַתָּ֞ה שִׁמְעִי זֹ֤את עֲדִינָה֙ הַ/יּוֹשֶׁ֣בֶת לָ/בֶ֔טַח הָ/אֹֽמְרָה֙ בִּ/לְבָ֔בָ/הּ אֲנִ֖י וְ/אַפְסִ֣/י ע֑וֹד לֹ֤א אֵשֵׁב֙ אַלְמָנָ֔ה וְ/לֹ֥א אֵדַ֖ע שְׁכֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/008.yaml
  text: Then[a], hear this, you lover of luxury, who sit securely, who say in your heart, ‘I am, and there is no one besides me. I will not sit as a widow[c][b], nor will I know the loss of children.’
translation:
  language: hi
  text: अब यह सुन, हे विलासिनी,[a] जो निश्चिन्त बैठी है और अपने मन में कहती है, “मैं हूँ, और मेरे सिवा कोई नहीं।[b] मैं विधवा होकर न बैठूँगी और न सन्तान खोने का दुःख जानूँगी।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे कोमल स्त्री,” “हे लाड़-प्यार में पली हुई स्त्री,” या “हे सुख-विलास में पली हुई स्त्री।” इब्रानी शब्द कोमलता के साथ विलासी आत्म-भोग का भाव भी रखता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैं हूँ, और इसके अतिरिक्त कुछ नहीं।” यह कथन अद्वितीय और बेजोड़ होने का घमंडी दावा है।
    reason: alternative_reading
  - marker: c
    text: इब्रानी में शाब्दिक रूप से, “सन्तान-वियोग जानूँगी”; अर्थात अपनी सन्तान को खोने के दुःख का अनुभव करूँगी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब
  rationale: यह पदबंध पिछले कथन से वर्तमान सीधे सम्बोधन की ओर स्पष्ट संक्रमण कराता है; इसलिए स्रोत में उपस्थित कालसूचक बल को ‘अब’ से व्यक्त किया गया है।
- source_word: עֲדִינָה
  choice: हे सुख-विलास में पली हुई स्त्री
  rationale: स्त्रीलिंग विशेषण को बाबेल के मानवीकरण के अनुरूप सम्बोधन बनाया गया है। यह चुनाव कोमलता के साथ ऐश्वर्यपूर्ण लाड़-प्यार और आत्मभोग का प्रसंगगत भाव भी व्यक्त करता है।
- source_word: הַיּוֹשֶׁבֶת לָבֶטַח
  choice: जो निश्चिन्त बैठी है
  rationale: ‘बैठी’ मूल क्रिया का दृश्य बनाए रखता है, जबकि ‘निश्चिन्त’ उसकी स्थिर सुरक्षा और उससे उपजे आत्मविश्वास को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲנִי וְאַפְסִי עוֹד
  choice: मैं हूँ, और मेरे सिवा कोई नहीं
  rationale: यह बाबेल का अद्वितीय और सर्वोच्च होने का घमंडी दावा है। व्यक्तिगत ‘कोई नहीं’ स्त्रीरूप में बोलती नगरी के प्रसंग के अनुकूल है और कथन की ईश्वरीय भाषा से जानबूझकर उत्पन्न प्रतिध्वनि को बनाए रखता है।
- source_word: לֹא אֵשֵׁב אַלְמָנָה
  choice: मैं विधवा होकर न बैठूँगी
  rationale: ‘बैठूँगी’ मूल क्रिया तथा पद के आरम्भ में बैठने की छवि के साथ समानता बनाए रखता है; ‘विधवा होकर’ नगर पर लागू रूपकात्मक दशा को स्पष्ट करता है।
- source_word: שְׁכוֹל
  choice: संतान-वियोग
  rationale: यह शब्द बाँझपन नहीं, संतान को खो देने से होने वाले वियोग को सूचित करता है। ‘संतान-वियोग’ संक्षिप्त, गरिमापूर्ण और अर्थ की दृष्टि से सटीक है।
- source_word: אֵדַע
  choice: जानूँगी
  rationale: इब्रानी ‘जानना’ यहाँ अनुभव करने के अर्थ में है। हिन्दी में इसे बनाए रखने से स्रोत की अभिव्यक्ति सुरक्षित रहती है और प्रसंग में अनुभव का भाव समझ में आता है।
- source_word: שִׁמְעִי זֹאת
  choice: यह सुन
  rationale: स्त्रीलिंग एकवचन में दिया गया सीधा भविष्यद्वक्ताई आदेश संक्षिप्त और प्रभावशाली हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: बाबेल का आत्म-उत्कर्षपूर्ण दावा אֲנִי וְאַפְסִי עוֹד
  choice: मैं हूँ, और मेरे सिवा कोई नहीं
  alternative: मैं ही हूँ, और इसके अतिरिक्त कुछ नहीं
  rationale: चुना हुआ पाठ बाबेल द्वारा अपने लिए किए गए अनुपम प्रभुत्व के दावे को व्यक्त करता है और परमेश्वर के लिए अन्यत्र प्रयुक्त विशिष्ट भाषा की घमंडी प्रतिध्वनि को बिना व्याख्यात्मक रूप से हल किए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सीधे सम्बोधन वाला भविष्यद्वक्ताई लहजा रखा गया है। बाबेल को स्त्री के रूप में सम्बोधित करने के कारण सभी सम्बद्ध क्रियारूप स्त्रीलिंग हैं। ‘सुख-विलास में पली हुई’ सामान्य पाठक के लिए बोधगम्य है, जबकि पादटिप्पणी मूल विशेषण की व्यापक अर्थ-सीमा सुरक्षित रखती है।
