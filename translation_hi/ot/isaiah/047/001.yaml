reference: Isaiah 47:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רְדִ֣י וּ/שְׁבִ֣י עַל עָפָ֗ר בְּתוּלַת֙ בַּת בָּבֶ֔ל שְׁבִי לָ/אָ֥רֶץ אֵין כִּסֵּ֖א בַּת כַּשְׂדִּ֑ים כִּ֣י לֹ֤א תוֹסִ֨יפִי֙ יִקְרְאוּ לָ֔/ךְ רַכָּ֖ה וַ/עֲנֻגָּֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/001.yaml
  text: Come down and sit in the dust[a], virgin daughter Babylon; sit on the ground without a throne, daughter of the Chaldeans[d][c][b]. For they will no longer call you tender and delicate.
translation:
  language: hi
  text: हे बेबीलोन की कुँवारी बेटी[b], नीचे उतर[a] और धूल में बैठ जा; हे कसदियों की बेटी, बिना सिंहासन के[c] भूमि पर बैठ जा। क्योंकि अब से तुझे कोमल और सुकुमारी[d] नहीं कहा जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नीचे उतर आ।” मूल आज्ञा स्वयं आने या जाने की दिशा स्पष्ट नहीं करती।
    reason: lexical_alternative
  - marker: b
    text: “बेबीलोन की कुँवारी बेटी” और “कसदियों की बेटी” नगर और साम्राज्य का एक युवा राजकीय स्त्री के रूप में काव्यात्मक मानवीकरण हैं।
    reason: cultural_note
  - marker: c
    text: या, “भूमि पर बैठ जा—कोई सिंहासन नहीं है।”
    reason: lexical_alternative
  - marker: d
    text: या, “नाज़ुक और लाड़-प्यार में पली हुई।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רְדִי
  choice: नीचे उतर
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप है। “नीचे उतर” ऊँचे राजकीय स्थान से अपमानपूर्वक उतारे जाने का भाव स्वाभाविक हिन्दी में रखता है, जबकि आने या जाने की दिशा मूल में निश्चित नहीं है।
- source_word: וּשְׁבִי / שְׁבִי
  choice: बैठ जा / बैठ जा
  rationale: दोनों आज्ञाओं की पुनरावृत्ति रखी गई है। प्रसंग में अर्थ निवास करना नहीं, बल्कि धूल और भूमि पर नीची अवस्था में बैठना है।
- source_word: עַל עָפָר
  choice: धूल में
  rationale: शाब्दिक रूप से “धूल पर” सम्भव है, पर अपमान और दीनता की छवि के लिए “धूल में बैठना” अधिक स्वाभाविक आधुनिक हिन्दी है।
- source_word: בְּתוּלַת בַּת בָּבֶל
  choice: बेबीलोन की कुँवारी बेटी
  rationale: यह बेबीलोन नगर/साम्राज्य का एक युवा स्त्री के रूप में काव्यात्मक मानवीकरण है। हिन्दी में यह पदक्रम अर्थ को स्पष्ट रखते हुए मूल की स्त्रीलिंग छवि बचाता है।
- source_word: לָאָרֶץ
  choice: भूमि पर
  rationale: बैठने के स्थान को व्यक्त करता है और “धूल में” के समानांतर राजकीय ऊँचाई से पतन की छवि बनाए रखता है।
- source_word: אֵין כִּסֵּא
  choice: बिना सिंहासन के
  rationale: 'क्रियारहित इब्रानी खंड को परिस्थितिसूचक वाक्यांश के रूप में लिया गया है: वह भूमि पर ऐसी बैठेगी जिसके पास अब सिंहासन नहीं है।'
- source_word: בַּת כַּשְׂדִּים
  choice: कसदियों की बेटी
  rationale: मूल के बहुवचन जातिवाचक रूप को रखते हुए बेबीलोन के लिए प्रयुक्त दूसरा मानवीकरण-संबोधन सुरक्षित किया गया है।
- source_word: כִּי לֹא תוֹסִיפִי יִקְרְאוּ לָךְ
  choice: क्योंकि अब से तुझे ... नहीं कहा जाएगा
  rationale: יסף के साथ आने वाली क्रिया पूर्व अवस्था की समाप्ति बताती है। इब्रानी का अनिश्चित बहुवचन कर्ता हिन्दी में स्वाभाविक कर्मवाच्य द्वारा व्यक्त किया गया है।
- source_word: רַכָּה
  choice: कोमल
  rationale: शब्द शारीरिक या सामाजिक कोमलता/नर्मी व्यक्त करता है; “कोमल” अगले विशेषण से अलग रहते हुए उसका सीधा और गरिमापूर्ण हिन्दी समतुल्य है।
- source_word: וַעֲנֻגָּה
  choice: सुकुमारी
  rationale: यह ऐश्वर्य में पली, नाज़ुक या लाड़-प्यार पाई स्त्री का भाव दे सकता है। “सुकुमारी” मुख्य पाठ में संक्षिप्त काव्यात्मक समानांतर देता है; अधिक व्याख्यात्मक अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: बेबीलोन का स्त्री और राजकुमारी-सदृश रूप में मानवीकरण
  choice: “बेबीलोन की कुँवारी बेटी” और “कसदियों की बेटी” दोनों स्त्रीलिंग संबोधनों को बनाए रखा गया है।
  alternative: संबोधनों को केवल “बेबीलोन” बनाकर मानवीकरण को समतल कर देना।
  rationale: यह न्याय-वाणी बेबीलोन को सिंहासन से उतारी गई युवा राजकीय स्त्री के रूप में चित्रित करती है। इस छवि को बनाए रखना पद के साहित्यिक और धर्मवैचारिक तनाव के लिए आवश्यक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-काव्य का स्वर रखा गया है। “हे” संबोधन हिन्दी में स्त्रीलिंग आज्ञाओं और समानांतर उपाधियों को स्पष्ट करता है। “सुकुमारी” थोड़ा काव्यात्मक है, पर सामान्यतः बोधगम्य है; उसके अधिक सामाजिक अर्थ को पादटिप्पणी स्पष्ट करती है।
