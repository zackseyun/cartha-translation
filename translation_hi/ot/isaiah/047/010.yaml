source:
  edition: WLC
  text: וַ/תִּבְטְחִ֣י בְ/רָעָתֵ֗/ךְ אָמַרְתְּ֙ אֵ֣ין רֹאָ֔/נִי חָכְמָתֵ֥/ךְ וְ/דַעְתֵּ֖/ךְ הִ֣יא שׁוֹבְבָ֑תֶ/ךְ וַ/תֹּאמְרִ֣י בְ/לִבֵּ֔/ךְ אֲנִ֖י וְ/אַפְסִ֥/י עֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/010.yaml
  text: You trusted in your wickedness; you said[a], ‘No one sees me.’ Your wisdom and your knowledge led you astray, and you said in your heart, ‘I am, and there is no one besides me.’
translation:
  language: hi
  text: 'तूने अपनी दुष्टता पर भरोसा किया;

    तूने कहा, “मुझे कोई नहीं देखता।”

    तेरी बुद्धि और तेरे ज्ञान ने तुझे भटका दिया,

    और तूने अपने मन में कहा,

    “मैं हूँ, और मेरे सिवा कोई नहीं[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं हूँ, और इसके सिवा कुछ भी नहीं।” हिब्रू अभिव्यक्ति को अधिक निराकार अर्थ में भी समझा जा सकता है, पर यहाँ संभवतः बाबुल अपने बेजोड़ और सर्वोच्च होने का दावा कर रहा है।
    reason: वैकल्पिक पाठ
lexical_decisions:
- source_word: וַתִּבְטְחִי
  choice: तूने ... भरोसा रखा
  rationale: בטח का मूल भाव किसी वस्तु पर भरोसा या निर्भरता रखना है। यह चयन आरोप की सीधी शक्ति को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְרָעָתֵךְ
  choice: अपनी दुष्टता पर
  rationale: רָעָה का अर्थ बुराई, दुष्टता या विपत्ति हो सकता है। यहाँ बाबुल का नैतिक अहंकार और उसका बुरा आचरण संदर्भ में है, इसलिए ‘दुष्टता’ उपयुक्त है।
- source_word: אֵין רֹאָנִי
  choice: मुझे कोई नहीं देखता
  rationale: अस्तित्वसूचक निषेध और कृदंत का स्वाभाविक हिन्दी रूप; यह छिपे रहने की झूठी निश्चिंतता व्यक्त करता है।
- source_word: חָכְמָתֵךְ וְדַעְתֵּךְ
  choice: तेरी बुद्धि और तेरे ज्ञान
  rationale: दोनों समानांतर पदों को अलग-अलग रखा गया है, जिससे मूल की अलंकारिक संरचना और अर्थभेद सुरक्षित रहते हैं।
- source_word: הִיא שׁוֹבְבָתֶךְ
  choice: ने ही तुझे भटका दिया
  rationale: क्रिया का भाव मार्ग से हटा देने या भ्रमित करने का है। ‘ही’ हिब्रू के स्त्रीलिंग एकवचन सर्वनाम द्वारा दिए गए बल को व्यक्त करता है, जो संयुक्त पदसमूह ‘बुद्धि और ज्ञान’ की ओर समष्टिगत रूप से संकेत करता है।
- source_word: בְלִבֵּךְ
  choice: अपने मन में
  rationale: हिब्रू मुहावरा भीतरी विचार को दर्शाता है। हिन्दी में ‘मन में कहना’ स्वाभाविक है और आंतरिक घमंड का भाव स्पष्ट रखता है।
- source_word: אֲנִי וְאַפְסִי עוֹד
  choice: मैं ही हूँ, और मेरे सिवा कोई नहीं
  rationale: यह रूप बाबुल के निरंकुश आत्म-महिमामंडन को व्यक्त करता है और यशायाह में परमेश्वर के अनन्यत्व संबंधी कथनों से इसकी जानबूझकर बनी विडंबनापूर्ण गूँज को सुरक्षित रखता है।
theological_decisions:
- issue: אֲנִי וְאַפְסִי עוֹד में बाबुल के दावे को इस प्रकार व्यक्त करना कि यशायाह में परमेश्वर के अनन्यत्व संबंधी घोषणाओं की गूँज बनी रहे, पर दोनों को एक न ठहराया जाए
  choice: मैं ही हूँ, और मेरे सिवा कोई नहीं
  alternative: मैं हूँ, और इसके सिवा कुछ भी नहीं
  rationale: व्यक्तित्व दिए गए बाबुल के संदर्भ में ‘कोई नहीं’ अधिक स्वाभाविक है। ‘मैं ही हूँ’ उसके उद्दंड, लगभग ईश्वरीय अनन्यता का दावा करने वाले घमंड को सामने लाता है, जबकि वक्ता की पहचान बाबुल ही रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक पंक्ति-विन्यास और गरिमापूर्ण, सीधा भविष्यद्वक्तीय संबोधन रखा गया है। हिब्रू के स्त्रीलिंग एकवचन संबोधन, अर्थात व्यक्तित्व दिए गए बाबुल, के लिए ‘तू/तेरी/तुझे’ का प्रयोग किया गया है; यह निकटता नहीं बल्कि न्यायसूचक प्रत्यक्ष संबोधन व्यक्त करता है।
