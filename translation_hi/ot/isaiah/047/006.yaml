source:
  edition: WLC
  text: קָצַ֣פְתִּי עַל עַמִּ֗/י חִלַּ֨לְתִּי֙ נַחֲלָתִ֔/י וָ/אֶתְּנֵ֖/ם בְּ/יָדֵ֑/ךְ לֹא שַׂ֤מְתְּ לָ/הֶם֙ רַחֲמִ֔ים עַל זָקֵ֕ן הִכְבַּ֥דְתְּ עֻלֵּ֖/ךְ מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/006.yaml
  text: I was angry with my people[a]; I profaned my inheritance and gave them into your hand. You showed them no mercy[c][b]; on the aged you made your yoke very heavy.
translation:
  language: hi
  text: मैं अपनी प्रजा पर क्रोधित हुआ; मैंने अपनी विरासत को अपवित्र किया[a] और उन्हें तेरे हाथ में सौंप दिया। तूने उन पर दया नहीं की[b]; बूढ़ों पर तूने अपना जुआ बहुत भारी कर दिया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने अपनी विरासत को दूषित किया।” इब्रानी क्रिया का अर्थ “अपवित्र करना” या “साधारण ठहराना” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तूने उनके लिए दयाएँ नहीं रखीं।”
    reason: lexical_alternative
  - marker: c
    text: या, “वृद्ध पर तूने अपना जुआ अत्यन्त भारी कर दिया।” इब्रानी में “वृद्ध” एकवचन है, पर उसका अर्थ सामूहिक भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קָצַפְתִּי
  choice: मैं ... क्रोधित हुआ
  rationale: यह क्रिया प्रबल अप्रसन्नता या क्रोध व्यक्त करती है; ‘क्रोधित हुआ’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: עַמִּי
  choice: अपनी प्रजा
  rationale: ‘प्रजा’ सामूहिक और वाचा-संबंधी भाव को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: חִלַּלְתִּי
  choice: मैंने ... अपवित्र किया
  rationale: पिएल रूप अपवित्र करने, पवित्रता से वंचित करने या साधारण ठहराने का प्रबल भाव रखता है; सक्रिय प्रथम पुरुष को नरम नहीं किया गया।
- source_word: נַחֲלָתִי
  choice: अपनी विरासत
  rationale: यह परमेश्वर की निज प्रजा को उसके अधिकार और वाचा-संबंध के रूप में दर्शाता है; ‘विरासत’ इस रूपक को बनाए रखती है।
- source_word: וָאֶתְּנֵם בְּיָדֵךְ
  choice: उन्हें तेरे हाथ में सौंप दिया
  rationale: ‘हाथ में देना’ किसी के अधिकार में सौंपने का इब्रानी मुहावरा है; हिन्दी में यह बिंब और आशय दोनों स्पष्ट रखता है।
- source_word: לֹא שַׂמְתְּ לָהֶם רַחֲמִים
  choice: तूने उन पर दया नहीं की
  rationale: शाब्दिक अभिव्यक्ति ‘उनके लिए दयाएँ नहीं रखीं’ का स्वाभाविक हिन्दी अर्थ यही है।
- source_word: זָקֵן
  choice: बूढ़ों
  rationale: एकवचन यहाँ वर्ग को सामूहिक रूप से सूचित करता है; बहुवचन हिन्दी में इस सामान्य अर्थ को स्पष्ट करता है।
- source_word: הִכְבַּדְתְּ עֻלֵּךְ מְאֹד
  choice: तूने अपना जुआ बहुत भारी कर दिया
  rationale: ‘जुआ’ दमनकारी अधीनता का मूल रूपक बनाए रखता है और ‘बहुत भारी’ כבד तथा מאד दोनों का सीधा अर्थ देता है।
theological_decisions:
- issue: परमेश्वर द्वारा अपनी विरासत को ‘अपवित्र’ करना
  choice: 'सक्रिय प्रथम पुरुष कथन रखा गया: ‘मैंने अपनी विरासत को अपवित्र किया।’'
  alternative: ‘मैंने अपनी विरासत को अपवित्र होने दिया’ या ‘मैंने अपनी विरासत को त्याग दिया।’
  rationale: इब्रानी पाठ परमेश्वर की न्यायकारी क्रिया को सक्रिय रूप में कहता है। इसे केवल अनुमति या परित्याग बनाना पाठ की कठिन धार्मिक धार को अनावश्यक रूप से नरम कर देता; साथ ही आगे बाबुल की निर्दयता के लिए उसकी जवाबदेही बनी रहती है।
- issue: वृद्धों पर जुए का विशेष उल्लेख
  choice: ‘बूढ़ों पर भी’ द्वारा असहाय वर्ग पर अत्याचार का बल स्पष्ट रखा गया।
  alternative: ‘एक बूढ़े पर’ जैसा व्यक्तिगत अर्थ।
  rationale: זָקֵן व्याकरणतः एकवचन होते हुए यहाँ सामान्य अथवा सामूहिक वर्ग का संकेत देता है। ‘भी’ प्रसंग में दया के पूर्ण अभाव को स्वाभाविक हिन्दी में उभारता है, बिना नया सिद्धान्त जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-संबंधी शैली रखी गई है। संबोधन स्त्रीलिंग एकवचन बाबुल से है, पर हिन्दी में क्रियाओं के पूर्ण भूतकालीन रूप यहाँ लिंग को प्रत्यक्ष नहीं दिखाते। ‘तेरे/तूने’ निकट और प्रत्यक्ष न्याय-वचन का स्वर बनाए रखते हैं।
