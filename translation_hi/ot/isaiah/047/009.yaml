id: ISA.47.9
reference: Isaiah 47:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/תָבֹאנָה֩ לָּ֨/ךְ שְׁתֵּי אֵ֥לֶּה רֶ֛גַע בְּ/י֥וֹם אֶחָ֖ד שְׁכ֣וֹל וְ/אַלְמֹ֑ן כְּ/תֻמָּ/ם֙ בָּ֣אוּ עָלַ֔יִ/ךְ בְּ/רֹ֣ב כְּשָׁפַ֔יִ/ךְ בְּ/עָצְמַ֥ת חֲבָרַ֖יִ/ךְ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/009.yaml
  text: 'But these two things will come to you in a moment[a], in one day: bereavement and widowhood. In full measure they will come upon you[b], in spite of your many sorceries and the great power of your spells.'
translation:
  language: hi
  text: परन्तु ये दोनों विपत्तियाँ तुम पर एक क्षण में, एक ही दिन में आ पड़ेंगी—संतान-वियोग और विधवापन। वे पूरी तरह[a] तुम पर आ पड़ेंगी[b], तुम्हारे बहुत-से जादू-टोनों और तुम्हारे मंत्रों की बहुत बड़ी शक्ति के बावजूद।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, ‘पूर्ण रूप से’ या ‘पूरे परिमाण में।’
    reason: lexical_alternative
  - marker: b
    text: 'अन्तिम वाक्यांशों का अनुवाद यह भी हो सकता है: ‘तुम्हारे बहुत-से जादू-टोनों और तुम्हारे अत्यन्त शक्तिशाली मंत्रों के कारण,’ अथवा ‘तुम्हारे बहुत-से जादू-टोनों और तुम्हारे अत्यन्त शक्तिशाली मंत्रों के साथ।’'
    reason: alternative_reading
lexical_decisions:
- source_word: וְתָבֹאנָה ... שְׁתֵּי אֵלֶּה
  choice: ये दोनों विपत्तियाँ ... तुम पर आ पड़ेंगी
  rationale: स्त्रीलिंग बहुवचन क्रिया का कर्ता ‘ये दोनों’ है, जिनकी पहचान आगे संतान-वियोग और विधवापन के रूप में होती है। हिन्दी में ‘विपत्तियाँ’ जोड़ने से आशय स्वाभाविक रूप से स्पष्ट होता है; ‘आ पड़ेंगी’ अनिष्ट के अचानक घटित होने का भाव देता है।
- source_word: רֶגַע
  choice: अचानक
  rationale: शब्द मूलतः क्षणभर या आकस्मिकता का बोध करा सकता है। अगले पदबंध ‘एक ही दिन’ के साथ हिन्दी में ‘अचानक’ अधिक स्वाभाविक है; ‘एक क्षण में’ भी सम्भव है और पादटिप्पणी में दिया गया है।
- source_word: בְּיוֹם אֶחָד
  choice: एक ही दिन
  rationale: यह समय की अत्यन्त संकुचित अवधि पर बल देता है। ‘ही’ मूल के जोर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׁכוֹל
  choice: संतान-वियोग
  rationale: यह संज्ञा प्रायः संतान से वंचित हो जाने या संतान को खो देने की दशा बताती है। ‘संतान-वियोग’ व्यक्तिकृत स्त्री के पारिवारिक चित्र को स्पष्ट रखते हुए मृत्युजन्य हानि का गरिमापूर्ण बोध देता है।
- source_word: וְאַלְמֹן
  choice: विधवापन
  rationale: यह संज्ञा विधवा होने की अवस्था को सूचित करती है। आधुनिक हिन्दी में ‘विधवापन’ सीधा और समझने योग्य है।
- source_word: כְּתֻמָּם
  choice: पूरी तरह
  rationale: תמם से बना रूप पूर्णता या समूचे परिमाण का बोध देता है। ‘पूरी तरह’ स्पष्ट और सहज क्रियाविशेषणीय अनुवाद है।
- source_word: בָּאוּ עָלַיִךְ
  choice: वे ... तुम पर आ पड़ेंगी
  rationale: पूर्ण क्रियारूप भविष्य के निश्चित न्याय को भविष्यवाणी में मानो घटित हुआ प्रस्तुत करता है। हिन्दी भविष्यकाल प्रसंगगत समय को स्पष्ट करता है, जबकि निश्चितता बनी रहती है।
- source_word: בְּרֹב כְּשָׁפַיִךְ
  choice: तुम्हारे बहुत-से जादू-टोनों ... के बावजूद
  rationale: כשפים जादुई या तांत्रिक क्रियाओं को दर्शाता है। प्रसंग में ב को रियायती अर्थ में लेना बाबुल की उन साधनों पर निर्भरता के व्यंग्य को उभारता है।
- source_word: בְּעָצְמַת חֲבָרַיִךְ מְאֹד
  choice: तुम्हारे मंत्रों की अपार शक्ति के बावजूद
  rationale: עָצְמָה शक्ति/प्रबलता और חֲבָרִים यहाँ बाँधने वाले मंत्र या टोने दर्शाता है। यह रचना संज्ञात्मक ‘शक्ति’ को सुरक्षित रखती और מְאֹד की तीव्रता को ‘अपार’ से व्यक्त करती है।
theological_decisions:
- issue: अन्तिम दोनों ב पदबंधों का अर्थ
  choice: रियायती—‘के बावजूद’
  alternative: कारणवाचक—‘के कारण’; अथवा सहचारी/साधनवाचक—‘के साथ/के द्वारा’
  rationale: निकटवर्ती प्रसंग में बाबुल अपने जादू-टोनों पर भरोसा करती है, फिर भी न्याय आता है; इसलिए रियायती अर्थ व्यंग्यात्मक बल को अच्छी तरह रखता है। मूल पूर्वसर्ग अन्य अर्थों की अनुमति देता है, इसलिए विकल्प पादटिप्पणी में सुरक्षित हैं।
- issue: בָּאוּ का काल-पक्ष
  choice: निश्चित भविष्य—‘आ पड़ेंगी’
  alternative: पूर्ण/भूत—‘आ पड़ी हैं’
  rationale: भविष्यवाणी में हिब्रू पूर्ण क्रिया भावी घटना को उसकी निश्चितता के कारण पूर्ण हुई-सी प्रस्तुत कर सकती है। हिन्दी भविष्यकाल क्रम को स्पष्ट करता है और कथन की निश्चितता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘संतान-वियोग’ और ‘विधवापन’ व्यक्तिकृत बाबुल के पारिवारिक रूपक को बनाए रखते हैं; ‘जादू-टोने’ और ‘मंत्र’ मूल के दो निकटस्थ पर अलग पदों को पठनीय हिन्दी में व्यक्त करते हैं।
