- source_word: גַּם
  choice: हाँ
  rationale: दूसरे समानांतर कथन पर बल देता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: תֵּרָאֶה
  choice: दिखाई देगा
  rationale: ראה के निफ़ाल रूप का दृश्य और सार्वजनिक भाव सीधे व्यक्त करता है।
- source_word: חֶרְפָּתֵךְ
  choice: तेरा अपमान
  rationale: חֶרְפָּה की सामाजिक बदनामी और लज्जा का अर्थ आधुनिक, सहज हिन्दी में व्यक्त होता है।
- source_word: נָקָם אֶקָּח
  choice: मैं बदला लूँगा
  rationale: इब्रानी पदबंध का स्वाभाविक हिन्दी समतुल्य है और दैवी न्याय की कठोरता को बनाए रखता है।
- source_word: אֶפְגַּע
  choice: नहीं छोड़ूँगा
  rationale: न्याय के प्रसंग में किसी को न बख्शने का अर्थ मुख्य पाठ के लिए संदर्भानुकूल है, जबकि क्रिया की वास्तविक बहुअर्थकता पादटिप्पणी में सुरक्षित है।
- source_word: אָדָם
  choice: किसी मनुष्य को
  rationale: 'एकवचन संज्ञा का सामान्य मानवीय अर्थ व्यक्त करता है: कोई भी मानव इस न्याय से बच नहीं सकता या इसे टाल नहीं सकता।'
theological_decisions:
- issue: וְלֹא אֶפְגַּע אָדָם का अर्थ
  choice: किसी मनुष्य को नहीं छोड़ूँगा
  alternative: मैं किसी मनुष्य से नहीं मिलूँगा; मैं किसी को बीच में नहीं पड़ने दूँगा
  rationale: इब्रानी वाक्यांश संक्षिप्त और कठिन है। बाबेल पर न्याय के प्रसंग में न बख्शने का अर्थ प्रवाह के अनुकूल है, पर वैकल्पिक व्याकरणिक अर्थों को पादटिप्पणी में रखा गया है ताकि अस्पष्टता मिटाई न जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। स्त्रीलिंग एकवचन सम्बोधन के अनुरूप ‘तेरी’ प्रयोग हुआ है। नग्नता और सार्वजनिक अपमान की तीखी भविष्यद्वाणी को नरम नहीं किया गया; कठिन अन्तिम उपवाक्य की अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
