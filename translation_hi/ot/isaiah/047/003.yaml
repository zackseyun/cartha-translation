base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/003.yaml
  text: Your nakedness will be uncovered[a]; indeed, your disgrace will be seen. I will take vengeance[b], and I will spare no man.
translation:
  language: hi
  text: तेरी नग्नता प्रकट की जाएगी; हाँ, तेरा अपमान भी दिखाई देगा। मैं बदला लूँगा और किसी मनुष्य[b] को नहीं बख्शूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अन्तिम वाक्यांश का अनुवाद यह भी हो सकता है: “मैं किसी मनुष्य से नहीं मिलूँगा,” “मैं किसी को हस्तक्षेप नहीं करने दूँगा,” या “मैं किसी को नहीं बख्शूँगा।” इब्रानी वाक्यांश कठिन है और उसके कई निकटवर्ती अर्थ सम्भव हैं।'
    reason: alternative_reading
  - marker: b
    text: यहाँ “मनुष्य” (אָדָם) का अर्थ सम्भवतः सामान्य है—कोई भी मानव इस न्याय को टाल नहीं सकेगा।
    reason: lexical_alternative
lexical_decisions:
