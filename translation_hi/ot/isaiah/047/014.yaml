source:
  edition: WLC
  text: הִנֵּ֨ה הָי֤וּ כְ/קַשׁ֙ אֵ֣שׁ שְׂרָפָ֔תַ/ם לֹֽא יַצִּ֥ילוּ אֶת נַפְשָׁ֖/ם מִ/יַּ֣ד לֶֽהָבָ֑ה אֵין גַּחֶ֣לֶת לַ/חְמָ֔ם א֖וּר לָ/שֶׁ֥בֶת נֶגְדּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/014.yaml
  text: Look[a], they have become like stubble; fire burns them up. They cannot rescue themselves from the power of the flame. This is no coal for warming oneself, no fire to sit before.
translation:
  language: hi
  text: देखो, वे भूसे के समान हो गए हैं; आग ने उन्हें भस्म कर दिया है। वे अपने आपको ज्वाला की पकड़ से नहीं बचा सकते। गरम होने के लिए कोई अंगारा नहीं है,[a] न ऐसी आग है जिसके सामने बैठा जा सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गरम होने के लिए कोई अंगारा नहीं है।” इस उपवाक्य का हिब्रू कठिन है। आशय संभवतः यह है कि यह कोई छोटा, उपयोगी घरेलू अंगारा नहीं, बल्कि सब कुछ भस्म करने वाली ज्वाला है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह शब्द कथन की ओर जोर से ध्यान खींचता है। आधुनिक हिंदी में “देखो” स्वाभाविक और प्रभावपूर्ण है।
- source_word: הָיוּ כְקַשׁ
  choice: वे भूसे के समान हो गए हैं
  rationale: पूर्ण क्रिया परिणामी दशा दिखाती है; קַשׁ सूखे डंठल या भूसे की छवि देता है, जो आग में आसानी से भस्म हो जाता है।
- source_word: אֵשׁ שְׂרָפָתַם
  choice: आग ने उन्हें भस्म कर दिया है
  rationale: शाब्दिक रूप से संक्षिप्त वाक्य आग द्वारा पूर्ण विनाश दर्शाता है। “भस्म कर दिया है” उस पूर्णता और वर्तमान परिणाम दोनों को व्यक्त करता है।
- source_word: לֹא יַצִּילוּ אֶת נַפְשָׁם
  choice: वे अपने आपको ... नहीं बचा सकते
  rationale: נֶפֶשׁ यहाँ व्यक्ति या जीवन को सूचित करता है। हिंदी का “अपने आपको” अर्थ को स्वाभाविक रूप से व्यक्त करता है और अनावश्यक पारिभाषिक धार्मिक अर्थ से बचता है।
- source_word: מִיַּד לֶהָבָה
  choice: ज्वाला की पकड़ से
  rationale: “हाथ से” वाला हिब्रू मुहावरा अधिकार, वश या पकड़ का बोध देता है। “ज्वाला की पकड़” मूल रूपक की सजीवता और उसका अभिप्राय दोनों बनाए रखता है।
- source_word: אֵין גַּחֶלֶת לַחְמָם
  choice: यह तपने के लिए अंगारा नहीं है
  rationale: कठिन रूप לַחְמָם को חָמַם, “गरम होना/करना,” से संबंधित मानते हुए यह विनाशकारी आग और उपयोगी घरेलू अंगारे के बीच का विरोध स्पष्ट करता है। “तपने” का प्रयोग आग के पास बैठकर गरम होने के लिए स्वाभाविक हिंदी है।
- source_word: אוּר לָשֶׁבֶת נֶגְדּוֹ
  choice: न ऐसी आग है जिसके सामने बैठा जा सके
  rationale: אוּר यहाँ केवल प्रकाश नहीं, आग है। वाक्यांश घरेलू आग के सामने बैठने की सामान्य छवि प्रस्तुत करता है।
theological_decisions:
- issue: न्याय की आग का स्वरूप
  choice: पद को बाबेल से जुड़े सलाहकारों और ज्योतिषियों पर आने वाले विनाशकारी ऐतिहासिक न्याय की तत्काल प्रसंगगत छवि के रूप में रखा गया है।
  alternative: इसे अंतिम दंड या समस्त ईश्वरीय न्याय का स्पष्ट कथन मानना।
  rationale: निकटवर्ती प्रसंग बाबेल पर भविष्यद्वाणी का उपहासपूर्ण न्याय-वचन है। अनुवाद आग की कठोरता बनाए रखता है, पर उसके धर्मवैज्ञानिक क्षेत्र को मूल पाठ से अधिक निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “देखो,” “भस्म,” “ज्वाला” और “अंगारा” भविष्यद्वाणी की सजीव काव्यात्मक छवि बनाए रखते हैं; वाक्य-विन्यास अत्यधिक संस्कृतनिष्ठ नहीं है।
