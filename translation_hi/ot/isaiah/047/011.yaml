source:
  edition: WLC
  text: וּ/בָ֧א עָלַ֣יִ/ךְ רָעָ֗ה לֹ֤א תֵדְעִי֙ שַׁחְרָ֔/הּ וְ/תִפֹּ֤ל עָלַ֨יִ/ךְ֙ הֹוָ֔ה לֹ֥א תוּכְלִ֖י כַּפְּרָ֑/הּ וְ/תָבֹ֨א עָלַ֧יִ/ךְ פִּתְאֹ֛ם שׁוֹאָ֖ה לֹ֥א תֵדָֽעִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/011.yaml
  text: But evil will come upon you[a]; you will not know how to charm it away. And disaster will fall upon you; you will not be able to atone for it. And ruin will come upon you suddenly[b], which you do not foresee.
translation:
  language: hi
  text: परन्तु तुझ पर विपत्ति आएगी[a]; तू नहीं जानेगी कि उसे मंत्र-विद्या से कैसे दूर कर सकेगी। तुझ पर विनाश आ पड़ेगा; तू उसका प्रायश्चित नहीं कर सकेगी[b]। और अचानक तुझ पर ऐसी बरबादी आएगी, जिसका तुझे पहले से पता न होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तू उसके उदय को नहीं जानेगी,” अथवा “तू नहीं जानेगी कि उसे कैसे टाले।” इस इब्रानी वाक्यांश का अर्थ कठिन है; मुख्य पाठ बाबेल के जादू-टोने और मंत्रों के संदर्भ के अनुसार अनुवाद करता है।
    reason: lexical_alternative
  - marker: b
    text: या “तू उसे टाल नहीं सकेगी” अथवा “शांत नहीं कर सकेगी।” इब्रानी का शाब्दिक भाव है, “उसका प्रायश्चित करना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה
  choice: विपत्ति
  rationale: यहाँ समानांतर शब्दों और न्याय की भविष्यवाणी के कारण नैतिक बुराई नहीं, बल्कि हानि पहुँचाने वाली विपत्ति अभिप्रेत है।
- source_word: שַׁחְרָהּ
  choice: उसे जादू-मंत्र से कैसे दूर करे
  rationale: इब्रानी रूप कठिन और विवादित है। बाबेल के टोनों और मंत्रों के निकट संदर्भ में यह अर्थ सर्वाधिक स्वाभाविक है; वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: הֹוָה
  choice: विनाश
  rationale: शब्द विध्वंसकारी आपदा को सूचित करता है; ‘विनाश’ पहले पद के ‘विपत्ति’ से भेद रखते हुए समानांतरता बनाए रखता है।
- source_word: כַּפְּרָהּ
  choice: उसका प्रायश्चित नहीं कर सकेगी
  rationale: כפר की प्रायश्चित/ढकने की मूल शब्दावली को सुरक्षित रखा गया है, यद्यपि इस प्रसंग में व्यावहारिक आशय विपत्ति को टालने या शांत करने की असमर्थता है।
- source_word: פִּתְאֹם
  choice: अचानक
  rationale: यह आकस्मिकता बताने वाला सहज और सीधा हिन्दी क्रियाविशेषण है।
- source_word: שׁוֹאָה
  choice: बरबादी
  rationale: यह शब्द व्यापक और भयावह विध्वंस को दर्शाता है; ‘बरबादी’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לֹא תֵדָעִי
  choice: जिसका तुझे पहले से पता न होगा
  rationale: शाब्दिक ‘तू नहीं जानेगी’ के निहित आशय को स्वाभाविक हिन्दी में व्यक्त करता है और अचानक आने वाली बरबादी के पूर्वज्ञान के अभाव को दर्शाता है।
theological_decisions:
- issue: न्याय के प्रसंग में כפר का अनुवाद
  choice: प्रायश्चित की मूल शब्दावली को मुख्य पाठ में बनाए रखना
  alternative: तू उसे टाल नहीं सकेगी / शांत नहीं कर सकेगी
  rationale: इससे इब्रानी मूल की व्यापक धार्मिक-शाब्दिक कड़ी सुरक्षित रहती है, जबकि पादटिप्पणी इस प्रसंग में उसके व्यावहारिक अर्थ को स्पष्ट करती है; कोई अतिरिक्त बलिदानी सिद्धान्त आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और प्रत्यक्ष भविष्यवाणी-शैली रखी गई है। स्त्रीलिंग एकवचन रूप बाबेल को संबोधन के अनुरूप हैं। ‘परन्तु’ और ‘प्रायश्चित’ औपचारिक हैं, पर सामान्य पाठक के लिए प्रचलित और बोधगम्य हैं।
