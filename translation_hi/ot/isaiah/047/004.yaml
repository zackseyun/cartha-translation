  - marker: b
    text: “छुड़ानेवाला” का अनुवाद “निकट-संबंधी छुड़ानेवाला” भी किया जा सकता है; इब्रानी शब्द में पारिवारिक और कानूनी दायित्व की छाया हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֲלֵנוּ
  choice: हमारा छुड़ानेवाला
  rationale: 'גאל का कृदन्त यहाँ संज्ञा के रूप में है: ‘वह जो हमें छुड़ाता है।’ ‘छुड़ानेवाला’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और उद्धार के साथ कानूनी तथा वाचा-संबंधी अर्थ की गुंजाइश बनाए रखता है; निकट संबंधी की विशेष छाया मूल वाक्य में स्पष्ट नहीं है, इसलिए उसे पाद-टिप्पणी में रखा गया है।'
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण ‘याहवे’ में रखा गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: यह बहुवचन संज्ञा सैन्य दलों या सेनाओं का ठोस अर्थ देती है। ‘सेनाओं का’ आधुनिक पाठक के लिए पारंपरिक ‘सेनाओं के प्रभु’ जैसी विस्तारित अभिव्यक्ति से अधिक सीधे मूल संरचना को दर्शाता है।
- source_word: שְׁמוֹ
  choice: उसका नाम है
  rationale: इब्रानी के संज्ञात्मक उपवाक्य को स्वाभाविक हिन्दी में सहायक क्रिया ‘है’ जोड़कर व्यक्त किया गया है।
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: इस्राएल का पवित्र जन
  rationale: यह यशायाह की विशिष्ट उपाधि है। ‘पवित्र जन’ विशेषण को व्यक्तिवाचक संज्ञा की तरह रखता है और मूल में अनुपस्थित ‘परमेश्वर’ शब्द जोड़े बिना उपाधि का अर्थ स्पष्ट करता है।
theological_decisions:
- issue: יְהוָה צְבָאוֹת का अनुवाद
  choice: सेनाओं का याहवे
  alternative: सेनाओं का प्रभु / पारंपरिक रूप में ‘सेनाओं का यहोवा’
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम יְהוָה है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित नहीं करता। ‘सेनाओं’ से צְבָאוֹת का प्रत्यक्ष सैन्य बिंब भी सुरक्षित रहता है।
- issue: גֹּאֲלֵנוּ में संबंधी-छुड़ानेवाले की छाया
  choice: मुख्य पाठ में ‘हमारा छुड़ानेवाला’
  alternative: हमारा निकट-संबंधी छुड़ानेवाला
  rationale: גאל में पारिवारिक-कानूनी दायित्व की छाया हो सकती है, पर इस छोटे वाक्य में संबंधी होने का पक्ष स्पष्ट नहीं किया गया। इसलिए मुख्य पाठ व्यापक अर्थ रखता है और संभावित विशेष अर्थ पाद-टिप्पणी में बताता है।
- issue: קְדוֹשׁ יִשְׂרָאֵל में निहित कर्ता और उपाधि
  choice: इस्राएल का पवित्र जन है
  alternative: इस्राएल का पवित्र परमेश्वर है
  rationale: ‘परमेश्वर’ अर्थ की दृष्टि से सही पहचान बताता, पर वह मूल में व्यक्त नहीं है। ‘पवित्र जन’ मूल उपाधि की संक्षिप्तता और व्यक्तिगत संदर्भ दोनों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल इब्रानी की तीन समांतर उपाधियों को डैशों द्वारा जोड़ा गया है, जिससे संक्षिप्त काव्यात्मक बल और नाम-घोषणा की संरचना बनी रहती है।
