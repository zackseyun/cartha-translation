source:
  edition: WLC
  text: נִלְאֵ֖ית בְּ/רֹ֣ב עֲצָתָ֑יִ/ךְ יַעַמְדוּ נָ֨א וְ/יוֹשִׁיעֻ֜/ךְ הברו שָׁמַ֗יִם הַֽ/חֹזִים֙ בַּ/כּ֣וֹכָבִ֔ים מֽוֹדִיעִם֙ לֶ/חֳדָשִׁ֔ים מֵ/אֲשֶׁ֥ר יָבֹ֖אוּ עָלָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/013.yaml
  text: You are wearied by your many counsels[a]. Let them stand now and save you—those who divide the heavens, who gaze at the stars[b], who make known month by month what will come upon you.
translation:
  language: hi
  text: तू अपनी बहुत-सी सलाहों से थक गई है। अब वे खड़े हों और तुझे बचाएँ—आकाश को भागों में बाँटनेवाले[a], तारों को निहारनेवाले, और हर महीने यह बतानेवाले[b] कि तुझ पर क्या आनेवाला है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आकाश को खंडों में बाँटनेवाले।” इब्रानी अभिव्यक्ति कठिन है; सम्भवतः इसका संकेत उन ज्योतिषियों की ओर है जो अर्थ निकालने के लिए आकाश को अलग-अलग क्षेत्रों में बाँटते थे।
    reason: lexical_alternative
  - marker: b
    text: या, “नए चाँद के समय घोषणा करनेवाले।” इब्रानी का संकेत विशेष रूप से मासिक अथवा नवचंद्र-चक्र से जुड़ी भविष्यवाणियों की ओर हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִלְאֵית
  choice: तू ... थक गई है
  rationale: निफ़अल पूर्णकाल, स्त्रीलिंग एकवचन, बाबेल को सीधे संबोधित करता है और थक जाने की परिणामी दशा व्यक्त करता है।
- source_word: בְּרֹב עֲצָתַיִךְ
  choice: अपनी बहुत-सी सलाहों से
  rationale: עֵצָה का अर्थ सलाह, परामर्श या योजना हो सकता है। यहाँ बहुवचन और בְּ के साधनात्मक भाव को सहज हिन्दी में रखा गया है।
- source_word: יַעַמְדוּ נָא
  choice: अब वे खड़े हों
  rationale: अपूर्णकाल/आज्ञार्थक भाव और נָא मिलकर व्यंग्यपूर्ण चुनौती देते हैं; अनुवाद उस संक्षिप्त बुलावे को बनाए रखता है।
- source_word: וְיוֹשִׁיעֻךְ
  choice: और तुझे बचाएँ
  rationale: हिफ़ील रूप संकट से बचाने या छुड़ाने को व्यक्त करता है; यहाँ ज्योतिषियों की असमर्थता पर व्यंग्य है।
- source_word: הברו שמים
  choice: आकाश को भागों में बाँटनेवाले
  rationale: व्यंजनात्मक पाठ कठिन है, पर प्रसंग में यह सम्भवतः ज्योतिषीय विवेचन के लिए आकाश को खंडों में बाँटनेवालों की ओर संकेत करता है। कठिनाई को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: הַחֹזִים בַּכּוֹכָבִים
  choice: तारों को निहारनेवाले
  rationale: חזה मूलतः देखने या दर्शन पाने से जुड़ा है; तारों के साथ यह ज्योतिषियों के तारों का निरीक्षण करने का स्वाभाविक बोध देता है।
- source_word: מוֹדִיעִם לֶחֳדָשִׁים
  choice: हर महीने यह बतानेवाले
  rationale: मुख्य पाठ मासिक भविष्यवाणियों का स्वाभाविक अर्थ देता है, जबकि नए चाँद से जुड़े सम्भव अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מֵאֲשֶׁר יָבֹאוּ עָלָיִךְ
  choice: कि तुझ पर क्या आनेवाला है
  rationale: यह उन आनेवाली घटनाओं या विपत्तियों की विषयवस्तु बताता है जिनकी भविष्यवाणी वे करते थे।
theological_decisions:
- issue: बाबेल के गुप्त-विद्या विशेषज्ञों का चित्रण
  choice: पद को ज्योतिषियों के लिए की गई व्यंग्यपूर्ण चुनौती के रूप में प्रस्तुत किया गया है, जो बाबेल को बचा नहीं सकते।
  alternative: इसे ज्योतिषीय अर्थ स्पष्ट किए बिना केवल सामान्य सलाहकारों या ज्ञानियों के संदर्भ के रूप में प्रस्तुत करना।
  rationale: यशायाह 47 का निकटवर्ती प्रसंग बाबेल के टोने, मंत्रों और आकाशीय शकुन-विचार पर प्रहार करता है। फिर भी कठिन इब्रानी पदबंध के बारे में निश्चितता का आभास नहीं दिया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। स्त्रीलिंग एकवचन संबोधन से बाबेल का मानवीकरण सुरक्षित रखा गया है; व्यंग्यपूर्ण चुनौती को बिना अतिरिक्त व्याख्या के मुख्य पाठ में बनाए रखा गया है।
