base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/007.yaml
  text: You said[a], ‘I will be mistress forever,’ so that you did not take these things to heart[c][b]; you did not remember her end.
translation:
  language: hi
  text: तूने कहा[a], “मैं सदा मालकिन बनी रहूँगी।” इसी कारण तूने इन बातों को मन में नहीं रखा[b] और उसके अंत को याद नहीं किया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं सदा अधिकारिणी बनी रहूँगी।” इब्रानी शब्द גְבָרֶת अधिकार या ऊँचा पद रखने वाली स्त्री को दर्शाता है; इसका अर्थ अनिवार्य रूप से “रानी” नहीं है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तूने इन बातों को अपने हृदय पर नहीं रखा।”
    reason: lexical_alternative
  - marker: c
    text: या, “उसके अंतिम परिणाम को।” इब्रानी में यहाँ स्त्रीलिंग एकवचन प्रत्यय है। यह स्त्री के रूप में चित्रित बाबेल से संबंधित हो सकता है, पर उसका सटीक पूर्वपद पूरी तरह स्पष्ट नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמְרִי
  choice: तूने कहा
  rationale: क्रिया स्त्रीलिंग एकवचन संबोधन में है और बाबेल को स्त्री के रूप में संबोधित करती है। आरंभिक וַ को अलग से ‘और’ कहना हिन्दी में आवश्यक नहीं है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: यह बाबेल के अपने प्रभुत्व के अनंत बने रहने के दावे को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: אֶהְיֶה גְבָרֶת
  choice: मैं ... मालकिन बनी रहूँगी
  rationale: גְבָרֶת पद, अधिकार और प्रभुत्व रखने वाली स्त्री को दर्शाता है। ‘मालकिन’ उस भाव को रखता है, जबकि ‘रानी’ मूल पाठ से अधिक विशिष्ट राजकीय उपाधि होती।
- source_word: עַד לֹא
  choice: इसी कारण
  rationale: 'संदर्भ में यह संरचना परिणाम का भाव देती है: बाबेल के घमंडी दावे के कारण उसने आने वाले परिणाम पर ध्यान नहीं दिया।'
- source_word: שַׂמְתְּ אֵלֶּה עַל לִבֵּךְ
  choice: तूने इन बातों को मन में नहीं रखा
  rationale: यह हृदय पर रखने के इब्रानी मुहावरे को स्वाभाविक हिन्दी में व्यक्त करते हुए गंभीरता से विचार करने का भाव बनाए रखता है।
- source_word: לֹא זָכַרְתְּ
  choice: याद नहीं किया
  rationale: זכר के मूल संज्ञानात्मक अर्थ ‘याद करना’ को रखा गया है; प्रसंग में इसका आशय ध्यान में रखने या विचार करने से जुड़ा है।
- source_word: אַחֲרִיתָהּ
  choice: उसके अंत को
  rationale: स्त्रीलिंग एकवचन प्रत्यय को ‘उसके’ से सुरक्षित रखा गया है। इसका संदर्भ बाबेल के स्त्री-रूपक या पहले कही गई स्थिति/बात के अंतिम परिणाम से जुड़ सकता है।
theological_decisions:
- issue: बाबेल का स्त्री के रूप में मानवीकरण
  choice: स्त्रीलिंग संबोधन ‘तू’ और पदवाचक ‘मालकिन’ को बनाए रखा गया
  alternative: बाबेल को निर्जीव नगर मानकर तटस्थ ढंग से प्रस्तुत करना
  rationale: पूरे कथन में इब्रानी स्त्रीलिंग एकवचन रूपों का प्रयोग करता है; इन्हें बनाए रखने से भविष्यवाणी का साहित्यिक मानवीकरण सुरक्षित रहता है।
- issue: אַחֲרִיתָהּ में स्त्रीलिंग प्रत्यय का संदर्भ
  choice: मुख्य पाठ में संदर्भ को ‘उसके अंत’ के रूप में खुला रखा गया
  alternative: स्पष्ट रूप से ‘अपने अंत’ या ‘इन बातों के परिणाम’ कहना
  rationale: इब्रानी में प्रत्यय तीसरे पुरुष स्त्रीलिंग एकवचन है, दूसरे पुरुष का नहीं। इसलिए ‘अपने अंत’ कहना व्याकरणिक तनाव को मिटा देता, जबकि ‘उसके अंत’ मूल की वास्तविक संदर्भगत अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण और भविष्यद्वाणी के अनुरूप संबोधन रखा गया है। ‘तू’ का प्रयोग मूल के स्त्रीलिंग एकवचन प्रत्यक्ष संबोधन को स्पष्ट और सुसंगत बनाता है; यह यहाँ अनौपचारिक आत्मीयता नहीं, बल्कि न्यायसूचक सीधा संबोधन है।
