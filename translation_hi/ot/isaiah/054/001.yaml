id: ISA.54.1
reference: Isaiah 54:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רָנִּ֥י עֲקָרָ֖ה לֹ֣א יָלָ֑דָה פִּצְחִ֨י רִנָּ֤ה וְ/צַהֲלִי֙ לֹא חָ֔לָה כִּֽי רַבִּ֧ים בְּֽנֵי שׁוֹמֵמָ֛ה מִ/בְּנֵ֥י בְעוּלָ֖ה אָמַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/001.yaml
  text: Sing[a], barren woman, you who have not given birth; break forth into singing and shout for joy, you who have not been in labor. For the children of the desolate woman are more than the children of the married woman, says Yahweh.
translation:
  language: hi
  text: हे बाँझ स्त्री, जिसने जन्म नहीं दिया, गा[a]; गान में फूट पड़ और आनंद से जयकार कर, तू जिसे प्रसव-पीड़ा नहीं हुई। क्योंकि उजड़ी हुई स्त्री के बच्चे विवाहित स्त्री के बच्चों से अधिक हैं, याहवे कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उल्लास से पुकार।” इब्रानी क्रिया में आनंद की मुखर अभिव्यक्ति निहित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָנִּי
  choice: आनन्द से गा
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक क्रिया मुखर और उल्लासपूर्ण गायन का आह्वान करती है; ‘आनन्द से गा’ भाव और काव्यात्मकता दोनों रखता है।
- source_word: עֲקָרָה
  choice: बाँझ स्त्री
  rationale: यह संतान उत्पन्न न कर सकने वाली स्त्री को दर्शाता है; आधुनिक हिन्दी में यह स्पष्ट और सीधा रूप है।
- source_word: לֹא יָלָדָה
  choice: जिसने जन्म नहीं दिया
  rationale: रूपतः तृतीय पुरुष स्त्रीलिंग होते हुए भी यह सम्बोधित स्त्री का वर्णन करता है; हिन्दी का सम्बन्धवाचक रूप उसी कार्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: פִּצְחִי רִנָּה
  choice: गीत में फूट पड़
  rationale: פצח में अचानक फूट पड़ने की सजीव छवि और רנה में उल्लासपूर्ण मुखर ध्वनि है; यह पदबंध दोनों को संक्षेप में रखता है।
- source_word: וְצַהֲלִי
  choice: और जयजयकार कर
  rationale: क्रिया ऊँची, उल्लासपूर्ण पुकार को सूचित करती है; ‘जयजयकार कर’ हिन्दी में उत्सवपूर्ण ऊँचे स्वर को व्यक्त करता है।
- source_word: לֹא חָלָה
  choice: जिसे प्रसव-पीड़ा नहीं हुई
  rationale: यहाँ क्रिया प्रसव के समय तड़पने अथवा पीड़ा सहने के अर्थ में है; यह अनुवाद आधुनिक पाठक के लिए स्पष्ट है।
- source_word: כִּי רַבִּים ... מִן
  choice: क्योंकि ... से अधिक हैं
  rationale: רבים के साथ तुलनात्मक מן संक्षिप्त तुलना बनाता है; हिन्दी में ‘से अधिक’ उसका स्वाभाविक स्पष्ट रूप है।
- source_word: בְּנֵי שׁוֹמֵמָה
  choice: उजड़ी हुई स्त्री के बच्चे
  rationale: בנים को सन्दर्भानुसार समावेशी ‘बच्चे’ और שוממה को उजाड़ अथवा त्यक्त दशा वाली स्त्री के रूप में प्रस्तुत किया गया है।
- source_word: מִבְּנֵי בְעוּלָה
  choice: विवाहित स्त्री के बच्चों से
  rationale: בעולה पति से जुड़ी हुई, अर्थात विवाहित स्त्री को दर्शाता है, और उपसर्ग מן तुलना चिह्नित करता है।
- source_word: אָמַר יְהוָה
  choice: यह याहवे का वचन है
  rationale: प्रचलित भविष्यद्वक्ताई सूत्र को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त किया गया है और יהוה को व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चार-अक्षरीय दिव्य नाम प्रत्यक्ष है। उसका लिप्यन्तरण व्यक्तिगत वाचा-नाम को बनाए रखता है, जबकि ‘प्रभु’ नाम को उपाधि में बदल देता है।
- issue: שׁוֹמֵמָה की स्त्री-छवि
  choice: उजड़ी हुई स्त्री
  alternative: त्यागी हुई स्त्री; निर्जन स्त्री
  rationale: ‘उजड़ी हुई’ बाँझपन से अलग उसकी विनष्ट अथवा वीरान दशा की व्यापक काव्यात्मक छवि बनाए रखता है; इसे केवल वैवाहिक परित्याग मानकर सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और गरिमापूर्ण शैली अपनाई गई है। स्त्रीलिंग सम्बोधन और समानान्तर आज्ञाओं को स्पष्ट रखा गया है; तुलना को हिन्दी में स्वाभाविक ‘से अधिक’ संरचना से व्यक्त किया गया है।
