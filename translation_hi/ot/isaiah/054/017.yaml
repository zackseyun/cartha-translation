source:
  edition: WLC
  text: כָּל כְּלִ֞י יוּצַ֤ר עָלַ֨יִ/ךְ֙ לֹ֣א יִצְלָ֔ח וְ/כָל לָשׁ֛וֹן תָּֽקוּם אִתָּ֥/ךְ לַ/מִּשְׁפָּ֖ט תַּרְשִׁ֑יעִי זֹ֡את נַחֲלַת֩ עַבְדֵ֨י יְהוָ֧ה וְ/צִדְקָתָ֛/ם מֵ/אִתִּ֖/י נְאֻם יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/017.yaml
  text: No weapon formed against you will succeed[a], and every tongue that rises against you in judgment you will condemn. This is the heritage of the servants of Yahweh, and their righteousness is from me[b], declares Yahweh.
translation:
  language: hi
  text: तेरे विरुद्ध बनाया गया कोई भी हथियार सफल न होगा, और हर वह जीभ जो न्याय में तेरे विरुद्ध उठेगी, उसे तू दोषी ठहराएगी।[a] यह यहोवा के सेवकों की विरासत है, और उनकी धार्मिकता मेरी ओर से है—[b] यहोवा की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे तू दोषी सिद्ध करेगी।” इब्रानी क्रिया का अर्थ न्यायिक अर्थ में किसी को दोषी घोषित करना या दोषी सिद्ध करना है।
    reason: lexical_alternative
  - marker: b
    text: या “उनकी दोषमुक्ति मेरी ओर से है।” इस न्यायिक संदर्भ में इब्रानी शब्द का अर्थ न्यायिक रूप से निर्दोष या सही ठहराया जाना भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כְּלִי
  choice: हथियार
  rationale: शब्द का सामान्य अर्थ साधन या पात्र भी हो सकता है, पर यहाँ विरोध के लिए बनाए जाने और सफल न होने के संदर्भ में आक्रमण का साधन, अर्थात ‘हथियार’, अभिप्रेत है।
- source_word: יוּצַר
  choice: बनाया गया
  rationale: יצר के निष्क्रिय रूप का अर्थ आकार देना या गढ़ना है। ‘बनाया गया’ सहज आधुनिक हिन्दी है और केवल धातु के हथियार तक अर्थ को सीमित नहीं करता।
- source_word: עָלַיִךְ
  choice: तेरे विरुद्ध
  rationale: शत्रुतापूर्ण संदर्भ में עַל का स्वाभाविक हिन्दी रूप ‘विरुद्ध’ है। स्त्रीलिंग एकवचन संबोधन सिय्योन/नगर से जारी संवाद को सुरक्षित रखता है।
- source_word: יִצְלָח
  choice: सफल न होगा
  rationale: क्रिया का अर्थ सफल या फलवन्त होना है; हथियार के संदर्भ में ‘सफल न होगा’ स्पष्ट और स्वाभाविक है।
- source_word: לָשׁוֹן
  choice: जीभ
  rationale: मूल का सजीव रूपक रखा गया है; यहाँ ‘जीभ’ आरोप लगाने वाली वाणी को सूचित करती है।
- source_word: לַמִּשְׁפָּט
  choice: न्याय में
  rationale: यह पदबंध कानूनी या न्यायिक प्रसंग दर्शाता है। ‘न्याय में’ उस व्यापक अर्थ को बनाए रखता है और इसे आधुनिक अदालत तक सीमित नहीं करता।
- source_word: תַּרְשִׁיעִי
  choice: तू दोषी ठहराएगी
  rationale: רשע के हिफ़ईल रूप का न्यायिक अर्थ किसी को दोषी घोषित करना है। स्त्रीलिंग क्रिया मूल के स्त्रीलिंग एकवचन संबोधन को बनाए रखती है।
- source_word: נַחֲלַת
  choice: विरासत
  rationale: यह शब्द उत्तराधिकार में मिले भाग या स्थायी अधिकार को दर्शाता है; ‘विरासत’ वाचा-संबंधी भाव और सहज हिन्दी दोनों को सुरक्षित रखता है।
- source_word: עַבְדֵי
  choice: सेवकों
  rationale: ‘यहोवा के सेवक’ यहाँ परमेश्वर के लोगों की वाचा-संबंधी पहचान है; ‘सेवक’ इस संदर्भ में ‘दास’ से अधिक उपयुक्त है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ द्वारा व्यक्त किया गया है, न कि किसी उपाधि से बदला गया है।
- source_word: צִדְקָתָם
  choice: उनकी धार्मिकता
  rationale: צדקה का मूल अर्थ धार्मिकता/न्यायपरायणता है, पर इस न्यायिक संदर्भ में दोषमुक्ति या न्याय-सिद्धि का भाव भी संभव है; मुख्य पाठ में ‘धार्मिकता’ और पादटिप्पणी में न्यायिक विकल्प रखा गया है।
theological_decisions:
- issue: צִדְקָתָם का अर्थ
  choice: उनकी धार्मिकता मेरी ओर से है
  alternative: उनकी दोषमुक्ति मेरी ओर से है
  rationale: शब्द नैतिक-वाचा-संबंधी धार्मिकता और न्यायिक रूप से सही सिद्ध किए जाने, दोनों का भाव वहन कर सकता है। मुख्य पाठ शब्द के सामान्य धर्मवैचारिक अर्थ को रखता है, जबकि पादटिप्पणी तत्काल कानूनी संदर्भ का संभावित अर्थ सुरक्षित करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पूरे पद में स्त्रीलिंग एकवचन ‘तेरे/तू/ठहराएगी’ मूल इब्रानी के सिय्योन-संबोधन को सुरक्षित रखता है। ‘जीभ’ और ‘विरासत’ जैसे मूल रूपक बनाए गए हैं; कानूनी और धर्मवैचारिक अस्पष्टता पादटिप्पणियों में संरक्षित है।
