id: ISA.54.14
reference: Isaiah 54:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בִּ/צְדָקָ֖ה תִּכּוֹנָ֑נִי רַחֲקִ֤י מֵ/עֹ֨שֶׁק֙ כִּֽי לֹ֣א תִירָ֔אִי וּ/מִ֨/מְּחִתָּ֔ה כִּ֥י לֹֽא תִקְרַ֖ב אֵלָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/014.yaml
  text: In righteousness you will be established[a]; you will be far from oppression, for you will not fear, and from terror[b], for it will not come near you.
translation:
  language: hi
  text: तू धार्मिकता में स्थिर की जाएगी[a]; अत्याचार से दूर रह, क्योंकि तू नहीं डरेगी, और दहशत[b] से भी दूर रह, क्योंकि वह तेरे निकट नहीं आएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धार्मिकता के द्वारा स्थिर की जाएगी।” इब्रानी संबंधबोधक उपसर्ग स्थान/दशा के साथ-साथ साधन भी व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “दहशत” का अनुवाद “विनाश” या “बर्बादी” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּצְדָקָה
  choice: धार्मिकता में
  rationale: בְּ स्थान अथवा साधन दोनों व्यक्त कर सकता है। ‘धार्मिकता में’ इब्रानी की संक्षिप्तता बनाए रखता है और नैतिक धार्मिकता तथा न्यायपूर्ण व्यवस्था—दोनों अर्थों की गुंजाइश छोड़ता है। साधनवाचक अर्थ पादटिप्पणी में दिया गया है।
- source_word: תִּכּוֹנָנִי
  choice: स्थिर की जाएगी
  rationale: यह रूप सम्बोधित स्त्रीलिंग एकवचन सिय्योन/यरूशलेम के स्थिर और दृढ़ किए जाने का भाव देता है। निष्क्रिय परिणामात्मक अर्थ को बनाए रखने के लिए ‘स्थिर की जाएगी’ चुना गया है।
- source_word: רַחֲקִי
  choice: दूर रह
  rationale: यह स्त्रीलिंग एकवचन आज्ञार्थक रूप है; इसलिए भविष्यसूचक कथन ‘दूर रहेगी’ के बजाय आज्ञा ‘दूर रह’ रखी गई है। अगले समानांतर पदांश में स्वाभाविकता और अर्थ-स्पष्टता के लिए यही क्रिया दोहराई गई है।
- source_word: מֵעֹשֶׁק
  choice: अत्याचार से
  rationale: עֹשֶׁק शोषण, दमन अथवा अन्यायपूर्ण अत्याचार को सूचित करता है। ‘अत्याचार’ इस प्रसंग में व्यापक और सहज हिन्दी विकल्प है।
- source_word: כִּי לֹא תִירָאִי
  choice: क्योंकि तू न डरेगी
  rationale: इब्रानी अपूर्णकाल यहाँ भावी आश्वासन देता है। ‘न डरेगी’ आज्ञा या अनुमति के बजाय प्रतिज्ञात निर्भयता को व्यक्त करता है।
- source_word: וּמִמְּחִתָּה
  choice: और आतंक से भी
  rationale: מְחִתָּה आतंक, विनाश या बर्बादी का भाव दे सकता है। भय और निकट न आने वाले संकट के समानांतर ‘आतंक’ मुख्य पाठ में सर्वाधिक स्वाभाविक है; अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: כִּי לֹא תִקְרַב אֵלָיִךְ
  choice: क्योंकि वह तेरे निकट न आएगा
  rationale: इब्रानी में क्रिया מְחִתָּה के अनुसार स्त्रीलिंग है; हिन्दी में ‘आतंक’ पुल्लिंग होने के कारण स्वाभाविक व्याकरण के अनुसार ‘वह…न आएगा’ रखा गया है।
theological_decisions:
- issue: सम्बोधित व्यक्ति और स्त्रीलिंग
  choice: सिय्योन/यरूशलेम को सम्बोधित स्त्रीलिंग एकवचन ‘तू…की जाएगी…डरेगी’ रखा गया है।
  alternative: मुख्य पाठ में ‘हे सिय्योन’ अथवा ‘हे यरूशलेम’ जोड़ना।
  rationale: प्रसंग में सम्बोधन सिय्योन/यरूशलेम से है, पर इस पद में उसका नाम दोबारा नहीं आता। हिन्दी की स्त्रीलिंग क्रियाएँ मूल व्याकरण को स्पष्ट करती हैं, इसलिए नाम जोड़ना आवश्यक नहीं।
- issue: רַחֲקִי का कथन या आज्ञा होना
  choice: आज्ञार्थक ‘दूर रह’ रखा गया है।
  alternative: ‘तू दूर रहेगी’ अथवा ‘तू दूर होगी’।
  rationale: मसोरेटिक पाठ में רַחֲקִי स्पष्ट स्त्रीलिंग एकवचन आज्ञार्थक रूप है। यद्यपि प्रसंग में भावी आश्वासन के रूप में पढ़ना संभव और कई अनुवादों में प्रचलित है, मुख्य पाठ में प्रत्यक्ष रूपात्मक साक्ष्य को प्राथमिकता दी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण भविष्यवाणीपरक हिन्दी अपनाई गई है। सिय्योन को व्यक्ति रूप में सम्बोधित करने और इब्रानी स्त्रीलिंग एकवचन को दिखाने के लिए ‘तू/तेरे’ तथा स्त्रीलिंग क्रियाएँ रखी गई हैं। समानांतर वाक्य को हिन्दी में पूर्ण और स्पष्ट बनाने के लिए दूसरे पदांश में ‘दूर रह’ दोहराया गया है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
