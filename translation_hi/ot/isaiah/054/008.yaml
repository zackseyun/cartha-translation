source:
  edition: WLC
  text: בְּ/שֶׁ֣צֶף קֶ֗צֶף הִסְתַּ֨רְתִּי פָנַ֥/י רֶ֨גַע֙ מִמֵּ֔/ךְ וּ/בְ/חֶ֥סֶד עוֹלָ֖ם רִֽחַמְתִּ֑י/ךְ אָמַ֥ר גֹּאֲלֵ֖/ךְ יְהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/008.yaml
  text: In a surge of wrath I hid my face from you for a moment[a], but with everlasting lovingkindness I have had compassion on you, says Yahweh[b], your Redeemer.
translation:
  language: hi
  text: क्रोध के उफान में मैंने क्षण भर के लिए तुमसे अपना मुख छिपाया था[a], परन्तु अनन्त अटल प्रेम से मैंने तुम पर दया की है—तुम्हारा उद्धारकर्ता यहोवा कहता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उफनते क्रोध में” अथवा “क्रोध के आवेग में।” यहाँ प्रयुक्त इब्रानी अभिव्यक्ति दुर्लभ है और क्रोध की तीव्रता बताती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी नाम YHWH; इसे “याहवे” भी लिखा जाता है।
    reason: divine_name
lexical_decisions:
- source_word: בְּשֶׁצֶף קֶצֶף
  choice: उमड़े हुए क्रोध में
  rationale: दुर्लभ שֶׁצֶף और קֶצֶף की सघन जोड़ी क्रोध के अचानक उमड़ने या प्रबल फूट पड़ने का भाव देती है। यह चयन काव्यात्मक तीव्रता बनाए रखता है।
- source_word: הִסְתַּרְתִּי פָנַי
  choice: मैंने तुमसे अपना मुख छिपा लिया था
  rationale: यह इब्रानी मुहावरे का सीधा रूप है, जो अनुग्रह या उपस्थिति को कुछ समय के लिए हटा लेने का संकेत देता है।
- source_word: רֶגַע
  choice: क्षण भर
  rationale: यह बहुत थोड़े समय को दर्शाता है और आगे आनेवाले चिरस्थायी प्रेम के साथ स्पष्ट विरोध स्थापित करता है।
- source_word: וּבְחֶסֶד עוֹלָם
  choice: परन्तु सदा बने रहनेवाले अटल प्रेम से
  rationale: חֶסֶד में करुणा, निष्ठा और स्थिर प्रेम के जुड़े हुए भाव हैं; 'अटल प्रेम' इन्हें स्वाभाविक हिन्दी में व्यक्त करता है, जबकि 'सदा बने रहनेवाले' עוֹלָם को दर्शाता है।
- source_word: רִחַמְתִּיךְ
  choice: मैंने तुम पर दया की है
  rationale: רחם गहरी करुणा और दया व्यक्त करता है। यह हिन्दी में संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: גֹּאֲלֵךְ
  choice: तुम्हारा छुड़ानेवाला
  rationale: यह सहभागी संज्ञा छुड़ाने या अधिकारपूर्वक वापस लेनेवाले को दर्शाती है। यह रूप पारिवारिक-कानूनी आशय को अनावश्यक रूप से सीमित किए बिना अर्थ स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित नाम-रूप के द्वारा चतुरक्षरीय व्यक्तिगत दिव्य नाम को उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: חֶסֶד का अर्थ
  choice: सदा बने रहनेवाला अटल प्रेम
  alternative: सदा की करुणामय निष्ठा / सदा का वाचा-प्रेम
  rationale: मूल शब्द प्रेम, दया और निष्ठा को एक साथ समेटता है। मुख्य पाठ में 'अटल प्रेम' सहज और पर्याप्त व्यापक है; 'वाचा-प्रेम' तत्काल पद में निहित संबंधपरक आयाम को अधिक स्पष्ट कर सकता है, पर मूल में 'वाचा' शब्द नहीं है।
- issue: क्षणिक क्रोध और स्थायी करुणा का तनाव
  choice: दोनों कथनों को उनके स्पष्ट विरोध सहित रखा गया
  alternative: क्रोध को केवल अनुशासन या परित्याग को केवल अनुभूति के रूप में समझाना
  rationale: पद स्वयं क्षण भर मुख छिपाने और सदा बने रहनेवाले प्रेम से दया करने की तुलना करता है; अनुवाद इस धार्मिक तनाव को बिना व्याख्यात्मक समाधान के सुरक्षित रखता है।
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: व्यक्तिगत दिव्य नाम को नाम के रूप में रखना मूल के अधिक निकट है। 'यहोवा' आधुनिक हिन्दी बाइबलीय प्रयोग में सामान्यतः पहचाना जाता है; वैकल्पिक उच्चारण पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। स्त्रीलिंग एकवचन संबोधन सिय्योन/नगर की ओर है, पर हिन्दी में 'तुम' स्वाभाविक रूप से लिंग-निरपेक्ष रहता है। काव्यात्मक विरोध को उभारने के लिए 'क्षण भर' आरम्भ में और 'सदा बने रहनेवाले' उत्तरार्ध में रखा गया है।
