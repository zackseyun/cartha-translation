    text: इसका अनुवाद “राष्ट्रों के वारिस होंगे,” “राष्ट्रों पर अधिकार करेंगे,” या “राष्ट्रों को बेदखल करेंगे” भी हो सकता है। इब्रानी क्रिया प्रसंग के अनुसार विरासत पाने, अधिकार करने या किसी को बेदखल करके अधिकार लेने का अर्थ दे सकती है।
