- source_word: עָרִים נְשַׁמּוֹת
  choice: उजाड़ नगरों
  rationale: उजड़े, निर्जन या वीरान पड़े नगरों की भविष्यद्वाणी-संबंधी छवि को संक्षेप में बनाए रखता है।
- source_word: יוֹשִׁיבוּ
  choice: बसाएँगे
