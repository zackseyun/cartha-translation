  register: आधुनिक मानक हिन्दी में सिय्योन को संबोधित स्त्रीलिंग एकवचन ‘तू’ रखा गया है। भाषा सरल किंतु गरिमापूर्ण है। ‘वंशज’ सामूहिक זֶרַע को स्वाभाविक रूप से व्यक्त करता है और इब्रानी के बाद आने वाले बहुवचन क्रिया-भाव के अनुरूप है।
