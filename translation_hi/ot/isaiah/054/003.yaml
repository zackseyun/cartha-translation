  text: क्योंकि तू दाहिनी ओर और बाईं ओर फैल जाएगी, और तेरे वंशज राष्ट्रों को अपने अधिकार में कर लेंगे[a] और उजाड़ नगरों को बसाएँगे[b]।
  philosophy: optimal-equivalence
  footnotes:
