theological_decisions:
- issue: גּוֹיִם के साथ ירשׁ का अर्थ
  choice: राष्ट्रों को अपने अधिकार में कर लेंगे
  alternative: राष्ट्रों के वारिस होंगे; राष्ट्रों पर अधिकार करेंगे; राष्ट्रों को बेदखल करेंगे
  rationale: चुना गया रूप प्रतिज्ञात विस्तार और वास्तविक अधिकार का भाव रखता है, पर मूल क्रिया के बहुअर्थी स्वरूप को केवल विरासत या केवल सैन्य बेदखली तक सीमित नहीं करता।
