source:
  edition: WLC
  text: וְ/כָל בָּנַ֖יִ/ךְ לִמּוּדֵ֣י יְהוָ֑ה וְ/רַ֖ב שְׁל֥וֹם בָּנָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/013.yaml
  text: And all your children will be taught by Yahweh[b][a], and great will be the peace of your children.
translation:
  language: hi
  text: और तेरे सभी बच्चे यहोवा से शिक्षा पाएँगे[a], और तेरे बच्चों की शांति भरपूर होगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बच्चे’ के दोनों स्थानों पर ‘पुत्र’ भी अनुवाद किया जा सकता है; इब्रानी בנים का अर्थ विशेष रूप से पुत्र या व्यापक रूप से बच्चे हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘शांति’ (शालोम) में पूर्णता, कुशलता और समृद्धि का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: और ... सब
  rationale: संयोजक וְ पिछले प्रसंग से काव्यात्मक निरन्तरता रखता है, और כָל का सामूहिक अर्थ ‘सब’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: בָּנַיִ/ךְ / בָּנָיִ/ךְ
  choice: तेरे बच्चे / तेरे बच्चों
  rationale: בנים का अर्थ विशेष रूप से ‘पुत्र’ और व्यापक रूप से ‘बच्चे’ दोनों हो सकता है। यहाँ स्त्रीलिंग एकवचन में सम्बोधित सिय्योन की सामूहिक सन्तान के लिए ‘बच्चे’ उपयुक्त है; वैकल्पिक संकीर्ण अर्थ पादटिप्पणी में रखा गया है।
- source_word: לִמּוּדֵי
  choice: शिक्षा पाए हुए होंगे
  rationale: למד से बना यह रूप उन लोगों को दर्शाता है जिन्हें सिखाया गया है। ‘शिक्षा पाए हुए’ उसकी परिणामी अवस्था और यहोवा की शिक्षकीय भूमिका दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित रूप ‘यहोवा’ व्यक्तिगत दिव्य नाम को किसी उपाधि से बदले बिना प्रस्तुत करता है।
- source_word: וְ/רַב
  choice: और ... भरपूर होगी
  rationale: रַב यहाँ विधेय रूप में प्रचुरता व्यक्त करता है। हिन्दी में ‘भरपूर होगी’ काव्यात्मक उलटे क्रम को स्वाभाविक वाक्य में व्यक्त करता है।
- source_word: שְׁלֹום
  choice: शान्ति
  rationale: שׁלום का मूल अर्थ शान्ति है, पर इसमें सम्पूर्ण कुशलता और फलना-फूलना भी समाहित हो सकता है; व्यापक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: सिय्योन से कही गई प्रतिज्ञा में ‘तेरे बच्चों’ का अभिप्राय
  choice: ‘तेरे बच्चे’ कहकर सामूहिक और सामान्य अभिव्यक्ति बनाए रखी गई है।
  alternative: ‘तेरे पुत्र’ या ‘तेरे निवासी’
  rationale: इब्रानी पाठ स्त्री के रूप में सम्बोधित सिय्योन की सन्तान की काव्यात्मक छवि रखता है। अनुवाद इसे किसी विशिष्ट जातीय, कलीसियाई या केवल पुरुष समूह के रूप में निर्धारित नहीं करता।
- issue: לִמּוּדֵי יְהוָה में सम्बन्ध
  choice: ‘यहोवा से शिक्षा पाए हुए’
  alternative: ‘यहोवा के शिष्य’
  rationale: इब्रानी रचना सिखाए जाने की अवस्था और यहोवा से उसके सम्बन्ध को व्यक्त करती है। ‘शिष्य’ सम्भव है, पर वह पहचान या संस्थागत शिष्यत्व को अधिक स्पष्ट कर सकता है; चुना हुआ पाठ मूल की व्यापकता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। सिय्योन को स्त्रीलिंग एकवचन में किए गए सम्बोधन के अनुरूप ‘तेरे’ प्रयोग किया गया है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं और जिस शब्द को स्पष्ट करते हैं उसी के पास रखे गए हैं।
