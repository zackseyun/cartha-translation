  yaml_path: translation/ot/isaiah/054/007.yaml
  text: For a brief moment I abandoned you[a], but with great compassion I will gather you.
translation:
  language: hi
  text: “क्षण भर के लिए मैंने तुझे छोड़ दिया था[a], पर बड़ी करुणा से मैं तुझे इकट्ठा करूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “थोड़े समय के लिए मैंने तुझे त्याग दिया था।”
    reason: ‘त्याग दिया था’ עזב का अधिक औपचारिक और प्रबल विकल्प है; ‘थोड़े समय के लिए’ רֶגַע קָטֹן का अधिक शाब्दिक विकल्प है।
lexical_decisions:
- source_word: בְּרֶגַע קָטֹן
  choice: एक थोड़े समय के लिए
  rationale: רֶגַע קָטֹן अत्यंत छोटी अवधि को व्यक्त करता है। हिंदी में यह वाक्यांश अवधि का भाव स्वाभाविक रूप से देता है और मूल के ‘क्षण’ तथा ‘छोटा’ दोनों के संयुक्त अर्थ को संप्रेषित करता है।
- source_word: עֲזַבְתִּיךְ
  choice: मैंने तुझे छोड़ दिया था
  rationale: עזב का अर्थ छोड़ना, त्यागना या परित्याग करना हो सकता है। ‘छोड़ दिया था’ आधुनिक हिंदी में सीधा और गंभीर है; पादटिप्पणी अधिक प्रबल विकल्प को सुरक्षित रखती है। स्त्रीलिंग एकवचन संबोधन हिंदी में पृथक रूप से चिह्नित नहीं होता।
- source_word: וּבְרַחֲמִים
  choice: पर ... करुणा के साथ
  rationale: וְ का यहाँ विरोधसूचक अनुवाद ‘पर’ दोनों खंडों—अल्पकालीन छोड़ने और पुनर्स्थापन—के बीच स्पष्ट विरोध के कारण उचित है। רַחֲמִים व्याकरणतः बहुवचन होते हुए भी यहाँ प्रचुर दया/करुणा का समष्टिगत भाव देता है।
- source_word: גְּדֹלִים
  choice: बड़ी
  rationale: विशेषण करुणा की विशालता और प्रचुरता पर बल देता है। ‘बड़ी करुणा’ सरल, स्वाभाविक और मूल के निकट है।
- source_word: אֲקַבְּצֵךְ
  choice: मैं तुझे फिर इकट्ठा करूँगा
  rationale: קבץ का पिएल रूप इकट्ठा करने या बिखरे हुओं को एकत्र करने का भाव देता है। हिंदी में ‘फिर’ संदर्भगत पुनर्स्थापन को स्पष्ट करता है, जबकि ‘इकट्ठा करूँगा’ मूल क्रिया की ठोस छवि बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय त्याग और करुणामय पुनर्स्थापन के बीच तनाव
  choice: वास्तविक किंतु थोड़े समय के लिए छोड़ना, जिसके बाद बड़ी करुणा से पुनः एकत्र करना
  alternative: छोड़ना केवल अनुभूत या प्रतीत हुआ था; अथवा भाषा को नरम करके केवल दूरी बताना
  rationale: मूल में עזב सीधी और प्रबल क्रिया है, इसलिए उसके भाव को केवल अनुभूति या प्रतीति में नहीं बदला गया। साथ ही קָטֹן और רַחֲמִים גְּדֹלִים न्याय की सीमित अवधि और करुणा की महानता को साथ रखते हैं; अनुवाद इस तनाव को सुलझाने के बजाय बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। परमेश्वर द्वारा स्त्रीरूप सिय्योन/यरूशलेम को संबोधन के लिए ‘तुझे’ रखा गया है। ‘फिर’ पुनर्स्थापन का संदर्भगत भाव सामने लाता है, पर मूल क्रिया ‘इकट्ठा करना’ को बनाए रखता है।
