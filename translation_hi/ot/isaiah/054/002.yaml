source:
  edition: WLC
  text: הַרְחִ֣יבִי מְק֣וֹם אָהֳלֵ֗/ךְ וִ/ירִיע֧וֹת מִשְׁכְּנוֹתַ֛יִ/ךְ יַטּ֖וּ אַל תַּחְשֹׂ֑כִי הַאֲרִ֨יכִי֙ מֵֽיתָרַ֔יִ/ךְ וִ/יתֵדֹתַ֖יִ/ךְ חַזֵּֽקִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/002.yaml
  text: Enlarge the place of your tent[a], and let the curtains of your dwellings be stretched out; do not hold back. Lengthen your cords[b], and strengthen your stakes.
translation:
  language: hi
  text: अपने तंबू की जगह चौड़ी कर, और अपने निवासों के परदों को फैलने दे; कंजूसी मत कर। अपनी रस्सियाँ लंबी कर, और अपनी खूँटियाँ मज़बूत कर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַרְחִיבִי
  choice: चौड़ी कर
  rationale: हिफ़ील आज्ञार्थक स्त्रीलिंग एकवचन का कारणवाचक बल बनाए रखता है और सिय्योन को दिए सीधे आदेश के रूप में स्वाभाविक हिन्दी है।
- source_word: מְקוֹם אָהֳלֵךְ
  choice: अपने तम्बू की जगह
  rationale: मूल के ठोस स्थान और तम्बू के बिंब को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: וִירִיעוֹת מִשְׁכְּנוֹתַיִךְ
  choice: तेरे निवासों के परदे
  rationale: יריעות को कपड़े के परदों और משכנות को बहुवचन निवासों के रूप में व्यक्त करता है; तम्बू का प्रसंग अर्थ स्पष्ट करता है।
- source_word: יַטּוּ
  choice: फैलाए जाएँ
  rationale: हिफ़ील अपूर्ण 3 बहुवचन का यहाँ इच्छार्थक/आज्ञासूचक भाव है; कर्मवाच्य हिन्दी परदों पर की जाने वाली क्रिया को व्यक्त करती है।
- source_word: אַל תַּחְשֹׂכִי
  choice: मत रोक
  rationale: חשׂך के ‘रोकना, बचाकर रखना, पीछे हटना’ अर्थ को संक्षिप्त रखते हुए विस्तार की आज्ञा के संदर्भ में स्वाभाविक निषेध देता है।
- source_word: הַאֲרִיכִי מֵיתָרַיִךְ
  choice: अपनी रस्सियाँ लम्बी कर
  rationale: हिफ़ील आज्ञार्थक ‘लम्बा कर’ और तम्बू की रस्सियों के ठोस अर्थ को सीधे व्यक्त करता है।
- source_word: וִיתֵדֹתַיִךְ חַזֵּקִי
  choice: अपनी खूँटियाँ मज़बूत कर
  rationale: יתד के तम्बू की खूँटी वाले अर्थ और पिएल आज्ञार्थक חזק के ‘मज़बूत कर’ बल को बनाए रखता है।
theological_decisions:
- issue: सिय्योन के लिए तम्बू और निवास का रूपक
  choice: मुख्य पाठ में तम्बू, परदे, रस्सियाँ और खूँटियाँ जैसे ठोस बिंब यथावत रखे गए हैं।
  alternative: इसे ‘अपने घर में अधिक लोगों के लिए जगह बना’ जैसे जनसंख्या-वृद्धि या पुनर्स्थापना के स्पष्टार्थक कथन में बदलना।
  rationale: मूल पद विस्तार की बात तम्बू बढ़ाने की ठोस आज्ञाओं द्वारा करता है। रूपक को बनाए रखने से उसका व्यापक धर्मवैचारिक आशय संदर्भ से उभरता है और अनुवाद उसे समय से पहले सीमित नहीं करता।
translation_notes:
  register: 'आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सुबोध शैली। स्त्रीलिंग एकवचन आज्ञाएँ सिय्योन को संबोधन के रूप में सुरक्षित हैं। ‘तम्बू’, ‘रस्सियाँ’ और ‘खूँटियाँ’ सामान्य पाठक के लिए स्पष्ट सांस्कृतिक शब्द हैं, इसलिए अलग सांस्कृतिक टिप्पणी आवश्यक नहीं मानी गई। अंग्रेज़ी परामर्श-पाठ के पदचिह्नों में विषयगत असंगति थी: [a] का दिया पाठ वास्तव में ‘मत रोक’ से और [b] का पाठ परदों/खूँटियों से जुड़ता है; चूँकि मूल हिब्रू में कोई पाठांतर नहीं और हिन्दी में अर्थ स्पष्ट है, मुख्य पाठ में भ्रामक चिह्न नहीं जोड़े गए।'
