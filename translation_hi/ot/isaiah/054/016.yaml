id: ISA.54.16
reference: Isaiah 54:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הן אָֽנֹכִי֙ בָּרָ֣אתִי חָרָ֔שׁ נֹפֵ֨חַ֙ בְּ/אֵ֣שׁ פֶּחָ֔ם וּ/מוֹצִ֥יא כְלִ֖י לְ/מַעֲשֵׂ֑/הוּ וְ/אָנֹכִ֛י בָּרָ֥אתִי מַשְׁחִ֖ית לְ/חַבֵּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/016.yaml
  text: Look[a], I myself have created the craftsman who blows on the fire of coals and brings out a weapon for his work[c][b]; and I myself have created the destroyer to destroy.
translation:
  language: hi
  text: देखो[a], मैंने ही उस कारीगर को रचा है जो कोयलों की आग फूँकता है और काम के लिए एक हथियार[b] तैयार करता है[c]; और मैंने ही विनाश करने वाले को विनाश करने के लिए रचा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ध्यान दो।”
    reason: lexical_alternative
  - marker: b
    text: या “औज़ार,” “उपकरण” अथवा “वस्तु”; इब्रानी शब्द व्यापक है, पर यहाँ संभवतः युद्ध के हथियार का संकेत है।
    reason: lexical_alternative
  - marker: c
    text: “काम के लिए” में इब्रानी प्रत्यय का संबंध कारीगर से भी हो सकता है और बनाए गए हथियार या उपकरण से भी; इसलिए अर्थ “कारीगर के काम के लिए” अथवा “उस उपकरण के कार्य के लिए” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הן
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला अव्यय है। ‘देखो’ आधुनिक, स्वाभाविक हिन्दी में उसके संकेतात्मक और बलाघाती भाव को बनाए रखता है।
- source_word: אָנֹכִי ... וְאָנֹכִי
  choice: मैं ही ... और मैं ही
  rationale: स्वतंत्र सर्वनाम की पुनरावृत्ति बलाघाती है; ‘मैं ही’ दोनों व्यक्तियों के सृष्टिकर्ता के रूप में परमेश्वर पर जोर बनाए रखता है।
- source_word: בָּרָאתִי
  choice: रचने वाला हूँ
  rationale: यह पूर्ण क्रिया है, पर हिन्दी में वर्तमान प्रसंग से जुड़ी परमेश्वर की सृजनकारी क्रिया को ‘रचने वाला हूँ’ स्वाभाविक ढंग से व्यक्त करता है और दोनों खंडों की समानांतरता रखता है।
- source_word: חָרָשׁ
  choice: कारीगर
  rationale: यह शब्द व्यापक रूप से शिल्पी या कारीगर को सूचित कर सकता है; कोयलों और हथियार के प्रसंग से धातुकार अभिप्रेत है, पर मुख्य पाठ में व्यापकता सुरक्षित रखी गई है।
- source_word: נֹפֵחַ בְּאֵשׁ פֶּחָם
  choice: जो कोयलों की आग को फूँकता है
  rationale: यह इब्रानी बिंब के निकट रहते हुए हिन्दी में धौंकनी से आग भड़काने की क्रिया को स्पष्ट करता है।
- source_word: וּמוֹצִיא כְלִי
  choice: एक हथियार बनाता है
  rationale: מוֹצִיא का शाब्दिक भाव ‘निकालता/सामने लाता’ है, पर निर्माण के प्रसंग में ‘बनाता है’ स्वाभाविक है। כְלִי व्यापक है, किंतु यहाँ विनाश और धातुकर्म का प्रसंग ‘हथियार’ का समर्थन करता है।
- source_word: לְמַעֲשֵׂהוּ
  choice: अपने काम के लिए
  rationale: पुल्लिंग एकवचन प्रत्यय कारीगर या बने हुए उपकरण—दोनों की ओर संकेत कर सकता है। हिन्दी में ‘अपने’ इस संदर्भगत अस्पष्टता को कुछ हद तक बनाए रखता है; पादटिप्पणी विकल्प स्पष्ट करती है।
- source_word: מַשְׁחִית
  choice: विनाश करने वाला
  rationale: हिफ़ील कृदंत यहाँ संज्ञा के रूप में प्रयुक्त है। यह हिन्दी में सीधा और बोधगम्य है।
- source_word: לְחַבֵּל
  choice: ताकि वह विनाश करे
  rationale: उद्देश्य सूचक לְ को ‘ताकि’ से स्पष्ट किया गया है; ‘विनाश करे’ मूल क्रिया के प्रबल अर्थ और जानबूझकर की गई पुनरुक्ति को बनाए रखता है।
theological_decisions:
- issue: कारीगर और विनाश करने वाले—दोनों की परमेश्वर द्वारा सृष्टि
  choice: दोनों खंडों में स्पष्ट रूप से ‘मैं ही ... रचने वाला हूँ’ कहा गया है।
  alternative: विनाश करने वाले के संबंध में सृजनकारी कर्तृत्व को अप्रत्यक्ष या नरम बनाना।
  rationale: इब्रानी पाठ दोनों व्यक्तियों के लिए אָנֹכִי और בָּרָאתִי की धारणा दोहराता है। अनुवाद इस धार्मिक तनाव को बिना दार्शनिक व्याख्या जोड़े यथावत रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘मैं ही’ से मूल का बल सुरक्षित रखा गया है। ‘कारीगर’ मुख्य पाठ में शब्द की व्यापकता रखता है, जबकि धातुकार का संदर्भ पादटिप्पणी और आसपास के बिंब से स्पष्ट होता है।
