source:
  edition: WLC
  text: כִּֽי כְ/אִשָּׁ֧ה עֲזוּבָ֛ה וַ/עֲצ֥וּבַת ר֖וּחַ קְרָאָ֣/ךְ יְהוָ֑ה וְ/אֵ֧שֶׁת נְעוּרִ֛ים כִּ֥י תִמָּאֵ֖ס אָמַ֥ר אֱלֹהָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/006.yaml
  text: For Yahweh has called you like a wife forsaken and grieved in spirit[a], like a wife of youth when she is rejected[b], says your God.
translation:
  language: hi
  text: क्योंकि याहवे ने तुम्हें ऐसी त्यागी हुई पत्नी के समान, जो मन से दुखी है, बुलाया है[a]—जैसे युवावस्था में ब्याही पत्नी को ठुकराया जाता है[b]—तुम्हारा परमेश्वर कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऐसी त्यागी हुई स्त्री के समान, जो मन से दुखी है।” इब्रानी शब्द का अर्थ “स्त्री” या “पत्नी” दोनों हो सकता है; वैवाहिक प्रसंग में “पत्नी” अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या, “जैसे युवावस्था की पत्नी, जब वह ठुकराई जाती है।” इब्रानी वाक्यांश संक्षिप्त है और इसके कालगत या भावगत संबंध को कुछ भिन्न ढंग से समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले आश्वासन का आधार या कारण प्रस्तुत करता है और हिन्दी में प्रसंग का प्रवाह स्वाभाविक रखता है।
- source_word: כְאִשָּׁה
  choice: ऐसी पत्नी के समान
  rationale: אִשָּׁה का अर्थ स्त्री या पत्नी हो सकता है; यहाँ वैवाहिक रूपक के कारण 'पत्नी' अधिक प्रसंगानुकूल है।
- source_word: עֲזוּבָה
  choice: त्यागी हुई
  rationale: यह छोड़े जाने और संबंध-विच्छेद की गहरी पीड़ा को व्यक्त करता है तथा भविष्यवाणी की गरिमा बनाए रखता है।
- source_word: וַעֲצוּבַת רוּחַ
  choice: जिसका मन दुखी है
  rationale: शाब्दिक 'आत्मा में दुखी' की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक है और भीतरी भावनात्मक पीड़ा का अर्थ सुरक्षित रखता है।
- source_word: קְרָאָךְ
  choice: तुम्हें ... बुलाया है
  rationale: पूर्ण हुई क्रिया के वर्तमान प्रभाव को व्यक्त करता है और सिय्योन को सीधे संबोधित किए जाने की छवि बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וְאֵשֶׁת נְעוּרִים
  choice: जैसे युवावस्था की पत्नी
  rationale: यह उस पत्नी की इब्रानी छवि को सुरक्षित रखता है जिससे युवावस्था में विवाह हुआ था।
- source_word: כִּי תִמָּאֵס
  choice: को ठुकरा दिया गया हो
  rationale: इब्रानी खंड संक्षिप्त और वाक्यगत रूप से कठिन है; यह अनुवाद निष्क्रिय भाव तथा अस्वीकृति के वैवाहिक संदर्भ को बनाए रखता है, जबकि 'हो' कुछ अनिश्चितता भी सुरक्षित रखता है।
- source_word: אָמַר אֱלֹהָיִךְ
  choice: तुम्हारा परमेश्वर कहता है
  rationale: भविष्यवाणी-सूत्र को स्वाभाविक हिन्दी वर्तमान काल में रखता है और वाचा-संबंधी संबोधन सुरक्षित करता है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे अथवा प्रभु
  rationale: मूल में चतुरक्षरी व्यक्तिगत नाम है। हिन्दी पाठकों के लिए स्थापित लिप्यंतरण 'यहोवा' नाम को उपाधि में बदले बिना प्रस्तुत करता है।
- issue: सिय्योन के लिए वैवाहिक रूपक
  choice: पत्नी और विवाह की छवि को प्रत्यक्ष रखना
  alternative: पूरे पद में केवल 'स्त्री' कहना अथवा रूपक को 'नगर/लोग' के रूप में खोल देना
  rationale: मूल पाठ सिय्योन और परमेश्वर के संबंध को वैवाहिक भाषा में व्यक्त करता है; रूपक को बनाए रखना उसके भविष्यवाणी-संबंधी और धर्मवैचारिक तनाव को सुरक्षित रखता है।
- issue: כִּי תִמָּאֵס का संबंध और भाव
  choice: जैसे युवावस्था की पत्नी को ठुकरा दिया गया हो
  alternative: युवावस्था की पत्नी, जब वह ठुकरा दी जाती है; अथवा क्या युवावस्था की पत्नी ठुकराई जा सकती है?
  rationale: इब्रानी वाक्यांश अत्यंत संक्षिप्त है और कालगत, शर्तगत या प्रश्नात्मक छाया ग्रहण कर सकता है। मुख्य पाठ स्वाभाविक हिन्दी देता है, जबकि पादटिप्पणी अनिश्चितता स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वैवाहिक रूपक और मूल की वाक्यगत अनिश्चितता सुरक्षित रखी गई है; 'मन दुखी' स्वाभाविक हिन्दी में भीतरी पीड़ा व्यक्त करता है।
