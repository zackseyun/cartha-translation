source:
  edition: WLC
  text: כִּי מֵ֥י נֹ֨חַ֙ זֹ֣את לִ֔/י אֲשֶׁ֣ר נִשְׁבַּ֗עְתִּי מֵ/עֲבֹ֥ר מֵי נֹ֛חַ ע֖וֹד עַל הָ/אָ֑רֶץ כֵּ֥ן נִשְׁבַּ֛עְתִּי מִ/קְּצֹ֥ף עָלַ֖יִ/ךְ וּ/מִ/גְּעָר בָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/009.yaml
  text: 'For this is like the waters of Noah to me: just as I swore that the waters of Noah would never again pass over the earth[a], so I have sworn not to be angry with you and not to rebuke you.'
translation:
  language: hi
  text: '“क्योंकि यह मेरे लिए नूह के जल के समान है: जैसे मैंने शपथ खाई थी कि नूह के जल फिर कभी पृथ्वी पर नहीं गुजरेंगे[a], वैसे ही मैंने शपथ खाई है कि मैं तुझ पर क्रोधित नहीं होऊँगा और न तुझे डाँटूँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि यह मेरे लिए नूह के जल जैसा है।” कुछ अनुवाद, प्राचीन अनुवादों से प्रभावित होकर, “नूह के दिन” पढ़ते हैं, पर इब्रानी पाठ में “नूह के जल” है।
    reason: वैकल्पिक संरचना और प्राचीन पाठांतर की सूचना
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले आश्वासन का आधार प्रस्तुत करता है और इब्रानी संयोजक का स्वाभाविक हिन्दी रूप है।
- source_word: מֵי נֹחַ
  choice: नूह का जल
  rationale: इब्रानी में शाब्दिक अर्थ ‘नूह का जल’ है; इससे जलप्रलय का संकेत बना रहता है और ‘दिन’ वाली प्राचीन वैकल्पिक पाठ-परंपरा मुख्य पाठ में नहीं आती।
- source_word: זֹאת לִי
  choice: यह मेरे लिए ... के समान है
  rationale: इब्रानी अभिव्यक्ति संक्षिप्त और कुछ हद तक लुप्तोपम है। ‘के समान’ जोड़ने से כֵּן के साथ तुलना स्पष्ट और हिन्दी में स्वाभाविक होती है।
- source_word: נִשְׁבַּעְתִּי
  choice: मैंने शपथ खाई थी / मैंने शपथ खाई है
  rationale: क्रिया का अर्थ शपथ खाना है। पहले प्रसंग में भूतकाल और वर्तमान प्रतिज्ञा में पूर्ण वर्तमान हिन्दी प्रवाह तथा समय-संबंध दोनों को स्पष्ट करते हैं।
- source_word: מֵעֲבֹר ... עַל הָאָרֶץ
  choice: पृथ्वी पर ... छाएगा
  rationale: עבר मूलतः पार जाने या ऊपर से गुजरने को बताता है; बाढ़ के जल के संदर्भ में ‘पृथ्वी पर छाना’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עוֹד
  choice: फिर कभी नहीं
  rationale: शपथ के संदर्भ में दोबारा न होने की निषेधात्मक शक्ति को स्पष्ट करता है।
- source_word: מִקְּצֹף עָלַיִךְ
  choice: मैं तुझ पर क्रोधित नहीं होऊँगा
  rationale: קצף का अर्थ क्रोधित होना है; शपथ-वाक्य में निहित निषेध हिन्दी में स्पष्ट किया गया है।
- source_word: וּמִגְּעָר בָּךְ
  choice: और न तुझे डाँटूँगा
  rationale: גער के ‘डाँटना/झिड़कना’ अर्थ को साधारण, गरिमापूर्ण और सीधे हिन्दी शब्द से व्यक्त किया गया है।
theological_decisions:
- issue: זֹאת לִי में लुप्तोपम तुलना
  choice: यह मेरे लिए नूह के जल के समान है
  alternative: यह मेरे लिए नूह के जल जैसा है / यह मेरे लिए नूह के दिनों के समान है
  rationale: मसोरेटिक इब्रानी पाठ ‘जल’ कहता है, ‘दिन’ नहीं। तुलना को समझने योग्य बनाने के लिए ‘के समान’ जोड़ा गया है, पर पाठ की वास्तविक असामान्यता को पादटिप्पणी में बताया गया है।
- issue: מִן + infinitive वाले शपथ-वाक्य का निषेधात्मक बल
  choice: मैं तुझ पर क्रोधित नहीं होऊँगा और न तुझे डाँटूँगा
  alternative: मैंने शपथ खाई है कि मैं तुझ पर क्रोधित नहीं होऊँगा या तुझे नहीं डाँटूँगा
  rationale: इब्रानी रचना में शपथ के साथ निहित निषेध को हिन्दी में स्पष्ट करना आवश्यक है; इससे कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा जाता।
- issue: दूसरे पुरुष स्त्रीलिंग एकवचन का संबोधन
  choice: तुझ / तुझे
  alternative: तुम पर / तुम्हें
  rationale: इब्रानी प्रत्यय स्त्रीलिंग एकवचन हैं और सिय्योन को व्यक्तिवाचक रूप में संबोधित करते हैं। एकवचन रूप इस काव्यात्मक संबोधन को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय शैली रखी गई है। सिय्योन के स्त्रीलिंग एकवचन संबोधन को ‘तुझ/तुझे’ से सुरक्षित रखा गया है।
