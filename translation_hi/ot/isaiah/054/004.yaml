    issue: The third shame clause is rendered impersonally as ‘तेरा अनादर न होगा।’
    rationale: 'Hebrew תַחְפִּירִי is second-person feminine singular: Zion herself will not be disgraced. The existing Hindi can imply merely that no one will disrespect her, which is less direct and weakens the threefold address.'
  - severity: medium
    issue: Footnote b omits the English audit trail’s lexical alternative.
    rationale: The footnote is marked as a lexical alternative, but the draft supplies only explanation. It should include the alternative ‘तू लज्जित न होगी’ as well as the note on the overlapping shame vocabulary.
