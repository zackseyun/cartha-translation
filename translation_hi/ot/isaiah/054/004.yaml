id: ISA.54.4
reference: Isaiah 54:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַל תִּֽירְאִי֙ כִּי לֹ֣א תֵב֔וֹשִׁי וְ/אַל תִּכָּלְמִ֖י כִּ֣י לֹ֣א תַחְפִּ֑ירִי כִּ֣י בֹ֤שֶׁת עֲלוּמַ֨יִ/ךְ֙ תִּשְׁכָּ֔חִי וְ/חֶרְפַּ֥ת אַלְמְנוּתַ֖יִ/ךְ לֹ֥א תִזְכְּרִי עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/004.yaml
  text: Do not fear[a], for you will not be put to shame; and do not be humiliated, for you will not be disgraced. For you will forget the shame of your youth[b], and you will remember the reproach of your widowhood no more.
translation:
  language: hi
  text: मत डर[a], क्योंकि तू लज्जित न होगी; और अपमानित न हो, क्योंकि तू कलंकित न होगी। क्योंकि तू अपनी जवानी की लज्जा भूल जाएगी, और अपने विधवापन की निन्दा फिर कभी स्मरण न करेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मत डरना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: मत डर
  rationale: निषेध के साथ स्त्रीलिंग एकवचन आज्ञार्थक रूप है, जो मानवीकृत सिय्योन/यरूशलेम को संबोधित करता है। ‘मत डर’ संक्षिप्त, स्वाभाविक और सीधा है।
- source_word: תֵבוֹשִׁי
  choice: तू लज्जित न होगी
  rationale: בושׁ में लज्जा, सार्वजनिक अपमान या आशा टूटने का भाव हो सकता है। यहाँ ‘लज्जित न होगी’ स्वाभाविक हिन्दी है और व्यापक अर्थ को खुला रखता है।
- source_word: תִּכָּלְמִי
  choice: अपमानित न हो
  rationale: כלם का निफ़अल रूप अपमानित या निरादृत होने का भाव देता है। यह पहले लज्जा-सूचक क्रियापद से भेद बनाए रखता है।
- source_word: תַחְפִּירִי
  choice: तेरा अनादर न होगा
  rationale: यहाँ חפר का हिफ़ील रूप लज्जा या अनादर सहने का भाव व्यक्त करता है। यह हिन्दी में स्वाभाविक रहते हुए समानांतर लज्जा-भाषा को बनाए रखता है।
- source_word: בֹשֶׁת עֲלוּמַיִךְ
  choice: अपनी जवानी की लज्जा
  rationale: עֲלוּמִים जवानी या युवावस्था को दर्शाता है। ‘जवानी की लज्जा’ भविष्यद्वक्ता के रूपक को संक्षेप और स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: תִּשְׁכָּחִי
  choice: भूल जाएगी
  rationale: प्रतिज्ञा के प्रसंग में साधारण भविष्यकाल उपयुक्त है।
- source_word: חֶרְפַּת אַלְמְנוּתַיִךְ
  choice: अपने विधवापन की निन्दा
  rationale: חֶרְפָּה में निन्दा, तिरस्कार और सार्वजनिक बदनामी का सामाजिक भाव है। ‘विधवापन’ वैवाहिक रूपक को व्याख्यायित करके हटाने के बजाय ज्यों का त्यों रखता है।
- source_word: לֹא תִזְכְּרִי עוֹד
  choice: फिर कभी स्मरण न करेगी
  rationale: यह עוֹד के ‘अब और नहीं/फिर नहीं’ वाले बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: स्त्रीलिंग एकवचन संबोधन का अभिप्रेत पात्र
  choice: पद में मानवीकृत सिय्योन/यरूशलेम को स्त्री के रूप में संबोधित समझा गया है।
  alternative: किसी सामान्य स्त्री को संबोधन
  rationale: यशायाह 54 का निकट प्रसंग स्त्रीलिंग एकवचन तथा विवाह और विधवापन के बिंबों से पुनर्स्थापित सिय्योन को संबोधित करता है। मुख्य पाठ ‘तू’ और स्त्रीलिंग क्रियारूपों द्वारा इसे संकेतित करता है, पर नाम जोड़कर अस्पष्टता को समाप्त नहीं करता।
- issue: ‘विधवापन’ का वैवाहिक रूपक
  choice: रूपक को अक्षरशः ‘विधवापन’ के रूप में रखा गया है।
  alternative: त्यागे जाने या उजड़ने के अर्थ में व्याख्यात्मक अनुवाद
  rationale: यह रूपक अध्याय में टूटे संबंध और पुनर्स्थापना की धार्मिक गहराई रखता है; इसलिए इसे व्याख्यायित करके हटाना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और काव्यात्मक गद्य। मानवीकृत सिय्योन के स्त्रीलिंग एकवचन संबोधन को ‘तू’ तथा स्त्रीलिंग क्रियारूपों से बनाए रखा गया है। लज्जा-संबंधी समानांतर इब्रानी शब्दों को यथासंभव अलग हिन्दी पदों—‘लज्जित’, ‘अपमानित’, ‘अनादर’, ‘निन्दा’—से व्यक्त किया गया है, बिना कृत्रिम भेद थोपे।
