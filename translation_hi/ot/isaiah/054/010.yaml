id: ISA.54.10
reference: Isaiah 54:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י הֶֽ/הָרִים֙ יָמ֔וּשׁוּ וְ/הַ/גְּבָע֖וֹת תְּמוּטֶ֑נָה וְ/חַסְדִּ֞/י מֵ/אִתֵּ֣/ךְ לֹֽא יָמ֗וּשׁ וּ/בְרִ֤ית שְׁלוֹמִ/י֙ לֹ֣א תָמ֔וּט אָמַ֥ר מְרַחֲמֵ֖/ךְ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/010.yaml
  text: For the mountains may depart and the hills may be shaken[a], but my steadfast love will not depart from you, and my covenant of peace will not be shaken, says Yahweh[c][b], who has compassion on you.
translation:
  language: hi
  text: क्योंकि पहाड़ भले ही हट जाएँ और पहाड़ियाँ डगमगा जाएँ, फिर भी मेरा अटल प्रेम[a] तुमसे नहीं हटेगा और मेरी शांति की वाचा[b] नहीं डगमगाएगी—तुम पर करुणा करनेवाला याहवे[c] यह कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अटल प्रेम’ इब्रानी חֶסֶד का अनुवाद है; इसमें निष्ठावान या वाचा से बँधे प्रेम का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘शांति की वाचा’ का अर्थ ‘कल्याण की वाचा’ भी समझा जा सकता है; इब्रानी शालोम में शांति के साथ कुशलता, समग्रता और कल्याण भी शामिल हैं।
    reason: lexical_alternative
  - marker: c
    text: ‘याहवे’ इब्रानी नाम יהוה का लिप्यंतरण है।
    reason: translation_convention
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के आधार या आश्वासन का परिचय देता है। अगले उपवाक्य में ‘भले ही’ जोड़कर पहाड़ों और परमेश्वर के प्रेम के बीच निहित विरोध को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: יָמוּשׁוּ / לֹא יָמוּשׁ
  choice: हट जाएँ / नहीं हटेगा
  rationale: एक ही इब्रानी धातु מוּשׁ की पुनरावृत्ति को हिन्दी में ‘हटना’ दोहराकर सुरक्षित रखा गया है।
- source_word: תְּמוּטֶנָה / לֹא תָמוּט
  choice: डगमगा जाएँ / नहीं डगमगाएगी
  rationale: מוֹט स्थिरता खोने या डगमगाने का भाव देता है। दोनों स्थानों पर एक ही हिन्दी क्रिया रखी गई है और इसे מוּשׁ से अलग रखा गया है।
- source_word: חַסְדִּי
  choice: मेरा अटल प्रेम
  rationale: חֶסֶד में प्रेम, निष्ठा और स्थायी प्रतिबद्धता के भाव सम्मिलित हैं। ‘अटल प्रेम’ सहज हिन्दी में इसकी स्थिरता को प्रमुखता देता है, जबकि वाचा-संबंधी संदर्भ अगली पंक्ति से स्पष्ट होता है।
- source_word: בְרִית שְׁלוֹמִי
  choice: मेरी शांति की वाचा
  rationale: בְּרִית का अनुवाद ‘वाचा’ और שָׁלוֹם का ‘शांति’ किया गया है। ‘शांति’ यहाँ केवल संघर्ष का अभाव नहीं, बल्कि कुशलता और संपूर्ण कल्याण भी समेटती है।
- source_word: מְרַחֲמֵךְ
  choice: तुम पर करुणा करनेवाला
  rationale: रह़म धातु का कृदंत याहवे को सिय्योन पर निरंतर करुणा करनेवाले के रूप में वर्णित करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम का हिन्दी लिप्यंतरण किया गया है; उसके स्थान पर कोई उपाधि नहीं रखी गई।
theological_decisions:
- issue: חֶסֶד का अर्थ
  choice: अटल प्रेम
  alternative: वाचा का निष्ठावान प्रेम; करुणामय निष्ठा
  rationale: यह चयन प्रेम और उसकी स्थायी विश्वसनीयता दोनों को व्यक्त करता है, पर शब्द को केवल एक संकीर्ण धर्मवैज्ञानिक अर्थ तक सीमित नहीं करता।
- issue: בְרִית שְׁלוֹמִי में שָׁלוֹם का विस्तार
  choice: शांति की वाचा
  alternative: कल्याण की वाचा
  rationale: ‘शांति’ परिचित और अंतरपाठीय रूप से उपयुक्त है; पादटिप्पणी उसके व्यापक अर्थ—कुशलता, समग्रता और कल्याण—को सुरक्षित रखती है।
- issue: יְהוָה का निरूपण
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में प्रयुक्त व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसका सीधा लिप्यंतरण किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वाचा’ बाइबलीय संदर्भ में आवश्यक पारिभाषिक शब्द है। स्त्रीलिंग एकवचन संबोधन हिन्दी में अलग रूप से दिखाई नहीं देता, पर संदर्भ में संबोधित सिय्योन/यरूशलेम है।
