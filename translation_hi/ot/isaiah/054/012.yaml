base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/012.yaml
  text: And I will make your pinnacles of ruby[a], your gates of sparkling stone[d][c][b], and all your boundary walls of precious stones.
translation:
  language: hi
  text: मैं तेरे कंगूरों[a] को लाल दमकते रत्नों[b] से, तेरे फाटकों को अग्नि के समान चमकते पत्थरों[c] से, और तेरी सारी चारदीवारी[d] को बहुमूल्य पत्थरों से बनाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है; इसका अर्थ ‘झरोखे’ या ‘ऊपरी बुर्ज’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द संभवतः किसी लाल या बहुत चमकीले रत्न का नाम है; ‘माणिक्य’, ‘गार्नेट’ या ‘लाल सूर्यकांत’ जैसे अनुवाद भी संभव हैं।
    reason: lexical_alternative
  - marker: c
    text: मूल शब्द किसी चमकीले या अग्नि-जैसे दमकते रत्न को दर्शाता है; पुराने अनुवादों में इसे कभी-कभी ‘कार्बंकल’ कहा गया है।
    reason: lexical_alternative
  - marker: d
    text: शाब्दिक अर्थ ‘तेरी सारी सीमा’ है; इसका अर्थ ‘तेरे सारे सीमांत’ या ‘तेरा सारा क्षेत्र’ भी हो सकता है, किंतु यहाँ नगर-निर्माण का संदर्भ ‘चारदीवारी’ के पक्ष में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: मैं ... बनाऊँगा
  rationale: שׂוּם का मूल अर्थ ‘रखना/स्थापित करना’ है; नगर-निर्माण के इस संदर्भ में ‘बनाऊँगा’ स्वाभाविक रूप से निर्माण और सज्जा, दोनों का भाव व्यक्त करता है।
- source_word: שִׁמְשֹׁתַיִךְ
  choice: तेरे कंगूरों
  rationale: यह दुर्लभ स्थापत्य-संज्ञा है। फाटकों और नगर की सीमा के साथ आए संदर्भ में ‘कंगूरे’ ऊपरी सजावटी या रक्षात्मक संरचनाओं का उपयुक्त, किंतु जानबूझकर पूर्णतः निश्चित न किया गया, अर्थ देता है।
- source_word: כַּדְכֹד
  choice: लाल दमकते रत्नों
  rationale: रत्न की ठीक खनिज-पहचान अनिश्चित है, पर शब्द संभवतः लाल या अत्यंत चमकीले रत्न को सूचित करता है। वर्णनात्मक अनुवाद किसी एक आधुनिक रत्न-नाम पर अनावश्यक रूप से आग्रह नहीं करता।
- source_word: וּשְׁעָרַיִךְ
  choice: तेरे फाटकों
  rationale: नगर के संदर्भ में שַׁעַר का सामान्य और स्पष्ट अर्थ ‘फाटक’ है।
- source_word: לְאַבְנֵי אֶקְדָּח
  choice: अग्नि के समान चमकते पत्थरों से
  rationale: אֶקְדָּח किसी तेजस्वी या अग्नि-जैसे दमकते रत्न का संकेत देता है, जिसकी सटीक पहचान अनिश्चित है। यह वर्णन उसकी चमक बनाए रखता है।
- source_word: וְכָל גְּבוּלֵךְ
  choice: तेरी सारी चारदीवारी
  rationale: גְּבוּל का अर्थ सीमा, सीमांत क्षेत्र या प्रदेश हो सकता है। आसपास के स्थापत्य-बिंब के कारण यहाँ नगर को घेरने वाली संरचना के अर्थ में ‘चारदीवारी’ चुना गया है।
- source_word: לְאַבְנֵי חֵפֶץ
  choice: बहुमूल्य पत्थरों से
  rationale: חֵפֶץ चाह, प्रसन्नता और मूल्यवान होने का भाव रखता है; रत्नों के संदर्भ में ‘बहुमूल्य पत्थर’ इसका सहज हिन्दी रूप है।
