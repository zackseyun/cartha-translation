  rationale: The revision aligns the rendering of the Tetragrammaton with the specified POB choice, ‘Yahweh,’ and makes the fixed Isaianic title ‘Holy One of Israel’ unmistakably divine in natural modern Hindi. The footnote on the plural participial forms is retained but made more precise about the interpretive basis for the singular Hindi rendering. The imperfect’s present/future ambiguity remains preserved in footnote b.
