id: ISA.54.5
reference: Isaiah 54:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י בֹעֲלַ֨יִ/ךְ֙ עֹשַׂ֔יִ/ךְ יְהוָ֥ה צְבָא֖וֹת שְׁמ֑/וֹ וְ/גֹֽאֲלֵ/ךְ֙ קְד֣וֹשׁ יִשְׂרָאֵ֔ל אֱלֹהֵ֥י כָל הָ/אָ֖רֶץ יִקָּרֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/005.yaml
  text: For your husband is your Maker[a]; Yahweh of Armies is his name. And your Redeemer is the Holy One of Israel[b]; he is called the God of all the earth.
translation:
  language: hi
  text: क्योंकि तेरा पति तेरा रचनेवाला है[a]—उसका नाम सेनाओं का याहवे है—और तेरा छुड़ानेवाला इस्राएल का पवित्र परमेश्वर है; वह सारी पृथ्वी का परमेश्वर कहलाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में ‘पति’ और ‘रचनेवाला’ के रूप बहुवचन हैं, पर ‘उसका नाम’ एकवचन है; इस संदर्भ में उन्हें सम्मानसूचक या तीव्रतासूचक बहुवचन मानकर एकवचन में अनुवाद किया गया है।
    reason: grammatical_ambiguity
  - marker: b
    text: या, “वह सारी पृथ्वी का परमेश्वर कहलाएगा।”
    reason: tense_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले आश्वासन का आधार बताता है; हिन्दी में ‘क्योंकि’ उसके व्याख्यात्मक संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: בֹעֲלַיִךְ
  choice: तेरा पति
  rationale: सिय्योन को स्त्री के रूप में संबोधित किए जाने के कारण यहाँ वैवाहिक अर्थ प्रमुख है; ‘स्वामी’ कहने से मूल रूपक धुँधला पड़ जाता।
- source_word: עֹשַׂיִךְ
  choice: तेरा रचनेवाला
  rationale: यह participial divine title है। ‘रचनेवाला’ साधारण आधुनिक हिन्दी में स्पष्ट है और वैवाहिक उपमा के साथ पद का संबंध बनाए रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को ‘यहोवा’ के रूप में रखा गया है और צְבָאוֹת का पारदर्शी अर्थ ‘सेनाओं’ दिया गया है; पारंपरिक ‘सेनाओं का प्रभु’ नाम को उपाधि से बदल देता।
- source_word: וְגֹאֲלֵךְ
  choice: और तेरा छुड़ानेवाला
  rationale: גאל में निकट संबंधी द्वारा छुड़ाने की पृष्ठभूमि हो सकती है, पर इस पद में उसे विशेष रूप से ‘कुटुम्बी-छुड़ानेवाला’ कहना आवश्यकता से अधिक स्पष्ट करना होगा।
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: इस्राएल का पवित्र जन
  rationale: यशायाह की विशिष्ट ईश्वरीय उपाधि को निकट और सुबोध रूप में सुरक्षित रखा गया है।
- source_word: אֱלֹהֵי כָל־הָאָרֶץ
  choice: सारी पृथ्वी का परमेश्वर
  rationale: यह पद उसकी सार्वभौमिक प्रभुता व्यक्त करता है; ‘सारी पृथ्वी’ כָל־הָאָרֶץ की व्यापकता को स्वाभाविक हिन्दी में रखता है।
- source_word: יִקָּרֵא
  choice: कहलाता है
  rationale: निफ़अल imperfect यहाँ सामान्यतः मान्य पहचान के वर्तमान कथन के रूप में समझा जा सकता है। भविष्यकाल भी व्याकरणतः संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: सिय्योन और परमेश्वर के संबंध की वैवाहिक उपमा
  choice: ‘तेरा पति तेरा रचनेवाला है’ कहकर उपमा स्पष्ट रखी गई।
  alternative: ‘तेरा स्वामी तेरा रचनेवाला है।’
  rationale: स्त्रीलिंग संबोधन और प्रसंग בעל के वैवाहिक अर्थ का समर्थन करते हैं। इसे ‘स्वामी’ करना मूल के संबंधपरक और वाचागत तनाव को कम कर देता।
- issue: יְהוָה צְבָאוֹת का अनुवाद
  choice: सेनाओं का यहोवा
  alternative: सेनाओं का प्रभु / सेनाओं का याहवे
  rationale: यह चयन ईश्वरीय व्यक्तिगत नाम और צְבָאוֹת की सैन्य/समूहगत शक्ति—दोनों को खुलकर व्यक्त करता है, बिना पारंपरिक प्रतिस्थापन को मूल नाम मान लेने के।
- issue: יִקָּרֵא का कालगत अर्थ
  choice: वह … कहलाता है
  alternative: वह … कहलाएगा
  rationale: संदर्भ में यह परमेश्वर की सार्वभौमिक पहचान का सामान्य कथन हो सकता है, पर हिब्रू imperfect भविष्य अर्थ की संभावना भी खुली रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधे संबोधन वाली रखी गई है। सिय्योन के लिए एकवचन स्त्रीलिंग ‘तेरा’ मूल संबोधन को सुरक्षित रखता है। लंबे उपाधि-क्रम की काव्यात्मक गंभीरता बनाए रखने के लिए डैश और अर्धविराम का प्रयोग किया गया है।
