  edition: WLC
  text: הֵ֣ן גּ֥וֹר יָג֛וּר אֶ֖פֶס מֵֽ/אוֹתִ֑/י מִי גָ֥ר אִתָּ֖/ךְ עָלַ֥יִ/ךְ יִפּֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/015.yaml
  text: Look[a], if anyone stirs up strife, it is not from me[c][b]; whoever stirs up strife with you will fall before you.
translation:
  language: hi
  text: देखो[a], यदि कोई सचमुच तुम्हारे विरुद्ध इकट्ठा हो, तो वह मेरी ओर से नहीं होगा[b]; जो कोई तुम्हारे विरुद्ध इकट्ठा होगा, वह तुम्हारे कारण गिर पड़ेगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निश्चय ही’; इब्रानी शब्द कथन पर बल देने या ध्यान खींचने के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरे द्वारा नहीं’ अथवा ‘मुझसे अलग’।
    reason: lexical_alternative
  - marker: c
    text: अधिक शाब्दिक रूप से ‘तुम पर गिर पड़ेगा’; इसका अर्थ ‘तुम्हारे सामने गिर पड़ेगा’ भी हो सकता है। प्रसंग विरोधी की पराजय की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह शब्द ध्यान खींचते हुए कथन पर बल देता है; ‘देखो’ आधुनिक और स्वाभाविक हिन्दी में इसका संकेतात्मक बल बनाए रखता है।
- source_word: גּוֹר יָגוּר
  choice: इकट्ठा होकर चढ़ आए
  rationale: धातु גור यहाँ विरोधी जमाव या आक्रमण के भाव में है। क्रिया की पुनरुक्त संरचना बल देती है; हिन्दी वाक्यांश शत्रुतापूर्ण एकत्रीकरण को व्यक्त करता है, बिना उसे केवल सामान्य निवास मानने के।
- source_word: אֶפֶס מֵאוֹתִי
  choice: यह मेरी ओर से नहीं होगा
  rationale: यह वाक्यांश विरोधी कार्रवाई के स्रोत या अनुमोदन के रूप में याहवे का निषेध करता है। ‘मेरी ओर से नहीं’ स्रोत और अधिकार—दोनों की सम्भावना खुली रखता है।
- source_word: מִי
  choice: जो कोई
  rationale: यहाँ प्रश्नवाचक सर्वनाम अनिश्चित सम्बन्धवाचक अर्थ में प्रयुक्त है; ‘जो कोई’ उस व्यापक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גָר אִתָּךְ
  choice: तुम्हारे विरुद्ध इकट्ठा होगा
  rationale: אִתָּךְ का शाब्दिक अर्थ ‘तुम्हारे साथ’ है, पर प्रसंग में सम्बन्ध विरोधी है। हिन्दी में ‘तुम्हारे विरुद्ध’ आशय स्पष्ट करता है और גור की पहले वाली अभिव्यक्ति से संगति रखता है।
- source_word: עָלַיִךְ יִפּוֹל
  choice: तुम्हारे कारण गिर पड़ेगा
  rationale: נפל עם על यहाँ कई प्रकार से समझा जा सकता है—‘तुम पर’, ‘तुम्हारे सामने’ या ‘तुम्हारे कारण’। निकटवर्ती प्रसंग हमलावर की पराजय बताता है; ‘तुम्हारे कारण गिर पड़ेगा’ सम्बन्ध को बनाए रखते हुए सफल आक्रमण का भ्रामक अर्थ टालता है।
theological_decisions:
- issue: क्या सिय्योन के विरुद्ध शत्रुतापूर्ण जमाव परमेश्वर की ओर से नियुक्त बताया गया है
  choice: पाठ स्पष्ट रूप से कहता है कि ऐसा विरोध परमेश्वर की ओर से नहीं है और विरोधी के पतन की घोषणा करता है।
  alternative: ‘मेरी ओर से नहीं’ को केवल ‘मेरी सहायता से नहीं’ समझा जा सकता है; अंतिम पदबंध को अधिक शाब्दिक रूप से ‘तुम पर गिरेगा’ भी पढ़ा जा सकता है।
  rationale: यशायाह 54:14 और 54:17 का प्रसंग सुरक्षा और निर्दोष ठहराए जाने पर बल देता है। फिर भी मूल वाक्यांशों की अर्थ-सीमा पादटिप्पणियों में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। स्त्रीलिंग एकवचन सम्बोधन (सिय्योन/यरूशलेम) हिन्दी में ‘तुम’ से स्वाभाविक रूप से व्यक्त है। मुख्य पाठ में शत्रुतापूर्ण जमाव को स्पष्ट किया गया है, जबकि विवादित अंतिम पदबंध की वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
