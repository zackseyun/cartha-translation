source:
  edition: WLC
  text: עֲנִיָּ֥ה סֹעֲרָ֖ה לֹ֣א נֻחָ֑מָה הִנֵּ֨ה אָנֹכִ֜י מַרְבִּ֤יץ בַּ/פּוּךְ֙ אֲבָנַ֔יִ/ךְ וִ/יסַדְתִּ֖י/ךְ בַּ/סַּפִּירִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/011.yaml
  text: O afflicted one[a], storm-tossed and not comforted, behold[b], I am setting your stones in antimony and laying your foundations with sapphires.
translation:
  language: hi
  text: हे दुःख की मारी, आँधी से झकझोरी हुई और सांत्वना से वंचित, देख, मैं तेरे पत्थर सुरमे[a] में जड़ रहा हूँ और तेरी नींव नीलमों[b] से डाल रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सुरमा’ से आशय एंटिमनी नामक काले खनिज से है। यहाँ संभवतः पत्थरों को उभारने वाला गहरा गारा या सजावटी जड़ाई-पदार्थ अभिप्रेत है।
    reason: cultural_note
  - marker: b
    text: या ‘लाजवर्दों’; जिस इब्रानी शब्द का अनुवाद परंपरागत रूप से ‘नीलम’ किया जाता है, वह संभवतः आधुनिक नीलम से भिन्न कोई नीला बहुमूल्य पत्थर था।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנִיָּה
  choice: हे दुःख की मारी
  rationale: स्त्रीलिंग एकवचन संबोधन सिय्योन/यरूशलेम के मानवीकरण के अनुकूल है। यह प्रयोग दुःख और विपत्ति का भाव रखता है, पर अर्थ को केवल आर्थिक निर्धनता या उत्पीड़न तक सीमित नहीं करता।
- source_word: סֹעֲרָה
  choice: आँधी से झकझोरी हुई
  rationale: यह रूप आँधी से लगातार चोट खाने या उछाले जाने का सजीव बिंब देता है। आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: לֹא נֻחָמָה
  choice: सांत्वना से वंचित
  rationale: इब्रानी निषेध और निष्क्रिय भाव को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है; आशय है कि उसे सांत्वना नहीं मिली।
- source_word: הִנֵּה
  choice: देख
  rationale: यह दैवी घोषणा की ओर ध्यान खींचता है और आधुनिक हिन्दी में भविष्यद्वाणी की गंभीरता बनाए रखता है।
- source_word: מַרְבִּיץ
  choice: जड़ रहा हूँ
  rationale: निर्माण के इस संदर्भ में क्रिया पत्थरों को सजावटी पदार्थ में बैठाने का संकेत देती है। वर्तमान प्रगतिशील रूप निकट और सजीव दैवी कार्य को प्रकट करता है।
- source_word: בַּפּוּךְ
  choice: सुरमे में
  rationale: פּוּךְ सामान्यतः काले प्रसाधन-खनिज, विशेषतः एंटिमनी से बने सुरमे, को दर्शाता है। ‘सुरमा’ हिन्दी पाठक के लिए ठोस और परिचित शब्द है, जबकि निर्माण में उसकी ठीक भूमिका को पादटिप्पणी में खुला रखा गया है।
- source_word: אֲבָנַיִךְ
  choice: तेरे पत्थर
  rationale: साधारण वास्तु-संबंधी अर्थ को बनाए रखता है और पत्थरों को अनावश्यक रूप से रत्न नहीं बनाता।
- source_word: וִיסַדְתִּיךְ
  choice: तेरी नींव ... डाल रहा हूँ
  rationale: יסד का आशय स्थापित करना या नींव डालना है। हिन्दी वास्तु-प्रयोग में स्पष्ट संज्ञा ‘नींव’ स्वाभाविक है और स्त्रीलिंग संबोधित नगरी के निर्माण-बिंब को स्पष्ट रखती है।
- source_word: בַּסַּפִּירִים
  choice: नीलमों से
  rationale: ‘नीलम’ पारंपरिक और सहज हिन्दी समतुल्य है। प्राचीन खनिज की सटीक पहचान अनिश्चित होने के कारण लाजवर्द की संभावना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: संबोधित पात्र की पहचान
  choice: स्त्रीलिंग में मानवीकृत सिय्योन/यरूशलेम को दुःख की मारी के रूप में संबोधन
  alternative: कोई सामान्य पीड़ित स्त्री अथवा अधिक अमूर्त रूप में वाचा-समुदाय
  rationale: स्त्रीलिंग एकवचन रूप और यशायाह 54 का निकट संदर्भ मानवीकृत सिय्योन/यरूशलेम का समर्थन करते हैं। अनुवाद स्त्रीलिंग संबोधन और नगरी के निर्माण-बिंब को रखता है, पर उससे आगे कोई विशिष्ट सामुदायिक या कलीसियाई पहचान आरोपित नहीं करता।
- issue: पुनर्स्थापना के निर्माण-बिंब की प्रकृति
  choice: पत्थरों को सुरमे में जड़ने और नीलमों से नींव डालने का ठोस, काव्यात्मक चित्र
  alternative: इसे केवल आध्यात्मिक समृद्धि या किसी विशिष्ट भविष्यकालीन भवन का प्रत्यक्ष वर्णन मानना
  rationale: मूल पाठ भव्य पुनर्निर्माण का रूपक प्रस्तुत करता है, पर उसका धर्मवैज्ञानिक अनुप्रयोग इस पद में स्वयं पूरी तरह परिभाषित नहीं करता। इसलिए ठोस बिंब को बिना सिद्धान्तगत विस्तार के सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। स्त्रीलिंग संबोधन से मानवीकृत नगरी का भाव बना रहता है। ‘आँधी से झकझोरी हुई’ विनाश की तीव्रता व्यक्त करता है, जबकि ‘जड़ रहा हूँ’ और ‘नींव ... डाल रहा हूँ’ पुनर्निर्माण को सजीव और निकट कार्य के रूप में प्रस्तुत करते हैं।
