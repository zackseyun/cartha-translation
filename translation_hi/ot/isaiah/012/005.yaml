source:
  edition: WLC
  text: זַמְּר֣וּ יְהוָ֔ה כִּ֥י גֵא֖וּת עָשָׂ֑ה מידעת זֹ֖את בְּ/כָל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/005.yaml
  text: Sing praise to Yahweh[a], for he has done gloriously; let this be made known in all the earth.
translation:
  language: hi
  text: याहवेह का स्तुतिगान करो, क्योंकि उसने प्रतापपूर्ण काम किया है[a]; यह बात सारी पृथ्वी पर जानी जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने अपना प्रताप दिखाया है” अथवा “उसने उत्कृष्ट कार्य किए हैं।”
    reason: גֵאוּת के अर्थ में प्रताप, महिमा और उत्कृष्टता के निकटवर्ती भाव संभव हैं; עָשָׂה के साथ हिन्दी में एक से अधिक स्वाभाविक रूप बनते हैं।
lexical_decisions:
- source_word: זַמְּרוּ
  choice: स्तुति में गाओ
  rationale: पिएल बहुवचन आज्ञार्थक संगीत के साथ प्रशंसा करने का आह्वान है। यह प्रयोग ‘गाओ’ और स्तुतिपरक भाव, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवेह
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले आह्वान का कारण प्रस्तुत करता है।
- source_word: גֵאוּת עָשָׂה
  choice: उसने प्रतापमय कार्य किया है
  rationale: גֵאוּת ऊँचाई, महिमा, प्रताप या उत्कृष्टता का अमूर्त भाव देता है; עָשָׂה के साथ यह परमेश्वर के प्रताप प्रकट करने वाले कार्य को सूचित करता है। हिन्दी में यह वाक्यांश स्वाभाविक रहते हुए स्रोत की अर्थ-सीमा बनाए रखता है।
- source_word: מידעת זֹאת
  choice: यह बात ... जानी जाए
  rationale: संदर्भ में यह निष्क्रिय आज्ञार्थक/कामनार्थक आह्वान है। ‘यह बात’ पिछले उपवाक्य में बताए गए कार्य की ओर संकेत करती है।
- source_word: בְּכָל הָאָרֶץ
  choice: सारी पृथ्वी पर
  rationale: भजन का आह्वान सार्वभौमिक है; यहाँ הָאָרֶץ को केवल किसी स्थानीय ‘देश’ के बजाय पूरी पृथ्वी के अर्थ में लेना उपयुक्त है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवेह
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। उसका लिप्यंतरण नाम और उपाधि के बीच का भेद सुरक्षित रखता है।
- issue: גֵאוּת עָשָׂה का अर्थ
  choice: उसने प्रतापमय कार्य किया है
  alternative: उसने अपना प्रताप दिखाया है / उसने उत्कृष्ट कार्य किए हैं
  rationale: मूल का एकवचन अमूर्त संज्ञा-प्रयोग प्रताप, महिमा और उत्कृष्टता के बीच अर्थगत तनाव रखता है। मुख्य पाठ कार्य का भाव व्यक्त करता है, जबकि पादटिप्पणी निकटवर्ती विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामूहिक आराधना के अनुकूल रूप। ‘जानी जाए’ स्रोत के निष्क्रिय आह्वान को बनाए रखता है; ‘सारी पृथ्वी पर’ सार्वभौमिक विस्तार को स्पष्ट करता है।
