  edition: WLC
  text: וּ/שְׁאַבְתֶּם מַ֖יִם בְּ/שָׂשׂ֑וֹן מִ/מַּעַיְנֵ֖י הַ/יְשׁוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/003.yaml
  text: With joy you will draw water from the springs of salvation[a][b].
translation:
  language: hi
  text: तुम आनन्द के साथ उद्धार के सोतों से पानी भरोगे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उद्धार के झरनों से’ अथवा ‘उद्धार के जलस्रोतों से’।
    reason: lexical_alternative
  - marker: b
    text: इस प्रसंग में ‘उद्धार’ का अनुवाद ‘छुटकारा’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁאַבְתֶּם
  choice: तुम ... भरोगे
  rationale: संयोजक वाव सहित काल रूप भविष्यसूचक प्रसंग में भविष्य का भाव देता है। हिन्दी में पद के आरम्भ में ‘और’ अनिवार्य नहीं है; पानी के संदर्भ में ‘भरोगे’ स्वाभाविक रूप से खींचकर लेने का भाव व्यक्त करता है।
- source_word: מַיִם
  choice: पानी
  rationale: यह बहुवचन रूप यहाँ द्रव्यवाचक संज्ञा है; आधुनिक सामान्य हिन्दी में ‘पानी’ सहज और स्पष्ट है।
- source_word: בְּ/שָׂשׂוֹן
  choice: आनन्द के साथ
  rationale: पूर्वसर्ग और संज्ञा के मूर्त रूप को रखते हुए रीति अथवा परिस्थिति का अर्थ स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: מִ/מַּעַיְנֵי
  choice: सोतों से
  rationale: מַעְיָן प्रायः प्राकृतिक जलस्रोत, अर्थात सोता या झरना, दर्शाता है। ‘सोतों’ से मूल बिम्ब और बहुवचन दोनों सुरक्षित रहते हैं।
- source_word: הַ/יְשׁוּעָה
  choice: उद्धार के
  rationale: יְשׁוּעָה बचाव, छुटकारे या उद्धार को व्यक्त करता है। ‘उद्धार’ तत्काल बचाए जाने और यशायाह की व्यापक धर्मवैचारिक प्रतिध्वनि दोनों को बनाए रखता है।
theological_decisions:
- issue: יְשׁוּעָה को केवल ऐतिहासिक ‘छुटकारा’ माना जाए या व्यापक ‘उद्धार’ के रूप में अनूदित किया जाए
  choice: उद्धार
  alternative: छुटकारा
  rationale: यशायाह 12 का प्रसंग परमेश्वर के बचाने के कार्य का उत्सव मनाता है। ‘उद्धार’ इब्रानी शब्द की व्यापकता और धर्मवैचारिक तनाव बनाए रखता है, पर बाद की किसी विशिष्ट धर्मसैद्धान्तिक व्याख्या को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किन्तु गरिमापूर्ण। ‘आनन्द’ और ‘उद्धार’ बाइबलीय संदर्भ में परिचित हैं; ‘सोतों’ प्राकृतिक जलस्रोत के काव्यात्मक बिम्ब को संक्षेप में सुरक्षित रखता है।
