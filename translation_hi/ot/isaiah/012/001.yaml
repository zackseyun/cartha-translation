source:
  edition: WLC
  text: וְ/אָֽמַרְתָּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא אוֹדְ/ךָ֣ יְהוָ֔ה כִּ֥י אָנַ֖פְתָּ בִּ֑/י יָשֹׁ֥ב אַפְּ/ךָ֖ וּֽ/תְנַחֲמֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/001.yaml
  text: And you will say in that day[a], “I will praise you, O Yahweh, for though you were angry with me, your anger has turned away[b], and you comfort me.”
translation:
  language: hi
  text: उस दिन तुम कहोगे, “हे याहवे, मैं तेरी स्तुति करूँगा[a]। यद्यपि तू मुझ पर क्रोधित था, फिर भी तेरा क्रोध दूर हो गया[b], और तू मुझे सांत्वना देता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तेरा धन्यवाद करूँगा।” इब्रानी क्रिया स्तुति करने और धन्यवाद देने—दोनों अर्थ रख सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तेरा क्रोध पीछे मुड़ गया।” इब्रानी में ‘नाक’ क्रोध के लिए प्रयुक्त मुहावरा है। इब्रानी क्रियारूप का अर्थ “तेरा क्रोध मुड़ जाए” भी समझा जा सकता है।
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: तुम कहोगे
  rationale: भविष्यसूचक कथन में संयोजक सहित पूर्ण क्रिया आगामी प्रतिक्रिया को व्यक्त करती है; आधुनिक हिन्दी में ‘तुम कहोगे’ स्वाभाविक है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यसूचक समय-सूचक पद का सीधा और प्रचलित हिन्दी रूप है।
- source_word: אוֹדְךָ
  choice: मैं तेरी स्तुति करूँगा
  rationale: हिफ़ील रूप ידה आराधना के संदर्भ में स्तुति करने अथवा धन्यवाद देने दोनों अर्थ रख सकता है; यहाँ उद्धार के बाद का आराधनात्मक स्वर ‘स्तुति’ के अनुकूल है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का लिप्यंतरण किया गया है, किसी उपाधि से प्रतिस्थापित नहीं।
- source_word: כִּי אָנַפְתָּ בִּי
  choice: यद्यपि तू मुझ पर क्रोधित था
  rationale: כִּי स्वयं कारणसूचक भी हो सकता है, पर अगले वाक्यों में क्रोध के हटने और सांत्वना मिलने से यहाँ संदर्भगत रियायती भाव उभरता है।
- source_word: יָשֹׁב אַפְּךָ
  choice: तेरा क्रोध दूर हो गया
  rationale: אַף का शाब्दिक अर्थ ‘नाक’ है, पर यहाँ यह क्रोध का इब्रानी मुहावरा है; שׁוב का ‘लौटना/पीछे हटना’ भाव स्वाभाविक हिन्दी में ‘दूर हो गया’ से व्यक्त होता है।
- source_word: וּתְנַחֲמֵנִי
  choice: और तू मुझे सांत्वना देता है
  rationale: पिएल נחם का अर्थ सांत्वना देना है। वर्तमानकालीन हिन्दी क्रोध हटने के बाद जारी अनुग्रहपूर्ण स्थिति को व्यक्त करती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम स्पष्ट रूप से है; लिप्यंतरण उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: כִּי वाले उपवाक्य का संबंध
  choice: यद्यपि तू मुझ पर क्रोधित था
  alternative: क्योंकि तू मुझ पर क्रोधित था
  rationale: व्याकरणतः कारणसूचक अर्थ संभव है, किंतु क्रोध के दूर होने और सांत्वना मिलने का क्रम रियायती अर्थ को अधिक स्वाभाविक बनाता है।
- issue: יָשֹׁב और וּתְנַחֲמֵנִי का काल/भाव
  choice: क्रोध के हट जाने और वर्तमान सांत्वना के रूप में
  alternative: ‘तेरा क्रोध लौट जाए और तू मुझे सांत्वना दे’—कामनासूचक भाव
  rationale: इब्रानी अपूर्ण क्रियारूप भविष्य, जारी परिणाम या प्रसंगानुसार कामना व्यक्त कर सकते हैं। स्तुति-गीत का संदर्भ इन्हें अनुभूत उद्धार के परिणाम के रूप में पढ़ने का समर्थन करता है, जबकि वैकल्पिक संभावना पाद-टिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। एकवचन संबोधन के लिए परमेश्वर के प्रति पारंपरिक निकटता दर्शाने वाला ‘तू/तेरी’ रखा गया है; वक्ता को ‘तुम’ कहा गया है, जिससे इब्रानी एकवचन संबोधन बिना अनावश्यक लिंग-चिह्न के स्पष्ट रहता है।
