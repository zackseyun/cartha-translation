id: ISA.12.2
reference: Isaiah 12:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִנֵּ֨ה אֵ֧ל יְשׁוּעָתִ֛/י אֶבְטַ֖ח וְ/לֹ֣א אֶפְחָ֑ד כִּֽי עָזִּ֤/י וְ/זִמְרָת֙ יָ֣הּ יְהוָ֔ה וַֽ/יְהִי לִ֖/י לִֽ/ישׁוּעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/002.yaml
  text: Behold[a], God is my salvation; I will trust and not be afraid, for Yah, Yahweh, is my strength and song[b], and he has become my salvation.
translation:
  language: hi
  text: देखो, परमेश्वर मेरा उद्धार है; मैं भरोसा करूँगा और नहीं डरूँगा, क्योंकि याह, याहवेह[a], मेरा बल और मेरा गीत है[b], और वह मेरा उद्धार बन गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में “याह, याहवेह” (יָהּ יְהוָה) है—ईश्वरीय नाम का संक्षिप्त रूप और पूरा रूप साथ रखकर बनाया गया एक काव्यात्मक जोर।
    reason: alternative_reading
  - marker: b
    text: यह पंक्ति निर्गमन 15:2 से लगभग शब्दशः मेल खाती है।
    reason: cross_reference
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला काव्यात्मक उद्गार है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसके जोर को बनाए रखता है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यह परमेश्वर के लिए प्रयुक्त सामान्य काव्यात्मक पद है; यहाँ ‘परमेश्वर’ स्वाभाविक है और मूल से अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: יְשׁוּעָתִי / לִישׁוּעָה
  choice: मेरा उद्धार
  rationale: दोनों स्थानों पर एक ही मूल संज्ञा की पुनरावृत्ति है। ‘उद्धार’ उसके व्यापक अर्थ और पद की आरंभ-अंत संरचना को सुरक्षित रखता है।
- source_word: אֶבְטַח
  choice: मैं भरोसा रखूँगा
  rationale: प्रथम पुरुष अपूर्ण क्रिया यहाँ दृढ़ संकल्प और भविष्यगत विश्वास व्यक्त करती है।
- source_word: וְלֹא אֶפְחָד
  choice: और नहीं डरूँगा
  rationale: नकारात्मक अपूर्ण क्रिया का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: עָזִּי וְזִמְרָת
  choice: मेरा बल और मेरा गीत
  rationale: ‘बल’ और ‘गीत’ सीधे अर्थों को तथा निर्गमन 15:2 की काव्यात्मक प्रतिध्वनि को बनाए रखते हैं। हिन्दी में स्पष्टता के लिए संबंधसूचक ‘मेरा’ दोनों संज्ञाओं के साथ रखा गया है।
- source_word: יָהּ יְהוָה
  choice: याह, यहोवा
  rationale: दोनों निकटवर्ती ईश्वरीय नामों को अलग-अलग सुरक्षित रखा गया है, जिससे मूल का असामान्य काव्यात्मक जोर मिटता नहीं।
- source_word: וַיְהִי לִי לִישׁוּעָה
  choice: और वह मेरा उद्धार बन गया है
  rationale: यह परिणामस्वरूप अनुभव को स्वाभाविक हिन्दी में व्यक्त करता है और आरंभ में आए ‘मेरा उद्धार’ को दोहराता है।
theological_decisions:
- issue: יָהּ יְהוָה में दोहरे ईश्वरीय नाम का अनुवाद
  choice: याह, यहोवा
  alternative: प्रभु, स्वयं प्रभु
  rationale: लिप्यंतरण मूल के दो अलग किंतु संबंधित नाम-रूपों और उनके काव्यात्मक तनाव को सीधे सुरक्षित रखता है; व्याख्यात्मक पुनरुक्ति जोड़ने से बचा गया है।
- issue: יְשׁוּעָה का अर्थ
  choice: उद्धार
  alternative: छुटकारा
  rationale: ‘उद्धार’ यहाँ व्यक्तिगत और सामुदायिक मुक्ति दोनों की अर्थ-सम्भावना खुली रखता है और पद में हुई पुनरावृत्ति को समान शब्द से दर्शाता है।
- issue: निर्गमन 15:2 की प्रतिध्वनि
  choice: ‘मेरा बल और मेरा गीत’ तथा ‘मेरा उद्धार’ को बनाए रखना
  alternative: ‘मेरी सामर्थ्य और मेरी स्तुति’ जैसे व्याख्यात्मक शब्द
  rationale: निकट शाब्दिक समानता को बनाए रखने से अंतरपाठीय संबंध स्पष्ट रहता है, बिना उसका धर्मवैज्ञानिक अर्थ पहले से निर्धारित किए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य की काव्यात्मक समानांतरता, ईश्वरीय नामों की असामान्य जोड़ी और ‘मेरा उद्धार’ की पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है।
