base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/004.yaml
  text: 'And you will say on that day: “Give thanks to Yahweh[a]; call on his name. Make his deeds known among the peoples[b]; proclaim that his name is exalted.”'
translation:
  language: hi
  text: 'उस दिन तुम कहोगे: “याहवे[a] को धन्यवाद दो; उसका नाम लेकर पुकारो। लोगों के बीच उसके कामों को ज्ञात कराओ; घोषणा करो कि उसका नाम ऊँचा है[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘याहवे’ इब्रानी दिव्य नाम יהוה (YHWH) का एक रूप है; अनेक परंपराओं में इस नाम के स्थान पर ‘प्रभु’ लिखा या पढ़ा जाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “घोषणा करो, क्योंकि उसका नाम ऊँचा है।” इब्रानी शब्द כִּי घोषणा की विषय-वस्तु (‘कि’) अथवा उसका कारण (‘क्योंकि’) बता सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: तुम कहोगे
  rationale: द्वितीय पुरुष बहुवचन और भविष्यसूचक प्रसंग को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; आरम्भ का ‘उस दिन’ क्रम-संबंध को पर्याप्त रूप से स्पष्ट करता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: भविष्यसूचक साहित्य के मानक काल-सूचक पद का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: הוֹדוּ לַיהוָה
  choice: याहवे को धन्यवाद दो
  rationale: ידה के हिफ़ील बहुवचन आदेश में धन्यवाद और स्तुति का भाव है; ‘धन्यवाद दो’ यहाँ उसके सामान्य उपासना-संबंधी अर्थ को स्पष्ट रखता है।
- source_word: יהוה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम को मुख्य पाठ में नाम के रूप में सुरक्षित रखा गया है; प्रचलित वैकल्पिक परंपरा पादटिप्पणी में दी गई है।
- source_word: קִרְאוּ בִשְׁמוֹ
  choice: उसका नाम लेकर पुकारो
  rationale: किसी के नाम से उसका आह्वान करने के इब्रानी मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है और इसे केवल ‘नाम की घोषणा’ तक सीमित नहीं करता।
- source_word: הוֹדִיעוּ
  choice: प्रकट करो
  rationale: ידע के हिफ़ील आदेश का मूल भाव ‘ज्ञात कराना’ है; ‘प्रकट करो’ सार्वजनिक रूप से बताने का आशय सहजता से देता है।
- source_word: בָעַמִּים
  choice: देश-देश के लोगों के बीच
  rationale: बहुवचन עמים और בְּ के ‘बीच/में’ भाव को आधुनिक हिन्दी में व्यक्त करता है तथा ‘जाति’ शब्द से पैदा हो सकने वाले जाति-व्यवस्था संबंधी भ्रम से बचता है।
- source_word: עֲלִילֹתָיו
  choice: उसके कामों
  rationale: यह शब्द परमेश्वर के उल्लेखनीय कार्यों को दर्शाता है; ‘कामों’ में मूल की व्यापकता बनी रहती है और ‘सामर्थी कार्य’ जैसा अतिरिक्त विशेषण नहीं जुड़ता।
- source_word: הַזְכִּירוּ
  choice: घोषणा करो
  rationale: זכר के हिफ़ील का शाब्दिक भाव स्मरण कराना या उल्लेख करना है; इस काव्यात्मक सार्वजनिक आह्वान में ‘घोषणा करो’ उसका संप्रेषणीय बल व्यक्त करता है।
- source_word: נִשְׂגָּב שְׁמוֹ
  choice: उसका नाम महान है
  rationale: נשגב ऊँचा, उदात्त या महान होने का भाव देता है; ‘महान’ आधुनिक हिन्दी में स्वाभाविक है और परमेश्वर के नाम की महिमा व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में विशिष्ट वाचा-नाम सीधे प्रयुक्त है। उसका लिप्यंतरण नाम की विशिष्टता को सुरक्षित रखता है; पाठकों को परिचित प्रतिनिधि रूप पादटिप्पणी में बताया गया है।
- issue: הַזְכִּירוּ के बाद כִּי का अर्थ-संबंध
  choice: 'विषयवाचक: ‘घोषणा करो कि उसका नाम महान है’'
  alternative: 'कारणवाचक: ‘घोषणा करो, क्योंकि उसका नाम महान है’'
  rationale: כִּי यहाँ घोषणा की विषय-वस्तु भी बता सकता है और घोषणा का कारण भी। मुख्य पाठ में स्वाभाविक विषयवाचक अर्थ रखा गया है, जबकि वास्तविक व्याकरणिक विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक उपासना में सहज पाठ योग्य रखी गई है। बहुवचन आदेशों के लिए परिचित ‘तुम’ रूप अपनाया गया है। छोटे वाक्य और समानांतर आज्ञाएँ मूल की काव्यात्मक गति बनाए रखते हैं।
