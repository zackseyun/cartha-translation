id: ISA.12.6
reference: Isaiah 12:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: צַהֲלִ֥י וָ/רֹ֖נִּי יוֹשֶׁ֣בֶת צִיּ֑וֹן כִּֽי גָד֥וֹל בְּ/קִרְבֵּ֖/ךְ קְד֥וֹשׁ יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/006.yaml
  text: Cry aloud and shout for joy[a], inhabitant of Zion[b], for great in your midst is the Holy One of Israel.
translation:
  language: hi
  text: हर्ष से पुकार और आनन्द से जयजयकार कर[a], हे सिय्योन-निवासिनी[b], क्योंकि तेरे बीच इस्राएल का पवित्र महान है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘हर्ष से पुकार और आनन्द से गा।’ दूसरा आदेश आनन्दपूर्ण जयकार के साथ-साथ उल्लासभरे गान का अर्थ भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘सिय्योन-निवासिनी’ स्त्रीलिंग एकवचन है; सिय्योन को स्त्री के रूप में मानवीकृत करके सीधे सम्बोधित किया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: צַהֲלִי
  choice: ऊँचे स्वर से पुकार
  rationale: यह स्त्रीलिंग एकवचन आज्ञार्थक रूप ऊँची और प्रबल हर्षध्वनि को व्यक्त करता है। यह अनुवाद उसकी मुखर तीव्रता बनाए रखता है और अगले समानांतर आदेश से उसका भेद भी रहने देता है।
- source_word: וָרֹנִּי
  choice: और आनन्द से जयजयकार कर
  rationale: רנן की ध्वनि आनन्द से भरी पुकार या गान—दोनों हो सकती है। ‘जयजयकार कर’ मुख्य पाठ में मुखर उल्लास को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि गाने की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: יוֹשֶׁבֶת צִיּוֹן
  choice: हे सिय्योन में रहनेवाली
  rationale: इब्रानी स्त्रीलिंग एकवचन कृदन्त है। ‘रहनेवाली’ सिय्योन को स्त्री के रूप में सीधे सम्बोधित किए जाने की काव्यात्मक छवि को बनाए रखता है; इसे बहुवचन समुदाय में नहीं बदलता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले दिए गए दोनों आदेशों का कारण प्रस्तुत करता है और आधुनिक हिन्दी में स्पष्ट तथा स्वाभाविक है।
- source_word: גָדוֹל
  choice: महान
  rationale: यह विधेय विशेषण इस्राएल के पवित्र का वर्णन करता है। ‘महान’ मूल अर्थ को रखता है और अर्थ को केवल सामर्थ्य तक सीमित नहीं करता।
- source_word: בְּקִרְבֵּךְ
  choice: तेरे बीच
  rationale: स्त्रीलिंग एकवचन प्रत्यय सीधे उसी मानवीकृत सिय्योन से सम्बद्ध है। ‘तेरे बीच’ स्थानगत अर्थ और एकवचन सम्बोधन दोनों बनाए रखता है।
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: इस्राएल का पवित्र
  rationale: यह यशायाह में बार-बार आनेवाली विशिष्ट ईश्वरीय उपाधि है। संज्ञा के रूप में प्रयुक्त ‘पवित्र’ मूल की संक्षिप्तता बनाए रखता है और ‘परमेश्वर’ या ‘प्रभु’ जैसे स्पष्टतः अनुपस्थित शब्द नहीं जोड़ता।
theological_decisions:
- issue: सिय्योन को स्त्रीलिंग एकवचन पात्र के रूप में सम्बोधन
  choice: ‘सिय्योन में रहनेवाली’ और ‘तेरे बीच’ द्वारा एकवचन प्रत्यक्ष सम्बोधन बनाए रखा गया
  alternative: ‘सिय्योन के निवासियो’ या ‘सिय्योन के लोगो’ के रूप में सामूहिक बहुवचन
  rationale: मूल पाठ में आज्ञार्थक क्रियाएँ, कृदन्त और सर्वनाम-सूचक प्रत्यय सभी स्त्रीलिंग एकवचन हैं। एकवचन रखने से सिय्योन के स्त्री-रूप मानवीकरण की काव्यात्मकता सुरक्षित रहती है।
- issue: यशायाह की ईश्वरीय उपाधि קְדוֹשׁ יִשְׂרָאֵל
  choice: ‘इस्राएल का पवित्र’
  alternative: ‘इस्राएल का पवित्र परमेश्वर’ या ‘इस्राएल का पवित्र प्रभु’
  rationale: चुना हुआ रूप उपाधि का शाब्दिक और पारदर्शी स्वरूप बनाए रखता है तथा मूल में न आए ईश्वरीय पदनाम को नहीं जोड़ता। सन्दर्भ में इसका ईश्वरीय संकेत स्पष्ट है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मुखर काव्यात्मक सम्बोधन के अनुरूप रखी गई है। ‘हे’ प्रत्यक्ष सम्बोधन को स्पष्ट करता है; ‘तेरे’ का प्रयोग आदरसूचक दूरी के बजाय मूल के एकवचन, निकट काव्यात्मक सम्बोधन को बचाता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
