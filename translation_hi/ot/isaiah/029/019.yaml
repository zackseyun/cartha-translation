  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יָסְפ֧וּ עֲנָוִ֛ים בַּֽ/יהוָ֖ה שִׂמְחָ֑ה וְ/אֶבְיוֹנֵ֣י אָדָ֔ם בִּ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל יָגִֽילוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/019.yaml
  text: The humble will again increase their joy in Yahweh[b][a], and the poor among mankind will rejoice in the Holy One of Israel.
translation:
  language: hi
  text: दीन लोग याहवे में अपना आनन्द फिर बढ़ाएँगे[a], और मनुष्यों में जो निर्धन हैं[b], वे इस्राएल के पवित्र में उल्लसित होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दीन लोग याहवे में फिर आनन्दित होंगे।” इब्रानी क्रिया का शाब्दिक अर्थ “और जोड़ेंगे/बढ़ाएँगे” है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मनुष्य के निर्धन।” यहाँ “मनुष्य” से आशय सामान्य रूप से मानवजाति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָסְפוּ ... שִׂמְחָה
  choice: अपना आनन्द फिर बढ़ाएँगे
  rationale: יָסַף का मूल भाव ‘और जोड़ना/बढ़ाना’ है। ‘फिर’ पुनरावृत्ति का भाव और ‘अपना’ स्वाभाविक हिन्दी वाक्य-विन्यास व्यक्त करता है, जबकि ‘आनन्द’ को पृथक संज्ञा के रूप में बनाए रखता है।
- source_word: עֲנָוִים
  choice: दीन लोग
  rationale: ‘दीन’ सामाजिक रूप से दबे या अभावग्रस्त होने के साथ नम्रता और परमेश्वर पर निर्भरता का भाव भी रख सकता है; यह समानांतर ‘निर्धन’ से जुड़ता है, पर उसी का पूर्ण पर्याय नहीं बनता।
- source_word: בַּיהוָה
  choice: याहवे में
  rationale: בְּ को आनन्द के आधार अथवा विषय के अर्थ में ‘में’ किया गया है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: וְאֶבְיוֹנֵי אָדָם
  choice: मनुष्यों में जो निर्धन हैं
  rationale: אֶבְיוֹן के लिए ‘निर्धन’ आर्थिक और सामाजिक अभाव को स्पष्ट करता है। אָדָם यहाँ समस्त मनुष्यों के लिए सामान्य अर्थ में है; ‘मनुष्यों में जो’ इस संबंध को सहज और समावेशी हिन्दी में व्यक्त करता है।
- source_word: בִּקְדוֹשׁ יִשְׂרָאֵל
  choice: इस्राएल के पवित्र परमेश्वर में
  rationale: यह यशायाह में प्रचलित दिव्य उपाधि ‘इस्राएल का पवित्र जन/पवित्र’ है। हिन्दी में ‘पवित्र परमेश्वर’ उपाधि के दिव्य संदर्भ को स्वाभाविक और स्पष्ट बनाता है; בְּ को पहले चरण के समान ‘में’ रखा गया है।
- source_word: יָגִילוּ
  choice: मगन होंगे
  rationale: גיל प्रबल और उल्लासपूर्ण आनन्द व्यक्त करता है। ‘मगन होंगे’ इसे पहले चरण के ‘आनन्द’ से शब्दगत भिन्नता रखते हुए सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: יהוה दिव्य नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत दिव्य नाम सीधे उपस्थित है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण हिन्दी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: קְדוֹשׁ יִשְׂרָאֵל की दिव्य उपाधि
  choice: इस्राएल के पवित्र परमेश्वर
  alternative: इस्राएल के पवित्र जन; इस्राएल के पवित्र
  rationale: ‘परमेश्वर’ मूल में अलग शब्द के रूप में नहीं है, पर हिन्दी में केवल ‘पवित्र जन’ किसी मनुष्य का संकेत दे सकता है। यह रूप उपाधि के स्पष्ट दिव्य संदर्भ को व्यक्त करता है, बिना उसकी इस्राएल-संबंधी पहचान मिटाए।
- issue: בְּ के द्वारा आनन्द का संबंध
  choice: में
  alternative: के कारण; के विषय में
  rationale: दोनों अर्धपंक्तियों में समान בְּ आनन्द के विषय, आधार या क्षेत्र को सूचित कर सकता है। ‘में’ इस व्यापकता और काव्यात्मक समानता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक किंतु सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। दोनों अर्धपंक्तियों की समान रचना और आनन्दसूचक शब्दों की भिन्नता बनाए रखी गई है।
