id: ISA.29.15
reference: Isaiah 29:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ה֛וֹי הַ/מַּעֲמִיקִ֥ים מֵֽ/יהוָ֖ה לַ/סְתִּ֣ר עֵצָ֑ה וְ/הָיָ֤ה בְ/מַחְשָׁךְ֙ מַֽעֲשֵׂי/הֶ֔ם וַ/יֹּ֣אמְר֔וּ מִ֥י רֹאֵ֖/נוּ וּ/מִ֥י יוֹדְעֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/015.yaml
  text: Woe to those who go deep to hide counsel from Yahweh[a], whose deeds are in darkness, and who say, “Who sees us[b], and who knows us?”
translation:
  language: hi
  text: हाय उन पर जो अपनी योजना याहवे[a] से छिपाने के लिए गहराई में उतरते हैं[b]! उनके काम अँधेरे में होते हैं, और वे कहते हैं, “कौन हमें देखता है और कौन हमें जानता है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम יהוה (याहवे) है।
    reason: divine_name
  - marker: b
    text: 'या: “जो अपनी योजना याहवे से छिपाने के लिए गहरा खोदते हैं।”'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
  choice: हाय उन पर
  rationale: यह भविष्यद्वाणी में निंदा और आने वाले न्याय की घोषणा है; ‘हाय उन पर’ आधुनिक हिन्दी में इसका प्रबल और स्वाभाविक रूप है।
- source_word: הַמַּעֲמִיקִים
  choice: गहराई में उतरते हैं
  rationale: क्रिया עמק की ‘गहरा करना/गहराई में जाना’ वाली छवि को बनाए रखते हुए यहाँ गुप्त रूप से योजना बनाने का संकेत दिया गया है।
- source_word: מֵיהוָה
  choice: याहवे से
  rationale: מִן यहाँ योजना को याहवे से छिपाने का भाव व्यक्त करता है; יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ से लिखा गया है।
- source_word: לַסְתִּר
  choice: छिपाने के लिए
  rationale: 'स्रोत का infinitive उद्देश्य बताता है: वे ऐसा अपनी योजना छिपाने के लिए करते हैं।'
- source_word: עֵצָה
  choice: योजना
  rationale: संदर्भ में यह परामर्श की अपेक्षा जान-बूझकर बनाई गई गुप्त योजना को दर्शाता है; ‘योजना’ साधारण हिन्दी में स्पष्ट है।
- source_word: בְמַחְשָׁךְ
  choice: अँधेरे में
  rationale: मूल की ठोस छवि को बनाए रखता है, जो गोपनीयता और नैतिक अंधकार दोनों का संकेत देती है।
- source_word: מַעֲשֵׂיהֶם
  choice: उनके काम
  rationale: מַעֲשִׂים के लिए स्वाभाविक हिन्दी है और संदर्भ में उनके किए हुए कार्यों को दर्शाता है।
- source_word: מִי רֹאֵנוּ
  choice: कौन हमें देखता है
  rationale: इब्रानी participle और बहुवचन कर्म-प्रत्यय का सीधा, संक्षिप्त रूप सुरक्षित रखा गया है।
- source_word: וּמִי יוֹדְעֵנוּ
  choice: और कौन हमें जानता है
  rationale: मूल की जान-बूझकर संक्षिप्त अभिव्यक्ति को रखा गया है; संदर्भ में इसका अर्थ उनके कार्यों से अवगत होना भी है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चार-अक्षरी व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: יֹדְעֵנוּ में ‘जानने’ का आशय
  choice: कौन हमें जानता है
  alternative: कौन जानता है कि हम क्या कर रहे हैं
  rationale: व्यापक आशय उनके गुप्त कामों की जानकारी है, पर मूल केवल ‘हमें जानता है’ कहता है; इसलिए उसकी संक्षिप्तता और अर्थगत तनाव को नहीं खोला गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘गहराई में उतरते हैं’ और ‘अँधेरे में’ जैसी मूल रूपक-छवियाँ सुरक्षित हैं, जबकि वाक्य-विन्यास स्वाभाविक हिन्दी के अनुसार बनाया गया है।
