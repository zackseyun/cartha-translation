source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֶל בֵּ֣ית יַֽעֲקֹ֔ב אֲשֶׁ֥ר פָּדָ֖ה אֶת אַבְרָהָ֑ם לֹֽא עַתָּ֤ה יֵבוֹשׁ֙ יַֽעֲקֹ֔ב וְ/לֹ֥א עַתָּ֖ה פָּנָ֥י/ו יֶחֱוָֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/022.yaml
  text: 'Therefore thus says Yahweh to the house of Jacob[a], he who redeemed Abraham: Jacob will no longer be ashamed[b], and his face will no longer grow pale.'
translation:
  language: hi
  text: 'इसलिए याहवे, जिसने अब्राहम को छुड़ाया, याकूब के घराने के विषय में इस प्रकार कहते हैं: “अब याकूब लज्जित न होगा[a], और अब उसका मुख पीला न पड़ेगा[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपमानित न किया जाएगा।”
    reason: हिब्रू क्रिया लज्जित होने अथवा अपमानित किए जाने—दोनों भावों में समझी जा सकती है।
  - marker: b
    text: या, “उसका मुख अब फीका न होगा।” हिब्रू क्रिया का शाब्दिक बिंब सफेद या पीला पड़ने का है, जो लज्जा अथवा घबराहट को दर्शा सकता है।
    reason: मूल क्रिया के रंग उड़ने संबंधी बिंब और उसकी वैकल्पिक हिन्दी अभिव्यक्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले प्रसंग से निष्कर्ष अथवा परिणाम का संबंध स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: כֹּה אָמַר
  choice: यह कहते हैं
  rationale: हिब्रू की भविष्यद्वक्ताई संदेश-सूचना को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֶל בֵּית יַעֲקֹב
  choice: याकूब के घराने से
  rationale: אֶל को संबोधित वचन के रूप में और בֵּית को याकूब के वंश की सामूहिक, वाचागत पहचान के रूप में रखा गया है।
- source_word: אֲשֶׁר פָּדָה אֶת אַבְרָהָם
  choice: वही जिन्होंने अब्राहम को छुड़ाया था
  rationale: पדה के मुक्ति-मूलक आशय को रखते हुए हिन्दी में स्वाभाविक वाक्य बनाया गया है; संबंधवाचक उपवाक्य को याहवे का वर्णन माना गया है।
- source_word: לֹא עַתָּה
  choice: अब ... न होगा / अब ... न पड़ेगा
  rationale: दोनों आवृत्तियों को बनाए रखते हुए वर्तमान दशा के पलट जाने का भाव व्यक्त किया गया है।
- source_word: יֵבוֹשׁ
  choice: लज्जित न होगा
  rationale: בוש के लज्जा और अपमान संबंधी अर्थ को संक्षिप्त, सामान्य हिन्दी में व्यक्त करता है, जबकि कर्मवाच्य संभावना फुटनोट में सुरक्षित है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: हिब्रू की तरह कुलपुरुष का नाम रखा गया है, जो यहाँ उसके वंश को सामूहिक रूप से भी दर्शाता है।
- source_word: פָּנָיו
  choice: उसका मुख
  rationale: मूल की शारीरिक और भावात्मक छवि को गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: יֶחֱוָרוּ
  choice: पीला न पड़ेगा
  rationale: क्रिया के रंग उड़ने या फीका पड़ने के बिंब को मुहावरेदार हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: “जिसने अब्राहम को छुड़ाया” संबंधवाचक उपवाक्य का संदर्भ
  choice: 'इसे याहवे का वर्णन माना गया है: “वही जिन्होंने अब्राहम को छुड़ाया था।”'
  alternative: इसे अधिक दूर स्थित “याकूब के घराने” से जुड़ा हुआ समझना।
  rationale: वाक्य-विन्यास और प्रसंग में याहवे इसका सबसे स्वाभाविक पूर्वपद हैं; उनका पहले का छुड़ाने का कार्य याकूब से की गई प्रतिज्ञा का आधार बनता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य है। “घराना,” “मुख” और “लज्जित” मूल के सामूहिक तथा काव्यात्मक स्वर को रखते हैं, जबकि वाक्य-विन्यास सामान्य पाठक के लिए स्वाभाविक है।
