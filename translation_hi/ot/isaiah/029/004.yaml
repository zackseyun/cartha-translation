source:
  edition: WLC
  text: וְ/שָׁפַלְתְּ֙ מֵ/אֶ֣רֶץ תְּדַבֵּ֔רִי וּ/מֵֽ/עָפָ֖ר תִּשַּׁ֣ח אִמְרָתֵ֑/ךְ וְֽ֠/הָיָה כְּ/א֤וֹב מֵ/אֶ֨רֶץ֙ קוֹלֵ֔/ךְ וּ/מֵ/עָפָ֖ר אִמְרָתֵ֥/ךְ תְּצַפְצֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/004.yaml
  text: Then you will be brought low; from the earth you will speak[a], and from the dust your speech will be low. Your voice will be like that of a medium from the earth, and from the dust your speech will chirp.
translation:
  language: hi
  text: तब तू नीची कर दी जाएगी; तू धरती से बोलेगी, और तेरी वाणी धूल से धीमी निकलेगी। तेरी आवाज़ धरती से आती किसी प्रेत-साधक की आवाज़ जैसी होगी, और तेरी वाणी धूल से चीं-चीं करेगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁפַלְתְּ
  choice: तब तू नीची हो जाएगी
  rationale: שׁפל यहाँ नीचा या दबा हुआ हो जाने का भाव देता है। स्त्रीलिंग एकवचन संबोधन बनाए रखा गया है, और ‘तब’ प्रसंग में वाव के परिणामात्मक प्रवाह को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵאֶרֶץ תְּדַבֵּרִי
  choice: तू भूमि में से बोलेगी
  rationale: भूमि से आती वाणी के काव्यात्मक और अपमानसूचक चित्र को सीधे बनाए रखता है।
- source_word: וּמֵעָפָר תִּשַּׁח אִמְרָתֵךְ
  choice: तेरी वाणी धूल में से धीमी निकलेगी
  rationale: תִּשַּׁח का मूल भाव नीचे झुकने या दब जाने का है; वाणी के संदर्भ में ‘धीमी निकलेगी’ उस मंद, दबी हुई ध्वनि को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसे केवल ‘फुसफुसाहट’ तक सीमित किए।
- source_word: כְּאוֹב
  choice: प्रेत-साधक की आवाज़ जैसी
  rationale: אוֹב प्रेत-साधना से जुड़े माध्यम/व्यक्ति अथवा उससे संबद्ध मृतात्मा के लिए प्रयुक्त हो सकता है। मुख्य पाठ में ‘प्रेत-साधक’ मानवीय माध्यम का अर्थ देता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: תְּצַפְצֵף
  choice: चूँ-चूँ करेगी
  rationale: צפצף पतली, पक्षी-जैसी चहचहाती या चीं-चीं करती ध्वनि बताता है। ‘चूँ-चूँ करेगी’ उस असामान्य, महीन ध्वनि को स्पष्ट और जीवंत रखता है।
theological_decisions:
- issue: אוֹב को निषिद्ध प्रेत-साधना से जुड़े प्रसंग में कैसे व्यक्त किया जाए
  choice: प्रेत-साधक
  alternative: मृतात्मा या प्रेत की-सी आवाज़
  rationale: यहाँ उपमा नगर की बहुत धीमी, मानो भूमि के भीतर से आती आवाज़ का वर्णन करती है; यह प्रेत-साधना का समर्थन नहीं करती। ‘प्रेत-साधक’ शब्द के सामान्य शाब्दिक संकेत को रखता है, और मृतात्मा-संबंधी वास्तविक अर्थ-संदेह पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी; स्त्रीलिंग एकवचन संबोधन बनाए रखा गया है। ‘भूमि/धूल’ की समानांतरता और अंतिम पंक्ति की पतली, विचित्र ध्वनि को यथासंभव प्रत्यक्ष रखा गया है।
