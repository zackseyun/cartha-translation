id: ISA.29.5
reference: Isaiah 29:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֛ה כְּ/אָבָ֥ק דַּ֖ק הֲמ֣וֹן זָרָ֑יִ/ךְ וּ/כְ/מֹ֤ץ עֹבֵר֙ הֲמ֣וֹן עָֽרִיצִ֔ים וְ/הָיָ֖ה לְ/פֶ֥תַע פִּתְאֹֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/005.yaml
  text: But the multitude of your strangers shall become like fine dust[a], and the multitude of the ruthless like passing chaff; and it shall happen suddenly[b], in an instant.
translation:
  language: hi
  text: परन्तु तेरे परदेशियों[a] की भीड़ महीन धूल के समान हो जाएगी, और क्रूर लोगों की भीड़ उड़ते भूसे[b] के समान; यह अचानक, पल भर में होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे विदेशियों।” इब्रानी शब्द परदेसियों अथवा बाहरी लोगों को दर्शा सकता है; इस प्रसंग में वे शत्रुतापूर्ण आक्रमणकारी हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “गुज़रते हुए भूसे”; अर्थात ऐसा भूसा जो उड़कर निकल जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: हो जाएगी / होगा
  rationale: पहले प्रयोग में तुलनात्मक विधेयों के साथ परिवर्तन का भाव है, इसलिए ‘हो जाएगी’; अंतिम प्रयोग घटना के घटित होने को बताता है, इसलिए ‘होगा’ स्वाभाविक है।
- source_word: כְּאָבָק דַּק
  choice: महीन धूल के समान
  rationale: אָבָק ‘धूल’ और דַּק उसकी अत्यन्त महीन अवस्था को व्यक्त करता है; यह बिखर जाने योग्य पदार्थ की भविष्यद्वाणी-संबंधी छवि बनाए रखता है।
- source_word: הֲמוֹן
  choice: भीड़
  rationale: यह किसी बड़े जनसमूह या भारी संख्या को दर्शाता है। ‘भीड़’ आधुनिक हिन्दी में सहज है और दोनों प्रयोगों में ठीक बैठता है।
- source_word: זָרָיִךְ
  choice: तेरे परदेशियों
  rationale: शब्द का मूल अर्थ परदेसी अथवा बाहरी लोग है। प्रसंग में वे शत्रुतापूर्ण बाहरी लोग हैं, पर मुख्य पाठ में ‘आक्रमणकारी’ जोड़ने से अर्थ आवश्यकता से अधिक निश्चित हो जाता; इसलिए विकल्प को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וּכְמֹץ עֹבֵר
  choice: उड़ते भूसे के समान
  rationale: מֹץ अनाज की भूसी/भूसा और עֹבֵר आगे निकल जाने या बह जाने की गतिशील छवि देता है। ‘उड़ता भूसा’ हिन्दी में हवा से शीघ्र तितर-बितर होने की छवि स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָרִיצִים
  choice: क्रूर लोग
  rationale: यह शब्द हिंसक, कठोर और निर्दयी लोगों को दर्शाता है। ‘क्रूर लोग’ नैतिक बल बनाए रखता है, पर किसी विशेष राजनीतिक पद को नहीं थोपता।
- source_word: לְפֶתַע פִּתְאֹם
  choice: अचानक, पल भर में
  rationale: दोनों निकटार्थक पद घटना की आकस्मिकता को तीव्र करते हैं। हिन्दी में दोनों को रखना मूल की पुनरुक्ति और जोर को बनाए रखता है।
