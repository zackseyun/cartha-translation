translation_notes:
  register: भाषा आधुनिक, सहज और भविष्यद्वाणी के अनुरूप गरिमापूर्ण रखी गई है। नगर को स्त्रीलिंग एकवचन में किए गए संबोधन के कारण ‘तेरे’ रखा गया है। अर्धविराम दोनों समानांतर उपमानों को अंतिम आकस्मिक घटना-वाक्य से अलग करता है।
