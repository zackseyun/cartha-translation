  yaml_path: translation/ot/isaiah/029/021.yaml
  text: those who make a man an offender by a word[a], and lay a snare for the one who reproves in the gate[c][b], and turn aside the righteous with emptiness.
translation:
  language: hi
  text: जो किसी व्यक्ति को एक बात के आधार पर दोषी ठहराते हैं[a], जो नगर-द्वार पर ताड़ना देनेवाले को फँसाने के लिए फंदा बिछाते हैं[b], और व्यर्थ बातों से धर्मी को न्याय से वंचित कर देते हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो किसी व्यक्ति को एक बात से अपराधी बना देते हैं,” अथवा, “जो अपनी बात से किसी व्यक्ति को पाप में डालते हैं।” इब्रानी में न्यायिक और कारणवाचक—दोनों अर्थ संभव हैं; यहाँ न्यायिक संदर्भ पहले अर्थ के पक्ष में है।
    reason: lexical_alternative
  - marker: b
    text: “नगर-द्वार” सार्वजनिक न्याय और कानूनी कार्यवाही का स्थान था। “ताड़ना देनेवाले” का अनुवाद “न्याय की बात कहनेवाले” या “मुकदमे में प्रतिवाद करनेवाले” भी हो सकता है।
    reason: cultural_and_lexical_note
  - marker: c
    text: या, “धर्मी को व्यर्थ बात से हटा देते हैं,” अथवा, “धर्मी को बिना किसी आधार के न्याय से वंचित कर देते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲטִיאֵי אָדָם בְּדָבָר
  choice: किसी व्यक्ति को एक बात के कारण दोषी ठहराते हैं
  rationale: न्यायिक संदर्भ में हिफ़ील कृदंत को नैतिक रूप से पाप करवाने के बजाय किसी को दोषी ठहराने के अर्थ में लिया गया है। בְּדָבָר की संक्षिप्तता और अस्पष्टता ‘एक बात के कारण’ में बनी रहती है।
- source_word: לַמּוֹכִיחַ
  choice: न्याय की बात कहनेवाले
  rationale: יכח में डाँटने, विवाद करने और न्यायिक प्रतिवाद करने के अर्थ संभव हैं। नगर-द्वार के न्यायिक परिवेश में यह अनुवाद कानूनी पक्ष को स्पष्ट करता है, पर व्यक्ति को औपचारिक पदाधिकारी नहीं बनाता।
- source_word: בַּשַּׁעַר
  choice: नगर-द्वार पर
  rationale: प्राचीन नगर-द्वार सार्वजनिक सुनवाई और न्याय का स्थान था। हिन्दी में ‘नगर-द्वार पर’ स्थान और सांस्कृतिक संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְקֹשׁוּן
  choice: फंदा लगाते हैं
  rationale: मूल क्रिया दुर्भावनापूर्ण ढंग से फँसाने के लिए जाल या फंदा लगाने का रूपक रखती है।
- source_word: וַיַּטּוּ ... צַדִּיק
  choice: धर्मी को न्याय से वंचित कर देते हैं
  rationale: न्यायिक प्रयोग में נטה किसी के मुकदमे या न्याय को मोड़ने का भाव रखता है। शाब्दिक ‘धर्मी को मोड़ देते हैं’ की अपेक्षा यह हिन्दी में अर्थ स्पष्ट करता है।
- source_word: בַתֹּהוּ
  choice: खोखले आधार पर
  rationale: תֹהוּ यहाँ शून्यता, निरर्थकता या अवास्तविक आधार का संकेत देता है। ‘खोखले आधार पर’ अवैध या निराधार कानूनी आधार का भाव देता है, बिना इसे निश्चित रूप से ‘झूठ’ कहे।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: शब्द में नैतिक धार्मिकता और न्यायिक निर्दोषता दोनों निहित हो सकती हैं; ‘धर्मी’ व्यापक बाइबलीय अर्थ को सुरक्षित रखता है।
