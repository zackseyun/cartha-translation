  yaml_path: translation/ot/isaiah/029/002.yaml
  text: And I will distress Ariel[a], and there will be mourning and lamentation, and she will be to me like an altar hearth.
translation:
  language: hi
  text: मैं अरीएल[a] को संकट में डालूँगा; तब वहाँ शोक और विलाप होगा, और वह मेरे लिए वेदी की अग्नि-स्थली के समान हो जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी אֲרִיאֵל (अरीएल) में संभवतः शब्द-क्रीड़ा है: अरीएल कहलाने वाला नगर “वेदी की अग्नि-स्थली” के समान हो जाएगा। अंतिम वाक्यांश का अधिक शाब्दिक अनुवाद यह भी हो सकता है, “और वह मेरे लिए अरीएल के समान हो जाएगी।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲצִיקוֹתִי
  choice: मैं ... को संकट में डालूँगा
  rationale: हिफ़ील रूप दबाव, कष्ट या संकट पहुँचाने का व्यापक अर्थ देता है। संदर्भ में घेराबंदी निकट है, पर क्रिया को केवल उसी तक सीमित नहीं किया गया।
- source_word: לַאֲרִיאֵל
  choice: अरीएल
  rationale: संदर्भ में यह यरूशलेम का नाम/विशेष संबोधन है; इसलिए नाम का लिप्यंतरण किया गया है।
- source_word: תַאֲנִיָּה וַאֲנִיָּה
  choice: शोक और विलाप
  rationale: दो निकटार्थक संज्ञाएँ दुःख की तीव्रता और काव्यात्मक पुनरुक्ति व्यक्त करती हैं; हिन्दी में दोनों को अलग रखा गया है।
- source_word: וְהָיְתָה לִּי
  choice: वह मेरे लिए ... हो जाएगी
  rationale: स्त्रीलिंग एकवचन क्रिया अरीएल अर्थात नगर की ओर लौटती है। हिन्दी में 'वह' स्वाभाविक रूप से नगर का संदर्भ बनाए रखता है।
- source_word: כַּאֲרִיאֵל
  choice: वेदी की अग्नि-स्थली के समान
  rationale: दूसरी बार प्रयुक्त אֲרִיאֵל संभवतः वेदी के अग्नि-स्थल को सूचित करता है। अर्थानुवाद नाम और अग्नि-स्थली के बीच निहित शब्द-क्रीड़ा तथा न्याय की छवि को सामने लाता है।
theological_decisions:
- issue: אֲרִיאֵל की पुनरावृत्ति में शब्द-क्रीड़ा
  choice: पहली बार नाम 'अरीएल' और दूसरी बार अर्थ 'वेदी की अग्नि-स्थली'
  alternative: दोनों स्थानों पर 'अरीएल' रखना
  rationale: संदर्भ पहले प्रयोग को यरूशलेम का नाम बनाता है, जबकि अंतिम प्रयोग नाम के संभावित शाब्दिक अर्थ का लाभ उठाता है। यह अनुवाद भविष्यवाणी की विडंबना को व्यक्त करता है, और अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और काव्यात्मक शैली रखी गई है। 'संकट में डालूँगा' मूल क्रिया की व्यापकता बनाए रखता है; 'शोक और विलाप' समानार्थी काव्यात्मक युग्म को सुरक्षित रखता है।
