  naturalness: पाठ आधुनिक मानक हिन्दी में स्पष्ट और सहज है। ‘अक्षर-ज्ञान नहीं है’ सामान्यतः बोधगम्य, संक्षिप्त और संदर्भानुकूल है। प्रत्यक्ष वचन में ‘पढ़ो’ स्वाभाविक है और स्रोत में निहित संबोधन की अनिर्दिष्ट सामाजिक दूरी को अनावश्यक रूप से निश्चित नहीं करता।
  terminology: ‘पुस्तक’ पूर्ववर्ती संदर्भ में आए הַסֵּפֶר के लिए संगत है। ‘अक्षर-ज्ञान’ לֹא יָדַע סֵפֶר के साक्षरता वाले मुहावरे को पर्याप्त रूप से संभालता है। कोई विशेष धार्मिक या संप्रदायगत शब्दावली नहीं है।
