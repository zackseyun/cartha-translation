  yaml_path: translation/ot/isaiah/029/012.yaml
  text: And the book is given to one who does not know writing, saying, “Please read this,” and he says, “I do not know writing.”
translation:
  language: hi
  text: फिर वह पुस्तक ऐसे व्यक्ति को दी जाती है जिसे अक्षर-ज्ञान नहीं है, और उससे कहा जाता है, “कृपया इसे पढ़ो।” वह कहता है, “मुझे अक्षर-ज्ञान नहीं है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַסֵּפֶר (hassefer)
  choice: पुस्तक
  rationale: संदर्भ में वही लिखित वस्तु अभिप्रेत है जो पिछले पद में मुहरबंद पुस्तक के रूप में आई है; इसलिए सामान्य ‘लेख’ की अपेक्षा ‘पुस्तक’ संदर्भगत निरंतरता रखती है।
- source_word: לֹא יָדַע סֵפֶר (lo yada sefer)
  choice: अक्षर-ज्ञान नहीं है
  rationale: शाब्दिक रूप से यह ‘पुस्तक/लेखन नहीं जानता’ है और निरक्षरता का इब्रानी मुहावरा है। ‘अक्षर-ज्ञान नहीं’ पढ़ने और लिखने, दोनों की योग्यता को समेटता है तथा केवल ‘पढ़ना नहीं जानता’ कहकर अर्थ को अनावश्यक रूप से संकरा नहीं करता।
- source_word: קְרָא נָא זֶה (qera na zeh)
  choice: कृपया इसे पढ़ो
  rationale: कְרָא का अर्थ यहाँ लिखित सामग्री पढ़ना है और נָא विनम्र अनुरोध सूचित करता है।
