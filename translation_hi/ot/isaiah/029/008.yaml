  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। स्वप्न और जागने के तीखे विरोध को समानांतर वाक्य-रचना से रखा गया है। ‘राष्ट्र’, ‘सिय्योन पर्वत’ और ‘युद्ध करते हैं’ प्रकाशनयोग्य बाइबलीय रजिस्टर बनाए रखते हैं; नֶפֶשׁ की वास्तविक अर्थगत व्यापकता पादटिप्पणियों में सुरक्षित है।
