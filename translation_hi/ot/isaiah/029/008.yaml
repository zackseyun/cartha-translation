  text: וְ/הָיָ֡ה כַּ/אֲשֶׁר֩ יַחֲלֹ֨ם הָ/רָעֵ֜ב וְ/הִנֵּ֣ה אוֹכֵ֗ל וְ/הֵקִיץ֮ וְ/רֵיקָ֣ה נַפְשׁ/וֹ֒ וְ/כַ/אֲשֶׁ֨ר יַחֲלֹ֤ם הַ/צָּמֵא֙ וְ/הִנֵּ֣ה שֹׁתֶ֔ה וְ/הֵקִיץ֙ וְ/הִנֵּ֣ה עָיֵ֔ף וְ/נַפְשׁ֖/וֹ שׁוֹקֵקָ֑ה כֵּ֣ן יִֽהְיֶ֗ה הֲמוֹן֙ כָּל הַ/גּוֹיִ֔ם הַ/צֹּבְאִ֖ים עַל הַ֥ר צִיּֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/008.yaml
  text: And it will be as when a hungry man dreams[a], and behold, he is eating, but he wakes and his appetite is empty; and as when a thirsty man dreams, and behold, he is drinking, but he wakes, and behold, he is faint and his appetite craves[b]. So will be the multitude of all the nations that wage war against Mount Zion.
translation:
  language: hi
  text: और ऐसा होगा जैसे कोई भूखा मनुष्य सपना देखता है कि वह खा रहा है, पर जागता है तो उसकी भूख नहीं मिटती[a]; और जैसे कोई प्यासा मनुष्य सपना देखता है कि वह पी रहा है, पर जागता है तो वह निढाल होता है और उसकी प्यास नहीं बुझती[b]—वैसा ही उन सब राष्ट्रों की भीड़ के साथ होगा जो सिय्योन पर्वत के विरुद्ध युद्ध करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसका प्राण/जीव खाली है।” यहाँ इब्रानी शब्द भूखे व्यक्ति की अतृप्त भूख या भीतर की लालसा का संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसका प्राण/जीव लालायित है।” इसका अर्थ “उसकी प्यास बनी रहती है” या, प्रसंगानुसार, “उसका गला सूखा है” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כַּאֲשֶׁר
  choice: और जैसा होता है कि
  rationale: यह भावी परिणाम को एक सजीव, सामान्य उपमा के रूप में प्रस्तुत करता है और हिन्दी में दोहराई गई तुलनात्मक रचना को स्वाभाविक रखता है।
- source_word: יַחֲלֹם הָרָעֵב
  choice: कोई भूखा मनुष्य सपना देखता है
  rationale: मूल का विशेषण संज्ञा के रूप में प्रयुक्त और पुल्लिंग एकवचन है; सामान्य उदाहरण का भाव रखते हुए रूप को अनावश्यक रूप से लिंग-निरपेक्ष नहीं किया गया।
- source_word: וְהִנֵּה אוֹכֵל / וְהִנֵּה שֹׁתֶה
  choice: कि वह खा रहा है / कि वह पी रहा है
  rationale: הִנֵּה और कृदंत मिलकर स्वप्न-दृश्य को प्रत्यक्ष बनाते हैं; हिन्दी में आश्रित वाक्य और अपूर्ण वर्तमान इस सजीवता को बिना कृत्रिम ‘देखो’ के व्यक्त करते हैं।
- source_word: וְהֵקִיץ
  choice: पर जागने पर
  rationale: यद्यपि संयोजक सामान्यतः ‘और’ है, यहाँ जागना स्वप्न में मिली तृप्ति को उलट देता है; इसलिए विरोधसूचक ‘पर’ संदर्भानुकूल है।
- source_word: וְרֵיקָה נַפְשׁוֹ
  choice: उसका पेट खाली ही रहता है
  rationale: भूख के प्रसंग में נֶפֶשׁ व्यक्ति की जीवन-इच्छा या भूख का स्थान सूचित करता है। ‘पेट’ हिन्दी में ठोस और स्वाभाविक है; ‘ही रहता है’ स्वप्न के बावजूद वास्तविक अवस्था न बदलने का निहित विरोध व्यक्त करता है।
- source_word: עָיֵף
  choice: निढाल
  rationale: प्यास के कारण शारीरिक क्षीणता और बेदम अवस्था को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְנַפְשׁוֹ שׁוֹקֵקָה
  choice: उसका जी तरस रहा है
  rationale: यह נֶפֶשׁ को व्यक्ति की भीतर की तीव्र लालसा के रूप में और שׁוֹקֵקָה को जारी तरस के रूप में व्यक्त करता है, बिना इसे तकनीकी ‘आत्मा’ तक सीमित किए।
- source_word: הֲמוֹן כָּל־הַגּוֹיִם הַצֹּבְאִים
  choice: उन सब राष्ट्रों की भीड़ ... जो ... युद्ध करते हैं
  rationale: הָמוֹן की बहुलता और צבא के सैन्य अर्थ दोनों सुरक्षित रहते हैं।
- source_word: עַל הַר צִיּוֹן
  choice: सिय्योन पर्वत के विरुद्ध
  rationale: यहाँ עַל आक्रमण या सैन्य विरोध का संबंध बताता है; ‘के विरुद्ध’ हिन्दी में आशय स्पष्ट करता है।
theological_decisions:
- issue: भूख-प्यास के शारीरिक प्रसंग में נֶפֶשׁ का अर्थ
  choice: पहले पद में ‘पेट’, दूसरे में ‘जी’
  alternative: ‘प्राण’ या ‘आत्मा’ दोनों स्थानों पर
  rationale: मूल शब्द का अर्थ-क्षेत्र जीवन, व्यक्ति, भूख और भीतर की इच्छा तक फैला है। दोनों प्रसंगों में एक ही यांत्रिक हिन्दी शब्द रखने के बजाय संदर्भानुसार भाषा चुनी गई है, जबकि पादटिप्पणियाँ मूल की व्यापकता सुरक्षित रखती हैं।
- issue: הָרָעֵב और הַצָּמֵא के प्रतिनिधिक पुल्लिंग एकवचन
  choice: ‘भूखा मनुष्य’ और ‘प्यासा मनुष्य’
  alternative: ‘भूखा व्यक्ति’ और ‘प्यासा व्यक्ति’
  rationale: मूल का व्याकरणिक पुल्लिंग एकवचन और सामान्य मानवीय उदाहरण दोनों बनाए रखे गए हैं; इससे कोई लिंग-विशेष धार्मिक निष्कर्ष नहीं निकाला गया।
- issue: सिय्योन के विरुद्ध राष्ट्रों की भीड़ का परिणाम
  choice: उपमा को अनिर्दिष्ट परिणाम सहित बनाए रखना
  alternative: स्पष्ट जोड़ना कि उनकी विजय या आशा मिट जाएगी
  rationale: प्रसंग में यह आशय संभव है, पर पद स्वयं केवल ‘वैसा ही ... होगा’ कहता है। अनुवाद ने निहितार्थ को व्याख्यात्मक वाक्य बनाकर नहीं जोड़ा।
