  text: כִּ֣י בִ֠/רְאֹת/וֹ יְלָדָ֞י/ו מַעֲשֵׂ֥ה יָדַ֛/י בְּ/קִרְבּ֖/וֹ יַקְדִּ֣ישֽׁוּ שְׁמִ֑/י וְ/הִקְדִּ֨ישׁוּ֙ אֶת קְד֣וֹשׁ יַֽעֲקֹ֔ב וְ/אֶת אֱלֹהֵ֥י יִשְׂרָאֵ֖ל יַעֲרִֽיצוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/023.yaml
  text: For when he sees his children[a], the work of my hands, in his midst, they will sanctify my name; they will sanctify the Holy One of Jacob[b], and they will stand in awe of the God of Israel.
translation:
  language: hi
  text: क्योंकि जब वह अपने बीच अपने बच्चों[a] को—मेरे हाथों के काम को—देखेगा, तब वे मेरे नाम को पवित्र मानेंगे; वे याकूब के पवित्र परमेश्वर को पवित्र मानेंगे और इस्राएल के परमेश्वर का श्रद्धापूर्वक भय मानेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एकवचन ‘वह’ और ‘अपने’ पिछले पद में आए कुलपुरुषों की ओर संकेत कर सकते हैं—विशेषकर अब्राहम या याकूब की ओर; यह व्यक्तिरूप याकूब/इस्राएल भी हो सकता है, जो अपने वंशजों को अपने बीच देखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי בִרְאֹתוֹ
  choice: क्योंकि जब वह…देखेगा
  rationale: כִּי पिछले कथन का आधार बताता है, जबकि ב के साथ infinitive construct समय का भाव देता है; इसलिए दोनों संबंधों को हिन्दी में स्पष्ट रखा गया है।
- source_word: יְלָדָיו
  choice: अपने बच्चों
  rationale: יֶלֶד का बहुवचन यहाँ सामूहिक रूप से संतान को दर्शाता है; ‘बच्चों’ स्वाभाविक और समावेशी हिन्दी है।
- source_word: מַעֲשֵׂה יָדַי
  choice: मेरे हाथों के काम को
  rationale: यह अनुवाद परमेश्वर की रचना/कारीगरी की ठोस इब्रानी छवि को सुरक्षित रखता है।
- source_word: בְּקִרְבּוֹ
  choice: अपने बीच
  rationale: एकवचन प्रत्यय को बनाए रखते हुए यह व्यक्तिरूप में प्रस्तुत याकूब/इस्राएल के समुदाय के भीतर बच्चों की उपस्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יַקְדִּישׁוּ שְׁמִי
  choice: मेरे नाम को पवित्र मानेंगे
  rationale: हिफ़ील קדש का आशय नाम को पवित्र ठहराना या पवित्र मानना है; ‘पवित्र मानेंगे’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: וְהִקְדִּישׁוּ אֶת קְדוֹשׁ יַעֲקֹב
  choice: वे याकूब के पवित्र जन को पवित्र मानेंगे
  rationale: दोनों קדש क्रियाओं की पुनरावृत्ति हिन्दी में भी रखी गई है; ‘याकूब का पवित्र जन’ यशायाह की विशिष्ट ईश्वरीय उपाधि को दर्शाता है।
- source_word: יַעֲרִיצוּ
  choice: श्रद्धापूर्वक भय मानेंगे
  rationale: ערץ के हिफ़ील रूप में भय, विस्मय और श्रद्धा का संयुक्त भाव है; यह पदबंध केवल आतंक या केवल सम्मान तक अर्थ को सीमित नहीं करता।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: यह प्रचलित ईश्वरीय उपाधि का सीधा और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: एकवचन सर्वनामों का संदर्भ—‘वह…अपने बीच’
  choice: मुख्य पाठ में संदर्भ को अनिर्दिष्ट रखते हुए एकवचन ‘वह/अपने’ सुरक्षित रखा गया है; प्रसंग में यह व्यक्तिरूप याकूब/इस्राएल हो सकता है।
  alternative: यह विशेष रूप से पिछले पद के अब्राहम, कुलपिता याकूब, या व्यक्तिरूप राष्ट्र इस्राएल की ओर संकेत कर सकता है।
  rationale: पद 22 में याकूब और अब्राहम दोनों आते हैं; इब्रानी पाठ स्वयं संदर्भ को पूरी तरह निश्चित नहीं करता, इसलिए मुख्य पाठ अस्पष्टता बनाए रखता और पादटिप्पणी विकल्प बताती है।
- issue: पवित्रीकरण की भाषा
  choice: קדש की दोनों क्रियाओं के लिए ‘पवित्र मानेंगे’ दोहराया गया है।
  alternative: ‘नाम को पवित्र ठहराएँगे’ और ‘याकूब के पवित्र जन को पवित्र जानेंगे।’
  rationale: मूल की आलंकारिक पुनरावृत्ति और परमेश्वर की पवित्रता पर बल बनाए रखना आवश्यक है, पर हिन्दी में ‘पवित्र करना’ से यह भ्रामक अर्थ निकल सकता है कि मनुष्य परमेश्वर को पवित्र बनाते हैं।
- issue: יַעֲרִיצוּ में भय और श्रद्धा का संबंध
  choice: ‘श्रद्धापूर्वक भय मानेंगे’
  alternative: ‘विस्मय से भर जाएँगे’, ‘भय मानेंगे’, या ‘श्रद्धा करेंगे।’
  rationale: मूल क्रिया श्रद्धामय भय और विस्मय दोनों समेटती है; चुना हुआ रूप इस तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘पवित्र मानेंगे’ मूल की पुनरावृत्ति बचाता है और ‘श्रद्धापूर्वक भय’ ערץ के भय-विस्मय-श्रद्धा के व्यापक अर्थ को व्यक्त करता है।
