  edition: WLC
  text: וַ/תְּהִ֨י לָ/כֶ֜ם חָז֣וּת הַ/כֹּ֗ל כְּ/דִבְרֵי֮ הַ/סֵּ֣פֶר הֶֽ/חָתוּם֒ אֲשֶֽׁר יִתְּנ֣וּ אֹת֗/וֹ אֶל יוֹדֵ֥עַ ה/ספר לֵ/אמֹ֖ר קְרָ֣א נָא זֶ֑ה וְ/אָמַר֙ לֹ֣א אוּכַ֔ל כִּ֥י חָת֖וּם הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/011.yaml
  text: And the vision of all this has become to you like the words of a sealed scroll[a], which they give to one who knows writing, saying, “Please read this,” and he says, “I cannot, because it is sealed.”
translation:
  language: hi
  text: और यह सारा दर्शन तुम्हारे लिए मुहरबंद पुस्तक[a] के शब्दों के समान हो गया है, जिसे वे उस व्यक्ति को देते हैं जो पढ़ना जानता है, और कहते हैं, “कृपया इसे पढ़िए।” वह कहता है, “मैं इसे नहीं पढ़ सकता, क्योंकि यह मुहरबंद है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुहरबंद लेख-पत्र।” प्राचीन काल में ऐसी पुस्तक प्रायः लिपटे हुए पत्र के रूप में होती थी।
    reason: historical_lexical_clarification
lexical_decisions:
- source_word: חָזוּת הַכֹּל
  choice: यह सारा दर्शन
  rationale: חָזוּת भविष्यदर्शी दर्शन अथवा प्रकाशन को सूचित करता है, और הַכֹּל उसकी समग्रता को। ‘यह सारा दर्शन’ पूर्ववर्ती संदेश की ओर संकेत करते हुए स्वाभाविक हिन्दी देता है।
- source_word: הַסֵּפֶר
  choice: पुस्तक
  rationale: सन्दर्भ में यह लिखित और लपेटी जाने वाली सामग्री है; आधुनिक पाठक के लिए ‘पुस्तक’ सहज है, जबकि पादटिप्पणी इसके ऐतिहासिक रूप ‘लपेटी हुई पुस्तक’ को स्पष्ट करती है।
- source_word: הֶחָתוּם / חָתוּם
  choice: मुहरबंद / इस पर मुहर लगी है
  rationale: חתם का अर्थ मुहर लगाकर बन्द करना है। विशेषण और उत्तर में स्वाभाविक हिन्दी के लिए दो निकट रूप रखे गए हैं।
- source_word: יוֹדֵעַ הַסֵּפֶר
  choice: पढ़े-लिखे व्यक्ति
  rationale: शाब्दिक रूप ‘पुस्तक/लेख को जानने वाला’ है, जिसका प्रसंगगत आशय पढ़ सकने वाला, साक्षर व्यक्ति है। यह चयन हिन्दी में स्वाभाविक और अर्थतः सटीक है।
- source_word: קְרָא נָא זֶה
  choice: कृपया इसे पढ़िए
  rationale: נָא विनम्र अनुरोध व्यक्त करता है; ‘कृपया’ और आदरसूचक ‘पढ़िए’ उस भाव को स्वाभाविक हिन्दी में रखते हैं।
- source_word: לֹא אוּכַל
  choice: मैं नहीं पढ़ सकता
  rationale: शाब्दिक अर्थ ‘मैं समर्थ नहीं हूँ’ है; प्रसंग में पढ़ना स्पष्ट रूप से निहित है, इसलिए हिन्दी में आवश्यक पूर्ति की गई है।
- source_word: וַתְּהִי לָכֶם
  choice: तुम्हारे लिए ... हो गया है
  rationale: यह रूप परिणामी अवस्था बताता है—दर्शन अब उनके लिए मुहरबंद लेख के समान हो चुका है।
theological_decisions:
- issue: अगम्य प्रकाशन का रूपक
  choice: मुहरबंद पुस्तक की उपमा को बिना व्याख्यात्मक विस्तार के बनाए रखना
  alternative: ‘परमेश्वर का संदेश तुम्हारी समझ से बाहर हो गया है’ जैसी व्याख्यात्मक अभिव्यक्ति
  rationale: मूल पाठ स्वयं उपमा के माध्यम से न्याय और अगम्यता का तनाव व्यक्त करता है। उसे सीधे ‘न समझ पाने’ में बदलना पाठ से अधिक व्याख्या जोड़ देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘दर्शन’ भविष्यदर्शी सन्दर्भ को बनाए रखता है; ‘पढ़े-लिखे व्यक्ति’ יוֹדֵעַ הַסֵּפֶר का मुहावरेदार अर्थ देता है। मुख्य पाठ का [a] चिह्न पादटिप्पणी से मेल खाता है।
