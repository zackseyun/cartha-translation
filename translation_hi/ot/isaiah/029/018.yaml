base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/018.yaml
  text: And on that day the deaf will hear the words of a book[a], and out of gloom and out of darkness the eyes of the blind will see.
translation:
  language: hi
  text: उस दिन बधिर लोग पुस्तक[a] के शब्द सुनेंगे, और धुंधलके और अंधकार में से अंधों की आँखें देखेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ग्रंथ,” “लपेटा हुआ लेख-पत्र,” अथवा “लिखित दस्तावेज़”; इब्रानी शब्द सेफ़ेर व्यापक रूप से किसी लिखित पाठ को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְעוּ
  choice: सुनेंगे
  rationale: भविष्यसूचक संदर्भ में यह रूप भावी प्रतिज्ञा व्यक्त करता है; हिंदी का सामान्य भविष्यकाल इसे स्वाभाविक रूप से प्रकट करता है।
- source_word: בַיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यसूचक साहित्य का सामान्य कालसूचक मुहावरा है और आधुनिक हिंदी में सहज है।
- source_word: הַחֵרְשִׁים
  choice: बहरे
  rationale: विशेषण यहाँ संज्ञा के रूप में बधिर लोगों को दर्शाता है; 'बहरे' संक्षिप्त और सामान्य हिंदी है।
- source_word: דִּבְרֵי סֵפֶר
  choice: पुस्तक के वचन
  rationale: रचना-संबंध को स्पष्ट रखते हुए 'वचन' लिखित बातों को गरिमापूर्ण ढंग से व्यक्त करता है; סֵפֶר पुस्तक, ग्रंथ, पत्र या लिखित दस्तावेज़ का संकेत दे सकता है, इसलिए विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: וּמֵאֹפֶל וּמֵחֹשֶׁךְ
  choice: और घोर अंधकार और अँधेरे में से
  rationale: מִן स्रोत या अवस्था से निकलने का भाव देता है। दोनों निकटार्थी शब्दों को अलग रखकर इब्रानी काव्य की तीव्र समानांतरता बचाई गई है।
- source_word: עֵינֵי עִוְרִים
  choice: अंधों की आँखें
  rationale: इब्रानी संबंधसूचक पदबंध और उसकी ठोस दृश्यात्मकता सीधे रूप में सुरक्षित रहती है।
- source_word: תִּרְאֶינָה
  choice: देखेंगी
  rationale: क्रिया स्त्रीलिंग बहुवचन 'आँखें' से मेल खाती है और दृष्टि की बहाली को सीधे व्यक्त करती है।
theological_decisions:
- issue: क्या पद को केवल शारीरिक चंगाई के रूप में प्रस्तुत किया जाए या आध्यात्मिक पुनर्स्थापना की छवि के लिए भी खुला रखा जाए
  choice: ठोस इंद्रिय-संबंधी भाषा—'बहरे', 'अंधों', 'सुनेंगे', 'देखेंगी'—को बिना व्याख्यात्मक विशेषण के रखा गया है।
  alternative: इसे आत्मिक समझ और बोध के रूप में स्पष्टतः रूपकात्मक बनाना।
  rationale: इब्रानी में ठोस शारीरिक शब्द हैं, पर यशायाह के संदर्भ में वे रूपकात्मक अर्थ भी वहन कर सकते हैं। अनुवाद दोनों संभावनाओं के बीच के तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, गरिमापूर्ण भविष्यसूचक शैली रखी गई है। 'घोर अंधकार' और 'अँधेरा' दोनों रखकर मूल की दोहरी काव्यात्मक छवि को सपाट होने से बचाया गया है।
