id: ISA.29.24
reference: Isaiah 29:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יָדְע֥וּ תֹֽעֵי ר֖וּחַ בִּינָ֑ה וְ/רוֹגְנִ֖ים יִלְמְדוּ לֶֽקַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/024.yaml
  text: And those who go astray in spirit will come to understanding[b][a], and those who grumble will learn instruction.
translation:
  language: hi
  text: और जिनका मन भटका हुआ है, वे समझ प्राप्त करेंगे[a], और जो बड़बड़ाते हैं, वे शिक्षा ग्रहण करेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो मन से भूल करते हैं, वे समझेंगे।”
    reason: תֹעֵי का अर्थ ‘भूल करने वाले’ भी हो सकता है, और וְיָדְעוּ का अधिक शाब्दिक अर्थ ‘जानेंगे/समझेंगे’ है।
  - marker: b
    text: या, “उपदेश सीखेंगे।”
    reason: לֶקַח का अर्थ ‘उपदेश’ या ‘शिक्षा’ हो सकता है, और יִלְמְדוּ का सीधा अर्थ ‘सीखेंगे’ है।
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: प्राप्त करेंगे
  rationale: क्रिया का मूल अर्थ ‘जानेंगे’ है, पर בִּינָה के साथ इसका आशय समझ तक पहुँचने या उसे प्राप्त करने से है; यह प्रयोग हिन्दी में स्वाभाविक रूप से परिणामसूचक भाव व्यक्त करता है।
- source_word: תֹעֵי רוּחַ
  choice: जो मन में भटके हुए हैं
  rationale: תעה भटकने या भूल करने को और רוּחַ यहाँ मन अथवा भीतरी प्रवृत्ति को सूचित करता है। यह अनुवाद मूल बिंब बनाए रखते हुए इसे पवित्र आत्मा का स्पष्ट उल्लेख नहीं बनाता।
- source_word: בִּינָה
  choice: समझ
  rationale: यह शब्द समझ, विवेक या सूझ-बूझ का अर्थ देता है; ‘समझ’ सबसे सीधा और सामान्य आधुनिक हिन्दी विकल्प है।
- source_word: וְרוֹגְנִים
  choice: जो कुड़कुड़ाते हैं
  rationale: רגן शिकायत या असंतोष भरी बड़बड़ाहट को दर्शाता है। ‘कुड़कुड़ाते हैं’ उस विरोधी मनोभाव को सहज हिन्दी में व्यक्त करता है।
- source_word: יִלְמְדוּ
  choice: ग्रहण करेंगे
  rationale: למד का मूल अर्थ ‘सीखना’ है। לֶקַח के साथ ‘शिक्षा ग्रहण करेंगे’ स्वाभाविक हिन्दी है और सीखने की क्रिया को सुरक्षित रखता है।
- source_word: לֶקַח
  choice: शिक्षा
  rationale: לֶקַח प्राप्त की जाने वाली शिक्षा, सीख या उपदेश को दर्शाता है; प्रसंग में ‘शिक्षा’ स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: תֹעֵי רוּחַ में רוּחַ का आशय
  choice: मन अथवा भीतरी प्रवृत्ति
  alternative: आत्मा में भटके हुए; पवित्र आत्मा के संबंध में भटके हुए
  rationale: प्रसंग लोगों की बौद्धिक और नैतिक दशा के बदलने की बात करता है। ‘मन में’ मानवीय भीतरी दशा को व्यक्त करता है और ऐसा विशिष्ट पवित्र-आत्मा-संबंधी दावा नहीं जोड़ता जिसकी माँग मूल पाठ नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। समानांतर काव्यात्मक संरचना बनाए रखी गई है; ‘मन में भटके हुए’ मूल इब्रानी की मानवीय भीतरी दशा संबंधी अस्पष्टता को अनावश्यक रूप से सिद्धान्तगत नहीं बनाता।
