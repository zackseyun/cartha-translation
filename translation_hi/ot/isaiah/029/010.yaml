source:
  edition: WLC
  text: כִּֽי נָסַ֨ךְ עֲלֵי/כֶ֤ם יְהוָה֙ ר֣וּחַ תַּרְדֵּמָ֔ה וַ/יְעַצֵּ֖ם אֶת עֵֽינֵי/כֶ֑ם אֶת הַ/נְּבִיאִ֛ים וְ/אֶת רָאשֵׁי/כֶ֥ם הַ/חֹזִ֖ים כִּסָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/010.yaml
  text: For Yahweh has poured out on you a spirit of deep sleep[b][a], and has shut your eyes—the prophets—and covered your heads—the seers.
translation:
  language: hi
  text: क्योंकि याहवे ने तुम पर गहरी नींद की आत्मा[a] उँडेल दी है। उसने तुम्हारी आँखों को—अर्थात् भविष्यद्वक्ताओं को—बंद कर दिया है और तुम्हारे सिरों को—अर्थात् दर्शियों को—ढक दिया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्तब्धता की आत्मा।” इब्रानी पद गहरी नींद अथवा जड़ कर देने वाली तंद्रा को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'संभवतः इब्रानी वाक्यरचना में “भविष्यद्वक्ता” “तुम्हारी आँखें” और “दर्शी” “तुम्हारे सिर” के समानाधिकरण हैं। दूसरा संभव समझ यह है कि “भविष्यद्वक्ताओं” को अलग कर्म माना जाए: “उसने भविष्यद्वक्ताओं की आँखें बंद कर दीं और तुम्हारे सिरों को—अर्थात् दर्शियों को—ढक दिया।”'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले प्रसंग में बताई गई दशा या न्याय का कारण प्रस्तुत करता है।
- source_word: נָסַךְ
  choice: उँडेल दी है
  rationale: यह उँडेलने की मूल उपमा को बनाए रखता है और उस दशा के परमेश्वर की ओर से उन पर आने को व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम YHWH का सीधा लिप्यंतरण।
- source_word: רוּחַ תַּרְדֵּמָה
  choice: गहरी नींद की आत्मा
  rationale: רוּחַ यहाँ भीतर उत्पन्न की गई दशा को सूचित करता है, जबकि תַּרְדֵּמָה गहरी अथवा स्तब्ध कर देने वाली नींद को दर्शाता है; मुख्य पाठ मूल रूपक को बनाए रखता है।
- source_word: וַיְעַצֵּם
  choice: बंद कर दिया है
  rationale: आँखें बंद करने की ठोस छवि को बनाए रखता है और व्याख्यात्मक ‘अंधा कर दिया’ से बचता है।
- source_word: עֵינֵיכֶם
  choice: तुम्हारी आँखों को
  rationale: मूल दृश्यात्मक भाषा का सीधा अनुवाद।
- source_word: אֶת הַנְּבִיאִים
  choice: अर्थात् भविष्यद्वक्ताओं को
  rationale: कठिन इब्रानी वाक्यरचना में इसे ‘तुम्हारी आँखों’ का समानाधिकरण मानकर स्पष्ट किया गया है।
- source_word: רָאשֵׁיכֶם
  choice: तुम्हारे सिरों को
  rationale: ‘अगुवों’ जैसी व्याख्या के बजाय मूल समानांतर शारीरिक छवि को सुरक्षित रखता है।
- source_word: הַחֹזִים
  choice: दर्शियों को
  rationale: यह נביאים से भिन्न प्रचलित भविष्यसूचक पद है; ‘दर्शी’ उस भेद और दर्शन से जुड़े अर्थ को बनाए रखता है।
- source_word: כִּסָּה
  choice: ढक दिया है
  rationale: मूल क्रिया और आँखें बंद करने के समानांतर चित्र को सीधे व्यक्त करता है।
theological_decisions:
- issue: न्यायस्वरूप कठोर किए जाने की छवि
  choice: 'याहवे को सक्रिय कर्ता के रूप में रखा गया है: उसने नींद की आत्मा उँडेली और आँखों को बंद तथा सिरों को ढक दिया।'
  alternative: अनुमतिसूचक अनुवाद, जैसे ‘उसने गहरी नींद की आत्मा को तुम पर आने दिया।’
  rationale: इब्रानी क्रियाएँ कार्य को सीधे YHWH से जोड़ती हैं। अनुवाद इस धर्मवैचारिक तनाव को नरम या हल नहीं करता।
- issue: ‘भविष्यद्वक्ताओं’ और ‘दर्शियों’ का वाक्यरचनात्मक संबंध
  choice: उन्हें क्रमशः ‘तुम्हारी आँखों’ और ‘तुम्हारे सिरों’ का समानाधिकरण माना गया है।
  alternative: 'उन्हें अलग कर्म मानना: ‘उसने भविष्यद्वक्ताओं को बंद कर दिया और तुम्हारे सिरों, दर्शियों को ढक दिया।’'
  rationale: समानाधिकरण वाला पाठ समानांतरता और छवि को अधिक सुसंगत ढंग से समझाता है, फिर भी दूसरी सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘भविष्यद्वक्ता’ और ‘दर्शी’ जैसे परिचित बाइबलीय पद मूल के दो अलग शब्दों का भेद बनाए रखते हैं। विराम-चिह्न कठिन समानाधिकरण को स्पष्ट करते हैं, और सक्रिय ईश्वरीय कर्तृत्व को बिना नरम किए व्यक्त किया गया है।
