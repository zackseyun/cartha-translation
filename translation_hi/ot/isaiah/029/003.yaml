source:
  edition: WLC
  text: וְ/חָנִ֥יתִי כַ/דּ֖וּר עָלָ֑יִ/ךְ וְ/צַרְתִּ֤י עָלַ֨יִ/ךְ֙ מֻצָּ֔ב וַ/הֲקִֽימֹתִ֥י עָלַ֖יִ/ךְ מְצֻרֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/003.yaml
  text: And I will encamp against you all around[a], and I will besiege you with siegeworks[c][b], and I will raise up siege towers against you.
translation:
  language: hi
  text: मैं तेरे चारों ओर[a] छावनी डालूँगा; तेरे विरुद्ध घेराबंदी की चौकी[b] स्थापित करके तेरी घेराबंदी करूँगा, और तेरे विरुद्ध घेराबंदी की मीनारें[c] खड़ी करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक घेरे के समान” अथवा “एक वृत्त के समान।”
    reason: lexical_alternative
  - marker: b
    text: या “सैनिक चौकी,” “घेराबंदी का पड़ाव,” अथवा “घेराबंदी का किला।” इब्रानी शब्द किसी स्थापित या तैनात स्थान को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: या “घेराबंदी की किलेबंदियाँ,” “घेराबंदी के बाँध,” अथवा “घेराबंदी की चढ़ाइयाँ।” सटीक सैन्य संरचना निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָנִיתִי
  choice: मैं ... छावनी डालूँगा
  rationale: חנה का अर्थ पड़ाव या छावनी डालना है; यहाँ सैन्य संदर्भ के कारण “छावनी डालना” स्वाभाविक और स्पष्ट है।
- source_word: כַדּוּר
  choice: चारों ओर
  rationale: דּוּר वृत्ताकार घेरे का बोध देता है। घेराबंदी के संदर्भ में “चारों ओर” सहज हिन्दी है; अधिक शब्दशः विकल्प पादटिप्पणी में रखा गया है।
- source_word: עָלָיִךְ / עָלַיִךְ
  choice: तेरे विरुद्ध
  rationale: नगर को स्त्रीलिंग एकवचन में संबोधित करते हुए עַל यहाँ शत्रुतापूर्ण सैन्य कार्रवाई व्यक्त करता है, इसलिए “तेरे विरुद्ध” चुना गया है।
- source_word: וְצַרְתִּי
  choice: तुझे घेर लूँगा
  rationale: צור का यहाँ अर्थ घेराबंदी करना है। “घेर लूँगा” पिछले और अगले सैन्य पदों के साथ स्वाभाविक हिन्दी देता है।
- source_word: מֻצָּב
  choice: घेराबंदी की चौकी
  rationale: यह शब्द किसी स्थापित या तैनात वस्तु अथवा स्थान को सूचित कर सकता है। संदर्भ में “घेराबंदी की चौकी” मूल की अनिश्चितता को अपेक्षाकृत सुरक्षित रखते हुए सैन्य अर्थ स्पष्ट करती है।
- source_word: וַהֲקִימֹתִי
  choice: खड़े करूँगा
  rationale: קום के हिफ़ील रूप का अर्थ खड़ा करना या स्थापित करना है; सैन्य संरचनाओं के लिए “खड़े करूँगा” उपयुक्त है।
- source_word: מְצֻרוֹת
  choice: घेराबंदी के मोर्चे
  rationale: यह बहुवचन पद घेराबंदी से जुड़ी किलेबंद संरचनाओं या कामों का व्यापक अर्थ दे सकता है। “मोर्चे” किसी एक अनिश्चित संरचना, जैसे केवल मीनार, को अनिवार्य नहीं बनाता।
theological_decisions:
- issue: न्याय में वक्ता और कर्तृत्व
  choice: प्रथम पुरुष क्रियाओं में परमेश्वर को घेराबंदी की कार्रवाई का सीधा कर्ता रहने दिया गया है।
  alternative: इसे केवल ऐसा न्याय मानना जिसे परमेश्वर मानव सेनाओं के द्वारा होने देता या ठहराता है।
  rationale: इब्रानी में लगातार प्रथम पुरुष एकवचन क्रियाएँ हैं। अनुवाद सीधे दैवी कर्तृत्व को नरम नहीं करता, पर इस पद में मानव साधन कौन है, यह भी नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। नगर को संबोधित मूल के स्त्रीलिंग एकवचन भाव को हिन्दी के “तेरे/तुझे” से बनाए रखा गया है। तीनों सैन्य पदों को अनावश्यक रूप से एक ही अर्थ में नहीं मिलाया गया, और जहाँ इब्रानी पदों का सटीक तकनीकी आशय अनिश्चित है वहाँ विकल्प पादटिप्पणियों में सुरक्षित रखे गए हैं।
