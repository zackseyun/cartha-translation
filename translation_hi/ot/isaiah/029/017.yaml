id: ISA.29.17
reference: Isaiah 29:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/לוֹא עוֹד֙ מְעַ֣ט מִזְעָ֔ר וְ/שָׁ֥ב לְבָנ֖וֹן לַ/כַּרְמֶ֑ל וְ/הַ/כַּרְמֶ֖ל לַ/יַּ֥עַר יֵחָשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/017.yaml
  text: Is it not yet a very little while[a], and Lebanon will turn into an orchard, and the orchard will be regarded as a forest?
translation:
  language: hi
  text: क्या अब बहुत ही थोड़े समय में लबानोन उपजाऊ खेत नहीं बन जाएगा, और उपजाऊ खेत वन नहीं माना जाएगा?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא
  choice: क्या ... नहीं है
  rationale: यह अलंकारिक प्रश्न है, जिसका अपेक्षित उत्तर हाँ है; हिन्दी में यह रूप प्रश्नात्मक बल को स्वाभाविक ढंग से बनाए रखता है।
- source_word: עוֹד מְעַט מִזְעָר
  choice: अब बहुत ही थोड़ा समय बाकी
  rationale: मְעַט और מִזְעָר मिलकर समय की अत्यन्त अल्पता पर बल देते हैं, जबकि עוֹד शेष समय का भाव देता है।
- source_word: וְשָׁב
  choice: में बदल जाएगा
  rationale: यहाँ שוב अवस्था-परिवर्तन को व्यक्त करता है; 'बदल जाएगा' भ्रामक 'लौट जाएगा' की अपेक्षा अधिक स्पष्ट और स्वाभाविक है।
- source_word: לְבָנוֹן
  choice: लबानोन
  rationale: भौगोलिक नाम को हिन्दी में प्रचलित बाइबलीय लिप्यंतरण के निकट रखा गया है।
- source_word: כַּרְמֶל
  choice: फलदायक खेत
  rationale: यहाँ यह कर्मेल नामक स्थान नहीं, बल्कि उपजाऊ, जोती-बोई भूमि को सूचित करता है। 'फलदायक खेत' अर्थ को स्पष्ट रखता और वन से विरोध बनाए रखता है।
- source_word: לַיַּעַר
  choice: वन
  rationale: יַעַר का अर्थ वन या जंगल है; dignified modern Hindi में 'वन' संक्षिप्त और उपयुक्त है।
- source_word: יֵחָשֵׁב
  choice: समझा जाएगा
  rationale: חשב के निफ़अल रूप का निष्क्रिय, मूल्यांकनात्मक अर्थ है—किसी वस्तु को किसी रूप में माना या समझा जाना।
theological_decisions:
- issue: परिवर्तन के चित्र का स्वरूप
  choice: भूमि की दशा में नाटकीय उलटफेर और नवीकरण की भविष्यसूचक छवि को ज्यों का त्यों रखना
  alternative: इसे केवल शाब्दिक कृषि-परिवर्तन या केवल सामाजिक-आध्यात्मिक रूपक के रूप में स्पष्ट करना
  rationale: इब्रानी पाठ परिवर्तन और नवीकरण को स्पष्ट करता है, पर यह निश्चित नहीं करता कि संकेत शाब्दिक है, रूपकात्मक है, या दोनों; अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और प्रश्नात्मक शैली रखी गई है। 'बहुत ही थोड़ा समय' मूल की तीव्र संक्षिप्तता को व्यक्त करता है। समान इब्रानी संज्ञा כַּרְמֶל को दोनों स्थानों पर एक ही प्रकार से अनूदित किया गया है।
