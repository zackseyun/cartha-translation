base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/020.yaml
  text: For the ruthless one will come to nothing[a], the scoffer will be finished[b], and all who watch for wrongdoing will be cut off.
translation:
  language: hi
  text: क्योंकि निर्दयी व्यक्ति मिट जाएगा[a], उपहास करनेवाले का अंत हो जाएगा, और वे सभी जो अनर्थ की ताक में रहते हैं[b], काट डाले जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अत्याचारी’। इब्रानी शब्द עָרִיץ किसी दमनकारी या हिंसक व्यक्ति को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘वे सभी जो बुराई के लिए तत्पर रहते हैं’ अथवा ‘वे सभी जो अनर्थ के लिए घात लगाए रहते हैं’। इब्रानी कृदंत सजग, जानबूझकर और लगातार ध्यान लगाए रहने का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन में दी गई प्रतिज्ञा का आधार बताता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָפֵס
  choice: मिट जाएगा
  rationale: क्रिया समाप्त हो जाने या अस्तित्व में न रहने का भाव देती है; ‘मिट जाएगा’ भावी परिणाम को सहज हिन्दी में व्यक्त करता है।
- source_word: עָרִיץ
  choice: निर्दयी
  rationale: यह शब्द हिंसक और अत्याचारी व्यक्ति को सूचित कर सकता है; ‘निर्दयी’ इसके व्यापक नैतिक अर्थ को बनाए रखता है, जबकि ‘अत्याचारी’ पादटिप्पणी में विकल्प के रूप में दिया गया है।
- source_word: וְכָלָה
  choice: का अंत हो जाएगा
  rationale: क्रिया के समाप्त या पूरा हो जाने के अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֵץ
  choice: ठट्ठा करनेवाला
  rationale: यह घमंडी तिरस्कार के साथ उपहास करनेवाले व्यक्ति को दर्शाता है; यह सामान्य पाठकों के लिए स्पष्ट है।
- source_word: וְנִכְרְתוּ
  choice: काट डाले जाएँगे
  rationale: निफ़अल रूप में ‘काट दिया जाना’ या समुदाय से हटा दिया जाना निहित है; यह मूल रूपक और न्याय-संबंधी गंभीरता दोनों को बनाए रखता है।
- source_word: כָּל
  choice: सभी
  rationale: मूल के समावेशी सामूहिक अर्थ को सीधे व्यक्त करता है।
- source_word: שֹׁקְדֵי
  choice: ताक में रहते हैं
  rationale: कृदंत सजग, लगातार और जानबूझकर ध्यान लगाए रहने का भाव देता है; ‘ताक में रहते हैं’ अवसर खोजने की सक्रियता को व्यक्त करता है।
- source_word: אָוֶן
  choice: बुराई
  rationale: यहाँ शब्द नैतिक दुष्टता या अनर्थकारी काम को दर्शाता है; ‘बुराई’ आधुनिक हिन्दी में व्यापक और स्पष्ट है।
