  text: וַ/יֹּ֣אמֶר אֲדֹנָ֗/י יַ֚עַן כִּ֤י נִגַּשׁ֙ הָ/עָ֣ם הַ/זֶּ֔ה בְּ/פִ֤י/ו וּ/בִ/שְׂפָתָי/ו֙ כִּבְּד֔וּ/נִי וְ/לִבּ֖/וֹ רִחַ֣ק מִמֶּ֑/נִּי וַ/תְּהִ֤י יִרְאָתָ/ם֙ אֹתִ֔/י מִצְוַ֥ת אֲנָשִׁ֖ים מְלֻמָּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/013.yaml
  text: 'And the Lord said: Because this people draws near with its mouth and honors me with its lips[a], while its heart is far from me, and their fear of me has become a commandment of men that is taught[b],'
translation:
  language: hi
  text: और प्रभु ने कहा, “चूँकि ये लोग अपने मुँह से मेरे निकट आते और अपने होंठों से मेरा आदर करते हैं, पर उनका हृदय मुझसे दूर है, और मेरे प्रति उनका भय[a] मनुष्यों की सिखाई हुई आज्ञा[b] बन गया है,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे प्रति उनकी श्रद्धा” अथवा “मेरी उपासना”; इब्रानी में शाब्दिक रूप से “मेरे प्रति उनका भय।”
    reason: lexical_alternative
  - marker: b
    text: या, “सीखी या सिखाई गई मानवीय आज्ञा।” यह वाक्यांश ऐसी भक्ति की आलोचना करता है जो केवल मनुष्यों की शिक्षा बनकर रह गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यहाँ इब्रानी पाठ में परमेश्वर के लिए उपाधि אֲדֹנָי है, इसलिए इसे स्वाभाविक और प्रतिष्ठित हिन्दी में ‘प्रभु’ कहा गया है।
- source_word: יַעַן כִּי
  choice: चूँकि
  rationale: यह पद अगले कथन का कारण प्रस्तुत करता है; ‘चूँकि’ उस कारणात्मक संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: נִגַּשׁ
  choice: निकट आते
  rationale: क्रिया का मूल अर्थ पास या निकट आना है और इस प्रसंग में उसमें धार्मिक निकटता का संकेत भी बना रहता है।
- source_word: הָעָם הַזֶּה
  choice: ये लोग
  rationale: शाब्दिक रूप ‘यह प्रजा’ है, पर आगे के बहुवचन और आधुनिक हिन्दी की स्वाभाविकता के लिए ‘ये लोग’ चुना गया है; सामूहिक अर्थ बना रहता है।
- source_word: בְּפִיו וּבִשְׂפָתָיו
  choice: अपने मुँह से ... अपने होंठों से
  rationale: ‘मुँह’ और ‘होंठ’ दोनों को रखकर बाहरी वाणी का इब्रानी समानांतर अलंकार सुरक्षित रखा गया है।
- source_word: כִּבְּדוּנִי
  choice: मेरा आदर करते हैं
  rationale: כבד यहाँ सम्मान देने के अर्थ में है; ‘आदर करना’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: לִבּוֹ רִחַק מִמֶּנִּי
  choice: उनका हृदय मुझसे दूर है
  rationale: यह बाहरी निकटता और भीतरी दूरी के तीखे विरोध को सहज हिन्दी में बनाए रखता है।
- source_word: וַתְּהִי
  choice: बन गया है
  rationale: यह परिणामी अवस्था को व्यक्त करता है—परमेश्वर का भय अब मानवीय नियम में बदल गया है।
- source_word: יִרְאָתָם אֹתִי
  choice: मेरा भय मानना
  rationale: יִרְאָה के मूल ‘भय’ को मुख्य पाठ में सुरक्षित रखते हुए हिन्दी का प्रचलित धार्मिक मुहावरा अपनाया गया है; श्रद्धा और उपासना की संभावित छायाएँ पादटिप्पणी में दी गई हैं।
- source_word: מִצְוַת אֲנָשִׁים
  choice: मनुष्यों की ... आज्ञा
  rationale: सम्बन्धवाचक इब्रानी संरचना और इस आलोचना को सुरक्षित रखा गया है कि परमेश्वर-भक्ति केवल मानवीय आदेश बन गई है। ‘मनुष्य’ यहाँ सामान्य रूप से मानवों को सूचित करता है।
- source_word: מְלֻמָּדָה
  choice: सिखाई हुई
  rationale: निष्क्रिय कृदन्त का सीधा अर्थ सिखाई गई वस्तु है। ‘रटाई हुई’ अधिक व्याख्यात्मक होता, इसलिए उसे मुख्य पाठ में नहीं लिया गया।
theological_decisions:
- issue: परमेश्वर के प्रति יִרְאָה का अर्थ
  choice: मेरा भय मानना
  alternative: मेरे प्रति श्रद्धा; मेरी उपासना
  rationale: इब्रानी शब्द भय, श्रद्धा और भक्तिपूर्ण उपासना के अर्थ-क्षेत्र को छूता है। मुख्य पाठ में ‘भय’ रखने से सच्चे परमेश्वर-भय और केवल मानवीय शिक्षा से बनी धार्मिकता के बीच का तनाव सुरक्षित रहता है।
- issue: אֲנָשִׁים का सामान्य मानवीय अर्थ
  choice: मनुष्यों की
  alternative: लोगों की; मानवीय
  rationale: यहाँ पुल्लिंग बहुवचन सामान्यतः मानवों को सूचित करता है। ‘मनुष्यों’ स्रोत के रूप और सामान्य मानवीय आशय दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- issue: बाहरी सम्मान और भीतरी दूरी का विरोध
  choice: मुँह और होंठों के आदर के विपरीत हृदय की दूरी को स्पष्ट रखा गया
  alternative: इसे सामान्यतः कपट या पाखंड कहना
  rationale: पाठ उस आचरण का वर्णन करता है, पर उसे सीधे ‘पाखंड’ कहना व्याख्यात्मक निष्कर्ष जोड़ देता। इसलिए मूल बिंब और उसका धर्मवैचारिक तनाव यथावत रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मुँह—होंठ’ तथा ‘निकट—दूर’ के काव्यात्मक विरोध सुरक्षित हैं। वाक्य के अंत में अल्पविराम रखा गया है क्योंकि कारणसूचक कथन अगले पद में जारी रहता है।
