id: ISA.29.14
reference: Isaiah 29:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵ֗ן הִנְ/נִ֥י יוֹסִ֛ף לְ/הַפְלִ֥יא אֶת הָֽ/עָם הַ/זֶּ֖ה הַפְלֵ֣א וָ/פֶ֑לֶא וְ/אָֽבְדָה֙ חָכְמַ֣ת חֲכָמָ֔י/ו וּ/בִינַ֥ת נְבֹנָ֖י/ו תִּסְתַּתָּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/014.yaml
  text: Therefore[a], behold, I will again do something astonishing with this people—something astonishing and marvelous; and the wisdom of its wise men will perish, and the understanding of its discerning men will hide itself.
translation:
  language: hi
  text: इसलिए, देखो, मैं फिर इस प्रजा के साथ अद्भुत रीति से कार्य करूँगा—आश्चर्य पर आश्चर्य; इसके बुद्धिमानों की बुद्धि नष्ट हो जाएगी, और इसके समझदारों की समझ छिप जाएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले आरोप से निकलने वाले परिणाम को व्यक्त करने वाला स्वाभाविक और स्पष्ट निष्कर्षसूचक शब्द है।
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: यह भविष्यवाणी की गंभीर ध्यानाकर्षक अभिव्यक्ति और प्रथम पुरुष, दोनों को बनाए रखता है।
- source_word: יוֹסִף לְהַפְלִיא
  choice: फिर एक अद्भुत काम करूँगा
  rationale: יסף के साथ अनंत क्रिया यहाँ दोबारा या आगे एक असाधारण कार्य करने का भाव देती है; यह हिन्दी में स्वाभाविक रहते हुए क्रियात्मक बल को सुरक्षित रखता है।
- source_word: הָעָם הַזֶּה
  choice: इस प्रजा
  rationale: एकवचन सामूहिक संज्ञा और संकेतवाचक विशेषण को भविष्यवाणी-साहित्य के अनुरूप रखा गया है।
- source_word: הַפְלֵא וָפֶלֶא
  choice: अद्भुत-पर-अद्भुत काम
  rationale: פלא शब्द-समूह की पुनरुक्ति को हिन्दी की तीव्रतासूचक रचना द्वारा सुरक्षित रखा गया है।
- source_word: וְאָבְדָה חָכְמַת חֲכָמָיו
  choice: इसके बुद्धिमानों की बुद्धि नष्ट हो जाएगी
  rationale: אָבד के प्रबल विनाश या लोप के भाव तथा सामूहिक प्रजा की ओर संकेत करने वाले प्रत्यय को स्पष्ट रूप से व्यक्त करता है।
- source_word: וּבִינַת נְבֹנָיו
  choice: इसके समझदारों की समझ
  rationale: בינה और נבון के एक ही अर्थ-क्षेत्र को हिन्दी में समान शब्द-मूल वाली स्वाभाविक अभिव्यक्ति से दिखाया गया है।
- source_word: תִּסְתַּתָּר
  choice: छिप जाएगी
  rationale: हिब्रू क्रिया के आत्मवाचक या कर्मवाच्य-सदृश भाव को बिना यह तय किए बनाए रखता है कि समझ को कौन छिपाता है।
theological_decisions:
- issue: बुद्धिमान और समझदार समूह का लिंग-सूचक वर्णन
  choice: बुद्धिमानों / समझदारों
  alternative: बुद्धिमान पुरुषों / समझदार पुरुषों
  rationale: हिब्रू रूप पुल्लिंग बहुवचन हैं, पर हिन्दी में ये संज्ञीकृत रूप सामान्यतः ऐसे वर्ग या समूह को स्वाभाविक ढंग से व्यक्त करते हैं; अलग से “पुरुषों” जोड़ना स्रोत से अधिक स्पष्ट लिंग-बल देता।
- issue: פלא की पुनरुक्ति का अर्थ
  choice: अद्भुत-पर-अद्भुत काम
  alternative: अत्यन्त अद्भुत काम
  rationale: यह परमेश्वर के असाधारण न्यायकारी कार्य की तीव्रता को बनाए रखता है, पर उसकी प्रकृति के विषय में पाठ से आगे कोई विशिष्ट धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
- issue: תִּסְתַּתָּר का कर्तृवाच्य या कर्मवाच्य भाव
  choice: छिप जाएगी
  alternative: छिपा दी जाएगी
  rationale: चुना हुआ रूप मूल की आत्मवाचक/कर्मवाच्य अस्पष्टता को सुरक्षित रखता है और किसी अनुल्लिखित कर्ता को स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, भविष्यवाणी-साहित्य के अनुकूल शैली रखी गई है। “प्रजा,” “बुद्धि” और “समझ” सामान्य पाठक के लिए बोधगम्य हैं; पुनरुक्ति की काव्यात्मक शक्ति “अद्भुत-पर-अद्भुत” से सुरक्षित है।
