base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/016.yaml
  text: You turn things upside down! Shall the potter be regarded as clay[a], that what is made should say of its maker, “He did not make me,” and what is formed say of the one who formed it, “He has no understanding”?
translation:
  language: hi
  text: तुम सब कुछ उलट-पुलट कर देते हो! क्या कुम्हार को मिट्टी समझा जाए,[a] कि बनाई हुई वस्तु अपने बनाने वाले के विषय में कहे, “उसने मुझे नहीं बनाया,” और गढ़ी हुई वस्तु अपने गढ़ने वाले के विषय में कहे, “उसे समझ नहीं है”?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में आरम्भिक शब्दों का अर्थ हो सकता है, “तुम्हारा सब कुछ उलट-पुलट करना!” कुछ लोग इसे “तुम्हारी कुटिलता!” समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְכְּכֶם
  choice: तुम सब कुछ उलट-पुलट कर देते हो!
  rationale: प्रत्यययुक्त संज्ञात्मक और संक्षिप्त इब्रानी पद यहाँ विस्मयात्मक फटकार है। क्रियात्मक हिन्दी संदर्भ में वास्तविकता और उचित क्रम को उलट देने का भाव स्वाभाविक ढंग से व्यक्त करती है।
- source_word: אִם
  choice: क्या ... समझा जाए
  rationale: यह साधारण शर्त नहीं, बल्कि असंगति दिखाने वाला आलंकारिक प्रश्न आरम्भ करता है।
- source_word: כְּחֹמֶר
  choice: मिट्टी के समान
  rationale: חֹמֶר कुम्हार द्वारा प्रयुक्त मिट्टी है; यह चयन मूल ठोस रूपक को स्पष्ट रखता है।
- source_word: הַיֹּצֵר
  choice: कुम्हार
  rationale: יצר का मूल अर्थ ‘गढ़ना’ है, पर मिट्टी के साथ इसका ठोस संदर्भ कुम्हार का है।
- source_word: יֵחָשֵׁב
  choice: समझा जाए
  rationale: निफ़अल रूप का अर्थ ‘माना/आंका जाए’ है; ‘समझा जाए’ आधुनिक हिन्दी में आलंकारिक प्रश्न के अनुकूल है।
- source_word: מַעֲשֶׂה
  choice: बनाई हुई वस्तु
  rationale: बनाने वाले और बनाई हुई चीज़ के विरोध में यह अमूर्त ‘काम’ के बजाय निर्मित वस्तु को सूचित करता है।
- source_word: לְעֹשֵׂהוּ
  choice: अपने बनाने वाले के विषय में
  rationale: אמר के बाद ל उस व्यक्ति को सूचित कर सकता है जिससे या जिसके विषय में बात कही जाती है; यहाँ हिन्दी में ‘के विषय में कहे’ उद्धरण के साथ स्वाभाविक है।
- source_word: לֹא עָשָׂנִי
  choice: उसने मुझे नहीं बनाया
  rationale: पूर्ण क्रिया सृष्टिकर्तृत्व या निर्माण के स्पष्ट निषेध को व्यक्त करती है; भूतकाल हिन्दी में सीधे सुरक्षित है।
- source_word: יֵצֶר
  choice: गढ़ी हुई वस्तु
  rationale: यह समानांतर पंक्ति में आकार दी गई उपज को दर्शाता है; ‘गढ़ी हुई’ יצר की गठन-संबंधी छटा बनाए रखता है।
- source_word: לְיוֹצְרוֹ
  choice: अपने गढ़ने वाले के विषय में
  rationale: यह पहली पंक्ति का समानांतर बनाए रखता और יצר से शब्दगत संबंध को हिन्दी में ‘गढ़ने’ द्वारा प्रकट करता है।
- source_word: לֹא הֵבִין
  choice: उसमें समझ नहीं है
  rationale: בין का हिफ़ील यहाँ समझ या विवेक रखने का अर्थ देता है; यह वाक्य निर्माता की बुद्धि पर आरोप को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: कुम्हार और मिट्टी का रूपक
  choice: ‘कुम्हार’ और ‘मिट्टी’ के ठोस रूपक को स्पष्ट रूप से बनाए रखा गया।
  alternative: इसे अमूर्त रूप में ‘सृष्टिकर्ता’ और ‘सृष्टि’ कहना, अथवा अधिक शाब्दिक ‘गढ़ने वाला’ कहना।
  rationale: पद का बल रचने वाले और रची हुई वस्तु के उचित संबंध को बेतुके ढंग से उलटने पर है। ठोस रूपक को बनाए रखने से उसका भविष्यवाणी-संबंधी और व्यापक बाइबलीय प्रतिध्वनि सुरक्षित रहती है, बिना अतिरिक्त सिद्धान्त जोड़ने के।
- issue: आरम्भिक संक्षिप्त उद्गार
  choice: इसे फटकार के रूप में ‘तुम सब कुछ उलट-पुलट कर देते हो!’ अनूदित किया गया।
  alternative: ‘तुम्हारी उलटबाँसी!’ या ‘तुम्हारी कुटिलता!’
  rationale: इब्रानी पद संक्षिप्त और व्याख्यात्मक रूप से विवादित है। चुना हुआ पाठ संदर्भ में उचित क्रम के उलटाव को व्यक्त करता है, जबकि पादटिप्पणी शाब्दिक और नैतिक वैकल्पिक समझ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट शैली। समानांतरता बनाए रखने हेतु ‘बनाई हुई वस्तु/बनाने वाला’ और ‘गढ़ी हुई वस्तु/गढ़ने वाला’ रखा गया है। आरम्भ में बहुवचन ‘तुम’ मूल के द्वितीय पुरुष बहुवचन को दर्शाता है।
