source:
  edition: WLC
  text: הִתְמַהְמְה֣וּ וּ/תְמָ֔הוּ הִשְׁתַּֽעַשְׁע֖וּ וָ/שֹׁ֑עוּ שָֽׁכְר֣וּ וְ/לֹא יַ֔יִן נָע֖וּ וְ/לֹ֥א שֵׁכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/009.yaml
  text: Be stunned and be astonished[a]; blind yourselves and be blind. They are drunk, but not with wine; they stagger[b], but not from strong drink.
translation:
  language: hi
  text: ठिठक जाओ और चकित रहो[a]; अपने आपको अंधा कर लो और अंधे हो जाओ[b]। वे मतवाले हैं, पर दाखमधु से नहीं; वे लड़खड़ाते हैं, पर मादक पेय से नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ठहरो और विस्मित होओ।” पहली दो आज्ञाओं में विस्मय से ठिठकने के साथ-साथ देर करने का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी की ये दोनों क्रियाएँ दुर्लभ और अर्थ की दृष्टि से कठिन हैं; इनसे अंधा हो जाने, अपने आपको अंधा करने या स्तब्ध रह जाने का भाव निकल सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְמַהְמְהוּ
  choice: ठिठक जाओ
  rationale: हित्पएल आज्ञार्थक बहुवचन में ठहरने, हिचकने या स्तब्ध होकर ठिठकने का भाव हो सकता है। यह चयन समयगत विलंब और विस्मयजनित जड़ता—दोनों की संभावना को खुला रखता है।
- source_word: וּתְמָהוּ
  choice: और चकित रहो
  rationale: क्रिया विस्मित, चकित या स्तब्ध होने का अर्थ देती है और पहली आज्ञा के साथ काव्यात्मक समानांतर बनाती है।
- source_word: הִשְׁתַּעַשְׁעוּ
  choice: अपने आपको अंधा कर लो
  rationale: इस दुर्लभ रूप को संदर्भ और अगली समानांतर क्रिया के आधार पर आत्म-अंधता या स्तब्धता के अर्थ में लिया गया है; पाठ की कठिनता पादटिप्पणी में स्पष्ट की गई है।
- source_word: וָשֹׁעוּ
  choice: और अंधे हो जाओ
  rationale: दुर्लभ क्रिया यहां अंधा, दृष्टिहीन या स्तब्ध होने का संकेत देती है। संक्षिप्त अनुवाद इब्रानी समानांतरता बनाए रखता है।
- source_word: שָׁכְרוּ
  choice: वे मतवाले हैं
  rationale: पूर्ण क्रिया आज्ञाओं के बाद जीवंत वर्णन के रूप में प्रयुक्त है। वर्तमान दशा बताने वाला हिन्दी रूप स्वाभाविक है।
- source_word: וְלֹא יַיִן
  choice: पर दाखमधु से नहीं
  rationale: नकारात्मक संज्ञा-पद बताता है कि मतवालापन वास्तविक दाखमधु से उत्पन्न नहीं हुआ; इससे रूपक बिना विस्तार के सुरक्षित रहता है।
- source_word: נָעוּ
  choice: वे लड़खड़ाते हैं
  rationale: क्रिया डोलने, झूमने या लड़खड़ाने का बोध देती है। ‘लड़खड़ाते’ नशे की छवि के साथ स्पष्ट और स्वाभाविक है।
- source_word: וְלֹא שֵׁכָר
  choice: पर मदिरा के कारण नहीं
  rationale: שֵׁכָר दाखमधु से अलग अन्य मादक पेय को सूचित करता है। हिन्दी में ‘मदिरा’ इस भेद को पर्याप्त रूप से व्यक्त करती है, जबकि ‘के कारण नहीं’ स्रोत या कारण का संबंध स्पष्ट करता है।
theological_decisions:
- issue: मतवालेपन और अंधेपन की छवि का स्वरूप
  choice: आत्मिक स्तब्धता और अंधेपन के रूपक को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: इसे शाब्दिक नशा कहना, या मुख्य पाठ में ‘ईश्वरीय कठोरता’ जैसी व्याख्या जोड़ना।
  rationale: पद स्वयं कहता है कि यह दशा दाखमधु या अन्य मदिरा से नहीं है। इसलिए रूपक स्पष्ट है, पर उसका पूरा धर्मवैचारिक अर्थ निकटवर्ती संदर्भ पर छोड़ा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए बोधगम्य रूप। ‘दाखमधु’ और ‘मदिरा’ से יַיִן तथा שֵׁכָר का भेद रखा गया है। दुर्लभ आज्ञार्थक क्रियाओं की वास्तविक अनिश्चितता पादटिप्पणियों में सुरक्षित है।
