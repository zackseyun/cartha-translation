source:
  edition: WLC
  text: מֵ/עִ֨ם יְהוָ֤ה צְבָאוֹת֙ תִּפָּקֵ֔ד בְּ/רַ֥עַם וּ/בְ/רַ֖עַשׁ וְ/ק֣וֹל גָּד֑וֹל סוּפָה֙ וּ/סְעָרָ֔ה וְ/לַ֖הַב אֵ֥שׁ אוֹכֵלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/006.yaml
  text: From Yahweh of hosts you will be visited with thunder and with earthquake and a great noise[a], with whirlwind and storm[c][b], and with the flame of a consuming fire.
translation:
  language: hi
  text: सेनाओं के याहवे की ओर से तुम्हारी सुध ली जाएगी[a]—गरज, भूकम्प[b] और प्रचण्ड ध्वनि[c] के साथ, बवंडर और आँधी के साथ, और भस्म करने वाली आग की ज्वाला के साथ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हें दण्ड दिया जाएगा।” इब्रानी क्रिया का शाब्दिक भाव किसी की सुध लेने या उसका निरीक्षण करने का है; यह दैवी हस्तक्षेप आशीष या न्याय के लिए हो सकता है। यहाँ प्रसंग न्याय का संकेत देता है।
    reason: lexical_alternative
  - marker: b
    text: या “कम्पन।”
    reason: lexical_alternative
  - marker: c
    text: या “भारी ध्वनि।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעִם
  choice: की ओर से
  rationale: यहाँ निफ़अल क्रिया के साथ यह पूर्वसर्ग दैवी कार्रवाई के स्रोत को सूचित करता है; ‘की ओर से’ स्वाभाविक हिन्दी में उस भाव को रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को ‘यहवे’ के रूप में रखा गया है और צְבָאוֹת को व्यापक, पारंपरिक अर्थ ‘सेनाओं’ से व्यक्त किया गया है।
- source_word: תִּפָּקֵד
  choice: तुम पर ध्यान दिया जाएगा
  rationale: פקד के निफ़अल रूप में निहित ‘भेंट/सुध लेने/कार्रवाई करने’ की व्यापकता बचती है। हिन्दी में ‘भेंट की जाएगी’ यहाँ भ्रामक है; ‘ध्यान दिया जाएगा’ दैवी हस्तक्षेप का मुहावरा रखता है, जबकि प्रसंग उसे दण्डात्मक ठहराता है।
- source_word: בְּרַעַם
  choice: गरज के साथ
  rationale: दैवी आगमन के साथ उपस्थित प्राकृतिक घटना के रूप में רעם का सीधा और स्वाभाविक अनुवाद।
- source_word: וּבְרַעַשׁ
  choice: भूकम्प
  rationale: רעש कम्पन या भूकम्प दोनों कह सकता है; इस प्रलयंकारी दृश्य में ‘भूकम्प’ ठोस और प्रसंगोचित है।
- source_word: וְקוֹל גָּדוֹל
  choice: प्रचण्ड ध्वनि
  rationale: קול यहाँ किसी वक्ता की वाणी नहीं, बड़ी या ऊँची ध्वनि है; ‘प्रचण्ड’ उसकी तीव्रता और काव्यात्मक गरिमा व्यक्त करता है।
- source_word: סוּפָה וּסְעָרָה
  choice: बवंडर और आँधी
  rationale: दोनों निकटार्थी शब्दों को अलग रखते हुए हिंसक मौसम की क्रमिक छवि बचाई गई है।
- source_word: וְלַהַב אֵשׁ אוֹכֵלָה
  choice: भस्म करने वाली आग की ज्वाला
  rationale: ज्वाला और विनाशकारी आग, दोनों चित्रों को स्पष्ट तथा स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: פקד में दैवी कार्रवाई का स्वरूप
  choice: मुख्य पाठ में अपेक्षाकृत व्यापक ‘तुम पर ध्यान दिया जाएगा’ रखा गया है।
  alternative: ‘तुम्हें दण्ड दिया जाएगा’ या ‘तुम्हारी सुध ली जाएगी’
  rationale: इब्रानी क्रिया स्वयं आशीष या न्याय, दोनों प्रकार के दैवी हस्तक्षेप के लिए प्रयुक्त हो सकती है। यहाँ प्रसंग न्याय दर्शाता है, पर मुख्य पाठ में क्रिया की वास्तविक व्यापकता बचाई गई है और पादटिप्पणी दण्डात्मक अर्थ स्पष्ट करती है।
- issue: יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा या प्रभु
  rationale: इब्रानी पाठ के व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। समानार्थी तूफ़ानी शब्दों का भेद रखा गया है और न्याय का प्रसंग स्पष्ट रहते हुए פקד की मूल अर्थगत व्यापकता को पादटिप्पणी सहित सुरक्षित किया गया है।
