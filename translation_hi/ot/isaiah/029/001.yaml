source:
  edition: WLC
  text: ה֚וֹי אֲרִיאֵ֣ל אֲרִיאֵ֔ל קִרְיַ֖ת חָנָ֣ה דָוִ֑ד סְפ֥וּ שָׁנָ֛ה עַל שָׁנָ֖ה חַגִּ֥ים יִנְקֹֽפוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/001.yaml
  text: Ah[a], Ariel, Ariel, the city where David encamped! Add year to year; let the feasts run their round.
translation:
  language: hi
  text: हाय, अरीएल, अरीएल—वह नगर जहाँ दाऊद ने डेरा डाला! वर्ष पर वर्ष जोड़ते जाओ; पर्वों को अपना चक्र पूरा करने दो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “अरीएल” यरूशलेम का एक नाम है; इब्रानी शब्द में “वेदी का अग्निकुंड” या “परमेश्वर का सिंह” का संकेत भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: हाय
  rationale: यह विस्मयादिबोधक शब्द विलाप, चेतावनी या ध्यान आकर्षित करने वाला संबोधन व्यक्त कर सकता है। यहाँ “हाय” उसके गंभीर और अशुभ स्वर को रखता है, पर इसे केवल स्पष्ट दंड-घोषणा तक सीमित नहीं करता।
- source_word: אֲרִיאֵל
  choice: अरीएल
  rationale: यहाँ यह यरूशलेम का नाम है, जैसा आगे दाऊद के नगर का संकेत स्पष्ट करता है। लिप्यंतरण से नाम और उससे जुड़ी इब्रानी शब्द-क्रीड़ा दोनों सुरक्षित रहते हैं।
- source_word: קִרְיַת חָנָה דָוִד
  choice: वह नगर जहाँ दाऊद ने छावनी डाली थी
  rationale: חנה का मूल भाव डेरा डालना या छावनी करना है। यह अनुवाद दाऊद और यरूशलेम के ऐतिहासिक-सैन्य संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: סְפוּ שָׁנָה עַל שָׁנָה
  choice: वर्ष पर वर्ष जोड़ते जाओ
  rationale: बहुवचन आज्ञार्थक क्रिया और समय की पुनरावृत्ति दोनों को संक्षिप्त, प्रवाहपूर्ण हिन्दी में रखा गया है।
- source_word: חַגִּים
  choice: पर्व
  rationale: यह इस्राएल के नियमित धार्मिक उत्सवों को दर्शाता है। “पर्व” आधुनिक हिन्दी में सहज है और उपासना-संबंधी संदर्भ भी बनाए रखता है।
- source_word: יִנְקֹפוּ
  choice: अपना चक्र पूरा करते रहें
  rationale: क्रिया घूमने, चक्कर लगाने या आवर्ती क्रम पूरा होने का भाव देती है। वार्षिक पर्वों के संदर्भ में यह उनके बार-बार लौटने का अर्थ स्पष्ट करता है।
theological_decisions:
- issue: אֲרִיאֵל को अर्थानुवाद किया जाए या स्थान-नाम के रूप में रखा जाए
  choice: मुख्य पाठ में “अरीएल” नाम रखा गया और उसके संभावित अर्थ पादटिप्पणी में दिए गए।
  alternative: इसे “वेदी की अग्निकुंड” अथवा “परमेश्वर का सिंह” के रूप में अनूदित करना।
  rationale: दोहराया गया रूप संबोधन में स्थान-नाम की तरह काम करता है और अगला वाक्यांश इसे दाऊद से जुड़े नगर, अर्थात यरूशलेम, के रूप में पहचानता है। नाम को बनाए रखने से भविष्यवाणी की शब्द-क्रीड़ा और अर्थगत तनाव सुरक्षित रहता है।
- issue: पर्वों के चक्र का वाक्य आज्ञा है या अनुमति/विडंबनापूर्ण निरंतरता
  choice: “पर्व अपना चक्र पूरा करते रहें” द्वारा अनुमति अथवा व्यंग्यपूर्ण निरंतरता की छाया रखी गई।
  alternative: “पर्वों को अपना चक्र पूरा करने दो” या स्पष्ट भविष्यवाणी के रूप में “पर्व अपना चक्र पूरा करेंगे।”
  rationale: इब्रानी अपूर्ण क्रिया आज्ञार्थक “जोड़ते जाओ” के बाद आती है और यहाँ समय तथा धार्मिक दिनचर्या को चलते रहने देने का भाव दे सकती है। हिन्दी रूप इस अस्पष्टता को अनावश्यक रूप से कठोर आदेश या निश्चित भविष्यवाणी नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। “हाय” भविष्यद्वाणी के गंभीर संबोधन को, “छावनी डाली” ऐतिहासिक चित्र को, और “चक्र पूरा करते रहें” वार्षिक धार्मिक पुनरावृत्ति को व्यक्त करता है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में सम्मिलित है।
