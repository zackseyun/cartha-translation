source:
  edition: WLC
  text: וְ/הָיָ֗ה כַּֽ/חֲלוֹם֙ חֲז֣וֹן לַ֔יְלָה הֲמוֹן֙ כָּל הַ/גּוֹיִ֔ם הַ/צֹּבְאִ֖ים עַל אֲרִיאֵ֑ל וְ/כָל צֹבֶ֨י/הָ֙ וּ/מְצֹ֣דָתָ֔/הּ וְ/הַ/מְּצִיקִ֖ים לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/007.yaml
  text: And the multitude of all the nations that wage war against Ariel[a], even all who wage war against her and her stronghold, and who distress her, will be like a dream[c][b], a vision of the night.
translation:
  language: hi
  text: और अरिएल[a] के विरुद्ध युद्ध करनेवाली सभी जातियों की भीड़—वे सभी जो उसके और उसके गढ़[b] के विरुद्ध युद्ध करते और उसे संकट में डालते हैं—एक स्वप्न, रात के दर्शन[c] के समान हो जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस प्रसंग में ‘अरिएल’ यशायाह द्वारा यरूशलेम के लिए प्रयुक्त काव्यात्मक नाम है।
    reason: cross_reference
  - marker: b
    text: या ‘उसका दुर्ग’; कुछ लोग इसका अर्थ ‘उसके विरुद्ध घेराबंदी के मोर्चे’ समझते हैं।
    reason: lexical_alternative
  - marker: c
    text: या ‘रात का दर्शन।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: और ... हो जाएगी
  rationale: भविष्यसूचक प्रसंग में यह रूप आगे कही गई उपमा का परिचय देता है। ‘हो जाएगी’ हिन्दी में स्वाभाविक है और कर्ता ‘भीड़’ के साथ मेल खाता है।
- source_word: כַּחֲלוֹם
  choice: एक स्वप्न ... के समान
  rationale: उपसर्ग כ तुलना व्यक्त करता है। यह अनुवाद स्वप्न की क्षणभंगुरता को समझाए बिना मूल उपमा बनाए रखता है।
- source_word: חֲזוֹן לַיְלָה
  choice: रात का दर्शन
  rationale: यह संबंधवाचक पदबंध मूल के ‘रात के दर्शन’ अर्थ और ‘स्वप्न’ के साथ उसके काव्यात्मक समानांतर को सुरक्षित रखता है।
- source_word: הֲמוֹן כָּל הַגּוֹיִם
  choice: सभी जातियों की भीड़
  rationale: הֲמוֹן बड़ी अथवा कोलाहलपूर्ण भीड़ को और גּוֹיִם यहाँ विदेशी जातियों को सूचित करता है।
- source_word: הַצֹּבְאִים עַל
  choice: के विरुद्ध युद्ध करनेवाली
  rationale: צבא का कृदंत, עַל के साथ इस सैनिक प्रसंग में, किसी के विरुद्ध युद्ध करने का भाव देता है।
- source_word: אֲרִיאֵל
  choice: अरिएल
  rationale: काव्यात्मक स्थान-नाम का अर्थ खोलकर मुख्य पाठ में ‘यरूशलेम’ रखने के बजाय उसका लिप्यंतरण किया गया है।
- source_word: וְכָל צֹבֶיהָ
  choice: वे सभी जो उसके ... विरुद्ध युद्ध करते
  rationale: स्त्रीलिंग प्रत्यय अरिएल की ओर संकेत करता है। दोहराया हुआ ‘युद्ध करते’ निकटवर्ती צבא रूपों का शाब्दिक संबंध बनाए रखता है।
- source_word: וּמְצֹדָתָהּ
  choice: और उसके गढ़ के विरुद्ध
  rationale: מְצוֹדָה सामान्यतः गढ़ या दुर्ग को सूचित करता है। इसे पिछले युद्ध-संबंधी कृदंत के दूसरे लक्ष्य के रूप में रखा गया है, जबकि पाठगत अर्थ की अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: וְהַמְּצִיקִים לָהּ
  choice: और उसे संकट में डालते हैं
  rationale: यह कृदंत दबाव डालने, सताने या संकट पहुँचाने का व्यापक भाव रखता है; अनुवाद इसे केवल घेराबंदी की किसी एक सैनिक कार्रवाई तक सीमित नहीं करता।
theological_decisions:
- issue: ‘अरिएल’ का संदर्भ
  choice: मुख्य पाठ में काव्यात्मक नाम ‘अरिएल’ रखा गया है और पादटिप्पणी में यरूशलेम से उसकी पहचान बताई गई है।
  alternative: मुख्य पाठ में सीधे ‘यरूशलेम’ लिखा जाए।
  rationale: इब्रानी पाठ אֲרִיאֵל नाम का प्रयोग करता है। लिप्यंतरण मूल काव्यात्मक नाम को बनाए रखता है और व्याख्यात्मक पहचान को पाठ में मिलाने से बचाता है।
- issue: וּמְצֹדָתָהּ का वाक्यगत और अर्थगत संबंध
  choice: इसे अरिएल के ‘गढ़’ के रूप में और युद्ध के दूसरे लक्ष्य के रूप में अनूदित किया गया है।
  alternative: इसे अरिएल के विरुद्ध खड़े किए गए ‘घेराबंदी के मोर्चे’ के रूप में समझा जाए।
  rationale: मसोराई स्वरांकन और स्त्रीलिंग एकवचन प्रत्यय ‘उसका गढ़’ अर्थ का समर्थन करते हैं, पर सैन्य प्रसंग में वैकल्पिक व्याख्या संभव है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और काव्यात्मक रूप अपनाया गया है। लंबे इब्रानी वाक्य की मुख्य उपमा स्पष्ट रखने के लिए बीच के विवरण को डैश के भीतर रखा गया है; मूल की पुनरुक्ति और अर्थगत अनिश्चितता यथासंभव सुरक्षित रखी गई है।
