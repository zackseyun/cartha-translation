base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/004.yaml
  text: Surely he has borne our sicknesses and carried our pains[a]; yet we considered him stricken, struck by God[b], and afflicted.
translation:
  language: hi
  text: निश्चय ही उसने हमारे रोगों को अपने ऊपर ले लिया और हमारी पीड़ाओं का भार उठाया[a]; फिर भी हमने उसे प्रहारित, परमेश्वर का मारा हुआ[b] और पीड़ित समझा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “हमारे शोक” और “हमारे दुःख”। इब्रानी शब्दों का अधिक सीधा अर्थ रोग और पीड़ाएँ है।'
    reason: lexical_alternative
  - marker: b
    text: 'या: “परमेश्वर द्वारा मारा हुआ।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
  choice: निश्चय ही
  rationale: यह अभिव्यक्ति जोरदार पुष्टि के साथ पहले की धारणा को सुधारती है और अगले खंड के विरोध को उभारती है।
- source_word: חֳלָיֵנוּ
  choice: हमारे रोगों
  rationale: यह संज्ञा मुख्यतः बीमारी या रोग को सूचित करती है; इसलिए परंपरागत, अधिक सामान्य ‘दुःखों’ के बजाय ठोस शारीरिक अर्थ रखा गया है।
- source_word: נָשָׂא
  choice: अपने ऊपर ले लिया
  rationale: क्रिया किसी बोझ को उठाने और वहन करने का भाव देती है। यह आधुनिक हिन्दी में स्वाभाविक रहते हुए प्रतिनिधिक भार-वहन का संकेत बनाए रखती है।
- source_word: וּמַכְאֹבֵינוּ
  choice: हमारी पीड़ाओं
  rationale: मूल संज्ञा दर्द या पीड़ा, प्रायः शारीरिक पीड़ा, को बताती है; ‘पीड़ाएँ’ उस अर्थ को अनावश्यक रूप से केवल भावनात्मक शोक तक सीमित नहीं करती।
- source_word: סְבָלָם
  choice: भार उठाया
  rationale: यह क्रिया बोझ ढोने या वहन करने पर जोर देती है। ‘भार उठाया’ पहले क्रियापद से निकट संबंध रखते हुए उसकी अलग भार-वहन छवि भी व्यक्त करता है।
- source_word: וַאֲנַחְנוּ
  choice: फिर भी हमने
  rationale: संयोजक और सर्वनाम वास्तविकता तथा लोगों की धारणा के बीच स्पष्ट विरोध प्रस्तुत करते हैं।
- source_word: חֲשַׁבְנֻהוּ
  choice: उसे … समझा
  rationale: क्रिया का अर्थ किसी को ऐसा मानना या गिनना है; यह वर्तमान हिन्दी में सीधा और स्वाभाविक रूप है।
- source_word: נָגוּעַ
  choice: आहत
  rationale: निष्क्रिय कृदंत किसी प्रहार या विपत्ति से चोट खाए व्यक्ति का संकेत देता है। ‘आहत’ पीड़ा की प्रकृति को जरूरत से अधिक निश्चित किए बिना संक्षिप्त समानांतर संरचना बनाए रखता है।
- source_word: מֻכֵּה אֱלֹהִים
  choice: परमेश्वर का मारा हुआ
  rationale: यह हिन्दी मुहावरा मूल में स्पष्ट ईश्वरीय कर्तृत्व को बनाए रखता है, पर ‘मार डाला’ या ‘गिरा दिया’ जैसी अतिरिक्त धारणा नहीं जोड़ता।
- source_word: וּמְעֻנֶּה
  choice: और सताया हुआ
  rationale: यह रूप दुःख देकर दबाए या पीड़ित किए जाने का भाव रखता है। ‘सताया हुआ’ निष्क्रियता और निरंतर क्लेश दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: सेवक द्वारा उठाए गए बोझ को शारीरिक रोग की भाषा में रखा जाए या सामान्य भावनात्मक दुःख की भाषा में
  choice: मुख्य पाठ में ‘रोगों’ और ‘पीड़ाओं’ की ठोस भाषा
  alternative: ‘शोकों’ और ‘दुःखों’ जैसी अधिक सामान्य भाषा
  rationale: חֳלִי और מַכְאוֹב का प्राथमिक अर्थ रोग और दर्द है। व्यापक दुःख का अर्थ संभव है और पादटिप्पणी में दिया गया है, पर मुख्य पाठ मूल के ठोस शब्दार्थ को बनाए रखता है।
- issue: מֻכֵּה אֱלֹהִים में परमेश्वर के कर्तृत्व को कितना स्पष्ट रखा जाए
  choice: ‘परमेश्वर का मारा हुआ’ द्वारा कर्तृत्व स्पष्ट रखा गया
  alternative: ‘दंडित’ या केवल ‘पीड़ित’, जो या तो व्याख्या जोड़ते हैं या कर्तृत्व को धुंधला करते हैं
  rationale: मूल वाक्यांश प्रहार को परमेश्वर से स्पष्ट रूप से जोड़ता है। साथ ही पूरा खंड इसे लोगों की धारणा के रूप में प्रस्तुत करता है; अनुवाद उस तनाव को हल किए बिना बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर भार-वहन क्रियाओं तथा अंतिम तीन निष्क्रिय वर्णनों की काव्यात्मक लय सुरक्षित रखी गई है। ‘परमेश्वर का मारा हुआ’ को वक्ताओं की धारणा के भीतर रखा गया है, ताकि पद ईश्वरीय कर्तृत्व और मानवीय गलत आकलन के बीच मूल तनाव को स्वयं व्यक्त करे।
