source:
  edition: WLC
  text: כֻּלָּ֨/נוּ֙ כַּ/צֹּ֣אן תָּעִ֔ינוּ אִ֥ישׁ לְ/דַרְכּ֖/וֹ פָּנִ֑ינוּ וַֽ/יהוָה֙ הִפְגִּ֣יעַ בּ֔/וֹ אֵ֖ת עֲוֺ֥ן כֻּלָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/006.yaml
  text: All of us[a], like sheep, have gone astray; each of us has turned to his own way[c][b]; and Yahweh has laid on him the iniquity of us all.
translation:
  language: hi
  text: हम सब भेड़ों के समान भटक गए; हममें से हर एक[a] अपनी ही राह की ओर मुड़ गया; और याहवे ने हम सबका अधर्म[b] उसी पर डाल दिया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हर पुरुष”; यहाँ यह अभिव्यक्ति वितरणात्मक अर्थ में हम सबमें से प्रत्येक व्यक्ति को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: “अधर्म” का अर्थ “दोष” अथवा दोष के कारण आनेवाला दण्ड का दायित्व भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “याहवे ने हम सबके अधर्म को उसी पर आ पड़ने दिया” के स्थान पर अधिक निकटता से, “याहवे ने हम सबके अधर्म को उसी पर आ पड़ने या उसी पर एकत्र होने का कारण बनाया”; इब्रानी क्रिया किसी वस्तु को किसी पर आ पड़ने, उससे टकराने, या उस पर एकत्र होने का कारण बनाने का भाव दे सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: כֻּלָּנוּ
  choice: हम सब / हम सबका
  rationale: पद के आरम्भ और अन्त में आई समावेशी अभिव्यक्ति को बनाए रखता है और इब्रानी की बलाघाती आवृत्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כַּצֹּאן
  choice: भेड़ों के समान
  rationale: भटकने के क्रियापद के साथ भेड़ों का स्पष्ट उपमान सुरक्षित रहता है।
- source_word: תָּעִינוּ
  choice: भटक गए
  rationale: यह क्रिया मार्ग से भटकने या बहक जाने का अर्थ देती है; यहाँ भेड़ों के बिंब और नैतिक सन्दर्भ दोनों के अनुकूल है।
- source_word: אִישׁ לְדַרְכּוֹ פָּנִינוּ
  choice: हममें से हर एक अपनी ही राह पर मुड़ गया
  rationale: אִישׁ के वितरणात्मक एकवचन को ‘हर एक’ से और प्रथम पुरुष बहुवचन के सामूहिक दायरे को ‘हममें से’ से व्यक्त किया गया है। ‘अपनी ही राह’ प्रत्येक व्यक्ति के अलग, स्वनिर्धारित मार्ग पर बल देती है।
- source_word: וַיהוָה
  choice: और याहवे
  rationale: संयोजक वाव को ‘और’ से तथा परमेश्वर के व्यक्तिगत नाम יהוה को लिप्यन्तरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: הִפְגִּיעַ בּוֹ
  choice: उसी पर डाल दिया
  rationale: हिफ़ील रूप यहाँ सबके अधर्म को उस व्यक्ति पर आ पड़ने या एकत्र होने देने की कारक धारणा व्यक्त करता है। मुख्य पाठ में ‘डाल दिया’ स्पष्ट और स्वाभाविक है; अधिक शाब्दिक सम्भावना पाद-टिप्पणी में सुरक्षित है।
- source_word: עֲוֺן
  choice: अधर्म
  rationale: यह शब्द पापपूर्ण टेढ़ेपन, दोष और उससे जुड़ी दण्ड-देयता तक का अर्थ दे सकता है। ‘अधर्म’ नैतिक भार बनाए रखते हुए अर्थ को केवल दण्ड तक सीमित नहीं करता।
theological_decisions:
- issue: सेवक पर עָוֹן रखे जाने का प्रतिनिधिक अथवा स्थानापन्न अर्थ
  choice: याहवे ने हम सबका अधर्म उसी पर डाल दिया
  alternative: याहवे ने हम सबका दोष अथवा उसके दण्ड का भार उसी पर पड़ने दिया
  rationale: अनुवाद अधर्म के ‘उस पर’ रखे जाने की प्रबल प्रतिनिधिक धारणा को बनाए रखता है, पर उसके कार्यविधान को किसी विकसित धर्मसैद्धान्तिक सूत्र में नहीं बदलता।
- issue: אִישׁ का वितरणात्मक पुल्लिंग एकवचन
  choice: हममें से हर एक
  alternative: हर मनुष्य
  rationale: सन्दर्भ ‘हम सब’ का है और इब्रानी में אִישׁ वितरणात्मक रूप से प्रत्येक सदस्य की ओर संकेत करता है। ‘हममें से हर एक’ सार्वभौमिक दायरा और एक-एक व्यक्ति की जवाबदेही दोनों सुरक्षित रखता है।
- issue: יהוה का प्रस्तुतीकरण
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में उपस्थित व्यक्तिगत नाम को उपाधि में बदले बिना आधुनिक हिन्दी लिप्यन्तरण में प्रस्तुत किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानान्तर वाक्य-रचना और आरम्भ-अन्त के ‘हम सब’ को सुरक्षित रखा गया है। ‘उसी पर’ से सेवक की ओर संकेत स्पष्ट होता है, जबकि पाद-टिप्पणियाँ मूल शब्दों की वास्तविक अर्थ-व्याप्ति बनाए रखती हैं।
