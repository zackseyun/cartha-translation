base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/001.yaml
  text: Who has believed our report[a], and to whom has the arm of Yahweh been revealed?
translation:
  language: hi
  text: जो हमने सुना है, उस पर किसने विश्वास किया है[a], और याहवे की भुजा किस पर प्रकट हुई है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे समाचार पर” अथवा “हमारे संदेश पर।” इब्रानी शब्द का अर्थ सुनी गई, बताई गई या घोषित की गई बात हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הֶאֱמִין
  choice: किसने विश्वास किया है
  rationale: प्रश्नवाचक सर्वनाम और हिफ़ील क्रिया के आलंकारिक प्रश्न को स्वाभाविक हिन्दी पूर्णकाल में व्यक्त करता है।
- source_word: לִשְׁמֻעָתֵנוּ
  choice: हमारे समाचार पर
  rationale: שְׁמוּעָה सुनी हुई बात, समाचार, रिपोर्ट या संदेश को सूचित कर सकता है। प्रसंग में ‘हमारे समाचार’ संप्रेषित कथन का स्वाभाविक और पर्याप्त व्यापक हिन्दी रूप है; לִ को ‘पर’ से व्यक्त किया गया है।
- source_word: וּזְרוֹעַ
  choice: और ... भुजा
  rationale: शाब्दिक ‘भुजा’ को बनाए रखने से सामर्थ्य और उद्धारकारी कार्य का भविष्यद्वाणी-संबंधी रूपक सुरक्षित रहता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम का हिन्दी लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: עַל מִי נִגְלָתָה
  choice: किस पर प्रकट हुई है
  rationale: यह रूप इब्रानी עַל (‘पर’) और निफ़अल निष्क्रिय क्रिया (‘प्रकट हुई’) दोनों को निकटता से रखता है तथा हिन्दी में स्पष्ट है।
theological_decisions:
- issue: ‘याहवे की भुजा’ का रूपक
  choice: मुख्य पाठ में ‘याहवे की भुजा’ बनाए रखा गया
  alternative: ‘याहवे का सामर्थ्य’
  rationale: भुजा का बिंब परमेश्वर के प्रकट सामर्थ्य, उद्धार और न्याय से जुड़े व्यापक बाइबलीय प्रतिध्वनि को रखता है; इसे केवल ‘सामर्थ्य’ कहना रूपक की समृद्धि घटा देता।
- issue: שְׁמוּעָה का अर्थ
  choice: ‘हमारे समाचार’
  alternative: ‘हमारी सुनी हुई बात’ या ‘हमारा संदेश’
  rationale: इब्रानी शब्द में सुनी, बताई या घोषित बात की अर्थ-व्याप्ति है। मुख्य पाठ में सहज हिन्दी चुनी गई है और वास्तविक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित रखे गए हैं।
