source:
  edition: WLC
  text: מֵ/עֹ֤צֶר וּ/מִ/מִּשְׁפָּט֙ לֻקָּ֔ח וְ/אֶת דּוֹר֖/וֹ מִ֣י יְשׂוֹחֵ֑חַ כִּ֤י נִגְזַר֙ מֵ/אֶ֣רֶץ חַיִּ֔ים מִ/פֶּ֥שַׁע עַמִּ֖/י נֶ֥גַע לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/008.yaml
  text: By oppression and judgment he was taken away[a]; and as for his generation, who considered that he was cut off from the land of the living[c][b], stricken for the transgression of my people?
translation:
  language: hi
  text: अत्याचार और न्याय के द्वारा वह ले जाया गया। उसकी पीढ़ी[b] के विषय में किसने विचार किया[a] कि वह जीवितों की भूमि से काट डाला गया—मेरे लोगों के अपराध के कारण उस पर मार पड़ी[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “किसने उसकी पीढ़ी के विषय में कहा,” “किसने उसकी पीढ़ी का वर्णन किया,” अथवा “किसने उसकी पीढ़ी के विषय में मनन किया”; यहाँ प्रयुक्त इब्रानी क्रिया दुर्लभ है और उसका अर्थ अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: “उसकी पीढ़ी” से उसके समकालीन, उसके वंशज, या अधिक व्यापक रूप से उसके जीवनकाल में उसका भाग्य अभिप्रेत हो सकता है।
    reason: alternative_reading
  - marker: c
    text: या “मार उस पर थी।” इब्रानी לָמוֹ रूप की दृष्टि से बहुवचन है, पर यहाँ काव्यात्मक एकवचन के रूप में प्रयुक्त हो सकता है। कुछ लोग इसका अर्थ “उन पर” लेते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעֹצֶר
  choice: अत्याचार के द्वारा
  rationale: עֹצֶר का अर्थ रोक, बंदीकरण या दमनकारी व्यवहार हो सकता है। यहाँ מִשְׁפָּט के साथ और ‘ले जाया गया’ से पहले यह दमन अथवा अत्याचार का भाव देता है; ‘के द्वारा’ prefixed מִן के साधनात्मक भाव को व्यक्त करता है।
- source_word: וּמִמִּשְׁפָּט
  choice: और न्याय के द्वारा
  rationale: מִשְׁפָּט न्याय, न्यायिक निर्णय या कानूनी प्रक्रिया को सूचित कर सकता है। ‘न्याय’ मूल की संक्षिप्तता और इस अनिश्चितता को बनाए रखता है कि प्रक्रिया न्यायपूर्ण थी या अन्यायपूर्ण।
- source_word: לֻקָּח
  choice: वह ले जाया गया
  rationale: לקח का यह कर्मवाच्य रूप हटाए या ले जाए जाने को व्यक्त करता है। यह अनुवाद मृत्यु की ओर ले जाने वाले प्रसंग के अनुकूल है, पर क्रिया में उससे अधिक अर्थ नहीं जोड़ता।
- source_word: וְאֶת־דּוֹרוֹ
  choice: उसकी पीढ़ी के विषय में
  rationale: अग्रस्थ אֶת־דּוֹרוֹ को विषयसूचक वाक्यांश के रूप में लिया गया है। ‘पीढ़ी’ דּוֹר का सीधा अर्थ रखता है और मुख्य पाठ में समकालीनों, वंशजों या जीवनकाल में से किसी एक को निश्चित नहीं करता।
- source_word: מִי יְשׂוֹחֵחַ
  choice: किसने विचार किया
  rationale: यह दुर्लभ और कठिन क्रिया है। प्रसंग में ‘विचार करना’ अगले כִּי-वाक्य के साथ स्वाभाविक बैठता है; ‘किसने कहा/वर्णन किया’ जैसे विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: כִּי
  choice: कि
  rationale: כִּי को यहाँ उस बात की विषयवस्तु का परिचायक माना गया है जिस पर किसी ने विचार नहीं किया।
- source_word: נִגְזַר
  choice: काट डाला गया
  rationale: נגזר का निफ़अल रूप काट दिए या अलग कर दिए जाने का भाव देता है। मृत्यु के प्रसंग में ‘काट डाला गया’ मूल रूपक को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: מֵאֶרֶץ חַיִּים
  choice: जीवितों की भूमि से
  rationale: यह इब्रानी मुहावरा जीवित लोगों के क्षेत्र, अर्थात इस संसार के जीवन, को सूचित करता है; हिन्दी में मूल बिंब सुरक्षित रखा गया है।
- source_word: מִפֶּשַׁע עַמִּי
  choice: मेरे लोगों के अपराध के कारण
  rationale: פֶּשַׁע विद्रोही अपराध या उल्लंघन को दर्शाता है। ‘अपराध’ सामान्य आधुनिक हिन्दी में स्पष्ट है और מִן के कारणसूचक संबंध को ‘के कारण’ व्यक्त करता है।
- source_word: נֶגַע לָמוֹ
  choice: उस पर मार पड़ी
  rationale: נֶגַע संज्ञा के रूप में मार, आघात या विपत्ति हो सकता है। לָמוֹ को प्रसंगानुसार काव्यात्मक एकवचन मानते हुए यह अनुवाद संज्ञात्मक रचना और पीड़ित सेवक की एकवचन संगति दोनों को बनाए रखता है; बहुवचन संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: अंतिम खंड में לָמוֹ का वचन और संदर्भ
  choice: इसे सेवक की ओर संकेत करने वाला काव्यात्मक एकवचन मानकर ‘उस पर मार पड़ी’ अनूदित किया गया है।
  alternative: ‘उन पर मार पड़ी’; अथवा भावात्मक रूप से ‘वह मारा गया’।
  rationale: לָמוֹ रूप की दृष्टि से बहुवचन है, किंतु बाइबिलीय काव्य में एकवचन अर्थ में भी आ सकता है। निकटवर्ती प्रसंग में सेवक एकवचन है, इसलिए मुख्य पाठ में एकवचन अधिक संगत है; वास्तविक व्याकरणिक तनाव पादटिप्पणी में रखा गया है।
- issue: דּוֹר का आशय
  choice: व्यापक शब्द ‘पीढ़ी’ रखा गया है।
  alternative: उसके समकालीन; उसके वंशज; अथवा उसका जीवनकाल/जीवन में उसका भाग्य।
  rationale: मूल शब्द इन अर्थों में से किसी एक को निर्विवाद रूप से निश्चित नहीं करता। मुख्य पाठ में व्यापक पद रखकर किसी संकीर्ण धर्मवैज्ञानिक निष्कर्ष को आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। मूल इब्रानी की संक्षिप्तता को यथासंभव बनाए रखते हुए दुर्लभ क्रिया, ‘पीढ़ी’ के व्यापक अर्थ और לָמוֹ की वचन-संबंधी अनिश्चितता को पादटिप्पणियों में स्पष्ट किया गया है।
