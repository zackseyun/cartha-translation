  text: וַ/יַּ֨עַל כַּ/יּוֹנֵ֜ק לְ/פָנָ֗י/ו וְ/כַ/שֹּׁ֨רֶשׁ֙ מֵ/אֶ֣רֶץ צִיָּ֔ה לֹא תֹ֥אַר ל֖/וֹ וְ/לֹ֣א הָדָ֑ר וְ/נִרְאֵ֥/הוּ וְ/לֹֽא מַרְאֶ֖ה וְ/נֶחְמְדֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/002.yaml
  text: For he grew up before him like a young plant[a], and like a root out of dry ground. He had no form or majesty that we should look at him[c][b], and no appearance that we should desire him.
translation:
  language: hi
  text: वह उसके सामने[b] कोमल अंकुर के समान बढ़ा[a], और सूखी भूमि से निकली जड़ के समान। उसमें न तो ऐसा रूप था, न वैभव, कि हम उसकी ओर देखते[c]; और न ही ऐसा स्वरूप कि हम उसे चाहते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नए पौधे के समान।” इब्रानी शब्द יוֹנֵק इस पौध-बिंब में नई, कोमल कोंपल या अंकुर को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “उसके सामने” है। यहाँ “उसके” से यहोवा समझा जा सकता है, पर इस पद में संदर्भ को स्पष्ट रूप से दोहराया नहीं गया है।
    reason: alternative_reading
  - marker: c
    text: 'अधिक शाब्दिक रूप से: “और हमने उसे देखा, पर ऐसा कोई स्वरूप न था कि हम उसे चाहते।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל
  choice: बढ़ा
  rationale: עלה का मूल अर्थ ऊपर आना है, पर पौधे के बिंब में यह उगने या बढ़ने को दर्शाता है। यहाँ “बढ़ा” सेवक की वृद्धि और वनस्पति-बिंब दोनों के अनुकूल है।
- source_word: כַּיּוֹנֵק
  choice: कोमल अंकुर के समान
  rationale: יוֹנֵק यहाँ समानांतर पौध-बिंब के कारण किसी नई, कोमल कोंपल या अंकुर को दर्शाता है। “कोमल अंकुर” आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: यह इब्रानी पदबंध का सीधा अनुवाद है और पुरुषवाचक एकवचन सर्वनाम के संदर्भ को अनिर्धारित रहने देता है।
- source_word: וְכַשֹּׁרֶשׁ
  choice: और ... जड़ के समान
  rationale: שֹׁרֶשׁ का सामान्य अर्थ “जड़” है; ठोस पौध-बिंब को बनाए रखा गया है।
- source_word: מֵאֶרֶץ צִיָּה
  choice: सूखी भूमि से निकली
  rationale: צִיָּה शुष्कता को और אֶרֶץ यहाँ मिट्टी या भूमि को दर्शाता है। “सूखी भूमि” अनुपजाऊ परिस्थिति का बिंब सुरक्षित रखती है; “निकली” हिन्दी में जड़ के संबंध को स्वाभाविक बनाता है।
- source_word: לֹא תֹאַר לוֹ
  choice: उसका न कोई ऐसा रूप था
  rationale: תֹאַר दृश्य आकार या रूप को दर्शाता है। “ऐसा” अगली आशयात्मक उपवाक्य-रचना से इसे स्वाभाविक रूप से जोड़ता है, बिना “सुंदर” जैसा संकुचित अर्थ जोड़े।
- source_word: וְלֹא הָדָר
  choice: न वैभव
  rationale: הָדָר गरिमा, भव्यता या वैभव का बोध कराता है। “वैभव” यहाँ बाहरी प्रभावशालिता को संक्षेप और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: וְנִרְאֵהוּ
  choice: कि हम उसकी ओर देखते
  rationale: व्यंजन-पाठ का अधिक शाब्दिक अर्थ “और हमने उसे देखा” हो सकता है, पर संदर्भ में इसे देखने को प्रेरित करने वाले रूप या वैभव के अभाव से जुड़ी आशयात्मक रचना के रूप में प्रस्तुत किया गया है। शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: וְלֹא מַרְאֶה
  choice: और न ऐसा स्वरूप
  rationale: מַרְאֶה दृश्य रूप या स्वरूप है। “स्वरूप” दृश्य पक्ष बनाए रखता है और “सुंदरता” का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: וְנֶחְמְדֵהוּ
  choice: कि हम उसे चाहते
  rationale: חמד चाहने, वांछनीय समझने या प्रसन्न होने का अर्थ दे सकता है। “चाहते” मूल की व्यापकता और बाहरी आकर्षण के संदर्भ दोनों को बनाए रखता है।
theological_decisions:
- issue: לְפָנָיו में “उसके” का संदर्भ
  choice: मुख्य पाठ में “उसके सामने” रखकर संदर्भ को अनिर्धारित रखा गया है।
  alternative: “यहोवा के सामने” अथवा “हमारे सामने”
  rationale: प्रत्यय पुल्लिंग एकवचन है, पर इस पद में उसका संज्ञात्मक संदर्भ फिर से स्पष्ट नहीं किया गया। यहोवा को संदर्भ मानना सामान्य है, फिर भी अनुवाद में उसे स्पष्ट रूप से जोड़ना मूल की अस्पष्टता को समाप्त कर देता।
- issue: रूप-वर्णन केवल शारीरिक आकर्षण का है या व्यापक सामाजिक प्रभावहीनता का
  choice: “रूप,” “वैभव” और “स्वरूप” जैसे दृश्य शब्द रखे गए हैं।
  alternative: “सुंदरता,” “राजसी ठाट” या “सामाजिक प्रतिष्ठा”
  rationale: इब्रानी शब्दावली मुख्यतः दिखाई देने वाले रूप और प्रभाव पर केंद्रित है। व्यापक सामाजिक या धर्मवैज्ञानिक निष्कर्षों को मुख्य पाठ में नहीं जोड़ा गया।
- issue: וְנִרְאֵהוּ की वाक्यगत भूमिका
  choice: 'इसे पूर्ववर्ती रूप और वैभव से जुड़ी आशयात्मक अभिव्यक्ति के रूप में अनूदित किया गया: “कि हम उसकी ओर देखते।”'
  alternative: “और हमने उसे देखा”
  rationale: दोनों पाठ-संभावनाओं का आधार इब्रानी रूप में है। मुख्य पाठ में प्रसंगानुकूल हिन्दी वाक्य लिया गया है, जबकि अधिक शाब्दिक संरचना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण शैली अपनाई गई है। “कोमल अंकुर,” “सूखी भूमि,” “जड़,” “रूप,” “वैभव” और “स्वरूप” मूल के वनस्पति तथा दृश्य बिंबों को स्पष्ट रखते हैं। सर्वनाम-संदर्भ और וְנִרְאֵהוּ की वाक्यगत अस्पष्टता को पादटिप्पणियों में सुरक्षित रखा गया है।
