base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/011.yaml
  text: From the anguish of his soul he will see and be satisfied[a]; by his knowledge my righteous servant will justify many[b], and he will bear their iniquities.
translation:
  language: hi
  text: अपने प्राण की पीड़ा से वह देखेगा और तृप्त होगा[b]। अपने ज्ञान के द्वारा[a] मेरा धर्मी सेवक बहुतों को धर्मी ठहराएगा, और वह स्वयं उनके अधर्मों को उठाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे जानने के द्वारा”; यह वाक्यांश सेवक के अपने ज्ञान की ओर या दूसरों के द्वारा सेवक को जानने की ओर संकेत कर सकता है।
    reason: alternative_reading
  - marker: b
    text: कुछ प्राचीन साक्षियों में “वह ज्योति देखेगा और तृप्त होगा” है। मसोरेटी पाठ में केवल “वह देखेगा और तृप्त होगा” है।
    reason: textual_variant
lexical_decisions:
- source_word: מֵעֲמַל נַפְשׁוֹ
  choice: अपने प्राण की पीड़ा के बाद
  rationale: עָמָל यहाँ साधारण परिश्रम नहीं, बल्कि दुःख और क्लेश दर्शाता है। מִן परिणाम की ओर बढ़ते संदर्भ में ‘के बाद’ के रूप में स्वाभाविक हिन्दी देता है; נֶפֶשׁ के लिए ‘प्राण’ पूरे व्यक्ति और उसके अंतःजीवन—दोनों की ओर संकेत बनाए रखता है।
- source_word: יִרְאֶה יִשְׂבָּע
  choice: वह देखेगा और तृप्त होगा
  rationale: मसोरेटी पाठ में ‘देखेगा’ का कर्म नहीं दिया गया है, इसलिए मुख्य पाठ में कोई कर्म नहीं जोड़ा गया। ‘तृप्त होगा’ संतोष और परिपूर्णता का परिणाम व्यक्त करता है।
- source_word: בְּדַעְתּוֹ
  choice: उसकी समझ के द्वारा
  rationale: प्रत्यय को सेवक की अपनी समझ/ज्ञान से संबंधित मानकर करणार्थक रूप में अनूदित किया गया है। ‘ज्ञान’ भी संभव है, पर ‘समझ’ आधुनिक हिन्दी में यहाँ अधिक सहज है; वैकल्पिक वस्तुपरक अर्थ पादटिप्पणी में रखा गया है।
- source_word: יַצְדִּיק צַדִּיק עַבְדִּי
  choice: मेरा धर्मी सेवक ... धर्मी ठहराएगा
  rationale: צַדִּיק को עַבְדִּי का विशेषण माना गया है। יַצְדִּיק के हिफ़ील रूप के लिए ‘धर्मी ठहराएगा’ न्यायिक/घोषणात्मक अर्थ को सुरक्षित रखता है, बिना यह निर्णीत किए कि क्रिया केवल घोषणा है या परिणामकारी भी।
- source_word: לָרַבִּים
  choice: बहुतों को
  rationale: לְ को क्रिया के प्रभावित व्यक्तियों के सूचक के रूप में और רַבִּים को ‘बहुतों’ के रूप में अनूदित किया गया है; इसे धर्मवैज्ञानिक सामंजस्य के लिए ‘सबको’ नहीं बनाया गया।
- source_word: וַעֲוֺנֹתָם הוּא יִסְבֹּל
  choice: उनके अधर्मों का भार वह उठाएगा
  rationale: עָוֺן के नैतिक दोष/अधर्म का बल ‘अधर्मों’ में बना रहता है। סבל के वास्तविक भार-वहन भाव को स्वाभाविक हिन्दी में स्पष्ट करने के लिए ‘भार उठाएगा’ कहा गया है। स्वतंत्र सर्वनाम הוּא का बल ‘वह’ को कर्म के बाद रखकर उभारा गया है।
theological_decisions:
- issue: בְּדַעְתּוֹ का संबंध
  choice: 'सेवक की अपनी समझ: ‘उसकी समझ के द्वारा’'
  alternative: 'सेवक को जानने के द्वारा: ‘उसके ज्ञान के द्वारा’ अथवा ‘उसे जानने के द्वारा’'
  rationale: हिब्रू प्रत्यय सहज रूप से सेवक के अपने ज्ञान/समझ की ओर संकेत कर सकता है, पर वस्तुपरक अर्थ भी व्याकरणतः और व्याख्यात्मक परंपरा में संभव है। मुख्य पाठ निकटतम व्याकरणिक अर्थ रखता है और पादटिप्पणी अस्पष्टता बचाती है।
- issue: יִרְאֶה का पाठ-रूप
  choice: मसोरेटी पाठ के अनुसार केवल ‘वह देखेगा’
  alternative: कुछ प्राचीन साक्षियों के अनुसार ‘वह ज्योति देखेगा’
  rationale: प्रदत्त WLC पाठ में ‘ज्योति’ नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया; महत्वपूर्ण प्राचीन पाठांतर पादटिप्पणी में दिया गया है।
- issue: לָרַבִּים का विस्तार
  choice: ‘बहुतों को’
  alternative: ‘अनेकों को’ या ‘उन बहुतों को’
  rationale: अनुवाद हिब्रू ‘बहुतों’ को बनाए रखता है और उसे ‘सबको’ में विस्तृत करके धर्मवैज्ञानिक तनाव समाप्त नहीं करता।
- issue: יַצְדִּיק की प्रकृति
  choice: ‘धर्मी ठहराएगा’
  alternative: ‘धर्मी बनाएगा’
  rationale: हिफ़ील का न्यायिक/घोषणात्मक अर्थ प्रमुख है, किंतु हिब्रू द्वारा न सुलझाए गए धर्मवैज्ञानिक प्रश्नों को मुख्य पाठ में अतिरिक्त व्याख्या से निश्चित नहीं किया गया।
