id: ISA.53.9
reference: Isaiah 53:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּתֵּ֤ן אֶת רְשָׁעִים֙ קִבְר֔/וֹ וְ/אֶת עָשִׁ֖יר בְּ/מֹתָ֑י/ו עַ֚ל לֹא חָמָ֣ס עָשָׂ֔ה וְ/לֹ֥א מִרְמָ֖ה בְּ/פִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/009.yaml
  text: And they assigned his grave with the wicked[a], and with a rich man in his deaths, although he had done no violence[b], and no deceit was in his mouth.
translation:
  language: hi
  text: उसकी कब्र दुष्टों के साथ ठहराई गई[a], और उसकी मौतों में उसे एक धनी व्यक्ति के साथ रखा गया[b], यद्यपि उसने कोई हिंसा नहीं की थी और उसके मुँह में कोई छल नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से क्रिया का अर्थ ‘दिया’ या ‘रखा’ है। इब्रानी में इसका कर्ता स्पष्ट नहीं है; ‘उसने उसकी कब्र … ठहराई’ भी संभव है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘उसकी मौतों में’ बहुवचन है; इसे मुहावरे के रूप में ‘उसकी मृत्यु में’ या ‘उसकी मृत्यु के समय’ भी समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ठहराई गई / रखा गया
  rationale: נתן का मूल अर्थ ‘देना, रखना, ठहराना’ है। यहाँ कर्ता स्पष्ट नहीं है; इसलिए हिन्दी में कर्मवाच्य प्रयोग करके किसी विशेष कर्ता को मान लेने से बचा गया है। दूसरे समानांतर खंड में क्रिया को स्वाभाविक हिन्दी के लिए दोहराया गया है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: यह बहुवचन संज्ञात्मक विशेषण नैतिक रूप से दुष्ट लोगों को दर्शाता है; ‘दुष्टों’ इसका सीधा और प्रचलित हिन्दी रूप है।
- source_word: קִבְרוֹ
  choice: उसकी कब्र
  rationale: קבר का अर्थ कब्र या दफनाने का स्थान है। ‘उसकी कब्र’ संक्षिप्त, स्वाभाविक और मूल के निकट है।
- source_word: עָשִׁיר
  choice: एक धनी
  rationale: इब्रानी में शब्द एकवचन है और किसी धनी व्यक्ति की ओर संकेत करता है। हिन्दी में ‘एक धनी’ इसका व्यक्तिगत और एकवचन भाव बनाए रखता है।
- source_word: בְּמֹתָיו
  choice: उसकी मौतों में
  rationale: इब्रानी रूप व्याकरण की दृष्टि से बहुवचन, ‘उसकी मौतों में’, है। इसकी असामान्यता को मुख्य पाठ में सुरक्षित रखा गया है और सहज एकवचन अर्थ पादटिप्पणी में दिया गया है।
- source_word: עַל לֹא
  choice: यद्यपि … नहीं
  rationale: संदर्भ में यह सेवक के साथ हुए व्यवहार और उसकी निर्दोषता के बीच विरोधात्मक या रियायती संबंध प्रकट करता है; ‘यद्यपि’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חָמָס
  choice: हिंसा
  rationale: חמס हिंसा या हिंसक अन्याय को दर्शाता है। ‘हिंसा’ इसका सीधा और स्थापित समतुल्य है।
- source_word: מִרְמָה
  choice: छल
  rationale: यह शब्द धोखे या कपट को दर्शाता है। ‘छल’ आधुनिक हिन्दी में स्पष्ट है और वाणी के संदर्भ में स्वाभाविक बैठता है।
- source_word: בְּפִיו
  choice: उसके मुँह में
  rationale: मूल का शाब्दिक मुहावरा बनाए रखा गया है; इसमें ‘पाया गया’ जैसे शब्द जोड़कर कथन को अनावश्यक रूप से विस्तृत नहीं किया गया।
theological_decisions:
- issue: सेवक-गीत के इस महत्त्वपूर्ण पद में בְּמֹתָיו का असामान्य बहुवचन
  choice: मुख्य पाठ में ‘उसकी मौतों में’ बहुवचन बनाए रखना
  alternative: ‘उसकी मृत्यु में’ या ‘उसकी मृत्यु के समय’
  rationale: मसोरेटिक पाठ का रूप स्पष्टतः बहुवचन है। उसे मुख्य पाठ में सुरक्षित रखने से बाद की व्याख्या के आधार पर असामान्य अभिव्यक्ति को चुपचाप एकवचन नहीं बनाया जाता; सहज एकवचन समझ पादटिप्पणी में उपलब्ध है।
- issue: וַיִּתֵּן का अनिर्दिष्ट कर्ता
  choice: कर्मवाच्य ‘ठहराई गई’
  alternative: ‘उसने ठहराया’ या अनिर्दिष्ट बहुवचन ‘उन्होंने ठहराया’
  rationale: इब्रानी क्रिया तृतीय पुरुष एकवचन है, पर उसका कर्ता व्यक्त नहीं किया गया और वाक्यरचना संक्षिप्त है। कर्मवाच्य हिन्दी किसी मनुष्य या परमेश्वर को कर्ता ठहराए बिना इस अस्पष्टता को बनाए रखती है।
- issue: दूसरे खंड में क्रिया का लोप
  choice: हिन्दी में ‘उसे … रखा गया’ जोड़कर पहले खंड की क्रिया को समानांतर रूप में दोहराना
  alternative: खंडित शाब्दिक रूप ‘और एक धनी के साथ उसकी मौतों में’
  rationale: इब्रानी काव्य में पहले खंड की क्रिया दूसरे खंड पर भी लागू होती है। हिन्दी में उसे दोहराना अर्थ नहीं बदलता, बल्कि समानांतर रचना को समझने योग्य बनाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु भविष्यवाणी-काव्य की गरिमा और संक्षिप्तता बनाए रखती है। ‘कब्र’, ‘दुष्ट’, ‘हिंसा’ और ‘छल’ साधारण पाठक के लिए परिचित हैं। असामान्य ‘मौतों’ को जानबूझकर सुरक्षित रखा गया है, इसलिए उसकी व्याख्या पादटिप्पणी में दी गई है।
