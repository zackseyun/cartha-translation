base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/012.yaml
  text: Therefore I will allot him a portion among the many[a], and he will divide plunder with the strong, because he poured out his life to death and was numbered with transgressors[c][b]; yet he bore the sin of many and intercedes for transgressors.
translation:
  language: hi
  text: इसलिए मैं उसे बहुतों के बीच एक भाग दूँगा[a], और वह सामर्थियों के साथ लूट का माल बाँटेगा, क्योंकि उसने अपना प्राण मृत्यु के लिए उँडेल दिया और वह अपराधियों में गिना गया[b]; फिर भी उसने बहुतों का पाप उठाया और अपराधियों के लिए विनती करता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उसे बहुतों के साथ एक हिस्सा दूँगा।” पहले खंड का हिब्रू वाक्य संक्षिप्त है और उसे एक-दूसरे से निकट संबंध रखने वाले एक से अधिक अर्थों में समझा गया है।
    reason: alternative_reading
  - marker: b
    text: या, “उसे अपराधियों में माना गया।”
    reason: lexical_alternative
  - marker: c
    text: या, “अपराधियों के लिए मध्यस्थता करता है।” यहाँ हिब्रू क्रिया का अनुवाद अधिक औपचारिक या अधिक बोलचाल की अभिव्यक्ति से किया जा सकता है।
    reason: lexical_alternative
