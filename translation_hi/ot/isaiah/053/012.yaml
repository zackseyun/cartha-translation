  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। ‘प्राण उँडेल दिया,’ ‘पाप उठा लिया,’ और ‘लूट का माल बाँटेगा’ जैसी मूल रूपकात्मक छवियाँ सुरक्षित रखी गई हैं। कठिन प्रथम खंड तथा अंतिम क्रिया की वास्तविक अर्थगत गुंजाइश पादटिप्पणियों में दी गई है।
