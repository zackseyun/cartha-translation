theological_decisions:
- issue: רַבִּים (‘बहुतों’) का दायरा
  choice: ‘बहुतों’ रखा गया है
  alternative: ‘सब’ अथवा ‘जनसमूह’
  rationale: हिब्रू शब्द को यथावत् अर्थ में रखकर उसके व्यापक या सीमित धर्मवैज्ञानिक आशय का निर्णय पाठक की व्याख्या पर छोड़ा गया है।
- issue: נָשָׂא חֵטְא में प्रायश्चित-संबंधी भाषा
  choice: ‘बहुतों का पाप उठा लिया’
  alternative: ‘बहुतों का पाप दूर कर दिया’ अथवा ‘बहुतों का दंड सहा’
  rationale: मूल की प्रतिनिधिक और बलिदानी शक्ति सुरक्षित रहती है, पर किसी एक बाद के सैद्धांतिक निरूपण को पाठ में नहीं जोड़ा जाता।
- issue: अंतिम खंड में יַפְגִּיעַ का अर्थ और काल
  choice: ‘विनती करता है’
  alternative: ‘विनती की’ अथवा ‘मध्यस्थता करता है’
  rationale: क्रिया का निवेदनात्मक अर्थ और हिब्रू अपूर्ण रूप का वर्तमान-सदृश, सारांशात्मक बल दोनों सुरक्षित रखे गए हैं।
