  text: נִבְזֶה֙ וַ/חֲדַ֣ל אִישִׁ֔ים אִ֥ישׁ מַכְאֹב֖וֹת וִ/יד֣וּעַ חֹ֑לִי וּ/כְ/מַסְתֵּ֤ר פָּנִים֙ מִמֶּ֔/נּוּ נִבְזֶ֖ה וְ/לֹ֥א חֲשַׁבְנֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/003.yaml
  text: He was despised and rejected by men[a], a man of pains and acquainted with sickness; and like one from whom people hide their faces, he was despised[d][c][b], and we did not esteem him.
translation:
  language: hi
  text: वह तुच्छ समझा गया और लोगों ने उसे ठुकरा दिया[a]; वह पीड़ाओं का मनुष्य[b] और रोग से परिचित था[c]। वह ऐसा था जिससे लोग मुँह छिपाते थे[d]। वह तुच्छ समझा गया, और हमने उसे आदर के योग्य नहीं समझा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोगों द्वारा त्यागा हुआ” अथवा “मनुष्यों से रहित।” इब्रानी पदबंध कठिन है और सामाजिक अस्वीकृति या परित्याग, दोनों का भाव दे सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “दुखों का मनुष्य।”
    reason: lexical_alternative
  - marker: c
    text: या, “बीमारी से परिचित”; पारंपरिक अनुवादों में कभी-कभी “शोक से परिचित” मिलता है, पर इब्रानी शब्द का अधिक सीधा अर्थ रोग या बीमारी है।
    reason: lexical_alternative
  - marker: d
    text: 'इब्रानी वाक्यांश संक्षिप्त है: लगभग “उससे मुँह छिपाने जैसा।” आशय यह है कि लोग उससे मुँह फेर लेते थे।'
    reason: cultural_note
lexical_decisions:
- source_word: נִבְזֶה
  choice: तुच्छ समझा गया
  rationale: निफ़अल कृदंत किसी को घृणा या तिरस्कार की दृष्टि से देखे जाने का परिणामसूचक भाव देता है। यह हिंदी प्रयोग निष्क्रिय अर्थ और सामाजिक अवमानना दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חֲדַל אִישִׁים
  choice: लोगों ने उसे ठुकरा दिया
  rationale: यह कठिन इब्रानी पदबंध मनुष्यों से वंचित, अलग या उनके द्वारा छोड़ दिए जाने की ओर संकेत करता है। संदर्भ में सामाजिक अस्वीकृति प्रमुख है; इसलिए सहज हिंदी में यह चयन किया गया है, जबकि त्यागे या अलग किए जाने का निकटतर शब्दार्थ पादटिप्पणी में सुरक्षित है।
- source_word: אִישׁ מַכְאֹבוֹת
  choice: पीड़ाओं का मनुष्य
  rationale: מַכְאֹב शारीरिक अथवा भावनात्मक पीड़ा दोनों को व्यक्त कर सकता है। कुछ असामान्य किंतु स्पष्ट यह संरचना मूल के संक्षिप्त और सघन रूप को बनाए रखती है तथा इसे केवल शोक तक सीमित नहीं करती।
- source_word: וִידוּעַ חֹלִי
  choice: रोग से परिचित
  rationale: חֹלִי का मूल अर्थ रोग या बीमारी है और ידע का रूप निकट परिचय का भाव देता है। यह अनुवाद देहधारी कष्ट को बनाए रखता है, पर केवल किसी एक रोग का दावा नहीं करता।
- source_word: וּכְמַסְתֵּר פָּנִים מִמֶּנּוּ
  choice: वह ऐसा था जिससे लोग अपना मुँह छिपा लेते हैं
  rationale: इब्रानी वाक्यांश संक्षिप्त और कर्तारहित है—शाब्दिक रूप से लगभग ‘उससे मुँह छिपाने जैसा।’ ‘लोग’ को निहित कर्ता मानकर वाक्य को हिंदी में बोधगम्य बनाया गया है, और מִן का ‘से’ संबंध सुरक्षित रखा गया है।
- source_word: וְלֹא חֲשַׁבְנֻהוּ
  choice: हमने उसका कोई मान नहीं किया
  rationale: חשב यहाँ किसी को मूल्यवान मानने, उसका विचार करने या आदर देने के अर्थ में है। यह हिंदी वाक्य वक्ताओं के स्वीकारोक्तिपरक ‘हम’ और उनके नकारात्मक मूल्यांकन को स्पष्ट रखता है।
theological_decisions:
- issue: दास की मसीही पहचान
  choice: पद को उसकी अपनी साहित्यिक भाषा में रखा गया है; किसी मसीही पहचान को अनुवाद में जोड़ा नहीं गया।
  alternative: स्पष्ट मसीही व्याख्यात्मक विस्तार जोड़ना।
  rationale: यह अंश मसीही परंपरा में मसीह-संबंधी पढ़ा जाता है, फिर भी इब्रानी पाठ इस पद में स्वयं वह पहचान स्पष्ट नहीं करता। अनुवाद पाठ के भीतर रहता है और व्यापक धर्मवैज्ञानिक पठन की संभावना खुली रखता है।
- issue: पीड़ा और रोग की शब्दावली
  choice: ठोस शब्द ‘पीड़ाओं’ और ‘रोग’ रखे गए हैं।
  alternative: पारंपरिक किंतु अधिक अमूर्त ‘दुखों’ और ‘शोक’ का प्रयोग करना।
  rationale: मूल शब्द शारीरिक और भावनात्मक कष्ट के बीच तनाव बनाए रखते हैं। ठोस हिंदी शब्द न तो कष्ट को केवल बीमारी तक सीमित करते हैं और न उसे केवल भावनात्मक शोक बना देते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है, पर दासगीत की गंभीर और काव्यात्मक गरिमा बनाए रखने के लिए ‘पीड़ाओं का मनुष्य’ जैसा सघन पदबंध रखा गया है। ‘मनुष्य’ लिंग-सूचक मूल संज्ञा אִישׁ को दर्शाता है। विराम-चिह्नों से इब्रानी पंक्तियों का क्रम और पुनरुक्त ‘तुच्छ समझा गया’ सुरक्षित रखा गया है।
