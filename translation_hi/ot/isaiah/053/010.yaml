  text: וַ/יהוָ֞ה חָפֵ֤ץ דַּכְּא/וֹ֙ הֶֽחֱלִ֔י אִם תָּשִׂ֤ים אָשָׁם֙ נַפְשׁ֔/וֹ יִרְאֶ֥ה זֶ֖רַע יַאֲרִ֣יךְ יָמִ֑ים וְ/חֵ֥פֶץ יְהוָ֖ה בְּ/יָד֥/וֹ יִצְלָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/010.yaml
  text: Yet it pleased Yahweh to crush him[a]; he made him sick. If his life makes a guilt offering, he will see offspring, he will prolong his days[e][d][c][b], and the pleasure of Yahweh will prosper in his hand.
translation:
  language: hi
  text: फिर भी यहोवा को उसे कुचलना भाया[a]; उसने उसे बीमार किया[b]। यदि उसका प्राण दोषबलि ठहराया जाए[c][d], तो वह संतान देखेगा, उसके दिन बढ़ेंगे, और यहोवा की इच्छा उसके हाथ से सफल होगी[e]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और यहोवा को” अथवा “परन्तु यहोवा को”; हिब्रू संयोजक का अर्थ प्रसंग के अनुसार अलग-अलग ढंग से व्यक्त किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उसने उसे पीड़ा दी” अथवा “उसने उसे दुःख पहुँचाया।”
    reason: lexical_alternative
  - marker: c
    text: या “यदि उसका प्राण दोषबलि चढ़ाए,” अथवा “यदि तू उसके प्राण को दोषबलि ठहराए।” इस उपवाक्य का हिब्रू पाठ कठिन है, विशेषकर “ठहराने/चढ़ाने” वाले क्रियापद का कर्ता अस्पष्ट है।
    reason: alternative_reading
  - marker: d
    text: “दोषबलि” तोराह में दोष या क्षतिपूर्ति के लिए चढ़ाई जाने वाली बलि है।
    reason: cultural_note
  - marker: e
    text: या “यहोवा का उद्देश्य उसके हाथ से पूरा होगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: फिर भी यहोवा
  rationale: वाव को प्रसंग में विरोधसूचक मानकर ‘फिर भी’ किया गया है; परमेश्वर के व्यक्तिगत नाम को ‘यहोवा’ रूप में रखा गया है।
- source_word: חָפֵץ דַּכְּאוֹ
  choice: उसे कुचलना चाहा
  rationale: חפץ इच्छा, प्रसन्नता या उद्देश्य व्यक्त कर सकता है; ‘चाहा’ कठोर कथन और प्रत्यक्ष दैवी कर्तृत्व को बनाए रखता है, जबकि דכא की तीव्रता के लिए ‘कुचलना’ उपयुक्त है।
- source_word: הֶחֱלִי
  choice: उसने उसे रोगी कर दिया
  rationale: חלה के हिफ़ील रूप का ठोस अर्थ रोगी करना है; व्यापक अर्थ ‘पीड़ा दी’ को पादटिप्पणी में रखा गया है।
- source_word: אִם תָּשִׂים אָשָׁם נַפְשׁוֹ
  choice: यदि उसका प्राण दोषबलि चढ़ाएगा
  rationale: אִם को शर्तसूचक ‘यदि’ और תשים को स्त्रीलिंग एकवचन क्रिया मानकर उसका कर्ता נַפְשׁוֹ रखा गया है। वाक्यांश कठिन और बहुअर्थी है, इसलिए अन्य सम्भव विश्लेषण पादटिप्पणी में दिए गए हैं।
- source_word: אָשָׁם
  choice: दोषबलि
  rationale: यह तोराह की अपराध-दोष अथवा क्षतिपूर्ति से जुड़ी विशिष्ट बलि का पारिभाषिक नाम है।
- source_word: נַפְשׁוֹ
  choice: उसका प्राण
  rationale: נפש यहाँ व्यक्ति अथवा जीवन को दर्शाता है। ‘प्राण’ हिंदी में जीवन और स्वयं व्यक्ति—दोनों की छाया बनाए रखता है और क्रिया के स्त्रीलिंग रूप से भी मेल खाता है।
- source_word: יִרְאֶה זֶרַע
  choice: वह संतान को देखेगा
  rationale: זרע का अर्थ बीज, संतान या वंश हो सकता है; ‘संतान’ स्वाभाविक है और जैविक अर्थ को आवश्यकता से अधिक सीमित नहीं करता।
- source_word: יַאֲרִיךְ יָמִים
  choice: अपने दिनों को लंबा करेगा
  rationale: हिब्रू मुहावरे की छवि को बनाए रखते हुए दीर्घ जीवन का अर्थ व्यक्त किया गया है।
- source_word: וְחֵפֶץ יְהוָה
  choice: और यहोवा की इच्छा
  rationale: חֵפֶץ इच्छा, प्रसन्नता या उद्देश्य हो सकता है। हिंदी में ‘इच्छा’ पहले חָפֵץ से शब्दार्थ-संबंध बनाए रखती है और स्वाभाविक भी है।
- source_word: בְּיָדוֹ יִצְלָח
  choice: उसके हाथ से सफल होगी
  rationale: ‘हाथ’ की मूल छवि रखते हुए בְּ को साधन/माध्यम के अर्थ में ‘से’ किया गया है; יצלח के लिए ‘सफल होगी’ सहज है।
theological_decisions:
- issue: सेवक के दुःख में दैवी कर्तृत्व
  choice: यहोवा ने उसे कुचलना चाहा; उसने उसे रोगी कर दिया
  alternative: यहोवा ने उसे कुचले जाने दिया; उसने उसके दुःख की अनुमति दी
  rationale: हिब्रू पाठ यहोवा को सीधे कर्ता के रूप में प्रस्तुत करता है। इसे केवल अनुमति में बदलना पाठ की कठिन धार्मिक धार को नरम कर देता। ‘चाहा’ को दुर्भावनापूर्ण आनंद के रूप में स्पष्ट नहीं किया गया, क्योंकि חפץ में इच्छा और उद्देश्य भी निहित हो सकते हैं।
- issue: दोषबलि वाले उपवाक्य का कर्ता और वाच्य
  choice: यदि उसका प्राण दोषबलि चढ़ाएगा
  alternative: जब उसका प्राण दोषबलि ठहराया जाएगा; यदि तू उसके प्राण को दोषबलि ठहराए
  rationale: तָּשִׂים का रूप स्त्रीलिंग एकवचन है और נַפְשׁוֹ के साथ उसका सामंजस्य सम्भव है, पर पाठ की वाक्यरचना कठिन है और दूसरे विश्लेषण भी प्राचीन तथा आधुनिक व्याख्या में सम्भव हैं। मुख्य पाठ एक निकट, व्याकरणतः सम्भव सक्रिय पाठ रखता है और विकल्प पादटिप्पणी में देता है।
- issue: सेवक द्वारा संतान देखना और दिनों का लंबा होना
  choice: भविष्यकालीन कथनों को बिना व्याख्यात्मक सामंजस्य के यथावत रखा गया
  alternative: इन्हें केवल रूपक, पुनरुत्थान, या सामूहिक वंश के रूप में स्पष्ट करना
  rationale: पद स्वयं इन प्रतिज्ञाओं की पूर्ति की रीति नहीं बताता। अनुवाद किसी विशिष्ट धर्मवैज्ञानिक समाधान को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘दोषबलि’ पारिभाषिक धार्मिक शब्द है और उसकी व्याख्या पादटिप्पणी में दी गई है। ‘प्राण’ कुछ ऊँचे साहित्यिक स्तर का शब्द है, पर यहाँ जीवन/व्यक्ति की अर्थ-व्याप्ति और स्त्रीलिंग क्रिया-सामंजस्य को सुरक्षित रखता है।
