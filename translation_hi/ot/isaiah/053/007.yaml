  edition: WLC
  text: נִגַּ֨שׂ וְ/ה֣וּא נַעֲנֶה֮ וְ/לֹ֣א יִפְתַּח פִּי/ו֒ כַּ/שֶּׂה֙ לַ/טֶּ֣בַח יוּבָ֔ל וּ/כְ/רָחֵ֕ל לִ/פְנֵ֥י גֹזְזֶ֖י/הָ נֶאֱלָ֑מָה וְ/לֹ֥א יִפְתַּ֖ח פִּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/007.yaml
  text: He was oppressed[a], and he was afflicted, yet he did not open his mouth; like a lamb led to the slaughter, and like a ewe silent before her shearers, so he did not open his mouth.
translation:
  language: hi
  text: उस पर अत्याचार किया गया[a], और वह पीड़ित हुआ, फिर भी उसने अपना मुँह नहीं खोला। जैसे मेमना वध के लिए ले जाया जाता है, और जैसे भेड़ अपने ऊन कतरनेवालों के सामने चुप रहती है, वैसे ही उसने अपना मुँह नहीं खोला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस पर अत्याचार किया गया, फिर भी उसने अपने आपको दीन किया।” आरंभिक पंक्ति का हिब्रू कठिन है; दूसरी क्रिया का अर्थ निष्क्रिय रूप में “पीड़ित हुआ” या आत्मवाचक रूप में “अपने आपको दीन किया” समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: נִגַּשׂ
  choice: उस पर अत्याचार किया गया
  rationale: निफ़अल रूप यहाँ कठोर व्यवहार और उत्पीड़न सहने का भाव देता है। यह हिंदी प्रयोग स्वाभाविक है और कर्मवाच्य अर्थ को स्पष्ट रखता है।
- source_word: נַעֲנֶה
  choice: वह पीड़ित हुआ
  rationale: संदर्भ में यह क्रिया दुःख या अपमान सहने का भाव देती है। कठिन हिब्रू के कारण आत्म-दीनता का अर्थ भी संभव है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְלֹא יִפְתַּח פִּיו
  choice: फिर भी उसने अपना मुँह नहीं खोला
  rationale: पहली आवृत्ति में ‘फिर भी’ अत्याचार के बावजूद उसकी चुप्पी का विरोधात्मक भाव सहज हिंदी में प्रकट करता है; ‘मुँह नहीं खोला’ मूल रूपक और पुनरुक्ति को बनाए रखता है।
- source_word: כַּשֶּׂה
  choice: जैसे मेमना
  rationale: שֶׂה छोटे भेड़-बकरी वर्ग के पशु को सूचित कर सकता है; वध और असहायता के इस बिंब में ‘मेमना’ सटीक और स्वाभाविक है।
- source_word: לַטֶּבַח יוּבָל
  choice: वध के लिए ले जाया जाता है
  rationale: होफ़अल क्रिया किसी दूसरे के नियंत्रण में ले जाए जाने को व्यक्त करती है। हिब्रू का अपूर्ण रूप तुलना में सामान्य दृश्य भी प्रस्तुत कर सकता है, इसलिए हिंदी वर्तमान सामान्य रूप उपयुक्त है।
- source_word: וּכְרָחֵל
  choice: और जैसे भेड़
  rationale: רָחֵל विशेष रूप से मादा भेड़ है, पर आधुनिक सामान्य हिंदी में ‘भेड़’ अधिक सहज है और अगले स्त्रीलिंग बहुवचन संबंध ‘अपने ऊन कतरनेवालों’ के साथ अर्थ स्पष्ट रहता है।
- source_word: לִפְנֵי גֹזְזֶיהָ
  choice: अपने ऊन कतरनेवालों के सामने
  rationale: सिर्फ ‘कतरनेवालों’ की तुलना में ‘ऊन’ जोड़ना सामान्य पाठक के लिए क्रिया को तुरंत स्पष्ट करता है, जबकि मूल का आशय नहीं बदलता।
- source_word: נֶאֱלָמָה
  choice: चुप रहती है
  rationale: यह निफ़अल रूप मौन रहने को बताता है। ‘चुप रहती है’ आधुनिक हिंदी में स्वाभाविक है और तुलना के सामान्य वर्तमान से मेल खाता है।
- source_word: וְלֹא יִפְתַּח פִּיו
  choice: वैसे ही उसने अपना मुँह नहीं खोला
  rationale: अंतिम पुनरुक्ति को पूरा रखा गया है; ‘वैसे ही’ दोनों उपमाओं का निष्कर्ष स्पष्ट करता है, बिना कोई नया अर्थ जोड़े।
theological_decisions:
- issue: अनुवाद में मसीही पहचान की स्पष्टता का स्तर
  choice: पद का अनुवाद उसके तात्कालिक हिब्रू अर्थ के अनुसार किया गया है; सेवक की पहचान को पद के भीतर स्पष्ट रूप से मसीह नहीं कहा गया।
  alternative: नए नियम में इसके प्रयोग से प्रभावित अधिक प्रत्यक्ष मसीही शब्दावली जोड़ना।
  rationale: हिब्रू पाठ पीड़ित सेवक की मौन सहनशीलता को उपमा और पुनरुक्ति से चित्रित करता है। अनुवाद इसी तनाव को बनाए रखता है और उसकी मसीही पूर्ति की पहचान व्यापक धर्मग्रंथीय संदर्भ पर छोड़ता है।
- issue: नַעֲנֶה का वाच्य और आशय
  choice: 'मुख्य पाठ में निष्क्रिय दुःख-सहन का भाव: ‘वह पीड़ित हुआ’।'
  alternative: 'आत्म-दीनता या स्वेच्छा का भाव: ‘उसने अपने आपको दीन किया’।'
  rationale: रूप को निष्क्रिय अथवा आत्मवाचक समझा जा सकता है। निकटवर्ती נִגַּשׂ के समानांतर मुख्य पाठ में पीड़ा का अर्थ अधिक सहज है, पर संभावित आत्म-दीनता को पादटिप्पणी में रखा गया है ताकि वास्तविक अस्पष्टता न मिटे।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण शैली। मूल की दो उपमाएँ और ‘अपना मुँह नहीं खोला’ की पुनरुक्ति सुरक्षित रखी गई है। ‘वध’ औपचारिक-बाइबिलीय गरिमा बनाए रखता है, जबकि ‘ऊन कतरनेवालों’ से दृश्य सामान्य पाठक के लिए स्पष्ट होता है।
