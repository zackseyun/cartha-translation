source:
  edition: WLC
  text: וְ/הוּא֙ מְחֹלָ֣ל מִ/פְּשָׁעֵ֔/נוּ מְדֻכָּ֖א מֵ/עֲוֺנֹתֵ֑י/נוּ מוּסַ֤ר שְׁלוֹמֵ֨/נוּ֙ עָלָ֔י/ו וּ/בַ/חֲבֻרָת֖/וֹ נִרְפָּא לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/005.yaml
  text: But he was pierced because of our transgressions[a]; he was crushed because of our iniquities; the chastisement for our peace was upon him[c][b], and by his wound we are healed.
translation:
  language: hi
  text: परन्तु वह हमारे अपराधों के कारण बेधा गया[a], हमारे अधर्मों के कारण कुचला गया; हमारी शांति[b] के लिए दण्ड उस पर पड़ा, और उसके घाव[c] से हम चंगे हुए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘घायल किया गया’। इब्रानी शब्द घायल होने या बेधे जाने का अर्थ दे सकता है; ‘बेधा गया’ हिंसा के ठोस बिंब को बनाए रखता है।
    reason: lexical_alternative
  - marker: b
    text: ‘हमारी शांति’ का अर्थ ‘हमारी कुशलता’ या ‘हमारी संपूर्ण भलाई’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘उसकी मार से’ अथवा ‘उसकी चोट से’। इब्रानी संज्ञा एकवचन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: परन्तु वह
  rationale: संदर्भ में संयोजक पिछले पद में सेवक के विषय में की गई गलत धारणा के विपरीत वास्तविकता प्रस्तुत करता है; इसलिए केवल ‘और’ की अपेक्षा ‘परन्तु’ अधिक उपयुक्त है।
- source_word: מְחֹלָל
  choice: बेधा गया
  rationale: शारीरिक पीड़ा और ‘कुचला गया’ के समानांतर प्रयोग में यह रूप घायल या बेधे जाने को सूचित करता है। ‘बेधा गया’ हिंसा के ठोस बिंब को बनाए रखता है।
- source_word: מִפְּשָׁעֵינוּ
  choice: हमारे अपराधों के कारण
  rationale: यहाँ מִן कारण व्यक्त करता है। ‘अपराध’ जानबूझकर किए गए उल्लंघन या विद्रोह का नैतिक भार संप्रेषित करता है।
- source_word: מְדֻכָּא
  choice: कुचला गया
  rationale: यह चयन דכא की तीव्रता और सेवक पर आई गंभीर पीड़ा को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: מֵעֲוֺנֹתֵינוּ
  choice: हमारे अधर्मों के कारण
  rationale: यहाँ भी पूर्वसर्ग कारण बताता है। ‘अधर्म’ को ‘अपराध’ से अलग रखकर मूल के दो भिन्न नैतिक शब्दों का अंतर सुरक्षित किया गया है।
- source_word: מוּסַר
  choice: दण्ड
  rationale: इस पीड़ा-वहन के संदर्भ में शब्द अनुशासन या सुधार से बढ़कर दण्डात्मक क्लेश दर्शाता है। ‘दण्ड’ अर्थ की गंभीरता रखता है, पर किसी विस्तृत प्रायश्चित-सिद्धान्त को पाठ में नहीं जोड़ता।
- source_word: שְׁלוֹמֵנוּ
  choice: हमारी शांति
  rationale: שָׁלוֹם का सीधा अर्थ ‘शांति’ है, जबकि इसमें कुशलता और संपूर्ण भलाई का व्यापक भाव भी निहित रह सकता है।
- source_word: עָלָיו
  choice: उस पर पड़ा
  rationale: शाब्दिक ‘उस पर था’ की तुलना में ‘उस पर पड़ा’ आधुनिक हिन्दी में दण्ड के भार का स्वाभाविक बिंब प्रस्तुत करता है।
- source_word: וּבַחֲבֻרָתוֹ
  choice: उसके घाव से
  rationale: मूल संज्ञा एकवचन है और प्रहार से हुई चोट बताती है। ‘घाव’ आधुनिक हिन्दी में स्वाभाविक है तथा एकवचन को सुरक्षित रखता है।
- source_word: נִרְפָּא לָנוּ
  choice: हम चंगे हुए
  rationale: यद्यपि इब्रानी रचना अक्षरशः ‘हमारे लिए चंगाई हुई’ के निकट है, प्रसंग में इसका स्वाभाविक आशय है कि उसके घाव से हमें चंगाई मिली। ‘हम चंगे हुए’ इसे संक्षेप और स्पष्टता से व्यक्त करता है।
theological_decisions:
- issue: सेवक की पीड़ा और दूसरों के पापों का संबंध
  choice: ‘हमारे अपराधों के कारण’ और ‘हमारे अधर्मों के कारण’ द्वारा प्रतिनिधिक अथवा दूसरों के कारण उठाई गई पीड़ा का संबंध स्पष्ट रखा गया है, पर उससे आगे कोई विस्तृत प्रायश्चित-सिद्धान्त नहीं जोड़ा गया।
  alternative: या तो इस संबंध को केवल सेवक के आदर्श उदाहरण तक सीमित करना, अथवा पद की भाषा से अधिक स्पष्ट दण्ड-वहन सिद्धान्त जोड़ना।
  rationale: इब्रानी पाठ सेवक की पीड़ा को लोगों के पापों तथा उनकी शांति और चंगाई से प्रत्यक्ष रूप से जोड़ता है। अनुवाद इसी संबंध को बनाए रखता है और उसके तंत्र को अनावश्यक रूप से परिभाषित नहीं करता।
- issue: ‘शांति’ और ‘चंगे हुए’ का दायरा
  choice: दोनों को व्यापक पुनर्स्थापनात्मक अर्थ के लिए खुला रखा गया है।
  alternative: इन्हें केवल शारीरिक आरोग्य, केवल आत्मिक क्षमा, या भौतिक समृद्धि तक सीमित करना।
  rationale: שָׁלוֹם और רפא अर्थ की दृष्टि से व्यापक हैं। हिन्दी शब्दावली भी शारीरिक, आत्मिक और सामुदायिक पुनर्स्थापन के बीच पाठ की वास्तविक व्यापकता को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बेधा गया’, ‘कुचला गया’, ‘दण्ड’ और ‘घाव’ मूल के सशक्त शारीरिक बिंबों को बनाए रखते हैं। ‘चंगे हुए’ बाइबलीय हिन्दी में परिचित है और यहाँ शारीरिक अर्थ तक सीमित नहीं किया गया। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में संबंधित शब्द-समूह के बाद दिए गए हैं।
