reference: Isaiah 1:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בְ/פָרִשְׂ/כֶ֣ם כַּפֵּי/כֶ֗ם אַעְלִ֤ים עֵינַ/י֙ מִ/כֶּ֔ם גַּ֛ם כִּֽי תַרְבּ֥וּ תְפִלָּ֖ה אֵינֶ֣/נִּי שֹׁמֵ֑עַ יְדֵי/כֶ֖ם דָּמִ֥ים מָלֵֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/015.yaml
  text: And when you spread out your palms[a], I hide my eyes from you; even though you multiply prayers, I am not listening[c][b]. Your hands are full of blood.
translation:
  language: hi
  text: और जब तुम अपनी हथेलियाँ फैलाते हो[a], तब मैं तुमसे अपनी आँखें फेर लेता हूँ; चाहे तुम बहुत प्रार्थनाएँ करो, मैं नहीं सुनता[b]। तुम्हारे हाथ खून से भरे हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने हाथ।’ इब्रानी में विशेष रूप से ‘हथेलियाँ’ कहा गया है, जो प्रार्थना में हाथ उठाकर फैलाने की मुद्रा का चित्र प्रस्तुत करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मैं सुन नहीं रहा’ अथवा ‘मैं नहीं सुनूँगा।’ इब्रानी अभिव्यक्ति उनकी प्रार्थनाएँ स्वीकार करने से परमेश्वर की जारी और दृढ़ अस्वीकृति बताती है।
    reason: lexical_alternative
  - marker: c
    text: ‘खून’ का अर्थ यहाँ ‘रक्तपात’ या ‘रक्त-दोष’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְפָרִשְׂכֶם
  choice: और जब तुम ... फैलाते हो
  rationale: बे־ के साथ infinitive construct यहाँ समय-सूचक है। ‘फैलाते हो’ प्रार्थना में हाथ उठाकर फैलाने की मुद्रा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כַּפֵּיכֶם
  choice: अपनी हथेलियाँ
  rationale: כַּף विशेष रूप से हथेली को दर्शाता है; इससे प्रार्थना की ठोस शारीरिक मुद्रा बनी रहती है और आगे आने वाले सामान्य शब्द ‘हाथ’ से भेद भी सुरक्षित रहता है।
- source_word: אַעְלִים עֵינַי מִכֶּם
  choice: मैं तुमसे अपनी आँखें छिपा लेता हूँ
  rationale: हिफ़ील रूप जानबूझकर दृष्टि फेरने या स्वयं को देखने से रोकने का भाव देता है। वर्तमानकालीन हिन्दी इस भविष्यसूचक आरोप में जारी अस्वीकृति को व्यक्त करती है।
- source_word: גַּם כִּי
  choice: चाहे
  rationale: 'यह रियायती अर्थ देता है: उनकी बहुत-सी प्रार्थनाओं के बावजूद परमेश्वर उन्हें ग्रहण नहीं करता।'
- source_word: תַרְבּוּ תְפִלָּה
  choice: तुम बहुत प्रार्थनाएँ करो
  rationale: रूप का शाब्दिक भाव ‘प्रार्थना को बहुत करना’ है। ‘बहुत प्रार्थनाएँ करो’ आधुनिक हिन्दी में स्वाभाविक है और प्रार्थनाओं की बहुलता पर बल रखता है।
- source_word: אֵינֶנִּי שֹׁמֵעַ
  choice: मैं नहीं सुनता
  rationale: नकार के साथ कृदंत जारी अथवा दृढ़ अस्वीकृति व्यक्त करता है। यह अनसुना कर देने का संबंधपरक भाव रखता है, केवल श्रवण-अक्षमता का नहीं।
- source_word: יְדֵיכֶם
  choice: तुम्हारे हाथ
  rationale: यहाँ सामान्य शब्द יָד है। ‘हाथ’ पहले की ‘हथेलियाँ’ से शब्दगत बदलाव सुरक्षित रखता और नैतिक दोष की ओर ध्यान ले जाता है।
- source_word: דָּמִים
  choice: खून
  rationale: बहुवचन रूप रक्तपात या रक्त-दोष का संकेत दे सकता है। ‘खून’ हिन्दी में तीखा, स्वाभाविक और जानबूझकर व्यापक है।
- source_word: מָלֵאוּ
  choice: से भरे हैं
  rationale: पूर्ण क्रिया पूर्व कर्मों से बनी वर्तमान दशा बताती है; ‘से भरे हैं’ इसका स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: परमेश्वर द्वारा कपटपूर्ण उपासना अस्वीकार करने की मानव-सदृश भाषा
  choice: ‘अपनी आँखें छिपा लेता हूँ’ और ‘मैं नहीं सुनता’ की ठोस छवियाँ बनाए रखी गई हैं।
  alternative: ‘मैं तुम्हारी उपेक्षा करता हूँ’ अथवा ‘मैं तुम पर ध्यान नहीं देता।’
  rationale: इब्रानी पाठ शारीरिक बिंबों द्वारा नैतिक रूप से दूषित उपासना के प्रति परमेश्वर की जानबूझकर अस्वीकृति व्यक्त करता है। इसे अमूर्त बनाने से भविष्यवाणी की तीव्रता घटती।
- issue: דָּמִים का नैतिक आशय
  choice: मुख्य पाठ में ‘खून’ रखा गया है और टिप्पणी में ‘रक्तपात’ तथा ‘रक्त-दोष’ की संभावनाएँ दी गई हैं।
  alternative: मुख्य पाठ में केवल ‘रक्तपात’ या केवल ‘हत्या का दोष।’
  rationale: बहुवचन דָּמִים का अर्थक्षेत्र ठोस खून, हिंसक रक्तपात और उससे उपजा दोष समेट सकता है। व्यापक रूप मूल की अर्थगत तनाव और अस्पष्टता सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और भविष्यवाणी की तीव्रता के अनुरूप है। ‘हथेलियाँ’ और ‘हाथ’ का भेद जानबूझकर रखा गया है। ‘खून’ सामान्य पाठक के लिए ‘रक्त’ से अधिक सहज है, जबकि टिप्पणी इसके व्यापक नैतिक अर्थ को स्पष्ट करती है।
