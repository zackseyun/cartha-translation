base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/031.yaml
  text: The strong man will become tinder[a], and his work a spark; both of them will burn together, with no one to quench them.
translation:
  language: hi
  text: बलवान मनुष्य सन के रेशों[a] के समान हो जाएगा, और उसका काम चिनगारी के समान होगा; वे दोनों एक साथ जलेंगे, और उन्हें बुझाने वाला कोई न होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘झाड़े हुए ढीले रेशे’—अर्थात सन के वे रेशे जो आसानी से आग पकड़ लेते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָסֹן
  choice: बलवान मनुष्य
  rationale: यह शब्द किसी शक्तिशाली या सामर्थी व्यक्ति को दर्शाता है। संदर्भ में व्यक्तिगत अर्थ बनाए रखने के लिए ‘बलवान मनुष्य’ स्वाभाविक है।
- source_word: לִנְעֹרֶת
  choice: सन के सूखे रेशे
  rationale: यह झाड़े हुए सन के ढीले रेशों या कचरे को दर्शाता है, जो बहुत आसानी से आग पकड़ता है। हिंदी में यह रूप वस्तु और उसके ज्वलनशील स्वभाव दोनों को समझने योग्य बनाता है।
- source_word: וּפֹעֲלוֹ
  choice: और उसका काम
  rationale: פֹּעַל काम, कर्म या बनाई हुई वस्तु को दर्शा सकता है। ‘उसका काम’ इस अर्थ-विस्तार को अनावश्यक रूप से सीमित नहीं करता।
- source_word: לְנִיצוֹץ
  choice: चिनगारी के समान
  rationale: यह आग की चिनगारी या दहकते कण को दर्शाता है; ‘चिनगारी’ रेशों को प्रज्वलित करने वाली काव्यात्मक छवि स्पष्ट रखती है।
- source_word: וּבָעֲרוּ
  choice: जलेंगे
  rationale: क्रिया का सीधा अर्थ आग में जलना है; यह मूल की तीव्रता में कुछ जोड़े बिना विनाश की छवि बनाए रखता है।
- source_word: שְׁנֵיהֶם יַחְדָּו
  choice: वे दोनों एक साथ
  rationale: यह बलवान मनुष्य और उसके काम के संयुक्त विनाश पर दिए गए मूल जोर को सुरक्षित रखता है।
- source_word: וְאֵין מְכַבֶּה
  choice: और कोई उन्हें बुझानेवाला न होगा
  rationale: אין के साथ कृदंत किसी बुझाने वाले के पूर्ण अभाव को व्यक्त करता है; यह हिंदी में स्वाभाविक और अंतिम न्याय की निर्णायकता के अनुरूप है।
theological_decisions:
- issue: ‘उसका काम’ में एकवचन संबंधवाचक का संदर्भ
  choice: ‘उसका’ बलवान मनुष्य की ओर संकेत करता है; इस प्रकार व्यक्ति और उसका काम दोनों न्याय में जलते हैं।
  alternative: इसे सामूहिक अर्थ में शक्तिशाली वर्ग के कामों की ओर संकेत मानना।
  rationale: इब्रानी का एकवचन प्रत्यय सबसे स्वाभाविक रूप से एकवचन הֶחָסֹן की ओर लौटता है और व्यक्ति तथा उसके काम के बीच काव्यात्मक समानांतरता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज शैली अपनाई गई है। ‘सन के सूखे रेशे’ तकनीकी शब्द से बचते हुए प्राचीन अग्नि-छवि को स्पष्ट करता है; ‘बुझानेवाला न होगा’ भविष्यसूचक काव्य की गंभीरता बनाए रखता है।
