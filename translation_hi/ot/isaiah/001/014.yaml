id: ISA.1.14
reference: Isaiah 1:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: חָדְשֵׁי/כֶ֤ם וּ/מוֹעֲדֵי/כֶם֙ שָׂנְאָ֣ה נַפְשִׁ֔/י הָי֥וּ עָלַ֖/י לָ/טֹ֑רַח נִלְאֵ֖יתִי נְשֹֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/014.yaml
  text: Your new moons and your appointed feasts my soul hates[a]; they have become a burden to me; I am weary of bearing them.
translation:
  language: hi
  text: तुम्हारी अमावस्याओं और तुम्हारे नियत पर्वों[a] से मेरी आत्मा घृणा करती है; वे मेरे लिए बोझ बन गए हैं; उन्हें ढोते-ढोते मैं थक गया हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नियत समयों” अथवा “त्योहारों।”
    reason: מוֹעֵד के अर्थ-क्षेत्र में नियत समय, सभा और पर्व सम्मिलित हैं; धार्मिक संदर्भ में ‘नियत पर्व’ मुख्य पाठ में चुना गया है, जबकि वास्तविक lexical विकल्प यहाँ दिए गए हैं।
lexical_decisions:
- source_word: חָדְשֵיכֶם
  choice: तुम्हारी अमावस्याओं
  rationale: חֹדֶשׁ का मूल अर्थ ‘नया चाँद’ है और यहाँ उससे जुड़ा मासिक धार्मिक पालन अभिप्रेत है। ‘अमावस्याओं’ से हिब्रू अभिव्यक्ति और उसका उपासना-संबंधी आशय संक्षेप में बने रहते हैं।
- source_word: וּמוֹעֲדֵיכֶם
  choice: और तुम्हारे नियत पर्वों
  rationale: מוֹעֵד का अर्थ नियत समय, सभा अथवा पर्व हो सकता है। इस धार्मिक संदर्भ में ‘नियत पर्व’ निर्धारित उत्सवों का अर्थ स्वाभाविक रूप से व्यक्त करता है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: שָׂנְאָה נַפְשִׁי
  choice: से मेरी आत्मा घृणा करती है
  rationale: हिब्रू में נֶפֶשׁ स्पष्ट कर्ता है—शाब्दिक रूप से ‘मेरी आत्मा घृणा करती है।’ इसे बनाए रखने से तीव्र और अत्यंत व्यक्तिगत विरक्ति व्यक्त होती है; इसे केवल ‘मैं घृणा करता हूँ’ कहकर समतल नहीं किया गया। हिंदी में ‘से घृणा करना’ स्वाभाविक प्रयोग है।
- source_word: הָיוּ עָלַי לָטֹרַח
  choice: वे मेरे लिए बोझ बन गए हैं
  rationale: 'यह खंड परिणामी अवस्था बताता है: ये पालन परमेश्वर के लिए बोझ बन गए हैं। पूर्ण क्रिया का भाव ‘बन गए हैं’ से स्पष्ट होता है।'
- source_word: טֹרַח
  choice: बोझ
  rationale: טֹרַח बोझ, कष्ट या श्रम को सूचित करता है। ‘बोझ’ अगले खंड की ढोने की छवि के साथ स्वाभाविक रूप से जुड़ता है।
- source_word: נִלְאֵיתִי
  choice: मैं थक गया हूँ
  rationale: क्रिया गहरी थकावट या क्लांति व्यक्त करती है। यह आधुनिक, स्पष्ट और भविष्यद्वाणी की गरिमा के अनुकूल है।
- source_word: נְשֹׂא
  choice: उन्हें ढोते-ढोते
  rationale: נָשָׂא का अर्थ उठाना, ढोना या सहना है। प्रसंग से कर्म उन धार्मिक पालनों को सूचित करता है; ‘ढोते-ढोते’ बोझ उठाने की रूपकात्मक छवि और लगातार सहने से उत्पन्न थकावट दोनों व्यक्त करता है।
theological_decisions:
- issue: इस्राएल की उपासना-पद्धतियों के प्रति परमेश्वर की घृणा
  choice: पद को भ्रष्ट या कपटपूर्ण रीति से किए जा रहे वाचा-संबंधी धार्मिक पालनों के प्रति परमेश्वर की अस्वीकृति के रूप में रखा गया है; ‘तुम्हारी’ को स्पष्ट रूप से बनाए रखा गया है।
  alternative: ऐसा पाठ जिससे लगे कि परमेश्वर उन नियत पर्वों को अपने आप में ही अस्वीकार करता है।
  rationale: संदर्भ में ‘तुम्हारी’ अमावस्याएँ और ‘तुम्हारे’ नियत पर्व कहना उनके पराए और भ्रष्ट हो चुके पालन की ओर संकेत करता है, न कि अनिवार्यतः उन व्यवस्थाओं के मूल विधान के निषेध की ओर। अनुवाद इस संकेत को सुरक्षित रखता है, पर व्याख्या को मुख्य पाठ में विस्तार देकर तनाव को समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘मेरी आत्मा’ मूल की तीव्रता बनाए रखता है और ‘बोझ…ढोते-ढोते’ हिब्रू रूपक की संगति सुरक्षित करता है।
