reference: Isaiah 1:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ/כַּף רֶ֤גֶל וְ/עַד רֹאשׁ֙ אֵֽין בּ֣/וֹ מְתֹ֔ם פֶּ֥צַע וְ/חַבּוּרָ֖ה וּ/מַכָּ֣ה טְרִיָּ֑ה לֹא זֹ֨רוּ֙ וְ/לֹ֣א חֻבָּ֔שׁוּ וְ/לֹ֥א רֻכְּכָ֖ה בַּ/שָּֽׁמֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/006.yaml
  text: From the sole of the foot even to the head[a], there is no soundness in it—only wounds and bruises and fresh blows; they have not been pressed out, or bandaged[d][c][b], or softened with oil.
translation:
  language: hi
  text: पाँव के तलवे से सिर तक[a] उसमें कुछ भी निरोग नहीं है—केवल घाव, चोट के निशान और ताज़े ज़ख्म[b] हैं। उन्हें निचोड़ा नहीं गया है[c], न पट्टी बाँधी गई है[d], और न तेल लगाकर मुलायम किया गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसमें कहीं भी कुछ निरोग नहीं है।” यहाँ राष्ट्र को एक घायल शरीर के रूप में चित्रित किया गया है।
    reason: alternative_reading
  - marker: b
    text: या, “कच्चे घाव।” इस पदबंध का अर्थ हाल के, खुले या अब तक न भरे घाव हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यह क्रिया उपचार से पहले घाव को दबाकर या निचोड़कर उसमें से मवाद या अन्य पदार्थ निकालने की ओर संकेत कर सकती है।
    reason: cultural_note
  - marker: d
    text: या, “उन्हें नहीं बाँधा गया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכַּף רֶגֶל וְעַד רֹאשׁ
  choice: पाँव के तलवे से सिर तक
  rationale: यह शरीर के निचले सिरे से ऊपरी सिरे तक की संपूर्णता व्यक्त करने वाला स्वाभाविक हिन्दी मुहावरा है।
- source_word: אֵין בּוֹ מְתֹם
  choice: उसमें कुछ भी निरोग नहीं है
  rationale: מְתֹם का अर्थ स्वस्थ, अक्षत या ठीक दशा है। ‘निरोग’ चिकित्सकीय रूपक को स्पष्ट और सहज हिन्दी में बनाए रखता है; ‘उसमें’ राष्ट्र को घायल शरीर के रूप में प्रस्तुत करता है।
- source_word: פֶּצַע
  choice: घाव
  rationale: यह सामान्य चोट या खुले घाव का शब्द है; सामूहिक अर्थ हिन्दी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: חַבּוּרָה
  choice: चोट के निशान
  rationale: यह प्रहार से पड़े नीले निशान, सूजन या धारी का बोध करा सकता है। ‘चोट के निशान’ सामान्य पाठक के लिए स्पष्ट है और अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: מַכָּה טְרִיָּה
  choice: ताज़े ज़ख्म
  rationale: מַכָּה चोट या घाव और טְרִיָּה ताज़ा अथवा कच्चा होने का संकेत देता है। यह अनुवाद हाल के, अब तक अनुपचारित घावों का भाव रखता है।
- source_word: לֹא זֹרוּ
  choice: उन्हें न दबाकर साफ़ किया गया है
  rationale: चिकित्सकीय संदर्भ में क्रिया का आशय घाव को दबाकर उसमें से मवाद या दूषित पदार्थ निकालना हो सकता है। हिन्दी वाक्यांश क्रिया और उपचार का उद्देश्य दोनों समझने योग्य बनाता है।
- source_word: וְלֹא חֻבָּשׁוּ
  choice: न पट्टी बाँधी गई है
  rationale: חבשׁ घाव को बाँधने या पट्टी लगाने का सामान्य चिकित्सकीय अर्थ देता है।
- source_word: וְלֹא רֻכְּכָה בַּשָּׁמֶן
  choice: न तेल लगाकर मुलायम किया गया है
  rationale: רכך का मूल भाव मुलायम करना है; तेल से उपचार का ठोस चित्र सीधे बनाए रखा गया है।
theological_decisions:
- issue: घायल शरीर का संदर्भ
  choice: ‘उसमें’ द्वारा राष्ट्र को सामूहिक घायल शरीर के रूप में रखना
  alternative: ‘उसमें’ को किसी पुरुष व्यक्ति के लिए समझना या ‘वह’ कहकर व्यक्तिकरण को अधिक स्पष्ट करना
  rationale: प्रसंग यहूदा/राष्ट्र को एक घायल शरीर के रूप में चित्रित करता है। हिब्रू בּוֹ व्याकरणतः पुल्लिंग एकवचन है, पर हिन्दी में ‘उसमें’ व्यक्ति और रूपकगत शरीर दोनों की संभावना खुली रखता है तथा किसी एक पुरुष को अनावश्यक रूप से निर्दिष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘ज़ख्म’ प्रचलित और स्पष्ट है, जबकि ‘घाव’ के साथ उसका प्रयोग हिब्रू की चोटों की श्रेणी में भेद बनाए रखने में सहायक है। सभी उपचारात्मक क्रियाएँ निष्क्रिय रूप में रखी गई हैं, जैसा स्रोत-पाठ में है।
