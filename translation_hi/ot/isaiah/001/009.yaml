id: ISA.1.9
reference: Isaiah 1:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לוּלֵי֙ יְהוָ֣ה צְבָא֔וֹת הוֹתִ֥יר לָ֛/נוּ שָׂרִ֖יד כִּ/מְעָ֑ט כִּ/סְדֹ֣ם הָיִ֔ינוּ לַ/עֲמֹרָ֖ה דָּמִֽינוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/009.yaml
  text: If Yahweh of hosts had not left us a very small remnant[a], we would have become like Sodom; we would have resembled Gomorrah.
translation:
  language: hi
  text: यदि सेनाओं के याहवे ने हमारे लिए केवल कुछ बचे हुए लोगों को न छोड़ा होता,[a] तो हम सदोम के समान हो गए होते; हम अमोरा के समान होते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि सेनाओं के याहवे ने हमारे लिए थोड़ा-सा शेष बचाए न रखा होता।”
    reason: שָׂרִיד के लिए ‘शेष’ और הוֹתִיר के लिए ‘बचाए रखना’ वाला अधिक औपचारिक, निकटवर्ती विकल्प।
lexical_decisions:
- source_word: לוּלֵי
  choice: यदि ... न ... होता
  rationale: यह भूतकाल की तथ्य-विपरीत शर्त व्यक्त करता है; हिन्दी में ‘यदि ... न ... होता, तो ...’ इसका स्वाभाविक रूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित बाइबलीय लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: צְבָאוֹת
  choice: सेनाओं के
  rationale: यह बहुवचन संज्ञा सेनाओं अथवा स्वर्गीय दलों के व्यापक भाव को बनाए रखती है; इसे केवल मानवीय सेना तक सीमित नहीं किया गया।
- source_word: הוֹתִיר
  choice: न छोड़ा होता
  rationale: हिफ़ील रूप का अर्थ किसी को शेष रहने देना या बचाकर रखना है; ‘छोड़ा होता’ सरल है और अगले पदबंध में बचे हुओं के साथ अर्थ स्पष्ट करता है।
- source_word: שָׂרִיד
  choice: बचे हुए
  rationale: एकवचन रूप यहाँ सामूहिक अर्थ रखता है। ‘बचे हुए’ आधुनिक हिन्दी में स्वाभाविक है और जीवित बचाए गए थोड़े लोगों का भाव स्पष्ट करता है।
- source_word: כִּמְעָט
  choice: थोड़े-से
  rationale: यह संख्या या मात्रा की अत्यल्पता बताता है; ‘थोड़े-से’ सामूहिक ‘बचे हुओं’ के साथ सहज बैठता है।
- source_word: כִּסְדֹם
  choice: सदोम के समान
  rationale: उपसर्ग כ तुलना व्यक्त करता है; ‘के समान’ गरिमापूर्ण और स्पष्ट हिन्दी है।
- source_word: הָיִינוּ
  choice: हम ... हो गए होते
  rationale: तथ्य-विपरीत परिणाम में यह उस दशा तक पहुँच जाने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: לַעֲמֹרָה
  choice: अमोरा
  rationale: यह नाम हिन्दी बाइबल परंपरा में प्रचलित रूप से लिप्यंतरित किया गया है।
- source_word: דָּמִינוּ
  choice: हम ... जैसे हो गए होते
  rationale: क्रिया समान होने या सदृश ठहरने का अर्थ देती है। हिन्दी में ‘जैसे हो गए होते’ स्पष्ट है, यद्यपि समानांतर पहली पंक्ति के निकट रहता है।
theological_decisions:
- issue: יְהוָה צְבָאוֹת का अनुवाद
  choice: सेनाओं के यहोवा
  alternative: सेनाओं का याहवे; सर्वशक्तिमान यहोवा
  rationale: मूल में व्यक्तिगत नाम और צְבָאוֹת की उपाधि दोनों प्रत्यक्ष हैं। चुना हुआ रूप दोनों को बनाए रखता है और ‘सर्वशक्तिमान’ जैसी व्याख्यात्मक समानता से बचता है।
- issue: שָׂרִיד כִּמְעָט में शेष बचे समुदाय का भाव
  choice: थोड़े-से बचे हुए
  alternative: एक बहुत छोटा शेष; कुछ जीवित बचे लोग
  rationale: मूल का एकवचन सामूहिक हो सकता है। मुख्य पाठ प्राकृतिक हिन्दी में सामूहिक भाव देता है, जबकि पादटिप्पणी ‘शेष’ वाले साहित्यिक-विषयक विकल्प को सुरक्षित रखती है।
- issue: सदोम और अमोरा से तुलना
  choice: पूर्ण विनाश जैसी परिणति की तुलना को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: हम सदोम और अमोरा के समान नष्ट हो गए होते
  rationale: मूल पद में ‘नष्ट’ क्रिया प्रत्यक्ष नहीं है; अतः ऐतिहासिक संकेत को पाठक पर छोड़ते हुए तुलना को ही अनूदित किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। तथ्य-विपरीत शर्त को स्पष्ट हिन्दी संरचना में रखा गया है। ‘सदोम’ और ‘अमोरा’ के प्रचलित हिन्दी रूप अपनाए गए हैं; दूसरे समानांतर खंड में मूल की अलग क्रिया का अर्थ रखा गया है, पर अस्वाभाविक ‘सदृश हुए होते’ से बचा गया है।
