id: ISA.1.28
reference: Isaiah 1:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שֶׁ֧בֶר פֹּשְׁעִ֛ים וְ/חַטָּאִ֖ים יַחְדָּ֑ו וְ/עֹזְבֵ֥י יְהוָ֖ה יִכְלֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/028.yaml
  text: But rebels and sinners will be broken together[b][a], and those who forsake Yahweh will come to an end.
translation:
  language: hi
  text: पर विद्रोहियों और पापियों का एक साथ विनाश होगा[a], और याहवे को छोड़नेवाले मिट जाएँगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विद्रोही और पापी एक साथ चूर किए जाएँगे।” इब्रानी शब्द का अर्थ “टूटना,” “बरबादी” या “विनाश” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “समाप्त हो जाएँगे” अथवा “नष्ट हो जाएँगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁבֶר
  choice: विनाश
  rationale: यह संज्ञा टूटने, बरबादी या विनाश का बोध कराती है। यहाँ ‘विनाश होगा’ मूल की संज्ञात्मक रचना को सुरक्षित रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: פֹּשְׁעִים
  choice: विद्रोही
  rationale: यह शब्द जानबूझकर बगावत या उल्लंघन करनेवालों को दर्शाता है; ‘विद्रोही’ उसके प्रबल भाव को स्पष्ट रखता है।
- source_word: חַטָּאִים
  choice: पापी
  rationale: यह पाप करनेवालों या पाप से पहचाने जानेवालों के लिए सामान्य शब्द है और ‘विद्रोही’ से उसका भेद बनाए रखता है।
- source_word: יַחְדָּו
  choice: एक साथ
  rationale: यह उनके संयुक्त या समान समय पर आनेवाले परिणाम को व्यक्त करता है।
- source_word: עֹזְבֵי יְהוָה
  choice: याहवे को छोड़नेवाले
  rationale: सहभागी रूप עֹזְבֵי त्यागने या छोड़ देनेवालों को दर्शाता है; यह अनुवाद वाचा से विमुख होने की गंभीरता बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का विशिष्ट नाम है; ‘याहवे’ उसका देवनागरी लिप्यंतरण है, न कि किसी उपाधि से उसका प्रतिस्थापन।
- source_word: יִכְלוּ
  choice: मिट जाएँगे
  rationale: כלה यहाँ समाप्त हो जाने, नष्ट हो जाने या चुक जाने का अर्थ देता है। ‘मिट जाएँगे’ न्याय में उनके अंत को स्वाभाविक और प्रभावशाली हिन्दी में व्यक्त करता है, बिना विनाश के किसी खास साधन को निर्धारित किए।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। उसका लिप्यंतरण नाम और उपाधि के बीच का भेद सुरक्षित रखता है।
- issue: שֶׁבֶר की व्याकरणिक और न्याय-संबंधी अभिव्यक्ति
  choice: ‘विनाश होगा’ के रूप में संज्ञात्मक अनुवाद
  alternative: ‘चूर किए जाएँगे’ के रूप में क्रियात्मक अनुवाद
  rationale: इब्रानी में ‘टूटना/विनाश’ संज्ञा है और स्पष्ट क्रिया नहीं है। मुख्य पाठ उसकी संज्ञात्मक बनावट को बनाए रखता है; वैकल्पिक क्रियात्मक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘विद्रोही’ और ‘पापी’ मूल के दो अलग नैतिक पदों का भेद बनाए रखते हैं। ‘याहवे’ को व्यक्तिगत ईश्वरीय नाम के रूप में लिप्यंतरित किया गया है।
