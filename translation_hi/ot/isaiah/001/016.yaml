source:
  edition: WLC
  text: רַחֲצוּ֙ הִזַּכּ֔וּ הָסִ֛ירוּ רֹ֥עַ מַעַלְלֵי/כֶ֖ם מִ/נֶּ֣גֶד עֵינָ֑/י חִדְל֖וּ הָרֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/016.yaml
  text: Wash yourselves[a]; make yourselves clean. Remove the evil of your deeds from before my eyes[b]. Stop doing evil.
translation:
  language: hi
  text: अपने को धोओ[a], अपने को शुद्ध करो। अपने कामों की बुराई मेरी आँखों के सामने से दूर करो[b]। बुराई करना छोड़ दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्नान करो।” इब्रानी क्रिया का अर्थ शरीर धोना या स्नान करना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मेरी आँखों के सामने से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחֲצוּ
  choice: अपने को धोओ
  rationale: बहुवचन आज्ञार्थक रूप और प्रसंग में निहित आत्मवाची अर्थ को सीधे तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הִזַּכּוּ
  choice: अपने को शुद्ध करो
  rationale: स्वयं स्वच्छ या शुद्ध होने के आत्मवाची भाव को बनाए रखता है और नैतिक शुद्धि के प्रसंग में स्वाभाविक है।
- source_word: הָסִירוּ
  choice: दूर करो
  rationale: कारक आज्ञार्थक अर्थ ‘हटा दो/दूर करो’ को स्पष्ट करता है और आगे के ‘मेरी आँखों के सामने से’ के साथ सहज बैठता है।
- source_word: רֹעַ מַעַלְלֵיכֶם
  choice: अपने कामों की बुराई
  rationale: מַעַלְלִים के कर्म/काम और רֹעַ के नैतिक बुराई के अर्थ को संक्षिप्त, सामान्य हिन्दी में रखता है।
- source_word: מִנֶּגֶד עֵינַי
  choice: मेरी आँखों के सामने से
  rationale: इब्रानी की सजीव और निकट-शाब्दिक अभिव्यक्ति को बनाए रखता है; इसे केवल ‘मेरी दृष्टि से’ कहकर सपाट नहीं करता।
- source_word: חִדְלוּ הָרֵעַ
  choice: बुराई करना छोड़ दो
  rationale: חדל के ‘रुकना/छोड़ना’ और הָרֵעַ के क्रियात्मक ‘बुराई करना’ अर्थ को आधुनिक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: धोने और शुद्ध होने की भाषा
  choice: इसे नैतिक पश्चात्ताप और आचरण-सुधार की आज्ञा के रूप में रखा गया है।
  alternative: इसे किसी विशिष्ट अनुष्ठान या संस्कार की तकनीकी भाषा मानना।
  rationale: आस-पास का प्रसंग लोगों के बुरे कामों को त्यागने की माँग करता है। पद स्वयं किसी खास अनुष्ठान या बाद की धर्मसैद्धांतिक व्यवस्था का उल्लेख नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; आज्ञाओं की तीव्र, समानांतर लय बनाए रखी गई है। ‘अपने को’ सामान्य और स्पष्ट आत्मवाची रूप है। भाषा गरिमापूर्ण है, पर अनावश्यक संस्कृतनिष्ठ या अनुष्ठानिक नहीं।
