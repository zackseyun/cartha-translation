  text: לִמְד֥וּ הֵיטֵ֛ב דִּרְשׁ֥וּ מִשְׁפָּ֖ט אַשְּׁר֣וּ חָמ֑וֹץ שִׁפְט֣וּ יָת֔וֹם רִ֖יבוּ אַלְמָנָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/017.yaml
  text: Learn to do good; seek justice[a], correct the oppressor; judge for the fatherless, plead for the widow.
translation:
  language: hi
  text: भलाई करना सीखो; न्याय की खोज करो; अत्याचारी को सुधारो[a]; अनाथ को न्याय दिलाओ; विधवा की पैरवी करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पीड़ित की सहायता करो’ अथवा ‘पीड़ित की दशा सुधारो।’ इस इब्रानी वाक्यांश का अर्थ निश्चित नहीं है, और חָמוֹץ को अलग-अलग ढंग से समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: לִמְדוּ הֵיטֵב
  choice: भलाई करना सीखो
  rationale: לִמְדוּ बहुवचन आज्ञार्थक है और הֵיטֵב यहाँ नैतिक रूप से अच्छा करने की बात व्यक्त करता है। यह अनुवाद सीधे आह्वान और उसके व्यावहारिक अर्थ, दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: דִּרְשׁוּ מִשְׁפָּט
  choice: न्याय की खोज करो
  rationale: דִּרְשׁוּ सक्रिय रूप से खोजने या पाने का प्रयत्न करने को कहता है, जबकि מִשְׁפָּט इस भविष्यवाणी-संबंधी संदर्भ में सामाजिक और कानूनी न्याय है।
- source_word: אַשְּׁרוּ חָמוֹץ
  choice: अत्याचारी को सुधारो
  rationale: אַשְּׁרוּ को ‘सीधा करो/सुधारो’ और कठिन शब्द חָמוֹץ को कर्तृवाचक अर्थ में ‘अत्याचारी’ समझा गया है। वाक्य संक्षिप्त रहता है, जबकि वैकल्पिक पाठ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: שִׁפְטוּ יָתוֹם
  choice: अनाथ का न्याय करो
  rationale: שִׁפְטוּ न्यायिक निर्णय या न्याय करने का भाव रखता है और יָתוֹם सामाजिक रूप से असुरक्षित, पिता-विहीन बच्चे को दर्शाता है। ‘अनाथ का न्याय करो’ मूल के कानूनी स्वर को बनाए रखता है।
- source_word: רִיבוּ אַלְמָנָה
  choice: विधवा का मुक़दमा लड़ो
  rationale: רִיבוּ यहाँ किसी के कानूनी विवाद में उसकी ओर से पैरवी करने का भाव देता है। ‘मुक़दमा लड़ो’ आधुनिक हिन्दी में स्वाभाविक है और न्यायालय-संबंधी अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: אַשְּׁרוּ חָמוֹץ का कठिन और विवादित अर्थ
  choice: अत्याचारी को सुधारो
  alternative: पीड़ित की सहायता करो; पीड़ित के साथ न्याय करो
  rationale: חָמוֹץ का रूप कर्तृवाचक ‘अत्याचारी’ अथवा कर्मवाचक ‘पीड़ित’ समझा गया है। मुख्य पाठ कर्तृवाचक अर्थ अपनाता है, पर वास्तविक भाषाई अस्पष्टता को पाद-टिप्पणी में बनाए रखता है और इस तरह भविष्यवक्ता की अन्याय सुधारने की माँग को किसी एक निर्विवाद अर्थ के रूप में प्रस्तुत नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधे आज्ञार्थक रूप में है। समानांतर आदेशों की लय बनाए रखने के लिए प्रत्येक खंड में ‘करो’ का प्रयोग किया गया है। ‘अनाथ,’ ‘विधवा,’ ‘न्याय’ और ‘मुक़दमा’ सामान्य पाठकों के लिए परिचित हैं तथा मूल के सामाजिक-कानूनी स्वर को बनाए रखते हैं।
