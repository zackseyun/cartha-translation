  to: 'इसलिए प्रभु, सेनाओं के याहवे, इस्राएल के पराक्रमी की यह घोषणा है[a]: “आह! मैं अपने विरोधियों से राहत पाऊँगा[b] और अपने शत्रुओं से बदला लूँगा।”'
