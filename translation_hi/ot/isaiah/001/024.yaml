id: ISA.1.24
reference: Isaiah 1:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵ֗ן נְאֻ֤ם הָֽ/אָדוֹן֙ יְהוָ֣ה צְבָא֔וֹת אֲבִ֖יר יִשְׂרָאֵ֑ל ה֚וֹי אֶנָּחֵ֣ם מִ/צָּרַ֔/י וְ/אִנָּקְמָ֖ה מֵ/אוֹיְבָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/024.yaml
  text: 'Therefore the declaration of the Lord[a], Yahweh of Armies, the Mighty One of Israel: “Ah[c][b], I will get relief from my foes and avenge myself on my enemies.”'
translation:
  language: hi
  text: 'इसलिए प्रभु, सेनाओं के याहवे, इस्राएल के पराक्रमी की यह घोषणा है[a]: “आह! मैं अपने विरोधियों से राहत पाऊँगा[b] और अपने शत्रुओं से बदला लूँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वाणी।”
    reason: lexical_alternative
  - marker: b
    text: या, “मैं अपने विरोधियों पर न्याय करके चैन पाऊँगा”; इब्रानी क्रिया का अर्थ यहाँ राहत, सांत्वना या संतोष पाना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले अभियोग के परिणामस्वरूप आने वाली ईश्वरीय घोषणा को स्वाभाविक और स्पष्ट ढंग से जोड़ता है।
- source_word: נְאֻם
  choice: यह कथन है
  rationale: यह गंभीर भविष्यद्वाणी-सूत्र का भार बनाए रखते हुए आधुनिक हिन्दी में सहज है; ‘वाणी’ भी संभव है, इसलिए पादटिप्पणी दी गई है।
- source_word: הָאָדוֹן
  choice: प्रभु
  rationale: निश्चित उपपद सहित यह पद परमेश्वर के प्रभुत्व पर बल देता है; ‘प्रभु’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: יְהוָה
  choice: यहवे
  rationale: मूल में आए परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में प्रतिलिपित किया गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं के
  rationale: यह צְבָאוֹת के ठोस सामरिक अर्थ को ‘गणों’ जैसे कम पारदर्शी पारंपरिक विकल्प से अधिक स्पष्ट करता है।
- source_word: אֲבִיר יִשְׂרָאֵל
  choice: इस्राएल के पराक्रमी
  rationale: यह ईश्वरीय उपाधि सामर्थ्य पर बल देती है और हिन्दी में संज्ञात्मक रूप से स्वाभाविक है।
- source_word: הוֹי
  choice: आह!
  rationale: यह विस्मयादिबोधक ईश्वरीय भाव और दृढ़ संकल्प को बनाए रखता है, पर उसे केवल शोक या उपहास के रूप में सीमित नहीं करता।
- source_word: אֶנָּחֵם
  choice: मैं ... राहत पाऊँगा
  rationale: निफ़अल रूप यहाँ विरोधियों पर न्याय करने से मिलने वाली राहत या संतोष का संकेत देता है; इसे अगले प्रतिशोध-सूचक क्रिया के साथ मिला नहीं दिया गया।
- source_word: מִצָּרַי
  choice: अपने विरोधियों से
  rationale: מן के साथ यह राहत के स्रोत अथवा जिनसे निपटकर राहत मिलती है, उस संबंध को व्यक्त करता है।
- source_word: וְאִנָּקְמָה
  choice: और ... बदला लूँगा
  rationale: यह प्रथम पुरुष के दृढ़ निश्चय और प्रतिशोध की सक्रिय, आत्म-संबंधी शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵאוֹיְבָי
  choice: अपने शत्रुओं से
  rationale: נקם के साथ हिन्दी में ‘से बदला लेना’ सीधा और प्रचलित प्रयोग है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; अथवा ‘यहोवा/प्रभु’ जैसी पारंपरिक प्रस्तुति
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। उसे ‘प्रभु’ उपाधि में विलीन न करके प्रतिलिपित करने से הָאָדוֹן और יְהוָה का भेद बना रहता है।
- issue: ईश्वरीय राहत और प्रतिशोध का संबंध
  choice: ‘राहत पाऊँगा’ और ‘बदला लूँगा’ को दो संबंधित किंतु अलग क्रियाओं के रूप में रखा गया
  alternative: ‘विरोधियों से प्रतिशोध लेकर संतुष्ट होऊँगा’ जैसे एकीकृत अर्थ में प्रस्तुत करना
  rationale: मूल में दो क्रियाएँ हैं। अनुवाद न्याय के द्वारा मिलने वाली राहत की कठिन धर्मवैचारिक छवि को नरम नहीं करता और न ही दोनों क्रियाओं को एक में मिला देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘सेनाओं के यहवे’ मूल उपाधि की ठोस शक्ति बनाए रखता है। विस्मयादिबोधक ‘आह!’ और न्याय-संबंधी कठोरता को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
