  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יָדַ֥ע שׁוֹר֙ קֹנֵ֔/הוּ וַ/חֲמ֖וֹר אֵב֣וּס בְּעָלָ֑י/ו יִשְׂרָאֵל֙ לֹ֣א יָדַ֔ע עַמִּ֖/י לֹ֥א הִתְבּוֹנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/003.yaml
  text: An ox knows its owner[a], and a donkey its master's feeding trough; Israel does not know[b]; my people do not understand.
translation:
  language: hi
  text: 'बैल अपने मालिक को जानता है,

    और गधा अपने स्वामी की चरनी[a] को;

    पर इस्राएल नहीं जानता[b],

    मेरी प्रजा नहीं समझती।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चारे की नाँद।”
    reason: lexical_alternative
  - marker: b
    text: भाव यह है कि इस्राएल यहोवा को नहीं जानता, यद्यपि इब्रानी में कर्म नहीं बताया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: יָדַע
  choice: जानता है
  rationale: मूल में आरम्भ और तीसरी पंक्ति में एक ही क्रिया दोहराई गई है। “जानता है/नहीं जानता” इस पुनरावृत्ति और संबंधपरक अर्थ को बनाए रखता है।
- source_word: שׁוֹר
  choice: बैल
  rationale: पालतू, काम में आने वाले गोवंश के इस एकवचन चित्र के लिए “बैल” स्वाभाविक और सटीक हिन्दी है।
- source_word: קֹנֵהוּ
  choice: अपने मालिक को
  rationale: पशु के घरेलू संदर्भ में קנה से बना रूप उसके अधिकारी या स्वामी को दर्शाता है; “मालिक” आधुनिक हिन्दी में सहज है।
- source_word: חֲמוֹר
  choice: गधा
  rationale: यह सामान्य, स्पष्ट और आधुनिक हिन्दी पद है।
- source_word: אֵבוּס
  choice: चरनी
  rationale: पशु के चारा खाने के पात्र या स्थान के लिए “चरनी” संक्षिप्त और प्रचलित है; “चारे की नाँद” भी संभव है।
- source_word: בְּעָלָיו
  choice: अपने स्वामी की
  rationale: בעל यहाँ पशु के अधिकारी को दर्शाता है। “स्वामी” पहली पंक्ति के “मालिक” के साथ स्वाभाविक समानांतरता और अर्थ दोनों बनाए रखता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: वाचा की प्रजा/राष्ट्र का नाम ज्यों का त्यों रखा गया है।
- source_word: לֹא יָדַע
  choice: नहीं जानता
  rationale: आरम्भिक “जानता है” की शब्दगत पुनरावृत्ति बनाए रखी गई है और मूल की तरह कर्म को अनकहा छोड़ा गया है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: प्रथम पुरुष संबंधसूचक प्रत्यय और वाचा-संबंधी भाव को सीधे व्यक्त करता है।
- source_word: הִתְבּוֹנָן
  choice: नहीं समझती
  rationale: यह रूप विचारपूर्वक समझने या विवेक करने की विफलता बताता है; “नहीं समझती” समानांतर पंक्ति में स्वाभाविक है।
theological_decisions:
- issue: इस्राएल किसे नहीं जानता—इसका निहित कर्म
  choice: 'मुख्य पाठ में कर्म को अनकहा रखा गया: “इस्राएल नहीं जानता”'
  alternative: “इस्राएल मुझे/परमेश्वर को नहीं जानता”
  rationale: संदर्भ में निहित कर्म यहोवा है, पर इब्रानी पाठ उसे स्पष्ट नहीं करता। उसे न जोड़ने से मूल की संक्षिप्तता, अस्पष्टता और आरोप का आलंकारिक बल सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। काव्यात्मक समानांतरता दिखाने के लिए पंक्ति-विन्यास रखा गया है। “मालिक/स्वामी” अर्थ की समानता बनाए रखते हुए हिन्दी में अनावश्यक पुनरावृत्ति से बचाते हैं; “पर” पशुओं और इस्राएल के बीच निहित विरोध को स्वाभाविक रूप से स्पष्ट करता है।
