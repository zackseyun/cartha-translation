  yaml_path: translation/ot/isaiah/001/020.yaml
  text: But if you refuse and rebel[a], you will be devoured by the sword; for the mouth of Yahweh has spoken.
translation:
  language: hi
  text: पर यदि तुम मानने से इनकार करोगे और विद्रोह करोगे, तो तलवार तुम्हें खा जाएगी[a]; क्योंकि याहवे के मुख ने यह कहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक अर्थ है, “तुम तलवार द्वारा खाए जाओगे।” यह वचन पिछले वचन के साथ जानबूझकर विरोध रचता है: आज्ञा माननेवाले “देश की उत्तम उपज खाएँगे,” पर विद्रोही स्वयं तलवार द्वारा खाए जाएँगे।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: पर यदि
  rationale: वचन 19 की प्रतिज्ञा के विपरीत परिणाम को दिखाते हुए भी शर्त का भाव बनाए रखता है।
- source_word: תְּמָאֲנוּ
  choice: तुम इनकार करोगे
  rationale: मूल क्रिया מאן जानबूझकर अस्वीकार करने या न मानने का भाव देती है; ‘इनकार करना’ आधुनिक हिन्दी में स्पष्ट और सशक्त है।
- source_word: וּמְרִיתֶם
  choice: और विद्रोह करोगे
  rationale: מרה केवल असहमति नहीं, बल्कि अवज्ञापूर्ण विद्रोह को व्यक्त करती है।
- source_word: חֶרֶב
  choice: तलवार
  rationale: एकवचन संज्ञा हिंसक न्याय या युद्धजनित विनाश की सजीव भविष्यद्वक्तात्मक छवि है; इसे अमूर्त ‘युद्ध’ नहीं बनाया गया।
- source_word: תְּאֻכְּלוּ
  choice: तुम्हें खा जाएगी
  rationale: אכל के ‘खाना’ अर्थ को बनाए रखने से वचन 19 के ‘देश की उत्तम उपज खाओगे’ के साथ जानबूझकर रचा गया उलटाव सुरक्षित रहता है। स्वाभाविक हिन्दी के लिए इब्रानी कर्मवाच्य को तलवार कर्ता वाली रचना में व्यक्त किया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह चेतावनी के निश्चित आधार और कारण का परिचय देता है।
- source_word: פִּי יְהוָה
  choice: याहवे के मुख
  rationale: ‘मुख’ को बनाए रखने से परमेश्वर की अधिकारपूर्ण वाणी की मूल सजीव अभिव्यक्ति सुरक्षित रहती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ के विशिष्ट वाचा-नाम יהוה को उपाधि में बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: דִּבֵּר
  choice: ने कहा है
  rationale: इब्रानी पूर्ण क्रिया घोषणा की निश्चितता और अधिकार व्यक्त करती है; हिन्दी पूर्ण रूप ‘कहा है’ इसे स्वाभाविक ढंग से संप्रेषित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में वाचा-नाम सीधे आया है। ‘याहवे’ उसे नाम के रूप में बनाए रखता है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: तलवार द्वारा ‘खाए जाने’ की छवि
  choice: तलवार तुम्हें खा जाएगी
  alternative: तलवार से तुम्हारा विनाश होगा
  rationale: मूल रूपक न्याय की कठोरता के साथ पिछले वचन के ‘खाने’ से अर्थपूर्ण विरोध रचता है; अमूर्त विकल्प उस तनाव और शब्द-संबंध को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘तलवार तुम्हें खा जाएगी’ हिन्दी में सजीव है और मूल के असामान्य किंतु महत्वपूर्ण खाने-वाले रूपक को सुरक्षित रखती है; ‘याहवे के मुख’ मूल की मानवरूपी भविष्यद्वक्तात्मक अभिव्यक्ति को जानबूझकर बनाए रखता है।
