  rationale: यह विस्मयादिबोधक शब्द विलाप और धिक्कार—दोनों का भाव व्यक्त कर सकता है। ‘हाय’ उसकी खुली, तीखी भावात्मक शक्ति बनाए रखता है।
- source_word: גּוֹי חֹטֵא
  choice: पापी जाति
  rationale: कृदंत חֹטֵא यहाँ विशेषण की तरह पूरी जाति का नैतिक चरित्र बताता है; ‘पापी जाति’ स्वाभाविक और संक्षिप्त है।
- source_word: עַם כֶּבֶד עָוֺן
  choice: अधर्म के बोझ से दबी प्रजा
  rationale: כֶּבֶד के ‘भारी’ होने के रूपक को हिन्दी में ‘बोझ से दबी’ के द्वारा स्पष्ट रखा गया है; עָוֺן में अपराध और दोष, दोनों की छाया है।
- source_word: זֶרַע מְרֵעִים
  choice: कुकर्मियों की संतान
  rationale: זֶרַע सामूहिक अर्थ में वंश अथवा संतान है। यह अनुवाद पारिवारिक और सामूहिक अभियोग को बनाए रखता है।
- source_word: בָּנִים מַשְׁחִיתִים
  choice: भ्रष्ट आचरण करनेवाले पुत्र
  rationale: हिफ़ील कृदंत यहाँ भ्रष्ट अथवा विनाशकारी व्यवहार का बोध देता है। यह रूप उन्हें भ्रष्टता के सक्रिय कर्ता के रूप में प्रस्तुत करता है।
- source_word: עָזְבוּ אֶת יְהוָה
  choice: उन्होंने याहवे को त्याग दिया
  rationale: עָזַב का अर्थ छोड़ना अथवा त्यागना है; ‘त्याग दिया’ वाचा-संबंधी विश्वासघात की गंभीरता व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चार-अक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: נִאֲצוּ
  choice: तिरस्कार किया
  rationale: यह क्रिया घृणापूर्वक ठुकराने या अपमान करने का भाव देती है; ‘तिरस्कार किया’ संक्षिप्त और प्रबल है।
- source_word: קְדוֹשׁ יִשְׂרָאֵל
