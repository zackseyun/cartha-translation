  text: ה֣וֹי גּ֣וֹי חֹטֵ֗א עַ֚ם כֶּ֣בֶד עָוֺ֔ן זֶ֣רַע מְרֵעִ֔ים בָּנִ֖ים מַשְׁחִיתִ֑ים עָזְב֣וּ אֶת יְהוָ֗ה נִֽאֲצ֛וּ אֶת קְד֥וֹשׁ יִשְׂרָאֵ֖ל נָזֹ֥רוּ אָחֽוֹר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/004.yaml
  text: Ah[a], sinful nation, a people heavy with iniquity, offspring of evildoers[b], children who act corruptly! They have forsaken Yahweh; they have despised the Holy One of Israel[e][d][c]; they have turned backward.
translation:
  language: hi
  text: हाय[a], पापी राष्ट्र! अधर्म के बोझ से दबी प्रजा[b], कुकर्मियों की संतान, भ्रष्ट आचरण करनेवाले पुत्र[c]! उन्होंने याहवे[d] को त्याग दिया; उन्होंने इस्राएल के पवित्र परमेश्वर का तिरस्कार किया; वे विमुख होकर पीछे लौट गए[e]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे ‘धिक्कार है’ या ‘अफ़सोस’ भी अनुवाद किया जा सकता है। इब्रानी शब्द में विलाप और दंडसूचक धिक्कार, दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘अधर्म से भारी प्रजा’; अर्थात अधर्म के बोझ से लदी हुई प्रजा।
    reason: lexical_alternative
  - marker: c
    text: इसे ‘बिगाड़ करनेवाले पुत्र’ या ‘विनाश करनेवाले पुत्र’ भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
  - marker: d
    text: ‘याहवे’ इब्रानी ईश्वरीय नाम יהוה (YHWH) का लिप्यंतरण है।
    reason: alternative_reading
  - marker: e
    text: इसे ‘उन्होंने पीठ फेर ली’ या ‘वे पराए होकर पीछे चले गए’ भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
