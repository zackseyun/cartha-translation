  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। उसका लिप्यंतरण नाम और उपाधि के भेद को सुरक्षित रखता है।
- issue: राष्ट्रीय और पारिवारिक अभियोग की परतें
  choice: ‘जाति/प्रजा’ तथा ‘संतान/पुत्र’ दोनों प्रकार की भाषा बनाए रखना
  alternative: सभी पदों को केवल सामूहिक राजनीतिक भाषा में समतल करना
  rationale: पद जानबूझकर राष्ट्रीय पहचान और पारिवारिक संबंध दोनों के द्वारा विद्रोह की गंभीरता बढ़ाता है।
- issue: נָזֹרוּ אָחוֹר की अस्पष्टता
  choice: ‘विमुख होकर पीछे हट गए’
  alternative: ‘उन्होंने पीठ फेर ली’; ‘वे पराए होकर पीछे चले गए’
  rationale: क्रिया में अलगाव और दिशा-परिवर्तन दोनों संभव हैं; मुख्य पाठ दोनों संकेतों को बिना किसी एक मुहावरे तक सीमित किए रखता है।
