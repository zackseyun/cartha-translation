- source_word: נָזֹרוּ אָחוֹר
  choice: वे विमुख होकर पीछे हट गए
  rationale: נָזֹרוּ में अलग अथवा विमुख हो जाने और אָחוֹר में पीछे की ओर जाने का भाव है; चुना हुआ रूप दोनों तत्वों को बनाए रखता है।
theological_decisions:
