base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/027.yaml
  text: Zion will be redeemed by justice[a], and her returnees by righteousness.
translation:
  language: hi
  text: सिय्योन न्याय के द्वारा छुड़ाई जाएगी, और उसके लौटनेवाले[a] धार्मिकता के द्वारा छुड़ाए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘लौटनेवाले’ का अर्थ ‘मन फिरानेवाले’ भी हो सकता है। इब्रानी शब्द लौटने और मन फिराने—दोनों का भाव व्यक्त कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: צִיּוֹן
  choice: सिय्योन
  rationale: स्थानवाचक नाम को हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरित किया गया है।
- source_word: בְּמִשְׁפָּט
  choice: न्याय के द्वारा
  rationale: מִשְׁפָּט में न्याय और न्यायिक निर्णय दोनों का भाव हो सकता है; यहाँ छुटकारे के साधन को व्यक्त करनेवाले בְּ के साथ ‘न्याय के द्वारा’ पुनर्स्थापनात्मक और नैतिक-न्यायिक अर्थ को बनाए रखता है।
- source_word: תִּפָּדֶה
  choice: छुटकारा ... होगा
  rationale: פדה के निफ़अल रूप का अर्थ छुड़ाया जाना या मूल्य देकर मुक्त किया जाना है। संज्ञात्मक हिन्दी रचना स्वाभाविक है और उद्धार/मुक्ति का मूल भाव बनाए रखती है।
- source_word: וְשָׁבֶיהָ
  choice: और उसके लौटनेवालों का
  rationale: שׁוב के कृदंत और स्त्रीलिंग एकवचन संबंधसूचक प्रत्यय का सीधा अर्थ ‘उसके लौटनेवाले’ है। यह अभिव्यक्ति स्थानिक वापसी और नैतिक-आत्मिक मन-फिराव, दोनों की संभावित ध्वनि को खुला रखती है।
- source_word: בִּצְדָקָה
  choice: धार्मिकता के द्वारा
  rationale: צְדָקָה नैतिक और न्यायिक धार्मिकता को व्यक्त करता है। ‘धार्मिकता’ समानांतर पंक्ति में מִשְׁפָּט के ‘न्याय’ से भेद भी बनाए रखती है।
theological_decisions:
- issue: וְשָׁבֶיהָ में भौतिक वापसी और मन-फिराव के बीच अर्थ-संभवता
  choice: उसके लौटनेवाले
  alternative: उसके मन फिरानेवाले
  rationale: मूल कृदंत ‘लौटने/फिरनेवाले’ कहता है और संदर्भ में पश्चात्ताप का संकेत संभव है, पर उसे अनिवार्य नहीं बनाता। मुख्य पाठ अधिक प्रत्यक्ष और अर्थ की दृष्टि से खुला रखा गया है; नैतिक-आत्मिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर काव्य-रचना को बनाए रखने के लिए दूसरी पंक्ति में ‘छुटकारा होगा’ को दोहराने के बजाय स्वाभाविक लोप रखा गया है।
