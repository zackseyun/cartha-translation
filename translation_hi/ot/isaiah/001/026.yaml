source:
  edition: WLC
  text: וְ/אָשִׁ֤יבָה שֹׁפְטַ֨יִ/ךְ֙ כְּ/בָ/רִ֣אשֹׁנָ֔ה וְ/יֹעֲצַ֖יִ/ךְ כְּ/בַ/תְּחִלָּ֑ה אַחֲרֵי כֵ֗ן יִקָּ֤רֵא לָ/ךְ֙ עִ֣יר הַ/צֶּ֔דֶק קִרְיָ֖ה נֶאֱמָנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/026.yaml
  text: And I will restore your judges as at the first[a], and your counselors as at the beginning. Afterward you will be called the city of righteousness, a faithful city.
translation:
  language: hi
  text: और मैं तुम्हारे न्यायाधीशों को फिर से बहाल करूँगा, जैसे पहले थे, और तुम्हारे सलाहकारों को, जैसे आरम्भ में थे। उसके बाद तुम ‘धार्मिकता की नगरी’[a], ‘विश्वासयोग्य नगरी’ कहलाओगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्याय की नगरी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָשִׁיבָה
  choice: और मैं ... फिर से स्थापित करूँगा
  rationale: שוב के हिफ़ील रूप में किसी को पूर्व अवस्था में लौटाने या पुनःस्थापित करने का भाव है। यहाँ उचित नागरिक नेतृत्व की बहाली के संदर्भ में ‘फिर से स्थापित करूँगा’ स्वाभाविक और सटीक है।
- source_word: שֹׁפְטַיִךְ
  choice: तुम्हारे न्यायियों
  rationale: שֹׁפֵט का सामान्य अर्थ ‘न्यायी’ है। प्रसंग में शासकीय अधिकारी भी सम्मिलित हो सकते हैं, पर यह चुनाव मूल पद का न्यायिक अर्थ बनाए रखता है।
- source_word: כְּבָרִאשֹׁנָה
  choice: पहले जैसा
  rationale: यह वाक्यांश किसी पूर्व आदर्श अवस्था की ओर संकेत करता है, पर किसी विशेष ऐतिहासिक काल को निर्धारित नहीं करता।
- source_word: וְיֹעֲצַיִךְ
  choice: तुम्हारे सलाहकारों
  rationale: यह नागरिक नेतृत्व के संदर्भ में परामर्श देनेवालों को सूचित करता है; आधुनिक हिन्दी में ‘सलाहकार’ स्पष्ट और स्वाभाविक है।
- source_word: כְּבַתְּחִלָּה
  choice: आरम्भ के समान
  rationale: यह पहले पदांश के समानान्तर है और मूल आरम्भिक अवस्था की पुनर्बहाली का भाव सुरक्षित रखता है।
- source_word: אַחֲרֵי כֵן
  choice: उसके बाद
  rationale: यह नेतृत्व की पुनर्बहाली के बाद आनेवाले परिणाम को स्पष्ट करनेवाला सहज कालसूचक वाक्यांश है।
- source_word: יִקָּרֵא לָךְ
  choice: तुम ... कहलाओगी
  rationale: קרא का निफ़ाल रूप ‘कहलाना’ या ‘नाम दिया जाना’ व्यक्त करता है। स्त्रीलिंग एकवचन रूप नगर को सीधे सम्बोधित करने वाले मानवीकरण को सुरक्षित रखता है।
- source_word: עִיר הַצֶּדֶק
  choice: धार्मिकता की नगरी
  rationale: यह संज्ञात्मक रचना व्यापक नैतिक सच्चाई और सामाजिक न्याय—दोनों का भाव रख सकती है। ‘धार्मिकता’ उस व्यापक अर्थ को बचाती है; ‘नगरी’ काव्यात्मक शैली के अनुकूल है।
- source_word: קִרְיָה נֶאֱמָנָה
  choice: विश्वासयोग्य नगर
  rationale: נֶאֱמָנָה में विश्वसनीयता और निष्ठा का भाव है। ‘विश्वासयोग्य’ दोनों अर्थों को स्वाभाविक हिन्दी में व्यक्त करता है और 1:21 के विरोधाभास को बनाए रखता है।
theological_decisions:
- issue: नागरिक पुनर्बहाली के प्रसंग में צֶדֶק का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: यहाँ पुनर्स्थापित नगर का चरित्र केवल निष्पक्ष न्याय-व्यवस्था तक सीमित नहीं, बल्कि व्यापक नैतिक और वाचा-संबंधी खराई को भी दर्शाता है। इसलिए मुख्य पाठ में ‘धार्मिकता’ रखा गया है, जबकि ‘न्याय’ को वास्तविक शाब्दिक विकल्प के रूप में पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। स्त्रीलिंग ‘कहलाओगी’ से सिय्योन/नगर के प्रत्यक्ष सम्बोधन का मानवीकरण सुरक्षित है। ‘नगरी’ और ‘नगर’ का क्रम मूल की दो काव्यात्मक समानार्थी संज्ञाओं עִיר और קִרְיָה को हिन्दी में हल्के शैलीगत वैविध्य के साथ दर्शाता है।
