base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/025.yaml
  text: I will turn my hand against you[a], and I will smelt away your dross as with lye[c][b], and remove all your alloy.
translation:
  language: hi
  text: मैं तेरे विरुद्ध अपना हाथ फेरूँगा[a]; तेरी धातु की मैल को मानो क्षार से गलाकर दूर कर दूँगा[b], और तेरी सारी खोटी धातु हटा दूँगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुझ पर।” इब्रानी मुहावरा दंड देने की कार्रवाई अथवा शुद्ध करने वाले हस्तक्षेप—दोनों का संकेत दे सकता है। यहाँ धातु-शोधन की छवि न्याय के साथ शुद्धिकरण का संकेत भी देती है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “क्षार” से आशय सफाई या शोधन में प्रयुक्त क्षारीय पदार्थ से है; अनुवाद “क्षारीय पदार्थ” या “साबुन के समान” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “तेरा सारा राँगा”; इब्रानी शब्द विशेष रूप से राँगे अथवा अधिक सामान्य अर्थ में मिश्रधातु में मिली घटिया धातुओं को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָשִׁיבָה יָדִי עָלַיִךְ
  choice: मैं अपना हाथ तेरे विरुद्ध फेरूँगा
  rationale: मूल इब्रानी के मानवरूपी मुहावरे ‘अपना हाथ फेरना’ को बनाए रखता है। न्याय के प्रसंग में ‘तेरे विरुद्ध’ स्वाभाविक है, जबकि टिप्पणी यह स्पष्ट करती है कि इस कार्य का शुद्ध करने वाला उद्देश्य भी है।
- source_word: וְאֶצְרֹף
  choice: गलाकर दूर कर दूँगा
  rationale: यह धातु गलाकर शुद्ध करने की क्रिया है। यह अभिव्यक्ति प्रक्रिया और मैल के हटाए जाने—दोनों को स्पष्ट करती है।
- source_word: כַּבֹּר
  choice: मानो क्षार से
  rationale: ‘क्षार’ सफाई अथवा शोधन में प्रयुक्त क्षारीय पदार्थ को दर्शाता है; ‘मानो’ तुलना-सूचक כ को बनाए रखता है।
- source_word: סִיגָיִךְ
  choice: तेरी मैल
  rationale: यह पिघली धातु से अलग होने वाली अशुद्ध मैल है। सरल हिन्दी ‘मैल’ रूपक को समझने योग्य रखती है।
- source_word: וְאָסִירָה
  choice: हटा दूँगा
  rationale: हिफ़ील रूप का सीधा अर्थ हटाना या दूर करना है।
- source_word: כָּל בְּדִילָיִךְ
  choice: तेरी सारी खोटी धातु
  rationale: בְּדִיל का अर्थ विशेष रूप से राँगा अथवा व्यापक रूप से मिश्रण में मिली घटिया धातु हो सकता है। ‘खोटी धातु’ प्रसंगगत व्यापकता और शोधन का रूपक दोनों बनाए रखती है।
theological_decisions:
- issue: ईश्वरीय कार्य का स्वरूप
  choice: न्याय, जिसका उद्देश्य शुद्ध करना भी है
  alternative: केवल विनाशकारी न्याय; अथवा केवल पुनर्स्थापन
  rationale: ‘तेरे विरुद्ध’ कार्य की कठोरता प्रकट करता है, जबकि गलाने और अशुद्धियाँ हटाने की छवि शुद्धिकरण का उद्देश्य दिखाती है। अनुवाद इन दोनों पक्षों के तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। स्त्रीलिंग एकवचन संबोधन को ‘तेरे/तेरी’ से रखा गया है, क्योंकि संदर्भ में यरूशलेम/सिय्योन को संबोधित किया गया है। धातु-शोधन का रूपक सरल शब्दों में सुरक्षित रखा गया है।
