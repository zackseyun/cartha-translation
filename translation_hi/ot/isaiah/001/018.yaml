  text: לְכוּ נָ֛א וְ/נִוָּֽכְחָ֖ה יֹאמַ֣ר יְהוָ֑ה אִם יִֽהְי֨וּ חֲטָאֵי/כֶ֤ם כַּ/שָּׁנִים֙ כַּ/שֶּׁ֣לֶג יַלְבִּ֔ינוּ אִם יַאְדִּ֥ימוּ כַ/תּוֹלָ֖ע כַּ/צֶּ֥מֶר יִהְיֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/018.yaml
  text: 'Come now[a], and let us reason together, says Yahweh: though your sins are like scarlet, they will become white like snow; though they are red like crimson[b], they will become like wool.'
translation:
  language: hi
  text: “अब आओ, हम आपस में तर्क-विचार करें[a],” याहवे कहता है। “चाहे तुम्हारे पाप सुर्ख लाल हों, वे बर्फ के समान सफेद हो जाएँगे; चाहे वे किरमिज़ी[b] हों, वे ऊन के समान हो जाएँगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “हम मिलकर अपना मामला तय करें,” “हम बहस करके बात स्पष्ट करें” या “हम आपस में विवाद करें” भी हो सकता है। इब्रानी क्रिया में संवाद और न्यायिक कार्यवाही—दोनों की छाया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “कीट के समान” अथवा “कीट से बने लाल रंग के समान।” यह शब्द उस कीट के संबंध से गहरे किरमिज़ी रंग को सूचित करता है जिससे प्राचीन काल में रंग बनाया जाता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ נָא
  choice: अब आओ
  rationale: לְכוּ यहाँ एक आह्वान है और נָא आग्रह को नम्र तथा तत्क्षण बनाता है। ‘अब आओ’ आधुनिक हिन्दी में स्वाभाविक रूप से दोनों भाव व्यक्त करता है।
- source_word: וְנִוָּכְחָה
  choice: हम आपस में तर्क-विचार करें
  rationale: יכח का निफ़अल सहवाची रूप मिलकर किसी मामले पर विचार करने, बहस करने या उसका निर्णय करने का न्यायिक-संवादात्मक भाव रखता है। मुख्य पाठ का चयन इस व्यापकता को यथासंभव बनाए रखता है; अधिक न्यायिक विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: יֹאמַר יְהוָה
  choice: याहवे कहता है
  rationale: इब्रानी भविष्यद्वाणी-वाणी सूत्र को हिन्दी में वर्तमानकाल से स्वाभाविक रूप दिया गया है और परमेश्वर का व्यक्तिवाचक नाम याहवे के रूप में रखा गया है।
- source_word: אִם יִהְיוּ חֲטָאֵיכֶם
  choice: चाहे तुम्हारे पाप … हों
  rationale: यहाँ אִם समानांतर वाक्यों में रियायती अर्थ दे सकता है। ‘चाहे’ लालिमा की वास्तविकता को नकारे बिना उसके विपरीत होने वाले परिवर्तन पर बल देता है।
- source_word: כַּשָּׁנִים
  choice: सुर्ख लाल
  rationale: שָׁנִים चमकीले गहरे लाल रंग या उससे रंगी सामग्री को सूचित करता है। ‘सुर्ख लाल’ साधारण हिन्दी में रंग की तीव्रता स्पष्ट करता है।
- source_word: כַּשֶּׁלֶג יַלְבִּינוּ
  choice: वे बर्फ के समान सफेद हो जाएँगे
  rationale: לבן का हिफ़ईल रूप यहाँ सफेद हो जाने के परिणामकारी परिवर्तन को व्यक्त करता है।
- source_word: אִם יַאְדִּימוּ
  choice: चाहे वे … हों
  rationale: אדם का हिफ़ईल रूप यहाँ लाल दिखाई देने की दशा बताता है; समानांतरता के अनुरूप हिन्दी में विशेषणात्मक अभिव्यक्ति स्वाभाविक है।
- source_word: כַּתּוֹלָע
  choice: किरमिज़ी
  rationale: תּוֹלָע मूलतः उस कीट से जुड़ा शब्द है जिससे गहरा लाल रंग बनाया जाता था; काव्यात्मक संदर्भ में रंगवाचक ‘किरमिज़ी’ उपयुक्त है।
- source_word: כַּצֶּמֶר יִהְיוּ
  choice: वे ऊन के समान हो जाएँगे
  rationale: यह अनुवाद इब्रानी तुलना को बिना ‘सफेद’ शब्द जोड़े रखता है; सफेदी का भाव बर्फ वाले समानांतर चरण से मिलता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला परमेश्वर का व्यक्तिवाचक नाम सीधे प्रयुक्त है। ‘याहवे’ उसके संभावित प्राचीन उच्चारण को हिन्दी लिपि में व्यक्त करता है और उसे पदवी में नहीं बदलता।
- issue: लाल पापों और सफेदी के बीच संबंध
  choice: भविष्य में परिवर्तन का कथन
  alternative: 'शर्तसूचक कथन: ‘यदि…तो…’'
  rationale: दोनों אִם-वाक्य रियायती रूप में समझे जा सकते हैं और अगले क्रियारूप परिवर्तन का आश्वासन देते हैं। फिर भी मूल אִם में शर्तसूचक संभावना है; मुख्य पाठ ने प्रसंगगत रियायती बल को चुना है, बिना परिवर्तन की प्रक्रिया या धर्मवैज्ञानिक आधार को स्पष्ट करके जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। काव्यात्मक रंग-विरोध—सुर्ख लाल/बर्फ और किरमिज़ी/ऊन—को स्पष्ट रखा गया है। दूसरे पुरुष बहुवचन के लिए ‘तुम्हारे’ मूल के सामूहिक संबोधन को सहज हिन्दी में व्यक्त करता है।
