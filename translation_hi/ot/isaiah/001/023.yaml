  text: שָׂרַ֣יִ/ךְ סוֹרְרִ֗ים וְ/חַבְרֵי֙ גַּנָּבִ֔ים כֻּלּ/וֹ֙ אֹהֵ֣ב שֹׁ֔חַד וְ/רֹדֵ֖ף שַׁלְמֹנִ֑ים יָתוֹם֙ לֹ֣א יִשְׁפֹּ֔טוּ וְ/רִ֥יב אַלְמָנָ֖ה לֹֽא יָב֥וֹא אֲלֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/023.yaml
  text: Your rulers are rebels and companions of thieves[a]; every one of them loves a bribe and runs after payments. They do not defend the orphan[c][b], and the widow’s case does not come before them.
translation:
  language: hi
  text: तेरे शासक[a] विद्रोही और चोरों के साथी हैं; उनमें से हर एक घूस से प्रेम करता और इनामों[b] के पीछे दौड़ता है। वे अनाथ को न्याय नहीं दिलाते[c], और विधवा का मुकदमा उनके पास नहीं पहुँचता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे हाकिम”; परंपरागत रूप से “तेरे प्रधान।”
    reason: lexical_alternative
  - marker: b
    text: या “भुगतानों/प्रतिफलों के पीछे दौड़ता है”; इब्रानी शब्द भुगतान, प्रतिफल या उपहार का बोध करा सकता है, और यहाँ प्रसंग भ्रष्ट लाभ का है।
    reason: lexical_alternative
  - marker: c
    text: या “वे अनाथ का न्याय नहीं करते” अथवा “अनाथ की पैरवी नहीं करते।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרַיִךְ
  choice: तेरे शासक
  rationale: שַׂר यहाँ नगर के शासन-अधिकारियों को सूचित करता है। “शासक” आधुनिक और व्यापक है तथा राजवंशीय अर्थ थोपे बिना शासन की भूमिका स्पष्ट करता है।
- source_word: סוֹרְרִים
  choice: विद्रोही
  rationale: סרר हठी अवज्ञा और विद्रोह का भाव रखता है; “विद्रोही” पद के नैतिक और राजनीतिक आरोप को संक्षेप में व्यक्त करता है।
- source_word: וְחַבְרֵי גַּנָּבִים
  choice: और चोरों के साथी
  rationale: यह रचना चोरों के साथ संगति अथवा मिलीभगत बताती है; “साथी” मूल की सीधी और स्वाभाविक अभिव्यक्ति है।
- source_word: כֻּלּוֹ
  choice: उनमें से हर एक
  rationale: एकवचन रूप यहाँ पूरे समूह के प्रत्येक सदस्य पर वितरणात्मक रूप से लागू है; यह हिन्दी अभिव्यक्ति उसी बल को स्पष्ट करती है।
- source_word: אֹהֵב שֹׁחַד
  choice: घूस से प्रेम करता
  rationale: שֹׁחַד का अर्थ रिश्वत/घूस है। “घूस से प्रेम करता” मूल के तीखे नैतिक आरोप और प्रेम-सूचक क्रिया को बनाए रखता है।
- source_word: וְרֹדֵף שַׁלְמֹנִים
  choice: और इनामों के पीछे दौड़ता है
  rationale: רדף सक्रिय और लालची पीछा करने को व्यक्त करता है। שַׁלְמֹנִים भुगतान, प्रतिफल या उपहार हो सकते हैं; “इनाम” संदिग्ध लाभ का सामान्य भाव रखता है, जबकि पादटिप्पणी शब्दगत व्यापकता बताती है।
- source_word: יָתוֹם לֹא יִשְׁפֹּטוּ
  choice: वे अनाथ का न्याय नहीं करते
  rationale: न्यायिक प्रसंग में שׁפט न्याय करना अथवा किसी को न्याय दिलाना दर्शा सकता है। शाब्दिक न्यायिक अभिव्यक्ति मूल की अर्थ-सीमा सुरक्षित रखती है।
- source_word: וְרִיב אַלְמָנָה
  choice: और विधवा का मुकदमा
  rationale: רִיב कानूनी विवाद, दावा या मुकदमा दर्शाता है; यहाँ “मुकदमा” शासन और न्यायालय के प्रसंग में स्वाभाविक है।
- source_word: לֹא יָבֹא אֲלֵיהֶם
  choice: उनके पास नहीं पहुँचता
  rationale: मूलतः मामला उनके पास नहीं आता। “नहीं पहुँचता” उस विफल न्यायिक पहुँच को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसके कारण को निर्धारित किए।
