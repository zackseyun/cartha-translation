id: ISA.1.12
reference: Isaiah 1:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י תָבֹ֔אוּ לֵ/רָא֖וֹת פָּנָ֑/י מִי בִקֵּ֥שׁ זֹ֛את מִ/יֶּדְ/כֶ֖ם רְמֹ֥ס חֲצֵרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/012.yaml
  text: 'When you come to appear before me[a], who has required this from your hand: trampling my courts?'
translation:
  language: hi
  text: जब तुम मेरे सामने उपस्थित होने के लिए आते हो[a], तो किसने तुमसे यह माँगा है कि तुम मेरे प्रांगणों को रौंदो?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “मेरा मुख देखने”; यह परमेश्वर की उपस्थिति में उपस्थित होने का मुहावरा है।
    reason: मूल हिब्रू बिंब और उसके उपासना-संबंधी मुहावरेदार अर्थ, दोनों को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: כִּי
  choice: जब
  rationale: यहाँ כִּי उस परिस्थिति का परिचय देता है जिसमें फटकार लागू होती है; इसलिए हिन्दी में ‘जब’ प्रसंग और आलंकारिक प्रश्न के प्रवाह को स्वाभाविक रखता है।
- source_word: תָבֹאוּ
  choice: तुम ... आते हो
  rationale: בוא का सामान्य अर्थ ‘आना’ या ‘प्रवेश करना’ है। यहाँ ‘आते हो’ उपासकों के पवित्रस्थान में आने को सहज ढंग से व्यक्त करता है।
- source_word: לֵרָאוֹת פָּנָי
  choice: मेरे सामने उपस्थित होने
  rationale: शाब्दिक अर्थ ‘मेरा मुख देखने’ है, पर उपासना-संबंधी संदर्भ में यह परमेश्वर की उपस्थिति में स्वयं को प्रस्तुत करने का मुहावरा है। मुख्य पाठ में मुहावरे का अर्थ दिया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: מִי
  choice: किसने
  rationale: यह आलंकारिक प्रश्न आरम्भ करने वाला सीधा प्रश्नवाचक सर्वनाम है।
- source_word: בִקֵּשׁ
  choice: माँगा है
  rationale: यहाँ क्रिया का अर्थ किसी बात की माँग या अपेक्षा करने से है। ‘माँगा है’ हिन्दी में स्वाभाविक है और यह आरोप स्पष्ट करता है कि परमेश्वर ने ऐसी उपासना की माँग नहीं की।
- source_word: זֹאת
  choice: यह
  rationale: यह संकेतवाचक सर्वनाम आगे बताए गए निंदनीय कार्य—प्रांगणों को रौंदने—की ओर संकेत करता है।
- source_word: מִיֶּדְכֶם
  choice: तुमसे
  rationale: हिब्रू का शाब्दिक मुहावरा ‘तुम्हारे हाथ से’ है। आधुनिक हिन्दी में ‘तुमसे’ उसी उत्तरदायित्व और माँग के संबंध को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: רְמֹס
  choice: रौंदो
  rationale: मूल का क्रियार्थक रूप उस कार्य को स्पष्ट करता है जिसे परमेश्वर ने नहीं माँगा। ‘कि तुम ... रौंदो’ हिन्दी में इस संबंध को स्वाभाविक और तीखा बनाए रखता है।
- source_word: חֲצֵרָי
  choice: मेरे प्रांगणों
  rationale: מִיֶּדְכֶם का मंदिर-संदर्भ उसके पवित्र बाहरी प्रांगणों की ओर है। ‘प्रांगण’ आधुनिक, गरिमापूर्ण और मंदिर-संदर्भ में स्पष्ट शब्द है।
theological_decisions:
- issue: לֵרָאוֹת פָּנָי उपासना-संबंधी मुहावरे का अनुवाद
  choice: मेरे सामने उपस्थित होने
  alternative: मेरा मुख देखने
  rationale: शाब्दिक रूप को मुख्य पाठ में रखने से आधुनिक पाठक इसे परमेश्वर को शारीरिक आँखों से देखने का कथन समझ सकता है। चुना हुआ रूप पवित्रस्थान में परमेश्वर की उपस्थिति में आने का आशय व्यक्त करता है, जबकि पादटिप्पणी मूल बिंब को सुरक्षित रखती है।
- issue: रौंदने और परमेश्वर की माँग के बीच संबंध
  choice: कि तुम मेरे प्रांगणों को रौंदो
  alternative: यह—मेरे प्रांगणों को रौंदना
  rationale: हिब्रू की संक्षिप्त रचना में ‘रौंदना’ उस ‘यह’ की व्याख्या करता है जिसकी माँग किए जाने पर प्रश्न उठाया गया है। हिन्दी में ‘कि तुम’ जोड़ने से संबंध स्पष्ट होता है, पर आलंकारिक आरोप और धार्मिक तनाव—उपासना के नाम पर पवित्र प्रांगणों का रौंदा जाना—बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘उपस्थित होने आते हो’ मूल की ‘आना’ और उद्देश्यसूचक मुहावरेदार अभिव्यक्ति, दोनों को दर्शाता है। ‘प्रांगणों’ से मंदिर के पवित्र आँगनों का संदर्भ स्पष्ट होता है।
