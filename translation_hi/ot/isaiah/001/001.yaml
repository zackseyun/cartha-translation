id: ISA.1.1
reference: Isaiah 1:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: חֲזוֹן֙ יְשַֽׁעְיָ֣הוּ בֶן אָמ֔וֹץ אֲשֶׁ֣ר חָזָ֔ה עַל יְהוּדָ֖ה וִ/ירוּשָׁלִָ֑ם בִּ/ימֵ֨י עֻזִּיָּ֧הוּ יוֹתָ֛ם אָחָ֥ז יְחִזְקִיָּ֖הוּ מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/001.yaml
  text: The vision of Isaiah son of Amoz[a], which he saw concerning Judah and Jerusalem in the days of Uzziah, Jotham, Ahaz, and Hezekiah, kings of Judah.
translation:
  language: hi
  text: आमोस के पुत्र यशायाह का दर्शन, जो उसने यहूदा और यरूशलेम के विषय में[a], यहूदा के राजाओं उज्जियाह, योताम, आहाज और हिजकिय्याह के दिनों में देखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदा और यरूशलेम के विरुद्ध।” इब्रानी पूर्वसर्ग विषयवस्तु का परिचय दे सकता है, और कुछ संदर्भों में विरोधी संदेश भी व्यक्त कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזוֹן
  choice: दर्शन
  rationale: यह भविष्यद्वक्ता को दिखाई गई ईश्वरीय दृष्टि या प्रकाशन को दर्शाता है और חָזָה (‘देखा’) के साथ मूल शब्द-संबंध को बनाए रखता है।
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ
  choice: आमोस के पुत्र यशायाह
  rationale: इब्रानी संबंध-रचना को स्वाभाविक हिन्दी में रखा गया है; नामों के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं।
- source_word: אֲשֶׁר חָזָה
  choice: जो उसने ... देखा
  rationale: संबंधवाचक उपवाक्य ‘दर्शन’ से जुड़ता है और חֲזוֹן तथा חָזָה के बीच ‘दर्शन/देखा’ संबंध को यथासंभव सुरक्षित रखता है।
- source_word: עַל
  choice: के विषय में
  rationale: यहाँ पूर्वसर्ग दर्शन की विषयवस्तु बता सकता है। यह निर्णय और आशा दोनों के लिए पर्याप्त व्यापक है तथा अपने आप विरोध का अर्थ आरोपित नहीं करता।
- source_word: בִּימֵי
  choice: के दिनों में
  rationale: मूल काल-सूचक मुहावरे का निकट और स्वाभाविक हिन्दी रूप है; ‘के शासनकाल में’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: מַלְכֵי יְהוּדָה
  choice: यहूदा के राजाओं
  rationale: राजाओं की सूची पर लागू मूल पदबंध को हिन्दी वाक्यक्रम में स्पष्ट रूप से रखा गया है।
theological_decisions:
- issue: भूमिका में עַל का अर्थ-क्षेत्र
  choice: यहूदा और यरूशलेम के विषय में
  alternative: यहूदा और यरूशलेम के विरुद्ध
  rationale: इब्रानी पूर्वसर्ग भविष्यद्वाणी की विषयवस्तु भी बता सकता है और कुछ संदर्भों में विरोधी संदेश भी। पुस्तक में न्याय और आशा दोनों हैं, इसलिए मुख्य पाठ में व्यापक अर्थ रखा गया और वैकल्पिक अर्थ पादटिप्पणी में दिया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सहज शैली। ‘दर्शन’, ‘के दिनों में’ और प्रचलित बाइबलीय नाम-रूप मूल की औपचारिकता तथा सामान्य पठनीयता के बीच संतुलन रखते हैं।
