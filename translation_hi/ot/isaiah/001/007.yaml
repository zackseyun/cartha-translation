base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/007.yaml
  text: Your land is a desolation[a]; your cities are burned with fire. Your soil—before your very eyes—strangers are devouring it, and it is a desolation[b], like an overthrow by strangers.
translation:
  language: hi
  text: तुम्हारा देश उजाड़ पड़ा है; तुम्हारे नगर आग से जले हुए हैं। तुम्हारी आँखों के सामने परदेशी[a] तुम्हारी भूमि को निगल रहे हैं, और वह परदेशियों द्वारा किए गए विनाश के समान उजाड़ पड़ी है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ ‘बाहरी लोग’ या ‘विदेशी’ भी हो सकता है; यही शब्द इस पद के अन्त में फिर आया है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी का संक्षिप्त पदबंध है, ‘परदेशियों के उलटाव के समान।’ इसका अर्थ ‘परदेशियों द्वारा किए गए विनाश के समान’ या ‘परदेशियों के उलट दिए जाने के समान’ लिया जा सकता है; कुछ लोग इसमें सदोम के उलट दिए जाने की ओर संकेत भी देखते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: אַרְצְכֶם
  choice: तुम्हारा देश
  rationale: אֶרֶץ यहाँ पूरे भूभाग या देश को दर्शाता है। ‘देश’ आगे आने वाले अधिक ठोस אֲדָמָה से भेद भी बनाए रखता है।
- source_word: שְׁמָמָה
  choice: उजाड़ पड़ा है / उजाड़ पड़ी है
  rationale: यह संज्ञा विनाश और वीरानी की दशा व्यक्त करती है। स्वाभाविक हिन्दी में अवस्थासूचक वाक्यांश उसी प्रभाव को स्पष्ट करता है।
- source_word: עָרֵיכֶם שְׂרֻפוֹת אֵשׁ
  choice: तुम्हारे नगर आग से जले हुए हैं
  rationale: निष्क्रिय कृदंत और ‘आग’ दोनों को रखते हुए यह हिन्दी में विनाश का दृश्य स्पष्ट और सीधा बनाता है।
- source_word: אַדְמַתְכֶם
  choice: तुम्हारी भूमि
  rationale: אֲדָמָה उत्पादक धरती या जमीन का अधिक ठोस बोध देता है। ‘भूमि’ हिन्दी में स्वाभाविक है और पहले आए ‘देश’ से पर्याप्त भेद रखता है।
- source_word: לְנֶגְדְּכֶם
  choice: तुम्हारी आँखों के सामने
  rationale: यह मुहावरा प्रत्यक्ष उपस्थिति और असहाय होकर देखते रहने की तीव्रता व्यक्त करता है।
- source_word: זָרִים
  choice: परदेशी
  rationale: זָרִים बाहरी या विदेशी लोगों को सूचित करता है। ‘परदेशी’ आधुनिक हिन्दी में समझने योग्य है और दोनों आवृत्तियों में एकरूप रखा गया है।
- source_word: אֹכְלִים אֹתָהּ
  choice: भूमि को निगल रहे हैं
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘खा रहे हैं’ है; शत्रुओं द्वारा भूमि और उसके संसाधनों के उपभोग के लिए ‘निगल रहे हैं’ उसका सजीव रूपक बनाए रखता है।
- source_word: כְּמַהְפֵּכַת זָרִים
  choice: मानो परदेशियों ने उसे उलट-पलट दिया हो
  rationale: यह कठिन और संक्षिप्त इब्रानी पदबंध विनाशकारी उलटाव का चित्र देता है। मुख्य पाठ में परदेशियों को कर्ता मानने वाला संदर्भानुकूल अर्थ लिया गया है, जबकि अन्य सम्भावनाएँ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: כְּמַהְפֵּכַת זָרִים का अभिप्राय
  choice: मानो परदेशियों ने उसे उलट-पलट दिया हो
  alternative: परदेशियों के उलट दिए जाने के समान; अथवा सदोम के उलट दिए जाने की ओर संकेत
  rationale: इब्रानी रचना संक्षिप्त और व्याकरण की दृष्टि से अस्पष्ट है। निकटवर्ती वाक्य में परदेशियों द्वारा भूमि निगले जाने के कारण मुख्य पाठ उन्हें विनाश करने वाले मानता है, पर वैकल्पिक सम्बन्ध और सम्भावित सदोम-संकेत को निश्चित नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझने योग्य रखी गई है। ‘देश’ और ‘भूमि’ द्वारा אֶרֶץ तथा אֲדָמָה का भेद बनाए रखा गया है। समानान्तर छोटे वाक्य भविष्यद्वक्ता के न्याय-वचन की तीव्रता बनाए रखते हैं।
