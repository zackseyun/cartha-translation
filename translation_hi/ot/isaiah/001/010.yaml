source:
  edition: WLC
  text: שִׁמְע֥וּ דְבַר יְהוָ֖ה קְצִינֵ֣י סְדֹ֑ם הַאֲזִ֛ינוּ תּוֹרַ֥ת אֱלֹהֵ֖י/נוּ עַ֥ם עֲמֹרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/010.yaml
  text: Hear the word of Yahweh[a], rulers of Sodom; give ear to the instruction of our God[b], people of Gomorrah.
translation:
  language: hi
  text: याहवे का वचन सुनो, हे सदोम के शासको[a]; हमारे परमेश्वर की शिक्षा[b] पर ध्यान दो, हे अमोरा के लोगो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यशायाह यहूदा के अगुओं को ‘सदोम के शासक’ और उसके लोगों को ‘अमोरा के लोग’ कहकर भविष्यवाणी के रूप में तुलना कर रहा है; वह उन्हें वास्तव में उन नगरों के निवासी नहीं बता रहा है।
    reason: cultural_note
  - marker: b
    text: ‘शिक्षा’ के लिए प्रयुक्त इब्रानी शब्द ‘तोराह’ का अनुवाद ‘व्यवस्था’ या ‘उपदेश’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक क्रिया सीधे सुनने और उस पर ध्यान देने का आह्वान करती है; ‘सुनो’ सरल, स्वाभाविक और प्रभावशाली है।
- source_word: דְבַר יְהוָה
  choice: याहवे का वचन
  rationale: דבר के लिए ‘वचन’ प्रचलित भविष्यद्वक्ताई अभिव्यक्ति को बनाए रखता है, और याहवे को उपाधि से बदलने के बजाय परमेश्वर के व्यक्तिगत नाम के रूप में प्रस्तुत करता है।
- source_word: קְצִינֵי
  choice: शासको
  rationale: यह शब्द प्रमुखों, अधिकारियों या शासकों को सूचित करता है; संबोधन में ‘शासको’ संक्षिप्त और स्वाभाविक है।
- source_word: הַאֲזִינוּ
  choice: कान लगाओ
  rationale: यह दूसरी बहुवचन आज्ञा पहले ‘सुनो’ के समानांतर होते हुए अधिक ध्यानपूर्वक सुनने का भाव देती है; ‘कान लगाओ’ दोनों क्रियाओं का अंतर बनाए रखता है।
- source_word: תּוֹרַת
  choice: शिक्षा
  rationale: תורה का अर्थ व्यवस्था, शिक्षा या उपदेश हो सकता है। यहाँ ‘शिक्षा’ अर्थ को केवल विधिक संहिता तक सीमित किए बिना परमेश्वर के निर्देश का व्यापक भाव रखती है।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: मूल पाठ में प्रथम पुरुष बहुवचन प्रत्यय स्पष्ट है; ‘हमारे’ उसे सुरक्षित रखता है और भविष्यद्वक्ता का वाचा-समुदाय के साथ संबंध दर्शाता है।
- source_word: עַם עֲמֹרָה
  choice: हे अमोरा के लोगो
  rationale: यह संबोधन है। ‘हे … के लोगो’ आधुनिक हिन्दी में स्पष्टता के साथ मूल संबोधन का बल बनाए रखता है।
theological_decisions:
- issue: यहूदा और यरूशलेम के अगुओं तथा लोगों को सदोम और अमोरा कहना
  choice: मुख्य पाठ में सीधे संबोधन ‘सदोम के शासको’ और ‘अमोरा के लोगो’ को बनाए रखा गया है।
  alternative: ‘सदोम जैसे शासको’ और ‘अमोरा जैसे लोगो’ कहकर तुलना को स्पष्ट करना।
  rationale: इब्रानी पाठ तुलना-सूचक शब्द जोड़े बिना सीधे इन नामों से संबोधित करता है। शाब्दिक संबोधन भविष्यद्वक्ताई निंदा की चौंकाने वाली शक्ति बनाए रखता है; टिप्पणी स्पष्ट करती है कि यह वास्तविक भौगोलिक पहचान नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘हे’ संबोधन भविष्यद्वक्ताई गंभीरता और दोनों समानांतर पदों की संरचना को स्पष्ट करता है। ‘सदोम’ और ‘अमोरा’ हिन्दी में प्रचलित बाइबलीय नाम-रूप हैं।
