source:
  edition: WLC
  text: לֹ֣א תוֹסִ֗יפוּ הָבִיא֙ מִנְחַת שָׁ֔וְא קְטֹ֧רֶת תּוֹעֵבָ֛ה הִ֖יא לִ֑/י חֹ֤דֶשׁ וְ/שַׁבָּת֙ קְרֹ֣א מִקְרָ֔א לֹא אוּכַ֥ל אָ֖וֶן וַ/עֲצָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/013.yaml
  text: Do not continue bringing worthless grain offerings[a]; incense is an abomination to me. New moon and Sabbath[b], the calling of an assembly—I cannot endure iniquity and solemn assembly.
translation:
  language: hi
  text: व्यर्थ अन्नबलियाँ लाते न रहो; धूप मेरे लिए घृणित है। नए चाँद का पर्व, सब्त-दिन और सभा बुलाना—मैं अधर्म और गंभीर सभा सह नहीं सकता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תוֹסִיפוּ הָבִיא
  choice: फिर मत लाओ
  rationale: יסף के हिफ़ील रूप के साथ क्रिया का अर्थ किसी काम को जारी रखना या बार-बार करना है। निषेध में ‘फिर मत लाओ’ इस आवर्ती भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִנְחַת שָׁוְא
  choice: व्यर्थ अन्नबलियाँ
  rationale: आराधना-संबंधी प्रसंग में מִנְחָה विशेषतः अन्नबलि को सूचित कर सकता है, और שָׁוְא खोखलेपन, निष्फलता या व्यर्थता का भाव देता है।
- source_word: קְטֹרֶת
  choice: धूप
  rationale: यह संज्ञा आराधना में जलाए जाने वाले सुगंधित धूप-द्रव्य को दर्शाती है; ‘धूप’ हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: תּוֹעֵבָה הִיא לִי
  choice: मेरे लिए घृणित है
  rationale: תּוֹעֵבָה परमेश्वर की तीव्र नैतिक अरुचि व्यक्त करता है। ‘घृणित’ इसकी कठोरता बनाए रखते हुए सहज आधुनिक हिन्दी है।
- source_word: חֹדֶשׁ
  choice: नए चाँद का पर्व
  rationale: इस धार्मिक पंचांग के प्रसंग में חֹדֶשׁ केवल चंद्रावस्था नहीं, नए चाँद के अवसर पर मनाया जाने वाला पर्व सूचित करता है।
- source_word: שַׁבָּת
  choice: सब्त-दिन
  rationale: ‘सब्त’ पारंपरिक धार्मिक पद है और ‘-दिन’ जोड़ने से सामान्य पाठक के लिए इसका दिन होना स्पष्ट हो जाता है।
- source_word: קְרֹא מִקְרָא
  choice: सभा बुलाना
  rationale: मूल में समान धातु से बनी क्रिया और संज्ञा सभा के आह्वान पर बल देती हैं। ‘सभा बुलाना’ इसका अर्थ स्वाभाविक हिन्दी में देता है।
- source_word: לֹא אוּכַל
  choice: मैं ... सह नहीं सकता
  rationale: शाब्दिक अर्थ ‘मैं समर्थ नहीं हूँ’ है, पर इस संदर्भ में वाक्य किसी चीज़ को सहन न कर पाने का मुहावरेदार भाव व्यक्त करता है।
- source_word: אָוֶן
  choice: दुष्टता
  rationale: אָוֶן अनर्थ, बुराई या अधर्म को सूचित कर सकता है। यहाँ लोगों के अनैतिक आचरण की निंदा के संदर्भ में ‘दुष्टता’ उपयुक्त है।
- source_word: וַעֲצָרָה
  choice: और पवित्र सभा
  rationale: עֲצָרָה किसी विशेष धार्मिक या पर्वीय सभा को दर्शाता है। ‘पवित्र सभा’ उसके आराधना-संबंधी स्वरूप को स्पष्ट करता है, जबकि संयोजक ‘और’ मूल की संक्षिप्त संरचना बनाए रखता है।
theological_decisions:
- issue: अंतिम वाक्यांश में दुष्ट आचरण और आराधना-सभा का संबंध
  choice: मैं दुष्टता और पवित्र सभा सह नहीं सकता
  alternative: मैं दुष्टता के साथ पवित्र सभा सह नहीं सकता
  rationale: इब्रानी में אָוֶן और עֲצָרָה बिना किसी स्पष्ट संबंधबोधक शब्द के साथ-साथ रखे गए हैं। मुख्य पाठ का ‘और’ मूल की संक्षिप्तता और तनाव को बनाए रखता है; पादटिप्पणी उस संभावित अर्थ को सुरक्षित रखती है कि परमेश्वर दुष्टता से जुड़ी आराधना-सभा सहन नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘अन्नबलि’ और ‘सब्त-दिन’ जैसे आवश्यक धार्मिक पद स्पष्टता के साथ बनाए गए हैं। मूल इब्रानी की तीखी, संक्षिप्त निंदा और अंतिम खंड की वास्तविक व्याकरणिक अस्पष्टता को सुरक्षित रखा गया है।
