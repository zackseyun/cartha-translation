source:
  edition: WLC
  text: לָ/מָּה לִּ֤/י רֹב זִבְחֵי/כֶם֙ יֹאמַ֣ר יְהוָ֔ה שָׂבַ֛עְתִּי עֹל֥וֹת אֵילִ֖ים וְ/חֵ֣לֶב מְרִיאִ֑ים וְ/דַ֨ם פָּרִ֧ים וּ/כְבָשִׂ֛ים וְ/עַתּוּדִ֖ים לֹ֥א חָפָֽצְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/011.yaml
  text: Why are your many sacrifices to me? says Yahweh[a]. I have had enough of burnt offerings of rams and the fat of fattened animals[b]; and in the blood of bulls and lambs and goats I do not delight.
translation:
  language: hi
  text: “तुम्हारे इतने सारे बलिदान मेरे लिए किस काम के हैं?” यहोवा[a] कहता है। “मेढ़ों की होमबलियों और पुष्ट पशुओं की चर्बी से मेरा जी भर चुका है; बैलों, मेमनों और बकरों[b] के लहू से मैं प्रसन्न नहीं होता।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे इतने सारे बलिदान मेरे लिए क्यों हैं?” इब्रानी मुहावरा शाब्दिक रूप से है, “क्यों मेरे लिए तुम्हारे बलिदानों की बहुतायत?”
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘बकरों’ के लिए प्रयुक्त इब्रानी शब्द विशेष रूप से नर बकरों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה לִּי
  choice: मेरे लिए किस काम के हैं?
  rationale: इब्रानी में शाब्दिक रूप से ‘क्यों मेरे लिए?’ है। प्रसंग में यह बलिदानों की उपयोगिता पर प्रश्न करने वाला आलंकारिक मुहावरा है; चुना हुआ अनुवाद स्वाभाविक हिन्दी में वही तीखा प्रश्न व्यक्त करता है।
- source_word: רֹב זִבְחֵיכֶם
  choice: तुम्हारे इतने सारे बलिदान
  rationale: רֹב बहुतायत या बड़ी संख्या पर बल देता है, और זִבְחֵיכֶם बलिदानों को दर्शाता है। ‘इतने सारे’ आधुनिक हिन्दी में इस मात्रात्मक बल को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को उपाधि में बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: שָׂבַעְתִּי
  choice: मेरा जी भर चुका है
  rationale: क्रिया का अर्थ तृप्त या अघा जाना है। यह हिन्दी मुहावरा अधिकता से उपजी विरक्ति को स्वाभाविक और प्रभावशाली ढंग से व्यक्त करता है।
- source_word: עֹלוֹת אֵילִים
  choice: मेढ़ों की होमबलियाँ
  rationale: עֹלוֹת पूर्णतः जलाए जाने वाले बलिदानों का मानक धार्मिक पद है, जिसके लिए ‘होमबलि’ सुबोध और स्थापित हिन्दी शब्द है; אֵילִים वयस्क नर भेड़ों अर्थात मेढ़ों को दर्शाता है।
- source_word: חֵלֶב מְרִיאִים
  choice: पाले-पोसे पशुओं की चर्बी
  rationale: חֵלֶב ‘चर्बी’ है और מְרִיאִים अच्छी तरह खिलाकर पुष्ट किए गए पशु हैं। ‘पाले-पोसे पशु’ सहज हिन्दी में इस भाव को रखता है।
- source_word: דַם פָּרִים וּכְבָשִׂים וְעַתּוּדִים
  choice: बैलों, मेमनों और बकरों के लहू
  rationale: तीनों पशु-समूहों को ठोस और परिचित हिन्दी शब्दों में रखा गया है। עַתּוּדִים विशेषतः नर बकरों को दर्शाता है, जिसे हिन्दी ‘बकरों’ में स्वाभाविक रूप से व्यक्त करती है।
- source_word: לֹא חָפָצְתִּי
  choice: मैं प्रसन्न नहीं होता
  rationale: חפץ इच्छा, सुख या प्रसन्नता का भाव रखता है। यह अनुवाद कर्मकांड में परमेश्वर के आनंद न लेने की बात को स्पष्ट रखता है, बिना यह जोड़ने के कि बलिदान अपने आप में सर्वथा निषिद्ध थे।
theological_decisions:
- issue: यज्ञ-विधान और परमेश्वर की अस्वीकृति के बीच तनाव
  choice: बलिदानों के लहू से ‘मैं प्रसन्न नहीं होता’
  alternative: मैं इन बलिदानों को नहीं चाहता
  rationale: मूल पाठ तत्कालीन पाखंडी उपासना की कठोर अस्वीकृति करता है, पर इस एक वाक्य में पूरे बलिदान-विधान को निरस्त करने की स्पष्ट घोषणा नहीं करता। ‘प्रसन्न नहीं होता’ חפץ के भाव को रखते हुए उस तनाव को खुला छोड़ता है।
- issue: परमेश्वर के नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में विशिष्ट नाम है। हिन्दी पाठकों में परिचित नाम-रूप ‘यहोवा’ इसे केवल ‘प्रभु’ जैसी उपाधि में बदलने से बचाता है; स्वरांकन की ऐतिहासिक अनिश्चितता को अनावश्यक रूप से निर्णीत नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और श्रव्य पाठ के अनुकूल रखी गई है। ‘होमबलि’ धार्मिक संदर्भ का स्थापित पद है; बाकी वाक्यावली तकनीकी बोझ से मुक्त है। परमेश्वर की विरक्ति को व्यक्त करने के लिए ‘मेरा जी भर चुका है’ चुना गया है, जो स्वाभाविक हिन्दी होते हुए भी प्रसंग की तीव्रता बनाए रखता है।
