translation:
  language: hi
  text: तेरी चाँदी धातु का मैल बन गई है; तेरी मदिरा पानी से मिली हुई है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּסְפֵּךְ
  choice: तेरी चाँदी
  rationale: כֶּסֶף का मूल अर्थ ‘चाँदी’ है। धातु और उसके मैल के रूपक को बनाए रखने के लिए ‘धन’ की अपेक्षा ‘चाँदी’ अधिक सटीक है; स्त्रीलिंग एकवचन संबोधन यरूशलेम/सिय्योन की ओर है।
- source_word: הָיָה לְסִיגִים
  choice: मैल बन गई है
  rationale: הָיָה परिणामी अवस्था व्यक्त करता है, और סִיגִים धातु का निकृष्ट अवशेष अथवा अशुद्ध मैल है। ‘मैल’ सामान्य हिन्दी में स्पष्ट है और भ्रष्ट हो जाने का रूपक सुरक्षित रखता है।
- source_word: סָבְאֵךְ
  choice: तेरी मदिरा
  rationale: סֹבֶא मादक पेय को सूचित करता है और इस प्रसंग में ‘मदिरा’ स्वाभाविक, पर्याप्त व्यापक और काव्यात्मक समानांतर के अनुकूल है।
- source_word: מָהוּל בַּמָּיִם
  choice: में पानी मिला दिया गया है
  rationale: מָהוּל का अर्थ मिला हुआ अथवा पानी से पतला किया हुआ है। हिन्दी में यह निष्क्रिय अभिव्यक्ति पेय की मिलावट और अवमूल्यन दोनों को सहज रूप से व्यक्त करती है।
