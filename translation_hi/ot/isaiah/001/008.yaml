id: ISA.1.8
reference: Isaiah 1:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נוֹתְרָ֥ה בַת צִיּ֖וֹן כְּ/סֻכָּ֣ה בְ/כָ֑רֶם כִּ/מְלוּנָ֥ה בְ/מִקְשָׁ֖ה כְּ/עִ֥יר נְצוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/008.yaml
  text: And daughter Zion is left like a shelter in a vineyard[a], like a hut in a cucumber field[c][b], like a besieged city.
translation:
  language: hi
  text: और सिय्योन की बेटी दाख की बारी में छप्पर के समान, ककड़ी के खेत में झोंपड़ी के समान[a], और घिरे हुए नगर के समान बची रह गई है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ककड़ी के खेत’ के स्थान पर ‘खरबूजे के खेत’ या ‘कद्दू-वर्ग की बेलों के खेत’ भी सम्भव है; इब्रानी शब्द ऐसी बेल वाली खेती के लिए व्यापक अर्थ रख सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘घिरे हुए नगर’ का अनुवाद ‘रक्षित नगर’ भी सम्भव है, यद्यपि इस प्रसंग में घेराबंदी का अर्थ अधिक उपयुक्त जान पड़ता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְנוֹתְרָה
  choice: और ... बची रह गई है
  rationale: निफ़अल रूप विनाश के बाद शेष रह जाने का भाव देता है। स्त्रीलिंग क्रिया ‘बेटी’ के साथ मेल खाती है और हिन्दी में प्रसंग का अवशेष तथा अकेलापन स्वाभाविक ढंग से व्यक्त करती है।
- source_word: בַת צִיּוֹן
  choice: सिय्योन की बेटी
  rationale: यह सिय्योन/यरूशलेम का काव्यात्मक मानवीकरण है। हिन्दी में संबंधकारक रचना मूल इब्रानी पदबंध को स्पष्ट और स्वाभाविक रूप से बनाए रखती है।
- source_word: כְסֻכָּה בְכָרֶם
  choice: दाख की बारी में छप्पर के समान
  rationale: סֻכָּה खेत में बनाया गया अस्थायी आश्रय या रखवाली का छप्पर है; ‘छप्पर’ उसकी अस्थायी और असुरक्षित प्रकृति को संक्षेप में व्यक्त करता है। כֶּרֶם एकवचन में दाख की बारी है।
- source_word: כִמְלוּנָה בְמִקְשָׁה
  choice: ककड़ी के खेत में झोंपड़ी के समान
  rationale: מְלוּנָה खेत में ठहरने या रखवाली के लिए बनी अस्थायी झोंपड़ी है। מִקְשָׁה ककड़ी, खरबूजे या ऐसी बेल वाली फसलों के खेत को सूचित कर सकता है; मुख्य पाठ में पारंपरिक और सम्भाव्य ‘ककड़ी का खेत’ रखा गया है।
- source_word: כְעִיר נְצוּרָה
  choice: घिरे हुए नगर के समान
  rationale: प्रसंग में נְצוּרָה का सर्वाधिक स्वाभाविक अर्थ शत्रु द्वारा घेरा हुआ है। ‘घिरे हुए’ हिन्दी में ‘besieged’ का सहज रूप है और मूल में सम्भव ‘रक्षित/निगरानी में’ अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: सिय्योन का मानवीकरण
  choice: ‘सिय्योन की बेटी’ के रूप में काव्यात्मक मानवीकरण बनाए रखा गया।
  alternative: ‘यरूशलेम’ या ‘सिय्योन के लोग’
  rationale: मूल पाठ सिय्योन को बेटी के रूप में प्रस्तुत करता है। इसे किसी स्थान या जनसमूह की व्याख्यात्मक संज्ञा से बदलना काव्यात्मक और धर्मवैचारिक तनाव को अनावश्यक रूप से सुलझा देता।
- issue: नगर की दशा
  choice: ‘घिरे हुए नगर’
  alternative: ‘रक्षित नगर’ या ‘निगरानी में रखा नगर’
  rationale: आसपास का विनाश और अलगाव घेराबंदी के अर्थ का समर्थन करता है, पर इब्रानी पद की दूसरी सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक गद्य। ‘सिय्योन की बेटी’ से मूल मानवीकरण, तथा ‘छप्पर/झोंपड़ी’ से दोनों अस्थायी कृषि-आश्रयों का सूक्ष्म भेद रखा गया है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
