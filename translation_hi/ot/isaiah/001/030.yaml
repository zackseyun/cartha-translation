  yaml_path: translation/ot/isaiah/001/030.yaml
  text: For you will be like an oak whose leaf withers[a], and like a garden that has no water.
translation:
  language: hi
  text: क्योंकि तुम बलूत[a] के समान हो जाओगे, जिसका पत्ता मुरझा रहा है, और उस बाग के समान जिसमें पानी नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तारपीन वृक्ष।’ इब्रानी शब्द אֵלָה तारपीन वृक्ष या बलूत को सूचित कर सकता है; वृक्ष की ठीक प्रजाति निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले न्याय-वचन से जुड़े कारण या परिणाम की व्याख्या करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תִהְיוּ
  choice: तुम ... हो जाओगे
  rationale: היה का काल-संदर्भ यहाँ भावी अथवा परिणामसूचक है; ‘हो जाओगे’ आने वाली दशा को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כְאֵלָה
  choice: उस बलूत के समान
  rationale: אֵלָה किसी बलूत या तारपीन वृक्ष को सूचित कर सकता है। मुख्य पाठ में परिचित वृक्ष-नाम ‘बलूत’ रखा गया है और प्रजाति की अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: נֹבֶלֶת עָלֶהָ
  choice: जिसका पत्ता मुरझाता है
  rationale: नारीलिंग एकवचन कृदंत और प्रत्यययुक्त एकवचन संज्ञा का अर्थ स्वाभाविक हिन्दी संबंधवाचक उपवाक्य में व्यक्त किया गया है; ‘पत्ता’ का एकवचन भी बनाए रखा गया है।
- source_word: וּכְגַנָּה
  choice: और उस बाग के समान
  rationale: גַּנָּה किसी बाग या घिरे हुए खेती-क्षेत्र को दर्शाता है; ‘बाग’ संक्षिप्त, वर्तमान और चित्रात्मक है।
- source_word: אֲשֶׁר מַיִם אֵין לָהּ
  choice: जिसमें पानी नहीं है
  rationale: शाब्दिक भाव ‘जिसके लिए/जिसके पास पानी नहीं’ है; स्थानवाचक ‘जिसमें पानी नहीं है’ हिन्दी में बाग के चित्र को स्पष्ट रखते हुए अभाव को व्यक्त करता है।
