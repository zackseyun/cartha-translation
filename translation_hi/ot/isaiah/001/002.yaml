language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שִׁמְע֤וּ שָׁמַ֨יִם֙ וְ/הַאֲזִ֣ינִי אֶ֔רֶץ כִּ֥י יְהוָ֖ה דִּבֵּ֑ר בָּנִים֙ גִּדַּ֣לְתִּי וְ/רוֹמַ֔מְתִּי וְ/הֵ֖ם פָּ֥שְׁעוּ בִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/002.yaml
  text: 'Hear[a], O heavens, and give ear, O earth, for Yahweh has spoken: “I have reared children and brought them up[b], but they have rebelled against me.”'
translation:
  language: hi
  text: 'हे आकाश, सुनो, और हे पृथ्वी, कान लगाकर सुन! क्योंकि याहवे ने कहा है:

    “मैंने बच्चों[a] को पाला-पोसा और उन्हें ऊँचा उठाया[b],

    पर उन्होंने मेरे विरुद्ध विद्रोह किया।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पुत्रों।” इब्रानी शब्द पुल्लिंग बहुवचन है, पर यहाँ वह सामूहिक रूप से पूरी प्रजा को याहवे की संतान के रूप में दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “महान बनाया” या, पालन-पोषण के भाव में, “बड़ा किया” भी हो सकता है। इब्रानी क्रिया में ऊँचा उठाने या प्रतिष्ठित करने का भाव भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ / הַאֲזִינִי
  choice: सुनो / कान लगाकर सुन
  rationale: दोनों आज्ञार्थक क्रियाओं का काव्यात्मक समानांतर रखते हुए दूसरी क्रिया की अधिक ध्यानपूर्वक सुनने की तीव्रता व्यक्त की गई है।
- source_word: שָׁמַיִם / אֶרֶץ
  choice: आकाश / पृथ्वी
  rationale: यह आकाश और पृथ्वी को साक्षी बनाकर किया गया संबोधन है; इसलिए אֶרֶץ का अर्थ यहाँ किसी सीमित देश के बजाय ‘पृथ्वी’ है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: בָּנִים
  choice: बच्चों
  rationale: शब्द व्याकरणतः पुल्लिंग बहुवचन है, पर यहाँ सामूहिक रूप से पूरी प्रजा परमेश्वर की संतान के रूप में अभिप्रेत है।
- source_word: גִּדַּלְתִּי
  choice: मैंने ... पाला-पोसा
  rationale: पारिवारिक रूपक में यह बच्चों का पालन करके बड़ा करने का स्वाभाविक हिन्दी बोध देता है।
- source_word: רוֹמַמְתִּי
  choice: उन्हें ऊँचा उठाया
  rationale: इससे पहली क्रिया की केवल पुनरावृत्ति किए बिना ऊँचा करने, प्रतिष्ठित करने या महान बनाने का अतिरिक्त अर्थ सुरक्षित रहता है।
- source_word: פָּשְׁעוּ בִי
  choice: उन्होंने मेरे विरुद्ध विद्रोह किया
  rationale: פשׁע अधिकार के विरुद्ध बगावत या संबंध-विच्छेदकारी विद्रोह दर्शाता है, और בִי उस विद्रोह का लक्ष्य बताता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसका सीधा हिन्दी लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: בָּנִים में संतान-संबंध और व्याकरणिक लिंग
  choice: बच्चों
  alternative: पुत्रों
  rationale: यहाँ संबोधन केवल पुरुषों का नहीं, बल्कि इस्राएल की पूरी प्रजा का है; ‘बच्चों’ से संतान का रूपक बना रहता है और सामूहिक संदर्भ स्पष्ट होता है।
- issue: רוֹמַמְתִּי का पालन-पोषण अथवा उन्नयन-संबंधी अर्थ
  choice: ऊँचा उठाया
  alternative: बड़ा किया / महान बनाया
  rationale: क्रिया में ऊँचा उठाने या प्रतिष्ठा देने का अर्थ संभव है। चुना हुआ रूप इस अर्थ को बनाए रखता है, जबकि पादटिप्पणी व्यापक विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और भविष्यद्वाणी के सार्वजनिक आह्वान के अनुकूल रखी गई है। ‘हे’ से प्रत्यक्ष संबोधन और ‘कान लगाकर सुन’ से काव्यात्मक समानांतरता व्यक्त होती है। पंक्ति-विन्यास मूल वचन की घोषणा और आरोप को स्पष्ट करता है।
