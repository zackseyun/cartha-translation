id: ISA.1.21
reference: Isaiah 1:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֵיכָה֙ הָיְתָ֣ה לְ/זוֹנָ֔ה קִרְיָ֖ה נֶאֱמָנָ֑ה מְלֵאֲתִ֣י מִשְׁפָּ֗ט צֶ֛דֶק יָלִ֥ין בָּ֖/הּ וְ/עַתָּ֥ה מְרַצְּחִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/021.yaml
  text: How the faithful city has become a prostitute! She was full of justice[a]; righteousness lodged in her[c][b], but now murderers.
translation:
  language: hi
  text: हाय, विश्वासयोग्य नगरी कैसे वेश्या[a] बन गई! वह न्याय से भरी थी; धार्मिकता[b] उसमें बसी रहती थी[c], पर अब उसमें हत्यारे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘वेश्या’ का रूपक नगरी की बेवफाई और भ्रष्टता को दर्शाता है।
    reason: metaphorical_clarification
  - marker: b
    text: या ‘न्याय’; इब्रानी צֶדֶק में धार्मिकता और न्याय, दोनों के अर्थ समाए हो सकते हैं।
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक चित्र: ‘धार्मिकता उसमें रात बिताती थी’ या ‘ठहरती थी।’'
    reason: literal_rendering
lexical_decisions:
- source_word: אֵיכָה
  choice: हाय, ... कैसे
  rationale: यह प्रश्न नहीं, बल्कि चौंकाने वाले पतन पर शोकपूर्ण विस्मय की पुकार है; ‘हाय’ और ‘कैसे’ मिलकर इस भाव को स्वाभाविक हिन्दी में रखते हैं।
- source_word: הָיְתָה לְזוֹנָה
  choice: वेश्या बन गई
  rationale: यह पूर्ण हो चुके परिवर्तन और उसके वर्तमान परिणाम को व्यक्त करता है। ‘वेश्या’ मूल के स्पष्ट और कठोर रूपक को बिना अनावश्यक अशिष्टता के बनाए रखता है।
- source_word: קִרְיָה נֶאֱמָנָה
  choice: विश्वासयोग्य नगरी
  rationale: नगरी को पहले भरोसेमंद और निष्ठावान बताया गया है; यह उसके वर्तमान विश्वासघात और भ्रष्टता के साथ तीखा विरोध बनाए रखता है।
- source_word: מְלֵאֲתִי מִשְׁפָּט
  choice: वह न्याय से भरी थी
  rationale: מִשְׁפָּט यहाँ सामाजिक और न्यायिक उचित व्यवस्था को दर्शाता है। स्त्रीलिंग सर्वनाम नगरी के मानवीकरण को जारी रखता है।
- source_word: צֶדֶק
  choice: धार्मिकता
  rationale: शब्द में न्याय और नैतिक सहीपन दोनों का भाव है। पहले आए ‘न्याय’ से भेद रखते हुए ‘धार्मिकता’ नैतिक आयाम को स्पष्ट करता है।
- source_word: יָלִין בָּהּ
  choice: उसमें बसी रहती थी
  rationale: क्रिया का मूल चित्र रात बिताने या टिकने का है, पर प्रसंग में यह नगरी में धार्मिकता की नियमित उपस्थिति दर्शाता है। यह चयन स्वाभाविक हिन्दी में उस निवास के भाव को रखता है; पादटिप्पणी शाब्दिक चित्र बताती है।
- source_word: וְעַתָּה מְרַצְּחִים
  choice: पर अब उसमें हत्यारे हैं
  rationale: ‘पर अब’ पुराने और वर्तमान हाल के तीखे विरोध को स्पष्ट करता है। मूल की संक्षिप्त, क्रियारहित अभिव्यक्ति का अर्थ हिन्दी में न्यूनतम पूर्ति के साथ दिया गया है।
theological_decisions:
- issue: यरूशलेम की बेवफाई के लिए यौन रूपक
  choice: ‘वेश्या बन गई’ रूपक को स्पष्ट रूप से बनाए रखा गया
  alternative: ‘विश्वासघाती हो गई’ या ‘वेश्या के समान हो गई’
  rationale: मूल पाठ नगरी के नैतिक और वाचा-संबंधी भ्रष्टाचार को दिखाने के लिए जानबूझकर कठोर रूपक प्रयोग करता है। इसे सामान्य ‘विश्वासघात’ में बदलना या उपमा बना देना उसकी भविष्यद्वक्तात्मक तीव्रता को घटा देगा।
- issue: צֶדֶק का अर्थक्षेत्र
  choice: धार्मिकता
  alternative: न्याय या सही आचरण
  rationale: צֶדֶק का अर्थ न्याय से मिल सकता है, विशेषकर מִשְׁפָּט के समानांतर; फिर भी यहाँ अलग शब्द रखने से न्यायिक व्यवस्था और नैतिक सहीपन, दोनों आयाम सुनाई देते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, जनसुलभ और भविष्यद्वक्तात्मक शोक के अनुरूप तीखा स्वर रखा गया है। ‘नगरी’ काव्यात्मक प्रसंग और स्त्री-मानवीकरण को बनाए रखती है; ‘वेश्या’ स्पष्ट है पर अनावश्यक रूप से अशिष्ट नहीं।
