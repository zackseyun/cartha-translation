id: ISA.1.5
reference: Isaiah 1:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַ֣ל מֶ֥ה תֻכּ֛וּ ע֖וֹד תּוֹסִ֣יפוּ סָרָ֑ה כָּל רֹ֣אשׁ לָ/חֳלִ֔י וְ/כָל לֵבָ֖ב דַּוָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/005.yaml
  text: Why should you be struck again? You continue in rebellion. The whole head is sick[a], and the whole heart is faint.
translation:
  language: hi
  text: तुम्हें फिर क्यों मारा जाए?[a] तुम विद्रोह करते ही जाते हो। पूरा सिर रोगी है, और पूरा हृदय निर्बल है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हें अब और कहाँ मारा जाए?” इब्रानी को इस अर्थ में भी समझा जा सकता है कि जब पूरा शरीर रोगी है, तो आगे की मार किस अंग पर पड़े।
    reason: alternative_reading
lexical_decisions:
- source_word: עַל מֶה
  choice: क्यों
  rationale: यह पदबंध सामान्यतः कारण पूछने वाला आलंकारिक प्रश्न प्रस्तुत करता है। आधुनिक हिन्दी में “क्यों” इसका स्वाभाविक और संक्षिप्त रूप है।
- source_word: תֻכּוּ עוֹד
  choice: तुम्हें फिर मारा जाए
  rationale: נכה का होफ़ाल रूप निष्क्रिय अर्थ “मारा जाना” देता है, और עוֹד यहाँ पहले से मिलती आई मार के आगे भी जारी रहने का भाव व्यक्त करता है।
- source_word: תּוֹסִיפוּ סָרָה
  choice: तुम विद्रोह करते ही जाते हो
  rationale: יסף का हिफ़ील यहाँ किसी काम को लगातार करते रहने का भाव देता है; סָרָה हठीले विमुख होने या विद्रोह को सूचित करता है। “करते ही जाते हो” निरंतरता और धृष्टता दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: כָּל רֹאשׁ לָחֳלִי
  choice: पूरा सिर रोगी है
  rationale: सामूहिक एकवचन में राष्ट्र को एक शरीर के रूप में चित्रित किया गया है। “पूरा सिर” इस रूपक को बनाए रखता है, और לָחֳלִי की रोगग्रस्त दशा को “रोगी” स्पष्ट करता है।
- source_word: וְכָל לֵבָב דַּוָּי
  choice: और पूरा हृदय निर्बल है
  rationale: यह पहले खंड के समानांतर सामूहिक शारीरिक रूपक है। דַּוָּי बीमारी, दुर्बलता या मुरझाई हुई दशा बता सकता है; “निर्बल” सिर के “रोगी” होने से हल्का अर्थभेद बनाए रखता है।
theological_decisions:
- issue: आरम्भिक प्रश्न का आशय
  choice: लगातार विद्रोह के कारण आगे भी मार खाने की निरर्थकता पर आलंकारिक प्रश्न
  alternative: शरीर के किस भाग पर अब और मारा जा सकता है, यह पूछने वाला स्थानसूचक प्रश्न
  rationale: עַל־מֶה का सामान्य और यहाँ अधिक सहज अर्थ “क्यों” है, और अगला कथन निरंतर विद्रोह को सामने रखता है। फिर भी आगे के पूरे शरीर के रोगी होने के चित्र के कारण स्थानसूचक अर्थ सम्भव है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “सिर” और “हृदय” के सामूहिक शारीरिक रूपक को ज्यों का त्यों बनाए रखा गया है; दूसरे वाक्य को मूल इब्रानी के अनुसार कथन ही रखा गया है, दूसरा प्रश्न नहीं बनाया गया।
