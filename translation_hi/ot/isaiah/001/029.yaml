id: ISA.1.29
reference: Isaiah 1:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י יֵבֹ֔שׁוּ מֵ/אֵילִ֖ים אֲשֶׁ֣ר חֲמַדְתֶּ֑ם וְ/תַ֨חְפְּר֔וּ מֵ/הַ/גַּנּ֖וֹת אֲשֶׁ֥ר בְּחַרְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/029.yaml
  text: For you will be ashamed of the oaks that you desired[a], and you will be disgraced because of the gardens that you chose.
translation:
  language: hi
  text: क्योंकि जिन बलूत के वृक्षों को तुमने चाहा था, उनके कारण तुम लज्जित होगे[a], और जिन बागों को तुमने चुना था, उनके कारण तुम शर्मिंदा होगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तारपीन के वृक्ष’। इब्रानी शब्द किसी बड़े वृक्ष के लिए भी हो सकता है; प्रजाति निश्चित नहीं है। ये वृक्ष संभवतः अनुचित उपासना से जुड़े थे।
    reason: शब्दार्थ का विकल्प और सांस्कृतिक संदर्भ
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले न्याय-वचन से इस परिणाम का कारणात्मक अथवा व्याख्यात्मक संबंध जोड़ता है; आधुनिक हिन्दी में ‘क्योंकि’ स्वाभाविक है।
- source_word: יֵבֹשׁוּ
  choice: तुम लज्जित होगे
  rationale: यद्यपि रूप व्याकरणतः तृतीय पुरुष बहुवचन है, निकटवर्ती द्वितीय पुरुष बहुवचन क्रियाओं और संबोधन के प्रवाह के कारण इसे उसी श्रोता-समूह के लिए समझना उचित है। क्रिया लज्जा और निराशा का भाव देती है।
- source_word: מֵאֵילִים
  choice: बड़े वृक्षों के कारण
  rationale: אֵילִים यहाँ बागों के समानांतर ऐसे प्रभावशाली वृक्षों को सूचित करता है जो संभवतः अनुचित उपासना से जुड़े थे। वृक्ष-प्रजाति निश्चित नहीं है, इसलिए मुख्य पाठ में सामान्य और स्पष्ट पद रखा गया है तथा विकल्प पादटिप्पणी में दिए गए हैं। מִן लज्जा के कारण को दर्शाता है।
- source_word: אֲשֶׁר חֲמַדְתֶּם
  choice: जिन्हें तुमने चाहा था
  rationale: חמד प्रबल इच्छा या लगाव व्यक्त करता है। ‘चाहा’ अर्थ को सहज रूप से रखता है और ‘लालच’ जैसा अतिरिक्त नैतिक अर्थ नहीं जोड़ता।
- source_word: וְתַחְפְּרוּ
  choice: तुम्हें अपमानित होना पड़ेगा
  rationale: חפר यहाँ लज्जित, निरुत्तर अथवा अपमानित होने का भाव देता है। यह पहले पद के ‘लज्जित’ से संबंधित रहते हुए उसके शब्दगत भेद को भी बनाए रखता है।
- source_word: מֵהַגַּנּוֹת
  choice: बागों के कारण
  rationale: लज्जा-संबंधी क्रिया के साथ מִן कारण या आधार बताता है। ‘के कारण’ यह संबंध स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר בְּחַרְתֶּם
  choice: जिन्हें तुमने चुना था
  rationale: בחר का सीधा अर्थ ‘चुनना’ है; इससे श्रोताओं की जानबूझकर की गई पसंद स्पष्ट रहती है।
theological_decisions:
- issue: वृक्षों और बागों का धार्मिक संदर्भ
  choice: मुख्य पाठ में केवल ‘बड़े वृक्ष’ और ‘बाग’ रखते हुए इन्हें संभावित अनुचित उपासना-स्थलों के रूप में समझना
  alternative: इन्हें केवल मनोहर या विलासपूर्ण प्राकृतिक स्थान मानना
  rationale: यशायाह 1 का धर्मत्याग-विरोधी संदर्भ और भविष्यद्वक्ताओं में वृक्षों तथा बागों का प्रयोग अनुचित उपासना के स्थलों के लिए होना धार्मिक पृष्ठभूमि की ओर संकेत करता है। फिर भी मुख्य पाठ में ‘पवित्र वृक्ष’ या ‘मूर्तिपूजा के बाग’ जोड़ना मूल से अधिक स्पष्ट कर देना होता, इसलिए संकेत को पादटिप्पणी तक सीमित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सामान्य पाठक के लिए सहज पर गरिमापूर्ण। ‘बड़े वृक्ष’ दुर्लभ वनस्पति-नाम से बचते हुए मूल की अनिश्चितता बनाए रखता है। समानांतर पंक्तियों में ‘के कारण’ दोहराकर इब्रानी संरचना और लज्जा के कारण-संबंध को स्पष्ट रखा गया है।
