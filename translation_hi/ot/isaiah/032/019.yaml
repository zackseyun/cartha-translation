    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרַד
  choice: तब ओले पड़ेंगे
  rationale: ברד को यहाँ मौसम-संबंधी क्रिया के रूप में समझा गया है। हिन्दी में स्वाभाविक अभिव्यक्ति ‘ओले पड़ेंगे’ है; וּ का संबंध प्रसंगानुसार ‘तब’ से व्यक्त किया गया है।
- source_word: בְּרֶדֶת
  choice: जब ... गिर पड़ेगा
  rationale: ירד के infinitive construct पर בְ समयसूचक है, इसलिए ‘जब’ उपयुक्त है। वन के संदर्भ में ‘गिर पड़ेगा’ विनाशकारी पतन का भाव देता है, जबकि मूल की ‘नीचे उतरने/गिरने’ की व्यापकता भी बनाए रखता है।
- source_word: הַיָּעַר
  choice: वन
  rationale: יַעַר का सीधा, गरिमापूर्ण और सामान्य आधुनिक हिन्दी पर्याय ‘वन’ है।
- source_word: וּבַשִּׁפְלָה
  choice: और तराई में
  rationale: שְׁפֵלָה नीची भूमि या निम्न भूभाग को दर्शाता है। ‘तराई’ हिन्दी में इस स्थलाकृतिक अर्थ को स्वाभाविक रूप से व्यक्त करती है।
- source_word: תִּשְׁפַּל
  choice: एकदम नीचा कर दिया जाएगा
  rationale: שׁפל यहाँ नगर के विनाशकारी रूप से नीचे गिराए जाने या धराशायी किए जाने का संकेत देता है, नैतिक नम्रता का नहीं। ‘एकदम’ परिणाम की तीव्रता व्यक्त करता है।
- source_word: הָעִיר
  choice: नगर
  rationale: עִיר के लिए ‘नगर’ सहज, गरिमापूर्ण और निश्चित पद के अनुकूल है।
