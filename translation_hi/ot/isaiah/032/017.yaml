source:
  edition: WLC
  text: וְ/הָיָ֛ה מַעֲשֵׂ֥ה הַ/צְּדָקָ֖ה שָׁל֑וֹם וַֽ/עֲבֹדַת֙ הַ/צְּדָקָ֔ה הַשְׁקֵ֥ט וָ/בֶ֖טַח עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/017.yaml
  text: And the work of righteousness will be peace, and the service of righteousness, quietness and security forever.
translation:
  language: hi
  text: 'धार्मिकता का कार्य शान्ति होगा,

    और धार्मिकता की सेवा सदा तक शान्ति और सुरक्षा होगी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעֲשֵׂה הַצְּדָקָה
  choice: धार्मिकता का कार्य
  rationale: מַעֲשֵׂה का सामान्य अर्थ ‘कार्य/काम’ है; संबंधसूचक रचना को यथासंभव सीधे रूप में रखा गया है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: यहाँ परिणामस्वरूप मिलने वाली शान्ति और कल्याण का भाव है; ‘शान्ति’ पद्य के समानांतर अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֲבֹדַת הַצְּדָקָה
  choice: धार्मिकता की सेवा का फल
  rationale: עֲבֹדָה का मूल अर्थ ‘काम/सेवा’ है। पहले चरण के ‘कार्य’ से भेद बनाए रखने के लिए ‘सेवा’ रखा गया है; वाक्य में निहित परिणाम-संबंध स्पष्ट करने हेतु ‘का फल’ जोड़ा गया है।
- source_word: הַשְׁקֵט
  choice: चैन
  rationale: यह संज्ञार्थक रूप शान्त अवस्था, निश्चिन्तता या चैन को दर्शाता है; आधुनिक हिन्दी में ‘चैन’ सहज और स्पष्ट है।
- source_word: בֶּטַח
  choice: सुरक्षा
  rationale: शब्द भरोसे के साथ निर्भय और सुरक्षित दशा को व्यक्त करता है; ‘सुरक्षा’ इस संदर्भ में सर्वाधिक स्वाभाविक है।
- source_word: עַד־עוֹלָם
  choice: सदा का
  rationale: दीर्घस्थायी अथवा अनन्त काल का अर्थ व्यक्त करता है और दोनों अंतिम परिणामों पर लागू होता है।
theological_decisions:
- issue: धार्मिकता और शान्ति के बीच संबंध
  choice: ‘धार्मिकता का कार्य शान्ति होगा’—मूल का परिणामसूचक कथन बनाए रखा गया।
  alternative: ‘धार्मिकता से शान्ति उत्पन्न होगी।’
  rationale: वैकल्पिक रूप अर्थ स्पष्ट करता है, पर मूल के ‘कार्य’ रूपक को हटा देता है; इसलिए अधिक औपचारिक तनाव सुरक्षित रखा गया।
- issue: עֲבֹדָה का अर्थ
  choice: ‘सेवा’ को मुख्य पाठ में रखा, लेकिन परिणाम-संबंध के लिए ‘फल’ जोड़ा।
  alternative: ‘प्रभाव’ या ‘परिणाम’।
  rationale: मूल शब्द सचमुच ‘काम/सेवा’ कह सकता है, जबकि संदर्भ उसका फल भी सूचित करता है। अनुवाद मूल शब्द और काव्यगत आशय दोनों को बनाए रखता है; पादटिप्पणी अन्य सम्भावना बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘धार्मिकता’, ‘शान्ति’ और ‘सुरक्षा’ जैसे परिचित बाइबलीय पद रखे गए हैं; काव्यात्मक समानांतरता और स्रोत की अर्थगत गुंजाइश सुरक्षित रखी गई है।
