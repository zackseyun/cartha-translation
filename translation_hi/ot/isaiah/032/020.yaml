  text: אַשְׁרֵי/כֶ֕ם זֹרְעֵ֖י עַל כָּל מָ֑יִם מְשַׁלְּחֵ֥י רֶֽגֶל הַ/שּׁ֖וֹר וְ/הַ/חֲמֽוֹר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/020.yaml
  text: Blessed are you who sow beside all waters[a], who let the feet of the ox and the donkey range free.
translation:
  language: hi
  text: धन्य हो तुम, जो सभी जलधाराओं के किनारे बीज बोते हो और बैल तथा गधे को स्वतंत्र घूमने देते हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बैल और गधे का पैर छोड़ देते हो”; यह उन्हें खुला छोड़ने का मुहावरा है, ताकि वे स्वतंत्र रूप से घूम या चर सकें।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵיכֶם
  choice: धन्य हो तुम
  rationale: बहुवचन संबोधन के साथ यह अभिव्यक्ति धन्यता और समृद्ध दशा का बोध कराती है। ‘धन्य हो तुम’ इसकी आशीर्वचन-जैसी शक्ति बनाए रखता है।
- source_word: זֹרְעֵי
  choice: जो ... बीज बोते हो
  rationale: बहुवचन कृदंत संबोधित लोगों को उनके निरंतर कार्य से पहचानता है; संबंधवाचक उपवाक्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: עַל כָּל מָיִם
  choice: सभी जलधाराओं के किनारे
  rationale: यह वाक्यांश प्रचुर जल वाले, खेती के योग्य स्थानों का चित्र प्रस्तुत करता है। ‘जलधाराओं के किनारे’ कृषि-संदर्भ में स्वाभाविक रहते हुए मूल के बहुवचन और व्यापकता को व्यक्त करता है।
- source_word: מְשַׁלְּחֵי רֶגֶל
  choice: स्वतंत्र घूमने देते हो
  rationale: शाब्दिक अर्थ ‘पैर भेजने/छोड़ने वाले’ है, जो पशुओं को खुला छोड़ देने का मुहावरा है। चुना हुआ रूप अर्थ को स्पष्ट करता है, जबकि शाब्दिक चित्र पादटिप्पणी में सुरक्षित है।
- source_word: הַשּׁוֹר
  choice: बैल
  rationale: कृषि-संदर्भ में यह गोवंशीय कामकाजी पशु के लिए मानक और सहज हिन्दी शब्द है।
- source_word: וְהַחֲמוֹר
  choice: तथा गधे
  rationale: ‘गधा’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक नाम है; ‘तथा’ दोनों कृषि-पशुओं को गरिमापूर्ण ढंग से जोड़ता है।
