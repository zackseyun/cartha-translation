lexical_decisions:
- source_word: שָׁדַיִם
  choice: छाती
  rationale: शब्द का शाब्दिक अर्थ ‘स्तन’ है; यहाँ शोक के प्रसंग में बहुवचन अंग-संज्ञा छाती पीटने की प्रचलित शोक-भंगिमा की ओर संकेत करती है। स्वाभाविक हिन्दी में ‘छाती’ इस मुहावरे को स्पष्ट रखती है।
- source_word: סֹפְדִים
  choice: पीट-पीटकर विलाप करते हैं
  rationale: सपद का कृदन्त शोक मनाने या विलाप करने को व्यक्त करता है। संक्षिप्त इब्रानी पदबंध में ‘छाती’ के साथ निहित प्रहार की क्रिया को हिन्दी में स्पष्ट किया गया है, पर वैकल्पिक शाब्दिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: שְׂדֵי חֶמֶד
  choice: मनभावने खेतों
  rationale: חֶמֶד वांछनीय, प्रिय या आनंददायक होने का भाव देता है। ‘मनभावने खेत’ मूल्यवान और सुखद कृषि-भूमि का स्वाभाविक, गरिमामय चित्र प्रस्तुत करता है।
- source_word: גֶּפֶן פֹּרִיָּה
  choice: फलवती दाखलता
  rationale: גֶּפֶן दाखलता और פֹּרִיָּה फल देने वाली या फलवती को दर्शाता है। यह चुनाव कृषि-बिंब को संक्षिप्त और स्रोत-संगत रखता है।
- source_word: עַל
  choice: के लिए
  rationale: बार-बार आया עַל यहाँ विलाप के विषय अथवा कारण को चिह्नित करता है। हिन्दी में ‘के लिए’ दोनों कृषि-पदबंधों के साथ स्वाभाविक है और पुनरावृत्त संरचना को बनाए रखता है।
