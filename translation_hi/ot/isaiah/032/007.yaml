source:
  edition: WLC
  text: וְ/כֵלַ֖י כֵּלָ֣י/ו רָעִ֑ים ה֚וּא זִמּ֣וֹת יָעָ֔ץ לְ/חַבֵּ֤ל ענוים בְּ/אִמְרֵי שֶׁ֔קֶר וּ/בְ/דַבֵּ֥ר אֶבְי֖וֹן מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/007.yaml
  text: And the rogue’s devices are evil[a]; he devises schemes to ruin the humble with lying words[c][b], even when the poor man speaks what is just.
translation:
  language: hi
  text: और धूर्त के साधन बुरे हैं[a]; वह दीन लोगों[b] को झूठी बातों से बरबाद करने की योजनाएँ बनाता है, तब भी जब गरीब व्यक्ति न्याय की बात कहता है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “साधन” के स्थान पर “औज़ार,” “उपकरण,” “हथियार” या “तरीके” भी संभव हैं; इब्रानी शब्द वास्तविक वस्तुओं और लाक्षणिक उपायों, दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “दीन लोगों” के स्थान पर “दुःख झेलने वालों,” “नम्र लोगों” या “दबे-कुचले लोगों” भी संभव है।
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक रूप से: “और गरीब व्यक्ति के न्याय की बात कहने पर।” इसका अर्थ यह भी हो सकता है कि धूर्त गरीब व्यक्ति का दावा न्यायसंगत होने पर भी उसका विरोध करता है।'
    reason: textual_ambiguity
lexical_decisions:
- source_word: כֵלַי / כֵּלָיו
  choice: साधन
  rationale: כְּלִי का शाब्दिक अर्थ पात्र, औज़ार या उपकरण हो सकता है और लाक्षणिक रूप से किसी के तरीके या उपाय भी। “साधन” इस ठोस और लाक्षणिक दोनों संभावना को खुला रखता है।
- source_word: רָעִים
  choice: बुरे
  rationale: यह विशेषण धूर्त के साधनों के नैतिक चरित्र को बताता है; “बुरे” सरल, स्वाभाविक और नैतिक निंदा को स्पष्ट करने वाला है।
- source_word: זִמּוֹת יָעָץ
  choice: योजनाएँ बनाता है
  rationale: संज्ञा और क्रिया मिलकर सोच-समझकर हानिकारक योजना बनाने का भाव देते हैं। नकारात्मक आशय पूरे प्रसंग और उद्देश्यवाचक वाक्यांश से स्पष्ट है, इसलिए अनावश्यक रूप से “षड्यंत्र” नहीं जोड़ा गया।
- source_word: לְחַבֵּל
  choice: बरबाद करने
  rationale: यहाँ क्रिया असहाय लोगों को गंभीर हानि पहुँचाने के उद्देश्य को व्यक्त करती है; “बरबाद करना” पूर्ण संहार का अर्थ थोपे बिना उस विनाशकारी प्रभाव को बताता है।
- source_word: ענוים
  choice: दीन लोगों
  rationale: यह शब्द नम्र, दबे-कुचले या दुःख झेलने वालों को सूचित कर सकता है। “दीन लोगों” आर्थिक निर्धनता तक अर्थ को सीमित नहीं करता और अगले אֶבְיוֹן से कुछ भेद बनाए रखता है।
- source_word: בְּאִמְרֵי שֶׁקֶר
  choice: झूठी बातों से
  rationale: पूर्वसर्ग ב साधन को व्यक्त करता है; यह रूप स्पष्ट करता है कि झूठी बातें दीन लोगों को बरबाद करने का माध्यम हैं।
- source_word: אֶבְיוֹן
  choice: गरीब व्यक्ति
  rationale: शब्द एक गरीब या ज़रूरतमंद व्यक्ति को सूचित करता है और इब्रानी में एकवचन है। “गरीब व्यक्ति” आधुनिक हिन्दी में स्वाभाविक रहते हुए एकवचन और प्रतिनिधिक अर्थ को बनाए रखता है।
- source_word: וּבְדַבֵּר אֶבְיוֹן מִשְׁפָּט
  choice: तब भी जब गरीब व्यक्ति न्याय की बात कहता है
  rationale: בְּדַבֵּר को परिस्थितिवाचक/कालवाचक माना गया है और מִשְׁפָּט के न्यायिक-नैतिक भाव को “न्याय की बात” से व्यक्त किया गया है। “तब भी” प्रसंगगत विरोध को स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक और वैकल्पिक अर्थों को सुरक्षित रखती है।
theological_decisions:
- issue: אֶבְיוֹן का प्रतिनिधिक पुल्लिंग एकवचन
  choice: गरीब व्यक्ति
  alternative: गरीब जन / ज़रूरतमंद
  rationale: मूल शब्द व्याकरणिक रूप से पुल्लिंग एकवचन है, पर प्रसंग में प्रतिनिधिक रूप से प्रयुक्त हो सकता है। “व्यक्ति” एकवचन बनाए रखता है और हिन्दी में इसे केवल पुरुष तक अनावश्यक रूप से सीमित नहीं करता।
- issue: अंतिम उपवाक्य का न्यायिक संबंध
  choice: तब भी जब गरीब व्यक्ति न्याय की बात कहता है
  alternative: और जब गरीब अपना न्यायसंगत मुकदमा कहता है / गरीब को न्याय की बात कहने से रोकना
  rationale: इब्रानी की संक्षिप्त रचना कई संबंधों की अनुमति देती है। मुख्य पाठ परिस्थितिवाचक अर्थ अपनाता है—धूर्त गरीब के उचित दावे के बावजूद उसे हानि पहुँचाता है—पर पादटिप्पणी मूल की अस्पष्टता बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “धूर्त,” “साधन,” “दीन लोगों” और “न्याय की बात” सामान्य पाठक के लिए बोधगम्य हैं, जबकि पादटिप्पणियाँ प्रमुख शब्दार्थगत और वाक्यगत अस्पष्टताओं को सुरक्षित रखती हैं।
