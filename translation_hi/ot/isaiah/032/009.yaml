  text: נָשִׁים֙ שַֽׁאֲנַנּ֔וֹת קֹ֖מְנָה שְׁמַ֣עְנָה קוֹלִ֑/י בָּנוֹת֙ בֹּֽטח֔וֹת הַאְזֵ֖נָּה אִמְרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/009.yaml
  text: You complacent women[a], rise up; hear my voice. You confident daughters[c][b], listen to my word.
translation:
  language: hi
  text: हे बेपरवाह स्त्रियो[a], उठो; मेरी आवाज़ सुनो। हे निश्चिंत बेटियो[b][c], मेरी बात ध्यान से सुनो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सुख-चैन से रहने वाली”; इब्रानी शब्द निर्विघ्न रहने या लापरवाही से अपने को सुरक्षित मानने का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “बेटियाँ।” इब्रानी संबोधन का रूप बनाए रखने के लिए यह शब्द रखा गया है।
    reason: cultural_note
  - marker: c
    text: या, “अपने को सुरक्षित समझने वाली”; इब्रानी शब्द सुरक्षा के एहसास या आत्मविश्वास से उपजी निश्चिंतता पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׁים
  choice: स्त्रियो
  rationale: यह बहुवचन संबोधन सामान्य रूप से स्त्रियों के लिए है; यहाँ ‘पत्नियाँ’ अर्थ अपेक्षित नहीं है।
- source_word: שַׁאֲנַנּוֹת
  choice: बेपरवाह
  rationale: यह शब्द सुख-चैन और निर्विघ्न सुरक्षा की दशा बताता है, पर भविष्यद्वाणी की फटकार में लापरवाह निश्चिंतता का नकारात्मक भाव भी रखता है; ‘बेपरवाह’ उस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קֹמְנָה
  choice: उठो
  rationale: קום के स्त्रीलिंग बहुवचन आदेश का सीधा और स्वाभाविक हिन्दी रूप, जिसमें तत्काल ध्यान देने का आह्वान बना रहता है।
- source_word: שְׁמַעְנָה
  choice: सुनो
  rationale: स्त्रीलिंग बहुवचन आदेश का सरल रूप; अगले समानांतर आदेश से कुछ शब्दगत भिन्नता भी बनी रहती है।
- source_word: קוֹלִי
  choice: मेरी आवाज़
  rationale: प्रत्यक्ष संबोधन में קוֹל का सामान्य अर्थ ‘आवाज़’ है; यह मूल अभिव्यक्ति को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: בָּנוֹת
  choice: बेटियो
  rationale: शाब्दिक संबोधन ‘बेटियाँ’ है। ‘बेटियो’ रखने से इब्रानी का संबोधन और ‘स्त्रियो’ के साथ उसका समानांतर रूप सुरक्षित रहता है।
- source_word: בֹּטְחוֹת
  choice: निश्चिंत
  rationale: यह अपने को सुरक्षित मानने और आत्मविश्वास से निश्चिंत रहने की दशा बताता है। ‘निश्चिंत’ उचित विश्वास का धार्मिक अर्थ आरोपित किए बिना उस भाव को व्यक्त करता है।
- source_word: הַאְזֵנָּה
  choice: कान लगाओ
  rationale: אזן का हिफ़ील आदेश ध्यानपूर्वक सुनने का आग्रह करता है; ‘कान लगाओ’ केवल सुन पड़ने के बजाय सचेत ध्यान का भाव देता है।
- source_word: אִמְרָתִי
  choice: मेरी बात
  rationale: यह संज्ञा कही हुई बात या कथन को दर्शाती है। ‘मेरी बात’ आधुनिक हिन्दी में स्वाभाविक है और ‘मेरी आवाज़’ के समानांतर अर्थ को बनाए रखती है।
