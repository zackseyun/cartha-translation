id: ISA.32.2
reference: Isaiah 32:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָה אִ֥ישׁ כְּ/מַֽחֲבֵא ר֖וּחַ וְ/סֵ֣תֶר זָ֑רֶם כְּ/פַלְגֵי מַ֣יִם בְּ/צָי֔וֹן כְּ/צֵ֥ל סֶֽלַע כָּבֵ֖ד בְּ/אֶ֥רֶץ עֲיֵפָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/002.yaml
  text: And a man will be like a hiding place from the wind[a], and a shelter from the storm, like streams of water in a dry place[c][b], like the shade of a massive rock in a weary land.
translation:
  language: hi
  text: और एक पुरुष[c] हवा से बचने का आश्रय[a] और आँधी-वर्षा से बचने की ओट[b] के समान होगा, सूखे प्रदेश में जलधाराओं के समान, और थकी हुई भूमि में विशाल चट्टान की छाया के समान होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘हवा से छिपने का स्थान।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘मूसलाधार वर्षा से शरण’ अथवा ‘तूफ़ान से शरण।’
    reason: lexical_alternative
  - marker: c
    text: ‘एक पुरुष’ पिछले पद के आदर्श राजा का या प्रत्येक न्यायी शासक का प्रतिनिधिक उल्लेख हो सकता है, अथवा प्रतिरूपात्मक रूप से उनसे आगे किसी की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: और ... होगा
  rationale: भविष्यसूचक प्रसंग में वाव-संयुक्त पूर्ण क्रिया को भावी परिणाम के रूप में व्यक्त किया गया है; ‘और’ पिछले पद से संबंध बनाए रखता है।
- source_word: אִישׁ
  choice: एक पुरुष
  rationale: इब्रानी शब्द एकवचन और पुल्लिंग है। यह पिछले पद के आदर्श राजा अथवा न्यायी शासकों में से प्रत्येक का प्रतिनिधित्व कर सकता है; अनुवाद उस दायरे को खुला रखता है।
- source_word: מַחֲבֵא רוּחַ
  choice: हवा से छिपने का स्थान
  rationale: מַחֲבֵא छिपने अथवा शरण लेने की ठोस जगह को दर्शाता है; यह रूपक की दृश्यात्मकता बनाए रखता है।
- source_word: סֵתֶר זָרֶם
  choice: मूसलाधार वर्षा से बचने की ओट
  rationale: סֵתֶר आड़, ओट या शरण है और זָרֶם प्रचंड वर्षा, झड़ी अथवा तूफ़ान सूचित कर सकता है। मुख्य पाठ वर्षा की तीव्रता और सुरक्षा—दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: פַלְגֵי מַיִם
  choice: पानी की धाराएँ
  rationale: यह पदबंध बहते जलमार्गों या जलधाराओं को दर्शाता है और सूखे स्थान में जीवनदायी जल का चित्र बनाए रखता है।
- source_word: בְּצָיוֹן
  choice: सूखे प्रदेश में
  rationale: संज्ञा सूखापन, शुष्कता अथवा शुष्क क्षेत्र बताती है; ‘सूखा प्रदेश’ स्थानगत अर्थ को स्पष्ट और संक्षिप्त रूप में व्यक्त करता है।
- source_word: צֵל סֶלַע כָּבֵד
  choice: विशाल चट्टान की छाया
  rationale: כָּבֵד का मूल अर्थ ‘भारी’ है, पर चट्टान के वर्णन में यह उसके बड़े, ठोस और प्रभावशाली आकार को व्यक्त करता है; ‘विशाल’ हिन्दी में संरक्षण का वही बिंब देता है।
- source_word: בְּאֶרֶץ עֲיֵפָה
  choice: थकी हुई धरती में
  rationale: עֲיֵפָה का अर्थ थकी, शिथिल या निढाल है। भूमि के लिए प्रयुक्त इस मानवीकरण को समझाने के बजाय मुख्य पाठ में सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘एक पुरुष’ का संदर्भ
  choice: मुख्य पाठ में पुल्लिंग एकवचन ‘एक पुरुष’ रखा गया है और किसी एक धर्मवैज्ञानिक पहचान को निश्चित नहीं किया गया।
  alternative: इसे पिछले पद का राजा, उसके अधीन प्रत्येक न्यायी शासक, अथवा उनसे आगे संकेतित मसीही प्रतिरूप माना जा सकता है।
  rationale: यशायाह 32:1 में राजा और हाकिम दोनों आते हैं। एकवचन אִישׁ प्रतिनिधिक भी हो सकता है, इसलिए अनुवाद मूल व्याकरण को रखते हुए व्याख्यात्मक और मसीही संभावनाओं को खुला छोड़ता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सुरक्षा के समानांतर बिंबों के लिए ‘छिपने का स्थान’, ‘ओट’ और ‘छाया’ जैसे ठोस शब्द चुने गए हैं। ‘थकी हुई धरती’ मूल के मानवीकरण और काव्यात्मक तनाव को बनाए रखता है।
