review_pass:
  verdict: revise
  source_fidelity: The draft preserves the four Hebrew comparisons and correctly leaves the singular masculine אִישׁ referent open. However, זָרֶם denotes a violent rainstorm/downpour, not merely rainfall; the main wording should retain its storm-like force more clearly.
  naturalness: The poetic structure is understandable, but “हवा से छिपने का स्थान” is less idiomatic Hindi than “हवा से बचने का आश्रय,” and repeating “वह” after the semicolon is unnecessary. A more balanced sequence of comparisons reads naturally while retaining the Hebrew imagery.
  terminology: “एक पुरुष” appropriately retains the singular masculine wording in a formal register. “आश्रय,” “ओट,” “जलधाराएँ,” and “विशाल चट्टान की छाया” are suitable renderings. “थकी हुई भूमि” preserves the source’s deliberate personification of the land.
  issues:
  - severity: medium
    issue: “मूसलाधार वर्षा” in the main text can understate the threatening, tempestuous force of זָרֶם.
    rationale: The Hebrew word denotes a violent downpour or storm-rain. “आँधी-वर्षा” retains both the rain and its destructive storm quality without over-specifying.
  - severity: low
    issue: “हवा से छिपने का स्थान” is somewhat awkward in modern Hindi.
    rationale: “हवा से बचने का आश्रय” is idiomatic and conveys the protective sense of מַחֲבֵא just as faithfully.
  - severity: low
    issue: The clause after the semicolon unnecessarily restarts with “वह,” making the line less compact and balanced.
    rationale: The Hebrew presents a coordinated series of similes. Continuing the series directly is more natural Hindi poetic prose.
