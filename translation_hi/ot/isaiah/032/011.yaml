source:
  edition: WLC
  text: חִרְדוּ֙ שַֽׁאֲנַנּ֔וֹת רְגָ֖זָה בֹּֽטְח֑וֹת פְּשֹׁ֣טָֽה וְ/עֹ֔רָה וַ/חֲג֖וֹרָה עַל חֲלָצָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/011.yaml
  text: Tremble[a], you complacent women; shudder, you confident ones. Strip, make yourselves bare[c][b], and tie sackcloth around your waist.
translation:
  language: hi
  text: निश्चिंत स्त्रियो, काँपो! अपने को सुरक्षित समझनेवालियो, थरथराओ! अपने वस्त्र उतारो और अपने को अनावृत करो[c]; अपनी कमर[a] पर टाट[b] बाँधो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “कटि पर।”
    reason: lexical_alternative
  - marker: b
    text: इस पद के हिब्रू पाठ में “टाट” स्पष्ट रूप से नहीं लिखा है; शोक के इस भविष्यद्वाणी-संदर्भ में कमर पर बाँधी जाने वाली वस्तु सामान्यतः टाट समझी जाती है।
    reason: cultural_note
  - marker: c
    text: या, “अपने वस्त्र उतारो और नग्न हो जाओ।”
    reason: translation_alternative
lexical_decisions:
- source_word: חִרְדוּ
  choice: काँपो
  rationale: חרד के बहुवचन आज्ञार्थक का सीधा अर्थ भय से काँपना है; यह सरल, स्वाभाविक और तीखा आह्वान है।
- source_word: שַׁאֲנַנּוֹת
  choice: हे निश्चिंत स्त्रियो
  rationale: स्त्रीलिंग बहुवचन संबोधन को स्पष्ट रखते हुए उस आराम और लापरवाह निश्चिंतता का भाव व्यक्त करता है जिस पर भविष्यद्वक्ता प्रहार करता है।
- source_word: רְגָזָה
  choice: थरथराओ
  rationale: स्त्रीलिंग बहुवचन आज्ञार्थक में काँपने या व्याकुल होकर हिलने का भाव है; पहले आदेश के समानांतर रहते हुए अलग शब्द-छटा देता है।
- source_word: בֹּטְחוֹת
  choice: हे अपने को सुरक्षित समझनेवालियो
  rationale: בטח के स्त्रीलिंग बहुवचन कृदंत में सुरक्षा या भरोसे का अनुभव है; यहाँ विडंबनापूर्ण संबोधन होने के कारण यह रूप झूठी सुरक्षा के भाव को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: פְּשֹׁטָה וְעֹרָה
  choice: अपने कपड़े उतारो और अपने को उघाड़ो
  rationale: 'दोनों संक्षिप्त आज्ञाओं को बनाए रखता है: पहली वस्त्र उतारने और दूसरी स्वयं को अनावृत करने की तीव्रतर छवि देती है।'
- source_word: וַחֲגֹרָה
  choice: बाँधो
  rationale: חגר का अर्थ कमर पर किसी वस्तु को कसना या बाँधना है; आधुनिक हिन्दी में 'बाँधो' स्वाभाविक है।
- source_word: עַל חֲלָצָיִם
  choice: अपनी कमर पर
  rationale: शाब्दिक अर्थ कटि/कमर का भाग है; 'कमर पर' सामान्य आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: कमर पर बाँधी जाने वाली वस्तु पाठ में स्पष्ट नहीं है
  choice: मुख्य पाठ में 'टाट' की पूर्ति और पादटिप्पणी द्वारा संकेत
  alternative: केवल 'कमर पर बाँधो'
  rationale: शोक-संदर्भ में कमर पर बाँधने की वस्तु सामान्यतः टाट समझी जाती है, पर हिब्रू पद में उसका नाम नहीं है; इसलिए अर्थ स्पष्ट करते हुए पाठगत अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सीधा, गरिमापूर्ण और भविष्यद्वाणी-संबंधी चेतावनी के अनुरूप तीखा संबोधन रखा गया है। स्त्रीलिंग बहुवचन को स्पष्ट रूप से सुरक्षित रखा गया है। दो समानांतर काँपने वाले आदेशों और दो वस्त्र-त्याग संबंधी आदेशों के बीच शब्दगत भेद बनाए रखा गया है।
