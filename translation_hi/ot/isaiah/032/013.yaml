  text: עַ֚ל אַדְמַ֣ת עַמִּ֔/י ק֥וֹץ שָׁמִ֖יר תַּֽעֲלֶ֑ה כִּ֚י עַל כָּל בָּתֵּ֣י מָשׂ֔וֹשׂ קִרְיָ֖ה עַלִּיזָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/013.yaml
  text: On the land of my people[a], thorn and brier will come up; indeed[b], over all the joyful houses in the exultant city.
translation:
  language: hi
  text: मेरी प्रजा की भूमि पर काँटे और कँटीली झाड़ियाँ उगेंगी[a]—हाँ, हर्ष के सभी घरों पर और उल्लसित नगरी पर भी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘फूट निकलेंगी’
    reason: lexical_alternative
  - marker: b
    text: या ‘आनंद मनाती नगरी’; इब्रानी में ऐसी नगरी का वर्णन है जो उल्लास या आमोद से चिह्नित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְמַת עַמִּי
  choice: मेरी प्रजा की भूमि
  rationale: אַדְמָה का अर्थ भूमि, मिट्टी या धरती हो सकता है। यहाँ न्याय और उजाड़ के संदर्भ में ‘भूमि’ स्वाभाविक है और प्रजा से उसके संबंध को बनाए रखता है।
- source_word: קוֹץ שָׁמִיר
  choice: काँटे और कँटीली झाड़ियाँ
  rationale: यह युग्म उजाड़ के कारण उग आने वाली काँटेदार वनस्पति का चित्र प्रस्तुत करता है। अलग-अलग वनस्पति-प्रजातियाँ निश्चित न होने के कारण सामान्य और स्पष्ट शब्द चुने गए हैं।
- source_word: תַּעֲלֶה
  choice: उगेंगी
  rationale: עלה यहाँ भूमि से वनस्पति के निकलने या बढ़ने के अर्थ में है। ‘उगेंगी’ आधुनिक हिन्दी में इस संदर्भ का सीधा और स्वाभाविक रूप है।
- source_word: כִּי
  choice: हाँ
  rationale: यहाँ כִּי को कारणसूचक मानने के बजाय कथन पर बल देने वाला समझा गया है। ‘हाँ’ विनाश के अगले विस्तार को प्रभावी ढंग से जोड़ता है।
- source_word: בָּתֵּי מָשׂוֹשׂ
  choice: हर्ष के सब घर
  rationale: इब्रानी रचना का निकट अर्थ ‘हर्ष के घर’ है। यह रूप आनंद, उत्सव या आमोद से जुड़े घरों की संभावित व्यंजना को खुला रखता है।
- source_word: קִרְיָה עַלִּיזָה
  choice: उल्लसित नगरी
  rationale: עַלִּיזָה आनंदित या उल्लसित होने का भाव देता है। ‘उल्लसित’ मूल के प्रत्यक्ष अर्थ को रखता है, जबकि ‘नगरी’ काव्यात्मक भविष्यवाणी के गरिमापूर्ण स्वर के अनुकूल है।
theological_decisions:
- issue: כִּי का वाक्यगत संबंध
  choice: बलसूचक ‘हाँ’
  alternative: कारणसूचक ‘क्योंकि’
  rationale: संदर्भ में यह विनाश के क्षेत्र को आगे बढ़ाता और प्रबल करता है; फिर भी इब्रानी संयोजक का कारणसूचक पाठ व्याकरणतः संभव है।
- issue: עַלִּיזָה की भावछाया
  choice: उल्लसित
  alternative: निश्चिंत या बेफिक्र
  rationale: मूल शब्द का प्रत्यक्ष आशय आनंद या उल्लास है। संदर्भ में निश्चिंतता की नकारात्मक छाया संभव है, पर उसे मुख्य पाठ में स्पष्ट करके व्याख्या थोपना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, काव्यात्मक भविष्यवाणी के अनुरूप गरिमापूर्ण किंतु सहज रखी गई है। ‘हर्ष के घर’ में इब्रानी की ठोस रचना और उसकी अर्थगत खुलावट सुरक्षित है। मुख्य पाठ के दोनों पादों में ‘पर’ की पुनरावृत्ति मूल की संरचना और विनाश के व्यापक विस्तार को दर्शाती है।
