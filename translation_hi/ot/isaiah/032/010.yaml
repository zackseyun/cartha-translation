  text: יָמִים֙ עַל שָׁנָ֔ה תִּרְגַּ֖זְנָה בֹּֽטְח֑וֹת כִּ֚י כָּלָ֣ה בָצִ֔יר אֹ֖סֶף בְּלִ֥י יָבֽוֹא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/010.yaml
  text: In little more than a year you will tremble[a], you complacent women, because the grape harvest will fail[c][b]; the fruit harvest will not come.
translation:
  language: hi
  text: एक वर्ष और कुछ दिन बीतने पर तुम काँप उठोगी[a], हे निश्चिंत स्त्रियो[b], क्योंकि अंगूर की फसल नहीं होगी; उपज बटोरने का समय नहीं आएगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप: ‘दिन एक वर्ष पर’; अर्थात एक वर्ष से कुछ अधिक समय बीतने पर।'
    reason: lexical_alternative
  - marker: b
    text: या ‘आश्वस्त स्त्रियो’ अथवा ‘सुरक्षित अनुभव करने वाली स्त्रियो’।
    reason: lexical_alternative
  - marker: c
    text: या ‘उपज का संग्रह नहीं आएगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִים עַל שָׁנָה
  choice: एक वर्ष और कुछ दिनों के बाद
  rationale: इब्रानी का शाब्दिक रूप ‘एक वर्ष पर दिन’ है। यह पूरे वर्ष से थोड़े अधिक समय को दर्शाने वाला मुहावरा है; चुना हुआ रूप आधुनिक हिन्दी में समय और निकटता दोनों स्पष्ट करता है।
- source_word: תִּרְגַּזְנָה
  choice: तुम काँप उठोगी
  rationale: רגז भय या व्याकुलता से काँपने अथवा विचलित होने का भाव देता है। स्त्रीलिंग बहुवचन संबोधन को हिन्दी में स्पष्ट रखा गया है।
- source_word: בֹּטְחוֹת
  choice: निश्चिंत स्त्रियो
  rationale: בטח का कृदंत सुरक्षित या आश्वस्त अनुभव करने वाली स्त्रियों को सूचित करता है। प्रसंग में उनकी निश्चिंतता अनुचित है, पर ‘निश्चिंत’ मूल शब्द की वास्तविक अस्पष्टता को ‘लापरवाह’ जैसे अधिक व्याख्यात्मक शब्द से बेहतर बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आने वाले काँपने का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में इसका स्वाभाविक कारणवाचक रूप है।
- source_word: כָּלָה בָצִיר
  choice: अंगूर की फसल नहीं होगी
  rationale: בָצִיר विशेष रूप से अंगूर की कटनी है और כָּלָה उसके समाप्त या निष्फल हो जाने को बताता है। सन्दर्भ में सामान्य कटनी पूरी होने की नहीं, फसल के हाथ न आने की चेतावनी है; हिन्दी का यह रूप उसी आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֹסֶף בְּלִי יָבוֹא
  choice: उपज बटोरने का समय नहीं आएगा
  rationale: אֹסֶף उपज के संग्रह या बटोरने को और יָבוֹא उसके आने को व्यक्त करता है। यह रूप ‘नहीं आएगा’ की ठोस क्रियात्मक छवि बनाए रखते हुए हिन्दी में कृषि-सन्दर्भ स्पष्ट करता है।
