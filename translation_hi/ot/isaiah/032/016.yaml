lexical_decisions:
- source_word: וְשָׁכַן
  choice: तब ... बसेगा
  rationale: संदर्भ में पूर्ण क्रिया का भाव भविष्यसूचक है। וְ को पिछले पद के घटनाक्रम से जोड़ते हुए स्वाभाविक हिन्दी में “तब” कहा गया है।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר बियाबान, मरुस्थल या असंवर्धित निर्जन भूभाग को दर्शा सकता है। “निर्जन प्रदेश” उपजाऊ भूमि के साथ काव्यात्मक विरोध बनाए रखता है और इसे केवल रेतीले रेगिस्तान तक सीमित नहीं करता।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: यहाँ आशय दण्डादेश से नहीं, स्थापित न्यायपूर्ण व्यवस्था से है।
- source_word: וּצְדָקָה
  choice: और धार्मिकता
  rationale: “धार्मिकता” को “न्याय” से अलग रखकर מִשְׁפָּט और צְדָקָה की निकट, पर भिन्न, अवधारणाओं तथा समानांतरता को सुरक्षित रखा गया है।
- source_word: בַּכַּרְמֶל
  choice: उपजाऊ भूमि में
  rationale: כַּרְמֶל यहाँ व्यक्तिवाचक नाम कर्मेल भी हो सकता है, पर निर्जन प्रदेश के साथ विरोध के कारण सामान्य संज्ञा के रूप में खेती-योग्य, फलदायक भूमि संदर्भ में अधिक उपयुक्त है।
- source_word: תֵּשֵׁב
  choice: निवास करेगी
  rationale: ישׁב का मूल अर्थ “बैठना” है, किंतु यहाँ मानवीकरण में स्थायी रूप से बसने या बने रहने का भाव है। “निवास करेगी” dignified और स्वाभाविक हिन्दी में उस भाव को व्यक्त करता है।
theological_decisions:
- issue: מִשְׁפָּט और צְדָקָה के युग्म का अनुवाद
  choice: न्याय ... धार्मिकता
  alternative: न्याय ... न्यायपरायणता / जो उचित है
  rationale: दोनों शब्दों को एक ही हिन्दी शब्द में मिलाने के बजाय न्यायपूर्ण व्यवस्था और नैतिक-संबंधपरक धार्मिकता के बीच मूल पाठ की भिन्नता और धर्मवैचारिक तनाव बनाए रखा गया है।
- issue: כַּרְמֶל की पहचान
  choice: उपजाऊ भूमि
  alternative: कर्मेल
  rationale: पद की स्थल-छवि निर्जन भूमि और संवर्धित फलदायक भूमि का विरोध प्रस्तुत करती जान पड़ती है, फिर भी व्यक्तिवाचक स्थाननाम की वास्तविक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
