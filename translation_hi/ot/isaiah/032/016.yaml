  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। “बसेगा” और “निवास करेगी” न्याय तथा धार्मिकता के मानवीकरण और इब्रानी समानांतरता को स्वाभाविक हिन्दी में बनाए रखते हैं।
