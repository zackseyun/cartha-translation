  text: देखो[a], एक राजा धार्मिकता से[b] राज्य करेगा, और शासक[c] न्याय के अनुसार शासन करेंगे।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निहारो” अथवा “ध्यान दो”; यह आरम्भिक उद्गार ध्यान आकर्षित करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “धार्मिकता में”; अर्थ “धार्मिकता के अनुसार” या “न्यायोचित रीति से” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “शासक” का अनुवाद “राजकुमार,” “हाकिम” या “अधिकारी” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: d
    text: व्यापक प्रसंग में अनेक मसीही पाठक इस राजा को मसीह-संबंधी समझते हैं, पर यहाँ इब्रानी पाठ केवल “एक राजा” कहता है।
    reason: cross_reference
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्घाटन उद्गार है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए भविष्यद्वाणी की बलाघातपूर्ण शैली बनाए रखता है।
- source_word: לְצֶדֶק
  choice: धार्मिकता से
  rationale: यहाँ לְ शासन के ढंग या मानदंड को व्यक्त करता है। ‘धार्मिकता से’ संज्ञा के नैतिक और न्यायिक भार को बनाए रखते हुए हिन्दी में सहज है।
- source_word: יִמְלָךְ מֶלֶךְ
  choice: एक राजा ... राज्य करेगा
  rationale: מֶלֶךְ के साथ निश्चित उपपद नहीं है, इसलिए ‘एक राजा’ सीधा समतुल्य है। अपूर्ण क्रिया को प्रसंगानुसार भविष्यकाल में व्यक्त किया गया है।
- source_word: וּלְשָׂרִים
  choice: और हाकिम
  rationale: שָׂרִים राजकीय अधीनस्थ शासकों, अगुओं या अधिकारियों को सूचित करता है। ‘हाकिम’ राजा के समानांतर शासन-संबंधी अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לְמִשְׁפָּט
  choice: न्याय के अनुसार
  rationale: यह पद शासन के मानदंड को बताता है। ‘न्याय के अनुसार’ מִשְׁפָּט के न्यायिक-नैतिक अर्थ को स्पष्ट रूप से बनाए रखता है।
- source_word: יָשֹׂרוּ
  choice: शासन करेंगे
  rationale: שׂרר का अर्थ अधिकारपूर्वक शासन करना है। ‘शासन करेंगे’ राजनीतिक प्रसंग में स्पष्ट है और क्रिया में अनुपस्थित नैतिक अर्थ नहीं जोड़ता।
theological_decisions:
- issue: राजा को मुख्य पाठ में स्पष्ट रूप से मसीही ठहराना या न ठहराना
  choice: अनिश्चित पद ‘एक राजा’ रखा गया और उसकी पहचान मुख्य पाठ में नहीं जोड़ी गई।
  alternative: ‘वह राजा’ कहना या पाठ में उसे स्पष्ट रूप से मसीह बताना।
  rationale: व्यापक प्रसंग में अनेक मसीही पाठक इसे मसीह-संबंधी समझते हैं, पर इब्रानी पद में निश्चित उपपद नहीं है और इस वचन में राजा की स्पष्ट पहचान नहीं दी गई। इसलिए अनिश्चितता और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘देखो’ भविष्यद्वाणी का बल बनाए रखता है; ‘हाकिम’ और ‘शासन करेंगे’ राजकीय समानांतरता व्यक्त करते हैं। मुख्य पाठ स्रोत की अनिश्चितता को बनाए रखता है, जबकि वैकल्पिक शब्दार्थ और मसीही पाठ-पद्धति पादटिप्पणियों में दी गई हैं।
