base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/005.yaml
  text: No longer will the fool be called noble[d][c][b][a], nor will the scoundrel be called generous.
translation:
  language: hi
  text: अब मूर्ख को कुलीन[a] नहीं कहा जाएगा, और न कंजूस[b] को प्रतिष्ठित[c] कहा जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उदार” अथवा “सम्माननीय।”
    reason: lexical_alternative
  - marker: b
    text: या “कृपण,” “लोभी” अथवा “नीच व्यक्ति।”
    reason: lexical_alternative
  - marker: c
    text: या “धनी,” “कुलीन” अथवा “महत्त्वपूर्ण।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָל
  choice: मूर्ख
  rationale: यह शब्द केवल बुद्धि की कमी नहीं, बल्कि नैतिक मूर्खता और नीचता भी व्यक्त करता है। ‘मूर्ख’ संक्षिप्त और बाइबिलीय ज्ञान-साहित्य के अनुरूप है।
- source_word: נָדִיב
  choice: उदार
  rationale: इस शब्द में उदारता, कुलीनता और प्रतिष्ठा के अर्थ हो सकते हैं। अगले पद के निकट संदर्भ में उदार आचरण का अर्थ प्रमुख है, फिर भी विकल्प पादटिप्पणी में रखा गया है।
- source_word: כִילַי
  choice: कंजूस
  rationale: यह दुर्लभ शब्द कृपण, लोभी या नीच व्यक्ति को सूचित करता है। निकट संदर्भ में उसके धन-संचय और दुष्ट योजनाओं को देखते हुए ‘कंजूस’ स्पष्ट और स्वाभाविक है।
- source_word: שׁוֹעַ
  choice: प्रतिष्ठित
  rationale: यह शब्द धनवान, कुलीन या महत्त्वपूर्ण व्यक्ति को सूचित कर सकता है। ‘प्रतिष्ठित’ झूठी सामाजिक मान्यता के भाव को व्यक्त करता है और पहले खंड के समानार्थी पद से अनावश्यक समानता से बचता है।
- source_word: יִקָּרֵא / יֵאָמֵר
  choice: कहा जाएगा
  rationale: दोनों निष्क्रिय क्रियाएँ सार्वजनिक नामकरण या मान्यता दर्शाती हैं। हिंदी में समान वाक्यांश दोनों समानांतर खंडों की संक्षिप्तता बनाए रखता है।
- source_word: עוֹד ... לֹא
  choice: अब ... नहीं
  rationale: यह पूर्व स्थिति के समाप्त हो जाने का स्वाभाविक आधुनिक हिंदी रूप है।
theological_decisions:
- issue: पद में विरोध का स्वरूप
  choice: दुष्ट लोगों को सम्मानसूचक गुणों से पुकारने की सामाजिक और नैतिक उलटबाँसी का अंत
  alternative: मसीही युग की स्पष्ट भविष्यवाणी अथवा सत्यभाषण पर सामान्य कहावत
  rationale: इब्रानी पाठ सीधे तौर पर लोगों के सार्वजनिक नामकरण और मूल्यांकन की बात करता है। व्यापक संदर्भ भावी आदर्श शासन से जुड़ा है, पर अनुवाद में उससे अधिक स्पष्ट मसीही अर्थ जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। दोनों खंडों का समानांतर ढाँचा सुरक्षित रखा गया है। मुख्य पाठ में नैतिक और सामाजिक विरोध स्पष्ट है, जबकि बहुअर्थी इब्रानी पदों के विकल्प पादटिप्पणियों में दिए गए हैं।
