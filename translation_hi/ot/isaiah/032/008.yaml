  yaml_path: translation/ot/isaiah/032/008.yaml
  text: But a noble man plans noble things[b][a], and he stands on noble things.
translation:
  language: hi
  text: परन्तु श्रेष्ठ व्यक्ति श्रेष्ठ बातों की योजना बनाता है[a], और वह श्रेष्ठ बातों पर स्थिर रहता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उदार कामों की योजना बनाता है।” हिब्रू शब्द नादिव/नदिवोत कुलीनता अथवा उदारता—दोनों का भाव रख सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “श्रेष्ठ कामों के द्वारा वह स्थिर रहता है,” अथवा “श्रेष्ठ बातों में वह स्थापित होता है।” हिब्रू में ‘पर ... खड़ा होता है’ वाली अभिव्यक्ति संक्षिप्त है और इन निकटवर्ती अर्थों की अनुमति देती है।
    reason: alternative_reading
lexical_decisions:
- source_word: נָדִיב
  choice: कुलीन व्यक्ति
  rationale: यह शब्द कुलीन, उदार या श्रेष्ठ चरित्र वाले व्यक्ति को सूचित कर सकता है। प्रसंग में निकम्मे व्यक्ति के विपरीत नैतिक-सामाजिक श्रेष्ठता प्रमुख है; ‘व्यक्ति’ आधुनिक हिन्दी में स्वाभाविक है और राजनीतिक पद को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: נְדִיבוֹת
  choice: उदात्त बातें
  rationale: बहुवचन संज्ञा उदात्त या उदार योजनाओं और कार्यों को सूचित कर सकती है। ‘उदात्त बातें’ इसके व्यापक अर्थ को बनाए रखता है, यद्यपि नָדִיב के साथ हिब्रू की शब्द-पुनरावृत्ति हिन्दी में पूर्णतः सुरक्षित नहीं रहती।
- source_word: יָעָץ
  choice: योजना बनाता है
  rationale: यहाँ क्रिया का अर्थ किसी को परामर्श देना नहीं, बल्कि मन में उद्देश्य या योजना बनाना है।
- source_word: עַל
  choice: पर
  rationale: यह चुनाव हिब्रू के ‘ऊपर/पर खड़े होने’ के ठोस रूपक को बनाए रखता है, जबकि पादटिप्पणी साधन अथवा आधार का निकटवर्ती अर्थ स्पष्ट करती है।
- source_word: יָקוּם
  choice: दृढ़ रहता है
  rationale: קום का मूल अर्थ उठना या खड़ा होना है; इस प्रसंग में स्थिर रहने अथवा अपने उदात्त उद्देश्यों पर कायम रहने का भाव है। ‘दृढ़ रहता है’ आधुनिक हिन्दी में इस नैतिक स्थिरता को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: עַל ... יָקוּם का संक्षिप्त और बहुअर्थी प्रयोग
  choice: उदात्त बातों पर ही वह दृढ़ रहता है
  alternative: उदात्त बातों के द्वारा वह स्थिर रहता है / उदात्त बातों में वह स्थापित होता है
  rationale: मुख्य पाठ खड़े रहने के रूपक और नैतिक दृढ़ता दोनों को व्यक्त करता है, पर हिब्रू यह भी संकेत दे सकता है कि वही उदात्त कार्य उसके स्थिर होने का साधन या आधार हैं; इस अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कुलीन’ को वंशगत अभिजातता तक सीमित न मानकर श्रेष्ठ और उदार चरित्र के अर्थ में लिया गया है; ‘परन्तु’ पूर्ववर्ती विरोध को स्पष्ट करता है।
