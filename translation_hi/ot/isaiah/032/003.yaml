base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/003.yaml
  text: Then the eyes of those who see will not be dim[a], and the ears of those who hear will listen attentively.
translation:
  language: hi
  text: तब देखने वालों की आँखें धुँधली न होंगी[a], और सुनने वालों के कान ध्यान से सुनेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, उनकी आँखें बाधित न होंगी। इब्रानी क्रिया आँखों के धुँधले, बाधित या अस्पष्ट होने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא תִשְׁעֶינָה
  choice: धुँधली न होंगी
  rationale: निषेध को सीधे रखा गया है। क्रिया आँखों के धुँधला, बाधित या अस्पष्ट होने का भाव दे सकती है; भविष्यकाल निकटवर्ती भविष्यवाणी के प्रवाह के अनुकूल है।
- source_word: עֵינֵי רֹאִים
  choice: देखनेवालों की आँखें
  rationale: सम्बन्धसूचक रचना और substantival participle को स्वाभाविक हिन्दी में रखते हुए ‘द्रष्टाओं’ जैसे तकनीकी अर्थ से बचाया गया है।
- source_word: וְאָזְנֵי שֹׁמְעִים
  choice: और सुननेवालों के कान
  rationale: पहले खंड के समानान्तर इब्रानी संरचना और श्रवण-बिंब दोनों सुरक्षित रखे गए हैं।
- source_word: תִּקְשַׁבְנָה
  choice: ध्यान से सुनेंगे
  rationale: यह क्रिया केवल आवाज़ सुनने के बजाय ध्यानपूर्वक ग्रहण करने का भाव देती है; यह हिन्दी में संक्षिप्त और सहज है।
- source_word: וְ
  choice: तब / और
  rationale: पहला संयोजक पिछले संदर्भ से परिणामात्मक प्रवाह दिखाने के लिए ‘तब’ और दूसरा समानान्तर खंड जोड़ने के लिए ‘और’ किया गया है।
theological_decisions:
- issue: सुधरी हुई दृष्टि और श्रवण का स्वरूप
  choice: शारीरिक इंद्रियों की भाषा को ज्यों का त्यों रखते हुए नैतिक, आत्मिक और सामाजिक समझ की पुनर्स्थापना का संकेत खुला रखा गया है।
  alternative: इसे केवल शारीरिक चंगाई या केवल भविष्यद्वक्ताओं के विषय में स्पष्ट कर देना।
  rationale: यशायाह 32:1–4 का संदर्भ धर्मपूर्ण शासन और सुधरी हुई समझ से जुड़ा है। अनुवाद इंद्रिय-बिंब को बनाए रखता है और उसके शाब्दिक तथा रूपक दोनों आयामों में से किसी एक को अनावश्यक रूप से निर्णायक नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज है। ‘देखनेवालों’ और ‘सुननेवालों’ से मूल का समानान्तर विन्यास बना रहता है।
