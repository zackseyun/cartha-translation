source:
  edition: WLC
  text: עַד יֵ֨עָרֶ֥ה עָלֵ֛י/נוּ ר֖וּחַ מִ/מָּר֑וֹם וְ/הָיָ֤ה מִדְבָּר֙ לַ/כַּרְמֶ֔ל ו/כרמל לַ/יַּ֥עַר יֵחָשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/015.yaml
  text: until a spirit from on high is poured out on us[a], and the wilderness becomes a fruitful field[b], and the fruitful field is regarded as a forest.
translation:
  language: hi
  text: जब तक ऊपर से हम पर आत्मा उंडेला न जाए[a], और मरुभूमि उपजाऊ भूमि न बन जाए[b], और उपजाऊ भूमि वन न समझी जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऊपर से परमेश्वर की आत्मा”; इब्रानी רוּחַ का अर्थ “आत्मा” हो सकता है और इस प्रसंग में यह विशेष रूप से परमेश्वर की आत्मा को सूचित कर सकता है।
    reason: alternative_reading
  - marker: b
    text: “उपजाऊ भूमि” इब्रानी शब्द כַּרְמֶל का अनुवाद है, जिसका अर्थ उर्वर या जोती-बोई भूमि है; यहाँ संभवतः स्थान-नाम “कर्मेल” अभिप्रेत नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: जब तक
  rationale: यह पहले वर्णित दशा की समय-सीमा बताता है; नकारात्मक क्रियाओं के साथ ‘जब तक’ स्वाभाविक हिन्दी है।
- source_word: יֵעָרֶה
  choice: उंडेला न जाए
  rationale: निफ़अल रूप निष्क्रिय भाव और किसी द्रव्य को बहुलता से डालने की छवि व्यक्त करता है; ‘उंडेला जाए’ दोनों को बनाए रखता है।
- source_word: עָלֵינוּ
  choice: हम पर
  rationale: עַל का इस क्रिया के साथ सहज अर्थ ‘हम पर’ है।
- source_word: רוּחַ
  choice: आत्मा
  rationale: शब्द का अर्थ आत्मा, वायु या श्वास हो सकता है। यहाँ ऊपर से आने वाली परिवर्तनकारी शक्ति के कारण ‘आत्मा’ सर्वाधिक उपयुक्त है; हिन्दी में उपपद न होने से इसे अनावश्यक रूप से ‘एक’ या ‘पवित्र आत्मा’ नहीं बनाया गया।
- source_word: מִמָּרוֹם
  choice: ऊपर से
  rationale: מָרוֹם ऊँचाई अथवा उच्च स्थान को दर्शाता है; ‘ऊपर से’ सरल हिन्दी में स्वर्गीय ऊँचाई का संकेत बनाए रखता है।
- source_word: וְהָיָה
  choice: और ... न बन जाए
  rationale: रूप भावी परिणाम बताता है; ‘बन जाए’ परिवर्तन को स्पष्ट करता है और ‘जब तक’ वाले हिन्दी वाक्य-विन्यास में स्वाभाविक है।
- source_word: מִדְבָּר
  choice: मरुभूमि
  rationale: यह निर्जन, अकृषित भूभाग को दर्शाता है और उपजाऊ भूमि के साथ मूल विरोध को बनाए रखता है।
- source_word: לַכַּרְמֶל
  choice: उपजाऊ भूमि
  rationale: כַּרְמֶל यहाँ संभवतः स्थान-नाम कर्मेल नहीं, बल्कि उर्वर या जोती-बोई भूमि के अर्थ में जातिवाचक संज्ञा है।
- source_word: וְכַרְמֶל
  choice: और उपजाऊ भूमि
  rationale: पहली occurrence के समान जातिवाचक अर्थ और शब्दगत समानता बनाए रखी गई है।
- source_word: לַיַּעַר
  choice: वन
  rationale: יַעַר का सीधा अर्थ वन या जंगल है; ‘वन’ dignified और सामान्य आधुनिक हिन्दी है।
- source_word: יֵחָשֵׁב
  choice: न समझी जाए
  rationale: חשׁב के निफ़अल का अर्थ ‘माना/समझा जाना’ है; यह मूल के आकलन या गणना-संबंधी भाव को बनाए रखता है।
theological_decisions:
- issue: क्या רוּחַ का स्पष्ट अनुवाद ‘पवित्र आत्मा’ किया जाए
  choice: आत्मा
  alternative: ऊपर से आने वाला परमेश्वर का आत्मा / पवित्र आत्मा
  rationale: संदर्भ परमेश्वर की जीवनदायी, परिवर्तनकारी सक्रियता की ओर दृढ़ संकेत करता है, पर इब्रानी में न तो निश्चित उपपद है, न ‘पवित्र’ शब्द। मुख्य पाठ ‘आत्मा’ रखकर धार्मिक संकेत और मूल की अस्पष्टता दोनों सुरक्षित रखता है; अधिक विशिष्ट समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जब तक ... न जाए’ की आवृत्ति इब्रानी की भावी परिवर्तन-श्रृंखला को स्वाभाविक हिन्दी में बाँधती है। ‘आत्मा’ को बिना ‘एक’ के रखना हिन्दी में अधिक सहज है और इब्रानी की अनिश्चितता को धार्मिक रूप से अधिक स्पष्ट बनाए बिना सुरक्षित रखता है।
