base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/018.yaml
  text: And my people will dwell in a peaceful habitation[a], in secure dwellings[b], and in quiet resting places.
translation:
  language: hi
  text: और मेरी प्रजा शांतिपूर्ण निवास में[a], सुरक्षित निवास-स्थानों में, और निश्चिंत विश्राम-स्थलों में[b] रहेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शांति के निवास में।”
    reason: lexical_alternative
  - marker: b
    text: या, “निर्विघ्न विश्राम-स्थलों में,” अथवा “ऐसे विश्राम-स्थलों में जहाँ चैन हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשַׁב
  choice: और ... रहेगी
  rationale: ישׁב यहाँ बसने या रहने की स्थायी अवस्था बताता है; हिंदी में ‘रहेगी’ स्वाभाविक है और आरंभिक וְ को ‘और’ से रखा गया है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: עם पर प्रथम पुरुष एकवचन प्रत्यय का संबंधपरक अर्थ ‘मेरी प्रजा’ से स्पष्ट होता है; ‘राष्ट्र’ यहाँ अनावश्यक रूप से राजनीतिक अर्थ दे सकता है।
- source_word: בִּנְוֵה שָׁלוֹם
  choice: शांतिमय निवास में
  rationale: נוה यहाँ चरागाह की अपेक्षा निवास-स्थान सूचित करता है, और שׁלום शांति, कुशलता तथा समग्र कल्याण का भाव रखता है। ‘शांतिमय निवास’ इस संबंध को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: וּבְמִשְׁכְּנוֹת מִבְטַחִים
  choice: सुरक्षित घरों में
  rationale: משׁכנות सामान्य निवास-स्थानों को और מבטחים वस्तुगत सुरक्षा को सूचित करता है। ‘घर’ सामान्य पाठक के लिए स्वाभाविक है और इसमें अनावश्यक उपासना-संबंधी अर्थ नहीं आता।
- source_word: וּבִמְנוּחֹת שַׁאֲנַנּוֹת
  choice: और निश्चिंत विश्राम-स्थलों में
  rationale: מנוחות ठहरने या विश्राम करने के स्थान हैं; שׁאננות चैन, निर्विघ्नता और भयमुक्त सहजता का भाव देता है। ‘निश्चिंत’ इस शांत सुरक्षा को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: प्रतिज्ञा की पूर्ति का स्वरूप और समय
  choice: पद को परमेश्वर की प्रजा के लिए सामुदायिक शांति, सुरक्षा और निश्चिंत विश्राम की ठोस प्रतिज्ञा के रूप में रखा गया है, पर उसकी पूर्ति का समय निर्धारित नहीं किया गया।
  alternative: इसे केवल यहूदा की ऐतिहासिक पुनर्स्थापना या केवल भावी मसीही युग की प्रतिज्ञा के रूप में स्पष्ट करना।
  rationale: इस पद का इब्रानी पाठ शांतिपूर्ण निवास की प्रतिज्ञा करता है, लेकिन अपने आप में उसकी पूर्ति को केवल ऐतिहासिक, युगांतकारी या प्रतिरूपात्मक अर्थ तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और सामुदायिक भाषा रखी गई है। तीन समानांतर स्थान-वाचक पदबंधों को बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ या संप्रदायगत शब्दावली से बचा गया है।
