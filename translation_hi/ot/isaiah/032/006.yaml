id: ISA.32.6
reference: Isaiah 32:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י נָבָל֙ נְבָלָ֣ה יְדַבֵּ֔ר וְ/לִבּ֖/וֹ יַעֲשֶׂה אָ֑וֶן לַ/עֲשׂ֣וֹת חֹ֗נֶף וּ/לְ/דַבֵּ֤ר אֶל יְהוָה֙ תּוֹעָ֔ה לְ/הָרִיק֙ נֶ֣פֶשׁ רָעֵ֔ב וּ/מַשְׁקֶ֥ה צָמֵ֖א יַחְסִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/006.yaml
  text: 'For a fool speaks folly[a], and his heart devises iniquity: to practice godlessness and to speak error against Yahweh[c][b], to leave the hungry person empty and to withhold drink from the thirsty.'
translation:
  language: hi
  text: क्योंकि मूर्ख मूर्खता की बातें करता है, और उसका मन अधर्म रचता है—भक्तिहीन आचरण करने, याहवे के विरुद्ध भ्रामक बातें कहने[c], भूखे व्यक्ति[b] को खाली पेट रखने और प्यासे को पीने की वस्तु से वंचित करने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: या, “याहवे के विषय में झूठी बातें कहने।” इब्रानी वाक्यांश का अर्थ याहवे के विरुद्ध अथवा उनके विषय में भ्रमकारी असत्य कहना हो सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “भूखी נֶפֶשׁ को खाली करने।” यहाँ נֶפֶשׁ भूखे व्यक्ति, उसके प्राण, या उसकी भूख/लालसा को दर्शाता है; केवल किसी अभौतिक ‘आत्मा’ को नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָל / נְבָלָה
  choice: मूर्ख / मूर्खता
  rationale: यह शब्द-युग्म नैतिक रूप से विवेकहीन और नीच आचरण का बोध कराता है। ‘मूर्ख / मूर्खता’ मूल के शब्द-साम्य को बनाए रखता है; यहाँ केवल बौद्धिक कमी अभिप्रेत नहीं है।
- source_word: וְלִבּוֹ יַעֲשֶׂה אָוֶן
  choice: और उसका मन अधर्म रचता है
  rationale: לֵב व्यक्ति के भीतरी विचार और इच्छा-केंद्र को सूचित करता है, इसलिए आधुनिक हिन्दी में ‘मन’ स्वाभाविक है। ‘अधर्म रचता है’ बुराई को भीतर से उत्पन्न करने और उसे कार्यरूप देने की धारणा बनाए रखता है।
- source_word: חֹנֶף
  choice: भक्तिहीनता
  rationale: यशायाह में यह शब्द कपट तक सीमित न रहकर परमेश्वर-विरोधी अपवित्रता और दुष्टता को भी दर्शाता है। अगला वाक्यांश याहवे के विरुद्ध भ्रामक वाणी का उल्लेख करता है, इसलिए ‘भक्तिहीनता’ प्रसंगानुकूल है।
- source_word: אֶל יְהוָה תּוֹעָה
  choice: याहवे के विरुद्ध भ्रामक बातें
  rationale: תּוֹעָה में भटकाव, भूल और भ्रमकारी असत्य का भाव है। אֶל यहाँ वाणी के याहवे-विरोधी लक्ष्य या दिशा को व्यक्त कर सकता है; ‘विरुद्ध’ उस प्रतिकूलता को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले इब्रानी व्यक्तिगत नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: לְהָרִיק נֶפֶשׁ רָעֵב
  choice: भूखे व्यक्ति को खाली पेट रखना
  rationale: נֶפֶשׁ यहाँ संकीर्ण अर्थ में अमूर्त ‘आत्मा’ नहीं, बल्कि भूख से पीड़ित जीवित व्यक्ति को दर्शाता है। हिन्दी मुहावरा ‘खाली पेट रखना’ वास्तविक अभाव को स्पष्ट करता है।
- source_word: וּמַשְׁקֶה צָמֵא יַחְסִיר
  choice: प्यासे को पानी से वंचित करना
  rationale: मूल में पीने की वस्तु को प्यासे से रोकने या घटा देने का भाव है। प्रसंग में ‘पानी’ साधारण हिन्दी में सबसे स्वाभाविक और ठोस अभिव्यक्ति है।
theological_decisions:
- issue: חֹנֶף का नैतिक-धार्मिक अर्थ
  choice: भक्तिहीनता
  alternative: कपट
  rationale: शब्द परमेश्वर के विरुद्ध झूठी या भ्रमकारी वाणी और जरूरतमंदों के उत्पीड़न से जुड़ा है; इसलिए व्यापक धार्मिक दुष्टता को व्यक्त करने वाला विकल्प चुना गया है। संकीर्ण विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: נֶפֶשׁ का आशय
  choice: व्यक्ति
  alternative: प्राण; भूख/लालसा
  rationale: इस प्रसंग में देहधारी भूखा मनुष्य अभिप्रेत है। ‘आत्मा’ कहने से ऐसा द्वैतवादी अर्थ निकल सकता था जो इब्रानी में आवश्यक नहीं है।
- issue: אֶל יְהוָה के साथ תּוֹעָה की दिशा
  choice: याहवे के विरुद्ध भ्रामक बातें कहना
  alternative: याहवे के विषय में झूठी बातें कहना
  rationale: इब्रानी वाक्यांश भाषण को याहवे की ओर निर्देशित या उनके विषय में कहा गया मानने की गुंजाइश रखता है। मुख्य पाठ प्रसंग की विरोधी शक्ति को व्यक्त करता है और दूसरा संभव संबंध पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मूर्ख / मूर्खता’ से मूल शब्दालंकार सुरक्षित है। ‘मन’ हिन्दी में विचार और इच्छा के भीतरी केंद्र को स्वाभाविक रूप से व्यक्त करता है। सामाजिक अन्याय को ठोस बनाने के लिए ‘खाली पेट रखना’ और ‘पानी से वंचित करना’ प्रयुक्त हैं।
