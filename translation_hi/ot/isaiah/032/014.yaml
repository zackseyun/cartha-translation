source:
  edition: WLC
  text: כִּֽי אַרְמ֣וֹן נֻטָּ֔שׁ הֲמ֥וֹן עִ֖יר עֻזָּ֑ב עֹ֣פֶל וָ/בַ֜חַן הָיָ֨ה בְעַ֤ד מְעָרוֹת֙ עַד עוֹלָ֔ם מְשׂ֥וֹשׂ פְּרָאִ֖ים מִרְעֵ֥ה עֲדָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/014.yaml
  text: For the palace is abandoned[a], the crowded city is forsaken; Ophel and the watchtower have become caves forever, a joy for wild donkeys[c][b], a pasture for flocks.
translation:
  language: hi
  text: 'क्योंकि राजमहल त्याग दिया गया है,

    भीड़-भरा नगर छोड़ दिया गया है[a];

    ओपेल[b] और पहरे का बुर्ज

    सदा के लिए गुफाएँ बन गए हैं[c]—

    जंगली गधों का आनंदस्थल,

    और झुंडों का चरागाह।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “चहल-पहल वाला नगर” भी हो सकता है; इब्रानी पद में नगर की “भीड़” या “कोलाहल” का भाव है।
    reason: lexical_alternative
  - marker: b
    text: “ओपेल” एक स्थलनाम है; संभवतः यह यरूशलेम के किलेबंद पहाड़ी या ऊँचे भाग को सूचित करता है।
    reason: cultural_note
  - marker: c
    text: इसका अनुवाद “सदा के लिए मांदें बन गए हैं” भी हो सकता है; इब्रानी में उजड़े हुए किलेबंद स्थानों के पशुओं के बसेरे बन जाने पर बल हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְמוֹן
  choice: राजमहल
  rationale: यह शब्द राजकीय अथवा दुर्गनुमा प्रमुख भवन को सूचित करता है; प्रसंग में ‘राजमहल’ स्वाभाविक और स्पष्ट है।
- source_word: נֻטָּשׁ
  choice: त्याग दिया गया है
  rationale: निष्क्रिय रूप किसी स्थान को वीरान छोड़ दिए जाने का भाव देता है।
- source_word: הֲמוֹן עִיר
  choice: भीड़-भरा नगर
  rationale: शाब्दिक अर्थ नगर की भीड़, जनसमूह या कोलाहल से जुड़ा है; यह चयन आबाद और व्यस्त नगर की तस्वीर को संक्षेप में व्यक्त करता है।
- source_word: עֻזָּב
  choice: छोड़ दिया गया है
  rationale: यह निष्क्रिय क्रिया पहले उपवाक्य के समानांतर नगर के परित्याग को दर्शाती है, जबकि हिन्दी में अनावश्यक शब्द-पुनरावृत्ति से बचती है।
- source_word: עֹפֶל
  choice: ओपेल
  rationale: यहाँ इसे यरूशलेम से जुड़े स्थलनाम के रूप में लिया गया है, इसलिए इसका अर्थानुवाद करने के बजाय लिप्यंतरण किया गया है।
- source_word: בַּחַן
  choice: पहरे का बुर्ज
  rationale: यह संभवतः निगरानी या पहरे के लिए बने बुर्ज को दर्शाता है; यह पद दुर्ग-संबंधी प्रसंग में स्पष्ट है।
- source_word: הָיָה בְעַד מְעָרוֹת
  choice: गुफाएँ बन गए हैं
  rationale: वाक्यांश को उजड़े हुए दुर्गस्थलों के गुफा-सदृश पशु-आश्रय बन जाने के अर्थ में लिया गया है; संयुक्त कर्ता के कारण हिन्दी में बहुवचन स्वाभाविक है।
- source_word: עַד עוֹלָם
  choice: सदा के लिए
  rationale: यह दीर्घस्थायी अवधि बताने वाला सामान्य इब्रानी मुहावरा है; भविष्यवाणी के न्याय-वर्णन में ‘सदा के लिए’ उसका सीधा समतुल्य है।
- source_word: מְשׂוֹשׂ פְּרָאִים
  choice: जंगली गधों के आनंद की जगह
  rationale: मूल में वह स्थान बताया गया है जिसमें जंगली गधे आनंद पाते हैं; ‘जगह’ जोड़ने से हिन्दी में संबंध स्पष्ट और सहज होता है।
- source_word: מִרְעֵה עֲדָרִים
  choice: झुंडों की चरागाह
  rationale: यह पशुओं के झुंडों के चरने की भूमि का सीधा और प्रचलित हिन्दी रूप है।
