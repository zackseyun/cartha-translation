source:
  edition: WLC
  text: כִּֽי תָנ֥וּחַ יַד יְהוָ֖ה בָּ/הָ֣ר הַ/זֶּ֑ה וְ/נָ֤דוֹשׁ מוֹאָב֙ תַּחְתָּ֔י/ו כְּ/הִדּ֥וּשׁ מַתְבֵּ֖ן ב/מי מַדְמֵנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/010.yaml
  text: For the hand of Yahweh will rest on this mountain[a], and Moab will be trampled down in its place[b], as straw is trampled down in the water of a dung pit.
translation:
  language: hi
  text: क्योंकि इस पर्वत पर यहोवा का हाथ ठहरा रहेगा, और मोआब उसके नीचे[a] ऐसे रौंदा जाएगा, जैसे भूसा गोबर के गड्ढे के पानी में रौंदा जाता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके नीचे।” इब्रानी सर्वनाम का पूर्वपद निश्चित नहीं है; इसे “उसके तले” या, संदर्भानुसार, “अपने ही स्थान पर” भी समझा गया है।
    reason: alternative_reading
  - marker: b
    text: “गोबर का गड्ढा” का अर्थ “खाद का ढेर,” “खाद का स्थान,” या “गोबर/मल से जुड़ा स्थान” भी हो सकता है; इब्रानी शब्द का सटीक संकेत अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह शब्द पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में “क्योंकि” इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תָנוּחַ
  choice: ठहरा रहेगा
  rationale: नוח का मूल बिंब हाथ के टिकने या ठहरने का है; “ठहरा रहेगा” स्थिर और जारी रहने वाली उपस्थिति या सामर्थ्य को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: יַד יְהוָה
  choice: यहोवा का हाथ
  rationale: ईश्वरीय सामर्थ्य और कार्य के इब्रानी रूपक “हाथ” को ज्यों का त्यों रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को आधुनिक हिन्दी में प्रचलित रूप “यहोवा” से व्यक्त किया गया है।
- source_word: בָּהָר הַזֶּה
  choice: इस पर्वत पर
  rationale: स्थानवाचक अर्थ स्पष्ट और स्वाभाविक है; प्रसंग में यह पहले उल्लिखित पर्वत की ओर संकेत करता है।
- source_word: וְנָדוֹשׁ
  choice: और ... रौंदा जाएगा
  rationale: דושׁ का अर्थ रौंदना या दाँवना है। यहाँ अपमानजनक कुचले जाने का दृश्य प्रमुख है; “रौंदा” अगले उपमान में उसी धातु की पुनरावृत्ति भी सुरक्षित रखता है।
- source_word: מוֹאָב
  choice: मोआब
  rationale: राष्ट्र के नाम का मानक हिन्दी लिप्यंतरण।
- source_word: תַּחְתָּיו
  choice: उसके नीचे
  rationale: पुल्लिंग एकवचन प्रत्यय का निकट-शाब्दिक रूप रखा गया है, जबकि उसका पूर्वपद अनिश्चित है; इस अस्पष्टता को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: כְּהִדּוּשׁ
  choice: ऐसे रौंदा जाएगा, जैसे ... रौंदा जाता है
  rationale: पहले प्रयुक्त דושׁ धातु के साथ शब्दगत समानता और तुलना दोनों को सुरक्षित रखा गया है।
- source_word: מַתְבֵּן
  choice: भूसा
  rationale: यह पशु-चारे में प्रयुक्त सूखे तिनकों या कटे पुआल को दर्शाता है; “भूसा” सामान्य हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: בְּמֵי
  choice: के पानी में
  rationale: यह रौंदे जाने के स्थान या माध्यम को बताता है; हिन्दी में यह रचना सहज है।
- source_word: מַדְמֵנָה
  choice: खाद का गड्ढा
  rationale: शब्द गोबर या खाद से जुड़े दुर्गंधयुक्त स्थान को सूचित करता है। “खाद का गड्ढा” चित्र की कठोरता बनाए रखते हुए सामान्य पाठक के लिए बोधगम्य है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में विशिष्ट ईश्वरीय नाम है, इसलिए सामान्य उपाधि “प्रभु” के स्थान पर उसका हिन्दी में व्यापक रूप से पहचाना जाने वाला नामरूप रखा गया है।
- issue: תַּחְתָּיו में सर्वनाम का संदर्भ
  choice: उसके नीचे
  alternative: अपने ही स्थान पर / उसके तले
  rationale: इब्रानी प्रत्यय पुल्लिंग एकवचन है, पर उसका निश्चित पूर्वपद स्पष्ट नहीं है। मुख्य पाठ निकट-शाब्दिक सर्वनाम रखता है और पादटिप्पणी वास्तविक अनिश्चितता बताती है, ताकि किसी एक व्याख्या को चुपचाप निर्णायक न बनाया जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। “हाथ” और दो बार प्रयुक्त “रौंदना” मूल के ठोस रूपक और शब्द-पुनरावृत्ति को सुरक्षित रखते हैं। दोनों पादटिप्पणी-चिह्न संबंधित पदों के ठीक बाद मुख्य पाठ में दिए गए हैं।
