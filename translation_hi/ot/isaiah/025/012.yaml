lexical_decisions:
- source_word: וּמִבְצַר מִשְׂגַּב חוֹמֹתֶיךָ
  choice: और तेरी दीवारों की किलाबंद ऊँचाई
  rationale: संक्षिप्त इब्रानी संबंध-श्रृंखला में दुर्ग और सुरक्षित ऊँचाई—दोनों भाव जुड़े हैं। यह हिंदी रूप सैन्य सुरक्षा और ऊँचाई दोनों को बनाए रखते हुए स्वाभाविक है।
- source_word: חוֹמֹתֶיךָ
  choice: तेरी दीवारों
  rationale: द्वितीय पुरुष एकवचन प्रत्यय को सीधे रखा गया है; संदर्भ में संबोधित नगर के लिए ‘तेरी’ स्वाभाविक और स्पष्ट है।
- source_word: הֵשַׁח
