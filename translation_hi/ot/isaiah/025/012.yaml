  rationale: हिफ़ील रूप किसी ऊँची वस्तु को नीचे करने का कारण बताता है। ‘गिरा दिया’ विनाश के संदर्भ में सहज है।
- source_word: הִשְׁפִּיל
  choice: नीचा कर दिया है
  rationale: यह पहले क्रियापद के नीचे लाने के भाव को समानांतर रूप से प्रबल करता है, बिना इसे केवल नैतिक ‘दीन करने’ के अर्थ तक सीमित किए।
- source_word: הִגִּיעַ לָאָרֶץ
  choice: भूमि पर ... पहुँचा दिया है
  rationale: मूल क्रिया का शाब्दिक कारणवाचक भाव ‘पहुँचा देना’ सुरक्षित रखा गया है; ढही हुई दीवारों के भूमि तक आने का चित्र स्पष्ट है।
- source_word: עַד עָפָר
  choice: धूल तक
  rationale: ‘तक’ मूल עַד की सीमा और पूर्ण पतन की तीव्रता को संक्षेप में व्यक्त करता है।
