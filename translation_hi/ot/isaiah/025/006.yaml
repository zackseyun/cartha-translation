language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עָשָׂה֩ יְהוָ֨ה צְבָא֜וֹת לְ/כָל הָֽ/עַמִּים֙ בָּ/הָ֣ר הַ/זֶּ֔ה מִשְׁתֵּ֥ה שְׁמָנִ֖ים מִשְׁתֵּ֣ה שְׁמָרִ֑ים שְׁמָנִים֙ מְמֻ֣חָיִ֔ם שְׁמָרִ֖ים מְזֻקָּקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/006.yaml
  text: And Yahweh of Armies will make on this mountain for all the peoples a feast of rich food[a], a feast of aged wine—rich food full of marrow, aged wine well refined.
translation:
  language: hi
  text: और सेनाओं का याहवे इस पर्वत पर सभी लोगों के लिए बढ़िया भोजन की दावत और तलछट पर परिपक्व की गई दाखमधु की दावत तैयार करेगा—मज्जा से भरपूर बढ़िया भोजन और अच्छी तरह छानी हुई दाखमधु।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשָׂה
  choice: और ... तैयार करेगा
  rationale: עשה का मूल अर्थ ‘करना/बनाना’ है; दावत के प्रसंग में ‘तैयार करेगा’ स्वाभाविक हिन्दी है और भावी क्रिया को स्पष्ट रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: व्यक्तिगत दिव्य नाम को ‘याहवे’ के रूप में रखा गया है और צבאות का पारदर्शी अनुवाद ‘सेनाओं’ किया गया है।
- source_word: לְכָל הָעַמִּים
  choice: सब जाति-जाति के लोगों के लिए
  rationale: यह अभिव्यक्ति עמים के बहुवचन और अलग-अलग जनसमूहों की सामूहिक व्यापकता को सहज हिन्दी में बनाए रखती है।
- source_word: בָּהָר הַזֶּה
  choice: इस पर्वत पर
  rationale: स्थान और संकेतवाचक ‘इस’ दोनों को सीधे और स्वाभाविक रूप से रखा गया है।
- source_word: מִשְׁתֵּה
  choice: दावत
  rationale: यह शब्द भोजन और दाखमधु सहित उत्सवी भोज को व्यक्त करता है और दोनों समानांतर पदों में स्वाभाविक बैठता है।
- source_word: שְׁמָנִים
  choice: उत्तम पकवान
  rationale: शाब्दिक ‘चिकनी/वसायुक्त वस्तुएँ’ समृद्ध और बहुमूल्य भोजन का मुहावरा है; ‘उत्तम पकवान’ आधुनिक पाठक को उसका सकारात्मक आशय देता है, जबकि शाब्दिक बिंब पादटिप्पणी में सुरक्षित है।
- source_word: שְׁמָרִים
  choice: तलछट पर पकी दाखमधु
  rationale: शब्द मूलतः तलछट को दर्शाता है; प्रसंग में आशय उस दाखमधु से है जिसे स्वाद विकसित होने के लिए तलछट पर रहने दिया गया हो। अनुवाद सकारात्मक भोज-बिंब और मूल दृश्य, दोनों रखता है।
- source_word: מְמֻחָיִם
  choice: गूदे से भरपूर
  rationale: यह उत्तम, मज्जा-भरे अंशों का सजीव बिंब बनाए रखता है; ‘गूदा’ सामान्य हिन्दी में हड्डी के भीतर की मज्जा के लिए समझ में आने वाला शब्द है।
- source_word: מְזֻקָּקִים
  choice: अच्छी तरह छानी हुई
  rationale: दाखमधु के विषय में यह शोधन या छानकर साफ करने की प्रक्रिया को ठोस और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दावत का सार्वभौमिक विस्तार
  choice: सब जाति-जाति के लोगों के लिए
  alternative: सब राष्ट्रों के लिए
  rationale: बहुवचन עמים को अलग-अलग जनसमूहों के रूप में रखा गया है। इससे इस पद में इस्राएल से परे व्यापक दायरा स्पष्ट होता है, पर किसी बाद की विकसित धर्मवैज्ञानिक व्यवस्था को इसमें नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली अपनाई गई है। ‘दाखमधु’ और ‘याहवे’ जैसे पद मूल सांस्कृतिक तथा नामगत विशिष्टता बनाए रखते हैं; वाक्य का समानांतर भोज-काव्य भी सुरक्षित है।
