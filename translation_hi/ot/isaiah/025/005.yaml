id: ISA.25.5
reference: Isaiah 25:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כְּ/חֹ֣רֶב בְּ/צָי֔וֹן שְׁא֥וֹן זָרִ֖ים תַּכְנִ֑יעַ חֹ֚רֶב בְּ/צֵ֣ל עָ֔ב זְמִ֥יר עָֽרִיצִ֖ים יַעֲנֶֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/005.yaml
  text: Like heat in a dry land[a], you subdue the uproar of strangers; like heat by the shadow of a cloud[b], the song of the ruthless is brought low.
translation:
  language: hi
  text: जैसे सूखे प्रदेश में तपिश होती है, वैसे ही तू परदेशियों[a] का कोलाहल दबा देता है; जैसे घने बादल की छाया में तपिश मंद पड़ती है, वैसे ही निर्दयी लोगों का गीत मंद पड़ जाता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विदेशियों” अथवा “अजनबियों।”
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “निर्दयी लोगों का गीत दबा दिया जाता है” या “नीचा किया जाता है” भी हो सकता है। इब्रानी क्रिया का अर्थ “उत्तर देता है” भी हो सकता है, पर यहाँ समानांतर पंक्ति किसी चीज़ के दबने या मंद पड़ने का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּחֹרֶב בְּצָיוֹן
  choice: जैसे सूखे प्रदेश की तपिश
  rationale: חֹרֶב गर्मी अथवा सूखे की तीव्रता और צָיוֹן शुष्क स्थान को दर्शाता है। यह चुनाव बादल की छाया वाले समानांतर बिंब को स्पष्ट और स्वाभाविक हिंदी में बनाए रखता है।
- source_word: שְׁאוֹן
  choice: कोलाहल
  rationale: यह शब्द ऊँची, अशांत और शत्रुतापूर्ण ध्वनि या हलचल को व्यक्त करता है; ‘कोलाहल’ काव्यात्मक और सहज दोनों है।
- source_word: זָרִים
  choice: परदेशियों
  rationale: זָרִים का अर्थ बाहरी, पराया या विदेशी लोग हो सकता है। ‘परदेशियों’ से बाहरी लोगों का भाव आता है, पर उनकी पहचान आवश्यकता से अधिक निश्चित नहीं की जाती।
- source_word: תַּכְנִיעַ
  choice: तू ... दबा देता है
  rationale: כנע के हिफ़ील रूप का अर्थ नीचा करना, वश में करना या दबाना है। निकटवर्ती प्रसंग में संबोधन परमेश्वर से है, इसलिए द्वितीय पुरुष एकवचन रखा गया है।
- source_word: בְּצֵל עָב
  choice: बादल की छाया
  rationale: צֵל छाया और עָב घने बादल को सूचित करता है। हिंदी में यह पद तपिश कम होने के साधन का स्वाभाविक चित्र प्रस्तुत करता है।
- source_word: זְמִיר
  choice: गीत
  rationale: זְמִיר का मूल अर्थ गीत है; प्रसंग में यह निर्दयी लोगों के विजय-गीत या डींगभरे गान की ओर संकेत कर सकता है, पर मूल पाठ की संक्षिप्तता बनाए रखी गई है।
- source_word: עָרִיצִים
  choice: निर्दयी लोगों
  rationale: עָרִיץ हिंसक, कठोर अथवा अत्याचारी व्यक्ति को दर्शाता है। ‘निर्दयी’ यशायाह के प्रसंग में व्यापक अर्थ को सुरक्षित रखता है।
- source_word: יַעֲנֶה
  choice: मंद पड़ जाता है
  rationale: यह कठिन क्रियारूप यहाँ समानांतर पंक्ति में गीत के दबने या नीचा किए जाने का भाव देता है। ‘मंद पड़ जाता है’ ध्वनि-बिंब के साथ स्वाभाविक है और किसी स्पष्ट कर्ता को अनावश्यक रूप से नहीं जोड़ता।
theological_decisions:
- issue: दिव्य संबोधन और अंतिम पंक्ति का कर्ता
  choice: पहली क्रिया में परमेश्वर को सीधे ‘तू’ कहकर संबोधित किया गया है, जबकि अंतिम क्रिया में गीत को व्याकरणिक कर्ता रखते हुए ‘मंद पड़ जाता है’ कहा गया है।
  alternative: दोनों पंक्तियों में परमेश्वर को स्पष्ट कर्ता बनाकर ‘तू ... दबा देता है’ कहना।
  rationale: תַּכְנִיעַ स्पष्ट रूप से द्वितीय पुरुष एकवचन है, पर יַעֲנֶה तृतीय पुरुष एकवचन है और זְמִיר उसका संभावित कर्ता है। इस भेद को बनाए रखने से मूल की काव्यात्मक और व्याकरणिक तनाव सुरक्षित रहता है।
- issue: יַעֲנֶה का अर्थ
  choice: दबने अथवा शांत होने के अर्थ में ‘मंद पड़ जाता है’।
  alternative: शाब्दिक संभाव्यता के अनुसार ‘उत्तर देता है’।
  rationale: ‘परदेशियों का कोलाहल दबाने’ वाली समानांतर पंक्ति और बादल से तपिश घटने का बिंब गीत के शांत या नीचा होने का समर्थन करते हैं; फिर भी वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। तपिश, बादल की छाया, कोलाहल और गीत के बिंब साधारण पाठक के लिए स्पष्ट किए गए हैं; ‘तू’ बाइबिलीय दिव्य संबोधन की एकवचन निकटता और मूल व्याकरण को सुरक्षित रखता है।
