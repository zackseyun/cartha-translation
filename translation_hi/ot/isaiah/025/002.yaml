source:
  edition: WLC
  text: כִּ֣י שַׂ֤מְתָּ מֵ/עִיר֙ לַ/גָּ֔ל קִרְיָ֥ה בְצוּרָ֖ה לְ/מַפֵּלָ֑ה אַרְמ֤וֹן זָרִים֙ מֵ/עִ֔יר לְ/עוֹלָ֖ם לֹ֥א יִבָּנֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/002.yaml
  text: For you have made the city a heap[a], the fortified town a ruin; the palace of foreigners is no city[b], it will never be rebuilt.
translation:
  language: hi
  text: क्योंकि तूने नगर को मलबे का ढेर बना दिया, किलाबंद नगर को खंडहर; परदेशियों का महल नगर नहीं रहा[a]। वह फिर कभी नहीं बनाया जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वाक्यांश बहुत संक्षिप्त है। इसका अर्थ यह भी हो सकता है, “परदेशियों का गढ़ अब नगर नहीं रहा।”
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “सदा तक वह नहीं बनाया जाएगा”; विनाश के इस प्रसंग में आशय है कि उसका फिर कभी पुनर्निर्माण नहीं होगा।'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמְתָּ
  choice: बना दिया
  rationale: שׂוּם का मूल अर्थ ‘रखना/ठहराना’ है, पर यहाँ परिणाम बताने वाली रचना में इसका स्वाभाविक अर्थ ‘बना देना’ है।
- source_word: מֵעִיר לַגָּל
  choice: नगर को मलबे का ढेर
  rationale: מִן…לְ की रचना एक अवस्था से दूसरी अवस्था में बदलने का भाव देती है। גַּל पत्थरों या उजड़े अवशेषों के ढेर का चित्र प्रस्तुत करता है; ‘मलबे का ढेर’ आधुनिक हिन्दी में इसे स्पष्ट करता है।
- source_word: קִרְיָה בְצוּרָה
  choice: किलाबंद नगर
  rationale: קִרְיָה नगर का समानार्थी है और בְצוּרָה सुदृढ़ किलेबंदी का बोध कराता है। ‘किलाबंद नगर’ सहज और सटीक है।
- source_word: לְמַפֵּלָה
  choice: खंडहर
  rationale: מַפֵּלָה पतन, ढहने या उजाड़ दशा को सूचित करता है। नगर के संदर्भ में ‘खंडहर’ परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַרְמוֹן זָרִים
  choice: परदेशियों के महल
  rationale: אַרְמוֹן महल या किलेनुमा राजनिवास हो सकता है और זָרִים बाहरी/परदेशी लोगों को दर्शाता है। ‘परदेशियों के महल’ संबंध को बिना अतिरिक्त व्याख्या के रखता है।
- source_word: מֵעִיר
  choice: नगर न रहने दिया
  rationale: यह संक्षिप्त और कुछ अस्पष्ट वाक्यांश संभवतः नगर की दशा या हैसियत समाप्त होने का भाव देता है। हिन्दी में ‘नगर न रहने दिया’ उस परिवर्तन को व्यक्त करता है, जबकि पादटिप्पणी मूल की संक्षिप्तता बताती है।
- source_word: לְעוֹלָם לֹא יִבָּנֶה
  choice: फिर कभी नहीं बनाया जाएगा
  rationale: नकार के साथ לְעוֹלָם का अर्थ ‘कभी नहीं’ है। נִבְנֶה निष्क्रिय रूप है; विनाश के प्रसंग में हिन्दी का ‘फिर कभी नहीं बनाया जाएगा’ पुनर्निर्माण का निहित भाव स्वाभाविक रूप से देता है।
