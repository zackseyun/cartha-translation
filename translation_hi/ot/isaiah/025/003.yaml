  edition: WLC
  text: עַל כֵּ֖ן יְכַבְּד֣וּ/ךָ עַם עָ֑ז קִרְיַ֛ת גּוֹיִ֥ם עָרִיצִ֖ים יִירָאֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/003.yaml
  text: Therefore a strong people will honor you[c][b][a]; a city of ruthless nations will fear you.
translation:
  language: hi
  text: इसलिए एक शक्तिशाली जाति[a] आपका आदर करेगी; क्रूर राष्ट्रों का नगर[b] आपसे डरेगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एक बलवान जाति।’ इब्रानी विशेषण शक्ति, सामर्थ्य या उग्रता का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘क्रूर जातियों का नगर।’ इब्रानी संबंध-पदबंध संक्षिप्त है और क्रूर राष्ट्रों से संबंधित या उनकी विशेषता वाले नगर का वर्णन कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘आपके प्रति श्रद्धामिश्रित भय रखेगा’ अथवा ‘आपके सामने विस्मय और भय से भर जाएगा।’ प्रसंग के अनुसार इब्रानी क्रिया भय, श्रद्धा या विस्मय-युक्त भय व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पद पिछले वर्णन से निकलने वाले परिणाम को बताता है; ‘इसलिए’ उस तार्किक संबंध को सहज और संक्षिप्त रूप में रखता है।
- source_word: יְכַבְּדוּךָ
  choice: आपका आदर करेगी
  rationale: पिएल रूप में כבד का अर्थ आदर या महिमा देना है। ‘आदर करेगी’ समानांतर क्रिया ‘डरेगा’ के साथ स्वाभाविक है और अनावश्यक रूप से उपासना का विशिष्ट अर्थ नहीं जोड़ता।
- source_word: עַם עָז
  choice: एक शक्तिशाली जाति
  rationale: עָז शक्ति, सामर्थ्य या उग्रता का बोध करा सकता है। ‘शक्तिशाली’ व्यापक अर्थ को बनाए रखता है और हिंसकता को आवश्यकता से अधिक नहीं उभारता।
- source_word: קִרְיַת גּוֹיִם עָרִיצִים
  choice: क्रूर राष्ट्रों का नगर
  rationale: इब्रानी संबंध-पदबंध संक्षिप्त और कुछ हद तक अस्पष्ट है। यह क्रूर राष्ट्रों से संबंधित या उनकी विशेषता वाला नगर हो सकता है। यह अनुवाद उस बिंब और अस्पष्टता को यथासंभव बनाए रखता है।
- source_word: יִירָאוּךָ
  choice: आपसे डरेगा
  rationale: ירא भय, श्रद्धा या विस्मय व्यक्त कर सकता है। न्याय और परमेश्वर की सामर्थ्य की पहचान के प्रसंग में ‘डरेगा’ मूल की सीधी तीव्रता बनाए रखता है, जबकि श्रद्धामिश्रित भय की संभावना को बंद नहीं करता।
theological_decisions:
- issue: परमेश्वर के प्रति शक्तिशाली और क्रूर लोगों की प्रतिक्रिया का स्वरूप
  choice: पद यह कहता है कि वे परमेश्वर का आदर करेंगे और उससे डरेंगे, पर यह निर्धारित नहीं करता कि यह स्वेच्छापूर्ण आराधना है, न्याय के बाद विवश अधीनता है, या दोनों का मिश्रण।
  alternative: इसे या तो राष्ट्रों का सच्ची आराधना की ओर फिरना, या केवल दंड के भय से समर्पण मानना।
  rationale: ‘आदर करना’ और ‘डरना’ दोनों परमेश्वर की सामर्थ्य को पहचानने से उपजी श्रद्धा या भय को व्यक्त कर सकते हैं; मूल पाठ उनकी भीतरी मनोदशा स्पष्ट नहीं करता, इसलिए अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक वाक्य-विन्यास रखा गया है। परमेश्वर के लिए आदरसूचक ‘आप’ का प्रयोग किया गया है। ‘जाति’ और ‘राष्ट्र’ द्वारा עַם और גּוֹיִם का भेद यथासंभव बनाए रखा गया है।
