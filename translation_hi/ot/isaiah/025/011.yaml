source:
  edition: WLC
  text: וּ/פֵרַ֤שׂ יָדָי/ו֙ בְּ/קִרְבּ֔/וֹ כַּ/אֲשֶׁ֛ר יְפָרֵ֥שׂ הַ/שֹּׂחֶ֖ה לִ/שְׂח֑וֹת וְ/הִשְׁפִּיל֙ גַּֽאֲוָת֔/וֹ עִ֖ם אָרְבּ֥וֹת יָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/011.yaml
  text: And he will spread out his hands in its midst as a swimmer spreads them out to swim[a], and he will bring down his pride along with the skill of his hands.
translation:
  language: hi
  text: और वह उसके भीतर अपने हाथ फैलाएगा, जैसे तैराक तैरने के लिए अपने हाथ फैलाता है; और वह उसके घमंड को उसके हाथों की चतुराई के साथ नीचा कर देगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसके हाथों की चतुराई’ का अर्थ ‘उसके हाथों की धूर्त चालें’ या ‘उसके हाथों की युक्तियाँ’ भी हो सकता है। इब्रानी पद कठिन है और संभवतः सामान्य कौशल के बजाय कपटपूर्ण उपायों की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפֵרַשׂ יָדָיו
  choice: अपने हाथ फैलाएगा
  rationale: פרשׂ का सामान्य अर्थ ‘फैलाना’ या ‘पसारना’ है। तैरने के बिंब में ‘हाथ फैलाना’ स्वाभाविक भी है और इब्रानी की शारीरिक छवि को बनाए रखता है।
- source_word: בְּקִרְבּוֹ
  choice: उसके बीच
  rationale: पुल्लिंग एकवचन प्रत्यय पिछले संदर्भ के मोआब की ओर संकेत करता है। पद में नाम जोड़कर अर्थ को आवश्यकता से अधिक स्पष्ट करने के बजाय सर्वनामात्मक रूप रखा गया है।
- source_word: כַּאֲשֶׁר יְפָרֵשׂ הַשֹּׂחֶה לִשְׂחוֹת
  choice: जैसे तैराक तैरने के लिए अपने हाथ फैलाता है
  rationale: הַשֹּׂחֶה संज्ञात्मक कृदन्त है, अर्थात ‘तैराक’ या ‘तैरने वाला’; לִשְׂחוֹת उद्देश्य या क्रिया को व्यक्त करता है। हिंदी में स्वाभाविकता के लिए ‘अपने हाथ’ दोहराया गया है।
- source_word: וְהִשְׁפִּיל
  choice: नीचा कर देगा
  rationale: שׁפל के हिफ़ील रूप का अर्थ ‘नीचा करना’ या ‘गिरा देना’ है। यह न्याय की ठोस छवि बनाए रखता है और केवल भीतरी नम्रता का भाव नहीं देता।
- source_word: גַּאֲוָתוֹ
  choice: उसके घमण्ड को
  rationale: इस न्याय-संदर्भ में संज्ञा नकारात्मक ऊँचाई, अभिमान या घमण्ड को व्यक्त करती है। ‘घमण्ड’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: עִם אָרְבוֹת יָדָיו
  choice: उसके हाथों की चतुराई समेत
  rationale: אָרְבוֹת एक कठिन और विवादित पद है, जो कुशल युक्तियों, चालों या उपकरणों की ओर संकेत कर सकता है। ‘हाथों की चतुराई’ मानव कौशल और उसकी संभावित धूर्तता, दोनों के लिए कुछ गुंजाइश छोड़ती है; अन्य अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: पद के एकवचन सर्वनामों का संकेत
  choice: ‘वह/उसके’ रखकर मोआब को एक व्यक्ति के रूप में चित्रित किया गया है।
  alternative: इसे सामूहिक अर्थ में मोआब के लोगों के लिए समझा जा सकता है।
  rationale: इब्रानी में रूप एकवचन हैं और भविष्यद्वाणी की कविता में राष्ट्र का एक व्यक्ति के रूप में चित्रण सामान्य है। एकवचन बनाए रखने से मूल बिंब सुरक्षित रहता है।
- issue: אָרְבוֹת יָדָיו का अर्थ
  choice: मुख्य पाठ में ‘उसके हाथों की चतुराई’ रखा गया है।
  alternative: ‘उसके हाथों की धूर्त चालें,’ ‘उसके हाथों की युक्तियाँ,’ या अधिक शाब्दिक रूप में ‘उसके हाथों के घात।’
  rationale: शब्द का अर्थ अनिश्चित है। मुख्य पाठ पठनीय रहते हुए अस्पष्टता का कुछ अंश बनाए रखता है, और अधिक नकारात्मक या शाब्दिक संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। राष्ट्र के मानवीकरण, तैराक के सजीव बिंब और अंतिम इब्रानी पद की वास्तविक अनिश्चितता को बनाए रखा गया है।
