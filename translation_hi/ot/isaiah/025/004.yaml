  yaml_path: translation/ot/isaiah/025/004.yaml
  text: For you have been a stronghold to the poor[a], a stronghold to the needy in his distress, a refuge from the storm, a shade from the heat[b]; for the breath of the ruthless is like a storm against a wall.
translation:
  language: hi
  text: क्योंकि तू दीन के लिए गढ़ और ज़रूरतमंद के संकट के समय उसके लिए गढ़ रहा है; तू आँधी से आश्रय और झुलसाती गर्मी से छाया रहा है। क्योंकि निर्दयों का झोंका[a] दीवार से टकराने वाली आँधी[b] के समान है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निर्दयों की साँस” अथवा “निर्दयों की हवा”; इब्रानी רוּחַ का अर्थ प्रसंग के अनुसार “साँस,” “हवा” या “झोंका” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “दीवार पर पड़ती मूसलाधार वर्षा” अथवा “दीवार को पीटती आँधी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעוֹז
  choice: गढ़
  rationale: यह सुरक्षा और प्रतिरक्षा के दृढ़ स्थान का बोध कराता है। इब्रानी की बलाघाती पुनरावृत्ति को दोनों बार बनाए रखा गया है।
- source_word: דָּל
  choice: दीन
  rationale: यह सामाजिक रूप से दुर्बल और अभावग्रस्त व्यक्ति को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: אֶבְיוֹן
  choice: ज़रूरतमंद
  rationale: यह דָּל से अर्थगत निकटता रखते हुए भी उससे भेद बनाए रखता है और अभाव में पड़े व्यक्ति को दर्शाता है।
- source_word: בַּצַּר לוֹ
  choice: संकट में पड़े
  rationale: यह तीसरे पुरुष के संकट की अवस्था को सहज हिन्दी में व्यक्त करता है, बिना संकट का स्वरूप अधिक निश्चित किए।
- source_word: מַחְסֶה
  choice: शरण
  rationale: यह रक्षणकारी आश्रय का अर्थ देता है और מָעוֹז के लिए प्रयुक्त ‘गढ़’ से उचित भिन्नता बनाए रखता है।
- source_word: זֶרֶם
  choice: आँधी
  rationale: काव्यात्मक प्रसंग में यह प्रचंड मौसम और उसके विनाशकारी प्रहार को स्वाभाविक ढंग से व्यक्त करता है; अंतिम प्रयोग की संभावित वर्षा-धारा वाली छवि पादटिप्पणी में दी गई है।
- source_word: צֵל
  choice: छाया
  rationale: गर्मी से मिलने वाली लाभकारी सुरक्षा के लिए यह सामान्य और स्पष्ट हिन्दी शब्द है।
- source_word: חֹרֶב
  choice: झुलसाती गर्मी
  rationale: छाया के साथ विरोध में यहाँ सूखे की अपेक्षा तीखी, जलाने वाली गर्मी अभिप्रेत है।
- source_word: רוּחַ
  choice: झोंका
  rationale: यहाँ शब्द निर्दयों की हिंसक और प्रबल चढ़ाई की मौसम-संबंधी उपमा में आता है। ‘झोंका’ साँस और हवा के बीच की छवि को हिन्दी में प्रभावी रूप से रखता है।
- source_word: עָרִיצִים
  choice: निर्दयों
  rationale: यह उत्पीड़क और हिंसक लोगों को दर्शाता है, पर उन्हें अनावश्यक रूप से केवल राजनीतिक शासक नहीं ठहराता।
- source_word: קִיר
  choice: दीवार
  rationale: यह इब्रानी शब्द का सीधा अर्थ है और आँधी के प्रहार की ठोस छवि बनाए रखता है।
theological_decisions:
- issue: परमेश्वर की सुरक्षा का रूपकात्मक चित्रण
  choice: ‘गढ़,’ ‘शरण’ और ‘छाया’ जैसे ठोस सुरक्षा-रूपकों को यथावत रखा गया है।
  alternative: इन्हें आत्मिक सांत्वना या उद्धार की स्पष्ट व्याख्यात्मक भाषा में विस्तृत करना।
  rationale: पद असुरक्षित लोगों के प्रति परमेश्वर की देखभाल को भौतिक सुरक्षा की काव्यात्मक छवियों से व्यक्त करता है; doctrinal विस्तार मूल पाठ से अधिक कहेगा।
- issue: רוּחַ עָרִיצִים की अस्पष्टता
  choice: ‘निर्दयों का झोंका’ रखा गया है और अन्य अर्थ पादटिप्पणी में दिए गए हैं।
  alternative: ‘निर्दयों की साँस’ या ‘निर्दयों की हवा’।
  rationale: רוּחַ में साँस, हवा या प्रचंड झोंके की अर्थ-सम्भावना है। मुख्य पाठ में मौसम की उपमा से संगति रखी गई है, पर अस्पष्टता को पादटिप्पणी द्वारा सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। परमेश्वर के सीधे संबोधन के लिए हिन्दी बाइबलीय काव्य-परंपरा के अनुरूप ‘तू’ का प्रयोग है। समानांतरता और सुरक्षा-संबंधी ठोस बिंब सुरक्षित रखे गए हैं।
