source:
  edition: WLC
  text: בִּלַּ֤ע הַ/מָּ֨וֶת֙ לָ/נֶ֔צַח וּ/מָחָ֨ה אֲדֹנָ֧/י יְהוִ֛ה דִּמְעָ֖ה מֵ/עַ֣ל כָּל פָּנִ֑ים וְ/חֶרְפַּ֣ת עַמּ֗/וֹ יָסִיר֙ מֵ/עַ֣ל כָּל הָ/אָ֔רֶץ כִּ֥י יְהוָ֖ה דִּבֵּֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/008.yaml
  text: He will swallow up death forever[a], and the Lord GOD will wipe away tears from every face, and he will remove the reproach of his people from all the earth[c][b], for Yahweh has spoken.
translation:
  language: hi
  text: वह मृत्यु को सदा के लिए निगल जाएगा[a]; प्रभु याहवे[b] हर चेहरे से आँसू पोंछ देगा, और अपनी प्रजा पर लगा कलंक[c] सारी पृथ्वी पर से हटा देगा, क्योंकि याहवे ने कहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने मृत्यु को सदा के लिए निगल लिया है।” इब्रानी पूर्णकाल भविष्य के ऐसे कार्य को भी व्यक्त कर सकता है जिसका होना निश्चित है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “अदोनाय याहवे,” अर्थात “प्रभु याहवे।”
    reason: lexical_alternative
  - marker: c
    text: या, “अपनी प्रजा की बदनामी” अथवा “अपनी प्रजा का तिरस्कार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלַּע
  choice: वह ... निगल जाएगा
  rationale: यह रूप व्याकरण की दृष्टि से पूर्णकाल है, पर भविष्यवाणी के प्रसंग में निश्चित भावी कार्य को व्यक्त करता है। “निगल जाएगा” मूल सजीव रूपक को बनाए रखता है; “नष्ट कर देगा” उससे अधिक व्याख्यात्मक होता।
- source_word: הַמָּוֶת לָנֶצַח
  choice: मृत्यु को सदा के लिए
  rationale: “मृत्यु” मूल संज्ञा का सीधा रूप है और “सदा के लिए” נצח की स्थायी, अनंत अवधि को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּמָחָה ... דִּמְעָה מֵעַל כָּל־פָּנִים
  choice: हर चेहरे से आँसू पोंछ देगा
  rationale: מחה के साथ “आँसू पोंछ देना” हिन्दी का स्वाभाविक प्रयोग है। इब्रानी में “आँसू” एकवचन है, किंतु “हर चेहरे” के साथ हिन्दी में बहुवचन अधिक सहज और वही वितरणात्मक अर्थ देता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: אֲדֹנָי को “प्रभु” और परमेश्वर के निजी नाम יהוה को “याहवे” कहने से संयुक्त उपाधि के दोनों अंग स्पष्ट रहते हैं।
- source_word: וְחֶרְפַּת עַמּוֹ
  choice: अपनी प्रजा का अपमान
  rationale: חרפה सार्वजनिक निंदा, लज्जा या तिरस्कार को दर्शाता है। “अपमान” सामान्य आधुनिक हिन्दी में इस बाहरी अनादर को स्पष्ट रूप से व्यक्त करता है।
- source_word: יָסִיר מֵעַל כָּל־הָאָרֶץ
  choice: सारी पृथ्वी पर से दूर कर देगा
  rationale: सकर्मक हिफ़ील रूप का अर्थ “दूर करना/हटा देना” है। व्यापक उद्धार-संदर्भ और “हर चेहरे” के समानांतर सार्वभौमिक विस्तार के कारण הָאָרֶץ को “पृथ्वी” किया गया है, यद्यपि इसका अर्थ “देश” भी हो सकता है।
- source_word: כִּי יְהוָה דִּבֵּר
  choice: क्योंकि याहवे ने यह कहा है
  rationale: כִּי प्रतिज्ञा की निश्चितता का आधार देता है। “कहा है” हिन्दी में स्वाभाविक भविष्यसूचक घोषणा है और पूर्ण हुई वाणी का भाव बनाए रखता है।
theological_decisions:
- issue: यְהוָה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: लिप्यंतरण “याहवे” मूल पाठ में उपस्थित वाचा-संबंधी निजी नाम को छिपाए बिना प्रस्तुत करता है। אֲדֹנָי יְהוִה में इसे “प्रभु याहवे” रखा गया है, ताकि उपाधि और नाम दोनों अलग-अलग स्पष्ट हों।
- issue: בִּלַּע के पूर्णकाल का समय-संदर्भ
  choice: भावी निश्चित प्रतिज्ञा—“निगल जाएगा”
  alternative: पूर्ण कार्य—“निगल लिया है”
  rationale: रूप पूर्णकाल है, इसलिए पूर्ण किए गए कार्य का अनुवाद व्याकरणतः संभव है; पर आसपास की उद्धार-प्रतिज्ञाओं में यह भविष्यवाणी का निश्चित भावी कार्य है। पादटिप्पणी वास्तविक व्याकरणिक विकल्प को सुरक्षित रखती है।
- issue: הָאָרֶץ का विस्तार
  choice: सारी पृथ्वी
  alternative: सारा देश
  rationale: “हर चेहरे” और मृत्यु के अंत के व्यापक संदर्भ में सार्वभौमिक अर्थ अधिक उपयुक्त है, फिर भी मूल संज्ञा “देश/भूमि” का अर्थ भी ग्रहण कर सकती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी रखी गई है। “निगल जाएगा” भविष्यवाणी की प्रबल मूल उपमा को सुरक्षित रखता है; “हर चेहरे से आँसू पोंछ देगा” स्वाभाविक हिन्दी है। वाक्य की गंभीर भविष्यसूचक लय बनाए रखने के लिए अर्धविराम और समन्वित खंडों का प्रयोग किया गया है।
