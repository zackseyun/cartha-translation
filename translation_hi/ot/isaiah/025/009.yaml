source:
  edition: WLC
  text: וְ/אָמַר֙ בַּ/יּ֣וֹם הַ/ה֔וּא הִנֵּ֨ה אֱלֹהֵ֥י/נוּ זֶ֛ה קִוִּ֥ינוּ ל֖/וֹ וְ/יֽוֹשִׁיעֵ֑/נוּ זֶ֤ה יְהוָה֙ קִוִּ֣ינוּ ל֔/וֹ נָגִ֥ילָה וְ/נִשְׂמְחָ֖ה בִּ/ישׁוּעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/009.yaml
  text: And it will be said on that day[a], “Behold, this is our God; we have waited for him, that he might save us. This is Yahweh; we have waited for him. Let us rejoice and be glad in his salvation.”
translation:
  language: hi
  text: उस दिन कहा जाएगा, “देखो, यही हमारा परमेश्वर है; हमने उसकी प्रतीक्षा की है, और वह हमें बचाएगा। यही याहवेह[a] है; हमने उसकी प्रतीक्षा की है। आओ, हम उसके उद्धार में आनन्दित और प्रसन्न हों।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में परमेश्वर का नाम יְהוָה है, जिसका यहाँ लिप्यंतरण ‘याहवेह’ किया गया है।
    reason: नाम के लिप्यंतरण को स्पष्ट करना
lexical_decisions:
- source_word: וְאָמַר
  choice: कहा जाएगा
  rationale: एकवचन क्रिया का यहाँ भाववाचक प्रयोग स्वाभाविक है; इससे इब्रानी में अनुपस्थित किसी निश्चित वक्ता को जोड़े बिना भविष्यसूचक अर्थ व्यक्त होता है।
- source_word: הִנֵּה אֱלֹהֵינוּ זֶה
  choice: देखो, यही हमारा परमेश्वर है
  rationale: ‘देखो’ ध्यान आकर्षित करने वाले הִנֵּה का स्वाभाविक आधुनिक रूप है, और ‘यही’ पहचान तथा बल देने वाले זֶה को व्यक्त करता है।
- source_word: קִוִּינוּ לוֹ
  choice: हमने उसकी बाट जोही है
  rationale: ‘बाट जोहना’ प्रतीक्षा के साथ आशा और उत्सुकता का भाव रखता है; पूर्ण क्रिया का वर्तमान परिणाम भी ‘है’ से बना रहता है।
- source_word: וְיוֹשִׁיעֵנוּ
  choice: और वह हमें बचाएगा
  rationale: हिफ़ील अपूर्ण क्रिया का सीधा भावी अर्थ रखा गया है और וְ को समुच्चयबोधक ‘और’ के रूप में अनूदित किया गया है; इससे उद्देश्यसूचक अर्थ अनावश्यक रूप से नहीं थोपा जाता।
- source_word: זֶה יְהוָה
  choice: यही याहवेह है
  rationale: ‘यही’ पहचान के बल को सुरक्षित रखता है और יְהוָה को उसके व्यक्तिगत वाचा-नाम के लिप्यंतरण से प्रस्तुत करता है।
- source_word: נָגִילָה וְנִשְׂמְחָה
  choice: आओ, हम ... मगन और आनन्दित हों
  rationale: दोनों सहोत्साहक रूपों का इच्छासूचक और सामूहिक आह्वान ‘आओ, हम ... हों’ से स्पष्ट होता है।
- source_word: בִּישׁוּעָתוֹ
  choice: उसके उद्धार में
  rationale: ‘उद्धार’ दैवी छुटकारे का व्यापक अर्थ रखता है और ‘में’ मूल पूर्वसर्ग בְּ को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवेह
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम है। ‘याहवेह’ उसका सीधा और व्यापक रूप से मान्य लिप्यंतरण है; इसे किसी उपाधि से बदलने पर नाम और उपाधि का भेद मिट जाता।
- issue: וְיוֹשִׁיעֵנוּ का काल और संबंध
  choice: और वह हमें बचाएगा
  alternative: कि वह हमें बचाए / और उसने हमें बचाया
  rationale: मसोराई स्वरांकन के अनुसार यह अपूर्ण क्रिया स्वाभाविक रूप से भावी अर्थ दे सकती है। संदर्भ में उद्देश्य अथवा पूर्ण हो चुके उद्धार का अर्थ संभव माना जा सकता है, पर मुख्य पाठ में साधारण समन्वय और रूपगत भावी अर्थ रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक आराधनात्मक स्वर वाली है। ‘बाट जोही’ साधारण पाठक के लिए समझने योग्य रहते हुए आशापूर्ण प्रतीक्षा का काव्यात्मक भाव देती है; अत्यधिक संस्कृतनिष्ठ या सांप्रदायिक शब्दावली से बचा गया है।
