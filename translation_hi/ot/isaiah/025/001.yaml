source:
  edition: WLC
  text: יְהוָ֤ה אֱלֹהַ/י֙ אַתָּ֔ה אֲרֽוֹמִמְ/ךָ֙ אוֹדֶ֣ה שִׁמְ/ךָ֔ כִּ֥י עָשִׂ֖יתָ פֶּ֑לֶא עֵצ֥וֹת מֵֽ/רָח֖וֹק אֱמ֥וּנָה אֹֽמֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/001.yaml
  text: O Yahweh[a], you are my God; I will exalt you; I will praise your name, for you have done wonderful things, plans formed long ago, faithful and sure.
translation:
  language: hi
  text: 'हे याहवे, तू मेरा परमेश्वर है;

    मैं तुझे ऊँचा करूँगा,

    तेरे नाम की स्तुति करूँगा,

    क्योंकि तूने अद्भुत काम किए हैं—

    ऐसी योजनाएँ जो बहुत पहले बनाई गई थीं,

    विश्वसनीय और अटल हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पंक्ति बहुत संक्षिप्त और काव्यात्मक है। इसका अनुवाद यह भी हो सकता है: “क्योंकि तूने एक अद्भुत काम किया है—बहुत पहले की योजनाएँ, विश्वासयोग्यता और दृढ़ता।” अन्तिम शब्द परमेश्वर की प्राचीन योजनाओं की विश्वसनीयता और स्थिरता पर बल दे सकते हैं।'
    reason: मूल में פֶּלֶא के एकवचन और अन्तिम दो संज्ञाओं के वाक्यगत सम्बन्ध की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके प्रचलित ध्वन्यात्मक रूप से व्यक्त किया गया है।
- source_word: אֱלֹהַי
  choice: मेरा परमेश्वर
  rationale: प्रथम पुरुष एकवचन स्वामित्व-प्रत्यय को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: אֲרוֹמִמְךָ
  choice: मैं तुझे ऊँचा करूँगा
  rationale: रूम धातु यहाँ स्तुति में ऊँचा उठाने या महान ठहराने का भाव देती है; यह रूपक हिन्दी में भी सहज है।
- source_word: אוֹדֶה שִׁמְךָ
  choice: तेरे नाम की स्तुति करूँगा
  rationale: हिफ़िल रूप में ידה धन्यवाद और स्तुति दोनों व्यक्त कर सकता है। समानांतर आराधना-वाक्य में ‘स्तुति’ स्वाभाविक है और ‘नाम’ को मूल के अनुसार बनाए रखता है।
- source_word: כִּי עָשִׂיתָ פֶּלֶא
  choice: क्योंकि तूने अद्भुत काम किए हैं
  rationale: एकवचन פֶּלֶא यहाँ सामूहिक या गुणात्मक अर्थ दे सकता है; हिन्दी बहुवचन अभिव्यक्ति परमेश्वर के आश्चर्यजनक कार्यों का भाव सहज रूप से बताती है।
- source_word: עֵצוֹת
  choice: योजनाएँ
  rationale: सन्दर्भ में यह शब्द परमेश्वर के पहले से ठहराए हुए विचारों या उद्देश्यों को सूचित करता है; ‘योजनाएँ’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: מֵרָחוֹק
  choice: बहुत पहले बनाई गई
  rationale: शाब्दिक अर्थ ‘दूर से’ है, पर यहाँ दूरी का कालगत अर्थ—बहुत प्राचीन समय से—सन्दर्भ के अनुकूल है। ‘बनाई गई’ योजनाओं के साथ सम्बन्ध स्पष्ट करता है।
- source_word: אֱמוּנָה
  choice: विश्वासयोग्य
  rationale: यह संज्ञा विश्वसनीयता और निष्ठा का भाव रखती है; विशेषण के रूप में इसे योजनाओं की भरोसेमंद प्रकृति से जोड़ा गया है।
- source_word: אֹמֶן
  choice: अटल
  rationale: यह दुर्लभ शब्द दृढ़ता, स्थिरता और निश्चितता बताता है। ‘अटल’ निकटवर्ती אֱמוּנָה की अनावश्यक पुनरावृत्ति के बिना उसका पूरक भाव देता है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में विशिष्ट ईश्वरीय नाम सीधे उपस्थित है। उसे उपाधि से बदलने के बजाय नाम के रूप में रखना स्रोत के अधिक निकट है।
- issue: מֵרָחוֹק का स्थानगत या कालगत अर्थ
  choice: कालगत—‘बहुत पहले’
  alternative: स्थानगत—‘दूर से’
  rationale: अद्भुत कार्यों को योजनाओं की पूर्ति के रूप में प्रस्तुत करने वाले सन्दर्भ में प्राचीन काल में बनाई गई योजनाओं का अर्थ अधिक संगत है, यद्यपि मूल पद अपने आप में ‘दूर से’ भी कह सकता है।
- issue: अन्तिम पदबंध אֱמוּנָה אֹמֶן का वाक्यगत सम्बन्ध
  choice: योजनाओं के गुण—‘विश्वासयोग्य और अटल’
  alternative: दो संज्ञाएँ—‘विश्वासयोग्यता और दृढ़ता’; अथवा ‘पूर्ण विश्वासयोग्यता में’
  rationale: इब्रानी अत्यन्त संक्षिप्त है और सम्बन्धसूचक शब्द नहीं देता। मुख्य पाठ में दोनों शब्दों को प्राचीन योजनाओं की विश्वसनीयता और स्थिरता बताने वाला माना गया है, पर वैकल्पिक संरचना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और आराधनात्मक हिन्दी अपनाई गई है। काव्य-पंक्तियाँ मूल के समानांतर विन्यास को उभारती हैं। परमेश्वर को सम्बोधित करते समय ‘तू/तेरे’ हिन्दी की पारम्परिक निकटता और एकवचनता बनाए रखते हैं; भाषा को अत्यधिक संस्कृतनिष्ठ नहीं बनाया गया।
