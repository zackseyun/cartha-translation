base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/007.yaml
  text: And on this mountain he will swallow up the covering that covers all peoples[b][a], and the veil that is spread over all nations.
translation:
  language: hi
  text: और इस पर्वत पर वह उस आवरण को निगल जाएगा जो सभी जनों पर पड़ा हुआ है,[a][b] और उस परदे को भी जो सभी राष्ट्रों पर फैला हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस कफ़न को जो सभी जनों पर पड़ा हुआ है।” इब्रानी में एक ही मूल से बने शब्द दोहराए गए हैं और मानवजाति पर लिपटे हुए आवरण का चित्र प्रस्तुत करते हैं।
    reason: lexical_alternative
  - marker: b
    text: यह “आवरण” या “परदा” संभवतः अगले पद में मृत्यु को निगल लिए जाने की घोषणा का पूर्वाभास देता है; फिर भी यह बिंब राष्ट्रों पर पड़ी किसी अधिक व्यापक चीज़ के हटाए जाने का संकेत भी दे सकता है।
    reason: cross_reference
lexical_decisions:
- source_word: וּבִלַּע
  choice: वह ... निगल जाएगा
  rationale: मूल क्रिया का सजीव रूपक बनाए रखता है और अगले पद में मृत्यु को निगल लिए जाने की भाषा से संबंध भी सुरक्षित रखता है। ‘नष्ट कर देगा’ अर्थ की व्याख्या तो करता, पर मूल बिंब को खो देता।
- source_word: בָּהָר הַזֶּה
  choice: इस पर्वत पर
  rationale: यह स्वाभाविक हिन्दी स्थानवाचक अभिव्यक्ति है और प्रसंग में सिय्योन के पर्वत की ओर संकेत बनाए रखती है।
- source_word: פְּנֵי הַלּוֹט הַלּוֹט
  choice: उस आवरण को ... जो ... ढके हुए है
  rationale: פְּנֵי को अलग से ‘मुख’ कहने पर हिन्दी अस्वाभाविक होती। संपूर्ण पदबंध को आवरण के रूप में व्यक्त किया गया है, जबकि सजातीय शब्दों की पुनरावृत्ति ‘आवरण ... ढके’ से कुछ हद तक सुरक्षित रहती है।
- source_word: עַל כָּל הָעַמִּים
  choice: सभी जनों को
  rationale: עַמִּים के लिए ‘जन’ चुना गया है ताकि अगले समानांतर पद के גּוֹיִם (‘राष्ट्रों’) से भेद बना रहे। आवरण के साथ עַל का भाव हिन्दी में ‘को ढके हुए’ में समाहित है।
- source_word: וְהַמַּסֵּכָה
  choice: और उस परदे को भी
  rationale: यहाँ समानांतरता किसी ढकी हुई वस्तु की माँग करती है, न कि इस शब्द का अन्यत्र मिलने वाला ‘ढली हुई मूर्ति’ अर्थ। ‘परदा’ पहले पद के आवरण से संबंधित, किंतु अलग बिंब देता है। ‘भी’ हिन्दी में दोनों कर्मों का एक ही क्रिया से संबंध स्पष्ट करता है।
- source_word: הַנְּסוּכָה
  choice: जो ... फैला हुआ है
  rationale: निष्क्रिय कृदंत को ऐसे वस्त्र या परदे के रूप में स्वाभाविक ढंग से व्यक्त करता है जो राष्ट्रों के ऊपर बिछा या फैला है।
- source_word: עַל כָּל הַגּוֹיִם
  choice: सभी राष्ट्रों पर
  rationale: גּוֹיִם का सामान्य अर्थ ‘राष्ट्र’ है; इससे पहले पद के ‘जनों’ के साथ काव्यात्मक समानांतरता और शब्दगत भेद दोनों बने रहते हैं।
theological_decisions:
- issue: हटाई जाने वाली वस्तु का स्वरूप
  choice: सभी जनों और राष्ट्रों पर पड़ा रूपकात्मक आवरण या परदा
  alternative: विशेष रूप से मृत्यु का कफ़न; अथवा आत्मिक अंधेपन या अपमान का प्रतीक
  rationale: पद 8 में मृत्यु का निगला जाना कफ़न-संबंधी अर्थ की ओर संकेत कर सकता है, पर पद 7 स्वयं बिंब को व्यापक रखता है। इसलिए मुख्य पाठ इसे किसी एक धर्मवैज्ञानिक अर्थ तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘निगल जाएगा’ मूल रूपक को जानबूझकर बनाए रखता है। ‘जन’ और ‘राष्ट्र’ से עַמִּים तथा גּוֹיִם का काव्यात्मक भेद सुरक्षित रखा गया है।
