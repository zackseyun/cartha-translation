id: ISA.66.5
reference: Isaiah 66:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שִׁמְעוּ֙ דְּבַר יְהוָ֔ה הַ/חֲרֵדִ֖ים אֶל דְּבָר֑/וֹ אָמְרוּ֩ אֲחֵי/כֶ֨ם שֹׂנְאֵי/כֶ֜ם מְנַדֵּי/כֶ֗ם לְמַ֤עַן שְׁמִ/י֙ יִכְבַּ֣ד יְהוָ֔ה וְ/נִרְאֶ֥ה בְ/שִׂמְחַתְ/כֶ֖ם וְ/הֵ֥ם יֵבֹֽשׁוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/005.yaml
  text: 'Hear the word of Yahweh[a], you who tremble at his word: Your brothers who hate you, who cast you out for my name’s sake, have said, “Let Yahweh be glorified, that we may see your joy”[b]; but they will be put to shame.'
translation:
  language: hi
  text: याहवे का वचन सुनो, तुम जो उसके वचन से काँपते हो! तुम्हारे भाई, जो तुमसे घृणा करते और मेरे नाम के कारण तुम्हें निकाल देते हैं,[a] कहते हैं, “याहवे की महिमा हो, ताकि हम तुम्हारा आनन्द देखें!”[b] परन्तु वही लज्जित होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हें अलग कर देते हैं” अथवा “तुम्हें निर्वासित कर देते हैं।”
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी का शाब्दिक अर्थ: “याहवे की महिमा हो, और हम तुम्हारा आनन्द देखें।” सम्भवतः वे विश्वासयोग्य लोगों का उपहास कर रहे हैं; पर इसे इस प्रकार भी समझा जा सकता है: “याहवे का आदर हो, और हमें तुम्हारा आनन्द देखने दो।”'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक रूप की सीधी और स्वाभाविक भविष्यद्वक्ताई पुकार।
- source_word: דְּבַר יְהוָה
  choice: याहवे का वचन
  rationale: स्थापित भविष्यद्वक्ताई पदबंध को बनाए रखते हुए יהוה को उसके व्यक्तिवाचक नाम से प्रस्तुत करता है।
- source_word: הַחֲרֵדִים אֶל דְּבָרוֹ
  choice: तुम जो उसके वचन से काँपते हो
  rationale: חרד के वास्तविक कम्पन और श्रद्धामिश्रित भय, दोनों को सुरक्षित रखता है; केवल ‘आदर करने’ से इसकी तीव्रता घट जाती।
- source_word: אֲחֵיכֶם שֹׂנְאֵיכֶם
  choice: तुम्हारे भाई, जो तुमसे घृणा करते
  rationale: ‘भाई’ मूल के पारिवारिक-सामुदायिक संबंध और उसी से उत्पन्न विडंबना को बनाए रखता है।
- source_word: מְנַדֵּיכֶם
  choice: तुम्हें निकाल देते हैं
  rationale: नדה के दूर करने अथवा समुदाय से बहिष्कृत करने के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है; अर्थ-सीमा पादटिप्पणी में दी गई है।
- source_word: לְמַעַן שְׁמִי
  choice: मेरे नाम के कारण
  rationale: यहाँ कारण या धार्मिक बहाने से जुड़ी अभिव्यक्ति है; ‘मेरे नाम के निमित्त’ की अपेक्षा अधिक स्पष्ट आधुनिक हिन्दी।
- source_word: יִכְבַּד יְהוָה
  choice: याहवे की महिमा हो
  rationale: जुस्सिव भाव को संक्षिप्त इच्छार्थक हिन्दी में रखता है और कथन के सम्भावित व्यंग्य को स्वयं पाठक पर छोड़ता है।
- source_word: וְנִרְאֶה בְשִׂמְחַתְכֶם
  choice: ताकि हम तुम्हारा आनन्द देखें
  rationale: मसोरेटिक रूप को प्रथम पुरुष बहुवचन ‘हम देखें’ मानता है; ב को स्वाभाविक हिन्दी कर्म-संबंध में व्यक्त किया गया है।
- source_word: וְהֵם יֵבֹשׁוּ
  choice: परन्तु वही लज्जित होंगे
  rationale: הֵם के विरोधात्मक बल को ‘वही’ से और בוש के भावी अपमान/लज्जा को स्पष्ट हिन्दी से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में व्यक्तिवाचक वाचा-नाम है; उसका लिप्यंतरण नाम और उपाधि के बीच भेद बनाए रखता है।
- issue: उद्धृत कथन का स्वर
  choice: शत्रुतापूर्ण भाइयों का सम्भवतः व्यंग्यपूर्ण कथन, पर व्यंग्य को मुख्य पाठ में अतिरिक्त शब्द डालकर निश्चित नहीं किया गया
  alternative: इसे निष्कपट धार्मिक कामना समझना
  rationale: घृणा, निष्कासन और अन्तिम लज्जा का संदर्भ उपहास का प्रबल संकेत देता है, फिर भी इब्रानी पाठ स्वर को व्याकरणतः स्पष्ट नहीं करता।
- issue: וְנִרְאֶה का कर्ता और अर्थ
  choice: हम तुम्हारा आनन्द देखें
  alternative: वह तुम्हारे आनन्द में प्रकट हो / और हम तुम्हारा आनन्द देखें
  rationale: मसोरेटिक स्वरांकन प्रथम पुरुष बहुवचन ‘हम देखें’ का समर्थन करता है; संयोजक के उद्देश्यात्मक संबंध को ‘ताकि’ से व्यक्त किया गया है, जबकि समन्वयी पाठ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, स्पष्ट भविष्यद्वक्ताई शैली। ‘काँपते हो’ मूल की तीव्रता रखता है, जबकि ‘निकाल देते हैं’ साधारण पाठक के लिए सहज है। उद्धरण में विस्मयादिबोधक चिह्न सम्भावित ताने की धार दिखाता है, पर पादटिप्पणी वैकल्पिक निष्कपट पठन को सुरक्षित रखती है।
