  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י בָ/אֵשׁ֙ יְהוָ֣ה נִשְׁפָּ֔ט וּ/בְ/חַרְבּ֖/וֹ אֶת כָּל בָּשָׂ֑ר וְ/רַבּ֖וּ חַֽלְלֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/016.yaml
  text: For by fire Yahweh will execute judgment[a], and by his sword, against all flesh[b]; and many will be those slain by Yahweh.
translation:
  language: hi
  text: क्योंकि याहवे आग और अपनी तलवार के द्वारा समस्त मानवजाति का न्याय करेगा[a][b]; और याहवे के मारे हुए बहुत होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे आग और अपनी तलवार के द्वारा समस्त मानवजाति के विरुद्ध न्याय में प्रवेश करेगा।” हिब्रू क्रिया का अनुवाद संक्षेप में “न्याय करेगा” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में “समस्त शरीरधारी” (शाब्दिक रूप से, “सारा शरीर”); यह भविष्यद्वाणी की भाषा में नश्वर मानवजाति के लिए व्यापक अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस संयोजक बल को स्वाभाविक रूप से रखता है।
- source_word: בָאֵשׁ
  choice: आग के द्वारा
  rationale: यहाँ ב साधन सूचित करता है; अनुवाद आग को न्याय के माध्यम के रूप में स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित लिप्यंतरण को रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: נִשְׁפָּט
  choice: न्याय करेगा
  rationale: निफ़अल रूप यहाँ न्यायिक कार्रवाई करने के अर्थ में है। संक्षिप्त हिन्दी अभिव्यक्ति स्वाभाविक है और ‘न्याय में प्रवेश करेगा’ जैसे असहज शब्दशः रूप से बचती है।
- source_word: וּבְחַרְבּוֹ
  choice: और अपनी तलवार के द्वारा
  rationale: साधनवाचक ב को बनाए रखते हुए तलवार की दिव्य युद्ध और दंड की छवि सुरक्षित रखी गई है।
- source_word: אֶת כָּל־בָּשָׂר
  choice: समस्त मानवजाति का न्याय करेगा
  rationale: נִשְׁפָּט के साथ यह पदबंध न्याय के व्यापक मानवीय विषय को बताता है। मुख्य पाठ में स्वाभाविक हिन्दी दी गई है और ‘समस्त प्राणी’ का अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: וְרַבּוּ
  choice: बहुत होंगे
  rationale: यह बहुलता या बड़ी संख्या व्यक्त करता है; हिन्दी में विधेय को स्वाभाविक ढंग से रखा गया है।
- source_word: חַלְלֵי יְהוָה
  choice: यहोवा के हाथों मारे गए लोग
  rationale: सम्बन्धवाचक रचना यहाँ उन लोगों को सूचित करती है जिन्हें यहोवा ने मारा है; ‘के हाथों’ कारक सम्बन्ध को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत वाचा-नाम को उपाधि ‘प्रभु’ से नहीं बदला गया। आधुनिक हिन्दी बाइबल-पाठकों के लिए परिचित ‘यहोवा’ रूप चुना गया, जबकि हिब्रू उच्चारण का सटीक पुनर्निर्माण पूर्णतः निश्चित नहीं है।
- issue: כָּל־בָּשָׂר का दायरा
  choice: समस्त मानवजाति
  alternative: समस्त प्राणी / सारा शरीरधारी जगत
  rationale: सन्दर्भ में वाक्यांश का लक्ष्य सार्वभौमिक मानव समुदाय है। मुख्य पाठ में अर्थ स्पष्ट किया गया है, पर हिब्रू की देहधारी और नश्वर प्राणी वाली छवि पादटिप्पणी में रखी गई है।
- issue: נִשְׁפָּט के न्यायिक अर्थ की अभिव्यक्ति
  choice: न्याय करेगा
  alternative: न्याय में उतरेगा / न्याय-विवाद करेगा
  rationale: क्रिया दिव्य न्यायिक कार्रवाई को सूचित करती है। सरल रूप तनाव को अनावश्यक रूप से मुकदमे या विवाद तक सीमित नहीं करता; वैकल्पिक संरचना पादटिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। समानांतर साधनवाचक पदों ‘आग के द्वारा’ और ‘अपनी तलवार के द्वारा’ को बनाए रखा गया है। ‘यहोवा के हाथों’ निष्पादक अर्थ स्पष्ट करता है और पद के गंभीर न्याय-विषयक स्वर को सुरक्षित रखता है।
