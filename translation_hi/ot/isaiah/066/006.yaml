  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ק֤וֹל שָׁאוֹן֙ מֵ/עִ֔יר ק֖וֹל מֵֽ/הֵיכָ֑ל ק֣וֹל יְהוָ֔ה מְשַׁלֵּ֥ם גְּמ֖וּל לְ/אֹיְבָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/006.yaml
  text: A sound of uproar from the city[a], a sound from the temple[c][b], the sound of Yahweh repaying recompense to his enemies.
translation:
  language: hi
  text: नगर से कोलाहल की ध्वनि[a], मन्दिर से ध्वनि[b]—याहवे की ध्वनि! याहवे अपने शत्रुओं को प्रतिदान दे रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ध्वनि’ के स्थान पर ‘आवाज़’ या ‘शोर’ भी सम्भव है। इब्रानी में यही शब्द तीन बार दोहराया गया है। ‘कोलाहल’ का अनुवाद ‘हंगामा’ या ‘गर्जना’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘मन्दिर’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ कुछ प्रसंगों में ‘राजमहल’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: आवाज़
  rationale: यह शब्द ध्वनि, आवाज़ या शोर को सूचित कर सकता है। तीनों प्रयोगों में एक ही हिन्दी शब्द रखकर इब्रानी की आलंकारिक पुनरावृत्ति सुरक्षित की गई है।
- source_word: שָׁאוֹן
  choice: कोलाहल
  rationale: यह ऊँचे, अशान्त शोर या हलचल का बोध कराता है; न्याय के प्रसंग में ‘कोलाहल’ स्वाभाविक और सटीक है।
- source_word: מֵעִיר
  choice: नगर से
  rationale: מִן स्रोत को दर्शाता है; संक्षिप्त पदबंध बताता है कि आवाज़ नगर से आ रही है।
- source_word: מֵהֵיכָל
  choice: मन्दिर से
  rationale: הֵיכָל का अर्थ कुछ प्रसंगों में राजमहल भी हो सकता है, किन्तु यहाँ यरूशलेम और न्याय के प्रसंग में मन्दिर अभिप्रेत होने की अधिक सम्भावना है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चार-अक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यन्तरित किया गया है।
- source_word: מְשַׁלֵּם
  choice: चुका रहा है
  rationale: पिएल कृदन्त यहाँ प्रतिफल या बदला दिए जाने की सक्रिय क्रिया व्यक्त करता है; यह हिन्दी में स्वाभाविक रहते हुए जारी क्रिया का भाव रखता है।
- source_word: גְּמוּל
  choice: बदला
  rationale: यह किसी कर्म के प्रत्युत्तर में मिलने वाले प्रतिफल को दर्शाता है। शत्रुओं के संदर्भ में अर्थ दण्डात्मक है, इसलिए ‘बदला’ सहज और प्रसंगानुकूल है।
- source_word: לְאֹיְבָיו
  choice: अपने शत्रुओं को
  rationale: לְ अप्रत्यक्ष कर्म को चिह्नित करता है; सर्वनाम का सम्बन्ध याहवे से स्पष्ट करने के लिए ‘अपने’ प्रयुक्त है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे उपस्थित है; ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: גְּמוּל का न्याय-संबंधी अर्थ
  choice: उनका बदला
  alternative: प्रतिफल अथवा जो उनके कर्मों का फल है
  rationale: शत्रुओं का उल्लेख इसे दण्डात्मक प्रत्युत्तर बनाता है, पर अनुवाद न्याय की प्रकृति के विषय में मूल से अधिक कोई विशिष्ट धार्मिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और श्रव्य प्रभाव वाली रखी गई है। आरम्भिक खण्डों में क्रिया न जोड़कर मूल की तीव्र नामवाची शैली तथा קוֹל की तीनfold पुनरावृत्ति बनाए रखी गई है। ‘प्रतिफल का प्रतिफल देना’ जैसी अस्वाभाविक पुनरुक्ति से बचते हुए מְשַׁלֵּם גְּמוּל को ‘बदला चुका रहा है’ कहा गया है।
