source:
  edition: WLC
  text: וְ/הָיָ֗ה מִֽ/דֵּי חֹ֨דֶשׁ֙ בְּ/חָדְשׁ֔/וֹ וּ/מִ/דֵּ֥י שַׁבָּ֖ת בְּ/שַׁבַּתּ֑/וֹ יָב֧וֹא כָל בָּשָׂ֛ר לְ/הִשְׁתַּחֲוֺ֥ת לְ/פָנַ֖/י אָמַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/023.yaml
  text: And it shall be[a], from new moon to its new moon and from Sabbath to its Sabbath, all flesh shall come to bow down before me[b], says Yahweh.
translation:
  language: hi
  text: और ऐसा होगा[a] कि हर नए चाँद पर और हर सब्त पर समस्त देहधारी[b] मेरे सामने दण्डवत् करने के लिए आएँगे, यहोवा कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से पदबंध का भाव है, “एक नए चाँद से दूसरे नए चाँद तक और एक सब्त से दूसरे सब्त तक,” अर्थात नियमित रूप से हर नए चाँद और हर सब्त पर।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक अभिव्यक्ति “सारा मांस” है। इस प्रसंग में इसका स्वाभाविक संकेत समस्त मानवजाति की ओर है, पर यह देहधारी प्राणी-जीवन की व्यापक छटा भी बनाए रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: और ऐसा होगा
  rationale: यह सामान्य भविष्यसूचक सूत्र है; यह हिन्दी में स्वाभाविक रहते हुए भविष्य की निश्चित अवस्था को व्यक्त करता है।
- source_word: מִדֵּי חֹדֶשׁ בְּחָדְשׁוֹ
  choice: हर नए चाँद पर
  rationale: यह पदबंध नियमित मासिक पुनरावृत्ति बताता है। सब्त के समानांतर होने के कारण חֹדֶשׁ यहाँ नए चाँद के धार्मिक अवसर को सूचित करता है; शाब्दिक संरचना का अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וּמִדֵּי שַׁבָּת בְּשַׁבַּתּוֹ
  choice: और हर सब्त पर
  rationale: यह नियमित साप्ताहिक उपासना को व्यक्त करता है और 'सब्त' धार्मिक पद को बनाए रखता है।
- source_word: יָבוֹא
  choice: आएँगे
  rationale: בוא का सामान्य भविष्यकालीन अर्थ है; बहुवचन हिन्दी में सामूहिक कर्ता 'सभी मनुष्य' के अनुरूप है।
- source_word: כָל בָּשָׂר
  choice: सभी मनुष्य
  rationale: इस प्रसंग में इब्रानी मुहावरे का सबसे स्वाभाविक आशय समस्त मानवजाति है। 'सब प्राणी' हिन्दी में पशुओं को भी प्रत्यक्षतः शामिल कर सकता है; मूल की देहधारी सृष्टि वाली छटा पादटिप्पणी में रखी गई है।
- source_word: לְהִשְׁתַּחֲוֺת
  choice: दण्डवत् करने
  rationale: यह उपासना में झुकने अथवा भूमि तक प्रणाम करने की मूर्त शारीरिक क्रिया को बनाए रखता है।
- source_word: לְפָנַי
  choice: मेरे सामने
  rationale: यह परमेश्वर की प्रत्यक्ष उपस्थिति के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: यह इब्रानी व्यक्तिगत ईश्वरीय नाम का हिन्दी में प्रचलित और पहचानने योग्य रूप है।
theological_decisions:
- issue: חֹדֶשׁ का अर्थ 'महीना' लिया जाए या 'नया चाँद'
  choice: नया चाँद
  alternative: महीना
  rationale: सब्त के साथ समानांतर प्रयोग और नियमित उपासना का संदर्भ नए चाँद के धार्मिक अवसर की ओर संकेत करता है। इससे भविष्य में इन अनुष्ठानों की निरंतरता से जुड़े व्यापक धर्मवैज्ञानिक प्रश्न का अतिरिक्त निर्णय नहीं किया गया।
- issue: כָל בָּשָׂר का दायरा
  choice: मुख्य पाठ में 'सभी मनुष्य', मूल मुहावरे की व्यापक छटा पादटिप्पणी में
  alternative: '''सभी देहधारी'' या ''सब प्राणी'''
  rationale: संदर्भ में सार्वभौमिक मानवीय उपासना सबसे स्वाभाविक है, किंतु पादटिप्पणी यह सुरक्षित रखती है कि इब्रानी अभिव्यक्ति देहधारी प्राणी-जीवन की छटा भी रखती है।
- issue: לְהִשְׁתַּחֲוֺת को सामान्य 'आराधना करना' या ठोस क्रिया के रूप में प्रस्तुत करना
  choice: दण्डवत् करना
  alternative: आराधना करना
  rationale: मूल क्रिया उपासना के साथ शारीरिक रूप से झुकने को व्यक्त करती है; ठोस क्रिया चुनने से मूल की चित्रात्मकता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज भविष्यसूचक गद्य। 'नए चाँद', 'सब्त', 'दण्डवत्' और 'यहोवा' मूल की धार्मिक तथा मूर्त शब्दावली को बनाए रखते हैं; अस्वाभाविक शाब्दिक स्वामित्व-सूचक संरचना को मुख्य पाठ में न रखकर पादटिप्पणी में स्पष्ट किया गया है।
