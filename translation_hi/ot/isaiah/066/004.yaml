base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/004.yaml
  text: So I also will choose harsh treatment for them[a], and I will bring their fears upon them, because I called and no one answered, I spoke and they did not listen; they did what was evil in my eyes[b], and chose what I did not delight in.
translation:
  language: hi
  text: मैं भी उनके लिए कठोर व्यवहार चुनूँगा[a], और जिन बातों से वे डरते हैं, उन्हें उन पर ले आऊँगा; क्योंकि मैंने पुकारा और किसी ने उत्तर नहीं दिया; मैंने कहा और उन्होंने नहीं सुना। उन्होंने वही किया जो मेरी दृष्टि में बुरा था, और उसी को चुना जिससे मैं प्रसन्न नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उपहासपूर्ण व्यवहार,” “भ्रम” अथवा “मनमाना दुर्व्यवहार।” इब्रानी शब्द का अर्थ अनिश्चित है और यहाँ न्याय के रूप में कठोर या उपहासपूर्ण व्यवहार का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: इसलिए मैं भी
  rationale: यह पद लोगों के चुनाव के प्रत्युत्तर में परमेश्वर के चुनाव को रखता है; ‘इसलिए मैं भी’ उस अनुरूप और न्यायिक प्रत्युत्तर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶבְחַר
  choice: चुनूँगा
  rationale: בחר का सीधा अर्थ ‘चुनना’ है। पद के अंत में लोगों के ‘चुनने’ के साथ एक ही क्रिया रखना मूल की जानबूझकर रची गई विडंबना को सुरक्षित रखता है।
- source_word: בְּתַעֲלֻלֵיהֶם
  choice: उनके लिए कठोर व्यवहार
  rationale: दुर्लभ और कठिन पद न्याय के संदर्भ में कठोर, उपहासपूर्ण अथवा मनमाने व्यवहार को सूचित कर सकता है। ‘कठोर व्यवहार’ दंडात्मक आशय को स्पष्ट रखता है, पर अनिश्चितता के विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: וּמְגוּרֹתָם
  choice: जिन बातों से वे डरते हैं
  rationale: מְגוּרוֹת भय अथवा भय की वस्तु दोनों को सूचित कर सकता है। ‘जिन बातों से वे डरते हैं’ उस आपदा को स्वाभाविक रूप से व्यक्त करता है जिसे परमेश्वर उन पर लाएगा।
- source_word: קָרָאתִי וְאֵין עוֹנֶה
  choice: मैंने पुकारा, पर किसी ने उत्तर नहीं दिया
  rationale: אֵין עוֹנֶה का अर्थ है कि उत्तर देने वाला कोई नहीं था। हिन्दी में ‘किसी ने उत्तर नहीं दिया’ व्यक्तिगत और दोषपूर्ण अस्वीकार को स्पष्ट करता है।
- source_word: דִּבַּרְתִּי וְלֹא שָׁמֵעוּ
  choice: मैंने कहा, पर उन्होंने नहीं सुना
  rationale: שׁמע में सुनने के साथ ध्यान देने या आज्ञा मानने का भाव हो सकता है। ‘नहीं सुना’ मूल की श्रवण-छवि और नैतिक संदर्भ दोनों को बनाए रखता है।
- source_word: וַיַּעֲשׂוּ הָרַע בְּעֵינַי
  choice: उन्होंने वही किया जो मेरी दृष्टि में बुरा था
  rationale: यह मूल की प्रचलित मूल्यांकनात्मक अभिव्यक्ति को सहज और गरिमापूर्ण आधुनिक हिन्दी में रखता है।
- source_word: וּבַאֲשֶׁר לֹא חָפַצְתִּי בָּחָרוּ
  choice: और उसी को चुना जिससे मैं प्रसन्न नहीं था
  rationale: חפץ इच्छा, रुचि और प्रसन्नता का भाव रखता है। ‘जिससे मैं प्रसन्न नहीं था’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता और ‘चुना’ के विरोध को सुरक्षित रखता है।
theological_decisions:
- issue: न्याय में परमेश्वर के प्रत्युत्तर का स्वरूप
  choice: परमेश्वर लोगों के पूर्व चुनाव के अनुरूप उनके लिए दंडात्मक कठोर व्यवहार चुनता है।
  alternative: परमेश्वर उनकी भ्रांतियों या उद्दंड कर्मों को ही चुनता है और उन्हें उन्हीं के हवाले कर देता है।
  rationale: तत्काल संदर्भ और ‘जिन बातों से वे डरते हैं, उन्हें उन पर ले आऊँगा’ का समानांतर वाक्य न्यायात्मक प्रतिफल की ओर संकेत करता है। फिर भी कठिन इब्रानी शब्द के अन्य अर्थ पादटिप्पणी में रखे गए हैं, ताकि वास्तविक अस्पष्टता न मिटे।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। समानांतर वाक्य-विन्यास और ‘चुनूँगा/चुना’ की पुनरावृत्ति मूल के न्यायात्मक प्रत्युत्तर और विडंबना को सुरक्षित रखती है। भय के अर्थ को मुख्य पाठ में स्पष्ट किया गया है; इसके लिए अलग पादटिप्पणी आवश्यक नहीं समझी गई।
