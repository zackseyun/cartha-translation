base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/010.yaml
  text: Rejoice with Jerusalem and be glad in her[a], all you who love her; rejoice with her in joy[b], all you who mourn over her.
translation:
  language: hi
  text: यरूशलेम के साथ आनन्द मनाओ[a] और उसमें मगन हो जाओ, तुम सब जो उससे प्रेम रखते हो; उसके साथ बड़े आनन्द से झूम उठो[b], तुम सब जो उसके लिए शोक मनाते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरूशलेम पर आनन्द मनाओ।” ‘आनन्द मनाओ’ के बाद आया इब्रानी אֶת यरूशलेम को आनन्द का विषय बता सकता है; फिर भी बाद के ‘उसमें’ और ‘उसके साथ’ वाले वाक्यांश साझा आनन्द के अर्थ का समर्थन करते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके साथ हर्षित हो, हर्ष के साथ।” इब्रानी में क्रिया के साथ उसी मूल से बनी संज्ञा रखकर आनन्द पर जोर दिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחוּ אֶת יְרוּשָׁלִַם
  choice: यरूशलेम के साथ आनन्द मनाओ
  rationale: אֶת यहाँ कर्म-चिह्न होकर ‘यरूशलेम पर/के कारण’ आनन्द का संकेत दे सकता है, पर आगे בָהּ और स्पष्ट אִתָּהּ के समानांतर प्रयोग साझा आनन्द की ओर झुकाते हैं।
- source_word: וְגִילוּ בָהּ
  choice: और उसमें मगन हो जाओ
  rationale: גיל उल्लासपूर्ण प्रसन्नता व्यक्त करता है; ‘मगन हो जाओ’ स्वाभाविक हिन्दी है और בָהּ के ‘उसमें’ भाव तथा नगर के स्त्रीलिंग मानवीकरण को बनाए रखता है।
- source_word: כָּל אֹהֲבֶיהָ
  choice: तुम सब जो उससे प्रेम रखते हो
  rationale: कृदन्तीय संबोधन को सीधे और सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: שִׂישׂוּ אִתָּהּ מָשׂוֹשׂ
  choice: उसके साथ आनन्द से झूम उठो
  rationale: अव्यय-संज्ञा का सजातीय प्रयोग तीव्रता देता है; ‘आनन्द से झूम उठो’ हिन्दी में उस जोर और उत्सवी भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָּל הַמִּתְאַבְּלִים עָלֶיהָ
  choice: तुम सब जो उसके लिए शोक मनाते हो
  rationale: התאבל शोक मनाने को और עַל शोक के विषय/कारण को दर्शाता है; ‘उसके लिए’ हिन्दी में यरूशलेम के कारण किए गए शोक को स्पष्ट करता है।
theological_decisions:
- issue: यरूशलेम के साथ या यरूशलेम पर आनन्द
  choice: यरूशलेम के साथ आनन्द मनाओ
  alternative: यरूशलेम पर आनन्द मनाओ
  rationale: इब्रानी אֶת अस्पष्टता की गुंजाइश रखता है, किंतु पद के भीतर ‘उसके साथ’ का स्पष्ट समानांतर साझा हर्ष को अधिक संभावित बनाता है; विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। यरूशलेम का स्त्रीलिंग मानवीकरण ‘उससे/उसमें/उसके साथ’ द्वारा बनाए रखा गया है; तीन आनन्दसूचक क्रियाओं की विविधता और अंतिम वाक्यांश की तीव्रता भी सुरक्षित है।
