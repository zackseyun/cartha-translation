  yaml_path: translation/ot/isaiah/066/021.yaml
  text: And even from them I will take some for priests and for Levites[b][a], says Yahweh.
translation:
  language: hi
  text: “और उनमें से[a] भी मैं कुछ को याजक और लेवी नियुक्त करूँगा,” यहोवा कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उनमें से’ का संकेत पिछले संदर्भ में बताए गए लोगों की ओर है; इब्रानी में उस समूह का नाम यहाँ दोहराया नहीं गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: और … भी
  rationale: यह संयोजन पिछले कथन से संबंध और आश्चर्यपूर्ण समावेश—दोनों को व्यक्त करता है। आधुनिक हिन्दी में ‘और … भी’ स्वाभाविक है।
- source_word: מֵהֶם
  choice: उनमें से
  rationale: מִן का यहाँ समूह में से चयन का भाव है। ‘उनमें से’ मूल के निकट रहते हुए संदर्भ में निहित समूह को अनिर्दिष्ट रखता है।
- source_word: אֶקַּח
  choice: मैं कुछ को … ले लूँगा
  rationale: לקח का मूल अर्थ ‘लेना’ है; ‘कुछ को’ जोड़ने से हिन्दी में מֵהֶם का अंशवाचक भाव स्पष्ट होता है, जबकि चयन/नियुक्ति का प्रसंगगत अर्थ भी बना रहता है।
- source_word: לַכֹּהֲנִים
  choice: याजक … होने के लिए
  rationale: लामेद यहाँ भूमिका के लिए ग्रहण या नियुक्त किए जाने का भाव दे सकता है। यह पदबंध हिन्दी में स्वाभाविक है और ‘के रूप में’ वाले वैकल्पिक अर्थ को टिप्पणी में सुरक्षित रखता है।
- source_word: לַלְוִיִּם
  choice: लेवी होने के लिए
  rationale: समानांतर लामेद को पहले पद के समान भूमिका/पदनाम के अर्थ में लिया गया है। ‘लेवी’ इस वर्ग के सदस्य के लिए प्रचलित हिन्दी रूप है।
- source_word: אָמַר יְהוָה
  choice: यहोवा कहता है
  rationale: भविष्यद्वाणी के सूत्र में पूर्ण क्रिया אָמַר वर्तमान घोषणात्मक अर्थ रखती है। परमेश्वर के नाम को ‘यहोवा’ के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ‘उनमें से’ का संबंध और याजकीय/लेवीय समावेश का दायरा
  choice: सर्वनाम का संबंध स्पष्ट किए बिना ‘उनमें से’ रखा गया है, ताकि पिछले संदर्भ से उसका अर्थ ग्रहण किया जाए।
  alternative: इसे विशेष रूप से राष्ट्रों में से आए लोगों या राष्ट्रों में बसे लौटने वाले इस्राएलियों तक सीमित करके स्पष्ट किया जा सकता था।
  rationale: इब्रानी पद स्वयं पूर्वपद को दोहराता नहीं है। इसलिए अनुवाद किसी एक व्याख्या को पाठ में आरोपित नहीं करता और याजक तथा लेवी बनाए जाने के कथन का धर्मवैज्ञानिक तनाव बनाए रखता है।
- issue: לַכֹּהֲנִים לַלְוִיִּם में भूमिका का स्वरूप
  choice: ‘याजक और लेवी होने के लिए’
  alternative: ‘याजकों और लेवियों के रूप में’ या ‘याजकों और लेवियों के लिए’
  rationale: लामेद नियुक्ति, उद्देश्य या भूमिका का संकेत दे सकता है। मुख्य पाठ स्वाभाविक हिन्दी में भूमिका का भाव देता है, पर टिप्पणी वैकल्पिक संरचना को सुरक्षित रखती है और यह तय नहीं करती कि इन पदनामों को किस सटीक संस्थागत अर्थ में समझा जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘ले लूँगा’ मूल क्रिया की ठोस छवि को बनाए रखता है, जबकि ‘होने के लिए’ चयन और भूमिका का प्रसंगगत भाव स्पष्ट करता है।
