base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/003.yaml
  text: The one who slaughters an ox is like one who strikes down a man[a]; the one who sacrifices a lamb, like one who breaks a dog’s neck; the one who offers a grain offering, like one who offers pig’s blood; the one who makes a memorial offering of frankincense, like one who blesses wickedness. They too have chosen their own ways[b], and their soul delights in their abominations.
translation:
  language: hi
  text: जो बैल का वध करता है, वह मानो मनुष्य को मार गिराता है; जो मेम्ने का बलिदान करता है, वह मानो कुत्ते की गर्दन तोड़ता है; जो अन्नबलि चढ़ाता है, वह मानो सूअर का लहू चढ़ाता है; जो लोबान की स्मरण-भेंट चढ़ाता है, वह मानो दुष्टता को आशीर्वाद देता है[a]। उन्होंने भी अपने ही मार्ग चुन लिए हैं, और उनका मन[b] उनकी घृणित वस्तुओं में आनंद लेता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मानो किसी मूर्ति को आशीर्वाद देता है।’ इब्रानी शब्द का अर्थ दुष्टता, अधर्म, या मूर्तिपूजा से जुड़ी बुराई हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, ‘उनका प्राण उनकी घृणित वस्तुओं में आनंद लेता है’; एकवचन संज्ञा और क्रिया पूरे लोगों के लिए सामूहिक अर्थ में प्रयुक्त हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹחֵט הַשּׁוֹר
  choice: जो बैल का वध करता है
  rationale: इब्रानी कृदंत की सामान्य और चरित्रसूचक शक्ति को ‘जो...करता है’ से रखा गया है; बलिदान के संदर्भ में שׁוֹר के लिए ‘बैल’ स्वाभाविक है।
- source_word: מַכֵּה אִישׁ
  choice: मानो मनुष्य को मार गिराता है
  rationale: מַכֵּה में प्रहार करने से लेकर घात करने तक का अर्थ हो सकता है। ‘मार गिराता है’ हिंसक बल बनाए रखता है, जबकि ‘मानो’ इब्रानी के निहित तुलनात्मक संबंध को स्पष्ट करता है।
- source_word: זוֹבֵחַ הַשֶּׂה
  choice: जो मेम्ने का बलिदान करता है
  rationale: שֶׂה भेड़ या बकरी के बच्चे को सूचित कर सकता है; बलिदान के प्रसंग में ‘मेम्ना’ सहज और उपयुक्त है।
- source_word: עֹרֵף כֶּלֶב
  choice: मानो कुत्ते की गरदन तोड़ता है
  rationale: ערף यहाँ सिर काटने के बजाय गरदन तोड़ने की क्रिया बताता है; अनुवाद उस कठोर और घृणित चित्र को बनाए रखता है।
- source_word: מַעֲלֵה מִנְחָה
  choice: जो अन्नबलि चढ़ाता है
  rationale: उपासना-संबंधी प्रसंग में מִנְחָה के लिए ‘अन्नबलि’ सटीक है और מַעֲלֵה को प्रचलित बलिदानी क्रिया ‘चढ़ाता है’ से व्यक्त किया गया है।
- source_word: דַּם חֲזִיר
  choice: मानो सूअर का लहू चढ़ाता है
  rationale: इब्रानी की संक्षिप्त अभिव्यक्ति और अशुद्धता से जुड़ा चौंकाने वाला प्रभाव दोनों सुरक्षित रखे गए हैं।
- source_word: מַזְכִּיר לְבֹנָה
  choice: जो लोबान की स्मरण-भेंट चढ़ाता है
  rationale: זכר का हिफ़ील रूप बलिदानी प्रयोग में स्मरण कराने वाली भेंट प्रस्तुत करने का भाव रखता है। ‘स्मरण-भेंट’ उस उपासना-संबंधी अर्थ को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: מְבָרֵךְ אָוֶן
  choice: मानो दुष्टता को आशीर्वाद देता है
  rationale: אָוֶן का अर्थ दुष्टता, अनर्थ या मूर्तिपूजक बुराई हो सकता है। ‘दुष्टता’ अर्थ को किसी एक मूर्ति तक सीमित किए बिना नैतिक और उपासना-संबंधी निंदा बनाए रखता है।
- source_word: גַּם הֵמָּה בָּחֲרוּ בְּדַרְכֵיהֶם
  choice: उन्होंने भी अपने ही मार्ग चुन लिए हैं
  rationale: גַּם הֵמָּה का जोर ‘उन्होंने भी’ में और संदर्भ का स्वेच्छाचारी भाव ‘अपने ही मार्ग’ में व्यक्त होता है।
- source_word: וּבְשִׁקּוּצֵיהֶם נַפְשָׁם חָפֵצָה
  choice: और उनका मन उनकी घृणित वस्तुओं से प्रसन्न होता है
  rationale: שִׁקּוּצִים घृणित वस्तुओं या प्रथाओं, प्रायः मूर्तिपूजा से जुड़ी चीज़ों, को दर्शाता है। सामूहिक एकवचन נַפְשָׁם को स्वाभाविक हिन्दी में ‘उनका मन’ कहा गया है और एकवचन क्रिया बनाए रखी गई है।
theological_decisions:
- issue: स्वीकार्य दिखने वाले बलिदानों और घृणित कर्मों के बीच संबंध
  choice: प्रत्येक खंड को ‘मानो’ के द्वारा चौंकाने वाली नैतिक समानता के रूप में प्रस्तुत किया गया है।
  alternative: बिना तुलनासूचक शब्द के दोनों कर्मों को सीधे समान ठहराना।
  rationale: इब्रानी में स्पष्ट तुलनासूचक अव्यय नहीं है, फिर भी समानांतर रचना विद्रोही उपासकों के बलिदानों को हिंसक या निषिद्ध कर्मों के समान घृणित ठहराती है। ‘मानो’ इस संबंध को सहज हिन्दी में व्यक्त करता है, पर यह नहीं समझाता कि परमेश्वर किस प्रक्रिया से उनकी उपासना अस्वीकार करता है।
- issue: אָוֶן का अर्थ
  choice: दुष्टता
  alternative: मूर्ति; अधर्म; बुराई
  rationale: शब्द में मूर्तिपूजा का संकेत संभव है, पर वह अनिवार्य नहीं। ‘दुष्टता’ मूल की व्यापक नैतिक निंदा और अर्थगत अस्पष्टता को सुरक्षित रखता है।
