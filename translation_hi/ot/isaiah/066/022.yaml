  text: כִּ֣י כַ/אֲשֶׁ֣ר הַ/שָּׁמַ֣יִם הַ֠/חֳדָשִׁים וְ/הָ/אָ֨רֶץ הַ/חֲדָשָׁ֜ה אֲשֶׁ֨ר אֲנִ֥י עֹשֶׂ֛ה עֹמְדִ֥ים לְ/פָנַ֖/י נְאֻם יְהוָ֑ה כֵּ֛ן יַעֲמֹ֥ד זַרְעֲ/כֶ֖ם וְ/שִׁמְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/022.yaml
  text: For just as the new heavens and the new earth that I am making shall remain before me[a], declares Yahweh, so your offspring and your name shall remain.
translation:
  language: hi
  text: क्योंकि जैसे नए आकाश और नई पृथ्वी, जिन्हें मैं बना रहा हूँ, मेरे सामने बने रहेंगे[a]—याहवे की यह घोषणा है—वैसे ही तुम्हारा वंश और तुम्हारा नाम भी बना रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे सामने स्थिर खड़े रहेंगे।” इब्रानी क्रिया עמד के दोनों प्रयोगों का अर्थ “खड़ा रहना,” “स्थिर रहना” या “बना रहना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार प्रस्तुत करता है और हिन्दी में कारणसूचक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כַאֲשֶׁר ... כֵּן
  choice: जैसे ... वैसे ही
  rationale: इब्रानी की परस्पर-संबद्ध तुलनात्मक रचना को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַשָּׁמַיִם הַחֳדָשִׁים וְהָאָרֶץ הַחֲדָשָׁה
  choice: नया आकाश और नई पृथ्वी
  rationale: हिन्दी बाइबलीय और सामान्य प्रयोग में ‘आकाश’ सामूहिक अर्थ में स्वाभाविक है; दोनों पदों की निश्चित और नवीन सृष्टि की धारणा सुरक्षित रहती है।
- source_word: עֹשֶׂה
  choice: बना रहा हूँ
  rationale: वर्तमान कृदंत में निहित जारी अथवा आसन्न ईश्वरीय कार्य को व्यक्त करता है, उसे केवल साधारण भविष्य में नहीं बदलता।
- source_word: עֹמְדִים / יַעֲמֹד
  choice: बने रहेंगे / बना रहेगा
  rationale: दोनों स्थानों पर एक ही मूल भाव रखा गया है। निर्जीव सृष्टि तथा वंश और नाम के संदर्भ में यह निरंतर अस्तित्व को स्वाभाविक हिन्दी में व्यक्त करता है; वचन के अनुसार हिन्दी क्रिया-रूप बदला है।
- source_word: לְפָנַי
  choice: मेरे सामने
  rationale: स्थानिक और संबंधपरक दोनों संभावनाओं को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: भविष्यद्वाणी के गंभीर घोषणात्मक सूत्र को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है और परमेश्वर के व्यक्तिगत नाम को लिप्यंतरित करता है।
- source_word: זַרְעֲכֶם
  choice: तुम्हारा वंश
  rationale: इब्रानी सामूहिक एकवचन का स्वाभाविक हिन्दी समतुल्य है और ‘बीज’ की अनपेक्षित शाब्दिकता से बचता है।
- source_word: וְשִׁמְכֶם
  choice: और तुम्हारा नाम
  rationale: इब्रानी के ठोस शब्द ‘नाम’ को बनाए रखता है और उसे केवल ‘यश’ या ‘कीर्ति’ तक सीमित नहीं करता।
theological_decisions:
- issue: ‘नया आकाश और नई पृथ्वी’ का युगांत-संबंधी आशय
  choice: ब्रह्मांडीय नवीनीकरण की अभिव्यक्ति को सीधे रूप में बनाए रखा गया है।
  alternative: इसे केवल भावी भौतिक सृष्टि या केवल वाचा-व्यवस्था की रूपकात्मक बहाली के रूप में स्पष्ट करना।
  rationale: इब्रानी पाठ स्वयं इन व्याख्यात्मक विकल्पों को यहाँ निर्णायक रूप से सीमित नहीं करता; इसलिए उसकी व्यापकता और तनाव सुरक्षित रखा गया है।
- issue: ‘तुम्हारा वंश और तुम्हारा नाम’ की स्थिरता का दायरा
  choice: लोगों के वंश और नाम के बने रहने की प्रतिज्ञा को बिना उसका समुदायगत दायरा तय किए प्रस्तुत किया गया है।
  alternative: इसे केवल जातीय इस्राएल, केवल विश्वासयोग्य बचे हुओं, या व्यापक युगांतकालीन परमेश्वर की प्रजा पर लागू करना।
  rationale: पद स्थायी निरंतरता की प्रतिज्ञा करता है, पर उसके पूर्ण धर्मवैज्ञानिक दायरे को स्पष्ट नहीं करता; अनुवाद किसी सांप्रदायिक निष्कर्ष को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज पर गरिमापूर्ण रखी गई है। ‘जैसे ... वैसे ही’ से मूल तुलना संरक्षित है; ‘बना रहना’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पाद-टिप्पणी मूल क्रिया की अधिक शाब्दिक संभावना बताती है।
