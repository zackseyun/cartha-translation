base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/011.yaml
  text: so that you may nurse and be satisfied from her comforting breast[c][b][a], so that you may drink deeply and delight yourselves from the abundance of her glory.
translation:
  language: hi
  text: ताकि तुम उसके सांत्वना देनेवाले स्तन से दूध पीकर तृप्त हो जाओ,[a] ताकि तुम उसकी महिमा की भरपूरी[c] से भरपूर पीओ[b] और आनंद लो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में अधिक शाब्दिक रूप से: ‘उसकी सांत्वनाओं के स्तन से।’'
    reason: lexical_alternative
  - marker: b
    text: या ‘चूसकर निकालो’ अथवा ‘खींचकर पीओ’; इब्रानी क्रिया स्तनपान के सजीव बिंब को आगे बढ़ाती है।
    reason: lexical_alternative
  - marker: c
    text: ‘भरपूरी’ के लिए प्रयुक्त इब्रानी संज्ञा का अर्थ ‘प्रचुरता’ या ‘उमड़ती बहुतायत’ भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: ताकि
  rationale: दोनों उपवाक्यों में प्रयोजन अथवा परिणाम का भाव है; ‘ताकि’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: תִּינְקוּ
  choice: दूध पीकर
  rationale: क्रिया ינק शिशु के स्तन से दूध पीने को दर्शाती है। हिन्दी में यह स्वाभाविक रूप से मातृत्व और पोषण का बिंब बनाए रखती है।
- source_word: וּשְׂבַעְתֶּם
  choice: तृप्त हो जाओ
  rationale: שׂבע का अर्थ भर जाना या तृप्त होना है; यह पोषण से प्राप्त संतुष्टि को स्पष्ट करता है।
- source_word: מִשֹּׁד תַּנְחֻמֶיהָ
  choice: उसकी सांत्वना भरी छाती से
  rationale: शाब्दिक संरचना ‘उसकी सांत्वनाओं के स्तन से’ हिन्दी में अस्वाभाविक है। चुना हुआ रूप स्तनपान और सांत्वना दोनों को सहज भाषा में सुरक्षित रखता है।
- source_word: תָּמֹצּוּ
  choice: जी भरकर पीओ
  rationale: यह सजीव क्रिया चूसकर निकालने या गहराई से पीने का भाव देती है। ‘जी भरकर पीओ’ गहन और भरपूर ग्रहण करने का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है; अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וְהִתְעַנַּגְתֶּם
  choice: और आनंदित हो
  rationale: हित्पएल रूप स्वयं आनंद लेने अथवा अत्यंत प्रसन्न होने का भाव देता है। ‘आनंदित हो’ गरिमापूर्ण और सुबोध है।
- source_word: מִזִּיז
  choice: की भरपूरी से
  rationale: זִיז यहाँ कठिन और दुर्लभ संज्ञा है, जिसका आशय भरपूरी, प्रचुरता या उमड़ती बहुतायत हो सकता है। ‘भरपूरी’ इस अनिश्चितता को अत्यधिक संकीर्ण किए बिना समानांतर पोषण-बिंब के अनुकूल है।
- source_word: כְּבוֹדָהּ
  choice: उसकी महिमा
  rationale: כבוד महिमा, वैभव या सम्मान को सूचित कर सकता है। यशायाह के प्रसंग में ‘महिमा’ उपयुक्त और पारंपरिक होते हुए भी आधुनिक पाठक के लिए स्पष्ट है।
theological_decisions:
- issue: यरूशलेम/सिय्योन का मातृरूपक
  choice: यरूशलेम को दूध पिलाने और सांत्वना देनेवाली माता के रूप में प्रस्तुत करनेवाले बिंब को सीधे बनाए रखा गया है।
  alternative: इसे केवल परमेश्वर की अमूर्त सांत्वना के रूप में व्यक्त करना।
  rationale: आसपास का प्रसंग यरूशलेम को माता के रूप में मानवीकृत करता है। अनुवाद इस बिंब को न तो अमूर्त बनाता है, न पाठ से आगे जाकर उसका सांप्रदायिक अर्थ निर्धारित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मातृ-पोषण का ठोस बिंब सुरक्षित है, जबकि कठिन इब्रानी पदों के वैकल्पिक अर्थ पादटिप्पणियों में दिए गए हैं।
