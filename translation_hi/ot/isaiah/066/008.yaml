  text: מִֽי שָׁמַ֣ע כָּ/זֹ֗את מִ֤י רָאָה֙ כָּ/אֵ֔לֶּה הֲ/י֤וּחַל אֶ֨רֶץ֙ בְּ/י֣וֹם אֶחָ֔ד אִם יִוָּ֥לֵֽד גּ֖וֹי פַּ֣עַם אֶחָ֑ת כִּֽי חָ֛לָה גַּם יָלְדָ֥ה צִיּ֖וֹן אֶת בָּנֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/008.yaml
  text: Who has heard such a thing? Who has seen things like these? Can a land be brought forth in one day? Can a nation be born all at once? For Zion was in labor and also gave birth to her children[a].
translation:
  language: hi
  text: 'ऐसी बात किसने सुनी है?


    ऐसी बातें किसने देखी हैं?


    क्या एक देश को एक ही दिन में जन्म दिया जा सकता है?


    क्या कोई राष्ट्र एक ही बार में जन्म ले सकता है?


    क्योंकि सिय्योन प्रसव-पीड़ा में थी


    और उसने अपने बच्चों[a] को भी जन्म दिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “उसके पुत्र।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּזֹאת
  choice: ऐसी बात
  rationale: एकवचन संकेतवाचक रूप और ‘सुनने’ के साथ स्वाभाविक हिन्दी प्रयोग—दोनों सुरक्षित रहते हैं।
- source_word: כָּאֵלֶּה
  choice: ऐसी बातें
  rationale: मूल के बहुवचन को बनाए रखते हुए पहली पंक्ति के साथ काव्यात्मक समानांतरता रखता है।
- source_word: הֲיוּחַל אֶרֶץ
  choice: क्या एक ही दिन में किसी देश को जन्म दिया जा सकता है?
  rationale: חול का रूप यहाँ प्रसव और उत्पत्ति के बिंब में निष्क्रिय अर्थ देता है। ‘जन्म दिया जा सकता है’ हिन्दी में स्वाभाविक है और भूमि/देश के उत्पन्न होने की असाधारणता प्रकट करता है।
- source_word: אֶרֶץ
  choice: देश
  rationale: यहाँ ‘राष्ट्र’ के समानांतर एक भू-राजनीतिक क्षेत्र अभिप्रेत है; ‘पृथ्वी’ से अनावश्यक वैश्विक अर्थ पैदा होता।
- source_word: בְּיוֹם אֶחָד
  choice: एक ही दिन में
  rationale: समय की संक्षिप्तता और बलाघात दोनों स्पष्ट करता है।
- source_word: אִם יִוָּלֵד גּוֹי
  choice: क्या कोई राष्ट्र जन्म ले सकता है
  rationale: रूपक में राष्ट्र स्वयं जन्म लेता है; प्रश्नवाचक אִם को हिन्दी में ‘क्या’ से स्वाभाविक रूप मिला है।
- source_word: גּוֹי
  choice: राष्ट्र
  rationale: ‘देश’ से भेद रखते हुए सामूहिक जन-राजनीतिक इकाई का अर्थ व्यक्त करता है और ‘जाति’ के आधुनिक सामाजिक अर्थ से बचता है।
- source_word: פַּעַם אֶחָת
  choice: एक ही बार में
  rationale: एक साथ और एक ही अवसर पर घटित जन्म की आश्चर्यजनक तात्कालिकता व्यक्त करता है, बिना ‘एक क्षण में’ जैसा अतिरिक्त समयार्थ जोड़े।
- source_word: כִּי
  choice: क्योंकि
  rationale: अंतिम कथन को पूर्ववर्ती आलंकारिक प्रश्नों के कारण या आधार के रूप में जोड़ता है।
- source_word: חָלָה
  choice: प्रसव-पीड़ा हुई
  rationale: प्रसव के स्पष्ट रूपक को वर्तमान, गरिमापूर्ण और सहज हिन्दी में बनाए रखता है।
- source_word: גַּם יָלְדָה
  choice: जन्म भी दे दिया
  rationale: גַּם के ‘भी’ को स्पष्ट रखता है; ‘दे दिया’ पूर्ण हुई क्रिया और अप्रत्याशित परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है, पर ‘जैसे ही’ नहीं जोड़ता।
- source_word: צִיּוֹן
  choice: सिय्योन
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय रूप रखते हुए मातृरूप मानवीकरण सुरक्षित रहता है।
- source_word: בָּנֶיהָ
  choice: अपने बच्चों
  rationale: पुल्लिंग बहुवचन का सन्दर्भ सामूहिक संतान से है; ‘बच्चों’ से आशय स्वाभाविक रूप में आता है, जबकि शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: सिय्योन का प्रसव करती माता के रूप में मानवीकरण
  choice: सिय्योन को प्रसव-पीड़ा सहने और अपनी संतान को जन्म देने वाली माता के रूप में प्रत्यक्ष रखा गया है।
  alternative: रूपक को केवल राष्ट्रीय पुनर्स्थापना के अमूर्त कथन में बदलना।
  rationale: इब्रानी पाठ मातृत्व और प्रसव का स्पष्ट रूपक इस्तेमाल करता है; उसे अमूर्त करना मूल की काव्यात्मक और धर्मवैचारिक तनावपूर्ण शक्ति घटा देता।
- issue: בָּנֶיהָ में व्याकरणिक पुल्लिंग
  choice: मुख्य पाठ में ‘अपने बच्चों’
  alternative: ‘अपने पुत्रों’
  rationale: सन्दर्भ सिय्योन की सामूहिक संतान का है, केवल पुरुष वंशजों का नहीं; शाब्दिक पुल्लिंग विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, काव्यात्मक किन्तु सहज और गरिमापूर्ण रखी गई है। आलंकारिक प्रश्नों की पुनरावृत्ति, देश और राष्ट्र का समानांतर, तथा प्रसव का रूपक सुरक्षित हैं। मूल में निहित न होने के कारण ‘जैसे ही’ या ‘तुरन्त’ नहीं जोड़ा गया है।
