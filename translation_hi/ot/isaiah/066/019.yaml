  yaml_path: translation/ot/isaiah/066/019.yaml
  text: And I will set a sign among them[a], and from them I will send survivors to the nations—to Tarshish, Pul, and Lud, who draw the bow; to Tubal and Javan[d][c][b]; to the distant coastlands that have not heard my report and have not seen my glory—and they will declare my glory among the nations.
translation:
  language: hi
  text: और मैं उनके बीच एक चिन्ह रखूँगा[a]। फिर मैं उन्हीं में से बचे हुओं को राष्ट्रों के पास भेजूँगा—तर्शीश, पूल और लूद के पास, जो धनुष खींचते हैं[b]; तूबल और यावान के पास; और उन दूर-दराज के तटवर्ती प्रदेशों के पास[c], जिन्होंने न मेरी चर्चा सुनी है[d], न मेरी महिमा देखी है। वे राष्ट्रों के बीच मेरी महिमा की घोषणा करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उनके बीच’ के लिए ‘उनमें’ या ‘उन पर’ भी संभव है; इब्रानी संबंधबोधक उपसर्ग में ये विभिन्न भाव हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: ‘जो धनुष खींचते हैं’ संभवतः विशेष रूप से लूद का वर्णन करता है; इसे सामान्य रूप से ‘धनुर्धर’ भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘दूर-दराज के द्वीप’; इब्रानी शब्द द्वीपों या समुद्रतटीय प्रदेशों, दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: या ‘मेरी कीर्ति’ अथवा ‘मेरा समाचार नहीं सुना है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: और मैं ... ठहराऊँगा
  rationale: שׂים का अर्थ रखना, स्थापित करना या ठहराना है। ‘चिन्ह ठहराऊँगा’ सोद्देश्य दैवी कार्य को गरिमापूर्ण और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בָהֶם
  choice: उनके बीच
  rationale: ב का अर्थ यहाँ ‘में/पर/बीच’ हो सकता है। सामूहिक संदर्भ में ‘उनके बीच’ सबसे स्वाभाविक है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: אוֹת
  choice: एक चिन्ह
  rationale: אוֹת चिन्ह, निशान या संकेत हो सकता है। ‘चिन्ह’ उसके स्वरूप को अनिर्धारित रखता है।
- source_word: מֵהֶם פְּלֵיטִים
  choice: उन्हीं में से बचे हुओं को
  rationale: פְּלֵיטִים वे लोग हैं जो बच निकले या जीवित बचे हैं। ‘बचे हुए’ आधुनिक हिन्दी में सहज है और מֵהֶם के स्रोत-संबंध को बनाए रखता है।
- source_word: אֶל הַגּוֹיִם
  choice: जाति-जाति के लोगों के पास
  rationale: גּוֹיִם यहाँ विदेशी राष्ट्रों या लोगों के व्यापक समूहों को सूचित करता है। यह रूप केवल राजनीतिक राज्यों तक अर्थ को सीमित नहीं करता।
- source_word: תַּרְשִׁישׁ פּוּל וְלוּד ... תֻּבַל וְיָוָן
  choice: तर्शीश, पूल और ... लूद ... तूबल और यावान
  rationale: स्थान अथवा जनसमूह के नामों को हिन्दी ध्वन्यात्मक रूप में लिप्यंतरित किया गया है। WLC के पाठ ‘पूल’ को आधार बनाया गया है।
- source_word: מֹשְׁכֵי קֶשֶׁת
  choice: धनुष खींचनेवाले
  rationale: यह मूल चित्र को ‘धनुर्धर’ में संक्षिप्त किए बिना बनाए रखता है और निकटतम नाम लूद का विशेषण स्वाभाविक रूप से माना गया है।
- source_word: הָאִיִּים הָרְחֹקִים
  choice: दूर-दराज के तटवर्ती प्रदेश
  rationale: אִיִּים द्वीपों अथवा समुद्रतटीय भूभागों का द्योतक हो सकता है। ‘तटवर्ती प्रदेश’ व्यापक अर्थ रखता है; ‘द्वीप’ पादटिप्पणी में दिया गया है।
- source_word: אֲשֶׁר לֹא שָׁמְעוּ אֶת שִׁמְעִי
  choice: जिन्होंने ... मेरी ख्याति का समाचार नहीं सुना है
  rationale: שִׁמְעִי उस समाचार, चर्चा या ख्याति को सूचित करता है जो वक्ता के विषय में सुनी जाती है। यह हिन्दी रूप ‘समाचार’ और ‘ख्याति’ दोनों भावों को साथ रखता है।
- source_word: וְהִגִּידוּ אֶת כְּבוֹדִי
  choice: वे ... मेरी महिमा का वर्णन करेंगे
  rationale: נגד के हिफ़ील रूप का अर्थ बताना या घोषित करना है। ‘वर्णन करेंगे’ सामान्य पाठक के लिए स्वाभाविक है और सार्वजनिक घोषणा का भाव रखता है।
theological_decisions:
- issue: लोगों के बीच ठहराए जाने वाले दैवी चिन्ह का स्वरूप
  choice: सामान्य शब्द ‘चिन्ह’ रखा गया है।
  alternative: शरीर पर निशान, चमत्कारी संकेत या ध्वजा-जैसा चिन्ह
  rationale: इब्रानी पाठ चिन्ह का स्वरूप स्पष्ट नहीं करता; किसी खास रूप को चुनना पाठ से आगे जाना होगा।
- issue: ‘उनके’ और ‘उन्हीं में से’ का संदर्भ
  choice: सर्वनामों को बिना किसी समूह का नाम जोड़े रखा गया है।
  alternative: उन्हें इस्राएल, यहूदा, उपासकों या न्याय से बचे लोगों के रूप में स्पष्ट करना
  rationale: निकटवर्ती संदर्भ संभावित पहचान सुझा सकता है, पर इस पद में समूह को फिर से नाम नहीं दिया गया है।
- issue: धनुष खींचनेवालों का संबंध
  choice: इसे निकटतम नाम लूद से जोड़ा गया है।
  alternative: इसे सभी पूर्ववर्ती समूहों का सामान्य वर्णन अथवा स्वतंत्र ‘धनुर्धर’ समूह मानना
  rationale: व्याकरण और शब्दक्रम लूद से संबंध को सबसे स्वाभाविक बनाते हैं, पर वास्तविक अस्पष्टता पादटिप्पणी में दर्ज है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध रखी गई है। लंबी इब्रानी सूची को विरामचिह्नों और दो वाक्यों की सहायता से स्पष्ट किया गया है। ‘जाति-जाति के लोग’ विदेशी जनसमूहों की व्यापकता व्यक्त करता है और अनावश्यक सांप्रदायिक अर्थ से बचाता है।
