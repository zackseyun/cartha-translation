base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/013.yaml
  text: As one whom his mother comforts[a], so I will comfort you; and in Jerusalem you will be comforted.
translation:
  language: hi
  text: जैसे किसी पुरुष[a] को उसकी माँ सांत्वना देती है, वैसे ही मैं तुम्हें सांत्वना दूँगा; और यरूशलेम में तुम्हें सांत्वना मिलेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसे किसी को उसकी माँ सांत्वना देती है।” इब्रानी में “पुरुष” (אִישׁ) है, जिसका यहाँ प्रतिनिधि अर्थ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּאִישׁ
  choice: जैसे किसी पुरुष को
  rationale: אִישׁ व्याकरण की दृष्टि से पुल्लिंग एकवचन है और उपमा का प्रतिनिधि पात्र प्रस्तुत करता है। ‘किसी पुरुष को’ स्रोत की लैंगिक अभिव्यक्ति रखते हुए स्वाभाविक हिन्दी बनाता है।
- source_word: אִמּוֹ
  choice: उसकी माँ
  rationale: संज्ञा के साथ लगा तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय स्पष्ट रूप से स्वामित्व व्यक्त करता है और मातृ-सांत्वना की आत्मीय छवि बनाए रखता है।
- source_word: תְּנַחֲמֶנּוּ
  choice: सांत्वना देती है
  rationale: נחם के पिएल रूप में सक्रिय सांत्वना देने का भाव है। यह चयन इसी धातु की पूरे पद में हुई पुनरावृत्ति को भी स्पष्ट रखता है।
- source_word: כֵּן
  choice: वैसे ही
  rationale: यह उपमा के उत्तरार्ध को आरम्भ करता है; ‘वैसे ही’ हिन्दी में तुलना को स्पष्ट और स्वाभाविक ढंग से जोड़ता है।
- source_word: אָנֹכִי
  choice: मैं
  rationale: स्वतंत्र सर्वनाम वक्ता पर बल देता है। हिन्दी में व्यक्त ‘मैं’ और निकट का ‘ही’ इस बल को बिना अनावश्यक भारीपन के संप्रेषित करते हैं।
- source_word: אֲנַחֶמְכֶם
  choice: तुम्हें सांत्वना दूँगा
  rationale: यह נחם का सक्रिय रूप और द्वितीय पुरुष बहुवचन कर्म है। चयन दिव्य प्रतिज्ञा और मुख्य शब्द की पुनरावृत्ति दोनों को बनाए रखता है।
- source_word: וּבִירוּשָׁלַם
  choice: और यरूशलेम में
  rationale: בְּ यहाँ स्थान सूचित करता है; ‘यरूशलेम में’ प्रतिज्ञात सांत्वना का स्थानीय संदर्भ सुरक्षित रखता है।
- source_word: תְּנֻחָמוּ
  choice: तुम्हें सांत्वना मिलेगी
  rationale: निफाल रूप का निष्क्रिय भाव स्वाभाविक हिन्दी में व्यक्त होता है और נחם की शब्दगत पुनरावृत्ति भी बनी रहती है।
theological_decisions:
- issue: उपमा में प्रतिनिधि पुल्लिंग भाषा
  choice: मुख्य पाठ में ‘पुरुष’ रखा गया
  alternative: जैसे किसी को उसकी माँ सांत्वना देती है
  rationale: इब्रानी אִישׁ स्पष्ट रूप से पुल्लिंग एकवचन है, पर उपमा का आशय प्रतिनिधि भी हो सकता है। मुख्य पाठ स्रोत का रूप रखता है और पादटिप्पणी स्वाभाविक व्यापक अर्थ बताती है।
- issue: यरूशलेम में सांत्वना का निष्क्रिय कथन
  choice: ‘तुम्हें सांत्वना मिलेगी’
  alternative: ‘तुम्हें सांत्वना दी जाएगी’
  rationale: पहला रूप इब्रानी निफाल के निष्क्रिय अर्थ को स्वाभाविक हिन्दी में रखता है, जबकि सांत्वना देने वाले की पहचान को पाठ में आवश्यकता से अधिक स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘सांत्वना’ की तीनfold पुनरावृत्ति इब्रानी נחם की पुनरावृत्ति को यथासंभव बनाए रखती है; ‘तुम्हें’ संबोधित समुदाय के बहुवचन भाव के अनुकूल है।
