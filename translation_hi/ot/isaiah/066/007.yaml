base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/007.yaml
  text: Before she was in labor[a], she gave birth; before pain came upon her[b], she delivered a son.
translation:
  language: hi
  text: प्रसव-पीड़ा[a] शुरू होने से पहले उसने[b] जन्म दिया; प्रसव-पीड़ा उसे होने से पहले उसने एक पुत्र को जन्म दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘प्रसव-वेदनाएँ आने से पहले।’
    reason: lexical_alternative
  - marker: b
    text: यह स्त्रीलिंग संदर्भ आसपास के प्रसंग में सिय्योन/यरूशलेम की ओर संकेत करता है।
    reason: cross_reference
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: से पहले
  rationale: कालवाचक अर्थ ‘इससे पहले कि’ है; दोनों उपवाक्यों में इसकी पुनरावृत्ति मूल के बलाघात को बनाए रखती है।
- source_word: תָּחִיל
  choice: प्रसव-पीड़ा उठने
  rationale: חול का यहाँ अर्थ प्रसव के समय पीड़ा या छटपटाहट आरम्भ होना है। आधुनिक हिन्दी में यह प्रसंगानुकूल और स्पष्ट है।
- source_word: יָלָדָה
  choice: उसने जन्म दिया
  rationale: यह जन्म देने की सामान्य क्रिया है; सरल हिन्दी मूल अर्थ को सीधे व्यक्त करती है।
- source_word: יָבוֹא חֵבֶל לָהּ
  choice: पीड़ा उस पर आने
  rationale: חֵבֶל यहाँ प्रसव की पीड़ा है और לָהּ बताता है कि पीड़ा उस स्त्री पर आती है। ‘उस पर आने’ इस रचना को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: וְהִמְלִיטָה
  choice: उसने ... को जन्म दिया
  rationale: מלט का हिफ़ील रूप यहाँ बच्चे को जन्म देने या उत्पन्न करने का अर्थ देता है। हिन्दी में ‘जन्म दिया’ सबसे स्वाभाविक है, यद्यपि इससे पहले वाली क्रिया की पुनरावृत्ति होती है।
- source_word: זָכָר
  choice: एक पुत्र
  rationale: शाब्दिक अर्थ ‘नर’ है; मानव-जन्म के संदर्भ में ‘पुत्र’ स्वाभाविक है और मूल की पुरुष-लिंग विशिष्टता बनाए रखता है।
theological_decisions:
- issue: स्त्री का अभिप्रेत संदर्भ
  choice: मुख्य पाठ में केवल स्त्रीलिंग क्रियाओं और ‘उस’ का प्रयोग किया गया है
  alternative: मुख्य पाठ में ‘सिय्योन’ या ‘यरूशलेम’ लिखना
  rationale: आस-पास का प्रसंग सिय्योन/यरूशलेम की ओर संकेत करता है, पर इस पद में उसका नाम नहीं है। इसलिए बिंब और निहित संदर्भ को बिना निर्णायक व्याख्यात्मक जोड़ के सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रसव-पीड़ा’ ने childbirth context स्पष्ट किया है; स्त्री का नाम मुख्य पाठ में न जोड़कर मूल की निहितता सुरक्षित रखी गई है।
