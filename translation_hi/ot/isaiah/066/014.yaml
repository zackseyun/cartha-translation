source:
  edition: WLC
  text: וּ/רְאִיתֶם֙ וְ/שָׂ֣שׂ לִבְּ/כֶ֔ם וְ/עַצְמוֹתֵי/כֶ֖ם כַּ/דֶּ֣שֶׁא תִפְרַ֑חְנָה וְ/נוֹדְעָ֤ה יַד יְהוָה֙ אֶת עֲבָדָ֔י/ו וְ/זָעַ֖ם אֶת אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/014.yaml
  text: You will see[a], and your heart will rejoice; your bones will flourish like the grass. The hand of Yahweh will be made known to his servants, and he will be indignant against his enemies.
translation:
  language: hi
  text: तुम देखोगे और तुम्हारा हृदय आनन्दित होगा; तुम्हारी हड्डियाँ हरी घास के समान पनपेंगी। याहवे का हाथ उसके सेवकों के लिए प्रकट होगा, और[a] वह अपने शत्रुओं पर क्रोधित होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परन्तु वह अपने शत्रुओं पर क्रोधित होगा।” हिब्रू संयोजक का सीधा अर्थ “और” है; “परन्तु” सेवकों के प्रति अनुकूलता और शत्रुओं के प्रति रोष के प्रसंगगत विरोध को व्यक्त करता है।
    reason: संयोजक के संभावित प्रसंगगत विरोधसूचक अनुवाद को सूचित करना, बिना उसे मूल का अनिवार्य अर्थ ठहराए।
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: तुम देखोगे
  rationale: संयोजक वाव सहित कालरूप भविष्यसूचक प्रसंग में भावी परिणाम व्यक्त करता है। कर्म को अनिर्दिष्ट रखकर मूल की संक्षिप्तता बनाए रखी गई है।
- source_word: וְשָׂשׂ לִבְּכֶם
  choice: तुम्हारा हृदय आनन्दित होगा
  rationale: हिब्रू के भावात्मक मुहावरे को स्वाभाविक और गरिमापूर्ण हिन्दी में रखा गया है।
- source_word: וְעַצְמוֹתֵיכֶם
  choice: तुम्हारी हड्डियाँ
  rationale: ‘हड्डियाँ’ का सजीव बिम्ब गहरे, देहगत नवीकरण को दर्शाता है; इसे अमूर्त भाव में नहीं बदला गया।
- source_word: כַּדֶּשֶׁא תִפְרַחְנָה
  choice: हरी घास के समान पनपेंगी
  rationale: דֶּשֶׁא हरी वनस्पति या घास और פרח अंकुरित होने तथा फलने-फूलने का भाव देता है। ‘पनपेंगी’ इस बिम्ब को सहज हिन्दी में व्यक्त करता है।
- source_word: וְנוֹדְעָה יַד יְהוָה
  choice: याहवे का हाथ ... प्रकट होगा
  rationale: ידע का निफ़अल रूप प्रकट या विदित होने का परिणामसूचक भाव रखता है। ‘हाथ’ को परमेश्वर की सक्रिय सामर्थ्य और हस्तक्षेप के बाइबलीय बिम्ब के रूप में सुरक्षित रखा गया है।
- source_word: אֶת עֲבָדָיו
  choice: उसके सेवकों के लिए
  rationale: यह वाक्यांश याहवे के हाथ के सेवकों के संबंध में, उनकी ओर अथवा उनके पक्ष में प्रकट होने को दर्शा सकता है। प्रसंगगत अनुकूलता को स्वाभाविक हिन्दी में व्यक्त करते हुए विशिष्ट कार्य का अनावश्यक विस्तार नहीं किया गया।
- source_word: וְזָעַם
  choice: और वह ... क्रोध करेगा
  rationale: क्रिया रोष या प्रकोप व्यक्त करती है। ‘क्रोध करेगा’ आधुनिक हिन्दी में स्पष्ट है और मूल से अधिक विशिष्ट दंडात्मक कार्य नहीं जोड़ता।
- source_word: אֶת אֹיְבָיו
  choice: अपने शत्रुओं पर
  rationale: लक्षित शत्रुओं के विरुद्ध रोष को हिन्दी के स्वाभाविक परसर्ग ‘पर’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा-संबंधी विशिष्ट नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और इसे सामान्य उपाधि में नहीं बदलता।
- issue: अंतिम वाक्यांश में וְ का संबंध
  choice: और
  alternative: परन्तु
  rationale: हिब्रू संयोजक का सीधा अर्थ ‘और’ है। सेवकों और शत्रुओं के साथ व्यवहार में प्रसंगगत विरोध अवश्य है, इसलिए ‘परन्तु’ संभव है, पर उसे मुख्य पाठ में अनिवार्य नहीं बनाया गया।
- issue: याहवे के हाथ का सेवकों से संबंध
  choice: उसके सेवकों के लिए प्रकट होगा
  alternative: उसके सेवकों पर प्रकट होगा; उसके सेवकों के बीच जाना जाएगा
  rationale: אֶת यहाँ संबंध या दिशा की कुछ अस्पष्टता रखता है। संदर्भ सेवकों के प्रति अनुकूल हस्तक्षेप सुझाता है, पर उसके स्वरूप को परिभाषित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण स्तर अपनाया गया है। ‘हृदय’, ‘हड्डियाँ’ और ‘हाथ’ जैसे मूल बिम्ब सुरक्षित रखे गए हैं; वाक्य को सहज बनाने के लिए केवल आवश्यक हिन्दी परसर्ग जोड़े गए हैं।
