id: ISA.66.2
reference: Isaiah 66:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֶת כָּל אֵ֨לֶּה֙ יָדִ֣/י עָשָׂ֔תָה וַ/יִּהְי֥וּ כָל אֵ֖לֶּה נְאֻם יְהוָ֑ה וְ/אֶל זֶ֣ה אַבִּ֔יט אֶל עָנִי֙ וּ/נְכֵה ר֔וּחַ וְ/חָרֵ֖ד עַל דְּבָרִֽ/י־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/002.yaml
  text: 'My hand made all these things[a], and so all these things came to be, declares Yahweh. But to this one I will look: to the poor and contrite in spirit, and the one who trembles at my word.'
translation:
  language: hi
  text: '“इन सबको मेरे हाथ ने बनाया,

    और इस प्रकार ये सब अस्तित्व में आए,”

    याहवे की यह घोषणा है।


    “पर मैं ऐसे व्यक्ति पर दृष्टि करूँगा:

    जो दीन और मन से टूटा हुआ है[a],

    और जो मेरे वचन से थरथराता है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पीड़ित और मन से कुचला हुआ।”
    reason: עָנִי का अर्थ ‘पीड़ित’ भी हो सकता है, और נְכֵה־רוּחַ अधिक शाब्दिक रूप से भीतर से आहत या कुचला हुआ व्यक्ति दर्शाता है। यह वैध शाब्दिक विकल्प सुरक्षित रखता है।
lexical_decisions:
- source_word: יָדִי עָשָׂתָה
  choice: मेरे हाथ ने बनाया
  rationale: इब्रानी के मानवरूपी चित्र को बनाए रखता है और पूर्ण हो चुके सृजन-कार्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל אֵלֶּה
  choice: इन सबको / ये सब
  rationale: बहुवचन संकेतवाचक पद पिछले पद में आए आकाश और पृथ्वी सहित सृष्ट वस्तुओं की ओर संकेत करता है; हिन्दी में अलग से ‘वस्तुएँ’ जोड़ना आवश्यक नहीं।
- source_word: וַיִּהְיוּ
  choice: अस्तित्व में आए
  rationale: क्रिया यहाँ सृजन के परिणामस्वरूप अस्तित्व में आने का भाव देती है; यह केवल ‘थे’ कहने से अधिक स्पष्ट है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह वाणी है
  rationale: गंभीर भविष्यद्वक्ताई सूत्र को स्वाभाविक हिन्दी में रखता है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ से प्रस्तुत करता है।
- source_word: וְאֶל־זֶה אַבִּיט
  choice: पर मैं उसी पर दृष्टि करूंगा
  rationale: वाव का विरोधसूचक भाव तथा किसी व्यक्ति की ओर अनुग्रहपूर्ण ध्यान देने का इब्रानी मुहावरा दोनों सुरक्षित रहते हैं।
- source_word: עָנִי
  choice: दीन
  rationale: यह शब्द गरीब, पीड़ित अथवा नम्र व्यक्ति को सूचित कर सकता है। ‘दीन’ इस अर्थ-परास और प्रसंग के विनम्रता-भाव को संक्षेप में बनाए रखता है।
- source_word: נְכֵה־רוּחַ
  choice: मन से टूटा हुआ
  rationale: शाब्दिक रूप से आहत या कुचली हुई आत्मा का भाव है। ‘मन से टूटा हुआ’ साधारण आधुनिक हिन्दी में स्वाभाविक है और भीतरी टूटन को व्यक्त करता है।
- source_word: חָרֵד עַל־דְּבָרִי
  choice: मेरे वचन से थरथराता है
  rationale: परमेश्वर के वचन के सामने भयमिश्रित श्रद्धा और गहरी संवेदनशीलता को व्यक्त करता है; एकवचन ‘वचन’ इब्रानी के अनुरूप है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे सामान्य उपाधि में बदले बिना वाचा-नाम के रूप में सुरक्षित रखता है।
- issue: וְאֶל־זֶה אַבִּיט में ‘दृष्टि करने’ का भाव
  choice: अनुग्रहपूर्ण ध्यान का संकेत रखते हुए शाब्दिक मुहावरा ‘दृष्टि करूंगा’
  alternative: उसकी सुधि लूंगा / उस पर कृपादृष्टि करूंगा
  rationale: प्रसंग अनुकूल दृष्टि का संकेत देता है, पर मूल क्रिया केवल ‘देखना/दृष्टि करना’ कहती है। इसलिए अनुग्रह को पाठ में अत्यधिक स्पष्ट करके अस्पष्टता समाप्त नहीं की गई।
- issue: עָנִי וּנְכֵה־רוּחַ का संबंध
  choice: दीन और मन से टूटा हुआ
  alternative: पीड़ित और आत्मा में कुचला हुआ
  rationale: दोनों विशेषण एक ही व्यक्ति का वर्णन करते हैं। मुख्य पाठ सहज हिन्दी रखता है, जबकि पादटिप्पणी मूल के अधिक शारीरिक और पीड़ा-संबंधी अर्थ की संभावना बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। काव्यात्मक पंक्ति-विन्यास मूल के समानांतर वाक्यांशों को उभारता है। ‘दृष्टि करूंगा’ और ‘थरथराता है’ जैसे बिंब मूल की ठोस अभिव्यक्ति को सुरक्षित रखते हैं।
