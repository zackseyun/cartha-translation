source:
  edition: WLC
  text: הַ/מִּתְקַדְּשִׁ֨ים וְ/הַ/מִּֽטַּהֲרִ֜ים אֶל הַ/גַּנּ֗וֹת אַחַ֤ר אחד בַּ/תָּ֔וֶךְ אֹֽכְלֵי֙ בְּשַׂ֣ר הַ/חֲזִ֔יר וְ/הַ/שֶּׁ֖קֶץ וְ/הָ/עַכְבָּ֑ר יַחְדָּ֥ו יָסֻ֖פוּ נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/017.yaml
  text: Those who sanctify themselves and purify themselves to go into the gardens[a], following one in the midst, eating the flesh of pigs and detestable things and mice, shall come to an end together, declares Yahweh.
translation:
  language: hi
  text: जो लोग बागों में जाने के लिए अपने आपको पवित्र और शुद्ध करते हैं, और बीच में एक के पीछे चलते हैं[a], जो सूअर का मांस, घिनौनी वस्तुएँ और चूहे खाते हैं—उन सबका एक साथ अन्त हो जाएगा। यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक अर्थ है, “बीच में एक के पीछे।” यह वाक्यांश कठिन है; इसका संकेत किसी अनुष्ठानिक अगुवे के पीछे चलने, किसी एक के पीछे बीच तक जाने, या किसी पंथीय अनुष्ठान में एक के बाद एक आगे बढ़ने की ओर हो सकता है।
    reason: मूल इब्रानी में वास्तविक वाक्य-विन्यासगत और अनुष्ठानिक अस्पष्टता है।
lexical_decisions:
- source_word: הַמִּתְקַדְּשִׁים
  choice: अपने आपको पवित्र करते हैं
  rationale: हित्पाएल कृदन्त की आत्मवाचकता को बनाए रखता है और स्वयं की गई अनुष्ठानिक तैयारी का भाव व्यक्त करता है।
- source_word: וְהַמִּטַּהֲרִים
  choice: अपने आपको ... शुद्ध करते हैं
  rationale: हित्पाएल का आत्मवाचक और अनुष्ठानिक शुद्धि का भाव सुरक्षित रहता है; यह ‘पवित्र’ के साथ स्वाभाविक युग्म बनाता है।
- source_word: אֶל הַגַּנּוֹת
  choice: बागों में जाने के लिए
  rationale: אֶל द्वारा व्यक्त दिशा या गति को स्वाभाविक हिन्दी में स्पष्ट करता है, बिना उन बागों के अनुष्ठानिक प्रयोजन को मुख्य पाठ में और अधिक निर्धारित किए।
- source_word: אַחַר אחד בַּתָּוֶךְ
  choice: बीच में एक के पीछे चलते हैं
  rationale: दुरूह इब्रानी वाक्यांश को अपेक्षाकृत शाब्दिक रखता है और ‘एक’ की पहचान अथवा अनुष्ठान की ठीक प्रक्रिया को अनिर्णीत छोड़ता है।
- source_word: אֹכְלֵי בְּשַׂר הַחֲזִיר
  choice: जो सूअर का मांस ... खाते हैं
  rationale: कृदन्तीय वर्णन को स्पष्ट आधुनिक हिन्दी में संबंधवाचक उपवाक्य के रूप में व्यक्त करता है और בשר का ठोस अर्थ बनाए रखता है।
- source_word: הַשֶּׁקֶץ
  choice: घिनौनी वस्तुएँ
  rationale: अनुष्ठानिक रूप से घृणित वस्तुओं का अर्थ देता है, पर इसे अनावश्यक रूप से व्यापक नैतिक श्रेणी नहीं बनाता।
- source_word: הָעַכְבָּר
  choice: चूहे
  rationale: इब्रानी शब्द का सामान्य और सर्वाधिक सुरक्षित हिन्दी अर्थ।
- source_word: יַחְדָּו יָסֻפוּ
  choice: उन सबका एक साथ अन्त हो जाएगा
  rationale: सामूहिक विनाश को व्यक्त करते हुए סוף के ‘अन्त हो जाना’ भाव को बचाता है और विनाश की विधि को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: भविष्यवाणी के औपचारिक सूत्र का गरिमापूर्ण हिन्दी रूप है और יהוה को व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में आए चार-अक्षरीय व्यक्तिगत नाम को पदवी से बदलने के बजाय नाम के रूप में रखा गया है।
- issue: दुरूह अनुष्ठानिक वाक्यांश אַחַר אחד בַּתָּוֶךְ
  choice: बीच में एक के पीछे चलते हैं
  alternative: बीच वाले के पीछे; एक के बाद एक; किसी अनुष्ठानिक अगुवे के पीछे
  rationale: इब्रानी वाक्य-विन्यास और संकेतित अनुष्ठान अस्पष्ट हैं। मुख्य पाठ किसी अगुवे, मूर्ति या निश्चित जुलूस की पहचान आरोपित नहीं करता; सम्भावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण भविष्यवाणी-संबंधी गद्य। आत्मवाचक अनुष्ठानिक क्रियाओं, निषिद्ध भोजन और सामूहिक न्याय को स्पष्ट रखा गया है; दुरूह पंथीय वाक्यांश को जानबूझकर पूरी तरह सहज बनाकर उसका अर्थ निश्चित नहीं किया गया।
