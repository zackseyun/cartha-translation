base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/015.yaml
  text: For look[a], Yahweh will come in fire, and his chariots like the whirlwind[c][b], to repay his anger in fury and his rebuke with flames of fire.
translation:
  language: hi
  text: क्योंकि देखो,[a] यहोवा आग में आएगा, और उसके रथ बवंडर के समान होंगे,[b] ताकि वह अपने कोप को प्रचंड क्रोध के साथ प्रकट करे और आग की लपटों के साथ अपनी फटकार दे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि निश्चय ही”; इब्रानी अभिव्यक्ति ध्यान आकर्षित करते हुए कथन पर बल देती है।
    reason: discourse_alternative
  - marker: b
    text: “बवंडर” का अनुवाद “तूफ़ान” या “प्रचंड आँधी” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “अपने कोप का प्रचंड क्रोध में प्रतिफल दे”; इब्रानी क्रिया का मूल अर्थ “लौटाना” है और न्यायिक संदर्भ में “प्रतिफल देना” या “दंडात्मक रूप से कार्यान्वित करना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: क्योंकि देखो
  rationale: כִּי पिछले कथन का आधार प्रस्तुत करता है और הִנֵּה श्रोता का ध्यान खींचता है; यह संयोजन आधुनिक हिन्दी में प्रवाह और सजीवता दोनों रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप से व्यक्त किया गया है।
- source_word: בָּאֵשׁ יָבוֹא
  choice: आग में आएगा
  rationale: בְּ को स्थान/परिवेश के रूप में निकटता से रखा गया है, जबकि साथ होने का अर्थ भी सम्भव है और पादटिप्पणी में दिया गया है।
- source_word: וְכַסּוּפָה מַרְכְּבֹתָיו
  choice: और उसके रथ बवंडर के समान आएँगे
  rationale: סוּפָה की उग्र घूर्णनशील आँधी की छवि के लिए ‘बवंडर’ चुना गया; हिन्दी में पूर्ण स्वाभाविक वाक्य हेतु निहित क्रिया दोहराई गई है।
- source_word: לְהָשִׁיב
  choice: लौटा दे
  rationale: हिफ़ील रूप के मूल ‘वापस करना/लौटाना’ भाव को बनाए रखता है और न्यायिक प्रतिफल की सम्भावना को बिना पूरी तरह एक अर्थ में सीमित किए व्यक्त करता है।
- source_word: בְּחֵמָה אַפּוֹ
  choice: प्रचंड क्रोध में अपना कोप
  rationale: חֵמָה की तीव्रता और אַף के क्रोध-सूचक मुहावरे के बीच भेद बनाए रखने के लिए क्रमशः ‘प्रचंड क्रोध’ और ‘कोप’ रखा गया है।
- source_word: וְגַעֲרָתוֹ בְּלַהֲבֵי אֵשׁ
  choice: और आग की लपटों से अपनी डाँट प्रकट करे
  rationale: גְּעָרָה अधिकारपूर्ण कठोर डाँट है; हिन्दी में साधनसूचक ‘से’ स्वाभाविक है। ‘प्रकट करे’ समानांतर खंड में לְהָשִׁיב के आशय को अनावश्यक रूप से दोहराए बिना निहित क्रियात्मक संबंध स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया; हिन्दी पाठकों में सुविख्यात लिप्यंतरण ‘यहोवा’ चुना गया है।
- issue: לְהָשִׁיב בְּחֵמָה אַפּוֹ में न्यायिक क्रिया का अर्थ
  choice: प्रचंड क्रोध में अपना कोप लौटा दे
  alternative: अपने प्रचंड क्रोध का बदला चुकाए
  rationale: ‘लौटाना’ मूल क्रिया की अर्थगत व्यापकता और कठिन काव्यात्मक तनाव को बचाता है; ‘बदला चुकाना’ न्यायिक आशय को स्पष्ट करता, पर पाठ को अधिक निश्चित कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। भविष्यसूचक न्याय की तीव्र काव्यात्मक छवियाँ—आग, बवंडर, रथ और लपटें—संरक्षित हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में क्रम से उपस्थित हैं।
