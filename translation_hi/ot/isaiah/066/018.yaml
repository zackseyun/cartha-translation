base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/018.yaml
  text: For I know their works and their thoughts[a]. The time is coming to gather all the nations and tongues[b], and they will come and see my glory.
translation:
  language: hi
  text: क्योंकि मैं उनके कामों और उनके विचारों को जानता हूँ।[a] सब राष्ट्रों और भाषाओं[b] को इकट्ठा करने का समय आ रहा है; वे आएँगे और मेरी महिमा देखेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पाठ अचानक और कठिन है; शब्दशः लगभग: “और मैं, उनके काम और उनके विचार, सब राष्ट्रों और भाषाओं को इकट्ठा करने [आ रहा है]।” इसे “मैं उनके कामों और उनके विचारों को जानता हूँ,” “उनके कामों और उनके विचारों के कारण मैं ... इकट्ठा करने आ रहा हूँ,” या “सब राष्ट्रों और भाषाओं को इकट्ठा करने का समय आ रहा है,” समझा गया है। ‘जानता हूँ’ और ‘समय’ इब्रानी में स्पष्ट रूप से नहीं लिखे हैं।'
    reason: alternative_reading
  - marker: b
    text: शब्दशः “जीभों”; अर्थात “भाषाओं” या अलग-अलग भाषाएँ बोलने वाले समूहों।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: क्योंकि मैं
  rationale: स्वतंत्र सर्वनाम אָנֹכִי के बल को ‘मैं’ से रखा गया है। आरंभिक וְ का संबंध अस्पष्ट है; कठिन वाक्य-विन्यास को अर्थपूर्ण आधुनिक हिन्दी में व्यक्त करने के लिए ‘क्योंकि’ चुना गया, जबकि शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: מַעֲשֵׂיהֶם
  choice: उनके कामों
  rationale: מַעֲשֶׂה कर्म या किए हुए काम को दर्शाता है। ‘काम’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और नैतिक संदर्भ को बनाए रखता है।
- source_word: וּמַחְשְׁבֹתֵיהֶם
  choice: और उनके विचारों
  rationale: מַחֲשָׁבוֹת का अर्थ विचार, योजनाएँ या इरादे हो सकता है। ‘विचार’ इसका सबसे व्यापक सीधा अर्थ है और ‘कामों’ के साथ बाहरी तथा भीतरी जीवन का युग्म बनाता है।
- source_word: בָּאָה
  choice: वह समय आ रहा है
  rationale: स्त्रीलिंग एकवचन रूप בָּאָה इस संक्षिप्त इब्रानी वाक्य में वाक्य-विन्यास की दृष्टि से कठिन है। भविष्याभिमुख संदर्भ को सहज हिन्दी में दिखाने के लिए ‘वह समय आ रहा है’ कहा गया; यह पूरक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: לְקַבֵּץ
  choice: जब मैं ... इकट्ठा करूँगा
  rationale: קבץ का सीधा अर्थ एकत्र करना है। हिन्दी में आने वाले समय की घोषणा के साथ ‘जब मैं ... इकट्ठा करूँगा’ स्वाभाविक रूप से जुड़ता है।
- source_word: כָּל־הַגּוֹיִם
  choice: सब राष्ट्रों
  rationale: גּוֹיִם यहाँ विश्व के राष्ट्रों को सामूहिक रूप से दर्शाता है। ‘राष्ट्र’ व्यापक अंतरराष्ट्रीय दायरे को बनाए रखता है और अनावश्यक रूप से ‘गैर-यहूदी’ अर्थ नहीं थोपता।
- source_word: וְהַלְּשֹׁנוֹת
  choice: और भाषा-समूहों
  rationale: לְשֹׁנוֹת का शाब्दिक अर्थ ‘जीभें’ और प्रसंगगत अर्थ भाषाएँ अथवा भाषा बोलने वाले समुदाय है। ‘भाषा-समूह’ राष्ट्रों के साथ समांतर जनसमूहों को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है; ‘भाषाओं’ विकल्प पादटिप्पणी में है।
- source_word: וּבָאוּ
  choice: वे आएँगे
  rationale: भविष्याभिमुख भविष्यद्वाणी के क्रम में इस रूप को हिन्दी भविष्यकाल में व्यक्त किया गया है।
- source_word: וְרָאוּ
  choice: और ... देखेंगे
  rationale: ראה का सामान्य अर्थ ‘देखना’ है। इसे पिछले भविष्यकालीन क्रिया-क्रम के साथ समन्वित किया गया है।
- source_word: כְּבוֹדִי
  choice: मेरी महिमा
  rationale: כָּבוֹד यशायाह में प्रकट ईश्वरीय गौरव का गहरा अर्थ रखता है। ‘महिमा’ इस धर्मवैचारिक और अंतरपाठीय भार को सुरक्षित रखती है।
theological_decisions:
- issue: पद के आरंभिक कठिन और अपूर्ण वाक्य-विन्यास का निरूपण
  choice: मुख्य पाठ में अर्थानुसार ‘क्योंकि मैं उनके कामों और उनके विचारों को जानता हूँ। वह समय आ रहा है...’
  alternative: 'अधिक शाब्दिक: ‘और मैं—उनके काम और उनके विचार—सब राष्ट्रों और भाषाओं को इकट्ठा करने आ रहा हूँ।’ अथवा: ‘उनके कामों और उनके विचारों के कारण मैं ... इकट्ठा करने आ रहा हूँ।’'
  rationale: मसोरेटिक इब्रानी अत्यंत संक्षिप्त है और उसमें ‘जानता हूँ’ तथा ‘समय’ स्पष्ट रूप से नहीं लिखे हैं। मुख्य पाठ सामान्य पाठक के लिए संभावित अर्थ देता है, पर पादटिप्पणी शाब्दिक कठिनाई और प्रमुख वैकल्पिक समझों को सुरक्षित रखती है; इस प्रकार अस्पष्टता को छिपाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। कठिन आरंभ को मुख्य पाठ में सहज बनाया गया है, लेकिन मूल की वास्तविक वाक्यगत अस्पष्टता विस्तृत पादटिप्पणी में स्पष्ट रूप से सुरक्षित है। ‘भाषा-समूह’ सामान्य पाठक के लिए ‘जीभों’ की अपेक्षा स्पष्ट है।
