  edition: WLC
  text: הַ/אֲנִ֥י אַשְׁבִּ֛יר וְ/לֹ֥א אוֹלִ֖יד יֹאמַ֣ר יְהוָ֑ה אִם אֲנִ֧י הַ/מּוֹלִ֛יד וְ/עָצַ֖רְתִּי אָמַ֥ר אֱלֹהָֽיִ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/009.yaml
  text: Shall I bring to the point of birth and not cause to give birth? says Yahweh[a]. Shall I, who cause to give birth[c][b], shut the womb? says your God.
translation:
  language: hi
  text: “क्या मैं प्रसव की घड़ी तक पहुँचाकर जन्म न कराऊँ?” याहवे[a] कहते हैं। “क्या मैं, जो जन्म कराता हूँ, गर्भाशय को बंद कर दूँ?” तुम्हारा परमेश्वर कहता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में परमेश्वर का व्यक्तिगत नाम יהוה है; यहाँ उसे “याहवे” के रूप में लिप्यंतरित किया गया है।
    reason: नाम-संबंधी स्पष्टीकरण
  - marker: b
    text: “तुम्हारा” के लिए हिब्रू प्रत्यय स्त्रीलिंग एकवचन है; आसपास के सन्दर्भ में संबोधन स्त्री के रूप में चित्रित सिय्योन/यरूशलेम से है। “गर्भाशय को बंद कर दूँ” हिब्रू क्रिया का सन्दर्भानुकूल स्पष्टीकरण है; उसका अधिक शाब्दिक अर्थ “रोक दूँ” या “बंद कर दूँ” है।
    reason: व्याकरणिक और शाब्दिक वैकल्पिक अर्थ
lexical_decisions:
- source_word: אַשְׁבִּיר
  choice: प्रसव की घड़ी तक पहुँचाकर
  rationale: यहाँ שׁבר का हिफ़ील रूप प्रसव को उसके निर्णायक क्षण तक ले आने के अर्थ में है; यह चयन प्रसव-बिंब को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: אוֹלִיד
  choice: जन्म न होने दूँगा
  rationale: ילד के हिफ़ील की कारणवाचक शक्ति को हिन्दी में स्पष्ट करता है और पहले खंड की गर्भवती स्त्री तथा प्रसव की छवि से स्वाभाविक रूप से जुड़ता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: אִם
  choice: क्या
  rationale: समानांतर दूसरे अलंकारिक प्रश्न का परिचय देता है; हिन्दी में अलग से ‘या’ जोड़ना आवश्यक नहीं और मूल की प्रश्नात्मक समानांतरता सुरक्षित रहती है।
- source_word: הַמּוֹלִיד
  choice: जो जन्म कराता हूँ
  rationale: संज्ञीकृत कारणवाचक कृदंत को प्रथम पुरुष के अनुरूप स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְעָצַרְתִּי
  choice: गर्भ को बंद कर दूँगा
  rationale: עצר का मूल भाव रोकने या बंद करने का है। प्रसव-संदर्भ में निहित कर्म ‘गर्भ’ स्पष्ट करने से हिन्दी पाठ समझने योग्य रहता है।
- source_word: אֱלֹהָיִךְ
  choice: तुम्हारा परमेश्वर
  rationale: प्रत्यक्ष वाचिक संबोधन को बनाए रखता है; हिब्रू प्रत्यय स्त्रीलिंग एकवचन है और सन्दर्भ में सिय्योन/यरूशलेम को संबोधित करता है।
theological_decisions:
- issue: प्रसव के रूपक को बनाए रखना
  choice: परमेश्वर द्वारा प्रसव की घड़ी तक पहुँचाने और जन्म कराने की छवि को स्पष्ट किन्तु रूपकात्मक हिन्दी में रखा गया है।
  alternative: ‘क्या मैं अपना आरम्भ किया हुआ काम अधूरा छोड़ दूँगा?’ जैसे अर्थप्रधान रूप में रूपक को हटा देना।
  rationale: मूल पाठ परमेश्वर की विश्वसनीयता को प्रसव की जीवंत छवि द्वारा व्यक्त करता है; सामान्य सिद्धान्त में बदल देना काव्यात्मक तनाव और सिय्योन के स्त्रीरूप संबोधन को मिटा देता।
- issue: עצר के निहित कर्म को स्पष्ट करना
  choice: ‘गर्भ को बंद कर दूँगा’
  alternative: केवल ‘रोक दूँगा’ या ‘जन्म रोक दूँगा’
  rationale: हिब्रू में कर्म अनुक्त है। प्रसव-संदर्भ से नियंत्रित ‘गर्भ’ जोड़ना अर्थ को स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक विकल्प बताती है।
- issue: स्त्रीलिंग एकवचन संबोधन
  choice: मुख्य पाठ में स्वाभाविक ‘तुम्हारा परमेश्वर’, और पादटिप्पणी में सिय्योन/यरूशलेम के स्त्रीरूप संबोधन की जानकारी।
  alternative: मुख्य पाठ में ‘हे स्त्री, तुम्हारा परमेश्वर’ जैसा अप्राकृतिक विस्तार।
  rationale: हिन्दी possessive रूप यहाँ संबोधित व्यक्ति का स्त्रीलिंग स्पष्ट नहीं करता; पादटिप्पणी मूल की व्याकरणिक और साहित्यिक सूचना को बिना पाठ बोझिल किए सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दोनों अलंकारिक प्रश्नों की समानांतरता तथा प्रसव-बिंब सुरक्षित हैं; ‘प्रसव की घड़ी’ चिकित्सा-तकनीकी भाषा से बचते हुए निर्णायक क्षण को व्यक्त करती है।
