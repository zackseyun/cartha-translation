source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הַ/שָּׁמַ֣יִם כִּסְאִ֔/י וְ/הָ/אָ֖רֶץ הֲדֹ֣ם רַגְלָ֑/י אֵי זֶ֥ה בַ֨יִת֙ אֲשֶׁ֣ר תִּבְנוּ לִ֔/י וְ/אֵי זֶ֥ה מָק֖וֹם מְנוּחָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/001.yaml
  text: 'Thus says Yahweh: Heaven is my throne[a], and the earth is my footstool. What kind of house would you build for me[c][b], and what place would be my resting place?'
translation:
  language: hi
  text: 'याहवे यों कहते हैं:


    “आकाश मेरा सिंहासन है,

    और पृथ्वी मेरे पाँवों की चौकी है।

    तुम मेरे लिए कैसा भवन[a] बनाओगे?

    और कौन-सा स्थान मेरे विश्राम का स्थान[b] होगा?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘भवन’ से यहाँ सम्भवतः मन्दिर की ओर संकेत है, पर मूल इब्रानी शब्द का सामान्य अर्थ ‘घर’ या ‘भवन’ है। प्रश्न आलंकारिक है और इसे इस प्रकार भी समझा जा सकता है: “तुम मेरे लिए कौन-सा भवन बना सकते हो?”'
    reason: cultural_note; lexical_alternative
  - marker: b
    text: इब्रानी में प्रश्न ‘कौन-सा स्थान’ है, न कि केवल ‘कहाँ’। ‘मेरे विश्राम का स्थान’ का अनुवाद ‘मेरा विश्राम-स्थान’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहते हैं
  rationale: यह भविष्यवाणी-संदेश का मानक सूत्र है। ‘यों कहते हैं’ मूल की औपचारिक गरिमा बनाए रखते हुए स्वाभाविक आधुनिक हिन्दी है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: הַשָּׁמַיִם
  choice: आकाश
  rationale: यहाँ पृथ्वी के विपरीत परमेश्वर के ब्रह्मांडीय राजासन का क्षेत्र अभिप्रेत है; हिन्दी में एकवचन ‘आकाश’ स्वाभाविक है।
- source_word: כִּסְאִי
  choice: मेरा सिंहासन
  rationale: राजकीय रूपक का सीधा और स्वाभाविक अनुवाद।
- source_word: וְהָאָרֶץ
  choice: और पृथ्वी
  rationale: आकाश और पृथ्वी के स्पष्ट समानांतर विरोध को बनाए रखता है।
- source_word: הֲדֹם רַגְלָי
  choice: मेरे पाँवों की चौकी
  rationale: इब्रानी पदबंध का स्पष्ट, प्रचलित और चित्रात्मक हिन्दी रूप।
- source_word: אֵי זֶה
  choice: कैसा … / कहाँ होगा
  rationale: पहली पंक्ति में यह भवन की पर्याप्तता पर आलंकारिक प्रश्न है, इसलिए ‘कैसा’ उपयुक्त है; दूसरी पंक्ति में स्थान-संबंधी शब्द के साथ ‘कहाँ होगा’ समान आलंकारिक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַיִת
  choice: भवन
  rationale: मूल शब्द का अर्थ ‘घर/भवन’ है। ‘भवन’ यहाँ परमेश्वर के लिए बनाए जाने वाले पवित्र भवन की गरिमा और व्यापकता व्यक्त करता है, बिना मुख्य पाठ में सीधे ‘मन्दिर’ जोड़ने के।
- source_word: אֲשֶׁר תִּבְנוּ לִי
  choice: तुम मेरे लिए … बनाओगे
  rationale: इब्रानी अपूर्ण क्रिया और संदर्भ के आलंकारिक प्रश्न को सरल भविष्यत्कालीन हिन्दी में रखा गया है।
- source_word: מָקוֹם מְנוּחָתִי
  choice: मेरे विश्राम का स्थान
  rationale: मूल संज्ञा-संबंध को निकटता से बनाए रखता है और भवन वाली पहली पंक्ति के समानांतर रहता है।
theological_decisions:
- issue: בַיִת को सामान्य ‘भवन’ कहना या स्पष्ट रूप से ‘मन्दिर’ कहना
  choice: भवन
  alternative: मन्दिर
  rationale: संदर्भ में मन्दिर की ओर संकेत है, पर इब्रानी पाठ सामान्यतः ‘घर/भवन’ वाला शब्द प्रयोग करता है। ‘भवन’ रखने से किसी मानव-निर्मित स्थान द्वारा परमेश्वर को सीमित न कर पाने का व्यापक आलंकारिक बल बना रहता है।
- issue: प्रश्न को वास्तविक स्थान-प्रश्न या मानव-निर्मित भवन की अपर्याप्तता पर आलंकारिक चुनौती समझना
  choice: आलंकारिक प्रश्न के रूप में स्वाभाविक हिन्दी
  alternative: अति-शाब्दिक ‘कहाँ है वह भवन…?’
  rationale: आकाश को सिंहासन और पृथ्वी को पाँवों की चौकी कहने के बाद प्रश्न मानव द्वारा बनाए भवन की पर्याप्तता को चुनौती देता है; फिर भी उत्तर या व्याख्या मुख्य पाठ में जोड़कर तनाव को समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक पंक्ति-विन्यास ने आकाश/पृथ्वी और भवन/विश्राम-स्थान के समानांतरों को स्पष्ट किया है। ‘याहवे’ व्यक्तिगत नाम का लिप्यंतरण है; ‘पाँवों की चौकी’ सामान्य पाठक के लिए चित्र को स्पष्ट रखती है।
