base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/020.yaml
  text: And they will bring all your brothers from all the nations as an offering to Yahweh[a], on horses and in chariots and in litters and on mules and on camels, to my holy mountain Jerusalem, says Yahweh[c][b], just as the sons of Israel bring the offering in a clean vessel to the house of Yahweh.
translation:
  language: hi
  text: “वे सब राष्ट्रों में से तुम्हारे सभी भाइयों[c] को यहोवा के लिए भेंट के रूप में घोड़ों पर, रथों में, पालकियों[a] में, खच्चरों पर और ऊँटों[b] पर मेरे पवित्र पर्वत, यरूशलेम, पर लाएँगे,” यहोवा कहता है, “ठीक वैसे ही जैसे इस्राएली शुद्ध पात्र में भेंट यहोवा के भवन में लाते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस दुर्लभ शब्द का अर्थ अनिश्चित है; इसका अनुवाद ‘ढकी हुई गाड़ियों’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस दुर्लभ इब्रानी शब्द का अर्थ संभवतः ‘तेज़ दौड़ने वाले ऊँट’ है; कुछ इसे किसी प्रकार की गाड़ी भी मानते हैं।
    reason: lexical_alternative
  - marker: c
    text: यहाँ ‘भाइयों’ का अर्थ केवल सगे पुरुष भाई नहीं, बल्कि व्यापक रूप से स्वजन या समुदाय के सदस्य भी हो सकता है।
    reason: cultural_note
