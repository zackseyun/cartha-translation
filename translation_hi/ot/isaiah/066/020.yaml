theological_decisions:
- issue: ‘तुम्हारे भाइयों’ का संदर्भ
  choice: मूल पारिवारिक पद ‘भाइयों’ को रखा गया है, जिसका प्रमुख संदर्भ राष्ट्रों में बिखरे इस्राएली स्वजन हैं।
  alternative: इसे धर्मांतरित गैर-यहूदियों या राष्ट्रों से आए सभी उपासकों का स्पष्ट उल्लेख माना जा सकता है।
  rationale: निकट प्रसंग और ‘इस्राएलियों’ से की गई तुलना बिखरे इस्राएलियों के एकत्रीकरण की ओर संकेत करती है, पर पद व्यापक अंत-कालीन प्रतिध्वनि को स्पष्ट रूप से सीमित नहीं करता। अनुवाद इस तनाव का निर्णय नहीं करता।
- issue: लाए गए लोगों का ‘भेंट’ होना
  choice: व्यक्तियों को सामूहिक रूप से यहोवा के लिए ‘भेंट के रूप में’ लाया जाता है।
  alternative: מִנְחָה को केवल भेंट-सदृश उपहार या कर के रूप में समझा जा सकता है।
  rationale: वाक्य स्वयं लोगों को भेंट के रूप में प्रस्तुत करता है और आगे इस्राएलियों द्वारा शुद्ध पात्र में भेंट लाने की उपमा देता है; इसलिए उपासना-संबंधी चित्र को बनाए रखा गया है, बिना इसका बलिदान के रूप में अर्थ लगाने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। परिवहन-साधनों की सूची को स्पष्ट लय दी गई है। उद्धरण-विन्यास से ‘यहोवा कहता है’ को मूल संदेशवाहक सूत्र के रूप में दिखाया गया है। दुर्लभ वाहन-संबंधी शब्दों की अनिश्चितता मुख्य पाठ को बोझिल किए बिना टिप्पणियों में सुरक्षित रखी गई है।
