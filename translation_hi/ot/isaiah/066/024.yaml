  text: וְ/יָצְא֣וּ וְ/רָא֔וּ בְּ/פִגְרֵי֙ הָ/אֲנָשִׁ֔ים הַ/פֹּשְׁעִ֖ים בִּ֑/י כִּ֣י תוֹלַעְתָּ֞/ם לֹ֣א תָמ֗וּת וְ/אִשָּׁ/ם֙ לֹ֣א תִכְבֶּ֔ה וְ/הָי֥וּ דֵרָא֖וֹן לְ/כָל בָּשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/024.yaml
  text: And they will go out and look on the corpses of the men who rebelled against me[a]. For their worm will not die, and their fire will not be quenched[c][b], and they will be an abhorrence to all flesh.
translation:
  language: hi
  text: और वे बाहर जाकर उन पुरुषों के शवों को देखेंगे, जिन्होंने मेरे विरुद्ध विद्रोह किया था। क्योंकि उनका कीड़ा[a] न मरेगा और उनकी आग न बुझेगी; वे सब मनुष्यों के लिए घृणास्पद वस्तु[b] होंगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लार्वा’ अथवा ‘शवों में पड़ने वाला कीड़ा’; इब्रानी शब्द कीड़े, लार्वे या शवों में पड़ने वाले कीड़े के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘भयावह वस्तु’ अथवा ‘घिनौनी वस्तु’।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘समस्त देह’; यह इब्रानी अभिव्यक्ति यहाँ सभी मनुष्यों या पूरी मानवजाति के लिए प्रयुक्त हुई है।
    reason: cultural_note
lexical_decisions:
- source_word: וְיָצְאוּ
  choice: और वे बाहर निकलकर
  rationale: यशायाह 66 के समापन क्रम से संबंध बनाए रखते हुए יצא की बाहर जाने की गति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְרָאוּ בְּפִגְרֵי
  choice: शवों को देखेंगे
  rationale: ב के साथ ראה यहाँ ध्यान से देखने का भाव रखता है, और פגר निर्जीव देह या शव को दर्शाता है। ‘शव’ स्पष्ट, गरिमापूर्ण और मूल की कठोरता के अनुरूप है।
- source_word: הָאֲנָשִׁים
  choice: उन पुरुषों
  rationale: अर्थात ठोस रूप से उल्लिखित पुरुषों के समूह को अनावश्यक रूप से लिंग-निरपेक्ष बनाए बिना इब्रानी पुल्लिंग बहुवचन को सुरक्षित रखा गया है।
- source_word: הַפֹּשְׁעִים בִּי
  choice: जिन्होंने मेरे विरुद्ध विद्रोह किया
  rationale: פשׁע केवल सामान्य पाप नहीं बल्कि जानबूझकर किए गए विद्रोह या अपराध का भाव देता है; בִּי उस विद्रोह की दिशा ‘मेरे विरुद्ध’ स्पष्ट करता है।
- source_word: תוֹלַעְתָּם
  choice: उनका कीड़ा
  rationale: תולעת का अर्थ कीड़ा, लार्वा या शव में पड़ने वाला कीड़ा हो सकता है। मुख्य पाठ में परंपरागत और अंतरपाठीय रूप से महत्वपूर्ण ‘कीड़ा’ रखा गया है और अधिक विशिष्ट विकल्प पादटिप्पणी में दिया गया है।
- source_word: לֹא תָמוּת
  choice: न मरेगा
  rationale: स्त्रीलिंग एकवचन क्रिया अपने एकवचन कर्ता ‘कीड़ा’ से मेल खाती है; भविष्यकाल भविष्यसूचक प्रसंग के अनुकूल है।
- source_word: וְאִשָּׁם לֹא תִכְבֶּה
  choice: और उनकी आग न बुझेगी
  rationale: אשׁ के प्रत्यय को संबद्धता-सूचक ‘उनकी’ और כבה को आग के लिए स्वाभाविक ‘बुझना’ से व्यक्त किया गया है।
- source_word: דֵרָאוֹן
  choice: घृणा की वस्तु
  rationale: यह दुर्लभ संज्ञा तीव्र घृणा और विकर्षण उत्पन्न करने वाली वस्तु का बोध कराती है। हिन्दी पदबंध संज्ञात्मक रूप और अर्थ दोनों को बनाए रखता है।
- source_word: לְכָל־בָּשָׂר
  choice: सारी मानवजाति के लिए
  rationale: शाब्दिक ‘समस्त देह’ इब्रानी मुहावरा है जिसका यहाँ आशय सभी मनुष्यों से है; अर्थ को स्वाभाविक हिन्दी में व्यक्त कर शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: न्याय के चित्रण का स्वरूप
  choice: पद में शवों, न मरने वाले कीड़े और न बुझने वाली आग के ठोस चित्रण को उसी रूप में रखा गया है।
  alternative: इसे केवल प्रतीकात्मक पराजय कहना, अथवा इसी पद से अंतिम दण्ड की पूरी प्रक्रिया को परिभाषित करना।
  rationale: इब्रानी पाठ न्याय के दृश्य परिणाम का सशक्त चित्र देता है, पर यह पद अकेले उस चित्रण की समस्त धर्मवैज्ञानिक यांत्रिकी स्पष्ट नहीं करता। अनुवाद न इसे मात्र रूपक बनाता है, न पाठ से आगे जाकर व्यवस्थित सिद्धान्त जोड़ता है।
- issue: הָאֲנָשִׁים का लिंग-सूचक अनुवाद
  choice: पुरुषों
  alternative: लोगों या मनुष्यों
  rationale: यहाँ स्रोत में पुल्लिंग बहुवचन संज्ञा द्वारा एक ठोस समूह का उल्लेख है; इसलिए बिना स्पष्ट प्रासंगिक कारण के उसका लिंग-निरपेक्षीकरण नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल किंतु गरिमापूर्ण। ‘शव’, ‘विद्रोह’, ‘न मरेगा’ और ‘न बुझेगी’ मूल के कठोर न्याय-चित्रण को बिना नरम किए रखते हैं। वाक्य-विन्यास पठनीय है और पद के भविष्यसूचक स्वर तथा अंतिम परिणाम को सुरक्षित रखता है।
