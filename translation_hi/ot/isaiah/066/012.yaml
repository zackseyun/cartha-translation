id: ISA.66.12
reference: Isaiah 66:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה הִנְ/נִ֣י נֹטֶֽה אֵ֠לֶי/הָ כְּ/נָהָ֨ר שָׁל֜וֹם וּ/כְ/נַ֧חַל שׁוֹטֵ֛ף כְּב֥וֹד גּוֹיִ֖ם וִֽ/ינַקְתֶּ֑ם עַל צַד֙ תִּנָּשֵׂ֔אוּ וְ/עַל בִּרְכַּ֖יִם תְּשָׁעֳשָֽׁעוּ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/012.yaml
  text: 'For thus says Yahweh: Behold[a], I am extending peace to her like a river, and the glory of the nations like an overflowing stream; and you will nurse, you will be carried on the hip[b], and bounced on the knees.'
translation:
  language: hi
  text: 'क्योंकि यहोवा यों कहता है: “देखो, मैं उसकी ओर शांति को नदी के समान और राष्ट्रों के वैभव[a] को उमड़ती धारा के समान बहाऊँगा। तुम दूध पियोगे, कूल्हे पर उठाए जाओगे और घुटनों पर दुलारे जाओगे[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राष्ट्रों की धन-संपत्ति” अथवा “राष्ट्रों की समृद्धि।” हिब्रू शब्द में उनका गौरव, वैभव और धन शामिल हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात बच्चे की तरह घुटनों पर खिलाए और स्नेह से दुलारे जाओगे।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के विशिष्ट नाम को परिचित और गरिमापूर्ण रूप में प्रस्तुत करता है।
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: हिब्रू के संकेतात्मक और बलपूर्ण भाव को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: נֹטֶה אֵלֶיהָ
  choice: मैं उसकी ओर ... बहाऊँगा
  rationale: नदी और उमड़ती धारा के अगले बिंब के साथ स्वाभाविक हिन्दी बनाते हुए उसकी ओर प्रचुरता से पहुँचाने का भाव व्यक्त करता है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: मूल अर्थ का मानक रूप है और प्रसंग में कुशलता, समृद्धि तथा संपूर्ण भलाई के व्यापक अर्थ के लिए खुला रहता है।
- source_word: כְּנָהָר
  choice: नदी के समान
  rationale: प्रचुर और निरन्तर प्रवाह की उपमा को सीधे सुरक्षित रखता है।
- source_word: וּכְנַחַל שׁוֹטֵף
  choice: उमड़ती धारा के समान
  rationale: נחל और שׁוטף के तीव्र, बाढ़-सदृश प्रवाह को सहज हिन्दी में व्यक्त करता है।
- source_word: כְּבוֹד גּוֹיִם
  choice: राष्ट्रों का वैभव
  rationale: כבוד के गौरव, शोभा और संपन्नता से जुड़े अर्थों को समेटता है; आर्थिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וִינַקְתֶּם
  choice: तुम दूध पियोगे
  rationale: सक्रिय हिब्रू रूप और मातृ-शिशु बिंब को स्पष्ट, स्वाभाविक हिन्दी में रखता है।
- source_word: עַל צַד תִּנָּשֵׂאוּ
  choice: कमर पर उठाए जाओगे
  rationale: माता द्वारा बच्चे को अपने पार्श्व अथवा कूल्हे पर उठाने के सांस्कृतिक बिंब को समझने योग्य हिन्दी में व्यक्त करता है।
- source_word: וְעַל בִּרְכַּיִם תְּשָׁעֳשָׁעוּ
  choice: घुटनों पर दुलारे जाओगे
  rationale: क्रिया में निहित स्नेह, आनंद और बच्चे को घुटनों पर खिलाने-दुलारने का भाव बनाए रखता है।
theological_decisions:
- issue: אֵלֶיהָ के स्त्रीलिंग एकवचन सर्वनाम का संदर्भ
  choice: ‘उसकी ओर’ रखकर सर्वनाम को सुरक्षित रखा गया है; निकट प्रसंग में यह यरूशलेम/सिय्योन की ओर संकेत करता है।
  alternative: ‘यरूशलेम की ओर’ या ‘सिय्योन की ओर’ स्पष्ट करना।
  rationale: मूल पद स्वयं स्त्रीलिंग सर्वनाम प्रयोग करता है। उसे बनाए रखने से मातृ-नगर की साहित्यिक छवि और संदर्भगत संबद्धता सुरक्षित रहती है तथा पद से अधिक स्पष्टता आरोपित नहीं होती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल रूप। ‘यों कहता है’ भविष्यद्वाणी की पारंपरिक सूत्रात्मकता रखता है; मातृ-स्नेह के बिंब को सरल और जीवंत भाषा में प्रस्तुत किया गया है।
