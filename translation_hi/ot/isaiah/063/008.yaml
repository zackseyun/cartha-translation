id: ISA.63.8
reference: Isaiah 63:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַךְ עַמִּ֣/י הֵ֔מָּה בָּנִ֖ים לֹ֣א יְשַׁקֵּ֑רוּ וַ/יְהִ֥י לָ/הֶ֖ם לְ/מוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/008.yaml
  text: For he said[a], “Surely they are my people, children who will not deal falsely”; so he became their Savior.
translation:
  language: hi
  text: क्योंकि उसने कहा, “निश्चय ही वे मेरी प्रजा हैं, ऐसी संतान जो छल से काम नहीं करेगी[a]”; इसलिए वह उनका उद्धारकर्ता बन गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऐसी संतान जो झूठ नहीं बोलेगी” अथवा “ऐसी संतान जो झूठी नहीं निकलेगी।”
    reason: שׁקר के पिएल रूप में झूठ बोलने, छलपूर्ण व्यवहार करने, या भरोसे के प्रतिकूल सिद्ध होने की अर्थगत संभावना है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: क्योंकि उसने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है, जबकि प्रसंग में यह कथन पिछले पद की व्याख्या भी करता है; इसलिए ‘क्योंकि’ संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ यह शब्द सीमा नहीं, बल्कि दृढ़ पुष्टि और भरोसा व्यक्त करता है।
- source_word: עַמִּי הֵמָּה
  choice: वे मेरी प्रजा हैं
  rationale: ‘मेरी प्रजा’ वाचा-संबंधी सामूहिक अर्थ बनाए रखता है और स्वतंत्र सर्वनाम הֵמָּה का बल ‘वे ... हैं’ में प्रकट होता है।
- source_word: בָּנִים
  choice: संतान
  rationale: पुल्लिंग बहुवचन यहाँ पूरी प्रजा के परमेश्वर से संतान-संबंध को दर्शाता है, केवल पुरुष वंशजों को नहीं; ‘संतान’ आधुनिक हिन्दी में स्वाभाविक और समावेशी है।
- source_word: לֹא יְשַׁקֵּרוּ
  choice: विश्वासघात नहीं करेगी
  rationale: पिएल रूप केवल मौखिक झूठ तक सीमित न होकर झूठा या अविश्वसनीय आचरण करने का व्यापक अर्थ दे सकता है; ‘विश्वासघात’ वाचा के प्रसंग में उस नैतिक विस्तार को व्यक्त करता है।
- source_word: וַיְהִי לָהֶם
  choice: इसलिए वह उनका ... बन गया
  rationale: यह कथन पूर्ववर्ती अपेक्षा के परिणामस्वरूप बने संबंध को बताता है; ‘इसलिए’ उस परिणाम-संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: לְמוֹשִׁיעַ
  choice: उद्धारकर्ता
  rationale: यह ישׁע से बना कर्तृवाचक रूप है और बचाने या छुड़ाने वाले को दर्शाता है; ‘उद्धारकर्ता’ हिन्दी बाइबलीय भाषा में स्वाभाविक होते हुए मूल का धार्मिक भार बनाए रखता है।
theological_decisions:
- issue: לְמוֹשִׁיעַ में परमेश्वर के लिए प्रयुक्त पद
  choice: उद्धारकर्ता
  alternative: छुड़ानेवाला
  rationale: पद परमेश्वर को अपनी प्रजा को बचाने वाले के रूप में प्रस्तुत करता है। ‘उद्धारकर्ता’ इस बल को बनाए रखता है, पर पाठ से आगे की किसी विशिष्ट धर्मसैद्धांतिक व्याख्या को नहीं जोड़ता।
- issue: בָּנִים का लिंग-संबंधी अनुवाद
  choice: संतान
  alternative: पुत्र
  rationale: यहाँ पुल्लिंग बहुवचन पूरी प्रजा के लिए प्रतिनिधिक रूप से प्रयुक्त है। ‘संतान’ स्रोत के संबंधपरक अर्थ को बनाए रखता है और अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित नहीं करता।
- issue: לֹא יְשַׁקֵּרוּ में अपेक्षा और भावी आचरण
  choice: विश्वासघात नहीं करेगी
  alternative: झूठ नहीं बोलेगी / झूठी नहीं निकलेगी
  rationale: इब्रानी रूप झूठ बोलने, कपट करने या भरोसे के प्रतिकूल सिद्ध होने के बीच अर्थगत विस्तार रखता है। मुख्य पाठ वाचा-संबंधी बेवफाई का व्यापक भाव देता है और पादटिप्पणी वास्तविक विकल्प सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘प्रजा,’ ‘संतान’ और ‘उद्धारकर्ता’ बाइबलीय गंभीरता बनाए रखते हैं; पादटिप्पणी मूल की अर्थगत अस्पष्टता को सुरक्षित रखती है।
