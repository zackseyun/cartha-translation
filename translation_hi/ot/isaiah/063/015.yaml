    issue: The final Hindi clause is grammatically and idiomatically strained.
    rationale: “तेरे भीतर की गहरी हलचल और तेरी करुणाओं ने अपने को मुझसे रोक रखा है” combines a coordinated subject with an unnatural perfect construction and obscures the sense that the emotions/compassions are withheld from the speaker. Recasting it as “मुझ तक पहुँचने से रुकी हुई हैं” supplies a natural Hindi construction while retaining the lament and the directional force of אֵלַי.
