reference: Isaiah 63:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַבֵּ֤ט מִ/שָּׁמַ֨יִם֙ וּ/רְאֵ֔ה מִ/זְּבֻ֥ל קָדְשְׁ/ךָ֖ וְ/תִפְאַרְתֶּ֑/ךָ אַיֵּ֤ה קִנְאָֽתְ/ךָ֙ וּ/גְב֣וּרֹתֶ֔/ךָ הֲמ֥וֹן מֵעֶ֛י/ךָ וְֽ/רַחֲמֶ֖י/ךָ אֵלַ֥/י הִתְאַפָּֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/015.yaml
  text: Look down from heaven and see[a], from your holy and glorious dwelling[c][b]. Where are your zeal and your mighty deeds? The stirring of your inward parts and your compassions are withheld from me.
translation:
  language: hi
  text: स्वर्ग से नीचे नज़र डाल और देख—अपने पवित्र और महिमामय निवास से। तेरा उत्साह[a] और तेरे पराक्रम के कार्य कहाँ हैं? तेरे भीतर की गहरी हलचल[b] और तेरी करुणाएँ मुझ तक पहुँचने से रुकी हुई हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उत्साह’ के लिए ‘जलन’ भी सम्भव है; यहाँ आशय प्रबल लगन से है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक अर्थ ‘तेरी अंतड़ियों की हलचल’ है—गहरी आन्तरिक भावना या करुणा का मुहावरा।
    reason: cultural_note
  - marker: c
    text: या, ‘मुझसे अपने को रोक रखती हैं।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֵּט מִשָּׁמַיִם וּרְאֵה
  choice: स्वर्ग से नीचे नज़र डाल और देख
  rationale: दोनों आज्ञार्थक क्रियाओं को बनाए रखते हुए, स्वर्ग से पृथ्वी की ओर देखने का निहित ऊर्ध्वाधर दृष्टिकोण स्वाभाविक हिन्दी में स्पष्ट किया गया है।
- source_word: מִזְּבֻל קָדְשְׁךָ וְתִפְאַרְתֶּךָ
  choice: अपने पवित्र और महिमामय निवास से
  rationale: זְבֻל को ऊँचे निवास-स्थान के अर्थ में ‘निवास’ कहा गया है; ‘पवित्र और महिमामय’ हिन्दी में स्वाभाविक रूप से उसकी विशेषता व्यक्त करता है।
- source_word: קִנְאָתְךָ
  choice: तेरा उत्साह
  rationale: यहाँ शब्द परमेश्वर की प्रबल वाचा-संबंधी लगन और हस्तक्षेप की उत्कंठा बताता है; ‘जलन’ सम्भव है, पर आधुनिक हिन्दी में अनचाहा नकारात्मक अर्थ दे सकती है।
- source_word: גְבוּרוֹתֶיךָ
  choice: तेरे पराक्रम के कार्य
  rationale: बहुवचन संज्ञा केवल अमूर्त सामर्थ्य नहीं, बल्कि सामर्थ्य के प्रकट कार्यों की ओर संकेत करती है।
- source_word: הֲמוֹן מֵעֶיךָ
  choice: तेरे भीतर की गहरी हलचल
  rationale: मूल शारीरिक मुहावरा अंतरंग भावनात्मक उद्वेलन को व्यक्त करता है। मुख्य पाठ में अर्थ स्पष्ट रखा गया है और शारीरिक बिंब को पाद-टिप्पणी में बताया गया है।
- source_word: רַחֲמֶיךָ
  choice: तेरी करुणाओं
  rationale: हिब्रू बहुवचन को बनाए रखकर परमेश्वर की करुणा की अनेक अभिव्यक्तियों और प्रचुरता को व्यक्त किया गया है।
- source_word: אֵלַי הִתְאַפָּקוּ
  choice: अपने को मुझसे रोक रखा है
  rationale: हित्पएल रूप की आत्मवाचकता और करुणाओं के मानवीकरण को बनाए रखता है; यह वक्ता को ऐसा अनुभव होने की विलापपूर्ण भाषा है कि वे उसकी ओर प्रकट नहीं हो रहीं।
theological_decisions:
- issue: परमेश्वर की भावनाओं के लिए शारीरिक और भावात्मक भाषा
  choice: मुख्य पाठ में ‘तेरे भीतर की गहरी हलचल’ और पाद-टिप्पणी में मूल शारीरिक बिंब
  alternative: तेरी अंतड़ियों की हलचल; तेरे हृदय की भावनाएँ
  rationale: यह प्रस्तुति मूल के गहरे, देहधर्मी भाव को छिपाती नहीं, पर परमेश्वर के शरीर के विषय में कोई अनावश्यक सिद्धान्तगत निष्कर्ष भी नहीं थोपती।
- issue: ईश्वरीय קִנְאָה का अर्थ
  choice: उत्साह
  alternative: जलन
  rationale: सन्दर्भ में पुकार परमेश्वर की प्रबल लगन और उद्धारकारी हस्तक्षेप के लिए है। ‘उत्साह’ इसे सामान्य पाठक के लिए स्पष्ट करता है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
- issue: करुणा के रुकने की विलापपूर्ण अभिव्यक्ति
  choice: करुणाओं ने अपने को मुझसे रोक रखा है
  alternative: करुणाएँ मुझसे रोक ली गई हैं
  rationale: आत्मवाचक हिब्रू रूप और काव्यात्मक मानवीकरण को सुरक्षित रखा गया है। इसे परमेश्वर के स्वभाव पर व्यवस्थित सिद्धान्तगत कथन बनाने के बजाय वक्ता की प्रार्थनापूर्ण शिकायत के रूप में रहने दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनापरक रखी गई है। परमेश्वर को एकवचन ‘तू/तेरा’ संबोधन दिया गया है, जो इस निकट और तीव्र विलाप के काव्यात्मक स्वर के अनुकूल है। दोहरे आज्ञार्थक ‘नज़र डाल और देख’ तथा प्रश्न और शिकायत के तनाव को बनाए रखा गया है।
