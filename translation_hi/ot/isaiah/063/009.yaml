  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּֽ/כָל צָרָתָ֣/ם לא צָ֗ר וּ/מַלְאַ֤ךְ פָּנָי/ו֙ הֽוֹשִׁיעָ֔/ם בְּ/אַהֲבָת֥/וֹ וּ/בְ/חֶמְלָת֖/וֹ ה֣וּא גְאָלָ֑/ם וַֽ/יְנַטְּלֵ֥/ם וַֽ/יְנַשְּׂאֵ֖/ם כָּל יְמֵ֥י עוֹלָֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/009.yaml
  text: In all their distress[a], he was distressed, and the angel of his presence saved them; in his love and in his compassion he redeemed them, and he lifted them up and carried them all the days of old.
translation:
  language: hi
  text: उनके हर संकट में वह व्यथित नहीं हुआ[a], और उसकी उपस्थिति के दूत ने उन्हें बचाया। अपने प्रेम और अपनी करुणा में उसने उन्हें छुड़ाया; उसने उन्हें उठाया और प्राचीन काल के सारे दिनों तक उन्हें उठाए रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक प्राचीन वैकल्पिक पाठ के अनुसार: “उनके हर संकट में वह व्यथित हुआ।”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכָל צָרָתָם
  choice: उनके हर संकट में
  rationale: בְּכָל परिस्थिति की व्यापकता व्यक्त करता है और צָרָה संकट, विपत्ति या क्लेश को सूचित करता है। यह हिंदी में स्वाभाविक रहते हुए मूल अर्थ को बनाए रखता है।
- source_word: לא צָר
  choice: वह व्यथित नहीं हुआ
  rationale: दिए गए WLC पाठ में לא स्पष्ट निषेध है। צָר को यहाँ संकट से प्रभावित या व्यथित होने के अर्थ में लिया गया है; प्राचीन वैकल्पिक पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וּמַלְאַךְ פָּנָיו
  choice: और उसकी उपस्थिति के दूत
  rationale: מַלְאָךְ का मूल अर्थ दूत या स्वर्गदूत है और פָּנָיו यहाँ मुख/उपस्थिति को दर्शाता है। 'उपस्थिति के दूत' जानबूझकर मूल पदबंध की रहस्यमयता बनाए रखता है।
- source_word: הוֹשִׁיעָם
  choice: उन्हें बचाया
  rationale: यָשַׁע के हिफ़ील रूप का अर्थ बचाना या छुटकारा देना है। 'बचाया' सीधा और सामान्य आधुनिक हिंदी प्रयोग है।
- source_word: בְּאַהֲבָתוֹ וּבְחֶמְלָתוֹ
  choice: अपने प्रेम और अपनी करुणा में
  rationale: दोनों ב उपसर्गों को साथ रहने वाली प्रेरक परिस्थिति के रूप में रखा गया है। חֶמְלָה के भावात्मक अर्थ के लिए 'करुणा' उपयुक्त है।
- source_word: הוּא גְאָלָם
  choice: उसने उन्हें छुड़ाया
  rationale: גָּאַל निकट संबंधी द्वारा छुड़ाने या पुनः अपना बनाने की धारणा रखता है। 'छुड़ाया' हिंदी में स्वाभाविक है और बिना अतिरिक्त मूल्य-चुकाने की धारणा जोड़े अर्थ को सँभालता है।
- source_word: וַיְנַטְּלֵם
  choice: उसने उन्हें उठाया
  rationale: נָטַל उठाने या अपने ऊपर लेने का अर्थ देता है। इसे अगले क्रियापद से अलग रखा गया है।
- source_word: וַיְנַשְּׂאֵם
  choice: उन्हें लिए फिरा
  rationale: נָשָׂא ढोने, उठाए रखने या साथ लिए चलने को व्यक्त करता है। 'लिए फिरा' लंबे समय तक सँभालकर ले चलने का स्वाभाविक हिंदी चित्र देता है।
- source_word: כָּל יְמֵי עוֹלָם
  choice: प्राचीनकाल के सारे दिनों में
  rationale: इस स्मरणात्मक संदर्भ में עוֹלָם सुदूर अतीत को दर्शाता है, अनिवार्यतः अनंत भविष्य को नहीं।
theological_decisions:
- issue: पहले उपवाक्य में לא צָר का पाठ और अर्थ
  choice: मुख्य पाठ में मसोराई לא को निषेध मानकर 'वह व्यथित नहीं हुआ'
  alternative: '''उनके हर संकट में वह व्यथित हुआ,'' जो प्राचीन वैकल्पिक पाठ לו और प्राचीन अनुवाद-परंपरा को दर्शाता है'
  rationale: प्रस्तुत WLC पाठ में לא ('नहीं') है। मूल भाषा को प्राथमिकता देते हुए उसे मुख्य पाठ में रखा गया है, किंतु प्राचीन और अर्थ की दृष्टि से महत्त्वपूर्ण वैकल्पिक पाठ को पादटिप्पणी में दिया गया है ताकि पाठगत तनाव मिट न जाए।
- issue: מַלְאַךְ פָּנָיו की पहचान
  choice: अनिश्चित पहचान को 'उसकी उपस्थिति के दूत' के रूप में बनाए रखना
  alternative: '''उसका स्वर्गदूत'' या किसी विशिष्ट ईश्वरीय व्यक्ति के रूप में स्पष्ट करना'
  rationale: पद दूत और परमेश्वर की उपस्थिति के बीच निकट संबंध दिखाता है, पर उसकी सटीक पहचान नहीं बताता; इसलिए अनुवाद किसी सांप्रदायिक पहचान को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। काव्यात्मक समानांतरता और क्रियाओं के क्रम को यथासंभव सुरक्षित रखा गया है; पाठगत अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
