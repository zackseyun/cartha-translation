language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כַּ/בְּהֵמָה֙ בַּ/בִּקְעָ֣ה תֵרֵ֔ד ר֥וּחַ יְהוָ֖ה תְּנִיחֶ֑/נּוּ כֵּ֚ן נִהַ֣גְתָּ עַמְּ/ךָ֔ לַ/עֲשׂ֥וֹת לְ/ךָ֖ שֵׁ֥ם תִּפְאָֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/014.yaml
  text: Like livestock going down into the valley[a], the Spirit of Yahweh gave them rest; so you led your people[c][b], to make for yourself a glorious name.
translation:
  language: hi
  text: जैसे पशुधन घाटी में उतरता है, वैसे ही याहवे की आत्मा[a] ने उसे[b] विश्राम दिया। इसी प्रकार आपने अपनी प्रजा की अगुवाई की, ताकि अपने लिए एक महिमामय नाम[c] बनाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी רוּחַ का अर्थ ‘आत्मा’, ‘वायु’ या ‘श्वास’ हो सकता है; यहाँ प्रसंग के अनुसार ‘आत्मा’ लिया गया है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘उसे’ है; यह संभवतः इस्राएल की प्रजा को सामूहिक एकवचन मानकर कहा गया है। अर्थ स्पष्ट करने के लिए इसका अनुवाद ‘उन्हें’ भी किया जा सकता है।
    reason: alternative_reading
  - marker: c
    text: या ‘महिमा का नाम’।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּבְּהֵמָה
  choice: जैसे पशुधन
  rationale: בְּהֵמָה यहाँ सामूहिक अर्थ में पालतू पशुओं को दर्शाता है। ‘पशुधन’ इस सामूहिक एकवचन को बनाए रखता है और आगे के एकवचन क्रियारूप से मेल खाता है।
- source_word: בַּבִּקְעָה תֵרֵד
  choice: घाटी में उतरता है
  rationale: בִּקְעָה चौड़ी घाटी या घाटी का मैदान हो सकता है; ירד नीचे उतरने की गति व्यक्त करता है। हिंदी में यह वाक्यांश स्वाभाविक ढंग से दोनों बातों को प्रकट करता है।
- source_word: רוּחַ יְהוָה
  choice: याहवे की आत्मा
  rationale: רוּחַ के अर्थ ‘आत्मा’, ‘वायु’ या ‘श्वास’ हो सकते हैं, पर निर्गमन और ईश्वरीय मार्गदर्शन के इस प्रसंग में ‘आत्मा’ अधिक उपयुक्त है। יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: תְּנִיחֶנּוּ
  choice: उसे विश्राम दिया
  rationale: נוח का हिफ़ील रूप ‘विश्राम देना’ या ‘विश्राम कराना’ है। प्रत्यय स्पष्ट रूप से पुल्लिंग एकवचन है, इसलिए ‘उसे’ रखा गया है; इसका संकेत सामूहिक रूप से इस्राएल की ओर है।
- source_word: נִהַגְתָּ עַמְּךָ
  choice: आपने अपनी प्रजा की अगुवाई की
  rationale: נהג यहाँ मार्ग दिखाते हुए आगे ले जाने का भाव देता है। ‘अगुवाई की’ निर्गमन-संबंधी प्रसंग के लिए स्वाभाविक है, और עַם का वाचा-संबंधी अर्थ ‘प्रजा’ से व्यक्त होता है।
- source_word: שֵׁם תִּפְאָרֶת
  choice: एक महिमामय नाम
  rationale: यह रचना ऐसे नाम को दर्शाती है जो महिमा या वैभव से युक्त है। ‘महिमामय नाम’ वर्तमान हिंदी में स्वाभाविक और अर्थनिष्ठ है।
theological_decisions:
- issue: תְּנִיחֶנּוּ में एकवचन प्रत्यय का संदर्भ
  choice: ‘उसे’ रखकर इस्राएल को सामूहिक एकवचन माना गया है।
  alternative: ‘उन्हें विश्राम दिया’, ताकि ‘प्रजा’ के बहुवचन आशय को स्पष्ट किया जाए।
  rationale: इब्रानी प्रत्यय एकवचन है, जबकि प्रसंग परमेश्वर की प्रजा का है। ‘उसे’ मूल रूप की व्याकरणिक विशेषता और उसके सामूहिक आशय—दोनों को सुरक्षित रखता है।
- issue: רוּחַ יְהוָה का अर्थ
  choice: ‘याहवे की आत्मा’
  alternative: ‘याहवे की वायु’ अथवा ‘याहवे की श्वास’
  rationale: शब्दार्थगत विकल्प वास्तविक हैं, किंतु निकटवर्ती प्रसंग में ईश्वरीय मार्गदर्शन और विश्राम देने वाली सक्रियता के कारण ‘आत्मा’ सबसे उपयुक्त है।
- issue: לַעֲשׂוֹת לְךָ का उद्देश्य अथवा परिणाम
  choice: ‘ताकि अपने लिए ... बनाएँ’ के रूप में उद्देश्य व्यक्त किया गया है।
  alternative: ‘और इस प्रकार आपने अपने लिए ... बनाया’ के रूप में परिणाम व्यक्त करना।
  rationale: इब्रानी क्रियार्थक रूप उद्देश्य या परिणाम दोनों का भाव दे सकता है। यहाँ ‘ताकि’ वाक्य की स्वाभाविकता बनाए रखते हुए उद्देश्य के प्रमुख भाव को व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। परमेश्वर को संबोधित करते समय आदरसूचक ‘आप’ का प्रयोग हुआ है। ‘पशुधन’ और ‘उसे’ के माध्यम से मूल के सामूहिक एकवचन को यथासंभव सुरक्षित रखा गया है।
