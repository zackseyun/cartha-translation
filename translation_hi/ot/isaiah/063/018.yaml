  edition: WLC
  text: לַ/מִּצְעָ֕ר יָרְשׁ֖וּ עַם קָדְשֶׁ֑/ךָ צָרֵ֕י/נוּ בּוֹסְס֖וּ מִקְדָּשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/018.yaml
  text: Your holy people possessed it for a little while[b][a]; our adversaries have trampled your sanctuary.
translation:
  language: hi
  text: तेरी पवित्र प्रजा ने थोड़े ही समय तक उस पर अधिकार रखा[a][b]; हमारे बैरियों ने तेरे पवित्रस्थान को रौंद डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बहुत थोड़े समय के लिए’ अथवा ‘कुछ ही समय’। इब्रानी पदबंध अल्प अवधि या सीमित परिमाण का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘अधिकार रखा’ का कर्म नहीं बताया गया है; संदर्भ में सम्भवतः देश या विरासत अभिप्रेत है, आवश्यक नहीं कि पवित्रस्थान ही।
    reason: alternative_reading
lexical_decisions:
- source_word: לַמִּצְעָר
  choice: थोड़े ही समय तक
  rationale: מִצְעָר छोटेपन या अल्पता को व्यक्त करता है; ל उपसर्ग के साथ यहाँ यह स्वाभाविक रूप से अल्प अवधि बताता है। ‘ही’ विलाप में निहित संक्षिप्तता पर बल देता है, बिना अवधि निश्चित किए।
- source_word: יָרְשׁוּ
  choice: उस पर अधिकार रखा
  rationale: ירשׁ का अर्थ विरासत पाना, अधिकार में लेना या अपने अधिकार में रखना हो सकता है। मूल में कर्म अनकहा है; हिन्दी में ‘उस पर’ संदर्भित देश/विरासत की ओर संकेत करता है और उसे पवित्रस्थान के साथ अनिवार्य रूप से एक नहीं मानता।
- source_word: עַם קָדְשֶׁךָ
  choice: तेरी पवित्र प्रजा
  rationale: शाब्दिक भाव ‘तेरी पवित्रता की प्रजा’ है। ‘तेरी पवित्र प्रजा’ परमेश्वर से संबंध और अलग ठहराए जाने, दोनों भावों को सहज हिन्दी में रखता है।
- source_word: צָרֵינוּ
  choice: हमारे बैरी
  rationale: צָרֵינוּ विरोधी या शत्रु लोगों को दर्शाता है। ‘बैरी’ आधुनिक पाठक के लिए बोधगम्य रहते हुए विलाप की गरिमामय काव्य-शैली के अनुरूप है।
- source_word: בּוֹסְסוּ
  choice: रौंद डाला
  rationale: בוסס पैरों तले कुचलने या रौंदने का प्रबल भाव रखता है। ‘रौंद डाला’ अपवित्रीकरण और विनाशकारी आक्रमण की शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִקְדָּשֶׁךָ
  choice: तेरे पवित्रस्थान
  rationale: מִקְדָּשׁ पवित्र स्थान या पवित्रधाम है। ‘पवित्रस्थान’ पवित्र परिसर का व्यापक भाव बनाए रखता है और इसे अनावश्यक रूप से केवल भवन तक सीमित नहीं करता।
theological_decisions:
- issue: ‘अधिकार रखा’ का अनकहा कर्म
  choice: ‘उस पर’ जोड़कर संदर्भतः देश/विरासत की ओर संकेत किया गया है।
  alternative: कर्म को बिल्कुल अनकहा छोड़ना, अथवा ‘तेरे पवित्रस्थान’ को ही कर्म बताना।
  rationale: इब्रानी में कर्म व्यक्त नहीं है। हिन्दी वाक्य में ‘उस पर’ सहजता लाता है, पर पवित्रस्थान को निश्चित कर्म बनाकर पद की समानांतर शिकायतों को मिला नहीं देता।
- issue: לַמִּצְעָר का अर्थ
  choice: अवधि-सूचक—‘थोड़े ही समय तक’।
  alternative: परिमाण-सूचक—‘थोड़ी मात्रा में’ या ‘बहुत कम’।
  rationale: संदर्भ में प्रजा के अधिकार की अल्प अवधि और फिर बैरियों द्वारा पवित्रस्थान रौंदे जाने का विलाप है; फिर भी पादटिप्पणी मूल पदबंध की परिमाण-संबंधी संभाव्यता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय भविष्यद्वक्ताई विलाप। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तेरी/तेरे’ रखा गया है; ‘प्रजा’, ‘बैरी’ और ‘पवित्रस्थान’ काव्यात्मक हैं, फिर भी सामान्य पाठक के लिए स्पष्ट हैं।
