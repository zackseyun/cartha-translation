base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/017.yaml
  text: Why[a], Yahweh, do you make us wander from your ways and harden our hearts from fearing you? Return for the sake of your servants[c][b], the tribes of your inheritance.
translation:
  language: hi
  text: हे याहवे, तू हमें अपने मार्गों से क्यों भटकाता है[a] और हमारे हृदय[b] को ऐसा कठोर करता है कि हम तेरा भय न मानें? अपने सेवकों के लिए लौट आ[c]—तेरी विरासत के गोत्रों के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘हमें भटका देता है’ या ‘हमें भटकने देता है’ भी हो सकता है। इब्रानी क्रिया का रूप मूलतः कारक है—‘भटकाता है’; यह प्रार्थना इस्राएल के भटकने और परमेश्वर की प्रभुता के बीच की कसक को खुलकर व्यक्त करती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘हमारा हृदय’ एकवचन है; यह पूरी प्रजा को एक समुदाय के रूप में प्रस्तुत करता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘फिर मुड़ आ।’ यह विनती परमेश्वर से अपने लोगों की ओर फिर से अनुग्रहपूर्वक आने के लिए है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: क्यों
  rationale: यह विलाप में पूछा गया सीधा प्रश्न है; ‘क्यों’ उसके प्रश्नवाचक बल को बिना अतिरिक्त अर्थ जोड़े व्यक्त करता है।
- source_word: תַתְעֵנוּ
  choice: तू हमें ... भटकाता है
  rationale: हिफ़ील रूप का प्रत्यक्ष कारक अर्थ ‘भटकाता है’ से सुरक्षित रहता है। ‘भटकने देता है’ कहने से मूल की ईश्वरीय कारणता नरम पड़ जाती।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण में रखा गया है।
- source_word: מִדְּרָכֶיךָ
  choice: अपने मार्गों से
  rationale: מִן अलगाव को सूचित करता है; ‘मार्गों से भटकाता’ हिन्दी में स्वाभाविक रूप से दूर हो जाने का भाव देता है।
- source_word: תַּקְשִׁיחַ
  choice: कठोर करता है
  rationale: हिफ़ील क्रिया का कारक अर्थ सीधे व्यक्त होता है और मन की हठधर्मिता का रूपक बना रहता है।
- source_word: לִבֵּנוּ
  choice: हमारे मन
  rationale: इब्रानी में संज्ञा एकवचन है और पूरे समुदाय को एक इकाई के रूप में प्रस्तुत करती है। हिन्दी में ‘हमारे मन’ इस सामूहिक एकवचन को समझने योग्य ढंग से रखता है।
- source_word: מִיִּרְאָתֶךָ
  choice: कि हम तेरा भय न मानें
  rationale: कठोरता से उत्पन्न परमेश्वर के प्रति श्रद्धापूर्ण भय से दूरी को स्वाभाविक हिन्दी परिणाम-वाक्य में व्यक्त किया गया है।
- source_word: שׁוּב
  choice: लौट आ
  rationale: प्रार्थना में यह परमेश्वर से फिर अपने लोगों की ओर अनुग्रहपूर्वक लौटने की विनती है।
- source_word: לְמַעַן
  choice: के निमित्त
  rationale: यह संबंध के आधार पर की गई विनती का हेतु अथवा हित व्यक्त करता है।
- source_word: עֲבָדֶיךָ
  choice: अपने सेवकों
  rationale: इस वाचा-संबंधी और भक्तिपरक प्रसंग में ‘सेवक’ बंधुआ स्थिति पर अनावश्यक बल दिए बिना उचित अर्थ देता है।
- source_word: שִׁבְטֵי נַחֲלָתֶךָ
  choice: उन गोत्रों ... जो तेरी विरासत हैं
  rationale: यहाँ שׁבט का अर्थ इस्राएल के गोत्र हैं; संबंधवाचक रचना उन्हें याहवे की वाचा-संबंधी विरासत के रूप में स्पष्ट करती है।
theological_decisions:
- issue: लोगों के भटकने और मन के कठोर होने में याहवे की कारणता
  choice: 'मुख्य पाठ में प्रत्यक्ष कारक भाषा रखी गई: ‘तू ... भटकाता है’ और ‘कठोर ... करता है।’'
  alternative: ‘तू हमें भटकने क्यों देता है’ अथवा ‘हमारा मन कठोर क्यों होने देता है।’
  rationale: दोनों इब्रानी क्रियाएँ हिफ़ील रूप में सीधे याहवे को संबोधित हैं। विलाप की धर्मवैज्ञानिक कसक को अनुमति-सूचक भाषा से नरम करके हल नहीं किया गया।
- issue: לִבֵּנוּ का सामूहिक एकवचन
  choice: ‘हमारे मन’
  alternative: ‘हमारे मनों’ अथवा प्रसंगानुसार सामान्य बहुवचन
  rationale: एकवचन पूरे समुदाय की साझा भीतरी दशा को दर्शाता है; हिन्दी में इसे सुरक्षित रखना अर्थपूर्ण और बोधगम्य है।
- issue: שׁוּב में परमेश्वर से लौटने की विनती
  choice: ‘लौट आ’
  alternative: ‘फिर हमारी ओर ध्यान दे’
  rationale: प्रत्यक्ष गति-रूपक और वाचा के अनुग्रह की विनती दोनों सुरक्षित रहते हैं; व्याख्यात्मक विस्तार मुख्य पाठ में नहीं जोड़ा गया।
