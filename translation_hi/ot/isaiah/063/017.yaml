  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। ‘निमित्त’ सामान्य बोलचाल से कुछ ऊँचा शब्द है, पर काव्यात्मक-वाचा संबंधी संदर्भ में स्पष्ट और उपयुक्त है। प्रत्यक्ष संबोधन में एकवचन ‘तू/तेरा’ मूल इब्रानी के निकट है और भक्तिपरक हिन्दी में स्वाभाविक है।
