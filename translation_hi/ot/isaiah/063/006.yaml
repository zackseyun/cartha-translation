base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/006.yaml
  text: I trampled peoples in my anger[a]; I made them drunk in my wrath[b], and I brought their lifeblood down to the earth.
translation:
  language: hi
  text: मैंने अपने क्रोध में लोगों को रौंद डाला[a]; मैंने अपने प्रकोप में उन्हें मतवाला कर दिया, और उनके जीवन-रक्त[b] को धरती पर गिरा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राष्ट्रों को।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का अर्थ अनिश्चित है; संभव अर्थ “उनका रस” या “उनका रक्त” हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבוּס
  choice: रौंद डाला
  rationale: בוס का अर्थ पैरों तले रौंदना है। ‘रौंद डाला’ हिंसक न्याय और दाखरस के कुंड की पृष्ठभूमि—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עַמִּים
  choice: जन-समुदायों
  rationale: עַם का बहुवचन अलग-अलग लोगों या राष्ट्रों को सूचित कर सकता है। ‘जन-समुदायों’ आधुनिक राष्ट्र-राज्यों का अनावश्यक भाव जोड़े बिना इस बहुवचन को व्यक्त करता है।
- source_word: בְּאַפִּי
  choice: अपने क्रोध में
  rationale: אַף का मूल संबंध नाक या नथुने से है, पर यहाँ इसका रूढ़ार्थ ‘क्रोध’ है। हिन्दी में रूढ़ार्थ देना स्वाभाविक और स्पष्ट है।
- source_word: וַאֲשַׁכְּרֵם
  choice: उन्हें मतवाला कर दिया
  rationale: שׁכר के पिएल रूप का सीधा अर्थ किसी को मतवाला करना है। यह अनुवाद मदिरा और न्याय की संयुक्त बिंबावली को बनाए रखता है।
- source_word: בַּחֲמָתִי
  choice: अपने प्रकोप में
  rationale: חֵמָה तीव्र क्रोध या प्रकोप को दर्शाता है। ‘प्रकोप’ पहले प्रयुक्त ‘क्रोध’ से भेद रखते हुए पद की गंभीर शैली को सुरक्षित रखता है।
- source_word: וְאוֹרִיד
  choice: गिरा दिया
  rationale: ירד का हिफ़ील रूप ‘नीचे उतारना’ या ‘नीचे गिराना’ है। ‘धरती पर गिरा दिया’ मूल क्रिया और दिशा को निकटता से व्यक्त करता है, बिना ‘उंडेलना’ जैसा अधिक विशिष्ट भाव आरोपित किए।
- source_word: לָאָרֶץ
  choice: धरती पर
  rationale: אָרֶץ यहाँ उस भूमि या धरती को दर्शाता है जिस पर द्रव गिरता है। इस प्रसंग में हिन्दी का ‘धरती पर’ स्वाभाविक है।
- source_word: נִצְחָם
  choice: उनके जीवन-रक्त
  rationale: נֵצַח का यहाँ अर्थ विवादित है; इसे रस, रक्त, सामर्थ्य या वैभव से जोड़ा गया है। दाखरस के कुंड और रक्तपात की संयुक्त बिंबावली में ‘जीवन-रक्त’ न्याय के चित्र को स्पष्ट रखता है, जबकि पादटिप्पणी वास्तविक शाब्दिक अनिश्चितता बताती है।
theological_decisions:
- issue: दिव्य न्याय की हिंसक दाखरस-कुंड बिंबावली को न नरम करना, न उससे अधिक स्पष्ट करना
  choice: रौंदने, मतवाला करने और जीवन-रक्त को धरती पर गिराने की परस्पर जुड़ी हुई छवियाँ बनाए रखी गई हैं।
  alternative: अंतिम संज्ञा को ‘रस’ कहना, या ‘प्रकोप से मतवाला’ कहकर साधन का संबंध स्पष्ट करना।
  rationale: इब्रानी पाठ रौंदने, मतवालेपन और धरती पर गिराए गए द्रव को साथ रखता है। चुना गया रूप न्याय की कठोरता और दाखरस-कुंड तथा रक्तपात के बीच के तनाव को सुरक्षित रखता है, पर कोई अतिरिक्त धर्मसैद्धांतिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘क्रोध’ और ‘प्रकोप’ समानांतर इब्रानी शब्दों का हल्का भेद बनाए रखते हैं; ‘मतवाला’ दाखरस-कुंड की प्रसंगगत बिंबावली को स्वाभाविक रूप से व्यक्त करता है।
