source:
  edition: WLC
  text: וַ/יִּזְכֹּ֥ר יְמֵֽי עוֹלָ֖ם מֹשֶׁ֣ה עַמּ֑/וֹ אַיֵּ֣ה הַֽ/מַּעֲלֵ֣/ם מִ/יָּ֗ם אֵ֚ת רֹעֵ֣י צֹאנ֔/וֹ אַיֵּ֛ה הַ/שָּׂ֥ם בְּ/קִרְבּ֖/וֹ אֶת ר֥וּחַ קָדְשֽׁ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/011.yaml
  text: 'Then he remembered the ancient days[b][a], Moses and his people: “Where is the one who brought them up out of the sea with the shepherds of his flock? Where is the one who put his Holy Spirit within him?”'
translation:
  language: hi
  text: 'तब उसने प्राचीन दिनों को, मूसा और अपनी प्रजा को, याद किया:[c]


    “वह कहाँ है, जो अपने झुंड के चरवाहों[a] के साथ उन्हें समुद्र से बाहर निकाल लाया?


    वह कहाँ है, जिसने उसके भीतर[b] अपना पवित्र आत्मा रखा?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘अपने झुंड के चरवाहों के साथ’ है; कुछ लोग इसे ‘अपने झुंड के चरवाहे के साथ’ पढ़ते हैं, जिसका संकेत संभवतः मूसा की ओर है।
    reason: alternative_reading
  - marker: b
    text: या ‘उनके भीतर’ अथवा ‘उनके बीच में’। इब्रानी प्रत्यय एकवचन है (‘उसके भीतर’), पर वह किसकी ओर संकेत करता है, यह निश्चित नहीं है।
    reason: alternative_reading
  - marker: c
    text: 'इब्रानी वाक्य-विन्यास संक्षिप्त और अस्पष्ट है। एक अन्य संभव अनुवाद है: ‘तब उसकी प्रजा ने प्राचीन दिनों को—मूसा के दिनों को—याद किया।’'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: तब उसने … याद किया
  rationale: क्रिया का यह रूप कथा को आगे बढ़ाता है; ‘तब’ क्रम को स्वाभाविक हिन्दी में व्यक्त करता है। कर्ता पुल्लिंग एकवचन है, पर उसका संदर्भ विवादित है; इसे पादटिप्पणी में रखा गया है।
- source_word: יְמֵי עוֹלָם
  choice: प्राचीन दिनों
  rationale: यह पदबंध बीते हुए पुराने समय, विशेषकर परमेश्वर के प्राचीन उद्धारकारी कार्यों, की ओर संकेत करता है।
- source_word: מֹשֶׁה עַמּוֹ
  choice: मूसा और अपनी प्रजा को
  rationale: इब्रानी वाक्यांश अत्यंत संक्षिप्त और वाक्य-विन्यास की दृष्टि से कठिन है। मुख्य पाठ इसे स्मरण की गई मूसा और प्रजा से संबंधित सामग्री मानता है, जबकि वैकल्पिक विश्लेषण पादटिप्पणी में दिया गया है।
- source_word: אַיֵּה
  choice: वह कहाँ है
  rationale: दोहराए गए प्रश्न को वर्तमानकालीन आलंकारिक पुकार के रूप में बनाए रखा गया है।
- source_word: הַמַּעֲלֵם מִיָּם
  choice: जो … उन्हें समुद्र से ऊपर निकाल लाया
  rationale: निर्गमन के संदर्भ में עלה का कारक रूप समुद्र से बाहर/ऊपर निकाल लाने का भाव देता है; बहुवचन प्रत्यय को ‘उन्हें’ से व्यक्त किया गया है।
- source_word: אֵת רֹעֵי צֹאנוֹ
  choice: अपने झुंड के चरवाहों के साथ
  rationale: मसोरेटिक स्वरांकन में ‘चरवाहों’ बहुवचन है, इसलिए मुख्य पाठ में बहुवचन रखा गया है।
- source_word: הַשָּׂם
  choice: जिसने … रखा
  rationale: שים का सामान्य अर्थ ‘रखना/स्थापित करना’ है; भूतकालीन हिन्दी संदर्भ के अनुरूप ‘रखा’ स्वाभाविक है।
- source_word: בְּקִרְבּוֹ
  choice: उसके भीतर
  rationale: मसोरेटिक पाठ का प्रत्यय एकवचन है। उसका संदर्भ अस्पष्ट होने के कारण मुख्य पाठ में एकवचन रखा और विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: רוּחַ קָדְשׁוֹ
  choice: अपना पवित्र आत्मा
  rationale: यह यशायाह 63:10–11 में परमेश्वर के आत्मा के लिए विशिष्ट अभिव्यक्ति है; ‘पवित्र आत्मा’ आधुनिक हिन्दी में स्पष्ट और प्रतिष्ठित रूप है।
theological_decisions:
- issue: ‘याद किया’ का कर्ता
  choice: मुख्य पाठ में परमेश्वर को निहित कर्ता मानकर ‘उसने’
  alternative: ‘उसकी प्रजा ने प्राचीन दिनों को—मूसा के दिनों को—याद किया’
  rationale: इब्रानी क्रिया एकवचन है और पदक्रम एक से अधिक विश्लेषण की अनुमति देता है। संदर्भ में परमेश्वर को कर्ता मानना संभव है, पर सामूहिक एकवचन ‘उसकी प्रजा’ को कर्ता मानना भी व्यापक रूप से स्वीकार्य है; इसलिए वैकल्पिक पाठ स्पष्ट किया गया है।
- issue: בְּקִרְבּוֹ में एकवचन प्रत्यय का संदर्भ
  choice: ‘उसके भीतर’
  alternative: ‘उनके भीतर’ अथवा ‘उनके बीच में’
  rationale: मूल पाठ का प्रत्यय व्याकरणतः एकवचन है, किंतु वह मूसा, सामूहिक रूप से प्रजा, या प्रजा के बीच की उपस्थिति की ओर संकेत कर सकता है। अनिश्चितता को सिद्धांतगत रूप से हल नहीं किया गया।
- issue: झुंड के चरवाहे या चरवाहा
  choice: ‘चरवाहों’ बहुवचन
  alternative: ‘चरवाहे’ एकवचन, संभवतः मूसा
  rationale: WLC का मसोरेटिक स्वरांकन बहुवचन पढ़ता है। संदर्भ के आधार पर एकवचन समझने की संभावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु भविष्यद्वाणी और विलाप के गरिमापूर्ण स्वर को बनाए रखा गया है। दोहराए गए ‘वह कहाँ है?’ से मूल की व्याकुल खोज और आलंकारिक बल सुरक्षित रहता है।
