base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/003.yaml
  text: I have trodden the winepress alone[a], and from the peoples no man was with me; I trod them in my anger and trampled them in my wrath; their lifeblood spattered on my garments[b], and I stained all my clothing.
translation:
  language: hi
  text: मैंने दाखरस का कुण्ड अकेले ही रौंदा है[a]; लोगों में से कोई पुरुष मेरे साथ नहीं था। मैंने अपने क्रोध में उन्हें रौंदा और अपने रोष में उन्हें कुचला; उनका जीवन-रक्त मेरे वस्त्रों पर छिटक गया[b], और मैंने अपने सारे कपड़े दाग़दार कर दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे साथ कोई भी नहीं था।” इब्रानी पाठ में शाब्दिक रूप से “कोई पुरुष मेरे साथ नहीं था” है।
    reason: lexical_alternative
  - marker: b
    text: या, “उनका रक्त।” इब्रानी शब्द दाखरस के कुण्ड में बहते अंगूर के रस का आभास दे सकता है, जबकि यहाँ न्याय किए गए लोगों के रक्त की ओर संकेत करता है।
    reason: lexical_alternative
