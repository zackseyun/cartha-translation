- source_word: בְּאַפִּי
  choice: अपने क्रोध में
  rationale: אַף का शाब्दिक शारीरिक अर्थ यहाँ मुहावरे के अनुसार क्रोध है; यह आधुनिक हिन्दी में स्पष्ट है।
- source_word: וְאֶרְמְסֵם
  choice: उन्हें कुचला
  rationale: רמס पहले के रौंदने से अधिक तीव्र क्रिया व्यक्त करता है; ‘कुचला’ समानांतरता में बढ़ती हुई तीव्रता दिखाता है।
- source_word: בַּחֲמָתִי
  choice: अपनी जलजलाहट में
  rationale: חֵמָה के उग्र, दहकते रोष को ‘जलजलाहट’ गरिमामय बाइबिलीय हिन्दी में व्यक्त करती है और ‘क्रोध’ से भेद भी बनाए रखती है।
- source_word: וְיֵז
  choice: उछल पड़ा
  rationale: क्रिया तरल पदार्थ के बाहर की ओर छिटकने या उछलने का चित्र देती है। यह रक्त और अंगूर के रस, दोनों से जुड़ी दृश्यात्मकता के अनुकूल है।
- source_word: נִצְחָם
  choice: उनका जीवन-रक्त
