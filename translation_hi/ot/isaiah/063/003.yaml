- source_word: וּמֵעַמִּים
  choice: लोगों में से
  rationale: बहुवचन עַמִּים और מִן के चयनार्थक भाव को सुरक्षित रखता है; यहाँ संदर्भ विभिन्न जनसमूहों का है।
- source_word: אֵין אִישׁ אִתִּי
