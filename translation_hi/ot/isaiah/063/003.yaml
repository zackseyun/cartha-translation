- source_word: אֶגְאָלְתִּי
  choice: मैंने ... दाग़दार कर दिए
  rationale: यहाँ क्रिया का अर्थ कपड़ों को रक्त से दूषित या दाग़दार करना है। इसे גאל ‘छुड़ाना’ समझने से बचते हुए संदर्भगत अर्थ चुना गया है।
theological_decisions:
- issue: ईश्वरीय योद्धा और न्याय का हिंसक दाखरस-कुण्ड रूपक
  choice: प्रथम पुरुष में क्रोध, जलजलाहट, रौंदने, कुचलने और रक्त के चित्र को बिना नरम किए रखा गया है।
  alternative: इसे केवल अमूर्त विजय या निर्वैयक्तिक न्याय के रूप में हल्का करके प्रस्तुत करना।
  rationale: इब्रानी पाठ न्याय को सजीव और व्यक्तिगत ईश्वरीय वाणी में प्रस्तुत करता है। अनुवाद इस धर्मवैचारिक तनाव को बनाए रखता है और कोई बाद की मसीही या सम्प्रदायगत पहचान इसमें आरोपित नहीं करता।
- issue: אִישׁ का पुल्लिंग एकवचन
  choice: मुख्य पाठ में ‘कोई पुरुष’ रखा गया है।
  alternative: ‘कोई भी’ या ‘कोई व्यक्ति’ मेरे साथ नहीं था।
  rationale: मुख्य पाठ स्रोत के व्याकरणिक रूप को दिखाता है; पादटिप्पणी अधिक सहज और व्यापक हिन्दी विकल्प बताती है, बिना अर्थ को चुपचाप बदलने के।
- issue: נִצְחָם में अंगूर-रस और रक्त की अर्थ-प्रतिध्वनि
  choice: मुख्य पाठ में ‘जीवन-रक्त’ रखा गया है।
  alternative: ‘रक्त’ या रूपक के स्तर पर ‘रस’।
  rationale: लोगों के न्याय के संदर्भ में रक्त अभिप्रेत है, पर दाखरस-कुण्ड का चित्र बहते अंगूर-रस की प्रतिध्वनि उत्पन्न करता है। मुख्य पाठ मानवीय हिंसा की गंभीरता रखता है और पादटिप्पणी शब्द की रूपकीय गुंजाइश बताती है।
