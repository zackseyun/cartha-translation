  yaml_path: translation/ot/isaiah/063/002.yaml
  text: Why is your clothing red[b][a], and your garments like one who treads in the winepress?
translation:
  language: hi
  text: तेरा पहनावा लाल[a] क्यों है, और तेरे वस्त्र दाखरस के कुण्ड में अंगूर रौंदने वाले के वस्त्रों जैसे क्यों हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लाल किए हुए’ अथवा ‘गहरे लाल’; इब्रानी में केवल ‘लाल’ है और इसका कारण आगे के प्रसंग से स्पष्ट होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: क्यों
  rationale: यह सीधे कारण पूछने वाला प्रश्नवाचक क्रियाविशेषण है; आधुनिक हिन्दी में ‘क्यों’ स्वाभाविक और सटीक है।
- source_word: אָדֹם
  choice: लाल
  rationale: इब्रानी विशेषण केवल लाल रंग बताता है; ‘लहूलुहान’ या ‘रक्तरंजित’ कहने से वह कारण पहले ही जोड़ दिया जाता जो इस पद में स्पष्ट नहीं है।
- source_word: לִלְבוּשֶׁךָ
  choice: तेरा पहनावा
  rationale: לְבוּשׁ सामान्य रूप से पहनावे या परिधान को दर्शाता है; ‘पहनावा’ इसे किसी एक खास वस्त्र तक सीमित नहीं करता।
- source_word: וּבְגָדֶיךָ
  choice: और तेरे वस्त्र
  rationale: בֶּגֶד के बहुवचन का सीधा अर्थ ‘वस्त्र’ है; यह पहले पदांश के ‘पहनावा’ के साथ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: כְּדֹרֵךְ
  choice: रौंदनेवाले के वस्त्रों जैसे
  rationale: כְּ तुलना दर्शाता है और דֹרֵךְ चल रही क्रिया में लगे व्यक्ति को; हिन्दी में तुलना स्पष्ट करने के लिए निहित ‘वस्त्रों’ को दोहराया गया है।
- source_word: בְּגַת
  choice: दाखरस के कुण्ड में
  rationale: גַּת अंगूर रौंदकर रस निकालने का कुण्ड अथवा दाखरस का कुण्ड है। यह पद के प्राचीन सांस्कृतिक चित्र को समझने योग्य हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या लाल वस्त्रों के पीछे निहित रक्त और न्याय के बिंब को मुख्य पाठ में स्पष्ट किया जाए
  choice: शाब्दिक दृश्य-वर्णन ‘लाल’ रखा गया है।
  alternative: ‘रक्तरंजित’ या ‘लहूलुहान’ वस्त्र
  rationale: इस पद का इब्रानी पाठ केवल लाल रंग बताता है और दाखरस के कुण्ड में रौंदने वाले से तुलना करता है। रक्त और न्याय का आशय अगले पद में अधिक स्पष्ट होता है; इसलिए यहाँ उसे पहले से जोड़ना काव्यात्मक और धर्मवैचारिक तनाव को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। एकवचन संबोधन के अनुरूप ‘तेरा/तेरे’ प्रयुक्त हैं। ‘दाखरस का कुण्ड’ सांस्कृतिक वस्तु को स्पष्ट करता है, जबकि ‘लाल’ मूल की जानबूझकर रखी गई अस्पष्टता को सुरक्षित रखता है।
