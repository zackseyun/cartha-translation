lexical_decisions:
- source_word: מוֹלִיכָם
  choice: जो उन्हें … ले गया
  rationale: הָלַךְ के हिफ़ील कृदंत और तृतीय पुरुष बहुवचन कर्म-प्रत्यय को प्रसंगानुसार संबंधवाचक उपवाक्य के रूप में रखा गया है। इससे बीते समय में प्रभु के मार्गदर्शन का वर्णन स्वाभाविक हिन्दी में बना रहता है।
- source_word: בַּתְּהֹמוֹת
  choice: गहराइयों में से
  rationale: תְּהֹמוֹת का मूल अर्थ ‘गहराइयाँ’ है और यहाँ निर्गमन के समय गहरे जल में से पार ले जाने की छवि है। ‘में से’ गति को व्यक्त करता है, पर मूल में सीधे ‘समुद्र’ न होने के कारण उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: כַּסּוּס
  choice: जैसे घोड़ा
  rationale: तुलनासूचक כ और एकवचन סוּס को हिन्दी की स्वाभाविक उपमा में रखा गया है।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר के व्यापक अर्थ—जंगल, वीराना या मरुस्थलीय निर्जन क्षेत्र—को ‘निर्जन प्रदेश’ स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और केवल रेतीले मरुस्थल तक सीमित नहीं करता।
- source_word: לֹא יִכָּשֵׁלוּ
  choice: उन्होंने ठोकर नहीं खाई
  rationale: נפעל रूप का अर्थ ‘ठोकर खाना/लड़खड़ाना’ है। स्वतंत्र कथन के रूप में अनुवाद करने से इब्रानी की वाक्य-संरचना और उसकी संभावित अर्थगत स्वतंत्रता बनी रहती है; उद्देश्यसूचक ‘ताकि’ नहीं जोड़ा गया।
theological_decisions:
- issue: निर्गमन के मार्ग और समुद्र की छवि
  choice: ‘गहराइयों’ रखा गया और समुद्र को मुख्य पाठ में स्पष्ट रूप से नहीं जोड़ा गया।
  alternative: ‘गहरे जल में से’ या ‘समुद्र में से’
  rationale: निकटवर्ती प्रसंग निर्गमन और समुद्र-पार की घटना की ओर संकेत करता है, पर תְּהֹמוֹת स्वयं व्यापक शब्द है। इसलिए मुख्य पाठ मूल की छवि और अस्पष्टता बचाता है, जबकि पादटिप्पणी जल-संबंधी अर्थ स्पष्ट करती है।
- issue: अंतिम उपवाक्य का संबंध
  choice: ‘उन्होंने ठोकर नहीं खाई’ को स्वतंत्र कथन रखा गया।
  alternative: ‘ताकि वे ठोकर न खाएँ’
  rationale: इब्रानी में स्पष्ट उद्देश्यसूचक संयोजक नहीं है। स्वतंत्र कथन परिणाम का भाव संभव रहने देता है, पर उसे व्याकरण में अनिवार्य उद्देश्य नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘निर्जन प्रदेश’ ने बाइबिलीय מִדְבָּר का व्यापक भू-दृश्य बनाए रखा है; अर्धविराम मूल के अंतिम कथन को उपमा से जुड़ा हुआ, फिर भी व्याकरणतः स्वतंत्र दिखाता है।
