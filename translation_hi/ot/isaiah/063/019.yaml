id: ISA.63.19
reference: Isaiah 63:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הָיִ֗ינוּ מֵֽ/עוֹלָם֙ לֹֽא מָשַׁ֣לְתָּ בָּ֔/ם לֹֽא נִקְרָ֥א שִׁמְ/ךָ֖ עֲלֵי/הֶ֑ם לוּא קָרַ֤עְתָּ שָׁמַ֨יִם֙ יָרַ֔דְתָּ מִ/פָּנֶ֖י/ךָ הָרִ֥ים נָזֹֽלּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/019.yaml
  text: We have become like those over whom you have never ruled[a], those who were never called by your name. If only you would tear open the heavens and come down[b]; before you the mountains would quake.
translation:
  language: hi
  text: हम ऐसे लोगों के समान हो गए हैं जिन पर तूने कभी शासन नहीं किया, जो कभी तेरे नाम से नहीं कहलाए। काश, तू आकाश को फाड़कर उतर आता! तेरी उपस्थिति में[a] पहाड़ पिघल जाते[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तेरे मुख के सामने से” या “तेरे सामने।”
    reason: lexical_alternative
  - marker: b
    text: या “बहने लगते”; भावार्थ में, “काँप उठते।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיִינוּ מֵעוֹלָם
  choice: हम ऐसे लोगों के समान हो गए हैं ... कभी
  rationale: इब्रानी वाक्यांश अत्यंत संक्षिप्त और कुछ कठिन है। प्रसंग में यह इस्राएल की वर्तमान दशा को उन लोगों के समान बताता है जो सदा से परमेश्वर के शासन और नाम से बाहर रहे; ‘हो गए हैं’ परिणामी वर्तमान दशा को व्यक्त करता है।
- source_word: לֹא מָשַׁלְתָּ בָּם
  choice: जिन पर तूने कभी शासन नहीं किया
  rationale: מָשַׁלְתָּ के साथ בָּם लोगों पर अधिकार या शासन करने का अर्थ देता है। ‘शासन’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त व्यापक है।
- source_word: לֹא נִקְרָא שִׁמְךָ עֲלֵיהֶם
  choice: जो कभी तेरे नाम से नहीं कहलाए
  rationale: यह निष्क्रिय इब्रानी मुहावरा परमेश्वर के नाम से पहचाने जाने और उससे संबंध रखने का भाव देता है। हिन्दी का ‘तेरे नाम से कहलाए’ उस पहचान को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: לוּא
  choice: काश
  rationale: यह प्रबल इच्छा और विलाप व्यक्त करने वाला अव्यय है; ‘काश’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: קָרַעְתָּ שָׁמַיִם יָרַדְתָּ
  choice: तू आकाश को फाड़कर उतर आता
  rationale: לוּא के प्रभाव में पूर्ण क्रियाएँ इच्छा का भाव रखती हैं। ‘फाड़कर उतर आता’ मूल बिंब और प्रार्थना की तीव्रता बनाए रखता है।
- source_word: מִפָּנֶיךָ
  choice: तेरी उपस्थिति में
  rationale: शाब्दिक अर्थ ‘तेरे मुख/तेरे सामने से’ है। यहाँ परमेश्वर के प्रकट होने से सृष्टि पर पड़ने वाला प्रभाव अभिप्रेत है; ‘तेरी उपस्थिति में’ इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָרִים נָזֹלּוּ
  choice: पहाड़ पिघल जाते
  rationale: נזל का मूल बिंब बहने का है। ईश-प्रकटन के काव्यात्मक संदर्भ में पहाड़ मानो पिघलकर बहते हैं; ‘पिघल जाते’ इस ठोस बिंब को ‘काँप उठते’ की अपेक्षा अधिक सीधे सुरक्षित रखता है।
theological_decisions:
- issue: ‘तेरा नाम उन पर पुकारा गया’ में वाचा-संबंधी पहचान
  choice: ‘जो कभी तेरे नाम से नहीं कहलाए’
  alternative: ‘जिन पर तेरा नाम कभी नहीं पुकारा गया’
  rationale: मूल मुहावरा केवल मौखिक पुकार नहीं, बल्कि परमेश्वर से संबंध और उसके अधिकार में पहचाने जाने का संकेत देता है। चुना हुआ पाठ इस अर्थ को सहज हिन्दी में रखता है, पर उससे अधिक सिद्धांतगत विवरण नहीं जोड़ता।
- issue: परमेश्वर की उपस्थिति में पहाड़ों की प्रतिक्रिया
  choice: ‘पहाड़ पिघल जाते’
  alternative: ‘पहाड़ काँप उठते’ या ‘बहने लगते’
  rationale: मूल क्रिया के बहने वाले बिंब को ध्यान में रखकर ‘पिघल जाते’ रखा गया है। इससे नाटकीय ईश-प्रकटन का काव्यात्मक तनाव बना रहता है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक और काव्यात्मक गरिमा रखी गई है। परमेश्वर के लिए निकट संबोधन ‘तू’ प्रयुक्त है, जो इब्रानी एकवचन संबोधन और तीव्र विनती के अनुरूप है। वाक्य को सहज रखने के लिए पहले खंड में निहित तुलना को ‘समान’ से स्पष्ट किया गया है; कठिन मूल बिंबों को जहाँ संभव हो मुख्य पाठ में सुरक्षित रखा गया है।
