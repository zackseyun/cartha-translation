id: ISA.63.1
reference: Isaiah 63:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִי זֶ֣ה בָּ֣א מֵ/אֱד֗וֹם חֲמ֤וּץ בְּגָדִים֙ מִ/בָּצְרָ֔ה זֶ֚ה הָד֣וּר בִּ/לְבוּשׁ֔/וֹ צֹעֶ֖ה בְּ/רֹ֣ב כֹּח֑/וֹ אֲנִ֛י מְדַבֵּ֥ר בִּ/צְדָקָ֖ה רַ֥ב לְ/הוֹשִֽׁיעַ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/001.yaml
  text: Who is this coming from Edom[a], with crimson garments from Bozrah—this one splendid in his clothing, marching in the greatness of his strength? It is I, speaking in righteousness[c][b], mighty to save.
translation:
  language: hi
  text: 'एदोम से कौन आ रहा है,

    बोस्रा से गहरे लाल वस्त्र पहने हुए?

    यह जो अपने परिधान में भव्य है,

    और अपनी बड़ी शक्ति के बल पर आगे बढ़ रहा है—यह कौन है?[a]


    “मैं ही हूँ, जो धार्मिकता से बोलता हूँ,[b]

    और बचाने में सामर्थी हूँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस दुर्लभ इब्रानी शब्द का अर्थ “आगे बढ़ रहा है,” “बड़े डग भर रहा है,” या “बलपूर्वक चलता हुआ” हो सकता है।
    reason: צֹעֶה का सटीक गतिवाचक अर्थ अनिश्चित है।
  - marker: b
    text: या, “न्याय से बोलता हूँ।”
    reason: צְדָקָה में धार्मिकता और न्याय—दोनों अर्थ-छायाएँ सम्भव हैं।
lexical_decisions:
- source_word: חֲמוּץ בְּגָדִים
  choice: गहरे लाल वस्त्र
  rationale: חֲמוּץ वस्त्रों के लाल हो जाने या लाल रंग से चिह्नित होने का बोध देता है। मुख्य पाठ में रंग को स्पष्ट रखा गया है, पर अगले पद के आधार पर रक्त या दाखरस का कारण पहले से निर्धारित नहीं किया गया।
- source_word: מֵאֱדוֹם
  choice: एदोम से
  rationale: स्थानवाचक नाम को मानक हिन्दी लिप्यंतरण में रखा गया है।
- source_word: מִבָּצְרָה
  choice: बोसरा से
  rationale: एदोम के नगर के नाम का प्रचलित हिन्दी लिप्यंतरण किया गया है।
- source_word: הָדוּר בִּלְבוּשׁוֹ
  choice: अपने परिधान में भव्य
  rationale: यह पदबंध वेशभूषा में दिखाई देने वाली गरिमा और वैभव को व्यक्त करता है; ‘परिधान’ भविष्यद्वाणी की गरिमामय शैली के अनुकूल है।
- source_word: צֹעֶה בְּרֹב כֹּחוֹ
  choice: अपनी अपार शक्ति में बड़े-बड़े डग भर रहा है
  rationale: दुर्बोध क्रिया צֹעֶה को प्रभावशाली आगे बढ़ने के अर्थ में लिया गया है। רֹב כֹּחוֹ की शक्ति की प्रचुरता को ‘अपार शक्ति’ द्वारा सुरक्षित रखा गया है; क्रिया की अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: מְדַבֵּר בִּצְדָקָה
  choice: धार्मिकता में बोलता हूँ
  rationale: בִּצְדָקָה की नैतिक, न्यायिक और वाचा-संबंधी व्यापकता को संकुचित न करते हुए ‘धार्मिकता’ चुना गया है; ‘न्याय’ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: רַב לְהוֹשִׁיעַ
  choice: बचाने में सामर्थी हूँ
  rationale: רַב और उद्देश्यवाचक infinitive यहाँ उद्धार करने की महान क्षमता व्यक्त करते हैं। हिन्दी में यह रूप स्वाभाविक और अर्थनिष्ठ है।
theological_decisions:
- issue: उत्तर देने वाले की पहचान
  choice: वक्ता को केवल प्रथम पुरुष ‘मैं’ के रूप में रखा गया है।
  alternative: उसे मुख्य पाठ में याहवे, मसीही व्यक्ति या भविष्यद्वाणी का मानवीकरण कहना।
  rationale: इब्रानी नाटकीय संवाद में उत्तरदाता का नाम इस पद में नहीं दिया गया; इसलिए अनुवाद उसकी पहचान को व्याख्या द्वारा निश्चित नहीं करता।
- issue: צְדָקָה का अर्थ-क्षेत्र
  choice: धार्मिकता
  alternative: न्याय
  rationale: ‘धार्मिकता’ वक्ता की नैतिक और वाचा-संबंधी सत्यनिष्ठा की व्यापकता बनाए रखती है, जबकि न्यायिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: लाल वस्त्रों के लाल होने का कारण
  choice: कारण बताए बिना ‘गहरे लाल वस्त्र’
  alternative: रक्त से सने या दाखरस से सने वस्त्र
  rationale: अगले पदों में दाखरस-कुण्ड और रक्तवत् छींटों की छवि अर्थ को स्पष्ट करती है, पर इस पद का शब्द स्वयं लालपन का कारण निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमामय भविष्यद्वाणी-शैली अपनाई गई है। प्रश्न और प्रथम-पुरुष उत्तर का नाटकीय रूप बनाए रखा गया है। पंक्ति-विन्यास इब्रानी काव्य की समानांतर संरचना को स्पष्ट करता है, और दुर्बोध शब्दों की अनिश्चितता मुख्य पाठ तथा पादटिप्पणियों में संरक्षित है।
