translation:
  language: hi
  text: जो मूसा के दाहिने ओर अपनी महिमामय भुजा को लिए चला, जिसने उनके सामने जल को चीर दिया, ताकि वह अपने लिए सदा का नाम बनाए;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹלִיךְ
  choice: लिए चला
  rationale: 'हिफ़ील कृदंत का कारक अर्थ सुरक्षित रखता है: परमेश्वर अपनी भुजा को मूसा के दाहिने हाथ की ओर ले चला।'
- source_word: זְרוֹעַ תִּפְאַרְתּוֹ
  choice: अपनी महिमामय भुजा
  rationale: शाब्दिक भाव ‘उसकी महिमा की भुजा’ है; हिन्दी में ‘महिमामय भुजा’ सामर्थ्य और वैभव दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בּוֹקֵעַ
  choice: चीर दिया
  rationale: जल को विभाजित करके मार्ग बनाने की सशक्त क्रिया को व्यक्त करता है।
- source_word: שֵׁם עוֹלָם
  choice: सदा का नाम
  rationale: स्थायी यश और चिरस्थायी ख्याति के अर्थ को जानबूझकर खुला रखता है।
theological_decisions:
- issue: परमेश्वर की भुजा और मूसा का संबंध
  choice: अपनी महिमामय भुजा को मूसा के दाहिने हाथ की ओर लिए चला
  alternative: मूसा के दाहिने हाथ से अपनी महिमामय भुजा को चलाया
  rationale: मासोरेटिक पाठ में भुजा प्रत्यक्ष कर्म है और ‘मूसा के दाहिने’ स्थानसूचक है; चुना हुआ रूप भुजा को मूसा से अलग परमेश्वर की सामर्थ्य के रूप में रखता है और अनावश्यक साधनवाचक अर्थ नहीं जोड़ता।
- issue: ‘नाम’ का आशय
  choice: अपने लिए सदा का नाम बनाए
  alternative: अपने लिए सदा की कीर्ति प्राप्त करे
  rationale: ‘नाम’ की बाइबिलीय संकल्पना और उसके यश, प्रतिष्ठा तथा प्रकट पहचान के व्यापक अर्थ को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। पद पिछले संदर्भ के संबंधवाचक प्रवाह को बनाए रखने के लिए ‘जो’ से आरम्भ होता है; अंत में अर्धविराम अगले पद की निरंतरता दर्शाता है।
