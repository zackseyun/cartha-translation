source:
  edition: WLC
  text: וְ/הֵ֛מָּה מָר֥וּ וְ/עִצְּב֖וּ אֶת ר֣וּחַ קָדְשׁ֑/וֹ וַ/יֵּהָפֵ֥ךְ לָ/הֶ֛ם לְ/אוֹיֵ֖ב ה֥וּא נִלְחַם בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/010.yaml
  text: But they rebelled and grieved his Holy Spirit[a]; so he turned against them as an enemy; he himself fought against them.
translation:
  language: hi
  text: परन्तु उन्होंने विद्रोह किया और उसके पवित्र आत्मा को दुःखी किया[a]; इसलिए वह उनका शत्रु बन गया; उसने स्वयं उनके विरुद्ध युद्ध किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी पवित्र आत्मा को”; अधिक शाब्दिक रूप में, “उसकी पवित्रता की आत्मा को।”
    reason: मूल इब्रानी पदबंध רוּחַ קָדְשׁוֹ में ‘पवित्र’ को विशेषण की तरह अथवा ‘पवित्रता’ को संबंधवाचक संज्ञा की तरह समझने की गुंजाइश है।
lexical_decisions:
- source_word: וְהֵמָּה
  choice: परन्तु उन्होंने
  rationale: स्वतंत्र सर्वनाम के साथ संयोजक पिछले पदों में वर्णित परमेश्वर के उद्धारकारी कामों के विपरीत इस्राएल की प्रतिक्रिया को उभारता है।
- source_word: מָרוּ
  choice: विद्रोह किया
  rationale: यह क्रिया परमेश्वर के विरुद्ध बगावत या अवज्ञा का सीधा बोध कराती है।
- source_word: וְעִצְּבוּ
  choice: दुःखी किया
  rationale: पिएल रूप किसी को पीड़ा या शोक पहुँचाने का भाव रखता है; हिन्दी में यह संबंधपरक और भावात्मक अर्थ स्वाभाविक रूप से व्यक्त होता है।
- source_word: אֶת רוּחַ קָדְשׁוֹ
  choice: उसके पवित्र आत्मा को
  rationale: निर्मित पदबंध का अर्थ ‘उसकी पवित्रता का आत्मा’ अथवा ‘उसका पवित्र आत्मा’ हो सकता है। मुख्य पाठ में प्रचलित और स्पष्ट रूप रखा गया है तथा अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: וַיֵּהָפֵךְ
  choice: इसलिए वह ... बन गया
  rationale: निफ़अल रूप स्थिति या रुख में परिवर्तन व्यक्त करता है; प्रसंग में यह उनके विद्रोह के परिणामस्वरूप परमेश्वर के शत्रु बन जाने को दर्शाता है।
- source_word: לָהֶם לְאוֹיֵב
  choice: उनका शत्रु
  rationale: शाब्दिक रूप ‘उनके लिए शत्रु’ है; ‘उनका शत्रु बन गया’ आधुनिक हिन्दी में संबंध के उलट जाने को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הוּא
  choice: उसने स्वयं
  rationale: स्पष्ट सर्वनाम बलाघातयुक्त है और बताता है कि उसी ने व्यक्तिगत रूप से न्याय की कार्रवाई की।
- source_word: נִלְחַם בָּם
  choice: उनके विरुद्ध युद्ध किया
  rationale: लड़ने की क्रिया के साथ ב यहाँ विरोधी पक्ष के विरुद्ध युद्ध करने का अर्थ देती है।
theological_decisions:
- issue: רוּחַ קָדְשׁוֹ का रूपांतरण
  choice: उसके पवित्र आत्मा
  alternative: उसका पवित्र आत्मा; उसकी पवित्रता का आत्मा
  rationale: मूल पदबंध अधिक शाब्दिक रूप से ‘उसकी पवित्रता का आत्मा’ भी हो सकता है। दुःखी किए जाने की व्यक्तिगत भाषा के कारण मुख्य पाठ में ‘पवित्र आत्मा’ उचित है, पर मूल की व्याकरणिक और व्याख्यात्मक गुंजाइश पादटिप्पणी में रखी गई है।
- issue: וַיֵּהָפֵךְ לָהֶם לְאוֹיֵב में कर्ता और संबंध का परिवर्तन
  choice: वह उनका शत्रु बन गया
  alternative: वह उनके लिए शत्रु हो गया; वह शत्रु होकर उनके विरुद्ध हो गया
  rationale: क्रिया को मध्य/अकर्मक परिवर्तन के रूप में रखना मूल के निफ़अल को सहज हिन्दी में व्यक्त करता है और परमेश्वर के रुख में न्यायपूर्ण परिवर्तन को बिना अतिरिक्त व्याख्या के बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘विद्रोह’, ‘दुःखी’ और ‘युद्ध’ मूल की नैतिक, संबंधपरक और न्यायिक तीव्रता बनाए रखते हैं।
