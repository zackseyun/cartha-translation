  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण काव्यात्मक गद्य। ‘हृदय’ मूल बिंब को बनाए रखता है, जबकि ‘आ पहुँचा था’ नियत समय के आगमन को सहज हिन्दी में व्यक्त करता है।
