lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन में बताए गए कार्य का कारण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יוֹם נָקָם
  choice: प्रतिशोध का दिन
  rationale: ‘दिन’ निर्णायक समय को और ‘प्रतिशोध’ न्यायपूर्ण दंडात्मक प्रत्युत्तर को व्यक्त करता है, बिना इसे केवल सामान्य दंड के रूप में सीमित किए।
- source_word: בְּלִבִּי
  choice: मेरे हृदय में
  rationale: हिब्रू की आंतरिक इच्छा और संकल्प व्यक्त करने वाली शारीरिक उपमा को बनाए रखता है; ‘मेरे मन में’ अधिक व्याख्यात्मक होता।
- source_word: וּשְׁנַת גְּאוּלַי
  choice: और मेरे छुड़ाए हुओं का वर्ष
  rationale: मसोराई स्वरांकन में גְּאוּלַי को बहुवचन व्यक्तिगत संज्ञा/निष्क्रिय कृदन्त, ‘मेरे छुड़ाए हुए लोग’, समझना सबसे सीधा है। सम्बन्धकारक रचना को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: בָּאָה
  choice: आ पहुँचा था
  rationale: स्त्रीलिंग एकवचन क्रिया ‘वर्ष’ से मेल खाती है और नियत समय के आ जाने को बताती है; पूर्ववर्ती कथात्मक दृष्टिकोण के कारण पूर्ण भूतकाल स्वाभाविक है।
theological_decisions:
- issue: גְּאוּלַי का आशय—छुड़ाए गए लोग या छुटकारे का कार्य
  choice: मेरे छुड़ाए हुए लोग
  alternative: मेरे छुटकारे का वर्ष
  rationale: WLC का स्वरांकित रूप व्यक्तिगत बहुवचन अर्थ का समर्थन करता है, इसलिए मुख्य पाठ में उसे रखा गया है। फिर भी व्यंजनात्मक रूप और काव्यात्मक समानांतरता के आधार पर छुटकारे के कार्य पर केंद्रित अर्थ संभव है; उसे पादटिप्पणी में सुरक्षित रखा गया है। इस प्रकार न्याय और उद्धार का साथ-साथ उपस्थित रहना बना रहता है।
