id: ISA.63.5
reference: Isaiah 63:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַבִּיט֙ וְ/אֵ֣ין עֹזֵ֔ר וְ/אֶשְׁתּוֹמֵ֖ם וְ/אֵ֣ין סוֹמֵ֑ךְ וַ/תּ֤וֹשַֽׁע לִ/י֙ זְרֹעִ֔/י וַ/חֲמָתִ֖/י הִ֥יא סְמָכָֽתְ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/005.yaml
  text: I looked[a], but there was no one to help; I was appalled, but there was no one to support. So my own arm brought me salvation[b], and my wrath—it upheld me.
translation:
  language: hi
  text: मैंने देखा, पर सहायता करने वाला कोई न था; मैं स्तब्ध रह गया[a], पर सहारा देने वाला कोई न था। तब मेरी अपनी भुजा ने मेरा उद्धार किया[b], और मेरे क्रोध ने ही मुझे संभाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मैं चकित रह गया।’ इब्रानी क्रिया आघात से उपजे विस्मय या स्तब्ध व्याकुलता का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरी भुजा ने मुझे विजय दिलाई।’ इब्रानी क्रिया उस मूल से है जिसका अर्थ प्रायः ‘बचाना’ या ‘छुड़ाना’ होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַבִּיט
  choice: मैंने देखा
  rationale: नבט के हिफ़ील रूप में किसी ओर ध्यान लगाकर देखने का भाव है। ‘मैंने देखा’ सरल, स्वाभाविक और प्रसंग के अनुकूल है।
- source_word: עֹזֵר
  choice: सहायता करने वाला
  rationale: עזר का कृदंत किसी सहायक व्यक्ति को दर्शाता है; यह रूप ‘कोई न था’ के साथ स्वाभाविक हिंदी देता है।
- source_word: וְאֶשְׁתּוֹמֵם
  choice: मैं स्तब्ध रह गया
  rationale: שמם का यह रूप विस्मय, आघात और उजाड़-जैसी व्याकुलता का भाव दे सकता है। ‘स्तब्ध रह गया’ इस बहुअर्थी तीव्र प्रतिक्रिया को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: סוֹמֵךְ
  choice: सहारा देने वाला
  rationale: סמך का कृदंत थामने या सहारा देने वाले को सूचित करता है और पहले खंड के ‘सहायता करने वाला’ के समानांतर रहता है।
- source_word: וַתּוֹשַׁע לִי זְרֹעִי
  choice: मेरी अपनी भुजा ने मेरा उद्धार किया
  rationale: ישע और לִי मिलकर वक्ता के लिए उसकी भुजा द्वारा किए गए उद्धार या विजय को व्यक्त करते हैं। ‘अपनी’ प्रसंग में मानवीय सहायता के पूर्ण अभाव पर बल देता है, जबकि ‘उद्धार’ मूल की व्यापक अर्थ-सीमा बनाए रखता है।
- source_word: חֲמָתִי
  choice: मेरे क्रोध
  rationale: חֵמָה जलते हुए प्रकोप या रोष को दर्शाता है। ‘क्रोध’ आधुनिक हिंदी में गंभीर और स्पष्ट है तथा न्याय के प्रसंग को हल्का नहीं करता।
- source_word: הִיא סְמָכָתְנִי
  choice: ने ही मुझे संभाला
  rationale: स्त्रीलिंग सर्वनाम का पूर्वपद חֲמָתִי है। ‘ही’ इब्रानी के स्पष्ट सर्वनाम का बल सामने लाता है और ‘संभाला’ סמך के थामने या सहारा देने के भाव को स्वाभाविक हिंदी में रखता है।
theological_decisions:
- issue: ईश्वर के आत्म-उद्धार का मानवरूपी चित्रण
  choice: मेरी अपनी भुजा ने मेरा उद्धार किया
  alternative: मेरी भुजा ने मुझे विजय दिलाई
  rationale: इब्रानी वक्ता की भुजा को बिना किसी मानवीय सहायक के उद्धार या विजय का साधन बताती है। अनुवाद इस मानवरूपी चित्र को बनाए रखता है और उससे आगे कोई संकीर्ण धर्मसैद्धांतिक निष्कर्ष नहीं जोड़ता।
- issue: क्रोध का वक्ता को संभालने वाली शक्ति के रूप में चित्रण
  choice: मेरे क्रोध ने ही मुझे संभाला
  alternative: मेरे प्रकोप ने मुझे थामे रखा
  rationale: मूल पाठ क्रोध को वक्ता को सहारा देने वाला बताता है। यह तनावपूर्ण न्याय-चित्रण ज्यों का त्यों रखा गया है, नरम नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में सरल, गंभीर और भविष्यवाणी-साहित्य के अनुरूप रखी गई है। समानांतर वाक्यरचना तथा ‘भुजा’ और ‘क्रोध’ के सजीव मानवरूपी बिंब सुरक्षित हैं। [a] को उस इब्रानी क्रिया के साथ रखा गया है जिससे उसका वास्तविक lexical संबंध है।
