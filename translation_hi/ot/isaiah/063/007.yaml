  text: חַֽסְדֵ֨י יְהוָ֤ה אַזְכִּיר֙ תְּהִלֹּ֣ת יְהוָ֔ה כְּ/עַ֕ל כֹּ֥ל אֲשֶׁר גְּמָלָ֖/נוּ יְהוָ֑ה וְ/רַב טוּב֙ לְ/בֵ֣ית יִשְׂרָאֵ֔ל אֲשֶׁר גְּמָלָ֥/ם כְּֽ/רַחֲמָ֖י/ו וּ/כְ/רֹ֥ב חֲסָדָֽי/ו׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/007.yaml
  text: I will recount the steadfast love of Yahweh[a], the praises of Yahweh, according to all that Yahweh has bestowed on us[c][b], and the great goodness to the house of Israel that he has bestowed on them according to his compassion and according to the abundance of his steadfast love.
translation:
  language: hi
  text: मैं याहवे[a] के अटल प्रेम के कार्यों और याहवे की स्तुतियों का वर्णन करूँगा, उस सब के अनुसार जो याहवे ने हम पर किया है[c], और इस्राएल के घराने पर की गई उस बड़ी भलाई का भी, जो उसने उन पर अपनी करुणा और अपने अटल प्रेम की बहुतायत के अनुसार की है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘याहवे’ इब्रानी ईश्वरीय नाम YHWH का लिप्यंतरण है; परंपरागत अनुवादों में इसके स्थान पर प्रायः ‘प्रभु’ लिखा जाता है।
    reason: alternative_reading
  - marker: c
    text: या, ‘हम पर उपकार किया।’ इब्रानी क्रिया का अर्थ किसी के साथ व्यवहार करना, उसे प्रतिफल देना, या उस पर भलाई करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדֵי / חֲסָדָיו
  choice: अटल प्रेम / अटल प्रेम के काम
  rationale: חסד निष्ठावान, टिकाऊ और वाचा-संबंधी प्रेम को व्यक्त करता है। पहले बहुवचन को स्वाभाविक हिन्दी में ‘अटल प्रेम के काम’ कहा गया है, जबकि अंतिम पदबंध में भाववाचक ‘अटल प्रेम’ रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यंजनात्मक नाम YHWH को किसी उपाधि से बदलने के बजाय उसके प्रचलित विद्वत्तापूर्ण उच्चारण का देवनागरी लिप्यंतरण किया गया है।
- source_word: אַזְכִּיר
  choice: वर्णन करूँगा
  rationale: हिफ़ील रूप यहाँ केवल मन में स्मरण करने के बजाय परमेश्वर के कामों को बोलकर याद दिलाने या सुनाने का भाव देता है।
- source_word: תְּהִלֹּת
  choice: प्रशंसनीय काम
  rationale: बहुवचन संज्ञा स्तुतियों के साथ-साथ स्तुति के योग्य कार्यों को भी सूचित कर सकती है; अगले वाक्यांशों में उन्हीं कार्यों का विस्तार होने के कारण यह प्रयोग प्रसंगानुकूल है।
- source_word: כְּעַל כֹּל אֲשֶׁר
  choice: उस सब के अनुसार जो
  rationale: यह पदबंध वर्णन और स्तुति के आधार अथवा परिमाण को व्यक्त करता है; ‘के अनुसार’ उस अर्थ को कारणवाचक बनाकर सीमित नहीं करता।
- source_word: גְּמָלָנוּ / גְּמָלָם
  choice: हमारे लिए किया / उसने ... के लिए की
  rationale: גמל का अर्थ व्यवहार करना, प्रतिफल देना या भलाई पहुँचाना हो सकता है। यहाँ भलाई का संदर्भ सकारात्मक अर्थ स्पष्ट करता है, पर हिन्दी में कोई अतिरिक्त वस्तु जोड़ने से बचने के लिए ‘किया/की’ रखा गया है।
- source_word: וְרַב טוּב
  choice: अपार भलाई
  rationale: רַב मात्रा और महानता दोनों का बोध देता है; ‘अपार भलाई’ सहज हिन्दी में उसकी प्रचुरता व्यक्त करती है।
- source_word: לְבֵית יִשְׂרָאֵל
  choice: इस्राएल के घराने के लिए
  rationale: ‘घराना’ सामूहिक और वाचा-संबंधी पद ‘इस्राएल का घर’ का स्वाभाविक हिन्दी रूप है।
- source_word: כְּרַחֲמָיו
  choice: अपनी करुणा के अनुसार
  rationale: רַחֲמִים गहरी, कोमल दया या करुणा को दर्शाता है; हिन्दी में एकवचन भाववाचक ‘करुणा’ स्वाभाविक है।
- source_word: וּכְרֹב חֲסָדָיו
  choice: अपने अटल प्रेम की बहुतायत के अनुसार
  rationale: רֹב की मात्रात्मक शक्ति और חסד की निष्ठावान प्रेम की धारणा दोनों को स्पष्ट रूप से बनाए रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम YHWH का प्रयोग करता है। ‘याहवे’ नाम को उपाधि से प्रतिस्थापित नहीं करता और आधुनिक विद्वत्तापूर्ण उच्चारण को दर्शाता है।
- issue: חסד की अर्थ-समृद्धि
  choice: अटल प्रेम
  alternative: करुणा; कृपा; वाचा की निष्ठा
  rationale: ‘अटल प्रेम’ संबंधपरक निष्ठा और स्थायित्व दोनों को रखता है, जबकि केवल ‘करुणा’ या ‘कृपा’ अर्थ को संकरा कर सकती है; वाचा का अर्थ निहित हो सकता है, पर उसे मुख्य पाठ में स्पष्ट जोड़ नहीं बनाया गया।
- issue: वक्ता का ‘हम’ से ‘इस्राएल के घराने’ की ओर जाना
  choice: मूल का दृष्टिकोण-परिवर्तन बनाए रखा
  alternative: दोनों स्थानों पर ‘हम’ करना
  rationale: इब्रानी पाठ पहले ‘हमारे’ और फिर इस्राएल के घराने के लिए तृतीय पुरुष का प्रयोग करता है। इस तनाव को एकरूप करके मिटाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। दोहराव और समानांतरता को डैशों के द्वारा स्पष्ट किया गया है। ‘घराना,’ ‘करुणा’ और ‘बहुतायत’ जैसे परिचित बाइबलीय शब्द रखे गए हैं, पर अत्यधिक संस्कृतनिष्ठ या पुरातन वाक्य-विन्यास से बचा गया है।
