  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי אַתָּ֣ה אָבִ֔י/נוּ כִּ֤י אַבְרָהָם֙ לֹ֣א יְדָעָ֔/נוּ וְ/יִשְׂרָאֵ֖ל לֹ֣א יַכִּירָ֑/נוּ אַתָּ֤ה יְהוָה֙ אָבִ֔י/נוּ גֹּאֲלֵ֥/נוּ מֵֽ/עוֹלָ֖ם שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/016.yaml
  text: For you are our Father[a], though Abraham does not know us and Israel does not acknowledge us; you, O Yahweh, are our Father[b]; our Redeemer from of old is your name.
translation:
  language: hi
  text: क्योंकि आप ही हमारे पिता हैं। यद्यपि अब्राहम हमें नहीं जानता और इस्राएल[a] हमें नहीं पहचानता, हे याहवे, आप ही हमारे पिता हैं; प्राचीन काल से आपका नाम हमारा छुड़ानेवाला है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “इस्राएल” से सम्भवतः कुलपिता याकूब अभिप्रेत है, जो अब्राहम के समानांतर रखा गया है।
    reason: cross_reference
  - marker: b
    text: या, “सनातन काल से आपका नाम हमारा छुड़ानेवाला है।”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि / भले ही
  rationale: पहला כִּי प्रार्थना के आधार को बताता है, इसलिए “क्योंकि”; दूसरा उसी कथन के भीतर विरोधात्मक परिस्थिति व्यक्त करता है, इसलिए स्वाभाविक हिन्दी में “भले ही।”
- source_word: אָבִינוּ
  choice: हमारे पिता
  rationale: यह परमेश्वर के लिए सम्बन्धपरक और वाचागत सम्बोधन है; “पिता” इसके व्यक्तिगत और धर्मवैचारिक बल को बनाए रखता है।
- source_word: יְדָעָנוּ
  choice: हमें न जानता हो
  rationale: ידע का मूल अर्थ “जानना” है; यहाँ पूर्वज द्वारा सम्बन्धपरक पहचान न दिए जाने का भाव है।
- source_word: יַכִּירָנוּ
  choice: हमें न पहचानता हो
  rationale: נכר के हिफ़ील रूप का अर्थ पहचानना या स्वीकार करना हो सकता है। “पहचानता” पहले क्रियापद से हल्का भेद रखते हुए समानांतरता बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का लिप्यंतरण किया गया है, किसी उपाधि से उसका प्रतिस्थापन नहीं।
- source_word: גֹּאֲלֵנוּ
  choice: हमारा छुड़ानेवाला
  rationale: גאל में छुड़ाने और निकट सम्बन्धी के दायित्व की पृष्ठभूमि है। “छुड़ानेवाला” सहज हिन्दी में मुख्य उद्धारकारी अर्थ रखता है, बिना सम्बन्धी की धारणा को पाठ में आवश्यकता से अधिक स्पष्ट किए।
- source_word: מֵעוֹלָם
  choice: प्राचीन काल से
  rationale: עוֹלָם दूरस्थ अतीत अथवा अनन्त अवधि का बोध करा सकता है। मुख्य पाठ दूरस्थ प्राचीनता को रखता है और अनन्तता की सम्भावना टिप्पणी में सुरक्षित है।
- source_word: שְׁמֶךָ
  choice: आपका नाम है
  rationale: इब्रानी की क्रियारहित विधेयात्मक रचना को स्वाभाविक हिन्दी में “आपका नाम है” के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; लिप्यंतरण उस नाम को उपाधि में बदले बिना सुरक्षित रखता है।
- issue: מֵעוֹלָם का कालगत बल
  choice: प्राचीन काल से
  alternative: सनातन काल से / अनादि काल से
  rationale: यह पद दूरस्थ प्राचीनता और अनन्त अवधि, दोनों का संकेत दे सकता है। मुख्य पाठ अपेक्षाकृत न्यून-व्याख्यात्मक अर्थ रखता है और अधिक प्रबल कालगत अर्थ को पादटिप्पणी में देता है।
- issue: इस्राएल की पहचान
  choice: कुलपिता याकूब की ओर संकेत
  alternative: इस्राएल राष्ट्र
  rationale: अब्राहम के साथ काव्यात्मक समानांतरता में “इस्राएल” सम्भवतः कुलपिता याकूब का दूसरा नाम है; इसे मुख्य पाठ में स्पष्ट न करके टिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और प्रार्थनात्मक रखी गई है। परमेश्वर के लिए आदरसूचक “आप” प्रयुक्त हुआ है। “भले ही” इब्रानी समानांतर पंक्तियों के विरोधात्मक सम्बन्ध को स्वाभाविक हिन्दी में प्रकट करता है; विरामचिह्न कविता की विचार-गति स्पष्ट करते हैं।
