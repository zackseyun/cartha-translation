  text: וַ/נְּהִ֤י כַ/טָּמֵא֙ כֻּלָּ֔/נוּ וּ/כְ/בֶ֥גֶד עִדִּ֖ים כָּל צִדְקֹתֵ֑י/נוּ וַ/נָּ֤בֶל כֶּֽ/עָלֶה֙ כֻּלָּ֔/נוּ וַ/עֲוֺנֵ֖/נוּ כָּ/ר֥וּחַ יִשָּׂאֻֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/005.yaml
  text: We all became like one who is unclean[a], and all our righteous deeds are like a filthy garment; we all wither like a leaf, and our iniquities carry us away like the wind.
translation:
  language: hi
  text: हम सब एक अशुद्ध जन के समान हो गए हैं, और हमारे सारे धर्मी काम मलिन वस्त्र के समान हैं।[a] हम सब पत्ते के समान मुरझा गए हैं, और हमारे अधर्म हमें हवा की तरह उड़ा ले जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक विशेष रूप से, “मासिक अशुद्धता से जुड़ा वस्त्र।”
    reason: עִדִּים मासिक धर्म से संबंधित अशुद्धता का संकेत कर सकता है। मुख्य पाठ का ‘मलिन वस्त्र’ रूपक की व्यापक अशुद्धता बनाए रखता है, जबकि पादटिप्पणी इसका विशिष्ट lexical संकेत सुरक्षित रखती है।
lexical_decisions:
- source_word: וַנְּהִי כַטָּמֵא כֻּלָּנוּ
  choice: हम सब अशुद्ध मनुष्य के समान हो गए हैं
  rationale: וַנְּהִי अवस्था में आए परिवर्तन को व्यक्त करता है; כַטָּמֵא का एकवचन विशेषण किसी अशुद्ध व्यक्ति या वस्तु की ओर संकेत कर सकता है। हिन्दी में ‘अशुद्ध मनुष्य’ व्यक्तिगत भाव को स्वाभाविक रूप से बनाए रखता है, जबकि अशुद्धता को केवल कर्मकाण्डीय या केवल नैतिक अर्थ तक सीमित नहीं करता।
- source_word: וּכְבֶגֶד עִדִּים
  choice: मासिक धर्म से अशुद्ध वस्त्र के समान
  rationale: עִדִּים यहाँ मासिक धर्म से जुड़ी अशुद्धता का अधिक विशिष्ट संकेत देता है। इसे मुख्य पाठ में स्पष्ट करना मूल रूपक की तीव्रता और ठोस अर्थ को सुरक्षित रखता है।
- source_word: כָּל צִדְקֹתֵינוּ
  choice: हमारे सब धर्म के काम
  rationale: बहुवचन צִדְקֹת यहाँ अमूर्त धार्मिकता के बजाय ठोस धार्मिक या न्यायपूर्ण कार्यों को सूचित करता है। ‘धर्म के काम’ साधारण आधुनिक हिन्दी में स्पष्ट है और बहुवचन भाव बनाए रखता है।
- source_word: וַנָּבֶל כֶּעָלֶה כֻּלָּנוּ
  choice: हम सब पत्ते के समान मुरझा जाते हैं
  rationale: נבל वनस्पति के मुरझाने या सूखने का चित्र प्रस्तुत करता है; पत्ते की उपमा के साथ ‘मुरझा जाते हैं’ स्वाभाविक और सटीक है।
- source_word: וַעֲוֺנֵנוּ
  choice: हमारे अधर्म
  rationale: עָוֹן अधर्म, दोष या उसके परिणाम को व्यक्त कर सकता है। ‘अधर्म’ नैतिक गंभीरता बनाए रखते हुए उस अर्थ-सीमा को अनावश्यक रूप से केवल पाप या दण्ड तक संकुचित नहीं करता।
- source_word: כָּרוּחַ יִשָּׂאֻנוּ
  choice: हमें हवा की तरह उड़ा ले जाते हैं
  rationale: נשא का मूल अर्थ उठाना या ले जाना है। पत्ते और हवा के संदर्भ में ‘उड़ा ले जाते हैं’ हिन्दी में चित्र को स्वाभाविक और सजीव बनाता है।
theological_decisions:
- issue: स्वीकारोक्ति में अशुद्धता का स्वरूप
  choice: ‘अशुद्ध’ और मासिक धर्म से अशुद्ध वस्त्र की छवि को बनाए रखा गया है, पर इसे केवल कर्मकाण्डीय अशुद्धता या किसी बाद की व्यवस्थित धर्मशास्त्रीय धारणा तक सीमित नहीं किया गया।
  alternative: इसे केवल धार्मिक-विधि संबंधी अशुद्धता मानना, अथवा इसे किसी विशिष्ट व्यवस्थित सिद्धान्त का प्रत्यक्ष कथन बनाना।
  rationale: पद पश्चात्तापपूर्ण स्वीकारोक्ति में अशुद्धता का रूपक प्रयोग करता है। अनुवाद को उसके नैतिक और कर्मकाण्डीय अनुनादों सहित तनाव बनाए रखना चाहिए।
- issue: ‘धर्म के काम’ का मूल्यांकन
  choice: पद के सामूहिक स्वीकारोक्ति-संदर्भ में सभी धार्मिक कामों की अशुद्ध वस्त्र से तुलना को यथावत रखा गया।
  alternative: वाक्य को केवल कपटपूर्ण कामों या केवल आत्म-धार्मिकता के कामों तक सीमित करना।
  rationale: मूल पाठ כָּל צִדְקֹתֵינוּ कहता है और स्वयं कोई अतिरिक्त सीमा नहीं जोड़ता; इसलिए अनुवाद भी ऐसी व्याख्यात्मक सीमा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, सामूहिक स्वीकारोक्ति का स्वर रखा गया है। ‘धर्म के काम,’ ‘अधर्म,’ ‘मुरझा जाते हैं’ और ‘उड़ा ले जाते हैं’ सामान्य पाठक के लिए समझने योग्य हैं; मुख्य पाठ में मूल के मासिक धर्म-संबंधी रूपक को शिष्ट किन्तु स्पष्ट भाषा में रखा गया है।
