  edition: WLC
  text: בַּ/עֲשׂוֹתְ/ךָ֥ נוֹרָא֖וֹת לֹ֣א נְקַוֶּ֑ה יָרַ֕דְתָּ מִ/פָּנֶ֖י/ךָ הָרִ֥ים נָזֹֽלּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/002.yaml
  text: When you did awesome things that we did not expect[a], you came down[b]; the mountains quaked before you.
translation:
  language: hi
  text: जब तूने ऐसे विस्मयकारी काम किए जिनकी हमें आशा न थी[a], तब तू उतर आया; तेरी उपस्थिति में पहाड़ बह निकले[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जिनकी हमने बाट न जोही थी’ अथवा ‘जिनकी हमने प्रतीक्षा न की थी।’
    reason: lexical_alternative
  - marker: b
    text: या ‘पहाड़ पिघल गए’ अथवा ‘काँप उठे।’ इब्रानी क्रिया बह निकलने या द्रवित होकर ढल जाने का सजीव काव्यात्मक चित्र प्रस्तुत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲשׂוֹתְךָ
  choice: जब तूने ... किए
  rationale: ב के साथ infinitive construct और द्वितीय पुरुष एकवचन प्रत्यय यहाँ काल-सूचक संबंध व्यक्त करते हैं; इसलिए स्वाभाविक हिन्दी में ‘जब तूने ... किए’ उपयुक्त है।
- source_word: נוֹרָאוֹת
  choice: विस्मयकारी काम
  rationale: यह शब्द ऐसे कार्यों को दर्शाता है जो भय-मिश्रित श्रद्धा और विस्मय उत्पन्न करते हैं। ‘विस्मयकारी’ आधुनिक हिन्दी में उस गरिमापूर्ण भाव को स्पष्ट रखता है।
- source_word: לֹא נְקַוֶּה
  choice: जिनकी हमें आशा न थी
  rationale: קוה में आशा रखने और प्रतीक्षा करने, दोनों की अर्थ-छाया है। प्रसंग में ‘आशा न थी’ अनपेक्षित होने का भाव स्वाभाविक रूप से व्यक्त करता है, जबकि पादटिप्पणी प्रतीक्षा की वैकल्पिक छाया सुरक्षित रखती है।
- source_word: יָרַדְתָּ
  choice: तू उतर आया
  rationale: ירד का सीधा अर्थ नीचे उतरना है। प्रार्थनात्मक संबोधन और ईश-प्रकटन के प्रसंग में ‘उतर आया’ स्वाभाविक और सजीव है।
- source_word: מִפָּנֶיךָ
  choice: तेरी उपस्थिति में
  rationale: शाब्दिक रूप से ‘तेरे मुख/उपस्थिति के सामने से।’ यहाँ यह परमेश्वर के प्रकट होने पर पहाड़ों की प्रतिक्रिया बताता है; ‘तेरी उपस्थिति में’ उस आशय को स्पष्ट रखता है।
- source_word: הָרִים
  choice: पहाड़
  rationale: הָרִים का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: נָזֹלּוּ
  choice: पिघलकर बहने लगे
  rationale: क्रिया बहने, गलने या द्रवित हो जाने की काव्यात्मक छवि जगाती है। संयुक्त अभिव्यक्ति ‘पिघलकर बहने लगे’ हिन्दी में इस असामान्य लेकिन जानबूझकर प्रयुक्त ठोस चित्र को बनाए रखती है; केवल ‘काँप उठे’ कहना इसे सामान्यीकृत कर देता।
theological_decisions:
- issue: परमेश्वर के उतरने पर पहाड़ों की प्रतिक्रिया का ईश-प्रकटन संबंधी चित्र
  choice: ठोस काव्यात्मक चित्र ‘पहाड़ पिघलकर बहने लगे’ बनाए रखा गया।
  alternative: ‘पहाड़ काँप उठे’ या ‘पहाड़ पिघल गए।’
  rationale: इब्रानी क्रिया सृष्टि के परमेश्वर की उपस्थिति में मानो द्रवित होकर बहने का प्रबल चित्र देती है। इसे केवल कंपन के रूप में प्रस्तुत करना संभावित अर्थ तो है, पर मूल रूपक को संकुचित कर सकता है।
- issue: קוה में आशा और प्रतीक्षा की अर्थ-छाया
  choice: मुख्य पाठ में ‘आशा न थी।’
  alternative: ‘जिसकी हमने बाट न जोही थी’ या ‘जिसकी हमने प्रतीक्षा न की थी।’
  rationale: यहाँ अनपेक्षित विस्मयकारी कार्यों का भाव प्रमुख प्रतीत होता है, फिर भी पादटिप्पणी प्रतीक्षा वाले अर्थ को खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थनात्मक शैली रखी गई है। परमेश्वर के लिए निकट और प्रत्यक्ष एकवचन संबोधन ‘तू/तेरी’ मूल इब्रानी के द्वितीय पुरुष एकवचन और इस प्रार्थना की तीव्रता को दर्शाता है। वाक्य का काव्यात्मक वेग बनाए रखने के लिए अर्धविराम रखा गया है।
