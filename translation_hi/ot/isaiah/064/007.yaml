id: ISA.64.7
reference: Isaiah 64:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֥ה יְהוָ֖ה אָבִ֣י/נוּ אָ֑תָּה אֲנַ֤חְנוּ הַ/חֹ֨מֶר֙ וְ/אַתָּ֣ה יֹצְרֵ֔/נוּ וּ/מַעֲשֵׂ֥ה יָדְ/ךָ֖ כֻּלָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/007.yaml
  text: But now, O Yahweh, you are our Father; we are the clay, and you are our potter; we all are the work of your hand.
translation:
  language: hi
  text: पर अब, हे याहवे[a], आप हमारे पिता हैं; हम मिट्टी हैं, और आप हमारे कुम्हार हैं; हम सब आपके हाथ की कारीगरी हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में יהוה (य्ह्वह), परमेश्वर का व्यक्तिगत नाम।
    reason: “याहवे” के मूल और उसके उपाधि न होकर व्यक्तिगत नाम होने की संक्षिप्त जानकारी देना; देवनागरी लिप्यंतरण को ठीक करना।
lexical_decisions:
- source_word: וְעַתָּה
  choice: पर अब
  rationale: संयोजक और कालवाचक क्रिया-विशेषण पिछले संदर्भ से मुड़कर एक नई विनती आरम्भ करते हैं। “पर अब” इस विरोध और संक्रमण को सहज हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे[a]
  rationale: यह इब्रानी चतुरक्षरीय व्यक्तिगत नाम יהוה का लिप्यंतरण है; इसे किसी उपाधि से बदलने के बजाय मूल पाठ में उपस्थित नाम के रूप में रखा गया है।
- source_word: אָבִינוּ
  choice: हमारे पिता
  rationale: पहले पुरुष बहुवचन प्रत्यय सहित यह संज्ञा परमेश्वर के साथ समुदाय के प्रत्यक्ष संबंध को व्यक्त करती है; पितृ-संबंधी भाषा को स्पष्ट रूप में बनाए रखा गया है।
- source_word: אֲנַחְנוּ הַחֹמֶר
  choice: हम मिट्टी हैं
  rationale: हिन्दी में निश्चित उपपद न होने के कारण “मिट्टी” स्वाभाविक रूप से उस सामग्री को दर्शाती है जिसे कुम्हार आकार देता है; रूपक अक्षुण्ण रहता है।
- source_word: וְאַתָּה יֹצְרֵנוּ
  choice: और आप हमारे कुम्हार हैं
  rationale: यצר का कृदन्त रूप आकार देने वाले को दर्शाता है। मिट्टी के समानांतर “कुम्हार” सबसे सटीक और स्वाभाविक रूपक है।
- source_word: וּמַעֲשֵׂה יָדְךָ
  choice: आपके हाथ की कारीगरी
  rationale: यह अनुवाद इब्रानी के हस्तकौशल-संबंधी मानवीकरण को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक और काव्यात्मक है।
- source_word: כֻּלָּנוּ
  choice: हम सब
  rationale: मूल में पद के अंत में रखा गया यह शब्द पूरे समुदाय पर बल देता है; “हम सब” उसी समावेशी बल को स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम יהוה का प्रयोग करता है। “याहवे” नाम का प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और इसे उपाधि “प्रभु” से नहीं बदलता।
- issue: परमेश्वर के लिए पितृ-संबंधी भाषा
  choice: हमारे पिता
  alternative: हमारे जनक; हमारे माता-पिता
  rationale: इब्रानी אָבִינוּ स्पष्ट रूप से “हमारे पिता” कहता है। मूल की पुरुषवाचक पारिवारिक उपमा को बिना विस्तार या लिंग-निरपेक्ष परिवर्तन के रखा गया है।
- issue: द्वितीय पुरुष संबोधन का हिन्दी स्तर
  choice: आप
  alternative: तू; तुम
  rationale: इब्रानी में संबोधन एकवचन है, पर आधुनिक मानक हिन्दी में प्रार्थना के गरिमापूर्ण और सहज स्वर के लिए “आप” चुना गया है। इससे निकटता के धर्मवैज्ञानिक अर्थ को न तो बढ़ाया गया है, न घटाया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मिट्टी–कुम्हार का मूल काव्यात्मक रूपक तथा “हम सब” का सामुदायिक बल सुरक्षित है। सम्मानसूचक “आप” आधुनिक हिन्दी की प्रार्थनात्मक शैली के अनुकूल है।
