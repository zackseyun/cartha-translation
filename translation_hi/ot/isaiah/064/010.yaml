base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/010.yaml
  text: Our holy and beautiful house[a], where our fathers praised you, has become a burning with fire[b], and all our precious things have become a ruin.
translation:
  language: hi
  text: हमारा पवित्र और शोभायमान भवन, जहाँ हमारे पुरखों[a] ने आपकी स्तुति की थी, आग में जलकर भस्म हो गया है[b]; और हमारी सभी बहुमूल्य वस्तुएँ उजाड़ पड़ी हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे पूर्वजों”; शाब्दिक रूप से, “हमारे पिताओं।”
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप से, “आग का दहन बन गया है”; अर्थात, “आग से जल गया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית קָדְשֵׁנוּ וְתִפְאַרְתֵּנוּ
  choice: हमारा पवित्र और शोभायमान भवन
  rationale: यह पदबंध शाब्दिक रूप से ‘हमारी पवित्रता और हमारी शोभा/महिमा का भवन’ है। ‘पवित्र और शोभायमान भवन’ मन्दिर की पवित्रता और वैभव दोनों को स्वाभाविक हिन्दी में बनाए रखता है; ‘भवन’ से यहाँ साधारण घर के बजाय उपासना-स्थल का संकेत मिलता है।
- source_word: אֲשֶׁר הִלְלוּךָ אֲבֹתֵינוּ
  choice: जहाँ हमारे पुरखाओं ने आपकी स्तुति की थी
  rationale: אֲשֶׁר यहाँ स्थानसूचक सम्बन्धवाचक अर्थ देता है, इसलिए ‘जहाँ’ स्वाभाविक है। ‘पुरखाओं’ से אֲבֹתֵינוּ का पुरुषवाची और वंशगत स्वर बना रहता है, जबकि ‘स्तुति’ पिएल रूप הִלְלוּךָ का उपयुक्त धार्मिक अर्थ व्यक्त करती है।
- source_word: הָיָה לִשְׂרֵפַת אֵשׁ
  choice: आग में जलकर भस्म हो गया है
  rationale: इब्रानी की संज्ञात्मक अभिव्यक्ति का आशय आग से पूर्ण विनाश है। शाब्दिक बनावट हिन्दी में अस्वाभाविक होती, इसलिए परिणामकारी भाव को स्पष्ट और गंभीर भाषा में व्यक्त किया गया है; अधिक रूप-सन्निकट विकल्प पादटिप्पणी में दिया गया है।
- source_word: מַחֲמַדֵּינוּ
  choice: हमारी सभी बहुमूल्य वस्तुएँ
  rationale: यह शब्द मनभावनी, प्रिय, बहुमूल्य या संजोई हुई वस्तुओं के लिए प्रयुक्त हो सकता है। ‘बहुमूल्य वस्तुएँ’ आर्थिक और भावनात्मक मूल्य दोनों के लिए पर्याप्त खुला है और यह तय नहीं करता कि केवल मन्दिर की सामग्री ही अभिप्रेत है।
- source_word: לְחָרְבָּה
  choice: उजाड़ पड़ी हैं
  rationale: חָרְבָּה विनाश, उजाड़ या खंडहर की दशा बताता है। वस्तुओं को हिन्दी में ‘खंडहर हो गईं’ कहना अस्वाभाविक है; ‘उजाड़ पड़ी हैं’ विनाशोपरान्त दशा को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘हमारा पवित्र और शोभायमान भवन’ का सन्दर्भ
  choice: मुख्यतः यरूशलेम का मन्दिर
  alternative: यरूशलेम अथवा देश के पवित्र स्थलों सहित व्यापक सन्दर्भ
  rationale: जिस भवन में पुरखाओं ने परमेश्वर की स्तुति की, वह सबसे सीधे रूप में मन्दिर है। फिर भी पद में ‘मन्दिर’ शब्द जोड़कर व्यापक विलाप-सन्दर्भ की सम्भावना को पूरी तरह बन्द नहीं किया गया।
- issue: אֲבֹתֵינוּ का अनुवाद
  choice: हमारे पुरखाओं
  alternative: हमारे पूर्वजों; शाब्दिक रूप से ‘हमारे पिताओं’
  rationale: ‘पुरखाओं’ आधुनिक हिन्दी में समझने योग्य है और इब्रानी के स्पष्ट पुरुषवाची, वाचा-ऐतिहासिक स्वर को ‘पूर्वजों’ की अपेक्षा अधिक निकटता से रखता है, जबकि अत्यधिक शाब्दिक ‘पिताओं’ से उत्पन्न अस्वाभाविकता से बचता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘शोभायमान भवन’ पवित्रस्थान के वैभव को व्यक्त करता है, ‘पुरखाओं’ में स्रोत का पुरुषवाची ऐतिहासिक स्वर बचता है, और विनाश का वर्णन स्वाभाविक हिन्दी में है।
