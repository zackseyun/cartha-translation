source:
  edition: WLC
  text: אַל תִּקְצֹ֤ף יְהוָה֙ עַד מְאֹ֔ד וְ/אַל לָ/עַ֖ד תִּזְכֹּ֣ר עָוֺ֑ן הֵ֥ן הַבֶּט נָ֖א עַמְּ/ךָ֥ כֻלָּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/008.yaml
  text: 'Do not be exceedingly angry[a], O Yahweh, and do not remember iniquity forever. Look, please: we are all your people.'
translation:
  language: hi
  text: 'हे याहवे, बहुत अधिक क्रोधित न हो, और अधर्म[a] को सदा स्मरण न रख। देख, कृपा करके: हम सब तेरी प्रजा हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दोष”; इब्रानी עָוֹן गलत कार्य और उससे उत्पन्न दोष—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּקְצֹף ... עַד מְאֹד
  choice: अत्यन्त क्रोधित न हो
  rationale: कצף क्रोध करने को और עַד מְאֹד उसकी तीव्रता को व्यक्त करता है। यह हिंदी में निषेधात्मक विनती के रूप में स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत वाचा-नाम יהוה को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: וְאַל לָעַד תִּזְכֹּר עָוֹן
  choice: और हमारे अधर्म को सदा स्मरण न रख
  rationale: זכר यहाँ न्याय के लिए अपराध को याद रखने या मन में बनाए रखने का भाव रखता है। संबंधसूचक 'हमारे' संदर्भ और अंतिम सामूहिक निवेदन से स्पष्ट है; हिंदी में इसके बिना वाक्य अस्वाभाविक और अस्पष्ट होता।
- source_word: עָוֹן
  choice: अधर्म
  rationale: यह शब्द गलत कार्य और उससे उत्पन्न दोष—दोनों का संकेत दे सकता है। 'अधर्म' नैतिक गंभीरता बनाए रखता है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: הֵן הַבֶּט נָא
  choice: देख, कृपा करके ध्यान दे
  rationale: הֵן ध्यान आकर्षित करता है, הַבֶּט देखने की आज्ञा है, और נָא विनती को नम्र बनाता है। हिंदी में यह संयोजन आग्रह और विनम्रता दोनों को स्वाभाविक रूप से रखता है।
- source_word: עַמְּךָ כֻלָּנוּ
  choice: हम सब तेरी प्रजा हैं
  rationale: मूल का क्रियारहित वाक्य हिंदी में सहायक क्रिया के साथ स्वाभाविक बनाया गया है और सामूहिक वाचा-संबंध सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में उपाधि नहीं, ईश्वर का वाचा-नाम है; इसलिए उसे उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: पश्चाताप की प्रार्थना में עָוֹן का अर्थ
  choice: अधर्म
  alternative: दोष
  rationale: मूल शब्द अपराध और उसके फलस्वरूप दोष दोनों अर्थ रख सकता है। मुख्य पाठ में नैतिक कृत्य का अर्थ रखा गया है और वास्तविक अर्थ-संदेह पाद-टिप्पणी में सुरक्षित है।
- issue: दिव्य संबोधन का हिंदी सर्वनाम
  choice: तेरी
  alternative: आपकी
  rationale: एकवचन प्रत्यय ךָ को सीधे और पारंपरिक प्रार्थनात्मक एकवचन में रखा गया है; सम्मानसूचक बहुवचन मूल की व्याकरणिक संख्या को धुंधला कर सकता था।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण प्रार्थनात्मक शैली अपनाई गई है। भाषा सामान्य पाठक के लिए सहज है; 'स्मरण न रख' मूल के न्यायिक-वाचागत भाव को बनाए रखता है।
