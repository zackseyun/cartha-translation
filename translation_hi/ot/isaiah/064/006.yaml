  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֵין קוֹרֵ֣א בְ/שִׁמְ/ךָ֔ מִתְעוֹרֵ֖ר לְ/הַחֲזִ֣יק בָּ֑/ךְ כִּֽי הִסְתַּ֤רְתָּ פָנֶ֨י/ךָ֙ מִמֶּ֔/נּוּ וַ/תְּמוּגֵ֖/נוּ בְּ/יַד עֲוֺנֵֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/006.yaml
  text: And there is no one who calls on your name[a], who stirs himself up to take hold of you; for you have hidden your face from us and have given us over into the hand of our iniquity.
translation:
  language: hi
  text: 'और कोई नहीं जो तेरा नाम लेकर पुकारता हो,

    जो तुझे थामने के लिए अपने आपको जगाता हो;

    क्योंकि तूने अपना मुख हमसे छिपा लिया है

    और हमें हमारे अधर्म के हाथ में सौंप दिया है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “और हमारे अधर्म के हाथ में हमें गला दिया है।” इब्रानी क्रिया में गलने, घुलने या क्षीण हो जाने का बिंब है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵין
  choice: और कोई नहीं
  rationale: संयोजक और पूर्ण अभाव—दोनों को सहज, संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: קוֹרֵא בְשִׁמְךָ
  choice: जो तेरे नाम को पुकारता हो
  rationale: प्रार्थना और उपासना में परमेश्वर के नाम का आह्वान करने वाले इब्रानी मुहावरे को बनाए रखता है।
- source_word: מִתְעוֹרֵר
  choice: अपने आपको जगाता हो
  rationale: हित्पएल रूप की आत्मप्रेरित, प्रत्यावर्ती क्रिया को स्पष्ट रखता है और हिन्दी में स्वाभाविक है।
- source_word: לְהַחֲזִיק בָּךְ
  choice: तुझे थामने के लिए
  rationale: परमेश्वर को दृढ़ता से पकड़ने या उससे लिपटे रहने के सजीव रूपक को बनाए रखता है।
- source_word: הִסְתַּרְתָּ פָנֶיךָ מִמֶּנּוּ
  choice: तूने अपना मुख हमसे छिपा लिया है
  rationale: ईश्वरीय विमुखता या अप्रसन्नता के पारंपरिक इब्रानी बिंब को बिना समतल किए सुरक्षित रखता है।
- source_word: וַתְּמוּגֵנוּ
  choice: हमें … सौंप दिया है
  rationale: मूल क्रिया का शाब्दिक बिंब गलाने या क्षीण करने का है, पर इस प्रसंग में अधर्म के वश में छोड़ दिए जाने का भाव है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: בְּיַד עֲוֺנֵנוּ
  choice: हमारे अधर्म के हाथ में
  rationale: ‘हाथ’ के इब्रानी बिंब और अधर्म की सामर्थ्य के भाव—दोनों को बनाए रखता है; עָוֹן के नैतिक भार को ‘अधर्म’ व्यक्त करता है।
theological_decisions:
- issue: अंतिम उपवाक्य में परमेश्वर की क्रिया और मनुष्य के अधर्म का संबंध
  choice: परमेश्वर ने लोगों को उनके अपने अधर्म के हाथ में सौंप दिया है।
  alternative: परमेश्वर ने उन्हें उनके अधर्म के हाथ में गला दिया है अथवा उनके दोष के परिणामों में क्षीण होने दिया है।
  rationale: यह रूप ईश्वरीय न्याय और मानवीय दोष—दोनों को रखता है, पर उनके बीच किसी विशिष्ट दार्शनिक या संप्रदायगत कारण-तंत्र को आरोपित नहीं करता। शाब्दिक ‘गलाने’ का बिंब पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रार्थनात्मक शैली अपनाई गई है। परमेश्वर के लिए एकवचन निकटतासूचक ‘तू/तेरे/तुझे’ रखा गया है, जो मूल इब्रानी के एकवचन संबोधन और हिन्दी बाइबलीय काव्य-परंपरा के अनुकूल है। पंक्ति-विन्यास पद की काव्यात्मक समान्तरता को उभारता है।
