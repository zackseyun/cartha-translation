  text: הַ/עַל אֵ֥לֶּה תִתְאַפַּ֖ק יְהוָ֑ה תֶּחֱשֶׁ֥ה וּ/תְעַנֵּ֖/נוּ עַד מְאֹֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/011.yaml
  text: Will you restrain yourself over these things[b][a], O Yahweh? Will you keep silent and afflict us so very severely?
translation:
  language: hi
  text: हे याहवे, क्या तू इन बातों पर अपने आपको रोके रखेगा[a]? क्या तू चुप रहेगा और हमें अत्यन्त पीड़ित करेगा[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तू इन बातों के कारण अपने आपको रोके रखेगा?”
    reason: lexical_alternative
  - marker: b
    text: या, “और हमें बहुत दीन बनाएगा?” हिब्रू क्रिया का अर्थ पीड़ित करना या दीन करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/עַל
  choice: क्या इन बातों के कारण
  rationale: प्रश्नवाचक הַ और संबंधसूचक עַל मिलकर उस आधार या अवसर की ओर संकेत करते हैं जिस पर याहवे से प्रतिक्रिया की विनती की जा रही है। ‘इन बातों के कारण’ आधुनिक हिन्दी में स्वाभाविक है और संदर्भित विनाश को स्पष्ट करता है।
- source_word: אֵלֶּה
  choice: इन बातों
  rationale: बहुवचन संकेतवाचक शब्द पिछले पदों में वर्णित उजाड़ और विपत्ति की ओर लौटता है; ‘इन बातों’ से यह संबंध सहज रूप से व्यक्त होता है।
- source_word: תִתְאַפַּק
  choice: अपने आपको रोके रखेगा
  rationale: אפק के हित्पएल रूप में स्वयं को रोकने या संयमित रखने का भाव है। यह अनुवाद आत्मवाचक अर्थ और याहवे के हस्तक्षेप न करने की शिकायत—दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; उसे किसी उपाधि से बदलने के बजाय हिन्दी लिपि में ‘याहवे’ लिखा गया है।
- source_word: תֶּחֱשֶׁה
  choice: चुप रहेगा
  rationale: क्रिया का अर्थ मौन रहना है। भविष्यकालीन आलंकारिक प्रश्न के भीतर ‘चुप रहेगा’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: וּ/תְעַנֵּ/נוּ
  choice: और हमें ... पीड़ित करेगा
  rationale: यहाँ ענה के पिएल रूप का प्रसंगानुकूल अर्थ पीड़ित या दीन करना है। विलाप और मौन के समानांतर ‘पीड़ित करेगा’ मुख्य अर्थ को स्पष्ट रखता है।
- source_word: עַד מְאֹד
  choice: अत्यन्त
  rationale: यह पदबंध पीड़ा की मात्रा को बहुत अधिक बताता है; ‘अत्यन्त’ संक्षिप्त, गरिमापूर्ण और स्वाभाविक तीव्रतासूचक शब्द है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे उपस्थित है। ‘याहवे’ उसे उपाधि में बदले बिना लिप्यंतरित करता है।
- issue: וּתְעַנֵּנוּ का अर्थ
  choice: हमें पीड़ित करेगा
  alternative: हमें अत्यन्त दीन करेगा
  rationale: इस विलाप में उजाड़ और दुःख की शिकायत के कारण ‘पीड़ित करेगा’ प्रमुख प्रसंगानुकूल अर्थ है, पर ‘दीन करना’ भी हिब्रू क्रिया की वास्तविक अर्थ-संभावना है और उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, विनती और विलाप के अनुरूप गरिमापूर्ण तथा सीधी रखी गई है। एकवचन ‘तू’ बाइबलीय प्रार्थना की निकटता और मूल हिब्रू के एकवचन संबोधन को व्यक्त करता है। दोनों प्रश्नों की आलंकारिक तीव्रता और क्रिया की अर्थगत अनिश्चितता सुरक्षित रखी गई है।
