language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מֵ/עוֹלָ֥ם לֹא שָׁמְע֖וּ לֹ֣א הֶאֱזִ֑ינוּ עַ֣יִן לֹֽא רָאָ֗תָה אֱלֹהִים֙ זוּלָ֣תְ/ךָ֔ יַעֲשֶׂ֖ה לִ/מְחַכֵּה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/003.yaml
  text: From of old no one has heard, no ear has listened, no eye has seen a God besides you, who acts for the one who waits for him.
translation:
  language: hi
  text: प्राचीनकाल से न किसी ने सुना, न किसी ने कान लगाया; न किसी आँख ने, हे परमेश्वर, तेरे सिवा, ऐसे परमेश्वर को देखा है जो तेरी प्रतीक्षा करनेवाले के लिए कार्य करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֵעוֹלָם
  choice: प्राचीनकाल से
  rationale: यह कालवाचक पद अतीत के सुदूर आरम्भ से अब तक का भाव देता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: לֹא הֶאֱזִינוּ
  choice: न किसी कान ने ध्यान दिया
  rationale: हिब्रू क्रिया केवल सुनने नहीं, ध्यान लगाकर सुनने का भाव रखती है; समानांतर पंक्ति में ‘कान’ जोड़ने से काव्यात्मक आशय स्पष्ट होता है।
- source_word: אֱלֹהִים זוּלָתְךָ
  choice: तेरे सिवा ऐसे परमेश्वर
  rationale: זוּלָתְךָ का अर्थ ‘तेरे अलावा/तेरे सिवा’ है। ‘ऐसे’ अगले संबंधवाचक उपवाक्य से परमेश्वर के अद्वितीय कार्य को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: לִמְחַכֵּה לוֹ
  choice: अपनी बाट जोहनेवाले के लिए
  rationale: חכה आशापूर्वक प्रतीक्षा करने को व्यक्त करता है; ‘बाट जोहना’ आधुनिक पाठकों के लिए समझने योग्य, गरिमापूर्ण बाइबिलीय अभिव्यक्ति है।
theological_decisions:
- issue: क्या पद केवल किसी दूसरे देवता के न देखे जाने की बात कहता है या परमेश्वर की अद्वितीयता पर बल देता है?
  choice: तेरे सिवा ऐसे परमेश्वर को देखा
  alternative: तेरे सिवा किसी परमेश्वर को देखा
  rationale: ‘ऐसे’ हिब्रू में अलग शब्द के रूप में नहीं है, पर संबंधवाचक वाक्य ‘जो...कार्य करता है’ को उसके पूर्वपद से स्पष्टतः जोड़ता है और परमेश्वर की अद्वितीयता का आशय रखता है, बिना अतिरिक्त सांप्रदायिक व्याख्या जोड़े।
- issue: יַעֲשֶׂה का कर्ता और सम्बन्ध
  choice: जो अपनी बाट जोहनेवाले के लिए कार्य करता है
  alternative: वह अपनी बाट जोहनेवाले के लिए करेगा
  rationale: क्रिया का सामान्य/विशेषतामूलक भाव सन्दर्भ में उपयुक्त है। संबंधवाचक रचना इसे ‘परमेश्वर’ से जोड़ती है, जैसा वाक्यविन्यास संकेत करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। हिब्रू की तीन समानांतर नकारात्मक पंक्तियों और सुनने–ध्यान देने–देखने की प्रगति को यथासम्भव बनाए रखा गया है।
