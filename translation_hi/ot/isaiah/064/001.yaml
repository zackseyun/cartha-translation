  text: כִּ/קְדֹ֧חַ אֵ֣שׁ הֲמָסִ֗ים מַ֚יִם תִּבְעֶה אֵ֔שׁ לְ/הוֹדִ֥יעַ שִׁמְ/ךָ֖ לְ/צָרֶ֑י/ךָ מִ/פָּנֶ֖י/ךָ גּוֹיִ֥ם יִרְגָּֽזוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/001.yaml
  text: As when fire kindles brushwood[a], and fire causes water to boil, to make your name known to your adversaries[c][b], so that nations tremble at your presence—
translation:
  language: hi
  text: 'जैसे आग झाड़-झंखाड़[a] को सुलगा देती है,

    और आग पानी को उबाल देती है[b],

    वैसे ही तेरे विरोधियों को तेरा नाम ज्ञात कराने के लिए,

    ताकि तेरी उपस्थिति से राष्ट्र काँप उठें—[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पराली’ अथवा ‘सूखी टहनियाँ’। इब्रानी शब्द दुर्लभ है और ऐसी सामग्री का संकेत देता है जो शीघ्र आग पकड़ लेती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पानी में बुलबुले उठा देती है’।
    reason: lexical_alternative
  - marker: c
    text: कुछ पद-विभाजन परंपराओं में यह पंक्ति यशायाह 63:19 के अंतिम भाग के रूप में गिनी जाती है।
    reason: textual_variant
lexical_decisions:
- source_word: כִּקְדֹחַ
  choice: जैसे ... सुलगा देती है
  rationale: כִּ तुलना प्रस्तुत करता है और קדח का क्रियारूप आग लगाने या धधकाने का भाव देता है। यह चयन उपमा और क्रिया की शक्ति दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֵשׁ
  choice: आग
  rationale: मूल शब्द का सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: הֲמָסִים
  choice: झाड़-झंखाड़
  rationale: यह दुर्लभ और अर्थ की दृष्टि से कठिन शब्द है, पर प्रसंग में जल्दी आग पकड़ने वाली वनस्पति या ईंधन-सामग्री का बोध कराता है। ‘झाड़-झंखाड़’ इस चित्र को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מַיִם תִּבְעֶה אֵשׁ
  choice: आग पानी को उबाल देती है
  rationale: इस प्रसंग में תִּבְעֶה पानी में उबाल या बुलबुले उत्पन्न करने का भाव देता है। वाक्य-विन्यास में दूसरी बार आया ‘आग’ कर्ता है, जिसे हिन्दी में स्पष्ट रखा गया है।
- source_word: לְהוֹדִיעַ
  choice: ज्ञात कराने के लिए
  rationale: ידע के हिफ़ील रूप का कारणवाचक भाव ‘ज्ञात कराना’ है। ‘के लिए’ पूर्ववर्ती विनती से जुड़े उद्देश्य को सुरक्षित रखता है।
- source_word: שִׁמְךָ
  choice: अपना नाम
  rationale: ‘नाम’ की बाइबिलीय अभिव्यक्ति को बनाए रखा गया है; इसे केवल ‘प्रतिष्ठा’ या ‘पहचान’ कहकर सीमित नहीं किया गया।
- source_word: לְצָרֶיךָ
  choice: अपने विरोधियों को
  rationale: צַר विरोध करने वालों या शत्रुओं को सूचित कर सकता है। ‘विरोधी’ अनावश्यक रूप से केवल सैनिक अर्थ ग्रहण किए बिना संबंधगत विरोध को व्यक्त करता है।
- source_word: מִפָּנֶיךָ
  choice: तेरी उपस्थिति से
  rationale: शाब्दिक भाव ‘तेरे मुख/सामने से’ है; ‘तेरी उपस्थिति से’ ईश्वरीय प्रकटता के भाव को सहज हिन्दी में बनाए रखता है।
- source_word: גּוֹיִם
  choice: राष्ट्र
  rationale: इस प्रसंग में व्यापक रूप से अन्य राष्ट्रों का संकेत है; ‘राष्ट्र’ सबसे उपयुक्त और तटस्थ चयन है।
- source_word: יִרְגָּזוּ
  choice: काँप उठें
  rationale: क्रिया काँपने, थरथराने या व्याकुल होने का अर्थ देती है। ‘काँप उठें’ ईश्वरीय उपस्थिति के प्रभाव को स्वाभाविक और सजीव हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पद-विभाजन और पिछली विनती से संबंध
  choice: पद को तुलना से आरम्भ होने वाली पिछली विनती की काव्यात्मक निरंतरता के रूप में रखा गया है और अंत में डैश द्वारा उसके अपूर्ण/जारी वाक्यगत संबंध का संकेत दिया गया है।
  alternative: पिछले पद के ‘काश, तू आकाश को फाड़कर उतर आता’ जैसे शब्दों को इस पद में स्पष्ट रूप से दोहराना।
  rationale: इब्रानी पाठ इस इकाई में मुख्य विनती को नहीं दोहराता, बल्कि सीधे तुलनात्मक अग्नि-चित्र से आरम्भ होता है। इसलिए पिछले पद की निर्भरता को रहने दिया गया है, पर उसके शब्द मुख्य पाठ में नहीं जोड़े गए।
- issue: ईश्वरीय प्रकटता का अग्नि-चित्र
  choice: आग, उबलते पानी, विरोधियों और काँपते राष्ट्रों की बहुअर्थी काव्यात्मक छवि को यथावत रखा गया है।
  alternative: चित्र को केवल दंड या केवल शुद्धीकरण के रूप में स्पष्ट करना।
  rationale: मूल पाठ परमेश्वर के सामर्थ्यपूर्ण आत्म-प्रकटीकरण और उसके प्रभाव को चित्रित करता है, पर उसे किसी एक धर्मवैज्ञानिक श्रेणी तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तेरी’ का प्रयोग प्रार्थनात्मक काव्य की निकटता और एकवचन संबोधन को बनाए रखता है। पंक्ति-विन्यास इब्रानी काव्य के समानांतर अग्नि-चित्र और उद्देश्य-वाक्य को स्पष्ट करता है।
