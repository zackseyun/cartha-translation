source:
  edition: WLC
  text: פָּגַ֤עְתָּ אֶת שָׂשׂ֙ וְ/עֹ֣שֵׂה צֶ֔דֶק בִּ/דְרָכֶ֖י/ךָ יִזְכְּר֑וּ/ךָ הֵן אַתָּ֤ה קָצַ֨פְתָּ֙ וַֽ/נֶּחֱטָ֔א בָּ/הֶ֥ם עוֹלָ֖ם וְ/נִוָּשֵֽׁעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/004.yaml
  text: You meet the one who gladly does righteousness[a], those who remember you in your ways. Behold, you were angry, and we sinned; in them we have been a long time[b], and shall we be saved?
translation:
  language: hi
  text: तू उस व्यक्ति से मिलता है जो आनन्द से धार्मिकता करता है[a], उनसे जो तेरे मार्गों में तुझे स्मरण करते हैं। देख, तू क्रोधित हुआ और हमने पाप किया; हम उनमें बहुत समय से रहे हैं[b]—और क्या हमारा उद्धार होगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो आनन्दित होता और धार्मिकता करता है।” इब्रानी कृदन्तों को साथ लेकर उस व्यक्ति का वर्णन किया जा सकता है जिससे परमेश्वर मिलता है।
    reason: lexical_alternative
  - marker: b
    text: '“हम उनमें बहुत समय से रहे हैं—और क्या हमारा उद्धार होगा?” वाला खंड पाठ और वाक्यरचना की दृष्टि से बहुत कठिन है। अन्य सम्भव अनुवाद हैं: “उनमें स्थायित्व है, और हमारा उद्धार होगा,” अथवा “हम उनमें बहुत समय से रहे हैं—क्या हमारा उद्धार होगा?”'
    reason: alternative_reading
lexical_decisions:
- source_word: פָּגַעְתָּ
  choice: तू उसका स्वागत करता है
  rationale: क्रिया का मूल अर्थ ‘मिलना/सामना करना’ है; इस संदर्भ में यह परमेश्वर द्वारा धर्मी जन से अनुकूल रूप से मिलने का भाव देती है। ‘स्वागत करता है’ उस संबंधपरक अनुकूलता को स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि ‘मिलता है’ अधिक शाब्दिक विकल्प है।
- source_word: שָׂשׂ וְעֹשֵׂה צֶדֶק
  choice: जो आनन्द से धार्मिकता के काम करता है
  rationale: 'दोनों कृदन्तों को एक ही व्यक्ति का संयुक्त वर्णन माना गया है: वह आनन्दित होता और धार्मिकता करता है। हिन्दी में ‘आनन्द से’ इस संबंध को सहज बनाता है; वैकल्पिक विश्लेषण पादटिप्पणी में रखा गया है।'
- source_word: בִּדְרָכֶיךָ יִזְכְּרוּךָ
  choice: जो तेरे मार्गों पर चलते हुए तुझे स्मरण रखते हैं
  rationale: मूल में ‘तेरे मार्गों में तुझे स्मरण करते हैं’ है। ‘चलते हुए’ हिन्दी में मार्ग-रूपक को स्पष्ट करता है, बिना मार्गों की नैतिक-वाचा संबंधी धारणा बदले।
- source_word: הֵן
  choice: देख
  rationale: यह ध्यान आकर्षित करने वाला संवाद-कण है। आधुनिक हिन्दी में ‘देख’ उसका सीधा और गंभीर प्रभाव बनाए रखता है।
- source_word: קָצַפְתָּ וַנֶּחֱטָא
  choice: तू क्रोधित हुआ और हमने पाप किया
  rationale: दोनों क्रियाओं को सरल क्रम में रखा गया है; इनके बीच अधिक विशिष्ट कारणात्मक या कालगत संबंध आरोपित नहीं किया गया।
- source_word: בָּהֶם עוֹלָם
  choice: हम उन्हीं में बहुत समय से बने रहे हैं
  rationale: यह खंड क्रियारहित और अत्यन्त कठिन है। ‘उन्हीं में’ सर्वनाम की संदिग्ध पूर्वसंज्ञा को बनाए रखता है और עוֹלָם को यहाँ दीर्घ अवधि के रूप में प्रस्तुत करता है।
- source_word: וְנִוָּשֵׁעַ
  choice: तो क्या हमारा उद्धार होगा?
  rationale: निफ़अल रूप का अर्थ ‘बचाया जाना/उद्धार होना’ है। विलाप के संदर्भ में इसे आलंकारिक प्रश्न माना गया है, पर मूल में प्रश्नचिह्न स्पष्ट नहीं है; कथनात्मक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: अन्तिम वाक्यांश וְנִוָּשֵׁעַ का प्रश्नात्मक या कथनात्मक अर्थ
  choice: 'आलंकारिक प्रश्न: ‘तो क्या हमारा उद्धार होगा?’'
  alternative: 'कथन: ‘और हमारा उद्धार होगा’; अथवा ‘उन्हीं में स्थायित्व है, और हमारा उद्धार होगा।’'
  rationale: इब्रानी वाक्यरचना असामान्य और विवादित है। प्रश्नात्मक अनुवाद पश्चात्तापपूर्ण विलाप का तनाव बनाए रखता है और अनावश्यक निश्चित आश्वासन नहीं जोड़ता; पादटिप्पणी कथनात्मक सम्भावना को स्पष्ट रखती है।
- issue: בָּהֶם में ‘उन’ का संकेत
  choice: ‘उन्हीं में’ द्वारा संकेत को अनिर्णीत रखा गया
  alternative: इसे स्पष्ट रूप से ‘तेरे मार्गों में’ या ‘इन पापों में’ कहना
  rationale: मूल पाठ में सर्वनाम का संदर्भ स्पष्ट नहीं है। किसी एक धर्मवैचारिक अर्थ को मुख्य पाठ में निश्चित करना स्रोत की वास्तविक अस्पष्टता मिटा देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। परमेश्वर के लिए एकवचन निकट संबोधन ‘तू/तेरे’ रखा गया है। कठिन अन्तिम खंड की अस्पष्टता मुख्य पाठ और पादटिप्पणी दोनों में सुरक्षित है।
