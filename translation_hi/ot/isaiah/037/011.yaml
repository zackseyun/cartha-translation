source:
  edition: WLC
  text: הִנֵּ֣ה אַתָּ֣ה שָׁמַ֗עְתָּ אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֥י אַשּׁ֛וּר לְ/כָל הָ/אֲרָצ֖וֹת לְ/הַחֲרִימָ֑/ם וְ/אַתָּ֖ה תִּנָּצֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/011.yaml
  text: Look[a], you have heard what the kings of Assyria have done to all the lands[b], destroying them utterly—and will you be delivered?
translation:
  language: hi
  text: देखो, तुमने सुना है कि अश्शूर के राजाओं ने सभी देशों के साथ क्या किया है—उन्हें विनाश के लिए समर्पित कर दिया है—और क्या तुम बच जाओगे?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और क्या तुम्हें बचाया जाएगा?” यह ताने के रूप में पूछा गया आलंकारिक प्रश्न है।
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान खींचने और कथन पर बल देने वाला उद्गार है; ‘देखो’ आधुनिक हिन्दी में स्वाभाविक है और इसका संकेतात्मक बल बनाए रखता है।
- source_word: שָׁמַעְתָּ
  choice: तुमने सुना है
  rationale: द्वितीय पुरुष एकवचन पूर्ण क्रिया पहले से ज्ञात समाचार की ओर संकेत करती है; हिन्दी पूर्ण काल संदर्भ में स्वाभाविक है।
- source_word: אֲשֶׁר עָשׂוּ
  choice: क्या हाल किया
  rationale: शाब्दिक ‘क्या किया’ की अपेक्षा यह विजय और विनाश के परिणाम को स्वाभाविक हिन्दी में स्पष्ट करता है, जबकि अगला उपवाक्य उसका स्वरूप बताता है।
- source_word: מַלְכֵי אַשּׁוּר
  choice: अश्शूर के राजाओं
  rationale: सम्बन्धवाचक इब्रानी रचना का मानक और स्पष्ट हिन्दी रूप।
- source_word: לְכָל הָאֲרָצוֹת
  choice: सब देशों का
  rationale: बहुवचन אֲרָצוֹת यहाँ अश्शूर द्वारा जीते गए विभिन्न भू-राजनीतिक देशों को सूचित करता है, सारी पृथ्वी को नहीं।
- source_word: לְהַחֲרִימָם
  choice: उन्होंने उनका पूरी तरह विनाश कर दिया
  rationale: חרם का हिफ़ील रूप सम्पूर्ण विनाश के लिए अर्पित कर देने का भाव रखता है। मुख्य पाठ में यह हिन्दी स्वाभाविक रहते हुए उसकी पूर्णता को व्यक्त करती है।
- source_word: וְאַתָּה תִּנָּצֵל
  choice: फिर क्या तुम बच जाओगे?
  rationale: स्वतंत्र सर्वनाम ‘तुम’ तीखा विरोध उभारता है। निफ़अल रूप और प्रसंग मिलकर इसे उद्धार की आशा का उपहास करने वाला आलंकारिक प्रश्न बनाते हैं।
theological_decisions:
- issue: सैन्य न्याय के प्रसंग में חרם का अर्थ
  choice: पूरी तरह विनाश कर दिया
  alternative: विनाश के लिए अर्पित कर दिया / सत्यानाश कर दिया
  rationale: मूल शब्द साधारण पराजय से अधिक, सम्पूर्ण विनाश के लिए ठहरा देने का भाव रखता है। चुना हुआ रूप उस तीव्रता को सहज आधुनिक हिन्दी में व्यक्त करता है, जबकि तकनीकी धार्मिक शब्दावली नहीं थोपता।
- issue: अंतिम תִּנָּצֵל का वाक्य-बल
  choice: 'आलंकारिक प्रश्न: ‘फिर क्या तुम बच जाओगे?’'
  alternative: 'कथन: ‘और तुम बच जाओगे’ / प्रश्न: ‘क्या तुम्हें छुड़ाया जाएगा?’'
  rationale: सन्हेरीब का संदेश हिजकिय्याह की बचाव की आशा पर ताना है। इब्रानी में प्रश्नचिह्न न होने पर भी प्रसंग आलंकारिक प्रश्न का प्रबल समर्थन करता है; ‘बच जाओगे’ निष्क्रिय/मध्य अर्थ की स्वाभाविक हिन्दी अभिव्यक्ति है।
translation_notes:
  register: 'भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘अश्शूर’ पारंपरिक बाइबलीय नामरूप है। वाक्य-विन्यास ताने की क्रमिक तीव्रता को बनाए रखता है: सुनी हुई विजयों की याद, सम्पूर्ण विनाश, और अंत में चुनौतीपूर्ण प्रश्न।'
