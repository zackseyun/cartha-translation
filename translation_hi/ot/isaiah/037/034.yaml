review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the repeated-route emphasis and the future return. However, ‘प्रवेश नहीं करेगा’ renders the Hebrew verb בוא (‘come’) with the more specific ‘enter,’ despite the source’s deliberate repetition of the same verb used earlier (‘came’ / ‘will not come’).
  naturalness: The Hindi is clear, modern, and suitably formal. ‘जिस मार्ग से... उसी से’ is idiomatic and retains the emphatic correspondence in the Hebrew. ‘नगर में नहीं आएगा’ is natural in context and avoids adding the notion of entry.
  terminology: ‘याहवे’ appropriately represents יהוה, and ‘घोषणा’ suitably renders the prophetic formula נְאֻם. Recasting the final formula as ‘याहवे की यह घोषणा है’ is more idiomatic Hindi while retaining its formal force.
  issues:
  - severity: medium
    issue: ‘प्रवेश नहीं करेगा’ is more specific than the Hebrew.
    rationale: The source says simply that he ‘will not come’ (לֹא יָבוֹא), echoing ‘he came’ earlier in the verse. ‘प्रवेश करना’ adds an explicit entry sense and loses that lexical linkage.
  revised_text: जिस मार्ग से वह आया, उसी से वह लौट जाएगा; वह इस नगर में नहीं आएगा—याहवे की यह घोषणा है।
