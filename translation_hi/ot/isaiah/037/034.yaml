revisions:
- from: जिस मार्ग से वह आया है, उसी से वह लौट जाएगा; वह इस नगर में प्रवेश नहीं करेगा—यह याहवे की घोषणा है।
  to: जिस मार्ग से वह आया, उसी से वह लौट जाएगा; वह इस नगर में नहीं आएगा—याहवे की यह घोषणा है।
  rationale: Replaced ‘प्रवेश नहीं करेगा’ with ‘नगर में नहीं आएगा’ to preserve the Hebrew’s unmodified verb ‘come’ and its repetition. The remainder is retained, with a minor idiomatic adjustment to the concluding prophetic formula.
