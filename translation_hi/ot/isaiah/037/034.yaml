  yaml_path: translation/ot/isaiah/037/034.yaml
  text: By the way that he came, by it he will return, and he will not come into this city, declares Yahweh.
translation:
  language: hi
  text: जिस मार्ग से वह आया, उसी से वह लौट जाएगा; वह इस नगर में नहीं आएगा—याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּא בָּהּ
  choice: जिस मार्ग से वह आया है, उसी से
  rationale: दֶּרֶךְ के लिए ‘मार्ग’ स्वाभाविक और गरिमापूर्ण है। ‘जिस...उसी’ हिब्रू में स्त्रीलिंग प्रत्यय בָּהּ द्वारा उसी मार्ग की पुनरावृत्ति और बल को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: יָשׁוּב
  choice: वह लौट जाएगा
  rationale: שׁוּב यहाँ उसी मार्ग से वापस जाने को व्यक्त करता है; ‘लौट जाएगा’ आधुनिक हिन्दी में स्वाभाविक भविष्यकाल है।
- source_word: וְאֶל הָעִיר הַזֹּאת לֹא יָבוֹא
  choice: वह इस नगर में प्रवेश नहीं करेगा
  rationale: בוא के साथ नगर गंतव्य है। हिन्दी में ‘नगर में प्रवेश करना’ आशय को सहजता से व्यक्त करता है, यद्यपि मूल क्रिया का सामान्य अर्थ ‘आना’ है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: נְאֻם एक अधिकारपूर्ण नबूवत-सूत्र है; ‘घोषणा’ उसका औपचारिक बल बनाए रखती है। יְהוָה को व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे उपस्थित है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में परिवर्तित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। ‘जिस...उसी’ संरचना मूल की पुनरुक्ति को स्वाभाविक हिन्दी में बनाए रखती है।
