  yaml_path: translation/ot/isaiah/037/025.yaml
  text: I dug and drank water[b][a], and with the sole of my feet I dried up all the streams of Egypt.
translation:
  language: hi
  text: मैंने स्वयं खोदकर पानी पिया, और अपने पैरों के तलवों से मिस्र[b] की सारी नहरें[a] सुखा दीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मिस्र की सारी जलधाराएँ’ अथवा ‘नील की सारी शाखाएँ।’ यहाँ हिब्रू शब्द मिस्र की नहरों और नील से जुड़े जलमार्गों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'हिब्रू: ‘माज़ोर’; यहाँ संभवतः यह मिस्र का काव्यात्मक या वैकल्पिक नाम है, न कि ‘घेराबंदी’ या ‘किला’।'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  choice: मैंने स्वयं
  rationale: स्वतंत्र सर्वनाम אֲנִי प्रसंग में घमंड भरे आत्मबलाघात को उभारता है; इसलिए केवल क्रिया में निहित ‘मैं’ की अपेक्षा ‘मैंने स्वयं’ रखा गया है।
- source_word: קַרְתִּי
  choice: खोदकर
  rationale: यहाँ क्रिया पानी प्राप्त करने के लिए खोदने का भाव देती है। हिन्दी में ‘खोदकर पानी पिया’ संक्षिप्त और स्वाभाविक है तथा मूल में स्पष्ट रूप से न दिए गए ‘कुएँ’ को मुख्य पाठ में नहीं जोड़ता।
- source_word: וְשָׁתִיתִי מָיִם
  choice: पानी पिया
  rationale: מָיִם रूप से बहुवचन होते हुए भी यहाँ सामान्य द्रव्यवाचक अर्थ में है; आधुनिक हिन्दी में ‘पानी’ स्वाभाविक है।
- source_word: וְאַחְרִב
  choice: सुखा दीं
  rationale: हिफ़ील रूप का कर्म जलमार्ग हैं, इसलिए ठोस अर्थ ‘सुखा देना’ उपयुक्त है, न कि व्यापक ‘उजाड़ देना’।
- source_word: בְּכַף פְּעָמַי
  choice: अपने पैरों के तलवों से
  rationale: כַּף जब पाँव के साथ आता है तो तलवे को दर्शाता है। यह अनुवाद मूल के अतिशयोक्तिपूर्ण चित्र को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כֹּל
  choice: सारी
  rationale: जलमार्गों के सामूहिक बहुवचन के साथ ‘सारी’ स्वाभाविक हिन्दी समतुल्य है।
- source_word: יְאֹרֵי
  choice: नहरें
  rationale: मिस्र के प्रसंग में יְאֹרֵי नील से जुड़ी नहरों या जलधाराओं को सूचित कर सकता है। ‘नहरें’ भौगोलिक चित्र को स्पष्ट रखता है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: מָצוֹר
  choice: मिस्र
  rationale: यहाँ מָצוֹר संभवतः मिस्र का काव्यात्मक अथवा वैकल्पिक नाम है; ‘मिस्र’ पाठक को आशय स्पष्ट करता है और हिब्रू नाम की जानकारी पादटिप्पणी में सुरक्षित रखी गई है।
