review_pass:
  verdict: revise
  source_fidelity: The draft broadly follows the Hebrew rhetorical questions and correctly retains the final target. However, “घमंड से” makes an implied contextual sense explicit where the Hebrew more literally says that the eyes were lifted “on high”; and “तिरस्कार किया” is weaker and less speech-specific than גִדַּפְתָּ, ‘reviled/blasphemed.’
  naturalness: The address with “तू” is appropriate to the prophetic rebuke. The revised wording is idiomatic modern Hindi while maintaining the compact, parallel Hebrew questions.
  terminology: “इस्राएल के पवित्र परमेश्वर” clearly conveys the established divine title ‘the Holy One of Israel.’ “निंदा की” preserves the verbal abuse/reviling force without prematurely restricting it to a technical doctrinal term.
  issues:
  - severity: medium
    issue: “घमंड से” is interpretive.
    rationale: The Hebrew phrase וַתִּשָּׂא מָרוֹם עֵינֶיךָ states that the eyes were lifted high/on high. Arrogance is strongly suggested by context, but the adverb ‘घमंड से’ adds an explicit interpretation not present in the line itself.
  - severity: medium
    issue: “तिरस्कार किया” understates and broadens גִדַּפְתָּ.
    rationale: The verb denotes reviling, abusive denunciation, and in this divine context blaspheming. “निंदा की” more directly represents this speech act and preserves its force.
  - severity: low
    issue: “पवित्र जन” is potentially ambiguous as an ordinary holy person.
    rationale: The Hebrew is a recognized divine title. Adding “परमेश्वर” in Hindi makes the referent and title’s theological force clear without changing the referent.
  revised_text: तूने किसका अपमान किया और किसकी निंदा की? किसके विरुद्ध तूने अपनी आवाज़ ऊँची की और अपनी आँखें ऊँची उठाईं? इस्राएल के पवित्र परमेश्वर के विरुद्ध।
  revised_footnotes: []
