id: ISA.37.23
reference: Isaiah 37:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֶת מִ֤י חֵרַ֨פְתָּ֙ וְ/גִדַּ֔פְתָּ וְ/עַל מִ֖י הֲרִימ֣וֹתָה קּ֑וֹל וַ/תִּשָּׂ֥א מָר֛וֹם עֵינֶ֖י/ךָ אֶל קְד֥וֹשׁ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/023.yaml
  text: Whom have you mocked and blasphemed? Against whom have you raised your voice and lifted your eyes on high? Against the Holy One of Israel.
translation:
  language: hi
  text: तूने किसका अपमान किया और किसकी निंदा की? किसके विरुद्ध तूने अपनी आवाज़ ऊँची की और अपनी आँखें ऊँची उठाईं? इस्राएल के पवित्र परमेश्वर के विरुद्ध।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵרַפְתָּ
  choice: अपमान किया
  rationale: मूल क्रिया में निंदा, धिक्कार और अपमान का भाव है; आधुनिक हिन्दी में ‘अपमान किया’ स्वाभाविक और स्पष्ट है।
- source_word: גִדַּפְתָּ
  choice: तिरस्कार किया
  rationale: यह शब्द निंदात्मक या ईशनिंदापूर्ण बोलने को व्यक्त करता है। ‘तिरस्कार किया’ पहली क्रिया से भेद रखते हुए विरोधपूर्ण अवमानना प्रकट करता है।
- source_word: הֲרִימוֹתָה קּוֹל
  choice: अपनी आवाज़ ऊँची की
  rationale: हिब्रू मुहावरे का निकट और स्वाभाविक हिन्दी रूप, जो उद्दंड चुनौती का संकेत देता है।
- source_word: וַתִּשָּׂא מָרוֹם עֵינֶיךָ
  choice: घमंड से अपनी आँखें उठाईं
  rationale: शाब्दिक रूप ‘अपनी आँखें ऊँचाई की ओर उठाईं’ है; प्रसंग में इसका आशय अहंकारी दृष्टि से है, जिसे हिन्दी में संक्षेप और स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: इस्राएल के पवित्र जन
  rationale: यशायाह में प्रयुक्त विशिष्ट उपाधि का पारंपरिक, अर्थ-सटीक और गरिमापूर्ण हिन्दी रूप।
theological_decisions:
- issue: गִדֵּף के ईशनिंदा-संबंधी अर्थ की अभिव्यक्ति
  choice: तिरस्कार किया
  alternative: ईशनिंदा की
  rationale: ‘ईशनिंदा’ संदर्भतः संभव है, पर मूल शब्द का अर्थ केवल तकनीकी धार्मिक पद तक सीमित नहीं है। ‘तिरस्कार किया’ व्यापक अर्थ बनाए रखता है और अगले वाक्य में लक्ष्य—इस्राएल का पवित्र जन—स्पष्ट हो जाता है।
- issue: आँखें ऊँची उठाने में अहंकार का भाव
  choice: घमंड से अपनी आँखें उठाईं
  alternative: अपनी आँखें ऊँचाई की ओर उठाईं
  rationale: मूल की काव्यात्मक अभिव्यक्ति प्रसंग में अहंकार और उद्दंडता दर्शाती है; चुना हुआ रूप इस निहित भाव को स्पष्ट करता है, बिना किसी संप्रदायगत व्याख्या के।
translation_notes:
  register: आधुनिक मानक हिन्दी; परमेश्वर द्वारा उद्दंड शत्रु को संबोधित करने के कारण एकवचन अनौपचारिक ‘तू’ रखा गया है। प्रश्नों की तीव्रता और अंतिम पहचान की निर्णायक शक्ति को विस्मयादिबोधक चिह्न से उभारा गया है।
