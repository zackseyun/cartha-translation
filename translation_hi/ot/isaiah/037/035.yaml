source:
  edition: WLC
  text: וְ/גַנּוֹתִ֛י עַל הָ/עִ֥יר הַ/זֹּ֖את לְ/הֽוֹשִׁיעָ֑/הּ לְמַֽעֲנִ֔/י וּ/לְמַ֖עַן דָּוִ֥ד עַבְדִּֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/035.yaml
  text: For I will defend this city to save it[b][a], for my own sake and for the sake of David my servant.
translation:
  language: hi
  text: और मैं इस नगर की रक्षा करूँगा, ताकि इसे बचाऊँ—अपनी ही खातिर और अपने सेवक दाऊद की खातिर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַנּוֹתִי
  choice: और मैं ... रक्षा करूँगा
  rationale: גנן का अर्थ ढाँककर रक्षा करना या बचाव करना है। सैन्य संकट के संदर्भ में ‘रक्षा करूँगा’ स्वाभाविक और सटीक है; आरंभिक וְ को ‘और’ से व्यक्त किया गया है।
- source_word: עַל הָעִיר הַזֹּאת
  choice: इस नगर की
  rationale: גנן के साथ עַל नगर की ओर निर्देशित संरक्षण को दर्शाता है। हिन्दी में ‘इस नगर की रक्षा करना’ इसका स्वाभाविक मुहावरा है।
- source_word: לְהוֹשִׁיעָהּ
  choice: ताकि इसे बचाऊँ
  rationale: ישע यहाँ संकट से बचाने या छुड़ाने का अर्थ रखता है। ‘इसे’ स्त्रीलिंग एकवचन प्रत्यय के पूर्वपद ‘नगर’ को संदर्भित करता है; उद्देश्यसूचक לְ को ‘ताकि’ से स्पष्ट किया गया है।
- source_word: לְמַעֲנִי
  choice: अपने कारण
  rationale: यह परमेश्वर में निहित उद्देश्य या हेतु को व्यक्त करता है। ‘अपने कारण’ मूल की संक्षिप्तता बनाए रखता है और नाम, सम्मान आदि की व्याख्या पाठ में नहीं जोड़ता।
- source_word: וּלְמַעַן דָּוִד עַבְדִּי
  choice: और अपने सेवक दाऊद के कारण
  rationale: दूसरे समानांतर हेतु को बनाए रखता है। राजकीय-वाचागत संदर्भ में עבד के लिए ‘सेवक’ उपयुक्त है।
theological_decisions:
- issue: उद्धार के लिए परमेश्वर के दो बताए हुए हेतु
  choice: अपने कारण और अपने सेवक दाऊद के कारण
  alternative: अपने नाम के कारण और दाऊद से की गई वाचा के कारण
  rationale: मूल पाठ परमेश्वर के अपने कारण और दाऊद के कारण—दोनों को स्पष्ट रूप से रखता है, पर ‘नाम’ या ‘वाचा’ शब्द नहीं जोड़ता। अनुवाद इस संबंध और उसके धर्मवैज्ञानिक तनाव को बिना विस्तार से समझाए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘नगर’ यशायाह के राजकीय और ऐतिहासिक संदर्भ के अनुकूल है। मूल की रक्षात्मक सैन्य छवि तथा उद्देश्य-संबंध बनाए रखे गए हैं।
