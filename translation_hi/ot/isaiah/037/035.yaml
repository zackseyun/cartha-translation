revisions:
- from: और मैं इस नगर की रक्षा करूँगा, ताकि इसे बचाऊँ—अपने कारण और अपने सेवक दाऊद के कारण।
  to: और मैं इस नगर की रक्षा करूँगा, ताकि इसे बचाऊँ—अपनी ही खातिर और अपने सेवक दाऊद की खातिर।
  rationale: The revision changes only the rendering of the two לְמַעַן phrases. ‘अपनी ही खातिर’ preserves the reflexive emphasis in לְמַעֲנִי, and the parallel ‘अपने सेवक दाऊद की खातिर’ preserves the second motive naturally and without interpretive expansion.
