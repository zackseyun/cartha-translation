review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the protective verb, the city as the object of rescue, and the two stated motives. However, ‘अपने कारण’ is not an idiomatic or sufficiently precise equivalent of לְמַעֲנִי; it can sound causal (‘because of oneself’) rather than purposive (‘for one’s own sake’).
  naturalness: The sentence is otherwise clear and appropriately concise. Replacing ‘अपने कारण’ and the parallel ‘दाऊद के कारण’ with ‘... की खातिर’ gives natural modern Hindi while retaining the elevated biblical register.
  terminology: ‘नगर,’ ‘रक्षा करूँगा,’ ‘बचाऊँ,’ and ‘अपने सेवक दाऊद’ are appropriate. ‘खातिर’ faithfully conveys the purposive motive without adding ‘name,’ ‘honor,’ or ‘covenant.’
  issues:
  - severity: medium
    issue: ‘अपने कारण’ / ‘अपने सेवक दाऊद के कारण’
    rationale: These expressions are potentially causal in Hindi and do not clearly convey the Hebrew לְמַעַן, ‘for the sake of.’ The parallel motive clauses should be rendered purposively.
  revised_text: और मैं इस नगर की रक्षा करूँगा, ताकि इसे बचाऊँ—अपनी ही खातिर और अपने सेवक दाऊद की खातिर।
  revised_footnotes: []
