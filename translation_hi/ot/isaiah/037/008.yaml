  yaml_path: translation/ot/isaiah/037/008.yaml
  text: Then the Rabshakeh returned and found the king of Assyria fighting against Libnah[b][a], for he had heard that he had departed from Lachish.
translation:
  language: hi
  text: तब रबशाके[a] लौट गया और उसने अश्शूर के राजा को लिब्ना के विरुद्ध युद्ध करते पाया[b], क्योंकि उसने सुना था कि वह लाकीश से कूच कर चुका था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुख्य पिलाने वाला।” इब्रानी पाठ में अश्शूरी पदवी “रबशाके” है। यहाँ इसे लिप्यंतरित किया गया है, क्योंकि कथा में यह राजकीय पदवी इस अधिकारी की पहचान के रूप में काम करती है।
    reason: lexical_alternative
  - marker: b
    text: या, “लिब्ना में युद्ध करते।” इब्रानी अभिव्यक्ति को अधिक स्थानवाचक ढंग से भी समझा जा सकता है, पर आशय लिब्ना नगर के विरुद्ध युद्ध में लगे होने का है।
    reason: lexical_alternative
