- source_word: כִּי שָׁמַע
  choice: क्योंकि उसने सुना था
  rationale: כִּי कारण बताता है और पूर्वकालिक घटना के लिए 'सुना था' स्वाभाविक है।
- source_word: כִּי נָסַע
  choice: कि राजा ... से कूच कर चुका है
  rationale: נסע का सैन्य प्रसंग में अर्थ पड़ाव उठाकर प्रस्थान करना है; 'कूच कर चुका है' इसे स्पष्ट रूप से व्यक्त करता है। संज्ञा 'राजा' जोड़कर इब्रानी सर्वनाम के सम्भावित संदर्भ को हिन्दी में स्पष्ट किया गया है।
- source_word: מִלָּכִישׁ
  choice: लाकीश से
  rationale: पूर्वसर्ग सहित स्थान-नाम का सीधा हिन्दी रूप।
