id: ISA.37.19
reference: Isaiah 37:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נָתֹ֥ן אֶת אֱלֹהֵי/הֶ֖ם בָּ/אֵ֑שׁ כִּי֩ לֹ֨א אֱלֹהִ֜ים הֵ֗מָּה כִּ֣י אִם מַעֲשֵׂ֧ה יְדֵֽי אָדָ֛ם עֵ֥ץ וָ/אֶ֖בֶן וַֽ/יְאַבְּדֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/019.yaml
  text: and have put their gods into the fire[a], for they were not gods but the work of human hands, wood and stone; so they destroyed them.
translation:
  language: hi
  text: और उनके देवताओं[a] को आग में डाल दिया, क्योंकि वे देवता नहीं थे, बल्कि मनुष्य के हाथों की बनाई हुई लकड़ी और पत्थर की वस्तुएँ थे; इसलिए उन्होंने उन्हें नष्ट कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी मूर्तियों को।” इब्रानी में “उनके देवताओं” कहा गया है और फिर तुरंत स्पष्ट किया गया है कि वे सचमुच देवता नहीं, बल्कि मनुष्य की बनाई हुई वस्तुएँ थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתֹן
  choice: और ... डाल दिया
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है; आग के साथ इस प्रसंग में ‘आग में डाल देना’ स्वाभाविक और अर्थ-सटीक हिन्दी है। क्रिया का पूर्ण रूप हो चुके कार्य को व्यक्त करता है।
- source_word: אֱלֹהֵיהֶם
  choice: उनके देवताओं
  rationale: इब्रानी पाठ पहले उन राष्ट्रों द्वारा पूजे जाने वालों को सीधे ‘उनके देवता’ कहता है और अगली उपवाक्य में उनके वास्तविक देवता होने का निषेध करता है; इसी कथनात्मक तनाव को बनाए रखा गया है।
- source_word: בָּאֵשׁ
  choice: आग में
  rationale: शासक क्रिया के साथ यह आग में डालने और जलाकर नष्ट करने की दिशा तथा क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי לֹא אֱלֹהִים הֵמָּה
  choice: क्योंकि वे देवता नहीं थे
  rationale: कारणसूचक כִּי को ‘क्योंकि’ और प्रसंगगत भूतकाल को ‘नहीं थे’ से व्यक्त किया गया है, बिना कथन की धर्मवैचारिक धार को नरम किए।
- source_word: כִּי אִם
  choice: बल्कि
  rationale: यह सच्चे देवत्व और मनुष्य-निर्मित वस्तुओं के बीच स्पष्ट विरोध दिखाता है।
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: मनुष्य के हाथों की बनाई हुई ... वस्तुएँ
  rationale: शाब्दिक अर्थ ‘मनुष्य के हाथों का काम’ है। हिन्दी में यह रूप स्पष्ट करता है कि वे मानव-निर्मित वस्तुएँ थीं; אָדָם यहाँ सामान्य मानवता का बोध कराता है।
- source_word: עֵץ וָאֶבֶן
  choice: लकड़ी और पत्थर की
  rationale: मूर्तियों की सामग्री को बताने वाले समानाधिकरण को हिन्दी में स्वाभाविक विशेषण-पदबंध के रूप में रखा गया है।
- source_word: וַיְאַבְּדוּם
  choice: इसलिए उन्होंने उन्हें नष्ट कर दिया
  rationale: हिफ़ील रूप का अर्थ ‘नष्ट कर देना’ है। ‘इसलिए’ पिछले कारण और परिणाम का संबंध स्पष्ट करता है; कर्ता और कर्म के बहुवचन सर्वनाम स्रोत के अनुरूप रखे गए हैं।
theological_decisions:
- issue: राष्ट्रों के पूज्य देवताओं की वास्तविक स्थिति
  choice: ‘उनके देवताओं’ कहा गया है और तुरंत बाद ‘वे देवता नहीं थे’ द्वारा उनकी वास्तविक दिव्यता का निषेध किया गया है।
  alternative: ‘उनकी मूर्तियों’ कहकर आरम्भ करना।
  rationale: स्रोत पहले राष्ट्रों की अपनी संज्ञा को रखता है, फिर उसका खंडन करता है। दोनों तत्वों को बनाए रखने से मूल की विवादात्मक शक्ति और धर्मवैचारिक तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। पद पिछले वाक्य से जुड़ा है, इसलिए आरम्भिक ‘और’ सुरक्षित रखा गया है। ‘वस्तुएँ’ जोड़ने से हिन्दी वाक्य व्याकरणसम्मत और सहज बनता है, जबकि लकड़ी-पत्थर तथा मानव-निर्मित होने का मूल अर्थ अक्षुण्ण रहता है।
