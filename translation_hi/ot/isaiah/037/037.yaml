  language: hi
  text: तब अश्शूर का राजा सन्हेरीब कूच करके चला गया, लौट आया और नीनवे में निवास किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסַּע
  choice: वहाँ से कूच करके
  rationale: נסע यात्रा के संदर्भ में पड़ाव उठाकर प्रस्थान करने को दर्शाता है। ‘कूच करके’ गति और प्रस्थान दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיֵּלֶךְ
  choice: चला गया
  rationale: הלך सामान्यतः ‘जाना/चलना’ है। इसे अलग रूप में रखने से इब्रानी क्रियाओं का क्रम बना रहता है।
- source_word: וַיָּשָׁב
  choice: लौटकर
  rationale: שׁוב यहाँ अपने क्षेत्र और नगर को वापस जाने के अर्थ में है; ‘लौटकर’ अगले निवास-वाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: סַנְחֵרִיב
  choice: सन्हेरीब
  rationale: इब्रानी नाम का हिन्दी बाइबल-परंपरा में प्रचलित लिप्यंतरण।
- source_word: מֶלֶךְ אַשּׁוּר
  choice: अश्शूर का राजा
  rationale: संबंधवाचक पदबंध को स्वाभाविक हिन्दी में प्रस्तुत करता है और सन्हेरीब का पद तथा राज्य बताता है।
- source_word: וַיֵּשֶׁב
  choice: वहीं रहने लगा
  rationale: ישׁב का अर्थ यहाँ नीनवे में निवास करना है। ‘रहने लगा’ सतत निवास का भाव देता है; ‘वहीं’ गंतव्य को निवास-स्थान के रूप में स्पष्ट करता है, बिना अर्थ बदले।
- source_word: בְּנִינְוֵה
  choice: नीनवे
  rationale: नगर के नाम का हिन्दी में प्रचलित लिप्यंतरण; ‘लौटकर’ और ‘वहीं’ के साथ इसका स्थानवाचक अर्थ स्वाभाविक रूप से व्यक्त है।
