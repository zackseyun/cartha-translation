lexical_decisions:
- source_word: אַיֵּה
  choice: कहाँ हैं
  rationale: यह स्थान पूछने वाला प्रश्नवाचक क्रियाविशेषण है। यद्यपि इब्रानी में इसके बाद पहला पद एकवचन है, प्रश्न राजाओं की पूरी सूची के विषय में है; इसलिए हिन्दी में बहुवचन स्वाभाविक है।
- source_word: מֶלֶךְ
  choice: राजा
  rationale: מֶלֶךְ का सामान्य और सटीक हिन्दी अर्थ ‘राजा’ है। इब्रानी की पुनरावृत्ति को मुख्य स्थानों पर बनाए रखा गया है।
- source_word: חֲמָת
  choice: हमात
  rationale: स्थानवाचक नाम को इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: אַרְפָּד
  choice: अर्पाद
  rationale: स्थानवाचक नाम का देवनागरी लिप्यंतरण।
- source_word: לָעִיר
  choice: नगर का
  rationale: यहाँ पद सफ़रवैम के साथ मिलकर उसके नगर होने और उससे राजा के संबंध को व्यक्त करता है; हिन्दी में ‘सफ़रवैम नगर का राजा’ स्वाभाविक है।
- source_word: סְפַרְוָיִם
  choice: सफ़रवैम
  rationale: स्थानवाचक नाम को उसके इब्रानी रूप के निकट लिप्यंतरित किया गया है।
- source_word: הֵנַע
  choice: हेना
  rationale: स्थानवाचक नाम का सीधा लिप्यंतरण; प्रचलित वैकल्पिक रूप पादटिप्पणी में दिया गया है।
- source_word: עִוָּה
  choice: इव्वा
  rationale: मसोरेटिक स्वरांकन के अनुरूप स्थानवाचक नाम का लिप्यंतरण; वैकल्पिक परंपरागत रूप पादटिप्पणी में रखा गया है।
