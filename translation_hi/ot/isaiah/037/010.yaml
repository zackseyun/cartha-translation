  text: כֹּ֣ה תֹאמְר֗וּ/ן אֶל חִזְקִיָּ֤הוּ מֶֽלֶךְ יְהוּדָה֙ לֵ/אמֹ֔ר אַל יַשִּֽׁאֲ/ךָ֣ אֱלֹהֶ֔י/ךָ אֲשֶׁ֥ר אַתָּ֛ה בּוֹטֵ֥חַ בּ֖/וֹ לֵ/אמֹ֑ר לֹ֤א תִנָּתֵן֙ יְר֣וּשָׁלִַ֔ם בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/010.yaml
  text: 'Thus you shall say to Hezekiah king of Judah: ‘Do not let your God[a], in whom you trust, deceive you, saying[b], “Jerusalem will not be given into the hand of the king of Assyria.”’'
translation:
  language: hi
  text: '“तुम यहूदा के राजा हिजकिय्याह से यह कहो: ‘तुम्हारा परमेश्वर, जिस पर तुम भरोसा करते हो, यह कहकर तुम्हें धोखा न दे[a] कि “यरूशलेम अश्शूर के राजा के हाथ में[b] नहीं दिया जाएगा।”’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हें गुमराह न करे।” इब्रानी क्रिया का अर्थ “धोखा देना” या “गुमराह करना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “हाथ में” एक इब्रानी मुहावरा है, जिसका अर्थ किसी के “अधिकार” या “वश में” होना है।
    reason: idiom_explanation
lexical_decisions:
- source_word: כֹּה תֹאמְרוּן
  choice: तुम ... यह कहना
  rationale: כֹּה संदेश की विषयवस्तु की ओर संकेत करता है और अपूर्ण क्रिया यहाँ निर्देशात्मक बल रखती है। आधुनिक हिन्दी में यह संयोजन औपचारिक संदेश-सूत्र को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा हिजकिय्याह
  rationale: व्यक्तिनाम के साथ राजकीय उपाधि को स्पष्ट और प्रचलित हिन्दी क्रम में रखा गया है।
- source_word: יַשִּׁאֲךָ
  choice: तुम्हें धोखा न दे
  rationale: हिफ़ील रूप का अर्थ ‘धोखा देना/भटका देना’ है। ‘धोखा न दे’ अश्शूरी संदेश के निंदात्मक आरोप की तीव्रता बनाए रखता है और उसे कथावाचक की पुष्टि नहीं बनाता।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन संबंधसूचक प्रत्यय सुरक्षित है; संदेश सीधे हिजकिय्याह को संबोधित करता है।
- source_word: אֲשֶׁר אַתָּה בּוֹטֵחַ בּוֹ
  choice: जिस पर तुम भरोसा रखते हो
  rationale: בטח के भरोसा/निर्भरता संबंधी अर्थ को सरल, वर्तमान हिन्दी में व्यक्त किया गया है।
- source_word: לֵאמֹר
  choice: यह कहकर
  rationale: दूसरा לֵאמֹר कथित धोखे की विषयवस्तु प्रस्तुत करता है। ‘यह कहकर’ हिन्दी में उस वाक्यगत संबंध को स्पष्ट रखता है।
- source_word: לֹא תִנָּתֵן
  choice: नहीं दिया जाएगा
  rationale: נתן के निफ़अल निष्क्रिय रूप को औपचारिक रूप से सुरक्षित रखा गया है; ‘कब्ज़े में नहीं आएगा’ जैसे अर्थ-विस्तार से बचा गया है।
- source_word: בְּיַד מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा के हाथ में
  rationale: मूल ‘हाथ में’ मुहावरे को पाठ में बनाए रखा गया है; इसका अभिप्राय अधिकार या वश में दिया जाना है।
theological_decisions:
- issue: इस्राएल के परमेश्वर के विरुद्ध अश्शूरी ताने का निरूपण
  choice: तुम्हारा परमेश्वर ... तुम्हें धोखा न दे
  alternative: अपने परमेश्वर की बात से धोखा मत खाना
  rationale: चुना हुआ पाठ मूल में परमेश्वर को कथित धोखे का कर्ता बताने वाले शत्रुतापूर्ण आरोप को नरम नहीं करता। उद्धरण-चिह्न स्पष्ट करते हैं कि यह अश्शूरी वक्ता का दावा है, कथावाचक का धर्मवैचारिक निर्णय नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। संदेश-सूत्र में औपचारिकता है, जबकि प्रत्यक्ष उद्धरण में अश्शूरी धमकी की कठोरता सुरक्षित है। फुटनोट चिह्न उन शब्दों के तुरंत बाद रखे गए हैं जिनकी वे व्याख्या करते हैं।
