  naturalness: The Hindi is modern, clear, and appropriately dignified. ‘आज का दिन संकट, ताड़ना और अपमान का दिन है’ is idiomatic in a solemn biblical register. The compressed shift within the childbirth metaphor—children at birth, yet no strength for giving birth—reflects the source’s intentionally vivid image and remains understandable in Hindi.
