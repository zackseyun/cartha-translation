id: ISA.37.3
reference: Isaiah 37:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר חִזְקִיָּ֔הוּ יוֹם צָרָ֧ה וְ/תוֹכֵחָ֛ה וּ/נְאָצָ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י בָ֤אוּ בָנִים֙ עַד מַשְׁבֵּ֔ר וְ/כֹ֥חַ אַ֖יִן לְ/לֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/003.yaml
  text: 'And they said to him[a], “Thus says Hezekiah: This day is a day of distress, rebuke, and disgrace, for children have come to the point of birth[b], and there is no strength to give birth.”'
translation:
  language: hi
  text: 'उन्होंने उससे कहा, “हिजकिय्याह ऐसा कहता है: आज का दिन संकट, ताड़ना और अपमान[a] का दिन है, क्योंकि बच्चे जन्म लेने की घड़ी तक आ पहुँचे हैं[b], पर जन्म देने की शक्ति नहीं है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “डाँट और तिरस्कार।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “बच्चे प्रसव-स्थान तक आ पहुँचे हैं।” इब्रानी में यह उस प्रसव का रूपक है जो जन्म के निर्णायक बिंदु तक पहुँच गया है, पर जन्म देने की शक्ति शेष नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: उन्होंने उससे कहा
  rationale: वय्यिक्तोल कथानक की अगली क्रिया बताता है और אֵלָיו का स्वाभाविक हिन्दी रूप ‘उससे’ है।
- source_word: כֹּה אָמַר חִזְקִיָּהוּ
  choice: हिजकिय्याह ऐसा कहता है
  rationale: दूत-संदेश के सूत्र כֹּה אָמַר को वर्तमान अर्थ वाले स्वाभाविक और गरिमापूर्ण हिन्दी वाक्य में रखा गया है।
- source_word: יוֹם צָרָה
  choice: संकट का दिन
  rationale: צָרָה यहाँ राष्ट्रीय विपत्ति, क्लेश और घोर परेशानी का बोध कराता है; ‘संकट’ स्पष्ट और प्रचलित है।
- source_word: וְתוֹכֵחָה
  choice: ताड़ना
  rationale: תּוֹכֵחָה में डाँट, उलाहना या सुधारात्मक दंड का भाव हो सकता है; ‘ताड़ना’ गंभीर प्रसंग के अनुरूप है और अर्थ को केवल मौखिक डाँट तक सीमित नहीं करती।
- source_word: וּנְאָצָה
  choice: अपमान
  rationale: נְאָצָה तिरस्कार, निंदा अथवा घोर अनादर का अर्थ दे सकता है। यहाँ दिन की सार्वजनिक लज्जा और अनादर को व्यक्त करने के लिए ‘अपमान’ चुना गया है, जबकि ‘ईशनिंदा’ जैसे अधिक विशिष्ट अर्थ को आरोपित नहीं किया गया।
- source_word: הַיּוֹם הַזֶּה
  choice: आज का दिन
  rationale: हिन्दी में ‘आज का दिन’ संकेतवाचक बल और गंभीरता को सहज रूप से व्यक्त करता है।
- source_word: כִּי בָאוּ בָנִים עַד מַשְׁבֵּר
  choice: क्योंकि बच्चे जन्म लेने की घड़ी तक आ पहुँचे हैं
  rationale: בָנִים प्रसव के लिए तैयार शिशुओं को सूचित करता है, केवल पुत्रों को नहीं। מַשְׁבֵּר प्रसव के निर्णायक बिंदु या स्थान का बिंब है; ‘जन्म लेने की घड़ी’ उस बिंब को समझने योग्य हिन्दी में बनाए रखता है।
- source_word: וְכֹחַ אַיִן לְלֵדָה
  choice: पर जन्म देने की शक्ति नहीं है
  rationale: 'यह वाक्य प्रसव-बिंब को पूरा करता है: प्रसव का समय आ गया है, किंतु जनने की शक्ति नहीं बची। ‘पर’ निहित विरोध को स्वाभाविक हिन्दी में स्पष्ट करता है।'
theological_decisions:
- issue: राष्ट्रीय संकट के लिए प्रसव का रूपक
  choice: प्रसव के रूपक को स्पष्ट रूप से बनाए रखा गया है।
  alternative: हम संकट की चरम सीमा पर पहुँच गए हैं और हममें कोई शक्ति नहीं बची।
  rationale: इब्रानी पाठ यहूदा की असहाय दशा को जन्म के निकट पहुँचे बच्चों और शक्ति-विहीन प्रसूता के सजीव बिंब से व्यक्त करता है। इसे सामान्य असहायता के कथन में बदलना मूल की काव्यात्मक और धार्मिक तीव्रता को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। संकट की त्रयी और प्रसव के मूल रूपक दोनों सुरक्षित हैं। पादटिप्पणी [a] को उसी पदसमूह पर लगाया गया है जिससे उसका वास्तविक संबंध है।
