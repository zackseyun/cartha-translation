translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण कथात्मक रूप। इब्रानी के दोहरे וַיִּשְׁמַע को ‘सुना’ और ‘यह सुनकर’ के रूप में बनाए रखा गया है। पद अगले कथन की भूमिका पर समाप्त होता है, इसलिए अंत में अल्पविराम रखा गया है।
