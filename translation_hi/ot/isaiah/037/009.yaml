  text: וַ/יִּשְׁמַ֗ע עַל תִּרְהָ֤קָה מֶֽלֶךְ כּוּשׁ֙ לֵ/אמֹ֔ר יָצָ֖א לְ/הִלָּחֵ֣ם אִתָּ֑/ךְ וַ/יִּשְׁמַע֙ וַ/יִּשְׁלַ֣ח מַלְאָכִ֔ים אֶל חִזְקִיָּ֖הוּ לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/009.yaml
  text: And he heard concerning Tirhakah king of Cush[a], saying, “He has come out to fight against you.” And when he heard, he sent messengers to Hezekiah, saying[b],
translation:
  language: hi
  text: तब उसने कूश के राजा तिर्हाका के विषय में यह समाचार सुना, “वह तुमसे युद्ध करने निकल पड़ा है।” यह सुनकर उसने हिजकिय्याह के पास दूत भेजे और कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע עַל
  choice: तब उसने ... के विषय में यह समाचार सुना
  rationale: וַיִּשְׁמַע कथा की अगली घटना बताता है और עַל सुनी गई बात का विषय प्रस्तुत करता है। हिंदी में ‘यह समाचार सुना’ पुनरुक्त ‘कहते हुए’ की अपेक्षा स्वाभाविक ढंग से सूचना मिलने का भाव व्यक्त करता है।
- source_word: תִּרְהָקָה
  choice: तिर्हाका
  rationale: इब्रानी व्यक्ति-नाम का देवनागरी लिप्यंतरण।
- source_word: מֶלֶךְ כּוּשׁ
  choice: कूश का राजा
  rationale: כּוּשׁ प्राचीन भौगोलिक-जातीय नाम है; इसे बाद के आधुनिक देश-नाम से नहीं बदला गया।
- source_word: יָצָא לְהִלָּחֵם אִתָּךְ
  choice: वह तुमसे युद्ध करने निकल पड़ा है
  rationale: יָצָא सैन्य अभियान के लिए निकलने और לְהִלָּחֵם युद्ध करने को दर्शाता है। युद्ध-संदर्भ में אִתָּךְ का स्वाभाविक हिंदी अर्थ ‘तुमसे’ है, जिसका आशय विरोध में लड़ना है।
- source_word: וַיִּשְׁמַע וַיִּשְׁלַח
  choice: यह सुनकर उसने ... भेजे
  rationale: दो क्रमिक क्रियाओं को वर्तमान हिंदी कथा-शैली में स्वाभाविक रूप से जोड़ा गया है, जबकि दूसरी बार שׁמע की पुनरावृत्ति भी अर्थतः सुरक्षित है।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: राजकीय और सैन्य प्रसंग में यह शब्द मानवीय संदेशवाहकों को सूचित करता है।
- source_word: אֶל חִזְקִיָּהוּ
  choice: हिजकिय्याह के पास
  rationale: नाम का प्रचलित हिंदी बाइबलीय रूप रखा गया और אֶל को स्वाभाविक हिंदी संबंध ‘के पास’ से व्यक्त किया गया।
- source_word: לֵאמֹר
  choice: और कहा
  rationale: पद के अंत में यह अगले पद में आने वाले प्रत्यक्ष कथन की भूमिका बाँधता है; हिंदी में ‘और कहा’ स्पष्ट तथा स्वाभाविक है।
