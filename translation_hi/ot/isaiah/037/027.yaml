- source_word: וָבֹשׁוּ
  choice: और लज्जित हुए
  rationale: בוש लज्जा या अपमान की अवस्था बताता है; यह सरल हिन्दी में परिणामसूचक भाव व्यक्त करता है।
- source_word: עֵשֶׂב שָׂדֶה
