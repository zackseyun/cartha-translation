- source_word: וִירַק דֶּשֶׁא
  choice: और हरी कोंपलें
  rationale: יֶרֶק हरियाली या हरी वनस्पति और דֶּשֶׁא नई उगी हरियाली को दर्शाता है; ‘हरी कोंपलें’ ताजी, कोमल बढ़वार का स्वाभाविक चित्र देता है।
- source_word: חֲצִיר גַּגּוֹת
  choice: छतों पर उगने वाली घास
  rationale: यह उथली मिट्टी में उगकर शीघ्र सूख जाने वाली छत की घास का परिचित बाइबलीय चित्र है।
- source_word: וּשְׁדֵמָה לִפְנֵי קָמָה
  choice: खड़ी फसल बनने से पहले झुलसा हुआ खेत
  rationale: पद का पाठ और अर्थ कठिन है। कृषि-संबंधी उपमाओं तथा 2 राजा 19:26 के समानांतर पाठ के आधार पर समय से पहले नष्ट या झुलसी बढ़वार का भाव सम्भावित है; हिन्दी में इसे स्पष्ट किंतु पादटिप्पणी सहित रखा गया है।
