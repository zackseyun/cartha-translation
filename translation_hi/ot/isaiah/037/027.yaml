base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/027.yaml
  text: And their inhabitants were powerless[a]; they were shattered and put to shame. They were like the grass of the field and green growth, like grass on the housetops[c][b], and like a field before the standing grain.
translation:
  language: hi
  text: और उनके निवासी शक्तिहीन[a] थे; वे टूट गए[b] और लज्जित हुए। वे खेत की घास और हरी वनस्पति के समान, छतों की घास के समान, और खड़ी फसल होने से पहले झुलसे हुए खेत[c] के समान थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘हाथ के छोटे’; यह सामर्थ्य या कुछ कर सकने की क्षमता न होने का इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: इस इब्रानी क्रिया का अर्थ ‘घबरा गए,’ ‘हताश हो गए,’ या ‘चकनाचूर हो गए’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: अंतिम इब्रानी वाक्यांश कठिन है। ‘झुलसा हुआ’ एक सम्भावित अर्थ है; यह ऐसी वनस्पति या खेत का संकेत कर सकता है जो फसल के खड़ी होने से पहले ही नष्ट हो गया हो। 2 राजा 19:26 के समानांतर पाठ से तुलना करें।
    reason: textual_difficulty
