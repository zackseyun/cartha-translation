source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/שְׁמֹ֨עַ֙ הַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ וַ/יִּקְרַ֖ע אֶת בְּגָדָ֑י/ו וַ/יִּתְכַּ֣ס בַּ/שָּׂ֔ק וַ/יָּבֹ֖א בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/001.yaml
  text: And it happened[a], when King Hezekiah heard it, that he tore his clothes, covered himself with sackcloth, and went into the house of Yahweh.
translation:
  language: hi
  text: जब राजा हिजकिय्याह ने यह[a] सुना, तब उसने अपने कपड़े फाड़े, टाट ओढ़ लिया और याहवे के भवन में गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में केवल ‘जब राजा हिजकिय्याह ने सुना’ है; सुनने की बात का कर्म पूर्ववर्ती प्रसंग में निहित है, इसलिए हिन्दी में ‘यह’ जोड़ा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: जब ... ने यह सुना, तब
  rationale: इब्रानी कथात्मक संरचना और कालसूचक כִּשְׁמֹעַ को स्वाभाविक आधुनिक हिन्दी में ‘जब...तब’ से व्यक्त किया गया है। ‘यह’ पूर्ववर्ती प्रसंग से स्पष्ट कर्म है, जो इब्रानी में निहित है।
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: राजा हिजकिय्याह
  rationale: उपाधि और व्यक्तिगत नाम को हिन्दी की स्वाभाविक पद-रचना में रखा गया है।
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: उसने अपने कपड़े फाड़े
  rationale: शोक और संकट की प्रत्यक्ष क्रिया को सरल, शाब्दिक और आधुनिक हिन्दी में सुरक्षित रखा गया है।
- source_word: וַיִּתְכַּס בַּשָּׂק
  choice: टाट ओढ़ लिया
  rationale: प्रत्यावर्ती क्रिया और शोक-वस्त्र पहनने के भाव को हिन्दी के स्वाभाविक मुहावरे में व्यक्त करता है।
- source_word: וַיָּבֹא בֵּית יְהוָה
  choice: याहवे के भवन में गया
  rationale: בוא के प्रवेश/गमन और בֵּית יְהוָה की ‘याहवे का भवन’ अभिव्यक्ति को बनाए रखा गया है; प्रसंग में यह मंदिर को सूचित करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। ‘याहवे’ उसका सीधा लिप्यंतरण है और नाम तथा उपाधि के भेद को सुरक्षित रखता है।
- issue: בֵּית יְהוָה का अर्थ
  choice: याहवे का भवन
  alternative: याहवे का मंदिर
  rationale: ‘भवन’ मूल रूपक को बनाए रखता है, जबकि प्रसंग से मंदिर का आशय स्पष्ट है; इससे मूल पदावली को अनावश्यक रूप से विशिष्ट नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘टाट ओढ़ लिया’ शोक-वस्त्र की सांस्कृतिक क्रिया को सामान्य हिन्दी पाठक के लिए स्पष्ट करता है।
