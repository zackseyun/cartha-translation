base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/020.yaml
  text: And now[a], Yahweh our God, save us from his hand[b], so that all the kingdoms of the earth may know that you alone are Yahweh.
translation:
  language: hi
  text: और अब, हे याहवे, हमारे परमेश्वर, हमें उसके हाथ से बचा ले[a], ताकि पृथ्वी के सभी राज्य जान लें कि केवल तू ही याहवे है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमें उसके हाथ से छुड़ा ले।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “कि तू ही अकेला याहवे है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक ו और कालवाचक עַתָּה दोनों को रखते हुए यह पद की निर्णायक प्रार्थना को स्वाभाविक ढंग से आरम्भ करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय उसके प्रचलित लिप्यंतरण से व्यक्त किया गया है।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: प्रथम पुरुष बहुवचन प्रत्यय को स्पष्ट रखते हुए सामुदायिक और वाचागत संबोधन व्यक्त करता है।
- source_word: הוֹשִׁיעֵנוּ
  choice: हमें ... बचा ले
  rationale: ישׁע के हिफ़ील आज्ञार्थक निवेदन का सीधा और प्रार्थना में स्वाभाविक हिन्दी रूप; ‘छुड़ा ले’ भी संभव है।
- source_word: מִיָדוֹ
  choice: उसके हाथ से
  rationale: असीरियाई राजा के अधिकार या नियंत्रण से मुक्ति का अर्थ देने वाले इब्रानी रूपक को हिन्दी में सुरक्षित रखता है।
- source_word: וְיֵדְעוּ
  choice: ताकि ... जान लें
  rationale: आज्ञार्थक निवेदन के बाद आया यह क्रियारूप प्रसंग में उद्देश्य अथवा परिणाम व्यक्त करता है।
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: पृथ्वी के सभी राज्य
  rationale: प्रसंग का अंतरराष्ट्रीय और सार्वभौमिक विस्तार देखते हुए אֶרֶץ के लिए ‘पृथ्वी’ उपयुक्त है।
- source_word: כִּי
  choice: कि
  rationale: यह उस बात की विषय-वस्तु प्रस्तुत करता है जिसे राज्यों को जानना है।
- source_word: אַתָּה יְהוָה לְבַדֶּךָ
  choice: केवल तू ही याहवे है
  rationale: לְבַדֶּךָ के अनन्यताबोधक बल को स्पष्ट और स्वाभाविक हिन्दी में रखता है, बिना पद के कथन से आगे विस्तार किए।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में प्रयुक्त चार-अक्षरीय व्यक्तिगत नाम को उपाधि से प्रतिस्थापित नहीं किया गया; ‘याहवे’ उसके स्रोत-संगत लिप्यंतरण को दर्शाता है।
- issue: अंतिम वाक्यांश לְבַדֶּךָ का बल
  choice: केवल तू ही याहवे है
  alternative: तू याहवे, अकेला ही है
  rationale: अनुवाद याहवे की अनन्यता पर मूल के जोर को बनाए रखता है, पर इसे व्याख्यात्मक विस्तार द्वारा किसी अधिक विशिष्ट धर्मवैज्ञानिक सूत्र में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक है। ‘तू’ निकट और पारंपरिक ईश्वरीय संबोधन को बनाए रखता है; ‘उसके हाथ से’ मूल इब्रानी रूपक को सुरक्षित रखता है। अंग्रेज़ी परामर्श-पाठ में फुटनोट चिह्नों का स्थान उनकी सामग्री से मेल नहीं खाता था, इसलिए हिन्दी मसौदे में [a] को ‘बचा ले’ और [b] को अंतिम अनन्यताबोधक वाक्य के साथ रखा गया है।
