source:
  edition: WLC
  text: זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עָלָ֑י/ו בָּזָ֨ה לְ/ךָ֜ לָעֲגָ֣ה לְ/ךָ֗ בְּתוּלַת֙ בַּת צִיּ֔וֹן אַחֲרֶ֨י/ךָ֙ רֹ֣אשׁ הֵנִ֔יעָה בַּ֖ת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/022.yaml
  text: 'This is the word that the LORD has spoken concerning him: ‘Virgin Daughter Zion despises you and mocks you; Daughter Jerusalem shakes her head behind you.’'
translation:
  language: hi
  text: 'उसके विषय में यहोवा ने यह वचन कहा है: “सिय्योन की कुँवारी बेटी तुझे तुच्छ जानती है और तेरा उपहास करती है; यरूशलेम की बेटी तेरे पीछे सिर हिलाती है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को हिंदी में प्रचलित और स्पष्ट रूप में रखा गया है।
- source_word: בְּתוּלַת בַּת צִיּוֹן
  choice: कुँवारी सिय्योन-बेटी
  rationale: इब्रानी के काव्यात्मक व्यक्तित्व-चित्रण और ‘कुँवारी’ विशेषण को बनाए रखते हुए स्वाभाविक हिंदी समास चुना गया है।
- source_word: בָּזָה לְךָ
  choice: तुझे तुच्छ समझती है
  rationale: क्रिया בזה यहाँ घृणा अथवा तिरस्कार व्यक्त करती है; यह हिंदी प्रयोग उसके भाव को स्पष्ट रखता है।
- source_word: לָעֲגָה לְךָ
  choice: तेरा उपहास करती है
  rationale: לעג का आशय ठट्ठा या उपहास करना है; dignified आधुनिक हिंदी के लिए ‘उपहास’ चुना गया है।
- source_word: אַחֲרֶיךָ רֹאשׁ הֵנִיעָה
  choice: तेरे पीछे सिर हिलाती है
  rationale: मूल चित्र को सीधे रखा गया है; प्रसंग में यह तिरस्कार का संकेत है, पर उस अर्थ को पाठ में बढ़ाकर नहीं जोड़ा गया।
theological_decisions:
- issue: दिव्य नाम का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में टेट्राग्रामटन יהוה है; अनुवाद में व्यक्तिगत नाम और सामान्य उपाधि का भेद बनाए रखा गया है।
- issue: सिय्योन और यरूशलेम का स्त्री-व्यक्तित्वकरण
  choice: कुँवारी सिय्योन-बेटी; यरूशलेम-बेटी
  alternative: सिय्योन की कुँवारी बेटी; यरूशलेम की बेटी
  rationale: यहाँ ‘बेटी’ नगर की संतान नहीं, स्वयं नगर का काव्यात्मक व्यक्तित्वकरण है; चुना हुआ रूप उस संबंध को अधिक स्पष्टता से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। इब्रानी काव्य की समानांतर संरचना, प्रत्यक्ष संबोधन और तिरस्कारसूचक शारीरिक संकेत को यथासंभव सुरक्षित रखा गया है।
