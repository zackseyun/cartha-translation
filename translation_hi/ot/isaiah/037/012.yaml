base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/012.yaml
  text: Did the gods of the nations that my fathers destroyed deliver them—Gozan[a], Haran, Rezeph, and the people of Eden who were in Telassar?
translation:
  language: hi
  text: क्या जिन राष्ट्रों को मेरे पूर्वजों ने नष्ट कर दिया था, उनके देवताओं ने उन्हें बचाया था—गोज़ान, हारान, रेसेफ़ और एदेन के उन लोगों[a] को जो तलस्सार में थे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘एदेन के पुत्र’; यहाँ इसका आशय एदेन के लोग या निवासी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהִצִּילוּ
  choice: क्या ... बचाया था
  rationale: नצל के हिफ़ील पूर्ण रूप को ऐतिहासिक संदर्भ में आलंकारिक प्रश्न के रूप में रखा गया है। ‘बचाया’ आधुनिक हिन्दी में स्वाभाविक है और उद्धार कर सकने में असमर्थता के ताने को स्पष्ट रखता है।
- source_word: אוֹתָם
  choice: उन्हें
  rationale: मूल का कर्मवाचक सर्वनाम सुरक्षित रखा गया है; आगे आनेवाली सूची उसके संदर्भ को स्पष्ट करती है।
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: उनके देवताओं
  rationale: अर्थ ‘जातियों के देवता’ है। हिन्दी वाक्य-संरचना में ‘उनके देवताओं’ से उन्हीं पहले उल्लिखित जातियों से संबंध सहज और स्पष्ट होता है।
- source_word: אֲשֶׁר הִשְׁחִיתוּ אֲבוֹתַי
  choice: जिन जातियों को मेरे पुरखाओं ने नष्ट कर दिया था
  rationale: हिफ़ील שׁחת का सैन्य अर्थ ‘नष्ट करना’ है। संबंधवाचक उपवाक्य को हिन्दी में स्वाभाविक क्रम दिया गया है; ‘पुरखाओं’ में राजवंशीय पूर्वज और पूर्ववर्ती शासक दोनों का भाव समा सकता है।
- source_word: אֶת גּוֹזָן וְאֶת חָרָן וְרֶצֶף
  choice: गोज़ान, हारान, रेसेफ़
  rationale: स्थान-नामों को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: וּבְנֵי עֶדֶן
  choice: एदेन के वंशजों
  rationale: शाब्दिक अर्थ ‘एदेन के पुत्र’ है, पर בני यहाँ समुदाय अथवा उससे जुड़े निवासियों को सूचित कर सकता है। ‘वंशजों’ शाब्दिक संबंध को कुछ हद तक बनाए रखता है, जबकि टिप्पणी व्यापक सामुदायिक अर्थ बताती है।
- source_word: אֲשֶׁר בִּתְלַשָּׂר
  choice: तलस्सार में रहनेवाले
  rationale: संबंधवाचक उपवाक्य को निकटतम पद ‘एदेन के वंशजों’ से जोड़ा गया है और ב को स्थानसूचक ‘में’ से व्यक्त किया गया है।
