  text: So the servants of King Hezekiah came to Isaiah.
translation:
  language: hi
  text: तब राजा हिजकिय्याह के सेवक यशायाह के पास आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: तब ... आए
  rationale: בוא के वय्यिक्तोल रूप से कथा आगे बढ़ती है और यहाँ साधारण भूतकाल स्वाभाविक है। ‘तब’ पिछले प्रसंग से क्रमिक संबंध दिखाता है, बिना कारण-परिणाम को आवश्यकता से अधिक स्पष्ट किए।
- source_word: עַבְדֵי
  choice: सेवक
  rationale: עבד का संबंधवाचक बहुवचन राजदरबार के संदर्भ में राजा के सेवकों, परिचारकों या अधिकारियों को सूचित कर सकता है। ‘सेवक’ मूल शब्द की व्यापकता बनाए रखता है और कोई विशिष्ट प्रशासनिक पद नहीं जोड़ता।
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: राजा हिजकिय्याह
  rationale: निश्चित संज्ञा के बाद व्यक्तिनाम है; आधुनिक हिन्दी में उपाधि और नाम का यह क्रम स्वाभाविक है। हिजकिय्याह नाम का प्रचलित हिन्दी बाइबलीय रूप है।
- source_word: אֶל
  choice: के पास
  rationale: दिशासूचक संबंध को हिन्दी में व्यक्ति के संदर्भ में ‘के पास’ स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: יְשַׁעְיָהוּ
  choice: यशायाह
  rationale: नबी के नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
