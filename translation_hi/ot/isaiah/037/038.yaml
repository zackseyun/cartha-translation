  text: וַ/יְהִי֩ ה֨וּא מִֽשְׁתַּחֲוֶ֜ה בֵּ֣ית נִסְרֹ֣ךְ אֱלֹהָ֗י/ו וְֽ/אַדְרַמֶּ֨לֶךְ וְ/שַׂרְאֶ֤צֶר בָּנָי/ו֙ הִכֻּ֣/הוּ בַ/חֶ֔רֶב וְ/הֵ֥מָּה נִמְלְט֖וּ אֶ֣רֶץ אֲרָרָ֑ט וַ/יִּמְלֹ֛ךְ אֵֽסַר חַדֹּ֥ן בְּנ֖/וֹ תַּחְתָּֽי/ו׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/038.yaml
  text: And it happened that[a], as he was worshiping in the house of Nisroch his god, Adrammelech and Sharezer his sons struck him down with the sword, and they escaped to the land of Ararat[c][b]. And Esar-haddon his son reigned in his place.
translation:
  language: hi
  text: और ऐसा हुआ कि जब वह अपने देवता निस्रोक के भवन में दण्डवत् होकर आराधना कर रहा था[a], तब उसके पुत्र अद्रम्मेलेक और सरेसेर ने उसे तलवार से मार डाला। फिर वे अरारात देश में भाग निकले। उसके स्थान पर उसका पुत्र एसरहद्दोन राजा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दण्डवत् हो रहा था”; इब्रानी क्रिया आराधना में शरीर झुकाने या भूमि पर दण्डवत् होने की क्रिया पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: और ऐसा हुआ कि
  rationale: यह कथात्मक सूत्र नए घटनाक्रम का परिचय देता है; यह अनुवाद हिब्रू के प्रवचन-कार्य को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: מִשְׁתַּחֲוֶה
  choice: दण्डवत् करके आराधना कर रहा था
  rationale: हित्पएल रूप आराधना के संदर्भ में भूमि पर झुकने या दण्डवत् होने की शारीरिक क्रिया को व्यक्त करता है; संयुक्त पद धार्मिक अर्थ और शारीरिक मुद्रा दोनों बचाता है।
- source_word: בֵּית נִסְרֹךְ אֱלֹהָיו
  choice: अपने देवता निस्रोक के भवन में
  rationale: בֵּית का शाब्दिक अर्थ 'घर/भवन' है और यहाँ देवालय अभिप्रेत है; 'भवन' स्रोत की अभिव्यक्ति को बनाए रखते हुए हिन्दी में समझने योग्य है।
- source_word: אַדְרַמֶּלֶךְ וְשַׂרְאֶצֶר בָּנָיו
  choice: उसके पुत्र अद्रम्मेलेक और सरेसेर
  rationale: नामों का देवनागरी लिप्यंतरण किया गया है और בָּנָיו के पुल्लिंग बहुवचन को स्पष्ट रूप से 'पुत्र' कहा गया है।
- source_word: הִכֻּהוּ בַחֶרֶב
  choice: उसे तलवार से मार डाला
  rationale: נכה मूलतः प्रहार करना है, पर तलवार और उत्तराधिकार के संदर्भ में परिणाम स्पष्टतः मृत्यु है; आधुनिक हिन्दी में 'मार डाला' घटना को स्वाभाविक और ठीक ढंग से व्यक्त करता है।
- source_word: נִמְלְטוּ אֶרֶץ אֲרָרָט
  choice: वे अरारात देश को भाग निकले
  rationale: נמלט सफलतापूर्वक बच निकलने को दर्शाता है; गंतव्य के साथ 'भाग निकले' हत्या के बाद पलायन का अर्थ स्वाभाविक रूप से देता है।
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: उसके स्थान पर ... राजा हुआ
  rationale: מלך और תַּחְתָּיו मिलकर राजकीय उत्तराधिकार बताते हैं; हिन्दी में 'राजा हुआ' संक्षिप्त और स्पष्ट है।
