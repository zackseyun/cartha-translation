  text: सचमुच, हे यहवे, अश्शूर के राजाओं ने सभी देशों[a] और उनकी भूमि[b] को उजाड़ दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सभी भूभागों’। इब्रानी शब्द का अर्थ संदर्भ के अनुसार भूमि, भूभाग या देश हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘उनकी भूमि’; इसे सामूहिक अर्थ में समझा जा सकता है, जबकि समानांतर पद में इसे प्रायः ‘उनकी भूमियाँ’ अनुवादित किया जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אָמְנָם
  choice: सचमुच
  rationale: यह शब्द आगे कही गई बात की दृढ़ पुष्टि करता है। ‘सचमुच’ प्रार्थना के स्वाभाविक और सम्मानपूर्ण स्वर में इस बल को व्यक्त करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; इसलिए किसी उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण दिया गया है।
- source_word: הֶחֱרִיבוּ
  choice: उजाड़ दिया है
  rationale: חרב के हिफ़ईल रूप का अर्थ किसी स्थान को उजाड़ या बरबाद कर देना है। यहाँ सैन्य विनाश के संदर्भ में ‘उजाड़ दिया है’ सटीक और स्वाभाविक है।
- source_word: מַלְכֵי אַשּׁוּר
  choice: अश्शूर के राजाओं
  rationale: यह इब्रानी संबंध-वाचक संरचना का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: אֶת כָּל הָאֲרָצוֹת
  choice: सभी देशों
  rationale: אֲרָצוֹת का अर्थ भूमि, भूभाग या देश हो सकता है। सैन्य-राजनीतिक संदर्भ में ‘देशों’ साधारण हिन्दी पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी व्यापक शाब्दिक अर्थ को सुरक्षित रखती है।
- source_word: וְאֶת אַרְצָם
  choice: और उनकी भूमि
  rationale: दिए गए मसोराई पाठ में ‘भूमि’ एकवचन है और उसके साथ अन्य पुरुष बहुवचन प्रत्यय है। अनुवाद इस कठिन अभिव्यक्ति को बहुवचन बनाकर समतल नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘यहवे’ उस नाम को सुरक्षित रखता है, जबकि ‘प्रभु’ उसे एक उपाधि से बदल देता और ‘यहोवा’ एक वैकल्पिक पारंपरिक लिप्यंतरण है।
- issue: וְאֶת אַרְצָם में एकवचन ‘भूमि’ का आशय
  choice: उनकी भूमि
  alternative: उनकी भूमियाँ
  rationale: मूल के व्याकरणिक एकवचन को बनाए रखा गया है। इसे सामूहिक अर्थ में समझा जा सकता है, पर अनुवाद पाठ की असामान्यता को चुपचाप बहुवचन में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनात्मक और गरिमापूर्ण रखी गई है। ‘हे’ संबोधन की गंभीरता बनाए रखता है। वाक्य स्वाभाविक हिन्दी क्रम में है, पर अंतिम इब्रानी एकवचन की व्याख्यात्मक कठिनाई पादटिप्पणी सहित सुरक्षित रखी गई है।
