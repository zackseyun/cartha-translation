source:
  edition: WLC
  text: יַ֚עַן הִתְרַגֶּזְ/ךָ֣ אֵלַ֔/י וְ/שַׁאֲנַנְ/ךָ֖ עָלָ֣ה בְ/אָזְנָ֑/י וְ/שַׂמְתִּ֨י חַחִ֜/י בְּ/אַפֶּ֗/ךָ וּ/מִתְגִּ/י֙ בִּ/שְׂפָתֶ֔י/ךָ וַ/הֲשִׁ֣יבֹתִ֔י/ךָ בַּ/דֶּ֖רֶךְ אֲשֶׁר בָּ֥אתָ בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/029.yaml
  text: Because your raging against me and your complacency have come up into my ears[a], I will put my hook in your nose and my bit in your lips[b], and I will turn you back by the way that you came.
translation:
  language: hi
  text: क्योंकि तुम्हारा मेरे विरुद्ध क्रोध और तुम्हारी बेपरवाह निश्चिंतता मेरे कानों तक पहुँचे हैं,[a] इसलिए मैं अपना काँटा तुम्हारी नाक में और अपनी लगाम तुम्हारे होंठों में डालूँगा; और जिस रास्ते से तुम आए थे, उसी से तुम्हें वापस लौटा दूँगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारा अहंकारी आत्मविश्वास”; इब्रानी शब्द चैन या सुरक्षित होने की दशा बता सकता है, पर यहाँ संभवतः घमंड से भरी आत्म-निश्चिंतता का भाव है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप के निकट: “उस मार्ग से जिससे तुम आए थे।”'
    reason: previous_rendering
lexical_decisions:
- source_word: יַעַן
  choice: क्योंकि … इसलिए
  rationale: यह न्याय के कारण और परिणाम का संबंध स्पष्ट करता है। हिन्दी में ‘क्योंकि … इसलिए’ स्वाभाविक है और इब्रानी के कारणसूचक बल को बनाए रखता है।
- source_word: הִתְרַגֶּזְךָ אֵלַי
  choice: मेरे विरुद्ध तुम्हारा भड़कना
  rationale: क्रिया शत्रुतापूर्ण उत्तेजना और उग्रता प्रकट करती है; ‘मेरे विरुद्ध’ אֵלַי के प्रसंगगत विरोधी भाव को स्पष्ट करता है।
- source_word: שַׁאֲנַנְךָ
  choice: तुम्हारी बेपरवाह निश्चिंतता
  rationale: शब्द का मूल भाव चैन, सुरक्षा या निश्चिंतता है, पर इस न्याय-वचन में वह घमंड से भरे आत्मविश्वास का नकारात्मक भाव रखता है। इस चयन से मूल अर्थ और प्रसंगगत निंदा दोनों बने रहते हैं।
- source_word: עָלָה בְאָזְנָי
  choice: मेरे कानों तक पहुँचे हैं
  rationale: यह हिन्दी में स्वाभाविक ढंग से सुनाई पड़ने का भाव देता है और परमेश्वर के ‘कानों’ की ठोस छवि को भी सुरक्षित रखता है।
- source_word: חַחִי בְּאַפֶּךָ
  choice: अपना काँटा तुम्हारी नाक में
  rationale: חַח नियंत्रित करने के लिए प्रयुक्त काँटे या हुक को दर्शाता है। ‘काँटा’ हिन्दी में ठोस और कठोर छवि देता है; उसका स्थान अगला पद स्पष्ट करता है।
- source_word: מִתְגִּי בִּשְׂפָתֶיךָ
  choice: अपनी लगाम तुम्हारे होंठों में
  rationale: מֶתֶג पशु को नियंत्रित करने वाली लगाम का मुँह में रखा जाने वाला भाग है। ‘लगाम’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘होंठों में’ मूल की असामान्य और अपमानजनक शारीरिक छवि बनाए रखता है।
- source_word: וַהֲשִׁיבֹתִיךָ
  choice: तुम्हें वापस लौटा दूँगा
  rationale: 'हिफ़ील रूप का कारक भाव व्यक्त होता है: परमेश्वर शत्रु राजा को लौटने के लिए बाध्य करेगा।'
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּאתָ בָּהּ
  choice: जिस रास्ते से तुम आए थे, उसी से
  rationale: यह वापसी के उसी मार्ग को स्पष्ट रूप से रेखांकित करता है और आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर के सुनने और शत्रु को पशु की तरह नियंत्रित करने का मानवीकरण
  choice: ‘मेरे कानों’, ‘अपना काँटा’ और ‘अपनी लगाम’ जैसी ठोस छवियाँ बनाए रखी गई हैं।
  alternative: इसे अमूर्त करके ‘मैंने तुम्हारा घमंड सुना है, इसलिए मैं तुम्हें रोककर वापस भेज दूँगा’ कहना।
  rationale: इब्रानी पाठ जानबूझकर तीखी मानवीय और पशु-नियंत्रण संबंधी छवियों द्वारा अश्शूरी राजा पर परमेश्वर की प्रभुता दिखाता है। अमूर्त भावानुवाद उसकी काव्यात्मक और न्यायिक शक्ति घटा देता।
- issue: שַׁאֲנַן में निश्चिंतता और अहंकारी आत्मविश्वास का तनाव
  choice: मुख्य पाठ में ‘बेपरवाह निश्चिंतता’ और पादटिप्पणी में ‘अहंकारी आत्मविश्वास’ रखा गया है।
  alternative: मुख्य पाठ में केवल ‘घमंड’ कहना।
  rationale: केवल ‘घमंड’ प्रसंगगत आशय तो स्पष्ट करता, पर शब्द के चैन या सुरक्षित होने संबंधी मूल अर्थ को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। संबोधन में बहुवचन-सम्मानसूचक ‘तुम’ के रूप प्रयुक्त हैं, जबकि मूल के तीखे न्याय-वचन को ‘भड़कना’, ‘काँटा’ और ‘लगाम’ द्वारा बनाए रखा गया है।
