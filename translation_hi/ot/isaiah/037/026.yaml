base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/026.yaml
  text: Have you not heard? Long ago I made it; from days of old I formed it. Now I have brought it to pass[a], that you should lay waste fortified cities into heaps of ruins.
translation:
  language: hi
  text: क्या तूने नहीं सुना? बहुत पहले मैंने इसे बनाया था; प्राचीन काल में मैंने इसे रचा था। अब मैंने इसे घटित कर दिया है, ताकि तू गढ़वाले नगरों को उजाड़कर खंडहरों के ढेर बना दे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में अंतिम पदसमूह का पदक्रम और सटीक अर्थ कठिन है। इसका आशय यह है कि गढ़वाले नगर उजड़कर खंडहरों के ढेर हो जाते हैं; वाक्य को संबोधित राजा द्वारा उन्हें उजाड़ने के रूप में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא שָׁמַעְתָּ
  choice: क्या तूने नहीं सुना?
  rationale: यह सकारात्मक उत्तर की अपेक्षा करने वाला आलंकारिक प्रश्न है। एक पुरुष राजा को सीधे संबोधित करने के कारण एकवचन ‘तू’ रखा गया है।
- source_word: לְמֵרָחוֹק
  choice: बहुत पहले
  rationale: शाब्दिक अर्थ ‘दूर से’ है, पर यहाँ दूरी समय की है; इसलिए वर्तमान हिन्दी में स्वाभाविक कालवाचक रूप चुना गया है।
- source_word: אוֹתָהּ עָשִׂיתִי
  choice: मैंने यह किया था
  rationale: स्त्रीलिंग कर्म-सर्वनाम पूर्वनियोजित घटना या कार्य की ओर संकेत करता है। ‘यह’ उस संकेत को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: מִימֵי קֶדֶם וִיצַרְתִּיהָ
  choice: प्राचीन काल से मैंने इसे रचा था
  rationale: יָצַר में आकार देने और सोद्देश्य रचना का भाव है। ‘रचा’ उस चित्रात्मकता को बचाते हुए किसी व्यवस्थित दार्शनिक अर्थ को नहीं जोड़ता।
- source_word: עַתָּה הֲבֵאתִיהָ
  choice: अब मैंने इसे पूरा कर दिया है
  rationale: בוא का हिफ़ईल रूप यहाँ पहले रची गई बात को वर्तमान इतिहास में घटित कराने का भाव देता है।
- source_word: לְהַשְׁאוֹת
  choice: उजाड़कर
  rationale: क्रिया का अर्थ उजाड़ या निर्जन कर देना है; सैनिक विनाश के प्रसंग में ‘उजाड़कर’ स्पष्ट और स्वाभाविक है।
- source_word: עָרִים בְּצֻרוֹת
  choice: गढ़वाले नगरों
  rationale: यह अभिव्यक्ति सुरक्षा-प्राचीर या दुर्गबंदी वाले नगरों को बताती है। ‘गढ़वाले’ साधारण पाठक के लिए संक्षिप्त और स्पष्ट है।
- source_word: גַּלִּים נִצִּים
  choice: खंडहरों के ढेर
  rationale: यह कठिन पदसमूह विनाश के बाद बचे मलबे या खंडहर के ढेरों का चित्र देता है; हिन्दी में अर्थ स्पष्ट करने के लिए यह स्वाभाविक रूप है।
theological_decisions:
- issue: अश्शूरी विजय पर परमेश्वर की प्रभुता
  choice: वचन कहता है कि परमेश्वर ने इस घटना को बहुत पहले रचा और अब स्वयं उसे पूरा किया, जबकि संबोधित राजा नगरों को उजाड़ने वाला मानवीय कर्ता है।
  alternative: इसे केवल परमेश्वर के पूर्वज्ञान का कथन मानकर उसकी सक्रिय योजना और उसे पूरा करने की भाषा को नरम किया जा सकता था।
  rationale: ‘मैंने किया’, ‘मैंने रचा’ और ‘मैंने पूरा कर दिया’ का क्रम केवल पूर्वज्ञान से अधिक सक्रिय ईश्वरीय उद्देश्य व्यक्त करता है। साथ ही दूसरे पुरुष के संबोधन से मानवीय कर्तृत्व भी बना रहता है; अनुवाद इस तनाव को हल किए बिना सुरक्षित रखता है।
- issue: अंतिम परिणामवाचक उपवाक्य का कर्ता
  choice: ‘ताकि तू ... बना दे’ द्वारा संबोधित अश्शूरी राजा को विनाश का निकटस्थ कर्ता रखा गया है।
  alternative: ‘ताकि गढ़वाले नगर खंडहरों के ढेर बन जाएँ’ कहकर वाक्य को अकर्मक परिणाम के रूप में प्रस्तुत किया जा सकता है।
  rationale: व्यापक संबोधन और दूसरे पुरुष का संदर्भ सक्रिय कर्ता को बनाए रखने का समर्थन करते हैं, यद्यपि इब्रानी अंतिम पदक्रम कठिन है; इस कठिनाई को पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधे संबोधन वाली रखी गई है। राजकीय/भविष्यद्वाणी प्रसंग में परमेश्वर द्वारा एक पुरुष राजा को संबोधित करने के कारण ‘तू’ का प्रयोग अनादर के लिए नहीं, बल्कि इब्रानी एकवचन संबोधन को सुरक्षित रखने के लिए किया गया है।
