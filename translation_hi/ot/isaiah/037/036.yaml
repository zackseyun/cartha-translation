  edition: WLC
  text: וַ/יֵּצֵ֣א מַלְאַ֣ךְ יְהוָ֗ה וַ/יַּכֶּה֙ בְּ/מַחֲנֵ֣ה אַשּׁ֔וּר מֵאָ֛ה וּ/שְׁמֹנִ֥ים וַ/חֲמִשָּׁ֖ה אָ֑לֶף וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וְ/הִנֵּ֥ה כֻלָּ֖/ם פְּגָרִ֥ים מֵתִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/036.yaml
  text: Then the angel of Yahweh went out and struck down 185,000 in the camp of Assyria. When they arose early in the morning[a], behold, all of them were dead bodies.
translation:
  language: hi
  text: तब यहोवा का दूत निकला और उसने अश्शूर की छावनी में 1,85,000 लोगों को मार डाला। सुबह तड़के जब लोग उठे, तो देखो, वे सभी शव पड़े थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यहोवा का दूत’ का अनुवाद ‘यहोवा का स्वर्गदूत’ भी हो सकता है। इब्रानी शब्द का अर्थ ‘दूत’ या ‘स्वर्गदूत’ दोनों हो सकता है; यहाँ प्रसंग परमेश्वर के न्याय को पूरा करने वाले स्वर्गीय अभिकर्ता की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: यहोवा का दूत
  rationale: מַלְאָךְ का अर्थ ‘दूत’ या संदर्भानुसार स्वर्गदूत हो सकता है। ‘दूत’ मूल की व्यापकता बनाए रखता है, जबकि न्याय के इस प्रसंग में उसका स्वर्गीय अभिकर्ता होना स्पष्ट है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुराक्षरीय दिव्य नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וַיֵּצֵא
  choice: निकला
  rationale: कथात्मक क्रम में יצא का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וַיַּכֶּה
  choice: मार डाला
  rationale: נכה का मूल अर्थ प्रहार करना है, पर यहाँ अगली पंक्ति मृत्यु के परिणाम को स्पष्ट करती है; ‘मार डाला’ प्रसंगगत घातक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּמַחֲנֵה אַשּׁוּר
  choice: अश्शूर की छावनी में
  rationale: इब्रानी संबंध-वाक्यांश का निकट और सहज हिन्दी अनुवाद। ‘अश्शूर’ राज्य/सेना के सामूहिक संदर्भ को बनाए रखता है।
- source_word: מֵאָה וּשְׁמֹנִים וַחֲמִשָּׁה אָלֶף
  choice: 1,85,000
  rationale: ठीक संख्या को आधुनिक भारतीय अंक-विभाजन के अनुसार प्रस्तुत किया गया है।
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: जब लोग भोर को उठे
  rationale: क्रिया बहुवचन है, पर उसका कर्ता मूल में अनिर्दिष्ट है। हिन्दी में ‘लोग’ जोड़कर यही अनिर्दिष्टता स्वाभाविक ढंग से व्यक्त होती है; ‘भोर’ शीघ्र उठने का भाव रखता है।
- source_word: וְהִנֵּה
  choice: तो देखो
  rationale: הִנֵּה अचानक सामने आए दृश्य की ओर ध्यान खींचता है; ‘तो देखो’ उसका कथात्मक और विस्मयकारी बल बनाए रखता है।
- source_word: כֻלָּם פְּגָרִים מֵתִים
  choice: वे सब मृत शरीर पड़े थे
  rationale: ‘वे सब’ प्रत्यययुक्त כֻלָּם का बल रखता है। ‘मृत शरीर’ פְּגָרִים מֵתִים को मुहावरेदार हिन्दी में व्यक्त करता है और ‘पड़े थे’ दृश्य को स्वाभाविक बनाता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है। हिन्दी में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ से नाम को नाम ही रखा गया है, उपाधि ‘प्रभु’ से बदला नहीं गया।
- issue: מַלְאַךְ को स्वर्गदूत या दूत कहना
  choice: दूत
  alternative: स्वर्गदूत
  rationale: शब्द में ‘संदेशवाहक/दूत’ और ‘स्वर्गदूत’ दोनों अर्थ संभव हैं। संदर्भ अलौकिक न्यायकारी अभिकर्ता की ओर संकेत करता है, फिर भी मुख्य पाठ में ‘दूत’ रखकर मूल की शाब्दिक व्यापकता सुरक्षित की गई है और पादटिप्पणी में विकल्प बताया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। कथात्मक तीव्रता के लिए ‘तब’ और ‘तो देखो’ रखे गए हैं। अनिर्दिष्ट बहुवचन कर्ता को ‘लोग’ से व्यक्त किया गया है, बिना यह तय किए कि उठने वाले वास्तव में कौन थे।
