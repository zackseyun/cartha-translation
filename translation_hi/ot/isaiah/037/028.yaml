base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/028.yaml
  text: But I know your sitting down[a], your going out, your coming in, and your raging against me.
translation:
  language: hi
  text: पर मैं तेरा बैठना[a], तेरा बाहर जाना, तेरा भीतर आना और मेरे विरुद्ध तेरा क्रोध जानता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरा बसे रहना ... तेरा निकलना ... तेरा प्रवेश करना।” इब्रानी में यह क्रम किसी व्यक्ति के बसे हुए जीवन और उसके आने-जाने को बताने वाली पारंपरिक अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבְתְּךָ
  choice: तेरा बैठना
  rationale: ישׁב के ठोस बिंब को बनाए रखता है। ‘बाहर जाना’ और ‘भीतर आना’ के साथ यह व्यक्ति के बसे रहने और उसकी गतिविधियों की पारंपरिक अभिव्यक्ति है।
- source_word: וְצֵאתְךָ
  choice: तेरा बाहर जाना
  rationale: יצא का सीधा और स्वाभाविक अनुवाद; यह ‘भीतर आना’ के साथ गति का युग्म बनाता है।
- source_word: וּבוֹאֲךָ
  choice: तेरा भीतर आना
  rationale: בוא को उसके युग्मित पद ‘बाहर जाना’ के अनुरूप स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָדָעְתִּי
  choice: मैं ... जानता हूँ
  rationale: यद्यपि क्रिया पूर्ण रूप में है, प्रसंग में यह वक्ता के निश्चित और वर्तमान ज्ञान को व्यक्त करती है; हिन्दी का वर्तमान काल इस भाव को स्वाभाविक रूप से पहुँचाता है।
- source_word: הִתְרַגֶּזְךָ
  choice: तेरा भड़क उठना
  rationale: Hitpael रूप उग्र उत्तेजना या क्रोधपूर्ण व्यवहार दर्शाता है। ‘भड़क उठना’ उसकी तीव्रता और सक्रिय विरोध को व्यक्त करता है, बिना इसे केवल भीतरी भावना तक सीमित किए।
- source_word: אֵלָי
  choice: मेरे विरुद्ध
  rationale: אל का मूल अर्थ ‘की ओर’ है, पर शत्रुतापूर्ण ‘भड़क उठना’ के साथ हिन्दी में विरोध का भाव ‘मेरे विरुद्ध’ से स्पष्ट होता है।
- source_word: וְאֵת
  choice: और
  rationale: אֵת का अलग अनुवाद नहीं किया गया; समन्वयकारी וְ को अंतिम कर्म को पूर्ववर्ती कर्मों से जोड़ने के लिए ‘और’ से व्यक्त किया गया है।
theological_decisions:
- issue: पूर्ण क्रियारूप द्वारा परमेश्वर का ज्ञान
  choice: ‘मैं ... जानता हूँ’—वर्तमान काल में निश्चित और जारी ज्ञान
  alternative: ‘मैं जान चुका हूँ’ या ‘मैं जानता था’
  rationale: प्रसंग अश्शूरी राजा के जीवन, गतिविधियों और शत्रुता के विषय में यहोवा के पूर्ण ज्ञान की घोषणा करता है। वर्तमान काल मूल कथन की शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है, पर पाठ से आगे कोई अतिरिक्त व्यवस्थित धर्मवैज्ञानिक दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सीधा वाक्य-विन्यास रखा गया है। ‘बैठना’ मूल इब्रानी बिंब को सुरक्षित रखता है, जबकि पाद-टिप्पणी उसके व्यापक मुहावरेदार अर्थ को स्पष्ट करती है।
