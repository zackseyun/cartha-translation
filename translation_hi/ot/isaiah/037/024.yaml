language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/יַ֣ד עֲבָדֶי/ךָ֮ חֵרַ֣פְתָּ אֲדֹנָ/י֒ וַ/תֹּ֗אמֶר בְּ/רֹ֥ב רִכְבִּ֛/י אֲנִ֥י עָלִ֛יתִי מְר֥וֹם הָרִ֖ים יַרְכְּתֵ֣י לְבָנ֑וֹן וְ/אֶכְרֹ֞ת קוֹמַ֤ת אֲרָזָי/ו֙ מִבְחַ֣ר בְּרֹשָׁ֔י/ו וְ/אָבוֹא֙ מְר֣וֹם קִצּ֔/וֹ יַ֖עַר כַּרְמִלּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/024.yaml
  text: By your servants you have mocked the Lord[a], and you have said, ‘With my many chariots I myself have gone up to the heights of the mountains, to the remotest parts of Lebanon; I will cut down its tall cedars, its choicest cypresses, and I will enter its farthest height[c][b], its fruitful forest.’
translation:
  language: hi
  text: तूने अपने सेवकों के द्वारा प्रभु का अपमान किया है[a] और कहा है, ‘अपने बहुत-से रथों के साथ मैं पहाड़ों की ऊँचाइयों पर, लबानोन के दूर-दराज़ भागों तक चढ़ आया हूँ। मैं उसके ऊँचे देवदारों और उसके सबसे अच्छे सरो वृक्षों[b] को काट डालूँगा; मैं उसकी सबसे दूर की ऊँचाई पर, उसके फलते-फूलते वन में[c] प्रवेश करूँगा।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रभु की निंदा की है’ अथवा ‘प्रभु को ललकारा है’; इब्रानी क्रिया में तिरस्कार के साथ अपमान और चुनौती देने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त इब्रानी वृक्ष-नाम בְּרוֹשׁ की ठीक पहचान निश्चित नहीं है; इसका अर्थ सरो, चीड़ या कोई अन्य शंकुधारी वृक्ष हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक पदबंध में ‘वन’ के साथ ऐसी भूमि का शब्द जुड़ा है जो उपजाऊ, हरी-भरी या बाग़ जैसी हो; इसलिए ‘उसका हरा-भरा वन’ भी सम्भव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד עֲבָדֶיךָ
  choice: अपने सेवकों के द्वारा
  rationale: בְּיַד का यहाँ साधनवाचक अर्थ है; यह स्वाभाविक हिन्दी में सेवकों को अपमान का माध्यम बताता है।
- source_word: חֵרַפְתָּ
  choice: अपमान किया है
  rationale: חרף में निंदा, तिरस्कार और धृष्टतापूर्ण चुनौती का भाव है। ‘अपमान किया’ आधुनिक हिन्दी में व्यापक और प्रसंगानुकूल है; अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यहाँ אֲדֹנָי परमेश्वर की उपाधि है, न कि वाचा-नाम יהוה; इसलिए ‘प्रभु’ रखा गया है।
- source_word: בְּרֹב רִכְבִּי
  choice: अपने बहुत-से रथों के साथ
  rationale: רֹב सैन्य बहुतायत और רֶכֶב रथ अथवा रथ-दल को सूचित करता है; यह रूप घमंडपूर्ण सैन्य दावे को सहज हिन्दी में व्यक्त करता है।
- source_word: אֲנִי עָלִיתִי
  choice: मैं ... चढ़ आया हूँ
  rationale: अलग से आए אֲנִי का आत्म-प्रमुख घमंड हिन्दी के स्पष्ट ‘मैं’ और वाक्य-विन्यास से व्यक्त होता है; ‘मैं स्वयं’ जोड़ना हिन्दी में अनावश्यक रूप से भारी होता।
- source_word: יַרְכְּתֵי לְבָנוֹן
  choice: लबानोन के दूर-दराज़ भागों तक
  rationale: יַרְכְּתֵי यहाँ किनारों से अधिक दूरस्थ छोरों अथवा अंदरूनी भागों का बोध देता है।
- source_word: קוֹמַת אֲרָזָיו
  choice: उसके ऊँचे देवदारों
  rationale: קוֹמָה ऊँचाई या कद बताता है; ‘ऊँचे देवदार’ स्वाभाविक ढंग से वृक्षों की विराट ऊँचाई रखता है।
- source_word: מִבְחַר בְּרֹשָׁיו
  choice: उसके सबसे अच्छे सरो वृक्षों
  rationale: מִבְחַר चुने हुए या सर्वोत्तम का बोध देता है। בְּרוֹשׁ की वनस्पतिक पहचान अनिश्चित है; मुख्य पाठ में प्रचलित सम्भावना ‘सरो’ और पादटिप्पणी में विकल्प रखे गए हैं।
- source_word: מְרוֹם קִצּוֹ
  choice: उसकी सबसे दूर की ऊँचाई पर
  rationale: מְרוֹם ऊँचाई और קֵץ चरम छोर का बोध देते हैं; अनिश्चित कठिन पदबंध को सरल करते हुए भी दोनों तत्व सुरक्षित रखे गए हैं।
- source_word: יַעַר כַּרְמִלּוֹ
  choice: उसके फलते-फूलते वन में
  rationale: יַעַר वन है और כַּרְמֶל उपजाऊ, हरे-भरे बाग़ी क्षेत्र का संकेत दे सकता है; ‘फलता-फूलता वन’ दोनों चित्रों को स्वाभाविक हिन्दी में जोड़ता है।
theological_decisions:
- issue: ईश्वरीय उपाधि אֲדֹנָי का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: मूल पाठ में יהוה नहीं, אֲדֹנָי है। ‘प्रभु’ ईश्वरीय उपाधि को व्यक्त करता है और मूल में अनुपस्थित वाचा-नाम को आयात नहीं करता।
- issue: अश्शूरी राजा के कथन का काल और घमंड
  choice: भूतकालीन उपलब्धि के बाद भविष्य के दावे
  alternative: सभी क्रियाओं को पूर्ण भूतकाल में रखना
  rationale: עָלִיתִי पूर्ण क्रिया है, जबकि וְאֶכְרֹת और וְאָבוֹא अपूर्ण रूप हैं जो इस डींग में आगामी मंशा व्यक्त कर सकते हैं। कालभेद को बनाए रखने से कथन का तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। राजकीय घमंड और विशाल प्राकृतिक बिंबों को बनाए रखा गया है। लबानोन नाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है; वनस्पति और कठिन अंतिम पदबंध की वास्तविक अनिश्चितता पादटिप्पणियों में स्पष्ट की गई है।
