base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/004.yaml
  text: Perhaps Yahweh your God will hear the words of the Rabshakeh[a], whom the king of Assyria his master has sent to reproach the living God, and will rebuke the words that Yahweh your God has heard[c][b]. Therefore lift up a prayer for the remnant that is found.
translation:
  language: hi
  text: शायद यहोवा, तुम्हारा परमेश्वर, उस रबशाके[a] की बातें सुने, जिसे अश्शूर के राजा, उसके स्वामी ने, जीवित परमेश्वर की निन्दा करने के लिए भेजा है, और जिन बातों को यहोवा, तुम्हारे परमेश्वर ने सुना है, उनके लिए उसे जवाबदेह ठहराए[b]। इसलिए उन शेष लोगों के लिए प्रार्थना करो जो अब भी मौजूद हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुख्य पिलानेवाला अधिकारी।” “रबशाके” अश्शूर की एक राजकीय पदवी थी, जो यहाँ नाम-जैसे संबोधन के रूप में प्रयुक्त हुई है।
    reason: cultural_note
  - marker: b
    text: या “उन बातों को फटकारे” अथवा “उन बातों के लिए उससे हिसाब ले।” इब्रानी क्रिया परमेश्वर द्वारा सुनी हुई निन्दात्मक बातों के उत्तर में फटकारने, दोष ठहराने, या न्याय करने का भाव रख सकती है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “उस शेष के लिए जो पाया गया है”; अर्थात उन लोगों के लिए जो अब भी मौजूद या बचे हुए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: शायद
  rationale: संभावना और आशा दोनों व्यक्त करता है, पर निश्चितता नहीं थोपता; आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יִשְׁמַע
  choice: सुने
  rationale: ‘शायद’ के साथ संभाव्य अर्थ स्पष्ट है; मूल क्रिया के सुनने तथा ध्यान देने के भाव को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में परमेश्वर के विशिष्ट वाचा-नाम का सुबोध लिप्यंतरण है।
- source_word: רַב שָׁקֵה
  choice: रबशाके
  rationale: अश्शूरी पदवी यहाँ नाम-जैसे संबोधन के रूप में प्रयुक्त है; अर्थ-संभावना पादटिप्पणी में दी गई है।
- source_word: לְחָרֵף
  choice: अपमान करने
  rationale: जीवित परमेश्वर के विरुद्ध निन्दात्मक तिरस्कार का भाव सहज हिन्दी में व्यक्त करता है।
- source_word: אֱלֹהִים חַי
  choice: जीवित परमेश्वर
  rationale: मूल पदबंध और मूर्तियों के विपरीत उसके धर्मवैज्ञानिक बल को सुरक्षित रखता है।
- source_word: וְהוֹכִיחַ בַּדְּבָרִים
  choice: उनके लिए उसे दण्डित करे
  rationale: הוכיח के दोष ठहराने, हिसाब लेने या दण्ड देने के न्यायिक भाव को प्रसंगानुसार व्यक्त करता है; ‘उसे’ वचन के कर्ता को स्पष्ट करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: הַשְּׁאֵרִית הַנִּמְצָאָה
  choice: जो शेष लोग बचे पाए गए हैं
  rationale: ‘शेष’ की यशायाही प्रतिध्वनि तथा נמצאה के ‘पाए गए/विद्यमान’ भाव दोनों को बनाए रखता है।
- source_word: וְנָשָׂאתָ תְפִלָּה
  choice: इसलिए ... प्रार्थना करो
  rationale: शाब्दिक ‘प्रार्थना उठाओ’ की अपेक्षा आधुनिक हिन्दी में स्वाभाविक आग्रह; आरम्भिक ו को प्रसंगगत निष्कर्ष के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में विशिष्ट ईश्वरीय नाम है। ‘यहोवा’ हिन्दी पाठकों में स्थापित और पहचाना जाने वाला रूप है तथा इसे सामान्य उपाधि ‘प्रभु’ में नहीं बदलता।
- issue: הוכיח के ईश्वरीय प्रत्युत्तर का स्वरूप
  choice: उसे दण्डित करे
  alternative: उन बातों को झिड़के; उन बातों के लिए उससे हिसाब ले
  rationale: मूल क्रिया में झिड़कने, दोष सिद्ध करने और हिसाब लेने की अर्थ-सीमा है। प्रसंग में निन्दक के विरुद्ध न्यायिक प्रत्युत्तर अभिप्रेत है, पर विकल्प पादटिप्पणी में रखा गया है।
- issue: שְׁאֵרִית का अर्थ
  choice: शेष लोग
  alternative: बचे हुए लोग; उत्तरजीवी
  rationale: ‘शेष’ शब्द सामान्य जीवित-बचे लोगों और यशायाह में इसकी व्यापक धर्मवैज्ञानिक प्रतिध्वनि, दोनों को बिना अधिक व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। वाक्य की लम्बाई मूल के अनुरूप है, पर हिन्दी में संबंध स्पष्ट करने के लिए ‘उसके स्वामी अश्शूर के राजा’ और ‘उनके लिए उसे’ का प्रयोग किया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित हैं।
