base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/021.yaml
  text: 'Then Isaiah son of Amoz sent to Hezekiah[a], saying, “Thus says Yahweh[b], the God of Israel: Because you have prayed to me concerning Sennacherib king of Assyria,”'
translation:
  language: hi
  text: 'तब आमोस के पुत्र यशायाह ने हिजकिय्याह के पास यह संदेश भेजा[a]: “इस्राएल का परमेश्वर याहवे यों कहता है: तूने अश्शूर के राजा सन्हेरीब के विषय में मेरे पास जो प्रार्थना की है—[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “हिजकिय्याह के पास भेजा, यह कहते हुए।” इब्रानी में भेजी गई वस्तु स्पष्ट नहीं कही गई है; प्रसंग में वह संदेश है।'
    reason: implicit_object
  - marker: c
    text: इब्रानी उपवाक्य यहाँ अपूर्ण है और आगे आने वाले कथन में जारी रहता है। इसका अर्थ “क्योंकि तूने ... मेरे पास प्रार्थना की है” भी समझा जा सकता है।
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: यह संदेश भेजा
  rationale: क्रिया का मूल अर्थ ‘भेजा’ है और उसका कर्म इब्रानी में निहित है। प्रसंग में यशायाह द्वारा भेजे गए वचन का स्वाभाविक हिन्दी रूप ‘यह संदेश भेजा’ है।
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ
  choice: आमोस के पुत्र यशायाह
  rationale: पितृनाम-संबंध को स्पष्ट और हिन्दी की स्वाभाविक शब्दावली में रखा गया है।
- source_word: לֵאמֹר
  choice: 'यह संदेश ... :'
  rationale: संदेश या उद्धरण आरम्भ कराने वाले इब्रानी सूत्र को हिन्दी में द्विबिंदु के साथ स्वाभाविक रूप दिया गया है; उसका आशय ‘यह कहते हुए’ है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वक्ताओं का प्रचलित संदेश-सूत्र है। इब्रानी में पूर्ण क्रिया होने पर भी उद्धृत घोषणा के हिन्दी मुहावरे में वर्तमानकाल ‘कहता है’ स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम YHWH को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: इब्रानी संबंधवाचक रचना का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: אֲשֶׁר הִתְפַּלַּלְתָּ אֵלַי
  choice: तूने ... मुझसे जो प्रार्थना की है
  rationale: אֲשֶׁר को संबंधवाचक ‘जो’ से प्रस्तुत करने पर मूल की अपूर्ण और अगले वचन में जारी रहने वाली रचना सुरक्षित रहती है। הִתְפַּלַּלְתָּ का अर्थ यहाँ ‘प्रार्थना की’ है।
- source_word: אֶל סַנְחֵרִיב
  choice: सन्हेरीब के विषय में
  rationale: प्रार्थना की क्रिया के साथ אֶל यहाँ प्रार्थना के विषय को सूचित करता है। ‘के विरुद्ध’ कहना मूल से अधिक व्याख्यात्मक होता।
- source_word: מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा
  rationale: इब्रानी संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम YHWH है। ‘याहवे’ उसे उपाधि में बदले बिना निकट लिप्यंतरण देता है; पादटिप्पणी पाठक को इसकी पहचान बताती है।
- issue: אֲשֶׁר से आरम्भ होने वाले अपूर्ण उपवाक्य की रचना
  choice: ‘तूने ... जो प्रार्थना की है—’ के रूप में अपूर्णता बनाए रखना
  alternative: ‘क्योंकि तूने ... प्रार्थना की है’
  rationale: इब्रानी वाक्य इस पद में पूरा नहीं होता और आगे के ईश्वरीय कथन से जुड़ता है। ‘क्योंकि’ अर्थ को सुगम बनाता, पर समानांतर वृत्तांत के आधार पर कारण-संबंध को स्पष्ट करके मूल की वास्तविक वाक्यगत अस्पष्टता घटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘यों कहता है’ भविष्यद्वक्ताओं के संदेश-सूत्र की औपचारिकता बनाए रखता है। एकवचन ‘तू’ मूल के निकट है और परमेश्वर द्वारा राजा को सीधे संबोधित करने के प्रसंग में प्रयुक्त हुआ है। दीर्घ डैश वाक्य के अगले पद में जारी रहने को दिखाता है।
