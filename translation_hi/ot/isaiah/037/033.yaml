source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֶל מֶ֣לֶךְ אַשּׁ֔וּר לֹ֤א יָבוֹא֙ אֶל הָ/עִ֣יר הַ/זֹּ֔את וְ/לֹֽא יוֹרֶ֥ה שָׁ֖ם חֵ֑ץ וְ/לֹֽא יְקַדְּמֶ֣/נָּה מָגֵ֔ן וְ/לֹֽא יִשְׁפֹּ֥ךְ עֳלֶ֖י/הָ סֹלְלָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/033.yaml
  text: 'Therefore thus says Yahweh concerning the king of Assyria: He will not come into this city[a], or shoot an arrow there, or come before it with a shield[b], or heap up a siege ramp against it.'
translation:
  language: hi
  text: 'इसलिए याहवे अश्शूर के राजा के विषय में यों कहता है: “वह इस नगर में प्रवेश नहीं करेगा, न यहाँ एक भी तीर चलाएगा, न ढाल लेकर उसके सामने आएगा[a], और न उसके विरुद्ध घेराबंदी का टीला खड़ा करेगा[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ढाल लेकर उस पर चढ़ाई करेगा।” इब्रानी अभिव्यक्ति घेराबंदी में आक्रमण के लिए आगे बढ़ने का चित्र प्रस्तुत करती है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके विरुद्ध घेराबंदी का चढ़ाई-बाँध खड़ा करेगा।” इब्रानी में शाब्दिक भाव है, “उसके विरुद्ध घेराबंदी का टीला उँडेलेगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले कथन से निष्कर्ष और उसके आधार पर आने वाली दिव्य घोषणा का संबंध स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में लिप्यंतरित किया गया है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वाणी के संदेशवाहक-सूत्र का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: אֶל מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा के विषय में
  rationale: यहाँ אֶל उस व्यक्ति को सूचित करता है जिसके विषय में घोषणा है; आगे का कथन सीधे राजा को संबोधित करने के बजाय उसके बारे में तीसरे पुरुष में है।
- source_word: לֹא יָבוֹא אֶל הָעִיר הַזֹּאת
  choice: वह इस नगर में प्रवेश नहीं करेगा
  rationale: आने या भीतर पहुँचने की गति को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है; राजा आक्रमणकारी सेना का प्रतिनिधि है।
- source_word: וְלֹא יוֹרֶה שָׁם חֵץ
  choice: न यहाँ एक भी तीर चलाएगा
  rationale: ירה का हिफ़ील रूप तीर चलाने को सूचित करता है। 'एक भी' निषेध की प्रबलता को हिन्दी में स्वाभाविक बनाता है, जबकि שָׁם को 'यहाँ' से नगर के संदर्भ में रखा गया है।
- source_word: וְלֹא יְקַדְּמֶנָּה מָגֵן
  choice: न ढाल लेकर उसके सामने आएगा
  rationale: קדם के सामने आने या आगे बढ़कर सामना करने के चित्र को बचाता है और घेराबंदी के प्रसंग में अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: וְלֹא יִשְׁפֹּךְ עֳלֶיהָ סֹלְלָה
  choice: न उसके विरुद्ध घेराबंदी का बाँध बनाएगा
  rationale: שׁפך का शाब्दिक अर्थ 'उँडेलना' है, पर סֹלְלָה के साथ यह नगर पर चढ़ाई के लिए मिट्टी आदि का बाँध या रैंप खड़ा करने का मुहावरा है।
theological_decisions:
- issue: दिव्य नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम יְהוָה है। 'याहवे' उसका सीधा हिन्दी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण भविष्यद्वाणी-शैली। लगातार आए इब्रानी निषेधों को 'न ... न ... न ... और न' से बनाए रखा गया है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न अपने संबंधित पदबंधों से विस्थापित प्रतीत होते हैं; हिन्दी में [a] को ढाल वाले पदबंध और [b] को घेराबंदी के बाँध वाले पदबंध के बाद रखा गया है।
