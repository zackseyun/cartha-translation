  text: וְ/יָ֨סְפָ֜ה פְּלֵיטַ֧ת בֵּית יְהוּדָ֛ה הַ/נִּשְׁאָרָ֖ה שֹׁ֣רֶשׁ לְ/מָ֑טָּה וְ/עָשָׂ֥ה פְרִ֖י לְ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/031.yaml
  text: And the surviving remnant of the house of Judah will again take root downward and bear fruit upward[a].
translation:
  language: hi
  text: और यहूदा के घराने का जो बचा हुआ अवशेष है, वह फिर नीचे जड़ पकड़ेगा और ऊपर फल देगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदा के घराने का वह अवशेष जो बच निकला और शेष रह गया है।”
    reason: פְּלֵיטָה में संकट से बच निकलने का भाव भी हो सकता है, जबकि הַנִּשְׁאָרָה शेष रह जाने पर बल देता है।
lexical_decisions:
- source_word: וְיָסְפָה
  choice: फिर
  rationale: יסף यहाँ किसी काम के दोबारा या आगे जारी होने का भाव देता है; ‘फिर’ इसे स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: פְּלֵיטַת ... הַנִּשְׁאָרָה
  choice: बचा हुआ शेष भाग
  rationale: פְּלֵיטָה बच निकलने या विनाश से बचे रहने वालों को दर्शाता है, और הַנִּשְׁאָרָה उनके शेष रह जाने पर फिर बल देता है। हिन्दी में यह कुछ पुनरुक्तिपूर्ण होते हुए भी मूल के दोनों भावों को बनाए रखता है।
- source_word: בֵּית יְהוּדָה
  choice: यहूदा का घराना
  rationale: ‘घराना’ इस वाक्यांश के वंशगत और सामुदायिक अर्थ को सुरक्षित रखता है; इसे केवल ‘यहूदा’ कहने से वह रंग खो जाता।
- source_word: שֹׁרֶשׁ לְמָטָּה
  choice: नीचे की ओर जड़ पकड़ेगा
  rationale: मूल में संज्ञा ‘जड़’ क्रियात्मक रूप में प्रयुक्त है। ‘जड़ पकड़ना’ स्वाभाविक हिन्दी है और नीचे की दिशा वाले कृषि-रूपक को बनाए रखता है।
- source_word: וְעָשָׂה פְרִי לְמָעְלָה
  choice: ऊपर की ओर फल लाएगा
  rationale: ‘फल लाना’ हिन्दी का स्वाभाविक कृषि-प्रयोग है और नीचे जड़ पकड़ने के साथ मूल का ऊर्ध्व-दिशात्मक काव्यात्मक विरोध सुरक्षित रखता है।
theological_decisions:
- issue: पुनर्स्थापना का कृषि-रूपक
  choice: नीचे जड़ पकड़ने और ऊपर फल लाने की ठोस छवि को ज्यों का त्यों बनाए रखना
  alternative: भावार्थ में ‘दृढ़ता से स्थापित होगा और फलेगा-फूलेगा’ कहना
  rationale: इब्रानी पाठ यहूदा की नई स्थिरता और समृद्धि को कृषि की ठोस छवि से व्यक्त करता है। इसे अमूर्त व्याख्या में बदलने के बजाय मूल रूपक और उसके काव्यात्मक तनाव को सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बचा हुआ शेष भाग’ मूल की निकटवर्ती लगभग समानार्थी अभिव्यक्तियों को जानबूझकर बनाए रखता है; वैकल्पिक पद-रचना पादटिप्पणी में दी गई है।
