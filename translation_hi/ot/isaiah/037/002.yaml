base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/002.yaml
  text: Then he sent Eliakim[a], who was over the household, and Shebna the scribe, and the elders of the priests, covered with sackcloth, to Isaiah son of Amoz[b], the prophet.
translation:
  language: hi
  text: तब उसने एल्याकीम को, जो राजघराने का प्रभारी था, सचिव शेबना को और याजकों के पुरनियों को—इन सबको टाट ओढ़े हुए—आमोस के पुत्र यशायाह नबी के पास भेजा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: तब उसने ... भेजा
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक क्रम व्यक्त करता है।
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: राजघराने के अधिकारी
  rationale: यह राजकीय घराने का प्रभार सँभालने वाले अधिकारी की पदवी है। शाब्दिक ‘जो घराने के ऊपर था’ हिन्दी में अस्वाभाविक होता; चयन पद का आशय स्पष्ट करता है।
- source_word: הַסּוֹפֵר
  choice: सचिव
  rationale: इस राजकीय संदर्भ में סֹפֵר लेखक या मुंशी से बढ़कर प्रशासनिक सचिव की पदवी दर्शा सकता है; ‘सचिव’ सहज और संदर्भानुकूल है।
- source_word: זִקְנֵי הַכֹּהֲנִים
  choice: याजकों के पुरनियों
  rationale: सम्बन्धवाचक रचना को निकटता से रखते हुए वरिष्ठ या अगुआ याजकों का संकेत देता है, पर संस्था का स्वरूप आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: מִתְכַּסִּים בַּשַּׂקִּים
  choice: टाट ओढ़े हुए थे
  rationale: हित्पएल कृदन्त उनकी शोक और दीनता की अवस्था बताता है। ‘ओढ़े हुए’ ढके या वस्त्र पहने होने की छवि को स्वाभाविक हिन्दी में रखता है।
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: आमोस के पुत्र यशायाह नबी
  rationale: नाम, पितृनाम और मान्य पदवी को सीधे तथा स्वाभाविक हिन्दी क्रम में प्रस्तुत करता है।
