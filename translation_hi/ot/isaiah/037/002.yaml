translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘राजघराना’, ‘सचिव’, ‘याजक’, ‘पुरनिये’ और ‘टाट’ ऐतिहासिक-राजकीय तथा शोक-संबंधी संदर्भ को स्पष्ट रखते हैं। स्रोत की सहभागी बहुवचन रचना के अनुसार टाट ओढ़ने का वर्णन एल्याकीम, शेबना और याजकों के पुरनियों—पूरे भेजे गए दल—से संबंधित है।
