    issue: The directional sense of וַיַּעַל is absent.
    rationale: '''वह ... भवन में गया'' translates only ''he went'' and leaves out the source''s explicit ''went up.'''
  - severity: medium
    issue: The divine name is rendered 'यहोवा' rather than the audit-trail choice Yahweh.
    rationale: The English POB source policy explicitly renders יְהוָה as Yahweh. In Hindi, 'याहवे' is the corresponding transliteration; 'यहोवा' reflects a distinct traditional vocalization.
