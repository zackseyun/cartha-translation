  text: וַ/יִּקַּ֨ח חִזְקִיָּ֧הוּ אֶת הַ/סְּפָרִ֛ים מִ/יַּ֥ד הַ/מַּלְאָכִ֖ים וַ/יִּקְרָאֵ֑/הוּ וַ/יַּ֨עַל֙ בֵּ֣ית יְהוָ֔ה וַ/יִּפְרְשֵׂ֥/הוּ חִזְקִיָּ֖הוּ לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/014.yaml
  text: Then Hezekiah took the letters from the hand of the messengers and read them[b][a], and he went up to the house of Yahweh and spread them before Yahweh.
translation:
  language: hi
  text: तब हिजकिय्याह ने दूतों के हाथ से वे पत्र लिए और उन्हें पढ़ा। फिर वह याहवे के भवन में चढ़ गया और उसने उन्हें याहवे के सामने फैला दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “उसे पढ़ा” और “उसे फैला दिया” है; एकवचन प्रत्यय शायद इन पत्रों में निहित पूरे लिखित संदेश को सामूहिक रूप से सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְּפָרִים
  choice: वे पत्र
  rationale: सֵפֶר लिखित दस्तावेज़ को सूचित करता है; इस ऐतिहासिक प्रसंग में अश्शूरी राजा की ओर से आए लिखित संदेश के लिए ‘पत्र’ स्वाभाविक और स्पष्ट है।
- source_word: מִיַּד הַמַּלְאָכִים
  choice: दूतों के हाथ से
  rationale: यह इब्रानी मुहावरे के रूप और हस्तांतरण के भाव, दोनों को बनाए रखता है; यहाँ מַלְאָכִים मनुष्य-दूत हैं, स्वर्गदूत नहीं।
- source_word: וַיִּקְרָאֵהוּ
  choice: उन्हें पढ़ा
  rationale: क्रिया का अर्थ यहाँ लिखित सामग्री पढ़ना है। एकवचन प्रत्यय सामूहिक लिखित संदेश की ओर संकेत करता है, जबकि हिन्दी में बहुवचन ‘पत्र’ के साथ ‘उन्हें’ सहज है।
- source_word: וַיַּעַל בֵּית יְהוָה
  choice: वह यहोवा के भवन में गया
  rationale: עלה में ऊपर जाने का भाव है, पर आधुनिक हिन्दी में मंदिर जाने के लिए केवल ‘गया’ अधिक स्वाभाविक है; ‘यहोवा का भवन’ स्रोत के בֵּית יְהוָה को निकटता से दर्शाता है।
- source_word: וַיִּפְרְשֵׂהוּ
  choice: उन्हें ... फैला दिया
  rationale: פרשׂ का मूल भाव फैलाने का है। हिन्दी बहुवचन ‘उन्हें’ पत्रों से मेल खाता है, यद्यपि इब्रानी प्रत्यय एकवचन है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: यह स्रोत के ‘यहोवा के सम्मुख/उपस्थिति में’ भाव को सरल, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ चतुरक्षरीय व्यक्तिगत नाम को शीर्षक से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों के लिए परिचित लिप्यंतरण ‘यहोवा’ नाम को स्पष्ट रखता है और उसे ‘प्रभु’ जैसे पदनाम से प्रतिस्थापित नहीं करता।
- issue: एकवचन प्रत्यय और बहुवचन पत्र
  choice: मुख्य पाठ में ‘उन्हें’; पादटिप्पणी में एकवचन रूप की सूचना
  alternative: ‘उसे’ पढ़ा और ‘उसे’ फैला दिया
  rationale: הַסְּפָרִים बहुवचन है, पर दोनों क्रियाओं के प्रत्यय एकवचन हैं और संभवतः पत्रों में निहित सामूहिक लिखित संदेश को सूचित करते हैं। सहज हिन्दी के लिए बहुवचन रखा गया, जबकि वास्तविक व्याकरणिक तनाव पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, स्पष्ट और गरिमापूर्ण शैली। ‘दूतों के हाथ से’ स्रोत का मुहावरा बनाए रखता है। मुख्य पाठ में बहुवचन सर्वनाम स्वाभाविक हिन्दी के लिए है, और इब्रानी एकवचन पादटिप्पणी में दर्ज है।
