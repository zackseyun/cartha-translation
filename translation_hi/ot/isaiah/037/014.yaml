- from: तब हिजकिय्याह ने दूतों के हाथ से वे पत्र लिए और उन्हें पढ़ा। फिर वह यहोवा के भवन में गया और उसने उन्हें यहोवा के सामने फैला दिया।[a]
  to: तब हिजकिय्याह ने दूतों के हाथ से वे पत्र लिए और उन्हें पढ़ा। फिर वह याहवे के भवन में चढ़ गया और उसने उन्हें याहवे के सामने फैला दिया।[a]
  rationale: '''चढ़ गया'' restores the directional force of the Hebrew verb while retaining idiomatic Hindi in the context of going to Yahweh''s house. ''याहवे'' aligns the Hindi rendering of the Tetragrammaton with the required Yahweh policy. The plural pronouns remain natural with ''पत्र,'' while the footnote preserves the Hebrew singular suffixes and their likely collective reference.'
