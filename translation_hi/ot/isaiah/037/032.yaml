  edition: WLC
  text: כִּ֤י מִ/ירֽוּשָׁלִַ֨ם֙ תֵּצֵ֣א שְׁאֵרִ֔ית וּ/פְלֵיטָ֖ה מֵ/הַ֣ר צִיּ֑וֹן קִנְאַ֛ת יְהוָ֥ה צְבָא֖וֹת תַּֽעֲשֶׂה זֹּֽאת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/032.yaml
  text: For from Jerusalem a remnant will go out[a], and survivors from Mount Zion. The zeal of Yahweh of hosts will do this.
translation:
  language: hi
  text: 'क्योंकि यरूशलेम से बचे हुए लोग निकलेंगे,

    और सिय्योन पर्वत से बच निकलने वाले लोग निकलेंगे।

    सेनाओं के याहवे का उत्साह[a] यह सब पूरा करेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘ईर्ष्या’। इब्रानी शब्द का अर्थ ‘उत्साह’ या ‘ईर्ष्या’ दोनों हो सकता है; यहाँ यह अपनी प्रतिज्ञा पूरी करने के लिए याहवे की प्रबल वाचा-निष्ठा को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִירוּשָׁלִַם תֵּצֵא שְׁאֵרִית
  choice: यरूशलेम से बचे हुए लोग निकलेंगे
  rationale: מִן स्रोत को और יצא बाहर निकलने को दर्शाता है। שְׁאֵרִית सामूहिक अर्थ में न्याय के बाद बचे लोगों को सूचित करता है; हिन्दी में बहुवचन क्रिया स्वाभाविक है।
- source_word: וּפְלֵיטָה מֵהַר צִיּוֹן
  choice: और सिय्योन पर्वत से वे लोग जो बच निकले हैं
  rationale: פְלֵיטָה यहाँ समानांतर पद में अमूर्त ‘छुटकारा’ नहीं, बल्कि बच निकलने वाले लोगों का सामूहिक उल्लेख है।
- source_word: קִנְאַת
  choice: उत्साह
  rationale: इस संज्ञा में ‘उत्साह’ और ‘ईर्ष्या/जलन’ दोनों अर्थ संभव हैं। उद्धार के इस प्रसंग में परमेश्वर की प्रबल, सक्रिय प्रतिबद्धता को व्यक्त करने के लिए ‘उत्साह’ मुख्य पाठ में अधिक स्पष्ट है, जबकि दूसरा अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: याहवे नाम को शीर्षक से नहीं बदला गया है। צְבָאוֹת का व्यापक, पारंपरिक अर्थ ‘सेनाएँ’ रखा गया है।
- source_word: תַּעֲשֶׂה זֹּאת
  choice: यह पूरा करेगा
  rationale: शाब्दिक अर्थ ‘यह करेगा’ है, पर प्रतिज्ञा को कार्यान्वित करने के संदर्भ में ‘यह पूरा करेगा’ आधुनिक हिन्दी में स्वाभाविक है और दैवी सक्रियता को स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है; इसलिए उसे केवल उपाधि ‘प्रभु’ से नहीं बदला गया। ‘याहवे’ मूल नाम का निकट देवनागरी लिप्यंतरण है।
- issue: קִנְאַת का ईश्वर के संबंध में अर्थ
  choice: उत्साह
  alternative: ईर्ष्या या जलन
  rationale: शब्द की अर्थ-सीमा दोनों भावों को समेटती है। इस प्रसंग में प्रतिज्ञा पूरी करने की याहवे की प्रबल प्रतिबद्धता प्रमुख है, पर वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है ताकि मूल की अर्थगत तनावशीलता न मिटे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। काव्यात्मक समानांतरता को पंक्ति-विभाजन द्वारा उभारा गया है। ‘बचे हुए लोग’ और ‘जो बच निकले हैं’ निकटार्थी इब्रानी सामूहिक संज्ञाओं के भेद को यथासंभव बनाए रखते हैं।
