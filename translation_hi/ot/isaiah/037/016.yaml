source:
  edition: WLC
  text: יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֤י יִשְׂרָאֵל֙ יֹשֵׁ֣ב הַ/כְּרֻבִ֔ים אַתָּה ה֤וּא הָֽ/אֱלֹהִים֙ לְ/בַדְּ/ךָ֔ לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ אַתָּ֣ה עָשִׂ֔יתָ אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/016.yaml
  text: O Yahweh of hosts[a], God of Israel, enthroned above the cherubim, you alone are God over all the kingdoms of the earth. You made the heavens and the earth.
translation:
  language: hi
  text: हे सेनाओं के याहवे, इस्राएल के परमेश्वर, करूबों पर विराजमान[a], केवल तू ही पृथ्वी के सभी राज्यों के ऊपर परमेश्वर है। तूने आकाश और पृथ्वी को बनाया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “करूबों के बीच निवास करनेवाले,” अथवा “करूबों के ऊपर सिंहासन पर विराजमान।”
    reason: יֹשֵׁב הַכְּרֻבִים में करूबों के साथ स्थान-संबंध स्पष्ट करने वाला पूर्वसर्ग नहीं है; पदबंध निवास या सिंहासन पर विराजने की छवि दे सकता है।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के वाचा-संबंधी व्यक्तिगत नाम को उसके हिब्रू रूप के निकट लिप्यंतरित किया गया है, न कि उसे किसी उपाधि से बदला गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं के
  rationale: यह व्यापक पद स्वर्गीय सेनाओं और सामर्थ्यवान दलों की धारणा को बनाए रखता है; केवल मानवीय सेनाओं तक अर्थ को सीमित नहीं करता।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: संबंधसूचक हिब्रू पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: करूबों पर विराजमान
  rationale: יֹשֵׁב यहाँ राजकीय आसन और पवित्र उपस्थिति की छवि देता है। हिब्रू में स्थान-संबंधी पूर्वसर्ग स्पष्ट नहीं है, इसलिए अन्य संभावित अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: אַתָּה הוּא הָאֱלֹהִים לְבַדְּךָ
  choice: केवल तू ही ... परमेश्वर है
  rationale: सर्वनाम की प्रबलता और לְבַדְּךָ की अनन्यता, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: पृथ्वी के सभी राज्यों का परमेश्वर
  rationale: לְ के संबंधात्मक अर्थ को हिन्दी के ‘का’ से व्यक्त किया गया है; इससे सभी सांसारिक राज्यों पर परमेश्वर के अद्वितीय अधिकार का आशय बना रहता है।
- source_word: עָשִׂיתָ
  choice: बनाया
  rationale: यह עשה का सीधा अर्थ है; ‘सृजा’ कहने के बजाय मूल क्रिया ‘बनाना/करना’ का भेद सुरक्षित रखा गया है।
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: आकाश और पृथ्वी
  rationale: प्रचलित हिन्दी सृष्टि-सूत्र के रूप में हिब्रू के संपूर्ण जगत को सूचित करने वाले युग्म को स्पष्ट और सहज ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है और उपाधि में नहीं बदलता।
- issue: אַתָּה הוּא הָאֱלֹהִים לְבַדְּךָ में ईश्वर की अनन्यता
  choice: केवल तू ही ... परमेश्वर है
  alternative: तू अकेला ही परमेश्वर है; तू ही एकमात्र परमेश्वर है
  rationale: यह हिब्रू के जोरदार एकेश्वरवादी कथन को बनाए रखता है, पर उसे मूल से अधिक दार्शनिक रूप में विस्तृत नहीं करता।
- issue: करूबों के साथ परमेश्वर की स्थिति
  choice: करूबों पर विराजमान
  alternative: करूबों के बीच निवास करनेवाले; करूबों के ऊपर सिंहासन पर विराजमान
  rationale: राजकीय और मंदिर-संबंधी छवि को मुख्य पाठ में रखा गया है, जबकि हिब्रू में स्पष्ट स्थानसूचक पूर्वसर्ग न होने से उत्पन्न वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, गरिमापूर्ण और सहज शैली अपनाई गई है। परमेश्वर को सीधे संबोधित करने के लिए ‘तू’ रखा गया है, जो बाइबिलीय प्रार्थना की निकटता और एकवचन संबोधन दोनों को व्यक्त करता है।
