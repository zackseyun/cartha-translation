base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/007.yaml
  text: Behold[a], I am putting a spirit in him, so that he will hear a report and return to his own land[b], and I will cause him to fall by the sword in his own land.
translation:
  language: hi
  text: देखो, मैं उसके भीतर एक आत्मा[a] डालूँगा। वह एक समाचार[b] सुनेगा और अपने देश लौट जाएगा; और मैं उसे उसके देश में तलवार से गिरा दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक भीतरी प्रेरणा” अथवा “प्रवृत्ति।” हिब्रू רוּחַ का अर्थ आत्मा, भीतरी आवेग या मनोवृत्ति हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “खबर,” “सूचना” अथवा “अफवाह।” हिब्रू שְׁמוּעָה से यह निश्चित नहीं होता कि मिली हुई सूचना की पुष्टि हुई थी या नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: देख, मैं
  rationale: यह भविष्यसूचक वाणी में ध्यान आकर्षित करने वाले हिब्रू पद का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: נוֹתֵן
  choice: डालने वाला हूँ
  rationale: הִנְנִי के बाद आया कृदन्त निकट या सुनिश्चित होने वाली क्रिया दर्शाता है; यह रूप उस भाव को बनाए रखता है।
- source_word: בּוֹ רוּחַ
  choice: उसके भीतर एक आत्मा
