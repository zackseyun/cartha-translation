- source_word: שְׁמוּעָה
  choice: एक समाचार
  rationale: यह प्राप्त सूचना का तटस्थ रूप है और उसके सत्यापित समाचार या केवल अफवाह होने का निर्णय नहीं करता।
- source_word: וְשָׁב אֶל אַרְצוֹ
  choice: और अपने देश लौट जाएगा
  rationale: यह שׁוּב के लौटने के अर्थ और संबंधवाचक प्रत्यय, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהִפַּלְתִּיו בַּחֶרֶב
  choice: तब मैं उसे ... तलवार से मरवा दूँगा
  rationale: हिफ़ील रूप की कारणवाचकता और ‘तलवार से गिरना’ मुहावरे के हिंसक मृत्यु-संबंधी अर्थ को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּאַרְצוֹ
  choice: उसी के देश में
  rationale: ‘उसी’ हिब्रू में दोहराए गए ‘उसके देश’ पर बल देता है और उसके लौटने तथा वहीं मारे जाने के संबंध को स्पष्ट रखता है।
theological_decisions:
- issue: अश्शूरी राजा के विषय में प्रतिज्ञा में רוּחַ का अर्थ
  choice: परमेश्वर द्वारा उसके भीतर डाली गई ‘एक आत्मा’
  alternative: एक भीतरी प्रेरणा, प्रवृत्ति या मनोदशा; अथवा हवा
  rationale: संदर्भ में परमेश्वर राजा की प्रतिक्रिया को दिशा देता है, पर पाठ इस प्रभाव की सटीक प्रकृति नहीं बताता। ‘आत्मा’ मूल शब्द की धार्मिक और अर्थगत व्यापकता तथा दैवी कर्तृत्व को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- issue: וְהִפַּלְתִּיו בַּחֶרֶב में दैवी कारणवाचकता
  choice: मैं उसे तलवार से मरवा दूँगा
  alternative: मैं उसे तलवार से गिरा दूँगा
  rationale: चुना हुआ रूप परमेश्वर के कारणवाचक कर्तृत्व और तलवार द्वारा मृत्यु के हिब्रू मुहावरे को स्वाभाविक हिन्दी में रखता है, बिना यह बताए कि मानवीय कर्ता कौन होगा।
