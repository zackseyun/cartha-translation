  register: भाषा आधुनिक मानक हिन्दी में, साधारण पाठक के लिए स्पष्ट किंतु भविष्यसूचक वाणी के अनुरूप गरिमापूर्ण रखी गई है। ‘देख’ ध्यानाकर्षक आरम्भ को बनाए रखता है। फुटनोट चिह्न मूल शब्दों के वास्तविक स्थानों—‘आत्मा’ और ‘समाचार’—पर लगाए गए हैं।
