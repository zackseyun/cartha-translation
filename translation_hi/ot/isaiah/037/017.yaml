  text: הַטֵּ֨ה יְהוָ֤ה אָזְנְ/ךָ֙ וּֽ/שְׁמָ֔ע פְּקַ֧ח יְהוָ֛ה עֵינֶ֖/ךָ וּ/רְאֵ֑ה וּ/שְׁמַ֗ע אֵ֚ת כָּל דִּבְרֵ֣י סַנְחֵרִ֔יב אֲשֶׁ֣ר שָׁלַ֔ח לְ/חָרֵ֖ף אֱלֹהִ֥ים חָֽי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/017.yaml
  text: Incline your ear, O LORD, and hear; open your eyes, O LORD, and see; and hear all the words of Sennacherib, which he has sent to mock the living God.
translation:
  language: hi
  text: हे यहोवा, अपना कान झुकाकर सुन; हे यहोवा, अपनी आँखें खोलकर देख; और सनहेरीब की वे सारी बातें सुन, जो उसने जीवित परमेश्वर का अपमान करने के लिए भेजी हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַטֵּה ... אָזְנְךָ
  choice: अपना कान लगा
  rationale: इब्रानी मुहावरे ‘कान झुकाने’ का स्वाभाविक हिन्दी रूप, जो ध्यान देकर सुनने की विनती व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को हिन्दी बाइबलीय परंपरा में व्यापक रूप से पहचाने जाने वाले रूप में प्रस्तुत किया गया है।
- source_word: דִּבְרֵי
  choice: बातें
  rationale: संदर्भ में भेजे गए संदेश/कथनों के लिए सहज हिन्दी; बहुवचन और व्यापक अर्थ सुरक्षित हैं।
- source_word: סַנְחֵרִיב
  choice: सनहेरीब
  rationale: अश्शूरी राजा के नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: לְחָרֵף
  choice: अपमान करने के लिए
  rationale: मूल क्रिया में निंदा, तिरस्कार और चुनौती देने का भाव है; ‘अपमान करना’ लक्ष्य को स्पष्ट रखते हुए किसी अतिरिक्त doctrinal अर्थ को नहीं जोड़ता।
- source_word: אֱלֹהִים חָי
  choice: जीवित परमेश्वर
  rationale: मूल विशेषण-संज्ञा वाक्यांश का सीधा और प्रतिष्ठित हिन्दी रूप।
theological_decisions:
- issue: יְהוָה का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में सामान्य उपाधि नहीं, ईश्वर का व्यक्तिगत नाम है; इसलिए नाम को बनाए रखा गया है।
- issue: לְחָרֵף की अर्थ-सीमा
  choice: अपमान करने के लिए
  alternative: ठट्ठा करने के लिए / निंदा करने के लिए
  rationale: यह चयन विरोधी वचनों की तिरस्कारपूर्ण और अनादरकारी प्रकृति को समेटता है, पर उन्हें केवल हास्य या केवल औपचारिक ईशनिंदा तक सीमित नहीं करता।
translation_notes:
  register: प्रार्थनात्मक, गरिमापूर्ण और आधुनिक मानक हिन्दी। मूल के समानांतर आग्रह—कान लगाकर सुनना, आँखें खोलकर देखना, और बातें सुनना—को बनाए रखा गया है। एकवचन संबोधन और आज्ञार्थक क्रियाएँ मूल के अनुरूप हैं।
