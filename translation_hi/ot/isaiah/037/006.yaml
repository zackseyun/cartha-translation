base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/006.yaml
  text: 'And Isaiah said to them[a], “Thus you shall say to your master: Thus says Yahweh, ‘Do not be afraid because of the words that you have heard, with which the servants of the king of Assyria have blasphemed me.’”'
translation:
  language: hi
  text: 'तब यशायाह ने उनसे कहा, “अपने स्वामी से यह कहना: ‘याहवे यों कहते हैं: जो बातें तुमने सुनी हैं, जिनके द्वारा अश्शूर के राजा के सेवकों ने मेरी निन्दा[a] की है, उनसे मत डरना।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा अपमान किया है” अथवा “मुझे ललकारा है।” इब्रानी क्रिया परमेश्वर के विरुद्ध अपमानजनक या तिरस्कारपूर्ण वाणी को व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם יְשַׁעְיָהוּ
  choice: तब यशायाह ने उनसे कहा
  rationale: वय्यिक्तोल के कथात्मक क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और सम्बोधन ‘उनसे’ को स्पष्ट रखता है।
- source_word: כֹּה תֹאמְרוּן אֶל אֲדֹנֵיכֶם
  choice: अपने स्वामी से यह कहना
  rationale: बहुवचन दूतों को दिए गए निर्देश और उनके मानवीय अधिपति हिजकिय्याह—दोनों को स्पष्ट करता है; ‘स्वामी’ यहाँ परमेश्वर की उपाधि नहीं है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यह कहते हैं
  rationale: भविष्यद्वक्ताओं के सन्देश-सूत्र को स्वाभाविक हिन्दी में रखते हुए יהוה के व्यक्तिगत वाचा-नाम को लिप्यन्तरित करता है।
- source_word: אַל תִּירָא מִפְּנֵי הַדְּבָרִים
  choice: जो बातें … उनसे मत डरना
  rationale: एकवचन निषेध को सुरक्षित रखता है और מִפְּנֵי को भय के कारण के रूप में सहज हिन्दी में व्यक्त करता है।
- source_word: נַעֲרֵי מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा के सेवकों
  rationale: נַעַר का सन्दर्भगत अर्थ यहाँ राजकीय अधीनस्थ या सेवक है; ‘सेवक’ उनकी भूमिका को बिना अनावश्यक आयु-सूचना जोड़े व्यक्त करता है।
- source_word: גִּדְּפוּ אֹתִי
  choice: मेरी निन्दा की है
  rationale: परमेश्वर के विरुद्ध अपमानजनक और तिरस्कारपूर्ण वाणी की गम्भीरता को सामान्य पाठकों के लिए स्पष्ट रखता है; व्यापक अर्थ-क्षेत्र पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे किसी सामान्य उपाधि में बदले बिना प्रस्तुत करता है।
- issue: परमेश्वर के प्रति גִּדְּפוּ का भाव
  choice: मेरी निन्दा की है
  alternative: मेरा अपमान किया है; मुझे ललकारा है
  rationale: यह क्रिया परमेश्वर के विरुद्ध तिरस्कारपूर्ण, अपमानजनक वाणी को दर्शाती है। ‘निन्दा’ धार्मिक गम्भीरता बनाए रखती है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं ताकि मूल की अर्थ-व्याप्ति संकुचित न हो।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में बोधगम्य रखी गई है। उद्धरण के भीतर एकवचन ‘तुमने/मत डरना’ हिजकिय्याह को सम्बोधित है, जबकि बाहर का निर्देश बहुवचन दूतों को दिया गया है।
