base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/030.yaml
  text: 'And this will be the sign for you: this year eat what grows by itself[a], and in the second year what springs from that; but in the third year sow and reap, and plant vineyards and eat their fruit.'
translation:
  language: hi
  text: 'और तुम्हारे लिए यह चिन्ह होगा: इस वर्ष अपने आप उगी उपज खाओ, और दूसरे वर्ष उससे फिर उगी उपज[a]; लेकिन तीसरे वर्ष बीज बोओ और फसल काटो, दाख की बारियाँ लगाओ और उनके फल खाओ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दूसरी बार अपने आप उगी उपज” अथवा “पिछली उपज के बाद फिर उगी फसल।” इब्रानी शब्द दुर्लभ है और सम्भवतः बिना सामान्य बुआई के उगने वाली दूसरे वर्ष की उपज को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה לְּךָ הָאוֹת
  choice: और तुम्हारे लिए यह चिन्ह होगा
  rationale: इब्रानी का निश्चित पद הָאוֹת ‘यह चिन्ह’ के अर्थ का समर्थन करता है। क्रियारहित वाक्यांश को प्रसंगानुसार स्वाभाविक हिन्दी भविष्यकाल में व्यक्त किया गया है।
- source_word: סָפִיחַ
  choice: अपने आप उगी उपज
  rationale: यह उस उपज को सूचित करता है जो सामान्य बुआई के बिना स्वयं उग आती है; यह अभिव्यक्ति आधुनिक हिन्दी में स्पष्ट और कृषि-संदर्भ के अनुकूल है।
- source_word: שָׁחִיס
  choice: उससे फिर उगी उपज
  rationale: यह दुर्लभ कृषि-शब्द सम्भवतः दूसरे वर्ष पिछली स्वतः उगी फसल से निकलने वाली उपज को सूचित करता है। ‘उससे फिर उगी’ इस सम्भावित सम्बन्ध को स्पष्ट रखते हुए अत्यधिक तकनीकी भाषा से बचता है।
- source_word: זִרְעוּ וְקִצְרוּ
  choice: बीज बोओ और फसल काटो
  rationale: इब्रानी के बोने-काटने के समानांतर कृषि-युग्म को स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: וְנִטְעוּ כְרָמִים
  choice: दाख की बारियाँ लगाओ
  rationale: כְרָמִים के लिए ‘दाख की बारियाँ’ सटीक, प्रचलित और सामान्य पाठक के लिए बोधगम्य कृषि-पद है।
- source_word: וְאִכְלוּ פִרְיָם
  choice: और उनके फल खाओ
  rationale: बहुवचन प्रत्यय को दाख की बारियों से सम्बद्ध रखते हुए खंड का सीधा अनुवाद किया गया है।
