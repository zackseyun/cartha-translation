id: ISA.34.12
reference: Isaiah 34:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: חֹרֶ֥י/הָ וְ/אֵֽין שָׁ֖ם מְלוּכָ֣ה יִקְרָ֑אוּ וְ/כָל שָׂרֶ֖י/הָ יִ֥הְיוּ אָֽפֶס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/012.yaml
  text: They will call its nobles[a], but there will be no kingdom there, and all its princes will be nothing.
translation:
  language: hi
  text: वे उसके कुलीनों को पुकारेंगे[a], पर वहाँ कोई राजसत्ता न होगी, और उसके सभी हाकिम मिट जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके कुलीन पुकारेंगे, पर वहाँ कोई राजसत्ता न होगी।” पहले खंड का इब्रानी वाक्य-विन्यास कठिन है।
    reason: alternative_reading
lexical_decisions:
- source_word: חֹרֶיהָ
  choice: उसके कुलीनों को
  rationale: חֹר यहाँ स्वतंत्र-जन्मे अभिजात या कुलीन लोगों को सूचित करता है। अगले खंड के ‘हाकिमों’ के साथ इसका सामाजिक-राजनीतिक अर्थ उपयुक्त है; ‘को’ कठिन इब्रानी वाक्य-विन्यास की एक सम्भावित समझ को व्यक्त करता है।
- source_word: וְאֵין שָׁם מְלוּכָה
  choice: पर वहाँ कोई राजसत्ता न होगी
  rationale: מְלוּכָה राजकीय शासन, राजत्व या राज्य को सूचित कर सकता है। ‘राजसत्ता’ राजनीतिक शासन के अभाव पर बल देता है और किसी भूभाग के लुप्त होने का अनावश्यक अर्थ नहीं जोड़ता। संदर्भ में וְ को विरोधसूचक ‘पर’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִקְרָאוּ
  choice: वे ... पुकारेंगे
  rationale: קרא का सामान्य अर्थ ‘पुकारना/बुलाना’ है। कठिन वाक्य-विन्यास को ध्यान में रखते हुए मूल क्रिया का व्यापक अर्थ रखा गया है, न कि किसी विशिष्ट राजनीतिक प्रक्रिया को निश्चित किया गया है।
- source_word: וְכָל שָׂרֶיהָ
  choice: और उसके सभी हाकिम
  rationale: שַׂר शासक, अधिकारी या प्रधान को सूचित करता है। ‘हाकिम’ सामान्य आधुनिक हिन्दी में राजनीतिक अधिकार रखने वालों को दर्शाता है और ‘कुलीनों’ के समानांतर उपयुक्त है।
- source_word: יִהְיוּ אָפֶס
  choice: मिट जाएँगे
  rationale: शाब्दिक भाव ‘कुछ न रहेंगे/अस्तित्वहीन हो जाएँगे’ है। ‘मिट जाएँगे’ स्वाभाविक हिन्दी में उनके पूर्ण अंत को व्यक्त करता है, बिना यह कहे कि वे नैतिक दृष्टि से मूल्यहीन होंगे।
theological_decisions:
- issue: पहले खंड का कठिन वाक्य-विन्यास
  choice: ‘वे उसके कुलीनों को पुकारेंगे’—חֹרֶיהָ को क्रिया का कर्म माना गया है।
  alternative: ‘उसके कुलीन पुकारेंगे’; अथवा कुलीनों और राजसत्ता को एक संक्षिप्त, टूटी हुई अभिव्यक्ति के रूप में जोड़ना।
  rationale: इब्रानी शब्दक्रम और प्रत्ययों के कारण वाक्य अस्पष्ट है। मुख्य पाठ एक व्याकरण-सम्मत सम्भावना देता है, जबकि पादटिप्पणी वास्तविक वैकल्पिक पठन को सुरक्षित रखती है; किसी विशेष राजकीय नियुक्ति या घोषणा की प्रक्रिया नहीं जोड़ी गई।
- issue: מְלוּכָה का आशय
  choice: राजसत्ता
  alternative: राज्य; राजत्व
  rationale: संदर्भ एदोम की राजनीतिक व्यवस्था और शासक वर्ग के विनाश का है। ‘राजसत्ता’ शासन के अभाव को स्पष्ट करती है, जबकि मूल के व्यापक राजकीय भाव को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘कुलीन’, ‘राजसत्ता’ और ‘हाकिम’ न्याय-वाणी के राजनीतिक स्वर को बनाए रखते हैं; कठिन पहले खंड की अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
