- source_word: לִשְׁמֹעַ
  choice: सुनने के लिए
  rationale: आज्ञा के बाद प्रयोजन बताने वाले infinitive को स्पष्ट रखता है और आगे आने वाले שמע से शब्दगत संबंध भी बनाए रखता है।
- source_word: לְאֻמִּים
  choice: जनसमूहो
  rationale: גוֹיִם के निकटार्थी शब्द को अलग हिन्दी पद देकर काव्यात्मक समानांतरता सुरक्षित रखी गई है।
- source_word: הַקְשִׁיבוּ
  choice: ध्यान दो
  rationale: Hiphil आज्ञार्थक का अर्थ सावधानी से कान लगाना या ध्यान देना है; यह ‘सुनने’ के साथ अर्थपूर्ण समानांतर बनाता है।
- source_word: תִּשְׁמַע
  choice: वह सुने … सुने
  rationale: स्त्रीलिंग एकवचन अपूर्ण क्रिया के आज्ञासूचक भाव को हिन्दी में ‘सुने’ से व्यक्त किया गया है; दूसरी समानांतर पंक्ति में क्रिया दोहराने से हिन्दी वाक्य स्पष्ट रहता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: ‘जगत’ और सार्वभौमिक संबोधन के कारण यहाँ स्थानीय ‘देश’ के बजाय पूरी पृथ्वी अभिप्रेत है।
- source_word: מְלֹאָהּ
  choice: जो कुछ उसमें है
  rationale: शाब्दिक ‘उसकी भरपूरी’ की अपेक्षा यह आधुनिक हिन्दी में सहज है और पृथ्वी में समाई हर वस्तु का व्यापक अर्थ देता है।
- source_word: תֵּבֵל
  choice: जगत
  rationale: बसाए और व्यवस्थित संसार के अर्थ को संक्षिप्त, काव्यात्मक हिन्दी में व्यक्त करता है।
- source_word: כָל צֶאֱצָאֶיהָ
  choice: उससे उत्पन्न सब कुछ
  rationale: צאצאים की ‘जो बाहर निकले/उत्पन्न हो’ वाली जनन-छवि बचाता है और अर्थ को केवल मनुष्य-संतान या केवल कृषि-उपज तक सीमित नहीं करता।
