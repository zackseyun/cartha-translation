  yaml_path: translation/ot/isaiah/034/001.yaml
  text: Come near[a], nations, to hear; and listen, peoples. Let the earth hear, and all that fills it[b], the world and all its offspring.
translation:
  language: hi
  text: हे राष्ट्रो, सुनने के लिए निकट आओ[a]; हे जनसमूहो, ध्यान दो। पृथ्वी सुने, और जो कुछ उसमें है वह भी; जगत सुने, और उससे उत्पन्न सब कुछ भी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे राष्ट्रो, सुनने के लिए पास आओ; हे जनसमूहो, कान लगाओ।”
    reason: lexical_alternative
  - marker: b
    text: “उससे उत्पन्न सब कुछ” का अनुवाद “उसकी सारी संतान” या “उसकी सारी उपज” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
