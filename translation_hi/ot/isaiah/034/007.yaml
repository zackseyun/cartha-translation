base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/007.yaml
  text: Wild oxen will fall with them[a], and young bulls with the mighty ones; their land will be drenched with blood[b], and their dust made rich with fat.
translation:
  language: hi
  text: जंगली साँड़ भी उनके साथ गिर पड़ेंगे[a], और जवान बैल भी बलवानों[b] के साथ; उनकी भूमि लहू से तर हो जाएगी, और उनकी धूल चरबी से समृद्ध हो जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘जंगली साँड़’ के स्थान पर किसी अन्य शक्तिशाली जंगली गोवंशी पशु का नाम भी संभव है; इब्रानी רְאֵמִים की ठीक प्रजाति निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: ‘बलवानों’ शक्तिशाली योद्धाओं को, अथवा इस काव्यात्मक पशु-बिंब में बलवान बैलों को सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָרְדוּ
  choice: गिर पड़ेंगे
  rationale: मूल अर्थ ‘नीचे उतरना’ है, पर न्याय और वध के इस प्रसंग में ‘गिर पड़ेंगे’ मारे जाने का स्वाभाविक भाव व्यक्त करता है।
- source_word: רְאֵמִים
  choice: जंगली साँड़
  rationale: यह किसी शक्तिशाली जंगली गोवंशी पशु का नाम है, किंतु उसकी ठीक प्रजाति अनिश्चित है; ‘जंगली साँड़’ शक्ति और पशु-संबंधी बिंब दोनों बनाए रखता है।
- source_word: עִמָּם
  choice: उनके साथ
  rationale: सर्वनाम के पूर्वपद को अनावश्यक रूप से निश्चित किए बिना मूल की संदर्भगत खुलावट बनाए रखता है।
- source_word: וּפָרִים
  choice: जवान बैल
  rationale: פָּר प्रायः बैल, विशेषकर जवान बैल, को दर्शाता है और वध/बलिदान के बिंब में स्वाभाविक है।
- source_word: אַבִּירִים
  choice: बलवानों
  rationale: यह शब्द शक्तिशाली मनुष्यों अथवा बलवान पशुओं की ओर संकेत कर सकता है; ‘बलवानों’ दोनों संभावनाओं को खुला रखता है।
- source_word: וְרִוְּתָה
  choice: तर हो जाएगी
  rationale: क्रिया तृप्त होने या पूरी तरह भीगने का भाव रखती है; भूमि और लहू के साथ ‘तर हो जाएगी’ सजीव और स्वाभाविक है।
- source_word: אַרְצָם
  choice: उनकी भूमि
  rationale: न्याय के अधीन लोगों के भूभाग के लिए सीधा और गरिमापूर्ण हिन्दी रूप।
- source_word: מִדָּם
  choice: लहू से
  rationale: संतृप्ति की क्रिया के साथ हिन्दी में ‘से’ स्वाभाविक साधन/पदार्थ संबंध व्यक्त करता है।
- source_word: וַעֲפָרָם
  choice: उनकी धूल
  rationale: ‘धूल’ मूल के ठोस काव्यात्मक बिंब और न्याय/मृत्यु की प्रतिध्वनि को सुरक्षित रखती है।
- source_word: מֵחֵלֶב
  choice: चरबी से
  rationale: वध किए गए पशुओं या लोगों की चरबी के तीखे बलिदानी-वध बिंब को स्पष्ट रखता है।
- source_word: יְדֻשָּׁן
  choice: उपजाऊ हो जाएगी
  rationale: क्रिया का अर्थ मोटा, समृद्ध या पुष्ट होना है; धूल के विषय में ‘उपजाऊ’ होना चरबी से समृद्ध किए जाने का स्वाभाविक हिन्दी चित्र देता है।
theological_decisions:
- issue: पशु-बिंब का रूपकात्मक या शाब्दिक बल
  choice: मुख्य पाठ में पशु-संबंधी शब्दों को बनाए रखते हुए ‘बलवानों’ को मनुष्यों और शक्तिशाली पशुओं—दोनों की संभावित ओर संकेत करने दिया गया है।
  alternative: सभी पशु-शब्दों को केवल शाब्दिक बलिदानी पशु या केवल मानवीय शासकों के रूपक के रूप में पढ़ना।
  rationale: अध्याय में बलिदान और युद्ध के बिंब परस्पर जुड़े हैं; अनुवाद किसी एक अर्थ को थोपने के बजाय इस काव्यात्मक और धर्मवैचारिक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक, गंभीर और सहज बोधगम्य शैली। ‘लहू’, ‘तर’ और ‘धूल’ मूल के तीखे न्याय-बिंब को बनाए रखते हैं। पादटिप्पणी [b] का चिह्न वाक्यांत में रखा गया है क्योंकि वह पद के भीतर ‘बलवानों’ की अर्थगत अस्पष्टता समझाती है।
