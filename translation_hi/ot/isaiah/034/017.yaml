  text: וְ/הֽוּא הִפִּ֤יל לָ/הֶן֙ גּוֹרָ֔ל וְ/יָד֛/וֹ חִלְּקַ֥תָּ/ה לָ/הֶ֖ם בַּ/קָּ֑ו עַד עוֹלָם֙ יִֽירָשׁ֔וּ/הָ לְ/ד֥וֹר וָ/ד֖וֹר יִשְׁכְּנוּ בָֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/017.yaml
  text: And he himself has cast the lot for them[a], and his hand has apportioned it to them by line; they will possess it forever[b]; from generation to generation they will dwell in it.
translation:
  language: hi
  text: 'और उसी ने उनके लिए चिट्ठी डाली है,


    और उसके हाथ ने नापने की डोरी से[a] उसे उनके लिए बाँट दिया है;


    वे उसे सदा के लिए अपने अधिकार में रखेंगे[b];


    पीढ़ी-दर-पीढ़ी वे उसमें बसे रहेंगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रेखा से।”
    reason: lexical_alternative
  - marker: b
    text: या, “उसे विरासत में पाएँगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: और उसी ने
  rationale: स्वतंत्र सर्वनाम का बल बनाए रखते हुए परमेश्वर की स्वयं की निर्णायक कार्रवाई को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הִפִּיל ... גּוֹרָל
  choice: चिट्ठी डाली है
  rationale: यह भूमि अथवा भाग निर्धारित करने के लिए चिट्ठी डालने का प्रचलित इब्रानी मुहावरा है; पूर्ण कार्रवाई और उसके बने हुए परिणाम के लिए हिन्दी पूर्णकाल उपयुक्त है।
- source_word: לָהֶן
  choice: उनके लिए
  rationale: स्त्रीलिंग बहुवचन सर्वनाम पिछले प्रसंग में वर्णित जीवों की ओर संकेत करता है; हिन्दी में लिंग व्यक्त किए बिना मूल का सर्वनाम बनाए रखा गया है।
- source_word: וְיָדוֹ
  choice: और उसके हाथ ने
  rationale: परमेश्वर की सक्रिय सामर्थ्य और प्रत्यक्ष कार्य को दर्शाने वाला मानवीय बिंब सुरक्षित रखा गया है।
- source_word: חִלְּקַתָּה לָהֶם
  choice: उसे उनके लिए बाँट दिया है
  rationale: חלק यहाँ नापकर क्षेत्र आवंटित करने का भाव रखता है; स्त्रीलिंग एकवचन कर्म-प्रत्यय को हिन्दी के स्वाभाविक ‘उसे’ से बनाए रखा गया है।
- source_word: בַּקָּו
  choice: रेखा से
  rationale: קָו भूमि नापने और सीमा निर्धारित करने की डोरी या रेखा है। संक्षिप्त मुख्य पाठ आवंटन की छवि रखता है और स्पष्टतर विकल्प पादटिप्पणी में दिया गया है।
- source_word: עַד עוֹלָם
  choice: सदा के लिए
  rationale: स्थायी और निरंतर अधिकार का भाव आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त होता है।
- source_word: יִירָשׁוּהָ
  choice: उस पर अधिकार रखेंगे
  rationale: ירשׁ यहाँ आवंटित भूमि को अपने अधिकार में रखने का अर्थ देता है; ‘विरासत में पाएँगे’ भी संभव है और पादटिप्पणी में सुरक्षित है।
- source_word: לְדוֹר וָדוֹר
  choice: पीढ़ी-दर-पीढ़ी
  rationale: इब्रानी वितरणात्मक पदबंध का स्वाभाविक और परिचित हिन्दी रूप है।
- source_word: יִשְׁכְּנוּ בָהּ
  choice: वे उसमें बसे रहेंगे
  rationale: שׁכן के बसने और निरंतर निवास करने—दोनों भावों को ‘बसे रहेंगे’ स्पष्ट और सहज ढंग से व्यक्त करता है।
theological_decisions:
- issue: आवंटन-वर्णन में बहुवचन सर्वनामों का संदर्भ
  choice: सर्वनामों को यथावत रखा गया है; निकटवर्ती प्रसंग के अनुसार वे उजड़े हुए देश में बसने वाले जंगली जीवों की ओर संकेत करते हैं।
  alternative: सर्वनामों को किसी व्यापक, अनिर्दिष्ट उजाड़-प्रदेश के निवासियों के लिए समझा जा सकता है।
  rationale: यशायाह 34:11, 13–15 में मरुभूमि के पशु-पक्षियों का उल्लेख इस संदर्भ को सबसे स्वाभाविक बनाता है। फिर भी मूल पद में जीवों के नाम दोहराए नहीं गए हैं, इसलिए अनुवाद भी उन्हें जोड़कर अस्पष्टता को समाप्त नहीं करता।
- issue: יִירָשׁוּהָ में अधिकार अथवा विरासत का भाव
  choice: मुख्य पाठ में ‘उस पर अधिकार रखेंगे’
  alternative: ‘उसे विरासत में पाएँगे’
  rationale: भूमि को चिट्ठी और नाप की रेखा द्वारा बाँटने के संदर्भ में वास्तविक कब्ज़ा और स्थायी अधिकार प्रमुख है, पर ירשׁ में विरासत का अर्थ भी संभव है; इसलिए वह पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक पंक्ति-विन्यास रखा गया है। ‘चिट्ठी डालना’, ‘रेखा’, ‘अधिकार’ और ‘पीढ़ी-दर-पीढ़ी’ आवंटन तथा स्थायित्व के मूल बिंबों को सामान्य पाठक के लिए समझने योग्य रखते हैं। परमेश्वर का नाम मूल पद में प्रत्यक्ष नहीं जोड़ा गया; ‘उसी ने’ स्वतंत्र इब्रानी सर्वनाम का बल सुरक्षित रखता है।
