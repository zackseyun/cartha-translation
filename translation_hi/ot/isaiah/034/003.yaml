source:
  edition: WLC
  text: וְ/חַלְלֵי/הֶ֣ם יֻשְׁלָ֔כוּ וּ/פִגְרֵי/הֶ֖ם יַעֲלֶ֣ה בָאְשָׁ֑/ם וְ/נָמַ֥סּוּ הָרִ֖ים מִ/דָּמָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/003.yaml
  text: Their slain will be thrown out[a], and the stench of their corpses will rise[c][b]; the mountains will melt from their blood.
translation:
  language: hi
  text: उनके मारे गए लोग बाहर फेंक दिए जाएँगे[a], और उनकी लाशों की दुर्गंध उठेगी[b]; उनके लहू से पहाड़ पिघल जाएँगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बाहर डाल दिए जाएँगे।’ इब्रानी क्रिया का अर्थ ‘फेंकना’ या ‘बाहर डाल देना’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उनकी बदबू ऊपर उठेगी।’
    reason: lexical_alternative
  - marker: c
    text: 'यह न्याय की भविष्यद्वाणी की अतिशयोक्तिपूर्ण छवि है: रक्तपात इतना विशाल दिखाया गया है कि पहाड़ तक उनके लहू से ‘पिघल’ जाते हैं।'
    reason: cultural_note
lexical_decisions:
- source_word: חַלְלֵיהֶם
  choice: उनके मारे गए लोग
  rationale: यह संज्ञा युद्ध में मारे या बेधे गए लोगों को दर्शाती है। यह चयन न्याय और युद्ध के प्रसंग को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יֻשְׁלָכוּ
  choice: बाहर फेंक दिए जाएँगे
  rationale: שלך के कर्मवाच्य रूप में फेंके या डाल दिए जाने का भाव है। ‘बाहर फेंक दिए जाएँगे’ शवों को दफन न करके अपमानपूर्वक छोड़ देने की छवि को व्यक्त करता है।
- source_word: פִגְרֵיהֶם
  choice: उनकी लाशों
  rationale: פגר मृत देह को सूचित करता है। ‘लाश’ साधारण आधुनिक हिन्दी में स्पष्ट है और मूल की वीभत्सता को अनावश्यक रूप से नरम नहीं करता।
- source_word: יַעֲלֶה
  choice: उठेगी
  rationale: עלה का मूल अर्थ ऊपर जाना या उठना है। दुर्गंध के साथ ‘उठेगी’ हिन्दी में स्वाभाविक और स्रोत के निकट है।
- source_word: בָאְשָׁם
  choice: उनकी लाशों की दुर्गंध
  rationale: באש सड़ी या बुरी गंध को दर्शाता है और प्रत्यय बहुवचन स्वामित्व बताता है। ‘दुर्गंध’ गरिमापूर्ण किंतु स्पष्ट हिन्दी है; लाशों से संबंध प्रसंगानुसार व्यक्त किया गया है।
- source_word: וְנָמַסּוּ
  choice: पिघल जाएँगे
  rationale: מסס का अर्थ पिघलना या गल जाना है। यह चयन भविष्यद्वाणी की तीखी अतिशयोक्तिपूर्ण छवि को बिना व्याख्यात्मक रूप से बदलने के सुरक्षित रखता है।
- source_word: הָרִים
  choice: पहाड़
  rationale: הרים का सीधा अर्थ पहाड़ है; छवि के व्यापक पैमाने को कम करने का कोई आधार नहीं है।
- source_word: מִדָּמָם
  choice: उनके लहू से
  rationale: מן स्रोत अथवा कारण दोनों का बोध करा सकता है। ‘से’ हिन्दी में इस वास्तविक अस्पष्टता को बनाए रखता है और रक्त के कारण या उससे पहाड़ों के पिघलने—दोनों छायाओं को संभव रहने देता है।
theological_decisions:
- issue: ईश्वरीय न्याय की चित्रात्मक प्रकृति
  choice: रक्तपात और पहाड़ों के पिघलने की तीखी भविष्यद्वाणी-संबंधी छवि को ज्यों का त्यों बनाए रखना
  alternative: ‘पहाड़ उनके लहू से भीग जाएँगे’ जैसे व्याख्यात्मक और नरम रूप में प्रस्तुत करना
  rationale: इब्रानी पाठ संहार और सृष्टि-स्तरीय विघटन की चौंकाने वाली छवि देता है। अनुवाद इसे केवल रक्त से भीगने का वर्णन बनाकर मूल तनाव और प्रभाव को कम नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, स्पष्ट, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘लहू’ ने भविष्यद्वाणी और काव्यात्मक प्रसंग की गंभीरता बनाए रखी है; ‘खून’ की अपेक्षा यह यहाँ अधिक उपयुक्त है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
