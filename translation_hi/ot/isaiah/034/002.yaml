language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י קֶ֤צֶף לַֽ/יהוָה֙ עַל כָּל הַ/גּוֹיִ֔ם וְ/חֵמָ֖ה עַל כָּל צְבָאָ֑/ם הֶחֱרִימָ֖/ם נְתָנָ֥/ם לַ/טָּֽבַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/002.yaml
  text: For Yahweh has indignation against all the nations[a], and wrath against all their host; he has devoted them to destruction[b]; he has given them over to the slaughter.
translation:
  language: hi
  text: क्योंकि याहवे का रोष सब राष्ट्रों पर और उसका प्रचण्ड क्रोध उनकी सारी सेना पर भड़का है। उसने उन्हें विनाश के लिए समर्पित कर दिया है[a]; उसने उन्हें वध के लिए सौंप दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने उन्हें विनाश के अधीन कर दिया है।” इब्रानी क्रिया का अर्थ ईश्वरीय न्याय के अंतर्गत किसी को विनाश के लिए अलग या समर्पित करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले आह्वान का कारण बताता है; ‘क्योंकि’ उसके व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: קֶצֶף
  choice: रोष
  rationale: यह न्यायपूर्ण और तीव्र ईश्वरीय क्रोध को व्यक्त करता है तथा आगे आए חֵמָה से शब्दगत भेद बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: עַל כָּל הַגּוֹיִם
  choice: सब राष्ट्रों पर
  rationale: क्रोध के संदर्भ में עַל का लक्ष्य-सूचक अर्थ है; ‘राष्ट्र’ גּוֹיִם की व्यापक सामूहिकता व्यक्त करता है।
- source_word: וְחֵמָה
  choice: और उसका प्रचण्ड क्रोध
  rationale: חֵמָה तीखे, उग्र क्रोध का बोध कराता है; ‘प्रचण्ड क्रोध’ कֶצֶף से उसका भेद बनाए रखते हुए सहज हिन्दी देता है।
- source_word: עַל כָּל צְבָאָם
  choice: उनकी सारी सेना पर
  rationale: צָבָא यहाँ राष्ट्रों की सैन्य शक्ति अथवा संगठित सैन्य समूह को सूचित करता है; प्रसंग में ‘सेना’ स्वाभाविक और स्पष्ट है।
- source_word: הֶחֱרִימָם
  choice: उसने उन्हें विनाश के लिए अर्पित कर दिया है
  rationale: חרם के हिफ़ील रूप में ईश्वरीय न्याय के अधीन विनाश के लिए अलग कर देने अथवा समर्पित करने का भाव है; केवल ‘नष्ट किया’ कहने से यह विशिष्ट अर्थ खो जाता।
- source_word: נְתָנָם לַטָּבַח
  choice: उसने उन्हें वध के लिए सौंप दिया है
  rationale: נתן यहाँ न्यायपूर्वक हवाले करने का भाव रखता है और טֶבַח सामूहिक वध को दर्शाता है; यह संयोजन हिन्दी में अर्थ और चित्र दोनों सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल का व्यक्तिगत वाचा-नाम किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है; ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है।
- issue: הֶחֱרִימָם में חרם का न्याय-संबंधी अर्थ
  choice: विनाश के लिए अर्पित कर दिया है
  alternative: पूर्णतः नष्ट कर दिया है / प्रतिबंध के अधीन कर दिया है
  rationale: चुना हुआ रूप विनाश के लिए ईश्वरीय रूप से अलग या समर्पित किए जाने का अर्थ बचाता है, पर किसी विशिष्ट संप्रदायगत व्याख्या को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। समानार्थी क्रोध-संज्ञाओं קֶצֶף और חֵמָה का भेद ‘रोष’ तथा ‘प्रचण्ड क्रोध’ से रखा गया है। मुख्य पाठ में एकमात्र पाद-टिप्पणी चिह्न [a] उपस्थित है।
