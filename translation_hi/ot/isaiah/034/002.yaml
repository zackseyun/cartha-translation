    issue: The divine name is rendered “यहोवा.”
    rationale: The source uses the Tetragrammaton, and the provided English POB audit trail explicitly adopts “Yahweh,” rather than “Jehovah.” In modern Hindi Devanagari, “याहवे” is the corresponding transliteration.
  - severity: low
