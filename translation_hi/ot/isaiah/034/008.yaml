base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/008.yaml
  text: For Yahweh has a day of vengeance[a], a year of recompense for Zion’s cause.
translation:
  language: hi
  text: क्योंकि यहोवा का प्रतिशोध का एक दिन है[a], सिय्योन के मुक़दमे के लिए प्रतिदान का एक वर्ष।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि यहोवा के लिए प्रतिशोध का एक दिन है, सिय्योन के मुक़दमे के लिए प्रतिदान का एक वर्ष।”
    reason: לַיהוָה को ‘यहोवा का’ (अधिकारसूचक/संबंधसूचक) या अधिक शाब्दिक ‘यहोवा के लिए’ समझा जा सकता है; इब्रानी वाक्य में ‘है’ निहित है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पदों में वर्णित न्याय का कारण बताता है; इसलिए कारणसूचक अर्थ रखा गया है।
- source_word: יוֹם נָקָם
  choice: प्रतिशोध का एक दिन
  rationale: यह इब्रानी पदबंध दुष्टता के न्यायपूर्ण प्रत्युत्तर का समय दर्शाता है; ‘प्रतिशोध’ न्यायिक गंभीरता और स्वाभाविक हिन्दी दोनों बनाए रखता है।
- source_word: לַיהוָה
  choice: यहोवा के पास
  rationale: לְ यहाँ संबंध या अधिकार का भाव व्यक्त कर सकता है। ‘के पास’ मुख्य पाठ में इस भाव को सहज हिन्दी में रखता है, जबकि वैकल्पिक संरचना पादटिप्पणी में दी गई है।
- source_word: שְׁנַת שִׁלּוּמִים
  choice: बदला चुकाने का एक वर्ष
  rationale: बहुवचन भाववाचक שִׁלּוּמִים उचित प्रतिदान या भरपाई को दर्शाता है। ‘बदला चुकाने’ से न्यायपूर्ण प्रत्युत्तर का अर्थ सामान्य पाठक के लिए स्पष्ट रहता है।
- source_word: לְרִיב צִיּוֹן
  choice: सिय्योन के मुक़दमे के लिए
  rationale: רִיב का न्यायिक अर्थ विवाद, मुक़दमा या पक्ष हो सकता है। ‘मुक़दमे’ से कानूनी रूपक बचा रहता है और यह अनावश्यक रूप से तय नहीं किया जाता कि व्याकरणिक संबंध को ‘पक्ष’ या ‘विरुद्ध’ कैसे खोला जाए।
- source_word: צִיּוֹן
  choice: सिय्योन
  rationale: स्थान और समुदाय के पारंपरिक बाइबलीय नाम को हिन्दी में प्रचलित रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में वाचा-संबंधी व्यक्तिगत नाम יהוה है; उसे उपाधि में बदलने के बजाय हिन्दी में प्रचलित ‘यहोवा’ रूप से व्यक्त किया गया है।
- issue: לַיהוָה का संबंध
  choice: अधिकार/संबंध का भाव—‘यहोवा के पास’
  alternative: ‘प्रतिशोध का दिन यहोवा का है’ या ‘यहोवा के लिए प्रतिशोध का दिन है’
  rationale: इब्रानी לְ अधिकार, संबंध या हित का संकेत दे सकता है। मुख्य पाठ सहज हिन्दी में अधिकार का भाव देता है; पादटिप्पणी अधिक औपचारिक वैकल्पिक संरचना सुरक्षित रखती है।
- issue: רִיב צִיּוֹן का न्यायिक आशय
  choice: सिय्योन का मुक़दमा
  alternative: सिय्योन का पक्ष / सिय्योन का विवाद
  rationale: ‘मुक़दमा’ न्यायालय-सदृश रूपक को बनाए रखता है, पर यह पाठ से आगे बढ़कर किसी विशेष धर्मवैचारिक व्याख्या को अनिवार्य नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘प्रतिशोध’, ‘मुक़दमा’ और ‘बदला चुकाना’ न्यायिक स्वर को व्यक्त करते हैं; समानांतर ‘दिन/वर्ष’ संरचना सुरक्षित रखी गई है।
