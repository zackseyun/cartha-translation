source:
  edition: WLC
  text: דִּרְשׁ֨וּ מֵֽ/עַל סֵ֤פֶר יְהוָה֙ וּֽ/קְרָ֔אוּ אַחַ֤ת מֵ/הֵ֨נָּה֙ לֹ֣א נֶעְדָּ֔רָה אִשָּׁ֥ה רְעוּתָ֖/הּ לֹ֣א פָקָ֑דוּ כִּֽי פִ/י֙ ה֣וּא צִוָּ֔ה וְ/רוּח֖/וֹ ה֥וּא קִבְּצָֽ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/016.yaml
  text: 'Search in the book of Yahweh and read: not one of these will be missing[a]; none will lack her mate. For his mouth has commanded[b], and his Spirit has gathered them.'
translation:
  language: hi
  text: 'याहवे की पुस्तक में खोजो और पढ़ो: इनमें से एक भी अनुपस्थित नहीं होगी; एक भी अपनी संगिनी से वंचित नहीं होगी। क्योंकि मेरे ही मुँह ने आज्ञा दी है,[a] और उसकी आत्मा[b] ने उन्हें इकट्ठा किया है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से “मेरे मुँह ने आज्ञा दी” है; कुछ अनुवाद इसे “उसके मुँह ने आज्ञा दी” करते हैं।
    reason: मूल पाठ के प्रथम पुरुष और अगले खंड के तीसरे पुरुष के बीच परिवर्तन तथा प्रचलित वैकल्पिक अनुवाद को स्पष्ट करना।
  - marker: b
    text: या “श्वास”; अथवा “वायु”।
    reason: हिब्रू רוּחַ की अर्थ-सीमा को सुरक्षित रखना।
lexical_decisions:
- source_word: דִּרְשׁוּ מֵעַל סֵפֶר יְהוָה וּקְרָאוּ
  choice: याहवे की पुस्तक में खोजो और पढ़ो
  rationale: דרשׁ का बहुवचन आज्ञार्थक रूप लिखित अभिलेख को ध्यान से जाँचने या उसमें खोजने का आह्वान करता है। पुस्तक के संदर्भ में קרא का अर्थ पढ़ना है। מֵעַל को स्वाभाविक हिन्दी मुहावरे में ‘पुस्तक में’ व्यक्त किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत नाम के चार व्यंजनों YHWH को आधुनिक हिन्दी में स्पष्ट लिप्यंतरण द्वारा रखा गया है।
- source_word: אַחַת מֵהֵנָּה לֹא נֶעְדָּרָה
  choice: इनमें से एक भी नहीं छूटेगी
  rationale: स्त्रीलिंग एकवचन ‘एक’ को पहले गिनाए गए जीवों में से प्रत्येक पर वितरणात्मक रूप से लागू किया गया है। भविष्यसूचक संदर्भ में पूर्ण क्रिया की निश्चितता को स्वाभाविक हिन्दी में भविष्य के अर्थ के साथ व्यक्त किया गया है।
- source_word: אִשָּׁה רְעוּתָהּ לֹא פָקָדוּ
  choice: किसी को भी अपनी संगिनी की कमी न होगी
  rationale: स्त्रीलिंग ‘एक’ और उसकी רֵעוּת, अर्थात साथी या जोड़ीदार, जीवों के जोड़ों की ओर संकेत करते हैं। ‘संगिनी’ स्त्रीलिंग और साथ होने, दोनों भावों को बनाए रखता है।
- source_word: כִּי פִי הוּא צִוָּה
  choice: क्योंकि मेरे ही मुँह ने आज्ञा दी है
  rationale: मसोरेटिक पाठ פִי का सीधा अर्थ ‘मेरा मुँह’ है। הוּא के बलसूचक कार्य को ‘ही’ से व्यक्त किया गया है, जिससे कठिन पुरुष-परिवर्तन को मिटाए बिना हिन्दी वाक्य स्वाभाविक रहता है।
- source_word: וְרוּחוֹ
  choice: और उसी की आत्मा
  rationale: רוּחַ के अर्थ आत्मा, श्वास और वायु हो सकते हैं। यहाँ आज्ञा देने और इकट्ठा करने वाली दिव्य सक्रियता के समानांतर ‘आत्मा’ उपयुक्त है; ‘उसी की’ मूल के तीसरे पुरुष प्रत्यय और बल को दर्शाता है।
- source_word: קִבְּצָן
  choice: ने उन्हें इकट्ठा किया है
  rationale: קבץ का अर्थ इकट्ठा करना है और प्रत्यय बहुवचन कर्म को सूचित करता है। पूर्ण क्रिया को वर्तमान पूर्ण रूप में रखकर दिव्य कार्य की निश्चितता व्यक्त की गई है।
theological_decisions:
- issue: अंतिम वाक्य में प्रथम पुरुष ‘मेरे मुँह’ से तीसरे पुरुष ‘उसकी आत्मा’ की ओर परिवर्तन
  choice: मेरे ही मुँह ने आज्ञा दी है, और उसी की आत्मा ने उन्हें इकट्ठा किया है
  alternative: उसके मुँह ने आज्ञा दी है, और उसकी आत्मा ने उन्हें इकट्ठा किया है
  rationale: हिब्रू मसोरेटिक पाठ में פִי स्पष्टतः ‘मेरा मुँह’ है, जबकि וְרוּחוֹ ‘उसकी आत्मा’ है। मुख्य पाठ में इस वास्तविक पुरुष-परिवर्तन को बनाए रखा गया है, न कि धर्मवैज्ञानिक सामंजस्य के लिए चुपचाप समतल किया गया है। पादटिप्पणी अधिक सहज तीसरे-पुरुष अनुवाद की जानकारी देती है।
- issue: רוּחַ में दिव्य सक्रियता का स्वरूप
  choice: आत्मा
  alternative: श्वास या वायु
  rationale: समानांतर खंड में आज्ञा और एकत्र करने की सक्रियता के कारण ‘आत्मा’ मुख्य पाठ के लिए सबसे उपयुक्त है, पर मूल शब्द की व्यापक अर्थ-सीमा पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘खोजो और पढ़ो’ साधारण पाठक के लिए स्पष्ट है। स्त्रीलिंग रूपों और अंतिम खंड के असामान्य पुरुष-परिवर्तन को मूल हिब्रू के अनुरूप जानबूझकर बनाए रखा गया है।
