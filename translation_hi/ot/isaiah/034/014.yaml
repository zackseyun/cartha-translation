id: ISA.34.14
reference: Isaiah 34:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/פָגְשׁ֤וּ צִיִּים֙ אֶת אִיִּ֔ים וְ/שָׂעִ֖יר עַל רֵעֵ֣/הוּ יִקְרָ֑א אַךְ שָׁם֙ הִרְגִּ֣יעָה לִּילִ֔ית וּ/מָצְאָ֥ה לָ֖/הּ מָנֽוֹחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/014.yaml
  text: And desert creatures will meet with hyenas[a], and the goat-demon will call to its fellow; indeed[b], there Lilith will settle down and find a resting place for herself.
translation:
  language: hi
  text: 'मरुस्थल के जीव लकड़बग्घों[a] से मिलेंगे,

    और बकरा-दैत्य अपने साथी को पुकारेगा;

    निश्चय ही, वहीं लिलीत[b] ठहरेगी

    और अपने लिए विश्राम-स्थान पाएगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गीदड़ों’; इब्रानी में प्रयुक्त पशु-संज्ञा की सटीक पहचान अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: ‘लिलीत’ का अनुवाद ‘रात्रि-प्राणी’ या ‘रात्रि-दैत्य’ भी किया जा सकता है; कुछ पुराने अनुवादों में ‘चीखने वाला उल्लू’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צִיִּים
  choice: मरुस्थल के जीव
  rationale: यह शब्द किसी निश्चित प्रजाति के बजाय उजाड़ या मरुस्थलीय स्थानों में रहने वाले जीवों को सूचित करता है; यह अनिश्चितता और उजाड़ का चित्र दोनों बनाए रखता है।
- source_word: אִיִּים
  choice: लकड़बग्घे
  rationale: जीव की सटीक पहचान अनिश्चित है; ‘लकड़बग्घे’ मरुस्थलीय शवभक्षी जीवों के इस चित्र के अनुकूल एक प्रचलित आधुनिक प्रस्ताव है। वैकल्पिक पहचान पादटिप्पणी में दी गई है।
- source_word: שָׂעִיר
  choice: बकरा-दैत्य
  rationale: उजाड़ में विचरने वाले अलौकिक प्राणियों के इस संदर्भ में शब्द का दैत्य-संबंधी अर्थ केवल ‘बकरा’ से अधिक संभावित है; यह चयन यूनानी-रोमी ‘सैटिर’ की अनावश्यक छवि भी नहीं लाता।
- source_word: עַל רֵעֵהוּ יִקְרָא
  choice: अपने साथी को पुकारेगा
  rationale: यह वाक्यांश एक प्राणी के अपने समान या संगी प्राणी को पुकारने का स्वाभाविक हिन्दी रूप है।
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ अव्यय कथन को बल देता है; ‘निश्चय ही’ उस बल को सहज हिन्दी में व्यक्त करता है।
- source_word: הִרְגִּיעָה
  choice: ठहरेगी
  rationale: क्रिया के विश्राम करने या आकर टिकने के भाव को व्यक्त करता है और अगले ‘विश्राम-स्थान’ के साथ अनावश्यक पूर्ण पुनरुक्ति से बचते हुए मूल संबंध बनाए रखता है।
- source_word: לִּילִית
  choice: लिलीत
  rationale: दुर्लभ और विवादित इब्रानी पद को किसी निश्चित पक्षी या पशु में बदलने के बजाय स्रोत-आधारित लिप्यंतरण रखा गया है, जिससे उसका संभावित मिथकीय संकेत और वास्तविक अस्पष्टता बनी रहती है।
- source_word: מָנוֹחַ
  choice: विश्राम-स्थान
  rationale: यह संज्ञा विश्राम की अवस्था अथवा स्थान को सूचित करती है; खंडहरों में निवास पाने के ठोस चित्र के लिए ‘विश्राम-स्थान’ उपयुक्त है।
theological_decisions:
- issue: न्याय के इस वर्णन में मरुस्थलीय प्राणियों की अलौकिक या मिथकीय छवि को सामान्य पशुओं में बदलना या बनाए रखना
  choice: ‘बकरा-दैत्य’ और लिप्यंतरित ‘लिलीत’ के द्वारा संभावित अलौकिक या मिथकीय बल बनाए रखा गया है।
  alternative: दोनों को साधारण मरुस्थलीय पशु या पक्षी मानकर अनुवाद करना।
  rationale: यह पद जानबूझकर ऐसे भयावह उजाड़ का चित्र खींचता है जहाँ विचित्र प्राणी बसते हैं। इस छवि को बनाए रखना इब्रानी पाठ के अधिक निकट है, पर पद में कही बात से आगे कोई विस्तृत दानव-विद्या स्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद्य-विन्यास इब्रानी समानांतरता और उजाड़ की क्रमिक छवि को उभारता है। ‘लिलीत’ स्रोत-आधारित लिप्यंतरण है; पादटिप्पणियाँ वास्तविक प्राणी-विज्ञान संबंधी अनिश्चितता स्पष्ट करती हैं।
