source:
  edition: WLC
  text: חֶ֣רֶב לַ/יהוָ֞ה מָלְאָ֥ה דָם֙ הֻדַּ֣שְׁנָה מֵ/חֵ֔לֶב מִ/דַּ֤ם כָּרִים֙ וְ/עַתּוּדִ֔ים מֵ/חֵ֖לֶב כִּלְי֣וֹת אֵילִ֑ים כִּ֣י זֶ֤בַח לַֽ/יהוָה֙ בְּ/בָצְרָ֔ה וְ/טֶ֥בַח גָּד֖וֹל בְּ/אֶ֥רֶץ אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/006.yaml
  text: The sword of Yahweh is filled with blood[a]; it is made fat with fat, with the blood of lambs and goats, with the fat of the kidneys of rams. For Yahweh has a sacrifice in Bozrah[b], and a great slaughter in the land of Edom.
translation:
  language: hi
  text: याहवे की तलवार लहू से भर गई है; वह चर्बी से भरपूर हो गई है—मेमनों और नर बकरों के लहू से, और मेढ़ों के गुर्दों की चर्बी से। क्योंकि बोसरा में याहवे का बलिदान[a] है और एदोम देश में बड़ा वध है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि बोसरा में याहवे के लिए एक बलिदान है।” इब्रानी खंड में क्रिया नहीं है और इसे इस प्रकार भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: חֶרֶב לַיהוָה
  choice: याहवे की तलवार
  rationale: लामेद को यहाँ संबंध/अधिकार के अर्थ में समझना प्रसंगानुकूल है; ‘याहवे’ परमेश्वर के व्यक्तिगत नाम को बनाए रखता है।
- source_word: מָלְאָה דָם
  choice: लहू से भर गई है
  rationale: पूर्ण क्रिया के परिणामकारी भाव और न्याय-दृश्य की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הֻדַּשְׁנָה מֵחֵלֶב
  choice: चर्बी से तृप्त हुई है
  rationale: पुअल रूप में ‘चर्बी से भरपूर/पुष्ट किए जाने’ का भाव है। ‘तृप्त’ तलवार का सजीव चित्र बनाए रखता है और अस्वाभाविक ‘मोटी की गई’ से बचता है।
- source_word: כָּרִים וְעַתּוּדִים
  choice: मेमनों और बकरों
  rationale: כָּרִים यहाँ बलि के लिए मेमने/जवान मेढ़े और עַתּוּדִים नर बकरे दर्शाता है; हिन्दी ‘बकरों’ से नर का अर्थ स्पष्ट रहता है।
- source_word: מֵחֵלֶב כִּלְיוֹת אֵילִים
  choice: मेढ़ों के गुर्दों की चर्बी से
  rationale: बलिदान-संबंधी स्पष्ट शारीरिक विवरण और इब्रानी संबंध-क्रम को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: זֶבַח
  choice: बलिदान
  rationale: युद्धजनित न्याय को बलिदान के रूप में प्रस्तुत करने वाले मूल रूपक को बिना नरम किए बनाए रखता है।
- source_word: טֶבַח גָּדוֹל
  choice: भारी वध
  rationale: ‘वध’ बलिदान और संहार दोनों की अर्थ-छाया रखता है; ‘भारी’ घटना की विशालता और गंभीरता व्यक्त करता है।
- source_word: בָּצְרָה / אֱדוֹם
  choice: बोसरा / एदोम
  rationale: स्थान-नामों के प्रचलित हिन्दी लिप्यंतरण अपनाए गए हैं।
theological_decisions:
- issue: न्याय-वाणी में बलिदान की छवि
  choice: ‘बलिदान’, ‘चर्बी’, ‘गुर्दे’ और ‘वध’ को स्पष्ट रूप से बनाए रखना
  alternative: इसे केवल युद्ध या सामान्य संहार की भाषा में व्यक्त करना
  rationale: पद जानबूझकर एदोम पर याहवे के न्याय को बलिदान की श्रेणियों में चित्रित करता है; इस तनाव को बनाए रखना मूल के प्रति अधिक निष्ठावान है।
- issue: זֶבַח לַיהוָה में संबंध
  choice: ‘याहवे का बलिदान’
  alternative: ‘याहवे के लिए बलिदान’ या ‘याहवे के पास बलिदान है’
  rationale: क्रियारहित इब्रानी वाक्यांश अधिकार, संबंध या उद्देश्य के रूप में समझा जा सकता है। मुख्य पाठ स्वाभाविक हिन्दी में याहवे द्वारा नियुक्त बलिदानी वध का भाव देता है, जबकि पादटिप्पणी वास्तविक व्याकरणिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और काव्यात्मक है। ‘लहू’, ‘चर्बी’, ‘गुर्दे’ और ‘वध’ जैसे सीधे शब्द मूल की कठोर बलिदानी छवि को बनाए रखते हैं; अत्यधिक संस्कृतनिष्ठ या व्याख्यात्मक शब्दावली से बचा गया है।
