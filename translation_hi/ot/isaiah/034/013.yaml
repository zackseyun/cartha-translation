source:
  edition: WLC
  text: וְ/עָלְתָ֤ה אַרְמְנֹתֶ֨י/הָ֙ סִירִ֔ים קִמּ֥וֹשׂ וָ/ח֖וֹחַ בְּ/מִבְצָרֶ֑י/הָ וְ/הָיְתָה֙ נְוֵ֣ה תַנִּ֔ים חָצִ֖יר לִ/בְנ֥וֹת יַעֲנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/013.yaml
  text: Thorns will grow over her palaces[a], nettles and brambles in her fortresses; and she will become a haunt of jackals[b], a pasture for ostriches.
translation:
  language: hi
  text: उसके महलों पर काँटेदार झाड़ियाँ उग आएँगी, और उसके गढ़ों में बिच्छू-बूटी और कँटीले झाड़ उगेंगे; वह सियारों[a] का बसेरा और शुतुरमुर्गों[b] की चरागाह बन जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त इब्रानी शब्द का संभावित अर्थ ‘सियार’ है; कुछ पुराने अनुवादों में ‘अजगर’ या ‘नाग’ मिलता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, ‘शुतुरमुर्ग की बेटियों’; यह शुतुरमुर्गों के लिए प्रयुक्त इब्रानी अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלְתָה ... סִירִים
  choice: काँटेदार झाड़ियाँ उग आएँगी
  rationale: עלה यहाँ उजड़े भवनों में वनस्पति के उग आने को व्यक्त करता है; ‘उग आएँगी’ स्वाभाविक हिन्दी है और סִירִים की काँटेदार वनस्पति का अर्थ स्पष्ट करता है।
- source_word: אַרְמְנֹתֶיהָ
  choice: उसके महलों में
  rationale: אַרְמוֹן राजमहल या दुर्गनुमा भव्य निवास को सूचित करता है; समानांतर ‘गढ़ों’ से भेद बनाए रखने के लिए ‘महलों’ उपयुक्त है।
- source_word: קִמּוֹשׂ וָחוֹחַ
  choice: बिच्छू-बूटी और कँटीले झाड़
  rationale: दोनों शब्द उजाड़ स्थानों में उगने वाली हानिकारक या कँटीली वनस्पति बताते हैं। अलग-अलग हिन्दी पद मूल की दोहरी अभिव्यक्ति को बनाए रखते हैं, यद्यपि पौधों की सटीक पहचान अनिश्चित है।
- source_word: בְּמִבְצָרֶיהָ
  choice: उसके गढ़ों में
  rationale: מִבְצָר किलेबंद स्थान या दृढ़ गढ़ है; ‘गढ़’ संक्षिप्त, वर्तमान और सहज हिन्दी है।
- source_word: נְוֵה תַנִּים
  choice: सियारों का बसेरा
  rationale: נְוֵה निवास या बसेरा है और इस विनाश-वर्णन में תַנִּים का संभावित अर्थ सियार है।
- source_word: חָצִיר
  choice: चरागाह
  rationale: חָצִיר मूलतः घास या घास वाला स्थान सूचित कर सकता है; पशु-पक्षियों द्वारा बसाए गए उजाड़ क्षेत्र की समानांतर छवि में ‘चरागाह’ अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִבְנוֹת יַעֲנָה
  choice: शुतुरमुर्गों की
  rationale: शाब्दिक रूप ‘शुतुरमुर्ग की बेटियों के लिए’ है, पर यह जाति के पक्षियों के लिए प्रयुक्त इब्रानी अभिव्यक्ति है; सामान्य हिन्दी में बहुवचन ‘शुतुरमुर्गों’ उसका आशय देता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्त्रीलिंग ‘वह’ पूर्ववर्ती एदोम/भूमि के व्यक्तिकरण को बनाए रखता है। वनस्पति और वन्य जीवों की छवियों को स्पष्ट रखते हुए अनिश्चित प्रजाति-पहचान को आवश्यकता से अधिक निश्चित नहीं किया गया।
