  text: וִ/ירֵשׁ֨וּ/הָ֙ קָאַ֣ת וְ/קִפּ֔וֹד וְ/יַנְשׁ֥וֹף וְ/עֹרֵ֖ב יִשְׁכְּנוּ בָ֑/הּ וְ/נָטָ֥ה עָלֶ֛י/הָ קַֽו תֹ֖הוּ וְ/אַבְנֵי בֹֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/011.yaml
  text: The desert owl and the hedgehog will possess her[a], and the owl and the raven will dwell in her[b]; he will stretch over her the measuring line of desolation and the plumb stones of emptiness.
translation:
  language: hi
  text: मरु-उल्लू और काँटेदार चूहा उस पर कब्ज़ा कर लेंगे,[a] और उल्लू और काला कौआ उसमें बसेरा करेंगे। वह उसके ऊपर उजाड़ की मापने की डोरी और खालीपन के साहुल के पत्थर तानेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ बताए गए जीवों की ठीक पहचान अनिश्चित है। ‘मरु-उल्लू’ का अनुवाद ‘हवासील’ या ‘जलकौआ’ भी किया गया है, और ‘काँटेदार चूहा’ का अनुवाद ‘साही’ या ‘बिटर्न’ भी किया गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तोहू की डोरी और बोहू के पत्थर।” ये शब्द उत्पत्ति 1:2 के “बेडौल और खाली” होने की प्रतिध्वनि हैं और देश को मानो सृष्टि-पूर्व की उजाड़ दशा में पहुँचा हुआ दिखाते हैं।
    reason: cross_reference
lexical_decisions:
- source_word: וִירֵשׁוּהָ
  choice: उस पर अधिकार करेंगे
  rationale: ירשׁ यहाँ किसी वैधानिक विरासत से अधिक उजड़े हुए भूभाग पर जंगली जीवों के अधिकार और कब्ज़े को व्यक्त करता है।
- source_word: קָאַת
  choice: मरु-उल्लू
  rationale: इस जीव की पहचान अनिश्चित है। प्रसंग के उजाड़-चित्र को ध्यान में रखते हुए ‘मरु-उल्लू’ सहज है, पर अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: קִפּוֹד
  choice: साही
  rationale: जीव की ठीक पहचान विवादित है; ‘साही’ खंडहरों में रहने वाले जंगली जीव की छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יַנְשׁוֹף
  choice: उल्लू
  rationale: यह सामान्यतः किसी प्रकार के रात्रिचर उल्लू को सूचित करता है; केवल ‘उल्लू’ कहना अनावश्यक प्रजातिगत निश्चितता से बचता है।
- source_word: עֹרֵב
  choice: कौआ
  rationale: עֹרֵב के लिए सामान्य हिन्दी समतुल्य ‘कौआ’ है; यह उजाड़ के दृश्य में भी स्वाभाविक है।
- source_word: יִשְׁכְּנוּ בָהּ
  choice: उसमें बसेरा करेंगे
  rationale: שׁכן स्थायी रूप से बसने या निवास करने का भाव देता है; ‘बसेरा करेंगे’ जंगली पक्षियों और जीवों के संदर्भ में स्वाभाविक है।
- source_word: וְנָטָה עָלֶיהָ
  choice: वह उसके ऊपर ... तानेगा
  rationale: נטה मापने की डोरी फैलाने या तानने की क्रिया है। कर्ता मूल में अप्रकट है; संदर्भ में न्याय करने वाला परमेश्वर समझा जाता है, इसलिए उसे स्पष्ट रूप से नाम दिए बिना ‘वह’ रखा गया है।
- source_word: קַו תֹהוּ
  choice: उजाड़ की मापने की डोरी
  rationale: קַו मापने की डोरी है और תֹהוּ यहाँ उजाड़ तथा अव्यवस्था का भाव देता है। अनुवाद न्याय के प्रसंग और मापन की मूर्त छवि दोनों को बनाए रखता है।
- source_word: וְאַבְנֵי בֹהוּ
  choice: खालीपन के साहुल-पत्थर
  rationale: ‘पत्थरों’ को समानांतर मापन-चित्र में साहुल के भार-पत्थर समझना उचित है। בֹהוּ खालीपन या शून्यता को सूचित करता है।
theological_decisions:
- issue: תֹהוּ और בֹהוּ में सृष्टि-वर्णन की प्रतिध्वनि
  choice: मुख्य पाठ में ‘उजाड़’ और ‘खालीपन’ रखा गया तथा उत्पत्ति 1:2 की प्रतिध्वनि पादटिप्पणी में स्पष्ट की गई।
  alternative: मुख्य पाठ में ‘अव्यवस्था’ और ‘शून्यता’ जैसे अधिक शाब्दिक शब्द रखना।
  rationale: यशायाह की भाषा एदोम के न्याय को मानो सृष्टि-व्यवस्था के उलट जाने के रूप में चित्रित करती है। वर्तमान शब्द तत्काल प्रसंग में स्वाभाविक हैं, जबकि पादटिप्पणी अंतर्पाठीय संबंध को सुरक्षित रखती है।
- issue: וְנָטָה का अप्रकट कर्ता
  choice: कर्त्ता को ‘वह’ के रूप में रखा गया, बिना मुख्य पाठ में ‘परमेश्वर’ जोड़ने के।
  alternative: कर्त्ता को स्पष्ट करके ‘परमेश्वर तानेगा’ कहना।
  rationale: संदर्भ परमेश्वर के न्याय की ओर संकेत करता है, पर इब्रानी पद में नाम स्पष्ट नहीं है; ‘वह’ मूल की अंतर्निहितता और संदर्भगत अर्थ दोनों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। स्त्रीलिंग भूभाग/नगर के इब्रानी सर्वनामों को हिन्दी में स्वाभाविक ‘उस पर/उसमें/उसके ऊपर’ से व्यक्त किया गया है। ‘मापने की डोरी’ और ‘साहुल-पत्थर’ विनाश को नापकर पूरा किए जाने की समानांतर काव्यात्मक छवि बनाए रखते हैं।
