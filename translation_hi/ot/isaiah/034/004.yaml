base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/004.yaml
  text: All the host of heaven will rot away[a], and the skies will be rolled up like a scroll; all their host will wither like a leaf withers from the vine[e][d][c][b], and like a withered fig from the fig tree.
translation:
  language: hi
  text: आकाश की सारी सेना गल जाएगी[a], और आकाश एक लिखे हुए खर्रे की तरह लपेट दिए जाएँगे[b]। उनकी सारी सेना मुरझा जाएगी, जैसे अंगूर की बेल का पत्ता मुरझाता है और जैसे अंजीर के पेड़ का अंजीर[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्षीण होकर विलीन हो जाएगी।” इब्रानी क्रिया गलने, क्षीण होने या विलीन होने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “स्वर्ग एक लिखे हुए खर्रे की तरह लपेट दिए जाएँगे।” यहाँ “आकाश” के लिए प्रयुक्त इब्रानी शब्द का अनुवाद “स्वर्ग” भी हो सकता है। “खर्रा” प्राचीन काल के उस लिखित पत्र को दर्शाता है जिसे लपेटा जा सकता था।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी बिंब मुरझाने पर बल देता है; संदर्भ में मुरझाकर झड़ने का भाव भी संभव है। “आकाश की सेना” और “उनकी सारी सेना” संभवतः तारों अथवा आकाशीय पिंडों के समूह को सूचित करती हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: נָמַקּוּ
  choice: गल जाएगी
  rationale: निफ़अल क्रिया का अर्थ गलना, क्षीण होना या विलीन होना हो सकता है। ‘गल जाएगी’ विनाश के सजीव भौतिक बिंब को बनाए रखता है।
- source_word: צְבָא הַשָּׁמַיִם
  choice: आकाश की सारी सेना
  rationale: צָבָא का मूल अर्थ सेना या विशाल समुदाय है; यहाँ यह आकाशीय समूह, विशेषकर तारों अथवा अन्य आकाशीय पिंडों, की ओर संकेत करता है। शाब्दिक मुहावरा व्यापकता और काव्यात्मकता बचाता है।
- source_word: נָגֹלּוּ כַסֵּפֶר הַשָּׁמַיִם
  choice: आकाश पुस्तक के खर्रे के समान लपेट दिए जाएँगे
  rationale: גלל लपेटने का बिंब देता है और סֵפֶר प्राचीन लिखित खर्रे को सूचित कर सकता है। ‘पुस्तक का खर्रा’ सामान्य पाठक के लिए अर्थ स्पष्ट करते हुए ऐतिहासिक बिंब बचाता है। बहुवचन क्रिया के अनुरूप ‘आकाश ... दिए जाएँगे’ रखा गया है।
- source_word: וְכָל צְבָאָם
  choice: उनकी सारी सेना
  rationale: बहुवचन प्रत्यय का संबंध निकटवर्ती ‘आकाश’ से है। अनुवाद मूल संबंध को बनाए रखता और इसे केवल ‘तारे’ कहकर सीमित नहीं करता।
- source_word: יִבּוֹל
  choice: मुरझाकर झड़ जाएगी
  rationale: נבל वनस्पति के मुरझाने या कुम्हलाने को व्यक्त करता है, पर अगले बिंब में बेल अथवा पेड़ से अलग होने का परिणाम भी निहित है। संयुक्त अभिव्यक्ति दोनों पहलुओं को स्वाभाविक हिन्दी में रखती है।
- source_word: כִנְבֹל עָלֶה מִגֶּפֶן וּכְנֹבֶלֶת מִתְּאֵנָה
  choice: जैसे अंगूर की बेल से पत्ता और अंजीर के पेड़ से मुरझाया अंजीर झड़ जाता है
  rationale: कृषि-बिंब तथा נבל की मुरझाने/झड़ने की अर्थ-सीमा सुरक्षित है। दूसरे उपमान में ‘अंजीर’ पेड़ के नाम से निहित है, इसलिए हिन्दी में स्पष्ट रूप से जोड़ा गया है।
theological_decisions:
- issue: ब्रह्मांडीय न्याय के बिंब का स्वरूप
  choice: भाषा को सीधे और प्रबल ब्रह्मांडीय विनाश/न्याय के काव्यात्मक चित्र के रूप में रखा गया है।
  alternative: इसे केवल राजनीतिक पतन का रूपक मानना, अथवा केवल शाब्दिक खगोलीय विघटन के रूप में निश्चित करना।
  rationale: भविष्यद्वाणी की कविता दोनों संभावनाओं को खुला रखती है। अनुवाद न तो बिंब की शक्ति घटाता है, न किसी विशेष अंतकाल-विषयक व्यवस्था को पाठ पर थोपता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय भविष्यद्वाणी-काव्य का स्वर रखा गया है। ‘पुस्तक का खर्रा’ प्राचीन scroll को सामान्य पाठक के लिए स्पष्ट करता है; ‘आकाश की सेना’ मूल इब्रानी मुहावरे और उसकी जानबूझकर रखी गई व्यापकता को सुरक्षित रखती है।
