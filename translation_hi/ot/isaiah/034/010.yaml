id: ISA.34.10
reference: Isaiah 34:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לַ֤יְלָה וְ/יוֹמָם֙ לֹ֣א תִכְבֶּ֔ה לְ/עוֹלָ֖ם יַעֲלֶ֣ה עֲשָׁנָ֑/הּ מִ/דּ֤וֹר לָ/דוֹר֙ תֶּחֱרָ֔ב לְ/נֵ֣צַח נְצָחִ֔ים אֵ֥ין עֹבֵ֖ר בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/010.yaml
  text: Night and day it shall not be quenched; its smoke shall go up forever[a]. From generation to generation it shall lie waste; forever and ever no one shall pass through it.
translation:
  language: hi
  text: रात-दिन वह आग नहीं बुझेगी; उसका धुआँ सदा उठता रहेगा। पीढ़ी-दर-पीढ़ी वह उजाड़ पड़ी रहेगी[a]; सदा-सर्वदा कोई उसमें से होकर नहीं गुज़रेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उजाड़ हो जाएगी।” इब्रानी क्रिया उजाड़ किए जाने अथवा उजाड़ हो जाने का भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיְלָה וְיוֹמָם
  choice: रात-दिन
  rationale: यह युग्म निरंतरता व्यक्त करता है। ‘रात-दिन’ आधुनिक हिन्दी में स्वाभाविक है और मूल के व्यापक काल-संकेत को बनाए रखता है।
- source_word: לֹא תִכְבֶּה
  choice: वह आग नहीं बुझेगी
  rationale: כבה का अर्थ आग का बुझना है। हिन्दी में कर्ता को स्पष्ट करने के लिए प्रसंग में निहित ‘आग’ जोड़ा गया है; इससे अर्थ नहीं बदला जाता।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: यहाँ עוֹלָם दीर्घ, निरंतर अवधि को दर्शाता है। ‘सदा’ संक्षिप्त, स्वाभाविक और भविष्यद्वाणी की प्रबल भाषा के अनुरूप है।
- source_word: יַעֲלֶה עֲשָׁנָהּ
  choice: उसका धुआँ सदा उठता रहेगा
  rationale: עלה और עשן का संयोजन धुएँ के ऊपर उठते रहने को व्यक्त करता है। ‘उसका’ स्त्रीलिंग भूभाग के संकेत को सहज हिन्दी में व्यक्त करता है।
- source_word: מִדּוֹר לָדוֹר
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह रूढ़ पद लगातार आने वाली पीढ़ियों में बनी रहने वाली दशा बताता है। चुना हुआ रूप वर्तमान हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: תֶּחֱרָב
  choice: वह उजाड़ पड़ी रहेगी
  rationale: חרב यहाँ उजाड़ किए जाने से उत्पन्न स्थायी दशा को सूचित करता है। ‘उजाड़ पड़ी रहेगी’ उस परिणामी अवस्था और अगले उपवाक्य के निर्जन भाव दोनों को बनाए रखता है।
- source_word: לְנֵצַח נְצָחִים
  choice: सदा-सर्वदा
  rationale: दोहराया हुआ पद अनंत अथवा अत्यंत दीर्घ स्थायित्व पर बल देता है। ‘सदा-सर्वदा’ हिन्दी में उसी प्रबल पुनरुक्ति को सहजता से व्यक्त करता है।
- source_word: אֵין עֹבֵר בָּהּ
  choice: कोई उसमें से होकर नहीं गुज़रेगा
  rationale: אֵין के साथ कृदंत עֹבֵר वहाँ से होकर जाने वाले किसी भी व्यक्ति के अभाव को दर्शाता है। भविष्यकाल प्रसंग में घोषित होने वाले परिणाम को स्पष्ट करता है।
theological_decisions:
- issue: न्याय-वाणी में अवधि-सूचक भाषा
  choice: עוֹלָם और נֵצַח נְצָחִים को क्रमशः ‘सदा’ और ‘सदा-सर्वदा’ के रूप में उनकी पूरी प्रबलता के साथ रखा गया है।
  alternative: इन्हें ‘बहुत समय तक’ या ‘युगों तक’ कहकर सीमित अवधि के रूप में प्रस्तुत करना।
  rationale: इब्रानी पाठ स्थायित्व पर बल देने के लिए अवधि-सूचक शब्दों को संचित करता है। अनुवाद को इस भविष्यद्वाणीगत तनाव को किसी पूर्वनिर्धारित धर्मवैज्ञानिक निष्कर्ष से नरम नहीं करना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘रात-दिन’, ‘पीढ़ी-दर-पीढ़ी’ और ‘सदा-सर्वदा’ मूल की लय तथा कालगत बल को स्वाभाविक हिन्दी में व्यक्त करते हैं। ‘आग’ प्रसंग से स्पष्ट निहित कर्ता है और हिन्दी में ‘बुझेगी’ को सहज बनाने के लिए जोड़ा गया है।
