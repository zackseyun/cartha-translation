  yaml_path: translation/ot/isaiah/034/009.yaml
  text: Her wadis will be turned into pitch[a], and her dust into sulfur[b]; her land will become burning pitch.
translation:
  language: hi
  text: उसके बरसाती नाले[a] डामर में बदल जाएँगे, और उसकी धूल गंधक[b] में; उसकी भूमि जलते हुए डामर में बदल जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जलधाराएँ” अथवा “नालों के पाट।” इब्रानी शब्द मौसमी नाले, उनके पाट या तेज़ जलधारा को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “सल्फर।” पारंपरिक नाम “गंधक” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶהֶפְכוּ
  choice: बदल जाएँगे
  rationale: निफ़अल रूप यहाँ निष्क्रिय परिवर्तन और भविष्यसूचक परिणाम व्यक्त करता है; ‘बदल जाएँगे’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: נְחָלֶיהָ
  choice: उसके बरसाती नाले
  rationale: נחל सूखे प्रदेश में बरसात के समय बहने वाले नाले, जलधारा या उसके पाट को दर्शा सकता है। एदोम के भौगोलिक संदर्भ में ‘बरसाती नाले’ अर्थ को स्पष्ट रखता है।
- source_word: זֶפֶת
  choice: डामर
  rationale: यह शब्द प्राकृतिक पिच या बिटुमेन को दर्शाता है। ‘डामर’ सामान्य हिन्दी में समझने योग्य है और काले, ज्वलनशील पदार्थ की छवि बनाए रखता है।
- source_word: עֲפָרָהּ
  choice: उसकी धूल
  rationale: עפר का सामान्य अर्थ धूल या सूखी, ढीली मिट्टी है। ‘धूल’ उजाड़ भूमि की तीखी छवि को सुरक्षित रखती है।
- source_word: גָפְרִית
  choice: गंधक
  rationale: ‘गंधक’ आधुनिक मानक हिन्दी में सल्फर का परिचित नाम है और न्याय की अग्निमय छवि के अनुकूल है।
- source_word: אַרְצָהּ
  choice: उसकी भूमि
  rationale: ארץ यहाँ न्याय के अधीन राष्ट्र के भूभाग को दर्शाता है; ‘भूमि’ सटीक और गरिमापूर्ण है।
- source_word: בֹּעֵרָה
  choice: जलता हुआ
  rationale: कर्ता-वाचक कृदंत डामर की जलती हुई दशा बताता है; यह चयन उसके वर्णनात्मक बल को बनाए रखता है।
theological_decisions:
- issue: न्याय के अधीन देश का स्त्रीलिंगी मानवीकरण
  choice: स्त्रीलिंगी संबंधसूचक रूप ‘उसकी’ को बनाए रखना
  alternative: निर्जीव भूभाग के रूप में ‘उसका’ कहना
  rationale: इब्रानी में बार-बार स्त्रीलिंगी एकवचन प्रत्यय आते हैं। हिन्दी में ‘भूमि’ भी स्त्रीलिंग है, इसलिए ‘उसकी’ मूल के मानवीकरण और काव्यात्मक प्रभाव दोनों को स्वाभाविक रूप से सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और भविष्यवाणी की गंभीरता के अनुरूप रखी गई है। ‘बरसाती नाले’ मरुस्थलीय भूगोल को सामान्य पाठक के लिए समझने योग्य बनाता है; ‘डामर’ और ‘गंधक’ विनाश की ठोस, ज्वलनशील छवि बनाए रखते हैं।
