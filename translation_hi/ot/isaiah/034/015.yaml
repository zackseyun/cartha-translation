  text: There the arrow snake will nest and lay eggs[a], and hatch them, and gather them in her shadow; indeed, there the kites will gather[c][b], each with her mate.
translation:
  language: hi
  text: वहाँ तीर-साँप[a] घोंसला बनाएगा और अंडे देगा; वह अंडों से बच्चे निकालेगा और अपनी छाया में उन्हें सेएगा[b]। निश्चय ही, वहीं चीलें[c] इकट्ठी होंगी, एक-एक अपनी साथी के साथ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द קִפּוֹז का अर्थ अनिश्चित है; इसका अनुवाद ‘उल्लू’ या कोई अन्य मरुस्थलीय जीव भी किया गया है।
    reason: alternative_reading
  - marker: b
    text: या, “अपनी छाया में उन्हें समेटे रखेगा।”
    reason: lexical_alternative
  - marker: c
    text: या, “गिद्ध”; अधिक सामान्य अर्थ में, “शिकारी पक्षी।”
    reason: alternative_reading
lexical_decisions:
- source_word: קִפּוֹז
  choice: तीर-साँप
  rationale: यह शब्द इब्रानी बाइबल में केवल यहीं मिलता है और इसका अर्थ अत्यंत अनिश्चित है। आसपास के प्राणी-वर्णन तथा घोंसला बनाने, अंडे देने और सेने की क्रियाओं के बीच ‘तीर-साँप’ एक संभव अर्थ है; अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
- source_word: קִנְּנָה
  choice: घोंसला बनाएगा
  rationale: कנן का मूल अर्थ ‘घोंसला बनाना’ है। भावी उजाड़ का भविष्यदर्शी चित्र होने के कारण हिन्दी में भविष्यकाल स्वाभाविक है।
- source_word: וַתְּמַלֵּט
  choice: और अंडे देगा
  rationale: क्रिया का अर्थ संतान उत्पन्न करना या बाहर लाना हो सकता है। घोंसले और अगली क्रिया בקע के संदर्भ में अंडे देना प्रसंगानुकूल है।
- source_word: וּבָקְעָה
  choice: वह उन्हें सेएगा
  rationale: בקע का शाब्दिक भाव ‘फाड़ना/फूटना’ है; अंडों के संदर्भ में उनसे बच्चे निकलवाने, अर्थात उन्हें सेने का स्वाभाविक हिन्दी रूप लिया गया है।
- source_word: וְדָגְרָה בְצִלָּהּ
  choice: और अपनी छाया में समेटे रखेगा
  rationale: דגר सेने या बच्चों को अपने नीचे सुरक्षित रखने की क्रिया बताता है। ‘समेटे रखेगा’ छाया में संरक्षण के दृश्य को सहज हिन्दी में व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में है।
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ यह कण कथन पर बल देता है, न कि अर्थ को ‘केवल’ तक सीमित करता है।
- source_word: דַיּוֹת
  choice: चीलें
  rationale: यह किसी चील, काइट या शवभक्षी शिकारी पक्षी का बहुवचन जान पड़ता है। आधुनिक हिन्दी में ‘चीलें’ सहज है, जबकि व्यापक विकल्प पादटिप्पणी में दिया गया है।
- source_word: אִשָּׁה רְעוּתָהּ
  choice: एक-एक अपनी साथी के साथ
  rationale: शाब्दिक संरचना ‘हर मादा अपनी संगिनी/साथी के साथ’ का वितरणात्मक भाव रखती है। ‘साथी’ संग-साथ को व्यक्त करता है और मूल में संबंध की प्रकृति को अनावश्यक रूप से निश्चित नहीं करता।
