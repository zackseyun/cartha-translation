source:
  edition: WLC
  text: כִּֽי רִוְּתָ֥ה בַ/שָּׁמַ֖יִם חַרְבִּ֑/י הִנֵּה֙ עַל אֱד֣וֹם תֵּרֵ֔ד וְ/עַל עַ֥ם חֶרְמִ֖/י לְ/מִשְׁפָּֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/005.yaml
  text: For my sword is drenched in the heavens[a]; behold, it will descend on Edom, on the people of my ban[b], for judgment.
translation:
  language: hi
  text: क्योंकि मेरी तलवार आकाश में तृप्त हो चुकी है[a]; देखो, वह एदोम पर, उन लोगों पर जिन्हें मैंने विनाश के लिए समर्पित किया है[b], न्याय के लिए उतरेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आकाश में पूरी तरह तर हो चुकी है” अथवा “आकाश में जी भरकर पी चुकी है।” इब्रानी में तलवार के भरपूर तृप्त या संतृप्त होने का बिंब है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “मेरे हेरेम के लोग”; अर्थात् ईश्वरीय न्याय के अधीन विनाश के लिए अलग किए हुए लोग।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले संदर्भ में आनेवाले न्याय का आधार प्रस्तुत करता है; ‘क्योंकि’ उसके व्याख्यात्मक-कारणसूचक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רִוְּתָה
  choice: तर हो चुकी है
  rationale: רוה का बिंब तृप्त या पूरी तरह भीगी हुई तलवार का है। ‘तर हो चुकी है’ संतृप्ति के हिंसक काव्यात्मक बिंब को बनाए रखता है, जबकि वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בַשָּׁמַיִם
  choice: आकाश में
  rationale: שׁמים यहाँ ऊपर के दैवी/ब्रह्मांडीय क्षेत्र को सूचित करता है। आधुनिक हिन्दी में ‘आकाश में’ स्वाभाविक है और तलवार के नीचे उतरने वाले स्थानिक बिंब को बनाए रखता है।
- source_word: חַרְבִּי
  choice: मेरी तलवार
  rationale: सीधा प्रथम पुरुष एकवचन संबंधसूचक रूप; संदर्भ में तलवार वक्ता के न्याय का साधन है।
- source_word: הִנֵּה
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले इस अव्यय का आधुनिक, गरिमापूर्ण और सुबोध हिन्दी रूप।
- source_word: עַל אֱדוֹם תֵּרֵד
  choice: वह एदोम पर ... उतरेगी
  rationale: 'עַל और ירד के स्थानिक बिंब को सुरक्षित रखता है: आकाश की तलवार एदोम पर नीचे उतरती है।'
- source_word: עַם חֶרְמִי
  choice: उस जाति पर जिसे मैंने विनाश के लिए समर्पित किया है
  rationale: חֵרֶם का अर्थ यहाँ ईश्वरीय न्याय के अधीन विनाश के लिए अलग किया जाना है। विस्तारपूर्ण हिन्दी अस्पष्ट ‘मेरे प्रतिबंध की जाति’ से अधिक बोधगम्य है और केवल ‘शापित’ कहने से उत्पन्न अर्थ-संकुचन से बचती है।
- source_word: לְמִשְׁפָּט
  choice: न्याय करने को
  rationale: מִשְׁפָּט यहाँ न्यायिक कार्रवाई या दंडादेश को सूचित करता है; क्रियात्मक हिन्दी वाक्य में तलवार के उतरने का उद्देश्य स्पष्ट करती है।
theological_decisions:
- issue: दैवी न्याय के संदर्भ में חֵרֶם का अर्थ
  choice: विनाश के लिए समर्पित
  alternative: मेरे प्रतिबंध के अधीन; शापित
  rationale: यह शब्द केवल मौखिक शाप नहीं, बल्कि ईश्वरीय न्याय के अधीन विनाश के लिए अलग किए जाने को दर्शाता है। चुना हुआ रूप उसकी कठोरता बनाए रखते हुए किसी विशिष्ट सांप्रदायिक व्याख्या को नहीं जोड़ता।
- issue: רִוְּתָה में संतृप्ति अथवा तृप्ति का बिंब
  choice: मुख्य पाठ में ‘तर हो चुकी है’
  alternative: तृप्त हो चुकी है; जी भरकर पी चुकी है
  rationale: क्रिया दोनों संबद्ध बिंब जगा सकती है। मुख्य पाठ तलवार की संतृप्ति का स्वाभाविक हिन्दी चित्र देता है और वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, काव्यात्मक-भविष्यद्वाणी संबंधी गरिमा के साथ। ‘देखो’ पुरातन ‘निहारो’ की अपेक्षा अधिक सहज है; ‘तर हो चुकी है’ मूल बिंब को संक्षिप्त रखता है।
