- source_word: חָגְרוּ שָׂק
  choice: उन्होंने टाट ओढ़ लिया है
  rationale: חגר שׂק का शाब्दिक भाव टाट कसने या पहनने का है और यह शोक का चिह्न है। आधुनिक हिन्दी में ‘टाट ओढ़ लिया’ उस क्रिया और शोक-संकेत को सहज रूप से व्यक्त करता है।
- source_word: עַל גַּגּוֹתֶיהָ
  choice: उसकी छतों पर
  rationale: גַּגּוֹת सपाट मकान-छतों को दर्शाता है, जहाँ सार्वजनिक विलाप किया जा सकता था। स्त्रीलिंग प्रत्यय नगर की ओर संकेत करता है।
- source_word: וּבִרְחֹבֹתֶיהָ
  choice: और उसके चौकों में
  rationale: רְחוֹבוֹת नगर के चौड़े सार्वजनिक स्थानों या चौकों को दर्शाता है। ‘चौकों’ पहले पद ‘गलियों’ से मूल का शब्दगत भेद सुरक्षित रखता है।
- source_word: כֻּלֹּה
  choice: सब
  rationale: रूप की दृष्टि से यह स्त्रीलिंग एकवचन ‘उसका समूचा भाग’ है, पर प्रसंग में नगर के समस्त निवासियों के लिए सामूहिक और वितरणात्मक अर्थ देता है।
- source_word: יְיֵלִיל
  choice: विलाप करते हैं
  rationale: ילל ऊँची आवाज़ में शोक मनाने या हाहाकार करने को दर्शाता है। ‘विलाप करते हैं’ dignified, current Hindi में मानवीय शोक का तीव्र भाव देता है।
- source_word: יֹרֵד בַּבֶּכִי
  choice: रोते हुए नीचे उतरते हैं
  rationale: יֹרֵד का मूल अर्थ ‘नीचे उतरना’ है और בַּבֶּכִי रोने के साथ इस क्रिया को जोड़ता है। हिन्दी वचन को सामूहिक ‘सब’ के अनुरूप किया गया है, जबकि भौतिक उतरने और शोक से दब जाने के बीच मूल की संभावित अस्पष्टता पादटिप्पणी में रखी गई है।
