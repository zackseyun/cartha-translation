    text: या, “हर कोई विलाप करता है, आँसुओं में उतरता हुआ।” इब्रानी में शाब्दिक रूप से “रोते हुए नीचे उतरता है” है; यह चित्र सचमुच नीचे उतरने या शोक से अभिभूत होने, दोनों का संकेत कर सकता है।
