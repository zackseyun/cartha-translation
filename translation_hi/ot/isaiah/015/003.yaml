  text: उसकी गलियों में उन्होंने टाट पहन लिया है; उसकी छतों पर और उसके चौकों में हर कोई विलाप करता है[a], रोते हुए नीचे उतरता है।
  philosophy: optimal-equivalence
  footnotes:
