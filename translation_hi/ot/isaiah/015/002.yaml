base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/002.yaml
  text: He has gone up to the temple[a], and Dibon to the high places, to weep. Over Nebo and over Medeba Moab wails; on every head is baldness[b], every beard is cut off.
translation:
  language: hi
  text: वह मन्दिर[a] पर चढ़ गया है, और दीबोन रोने के लिए ऊँचे स्थानों पर। नबो और मेदबा के लिए मोआब विलाप कर रहा है; हर सिर मुँड़ाया हुआ है[b], हर दाढ़ी काट दी गई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घर।” यहाँ इब्रानी शब्द का शाब्दिक अर्थ “घर” है, पर इस प्रसंग में सम्भवतः किसी उपासना-स्थल या मन्दिर का उल्लेख है।
    reason: lexical_alternative
  - marker: b
    text: सिर मुँड़ाना और दाढ़ी काटना शोक के चिह्न थे।
    reason: cultural_note
lexical_decisions:
- source_word: עָלָה
  choice: चढ़ गया है
  rationale: काल पूर्ण हो चुकी क्रिया को शोक-वर्णन की सजीव तात्कालिकता के साथ व्यक्त करता है।
- source_word: הַבַּיִת
  choice: मन्दिर
  rationale: शाब्दिक अर्थ ‘घर’ है, पर ऊँचे स्थानों के साथ धार्मिक प्रसंग में यह उपासना-स्थल या मन्दिर को सूचित करता है; विकल्प पादटिप्पणी में रखा गया है।
- source_word: וְדִיבֹן הַבָּמוֹת
  choice: और दीबोन के ऊँचे स्थानों पर
  rationale: दीबोन स्थाननाम है और ‘ऊँचे स्थान’ धार्मिक उपासना-स्थलों को दर्शाता है। वाक्य-विन्यास की कठिनाई को स्वाभाविक हिन्दी में गति के गन्तव्य के रूप में प्रस्तुत किया गया है।
- source_word: לְבֶכִי
  choice: रोने के लिए
  rationale: לְ के साथ संज्ञा यहाँ प्रयोजन व्यक्त करती है; हिन्दी में क्रियार्थक रूप स्वाभाविक है।
- source_word: נְבוֹ
  choice: नबो
  rationale: स्थाननाम का हिन्दी लिप्यन्तरण।
- source_word: מֵידְבָא
  choice: मेदबा
  rationale: स्थाननाम का हिन्दी लिप्यन्तरण।
- source_word: מוֹאָב יְיֵלִיל
  choice: मोआब विलाप कर रहा है
  rationale: मोआब सामूहिक रूप से उसके लोगों/देश को दर्शाता है; ילל ऊँचे स्वर में शोक करने का बोध देता है।
- source_word: בְּכָל רֹאשָׁיו קָרְחָה
  choice: हर सिर मुँड़ा हुआ है
  rationale: शाब्दिक ‘हर सिर पर गंजापन’ यहाँ शोक में सिर मुँड़ाने की प्रथा को दर्शाता है; हिन्दी में यह अर्थ स्पष्ट और स्वाभाविक है।
- source_word: כָּל זָקָן גְּרוּעָה
  choice: हर दाढ़ी काट दी गई है
  rationale: वितरणात्मक अभिव्यक्ति और शोक के चिह्न के रूप में दाढ़ी काटे जाने का कर्मवाच्य भाव सुरक्षित है।
