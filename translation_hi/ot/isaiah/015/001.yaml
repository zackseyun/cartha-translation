  yaml_path: translation/ot/isaiah/015/001.yaml
  text: 'An oracle concerning Moab: because in a night Ar of Moab is devastated[a], it is destroyed; because in a night Kir of Moab is devastated[c][b], it is destroyed.'
translation:
  language: hi
  text: 'मोआब के विषय में भविष्यवाणी:[a]


    क्योंकि एक ही रात में मोआब का आर उजाड़ दिया गया—वह नष्ट हो गया;


    क्योंकि एक ही रात में मोआब का कीर उजाड़ दिया गया—वह नष्ट हो गया।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “भविष्यवाणी” के लिए प्रयुक्त इब्रानी शब्द का अनुवाद “भारी संदेश” या “घोषणा” भी हो सकता है। यहाँ यह न्याय की भविष्यवाणी का शीर्षक है।
    reason: lexical_alternative
  - marker: b
    text: “नष्ट हो गया” के लिए प्रयुक्त इब्रानी क्रिया का अनुवाद “मिट गया,” “काट दिया गया” या “मौन कर दिया गया” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: भविष्यवाणी
  rationale: भविष्यद्वाणी-संबंधी शीर्षक में यह शब्द विशेषतः न्याय की गंभीर ईश्वरीय घोषणा को प्रस्तुत करता है। आधुनिक हिन्दी में ‘भविष्यवाणी’ स्वाभाविक और बोधगम्य है; ‘भार’ का शाब्दिक अनुवाद यहाँ भ्रामक हो सकता है।
- source_word: מוֹאָב
  choice: मोआब
  rationale: स्थान और जाति के नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह घोषणा में बताए गए न्याय का कारण अथवा आधार प्रस्तुत करता है; दोनों समानांतर पंक्तियों में इसकी पुनरावृत्ति रखी गई है।
- source_word: בְּלֵיל
  choice: एक ही रात में
  rationale: अनिश्चित ‘एक रात में’ की तुलना में यह हिन्दी में एक रात के भीतर अचानक घटे विनाश पर अधिक स्वाभाविक ढंग से बल देता है।
- source_word: שֻׁדַּד
  choice: उजाड़ दिया गया
  rationale: निफ़अल रूप हिंसक लूट और उजाड़े जाने को व्यक्त करता है। यह ‘नष्ट’ से अलग शब्द रखकर इब्रानी समानांतरता को सुरक्षित करता है।
- source_word: עָר מוֹאָב
  choice: मोआब का आर
  rationale: मोआबी नगर के व्यक्तिवाचक नाम को लिप्यंतरित करते हुए इब्रानी संबंधसूचक रचना को स्वाभाविक हिन्दी में रखा गया है।
- source_word: נִדְמָה
  choice: वह नष्ट हो गया
  rationale: इस विनाश-वर्णन में क्रिया का अर्थ मिट जाना या नष्ट हो जाना है। ‘चुप हो गया’ संभावित शब्दार्थ को अधिक शाब्दिक रूप में रखता, पर नगरों के संदर्भ में आधुनिक हिन्दी में अस्पष्ट होता।
- source_word: קִיר מוֹאָב
  choice: मोआब का कीर
  rationale: स्थान के नाम का लिप्यंतरण और संबंधसूचक रचना का स्वाभाविक हिन्दी रूप।
