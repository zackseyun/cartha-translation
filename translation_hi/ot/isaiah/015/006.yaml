  text: כִּֽי מֵ֥י נִמְרִ֖ים מְשַׁמּ֣וֹת יִֽהְי֑וּ כִּֽי יָבֵ֤שׁ חָצִיר֙ כָּ֣לָה דֶ֔שֶׁא יֶ֖רֶק לֹ֥א הָיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/006.yaml
  text: For the waters of Nimrim will become desolations[a], for the grass is dried up, the vegetation is gone, and no green thing remains.
translation:
  language: hi
  text: क्योंकि निम्रीम के जल उजाड़ हो जाएंगे[a]; घास सूख गई है, हरियाली समाप्त हो गई है, और कोई हरी चीज़ नहीं बची।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उजाड़ पड़े होंगे” अथवा “उजाड़ स्थान बन जाएंगे।” इब्रानी वाक्यांश संक्षिप्त है और इसका आशय या तो स्वयं जल का उजड़ जाना हो सकता है, या उस जल के आसपास के क्षेत्र का उजाड़ हो जाना।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह विलाप और न्याय के प्रसंग में पिछले कथन का कारण अथवा स्पष्टीकरण प्रस्तुत करता है; दोनों बार इसका कारणवाचक बल स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: מֵי נִמְרִים
  choice: निम्रीम का जल
  rationale: מֵי का अर्थ ‘का जल/के जल’ है और נִמְרִים स्थान-नाम है; हिन्दी में सामूहिक एकवचन ‘जल’ अधिक स्वाभाविक है।
- source_word: מְשַׁמּוֹת יִהְיוּ
  choice: उजाड़ हो जाएगा
  rationale: היה विधेय संज्ञा के साथ ‘होना’ या ‘हो जाना’ व्यक्त कर सकता है। यहाँ बदलकर उजाड़ दशा में पहुँचने का भाव है; हिन्दी में जल के सामूहिक एकवचन के अनुसार क्रिया रखी गई है।
- source_word: יָבֵשׁ חָצִיר
  choice: घास सूख गई है
  rationale: पूर्ण क्रिया सूखने के फलस्वरूप उत्पन्न दशा बताती है; यह अनुवाद चित्र और पूर्णता दोनों को सहज हिन्दी में रखता है।
- source_word: כָּלָה דֶשֶׁא
  choice: हरियाली समाप्त हो गई है
  rationale: דֶשֶׁא नई उगी हुई वनस्पति या हरियाली को दर्शाता है, और כָּלָה उसके पूरी तरह मिट जाने को; ‘समाप्त हो गई है’ इस पूर्ण हानि को स्पष्ट करता है।
- source_word: יֶרֶק לֹא הָיָה
  choice: कोई हरी चीज़ नहीं बची
  rationale: יֶרֶק व्यापक रूप से हरी बढ़वार को दर्शाता है। अस्तित्व के निषेध को वर्तमान विनाश के संचयी वर्णन में स्वाभाविक रूप से ‘नहीं बची’ कहा गया है।
