  text: עַל כֵּ֖ן יִתְרָ֣ה עָשָׂ֑ה וּ/פְקֻדָּתָ֔/ם עַ֛ל נַ֥חַל הָ/עֲרָבִ֖ים יִשָּׂאֽוּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/007.yaml
  text: Therefore the abundance they have gained and what they have stored up they carry away over the Brook of the Willows[a][b].
translation:
  language: hi
  text: इसलिए वे अपनी अर्जित प्रचुरता और जो कुछ उन्होंने जमा कर रखा है, उन्हें मजनूँ-वृक्षों के नाले[a][b] के पार ले जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अरावा की वादी के पार’ अथवा ‘मरुभूमि के मैदानों की घाटी के पार।’ इब्रानी पद का अर्थ अनिश्चित है; परंपरागत अनुवाद ‘मजनूँ-वृक्षों का नाला’ है।
    reason: alternative_reading
  - marker: b
    text: ‘जो कुछ उन्होंने जमा कर रखा है’ वाला इब्रानी पद कठिन है। इसका अर्थ ‘उनकी संपत्ति’ या ‘जो कुछ उन्हें सौंपा गया था’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְרָה
  choice: बहुतायत
  rationale: यह संज्ञा बची हुई मात्रा, अधिकता या प्रचुर संपत्ति का बोध कराती है। पलायन के प्रसंग में ‘बहुतायत’ संचित माल को व्यक्त करती है, पर उसे केवल धन तक सीमित नहीं करती।
- source_word: עָשָׂה
  choice: उन्होंने ... अर्जित की है
  rationale: रूप की दृष्टि से क्रिया एकवचन पुल्लिंग है, पर यहाँ सामूहिक अर्थ में मोआबियों की अर्जित बहुतायत की ओर संकेत करती है। ‘अर्जित की है’ हिन्दी में प्रसंगानुकूल और स्वाभाविक है।
- source_word: וּפְקֻדָּתָם
  choice: और जो कुछ जमा कर रखा है
  rationale: यह कठिन पद भंडार, अधिकार में रखी वस्तुओं, संपत्ति या सौंपी गई सामग्री को सूचित कर सकता है। समानांतर पद और पलायन के संदर्भ में यह अनुवाद स्वाभाविक है; अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: נַחַל
  choice: नाला
  rationale: यह शब्द प्रायः मौसमी जलधारा या वादी के लिए आता है। ‘नाला’ सामान्य आधुनिक हिन्दी में सहज है और स्थलरूप का पर्याप्त संकेत देता है।
- source_word: הָעֲרָבִים
  choice: मजनूँ-वृक्षों
  rationale: परंपरागत व्याख्या इसे विलो अथवा पॉपलर-जैसे वृक्षों से जोड़ती है। ‘मजनूँ-वृक्ष’ विलो के लिए हिन्दी में उपलब्ध नाम है; इब्रानी पद की वैकल्पिक भौगोलिक समझ पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: יִשָּׂאוּם
  choice: उसे वे ... ले जाते हैं
  rationale: נשׂא का मूल अर्थ उठाना या ढोना है। यहाँ प्रत्यय पहले उल्लिखित माल-सामान की ओर लौटता है और पलायन के संदर्भ में ‘ले जाते हैं’ स्वाभाविक है।
