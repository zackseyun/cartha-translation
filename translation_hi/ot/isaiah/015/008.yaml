translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘संकट की पुकार’ और ‘विलाप’ के बीच इब्रानी शब्दभेद बचाया गया है तथा ‘उसका विलाप’ की काव्यात्मक पुनरावृत्ति भी बनाए रखी गई है। स्थान-नाम आधुनिक हिन्दी देवनागरी में लिप्यंतरित हैं।
