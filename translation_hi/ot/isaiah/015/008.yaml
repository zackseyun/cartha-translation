source:
  edition: WLC
  text: כִּֽי הִקִּ֥יפָה הַ/זְּעָקָ֖ה אֶת גְּב֣וּל מוֹאָ֑ב עַד אֶגְלַ֨יִם֙ יִלְלָתָ֔/הּ וּ/בְאֵ֥ר אֵילִ֖ים יִלְלָתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/008.yaml
  text: For the outcry has gone around the border of Moab[a]; its wailing reaches as far as Eglaim[b], and its wailing to Beer-elim.
translation:
  language: hi
  text: क्योंकि संकट की पुकार मोआब की सीमा के चारों ओर फैल गई है[a]; उसका विलाप एग्लैम तक और उसका विलाप बेर-एलीम[b] तक पहुँच गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पुकार मोआब की सीमा को चारों ओर से घेर चुकी है।” इब्रानी क्रिया पुकार के पूरी सीमा के चारों ओर जाने का चित्र बनाए रखती है।
    reason: lexical_alternative
  - marker: b
    text: बेर-एलीम एक स्थान का नाम है; इसका अर्थ संभवतः “एलीम का कुआँ” या “बलवानों का कुआँ” है।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले विलाप का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִקִּיפָה
  choice: चारों ओर फैल गई है
  rationale: क्रिया सीमा के चारों ओर जाने या उसे घेर लेने का स्थानिक चित्र देती है। मुख्य पाठ में स्वाभाविक हिन्दी रखते हुए ‘चारों ओर’ से यह चित्र बचाया गया है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: הַזְּעָקָה
  choice: संकट की पुकार
  rationale: यह गहरे संकट में उठी तीव्र सार्वजनिक पुकार है। ‘संकट की पुकार’ साधारण ‘पुकार’ से अधिक स्पष्ट है और आगे के ‘विलाप’ से भी भिन्न रहती है।
- source_word: אֶת גְּבוּל מוֹאָב
  choice: मोआब की सीमा
  rationale: גְּבוּל का मूल भौगोलिक अर्थ ‘सीमा’ है; इसे ‘प्रदेश’ बनाकर व्यापक नहीं किया गया।
- source_word: עַד
  choice: तक
  rationale: यह विलाप के भौगोलिक विस्तार की अंतिम पहुँच बताता है।
- source_word: אֶגְלַיִם
  choice: एग्लैम
  rationale: स्थान-नाम का हिन्दी लिप्यंतरण किया गया है।
- source_word: יִלְלָתָהּ
  choice: उसका विलाप
  rationale: יִלְלָה शोक की ऊँची विलाप-ध्वनि को दर्शाता है। इब्रानी में इसकी पुनरावृत्ति को दोनों स्थानों के साथ बनाए रखा गया है।
- source_word: וּבְאֵר אֵילִים
  choice: और बेर-एलीम तक
  rationale: दूसरे स्थान-नाम को पहले के समान भौगोलिक विस्तार के समानांतर रखा गया है और हिन्दी में लिप्यंतरित किया गया है।
