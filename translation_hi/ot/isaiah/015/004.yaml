reference: Isaiah 15:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תִּזְעַ֤ק חֶשְׁבּוֹן֙ וְ/אֶלְעָלֵ֔ה עַד יַ֖הַץ נִשְׁמַ֣ע קוֹלָ֑/ם עַל כֵּ֗ן חֲלֻצֵ֤י מוֹאָב֙ יָרִ֔יעוּ נַפְשׁ֖/וֹ יָ֥רְעָה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/004.yaml
  text: Heshbon and Elealeh cry out[a]; their voice is heard as far as Jahaz. Therefore the armed men of Moab cry out[b]; his soul trembles within him.
translation:
  language: hi
  text: हेशबोन और एलाले चिल्ला उठते हैं; उनकी आवाज़ यहस तक सुनाई देती है। इसलिए मोआब के हथियारबंद योद्धा पुकार उठते हैं[a]; उसका प्राण भीतर ही भीतर काँपता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मोआब के हथियारबंद योद्धा युद्धघोष करते हैं।” इब्रानी क्रिया ऊँची पुकार या युद्धघोष—दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम इब्रानी वाक्यांश कठिन है; इसका अनुवाद “उसका प्राण उसके लिए व्याकुल है” या “उसका प्राण भीतर से टूट गया है” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְעַק
  choice: चिल्ला उठते हैं
  rationale: זעק संकट या भय में निकली ऊँची पुकार को दर्शाता है। नगरों को मानवीय रूप में बहुवचन कर्ता मानते हुए वर्तमानकालीन काव्यात्मक जीवंतता रखी गई है।
- source_word: חֶשְׁבּוֹן וְאֶלְעָלֵה
  choice: हेशबोन और एलाले
  rationale: स्थान-नामों का अर्थानुवाद न करके प्रचलित हिंदी बाइबलीय रूपों के निकट लिप्यंतरण किया गया है।
- source_word: עַד יַהַץ
  choice: यहस तक
  rationale: עַד पुकार के पहुँचने की सीमा बताता है; हिंदी में ‘तक’ स्वाभाविक और संक्षिप्त है।
- source_word: נִשְׁמַע קוֹלָם
  choice: उनकी आवाज़ ... सुनाई देती है
  rationale: קוֹל का मूल बिंब ‘आवाज़’ से सुरक्षित रहता है और बहुवचन प्रत्यय दोनों मानवीकृत नगरों की ओर संकेत करता है।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पहले वर्णित संकट से निकलने वाला परिणाम सूचित करता है।
- source_word: חֲלֻצֵי מוֹאָב
  choice: मोआब के हथियारबंद योद्धा
  rationale: חֲלֻצִים युद्ध के लिए सुसज्जित लोगों को सूचित करता है। ‘हथियारबंद योद्धा’ सैन्य संदर्भ को स्पष्ट रखते हुए स्वाभाविक हिंदी देता है।
- source_word: יָרִיעוּ
  choice: पुकार उठते हैं
  rationale: हिफ़ील रूप ऊँची पुकार या जयघोष का अर्थ दे सकता है। प्रसंग में यह संकट की पुकार भी हो सकती है, इसलिए ‘युद्धघोष’ कहकर अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: נַפְשׁוֹ
  choice: उसका प्राण
  rationale: נפש यहाँ भीतरी व्यक्ति, जीवन या प्राण को सूचित कर सकता है। ‘प्राण’ काव्यात्मक बिंब और एकवचन प्रत्यय दोनों को बनाए रखता है।
- source_word: יָרְעָה לוֹ
  choice: भीतर ही भीतर काँपता है
  rationale: यह कठिन इब्रानी पदबंध टूटने, व्याकुल होने या काँपने का भाव दे सकता है। मुख्य पाठ में स्वाभाविक भावार्थ दिया गया और अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: अंतिम खंड में एकवचन सर्वनाम का संदर्भ
  choice: ‘उसका प्राण’ के रूप में एकवचन सुरक्षित रखा गया
  alternative: ‘उनके प्राण’ या ‘मोआब का प्राण’
  rationale: मसोरेटिक पाठ में נַפְשׁוֹ और לוֹ दोनों एकवचन हैं। संदर्भ अस्पष्ट होने पर भी उसे बहुवचन बनाकर चुपचाप स्पष्ट करना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘चिल्ला उठते हैं’ और ‘पुकार उठते हैं’ संकट की तीव्रता व्यक्त करते हैं, जबकि अंतिम कठिन खंड की वास्तविक अस्पष्टता पादटिप्पणी में संरक्षित है।
