  text: כִּ֣י מֵ֤י דִימוֹן֙ מָ֣לְאוּ דָ֔ם כִּֽי אָשִׁ֥ית עַל דִּימ֖וֹן נוֹסָפ֑וֹת לִ/פְלֵיטַ֤ת מוֹאָב֙ אַרְיֵ֔ה וְ/לִ/שְׁאֵרִ֖ית אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/009.yaml
  text: 'For the waters of Dimon are full of blood[a], for I will bring more upon Dimon: a lion upon the fugitives of Moab[c][b], and upon the remnant of the land.'
translation:
  language: hi
  text: क्योंकि दीमोन का जल लहू से भर गया है[a]; क्योंकि मैं दीमोन पर और भी लाऊँगा[b]—मोआब के भागे हुए लोगों पर एक सिंह[c], और भूमि के बचे हुए भाग पर भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दीमोन’ नाम में ‘लहू’ के इब्रानी शब्द दाम के साथ शब्दालंकार हो सकता है। कुछ विद्वान इस स्थाननाम को दीबोन से जोड़ते हैं।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: ‘मैं दीमोन पर अतिरिक्त चीज़ें रखूँगा।’ इब्रानी पाठ यह स्पष्ट नहीं करता कि वे अतिरिक्त चीज़ें क्या हैं।'
    reason: alternative_reading
  - marker: c
    text: यह ‘सिंह’ वास्तविक सिंह भी हो सकता है, या आगे आने वाले न्याय का रूपक भी।
    reason: alternative_reading
lexical_decisions:
- source_word: מֵי דִימוֹן
  choice: दीमोन का जल
  rationale: מֵי का अर्थ यहाँ सामूहिक रूप से ‘जल’ है। मसोराई पाठ के स्थाननाम ‘दीमोन’ को रखा गया है, जिससे דָם (‘लहू’) के साथ संभावित शब्दालंकार भी बना रहता है।
- source_word: מָלְאוּ דָם
  choice: लहू से भर गया है
  rationale: मूल का सजीव रक्तपात-बिंब स्वाभाविक आधुनिक हिन्दी में सुरक्षित रहता है। ‘जल’ को सामूहिक एकवचन मानकर क्रिया एकवचन में है।
- source_word: כִּי ... כִּי
  choice: क्योंकि ... क्योंकि
  rationale: दोनों כִּי को व्यक्त करने से मूल की व्याख्यात्मक और बलाघाती पुनरावृत्ति सुरक्षित रहती है।
- source_word: אָשִׁית עַל דִּימוֹן נוֹסָפוֹת
  choice: मैं दीमोन पर और भी विपत्तियाँ लाऊँगा
  rationale: שׂים על का प्रसंगानुकूल अर्थ ‘पर लाना’ है। נוֹסָפוֹת में वस्तु निहित है; ‘विपत्तियाँ’ न्याय-वाणी के संदर्भ को स्वाभाविक बनाता है, जबकि पादटिप्पणी अधिक शाब्दिक अनिश्चितता बताती है।
- source_word: לִפְלֵיטַת מוֹאָב
  choice: मोआब के बचे हुए भगोड़ों पर
  rationale: פְלֵיטָה भागकर बच निकलने वालों को दर्शाता है। ‘बचे हुए भगोड़े’ जीवित बचने और पलायन, दोनों भावों को व्यक्त करता है।
- source_word: אַרְיֵה
  choice: एक सिंह
  rationale: ठोस एकवचन बिंब को बिना यह तय किए रखा गया है कि सिंह वास्तविक है या रूपक।
- source_word: וְלִשְׁאֵרִית אֲדָמָה
  choice: और देश में बचे हुए लोगों पर भी
  rationale: शाब्दिक रचना ‘भूमि/देश के बचे हुए भाग’ संदर्भ में उन लोगों की ओर संकेत करती है जो देश में रह गए हैं। हिन्दी में यह रूप अधिक स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: न्याय-वाणी में ‘सिंह’ का स्वरूप
  choice: मुख्य पाठ में ठोस बिंब ‘एक सिंह’ को बनाए रखा गया।
  alternative: इसे वास्तविक सिंह, आक्रमणकारी शक्ति या आगे आने वाली विपत्ति का रूपक मानना।
  rationale: इब्रानी पाठ सिंह की पहचान स्पष्ट नहीं करता; इसलिए अनुवाद उस भविष्यद्वाणी-संबंधी अस्पष्टता को हल नहीं करता।
- issue: נוֹסָפוֹת में निहित अतिरिक्त वस्तु
  choice: प्रसंगानुसार ‘और भी विपत्तियाँ’ कहा गया, साथ में पादटिप्पणी में शाब्दिक अनिश्चितता दी गई।
  alternative: ‘और भी बातें/अतिरिक्त चीज़ें’ या केवल ‘और भी’ कहना।
  rationale: मूल संज्ञा को स्पष्ट नहीं करता। हिन्दी मुख्य पाठ में वाक्य को बोधगम्य रखने के लिए न्याय-संदर्भ के अनुरूप ‘विपत्तियाँ’ है, पर इसे मूल का एकमात्र संभव अर्थ नहीं माना गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, सहज भविष्यद्वाणी-शैली अपनाई गई है। ‘लहू’ काव्यात्मक और बाइबिलीय संदर्भ में स्वाभाविक है; ‘खून’ की अपेक्षा ऊँचा किंतु सामान्यतः बोधगम्य रजिस्टर देता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में क्रम से दिए गए हैं।
