source:
  edition: WLC
  text: לִבִּ/י֙ לְ/מוֹאָ֣ב יִזְעָ֔ק בְּרִיחֶ֕/הָ עַד צֹ֖עַר עֶגְלַ֣ת שְׁלִשִׁיָּ֑ה כִּ֣י מַעֲלֵ֣ה הַ/לּוּחִ֗ית בִּ/בְכִי֙ יַֽעֲלֶה בּ֔/וֹ כִּ֚י דֶּ֣רֶךְ חוֹרֹנַ֔יִם זַעֲקַת שֶׁ֖בֶר יְעֹעֵֽרוּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/005.yaml
  text: My heart cries out for Moab[a]; her fugitives flee as far as Zoar, as far as Eglath-shelishiyah. For they go up the ascent of Luhith with weeping[c][b]; for on the road to Horonaim they raise a cry of destruction.
translation:
  language: hi
  text: मेरा हृदय मोआब के लिए पुकार उठता है। उसके भागे हुए लोग[a] सोअर तक, एग्लत-शलीशियाह[b] तक पहुँचते हैं। वे लूहीत की चढ़ाई पर रोते हुए चढ़ते हैं[c]; और होरोनैम के मार्ग पर वे विनाश की पुकार उठाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ का इब्रानी शब्द कठिन है। इसका अर्थ “उसके भागे हुए लोग” या “उसके शरणार्थी” हो सकता है; अधिक शाब्दिक रूप में इसका अर्थ “उसकी अर्गलाएँ” अर्थात दरवाज़ों को बन्द करने वाली छड़ें भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: एग्लत-शलीशियाह सम्भवतः किसी स्थान का नाम है। इस अभिव्यक्ति का शाब्दिक अर्थ “तीन वर्ष की बछिया” भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: इस पद की इब्रानी क्रियाएँ एकवचन और बहुवचन के बीच बदलती हैं। अनुवाद में मोआब के लोगों की सामूहिक गति को स्वाभाविक हिन्दी में व्यक्त करने के लिए बहुवचन रखा गया है।
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: לִבִּי לְמוֹאָב יִזְעָק
  choice: मेरा हृदय मोआब के लिए पुकार उठता है
  rationale: ‘हृदय’ वक्ता के गहरे शोक को बनाए रखता है, और ‘के लिए’ मोआब की ओर से अथवा उसके विषय में उठने वाली करुण पुकार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּרִיחֶיהָ
  choice: उसके भागे हुए लोग
  rationale: शब्द कठिन और विवादित है। विनाश से बचकर सोअर की ओर जाने के प्रसंग में ‘भागे हुए लोग’ उपयुक्त है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: עַד צֹעַר
  choice: सोअर तक
  rationale: עַד यहाँ गति या विस्तार की सीमा बताता है; ‘तक’ इसे संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֶגְלַת שְׁלִשִׁיָּה
  choice: एग्लत-शलीशियाह
  rationale: आसपास के स्थान-नामों और यात्रा-मार्ग के संदर्भ में इसे सम्भावित स्थान-नाम मानकर लिप्यंतरित किया गया है, जबकि इसका शाब्दिक सम्भव अर्थ पादटिप्पणी में दिया गया है।
- source_word: מַעֲלֵה הַלּוּחִית
  choice: लूहीत की चढ़ाई
  rationale: यह किसी ऊँचे चढ़ते हुए मार्ग या ढलान का संकेत देता है; ‘चढ़ाई’ आधुनिक हिन्दी में स्पष्ट और भौगोलिक संदर्भ के अनुकूल है।
- source_word: בִּבְכִי יַעֲלֶה בּוֹ
  choice: वे ... रोते हुए चढ़ते हैं
  rationale: इब्रानी में क्रिया एकवचन है, पर वह मोआब के लोगों को सामूहिक रूप से सूचित कर सकती है। हिन्दी में बहुवचन प्रसंग के सामूहिक भाव को स्वाभाविक बनाता है।
- source_word: דֶּרֶךְ חוֹרֹנַיִם
  choice: होरोनैम के मार्ग पर
  rationale: यह होरोनैम से सम्बद्ध यात्रा-मार्ग को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है, बिना दिशा के विषय में आवश्यकता से अधिक निश्चित हुए।
- source_word: זַעֲקַת שֶׁבֶר יְעֹעֵרוּ
  choice: वे विनाश की पुकार उठाते हैं
  rationale: שֶׁבֶר यहाँ टूटने से बढ़कर विपत्ति और बरबादी का भाव रखता है; ‘पुकार उठाते हैं’ יְעֹעֵרוּ के ‘जगाने/उभारने’ वाले भाव का मुहावरेदार रूप है।
