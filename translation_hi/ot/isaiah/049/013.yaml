source:
  edition: WLC
  text: רָנּ֤וּ שָׁמַ֨יִם֙ וְ/גִ֣ילִי אָ֔רֶץ יפצחו הָרִ֖ים רִנָּ֑ה כִּֽי נִחַ֤ם יְהוָה֙ עַמּ֔/וֹ וַ/עֲנִיָּ֖/ו יְרַחֵֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/013.yaml
  text: Shout for joy[a], O heavens, and rejoice, O earth; let the mountains break out in singing[c][b], for Yahweh has comforted his people and will have compassion on his afflicted ones.
translation:
  language: hi
  text: हे आकाश, आनंद से गाओ[a]! हे पृथ्वी, आनंदित हो! हे पर्वतो, आनंद के गीत गा उठो! क्योंकि याहवे[b] ने अपनी प्रजा को सांत्वना दी है, और वह अपने पीड़ित जनों[c] पर करुणा करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे आकाश, आनंद से जयजयकार करो!” इब्रानी क्रिया आनंद में गाने या ऊँचे स्वर से जयजयकार करने—दोनों का बोध करा सकती है।
    reason: lexical_alternative
  - marker: b
    text: “याहवे” इब्रानी ईश्वरीय नाम YHWH का लिप्यंतरण है; अनेक अनुवादों में इसके स्थान पर “प्रभु” लिखा जाता है।
    reason: alternative_reading
  - marker: c
    text: या, “अपने गरीब जनों,” “अपने दीन जनों,” अथवा “अपने नम्र जनों।” इब्रानी शब्द इन परस्पर संबद्ध अर्थों को व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָנּוּ
  choice: आनंद से गाओ
  rationale: बहुवचन आज्ञार्थक क्रिया उल्लासपूर्ण स्वर में गाने या जयजयकार करने का बोध कराती है। ‘आनंद से गाओ’ काव्यात्मक आह्वान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: पृथ्वी और पर्वतों के साथ समांतर ब्रह्मांडीय संबोधन है; हिन्दी में ‘आकाश’ इसी अर्थ में स्वाभाविक सामूहिक संज्ञा है।
- source_word: וְגִילִי
  choice: मग्न हो
  rationale: यह पृथ्वी को संबोधित स्त्रीलिंग एकवचन आज्ञा है और उल्लासित होने का अर्थ देती है। ‘आनंद-मग्न हो’ की अपेक्षा संक्षिप्त ‘मग्न हो’ पिछले पद के आनंद-संदर्भ में स्वाभाविक है।
- source_word: יפצחו הָרִים רִנָּה
  choice: हे पर्वतो, आनंद के गीत गा उठो
  rationale: शाब्दिक रूप से पर्वतों के आनंद-ध्वनि में फूट पड़ने का मानवीकरण है। ‘गा उठो’ आकस्मिक और प्रबल आरंभ को सहज हिन्दी में बनाए रखता है।
- source_word: נִחַם
  choice: सांत्वना दी है
  rationale: पिएल पूर्ण क्रिया यहाँ अपनी प्रजा को ढाढ़स और उद्धारकारी सांत्वना देने का अर्थ रखती है; पूर्ण कार्य की वर्तमान प्रासंगिकता ‘दी है’ से व्यक्त होती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम YHWH को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: עַמּוֹ
  choice: अपनी प्रजा
  rationale: वाचा-संबंधी सामूहिक अर्थ में ‘प्रजा’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: וַעֲנִיָּו
  choice: अपने पीड़ित जनों
  rationale: इस बहुवचन पद में पीड़ित, दीन, गरीब या नम्र होने की अर्थ-सीमा है। सांत्वना और करुणा के प्रसंग में ‘पीड़ित जन’ व्यापक अर्थ को सबसे अच्छी तरह व्यक्त करता है।
- source_word: יְרַחֵם
  choice: करुणा करेगा
  rationale: अपूर्ण क्रिया आगामी दयापूर्ण कार्य को दर्शाती है; हिन्दी भविष्यकाल मूल के कालगत अंतर को पिछले पूर्ण कार्य से अलग रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम YHWH का प्रयोग करता है। ‘याहवे’ नाम को स्पष्ट रखता है, जबकि ‘प्रभु’ उसे एक उपाधि से प्रतिस्थापित कर देता।
- issue: עָנִי की अर्थ-सीमा
  choice: पीड़ित जन
  alternative: गरीब जन / दीन जन / नम्र जन
  rationale: पद आर्थिक अभाव, सामाजिक उत्पीड़न और दीन दशा—इनमें से एक से अधिक अर्थ धारण कर सकता है। मुख्य पाठ में प्रसंगानुकूल व्यापक विकल्प रखा गया है और अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और जनसुलभ हिन्दी अपनाई गई है। विस्मयादिबोधक वाक्यों से मूल के ब्रह्मांडीय काव्यात्मक आह्वान को रखा गया है। ‘आकाश–पृथ्वी–पर्वत’ की समानांतर रचना और सांत्वना से करुणा की ओर कालगत गति सुरक्षित है।
