id: ISA.49.25
reference: Isaiah 49:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה גַּם שְׁבִ֤י גִבּוֹר֙ יֻקָּ֔ח וּ/מַלְק֥וֹחַ עָרִ֖יץ יִמָּלֵ֑ט וְ/אֶת יְרִיבֵ/ךְ֙ אָנֹכִ֣י אָרִ֔יב וְ/אֶת בָּנַ֖יִ/ךְ אָנֹכִ֥י אוֹשִֽׁיעַ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/025.yaml
  text: 'For thus says Yahweh: Even the captives of the mighty will be taken away[a], and the prey of the ruthless will escape; and I myself will contend with the one who contends with you[b], and I myself will save your children.'
translation:
  language: hi
  text: 'क्योंकि यहोवा यों कहता है:


    “बलवान के बंदी भी उससे छीन लिए जाएँगे,


    और अत्याचारी का शिकार[a] बच निकलेगा;


    जो तुझसे विवाद करता है, उससे मैं स्वयं विवाद करूँगा,


    और तेरे बच्चों[b] को मैं स्वयं बचाऊँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अत्याचारी की लूट।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तेरे बेटों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को सामान्य उपाधि से बदलने के बजाय हिन्दी में प्रचलित बाइबलीय रूप से व्यक्त किया गया है।
- source_word: שְׁבִי גִבּוֹר
  choice: बलवान के बंदी
  rationale: שְׁבִי को यहाँ अमूर्त ‘बन्धुआई’ नहीं, सामूहिक रूप से बंदी बनाए गए लोगों के अर्थ में लिया गया है; גִבּוֹר शक्तिशाली पकड़ने वाले को दर्शाता है।
- source_word: יֻקָּח
  choice: उससे छीन लिए जाएँगे
  rationale: सिर्फ ‘ले लिए जाएँगे’ कहने की तुलना में यह बंदियों को बलवान के अधिकार से निकाल लिए जाने का प्रसंग स्वाभाविक रूप से स्पष्ट करता है।
- source_word: מַלְקוֹחַ עָרִיץ
  choice: अत्याचारी का शिकार
  rationale: מַלְקוֹחַ पकड़ी या लूटी हुई वस्तु अथवा व्यक्ति को और עָרִיץ हिंसक, निर्मम उत्पीड़क को सूचित करता है। ‘शिकार’ पीड़ितों और लूट—दोनों की चित्रात्मक गुंजाइश बनाए रखता है।
- source_word: יִמָּלֵט
  choice: बच निकलेगा
  rationale: निफ़अल रूप में बच निकलने और छुड़ाए जाने दोनों की छाया हो सकती है; ‘बच निकलेगा’ वाक्य की सजीव गति को बनाए रखता है।
- source_word: יְרִיבֵךְ / אָרִיב
  choice: जो तुझसे झगड़ता है, उससे मैं स्वयं झगड़ूँगा
  rationale: एक ही हिन्दी धातु की पुनरावृत्ति मूल के शब्द-संबंध और न्यायिक विवाद अथवा सक्रिय विरोध की सम्भावित दोनों छायाओं को सुरक्षित रखती है।
- source_word: אָנֹכִי
  choice: मैं स्वयं
  rationale: स्वतंत्र सर्वनाम का बल दोनों प्रतिज्ञाओं में यहोवा के व्यक्तिगत हस्तक्षेप पर है।
- source_word: בָּנַיִךְ
  choice: तेरे बच्चों
  rationale: स्त्रीलिंग एकवचन सम्बोधन सिय्योन से है और बहुवचन संज्ञा उसके वंशजों को सामूहिक रूप से सूचित कर सकती है; शाब्दिक ‘बेटों’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אוֹשִׁיעַ
  choice: बचाऊँगा
  rationale: हिफ़ईल रूप उद्धार या छुटकारा देने को व्यक्त करता है; यहाँ ‘बचाऊँगा’ सीधा, स्वाभाविक और प्रसंगानुकूल है।
theological_decisions:
- issue: सिय्योन को सम्बोधित בָּנַיִךְ का दायरा
  choice: तेरे बच्चों
  alternative: तेरे बेटों
  rationale: सिय्योन/यरूशलेम को स्त्रीलिंग एकवचन में सम्बोधित करते हुए यह पद उसके वंशजों की सामूहिक रक्षा की बात करता है। हिन्दी मुख्य पाठ में आशयगत सामूहिकता रखी गई है, जबकि मूल का पुल्लिंग शाब्दिक रूप पादटिप्पणी में दिया गया है।
- issue: ריב की न्यायिक और संघर्षात्मक अर्थछाया
  choice: झगड़ता है / झगड़ूँगा
  alternative: मुकदमा लड़ता है / मुकदमा लड़ूँगा; विरोध करता है / सामना करूँगा
  rationale: किसी एक विशेष न्यायालयी या सैनिक अर्थ को थोपने के बजाय समान धातु की पुनरावृत्ति रखकर मूल की व्यापक विवादात्मक अर्थछाया सुरक्षित की गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक है। ‘तू’ के रूप (‘तुझसे’, ‘तेरे’) सिय्योन को एकवचन स्त्री रूप में किए गए मूल सम्बोधन को बनाए रखते हैं। समानांतर पंक्तियाँ और ‘मैं स्वयं’ की पुनरावृत्ति मूल के बल और लय को सुरक्षित रखती हैं।
