source:
  edition: WLC
  text: הֲ/תִשְׁכַּ֤ח אִשָּׁה֙ עוּלָ֔/הּ מֵ/רַחֵ֖ם בֶּן בִּטְנָ֑/הּ גַּם אֵ֣לֶּה תִשְׁכַּ֔חְנָה וְ/אָנֹכִ֖י לֹ֥א אֶשְׁכָּחֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/015.yaml
  text: Can a woman forget her nursing child[a], and have no compassion on the son of her womb? Even these may forget, yet I will not forget you.
translation:
  language: hi
  text: क्या कोई स्त्री अपने दूध पीते बच्चे को भूल सकती है, और अपने गर्भ के बेटे पर दया करना छोड़ सकती है? चाहे वे भी भूल जाएँ, फिर भी मैं तुझे नहीं भूलूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲתִשְׁכַּח
  choice: क्या ... भूल सकती है
  rationale: प्रश्नवाचक הֲ और अपूर्ण क्रिया मिलकर अलंकारिक प्रश्न बनाते हैं। ‘क्या ... भूल सकती है’ ऐसी घटना की लगभग अकल्पनीय संभावना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִשָּׁה
  choice: कोई स्त्री
  rationale: मूल संज्ञा का अर्थ ‘स्त्री’ है, ‘माँ’ नहीं; आगे का मातृत्व-संबंध प्रसंग से स्पष्ट हो जाता है।
- source_word: עוּלָהּ
  choice: अपने दूध पीते बच्चे को
  rationale: यह शब्द दूध पीने वाले शिशु को दर्शाता है। यह चयन निर्भर शिशु और मातृ-स्नेह की मूल छवि को स्पष्ट, आधुनिक हिन्दी में बनाए रखता है।
- source_word: מֵרַחֵם
  choice: दया करना छोड़ सकती है
  rationale: רחם करुणा या दया करने को व्यक्त करता है। מן के साथ यहाँ उससे विरत होने का भाव है, जिसे प्रश्न की समानांतर संरचना में यह वाक्यांश सहजता से प्रकट करता है।
- source_word: בֶּן בִּטְנָהּ
  choice: अपने गर्भ के बेटे पर
  rationale: शाब्दिक मातृ-छवि और मूल के स्पष्ट בֶּן (‘बेटा’) दोनों सुरक्षित रखे गए हैं।
- source_word: גַּם אֵלֶּה תִשְׁכַּחְנָה
  choice: चाहे ये भी भूल जाएँ
  rationale: गर्भवती या दूध पिलाने वाली स्त्रियों की ओर संकेत करने वाले ‘ये’ का बल रखा गया है। रियायती ‘चाहे’ मातृ-विस्मरण को निश्चित तथ्य न बनाकर उसकी संभावना और आगे के तीखे विरोध को व्यक्त करता है।
- source_word: וְאָנֹכִי לֹא אֶשְׁכָּחֵךְ
  choice: फिर भी मैं तुझे नहीं भूलूँगा
  rationale: ‘फिर भी’ रियायत के बाद का प्रबल विरोध दिखाता है; ‘मैं’ אָנֹכִי के जोर को बनाए रखता है। सिय्योन को संबोधित एकवचन स्त्रीलिंग सर्वनाम के लिए प्रतिष्ठित बाइबलीय हिन्दी ‘तुझे’ उपयुक्त है।
theological_decisions:
- issue: בֶּן בִּטְנָהּ में लिंग-स्पष्ट भाषा
  choice: अपने गर्भ के बेटे पर
  alternative: अपने गर्भ के बच्चे पर
  rationale: मूल में בֶּן स्पष्टतः ‘बेटा’ है। इसलिए मुख्य पाठ में इसे लिंग-निरपेक्ष किए बिना मूल की सटीकता और मातृ-छवि सुरक्षित रखी गई है।
- issue: अलंकारिक तुलना और रियायत का बल
  choice: चाहे ये भी भूल जाएँ, फिर भी मैं तुझे नहीं भूलूँगा
  alternative: ये भी भूल सकती हैं, पर मैं तुझे नहीं भूलूँगा
  rationale: मूल ऐसी असंभव-सी घटना की संभावना स्वीकार करके परमेश्वर की अटल स्मृति से उसका विरोध करता है। ‘चाहे ... फिर भी’ उस तनाव को बनाए रखता है और मातृ-विफलता को निश्चित या सामान्य नहीं बताता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘तुझे’ एकवचन स्त्रीलिंग सिय्योन से सीधे संबोधन और हिन्दी बाइबल की परिचित गंभीर शैली—दोनों के अनुकूल है। अनावश्यक संस्कृतनिष्ठ शब्दावली से बचते हुए ‘दया’ और ‘दूध पीते बच्चे’ जैसे सर्वसुलभ पद चुने गए हैं।
