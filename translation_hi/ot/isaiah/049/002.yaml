base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/002.yaml
  text: And he made my mouth like a sharp sword; in the shadow of his hand he hid me[a]. And he made me into a polished arrow; in his quiver he concealed me.
translation:
  language: hi
  text: और उसने मेरे मुँह को तेज़ तलवार के समान बनाया; अपने हाथ की छाया में उसने मुझे छिपाया। और उसने मुझे चमकाया हुआ तीर बनाया[a]; अपने तरकश में उसने मुझे छिपाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चुना हुआ तीर,” “धारदार तीर,” अथवा “शुद्ध किया हुआ तीर।” इब्रानी विशेषण में शुद्ध या परिष्कृत किए जाने का भाव है और यहाँ संभवतः उपयोग के लिए सावधानी से तैयार किए गए तीर का वर्णन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם פִּי
  choice: उसने मेरे मुँह को ... बनाया
  rationale: परिणामी अवस्था व्यक्त करने वाले इस प्रयोग में שׂוּם के लिए ‘बनाया’ स्वाभाविक है; ‘मेरे मुँह’ का ठोस रूपक भी सुरक्षित रहता है।
- source_word: כְּחֶרֶב חַדָּה
  choice: तेज़ तलवार के समान
  rationale: सीधी उपमा और प्रभावी वाणी की मूर्त छवि को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: בְּצֵל יָדוֹ
  choice: अपने हाथ की छाया में
  rationale: इब्रानी बिंब को निकटता से रखता है और छिपाव अथवा संरक्षण का अर्थ पाठक पर थोपे बिना व्यक्त करता है।
- source_word: הֶחְבִּיאָנִי
  choice: उसने मुझे छिपाया
  rationale: חבא के हिफ़ील रूप का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: וַיְשִׂימֵנִי לְחֵץ בָּרוּר
  choice: उसने मुझे चमकाया हुआ तीर बनाया
  rationale: לְחֵץ के साथ שׂוּם परिणामी रूप या भूमिका बताता है। בָּרוּר में शुद्ध/परिष्कृत/चुने हुए का अर्थ हो सकता है; तीर के ठोस संदर्भ में ‘चमकाया हुआ’ सावधानी से तैयार किए गए तीर का स्वाभाविक बिंब देता है।
- source_word: בְּאַשְׁפָּתוֹ
  choice: अपने तरकश में
  rationale: אַשְׁפָּה का इस प्रसंग में मानक अर्थ ‘तरकश’ है और संबंधसूचक प्रत्यय ‘अपने’ से व्यक्त हुआ है।
- source_word: הִסְתִּירָנִי
  choice: उसने मुझे छिपाकर रखा
  rationale: סתר के हिफ़ील रूप में छिपाने तथा सुरक्षित/आरक्षित रखे जाने का भाव है; ‘छिपाकर रखा’ दूसरे समानांतर खंड में स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: सेवक के मुँह और बुलाहट के लिए हथियारों के रूपक
  choice: ‘तेज़ तलवार’ और ‘चमकाया हुआ तीर’ के ठोस रूपकों को ज्यों का त्यों रखा गया है।
  alternative: मुख्य पाठ में इन्हें स्पष्टतः प्रचार, भविष्यवाणी या मसीही कार्य के रूप में खोलना।
  rationale: पद स्वयं इन रूपकों का पूरा धर्मवैज्ञानिक संदर्भ निर्धारित नहीं करता; इसलिए उसकी काव्यात्मक शक्ति और व्याख्यात्मक खुलापन सुरक्षित रखा गया है।
