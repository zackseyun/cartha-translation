  text: שִׁמְע֤וּ אִיִּים֙ אֵלַ֔/י וְ/הַקְשִׁ֥יבוּ לְאֻמִּ֖ים מֵ/רָח֑וֹק יְהוָה֙ מִ/בֶּ֣טֶן קְרָאָ֔/נִי מִ/מְּעֵ֥י אִמִּ֖/י הִזְכִּ֥יר שְׁמִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/001.yaml
  text: 'Listen to me[a], coastlands, and pay attention, peoples from far away: Yahweh called me from the womb[b]; from my mother’s body he mentioned my name.'
translation:
  language: hi
  text: हे तटवर्ती प्रदेशों, मेरी सुनो[a]; और हे दूर के लोगों, ध्यान दो! यहोवा ने मुझे गर्भ से बुलाया; मेरी माँ की कोख से उसने मेरा नाम लिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तटवर्ती प्रदेशों” का अर्थ “द्वीपों” भी हो सकता है। इब्रानी शब्द दूरस्थ समुद्री द्वीपों या तटवर्ती प्रदेशों दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसने मेरे नाम का उल्लेख किया।” यह अभिव्यक्ति नाम लेने, नाम से बुलाने, या पहले से किसी कार्य के लिए ठहराने का संकेत दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אִיִּים אֵלַי
  choice: हे द्वीप-प्रदेशो, मेरी सुनो
  rationale: बहुवचन आज्ञार्थक और प्रत्यक्ष संबोधन को स्वाभाविक हिन्दी में रखा गया है। אִיִּים केवल द्वीप ही नहीं, समुद्रपारीय तटवर्ती प्रदेशों को भी सूचित कर सकता है; ‘द्वीप-प्रदेश’ दोनों संकेत बनाए रखता है।
- source_word: וְהַקְשִׁיבוּ לְאֻמִּים מֵרָחוֹק
  choice: और हे दूर-दूर के लोगो, ध्यान दो
  rationale: हिफ़ील आज्ञार्थक הַקְשִׁיבוּ का ध्यानपूर्वक सुनने का बल ‘ध्यान दो’ से व्यक्त होता है। לְאֻמִּים को आधुनिक राजनीतिक ‘राष्ट्रों’ तक सीमित न करके ‘लोगो’ कहा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम की सुस्थापित लिप्यंतरण-परंपरा ‘यहोवा’ है; इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: מִבֶּטֶן קְרָאָנִי
  choice: मुझे गर्भ ही से बुलाया
  rationale: קרא का सरल अर्थ ‘बुलाना’ है और प्रसंग में नियुक्ति का भाव भी खुला रहता है। ‘ही’ जन्मपूर्व समय पर दिए गए जोर को स्वाभाविक हिन्दी में उभारता है।
- source_word: מִמְּעֵי אִמִּי
  choice: जब मैं अपनी माँ के शरीर के भीतर था
  rationale: शाब्दिक अर्थ माँ के ‘भीतरी अंगों’ से संबंधित है। इसे फिर से केवल ‘गर्भ’ कहने के बजाय शरीर के भीतर होने के रूप में व्यक्त किया गया है, जिससे समानांतर पंक्तियों का भेद बना रहता है।
- source_word: הִזְכִּיר שְׁמִי
  choice: उसने मेरा नाम लिया
  rationale: हिफ़ील रूप का मूल भाव नाम का उल्लेख या स्मरण कराना है। हिन्दी मुहावरा ‘नाम लिया’ स्वाभाविक है और नामकरण अथवा नियुक्ति को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: यहोवा के नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम יהוה है। हिन्दी पाठकों के लिए परिचित लिप्यंतरण ‘यहोवा’ नाम को नाम ही रहने देता है, उपाधि में नहीं बदलता।
- issue: जन्मपूर्व बुलाहट का स्वरूप
  choice: ‘बुलाया’ और ‘नाम लिया’ के बीच मूल काव्यात्मक तनाव सुरक्षित रखा गया
  alternative: ‘नियुक्त किया’ अथवा ‘नाम रखा’
  rationale: पद बुलाहट और नामोल्लेख की भाषा प्रयोग करता है, पर इनका सटीक धर्मवैचारिक आशय स्पष्ट नहीं करता। इसलिए नियुक्ति या नामकरण को मुख्य पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘हे’ संबोधन काव्यात्मक भविष्यद्वाणी की ऊँची शैली बनाए रखता है, जबकि वाक्य-विन्यास साधारण आधुनिक हिन्दी में सहज है।
