source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה הִנֵּ֨ה אֶשָּׂ֤א אֶל גּוֹיִם֙ יָדִ֔/י וְ/אֶל עַמִּ֖ים אָרִ֣ים נִסִּ֑/י וְ/הֵבִ֤יאוּ בָנַ֨יִ/ךְ֙ בְּ/חֹ֔צֶן וּ/בְנֹתַ֖יִ/ךְ עַל כָּתֵ֥ף תִּנָּשֶֽׂאנָה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/022.yaml
  text: 'Thus says the Lord GOD: Behold[a], I will lift up my hand to the nations, and raise my banner to the peoples; and they will bring your sons in their bosom[b], and your daughters will be carried on the shoulder.'
translation:
  language: hi
  text: 'प्रभु याहवे यों कहता है:


    “देखो, मैं राष्ट्रों की ओर अपना हाथ उठाऊँगा

    और जन-समुदायों की ओर अपनी ध्वजा[a] ऊँची करूँगा।

    वे तेरे पुत्रों को गोद में लेकर लाएँगे,

    और तेरी पुत्रियाँ कंधे पर उठाकर लाई जाएँगी।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपना संकेत-ध्वज” अथवा “अपनी पताका”।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: संयुक्त ईश्वरीय उपाधि में אֲדֹנָי को ‘प्रभु’ और वाचा के नाम יהוה को लिप्यंतरित ‘याहवे’ रखा गया है; इससे दोनों पदों का भेद बना रहता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है। ‘देखो’ भविष्यसूचक घोषणा का बल बनाए रखते हुए आज के पाठक के लिए सहज है।
- source_word: אֶשָּׂא אֶל־גּוֹיִם יָדִי
  choice: मैं राष्ट्रों की ओर अपना हाथ उठाऊँगा
  rationale: हाथ उठाने की मूल दृश्यात्मकता और राष्ट्रों की ओर किए गए सार्वजनिक संकेत—दोनों को बिना अधिक व्याख्या के सुरक्षित रखा गया है।
- source_word: עַמִּים
  choice: जन-समुदायों
  rationale: גּוֹיִם के लिए प्रयुक्त ‘राष्ट्रों’ से शब्दगत भिन्नता रखते हुए समानांतर पंक्ति में लोगों के समूहों का व्यापक अर्थ व्यक्त करता है।
- source_word: אָרִים נִסִּי
  choice: अपनी ध्वजा ऊँची करूँगा
  rationale: נֵס संकेत-ध्वज, पताका अथवा सार्वजनिक रूप से दिखाई देने वाली निशानी हो सकता है। ‘ध्वजा’ उस दृश्य और एकत्र करने वाले संकेत को स्वाभाविक हिंदी में बनाए रखती है।
- source_word: וְהֵבִיאוּ בָנַיִךְ
  choice: वे तेरे पुत्रों को ... उठाकर लाएँगे
  rationale: क्रिया का सक्रिय बहुवचन और ‘पुत्रों’ का स्पष्ट लिंग-सूचक अर्थ सुरक्षित रखा गया है।
- source_word: בְּחֹצֶן
  choice: गोद में
  rationale: शब्द छाती से लगे स्थान, गोद या वस्त्र की तह को सूचित कर सकता है जहाँ बच्चे को निकट रखकर उठाया जाता है। ‘गोद में’ हिंदी में इस आशय को सहजता से व्यक्त करता है।
- source_word: וּבְנֹתַיִךְ עַל־כָּתֵף תִּנָּשֶׂאנָה
  choice: तेरी पुत्रियाँ कंधे पर उठाकर लाई जाएँगी
  rationale: निफ़अल का कर्मवाच्य अर्थ, पुत्रियों का लिंग-सूचक उल्लेख और एकवचन सामूहिक देह-अंग ‘कंधे’ की छवि सुरक्षित रखी गई है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर / प्रभु यहोवा
  rationale: मूल पाठ में वाचा का विशिष्ट नाम יהוה उपस्थित है। ‘याहवे’ उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में रखता है, जबकि ‘प्रभु’ אֲדֹנָי का अलग अनुवाद है।
- issue: हाथ उठाने और ध्वजा ऊँची करने के संकेत का अर्थ
  choice: मूल संकेतात्मक चित्रों को रखा गया
  alternative: मैं राष्ट्रों को बुलाऊँगा
  rationale: संदर्भ में ये क्रियाएँ संभवतः राष्ट्रों को बुलाने या एकत्र करने का संकेत हैं, पर मूल वचन उस उद्देश्य को सीधे नहीं कहता। इसलिए अनुवाद ने चित्र और उसकी अर्थगत खुली गुंजाइश दोनों बनाए रखे हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। परमेश्वर द्वारा स्त्रीलिंग एकवचन में संबोधित सिय्योन के लिए ‘तेरे/तेरी’ रखा गया है। काव्यात्मक समानांतरता दिखाने के लिए पंक्ति-विन्यास अपनाया गया है; ‘राष्ट्रों’ और ‘जन-समुदायों’ से मूल के दो निकटार्थक शब्दों का अंतर भी बना रहता है।
