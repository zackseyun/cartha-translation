base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/014.yaml
  text: But Zion said, “The LORD has forsaken me; my Lord has forgotten me.”
translation:
  language: hi
  text: पर सिय्योन ने कहा, “यहोवा ने मुझे त्याग दिया है; मेरे प्रभु ने मुझे भुला दिया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִיּוֹן
  choice: सिय्योन
  rationale: स्थान और परमेश्वर की प्रजा के व्यक्तिकृत रूप—दोनों अर्थ-संकेतों को बनाए रखने वाला प्रचलित बाइबलीय नाम।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को उपाधि में बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से प्रस्तुत किया गया।
- source_word: אדֹנָי
  choice: मेरे प्रभु
  rationale: प्रत्यय के प्रथम पुरुष एकवचन संबंध को स्पष्ट रखते हुए אֲדֹנָי को सम्मानसूचक ‘प्रभु’ के रूप में व्यक्त किया गया।
- source_word: עֲזָבַנִי
  choice: मुझे त्याग दिया है
  rationale: עזב के परित्याग-बोध और पूर्ण क्रिया के वर्तमान परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׁכֵחָנִי
  choice: मुझे भुला दिया है
  rationale: שכח के भूल जाने के अर्थ तथा वक्ता की वर्तमान अनुभूति को बनाए रखता है।
theological_decisions:
- issue: יְהוָה और אֲדֹנָי के बीच भेद
  choice: ‘यहोवा’ और ‘मेरे प्रभु’ को अलग-अलग रखा गया
  alternative: दोनों को ‘प्रभु’ कहना
  rationale: मूल पाठ पहले दिव्य नाम और फिर प्रथम पुरुष संबंधसूचक प्रभु-संबोधन का प्रयोग करता है; इस भेद को मिटाना उचित नहीं।
- issue: सिय्योन के कथन की स्थिति
  choice: इसे सिय्योन की शिकायत के रूप में बिना व्याख्यात्मक सुधार के रखा गया
  alternative: ऐसे शब्द जोड़ना जिनसे तुरंत स्पष्ट हो कि उसकी धारणा गलत है
  rationale: पद स्वयं शिकायत प्रस्तुत करता है; अगले संदर्भ का उत्तर इस पद में आयात नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘पर’ पिछले संदर्भ के विपरीत भाव को स्वाभाविक रूप से जोड़ता है। समानांतर वाक्यरचना और सिय्योन का व्यक्तिकरण सुरक्षित रखा गया है।
