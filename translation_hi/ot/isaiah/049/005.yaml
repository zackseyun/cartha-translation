source:
  edition: WLC
  text: וְ/עַתָּ֣ה אָמַ֣ר יְהוָ֗ה יֹצְרִ֤/י מִ/בֶּ֨טֶן֙ לְ/עֶ֣בֶד ל֔/וֹ לְ/שׁוֹבֵ֤ב יַֽעֲקֹב֙ אֵלָ֔י/ו וְ/יִשְׂרָאֵ֖ל לא יֵאָסֵ֑ף וְ/אֶכָּבֵד֙ בְּ/עֵינֵ֣י יְהוָ֔ה וֵ/אלֹהַ֖/י הָיָ֥ה עֻזִּֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/005.yaml
  text: And now Yahweh says—he who formed me from the womb to be his servant, to bring Jacob back to him, and that Israel might be gathered to him[a]—yet I am honored in the eyes of Yahweh, and my God has become my strength.
translation:
  language: hi
  text: और अब यहोवा कहता है—वही जिसने मुझे गर्भ ही से अपना सेवक होने के लिए रचा है, ताकि मैं याकूब को उसके पास लौटा लाऊँ और इस्राएल उसके पास इकट्ठा किया जाए[a]—मैं यहोवा की दृष्टि में सम्मानित हूँ, और मेरा परमेश्वर मेरी शक्ति बना है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी व्यंजन-पाठ का अर्थ है, “और इस्राएल इकट्ठा नहीं किया जाएगा,” अथवा “यद्यपि इस्राएल इकट्ठा नहीं किया गया।” अनेक प्राचीन अनुवाद और व्याख्यात्मक परंपराएँ इसे “और इस्राएल उसके पास इकट्ठा किया जाए” समझती हैं; यह समानांतर पंक्ति “याकूब को उसके पास लौटा लाऊँ” से मेल खाता है।
    reason: textual_variant
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी में प्रचलित रूप से सुरक्षित रखता है।
- source_word: יֹצְרִי מִבֶּטֶן
  choice: जिसने मुझे गर्भ ही से ... रचा
  rationale: יֹצר के उद्देश्यपूर्ण रचने या गढ़ने के भाव और जन्म से आरम्भ सेवक की बुलाहट, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְעֶבֶד לוֹ
  choice: अपना सेवक होने के लिए
  rationale: इस सेवक-गीत में עֶבֶד का मुख्य बल सौंपे गए सेवाकार्य पर है; ‘सेवक’ वर्तमान हिन्दी में उपयुक्त और गरिमापूर्ण है।
- source_word: לְשׁוֹבֵב יַעֲקֹב אֵלָיו
  choice: याकूब को उसके पास लौटा लाऊँ
  rationale: क्रिया के कारक, पुनः लौटाने वाले अर्थ और परमेश्वर की ओर गति को स्पष्ट रूप से बनाए रखता है।
- source_word: וְיִשְׂרָאֵל לא יֵאָסֵף
  choice: और इस्राएल उसके पास इकट्ठा किया जाए
  rationale: मुख्य पाठ में לוֹ (‘उसके पास’) से समझी गई प्राचीन पाठ-परंपरा ग्रहण की गई है, जो समानांतर पंक्ति और सेवक के उद्देश्य से मेल खाती है; व्यंजन-पाठ का नकारात्मक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: וְאֶכָּבֵד בְּעֵינֵי יְהוָה
  choice: मैं यहोवा की दृष्टि में सम्मानित हूँ
  rationale: निफ़अल रूप का सम्मान पाए होने का भाव सहज हिन्दी में देता है, बिना अतिरिक्त विरोधसूचक शब्द जोड़कर पाठ की व्याख्या तय किए।
- source_word: וֵאלֹהַי הָיָה עֻזִּי
  choice: मेरा परमेश्वर मेरा बल हुआ है
  rationale: היה की पूर्ण क्रिया और עֹז के सीधे अर्थ ‘बल’ को बनाए रखता है; हिन्दी का पूर्ण वर्तमान वर्तमान परिणाम को व्यक्त करता है।
theological_decisions:
- issue: וְיִשְׂרָאֵל לא יֵאָסֵף का पाठ और अर्थ
  choice: मुख्य पाठ में ‘और इस्राएल उसके पास इकट्ठा किया जाए’
  alternative: ‘और इस्राएल इकट्ठा न किया जाए,’ अथवा सन्दर्भानुसार ‘यद्यपि इस्राएल इकट्ठा नहीं किया गया’
  rationale: मसोरेटिक व्यंजन לא नकार ‘नहीं’ देता है, पर לוֹ (‘उसके पास’) समझने वाली प्राचीन परंपरा निकटवर्ती समानांतर वाक्य ‘याकूब को उसके पास लौटा लाऊँ’ से बेहतर मेल खाती है। पाठगत और धर्मवैचारिक तनाव मिटाने के बजाय वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप। वाक्य की काव्यात्मक संरचना तथा जन्म से मिली सेवक-बुलाहट बनाए रखी गई है। ‘यहोवा’ विशिष्ट ईश्वरीय नाम के रूप में और ‘सेवक’ प्रसंगानुकूल पद के रूप में प्रयुक्त है।
