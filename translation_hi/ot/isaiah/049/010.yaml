id: ISA.49.10
reference: Isaiah 49:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹ֤א יִרְעָ֨בוּ֙ וְ/לֹ֣א יִצְמָ֔אוּ וְ/לֹא יַכֵּ֥/ם שָׁרָ֖ב וָ/שָׁ֑מֶשׁ כִּי מְרַחֲמָ֣/ם יְנַהֲגֵ֔/ם וְ/עַל מַבּ֥וּעֵי מַ֖יִם יְנַהֲלֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/010.yaml
  text: They will not hunger or thirst[a], nor will scorching heat or sun strike them; for the one who has compassion on them will lead them[b], and he will guide them to springs of water.
translation:
  language: hi
  text: वे न भूखे होंगे, न प्यासे होंगे; न झुलसाने वाली गर्मी[a] और न धूप उन्हें सताएगी। क्योंकि उन पर दया करनेवाला उनकी अगुवाई करेगा, और उन्हें जल के सोतों तक ले जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तपाने वाली गर्मी।’
    reason: שָׁרָב के लिए ‘झुलसाने वाली’ के स्थान पर ‘तपाने वाली’ भी सम्भव है।
  - marker: b
    text: या ‘उन्हें जल के सोतों के पास ले जाएगा।’
    reason: עַל दिशात्मक ‘तक’ के साथ-साथ स्थान-समीपता में ‘के पास’ भी व्यक्त कर सकता है।
lexical_decisions:
- source_word: יִרְעָבוּ
  choice: भूखे होंगे
  rationale: रָעֵב के क़ाल अपूर्ण रूप का स्वाभाविक हिन्दी अर्थ भूखा होना है; यह भावी प्रतिज्ञा को स्पष्ट रूप से व्यक्त करता है।
- source_word: יִצְמָאוּ
  choice: प्यासे
  rationale: צָמֵא का अर्थ प्यासा होना है; नकारात्मक समानांतर रचना में ‘न प्यासे’ संक्षिप्त और स्वाभाविक है।
- source_word: יַכֵּם
  choice: उन्हें मारेगी
  rationale: נכה के हिफ़ील रूप में प्रहार या हानि पहुँचाने का ठोस बिंब है। ‘मारेगी’ आधुनिक हिन्दी में गर्मी और धूप के हानिकारक प्रहार को व्यक्त करता है।
- source_word: שָׁרָב
  choice: झुलसानेवाली गर्मी
  rationale: यह शब्द मरुस्थलीय, तपाने या झुलसानेवाली गर्मी को सूचित करता है; केवल ‘गर्मी’ उसकी तीव्रता को कम कर देती।
- source_word: שָׁמֶשׁ
  choice: धूप
  rationale: सन्दर्भ में मनुष्यों पर पड़ने वाले सूर्य के ताप का प्रभाव प्रमुख है; हिन्दी में ‘धूप उन्हें मारेगी’ ‘सूरज उन्हें मारेगा’ से अधिक स्वाभाविक है और मूल बिंब बनाए रखता है।
- source_word: מְרַחֲמָם
  choice: उन पर दया करनेवाला
  rationale: רָחַם के कृदन्त और बहुवचन प्रत्यय का वर्णनात्मक स्वरूप सुरक्षित है। मूल में परमेश्वर का नाम नहीं जोड़ा गया।
- source_word: יְנַהֲגֵם
  choice: उनकी अगुवाई करेगा
  rationale: נָהַג के पिएल रूप का अर्थ ले चलना या अगुवाई करना है; यह पुनर्स्थापना के चरवाही-सदृश सन्दर्भ के अनुकूल है।
- source_word: מַבּוּעֵי מַיִם
  choice: जल के सोतों
  rationale: מַבּוּעַ बहते जल के प्राकृतिक स्रोत को दर्शाता है। ‘जल के सोते’ ठोस काव्यात्मक चित्र को सहज हिन्दी में रखता है।
- source_word: יְנַהֲלֵם
  choice: उन्हें ... ले जाएगा
  rationale: נהל के पिएल रूप में कोमलता से मार्ग दिखाने या ले चलने का भाव है; हिन्दी में यह पहले क्रियापद की अनावश्यक पुनरावृत्ति से बचते हुए अर्थ रखता है।
- source_word: וְעַל
  choice: तक
  rationale: עַל यहाँ मार्गदर्शन की गति के साथ लक्ष्य की ओर पहुँचाने का अर्थ दे सकता है। ‘तक’ इस दिशात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; स्थान-समीपता का सम्भव अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: दया करनेवाले अगुवे की पहचान
  choice: वर्णनात्मक पद ‘उन पर दया करनेवाला’ रखा गया है।
  alternative: मुख्य पाठ में सीधे ‘परमेश्वर’ कहना।
  rationale: सन्दर्भ में संकेत परमेश्वर की ओर है, पर इब्रानी पाठ यहाँ नाम के बदले कृदन्तीय वर्णन देता है। अनुवाद उसी वर्णन को रखता है और पहचान को आवश्यकता से अधिक स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज काव्यात्मक गद्य रखा गया है। ‘सोतों’ ने मरुस्थलीय जल-स्रोत का ठोस बिंब सुरक्षित रखा है; ‘दया करनेवाला’ मूल के वर्णनात्मक कृदन्त को बनाए रखता है।
