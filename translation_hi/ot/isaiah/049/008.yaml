base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/008.yaml
  text: 'Thus says Yahweh: “In a time of favor I answered you[a], and in a day of salvation I helped you; I will keep you and give you as a covenant for the people, to raise up the land[e][d][c][b], to apportion the desolate inheritances,”'
translation:
  language: hi
  text: 'यहोवा यों कहता है:


    “अनुग्रह के समय मैंने तुझे उत्तर दिया,


    और उद्धार के दिन मैंने तेरी सहायता की।


    मैं तेरी रक्षा करूँगा[a]


    और तुझे प्रजा के लिए वाचा के रूप में दूँगा[b],


    देश को स्थापित करने[c]


    और उजड़े हुए विरासती भागों को बाँटने के लिए।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं तुझे सुरक्षित रखूँगा।”
    reason: lexical_alternative
  - marker: b
    text: या “तुझे प्रजा की वाचा के रूप में दूँगा।”
    reason: lexical_alternative
  - marker: c
    text: या “देश को खड़ा करने” अथवा “देश को पुनर्स्थापित करने।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के वाचागत निज नाम को हिन्दी में प्रचलित रूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: בְּעֵת רָצוֹן
  choice: अनुग्रह के समय
  rationale: רָצוֹן यहाँ कृपा, स्वीकृति या प्रसन्नता का भाव रखता है; ‘अनुग्रह के समय’ सहज हिन्दी में ईश्वर की कृपा के नियत अवसर को व्यक्त करता है।
- source_word: עֲנִיתִיךָ
  choice: मैंने तेरी सुन ली
  rationale: शाब्दिक अर्थ ‘मैंने तुझे उत्तर दिया’ है; प्रार्थना के प्रसंग में ‘तेरी सुन ली’ अधिक स्वाभाविक हिन्दी है और उत्तर दिए जाने का भाव बनाए रखता है।
- source_word: בְיוֹם יְשׁוּעָה
  choice: उद्धार के दिन
  rationale: יְשׁוּעָה बचाव, छुटकारा और उद्धार का व्यापक अर्थ रखता है; ‘उद्धार’ तत्काल रक्षा और व्यापक मुक्तिदायक अर्थ दोनों को खुला रखता है।
- source_word: עֲזַרְתִּיךָ
  choice: मैंने तेरी सहायता की
  rationale: עזר का सीधा और गरिमापूर्ण आधुनिक हिन्दी रूप।
- source_word: וְאֶצָּרְךָ
  choice: मैं तेरी रक्षा करूँगा
  rationale: נצר का अर्थ रक्षा करना, सुरक्षित रखना या सँभालना है; ‘रक्षा’ इसके संरक्षणात्मक भाव को स्पष्ट करता है।
- source_word: וְאֶתֶּנְךָ לִבְרִית עָם
  choice: तुझे प्रजा के लिए वाचा बनाऊँगा
  rationale: व्यक्ति स्वयं ‘वाचा’ के रूप में दिया जाता है; अनुवाद इस सघन कथन को केवल वाचा के मध्यस्थ या स्थापित करने वाले के अर्थ में सीमित नहीं करता। עָם को प्रसंगगत वाचागत समुदाय के रूप में ‘प्रजा’ कहा गया है।
- source_word: לְהָקִים אֶרֶץ
  choice: देश को फिर से बसाऊँ
  rationale: הקים का मूल भाव खड़ा करना या स्थापित करना है; उजड़ी विरासतों के प्रसंग में ‘फिर से बसाना’ पुनर्स्थापना का स्वाभाविक हिन्दी अर्थ देता है।
- source_word: לְהַנְחִיל נְחָלוֹת שֹׁמֵמוֹת
  choice: उजड़े हुए पैतृक भागों को फिर से बाँट दूँ
  rationale: Hiphil נחל का अर्थ विरासत के रूप में देना या भाग बाँटना है; נחלות भूमि के विरासती हिस्सों को सूचित करता है, इसलिए ‘पैतृक भाग’ सामान्य पाठक के लिए ठोस और स्पष्ट है।
theological_decisions:
- issue: सम्बोधित सेवक का ‘प्रजा के लिए वाचा’ होना
  choice: सेवक को स्वयं ‘प्रजा के लिए वाचा’ बनाए जाने का कथन बनाए रखा गया है।
  alternative: ‘प्रजा के साथ वाचा का मध्यस्थ’ या ‘प्रजा के लिए वाचा स्थापित करने वाला।’
  rationale: לִבְרִית עָם का प्रत्यक्ष रूप सेवक को वाचागत भूमिका या साकार रूप में प्रस्तुत करता है। अनुवाद इस धर्मवैज्ञानिक तनाव को किसी संकुचित व्याख्या में नहीं बदलता।
- issue: יְשׁוּעָה का अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘उद्धार।’
  alternative: ‘छुटकारा’ या ‘बचाव।’
  rationale: ‘उद्धार’ तत्काल संकट से मुक्ति और व्यापक मुक्तिदायक प्रतिध्वनि दोनों को सुरक्षित रखता है।
- issue: לְהָקִים אֶרֶץ में पुनर्स्थापना का आशय
  choice: ‘देश को फिर से बसाना।’
  alternative: ‘देश को स्थापित करना’ या ‘देश को पुनर्स्थापित करना।’
  rationale: अगली पंक्ति के उजड़े विरासती भाग पुनः बाँटने के संदर्भ में पुनर्वास का भाव प्रबल है, पर पादटिप्पणी अधिक शाब्दिक विकल्प भी सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक पंक्ति-विन्यास रखा गया है। सम्बोधन के एकवचन निकट रूप ‘तेरी/तुझे’ से हिब्रू के एकवचन पुरुष को स्पष्ट रखा गया है। ‘वाचा’, ‘उद्धार’ और ‘पैतृक भाग’ जैसे शब्द गरिमापूर्ण बाइबलीय शैली और सामान्य बोधगम्यता के बीच संतुलन रखते हैं।
