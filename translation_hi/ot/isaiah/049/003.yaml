lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: और उसने मुझसे कहा
  rationale: वय्यिक्तोल कथन को क्रम में आगे बढ़ाता है; לִי संबोधन के अप्रत्यक्ष कर्म को स्पष्ट करता है। यह हिन्दी में स्वाभाविक और स्रोत के निकट है।
- source_word: עַבְדִּי אָתָּה
  choice: तुम मेरे सेवक हो
  rationale: עֶבֶד यहाँ नियुक्त सेवा करने वाले के अर्थ में है; ‘सेवक’ यशायाह के इस प्रसंग में स्वाभाविक है। स्वतंत्र सर्वनाम אָתָּה की स्पष्टता ‘तुम’ से बनी रहती है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: व्यक्तिवाचक नाम को प्रचलित हिन्दी लिप्यंतरण में रखा गया है और ‘मेरे सेवक’ के समानाधिकरण/सीधे संबोधन के रूप में अनिर्णीत छोड़ा गया है।
- source_word: אֲשֶׁר בְּךָ
  choice: तुममें
  rationale: בְּךָ का मूल अर्थ ‘तुममें’ है। प्रत्यक्ष संबोधन बनाए रखने से हिन्दी में वाक्य सहज रहता है और ‘के द्वारा’ जैसी व्याख्यात्मक दिशा नहीं थोपी जाती।
- source_word: אֶתְפָּאָר
  choice: मैं अपनी महिमा प्रकट करूँगा
  rationale: פאר के हित्पएल रूप में स्वयं को महिमामय दिखाने अथवा अपनी महिमा प्रकट करने का भाव है। यह चयन क्रिया के आत्मवाचक-सक्रिय भाव को स्वाभाविक हिन्दी में व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ‘इस्राएल’ कहे गए सेवक की पहचान
  choice: ‘तुम मेरे सेवक हो, इस्राएल’ के रूप में सीधा संबोधन बनाए रखा गया है।
  alternative: इसे पूरे राष्ट्र, विश्वासयोग्य बचे हुए समुदाय, अथवा इस्राएल का प्रतिनिधित्व करने वाले किसी व्यक्तिगत सेवक के रूप में स्पष्ट करना।
  rationale: पद सेवक को ‘इस्राएल’ कहता है, पर निकटवर्ती सेवक-वचनों में सेवक और इस्राएल के संबंध को लेकर वास्तविक व्याख्यात्मक तनाव है। अनुवाद उसे किसी एक धर्मवैज्ञानिक निष्कर्ष में नहीं बाँधता।
- issue: परमेश्वर की महिमा प्रकट होने की रीति
  choice: ‘तुममें मैं अपनी महिमा प्रकट करूँगा’
  alternative: ‘तुममें मैं महिमावान ठहरूँगा’ अथवा ‘तुम्हारे द्वारा मैं अपनी महिमा प्रकट करूँगा’
  rationale: ‘तुममें’ इब्रानी पूर्वसर्ग को सीधे रखता है, जबकि ‘तुम्हारे द्वारा’ साधन का अर्थ अधिक स्पष्ट करके मूल की संभावित व्यापकता घटा सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। एकवचन संबोधन के लिए ‘तुम’ चुना गया है, जो आधुनिक पाठक के लिए स्वाभाविक है और ‘तू’ से जुड़ी संभावित अनादरपूर्ण छाया से बचता है। अर्धविराम समानाधिकरण और अगले प्रत्यक्ष कथन के बीच संबंध स्पष्ट करता है।
