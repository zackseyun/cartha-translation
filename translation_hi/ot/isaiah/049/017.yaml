  yaml_path: translation/ot/isaiah/049/017.yaml
  text: Your children hurry back[a]; those who tore you down and devastated you will depart from you.
translation:
  language: hi
  text: तेरे बच्चे जल्दी लौट रहे हैं[a]; जिन्होंने तुझे ढा दिया और उजाड़ दिया, वे तेरे यहाँ से चले जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे बनानेवाले जल्दी कर रहे हैं।” कुछ प्राचीन साक्षियों में “बच्चे” के स्थान पर “बनानेवाले” का पाठ मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מִהֲרוּ
  choice: शीघ्र लौट रहे हैं
  rationale: मूल क्रिया का अर्थ ‘जल्दी करना’ है। सिय्योन के बच्चों और उसके विनाशकों के विपरीत गमन के संदर्भ में लौटने की दिशा निहित है; ‘शीघ्र लौट रहे हैं’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בָּנָיִךְ
  choice: तेरे बच्चे
  rationale: मसोरेटिक पाठ में अर्थ ‘तेरे पुत्र/बच्चे’ है। सिय्योन को स्त्री के रूप में संबोधित किए जाने पर ‘बच्चे’ उसके निवासियों या वंशजों के लिए स्वाभाविक और समावेशी हिन्दी है। ‘तेरे बनानेवाले’ प्राचीन वैकल्पिक पाठ के रूप में पादटिप्पणी में रखा गया है।
- source_word: מְהָרְסַיִךְ
  choice: जिन्होंने तुझे ढा दिया
  rationale: הרס का अर्थ ‘ढाना, ध्वस्त करना’ है। सम्बन्धवाचक उपवाक्य हिन्दी में सहज है और नगर-निर्माण की छवि बनाए रखता है।
- source_word: וּמַחֲרִבַיִךְ
  choice: और उजाड़ दिया
  rationale: यह रूप उजाड़ने या वीरान करने वालों को दर्शाता है। पूर्ववर्ती सम्बन्धवाचक वाक्य के साथ ‘उजाड़ दिया’ गंभीर विनाश को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִמֵּךְ
  choice: तेरे पास से
  rationale: अलगाव सूचक पूर्वसर्ग और स्त्रीलिंग एकवचन प्रत्यय को स्वाभाविक हिन्दी में व्यक्त करता है; संबोधन सिय्योन से है।
- source_word: יֵצֵאוּ
  choice: निकल जाएँगे
  rationale: יצא का मूल अर्थ ‘बाहर जाना/निकलना’ है। ‘तेरे पास से निकल जाएँगे’ विनाशकों के सिय्योन से हट जाने को स्पष्ट करता है और भविष्यकालीन रूप को सुरक्षित रखता है।
theological_decisions:
- issue: בָּנָיִךְ का पाठ और अर्थ
  choice: तेरे बच्चे
  alternative: तेरे बनानेवाले
  rationale: 'मसोरेटिक पाठ ‘तेरे पुत्र/बच्चे’ पढ़ता है और पुनर्स्थापना के प्रसंग से मेल खाता है: सिय्योन के बच्चे लौटते हैं, जबकि उसके विनाशक चले जाते हैं। कुछ प्राचीन साक्षी ‘तेरे बनानेवाले’ को प्रतिबिम्बित करते हैं। मूल पाठ को मुख्य वाक्य में और वास्तविक पाठांतर को पादटिप्पणी में रखा गया है।'
translation_notes:
  register: आधुनिक मानक हिन्दी में सिय्योन के लिए एकवचन आत्मीय ‘तू’ का स्त्रीलिंग संबोधन रखा गया है। शैली सरल, गरिमापूर्ण और काव्यात्मक है; ‘ढा दिया’ तथा ‘उजाड़ दिया’ समानांतर विनाशकारी क्रियाओं का भेद बनाए रखते हैं।
