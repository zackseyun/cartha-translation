source:
  edition: WLC
  text: כִּ֤י חָרְבֹתַ֨יִ/ךְ֙ וְ/שֹׁ֣מְמֹתַ֔יִ/ךְ וְ/אֶ֖רֶץ הֲרִֽסֻתֵ֑י/ךְ כִּ֤י עַתָּה֙ תֵּצְרִ֣י מִ/יּוֹשֵׁ֔ב וְ/רָחֲק֖וּ מְבַלְּעָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/019.yaml
  text: For your ruins[a], your desolate places, and your devastated land—surely now you will be too cramped for inhabitants[b], and those who swallowed you up will be far away.
translation:
  language: hi
  text: क्योंकि तेरे खंडहर, तेरे उजाड़ स्थान और तेरी उजड़ी हुई भूमि—अब तू निवासियों के कारण तंग पड़ जाएगी[a], और तुझे निगल जानेवाले[b] दूर हो जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निवासियों के लिए तंग हो जाएगी।” इब्रानी अभिव्यक्ति संक्षिप्त है; अधिक शाब्दिक रूप में, “निवासियों की ओर से संकरी हो जाएगी।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात, “तुझे नष्ट करनेवाले।” इब्रानी में ‘निगलने’ का सजीव रूपक प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרְבֹתַיִךְ
  choice: तेरे खंडहर
  rationale: חָרְבָה नष्ट या उजड़े हुए स्थान को दर्शाता है। ‘खंडहर’ आधुनिक हिन्दी में स्वाभाविक है और अगले समानांतर पदों से अलग अर्थ-छाया बनाए रखता है।
- source_word: שֹׁמְמֹתַיִךְ
  choice: तेरे उजाड़ स्थान
  rationale: שמם से बना यह रूप वीरानी और निर्जनता का भाव देता है। ‘उजाड़ स्थान’ उस भाव को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: אֶרֶץ הֲרִסֻתֵיךְ
  choice: तेरी उजड़ी हुई भूमि
  rationale: यह पद विनाश से प्रभावित भूमि का वर्णन करता है। ‘उजड़ी हुई भूमि’ परिणामसूचक अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: पहला כִּי पिछले कथन में दी गई प्रतिज्ञा का आधार प्रस्तुत करता है, इसलिए कारणसूचक ‘क्योंकि’ उपयुक्त है।
- source_word: כִּי עַתָּה
  choice: अब
  rationale: दूसरा כִּי यहाँ कारण बताने के बजाय कथन पर बल देता है। हिन्दी में ‘अब’ और वाक्य की संरचना उस बल तथा परिवर्तन को स्वाभाविक रूप से व्यक्त करते हैं।
- source_word: תֵּצְרִי מִיּוֹשֵׁב
  choice: तू निवासियों के लिए बहुत तंग पड़ जाएगी
  rationale: क्रिया स्थान के अपर्याप्त या संकरे पड़ जाने को दर्शाती है, और מִן निवासियों के संबंध में उस तंगी को बताता है। यह अनुवाद बढ़ी हुई आबादी के संदर्भ को स्पष्ट रखते हुए इब्रानी भाव के निकट है।
- source_word: וְרָחֲקוּ
  choice: दूर हो जाएँगे
  rationale: उद्धार की इस भविष्यवाणी में पूर्ण क्रिया आनेवाले परिणाम को व्यक्त करती है। भविष्यकालीन हिन्दी रूप इसी भविष्यसूचक बल को संप्रेषित करता है।
- source_word: מְבַלְּעָיִךְ
  choice: तुझे निगल जानेवाले
  rationale: בלע का मूल चित्र ‘निगलना’ है। विनाश के इस सजीव रूपक को सामान्य शब्द ‘नाश करनेवाले’ से समतल करने के बजाय बनाए रखा गया है।
theological_decisions:
- issue: अंतिम उपवाक्य में पूर्ण क्रिया का काल-संदर्भ
  choice: भविष्यसूचक अर्थ में ‘दूर हो जाएँगे’
  alternative: ‘दूर हो गए हैं’ या ‘दूर चले गए’
  rationale: सिय्योन की पुनर्स्थापना की इस उद्धार-वाणी में यह क्रिया प्रतिज्ञात भविष्य के परिणाम को दर्शाती है। इसलिए हिन्दी भविष्यकाल संदर्भगत भविष्यसूचक बल को सबसे स्पष्ट रूप से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। स्त्रीलिंग एकवचन ‘तू/तेरी’ सिय्योन को संबोधित इब्रानी रूपों को दर्शाता है। समानांतर विनाश-सूचक पदों को अलग-अलग किन्तु स्वाभाविक शब्दावली में रखा गया है, और निगलने का मूल रूपक सुरक्षित है।
