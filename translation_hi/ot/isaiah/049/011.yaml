  text: וְ/שַׂמְתִּ֥י כָל הָרַ֖/י לַ/דָּ֑רֶךְ וּ/מְסִלֹּתַ֖/י יְרֻמֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/011.yaml
  text: And I will make all my mountains into a road[b][a], and my highways will be raised up.
translation:
  language: hi
  text: और मैं अपने सब पहाड़ों को मार्ग बना दूँगा[a], और मेरे राजमार्ग ऊँचे किए जाएँगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मार्ग के लिए ठहरा दूँगा’ अथवा ‘मार्ग के रूप में कर दूँगा।’ इब्रानी में परिणाम और उद्देश्य, दोनों का भाव संभव है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरे मार्ग ऊपर उठाए जाएँगे।’ इब्रानी शब्द किसी तैयार किए हुए या ऊँचे उठाए गए मार्ग को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: और मैं ... बना दूँगा
  rationale: שׂים का मूल अर्थ ‘रखना/ठहराना’ है, पर לַדָּרֶךְ के साथ यहाँ किसी वस्तु को मार्ग बना देने का परिणामसूचक भाव स्वाभाविक है।
- source_word: כָל הָרַי
  choice: अपने सब पहाड़ों को
  rationale: כָל का समष्टिगत अर्थ ‘सब’ और प्रथम पुरुष एकवचन प्रत्यय सहित הָרַי का सीधा अर्थ ‘मेरे पहाड़’ है। ‘अपने’ हिन्दी में कर्ता ‘मैं’ से संबंध स्पष्ट और स्वाभाविक करता है।
- source_word: לַדָּרֶךְ
  choice: मार्ग
  rationale: דֶּרֶךְ का अर्थ मार्ग/रास्ता है। ‘मार्ग बना दूँगा’ पहाड़ों को यात्रा योग्य मार्ग में बदलने की ठोस छवि बनाए रखता है; ל उद्देश्य अथवा परिणाम, दोनों का संकेत दे सकता है।
- source_word: וּמְסִלֹּתַי
  choice: और मेरे राजमार्ग
  rationale: מְסִלָּה प्रायः तैयार किए हुए अथवा ऊँचे उठाए गए मार्ग को दर्शाता है। ‘राजमार्ग’ आधुनिक हिन्दी में बड़े, तैयार मार्ग की छवि देता है, बिना ‘राजा के मार्ग’ का आशय जोड़े।
- source_word: יְרֻמוּן
  choice: ऊँचे किए जाएँगे
  rationale: רום का यह रूप निष्क्रिय अर्थ व्यक्त करता है। ‘ऊँचे किए जाएँगे’ सड़क-निर्माण की छवि और मूल का भविष्यकालीन निष्क्रिय भाव दोनों सुरक्षित रखता है।
theological_decisions:
- issue: यात्रा और पुनर्स्थापना की छवि
  choice: परमेश्वर द्वारा भूभाग को अपने लोगों के लिए सुगम बनाने की ठोस छवि को यथावत रखना
  alternative: इसे स्पष्ट रूप से केवल आत्मिक बाधाएँ हटाने या केवल निर्वासितों के लिए शाब्दिक मार्ग बनाने के रूप में प्रस्तुत करना
  rationale: इब्रानी पद भौतिक भूभाग की भाषा में पुनर्स्थापना का चित्र देता है, पर यह तय नहीं करता कि आशय केवल शाब्दिक है, केवल रूपकात्मक है, या दोनों। अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी है। ‘मार्ग’ काव्यात्मक तथा सामान्य-बोधगम्य है; ‘राजमार्ग’ מְסִלָּה की तैयार/ऊँची सड़क की छवि को संक्षेप में व्यक्त करता है। दोनों पादों का भविष्यकाल और काव्यात्मक समानांतरता सुरक्षित रखी गई है।
