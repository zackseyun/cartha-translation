  text: לֵ/אמֹ֤ר לַֽ/אֲסוּרִים֙ צֵ֔אוּ לַ/אֲשֶׁ֥ר בַּ/חֹ֖שֶׁךְ הִגָּל֑וּ עַל דְּרָכִ֣ים יִרְע֔וּ וּ/בְ/כָל שְׁפָיִ֖ים מַרְעִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/009.yaml
  text: saying to the prisoners[a], “Come out,” to those in darkness, “Show yourselves.” They will graze along the roads[b], and on all the bare heights will be their pasture.
translation:
  language: hi
  text: बंदियों से कहना, “बाहर निकल आओ,” और अंधकार में रहने वालों से, “प्रकट हो जाओ[a]।” वे रास्तों के किनारे चरेंगे, और सभी खुली ऊँचाइयों[b] पर उनका चरागाह होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दिखाई दो” अथवा “अनावृत हो जाओ।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात खुले, वृक्षहीन ऊँचे स्थान; या, “खुली पहाड़ियाँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: कहना
  rationale: אמר के infinitive construct का प्रयोग आगे आने वाले आदेशों को प्रस्तुत करता है और पिछले पद से संबंध बनाए रखता है। पद को स्वतंत्र वाक्य बनाने के लिए कोई नया कर्ता नहीं जोड़ा गया।
- source_word: לַאֲסוּרִים
  choice: बंदियों से
  rationale: אסר के passive participle का अर्थ बंधे हुए या कैद किए गए लोग है; ‘बंदी’ आधुनिक हिन्दी में स्वाभाविक है और मुक्ति के प्रसंग के अनुकूल है।
- source_word: צֵאוּ
  choice: बाहर निकल आओ
  rationale: יצא का बहुवचन आज्ञार्थक रूप है। ‘बाहर निकल आओ’ प्रत्यक्ष मुक्ति-आह्वान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַאֲשֶׁר בַּחֹשֶׁךְ
  choice: जो अंधकार में हैं उनसे
  rationale: यह दूसरे समूह को पहचानने वाला संबंधवाचक वाक्यांश है। ‘अंधकार’ को इस प्रकार रखा गया है कि उसका भौतिक और रूपकात्मक, दोनों अर्थ संभव रहें।
- source_word: הִגָּלוּ
  choice: प्रकट हो जाओ
  rationale: גלה का निफ़अल बहुवचन आज्ञार्थक रूप दिखाई देने या अनावृत होने का भाव देता है। ‘प्रकट हो जाओ’ मध्य/निष्क्रिय अर्थ की संभावित छाया को बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: עַל דְּרָכִים
  choice: रास्तों के किनारे
  rationale: यह उनके चरने के स्थानों को दर्शाता है। हिन्दी में ‘रास्तों के किनारे’ यात्रा-मार्गों के साथ-साथ उपलब्ध चराई का स्वाभाविक चित्र देता है।
- source_word: יִרְעוּ
  choice: वे … चरेंगे
  rationale: רעה का क़ाल अपूर्ण रूप चरने या चराने के लिए प्रयुक्त होता है। यहाँ लोग पशु-झुंड के रूपक में कर्ता हैं, इसलिए ‘चरेंगे’ मूल चरवाही-बिंब बनाए रखता है।
- source_word: שְׁפָיִם
  choice: सूनी ऊँचाइयों
  rationale: शब्द वृक्षहीन, खुले या अनावृत ऊँचे स्थानों को सूचित करता है। ‘सूनी ऊँचाइयाँ’ स्थलाकृतिक भाव रखती हैं और ‘ऊँचे स्थान’ से जुड़ सकने वाले अनावश्यक धार्मिक अर्थ से बचती हैं।
- source_word: מַרְעִיתָם
  choice: उनकी चरागाह
  rationale: यह तीसरे पुरुष बहुवचन प्रत्यय सहित चराई-स्थान का संज्ञा-रूप है। इब्रानी का एकवचन सामूहिक अर्थ में है, जिसे हिन्दी का एकवचन ‘चरागाह’ स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: बंदीपन और अंधकार का शाब्दिक या रूपकात्मक अर्थ
  choice: ‘बंदी’ और ‘अंधकार’ के ठोस बिंबों को बिना व्याख्यात्मक विस्तार के बनाए रखा गया।
  alternative: इसे स्पष्ट रूप से निर्वासन से लौटने वाले लोगों अथवा स्पष्ट रूप से आत्मिक मुक्ति के रूप में अनूदित करना।
  rationale: पुनर्स्थापना का यह चित्र ऐतिहासिक निर्वासन और व्यापक उद्धार—दोनों की ओर संकेत कर सकता है। अनुवाद मूल की इस अर्थगत और धर्मवैचारिक व्यापकता को सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक रखी गई है। पद का आरंभ पिछले वाक्य से जुड़ा हुआ है, इसलिए ‘कहना’ के मूल infinitive संबंध को बनाए रखा गया है। चरवाही और भू-दृश्य के मूल बिंबों को व्याख्या में बदले बिना सुरक्षित रखा गया है।
