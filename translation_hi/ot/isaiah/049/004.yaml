reference: Isaiah 49:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/אֲנִ֤י אָמַ֨רְתִּי֙ לְ/רִ֣יק יָגַ֔עְתִּי לְ/תֹ֥הוּ וְ/הֶ֖בֶל כֹּחִ֣/י כִלֵּ֑יתִי אָכֵן֙ מִשְׁפָּטִ֣/י אֶת יְהוָ֔ה וּ/פְעֻלָּתִ֖/י אֶת אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/004.yaml
  text: But I said[a], “I have labored in vain; I have spent my strength for emptiness and vanity. Yet surely my justice is with Yahweh[b], and my reward is with my God.”
translation:
  language: hi
  text: पर मैंने कहा, “मैंने व्यर्थ ही परिश्रम किया; मैंने शून्यता और व्यर्थता में अपनी शक्ति लगा दी। फिर भी निश्चय ही मेरा न्याय[a] याहवे के पास है, और मेरा प्रतिफल[b] मेरे परमेश्वर के पास है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा मुकदमा” अथवा “मेरा उचित ठहराया जाना।”
    reason: lexical_alternative
  - marker: b
    text: या “मेरा पारिश्रमिक” अथवा “मेरा प्रतिदान।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְרִיק
  choice: व्यर्थ ही
  rationale: यह परिणामहीन या निष्फल परिश्रम का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יָגַעְתִּי
  choice: मैंने परिश्रम किया
  rationale: यह कठिन और थका देने वाले श्रम का अर्थ गरिमापूर्ण तथा सहज भाषा में रखता है।
- source_word: לְתֹהוּ וְהֶבֶל
  choice: शून्यता और व्यर्थता के लिए
  rationale: दोनों इब्रानी संज्ञाओं को अलग रखते हुए पहला खालीपन और दूसरा क्षणभंगुरता से उपजी निष्फलता व्यक्त करता है।
- source_word: כֹּחִי כִלֵּיתִי
  choice: मैंने अपनी शक्ति खर्च कर दी
  rationale: यह शक्ति के पूरी तरह लगा दिए जाने का स्वाभाविक हिन्दी रूप है।
- source_word: אָכֵן
  choice: फिर भी निश्चय ही
  rationale: यह पिछले विलाप के साथ विरोध और आगे के कथन का दृढ़ विश्वास—दोनों बनाए रखता है।
- source_word: מִשְׁפָּטִי
  choice: मेरा न्याय
  rationale: यह न्याय, मुकदमे और उचित ठहराए जाने की शब्दार्थगत व्यापकता को किसी एक अर्थ तक सीमित नहीं करता।
- source_word: אֶת יְהוָה
  choice: याहवे के पास
  rationale: यह वक्ता के न्याय के परमेश्वर की देखरेख में होने का भाव रखता है और वाचा के नाम को प्रत्यक्ष रूप में प्रस्तुत करता है।
- source_word: וּפְעֻלָּתִי
  choice: और मेरा प्रतिफल
  rationale: समानांतरता और निष्फल दिखाई देने वाले श्रम के संदर्भ में यह काम के बदले मिलने वाले परिणाम को व्यक्त करता है।
- source_word: אֶת אֱלֹהָי
  choice: मेरे परमेश्वर के पास है
  rationale: यह पहले खंड की समानांतर रचना बनाए रखता है और दिशा या स्रोत का अनावश्यक अर्थ नहीं जोड़ता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ वाचा का विशिष्ट नाम सीधे प्रयोग करता है; लिप्यंतरण उसे सामान्य उपाधि में बदलने से बचाता है।
- issue: सेवक के कथन में מִשְׁפָּטִי का अर्थ
  choice: मेरा न्याय
  alternative: मेरा मुकदमा; मेरा उचित ठहराया जाना
  rationale: यह वक्ता के न्यायोचित अधिकार, मामले और भावी vindication के बीच मौजूद अर्थगत तथा धर्मवैचारिक तनाव को खुला रखता है।
- issue: וּפְעֻלָּתִי का अर्थ
  choice: मेरा प्रतिफल
  alternative: मेरी मजदूरी; मेरा बदला
  rationale: यह परमेश्वर के पास सुरक्षित श्रमफल का भाव देता है, पर उसके स्वरूप को आवश्यकता से अधिक निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण है। इब्रानी समानांतरता और शिकायत से विश्वास की ओर होने वाला तीखा मोड़ बनाए रखा गया है। “शून्यता और व्यर्थता” निकटार्थी होते हुए भी मूल के दो अलग शब्दों को अलग-अलग सुनाई देते हैं।
