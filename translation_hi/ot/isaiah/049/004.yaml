  terminology: “मेरा न्याय” preserves the breadth of מִשְׁפָּטִי, with alternatives clarifying legal-case and vindication senses. “प्रतिफल” is apt for פְעֻלָּתִי. In the footnote, “बदला” can suggest retaliation, so “प्रतिदान” is a safer alternative for recompense.
