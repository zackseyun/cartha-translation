  text: Look[a], these will come from far away, and look, these from the north and from the sea[b], and these from the land of Sinim.
translation:
  language: hi
  text: देखो, ये दूर से आएँगे; और देखो, ये उत्तर से और समुद्र[a] से आएँगे, और ये सीनीम देश[b] से आएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः “पश्चिम से”; इब्रानी भौगोलिक प्रयोग में “समुद्र” पश्चिम दिशा का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: “सीनीम” एक अनिश्चित स्थान-नाम है। इसके लिए दक्षिणी मिस्र के स्येने/असवान का प्रस्ताव किया गया है; कुछ लोगों ने पूर्व के किसी अधिक दूरस्थ प्रदेश का सुझाव दिया है, पर इसका स्थान निश्चित नहीं है।
    reason: alternative_reading
