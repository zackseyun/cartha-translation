id: ISA.49.26
reference: Isaiah 49:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הַאֲכַלְתִּ֤י אֶת מוֹנַ֨יִ/ךְ֙ אֶת בְּשָׂרָ֔/ם וְ/כֶ/עָסִ֖יס דָּמָ֣/ם יִשְׁכָּר֑וּ/ן וְ/יָדְע֣וּ כָל בָּשָׂ֗ר כִּ֣י אֲנִ֤י יְהוָה֙ מֽוֹשִׁיעֵ֔/ךְ וְ/גֹאֲלֵ֖/ךְ אֲבִ֥יר יַעֲקֹֽב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/026.yaml
  text: I will make those who oppress you eat their own flesh[a], and they will become drunk with their own blood as with sweet wine. Then all flesh will know that I, Yahweh, am your Savior and your Redeemer, the Mighty One of Jacob.
translation:
  language: hi
  text: मैं तुम्हारे अत्याचारियों को उन्हीं का मांस खिलाऊँगा, और वे अपने ही लहू से ऐसे मतवाले हो जाएँगे जैसे मीठी मदिरा से होते हैं। तब सभी मनुष्य जानेंगे कि मैं, यहोवा, तुम्हारा उद्धारकर्ता और तुम्हारा छुड़ानेवाला, याकूब का पराक्रमी हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַאֲכַלְתִּי
  choice: मैं ... खिलाऊँगा
  rationale: हिफ़ील रूप का कारणवाचक अर्थ स्वाभाविक हिन्दी में ‘खिलाऊँगा’ से स्पष्ट होता है।
- source_word: מוֹנַיִךְ
  choice: तुम्हारे अत्याचारियों
  rationale: यह संज्ञा सिय्योन पर अत्याचार और दुर्व्यवहार करनेवालों को सूचित करती है; यह चयन संक्षिप्त और वर्तमान हिन्दी में स्पष्ट है।
- source_word: בְּשָׂרָם
  choice: उन्हीं का मांस
  rationale: सम्बन्धवाचक प्रत्यय और आत्म-विनाश की प्रबल छवि दोनों को ‘उन्हीं का’ से उभारा गया है।
- source_word: וְכֶעָסִיס
  choice: मीठी मदिरा की तरह
  rationale: עָסִיס मीठी अथवा नई, ताज़ी मदिरा/रस को सूचित कर सकता है; नशे के समानान्तर प्रसंग में ‘मीठी मदिरा’ उपयुक्त है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: דָּמָם
  choice: अपने ही लहू से
  rationale: ‘अपने ही’ मूल के सम्बन्धवाचक अर्थ और भयावह समानान्तरता को स्पष्ट करता है; काव्यात्मक न्याय-छवि के लिए ‘लहू’ स्वाभाविक है।
- source_word: יִשְׁכָּרוּן
  choice: मतवाले हो जाएँगे
  rationale: क्रिया के ‘नशे में हो जाना’ अर्थ को सहज और गरिमामय हिन्दी में व्यक्त करता है।
- source_word: כָל בָּשָׂר
  choice: समस्त प्राणी
  rationale: हिब्रू मुहावरा शाब्दिक रूप से ‘सारा मांस’ है और नश्वर जीव-जगत, विशेषतः समस्त मानवता, के सार्वभौमिक विस्तार को दर्शाता है; ‘समस्त प्राणी’ हिन्दी में अर्थपूर्ण है और ‘सभी लोग’ की अपेक्षा मूल बिंब को अधिक बचाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप से प्रस्तुत किया गया है।
- source_word: מוֹשִׁיעֵךְ
  choice: तुम्हारा उद्धारकर्ता
  rationale: यह रूप उद्धार करनेवाले की पहचान और कार्य दोनों व्यक्त करता है; ‘उद्धारकर्ता’ संक्षिप्त और परिचित है।
- source_word: וְגֹאֲלֵךְ
  choice: तुम्हारा छुड़ानेवाला
  rationale: גאל में किसी को अधिकार, बन्धन या विपत्ति से छुड़ाने का भाव है; ‘छुड़ानेवाला’ सामान्य पाठक के लिए स्पष्ट है और यहाँ ‘कुटुम्बी’ का भाव अनावश्यक रूप से नहीं जोड़ता।
- source_word: אֲבִיר יַעֲקֹב
  choice: याकूब का सामर्थी
  rationale: ‘याकूब’ को मूल के अनुसार रखा गया है और אֲבִיר की बल-सामर्थ्य वाली उपाधि को संज्ञात्मक ‘सामर्थी’ से व्यक्त किया गया है।
theological_decisions:
- issue: हिंसक न्याय-चित्रण को यथावत रखना या नरम करना
  choice: अपने मांस को खाने और अपने लहू से मतवाले होने की छवि सीधे रखी गई
  alternative: शत्रुओं के सामान्य आत्म-विनाश के रूप में भावानुवाद
  rationale: हिब्रू की चौंकानेवाली छवि अत्याचार के उलट दिए जाने और ईश्वरीय न्याय को जानबूझकर प्रबल बनाती है; इसे नरम करना मूल वक्तृत्व को घटाता।
- issue: כָל בָּשָׂר का अनुवाद
  choice: समस्त प्राणी
  alternative: सभी लोग; समस्त मानवजाति; सारा मांस
  rationale: यह चयन सार्वभौमिक विस्तार और नश्वर देहधारी अस्तित्व की गूँज को बचाते हुए हिन्दी में अस्वाभाविक ‘सारा मांस’ से बचता है।
- issue: גֹאֵל की वाचाई और सामाजिक पृष्ठभूमि
  choice: छुड़ानेवाला
  alternative: छुड़ौती देनेवाला; कुटुम्बी-उद्धारकर्ता
  rationale: मूल शब्द का व्यापक उद्धारकारी भाव रखा गया है, पर इस पद में स्पष्ट न किए गए किसी विशेष कानूनी या कुटुम्बी तन्त्र को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और गरिमामय भविष्यवाणी-शैली रखी गई है। स्त्रीलिंग एकवचन सम्बोधन (सिय्योन) हिन्दी के ‘तुम’ में स्वाभाविक रूप से व्यक्त है। ‘लहू’, ‘मतवाले’ और ‘सामर्थी’ पद काव्यात्मक ऊँचाई बनाए रखते हैं, पर सामान्य पाठक के लिए समझने योग्य हैं।
