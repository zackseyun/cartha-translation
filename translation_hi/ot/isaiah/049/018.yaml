reference: Isaiah 49:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שְׂאִֽי סָבִ֤יב עֵינַ֨יִ/ךְ֙ וּ/רְאִ֔י כֻּלָּ֖/ם נִקְבְּצ֣וּ בָֽאוּ לָ֑/ךְ חַי אָ֣נִי נְאֻם יְהוָ֗ה כִּ֤י כֻלָּ/ם֙ כָּ/עֲדִ֣י תִלְבָּ֔שִׁי וּֽ/תְקַשְּׁרִ֖י/ם כַּ/כַּלָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/018.yaml
  text: 'Lift up your eyes all around and see: they all gather together; they come to you. As I live[a], declares Yahweh, you will surely put them all on like an ornament and bind them on like a bride.'
translation:
  language: hi
  text: अपनी आँखें उठाकर चारों ओर देख! वे सब इकट्ठे हो गए हैं; वे तेरे पास आ गए हैं। मेरे जीवन की शपथ—यह याहवे की घोषणा है—तू निश्चय ही उन सबको आभूषण[a] के समान पहन लेगी और दुल्हन की तरह उन्हें अपने ऊपर बाँध लेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ “सजावट” या “गहना” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאִי סָבִיב עֵינַיִךְ וּרְאִי
  choice: अपनी आँखें उठाकर चारों ओर देख
  rationale: दोनों आज्ञार्थक क्रियाएँ स्त्रीलिंग एकवचन हैं और स्त्री के रूप में चित्रित सिय्योन को संबोधित करती हैं। यह हिंदी अभिव्यक्ति स्वाभाविक रहते हुए चारों दिशाओं में देखने का व्यापक भाव रखती है।
- source_word: כֻּלָּם נִקְבְּצוּ בָאוּ לָךְ
  choice: वे सब इकट्ठे हो गए हैं; वे तेरे पास आ गए हैं
  rationale: इब्रानी पूर्ण क्रियाओं को पूर्ण वर्तमान में रखा गया है, जिससे दर्शित सभा और आगमन की सिद्ध अवस्था स्पष्ट होती है; संदर्भ में ‘वे’ सिय्योन की लौटती संतान/प्रजा हैं।
- source_word: חַי אָנִי
  choice: मेरे जीवन की शपथ
  rationale: यह परमेश्वर की प्रचलित शपथ-विधि है। शाब्दिक ‘मैं जीवित हूँ’ की अपेक्षा यह आधुनिक हिंदी में उसके शपथात्मक बल को अधिक स्पष्टता से व्यक्त करता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: נְאֻם भविष्यद्वाणी की औपचारिक घोषणा-सूत्र है और יְהוָה को उसके व्यक्तिगत नाम ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: כִּי
  choice: निश्चय ही
  rationale: यहाँ כִּי कारण नहीं, बल्कि शपथ की विषयवस्तु को बलपूर्वक प्रस्तुत करता है।
- source_word: כָּעֲדִי
  choice: आभूषण के समान
  rationale: עֲדִי सजावट, गहने या आभूषण का द्योतक है। एकवचन/समष्टिगत रूप को ‘आभूषण’ से सुरक्षित रखा गया है।
- source_word: תִלְבָּשִׁי וּתְקַשְּׁרִים כַּכַּלָּה
  choice: पहन लेगी और दुल्हन की तरह उन्हें अपने ऊपर बाँध लेगी
  rationale: स्त्रीलिंग क्रियाएँ सिय्योन को संबोधित करती हैं। ‘उन्हें अपने ऊपर बाँधना’ बहुवचन प्रत्यय और दुल्हन के अपने आभूषण धारण करने की उपमा दोनों को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: लौटने वालों को आभूषण के रूप में पहनने की उपमा
  choice: रूपक को प्रत्यक्ष रूप में सुरक्षित रखा गया
  alternative: उन्हें अपना गौरव बनाना
  rationale: मूल पाठ सिय्योन की संतान को दुल्हन के आभूषणों के समान चित्रित करता है। अर्थ खोलकर रूपक हटाने के बजाय उसकी काव्यात्मक और धर्मवैचारिक तनावपूर्ण शक्ति बनाए रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। स्त्रीलिंग एकवचन संबोधन बनाए रखने के लिए ‘तेरे’, ‘लेगी’ और ‘दुल्हन’ का प्रयोग किया गया है। विस्मयादिबोधक चिह्न आरंभिक आज्ञा की तीव्रता दर्शाता है, जबकि डैश ईश्वरीय शपथ और घोषणा-सूत्र को सहज हिंदी में अलग करता है।
