id: ISA.49.21
reference: Isaiah 49:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אָמַ֣רְתְּ בִּ/לְבָבֵ֗/ךְ מִ֤י יָֽלַד לִ/י֙ אֶת אֵ֔לֶּה וַ/אֲנִ֥י שְׁכוּלָ֖ה וְ/גַלְמוּדָ֑ה גֹּלָ֣ה וְ/סוּרָ֗ה וְ/אֵ֨לֶּה֙ מִ֣י גִדֵּ֔ל הֵ֤ן אֲנִי֙ נִשְׁאַ֣רְתִּי לְ/בַדִּ֔/י אֵ֖לֶּה אֵיפֹ֥ה הֵֽם־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/021.yaml
  text: Then you will say in your heart, ‘Who has borne these for me, since I was bereaved and barren, exiled and cast off? And these—who has raised them? Look, I was left alone; where then did these come from?’
translation:
  language: hi
  text: तब तुम अपने मन में कहोगी, “मेरे लिए इन्हें किसने जन्म दिया? मैं तो संतान खो चुकी और बाँझ थी, निर्वासित और दूर कर दी गई थी। फिर इन्हें किसने पाल-पोसकर बड़ा किया? देखो, मैं तो अकेली रह गई थी; फिर ये कहाँ से आए?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁכוּלָה
  choice: संतान-विहीन
  rationale: यह शब्द संतान खो देने की अवस्था को व्यक्त करता है; ‘संतान-विहीन’ प्रसंग में स्वाभाविक है और हानि के परिणाम को बनाए रखता है।
- source_word: גַלְמוּדָה
  choice: बाँझ
  rationale: सिय्योन की संतानहीनता और उजाड़ दशा के रूपक को साधारण आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: גֹּלָה
  choice: निर्वासित
  rationale: निर्वासन की ऐतिहासिक और भौगोलिक धारणा को सीधे व्यक्त करता है।
- source_word: סוּרָה
  choice: त्यागी हुई
  rationale: मूल में दूर की गई अथवा हटा दी गई अवस्था है; यहाँ निष्कासन/परित्याग की अस्पष्टता को यथासंभव बनाए रखता है।
- source_word: גִּדֵּל
  choice: पाला-पोसा
  rationale: हिब्रू क्रिया का आशय बड़ा करने या पालन-पोषण करने से है; युग्मित हिन्दी अभिव्यक्ति स्वाभाविक और सटीक है।
- source_word: אֵיפֹה הֵם
  choice: ये कहाँ से आए?
  rationale: शाब्दिक अर्थ ‘ये कहाँ हैं?’ हो सकता है, पर प्रसंग में अचानक उपस्थित संतानों की उत्पत्ति पर विस्मय है; यह हिन्दी उसी आशय को स्वाभाविक रूप में व्यक्त करती है।
theological_decisions:
- issue: सिय्योन का स्त्रीलिंगी मानवीकरण
  choice: स्त्रीलिंगी क्रियाओं और विशेषणों द्वारा बनाए रखा गया
  alternative: लिंग-निरपेक्ष बहुवचन संबोधन
  rationale: हिब्रू में संबोधित सिय्योन स्त्रीलिंग एकवचन है और माता के रूपक का केंद्र है।
- issue: संतानों का दाता कौन है
  choice: ‘किसने’ को अनिर्दिष्ट रखा गया
  alternative: स्पष्ट रूप से ‘परमेश्वर ने’ जोड़ना
  rationale: प्रसंग उत्तर की ओर संकेत करता है, पर इस पद के प्रश्नों में कर्ता का नाम नहीं दिया गया; उसे जोड़ने से मूल की नाटकीय अस्पष्टता समाप्त हो जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सरल। मातृत्व, निर्वासन और विस्मय की काव्यात्मक छवि सुरक्षित रखी गई है; उद्धरण में स्त्रीलिंग एकवचन संबोधन सिय्योन को दर्शाता है।
