source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר נָקֵ֨ל מִֽ/הְיוֹתְ/ךָ֥ לִ/י֙ עֶ֔בֶד לְ/הָקִים֙ אֶת שִׁבְטֵ֣י יַעֲקֹ֔ב ו/נצירי יִשְׂרָאֵ֖ל לְ/הָשִׁ֑יב וּ/נְתַתִּ֨י/ךָ֙ לְ/א֣וֹר גּוֹיִ֔ם לִֽ/הְי֥וֹת יְשׁוּעָתִ֖/י עַד קְצֵ֥ה הָ/אָֽרֶץ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/006.yaml
  text: And he said[a], “It is too small a thing for you to be my servant to raise up the tribes of Jacob and to bring back the preserved ones of Israel; I will also make you a light for the nations[c][b], to be my salvation to the end of the earth.”
translation:
  language: hi
  text: उसने कहा, “यह बहुत छोटी बात है कि तुम मेरे सेवक बनकर याकूब के गोत्रों को फिर से खड़ा करो और इस्राएल के सुरक्षित रखे हुए लोगों[a] को लौटा लाओ। मैं तुम्हें जातियों[b] के लिए ज्योति भी बनाऊँगा, ताकि तुम पृथ्वी के छोर[c] तक मेरा उद्धार बनो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएल के बचे हुए लोग।”
    reason: lexical_alternative
  - marker: b
    text: या “जातियों के लिए ज्योति”; यहाँ “जातियाँ” का अनुवाद “गैर-यहूदी” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “पृथ्वी के छोरों तक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקֵל
  choice: बहुत छोटी बात
  rationale: यह विशेषण किसी हल्की, तुच्छ या अपर्याप्त बात को दर्शाता है। यहाँ भाव यह है कि सेवक का कार्य केवल इस्राएल की पुनर्स्थापना तक सीमित रहना परमेश्वर के व्यापक उद्देश्य की तुलना में बहुत छोटा होगा।
- source_word: עֶבֶד
  choice: सेवक
  rationale: यद्यपि यह शब्द दास को भी सूचित कर सकता है, यशायाह के इन प्रसंगों में यह परमेश्वर द्वारा नियुक्त व्यक्ति की सम्मानपूर्ण भूमिका और बुलाहट को व्यक्त करता है।
- source_word: לְהָקִים
  choice: फिर से खड़ा करना
  rationale: हिफ़िल रूप यहाँ पुनःस्थापित करने या गिरे हुए को खड़ा करने का भाव देता है। यह अनुवाद मूल रूपक और पुनर्स्थापना, दोनों को बनाए रखता है।
- source_word: שִׁבְטֵי יַעֲקֹב
  choice: याकूब के गोत्र
  rationale: मूल पाठ में स्पष्टतः ‘याकूब’ है; इसे बनाए रखने से अगली पंक्ति के ‘इस्राएल’ के साथ काव्यात्मक समानांतरता सुरक्षित रहती है।
- source_word: נְצִירֵי יִשְׂרָאֵל
  choice: इस्राएल के सुरक्षित रखे हुए लोग
  rationale: נצר से बना यह रूप मुख्यतः उन लोगों को दर्शाता है जिन्हें बचाकर या सुरक्षित रखा गया है। ‘बचे हुए लोग’ भी संदर्भगत रूप से संभव है, इसलिए उसे पादटिप्पणी में दिया गया है।
- source_word: לְהָשִׁיב
  choice: लौटा लाना
  rationale: שוב का हिफ़िल सामान्यतः किसी को वापस ले आने का अर्थ देता है और यहाँ पुनर्स्थापना का भाव भी समाहित है।
- source_word: וּנְתַתִּיךָ
  choice: मैं तुम्हें … भी बनाऊँगा
  rationale: शाब्दिक अर्थ ‘मैं तुम्हें दूँगा’ है, पर किसी भूमिका के लिए दिए जाने की इस रचना को हिन्दी में ‘बनाऊँगा’ स्वाभाविक रूप से व्यक्त करता है। ‘भी’ इस्राएल से आगे जातियों तक कार्य के विस्तार को दिखाता है।
- source_word: לְאוֹר גּוֹיִם
  choice: जातियों के लिए ज्योति
  rationale: גּוֹיִם यहाँ इस्राएल से परे संसार के लोगों को दर्शाता है। ‘जातियाँ’ भविष्यद्वाणी के विश्वव्यापी क्षितिज को बनाए रखता है; ‘गैर-यहूदी’ अधिक संकीर्ण हो सकता है।
- source_word: יְשׁוּעָתִי
  choice: मेरा उद्धार
  rationale: यह संज्ञा छुटकारे और उद्धार, दोनों का भाव रखती है। ‘मेरा उद्धार’ यशायाह में परमेश्वर के व्यापक बचाने वाले कार्य को व्यक्त करता है।
- source_word: עַד קְצֵה הָאָרֶץ
  choice: पृथ्वी के छोर तक
  rationale: इब्रानी में ‘छोर’ एकवचन है। मुख्य पाठ में एकवचन रखा गया है, जबकि प्रचलित बहुवचन रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: सेवक की पहचान और उसके कार्य का क्षेत्र
  choice: अनुवाद में सेवक का दोहरा कार्य—याकूब/इस्राएल की पुनर्स्थापना और जातियों तक परमेश्वर के उद्धार का विस्तार—बनाए रखा गया है।
  alternative: सेवक को अनुवाद में स्पष्टतः केवल सामूहिक इस्राएल या स्पष्टतः मसीहा कहना।
  rationale: इस पद में सेवक की पहचान पर चलने वाली व्याख्यात्मक बहस को स्वयं पाठ निर्णायक रूप से हल नहीं करता। इसलिए अनुवाद कोई संकीर्ण पहचान नहीं जोड़ता, बल्कि इस्राएल और जातियों के प्रति उसके दोनों कार्यों को सुरक्षित रखता है।
- issue: सेवक और परमेश्वर के उद्धार का संबंध
  choice: ‘ताकि तुम … मेरा उद्धार बनो’
  alternative: ‘ताकि तुम मेरा उद्धार पहुँचाओ’ या ‘जिससे मेरा उद्धार पहुँचे।’
  rationale: मूल में सेवक को केवल उद्धार का संदेशवाहक नहीं, बल्कि ‘मेरा उद्धार’ होने के लिए नियुक्त किया गया है। कुछ असामान्य लगने पर भी इस संबंध को बनाए रखा गया है, ताकि मूल पाठ का धर्मवैचारिक तनाव न मिटे।
- issue: גּוֹיִם का अर्थ
  choice: जातियाँ
  alternative: गैर-यहूदी
  rationale: ‘जातियाँ’ पद के विश्वव्यापी विस्तार को व्यक्त करता है और अर्थ को केवल यहूदी/गैर-यहूदी जातीय विरोध तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य शैली रखी गई है। ‘फिर से खड़ा करना’ मूल रूपक को और ‘मेरा उद्धार बनो’ मूल की धर्मवैचारिक तीक्ष्णता को सुरक्षित रखता है। सभी पादटिप्पणी चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
