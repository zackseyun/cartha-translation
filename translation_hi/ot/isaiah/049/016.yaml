base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/016.yaml
  text: Look[a], I have engraved you on the palms of my hands; your walls are continually before me.
translation:
  language: hi
  text: देख, मैंने तुझे अपनी हथेलियों पर उकेर रखा है[a]; तेरी दीवारें निरन्तर मेरे सामने हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अंकित कर रखा है।’ इब्रानी क्रिया उकेरने या खोदकर लिखने का भाव देती है और स्थायित्व पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देख
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है। ‘देख’ आधुनिक, सहज हिन्दी में उसके बल को बनाए रखता है।
- source_word: עַל כַּפַּיִם
  choice: अपनी हथेलियों पर
  rationale: כַּפַּיִם द्विवचन में हथेली/हाथ को दर्शाता है; ‘अपनी हथेलियों पर’ ठोस शारीरिक बिम्ब को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: חַקֹּתִיךְ
  choice: मैंने तुझे ... खोद रखा है
  rationale: क्रिया का अर्थ खोदकर अंकित करना है और पूर्णता के साथ स्थायी परिणाम का भाव देती है। स्त्रीलिंग एकवचन कर्म-प्रत्यय सिय्योन/यरूशलेम को सम्बोधित करता है।
- source_word: חוֹמֹתַיִךְ
  choice: तेरी शहरपनाहें
  rationale: यह नगर की रक्षात्मक दीवारों के लिए प्रयुक्त बहुवचन संज्ञा है। ‘शहरपनाहें’ यरूशलेम के नगर-प्राचीर का आशय स्पष्ट और संक्षिप्त रूप में देती है।
- source_word: נֶגְדִּי
  choice: मेरे सामने
  rationale: यह किसी की दृष्टि या उपस्थिति के सामने होने का सामान्य इब्रानी मुहावरा है; हिन्दी में ‘मेरे सामने’ स्वाभाविक समतुल्य है।
- source_word: תָּמִיד
  choice: निरन्तर
  rationale: यह लगातार बने रहने का भाव व्यक्त करता है और पद की गरिमामय शैली के अनुकूल है।
theological_decisions:
- issue: परमेश्वर की हथेलियों और उन पर खोदने का मानवरूपी रूपक
  choice: 'रूपक को सीधे बनाए रखा गया: ‘मैंने तुझे अपनी हथेलियों पर खोद रखा है।’'
  alternative: अर्थ खोलकर कहना, जैसे ‘मैं तुझे सदा स्मरण रखता हूँ।’
  rationale: मूल पाठ परमेश्वर के स्थायी स्मरण और प्रतिबद्धता को एक सजीव शारीरिक रूपक से व्यक्त करता है; उसे व्याख्यात्मक कथन में बदलना बिम्ब और उसके बल को घटा देगा।
- issue: स्त्रीलिंग एकवचन प्रत्ययों का सन्दर्भ
  choice: ‘तुझे/तेरी’ रखा गया और सन्दर्भ से सम्बोधित सिय्योन/यरूशलेम की पहचान होने दी गई।
  alternative: पद में स्पष्ट रूप से ‘सिय्योन’ या ‘यरूशलेम’ जोड़ना।
  rationale: मूल पद स्त्रीलिंग एकवचन में सीधे सम्बोधित करता है, पर नाम नहीं दोहराता। सर्वनाम रखने से मूल की अभिव्यक्ति और संदर्भगत पहचान दोनों सुरक्षित रहती हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमामय शैली। ‘तुझे/तेरी’ का एकवचन सम्बोधन सिय्योन के स्त्रीलिंग व्यक्तीकरण को बनाए रखता है; ‘शहरपनाहें’ नगर की रक्षात्मक दीवारों का सटीक और प्रचलित बाइबलीय शब्द है।
