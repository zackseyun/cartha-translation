    issue: ‘खोद रखा है’ is not the best rendering of the engraving image.
    rationale: The Hebrew חקק denotes engraving/inscribing. In Hindi, ‘खोदना’ primarily evokes digging, whereas ‘उकेरना’ directly expresses carving or engraving a figure or writing onto a surface.
  - severity: low
    issue: ‘शहरपनाहें’ is more specialized than the source requires.
    rationale: The Hebrew simply says ‘your walls.’ Context supplies the city reference, so ‘तेरी दीवारें’ is closer and more broadly natural.
  revised_text: देख, मैंने तुझे अपनी हथेलियों पर उकेर रखा है[a]; तेरी दीवारें निरन्तर मेरे सामने हैं।
