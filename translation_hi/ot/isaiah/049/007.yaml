source:
  edition: WLC
  text: כֹּ֣ה אָֽמַר יְהוָה֩ גֹּאֵ֨ל יִשְׂרָאֵ֜ל קְדוֹשׁ֗/וֹ לִ/בְזֹה נֶ֜פֶשׁ לִ/מְתָ֤עֵֽב גּוֹי֙ לְ/עֶ֣בֶד מֹשְׁלִ֔ים מְלָכִים֙ יִרְא֣וּ וָ/קָ֔מוּ שָׂרִ֖ים וְ/יִֽשְׁתַּחֲוּ֑וּ לְמַ֤עַן יְהוָה֙ אֲשֶׁ֣ר נֶאֱמָ֔ן קְדֹ֥שׁ יִשְׂרָאֵ֖ל וַ/יִּבְחָרֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/007.yaml
  text: 'Thus says Yahweh[a], the Redeemer of Israel, his Holy One, to one despised in soul, abhorred by the nation, a servant of rulers: Kings will see and rise up, princes also, and they will bow down, because of Yahweh, who is faithful, the Holy One of Israel[d][c][b], who has chosen you.'
translation:
  language: hi
  text: 'यहोवा, इस्राएल का छुड़ानेवाला और उसका पवित्र परमेश्वर, उस व्यक्ति से, जिसे लोग तुच्छ समझते हैं,[a] जिससे राष्ट्र घृणा करता है,[b] और जो शासकों का दास है,[c] यह कहता है: “राजा तुझे देखकर उठ खड़े होंगे, और हाकिम दण्डवत करेंगे—यहोवा के कारण, जो विश्वासयोग्य है, इस्राएल का पवित्र परमेश्वर, जिसने तुझे चुना है।”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पदबंध संक्षिप्त और कठिन है। अन्य सम्भव अर्थ हैं: “मन से तुच्छ समझा गया,” “अत्यन्त तुच्छ समझा गया,” या “लोगों द्वारा तुच्छ समझा गया।”'
    reason: lexical_alternative
  - marker: b
    text: या “जिससे राष्ट्र घृणा करते हैं” अथवा “जिससे वह राष्ट्र घृणा करता है।”
    reason: lexical_alternative
  - marker: c
    text: या “शासकों का सेवक।” इब्रानी עֶבֶד का अर्थ “सेवक” या “दास” हो सकता है; यहाँ अपमान और अधीनता के प्रसंग में “दास” चुना गया है।
    reason: lexical_alternative
  - marker: d
    text: मूल पाठ यह स्पष्ट नहीं करता कि हाकिम किसे दण्डवत करेंगे। प्रसंग सेवक को दिए गए सम्मान की ओर संकेत कर सकता है, जबकि यहोवा उस सम्मान का अंतिम कारण है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ रखा गया है; इसे ‘प्रभु’ जैसे पद से प्रतिस्थापित नहीं किया गया।
- source_word: גֹּאֵל יִשְׂרָאֵל
  choice: इस्राएल का छुड़ानेवाला
  rationale: ‘छुड़ानेवाला’ उद्धार और निकट संबंधी द्वारा छुड़ाने की पृष्ठभूमि को सहज हिन्दी में व्यक्त करता है, बिना कानूनी अर्थ को आवश्यकता से अधिक स्पष्ट किए।
- source_word: קְדוֹשׁוֹ
  choice: उसका पवित्र जन
  rationale: पुल्लिंग एकवचन प्रत्यय ‘उसका’ सुरक्षित रखा गया है और असामान्य पदबंध को यहोवा की उपाधि मानकर सपाट नहीं किया गया।
- source_word: לִבְזֹה נֶפֶשׁ
  choice: उस व्यक्ति से जिसे लोग तुच्छ समझते हैं
  rationale: संक्षिप्त और कठिन इब्रानी पदबंध का स्वाभाविक हिन्दी रूप; ‘लोग’ अर्थ-संभावना को दर्शाता है, इसलिए पादटिप्पणी दी गई है।
- source_word: לִמְתָעֵב גּוֹי
  choice: जिससे राष्ट्र घृणा करता है
  rationale: एकवचन גּוֹי को ‘राष्ट्र’ रखते हुए सक्रिय हिन्दी वाक्य-विन्यास अपनाया गया है।
- source_word: לְעֶבֶד מֹשְׁלִים
  choice: जो शासकों का दास है
  rationale: עֶבֶד यहाँ अधीनता और अपमान की दशा बताता है; ‘दास’ आधुनिक हिन्दी में ‘गुलाम’ से अधिक गरिमापूर्ण बाइबलीय शब्द है और ‘सेवक’ से अधिक कठोर अधीनता व्यक्त करता है।
- source_word: מְלָכִים יִרְאוּ וָקָמוּ
  choice: राजा तुझे देखकर उठ खड़े होंगे
  rationale: संदर्भ से निहित कर्म ‘तुझे’ हिन्दी में स्पष्ट किया गया है; उठना सम्मान का संकेत है।
- source_word: שָׂרִים וְיִשְׁתַּחֲווּ
  choice: हाकिम दण्डवत करेंगे
  rationale: ‘हाकिम’ उच्च अधिकारियों को स्वाभाविक ढंग से व्यक्त करता है; ‘दण्डवत करेंगे’ सम्मानपूर्ण भूमि-प्रणाम को रखता है, पर उसके उपासना होने का निर्णय नहीं करता।
- source_word: לְמַעַן יְהוָה אֲשֶׁר נֶאֱמָן
  choice: उस यहोवा के कारण जो विश्वासयोग्य है
  rationale: לְמַעַן का कारणसूचक बल और נֶאֱמָן का विश्वासयोग्यता संबंधी अर्थ दोनों सुरक्षित हैं।
- source_word: קְדֹשׁ יִשְׂרָאֵל
  choice: इस्राएल का पवित्र परमेश्वर
  rationale: यशायाह की स्थापित ईश्वरीय उपाधि का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: וַיִּבְחָרֶךָּ
  choice: जिसने तुझे चुना है
  rationale: पूर्ण हो चुके चुनाव को वर्तमान प्रासंगिकता सहित व्यक्त किया गया है और संबोधित व्यक्ति के एकवचन रूप को रखा गया है।
theological_decisions:
- issue: קְדוֹשׁוֹ में ‘उसका पवित्र जन’ का संदर्भ
  choice: असामान्य तृतीय पुरुष प्रत्यय को स्पष्ट रूप से सुरक्षित रखते हुए इसे संबोधित सेवक से संबंधित पदबंध के रूप में प्रस्तुत किया गया।
  alternative: इसे यहोवा के लिए ‘उसका पवित्र परमेश्वर’ अथवा पहले से ही ‘इस्राएल का पवित्र परमेश्वर’ मानना।
  rationale: मसोरेटी पाठ का ‘उसका’ वास्तविक और अर्थपूर्ण है। अनुवाद इसे मिटाता नहीं, जबकि पादटिप्पणी वाक्यरचना की वैकल्पिक समझ की सूचना देती है।
- issue: दण्डवत का लक्ष्य
  choice: मुख्य पाठ में कर्म नहीं जोड़ा गया; यहोवा को इस सम्मान का कारण बताया गया।
  alternative: ‘उसे दण्डवत करेंगे’ या ‘यहोवा को दण्डवत करेंगे।’
  rationale: इब्रानी क्रिया का कर्म व्यक्त नहीं है। यह सेवक के सम्मान और यहोवा को उसके अंतिम कारण के रूप में साथ रखती है, बिना इसे दिव्य उपासना घोषित किए।
- issue: עֶבֶד की सामाजिक तीव्रता
  choice: दास
  alternative: सेवक
  rationale: शासकों के अधीन अपमानित दशा के संदर्भ में ‘दास’ अधिक उपयुक्त है; पादटिप्पणी ‘सेवक’ की वैध शब्दार्थ-संभावना बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। एकवचन संबोधन के लिए ‘तू/तुझे’ की बाइबलीय-गरिमापूर्ण शैली अपनाई गई है। कठिन वाक्यरचना और दण्डवत के अनिर्दिष्ट लक्ष्य को पादटिप्पणियों में सुरक्षित रखा गया है।
