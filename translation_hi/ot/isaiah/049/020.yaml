base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/020.yaml
  text: Yet the children of your bereavement will still say in your hearing[a], ‘The place is too cramped for me[b]; make room for me so that I may dwell.’
translation:
  language: hi
  text: तेरे संतान-वियोग के बच्चे फिर तेरे कानों में कहेंगे, “यह जगह मेरे लिए बहुत तंग है; मेरे लिए जगह कर[a], ताकि मैं बस सकूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरे लिए पास आ” या “मेरे लिए निकट आ।” तंग जगह के प्रसंग में इसका आशय जगह देने या जगह करने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֚וֹד
  choice: तब भी
  rationale: यह शब्द पिछले संदर्भ के साथ निरंतरता और एक अतिरिक्त, कुछ हद तक विरोधाभासी विकास व्यक्त करता है। आधुनिक हिन्दी में “तब भी” इस भाव को स्वाभाविक रूप से प्रकट करता है।
- source_word: בְ/אָזְנַ֔יִ/ךְ
  choice: तेरे सुनते हुए
  rationale: शाब्दिक अर्थ “तेरे कानों में” है; “तेरे सुनते हुए” सीधे सुनाई देने की क्रिया को सहज हिन्दी में बनाए रखता है।
- source_word: בְּנֵ֖י שִׁכֻּלָ֑יִ/ךְ
  choice: तेरे शोक के बच्चे
  rationale: בני का सामूहिक अर्थ “बच्चे” है और שִׁכֻּלַיִךְ संतान-वियोग या उससे उत्पन्न शोक को दर्शाता है। “शोक के बच्चे” मूल के सघन रूपक को बिना यह कहे सुरक्षित रखता है कि बच्चे स्वयं शोकग्रस्त हैं।
- source_word: צַר לִ֥י הַ/מָּק֖וֹם
  choice: यह जगह मेरे लिए बहुत तंग है
  rationale: צַר स्थान की संकीर्णता या भीड़ के कारण अपर्याप्त जगह का भाव देता है; “बहुत तंग” वर्तमान हिन्दी में स्वाभाविक है।
- source_word: גְּשָׁ/ה לִּ֥י
  choice: मेरे लिए जगह बना
  rationale: נגשׁ का मूल अर्थ “पास आ” या “निकट हो” है, पर भीड़ और तंग जगह के संदर्भ में वाक्यांश का आशय जगह देने का अनुरोध है। हिन्दी में “जगह बना” प्रसंगगत अर्थ स्पष्ट करता है।
- source_word: וְ/אֵשֵֽׁבָה
  choice: ताकि मैं यहाँ बस सकूँ
  rationale: ישׁב यहाँ केवल बैठने के बजाय किसी स्थान में बसने या रहने का अर्थ देता है। “ताकि” अनुरोध और उसके उद्देश्य का संबंध स्पष्ट करता है; “यहाँ” हिन्दी में निहित स्थान को स्वाभाविक बनाता है।
