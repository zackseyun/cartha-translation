- from: तब भी तेरे शोक के बच्चे तेरे सुनते हुए कहेंगे, “यह जगह मेरे लिए बहुत तंग है; मेरे लिए जगह बना, ताकि मैं यहाँ बस सकूँ।”
  to: तेरे संतान-वियोग के बच्चे फिर तेरे कानों में कहेंगे, “यह जगह मेरे लिए बहुत तंग है; मेरे लिए जगह कर[a], ताकि मैं बस सकूँ।”
  rationale: The revision improves the accuracy and naturalness of the bereavement metaphor, renders the hearing idiom directly, and uses a clearer continuation marker. It preserves the singular direct address, the collective ‘children,’ the overcrowding image, and the purpose of settling. The footnote transparently records the literal alternative for the context-sensitive imperative.
