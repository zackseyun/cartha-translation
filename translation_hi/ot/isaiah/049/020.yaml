translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष संबोधन रखा गया है। सिय्योन को स्त्रीलिंग एकवचन मानते हुए “तेरे” और “बना” का प्रयोग किया गया है। मूल पाठ की संतान-वियोग संबंधी असामान्य रूपकात्मक अभिव्यक्ति को पूरी तरह समतल नहीं किया गया।
