source:
  edition: WLC
  text: הֲ/יֻקַּ֥ח מִ/גִּבּ֖וֹר מַלְק֑וֹחַ וְ/אִם שְׁבִ֥י צַדִּ֖יק יִמָּלֵֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/024.yaml
  text: Can plunder be taken from a mighty man[b][a], or can the captives of a righteous one be rescued?
translation:
  language: hi
  text: 'क्या किसी बलवान से लूट का माल[a] छीना जा सकता है,

    या किसी धर्मी व्यक्ति के बंदी[b] छुड़ाए जा सकते हैं?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शिकार।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘धर्मी व्यक्ति के बंदी।’ यह वाक्यांश इस प्रसंग में कठिन है। कुछ लोग इसे दूसरे ढंग से समझते हैं, और कुछ प्राचीन संस्करण ऐसे पाठ को दर्शाते हैं जिसका अर्थ ‘अत्याचारी’ या ‘भयंकर व्यक्ति के बंदी’ के अधिक निकट है।
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיֻקַּח
  choice: क्या ... छीना जा सकता है
  rationale: प्रश्नवाचक कण और לקח के निष्क्रिय अपूर्ण रूप से अलंकारिक प्रश्न बनता है। यह प्रयोग उसकी संभावनार्थकता और निष्क्रिय भाव, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִגִּבּוֹר
  choice: किसी बलवान से
  rationale: גִּבּוֹר का अर्थ बलवान या पराक्रमी व्यक्ति होता है और कई प्रसंगों में वह योद्धा भी हो सकता है। ‘बलवान’ यहाँ सैन्य अर्थ को अनावश्यक रूप से निश्चित किए बिना व्यापक अर्थ बनाए रखता है।
- source_word: מַלְקוֹחַ
  choice: लूट का माल
  rationale: यह संज्ञा छीनी हुई वस्तु, लूट या शिकार को दर्शाती है। ‘लूट का माल’ आधुनिक हिन्दी में स्पष्ट है और बंदियों वाली समानांतर पंक्ति के अनुकूल बैठता है।
- source_word: וְאִם
  choice: या ... क्या
  rationale: इस समानांतर अलंकारिक प्रश्न में וְאִם शर्त नहीं, बल्कि दूसरा प्रश्न प्रस्तुत करता है; इसलिए हिन्दी में ‘या ... क्या’ अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׁבִי
  choice: बंदी
  rationale: यह शब्द बंदी अवस्था या बंदी बनाए गए लोगों को सूचित कर सकता है। प्रसंग में लोगों को छुड़ाने की बात होने के कारण ‘बंदी’ उपयुक्त है।
- source_word: צַדִּיק
  choice: किसी धर्मी व्यक्ति के
  rationale: मसोरेटिक पाठ में צַדִּיק का सीधा अर्थ ‘धर्मी/न्यायी’ है। captor के लिए यह वर्णन प्रसंग में कठिन है, फिर भी मुख्य पाठ में इस तनाव को बनाए रखा गया है।
- source_word: יִמָּלֵט
  choice: छुड़ाए जा सकते हैं
  rationale: מלט का निफ़अल रूप बच निकलने या छुड़ाए जाने का अर्थ देता है। ‘छुड़ाए जा सकते हैं’ निष्क्रिय अर्थ और पहले प्रश्न के साथ समानता को स्पष्ट रखता है।
theological_decisions:
- issue: बंदी बनाने वाले के लिए צַדִּיק (‘धर्मी’) का प्रयोग
  choice: मुख्य पाठ में मसोरेटिक पाठ का सीधा अर्थ ‘धर्मी व्यक्ति’ बनाए रखा गया।
  alternative: प्रसंगानुसार ‘अत्याचारी/भयंकर व्यक्ति’; कुछ प्राचीन संस्करणों में इसी के निकट भिन्न पाठ झलकता है।
  rationale: उपलब्ध इब्रानी पाठ צַדִּיק पढ़ता है। संदर्भगत या पाठालोचनात्मक कठिनाई को चुपचाप हल करने के बजाय मुख्य पाठ में वास्तविक तनाव रखा गया और विकल्प पादटिप्पणी में बताया गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘बलवान’ व्यापक इब्रानी अर्थ को रखता है; ‘लूट का माल’ बोलचाल में स्पष्ट रहते हुए गंभीर शैली के अनुकूल है। पंक्तियों का समानांतर प्रश्नात्मक रूप सुरक्षित रखा गया है।
