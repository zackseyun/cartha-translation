  text: וְ/הָי֨וּ מְלָכִ֜ים אֹֽמְנַ֗יִ/ךְ וְ/שָׂרֽוֹתֵי/הֶם֙ מֵינִ֣יקֹתַ֔יִ/ךְ אַפַּ֗יִם אֶ֚רֶץ יִשְׁתַּ֣חֲווּ לָ֔/ךְ וַ/עֲפַ֥ר רַגְלַ֖יִ/ךְ יְלַחֵ֑כוּ וְ/יָדַ֨עַתְּ֙ כִּֽי אֲנִ֣י יְהוָ֔ה אֲשֶׁ֥ר לֹֽא יֵבֹ֖שׁוּ קוָֹֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/023.yaml
  text: Kings will be your foster fathers[a], and their princesses your nursing mothers. With faces to the ground they will bow down to you, and they will lick the dust of your feet. Then you will know that I am Yahweh[b]; those who wait for me will not be put to shame.
translation:
  language: hi
  text: राजा तेरे पालक-पिता[a] होंगे, और उनकी राजकुमारियाँ तेरी दूध पिलाने वाली माताएँ होंगी। वे तेरे आगे भूमि पर मुँह के बल झुकेंगे और तेरे पैरों की धूल चाटेंगे। तब तू जान लेगी कि मैं यहोवा हूँ; जो मेरी प्रतीक्षा करते हैं[b], वे लज्जित न होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे संरक्षक।” इब्रानी शब्द पालन-पोषण करने, सहारा देने, या रक्षा करने वालों को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “जो मुझ पर आशा रखते हैं।” इब्रानी क्रिया में प्रतीक्षा और आशाभरी अपेक्षा—दोनों भाव हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְנַיִךְ
  choice: तेरे पालक-पिता
  rationale: यह शब्द पालन-पोषण, सहारा और संरक्षण करने वाले पुरुषों को दर्शाता है। समानांतर 'धाय-माताएँ' के साथ 'पालक-पिता' देखभाल की छवि को स्वाभाविक रूप से बनाए रखता है।
- source_word: שָׂרוֹתֵיהֶם
  choice: उनकी राजकुमारियाँ
  rationale: स्त्रीलिंग बहुवचन शब्द शासक या कुलीन स्त्रियों को दर्शा सकता है; राजाओं के समानांतर 'राजकुमारियाँ' सहज और प्रसंगानुकूल है।
- source_word: מֵינִיקֹתַיִךְ
  choice: तेरी धाय-माताएँ
  rationale: यह दूध पिलाकर पालन करने वाली स्त्रियों की मातृवत छवि को संक्षिप्त और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: אַפַּיִם אֶרֶץ יִשְׁתַּחֲווּ לָךְ
  choice: वे मुँह के बल भूमि पर गिरकर तेरे सामने दण्डवत् करेंगे
  rationale: इब्रानी मुहावरा पूर्ण प्रणाम और अधीनता की शारीरिक मुद्रा बताता है; यह अनुवाद उस सजीवता को बनाए रखता है।
- source_word: וַעֲפַר רַגְלַיִךְ יְלַחֵכוּ
  choice: तेरे पैरों की धूल चाटेंगे
  rationale: जानबूझकर प्रयुक्त अपमान और पूर्ण अधीनता की तीखी छवि को शाब्दिक रूप से सुरक्षित रखा गया है।
- source_word: וְיָדַעַתְּ
  choice: तब तू जान लेगी
  rationale: स्त्रीलिंग एकवचन संबोधन सिय्योन से है; 'तब' प्रसंग के परिणामसूचक संबंध को स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण 'यहोवा' से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: קוָֹי
  choice: जो मेरी बाट जोहते हैं
  rationale: यह अभिव्यक्ति प्रतीक्षा और आशाभरी अपेक्षा दोनों को समेटती है; वैकल्पिक आशा-अर्थ पादटिप्पणी में दिया गया है।
- source_word: לֹא יֵבֹשׁוּ
  choice: वे लज्जित न होंगे
  rationale: यह असफल होकर अपमानित या निराश न होने के प्रसंगगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: सिय्योन के सामने किए गए השתחוה को आराधना की भाषा में व्यक्त करना या सामाजिक-राजकीय सम्मान के रूप में
  choice: तेरे सामने दण्डवत् करेंगे
  alternative: तेरी आराधना करेंगे
  rationale: क्रिया आराधना या प्रणाम दोनों बता सकती है, पर यहाँ राजा और कुलीन स्त्रियाँ पुनर्स्थापित सिय्योन के अधीन होकर सम्मान दिखाते हैं। 'दण्डवत्' ठोस मुद्रा को बनाए रखता है और दिव्य आराधना का अतिरिक्त दावा नहीं जोड़ता।
- issue: יהוה का हिन्दी रूप
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है; लिप्यंतरण उसे उपाधि में बदलने से बचाता है।
- issue: קוה में प्रतीक्षा और आशा का संबंध
  choice: मेरी बाट जोहते हैं
  alternative: मुझ पर आशा रखते हैं
  rationale: मुख्य पाठ प्रतीक्षा का ठोस भाव रखता है, जबकि पादटिप्पणी बताती है कि इस प्रतीक्षा में आशाभरी अपेक्षा भी निहित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। सिय्योन के स्त्रीलिंग एकवचन संबोधन के कारण 'तेरे', 'तेरी' और 'तू जान लेगी' प्रयुक्त हैं। 'दण्डवत्' और 'बाट जोहना' सामान्य पाठक के लिए बोधगम्य रहते हुए भविष्यद्वाणी की ऊँची शैली बनाए रखते हैं।
