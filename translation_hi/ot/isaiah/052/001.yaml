language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עוּרִ֥י עוּרִ֛י לִבְשִׁ֥י עֻזֵּ֖/ךְ צִיּ֑וֹן לִבְשִׁ֣י בִּגְדֵ֣י תִפְאַרְתֵּ֗/ךְ יְרוּשָׁלִַ֨ם֙ עִ֣יר הַ/קֹּ֔דֶשׁ כִּ֣י לֹ֥א יוֹסִ֛יף יָבֹא בָ֥/ךְ ע֖וֹד עָרֵ֥ל וְ/טָמֵֽא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/001.yaml
  text: Awake[a], awake; put on your strength, Zion; put on your beautiful garments, Jerusalem, the holy city[b]. For no longer shall the uncircumcised and the unclean enter you again.
translation:
  language: hi
  text: जाग उठ, जाग उठ! हे सिय्योन, अपना सामर्थ्य धारण कर; हे यरूशलेम, पवित्र नगर, अपने शोभायमान वस्त्र पहन ले।[a] क्योंकि अब फिर कभी कोई खतनारहित और अशुद्ध जन तेरे भीतर प्रवेश नहीं करेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी शोभा के वस्त्र पहन ले।”
    reason: lexical_alternative
  - marker: b
    text: “खतनारहित और अशुद्ध” इब्रानी की वाचा और शुद्धता से जुड़ी भाषा को बनाए रखता है; यह अभिव्यक्ति व्यापक रूप से उन लोगों की ओर संकेत कर सकती है जिन्हें यरूशलेम की पवित्रता से बाहर रखा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: עוּרִי עוּרִי
  choice: जाग उठ, जाग उठ
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक क्रिया नगर को मानवीकृत संबोधन है। पुनरुक्ति तात्कालिकता और काव्यात्मक बल को बनाए रखती है।
- source_word: לִבְשִׁי עֻזֵּךְ
  choice: अपना सामर्थ्य धारण कर
  rationale: शाब्दिक रूप से सामर्थ्य को वस्त्र की तरह पहनने का रूपक है। ‘धारण कर’ आधुनिक, गरिमापूर्ण हिन्दी में इस रूपक को स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: צִיּוֹן
  choice: सिय्योन
  rationale: स्थान और मानवीकृत नगर के नाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: לִבְשִׁי בִּגְדֵי תִפְאַרְתֵּךְ
  choice: अपने शोभायमान वस्त्र पहन ले
  rationale: בִּגְדֵי का अर्थ वस्त्र और תִפְאֶרֶת का अर्थ शोभा, वैभव या सौंदर्य है। यह चयन पुनर्स्थापना की वस्त्र-छवि और अर्थ-विस्तार दोनों को सहज हिन्दी में रखता है।
- source_word: יְרוּשָׁלִַם עִיר הַקֹּדֶשׁ
  choice: हे यरूशलेम, पवित्र नगर
  rationale: मूल में यरूशलेम को संबोधित करते हुए ‘पवित्र नगर’ समानाधिकरण पद है। ‘हे’ हिन्दी में संबोधन को स्पष्ट और स्वाभाविक बनाता है।
- source_word: כִּי לֹא יוֹסִיף יָבֹא בָךְ עוֹד
  choice: क्योंकि अब फिर कभी ... तेरे भीतर प्रवेश नहीं करेगा
  rationale: יוֹסִיף और עוֹד मिलकर भविष्य में पूर्ण समाप्ति पर बल देते हैं। ‘अब फिर कभी ... नहीं’ उस जोर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עָרֵל וְטָמֵא
  choice: कोई खतनारहित और अशुद्ध जन
  rationale: यह वाचा और शुद्धता की मूल शब्दावली को बनाए रखता है। एकवचन ‘जन’ इब्रानी के सामूहिक एकवचन को दर्शाता है और संदर्भ को जातीय, अनुष्ठानिक या नैतिक अर्थ तक सीमित नहीं करता।
theological_decisions:
- issue: यरूशलेम के संबंध में ‘खतनारहित और अशुद्ध’ का आशय
  choice: वाचा और शुद्धता की श्रेणियों को ज्यों का त्यों रखा गया है, बिना यह तय किए कि आशय जातीय, अनुष्ठानिक, नैतिक या युगांत-संबंधी है।
  alternative: इसे केवल विदेशी आक्रमणकारियों, केवल अनुष्ठानिक रूप से अशुद्ध लोगों, या सिद्ध पवित्रता की युगांतकारी छवि के रूप में स्पष्ट करना।
  rationale: पद स्वयं इन श्रेणियों का पूरा दायरा परिभाषित नहीं करता; इसलिए अनुवाद मूल की धर्मवैचारिक व्यापकता और तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। सिय्योन और यरूशलेम को मानवीकृत नगर मानकर एकवचन आत्मीय संबोधन ‘तेरे’ रखा गया है। अर्धविराम समानांतर आज्ञाओं को जोड़ता है, जबकि विस्मयादिबोधक पुनरुक्त पुकार की तीव्रता दिखाता है।
