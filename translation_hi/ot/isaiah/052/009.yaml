source:
  edition: WLC
  text: פִּצְח֤וּ רַנְּנוּ֙ יַחְדָּ֔ו חָרְב֖וֹת יְרוּשָׁלִָ֑ם כִּֽי נִחַ֤ם יְהוָה֙ עַמּ֔/וֹ גָּאַ֖ל יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/009.yaml
  text: Break forth[a], sing together, you ruins of Jerusalem, for Yahweh has comforted his people; he has redeemed Jerusalem.
translation:
  language: hi
  text: हे यरूशलेम के खंडहरो, फूट पड़ो और एक साथ आनंद से गाओ! क्योंकि याहवे ने अपनी प्रजा को सांत्वना दी है; उसने यरूशलेम को छुड़ाया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּצְחוּ
  choice: फूट पड़ो
  rationale: बहुवचन आज्ञार्थक क्रिया अचानक स्वर या गीत फूट पड़ने का सजीव बिंब देती है; ‘फूट पड़ो’ उस काव्यात्मक रूपक को बनाए रखता है।
- source_word: רַנְּנוּ
  choice: आनंद से गाओ
  rationale: यह क्रिया उल्लासपूर्ण स्वर, जयघोष या गीत को व्यक्त करती है। ‘आनंद से गाओ’ गीत और हर्ष—दोनों भावों को स्वाभाविक हिन्दी में रखता है।
- source_word: יַחְדָּו
  choice: एक साथ
  rationale: यह क्रियाविशेषण सामूहिक और संयुक्त आनंद को स्पष्ट करता है।
- source_word: חָרְבוֹת
  choice: खंडहरो
  rationale: यह बहुवचन संज्ञा उजड़े या नष्ट हुए स्थानों को संबोधित करती है; यरूशलेम के दृश्य अवशेषों के लिए ‘खंडहर’ संक्षिप्त और सजीव है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आनंद मनाने की आज्ञा का कारण प्रस्तुत करता है।
- source_word: נִחַם
  choice: सांत्वना दी है
  rationale: निफ़ाल पूर्ण क्रिया यहाँ राहत और पुनर्स्थापना देने के अर्थ में है; हिन्दी पूर्ण पक्ष उस सम्पन्न दिव्य कार्य को व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित प्रतिलेखन के द्वारा परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से प्रतिस्थापित किए बिना रखा गया है।
- source_word: עַמּוֹ
  choice: अपनी प्रजा को
  rationale: तृतीय पुरुष एकवचन प्रत्यय सहित संज्ञा का स्वाभाविक हिन्दी रूप; ‘अपनी’ का संबंध वाक्य के कर्ता यहोवा से है।
- source_word: גָּאַל
  choice: छुड़ा लिया है
  rationale: क्रिया निकट संबंधी के अधिकार और दायित्व के आधार पर छुड़ाने या वापस पाने का अर्थ रखती है। ‘छुड़ा लिया है’ सामान्य पाठक के लिए स्पष्ट है और उद्धारात्मक भार बनाए रखता है।
- source_word: יְרוּשָׁלִָם
  choice: यरूशलेम
  rationale: स्थान-नाम को दोनों बार स्पष्ट रूप से रखा गया है, जिससे इब्रानी पुनरुक्ति और काव्यात्मक समापन सुरक्षित रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा-नाम प्रत्यक्ष है। हिन्दी पाठकों के बीच व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से बदलने के बजाय उसका प्रतिलेखन करता है; उच्चारण की पुनर्रचना को निर्णायक नहीं माना गया।
- issue: גָּאַל में छुटकारे की भाषा
  choice: उसने यरूशलेम को छुड़ा लिया है
  alternative: उसने यरूशलेम का उद्धार किया है
  rationale: ‘छुड़ा लिया’ क्रिया के ठोस पुनःप्राप्ति/मुक्ति भाव को व्यक्त करती है, जबकि किसी विशिष्ट प्रायश्चित्त-प्रणाली को इस पद में नहीं जोड़ती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। निर्जीव खंडहरों को सीधे संबोधन की मूल अलंकारिकता रखी गई है। ‘फूट पड़ो’ के संभावित अधूरेपन को अगली आज्ञा ‘आनंद से गाओ’ पूरा करती है; वैकल्पिक मुहावरे को पादटिप्पणी में दिया गया है।
