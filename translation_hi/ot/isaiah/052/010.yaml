id: ISA.52.10
reference: Isaiah 52:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: חָשַׂ֤ף יְהוָה֙ אֶת זְר֣וֹעַ קָדְשׁ֔/וֹ לְ/עֵינֵ֖י כָּל הַ/גּוֹיִ֑ם וְ/רָאוּ֙ כָּל אַפְסֵי אָ֔רֶץ אֵ֖ת יְשׁוּעַ֥ת אֱלֹהֵֽי/נוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/010.yaml
  text: Yahweh has bared his holy arm before the eyes of all the nations[c][b][a], and all the ends of the earth will see the salvation of our God.
translation:
  language: hi
  text: याहवे ने सब राष्ट्रों की आँखों के सामने अपनी पवित्र भुजा उघाड़ दी है[a][b], और पृथ्वी के सभी छोर हमारे परमेश्वर का उद्धार देखेंगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अनावृत कर दी है’ अथवा ‘खोल दी है।’ इब्रानी क्रिया निर्णायक कार्य के लिए भुजा उघाड़ने का चित्र प्रस्तुत करती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सब राष्ट्रों के देखते-देखते।’
    reason: lexical_alternative
  - marker: c
    text: या ‘हमारे परमेश्वर का छुटकारा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: חָשַׂף
  choice: उघाड़ दी है
  rationale: यह क्रिया ढकी हुई वस्तु को खोलने या अनावृत करने का अर्थ देती है। यह चयन निर्णायक कार्य के लिए भुजा उघाड़ने के सजीव रूपक को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: זְרוֹעַ קָדְשׁוֹ
  choice: अपनी पवित्र भुजा
  rationale: यह परमेश्वर के सामर्थ्यपूर्ण उद्धारकारी कार्य का मानवरूपी काव्य-चित्र है; रूपक और पवित्रता, दोनों को यथावत रखा गया है।
- source_word: לְעֵינֵי
  choice: की आँखों के सामने
  rationale: यह मूल पदबंध की दृश्यता और सार्वजनिक प्रकटीकरण—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל הַגּוֹיִם
  choice: सब राष्ट्रों
  rationale: यहाँ संदर्भ संसार के समस्त राष्ट्रों का है; इसे केवल यहूदियों से भिन्न गैर-यहूदियों तक सीमित नहीं किया गया।
- source_word: וְרָאוּ
  choice: देखेंगे
  rationale: रूप की दृष्टि से यह पूर्ण क्रिया है, पर भविष्यसूचक कथन में पूर्ववर्ती घोषित कार्य के परिणाम को भविष्य के रूप में व्यक्त करती है।
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: पृथ्वी के सभी छोर
  rationale: यह दूर से दूर स्थानों सहित पूरे संसार के लिए प्रयुक्त इब्रानी मुहावरे को परिचित हिन्दी रूप में सुरक्षित रखता है।
- source_word: יְשׁוּעַת
  choice: उद्धार
  rationale: शब्द का अर्थ छुटकारा या उद्धार हो सकता है; यहाँ परमेश्वर के विश्वव्यापी उद्धारकारी कार्य के लिए ‘उद्धार’ उपयुक्त और अर्थगर्भित है।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर का
  rationale: यह मूल के प्रथम पुरुष बहुवचन और समुदाय के वाचिक दृष्टिकोण को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के कार्य के लिए मानवरूपी भाषा
  choice: ‘अपनी पवित्र भुजा’ के ठोस रूपक को बनाए रखा गया।
  alternative: ‘अपना पवित्र सामर्थ्य’ जैसा व्याख्यात्मक रूप।
  rationale: मूल पाठ स्पष्टतः शारीरिक बिंब का उपयोग करता है। इसे अमूर्त ‘सामर्थ्य’ में बदलना उसकी काव्यात्मक शक्ति को घटा देता।
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसका सीधा हिन्दी लिप्यंतरण है, न कि उसके स्थान पर कोई उपाधि।
- issue: וְרָאוּ का कालगत मूल्य
  choice: भविष्यसूचक परिणाम के रूप में ‘देखेंगे’।
  alternative: पूर्ण क्रिया के रूप में ‘देख लिया है’।
  rationale: पद के भविष्यसूचक प्रवाह में यह याहवे के सार्वजनिक कार्य का अपेक्षित विश्वव्यापी परिणाम बताता है, यद्यपि इब्रानी रूप स्वयं पूर्ण है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक किंतु सहज शैली अपनाई गई है। ‘भुजा उघाड़ना’ और ‘पृथ्वी के छोर’ जैसे मूल बिंब सुरक्षित रखे गए हैं। ईश्वरीय नाम के लिए ‘याहवे’ प्रयुक्त है।
