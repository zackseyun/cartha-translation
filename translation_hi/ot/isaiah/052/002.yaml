source:
  edition: WLC
  text: הִתְנַעֲרִ֧י מֵ/עָפָ֛ר ק֥וּמִי שְּׁבִ֖י יְרֽוּשָׁלִָ֑ם התפתחו מוֹסְרֵ֣י צַוָּארֵ֔/ךְ שְׁבִיָּ֖ה בַּת צִיּֽוֹן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/002.yaml
  text: Shake yourself from the dust[a]; rise up, sit down, Jerusalem. Loosen the bonds of your neck[c][b], captive daughter Zion.
translation:
  language: hi
  text: धूल अपने ऊपर से झाड़ दे; उठ खड़ी हो, बैठ जा, हे यरूशलेम! अपने गले के बंधन खोल दे,[b] हे बंदिनी, सिय्योन की बेटी![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “खोल दे” के पीछे का इब्रानी रूप कठिन और अनियमित है। इसका अर्थ संभवतः “अपने बंधन खोल दे” या “बंधनों से मुक्त हो जा” है।
    reason: textual_variant
  - marker: c
    text: इसे “बेटी सिय्योन” भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְנַעֲרִי מֵעָפָר
  choice: धूल झाड़कर उठ खड़ी हो
  rationale: हित्पाएल स्त्रीलिंग एकवचन आज्ञार्थक में अपने ऊपर लगी धूल झाड़ देने का आत्मवाचक भाव है; हिंदी में यह वाक्यांश अपमान और शोक की धूल से मुक्त होकर उठने का चित्र स्वाभाविक रूप से व्यक्त करता है।
- source_word: קוּמִי
  choice: उठ
  rationale: קום का स्त्रीलिंग एकवचन आज्ञार्थक; संक्षिप्त और प्रत्यक्ष आदेश।
- source_word: שְּׁבִי
  choice: अपने आदर के स्थान पर बैठ जा
  rationale: मूल क्रिया का सीधा अर्थ 'बैठ' है। धूल में पड़े होने के विपरीत प्रसंग में सम्मान की पुनर्स्थापना निहित प्रतीत होती है, पर 'सिंहासन पर बैठ' कहना मूल से अधिक निश्चित होगा; इसलिए संदर्भगत भाव मुख्य पाठ में संयत रूप से दिया गया और शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: יְרוּשָׁלִָם
  choice: यरूशलेम
  rationale: इस स्थान-नाम का प्रचलित आधुनिक हिंदी रूप।
- source_word: התפתחו
  choice: खोल दे
  rationale: रूप कठिन और व्याकरण की दृष्टि से अनियमित है, पर प्रसंग में गले के बंधन खोलने या खुल जाने का आदेश स्पष्ट है। हिंदी अनुवाद संभावित अर्थ देता है, जबकि रूपगत अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: מוֹסְרֵי צַוָּארֵךְ
  choice: अपने गले के बंधन
  rationale: מוֹסְרֵי बंधनों या बेड़ियों को सूचित करता है और צַוָּארֵךְ का अर्थ 'तेरा गला' है; 'गले के बंधन' ठोस तथा रूपक, दोनों आयाम बनाए रखता है।
- source_word: שְׁבִיָּה
  choice: बंदी
  rationale: स्त्रीलिंग संबोधन में पकड़ी हुई या बंधुआ दशा को संक्षेप में व्यक्त करता है।
- source_word: בַּת צִיּוֹן
  choice: सिय्योन की बेटी
  rationale: हिंदी में इब्रानी संबंधसूचक संरचना का स्वाभाविक और पारंपरिक रूप; यह सिय्योन के मानवीकरण को बनाए रखता है।
theological_decisions:
- issue: पुनर्स्थापना के प्रसंग में שְּׁבִי का आशय
  choice: '''अपने आदर के स्थान पर बैठ जा''—सम्मान की पुनर्स्थापना का संकेत, बिना राजसिंहासन को स्पष्ट रूप से जोड़ने के'
  alternative: '''बैठ जा'' या अधिक व्याख्यात्मक ''सिंहासन पर बैठ जा'''
  rationale: मूल क्रिया केवल बैठने को कहती है, किंतु धूल से उठने का विरोधाभास पुनः सम्मानित स्थान ग्रहण करने का संकेत देता है। चुना हुआ रूप संदर्भ को व्यक्त करता है, पर राजकीय अर्थ को अनिवार्य नहीं बनाता।
- issue: अनियमित रूप התפתחו
  choice: 'अर्थानुसार आत्मवाचक आदेश: ''अपने ... बंधन खोल दे'''
  alternative: '''तेरे गले के बंधन खुल जाएँ'' या ''बंधनों से मुक्त हो जा'''
  rationale: व्यंजन-पाठ कठिन है और रूप अपेक्षित स्त्रीलिंग एकवचन से मेल नहीं खाता। पाठ-संशोधन मान लेने के बजाय मुख्य पाठ संभावित अर्थ देता है और पादटिप्पणी अनिश्चितता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और संबोधनप्रधान रखी गई है। यरूशलेम/सिय्योन के स्त्रीलिंग मानवीकरण के कारण स्त्रीलिंग एकवचन आज्ञार्थक रूप प्रयुक्त हुए हैं। समानार्थी आदेशों की काव्यात्मक गति बनाए रखते हुए कठिन इब्रानी रूप और 'बैठने' के संदर्भगत अर्थ को पादटिप्पणियों में पारदर्शी रखा गया है।
