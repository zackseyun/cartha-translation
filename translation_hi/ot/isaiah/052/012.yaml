  text: כִּ֣י לֹ֤א בְ/חִפָּזוֹן֙ תֵּצֵ֔אוּ וּ/בִ/מְנוּסָ֖ה לֹ֣א תֵלֵכ֑וּ/ן כִּֽי הֹלֵ֤ךְ לִ/פְנֵי/כֶם֙ יְהוָ֔ה וּ/מְאַסִּפְ/כֶ֖ם אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/012.yaml
  text: For you will not go out in haste[a], and you will not go in flight; for Yahweh is going before you[b], and the God of Israel is your rear guard.
translation:
  language: hi
  text: क्योंकि तुम उतावली में नहीं निकलोगे, न भागते हुए जाओगे; क्योंकि याहवे तुम्हारे आगे-आगे चलेगा, और इस्राएल का परमेश्वर तुम्हारे पीछे से तुम्हें समेटे चलेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक, “तुम्हें पीछे से समेटने वाला”; अर्थात् वह तुम्हारे पीछे की ओर से तुम्हारी रक्षा करेगा, या तुम्हारा पिछला रक्षक होगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחִפָּזוֹן
  choice: उतावली में
  rationale: यह पद जल्दबाज़ी में किए गए प्रस्थान को नकारता है। ‘उतावली में’ आधुनिक और स्वाभाविक है तथा घबराहट का भाव अनावश्यक रूप से नहीं जोड़ता।
- source_word: תֵּצֵאוּ
  choice: निकलोगे
  rationale: יצא का ठोस अर्थ ‘बाहर निकलना’ है; ‘निकलोगे’ निर्गमन-सदृश प्रस्थान की छवि बनाए रखता है।
- source_word: וּבִמְנוּסָה
  choice: भागते हुए
  rationale: מְנוּסָה पलायन या भागने को दर्शाता है। यह अनुवाद सुरक्षित और शांत प्रस्थान के साथ उसका विरोध स्पष्ट करता है।
- source_word: תֵלֵכוּן
  choice: जाओगे
  rationale: הלך का सामान्य अर्थ ‘जाना/चलना’ है; यहाँ समानांतर वाक्य में ‘जाओगे’ सहज है।
- source_word: הֹלֵךְ לִפְנֵיכֶם
  choice: तुम्हारे आगे-आगे चलेगा
  rationale: इब्रानी कृदंत सक्रिय और सुनिश्चित अगुवाई व्यक्त करता है। भविष्य-संदर्भ में ‘चलेगा’ स्वाभाविक हिन्दी है, और ‘आगे-आगे’ नेतृत्व की चित्रात्मकता रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: וּמְאַסִּפְכֶם
  choice: तुम्हारे पीछे से तुम्हें समेटे रखेगा
  rationale: אסף का यहाँ शाब्दिक भाव पीछे से लोगों को समेटना है, जिससे पीछे रह जाने वालों की रक्षा और दल के पिछले भाग की सुरक्षा दोनों सूचित होते हैं। क्रियात्मक रूप मूल की खुली चित्रात्मकता बचाता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: यह रचना मूल संबंधसूचक पदबंध और इस्राएल की वाचा-संबंधी पहचान को सीधे बनाए रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी के सामान्य बाइबलीय पाठकों के लिए परिचित ‘यहोवा’ अपनाया गया है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: וּמְאַסִּפְכֶם की छवि
  choice: पीछे से तुम्हें समेटे रखेगा
  alternative: तुम्हारा पिछला रक्षक होगा
  rationale: मूल क्रिया ‘समेटना’ और पीछे से साथ रखने की छवि देती है। केवल सैनिक पद ‘पिछला रक्षक’ करने से अर्थ स्पष्ट होता, पर मूल की क्रियात्मक व्यापकता घटती; इसलिए शाब्दिक छवि रखकर उसके रक्षात्मक आशय को पादटिप्पणी में बताया गया है।
