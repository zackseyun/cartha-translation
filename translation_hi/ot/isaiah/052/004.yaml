source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה מִצְרַ֛יִם יָֽרַד עַמִּ֥/י בָ/רִֽאשֹׁנָ֖ה לָ/ג֣וּר שָׁ֑ם וְ/אַשּׁ֖וּר בְּ/אֶ֥פֶס עֲשָׁקֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/004.yaml
  text: 'For thus says the Lord GOD: My people went down at first to Egypt to sojourn there[b][a], and Assyria oppressed them without cause.'
translation:
  language: hi
  text: क्योंकि प्रभु यहोवा यों कहता है, “मेरी प्रजा पहले मिस्र में परदेशी के रूप में रहने के लिए गई थी, और अश्शूर ने उसे[a] अकारण[b] सताया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल भाषा में ‘उसे’; अर्थात प्रजा को एक सामूहिक इकाई के रूप में देखा गया है।
    reason: lexical_alternative
  - marker: b
    text: या “बिना किसी मूल्य के” अथवा “मुफ्त में”।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त उपाधि में אֲדֹנָי को ‘प्रभु’ और परमेश्वर के विशिष्ट नाम יהוה को ‘यहोवा’ रखा गया है; इससे दोनों तत्व स्पष्ट रहते हैं।
- source_word: מִצְרַיִם יָרַד
  choice: मिस्र में ... गई थी
  rationale: हिब्रानी में शाब्दिक अर्थ ‘मिस्र को नीचे गई’ है। हिन्दी में गंतव्य के साथ ‘गई’ अधिक स्वाभाविक है; ‘नीचे’ भौगोलिक हिब्रानी मुहावरा है और अर्थ के लिए आवश्यक नहीं।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: यह वाचा-संबंधी सामूहिक पद है। ‘प्रजा’ एकवचन सामूहिक भाव को बनाए रखता है और आगे के एकवचन प्रत्यय से मेल खाता है।
- source_word: בָרִאשֹׁנָה
  choice: पहले
  rationale: यह मिस्र जाने की आरंभिक ऐतिहासिक घटना को बाद के अश्शूरी उत्पीड़न से अलग करता है।
- source_word: לָגוּר
  choice: परदेशी होकर रहने के लिए
  rationale: גור केवल रहने नहीं, बल्कि विदेशी अथवा अस्थायी निवासी के रूप में बसने का भाव देता है।
- source_word: אַשּׁוּר
  choice: अश्शूर
  rationale: यहाँ राष्ट्र/साम्राज्य का पारंपरिक हिन्दी बाइबलीय नाम उपयुक्त है।
- source_word: בְּאֶפֶס
  choice: अकारण
  rationale: संदर्भ में वाक्यांश अन्यायपूर्ण, बिना किसी उचित कारण के किए गए उत्पीड़न को व्यक्त करता है; अन्य अर्थ ‘बिना मूल्य’ भी संभव है।
- source_word: עֲשָׁקוֹ
  choice: उसे ... सताया
  rationale: क्रिया उत्पीड़न, शोषण या अन्याय करने का बोध देती है। एकवचन प्रत्यय को ‘उसे’ द्वारा सुरक्षित रखा गया है, जिसका संदर्भ सामूहिक एकवचन ‘मेरी प्रजा’ है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल में सामान्य उपाधि और विशिष्ट वाचा-नाम दोनों हैं; ‘प्रभु यहोवा’ इस भेद को बनाए रखता है।
- issue: עֲשָׁקוֹ के एकवचन प्रत्यय का निर्वाह
  choice: उसे
  alternative: उन्हें
  rationale: हिब्रानी प्रत्यय पुल्लिंग एकवचन है और ‘प्रजा’ को सामूहिक इकाई के रूप में प्रस्तुत करता है। हिन्दी में ‘प्रजा’ के साथ ‘उसे’ स्वाभाविक भी है और मूल रूप को सुरक्षित रखता है।
- issue: בְּאֶפֶס की अर्थगत अस्पष्टता
  choice: अकारण
  alternative: बिना मूल्य / मुफ्त में
  rationale: संदर्भ अन्यायपूर्ण उत्पीड़न की ओर संकेत करता है, पर आर्थिक या ‘बदले में कुछ न मिलने’ वाला भाव पूर्णतः असंभव नहीं; इसलिए विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘परदेशी होकर रहना’ मूल के विदेशी/अस्थायी निवास का भाव व्यक्त करता है। सभी पादटिप्पणी चिह्न संबंधित पदांश के बाद दिए गए हैं।
