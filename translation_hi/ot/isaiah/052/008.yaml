  text: ק֥וֹל צֹפַ֛יִ/ךְ נָ֥שְׂאוּ ק֖וֹל יַחְדָּ֣ו יְרַנֵּ֑נוּ כִּ֣י עַ֤יִן בְּ/עַ֨יִן֙ יִרְא֔וּ בְּ/שׁ֥וּב יְהוָ֖ה צִיּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/008.yaml
  text: The voice of your watchmen—they lift up their voice[a]; together they shout for joy[b], for they will see eye to eye when Yahweh returns to Zion.
translation:
  language: hi
  text: तेरे पहरेदारों की आवाज़! वे अपनी आवाज़ ऊँची करते हैं; वे सब मिलकर आनंद से जयजयकार करते हैं, क्योंकि जब याहवे सिय्योन में लौट आएगा[b], तब वे अपनी आँखों से देखेंगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आँख से आँख”; या, “प्रत्यक्ष रूप से।”
    reason: lexical_alternative
  - marker: b
    text: या, “जब याहवे सिय्योन को फिर से स्थापित करेगा।”
    reason: alternative_reading
lexical_decisions:
- source_word: ק֥וֹל צֹפַ֛יִךְ
  choice: तेरे पहरेदारों की आवाज़!
  rationale: नामवाची आरम्भ और सिय्योन को किए गए एकवचन सम्बोधन को बनाए रखता है; ऐसा कोई ‘सुनो’ आदेश नहीं जोड़ता जो इब्रानी में स्पष्ट नहीं है।
- source_word: נָשְׂאוּ ק֖וֹל
  choice: वे अपनी आवाज़ ऊँची करते हैं
  rationale: נשא קול का स्वाभाविक हिन्दी मुहावरा है और सामूहिक पुकार का भाव बनाए रखता है।
- source_word: יַחְדָּ֣ו יְרַנֵּ֑נוּ
  choice: वे सब मिलकर आनन्द से जयजयकार करते हैं
  rationale: יַחְדָּו की एकता और רנן की ऊँची, सार्वजनिक तथा आनन्दपूर्ण पुकार—दोनों व्यक्त होते हैं।
- source_word: עַ֤יִן בְּעַ֨יִן֙ יִרְא֔וּ
  choice: वे अपनी आँखों से देखेंगे[a]
  rationale: सन्दर्भ में वाक्यांश प्रत्यक्ष, निजी रूप से देखने का बोध देता है। शाब्दिक और अधिक चित्रात्मक रूप को पादटिप्पणी में रखा गया है ताकि मूल की अभिव्यक्ति न खोए।
- source_word: בְּשׁ֥וּב יְהוָ֖ה צִיּֽוֹן
  choice: जब याहवे सिय्योन लौटेगा[b]
  rationale: व्याकरण की सबसे सीधी समझ में याहवे ‘लौटने’ का कर्ता है और सिय्योन गन्तव्य; पुनःस्थापना वाली सम्भव व्याख्या पादटिप्पणी में सुरक्षित है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यन्तरण किया गया है, उसके स्थान पर कोई उपाधि नहीं रखी गई।
- source_word: צִיּוֹן
  choice: सिय्योन
  rationale: स्थान-नाम को प्रचलित हिन्दी बाइबलीय लिप्यन्तरण में रखा गया है।
theological_decisions:
- issue: עַיִן בְּעַיִן का अर्थ
  choice: अपनी आँखों से
  alternative: आँख से आँख / प्रत्यक्ष रूप से
  rationale: यहाँ सहमति जताने वाले आधुनिक ‘आँख से आँख मिलाना’ का अर्थ सम्भावित नहीं है। मुख्य पाठ प्रत्यक्ष दर्शन का स्वाभाविक हिन्दी अर्थ देता है, जबकि पादटिप्पणी इब्रानी बिम्ब को सुरक्षित रखती है।
- issue: בְּשׁוּב יְהוָה צִיּוֹן में कर्ता और क्रिया का बल
  choice: जब याहवे सिय्योन लौटेगा
  alternative: जब याहवे सिय्योन को फिर से स्थापित करेगा
  rationale: मूल वाक्य-विन्यास याहवे को लौटने वाले कर्ता के रूप में पढ़ने का समर्थन करता है; पुनःस्थापना की व्याख्या सम्भव है, इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक उद्घोषणा के अनुकूल हिन्दी। सिय्योन के मानवीकरण को ‘तेरे’ से बनाए रखा गया है। विराम-चिह्न मूल के आरम्भिक नामवाची उद्गार और उसके बाद की व्याख्या को स्पष्ट करते हैं।
