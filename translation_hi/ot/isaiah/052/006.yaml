id: ISA.52.6
reference: Isaiah 52:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵ֛ן יֵדַ֥ע עַמִּ֖/י שְׁמִ֑/י לָ/כֵן֙ בַּ/יּ֣וֹם הַ/ה֔וּא כִּֽי אֲנִי ה֥וּא הַֽ/מְדַבֵּ֖ר הִנֵּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/006.yaml
  text: 'Therefore my people will know my name[a]; therefore on that day they will know that I am he who speaks: Here I am.'
translation:
  language: hi
  text: इसलिए मेरी प्रजा मेरा नाम जानेगी; इसलिए उस दिन वह जान लेगी कि मैं ही वह हूँ जो बोलता है[a]—मैं यहाँ हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बोलनेवाला मैं ही हूँ।”
    reason: इब्रानी पदबंध אֲנִי הוּא הַמְדַבֵּר को हिन्दी में बलपूर्ण सम्बंधवाचक उपवाक्य अथवा विधेय संज्ञा-पद के रूप में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले प्रसंग से परिणाम का संबंध जोड़ता है। इब्रानी में इसकी पुनरावृत्ति बल देती है, इसलिए हिन्दी में भी दोनों बार इसे रखा गया है।
- source_word: יֵדַע
  choice: जानेगी / जान लेगी
  rationale: संदर्भ में अपूर्ण क्रिया भविष्य की भविष्यद्वाणी व्यक्त करती है। पहली जगह ‘जानेगी’ और दूसरी जगह स्वाभाविक हिन्दी के लिए ‘जान लेगी’ प्रयुक्त है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: यह सामूहिक एकवचन में वाचा-संबंधी समुदाय को व्यक्त करता है; ‘मेरी प्रजा’ उस सामूहिक भाव को बनाए रखता है।
- source_word: שְׁמִי
  choice: मेरा नाम
  rationale: ‘नाम’ में पहचान, प्रतिष्ठा और प्रकट चरित्र के अर्थ समाहित हो सकते हैं; व्याख्यात्मक विस्तार किए बिना मूल रूप रखा गया है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: भविष्यद्वाणी के साहित्य में प्रयुक्त इस कालसूचक पद का यह स्वाभाविक और निकट हिन्दी रूप है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ यह उस बात का विषय प्रस्तुत करता है जिसे प्रजा जानेगी, न कि स्पष्ट रूप से कारण बताने वाला उपवाक्य।
- source_word: אֲנִי הוּא
  choice: मैं ही हूँ
  rationale: यह संक्षिप्त और बलपूर्ण आत्म-पहचान है। ‘ही’ बल को व्यक्त करता है और हिन्दी में अनावश्यक पूरक सर्वनाम जोड़े बिना कथन की गंभीरता बनाए रखता है।
- source_word: הַמְדַבֵּר
  choice: जो बोलता है
  rationale: निश्चयवाचक कृदंत को सम्बंधवाचक उपवाक्य के रूप में रखा गया है, जिससे बोलनेवाले की पहचान पर बल बना रहता है।
- source_word: הִנֵּנִי
  choice: देखो, मैं यहाँ हूँ
  rationale: यह तत्काल उपस्थिति और आत्म-प्रस्तुति का सूत्र है। ‘देखो’ इब्रानी सूचक बल को और ‘मैं यहाँ हूँ’ उपस्थिति को व्यक्त करता है।
theological_decisions:
- issue: אֲנִי הוּא में परमेश्वर की बलपूर्ण आत्म-पहचान
  choice: मैं ही हूँ
  alternative: मैं ही वह हूँ
  rationale: मुख्य पाठ संक्षिप्त आत्म-पहचान और उसके धर्मवैचारिक भार को बनाए रखता है, पर इसे मूल से अधिक विकसित सिद्धांतात्मक कथन नहीं बनाता।
- issue: אֲנִי הוּא הַמְדַבֵּר का वाक्यगत संबंध
  choice: मैं ही हूँ जो बोलता है
  alternative: बोलनेवाला मैं ही हूँ
  rationale: दोनों पाठ वक्ता की पहचान पर बल देते हैं। मुख्य पाठ इब्रानी शब्दक्रम और सम्बंधवाचक संरचना के निकट है; वैकल्पिक पाठ अधिक मुहावरेदार हिन्दी है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘इसलिए’ की पुनरावृत्ति भविष्यद्वाणी के तर्क और बल को सुरक्षित रखती है। सामूहिक ‘प्रजा’ के कारण स्त्रीलिंग एकवचन क्रियाएँ प्रयुक्त हुई हैं।
