source:
  edition: WLC
  text: כֵּ֤ן יַזֶּה֙ גּוֹיִ֣ם רַבִּ֔ים עָלָ֛י/ו יִקְפְּצ֥וּ מְלָכִ֖ים פִּי/הֶ֑ם כִּ֠י אֲשֶׁ֨ר לֹֽא סֻפַּ֤ר לָ/הֶם֙ רָא֔וּ וַ/אֲשֶׁ֥ר לֹֽא שָׁמְע֖וּ הִתְבּוֹנָֽנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/015.yaml
  text: So he will sprinkle many nations; kings will shut their mouths because of him. For they will see what had not been told to them[a], and they will understand what they had not heard.
translation:
  language: hi
  text: उसी प्रकार वह बहुत-सी जातियों पर छिड़काव करेगा[a]; उसके कारण राजा अपना मुँह बंद कर लेंगे। क्योंकि जो बात उन्हें बताई नहीं गई थी, उसे वे देखेंगे, और जो उन्होंने नहीं सुना था, उसे वे समझेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह बहुत-सी जातियों को चकित कर देगा।” इब्रानी क्रिया का सामान्य अर्थ “छिड़कना” है, पर कुछ विद्वान यहाँ इसका अर्थ विस्मित या चकित कर देना मानते हैं।
    reason: वैकल्पिक अर्थ
lexical_decisions:
- source_word: כֵּן
  choice: उसी प्रकार
  rationale: यह पद 14 में दिए गए वर्णन से तुलना और उसके अनुरूप परिणाम को जोड़ता है। ‘उसी प्रकार’ इस संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יַזֶּה
  choice: छिड़काव करेगा
  rationale: נזה के हिफ़ील रूप का सामान्य अर्थ ‘छिड़कना’ है, विशेषकर शुद्धिकरण और याजकीय संदर्भों में। हिन्दी में ‘जातियों पर छिड़काव करेगा’ इस मूल अर्थ को बिना किसी पदार्थ या फल को जोड़े व्यक्त करता है।
- source_word: גּוֹיִם רַבִּים
  choice: बहुत-सी जातियों
  rationale: גּוֹיִם यहाँ अनेक राष्ट्रों या जनसमूहों के व्यापक अंतरराष्ट्रीय अर्थ में है; ‘जातियाँ’ बाइबलीय हिन्दी में इस अर्थ को संक्षेप में व्यक्त करता है।
- source_word: עָלָיו
  choice: उसके कारण
  rationale: राजाओं के मुँह बंद करने के मुहावरे के साथ यह पूर्वसर्ग उनकी स्तब्ध चुप्पी के कारण या अवसर को दर्शाता है।
- source_word: יִקְפְּצוּ מְלָכִים פִּיהֶם
  choice: राजा अपना मुँह बंद कर लेंगे
  rationale: यह विस्मय से उपजी स्तब्धता का ठोस मुहावरा है; अनुवाद मूल बिंब को बनाए रखता है।
- source_word: אֲשֶׁר לֹא סֻפַּר לָהֶם רָאוּ
  choice: जो बात उन्हें बताई नहीं गई थी, उसे वे देखेंगे
  rationale: यह पहले सूचना न मिलने और बाद में प्रत्यक्ष देखने के बीच विरोध दिखाता है। भविष्यकाल भविष्यसूचक संदर्भ के अनुरूप है।
- source_word: וַאֲשֶׁר לֹא שָׁמְעוּ הִתְבּוֹנָנוּ
  choice: जो उन्होंने नहीं सुना था, उसे वे समझेंगे
  rationale: הִתְבּוֹנָנוּ केवल सुनने नहीं, बल्कि विवेकपूर्वक समझने का बोध देता है।
theological_decisions:
- issue: दास के संदर्भ में יַזֶּה का अर्थ
  choice: वह बहुत-सी जातियों पर छिड़काव करेगा
  alternative: वह बहुत-सी जातियों को चकित कर देगा
  rationale: नזה के हिफ़ील रूप का प्रमाणित सामान्य अर्थ ‘छिड़कना’ है और यह शुद्धिकरण संबंधी बिंब की संभावना को खुला रखता है। फिर भी ‘चकित कर देना’ एक महत्वपूर्ण वैकल्पिक व्याख्या है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है; मुख्य पाठ उस विकल्प को निर्णायक रूप से नहीं अपनाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। ‘अपना मुँह बंद कर लेंगे’ मूल के ठोस मुहावरे को बनाए रखता है। ‘छिड़काव करेगा’ असामान्य किंतु अर्थपूर्ण शुद्धिकरण-बिंब को सहज बनाकर मिटाने के बजाय सुरक्षित रखता है।
