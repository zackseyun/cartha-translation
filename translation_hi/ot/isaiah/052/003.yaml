id: ISA.52.3
reference: Isaiah 52:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי כֹה֙ אָמַ֣ר יְהוָ֔ה חִנָּ֖ם נִמְכַּרְתֶּ֑ם וְ/לֹ֥א בְ/כֶ֖סֶף תִּגָּאֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/003.yaml
  text: 'For thus says Yahweh: “You were sold for nothing[a], and you will be redeemed without money.”'
translation:
  language: hi
  text: 'क्योंकि यहोवा यों कहता है: “तुम बिना दाम के बेचे गए थे, और बिना धन[a] के छुड़ाए जाओगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बिना चाँदी के।” यहाँ इब्रानी शब्द का अर्थ विशेष रूप से ‘चाँदी’ हो सकता है, पर वह धन या भुगतान के लिए भी प्रयुक्त होता है।
    reason: शाब्दिक वैकल्पिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का आधार देते हुए यहोवा की घोषणा प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כֹה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वक्ताओं की मानक संदेश-सूचना शैली है। ‘यों कहता है’ औपचारिक बल बनाए रखते हुए प्रतिष्ठित और सहज हिन्दी है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: חִנָּם
  choice: बिना दाम के
  rationale: इससे स्पष्ट होता है कि बेचे जाने पर कोई मूल्य नहीं मिला; साथ ही अगले खंड के आर्थिक बिंब के साथ अलंकारिक समानता बनी रहती है।
- source_word: נִמְכַּרְתֶּם
  choice: तुम ... बेचे गए थे
  rationale: निफ़अल रूप को स्वाभाविक कर्मवाच्य माना गया है। ‘तुमने अपने आपको बेच दिया’ कहना ऐसा आत्मवाचक अर्थ जोड़ता जिसे रूप अनिवार्य नहीं करता।
- source_word: בְכֶסֶף
  choice: धन के
  rationale: כֶּסֶף का मूल अर्थ ‘चाँदी’ हो सकता है, पर आर्थिक संदर्भ में यह धन या भुगतान को भी दर्शाता है। मुख्य पाठ में ‘धन’ सामान्य पाठक के लिए आशय स्पष्ट करता है, जबकि शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: תִּגָּאֵלוּ
  choice: छुड़ाए जाओगे
  rationale: גאל निकट संबंधी द्वारा छुड़ाने अथवा वाचागत उद्धार का शब्द है। ‘छुड़ाए जाओगे’ इसके उद्धारात्मक अर्थ को रखता है और केवल व्यापारिक ‘वापस खरीदे जाओगे’ तक सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: विशिष्ट वाचा-नाम को सामान्य उपाधि से प्रतिस्थापित न करके हिन्दी में पहचाने जाने वाले नामरूप से दिया गया है।
- issue: छुड़ाए जाने के कथन का आशय
  choice: आर्थिक रूपक को बनाए रखते हुए छुटकारे की रीति अनिर्दिष्ट रखना
  alternative: इसे शाब्दिक आर्थिक लेन-देन या किसी विशेष धर्मवैज्ञानिक प्रायश्चित्त-रीति के रूप में स्पष्ट करना
  rationale: मूल पाठ ‘बिना दाम’ बेचे जाने और ‘बिना धन’ छुड़ाए जाने का विरोध रखता है, पर छुटकारा किस रीति से होगा यह नहीं बताता। अनुवाद उसी तनाव और अनिर्दिष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वक्तीय शैली रखी गई है। ‘यों कहता है’ सूत्रात्मक औपचारिकता देता है; शेष वाक्य साधारण पाठकों के लिए स्पष्ट है।
