source:
  edition: WLC
  text: וְ/עַתָּ֤ה מי ל/י פֹה֙ נְאֻם יְהוָ֔ה כִּֽי לֻקַּ֥ח עַמִּ֖/י חִנָּ֑ם משל/ו יְהֵילִ֨ילוּ֙ נְאֻם יְהוָ֔ה וְ/תָמִ֥יד כָּל הַ/יּ֖וֹם שְׁמִ֥/י מִנֹּאָֽץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/005.yaml
  text: And now[a], what do I have here? declares Yahweh. For my people have been taken away for nothing; those who rule over them wail, declares Yahweh, and continually, all day long[b], my name is despised.
translation:
  language: hi
  text: और अब, यहाँ मेरे लिए क्या है? याहवे की यह घोषणा है। क्योंकि मेरी प्रजा यों ही ले जाई गई है; उस पर शासन करने वाले विलाप करते हैं[a], याहवे की यह घोषणा है, और निरंतर, दिन भर, मेरे नाम का तिरस्कार होता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उन पर अत्याचार करते हैं, वे हाहाकार करते हैं।” इब्रानी शब्द उन लोगों को दर्शा सकता है जो प्रजा पर शासन करते हैं; इस संदर्भ में उनका शासन दमनकारी है।
    reason: lexical_alternative
  - marker: b
    text: या, “मेरे नाम की निरंतर, दिन भर निंदा होती है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक ו और कालवाचक עתה दोनों को रखते हुए भविष्यवाणी के प्रवाह में स्वाभाविक संक्रमण व्यक्त करता है।
- source_word: מַה־לִּי פֹה
  choice: यहाँ मेरे लिए क्या है?
  rationale: इब्रानी के संक्षिप्त आलंकारिक प्रश्न और उसमें निहित दिव्य विरोध/विस्मय को बनाए रखता है, बिना अर्थ को ‘मेरा यहाँ क्या काम है?’ तक सीमित किए।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: प्रामाणिक भविष्यसूचक सूत्र को गरिमापूर्ण और सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुराक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय नाम के रूप में लिप्यंतरित करता है।
- source_word: לֻקַּח עַמִּי
  choice: मेरी प्रजा ... ले जाई गई है
  rationale: निष्क्रिय पूर्ण क्रिया के संपन्न कार्य और उसके वर्तमान परिणाम को हिन्दी के पूर्ण वर्तमान से व्यक्त करता है।
- source_word: חִנָּם
  choice: यों ही
  rationale: ‘बिना मूल्य’ और ‘बिना उचित कारण’ की संभावित अर्थछटाओं को किसी एक तक सीमित न करके संक्षिप्त, स्वाभाविक हिन्दी में मूल की व्यापकता बचाता है।
- source_word: מֹשְׁלָיו
  choice: उस पर शासन करनेवाले
  rationale: सर्वनाम का संबंध ‘मेरी प्रजा’ से स्पष्ट करता है; मुख्य पाठ में ‘अत्याचारी’ कहकर संदर्भगत अर्थ को मूल शब्द से अधिक विशिष्ट नहीं बनाता।
- source_word: יְהֵילִילוּ
  choice: विलाप करते हैं
  rationale: ילל के ऊँचे स्वर में शोक करने के भाव को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है; ‘हाहाकार करते हैं’ विकल्प टिप्पणी में रखा गया है।
- source_word: וְתָמִיד כָּל־הַיּוֹם
  choice: और निरंतर, दिन भर
  rationale: अवधि पर दिए गए दोहरे बल को समेटने के बजाय दोनों अभिव्यक्तियों को बनाए रखता है।
- source_word: שְׁמִי מִנֹּאָץ
  choice: मेरे नाम का तिरस्कार होता है
  rationale: נאץ के व्यापक ‘तुच्छ जानना/अपमान करना’ अर्थ को स्वाभाविक हिन्दी में रखता है; अधिक विशिष्ट ‘निन्दा’ को टिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में प्रयुक्त वाचा-संबंधी व्यक्तिगत नाम को नाम के रूप में बनाए रखता है और उसे किसी उपाधि में नहीं बदलता।
- issue: מִנֹּאָץ में परमेश्वर के नाम के अनादर का स्वरूप
  choice: मेरे नाम का तिरस्कार होता है
  alternative: मेरे नाम की निन्दा होती है
  rationale: इब्रानी क्रिया तिरस्कार से लेकर ईशनिन्दा तक का अर्थ दे सकती है। मुख्य पाठ व्यापक अर्थ रखता है, जबकि अधिक प्रबल धार्मिक अभिव्यक्ति टिप्पणी में दी गई है।
- issue: מֹשְׁלָיו के शासकों का नैतिक चरित्र
  choice: उस पर शासन करनेवाले
  alternative: उसके अत्याचारी
  rationale: संदर्भ में शासन दमनकारी है, पर मूल संज्ञा स्वयं सामान्यतः ‘शासन करनेवाले’ कहती है; इसलिए व्याख्यात्मक ‘अत्याचारी’ को वैकल्पिक टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण भविष्यसूचक शैली में रखी गई है। प्रत्यक्ष वचन के उद्धरण और दोहराया गया घोषणासूत्र मूल की वाक्य-रचना तथा बल को स्पष्ट करते हैं। ‘यों ही’ חִנָּם की मूल्यहीनता और अनुचित/अकारण कार्रवाई—दोनों संभावित अर्थछटाओं को खुला रखता है।
