base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/013.yaml
  text: Behold[a], my servant will act wisely; he will be raised and lifted up and highly exalted.
translation:
  language: hi
  text: देखो, मेरा सेवक बुद्धिमानी से काम करेगा[a]; वह ऊँचा उठाया जाएगा, उन्नत किया जाएगा और अत्यन्त ऊँचा होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सफल होगा।” इब्रानी क्रिया का अर्थ बुद्धिमानी से काम करना और उसके फलस्वरूप सफल होना, दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह शब्द अगले कथन की ओर ज़ोर देकर ध्यान खींचता है। आधुनिक हिन्दी में ‘देखो’ स्वाभाविक रहते हुए भविष्यद्वाणी की गंभीरता बनाए रखता है।
- source_word: יַשְׂכִּיל
  choice: बुद्धिमानी से काम करेगा
  rationale: שׂכל के हिफ़ील रूप का मूल भाव समझ-बूझ से कार्य करना है; उससे मिलने वाली सफलता का अर्थ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: עַבְדִּי
  choice: मेरा सेवक
  rationale: עבד के अर्थ-क्षेत्र में दास और सेवक दोनों आते हैं, पर यशायाह के इस प्रसंग में ‘सेवक’ स्वाभाविक और तटस्थ है तथा मूल पाठ से परे उसकी पहचान तय नहीं करता।
- source_word: יָרוּם
  choice: ऊँचा उठाया जाएगा
  rationale: רום ऊँचा होने या ऊँचा किए जाने का भाव देता है। यह चयन ऊर्ध्वगमन और सम्मान, दोनों संकेतों को बनाए रखता है।
- source_word: וְנִשָּׂא
  choice: उन्नत किया जाएगा
  rationale: निफ़अल रूप यहाँ ऊँचा किए जाने या प्रतिष्ठित होने का भाव देता है। ‘उन्नत किया जाएगा’ पहले पद के साथ अर्थपूर्ण समानांतरता रखता है, बिना दोनों को पूर्णतः एक जैसा बनाए।
- source_word: וְגָבַהּ מְאֹד
  choice: अत्यन्त महान होगा
  rationale: גבהּ מְאֹד त्रिस्तरीय उत्कर्ष का चरम है। ‘अत्यन्त महान होगा’ आधुनिक हिन्दी में स्वाभाविक ढंग से उसकी अत्यधिक ऊँचाई और महिमा व्यक्त करता है।
theological_decisions:
- issue: सेवक की संभावित मसीही पहचान
  choice: मूल पाठ के अनुसार केवल ‘मेरा सेवक’ रखा गया है।
  alternative: अनुवाद में ही सेवक को स्पष्ट रूप से मसीह या ख्रीष्ट कहना।
  rationale: इब्रानी पाठ इस पद में सेवक की पहचान स्पष्ट नहीं करता। इसलिए अनुवाद उस संभावित मसीही अर्थ को न नकारता है, न उसे शब्दों में जोड़कर व्याख्या को पहले से निश्चित करता है।
- issue: ऊँचा किए जाने की क्रियाओं में दैवी कर्मकर्ता
  choice: जहाँ रूप अनुमति देता है, निष्क्रिय अभिव्यक्ति रखी गई है और कर्मकर्ता को अनकहा छोड़ा गया है।
  alternative: ‘परमेश्वर उसे ऊँचा उठाएगा’ कहकर कर्मकर्ता स्पष्ट करना।
  rationale: संदर्भ में परमेश्वर कर्मकर्ता समझे जा सकते हैं, पर इस पद में उनका नाम क्रियाओं के साथ स्पष्ट नहीं है; अतः उसे अनुवाद में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर, सार्वजनिक-पाठ योग्य स्वर अपनाया गया है। ‘देखो’ ध्यानाकर्षक उद्घोष है; ‘बुद्धिमानी से काम करेगा’ अर्थ की मूल समझ-बूझ वाली धुरी को रखता है। अंतिम तीन अभिव्यक्तियों में क्रमिक उत्कर्ष और काव्यात्मक समानांतरता बनाए रखी गई है।
