reference: Isaiah 52:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ס֤וּרוּ ס֨וּרוּ֙ צְא֣וּ מִ/שָּׁ֔ם טָמֵ֖א אַל תִּגָּ֑עוּ צְא֣וּ מִ/תּוֹכָ֔/הּ הִבָּ֕רוּ נֹשְׂאֵ֖י כְּלֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/011.yaml
  text: Turn away[a], turn away; go out from there. Touch no unclean thing. Go out from her midst; purify yourselves[c][b], you who carry the vessels of Yahweh.
translation:
  language: hi
  text: हट जाओ[a], हट जाओ; वहाँ से निकल जाओ। किसी अशुद्ध वस्तु को मत छुओ। उसके बीच से निकल जाओ[b]; अपने आप को शुद्ध करो[c], तुम जो यहोवा के पात्र उठाते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दूर हो जाओ।’ आज्ञा की पुनरावृत्ति अलग हो जाने की पुकार को तीव्र करती है।
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में ‘उसके बीच से’; स्त्रीलिंग सर्वनाम सम्भवतः नगर की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘शुद्ध हो जाओ।’
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּרוּ
  choice: हट जाओ
  rationale: बहुवचन आज्ञार्थक क्रिया की पुनरावृत्ति अलग हो जाने की तात्कालिक और प्रबल पुकार व्यक्त करती है; इसके बाद आने वाली צְאוּ से इसे अलग भी रखती है।
- source_word: צְאוּ
  choice: निकल जाओ
  rationale: יצא के बहुवचन आज्ञार्थक का सीधा और स्वाभाविक अर्थ; स्थान छोड़ने की स्पष्ट आज्ञा।
- source_word: מִשָּׁם
  choice: वहाँ से
  rationale: छोड़े जाने वाले स्थान को बताने वाला सरल क्रियाविशेषणीय पद।
- source_word: טָמֵא אַל תִּגָּעוּ
  choice: किसी अशुद्ध वस्तु को मत छुओ
  rationale: טָמֵא यहाँ संज्ञावत् प्रयुक्त है। ‘अशुद्ध’ धार्मिक और नैतिक, दोनों संभावित आयामों को बिना सीमित किए बनाए रखता है।
- source_word: מִתּוֹכָהּ
  choice: उसके बीच से
  rationale: स्त्रीलिंग एकवचन प्रत्यय को हिन्दी में स्वाभाविक ढंग से रखा गया है; संदर्भ सम्भवतः स्त्रीलिंग रूप में कल्पित नगर का है।
- source_word: הִבָּרוּ
  choice: अपने आप को शुद्ध करो
  rationale: बहुवचन आज्ञार्थक को शुद्धीकरण के सक्रिय आह्वान के रूप में व्यक्त करता है; ‘शुद्ध रहो’ भी सम्भव है, इसलिए टिप्पणी दी गई है।
- source_word: נֹשְׂאֵי
  choice: तुम जो ... उठाते हो
  rationale: सम्बोधन के रूप में प्रयुक्त कृदन्त को सरल आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: כְּלֵי יְהוָה
  choice: यहोवा के पात्र
  rationale: כְּלֵי यहाँ पवित्रस्थान के पात्रों या पवित्र उपकरणों को सूचित करता है; ‘पात्र’ स्थापित और प्रसंगानुकूल शब्द है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: अशुद्धता और शुद्धीकरण की प्रकृति
  choice: ‘अशुद्ध’ और ‘अपने आप को शुद्ध करो’ रखकर धार्मिक-अनुष्ठानिक तथा नैतिक दोनों अर्थ-क्षेत्र खुले रखे गए हैं।
  alternative: इसे केवल अनुष्ठानिक शुद्धता या केवल बाबेल की नैतिक बुराई से अलगाव के अर्थ में स्पष्ट करना।
  rationale: पवित्र पात्र उठाने का प्रसंग उपासना-संबंधी शुद्धता की ओर संकेत करता है, जबकि नगर से निकलने का व्यापक संदर्भ नैतिक अलगाव भी सूचित कर सकता है; मूल का तनाव बनाए रखा गया है।
- issue: מִתּוֹכָהּ में स्त्रीलिंग संदर्भ
  choice: ‘उसके बीच से’
  alternative: ‘उस नगर के बीच से’ या ‘उसके भीतर से’
  rationale: नगर का नाम जोड़ना अर्थ को अधिक स्पष्ट करता, पर वह इस पद में प्रत्यक्ष नहीं है; सर्वनाम मूल की संदर्भगत अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और आज्ञात्मक शैली रखी गई है। समानान्तर आज्ञाओं की लय तथा ‘अशुद्ध/शुद्ध’ शब्दों का धार्मिक-नैतिक अर्थ-क्षेत्र सुरक्षित रखा गया है।
