base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/014.yaml
  text: Just as many were appalled at you—so disfigured was his appearance[a], beyond that of a man[c][b], and his form beyond the sons of man—
translation:
  language: hi
  text: जिस प्रकार बहुत-से लोग तुम्हें देखकर स्तब्ध रह गए थे—उसी प्रकार उसका रूप[a] किसी मनुष्य के रूप से भी अधिक विकृत[b] था, और उसकी आकृति मनुष्यों की आकृति से भी अधिक विकृत थी[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में इसी पद के भीतर ‘तुम्हें’ से ‘उसका’ और ‘उसकी’ में परिवर्तन होता है।
    reason: alternative_reading
  - marker: b
    text: या ‘क्षत-विक्षत’।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘आदम की संतानों से’; यह मनुष्यों के लिए प्रयुक्त इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: जिस प्रकार ... इतना
  rationale: तुलनात्मक संरचना को स्वाभाविक हिन्दी में व्यक्त करता है; वाक्य का व्यापक प्रतितुलनात्मक निष्कर्ष अगले पद में पूरा होता है।
- source_word: שָׁמְמוּ
  choice: स्तब्ध रह गए थे
  rationale: यह प्रतिक्रिया केवल आश्चर्य नहीं, बल्कि भयावह दृश्य से उत्पन्न गहरे सदमे को व्यक्त करती है।
- source_word: עָלֶיךָ
  choice: तुम्हें देखकर
  rationale: मसोरेटिक पाठ के द्वितीय पुरुष एकवचन को बनाए रखता है और इस प्रसंग में על की प्रतिक्रिया-संबंधी शक्ति को सहज हिन्दी में प्रकट करता है।
- source_word: מִשְׁחַת
  choice: विकृत
  rationale: शारीरिक रूप के बिगड़ या पहचान से परे बदल जाने का भाव स्पष्ट, आधुनिक हिन्दी में देता है।
- source_word: מֵאִישׁ מַרְאֵהוּ
  choice: उसका रूप इतना विकृत था कि वह मनुष्य का-सा नहीं लगता था
  rationale: 'तुलनात्मक מן को हिन्दी में अर्थपूर्ण ढंग से व्यक्त करता है: उसका दृश्य रूप सामान्य मानवीय रूप से परे बिगड़ चुका था।'
- source_word: וְתֹאֲרוֹ
  choice: और उसकी आकृति
  rationale: מַרְאֶה ‘रूप’ से भेद रखते हुए बाहरी गठन या आकार के लिए स्वाभाविक समानांतर शब्द है।
- source_word: מִבְּנֵי אָדָם
  choice: मानव-संतानों जैसी नहीं लगती थी
  rationale: इब्रानी अभिव्यक्ति की संरचना को कुछ हद तक बनाए रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि इसका आशय सामान्यतः मनुष्यों से है।
theological_decisions:
- issue: पद के भीतर व्याकरणिक पुरुष का परिवर्तन
  choice: ‘तुम्हें’ से ‘उसका/उसकी’ में मसोरेटिक परिवर्तन को बनाए रखा गया है।
  alternative: पूरे पद को ‘उसे/उसका’ करके तृतीय पुरुष में एकरूप करना।
  rationale: इब्रानी पाठ अचानक द्वितीय पुरुष से तृतीय पुरुष में जाता है। इसे सहज बनाने के लिए सामंजस्य बैठाना पाठ की वास्तविक असंगति को मिटा देता।
- issue: मानव-संदर्भ वाली अभिव्यक्ति
  choice: אִישׁ के लिए ‘मनुष्य’ और בְּנֵי אָדָם के लिए ‘मानव-संतानें’।
  alternative: दोनों स्थानों पर केवल ‘मनुष्य’ या ‘मानवजाति’।
  rationale: दो अलग इब्रानी अभिव्यक्तियों का अंतर बनाए रखते हुए यह स्पष्ट किया गया है कि दूसरी अभिव्यक्ति सामान्य रूप से मानव प्राणियों को सूचित करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। आरंभिक तुलना अगले पद में पूरी होती है, इसलिए अंत में दीर्घ विराम-चिह्न रखा गया है।
