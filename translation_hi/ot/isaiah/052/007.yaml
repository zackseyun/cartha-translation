id: ISA.52.7
reference: Isaiah 52:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מַה נָּאו֨וּ עַל הֶ/הָרִ֜ים רַגְלֵ֣י מְבַשֵּׂ֗ר מַשְׁמִ֧יעַ שָׁל֛וֹם מְבַשֵּׂ֥ר ט֖וֹב מַשְׁמִ֣יעַ יְשׁוּעָ֑ה אֹמֵ֥ר לְ/צִיּ֖וֹן מָלַ֥ךְ אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/007.yaml
  text: How beautiful on the mountains are the feet of the one who brings good news[a], who announces peace, who brings good news of good things, who announces salvation, who says to Zion, “Your God reigns.”
translation:
  language: hi
  text: पहाड़ों पर शुभ समाचार लानेवाले के पाँव कितने सुन्दर हैं! वह शान्ति की घोषणा करता है, भलाई का शुभ समाचार लाता है, उद्धार की घोषणा करता है और सिय्योन से कहता है, “तेरा परमेश्वर राज्य करता है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरा परमेश्वर राजा हो गया है” अथवा “तेरा परमेश्वर राजा है।” हिब्रू में राज्यारोहण या राजकीय शासन, दोनों पर बल सम्भव है।
    reason: alternative_reading
lexical_decisions:
- source_word: מַה נָּאווּ
  choice: कितने सुन्दर हैं
  rationale: מַה यहाँ प्रश्नवाचक नहीं, विस्मयबोधक है। यह चुनाव प्रशंसा के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עַל הֶהָרִים
  choice: पहाड़ों पर
  rationale: मूल के ठोस भौगोलिक बिम्ब को बनाए रखता है; הָרִים का सामान्य अर्थ ‘पहाड़’ है।
- source_word: רַגְלֵי מְבַשֵּׂר
  choice: शुभ समाचार लानेवाले के पाँव
  rationale: ‘पाँव’ के काव्यात्मक और लाक्षणिक बिम्ब को सुरक्षित रखते हुए मְבַשֵּׂר कृदन्त की क्रियात्मक शक्ति भी बनी रहती है।
- source_word: מַשְׁמִיעַ שָׁלוֹם
  choice: शान्ति की घोषणा करता है
  rationale: שמע के हिफ़ील रूप का अर्थ ‘सुनाना/घोषित करना’ है; ‘घोषणा’ संदेशवाहक के सार्वजनिक उद्घोष को स्पष्ट करती है।
- source_word: מְבַשֵּׂר טוֹב
  choice: भलाई का शुभ समाचार लाता है
  rationale: טוֹב को केवल भौतिक समृद्धि तक सीमित नहीं करता और מְבַשֵּׂר की पुनरावृत्ति को हिन्दी में बनाए रखता है।
- source_word: מַשְׁמִיעַ יְשׁוּעָה
  choice: उद्धार की घोषणा करता है
  rationale: יְשׁוּעָה के छुटकारे और उद्धार दोनों आयामों में से ‘उद्धार’ यहाँ उसके व्यापक और धर्मवैचारिक भार को सुरक्षित रखता है।
- source_word: אֹמֵר לְצִיּוֹן
  choice: सिय्योन से कहता है
  rationale: प्रत्यक्ष कथन की सरल संरचना और स्थान/समुदाय के रूप में सिय्योन के व्यक्तिकरण को बनाए रखता है।
- source_word: מָלַךְ אֱלֹהָיִךְ
  choice: तेरा परमेश्वर राज्य करता है
  rationale: यह स्वाभाविक हिन्दी में परमेश्वर के राजकीय शासन की घोषणा करता है, जबकि हिब्रू पूर्ण रूप में निहित राज्यारोहण की सम्भावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: מָלַךְ אֱלֹהָיִךְ की राजकीय घोषणा
  choice: तेरा परमेश्वर राज्य करता है
  alternative: तेरा परमेश्वर राजा हो गया है; तेरा परमेश्वर राजा है
  rationale: हिब्रू קָטַל रूप को राज्यारोहण की घोषणा अथवा वर्तमान राजकीय शासन की उद्घोषणा—दोनों रूपों में समझा जा सकता है। मुख्य पाठ स्वाभाविक और व्यापक अभिव्यक्ति रखता है; अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक उद्घोष की काव्यात्मक लय के अनुरूप रखी गई है। ‘शुभ समाचार’ की पुनरावृत्ति जानबूझकर सुरक्षित है। विस्मय को स्पष्ट करने के लिए पहले वाक्य में विस्मयादिबोधक चिह्न रखा गया है।
