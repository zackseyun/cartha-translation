lexical_decisions:
- source_word: הוֹי
  choice: हाय उन पर
  rationale: न्याय की भविष्यवाणी के प्रसंग में यह विस्मयादिबोधक शोक के साथ धिक्कार और आसन्न विपत्ति व्यक्त करता है; ‘हाय उन पर’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से पहुँचाता है।
- source_word: חֲכָמִים
  choice: बुद्धिमान
  rationale: यह उन लोगों का वर्णन करता है जो स्वयं को बुद्धिमान मानते हैं; समानांतर पद के साथ संक्षिप्त विशेषण-रूप उपयुक्त है।
- source_word: בְּעֵינֵיהֶם
  choice: अपनी ही दृष्टि में
  rationale: इब्रानी मुहावरे में आत्म-मूल्यांकन का भाव है। ‘ही’ आत्मकेंद्रित दावे पर बल देता है, जबकि ‘दृष्टि में’ हिन्दी में स्वाभाविक मुहावरा है।
- source_word: וְנֶגֶד פְּנֵיהֶם
  choice: अपने ही सामने
  rationale: शाब्दिक स्थानिक चित्र ‘अपने चेहरों के सामने’ का है। ‘अपने ही सामने’ उस चित्र और पहले खंड के समानांतर आत्म-मूल्यांकन—दोनों को बनाए रखता है।
- source_word: נְבֹנִים
  choice: समझदार
  rationale: בין से बना यह शब्द समझने, परखने और विवेक रखने की क्षमता बताता है। ‘समझदार’ सामान्य आधुनिक हिन्दी में स्पष्ट है; ‘विवेकी’ निकट lexical विकल्प है।
