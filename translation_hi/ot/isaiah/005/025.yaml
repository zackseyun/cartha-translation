  choice: इस कारण
  rationale: यह पद पिछले अभियोग के परिणाम को सामने लाता है; यह कारण और परिणाम का संबंध स्पष्ट तथा स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: חָרָה אַף יְהוָה
  choice: याहवे का क्रोध ... भड़क उठा
  rationale: यह चयन क्रोध के जलने की इब्रानी छवि को स्वाभाविक आधुनिक हिन्दी में जीवंत रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ के विशिष्ट दिव्य नाम को सामान्य उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
- source_word: בְּעַמּוֹ
  choice: अपनी प्रजा पर
  rationale: क्रोध-सूचक क्रिया के साथ ב यहाँ क्रोध की दिशा या लक्ष्य बताता है; 'पर' हिन्दी में इसे सहज रूप से व्यक्त करता है।
- source_word: וַיֵּט יָדוֹ עָלָיו
  choice: उसने उनके विरुद्ध अपना हाथ बढ़ाकर
  rationale: हाथ बढ़ाने की न्याय-संबंधी सजीव छवि सुरक्षित रखी गई है; एकवचन सामूहिक 'प्रजा' का संकेत हिन्दी में अर्थानुसार बहुवचन 'उनके' से व्यक्त हुआ है।
- source_word: וַיַּכֵּהוּ
  choice: उन्हें मारा
  rationale: एकवचन कर्म-प्रत्यय सामूहिक प्रजा को सूचित करता है; हिन्दी में बहुवचन सर्वनाम अर्थ स्पष्ट करता है।
- source_word: וַיִּרְגְּזוּ הֶהָרִים
  choice: पहाड़ काँप उठे
  rationale: क्रिया के तीव्र कंपित होने के अर्थ और भविष्यद्वक्तीय वर्णन की शक्ति को स्वाभाविक हिन्दी में रखा गया है।
- source_word: נִבְלָתָם
  choice: उनकी लाशें
  rationale: यह मृत देहों को स्पष्ट, गंभीर और सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כַּסּוּחָה
  choice: कूड़े के समान
  rationale: शब्द फेंकी या बुहारी गई वस्तु का बिंब देता है; 'कूड़ा' उसका सुलभ व्यापक अर्थ है, जबकि अधिक विशिष्ट संभावना पादटिप्पणी में दी गई है।
- source_word: בְּקֶרֶב חוּצוֹת
  choice: सड़कों के बीच
  rationale: यह नगर के सार्वजनिक मार्गों के बीच खुले में पड़ी लाशों का स्थानिक बिंब बनाए रखता है।
- source_word: בְּכָל זֹאת
  choice: इतना सब होने पर भी
  rationale: यह यशायाह के आवर्ती कथन में पहले हो चुके न्याय के बावजूद क्रोध न टलने का संबंध स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: לֹא שָׁב אַפּוֹ
  choice: उसका क्रोध नहीं टला
  rationale: क्रोध के वापस न मुड़ने वाले इब्रानी मुहावरे का सहज हिन्दी अर्थ है, और दैवी रोष के जारी रहने को व्यक्त करता है।
- source_word: וְעוֹד יָדוֹ נְטוּיָה
  choice: उसका हाथ अब भी बढ़ा हुआ है
  rationale: न्याय के लिए बढ़े हुए हाथ की मानवरूपी छवि और कार्रवाई के जारी रहने का भाव दोनों सुरक्षित हैं।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा या प्रभु
  rationale: विशिष्ट इब्रानी नाम को नाम के रूप में रखने से मूल पाठ की पहचान सुरक्षित रहती है और किसी सामान्य उपाधि से उसका भेद मिटता नहीं।
- issue: दैवी क्रोध और बढ़े हुए हाथ की मानवरूपी भाषा
  choice: क्रोध के भड़कने और हाथ बढ़ाने की छवियाँ बनाए रखना
  alternative: इसे केवल 'परमेश्वर बहुत क्रोधित हुआ और दंड देता रहा' जैसे अमूर्त कथन में बदलना
  rationale: मूल पाठ न्याय को देहात्मक और प्रभावशाली भविष्यद्वक्तीय बिंबों से व्यक्त करता है; इन्हें बनाए रखना पाठ के बल और तनाव को सुरक्षित रखता है।
- issue: सामूहिक एकवचन עַם और उसके सर्वनाम
  choice: प्रजा के लिए आगे बहुवचन 'उनके/उन्हें'
  alternative: एकवचन 'उस पर/उसे'
  rationale: इब्रानी में 'प्रजा' व्याकरणतः एकवचन सामूहिक संज्ञा है, पर हिन्दी में उसके लोगों पर प्रहार और उनकी लाशों के संदर्भ में बहुवचन अधिक स्पष्ट और स्वाभाविक है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गंभीर और भविष्यद्वक्तीय रखी गई है। छोटे, प्रबल वाक्यांश मूल के न्याय-वर्णन की गति बनाए रखते हैं। 'प्रजा', 'क्रोध' और 'विरुद्ध' जैसे शब्द गरिमापूर्ण हैं, पर सामान्य पाठक के लिए सहज भी हैं। पादटिप्पणी-चिह्न को संबंधित शब्द 'कूड़े' के तुरंत बाद रखा गया है।
