base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/025.yaml
  text: Therefore the anger of Yahweh burned against his people[a], and he stretched out his hand against them and struck them; the mountains quaked, and their corpses were like refuse in the midst of the streets. For all this, his anger has not turned away, and his hand is still stretched out.
translation:
  language: hi
  text: इस कारण याहवे का क्रोध अपनी प्रजा पर भड़क उठा। उसने उनके विरुद्ध अपना हाथ बढ़ाकर उन्हें मारा; पहाड़ काँप उठे, और उनकी लाशें सड़कों के बीच कूड़े[a] के समान थीं। इतना सब होने पर भी उसका क्रोध नहीं टला, और उसका हाथ अब भी बढ़ा हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुहारी हुई गंदगी”; इब्रानी शब्द ऐसी वस्तु का संकेत कर सकता है जिसे बुहारकर हटा दिया गया हो या फेंक दिया गया हो।
    reason: כַּסּוּחָה के व्यापक अर्थ ‘कूड़ा’ के साथ अधिक विशिष्ट शाब्दिक संभावना को सुरक्षित रखना।
lexical_decisions:
