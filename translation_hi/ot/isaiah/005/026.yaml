base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/026.yaml
  text: He will raise a signal for the nations from far away[a], and whistle for them from the end of the earth; and behold, quickly, swiftly[c][b], it comes.
translation:
  language: hi
  text: वह दूर के राष्ट्रों के लिए झंडा[a] खड़ा करेगा और पृथ्वी के छोर से उन्हें सीटी बजाकर बुलाएगा[b]। और देखो, वह[c] शीघ्रता से, बड़ी तेजी से आ रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संकेत-ध्वज” अथवा “पताका।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी क्रिया का अर्थ तीखी सीटी जैसी ध्वनि निकालकर संकेत देना या बुलाना है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में यहाँ सर्वनाम और क्रिया एकवचन हैं—“वह ... आ रहा है।” सम्भवतः आक्रमणकारी सैन्य-बल को एक सामूहिक इकाई के रूप में प्रस्तुत किया गया है।
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וְנָשָׂא
  choice: खड़ा करेगा
  rationale: נֵס के साथ यह उठाकर दृश्यमान संकेत स्थापित करने का भाव देता है; आधुनिक हिन्दी में ‘झंडा खड़ा करेगा’ स्वाभाविक है।
- source_word: נֵס
  choice: झंडा
  rationale: यह ऊँचा किया गया संकेत, ध्वज या मानक है। ‘झंडा’ सामान्य पाठक के लिए सैन्य-सम्मेलन के दृश्य को स्पष्ट रखता है; विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: לַגּוֹיִם מֵרָחוֹק
  choice: दूर की जातियों के लिए
  rationale: מֵרָחוֹק को यहाँ दूर स्थित जातियों से जोड़ना स्रोत-पाठ का स्वाभाविक अर्थ है और उन्हें बुलाने के अगले वाक्यांश से मेल खाता है।
- source_word: וְשָׁרַק לוֹ
  choice: उन्हें सीटी बजाकर बुलाएगा
  rationale: שׁרק तीखी सीटी जैसे संकेत की ध्वनि बताता है। ‘बुलाएगा’ हिन्दी में उस संकेत का प्रयोजन स्पष्ट करता है, जबकि ध्वनि-चित्र भी बना रहता है।
- source_word: מִקְצֵה הָאָרֶץ
  choice: पृथ्वी के छोर से
  rationale: यह अत्यन्त दूर के स्थान का मुहावरा है; अंतरराष्ट्रीय संदर्भ में ‘पृथ्वी’ उपयुक्त है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह अचानक उपस्थित होने और दृश्य की तात्कालिकता पर ध्यान खींचता है; ‘देखो’ आधुनिक और गरिमापूर्ण है।
- source_word: מְהֵרָה קַל
  choice: शीघ्रता से, बड़ी तेजी से
  rationale: दोनों पद आगमन की गति को दुहरा कर बल देते हैं; हिन्दी में यह युग्म उस तीव्रता को स्वाभाविक रूप से बनाए रखता है।
- source_word: יָבוֹא
  choice: आ रहा है
  rationale: ‘देखो’ के बाद वर्तमान प्रगतिशील रूप निकट और सजीव आगमन व्यक्त करता है। एकवचन रूप को ‘वह’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: बहुवचन जातियों के बाद एकवचन सर्वनाम और क्रिया का संदर्भ
  choice: आरम्भ में ‘उन्हें’, पर अंतिम खंड में ‘वह ... आ रहा है’
  alternative: पूरे वाक्य में बहुवचन ‘वे ... आ रहे हैं’, अथवा निर्जीव सामूहिक सेना के लिए ‘वह ... आ रही है’
  rationale: इब्रानी में जातियाँ बहुवचन हैं, पर לוֹ और יָבוֹא पुल्लिंग एकवचन हैं। अनुवाद इस बदलाव को मिटाता नहीं; पादटिप्पणी बताती है कि एकवचन आक्रमणकारी सैन्य-बल को सामूहिक इकाई के रूप में चित्रित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज पर गरिमापूर्ण है। सैन्य-संकेत का दृश्य स्पष्ट रखने के लिए ‘झंडा’ और ‘सीटी बजाकर बुलाएगा’ चुने गए हैं। ‘और देखो’ तथा वर्तमान प्रगतिशील अंतिम क्रिया भविष्यवाणी की सजीव तात्कालिकता बनाए रखते हैं।
