translation:
  language: hi
  text: क्योंकि दाख की बारी की दस जोतों से एक बत ही निकलेगा, और एक होमेर बोए हुए बीज से एक एफ़ा ही उपजेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले न्याय-वचन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲשֶׂרֶת צִמְדֵּי כֶרֶם
  choice: दस जोड़ी-बैल-जितने दाख की बारी के क्षेत्र
  rationale: צֶמֶד मूलतः जोड़ी या जुए में जुड़ी बैलों की जोड़ी है और विस्तार से उतनी भूमि को सूचित करता है जितनी वह जोड़ी जोत सके। यह रूप आधुनिक क्षेत्रफल में अनुमान लगाए बिना इब्रानी कृषि-बिंब और माप-संबंधी अर्थ दोनों रखता है।
- source_word: יַעֲשׂוּ / יַעֲשֶׂה
  choice: उपजेगा
  rationale: עשה का मूल अर्थ ‘करना/बनाना’ है, पर कृषि-उपज और मापों के संदर्भ में ‘उपजना’ स्वाभाविक हिन्दी है। दोनों occurrences का समान अनुवाद किया गया है।
- source_word: בַּת אֶחָת
  choice: एक बत
  rationale: बत प्राचीन तरल माप है। मूल पाठ की विशिष्टता बनाए रखने के लिए इकाई को लिप्यंतरित किया गया है।
- source_word: וְזֶרַע חֹמֶר
  choice: एक होमेर बीज
  rationale: यह होमेर भर बीज की मात्रा बताने वाला construct phrase है; संक्षिप्त हिन्दी में मात्रा स्पष्ट रहती है।
- source_word: אֵיפָה
  choice: एक एपा
  rationale: एपा प्राचीन शुष्क माप है; परिशुद्धता और स्रोत-पारदर्शिता के लिए इसे लिप्यंतरित रखा गया है।
- source_word: אֶחָת
  choice: केवल एक
  rationale: संख्या का मूल अर्थ ‘एक’ है; ‘केवल’ संदर्भ में अत्यल्प उपज का निहित विरोध स्पष्ट करता है, बिना माप बदले।
