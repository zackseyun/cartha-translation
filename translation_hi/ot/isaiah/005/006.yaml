  text: וַ/אֲשִׁיתֵ֣/הוּ בָתָ֗ה לֹ֤א יִזָּמֵר֙ וְ/לֹ֣א יֵעָדֵ֔ר וְ/עָלָ֥ה שָׁמִ֖יר וָ/שָׁ֑יִת וְ/עַ֤ל הֶ/עָבִים֙ אֲצַוֶּ֔ה מֵ/הַמְטִ֥יר עָלָ֖י/ו מָטָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/006.yaml
  text: And I will make it a wasteland[a]; it will not be pruned or hoed, and briers and thorns will grow up[c][b]; and I will command the clouds not to rain on it.
translation:
  language: hi
  text: मैं उसे उजाड़ भूमि बना दूँगा[a]; न उसकी छँटाई की जाएगी, न उसकी मिट्टी खोदी जाएगी[b]; उसमें कँटीली झाड़ियाँ और काँटे उग आएँगे। और मैं बादलों को आज्ञा दूँगा कि वे उस पर वर्षा न करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उजाड़,” अथवा “अनजोती भूमि।”
    reason: lexical_alternative
  - marker: b
    text: या “न उसमें कुदाल चलाई जाएगी।” हिब्रू शब्द खेती के लिए मिट्टी खोदने को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשִׁיתֵהוּ
  choice: मैं उसे ... बना दूँगा
  rationale: שׂים यहाँ विधेय संज्ञा के साथ किसी वस्तु को एक दशा में कर देने का भाव देता है; न्याय के संदर्भ में यह स्वाभाविक हिन्दी है।
- source_word: בָתָה
  choice: उजाड़ भूमि
  rationale: यह दुर्लभ संज्ञा उजड़ी हुई अथवा खेती से छोड़ी गई भूमि को सूचित करती है; यह चयन विनाश और उपेक्षा दोनों भाव रखता है।
- source_word: לֹא יִזָּמֵר
  choice: न उसकी छँटाई की जाएगी
  rationale: दाख की बारी के संदर्भ में זמר बेलों की छँटाई को दर्शाता है; कर्मवाच्य निफ़अल को हिन्दी कर्मवाच्य में रखा गया है।
- source_word: וְלֹא יֵעָדֵר
  choice: न उसकी मिट्टी खोदी जाएगी
  rationale: עדר कृषि के लिए भूमि खोदने या कुदाल चलाने का संकेत देता है; 'मिट्टी खोदी जाएगी' सामान्य पाठक के लिए स्पष्ट है और व्यापक अर्थ बचाए रखता है।
- source_word: וְעָלָה
  choice: उग आएँगे
  rationale: क्रिया अवांछित वनस्पति के निकल आने को व्यक्त करती है; हिन्दी में 'उग आएँगे' स्वाभाविक और चित्रात्मक है।
- source_word: שָׁמִיר וָשָׁיִת
  choice: कँटीली झाड़ियाँ और काँटे
  rationale: दोनों वनस्पति-संज्ञाओं की सटीक प्रजातियाँ अनिश्चित हैं; यह अनुवाद उजाड़पन की काँटेदार वृद्धि का चित्र सुरक्षित रखता है, बिना वनस्पति की अतिविशिष्ट पहचान किए।
- source_word: וְעַל הֶעָבִים אֲצַוֶּה
  choice: और मैं बादलों को आज्ञा दूँगा
  rationale: हिब्रू में बादलों के विषय में दी गई आज्ञा को स्वाभाविक हिन्दी में प्रत्यक्ष कर्म के रूप में व्यक्त किया गया है।
- source_word: מֵהַמְטִיר עָלָיו מָטָר
  choice: कि वे उस पर वर्षा न करें
  rationale: מן सहित क्रियार्थक रूप यहाँ वर्षा को रोकने की आज्ञा व्यक्त करता है; हिब्रू के सजातीय कर्म 'वर्षा बरसाना' को स्वाभाविक हिन्दी मुहावरे में संक्षिप्त किया गया है।
theological_decisions:
- issue: न्याय के चित्र में वक्ता की प्रत्यक्ष भूमिका
  choice: 'पहले पुरुष की प्रत्यक्ष क्रिया रखी गई: ''मैं ... बना दूँगा'' और ''मैं ... आज्ञा दूँगा''।'
  alternative: विनाश को निर्वैयक्तिक घटना के रूप में व्यक्त करना।
  rationale: हिब्रू वक्ता को दाख की बारी पर न्याय लागू करने वाला सक्रिय कर्ता दिखाता है; इसे नरम या परोक्ष नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। कृषि-संबंधी क्रियाओं को सामान्य पाठक के लिए स्पष्ट रखा गया है। मूल पाठ की प्रत्यक्ष दैवी क्रिया और उजड़ी दाख की बारी का चित्र सुरक्षित है।
