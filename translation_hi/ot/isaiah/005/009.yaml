source:
  edition: WLC
  text: בְּ/אָזְנָ֖/י יְהוָ֣ה צְבָא֑וֹת אִם לֹ֞א בָּתִּ֤ים רַבִּים֙ לְ/שַׁמָּ֣ה יִֽהְי֔וּ גְּדֹלִ֥ים וְ/טוֹבִ֖ים מֵ/אֵ֥ין יוֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/009.yaml
  text: 'In my ears Yahweh of Armies has sworn: Surely many houses will become a desolation[a], great and good houses[b], without inhabitant.'
translation:
  language: hi
  text: 'मेरे सुनते हुए[a] सेनाओं के याहवे[b] ने शपथ ली है:


    “निश्चय ही बहुत-से घर उजाड़ हो जाएँगे—


    बड़े और उत्तम घर भी, जिनमें कोई न रहेगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक, “मेरे कानों में।” यह इब्रानी मुहावरा है, जिसका अर्थ है कि यशायाह ने यह बात सीधे सुनी।
    reason: lexical_alternative
  - marker: b
    text: या, परंपरागत अनुवाद, “सेनाओं का प्रभु।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָזְנַי
  choice: मेरे कानों में
  rationale: इब्रानी के सजीव मुहावरे को बनाए रखता है और सूचित करता है कि यशायाह ने यह वचन सीधे सुना। अर्थ स्पष्ट करने के लिए पादटिप्पणी दी गई है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को प्रचलित हिन्दी लिप्यंतरण में प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: צְבָאוֹת
  choice: सेनाओं के
  rationale: यह उपाधि परमेश्वर को समस्त स्वर्गीय और सांसारिक सेनाओं के अधिपति के रूप में व्यक्त करती है; ‘सेनाओं’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: אִם לֹא
  choice: 'शपथ खाकर कहा है: ‘निश्चय ही’'
  rationale: यह संयोजन शपथ-सूत्र में दृढ़ प्रतिज्ञान व्यक्त करता है। इब्रानी में मुख्य कथन का क्रियापद निहित है; हिन्दी में शपथ का बल स्पष्ट और स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: בָּתִּים רַבִּים
  choice: बहुत-से घर
  rationale: संदर्भ में भौतिक मकान अभिप्रेत हैं, न कि मुख्यतः परिवार या घराने।
- source_word: לְשַׁמָּה יִהְיוּ
  choice: उजाड़ हो जाएँगे
  rationale: विनाश के परिणामस्वरूप उत्पन्न उजड़ी दशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גְּדֹלִים וְטוֹבִים
  choice: बड़े और उत्तम घर
  rationale: विशेषण घरों के आकार और अच्छी गुणवत्ता को बताते हैं; ‘उत्तम’ गरिमापूर्ण है और विलासिता का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: מֵאֵין יוֹשֵׁב
  choice: उनमें कोई न बसेगा
  rationale: निवासी के पूर्ण अभाव को संक्षिप्त, स्वाभाविक और प्रभावशाली हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम और उपाधि יְהוָה צְבָאוֹת का अनुवाद
  choice: सेनाओं के यहोवा
  alternative: सेनाओं का प्रभु / सेनाओं का याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम स्पष्ट रूप से है; ‘यहोवा’ हिन्दी में उसका परिचित लिप्यंतरण है, जबकि ‘सेनाओं के’ צְבָאוֹת की उपाधि को पारदर्शी रखता है।
- issue: אִם לֹא में निहित शपथ-सूत्र
  choice: 'शपथ खाकर कहा है: ‘निश्चय ही’'
  alternative: केवल ‘निश्चय ही’
  rationale: मूल का अधूरा शाप-सूत्र शपथ की गंभीरता व्यक्त करता है। हिन्दी में केवल शब्दशः ‘यदि नहीं’ अस्पष्ट होगा, इसलिए उसके शपथगत कार्य को स्पष्ट किया गया है, बिना किसी अतिरिक्त शाप को गढ़े।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। काव्यात्मक पंक्ति-विन्यास और ‘मेरे कानों में’ की मूल छवि बनाए रखी गई है; शपथ-सूत्र को अर्थानुसार स्पष्ट किया गया है।
