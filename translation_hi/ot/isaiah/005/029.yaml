base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/029.yaml
  text: Its roaring is like a lion[a], and it roars like young lions; it growls and seizes prey, and carries it off[b], with none to rescue.
translation:
  language: hi
  text: उसकी दहाड़ सिंह[a] के समान है; वह जवान सिंहों के समान दहाड़ता है। वह गुर्राता और शिकार को पकड़ लेता है; उसे लेकर चला जाता है[b], और छुड़ाने वाला कोई नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सिंहनी”; इब्रानी शब्द कुछ संदर्भों में विशेष रूप से सिंहनी को सूचित कर सकता है, यद्यपि यहाँ “जवान सिंहों” के साथ समानांतरता में “सिंह” उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या “उसे घसीटकर ले जाता है” अथवा “उसे लेकर निकल जाता है”; इब्रानी क्रिया शिकार को इस तरह दूर ले जाने का भाव देती है कि उसे वापस न पाया जा सके।
    reason: lexical_alternative
