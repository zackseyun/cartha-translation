base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/014.yaml
  text: Therefore Sheol has enlarged its throat and opened its mouth without measure[a], and her splendor, her multitude, her uproar[c][b], and the one who exults in her go down.
translation:
  language: hi
  text: 'इसलिए शीओल[a] ने अपना गला चौड़ा कर लिया है[b]

    और अपना मुँह बेहिसाब फैला दिया है[c];

    उसका वैभव, उसकी भीड़, उसका कोलाहल

    और उसमें आनंद मनानेवाला—सब नीचे उतर जाएंगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शीओल मृतकों का लोक है; यहाँ उसे नगर के वैभव और उत्सव मनानेवालों को निगलने के लिए मुँह खोलते हुए एक सजीव पात्र के रूप में दिखाया गया है।
    reason: cultural_note
  - marker: b
    text: या, “अपनी भूख बढ़ा ली है”; शाब्दिक रूप से, “अपने नेफेश (प्राण/जीवन) को बड़ा किया है।”
    reason: lexical_alternative
  - marker: c
    text: या, “बिना किसी सीमा के।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְּׁאוֹל
  choice: शीओल
  rationale: हिब्रू संकल्पना और यहाँ उसके सजीव, निगलनेवाले रूपक को बनाए रखने के लिए लिप्यंतरण किया गया है; इसे केवल ‘कब्र’ या अमूर्त ‘मृत्यु’ कहना अर्थ को संकुचित कर देता।
- source_word: הִרְחִיבָה ... נַפְשָׁהּ
  choice: अपना गला फैला लिया है
  rationale: शाब्दिक रूप से ‘अपने नेफेश को बड़ा किया’ है। अगले पदबंध ‘मुँह खोल दिया’ के समानांतर ‘गला’ निगलने की शारीरिक छवि को स्वाभाविक हिन्दी में व्यक्त करता है; ‘भूख’ सम्भव किन्तु अधिक व्याख्यात्मक है।
- source_word: וּפָעֲרָה פִיהָ
  choice: और अपना मुँह ... खोल दिया है
  rationale: פער की मुँह फैलाकर खोलने और निगलने की सजीव छवि को स्पष्ट हिन्दी में रखा गया है।
- source_word: לִבְלִי חֹק
  choice: बेहिसाब
  rationale: इस मुहावरे में חֹק का अर्थ विधि नहीं, सीमा या माप है। ‘बेहिसाब’ असीमता का काव्यात्मक और सहज हिन्दी रूप है।
- source_word: וְיָרַד
  choice: नीचे उतर जाते हैं
  rationale: हिब्रू का एकवचन क्रियारूप संयुक्त काव्यात्मक कर्ताओं से पहले आता है। हिन्दी में सभी गिनाए गए तत्वों के लिए बहुवचन स्वाभाविक है और वर्तमानकालीन भविष्यवाणी की निश्चितता बनाए रखता है।
- source_word: הֲדָרָהּ
  choice: उसका वैभव
  rationale: नगर की शोभा, गौरव और सामाजिक भव्यता के व्यापक भाव को dignified आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הֲמוֹנָהּ
  choice: उसकी भीड़
  rationale: नगर से जुड़ी जनबहुलता के सामूहिक अर्थ को सामान्य पाठक के लिए सहज रूप में रखता है।
- source_word: שְׁאוֹנָהּ
  choice: उसका कोलाहल
  rationale: शोरपूर्ण उत्सव या हलचल के अर्थ को निर्णय-संदर्भ के उपयुक्त काव्यात्मक स्तर पर व्यक्त करता है।
- source_word: וְעָלֵז בָּהּ
  choice: और उसमें मगन रहनेवाला
  rationale: हिब्रू के एकवचन रूप को बनाए रखा गया है। ‘मगन’ उल्लास और आत्मतुष्ट उत्सव दोनों की सम्भावना को खुला रखता है।
theological_decisions:
- issue: काव्यात्मक न्याय-संदर्भ में שְּׁאוֹל का अनुवाद
  choice: शीओल
  alternative: अधोलोक; मृतकों का लोक; कब्र; मृत्यु
  rationale: हिब्रू नाम बनाए रखने से इसे केवल दफनाने की जगह या अमूर्त मृत्यु में सीमित नहीं किया जाता। इस पद में शीओल को असीम मुँह खोलकर निगलनेवाले पात्र के रूप में मानवीकृत किया गया है; पादटिप्पणी पाठक को इसका अर्थ देती है बिना काव्यात्मक-धर्मवैचारिक तनाव मिटाए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण काव्यात्मक गद्य-पद्य प्रयोग किया गया है। पंक्ति-विभाजन समानांतरता और निगलने से नीचे उतरने तक की गति स्पष्ट करते हैं। ‘शीओल’ को स्त्रीलिंग सर्वनाम से बोझिल बनाने के बजाय ‘अपना’ के माध्यम से हिब्रू मानवीकरण स्वाभाविक हिन्दी में रखा गया है। अंतिम पद में ‘उसका/उसकी/उसमें’ का संदर्भ जानबूझकर अत्यधिक स्पष्ट नहीं किया गया, ताकि मूल की नगर-संबंधी काव्यात्मक संदर्भ-श्रृंखला और सम्भावित निकटता बनी रहे।
