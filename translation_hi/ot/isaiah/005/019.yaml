  text: הָ/אֹמְרִ֗ים יְמַהֵ֧ר יָחִ֛ישָׁ/ה מַעֲשֵׂ֖/הוּ לְמַ֣עַן נִרְאֶ֑ה וְ/תִקְרַ֣ב וְ/תָב֗וֹאָ/ה עֲצַ֛ת קְד֥וֹשׁ יִשְׂרָאֵ֖ל וְ/נֵדָֽעָה׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/019.yaml
  text: who say[a], “Let him hurry; let him hasten his work, so that we may see it; let the plan of the Holy One of Israel draw near and come, so that we may know it.”
translation:
  language: hi
  text: जो कहते हैं, “वह जल्दी करे; अपना काम शीघ्र करे, ताकि हम उसे देखें। इस्राएल के पवित्र की योजना[a] निकट आए और आ पहुँचे, ताकि हम उसे जान लें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परामर्श” या “उद्देश्य।”
    reason: עֲצַת का अर्थ ‘योजना’, ‘परामर्श’ या ‘उद्देश्य’ हो सकता है।
lexical_decisions:
- source_word: הָאֹמְרִים
  choice: जो कहते हैं
  rationale: यह कृदन्त पिछले पद से चल रहे धिक्कार-वर्णन को आगे बढ़ाता है; यह हिन्दी में स्वाभाविक रूप से उसी समूह का निरन्तर चरित्र-चित्रण करता है।
- source_word: יְמַהֵר יָחִישָׁה מַעֲשֵׂהוּ
  choice: वह जल्दी करे; अपना काम शीघ्र करे
  rationale: दो निकटार्थक क्रियाओं को अलग रखकर मूल के व्यंग्यपूर्ण आग्रह और बलाघात को सुरक्षित किया गया है।
- source_word: מַעֲשֵׂהוּ
  choice: अपना काम
  rationale: ‘काम’ मूल शब्द के कार्य/कर्म के व्यापक अर्थ को रखता है और सन्दर्भ में घोषित दण्ड की ओर संकेत को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: לְמַעַן נִרְאֶה
  choice: ताकि हम उसे देखें
  rationale: उद्देश्यवाचक उपवाक्य और बहुवचन वक्ताओं को स्पष्ट रखता है; ‘उसे’ पिछले ‘काम’ की ओर संकेत करता है।
- source_word: וְתִקְרַב וְתָבוֹאָה
  choice: निकट आए और आ पहुँचे
  rationale: दोनों क्रियाओं को बनाए रखकर मूल की समानान्तरता और तीव्रता सुरक्षित की गई है।
- source_word: עֲצַת
  choice: योजना
  rationale: यह आधुनिक हिन्दी में ईश्वरीय अभिप्राय को सहजता से व्यक्त करता है; ‘सम्मति’ की सम्भावना पादटिप्पणी में दी गई है।
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: इस्राएल का पवित्र जन
  rationale: यशायाह में परमेश्वर के लिए प्रयुक्त विशिष्ट उपाधि का अर्थ और धार्मिक बल बनाए रखता है।
- source_word: וְנֵדָעָה
  choice: ताकि हम उसे जान लें
  rationale: वक्ताओं की व्यंग्यपूर्ण माँग को व्यक्त करता है और ‘हम उसे देखें’ के समानान्तर रहता है।
theological_decisions:
- issue: एकवचन पुरुषवाचक क्रियाओं और प्रत्ययों का सन्दर्भ
  choice: वक्ता व्यंग्य में परमेश्वर को शीघ्र कार्य करने की चुनौती दे रहे हैं, पर उद्धरण में उनका नाम जोड़कर निहित सन्दर्भ को स्पष्ट नहीं किया गया।
  alternative: अलगाव में ‘वह’ किसी अनिर्दिष्ट पुरुष की ओर संकेत कर सकता है।
  rationale: ‘उसका काम’ और ‘इस्राएल के पवित्र जन की योजना’ सन्दर्भ में परमेश्वर की पहचान कराते हैं; ‘वह/अपना’ बनाए रखने से मूल की व्यंग्यपूर्ण दूरी सुरक्षित रहती है।
- issue: עֲצַת का अर्थ
  choice: योजना
  alternative: सम्मति; उद्देश्य
  rationale: ‘योजना’ आधुनिक पाठक के लिए स्पष्ट है और मूल में निहित अभिप्राय को व्यक्त करती है, जबकि वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में बोधगम्य रखी गई है। ‘जल्दी करे; ... शीघ्र करे’ तथा ‘निकट आए और आ पहुँचे’ जैसी पुनरुक्तियों को मूल इब्रानी के व्यंग्यपूर्ण बल और समानान्तरता के कारण जानबूझकर बनाए रखा गया है।
