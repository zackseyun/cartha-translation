  yaml_path: translation/ot/isaiah/005/023.yaml
  text: who acquit the wicked for a bribe[a], and take away the righteousness of the righteous from him.
translation:
  language: hi
  text: जो रिश्वत के कारण दुष्ट को निर्दोष ठहराते हैं[a], और धर्मियों का न्यायोचित अधिकार उनसे छीन लेते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो रिश्वत के बदले दुष्ट को धर्मी ठहराते हैं, और धर्मियों का न्याय उनसे छीन लेते हैं।” इब्रानी के अंतिम शब्द का शाब्दिक रूप “उससे” है, जो संभवतः प्रत्येक धर्मी व्यक्ति के लिए वितरणात्मक एकवचन है।
    reason: צדק से बने शब्दों के ‘धर्मी ठहराना/न्याय’ विकल्प और מִמֶּנּוּ के एकवचन रूप को सुरक्षित करना।
lexical_decisions:
- source_word: מַצְדִּיקֵי
  choice: जो ... निर्दोष ठहराते हैं
  rationale: צדק के हिफ़ील कृदंत का यहाँ न्यायिक अर्थ किसी को नैतिक रूप से धर्मी बनाना नहीं, बल्कि उसे निर्दोष घोषित करना या बरी करना है। यह हिन्दी में स्वाभाविक और स्पष्ट न्यायिक अभिव्यक्ति है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: एकवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘दुष्ट’ नैतिक और न्यायिक दोनों विरोध को बनाए रखता है और आगे आने वाले ‘धर्मियों’ से स्पष्ट विरोध रचता है।
- source_word: עֵקֶב שֹׁחַד
  choice: रिश्वत के कारण
  rationale: यह पदबंध कारण बताता है—दुष्ट को रिश्वत के कारण निर्दोष ठहराया जाता है। ‘रिश्वत के कारण’ इब्रानी संबंध को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְצִדְקַת צַדִּיקִים
  choice: और धर्मियों से उनका न्यायोचित अधिकार
  rationale: צְדָקָה यहाँ न्यायालयीन संदर्भ में धर्मियों के सही दावे, उचित निर्णय या न्यायोचित स्थिति को दर्शाता है। ‘न्यायोचित अधिकार’ कानूनी आशय स्पष्ट करता है, जबकि ‘धर्मियों’ से צדק मूल का नैतिक संबंध बना रहता है।
- source_word: יָסִירוּ
  choice: छीन लेते हैं
  rationale: סור के हिफ़ील का अर्थ हटाना या दूर कर देना है। भ्रष्ट न्याय के संदर्भ में ‘छीन लेते हैं’ उस अन्यायपूर्ण वंचना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִמֶּנּוּ
  choice: उनसे
  rationale: मसोरेटी पाठ में प्रत्यय पुल्लिंग एकवचन है, जिसे बहुवचन ‘धर्मियों’ के साथ वितरणात्मक रूप में समझा जा सकता है। मुख्य पाठ में सहज हिन्दी के लिए ‘उनसे’ रखा गया है; एकवचन रूप की विशेषता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: न्यायिक-नैतिक निंदा में צִדְקָה का अनुवाद
  choice: न्यायोचित अधिकार
  alternative: धार्मिकता; न्याय
  rationale: संदर्भ भ्रष्ट न्यायाधीशों का है, जो धर्मी व्यक्तियों का उचित दावा या न्यायिक अधिकार छीनते हैं। केवल ‘धार्मिकता’ आधुनिक हिन्दी में उनके नैतिक चरित्र को छीन लेने का भ्रामक अर्थ दे सकती है, जबकि केवल ‘न्याय’ संबंधसूचक संरचना को अस्पष्ट कर सकता है। ‘न्यायोचित अधिकार’ कानूनी बल को स्पष्ट करता है, बिना नैतिक विरोध को मिटाए।
- issue: מִמֶּנּוּ के एकवचन प्रत्यय और צַדִּיקִים के बहुवचन के बीच तनाव
  choice: मुख्य पाठ में स्वाभाविक बहुवचन ‘उनसे’, और पादटिप्पणी में शाब्दिक एकवचन
  alternative: मुख्य पाठ में ‘उससे’
  rationale: हिन्दी में बहुवचन पूर्वपद के बाद अकेला ‘उससे’ अस्पष्ट और अस्वाभाविक होगा। इब्रानी एकवचन को वितरणात्मक—अर्थात प्रत्येक धर्मी व्यक्ति से—समझते हुए मुख्य पाठ पठनीय रखा गया है और पाठगत रूप पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘निर्दोष ठहराना’, ‘रिश्वत’ और ‘न्यायोचित अधिकार’ न्यायिक संदर्भ को स्पष्ट करते हैं। मुख्य पाठ में स्वाभाविक हिन्दी को प्राथमिकता दी गई है, जबकि इब्रानी की शब्दगत पुनरावृत्ति और एकवचन प्रत्यय पादटिप्पणी में दर्ज हैं।
