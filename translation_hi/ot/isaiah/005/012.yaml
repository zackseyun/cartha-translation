  to: उनकी दावतों[b] में वीणा और एक अन्य तार-वाद्य[a], डफ और बाँसुरी, और मदिरा होती है; पर वे याहवे के कार्य की ओर ध्यान नहीं देते और उसके हाथों के कार्य को नहीं देखते।
