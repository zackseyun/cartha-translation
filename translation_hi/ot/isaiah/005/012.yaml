id: ISA.5.12
reference: Isaiah 5:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֨ה כִנּ֜וֹר וָ/נֶ֗בֶל תֹּ֧ף וְ/חָלִ֛יל וָ/יַ֖יִן מִשְׁתֵּי/הֶ֑ם וְ/אֵ֨ת פֹּ֤עַל יְהוָה֙ לֹ֣א יַבִּ֔יטוּ וּ/מַעֲשֵׂ֥ה יָדָ֖י/ו לֹ֥א רָאֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/012.yaml
  text: There are lyre and harp[a], tambourine and flute, and wine at their feasts; but they do not look to the work of Yahweh[b], and they do not see the work of his hands.
translation:
  language: hi
  text: उनकी दावतों[b] में वीणा और एक अन्य तार-वाद्य[a], डफ और बाँसुरी, और मदिरा होती है; पर वे याहवे के कार्य की ओर ध्यान नहीं देते और उसके हाथों के कार्य को नहीं देखते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इन दोनों प्राचीन तार-वाद्यों की सटीक पहचान और आधुनिक समकक्ष निश्चित नहीं हैं।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त इब्रानी शब्द विशेष रूप से पीने-पिलाने वाली दावत या भोज को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: होती है
  rationale: यहाँ היה सूची के रूप में दृश्य प्रस्तुत करता है। हिन्दी में वर्तमानकालीन ‘होती है’ उनके भोजों की सामान्य दशा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כִנּוֹר וָנֶבֶל
  choice: वीणा और हार्प
  rationale: दो अलग तार-वाद्यों का भेद बनाए रखा गया है। כִּנּוֹר के लिए परिचित ‘वीणा’ और נֶבֶל के लिए ‘हार्प’ चुना गया है, यद्यपि प्राचीन वाद्यों की सटीक पहचान अनिश्चित है।
- source_word: תֹּף וְחָלִיל
  choice: डफ और बाँसुरी
  rationale: תֹּף हाथ में बजाया जाने वाला चौखटे वाला ड्रम था, जिसके लिए ‘डफ’ सहज हिन्दी है; חָלִיל एक फूँककर बजाया जाने वाला वाद्य था, इसलिए ‘बाँसुरी’ स्पष्ट और स्वाभाविक है।
- source_word: יַיִן
  choice: अंगूरी मदिरा
  rationale: यह चयन दाख से बनी मदिरा का अर्थ स्पष्ट करता है और आधुनिक हिन्दी में केवल ‘दाखमधु’ की अपेक्षा अधिक सहज है।
- source_word: מִשְׁתֵּיהֶם
  choice: उनकी दावतों
  rationale: यह संज्ञा विशेषतः पीने-पिलाने वाली दावत या भोज को सूचित करती है। साथ में मदिरा का उल्लेख होने के कारण ‘दावतों’ स्वाभाविक रहते हुए प्रसंग का आशय बनाए रखता है।
- source_word: פֹּעַל יְהוָה
  choice: याहवे के काम
  rationale: פֹּעַל किसी कार्य, कर्म या गतिविधि को दर्शाता है। ‘काम’ संक्षिप्त अभिव्यक्ति और अगले समानांतर वाक्यांश से उसका संबंध बनाए रखता है।
- source_word: יַבִּיטוּ
  choice: ध्यान नहीं देते
  rationale: यहाँ क्रिया केवल आँखों से देखने की नहीं, बल्कि किसी ओर मन लगाकर ध्यान देने की है। यह अनुवाद अगले ‘नहीं देखते’ से अर्थगत भेद भी बनाए रखता है।
- source_word: מַעֲשֵׂה יָדָיו
  choice: उसके हाथों के कार्य
  rationale: मूल का ठोस रूपक और ‘याहवे के काम’ के साथ काव्यात्मक समानांतरता सुरक्षित रखी गई है।
- source_word: רָאוּ
  choice: नहीं देखते
  rationale: पूर्ण रूप होते हुए भी यह समानांतर काव्य में उनकी लगातार बनी हुई प्रवृत्ति का वर्णन करता है; इसलिए हिन्दी वर्तमानकाल उपयुक्त है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में उपाधि नहीं, चतुरक्षरी व्यक्तिगत नाम יְהוָה है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और मूल में उपस्थित व्यक्तिगत नाम को सुरक्षित रखता है।
- issue: याहवे के काम की उपेक्षा का स्वरूप
  choice: ‘ध्यान नहीं देते’ और ‘नहीं देखते’ की समानांतर अभिव्यक्ति
  alternative: दोनों स्थानों पर केवल ‘नहीं देखते’
  rationale: נבט निर्देशित ध्यान या परवाह का भाव रखता है, जबकि ראה देखने का सामान्य शब्द है। अलग हिन्दी क्रियाएँ दोषारोपण की अर्थगत गहराई और मूल की समानांतरता दोनों को बनाए रखती हैं।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी रखी गई है। वाद्यों की सूची में अनावश्यक व्याख्या जोड़े बिना उनके भेद को बनाए रखा गया है; ‘ध्यान नहीं देते’ मूल की मानसिक और नैतिक उपेक्षा को स्वाभाविक हिन्दी में व्यक्त करता है।
