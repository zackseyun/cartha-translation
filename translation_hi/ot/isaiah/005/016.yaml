  edition: WLC
  text: וַ/יִּגְבַּ֛ה יְהוָ֥ה צְבָא֖וֹת בַּ/מִּשְׁפָּ֑ט וְ/הָ/אֵל֙ הַ/קָּד֔וֹשׁ נִקְדָּ֖שׁ בִּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/016.yaml
  text: But Yahweh of hosts is exalted in justice[b][a], and the Holy God is shown holy in righteousness.
translation:
  language: hi
  text: परन्तु सेनाओं का यहोवा न्याय में महान ठहरता है,[a] और पवित्र परमेश्वर धार्मिकता में पवित्र सिद्ध होता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्यायिक निर्णय में।” इब्रानी शब्द का अर्थ न्याय का सिद्धांत या उसे लागू करने वाला निर्णय, दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “पवित्र ठहरता है” या “पवित्र प्रकट होता है।” भाव यह है कि परमेश्वर की पवित्रता प्रकट और प्रमाणित होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבַּה
  choice: महान ठहरता है
  rationale: गבה का मूल भाव ऊँचा या महान होना है। यहाँ न्याय के द्वारा यहोवा की महानता प्रकट और प्रतिष्ठित होने का भाव है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को 'यहोवा' और צְבָאוֹת को व्यापक तथा परिचित अर्थ में 'सेनाओं का' रखा गया है।
- source_word: בַּמִּשְׁפָּט
  choice: न्याय में
  rationale: מִשְׁפָּט न्याय के सिद्धांत और न्यायिक निर्णय, दोनों का संकेत दे सकता है। 'न्याय में' इस वास्तविक अस्पष्टता को पर्याप्त रूप से बनाए रखता है।
- source_word: וְהָאֵל הַקָּדוֹשׁ
  choice: और पवित्र परमेश्वर
  rationale: यह स्वाभाविक हिन्दी में אֵל और निश्चित विशेषण הַקָּדוֹשׁ दोनों को व्यक्त करता है।
- source_word: נִקְדָּשׁ
  choice: पवित्र प्रकट होता है
  rationale: קדש के निफ़अल रूप का यहाँ अर्थ यह नहीं कि परमेश्वर पवित्र बनाया जाता है, बल्कि यह कि उसकी पवित्रता प्रकट या प्रमाणित होती है।
- source_word: בִּצְדָקָה
  choice: धार्मिकता में
  rationale: צְדָקָה को 'धार्मिकता' कहना מִשְׁפָּט से उसका काव्यात्मक और अर्थगत भेद बनाए रखता है।
theological_decisions:
- issue: परमेश्वर की पवित्रता की भाषा में उसके स्वभाव के बदलने का भ्रम
  choice: पवित्र प्रकट होता है
  alternative: पवित्र किया जाता है
  rationale: इब्रानी निफ़अल औपचारिक रूप से कर्मवाच्य समझा जा सकता है, पर सन्दर्भ परमेश्वर के पवित्र बनाए जाने का नहीं, उसकी पवित्रता के न्यायपूर्ण कार्यों में प्रकट होने का है।
- issue: מִשְׁפָּט और צְדָקָה का भेद
  choice: न्याय ... धार्मिकता
  alternative: न्याय ... न्याय
  rationale: दो अलग इब्रानी शब्दों के निकट, पर भिन्न अर्थों को हिन्दी में भी अलग रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। 'सेनाओं का यहोवा' यशायाह की उपाधि की व्यापकता और ईश्वरीय व्यक्तिगत नाम को बनाए रखता है; दोनों समानांतर खंडों में 'न्याय' और 'धार्मिकता' का भेद सुरक्षित है।
