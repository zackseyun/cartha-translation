  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵ֛ן גָּלָ֥ה עַמִּ֖/י מִ/בְּלִי דָ֑עַת וּ/כְבוֹד/וֹ֙ מְתֵ֣י רָעָ֔ב וַ/הֲמוֹנ֖/וֹ צִחֵ֥ה צָמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/013.yaml
  text: Therefore my people go into exile for lack of knowledge; their honored men are dying of hunger[a], and their multitude is parched with thirst.
translation:
  language: hi
  text: इसलिए मेरी प्रजा ज्ञान के अभाव में निर्वासन में जाती है; उसके प्रतिष्ठित जन भूख से मर रहे हैं[a], और उसकी भीड़ प्यास से सूख गई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके कुलीन जन।” हिब्रू में शाब्दिक रूप से “उसकी महिमा—भूख के मनुष्य” है; संभवतः संकेत राष्ट्र के सम्मानित या प्रमुख लोगों की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले अभियोग के परिणाम को स्पष्ट रूप से व्यक्त करता है और भविष्यवाणी के तर्क-संबंध को बनाए रखता है।
- source_word: גָּלָה
  choice: निर्वासन में जाती है
  rationale: क्रिया निर्वासन में जाने या ले जाए जाने का बोध देती है। यह रूप कर्ता या बाहरी एजेंसी को अनावश्यक रूप से स्पष्ट किए बिना हिब्रू के भविष्यसूचक कथन को स्वाभाविक हिन्दी में रखता है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: प्रथम पुरुष प्रत्यय और वाचा-संबंधी सामूहिक अर्थ को सीधे व्यक्त करता है।
- source_word: מִבְּלִי דָעַת
  choice: ज्ञान के अभाव में
  rationale: यह अभाव के साथ प्रसंगगत कारण भी व्यक्त करता है और ज्ञान के बौद्धिक, नैतिक तथा परमेश्वर-संबंधी व्यापक अर्थ को खुला रखता है।
- source_word: כְבוֹדוֹ
  choice: उसके प्रतिष्ठित जन
  rationale: शाब्दिक रूप 'उसकी महिमा' है, पर अगले बहुवचन-सामूहिक पद के साथ यह प्रजा के सम्मानित या प्रमुख लोगों की ओर संकेत करता है। 'प्रतिष्ठित जन' उस सामाजिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מְתֵי רָעָב
  choice: भूख से मर रहे हैं
  rationale: शाब्दिक पद 'भूख के मनुष्य' है और अकाल या अत्यंत भूख से पीड़ित लोगों को दर्शाता है। चुना हुआ रूप स्थिति की तीव्रता को सहज हिन्दी में व्यक्त करता है।
- source_word: הֲמוֹנוֹ
  choice: उसकी भीड़
  rationale: यह प्रजा के बड़े जनसमूह को दर्शाता है; सामूहिक एकवचन प्रत्यय को भी बनाए रखता है।
- source_word: צִחֵה צָמָא
  choice: प्यास से सूख गई है
  rationale: दोनों शब्द मिलकर अत्यधिक प्यास और उससे उत्पन्न शुष्कता बताते हैं। हिन्दी में यह संयोजन चित्रात्मकता और तीव्रता दोनों बनाए रखता है।
theological_decisions:
- issue: भविष्यसूचक कथन में निर्वासन का काल
  choice: निर्वासन में जाती है
  alternative: निर्वासन में चली गई है
  rationale: हिब्रू पूर्ण क्रिया किसी निश्चित भविष्यसूचक परिणाम को घटित तथ्य की तरह प्रस्तुत कर सकती है। वर्तमानाभिमुख हिन्दी रूप प्रसंग के परिणाम को व्यक्त करता है, पर उसकी समयगत अस्पष्टता को किसी एक ऐतिहासिक क्षण तक सीमित नहीं करता।
- issue: דַּעַת का आशय
  choice: ज्ञान
  alternative: समझ
  rationale: '''ज्ञान'' परमेश्वर, वाचा, नैतिक बोध और सामान्य समझ से जुड़े व्यापक अर्थ को सुरक्षित रखता है; ''समझ'' इसे केवल बौद्धिक क्षमता तक संकुचित कर सकती है।'
- issue: כְבוֹדוֹ का व्यक्ति-सूचक अर्थ
  choice: उसके प्रतिष्ठित जन
  alternative: उसकी महिमा
  rationale: व्याकरणिक रूप शाब्दिक रूप से 'उसकी महिमा' है, पर प्रसंग और 'भूख के मनुष्य' के साथ इसका संबंध प्रमुख लोगों की ओर संकेत करता है। मुख्य पाठ में अर्थ-संगत रूप रखा गया है और शाब्दिक असामान्यता को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'प्रजा,' 'निर्वासन' और 'प्रतिष्ठित जन' भविष्यसूचक शैली की गंभीरता बनाए रखते हैं, जबकि वाक्य-संरचना अनावश्यक रूप से पुरातन नहीं है।
