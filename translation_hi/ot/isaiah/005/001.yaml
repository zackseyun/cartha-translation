source:
  edition: WLC
  text: אָשִׁ֤ירָה נָּא֙ לִֽ/ידִידִ֔/י שִׁירַ֥ת דּוֹדִ֖/י לְ/כַרְמ֑/וֹ כֶּ֛רֶם הָיָ֥ה לִֽ/ידִידִ֖/י בְּ/קֶ֥רֶן בֶּן שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/001.yaml
  text: 'Let me sing[a], please, for my beloved a song of my beloved concerning his vineyard: my beloved had a vineyard on a fertile hill.'
translation:
  language: hi
  text: मैं अपने प्रिय के लिए गाऊँ—अपने प्रिय का गीत, उसकी दाख की बारी के विषय में। मेरे प्रिय की एक दाख की बारी थी, एक उपजाऊ पहाड़ी[a] पर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “तेल के पुत्र के सींग पर”; यह उपजाऊ पहाड़ी के लिए प्रयुक्त एक मुहावरा है।
    reason: मूल इब्रानी का असामान्य काव्यात्मक बिंब सुरक्षित रखना।
lexical_decisions:
- source_word: אָשִׁירָה נָּא
  choice: मैं ... गाऊँ
  rationale: प्रथम पुरुष इच्छार्थक रूप और נָא के विनम्र आग्रह/आत्म-प्रेरणा के भाव को स्वाभाविक हिन्दी में इच्छार्थक ‘गाऊँ’ व्यक्त करता है; अलग से ‘कृपया’ कहना हिन्दी में आत्म-संबोधन के रूप में अस्वाभाविक होता।
- source_word: לִידִידִי
  choice: अपने प्रिय के लिए
  rationale: לְ को यहाँ गीत के अभिप्रेत व्यक्ति अथवा उसके प्रति संबंध के अर्थ में लिया गया है। ‘प्रिय’ काव्यात्मक संबंध बनाए रखता है और व्यक्ति की पहचान पहले से तय नहीं करता।
- source_word: שִׁירַת דּוֹדִי
  choice: अपने प्रिय का गीत
  rationale: शाब्दिक संरचना ‘मेरे प्रिय का गीत’ है। יָדִיד और דּוֹד दो अलग इब्रानी शब्द हैं, पर इस प्रसंग में दोनों के संबंधपरक और काव्यात्मक भाव को हिन्दी ‘प्रिय’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְכַרְמוֹ
  choice: उसकी दाख की बारी के विषय में
  rationale: לְ को विषय-सूचक मानते हुए गीत का विषय स्पष्ट किया गया है।
- source_word: כֶּרֶם
  choice: दाख की बारी
  rationale: यह आधुनिक हिन्दी में अंगूर की खेती वाले स्थान का स्पष्ट और बाइबलीय शैली से परिचित पद है।
- source_word: הָיָה לִידִידִי
  choice: मेरे प्रिय की ... थी
  rationale: इब्रानी में शाब्दिक रूप से ‘मेरे प्रिय के लिए/पास ... थी’ है; हिन्दी की स्वाभाविक अधिकार-सूचक रचना वही अर्थ देती है।
- source_word: בְּקֶרֶן בֶּן שָׁמֶן
  choice: एक उपजाऊ पहाड़ी पर
  rationale: शाब्दिक बिंब ‘तेल के पुत्र के सींग पर’ है। स्थल-वर्णन में קֶרֶן उभरी पहाड़ी/ढलान और בֶּן־שָׁמֶן समृद्ध, उपजाऊ भूमि का मुहावरा है; मुख्य पाठ में इसका अर्थ दिया गया और मूल बिंब पाद-टिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘प्रिय’ की पहचान
  choice: मुख्य पाठ में केवल ‘प्रिय’ रखा गया है।
  alternative: इसे स्पष्ट रूप से ‘यहोवा’ अथवा भविष्यद्वक्ता का कोई मित्र कहना।
  rationale: इस आरंभिक पंक्ति में व्यक्ति की पहचान अभी प्रत्यक्ष नहीं की गई है। आगे के प्रसंग से अर्थ खुलता है; इसलिए यहाँ कविता का जानबूझकर रखा गया तनाव बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक पुनरावृत्ति तथा ‘प्रिय’ की अस्पष्ट पहचान बनाए रखी गई है। पाद-टिप्पणी का चिह्न उसी पदबंध के बाद रखा गया है जिसकी वह व्याख्या करती है।
