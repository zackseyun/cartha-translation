  text: וַ/יִּשַּׁ֥ח אָדָ֖ם וַ/יִּשְׁפַּל אִ֑ישׁ וְ/עֵינֵ֥י גְבֹהִ֖ים תִּשְׁפַּֽלְנָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/015.yaml
  text: And man is brought low[a], and a man is humbled[b], and the eyes of the lofty will be brought low.
translation:
  language: hi
  text: मनुष्य झुकेगा[a], और मनुष्य दीन होगा, और अभिमानियों की आँखें[b] नीची होंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “मनुष्य झुकाया जाएगा” या “मनुष्य नीचा किया जाएगा” भी हो सकता है। इब्रानी में यहाँ और अगले खंड में नीचे होने या किए जाने के लिए दो संबंधित, पर अलग क्रियाएँ हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “ऊँचे लोगों की आँखें”; आशय अभिमानी लोगों की दृष्टि, या उनकी घमंड-भरी दृष्टि, से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשַּׁח
  choice: झुक जाएगा
  rationale: שׁחח का अर्थ झुकना या नीचे लाया जाना हो सकता है। अकर्मक ‘झुक जाएगा’ मूल की देहगत छवि और न्याय के कारण होने वाले अपमान—दोनों को खुला रखता है। भविष्यकाल भविष्यसूचक न्याय के संदर्भ के अनुकूल है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यह एकवचन प्रतिनिधिक संज्ञा समस्त मानवता की ओर संकेत करती है और אִישׁ के साथ काव्यात्मक समानांतरता बनाती है।
- source_word: וַיִּשְׁפַּל
  choice: नीचा हो जाएगा
  rationale: שׁפל का मूल भाव नीचा होना या दीन किया जाना है। यह पहले क्रियापद ‘झुक जाएगा’ से भिन्न शब्दावली रखते हुए इब्रानी समानांतरता को सुरक्षित रखता है।
- source_word: אִישׁ
  choice: आदमी
  rationale: एकवचन मानवीय संदर्भ और אָדָם के साथ निकट काव्यात्मक समानांतरता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עֵינֵי גְבֹהִים
  choice: घमंडियों की आँखें
  rationale: शाब्दिक अर्थ ‘ऊँचे लोगों की आँखें’ है। संदर्भ में ऊँचाई अभिमान को सूचित करती है; ‘घमंडियों की आँखें’ ठोस नेत्र-छवि को बनाए रखते हुए आशय स्पष्ट करता है।
- source_word: תִּשְׁפַּלְנָה
  choice: नीची हो जाएँगी
  rationale: स्त्रीलिंग बहुवचन क्रिया ‘आँखें’ से मेल खाती है और उसी שׁפל धातु की पुनरावृत्ति को ‘नीचा/नीची’ द्वारा दिखाती है।
theological_decisions:
- issue: אָדָם और אִישׁ के समानांतर मानवीय पद
  choice: मनुष्य ... आदमी
  alternative: मानवजाति ... व्यक्ति; मनुष्य ... पुरुष
  rationale: दोनों एकवचन पदों और उनकी काव्यात्मक समानांतरता को रखा गया है। ‘मनुष्य ... आदमी’ आधुनिक हिन्दी में स्वाभाविक है और पद को केवल वयस्क पुरुषों तक सीमित नहीं करता।
- issue: भविष्यसूचक काव्य में काल और पक्ष
  choice: तीनों खंडों में भविष्यकाल
  alternative: पहले दो खंड वर्तमान या भूतकाल में, अंतिम खंड भविष्यकाल में
  rationale: पहले दो रूप wayyiqtol और अंतिम रूप yiqtol है, पर इस न्याय-वाणी में सभी आने वाले पतन को सजीव निश्चितता से व्यक्त कर सकते हैं। हिन्दी में भविष्यकाल पूरे कथन को स्पष्ट और सुसंगत रखता है, बिना क्रियाओं के अर्थ-भेद को मिटाए।
- issue: עֵינֵי גְבֹהִים में अभिमान की छवि
  choice: घमंडियों की आँखें
  alternative: ऊँचे लोगों की आँखें; घमंडी आँखें
  rationale: यह अभिमानपूर्ण दृष्टि और ऊँचा किए गए लोगों—दोनों के बीच मूल की अर्थगत गुंजाइश को पूरी तरह समाप्त नहीं करता; शाब्दिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘झुक जाएगा/नीचा हो जाएगा’ की समानांतर रचना इब्रानी काव्य को दर्शाती है, जबकि ‘घमंडियों की आँखें’ मूल की ठोस छवि को स्वाभाविक हिन्दी में बनाए रखती है।
