language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מַה לַּ/עֲשׂ֥וֹת עוֹד֙ לְ/כַרְמִ֔/י וְ/לֹ֥א עָשִׂ֖יתִי בּ֑/וֹ מַדּ֧וּעַ קִוֵּ֛יתִי לַ/עֲשׂ֥וֹת עֲנָבִ֖ים וַ/יַּ֥עַשׂ בְּאֻשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/004.yaml
  text: What more was there to do for my vineyard that I have not done in it? Why[a], when I expected it to produce grapes, did it produce wild grapes?
translation:
  language: hi
  text: मेरी दाख की बारी के लिए और क्या किया जा सकता था जो मैंने उसमें नहीं किया? फिर, जब मैंने अपेक्षा की कि वह अंगूर फलाए, तो उसने जंगली अंगूर[a] ही क्यों फलाए?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बेकार अंगूर” अथवा “दुर्गंधयुक्त फल”; इब्रानी शब्द खराब और अनुपयोगी फल को दर्शाता है।
    reason: दुर्लभ इब्रानी शब्द בְּאֻשִׁים के अर्थ-क्षेत्र और संभावित अनुवादों को सुरक्षित रखना।
lexical_decisions:
- source_word: מַה לַּעֲשׂוֹת עוֹד
  choice: और क्या किया जा सकता था
  rationale: यह इब्रानी प्रश्न शेष रह गए कार्य या संभावना के बारे में आलंकारिक ढंग से पूछता है। यह हिंदी रूप स्वाभाविक रहते हुए इस भाव को बनाए रखता है कि दाख की बारी के लिए कुछ भी करना बाकी नहीं छोड़ा गया था।
- source_word: לְכַרְמִי
  choice: मेरी दाख की बारी के लिए
  rationale: לְ यहाँ दाख की बारी के हित में किए गए काम को व्यक्त करता है; इसलिए ‘के लिए’ स्वाभाविक है। כֶּרֶם का सीधा अर्थ ‘दाख की बारी’ है।
- source_word: וְלֹא עָשִׂיתִי בּוֹ
  choice: जो मैंने उसमें न किया हो
  rationale: 'בּוֹ का शाब्दिक स्थानवाचक भाव ‘उसमें’ रखा गया है। हिंदी संभावनार्थक रचना आलंकारिक प्रश्न का आशय व्यक्त करती है: कोई आवश्यक काम छोड़ा नहीं गया।'
- source_word: קִוֵּיתִי
  choice: मैंने अपेक्षा की
  rationale: कृषि-संदर्भ में קוה केवल प्रतीक्षा नहीं, बल्कि अपेक्षित उपज की आशा दर्शाता है। ‘अपेक्षा की’ इस भाव को स्पष्ट और संयत ढंग से व्यक्त करता है।
- source_word: לַעֲשׂוֹת עֲנָבִים
  choice: वह अंगूर फलाएगी
  rationale: भूमि या पौधे की उपज के संदर्भ में עשה का अर्थ ‘उपजाना/फलाना’ है। स्त्रीलिंग ‘वह’ का संदर्भ दाख की बारी से है।
- source_word: בְּאֻשִׁים
  choice: जंगली अंगूर
  rationale: यह दुर्लभ संज्ञा खराब, दुर्गंधयुक्त या अनुपयोगी फल का संकेत देती है। ‘जंगली अंगूर’ पारंपरिक और संदर्भ में सहज रूप है; अधिक शाब्दिक अर्थ फुटनोट में दिए गए हैं ताकि शब्द की नकारात्मक तीव्रता न खोए।
theological_decisions:
- issue: दाख की बारी का रूपक
  choice: मुख्य पाठ में ‘दाख की बारी’ को बिना व्याख्यात्मक विस्तार के बनाए रखा गया।
  alternative: इसे इसी पद में ‘मेरी प्रजा’ या ‘इस्राएल’ के रूप में स्पष्ट करना।
  rationale: आसपास का संदर्भ रूपक का अर्थ खोलता है, पर यह पद स्वयं दाख की बारी की काव्यात्मक छवि में बोलता है। अनुवाद को उस छवि और उसके क्रमिक उद्घाटन को सुरक्षित रखना चाहिए।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और काव्यात्मक प्रश्नवाचक शैली रखी गई है। ‘दाख की बारी’ बाइबलीय कृषि-चित्र को स्पष्ट रखता है, जबकि ‘फलाएगी/फलाए’ उपज देने के अर्थ में सामान्य पाठक के लिए सुबोध है।
