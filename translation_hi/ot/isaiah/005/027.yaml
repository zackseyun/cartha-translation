  text: אֵין עָיֵ֤ף וְ/אֵין כּוֹשֵׁל֙ בּ֔/וֹ לֹ֥א יָנ֖וּם וְ/לֹ֣א יִישָׁ֑ן וְ/לֹ֤א נִפְתַּח֙ אֵז֣וֹר חֲלָצָ֔י/ו וְ/לֹ֥א נִתַּ֖ק שְׂר֥וֹךְ נְעָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/027.yaml
  text: None among them is weary[a], and none stumbles; none slumbers or sleeps; the belt at his waist is not loosened[b], and the strap of his sandals is not broken.
translation:
  language: hi
  text: उनमें[a] कोई थका हुआ नहीं, और कोई लड़खड़ाता नहीं; कोई न ऊँघता है, न सोता है; न किसी की कमर का पट्टा ढीला पड़ता है[b], और न उसके सैंडल का पट्टा टूटता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसमें”; इब्रानी में एकवचन सर्वनाम है, जो यहाँ सामूहिक रूप से बुलाए गए आक्रमणकारी दल के लिए प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या, “कमर का पट्टा खुलता नहीं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָיֵף
  choice: थका हुआ
  rationale: शारीरिक थकान का सहज आधुनिक हिन्दी रूप; सैन्य कूच के संदर्भ में स्पष्ट है।
- source_word: כּוֹשֵׁל
  choice: लड़खड़ाता
  rationale: चलते समय डगमगाने या ठोकर खाने की धारणा व्यक्त करता है और अजेय सेना के चित्र के अनुकूल है।
- source_word: בּוֹ
  choice: उनमें
  rationale: इब्रानी में सर्वनाम एकवचन है, पर उसका संदर्भ सामूहिक सेना से है; हिन्दी में वितरणात्मक अर्थ के लिए ‘उनमें’ स्वाभाविक है।
- source_word: יָנוּם / יִישָׁן
  choice: ऊँघता या सोता
  rationale: दो निकटार्थी क्रियाओं का भेद और काव्यात्मक युग्म दोनों सुरक्षित रहते हैं।
- source_word: נִפְתַּח
  choice: ढीला नहीं होता
  rationale: पट्टे के ‘खुलने’ को प्रसंगानुकूल और स्वाभाविक हिन्दी में उसके ढीला होने के रूप में व्यक्त किया गया है।
- source_word: אֵזוֹר חֲלָצָיו
  choice: कमर का पट्टा
  rationale: प्राचीन कमरबंद/कटिबंध का स्पष्ट, आधुनिक और गरिमापूर्ण हिन्दी रूप।
- source_word: נִתַּק
  choice: टूटता
  rationale: तसमे के खिंचकर अलग हो जाने या टूटने का स्वाभाविक सामान्य हिन्दी रूप।
- source_word: שְׂרוֹךְ נְעָלָיו
  choice: उसकी जूती का तसमा
  rationale: जूती को बाँधने वाली डोरी या पट्टी का बोध कराता है और मूल के प्राचीन पादत्राण-चित्र को पर्याप्त रूप से बनाए रखता है।
