  register: आधुनिक मानक हिन्दी; संक्षिप्त, काव्यात्मक और सैनिक तत्परता के चित्र को बनाए रखने वाला गरिमापूर्ण सामान्य रजिस्टर। सामूहिक सेना के लिए आरंभ में बहुवचन और बाद में प्रत्येक सैनिक पर केंद्रित एकवचन को सुरक्षित रखा गया है।
