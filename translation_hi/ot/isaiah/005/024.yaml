  register: आधुनिक मानक हिन्दी में काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘आग की जीभ’, ‘जड़’, ‘फूल’ और ‘धूल’ के मूल बिंब सुरक्षित हैं। वाक्य सहज रखने के लिए יִרְפֶּה को ‘मुरझाकर गिर जाती है’ और יַעֲלֶה को ‘ऊपर उड़ जाएगा’ कहा गया है।
