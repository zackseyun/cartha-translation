base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/024.yaml
  text: Therefore[a], as the tongue of fire devours stubble, and dry grass sinks before the flame, so their root will become rot, and their blossom will go up like dust; for they have rejected the law of Yahweh of hosts[b], and have despised the word of the Holy One of Israel.
translation:
  language: hi
  text: इसलिए, जैसे आग की जीभ पराली को खा जाती है और सूखी घास लौ के आगे ढीली पड़ जाती है, वैसे ही उनकी जड़ सड़न के समान हो जाएगी और उनका फूल धूल की तरह ऊपर उड़ जाएगा; क्योंकि उन्होंने सेनाओं के याहवे की व्यवस्था को ठुकरा दिया है और इस्राएल के पवित्र परमेश्वर के वचन का तिरस्कार किया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले दोषारोपण से निकलने वाले न्यायपूर्ण परिणाम को स्पष्ट करता है।
- source_word: לְשׁוֹן אֵשׁ
  choice: आग की जीभ
  rationale: मूल इब्रानी के सजीव काव्यात्मक रूपक को बनाए रखता है।
- source_word: קַשׁ
  choice: ठूँठ
  rationale: कटाई के बाद बची सूखी डंठल-सामग्री के कृषि-बिंब को व्यक्त करता है।
- source_word: חֲשַׁשׁ
  choice: सूखी घास
  rationale: यह सूखी और शीघ्र जलने वाली वनस्पति का स्वाभाविक, व्यापक हिन्दी रूप है।
- source_word: יִרְפֶּה
  choice: मुरझाकर गिर जाती है
  rationale: क्रिया के ढीला पड़ने, निर्बल होने या झुक जाने के भाव को अग्नि के प्रसंग में स्वाभाविक रूप से व्यक्त करता है, बिना इसे सीधे ‘जल जाना’ कहे।
- source_word: כַּמָּק
  choice: सड़न के समान
  rationale: क्षय अथवा गलन का भाव देता है और כ के स्पष्ट तुलनात्मक रूप को सुरक्षित रखता है।
- source_word: כָּאָבָק יַעֲלֶה
  choice: धूल की तरह ऊपर उड़ जाएगा
  rationale: עלה के ऊपर उठने के अर्थ और धूल के बिखरकर उड़ने के दृश्य, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: תּוֹרַת
  choice: व्यवस्था
  rationale: यहाँ वाचा-संबंधी अधिकारपूर्ण शिक्षा और आज्ञा के भाव को व्यक्त करता है।
- source_word: נִאֵצוּ
  choice: तिरस्कार किया है
  rationale: यह घृणापूर्वक अनादर करने का प्रबल भाव रखता है और पहले आए ‘ठुकरा दिया’ से भेद बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; उसका लिप्यंतरण नाम को पदवी में बदलने से बचाता है।
- issue: תּוֹרָה का अर्थ
  choice: व्यवस्था
  alternative: शिक्षा; उपदेश
  rationale: शब्द का अर्थ व्यापक रूप से शिक्षा हो सकता है, पर यहाँ वाचा के उल्लंघन और न्याय के संदर्भ में उसका अधिकारपूर्ण, विधिक पक्ष प्रमुख है।
- issue: קְדוֹשׁ יִשְׂרָאֵל की उपाधि
  choice: इस्राएल का पवित्र जन
  alternative: इस्राएल का पवित्र परमेश्वर
  rationale: ‘पवित्र जन’ मूल उपाधि की संक्षिप्तता बनाए रखता है; ‘परमेश्वर’ अर्थतः उचित होते हुए भी मूल में स्पष्ट रूप से उपस्थित नहीं है।
