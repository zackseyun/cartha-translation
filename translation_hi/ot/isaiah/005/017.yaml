base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/017.yaml
  text: Then lambs will graze as in their pasture[d][c][b][a], and sojourners will eat among the ruins of the well-fed.
translation:
  language: hi
  text: तब मेम्ने[a] मानो अपने चरागाह में[b] चरेंगे, और परदेशी[c] हृष्ट-पुष्ट लोगों[d] के उजड़े स्थानों में खाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भेड़ें।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी כדברם कठिन है; संभवतः “अपने चरागाह में” या “मानो अपने चरागाह में।”
    reason: textual_or_lexical_difficulty
  - marker: c
    text: या “प्रवासी” अथवा “बाहरी लोग।”
    reason: lexical_alternative
  - marker: d
    text: या “मोटे लोगों” अथवा “धनवानों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָעוּ
  choice: तब ... चरेंगे
  rationale: רעה के काल रूप का यहाँ अर्थ पशुओं का चरना है। आरंभिक וְ को पिछले पदों में बताए गए न्याय के परिणाम से जोड़ते हुए स्वाभाविक हिन्दी में “तब” किया गया है।
- source_word: כְבָשׂים
  choice: मेम्ने
  rationale: शब्द भेड़ों के लिए भी प्रयुक्त हो सकता है, पर “मेम्ने” इसका सामान्य और संदर्भानुकूल अर्थ है।
- source_word: כְדָבְרָם
  choice: अपने चरागाह में
  rationale: यह कठिन इब्रानी रूप है। संदर्भ में इसे चरने की जगह या अपने चरागाह के अर्थ में लेना सबसे संगत है; हिन्दी में तुलना का भाव अलग से व्यक्त किए बिना यह वाक्य स्वाभाविक रहता है।
- source_word: וְחָרְבוֹת
  choice: उजड़े स्थानों में
  rationale: חרבות उजड़े, वीरान या खंडहर हो चुके स्थानों को दर्शाता है। हिन्दी में स्थानवाचक संबंध को स्पष्ट किया गया है।
- source_word: מֵחִים
  choice: हृष्ट-पुष्ट लोगों
  rationale: यह दुर्लभ रूप मोटे, समृद्ध या धनवान लोगों की ओर संकेत करता समझा जाता है। “हृष्ट-पुष्ट” ठोस शारीरिक बिंब को बनाए रखता है और समृद्धि का सामाजिक संकेत भी रहने देता है।
- source_word: גָּרִים
  choice: परदेशी
  rationale: גרים ऐसे बाहरी लोगों को दर्शाता है जो किसी अन्य समुदाय के बीच रहते हैं। “परदेशी” आधुनिक हिन्दी में संक्षिप्त और बोधगम्य है।
- source_word: יֹאכֵלוּ
  choice: खाएँगे
  rationale: क्रिया का सामान्य अर्थ “खाना” है। मूल की तरह इसका कर्म अनकहा रखा गया है और उजड़े स्थानों में खाने का चित्र सुरक्षित है।
theological_decisions:
- issue: न्याय के बाद सामाजिक उलटफेर का बिंब
  choice: समृद्ध लोगों के उजड़े स्थानों में परदेशियों के खाने का मूल बिंब बनाए रखा गया है।
  alternative: परदेशियों द्वारा उन लोगों की संपत्ति पर अधिकार करने की व्याख्या स्पष्ट रूप से जोड़ना।
  rationale: मूल पद विनाश और उलटफेर का संकेत देता है, पर अधिकार, दंड की रीति या संपत्ति के हस्तांतरण का विस्तृत धार्मिक अर्थ स्पष्ट नहीं करता। इसलिए उसे अनकहा रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “चरागाह,” “परदेशी” और “उजड़े स्थान” सामान्य पाठक के लिए बोधगम्य हैं। कठिन और दुर्लभ इब्रानी पदों की अनिश्चितता मुख्य पाठ में किसी एक संभावित अर्थ से व्यक्त की गई है और पादटिप्पणियों में विकल्प सुरक्षित रखे गए हैं।
