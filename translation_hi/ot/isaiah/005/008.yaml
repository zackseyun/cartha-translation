base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/008.yaml
  text: Woe to those who join house to house[a], who bring field near to field until there is no place left[b], and you are made to dwell alone in the midst of the land.
translation:
  language: hi
  text: हाय उन लोगों पर जो एक घर को दूसरे घर से जोड़ते हैं[a], और एक खेत को दूसरे खेत से मिलाते हैं, जब तक कि कोई जगह न रहे; और भूमि के बीच केवल तुम ही बसाए जाते हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “घर को घर से सटाते हैं।” अभिप्राय घरों और खेतों को लगातार जोड़कर संपत्ति बढ़ाने से है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यहाँ वचन अचानक दूसरे पुरुष बहुवचन—“तुम”—में बदल जाता है और दोषियों को सीधे संबोधित करता है। “बसाए जाते हो” में निष्क्रिय भाव भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: हाय उन पर
  rationale: यह भविष्यद्वाणी की निंदा और आसन्न न्याय की चेतावनी व्यक्त करता है; आधुनिक हिन्दी में ‘हाय उन पर’ स्वाभाविक और गंभीर है।
- source_word: מַגִּיעֵי בַיִת בְּבַיִת
  choice: जो घर से घर जोड़ते जाते हैं
  rationale: हिफ़ील कृदंत का मूल भाव एक घर को दूसरे से सटाने या जोड़ने का है; ‘जाते हैं’ निरंतर संपत्ति-संचय को स्पष्ट करता है।
- source_word: שָׂדֶה בְשָׂדֶה יַקְרִיבוּ
  choice: खेत से खेत मिलाते जाते हैं
  rationale: קרב का कारक अर्थ ‘निकट लाना’ है; भूमि-संचय के संदर्भ में ‘मिलाना’ स्वाभाविक हिन्दी है और समानांतर पंक्ति का भाव रखता है।
- source_word: עַד אֶפֶס מָקוֹם
  choice: यहाँ तक कि कोई जगह नहीं बचती
  rationale: लगातार अधिग्रहण के परिणामस्वरूप दूसरों के लिए स्थान न बचने का अर्थ स्पष्ट और सहज ढंग से व्यक्त होता है।
- source_word: וְהוּשַׁבְתֶּם
  choice: और तुम ... बसा दिए जाते हो
  rationale: द्वितीय पुरुष बहुवचन की ओर अचानक हुए बदलाव और क्रिया के कारक-निष्क्रिय भाव—‘बसाए गए/बसा दिए गए’—दोनों को सुरक्षित रखा गया है।
- source_word: לְבַדְּכֶם
  choice: तुम ही ... अकेले
  rationale: यह संबोधित भूमि-संचयकर्ताओं की विशिष्टता और दूसरों के बहिष्कार पर बल देता है।
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: देश के बीच
  rationale: ‘भूमि/देश के भीतर या मध्य में’ की स्थानगत छवि को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: संपत्ति-संचय के विरुद्ध भविष्यद्वाणी की निंदा
  choice: पद को घरों और खेतों को लगातार जोड़कर दूसरों के लिए जगह न छोड़ने वालों पर सीधी धिक्कार के रूप में रखा गया है।
  alternative: इसे सामान्य समृद्धि या संपत्ति के हर प्रकार के स्वामित्व की निंदा के रूप में स्पष्ट करना।
  rationale: इब्रानी पाठ विशेष रूप से लगातार संपत्ति मिलाने और अकेले भूमि पर अधिकार कर लेने को लक्ष्य करता है; इससे आगे कोई व्यापक doctrinal निष्कर्ष अनुवाद में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गंभीर, भविष्यद्वाणी-सुलभ और सामान्य पाठक के लिए स्पष्ट है। ‘हाय उन पर’ निंदा और चेतावनी का स्वर रखता है। ‘जोड़ते जाते हैं/मिलाते जाते हैं’ लगातार भूमि-संचय को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि दूसरे पुरुष की आकस्मिकता और निष्क्रिय क्रिया को जानबूझकर बनाए रखा गया है।
