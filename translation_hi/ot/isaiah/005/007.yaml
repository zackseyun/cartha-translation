reference: Isaiah 5:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י כֶ֜רֶם יְהוָ֤ה צְבָאוֹת֙ בֵּ֣ית יִשְׂרָאֵ֔ל וְ/אִ֣ישׁ יְהוּדָ֔ה נְטַ֖ע שַׁעֲשׁוּעָ֑י/ו וַ/יְקַ֤ו לְ/מִשְׁפָּט֙ וְ/הִנֵּ֣ה מִשְׂפָּ֔ח לִ/צְדָקָ֖ה וְ/הִנֵּ֥ה צְעָקָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/007.yaml
  text: For the vineyard of Yahweh of Armies is the house of Israel[a], and the men of Judah are the planting of his delight. He looked for justice, but behold, bloodshed; for righteousness, but behold[c][b], an outcry.
translation:
  language: hi
  text: 'क्योंकि सेनाओं के याहवे[a] की दाख की बारी इस्राएल का घराना है,

    और यहूदा के लोग[b] उसकी प्रिय रोपाई हैं।

    उसने न्याय की आशा की,

    पर देखो—रक्तपात;

    धार्मिकता की आशा की,

    पर देखो—दुहाई![c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सेनाओं के याहवे” का पारंपरिक अनुवाद “सेनाओं का प्रभु” या “सैन्य-दलों का प्रभु” भी किया जाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “यहूदा का पुरुष”; इब्रानी एकवचन यहाँ पूरे समूह का प्रतिनिधित्व करता है।
    reason: alternative_reading
  - marker: c
    text: 'इब्रानी में ध्वनि-साम्य है: “न्याय” (मिशपाट) के बदले “रक्तपात” (मिस्पाख), और “धार्मिकता” (त्सदाकाह) के बदले “दुहाई” (त्सआकाह)। इससे अपेक्षा और वास्तविकता का तीखा विरोध उभरता है। “रक्तपात” के लिए प्रयुक्त इब्रानी शब्द दुर्लभ है और उसका सटीक अर्थ कुछ अनिश्चित है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद दाख की बारी के गीत का अर्थ स्पष्ट करता है; इसलिए कारण अथवा व्याख्या सूचित करने वाला सामान्य हिन्दी संयोजक चुना गया।
- source_word: כֶרֶם
  choice: दाख की बारी
  rationale: यह शब्द अंगूर उगाने के लिए तैयार की गई बारी को सूचित करता है और पिछले पदों के कृषि-रूपक को बनाए रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को 'याहवे' रूप में रखा गया और צְבָאוֹת का अर्थ आधुनिक हिन्दी में स्पष्ट करने के लिए 'सेनाओं के' कहा गया।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: यह वाचा-संबंधी सामूहिक अभिव्यक्ति है; 'घराना' हिन्दी में परिवार और पूरे वंश-समुदाय दोनों का भाव देता है।
- source_word: וְאִישׁ יְהוּדָה
  choice: और यहूदा के लोग
  rationale: इब्रानी में 'पुरुष' एकवचन है, पर यहाँ सामूहिक अर्थ में यहूदा के समुदाय को दर्शाता है। स्वाभाविक हिन्दी के लिए सामूहिक बहुवचन मुख्य पाठ में रखा गया और शाब्दिक रूप पादटिप्पणी में दिया गया।
- source_word: נְטַע שַׁעֲשׁוּעָיו
  choice: उसके मनभावने पौधे
  rationale: यह चयन रोपने के कृषि-रूपक तथा याहवे के आनंद या प्रियता—दोनों भावों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַיְקַו
  choice: उसने … की आशा की
  rationale: संदर्भ में यह दाख की बारी से अपेक्षित फल पाने की प्रतीक्षा या आशा व्यक्त करता है।
- source_word: לְמִשְׁפָּט
  choice: न्याय
  rationale: यहाँ सामाजिक और नैतिक न्याय अभिप्रेत है, केवल न्यायिक निर्णय नहीं।
- source_word: מִשְׂפָּח
  choice: रक्तपात
  rationale: यह दुर्लभ शब्द है, जिसे संदर्भ और पारंपरिक व्याख्या के आधार पर हिंसक अन्याय, विशेषतः रक्तपात, के अर्थ में लिया गया है। इसकी ध्वनि מִשְׁפָּט से मिलती है।
- source_word: לִצְדָקָה
  choice: धार्मिकता
  rationale: यह नैतिक सत्यनिष्ठा, उचित आचरण और सही सामाजिक व्यवस्था का व्यापक भाव बनाए रखता है।
- source_word: צְעָקָה
  choice: दुहाई
  rationale: यह अत्याचार या अन्याय से पीड़ित व्यक्ति की सहायता और न्याय के लिए उठी पुकार है; 'दुहाई' हिन्दी में इस प्रसंगगत बल को संक्षेप में व्यक्त करती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। उसका नामात्मक स्वरूप बनाए रखने के लिए 'याहवे' रखा गया, न कि उसे उपाधि 'प्रभु' से बदला गया।
- issue: וְאִישׁ יְהוּדָה का सामूहिक और लिंग-सूचक बल
  choice: यहूदा के लोग
  alternative: यहूदा का पुरुष; यहूदा के पुरुष
  rationale: एकवचन אִישׁ यहाँ पूरे यहूदा-समुदाय का सामूहिक प्रतिनिधित्व करता है। मुख्य पाठ में हिन्दी की स्पष्टता और स्वाभाविकता के लिए 'लोग' रखा गया है, जबकि स्रोत का एकवचन रूप पादटिप्पणी में सुरक्षित है।
- issue: מִשְׂפָּח का दुर्लभ और कुछ हद तक अनिश्चित अर्थ
  choice: रक्तपात
  alternative: अन्याय; रक्त-दोष
  rationale: न्याय के विपरीत पाए गए सामाजिक दुष्फल और प्रचलित शाब्दिक विश्लेषण के अनुसार 'रक्तपात' उपयुक्त है, पर शब्द की दुर्लभता को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक समानांतरता को पंक्ति-विन्यास और दोहराए गए “पर देखो” से उभारा गया है। “दाख की बारी,” “पौधे,” “न्याय,” “धार्मिकता” और “दुहाई” मूल कृषि तथा सामाजिक-नैतिक चित्रों को बनाए रखते हैं।
