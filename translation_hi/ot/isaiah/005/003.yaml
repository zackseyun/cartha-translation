  yaml_path: translation/ot/isaiah/005/003.yaml
  text: And now[a], inhabitant of Jerusalem and man of Judah, judge, please, between me and my vineyard.
translation:
  language: hi
  text: और अब, हे यरूशलेम के निवासी और यहूदा के पुरुष[a], कृपया मेरे और मेरी दाख की बारी के बीच न्याय करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘यरूशलेम के निवासी’ और ‘यहूदा के पुरुष’ दोनों एकवचन में हैं, पर इनके द्वारा पूरे समुदाय को प्रतिनिधिक रूप से संबोधित किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: ‘और’ पिछले दाख की बारी के गीत से निरंतरता बनाए रखता है, जबकि ‘अब’ सीधे संबोधन और निर्णय की अपील की ओर मोड़ दिखाता है।
- source_word: יוֹשֵׁב יְרוּשָׁלַם
  choice: हे यरूशलेम के निवासी
  rationale: एकवचन कृदंत को प्रतिनिधिक सामूहिक संबोधन के रूप में रखते हुए ‘निवासी’ स्वाभाविक और स्रोत के रूप के निकट है; ‘हे’ हिन्दी में प्रत्यक्ष संबोधन स्पष्ट करता है।
- source_word: וְאִישׁ יְהוּדָה
  choice: और यहूदा के पुरुष
  rationale: אִישׁ का पुल्लिंग एकवचन रूप सुरक्षित रखा गया है। यह यरूशलेम के ‘निवासी’ के समानांतर प्रतिनिधिक संबोधन है।
- source_word: שִׁפְטוּ
  choice: न्याय करो
  rationale: बहुवचन आज्ञार्थक क्रिया संबोधित समुदाय से दो पक्षों के बीच निर्णय देने को कहती है। हिन्दी में सामूहिक आदरसूचक संबोधन के साथ ‘करो’ स्वाभाविक है।
- source_word: נָא
  choice: कृपया
  rationale: विनय अथवा आग्रह सूचक कण का भाव आधुनिक हिन्दी में ‘कृपया’ से स्पष्ट और बिना पुरातनता के व्यक्त होता है।
- source_word: בֵּינִי וּבֵין כַּרְמִי
  choice: मेरे और मेरी दाख की बारी के बीच
  rationale: दोनों विवाद-पक्षों को स्पष्ट रखते हुए כֶּרֶם के लिए प्रचलित बाइबिलीय हिन्दी पद ‘दाख की बारी’ चुना गया है।
theological_decisions:
- issue: प्रतिनिधिक एकवचन और लिंगसूचक संबोधन
  choice: ‘यरूशलेम के निवासी और यहूदा के पुरुष’ के रूप में एकवचन बनाए रखना
  alternative: ‘यरूशलेम के निवासियो और यहूदा के लोगो’ अथवा बहुवचन ‘पुरुषो’
  rationale: इब्रानी में दोनों पद एकवचन हैं, पर पूरे समुदाय को प्रतिनिधिक रूप से संबोधित करते हैं। स्रोत की बनावट और אִישׁ के स्पष्ट पुल्लिंग को बचाने के लिए हिन्दी में भी एकवचन रखा गया है; पादटिप्पणी इसके सामूहिक आशय को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दाख की बारी’ परिचित बाइबिलीय पद है। प्रत्यक्ष संबोधन के लिए ‘हे’ जोड़ा गया है, और प्रतिनिधिक एकवचन की असामान्यता पादटिप्पणी में समझाई गई है।
