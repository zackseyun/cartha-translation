source:
  edition: WLC
  text: וְ/עַתָּה֙ אוֹדִֽיעָה נָּ֣א אֶתְ/כֶ֔ם אֵ֛ת אֲשֶׁר אֲנִ֥י עֹשֶׂ֖ה לְ/כַרְמִ֑/י הָסֵ֤ר מְשׂוּכָּת/וֹ֙ וְ/הָיָ֣ה לְ/בָעֵ֔ר פָּרֹ֥ץ גְּדֵר֖/וֹ וְ/הָיָ֥ה לְ/מִרְמָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/005.yaml
  text: 'And now[a], please let me tell you what I will do to my vineyard: I will remove its hedge, and it will be burned; I will break down its wall[b], and it will be trampled down.'
translation:
  language: hi
  text: 'और अब, आओ, मैं तुम्हें बताऊँ कि मैं अपनी दाखबारी के साथ क्या करूँगा: मैं उसकी बाड़ हटा दूँगा, और वह जला दी जाएगी[a]; मैं उसकी दीवार ढा दूँगा, और वह रौंदी जाएगी[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और वह भस्म हो जाएगी” अथवा “और वह नष्ट हो जाएगी।” इब्रानी अभिव्यक्ति का शाब्दिक अर्थ है, “और वह जलाने के लिए हो जाएगी।”
    reason: lexical_alternative
  - marker: b
    text: या “और वह रौंदने की जगह बन जाएगी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक वाव और कालवाचक क्रिया-विशेषण—दोनों को रखते हुए यह दाखबारी के गीत में अगले चरण का स्वाभाविक संकेत देता है।
- source_word: אוֹדִיעָה נָּא אֶתְכֶם
  choice: कृपया मैं तुम्हें बता दूँ
  rationale: हिफ़ील रूप का अर्थ ‘ज्ञात कराना/बताना’ है और נָא विनम्र आग्रह का भाव जोड़ता है। यह हिंदी में स्वाभाविक रहते हुए दोनों तत्वों को व्यक्त करता है।
- source_word: אֵת אֲשֶׁר אֲנִי עֹשֶׂה לְכַרְמִי
  choice: कि मैं अपनी दाखबारी के साथ क्या करने वाला हूँ
  rationale: यद्यपि עֹשֶׂה कृदंत है, संदर्भ में निकट भविष्य की घोषित कार्रवाई है। ‘करने वाला हूँ’ उस आसन्न भाव को स्वाभाविक हिंदी में रखता है।
- source_word: הָסֵר מְשׂוּכָּתוֹ
  choice: मैं उसकी बाड़ हटा दूँगा
  rationale: क्रियार्थक निरपेक्ष रूप यहाँ दृढ़तापूर्वक की जाने वाली अगली कार्रवाई बताता है। מְשׂוּכָּה दाखबारी की रक्षक बाड़ है।
- source_word: וְהָיָה לְבָעֵר
  choice: और वह जला दी जाएगी
  rationale: शाब्दिक संरचना ‘जलाने/भस्म करने के लिए हो जाएगी’ है। मुख्य पाठ में ‘जला दी जाएगी’ संभावित अर्थ को स्पष्ट और सहज बनाता है, जबकि व्यापक ‘नष्ट/भस्म हो जाएगी’ की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: פָּרֹץ גְּדֵרוֹ
  choice: मैं उसकी दीवार गिरा दूँगा
  rationale: פָּרֹץ का अर्थ तोड़ना या सेंध लगाना है; גָּדֵר पहली बाड़ से अलग एक दीवारनुमा घेरा है। ‘दीवार गिरा दूँगा’ दोनों सुरक्षा-परतों का भेद बनाए रखता है।
- source_word: וְהָיָה לְמִרְמָס
  choice: और वह रौंदी जाएगी
  rationale: מִרְמָס रौंदे जाने या रौंदने की जगह बनने का बोध देता है। कर्मवाच्य हिंदी परिणाम को सशक्त और संक्षिप्त रूप से व्यक्त करती है।
theological_decisions:
- issue: न्याय के रूपक के तौर पर दाखबारी
  choice: पद में कृषि-रूपक को बिना खोले यथावत रखा गया है।
  alternative: मुख्य पाठ में दाखबारी को इस्राएल या यहूदा के रूप में स्पष्ट कर देना।
  rationale: आस-पास का संदर्भ रूपक का अभिप्राय बताता है, पर यह पद स्वयं चित्रात्मक भाषा में बोलता है। अनुवाद को न्याय की तीव्रता बनाए रखते हुए व्याख्या को मुख्य पाठ में नहीं जोड़ना चाहिए।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और भविष्यसूचक लहजा रखा गया है। ‘दाखबारी’ कृषि-रूपक को स्पष्ट रखता है; ‘बाड़’ और ‘दीवार’ दो अलग रक्षक घेरों का भेद बनाए रखते हैं। पादटिप्पणी-चिह्न उन्हीं वाक्यांशों के बाद रखे गए हैं जिनकी वैकल्पिक व्याख्या दी गई है।
