  text: ה֣וֹי הָ/אֹמְרִ֥ים לָ/רַ֛ע ט֖וֹב וְ/לַ/טּ֣וֹב רָ֑ע שָׂמִ֨ים חֹ֤שֶׁךְ לְ/אוֹר֙ וְ/א֣וֹר לְ/חֹ֔שֶׁךְ שָׂמִ֥ים מַ֛ר לְ/מָת֖וֹק וּ/מָת֥וֹק לְ/מָֽר׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/020.yaml
  text: Woe to those who call evil good and good evil[a], who make darkness light and light darkness[b], who make bitter sweet and sweet bitter.
translation:
  language: hi
  text: हाय उन पर जो बुराई को भलाई और भलाई को बुराई कहते हैं[a], जो अँधेरे को उजाला और उजाले को अँधेरा ठहराते हैं[b], जो कड़वे को मीठा और मीठे को कड़वा ठहराते हैं!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो बुराई को ‘भलाई’ और भलाई को ‘बुराई’ कहते हैं।”
    reason: lexical_alternative
  - marker: b
    text: 'अँधेरे और उजाले, फिर कड़वे और मीठे की दोहराई गई छवियाँ निंदा को तीव्र करती हैं: बात केवल शब्दों की भूल की नहीं, बल्कि नैतिक वास्तविकता को उलट देने की है।'
    reason: cultural_note
lexical_decisions:
- source_word: הוֹי
  choice: हाय उन पर
  rationale: यह भविष्यद्वाणी संबंधी धिक्कार और आने वाले न्याय की गंभीर चेतावनी व्यक्त करता है; आधुनिक हिन्दी में ‘हाय उन पर’ स्वाभाविक और प्रभावशाली है।
- source_word: הָאֹמְרִים
  choice: कहते हैं
  rationale: मूल क्रिया का सामान्य अर्थ ‘कहना’ है; इस वाक्य-विन्यास में यह किसी वस्तु को उलटा नैतिक नाम देने का भाव भी स्पष्ट रखता है।
- source_word: לָרַע טוֹב וְלַטּוֹב רָע
  choice: बुराई को भलाई और भलाई को बुराई
  rationale: मूल की संक्षिप्त, संतुलित नैतिक विरोध-रचना को सुरक्षित रखता है। ‘बुराई/भलाई’ साधारण हिन्दी में नैतिक अर्थ को ‘बुरा/अच्छा’ से अधिक स्पष्ट करते हैं।
- source_word: שָׂמִים
  choice: ठहराते हैं
  rationale: यहाँ क्रिया वस्तुओं को भौतिक रूप से बदलने के बजाय एक को दूसरे के रूप में प्रस्तुत या मान्य ठहराने का भाव देती है; ‘ठहराते हैं’ इस सक्रिय उलटाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֹשֶׁךְ לְאוֹר וְאוֹר לְחֹשֶׁךְ
  choice: अँधेरे को उजाला और उजाले को अँधेरा
  rationale: मूल के समांतर विरोध और विनिमय को संक्षिप्त, काव्यात्मक हिन्दी में बनाए रखता है।
- source_word: מַר לְמָתוֹק וּמָתוֹק לְמָר
  choice: कड़वे को मीठा और मीठे को कड़वा
  rationale: मूल के इंद्रियगत रूपक और चरम सममिति को सीधे तथा स्वाभाविक ढंग से सुरक्षित रखता है।
theological_decisions:
- issue: धिक्कार का स्वरूप
  choice: पद को नैतिक वास्तविकता उलटने—बुराई को भलाई और भलाई को बुराई ठहराने—की निंदा के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल सामान्य भ्रम या केवल किसी विशेष न्यायिक, सामाजिक अथवा राजनीतिक प्रसंग की निंदा मानना।
  rationale: अँधेरे/उजाले और कड़वे/मीठे के व्यापक रूपक आरोप की गंभीरता और विस्तार दिखाते हैं, पर पाठ किसी एक संकीर्ण सैद्धांतिक या राजनीतिक प्रयोग तक इसे सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। तीन समानांतर खंडों तथा उनके उलटे युग्मों को सुरक्षित रखा गया है; ‘हाय उन पर’ भविष्यद्वाणी संबंधी न्याय-घोषणा का गंभीर स्वर बनाए रखता है।
