id: ISA.5.22
reference: Isaiah 5:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ה֕וֹי גִּבּוֹרִ֖ים לִ/שְׁתּ֣וֹת יָ֑יִן וְ/אַנְשֵׁי חַ֖יִל לִ/מְסֹ֥ךְ שֵׁכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/022.yaml
  text: Woe to those who are heroes at drinking wine[b][a], and men of strength at mixing strong drink.
translation:
  language: hi
  text: हाय उन पर जो दाखमधु पीने में वीर हैं[a], और नशीला पेय मिलाने में पराक्रमी पुरुष हैं[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बलवान पुरुष”; इब्रानी शब्द प्रायः वीरों या योद्धाओं के लिए आता है, पर यहाँ मदिरा पीने की क्षमता के लिए व्यंग्य में प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या, “सामर्थी पुरुष”; यह पद सामान्यतः योग्य या शूरवीर पुरुषों के लिए प्रयुक्त होता है, पर यहाँ नशीला पेय मिलाने की निपुणता पर व्यंग्य करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: हाय उन पर
  rationale: यह भविष्यद्वक्ताई धिक्कार और आनेवाले न्याय की घोषणा है; ‘हाय उन पर’ आधुनिक हिन्दी में संबोधित लोगों पर विपत्ति का भाव स्पष्ट करता है।
- source_word: גִּבּוֹרִים
  choice: वीर
  rationale: मूल शब्द प्रायः वीरों, योद्धाओं या सामर्थी लोगों के लिए आता है; यहाँ पीने की क्षमता के लिए व्यंग्यात्मक रूप से प्रयुक्त है।
- source_word: לִשְׁתּוֹת יָיִן
  choice: दाखमधु पीने में
  rationale: לְ सहित क्रियार्थक रूप उस क्षेत्र को दर्शाता है जिसमें वे ‘वीर’ माने जाते हैं; ‘पीने में’ हिन्दी में स्वाभाविक समानार्थ देता है। יַיִן के लिए गरिमापूर्ण और परिचित ‘दाखमधु’ चुना गया है।
- source_word: וְאַנְשֵׁי חַיִל
  choice: और ... पराक्रमी पुरुष
  rationale: यह पद सामान्यतः सामर्थी, योग्य या शूरवीर पुरुषों का द्योतक है; यहाँ समानांतर व्यंग्य बनाए रखने के लिए ‘पराक्रमी पुरुष’ रखा गया है।
- source_word: לִמְסֹךְ שֵׁכָר
  choice: नशीला पेय मिलाने में
  rationale: מָסַךְ पेय को मिलाने/तैयार करने का अर्थ देता है और שֵׁכָר मादक पेय का व्यापक शब्द है; ‘नशीला पेय’ किसी एक आधुनिक पेय-प्रकार को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: वीरता और पराक्रम की भाषा का आशय
  choice: सैन्य शब्दावली के व्यंग्य को बनाए रखा गया
  alternative: भावार्थ में केवल ‘बहुत पीने वाले’ या ‘नशीला पेय बनाने में निपुण’ कहना
  rationale: पद वास्तविक वीरता की प्रशंसा नहीं करता, बल्कि प्रतिष्ठित वीरता-संबंधी उपाधियों को मद्यपान की कुशलता पर लागू करके नैतिक विडंबना रचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भविष्यद्वक्ताई शैली रखी गई है। ‘वीर’ और ‘पराक्रमी पुरुष’ मूल की समानांतर तथा व्यंग्यात्मक वीरता-भाषा को बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
