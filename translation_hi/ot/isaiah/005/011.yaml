language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ה֛וֹי מַשְׁכִּימֵ֥י בַ/בֹּ֖קֶר שֵׁכָ֣ר יִרְדֹּ֑פוּ מְאַחֲרֵ֣י בַ/נֶּ֔שֶׁף יַ֖יִן יַדְלִיקֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/011.yaml
  text: Woe to those who rise early in the morning to pursue strong drink[a], who stay late into the evening until wine inflames them.
translation:
  language: hi
  text: हाय उन पर जो भोर होते ही उठकर मादक पेय के पीछे दौड़ते हैं, और साँझ ढलने तक लगे रहते हैं, यहाँ तक कि दाखरस उन्हें भड़का देता है!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹי
  choice: हाय उन पर
  rationale: यह भविष्यद्वाणी की भर्त्सना और आने वाले न्याय की घोषणा है; यह प्रयोग आधुनिक हिन्दी में उसके गंभीर बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מַשְׁכִּימֵי בַבֹּקֶר
  choice: जो भोर होते ही उठकर
  rationale: कृदन्त और प्रातःकाल के समय—दोनों को रखते हुए यह अभिव्यक्ति उनकी दिन के आरम्भ से ही लगी लत पर बल देती है।
- source_word: שֵׁכָר
  choice: मादक पेय
  rationale: यह दाखमधु से भिन्न किसी नशीले पेय का व्यापक शब्द है; ‘मादक पेय’ आधुनिक आसुत शराब तक अर्थ को अनुचित रूप से सीमित नहीं करता।
- source_word: יִרְדֹּפוּ
  choice: के पीछे दौड़ते हैं
  rationale: मूल क्रिया का अर्थ पीछा करना या खदेड़ना है; यह चुनाव शराब पाने की उनकी उत्सुक और लगातार चेष्टा की सजीवता बनाए रखता है।
- source_word: מְאַחֲרֵי בַנֶּשֶׁף
  choice: साँझ तक देर लगाए रहते हैं
  rationale: אחר का रूप देर करने या देर तक ठहरे रहने को और נֶשֶׁף यहाँ दिन के विपरीत छोर की गोधूलि को सूचित करता है; हिन्दी वाक्य सुबह से साँझ तक की गति को स्वाभाविक बनाता है।
- source_word: יַיִן
  choice: दाखमधु
  rationale: यह יַיִן का स्थापित, गरिमापूर्ण हिन्दी समतुल्य है और पहले आए व्यापक ‘मादक पेय’ से इसका भेद बनाए रखता है।
- source_word: יַדְלִיקֵם
  choice: उन्हें भड़का न दे
  rationale: हिफ़ील रूप जलाने या भड़काने का रूपक रखता है; यह दाखमधु से उत्पन्न उन्माद और उत्तेजना को बिना रूपक मिटाए व्यक्त करता है।
theological_decisions:
- issue: वचन का स्वर—विलाप या न्याय की घोषणा
  choice: ‘हाय उन पर’ द्वारा न्यायसूचक भर्त्सना
  alternative: केवल ‘हाय’ द्वारा सामान्य विलाप
  rationale: הוֹי में विलाप की छाया हो सकती है, पर इस प्रसंग की ‘हाय’ घोषणाएँ दोषारोपण और न्याय दोनों का बल रखती हैं; अनुवाद उस बल को बनाए रखते हुए किसी विशेष सांप्रदायिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, भविष्यद्वाणी-संगत शैली रखी गई है। ‘मादक पेय’ साधारण पाठक के लिए स्पष्ट और अर्थ की दृष्टि से व्यापक है, जबकि ‘दाखमधु’ यַיִן को अलग पहचान देता है। ‘भड़का’ मूल अग्नि-रूपक को सजीव रखता है।
