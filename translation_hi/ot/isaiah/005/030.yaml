base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/030.yaml
  text: And he will roar over it on that day like the roaring of the sea[a]; and if one looks to the land, behold, darkness and distress[d][c][b], and the light is darkened in its clouds.
translation:
  language: hi
  text: उस दिन वह उस पर समुद्र की गर्जना के समान गरजेगा[a]। और कोई भूमि की ओर देखे[b], तो देखो—अंधकार और संकट[c]; और उसके बादलों में उजाला अँधेरा हो गया है[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसके विरुद्ध’ भी संभव; इब्रानी प्रत्यय पुल्लिंग एकवचन है और पिछले प्रसंग की व्याख्या के अनुसार किसी मानवीकृत प्रजा, देश या शत्रु-लक्ष्य की ओर संकेत कर सकता है।
    reason: alternative_reading
  - marker: b
    text: या ‘पृथ्वी की ओर देखे’; इब्रानी אֶרֶץ का अर्थ ‘भूमि’, ‘देश’ या ‘पृथ्वी’ हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘क्लेश’ अथवा ‘व्याकुलता’; इब्रानी צַר में तंगी, परेशानी और दबाव का भाव है।
    reason: lexical_alternative
  - marker: d
    text: अंतिम इब्रानी पद कठिन है। इसका अनुवाद ‘उसके बादलों में’ या ‘उसके घने बादलों में’ हो सकता है और संभवतः उन काले बादल-समूहों की ओर संकेत करता है जिनमें उजाला धुँधला पड़ जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִנְהֹם
  choice: वह गरजेगा
  rationale: נהם ऊँची और भयावह गरज को व्यक्त करता है। कर्ता पुल्लिंग एकवचन है, पर प्रसंग में वह आक्रमणकारी राष्ट्र या शत्रु-समूह का सामूहिक मानवीकरण हो सकता है।
- source_word: עָלָיו
  choice: उस पर
  rationale: על के साथ पुल्लिंग एकवचन प्रत्यय का अर्थ ‘उस पर’ या ‘उसके विरुद्ध’ हो सकता है। मुख्य पाठ अधिक व्यापक ‘उस पर’ रखता है और संदर्भगत अनिश्चितता पादटिप्पणी में बताता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यसूचक समय-सूचक पद का स्वाभाविक और सटीक आधुनिक हिन्दी रूप है।
- source_word: כְּנַהֲמַת יָם
  choice: समुद्र की गर्जना के समान
  rationale: मूल उपमा समुद्र की प्रचंड ध्वनि को आक्रमणकारी की गरज से जोड़ती है; ‘गर्जना’ इस श्रव्य बिंब को बनाए रखती है।
- source_word: וְנִבַּט לָאָרֶץ
  choice: यदि कोई भूमि की ओर देखे
  rationale: क्रिया को यहाँ अनिर्दिष्ट देखने वाले के रूप में समझना प्रसंगानुकूल है। אֶרֶץ के लिए ‘भूमि’ तत्काल विनाश-दृश्य के अनुकूल है, यद्यपि ‘पृथ्वी’ भी संभव है।
- source_word: וְהִנֵּה
  choice: तो देखो
  rationale: यह दृश्य के अचानक सामने आने और भविष्यसूचक संकेत की शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֹשֶׁךְ
  choice: अंधकार
  rationale: यह मूल संज्ञा का सीधा और प्रसंगानुकूल रूप है।
- source_word: צַר
  choice: संकट
  rationale: यह शब्द तंगी, क्लेश, विपत्ति या व्याकुलता का भाव रखता है। ‘संकट’ परिस्थिति की दबावपूर्ण दशा को व्यापक रूप से व्यक्त करता है।
- source_word: וָאוֹר חָשַׁךְ
  choice: और उजाला अँधेरा पड़ गया है
  rationale: यह उजाले के अंधकारमय हो जाने के विरोधाभासी और परिणामसूचक काव्य-बिंब को बनाए रखता है।
- source_word: בַּעֲרִיפֶיהָ
  choice: उसके बादलों में
  rationale: अंतिम पद दुर्लभ और कठिन है, पर संभवतः भूमि या दृश्य से संबद्ध बादल-समूहों को दर्शाता है। בְּ का सीधा स्थानवाचक रूप ‘में’ रखा गया है; ‘घने बादलों में’ भी संभव है।
