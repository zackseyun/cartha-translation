  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी रखी गई है। भविष्यसूचक काव्य की ध्वनि और अचानक प्रकट होने वाले दृश्य के लिए ‘तो देखो’ तथा समुद्र की गर्जना का बिंब सुरक्षित रखा गया है। मूल पाठ की सर्वनामगत और अंतिम पद की वास्तविक अस्पष्टता को मुख्य पाठ में अनावश्यक रूप से नहीं सुलझाया गया, बल्कि पादटिप्पणियों में स्पष्ट किया गया है।
