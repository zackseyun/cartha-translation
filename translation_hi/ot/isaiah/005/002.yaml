base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/002.yaml
  text: He dug it up[a], cleared it of stones, and planted it with choice vines; he built a tower in its midst, and also hewed out a winepress in it. Then he expected it to produce grapes, but it produced wild grapes.
translation:
  language: hi
  text: उसने दाख की बारी को खोदकर तैयार किया, उसके पत्थर निकाल दिए और उसमें दाख की चुनी हुई बेलें लगाईं। उसने उसके बीच में एक मीनार बनाई और उसमें अंगूर रौंदने का एक कुंड भी तराशकर बनाया। फिर उसने आशा की कि उसमें अंगूर फलेंगे, पर उसमें जंगली अंगूर[a] फले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निकम्मे अंगूर” अथवा “खराब फल”; इब्रानी शब्द अपेक्षित अंगूरों के विपरीत घटिया या दुर्गंधयुक्त फल को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְעַזְּקֵהוּ
  choice: उसने उसकी मिट्टी खोदी
  rationale: क्रिया दाख की बारी तैयार करने के लिए मिट्टी खोदने या जोतने का बोध देती है। यह रूप कृषि-चित्र को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: וַיְסַקְּלֵהוּ
  choice: उसमें से पत्थर निकाल दिए
  rationale: पिएल रूप यहाँ पत्थर मारने का नहीं, भूमि से पत्थर हटाने का अर्थ देता है।
- source_word: שֹׂרֵק
  choice: उत्तम जाति की दाखलताएँ
  rationale: शब्द चुनी हुई, उच्च गुणवत्ता वाली दाख की बेल या पौध को सूचित करता है; बहुवचन सामूहिक रोपण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִגְדָּל
  choice: मीनार
  rationale: मूल शब्द सामान्यतः मीनार है। दाख की बारी में इसका काम निगरानी का रहा होगा, पर अनुवाद में उससे अधिक विशिष्ट अर्थ नहीं जोड़ा गया।
- source_word: בְּתוֹכוֹ
  choice: उसके बीच में
  rationale: स्थान-संबंधी चित्र को स्पष्ट, सहज हिन्दी में बनाए रखता है।
- source_word: יֶקֶב
  choice: अंगूर रौंदने का हौज
  rationale: यह दाखरस निकालने की प्रेस या उसके हौज को दर्शाता है। वर्णनात्मक हिन्दी प्राचीन प्रक्रिया को आधुनिक पाठक के लिए स्पष्ट करती है।
- source_word: חָצֵב
  choice: खोदकर बनाया
  rationale: क्रिया चट्टान काटकर या खोदकर बनाने का बोध देती है। हिन्दी में यह निर्माण की मेहनत और ठोसपन को स्वाभाविक रूप से व्यक्त करती है।
- source_word: וַיְקַו
  choice: उसने आशा की
  rationale: क्रिया प्रतीक्षा, आशा या अपेक्षा का अर्थ रख सकती है। यहाँ सावधानीपूर्वक तैयारी के बाद फल की आशा का भाव उपयुक्त है और मूल की भावात्मक प्रत्याशा भी बनाए रखता है।
- source_word: לַעֲשׂוֹת עֲנָבִים
  choice: उसमें अच्छे अंगूर लगेंगे
  rationale: शाब्दिक रूप से ‘अंगूर उत्पन्न करना’ है; बेल के फलने के लिए ‘अंगूर लगना’ स्वाभाविक हिन्दी है। ‘अच्छे’ प्रत्याशित फल और अगले विरोध को स्पष्ट करता है, बिना रूपक का अर्थ पहले से खोलने के।
- source_word: וַיַּעַשׂ בְּאֻשִׁים
  choice: उसमें जंगली अंगूर लगे
  rationale: בְּאֻשִׁים घटिया, दुर्गंधयुक्त या निकम्मे फल को दर्शाता है। ‘जंगली अंगूर’ प्रचलित और चित्रात्मक है; शब्द की नकारात्मक अर्थ-छाया पादटिप्पणी में स्पष्ट की गई है।
theological_decisions:
- issue: दाख की बारी का रूपक, जिसकी पहचान आगे इस्राएल से कराई जाती है
  choice: इस पद में कृषि-संबंधी चित्र को ही रखा गया है और रूपक का आशय पहले से नहीं खोला गया।
  alternative: ऐसा अनुवाद करना जो इस्राएल या उसके नैतिक फल की ओर इसी पद में स्पष्ट संकेत दे।
  rationale: पद स्वयं दाख की बारी के गीत का ठोस चित्र प्रस्तुत करता है; आगे का संदर्भ इसकी व्याख्या करता है। इससे साहित्यिक और धर्मवैचारिक तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘दाखलताएँ’, ‘मीनार’ और ‘हौज’ काव्यात्मक कृषि-चित्र को बनाए रखते हैं; कठिन प्राचीन तकनीकी शब्दावली के स्थान पर संक्षिप्त वर्णनात्मक अभिव्यक्ति अपनाई गई है।
