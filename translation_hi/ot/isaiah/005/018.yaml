base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/018.yaml
  text: Woe to those who drag iniquity with cords of falsehood[a], and sin with cart ropes[b],
translation:
  language: hi
  text: हाय उन पर जो अधर्म को झूठ की रस्सियों से, और पाप को गाड़ी खींचने वाली मोटी रस्सियों के समान खींचते हैं!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹי
  choice: हाय उन पर
  rationale: यह भविष्यद्वाणी की भर्त्सना और आसन्न विपत्ति की घोषणा व्यक्त करता है; आधुनिक हिन्दी में ‘हाय उन पर’ इसका स्वाभाविक और गंभीर रूप है।
- source_word: מֹשְׁכֵי
  choice: खींचते हैं
  rationale: बहुवचन कृदन्त निरंतर या विशेषतापूर्ण क्रिया दिखाता है; ‘खींचते हैं’ रस्सियों से भारी वस्तु खींचने का सजीव बिंब बनाए रखता है।
- source_word: עָוֹן
  choice: अधर्म
  rationale: शब्द अपराध, दोष और उसके दायित्व तक का अर्थ दे सकता है। ‘अधर्म’ नैतिक गंभीरता रखता है और आगे आए חַטָּאָה ‘पाप’ से शब्दगत भेद भी बनाए रखता है।
- source_word: בְּחַבְלֵי הַשָּׁוְא
  choice: झूठ की रस्सियों से
  rationale: חֶבֶל रस्सी या डोरी है और שָׁוְא झूठ, व्यर्थता या खोखलेपन का बोध करा सकता है। प्रसंग में ‘झूठ’ सहज है, जबकि व्यापक अर्थ-पट्टी पादटिप्पणी में सुरक्षित है।
- source_word: וְכַעֲבֹתוֹת
  choice: और ... मानो ... मोटे रस्सों से
  rationale: כְּ तुलना सूचित करता है और עֲבֹתוֹת मोटी रस्सियाँ हैं। ‘मानो’ तुलना को स्पष्ट रखता है तथा ‘मोटे रस्से’ दूसरी छवि की बढ़ी हुई शक्ति दर्शाते हैं।
- source_word: הָעֲגָלָה
  choice: गाड़ी
  rationale: यह बोझ ढोने वाली गाड़ी को दर्शाता है; ‘गाड़ी’ सामान्य आधुनिक हिन्दी में सहज है और प्राचीन बिंब भी बनाए रखता है।
- source_word: חַטָּאָה
  choice: पाप
  rationale: सीधा और स्वाभाविक समतुल्य; इसे ‘अधर्म’ से अलग रखकर मूल के दो निकटवर्ती, पर भिन्न, शब्द सुरक्षित रहते हैं।
theological_decisions:
- issue: मनुष्य और पाप के बीच रूपकात्मक संबंध
  choice: लोग अधर्म और पाप को जानबूझकर अपने साथ भारी बोझ की तरह खींचते दिखाए गए हैं।
  alternative: वे झूठ के द्वारा अपने ऊपर दोष या दण्ड खींच लाते हैं।
  rationale: क्रिया और रस्सियों का सीधा बिंब बुराई से सक्रिय, हठीले लगाव को प्रमुख बनाता है। फिर भी עָוֹן में दोष या परिणाम का भाव संभव होने से वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘हाय उन पर’ भविष्यद्वाणी की भर्त्सना को व्यक्त करता है। ‘मानो’ मूल के तुलनासूचक כְּ को सुरक्षित रखता है, और ‘मोटे रस्से’ עֲבֹתוֹת की शक्ति को स्पष्ट करता है।
