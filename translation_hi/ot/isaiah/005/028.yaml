- source_word: וְכָל קַשְּׁתֹתָיו דְּרֻכוֹת
  choice: और उसके सभी धनुष चढ़े हुए हैं
  rationale: דְּרֻכוֹת उन धनुषों को दर्शाता है जिन्हें प्रयोग के लिए तैयार कर लिया गया है। ‘चढ़े हुए’ हिन्दी में धनुष पर प्रत्यंचा चढ़ाकर तैयार रखने का स्वाभाविक चित्र देता है।
- source_word: פַּרְסוֹת סוּסָיו
  choice: उसके घोड़ों के खुर
  rationale: मूल पाठ के संबंध और एकवचन अधिकारसूचक प्रत्यय को स्पष्ट, सहज हिन्दी में सुरक्षित रखा गया है।
- source_word: כַּצַּר
  choice: चकमक पत्थर के समान
