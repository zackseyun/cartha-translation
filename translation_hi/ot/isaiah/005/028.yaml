- source_word: נֶחְשָׁבוּ
  choice: माने जाते हैं
  rationale: निफ़अल रूप का ‘समझे/माने जाना’ अर्थ सुरक्षित रहता है और हिन्दी में तुलना स्वाभाविक लगती है।
- source_word: וְגַלְגִּלָּיו
  choice: और उसके पहिए
  rationale: मूल में सामान्यतः ‘पहिए’ है; युद्ध-रथ का संदर्भ प्रसंग से स्पष्ट है, इसलिए पाठ में अनावश्यक रूप से ‘रथों के’ नहीं जोड़ा गया।
- source_word: כַּסּוּפָה
  choice: बवंडर के समान
  rationale: סוּפָה प्रचंड तूफ़ानी हवा या बवंडर को दर्शाता है; यह पहियों की तीव्र गति और विनाशकारी शक्ति का सजीव चित्र देता है।
