translation:
  language: hi
  text: जिसके तीर पैने हैं और उसके सभी धनुष चढ़े हुए हैं[a]; उसके घोड़ों के खुर चकमक पत्थर[b] के समान माने जाते हैं, और उसके पहिए बवंडर[c] के समान हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तने हुए हैं”; इब्रानी में धनुषों को प्रयोग के लिए तैयार किए जाने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या “कठोर चट्टान”; तुलना घोड़ों के खुरों की कठोरता पर बल देती है।
    reason: lexical_alternative
  - marker: c
    text: या “प्रचंड आँधी”; यह चित्र तीव्र गति और विनाशकारी शक्ति पर बल देता है।
    reason: lexical_alternative
