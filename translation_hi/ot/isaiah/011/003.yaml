  yaml_path: translation/ot/isaiah/011/003.yaml
  text: And his delight shall be in the fear of Yahweh[a], and he shall not judge by what his eyes see, nor decide by what his ears hear.
translation:
  language: hi
  text: और यहोवा के भय में उसका आनन्द होगा।[a] वह न तो अपनी आँखों के देखे के आधार पर न्याय करेगा, और न अपने कानों के सुने के आधार पर निर्णय देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से संभवतः, “यहोवा के भय में उसका सूँघना/परखना होगा।” इब्रानी क्रिया कठिन है और तीक्ष्ण परख का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲרִיחוֹ
  choice: उसका आनन्द होगा
  rationale: हिफ़ील रूप यहाँ कठिन है और शाब्दिक रूप से सूँघने/परखने की धारणा दे सकता है। प्रसंग में यहोवा के भय के प्रति उसकी आंतरिक रुचि और उससे जुड़ी असाधारण परख मुख्य है; इसलिए स्वाभाविक हिन्दी में ‘उसका आनन्द होगा’ रखा गया है, जबकि शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: בְּיִרְאַת
  choice: के भय में
  rationale: यह वाचा-संबंधी भय, श्रद्धा और विस्मय को व्यक्त करता है। ‘भय’ मूल की धार्मिक गंभीरता बनाए रखता है; इसे केवल सामान्य सम्मान तक सीमित नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित रूप से परमेश्वर के व्यक्तिगत नाम को दर्शाता है और इसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: לְמַרְאֵה עֵינָיו
  choice: अपनी आँखों से दिखाई देने के आधार पर
  rationale: दृश्य रूप या बाहरी दिखाई पड़ने वाली बात पर आधारित न्याय का निषेध व्यक्त करता है और मूल की इंद्रिय-संबंधी छवि बनाए रखता है।
- source_word: יִשְׁפּוֹט
  choice: न्याय करेगा
  rationale: क्रिया का न्यायिक और शासकीय अर्थ यहाँ प्रत्यक्ष है।
- source_word: לְמִשְׁמַע אָזְנָיו
  choice: अपने कानों से सुनी बात के आधार पर
  rationale: पहले अर्धपद के समानांतर श्रव्य सूचना या रिपोर्ट पर मात्र निर्भरता को दर्शाता है और कानों की ठोस छवि बनाए रखता है।
- source_word: יוֹכִיחַ
  choice: निर्णय देगा
  rationale: हिफ़ील रूप के ‘निर्णय करना, विवाद निपटाना, फैसला देना’ अर्थ को यहाँ न्यायिक समानांतर के अनुरूप व्यक्त करता है; ‘डाँटना’ इस प्रसंग में अत्यधिक संकीर्ण होता।
theological_decisions:
- issue: आने वाले दाऊदी शासक की परख
  choice: वह यहोवा के भय में आनन्दित है और केवल बाहरी दृश्य या सुनी हुई सूचना के आधार पर न्याय नहीं करता।
  alternative: आरंभिक वाक्यांश उसकी अलौकिक सूँघने-जैसी तीक्ष्ण परख पर बल दे सकता है।
  rationale: निकटवर्ती प्रसंग आत्मा से सम्पन्न यिशै के अंकुर का है। मुख्य पाठ उसकी श्रद्धापूर्ण प्रवृत्ति और असाधारण न्याय-विवेक को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि कठिन इब्रानी रूप की वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट। ‘केवल’ मूल में पृथक शब्द नहीं है, पर दोनों इंद्रिय-वाक्यांशों का आशय—दिखाई या सुनाई देने वाली बात मात्र पर निर्भर न होना—स्वाभाविक हिन्दी में स्पष्ट करता है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में सम्मिलित है।
