source:
  edition: WLC
  text: וְ/סָ֨רָה֙ קִנְאַ֣ת אֶפְרַ֔יִם וְ/צֹרְרֵ֥י יְהוּדָ֖ה יִכָּרֵ֑תוּ אֶפְרַ֨יִם֙ לֹֽא יְקַנֵּ֣א אֶת יְהוּדָ֔ה וִֽ/יהוּדָ֖ה לֹֽא יָצֹ֥ר אֶת אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/013.yaml
  text: The jealousy of Ephraim will depart[a], and the adversaries of Judah will be cut off; Ephraim will not be jealous of Judah[b], and Judah will not harass Ephraim.
translation:
  language: hi
  text: एप्रैम की ईर्ष्या दूर हो जाएगी[a], और यहूदा के शत्रु काट डाले जाएँगे; एप्रैम यहूदा से ईर्ष्या नहीं करेगा, और यहूदा एप्रैम को नहीं सताएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “डाह”; यहाँ इब्रानी קנא/קנאה एप्रैम और यहूदा के बीच ईर्ष्यापूर्ण प्रतिद्वंद्विता का भाव दे सकता है। यही विकल्प पद में ‘ईर्ष्या नहीं करेगा’ पर भी लागू है।
    reason: lexical_alternative
  - marker: b
    text: या “एप्रैम से शत्रुता नहीं रखेगा” अथवा “एप्रैम पर अत्याचार नहीं करेगा”; इब्रानी क्रिया शत्रुता करने, सताने या दबाने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָרָה
  choice: दूर हो जाएगी
  rationale: सूर क्रिया यहाँ ‘ईर्ष्या’ को कर्ता बनाकर उसके हट जाने या दूर हो जाने का चित्र प्रस्तुत करती है। यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल बिंब को बनाए रखती है।
- source_word: קִנְאַת / יְקַנֵּא
  choice: ईर्ष्या / ईर्ष्या नहीं करेगा
  rationale: קנא/קנאה यहाँ एप्रैम और यहूदा के बीच ईर्ष्यापूर्ण प्रतिद्वंद्विता को व्यक्त करता है। ‘ईर्ष्या’ दोनों प्रयोगों में समानता और काव्यात्मक संबंध बनाए रखती है।
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: मूल पाठ के जातीय-राष्ट्रीय नाम को ज्यों का त्यों लिप्यंतरित किया गया है; उसे व्याख्यात्मक रूप से ‘उत्तरी राज्य’ नहीं बनाया गया।
- source_word: וְצֹרְרֵי יְהוּדָה
  choice: और यहूदा के शत्रु
  rationale: צרר से बना रूप यहूदा के विरुद्ध शत्रुता रखने वालों को दर्शाता है। ‘शत्रु’ व्यापक है और अनावश्यक रूप से युद्ध, घेराबंदी या अत्याचार की किसी एक विशिष्ट विधि को नहीं ठहराता।
- source_word: יִכָּרֵתוּ
  choice: काट डाले जाएँगे
  rationale: כרת के निफ़अल रूप का मूल बिंब ‘काट दिए जाने’ या ‘समाप्त कर दिए जाने’ का है। हिन्दी अभिव्यक्ति उस तीव्रता और बिंब को बनाए रखती है।
- source_word: וִיהוּדָה לֹא יָצֹר אֶת אֶפְרָיִם
  choice: और यहूदा एप्रैम को नहीं सताएगा
  rationale: यह क्रिया शत्रुता दिखाने, तंग करने या दबाने का भाव दे सकती है। ‘सताएगा’ सक्रिय विरोध को स्वाभाविक हिन्दी में व्यक्त करता है, पर उसे केवल औपचारिक युद्ध या घेराबंदी तक सीमित नहीं करता।
theological_decisions:
- issue: एप्रैम और यहूदा के अभिप्रेत समुदाय
  choice: मूल जातीय-राष्ट्रीय नाम ‘एप्रैम’ और ‘यहूदा’ बनाए रखे गए हैं।
  alternative: ‘उत्तरी राज्य’ और ‘दक्षिणी राज्य’, अथवा ‘इस्राएल’ और ‘यहूदा’।
  rationale: इब्रानी पाठ सीधे एप्रैम और यहूदा के नाम लेता है। नामों को बनाए रखने से पद की ऐतिहासिक और काव्यात्मक बनावट सुरक्षित रहती है और व्यापक सामुदायिक संकेत का निर्णय पाठक संदर्भ से कर सकता है।
- issue: यहूदा द्वारा एप्रैम के प्रति क्रिया की सीमा
  choice: ‘नहीं सताएगा’ द्वारा सामान्य सक्रिय शत्रुता व्यक्त की गई है।
  alternative: ‘शत्रुता नहीं रखेगा’, ‘अत्याचार नहीं करेगा’, या ‘घेराबंदी नहीं करेगा’।
  rationale: मूल क्रिया में शत्रुता, उत्पीड़न या तंग करने की अर्थ-सीमा संभव है। संदर्भ आपसी वैमनस्य के अंत पर केंद्रित है, इसलिए किसी एक सैन्य या राजनीतिक रूप को निर्णायक नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की दो संतुलित अर्ध-पंक्तियाँ एप्रैम और यहूदा के बीच समानांतरता बनाए रखती हैं। ‘काट डाले जाएँगे’ मूल इब्रानी बिंब को सुरक्षित रखता है, जबकि पादटिप्पणियाँ वास्तविक शब्दार्थगत विकल्पों को स्पष्ट करती हैं।
