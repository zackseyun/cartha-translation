  text: לֹֽא יָרֵ֥עוּ וְ/לֹֽא יַשְׁחִ֖יתוּ בְּ/כָל הַ֣ר קָדְשִׁ֑/י כִּֽי מָלְאָ֣ה הָ/אָ֗רֶץ דֵּעָה֙ אֶת יְהוָ֔ה כַּ/מַּ֖יִם לַ/יָּ֥ם מְכַסִּֽים־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/009.yaml
  text: They will not do harm or bring destruction on all my holy mountain[a], for the earth will be full of the knowledge of Yahweh as the waters cover the sea.
translation:
  language: hi
  text: वे मेरे पूरे पवित्र पर्वत में न तो हानि पहुँचाएँगे, न विनाश करेंगे, क्योंकि पृथ्वी[a] यहोवा के ज्ञान से भर जाएगी, जैसे जल समुद्र को ढकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि देश यहोवा के ज्ञान से भर जाएगा।”
    reason: הָאָרֶץ का अर्थ संदर्भ के अनुसार ‘पृथ्वी’ या ‘देश’ हो सकता है।
lexical_decisions:
- source_word: יָרֵעוּ
  choice: कोई हानि करेंगे
  rationale: हिफ़ील रूप यहाँ हानि पहुँचाने का ठोस अर्थ देता है और समानांतर क्रिया ‘विनाश मचाएँगे’ के साथ स्वाभाविक बैठता है।
- source_word: יַשְׁחִיתוּ
  choice: विनाश मचाएँगे
  rationale: शחת के हिफ़ील का अर्थ नष्ट करना या बरबादी लाना है; यह चयन कारक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּכָל הַר קָדְשִׁי
  choice: मेरे सारे पवित्र पर्वत पर
  rationale: ב का स्थानवाचक अर्थ पर्वत के साथ हिन्दी में स्वाभाविक रूप से ‘पर’ है; כָל को ‘सारे’ से स्पष्ट रखा गया है।
- source_word: מָלְאָה
  choice: भर जाएगी
  rationale: भविष्याभिमुख भविष्यद्वाणी के संदर्भ में पूर्ण रूप को भविष्यकाल में प्रस्तुत किया गया है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: व्यापक शांति-दर्शन और समुद्र की विस्तृत उपमा के संदर्भ में सार्वभौमिक अर्थ उपयुक्त है, यद्यपि ‘देश’ भी शाब्दिक संभावना है।
- source_word: דֵּעָה אֶת יְהוָה
  choice: यहोवा के ज्ञान से
  rationale: यह वाक्यांश यहोवा को जानने के संबंधपरक ज्ञान को सूचित करता है, केवल उसके विषय में जानकारी को नहीं।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: כַּמַּיִם לַיָּם מְכַסִּים
  choice: जैसे जल समुद्र को ढके रहता है
  rationale: उपमा और वर्तमान कृदंत का निरंतर भाव सहज हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: शांति की भविष्यद्वाणी का भौगोलिक विस्तार
  choice: הָאָרֶץ को ‘पृथ्वी’ मानते हुए सार्वभौमिक विस्तार
  alternative: ‘देश’, अर्थात अपेक्षाकृत स्थानीय या इस्राएल-केंद्रित विस्तार
  rationale: संदर्भ और समुद्र को ढकने वाले जल की व्यापक उपमा सार्वभौमिक अर्थ का समर्थन करती है; फिर भी मूल शब्द की स्थानीय संभावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। समानांतर निषेधों को ‘न तो…न…’ से व्यक्त किया गया है।
