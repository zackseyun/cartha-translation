  yaml_path: translation/ot/isaiah/011/008.yaml
  text: The nursing child will play over the cobra’s hole[b][a], and the weaned child will put his hand on the viper’s den.
translation:
  language: hi
  text: दूध पीता बच्चा नाग के बिल पर खेलेगा[a], और दूध छुड़ाया हुआ बच्चा विषैले साँप के बिल के मुँह पर अपना हाथ रखेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नाग’ के लिए इब्रानी शब्द एक विषैले साँप को दर्शाता है; इसे परंपरागत रूप से ऐस्प या कोबरा माना जाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपना हाथ बढ़ाएगा।” यहाँ ‘विषैला साँप’ के लिए इब्रानी शब्द किसी विषैले साँप को दर्शाता है; उसकी ठीक प्रजाति निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁעֲשַׁע
  choice: खेलेगा
  rationale: इस प्रसंग में क्रिया निश्चिंत और आनंदपूर्ण खेल को व्यक्त करती है; आधुनिक हिन्दी में ‘खेलेगा’ स्वाभाविक है।
- source_word: יוֹנֵק
  choice: दूध पीता बच्चा
  rationale: यह उस छोटे बच्चे को दर्शाता है जो अभी माँ का दूध पीता है और अगले पदांश के ‘दूध छुड़ाए हुए’ बच्चे के साथ विकासात्मक समानांतर बनाता है।
- source_word: חֻר
  choice: बिल
  rationale: साँप के रहने के छेद या खोल के लिए ‘बिल’ साधारण हिन्दी में सबसे स्वाभाविक शब्द है।
- source_word: פָּתֶן
  choice: नाग
  rationale: यह एक विषैले साँप का नाम है, जिसे परंपरागत रूप से ऐस्प या कोबरा माना गया है; ‘नाग’ आधुनिक हिन्दी में बोधगम्य है और अनावश्यक zoological निश्चितता से बचता है।
- source_word: מְאוּרַת
  choice: मांद
  rationale: यह किसी जीव के रहने के स्थान या खोल को सूचित करता है; ‘मांद’ पहले पदांश के ‘बिल’ से काव्यात्मक भिन्नता बनाए रखता है।
- source_word: צִפְעוֹנִי
  choice: करैत
  rationale: शब्द एक विषैले साँप को दर्शाता है। ‘करैत’ हिन्दी पाठकों के लिए परिचित विषैले साँप का नाम है, यद्यपि सटीक प्रजाति निश्चित नहीं है।
- source_word: גָּמוּל
  choice: दूध छुड़ाया हुआ बच्चा
  rationale: यह उस बच्चे को दर्शाता है जिसका दूध छुड़ाया जा चुका है और मूल पाठ के विकासात्मक अंतर को सुरक्षित रखता है।
- source_word: יָדוֹ
  choice: अपना हाथ
  rationale: हिब्रू में पुल्लिंग एकवचन प्रत्यय है; हिन्दी में कर्ता से संबंध स्पष्ट करने के लिए ‘अपना हाथ’ स्वाभाविक है।
- source_word: הָדָה
  choice: रखेगा
  rationale: इस दुर्लभ क्रिया का अर्थ हाथ बढ़ाना या रखना हो सकता है। ‘पर अपना हाथ रखेगा’ प्रसंग में सहज है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: शांतिमय राज्य के संदर्भ में चित्र का स्वरूप
  choice: असाधारण शांति और सुरक्षा का चित्र सीधी काव्यात्मक भाषा में प्रस्तुत करना
  alternative: इसे केवल सृष्टि का शाब्दिक रूपांतरण या केवल मसीही शांति का प्रतीक घोषित करना
  rationale: पद निर्बल बच्चों को घातक साँपों से सुरक्षित दिखाता है, पर यह निर्धारित नहीं करता कि चित्र शाब्दिक है, प्रतीकात्मक है या दोनों; अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और काव्यात्मक समानांतरता को बनाए रखने वाला रूप। ‘दूध पीता बच्चा’ और ‘दूध छुड़ाया हुआ बच्चा’ मूल के विकासात्मक विरोध को स्पष्ट करते हैं।
