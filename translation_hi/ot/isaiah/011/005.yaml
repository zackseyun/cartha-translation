id: ISA.11.5
reference: Isaiah 11:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָ֥יָה צֶ֖דֶק אֵז֣וֹר מָתְנָ֑י/ו וְ/הָ/אֱמוּנָ֖ה אֵז֥וֹר חֲלָצָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/005.yaml
  text: Righteousness will be the belt of his waist[b][a], and faithfulness the belt of his loins.
translation:
  language: hi
  text: धार्मिकता[a] उसकी कमर का पट्टा होगी, और विश्वासयोग्यता[b] उसकी कटि का पट्टा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्याय।”
    reason: lexical_alternative
  - marker: b
    text: या “निष्ठा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: होगी
  rationale: भविष्यसूचक कथन में संयोजक सहित पूर्ण रूप भावी अर्थ देता है। हिन्दी में वाक्य के आरम्भ का ‘और’ छोड़ा गया है, क्योंकि पद अपने वर्तमान रूप में इसके बिना अधिक स्वाभाविक है।
- source_word: צֶדֶק
  choice: धार्मिकता
  rationale: यह शब्द धार्मिकता, न्याय या सही आचरण का बोध करा सकता है। यहाँ आने वाले शासक के चरित्रगत गुण के लिए ‘धार्मिकता’ उपयुक्त है, जबकि ‘न्याय’ को वास्तविक lexical alternative के रूप में टिप्पणी में रखा गया है।
- source_word: אֵזוֹר
  choice: पट्टा
  rationale: यह शरीर के चारों ओर बाँधी जाने वाली वस्तु है। ‘पट्टा’ आधुनिक हिन्दी में स्पष्ट है और मूल ठोस रूपक को बनाए रखता है।
- source_word: מָתְנָיו
  choice: उसकी कमर
  rationale: यह शब्द कमर या कटि-प्रदेश को सूचित करता है। पहले समानांतर खंड में ‘कमर’ सहज और सामान्य हिन्दी है।
- source_word: וְהָאֱמוּנָה
  choice: और विश्वासयोग्यता
  rationale: אֱמוּנָה दृढ़ता, भरोसेमंदी, निष्ठा या विश्वासयोग्यता का बोध कराता है। यहाँ यह शासक के भरोसेमंद और अटल चरित्र का गुण है; ‘विश्वासयोग्यता’ उस अर्थ को स्पष्ट रखती है।
- source_word: אֵזוֹר
  choice: पट्टा
  rationale: मूल इब्रानी की पुनरावृत्ति और दोनों काव्य-पंक्तियों के समानांतर रूप को सुरक्षित रखने के लिए वही शब्द दोहराया गया है।
- source_word: חֲלָצָיו
  choice: उसकी कटि
  rationale: यह कटि, कूल्हों या कमर के निचले भाग को सूचित करता है। ‘कटि’ काव्यात्मक गरिमा बनाए रखते हुए पहले खंड के ‘कमर’ से मूल के अलग शरीर-संज्ञा को भी दर्शाता है।
theological_decisions:
- issue: मसीही भविष्यवाणी में साथ रखे गए दो सद्गुणों का अनुवाद
  choice: प्रतिज्ञात शासक के चरित्र के गुणों के रूप में ‘धार्मिकता’ और ‘विश्वासयोग्यता’
  alternative: צֶדֶק के लिए ‘न्याय’ और אֱמוּנָה के लिए ‘निष्ठा’ या ‘सच्चाई’
  rationale: पद इन गुणों को वस्त्र की तरह प्रस्तुत करके शासक के नैतिक चरित्र का चित्रण करता है। अनुवाद इस रूपक और नैतिक बल को बनाए रखता है, पर इब्रानी पाठ से आगे बढ़कर बाद की कोई विशिष्ट धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक है। ‘कमर’ सामान्य बोलचाल की स्पष्टता देता है, जबकि समानांतर दूसरे खंड में ‘कटि’ मूल की अलग शरीर-संज्ञा और काव्यात्मक संतुलन को बनाए रखता है।
