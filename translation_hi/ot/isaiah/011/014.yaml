source:
  edition: WLC
  text: וְ/עָפ֨וּ בְ/כָתֵ֤ף פְּלִשְׁתִּים֙ יָ֔מָּ/ה יַחְדָּ֖ו יָבֹ֣זּוּ אֶת בְּנֵי קֶ֑דֶם אֱד֤וֹם וּ/מוֹאָב֙ מִשְׁל֣וֹח יָדָ֔/ם וּ/בְנֵ֥י עַמּ֖וֹן מִשְׁמַעְתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/014.yaml
  text: They will swoop down on the shoulder of the Philistines to the west[a]; together they will plunder the sons of the east. Edom and Moab will be the putting forth of their hand[d][c][b], and the sons of Ammon will obey them.
translation:
  language: hi
  text: वे पश्चिम में पलिश्तियों के प्रदेश पर झपट पड़ेंगे[a]; वे मिलकर पूर्व के लोगों को लूटेंगे[b]। वे एदोम और मोआब पर अपना हाथ बढ़ाएँगे[c], और अम्मोन के लोग उनकी आज्ञा मानेंगे[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पश्चिम की ओर पलिश्तियों के कंधे पर”; “कंधा” यहाँ उनके पार्श्व, ढलान या पश्चिमी भूभाग का संकेत हो सकता है।
    reason: cultural_note
  - marker: b
    text: शाब्दिक रूप से, “पूर्व के पुत्र,” अर्थात पूर्व दिशा के लोग।
    reason: lexical_alternative
  - marker: c
    text: या, “एदोम और मोआब उनके हाथ के अधीन होंगे”; अथवा, “एदोम और मोआब उनके हाथ बढ़ाने का लक्ष्य होंगे।” हिब्रानी पदबंध संक्षिप्त है और अधिकार या आक्रमण का भाव दे सकता है।
    reason: lexical_alternative
  - marker: d
    text: या, “अम्मोन के लोग उनके अधीन होंगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָפוּ
  choice: झपट पड़ेंगे
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘उड़ना’ है, पर यहाँ युद्ध के प्रसंग में तेज़ी से आक्रमण करने का भाव है। ‘झपट पड़ेंगे’ उड़ान-सदृश बिंब और आक्रामक अर्थ दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: בְכָתֵף פְּלִשְׁתִּים יָמָּה
  choice: पश्चिम में पलिश्तियों के इलाके पर
  rationale: כָּתֵף का शाब्दिक अर्थ ‘कंधा’ है, किंतु भूगोल में यह पार्श्व, ढलान या सीमावर्ती भूभाग को सूचित कर सकता है; יָמָּה यहाँ पश्चिम दिशा बताता है। मुख्य पाठ में अर्थ स्पष्ट किया गया है और शाब्दिक बिंब पाद-टिप्पणी में सुरक्षित है।
- source_word: יַחְדָּו יָבֹזּוּ
  choice: वे मिलकर ... लूटेंगे
  rationale: יַחְדָּו संयुक्त कार्रवाई और בזז युद्ध में लूटने का स्पष्ट भाव व्यक्त करते हैं।
- source_word: בְּנֵי קֶדֶם
  choice: पूर्व के लोगों
  rationale: शाब्दिक रूप ‘पूर्व के पुत्र’ है, पर यह पूर्व दिशा के निवासियों के लिए हिब्रानी मुहावरा है। आधुनिक हिन्दी में ‘पूर्व के लोग’ स्वाभाविक है।
- source_word: מִשְׁלוֹחַ יָדָם
  choice: उनका हाथ बढ़ेगा
  rationale: यह संक्षिप्त संज्ञात्मक मुहावरा हाथ बढ़ाने, अधिकार जमाने या आक्रमण करने का संकेत देता है। हिन्दी अभिव्यक्ति मूल के ‘हाथ’ वाले बिंब को बनाए रखते हुए उसकी अस्पष्टता भी सुरक्षित रखती है।
- source_word: מִשְׁמַעְתָּם
  choice: उनकी आज्ञा मानेंगे
  rationale: यह שׁמע से बना संज्ञात्मक रूप है और आज्ञापालन अथवा अधीनता व्यक्त करता है। ‘आज्ञा मानेंगे’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: אֱדוֹם וּמוֹאָב ... וּבְנֵי עַמּוֹן
  choice: एदोम और मोआब ... अम्मोन के लोग
  rationale: एदोम, मोआब और अम्मोन के प्रचलित हिन्दी नाम रखे गए हैं; ‘अम्मोन के लोग’ शाब्दिक ‘अम्मोन के पुत्र’ का सहज अर्थ देता है।
theological_decisions:
- issue: क्या विजय और अधीनता की भाषा को केवल राजनीतिक प्रभाव के रूप में नरम किया जाए
  choice: आक्रमण, लूट और आज्ञापालन की स्पष्ट भाषा बनाए रखी गई है
  alternative: इसे सामान्य प्रभुत्व या राजनीतिक प्रभाव के रूप में प्रस्तुत करना
  rationale: हिब्रानी पाठ झपटने, लूटने, हाथ बढ़ाने और आज्ञापालन के सशक्त युद्ध-संबंधी बिंब इस्तेमाल करता है। भविष्यवाणी के पुनर्स्थापना-प्रसंग के कारण इस तीखेपन को कम करना उचित नहीं होगा।
- issue: מִשְׁלוֹחַ יָדָם में अधिकार और आक्रमण के बीच अर्थ-संबंध
  choice: ‘उनका हाथ बढ़ेगा’ द्वारा दोनों संभावनाओं को खुला रखा गया है
  alternative: ‘उनके अधीन होंगे’ या ‘वे उन पर हाथ डालेंगे’ कहकर केवल एक अर्थ निश्चित करना
  rationale: मूल संज्ञात्मक पदबंध संक्षिप्त और मुहावरेदार है। उसका अर्थ शक्ति के विस्तार, अधिकार या हमले से जुड़ सकता है; इसलिए मुख्य पाठ और पाद-टिप्पणी वास्तविक अस्पष्टता को बनाए रखते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सैन्य बिंबों को नरम नहीं किया गया। दुर्बोध शाब्दिक मुहावरों को मुख्य पाठ में स्वाभाविक हिन्दी दी गई है, जबकि उनके मूल बिंब और अर्थ-विकल्प पाद-टिप्पणियों में सुरक्षित हैं।
