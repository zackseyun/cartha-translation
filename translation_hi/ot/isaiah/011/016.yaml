source:
  edition: WLC
  text: וְ/הָיְתָ֣ה מְסִלָּ֔ה לִ/שְׁאָ֣ר עַמּ֔/וֹ אֲשֶׁ֥ר יִשָּׁאֵ֖ר מֵֽ/אַשּׁ֑וּר כַּ/אֲשֶׁ֤ר הָֽיְתָה֙ לְ/יִשְׂרָאֵ֔ל בְּ/י֥וֹם עֲלֹת֖/וֹ מֵ/אֶ֥רֶץ מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/016.yaml
  text: And there will be a highway for the remnant of his people that remains from Assyria[b][a], as there was for Israel in the day of his coming up from the land of Egypt.
translation:
  language: hi
  text: और उसकी प्रजा के बचे हुए समूह के लिए, जो अश्शूर से बचा रह जाएगा[a], एक राजमार्ग होगा, जैसा इस्राएल के लिए उस दिन था जिस दिन वह मिस्र देश से ऊपर आया था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जो अश्शूर से शेष रह जाएगा।’
    reason: lexical_alternative
  - marker: b
    text: मूल पाठ में अक्षरशः, ‘मिस्र देश से उसके ऊपर आने के दिन’; अर्थात मिस्र से इस्राएल के निर्गमन के समय।
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיְתָה
  choice: और ... होगा
  rationale: भविष्यसूचक कथन में वाव के साथ क़ातल भावी परिणाम बताता है; यह हिंदी में स्वाभाविक रूप से भविष्य अर्थ व्यक्त करता है।
- source_word: מְסִלָּה
  choice: एक राजमार्ग
  rationale: यह शब्द तैयार किए गए, प्रायः ऊँचे उठाए हुए मार्ग को दर्शाता है। ‘राजमार्ग’ वापसी के लिए खुले और सुगम मार्ग की छवि बनाए रखता है।
- source_word: לִשְׁאָר עַמּוֹ
  choice: उसकी प्रजा के उस बचे हुए भाग के लिए
  rationale: שְׁאָר यशायाह में बचे हुए जनसमूह का प्रमुख विचार है। यह चयन सामूहिक एकवचन और ‘शेष’ की धारणा दोनों को स्पष्ट करता है।
- source_word: אֲשֶׁר יִשָּׁאֵר
  choice: जो ... बचा रह जाएगा
  rationale: यह संबंधवाचक उपवाक्य सामूहिक ‘बचे हुए भाग’ को और परिभाषित करता है तथा हिब्रू के एकवचन भाव को बनाए रखता है।
- source_word: מֵאַשּׁוּר
  choice: अश्शूर से
  rationale: מִן स्रोत अथवा जहाँ से वापसी होगी, उसे सूचित करता है।
- source_word: כַּאֲשֶׁר הָיְתָה
  choice: जैसा ... था
  rationale: पहले बताए राजमार्ग को मिस्र से निर्गमन के समय इस्राएल के लिए बने मार्ग से तुलना के द्वारा जोड़ता है।
- source_word: לְיִשְׂרָאֵל
  choice: इस्राएल के लिए
  rationale: सामूहिक नाम ‘इस्राएल’ को यथावत रखा गया है।
- source_word: בְּיוֹם עֲלֹתוֹ
  choice: उस दिन ... जब वह ... ऊपर आया था
  rationale: मूल में ‘उसके ऊपर आने के दिन’ है। हिंदी की स्वाभाविक अभिव्यक्ति में वही कालगत और गतिसूचक अर्थ रखा गया है।
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से
  rationale: ‘देश’ को बनाए रखने से निर्गमन से जुड़ी मूल हिब्रू अभिव्यक्ति की पूर्णता सुरक्षित रहती है।
theological_decisions:
- issue: ‘उसकी प्रजा’ में संबंधसूचक सर्वनाम का संदर्भ
  choice: ‘उसकी प्रजा’ को बिना संदर्भ स्पष्ट किए रखा गया है।
  alternative: ‘यहोवा की प्रजा’ अथवा ‘मसीहा की प्रजा’
  rationale: इस पद में सर्वनाम के संदर्भ का नाम स्पष्ट रूप से नहीं दिया गया; किसी एक पहचान को जोड़ना मूल पाठ की धर्मवैचारिक संभाव्यता को अनावश्यक रूप से सीमित करता।
- issue: निर्गमन की प्रतिरूपात्मक तुलना
  choice: मिस्र से इस्राएल के ऐतिहासिक प्रस्थान की सीधी तुलना रखी गई है।
  alternative: इसे स्पष्ट रूप से ‘दूसरा निर्गमन’ कहना
  rationale: पद निर्गमन की घटना का आह्वान करता है, पर स्वयं कोई व्याख्यात्मक धर्मवैचारिक नाम नहीं देता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘उसकी प्रजा’ की संदर्भगत अस्पष्टता, सामूहिक ‘बचा हुआ भाग,’ राजमार्ग की छवि और निर्गमन-संबंधी ‘ऊपर आने’ की भाषा सुरक्षित रखी गई है।
