  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יוֹסִ֨יף אֲדֹנָ֤/י שֵׁנִית֙ יָד֔/וֹ לִ/קְנ֖וֹת אֶת שְׁאָ֣ר עַמּ֑/וֹ אֲשֶׁ֣ר יִשָּׁאֵר֩ מֵ/אַשּׁ֨וּר וּ/מִ/מִּצְרַ֜יִם וּ/מִ/פַּתְר֣וֹס וּ/מִ/כּ֗וּשׁ וּ/מֵ/עֵילָ֤ם וּ/מִ/שִּׁנְעָר֙ וּ/מֵ֣/חֲמָ֔ת וּ/מֵ/אִיֵּ֖י הַ/יָּֽם׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/011.yaml
  text: And in that day the Lord will again extend his hand[a], a second time, to recover the remnant of his people who remain, from Assyria, from Egypt, from Pathros, from Cush, from Elam, from Shinar, from Hamath[c][b], and from the coastlands of the sea.
translation:
  language: hi
  text: और उस दिन ऐसा होगा कि प्रभु फिर से—दूसरी बार—अपना हाथ बढ़ाएगा[a], ताकि अपनी प्रजा के उस बचे हुए अंश को प्राप्त करे, जो अश्शूर, मिस्र, पत्रोस, कूश[b], एलाम, शिनार, हमात और समुद्र के द्वीपों[c] में शेष रह गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या भावार्थ: “प्रभु दूसरी बार अपनी प्रजा के बचे हुए अंश को वापस पाने के लिए कार्य करेगा।” इब्रानी में शाब्दिक रूप से “फिर से/दूसरी बार अपना हाथ बढ़ाएगा ... प्राप्त करने के लिए” कहा गया है।'
    reason: lexical_alternative
  - marker: b
    text: कूश मिस्र के दक्षिण में स्थित क्षेत्रों से जुड़ा इब्रानी स्थान-नाम है; कुछ अनुवादों में इसके लिए “इथियोपिया” आता है।
    reason: cultural_note
  - marker: c
    text: या “समुद्र के तटीय प्रदेशों।” इब्रानी अभिव्यक्ति द्वीपों और व्यापक समुद्रतटीय भूभागों, दोनों को सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: और उस दिन ऐसा होगा कि
  rationale: यह भविष्यसूचक काल-सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और मूल के घटनात्मक आरम्भ को बनाए रखता है।
- source_word: יוֹסִיף אֲדֹנָי שֵׁנִית יָדוֹ
  choice: प्रभु फिर से—दूसरी बार—अपना हाथ बढ़ाएगा
  rationale: ‘फिर से’ יוֹסִיף की पुनरावृत्ति और ‘दूसरी बार’ שֵׁנִית के क्रमवाचक बल को व्यक्त करता है; ‘हाथ बढ़ाएगा’ मूल मानवरूपी बिंब को सुरक्षित रखता है।
- source_word: לִקְנוֹת
  choice: अपने अधिकार में ले
  rationale: קנה का मूल भाव प्राप्त करना या अपने अधिकार में लेना है। यह प्रसंग में पुनः एकत्र करने का आशय देता है, पर ‘छुड़ाना’ जैसे अतिरिक्त धर्मवैचारिक अर्थ को नहीं जोड़ता।
- source_word: שְׁאָר עַמּוֹ אֲשֶׁר יִשָּׁאֵר
  choice: अपनी प्रजा के उन बचे हुए लोगों को ... जो ... शेष रह गए हैं
  rationale: यह שְׁאָר और उसी धातु से बने יִשָּׁאֵר दोनों को व्यक्त करता है तथा हिन्दी में लोगों के बचे रहने का आशय स्पष्ट रखता है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह אֲדֹנָי उपाधि का प्रचलित, गरिमापूर्ण हिन्दी रूप है; यहाँ परमेश्वर के विशिष्ट नाम का रूप नहीं है।
- source_word: מֵאִיֵּי הַיָּם
  choice: समुद्र के द्वीपों
  rationale: אִיִּים का सीधा अर्थ द्वीप है, यद्यपि यह समुद्रतटीय प्रदेशों के लिए भी प्रयुक्त हो सकता है; विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: קנה को ‘छुड़ाना’, ‘वापस लाना’ या उसके मूल प्राप्ति-अर्थ के निकट अनूदित करना
  choice: अपने अधिकार में ले
  alternative: वापस ले आए / छुड़ा ले
  rationale: यह प्रभु द्वारा अपनी प्रजा को पुनः ग्रहण करने के प्रसंगगत भाव को व्यक्त करते हुए क्रिया में ऐसा छुटकारा-संबंधी धर्मवैचारिक अर्थ नहीं जोड़ता जो यहाँ स्वयं शब्द से अनिवार्य नहीं है।
- issue: प्रभु के ‘हाथ’ के मानवरूपी बिंब को बनाए रखना या उसे केवल कार्य के परिणाम में बदल देना
  choice: अपना हाथ बढ़ाएगा
  alternative: बचे हुए लोगों को वापस ले आएगा
  rationale: मूल पाठ स्पष्टतः ‘हाथ’ कहता है; बिंब को बनाए रखना उसकी काव्यात्मक और भविष्यसूचक भाषा के प्रति अधिक निष्ठावान है।
- issue: יוֹסִיף और שֵׁנִית की दोहरी पुनरावृत्ति को व्यक्त करना
  choice: फिर से—दूसरी बार—
  alternative: दूसरी बार
  rationale: दोनों अभिव्यक्तियों को रखने से मूल की वास्तविक पुनरुक्ति और बल सुरक्षित रहता है, बिना यह तय किए कि उल्लिखित पहली मुक्ति कौन-सी ऐतिहासिक घटना थी।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। स्थान-नामों को आधुनिक देशों से जबरन नहीं जोड़ा गया। वाक्य की भविष्यसूचक लय तथा ‘हाथ बढ़ाने’ का मूल बिंब बनाए रखा गया है।
