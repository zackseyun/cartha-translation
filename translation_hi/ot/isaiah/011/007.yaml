  yaml_path: translation/ot/isaiah/011/007.yaml
  text: The cow and the bear will graze[a]; together their young will lie down, and the lion, like the ox[b], will eat straw.
translation:
  language: hi
  text: गाय और भालू साथ-साथ चरेंगे[a]; उनके बच्चे एक साथ लेटेंगे, और सिंह बैल के समान[b] भूसा खाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गाय और भालू साथ-साथ भोजन करेंगे।” इब्रानी क्रिया का अर्थ सामान्य रूप से भोजन करना भी हो सकता है, यद्यपि यहाँ “चरेंगे” पशु-छवि के अनुकूल है।
    reason: lexical_alternative
  - marker: b
    text: या, “गोवंश के समान।” इब्रानी शब्द בָּקָר सामूहिक रूप से गोवंश को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרָה
  choice: गाय
  rationale: פָרָה का सामान्य अर्थ मादा गोवंश, अर्थात् गाय है; यह भालू के साथ जोड़ी गई एकवचन पशु-छवि को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וָדֹב
  choice: भालू
  rationale: דֹב का सीधा और प्रचलित हिन्दी समतुल्य।
- source_word: תִּרְעֶינָה
  choice: चरेंगी
  rationale: רעה यहाँ पशुओं के चरने या आहार लेने को दर्शाता है। स्त्रीलिंग बहुवचन क्रिया गाय और भालू दोनों से मेल खाती है; 'चरेंगी' ठोस पशु-छवि बनाए रखता है।
- source_word: יַחְדָּו
  choice: एक साथ
  rationale: क्रियाविशेषण का अर्थ 'साथ-साथ/एक साथ' है; हिन्दी वाक्य में स्वाभाविक और स्पष्ट।
- source_word: יִרְבְּצוּ
  choice: लेटेंगे
  rationale: רבץ पशुओं के बैठने या लेटकर विश्राम करने के लिए प्रयुक्त होता है; 'लेटेंगे' यहाँ सरल और सटीक है।
- source_word: יַלְדֵיהֶן
  choice: उनके बच्चे
  rationale: शाब्दिक अर्थ 'उनके बच्चे/शावक' है। गाय और भालू दोनों के बच्चों के लिए एक ही सहज सामूहिक अभिव्यक्ति के रूप में 'उनके बच्चे' उपयुक्त है।
- source_word: וְאַרְיֵה
  choice: और सिंह
  rationale: אַרְיֵה का मानक हिन्दी रूप 'सिंह' है और भविष्यवाणी की गरिमामय शैली के अनुकूल है।
- source_word: כַּבָּקָר
  choice: बैल के समान
  rationale: בָּקָר सामूहिक रूप से गोवंश को अथवा प्रसंग में किसी गोवंशी पशु को सूचित कर सकता है। एकवचन सिंह के साथ तुलना में 'बैल के समान' सहज है, जबकि पादटिप्पणी सामूहिक अर्थ को सुरक्षित रखती है।
- source_word: יֹאכַל
  choice: खाएगा
  rationale: इस भविष्यसूचक वर्णन में अपूर्ण क्रिया को भविष्यकाल में व्यक्त करना स्वाभाविक है।
- source_word: תֶּבֶן
  choice: भूसा
  rationale: תֶּבֶן पशुचारे में प्रयुक्त सूखा तिनका या भूसा है; आधुनिक हिन्दी में 'भूसा' इस आहार-छवि को 'पुआल' से अधिक स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: पशुओं के बीच शांति की छवि का स्वरूप
  choice: पद को मेल-मिलाप पाई सृष्टि के ठोस चित्रण के रूप में रखा गया है, बिना यह तय किए कि पूर्ति शाब्दिक है, प्रतीकात्मक है, या दोनों।
  alternative: इसे केवल मानवीय-राजनीतिक शांति का प्रतीक मानना, अथवा अनिवार्य रूप से शाब्दिक प्राणिवैज्ञानिक परिवर्तन बताना।
  rationale: इब्रानी पाठ सजीव पशु-छवि प्रस्तुत करता है, पर उसकी पूर्ति की विधि स्पष्ट नहीं करता। अनुवाद इस धर्मवैज्ञानिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सरल, गरिमामय भविष्यवाणी-शैली अपनाई गई है। 'सिंह' और 'के समान' साहित्यिक गरिमा देते हैं, जबकि 'चरेंगी', 'बच्चे', 'लेटेंगे' और 'भूसा' सामान्य पाठकों के लिए सहज हैं।
