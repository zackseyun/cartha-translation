source:
  edition: WLC
  text: וְ/נָשָׂ֥א נֵס֙ לַ/גּוֹיִ֔ם וְ/אָסַ֖ף נִדְחֵ֣י יִשְׂרָאֵ֑ל וּ/נְפֻצ֤וֹת יְהוּדָה֙ יְקַבֵּ֔ץ מֵ/אַרְבַּ֖ע כַּנְפ֥וֹת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/012.yaml
  text: He will raise a banner for the nations[a], and gather the banished of Israel[c][b]; he will assemble the scattered of Judah from the four corners of the earth.
translation:
  language: hi
  text: वह राष्ट्रों के लिए झंडा खड़ा करेगा[a], इस्राएल के निर्वासितों को इकट्ठा करेगा, और यहूदा की बिखरी हुई प्रजा[b] को पृथ्वी के चारों छोरों से एकत्र करेगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘संकेत खड़ा करेगा’; मूल शब्द ऊँचे किए गए ध्वज अथवा लोगों को बुलाने वाले दृश्य संकेत को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में ‘बिखरे हुए’ का रूप स्त्रीलिंग बहुवचन है। यह संभवतः यहूदा की प्रजा को सामूहिक रूप से दर्शाता है, न कि केवल स्त्रियों को।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘पृथ्वी के चार पंखों से’; यह पृथ्वी के सबसे दूरस्थ छोरों के लिए प्रयुक्त मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: וְנָשָׂא נֵס
  choice: झंडा खड़ा करेगा
  rationale: נשא के साथ נֵס किसी ऊँचे किए गए सार्वजनिक संकेत या ध्वज को दर्शाता है। ‘झंडा खड़ा करेगा’ आधुनिक हिन्दी में स्वाभाविक है और लोगों को बुलाकर एकत्र करने वाले दृश्य संकेत को बनाए रखता है।
- source_word: לַגּוֹיִם
  choice: राष्ट्रों के लिए
  rationale: גּוֹיִם का सामान्य अर्थ ‘राष्ट्र’ है; ל यहाँ उस झंडे के लक्षित दर्शकों या लाभार्थियों को सूचित करता है।
- source_word: נִדְחֵי יִשְׂרָאֵל
  choice: इस्राएल के निर्वासितों
  rationale: נדח का निष्क्रिय रूप उन लोगों का भाव देता है जिन्हें दूर कर दिया गया या खदेड़ दिया गया। ‘निर्वासित’ विस्थापन की इस शक्ति को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: וּנְפֻצוֹת יְהוּדָה
  choice: यहूदा की बिखरी हुई प्रजा
  rationale: नְפֻצוֹת स्त्रीलिंग बहुवचन है, पर प्रसंग में यह संभवतः यहूदा के लोगों के सामूहिक बिखराव को दर्शाता है, केवल स्त्रियों को नहीं। ‘प्रजा’ के साथ स्त्रीलिंग अभिव्यक्ति स्रोत की व्याकरणिक विशेषता को सहज हिन्दी में बनाए रखती है।
- source_word: יְקַבֵּץ
  choice: एकत्र करेगा
  rationale: קבץ का अर्थ बिखरे लोगों को फिर साथ लाना है। पहले आए אָסַף के लिए ‘इकट्ठा’ और यहाँ ‘एकत्र’ रखने से अर्थगत समानता बनी रहती है और अनावश्यक शब्द-पुनरावृत्ति घटती है।
- source_word: מֵאַרְבַּע כַּנְפוֹת הָאָרֶץ
  choice: पृथ्वी के चारों छोरों से
  rationale: כַּנְפוֹת का शाब्दिक अर्थ ‘पंख’ हो सकता है, पर इस मुहावरे में यह दूरस्थ किनारों या छोरों को दर्शाता है। ‘पृथ्वी के चारों छोर’ व्यापक भौगोलिक विस्तार का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: וּנְפֻצוֹת יְהוּדָה में स्त्रीलिंग रूप का आशय
  choice: ‘यहूदा की बिखरी हुई प्रजा’ द्वारा सामूहिक अर्थ और स्त्रीलिंग व्याकरण दोनों को व्यक्त किया गया है।
  alternative: ‘यहूदा की बिखरी हुई स्त्रियाँ’ या ‘यहूदा के बिखरे हुए लोग’
  rationale: हिब्रू का स्त्रीलिंग बहुवचन स्पष्ट है, लेकिन वह यहूदा को सामूहिक इकाई मानकर व्याकरणिक सामंजस्य दिखा सकता है; उसे केवल महिलाओं तक सीमित करना संदर्भ से अधिक निश्चित दावा होगा, जबकि सामान्य पुल्लिंग बहुवचन स्रोत की विशेषता मिटा देगा।
- issue: הָאָרֶץ का विस्तार
  choice: पृथ्वी
  alternative: देश
  rationale: राष्ट्रों के उल्लेख और चार छोरों से विश्वव्यापी एकत्रीकरण की छवि के कारण यहाँ ‘पृथ्वी’ अधिक उपयुक्त है, यद्यपि הָאָרֶץ अन्य संदर्भों में ‘देश’ भी हो सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘झंडा’, ‘निर्वासित’, ‘प्रजा’ और ‘चारों छोर’ सामान्य पाठक के लिए बोधगम्य हैं; पादटिप्पणियाँ हिब्रू के संकेतात्मक, स्त्रीलिंग और मुहावरेदार पहलुओं को बिना मुख्य वाक्य को बोझिल किए सुरक्षित रखती हैं।
