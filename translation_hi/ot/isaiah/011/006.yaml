  text: וְ/גָ֤ר זְאֵב֙ עִם כֶּ֔בֶשׂ וְ/נָמֵ֖ר עִם גְּדִ֣י יִרְבָּ֑ץ וְ/עֵ֨גֶל וּ/כְפִ֤יר וּ/מְרִיא֙ יַחְדָּ֔ו וְ/נַ֥עַר קָטֹ֖ן נֹהֵ֥ג בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/006.yaml
  text: And the wolf will dwell with the lamb[a], and the leopard will lie down with the young goat; and the calf and the young lion and the fattened calf will be together[d][c][b], and a little boy will lead them.
translation:
  language: hi
  text: तब भेड़िया मेमने के साथ बसेगा[a], और तेंदुआ बकरी के बच्चे के साथ लेटेगा; बछड़ा, जवान सिंह और पुष्ट पशु एक साथ रहेंगे, और एक छोटा बालक उन्हें ले चलेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भेड़िया मेमने के साथ परदेशी की तरह रहेगा।”
    reason: גור में बसने के साथ अस्थायी या परदेशी के रूप में निवास करने का भाव भी हो सकता है।
lexical_decisions:
- source_word: וְגָר
  choice: बसेगा
  rationale: גור के काल रूप में रहने या कुछ समय निवास करने का भाव है। ‘बसेगा’ शांतिपूर्ण सह-अस्तित्व की छवि को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: זְאֵב
  choice: भेड़िया
  rationale: इस पशु-संज्ञा का मानक हिन्दी रूप।
- source_word: עִם
  choice: के साथ
  rationale: संगति और निकटता बताने वाले इस संबंधसूचक का सहज हिन्दी रूप।
- source_word: כֶּבֶשׂ
  choice: मेमना
  rationale: यहाँ असुरक्षित शिकार और हिंसक पशु के काव्यात्मक विरोध को स्पष्ट रखता है।
- source_word: וְנָמֵר
  choice: तेंदुआ
  rationale: पशु-संज्ञा का प्रचलित आधुनिक हिन्दी रूप।
- source_word: גְּדִי
  choice: बकरी का बच्चा
  rationale: युवा बकरी का स्पष्ट और सर्वसुलभ हिन्दी नाम।
- source_word: יִרְבָּץ
  choice: लेटेगा
  rationale: רבץ पशुओं के बैठने या विश्राम के लिए लेटने को दर्शाता है; ‘लेटेगा’ शांतिपूर्ण दृश्य को सुरक्षित रखता है।
- source_word: וְעֵגֶל
  choice: बछड़ा
  rationale: युवा गोवंश के लिए मानक हिन्दी शब्द।
- source_word: וּכְפִיר
  choice: जवान सिंह
  rationale: כפיר युवा सिंह को सूचित करता है; यह रूप अर्थ और भविष्यद्वाणी की गरिमापूर्ण शैली दोनों को बनाए रखता है।
- source_word: וּמְרִיא
  choice: पला-पोसा पशु
  rationale: מְרִיא मोटे या विशेष रूप से खिलाए गए पशु को दर्शाता है। स्रोत केवल ‘बछड़ा’ नहीं कहता, इसलिए अधिक सामान्य ‘पशु’ मूल की व्यापकता बचाता है।
- source_word: יַחְדָּו
  choice: एक साथ रहेंगे
  rationale: क्रियारहित इब्रानी पदबंध को स्वाभाविक हिन्दी वाक्य बनाते हुए ‘एक साथ’ का अर्थ स्पष्ट किया गया है।
- source_word: וְנַעַר קָטֹן
  choice: एक छोटा बालक
  rationale: נַעַר पुल्लिंग बालक/लड़के को और קָטֹן उसकी छोटी अवस्था को दर्शाता है; यह चयन उस सजीव और लिंग-विशिष्ट छवि को रखता है।
- source_word: נֹהֵג בָּם
  choice: उन्हें हाँकेगा
  rationale: נהג पशुओं को आगे ले चलने या हाँकने के लिए प्रयुक्त होता है। ‘हाँकेगा’ चरवाही-संबंधी ठोस चित्र को ‘अगुवाई करेगा’ की अपेक्षा अधिक निकटता से रखता है।
theological_decisions:
- issue: शांतिमय राज्य की पशु-छवि का स्वरूप
  choice: पशुओं के मेल-मिलाप को उसी ठोस भविष्यद्वाणी-काव्यात्मक छवि में प्रस्तुत करना
  alternative: इसे केवल अंतकालीन प्राणिवैज्ञानिक परिवर्तन या केवल मानवीय राजनीतिक मेल-मिलाप के रूप में स्पष्ट कर देना
  rationale: इब्रानी पाठ ठोस पशु-चित्र प्रस्तुत करता है, पर उसकी व्याख्या को स्वयं पद में सीमित नहीं करता। अनुवाद इस तनाव को अनिर्णीत रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण और काव्यात्मक शैली अपनाई गई है। ठोस पशु-चित्र सुरक्षित रखे गए हैं; अनावश्यक धार्मिक व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
