base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/015.yaml
  text: And Yahweh will utterly destroy the tongue of the sea of Egypt[a], and he will wave his hand over the River with the scorching of his wind; he will strike it into seven streams[c][b], and make people walk through in sandals.
translation:
  language: hi
  text: और याहवे मिस्र के समुद्र की जीभ[a] को पूरी तरह नष्ट कर देगा। वह अपनी हवा की झुलसाने वाली तपिश[c] से उस नदी[b] के ऊपर अपना हाथ लहराएगा; वह उसे मारकर सात धाराओं में बाँट देगा और लोगों को सैंडल पहने हुए पार चलवाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मिस्र के समुद्र की खाड़ी’; शाब्दिक अर्थ, ‘मिस्र के समुद्र की जीभ।’
    reason: lexical_alternative
  - marker: b
    text: अर्थात् फरात नदी।
    reason: cross_reference
  - marker: c
    text: या, ‘अपनी हवा की तपन से।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶחֱרִים
  choice: पूरी तरह नष्ट कर देगा
  rationale: हिफ़ील रूप किसी वस्तु को विनाश के लिए समर्पित करने या निर्णायक रूप से मिटा देने का भाव देता है। यहाँ जल-बाधा के पूर्ण निष्कासन का भाव है; ‘सुखा देगा’ संदर्भानुकूल है, पर मूल क्रिया का अधिक व्याख्यात्मक अनुवाद होता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी परमेश्वर-नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: לְשׁוֹן יָם מִצְרַיִם
  choice: मिस्र के समुद्र की जीभ
  rationale: לָשׁוֹן का शाब्दिक बिंब ‘जीभ’ सुरक्षित रखा गया है; यहाँ इसका अर्थ जीभ के आकार की खाड़ी भी हो सकता है, जिसे पादटिप्पणी में दिया गया है।
- source_word: וְהֵנִיף יָדוֹ
  choice: अपना हाथ लहराएगा
  rationale: यह अभिव्यक्ति जल पर परमेश्वर के सामर्थ्यपूर्ण संकेत और कार्रवाई का ठोस बिंब बनाए रखती है।
- source_word: הַנָּהָר
  choice: महानद
  rationale: निश्चित पद वाला ‘नदी/नद’ भविष्यवाणी के संदर्भ में फरात को सूचित करता है। ‘महानद’ हिन्दी बाइबलीय प्रयोग में इस विशिष्ट नदी का स्वाभाविक संकेत है, जबकि स्पष्ट पहचान पादटिप्पणी में रखी गई है।
- source_word: בַּעְיָם רוּחוֹ
  choice: अपनी तपती हुई हवा से
  rationale: בַּעְיָם संभवतः तपन या झुलसाने वाली गर्मी बताता है और רוּחַ यहाँ जल पर चलने वाली ‘हवा’ के अर्थ में सर्वाधिक संदर्भानुकूल है। पाठगत अर्थ की अनिश्चितता पादटिप्पणी में दर्शाई गई है।
- source_word: וְהִכָּהוּ לְשִׁבְעָה נְחָלִים
  choice: उसे मारकर सात धाराओं में बाँट देगा
  rationale: נכה का सीधा अर्थ ‘मारना/प्रहार करना’ रखा गया है और परिणामसूचक לְ को स्वाभाविक हिन्दी में ‘सात धाराओं में बाँट देगा’ से व्यक्त किया गया है। संख्या सात को बिना प्रतीकात्मक व्याख्या के सुरक्षित रखा गया है।
- source_word: וְהִדְרִיךְ בַּנְּעָלִים
  choice: लोगों को जूते पहने हुए पार करा देगा
  rationale: हिफ़ील क्रिया चलवाने या पार कराने का भाव देती है। इब्रानी में कर्म अव्यक्त है, इसलिए हिन्दी में ‘लोगों को’ जोड़ा गया है; जूते पहने पार होना आसान, सूखे मार्ग का ठोस चित्र देता है।
theological_decisions:
- issue: मिस्र के समुद्र और महानद पर विजय के चित्रण का स्वरूप
  choice: भौगोलिक जलराशियों पर परमेश्वर की वास्तविक कार्रवाई को उन्नत भविष्यवाणी-संबंधी बिंबों में प्रस्तुत करना
  alternative: इसे केवल राजनीतिक बाधाओं का प्रतीक या केवल निर्गमन का रूपक मानना
  rationale: पद निर्गमन-जैसी मुक्ति की स्मृति जगाता है, पर अनुवाद ठोस जल-बिंबों को बनाए रखता है और किसी एक रूपकात्मक या मतविशेष की व्याख्या को पाठ में नहीं मिलाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। ‘समुद्र की जीभ’ का भविष्यवाणी-संबंधी मूल बिंब रखा गया है, जबकि ‘महानद’ के साथ पहचान पादटिप्पणी में दी गई है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
