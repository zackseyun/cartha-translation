id: ISA.11.10
reference: Isaiah 11:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא שֹׁ֣רֶשׁ יִשַׁ֗י אֲשֶׁ֤ר עֹמֵד֙ לְ/נֵ֣ס עַמִּ֔ים אֵלָ֖י/ו גּוֹיִ֣ם יִדְרֹ֑שׁוּ וְ/הָיְתָ֥ה מְנֻחָת֖/וֹ כָּבֽוֹד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/010.yaml
  text: And in that day the root of Jesse, who stands as a banner for the peoples—to him the nations will seek, and his resting place will be glory.
translation:
  language: hi
  text: उस दिन ऐसा होगा कि यिशै की जड़, जो लोगों के लिए झंडे के रूप में खड़ी होगी—राष्ट्र उसे खोजेंगे, और उसका विश्राम-स्थान महिमा होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁרֶשׁ יִשַׁי
  choice: यिशै की जड़
  rationale: ‘जड़’ मूल रूपक को सीधे बनाए रखती है और यिशै से निकलने वाले भावी वंशज की ओर संकेत करने वाली काव्यात्मक अभिव्यक्ति को व्याख्यात्मक रूप से नहीं खोलती।
- source_word: נֵס עַמִּים
  choice: देश-देश के लोगों के लिए झंडा
  rationale: נֵס यहाँ लोगों को दिखाई देने और एकत्र करने के लिए ऊँचा किया गया झंडा या संकेत है; ‘झंडा’ सहज हिन्दी में इस दृश्य रूपक को सुरक्षित रखता है। עַמִּים के बहुवचन को ‘देश-देश के लोग’ से व्यक्त किया गया है।
- source_word: יִדְרֹשׁוּ
  choice: खोज करेंगे
  rationale: דרש में खोजने, पूछने और मार्गदर्शन के लिए आने की अर्थ-सीमा है। ‘खोज करेंगे’ जानबूझकर इतना व्यापक है कि इसे केवल पूछताछ या आराधना तक सीमित न किया जाए।
- source_word: מְנֻחָתוֹ
  choice: उसका विश्राम-स्थान
  rationale: संज्ञा विश्राम और विश्राम के स्थान दोनों का संकेत दे सकती है; संदर्भ में स्थानवाची अर्थ स्वाभाविक है, पर इसे अधिक विशिष्ट निवास, समाधि या मंदिर नहीं बनाया गया।
- source_word: כָּבוֹד
  choice: महिमा
  rationale: हिब्रू में यह विधेय संज्ञा है, विशेषण नहीं। इसलिए ‘महिमामय’ के बजाय ‘महिमा’ रखा गया है, ताकि मूल की सघन और कुछ असामान्य अभिव्यक्ति बनी रहे।
theological_decisions:
- issue: ‘यिशै की जड़’ की पहचान
  choice: मूल रूपक को बिना स्पष्ट पहचान जोड़े रखा गया
  alternative: इसे सीधे ‘मसीहा’ या ‘यिशै का वंशज’ कहना
  rationale: पद एक व्यक्ति-सदृश ‘जड़’ का चित्र देता है, लेकिन स्वयं कोई उपाधि या स्पष्ट पहचान नहीं जोड़ता; अनुवाद को उस धार्मिक निष्कर्ष को पाठ में समाहित नहीं करना चाहिए।
- issue: ‘राष्ट्र उसकी खोज करेंगे’ का आशय
  choice: खोज की व्यापक भाषा बनाए रखी गई
  alternative: ‘उसकी आराधना करेंगे’, ‘उससे मार्गदर्शन माँगेंगे’ या ‘उसके पास आएँगे’
  rationale: דרש इन संभावित भावों को समेट सकता है, पर किसी एक धार्मिक क्रिया को निश्चित करना मूल की अर्थ-व्याप्ति को संकीर्ण कर देगा।
- issue: ‘उसका विश्राम-स्थान महिमा होगा’
  choice: विधेय संज्ञा ‘महिमा’ को अक्षुण्ण रखा गया
  alternative: ‘उसका विश्राम-स्थान महिमामय होगा’
  rationale: मूल पाठ ‘महिमा’ कहता है, केवल ‘महिमामय’ नहीं; संज्ञात्मक रूपक की धर्मवैचारिक और काव्यात्मक तीव्रता को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय शैली अपनाई गई है। ‘यिशै’ प्रचलित हिन्दी बाइबलीय नाम-रूप है। ‘जड़’ के व्याकरणिक स्त्रीलिंग के कारण ‘खड़ी होगी’ आया है, जबकि आगे ‘उसकी’ उस व्यक्तिरूप जड़ के साथ स्वाभाविक सम्बन्ध रखता है।
