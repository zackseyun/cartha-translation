  text: וְ/נָחָ֥ה עָלָ֖י/ו ר֣וּחַ יְהוָ֑ה ר֧וּחַ חָכְמָ֣ה וּ/בִינָ֗ה ר֤וּחַ עֵצָה֙ וּ/גְבוּרָ֔ה ר֥וּחַ דַּ֖עַת וְ/יִרְאַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/002.yaml
  text: 'And the Spirit of Yahweh will rest on him: a spirit of wisdom and understanding[a], a spirit of counsel and might[c][b], a spirit of knowledge and the fear of Yahweh.'
translation:
  language: hi
  text: 'और याहवे[c] की आत्मा उस पर ठहरी रहेगी: बुद्धि और समझ की आत्मा[a], परामर्श और सामर्थ्य की आत्मा, ज्ञान और याहवे के भय[b] की आत्मा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“याहवे की आत्मा” कहने के बाद इब्रानी में “आत्मा” शब्द तीन बार दोहराया गया है। इससे उस एक आत्मा के गुणों या कार्यों पर बल पड़ता है: बुद्धि और समझ, परामर्श और सामर्थ्य, तथा ज्ञान और याहवे का भय।'
    reason: lexical_alternative
  - marker: b
    text: “याहवे का भय” का अनुवाद “याहवे के प्रति श्रद्धा” भी हो सकता है; इब्रानी अभिव्यक्ति में श्रद्धापूर्ण विस्मय शामिल है, केवल आतंक नहीं।
    reason: lexical_alternative
  - marker: c
    text: “याहवे” इब्रानी में लिखे परमेश्वर के व्यक्तिगत नाम YHWH का रूप है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָחָה
  choice: ठहरा रहेगा
  rationale: नוח यहाँ आकर टिकने और बने रहने का भाव देता है। भविष्यसूचक संदर्भ में “ठहरा रहेगा” स्थायी उपस्थिति का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָלָיו
  choice: उस पर
  rationale: עַל के साथ पुरुषवाचक प्रत्यय का सीधा और स्वाभाविक हिन्दी रूप “उस पर” है।
- source_word: רוּחַ יְהוָה
  choice: याहवे का आत्मा
  rationale: इस राजकीय-अभिषेक के संदर्भ में רוּחַ परमेश्वर के आत्मा को सूचित करता है, केवल हवा या मानवीय मनोभाव को नहीं। יְהוָה को उसके व्यक्तिगत नाम “याहवे” से व्यक्त किया गया है।
- source_word: רוּחַ חָכְמָה וּבִינָה
  choice: बुद्धि और समझ का आत्मा
  rationale: חָכְמָה के लिए “बुद्धि” और בִינָה के लिए “समझ” उनके सामान्य अर्थ और काव्यात्मक युग्म को बनाए रखते हैं। רוּחַ की पुनरावृत्ति भी सुरक्षित रखी गई है।
- source_word: רוּחַ עֵצָה וּגְבוּרָה
  choice: परामर्श और सामर्थ्य का आत्मा
  rationale: עֵצָה आदर्श राजा के संदर्भ में विवेकपूर्ण परामर्श को और גְבוּרָה शक्ति अथवा पराक्रम को दर्शाता है। “सामर्थ्य” व्यापक अर्थ और गरिमापूर्ण शैली दोनों बनाए रखता है।
- source_word: רוּחַ דַּעַת וְיִרְאַת יְהוָה
  choice: ज्ञान और याहवे के भय का आत्मा
  rationale: דַּעַת का सीधा रूप “ज्ञान” है। יִרְאַת יְהוָה के लिए “याहवे का भय” मूल अभिव्यक्ति की शक्ति और उसकी वाचा-संबंधी तथा ज्ञान-साहित्यिक गहराई को सुरक्षित रखता है।
theological_decisions:
- issue: क्या बार-बार आया רוּחַ अलग-अलग आत्माओं को दर्शाता है या याहवे के एक आत्मा के गुणों और कार्यों को
  choice: याहवे के एक आत्मा का वर्णन करने वाले समानाधिकरण पदबंध
  alternative: अलग-अलग आत्मिक वरदानों या सात आत्माओं की गणना
  rationale: इब्रानी वाक्य-विन्यास पहले “याहवे का आत्मा” कहता है और फिर तीन बार רוּחַ वाले पदबंधों से उसका वर्णन करता है। अनुवाद पुनरावृत्ति बनाए रखता है, पर पाठ से आगे जाकर कोई व्यवस्थित सिद्धांत आरोपित नहीं करता।
- issue: יִרְאַת יְהוָה का अर्थ
  choice: याहवे का भय
  alternative: याहवे के प्रति श्रद्धा
  rationale: “भय” मूल शब्द की तीव्रता और बाइबिलीय अभिव्यक्ति को बनाए रखता है; पाद-टिप्पणी स्पष्ट करती है कि इसमें श्रद्धापूर्ण विस्मय भी शामिल है और इसका अर्थ केवल आतंक नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर पदबंध और “आत्मा” की तीनfold पुनरावृत्ति इब्रानी काव्य-रचना के अनुरूप सुरक्षित हैं। “ठहरा रहेगा” स्थायी उपस्थिति का भाव देता है, जबकि “परामर्श” और “सामर्थ्य” आदर्श राजत्व के संदर्भ के अनुकूल हैं।
