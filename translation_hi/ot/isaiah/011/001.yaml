base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/001.yaml
  text: Then a shoot will come out from the stump of Jesse[d][c][b][a], and a branch from his roots will bear fruit.
translation:
  language: hi
  text: तब[a] यिशै के ठूँठ से एक कोंपल[b] निकलेगी, और उसकी[d] जड़ों से एक शाखा[c] फल लाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और यिशै के ठूँठ से एक कोंपल निकलेगी।” इब्रानी संयोजक का अनुवाद केवल “और” भी हो सकता है; “तब” पिछले न्याय से नई आशा की ओर प्रसंग की गति को व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अंकुर” अथवा “नई टहनी।”
    reason: lexical_alternative
  - marker: c
    text: या, “अंकुर।” कुछ पाठक इस बिंब में मसीही महत्व देखते हैं, पर मुख्य पाठ में इसका सामान्य वनस्पति-संबंधी अर्थ रखा गया है।
    reason: lexical_alternative
  - marker: d
    text: इब्रानी में, “उसकी जड़ों से”; वहाँ प्रत्यय पुल्लिंग एकवचन है। हिन्दी “उसकी” पूर्ववर्ती का लिंग प्रकट नहीं करती। कुछ अनुवाद वृक्ष-बिंब को सहज बनाने के लिए “उस ठूँठ की जड़ों से” कहते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: तब ... निकलेगी
  rationale: יָצָא का मूल अर्थ ‘निकलना’ है। पूर्ववर्ती न्याय के बाद आशा की ओर बढ़ते प्रसंग को व्यक्त करने के लिए וְ को मुख्य पाठ में ‘तब’ दिया गया है; साधारण ‘और’ की संभावना पादटिप्पणी में रखी गई है।
- source_word: חֹטֶר
  choice: कोंपल
  rationale: यह शब्द कटे हुए तने से निकलने वाली नई बढ़त को दर्शाता है। आधुनिक हिन्दी में ‘कोंपल’ वनस्पति-बिंब को स्वाभाविक और स्पष्ट रखता है।
- source_word: מִגֵּזַע
  choice: ठूँठ से
  rationale: גֵּזַע यहाँ कटे हुए पेड़ के बचे हुए तने या ठूँठ को सूचित करता है। ‘ठूँठ’ न्याय और पुनरुत्थान के बिंब को सबसे स्पष्ट रूप से व्यक्त करता है।
- source_word: יִשָׁי
  choice: यिशै
  rationale: इब्रानी व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וְנֵצֶר
  choice: और ... एक शाखा
  rationale: נֵצֶר नई बढ़त, अंकुर या शाखा को दर्शाता है। ‘शाखा’ पहले पदांश की ‘कोंपल’ से काव्यात्मक भिन्नता बनाए रखती है और किसी धर्मवैज्ञानिक उपाधि को मुख्य पाठ में आरोपित नहीं करती।
- source_word: מִשָּׁרָשָׁיו
  choice: उसकी जड़ों से
  rationale: इब्रानी में तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय है। ‘उसकी’ उस व्याकरणिक संबंध को बनाए रखता है और यिशै को वंशगत स्रोत के रूप में वृक्ष-बिंब से जोड़ता है।
- source_word: יִפְרֶה
  choice: फल लाएगी
  rationale: פרה का अर्थ फलवन्त होना या फल लाना है। ‘फल लाएगी’ पौधे के बिंब को पूर्ण करता है और केवल बढ़ने के बजाय उत्पादक जीवन को व्यक्त करता है।
theological_decisions:
- issue: वनस्पति-बिंब का मसीही आशय
  choice: मुख्य पाठ में सामान्य वनस्पति और राजवंशीय बिंब रखा गया है; ‘शाखा’ को विशेष उपाधि के रूप में चिह्नित नहीं किया गया।
  alternative: ‘शाखा’ को विशिष्ट मसीही उपाधि के रूप में उभारना।
  rationale: पद स्वयं यिशै के वंश से निकलने वाली नई बढ़त का बिंब देता है। उसका मसीही महत्व व्यापक संदर्भ से उभर सकता है, पर अनुवाद में उसे अतिरिक्त रूप से आरोपित नहीं किया गया।
- issue: מִשָּׁרָשָׁיו में पुल्लिंग एकवचन प्रत्यय
  choice: ‘उसकी जड़ों’ द्वारा स्रोत-पाठ का पुल्लिंग संबंध सुरक्षित रखा गया।
  alternative: वनस्पति-बिंब को अधिक सपाट बनाते हुए ‘उस ठूँठ की जड़ों’ कहना।
  rationale: इब्रानी प्रत्यय पुल्लिंग एकवचन है और यिशै/वंशगत स्रोत से संबंध बनाए रखता है। हिन्दी ‘उसकी’ स्वाभाविक रहते हुए इस संबंध को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। ‘ठूँठ’, ‘कोंपल’, ‘जड़ें’ और ‘फल लाएगी’ से मूल वनस्पति-बिंब स्पष्ट रहता है। पादटिप्पणी-चिह्न संबंधित शब्दों के ठीक बाद दिए गए हैं।
