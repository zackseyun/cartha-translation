base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/004.yaml
  text: but he will judge the poor with righteousness[a], and decide with equity for the humble of the earth; he will strike the earth with the rod of his mouth[e][d][c][b], and with the breath of his lips he will put the wicked to death.
translation:
  language: hi
  text: 'परन्तु[a] वह गरीबों का न्याय धार्मिकता[b] से करेगा,

    और पृथ्वी के दीनों[c] के लिए निष्पक्ष निर्णय करेगा;

    वह अपने मुँह की छड़ी से पृथ्वी[d] को मारेगा,

    और अपने होंठों की साँस से दुष्ट[e] को मार डालेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘परन्तु’ के स्थान पर ‘और’ भी अनुवाद किया जा सकता है। ‘परन्तु’ पिछले पद से विरोध दिखाता है: वह केवल दिखाई देने वाली बातों के आधार पर न्याय नहीं करता।'
    reason: lexical_alternative
  - marker: b
    text: या ‘न्यायपूर्वक’।
    reason: lexical_alternative
  - marker: c
    text: या ‘देश के नम्र लोगों’। ‘दीन’ का अर्थ नम्र या पीड़ित भी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: ‘पृथ्वी’ का अनुवाद ‘देश’ या ‘भूमि’ भी हो सकता है।
    reason: lexical_alternative
  - marker: e
    text: या ‘उस दुष्ट व्यक्ति’। इब्रानी में शब्द एकवचन है; वह दुष्ट लोगों का प्रतिनिधिक एकवचन या किसी एक व्यक्ति का संकेत हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁפַט
  choice: परन्तु वह ... न्याय ... करेगा
  rationale: क्रिया का न्यायिक अर्थ सुरक्षित रखा गया है। आरम्भिक וְ को पिछले पद के विपरीत भाव के कारण ‘परन्तु’ किया गया है, जबकि साधारण ‘और’ भी सम्भव है।
- source_word: בְּצֶדֶק
  choice: धार्मिकता से
  rationale: צֶדֶק में नैतिक खराई और न्याय—दोनों भाव हैं। ‘धार्मिकता’ इस व्यापकता को बनाए रखती है; ‘न्यायपूर्वक’ सम्भव विकल्प है।
- source_word: דַּלִּים
  choice: गरीबों
  rationale: דַּל सामाजिक और आर्थिक रूप से गरीब, कमजोर या असहाय व्यक्ति को सूचित कर सकता है। ‘गरीबों’ आधुनिक हिन्दी में सहज और प्रसंगानुकूल है।
- source_word: וְהוֹכִיחַ
  choice: फैसला करेगा
  rationale: न्यायिक प्रसंग में יכח का हिफ़ईल रूप निर्णय देने या विवाद निपटाने का अर्थ रखता है, केवल डाँटने का नहीं।
- source_word: בְּמִישׁוֹר
  choice: निष्पक्षता से
  rationale: מִישׁוֹר की सीधाई और समता की छवि न्यायिक प्रसंग में निष्पक्ष व्यवहार को व्यक्त करती है।
- source_word: לְעַנְוֵי אָרֶץ
  choice: पृथ्वी के दीन लोगों के लिए
  rationale: עָנָו नम्र, दीन या पीड़ित का अर्थ दे सकता है। ‘दीन’ नैतिक और सामाजिक दोनों रंगों को खुला रखता है; לְ का हितार्थक भाव ‘के लिए’ से व्यक्त हुआ है।
- source_word: וְהִכָּה אֶרֶץ
  choice: पृथ्वी पर प्रहार करेगा
  rationale: נכה की प्रहार करने की शक्ति बनी रहती है। אֶרֶץ के व्यापक सम्भव अर्थ को मुख्य पाठ में ‘पृथ्वी’ से व्यक्त किया गया है।
- source_word: בְּשֵׁבֶט פִּיו
  choice: अपने मुँह की छड़ी से
  rationale: שֵׁבֶט के ‘छड़ी’ अर्थ से वाणी को न्याय के प्रभावशाली साधन के रूप में दिखाने वाला मूल रूपक सुरक्षित रहता है।
- source_word: וּבְרוּחַ שְׂפָתָיו
  choice: अपने होंठों की साँस से
  rationale: רוּחַ के साँस, वायु और आत्मा अर्थों में से मुँह और होंठों के समानान्तर प्रयोग के कारण ‘साँस’ सबसे प्रत्यक्ष है।
- source_word: יָמִית רָשָׁע
  choice: दुष्ट को मार डालेगा
  rationale: מות के हिफ़ईल का कारणवाचक अर्थ स्पष्ट किया गया है। एकवचन ‘दुष्ट’ प्रतिनिधिक या किसी एक विशेष व्यक्ति—दोनों रूपों में समझा जा सकता है।
theological_decisions:
- issue: אֶרֶץ का विस्तार
  choice: पृथ्वी
  alternative: देश/भूमि
  rationale: अध्याय का व्यापक राजकीय और भविष्यपरक क्षितिज ‘पृथ्वी’ का समर्थन करता है, पर इब्रानी शब्द किसी विशेष देश या भूमि को भी सूचित कर सकता है; इस विकल्प को पादटिप्पणी में रखा गया है।
- issue: רָשָׁע के एकवचन का आशय
  choice: दुष्ट—प्रतिनिधिक या सामान्य एकवचन
  alternative: वह दुष्ट व्यक्ति—एक विशिष्ट व्यक्ति
  rationale: इब्रानी एकवचन किसी पूरे वर्ग का प्रतिनिधित्व कर सकता है, लेकिन विशिष्ट व्यक्ति का पाठ भी व्याकरणतः सम्भव है। मुख्य पाठ इस तनाव को हिन्दी एकवचन द्वारा बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर काव्यात्मक और राजकीय गरिमा बनाए रखती है। ‘मुँह की छड़ी’ और ‘होंठों की साँस’ जैसे मूल रूपक जानबूझकर सुरक्षित रखे गए हैं। ‘गरीब’ और ‘दीन’ में भेद रखा गया है ताकि דַּל और עָנָו की अलग-अलग अर्थछटाएँ मिटें नहीं।
