source:
  edition: WLC
  text: לָ/בוֹא֙ בְּ/נִקְר֣וֹת הַ/צֻּרִ֔ים וּ/בִ/סְעִפֵ֖י הַ/סְּלָעִ֑ים מִ/פְּנֵ֞י פַּ֤חַד יְהוָה֙ וּ/מֵ/הֲדַ֣ר גְּאוֹנ֔/וֹ בְּ/קוּמ֖/וֹ לַ/עֲרֹ֥ץ הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/021.yaml
  text: to enter the caverns of the rocks and the clefts of the crags[a], from before the terror of Yahweh and from the splendor of his majesty[b], when he rises to terrify the earth.
translation:
  language: hi
  text: चट्टानों की गुफाओं और शिलाओं की दरारों में जाने के लिए[a], याहवे के भय और उसके प्रताप के वैभव से दूर, जब वह पृथ्वी को आतंकित करने के लिए उठेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘चट्टानों के खोखले स्थानों और शिलाओं की फटी हुई जगहों में।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘जब वह पृथ्वी को कंपाने के लिए उठेगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: לָבוֹא
  choice: जाने के लिए
  rationale: ל־ के साथ यह क्रियार्थक संज्ञा पिछले पद की क्रिया का प्रयोजन बताती है। हिंदी में ‘जाने के लिए’ स्वाभाविक है और चट्टानी आश्रयों में प्रवेश करने का भाव देता है।
- source_word: נִקְרוֹת הַצֻּרִים
  choice: चट्टानों की गुफाओं
  rationale: נִקְרוֹת चट्टान में बनी खोखली जगहों को दर्शाता है; ‘गुफाओं’ से छिपने योग्य प्राकृतिक चट्टानी खोल का चित्र स्पष्ट होता है।
- source_word: סְעִפֵי הַסְּלָעִים
  choice: शिलाओं की दरारों
  rationale: भूगर्भीय संदर्भ में סְעִפֵי विभाजनों या फटी हुई जगहों का बोध कराता है। ‘दरारों’ से यह चित्र सहज हिंदी में बना रहता है।
- source_word: מִפְּנֵי פַּחַד יְהוָה
  choice: याहवे के आतंक से बचने के लिए
  rationale: מִפְּנֵי में किसी की उपस्थिति से दूर होने और उसके कारण भागने—दोनों का भाव है। ‘से बचने के लिए’ इस प्रसंग में उस पलायन को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिवाचक ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिंदी लिप्यंतरण में रखा गया है।
- source_word: הֲדַר גְּאוֹנוֹ
  choice: उसके प्रताप का वैभव
  rationale: הֲדַר के वैभव और גָּאוֹן के ऊँचे प्रताप—दोनों अर्थ-तत्त्वों को बनाए रखने के लिए यह पदबंध चुना गया है। विभक्ति के कारण मुख्य पाठ में ‘उसके प्रताप के वैभव से’ आया है।
- source_word: בְּקוּמוֹ
  choice: जब वह ... उठेगा
  rationale: בְּ के साथ क्रियार्थक संज्ञा यहाँ समय सूचित करती है; हिंदी का ‘जब’ उपवाक्य इसका स्वाभाविक रूप है।
- source_word: לַעֲרֹץ הָאָרֶץ
  choice: पृथ्वी को आतंकित करने को
  rationale: क्रिया ערץ भय और आतंक उत्पन्न करने का भाव रखती है। ‘आतंकित करने’ को मुख्य पाठ में रखा गया है, जबकि ‘कंपाने’ की संभावित छवि पादटिप्पणी में सुरक्षित है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: व्यापक मानवीय दीनता के संदर्भ में ‘पृथ्वी’ उपयुक्त है, यद्यपि शब्द का अर्थ कुछ संदर्भों में ‘देश’ भी हो सकता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिवाचक चतुरक्षरीय नाम है; उसका लिप्यंतरण नाम और उपाधि के बीच का भेद बनाए रखता है।
- issue: הָאָרֶץ का दायरा
  choice: पृथ्वी
  alternative: देश
  rationale: यशायाह 2 का निकट संदर्भ समस्त मानवजाति के झुकाए जाने का व्यापक चित्र देता है, इसलिए ‘पृथ्वी’ चुना गया; फिर भी इब्रानी शब्द अपने आप में दोनों अर्थ ले सकता है।
- issue: לַעֲרֹץ में आतंक या कंपन का भाव
  choice: आतंकित करने को
  alternative: कंपाने के लिए
  rationale: मूल क्रिया भय उत्पन्न करने पर बल दे सकती है, पर उससे कांपने की परिणति भी व्यक्त हो सकती है। मुख्य पाठ और पादटिप्पणी दोनों संभावनाओं को खुला रखते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। पद मूल में पिछले वाक्य से जुड़ा प्रयोजनसूचक खंड है, इसलिए हिंदी में भी ‘जाने के लिए’ से उसका आश्रित स्वरूप बनाए रखा गया है। समानांतर चट्टानी बिंबों में हल्का lexical भेद सुरक्षित रखा गया है।
