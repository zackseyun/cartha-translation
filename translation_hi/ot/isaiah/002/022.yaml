base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/022.yaml
  text: Stop trusting in man, whose breath is in his nostrils; for what is he really worth?
translation:
  language: hi
  text: मनुष्य पर भरोसा करना छोड़ दो, जिसकी साँस उसके नथनों में है; आखिर उसका मूल्य ही क्या है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חִדְלוּ לָכֶם מִן־הָאָדָם
  choice: मनुष्य पर भरोसा करना छोड़ दो
  rationale: חִדְלוּ מִן का मूल भाव किसी से विरत होने या उसका सहारा छोड़ने का है। प्रसंग में मानवीय भरोसे से हटने की चेतावनी है; לָכֶם को स्वाभाविक हिन्दी में अलग से व्यक्त करना आवश्यक नहीं।
- source_word: נְשָׁמָה בְּאַפּוֹ
  choice: जिसकी साँस उसके नथनों में है
  rationale: यह निकट शाब्दिक बिंब मनुष्य के क्षणभंगुर और निर्भर जीवन को बनाए रखता है।
- source_word: כִּי בַמֶּה נֶחְשָׁב הוּא
  choice: आखिर उसका मूल्य ही क्या है?
  rationale: प्रश्न मनुष्य के अंतिम महत्त्व या भरोसेमंद हैसियत को चुनौती देता है। 'आखिर' כִּי की यहाँ प्रश्न को बल देने वाली भूमिका को स्वाभाविक हिन्दी में दर्शाता है।
theological_decisions:
- issue: मनुष्य के मूल्य के विषय में प्रश्न
  choice: आखिर उसका मूल्य ही क्या है?
  alternative: उसकी क्या गिनती है?
  rationale: यह कथन मनुष्य की सृष्टिगत गरिमा का पूर्ण निषेध नहीं, बल्कि परम भरोसे के आधार के रूप में उसकी सीमित और क्षणभंगुर हैसियत पर प्रश्न है। अनुवाद मूल की तीखी प्रश्नात्मकता बनाए रखता है और कोई अतिरिक्त धर्मसैद्धांतिक स्पष्टीकरण पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। 'नथनों' का ठोस शारीरिक बिंब मूल इब्रानी के अनुसार रखा गया है; वाक्य की चेतावनी और अलंकारिक प्रश्न दोनों संक्षिप्त रखे गए हैं।
