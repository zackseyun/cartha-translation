id: ISA.2.12
reference: Isaiah 2:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י י֞וֹם לַ/יהוָ֧ה צְבָא֛וֹת עַ֥ל כָּל גֵּאֶ֖ה וָ/רָ֑ם וְ/עַ֖ל כָּל נִשָּׂ֥א וְ/שָׁפֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/012.yaml
  text: For Yahweh of Armies has a day against all that is proud and lofty[a], and against all that is lifted up—and it shall be brought low.
translation:
  language: hi
  text: क्योंकि सेनाओं के यहोवा का एक दिन आएगा—हर उस चीज़ के विरुद्ध जो घमंडी और ऊँची है, और हर उस चीज़ के विरुद्ध जो ऊँची उठाई गई है; उसे नीचा किया जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार बताने वाला संयोजक है; ‘क्योंकि’ उसके कारणसूचक संबंध को स्पष्ट रखता है।
- source_word: יוֹם לַיהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा का एक दिन आएगा
  rationale: इब्रानी नामवाचक वाक्यांश का आशय यहोवा के ठहराए हुए न्याय-दिन से है। ‘एक दिन आएगा’ आधुनिक हिन्दी में स्वाभाविक रूप से उसकी भावी निश्चितता व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं के
  rationale: यह शब्द यहोवा के अधीन सैन्य या बहुसंख्यक दलों का बोध कराता है; ‘सेनाओं’ से इसका अर्थ आधुनिक पाठक के लिए स्पष्ट रहता है।
- source_word: עַל
  choice: के विरुद्ध
  rationale: न्याय के इस प्रसंग में संबंध विरोधी है, इसलिए ‘के विरुद्ध’ उपयुक्त है।
- source_word: גֵּאֶה וָרָם
  choice: घमंडी और ऊँचे
  rationale: यह जोड़ी अभिमान और ऊँचाई की संयुक्त छवि रखती है; ‘ऊँचे’ रूपक को बनाए रखता है और ‘घमंडी’ उसका नैतिक आशय स्पष्ट करता है।
- source_word: נִשָּׂא
  choice: जो ऊँचा उठाया गया है
  rationale: निष्क्रिय रूप और ऊँचाई के मूल रूपक, दोनों को सुरक्षित रखा गया है।
- source_word: וְשָׁפֵל
  choice: वह नीचा किया जाएगा
  rationale: रूप को न्याय के परिणाम बताने वाली क्रिया के रूप में पढ़ा गया है। यह पहले के ‘ऊँचा उठाया गया’ के साथ स्पष्ट विरोध बनाता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में विशिष्ट ईश्वरीय नाम है; ‘यहोवा’ उसे सामान्य उपाधि में बदले बिना पहचानने योग्य हिन्दी रूप में प्रस्तुत करता है।
- issue: יהוה צבאות की उपाधि
  choice: सेनाओं के यहोवा
  alternative: सेनाओं का प्रभु
  rationale: मुख्य पाठ ईश्वरीय नाम और צבאות के सैन्य भाव दोनों को प्रत्यक्ष रखता है; पारंपरिक उपाधि को पादटिप्पणी में दिया गया है।
- issue: וְשָׁפֵל का व्याकरणिक बल
  choice: भावी निष्क्रिय परिणाम—‘वह नीचा किया जाएगा’
  alternative: विशेषण—‘और नीचा’
  rationale: रूप विशेषण या क्रियात्मक अर्थ की गुंजाइश रख सकता है, पर समानांतर रचना और न्याय का प्रसंग ऊँचे किए गए के नीचा किए जाने को अधिक संगत बनाते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ऊँचा/नीचा का काव्यात्मक विरोध सुरक्षित है; दीर्घ वाक्य को डैश और अर्धविराम से स्पष्ट किया गया है।
