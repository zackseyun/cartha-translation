  text: וְ/שָׁפַט֙ בֵּ֣ין הַ/גּוֹיִ֔ם וְ/הוֹכִ֖יחַ לְ/עַמִּ֣ים רַבִּ֑ים וְ/כִתְּת֨וּ חַרְבוֹתָ֜/ם לְ/אִתִּ֗ים וַ/חֲנִיתֽוֹתֵי/הֶם֙ לְ/מַזְמֵר֔וֹת לֹא יִשָּׂ֨א ג֤וֹי אֶל גּוֹי֙ חֶ֔רֶב וְ/לֹא יִלְמְד֥וּ ע֖וֹד מִלְחָמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/004.yaml
  text: And he will judge between the nations and arbitrate for many peoples[a]; and they will beat their swords into plowshares and their spears into pruning hooks. Nation will not lift up sword against nation[b], and they will not learn war anymore.
translation:
  language: hi
  text: और वह जातियों के बीच न्याय करेगा और बहुत-से लोगों के विषय में निर्णय करेगा[a]। तब वे अपनी तलवारों को पीटकर हल के फाल और अपने भालों को छँटाई के हँसिए बना लेंगे। एक जाति दूसरी जाति के विरुद्ध तलवार नहीं उठाएगी, और वे फिर कभी युद्ध नहीं सीखेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहुत-से लोगों को सुधारेगा” अथवा “बहुत-से लोगों के लिए मध्यस्थता करेगा।” इब्रानी क्रिया न्यायिक निर्णय और सुधारात्मक डाँट—दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “वे फिर कभी युद्ध का प्रशिक्षण नहीं लेंगे।” इब्रानी में शाब्दिक रूप से “वे फिर युद्ध नहीं सीखेंगे” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפַט בֵּין הַגּוֹיִם
  choice: वह जातियों के बीच न्याय करेगा
  rationale: שׁפט का न्यायिक अर्थ और בֵּין का ‘के बीच’ भाव सुरक्षित रखा गया है; क्रिया में निहित कर्ता को केवल ‘वह’ रखा गया है।
- source_word: וְהוֹכִיחַ לְעַמִּים רַבִּים
  choice: बहुत-से लोगों के लिए निर्णय करेगा
  rationale: Hiphil יכח यहाँ समानांतर न्यायिक संदर्भ में निर्णय करने का भाव देता है। ‘लोगों’ से עַמִּים और ‘जातियों’ से גּוֹיִם का आंशिक भेद बना रहता है; पद में ‘विवाद’ स्पष्ट न होने के कारण उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: וְכִתְּתוּ חַרְבוֹתָם לְאִתִּים
  choice: वे अपनी तलवारें पीटकर हल के फाल ... बना लेंगे
  rationale: כתת का पीटकर नया आकार देने का चित्र तथा אִתִּים का कृषि-औजार संबंधी अर्थ स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: וַחֲנִיתוֹתֵיהֶם לְמַזְמֵרוֹת
  choice: अपने भालों को हँसिए बना लेंगे
  rationale: חֲנִיתוֹת का ‘भाले’ और מַזְמֵרוֹת का छँटाई/काटने वाले कृषि-औजार का अर्थ है; सामान्य आधुनिक हिन्दी में ‘हँसिए’ सहज और चित्रात्मक है।
- source_word: לֹא יִשָּׂא גוֹי אֶל גּוֹי חֶרֶב
  choice: एक जाति दूसरी जाति के विरुद्ध तलवार नहीं उठाएगी
  rationale: נשא חרב की शत्रुतापूर्ण ढंग से तलवार उठाने की इब्रानी छवि को स्पष्ट, स्वाभाविक हिन्दी में रखा गया है।
- source_word: וְלֹא יִלְמְדוּ עוֹד מִלְחָמָה
  choice: वे फिर कभी युद्ध करना नहीं सीखेंगे
  rationale: ‘युद्ध सीखना’ मूल अभिव्यक्ति को सुरक्षित रखता है, जबकि ‘युद्ध करना’ जोड़ने से आधुनिक हिन्दी में आशय सहज बनता है; इसका भाव युद्ध का प्रशिक्षण लेना भी हो सकता है।
theological_decisions:
- issue: एकवचन कर्ता की पहचान
  choice: केवल ‘वह’ रखा गया है
  alternative: ‘यहोवा’ या ‘प्रभु’ को स्पष्ट रूप से जोड़ना
  rationale: इब्रानी क्रियाएँ तीसरे पुरुष एकवचन में हैं, पर इस पद में कर्ता का नाम नहीं दिया गया। निकट संदर्भ संकेत देता है, फिर भी मुख्य पाठ मूल की संदर्भगत अस्पष्टता बनाए रखता है।
- issue: וְהוֹכִיחַ की न्यायिक अथवा सुधारात्मक शक्ति
  choice: ‘निर्णय करेगा’
  alternative: ‘डाँटेगा’, ‘सुधारेगा’ या ‘मध्यस्थता करेगा’
  rationale: שׁפט के समानांतर और उसके बाद आने वाली अंतरराष्ट्रीय शांति के कारण न्यायिक भाव प्रमुख है, पर सुधारात्मक अर्थ की संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। हथियारों से कृषि-औजारों में परिवर्तन की काव्यात्मक समानांतरता बनाए रखी गई है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
