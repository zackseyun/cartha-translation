  text: בֵּ֖ית יַעֲקֹ֑ב לְכ֥וּ וְ/נֵלְכָ֖ה בְּ/א֥וֹר יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/005.yaml
  text: House of Jacob[a], come[b], and let us walk in the light of Yahweh.
translation:
  language: hi
  text: हे याकूब के घराने[a], आओ[b], हम याहवे के प्रकाश में चलें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘याकूब का घर’; यह याकूब के वंशजों को किया गया सीधा संबोधन है।
    reason: lexical_alternative
  - marker: b
    text: 'या ‘चलो’; इब्रानी में बहुवचन आज्ञार्थक के बाद साझा आग्रह व्यक्त करने वाला रूप है: ‘चलो, हम ... चलें।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית יַעֲקֹב
  choice: हे याकूब के घराने
  rationale: यह रचना याकूब के वंशजों को सीधे संबोधित करती है। ‘घराना’ इब्रानी सामूहिक वंशगत अर्थ और भविष्यद्वक्ताओं की गरिमा बनाए रखता है; ‘हे’ संबोधन को हिन्दी में स्पष्ट और स्वाभाविक बनाता है।
- source_word: לְכוּ
  choice: आओ
  rationale: הלך का बहुवचन आज्ञार्थक रूप यहाँ अगले सहभावार्थक क्रियापद के साथ साझा कार्य के आह्वान के रूप में प्रयुक्त है। इसलिए ‘आओ’ आधुनिक हिन्दी में स्वाभाविक है, यद्यपि शाब्दिक रूप से ‘चलो’ भी संभव है।
- source_word: וְנֵלְכָה
  choice: हम ... चलें
  rationale: प्रथम पुरुष बहुवचन cohortative साझा आग्रह या संकल्प व्यक्त करता है। ‘हम चलें’ इस भाव को बनाए रखता है और ‘चलना’ रूपक को ‘जीवन बिताना’ जैसे व्याख्यात्मक अनुवाद से नहीं बदलता।
- source_word: בְּאוֹר
  choice: प्रकाश में
  rationale: בְ यहाँ क्षेत्र या साधन—दोनों का संकेत दे सकता है। ‘प्रकाश में’ इस स्वाभाविक बाइबलीय रूपक को सुरक्षित रखते हुए मुख्यतः उस क्षेत्र में जीवन-चाल का भाव देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ नाम को सुरक्षित रखता है, जबकि ‘प्रभु’ उसे उपाधि से बदल देता और ‘यहोवा’ एक वैकल्पिक पारंपरिक रूप है।
- issue: ‘प्रकाश में’ का अर्थ
  choice: रूपक को खुला रखना
  alternative: याहवे के मार्गदर्शन के अनुसार जीवन बिताएँ
  rationale: मूल रूपक दिव्य प्रकाश, मार्गदर्शन और जीवन-चाल के परस्पर जुड़े भावों को समेटता है। मुख्य पाठ में व्याख्यात्मक विस्तार न करके इस अर्थ-बहुलता को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भविष्यद्वाणी-संबंधी आह्वान। ‘हे’ सीधे संबोधन को स्पष्ट करता है; ‘घराना’, ‘प्रकाश’ और ‘चलें’ मूल के वंशगत और रूपकात्मक स्वर को सहज हिन्दी में बनाए रखते हैं।
