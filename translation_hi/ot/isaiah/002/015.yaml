  text: और हर ऊँची मीनार के विरुद्ध[a], और हर किलेबंद दीवार के विरुद्ध—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और हर ऊँची मीनार पर, और हर किलेबंद दीवार पर।” इब्रानी संबंधबोधक शब्द का अधिक शाब्दिक अनुवाद “पर” हो सकता है, पर यहाँ संदर्भ में न्याय के साथ इनके विरुद्ध आने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: और ... के विरुद्ध
  rationale: संदर्भ में यह पद यहोवा के दिन के न्याय के लक्ष्यों की सूची को आगे बढ़ाता है; इसलिए स्थानसूचक शाब्दिक अर्थ ‘पर’ के बजाय विरोधात्मक भाव ‘के विरुद्ध’ स्वाभाविक और अर्थ-सटीक है।
- source_word: כָּל
  choice: हर
  rationale: एकवचन संज्ञाओं के साथ כָּל का वितरणात्मक अर्थ है; आधुनिक हिन्दी में ‘हर’ इसे सहजता से व्यक्त करता है।
- source_word: מִגְדָּל
  choice: मीनार
  rationale: यह शब्द किसी ऊँची बुर्जनुमा संरचना को सूचित करता है। ‘मीनार’ सामान्य हिन्दी पाठक के लिए स्पष्ट है और ‘पहरे की मीनार’ जैसी अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: גָּבֹהַ
  choice: ऊँची
  rationale: यह भौतिक ऊँचाई को सीधे व्यक्त करता है और अध्याय में मानवीय ऊँचाई/अभिमान की व्यापक प्रतिध्वनि को भी बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: חוֹמָה
  choice: दीवार
  rationale: यह मूल संज्ञा का सीधा और व्यापक हिन्दी समतुल्य है; इसकी रक्षात्मक विशेषता अगले विशेषण से स्पष्ट होती है।
- source_word: בְצוּרָה
  choice: किलेबंद
  rationale: यह ऐसी दीवार का भाव देता है जिसे सुरक्षा और रक्षा के लिए दृढ़ किया गया हो; आधुनिक हिन्दी में सैन्य-रक्षात्मक अर्थ स्पष्ट रहता है।
theological_decisions:
- issue: आसपास के संदर्भ से निहित ईश्वरीय न्याय की निरंतरता
  choice: עַל को ‘के विरुद्ध’ अनूदित किया गया है, जिससे सूची की वस्तुएँ न्याय के लक्ष्य के रूप में सामने आती हैं।
  alternative: अधिक शाब्दिक ‘पर’ रखा जा सकता है और विरोधात्मक भाव संदर्भ पर छोड़ा जा सकता है।
  rationale: यशायाह 2:12–16 यहोवा के दिन के सामने आने वाली ऊँची और सुरक्षित मानवीय वस्तुओं की काव्यात्मक सूची है। ‘के विरुद्ध’ संदर्भ में पहले से उपस्थित विरोधात्मक बल को स्पष्ट करता है, कोई नया धर्मवैज्ञानिक दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्यात्मक सूची। दोनों समानांतर पदबंधों में ‘के विरुद्ध’ दोहराकर इब्रानी संरचना और न्याय के विरोधात्मक बल को बनाए रखा गया है; अंतिम डैश अगले पदांश की ओर प्रवाह दर्शाता है।
