  text: וְֽ/הָלְכ֞וּ עַמִּ֣ים רַבִּ֗ים וְ/אָמְרוּ֙ לְכ֣וּ וְ/נַעֲלֶ֣ה אֶל הַר יְהוָ֗ה אֶל בֵּית֙ אֱלֹהֵ֣י יַעֲקֹ֔ב וְ/יֹרֵ֨/נוּ֙ מִ/דְּרָכָ֔י/ו וְ/נֵלְכָ֖ה בְּ/אֹרְחֹתָ֑י/ו כִּ֤י מִ/צִּיּוֹן֙ תֵּצֵ֣א תוֹרָ֔ה וּ/דְבַר יְהוָ֖ה מִ/ירוּשָׁלִָֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/003.yaml
  text: And many peoples will come and say[a], “Come, let us go up to the mountain of Yahweh, to the house of the God of Jacob, that he may teach us his ways and that we may walk in his paths.” For instruction will go out from Zion[b], and the word of Yahweh from Jerusalem.
translation:
  language: hi
  text: और बहुत-से जनसमूह आएँगे और कहेंगे[a], “आओ, हम याहवे के पर्वत पर, याकूब के परमेश्वर के भवन में चढ़ें, ताकि वह हमें अपने मार्ग सिखाए और हम उसके पथों पर चलें।” क्योंकि सिय्योन से शिक्षा[b] और यरूशलेम से याहवे का वचन निकलेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जाएँगे” अथवा “चलेंगे”; हिब्रू क्रिया का शाब्दिक अर्थ ‘जाना/चलना’ है, पर यहाँ वह जनसमूहों के सिय्योन की ओर बढ़ने का वर्णन करती है।
    reason: lexical_alternative
  - marker: b
    text: ‘शिक्षा’ के लिए हिब्रू शब्द तोराह है, जिसका अनुवाद ‘व्यवस्था’ या ‘उपदेश’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: आएँगे
  rationale: क्रिया का मूल अर्थ ‘चलना/जाना’ है, पर यहाँ जनसमूहों की गति सिय्योन की ओर है; हिन्दी में गंतव्य को केंद्र मानकर ‘आएँगे’ स्वाभाविक है और तीर्थयात्रा का भाव बना रहता है।
- source_word: עַמִּים רַבִּים
  choice: बहुत-से जनसमूह
  rationale: עַמִּים अनेक जातीय या राष्ट्रीय समुदायों को सूचित करता है। ‘जनसमूह’ बहुवचन सामुदायिक अर्थ को ‘राष्ट्रों’ की अपेक्षा कम राजनीतिक ढंग से व्यक्त करता है।
- source_word: לְכוּ וְנַעֲלֶה
  choice: आओ, हम ... चढ़ें
  rationale: यह सामूहिक यात्रा का आह्वान है। ‘चढ़ें’ यरूशलेम और पर्वत की ओर आरोहण का भौगोलिक तथा पारंपरिक भाव सुरक्षित रखता है।
- source_word: הַר יְהוָה
  choice: याहवे का पर्वत
  rationale: הַר का सीधा अर्थ ‘पर्वत’ है और יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ से व्यक्त किया गया है।
- source_word: בֵּית אֱלֹהֵי יַעֲקֹב
  choice: याकूब के परमेश्वर का भवन
  rationale: בַּיִת मूलतः ‘घर/भवन’ है। ‘भवन’ यहाँ मंदिर-संदर्भ में स्वाभाविक और गरिमापूर्ण है, जबकि मूल रूपक भी बना रहता है।
- source_word: וְיֹרֵנוּ מִדְּרָכָיו
  choice: ताकि वह हमें अपने मार्ग सिखाए
  rationale: हिब्रू में उद्देश्य/परिणाम का भाव है। מִן सहित वाक्यांश का स्वाभाविक हिन्दी अर्थ ‘अपने मार्ग सिखाए’ है; ‘अपने मार्गों में से सिखाए’ कृत्रिम और संभावित रूप से भ्रामक होता।
- source_word: וְנֵלְכָה בְּאֹרְחֹתָיו
  choice: और हम उसके पथों पर चलें
  rationale: ‘पथों पर चलना’ आचरण के हिब्रू रूपक को हिन्दी में स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: תּוֹרָה
  choice: शिक्षा
  rationale: תּוֹרָה का अर्थ केवल विधिक संहिता नहीं, बल्कि परमेश्वर की शिक्षा और निर्देशन भी है; इस सार्वभौमिक भविष्यवाणी में ‘शिक्षा’ व्यापक अर्थ सुरक्षित रखती है।
- source_word: תֵּצֵא
  choice: निकलेगी
  rationale: יָצָא का मूल अर्थ बाहर निकलना है। ‘निकलेगी’ सिय्योन से अन्य स्थानों की ओर शिक्षा के प्रसार को संक्षेप में व्यक्त करता है।
- source_word: וּדְבַר יְהוָה
  choice: याहवे का वचन
  rationale: ‘वचन’ भविष्यद्वाणी के स्थापित और गरिमापूर्ण प्रयोग को बनाए रखते हुए דָּבָר के संदेशात्मक अर्थ को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसे सामान्य उपाधि में बदले बिना प्रस्तुत करता है।
- issue: भविष्यद्वाणी के इस संदर्भ में תּוֹרָה का अर्थ
  choice: शिक्षा
  alternative: व्यवस्था; उपदेश
  rationale: यहाँ आशय सिय्योन से निकलने वाली व्यापक ईश्वरीय शिक्षा का है; ‘शिक्षा’ अर्थ को केवल कानून तक सीमित नहीं करती।
- issue: מִדְּרָכָיו में מִן की अभिव्यक्ति
  choice: अपने मार्ग सिखाए
  alternative: अपने मार्गों में से हमें सिखाए
  rationale: हिब्रू में מן उपस्थित है और संभवतः आंशिकता या स्रोत का भाव देता है, किंतु हिन्दी में उसका शब्दशः रूप अस्वाभाविक होगा। चुना गया पाठ मूल आशय रखता है और यह दावा नहीं करता कि परमेश्वर स्वयं मार्गों से शिक्षा पाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यद्वाणी की गरिमा बनाए रखने के लिए ‘पर्वत’, ‘भवन’, ‘पथ’ और ‘वचन’ जैसे परिचित बाइबलीय शब्द रखे गए हैं। वाक्य-रचना बोलचाल योग्य है और अनावश्यक संस्कृतनिष्ठता से बचती है।
