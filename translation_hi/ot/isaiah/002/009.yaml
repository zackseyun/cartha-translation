base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/009.yaml
  text: So man is bowed down[a], and each person is brought low; do not forgive them.
translation:
  language: hi
  text: इस प्रकार मनुष्य झुक गया है और हर व्यक्ति नीचा हो गया है; उन्हें क्षमा न कर।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें ऊपर न उठा।” इब्रानी क्रिया का अर्थ “उठाना, ढोना, सहना” और कुछ संदर्भों में “क्षमा करना” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשַּׁח
  choice: झुक गया है
  rationale: שׁחח का मूल भाव नीचे झुकना या दब जाना है। निकटवर्ती मूर्तिपूजा के संदर्भ में यह जानबूझकर झुकने और अपमानित होकर नीचे किए जाने—दोनों की छाया बनाए रखता है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ אָדָם समस्त मानव जाति के लिए सामान्य पद है; ‘मनुष्य’ काव्यात्मक समानांतरता और व्यापक अर्थ दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: וַיִּשְׁפַּל
  choice: नीचा हो गया है
  rationale: שׁפל का अर्थ नीचा होना या दीन किया जाना है। ‘नीचा हो गया है’ मूल की अवस्था और पहले खंड के साथ उसकी समानांतरता को सुरक्षित रखता है।
- source_word: אִישׁ
  choice: हर व्यक्ति
  rationale: אָדָם के समानांतर אִישׁ अलग-अलग व्यक्तियों पर बल देता है। ‘हर व्यक्ति’ इस वितरणात्मक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: וְאַל תִּשָּׂא לָהֶם
  choice: उन्हें क्षमा न कर
  rationale: נשא किसी व्यक्ति के संबंध में अपराध या दोष उठा लेने के अर्थ से ‘क्षमा करना’ व्यक्त कर सकता है। न्याय के इस संदर्भ में यही प्रमुख अर्थ है, जबकि ‘ऊपर उठाना’ एक वास्तविक वैकल्पिक अर्थ है और उसे पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: अंतिम खंड में נשא का अर्थ
  choice: परमेश्वर से लोगों को क्षमा न करने की विनती
  alternative: परमेश्वर से उन्हें ऊपर न उठाने की विनती
  rationale: मूर्तिपूजा और घमंड पर न्याय के संदर्भ में ‘क्षमा न कर’ वाक्य की कठोर अपील को स्पष्ट करता है। फिर भी נשא का मूल अर्थ ‘उठाना’ भी इस स्थान पर संभव है, इसलिए उस तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। दोनों समानांतर खंडों में ‘मनुष्य’ और ‘हर व्यक्ति’ का भेद सुरक्षित है; अंतिम निषेध सीधी प्रार्थनात्मक आज्ञा के रूप में प्रस्तुत है।
