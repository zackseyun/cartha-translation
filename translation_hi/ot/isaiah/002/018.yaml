- source_word: וְהָאֱלִילִים
  choice: और सारी मूर्तियाँ
  rationale: וְ को प्रसंगानुसार सरल संयोजक ‘और’ के रूप में रखा गया है। הָ निश्चितता दर्शाता है, और אֱלִילִים का स्वाभाविक आधुनिक हिन्दी समतुल्य ‘मूर्तियाँ’ है; शब्द में निहित निकम्मेपन या व्यर्थता का तिरस्कारपूर्ण भाव प्रसंग से प्रकट होता है। ‘सारी’ अगले क्रियाविशेषण के साथ मिलकर समस्त मूर्तियों के पूर्ण अंत पर बल देता है।
- source_word: כָּלִיל
  choice: पूरी तरह
  rationale: यहाँ כָּלִיל क्रियाविशेषण की तरह पूर्णता और समग्रता पर बल देता है। ‘पूरी तरह’ सहज आधुनिक हिन्दी में उसका emphatic बल बनाए रखता है।
- source_word: יַחֲלֹף
  choice: मिट जाएँगी
  rationale: חלף का अर्थ प्रसंगानुसार बीत जाना, दूर हो जाना या लुप्त हो जाना हो सकता है। मूर्तियों के विषय में और כָּלִיל के साथ ‘मिट जाएँगी’ उनके पूर्णतः समाप्त या ओझल हो जाने का प्रभावी, स्वाभाविक हिन्दी रूप है।
