source:
  edition: WLC
  text: כִּ֣י נָטַ֗שְׁתָּה עַמְּ/ךָ֙ בֵּ֣ית יַעֲקֹ֔ב כִּ֤י מָלְאוּ֙ מִ/קֶּ֔דֶם וְ/עֹֽנְנִ֖ים כַּ/פְּלִשְׁתִּ֑ים וּ/בְ/יַלְדֵ֥י נָכְרִ֖ים יַשְׂפִּֽיקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/006.yaml
  text: For you have forsaken your people[a], the house of Jacob, because they are full of eastern ways, and they practice divination like the Philistines[c][b], and they strike hands with the children of foreigners.
translation:
  language: hi
  text: क्योंकि आपने अपनी प्रजा, याकूब के घराने को त्याग दिया है; क्योंकि वे पूरब की प्रथाओं से भर गए हैं[a], वे पलिश्तियों के समान शकुन-विचार करते हैं[b], और परदेशियों के बच्चों के साथ हाथ मिलाते हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “पूरब से”; संभवतः आशय पूरब से आई प्रथाओं या प्रभावों से है।
    reason: lexical_alternative
  - marker: b
    text: या “वे पलिश्तियों के समान भविष्य बतानेवाले हैं।”
    reason: lexical_alternative
  - marker: c
    text: यहाँ प्रयुक्त इब्रानी क्रिया दुर्लभ है और इसका अर्थ अनिश्चित है। इसका अर्थ “हाथ मिलाते हैं,” “समझौते करते हैं,” या अधिक सामान्य रूप से “मेल-जोल रखते हैं” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: נָטַשְׁתָּה
  choice: आपने ... त्याग दिया है
  rationale: क्रिया का अर्थ छोड़ देना या त्याग देना है। पूर्ण पक्ष को वर्तमान परिणाम सहित व्यक्त किया गया है और परमेश्वर के प्रति एकवचन संबोधन बनाए रखा गया है।
- source_word: עַמְּךָ בֵּית יַעֲקֹב
  choice: अपनी प्रजा, याकूब के घराने को
  rationale: 'समानाधिकरण संरचना सुरक्षित है: ‘अपनी प्रजा’ की पहचान ‘याकूब के घराने’ के रूप में होती है; יעקב को ‘इस्राएल’ से नहीं बदला गया।'
- source_word: מָלְאוּ מִקֶּדֶם
  choice: वे पूरब की प्रथाओं से भर गए हैं
  rationale: מִקֶּדֶם शाब्दिक रूप से ‘पूरब से’ है, पर वाक्यांश अपूर्ण/संक्षिप्त है। संदर्भ में पूरबी प्रभावों या प्रथाओं का अर्थ स्वाभाविक है; अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: עֹנְנִים
  choice: शकुन-विचार करते हैं
  rationale: यह दुर्लभ सहभागी रूप शकुन देखकर भावी बात बताने अथवा अन्य प्रकार के भविष्य-कथन को सूचित करता है। ‘शकुन-विचार’ सामान्य पाठक के लिए बोधगम्य रहते हुए अस्पष्टता को बहुत अधिक संकुचित नहीं करता।
- source_word: כַּפְּלִשְׁתִּים
  choice: पलिश्तियों के समान
  rationale: तुलनार्थक כְּ को सीधे और स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: וּבְיַלְדֵי נָכְרִים
  choice: परदेशियों की संतान के साथ
  rationale: ילדי का सामूहिक अर्थ ‘संतान’ और נכרים का अर्थ ‘परदेशी/विदेशी लोग’ रखा गया है; इसे अनावश्यक रूप से केवल पुरुषों तक सीमित नहीं किया गया।
- source_word: יַשְׂפִּיקוּ
  choice: हाथ मिलाते हैं
  rationale: दुर्लभ और विवादित क्रिया को संभावित हाथ मिलाने, समझौता करने या मेल-जोल रखने की छवि के साथ अनूदित किया गया है। वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: पूरबी और परदेशी प्रभावों के विषय में भविष्यद्वाणी का आरोप
  choice: पद को विदेशी मूल के लोगों की जातीय निंदा न बनाकर, पराई धार्मिक प्रथाओं को अपनाने और परदेशियों के साथ समझौतापरक मेल-जोल के आरोप के रूप में प्रस्तुत किया गया है।
  alternative: ‘पूरब से’ का संकेत स्वयं पूरब के लोगों की उपस्थिति की ओर हो सकता है, और अंतिम खंड विशेष रूप से संधि या व्यापारिक समझौते को सूचित कर सकता है।
  rationale: इब्रानी में מִקֶּדֶם संक्षिप्त और יַשְׂפִּיקוּ दुर्लभ है। इसलिए मुख्य पाठ संदर्भानुकूल अर्थ देता है, जबकि वास्तविक भाषिक अनिश्चितता पादटिप्पणियों में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण दिव्य संबोधन ‘आपने’ रखा गया है। शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। ‘शकुन-विचार’ और ‘हाथ मिलाते हैं’ जैसे पद स्रोत की संभावित छवि बनाए रखते हैं; जहाँ अर्थ विवादित है वहाँ पादटिप्पणी दी गई है।
