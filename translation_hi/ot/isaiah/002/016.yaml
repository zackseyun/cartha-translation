source:
  edition: WLC
  text: וְ/עַ֖ל כָּל אֳנִיּ֣וֹת תַּרְשִׁ֑ישׁ וְ/עַ֖ל כָּל שְׂכִיּ֥וֹת הַ/חֶמְדָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/016.yaml
  text: and against all the ships of Tarshish[a], and against all the beautiful craft.
translation:
  language: hi
  text: 'और तर्शीश के सब जहाज़ों के विरुद्ध,

    और सब मनभावने जलयानों[a] के विरुद्ध।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “सब सुन्दर प्रतिमाओं” अथवा “सब मनचाही कृतियों।” जिस इब्रानी शब्द का अनुवाद “जलयानों” किया गया है, वह दुर्लभ है और उसका सटीक अर्थ अनिश्चित है; समुद्री संदर्भ जहाज़ों या सुन्दर ढंग से बनाए गए जलयानों से सम्बन्धित अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: और … के विरुद्ध
  rationale: पद 12–16 के व्यापक वाक्य में यह पदबंध उन वस्तुओं को बताता है जिनके विरुद्ध यहोवा का न्याय आता है। ‘के विरुद्ध’ विरोधी दिशा को स्वाभाविक हिन्दी में व्यक्त करता है और दोनों पंक्तियों की पुनरावृत्ति भी बनाए रखता है।
- source_word: כָּל
  choice: सब
  rationale: यह समग्रता और व्यापकता व्यक्त करता है; ‘सब’ काव्यात्मक पुनरावृत्ति को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: तर्शीश के सब जहाज़ों
  rationale: सम्बन्धवाचक इब्रानी पदबंध को सीधे रूप में रखा गया है। यह तर्शीश से जुड़े जहाज़ों अथवा दूरगामी बड़े व्यापारिक जहाज़ों का संकेत हो सकता है; अनुवाद इस संभावना को अनावश्यक रूप से सीमित नहीं करता।
- source_word: שְׂכִיּוֹת
  choice: जलयानों
  rationale: यह अत्यन्त दुर्लभ शब्द है और इसका सटीक अर्थ अनिश्चित है। ‘जहाज़ों’ के साथ समुद्री समानांतरता के कारण ‘जलयानों’ को मुख्य पाठ में चुना गया, जबकि अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: הַחֶמְדָּה
  choice: मनभावने
  rationale: यह शब्द चाहने योग्य, प्रिय, रमणीय या बहुमूल्य होने का भाव देता है। ‘मनभावने’ आकर्षण और मूल्य, दोनों की व्यापक अर्थछाया को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दुर्लभ शब्द שְׂכִיּוֹת का अर्थ
  choice: समुद्री संदर्भ के अनुरूप ‘जलयानों’ को मुख्य पाठ में रखा गया
  alternative: ‘सुन्दर प्रतिमाएँ’ या ‘मनचाही कृतियाँ’
  rationale: निकटवर्ती ‘तर्शीश के जहाज़ों’ के साथ समानांतरता समुद्री अर्थ का समर्थन करती है, पर शब्द की दुर्लभता के कारण गैर-समुद्री अर्थों को निश्चित रूप से नकारा नहीं जा सकता; इसलिए अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। दोनों पंक्तियों में ‘और … सब … के विरुद्ध’ की पुनरावृत्ति मूल इब्रानी की समानांतर संरचना और न्याय की व्यापकता को सुरक्षित रखती है।
