source:
  edition: WLC
  text: הַ/דָּבָר֙ אֲשֶׁ֣ר חָזָ֔ה יְשַֽׁעְיָ֖הוּ בֶּן אָמ֑וֹץ עַל יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/001.yaml
  text: The word that Isaiah son of Amoz saw concerning Judah and Jerusalem[a][b].
translation:
  language: hi
  text: आमोस के पुत्र यशायाह का वह वचन, जिसे उसने यहूदा और यरूशलेम के विषय में देखा[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘संदेश’ अथवा ‘विषय’।
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में ‘देखा’; यह दर्शन के द्वारा प्रकाशन पाने के लिए प्रयुक्त एक सामान्य भविष्यसूचक अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר
  choice: वचन
  rationale: דָּבָר के अर्थों में ‘वचन’, ‘संदेश’ और ‘विषय’ सम्मिलित हैं। भविष्यवाणी की भूमिका में ‘वचन’ ठोस इब्रानी अभिव्यक्ति और उसके प्रचलित धार्मिक प्रयोग—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֲשֶׁר
  choice: जिसे
  rationale: सम्बन्धवाचक सर्वनाम को हिन्दी वाक्य-रचना के अनुसार ‘जिसे’ किया गया है; इसका सम्बन्ध ‘वचन’ से है।
- source_word: חָזָה
  choice: देखा
  rationale: क्रिया का मूल अर्थ ‘देखना’ है और यह भविष्यद्वक्ताओं द्वारा दर्शन में प्रकाशन पाने की मानक अभिव्यक्ति भी है। ‘देखा’ मूल रूपक को व्याख्यात्मक विस्तार के बिना सुरक्षित रखता है।
- source_word: יְשַׁעְיָהוּ
  choice: यशायाह
  rationale: व्यक्तिनाम का हिन्दी बाइबल-परम्परा में मानक रूप।
- source_word: בֶּן
  choice: पुत्र
  rationale: वंशगत परिचय देने वाले इब्रानी संबंध का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: אָמוֹץ
  choice: आमोस
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण; यह नबी आमोस के हिन्दी नाम के समान दिखता है, यद्यपि इब्रानी में दोनों नाम अलग हैं।
- source_word: עַל
  choice: के विषय में
  rationale: यहाँ पूर्वसर्ग दर्शन की विषय-वस्तु प्रस्तुत करता है। ‘के विषय में’ तटस्थ है और सन्देश को केवल विरोध या दण्ड तक सीमित नहीं करता।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: स्थान/नाम का मानक हिन्दी रूप।
- source_word: וִירוּשָׁלִָם
  choice: और यरूशलेम
  rationale: संयोजक और स्थाननाम का सीधा, मानक हिन्दी रूप।
theological_decisions:
- issue: חָזָה में भविष्यसूचक प्रकाशन का स्वरूप
  choice: ‘देखा’ की दर्शन-संबंधी भाषा बनाए रखी गई।
  alternative: ‘दर्शन में पाया’ या ‘भविष्यवाणी की’
  rationale: इब्रानी पाठ स्पष्टतः ‘देखा’ कहता है। यही शब्द भविष्यसूचक दर्शन का पारंपरिक संकेत है; इसे बनाए रखने से प्रकाशन के ढंग को सामान्य ‘कहा’ या ‘भविष्यवाणी की’ में समतल नहीं किया जाता।
- issue: भूमिका में עַל का आशय
  choice: ‘यहूदा और यरूशलेम के विषय में’
  alternative: ‘यहूदा और यरूशलेम के विरुद्ध’
  rationale: यह भूमिका दर्शन की व्यापक विषय-वस्तु बताती है, जिसमें न्याय के साथ भविष्य की आशा भी है। तटस्थ अनुवाद मूल की अर्थ-सीमा और धार्मिक तनाव सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण बाइबलीय गद्य। ‘वचन’ और ‘देखा’ मूल इब्रानी की ठोस अभिव्यक्तियों को बनाए रखते हैं, जबकि वाक्य-क्रम हिन्दी की स्वाभाविकता के अनुसार रखा गया है।
