  edition: WLC
  text: וּ/בָ֨אוּ֙ בִּ/מְעָר֣וֹת צֻרִ֔ים וּ/בִ/מְחִלּ֖וֹת עָפָ֑ר מִ/פְּנֵ֞י פַּ֤חַד יְהוָה֙ וּ/מֵ/הֲדַ֣ר גְּאוֹנ֔/וֹ בְּ/קוּמ֖/וֹ לַ/עֲרֹ֥ץ הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/019.yaml
  text: And they will enter the caves of the rocks and the holes of the dust from before the terror of Yahweh and from the splendor of his majesty[a], when he rises to terrify the earth.
translation:
  language: hi
  text: और वे चट्टानों की गुफाओं और धूल के बिलों[a] में प्रवेश करेंगे, याहवे के आतंक और उसके प्रताप के वैभव के कारण, जब वह पृथ्वी को आतंकित करने के लिए उठ खड़ा होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मिट्टी के गड्ढों” अथवा “धूल में बने सुरंगनुमा स्थानों।”
    reason: מְחִלּוֹת עָפָר के अर्थ छेद, बिल, गड्ढे या भूमिगत सुरंगनुमा आश्रय-स्थान हो सकते हैं; עָפָר का शाब्दिक अर्थ ‘धूल’ है, और प्रसंगानुसार ‘मिट्टी’ भी कहा जा सकता है।
lexical_decisions:
- source_word: וּבָאוּ
  choice: और वे ... में जा छिपेंगे
  rationale: संयोजक सहित पूर्ण क्रिया भविष्यसूचक क्रम में भावी घटना बताती है। अगली בְּ पदावलियाँ छिपने के स्थान दर्शाती हैं, इसलिए केवल ‘आएँगे’ की अपेक्षा ‘जा छिपेंगे’ प्रसंगगत गति और उद्देश्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בִּמְעָרוֹת צֻרִים
  choice: चट्टानों की गुफाओं
  rationale: מְעָרוֹת ‘गुफाएँ’ और צֻרִים ‘चट्टानें/शिलाखंड’ है; यह रूप मूल बिंब और संबंध दोनों बनाए रखता है।
- source_word: וּבִמְחִלּוֹת עָפָר
  choice: और धूल की सुरंगों
  rationale: מְחִלּוֹת भूमिगत छेदों, बिलों या सुरंगनुमा छिपने के स्थानों को सूचित करता है; עָפָר का ठोस अर्थ ‘धूल’ है। मुख्य पाठ में सुबोध ‘सुरंगों’ रखा गया है और अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: מִפְּנֵי
  choice: से बचने के लिए
  rationale: शाब्दिक अर्थ ‘के सामने से/उपस्थिति से’ है; यहाँ लोग याहवे की भयावह उपस्थिति से भागकर छिपते हैं। हिन्दी में यह प्रयोजनसूचक रूप उस गति को स्पष्ट करता है।
- source_word: פַּחַד יְהוָה
  choice: याहवे के आतंक
  rationale: פַּחַד यहाँ श्रद्धामय भय नहीं, न्याय के समय याहवे की उपस्थिति से उत्पन्न आतंक है। יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ से दर्शाया गया है।
- source_word: וּמֵהֲדַר גְּאוֹנוֹ
  choice: और उसके प्रताप के वैभव
  rationale: הָדָר ‘वैभव/शोभा’ और גָּאוֹן यहाँ ‘प्रताप/महिमा’ का भाव देता है। दोनों पदों को बनाए रखकर मूल की गहन गौरवमय अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: בְּקוּמוֹ
  choice: जब वह ... उठ खड़ा होगा
  rationale: पूर्वसर्ग सहित infinitive construct समयसूचक है। ‘जब ... उठ खड़ा होगा’ हिन्दी में स्वाभाविक रहते हुए दिव्य कार्रवाई की आरंभिक मुद्रा व्यक्त करता है।
- source_word: לַעֲרֹץ
  choice: आतंकित करने के लिए
  rationale: यह क्रिया भय से कंपा देने या आतंकित करने का अर्थ देती है। निकटवर्ती פַּחַד के साथ इसका शब्दगत संबंध हिन्दी में ‘आतंक’ द्वारा बना रहता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: व्यापक न्याय के इस संदर्भ में ‘पृथ्वी’ उपयुक्त है, यद्यपि शब्द कुछ प्रसंगों में ‘देश’ भी हो सकता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे उपस्थित है। ‘याहवे’ उस वाचा-नाम को उपाधि में बदले बिना व्यक्त करता है; ‘प्रभु’ पारंपरिक प्रतिस्थापन और ‘यहोवा’ बाद की मिश्रित उच्चारण-परंपरा है।
- issue: לַעֲרֹץ הָאָרֶץ में न्याय की क्रिया
  choice: पृथ्वी को आतंकित करने के लिए
  alternative: पृथ्वी को कंपा देने के लिए
  rationale: क्रिया आतंक उत्पन्न करने और भय से कंपाने के बीच अर्थ-विस्तार रखती है। मुख्य पाठ ‘आतंकित’ चुनता है ताकि פַּחַד से संबंध रहे, पर इसे भौतिक कंपन तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। काव्यात्मक समानांतरता ‘चट्टानों की गुफाओं’ और ‘धूल की सुरंगों’ में रखी गई है। डैश न्याय के सामने छिपने के कारण को स्पष्ट करते हैं, और शब्दावली मूल के आतंक तथा दिव्य प्रताप—दोनों तनावों को बनाए रखती है।
