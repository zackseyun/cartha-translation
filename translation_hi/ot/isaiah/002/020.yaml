source:
  edition: WLC
  text: בַּ/יּ֤וֹם הַ/הוּא֙ יַשְׁלִ֣יךְ הָ/אָדָ֔ם אֵ֚ת אֱלִילֵ֣י כַסְפּ֔/וֹ וְ/אֵ֖ת אֱלִילֵ֣י זְהָב֑/וֹ אֲשֶׁ֤ר עָֽשׂוּ ל/וֹ֙ לְ/הִֽשְׁתַּחֲוֺ֔ת לַ/חְפֹּ֥ר פֵּר֖וֹת וְ/לָ/עֲטַלֵּפִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/020.yaml
  text: In that day man will throw away his idols of silver and his idols of gold[a], which they made for him to bow down to[c][b], to the moles and to the bats.
translation:
  language: hi
  text: उस दिन मनुष्य चाँदी की अपनी मूर्तियों और सोने की अपनी मूर्तियों को, जिन्हें उन्होंने उसके लिए बनाया था कि वह उनके आगे दण्डवत् करे, छछूँदरों[a] और चमगादड़ों को फेंक देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में प्रयुक्त पशु-नाम का ठीक अर्थ अनिश्चित है; सम्भवतः इसका आशय छछूँदर या किसी अन्य बिल खोदने वाले जीव से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यसूचक समय-सूचक सूत्र का स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: יַשְׁלִיךְ
  choice: फेंक देगा
  rationale: हिफ़ील रूप किसी वस्तु को फेंक देने का भाव व्यक्त करता है; प्रसंग में इससे मूर्तियों के पूर्ण त्याग का संकेत मिलता है।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: एकवचन रूप को बनाए रखते हुए यह यहाँ समस्त मानवजाति के प्रतिनिधि के रूप में प्रयुक्त सामान्य एकवचन को व्यक्त करता है।
- source_word: אֱלִילֵי כַסְפּוֹ ... אֱלִילֵי זְהָבוֹ
  choice: चाँदी की अपनी मूर्तियों और सोने की अपनी मूर्तियों
  rationale: इब्रानी की पुनरुक्ति और निन्दात्मक प्रसंग को बनाए रखते हुए यह आधुनिक हिन्दी में स्पष्ट है।
- source_word: אֲשֶׁר עָשׂוּ לוֹ
  choice: जो उसके लिए बनाई गई थीं
  rationale: इब्रानी में क्रिया बहुवचन है, अर्थात् ‘जो उन्होंने उसके लिए बनाईं’; हिन्दी का कर्मवाच्य अज्ञात कर्ताओं को बिना अनावश्यक रूप से ‘कारीगर’ जोड़ने के स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְהִשְׁתַּחֲוֺת
  choice: ताकि वह उनके आगे दण्डवत् करे
  rationale: यह शारीरिक रूप से झुकने और उपासना करने, दोनों भावों को प्रसंगानुकूल रूप से संजोता है।
- source_word: לַחְפֹּר פֵּרוֹת
  choice: छछूँदरों
  rationale: कठिन और अनिश्चित पशु-नाम के लिए पारंपरिक अर्थ लिया गया है; अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: וְלָעֲטַלֵּפִים
  choice: और चमगादड़ों
  rationale: यह पशु-नाम स्पष्ट है और अँधेरे स्थानों में मूर्तियों को त्याग देने की छवि को बनाए रखता है।
theological_decisions:
- issue: הָאָדָם का प्रतिनिधिक अर्थ
  choice: सामान्य एकवचन ‘मनुष्य’
  alternative: ‘मानवजाति’ या ‘लोग’
  rationale: मूल पाठ का एकवचन किसी एक विशिष्ट व्यक्ति तक सीमित नहीं, बल्कि मनुष्य को प्रतिनिधिक रूप में प्रस्तुत करता है; ‘मनुष्य’ रूप और व्यापक अर्थ दोनों को बनाए रखता है।
- issue: לְהִשְׁתַּחֲוֺת में शारीरिक प्रणाम और उपासना का संबंध
  choice: ‘उनके आगे दण्डवत् करे’
  alternative: ‘उनकी उपासना करे’
  rationale: मूल क्रिया झुककर दण्डवत् करने की क्रिया को सामने रखती है, जबकि मूर्तियों का प्रसंग उसका उपासनात्मक अर्थ स्पष्ट करता है; अनुवाद दोनों के बीच का तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दण्डवत्’ धार्मिक प्रसंग में सामान्यतः समझा जाने वाला शब्द है। वाक्य के बीच डैश का प्रयोग सम्बन्धवाचक उपवाक्य को स्पष्ट करता है और मुख्य क्रिया ‘फेंक देगा’ पर बल बनाए रखता है।
