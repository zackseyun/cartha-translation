id: ISA.2.7
reference: Isaiah 2:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תִּמָּלֵ֤א אַרְצ/וֹ֙ כֶּ֣סֶף וְ/זָהָ֔ב וְ/אֵ֥ין קֵ֖צֶה לְ/אֹצְרֹתָ֑י/ו וַ/תִּמָּלֵ֤א אַרְצ/וֹ֙ סוּסִ֔ים וְ/אֵ֥ין קֵ֖צֶה לְ/מַרְכְּבֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/007.yaml
  text: His land is filled with silver and gold[a], and there is no end to his treasures; his land is filled with horses[b], and there is no end to his chariots.
translation:
  language: hi
  text: उसका देश[a] चाँदी और सोने से भर गया है, और उसके खज़ानों[b] का कोई अंत नहीं; उसका देश घोड़ों से भर गया है, और उसके रथों का कोई अंत नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ और आगे ‘उसका देश … उसके खज़ाने … उसके रथ’ एकवचन में हैं। यह एकवचन संभवतः पूरे राष्ट्र या लोगों को सामूहिक रूप से दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘भंडारों’ अथवा ‘कोषों’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּמָּלֵא
  choice: भर गया है
  rationale: מלא का अर्थ ‘भरना/भर जाना’ है। पूर्ण हुई क्रिया के वर्तमान परिणाम को व्यक्त करने के लिए ‘भर गया है’ स्वाभाविक हिन्दी है और इब्रानी रूप के परिणामसूचक भाव को बनाए रखती है।
- source_word: אַרְצוֹ
  choice: उसका देश
  rationale: मूल पाठ में संज्ञा के साथ तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय है। ‘उसका’ उस व्याकरणिक एकवचन को सुरक्षित रखता है, जो यहाँ संभवतः राष्ट्र या प्रजा के लिए सामूहिक रूप से प्रयुक्त है।
- source_word: כֶּסֶף וְזָהָב
  choice: चाँदी और सोना
  rationale: यह बहुमूल्य धातुओं और संचित धन की मानक जोड़ी है; ‘चाँदी और सोना’ काव्यात्मक समानांतरता को स्पष्ट और स्वाभाविक रूप में रखता है।
- source_word: וְאֵין קֵצֶה
  choice: कोई अंत नहीं
  rationale: अस्तित्ववाचक निषेध और קֵצֶה (‘अंत/सीमा’) का निकट, मुहावरेदार हिन्दी रूप।
- source_word: לְאֹצְרֹתָיו
  choice: उसके खज़ानों का
  rationale: אֹצָר का अर्थ ‘खज़ाना’, ‘कोष’ या ‘भंडार’ हो सकता है। चाँदी और सोने के संदर्भ में ‘खज़ानों’ से संचित संपत्ति का अर्थ सबसे सहज रूप से सामने आता है।
- source_word: סוּסִים
  choice: घोड़ों
  rationale: बहुवचन संज्ञा का सीधा और स्वाभाविक अनुवाद।
- source_word: לְמַרְכְּבֹתָיו
  choice: उसके रथों का
  rationale: מֶרְכָּבָה का मूल अर्थ ‘रथ’ है। घोड़ों के साथ इसका सैन्य आशय संदर्भ से स्पष्ट है, इसलिए मूल में न पाया जाने वाला विशेषण ‘युद्ध’ नहीं जोड़ा गया।
theological_decisions:
- issue: सामूहिक भर्त्सना में एकवचन स्वत्वसूचक प्रत्ययों को बनाए रखना
  choice: उसका देश … उसके खज़ाने … उसके रथ
  alternative: उनका देश … उनके खज़ाने … उनके रथ
  rationale: इब्रानी पाठ तीनों स्थानों पर तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय रखता है। यह संभवतः राष्ट्र या प्रजा को सामूहिक एकवचन के रूप में संबोधित करता है। हिन्दी में एकवचन बनाए रखने से मूल की व्याकरणिक और व्याख्यात्मक अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भर गया है’ पूर्ण हुई क्रिया और उसकी वर्तमान परिणति दोनों व्यक्त करता है। अर्धविराम पद की दो समानांतर पंक्तियों—धन-संपत्ति और सैन्य शक्ति—को स्पष्ट रूप से जोड़ता है।
