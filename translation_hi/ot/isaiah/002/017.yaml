reference: Isaiah 2:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שַׁח֙ גַּבְה֣וּת הָ/אָדָ֔ם וְ/שָׁפֵ֖ל ר֣וּם אֲנָשִׁ֑ים וְ/נִשְׂגַּ֧ב יְהוָ֛ה לְ/בַדּ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/017.yaml
  text: The loftiness of man will be brought low[a], and the exaltation of men will be humbled; and Yahweh alone will be exalted in that day.
translation:
  language: hi
  text: मनुष्य का ऊँचापन झुक जाएगा[a], और लोगों का ऊँचापन नीचा होगा; उस दिन केवल याहवे ही ऊँचा ठहरेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनुष्य का घमंड झुक जाएगा, और लोगों का अभिमान नीचा होगा।” इब्रानी में मानवीय अहंकार के लिए ऊँचाई और नीचे झुकने की छवि प्रयुक्त है।
    reason: मूल संज्ञाओं के अर्थपूर्ण, अधिक व्याख्यात्मक विकल्प को देता है, जबकि मुख्य पाठ में ऊँचाई का रूपक और समानांतरता सुरक्षित रहती है।
lexical_decisions:
- source_word: וְשַׁח
  choice: झुका दिया जाएगा
  rationale: यह क्रिया ऊँची अवस्था से नीचे झुकाए जाने का चित्र देती है। भविष्यसूचक कथन में पूर्ण रूप का भावी बल हिन्दी के कर्मवाच्य से स्वाभाविक रूप में व्यक्त होता है।
- source_word: גַּבְהוּת
  choice: घमंड
  rationale: मूल अर्थ ‘ऊँचाई’ है, पर यहाँ मनुष्य के अहंकारी ऊँचेपन का संकेत है। ‘घमंड’ सामान्य पाठक के लिए अर्थ स्पष्ट करता है, जबकि क्रिया ‘झुका’ ऊँचाई के रूपक को बनाए रखती है।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: यहाँ אָדָם समस्त मानवजाति का प्रतिनिधित्व करने वाला एकवचन है। ‘मनुष्य’ हिन्दी में स्वाभाविक और समावेशी सामूहिक अर्थ रखता है।
- source_word: וְשָׁפֵל
  choice: नीचा किया जाएगा
  rationale: यह समानांतर क्रिया ऊँची अवस्था को नीचे किए जाने का भाव रखती है और पद के ऊँचाई-नीचाई वाले चित्र को स्पष्ट बनाए रखती है।
- source_word: רוּם
  choice: ऊँचापन
  rationale: संज्ञा का मूल भाव ऊँचाई या उच्चता है। ‘ऊँचापन’ मानवीय दंभ और अंतिम खंड में यहोवा के वास्तविक रूप से ऊँचे किए जाने के बीच शब्दगत संबंध बनाए रखता है।
- source_word: אֲנָשִׁים
  choice: लोगों
  rationale: बहुवचन यहाँ सामान्य रूप से मनुष्यों को बताता है। आधुनिक हिन्दी में ‘लोगों’ स्वाभाविक है और किसी अनपेक्षित रूप से केवल पुरुषों तक अर्थ सीमित नहीं करता।
- source_word: וְנִשְׂגַּב
  choice: ऊँचा किया जाएगा
  rationale: निफ़अल रूप ऊँचा ठहराए या प्रतिष्ठित किए जाने का भाव देता है। यही अभिव्यक्ति मनुष्य के झूठे ऊँचेपन के साथ अपेक्षित विरोध स्थापित करती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में परमेश्वर के व्यक्तिगत नाम יהוה का प्रचलित और पहचानने योग्य लिप्यंतरण ‘यहोवा’ है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: לְבַדּוֹ
  choice: केवल ... ही
  rationale: यह रचना विशिष्टता पर बल देती है कि उस दिन यहोवा के अतिरिक्त कोई ऊँचा न रहेगा।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यसूचक काल-सूचक पदबंध का संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम स्पष्ट रूप से उपस्थित है। हिन्दी पाठकों में व्यापक रूप से परिचित ‘यहोवा’ नाम को सुरक्षित रखता है और ‘प्रभु’ जैसी स्थानापन्न उपाधि से बचता है।
- issue: הָאָדָם / אֲנָשִׁים का मानव-संदर्भ
  choice: मनुष्य ... लोगों
  alternative: आदमी ... पुरुषों
  rationale: समानांतर पद पूरे मानव समुदाय के अभिमानी ऊँचेपन की बात करते हैं, न कि केवल वयस्क पुरुषों की। हिन्दी में चुने गए शब्द इस सामान्य मानवीय संदर्भ को ठीक रखते हैं।
- issue: मानवीय ऊँचाई और यहोवा की उच्चता का विरोध
  choice: घमंड/ऊँचापन नीचा होता है; केवल यहोवा ऊँचा किया जाता है
  alternative: मानवीय प्रतिष्ठा घटती है; यहोवा महान माना जाता है
  rationale: मूल की ऊर्ध्वाधर चित्रावली और जानबूझकर किया गया विरोध बनाए रखा गया है, बिना यह तय किए कि यहोवा का ऊँचा किया जाना केवल मानवीय मान्यता है या उसके प्रकट सार्वभौम उत्कर्ष का वर्णन।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यसूचक शैली अपनाई गई है। समानांतरता और ऊँचा–नीचा रूपक को प्रमुख रखा गया है; अत्यधिक संस्कृतनिष्ठ ‘उन्नति/अवनति’ से बचकर सामान्य पाठक के लिए स्पष्ट शब्द चुने गए हैं।
