source:
  edition: WLC
  text: וְ/עַל֙ כָּל אַרְזֵ֣י הַ/לְּבָנ֔וֹן הָ/רָמִ֖ים וְ/הַ/נִּשָּׂאִ֑ים וְ/עַ֖ל כָּל אַלּוֹנֵ֥י הַ/בָּשָֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/013.yaml
  text: and against all the cedars of Lebanon[a], lofty and lifted up, and against all the oaks of Bashan.
translation:
  language: hi
  text: और लबानोन के सभी ऊँचे और उठे हुए देवदारों के विरुद्ध, और बाशान के सभी बलूत के वृक्षों[a] के विरुद्ध।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाशान के सभी तारपीन वृक्षों के विरुद्ध।” इब्रानी शब्द किसी बड़े वृक्ष की ऐसी प्रजाति का उल्लेख कर सकता है जिसकी पहचान बलूत या तारपीन वृक्ष के रूप में की जाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: और ... के विरुद्ध
  rationale: न्याय-सूची के व्यापक संदर्भ में עַל विरोधपूर्ण दैवी कार्रवाई को व्यक्त करता है; इसलिए ‘के विरुद्ध’ उपयुक्त है। ‘और’ को सूची की काव्यात्मक संरचना बनाए रखने के लिए रखा गया है।
- source_word: כָּל
  choice: सभी
  rationale: बहुवचन वृक्ष-समूहों के साथ כָּל का स्वाभाविक हिन्दी रूप ‘सभी’ है।
- source_word: אַרְזֵי הַלְּבָנוֹן
  choice: लबानोन के ... देवदारों
  rationale: यह रचना-संबंधी पदबंध लबानोन से जुड़े प्रसिद्ध देवदारों को दर्शाता है; ‘लबानोन के देवदार’ हिन्दी में स्वाभाविक है।
- source_word: הָרָמִים
  choice: ऊँचे
  rationale: רום यहाँ भौतिक ऊँचाई बताता है और प्रसंग में घमण्ड की प्रतीकात्मक ध्वनि भी रहने देता है।
- source_word: וְהַנִּשָּׂאִים
  choice: और उठे हुए
  rationale: यह निष्क्रिय कृदन्त की ‘ऊपर उठाए/उठे हुए’ छवि को बनाए रखता है और इसे केवल सम्मानसूचक ‘महान’ बनाकर अर्थ को सीमित नहीं करता।
- source_word: אַלּוֹנֵי הַבָּשָׁן
  choice: बाशान के ... बाँज वृक्षों
  rationale: אַלּוֹן के लिए ‘बाँज’ (oak) संदर्भानुकूल प्रमुख पहचान है और देवदारों के समानांतर विशाल वृक्षों की छवि बनाए रखता है; प्रजाति की अनिश्चितता पाद-टिप्पणी में दी गई है।
theological_decisions:
- issue: न्याय-वाणी में वृक्षों का प्रतीकात्मक बल
  choice: वृक्षों की शाब्दिक काव्यात्मक छवि को रखा गया है, जबकि घमण्डियों से उसका संबंध संदर्भ से उभरने दिया गया है।
  alternative: इन्हें स्पष्ट रूप से घमण्डी शासकों या राष्ट्रों के प्रतीक कहकर अनुवाद करना।
  rationale: आसपास का अंश उन सभी ऊँची प्राकृतिक और मानवीय वस्तुओं को चित्रित करता है जिन्हें यहोवा नीचा करेगा। शाब्दिक वृक्ष-चित्रण कविता और उसकी वास्तविक अस्पष्टता को बचाता है तथा व्याख्या को मुख्य पाठ में नहीं मिलाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘ऊँचे और उठे हुए’ मूल की समानांतर अभिव्यक्ति तथा उसके शारीरिक और प्रतीकात्मक दोनों अर्थों को बनाए रखता है।
