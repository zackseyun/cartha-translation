id: ISA.2.14
reference: Isaiah 2:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַ֖ל כָּל הֶ/הָרִ֣ים הָ/רָמִ֑ים וְ/עַ֖ל כָּל הַ/גְּבָע֥וֹת הַ/נִּשָּׂאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/014.yaml
  text: and against all the high mountains[a], and against all the lofty hills.
translation:
  language: hi
  text: और सब ऊँचे पहाड़ों पर[a], और सब उठी हुई पहाड़ियों पर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सब ऊँचे पहाड़ों पर, और सब ऊँची पहाड़ियों पर।’
    reason: הַנִּשָּׂאוֹת को अधिक मुहावरेदार ढंग से ‘ऊँची’ भी अनूदित किया जा सकता है; मुख्य पाठ उसके क्रियात्मक ‘उठी हुई’ भाव को सुरक्षित रखता है।
lexical_decisions:
- source_word: וְעַל
  choice: और ... पर
  rationale: दोहराया गया עַל न्याय के लक्ष्य को सूचित करता है। हिन्दी में पिछले पदों से जुड़ी सूची के भीतर ‘पर’ स्वाभाविक है और ‘के विरुद्ध’ की अपेक्षा काव्यात्मक प्रवाह बनाए रखता है।
- source_word: כָּל
  choice: सब
  rationale: काव्यात्मक सूची में यह समस्त ऊँचे पहाड़ों और पहाड़ियों को समाविष्ट करने वाला सहज हिन्दी रूप है।
- source_word: הֶהָרִים
  choice: पहाड़ों
  rationale: यह הָרִים और अगले גְּבָעוֹת के बीच भू-आकृतिक भेद बनाए रखता है।
- source_word: הָרָמִים
  choice: ऊँचे
  rationale: रום से बना यह रूप ऊँचाई व्यक्त करता है; ‘ऊँचे पहाड़’ स्वाभाविक और सीधा हिन्दी प्रयोग है।
- source_word: הַגְּבָעוֹת
  choice: पहाड़ियों
  rationale: यह छोटे भू-उभारों का सामान्य आधुनिक हिन्दी नाम है और ‘पहाड़ों’ से भेद बनाए रखता है।
- source_word: הַנִּשָּׂאוֹת
  choice: उठी हुई
  rationale: नשׂא के निष्क्रिय कृदन्त की ‘उठाई/ऊपर उठी हुई’ छवि को बनाए रखता है और केवल ‘ऊँची’ कहकर समानांतर शब्दों का भेद मिटाता नहीं।
theological_decisions:
- issue: क्या भू-दृश्य के शब्दों में मानवीय घमंड का अर्थ स्पष्ट रूप से जोड़ना चाहिए
  choice: मुख्य पाठ में ठोस भू-दृश्य—‘ऊँचे पहाड़’ और ‘उठी हुई पहाड़ियाँ’—बनाए रखना
  alternative: ‘गर्वोन्नत पहाड़’ और ‘अभिमानी पहाड़ियाँ’ जैसे व्याख्यात्मक रूप
  rationale: अध्याय का व्यापक संदर्भ ऊँची की गई वस्तुओं और मानवीय घमंड के बीच प्रतिध्वनि पैदा करता है, पर यह पद स्वयं भौगोलिक वस्तुओं की सूची देता है। शाब्दिक चित्र बनाए रखने से प्रतीकात्मक अर्थ पाठक और संदर्भ पर छोड़ा जाता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। पद की समानांतर काव्य-रचना तथा ‘पहाड़ों/पहाड़ियों’ का भेद रखा गया है। संदर्भ से न्याय का भाव आता है; हिन्दी वाक्य में दोहराया ‘पर’ उसी लक्ष्यसूचक संबंध को स्वाभाविक रूप से व्यक्त करता है।
