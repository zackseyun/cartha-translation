id: ISA.2.2
reference: Isaiah 2:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֣ה בְּ/אַחֲרִ֣ית הַ/יָּמִ֗ים נָכ֨וֹן יִֽהְיֶ֜ה הַ֤ר בֵּית יְהוָה֙ בְּ/רֹ֣אשׁ הֶ/הָרִ֔ים וְ/נִשָּׂ֖א מִ/גְּבָע֑וֹת וְ/נָהֲר֥וּ אֵלָ֖י/ו כָּל הַ/גּוֹיִֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/002.yaml
  text: And in the latter days the mountain of the house of Yahweh shall be established as the highest of the mountains[a], and shall be lifted up above the hills[c][b]; and all the nations shall stream to it.
translation:
  language: hi
  text: और बाद के दिनों में ऐसा होगा कि याहवे के भवन का पर्वत पर्वतों में सर्वोच्च होकर दृढ़ता से स्थापित होगा[b], और पहाड़ियों से ऊँचा उठाया जाएगा; और सभी राष्ट्र धारा की तरह उसकी ओर बहेंगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या, “याहवे के भवन का पर्वत पर्वतों के शिखर पर दृढ़ता से स्थापित होगा।”
    reason: alternative_reading
  - marker: c
    text: इब्रानी क्रिया राष्ट्रों को धारा की तरह उसकी ओर बहते हुए चित्रित करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: और ... यह होगा
  rationale: यह पद भविष्य के एक नबूवतपूर्ण दृश्य का परिचय देता है; यह हिन्दी में स्वाभाविक रहते हुए भविष्यसूचक बल बनाए रखता है।
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: आनेवाले दिनों में
  rationale: यह भावी समय को व्यक्त करता है और किसी विशेष अंत-कालीन व्यवस्था को अनावश्यक रूप से निश्चित नहीं करता। अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: נָכוֹן יִהְיֶה
  choice: दृढ़ता से स्थापित होगा
  rationale: यह प्रयोग स्थिरता, दृढ़ता और सुरक्षित रूप से स्थापित होने का भाव देता है।
- source_word: הַר בֵּית יְהוָה
  choice: यहोवा के भवन का पर्वत
  rationale: इब्रानी संबंधसूचक पद-श्रृंखला में ‘पर्वत’ और ‘भवन’ दोनों को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि किसी उपाधि से।
- source_word: בְּרֹאשׁ הֶהָרִים
  choice: सब पर्वतों में सर्वोच्च होकर
  rationale: अगली समानांतर पंक्ति ‘पहाड़ियों से ऊँचा’ के आलोक में यह प्रमुखता और उत्कर्ष का भाव स्वाभाविक हिन्दी में व्यक्त करता है; स्थानसूचक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: וְנִשָּׂא מִגְּבָעוֹת
  choice: और पहाड़ियों से ऊँचा उठाया जाएगा
  rationale: मूल के निष्क्रिय रूप, ऊँचा किए जाने की छवि और तुलनात्मक מִן को बनाए रखता है।
- source_word: גְּבָעוֹת
  choice: पहाड़ियाँ
  rationale: पर्वतों के साथ काव्यात्मक समानांतरता में सामान्य स्थलाकृतिक अर्थ उपयुक्त है।
- source_word: וְנָהֲרוּ
  choice: नदी की धारा के समान ... उमड़ेंगे
  rationale: क्रिया राष्ट्रों के नदी की तरह बहकर आने का सजीव रूपक रचती है; केवल ‘आएँगे’ कहने से यह छवि खो जाती।
- source_word: אֵלָיו
  choice: उसकी ओर
  rationale: पुल्लिंग एकवचन सर्वनाम का संदर्भ ‘पर्वत’ है; हिन्दी में ‘उसकी ओर’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל הַגּוֹיִם
  choice: सभी राष्ट्र
  rationale: यहाँ גּוֹיִם व्यापक रूप से राष्ट्रों को दर्शाता है; ‘गैर-यहूदी’ कहना अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים का काल-संबंधी अर्थ
  choice: आनेवाले दिनों में
  alternative: अंतिम दिनों में; बाद के दिनों में
  rationale: चुना हुआ पाठ भविष्यसूचक विस्तार को बनाए रखता है, पर किसी विशिष्ट अंत-कालीन मत को आरोपित नहीं करता; अधिक शाब्दिक संभावनाएँ पादटिप्पणी में दी गई हैं।
- issue: पर्वत की स्थापना और उत्कर्ष
  choice: सब पर्वतों में सर्वोच्च होकर दृढ़ता से स्थापित होगा
  alternative: पर्वतों के शिखर पर दृढ़ता से स्थापित होगा
  rationale: इब्रानी वाक्यांश स्थान अथवा सर्वोच्चता दोनों का संकेत दे सकता है। समानांतर ‘पहाड़ियों से ऊँचा’ सर्वोच्चता का समर्थन करता है, जबकि स्थानसूचक पाठ पादटिप्पणी में सुरक्षित है।
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों के लिए परिचित ‘यहोवा’ उस नाम को उपाधि में बदले बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली अपनाई गई है। ‘नदी की धारा के समान’ मूल रूपक को स्पष्ट करता है; वाक्य में भविष्यसूचक और काव्यात्मक लय बनाए रखी गई है।
