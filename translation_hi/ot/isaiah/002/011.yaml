base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/011.yaml
  text: The lofty eyes of man will be brought low[a], and the haughtiness of men will be humbled; and Yahweh alone will be exalted in that day.
translation:
  language: hi
  text: मनुष्य की घमंडी आँखें नीची की जाएँगी,[a] और लोगों का अभिमान झुकाया जाएगा; उस दिन केवल याहवे ही ऊँचा किया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनुष्य की ऊँची आँखें।” इब्रानी चित्र में मानवीय घमंड ऊँची निगाह या अकड़ भरे व्यवहार के रूप में प्रकट होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי גַּבְהוּת אָדָם
  choice: मनुष्य की घमंड भरी आँखें
  rationale: शाब्दिक ऊँचाई की छवि को आँखों में प्रकट होने वाले मानवीय घमंड के अर्थ के साथ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שָׁפֵל
  choice: नीची की जाएँगी
  rationale: नीचा किए जाने की मूल स्थानिक छवि और भावी न्याय—दोनों को बनाए रखता है।
- source_word: וְשַׁח רוּם אֲנָשִׁים
  choice: लोगों का ऊँचा अभिमान झुकाया जाएगा
  rationale: רוּם की ऊँचाई और שׁח के झुकाए जाने की समानांतर छवियों को सुरक्षित रखते हुए आशय स्पष्ट करता है। אֲנָשִׁים को यहाँ सामान्य मानव-समूह के अर्थ में 'लोगों' से व्यक्त किया गया है।
- source_word: וְנִשְׂגַּב
  choice: ऊँचा किया जाएगा
  rationale: मनुष्यों के नीचा और झुकाया जाने के विपरीत परमेश्वर के सर्वोच्च ठहरने की जानबूझकर रखी गई ऊँचाई की छवि बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित प्रतिलेखन 'यहोवा' से प्रस्तुत करता है, किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: לְבַדּוֹ
  choice: केवल ... ही
  rationale: 'विशेषता और अनन्यता पर बल देता है: उस दिन और कोई ऊँचा न ठहरेगा।'
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: भविष्यद्वाणी के प्रचलित काल-सूचक पद का सहज और गरिमापूर्ण हिन्दी रूप।
theological_decisions:
- issue: אָדָם और אֲנָשִׁים का सामान्य मानवीय अर्थ
  choice: मनुष्य ... लोग
  alternative: आदमी ... पुरुष
  rationale: वचन का न्याय केवल पुरुषों तक सीमित नहीं है। 'मनुष्य' एकवचन सामूहिकता को और 'लोग' बहुवचन मानव-समूह को स्वाभाविक हिन्दी में व्यक्त करते हैं, साथ ही इब्रानी के एकवचन-बहुवचन परिवर्तन को यथासंभव बनाए रखते हैं।
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है; इसलिए उसे उपाधि 'प्रभु' से बदलने के बजाय हिन्दी में परिचित नामरूप से दिया गया है।
- issue: मानवीय नीचाई और यहोवा की ऊँचाई का विरोध
  choice: नीची की जाएँगी ... झुकाया जाएगा ... ऊँचा किया जाएगा
  alternative: दीन होंगी ... नम्र किया जाएगा ... महान ठहरेगा
  rationale: मूल की ऊँचा-नीचा स्थानिक छवि और उसका धर्मवैचारिक तनाव सुरक्षित रखा गया है; इसे केवल अमूर्त नैतिक भाषा में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध है। समानांतर काव्यात्मक संरचना और ऊँचा–नीचा की आवर्ती छवि सुरक्षित रखी गई है।
