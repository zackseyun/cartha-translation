source:
  edition: WLC
  text: בּ֣וֹא בַ/צּ֔וּר וְ/הִטָּמֵ֖ן בֶּֽ/עָפָ֑ר מִ/פְּנֵי֙ פַּ֣חַד יְהוָ֔ה וּ/מֵ/הֲדַ֖ר גְּאֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/010.yaml
  text: Enter into the rock and hide yourself in the dust from before the terror of Yahweh and from the splendor of his majesty[a][b][c].
translation:
  language: hi
  text: चट्टान में प्रवेश कर और धूल में छिप जा—याहवे के आतंक[a] और उसके प्रताप के वैभव[c] से[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे की दहशत।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “के सामने से”; इससे याहवे की उपस्थिति के सामने से भागने का भाव व्यक्त होता है।
    reason: lexical_alternative
  - marker: c
    text: या “उसका वैभवमय प्रताप।” इब्रानी में राजसी गौरव बताने वाले दो निकटार्थक शब्द साथ रखे गए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹא בַצּוּר
  choice: चट्टान में जा घुस
  rationale: בוא का एकवचन आज्ञार्थ और ב־ की भीतर जाने की दिशा को स्वाभाविक हिन्दी में व्यक्त करता है; צוּר यहाँ शरण देने वाली चट्टान या शैल-स्थान का बिंब है।
- source_word: וְהִטָּמֵן
  choice: और ... छिप जा
  rationale: निफ़अल आज्ञार्थ का आत्मवाचक भाव स्पष्ट और सहज हिन्दी में रखा गया है।
- source_word: בֶּעָפָר
  choice: धूल में
  rationale: עָפָר का मूल अर्थ ‘धूल’ है और यह दीनता तथा धरती से जुड़े काव्यात्मक बिंब को बनाए रखता है।
- source_word: מִפְּנֵי
  choice: के सामने से
  rationale: शाब्दिक स्थान-संबंधी भाव ‘मुख/उपस्थिति के सामने से’ को बनाए रखता है, ताकि इसे केवल कारणसूचक ‘के कारण’ न समझा जाए।
- source_word: פַּחַד יְהוָה
  choice: याहवे के आतंक
  rationale: न्याय के इस प्रसंग में פַּחַד श्रद्धामय भय के बजाय प्रबल आतंक या दहशत को सूचित करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: הֲדַר גְּאֹנוֹ
  choice: उसके प्रताप के वैभव
  rationale: दो निकटार्थक संज्ञाओं के संयुक्त, प्रबल राजसी गौरव को दो अलग हिन्दी शब्दों द्वारा बनाए रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसका सीधा प्रचलित लिप्यंतरण है और उसे केवल किसी उपाधि में नहीं बदलता।
- issue: פַּחַד का भाव
  choice: आतंक
  alternative: भय / दहशत
  rationale: यहाँ ईश्वरीय न्याय के भयानक प्रकट होने की बात है, न कि ज्ञान-साहित्य में मिलने वाले श्रद्धापूर्ण ‘याहवे के भय’ की।
- issue: הֲדַר גְּאֹנוֹ में दो निकटार्थक गौरव-संज्ञाएँ
  choice: प्रताप के वैभव
  alternative: महिमामय प्रताप / उसकी महिमा का वैभव
  rationale: मूल की अर्थगत सघनता और राजसी गौरव को बिना किसी एक पद को लोप किए बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण है। एकवचन आज्ञार्थ को ‘जा घुस’ और ‘छिप जा’ से रखा गया है। काव्यात्मक तीव्रता के लिए दीर्घ विराम-चिह्न प्रयुक्त है, जबकि ‘के सामने से’ मूल की उपस्थिति-संबंधी अस्पष्टता को सुरक्षित रखता है।
