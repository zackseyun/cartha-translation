  edition: WLC
  text: וַ/תִּמָּלֵ֥א אַרְצ֖/וֹ אֱלִילִ֑ים לְ/מַעֲשֵׂ֤ה יָדָי/ו֙ יִֽשְׁתַּחֲו֔וּ לַ/אֲשֶׁ֥ר עָשׂ֖וּ אֶצְבְּעֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/008.yaml
  text: And his land is filled with idols; they bow down to the work of their hands[a], to what their fingers have made.
translation:
  language: hi
  text: और उसका देश[a] मूर्तियों से भर गया है; वे अपने हाथों की बनाई वस्तुओं के आगे झुकते हैं—उनके आगे, जिन्हें उनकी उँगलियों ने बनाया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “उसका देश” है—यह सामूहिक एकवचन है, जो यहाँ लोगों अथवा राष्ट्र को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּמָּלֵא
  choice: भर गया है
  rationale: निफ़अल रूप यहाँ देश की पूर्ण हो चुकी और वर्तमान में बनी हुई दशा बताता है; हिन्दी का पूर्ण वर्तमान इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַרְצוֹ
  choice: उसका देश
  rationale: तीसरे पुरुष एकवचन प्रत्यय को सुरक्षित रखा गया है। प्रसंग में यह याकूब/इस्राएल रूपी सामूहिक एकवचन की ओर संकेत करता है।
- source_word: אֱלִילִים
  choice: मूर्तियों
  rationale: यह शब्द उपासना के लिए बनाई गई मूर्तियों का सामान्यतः तिरस्कारपूर्ण उल्लेख करता है। ‘मूर्तियाँ’ आधुनिक हिन्दी में स्पष्ट और मानक समतुल्य है।
- source_word: יִשְׁתַּחֲווּ
  choice: आगे झुकते हैं
  rationale: क्रिया का शारीरिक अर्थ दण्डवत होने या झुकने का है और प्रसंग में उपासना निहित है। ‘झुकते हैं’ दृश्य बिंब को बनाए रखता है, जबकि ‘उपासना करते हैं’ उसके अर्थ को अधिक स्पष्ट करके व्याख्यायित कर देता।
- source_word: לְמַעֲשֵׂה יָדָיו
  choice: अपने हाथों की बनाई वस्तुओं के आगे
  rationale: यह चयन मनुष्य के अपने बनाए पदार्थ के सामने झुकने की विडंबना को स्पष्ट रखता है। हिन्दी में ‘अपने’ बहुवचन कर्ता ‘वे’ के साथ स्वाभाविक संबंध स्थापित करता है।
- source_word: לַאֲשֶׁר עָשׂוּ אֶצְבְּעֹתָיו
  choice: उनके आगे, जिन्हें उनकी उँगलियों ने बनाया है
  rationale: उँगलियों द्वारा बनाए जाने का ठोस चित्र सुरक्षित रखा गया है। सामूहिक एकवचन प्रत्यय को हिन्दी में बहुवचन कर्ता के अनुरूप ‘उनकी’ किया गया है, जिससे आशय स्पष्ट रहता है।
theological_decisions:
- issue: השתחוה में मूर्तिपूजक क्रिया का अनुवाद
  choice: आगे झुकते हैं
  alternative: उपासना करते हैं / दण्डवत होते हैं
  rationale: मूल क्रिया शारीरिक रूप से झुकने का चित्र प्रस्तुत करती है, जिसका धार्मिक अर्थ प्रसंग से प्रकट होता है। यह अनुवाद मूर्तिपूजा की निंदा को बनाए रखता है, पर क्रिया को अनावश्यक रूप से अमूर्त नहीं बनाता।
- issue: राष्ट्र के लिए सामूहिक एकवचन और लोगों के लिए बहुवचन
  choice: उसका देश … वे … अपने हाथों … उनकी उँगलियों
  alternative: उनका देश … वे … उनके हाथों … उनकी उँगलियों
  rationale: ‘उसका देश’ मूल के एकवचन रूप को सुरक्षित रखता है, जबकि आगे का बहुवचन लोगों की सामूहिक क्रिया को सहज हिन्दी में व्यक्त करता है। पादटिप्पणी इस व्याकरणिक तनाव को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मूर्तियों’, ‘आगे झुकते हैं’ और ‘उँगलियों ने बनाया है’ मूल के ठोस चित्र तथा मनुष्य-निर्मित वस्तुओं की पूजा में निहित विडंबना को बनाए रखते हैं।
