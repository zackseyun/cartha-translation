base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/001.yaml
  text: 'An oracle concerning Tyre: Wail[a], ships of Tarshish, for it is destroyed, without house or harbor[b]. From the land of Kittim it is revealed to them.'
translation:
  language: hi
  text: 'सोर के विषय में भविष्यवाणी: हे तर्शीश के जहाज़ो, विलाप करो! क्योंकि वह उजाड़ दिया गया है—न कोई घर रहा, न बंदरगाह।[a] कित्तीम की भूमि से उन्हें यह समाचार मिला है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न कोई घर रहा, न प्रवेश का मार्ग।” इब्रानी का आशय संभवतः यह है कि सोर इतना उजाड़ दिया गया है कि न घर बचा है, न बंदरगाह अथवा पहुँच।
    reason: lexical_alternative
  - marker: b
    text: कित्तीम से संभवतः कुप्रुस या उसके आसपास के पश्चिमी समुद्री तटों का बोध होता है।
    reason: cultural_note
lexical_decisions:
- source_word: מַשָּׂא
  choice: भविष्यवाणी
  rationale: भविष्यद्वाणी-संबंधी शीर्षकों में यह शब्द प्रायः न्याय की गंभीर ईश्वरीय घोषणा को सूचित करता है। ‘भविष्यवाणी’ सामान्य हिन्दी में स्पष्ट है, जबकि शाब्दिक ‘बोझ’ यहाँ भ्रामक हो सकता है।
- source_word: צֹר
  choice: सोर
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: הֵילִילוּ
  choice: विलाप करो
  rationale: बहुवचन आज्ञार्थक क्रिया ऊँची आवाज़ में शोक करने का आह्वान करती है; ‘विलाप करो’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: तर्शीश के जहाज़ो
  rationale: इब्रानी संबंध-रचना को बनाए रखता है और यह तय नहीं करता कि जहाज़ तर्शीश के मूल, गंतव्य या समुद्री व्यापार की किसी श्रेणी से जुड़े थे।
- source_word: שֻׁדַּד
  choice: उजाड़ दिया गया है
  rationale: निष्क्रिय रूप लूट और विनाश से हुई बरबादी व्यक्त करता है; ‘उजाड़ दिया गया है’ इस अर्थ को संक्षेप और स्वाभाविक ढंग से देता है।
- source_word: מִבַּיִת מִבּוֹא
  choice: न कोई घर रहा, न बंदरगाह
  rationale: संदर्भ में מִן को अभावसूचक मानकर नगर के घरों और समुद्री प्रवेश/पहुँच दोनों के नष्ट होने का भाव दिया गया है; ‘बंदरगाह’ जहाज़ों के प्रसंग में संभावित अर्थ स्पष्ट करता है।
- source_word: מֵאֶרֶץ כִּתִּים
  choice: कित्तीम की भूमि से
  rationale: इब्रानी भौगोलिक नाम को अनावश्यक रूप से केवल कुप्रुस तक सीमित किए बिना सुरक्षित रखा गया है।
- source_word: נִגְלָה לָמוֹ
  choice: यह बात उन पर प्रकट हुई है
  rationale: निष्क्रिय क्रिया के ‘ज्ञात/प्रकट किए जाने’ के भाव को निकटता से रखता है; ‘यह बात’ हिन्दी में निहित समाचार को स्वाभाविक बनाती है।
