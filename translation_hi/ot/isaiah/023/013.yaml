  text: הֵ֣ן אֶ֣רֶץ כַּשְׂדִּ֗ים זֶ֤ה הָ/עָם֙ לֹ֣א הָיָ֔ה אַשּׁ֖וּר יְסָדָ֣/הּ לְ/צִיִּ֑ים הֵקִ֣ימוּ בחיני/ו עֹרְרוּ֙ אַרְמְנוֹתֶ֔י/הָ שָׂמָ֖/הּ לְ/מַפֵּלָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/013.yaml
  text: Look at the land of the Chaldeans—this is the people that was not[a]; Assyria appointed it for desert creatures. They set up their siege towers, they stripped her palaces bare[d][c][b], they made her a ruin.
translation:
  language: hi
  text: देखो, कसदियों का देश! यह वह जाति है जो थी ही नहीं[a]; अश्शूर ने उसे मरुभूमि के जीवों के लिए स्थापित किया[b]। उन्होंने अपने घेराबंदी-मचान खड़े किए[c], उसके महलों को उघाड़ दिया[d] और उसे खंडहर बना दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह जाति अस्तित्व में नहीं थी,” अथवा “इस जाति का कोई महत्त्व नहीं था।” इब्रानी वाक्य संक्षिप्त और कठिन है।
    reason: alternative_reading
  - marker: b
    text: या, “अश्शूर ने उसे मरुभूमि में रहने वालों के लिए स्थापित किया।” यहाँ प्रयुक्त शब्द जंगली मरुस्थलीय जीवों या मरुभूमि के निवासियों, दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: “घेराबंदी-मचान” के पीछे के इब्रानी शब्द का अर्थ अनिश्चित है; अन्य सम्भव अर्थ “पहरे की मीनारें” या “गढ़” हैं।
    reason: textual_variant
  - marker: d
    text: या, “उसके महलों को नंगा कर दिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है; ‘देखो’ आधुनिक, सहज और मूल के बल को बनाए रखता है।
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: कसदियों का देश
  rationale: यह संबंधसूचक पदबंध जाति और उसके भूभाग, दोनों का बोध कराता है; हिन्दी बाइबिलीय प्रयोग में ‘कसदी’ परिचित नाम है।
- source_word: זֶה הָעָם לֹא הָיָה
  choice: यह वह जाति है जो थी ही नहीं
  rationale: मूल इब्रानी वाक्य अत्यंत संक्षिप्त और कठिन है। यह रूप उसकी असामान्यता और अस्तित्व अथवा महत्त्व से जुड़ी अस्पष्टता को बिना मिटाए हिन्दी में व्यक्त करता है।
- source_word: אַשּׁוּר
  choice: अश्शूर
  rationale: यहाँ साम्राज्य अथवा राष्ट्र का प्रचलित हिन्दी बाइबिलीय नाम उपयुक्त है।
- source_word: יְסָדָהּ
  choice: उसे ... स्थापित किया
  rationale: יסד का मूल अर्थ नींव डालना अथवा स्थापित करना है। ‘स्थापित किया’ संदर्भ को अनावश्यक रूप से ‘नियुक्त किया’ या ‘बसाया’ में सीमित नहीं करता।
- source_word: לְצִיִּים
  choice: मरुभूमि के जीवों के लिए
  rationale: צִיִּים सामान्यतः मरुभूमि के जंगली जीवों को दर्शाता है, यद्यपि मरुभूमि में रहने वाले मनुष्य भी संभव हैं; मुख्य पाठ उजाड़ के चित्र को सामने रखता है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: הֵקִימוּ בחיניו
  choice: उन्होंने घेराबंदी के अपने मचान खड़े किए
  rationale: लिखित और पठित पाठ की परंपरा यहाँ कठिन है। सैन्य विनाश के क्रम में घेराबंदी के मचान सम्भावित अर्थ है, पर अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: עֹרְרוּ אַרְמְנוֹתֶיהָ
  choice: उसके महलों को उघाड़ दिया
  rationale: यहाँ क्रिया को महलों को अनावृत अथवा रक्षाहीन कर देने के अर्थ में लिया गया है; यह मूल रूपक को ‘ढहा दिया’ कहकर अधिक निश्चित नहीं बनाता।
- source_word: שָׂמָהּ לְמַפֵּלָה
  choice: उसे खंडहर बना दिया
  rationale: यह पद किसी स्थान को गिरी हुई उजाड़ अवस्था में पहुँचा देने का भाव देता है। हिन्दी में पूर्ववर्ती बहुवचन कर्ता को स्वाभाविक रूप से जारी रखा गया है।
