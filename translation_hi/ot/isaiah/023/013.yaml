  register: भाषा आधुनिक मानक हिन्दी में है, किंतु भविष्यद्वाणी के गंभीर और काव्यात्मक स्वर को बनाए रखती है। कठिन इब्रानी वाक्य को अत्यधिक स्पष्ट करके उसकी वास्तविक अस्पष्टता नहीं मिटाई गई; आवश्यक विकल्प संक्षिप्त पादटिप्पणियों में दिए गए हैं।
