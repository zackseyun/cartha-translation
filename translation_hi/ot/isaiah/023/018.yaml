base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/018.yaml
  text: And her merchandise and her wages will be holy to Yahweh[a]; they will not be stored up or hoarded, for her merchandise will be for those who dwell before Yahweh[b], for eating to satisfaction and for durable clothing.
translation:
  language: hi
  text: उसके व्यापार की कमाई और उसकी मजदूरी[a] याहवे के लिए पवित्र होगी। उन्हें न जमा किया जाएगा, न संचित करके रखा जाएगा; क्योंकि उसके व्यापार की कमाई याहवे के सामने रहनेवालों के लिए होगी—भरपेट खाने और टिकाऊ वस्त्रों[b] के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसका मेहनताना।” मूल शब्द भुगतान या मजदूरी के लिए आता है और वेश्या को दिए जाने वाले मूल्य का अर्थ भी रख सकता है; इस अध्याय में सोर को वेश्या के रूप में दिखाए जाने की छवि यहाँ प्रतिध्वनित हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “उत्तम वस्त्र,” “भव्य वस्त्र,” अथवा “पर्याप्त आवरण।” अंतिम वाक्यांश कठिन है, विशेषकर वह विशेषण जिसका अर्थ टिकाऊ, उत्तम या प्राचीन हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: סַחְרָהּ
  choice: उसके व्यापार की कमाई
  rationale: यह संज्ञा व्यापार, व्यापारिक माल या उससे प्राप्त लाभ को सूचित कर सकती है। इस पद में उसे भोजन और वस्त्र की आवश्यकताओं के लिए उपलब्ध कराया जाता है, इसलिए ‘व्यापार की कमाई’ आधुनिक हिन्दी में अर्थ को स्वाभाविक रूप से व्यक्त करती है।
- source_word: אֶתְנַנָּהּ
  choice: उसकी मजदूरी
  rationale: शब्द का मूल अर्थ भुगतान या मेहनताना है और यह वेश्या को दिए गए मूल्य के लिए भी प्रयुक्त होता है। ‘मजदूरी’ मुख्य पाठ में स्पष्ट है, जबकि व्यभिचारिणी के रूप में सोर की पूर्ववर्ती छवि का संकेत पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: קֹדֶשׁ לַיהוָה
  choice: याहवे के लिए पवित्र
  rationale: यह वाक्यांश याहवे के लिए पवित्र ठहराए जाने अथवा समर्पित किए जाने को दर्शाता है। ‘पवित्र’ मूल की धार्मिक-सांस्कृतिक शक्ति को बनाए रखता है।
- source_word: יֵאָצֵר וְלֹא יֵחָסֵן
  choice: न जमा की जाएगी, न संचित करके रखी जाएगी
  rationale: दोनों समानांतर क्रियाएँ धन को इकट्ठा कर सुरक्षित रखने का भाव देती हैं। हिन्दी में अलग किंतु निकट अभिव्यक्तियाँ मूल की पुनरुक्ति और जोर को बनाए रखती हैं।
- source_word: לַיֹּשְׁבִים לִפְנֵי יְהוָה
  choice: याहवे के सामने रहनेवालों के लिए
  rationale: यह मूल के ‘बैठने/रहने’ और ‘सामने’ के शब्दों को निकटता से रखता है तथा यह तय नहीं करता कि अभिप्रेत लोग विशेष रूप से याजक हैं या व्यापक रूप से याहवे की उपस्थिति में रहनेवाले लोग।
- source_word: לֶאֱכֹל לְשָׂבְעָה
  choice: ताकि वे भरपेट खाएँ
  rationale: यह वाक्यांश तृप्ति तक खाने का अर्थ देता है। ‘भरपेट खाएँ’ साधारण आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: לִמְכַסֶּה עָתִיק
  choice: टिकाऊ वस्त्र
  rationale: מכסה आवरण या वस्त्र है, जबकि दुर्लभ विशेषण עתיק का अर्थ यहाँ विवादित है और टिकाऊ, उत्तम/भव्य अथवा पर्याप्त जैसे अर्थ संभव हैं। मुख्य पाठ में व्यावहारिक प्रबंध के संदर्भ के अनुकूल ‘टिकाऊ वस्त्र’ चुना गया है और अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में वाचा का विशिष्ट ईश्वरीय नाम सीधे आया है। उसका लिप्यंतरण नाम की विशिष्टता को बनाए रखता है।
- issue: सोर की व्यापारिक कमाई का धार्मिक स्वरूप
  choice: याहवे के लिए पवित्र
  alternative: याहवे के लिए अलग रखी जाएगी / समर्पित होगी
  rationale: קֹדֶשׁ स्पष्ट रूप से पवित्रता और समर्पण का भाव रखता है। अनुवाद इसे केवल कर, दान या आर्थिक पुनर्वितरण तक सीमित नहीं करता।
- issue: ‘याहवे के सामने रहनेवालों’ की पहचान
  choice: पहचान को अनिर्धारित रखा गया
  alternative: याजक अथवा मंदिर-सेवक
  rationale: मूल वाक्यांश लोगों की भूमिका को स्पष्ट रूप से याजकों तक सीमित नहीं करता; इसलिए अनुवाद वही खुलापन बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘भरपेट खाएँ’ स्वाभाविक हिन्दी है; ‘याहवे के सामने रहनेवाले’ मूल की धार्मिक अस्पष्टता बनाए रखता है। स्त्रीलिंग एकवचन ‘वह’ संयुक्त व्यापारिक आय को सामूहिक संपदा के रूप में ग्रहण करता है।
