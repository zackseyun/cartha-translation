base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/003.yaml
  text: On many waters was the grain of Shihor[a], the harvest of the Nile, her revenue[b]; and she became the merchant of nations.
translation:
  language: hi
  text: बहुत-से जलमार्गों के द्वारा शिहोर का अनाज[a]—नील की फसल—सोर की आमदनी था; और वह राष्ट्रों की व्यापारी बन गई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शिहोर से सम्भवतः नील या उसकी कोई धारा अभिप्रेत है; वैकल्पिक अनुवाद: “नील का अनाज।”'
    reason: lexical_alternative
  - marker: b
    text: या “राष्ट्रों का व्यापार” अथवा “राष्ट्रों का व्यापारिक माल।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְמַיִם רַבִּים
  choice: बहुत जलराशियों पर
  rationale: בְּ को समुद्री व्यापार के प्रसंग में स्थान/मार्ग के अर्थ में लिया गया है। यह अभिव्यक्ति दूर-दूर के समुद्री मार्गों की छवि बनाए रखती है।
- source_word: זֶרַע
  choice: अनाज
  rationale: कृषि और व्यापार के प्रसंग में यहाँ शाब्दिक ‘बीज’ से अधिक उपज या व्यापारिक अनाज अभिप्रेत है।
- source_word: שִׁחֹר
  choice: शिहोर
  rationale: मूल पाठ के स्थान-नाम को लिप्यंतरित किया गया है; इसकी नील या उसकी किसी धारा से पहचान टिप्पणी में दी गई है।
- source_word: קְצִיר יְאֹר
  choice: नील की उपज
  rationale: मिस्री प्रसंग में יְאֹר नील को सूचित करता है। קְצִיר का मूल अर्थ ‘कटनी’ है, पर यहाँ व्यापार में आने वाली फसल के लिए स्वाभाविक हिन्दी ‘उपज’ चुनी गई है।
- source_word: תְּבוּאָתָהּ
  choice: उसकी आमदनी
  rationale: תְּבוּאָה उपज और आय दोनों का भाव दे सकता है। स्त्रीलिंग प्रत्यय नगर सोर की ओर संकेत करता है; आयातित मिस्री उपज से प्राप्त व्यापारिक लाभ के प्रसंग में ‘आमदनी’ उपयुक्त है।
- source_word: וַתְּהִי
  choice: और वह ... बन गई
  rationale: स्त्रीलिंग एकवचन क्रिया का संबंध नगर सोर से है और यह परिणामी दशा व्यक्त करती है।
- source_word: סְחַר גּוֹיִם
  choice: राष्ट्रों की व्यापारी
  rationale: סְחַר व्यापार, व्यापारिक माल या व्यापारी गतिविधि का अर्थ दे सकता है। मुख्य पाठ में सोर की अंतरराष्ट्रीय व्यापारिक भूमिका को स्त्रीलिंग ‘व्यापारी’ से व्यक्त किया गया है, जबकि वैकल्पिक अर्थ टिप्पणी में सुरक्षित हैं।
