    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילִילוּ
  choice: विलाप करो
  rationale: यह ילל धातु का बहुवचन आज्ञार्थक रूप है और शोक या संकट में ऊँची आवाज़ से रोने को व्यक्त करता है। ‘विलाप करो’ आधुनिक हिन्दी में स्वाभाविक, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: אֳנִיּוֹת
  choice: जहाज़ो
  rationale: मूल शब्द का सामान्य अर्थ ‘जहाज़’ है। सम्बोधन के कारण हिन्दी में ‘जहाज़ो’ रखा गया है; ‘व्यापारी जहाज़’ जोड़ना मूल से अधिक विशिष्ट होता।
- source_word: תַּרְשִׁישׁ
  choice: तर्शीश
  rationale: स्थानवाचक व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है। ‘तर्शीश के जहाज़’ मूल की संबंधवाचक रचना को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह विलाप की आज्ञा का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: שֻׁדַּד
  choice: नष्ट कर दिया गया है
  rationale: שדד के निष्क्रिय पूर्ण रूप में हिंसक उजाड़ या विनाश का भाव है। यह चयन निष्क्रियता और पूर्ण हुए विनाश, दोनों को स्पष्ट रखता है।
- source_word: מָעֻזְּכֶן
  choice: तुम्हारा गढ़
  rationale: מָעוֹז/מָעֹז सुरक्षा देने वाले गढ़, दुर्ग या शरणस्थान को दर्शाता है। स्त्रीलिंग बहुवचन प्रत्यय जहाज़ों को सम्बोधित करता है। ‘गढ़’ रूपक की व्यापकता बनाए रखता है और सम्भवतः सोर को जहाज़ों के सुरक्षित आधार के रूप में इंगित करता है।
