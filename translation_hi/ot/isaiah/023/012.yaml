base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/012.yaml
  text: He said[a], “You will exult no more, oppressed virgin daughter of Sidon. Arise, cross over to Kittim[b]; even there you will find no rest.”
translation:
  language: hi
  text: उसने कहा, “हे उत्पीड़ित सीदोन की कुँवारी बेटी, अब तू फिर कभी उल्लसित न होगी।[a] उठ, समुद्र पार करके कित्तीम चली जा; वहाँ भी तुझे विश्राम न मिलेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अब तू फिर कभी आनन्द न मनाएगी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: क्रिया पुल्लिंग एकवचन है और कर्ता पिछले प्रसंग से समझा जाता है। हिन्दी में आरम्भिक वाव का अलग से ‘और’ अनिवार्य नहीं है।
- source_word: לֹא תוֹסִיפִי עוֹד לַעְלֹז
  choice: अब तू फिर उल्लसित न होगी
  rationale: निषेध के साथ יסף और עוֹד आगे से किसी क्रिया के समाप्त हो जाने का भाव देते हैं। ‘उल्लसित’ עלז के प्रबल, उत्सवपूर्ण आनन्द और भविष्यवाणी की गरिमामय शैली को व्यक्त करता है।
- source_word: הַמְעֻשָּׁקָה
  choice: उत्पीड़ित
  rationale: עשׁק का यह कर्मवाच्य रूप उस स्त्रीरूप नगर को संबोधित करता है जिस पर अत्याचार हुआ है; ‘उत्पीड़ित’ इसका सीधा और वर्तमान मानक हिन्दी रूप है।
- source_word: בְּתוּלַת בַּת צִידוֹן
  choice: सीदोन की कुँवारी बेटी
  rationale: नगर अथवा उसके लोगों के लिए प्रयुक्त भविष्यवाणी-साहित्य की मानवीकृत उपमा को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: כתיים / כִּתִּים
  choice: कित्तीम
  rationale: भौगोलिक नाम को लिप्यंतरित किया गया है; कुप्रुस और व्यापक पश्चिमी समुद्री क्षेत्रों से इसके संभावित संबंध को पाद-टिप्पणी में रखा गया है।
- source_word: קוּמִי עֲבֹרִי
  choice: उठ, ... को पार चली जा
  rationale: दोनों स्त्रीलिंग एकवचन आज्ञार्थक रूपों की तात्कालिकता और समुद्र पार जाने का भाव स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: גַּם שָׁם לֹא יָנוּחַ לָךְ
  choice: वहाँ भी तुझे विश्राम न मिलेगा
  rationale: शाब्दिक संरचना में विश्राम का उसके लिए न ठहरना है; हिन्दी मुहावरे में ‘विश्राम न मिलेगा’ वही अर्थ स्पष्ट और सहज रूप से देता है।
