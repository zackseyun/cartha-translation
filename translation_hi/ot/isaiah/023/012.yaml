translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यवाणी-साहित्य की गरिमा बनाए रखने के लिए ‘उल्लसित’, ‘उत्पीड़ित’ और ‘विश्राम’ जैसे शब्द चुने गए हैं। स्त्रीलिंग एकवचन संबोधन और सीदोन के मानवीकरण को स्पष्ट रखा गया है। अंग्रेज़ी परामर्श-पाठ में पाद-टिप्पणी चिह्नों और उनकी सामग्री का क्रम असंगत था; हिन्दी मसौदे में वैकल्पिक पाठ को [a] और कित्तीम की सांस्कृतिक टिप्पणी को [b] से सही स्थान पर जोड़ा गया है।
