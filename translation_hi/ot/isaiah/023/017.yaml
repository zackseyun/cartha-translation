  text: וְ/הָיָ֞ה מִ/קֵּ֣ץ שִׁבְעִ֣ים שָׁנָ֗ה יִפְקֹ֤ד יְהוָה֙ אֶת צֹ֔ר וְ/שָׁבָ֖ה לְ/אֶתְנַנָּ֑/ה וְ/זָֽנְתָ֛ה אֶת כָּל מַמְלְכ֥וֹת הָ/אָ֖רֶץ עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/017.yaml
  text: And it will happen at the end of seventy years that Yahweh will attend to Tyre[c][b][a], and she will return to her wages and prostitute herself with all the kingdoms of the earth on the face of the earth.
translation:
  language: hi
  text: सत्तर वर्ष पूरे होने पर ऐसा होगा कि याहवे सोर की सुधि लेगा[a]। तब वह अपनी कमाई[b] पर लौटेगी और पृथ्वी के सभी राज्यों के साथ, समूची भूमि पर[c], वेश्यावृत्ति करेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे सोर की ओर ध्यान देगा।” इब्रानी क्रिया प्रसंग के अनुसार दंडात्मक या पुनर्स्थापनात्मक हस्तक्षेप का अर्थ भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: “कमाई” से आशय वेश्या को मिलने वाले शुल्क से है। इससे राष्ट्रों के बीच सोर के व्यापारिक संबंधों को वेश्यावृत्ति बताने वाला रूपक आगे बढ़ता है।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से, “भूमि के मुख पर।” इस पद में इब्रानी भाषा पृथ्वी या भूमि के लिए दो निकट-संबंधित, पर अलग शब्दों—אֶרֶץ और אֲדָמָה—का प्रयोग करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ऐसा होगा
  rationale: यह भविष्य की परिस्थिति प्रस्तुत करने वाला सामान्य भविष्यसूचक सूत्र है; आधुनिक हिन्दी में स्वाभाविक रहते हुए इसका भाव सुरक्षित रहता है।
- source_word: מִקֵּץ שִׁבְעִים שָׁנָה
  choice: सत्तर वर्ष पूरे होने पर
  rationale: מִקֵּץ किसी निर्धारित अवधि के अंत या पूरा होने को दर्शाता है; यह केवल अनिश्चित रूप से ‘बाद में’ नहीं कहता।
- source_word: יִפְקֹד
  choice: की ओर फिर ध्यान देगा
  rationale: פקד का अर्थ किसी की सुधि लेना, उसकी ओर ध्यान देना, हस्तक्षेप करना, दंड देना या बहाल करना हो सकता है। यह चयन परमेश्वर की निर्णायक कार्रवाई को व्यक्त करता है, पर उसके दंडात्मक या पुनर्स्थापनात्मक स्वरूप को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम יהוה का हिन्दी लिप्यंतरण किया गया है, किसी उपाधि से उसका स्थान नहीं लिया गया।
- source_word: צֹר
  choice: सोर
  rationale: इस प्राचीन फिनीकी नगर के लिए प्रचलित हिन्दी बाइबलीय नाम।
- source_word: וְשָׁבָה
  choice: तब वह ... लौटेगी
  rationale: क्रिया स्त्रीलिंग एकवचन है और स्त्री के रूप में मानवीकृत सोर नगर की ओर संकेत करती है।
- source_word: לְאֶתְנַנָּה
  choice: अपनी कमाई की ओर
  rationale: אֶתְנַן विशेष रूप से वेश्या को मिलने वाली मजदूरी या शुल्क है। ‘कमाई’ सहज हिन्दी है और अगली क्रिया तथा पाद-टिप्पणी रूपक को स्पष्ट करती हैं।
- source_word: וְזָנְתָה
  choice: वेश्यावृत्ति करेगी
  rationale: זנה यहाँ सोर और राष्ट्रों के लाभ-आधारित संबंधों को वेश्यावृत्ति के रूपक में प्रस्तुत करता है; सीधा रूपक बनाए रखा गया है।
- source_word: אֶת כָּל מַמְלְכוֹת הָאָרֶץ
  choice: पृथ्वी के सभी राज्यों के साथ
  rationale: क्रिया זנה के संदर्भ में कर्मचिह्न उन पक्षों का परिचय देता है जिनके साथ सोर वेश्यावृत्ति करती है; ‘सभी राज्यों’ के कारण सार्वभौमिक विस्तार व्यक्त होता है।
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: समूची भूमि पर
  rationale: इब्रानी मुहावरे का व्यापक स्थानगत भाव स्वाभाविक हिन्दी में रखा गया है और אֲדָמָה को पिछले אָרֶץ से अलग शब्द ‘भूमि’ द्वारा दर्शाया गया है।
theological_decisions:
- issue: יִפְקֹד में परमेश्वर के ध्यान देने या हस्तक्षेप करने का आशय
  choice: तटस्थ दिव्य कार्रवाई—‘याहवे सोर की ओर फिर ध्यान देगा’
  alternative: ‘याहवे सोर को दंड देगा’, ‘याहवे सोर को फिर बहाल करेगा’, या ‘याहवे सोर की सुधि लेगा’
  rationale: संदर्भ में याहवे की कार्रवाई के फलस्वरूप सोर की गतिविधि फिर आरम्भ होती है, पर क्रिया अपने आप यह निश्चित नहीं करती कि बल दंड, पुनर्स्थापन या सामान्य हस्तक्षेप पर है। तटस्थ अनुवाद मूल का धर्मवैज्ञानिक तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। नगर सोर का स्त्री के रूप में मानवीकरण और वेश्यावृत्ति का कठोर व्यापारिक रूपक सुरक्षित रखा गया है। ‘पृथ्वी’ और ‘भूमि’ द्वारा मूल के दो अलग किन्तु संबंधित शब्दों का भेद यथासंभव बनाए रखा गया है।
