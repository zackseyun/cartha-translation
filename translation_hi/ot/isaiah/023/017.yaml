  source_fidelity: The draft accurately preserves the seventy-year period, Tyre’s feminine personification, the prostitution metaphor, the universal scope of the kingdoms, and the distinct terms אָרֶץ and אֲדָמָה. However, “फिर ध्यान देगा” adds ‘again,’ which is not expressed by יִפְקֹד. A more idiomatic neutral Hindi rendering of the ambiguous verb is also preferable.
