base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/004.yaml
  text: Be ashamed[a], Sidon, for the sea has spoken, the stronghold of the sea, saying, “I have not been in labor, and I have not given birth[c][b], and I have not raised young men or exalted virgins.”
translation:
  language: hi
  text: 'हे सीदोन, लज्जित हो[a], क्योंकि समुद्र—समुद्र का गढ़—कहता है: “न मैंने प्रसव-पीड़ा सही, न मैंने जन्म दिया[b]; न मैंने युवकों को पाला, न कुँवारी युवतियों को ऊँचा उठाया[c]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपमानित हो।”
    reason: lexical_alternative
  - marker: b
    text: या “न मैं प्रसव-वेदना में पड़ी, न मैंने संतान जनी।”
    reason: lexical_alternative
  - marker: c
    text: “कुँवारी युवतियों” के लिए इब्रानी में ऐसा शब्द है जो सामान्यतः कुँवारियों को दर्शाता है; इसे “युवतियों” या “कन्याओं” भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹשִׁי
  choice: लज्जित हो
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप है, जिसका संबोधन नगर सीदोन से है; यह मूल के लज्जा-बोध और आज्ञार्थक बल को बनाए रखता है।
- source_word: צִידוֹן
  choice: सीदोन
  rationale: इस फ़ोनीकी नगर-नाम का प्रचलित हिन्दी रूप।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आज्ञा का कारण प्रस्तुत करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יָם
  choice: समुद्र
  rationale: मूल चित्र को अक्षुण्ण रखते हुए समुद्र को बोलते हुए मानवीकृत किया गया है।
- source_word: מָעוֹז הַיָּם
  choice: समुद्र का गढ़
  rationale: מָעוֹז का अर्थ गढ़/दुर्ग/सुरक्षित स्थान है। संक्षिप्त पदबंध मूल की अस्पष्ट उपपद-संबंधी संरचना को बनाए रखता है।
- source_word: לֹא חַלְתִּי
  choice: न मुझे प्रसव-पीड़ा हुई
  rationale: क्रिया का प्रसंगानुकूल अर्थ प्रसव-वेदना सहना है; यह आगे आने वाले जन्म देने के कथन से स्वाभाविक रूप से जुड़ता है।
- source_word: יָלַדְתִּי
  choice: न मैंने जन्म दिया
  rationale: प्रत्यक्ष प्रसव-संबंधी अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גִדַּלְתִּי
  choice: न मैंने जवानों को पाला
  rationale: संतान को बढ़ाकर परिपक्व करने के अर्थ में ‘पाला’ सहज है; בחורים को पुत्र मानकर सीमित नहीं करता।
- source_word: בַּחוּרִים
  choice: जवानों
  rationale: यह युवा पुरुषों को सूचित करता है; ‘पुत्रों’ की अपेक्षा मूल के अर्थ-क्षेत्र को अधिक ठीक रखता है।
- source_word: רוֹמַמְתִּי
  choice: बड़ा किया
  rationale: मूल धातु का सामान्य अर्थ ऊँचा उठाना है, पर संतान-समानांतर संदर्भ में पालन-पोषण करके बड़ा करने का भाव बनता है; ‘महिमान्वित किया’ यहाँ अस्वाभाविक और संभवतः भ्रामक होता।
- source_word: בְתוּלוֹת
  choice: कुँवारी युवतियों
  rationale: यह पद युवा स्त्रियों के साथ उनके कुँवारे होने का विशिष्ट संकेत भी सुरक्षित रखता है।
theological_decisions:
- issue: ‘समुद्र का गढ़’ की पहचान
  choice: पदबंध को समुद्र के साथ रखा गया और किसी निश्चित ऐतिहासिक पहचान में नहीं बदला गया।
  alternative: इसे सीधे सोर अथवा समुद्री दुर्ग के रूप में स्पष्ट करना।
  rationale: इब्रानी वाक्य समुद्र को बोलने वाला बताता है और ‘समुद्र का गढ़’ जोड़ता है; यह सोर की ओर संकेत कर सकता है, पर अनुवाद में उस संकेत को निश्चित पहचान बनाना मूल की काव्यात्मक अस्पष्टता को मिटा देगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। समुद्र के मानवीकरण तथा ‘समुद्र का गढ़’ की संभावित द्विअर्थता को बनाए रखा गया है। समानांतर पंक्तियों में सहज हिन्दी के लिए ‘पाला’ और ‘बड़ा किया’ चुने गए हैं।
