id: ISA.23.9
reference: Isaiah 23:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְהוָ֥ה צְבָא֖וֹת יְעָצָ֑/הּ לְ/חַלֵּל֙ גְּא֣וֹן כָּל צְבִ֔י לְ/הָקֵ֖ל כָּל נִכְבַּדֵּי אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/009.yaml
  text: 'Yahweh of hosts has purposed it: to defile the pride of all beauty[c][b][a], to humble all the honored ones of the earth.'
translation:
  language: hi
  text: सेनाओं के याहवे ने यह ठाना है[a]—समस्त वैभव के गर्व को कलंकित करना[b] और धरती के सभी प्रतिष्ठित लोगों को तुच्छ कर देना।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके विरुद्ध यह ठाना है,” जहाँ स्त्रीलिंग प्रत्यय विशेष रूप से सोर नगर की ओर संकेत कर सकता है।
    reason: alternative_reading
  - marker: b
    text: “वैभव” का अनुवाद “शोभा,” “सुंदरता” या “महिमा” भी किया जा सकता है; “कलंकित करना” का अनुवाद “अपवित्र करना” या “अनादृत करना” भी संभव है।
    reason: lexical_alternative
  - marker: c
    text: या, “नीचा कर देना” अथवा “अपमानित कर देना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: व्यक्तिगत दिव्य नाम को ‘याहवे’ के रूप में रखा गया है; צְבָאוֹת की व्यापक सैन्य और स्वर्गीय छवि को ‘सेनाओं’ से व्यक्त किया गया है।
- source_word: יְעָצָהּ
  choice: ने यह ठाना है
  rationale: יעץ यहाँ दृढ़ उद्देश्य या योजना बनाने को दर्शाता है। ‘यह’ आगामी क्रियाओं में स्पष्ट किए गए निर्णय की ओर संकेत करता है, जबकि स्त्रीलिंग प्रत्यय की संभावित व्याख्या पादटिप्पणी में सुरक्षित है।
- source_word: לְחַלֵּל
  choice: कलंकित करना
  rationale: पिएल रूप का अर्थ अपवित्र, अनादृत या मानभंग करना हो सकता है। इस गैर-अनुष्ठानिक न्याय-संदर्भ में ‘कलंकित करना’ स्वाभाविक है और प्रतिष्ठा गिराने का भाव देता है।
- source_word: גְּאוֹן כָּל צְבִי
  choice: समस्त वैभव के गर्व
  rationale: גְּאוֹן को न्याय के प्रसंग में ‘गर्व’ और צְבִי को सामूहिक अर्थ में ‘वैभव’ किया गया है। इससे पद की संक्षिप्तता और गर्व–प्रतिष्ठा का समानांतर संबंध बना रहता है।
- source_word: לְהָקֵל
  choice: तुच्छ कर देना
  rationale: קלל का हिफ़ील रूप यहाँ हल्का, तुच्छ या अनादृत कर देने का भाव रखता है। यह ‘प्रतिष्ठित लोगों’ के साथ जानबूझकर बनाया गया विरोध भी स्पष्ट करता है।
- source_word: כָּל נִכְבַּדֵּי אָרֶץ
  choice: धरती के सभी प्रतिष्ठित लोगों
  rationale: נִכְבַּדֵּי सम्मानित, प्रभावशाली या विशिष्ट व्यक्तियों को दर्शाता है; ‘प्रतिष्ठित लोग’ इसे कुलीन वर्ग तक सीमित नहीं करता। אָרֶץ को व्यापक संदर्भ के कारण ‘धरती’ किया गया है।
theological_decisions:
- issue: יְעָצָהּ में स्त्रीलिंग प्रत्यय का संदर्भ
  choice: मुख्य पाठ में ‘यह ठाना है,’ अर्थात घोषित न्याय का उद्देश्य
  alternative: ‘उसके विरुद्ध यह ठाना है,’ जहाँ ‘उसके’ का संकेत स्त्रीलिंग नगर सोर की ओर है
  rationale: अगली दो क्रियाएँ याहवे के संकल्प की विषय-वस्तु बताती हैं, इसलिए ‘यह’ हिंदी में सहज है। फिर भी प्रत्यय के सोर को सूचित करने की वास्तविक संभावना को पादटिप्पणी में रखा गया है।
- issue: לְהָקֵל में दीन करने और अनादृत करने के बीच अर्थ
  choice: तुच्छ कर देना
  alternative: नीचा करना या अपमानित करना
  rationale: मूल क्रिया ‘हल्का/तुच्छ बनाना’ का अर्थ दे सकती है। चुना हुआ पाठ प्रतिष्ठित लोगों की हैसियत उलट दिए जाने को सामने रखता है, बिना इसे केवल आंतरिक विनम्रता तक सीमित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। वाक्य में हिब्रू की दो समानांतर उद्देश्यवाचक क्रियाओं को ‘करना ... कर देना’ से बनाए रखा गया है। ‘प्रतिष्ठित’ और ‘तुच्छ’ का विरोध मूल पद की विडंबना को स्पष्ट करता है।
