source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא וְ/נִשְׁכַּ֤חַת צֹר֙ שִׁבְעִ֣ים שָׁנָ֔ה כִּ/ימֵ֖י מֶ֣לֶךְ אֶחָ֑ד מִ/קֵּ֞ץ שִׁבְעִ֤ים שָׁנָה֙ יִהְיֶ֣ה לְ/צֹ֔ר כְּ/שִׁירַ֖ת הַ/זּוֹנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/015.yaml
  text: 'And in that day Tyre will be forgotten for seventy years[a], like the days of one king. At the end of seventy years[b], it will happen to Tyre as in the song of the prostitute:'
translation:
  language: hi
  text: उस दिन ऐसा होगा कि सोर सत्तर वर्ष तक भुला दिया जाएगा, एक राजा के दिनों के समान।[a] सत्तर वर्ष के अंत में सोर के साथ वैसा होगा जैसा वेश्या के गीत में है:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक राजा के जीवनकाल जितने समय तक।” इब्रानी में शाब्दिक रूप से “एक राजा के दिनों के समान” है।
    reason: lexical_alternative
  - marker: b
    text: या, “वेश्या के गीत के समान।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ऐसा होगा
  rationale: भविष्यसूचक प्रसंग में इस क्रिया का भावी घटनात्मक अर्थ है; यह हिन्दी में स्वाभाविक रहते हुए मूल की भूमिका को बनाए रखता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यवाणी में प्रयुक्त मानक कालसूचक पद है और हिन्दी बाइबलीय शैली में स्वाभाविक है।
- source_word: וְנִשְׁכַּחַת
  choice: भुला दिया जाएगा
  rationale: निफ़अल रूप का कर्मवाच्य/परिणामसूचक भाव व्यक्त करता है कि सोर लोगों की स्मृति और ध्यान से ओझल हो जाएगा।
- source_word: צֹר
  choice: सोर
  rationale: इस नगर के नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: שִׁבְעִים שָׁנָה
  choice: सत्तर वर्ष तक
  rationale: हिन्दी में अवधि को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כִּימֵי מֶלֶךְ אֶחָד
  choice: एक राजा के दिनों के समान
  rationale: मूल के तुलनात्मक कण और ‘दिनों’ को बनाए रखता है तथा इसे निश्चित रूप से ‘जीवनकाल’ मानकर अर्थ सीमित नहीं करता।
- source_word: מִקֵּץ
  choice: के अंत में
  rationale: निर्दिष्ट अवधि पूरी होने के समय को ठीक और स्वाभाविक रूप से दर्शाता है।
- source_word: יִהְיֶה לְצֹר
  choice: सोर के साथ वैसा होगा
  rationale: मूल के व्यापक और कुछ हद तक अस्पष्ट ‘सोर के लिए/साथ होगा’ को बिना अनावश्यक व्याख्या के सहज हिन्दी में व्यक्त करता है।
- source_word: כְּשִׁירַת
  choice: जैसा ... के गीत में है
  rationale: अगले पद में आने वाले गीत की ओर संकेत करता है और तुलना को स्वाभाविक हिन्दी में रखता है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: הַזּוֹנָה
  choice: वेश्या
  rationale: यह मूल की सीधी और तीखी उपमा को आधुनिक, सटीक तथा अनावश्यक रूप से शिष्ट या अश्लील हुए बिना बनाए रखता है।
theological_decisions:
- issue: सोर का वेश्या के रूप में रूपकात्मक चित्रण
  choice: ‘वेश्या’ रूपक को सीधे बनाए रखा गया है।
  alternative: ‘व्यभिचारिणी स्त्री’ जैसे नरम या अधिक व्याख्यात्मक शब्द
  rationale: मूल पाठ व्यापारिक नगर सोर के लिए जानबूझकर यह तीखा लैंगिक-व्यापारिक रूपक प्रयोग करता है; इसे नरम करने से अगले पद के गीत से संबंध और भविष्यवाणी का अलंकारिक बल घट जाएगा।
- issue: ‘एक राजा के दिनों’ की अवधि
  choice: मूल की तुलना को ‘एक राजा के दिनों के समान’ के रूप में सुरक्षित रखा गया है।
  alternative: ‘एक राजा के जीवनकाल तक’
  rationale: ‘जीवनकाल’ संभव अर्थ है, पर मूल में ‘दिन’ और तुलना दोनों स्पष्ट हैं; इसलिए मुख्य पाठ में अस्पष्टता रखी गई और व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सोर’ प्रचलित हिन्दी बाइबलीय नाम है। वाक्य में भविष्यसूचक गंभीरता और मूल की दोनों तुलनाएँ सुरक्षित हैं; अगले पद में उद्धृत गीत के कारण अंत में द्विबिंदु रखा गया है।
