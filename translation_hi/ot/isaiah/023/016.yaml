id: ISA.23.16
reference: Isaiah 23:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: קְחִ֥י כִנּ֛וֹר סֹ֥בִּי עִ֖יר זוֹנָ֣ה נִשְׁכָּחָ֑ה הֵיטִ֤יבִי נַגֵּן֙ הַרְבִּי שִׁ֔יר לְמַ֖עַן תִּזָּכֵֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/016.yaml
  text: Take a lyre[a], go about the city, forgotten prostitute; play skillfully, sing many songs, so that you may be remembered.
translation:
  language: hi
  text: एक तारवाद्य[a] उठा, नगर में घूम, हे भूली हुई वेश्या; कुशलता से बजा, बहुत-से गीत गा, ताकि तुझे याद किया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लायर।” इब्रानी शब्द किन्नोर एक प्राचीन तंत्री वाद्य का नाम है; इसे परंपरागत रूप से “हार्प” भी कहा गया है।
    reason: כִּנּוֹר के प्राचीन वाद्य-रूप और उसके हिन्दी समकक्ष की अनिश्चितता।
lexical_decisions:
- source_word: קְחִי
  choice: उठा
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक क्रिया है; वाद्य के साथ ‘उठा’ आधुनिक हिन्दी में स्वाभाविक रूप से ‘हाथ में ले’ का भाव देता है।
- source_word: כִנּוֹר
  choice: वीणा
  rationale: प्राचीन तार वाले वाद्य किन्नोर के लिए हिन्दी में ‘वीणा’ सबसे सुबोध और गरिमापूर्ण निकटतम पद है; ठीक वाद्य-रूप अनिश्चित है, इसलिए पाद-टिप्पणी दी गई है।
- source_word: סֹבִּי עִיר
  choice: नगर में घूम
  rationale: סבב का आज्ञार्थक रूप नगर में या नगर के चारों ओर घूमने का भाव दे सकता है। इब्रानी में संबंधबोधक अव्यय नहीं है; ‘नगर में घूम’ सहज हिन्दी है और दिशा को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: זוֹנָה נִשְׁכָּחָה
  choice: हे भुला दी गई वेश्या
  rationale: सोर के स्त्रीरूप मानवीकरण और स्पष्ट वेश्या-रूपक को बनाए रखा गया है। निष्क्रिय भाव ‘भुला दी गई’ से व्यक्त होता है।
- source_word: הֵיטִיבִי נַגֵּן
  choice: कुशलता से बजा
  rationale: היטיב यहाँ נגן की क्रिया-रीति बताता है; यह केवल अच्छा नहीं, अच्छी तरह या निपुणता से वाद्य बजाने की आज्ञा है।
- source_word: הַרְבִּי שִׁיר
  choice: बहुत-से गीत गा
  rationale: शाब्दिक रूप ‘गीत बढ़ा/बहुत कर’ है; सामूहिक एकवचन שיר को स्वाभाविक हिन्दी में बहुवचन गीतों के रूप में व्यक्त किया गया है।
- source_word: לְמַעַן תִּזָּכֵרִי
  choice: ताकि तुझे फिर याद किया जाए
  rationale: למען उद्देश्य बताता है और נिफ़अल रूप निष्क्रिय ‘याद किया जाना’ व्यक्त करता है। प्रसंग में पुनः लोगों के ध्यान में आने का भाव होने से ‘फिर’ निहित पुनर्स्मरण को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: सोर को वेश्या के रूप में संबोधित करना
  choice: मुख्य पाठ में स्पष्ट रूपक ‘भुला दी गई वेश्या’ रखा गया
  alternative: ‘भुला दी गई नगर-वधू’ या रूपक को नरम करना
  rationale: अध्याय में सोर का मानवीकरण एक ऐसी वेश्या के रूप में है जो फिर से ध्यान आकर्षित करना चाहती है। मूल की तीक्ष्ण भविष्यद्वाणी-संबंधी छवि को बिना सांप्रदायिक व्याख्या जोड़े सुरक्षित रखा गया है।
- issue: תִּזָּכֵרִי में स्मरण का भाव
  choice: ‘तुझे फिर याद किया जाए’
  alternative: ‘तुझे याद किया जाए’
  rationale: क्रिया स्वयं सामान्यतः ‘याद किया जाना’ कहती है; भुलाई हुई वेश्या के प्रसंग में पुनः स्मरण का आशय निहित है। ‘फिर’ इसी प्रसंगगत तनाव को पठनीय हिन्दी में व्यक्त करता है, इसे किसी धार्मिक स्मरण के रूप में नहीं समझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्त्रीलिंग एकवचन आज्ञार्थक रूप रखे गए हैं। ‘नगर’ और ‘वीणा’ गरिमापूर्ण तथा सामान्य पाठकों के लिए सुबोध हैं; ‘वेश्या’ मूल रूपक की स्पष्टता बनाए रखता है और न तो पुरातन है, न अनावश्यक रूप से अपमानसूचक।
