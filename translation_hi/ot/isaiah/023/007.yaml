  register: आधुनिक मानक हिंदी में काव्यात्मक, गरिमापूर्ण और सहज शैली रखी गई है। ‘नगरी’ और ‘उल्लासमयी’ भविष्यद्वाणी के काव्य-स्वर के अनुकूल हैं; मूल का मानवीकरण बनाए रखा गया है।
