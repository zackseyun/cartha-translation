  text: Is this your exultant city[a], whose origin is from days of old, whose feet carried her far away to sojourn?
translation:
  language: hi
  text: 'क्या यह तुम्हारी उल्लासमयी नगरी है,

    जिसकी शुरुआत प्राचीन काल में हुई थी,

    जिसके पाँव उसे दूर देश में परदेशी होकर रहने के लिए ले गए?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲזֹאת לָכֶם
  choice: क्या यही तुम्हारी
  rationale: प्रश्नवाचक कण और स्त्रीलिंग संकेतवाचक शब्द को आलंकारिक प्रश्न के रूप में रखा गया है; לָכֶם को प्रसंगानुसार स्वामित्वसूचक ‘तुम्हारी’ कहना स्वाभाविक है।
- source_word: עַלִּיזָה
  choice: उल्लासमयी नगरी
  rationale: यह शब्द हर्ष और उत्सवी उमंग का भाव देता है। स्त्रीलिंग विशेषण के संदर्भित नगर, सोर, को स्पष्ट करते हुए ‘नगरी’ जोड़ा गया है।
- source_word: מִימֵי קֶדֶם קַדְמָתָהּ
  choice: जिसका आरम्भ प्राचीन काल से है
  rationale: दोनों अभिव्यक्तियाँ नगर की पुरातनता और आरम्भ की ओर संकेत करती हैं; हिंदी में अर्थ स्पष्ट रखते हुए उनकी संयुक्त समयगत गहराई व्यक्त की गई है।
- source_word: יֹבִלוּהָ רַגְלֶיהָ
  choice: जिसके पाँव उसे ... ले गए
  rationale: हिब्रू के मानवीकरण और ‘पाँव’ को कर्ता बनाने वाली सजीव छवि को सुरक्षित रखा गया है।
- source_word: מֵרָחוֹק
  choice: दूर-दूर तक
  rationale: दूरी और व्यापक गमन का स्वाभाविक हिंदी बोध देता है; उपसर्ग מִן की दिशा यहाँ गति के प्रसंग में दूरस्थ प्रदेशों की ओर जाने के रूप में समझी गई है।
- source_word: לָגוּר
  choice: परदेश में बसने के लिए
  rationale: גור में अपने मूल स्थान से बाहर विदेशी अथवा अस्थायी निवासी की तरह रहने का भाव है। ‘परदेश में बसने’ से यह सामान्य पाठक के लिए स्पष्ट होता है, यद्यपि ‘बसना’ अस्थायित्व को पूरी तरह व्यक्त नहीं करता।
theological_decisions: []
