source:
  edition: WLC
  text: דֹּ֖מּוּ יֹ֣שְׁבֵי אִ֑י סֹחֵ֥ר צִיד֛וֹן עֹבֵ֥ר יָ֖ם מִלְאֽוּ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/002.yaml
  text: Be silent[a], inhabitants of the coastland; the merchant of Sidon, crossing the sea[b], has filled you.
translation:
  language: hi
  text: हे तटवर्ती प्रदेश[a] के निवासियो, मौन हो जाओ! समुद्र पार करने वाले सीदोन के व्यापारियों ने तुम्हें भर दिया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘द्वीप’; हिब्रू אִי का अर्थ द्वीप अथवा समुद्रतटीय प्रदेश हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू वाक्यांश को व्यापारिक अर्थ में ‘उन्होंने तुम्हारी आपूर्ति की’ अथवा ‘वे तुम्हारी आय का स्रोत थे’ भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דֹּמּוּ
  choice: मौन हो जाओ
  rationale: यह דמם का बहुवचन आज्ञार्थक रूप है। ‘मौन हो जाओ’ न्याय के समाचार पर स्तब्ध चुप्पी का भाव व्यक्त करता है, पर शोक करने का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: יֹשְׁבֵי אִי
  choice: तटवर्ती प्रदेश के निवासियो
  rationale: יֹשְׁבֵי संबोधन में प्रयुक्त बहुवचन रचना है। אִי द्वीप अथवा समुद्रतटीय भूभाग दोनों का सूचक हो सकता है; फीनीकी समुद्री संदर्भ में ‘तटवर्ती प्रदेश’ स्वाभाविक है।
- source_word: סֹחֵר צִידוֹן
  choice: सीदोन के व्यापारी
  rationale: סֹחֵר व्याकरण की दृष्टि से एकवचन है, पर सामूहिक अर्थ रख सकता है; आगे का बहुवचन क्रियारूप מִלְאוּךְ हिन्दी में ‘व्यापारी’ के सामूहिक बहुवचन को उचित ठहराता है।
- source_word: עֹבֵר יָם
  choice: जो समुद्र पार करते हैं
  rationale: एकवचन कृदन्त सामूहिक व्यापारी-वर्ग की समुद्री गतिविधि बताता है। हिन्दी में संबंधवाचक उपवाक्य इस निरंतर/विशिष्ट गतिविधि को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִלְאוּךְ
  choice: तुम्हें भर चुके हैं
  rationale: रूप में बहुवचन कर्ता और स्त्रीलिंग एकवचन कर्म-प्रत्यय है। ‘तुम्हें भर चुके हैं’ मूल क्रिया מלא का सीधा बिंब बनाए रखता है और ‘तुम’ से संबोधित तटवर्ती प्रदेश की ओर संकेत करता है।
theological_decisions:
- issue: व्यापारी का व्याकरणिक एकवचन और क्रिया का बहुवचन
  choice: सामूहिक अर्थ को हिन्दी में ‘सीदोन के व्यापारी … भर चुके हैं’ से व्यक्त किया गया।
  alternative: ‘सीदोन का व्यापारी … तुम्हें भर चुका है।’
  rationale: हिब्रू में סֹחֵר और עֹבֵר एकवचन हैं, जबकि מִלְאוּךְ बहुवचन कर्ता दर्शाता है। हिन्दी का बहुवचन मूल की सामूहिकता और क्रिया-सामंजस्य को स्पष्ट करता है, बिना किसी धर्मसिद्धान्तगत निष्कर्ष के।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संबोधन के लिए ‘हे’ जोड़े बिना ‘निवासियो’ का प्रत्यक्ष संबोधन पर्याप्त और स्वाभाविक है। विस्मयादिबोधक चिह्न आज्ञा और भविष्यद्वाणी की तीव्रता स्पष्ट करता है।
