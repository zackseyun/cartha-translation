  yaml_path: translation/ot/isaiah/023/010.yaml
  text: Pass through your land like the Nile[a], daughter of Tarshish[c][b]; there is no restraint anymore.
translation:
  language: hi
  text: हे तर्शीश की बेटी, नील नदी के समान अपने देश से होकर जा[a]; अब कोई बंधन नहीं रहा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नील नदी के समान अपने देश में फैल जा।” इब्रानी क्रिया का मूल अर्थ “पार करना” या “होकर जाना” है, पर नील नदी की उपमा बाढ़ की तरह फैलने का भाव भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: “बंधन” के लिए प्रयुक्त इब्रानी शब्द दुर्लभ है। इसका अर्थ “बाँध,” “रोक,” “बंदरगाह” या “लंगर बाँधने की रस्सी” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרִי
  choice: फैल जा
  rationale: यह עבר का स्त्रीलिंग एकवचन आज्ञार्थक रूप है, जिसका मूल अर्थ ‘पार करना/होकर जाना’ है। पर ‘नील नदी के समान’ उपमा यहाँ बाढ़ के पानी की तरह पूरे देश में फैलने का भाव देती है; इसलिए मुख्य पाठ में स्वाभाविक हिंदी ‘फैल जा’ रखा गया है, जबकि मूल क्रिया का अधिक शाब्दिक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: אַרְצֵךְ
  choice: अपने देश में
  rationale: ארץ पर द्वितीय पुरुष स्त्रीलिंग एकवचन प्रत्यय है। संबोधन तर्शीश से है; आधुनिक हिंदी में ‘अपने देश में’ स्वाभाविक और स्पष्ट है।
- source_word: כיאור
  choice: नील नदी के समान
  rationale: יְאֹר प्रायः नील नदी या उसकी धारा को सूचित करता है। ‘नील नदी’ सामान्य पाठक के लिए स्पष्ट है और बाढ़ की काव्यात्मक छवि बनाए रखता है।
- source_word: בת תרשיש
  choice: हे तर्शीश की बेटी
  rationale: भविष्यद्वाणी की मानवीकरण-युक्त अभिव्यक्ति को बनाए रखा गया है। ‘हे’ प्रत्यक्ष संबोधन को हिंदी में स्पष्ट करता है।
- source_word: אין
  choice: नहीं
  rationale: अस्तित्व के निषेध को अगले पदबंध के साथ स्वाभाविक हिंदी में व्यक्त किया गया है।
- source_word: מזח
  choice: बंधन
  rationale: यह दुर्लभ और अनिश्चित शब्द किसी बाँधने, रोकने या सुरक्षित बाँधकर रखने वाली वस्तु का अर्थ दे सकता है। ‘बंधन’ व्यापक अर्थ को बनाए रखता है और ‘बंदरगाह’, ‘बाँध’ या ‘लंगर की रस्सी’ जैसे अधिक संकीर्ण अर्थों को मुख्य पाठ में निश्चित नहीं करता।
- source_word: עוד
  choice: अब ... नहीं रहा
  rationale: निषेध के साथ עוד का अर्थ ‘अब और नहीं/अब नहीं रहा’ है; यह पहले विद्यमान बंधन के समाप्त होने को व्यक्त करता है।
