    issue: The phrase “तर्शीश को पार चले जाओ” is structurally ambiguous in Hindi.
    rationale: It may suggest crossing or passing beyond Tarshish, whereas the directional ending on תַּרְשִׁישָׁה presents Tarshish as the destination/direction of the commanded crossing.
