lexical_decisions:
- source_word: עִבְרוּ
  choice: पार चले जाओ
  rationale: बहुवचन आज्ञार्थक क्रिया गति और पार जाने का भाव व्यक्त करती है; यह समुद्री यात्रा या पलायन जैसी अनिश्चित बातों को अनावश्यक रूप से स्पष्ट नहीं करती।
- source_word: תַּרְשִׁישָׁה
  choice: तर्शीश को
  rationale: स्थानवाचक नाम के साथ लगा दिशासूचक ה तर्शीश की ओर गति बताता है; हिंदी में ‘तर्शीश को ... चले जाओ’ स्वाभाविक रूप से गंतव्य व्यक्त करता है।
- source_word: הֵילִילוּ
  choice: विलाप करो
  rationale: यह बहुवचन आज्ञार्थक रूप तीव्र शोकपूर्ण पुकार दर्शाता है; ‘विलाप करो’ आधुनिक, गरिमापूर्ण और संदर्भानुकूल है।
- source_word: יֹשְׁבֵי
  choice: निवासियो
  rationale: संज्ञा की तरह प्रयुक्त कृदंत को सीधे संबोधन में ‘निवासियो’ कहना हिंदी में स्वाभाविक और संक्षिप्त है।
- source_word: אִי
  choice: तटवर्ती प्रदेश
  rationale: यह शब्द द्वीप अथवा समुद्री तटवर्ती भूभाग दोनों को सूचित कर सकता है। सूर और तर्शीश के समुद्री संदर्भ में ‘तटवर्ती प्रदेश’ उपयुक्त है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
