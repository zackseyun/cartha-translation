id: ISA.23.11
reference: Isaiah 23:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יָד/וֹ֙ נָטָ֣ה עַל הַ/יָּ֔ם הִרְגִּ֖יז מַמְלָכ֑וֹת יְהוָה֙ צִוָּ֣ה אֶל כְּנַ֔עַן לַ/שְׁמִ֖ד מָעֻזְנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/011.yaml
  text: He has stretched out his hand over the sea[a]; he has made kingdoms tremble. Yahweh has commanded concerning Canaan[c][b], to destroy her strongholds.
translation:
  language: hi
  text: उसने समुद्र के ऊपर[a] अपना हाथ फैलाया है; उसने राज्यों को कांपने पर विवश किया है। याहवे ने कनान[b] के विषय में आज्ञा दी है कि उसके गढ़ों[c] को नष्ट कर दिया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समुद्र के विरुद्ध।” इब्रानी पूर्वसर्ग का यहाँ एक से अधिक अर्थ संभव है।
    reason: alternative_reading
  - marker: b
    text: यहाँ “कनान” से संभवतः सोर से जुड़ा फ़ीनीकी क्षेत्र अभिप्रेत है।
    reason: cultural_note
  - marker: c
    text: या, “उसके किलों।” इब्रानी में स्त्रीलिंग एकवचन प्रत्यय है, जो भूमि या नगर के मानवीकरण के अनुरूप है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹ נָטָה
  choice: उसने अपना हाथ बढ़ाया है
  rationale: यह अनुवाद परमेश्वर की सक्रिय सामर्थ्य और न्याय के ठोस मानवीकरण को बनाए रखता है; इसे केवल ‘अपनी शक्ति दिखाई’ जैसे अमूर्त कथन में नहीं बदलता।
- source_word: עַל הַיָּם
  choice: समुद्र पर
  rationale: עַל के सामान्य स्थानिक अर्थ ‘पर/ऊपर’ को मुख्य पाठ में रखा गया है। संदर्भ में विरोध या न्याय का भाव मौजूद है, पर यहाँ ‘के विरुद्ध’ करना आवश्यक नहीं।
- source_word: הִרְגִּיז מַמְלָכוֹת
  choice: उसने राज्यों को कंपा दिया है
  rationale: हिफ़ील रूप कारणवाचक है और राज्यों में भय, हलचल या थरथराहट उत्पन्न करने का भाव देता है। ‘कंपा दिया’ काव्यात्मक और स्वाभाविक हिन्दी है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में आए परमेश्वर के व्यक्तिगत नाम को उपाधि से प्रतिस्थापित न करके हिन्दी लिप्यंतरण में रखा गया है।
- source_word: צִוָּה אֶל כְּנַעַן
  choice: कनान के विषय में आज्ञा दी है
  rationale: צוה के बाद असामान्य אֶל यहाँ आज्ञा के लक्ष्य या विषय को सूचित कर सकता है। ‘के विषय में’ अनावश्यक रूप से प्राप्तकर्ता या शत्रुतापूर्ण दिशा निश्चित नहीं करता।
- source_word: לַשְׁמִיד
  choice: नष्ट कर दिया जाए
  rationale: उद्देश्यसूचक धातुरूप को हिन्दी में स्वाभाविक कर्मवाच्य उपवाक्य से व्यक्त किया गया है, क्योंकि आज्ञा पाने वाला कर्ता पाठ में व्यक्त नहीं है।
- source_word: מָעֻזְנֶיהָ
  choice: उसके गढ़ों
  rationale: מָעוֹז दृढ़ या सुरक्षित स्थान को सूचित करता है। ‘गढ़’ सैन्य-राजनीतिक संदर्भ में संक्षिप्त और सहज है; स्त्रीलिंग एकवचन प्रत्यय का हिन्दी रूप ‘उसके’ स्वाभाविक रूप से भूमि/प्रदेश की ओर संकेत करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। उसका लिप्यंतरण नाम और उपाधि के भेद को सुरक्षित रखता है।
- issue: כְּנַעַן का ऐतिहासिक नाम या संदर्भगत अर्थ
  choice: मुख्य पाठ में ‘कनान’, टिप्पणी में फ़ीनीकी क्षेत्र का संकेत
  alternative: मुख्य पाठ में ‘फ़ीनीकिया’
  rationale: मूल भौगोलिक नाम को बनाए रखा गया है; यशायाह 23 में सोर और उसके फ़ीनीकी परिवेश से संबंध को टिप्पणी में समझाया गया है, ताकि व्याख्या मूल नाम का स्थान न ले।
- issue: מָעֻזְנֶיהָ के स्त्रीलिंग प्रत्यय का संदर्भ
  choice: ‘उसके गढ़ों’—कनान/प्रदेश का मानवीकरण खुला रखा गया
  alternative: ‘उस नगर के गढ़ों’ या ‘उसके किलों’
  rationale: मूल में स्त्रीलिंग एकवचन प्रत्यय है, पर उसका संदर्भ भूमि, क्षेत्र या मानवीकृत नगर हो सकता है। अनुवाद उस अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण, सहज भविष्यद्वक्तीय शैली अपनाई गई है। समानांतर उपवाक्यों और न्याय की सशक्त छवि को रखा गया है। मुख्य पाठ में अनावश्यक व्याख्या से बचते हुए ऐतिहासिक संदर्भ और शाब्दिक विकल्प टिप्पणियों में दिए गए हैं।
