  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘पीड़ा में तड़प उठेंगे’ मूल क्रिया की तीव्र शारीरिक व्यथा को बनाए रखता है। सर्वनाम ‘वे’ का संदर्भ प्रसंग से मिस्र के लोगों की ओर है, पर मूल की तरह उन्हें स्पष्ट रूप से नामित नहीं किया गया।
