translation:
  language: hi
  text: जब सोर का समाचार मिस्र तक पहुँचेगा, तब वे उस समाचार को सुनकर तड़प उठेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: जब
  rationale: यहाँ यह पद तुलनात्मक अर्थ के बजाय उस समय को बताता है जब समाचार मिस्र पहुँचता है।
- source_word: שֵׁמַע
  choice: समाचार
  rationale: संज्ञा का अर्थ ‘समाचार/खबर’ है; हिन्दी में ‘समाचार पहुँचना’ स्वाभाविक है और पहले खंड की निहित क्रिया को स्पष्ट करता है।
- source_word: לְמִצְרָיִם
  choice: मिस्र पहुँचेगा
  rationale: 'ल उपसर्ग को दिशासूचक माना गया है: समाचार मिस्र तक पहुँचता है।'
- source_word: יָחִילוּ
  choice: पीड़ा में तड़प उठेंगे
  rationale: חול का यह रूप शारीरिक रूप से तड़पने, काँपने या प्रसव-जैसी व्यथा का सजीव भाव रखता है; यह हिन्दी अभिव्यक्ति उस तीव्र संकट को स्वाभाविक रूप में व्यक्त करती है।
- source_word: כְּשֵׁמַע
  choice: समाचार से
  rationale: כְּ यहाँ उस समाचार को व्यथा का अवसर अथवा कारण बताता है; ‘से’ हिन्दी में इसे संक्षेप और स्वाभाविकता से व्यक्त करता है।
- source_word: צֹר
  choice: सोर
  rationale: צֹר स्थान-नाम का प्रचलित हिन्दी बाइबलीय रूप ‘सोर’ है।
theological_decisions: []
