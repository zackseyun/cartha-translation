source:
  edition: WLC
  text: מִ֚י יָעַ֣ץ זֹ֔את עַל צֹ֖ר הַ/מַּֽעֲטִירָ֑ה אֲשֶׁ֤ר סֹחֲרֶ֨י/ה֙ שָׂרִ֔ים כִּנְעָנֶ֖י/הָ נִכְבַּדֵּי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/008.yaml
  text: Who has planned this against Tyre[a], the bestower of crowns, whose merchants are princes[b], whose traders are the honored ones of the earth?
translation:
  language: hi
  text: किसने मुकुट प्रदान करनेवाले सोर के विरुद्ध यह योजना बनाई है—उसके व्यापारी राजकुमार हैं, और उसके सौदागर[a] पृथ्वी के प्रतिष्ठित लोग हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ “उसके कनानी” है; यहाँ इस शब्द का अर्थ संभवतः “व्यापारी” या “सौदागर” है।
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יָעַץ זֹאת עַל
  choice: किसने ... के विरुद्ध यह योजना बनाई है
  rationale: यह आलंकारिक प्रश्न है। יָעַץ यहाँ सोच-समझकर योजना बनाने को और עַל न्याय के प्रतिकूल लक्ष्य को व्यक्त करता है।
- source_word: צֹר
  choice: सोर
  rationale: यशायाह में इस प्राचीन फोनीकी नगर के लिए प्रचलित हिन्दी बाइबलीय नाम।
- source_word: הַמַּעֲטִירָה
  choice: मुकुट पहनानेवाले
  rationale: עטר से बना स्त्रीलिंग कृदन्त सोर को मुकुट प्रदान करनेवाली सत्ता के रूप में चित्रित करता है; यह रूपक को सीधे बनाए रखता है। हिन्दी में नगर का नाम व्याकरणतः पुल्लिंग होने के कारण 'वाले' स्वाभाविक है।
- source_word: סֹחֲרֶיהָ שָׂרִים
  choice: उसके व्यापारी राजकुमार हैं
  rationale: סֹחֵר वाणिज्य करनेवाले व्यक्ति और שַׂר उच्च पद अथवा राजसी प्रतिष्ठा को दर्शाता है; 'राजकुमार' काव्यात्मक सामाजिक ऊँचाई सुरक्षित रखता है।
- source_word: כִּנְעָנֶיהָ
  choice: उसके सौदागर
  rationale: शाब्दिक अर्थ 'उसके कनानी' है, पर व्यापारिक संदर्भ और समानांतर पंक्ति में यह 'व्यापारियों/सौदागरों' के अर्थ में प्रयुक्त है। वास्तविक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: נִכְבַּדֵּי אָרֶץ
  choice: पृथ्वी के प्रतिष्ठित लोग
  rationale: נכבד सामाजिक भार, सम्मान और प्रतिष्ठा का बोध देता है; ארץ यहाँ सोर के अंतरराष्ट्रीय प्रभाव के कारण 'पृथ्वी' के अर्थ में उपयुक्त है।
theological_decisions:
- issue: मुकुट देने की छवि का आशय
  choice: रूपक को 'मुकुट पहनानेवाले' के रूप में खुला रखा गया
  alternative: राजाओं को नियुक्त करनेवाला या उपनिवेशों को समृद्ध करनेवाला
  rationale: मूल पाठ क्रिया का विशिष्ट ऐतिहासिक अथवा आर्थिक आशय स्पष्ट नहीं करता; इसलिए अनुवाद उसे किसी एक व्याख्या तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक है। वाक्य की आलंकारिक प्रश्न-रचना तथा सोर की विश्वव्यापी प्रतिष्ठा का आरोही समानांतर विन्यास बनाए रखा गया है।
