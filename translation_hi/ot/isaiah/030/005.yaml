- source_word: עַל
  choice: के कारण
  rationale: यहाँ पूर्वसर्ग कारण या अवसर बताता है।
- source_word: עַם
  choice: ऐसे लोगों
  rationale: हिब्रू का एकवचन सामूहिक संज्ञा है; हिन्दी में ‘ऐसे लोगों’ से उस राष्ट्र-समुदाय का संकेत स्वाभाविक रूप से मिलता है, बिना पद में मिस्र को स्पष्ट जोड़ने के।
- source_word: לֹא יוֹעִילוּ לָמוֹ
  choice: जो उनके किसी काम नहीं आ सकते
  rationale: יעל के उपयोगिता या लाभ के अर्थ को साधारण, स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: לְעֵזֶר
  choice: सहायता के लिए
  rationale: संज्ञात्मक रचना और अगले समानांतर पद को बनाए रखता है।
- source_word: לְהוֹעִיל
  choice: लाभ के लिए
  rationale: उपयोगिता या फ़ायदे का भाव रखता है और ‘सहायता के लिए’ के साथ समानांतर है।
- source_word: כִּי
  choice: बल्कि
  rationale: यहाँ पहले निषेध के बाद विपरीत परिणाम प्रस्तुत किया गया है।
- source_word: לְבֹשֶׁת
  choice: लज्जा के लिए
  rationale: प्रत्यक्ष और प्रसंगानुकूल अर्थ, जो सार्वजनिक विफलता और बदनामी को व्यक्त करता है।
- source_word: וְגַם
  choice: और
  rationale: हिन्दी में स्वाभाविक समन्वय; दूसरे परिणाम को जोड़ता है।
- source_word: לְחֶרְפָּה
  choice: अपमान के लिए
  rationale: חֶרְפָּה की सार्वजनिक निंदा, तिरस्कार और बदनामी का अर्थ स्पष्ट करता है।
