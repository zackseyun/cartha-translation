  yaml_path: translation/ot/isaiah/030/005.yaml
  text: Everyone is put to shame because of a people that cannot profit them[a]—who are not for help and not for profit, but for shame and also for reproach.
translation:
  language: hi
  text: ऐसे लोगों के कारण सभी लज्जित हुए हैं[a], जो उनके किसी काम नहीं आ सकते—न सहायता के लिए, न लाभ के लिए, बल्कि लज्जा और अपमान के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू शब्द הבאיש का अर्थ यहाँ निश्चित नहीं है। इसका भाव ‘दुर्गंध फैलाना’ या ‘घृणित ठहराना’ भी हो सकता है; पर असफल संधि के इस प्रसंग में और ‘लज्जा’ तथा ‘अपमान’ के समानांतर होने के कारण यहाँ ‘लज्जित हुए हैं’ लिया गया है।
    reason: lexical_alternative
