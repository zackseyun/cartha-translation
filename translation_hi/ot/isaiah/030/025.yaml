  text: וְ/הָיָ֣ה עַל כָּל הַ֣ר גָּבֹ֗הַ וְ/עַל֙ כָּל גִּבְעָ֣ה נִשָּׂאָ֔ה פְּלָגִ֖ים יִבְלֵי מָ֑יִם בְּ/יוֹם֙ הֶ֣רֶג רָ֔ב בִּ/נְפֹ֖ל מִגְדָּלִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/025.yaml
  text: And on every high mountain and on every lofty hill there will be streams[a], channels of water, on the day of great slaughter, when the towers fall.
translation:
  language: hi
  text: और हर ऊँचे पहाड़ पर और हर उन्नत पहाड़ी पर जलधाराएँ और जल-प्रवाह[a] होंगे—बड़े संहार के दिन, जब मीनारें गिरेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जलमार्ग,” “छोटी धाराएँ,” अथवा “छोटी नदियाँ।” हिब्रू शब्द अपेक्षाकृत दुर्लभ है और उसका सटीक आशय अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: होंगी
  rationale: हिब्रू अस्तित्वसूचक भविष्य को स्वाभाविक हिन्दी में व्यक्त करता है और बहुवचन जलधाराओं तथा नहरों से मेल खाता है।
- source_word: הַר גָּבֹהַ
  choice: ऊँचा पहाड़
  rationale: भौगोलिक ऊँचाई का सीधा, प्रचलित और स्वाभाविक अनुवाद।
- source_word: גִּבְעָה נִשָּׂאָה
  choice: उन्नत पहाड़ी
  rationale: नִשָּׂאָה के ‘ऊपर उठी हुई’ भाव को गरिमापूर्ण आधुनिक हिन्दी में बनाए रखता है।
- source_word: פְּלָגִים
  choice: जलधाराएँ
  rationale: इस प्रसंग में बहते जल की धाराओं को दर्शाता है; यह יִבְלֵי מָיִם से शब्दगत भेद भी बनाए रखता है।
- source_word: יִבְלֵי מָיִם
  choice: पानी की नहरें
  rationale: बहते पानी के मार्गों की छवि देता है। हिब्रू पद दुर्लभ है और उसका सटीक अर्थ अनिश्चित है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: בְּיוֹם הֶרֶג רָב
  choice: उस बड़े संहार के दिन
  rationale: न्याय की गंभीर भविष्यद्वाणी-संबंधी भाषा को स्पष्ट और प्रभावशाली हिन्दी में सुरक्षित रखता है।
- source_word: בִּנְפֹל מִגְדָּלִים
  choice: जब मीनारें गिरेंगी
  rationale: पूर्वसर्ग सहित क्रियार्थक रूप का कालवाचक अर्थ स्वाभाविक हिन्दी में व्यक्त करता है; ‘मीनारें’ को अनिश्चित बहुवचन ही रखा गया है।
theological_decisions:
- issue: प्रचुर जल और न्याय के दृश्य का परस्पर संबंध
  choice: आशीष की छवि (‘जलधाराएँ, पानी की नहरें’) और न्याय की छवि (‘बड़े संहार का दिन’, ‘मीनारें गिरेंगी’) दोनों को साथ रखा गया है, उनके संबंध को स्पष्ट करके नहीं समझाया गया।
  alternative: इसे मुख्यतः न्याय के बाद की अंतिम पुनर्स्थापना अथवा युद्ध में उलटफेर का चित्र मानकर अधिक स्पष्ट करना।
  rationale: हिब्रू पाठ उर्वरता और विनाश को बिना व्याख्या के पास-पास रखता है; अनुवाद उसी वास्तविक धर्मवैचारिक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण भविष्यद्वाणी-संबंधी गद्य। ‘जलधाराएँ’ साहित्यिक किंतु सामान्यतः बोधगम्य है; ‘पानी की नहरें’ अधिक सहज पद है। वाक्य में दीर्घ विराम न्याय के दृश्य की ओर तीखा संक्रमण दिखाता है।
