source:
  edition: WLC
  text: וְ/נָתַ֨ן לָ/כֶ֧ם אֲדֹנָ֛/י לֶ֥חֶם צָ֖ר וּ/מַ֣יִם לָ֑חַץ וְ/לֹֽא יִכָּנֵ֥ף עוֹד֙ מוֹרֶ֔י/ךָ וְ/הָי֥וּ עֵינֶ֖י/ךָ רֹא֥וֹת אֶת מוֹרֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/020.yaml
  text: And the Lord will give you bread of distress and water of oppression[a], yet your teacher will no longer hide himself[b], and your eyes will see your teacher.
translation:
  language: hi
  text: और प्रभु तुम्हें दुःख की रोटी और क्लेश का जल देंगे[a], फिर भी तुम्हारा शिक्षक अब अपने को नहीं छिपाएगा[b]; तुम्हारी आँखें तुम्हारे शिक्षक को देखेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विपत्ति की रोटी और दुःख का जल।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी का अर्थ “तुम्हारे शिक्षक अब छिपे नहीं रहेंगे” भी हो सकता है; पारम्परिक अनुवाद है, “तुम्हारा शिक्षक अब किसी कोने में हटा नहीं दिया जाएगा।”
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह परमेश्वर के लिए प्रयुक्त स्वामित्व-सूचक उपाधि का मानक, गरिमापूर्ण और सहज हिन्दी रूप है।
- source_word: לֶחֶם צָר
  choice: संकट की रोटी
  rationale: यह अनुवाद कठिनाई से चिह्नित भोजन के मूल रूपक को बनाए रखता है और צָר के संकट/विपत्ति-संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַיִם לָחַץ
  choice: उत्पीड़न का पानी
  rationale: לָחַץ में दबाव, उत्पीड़न और क्लेश का भाव है; यह चयन पहले पदबंध के समानांतर रूपक और संज्ञा की ठोस शक्ति को बनाए रखता है।
- source_word: יִכָּנֵף
  choice: अपने को नहीं छिपाएगा
  rationale: כנף के निफ़अल रूप का सम्भावित अर्थ छिप जाना या ओझल होना है। एकवचन शिक्षक को कर्ता मानते हुए यह आधुनिक हिन्दी में स्वाभाविक है; अन्य सम्भव पाठ को पादटिप्पणी में रखा गया है।
- source_word: מוֹרֶיךָ
  choice: तुम्हारा शिक्षक
  rationale: इब्रानी रूप आकार की दृष्टि से बहुवचन समझा जा सकता है, पर यहाँ एकवचन कर्ता के अनुरूप सम्मानसूचक अथवा सामूहिक एकवचन अर्थ सम्भव है। मुख्य पाठ में एकवचन रखा गया है और बहुवचन सम्भावना पादटिप्पणी में दी गई है।
- source_word: עֵינֶיךָ רֹאוֹת
  choice: तुम्हारी आँखें ... देखेंगी
  rationale: यह प्रत्यक्ष दर्शन पर इब्रानी बल को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
theological_decisions:
- issue: מוֹרֶיךָ (‘तुम्हारा शिक्षक’) की पहचान
  choice: मुख्य पाठ में सामान्य ‘तुम्हारा शिक्षक’, बिना इसे परमेश्वर के रूप में स्पष्ट किए
  alternative: ‘तुम्हारे शिक्षक’, अर्थात मानवीय शिक्षक या भविष्यद्वक्ता; अथवा सन्दर्भ से निहित कोई दिव्य शिक्षक
  rationale: निकटवर्ती सन्दर्भ दिव्य और मध्यस्थ मानवीय शिक्षा—दोनों सम्भावनाओं को खुला रखता है। इसलिए अनुवाद किसी एक धर्मवैज्ञानिक पहचान को आरोपित नहीं करता।
- issue: מוֹרֶיךָ की वचन-संख्या
  choice: मुख्य पाठ में एकवचन ‘शिक्षक’
  alternative: बहुवचन ‘शिक्षकगण/शिक्षक’
  rationale: लिखित इब्रानी रूप बहुवचन अर्थ की अनुमति देता है, जबकि निकट क्रिया एकवचन पठन का समर्थन करती है। मुख्य पाठ और पादटिप्पणी मिलकर इस तनाव को सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। ‘संकट की रोटी’ और ‘उत्पीड़न का पानी’ मूल रूपकों को बनाए रखते हैं। ‘तुम’ का प्रयोग सामूहिक सम्बोधन की निकटता को सुरक्षित रखता है, जबकि ‘प्रभु ... देंगे’ हिन्दी की सम्मानसूचक रीति के अनुसार है।
