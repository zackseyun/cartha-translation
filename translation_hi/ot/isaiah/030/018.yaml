  text: וְ/לָ/כֵ֞ן יְחַכֶּ֤ה יְהוָה֙ לַֽ/חֲנַנְ/כֶ֔ם וְ/לָ/כֵ֥ן יָר֖וּם לְ/רַֽחֶמְ/כֶ֑ם כִּֽי אֱלֹהֵ֤י מִשְׁפָּט֙ יְהוָ֔ה אַשְׁרֵ֖י כָּל ח֥וֹכֵי לֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/018.yaml
  text: Therefore Yahweh waits to be gracious to you[a], and therefore he rises up to show you mercy; for Yahweh is a God of justice. Blessed are all who wait for him.
translation:
  language: hi
  text: इसलिए यहोवा तुम पर अनुग्रह करने के लिए प्रतीक्षा करता है, और इसलिए वह तुम पर दया करने के लिए उठ खड़ा होता है[a]; क्योंकि यहोवा न्याय का परमेश्वर है। धन्य हैं वे सभी जो उसकी प्रतीक्षा करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह तुम पर दया करने के लिए ऊँचा होता है”; अथवा, “वह तुम पर दया करने के लिए अपने को ऊँचा करता है।”
    reason: יָרוּם का अर्थ यहाँ ‘उठना’, ‘ऊँचा होना’ या ‘अपने को ऊँचा करना’ समझा जा सकता है।
lexical_decisions:
- source_word: וְלָכֵן
  choice: इसलिए
  rationale: यह निष्कर्ष अथवा परिणाम की ओर संकेत करता है और दोनों समानांतर उपवाक्यों का संबंध बनाए रखता है।
- source_word: יְחַכֶּה
  choice: प्रतीक्षा करता है
  rationale: חכה का सीधा अर्थ ‘प्रतीक्षा करना’ है। इससे अनुग्रह में प्रतीत होने वाले विलंब का तनाव बना रहता है और पद के अंत में उसी धातु की पुनरावृत्ति भी सुरक्षित रहती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुराक्षरीय ईश्वरीय नाम को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: לַחֲנַנְכֶם
  choice: तुम पर अनुग्रह करने
  rationale: חנן कृपा अथवा अनुग्रह दिखाने को व्यक्त करता है। ‘अनुग्रह’ को अगले רחם के ‘दया’ से अलग रखा गया है।
- source_word: יָרוּם
  choice: उठ खड़ा होता है
  rationale: רום के ‘ऊँचा होना/उठना’ भाव को यहाँ करुणामय हस्तक्षेप के लिए सक्रिय रूप से उठने के अर्थ में लिया गया है। ‘महान ठहरता है’ या ‘अपने को ऊँचा करता है’ भी सम्भव हैं और पादटिप्पणी में दिए गए हैं।
- source_word: לְרַחֶמְכֶם
  choice: तुम पर दया करने के लिए
  rationale: רחם करुणा अथवा दया दिखाने को बताता है; यह सहज हिन्दी है और पहले आए ‘अनुग्रह’ से अर्थगत भेद बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछली बात का आधार प्रस्तुत करता है।
- source_word: אֱלֹהֵי מִשְׁפָּט
  choice: न्याय का परमेश्वर
  rationale: समास परमेश्वर के चरित्र और न्यायपूर्ण शासन को दर्शाता है; यहाँ ‘न्याय’ प्रसंग में ‘दण्डादेश’ से अधिक व्यापक और उपयुक्त है।
- source_word: אַשְׁרֵי
  choice: धन्य हैं
  rationale: यह ज्ञान-साहित्य की आशीर्वचन शैली का स्वाभाविक और धर्मवैचारिक रूप से समृद्ध हिन्दी अनुवाद है।
- source_word: כָּל חוֹכֵי לוֹ
  choice: वे सभी जो उसकी प्रतीक्षा करते हैं
  rationale: ‘सभी’ सार्वभौमिकता बनाए रखता है और ‘प्रतीक्षा’ पहले आए חכה की साहित्यिक प्रतिध्वनि सुरक्षित रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; अतः उसे उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप से प्रस्तुत किया गया है।
- issue: יָרוּם का प्रसंगगत अर्थ
  choice: वह ... उठ खड़ा होता है
  alternative: वह महान ठहरता है / वह अपने को ऊँचा करता है
  rationale: समानांतर वाक्य और उसके बाद आने वाला करुणामय कार्य सक्रिय हस्तक्षेप की ओर संकेत कर सकते हैं, पर इब्रानी क्रिया उत्कर्ष अथवा ऊँचा होने का अर्थ भी दे सकती है। वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘प्रतीक्षा’ की पुनरावृत्ति मूल के शब्दालंकार को सुरक्षित रखती है; ‘अनुग्रह’ और ‘दया’ अलग इब्रानी मूलों का भेद बनाए रखते हैं।
