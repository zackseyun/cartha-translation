  text: כִּֽי עָר֤וּךְ מֵֽ/אֶתְמוּל֙ תָּפְתֶּ֔ה גַּם הוא לַ/מֶּ֥לֶךְ הוּכָ֖ן הֶעְמִ֣יק הִרְחִ֑ב מְדֻרָתָ֗/הּ אֵ֤שׁ וְ/עֵצִים֙ הַרְבֵּ֔ה נִשְׁמַ֤ת יְהוָה֙ כְּ/נַ֣חַל גָּפְרִ֔ית בֹּעֲרָ֖ה בָּֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/033.yaml
  text: For Topheth has long been prepared[a]; indeed, it is made ready for the king. He has made it deep and wide, with a pyre of fire and wood in abundance. The breath of Yahweh, like a stream of sulfur[c][b], kindles it.
translation:
  language: hi
  text: क्योंकि तोपेत[a] बहुत पहले से तैयार किया गया है[b]; सचमुच, वह राजा के लिए तैयार है। उसने उसे गहरा और चौड़ा बनाया है; उसकी चिता में आग और लकड़ी बहुतायत से हैं। याहवे की साँस गंधक[c] की धारा के समान उसे धधकाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तोपेथ।’ यह एक स्थान-नाम है जो जलाने और न्याय की छवि से जुड़ा है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘कल से’; यहाँ इसका अर्थ है कि इसे पहले से या बहुत पहले तैयार किया गया था।
    reason: lexical_alternative
  - marker: c
    text: पारंपरिक अनुवादों में ‘गंधक’ के लिए कभी-कभी ‘गन्धक’ या अंग्रेज़ी में ‘ब्रिमस्टोन’ मिलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּפְתֶּה
  choice: तोपेत
  rationale: इसे अनूदित करने के बजाय स्थान-नाम के रूप में लिप्यंतरित किया गया है; यह दहन और न्याय की छवि से जुड़ा नाम है।
- source_word: עָרוּךְ מֵאֶתְמוּל
  choice: बहुत पहले से तैयार किया गया है
  rationale: עָרוּךְ तैयारी की परिणामी अवस्था बताता है और מֵאֶתְמוּל का शाब्दिक अर्थ ‘कल से’ है, पर यहाँ मुहावरे के रूप में पूर्वकाल से तैयारी का भाव देता है।
- source_word: גַּם הוא לַמֶּלֶךְ הוּכָן
  choice: सचमुच, वह राजा के लिए तैयार है
  rationale: גַּם הוא के बलाघात को ‘सचमुच’ से व्यक्त किया गया है। ‘राजा’ की पहचान पाठ में स्पष्ट न होने के कारण उसे और विशिष्ट नहीं किया गया।
- source_word: הֶעְמִיק הִרְחִב
  choice: उसने उसे गहरा और चौड़ा बनाया है
  rationale: दोनों हिफ़ील क्रियाएँ पुल्लिंग एकवचन कर्ता को सूचित करती हैं; हिंदी में ‘उसने’ मूल पाठ की तरह कर्ता की पहचान को अप्रकट रखता है।
- source_word: מְדֻרָתָהּ
  choice: उसकी चिता
  rationale: यह जलाने के स्थान या ईंधन के ढेर को दर्शाता है; न्याय और दहन के प्रसंग में ‘चिता’ स्वाभाविक और सजीव हिंदी है।
- source_word: אֵשׁ וְעֵצִים הַרְבֵּה
  choice: आग और लकड़ी बहुतायत से हैं
  rationale: הַרְבֵּה की प्रचुरता को स्पष्ट रखते हुए वाक्य को आधुनिक और सहज हिंदी में रखा गया है।
- source_word: נִשְׁמַת יְהוָה
  choice: याहवे की साँस
  rationale: נִשְׁמַת का सीधा अर्थ ‘साँस’ है और יְהוָה को उसके व्यक्तिगत नाम ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: כְּנַחַל גָּפְרִית
  choice: गंधक की धारा के समान
  rationale: נַחַל के प्रवाहित जल/धारा वाले बिंब और גָּפְרִית के आधुनिक हिंदी समतुल्य ‘गंधक’ को सुरक्षित रखा गया है।
- source_word: בֹּעֲרָה בָּהּ
  choice: उसे धधकाती है
  rationale: स्त्रीलिंग कृदंत का कर्ता ‘साँस’ है; ‘धधकाती है’ आग प्रज्वलित करने और उसे तीव्रता से जलाने का प्रसंगानुकूल भाव देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा-संबंधी व्यक्तिगत नाम सीधे आया है; उसका लिप्यंतरण नाम की विशिष्टता बनाए रखता है।
- issue: ‘राजा’ की पहचान
  choice: राजा
  alternative: अश्शूर का राजा / मोलेक
  rationale: हिब्रू पाठ केवल निश्चित पद ‘राजा’ कहता है। किसी विशेष ऐतिहासिक या उपासना-संबंधी पहचान को जोड़ना पाठ की वास्तविक अस्पष्टता को मिटा देता।
- issue: ‘उसने’ का कर्ता
  choice: कर्ता को ‘उसने’ के रूप में अनिर्दिष्ट रखा
  alternative: याहवे ने
  rationale: हिब्रू क्रियाओं में पुल्लिंग एकवचन कर्ता निहित है, पर उसका नाम इस खंड में नहीं दिया गया; इसलिए संभावित ईश्वरीय कर्ता को अनुवाद में स्पष्ट रूप से जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘तोपेत’ और ‘याहवे’ को नामों के रूप में लिप्यंतरित किया गया है। ‘चिता’ और ‘धधकाती’ दहन के तीखे काव्यात्मक बिंब को बनाए रखते हैं, जबकि राजा और क्रियाओं के कर्ता की मूल अस्पष्टता सुरक्षित है।
