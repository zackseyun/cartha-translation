  edition: WLC
  text: וְ/הָיָ֥ה לָ/כֶ֛ם מָע֥וֹז פַּרְעֹ֖ה לְ/בֹ֑שֶׁת וְ/הֶ/חָס֥וּת בְּ/צֵל מִצְרַ֖יִם לִ/כְלִמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/003.yaml
  text: Then Pharaoh’s stronghold will become your shame[b][a], and refuge in Egypt’s shadow your humiliation.
translation:
  language: hi
  text: तब फ़िरौन का बल तुम्हारे लिए लज्जा होगा, और मिस्र की छाया में शरण लेना तुम्हारे लिए अपमान होगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मिस्र की छाया’ मिस्र से सुरक्षा पाने की आशा का रूपक है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: तब ... होगा
  rationale: संदर्भ में वाव + क़ातल चेतावनी के परिणाम को भविष्यसूचक ढंग से व्यक्त करता है; ‘तब ... होगा’ आधुनिक हिन्दी में इस परिणाम को स्वाभाविक रूप से रखता है।
- source_word: לָכֶם
  choice: तुम्हारे लिए
  rationale: सम्बन्धसूचक पूर्वसर्ग यहाँ जिन लोगों पर प्रतिकूल परिणाम पड़ेगा, उन्हें सूचित करता है; ‘तुम्हारे लिए’ इसे स्पष्ट और स्वाभाविक रखता है।
- source_word: מָעוֹז
  choice: गढ़
  rationale: संज्ञा शक्ति, सुरक्षा या दृढ़ स्थान को दर्शाती है। ‘गढ़’ ठोस रूपक बनाए रखता है और अगले पदांश के חָסוּת से भेद भी बनाए रखता है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के शासक की उपाधि का प्रचलित हिन्दी रूप।
- source_word: לְבֹשֶׁת
  choice: लज्जा का कारण
  rationale: בֹּשֶׁת लज्जा या शर्म को व्यक्त करता है। ‘का कारण’ हिन्दी में परिणामसूचक לְ को स्वाभाविक रूप देता है।
- source_word: וְהֶחָסוּת
  choice: और ... शरण लेना
  rationale: यह संज्ञात्मक रूप शरण या आश्रय पाने को दर्शाता है; हिन्दी में क्रियात्मक संज्ञा ‘शरण लेना’ इस कार्य को स्पष्ट और सहज बनाती है।
- source_word: בְּצֵל
  choice: की छाया में
  rationale: मूल का सुरक्षात्मक छाया वाला रूपक सीधे बनाए रखा गया है।
- source_word: מִצְרַיִם
  choice: मिस्र
  rationale: स्थान-नाम का मानक हिन्दी रूप।
- source_word: לִכְלִמָּה
  choice: अपमान का कारण
  rationale: כְּלִמָּה तिरस्कारजनित अपमान या बेइज़्ज़ती को दर्शाता है। ‘अपमान’ पहले पदांश के ‘लज्जा’ से अर्थगत निकटता रखते हुए शब्दगत भेद बचाता है।
theological_decisions:
- issue: दो समानार्थी लज्जा-संज्ञाओं का भेद बनाए रखना
  choice: בֹּשֶׁת के लिए ‘लज्जा’ और כְּלִמָּה के लिए ‘अपमान’
  alternative: दोनों पदांशों में ‘लज्जा’ या ‘अपमान’ दोहराना
  rationale: इब्रानी समानांतरता में दोनों शब्द निकटार्थी पर अलग हैं। अलग हिन्दी शब्द मूल की काव्यात्मक तीव्रता और सूक्ष्म भेद को बिना अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़े बनाए रखते हैं।
- issue: מָעוֹז को स्थान या अमूर्त सुरक्षा के रूप में व्यक्त करना
  choice: ‘गढ़’ के रूप में ठोस रूपक बनाए रखना
  alternative: ‘आश्रय’ या ‘सुरक्षा’
  rationale: शब्द स्थान अथवा सुरक्षा-स्रोत दोनों अर्थ दे सकता है। ‘गढ़’ ठोस बिंब को सुरक्षित रखता है, जबकि पाठ का आशय फ़िरौन से अपेक्षित राजनीतिक सुरक्षा भी बना रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर वाक्य-विन्यास और ‘गढ़/शरण’, ‘लज्जा/अपमान’ के भेद मूल इब्रानी काव्य को दर्शाते हैं।
