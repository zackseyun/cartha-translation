  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। वाक्य की भविष्यद्वाणी-संबंधी गंभीरता तथा मरुभूमि की सजीव, भयावह छवि सुरक्षित है। भौगोलिक नाम ‘नेगेव’ मुख्य पाठ में रखा गया है और उसके सामान्य अर्थ ‘दक्षिण’ को पादटिप्पणी में बताया गया है।
