base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/006.yaml
  text: 'An oracle concerning the beasts of the Negev: through a land of distress and hardship[a], of lioness and lion, of viper and flying fiery serpent, they carry their wealth on the shoulders of donkeys and their treasures on the humps of camels[c][b], to a people who cannot profit them.'
translation:
  language: hi
  text: 'नेगेव के पशुओं के विषय में भविष्यवाणी[a]: संकट और क्लेश के देश से होकर—जहाँ सिंहनी और सिंह[b], विषैला साँप और उड़ता हुआ अग्निमय सर्प हैं—वे अपना धन गधों के कंधों पर और अपने खजाने ऊँटों के कूबड़ों पर ले जाते हैं, उन लोगों के पास जो उनके किसी काम नहीं आएँगे[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दक्षिण के पशुओं के विषय में बोझ।” मूल इब्रानी का पहला शब्द भविष्यद्वाणी की गंभीर घोषणा के लिए प्रयुक्त होता है और उसका अर्थ “बोझ” भी हो सकता है; “नेगेव” का अर्थ अधिक सामान्य रूप से “दक्षिण” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “सिंह और सिंह।” मूल इब्रानी में सिंह के लिए दो अलग शब्द हैं, पर इस प्रसंग में उनके बीच का ठीक भेद निश्चित नहीं है।
    reason: lexical_alternative
  - marker: c
    text: या, “जो उनकी सहायता नहीं करेंगे।” मूल इब्रानी क्रिया का अर्थ “लाभ पहुँचाना” या “सहायता करना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: घोषणा
  rationale: भविष्यद्वक्ताओं के शीर्षकों में यह शब्द किसी ईश्वरीय कथन या गंभीर घोषणा का परिचय देता है। ‘घोषणा’ आधुनिक हिन्दी में सहज है; ‘बोझ’ इसका अधिक शाब्दिक, पर यहाँ कुछ अस्पष्ट, विकल्प है।
- source_word: בַּהֲמוֹת נֶגֶב
  choice: नेगेव के पशु
  rationale: בַּהֲמוֹת पशुओं को दर्शाता है और इस प्रसंग में यात्रा में बोझ ढोने वाले पशुओं की ओर संकेत कर सकता है। נֶגֶב को विशिष्ट भौगोलिक नाम ‘नेगेव’ रखा गया है, जबकि ‘दक्षिण’ भी संभव है।
- source_word: בְּאֶרֶץ צָרָה וְצוּקָה
  choice: संकट और क्लेश के देश से होकर
  rationale: दोनों संज्ञाएँ निकटार्थी हैं और कठिनाई, दबाव तथा विपत्ति का बोध कराती हैं। प्रसंग यात्रा-मार्ग का है, इसलिए בְּ को ‘से होकर’ व्यक्त किया गया है।
- source_word: לָבִיא וָלַיִשׁ
  choice: सिंहनी और सिंह
  rationale: मूल में सिंह के लिए दो अलग शब्द हैं, पर उनके बीच का ठीक भेद अनिश्चित है। यह चयन उस भिन्नता को स्वाभाविक हिन्दी में बनाए रखता है; विकल्प पादटिप्पणी में दिया गया है।
- source_word: אֶפְעֶה
  choice: विषैला साँप
  rationale: यह किसी विषधर साँप का नाम है, जिसकी ठीक प्रजाति निश्चित नहीं है। सामान्य और स्पष्ट हिन्दी शब्दावली अनावश्यक प्रजातिगत विशिष्टता से बचती है।
- source_word: שָׂרָף מְעוֹפֵף
  choice: उड़ता हुआ अग्निमय सर्प
  rationale: शब्दसमूह की तीव्र और रहस्यमय छवि को यथासंभव बनाए रखा गया है; ‘अग्निमय’ उसके जलाने वाले विष या रूप से जुड़ा हो सकता है, किंतु अनिश्चितता को हल नहीं किया गया।
- source_word: יִשְׂאוּ
  choice: लादकर ... ले जाते हैं
  rationale: क्रिया यहाँ बोझ ढोने और माल पहुँचाने की क्रिया बताती है। हिन्दी में पशुओं पर वस्तुएँ ‘लादकर ले जाना’ स्वाभाविक है।
- source_word: עַל כֶּתֶף עֲיָרִים
  choice: गधों के कंधों पर
  rationale: כֶּתֶף का शाब्दिक अर्थ ‘कंधा’ है। इसे बनाए रखने से मूल बिंब और ऊँटों के कूबड़ों के साथ समानांतर रचना सुरक्षित रहती है।
- source_word: חֵילֵהֶם
  choice: अपना धन
  rationale: חַיִל शक्ति, साधन-संपत्ति या धन का अर्थ दे सकता है। मिस्र को बहुमूल्य वस्तुएँ भेजने के संदर्भ में ‘धन’ उपयुक्त है।
- source_word: עַל דַּבֶּשֶׁת גְּמַלִּים
  choice: ऊँटों के कूबड़ों पर
  rationale: דַּבֶּשֶׁת विशेष रूप से ऊँट के कूबड़ को दर्शाता है; इस सजीव विशिष्टता को सामान्य ‘पीठ’ में नहीं बदला गया।
- source_word: אֽוֹצְרֹתָם
  choice: अपने खजाने
  rationale: यह शब्द संचित बहुमूल्य वस्तुओं या निधियों को दर्शाता है। ‘खजाने’ प्रसंग की राजनयिक भेंटों और संपत्ति के अनुकूल है।
- source_word: עַל עַם לֹא יוֹעִילוּ
  choice: ऐसी जाति के पास ... जो उन्हें कोई लाभ नहीं पहुँचाएगी
  rationale: עַל यहाँ गति की दिशा बताता है। יעל लाभ पहुँचाने, उपयोगी होने या सहायता करने का अर्थ दे सकता है; मुख्य पाठ में आर्थिक और व्यावहारिक निष्फलता का भाव रखा गया है और ‘सहायता’ का विकल्प पादटिप्पणी में है।
theological_decisions:
- issue: नेगेव के खतरनाक प्राणियों की सूची का स्वरूप
  choice: प्राणियों को जोखिम भरी जंगल-यात्रा की वास्तविक या काव्यात्मक विशेषताओं के रूप में सीधे प्रस्तुत किया गया है।
  alternative: उन्हें राजनीतिक शक्तियों के प्रतीक मानना या पूरी सूची को केवल ‘जंगली पशु और साँप’ कहना।
  rationale: पद का बल यहूदा के दूतमंडल की खतरनाक और निष्फल यात्रा पर है। मूल पाठ स्वयं कोई राजनीतिक प्रतीकात्मक पहचान नहीं देता, इसलिए न तो रूपक थोपा गया और न उसकी सजीव विविधता मिटाई गई।
