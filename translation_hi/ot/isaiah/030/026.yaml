source:
  edition: WLC
  text: וְ/הָיָ֤ה אֽוֹר הַ/לְּבָנָה֙ כְּ/א֣וֹר הַֽ/חַמָּ֔ה וְ/א֤וֹר הַֽ/חַמָּה֙ יִהְיֶ֣ה שִׁבְעָתַ֔יִם כְּ/א֖וֹר שִׁבְעַ֣ת הַ/יָּמִ֑ים בְּ/י֗וֹם חֲבֹ֤שׁ יְהוָה֙ אֶת שֶׁ֣בֶר עַמּ֔/וֹ וּ/מַ֥חַץ מַכָּת֖/וֹ יִרְפָּֽא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/026.yaml
  text: And the light of the moon will be like the light of the sun[a], and the light of the sun will be sevenfold, like the light of seven days, on the day when Yahweh binds up the fracture of his people and heals the wound from his blow.
translation:
  language: hi
  text: चाँद का प्रकाश सूर्य के प्रकाश के समान होगा, और सूर्य का प्रकाश सात गुना—सात दिनों के प्रकाश के समान—होगा, उस दिन जब यहोवा अपनी प्रजा की टूटन पर पट्टी बाँधेगा और उसकी मार से हुए घाव को चंगा करेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी मार से हुई कुचलन को चंगा करेगा।” हिब्रू में चोट की छवि को ‘घाव’, ‘कुचलन’ या ‘चोट’ के रूप में व्यक्त किया जा सकता है; आशय यह है कि यहोवा अपने प्रहार से जुड़ी क्षति को चंगा करता है।
    reason: मַחַץ מַכָּתוֹ की वैकल्पिक चोट-संबंधी छवि को दर्शाना, बिना मुख्य पाठ के स्पष्ट संदर्भ को अनावश्यक रूप से संदिग्ध बनाए।
lexical_decisions:
- source_word: וְהָיָה
  choice: होगा / यह उस दिन होगा
  rationale: भविष्य में होने वाली अवस्था और उसके समय को स्वाभाविक हिन्दी में व्यक्त करता है। दूसरे वाक्य में इसकी पुनरावृत्ति लम्बे हिब्रू वाक्य को स्पष्ट बनाती है।
- source_word: אוֹר
  choice: प्रकाश
  rationale: चाँद और सूर्य की ज्योति के लिए सीधा, गरिमापूर्ण और बार-बार प्रयोग योग्य हिन्दी शब्द है।
- source_word: הַלְּבָנָה
  choice: चाँद
  rationale: यहाँ श्वेतता से सम्बद्ध काव्यात्मक हिब्रू संज्ञा सामान्य रूप से चन्द्रमा को दर्शाती है; ‘चाँद’ आधुनिक हिन्दी में सहज है।
- source_word: כְּאוֹר הַחַמָּה
  choice: सूर्य के प्रकाश के समान
  rationale: मूल की स्पष्ट तुलना और ‘प्रकाश’ की पुनरावृत्ति को बनाए रखता है।
- source_word: הַחַמָּה
  choice: सूर्य
  rationale: इस प्रसंग में शब्द गर्मी नहीं, सूर्य को दर्शाता है।
- source_word: שִׁבְעָתַיִם
  choice: सात गुना
  rationale: सात से गुणित तीव्रता का स्वाभाविक हिन्दी रूप है।
- source_word: כְּאוֹר שִׁבְעַת הַיָּמִים
  choice: सात दिनों के प्रकाश के समान
  rationale: काव्यात्मक चित्र को सुरक्षित रखता है और यह तय नहीं करता कि सात दिनों का प्रकाश संचित माना जाए या केवल अत्यधिक तीव्र।
- source_word: בְּיוֹם
  choice: उस दिन
  rationale: पुनर्स्थापना के निश्चित भविष्यकालीन अवसर को संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
- source_word: חֲבֹשׁ
  choice: पट्टी बाँधेगा
  rationale: घायल अंग को बाँधने की चिकित्सकीय और पुनर्स्थापनात्मक छवि को स्पष्ट हिन्दी में प्रस्तुत करता है।
- source_word: שֶׁבֶר
  choice: टूटन
  rationale: मूल में टूटने, दरार या अस्थिभंग की व्यापक छवि है; ‘टूटन’ सामूहिक प्रजा पर लागू रूपक को अनावश्यक रूप से केवल हड्डी टूटने तक सीमित नहीं करता।
- source_word: עַמּוֹ
  choice: अपनी प्रजा
  rationale: प्रत्यय यहोवा से सम्बद्ध वाचा-समुदाय को दर्शाता है; ‘अपनी’ हिन्दी में सम्बन्ध को स्पष्ट करता है।
- source_word: וּמַחַץ מַכָּתוֹ יִרְפָּא
  choice: और उसकी मार से हुए घाव को चंगा करेगा
  rationale: चोट, मार और उपचार की मूल छवि को पठनीय हिन्दी में रखता है। ‘उसकी’ मूल प्रत्यय की सम्भावित सन्दर्भ-अस्पष्टता को बनाए रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: हिन्दी बाइबल-पाठकों में प्रचलित और पहचाना जाने वाला नामरूप है तथा सामान्य उपाधि ‘प्रभु’ के पीछे व्यक्तिगत वाचा-नाम को नहीं छिपाता।
- issue: מַכָּתוֹ के एकवचन पुल्लिंग प्रत्यय का सन्दर्भ
  choice: उसकी मार से हुए घाव
  alternative: प्रजा को लगी चोट का घाव
  rationale: निकट प्रसंग में यहोवा न्याय करने और फिर चंगा करने वाला है, इसलिए मुख्य पाठ उसकी मार से हुई क्षति को व्यक्त करता है। फिर भी हिन्दी ‘उसकी’ और पादटिप्पणी इस सम्भावना को खुला रखते हैं कि प्रत्यय सामूहिक एकवचन ‘प्रजा’ की चोट से जुड़ा समझा जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यवाणी-संबंधी शैली रखी गई है। पहले वाक्य में डैश काव्यात्मक तुलना को स्पष्ट करते हैं; दूसरे वाक्य में चिकित्सकीय रूपक को सहज बनाने के लिए ‘पट्टी बाँधेगा’ और ‘चंगा करेगा’ प्रयुक्त हैं।
