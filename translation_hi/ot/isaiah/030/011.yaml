id: ISA.30.11
reference: Isaiah 30:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ס֚וּרוּ מִנֵּי דֶ֔רֶךְ הַטּ֖וּ מִנֵּי אֹ֑רַח הַשְׁבִּ֥יתוּ מִ/פָּנֵ֖י/נוּ אֶת קְד֥וֹשׁ יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/011.yaml
  text: Turn aside from the way[a]; depart from the path; remove the Holy One of Israel from before us.
translation:
  language: hi
  text: मार्ग से हट जाओ, पथ से मुड़ जाओ; इस्राएल के पवित्र को हमारे सामने से हटा दो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “इस्राएल के पवित्र को हमारे सामने से रहने न दो।”
    reason: हिब्रू क्रिया के कारक अर्थ—‘बन्द करा देना’ या ‘न रहने देना’—को दर्शाने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: סוּרוּ מִנֵּי דֶרֶךְ
  choice: मार्ग से हट जाओ
  rationale: बहुवचन आज्ञार्थक क्रिया मार्ग से अलग हटने का चित्र देती है। ‘मार्ग’ रूपकात्मक अर्थ को बनाए रखता है।
- source_word: הַטּוּ מִנֵּי אֹרַח
  choice: पथ से मुड़ जाओ
  rationale: यह पहली आज्ञा के समानांतर है। ‘पथ’ और ‘मुड़ जाओ’ काव्यात्मक समानता रखते हुए स्वाभाविक हिन्दी देते हैं।
- source_word: הַשְׁבִּיתוּ
  choice: हटा दो
  rationale: शבת का हिफ़ील आज्ञार्थक रूप यहाँ किसी को उपस्थित न रहने देने या दूर कर देने का भाव व्यक्त करता है। ‘हटा दो’ उस कारक बल को सहज हिन्दी में संप्रेषित करता है।
- source_word: מִפָּנֵינוּ
  choice: हमारे सामने से
  rationale: यह मूल के स्थानिक और संबंधपरक भाव—‘हमारे मुख/उपस्थिति के सामने से’—को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: אֶת קְדוֹשׁ יִשְׂרָאֵל
  choice: इस्राएल के पवित्र को
  rationale: यह यशायाह में परमेश्वर के लिए बार-बार प्रयुक्त विशिष्ट उपाधि है; इसे पूर्ण और सुसंगत रूप में रखा गया है।
theological_decisions:
- issue: ‘इस्राएल के पवित्र’ का अभिप्राय
  choice: इस्राएल के परमेश्वर की दैवी उपाधि के रूप में इसे ज्यों का त्यों रखा गया है।
  alternative: इसे यशायाह के भविष्यद्वाणी-संदेश या परमेश्वर की पवित्रता के लाक्षणिक संकेत के रूप में स्पष्ट करके अनुवाद करना।
  rationale: यशायाह में यह पद नियमित रूप से इस्राएल के परमेश्वर की उपाधि है। सीधा अनुवाद लोगों द्वारा परमेश्वर की उपस्थिति और वचन को ठुकराने की धर्मवैज्ञानिक तीव्रता को सुरक्षित रखता है, पर लाक्षणिक संबंध को अनुवाद में बाध्य नहीं करता।
- issue: הַשְׁבִּיתוּ का कारक भाव
  choice: ‘हटा दो’—उनकी मांग है कि इस्राएल का पवित्र उनके सामने उपस्थित न रहे।
  alternative: ‘हमारे सामने से ... का होना बन्द कर दो’ अथवा ‘... को समाप्त कर दो।’
  rationale: मूल क्रिया का अर्थ ‘बन्द करा देना/न रहने देना’ है। ‘हटा दो’ प्रसंग में स्वाभाविक है और इसे परमेश्वर के अस्तित्व को समाप्त करने के दावे के रूप में आवश्यकता से अधिक कठोर नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक है। ‘मार्ग/पथ’ तथा ‘हट जाओ/मुड़ जाओ’ से हिब्रू समानांतरता सुरक्षित रहती है। ‘इस्राएल के पवित्र’ को यशायाह की विशिष्ट दैवी उपाधि के रूप में रखा गया है।
