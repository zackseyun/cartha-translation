id: ISA.30.19
reference: Isaiah 30:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי עַ֛ם בְּ/צִיּ֥וֹן יֵשֵׁ֖ב בִּ/ירֽוּשָׁלִָ֑ם בָּכ֣וֹ לֹֽא תִבְכֶּ֗ה חָנ֤וֹן יָחְנְ/ךָ֙ לְ/ק֣וֹל זַעֲקֶ֔/ךָ כְּ/שָׁמְעָת֖/וֹ עָנָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/019.yaml
  text: For a people in Zion will dwell in Jerusalem[a]; you will surely weep no more. He will surely be gracious to you at the sound of your cry; when he hears it[b], he will answer you.
translation:
  language: hi
  text: क्योंकि सिय्योन की प्रजा यरूशलेम में बसेगी; तुम फिर कभी नहीं रोओगे[a]। तुम्हारी पुकार की आवाज़ पर वह निश्चय ही तुम पर अनुग्रह करेगा[b]; उसे सुनते ही वह तुम्हें उत्तर देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘रोते हुए, तुम नहीं रोओगे’ है। यह बलसूचक रचना है, जिसका अर्थ है कि तुम निश्चय ही फिर नहीं रोओगे।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘अनुग्रह करते हुए, वह तुम पर अनुग्रह करेगा’ है। यह बलसूचक रचना यहोवा के अनुग्रह की निश्चितता पर ज़ोर देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले प्रसंग में कही गई बहाली की प्रतिज्ञा का आधार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַם בְּצִיּוֹן יֵשֵׁב בִּירוּשָׁלִָם
  choice: सिय्योन की प्रजा यरूशलेम में बसेगी
  rationale: עַם का सामूहिक अर्थ ‘प्रजा’ से व्यक्त होता है। ישׁב को निवास के संदर्भ में ‘बसेगी’ किया गया है और सिय्योन तथा यरूशलेम—दोनों स्थान-नाम बनाए रखे गए हैं।
- source_word: בָּכוֹ לֹא תִבְכֶּה
  choice: तुम फिर कभी नहीं रोओगे
  rationale: क्रिया के साथ infinitive absolute निषेध पर बल देता है। ‘फिर कभी नहीं’ इस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חָנוֹן יָחְנְךָ
  choice: वह निश्चय ही तुम पर अनुग्रह करेगा
  rationale: חנן कृपा अथवा अनुग्रह दिखाने का भाव रखता है, और infinitive absolute इस कार्य की निश्चितता पर बल देता है।
- source_word: לְקוֹל זַעֲקֶךָ
  choice: तुम्हारी पुकार की आवाज़ पर
  rationale: मूल के श्रवण-बिंब को बनाए रखने के लिए ‘आवाज़’ रखा गया है; अगला उपवाक्य सुनने की क्रिया को स्पष्ट करता है।
- source_word: כְּשָׁמְעָתוֹ
  choice: उसे सुनते ही
  rationale: यहाँ כְּ के साथ क्रियारूप का कालगत अर्थ है। ‘उसे’ का संकेत पिछली ‘पुकार की आवाज़’ की ओर है और ‘सुनते ही’ त्वरित प्रत्युत्तर को सहज हिन्दी में दर्शाता है।
- source_word: עָנָךְ
  choice: वह तुम्हें उत्तर देगा
  rationale: ענה का अर्थ ‘उत्तर देना’ है। बहाली की भावी प्रतिज्ञा के प्रसंग में भविष्यकाल उपयुक्त है; प्रत्यय की लिंग-विषयक असंगति को हिन्दी के ‘तुम्हें’ में अनावश्यक रूप से नहीं उभारा गया।
theological_decisions:
- issue: अंतिम उपवाक्यों में निहित कर्ता
  choice: ‘वह’ द्वारा यहोवा की ओर संकेत
  alternative: कर्ता को निहित छोड़ना या हर बार ‘यहोवा’ कहना
  rationale: इब्रानी क्रियारूपों का कर्ता प्रसंग से स्पष्ट है और अनुग्रह करके उत्तर देने वाला यहोवा है। हिन्दी वाक्य में ‘वह’ स्पष्टता देता है, जबकि मूल में न आए नाम को बार-बार जोड़ने से बचाता है।
- issue: सिय्योन/यरूशलेम और संबोधित समुदाय का संबंध
  choice: ‘सिय्योन की प्रजा यरूशलेम में बसेगी’
  alternative: ‘हे सिय्योन के लोगो, जो यरूशलेम में बसते हो’
  rationale: मूल पदबंध को भविष्यवाची कथन के रूप में समझना व्याकरणतः सीधा है, पर संबोधनात्मक विश्लेषण भी संभव है। मुख्य पाठ भावी निवास की प्रतिज्ञा को बनाए रखता है और अगले वाक्य में समुदाय को ‘तुम’ कहकर संबोधित करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘प्रजा’, ‘अनुग्रह’ और ‘उत्तर देगा’ जैसे परिचित धार्मिक-साहित्यिक शब्द मूल के अर्थ को स्पष्ट रखते हैं, जबकि अत्यधिक पुरातन संबोधन और जटिल वाक्य-विन्यास से बचा गया है।
