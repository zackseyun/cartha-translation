source:
  edition: WLC
  text: הִנֵּ֤ה שֵׁם יְהוָה֙ בָּ֣א מִ/מֶּרְחָ֔ק בֹּעֵ֣ר אַפּ֔/וֹ וְ/כֹ֖בֶד מַשָּׂאָ֑ה שְׂפָתָי/ו֙ מָ֣לְאוּ זַ֔עַם וּ/לְשׁוֹנ֖/וֹ כְּ/אֵ֥שׁ אֹכָֽלֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/027.yaml
  text: Look[a], the name of Yahweh comes from afar, burning with his anger, and with dense smoke; his lips are full of wrath, and his tongue is like a consuming fire.
translation:
  language: hi
  text: देखो, याहवे का नाम दूर से आ रहा है। उसका क्रोध धधक रहा है, और उसके साथ घना धुआँ उठ रहा है[a]। उसके होंठ रोष से भरे हैं, और उसकी जीभ भस्म कर देनेवाली आग के समान है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध कठिन है। इसका अधिक शाब्दिक अर्थ ‘ऊपर उठने का भारीपन’ हो सकता है; कुछ इसे ‘भारी बोझ’ भी समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला दर्शक कण है। ‘देखो’ आधुनिक, स्वाभाविक हिन्दी में इसके संकेतात्मक और दृश्यात्मक बल को बनाए रखता है।
- source_word: שֵׁם יְהוָה
  choice: याहवे का नाम
  rationale: इब्रानी में ‘नाम’ स्पष्ट रूप से कर्ता है। इसे बनाए रखने से याहवे की प्रकट उपस्थिति और सामर्थ्य का भाव सुरक्षित रहता है।
- source_word: בָּא מִמֶּרְחָק
  choice: दूर से आ रहा है
  rationale: आ रहे दृश्य की सजीवता व्यक्त करता है और कृदन्त के प्रगतिशील भाव को स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: בֹּעֵר אַפּוֹ
  choice: उसका क्रोध धधक रहा है
  rationale: אַף का शाब्दिक अर्थ नाक या नथुना हो सकता है, पर यहाँ यह क्रोध का इब्रानी मुहावरा है। ‘धधक रहा है’ आग की छवि को बनाए रखता है।
- source_word: וְכֹבֶד מַשָּׂאָה
  choice: और घना धुआँ उठ रहा है
  rationale: यह कठिन पदबंध है। अग्निमय न्याय के संदर्भ में इसे उठते हुए भारी या घने धुएँ के रूप में समझना सुसंगत है; अनिश्चितता को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: שְׂפָתָיו מָלְאוּ זַעַם
  choice: उसके होंठ रोष से भरे हैं
  rationale: मूल के शारीरिक बिंब और न्यायपूर्ण प्रकोप के ऊँचे भाव—दोनों को निकटता से सुरक्षित रखता है।
- source_word: וּלְשׁוֹנוֹ כְּאֵשׁ אֹכָלֶת
  choice: और उसकी जीभ भस्म करनेवाली आग के समान है
  rationale: उपमा तथा आग की सक्रिय विनाशकारी शक्ति को स्पष्ट और गरिमापूर्ण हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में वाचा-संबंधी विशिष्ट नाम है; उसका लिप्यंतरण पाठ की विशिष्टता को सुरक्षित रखता है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: ‘नाम’ को कर्ता बनाए रखना
  choice: याहवे का नाम दूर से आ रहा है
  alternative: याहवे दूर से आ रहा है
  rationale: मूल पाठ स्पष्ट रूप से ‘याहवे का नाम’ कहता है। इसे बनाए रखने से परमेश्वर की पहचान और न्याय में उसकी प्रकट उपस्थिति के बीच की धर्मवैचारिक गहनता को सरल करके समाप्त नहीं किया जाता।
- issue: וְכֹבֶד מַשָּׂאָה की कठिनता
  choice: घना धुआँ उठ रहा है
  alternative: उठाने का भारीपन; भारी बोझ
  rationale: निकटवर्ती आग, क्रोध और भस्म करने की छवियाँ धुएँ वाले अर्थ का समर्थन करती हैं, पर इब्रानी पदबंध अनिश्चित है; इसलिए वैकल्पिक अधिक शाब्दिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है, पर भविष्यद्वाणी के गरिमापूर्ण और दृश्यात्मक स्वर को बनाए रखती है। ‘धधक रहा है’, ‘रोष’ और ‘भस्म करनेवाली आग’ न्याय की तीव्र अग्निमय छवि को स्वाभाविक हिन्दी में व्यक्त करते हैं।
