id: ISA.30.8
reference: Isaiah 30:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַתָּ֗ה בּ֣וֹא כָתְבָ֥/הּ עַל ל֛וּחַ אִתָּ֖/ם וְ/עַל סֵ֣פֶר חֻקָּ֑/הּ וּ/תְהִי֙ לְ/י֣וֹם אַחֲר֔וֹן לָ/עַ֖ד עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/008.yaml
  text: Now come[a], write it before them on a tablet, and inscribe it in a scroll, that it may stand for a later day[b], as a witness forever and ever.
translation:
  language: hi
  text: अब आ, इसे उनके सामने एक पट्टिका पर लिख और एक ग्रंथ में अंकित कर, ताकि यह आनेवाले दिन[a] के लिए सदा-सर्वदा बनी रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाद के दिन” अथवा “अंतिम दिन।”
    reason: इब्रानी पदबंध भविष्य के किसी दिन या अधिक विशिष्ट अंतिम दिन—दोनों अर्थों में समझा जा सकता है।
lexical_decisions:
- source_word: עַתָּה בּוֹא
  choice: अब आ
  rationale: कालवाचक क्रिया-विशेषण और एकवचन आज्ञार्थक क्रिया की सीधी, स्वाभाविक अभिव्यक्ति।
- source_word: כָתְבָהּ
  choice: इसे ... लिख
  rationale: स्त्रीलिंग एकवचन प्रत्यय पहले से निहित भविष्यवाणी या संदेश की ओर संकेत करता है; हिंदी में उसके आशय को अनावश्यक रूप से निश्चित किए बिना ‘इसे’ उपयुक्त है।
- source_word: עַל־לוּחַ
  choice: एक पट्टिका पर
  rationale: לוּחַ लिखने की पटिया या पट्टिका है; ‘पट्टिका’ प्राचीन लेखन-सतह का स्पष्ट और आधुनिक हिंदी रूप है।
- source_word: אִתָּם
  choice: उनके सामने
  rationale: शाब्दिक अर्थ ‘उनके साथ’ हो सकता है, पर सार्वजनिक रूप से लिखित अभिलेख तैयार करने के प्रसंग में ‘उनके सामने/उनकी उपस्थिति में’ आशय अधिक स्वाभाविक है।
- source_word: וְעַל־סֵפֶר חֻקָּהּ
  choice: और एक ग्रंथ में अंकित कर
  rationale: סֵפֶר किसी लिखित दस्तावेज़ या लपेटे जाने वाले ग्रंथ को सूचित कर सकता है और חקק स्थायी रूप से अंकित करने का भाव देता है। ‘ग्रंथ में अंकित कर’ माध्यम को आधुनिक पुस्तक तक सीमित नहीं करता।
- source_word: וּתְהִי
  choice: ताकि यह ... बनी रहे
  rationale: आज्ञाओं के बाद प्रयुक्त रूप उद्देश्य या परिणाम बताता है; ‘बनी रहे’ अभिलेख के टिके रहने का भाव स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לְיוֹם אַחֲרוֹן
  choice: आनेवाले दिन के लिए
  rationale: यह पदबंध बाद के या भविष्य के दिन को सूचित करता है, पर अनिवार्य रूप से पारिभाषिक अंत-काल नहीं; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: לָעַד עַד־עוֹלָם
  choice: सदा-सर्वदा
  rationale: दोनों कालवाचक पद मिलकर स्थायी अवधि पर प्रबल बल देते हैं। मसोरी स्वरांकन में לָעַד का सामान्य अर्थ ‘सदा के लिए’ है, न कि संज्ञा ‘साक्षी’।
theological_decisions:
- issue: क्या לְיוֹם אַחֲרוֹן को स्पष्ट अंत-कालीन अर्थ में अनूदित किया जाए
  choice: आनेवाले दिन के लिए
  alternative: अंतिम दिन के लिए
  rationale: इब्रानी पद भविष्य के किसी बाद के दिन को भी सूचित कर सकता है। मुख्य पाठ में व्यापक अर्थ रखा गया है और संभावित अंत-कालीन अर्थ पादटिप्पणी में दिया गया है।
- issue: क्या לָעַד को ‘साक्षी के रूप में’ अनूदित किया जाए
  choice: सदा-सर्वदा
  alternative: सदा के लिए एक साक्षी के रूप में
  rationale: मसोरी पाठ का स्वरांकित לָעַד कालवाचक ‘सदा के लिए’ है और उसके बाद עַד־עוֹלָם भी स्थायित्व को पुष्ट करता है। लिखित अभिलेख का साक्ष्यात्मक कार्य प्रसंग से समझा जा सकता है, पर ‘साक्षी’ को मुख्य पाठ में जोड़ना शाब्दिक रूप से अपेक्षित नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। एकवचन आज्ञाएँ ‘आ, लिख, अंकित कर’ मूल के सीधे संबोधन को बनाए रखती हैं। ‘ग्रंथ’ प्राचीन लिखित दस्तावेज़ या पुस्तकाकार लपेटे हुए लेख, दोनों के लिए पर्याप्त व्यापक है।
