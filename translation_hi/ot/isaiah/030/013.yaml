source:
  edition: WLC
  text: לָ/כֵ֗ן יִֽהְיֶ֤ה לָ/כֶם֙ הֶ/עָוֺ֣ן הַ/זֶּ֔ה כְּ/פֶ֣רֶץ נֹפֵ֔ל נִבְעֶ֖ה בְּ/חוֹמָ֣ה נִשְׂגָּבָ֑ה אֲשֶׁר פִּתְאֹ֥ם לְ/פֶ֖תַע יָב֥וֹא שִׁבְרָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/013.yaml
  text: Therefore this iniquity will be to you like a falling breach, bulging out in a high wall, whose breaking comes suddenly, in an instant.
translation:
  language: hi
  text: इसलिए यह अपराध तुम्हारे लिए ऊँची दीवार में उभरी हुई, गिरने को तैयार दरार के समान होगा, जिसका टूटना अचानक, एक ही क्षण में आ पड़ेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶעָוֺן הַזֶּה
  choice: यह अधर्म
  rationale: עָוֹן यहाँ लोगों के दोषपूर्ण विद्रोही आचरण को सूचित करता है; ‘अधर्म’ उसके नैतिक और धार्मिक भार को बनाए रखता है।
- source_word: כְּפֶרֶץ נֹפֵל
  choice: गिरती दरार के समान
  rationale: פֶרֶץ दीवार की दरार या टूटे हिस्से को और נֹפֵל गिरने की प्रक्रिया अथवा आसन्न पतन को व्यक्त करता है; अनुवाद मूल बिंब और उसकी हल्की अस्पष्टता को बनाए रखता है।
- source_word: נִבְעֶה
  choice: उभरी हुई
  rationale: शब्द दीवार के बाहर की ओर फूलने या उभरने का चित्र देता है, जो अचानक ढहने से पहले की अस्थिर दशा है।
- source_word: בְּחוֹמָה נִשְׂגָּבָה
  choice: ऊँची दीवार में
  rationale: נִשְׂגָּבָה का स्थानिक अर्थ यहाँ स्वाभाविक है; ‘ऊँची’ सामान्य हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: פִּתְאֹם לְפֶתַע
  choice: अचानक, एक ही क्षण में
  rationale: दोनों निकटार्थी पद आकस्मिकता और तीव्रता पर बल देते हैं; हिन्दी में दोनों का प्रभाव सुरक्षित रखा गया है।
- source_word: יָבוֹא שִׁבְרָהּ
  choice: जिसका टूटना ... आ पड़ेगा
  rationale: शाब्दिक ‘उसका टूटना आएगा’ को स्वाभाविक हिन्दी में व्यक्त करते हुए अचानक विनाश के आगमन का भाव बनाए रखा गया है।
theological_decisions:
- issue: עָוֹן का अर्थ दोष, पाप या उसका दंड
  choice: अधर्म
  alternative: दोष / अधर्म का दंड
  rationale: संदर्भ में मूलतः लोगों का विद्रोही दोष सामने है। ‘अधर्म’ जानबूझकर उसके परिणाम को शब्द में नहीं मिलाता, यद्यपि अगले बिंब में विनाशकारी परिणाम स्पष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखा गया है। दीवार की उभरी दरार और उसके अचानक ढहने का मूल रूपक यथासंभव निकटता से सुरक्षित है।
