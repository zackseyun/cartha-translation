language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ה֣וֹי בָּנִ֤ים סֽוֹרְרִים֙ נְאֻם יְהוָ֔ה לַ/עֲשׂ֤וֹת עֵצָה֙ וְ/לֹ֣א מִ/נִּ֔י וְ/לִ/נְסֹ֥ךְ מַסֵּכָ֖ה וְ/לֹ֣א רוּחִ֑/י לְמַ֛עַן סְפ֥וֹת חַטָּ֖את עַל חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/001.yaml
  text: Woe to the rebellious children[a], declares Yahweh, who carry out a plan, but not from me, and who pour out a libation, but not by my Spirit, so as to add sin to sin.
translation:
  language: hi
  text: '“विद्रोही बच्चों पर हाय!” याहवे की यह घोषणा है: “वे ऐसी योजना को कार्यान्वित करते हैं जो मेरी ओर से नहीं है, और पेय-बलि उंडेलते हैं, पर मेरी आत्मा के द्वारा नहीं, ताकि पाप पर पाप जोड़ते जाएँ।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹי
  choice: हाय ... पर
  rationale: यह भविष्यवाणी की भर्त्सना और आने वाले संकट की घोषणा है; हिन्दी में ‘हाय ... पर’ उसके गंभीर भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָּנִים סוֹרְרִים
  choice: विद्रोही बच्चे
  rationale: ‘बच्चे’ संबंधपरक और वाचा-संबंधी रूपक बनाए रखता है, जबकि ‘विद्रोही’ जान-बूझकर की गई अवज्ञा का भाव देता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह भारपूर्ण भविष्यसूचक सूत्र है; यְהוָה को परियोजना की परंपरा के अनुसार ‘याहवे’ रखा गया है।
- source_word: לַעֲשׂוֹת עֵצָה
  choice: योजना ... पूरी करते हैं
  rationale: यह केवल विचार बनाने के बजाय किसी नीति या योजना को कार्यान्वित करने का संकेत देता है।
- source_word: וְלֹא מִנִּי
  choice: पर वह मेरी ओर से नहीं होती
  rationale: מִן स्रोत या उद्गम बताता है; उनके निर्णय की उत्पत्ति याहवे से नहीं है।
- source_word: וְלִנְסֹךְ מַסֵּכָה
  choice: अर्घ चढ़ाते हैं
  rationale: मसोरेटिक स्वरांकन का सबसे स्वाभाविक अर्थ उंडेला जाने वाला पेय-अर्पण है। ‘अर्घ चढ़ाना’ हिन्दी में द्रव अर्पित करने की क्रिया को संक्षेप और गरिमा से व्यक्त करता है; अन्य संभावनाएँ पादटिप्पणी में हैं।
- source_word: וְלֹא רוּחִי
  choice: पर मेरी आत्मा के अनुसार नहीं
  rationale: रूआख को ‘मेरी आत्मा’ रखकर उसका धर्मवैचारिक भार बचाया गया है; ‘के अनुसार’ यहाँ याहवे की आत्मा के निर्देशन या अनुमोदन के अभाव को व्यक्त करता है, बिना उसके आशय को अत्यधिक सीमित किए।
- source_word: לְמַעַן סְפוֹת
  choice: इस तरह ... बढ़ाते जाते हैं
  rationale: रचना उद्देश्य या परिणाम दोनों का संकेत दे सकती है। ‘इस तरह’ उस अस्पष्टता को काफी हद तक खुला रखता है और संचय की निरंतरता स्पष्ट करता है।
- source_word: חַטָּאת עַל חַטָּאת
  choice: पाप पर पाप
  rationale: हिब्रू की पुनरुक्ति और बढ़ते हुए दोष का मुहावरा सीधे सुरक्षित रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: व्यक्तिगत वाचा-नाम को नाम के रूप में सुरक्षित रखता है और परियोजना की निर्दिष्ट परंपरा का अनुसरण करता है।
- issue: וְלִנְסֹךְ מַסֵּכָה का अर्थ
  choice: मुख्य पाठ में ‘अर्घ चढ़ाते हैं’
  alternative: ‘आवरण बुनते हैं’ अथवा प्रसंगानुसार ‘गठबंधन करते हैं’
  rationale: मसोरेटिक पाठ के स्वरांकन से द्रव-अर्पण का अर्थ सबसे सीधे निकलता है। मिस्र से गठबंधन के व्यापक प्रसंग के कारण अन्य व्याख्याएँ संभव हैं, इसलिए उन्हें पादटिप्पणी में सुरक्षित रखा गया है।
- issue: וְלֹא רוּחִי में רוּחַ का आशय
  choice: मेरी आत्मा के अनुसार नहीं
  alternative: मेरी इच्छा/प्रेरणा से नहीं; मेरी आत्मा के द्वारा नहीं
  rationale: ‘आत्मा’ मूल शब्द का धर्मवैचारिक आयाम बनाए रखता है, जबकि ‘के अनुसार’ निर्देशन, स्रोत और अनुमोदन के बीच की संभावित अर्थ-व्याप्ति को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यसूचक शैली रखी गई है। वाक्य सामान्य पाठक के लिए स्पष्ट है, पर मूल की पुनरुक्ति, संबंधपरक रूपक और वास्तविक अर्थगत अस्पष्टताएँ सुरक्षित हैं।
