source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ קְד֣וֹשׁ יִשְׂרָאֵ֔ל יַ֥עַן מָֽאָסְ/כֶ֖ם בַּ/דָּבָ֣ר הַ/זֶּ֑ה וַֽ/תִּבְטְחוּ֙ בְּ/עֹ֣שֶׁק וְ/נָל֔וֹז וַ/תִּֽשָּׁעֲנ֖וּ עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/012.yaml
  text: 'Therefore thus says the Holy One of Israel: Because you have rejected this word[a], and have trusted in oppression and perversity, and have relied on it[b],'
translation:
  language: hi
  text: 'इसलिए इस्राएल का पवित्र परमेश्वर यों कहता है: “क्योंकि तुमने इस वचन[a] को ठुकरा दिया है, और अत्याचार और कुटिलता पर भरोसा रखा है, और उस पर निर्भर रहे हो,[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस संदेश” अथवा “इस बात।”
    reason: lexical_alternative
  - marker: b
    text: “अत्याचार” का अर्थ “शोषण” या “जबरन वसूली” भी हो सकता है; “कुटिलता” का अर्थ “विकृति” या “टेढ़ापन” भी हो सकता है। “उस” एकवचन है और अंतिम बात अथवा पूरे संयुक्त विचार की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले उलाहने से निकलने वाले परिणाम का संकेत देता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: भविष्यद्वक्ताओं की प्रचलित संदेश-घोषणा को संक्षिप्त और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: इस्राएल का पवित्र जन
  rationale: यशायाह में प्रयुक्त विशिष्ट उपाधि की संरचना और धर्मवैचारिक बल को सुरक्षित रखता है।
- source_word: מָאַסְכֶם
  choice: तुमने ... ठुकरा दिया है
  rationale: क्रिया में जानबूझकर अस्वीकार करने का प्रबल भाव है; ‘ठुकराना’ आधुनिक हिन्दी में इसे स्पष्ट करता है।
- source_word: בַּדָּבָר הַזֶּה
  choice: इस वचन
  rationale: דבר के ‘वचन’, ‘संदेश’ और ‘बात’ अर्थों में यहाँ भविष्यद्वाणी के संदेश की ओर संकेत संभव है; ‘वचन’ मूल की संक्षिप्तता और अस्पष्टता को काफी हद तक बनाए रखता है।
- source_word: עֹשֶׁק
  choice: अत्याचार
  rationale: अन्यायपूर्ण दबाव, शोषण या बलपूर्वक लाभ लेने के व्यापक नैतिक अर्थ को व्यक्त करता है।
- source_word: נָלוֹז
  choice: कुटिलता
  rationale: टेढ़े, विकृत या छलपूर्ण आचरण का भाव देता है और ‘अत्याचार’ के साथ स्वाभाविक युग्म बनाता है।
- source_word: וַתִּשָּׁעֲנוּ עָלָיו
  choice: उसी का सहारा लिया है
  rationale: शाब्दिक ‘उस पर टिकना’ के रूपक को स्वाभाविक हिन्दी में रखता है और एकवचन सर्वनाम की वास्तविक अस्पष्टता सुरक्षित रखता है।
theological_decisions:
- issue: ‘इस वचन’ का संकेत
  choice: निकटवर्ती भविष्यद्वाणी के वचन/चेतावनी की ओर संभावित संकेत
  alternative: यह बात या यह विषय
  rationale: संदर्भ में परमेश्वर की चेतावनी का अस्वीकार प्रमुख है, पर דבר की व्यापक अर्थ-सीमा को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: भरोसे की अनैतिक वस्तु का स्वरूप
  choice: अत्याचार और कुटिलता
  alternative: शोषण और विकृति; जबरन वसूली और छल
  rationale: मूल शब्द अन्यायपूर्ण और टेढ़े उपायों की निंदा करते हैं, पर किसी एक ऐतिहासिक पद्धति तक अर्थ को सीमित नहीं करते।
- issue: עָלָיו का पूर्वपद
  choice: ‘उसी’ द्वारा एकवचन और संदर्भगत अस्पष्टता बनाए रखना
  alternative: ‘उन्हीं’ कहकर दोनों संज्ञाओं को स्पष्ट रूप से पूर्वपद मानना
  rationale: इब्रानी सर्वनाम पुल्लिंग एकवचन है और अंतिम पद अथवा पूरे संयुक्त विचार की ओर संकेत कर सकता है; अनुवाद इसे अनावश्यक रूप से तय नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भविष्यद्वाणी की घोषणा के लिए गरिमापूर्ण किंतु सहज शैली। ‘यों कहता है’ पारंपरिक धार्मिक रूढ़ि से अत्यधिक बँधे बिना संदेश-सूत्र को बनाए रखता है। पद अगले वाक्य में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है।
