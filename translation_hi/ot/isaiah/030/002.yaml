    issue: ‘पनाह पाएँ’ renders the final infinitive less directly.
    rationale: לַחְסוֹת denotes taking refuge or shelter. ‘पनाह लें’ retains the voluntary action and better parallels ‘शरण लें’ in the preceding clause.
