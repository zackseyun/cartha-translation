language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ/הֹלְכִים֙ לָ/רֶ֣דֶת מִצְרַ֔יִם וּ/פִ֖/י לֹ֣א שָׁאָ֑לוּ לָ/עוֹז֙ בְּ/מָע֣וֹז פַּרְעֹ֔ה וְ/לַ/חְס֖וֹת בְּ/צֵ֥ל מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/002.yaml
  text: who set out to go down to Egypt, but have not asked my mouth, to seek refuge in Pharaoh’s stronghold and to take shelter in the shadow of Egypt.
translation:
  language: hi
  text: जो मिस्र उतर जाने के लिए निकल पड़े हैं, पर जिन्होंने मुझसे पूछा नहीं—ताकि फ़िरौन के गढ़ में शरण लें और मिस्र की छाया में पनाह लें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַהֹלְכִים לָרֶדֶת
  choice: जो ... उतर जाने के लिए निकल पड़े हैं
  rationale: הלך के कृदंत और उद्देश्यसूचक לרדת को स्वाभाविक हिन्दी में व्यक्त करता है; मिस्र जाने के लिए ‘उतरना’ बाइबलीय भौगोलिक अभिव्यक्ति को बनाए रखता है।
- source_word: וּפִי לֹא שָׁאָלוּ
  choice: पर जिन्होंने मुझसे पूछा नहीं
  rationale: शाब्दिक ‘मेरे मुँह से नहीं पूछा’ आधुनिक हिन्दी में अस्वाभाविक है। प्रथम पुरुष प्रत्यय परमेश्वर से परामर्श न लेने को सूचित करता है, इसलिए अर्थ को स्पष्ट और सहज रूप दिया गया है।
- source_word: לָעוֹז בְּמָעוֹז פַּרְעֹה
  choice: ताकि फ़िरौन के गढ़ में शरण लें
  rationale: עוז क्रिया शरण या सुरक्षा खोजने का भाव रखती है और מעוז सुरक्षित गढ़/दुर्ग का; हिन्दी में दोनों का शब्द-खेल पूर्णतः बचाना कठिन है, इसलिए अर्थपूर्ण निकटता रखी गई है।
- source_word: וְלַחְסוֹת בְּצֵל מִצְרָיִם
  choice: और मिस्र की छाया में पनाह पाएँ
  rationale: חסה आश्रय लेने को और צל संरक्षण की रूपकात्मक छाया को व्यक्त करता है; ‘छाया’ मूल बिंब बनाए रखती है।
theological_decisions:
- issue: ‘मेरे मुँह से पूछना’ का आशय
  choice: मुझसे पूछा नहीं
  alternative: मेरे मुँह से नहीं पूछा
  rationale: वक्ता परमेश्वर है और संदर्भ उसकी सम्मति/परामर्श न लेने का है। सहज हिन्दी में ‘मुझसे’ यही संबंध व्यक्त करता है, बिना प्रकाशना की किसी विशिष्ट विधि को जोड़ने के।
- issue: मिस्र और फ़िरौन पर निर्भरता
  choice: गढ़ में शरण लें ... छाया में पनाह पाएँ
  alternative: फ़िरौन की सुरक्षा से बल पाएँ ... मिस्र के संरक्षण में रहें
  rationale: मूल के आश्रय और छाया के बिंबों को बनाए रखा गया है तथा राजनीतिक गठबंधन के अर्थ को अतिरिक्त व्याख्या से सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। वाक्य पिछले पद से जुड़ी संबंधवाचक रचना है, इसलिए आरंभ ‘जो’ से रखा गया है। ‘फ़िरौन’, ‘गढ़’, ‘शरण’ और ‘पनाह’ सामान्य पाठक के लिए स्पष्ट हैं; मूल के काव्यात्मक ‘छाया’ बिंब को सुरक्षित रखा गया है।
