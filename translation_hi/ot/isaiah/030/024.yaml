base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/024.yaml
  text: And the oxen and the donkeys that work the ground will eat seasoned fodder[b][a], which has been winnowed with shovel and fork.
translation:
  language: hi
  text: और ज़मीन जोतने वाले बैल और गधे सुधरा हुआ चारा[a] खाएँगे, जो फटकने के फावड़े और काँटे[b] से फटकाया गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नमक मिला चारा’; इब्रानी विशेषण का अर्थ अनिश्चित है और यह नमक मिलाकर या किसी अन्य रीति से बेहतर बनाया गया चारा सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल पाठ में अनाज या चारा हवा में उछालकर फटकने के दो कृषि-औज़ारों के नाम हैं—एक फावड़े जैसा और दूसरा काँटे जैसा औज़ार।
    reason: cultural_note
lexical_decisions:
- source_word: הָאֲלָפִים
  choice: बैल
  rationale: संदर्भ में खेत की ज़मीन पर काम करने वाले गोवंशीय भारवाही पशु अभिप्रेत हैं; इसलिए सामान्य ‘मवेशी’ की अपेक्षा ‘बैल’ अधिक सटीक है।
- source_word: הָעֲיָרִים
  choice: गधे
  rationale: यह खेती में काम आने वाले पशुओं के लिए आधुनिक मानक हिन्दी का स्वाभाविक शब्द है।
- source_word: עֹבְדֵי הָאֲדָמָה
  choice: ज़मीन जोतने वाले
  rationale: शाब्दिक अर्थ ‘भूमि पर काम करने वाले’ है; कृषि और पशुओं के संदर्भ में ‘ज़मीन जोतने वाले’ कार्य को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּלִיל
  choice: चारा
  rationale: यह पशुओं के लिए तैयार किए गए, सम्भवतः मिश्रित, आहार को दर्शाता है; ‘चारा’ सामान्य पाठक के लिए सहज है।
- source_word: חָמִיץ
  choice: नमक मिला
  rationale: दुर्लभ विशेषण सम्भवतः नमक या किसी अन्य रीति से बेहतर बनाए गए चारे को सूचित करता है। मुख्य पाठ में सम्भावित ठोस अर्थ रखा गया है और अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: יֹאכֵלוּ
  choice: खाएँगे
  rationale: आस-पास का प्रसंग भावी समृद्धि का वर्णन करता है, इसलिए सामान्य भविष्यकाल उपयुक्त है।
- source_word: אֲשֶׁר זֹרֶה
  choice: जिसे ... फटकाया गया होगा
  rationale: इब्रानी रूप सक्रिय है, पर चारा प्रक्रिया का विषय-वस्तु है; हिन्दी में कर्मवाच्य इस आशय को स्पष्ट और स्वाभाविक बनाता है।
- source_word: בָרַחַת
  choice: फटकने के फावड़े
  rationale: यह अनाज या चारा हवा में उछालकर फटकने का कृषि-औज़ार है; कार्यसूचक विशेषण जोड़ने से सामान्य ‘फावड़े’ से इसका भेद स्पष्ट होता है।
- source_word: וּבַמִּזְרֶה
  choice: और काँटे
  rationale: यह फटकने का दाँतेदार कृषि-औज़ार है और पहले औज़ार के साथ जोड़ा गया है; सांस्कृतिक विवरण पादटिप्पणी में दिया गया है।
