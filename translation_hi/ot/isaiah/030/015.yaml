source:
  edition: WLC
  text: כִּ֣י כֹֽה אָמַר֩ אֲדֹנָ֨/י יְהוִ֜ה קְד֣וֹשׁ יִשְׂרָאֵ֗ל בְּ/שׁוּבָ֤ה וָ/נַ֨חַת֙ תִּוָּ֣שֵׁע֔וּ/ן בְּ/הַשְׁקֵט֙ וּ/בְ/בִטְחָ֔ה תִּהְיֶ֖ה גְּבֽוּרַתְ/כֶ֑ם וְ/לֹ֖א אֲבִיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/015.yaml
  text: 'For thus says the Lord GOD[a], the Holy One of Israel: “In returning and rest you will be saved[b]; in quietness and trust will be your strength.” But you were unwilling.'
translation:
  language: hi
  text: 'क्योंकि प्रभु यहोवा, इस्राएल का पवित्र, यों कहता है:


    “लौटने[a] और विश्राम करने में तुम बचाए जाओगे[b];


    शांत रहने और भरोसा रखने में तुम्हारी सामर्थ्य होगी।”


    परन्तु तुम राज़ी न हुए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पश्चात्ताप करने में”; इब्रानी में अधिक शाब्दिक अर्थ “लौटने” का है, जिसमें पश्चात्ताप और परमेश्वर की ओर फिरना सम्मिलित हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “तुम छुड़ाए जाओगे।”
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: 'संयुक्त ईश्वरीय उपाधि के दोनों अंगों का भेद बनाए रखता है: אֲדֹנָי को ‘प्रभु’ और יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ से व्यक्त किया गया है।'
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: इस्राएल का पवित्र जन
  rationale: यशायाह में बार-बार आने वाली इस उपाधि की पवित्रता और इस्राएल से सम्बन्ध—दोनों को सुरक्षित रखता है।
- source_word: בְּשׁוּבָה
  choice: लौटने
  rationale: मूल शब्द के लौटने या फिरने के ठोस बिम्ब को बनाए रखता है और यह खुला छोड़ता है कि आशय पश्चात्ताप, परमेश्वर की ओर लौटना, या दोनों है।
- source_word: וָנַחַת
  choice: और विश्राम करने में
  rationale: निश्चिन्त ठहराव और विश्राम के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: תִּוָּשֵׁעוּן
  choice: तुम बचाए जाओगे
  rationale: निफ़अल रूप के कर्मवाच्य अर्थ ‘बचाया/छुड़ाया जाना’ को सीधे व्यक्त करता है और आत्मिक उद्धार तथा ऐतिहासिक छुटकारे की सम्भावनाओं को खुला रखता है।
- source_word: בְּהַשְׁקֵט
  choice: शान्त रहने में
  rationale: केवल बाहरी शान्ति नहीं, बल्कि चुपचाप स्थिर रहने की दशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּבְבִטְחָה
  choice: और भरोसा रखने में
  rationale: सुरक्षा की परिणामी अवस्था के बजाय परमेश्वर पर निर्भरता और विश्वास की प्रवृत्ति को सामने रखता है।
- source_word: תִּהְיֶה גְּבוּרַתְכֶם
  choice: तुम्हारी सामर्थ्य होगी
  rationale: गְּבוּרָה के बल, शक्ति या सामर्थ्य के अर्थ को सैन्य शक्ति तक सीमित किए बिना व्यक्त करता है।
- source_word: וְלֹא אֲבִיתֶם
  choice: परन्तु तुम इसके लिए तैयार नहीं थे
  rationale: אָבָה के इच्छा या सहमति न देने के भाव को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है; यह मात्र असमर्थता नहीं, अनिच्छा बताता है।
theological_decisions:
- issue: क्या בְּשׁוּבָה को स्पष्ट रूप से ‘पश्चात्ताप’ कहा जाए
  choice: मुख्य पाठ में ‘लौटने’
  alternative: ‘पश्चात्ताप करने में’ अथवा ‘परमेश्वर की ओर लौटने में’
  rationale: שׁוב में पश्चात्ताप सम्मिलित हो सकता है, पर सन्दर्भ आत्मनिर्भर राजनीतिक नीति से हटकर परमेश्वर पर शान्त भरोसा रखने की ओर लौटने पर भी बल देता है। व्यापक शब्द मूल की धार्मिक और सम्बन्धपरक बहुअर्थकता बचाता है।
- issue: תִּוָּשֵׁעוּן में उद्धार या ऐतिहासिक छुटकारे का बल
  choice: ‘तुम बचाए जाओगे’
  alternative: ‘तुम छुड़ाए जाओगे’
  rationale: ישע राष्ट्रीय संकट से छुटकारा और व्यापक वाचा-संबंधी उद्धार, दोनों व्यक्त कर सकता है। ‘बचाए जाओगे’ इस विस्तार को सुरक्षित रखता है और अधिक परिस्थितिजन्य विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। काव्यात्मक समानान्तरता को पंक्ति-विन्यास और ‘लौटने…विश्राम’ तथा ‘शान्त रहने…भरोसा रखने’ की जोड़ियों से सुरक्षित रखा गया है। ‘परन्तु’ अन्तिम तीखे विरोध को स्पष्ट करता है।
