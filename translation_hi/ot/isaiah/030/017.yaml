source:
  edition: WLC
  text: אֶ֣לֶף אֶחָ֗ד מִ/פְּנֵי֙ גַּעֲרַ֣ת אֶחָ֔ד מִ/פְּנֵ֛י גַּעֲרַ֥ת חֲמִשָּׁ֖ה תָּנֻ֑סוּ עַ֣ד אִם נוֹתַרְתֶּ֗ם כַּ/תֹּ֨רֶן֙ עַל רֹ֣אשׁ הָ/הָ֔ר וְ/כַ/נֵּ֖ס עַל הַ/גִּבְעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/017.yaml
  text: A thousand will flee at the rebuke of one[a]; at the rebuke of five you will flee, until you are left like a signal pole on the top of a mountain[b], and like a banner on a hill.
translation:
  language: hi
  text: एक की फटकार से एक हज़ार भागेंगे; पाँच की फटकार से तुम भागोगे, यहाँ तक कि तुम पहाड़ की चोटी पर एक संकेत-स्तंभ[a] और पहाड़ी पर एक ध्वज[b] के समान बचे रह जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पहाड़ की चोटी पर एक मस्तूल के समान।’ इब्रानी תֹּרֶן का अर्थ मस्तूल या ऊँचा खंभा हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘पहाड़ी पर एक संकेत-ध्वज के समान।’ इब्रानी נֵס किसी संकेत के लिए ऊँचा किए गए ध्वज या पताका को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף אֶחָד
  choice: एक हज़ार
  rationale: इब्रानी में शाब्दिक क्रम ‘हज़ार, एक’ है; आधुनिक हिन्दी में स्वाभाविक संख्यात्मक अभिव्यक्ति ‘एक हज़ार’ है।
- source_word: מִפְּנֵי גַּעֲרַת
  choice: की फटकार से
  rationale: מִפְּנֵי यहाँ कारण व्यक्त करता है और גְּעָרָה कड़ी डाँट, धमकी भरी फटकार या झिड़की को दर्शाता है। ‘फटकार से’ मूल अर्थ और युद्धजनित भय—दोनों को बनाए रखता है।
- source_word: תָּנֻסוּ
  choice: तुम भागोगे
  rationale: यह נוס का द्वितीय पुरुष बहुवचन रूप है। ‘तुम भागोगे’ सीधे संबोधन और भविष्यसूचक कथन को स्वाभाविक हिन्दी में रखता है।
- source_word: עַד אִם נוֹתַרְתֶּם
  choice: यहाँ तक कि तुम ... अकेले रह जाओगे
  rationale: पदबंध भागने की परिणति और सीमा बताता है। נותר का भाव पराजय के बाद बचे रह जाने का है; सन्दर्भ और दोनों उपमाओं में निहित एकाकीपन को स्पष्ट करने के लिए ‘अकेले रह जाओगे’ चुना गया है।
- source_word: כַּתֹּרֶן
  choice: एक संकेत-स्तंभ के समान
  rationale: תֹּרֶן मस्तूल या ऊँचे खंभे को सूचित कर सकता है। समानांतर נֵס और ऊँचे स्थान के दृश्य में ‘संकेत-स्तंभ’ दूर से दिखाई देने वाले अकेले खंभे का चित्र सहज रूप से देता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: עַל רֹאשׁ הָהָר
  choice: पहाड़ की चोटी पर
  rationale: यह स्थानवाचक पदबंध का सीधा, स्वाभाविक और चित्रात्मक हिन्दी रूप है।
- source_word: וְכַנֵּס
  choice: और ... एक ध्वज के समान
  rationale: נֵס ऊँचा किया हुआ ध्वज या संकेत-चिह्न है। ‘ध्वज’ आधुनिक पाठकों के लिए सुबोध है और संकेत देने का विशेष अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: עַל הַגִּבְעָה
  choice: पहाड़ी पर
  rationale: सरल स्थलाकृतिक अभिव्यक्ति; हिन्दी में यह उपमा के साथ स्वाभाविक लगती है।
theological_decisions:
- issue: अंतिम उपमा का आशय
  choice: मुख्य पाठ में संकेत-स्तंभ और ध्वज की उपमाओं को बनाए रखते हुए ‘अकेले रह जाओगे’ द्वारा पराजय के बाद बचे हुए, अलग-थलग और स्पष्ट दिखाई देने वाले अवशेष का भाव व्यक्त किया गया है।
  alternative: उपमा को केवल चेतावनी-संकेत की दृश्यता, या केवल निर्बलता और अल्पता का चित्र माना जा सकता है।
  rationale: ऊँचे स्थानों पर स्थित स्तंभ और ध्वज का समानांतर चित्र अकेलेपन, खुले में दिखाई देने और बचे रह जाने—इन सभी भावों को एक साथ सम्भव बनाता है। अनुवाद रूपक को विस्तार से समझाकर किसी एक धार्मिक व्याख्या में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सुबोध, गरिमापूर्ण और सीधा शैली-स्तर रखा गया है। ‘फटकार’, ‘संकेत-स्तंभ’ और ‘ध्वज’ मूल युद्ध-सन्दर्भ तथा ऊँचे स्थान पर अकेले दिखाई देने वाले चिह्न की काव्यात्मक छवि को बनाए रखते हैं। सभी पादटिप्पणी-चिह्न सम्बद्ध शब्दों के ठीक बाद मुख्य पाठ में दिए गए हैं।
