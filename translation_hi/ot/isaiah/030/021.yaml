source:
  edition: WLC
  text: וְ/אָזְנֶ֨י/ךָ֙ תִּשְׁמַ֣עְנָה דָבָ֔ר מֵֽ/אַחֲרֶ֖י/ךָ לֵ/אמֹ֑ר זֶ֤ה הַ/דֶּ֨רֶךְ֙ לְכ֣וּ ב֔/וֹ כִּ֥י תַאֲמִ֖ינוּ וְ/כִ֥י תַשְׂמְאִֽילוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/021.yaml
  text: And your ears shall hear a word behind you[a], saying, “This is the way; walk in it,” when you turn to the right and when you turn to the left.
translation:
  language: hi
  text: और तुम्हारे कान तुम्हारे पीछे से एक वचन सुनेंगे, जो कहेगा, “यही मार्ग है; इसी पर चलो,” जब तुम दाहिनी ओर मुड़ोगे और जब बाईं ओर मुड़ोगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तुम दाहिनी ओर जाओगे और जब बाईं ओर जाओगे।” इस अंतिम उपवाक्य के हिब्रू क्रियारूप कठिन हैं; आशय यह है कि किसी भी ओर मुड़ने के समय मार्गदर्शन मिलेगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָזְנֶיךָ
  choice: तुम्हारे कान
  rationale: बहुवचन रूप और प्रत्यक्ष शारीरिक बिंब को बनाए रखता है।
- source_word: תִּשְׁמַעְנָה
  choice: सुनेंगे
  rationale: अपूर्ण काल यहाँ भविष्य की भविष्यवाणीय प्रतिज्ञा व्यक्त करता है और स्त्रीलिंग बहुवचन ‘कान’ से मेल खाता है।
- source_word: דָבָר
  choice: यह वचन
  rationale: ‘वचन’ मूल शब्द का संक्षिप्त और गरिमापूर्ण रूप है; हिन्दी में प्रत्यक्ष कथन की ओर संकेत करने के लिए ‘यह’ स्वाभाविक है, बिना वक्ता की पहचान तय किए।
- source_word: מֵאַחֲרֶיךָ
  choice: अपने पीछे से
  rationale: पीछे से आने वाले मार्गदर्शक वचन का सजीव स्थानिक बिंब सुरक्षित रहता है।
- source_word: זֶה הַדֶּרֶךְ
  choice: मार्ग यही है
  rationale: ‘मार्ग’ शाब्दिक दिशा और जीवन-आचरण—दोनों संभावित अर्थों को खुला रखता है; ‘यही’ संकेतवाचक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְכוּ בוֹ
  choice: इसी पर चलो
  rationale: चलने के वास्तविक और रूपकात्मक दोनों अर्थों को बनाए रखते हुए हिन्दी में मार्ग के साथ स्वाभाविक प्रयोग है।
- source_word: כִּי תַאֲמִינוּ
  choice: जब तुम दाहिनी ओर मुड़ोगे
  rationale: यह कठिन हिब्रू रूप समानांतर बाएँ मुड़ने वाले पद के आधार पर दाहिनी ओर मुड़ने या जाने के अर्थ में समझा गया है।
- source_word: וְכִי תַשְׂמְאִילוּ
  choice: और जब बाईं ओर मुड़ोगे
  rationale: हिफ़ील रूप बाईं ओर मुड़ने या जाने को बताता है; ‘और जब’ हिब्रू समानांतर रचना को बनाए रखता है।
theological_decisions:
- issue: मार्गदर्शन देने वाले ‘वचन’ का स्वरूप
  choice: ईश्वर की ओर से मिला मार्गदर्शक वचन, पर उसके माध्यम को अनिर्दिष्ट रखना
  alternative: किसी शिक्षक की आवाज़, अंतःकरण की प्रेरणा, या भविष्यद्वक्तात्मक शिक्षा
  rationale: इस पद में मार्गदर्शन का आश्वासन है, पर इस उपवाक्य में वक्ता या माध्यम की स्पष्ट पहचान नहीं दी गई; इसलिए अनुवाद उस अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘मार्ग’ और ‘वचन’ बाइबलीय प्रतिध्वनि बनाए रखते हैं, पर भाषा सामान्य पाठक के लिए स्पष्ट है।
