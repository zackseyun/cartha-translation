source:
  edition: WLC
  text: וּ/מִצְרַ֕יִם הֶ֥בֶל וָ/רִ֖יק יַעְזֹ֑רוּ לָ/כֵן֙ קָרָ֣אתִי לָ/זֹ֔את רַ֥הַב הֵ֖ם שָֽׁבֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/007.yaml
  text: For Egypt’s help is utterly empty and worthless[a]; therefore I call her[b], “Rahab Who Sits Still.”
translation:
  language: hi
  text: 'क्योंकि मिस्र की सहायता व्यर्थ और निष्फल है; इसलिए मैंने उसे यह नाम दिया है: “रहब[a]—जो निष्क्रिय बैठी रहती है।”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “रहब” मिस्र का एक काव्यात्मक नाम या उपनाम है; इस शब्द में “घमंड” या “डींग” का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पदबंध बहुत संक्षिप्त है। इसका अनुवाद “रहब—वे बैठे रहते हैं” या “डींग मारनेवाली जो कुछ नहीं करती” भी हो सकता है। यह संभवतः घमंडी परंतु निष्क्रिय मिस्र पर व्यंग्य है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִצְרַיִם
  choice: क्योंकि मिस्र की
  rationale: संयोजक यहाँ पिछले कथन का कारण बताता है। हिंदी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הֶבֶל וָרִיק
  choice: व्यर्थ और निष्फल
  rationale: दोनों शब्द मिस्र की सहायता की खोखली और बेअसर प्रकृति पर बल देते हैं। यह युग्म अर्थ की तीव्रता बनाए रखते हुए हिंदी में अनावश्यक पुनरावृत्ति से बचता है।
- source_word: יַעְזֹרוּ
  choice: सहायता ... है
  rationale: मूल में क्रिया बहुवचन है और मिस्र या उसके प्रतिनिधियों की सामूहिक सहायता को सूचित करती है। हिंदी में संज्ञात्मक रचना ‘मिस्र की सहायता ... है’ भाव को स्पष्ट और स्वाभाविक रखती है।
- source_word: לָכֵן קָרָאתִי לָזֹאת
  choice: इसलिए मैंने उसे यह नाम दिया है
  rationale: स्त्रीलिंग संकेतवाचक मिस्र को मानवीकृत राष्ट्र के रूप में इंगित करता है। पूर्ण क्रिया को यहाँ दिए गए स्थायी उपनाम के रूप में वर्तमान पूर्ण काल में व्यक्त किया गया है।
- source_word: רַהַב
  choice: रहब
  rationale: यह मिस्र के लिए प्रयुक्त काव्यात्मक उपनाम है, जिसमें घमंड या डींग का भाव भी हो सकता है। नाम-जैसे रूप को लिप्यंतरित किया गया और अर्थ-संकेत पादटिप्पणी में रखा गया है।
- source_word: הֵם שָׁבֶת
  choice: जो निष्क्रिय बैठी रहती है
  rationale: संक्षिप्त और कठिन इब्रानी पदबंध संभवतः मिस्र की निष्क्रियता पर व्यंग्य करता है। स्त्रीलिंग एकवचन रूप मानवीकृत मिस्र से मेल खाता है, जबकि ‘निष्क्रिय बैठी’ बैठने के बिंब और कुछ न करने के आशय दोनों को रखता है।
theological_decisions:
- issue: रַהַב הֵם שָׁבֶת व्यंग्यात्मक नाम का अनुवाद
  choice: “रहब—जो निष्क्रिय बैठी रहती है”
  alternative: “रहब—वे बैठे रहते हैं”; “घमंड जो बैठा रहता है”; “डींग मारनेवाली जो कुछ नहीं करती”
  rationale: यह पद भविष्यद्वाणी के व्यंग्य द्वारा घमंडी किंतु बेअसर मिस्र को चित्रित करता है। चुना हुआ रूप काव्यात्मक उपनाम, मानवीकरण और निष्क्रियता का विरोधाभास बनाए रखता है; मूल की संक्षिप्त अस्पष्टता को पादटिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। ‘निष्क्रिय बैठी रहती है’ सामान्य पाठक के लिए स्पष्ट है और मूल के बैठने वाले बिंब को भी बनाए रखता है।
