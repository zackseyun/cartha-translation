source:
  edition: WLC
  text: אֲשֶׁ֨ר אָמְר֤וּ לָֽ/רֹאִים֙ לֹ֣א תִרְא֔וּ וְ/לַ֣/חֹזִ֔ים לֹ֥א תֶחֱזוּ לָ֖/נוּ נְכֹח֑וֹת דַּבְּרוּ לָ֣/נוּ חֲלָק֔וֹת חֲז֖וּ מַהֲתַלּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/010.yaml
  text: who say to the seers[a], “Do not see,” and to the visionaries, “Do not envision for us what is right; speak to us smooth things[b]; envision illusions.”
translation:
  language: hi
  text: जो द्रष्टाओं से कहते हैं, “मत देखो,” और दर्शन देखनेवालों से, “हमारे लिए उचित बातें[a] मत देखो; हमसे चिकनी-चुपड़ी बातें कहो; भ्रामक दर्शन[b] देखो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खरी बातें,” “सीधी बातें,” अथवा “सच्ची बातें।” इब्रानी शब्द उस बात को दर्शाता है जो सीधी, उचित या सही हो।
    reason: lexical_alternative
  - marker: b
    text: या “भ्रम” अथवा “धोखे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאִים
  choice: द्रष्टाओं
  rationale: यह ראה का संज्ञा के रूप में प्रयुक्त कर्तृवाचक रूप है और भविष्यद्वाणी के संदर्भ में ऐसे व्यक्तियों को दर्शाता है जो परमेश्वर से दर्शन पाते हैं।
- source_word: תִרְאוּ
  choice: मत देखो
  rationale: רֹאִים के साथ मूल पाठ की शब्द-क्रीड़ा को यथासंभव बनाए रखते हुए निषेध को सीधे रूप में व्यक्त करता है।
- source_word: חֹזִים
  choice: दर्शन देखनेवालों
  rationale: חזה से निकले इस दूसरे भविष्यदर्शी पद को רֹאִים से कुछ अलग रखा गया है, साथ ही भाषा सामान्य पाठक के लिए स्पष्ट रहती है।
- source_word: תֶחֱזוּ
  choice: दर्शन मत देखो / दिखाओ
  rationale: पहले प्रयोग में ‘दर्शन मत देखो’ भविष्यदर्शी क्रिया को व्यक्त करता है; अंतिम खंड में प्रसंगानुकूल ‘दिखाओ’ उन दर्शनों को लोगों तक पहुँचाने की माँग स्पष्ट करता है।
- source_word: נְכֹחוֹת
  choice: सही बातें
  rationale: शब्द सीधी, खरी, उचित या सत्य बातों का बोध देता है। ‘सही बातें’ उसके नैतिक और तथ्यगत दोनों पहलुओं को खुला रखता है।
- source_word: חֲלָקוֹת
  choice: चिकनी-चुपड़ी बातें
  rationale: यह मूल के ‘चिकनी बातों’ के चित्र को स्वाभाविक हिन्दी में रखता है और खुशामदी, सुखद या बहलानेवाली वाणी का संकेत देता है।
- source_word: מַהֲתַלּוֹת
  choice: छलावे
  rationale: यह भ्रामक, धोखा देनेवाली या मिथ्या बातों को सूचित करता है; ‘छलावे’ दर्शन के संदर्भ में असत्य और भ्रम दोनों भावों को संक्षेप में व्यक्त करता है।
- source_word: אֲשֶׁר אָמְרוּ
  choice: जो ... कहते हैं
  rationale: यह पिछले संदर्भ के विद्रोही लोगों का चरित्र बतानेवाला संबंधवाचक वाक्य है; वर्तमानकालीन हिन्दी इस निरंतर प्रवृत्ति को स्वाभाविक रूप से व्यक्त करती है।
theological_decisions:
- issue: अस्वीकृत भविष्यद्वाणी की प्रकृति
  choice: נְכֹחוֹת को ‘सही बातें’ कहा गया है।
  alternative: ‘खरी बातें,’ ‘सीधी बातें,’ या केवल ‘सत्य बातें’
  rationale: यह चयन नैतिक रूप से उचित और तथ्यतः सत्य, दोनों अर्थों की संभावना बनाए रखता है और इसे किसी संकीर्ण धर्मसैद्धांतिक श्रेणी तक सीमित नहीं करता।
- issue: भविष्यदर्शियों के लिए प्रयुक्त दो समानांतर पदों का भेद
  choice: רֹאִים के लिए ‘द्रष्टाओं’ और חֹזִים के लिए ‘दर्शन देखनेवालों’ का प्रयोग किया गया है।
  alternative: दोनों को ‘द्रष्टा’ या ‘भविष्यद्वक्ता’ कहना
  rationale: मूल इब्रानी दो संबंधित पर अलग शब्दों का प्रयोग करता है। हिन्दी में हल्का भेद रखकर इस समानांतरता और शब्दगत तनाव को सुरक्षित किया गया है।
- issue: अंतिम क्रिया का हिन्दी रूप
  choice: अंतिम תֶחֱזוּ को प्रसंगानुकूल ‘दिखाओ’ कहा गया है।
  alternative: ‘दर्शन देखो’ या ‘दर्शन करो’
  rationale: इब्रानी में वही दर्शन-संबंधी क्रिया है, पर हिन्दी में ‘छलावे देखो’ से आशय केवल निजी रूप से देखने का लग सकता है। ‘दिखाओ’ श्रोताओं की माँग—उन्हें भ्रामक भविष्यद्वाणी सुनाने की—को स्वाभाविक रूप से व्यक्त करता है, यद्यपि शब्दगत पुनरावृत्ति कुछ कम हो जाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप रखा गया है। ‘चिकनी-चुपड़ी बातें’ प्रचलित मुहावरा है और मूल के ‘चिकनी बातों’ वाले चित्र को बनाए रखता है। ‘द्रष्टा’ बाइबलीय संदर्भ में परिचित औपचारिक शब्द है, जबकि ‘दर्शन देखनेवाले’ दूसरे इब्रानी पद का भेद स्पष्ट करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
