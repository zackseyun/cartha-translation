source:
  edition: WLC
  text: וַ/תֹּ֨אמְר֥וּ לֹא כִ֛י עַל ס֥וּס נָנ֖וּס עַל כֵּ֣ן תְּנוּס֑וּ/ן וְ/עַל קַ֣ל נִרְכָּ֔ב עַל כֵּ֖ן יִקַּ֥לּוּ רֹדְפֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/016.yaml
  text: But you said[a], “No, for we will flee on horses”—therefore you will flee; and, “We will ride on swift horses”—therefore your pursuers will be swift.
translation:
  language: hi
  text: पर तुमने कहा, “नहीं, क्योंकि हम घोड़ों पर सवार होकर भागेंगे”—इसलिए तुम भागोगे; और कहा, “हम तेज़ घोड़ों पर सवारी करेंगे”—इसलिए तुम्हारा पीछा करनेवाले तेज़ होंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמְרוּ
  choice: पर तुमने कहा
  rationale: वाव कथन को आगे बढ़ाता है, जबकि संदर्भ में यह पिछले पद की परमेश्वर की बात के प्रति विरोधी उत्तर है; इसलिए ‘पर’ स्वाभाविक है।
- source_word: לֹא כִּי
  choice: नहीं!
  rationale: यह जोरदार अस्वीकृति है; इसके बाद का कथन उनकी वैकल्पिक योजना बताता है। हिंदी में विस्मयादिबोधक चिह्न उस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל סוּס נָנוּס
  choice: हम घोड़ों पर सवार होकर भागेंगे
  rationale: स्रोत में ‘घोड़े पर’ सामूहिक अर्थ रखता है। ‘सवार होकर’ जोड़ने से हिंदी में घोड़ों द्वारा पलायन का आशय स्पष्ट और स्वाभाविक होता है।
- source_word: עַל כֵּן תְּנוּסוּן
  choice: इसलिए तुम सचमुच भागोगे
  rationale: दोहराए गए मूल נוּס के शब्द-खेल और दंडात्मक विडंबना को सुरक्षित रखा गया है; ‘सचमुच’ उत्तर की निश्चितता और प्रत्युत्तर का बल व्यक्त करता है।
- source_word: וְעַל קַל נִרְכָּב
  choice: और कहा, “हम तेज़ घोड़ों पर सवारी करेंगे”
  rationale: קַל का शाब्दिक अर्थ ‘हल्का’ और प्रसंगगत अर्थ ‘तेज़’ है। संज्ञा निहित है और पिछले खंड के סוּס से ‘घोड़े’ समझे जाते हैं; हिंदी में उसे स्पष्ट करना स्वाभाविक है।
- source_word: עַל כֵּן יִקַּלּוּ רֹדְפֵיכֶם
  choice: इसलिए तुम्हारा पीछा करनेवाले भी तेज़ होंगे
  rationale: 'कथन में गति की विडंबनापूर्ण समानता बनी रहती है: जिन तेज़ सवारियों पर भरोसा किया गया, उनका पीछा करनेवाले भी तेज़ होंगे। ‘भी’ इस समानांतरता को हिंदी में स्पष्ट करता है।'
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली। मूल की समानांतर रचना, ‘भागेंगे/भागोगे’ की विडंबना और ‘तेज़/तेज़’ की पुनरावृत्ति सुरक्षित रखी गई है।
