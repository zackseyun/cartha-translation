source:
  edition: WLC
  text: וְ/רוּח֞/וֹ כְּ/נַ֤חַל שׁוֹטֵף֙ עַד צַוָּ֣אר יֶֽחֱצֶ֔ה לַ/הֲנָפָ֥ה גוֹיִ֖ם בְּ/נָ֣פַת שָׁ֑וְא וְ/רֶ֣סֶן מַתְעֶ֔ה עַ֖ל לְחָיֵ֥י עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/028.yaml
  text: and his breath is like an overflowing stream[a]; it reaches up to the neck, to sift nations with a sieve of emptiness[c][b], and a misleading bridle is on the jaws of the peoples.
translation:
  language: hi
  text: और उसकी साँस उमड़ती हुई धारा के समान है[a], जो गरदन तक पहुँचती है। वह राष्ट्रों को व्यर्थता की छलनी से छानने के लिए है[b]; और लोगों के जबड़ों पर भटकाने वाली लगाम है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी आत्मा” अथवा “उसकी वायु”।
    reason: lexical_alternative
  - marker: b
    text: या “व्यर्थता की छलनी से,” “मिथ्या की छलनी से,” अथवा “निकम्मी छलनी से।”
    reason: lexical_alternative
  - marker: c
    text: या “लोगों के गालों/जबड़ों पर भटकाने वाली लगाम।”
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: רוּחוֹ
  choice: उसकी साँस
  rationale: רוּחַ का अर्थ साँस, वायु या आत्मा हो सकता है। निकट संदर्भ में यह यहोवा के मुँह से निकलने वाले विनाशकारी प्रकोप का चित्र है, इसलिए ‘साँस’ मुख्य पाठ में सबसे स्वाभाविक है; अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: כְּנַחַל שׁוֹטֵף
  choice: उमड़ती हुई धारा के समान
  rationale: נחל धारा या बरसाती नदी और שׁוֹטֵף बहने, उमड़ने या बहा ले जाने वाली बाढ़ का बोध देता है। यह अनुवाद जलप्रवाह की तीव्रता और बढ़ते स्तर दोनों को व्यक्त करता है।
- source_word: עַד צַוָּאר יֶחֱצֶה
  choice: जो गरदन तक पहुँचती है
  rationale: חצה का मूल अर्थ बाँटना या चीरना है, पर बाढ़ के इस बिंब में वाक्यांश को सामान्यतः जल के गरदन तक पहुँचने के अर्थ में समझा जाता है। हिंदी में यह अर्थ स्पष्ट और स्वाभाविक है।
- source_word: לַהֲנָפָה
  choice: छानता है
  rationale: नוף से बना यह रूप हिलाने, फटकने या छानने की क्रिया बताता है। साथ आए ‘छलनी’ के कारण ‘छानना’ हिंदी में सबसे सुसंगत है।
- source_word: גּוֹיִם
  choice: राष्ट्रों
  rationale: यहाँ גוים राजनीतिक-सामूहिक इकाइयों को दर्शाता है; न्याय के संदर्भ में ‘राष्ट्र’ उपयुक्त है।
- source_word: בְּנָפַת שָׁוְא
  choice: व्यर्थता की छलनी से
  rationale: נפה ‘छलनी’ है और שוא में व्यर्थता, खोखलापन, मिथ्यापन या निकम्मेपन की अर्थ-सीमा है। ‘व्यर्थता’ मूल की असामान्य तथा कठोर छवि को बिना अधिक व्याख्या के बनाए रखती है।
- source_word: רֶסֶן
  choice: लगाम
  rationale: רסן पशु को नियंत्रित और दिशा देने वाली लगाम को सूचित करता है। हिंदी में ‘लगाम’ रूपक को स्पष्ट रूप से बनाए रखता है।
- source_word: מַתְעֶה
  choice: भटकाने वाली
  rationale: תעה से निकला यह रूप किसी को मार्ग से भटकाने या गलत दिशा में ले जाने का सक्रिय भाव रखता है।
- source_word: עַל לְחָיֵי עַמִּים
  choice: लोगों के जबड़ों पर
  rationale: לחי का अर्थ गाल या जबड़ा हो सकता है। लगाम के बिंब में ‘जबड़ा’ अधिक उपयुक्त है; עמים के लिए ‘लोग’ राष्ट्रों के भीतर या विभिन्न जनसमूहों का सामूहिक भाव रखता है।
theological_decisions:
- issue: ‘उसकी साँस’ में सर्वनाम का संदर्भ
  choice: सर्वनाम निकट संदर्भ में यहोवा की ओर संकेत करता है
  alternative: इसे किसी निरपेक्ष तूफ़ानी शक्ति का संकेत समझना
  rationale: आसपास के पद यहोवा के क्रोध में आने, उसके होंठों और उसकी वाणी का वर्णन करते हैं। ‘उसकी’ व्यक्तिगत दैवी कर्तृत्व को बनाए रखता है, पर अतिरिक्त धर्मसैद्धांतिक निष्कर्ष नहीं जोड़ता।
- issue: अंतिम दो उपवाक्यों में निहित कर्ता
  choice: प्रवाह बनाए रखने के लिए ‘वह’ को स्पष्ट करके यहोवा को छानने और लगाम डालने वाला बताया गया है
  alternative: दोनों वाक्यांशों को केवल ‘उसकी साँस’ से व्याकरणिक रूप से जोड़ना
  rationale: हिब्रू में उद्देश्य और सहवर्ती बिंब संक्षिप्त हैं तथा कर्ता निहित है। संदर्भ दैवी न्याय की क्रिया बताता है; हिंदी में स्पष्ट कर्ता आवश्यक है, फिर भी मूल की दैवी एजेंसी सुरक्षित रहती है।
- issue: ‘व्यर्थता की छलनी’ का आशय
  choice: असामान्य रूपक को ज्यों का त्यों रखा गया है
  alternative: इसे स्पष्टतः ‘विनाशकारी छलनी’ या ‘झूठी छलनी’ कहना
  rationale: שוא की अर्थ-सीमा अनेक है। किसी एक व्याख्यात्मक अर्थ को मुख्य पाठ में थोपने के बजाय वास्तविक अस्पष्टता को पादटिप्पणी सहित सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘गरदन,’ ‘छलनी,’ ‘जबड़े’ और ‘लगाम’ जैसे ठोस शब्द मूल के तीखे काव्यात्मक बिंब सुरक्षित रखते हैं। मुख्य पाठ में सभी पादटिप्पणी चिह्न [a], [b], [c] उपस्थित हैं।
