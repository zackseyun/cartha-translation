  text: הַ/שִּׁיר֙ יִֽהְיֶ֣ה לָ/כֶ֔ם כְּ/לֵ֖יל הִתְקַדֶּשׁ חָ֑ג וְ/שִׂמְחַ֣ת לֵבָ֗ב כַּֽ/הוֹלֵךְ֙ בֶּֽ/חָלִ֔יל לָ/ב֥וֹא בְ/הַר יְהוָ֖ה אֶל צ֥וּר יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/029.yaml
  text: The song will be for you as in the night when a feast is consecrated[a], and gladness of heart as when one goes with the flute to come to the mountain of Yahweh[d][c][b], to the Rock of Israel.
translation:
  language: hi
  text: तुम्हारे लिए गीत वैसा होगा जैसी उस रात में होता है जब कोई पर्व पवित्र ठहराया जाता है[a], और तुम्हारे हृदय में वैसा आनन्द होगा जैसा उस व्यक्ति के हृदय में होता है जो बाँसुरी के साथ[b] याहवे[c] के पर्वत तक, इस्राएल की चट्टान की ओर[d], आने के लिए जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उस रात जैसा, जब कोई पर्व पवित्र ठहराया जाता है।’ इब्रानी वाक्यांश सम्भवतः किसी तीर्थ-पर्व की रात की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘बाँसुरी के साथ।’ आशय बाँसुरी बजाते हुए चलने या बाँसुरी के संगीत के साथ जुलूस में चलने से हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘याहवे’ इब्रानी ईश्वरीय नाम יהוה का लिप्यंतरण है; इसे परम्परागत रूप से ‘यहोवा’ या ‘प्रभु’ भी लिखा जाता है।
    reason: alternative_reading
  - marker: d
    text: या, ‘इस्राएल की चट्टान तक।’ ‘चट्टान’ परमेश्वर के लिए एक उपाधि है, जो उसकी सामर्थ्य, स्थिरता और शरण देने की क्षमता को व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשִּׁיר יִהְיֶה לָכֶם
  choice: तुम्हारे लिए वैसा गीत होगा
  rationale: इब्रानी की निश्चित संज्ञा और לָכֶם के अनुभव/अधिकार-सूचक भाव को बनाए रखते हुए हिन्दी में स्वाभाविक तुलना प्रस्तुत की गई है।
- source_word: כְּלֵיל הִתְקַדֶּשׁ חָג
  choice: जैसा उस रात होता है जब कोई पर्व पवित्र ठहराया जाता है
  rationale: तुलनात्मक כְּ, पर्व की रात और הִתְקַדֶּשׁ के पवित्र प्रयोजन के लिए अलग किए जाने के भाव को सुरक्षित रखा गया है; वाक्यांश की संक्षिप्त इब्रानी बनावट को अत्यधिक स्पष्ट नहीं किया गया।
- source_word: וְשִׂמְחַת לֵבָב
  choice: और हृदय में वैसा आनन्द होगा
  rationale: संज्ञात्मक समानांतर वाक्यांश को हिन्दी में स्वाभाविक बनाने के लिए पहले खंड से क्रिया की पूर्ति की गई, जबकि 'हृदय' की मूल मानवीय अभिव्यक्ति रखी गई है।
- source_word: כַּהוֹלֵךְ בֶּחָלִיל
  choice: जैसा बाँसुरी की धुन के साथ ... जाने वाले को होता है
  rationale: प्रतिभागी रूप הוֹלֵךְ के सामान्य व्यक्ति-सूचक भाव और חָלִיל के उत्सवी वाद्य-संगीत को व्यक्त किया गया है; यह अनिर्णीत रखा गया है कि यात्री स्वयं वाद्य बजा रहा है या जुलूस संगीत के साथ चल रहा है।
- source_word: בְהַר יְהוָה
  choice: याहवे के पर्वत पर
  rationale: गति-सूचक प्रसंग में בְ को हिन्दी के गंतव्य-सूचक 'पर' से व्यक्त किया गया है और יהוה को व्यक्तिगत नाम 'याहवे' के रूप में लिप्यंतरित किया गया है।
- source_word: אֶל צוּר יִשְׂרָאֵל
  choice: इस्राएल की चट्टान के पास
  rationale: אֶל का दिशासूचक अर्थ और צוּר का ईश्वर के लिए प्रयुक्त सामर्थ्य, स्थिरता और शरण का रूपक सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। 'याहवे' उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है; पादटिप्पणी पाठकों को अन्य परम्परागत रूपों से अवगत कराती है।
- issue: הִתְקַדֶּשׁ חָג का पवित्र उपासना-संबंधी भाव
  choice: जब कोई पर्व पवित्र ठहराया जाता है
  alternative: जब पवित्र पर्व मनाया जाता है; पर्व के लिए अपने को पवित्र करने की रात
  rationale: यह चयन पर्व को पवित्र प्रयोजन के लिए अलग ठहराने का भाव रखता है, पर वाक्यांश के कर्ता या ठीक अनुष्ठान के विषय में मूल पाठ से अधिक निश्चित दावा नहीं करता।
- issue: צוּר יִשְׂרָאֵל का ईश्वरीय रूपक
  choice: इस्राएल की चट्टान
  alternative: इस्राएल का दृढ़ आश्रय
  rationale: रूपक को व्याख्यात्मक अमूर्त संज्ञा में बदलने के बजाय सुरक्षित रखा गया है, जिससे सामर्थ्य, स्थिरता और शरण के संयुक्त अर्थ बने रहें।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सहज धार्मिक गद्य। ‘आनन्द’, ‘पवित्र ठहराया’ और ‘चट्टान’ जैसे परिचित शब्द मूल की उत्सवी और उपासना-संबंधी छवि बनाए रखते हैं। वाक्य में दोनों तुलनाओं का समानांतर ढाँचा रखा गया है और अनावश्यक साम्प्रदायिक शब्दावली से बचा गया है।
