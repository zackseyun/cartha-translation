base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/031.yaml
  text: For at the voice of Yahweh Assyria will be shattered[b][a]; with a rod he will strike.
translation:
  language: hi
  text: क्योंकि यहोवा की वाणी से अश्शूर चूर हो जाएगा[a]; वह छड़ी से प्रहार करेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भयभीत हो जाएगा,” “टूट जाएगा” अथवा “ध्वस्त हो जाएगा”; इब्रानी क्रिया भय, पतन या चूर हो जाने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “प्रहार करेगा” का कर्ता दोहराया नहीं गया है; पिछले खंड के आधार पर उसे सबसे स्वाभाविक रूप से यहोवा समझा गया है। कर्म भी स्पष्ट रूप से नहीं दिया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִקּוֹל
  choice: की वाणी से
  rationale: מִן यहाँ कारण अथवा माध्यम का भाव देता है। ‘वाणी से’ यहोवा के उच्चरित स्वर की जीवंतता और उसके प्रभाव दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चार-अक्षरीय व्यक्तिगत नाम का हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है, न कि उसे किसी उपाधि से बदला गया है।
- source_word: יֵחַת
  choice: चूर हो जाएगा
  rationale: חתת का निफ़अल रूप भयभीत होने, टूटने या ध्वस्त होने का अर्थ दे सकता है। न्याय और युद्ध के प्रसंग में ‘चूर हो जाएगा’ मानसिक और सामरिक पतन की तीव्रता व्यक्त करता है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: אַשּׁוּר
  choice: अश्शूर
  rationale: यहाँ नाम राष्ट्र/साम्राज्य को सूचित करता है; ‘अश्शूर’ हिन्दी बाइबलीय परंपरा में पहचाना जाने वाला रूप है।
- source_word: בַּשֵּׁבֶט
  choice: छड़ी से
  rationale: שֵׁבֶט का अर्थ छड़ी, दंड या राजदंड हो सकता है। प्रहार के साधन के रूप में ‘छड़ी’ स्पष्ट और स्वाभाविक है।
- source_word: יַכֶּה
  choice: वह उसे ... मारेगा
  rationale: נכה का हिफ़ील रूप ‘मारना/प्रहार करना’ है। पुल्लिंग एकवचन कर्ता को निकटतम स्वाभाविक पूर्वपद यहोवा माना गया है और ‘उसे’ से अश्शूर को कर्म के रूप में स्पष्ट किया गया है; मूल में कर्ता दोहराया नहीं गया, इसलिए यह निर्णय पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: יַכֶּה में अप्रकट कर्ता का संदर्भ
  choice: ‘वह’ से यहोवा और ‘उसे’ से अश्शूर अभिप्रेत है।
  alternative: इब्रानी में कर्ता स्पष्ट रूप से दोहराया नहीं गया; वाक्य की अन्य व्याकरणिक व्याख्याएँ अधिक निर्वैयक्तिक या भिन्न कर्ता-कर्म संबंध सुझा सकती हैं।
  rationale: पिछले खंड में यहोवा निकटतम और प्रसंगानुकूल कर्ता है, और पूरा संदर्भ अश्शूर पर उसके न्याय का है। फिर भी मूल की अप्रकटता को पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चूर हो जाएगा’ न्याय की तीव्रता व्यक्त करता है, जबकि मूल क्रिया की अर्थ-व्याप्ति पादटिप्पणी में संरक्षित है। दोनों पादटिप्पणी-चिह्न संबंधित मुख्य पाठ में लगाए गए हैं।
