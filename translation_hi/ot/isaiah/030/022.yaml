  text: וְ/טִמֵּאתֶ֗ם אֶת צִפּוּי֙ פְּסִילֵ֣י כַסְפֶּ֔/ךָ וְ/אֶת אֲפֻדַּ֖ת מַסֵּכַ֣ת זְהָבֶ֑/ךָ תִּזְרֵ/ם֙ כְּמ֣וֹ דָוָ֔ה צֵ֖א תֹּ֥אמַר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/022.yaml
  text: And you will defile the silver overlay of your carved idols and the gold plating of your cast images. You will scatter them like a menstrual cloth; you will say to them, “Go out!”
translation:
  language: hi
  text: तुम अपनी खुदी हुई मूर्तियों के चाँदी के आवरण और अपनी ढली हुई प्रतिमाओं की सोने की मढ़ावट को अशुद्ध करोगे। तुम उन्हें मासिक धर्म के कपड़े की तरह फेंक दोगे और उनसे कहोगे, “दूर हो जाओ!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल इब्रानी पाठ में यहाँ सर्वनाम एकवचन है: “उससे कहोगे, ‘निकल जा!’” संदर्भ में यह मूर्तियों अथवा उनकी मढ़ावटों के लिए सामूहिक रूप से प्रयुक्त हो सकता है।'
    reason: मूल के एकवचन सर्वनाम और संदर्भगत सामूहिक अर्थ के बीच की पाठगत/व्याख्यात्मक अनिश्चितता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: וְטִמֵּאתֶם
  choice: तुम ... अशुद्ध ठहराओगे
  rationale: पिअेल रूप किसी वस्तु को अशुद्ध मानने या अशुद्ध करके त्याज्य बनाने का भाव देता है; यह मूर्तियों के प्रति बदले हुए व्यवहार को स्पष्ट रखता है।
- source_word: צִפּוּי פְּסִילֵי כַסְפֶּךָ
  choice: अपनी खुदी हुई मूर्तियों पर मढ़ी चाँदी
  rationale: צִפּוּי आवरण/मढ़ावट और פְּסִילִים खुदी हुई मूर्तियों को दर्शाता है; हिन्दी में स्वाभाविक संबंध-विन्यास अपनाया गया है।
- source_word: אֲפֻדַּת מַסֵּכַת זְהָבֶךָ
  choice: अपनी ढली हुई प्रतिमाओं पर चढ़े सोने
  rationale: אֲפֻדָּה यहाँ चढ़ी हुई परत/मढ़ावट और מַסֵּכָה ढली हुई प्रतिमा का संकेत देता है; अनावश्यक तकनीकी कठोरता से बचते हुए दोनों तत्व सुरक्षित रखे गए हैं।
- source_word: תִּזְרֵם
  choice: तुम उन्हें ... फेंक दोगे
  rationale: मूल क्रिया बिखेरने या फेंक देने का भाव रखती है; प्रसंग में घृणा से त्यागना प्रमुख है। बहुवचन कर्म-प्रत्यय को 'उन्हें' से बनाए रखा गया है।
- source_word: כְּמוֹ דָוָה
  choice: मासिक धर्म के कपड़े के समान
  rationale: דָוָה मासिक धर्म की अशुद्धता/उससे जुड़ी वस्तु को सूचित करता है। प्रसंग में त्याज्य कपड़े की उपमा अभिप्रेत है; इसे शिष्ट किंतु स्पष्ट आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: צֵא
  choice: दूर हो जाओ
  rationale: शाब्दिक अर्थ 'निकल जा' है, पर मूर्तियों को घृणा से ठुकराने वाले आदेश को स्वाभाविक हिन्दी में 'दूर हो जाओ' व्यक्त करता है।
theological_decisions:
- issue: मूर्तियों को संबोधन में वचन-सामंजस्य
  choice: उनसे कहोगे, “दूर हो जाओ!”
  alternative: उससे कहोगे, “निकल जा!”
  rationale: मसोरेटिक पाठ में לָמוֹ/לוֹ का रूप संदर्भतः मूर्तियों या उनकी मढ़ावटों को सामूहिक रूप से संबोधित कर सकता है। निकटवर्ती बहुवचन कर्म-प्रत्यय תזרם और बहुवचन प्रतिमाओं के कारण हिन्दी में बहुवचन रखा गया है, बिना मूर्तियों को वास्तविक जीवन या सामर्थ्य देने का आशय जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूर्तिपूजा के त्याग की तीव्रता तथा मासिक धर्म से जुड़ी अशुद्धता की स्पष्ट उपमा को नरम करके हटाया नहीं गया है।
