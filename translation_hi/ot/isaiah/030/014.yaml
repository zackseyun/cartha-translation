base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/014.yaml
  text: and its breaking is like the breaking of a potter’s jar[a], smashed without pity[b], so that among its shattered pieces not a shard is found with which to take fire from the hearth or to scoop water from a cistern.
translation:
  language: hi
  text: 'और उसका टूटना कुम्हार के घड़े के टूटने जैसा होगा: घड़ा बिना दया के चकनाचूर कर दिया जाता है, यहाँ तक कि उसके टूटे हुए टुकड़ों में एक ठीकरा भी ऐसा नहीं मिलता जिससे चूल्हे से आग ली जा सके[a] या जलाशय से पानी निकाला जा सके[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जिससे चूल्हे से कोयले या अंगारे उठाए जा सकें।’ इब्रानी में शाब्दिक रूप से ‘जलने के स्थान से आग लेने’ की बात है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘कुंड’ या ‘तालाब से।’ इब्रानी शब्द अधिक सामान्य रूप से एकत्र हुए पानी के स्थान को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁבָרָהּ
  choice: और उसका टूटना
  rationale: स्त्रीलिंग प्रत्यय का संबंध पिछले संदर्भ की वस्तु से है; संज्ञात्मक रूप ‘उसका टूटना’ आगामी उपमा को स्वाभाविक रूप से प्रस्तुत करता है।
- source_word: כְּשֵׁבֶר
  choice: टूटने जैसा
  rationale: मूल के सजातीय शब्द-प्रयोग को हिन्दी में ‘टूटना/टूटने’ की पुनरावृत्ति से यथासंभव बनाए रखा गया है।
- source_word: נֵבֶל יוֹצְרִים
  choice: कुम्हार के घड़े
  rationale: यह कुम्हार द्वारा बनाया मिट्टी का पात्र है; ‘घड़ा’ आधुनिक हिन्दी में सहज है और आगे के ‘ठीकरा’ से चित्र स्पष्ट रहता है।
- source_word: כָּתוּת
  choice: चकनाचूर किया जाएगा
  rationale: यह प्रबल और पूर्ण रूप से तोड़ दिए जाने का भाव व्यक्त करता है।
- source_word: לֹא יַחְמֹל
  choice: उसे तनिक भी न बख्शा जाएगा
  rationale: शाब्दिक भाव ‘दया न करना/न बख्शना’ है। कर्मवाच्य हिन्दी में अनिर्दिष्ट कर्ता को जोड़े बिना विध्वंस की निर्ममता बनाए रखता है।
- source_word: וְלֹא יִמָּצֵא
  choice: एक ठीकरा भी ऐसा न मिलेगा
  rationale: परिणाम यह है कि कोई उपयोगी टुकड़ा तक शेष नहीं रहेगा; ‘भी’ पूर्णता पर बल देता है।
- source_word: בִמְכִתָּתוֹ
  choice: उसके टूटे हुए टुकड़ों में
  rationale: टूटने की अवस्था अथवा उसके परिणामस्वरूप बने टुकड़ों को सुबोध हिन्दी में व्यक्त करता है।
- source_word: חֶרֶשׂ
  choice: ठीकरा
  rationale: टूटे हुए मिट्टी के बर्तन का टुकड़ा; हिन्दी में सटीक, ठोस और इस प्रसंग के लिए स्वाभाविक शब्द है।
- source_word: לַחְתּוֹת אֵשׁ
  choice: आग ली जा सके
  rationale: मूल पाठ सामान्य रूप से ‘आग लेने’ की बात करता है; ‘अंगारे’ अधिक विशिष्ट व्याख्या है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: מִיָּקוּד
  choice: चूल्हे से
  rationale: शाब्दिक अर्थ आग जलने का स्थान है; घरेलू और व्यावहारिक दृश्य के लिए ‘चूल्हा’ सहज हिन्दी समतुल्य है।
- source_word: וְלַחְשֹׂף מַיִם
  choice: पानी उलीचा जा सके
  rationale: ठीकरे से जल निकालने की क्रिया के लिए ‘उलीचना’ सटीक है और पात्र के छोटे टुकड़े वाले दृश्य को बनाए रखता है।
- source_word: מִגֶּבֶא
  choice: जलाशय से
  rationale: शब्द एकत्र जल के स्थान को सूचित कर सकता है; ‘जलाशय’ व्यापक अर्थ को सुरक्षित रखता है, जबकि ‘कुंड’ भी संदर्भगत विकल्प है।
