  text: क्योंकि वे विद्रोही लोग हैं, झूठ बोलने वाले बच्चे[a], ऐसे बच्चे जो याहवे की व्यवस्था सुनना नहीं चाहते[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘धोखेबाज़ बच्चे’ अथवा ‘झूठे बच्चे’।
