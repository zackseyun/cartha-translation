  - marker: b
    text: या, ‘ऐसे बच्चे जो याहवे की शिक्षा सुनने से इनकार करते हैं।’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस सम्बन्ध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַם מְרִי
  choice: विद्रोही लोग
  rationale: मूल में ‘विद्रोह के लोग’ जैसा संज्ञात्मक प्रयोग है; हिन्दी में विशेषणात्मक रूप अर्थ और भविष्यवाणी के तीखेपन को स्वाभाविक ढंग से बनाए रखता है।
- source_word: בָּנִים
  choice: बच्चे
  rationale: यह लोगों को रूपक रूप में सन्तान कहता है। ‘बच्चे’ सामान्य, समावेशी और सहज है तथा केवल पुरुष सन्तान का संकेत नहीं देता।
- source_word: כֶּחָשִׁים
  choice: झूठ बोलनेवाले
  rationale: यह उन्हें असत्य से चरित्रांकित करता है। यह अनुवाद सीधे आरोप को रखता है, जबकि ‘धोखेबाज़’ सम्भव वैकल्पिक अर्थ है।
- source_word: לֹא אָבוּ שְׁמוֹעַ
  choice: सुनना नहीं चाहते
  rationale: इब्रानी पद केवल न सुन पाने को नहीं, बल्कि इच्छा न होने और हठपूर्वक अस्वीकार करने को व्यक्त करता है।
- source_word: תּוֹרַת
  choice: व्यवस्था
  rationale: यहाँ तोराह याहवे की अधिकारपूर्ण वाचा-सम्बन्धी व्यवस्था या शिक्षा है। ‘व्यवस्था’ उस वैधानिक और वाचागत भार को बनाए रखती है; ‘शिक्षा’ भी सम्भव है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत वाचा-नाम है; इसलिए किसी उपाधि से बदलने के बजाय उसका हिन्दी लिप्यन्तरण किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है; ‘प्रभु’ नाम को उपाधि में बदल देता।
- issue: भविष्यवाणी और वाचा के सन्दर्भ में תּוֹרָה
  choice: व्यवस्था
  alternative: शिक्षा; उपदेश
  rationale: ‘व्यवस्था’ याहवे के अधिकारपूर्ण वाचा-निर्देश का भार रखती है, पर मूल शब्द का व्यापक अर्थ ‘शिक्षा’ भी हो सकता है; इसलिए विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: שׁמע में सुनने और मानने का सम्बन्ध
  choice: सुनना
  alternative: ध्यान से सुनना; मानना
  rationale: मूल क्रिया का प्रत्यक्ष अर्थ सुनना है, जबकि सन्दर्भ में आज्ञापालन निहित है। ‘मानना’ करने से निहितार्थ स्पष्ट हो जाता, पर मूल की श्रवण-सम्बन्धी अभिव्यक्ति खो जाती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘विद्रोही लोग’ भविष्यवाणी के नैतिक आरोप को स्पष्ट करता है; ‘बच्चे’ मूल रूपक और उसकी पुनरावृत्ति को बनाए रखता है। वाक्य में मूल की क्रमिक अभियोगात्मक लय सुरक्षित है।
