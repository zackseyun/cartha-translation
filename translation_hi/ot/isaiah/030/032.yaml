source:
  edition: WLC
  text: וְ/הָיָ֗ה כֹּ֤ל מַֽעֲבַר֙ מַטֵּ֣ה מֽוּסָדָ֔ה אֲשֶׁ֨ר יָנִ֤יחַ יְהוָה֙ עָלָ֔י/ו בְּ/תֻפִּ֖ים וּ/בְ/כִנֹּר֑וֹת וּ/בְ/מִלְחֲמ֥וֹת תְּנוּפָ֖ה נִלְחַם ב/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/032.yaml
  text: And every stroke of the appointed rod that Yahweh lays on him will be with tambourines and lyres[b][a]; and with battles of brandishing he will fight against them.
translation:
  language: hi
  text: और उस नियत छड़ी के हर वार[a] के साथ, जिसे याहवे उस पर डालेगा, डफ और वीणाएँ बजेंगी; और लहराने-घुमाने के युद्धों में याहवे उससे[b] लड़ेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस नियत छड़ी के हर गुज़रने पर”; इब्रानी पदबंध कठिन है। यहाँ “वार” छड़ी के प्रत्येक प्रहार या घुमाव को व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यहाँ स्त्रीलिंग एकवचन प्रत्यय है, जिसका अर्थ “उस स्त्री/उस वस्तु से” हो सकता है; प्रसंग में उसका ठीक संदर्भ निश्चित नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: מַעֲבַר
  choice: वार
  rationale: इस कठिन पदबंध में मूल अर्थ ‘गुज़रना/पार होना’ है, पर छड़ी के संदर्भ में उसका प्रत्येक घुमाव या प्रहार अभिप्रेत जान पड़ता है। ‘वार’ दंड की छवि को स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: מַטֵּה מוּסָדָה
  choice: ठहराई हुई छड़ी
  rationale: מַטֵּה यहाँ दंड देने की छड़ी है और מוּסָדָה उसके पहले से स्थापित या नियत होने का भाव देता है। ‘ठहराई हुई’ मूल की स्थापना/नियति संबंधी ध्वनि को बनाए रखता है।
- source_word: אֲשֶׁר יָנִיחַ יְהוָה עָלָיו
  choice: याहवे उस पर जो ... छड़ी चलाएगा
  rationale: नוח के हिफ़ील रूप का मूल भाव किसी वस्तु को उस पर टिकाना या डालना है। छड़ी और वार के प्रसंग में ‘छड़ी चलाएगा’ स्वाभाविक हिन्दी है और न्यायात्मक प्रहार स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वरीय नाम को उपाधि से बदलने के बजाय उसके नाम के रूप में लिप्यंतरित किया गया है।
- source_word: בְּתֻפִּים וּבְכִנֹּרוֹת
  choice: डफ और वीणाएँ बजेंगी
  rationale: 'संबंधसूचक בְּ को संगति के रूप में समझा गया है: हर प्रहार के साथ उत्सवी वाद्य बजते हैं। ‘डफ’ और ‘वीणा’ आधुनिक पाठक के लिए परिचित और प्रसंगानुकूल वाद्य-नाम हैं।'
- source_word: וּבְמִלְחֲמוֹת תְּנוּפָה
  choice: हथियार घुमाकर किए जानेवाले युद्धों में
  rationale: תְּנוּפָה में लहराने या घुमाने की गति है। युद्ध के प्रसंग में निहित हथियार को स्पष्ट करके मूल की सजीव मारक गति स्वाभाविक हिन्दी में व्यक्त की गई है।
- source_word: נִלְחַם בָהּ
  choice: वह ... उससे लड़ेगा
  rationale: कर्ता को निकटवर्ती प्रसंग के अनुसार याहवे समझा गया है। हिन्दी ‘उससे’ मूल स्त्रीलिंग एकवचन प्रत्यय के अनिश्चित संदर्भ को बहुवचन बनाकर हल नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है; उसे नाम के रूप में रखना स्रोत के भेद को सुरक्षित रखता है।
- issue: अंतिम क्रिया का कर्ता और कर्म-संदर्भ
  choice: याहवे कर्ता है और ‘उससे’ का संदर्भ खुला रखा गया है
  alternative: याहवे अश्शूरियों से लड़ेगा; या छड़ी/कोई अन्य शक्ति कर्ता है
  rationale: पद 31–33 का प्रसंग याहवे द्वारा अश्शूर पर न्याय का समर्थन करता है, लेकिन בָהּ का स्त्रीलिंग एकवचन संदर्भ व्याकरणतः अनिश्चित है। अतः कर्ता को प्रसंगानुसार रखा गया और कर्म को हिन्दी में अस्पष्ट रहने दिया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और श्रव्य हिन्दी में रखी गई है। काव्यात्मक न्याय-दृश्य को स्पष्ट किया गया है, पर कठिन ‘गुज़रने/वार’ पदबंध और अंतिम सर्वनाम की वास्तविक अनिश्चितता पादटिप्पणियों में सुरक्षित है।
