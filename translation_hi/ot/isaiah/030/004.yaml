base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/004.yaml
  text: For his officials are in Zoan, and his envoys reach Hanes.
translation:
  language: hi
  text: क्योंकि उसके अधिकारी सोअन में हैं, और उसके दूत हानेस तक पहुँचते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרָיו
  choice: उसके अधिकारी
  rationale: שַׂר का अर्थ शासकीय पदधारी, प्रधान या अधिकारी हो सकता है; मिस्र से सहायता माँगने के राजनयिक संदर्भ में ‘अधिकारी’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: מַלְאָכָיו
  choice: उसके दूत
  rationale: यहाँ מַלְאָך मानवीय संदेशवाहक अथवा राजदूत को सूचित करता है; ‘दूत’ मूल की व्यापकता बनाए रखता है।
- source_word: יַגִּיעוּ
  choice: पहुँचते हैं
  rationale: נגע के हिफ़ील रूप का यहाँ अर्थ किसी स्थान तक पहुँचना है; वर्तमानकालीन वर्णन मूल के अपूर्ण क्रियारूप और प्रसंग के अनुकूल है।
- source_word: צֹעַן / חָנֵס
  choice: सोअन / हानेस
  rationale: मिस्र के स्थान-नामों को अर्थानुवाद के बजाय प्रचलित बाइबलीय लिप्यंतरण में रखा गया है।
theological_decisions:
- issue: एकवचन संबंधसूचक प्रत्यय ‘उसके’ का संदर्भ
  choice: मूल की तरह संदर्भ को स्पष्ट किए बिना ‘उसके’ रखा गया है।
  alternative: ‘यहूदा के’ या ‘राजा के’ अधिकारी और दूत
  rationale: इब्रानी पाठ स्वयं पूर्ववर्ती संदर्भ पर निर्भर है; किसी विशिष्ट संदर्भ को पद में जोड़ना वास्तविक अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य; मूल की समानांतर संरचना तथा स्थान-नाम सुरक्षित रखे गए हैं।
