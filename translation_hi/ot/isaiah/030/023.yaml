base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/023.yaml
  text: And he will give rain for your seed with which you sow the ground[a], and bread from the produce of the ground; and it will be rich and plentiful[b]. On that day your livestock will graze in a broad pasture.
translation:
  language: hi
  text: और वह तुम्हारे उस बीज के लिए वर्षा देगा, जिसे तुम भूमि में बोओगे, और भूमि की उपज से रोटी देगा; वह भरपूर और समृद्ध होगी।[a] उस दिन तुम्हारे पशु विशाल चरागाह में चरेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पुष्ट और समृद्ध”; यह प्रचुरता और उर्वरता का मुहावरा है। हिब्रू में ये शब्द व्याकरणतः “रोटी” से जुड़े हैं, पर भाव भूमि की उपज की भरपूरी को भी व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: और वह ... देगा
  rationale: भविष्यसूचक संदर्भ में वाव-सहित पूर्ण क्रिया को भावी परिणाम के रूप में व्यक्त किया गया है। कर्ता पिछले संदर्भ से प्रभु है, पर मूल की तरह नाम दोहराया नहीं गया।
- source_word: מְטַר זַרְעֲךָ
  choice: तुम्हारे उस बीज के लिए वर्षा
  rationale: מְטַר का सीधा अर्थ ‘वर्षा’ और זֶרַע यहाँ बोने का बीज है। ‘बीज के लिए’ स्वाभाविक हिन्दी में वर्षा के लाभकारी उद्देश्य को व्यक्त करता है।
- source_word: אֲשֶׁר תִּזְרַע אֶת־הָאֲדָמָה
  choice: जिसे तुम भूमि में बोओगे
  rationale: हिब्रू में भूमि को क्रिया के कर्म की तरह रखा गया है; हिन्दी मुहावरे में बीज को ‘भूमि में बोना’ अधिक स्वाभाविक है और अर्थ सुरक्षित रहता है।
- source_word: לֶחֶם תְּבוּאַת הָאֲדָמָה
  choice: भूमि की उपज से मिलने वाली रोटी
  rationale: לֶחֶם को ठोस कृषि-चित्र बनाए रखने के लिए ‘रोटी’ और תְּבוּאַת הָאֲדָמָה को उसके स्रोत के रूप में व्यक्त किया गया है।
- source_word: דָשֵׁן וְשָׁמֵן
  choice: भरपूर और पौष्टिक
  rationale: शाब्दिक ‘मोटा और चिकना’ उपज या रोटी के लिए आधुनिक हिन्दी में अस्वाभाविक है। यह युग्म समृद्धि, प्रचुरता और उत्तमता सूचित करता है; ‘भरपूर और पौष्टिक’ उसी कृषि-संदर्भ को पठनीय ढंग से व्यक्त करता है।
- source_word: מִקְנֶיךָ
  choice: तुम्हारे पशु
  rationale: यह सामूहिक शब्द पालतू पशुधन के लिए है। ‘पशु’ साधारण हिन्दी में व्यापक और सहज है; इसे केवल गाय-बैल तक सीमित नहीं किया गया।
- source_word: כַּר נִרְחָב
  choice: विशाल चरागाह
  rationale: כַּר चरने योग्य मैदान/चरागाह और נִרְחָב विस्तृत या खुला स्थान दर्शाता है। ‘विशाल चरागाह’ पर्याप्त चराई की छवि स्पष्ट करता है।
theological_decisions:
- issue: आरंभिक क्रिया का निहित कर्ता
  choice: ‘वह’ रखा गया है, जिसका संदर्भ निकटवर्ती प्रसंग में प्रभु से है।
  alternative: ‘प्रभु’ नाम स्पष्ट रूप से दोहराना।
  rationale: हिब्रू इस पद में कर्ता को दोबारा नहीं कहता। सर्वनाम मूल के प्रवाह को बनाए रखता है और प्रसंगगत पहचान को बिना अनावश्यक विस्तार के सुरक्षित रखता है।
- issue: समृद्धि-सूचक विशेषणों का संबंध
  choice: ‘वह’ को निकटतम ‘रोटी’ से संबंधित रखा गया है, जबकि भाव भूमि की उपज की समृद्धि को भी समेटता है।
  alternative: विशेषणों को स्पष्ट रूप से ‘भूमि की उपज’ से जोड़ना।
  rationale: हिब्रू का पुल्लिंग एकवचन रूप לֶחֶם के साथ व्याकरणतः मेल खाता है, पर पूरा वाक्य कृषि-उपज की प्रचुरता का चित्र देता है। अनुवाद व्याकरणिक संबंध रखता है और टिप्पणी व्यापक भाव बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और ग्रामीण कृषि-चित्र के अनुरूप रखी गई है। ‘वर्षा’, ‘भूमि’, ‘उपज’, ‘रोटी’ और ‘चरागाह’ सामान्य पाठक के लिए सहज हैं। मूल की संक्षिप्तता और भविष्यसूचक आश्वासन बनाए रखते हुए हिन्दी वाक्य-विन्यास स्वाभाविक किया गया है।
