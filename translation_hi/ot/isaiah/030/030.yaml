  text: וְ/הִשְׁמִ֨יעַ יְהוָ֜ה אֶת ה֣וֹד קוֹל֗/וֹ וְ/נַ֤חַת זְרוֹע/וֹ֙ יַרְאֶ֔ה בְּ/זַ֣עַף אַ֔ף וְ/לַ֖הַב אֵ֣שׁ אוֹכֵלָ֑ה נֶ֥פֶץ וָ/זֶ֖רֶם וְ/אֶ֥בֶן בָּרָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/030.yaml
  text: And Yahweh will make the majesty of his voice heard[a], and will show the descending blow of his arm, in furious anger and a flame of consuming fire[b], with cloudburst and storm and hailstones.
translation:
  language: hi
  text: याहवे अपनी वाणी की महिमा सुनाएगा और अपनी भुजा का उतरता हुआ प्रहार[a] दिखाएगा—प्रचण्ड क्रोध में, भस्म कर देने वाली आग की ज्वाला के साथ, और मूसलाधार वर्षा[b], तूफ़ान और ओलों के साथ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी भुजा का उतरना।” यहाँ प्रयुक्त इब्रानी अभिव्यक्ति कठिन है; यह प्रहार के बजाय न्याय करने के लिए याहवे की भुजा के नीचे उतरने पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “फट पड़नेवाली घनघोर वर्षा।” इब्रानी शब्द संभवतः अचानक और प्रचण्ड रूप से फूट पड़नेवाले तूफ़ान को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट इब्रानी नाम को पदवी से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: הִשְׁמִיעַ
  choice: सुनाएगा
  rationale: हिफ़ील रूप की कारक शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הוֹד קוֹלוֹ
  choice: अपनी वाणी का प्रताप
  rationale: הוֹד के वैभव और महिमा के भाव को बनाए रखते हुए हिन्दी में वाणी के साथ स्वाभाविक संयोजन देता है।
- source_word: נַחַת זְרוֹעוֹ
  choice: अपनी भुजा का उतरता हुआ प्रहार
  rationale: कठिन संज्ञा נַחַת को न्याय के प्रसंग में नीचे आती भुजा की गति और उसके प्रहार—दोनों के संकेत सहित प्रस्तुत करता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: יַרְאֶה
  choice: दिखाएगा
  rationale: ראה के हिफ़ील रूप का कारक अर्थ सरल और सीधी हिन्दी में सुरक्षित है।
- source_word: בְּזַעַף אַף
  choice: प्रचण्ड क्रोध के साथ
  rationale: दोनों क्रोध-सूचक शब्दों की तीव्रता को कृत्रिम पुनरुक्ति के बिना व्यक्त करता है।
- source_word: לַהַב אֵשׁ אֹכֵלָה
  choice: भस्म करनेवाली आग की लपट
  rationale: रूपक की सजीवता और אֹכֵלָה के सक्रिय, विनाशकारी भाव को बनाए रखता है।
- source_word: נֶפֶץ
  choice: मूसलाधार वर्षा
  rationale: तूफ़ान और ओलों की शृंखला में यह हिंसक ढंग से फूट पड़नेवाली वर्षा का स्वाभाविक हिन्दी रूप है।
- source_word: זֶרֶם
  choice: आँधी
  rationale: मौसम-संबंधी न्याय-चित्र में प्रचण्ड तूफ़ान का भाव देता है और निकटवर्ती वर्षा से अनावश्यक पुनरावृत्ति बचाता है।
- source_word: אֶבֶן בָּרָד
  choice: ओले
  rationale: शाब्दिक ‘ओले के पत्थर’ का स्वाभाविक हिन्दी समतुल्य है।
theological_decisions:
- issue: याहवे की भुजा और क्रोध का मानवरूपी न्याय-चित्रण
  choice: भुजा, प्रहार और क्रोध की मूर्त काव्यात्मक भाषा को बनाए रखा गया है।
  alternative: इसे केवल अमूर्त ‘शक्ति के प्रदर्शन’ के रूप में प्रस्तुत करना।
  rationale: इब्रानी पाठ स्वयं देहात्मक और भावात्मक न्याय-चित्रों का प्रयोग करता है; उनका निराकरण करने से भविष्यवाणी की तीव्रता घट जाएगी।
- issue: נַחַת זְרוֹעוֹ का अनिश्चित अर्थ
  choice: मुख्य पाठ में ‘भुजा का उतरता हुआ प्रहार’ और पादटिप्पणी में ‘भुजा का उतरना’ रखा गया है।
  alternative: केवल ‘भुजा का उतरना’ अथवा ‘भुजा का टिकना’।
  rationale: न्याय के प्रसंग में नीचे आने की गति और आघात दोनों संभव हैं; अनिश्चितता को पूरी तरह समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और श्रव्य हिन्दी अपनाई गई है। काव्यात्मक न्याय-चित्रण को स्पष्ट रखा गया है, जबकि कठिन इब्रानी पद के अर्थ की अनिश्चितता पादटिप्पणी में सुरक्षित है।
