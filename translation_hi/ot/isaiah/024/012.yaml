    reason: שַׁמָּה और שְׁאִיָּה के लिए ‘बरबादी/विनाश’ तथा נִשְׁאַר के लिए अधिक शाब्दिक ‘शेष रह गई है’ को सुरक्षित रखने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: נִשְׁאַר
  choice: बचा है
  rationale: निफ़अल रूप उस चीज़ को व्यक्त करता है जो विनाश के बाद शेष रह गई है; ‘बचा है’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: בָּעִיר
  choice: नगर में
  rationale: עִיר का सामान्य अर्थ ‘नगर/शहर’ है; ‘नगर’ इस भविष्यवाणी के गरिमापूर्ण काव्यात्मक स्वर के अनुकूल है।
- source_word: שַׁמָּה
  choice: उजाड़
  rationale: यह शब्द विनाश से उत्पन्न निर्जनता और बरबादी को दर्शाता है; ‘उजाड़’ हिन्दी में स्थान की उजड़ी दशा को संक्षेप और प्रभावशाली ढंग से व्यक्त करता है।
- source_word: וּשְׁאִיָּה
  choice: खंडहर
  rationale: यह निकटार्थी संज्ञा बरबादी अथवा ध्वंस की दशा बताती है। क्रिया के परिणाम के रूप में ‘खंडहर कर दिया गया’ स्वाभाविक हिन्दी है, यद्यपि ‘विनाश’ अधिक शाब्दिक विकल्प है।
- source_word: יֻכַּת
  choice: पीटकर ... कर दिया गया है
  rationale: כתת का होफ़अल रूप पीटे, कुचले या तोड़े जाने की कर्मवाच्य धारणा देता है; यह चयन फाटक पर हुए प्रबल ध्वंस और उसके परिणाम दोनों को सुरक्षित रखता है।
- source_word: שָׁעַר
  choice: फाटक
  rationale: शब्द का अर्थ ‘फाटक’ है और प्रसंग में नगर का फाटक अभिप्रेत है; पहले खंड में नगर का उल्लेख होने से उसे दोहराना आवश्यक नहीं।
