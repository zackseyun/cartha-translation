source:
  edition: WLC
  text: מִ/כְּנַ֨ף הָ/אָ֜רֶץ זְמִרֹ֤ת שָׁמַ֨עְנוּ֙ צְבִ֣י לַ/צַּדִּ֔יק וָ/אֹמַ֛ר רָזִי לִ֥/י רָֽזִי לִ֖/י א֣וֹי לִ֑/י בֹּגְדִ֣ים בָּגָ֔דוּ וּ/בֶ֥גֶד בּוֹגְדִ֖ים בָּגָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/016.yaml
  text: 'From the edge of the earth we hear songs: “Glory to the righteous one.” But I say[a], “I waste away, I waste away. Woe is me!” The treacherous deal treacherously[c][b]; with treachery the treacherous deal treacherously.'
translation:
  language: hi
  text: 'पृथ्वी के छोर[a] से हमें गीत सुनाई देते हैं:


    “धर्मी की महिमा हो!”[b]


    पर मैं कहता हूँ,


    “मैं क्षीण हो रहा हूँ, मैं क्षीण हो रहा हूँ![c]


    हाय मुझ पर!”


    विश्वासघाती विश्वासघात करते हैं;


    विश्वासघात से विश्वासघाती विश्वासघात करते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “पृथ्वी के पंख से”; इसका अर्थ “पृथ्वी के किनारे से” या “पृथ्वी के अंतिम छोर से” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “धर्मी की शोभा/प्रतिष्ठा हो!” भी किया जा सकता है। एकवचन रूप को सामूहिक मानकर “धर्मियों की महिमा हो!” भी संभव है।
    reason: alternative_reading
  - marker: c
    text: इब्रानी רָזִי לִי कठिन है। परंपरागत रूप से इसे क्षीण या कृश हो जाने का विलाप समझा गया है; वैकल्पिक रूप से इसका अनुवाद “मेरा रहस्य मेरे ही पास है” या “यह मेरे लिए रहस्य है” किया जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מִכְּנַף הָאָרֶץ
  choice: पृथ्वी के छोर से
  rationale: כָּנָף का मूल अर्थ ‘पंख’ है, पर भौगोलिक प्रयोग में यह किनारे या अंतिम छोर को दर्शाता है। एकवचन ‘छोर’ इब्रानी रूप को बनाए रखते हुए हिन्दी में स्वाभाविक है।
- source_word: זְמִרֹת
  choice: गीत
  rationale: शब्द सामान्यतः गीत या संगीत को दर्शाता है; ‘स्तुतिगीत’ कहना प्रसंगानुकूल हो सकता है, पर मूल में निहित न होने वाली विशिष्टता जोड़ देगा।
- source_word: שָׁמַעְנוּ
  choice: हमें ... सुनाई देते हैं
  rationale: इब्रानी पूर्ण क्रिया को इस सजीव भविष्यदर्शी वर्णन में वर्तमान अनुभूति के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: צְבִי לַצַּדִּיק
  choice: धर्मी जन की महिमा हो
  rationale: צְבִי के अर्थ-क्षेत्र में शोभा, वैभव, महिमा और सम्मान आते हैं। प्रशंसात्मक उद्घोष में ‘महिमा’ उपयुक्त है। לַצַּדִּיק का व्याकरणिक एकवचन ‘धर्मी जन’ से सुरक्षित रहता है, बिना उसके संदर्भ को निश्चित किए।
- source_word: וָאֹמַר
  choice: पर मैं कहता हूँ
  rationale: ‘पर’ सुने गए हर्षपूर्ण गीत और वक्ता के अचानक विलाप के बीच स्पष्ट प्रासंगिक विरोध व्यक्त करता है। वर्तमानकाल भविष्यदर्शी दृश्य की सजीवता बनाए रखता है।
- source_word: רָזִי לִי רָזִי לִי
  choice: मैं क्षीण हो रहा हूँ, मैं क्षीण हो रहा हूँ
  rationale: कठिन पद को परंपरागत रूप से कृश या क्षीण होते जाने के विलाप के रूप में समझा जाता है। हिन्दी अभिव्यक्ति शारीरिक और भावात्मक टूटन दोनों का संकेत देती है; वैकल्पिक ‘मेरा रहस्य’ वाला पाठ पादटिप्पणी में सुरक्षित है।
- source_word: אוֹי לִי
  choice: हाय मुझ पर!
  rationale: यह दुःख और विपत्ति का तीव्र उद्गार है; यह रूप आधुनिक हिन्दी में अर्थ और भाव दोनों को बनाए रखता है।
- source_word: בֹּגְדִים בָּגָדוּ ... וּבֶגֶד בּוֹגְדִים בָּגָדוּ
  choice: विश्वासघाती विश्वासघात करते हैं; विश्वासघात से विश्वासघाती विश्वासघात करते हैं
  rationale: एक ही मूल की जानबूझकर की गई पुनरावृत्ति को संज्ञा, कर्ता और क्रिया में बनाए रखा गया है। हिन्दी कुछ भारी लगती है, पर यही मूल की तीव्र, आरोपात्मक शब्दावली को प्रतिबिंबित करती है।
theological_decisions:
- issue: לַצַּדִּיק का संदर्भ
  choice: धर्मी जन
  alternative: धर्मी लोग / धर्मी को
  rationale: इब्रानी रूप निश्चित और एकवचन है, पर पद यह नहीं बताता कि यह किसी एक विशिष्ट व्यक्ति का संकेत है या धर्मियों का सामूहिक उल्लेख। मुख्य पाठ एकवचन रखता है और सामूहिक संभावना पादटिप्पणी में देता है।
- issue: רָזִי לִי का अर्थ
  choice: मैं क्षीण हो रहा हूँ
  alternative: मेरा रहस्य मेरे ही पास है / यह मेरे लिए रहस्य है
  rationale: विपत्ति और ‘हाय’ के प्रसंग में क्षीणता का पारंपरिक अर्थ अधिक संगत है, लेकिन व्यंजनात्मक पाठ से उत्पन्न वास्तविक वैकल्पिक अर्थ को दबाया नहीं गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक वाचन के अनुकूल रखी गई है। अंतिम पंक्तियों में असामान्य पुनरावृत्ति जानबूझकर सुरक्षित है, क्योंकि इब्रानी में בגד मूल की सघन पुनरावृत्ति पद की ध्वनि और आरोपात्मक बल का प्रमुख अंग है।
