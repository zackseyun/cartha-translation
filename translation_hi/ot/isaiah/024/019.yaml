base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/019.yaml
  text: The earth is utterly shattered[a]; the earth is completely broken apart; the earth is violently shaken.
translation:
  language: hi
  text: धरती पूरी तरह चकनाचूर हो गई है[a]; धरती पूरी तरह टूटकर बिखर गई है; धरती बुरी तरह डगमगा उठी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देश पूरी तरह चकनाचूर हो गया है … देश पूरी तरह टूटकर बिखर गया है … देश बुरी तरह डगमगा उठा है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעָה הִתְרֹעֲעָה
  choice: पूरी तरह चकनाचूर हो गई है
  rationale: क्रियार्थक संज्ञा के साथ उसी धातु की सीमित क्रिया इब्रानी में तीव्रता व्यक्त करती है। ‘पूरी तरह चकनाचूर’ רעע के विनाशकारी अर्थ और इस बलाघात को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָאָרֶץ / אֶרֶץ / אָרֶץ
  choice: धरती
  rationale: אֶרֶץ का अर्थ ‘धरती’ या ‘देश’ हो सकता है। यशायाह 24 के व्यापक न्याय-संदर्भ में ‘धरती’ उपयुक्त है; इब्रानी की लयात्मक पुनरावृत्ति को तीनों उपवाक्यों में बनाए रखा गया है।
- source_word: פּוֹר הִתְפּוֹרְרָה
  choice: पूरी तरह टूटकर बिखर गई है
  rationale: यहाँ भी क्रियार्थक संज्ञा और सीमित क्रिया का मेल तीव्रता दर्शाता है। यह अभिव्यक्ति פרר/פור से सूचित टूटने और विखंडित होकर बिखरने को स्पष्ट करती है तथा पहले उपवाक्य से अर्थगत भेद भी बनाए रखती है।
- source_word: מוֹט הִתְמוֹטְטָה
  choice: बुरी तरह डगमगा उठी है
  rationale: מוט हिलने, लड़खड़ाने या डगमगाने का भाव देता है। ‘बुरी तरह’ इब्रानी के तीव्रतासूचक निर्माण को और ‘डगमगा उठी’ अस्थिरता तथा प्रलयंकारी हलचल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: אֶרֶץ का भौगोलिक विस्तार
  choice: मुख्य पाठ में ‘धरती’
  alternative: ‘देश’
  rationale: अध्याय का विश्वव्यापी और ब्रह्मांडीय न्याय-संदर्भ ‘धरती’ का समर्थन करता है, पर शब्द का स्थानीय ‘देश’ अर्थ वास्तविक है और उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। तीन समानांतर उपवाक्यों तथा ‘धरती’ की पुनरावृत्ति से मूल इब्रानी की लय और बढ़ती हुई प्रलयंकारी तीव्रता सुरक्षित रखी गई है।
