base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/014.yaml
  text: They lift up their voice; they shout for joy. At the majesty of Yahweh[a], they cry aloud from the sea.
translation:
  language: hi
  text: 'वे अपनी आवाज़ उठाते हैं, आनन्द से जयजयकार करते हैं;

    याहवे के प्रताप के कारण वे समुद्र से[a] ऊँचे स्वर में पुकारते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पश्चिम से” अथवा “समुद्र-तटीय प्रदेशों से”; भविष्यद्वाणी की कविता में “समुद्र से” भौगोलिक अर्थ भी रख सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: वे
  rationale: स्वतंत्र बहुवचन सर्वनाम यहाँ कर्ता पर हल्का बल देता है; आधुनिक हिन्दी में ‘वे’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִשְׂאוּ קוֹלָם
  choice: अपनी आवाज़ उठाते हैं
  rationale: यह इब्रानी मुहावरा आवाज़ ऊँची करने को दर्शाता है; एकवचन ‘आवाज़’ मूल के सामूहिक एकवचन को बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: יָרֹנּוּ
  choice: आनन्द से जयजयकार करते हैं
  rationale: क्रिया उल्लासपूर्ण पुकार या गान का बोध देती है; यह चयन संगीत का भाव अनिवार्य किए बिना हर्षोल्लास प्रकट करता है।
- source_word: בִּגְאוֹן
  choice: प्रताप के कारण
  rationale: גָּאוֹן यहाँ ऊँचे वैभव या प्रताप को दर्शाता है। בְּ का संबंध काव्य में कई प्रकार से समझा जा सकता है; सन्दर्भ में प्रताप को उल्लास का आधार मानना स्वाभाविक हिन्दी देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम का हिन्दी लिप्यंतरण किया गया है, किसी उपाधि से उसका स्थान नहीं लिया गया।
- source_word: צָהֲלוּ
  choice: ऊँचे स्वर में पुकारते हैं
  rationale: क्रिया तेज़, गूँजती हुई उल्लासपूर्ण पुकार व्यक्त करती है; यह पहले प्रयुक्त ‘जयजयकार’ से अनावश्यक शब्दगत पुनरावृत्ति भी टालती है।
- source_word: מִיָּם
  choice: समुद्र की ओर से
  rationale: יָם का मूल अर्थ ‘समुद्र’ है और מִן स्रोत या दिशा को व्यक्त करता है। सम्भावित भौगोलिक अर्थों को मुख्य पाठ में निर्णायक बनाए बिना पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसके सम्भावित प्राचीन उच्चारण का प्रचलित हिन्दी लिप्यंतरण है और उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: בִּגְאוֹן में पूर्वसर्ग का संबंध
  choice: प्रताप के कारण
  alternative: प्रताप में / प्रताप पर
  rationale: पूर्वसर्ग कारण, अवसर या क्षेत्र का संकेत दे सकता है। यहाँ उल्लासपूर्ण पुकार के साथ कारणवाचक अर्थ स्वाभाविक है, यद्यपि मूल की काव्यात्मक संक्षिप्तता कुछ अर्थगत खुलापन रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य हिन्दी रखी गई है। समानार्थी उल्लासपूर्ण क्रियाओं के काव्यात्मक क्रम को ‘जयजयकार’ और ‘ऊँचे स्वर में पुकारते’ द्वारा बनाए रखा गया है।
