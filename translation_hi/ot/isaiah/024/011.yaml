id: ISA.24.11
reference: Isaiah 24:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: צְוָחָ֥ה עַל הַ/יַּ֖יִן בַּֽ/חוּצ֑וֹת עָֽרְבָה֙ כָּל שִׂמְחָ֔ה גָּלָ֖ה מְשׂ֥וֹשׂ הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/011.yaml
  text: There is an outcry over the wine in the streets[a]; all joy has grown dark[b]; the gladness of the earth has gone away.
translation:
  language: hi
  text: सड़कों पर दाखमधु को लेकर हाहाकार मचा है; सारे आनन्द पर अँधेरा छा गया है[a]; पृथ्वी का उल्लास चला गया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सारा आनन्द साँझ में बदल गया है,” जो आनन्द पर रात का अँधेरा छाने का इब्रानी बिंब बनाए रखता है।
    reason: lexical_alternative
  - marker: b
    text: या “देश का उल्लास चला गया है।”
    reason: alternative_reading
lexical_decisions:
- source_word: צְוָחָה
  choice: हाहाकार मचा है
  rationale: यह संज्ञा संकट और शोक की ऊँची पुकार को व्यक्त करती है; हिन्दी में यह प्रयोग स्वाभाविक रहते हुए उसकी सामूहिक तीव्रता बनाए रखता है।
- source_word: עַל הַיַּיִן
  choice: दाखमधु के लिए
  rationale: עַל यहाँ दाखमधु को पुकार या विलाप के विषय अथवा कारण के रूप में रखता है। ‘के लिए’ इस संबंध को कारण तक सीमित किए बिना खुला रखता है।
- source_word: בַּחוּצוֹת
  choice: सड़कों पर
  rationale: यह नगर के खुले सार्वजनिक स्थानों—सड़कों या चौकों—का संकेत दे सकता है; ‘सड़कों पर’ आधुनिक हिन्दी में स्वाभाविक और सार्वजनिक दृश्य के अनुकूल है।
- source_word: עָרְבָה
  choice: अँधेरा हो गया है
  rationale: क्रिया का मूल बिंब साँझ होने या अँधेरा छाने का है। आनन्द के लिए प्रयुक्त यह रूपक उसके मंद या निष्प्रभ होने को चित्रात्मक ढंग से व्यक्त करता है।
- source_word: כָּל שִׂמְחָה
  choice: सारा आनन्द
  rationale: समग्र प्रसन्नता का अर्थ संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: גָּלָה
  choice: जाता रहा है
  rationale: यहाँ उल्लास कर्ता है, इसलिए क्रिया उसके दूर हो जाने या विदा होने को बताती है; निर्वासन का शाब्दिक रूप थोपना अनावश्यक होगा।
- source_word: מְשׂוֹשׂ
  choice: उल्लास
  rationale: यह उत्सवी हर्ष या उमंग को दर्शाता है और पहले आए ‘आनन्द’ से हल्का अर्थभेद बनाए रखता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: यशायाह 24 का व्यापक, विश्वव्यापी परिप्रेक्ष्य स्थानीय ‘देश’ की अपेक्षा ‘पृथ्वी’ को अधिक उपयुक्त बनाता है।
theological_decisions:
- issue: הָאָרֶץ का भौगोलिक दायरा
  choice: पृथ्वी
  alternative: देश
  rationale: अध्याय की व्यापक न्याय-वाणी पूरी पृथ्वी की ओर संकेत करती है; फिर भी पादटिप्पणी ‘देश’ की वैध शाब्दिक सम्भावना सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दाखमधु’ बाइबलीय परिवेश में मदिरा का स्पष्ट और प्रतिष्ठित पद है; ‘हाहाकार’ सार्वजनिक संकट की पुकार को व्यक्त करता है। समानार्थी इब्रानी संज्ञाओं के लिए ‘आनन्द’ और ‘उल्लास’ रखकर काव्यात्मक समानता और सूक्ष्म भेद दोनों सुरक्षित किए गए हैं।
