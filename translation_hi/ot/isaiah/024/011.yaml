revisions:
- from: सड़कों पर दाखमधु के लिए हाहाकार मचा है; सारा आनन्द अँधेरा हो गया है[a]; पृथ्वी का उल्लास जाता रहा है[b]।
  to: सड़कों पर दाखमधु को लेकर हाहाकार मचा है; सारे आनन्द पर अँधेरा छा गया है[a]; पृथ्वी का उल्लास चला गया है[b]।
  rationale: 'The revision makes two limited idiomatic improvements: it renders the flexible relation of עַל with ‘दाखमधु को लेकर,’ and it expresses joy’s metaphorical darkening with a natural Hindi construction. The semantic content, poetic parallelism, register, and existing footnote anchors are retained.'
  reviewer_model: gpt-5.6-terra
