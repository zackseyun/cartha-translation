source:
  edition: WLC
  text: וְ/הָ/אָ֥רֶץ חָנְפָ֖ה תַּ֣חַת יֹשְׁבֶ֑י/הָ כִּֽי עָבְר֤וּ תוֹרֹת֙ חָ֣לְפוּ חֹ֔ק הֵפֵ֖רוּ בְּרִ֥ית עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/005.yaml
  text: The earth is defiled under its inhabitants[a], because they have transgressed laws, violated a statute[b], and broken the everlasting covenant.
translation:
  language: hi
  text: पृथ्वी अपने निवासियों के कारण दूषित हो गई है, क्योंकि उन्होंने नियमों का उल्लंघन किया, विधान को बदल दिया[a] और सदा की वाचा तोड़ दी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विधान का उल्लंघन किया” या “विधान की सीमा लाँघी।” हिब्रू क्रिया किसी स्थापित विधान को बदलने, उसका उल्लंघन करने, या उसकी सीमा लाँघने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “सदा की वाचा” की पहचान स्पष्ट नहीं की गई है। कुछ व्याख्याकार इसे नूह की वाचा या मानवजाति के लिए परमेश्वर की स्थायी नैतिक व्यवस्था से जोड़ते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: חָנְפָה
  choice: दूषित हो गई है
  rationale: यह क्रिया नैतिक और धार्मिक अपवित्रता या प्रदूषण का भाव व्यक्त करती है। ‘दूषित’ पृथ्वी पर मानव पाप के प्रभाव को स्पष्ट करता है, पर इसे केवल अनुष्ठानिक अशुद्धता तक सीमित नहीं करता।
- source_word: תַּחַת
  choice: के कारण
  rationale: इसका मूल अर्थ ‘नीचे’ है, पर इस वाक्य-विन्यास में निवासियों के कारण पृथ्वी के दूषित होने का संबंध भी व्यक्त होता है। आधुनिक हिन्दी में ‘के कारण’ अर्थ को स्वाभाविक और स्पष्ट रूप से पहुँचाता है।
- source_word: יֹשְׁבֶיהָ
  choice: अपने निवासियों
  rationale: यह कृदन्त-संज्ञा पृथ्वी पर रहने वाले लोगों को सामूहिक रूप से दर्शाती है; ‘निवासियों’ वर्तमान मानक हिन्दी में सहज है।
- source_word: עָבְרוּ
  choice: उल्लंघन किया
  rationale: नियमों के साथ यह क्रिया शाब्दिक रूप से पार जाने के बजाय आज्ञा या सीमा तोड़ने का कानूनी-नैतिक अर्थ रखती है।
- source_word: תוֹרֹת
  choice: नियमों
  rationale: תּוֹרָה के बहुवचन को बनाए रखते हुए ‘नियमों’ यहाँ बाध्यकारी शिक्षाओं या व्यवस्थाओं का स्पष्ट कानूनी-नैतिक भाव देता है।
- source_word: חָלְפוּ
  choice: लाँघा
  rationale: यह क्रिया पार करने, सीमा लाँघने अथवा बदल देने का अर्थ रख सकती है। ‘विधान को लाँघा’ समानांतर पंक्तियों में अपराध का भाव बनाए रखता है, जबकि ‘बदल दिया’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: חֹק
  choice: विधान
  rationale: एक स्थापित आदेश या ठहराई हुई विधि के लिए ‘विधान’ गरिमापूर्ण और बोधगम्य है तथा हिब्रू के एकवचन को बनाए रखता है।
- source_word: הֵפֵרוּ
  choice: तोड़ दी
  rationale: वाचा के संदर्भ में यह सामान्य और स्वाभाविक अभिव्यक्ति है, जो उसके उल्लंघन या निष्प्रभावी किए जाने का अर्थ देती है।
- source_word: בְּרִית עוֹלָם
  choice: सदा की वाचा
  rationale: यह पद स्थायी और निरंतर रहने वाली वाचा को दर्शाता है। ‘सदा की वाचा’ अवधि का भाव बनाए रखता है और किसी विशेष वाचा की पहचान अनावश्यक रूप से नहीं जोड़ता।
theological_decisions:
- issue: ‘सदा की वाचा’ का अभिप्रेत संदर्भ
  choice: मुख्य पाठ में इसे सामान्य रूप से ‘सदा की वाचा’ रखा गया है और किसी विशेष वाचा के रूप में इसकी पहचान नहीं की गई।
  alternative: इसे नूह की वाचा, सृष्टि में स्थापित नैतिक व्यवस्था, अथवा परमेश्वर और समस्त मानवता के बीच सामान्य स्थायी वाचा माना जा सकता है।
  rationale: हिब्रू पद धर्मवैज्ञानिक रूप से महत्त्वपूर्ण है, पर इस पद में उसका विशिष्ट संदर्भ स्पष्ट नहीं किया गया। सामान्य अनुवाद मूल पाठ की अस्पष्टता और तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। कानूनी-वाचागत समानांतरता के लिए ‘नियमों का उल्लंघन’, ‘विधान को लाँघा’ और ‘वाचा तोड़ दी’ प्रयुक्त हुए हैं। पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं।
