base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/023.yaml
  text: Then the moon will be ashamed[a], and the sun disgraced, for Yahweh of hosts reigns on Mount Zion and in Jerusalem[b], and before his elders there is glory.
translation:
  language: hi
  text: तब चाँद लज्जित होगा और सूरज शर्मसार होगा, क्योंकि सेनाओं का याहवे सिय्योन पर्वत पर और यरूशलेम में राज्य करता है; और उसके बुज़ुर्गों[a] के सामने महिमा होगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “उसके” का संकेत सिय्योन अथवा यरूशलेम की ओर समझा जा सकता है: “उसके बुज़ुर्गों के सामने।”'
    reason: alternative_reading
  - marker: b
    text: इब्रानी में अंत में केवल “महिमा” संक्षेप में आया है। इसे “उसके बुज़ुर्गों के सामने उसकी महिमा होगी” या “उसके बुज़ुर्गों के सामने—महिमा” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָפְרָה
  choice: लज्जित होगा
  rationale: यहाँ חפר का अर्थ खोदना नहीं, बल्कि लज्जित या अपमानित होना है। भविष्यकाल भविष्यद्वाणी के प्रसंग के अनुरूप है।
- source_word: הַלְּבָנָה
  choice: चाँद
  rationale: यह चाँद के लिए सामान्य संज्ञा है; आधुनिक हिन्दी में ‘चाँद’ सहज और स्पष्ट है।
- source_word: וּבוֹשָׁה
  choice: शर्मसार होगा
  rationale: בוש भी लज्जा और अपमान व्यक्त करता है। ‘शर्मसार’ समानांतरता बनाए रखते हुए पहले क्रियापद से हल्का भेद दिखाता है।
- source_word: הַחַמָּה
  choice: सूरज
  rationale: चाँद के साथ काव्यात्मक जोड़ी में यह स्पष्ट रूप से सूर्य को दर्शाता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह चाँद और सूरज के लज्जित होने का कारण बताता है।
- source_word: מָלַךְ
  choice: राज्य करता है
  rationale: पूर्ण क्रिया भविष्यद्वाणी में निश्चित या सजीव राजत्व व्यक्त कर सकती है। हिन्दी वर्तमानकाल इस घोषित और प्रभावी राजत्व को स्वाभाविक ढंग से रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: यह स्वर्गीय और सांसारिक सैन्य-दलों की व्यापक धारणा को सुरक्षित रखता है और इसे ‘सर्वशक्तिमान’ जैसी व्याख्यात्मक उपाधि में नहीं बदलता।
- source_word: בְּהַר צִיּוֹן
  choice: सिय्योन पर्वत पर
  rationale: पर्वत के साथ ב का स्वाभाविक हिन्दी रूप ‘पर’ है।
- source_word: וּבִירוּשָׁלִַם
  choice: और यरूशलेम में
  rationale: नगर के साथ ב का स्वाभाविक हिन्दी रूप ‘में’ है।
- source_word: וְנֶגֶד
  choice: के सामने
  rationale: यह किसी की उपस्थिति में या उसके सम्मुख होने का भाव व्यक्त करता है।
- source_word: זְקֵנָיו
  choice: उसके बुज़ुर्गों
  rationale: पुल्लिंग एकवचन प्रत्यय का सबसे निकट और स्वाभाविक संबंध याहवे से है। ‘बुज़ुर्ग’ आधुनिक हिन्दी में सम्मानित वरिष्ठ जनों को दर्शाता है, जबकि वैकल्पिक संबंध फुटनोट में सुरक्षित है।
- source_word: כָּבוֹד
  choice: महिमा
  rationale: यह כבוד का प्रचलित और प्रसंगानुकूल हिन्दी रूप है; मूल की संक्षिप्त, क्रियारहित समाप्ति को अनावश्यक रूप से विस्तृत नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका निकट लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: זְקֵנָיו में प्रत्यय का संदर्भ
  choice: ‘उसके बुज़ुर्गों’ में ‘उसके’ का संदर्भ याहवे से
  alternative: सिय्योन या यरूशलेम के बुज़ुर्ग
  rationale: निकटवर्ती कर्ता याहवे है, इसलिए यह संबंध अधिक स्वाभाविक है; फिर भी मूल की संक्षिप्त रचना दूसरा संबंध संभव छोड़ती है, जिसे फुटनोट में रखा गया है।
- issue: अंतिम क्रियारहित वाक्यांश וְנֶגֶד זְקֵנָיו כָּבוֹד
  choice: उसके बुज़ुर्गों के सामने महिमा होगी
  alternative: उसके बुज़ुर्गों के सामने उसकी महिमा होगी; उसके बुज़ुर्गों के सामने—महिमा
  rationale: मूल में ‘महिमा’ के साथ स्पष्ट क्रिया या स्वामित्वसूचक प्रत्यय नहीं है। मुख्य पाठ स्वाभाविक हिन्दी देता है, जबकि फुटनोट मूल की संभावित संक्षिप्त रचनाएँ बताता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘चाँद/सूरज’ सामान्य पाठक के लिए स्वाभाविक हैं, जबकि ‘महिमा’, ‘राज्य करता है’ और ‘सिय्योन पर्वत’ बाइबिलीय गरिमा बनाए रखते हैं। दोनों फुटनोट-चिह्न मुख्य पाठ में अपने संबंधित अस्पष्ट अंशों पर रखे गए हैं।
