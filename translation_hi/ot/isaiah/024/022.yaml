  yaml_path: translation/ot/isaiah/024/022.yaml
  text: And they will be gathered together like prisoners into a pit[a], and they will be shut up in a prison; and after many days they will be punished.
translation:
  language: hi
  text: वे बन्दियों की तरह गड्ढे में इकट्ठे किए जाएँगे और बन्दीगृह में बन्द कर दिए जाएँगे; बहुत दिनों के बाद उन्हें दण्ड दिया जाएगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी सुधि ली जाएगी” अथवा “उनका लेखा लिया जाएगा।” हिब्रू क्रिया का अर्थ किसी पर ध्यान देना या उससे लेखा लेना भी हो सकता है; इस न्याय के प्रसंग में दण्ड का भाव अधिक सम्भावित है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֻסְּפוּ אֲסֵפָה
  choice: इकट्ठे किए जाएँगे
  rationale: क्रिया का कर्मवाच्य बहुवचन रूप और उसी धातु से बने संज्ञात्मक बल को स्वाभाविक हिन्दी में इस प्रकार व्यक्त किया गया है।
- source_word: אַסִּיר
  choice: बन्दियों की तरह
  rationale: एकवचन रूप यहाँ सामूहिक अर्थ रखता है; ‘की तरह’ तुलना का भाव बनाए रखता है।
- source_word: עַל בּוֹר
  choice: गड्ढे में
  rationale: बन्द करने और इकट्ठा करने के प्रसंग में עַל गड्ढे के भीतर डाले जाने या रखे जाने का अर्थ देता है; हिन्दी में ‘गड्ढे में’ स्वाभाविक है।
- source_word: וְסֻגְּרוּ עַל מַסְגֵּר
  choice: बन्दीगृह में बन्द कर दिए जाएँगे
  rationale: कर्मवाच्य बन्धन और कारावास की छवि दोनों को स्पष्ट तथा गरिमापूर्ण आधुनिक हिन्दी में रखा गया है।
- source_word: וּמֵרֹב יָמִים
  choice: बहुत दिनों के बाद
  rationale: यह पद लम्बी अवधि बीतने के बाद का समय सूचित करता है।
- source_word: יִפָּקֵדוּ
  choice: उन्हें दण्ड दिया जाएगा
  rationale: פקד का निफ़अल रूप व्यापक रूप से किसी की सुधि लेने, उस पर ध्यान देने या उसका लेखा लेने को सूचित कर सकता है; यहाँ विश्वव्यापी न्याय और कारावास का प्रसंग दण्डात्मक अर्थ को प्रबल बनाता है।
theological_decisions:
- issue: न्याय के प्रसंग में יִפָּקֵדוּ का अर्थ
  choice: उन्हें दण्ड दिया जाएगा
  alternative: उनकी सुधि ली जाएगी / उनका लेखा लिया जाएगा
  rationale: आसपास का न्याय-वर्णन दण्डात्मक कार्यवाही की ओर संकेत करता है, पर हिब्रू क्रिया अपने आप में अधिक व्यापक है। इसलिए मुख्य पाठ में प्रसंगानुकूल अर्थ और पाद-टिप्पणी में वास्तविक शाब्दिक व्यापकता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और न्याय-वाणी के अनुकूल शैली रखी गई है। ‘बन्दीगृह में बन्द’ की पुनरुक्ति हिब्रू की कारावास-छवि को बनाए रखती है।
