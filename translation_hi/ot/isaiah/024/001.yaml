  text: הִנֵּ֧ה יְהוָ֛ה בּוֹקֵ֥ק הָ/אָ֖רֶץ וּ/בֽוֹלְקָ֑/הּ וְ/עִוָּ֣ה פָנֶ֔י/הָ וְ/הֵפִ֖יץ יֹשְׁבֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/001.yaml
  text: Behold[a], Yahweh is emptying the earth and laying it waste[b]; he will distort its surface and scatter its inhabitants.
translation:
  language: hi
  text: देखो, याहवे पृथ्वी[a] को खाली कर रहा है और उसे उजाड़ रहा है; वह उसकी सतह[b] को विकृत कर देगा और उसके निवासियों को तितर-बितर कर देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “देश” अथवा “भूमि”; इब्रानी אֶרֶץ के ये अर्थ भी हो सकते हैं, पर यहाँ का व्यापक संदर्भ “पृथ्वी” के अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “उसका चेहरा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह भविष्यसूचक घोषणा की ओर गंभीरता से ध्यान खींचता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह परमेश्वर के व्यक्तिगत नाम का हिन्दी लिप्यंतरण है; इसे किसी उपाधि से नहीं बदला गया है।
- source_word: בּוֹקֵק
  choice: खाली कर रहा है
  rationale: कृदन्त निकट या आरंभ हो रही क्रिया को सजीव रूप में प्रस्तुत करता है और मूल धातु के ‘खाली करने’ के बिंब को बनाए रखता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: אֶרֶץ का अर्थ ‘देश/भूमि’ भी हो सकता है, पर यशायाह 24 का व्यापक संदर्भ यहाँ सार्वभौमिक अर्थ का समर्थन करता है।
- source_word: וּבֹלְקָהּ
  choice: और उजाड़ कर रहा है
  rationale: दुर्लभ क्रिया पहली क्रिया के साथ ध्वन्यात्मक और अर्थगत बल उत्पन्न करती है; ‘उजाड़’ विनाशकारी परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְעִוָּה
  choice: विकृत कर देगा
  rationale: क्रिया के मोड़ने या बिगाड़ने के अर्थ को बिना उसे पूर्ण विनाश मान लिए व्यक्त करता है।
- source_word: פָנֶיהָ
  choice: उसकी सतह
  rationale: शाब्दिक अर्थ ‘उसका चेहरा’ है, पर पृथ्वी के संबंध में यह उसकी सतह को दर्शाता है।
- source_word: וְהֵפִיץ
  choice: तितर-बितर कर देगा
  rationale: लोगों को अलग-अलग दिशाओं में बिखेर देने की न्याय-संबंधी छवि को स्पष्ट और मुहावरेदार हिन्दी में व्यक्त करता है।
- source_word: יֹשְׁבֶיהָ
  choice: उसके निवासियों
  rationale: पृथ्वी पर रहने वालों के सामूहिक अर्थ को संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण हिन्दी लिप्यंतरण है और नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: הָאָרֶץ का भौगोलिक विस्तार
  choice: पृथ्वी
  alternative: देश; भूमि
  rationale: शब्द दोनों अर्थ दे सकता है। व्यापक अध्याय-संदर्भ सार्वभौमिक न्याय की ओर संकेत करता है, फिर भी पादटिप्पणी में वास्तविक lexical ambiguity सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। आरंभिक ‘देखो’ भविष्यसूचक गंभीरता बनाए रखता है। इब्रानी की निकटवर्ती/सजीव क्रिया को ‘कर रहा है’ और उसके परिणामस्वरूप आने वाली क्रियाओं को ‘कर देगा’ से व्यक्त किया गया है।
