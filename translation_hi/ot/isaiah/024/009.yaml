base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/009.yaml
  text: They do not drink wine with a song[a]; strong drink is bitter to those who drink it.
translation:
  language: hi
  text: वे गीत गाते हुए दाखमधु नहीं पीते[a]; मदिरा उसे पीनेवालों को कड़वी लगती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे गीत गाते हुए दाखमधु नहीं पिएँगे।” हिब्रू अपूर्ण क्रिया का अर्थ भविष्यकाल भी हो सकता है; בַּשִּׁיר का अनुवाद “गीत के साथ” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשִּׁיר
  choice: गीत गाते हुए
  rationale: בְּ के साथ שִׁיר यहाँ पीने के साथ होनेवाले गायन या उत्सवी ढंग को व्यक्त करता है। यह सहज हिन्दी है और उजड़े हुए उत्सव का भाव बनाए रखता है।
- source_word: לֹא יִשְׁתּוּ
  choice: नहीं पीते
  rationale: हिब्रू अपूर्ण क्रिया वर्तमान या भविष्य दोनों अर्थ दे सकती है। वर्तमान काल विनाश की दशा का सजीव वर्णन करता है; भविष्य की संभावना पादटिप्पणी में रखी गई है।
- source_word: יַיִן
  choice: दाखमधु
  rationale: יַיִן के लिए यह प्रतिष्ठित और स्पष्ट हिन्दी शब्द है तथा अगली पंक्ति के שֵׁכָר से भेद बनाए रखता है।
- source_word: יֵמַר
  choice: कड़वी लगती है
  rationale: מרר का अर्थ कड़वा होना है। हिन्दी में पेय के अनुभव को व्यक्त करने के लिए ‘कड़वी लगती है’ स्वाभाविक है और मूल के विधेयात्मक भाव को सुरक्षित रखता है।
- source_word: שֵׁכָר
  choice: मदिरा
  rationale: यह दाखमधु से अलग नशीले पेय को सूचित करता है। ‘मदिरा’ आधुनिक पाठक के लिए सुबोध है और दोनों समानांतर पेयों में पर्याप्त भेद रखता है।
- source_word: לְשֹׁתָיו
  choice: उसे पीनेवालों को
  rationale: यह रूप उस पेय को पीनेवालों का संकेत करता है। ‘उसे’ जोड़ने से हिन्दी में संबंध स्पष्ट और सहज हो जाता है।
