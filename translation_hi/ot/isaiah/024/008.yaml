source:
  edition: WLC
  text: שָׁבַת֙ מְשׂ֣וֹשׂ תֻּפִּ֔ים חָדַ֖ל שְׁא֣וֹן עַלִּיזִ֑ים שָׁבַ֖ת מְשׂ֥וֹשׂ כִּנּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/008.yaml
  text: The mirth of tambourines has ceased[a]; the noise of the jubilant has stopped[b]; the mirth of the lyre has ceased.
translation:
  language: hi
  text: डफों का उल्लास थम गया है; आनन्द मनाने वालों का कोलाहल रुक गया है; वीणा का उल्लास थम गया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁבַת
  choice: थम गया है
  rationale: काल रूप बीत चुकी क्रिया के वर्तमान परिणाम को व्यक्त करता है। ‘थम गया है’ दोनों आवृत्तियों में सहज है और समाप्त हो चुके उत्सवी संगीत का भाव बनाए रखता है।
- source_word: מְשׂוֹשׂ
  choice: उत्सव-आनन्द
  rationale: यहाँ सामान्य प्रसन्नता नहीं, वाद्यों से जुड़ा उत्सवी हर्ष अभिप्रेत है। ‘उत्सव-आनन्द’ उस विशिष्ट भाव को स्पष्ट करता है।
- source_word: תֻּפִּים
  choice: डफों
  rationale: תֹּף हाथ से बजाया जानेवाला चौखटे वाला तालवाद्य था। आधुनिक हिन्दी में ‘डफ’ संक्षिप्त, परिचित और ‘ढोल’ से अधिक विशिष्ट है।
- source_word: חָדַל
  choice: रुक गया है
  rationale: क्रिया का अर्थ रुकना या समाप्त होना है। कोलाहल के साथ ‘रुक गया है’ स्वाभाविक हिन्दी प्रयोग है और समानांतर पंक्तियों में हल्की शब्दगत विविधता भी बचाता है।
- source_word: שְׁאוֹן
  choice: कोलाहल
  rationale: शब्द तेज सामूहिक ध्वनि, गूँज या हलचल को दर्शाता है। ‘कोलाहल’ उत्सव की ऊँची सामूहिक आवाज़ को व्यक्त करता है, बिना उसे अनिवार्यतः अव्यवस्थित ठहराए।
- source_word: עַלִּיזִים
  choice: आनन्द मनानेवाले
  rationale: यह रूप उन लोगों को दर्शाता है जो उल्लसित या मग्न हैं। ‘आनन्द मनानेवाले’ आधुनिक हिन्दी में स्वाभाविक है और ‘मौज-मस्ती करनेवाले’ जैसे संभावित नकारात्मक संकेत से बचता है।
- source_word: כִּנּוֹר
  choice: वीणा
  rationale: כִּנּוֹר प्राचीन तारवाद्य, सम्भवतः लायर, को सूचित करता है। ‘वीणा’ हिन्दी बाइबलीय और साहित्यिक प्रयोग में परिचित व्यापक समतुल्य है; इससे आधुनिक पश्चिमी हार्प का भ्रामक चित्र नहीं उभरता।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। मूल की तीन समानांतर धाराएँ और שָׁבַת की पुनरावृत्ति हिन्दी में भी बनाए रखी गई हैं। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
