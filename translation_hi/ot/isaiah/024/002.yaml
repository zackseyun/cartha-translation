reference: Isaiah 24:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֤ה כָ/עָם֙ כַּ/כֹּהֵ֔ן כַּ/עֶ֨בֶד֙ כַּֽ/אדֹנָ֔י/ו כַּ/שִּׁפְחָ֖ה כַּ/גְּבִרְתָּ֑/הּ כַּ/קּוֹנֶה֙ כַּ/מּוֹכֵ֔ר כַּ/מַּלְוֶה֙ כַּ/לֹּוֶ֔ה כַּ/נֹּשֶׁ֕ה כַּ/אֲשֶׁ֖ר נֹשֶׁ֥א בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/002.yaml
  text: 'And it shall be: as with the people[a], so with the priest; as with the servant, so with his master; as with the female servant, so with her mistress; as with the buyer, so with the seller; as with the lender, so with the borrower; as with the creditor, so with the one indebted to him.'
translation:
  language: hi
  text: और ऐसा होगा—लोगों का जैसा हाल होगा, याजक का भी वैसा ही; दास का जैसा, उसके मालिक का भी वैसा ही; दासी का जैसा, उसकी मालकिन का भी वैसा ही; खरीदार का जैसा, बेचनेवाले का भी वैसा ही; उधार देनेवाले का जैसा, उधार लेनेवाले का भी वैसा ही; और लेनदार का जैसा, उसके कर्ज़दार[a] का भी वैसा ही।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में अधिक शाब्दिक रूप से: “उसका, जिससे वह वसूली करता है।”'
    reason: अंतिम इब्रानी पदबंध की संरचना को दिखाता है; मुख्य पाठ में उसका प्रसंगानुकूल अर्थ 'कर्ज़दार' दिया गया है।
lexical_decisions:
- source_word: וְהָיָה
  choice: और ऐसा होगा
  rationale: यह भविष्य में होने वाली समान दशा का परिचय देता है और भविष्यसूचक लहजे को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: כָעָם כַּכֹּהֵן
  choice: लोगों का जैसा हाल होगा, याजक का भी वैसा ही
  rationale: כ की तुलनात्मक समांतरता को स्पष्ट करता है; 'हाल' प्रसंगानुसार निहित साझा दशा को हिन्दी में सहज बनाता है।
- source_word: כַּעֶבֶד כַּאדֹנָיו
  choice: दास का जैसा, उसके मालिक का भी वैसा ही
  rationale: עֶבֶד की बंधुआ सामाजिक स्थिति को 'दास' व्यक्त करता है, जबकि אֲדֹנָיו यहाँ मानवीय स्वामी है।
- source_word: כַּשִּׁפְחָה כַּגְּבִרְתָּהּ
  choice: दासी का जैसा, उसकी मालकिन का भी वैसा ही
  rationale: स्त्री दास और उसकी गृहस्थ स्वामिनी के सामाजिक विरोध को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: כַּקּוֹנֶה כַּמּוֹכֵר
  choice: खरीदार का जैसा, बेचनेवाले का भी वैसा ही
  rationale: दोनों कृदन्तों को आर्थिक भूमिकाओं के रूप में सरल आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: כַּמַּלְוֶה כַּלֹּוֶה
  choice: उधार देनेवाले का जैसा, उधार लेनेवाले का भी वैसा ही
  rationale: लोगों के लिए पारदर्शी शब्दावली रखते हुए देनेवाले और लेनेवाले का स्पष्ट विरोध सुरक्षित रहता है।
- source_word: כַּנֹּשֶׁה כַּאֲשֶׁר נֹשֶׁא בוֹ
  choice: लेनदार का जैसा, उसके कर्ज़दार का भी वैसा ही
  rationale: पहला पद ऋण की वसूली का अधिकार रखनेवाले को और दूसरा उस व्यक्ति को सूचित करता है जिसके विरुद्ध उसका दावा है; 'कर्ज़दार' स्वाभाविक अर्थ देता है, जबकि अधिक शाब्दिक संरचना पादटिप्पणी में रखी गई है।
