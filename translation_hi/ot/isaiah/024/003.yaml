  text: הִבּ֧וֹק תִּבּ֛וֹק הָ/אָ֖רֶץ וְ/הִבּ֣וֹז תִּבּ֑וֹז כִּ֣י יְהוָ֔ה דִּבֶּ֖ר אֶת הַ/דָּבָ֥ר הַ/זֶּֽה׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/003.yaml
  text: The earth will be utterly emptied and utterly plundered[a], for Yahweh has spoken this word.
translation:
  language: hi
  text: पृथ्वी पूरी तरह खाली कर दी जाएगी और पूरी तरह लूट ली जाएगी[a], क्योंकि याहवे ने यह वचन कहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देश पूरी तरह खाली कर दिया जाएगा और पूरी तरह लूट लिया जाएगा।” हिब्रू אֶרֶץ का अर्थ “देश/भूमि” या “पृथ्वी” हो सकता है; यहाँ का व्यापक संदर्भ “पृथ्वी” के विश्वव्यापी अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבּוֹק תִּבּוֹק
  choice: पूरी तरह उजाड़ दी जाएगी
  rationale: क्रिया के साथ उसी धातु का infinitive absolute तीव्र बल देता है। בקק का निफ़ाल रूप खाली कर दिए जाने या उजाड़ दिए जाने का भाव रखता है; संदर्भ में ‘उजाड़ दी जाएगी’ स्वाभाविक हिन्दी में निष्क्रिय अर्थ और पूर्ण विनाश दोनों व्यक्त करता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: אֶרֶץ का अर्थ ‘देश/भूमि’ या ‘पृथ्वी’ हो सकता है। यशायाह 24 के व्यापक, विश्वव्यापी संदर्भ में ‘पृथ्वी’ उपयुक्त है, जबकि विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְהִבּוֹז תִּבּוֹז
  choice: और पूरी तरह लूट ली जाएगी
  rationale: यहाँ भी infinitive absolute और finite verb का मेल कथन को तीव्र बनाता है। בזז लूटने का अर्थ देता है; हिन्दी का निष्क्रिय प्रयोग मूल रूप और उसके emphatic बल को बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह न्याय-घोषणा का आधार बताता है; आधुनिक हिन्दी में ‘क्योंकि’ कारण-संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित यह रूप चतुरक्षरीय व्यक्तिगत नाम को उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- source_word: דִּבֶּר
  choice: कहा है
  rationale: हिब्रू perfect घोषणा को संपन्न और निश्चित रूप में रखता है। ‘कहा है’ आधुनिक, स्वाभाविक हिन्दी में उस निश्चितता को व्यक्त करता है।
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: यह वचन
  rationale: דָּבָר का अर्थ ‘वचन’, ‘बात’ या ‘विषय’ हो सकता है। भविष्यद्वाणी की औपचारिक घोषणा में ‘यह वचन’ उपयुक्त और गरिमापूर्ण है।
theological_decisions:
- issue: יְהוָה के दिव्य नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। हिन्दी में ‘यहोवा’ व्यापक रूप से पहचाना जाने वाला रूप है और नाम को ‘प्रभु’ जैसी उपाधि से नहीं बदलता; ‘याहवे’ अधिक प्रत्यक्ष शैक्षिक लिप्यंतरण का विकल्प है।
- issue: הָאָרֶץ का भौगोलिक विस्तार
  choice: पृथ्वी
  alternative: देश/भूमि
  rationale: शब्द स्वयं दोनों अर्थों की अनुमति देता है। अध्याय का व्यापक संदर्भ विश्वव्यापी अर्थ का समर्थन करता है, पर वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में बनाए रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। समानांतर हिब्रू बलाघात को दोनों खंडों में ‘पूरी तरह’ दोहराकर सुरक्षित रखा गया है।
