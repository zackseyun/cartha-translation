  - severity: medium
    issue: The draft renders יְהוָה as ‘यहोवा.’
    rationale: The supplied English POB audit trail explicitly adopts ‘Yahweh.’ In Hindi Devanagari, ‘याहवे’ is the corresponding transliteration and preserves the project’s specified divine-name policy.
