  terminology: ‘पृथ्वी,’ ‘लूट ली जाएगी,’ and ‘वचन’ are appropriate. The divine name should be rendered ‘याहवे’ to correspond to the project’s stated Yahweh policy, rather than the traditional Hindi form ‘यहोवा.’
