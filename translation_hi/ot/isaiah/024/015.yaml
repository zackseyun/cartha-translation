source:
  edition: WLC
  text: עַל כֵּ֥ן בָּ/אֻרִ֖ים כַּבְּד֣וּ יְהוָ֑ה בְּ/אִיֵּ֣י הַ/יָּ֔ם שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/015.yaml
  text: Therefore in the east give glory to Yahweh; in the coastlands of the sea[a], to the name of Yahweh, the God of Israel.
translation:
  language: hi
  text: इसलिए पूर्व में[a] याहवे की महिमा करो; समुद्र के तटवर्ती प्रदेशों में इस्राएल के परमेश्वर याहवे के नाम की महिमा करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ज्योति के प्रदेशों में”; इब्रानी शब्द कठिन है और इसका अर्थ “अग्नियों में” भी समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पद पिछले संदर्भ से निकलने वाला परिणाम बताता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट निष्कर्षसूचक पद है।
- source_word: בָּאֻרִים
  choice: पूर्व में
  rationale: शब्द का अर्थ विवादित है, पर समुद्र के तटवर्ती प्रदेशों के साथ समानांतरता भौगोलिक अर्थ की ओर संकेत करती है। अन्य सम्भव अर्थ पादटिप्पणी में सुरक्षित रखे गए हैं।
- source_word: כַּבְּדוּ
  choice: महिमा करो
  rationale: बहुवचन आज्ञार्थक क्रिया परमेश्वर को आदर और महिमा देने का भाव व्यक्त करती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: בְּאִיֵּי הַיָּם
  choice: समुद्र के तटवर्ती प्रदेशों में
  rationale: אִיִּים द्वीपों के साथ-साथ दूरस्थ समुद्री तटवर्ती भूभागों को भी सूचित कर सकता है; यह चयन व्यापक भौगोलिक अर्थ और समुद्री बिंब दोनों बनाए रखता है।
- source_word: שֵׁם יְהוָה
  choice: याहवे के नाम की महिमा करो
  rationale: इब्रानी में दूसरी पंक्ति की क्रिया पहली पंक्ति से समझी जाती है; स्पष्ट और स्वाभाविक हिन्दी के लिए उसे दोहराया गया है, जबकि परमेश्वर के प्रकट नाम पर दिया गया बल सुरक्षित है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: यह मानक संबंधवाचक पद याहवे की पहचान इस्राएल के परमेश्वर के रूप में करता है।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम सीधे आया है। उसका लिप्यंतरण नाम और उपाधि के बीच का भेद बनाए रखता है।
- issue: בָּאֻרִים का अर्थ
  choice: 'भौगोलिक अर्थ: ‘पूर्व में’'
  alternative: ‘ज्योति के प्रदेशों में’; ‘अग्नियों में’
  rationale: समुद्री तटवर्ती प्रदेशों के साथ काव्यात्मक समानांतरता भौगोलिक अर्थ का समर्थन करती है, पर इब्रानी रूप कठिन और बहुअर्थी है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। काव्यात्मक समानांतरता को अर्धविराम से दिखाया गया है और दूसरी पंक्ति में निहित क्रिया को स्वाभाविक हिन्दी के लिए दोहराया गया है।
