reference: Isaiah 24:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְֽ֠/הָיָה הַ/נָּ֞ס מִ/קּ֤וֹל הַ/פַּ֨חַד֙ יִפֹּ֣ל אֶל הַ/פַּ֔חַת וְ/הָֽ/עוֹלֶה֙ מִ/תּ֣וֹךְ הַ/פַּ֔חַת יִלָּכֵ֖ד בַּ/פָּ֑ח כִּֽי אֲרֻבּ֤וֹת מִ/מָּרוֹם֙ נִפְתָּ֔חוּ וַֽ/יִּרְעֲשׁ֖וּ מ֥וֹסְדֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/018.yaml
  text: 'And it will happen: the one who flees from the sound of terror will fall into the pit[a], and the one who comes up from the midst of the pit will be caught in the trap; for the windows from on high are opened, and the foundations of the earth shake.'
translation:
  language: hi
  text: और ऐसा होगा कि आतंक की आवाज़ से भागनेवाला गड्ढे में गिरेगा, और जो गड्ढे के भीतर से ऊपर निकलेगा, वह फंदे में फँस जाएगा; क्योंकि ऊपर के झरोखे[a] खुल गए हैं, और पृथ्वी की नींवें हिल उठी हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वर्ग के जल-द्वार।” इब्रानी में अधिक शाब्दिक रूप से “ऊपर के झरोखे” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: और ऐसा होगा कि
  rationale: यह आगामी परिणाम या परिस्थिति का परिचय देनेवाली इब्रानी अभिव्यक्ति का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: הַנָּס
  choice: भागनेवाला
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत के सामान्य एकवचन और उसकी क्रियात्मकता, दोनों को बनाए रखता है।
- source_word: מִקּוֹל הַפַּחַד
  choice: आतंक की आवाज़ से
  rationale: קוֹל का अर्थ यहाँ सुनाई देनेवाली आवाज़ या ध्वनि है और פַּחַד तीव्र भय या आतंक को व्यक्त करता है।
- source_word: יִפֹּל אֶל הַפַּחַת
  choice: गड्ढे में गिरेगा
  rationale: פַּחַת संकट के लिए खोदे गए गड्ढे या गर्त का ठोस बिंब देता है; सरल हिन्दी में ‘गड्ढा’ इसे स्पष्ट रखता है।
- source_word: וְהָעוֹלֶה מִתּוֹךְ הַפַּחַת
  choice: और जो गड्ढे के भीतर से ऊपर निकलेगा
  rationale: עלה की ऊपर आने की गति और מִתּוֹךְ का ‘भीतर से’ वाला स्थानिक अर्थ दोनों सुरक्षित हैं।
- source_word: יִלָּכֵד בַּפָּח
  choice: वह फंदे में फँस जाएगा
  rationale: פַּח एक फंदा या जाल है। ‘फंदा’ इसे पिछले ‘गड्ढे’ से अलग रखकर लगातार बच निकलने में असमर्थता का चित्र बनाए रखता है।
- source_word: אֲרֻבּוֹת מִמָּרוֹם
  choice: ऊपर के झरोखे
  rationale: यह ‘ऊँचाई से/ऊपर के खुले स्थानों’ के निकट है। ‘झरोखे’ आकाशीय खुलने का बिंब रखता है, जबकि मुख्य पाठ में सीधे ‘स्वर्ग’ या ‘जल-द्वार’ नहीं जोड़ता।
- source_word: נִפְתָּחוּ
  choice: खुल गए हैं
  rationale: इब्रानी पूर्ण क्रिया के परिणामी वर्तमान भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּרְעֲשׁוּ
  choice: हिल उठी हैं
  rationale: क्रिया के तीव्र कंपन और भविष्यदर्शी चित्र की सजीवता को व्यक्त करता है।
- source_word: מוֹסְדֵי אָרֶץ
  choice: पृथ्वी की नींवें
  rationale: संदर्भ के व्यापक, विश्वव्यापी न्याय को देखते हुए אָרֶץ को ‘देश’ के बजाय ‘पृथ्वी’ और מוֹסְדֵי को आधारभूत ‘नींवें’ कहा गया है।
theological_decisions:
- issue: אָרֶץ का क्षेत्र
  choice: पृथ्वी
  alternative: देश/भूमि
  rationale: यशायाह 24 का संदर्भ व्यापक और ब्रह्मांडीय न्याय का चित्र प्रस्तुत करता है; इसलिए ‘पृथ्वी’ संदर्भ के अधिक अनुरूप है, यद्यपि शब्द अन्य संदर्भों में ‘देश’ या ‘भूमि’ भी हो सकता है।
- issue: אֲרֻבּוֹת מִמָּרוֹם का चित्र
  choice: ऊपर के झरोखे
  alternative: स्वर्ग के जल-द्वार
  rationale: मुख्य पाठ स्रोत के ‘ऊपर/ऊँचाई’ और ‘खुले स्थानों’ वाले बिंब के निकट रहता है और न्याय के साधन को अनावश्यक रूप से निश्चित नहीं करता; प्रचलित व्याख्यात्मक रूप पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सजीव, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘आतंक—गड्ढा—फंदा’ की क्रमिक आपदा को स्पष्ट रखा गया है। इब्रानी פַּחַד/פַּחַת/פַּח की ध्वन्यात्मक शब्द-क्रीड़ा हिन्दी में स्वाभाविक रूप से पुनरुत्पादित नहीं हो सकती, इसलिए उसके अर्थगत क्रम को प्राथमिकता दी गई है।
