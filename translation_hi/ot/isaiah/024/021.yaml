base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/021.yaml
  text: And on that day the LORD will punish the host of the height in the height, and the kings of the earth on the earth.
translation:
  language: hi
  text: उस दिन ऐसा होगा कि यहोवा ऊँचाई की सेना को ऊँचाई में, और पृथ्वी के राजाओं को पृथ्वी पर दण्ड देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִפְקֹד
  choice: दण्ड देगा
  rationale: इस न्याय-संदर्भ में פקד का अर्थ दण्ड देने के लिए लेखा लेना या कार्रवाई करना है; सरल हिन्दी में ‘दण्ड देगा’ इसे स्पष्ट रूप से व्यक्त करता है।
- source_word: צְבָא הַמָּרוֹם
  choice: ऊँचाई की सेना
  rationale: शाब्दिक संरचना और मूल की सम्भावित व्यापकता बनाए रखी गई है; इसे निश्चित रूप से ‘स्वर्गदूतों की सेना’ या ‘आकाशीय शक्तियाँ’ कहकर व्याख्या सीमित नहीं की गई।
- source_word: בַּמָּרוֹם
  choice: ऊँचाई में
  rationale: मूल में הַמָּרוֹם की पुनरावृत्ति सुरक्षित रखी गई है और ‘स्वर्ग में’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचा गया है।
- source_word: מַלְכֵי הָאֲדָמָה
  choice: पृथ्वी के राजाओं
  rationale: स्रोत के सामान्य और समानांतर अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘ऊँचाई की सेना’ की पहचान
  choice: पहचान को अनिर्धारित रखते हुए ‘ऊँचाई की सेना’
  alternative: ‘स्वर्ग की सेना’ या ‘आकाशीय शक्तियाँ’
  rationale: पद स्वयं इस समूह की सटीक पहचान स्पष्ट नहीं करता; इसलिए अनुवाद किसी एक दूतशास्त्रीय या ब्रह्माण्डीय व्याख्या को अनिवार्य नहीं बनाता।
- issue: ईश्वरीय नाम יהוה
  choice: यहोवा
  alternative: प्रभु
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम-रूप मूल के विशिष्ट ईश्वरीय नाम को ‘प्रभु’ उपाधि से अलग बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘ऊँचाई’ की दोहरी पुनरावृत्ति जानबूझकर रखी गई है ताकि मूल की समानांतरता और अर्थगत अस्पष्टता सुरक्षित रहे।
