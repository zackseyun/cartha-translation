id: ISA.24.6
reference: Isaiah 24:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַל כֵּ֗ן אָלָה֙ אָ֣כְלָה אֶ֔רֶץ וַֽ/יֶּאְשְׁמ֖וּ יֹ֣שְׁבֵי בָ֑/הּ עַל כֵּ֗ן חָרוּ֙ יֹ֣שְׁבֵי אֶ֔רֶץ וְ/נִשְׁאַ֥ר אֱנ֖וֹשׁ מִזְעָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/006.yaml
  text: Therefore a curse has devoured the earth[a], and those who dwell in it bear their guilt; therefore the inhabitants of the earth are scorched[c][b], and few men are left.
translation:
  language: hi
  text: इसलिए शाप[a] ने पृथ्वी[b] को निगल लिया है, और उसमें रहनेवाले दोषी ठहरे हैं; इसलिए पृथ्वी के निवासी झुलस गए हैं, और बहुत थोड़े मनुष्य[c] बचे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शपथ”; इब्रानी शब्द का अर्थ “शपथ” या “शाप” हो सकता है, पर टूटी हुई वाचा और उसके न्याय के इस संदर्भ में “शाप” अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या, “देश” अथवा “भूमि”; यदि कथन को स्थानीय अर्थ में लिया जाए तो यह अनुवाद संभव है, पर अध्याय का परिप्रेक्ष्य व्यापक प्रतीत होता है।
    reason: alternative_reading
  - marker: c
    text: इब्रानी में एक सामूहिक एकवचन संज्ञा है, जो मनुष्यों—विशेषकर नश्वर मानवता—को सूचित करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पिछले पद में बताए गए अपराधों और वाचा-भंग से निकलने वाले परिणाम को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: אָלָה
  choice: शाप
  rationale: इस न्याय-संदर्भ में यह शब्द केवल शपथ नहीं, बल्कि वाचा तोड़ने के फलस्वरूप आने वाले शाप को सूचित करता है।
- source_word: אָכְלָה
  choice: निगल लिया है
  rationale: मूल क्रिया का शाब्दिक अर्थ खाना है; यह चयन विनाशकारी न्याय के सजीव रूपक को बनाए रखता है।
- source_word: אֶרֶץ
  choice: पृथ्वी
  rationale: यशायाह 24 का व्यापक, सार्वभौमिक परिप्रेक्ष्य स्थानीय ‘देश’ की अपेक्षा ‘पृथ्वी’ का समर्थन करता है।
- source_word: וַיֶּאְשְׁמוּ
  choice: दोषी ठहरे हैं
  rationale: यह मूल क्रिया में निहित अपराधी होने या दोषी पाए जाने के भाव को रखता है, बिना दण्ड के किसी विशेष रूप को जोड़ने के।
- source_word: יֹשְׁבֵי בָהּ
  choice: उसमें रहनेवाले
  rationale: यह कृदन्तीय अभिव्यक्ति का स्पष्ट और सहज हिन्दी रूप है।
- source_word: חָרוּ
  choice: झुलस गए हैं
  rationale: यह जलने या तपकर नष्ट होने के न्यायात्मक चित्र को स्वाभाविक हिन्दी में व्यक्त करता है, पर पूर्ण विनाश को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: יֹשְׁבֵי אֶרֶץ
  choice: पृथ्वी के निवासी
  rationale: यह संक्षिप्त, dignified और पहले आए निवास-संबंधी पदबंध के अनुरूप है।
- source_word: וְנִשְׁאַר
  choice: बचे हैं
  rationale: निफ़अल रूप किसी अवशेष के शेष रह जाने को व्यक्त करता है; हिन्दी में बहुवचन अर्थ के अनुसार ‘बचे हैं’ स्वाभाविक है।
- source_word: אֱנוֹשׁ
  choice: मनुष्य
  rationale: यह सामूहिक रूप से नश्वर मानवजाति को दर्शाता है; ‘मनुष्य’ हिन्दी में प्रतिनिधिक और लिंग-समावेशी सामूहिक अर्थ रख सकता है।
- source_word: מִזְעָר
  choice: बहुत थोड़े
  rationale: यह शेष बचे मनुष्यों की अत्यल्प संख्या पर मूल के जोर को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: न्याय के संदर्भ में אָלָה का अर्थ
  choice: वाचागत/न्यायिक ‘शाप’
  alternative: शपथ
  rationale: पद 5 में नियमों के उल्लंघन और वाचा तोड़ने की चर्चा के कारण यहाँ न्याय के परिणामस्वरूप आने वाला ‘शाप’ अधिक उपयुक्त है।
- issue: אֶרֶץ का भौगोलिक विस्तार
  choice: पृथ्वी
  alternative: देश/भूमि
  rationale: अध्याय की भाषा व्यापक और सार्वभौमिक है; फिर भी मूल शब्द स्थानीय भूमि या देश के लिए भी प्रयुक्त हो सकता है, इसलिए विकल्प को पाद-टिप्पणी में रखा गया है।
- issue: אֱנוֹשׁ का सामूहिक अर्थ
  choice: मनुष्य
  alternative: मानवजाति/लोग
  rationale: मूल में व्याकरणिक रूप से एकवचन शब्द सामूहिक रूप में मनुष्यों के लिए आया है और उनकी नश्वरता का भाव भी रख सकता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। ‘निगल लिया’ मूल के तीखे काव्यात्मक रूपक को बचाता है; ‘झुलस गए’ न्याय के चित्र को स्पष्ट रखता है। अर्धविराम पद के दो समानांतर परिणाम-वाक्यों को जोड़ता है।
