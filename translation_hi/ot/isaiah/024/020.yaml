base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/020.yaml
  text: The earth will stagger like a drunkard[a], and sway back and forth like a hut; its transgression lies heavy upon it, and it will fall and not rise again.
translation:
  language: hi
  text: पृथ्वी मतवाले की तरह बुरी तरह लड़खड़ाएगी और अस्थायी झोंपड़ी[a] की तरह डगमगाएगी। उसका विद्रोह उस पर भारी पड़ेगा; वह गिर जाएगी और फिर न उठेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पहरेदार की झोंपड़ी”; इब्रानी शब्द किसी कमजोर, अस्थायी आश्रय या रहने की जगह को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נ֣וֹעַ תָּנ֤וּעַ
  choice: बुरी तरह लड़खड़ाएगी
  rationale: क्रियामूल के साथ infinitive absolute क्रिया को बल देता है। स्वाभाविक हिन्दी में ‘बुरी तरह’ उस तीव्रता को व्यक्त करता है, जबकि मतवाले का उपमान लड़खड़ाने की गति को स्पष्ट करता है।
- source_word: אֶ֨רֶץ֙
  choice: पृथ्वी
  rationale: यशायाह 24 के व्यापक न्याय-संदर्भ में אֶרֶץ का वैश्विक अर्थ अधिक उपयुक्त है; फिर भी मूल शब्द अपने आप में ‘देश/भूमि’ भी हो सकता है।
- source_word: כַּשִּׁכּוֹר
  choice: मतवाले की तरह
  rationale: शब्द का अर्थ नशे में धुत व्यक्ति है। ‘मतवाला’ वर्तमान हिन्दी में संक्षिप्त, गरिमापूर्ण और उपमान के अनुकूल है।
- source_word: וְהִתְנוֹדְדָה
  choice: डगमगाएगी
  rationale: हित्पोलेल रूप अस्थिर, बार-बार होने वाली हिलती गति व्यक्त करता है। ‘डगमगाएगी’ इसे सहज हिन्दी में संप्रेषित करता है।
- source_word: כַּמְּלוּנָה
  choice: अस्थायी झोंपड़ी
  rationale: מְלוּנָה खेत या बाग में बनी कमजोर, अस्थायी रहने अथवा पहरा देने की झोंपड़ी को सूचित करता है। ‘अस्थायी’ जोड़ने से चित्र का आवश्यक गुण स्पष्ट होता है; ‘पहरेदार की झोंपड़ी’ संभावित पर अधिक विशिष्ट अर्थ है, इसलिए पादटिप्पणी में रखा गया है।
- source_word: וְכָבַד עָלֶיהָ
  choice: उस पर भारी पड़ेगा
  rationale: यह भार के रूपक को बनाए रखते हुए आधुनिक हिन्दी का स्वाभाविक प्रयोग है।
- source_word: פִּשְׁעָהּ
  choice: उसका विद्रोह
  rationale: פֶּשַׁע केवल सामान्य अपराध नहीं, बल्कि अधिकार के विरुद्ध उल्लंघन या विद्रोह का भाव रखता है। ‘विद्रोह’ इसकी नैतिक गंभीरता को सुरक्षित रखता है।
- source_word: וְנָפְלָה
  choice: वह गिर जाएगी
  rationale: भविष्यसूचक न्याय-क्रम में पूर्ण रूप को हिन्दी में भविष्यकाल से स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: וְלֹא תֹסִיף קוּם
  choice: फिर कभी न उठेगी
  rationale: יסף और infinitive का मुहावरा दोबारा क्रिया न होने का अर्थ देता है। ‘फिर कभी न उठेगी’ उस निर्णायकता को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: न्याय के संदर्भ में אֶרֶץ का विस्तार
  choice: पृथ्वी
  alternative: देश / भूमि
  rationale: अध्याय का व्यापक परिप्रेक्ष्य सार्वभौमिक विनाश की ओर संकेत करता है, इसलिए ‘पृथ्वी’ चुना गया है। यह अतिरिक्त धर्मसिद्धान्त जोड़े बिना प्रसंगगत विस्तार को व्यक्त करता है।
- issue: פִּשְׁעָהּ का नैतिक स्वर
  choice: उसका विद्रोह
  alternative: उसका अपराध / उसका उल्लंघन
  rationale: ‘विद्रोह’ मूल शब्द में निहित अधिकार-विरोधी भाव को बनाए रखता है, पर यह निर्दिष्ट नहीं करता कि विद्रोह का कोई संप्रदायगत ढाँचा है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। हिब्रानी की बलाघाती रचना को शब्दशः दोहराने के बजाय ‘बुरी तरह’ से व्यक्त किया गया है। मुख्य पाठ का [a] पादटिप्पणी के संभावित अधिक विशिष्ट अर्थ से जुड़ा है।
