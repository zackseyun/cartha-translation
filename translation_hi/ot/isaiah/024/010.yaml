- source_word: קִרְיַת
  choice: नगर
  rationale: קִרְיָה का रचनात्मक रूप ‘नगर का/… का नगर’ दर्शाता है; आधुनिक गरिमापूर्ण हिन्दी में ‘नगर’ उपयुक्त है।
- source_word: תֹּהוּ
  choice: अव्यवस्था
  rationale: यह शब्द अव्यवस्था, खालीपन या उजाड़पन सूचित कर सकता है। ‘अव्यवस्था’ मूल की अमूर्त और प्रलयकारी छवि बनाए रखता है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: סֻגַּר
  choice: बंद है
  rationale: पुअल पूर्ण रूप का निष्क्रिय भाव ‘बंद किया गया/बंद है’ है। परिणामस्वरूप अवस्था को ‘बंद है’ सरल और स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל בַּיִת
  choice: हर घर
  rationale: एकवचन संज्ञा के साथ כָּל का वितरणात्मक अर्थ ‘हर घर’ है और यहाँ भौतिक भवन तथा प्रवेश पर बल है।
- source_word: מִבּוֹא
  choice: कि कोई भीतर न जा सके
  rationale: מן के साथ בוא का क्रियार्थक संज्ञा-रूप शाब्दिक रूप से ‘प्रवेश करने से’ है। सन्दर्भ में घरों को बंद करने का परिणाम—प्रवेश असम्भव होना—इस स्वाभाविक हिन्दी वाक्यांश से स्पष्ट होता है।
