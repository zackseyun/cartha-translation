  text: אָבַ֥ל תִּיר֖וֹשׁ אֻמְלְלָה גָ֑פֶן נֶאֶנְח֖וּ כָּל שִׂמְחֵי לֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/007.yaml
  text: The new wine mourns[a], the vine withers; all the glad of heart groan.
translation:
  language: hi
  text: नया दाखरस शोक मनाता है, अंगूर की बेल कुम्हला जाती है; जिनके मन आनंदित हैं, वे सभी कराहते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָבַל
  choice: शोक मनाता है
  rationale: क्रिया का सामान्य अर्थ शोक करना है। यहाँ नए दाखरस का मानवीकरण हुआ है; इसे बनाए रखने से अंतिम खंड में लोगों के कराहने के साथ काव्यात्मक समानता बनी रहती है।
- source_word: תִּירוֹשׁ
  choice: नया दाखरस
  rationale: यह शब्द सामान्यतः ताज़े या नए दाखरस को सूचित करता है; यह अनुवाद उसके विशिष्ट अर्थ को सुरक्षित रखता है।
- source_word: אֻמְלְלָה
  choice: मुरझा जाती है
  rationale: क्रिया क्षीण होने, ढलने या मुरझाने का भाव देती है; दाखलता के संदर्भ में यह स्वाभाविक और चित्रात्मक है।
- source_word: גָפֶן
  choice: दाखलता
  rationale: यह अंगूर की बेल का संक्षिप्त, प्रतिष्ठित और प्रचलित हिन्दी समतुल्य है।
- source_word: נֶאֶנְחוּ
  choice: कराहते हैं
  rationale: निफ़अल रूप दुःख की श्रव्य अभिव्यक्ति बताता है; ‘कराहते हैं’ पद के विनाश और व्यथा के स्वर को व्यक्त करता है।
- source_word: כָּל
  choice: सभी लोग
  rationale: बहुवचन समूह के सामूहिक अर्थ को हिन्दी में स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: שִׂמְחֵי לֵב
  choice: मन से आनन्दित
  rationale: शाब्दिक भाव ‘हृदय से आनन्दित’ है। ‘मन से आनन्दित’ आधुनिक हिन्दी में सहज रहते हुए आन्तरिक प्रसन्नता का भाव सुरक्षित रखता है।
