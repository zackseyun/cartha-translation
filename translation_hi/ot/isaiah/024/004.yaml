source:
  edition: WLC
  text: אָבְלָ֤ה נָֽבְלָה֙ הָ/אָ֔רֶץ אֻמְלְלָ֥ה נָבְלָ֖ה תֵּבֵ֑ל אֻמְלָ֖לוּ מְר֥וֹם עַם הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/004.yaml
  text: The earth mourns and withers[a]; the world wastes away and withers; the exalted people of the earth waste away.
translation:
  language: hi
  text: पृथ्वी शोक करती है और मुरझाती है; जगत क्षीण होता है और मुरझाता है; पृथ्वी के प्रतिष्ठित लोग[a] क्षीण हो जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘पृथ्वी के लोगों की ऊँचाई’ या ‘उच्चता’ है; इसका अर्थ ‘पृथ्वी के कुलीन जन’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבְלָה
  choice: शोक करती है
  rationale: אבל का सामान्य अर्थ शोक या विलाप करना है। निर्जीव पृथ्वी का मानवीकरण बनाए रखते हुए यह न्याय के अधीन उसकी दुर्दशा का भाव व्यक्त करता है।
- source_word: נָבְלָה
  choice: मुरझाती है
  rationale: נבל फीका पड़ने या मुरझाने को दर्शाता है। हिन्दी में ‘मुरझाना’ पतन की काव्यात्मक छवि को स्वाभाविक रूप से बनाए रखता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: यह शब्द ‘देश’ भी हो सकता है, पर תֵּבֵל के साथ समानांतर प्रयोग और प्रसंग का व्यापक क्षितिज यहाँ ‘पृथ्वी’ का समर्थन करता है।
- source_word: אֻמְלְלָה / אֻמְלָלוּ
  choice: क्षीण होता/हो जाते हैं
  rationale: אמל दुर्बल, निस्तेज या सूखते जाने का भाव देता है। ‘क्षीण होना’ נבל के ‘मुरझाना’ से भेद रखते हुए क्रमिक दुर्बलता व्यक्त करता है।
- source_word: תֵּבֵל
  choice: जगत
  rationale: תבל व्यवस्थित या आबाद संसार को सूचित करता है। ‘जगत’ काव्यात्मक समानांतरता में स्वाभाविक, गरिमापूर्ण और व्यापक है।
- source_word: מְרוֹם עַם הָאָרֶץ
  choice: पृथ्वी के प्रतिष्ठित लोग
  rationale: מְרוֹם का शाब्दिक भाव ‘ऊँचाई’ या ‘ऊँचा स्थान’ है; यहाँ वह लोगों में ऊँचे माने जाने वालों की ओर संकेत करता है। ‘प्रतिष्ठित लोग’ सामाजिक ऊँचाई को व्यक्त करता है, पर उसे किसी निश्चित पदवी तक सीमित नहीं करता।
theological_decisions:
- issue: הארץ / תבל में न्याय का दायरा
  choice: ‘पृथ्वी’ और ‘जगत’ द्वारा व्यापक, विश्वव्यापी दायरा
  alternative: स्थानीय ‘देश’ या ‘भूमि’
  rationale: הארץ और תבל की समानांतरता तथा यशायाह 24 की व्यापक भाषा स्थानीय अर्थ की अपेक्षा विश्वव्यापी क्षितिज का अधिक स्वाभाविक संकेत देती है।
- issue: מְרוֹם עַם הָאָרֶץ की पहचान
  choice: ‘प्रतिष्ठित लोग’—मानव समाज में ऊँचे माने जाने वाले व्यक्ति
  alternative: ‘पृथ्वी के कुलीन जन’ या शाब्दिक ‘पृथ्वी के लोगों की ऊँचाई’
  rationale: वाक्यांश सामाजिक या राजनैतिक ऊँचाई का संकेत दे सकता है, पर किसी विशिष्ट वर्ग को निश्चित नहीं करता। अनुवाद इस अस्पष्टता को पर्याप्त रूप से खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। समानांतर पंक्तियों में ‘मुरझाना’ और ‘क्षीण होना’ द्वारा दो अलग इब्रानी मूलों का भेद रखा गया है।
