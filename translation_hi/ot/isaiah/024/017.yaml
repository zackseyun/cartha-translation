  yaml_path: translation/ot/isaiah/024/017.yaml
  text: Terror and the pit and the snare are upon you[a], inhabitant of the earth.
translation:
  language: hi
  text: भय, गड्ढा और फंदा तुम पर हैं, हे पृथ्वी-निवासी![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भय, गड्ढा और फंदा तुम पर हैं, हे पृथ्वी पर रहनेवाले!”
    reason: יוֹשֵׁב הָאָרֶץ के एकवचन संबोधन को अधिक मुहावरेदार हिन्दी में व्यक्त करने वाला अनुवाद-विकल्प।
lexical_decisions:
- source_word: פַּחַד
  choice: आतंक
  rationale: यह शब्द भय या दहशत को व्यक्त करता है; न्याय की इस त्रयी में “आतंक” आसन्न भयावह संकट की तीव्रता को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: פַחַת
  choice: गड्ढा
  rationale: यह पकड़ने के लिए बनाए गए गड्ढे को सूचित कर सकता है। “गड्ढा” संक्षिप्त और प्रत्यक्ष है तथा अगले “फंदा” से अलग बिंब बनाए रखता है।
- source_word: פָח
  choice: फंदा
  rationale: यह किसी को पकड़ने वाले फंदे या जाल का द्योतक है। “फंदा” काव्यात्मक त्रयी में स्वाभाविक है और पिछले गड्ढे से भिन्न प्रकार के संकट को दिखाता है।
- source_word: עָלֶיךָ
  choice: तुम पर हैं
  rationale: इब्रानी में क्रियारहित वाक्य तत्काल उपस्थिति का भाव देता है। “तुम पर हैं” उस निकटता को बनाए रखता है; भविष्यकाल जोड़ना आवश्यक नहीं है।
- source_word: יוֹשֵׁב הָאָרֶץ
  choice: हे पृथ्वी के निवासी
  rationale: एकवचन कृदंत यहाँ संबोधन के रूप में है। “हे पृथ्वी के निवासी” एकवचन और अध्याय के व्यापक, विश्वव्यापी परिप्रेक्ष्य दोनों को बनाए रखता है।
theological_decisions:
- issue: הָאָרֶץ का क्षेत्र
  choice: पृथ्वी
  alternative: देश
  rationale: אֶרֶץ का अर्थ “देश” भी हो सकता है, पर यशायाह 24 का व्यापक न्याय-संदर्भ “पृथ्वी” का समर्थन करता है। यह चयन विश्वव्यापी दायरे को व्यक्त करता है, बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमामय और काव्यात्मक शैली रखी गई है। मूल की तीन-सदस्यीय संकट-सूची सुरक्षित है, यद्यपि इब्रानी का ध्वन्यात्मक शब्दालंकार हिन्दी में पूरी तरह पुनरुत्पादित नहीं किया जा सकता।
