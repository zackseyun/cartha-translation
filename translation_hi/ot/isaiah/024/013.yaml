source:
  edition: WLC
  text: כִּ֣י כֹ֥ה יִהְיֶ֛ה בְּ/קֶ֥רֶב הָ/אָ֖רֶץ בְּ/ת֣וֹךְ הָֽ/עַמִּ֑ים כְּ/נֹ֣קֶף זַ֔יִת כְּ/עוֹלֵלֹ֖ת אִם כָּלָ֥ה בָצִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/013.yaml
  text: 'For so it will be in the midst of the earth[a], among the peoples: like the beating of an olive tree[b], like gleanings when the grape harvest is finished.'
translation:
  language: hi
  text: क्योंकि पृथ्वी[a] के मध्य, लोगों के बीच, ऐसा ही होगा—जैसे जैतून के पेड़ को झाड़ने[b] पर होता है, और जैसे अंगूर की कटनी समाप्त होने पर बचे हुए फल बीनने पर होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देश” अथवा “भूमि।”
    reason: हिब्रू הָאָרֶץ का अर्थ संदर्भ के अनुसार ‘पृथ्वी’ या ‘देश/भूमि’ हो सकता है।
  - marker: b
    text: या, “पीटने।” जैतून के बचे हुए फलों को गिराने के लिए पेड़ को झाड़ा या उसकी डालियों पर प्रहार किया जाता था।
    reason: हिब्रू शब्द जैतून गिराने के लिए पेड़ को झाड़ने या पीटने की क्रिया का चित्र प्रस्तुत करता है।
lexical_decisions:
- source_word: כִּי כֹה יִהְיֶה
  choice: क्योंकि ... ऐसा ही होगा
  rationale: כִּי पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है, और כֹה יִהְיֶה का स्वाभाविक भाव ‘ऐसा ही होगा’ है।
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: पृथ्वी के बीच
  rationale: קֶרֶב भीतर या मध्य को दर्शाता है। הָאָרֶץ ‘पृथ्वी’ अथवा ‘देश/भूमि’ हो सकता है; साथ के बहुवचन ‘जन-समुदायों’ और व्यापक न्याय-संदर्भ के कारण मुख्य पाठ में ‘पृथ्वी’ चुना गया है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: בְּתוֹךְ הָעַמִּים
  choice: जन-समुदायों के मध्य
  rationale: עַמִּים विभिन्न peoples को सूचित करता है। ‘जन-समुदाय’ आधुनिक हिन्दी में जातीय-सामुदायिक बहुलता को व्यक्त करता है और आधुनिक राजनीतिक राष्ट्र-राज्यों का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: כְּנֹקֶף זַיִת
  choice: जैसे जैतून के पेड़ को झाड़ने पर
  rationale: נֹקֶף यहाँ जैतून गिराने के लिए पेड़ पर प्रहार करने या उसे झाड़ने की कृषि-क्रिया का बोध कराता है। ‘झाड़ने’ से हिन्दी पाठक को चित्र सहज समझ आता है; अधिक शाब्दिक ‘पीटने’ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: כְּעוֹלֵלֹת
  choice: जैसे ... बची हुई बीनाई
  rationale: עוֹלֵלֹת मुख्य कटनी के बाद बीनने के लिए बचे थोड़े फल को दर्शाता है। ‘बची हुई बीनाई’ अवशेष की छवि और कृषि-संदर्भ दोनों को स्पष्ट रखता है।
- source_word: אִם כָּלָה בָצִיר
  choice: अंगूर की कटनी समाप्त होने पर
  rationale: इस संदर्भ में אִם शर्तसूचक ‘यदि’ के बजाय कालसूचक ‘जब/होने पर’ है, और בָצִיר विशेष रूप से अंगूर की कटनी है।
