translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर कृषि-चित्रों और पद की विरल बचे हुए फल वाली छवि को बनाए रखने के लिए वाक्य में दीर्घ विराम का प्रयोग किया गया है।
