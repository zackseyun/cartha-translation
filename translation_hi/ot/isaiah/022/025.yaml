review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the prophetic formula, the peg metaphor without identifying its referent, the sequence of removal/cutting/falling, and the concluding divine affirmation. However, ‘खिसक जाएगी’ can suggest only a minor sideways shift, whereas תָּמוּשׁ in this judgment sequence more clearly conveys that the peg will be removed or give way.
  naturalness: The register is appropriately dignified and modern. ‘दृढ़ स्थान’ is understandable but somewhat literal; ‘मज़बूत स्थान’ is more idiomatic in modern standard Hindi. A direct rendering of the final clause about the load is also smoother without the slightly redundant ‘काटकर अलग’.
  terminology: ‘सेनाओं के यहोवा,’ ‘खूंटी,’ and ‘भार’ are suitable and consistent. The lexical-alternative footnotes are correctly anchored to the relevant Hindi words and preserve the intended alternatives.
  issues:
  - severity: low
    issue: ‘खिसक जाएगी’ understates תָּמוּשׁ.
    rationale: In the immediate context of the peg’s destruction, ‘अपनी जगह से हट जाएगी’ better conveys removal/failure while retaining the metaphor.
  - severity: low
    issue: ‘दृढ़ स्थान’ is somewhat wooden in current Hindi.
    rationale: ‘मज़बूत स्थान’ naturally expresses the firmness/reliability of the place intended by נֶאֱמָן.
  - severity: low
    issue: ‘काटकर अलग कर दिया जाएगा’ is more expansive than necessary for וְנִכְרַת.
    rationale: ‘काट दिया जाएगा’ retains the source’s cutting-off image directly; ‘उस पर का भार’ leaves the hanging relationship implicit in the metaphor, as in the Hebrew.
  revised_text: “उस दिन—सेनाओं के यहोवा की यह घोषणा है—मज़बूत स्थान में गड़ी हुई खूंटी[a] अपनी जगह से हट जाएगी; वह काट दी जाएगी और गिर पड़ेगी, और उस पर का भार काट दिया जाएगा[b], क्योंकि यहोवा ने कहा है।”
