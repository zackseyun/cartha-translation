id: ISA.22.25
reference: Isaiah 22:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת תָּמוּשׁ֙ הַ/יָּתֵ֔ד הַ/תְּקוּעָ֖ה בְּ/מָק֣וֹם נֶאֱמָ֑ן וְ/נִגְדְּעָ֣ה וְ/נָפְלָ֗ה וְ/נִכְרַת֙ הַ/מַּשָּׂ֣א אֲשֶׁר עָלֶ֔י/הָ כִּ֥י יְהוָ֖ה דִּבֵּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/025.yaml
  text: On that day[a], declares Yahweh of hosts, the peg fastened in a secure place will give way, and it will be cut down and fall, and the load that was on it will be cut off[b], for Yahweh has spoken.
translation:
  language: hi
  text: “उस दिन—सेनाओं के यहोवा की यह घोषणा है—मज़बूत स्थान में गड़ी हुई खूंटी[a] अपनी जगह से हट जाएगी; वह काट दी जाएगी और गिर पड़ेगी, और उस पर का भार काट दिया जाएगा[b], क्योंकि यहोवा ने कहा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कील।”
    reason: lexical_alternative
  - marker: b
    text: “भार” का अनुवाद “बोझ” भी हो सकता है; इब्रानी में आशय उस वस्तु से है जो खूंटी पर टँगी थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा की यह घोषणा है
  rationale: נְאֻם एक भविष्यसूचक उद्घोषणा-सूत्र है। यह हिन्दी रूप उसकी औपचारिकता और अधिकार को स्वाभाविक ढंग से व्यक्त करता है; צְבָאוֹת को उसके व्यापक अर्थ सहित ‘सेनाओं के’ रखा गया है।
- source_word: תָּמוּשׁ
  choice: खिसक जाएगी
  rationale: מוּשׁ हटने, सरकने या अपनी स्थिरता खोने का भाव देता है। गड़ी हुई खूंटी के प्रसंग में ‘खिसक जाएगी’ उसके विफल हो जाने की छवि को स्पष्ट रखता है।
- source_word: הַיָּתֵד
  choice: खूंटी
  rationale: יָתֵד खूंटी या बड़ी कील को सूचित कर सकता है। भार थामने वाली वस्तु की इस उपमा में ‘खूंटी’ स्वाभाविक है और तंबू की खूंटी का अनावश्यक विशिष्टीकरण नहीं करती।
- source_word: הַתְּקוּעָה בְּמָקוֹם נֶאֱמָן
  choice: दृढ़ स्थान में गड़ी हुई
  rationale: תקע का निष्क्रिय कृदन्त गाड़े या ठोंके जाने को और נֶאֱמָן यहाँ स्थान की दृढ़ता व भरोसेमंदी को व्यक्त करता है।
- source_word: וְנִגְדְּעָה וְנָפְלָה
  choice: वह काट दी जाएगी और गिर पड़ेगी
  rationale: גדע काट डालने और נפל गिरने की क्रमिक क्रियाएँ हैं। हिन्दी में यह रूप हिंसक हटाए जाने और उसके फलस्वरूप गिरने, दोनों को बनाए रखता है।
- source_word: וְנִכְרַת הַמַּשָּׂא אֲשֶׁר עָלֶיהָ
  choice: उस पर टँगा हुआ भार काटकर अलग कर दिया जाएगा
  rationale: מַשָּׂא भार या बोझ है; खूंटी की ठोस छवि के कारण ‘भार’ चुना गया। נִכְרַת के काटकर अलग किए जाने के भाव को बनाए रखते हुए ‘टँगा हुआ’ प्रसंग में निहित संबंध स्पष्ट करता है।
- source_word: כִּי יְהוָה דִּבֵּר
  choice: क्योंकि यहोवा ने कहा है
  rationale: यह भविष्यसूचक समापन वचन की निश्चितता को पुष्ट करता है। ‘कहा है’ आधुनिक हिन्दी में सहज और गंभीर है।
theological_decisions:
- issue: खूंटी की उपमा का अभिप्रेत व्यक्ति या सत्ता
  choice: अनुवाद में उपमा को बनाए रखा गया है और उसके अभिप्रेत की स्पष्ट पहचान नहीं की गई।
  alternative: इसे एल्याकीम, उसके द्वारा समर्थित घराने अथवा पहले कही गई स्थिरता के उलट जाने के स्पष्ट संकेत के रूप में पहचाना जा सकता था।
  rationale: इस पद का इब्रानी पाठ स्वयं खूंटी के अभिप्रेत का नाम नहीं बताता। स्पष्ट पहचान जोड़ने से पाठ में विद्यमान व्याख्यात्मक और धर्मवैचारिक तनाव समय से पहले सुलझ जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। मूल परामर्श-पाठ में [a] का स्थान ‘उस दिन’ के बाद था, पर उसकी टिप्पणी खूंटी/कील के विकल्प से संबंधित है; इसलिए अर्थगत शुद्धता हेतु चिह्न ‘खूंटी’ के बाद रखा गया है।
