  text: תְּשֻׁא֣וֹת מְלֵאָ֗ה עִ֚יר הֽוֹמִיָּ֔ה קִרְיָ֖ה עַלִּיזָ֑ה חֲלָלַ֨יִ/ךְ֙ לֹ֣א חַלְלֵי חֶ֔רֶב וְ/לֹ֖א מֵתֵ֥י מִלְחָמָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/002.yaml
  text: O city full of shouting[a], tumultuous city, exultant town—your slain are not slain by the sword, nor dead in battle.
translation:
  language: hi
  text: हे शोरगुल से भरे नगर[a], कोलाहलमय नगरी, आनन्दमयी नगरी—तेरे मारे हुए न तो तलवार से मारे गए, न युद्ध में मरे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हल्ले से भरे नगर ... गूँजती नगरी ... उल्लासित नगरी।’ इब्रानी में ऊँची, उत्सवी गहमागहमी दिखाने के लिए कई निकटार्थी शब्द एक साथ रखे गए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשֻׁאוֹת
  choice: शोरगुल
  rationale: यह बहुवचन संज्ञा ऊँची आवाज़, हल्ले या कोलाहल का बोध कराती है। ‘शोरगुल’ उत्सवी और अशांत—दोनों प्रकार की गहमागहमी को खुला रखता है।
- source_word: מְלֵאָה
  choice: से भरे
  rationale: नगर को उसकी प्रचुर ध्वनि से चिह्नित करनेवाले ‘भरा हुआ’ भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עִיר
  choice: नगर
  rationale: शहरी बस्ती के लिए सामान्य, गरिमापूर्ण शब्द; प्रत्यक्ष सम्बोधन में सहज है।
- source_word: הוֹמִיָּה
  choice: कोलाहलमय
  rationale: मूल विशेषण गर्जना, गूँज और भीड़भरे हल्ले का संकेत देता है। ‘कोलाहलमय’ काव्यात्मक समानांतरता और नागरिक गहमागहमी दोनों को बनाए रखता है।
- source_word: קִרְיָה
  choice: नगरी
  rationale: עִיר का निकटार्थी काव्यात्मक शब्द है। ‘नगरी’ पुनरुक्ति के बिना समानांतर शहरी सम्बोधन को सुरक्षित रखता है।
- source_word: עַלִּיזָה
  choice: आनन्द मनानेवाले
  rationale: यह विशेषण उल्लास और उमंग का बोध कराता है। हिन्दी में नगर के निवासियों को समष्टिगत रूप से सम्बोधित करते हुए यह प्रयोग स्वाभाविक है और आत्मविश्वासी उत्सव का भाव रखता है।
- source_word: חֲלָלַיִךְ
  choice: तेरे मारे हुए
  rationale: सन्दर्भ में यह केवल घायल नहीं, प्राण गँवा चुके लोगों को बताता है। ‘मारे हुए’ अगले समान-मूल वाले पद के साथ जानबूझकर की गई पुनरुक्ति को यथासम्भव बनाए रखता है।
- source_word: חַלְלֵי חֶרֶב
  choice: तलवार से मारे गए
  rationale: हिंसक युद्ध-मृत्यु की मानक इब्रानी अभिव्यक्ति को स्पष्ट और स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: מֵתֵי מִלְחָמָה
  choice: युद्ध में मरे
  rationale: युद्ध के हताहतों का सीधा अर्थ देता है और पहले खण्ड के समानांतर संक्षिप्त रहता है।
