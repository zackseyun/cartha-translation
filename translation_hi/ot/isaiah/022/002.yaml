  verdict: revise
  source_fidelity: 'The draft accurately represents the Hebrew’s threefold poetic address and its contrast: the city’s dead did not die by sword or in battle. ‘शोरगुल,’ ‘कोलाहलमय,’ and the repeated death language suitably reflect the source’s sound-patterning and near-synonymous phrasing.'
  naturalness: 'Most of the Hindi is clear and appropriately elevated. However, ‘आनन्द मनानेवाले नगर’ has a grammatical agreement mismatch: ‘मनानेवाले’ is masculine plural, whereas it modifies the singular city. The city itself, rather than its inhabitants, is the subject of the Hebrew adjective.'
  terminology: ‘नगर/नगरी,’ ‘तलवार,’ and ‘युद्ध’ are suitable modern-standard Hindi choices. ‘आनन्दमयी नगरी’ preserves the source adjective’s direct qualification of the city and maintains the prophetic-poetic register.
  issues:
  - severity: medium
    issue: Grammatical agreement and referent in ‘आनन्द मनानेवाले नगर’
    rationale: The Hebrew עַלִּיזָה is a feminine singular adjective modifying ‘city/town.’ The Hindi participial form ‘मनानेवाले’ is masculine plural and shifts the modifier to implied inhabitants. Recasting it as a singular city-modifier resolves both grammar and source fidelity.
  revised_text: हे शोरगुल से भरे नगर[a], कोलाहलमय नगरी, आनन्दमयी नगरी—तेरे मारे हुए न तो तलवार से मारे गए, न युद्ध में मरे।
