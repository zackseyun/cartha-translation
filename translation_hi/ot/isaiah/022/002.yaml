translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वक्ताई काव्य-रजिस्टर अपनाया गया है। निकटार्थी शहरी सम्बोधनों और ध्वनि-सूचक शब्दों की शृंखला को दोहराव मिटाए बिना स्वाभाविक बनाया गया है। स्त्रीलिंग एकवचन सम्बोधन को ‘तेरे’ के द्वारा बनाए रखा गया है।
