source:
  edition: WLC
  text: כֹּ֥ה אָמַ֛ר אֲדֹנָ֥/י יְהוִ֖ה צְבָא֑וֹת לֶךְ בֹּא֙ אֶל הַ/סֹּכֵ֣ן הַ/זֶּ֔ה עַל שֶׁבְנָ֖א אֲשֶׁ֥ר עַל הַ/בָּֽיִת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/015.yaml
  text: 'Thus says the Lord Yahweh of hosts: Go[a], come to this steward, to Shebna[b], who is over the house:'
translation:
  language: hi
  text: 'सेनाओं का प्रभु याहवे यों कहता है: “जा[a], इस अधिकारी, शेबना, के पास पहुँच, जो राजमहल का प्रभारी है[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे “जा, इस अधिकारी शेबना के पास भीतर जा” भी समझा जा सकता है। इब्रानी में दो आज्ञार्थक क्रियाएँ, “जा, आ,” हैं, जो संभवतः मिलकर एक मुहावरे की तरह काम करती हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जो घर के ऊपर है।” यह राजमहल के मुख्य प्रशासक या भंडारी का पद था।
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह नबूवत के संदेश का पारंपरिक परिचय है; ‘यों’ मूल की संक्षिप्तता और गरिमा बनाए रखता है।
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: सेनाओं का प्रभु याहवे
  rationale: ‘प्रभु’ אֲדֹנָי को, ‘याहवे’ परमेश्वर के व्यक्तिगत नाम को, और ‘सेनाओं का’ צְבָאוֹת को स्पष्ट रूप से व्यक्त करता है। हिंदी में पदवी को पहले रखने से वाक्य अपेक्षाकृत स्वाभाविक रहता है।
- source_word: לֶךְ בֹּא
  choice: जा, ... के पास आ
  rationale: मूल के दोनों आज्ञार्थक क्रिया-रूपों को रखा गया है। हिंदी में यह आकस्मिक लग सकता है, इसलिए पादटिप्पणी मुहावरेदार संभावना बताती है।
- source_word: הַסֹּכֵן
  choice: भंडारी
  rationale: यह शब्द सौंपे हुए प्रशासनिक दायित्व वाले राजकीय अधिकारी को सूचित करता है। ‘भंडारी’ संक्षिप्त है और प्राचीन दरबारी भूमिका को व्यक्त करता है, जबकि अगला पदबंध उसका ऊँचा पद स्पष्ट करता है।
- source_word: הַזֶּה עַל שֶׁבְנָא
  choice: इस भंडारी शेबना
  rationale: שֶׁבְנָא को ‘इस भंडारी’ की पहचान बताने वाला समानाधिकरण माना गया है; עַל को यहाँ विरोधसूचक ‘के विरुद्ध’ नहीं बनाया गया।
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: जो राजमहल का प्रधान प्रबंधक है
  rationale: शाब्दिक रूप ‘जो घर के ऊपर है’ राजमहल के मुख्य प्रशासक की पदवी है। अर्थ को आधुनिक पाठक के लिए स्पष्ट किया गया है, बिना भूमिका को किसी अधिक विशिष्ट पद तक सीमित किए।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर / प्रभु यहोवा
  rationale: मूल में चार-अक्षरीय व्यक्तिगत नाम सीधे उपस्थित है। ‘याहवे’ उसे सामान्य उपाधि ‘परमेश्वर’ में विलीन नहीं करता, और ‘प्रभु’ אֲדֹנָי को अलग से सुरक्षित रखता है।
- issue: צְבָאוֹת की व्यापकता
  choice: सेनाओं का
  alternative: सर्वशक्तिमान
  rationale: ‘सेनाओं का’ मूल रूपक को बनाए रखता है और उसे केवल सर्वशक्तिमत्ता के धर्मवैज्ञानिक सारांश में नहीं बदलता; इसमें स्वर्गीय अथवा सांसारिक दलों की संभावित व्यापकता बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथनात्मक रखी गई है। ‘यों कहता है’ नबूवत की औपचारिक लय देता है। ‘भंडारी’ के साथ स्पष्ट पद-विवरण जोड़कर प्राचीन दरबारी शब्द को सामान्य पाठक के लिए समझने योग्य बनाया गया है।
