  yaml_path: translation/ot/isaiah/022/003.yaml
  text: All your rulers have fled together[a]; they were captured without the bow. All of your fugitives who were found were captured together[b]; they had fled far away.
translation:
  language: hi
  text: तेरे सभी शासक एक साथ भाग गए[a]; वे बिना धनुष के बंदी बना लिए गए। तेरे जो लोग पाए गए, वे सब एक साथ बंदी बना लिए गए[b]; वे दूर भाग गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “धनुष से/धनुष के बिना बाँधे गए।” अर्थ यह हो सकता है कि उन्हें धनुष के प्रयोग के बिना पकड़ लिया गया, या पकड़े जाते समय उनके हाथ में धनुष नहीं था।
    reason: lexical_alternative
  - marker: b
    text: या, “तेरे जो लोग पाए गए, वे सब एक साथ बाँधे गए; वे दूर से भागे।” अंतिम उपवाक्य की इब्रानी रचना संक्षिप्त है और उसका संबंध एक से अधिक ढंग से समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: קְצִינַיִךְ
  choice: तेरे सभी शासक
  rationale: קָצִין अधिकारी, शासक या सेनानायक को सूचित कर सकता है। नगर और सैन्य नेतृत्व—दोनों को समेटने के लिए ‘शासक’ उपयुक्त व्यापक शब्द है। स्त्रीलिंग एकवचन प्रत्यय यरूशलेम को संबोधित है, इसलिए ‘तेरे’ रखा गया है।
- source_word: נָדְדוּ
  choice: भाग गए
  rationale: נדד का अर्थ भटकना भी हो सकता है, पर घेराबंदी और गिरफ्तारी के इस प्रसंग में पलायन का भाव प्रमुख है।
- source_word: יַחַד / יַחְדָּו
  choice: एक साथ
  rationale: दोनों क्रियाविशेषण सामूहिक रूप से कार्य होने का भाव देते हैं; स्वाभाविक हिन्दी में ‘एक साथ’ उपयुक्त है।
- source_word: מִקֶּשֶׁת
  choice: बिना धनुष के ही
  rationale: 'מִן को यहाँ वियोगात्मक अथवा अभावसूचक अर्थ में लिया गया है: धनुष के उपयोग के बिना। ‘ही’ इस आश्चर्यजनक तथ्य को स्वाभाविक हिन्दी में उभारता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।'
- source_word: אֻסָּרוּ / אֻסְּרוּ
  choice: बंदी बना लिए गए
  rationale: אָסַר का मूल अर्थ ‘बाँधना’ है, किंतु युद्ध-संदर्भ में कर्मवाच्य रूप का आशय कैदी बनाए जाने से है। यह चयन मूल बिंब और प्रसंगगत अर्थ के बीच संतुलन रखता है।
- source_word: נִמְצָאַיִךְ
  choice: तेरे जितने लोग पाए गए
  rationale: रूप का सीधा अर्थ ‘तेरे जो पाए गए’ है। ‘भगोड़े’ संदर्भ से संभव है, पर स्वयं इस पद में व्यक्त नहीं; इसलिए मुख्य पाठ में अधिक शाब्दिक और व्यापक अभिव्यक्ति रखी गई है।
- source_word: מֵרָחוֹק בָּרָחוּ
  choice: वे दूर भाग गए थे
  rationale: ברח स्पष्टतः भागने को दर्शाता है। हिन्दी का पूर्ण भूतकाल गिरफ्तारी से पहले हुए पलायन का क्रम स्पष्ट करता है; מֵרָחוֹק की संक्षिप्त रचना की दूसरी संभावित व्याख्या पादटिप्पणी में दी गई है।
