  text: וְ/אֵ֨ת בְּקִיעֵ֧י עִיר דָּוִ֛ד רְאִיתֶ֖ם כִּי רָ֑בּוּ וַֽ/תְּקַבְּצ֔וּ אֶת מֵ֥י הַ/בְּרֵכָ֖ה הַ/תַּחְתּוֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/009.yaml
  text: You saw that the breaches of the city of David were many[a], and you collected the waters of the lower pool.
translation:
  language: hi
  text: तुमने देखा कि दाऊद के नगर की शहरपनाह में बहुत-से टूटे हुए स्थान थे, और तुमने निचले जलाशय[a] का पानी इकट्ठा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निचले कुण्ड का पानी।” इब्रानी शब्द का अर्थ कुण्ड या जलाशय हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקִיעֵי
  choice: शहरपनाह में ... दरारें
  rationale: यह शब्द किसी दीवार या संरचना में फूटे हुए स्थानों अथवा खुली टूटनों को दर्शाता है। यरूशलेम की सुरक्षा-व्यवस्था के संदर्भ में ‘शहरपनाह में दरारें’ साधारण हिन्दी पाठक के लिए अर्थ स्पष्ट करता है।
- source_word: עִיר דָּוִד
  choice: दाऊद का नगर
  rationale: यह दाऊद से संबद्ध नगर का स्थापित ऐतिहासिक नाम है; हिन्दी में ‘दाऊद का नगर’ स्वाभाविक और स्पष्ट है।
- source_word: רְאִיתֶם
  choice: तुमने देखा
  rationale: ראה के सामान्य अर्थ ‘देखना’ को सीधे रखा गया है; संदर्भ में इसमें स्थिति पर ध्यान देने का भाव भी समाहित है।
- source_word: כִּי רָבּוּ
  choice: बहुत-सी ... पड़ गई थीं
  rationale: כִּי यहाँ देखी गई बात की विषय-वस्तु बताता है और רָבּוּ दरारों की बहुलता या बढ़ जाने को सूचित करता है। हिन्दी में यह वाक्य-विन्यास उस परिणामी दशा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַתְּקַבְּצוּ
  choice: तुमने ... इकट्ठा किया
  rationale: קבץ का मूल भाव एकत्र करना है; पानी के प्रबंधन के संदर्भ में ‘पानी इकट्ठा किया’ सहज हिन्दी है।
- source_word: מֵי הַבְּרֵכָה הַתַּחְתּוֹנָה
  choice: निचले जलाशय का पानी
  rationale: בְּרֵכָה कुंड, हौद या जलाशय को दर्शा सकता है। यहाँ जल-संग्रह और नगर की रक्षा की पृष्ठभूमि में ‘जलाशय’ स्पष्ट तथा स्वाभाविक है; מֵי के हिब्रू बहुवचन-रूप को हिन्दी में स्वाभाविक सामूहिक एकवचन ‘पानी’ से व्यक्त किया गया है।
