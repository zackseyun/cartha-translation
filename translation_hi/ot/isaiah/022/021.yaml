base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/021.yaml
  text: I will clothe him with your tunic[a], and I will fasten your sash on him; I will place your authority into his hand, and he will become a father to the inhabitants of Jerusalem and to the house of Judah.
translation:
  language: hi
  text: मैं उसे तुम्हारा अंगरखा पहनाऊँगा, और तुम्हारा कमरबंद उसकी कमर पर कसूँगा; तुम्हारा अधिकार मैं उसके हाथ में सौंप दूँगा। वह यरूशलेम के निवासियों और यहूदा के घराने के लिए पिता बनेगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात जैविक पिता नहीं, बल्कि संरक्षणकारी और उत्तरदायी नेतृत्व करने वाला व्यक्ति।
    reason: ‘पिता’ के सीधे इब्रानी रूपक का अर्थ स्पष्ट करने के लिए, बिना उसे मुख्य पाठ में व्याख्यात्मक रूप से बदलने के।
lexical_decisions:
- source_word: וְהִלְבַּשְׁתִּיו
  choice: मैं उसे ... पहनाऊँगा
  rationale: לבש के हिफ़ील रूप और तृतीय पुरुष एकवचन प्रत्यय का अर्थ किसी को वस्त्र पहनाना है; हिन्दी में यह स्वाभाविक और प्रसंगानुकूल है।
- source_word: כֻּתָּנְתֶּךָ
  choice: तुम्हारा अंगरखा
  rationale: כֻּתֹּנֶת शरीर पर पहने जाने वाले लंबे वस्त्र को दर्शाता है। ‘अंगरखा’ आधुनिक हिन्दी पाठक के लिए समझने योग्य है और सामान्य ‘वस्त्र’ से अधिक ठोस है।
- source_word: וְאַבְנֵטְךָ
  choice: तुम्हारा कमरबन्द
  rationale: אַבְנֵט कमर पर बाँधे जाने वाले पट्टे या कमरबन्द को दर्शाता है, जो यहाँ पद-स्थापन के आधिकारिक परिधान का भाग है।
- source_word: אֲחַזְּקֶנּוּ
  choice: उसकी कमर पर कसूँगा
  rationale: חזק के पिएल रूप का मूल भाव दृढ़ करना है; कमरबन्द के साथ इसका प्रसंगगत अर्थ उसे मज़बूती से कसना है। ‘उसकी कमर पर’ हिन्दी में आवश्यक स्वाभाविकता देता है।
- source_word: וּמֶמְשֶׁלְתְּךָ
  choice: तुम्हारा अधिकार
  rationale: מֶמְשָׁלָה यहाँ शासन करने की पदगत सत्ता को दर्शाता है; ‘अधिकार’ प्रशासनिक उत्तरदायित्व और सत्ता दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶתֵּן בְּיָדוֹ
  choice: मैं उसके हाथ में सौंप दूँगा
  rationale: ‘हाथ में देना’ अधिकार और दायित्व सौंपने का ठोस इब्रानी मुहावरा है। ‘सौंप दूँगा’ हिन्दी में उसके न्यासात्मक भाव को स्पष्ट रखते हुए हाथ की छवि भी बचाता है।
- source_word: וְהָיָה לְאָב
  choice: वह ... पिता बनेगा
  rationale: निर्माण परिणामी स्थिति व्यक्त कर सकता है। ‘पिता बनेगा’ नियुक्ति से उत्पन्न नई भूमिका दिखाता और संरक्षणकारी नेतृत्व की सीधी रूपक-छवि बनाए रखता है।
- source_word: לְיוֹשֵׁב יְרוּשָׁלִַם
  choice: यरूशलेम के निवासियों के लिए
  rationale: एकवचन कृदन्त का प्रयोग यहाँ सामूहिक अर्थ में है; बहुवचन ‘निवासियों’ से हिन्दी में वह अर्थ स्पष्ट और स्वाभाविक होता है।
- source_word: וּלְבֵית יְהוּדָה
  choice: यहूदा के घराने के लिए
  rationale: ‘घराना’ בֵּית की पारिवारिक-सामुदायिक छवि बनाए रखते हुए यहाँ यहूदा के लोगों अथवा राज्य को सूचित करता है।
theological_decisions:
- issue: राजकीय अधिकारी के लिए ‘पिता’ का रूपक
  choice: मुख्य पाठ में सीधा रूपक ‘पिता बनेगा’ रखा गया है।
  alternative: ‘पिता के समान होगा’ या ‘संरक्षक बनेगा’
  rationale: इब्रानी לְאָב उपमा-सूचक शब्द के बिना सीधा रूपक है। इसे बनाए रखने से दयालु, उत्तरदायी और संरक्षणकारी नेतृत्व की छवि बचती है तथा बाद की किसी धर्मसैद्धान्तिक या कलीसियाई धारणा को पाठ में नहीं जोड़ा जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अंगरखा’, ‘कमरबन्द’, ‘अधिकार’ और ‘घराना’ ठोस मूल छवियों तथा आधिकारिक पद-स्थापन के प्रसंग को बनाए रखते हैं।
