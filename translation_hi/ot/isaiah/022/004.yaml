  yaml_path: translation/ot/isaiah/022/004.yaml
  text: Therefore I said[a], “Look away from me; let me weep bitterly[b]. Do not labor to comfort me over the destruction of the daughter of my people.”
translation:
  language: hi
  text: इसलिए मैंने कहा, “मुझसे दृष्टि फेर लो; मुझे फूट-फूटकर रोने दो। मेरी प्रजा की बेटी के विनाश पर मुझे सांत्वना देने का आग्रह मत करो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मेरी प्रजा की बेटी’ भविष्यद्वक्ताओं की काव्यात्मक अभिव्यक्ति है, जिसमें प्रजा को एक बेटी के रूप में चित्रित किया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: שְׁעוּ מִנִּי
  choice: मुझसे अपनी दृष्टि फेर लो
  rationale: आज्ञार्थक बहुवचन यहाँ शोक करने वाले को अकेला छोड़ने के लिए उससे दृष्टि फेरने का भाव देता है; यह दृश्यात्मक संकेत को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֲמָרֵר בַּבֶּכִי
  choice: मुझे फूट-फूटकर रोने दो
  rationale: शाब्दिक भाव ‘रोने में कड़वा होना’ है। हिन्दी मुहावरा ‘फूट-फूटकर रोना’ शोक की तीव्रता और निरंतरता को सहज रूप से व्यक्त करता है।
- source_word: אַל תָּאִיצוּ לְנַחֲמֵנִי
  choice: मुझे सांत्वना देने का हठ मत करो
  rationale: אוץ के हिफ़ील रूप में उतावली, दबाव या आग्रह का भाव हो सकता है। संदर्भ में वक्ता सांत्वना देने के लगातार आग्रह को रोकता है; ‘हठ मत करो’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שֹׁד
  choice: विनाश
  rationale: यह शब्द हिंसक उजाड़, तबाही या बरबादी का बोध देता है; ‘विनाश’ पर्याप्त व्यापक और प्रसंगानुकूल है।
- source_word: בַּת עַמִּי
  choice: मेरी प्रजा की बेटी
  rationale: मूल पाठ के काव्यात्मक मानवीकरण को बनाए रखा गया है; इसे सीधे ‘मेरी प्रजा’ या ‘यरूशलेम’ कहना मूल की अभिव्यक्ति को सपाट या अनावश्यक रूप से संकीर्ण कर देता।
theological_decisions:
- issue: בַּת עַמִּי को शाब्दिक काव्यात्मक रूप में रखना या सीधे प्रजा/यरूशलेम कहना
  choice: मुख्य पाठ में ‘मेरी प्रजा की बेटी’ बनाए रखना
  alternative: ‘मेरी प्रजा’ अथवा प्रसंगानुसार ‘बेटी सिय्योन/यरूशलेम’
  rationale: इब्रानी पाठ समुदाय का बेटी के रूप में मानवीकरण करता है। इसे सुरक्षित रखने से भविष्यद्वाणी की साहित्यिक और भावनात्मक शक्ति बनी रहती है तथा पद में स्पष्ट न किया गया भौगोलिक अभिज्ञान आरोपित नहीं होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी रखी गई है। ‘दृष्टि फेर लो’ मूल की दृश्यात्मकता बनाए रखता है; ‘फूट-फूटकर रोने दो’ तीव्र विलाप को स्वाभाविक हिन्दी में व्यक्त करता है। मुख्य पाठ में केवल [a] चिह्न रखा गया है और वही पादटिप्पणी सूची में उपस्थित है।
