source:
  edition: WLC
  text: וְ/נִגְלָ֥ה בְ/אָזְנָ֖/י יְהוָ֣ה צְבָא֑וֹת אִם יְ֠כֻפַּר הֶ/עָוֺ֨ן הַ/זֶּ֤ה לָ/כֶם֙ עַד תְּמֻת֔וּ/ן אָמַ֛ר אֲדֹנָ֥/י יְהוִ֖ה צְבָאֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/014.yaml
  text: 'And the LORD of Armies has revealed in my ears: “Surely this iniquity will not be atoned for you until you die,” says the Lord GOD of Armies.'
translation:
  language: hi
  text: 'और सेनाओं के यहोवा ने मेरे कानों में यह प्रकट किया: “निश्चय ही तुम्हारे इस अधर्म का प्रायश्चित तुम्हारे मरने तक नहीं होगा,” प्रभु, सेनाओं के यहोवा ने कहा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: दिव्य नाम को ‘यहोवा’ और צְבָאוֹת को उसके सैन्य/स्वर्गीय समूहों के व्यापक अर्थ सहित ‘सेनाओं’ के रूप में रखा गया है।
- source_word: וְנִגְלָה בְאָזְנַי
  choice: तब ... ने मेरे कानों में यह प्रकट किया
  rationale: शाब्दिक श्रवण-चित्र ‘मेरे कानों में’ को सुरक्षित रखा गया है; हिन्दी में कथानक-संबंध के लिए וְ को ‘तब’ कहा गया है।
- source_word: אִם יְכֻפַּר
  choice: निश्चय ही ... प्रायश्चित ... नहीं होगा
  rationale: शपथ-सूचक אִם का आशय दृढ़ निषेध है; कर्मवाच्य रूप और प्रायश्चित/दोष-निवारण का धार्मिक अर्थ बनाए रखा गया है।
- source_word: הֶעָוֹן הַזֶּה לָכֶם
  choice: तुम्हारे इस अधर्म का
  rationale: עָוֹן को ‘अधर्म’ और לָכֶם को दोष के समुदाय से संबंध के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: עַד תְּמֻתוּן
  choice: तुम्हारी मृत्यु तक
  rationale: मूल का बहुवचन संबोधन सामूहिक ‘तुम्हारी’ में बना रहता है; עַד की संभावित समय-सीमा को बिना अतिरिक्त व्याख्या के रखा गया है।
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: प्रभु, सेनाओं के यहोवा
  rationale: אֲדֹנָי और दिव्य नाम को अलग-अलग रखते हुए संयुक्त उपाधि की गंभीरता सुरक्षित की गई है।
theological_decisions:
- issue: ‘मृत्यु तक प्रायश्चित नहीं होगा’ का आशय
  choice: समय-सूचक मूल वाक्य को यथावत रखा गया
  alternative: ‘मरने पर भी कभी क्षमा नहीं होगी’
  rationale: עַד תְּמֻתוּן में कठोर अंतिमता निहित है, पर अनुवाद ने मृत्यु के बाद की स्थिति के बारे में मूल से अधिक स्पष्ट दावा नहीं जोड़ा।
- issue: כפר का अनुवाद
  choice: प्रायश्चित होना
  alternative: क्षमा किया जाना
  rationale: कर्मवाच्य כפר दोष के ढके/निवारित किए जाने का प्रायश्चित-संबंधी अर्थ देता है; केवल ‘क्षमा’ कहना इसकी बलिदानी-धार्मिक छाया को संकुचित कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और भविष्यवाणी-सुलभ रखी गई है। ‘मेरे कानों में’ मूल की सजीव अभिव्यक्ति को जानबूझकर सुरक्षित रखता है; दिव्य उपाधियाँ औपचारिक किंतु सामान्य हिन्दी पाठक के लिए स्पष्ट हैं।
