base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/008.yaml
  text: And he removed the covering of Judah[b][a], and on that day you looked to the weapons of the House of the Forest.
translation:
  language: hi
  text: उसने यहूदा का आवरण हटा दिया[a], और उस दिन तुमने वन-भवन[b] के हथियारों की ओर देखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदा की सुरक्षा/रक्षा।” इब्रानी में शाब्दिक रूप से “यहूदा का आवरण” है—यह उस वस्तु का रूपक है जो यहूदा को ढकती या सुरक्षित रखती थी।
    reason: lexical_alternative
  - marker: b
    text: “वन-भवन” संभवतः राजकीय शस्त्रागार या वह राजमहल था जिसे अन्य स्थानों पर “लबानोन का वन-भवन” कहा गया है।
    reason: cross_reference
lexical_decisions:
- source_word: וַיְגַל
  choice: उसने ... हटा दिया
  rationale: हिफ़ील रूप किसी वस्तु को हटाने या अनावृत करने का भाव देता है। ‘हटा दिया’ हिंदी में ‘आवरण’ के साथ स्वाभाविक है और इब्रानी के अनिर्दिष्ट पुल्लिंग एकवचन कर्ता को बनाए रखता है।
- source_word: מָסַךְ
  choice: आवरण
  rationale: मूल शब्द आवरण, परदा या आड़ को सूचित करता है। ‘आवरण’ यहूदा की सुरक्षा के ठोस रूपक को बचाए रखता है; व्याख्यात्मक अर्थ पादटिप्पणी में दिया गया है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: स्थान और प्रजा के नाम का प्रचलित हिंदी रूप।
- source_word: וַתַּבֵּט ... אֶל
  choice: तूने ... की ओर देखा
  rationale: क्रिया द्वितीय पुरुष पुल्लिंग एकवचन है और אֶל दिशा को दर्शाता है। ‘तूने’ यरूशलेम/यहूदा को मानवीकृत एकवचन संबोधन के रूप में सुरक्षित रखता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: भविष्यवाणी के समय-संदर्भ को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: נֶשֶׁק
  choice: हथियारों
  rationale: यह शब्द हथियारों या युद्ध-सामग्री को दर्शाता है; ‘हथियार’ आधुनिक हिंदी में स्पष्ट और व्यापक है।
- source_word: בֵּית הַיָּעַר
  choice: वन-भवन
  rationale: शाब्दिक अर्थ ‘वन का भवन’ है। ‘वन-भवन’ इसे एक विशिष्ट भवन के नाम की तरह संक्षिप्त और स्वाभाविक रूप में रखता है, बिना मुख्य पाठ में उसकी पहचान को निश्चित किए।
theological_decisions:
- issue: ‘यहूदा के आवरण’ का रूपक
  choice: मुख्य पाठ में ‘यहूदा का आवरण’ बनाए रखा गया।
  alternative: यहूदा की सुरक्षा / यहूदा की प्रतिरक्षा
  rationale: इब्रानी में ठोस और अर्थगर्भित रूपक है। उसे सीधे सैन्य प्रतिरक्षा बना देना अर्थ को समय से पहले सीमित कर देता; संभावित आशय पादटिप्पणी में स्पष्ट किया गया है।
- issue: द्वितीय पुरुष क्रिया का संबोधित पात्र
  choice: एकवचन ‘तूने’, जो यरूशलेम/यहूदा के मानवीकरण को दर्शाता है।
  alternative: बहुवचन ‘तुमने’ या निर्वैयक्तिक वाक्य
  rationale: इब्रानी क्रिया द्वितीय पुरुष पुल्लिंग एकवचन है। एकवचन संबोधन भविष्यवाणी की सीधी आलंकारिक शक्ति और मूल की व्याकरणिक विशेषता को सुरक्षित रखता है।
- issue: वन-भवन की पहचान
  choice: नाम को ‘वन-भवन’ के रूप में रखा और संभावित पहचान पादटिप्पणी में दी।
  alternative: मुख्य पाठ में ‘लबानोन का वन-भवन’ अथवा ‘राजकीय शस्त्रागार’
  rationale: इस पद में केवल ‘वन का भवन’ है। विस्तृत नाम या कार्य को मुख्य पाठ में जोड़ना स्रोत से अधिक निश्चितता उत्पन्न करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘तूने’ सामान्य बातचीत में अनौपचारिक लग सकता है, पर यहाँ यह इब्रानी के स्पष्ट एकवचन भविष्यद्वाणी-संबोधन और नगर के मानवीकरण को सुरक्षित रखने के लिए प्रयुक्त है। ‘वन-भवन’ को विशिष्ट भवन के नाम के रूप में योजक-चिह्न सहित रखा गया है।
