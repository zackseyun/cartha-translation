id: ISA.22.16
reference: Isaiah 22:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מַה לְּ/ךָ֥ פֹה֙ וּ/מִ֣י לְ/ךָ֣ פֹ֔ה כִּֽי חָצַ֧בְתָּ לְּ/ךָ֛ פֹּ֖ה קָ֑בֶר חֹצְבִ֤י מָרוֹם֙ קִבְר֔/וֹ חֹקְקִ֥י בַ/סֶּ֖לַע מִשְׁכָּ֥ן לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/016.yaml
  text: What do you have here[a], and whom do you have here, that you have cut out a tomb for yourself here, cutting out his tomb on the height, carving a dwelling for himself in the rock?
translation:
  language: hi
  text: यहाँ तुम्हारा क्या है, और यहाँ तुम्हारा कौन है, कि तुमने यहाँ अपने लिए एक कब्र काटकर बनाई है—ऊँचे स्थान पर उसकी कब्र काटते हुए और चट्टान में उसके लिए एक निवास तराशते हुए[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक सहज रूप में: “ऊँचे स्थान पर अपनी कब्र काटते हुए और चट्टान में अपने लिए एक निवास तराशते हुए।” इन खण्डों में इब्रानी पाठ दूसरे पुरुष से तीसरे पुरुष में बदल जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לְּךָ פֹה
  choice: यहाँ तुम्हारा क्या है
  rationale: यह संक्षिप्त, टकरावपूर्ण प्रश्न उस स्थान पर संबोधित व्यक्ति के दावे या सरोकार को चुनौती देता है। ‘तुम्हारा यहाँ क्या अधिकार है’ अर्थ को अधिक स्पष्ट करता, पर मूल से अधिक व्याख्यात्मक होता।
- source_word: וּמִי לְךָ פֹה
  choice: और यहाँ तुम्हारा कौन है
  rationale: यह समानांतर प्रश्न सम्भवतः पारिवारिक या सामाजिक सम्बन्धों के विषय में है। हिन्दी में यह मूल की संक्षिप्तता और व्यक्तिगत सम्बन्ध के भाव को बनाए रखता है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי प्रश्नों के बाद आरोप का आधार या आशय प्रस्तुत करता है। ‘कि’ हिन्दी में सम्बन्ध को स्वाभाविक रखते हुए उसे अनावश्यक रूप से कारणवाचक नहीं बनाता।
- source_word: חָצַבְתָּ לְּךָ פֹּה קָבֶר
  choice: तुमने यहाँ अपने लिए एक कब्र काटकर बनाई है
  rationale: חצב पत्थर काटने या तराशने की क्रिया है। ‘काटकर बनाई’ चट्टान में बनाई गई कब्र का बोध कराता है और केवल ‘खोद ली’ की अपेक्षा मूल बिम्ब के अधिक निकट है।
- source_word: מָרוֹם
  choice: ऊँचे स्थान पर
  rationale: यह संज्ञा ऊँचाई या ऊँचे स्थान को दर्शाती है। यह रूप आधुनिक हिन्दी में स्वाभाविक रहते हुए प्रतिष्ठित ऊँचे समाधि-स्थान का ठोस बिम्ब बनाए रखता है।
- source_word: קִבְרוֹ
  choice: उसकी कब्र
  rationale: मसोरेटिक पाठ के तीसरे पुरुष एकवचन प्रत्यय को जानबूझकर सुरक्षित रखा गया है, यद्यपि पहले सीधे ‘तुम’ कहकर सम्बोधित किया गया है।
- source_word: חֹקְקִי בַסֶּלַע
  choice: चट्टान में ... तराशते हुए
  rationale: חקק यहाँ चट्टान को काटकर या तराशकर स्थान बनाने का अर्थ देता है। ‘तराशते हुए’ समाधि-निर्माण के प्रसंग में स्वाभाविक और चित्रात्मक है।
- source_word: מִשְׁכָּן לוֹ
  choice: उसके लिए एक निवास
  rationale: מִשְׁכָּן का मूल अर्थ निवास-स्थान है। समाधि के प्रसंग में इसका विडम्बनापूर्ण स्थायी-निवास भाव बनाए रखा गया है; לוֹ के तीसरे पुरुष को ‘उसके लिए’ से स्पष्ट किया गया है।
theological_decisions:
- issue: वर्णनात्मक कृदन्त खण्डों में पुरुष-परिवर्तन
  choice: 'मुख्य पाठ में दूसरे पुरुष से तीसरे पुरुष की ओर बदलाव रखा गया है: ‘उसकी कब्र ... उसके लिए’।'
  alternative: ‘ऊँचे स्थान पर अपनी कब्र काटते हुए और चट्टान में अपने लिए एक निवास तराशते हुए।’
  rationale: मसोरेटिक पाठ सीधे दूसरे पुरुष में सम्बोधन के बाद इन प्रत्ययों में तीसरे पुरुष का प्रयोग करता है। इसे चुपचाप समरूप करने के बजाय मुख्य पाठ में सुरक्षित रखा गया है और अधिक सहज दूसरे-पुरुष रूप को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली अपनाई गई है। ‘तुम’ मूल के सीधे और तीखे सम्बोधन को व्यक्त करता है; ‘आप’ अनावश्यक सम्मान जोड़ता और ‘तू’ आधुनिक पाठकों के लिए अत्यधिक अपमानजनक लग सकता था। मूल में ‘यहाँ’ की पुनरावृत्ति और अन्तिम खण्डों का असामान्य पुरुष-परिवर्तन सुरक्षित रखा गया है।
