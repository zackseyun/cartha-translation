  register: भाषा आधुनिक, गरिमापूर्ण और सीधे भविष्यद्वाणी-संबोधन के अनुरूप रखी गई है। ‘वहीं’ की पुनरावृत्ति इब्रानी की वाक्पटुता बचाती है। अंतिम संबोधन को तीखे निन्दात्मक स्वर सहित, पर स्वाभाविक हिन्दी में प्रस्तुत किया गया है।
