  text: צָנ֤וֹף יִצְנָפְ/ךָ֙ צְנֵפָ֔ה כַּדּ֕וּר אֶל אֶ֖רֶץ רַחֲבַ֣ת יָדָ֑יִם שָׁ֣מָּ/ה תָמ֗וּת וְ/שָׁ֨מָּ/ה֙ מַרְכְּב֣וֹת כְּבוֹדֶ֔/ךָ קְל֖וֹן בֵּ֥ית אֲדֹנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/018.yaml
  text: He will surely wrap you up tightly[a], like a ball, into a broad land. There you will die, and there will be the chariots of your glory[c][b], O shame of your master's house.
translation:
  language: hi
  text: वह निश्चय ही तुम्हें कसकर लपेटेगा[a] और गेंद की तरह एक विशाल देश[b] में पहुँचा देगा। वहीं तुम मरोगे, और वहीं तुम्हारे गौरव के रथ[c] होंगे—हे अपने स्वामी के घर के कलंक!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘तुम्हें कसकर लपेटते हुए गोल कर देगा’ या ‘तुम्हें कसकर लपेटकर गोला बना देगा’ भी हो सकता है। इब्रानी में बल देने के लिए एक ही मूल से बने क्रिया-रूपों का साथ-साथ प्रयोग हुआ है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘हाथों की चौड़ाई वाला देश’ है; यह एक विस्तृत या विशाल देश के लिए प्रयुक्त मुहावरा है।
    reason: cultural_note
  - marker: c
    text: इसका अनुवाद ‘तुम्हारे वैभवशाली रथ’ या ‘वे रथ जो तुम्हारा गौरव थे’ भी हो सकता है। सम्भवतः आशय उन रथों से है जिन पर वह गर्व करता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: צָנוֹף יִצְנָפְךָ צְנֵפָה
  choice: निश्चय ही तुम्हें कसकर लपेटेगा
  rationale: एक ही मूल से बने क्रिया-रूपों का संयुक्त प्रयोग तीव्रता और बल देता है। ‘कसकर लपेटेगा’ बँधी हुई गठरी-जैसी छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כַּדּוּר
  choice: गेंद की तरह
  rationale: यह उपमा गोल, कसकर लपेटी हुई वस्तु की है; आधुनिक हिन्दी में ‘गेंद’ सबसे सहज और स्पष्ट है।
- source_word: אֶל אֶרֶץ רַחֲבַת יָדָיִם
  choice: एक विशाल देश में पहुँचा देगा
  rationale: शाब्दिक अभिव्यक्ति ‘हाथों में चौड़ा देश’ विशाल या खुला देश बताने वाला मुहावरा है। गंतव्य को स्वाभाविक हिन्दी में जोड़ने के लिए ‘पहुँचा देगा’ प्रयुक्त है; यह निर्वासन की दिशा को स्पष्ट करता है, पर अलग से ‘फेंकने’ की क्रिया नहीं जोड़ता।
- source_word: שָׁמָּה ... וְשָׁמָּה
  choice: वहीं ... और वहीं
  rationale: स्थानवाचक क्रियाविशेषण की पुनरावृत्ति मूल पाठ के बल और लय को बनाए रखती है।
- source_word: מַרְכְּבוֹת כְּבוֹדֶךָ
  choice: तुम्हारे गौरव के रथ
  rationale: यह निकट औपचारिक अनुवाद संक्षिप्त इब्रानी संबंध को खुला रखता है—ये वैभवशाली रथ भी हो सकते हैं या वे रथ जिन पर संबोधित व्यक्ति गर्व करता था।
- source_word: קְלוֹן בֵּית אֲדֹנֶיךָ
  choice: हे अपने स्वामी के घराने के कलंक
  rationale: इसे संबोधन के रूप में लिया गया है। यहाँ אֲדֹן मानवीय स्वामी या अधिकारी को सूचित करता है, इसलिए ‘स्वामी’ उपयुक्त है।
