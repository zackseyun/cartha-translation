translation:
  language: hi
  text: तुम्हारी सबसे अच्छी घाटियाँ रथों से भर गईं, और घुड़सवार फाटक पर डटकर तैनात हो गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבְחַר עֲמָקַיִךְ
  choice: तुम्हारी उत्तम घाटियाँ
  rationale: מִבְחַר चयनित, श्रेष्ठ या उत्तम वस्तु का बोध कराता है। संबंध-विन्यास में यह नगर को संबोधित करते हुए उसकी सबसे अच्छी घाटियों की ओर संकेत करता है; ‘उत्तम घाटियाँ’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: מָלְאוּ רָכֶב
  choice: रथों से भर गईं
  rationale: रָכֶב यहाँ सामूहिक अर्थ में रथ-सेना या रथों को दर्शाता है। हिन्दी में बहुवचन ‘रथों’ के साथ यह दृश्य स्पष्ट और सहज बनता है।
- source_word: הַפָּרָשִׁים
  choice: घुड़सवारों
  rationale: यह शब्द सवार सैनिकों को सूचित करता है। ‘घुड़सवार’ पारदर्शी, प्रचलित और सैन्य प्रसंग के अनुकूल है।
- source_word: שֹׁת שָׁתוּ
  choice: अपने मोर्चे जमा लिए
  rationale: क्रिया के infinitive absolute और finite verb का संयोजन क्रिया को बल देता है। फाटक के सैन्य प्रसंग में ‘अपने मोर्चे जमा लिए’ दृढ़ और सुनियोजित तैनाती का स्वाभाविक हिन्दी बोध देता है।
- source_word: הַשָּׁעְרָה
  choice: फाटक पर
  rationale: दिशासूचक ה गति की ओर संकेत कर सकता है, पर שׁית के साथ यहाँ फाटक के पास या उस पर सैन्य तैनाती संदर्भानुकूल है। ‘फाटक पर’ इस प्रसंग को स्पष्ट रखता है।
