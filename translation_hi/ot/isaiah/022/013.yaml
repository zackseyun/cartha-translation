base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/013.yaml
  text: 'And behold[a], joy and gladness, killing cattle and slaughtering sheep, eating meat and drinking wine: “Let us eat and drink, for tomorrow we die.”'
translation:
  language: hi
  text: 'और देखो—हर्ष और आनंद, गाय-बैलों को मारना और भेड़-बकरियों को काटना, मांस खाना और दाखमधु पीना: “आओ, खाएँ और पिएँ[a], क्योंकि कल हम मरेंगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “खाओ और पियो”; यह इब्रानी के संक्षिप्त, नारे-जैसे बल को बनाए रखता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो—
  rationale: वाव से प्रसंग की निरंतरता और הִנֵּה का ध्यान खींचने वाला, दृश्यात्मक बल दोनों बने रहते हैं; आधुनिक हिन्दी में ‘देखो’ स्वाभाविक है।
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: हर्ष और आनन्द
  rationale: दोनों निकटार्थी शब्दों की उत्सवी तीव्रता और काव्यात्मक समानांतरता को अलग-अलग किन्तु सहज हिन्दी शब्दों में रखा गया है।
- source_word: הָרֹג בָּקָר
  choice: बैलों को मारना
  rationale: בָּקָר गोवंश के लिए व्यापक है, पर भोज के लिए काटे जा रहे पशुओं के इस दृश्य में ‘बैल’ स्पष्ट और स्वाभाविक है; ‘बलि चढ़ाना’ कहकर अनुष्ठान का भाव नहीं जोड़ा गया।
- source_word: וְשָׁחֹט צֹאן
  choice: और भेड़-बकरियों को काटना
  rationale: צֹאן छोटे पालतू पशुओं के झुंड, विशेषतः भेड़ और बकरियों, को समेटता है; युग्म इसे हिन्दी में स्पष्ट रखता है।
- source_word: אָכֹל בָּשָׂר וְשָׁתוֹת יָיִן
  choice: मांस खाना और दाखमधु पीना
  rationale: भोजन-संदर्भ में בָּשָׂר के लिए ‘मांस’ और יַיִן के लिए गरिमापूर्ण, परिचित बाइबिलीय हिन्दी ‘दाखमधु’ उपयुक्त है।
- source_word: אָכוֹל וְשָׁתוֹ
  choice: आओ, खाएँ और पिएँ
  rationale: रूपतः infinitive absolute होते हुए भी यहाँ ये सामूहिक नारे या उकसावे की तरह प्रयुक्त हैं; प्रथम पुरुष बहुवचन נָמוּת के साथ यह हिन्दी में स्वाभाविक है।
- source_word: כִּי מָחָר נָמוּת
  choice: क्योंकि कल तो हम मर ही जाएँगे
  rationale: भविष्यगत आशय स्पष्ट है; ‘तो…ही’ उस भाग्यवादपूर्ण, नारे-जैसे जोर को व्यक्त करता है, बिना अतिरिक्त नैतिक टिप्पणी जोड़े।
theological_decisions:
- issue: उत्सव और भोग-विलास का नैतिक मूल्यांकन अनुवाद में स्पष्ट रूप से जोड़ना या नहीं
  choice: क्रियाओं को वर्णनात्मक रूप में रखना, बिना ‘पापपूर्ण’ अथवा ‘दुष्ट’ जैसे विशेषण जोड़े
  alternative: इसे ‘पापपूर्ण मौज-मस्ती’ या ‘भोग-विलास’ कहकर स्पष्ट निंदा जोड़ना
  rationale: इब्रानी पद दृश्य को सीधे प्रस्तुत करता है; उसकी भविष्यद्वाणीगत निंदा आसपास के प्रसंग से आती है। अनुवाद को पद से अधिक नहीं कहना चाहिए।
- issue: אָכוֹל וְשָׁתוֹ को आज्ञा या सामूहिक आह्वान के रूप में प्रस्तुत करना
  choice: मुख्य पाठ में सामूहिक आह्वान ‘आओ, खाएँ और पिएँ’
  alternative: अधिक शाब्दिक आज्ञार्थ ‘खाओ और पियो’
  rationale: इसके बाद प्रथम पुरुष बहुवचन ‘हम मर…’ आता है, इसलिए सामूहिक आह्वान प्रसंगगत बल को सहज हिन्दी में व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘और देखो—’ दृश्य को अचानक सामने लाता है; सूची की लय मूल की उत्सवी गतिविधियों की श्रृंखला को सुरक्षित रखती है।
