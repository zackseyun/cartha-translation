  text: וַ/יִּקְרָ֗א אֲדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת בַּ/יּ֣וֹם הַ/ה֑וּא לִ/בְכִי֙ וּ/לְ/מִסְפֵּ֔ד וּ/לְ/קָרְחָ֖ה וְ/לַ/חֲגֹ֥ר שָֽׂק׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/012.yaml
  text: In that day the Lord GOD of hosts called for weeping[a], for mourning, for baldness, and for putting on sackcloth.
translation:
  language: hi
  text: उस दिन प्रभु याहवे, सेनाओं के स्वामी, ने रोने, विलाप करने, सिर मुँडाने[a] और टाट पहनने का आह्वान किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘गंजापन’ है; इसका अर्थ ‘सिर मुंडवाना’ या ‘अपने को गंजा बनाना’ भी हो सकता है। यह शोक मनाने की एक प्रथा थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: आह्वान किया
  rationale: यहाँ קרא केवल पुकारने के बजाय शोक के निश्चित कार्यों के लिए बुलाने या माँग करने का भाव रखता है; ‘आह्वान किया’ इसे स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: प्रभु याहवे, सेनाओं के स्वामी
  rationale: ‘प्रभु’ אֲדֹנָי को, ‘याहवे’ परमेश्वर के व्यक्तिगत नाम יהוה को, और ‘सेनाओं के स्वामी’ צְבָאוֹת से जुड़े सार्वभौम सैन्य अधिकार को व्यक्त करता है। अल्पविराम हिन्दी में संयुक्त उपाधि को स्पष्ट बनाते हैं।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यवाणी-साहित्य के प्रचलित काल-सूचक सूत्र का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: לִבְכִי
  choice: रोने
  rationale: בכי दुःख में रोने को दर्शाता है; हिन्दी की समन्वित क्रिया-श्रृंखला में ‘रोने’ स्वाभाविक है।
- source_word: וּלְמִסְפֵּד
  choice: विलाप करने
  rationale: מִסְפֵּד शोक की मुखर अथवा सार्वजनिक अभिव्यक्ति है; ‘विलाप करने’ इसे सामान्य ‘रोने’ से अलग बनाए रखता है।
- source_word: וּלְקָרְחָה
  choice: सिर मुँडाने
  rationale: קָרְחָה का शाब्दिक परिणाम गंजापन है, पर प्रसंग में यह शोक-रीति के रूप में अपने सिर को गंजा करने का संकेत देता है। ‘सिर मुँडाने’ आधुनिक पाठक के लिए उस क्रिया को स्पष्ट करता है, और पादटिप्पणी शाब्दिक संभावना सुरक्षित रखती है।
- source_word: וְלַחֲגֹר שָׂק
  choice: टाट पहनने
  rationale: חגר का अर्थ अपने चारों ओर बाँधना या पहनना है और שָׂק शोक में पहना जाने वाला खुरदरा वस्त्र है; ‘टाट पहनने’ हिन्दी बाइबलीय प्रयोग में संक्षिप्त और बोधगम्य है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה में יהוה का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर / प्रभु यहोवा
  rationale: मूल पाठ में वाचा-संबंधी व्यक्तिगत नाम יהוה उपस्थित है। ‘याहवे’ उस नाम को उपाधि में विलीन किए बिना सुरक्षित रखता है, जबकि אֲדֹנָי को अलग से ‘प्रभु’ कहा गया है।
- issue: צְבָאוֹת के दायरे का अनुवाद
  choice: सेनाओं के स्वामी
  alternative: स्वर्गीय सेनाओं के स्वामी
  rationale: मूल शब्द सेनाओं या दलों का बोध देता है, पर केवल स्वर्गीय सेनाओं तक दायरा सीमित नहीं करता। इसलिए हिन्दी पाठ भी उस व्यापकता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘विलाप’ और ‘टाट’ जैसे परिचित बाइबलीय शब्द सांस्कृतिक शोक-परिप्रेक्ष्य को बनाए रखते हैं।
