source:
  edition: WLC
  text: כִּ֣י יוֹם֩ מְהוּמָ֨ה וּ/מְבוּסָ֜ה וּ/מְבוּכָ֗ה לַֽ/אדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת בְּ/גֵ֣יא חִזָּי֑וֹן מְקַרְקַ֥ר קִ֖ר וְ/שׁ֥וֹעַ אֶל הָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/005.yaml
  text: For it is a day of tumult and trampling and confusion from the Lord GOD of Armies in the Valley of Vision[c][b][a], a battering down of the wall and a cry to the mountain.
translation:
  language: hi
  text: क्योंकि दर्शन की घाटी में सेनाओं के स्वामी याहवे की ओर से[a] खलबली, रौंदे जाने और भ्रम का दिन है—दीवार तोड़ी जा रही है[b], और पर्वत की ओर पुकार उठ रही है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सेनाओं के स्वामी याहवे के लिए खलबली, रौंदे जाने और भ्रम का दिन है,” अथवा “सेनाओं के स्वामी याहवे का दिन है।” इब्रानी संबंधबोधक उपसर्ग स्रोत के साथ-साथ संबंध या अधिकार भी व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी क्रिया-रूप कठिन है; इसका अनुवाद “दीवार ढहाई जा रही है” या “दीवार गिराई जा रही है” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “और पर्वत की ओर चिल्लाहट हो रही है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מְהוּמָה
  choice: खलबली
  rationale: यह शब्द शोर, अव्यवस्था और सामूहिक उथल-पुथल का भाव रखता है; ‘खलबली’ साधारण पाठक के लिए स्पष्ट और प्रसंगानुकूल है।
- source_word: מְבוּסָה
  choice: रौंदे जाने
  rationale: मूल धातु के कुचले या पैरों तले रौंदे जाने के सजीव चित्र को बनाए रखता है।
- source_word: מְבוּכָה
  choice: घबराहट
  rationale: विनाश के बीच व्याकुल और दिशाहीन अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसका अर्थ अत्यधिक निश्चित किए।
- source_word: לַאדֹנָי יְהוִה צְבָאוֹת
  choice: सेनाओं के स्वामी यहोवा की ओर से
  rationale: ל को यहाँ न्याय के स्रोत या कर्ता के रूप में समझा गया है, पर उसकी संबंध अथवा अधिकार सूचक संभावना को पादटिप्पणी में सुरक्षित रखा गया है। אֲדֹנָי को ‘स्वामी’, יהוה को ‘यहोवा’ और צְבָאוֹת को अर्थानुसार ‘सेनाओं के’ किया गया है।
- source_word: בְּגֵיא חִזָּיוֹן
  choice: दर्शन की घाटी में
  rationale: स्थान-सूचक पद का निकट, अर्थपूर्ण अनुवाद है; ‘दर्शन की घाटी’ इस भविष्यवाणी में शीर्षक-सदृश स्थाननाम है।
- source_word: מְקַרְקַר קִיר
  choice: दीवार ढहाई जा रही है
  rationale: क्रिया-रूप कठिन है, किंतु प्रसंग में दीवार के विनाश का संकेत स्पष्ट है। हिन्दी में यह वाक्यांश उस चल रही विध्वंसक कार्रवाई को सहज रूप देता है।
- source_word: וְשׁוֹעַ אֶל הָהָר
  choice: और पर्वत की ओर पुकार उठ रही है
  rationale: שׁוֹעַ को ‘पुकार’ और אֶל को दिशासूचक ‘की ओर’ रखा गया है; वाक्यांश की चित्रात्मकता और अस्पष्टता दोनों बनी रहती हैं।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में वाचा का विशिष्ट नाम יהוה है। हिन्दी बाइबल परंपरा में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है, जबकि אֲדֹנָי का अलग अर्थ ‘स्वामी’ दिया गया है ताकि दोनों पद एक में न मिलें।
- issue: לַאדֹנָי का संबंध
  choice: स्वामी यहोवा की ओर से
  alternative: स्वामी यहोवा के लिए; स्वामी यहोवा का
  rationale: न्याय के प्रसंग में स्रोत/कर्ता का अर्थ उपयुक्त है, पर इब्रानी ל संबंध, अधिकार या उद्देश्य भी बता सकता है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। विपत्ति के तीन पदों में लयात्मक क्रम बनाए रखा गया है। कठिन इब्रानी क्रिया और ל उपसर्ग की वास्तविक अस्पष्टता को मुख्य पाठ में एक स्वाभाविक पाठ देकर तथा पादटिप्पणियों में विकल्प रखकर सुरक्षित किया गया है।
