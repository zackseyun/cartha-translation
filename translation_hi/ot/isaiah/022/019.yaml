base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/019.yaml
  text: And I will thrust you from your office[a], and he will pull you down from your station.
translation:
  language: hi
  text: मैं तुझे तेरे पद से धकेलकर हटा दूँगा, और वह[a] तुझे तेरी स्थिति से गिरा देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में पहले ‘मैं तुझे ... हटा दूँगा’ कहा गया है, फिर कर्ता बदलकर ‘वह तुझे ... गिरा देगा’ हो जाता है। कुछ अनुवाद दूसरे खंड को ‘मैं तुझे गिरा दूँगा’ कर देते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲדַפְתִּיךָ
  choice: मैं तुझे ... धकेलकर निकाल दूँगा
  rationale: הדף बलपूर्वक धकेलने या हटा देने का भाव देता है। यह हिन्दी प्रयोग बलपूर्वक पदच्युति और मूल भौतिक रूपक—दोनों को स्वाभाविक ढंग से बनाए रखता है। भविष्यसूचक कथन में रूप का भाव भविष्यकालीन है।
- source_word: מִמַּצָּבֶךָ
  choice: तेरे पद से
  rationale: מַצָּב खड़े होने की जगह, नियुक्त स्थान या आधिकारिक पद को सूचित कर सकता है। शेबना के अधिकार से हटाए जाने के प्रसंग में ‘पद’ संक्षिप्त और स्वाभाविक है।
- source_word: וּמִמַּעֲמָדְךָ
  choice: तेरे स्थान से
  rationale: מַעֲמָד का अर्थ खड़े होने का स्थान, प्रतिष्ठित स्थिति या सेवा का स्थान हो सकता है। ‘स्थान’ पहले खंड के ‘पद’ के साथ समानांतरता रखते हुए अनावश्यक पुनरावृत्ति से बचता है।
- source_word: יֶהֶרְסֶךָ
  choice: वह तुझे ... गिरा देगा
  rationale: הרס का मूल भाव ढहा देना या गिरा देना है। व्यक्ति के संदर्भ में यह उसकी स्थापित स्थिति से पतन को व्यक्त करता है। तीसरे पुरुष एकवचन ‘वह’ को मूल पाठ के अनुसार बनाए रखा गया है।
theological_decisions:
- issue: दूसरे खंड में कर्ता का परिवर्तन
  choice: पहले पुरुष ‘मैं ... निकाल दूँगा’ से तीसरे पुरुष ‘वह ... गिरा देगा’ का परिवर्तन बनाए रखा गया।
  alternative: 'दोनों खंडों को पहले पुरुष में समतल करना: ‘मैं ... निकाल दूँगा, और मैं ... गिरा दूँगा’; अथवा कर्मवाच्य: ‘तू ... गिरा दिया जाएगा।’'
  rationale: मसोरा पाठ में पुरुष का स्पष्ट और उल्लेखनीय परिवर्तन है। ‘वह’ किसे सूचित करता है, पाठ स्वयं इसे निश्चित नहीं करता; इसलिए अनुवाद इस अस्पष्टता और धार्मिक तनाव को हल किए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण पर सामान्य पाठक के लिए सहज है। ‘धकेलकर निकाल दूँगा’ बलपूर्वक हटाने का रूपक बचाता है, जबकि ‘पद’ और ‘स्थान’ निकटवर्ती इब्रानी समानार्थी शब्दों का अंतर स्वाभाविक हिन्दी में रखते हैं।
