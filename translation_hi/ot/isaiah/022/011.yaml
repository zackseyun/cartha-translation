source:
  edition: WLC
  text: וּ/מִקְוָ֣ה עֲשִׂיתֶ֗ם בֵּ֚ין הַ/חֹ֣מֹתַ֔יִם לְ/מֵ֖י הַ/בְּרֵכָ֣ה הַ/יְשָׁנָ֑ה וְ/לֹ֤א הִבַּטְתֶּם֙ אֶל עֹשֶׂ֔י/הָ וְ/יֹצְרָ֥/הּ מֵֽ/רָח֖וֹק לֹ֥א רְאִיתֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/011.yaml
  text: You made a reservoir between the two walls for the waters of the old pool[a], but you did not look to the one who made it, nor did you see the one who formed it long ago.
translation:
  language: hi
  text: तुमने दोनों दीवारों के बीच पुराने तालाब के पानी के लिए एक जलाशय बनाया; पर जिसने उसे बनाया, उसकी ओर तुमने दृष्टि नहीं की, और जिसने उसे बहुत पहले रचा था, उसे तुमने नहीं देखा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दूर से।” इब्रानी पदबंध स्थानगत दूरी बता सकता है, पर यहाँ संभवतः इसका अर्थ “बहुत पहले” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְוָה
  choice: जलाशय
  rationale: यहाँ शब्द किलेबंदी से जुड़े पानी को इकट्ठा करने के लिए बनाए गए स्थान को दर्शाता है; ‘जलाशय’ इस अभियांत्रिक संरचना का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: בֵּין הַחֹמֹתַיִם
  choice: दोनों दीवारों के बीच
  rationale: इब्रानी द्विवचन स्पष्ट रूप से दो दीवारों की ओर संकेत करता है; ‘दोनों’ उस विशेषता को बनाए रखता है।
- source_word: לְמֵי הַבְּרֵכָה הַיְשָׁנָה
  choice: पुराने कुंड के पानी के लिए
  rationale: ‘कुंड’ पहले से मौजूद जल-स्रोत को ‘जलाशय’ से अलग रखता है, और एकवचन भाव वाला ‘पानी’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הִבַּטְתֶּם אֶל
  choice: की ओर दृष्टि नहीं की
  rationale: यह केवल शारीरिक रूप से देखने के बजाय ध्यान और भरोसा उसकी ओर लगाने का भाव रखता है, साथ ही अगले ‘देखा’ के साथ दृश्यात्मक समानांतरता बनाए रखता है।
- source_word: עֹשֶׂיהָ
  choice: जिसने उसे बनाया
  rationale: यह रूप कर्ता और स्त्रीलिंग प्रत्यय दोनों को बिना किसी निश्चित पूर्वपद को थोपे व्यक्त करता है।
- source_word: יֹצְרָהּ
  choice: जिसने ... उसे रचा था
  rationale: ‘रचा’ उद्देश्यपूर्ण ढंग से आकार देने के भाव को व्यक्त करता है और भविष्यद्वाणी की गरिमामय शैली के अनुकूल है।
- source_word: מֵרָחוֹק
  choice: बहुत पहले
  rationale: इस प्रसंग में कालगत दूरी—बहुत पहले से की गई रचना या योजना—अधिक उपयुक्त है, यद्यपि स्थानगत अर्थ भी संभव है।
- source_word: לֹא רְאִיתֶם
  choice: न उसे देखा
  rationale: ‘देखा’ मूल दृश्यात्मक क्रिया और ‘दृष्टि नहीं की’ के साथ उसका समानांतर संबंध बनाए रखता है।
theological_decisions:
- issue: ‘जिसने उसे बनाया’ और ‘जिसने उसे रचा’ का कर्ता तथा ‘उसे’ का संदर्भ
  choice: कर्ता को परमेश्वर समझते हुए भी अनुवाद में उसका नाम नहीं जोड़ा गया और ‘उसे’ का संदर्भ खुला रखा गया।
  alternative: कर्ता को स्पष्टतः ‘परमेश्वर’ कहना, या ‘उसे’ को विशेष रूप से नगर, कुंड अथवा जल-व्यवस्था से जोड़ना।
  rationale: प्रसंग यहूदा को अपनी सुरक्षा-व्यवस्थाओं पर भरोसा करके प्रभु की सार्वभौमिक भूमिका की उपेक्षा करने के लिए डाँटता है। फिर भी इब्रानी स्त्रीलिंग प्रत्यय का सटीक पूर्वपद संक्षिप्त और कुछ हद तक अस्पष्ट है; हिन्दी उसी तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमामय और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। ‘तुम’ मूल के बहुवचन संबोधन का सीधा रूप है; वाक्य की दृश्यात्मक समानांतरता और संदर्भगत अस्पष्टता सुरक्षित रखी गई है।
