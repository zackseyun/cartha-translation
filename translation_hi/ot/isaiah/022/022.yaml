source:
  edition: WLC
  text: וְ/נָתַתִּ֛י מַפְתֵּ֥חַ בֵּית דָּוִ֖ד עַל שִׁכְמ֑/וֹ וּ/פָתַח֙ וְ/אֵ֣ין סֹגֵ֔ר וְ/סָגַ֖ר וְ/אֵ֥ין פֹּתֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/022.yaml
  text: And I will place the key of the house of David on his shoulder; he will open[a], and no one will shut; he will shut, and no one will open.
translation:
  language: hi
  text: और मैं दाऊद के घराने की कुंजी उसके कंधे पर रखूँगा; वह खोलेगा[a], और कोई बन्द न करेगा; वह बन्द करेगा, और कोई न खोलेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: खोलने और बन्द करने का यह बिंब ऐसे अधिकार को दर्शाता है जिसे कोई चुनौती देकर उलट नहीं सकता; इसकी प्रतिध्वनि प्रकाशितवाक्य 3:7 में मिलती है।
    reason: cross_reference
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: और मैं ... रखूँगा
  rationale: נתן का अर्थ देना, रखना या स्थापित करना हो सकता है। कंधे पर कुंजी रखे जाने के ठोस बिंब में ‘रखूँगा’ स्वाभाविक और सटीक है।
- source_word: מַפְתֵּחַ
  choice: कुंजी
  rationale: यह शब्द ‘चाबी/कुंजी’ का द्योतक है। यहाँ शासन और अधिकार के प्रतीक के लिए गरिमापूर्ण ‘कुंजी’ चुना गया है।
- source_word: בֵּית דָּוִד
  choice: दाऊद का घराना
  rationale: בַּיִת यहाँ केवल भवन नहीं, बल्कि दाऊद के वंशीय-राजकीय घराने को सूचित करता है; ‘घराना’ आधुनिक हिन्दी में इस अर्थ को स्पष्ट रखता है।
- source_word: עַל שִׁכְמוֹ
  choice: उसके कंधे पर
  rationale: यह इब्रानी पद का सीधा अर्थ है और पदाधिकार के प्रतीक को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: וּפָתַח
  choice: वह खोलेगा
  rationale: यह प्रतिज्ञा के भावी परिणाम को आगे बढ़ाता है और अधिकार के प्रभावी प्रयोग को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְאֵין סֹגֵר
  choice: और कोई बन्द न करेगा
  rationale: निर्माण का आशय है कि उसके खोले हुए को बन्द करने वाला कोई नहीं होगा; निषेधात्मक भविष्य हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: וְסָגַר
  choice: वह बन्द करेगा
  rationale: ‘वह खोलेगा’ के समानान्तर संरचना इब्रानी की लय और संतुलन बनाए रखती है।
- source_word: וְאֵין פֹּתֵחַ
  choice: और कोई न खोलेगा
  rationale: यह पहले निषेधात्मक खंड का समानान्तर है और बताता है कि उसके निर्णय को कोई उलट नहीं सकेगा।
theological_decisions:
- issue: क्या मसीही या नये नियम की प्रतिध्वनि को मुख्य पाठ में स्पष्ट किया जाए
  choice: मुख्य पाठ को यशायाह के तात्कालिक ऐतिहासिक-साहित्यिक संदर्भ में रखा गया है।
  alternative: प्रकाशितवाक्य 3:7 के प्रयोग को सामने लाने वाली मसीही व्याख्या मुख्य पाठ में जोड़ना।
  rationale: यहाँ सीधे तौर पर दाऊद के घराने से सम्बद्ध सौंपे गए अधिकार का वर्णन है। बाद की शास्त्रीय प्रतिध्वनि महत्त्वपूर्ण है, पर उसे मुख्य पाठ में आरोपित करने के बजाय पादटिप्पणी में रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और संतुलित वाक्य-विन्यास अपनाया गया है। ‘घर’ के बजाय ‘घराना’ वंशीय-राजकीय अर्थ स्पष्ट करता है; ‘कुंजी’ अधिकार के प्रतीक के लिए उपयुक्त औपचारिक शब्द है।
