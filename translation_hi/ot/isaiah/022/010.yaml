id: ISA.22.10
reference: Isaiah 22:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֶת בָּתֵּ֥י יְרוּשָׁלִַ֖ם סְפַרְתֶּ֑ם וַ/תִּתְֿצוּ֙ הַ/בָּ֣תִּ֔ים לְ/בַצֵּ֖ר הַ/חוֹמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/010.yaml
  text: And you counted the houses of Jerusalem[b][a], and you tore down the houses to fortify the wall.
translation:
  language: hi
  text: और तुमने यरूशलेम के घरों को गिना[a], और दीवार को मज़बूत करने के लिए उन घरों को ढा दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरूशलेम के घरों की गिनती की।”
    reason: lexical_alternative
  - marker: b
    text: या, “उन घरों को गिरा दिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: और
  rationale: संयोजक וְ को स्वाभाविक रूप से ‘और’ कहा गया है; אֵת यहाँ आगे रखे गए कर्म को चिह्नित करता है और हिन्दी में उसका अलग अनुवाद आवश्यक नहीं है।
- source_word: בָּתֵּי יְרוּשָׁלִַם
  choice: यरूशलेम के घरों
  rationale: यह संबंधवाचक पदबंध यरूशलेम नगर के घरों को दर्शाता है; हिन्दी में ‘यरूशलेम के घर’ सीधा और स्वाभाविक है।
- source_word: סְפַרְתֶּם
  choice: तुमने ... गिना
  rationale: क़ाल रूप का मूल अर्थ ‘गिनना’ है। ‘जायज़ा लिया’ जैसी व्याख्यात्मक अभिव्यक्ति के बजाय प्रत्यक्ष अर्थ रखा गया है।
- source_word: וַ/תִּתְֿצוּ
  choice: और ... ढा दिया
  rationale: נתץ किसी निर्माण को गिराने या ढहा देने का बोध देता है; ‘ढा दिया’ घरों को जानबूझकर गिराने की कार्रवाई को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַ/בָּתִּים
  choice: उन घरों को
  rationale: निश्चित उपपद और पहले बताए गए घरों की पुनरावृत्ति को हिन्दी में ‘उन घरों’ से स्पष्ट किया गया है, जिससे वही घर अभिप्रेत रहते हैं जिन्हें गिना गया था।
- source_word: לְ/בַצֵּר
  choice: मज़बूत करने के लिए
  rationale: בצר यहाँ सुरक्षा के लिए दीवार को सुदृढ़ करने का अर्थ देता है। ‘मज़बूत करना’ सामान्य आधुनिक हिन्दी में उद्देश्य को स्पष्ट रखता है।
- source_word: הַ/חוֹמָה
  choice: दीवार
  rationale: חוֹמָה नगर की रक्षात्मक दीवार को दर्शाता है। मुख्य पाठ में मूल की तरह संक्षिप्त ‘दीवार’ रखा गया है; प्रसंग से नगर की दीवार स्पष्ट है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दूसरे उल्लेख में ‘उन घरों’ का प्रयोग हिन्दी में संदर्भ स्पष्ट करता है, जबकि इब्रानी की पुनरावृत्ति का आशय सुरक्षित रहता है।
