review_pass:
  verdict: revise
  source_fidelity: The heading and the rhetorical question are substantially faithful. However, ‘तू पूरी की पूरी छतों पर चढ़ गई है’ makes the personified city itself, in its entirety, climb onto roofs. The Hebrew feminine singular addresses the city, but כֻּלָּךְ conveys its inhabitants collectively; Hindi can represent this sense more clearly by retaining the singular address and referring to its people.
  naturalness: ‘तुझे अब क्या हुआ है कि तेरे सब लोग छतों पर चढ़ गए हैं?’ is idiomatic modern Hindi and avoids the awkward and semantically misleading image of an entire city climbing onto rooftops.
  terminology: ‘भविष्यवाणी’ is an acceptable modern-Hindi rendering of מַשָּׂא in this prophetic superscription. ‘दर्शन की घाटी’ appropriately preserves the untranslated poetic designation. The footnote cautiously identifies the likely referent without placing that interpretation in the text.
  issues:
  - severity: medium
    issue: The phrase ‘तू पूरी की पूरी छतों पर चढ़ गई है’ does not clearly convey the collective inhabitants intended by כֻּלָּךְ.
    rationale: While the Hebrew uses feminine singular grammar for the city personified, its sense is that all the city's people have gone up to the roofs. The draft's wording instead suggests that the city as a physical whole has climbed up, which is unnatural and obscures the collective meaning.
  revised_text: 'दर्शन की घाटी के विषय में भविष्यवाणी: तुझे अब क्या हुआ है[a] कि तेरे सब लोग छतों पर चढ़ गए हैं?'
