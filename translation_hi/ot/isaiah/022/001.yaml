source:
  edition: WLC
  text: מַשָּׂ֖א גֵּ֣יא חִזָּי֑וֹן מַה לָּ֣/ךְ אֵפ֔וֹא כִּֽי עָלִ֥ית כֻּלָּ֖/ךְ לַ/גַּגּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/001.yaml
  text: 'An oracle concerning the Valley of Vision: What is the matter with you now[a], that all of you have gone up to the rooftops?'
translation:
  language: hi
  text: 'दर्शन की घाटी के विषय में भविष्यवाणी: तुझे अब क्या हुआ है[a] कि तेरे सब लोग छतों पर चढ़ गए हैं?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दर्शन की घाटी’ सम्भवतः यरूशलेम के लिए प्रयुक्त एक काव्यात्मक नाम है, यद्यपि यह पद स्वयं उसकी स्पष्ट पहचान नहीं करता।
    reason: cross_reference
lexical_decisions:
- source_word: מַשָּׂא
  choice: भविष्यवाणी
  rationale: भविष्यद्वाणी-संबंधी शीर्षकों में यह शब्द परमेश्वर की ओर से घोषित संदेश या वाणी को सूचित करता है। आधुनिक हिन्दी में ‘भविष्यवाणी’ स्वाभाविक और समझने योग्य है; ‘बोझ’ यहाँ भ्रामक हो सकता है।
- source_word: גֵּיא חִזָּיוֹן
  choice: दर्शन की घाटी
  rationale: इब्रानी संबंधवाचक पदबंध का सीधा रूप रखा गया है। इसे मुख्य पाठ में यरूशलेम के रूप में स्पष्ट नहीं किया गया, क्योंकि इस पद में वह पहचान प्रत्यक्ष नहीं है।
- source_word: מַה לָּךְ אֵפוֹא
  choice: अब तुझे क्या हुआ है
  rationale: यह मुहावरा किसी असामान्य स्थिति पर प्रश्न करता है। ‘अब’ אֵפוֹא के तात्कालिक और आलंकारिक बल को व्यक्त करता है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ यह प्रश्न की विषय-वस्तु या कारणस्वरूप दिखाई देने वाली स्थिति का परिचय देता है।
- source_word: עָלִית כֻּלָּךְ
  choice: तू पूरी की पूरी ... चढ़ गई है
  rationale: क्रिया और प्रत्यय स्त्रीलिंग एकवचन हैं और सम्भवतः नगर को व्यक्तिरूप में संबोधित करते हैं, जबकि כֻּלָּךְ उसके सभी निवासियों को सामूहिक रूप से समेटता है। हिन्दी का यह रूप उस व्याकरणिक व्यक्तिरूपण और सामूहिक अर्थ दोनों को बनाए रखता है।
- source_word: לַגַּגּוֹת
  choice: छतों पर
  rationale: यह घरों की समतल, उपयोग में आने वाली छतों को दर्शाता है। हिन्दी में चढ़ने के गंतव्य के साथ ‘पर’ स्वाभाविक है।
theological_decisions:
- issue: ‘दर्शन की घाटी’ का संदर्भ
  choice: मुख्य पाठ में पदबंध का शाब्दिक शीर्षक बनाए रखा गया
  alternative: इसे सीधे ‘यरूशलेम’ कहना, अथवा यरूशलेम से जुड़ी किसी विशिष्ट घाटी के रूप में पहचानना
  rationale: संदर्भ से यरूशलेम की पहचान सम्भावित है, पर इस पद का इब्रानी पाठ उसे स्पष्ट रूप से नामित नहीं करता। इसलिए पहचान को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्त्रीलिंग एकवचन ‘तू’ और ‘चढ़ गई’ से नगर का व्यक्तिरूपण सुरक्षित है; ‘पूरी की पूरी’ उसके निवासियों की सामूहिकता व्यक्त करता है।
