source:
  edition: WLC
  text: הִנֵּ֤ה יְהוָה֙ מְטַלְטֶלְ/ךָ֔ טַלְטֵלָ֖ה גָּ֑בֶר וְ/עֹטְ/ךָ֖ עָטֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/017.yaml
  text: Look[a], Yahweh is about to hurl you away violently, O man, and wrap you up tightly.
translation:
  language: hi
  text: देख[a], याहवे तुझे बुरी तरह उछालकर फेंकने वाला है, हे पुरुष, और तुझे कसकर लपेट लेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देख, याहवे तुझे प्रचण्ड रूप से उछाल देगा, हे बलवान पुरुष”; इब्रानी वाक्य संक्षिप्त और कठिन है, और גָּבֶר को संबोधन के बजाय “पुरुष/बलवान पुरुष” भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: देख
  rationale: यह शब्द आने वाली बात पर जोर देकर ध्यान खींचता है। आधुनिक हिन्दी में ‘देख’ इसकी संकेतात्मक और उद्घोषणात्मक शक्ति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: מְטַלְטֶלְךָ טַלְטֵלָה
  choice: तुझे झटके से दूर फेंकने वाला है
  rationale: धातु טלטל बलपूर्वक झकझोरने या उछालकर फेंकने का भाव देती है, और उसी मूल की संज्ञा क्रिया को तीव्र करती है। हिन्दी में बलयुक्त क्रिया-प्रयोग उस संक्षिप्त इब्रानी बलाघात को व्यक्त करता है; ‘वाला है’ הִנֵּה से सूचित आसन्न भविष्य के अनुकूल है।
- source_word: גָּבֶר
  choice: हे पुरुष
  rationale: इसे शब्ना को संबोधित करने वाली संज्ञा के रूप में रखा गया है। इब्रानी वाक्य-विन्यास कठिन होने के कारण ‘बलवान पुरुष’ तथा गैर-संबोधनात्मक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְעֹטְךָ עָטֹה
  choice: और तुझे कसकर लपेट लेगा
  rationale: עטה का मूल भाव लपेटने या ढक लेने का है। क्रिया के साथ प्रयुक्त infinitive absolute की तीव्रता को ‘कसकर’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में आए व्यक्तिगत नाम को स्पष्ट रखने के लिए ‘याहवे’ चुना गया है; इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। ‘हे पुरुष’ कुछ औपचारिक है, पर मूल के संभावित प्रत्यक्ष संबोधन को स्पष्ट रखता है। मूल इब्रानी की कठिनता और גָּבֶר की अस्पष्ट भूमिका को मुख्य पाठ में सुलझा देने के बजाय पादटिप्पणी में दर्ज किया गया है।
