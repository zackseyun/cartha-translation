base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/020.yaml
  text: And it shall happen on that day that I will call my servant Eliakim son of Hilkiah,[a]
translation:
  language: hi
  text: उस दिन ऐसा होगा कि मैं अपने सेवक, हिल्कियाह के पुत्र एल्याकीम को बुलाऊँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तलब करूँगा।” इब्रानी क्रिया में किसी को नियुक्ति या दायित्व सौंपने के लिए बुलाने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ऐसा होगा
  rationale: यह भविष्य में घटने वाली बात का परिचय देने वाला इब्रानी प्रयोग है। ‘ऐसा होगा’ आधुनिक हिन्दी में स्वाभाविक रहते हुए भविष्यसूचक कथन को बनाए रखता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यवाणी-साहित्य का मानक काल-सूचक मुहावरा है और हिन्दी में सहज रूप से ‘उस दिन’ होता है।
- source_word: וְקָרָאתִי
  choice: मैं ... बुलाऊँगा
  rationale: קרא के साथ ל किसी को बुलाने, नियुक्ति के लिए तलब करने या दायित्व सौंपने हेतु बुलाने का अर्थ दे सकता है। मुख्य पाठ में ‘बुलाऊँगा’ इस अर्थ-विस्तार को खुला रखता है।
- source_word: לְעַבְדִּי
  choice: अपने सेवक
  rationale: यहाँ עבד परमेश्वर द्वारा नियुक्त व्यक्ति के पदनाम के रूप में आया है; ‘सेवक’ प्रसंग के अनुरूप है और दासत्व का अनावश्यक सामाजिक अर्थ आरोपित नहीं करता।
- source_word: אֶלְיָקִים
  choice: एल्याकीम
  rationale: व्यक्तिवाचक नाम को प्रचलित हिन्दी बाइबलीय लिप्यंतरण के अनुसार प्रस्तुत किया गया है।
- source_word: בֶּן חִלְקִיָּהוּ
  choice: हिल्कियाह के पुत्र
  rationale: यह सामान्य इब्रानी पितृनाम-सूचक रचना है; हिन्दी में संबंध स्पष्ट और स्वाभाविक रखने के लिए यह क्रम चुना गया है।
theological_decisions:
- issue: एल्याकीम के लिए परमेश्वर का पदनाम
  choice: अपने सेवक
  alternative: अपने दास
  rationale: वाक्यांश एल्याकीम को परमेश्वर द्वारा नियुक्त व्यक्ति के रूप में चिह्नित करता है। अनुवाद में बाद की मसीही या प्रतिरूपात्मक व्याख्या नहीं जोड़ी गई, और ‘सेवक’ नियुक्ति तथा अधीनता दोनों को प्रसंगानुकूल रूप से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ऐसा होगा’ भविष्यसूचक सूत्र का सहज हिन्दी रूप है; नामों के साथ पितृनाम को प्राकृतिक हिन्दी क्रम में रखा गया है।
