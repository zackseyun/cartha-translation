id: ISA.22.23
reference: Isaiah 22:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/תְקַעְתִּ֥י/ו יָתֵ֖ד בְּ/מָק֣וֹם נֶאֱמָ֑ן וְ/הָיָ֛ה לְ/כִסֵּ֥א כָב֖וֹד לְ/בֵ֥ית אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/023.yaml
  text: And I will drive him like a peg into a secure place[b][a], and he will become a throne of honor to his father's house.
translation:
  language: hi
  text: और मैं उसे खूँटी के समान एक मज़बूत स्थान में गाड़ दूँगा,[a] और वह अपने पिता के घराने के लिए आदर का सिंहासन बनेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उसे खूँटी के समान एक दृढ़ स्थान में जमा दूँगा।”
    reason: क्रिया תקע और विशेषण נֶאֱמָן के निकट विकल्पों को दर्शाता है।
  - marker: b
    text: “आदर का सिंहासन” का अनुवाद “महिमामय सिंहासन” या “आदर का आसन” भी हो सकता है।
    reason: כִסֵּא और כָבוֹד के अर्थ-क्षेत्र में सिंहासन/आसन तथा आदर/महिमा दोनों सम्भव हैं।
lexical_decisions:
- source_word: וּתְקַעְתִּיו
  choice: मैं उसे ... गाड़ दूँगा
  rationale: תקע और खूँटी की संयुक्त ठोस छवि के लिए ‘गाड़ दूँगा’ स्वाभाविक और सजीव हिन्दी है; इसमें किसी वस्तु को दृढ़ता से भीतर ठोककर स्थापित करने का भाव है।
- source_word: יָתֵד
  choice: खूँटी
  rationale: יָתֵד ऐसी खूँटी या कीलनुमा सहारे को दर्शाता है जिसे गाड़ा जाता है और जिस पर भार टिक सकता है। ‘खूँटी’ इस रूपक को सामान्य हिन्दी में स्पष्ट रखता है।
- source_word: בְּמָקוֹם נֶאֱמָן
  choice: एक मज़बूत स्थान में
  rationale: यहाँ נֶאֱמָן का आशय विश्वसनीयता के नैतिक गुण से अधिक स्थिरता और दृढ़ता है; ‘मज़बूत स्थान’ उसी स्थानगत अर्थ को सहज रूप से व्यक्त करता है।
- source_word: וְהָיָה
  choice: वह ... बनेगा
  rationale: 'यह भावी परिणाम बताता है: परमेश्वर द्वारा स्थापित किए जाने के फलस्वरूप वह यह भूमिका धारण करेगा। ‘बनेगा’ इस परिणामी भाव को स्वाभाविक हिन्दी में रखता है।'
- source_word: לְכִסֵּא כָבוֹד
  choice: आदर का सिंहासन
  rationale: כִּסֵּא की ‘सिंहासन’ वाली छवि और כָבוֹד के आदर/प्रतिष्ठा के भाव—दोनों को बनाए रखा गया है; इसे केवल ‘सम्मानित स्थान’ कहकर रूपक को सपाट नहीं किया गया।
- source_word: לְבֵית אָבִיו
  choice: अपने पिता के घराने के लिए
  rationale: ‘घराना’ यहाँ पैतृक परिवार या वंशगत गृहसमुदाय को दर्शाता है। לְ का लाभ/सम्बन्धसूचक भाव हिन्दी में ‘के लिए’ से स्पष्ट होता है।
theological_decisions:
- issue: एल्याकीम की भूमिका के लिए खूँटी और सिंहासन के संयुक्त रूपक
  choice: दोनों ठोस रूपकों को जस का तस बनाए रखना
  alternative: इसे ‘वह अपने परिवार को स्थिरता और सम्मान देगा’ जैसे व्याख्यात्मक कथन में बदलना
  rationale: मूल पद राजनीतिक या पारिवारिक भूमिका की व्याख्या सीधे नहीं करता, बल्कि स्थापना, भार-वहन और आदर की बहुस्तरीय छवियाँ रखता है। अनुवाद इन छवियों और उनके बीच के तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सहज स्तर रखा गया है। ‘खूँटी’, ‘गाड़ दूँगा’, ‘घराना’ जैसे परिचित शब्द मूल की ठोस छवियों को स्पष्ट करते हैं; ‘आदर का सिंहासन’ असामान्य रूपक को व्याख्यात्मक ढंग से सरल किए बिना सुरक्षित रखता है।
