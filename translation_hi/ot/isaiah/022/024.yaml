id: ISA.22.24
reference: Isaiah 22:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/תָל֨וּ עָלָ֜י/ו כֹּ֣ל כְּב֣וֹד בֵּית אָבִ֗י/ו הַ/צֶּֽאֱצָאִים֙ וְ/הַ/צְּפִע֔וֹת כֹּ֖ל כְּלֵ֣י הַ/קָּטָ֑ן מִ/כְּלֵי֙ הָֽ/אַגָּנ֔וֹת וְ/עַ֖ד כָּל כְּלֵ֥י הַ/נְּבָלִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/024.yaml
  text: 'And they will hang on him all the honor of his father’s house: the offspring and the offshoots, every small vessel, from the bowls to all the jars.'
translation:
  language: hi
  text: वे उसके ऊपर उसके पिता के घराने का सारा गौरव टाँग देंगे—वंशज और अंकुर, हर छोटा पात्र, कटोरों से लेकर सब मटकों तक।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּבוֹד
  choice: गौरव
  rationale: यह शब्द ‘महिमा’, ‘सम्मान’ या ‘भार’ का भाव दे सकता है। यहाँ घराने के समस्त प्रतिष्ठित जनों और वस्तुओं को उस पर टाँगने के रूपक में ‘गौरव’ मूल की प्रतिष्ठा और भार, दोनों की प्रतिध्वनि बनाए रखता है।
- source_word: הַצֶּאֱצָאִים וְהַצְּפִעוֹת
  choice: वंशज और अंकुर
  rationale: पहला पद संतान/वंशज के लिए स्पष्ट है; दूसरा दुर्लभ पद है और संभवतः संतति या शाखाओं का चित्र देता है। ‘अंकुर’ समानांतरता और वनस्पति-रूपक को बचाता है, बिना दोनों पदों को एक ही अर्थ में मिला देने के।
- source_word: כְּלֵי הַקָּטָן
  choice: हर छोटा पात्र
  rationale: शाब्दिक पात्र-रूपक को बनाए रखा गया है; यह परिवार के कम महत्त्व वाले सदस्यों की ओर संकेत कर सकता है, पर अनुवाद उस निहितार्थ को स्पष्ट व्याख्या में नहीं बदलता।
- source_word: אַגָּנוֹת
  choice: कटोरे
  rationale: चौड़े पात्र या हौदनुमा कटोरे का सामान्य और सहज हिन्दी रूप।
- source_word: נְּבָלִים
  choice: मटके
  rationale: यहाँ तारवाद्य नहीं, पात्रों की सूची के कारण बड़े घड़े/मटके अभिप्रेत हैं। ‘मटके’ साधारण आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: एल्याकीम पर पिता के घराने का गौरव टाँगने का रूपक
  choice: रूपक को सीधे ‘उसके ऊपर…टाँग देंगे’ के रूप में रखा
  alternative: उसे पूरे घराने की जिम्मेदारी सौंप देंगे
  rationale: मूल पाठ का ठोस खूंटी-पात्र रूपक प्रसंग के लिए महत्त्वपूर्ण है; उसे केवल प्रशासनिक जिम्मेदारी कह देना अर्थ को समय से पहले सुलझा देता।
- issue: ‘वंशज और अंकुर’ की पहचान
  choice: दो भिन्न किंतु समानांतर पद बनाए रखे
  alternative: बेटे और पोते / समस्त छोटे-बड़े संबंधी
  rationale: दूसरा इब्रानी पद दुर्लभ और अनिश्चित है। किसी निश्चित पीढ़ीगत या पारिवारिक श्रेणी को थोपने के बजाय मूल की काव्यात्मक अस्पष्टता सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली संक्षिप्त, गरिमापूर्ण और रूपक-सचेत है। ‘टाँग देंगे’ प्रसंग में खूंटी पर पात्र लटकाने की छवि बनाए रखता है।
