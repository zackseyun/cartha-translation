source:
  edition: WLC
  text: וְ/סַלְע/וֹ֙ מִ/מָּג֣וֹר יַֽעֲב֔וֹר וְ/חַתּ֥וּ מִ/נֵּ֖ס שָׂרָ֑י/ו נְאֻם יְהוָ֗ה אֲשֶׁר א֥וּר ל/וֹ֙ בְּ/צִיּ֔וֹן וְ/תַנּ֥וּר ל֖/וֹ בִּ/ירוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/009.yaml
  text: His rock will pass away because of terror[a], and his princes will be terrified at the signal, declares Yahweh[c][b], whose fire is in Zion and whose furnace is in Jerusalem.
translation:
  language: hi
  text: उसकी चट्टान भय के कारण लुप्त हो जाएगी[a], और उसके सरदार ध्वज को देखकर घबरा जाएँगे[b]—याहवे की यह घोषणा है—जिसकी आग सिय्योन में और जिसकी भट्ठी यरूशलेम में है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका गढ़ भय के कारण लुप्त हो जाएगा।” इब्रानी में शाब्दिक शब्द “चट्टान” है; यह अश्शूर के आश्रय, गढ़ या शासक का रूपक हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके सरदार ध्वज के कारण घबरा जाएँगे।” इब्रानी शब्द युद्ध के झंडे, ध्वज-दंड या संकेत को दर्शा सकता है।
    reason: alternative_reading
  - marker: c
    text: सिय्योन की “आग” और यरूशलेम की “भट्ठी” संभवतः न्याय में याहवे की भस्म करने वाली उपस्थिति का बिंब हैं, पर पद इस चित्र को इससे अधिक स्पष्ट नहीं करता।
    reason: cultural_note
lexical_decisions:
- source_word: וְסַלְעוֹ
  choice: उसकी चट्टान
  rationale: सֶלַע का मूल अर्थ चट्टान या शैल है। यहाँ यह अश्शूर के आश्रय, गढ़ या शासक का रूपक हो सकता है; मुख्य पाठ में मूल बिंब सुरक्षित रखा गया है।
- source_word: מִמָּגוֹר יַעֲבוֹר
  choice: आतंक के कारण जाती रहेगी
  rationale: מִן कारण या स्रोत बता सकता है, और עבר यहाँ हट जाने या लुप्त हो जाने का भाव देता है। स्त्रीलिंग 'जाती रहेगी' का संबंध 'चट्टान' से है।
- source_word: וְחַתּוּ מִנֵּס
  choice: झंडा देखकर घबरा जाएँगे
  rationale: חתת भयभीत या हताश होने का भाव देता है। נֵס युद्ध में ऊँचा किया गया झंडा, ध्वज या संकेत हो सकता है; 'झंडा देखकर' हिंदी में कारण और दृश्य बिंब दोनों व्यक्त करता है।
- source_word: שָׂרָיו
  choice: उसके हाकिम
  rationale: שַׂר शासक, प्रधान, अधिकारी या सेनापति हो सकता है। 'हाकिम' व्यापक पद-सूचक अर्थ रखता है और संदर्भ को केवल सैनिक अधिकारियों तक सीमित नहीं करता।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: נְאֻם की भविष्यवाणी-संबंधी औपचारिकता को 'घोषणा' से व्यक्त किया गया है और יהוה को उसके व्यक्तिवाचक वाचा-नाम 'याहवे' के रूप में रखा गया है।
- source_word: אֲשֶׁר אוּר לוֹ בְצִיּוֹן וְתַנּוּר לוֹ בִּירוּשָׁלִָם
  choice: जिसकी आग सिय्योन में और जिसकी भट्ठी यरूशलेम में है
  rationale: אוּר को תַנּוּר के समानांतर 'आग' और תַנּוּר को 'भट्ठी' किया गया है। इससे तीव्र अग्नि का बिंब बना रहता है, बिना उसे वेदी, बलिदान या किसी विशेष अंतकालीन घटना तक सीमित किए।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में वाचा का व्यक्तिवाचक नाम है; इसलिए उपाधि से बदलने के बजाय उसका प्रचलित हिंदी लिप्यंतरण रखा गया है।
- issue: आग और भट्ठी के बिंब का अर्थ
  choice: बिंब को बिना अतिरिक्त व्याख्या के बनाए रखना
  alternative: इसे स्पष्ट रूप से वेदी की आग या अंतकालीन न्याय बताना
  rationale: पद न्यायकारी और भस्मकारी उपस्थिति का संकेत दे सकता है, पर मूल इब्रानी किसी एक संकीर्ण पहचान को स्पष्ट नहीं करता।
- issue: चट्टान की पहचान
  choice: मुख्य पाठ में 'चट्टान' का रूपक बनाए रखना
  alternative: गढ़; आश्रय; राजा
  rationale: यह अश्शूर की सुरक्षा, दुर्ग या शासक को सूचित कर सकता है। किसी एक अभिप्राय को मुख्य पाठ में निश्चित करना मूल की सार्थक अस्पष्टता मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'चट्टान', 'आग' और 'भट्ठी' जैसे मूल बिंब सुरक्षित हैं; 'हाकिम' पद-सूचक שַׂר की व्यापकता बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
