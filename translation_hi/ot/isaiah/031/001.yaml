reference: Isaiah 31:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ה֣וֹי הַ/יֹּרְדִ֤ים מִצְרַ֨יִם֙ לְ/עֶזְרָ֔ה עַל סוּסִ֖ים יִשָּׁעֵ֑נוּ וַ/יִּבְטְח֨וּ עַל רֶ֜כֶב כִּ֣י רָ֗ב וְ/עַ֤ל פָּֽרָשִׁים֙ כִּֽי עָצְמ֣וּ מְאֹ֔ד וְ/לֹ֤א שָׁעוּ֙ עַל קְד֣וֹשׁ יִשְׂרָאֵ֔ל וְ/אֶת יְהוָ֖ה לֹ֥א דָרָֽשׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/001.yaml
  text: Woe to those who go down to Egypt for help[a], who rely on horses and trust in chariots because they are many, and in horsemen because they are very strong[c][b], but do not look to the Holy One of Israel and do not seek Yahweh.
translation:
  language: hi
  text: हाय उन लोगों पर जो सहायता के लिए मिस्र की ओर उतर जाते हैं! वे घोड़ों पर निर्भर रहते हैं[a], और रथों पर भरोसा करते हैं क्योंकि वे बहुत हैं, तथा घुड़सवारों[b] पर क्योंकि वे अत्यन्त शक्तिशाली हैं; परन्तु वे इस्राएल के पवित्र परमेश्वर की ओर दृष्टि नहीं करते और याहवे[c] को नहीं खोजते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘घोड़ों का सहारा लेते हैं’; इब्रानी क्रिया किसी ऐसी वस्तु पर टिकने की छवि प्रस्तुत करती है जिससे सहारा माँगा जाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘घुड़सवार सेना’।
    reason: lexical_alternative
  - marker: c
    text: ‘याहवे’ इब्रानी दिव्य नाम יהוה (YHWH) का लिप्यंतरण है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: हाय उन लोगों पर
  rationale: यह भविष्यद्वाणी की न्यायसूचक धिक्कार-वाणी है; यह रूप हिन्दी में उसके गंभीर चेतावनी-भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַיֹּרְדִים מִצְרַיִם
  choice: जो ... मिस्र की ओर उतर जाते हैं
  rationale: संज्ञा की तरह प्रयुक्त कृदन्त संबोधित लोगों के वर्ग को दर्शाता है। ‘उतर जाते हैं’ मिस्र की ओर भौगोलिक गति की मूल छवि बनाए रखता है।
- source_word: לְעֶזְרָה
  choice: सहायता के लिए
  rationale: गति के उद्देश्य को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַל סוּסִים יִשָּׁעֵנוּ
  choice: घोड़ों पर निर्भर रहते हैं
  rationale: שׁען के निफ़अल रूप में किसी सहारे पर टिकने और उस पर निर्भर होने की छवि है; ‘निर्भर रहते हैं’ उसका आशय स्पष्ट करता है, जबकि पादटिप्पणी मूल रूपक बताती है।
- source_word: וַיִּבְטְחוּ עַל רֶכֶב כִּי רָב
  choice: बहुत-से रथों पर भरोसा करते हैं
  rationale: रֶכֶב यहाँ सामूहिक अर्थ में रथ-सेना को दर्शाता है। हिन्दी में बहुवचन से उसकी बड़ी संख्या और भरोसे का कारण सहज रूप में व्यक्त होता है।
- source_word: וְעַל פָּרָשִׁים כִּי עָצְמוּ מְאֹד
  choice: और अत्यन्त शक्तिशाली घुड़सवारों पर भी
  rationale: פָּרָשִׁים का ठोस अर्थ सवार योद्धा है। עָצְמוּ מְאֹד उनकी प्रबल सैन्य शक्ति बताता है, यद्यपि संख्या का भाव भी संभव है।
- source_word: וְלֹא שָׁעוּ עַל קְדוֹשׁ יִשְׂרָאֵל
  choice: परन्तु वे इस्राएल के पवित्र की ओर नहीं देखते
  rationale: שׁעה ध्यान और आश्रय की दृष्टि से किसी की ओर देखने का भाव देता है। यह मिस्र की सैन्य शक्ति पर निर्भरता के साथ जानबूझकर रखा गया विरोध बनाए रखता है।
- source_word: וְאֶת יְהוָה לֹא דָרָשׁוּ
  choice: और याहवे को नहीं खोजते
  rationale: דרש यहाँ सहायता और मार्गदर्शन के लिए परमेश्वर की खोज करने या उनसे पूछने का भाव रखता है। व्यक्तिगत दिव्य नाम को लिप्यंतरित किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत दिव्य नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: इब्रानी क्रियारूपों का काल और पक्ष
  choice: सामान्य वर्तमान काल—‘उतर जाते हैं’, ‘निर्भर रहते हैं’, ‘भरोसा करते हैं’, ‘नहीं देखते’, ‘नहीं खोजते’
  alternative: भूतकाल—‘उतरे’, ‘निर्भर हुए’, ‘भरोसा किया’, ‘नहीं देखा’, ‘नहीं खोजा’
  rationale: आरम्भिक कृदन्त और पूरी धिक्कार-वाणी किसी विशिष्ट पिछली घटना मात्र के बजाय ऐसे लोगों के चरित्रगत आचरण को लक्ष्य करती है; सामान्य वर्तमान हिन्दी में यह भाव स्पष्ट रखता है।
- issue: עָצְמוּ में शक्ति और संख्या की संभावित द्विअर्थता
  choice: अत्यन्त शक्तिशाली
  alternative: बहुत अधिक संख्या में / अत्यन्त प्रबल
  rationale: पहले खंड में रथों की बहुतायत स्पष्ट कही गई है; समानांतर दूसरे खंड में घुड़सवारों की सैन्य शक्ति प्रमुख लगती है। फिर भी मूल क्रिया में संख्यात्मक प्रबलता की संभावना को निर्णय-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘हाय उन लोगों पर’ भविष्यद्वाणी की धिक्कार-वाणी को बनाए रखता है; ‘मिस्र की ओर उतर जाते हैं’ मूल भौगोलिक दिशा को संरक्षित करता है। अर्धविराम सैन्य साधनों पर भरोसे और इस्राएल के पवित्र की उपेक्षा के बीच तीखा विरोध स्पष्ट करता है।
