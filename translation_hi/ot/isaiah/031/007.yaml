base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/007.yaml
  text: For on that day each man will reject his idols of silver and his idols of gold, which your hands have made for you as sin.
translation:
  language: hi
  text: क्योंकि उस दिन हर व्यक्ति अपनी चाँदी और सोने की मूर्तियों को ठुकरा देगा, जिन्हें तुम्हारे हाथों ने तुम्हारे लिए पाप के रूप में बनाया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִמְאָסוּן
  choice: ठुकरा देगा
  rationale: मूल क्रिया में तिरस्कार सहित अस्वीकार करने का भाव है; ‘ठुकराना’ इसे स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֱלִילֵי
  choice: मूर्तियों
  rationale: सन्दर्भ में चाँदी और सोने से बने उपासना-विषय अभिप्रेत हैं; ‘मूर्तियाँ’ सामान्य पाठक के लिए स्पष्ट है, यद्यपि शब्द में निकम्मे देवताओं का तिरस्कारपूर्ण भाव भी हो सकता है।
- source_word: אִישׁ
  choice: हर व्यक्ति
  rationale: एकवचन ‘व्यक्ति’ यहाँ वितरणात्मक अर्थ रखता है—प्रत्येक जन अपनी-अपनी मूर्तियाँ त्यागेगा।
- source_word: חֵטְא
  choice: पाप के रूप में
  rationale: वाक्य के अन्त में आया संज्ञात्मक शब्द इन वस्तुओं के निर्माण को ‘पाप’ ठहराता है; मूल की संक्षिप्त और कुछ असामान्य रचना को बिना किसी अतिरिक्त कारण या परिणाम को जोड़े बनाए रखा गया है।
theological_decisions:
- issue: חֵטְא का सम्बन्ध मूर्तियों अथवा उन्हें बनाने के कर्म से
  choice: ‘जिन्हें ... पाप के रूप में बनाया था’ द्वारा मूल की निकटता और तनाव बनाए रखा
  alternative: ‘जिन्हें बनाकर तुम्हारे हाथों ने पाप किया था’
  rationale: वैकल्पिक रूप अर्थ स्पष्ट करता, पर हिब्रू में ‘पाप किया’ क्रिया नहीं है; संज्ञा חֵטְא को स्पष्ट क्रिया में बदलना मूल की असामान्य अभिव्यक्ति को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘अपने’ मूल के ‘तुम्हारे हाथों’ पर बल को दर्शाता है; एकवचन से बहुवचन की ओर मूल के वितरणात्मक सम्बोधन को हिन्दी में स्वाभाविक रखा गया है।
