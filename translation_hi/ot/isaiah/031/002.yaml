language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/גַם ה֤וּא חָכָם֙ וַ/יָּ֣בֵא רָ֔ע וְ/אֶת דְּבָרָ֖י/ו לֹ֣א הֵסִ֑יר וְ/קָם֙ עַל בֵּ֣ית מְרֵעִ֔ים וְ/עַל עֶזְרַ֖ת פֹּ֥עֲלֵי אָֽוֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/002.yaml
  text: Yet he too is wise and brings disaster[a]; he does not take back his words[c][b], but rises against the house of evildoers and against the help of workers of iniquity.
translation:
  language: hi
  text: फिर भी वह भी बुद्धिमान है और विपत्ति लाता है[a]; वह अपने वचनों को वापस नहीं लेता[b], बल्कि बुराई करनेवालों के घराने के विरुद्ध और दुष्टता करनेवालों की सहायता के विरुद्ध उठ खड़ा होता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विपदा लाता है।” हिब्रू शब्द का शाब्दिक अर्थ “बुराई/विपत्ति” हो सकता है; यहाँ उसका अर्थ नैतिक बुराई नहीं, बल्कि न्यायस्वरूप विपत्ति है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने वचनों को नहीं हटाता।”
    reason: lexical_alternative
  - marker: c
    text: हिब्रू में “सहायता” एक भाववाचक संज्ञा है, “सहायक” नहीं। इसका संबंध दुष्टता करनेवालों से है, पर यह उन्हें मिलनेवाली अथवा उनसे संबद्ध सहायता को सूचित कर सकता है।
    reason: lexical_clarification
lexical_decisions:
- source_word: וְגַם הוּא
  choice: फिर भी वह भी
  rationale: स्पष्ट सर्वनाम और 'भी' के तुलनात्मक बल को बनाए रखता है; संदर्भ में यह मिस्र पर भरोसा करनेवालों की मानवीय बुद्धि के विपरीत यहोवा की बुद्धि को रखता है।
- source_word: חָכָם
  choice: बुद्धिमान
  rationale: हिब्रू विशेषण का सामान्य और स्वाभाविक हिन्दी रूप; यहाँ सच्ची और प्रभावकारी ईश्वरीय बुद्धि का भाव है।
- source_word: וַיָּבֵא רָע
  choice: विपत्ति लाता है
  rationale: न्याय-संबंधी भविष्यवाणी के संदर्भ में רָע नैतिक बुराई नहीं, बल्कि विपत्ति या विनाशकारी न्याय को सूचित करता है; क्रिया का सक्रिय कारक-भाव सुरक्षित है।
- source_word: דְּבָרָיו לֹא הֵסִיר
  choice: अपने वचनों को वापस नहीं लेता
  rationale: 'बहुवचन ''वचनों'' को बनाए रखते हुए हिब्रू मुहावरे का स्वाभाविक हिन्दी अर्थ देता है: कही हुई बातों को न हटाना या न वापस लेना।'
- source_word: וְקָם עַל
  choice: बल्कि ... के विरुद्ध उठ खड़ा होता है
  rationale: קום के साथ עַל यहाँ विरोधी या न्यायिक कार्रवाई दर्शाता है; 'बल्कि' पिछले कथन से स्वाभाविक प्रगति व्यक्त करता है।
- source_word: בֵּית מְרֵעִים
  choice: बुराई करनेवालों का घराना
  rationale: בֵּית के सामूहिक अर्थ को 'घराना' और participial expression को सरल आधुनिक हिन्दी में प्रस्तुत करता है।
- source_word: עֶזְרַת
  choice: सहायता
  rationale: हिब्रू में यह अमूर्त संज्ञा है, व्यक्तिवाचक 'सहायक' नहीं; इसलिए मिस्र से मिलनेवाले सहारे के अर्थ को सुरक्षित रखा गया है।
- source_word: פֹּעֲלֵי אָוֶן
  choice: दुष्टता करनेवाले
  rationale: कर्म करने की हिब्रू अभिव्यक्ति और אָוֶן के नैतिक अर्थ—दुष्टता/अधर्म—दोनों को सहज हिन्दी में रखता है।
theological_decisions:
- issue: परमेश्वर की क्रिया के संदर्भ में רָע का अनुवाद
  choice: विपत्ति
  alternative: बुराई; विपदा
  rationale: संदर्भ में यह न्यायस्वरूप विपत्ति है, नैतिक बुराई नहीं। यह चयन संदर्भगत अर्थ स्पष्ट करता है, पर परमेश्वर द्वारा न्याय लाने की सक्रियता को कम नहीं करता।
- issue: הוּא सर्वनाम का संदर्भ
  choice: पद में 'वह' रखा गया; संदर्भतः यहोवा
  alternative: नाम को स्पष्ट रूप से 'यहोवा' लिखना
  rationale: हिब्रू में स्पष्ट और बलाघातयुक्त सर्वनाम है। निकटवर्ती संदर्भ उसके कर्ता को यहोवा के रूप में पहचानता है, इसलिए मूल की सर्वनामात्मक शैली रखी गई है।
- issue: दुष्टों की सहायता के विरुद्ध उठने का आशय
  choice: अमूर्त 'सहायता' को बनाए रखा
  alternative: दुष्टता करनेवालों के सहायकों के विरुद्ध
  rationale: मूल में עֶזְרַת अमूर्त संज्ञा है। इसे व्यक्तियों में बदलना मिस्र द्वारा दी जानेवाली सहायता या सहारे के व्यापक आशय को अनावश्यक रूप से सीमित कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सहज। 'वचन' बाइबलीय संदर्भ में परिचित है; 'घराना' सामूहिक בֵּית को व्यक्त करता है। पाठ में सभी पादटिप्पणी-चिह्न क्रम से जोड़े गए हैं।
