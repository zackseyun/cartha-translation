  text: וְ/נָפַ֤ל אַשּׁוּר֙ בְּ/חֶ֣רֶב לֹא אִ֔ישׁ וְ/חֶ֥רֶב לֹֽא אָדָ֖ם תֹּֽאכֲלֶ֑/נּוּ וְ/נָ֥ס ל/וֹ֙ מִ/פְּנֵי חֶ֔רֶב וּ/בַחוּרָ֖י/ו לָ/מַ֥ס יִהְיֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/008.yaml
  text: And Assyria will fall by a sword not of man[a], and a sword not of humankind will devour him; and he will flee from before the sword[d][c][b], and his young men will become forced labor.
translation:
  language: hi
  text: अश्शूर न किसी पुरुष की तलवार से गिरेगा, न किसी मनुष्य की तलवार उसे निगल जाएगी। वह तलवार से भागेगा, और उसके जवान बेगार में लगा दिए जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָפַל
  choice: गिरेगा
  rationale: भविष्यवाणी के प्रसंग में संयोजक के साथ आया पूर्ण क्रियारूप भावी घटना को व्यक्त करता है; इसलिए हिन्दी में भविष्यकाल स्वाभाविक है।
- source_word: אַשּׁוּר
  choice: अश्शूर
  rationale: यह नाम यहाँ अश्शूरी साम्राज्य या शक्ति को सामूहिक रूप से दर्शाता है; हिन्दी बाइबलीय प्रयोग में ‘अश्शूर’ स्रोत-नाम के निकट और परिचित है।
- source_word: בְּחֶרֶב
  choice: तलवार से
  rationale: בְּ यहाँ साधन का बोध कराता है; ‘तलवार से’ सहज हिन्दी में उसी साधनात्मक अर्थ को रखता है।
- source_word: לֹא אִישׁ
  choice: जो किसी पुरुष की नहीं होगी
  rationale: यह तलवार को मानवीय उद्गम या कर्तृत्व से अलग बताता है। ‘पुरुष’ से אִישׁ का शब्दगत भेद अगले אָדָם से कुछ हद तक बना रहता है।
- source_word: וְחֶרֶב לֹא אָדָם
  choice: और ऐसी तलवार जो मनुष्य की नहीं होगी
  rationale: ‘मनुष्य’ generic אָדָם को व्यक्त करता है और समानांतर पंक्ति में אִישׁ के लिए प्रयुक्त ‘पुरुष’ से भेद बनाए रखता है।
- source_word: תֹּאכֲלֶנּוּ
  choice: उसे निगल जाएगी
  rationale: क्रिया का कर्ता ‘तलवार’ है। ‘निगल जाना’ אכל के प्रबल रूपक और विनाशकारी तलवार-चित्र को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְנָס לוֹ מִפְּנֵי חֶרֶב
  choice: वह तलवार के सामने से भागेगा
  rationale: एकवचन विषय को सामूहिक ‘अश्शूर’ के रूप में जारी रखा गया है। ‘सामने से भागेगा’ מִפְּנֵי की स्थान-संबंधी छवि को बनाए रखता है।
- source_word: בַחוּרָיו
  choice: उसके जवान
  rationale: בָּחוּר सामान्यतः अपनी जवानी और सामर्थ्य के उत्कर्ष पर पहुँचे पुरुषों को दर्शाता है; सैनिक प्रसंग निहित हो सकता है, पर ‘योद्धा’ कहकर उसे अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: לָמַס
  choice: बेगार के अधीन
  rationale: מַס विजेता द्वारा थोपी गई अनिवार्य सेवा, श्रम या श्रम-कर को दर्शा सकता है। ‘बेगार के अधीन’ आधुनिक पाठक के लिए बाध्यकारी श्रम का भाव स्पष्ट करता है।
- source_word: יִהְיוּ
  choice: हो जाएँगे
  rationale: यह पराजय के बाद उत्पन्न नई दशा को व्यक्त करता है, इसलिए केवल ‘होंगे’ की अपेक्षा ‘हो जाएँगे’ अधिक उपयुक्त है।
theological_decisions:
- issue: अश्शूर को गिराने वाली तलवार का स्वरूप
  choice: तलवार को मानवीय उद्गम या शक्ति की न मानते हुए उसके सटीक माध्यम को अनिर्दिष्ट रखना
  alternative: इसे स्पष्ट रूप से किसी स्वर्गदूत, महामारी अथवा बिना मानवीय धारक वाली शाब्दिक तलवार के रूप में पहचानना
  rationale: इब्रानी पाठ दो समानांतर वाक्यांशों में मानवीय कर्तृत्व का निषेध करता है, पर न्याय का ठीक माध्यम नहीं बताता। अनुवाद उसी रहस्य और धर्मवैचारिक तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर इब्रानी पदों के लिए ‘पुरुष’ और ‘मनुष्य’ का भेद रखा गया है; ‘बेगार’ के साथ ‘के अधीन’ जोड़कर बाध्यकारी सेवा का अर्थ स्पष्ट किया गया है।
