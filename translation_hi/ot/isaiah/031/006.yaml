base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/006.yaml
  text: Return to him from whom the sons of Israel have deeply revolted[a][b].
translation:
  language: hi
  text: उसकी ओर लौट आओ, जिसके विरुद्ध इस्राएल के पुत्रों ने घोर विद्रोह किया है[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “उसकी ओर लौट आओ, जिससे दूर होकर इस्राएल के पुत्र विद्रोह में बहुत आगे निकल गए हैं।” इब्रानी संबंधवाचक वाक्यांश संक्षिप्त है और लौटने की दिशा तथा विद्रोह के संबंध को एक साथ व्यक्त करता है।'
    reason: alternative_reading
  - marker: b
    text: “इस्राएल के पुत्र” इब्रानी का अधिक शाब्दिक अनुवाद है; यहाँ यह इस्राएल के लोगों के लिए सामूहिक पदनाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבוּ
  choice: लौट आओ
  rationale: बहुवचन आज्ञार्थक रूप पश्चात्ताप और फिर से उसकी ओर आने का आह्वान करता है। ‘लौट आओ’ आधुनिक हिन्दी में स्वाभाविक है और दिशा तथा संबंध की बहाली—दोनों का भाव रखता है।
- source_word: לַאֲשֶׁר
  choice: उसकी ओर … जिसके विरुद्ध
  rationale: लְ और אֲשֶׁר का संक्षिप्त संबंधवाचक प्रयोग हिन्दी में एक ही स्थान पर सहजता से व्यक्त नहीं होता। ‘उसकी ओर लौट आओ, जिसके विरुद्ध…’ लौटने की दिशा और पूर्व विद्रोह के लक्ष्य—दोनों को स्पष्ट रखता है, पर परमेश्वर का नाम जोड़ता नहीं है।
- source_word: הֶעְמִיקוּ סָרָה
  choice: घोर विद्रोह किया है
  rationale: हिफ़ील क्रिया הֶעְמִיקוּ का मूल भाव ‘गहरा करना/गहराई तक जाना’ है और סָרָה विद्रोह अथवा विमुखता बताता है। ‘घोर विद्रोह’ इस तीव्रता को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी पुरुषवाचक बहुवचन संबंध-रचना का निकट अनुवाद है। यहाँ यह इस्राएल के लोगों के लिए सामूहिक वंशगत पदनाम है।
theological_decisions:
- issue: लौटने के लक्ष्य को मुख्य पाठ में परमेश्वर/याहवे के रूप में स्पष्ट करना
  choice: इब्रानी के अनिर्दिष्ट संबंधवाचक संकेत को ‘उसकी ओर … जिसके विरुद्ध’ के रूप में बनाए रखा
  alternative: ‘यहोवा की ओर लौट आओ’
  rationale: संदर्भ में संकेत इस्राएल के परमेश्वर की ओर है, पर इस पद में दिव्य नाम या उपाधि नहीं दी गई। उसे जोड़ने के बजाय मूल पाठ की अभिव्यक्ति सुरक्षित रखी गई है।
- issue: לַאֲשֶׁר में लौटने की दिशा और विद्रोह के संबंध को व्यक्त करना
  choice: ‘उसकी ओर लौट आओ, जिसके विरुद्ध…’
  alternative: ‘उसकी ओर लौट आओ, जिससे दूर होकर…’
  rationale: לְ सामान्यतः ‘की ओर/के विरुद्ध’ दोनों प्रकार के संबंध में समझा जा सकता है। विद्रोह के साथ ‘जिसके विरुद्ध’ अधिक प्रत्यक्ष है, जबकि वैकल्पिक रूप में उससे दूर होने का दिशात्मक भाव पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘घोर विद्रोह’ मूल की तीव्रता व्यक्त करता है, जबकि संबंधवाचक रचना में निहित वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
