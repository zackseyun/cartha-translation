source:
  edition: WLC
  text: כְּ/צִפֳּרִ֣ים עָפ֔וֹת כֵּ֗ן יָגֵ֛ן יְהוָ֥ה צְבָא֖וֹת עַל יְרֽוּשָׁלִָ֑ם גָּנ֥וֹן וְ/הִצִּ֖יל פָּסֹ֥חַ וְ/הִמְלִֽיט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/005.yaml
  text: Like birds hovering[a], so Yahweh of Armies will shield Jerusalem—shielding and delivering, passing over and rescuing.
translation:
  language: hi
  text: जैसे उड़ते हुए पक्षी, वैसे ही सेनाओं का याहवे यरूशलेम की रक्षा करेगा—रक्षा करके छुड़ाएगा, बख्शकर बचाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּ/צִפֳּרִים עָפוֹת
  choice: जैसे उड़ते हुए पक्षी
  rationale: כְּ तुलना प्रकट करता है, צִפֳּרִים का अर्थ ‘पक्षी’ और עָפוֹת का मूल अर्थ ‘उड़ते हुए’ है। यह अनुवाद पक्षियों द्वारा ऊपर मंडराकर रक्षा करने की सम्भावित छवि को आरोपित किए बिना मूल बिंब को खुला रखता है।
- source_word: יָגֵן ... גָּנוֹן
  choice: रक्षा करेगा—रक्षा करके
  rationale: גנן में ढाँपने, बचाने और रक्षा करने का भाव है। हिन्दी में ‘रक्षा करना’ स्वाभाविक है और मूल की पुनरुक्ति को भी बनाए रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: याहवे व्यक्तिगत दिव्य नाम को लिप्यंतरित करता है; ‘सेनाओं’ से צְבָאוֹת का युद्ध-संबंधी और स्वर्गीय समूहों से जुड़ा व्यापक भाव बना रहता है।
- source_word: עַל יְרוּשָׁלִָם
  choice: यरूशलेम की रक्षा
  rationale: עַל का स्थानगत भाव पक्षियों की उपमा और आगे ‘उसके ऊपर से’ में सुनाई देता है; मुख्य क्रिया के साथ सहज आधुनिक हिन्दी के लिए ‘यरूशलेम की रक्षा’ रखा गया है।
- source_word: וְ/הִצִּיל
  choice: छुड़ाएगा
  rationale: נצל का अर्थ संकट या शत्रु से छुड़ाना है। यह अगले מלט से भिन्न किन्तु निकटार्थक क्रिया बनाए रखता है।
- source_word: פָּסֹחַ
  choice: उसके ऊपर से पार होकर
  rationale: פסח का यह रूप पार जाने या छोड़ देने की भाषा को जगा सकता है और निर्गमन के फसह की प्रतिध्वनि सम्भव बनाता है। मुख्य पाठ में स्थानगत अर्थ रखा गया है, जबकि वैकल्पिक रक्षात्मक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וְ/הִמְלִיט
  choice: बचाएगा
  rationale: מלט के हिफ़ील रूप में किसी को बच निकलने देना या सुरक्षित निकालना है। संक्षिप्त ‘बचाएगा’ हिन्दी में स्वाभाविक है और הִצִּיל के ‘छुड़ाएगा’ से शब्दगत विविधता रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत दिव्य नाम है। ‘याहवे’ उसे नाम के रूप में स्पष्ट रखता है।
- issue: פָּסֹחַ में फसह-संबंधी प्रतिध्वनि
  choice: उसके ऊपर से पार होकर
  alternative: उसे छोड़कर; उसे बख्शकर; उसकी रक्षा करके
  rationale: शब्द का अर्थ केवल एक रक्षात्मक क्रिया तक सीमित करने के बजाय पार जाने और बख्शने—दोनों सम्भावनाओं का तनाव मुख्य पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
- issue: पक्षियों की उपमा का स्वरूप
  choice: उड़ते हुए पक्षी
  alternative: ऊपर मँडराते पक्षी
  rationale: עָפוֹת सीधे ‘उड़ते हुए’ कहता है। ‘मँडराते’ से रक्षात्मक घोंसला-बिंब अधिक स्पष्ट हो जाता, पर वह मूल में अनिवार्य नहीं है; इसलिए अपेक्षाकृत खुला पाठ चुना गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। मूल की सघन क्रिया-श्रृंखला और ‘रक्षा’ की पुनरुक्ति को यथासम्भव बनाए रखा गया है; विराम-चिह्न उसके काव्यात्मक प्रवाह को स्पष्ट करते हैं।
