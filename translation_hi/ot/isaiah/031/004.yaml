base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/004.yaml
  text: 'For thus Yahweh said to me: As the lion or the young lion growls over its prey[a], and though a band of shepherds is called out against it, it is not terrified by their voice or cowed by their noise[b], so Yahweh of hosts will come down to wage war on Mount Zion and on its hill.'
translation:
  language: hi
  text: 'क्योंकि याहवे ने मुझसे यह कहा है:


    “जैसे सिंह या जवान सिंह अपने शिकार पर गुर्राता है[a],


    और यद्यपि उसके विरुद्ध चरवाहों की पूरी टोली बुला ली जाती है,


    फिर भी वह उनकी आवाज़ से नहीं घबराता


    और न उनके शोर से दबता है[b],


    वैसे ही सेनाओं का याहवे


    सिय्योन पर्वत और उसकी पहाड़ी पर युद्ध करने के लिए उतरेगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सिंह और जवान सिंह”; हिब्रू में यह युग्म दो अलग पशुओं के बजाय एक काव्यात्मक द्विपद भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “और न उनके शोर का उत्तर देता है”; हिब्रू क्रिया का अधिक शाब्दिक अर्थ “उत्तर देना/प्रतिक्रिया करना” हो सकता है, पर इस प्रसंग में संभवतः आशय दबने या भयभीत होने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के विशिष्ट नाम को प्रचलित और पहचाने जाने योग्य रूप ‘यहोवा’ से व्यक्त किया गया है; इसे उपाधि ‘प्रभु’ से नहीं बदला गया।
- source_word: יֶהְגֶּה
  choice: गुर्राता है
  rationale: यहाँ क्रिया शिकार पर झुके सिंह की धीमी, धमकी-भरी ध्वनि बताती है, इसलिए ‘दहाड़ता है’ की अपेक्षा ‘गुर्राता है’ अधिक सटीक है।
- source_word: הָאַרְיֵה וְהַכְּפִיר
  choice: सिंह या जवान सिंह
  rationale: हिब्रू युग्म को एक प्रतिनिधि काव्यात्मक विकल्प की तरह स्वाभाविक हिन्दी में रखा गया; ‘और’ वाला पाठ-संभाव्य अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: מְלֹא רֹעִים
  choice: चरवाहों की पूरी टोली
  rationale: מְלֹא समूह की पूर्ण संख्या या भरमार का भाव देता है; ‘पूरी टोली’ अर्थ और दृश्य दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: לֹא יֵחָת
  choice: नहीं घबराता
  rationale: निफ़ाल रूप भयभीत या हतोत्साहित होने का भाव देता है; सिंह के दृश्य में ‘घबराता’ स्वाभाविक और ठोस है।
- source_word: לֹא יַעֲנֶה
  choice: न उनके शोर से दबता है
  rationale: समानांतर पंक्ति के अनुसार यहाँ वश में किए जाने या दबाए जाने का अर्थ संदर्भानुकूल है, जबकि अधिक शाब्दिक ‘उत्तर देता’ की संभावना पादटिप्पणी में रखी गई है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: यह रूप ईश्वरीय नाम और צְבָאוֹת के सैन्य बल—दोनों को सुरक्षित रखता है, जो ‘युद्ध करने’ के निकट संदर्भ में विशेष रूप से उपयुक्त है।
- source_word: לִצְבֹּא
  choice: युद्ध करने के लिए
  rationale: क्रिया का सैन्य आशय स्पष्ट करते हुए हिन्दी में सहज प्रयोजन-वाक्यांश चुना गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में वाचा-संबंधी विशिष्ट नाम सीधे उपस्थित है; हिन्दी पाठ में उसे उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखा गया है।
- issue: לֹא יַעֲנֶה का अर्थ
  choice: शोर से दबता नहीं
  alternative: उनके शोर का उत्तर नहीं देता
  rationale: לֹא יֵחָת के साथ काव्यात्मक समानांतरता डराने या वश में करने में विफलता की ओर संकेत करती है, फिर भी अधिक शाब्दिक अर्थ को पादटिप्पणी में संरक्षित किया गया है।
- issue: सिय्योन के विरुद्ध या उसके पक्ष में युद्ध
  choice: ‘सिय्योन पर्वत और उसकी पहाड़ी पर युद्ध करने’ की स्थानगत अस्पष्टता बनाए रखी गई
  alternative: सिय्योन की रक्षा के लिए युद्ध करना
  rationale: עַל स्थान, लक्ष्य या विरोध का भाव दे सकता है। मूल पद स्पष्ट रूप से ‘रक्षा’ नहीं कहता, इसलिए व्याख्यात्मक निष्कर्ष पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। सिंह के ठोस दृश्य के लिए ‘गुर्राता’, ‘घबराता’ और ‘दबता’ जैसे सरल शब्द चुने गए हैं। काव्यात्मक पंक्ति-विन्यास बनाए रखते हुए मूल की उपमा और सिय्योन संबंधी स्थानगत अस्पष्टता सुरक्षित रखी गई है।
