base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/003.yaml
  text: Egypt is man and not God[a], and their horses are flesh and not spirit. When Yahweh stretches out his hand, the helper will stumble and the one helped will fall[c][b], and together all of them will come to an end.
translation:
  language: hi
  text: मिस्र मनुष्य है, परमेश्वर नहीं[a]; और उसके घोड़े शरीर हैं, आत्मा नहीं[b]। जब यहोवा अपना हाथ बढ़ाएगा, तब सहायता करनेवाला लड़खड़ाएगा और सहायता पानेवाला गिर पड़ेगा; वे सब मिलकर मिट जाएँगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मिस्र मानव है, परमेश्वर नहीं।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “आत्मा” का अर्थ श्वास, जीवन-शक्ति या अभौतिक सामर्थ्य भी हो सकता है; यह आवश्यक नहीं कि यहाँ सीधे पवित्र आत्मा का उल्लेख हो।
    reason: lexical_alternative
  - marker: c
    text: या, “वे सब नष्ट हो जाएँगे” अथवा “वे सब समाप्त हो जाएँगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  choice: मिस्र
  rationale: राष्ट्र के नाम का मानक हिन्दी रूप; यहाँ राष्ट्र को सामूहिक रूप से एक इकाई माना गया है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: परमेश्वर के विपरीत मिस्र की मानवीय और सृजित दशा बताता है; आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ सच्चे ईश्वरत्व और केवल मानवीय मिस्र के बीच विरोध है।
- source_word: סוּסֵיהֶם
  choice: उसके घोड़े
  rationale: हिब्रू का बहुवचन संबंधवाचक सर्वनाम सामूहिक राष्ट्र मिस्र की ओर संकेत करता है; हिन्दी में एकवचन 'उसके' स्वाभाविक है।
- source_word: בָּשָׂר
  choice: शरीर
  rationale: रूआख़ के साथ मूल विरोध बनाए रखता है और सृजित, नश्वर सामर्थ्य का भाव देता है; 'मांस' यहाँ घोड़ों के लिए कम स्वाभाविक होता।
- source_word: רוּחַ
  choice: आत्मा
  rationale: यह शरीर के विपरीत अभौतिक या जीवनदायी सामर्थ्य का व्यापक अर्थ सुरक्षित रखता है; इसे स्पष्ट रूप से पवित्र आत्मा नहीं बनाया गया।
- source_word: יהוה
  choice: यहोवा
  rationale: दिव्य नाम को नाम के रूप में प्रत्यक्ष प्रस्तुत करता है।
- source_word: יַטֶּה יָדוֹ
  choice: अपना हाथ बढ़ाएगा
  rationale: निर्णायक दैवी हस्तक्षेप या न्याय की हिब्रू अभिव्यक्ति का स्वाभाविक हिन्दी रूप।
- source_word: עוֹזֵר
  choice: सहायता करनेवाला
  rationale: सहायता देनेवाले पक्ष की भूमिका स्पष्ट करता है और अगले निष्क्रिय कृदंत से विरोध बनाए रखता है।
- source_word: עָזֻר
  choice: जिसकी सहायता की जा रही है
  rationale: निष्क्रिय कृदंत का अर्थ स्पष्ट रखता है और सहायता पानेवाले को सहायता देनेवाले से अलग करता है।
- source_word: כָשַׁל
  choice: लड़खड़ाएगा
  rationale: विफलता और गिरने की ओर बढ़ते ठोस चित्र को सुरक्षित रखता है।
- source_word: נָפַל
  choice: गिर पड़ेगा
  rationale: लड़खड़ाने के बाद पूर्ण पतन की क्रमिक तीव्रता स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִכְלָיוּן
  choice: मिट जाएँगे
  rationale: समाप्त हो जाने या नष्ट हो जाने का अर्थ देता है, जबकि वैकल्पिक तीव्रताओं को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: क्या רוּחַ को पवित्र आत्मा के स्पष्ट संकेत के रूप में समझा जाए
  choice: आत्मा
  alternative: श्वास; आत्मिक या अभौतिक सामर्थ्य; 'पवित्र आत्मा' का स्पष्ट संकेत
  rationale: पद शरीर और रूआख़ का विरोध करता है, पर सीधे पवित्र आत्मा नहीं कहता। इसलिए व्यापक अर्थ और धर्मवैज्ञानिक तनाव को खुला रखा गया है।
- issue: אָדָם द्वारा मिस्र की दशा का वर्णन
  choice: मनुष्य
  alternative: मानव; मनुष्यजाति
  rationale: बिंदु लिंग नहीं, बल्कि परमेश्वर के सामने मिस्र की केवल मानवीय, सृजित और सीमित दशा है; 'मनुष्य' मूल की संक्षिप्तता बनाए रखता है।
- issue: सहायता करनेवाले और सहायता पानेवाले की पहचान
  choice: भूमिका-आधारित सामान्य पद
  alternative: मिस्र और यहूदा को मुख्य पाठ में स्पष्ट नाम देना
  rationale: संदर्भ में ये पहचानें सम्भावित हैं, किन्तु इस पद के हिब्रू में संज्ञाएँ भूमिका के रूप में हैं; अनकही पहचान को मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और श्रव्य शैली। समानांतर विरोध—मनुष्य/परमेश्वर और शरीर/आत्मा—को बनाए रखा गया है। सहायक और सहायता पानेवाले के बीच हिब्रू शब्द-युग्म को स्पष्ट भूमिका-आधारित हिन्दी में प्रस्तुत किया गया है।
