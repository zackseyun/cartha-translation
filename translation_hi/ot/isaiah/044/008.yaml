base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/008.yaml
  text: Do not fear[a], and do not tremble. Have I not long ago made you hear and declared it? And you are my witnesses. Is there a God besides me? There is no Rock[c][b]; I know of none.
translation:
  language: hi
  text: मत डरो[a], न काँपो। क्या मैंने बहुत पहले[b] ही तुम्हें यह सुनाया और इसकी घोषणा नहीं की थी? तुम मेरे गवाह हो। क्या मेरे सिवा कोई परमेश्वर है? कोई चट्टान नहीं है; मैं ऐसी किसी चट्टान को नहीं जानता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मत डरो और आतंकित मत हो।” दूसरी क्रिया दुर्लभ है और सम्भवतः पहले निषेध को अधिक तीव्र बनाती है।
    reason: lexical_alternative
  - marker: b
    text: या, “क्या मैंने प्राचीनकाल से तुम्हें यह सुनाया और इसकी घोषणा नहीं की थी?”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְחֲדוּ
  choice: मत डरो
  rationale: פחד भय या दहशत को व्यक्त करता है। निषेध में ‘मत डरो’ संक्षिप्त, स्वाभाविक और अर्थ के निकट है।
- source_word: תִּרְהוּ
  choice: न काँपो
  rationale: यह दुर्लभ क्रिया पहले निषेध के समानांतर भय की तीव्र प्रतिक्रिया व्यक्त करती है। ‘न काँपो’ काव्यात्मक समानांतरता और अनिश्चित lexical बल दोनों को बनाए रखता है।
- source_word: מֵאָז
  choice: बहुत पहले
  rationale: यह पूर्वकाल की ओर संकेत करता है। ‘बहुत पहले’ आधुनिक हिन्दी में स्पष्ट है, जबकि ‘प्राचीनकाल से’ भी सम्भव है और पादटिप्पणी में दिया गया है।
- source_word: הִשְׁמַעְתִּיךָ
  choice: तुम्हें यह सुनाया
  rationale: שמע के हिफ़ील रूप में कारणवाचक अर्थ है—किसी को सुनाना या सुनने देना। हिन्दी में ‘तुम्हें यह सुनाया’ इस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְהִגַּדְתִּי
  choice: इसकी घोषणा की
  rationale: נגד के हिफ़ील का अर्थ बताना, प्रकट करना या घोषित करना है। ‘घोषणा की’ पद के सार्वजनिक और औपचारिक स्वर को बनाए रखता है।
- source_word: עֵדָי
  choice: मेरे गवाह
  rationale: संज्ञा बहुवचन है और संबोधित समुदाय की साक्ष्य देने वाली भूमिका को व्यक्त करती है।
- source_word: אֱלוֹהַּ
  choice: परमेश्वर
  rationale: यह प्रश्न यहोवा के अतिरिक्त किसी वास्तविक देवता के अस्तित्व को चुनौती देता है। ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय शैली में स्वाभाविक है और यहाँ किसी सामान्य मूर्ति मात्र से अधिक व्यापक दावे को व्यक्त करता है।
- source_word: מִבַּלְעָדַי
  choice: मेरे सिवा
  rationale: यह पद पूर्ण बहिष्कार व्यक्त करता है। ‘मेरे सिवा’ सहज हिन्दी में उसी विशिष्टता को रखता है।
- source_word: צוּר
  choice: चट्टान
  rationale: यह परमेश्वर के लिए रूपकात्मक उपाधि है, जो उसकी स्थिरता और भरोसेमंदी व्यक्त करती है। हिन्दी में बड़े अक्षर से उपाधि दिखाना सम्भव नहीं, इसलिए पादटिप्पणी इसका संकेत देती है।
- source_word: בַּל יָדָעְתִּי
  choice: मैं किसी को नहीं जानता
  rationale: यह बलयुक्त निषेध है। ‘किसी को’ निकटवर्ती ‘परमेश्वर/चट्टान’ के किसी अन्य दावेदार की ओर संकेत करता है और हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर की अद्वितीयता का आलंकारिक प्रश्न
  choice: ‘क्या मेरे सिवा कोई परमेश्वर है?’ और उसके बाद पूर्ण निषेध
  alternative: ‘क्या मेरे अतिरिक्त कोई देवता है?’
  rationale: संदर्भ मूर्तियों के विरुद्ध विवाद और इस्राएल के परमेश्वर की अद्वितीयता की घोषणा है। ‘परमेश्वर’ वास्तविक ईश्वरत्व के प्रश्न को व्यक्त करता है, जबकि उत्तर किसी अन्य को पूर्णतः नकारता है।
- issue: צוּר को परमेश्वर की रूपकात्मक उपाधि मानना
  choice: मुख्य पाठ में ‘चट्टान’, साथ में व्याख्यात्मक पादटिप्पणी
  alternative: रूपक को खोलकर ‘दृढ़ और भरोसेमंद परमेश्वर’ कहना
  rationale: मूल रूपक को ज्यों का त्यों रखना व्याख्यात्मक विस्तार से बचाता है। देवनागरी में capitalization न होने के कारण पादटिप्पणी इसके उपाधिगत प्रयोग को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। ‘तुम’ संबोधन उस सामूहिक समुदाय को स्वाभाविक हिन्दी में व्यक्त करता है जिसे इब्रानी व्याकरण एकवचन रूप में संबोधित करता है। मूल के आलंकारिक प्रश्न, साक्ष्य-विषयक भाषा और ‘चट्टान’ रूपक को बनाए रखा गया है।
