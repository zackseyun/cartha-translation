lexical_decisions:
- source_word: הָאֹמֵר
  choice: जो ... से कहता है
  rationale: संज्ञार्थक निश्चित कृदन्त पिछले प्रसंग में परमेश्वर के वर्णन को आगे बढ़ाता है। वर्तमानकालिक रूप कृदन्त का बल और वाक्य की प्रसंगगत निर्भरता बनाए रखता है।
- source_word: לַצּוּלָה
  choice: गहरे जल से
  rationale: צּוּלָה समुद्र अथवा अन्य जलराशि की गहराई/गहरे जल को दर्शाता है। ‘गहरे जल’ आधुनिक हिन्दी में स्वाभाविक है और जलीय अर्थ स्पष्ट रखता है।
- source_word: חֳרָבִי
  choice: सूख जा
  rationale: यह स्त्रीलिंग एकवचन आज्ञार्थक रूप है, जिसका सम्बोधन צּוּלָה से है। ‘सूख जा’ सीधा और स्वाभाविक हिन्दी आज्ञार्थ है।
- source_word: וְנַהֲרֹתַיִךְ
  choice: और ... तेरी नदियों को
  rationale: बहुवचन संज्ञा का मूल अर्थ ‘नदियाँ’ है और स्त्रीलिंग एकवचन प्रत्यय उसी गहरे जल को सम्बोधित करता है; ‘तेरी’ इस व्याकरणिक सम्बन्ध को बनाए रखता है।
- source_word: אוֹבִישׁ
  choice: मैं ... सुखा दूँगा
  rationale: יבש का हिफ़ील अपूर्ण 1 एकवचन कारणवाचक अर्थ देता है। ‘सुखा दूँगा’ भावी दैवी कार्य को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: वक्ता की पहचान और पिछले प्रसंग से वाक्य का सम्बन्ध
  choice: ‘जो ... कहता है’ को आश्रित सम्बन्धवाचक उपवाक्य के रूप में रखा और इस पद में ‘यहोवा’ नहीं जोड़ा।
  alternative: प्रसंग से स्पष्ट कर्ता ‘यहोवा’ को मुख्य पाठ में जोड़ना।
  rationale: इब्रानी पाठ पिछले पदों में परमेश्वर के वर्णन पर व्याकरणतः निर्भर है। कर्ता जोड़ने से मूल में अनुपस्थित शब्द आ जाता और साहित्यिक प्रवाह बदल जाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। परमेश्वर द्वारा जल को सीधे सम्बोधित किए जाने के कारण ‘जा’ और ‘तेरी’ के एकवचन रूप रखे गए हैं। उद्धरण-रचना इब्रानी में दो कथनों—आज्ञा और उसके बाद वक्ता की घोषणा—को स्पष्ट करती है।
