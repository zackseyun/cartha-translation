id: ISA.44.6
reference: Isaiah 44:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּֽה אָמַ֨ר יְהוָ֧ה מֶֽלֶךְ יִשְׂרָאֵ֛ל וְ/גֹאֲל֖/וֹ יְהוָ֣ה צְבָא֑וֹת אֲנִ֤י רִאשׁוֹן֙ וַ/אֲנִ֣י אַחֲר֔וֹן וּ/מִ/בַּלְעָדַ֖/י אֵ֥ין אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/006.yaml
  text: 'Thus says Yahweh[a], the King of Israel and his Redeemer, Yahweh of Armies: I am the first, and I am the last[b]; apart from me there is no God.'
translation:
  language: hi
  text: 'यहोवा—इस्राएल का राजा और उसका छुड़ानेवाला, सेनाओं का यहोवा—यों कहता है: “मैं प्रथम हूँ और मैं अन्तिम हूँ; मेरे सिवा कोई परमेश्वर नहीं है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित देवनागरी रूप ‘यहोवा’ परमेश्वर के व्यक्तिगत नाम को शीर्षक ‘प्रभु’ से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: यह इब्रानी संबंध-रचना का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: גֹאֲלוֹ
  choice: उसका छुड़ानेवाला
  rationale: यह रूप उद्धार अथवा बंधन से छुड़ाने की क्रिया को साधारण पाठक के लिए स्पष्ट रखता है; निकट संबंधी के कानूनी दायित्व की संभावित पृष्ठभूमि को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: צְבָאוֹת का मूल अर्थ ‘सेनाएँ/दल’ है। यह अनुवाद पारंपरिक किंतु आज कम पारदर्शी ‘सेनाओं का प्रभु’ में नाम को शीर्षक से बदलने या अर्थ-विस्तार करके ‘सर्वशक्तिमान’ कहने से बचता है।
- source_word: אֲנִי רִאשׁוֹן וַאֲנִי אַחֲרוֹן
  choice: मैं ही प्रथम हूँ और मैं ही अन्तिम हूँ
  rationale: दोनों स्पष्ट सर्वनामों और समानांतर, गंभीर लय को रखा गया है; ‘ही’ हिन्दी में आत्म-पहचान के बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּמִבַּלְעָדַי
  choice: मेरे सिवा
  rationale: यह बहिष्करण का संक्षिप्त और स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: אֵין אֱלֹהִים
  choice: कोई परमेश्वर नहीं है
  rationale: संदर्भ में यह यहोवा की अद्वितीय ईश्वरता की पूर्ण घोषणा है; ‘परमेश्वर’ हिन्दी में उस दावे को स्पष्ट करता है।
theological_decisions:
- issue: יְהוָה צְבָאוֹת का अनुवाद
  choice: सेनाओं का यहोवा
  alternative: सेनाओं का प्रभु; सर्वशक्तिमान यहोवा
  rationale: 'चुना हुआ रूप मूल पद के दोनों अंगों को अधिक प्रत्यक्ष रूप से रखता है: व्यक्तिगत नाम ‘यहोवा’ और ‘सेनाएँ’। ‘सर्वशक्तिमान’ अर्थ-सापेक्ष व्याख्या है, शाब्दिक समतुल्य नहीं।'
- issue: גֹאֲלוֹ में संबंधी-छुड़ानेवाले की संभावित छाया
  choice: उसका छुड़ानेवाला
  alternative: उसका निकट-संबंधी छुड़ानेवाला; उसका उद्धारकर्ता
  rationale: मूल शब्द में पारिवारिक-कानूनी पृष्ठभूमि हो सकती है, पर तत्काल वाक्य उस अर्थ को पूर्णतः निर्दिष्ट नहीं करता। इसलिए सामान्य क्रियात्मक अर्थ रखा गया है, बिना संभावित छाया को सिद्धांत रूप में थोपे।
- issue: אֵין אֱלֹהִים का एकेश्वरवादी बल
  choice: कोई परमेश्वर नहीं है
  alternative: कोई देवता नहीं है
  rationale: संदर्भ यहोवा की अद्वितीय ईश्वरता का निरपेक्ष दावा करता है। ‘परमेश्वर’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है; ‘देवता’ केवल प्रतिद्वंद्वी छोटे देवों के निषेध जैसा सुनाई दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण भविष्यद्वाणी शैली और साधारण पाठक के लिए स्पष्ट शब्दावली। ‘यों कहता है’ उद्घोषणात्मक सूत्र की औपचारिकता बनाए रखता है। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
