  yaml_path: translation/ot/isaiah/044/013.yaml
  text: The woodworker stretches out a line; he marks it out with a stylus; he shapes it with planes[a], and marks it out with a compass. He makes it like the form of a man, like the beauty of a human, to dwell in a house.
translation:
  language: hi
  text: लकड़ी का कारीगर डोरी तानता है; वह नुकीले निशान लगाने के औज़ार से उसकी रूपरेखा बनाता है; वह उसे रंदों[a] से आकार देता है और परकार से उसकी रूपरेखा खींचता है। वह उसे मनुष्य की आकृति में, मानव की सुंदरता के अनुरूप बनाता है, घर में रहने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “काटने के औज़ारों से”; इब्रानी शब्द संभवतः लकड़ी को आकार देने वाले रंदों या अन्य धारदार औज़ारों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרַשׁ עֵצִים
  choice: लकड़ी का कारीगर
  rationale: यह पदबंध लकड़ी पर काम करने वाले शिल्पी को दर्शाता है। ‘लकड़ी का कारीगर’ सामग्री और शिल्प, दोनों को स्पष्ट रखता है।
- source_word: נָטָה קָו
  choice: डोरी तानता है
  rationale: यह नाप और सीधी रूपरेखा निर्धारित करने के लिए डोरी फैलाने की ठोस क्रिया को व्यक्त करता है।
- source_word: יְתָאֲרֵהוּ
  choice: उसकी रूपरेखा बनाता है / उसकी रूपरेखा खींचता है
  rationale: क्रिया किसी वस्तु की आकृति अंकित या सीमांकित करने की ओर संकेत करती है; प्रसंगानुसार दोनों स्वाभाविक हिन्दी अभिव्यक्तियाँ प्रयुक्त हैं।
- source_word: בַשֶּׂרֶד
  choice: नुकीले निशान लगाने के औज़ार से
  rationale: इब्रानी संज्ञा का सटीक औज़ार अनिश्चित है; यह अनुवाद किसी विशेष सामग्री, जैसे लाल खड़िया, को निश्चित किए बिना अंकन के कार्य को स्पष्ट करता है।
- source_word: יַעֲשֵׂהוּ בַּמַּקְצֻעוֹת
  choice: उसे रंदों से आकार देता है
  rationale: बहुवचन संज्ञा लकड़ी काटने या समतल करने वाले औज़ारों की ओर संकेत करती है; ‘रंदों’ से कार्यशाला का ठोस चित्र मिलता है, जबकि अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: וּבַמְּחוּגָה
  choice: परकार से
  rationale: यह वृत्त या वक्र रेखा खींचने वाले उपकरण का सामान्य और सटीक हिन्दी नाम है।
- source_word: כְּתַבְנִית אִישׁ
  choice: मनुष्य की आकृति में
  rationale: תבנית का अर्थ रूप, नमूना या आकृति है; यहाँ बनाई गई मूर्ति के मानवीय आकार पर बल है।
- source_word: כְּתִפְאֶרֶת אָדָם
  choice: मानव की सुंदरता के अनुरूप
  rationale: תפארת में सुंदरता, शोभा और वैभव का अर्थ-क्षेत्र है। मूर्तिकार के सौंदर्यात्मक उद्देश्य के कारण ‘सुंदरता’ उपयुक्त है।
- source_word: לָשֶׁבֶת בָּיִת
  choice: ताकि वह किसी घर में विराजमान रहे
  rationale: ישׁב बैठने, रहने या स्थापित रहने का अर्थ दे सकता है। ‘विराजमान रहे’ मूर्ति के घर में रखे जाने और वहाँ स्थिर रहने को स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘घर’ को अनिवार्यतः ‘मंदिर’ मानने के।
theological_decisions:
- issue: אִישׁ और אָדָם का मानवीय संदर्भ
  choice: मनुष्य की आकृति में, मानव की सुंदरता के अनुरूप
  alternative: पुरुष की आकृति में, आदमी की शोभा के समान
  rationale: दोनों शब्द यहाँ देवता के विपरीत मानवीय रूप को दर्शाते हैं। ‘मनुष्य’ और ‘मानव’ सामान्य मानवीय संदर्भ को रखते हैं और आदम नाम का अनुचित संकेत नहीं देते।
- issue: לָשֶׁבֶת בָּיִת में मूर्ति की स्थिति
  choice: किसी घर में विराजमान रहे
  alternative: घर में बैठी रहे / मंदिर में रहे
  rationale: मूल का ‘बैठना/रहना’ वाला अर्थ खुला रखा गया है। ‘विराजमान’ स्थापित प्रतिमा के लिए स्वाभाविक है; ‘मंदिर’ कहने से בָּיִת को आवश्यकता से अधिक विशिष्ट कर दिया जाता।
translation_notes:
  register: 'आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और कार्यशाला की क्रमिक क्रियाओं को स्पष्ट रखने वाला अनुवाद। ‘विराजमान’ हल्की व्यंग्यात्मक विडंबना को भी सम्भव रखता है: मनुष्य की बनाई वस्तु घर में देव-प्रतिमा की तरह स्थापित रहती है।'
