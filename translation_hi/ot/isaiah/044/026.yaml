base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/026.yaml
  text: who confirms the word of his servant and fulfills the counsel of his messengers[a], who says of Jerusalem, ‘She will be inhabited,’ and of the cities of Judah, ‘They will be rebuilt,’ and ‘I will raise up her ruins.’
translation:
  language: hi
  text: जो अपने सेवक के वचन को स्थिर करता है और अपने दूतों[a] की सम्मति को पूरा करता है; जो यरूशलेम के विषय में कहता है, ‘वह बसाई जाएगी,’ और यहूदा के नगरों के विषय में, ‘वे बनाए जाएँगे; और उसके खंडहरों को मैं खड़ा करूँगा।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वर्गदूतों”; इब्रानी शब्द मानवीय दूतों या स्वर्गदूतों, दोनों के लिए प्रयुक्त हो सकता है। यहाँ प्रसंग संभवतः भविष्यद्वाणी का संदेश पहुँचानेवालों की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵקִים
  choice: पूरा करता है
  rationale: हिफ़ील कृदंत यहाँ सेवक के वचन को प्रभावी रूप से सिद्ध करने और घटित करने का भाव देता है। आधुनिक हिन्दी में ‘वचन को पूरा करता है’ स्वाभाविक है।
- source_word: דְּבַר עַבְדּוֹ
  choice: अपने सेवक के वचन
  rationale: דבר के औपचारिक अर्थ ‘वचन’ को और עבד के एकवचन को सुरक्षित रखा गया है; सेवक की पहचान निर्दिष्ट नहीं की गई।
- source_word: וַעֲצַת
  choice: सम्मति
  rationale: עצה में परामर्श, योजना या अभिप्राय का भाव हो सकता है। ‘सम्मति’ मूल की विचार-विमर्श संबंधी छाया को बनाए रखती है।
- source_word: מַלְאָכָיו
  choice: अपने दूतों
  rationale: מלאך मनुष्य-दूत या स्वर्गदूत दोनों को सूचित कर सकता है। सेवक के समानांतर भविष्यद्वाणी के प्रसंग में ‘दूतों’ को मुख्य पाठ में रखा गया, जबकि दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: יַשְׁלִים
  choice: सफल करता है
  rationale: हिफ़ील रूप किसी सम्मति या योजना को पूर्ण परिणाम तक पहुँचाने का अर्थ देता है। ‘सम्मति को सफल करता है’ प्रभावी संपादन को व्यक्त करता है।
- source_word: הָאֹמֵר
  choice: जो ... कहता है
  rationale: लेखयुक्त कृदंत परमेश्वर का वर्णन करते हुए संबंधवाचक प्रवाह बनाता है।
- source_word: לִירוּשָׁלִַם
  choice: यरूशलेम के विषय में
  rationale: לְ का शाब्दिक अर्थ ‘को’ हो सकता है, पर यहाँ नगर के संबंध में घोषणा का भाव है; हिन्दी में ‘के विषय में’ अधिक स्वाभाविक है।
- source_word: תּוּשָׁב
  choice: वह फिर बसाई जाएगी
  rationale: स्त्रीलिंग एकवचन निष्क्रिय रूप यरूशलेम के बसाए जाने को बताता है। विनाश के बाद पुनर्स्थापना के प्रसंग में ‘फिर’ निहित पुनर्बसाव को स्पष्ट करता है।
- source_word: תִּבָּנֶינָה
  choice: वे फिर बनाए जाएँगे
  rationale: निफ़अल बहुवचन का अर्थ ‘बनाए जाएँगे’ है; पुनर्स्थापना के प्रसंग में ‘फिर’ पुनर्निर्माण का निहित भाव प्रकट करता है।
- source_word: וְחָרְבוֹתֶיהָ
  choice: उसके खंडहरों
  rationale: חרבות उजड़े या ध्वस्त स्थानों को दर्शाता है। ‘खंडहर’ संक्षिप्त, वर्तमान और सहज हिन्दी है; स्त्रीलिंग प्रत्यय को ‘उसके’ द्वारा बनाए रखा गया है।
- source_word: אֲקוֹמֵם
  choice: मैं ... फिर खड़ा करूँगा
  rationale: קום का यह प्रथम पुरुष रूप खंडहरों को उठाने या पुनः स्थापित करने का जीवंत भाव देता है। ‘फिर खड़ा करूँगा’ पुनर्स्थापना को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘उसके सेवक’ और ‘उसके दूतों’ का संदर्भ
  choice: पहचान को अनिर्दिष्ट रखते हुए एकवचन ‘सेवक’ और बहुवचन ‘दूत’ सुरक्षित रखे गए
  alternative: सेवक को विशेष रूप से यशायाह मानना, अथवा दूतों को केवल भविष्यद्वक्ताओं या केवल स्वर्गदूतों के रूप में पहचानना
  rationale: पद स्वयं इनकी निश्चित पहचान नहीं बताता। अनुवाद व्याकरणिक रूपों और מלאך की अर्थगत व्यापकता को बनाए रखता है तथा किसी विशिष्ट धर्मवैज्ञानिक निष्कर्ष को पाठ में नहीं जोड़ता।
