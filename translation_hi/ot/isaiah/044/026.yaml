  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पुनर्स्थापना के प्रसंग को स्वाभाविक बनाने के लिए ‘फिर’ का प्रयोग किया गया है। मुख्य वाक्य की कृदंत-श्रृंखला और काव्यात्मक समानांतरता को यथासंभव सुरक्षित रखा गया है।
