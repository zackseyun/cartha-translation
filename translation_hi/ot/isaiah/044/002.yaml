source:
  edition: WLC
  text: כֹּה אָמַ֨ר יְהוָ֥ה עֹשֶׂ֛/ךָ וְ/יֹצֶרְ/ךָ֥ מִ/בֶּ֖טֶן יַעְזְרֶ֑/ךָּ אַל תִּירָא֙ עַבְדִּ֣/י יַֽעֲקֹ֔ב וִ/ישֻׁר֖וּן בָּחַ֥רְתִּי בֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/002.yaml
  text: 'Thus says Yahweh[a], your Maker and the one who formed you from the womb, who will help you: Do not fear, my servant Jacob, Jeshurun, whom I have chosen.'
translation:
  language: hi
  text: 'यहोवा यों कहता है—तुम्हारा बनानेवाला और गर्भ से तुम्हें रचनेवाला, जो तुम्हारी सहायता करेगा: “हे मेरे सेवक याकूब, हे यशुरून[a], जिसे मैंने चुना है, मत डर।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यशुरून इस्राएल का एक काव्यात्मक नाम है; इसका संभावित अर्थ “सीधा व्यक्ति” है।
    reason: काव्यात्मक नाम के संभावित शब्दार्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी में प्रचलित नाम-रूप से व्यक्त किया गया है।
- source_word: עֹשֶׂךָ
  choice: जो तुम्हें बनाता
  rationale: सहभागी क्रिया का व्यक्तिगत और निरंतर सृजनात्मक भाव बनाए रखता है तथा अगले समानांतर पद से स्वाभाविक रूप से जुड़ता है।
- source_word: וְיֹצֶרְךָ מִבֶּטֶן
  choice: और गर्भ से ही तुम्हें गढ़ता आया है
  rationale: יָצַר में निहित सोच-समझकर आकार देने के भाव को ‘गढ़ना’ व्यक्त करता है; ‘गर्भ से ही’ मूल रूपक और आरंभ-बिंदु को सुरक्षित रखता है।
- source_word: יַעְזְרֶךָּ
  choice: वही तुम्हारी सहायता करेगा
  rationale: अपूर्ण क्रिया के भावी आश्वासन को स्पष्ट करता है; ‘वही’ पूर्ववर्ती कर्ता से संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אַל־תִּירָא
  choice: मत डर
  rationale: निषेधात्मक आज्ञा का संक्षिप्त, सीधा और प्रचलित हिन्दी रूप।
- source_word: עַבְדִּי
  choice: मेरे सेवक
  rationale: इस वाचागत सामूहिक संबोधन में सेवा और परमेश्वर से संबंध का भाव प्रमुख है; ‘दास’ यहाँ अनावश्यक रूप से बंधुआ स्थिति पर बल दे सकता है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: व्यक्तिगत नाम और इस्राएल के सामूहिक नाम—दोनों रूपों में प्रचलित हिन्दी लिप्यंतरण।
- source_word: וִישֻׁרוּן
  choice: यशुरून
  rationale: इस्राएल के काव्यात्मक नाम को अनुवादित उपाधि बनाने के बजाय लिप्यंतरित किया गया है; संभावित अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: בָּחַרְתִּי בוֹ
  choice: जिसे मैंने चुना है
  rationale: इब्रानी पूर्ण क्रिया और उसके एकवचन कर्म को स्वाभाविक सम्बन्धवाचक हिन्दी में व्यक्त करता है तथा चुने जाने की वाचागत भाषा बनाए रखता है।
theological_decisions:
- issue: इस्राएल को सामूहिक रूप से संबोधित करते हुए एकवचन सर्वनाम
  choice: ‘तुम्हें/तुम्हारी’ जैसे एकवचन रूप रखे गए और ‘याकूब’ तथा ‘यशुरून’ को संबोधन में साथ रखा गया।
  alternative: इसे बहुवचन ‘तुम लोगों’ अथवा स्पष्ट रूप से ‘इस्राएल’ कहना।
  rationale: इब्रानी पाठ इस्राएल को एक सामूहिक व्यक्ति के रूप में एकवचन में संबोधित करता है; इसे बनाए रखने से नबी की शैली और वाचागत व्यक्तिकरण सुरक्षित रहता है।
- issue: יְשֻׁרוּן का स्वरूप
  choice: मुख्य पाठ में काव्यात्मक नाम ‘यशुरून’ रखा गया और अर्थ पाद-टिप्पणी में बताया गया।
  alternative: मुख्य पाठ में ‘सीधा/धर्मी जन’ जैसे अर्थानुवाद का प्रयोग।
  rationale: यहाँ शब्द इस्राएल के काव्यात्मक नाम की तरह कार्य करता है; लिप्यंतरण नाम को सुरक्षित रखता है और पाद-टिप्पणी उसकी संभावित शब्दार्थ-छाया बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बनाता’ और ‘गढ़ता’ द्वारा עשה तथा יצר का अंतर बनाए रखा गया है। संबोधन में ‘हे’ काव्यात्मक-भविष्यद्वक्तापूर्ण स्वर को स्वाभाविक ढंग से व्यक्त करता है।
