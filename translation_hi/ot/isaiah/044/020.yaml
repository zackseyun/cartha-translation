  text: רֹעֶ֣ה אֵ֔פֶר לֵ֥ב הוּתַ֖ל הִטָּ֑/הוּ וְ/לֹֽא יַצִּ֤יל אֶת נַפְשׁ/וֹ֙ וְ/לֹ֣א יֹאמַ֔ר הֲ/ל֥וֹא שֶׁ֖קֶר בִּ/ימִינִֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/020.yaml
  text: He feeds on ashes[a]; a deceived heart has led him astray, and he cannot deliver himself or say[b], “Is there not a lie in my right hand?”
translation:
  language: hi
  text: वह राख चरता है[a]; उसका भ्रमित मन उसे भटका चुका है। वह न तो अपने आप को बचा सकता है, न यह कह सकता है[b], “क्या मेरे दाहिने हाथ में कोई झूठी वस्तु नहीं है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह राख खाता है।” इब्रानी में चरने या चराने का रूपक सजीव है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “अपने नेफ़ेश को बचा नहीं सकता”; यहाँ इसका अर्थ “अपने आप को,” “अपने प्राण को,” या “अपने जीवन को” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה אֵפֶר
  choice: राख पर चरता है
  rationale: रעה के चरने/चराने के सजीव रूपक को बनाए रखता है; ‘राख’ אֵפֶר का सामान्य और संदर्भानुकूल अर्थ है।
- source_word: לֵב הוּתַל
  choice: धोखा खाया मन
  rationale: לֵב यहाँ विचार, विवेक और इच्छा को समेटता है। स्वाभाविक हिन्दी में ‘मन’ इस बौद्धिक-नैतिक अर्थ को व्यक्त करता है, जबकि ‘धोखा खाया’ हिब्रू के निष्क्रिय भाव को बनाए रखता है।
- source_word: הִטָּהוּ
  choice: उसे भटका दिया है
  rationale: हिफ़ील रूप किसी को सही मार्ग से मोड़ देने का भाव देता है; ‘भटका दिया’ नैतिक और धार्मिक विचलन को स्पष्ट करता है।
- source_word: וְלֹא יַצִּיל אֶת נַפְשׁוֹ
  choice: वह अपने आप को बचा नहीं सकता
  rationale: इस प्रसंग में נֶפֶשׁ पूरे व्यक्ति/स्वयं को सूचित करता है, किसी पृथक अमूर्त आत्मा को नहीं। सामर्थ्यहीनता का भाव प्रसंग से स्पष्ट है।
- source_word: הֲלוֹא שֶׁקֶר בִּימִינִי
  choice: क्या मेरे दाहिने हाथ में झूठ नहीं है?
  rationale: प्रश्नवाचक रूप और प्रथम पुरुष को बनाए रखते हुए मूर्ति को हाथ में थामे होने की सजीव छवि तथा उसके मिथ्यात्व दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: נֶפֶשׁ का मानवशास्त्रीय अर्थ
  choice: मुख्य पाठ में ‘अपने आप को’
  alternative: ‘अपने प्राण को’ या ‘अपनी आत्मा को’
  rationale: यहाँ बात मूर्तिपूजक के अपने पूरे व्यक्ति को विनाश और भ्रम से छुड़ा न पाने की है। ‘आत्मा’ लिखने से बाद की तकनीकी धार्मिक धारणा अनावश्यक रूप से आरोपित हो सकती है।
- issue: לֵב का अर्थ-क्षेत्र
  choice: ‘मन’
  alternative: ‘हृदय’
  rationale: इस पद में आत्म-परीक्षण और समझ की असमर्थता प्रमुख है; आधुनिक हिन्दी में ‘मन’ भावनाओं तक सीमित हुए बिना विचार और इच्छा को अधिक स्वाभाविक ढंग से व्यक्त करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘राख पर चरता है’ जानबूझकर असामान्य रखा गया है ताकि मूल इब्रानी का तीखा व्यंग्य और चराई का रूपक बना रहे।
