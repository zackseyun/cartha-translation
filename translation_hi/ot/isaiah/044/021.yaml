source:
  edition: WLC
  text: זְכָר אֵ֣לֶּה יַעֲקֹ֔ב וְ/יִשְׂרָאֵ֖ל כִּ֣י עַבְדִּ/י אָ֑תָּה יְצַרְתִּ֤י/ךָ עֶֽבֶד לִ/י֙ אַ֔תָּה יִשְׂרָאֵ֖ל לֹ֥א תִנָּשֵֽׁ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/021.yaml
  text: Remember these things[a], Jacob, and Israel, for you are my servant; I formed you; you are a servant to me. Israel, you will not be forgotten by me.
translation:
  language: hi
  text: हे याकूब, हे इस्राएल, इन बातों को याद रख, क्योंकि तू मेरा सेवक है। मैंने तुझे रचा है; तू मेरा सेवक है। हे इस्राएल, मैं तुझे नहीं भूलूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे इस्राएल, तू मुझे न भूलना।” हिब्रू रूप को इस अर्थ में भी समझा जा सकता है; कुछ व्याख्याकार इसे आश्वासन के बजाय आग्रह मानते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: זְכָר אֵלֶּה
  choice: इन बातों को याद रख
  rationale: זְכָר एकवचन पुल्लिंग आज्ञार्थक है और אֵלֶּה पिछली कही गई बातों की ओर संकेत करता है। ‘इन बातों को याद रख’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: יַעֲקֹב וְיִשְׂרָאֵל
  choice: हे याकूब, और हे इस्राएल
  rationale: दोनों नाम एक ही वाचा-समुदाय को सीधे संबोधित करते हैं। ‘हे’ संबोधन को स्पष्ट और गरिमापूर्ण रखता है।
- source_word: עַבְדִּי
  choice: मेरा सेवक
  rationale: עֶבֶד दास या सेवक दोनों अर्थ दे सकता है; यहाँ परमेश्वर के साथ इस्राएल का संबंध और नियुक्त सेवा प्रमुख है, इसलिए ‘सेवक’ उपयुक्त है।
- source_word: יְצַרְתִּיךָ
  choice: मैंने तुझे रचा है
  rationale: יָצַר में आकार देने और रचने का भाव है। ‘रचा’ सृष्टिकर्ता के कार्य को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֶבֶד לִי אָתָּה
  choice: तू मेरा सेवक है
  rationale: हिब्रू में ‘तू मेरे लिए/मेरा सेवक है’ का विधेयात्मक कथन है। हिन्दी में ‘तू मेरा सेवक है’ स्वाभाविक है और संबंध को बिना अतिरिक्त उद्देश्य-भाव जोड़े व्यक्त करता है।
- source_word: לֹא תִנָּשֵׁנִי
  choice: मैं तुझे नहीं भूलूँगा
  rationale: मुख्य पाठ निफ़ाल रूप को ‘तू मेरे द्वारा भुलाया नहीं जाएगा’ के आश्वासन के रूप में समझता है। सक्रिय हिन्दी वाक्य उसी अर्थ को अधिक स्वाभाविक ढंग से देता है। संभावित वैकल्पिक पठन पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: לֹא תִנָּשֵׁנִי में कर्ता-कर्म संबंध
  choice: 'परमेश्वर का आश्वासन: ‘मैं तुझे नहीं भूलूँगा’'
  alternative: 'इस्राएल के लिए आग्रह: ‘तू मुझे न भूलना’'
  rationale: निफ़ाल रूप और प्रसंग इस्राएल को परमेश्वर द्वारा न भुलाए जाने के आश्वासन का समर्थन करते हैं। फिर भी व्यंजनात्मक पाठ दूसरे अर्थ की अनुमति देता है, इसलिए वास्तविक व्याकरणिक और धर्मवैचारिक तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; एकवचन संबोधन ‘तू/तुझे’ मूल हिब्रू के एकवचन रूपों को दर्शाता है और यहाँ अनादर नहीं, बल्कि वाचा-संबंध की सीधी वाणी है। भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है।
