  text: חָרַ֤שׁ בַּרְזֶל֙ מַֽעֲצָ֔ד וּ/פָעַל֙ בַּ/פֶּחָ֔ם וּ/בַ/מַּקָּב֖וֹת יִצְּרֵ֑/הוּ וַ/יִּפְעָלֵ֨/הוּ֙ בִּ/זְר֣וֹעַ כֹּח֔/וֹ גַּם רָעֵב֙ וְ/אֵ֣ין כֹּ֔חַ לֹא שָׁ֥תָה מַ֖יִם וַ/יִּיעָֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/012.yaml
  text: The ironsmith works with a cutting tool and works over the coals; with hammers he shapes it and works it with his strong arm. He also becomes hungry[a], and there is no strength; he has not drunk water, and he grows faint.
translation:
  language: hi
  text: लोहार काटने के औज़ार[a] से काम करता है और अंगारों पर काम करता है; वह हथौड़ों से उसे आकार देता है और अपनी बलवान भुजा से उस पर काम करता है। वह भूखा भी हो जाता है और उसमें शक्ति नहीं रहती; उसने पानी नहीं पिया है और वह निढाल हो जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बसूला,’ ‘नक्काशी का औज़ार,’ अथवा ‘छेनी’; यहाँ बताए गए विशेष औज़ार की ठीक पहचान अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרַשׁ בַּרְזֶל
  choice: लोहार
  rationale: यह पदबंध लोहे का काम करने वाले कारीगर को दर्शाता है। ‘लोहार’ आधुनिक हिन्दी में स्वाभाविक, विशिष्ट और प्रसंगानुकूल है।
- source_word: מַעֲצָד
  choice: काटने का औज़ार
  rationale: इस शब्द से आकार देने या काटने का कोई औज़ार अभिप्रेत है, पर उसका ठीक प्रकार अनिश्चित है; सामान्य अभिव्यक्ति अनावश्यक विशिष्टता से बचती है।
- source_word: וּפָעַל ... וַיִּפְעָלֵהוּ
  choice: काम करता है ... उस पर काम करता है
  rationale: दोनों स्थानों पर एक ही धातु פעל की पुनरावृत्ति है; हिन्दी में भी उसे बनाए रखने से कारीगर के निरंतर परिश्रम पर बल बना रहता है।
- source_word: בַּפֶּחָם
  choice: अंगारों पर उसे तपाता है
  rationale: פֶּחָם धौंकनी में प्रयुक्त कोयले या अंगारों को दर्शाता है। हिन्दी में धातुकर्म की क्रिया को स्वाभाविक बनाने के लिए ‘अंगारों पर ... तपाता है’ कहा गया है।
- source_word: וּבַמַּקָּבוֹת יִצְּרֵהוּ
  choice: वह हथौड़ों से उसे आकार देता है
  rationale: मूल में ‘हथौड़े’ बहुवचन है और יצר का अर्थ आकार देना या गढ़ना है; अनिर्दिष्ट कर्म को ‘उसे’ द्वारा सुरक्षित रखा गया है।
- source_word: בִּזְרֹעַ כֹּחוֹ
  choice: अपनी बलवान भुजा से
  rationale: यह मूल के ‘अपनी शक्ति की भुजा से’ को सहज हिन्दी में व्यक्त करता है और शारीरिक श्रम की छवि बनाए रखता है।
- source_word: גַּם רָעֵב וְאֵין כֹּחַ
  choice: वह भूखा भी हो जाता है और उसमें शक्ति नहीं रहती
  rationale: यह कारीगर की क्रमिक शारीरिक क्षीणता को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא שָׁתָה מַיִם וַיִּיעָף
  choice: उसने पानी नहीं पिया है और वह निढाल हो जाता है
  rationale: पूर्ण क्रिया को वर्तमान परिणाम वाली अवस्था के रूप में रखा गया है; ‘निढाल’ थकावट और मूर्छित होने की सीमा तक पहुँची निर्बलता दोनों को व्यक्त करता है।
theological_decisions:
- issue: मूर्ति-निर्माण पर भविष्यद्वक्ता का व्यंग्य
  choice: कारीगर के कठिन श्रम और मानवीय निर्बलता का ठोस वर्णन किया गया है, बिना मुख्य पाठ में उसकी व्यर्थता की व्याख्या जोड़े।
  alternative: मुख्य पाठ में ही मूर्तिपूजा की व्यर्थता को स्पष्ट करने वाला व्याख्यात्मक वाक्य जोड़ना।
  rationale: व्यापक प्रसंग मूर्ति-निर्माण का उपहास करता है, पर इस पद का अपना बल कारीगर के श्रम, भूख, प्यास और निर्बलता के सीधे चित्रण से उत्पन्न होता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘लोहार,’ ‘अंगारे,’ ‘हथौड़े’ और ‘बलवान भुजा’ कार्यशाला की ठोस छवि बनाए रखते हैं; कठिन औज़ार-नाम को मुख्य पाठ में सामान्य रखा गया है और विकल्प पाद-टिप्पणी में दिए गए हैं।
