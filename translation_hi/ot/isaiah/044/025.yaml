source:
  edition: WLC
  text: מֵפֵר֙ אֹת֣וֹת בַּדִּ֔ים וְ/קֹסְמִ֖ים יְהוֹלֵ֑ל מֵשִׁ֧יב חֲכָמִ֛ים אָח֖וֹר וְ/דַעְתָּ֥/ם יְשַׂכֵּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/025.yaml
  text: who frustrates the signs of liars and makes diviners act like fools, who turns wise men back and makes their knowledge foolish,
translation:
  language: hi
  text: जो झूठ बोलनेवालों के चिन्हों को निष्फल करता है और भविष्य बतानेवालों को मूर्ख बना देता है, जो बुद्धिमानों को पीछे लौटा देता है और उनके ज्ञान को मूर्खतापूर्ण बना देता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵפֵר
  choice: निष्फल कर देता है
  rationale: हिफ़ील कृदंत का अर्थ किसी योजना, संकेत या दावे को विफल अथवा प्रभावहीन करना है; यहाँ ‘निष्फल करना’ स्वाभाविक और संदर्भानुकूल है।
- source_word: בַּדִּים
  choice: झूठों
  rationale: इस बहुवचन शब्द का अर्थ यहाँ झूठ बोलनेवाले या झूठे दावे करनेवाले लोग है। अंग्रेज़ी परामर्श-पाठ के ‘liars’ से भी इसकी पुष्टि होती है, यद्यपि ‘डींग मारनेवाले’ एक संभावित वैकल्पिक समझ है।
- source_word: קֹסְמִים
  choice: शकुन बतानेवालों
  rationale: यह जादुई या गुप्त साधनों से भविष्य अथवा दैवी इच्छा जानने का दावा करनेवालों को दर्शाता है; ‘शकुन बतानेवाले’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: יְהוֹלֵל
  choice: मूर्ख बना देता है
  rationale: पिलपेल रूप का कारक अर्थ है ‘मूर्ख जैसा कर देना’ या ‘मूर्ख बना देना’।
- source_word: מֵשִׁיב ... אָחוֹר
  choice: पीछे हटा देता है
  rationale: शाब्दिक भाव ‘पीछे फेरना’ है; यह उनकी दिशा, योजना या दावे को उलट देने की छवि बनाए रखता है।
- source_word: יְשַׂכֵּל
  choice: मूर्खता ठहराता है
  rationale: यहाँ क्रिया का अर्थ ज्ञान को मूर्खतापूर्ण सिद्ध या बना देना है; ‘मूर्खता ठहराता है’ परिणाम और मूल्यांकन दोनों को व्यक्त करता है।
theological_decisions:
- issue: झूठे संकेतों और दिव्यज्ञान के दावों पर परमेश्वर की प्रभुता
  choice: पद को समानांतर कृदंत वाक्यांशों के रूप में रखा गया है, जिनमें परमेश्वर झूठे चिन्हों को विफल और मानवीय ज्ञान को मूर्खता सिद्ध करता है।
  alternative: इसे केवल भविष्यवाणियों के पूरा न होने या व्यक्तियों के मानसिक रूप से पागल हो जाने के अर्थ में सीमित करना।
  rationale: इब्रानी पाठ व्यापक और काव्यात्मक है; अनुवाद किसी एक संकीर्ण धर्मवैज्ञानिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और काव्यात्मक समानांतरता को बनाए रखने वाला रूप। ‘बतानेवालों’ की संयुक्त वर्तनी अपनाई गई है।
