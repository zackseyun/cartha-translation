id: ISA.44.11
reference: Isaiah 44:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֵ֤ן כָּל חֲבֵרָי/ו֙ יֵבֹ֔שׁוּ וְ/חָרָשִׁ֥ים הֵ֖מָּה מֵֽ/אָדָ֑ם יִֽתְקַבְּצ֤וּ כֻלָּ/ם֙ יַֽעֲמֹ֔דוּ יִפְחֲד֖וּ יֵבֹ֥שׁוּ יָֽחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/011.yaml
  text: Look[a], all his companions will be put to shame, and the craftsmen are only men. Let them all gather and stand up; they will be terrified[b], they will be put to shame together.
translation:
  language: hi
  text: देखो, उसके सभी साथी लज्जित होंगे, और कारीगर तो केवल मनुष्य ही हैं।[a] वे सब इकट्ठे होकर खड़े हों; वे भयभीत होंगे और सब मिलकर लज्जित होंगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मनुष्य से हैं” या “मानवजाति में से हैं”; आशय है कि कारीगर दैवी नहीं, मात्र मनुष्य हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “वे सब इकट्ठे होंगे और खड़े होंगे; वे भयभीत होंगे और सब मिलकर लज्जित होंगे।” हिब्रू क्रियारूपों को चुनौती के साथ-साथ भविष्यवाणी के रूप में भी समझा जा सकता है।
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला जोरदार उद्गार है; आधुनिक हिन्दी में “देखो” स्वाभाविक और स्पष्ट है।
- source_word: חֲבֵרָיו
  choice: उसके सभी साथी
  rationale: यह मूर्ति अथवा मूर्ति बनाने वाले से जुड़े लोगों को सूचित करता है; “साथी” संबंध को बनाए रखता है, पर किसी विशेष पेशेवर संघ का अर्थ नहीं थोपता।
- source_word: יֵבֹשׁוּ
  choice: लज्जित होंगे
  rationale: यहाँ भावी अपमान और निराशा का भाव है। यही पद आगे दोबारा आया है, इसलिए दोनों स्थानों पर एकरूप अनुवाद रखा गया है।
- source_word: וְחָרָשִׁים
  choice: और कारीगर
  rationale: חָרָשׁ व्यापक रूप से कुशल शिल्पकार या निर्माता को दर्शाता है; इसे केवल लोहार तक सीमित करना उचित नहीं।
- source_word: הֵמָּה מֵאָדָם
  choice: तो केवल मनुष्य ही हैं
  rationale: यह वाक्यांश कारीगरों की मात्र मानवीय स्थिति पर जोर देता है और उन्हें किसी दैवी सामर्थ्य से रहित दिखाता है। “तो” और “ही” इस सीमित करने वाले बल को स्वाभाविक हिन्दी में व्यक्त करते हैं।
- source_word: יִתְקַבְּצוּ כֻלָּם יַעֲמֹדוּ
  choice: वे सब इकट्ठे होकर खड़े हों
  rationale: संदर्भ में अपूर्ण क्रियाएँ चुनौती या आह्वान के रूप में समझी जा सकती हैं। यह अनुवाद उसी भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: יִפְחֲדוּ
  choice: वे भयभीत होंगे
  rationale: क्रिया न्याय अथवा सामना होने पर उत्पन्न तीव्र भय को प्रकट करती है।
- source_word: יָחַד
  choice: सब मिलकर
  rationale: यह उनके साझे परिणाम को बताता है; “सब मिलकर” हिन्दी में सामूहिकता को स्पष्ट करता है।
theological_decisions:
- issue: מֵאָדָם में मानवता और देवत्व का विरोध
  choice: केवल मनुष्य ही हैं
  alternative: मानवजाति में से हैं / मनुष्य से हैं
  rationale: हिब्रू का मुख्य बल कारीगरों के उद्गम की तकनीकी व्याख्या पर नहीं, बल्कि इस बात पर है कि वे दैवी नहीं, मात्र मानव हैं।
- issue: יִתְקַבְּצוּ और יַעֲמֹדוּ का विधिलिंग अथवा भविष्यकालीन अर्थ
  choice: वे सब इकट्ठे होकर खड़े हों
  alternative: वे सब इकट्ठे होंगे और खड़े होंगे
  rationale: मूर्ति बनाने वालों को चुनौती देने वाला संदर्भ विधिलिंग का समर्थन करता है, किंतु हिब्रू अपूर्ण रूप भविष्यकालीन कथन के रूप में भी समझे जा सकते हैं; इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “कारीगर” मूल के व्यापक शिल्पकारी अर्थ को बनाए रखता है। विधिलिंग और भविष्यकाल के बीच हिब्रू की वास्तविक अस्पष्टता को मुख्य पाठ तथा पादटिप्पणी में सुरक्षित रखा गया है।
