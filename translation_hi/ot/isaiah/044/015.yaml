  yaml_path: translation/ot/isaiah/044/015.yaml
  text: Then it becomes fuel for a man[a], and he takes some of them and warms himself; he also kindles a fire and bakes bread. He also makes a god and bows down; he makes it a carved image and prostrates himself before it.
translation:
  language: hi
  text: तब वह मनुष्य के लिए ईंधन हो जाता है। वह उसमें से कुछ लेता है और अपने को गरम करता है; वह आग भी जलाता है और रोटी पकाता है। वह एक देवता भी बनाता है और उसके आगे झुकता है; उसी को एक तराशी हुई मूर्ति बनाता है और उसके आगे दंडवत करता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में यहाँ “उनके आगे” का रूपतः बहुवचन सर्वनाम है, यद्यपि निकटवर्ती शब्द “मूर्ति” एकवचन है। यह काव्यात्मक प्रयोग हो सकता है या लकड़ी के टुकड़ों अथवा बनाई गई वस्तुओं के सामूहिक संदर्भ का संकेत हो सकता है।
    reason: लָמוֹ के रूपतः बहुवचन रूप और उसके एकवचन निकटवर्ती संदर्भ के बीच की वास्तविक पाठगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וְהָיָה לְאָדָם לְבָעֵר
  choice: तब वह मनुष्य के लिए ईंधन बन जाता है
  rationale: लְבָעֵר लकड़ी के जलाने योग्य साधन बनने का परिणाम बताता है; ‘ईंधन’ स्वाभाविक हिन्दी है। לְאָדָם को एकवचन सामान्य अर्थ में ‘मनुष्य’ रखा गया है।
- source_word: וַיִּקַּח מֵהֶם וַיָּחָם
  choice: वह उसमें से कुछ लेकर अपने को गरम करता है
  rationale: מֵהֶם का अंशवाचक भाव ‘कुछ’ से व्यक्त होता है। हिन्दी में संदर्भित लकड़ी को सामूहिक एकवचन मानकर ‘उसमें से’ स्वाभाविक है। וַיָּחָם का प्रसंगगत आशय स्वयं को गरम करना है।
- source_word: אַף יַשִּׂיק וְאָפָה לָחֶם
  choice: आग भी जलाता और रोटी पकाता है
  rationale: אַף योगात्मक ‘भी’ है; יַשִּׂיק के साथ प्रसंग से निहित ‘आग’ जोड़ने पर आधुनिक हिन्दी में अर्थ स्पष्ट और सहज रहता है।
- source_word: אַף יִפְעַל אֵל
  choice: फिर वह एक देवता भी बनाता
  rationale: אֵל को ‘देवता’ रखने से मनुष्य द्वारा पूज्य सत्ता गढ़ने की व्यंग्यात्मक विडंबना बनी रहती है; इसे पहले ही ‘मूर्ति’ या ‘मिथ्या देवता’ कहकर नहीं सुलझाया गया।
- source_word: וַיִּשְׁתָּחוּ
  choice: उसके आगे झुकता है
  rationale: क्रिया के मूल शारीरिक भाव—झुकना—को स्पष्ट रखा गया है; ‘पूजा करता है’ अर्थ को व्याख्यात्मक रूप से संकुचित करता।
- source_word: פֶסֶל
  choice: एक खुदी हुई मूर्ति
  rationale: פֶסֶל गढ़ी या तराशी गई उपासना-प्रतिमा है। ‘खुदी हुई मूर्ति’ निर्माण के पहलू को बनाए रखती है और ‘खुदी हुई प्रतिमा’ की अपेक्षा सामान्य पाठक के लिए अधिक सहज है।
- source_word: וַיִּסְגָּד לָמוֹ
  choice: उसके आगे दंडवत करता है
  rationale: סגד पूर्ण प्रणति का संकेत देता है, इसलिए पहले प्रयुक्त ‘झुकता’ से भिन्न ‘दंडवत करता’ उपयुक्त है। לָמוֹ का रूप बहुवचन हो सकता है, पर निकटवर्ती פֶסֶל एकवचन है; मुख्य पाठ में स्वाभाविक एकवचन रखा और रूपगत अस्पष्टता पादटिप्पणी में दी गई है।
theological_decisions:
- issue: निर्मित देवता और खुदी हुई मूर्ति के बीच भविष्यद्वक्तीय विडंबना
  choice: एक देवता भी बनाता ... एक खुदी हुई मूर्ति बनाता
  alternative: एक मूर्ति बनाता ... एक खुदी हुई मूर्ति बनाता
  rationale: मूल में אֵל और פֶסֶל अलग शब्द हैं। ‘देवता’ और ‘मूर्ति’ दोनों को बनाए रखने से यह तनाव सुरक्षित रहता है कि कारीगर जिस वस्तु को देवता मानता है, वह उसी के हाथ की बनाई मूर्ति है।
- issue: לָמוֹ की संख्या और उसका संदर्भ
  choice: मुख्य पाठ में ‘उसके आगे’, पादटिप्पणी में ‘उनके आगे’
  alternative: मुख्य पाठ में ‘उनके आगे’
  rationale: לָמוֹ रूपतः बहुवचन ‘उनके लिए/उनके आगे’ समझा जा सकता है, पर तत्काल पूर्ववर्ती פֶסֶל एकवचन है और हिन्दी में बहुवचन असंगत लगेगा। एकवचन मुख्य पाठ को स्वाभाविक रखता है, जबकि पादटिप्पणी वास्तविक हिब्रू अस्पष्टता सुरक्षित करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण गद्य। ‘ईंधन’, ‘देवता’, ‘खुदी हुई मूर्ति’ और ‘दंडवत’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल की क्रिया-श्रृंखला और व्यंग्य को बनाए रखते हैं।
