id: ISA.44.9
reference: Isaiah 44:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יֹֽצְרֵי פֶ֤סֶל כֻּלָּ/ם֙ תֹּ֔הוּ וַ/חֲמוּדֵי/הֶ֖ם בַּל יוֹעִ֑ילוּ וְ/עֵדֵי/הֶ֣ם הֵׄ֗מָּׄהׄ בַּל יִרְא֛וּ וּ/בַל יֵדְע֖וּ לְמַ֥עַן יֵבֹֽשׁוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/009.yaml
  text: All who fashion an idol are nothing[a], and the things they delight in do not profit. Their witnesses neither see nor know[d][c][b], so that they will be put to shame.
translation:
  language: hi
  text: मूर्ति गढ़नेवाले सभी व्यर्थ हैं[a], और उनकी प्रिय वस्तुएँ किसी काम की नहीं हैं[b]। उनके साक्षी[c] न तो देखते हैं, न जानते हैं, जिससे वे लज्जित हों[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सभी मूर्ति बनानेवाले कुछ नहीं हैं” अथवा “सभी गढ़ी हुई मूर्ति बनानेवाले निरर्थक हैं।”
    reason: lexical_alternative
  - marker: b
    text: या “उनकी बहुमूल्य वस्तुएँ” अथवा “उनकी मनभावनी वस्तुएँ।”
    reason: lexical_alternative
  - marker: c
    text: “उनके साक्षी” मूर्तियों के पक्ष में गवाही देनेवाले उपासकों को, या व्यंग्य के रूप में स्वयं मूर्तियों को सूचित कर सकता है।
    reason: alternative_reading
  - marker: d
    text: या “फलतः वे लज्जित होंगे” अथवा “ताकि वे लज्जित हों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹצְרֵי פֶסֶל
  choice: मूर्ति गढ़नेवाले
  rationale: יֹצְרֵי का अर्थ ‘गढ़ने/रचनेवाले’ और פֶסֶל का अर्थ गढ़ी या तराशी हुई मूर्ति है। यह चयन मूर्ति बनाने की ठोस क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כֻּלָּם
  choice: सभी
  rationale: सहभागी पदबंध के साथ इसे ‘मूर्ति गढ़नेवाले सभी’ रखना हिन्दी में सहज है और ‘उन सब’ का पूरा अर्थ देता है।
- source_word: תֹּהוּ
  choice: व्यर्थ
  rationale: यहाँ शब्द आदिम अव्यवस्था नहीं, बल्कि खोखलेपन, निष्फलता और मूल्यहीनता को व्यक्त करता है। ‘व्यर्थ’ उस निंदात्मक बल को बिना तत्त्वमीमांसात्मक अतिशयोक्ति के बनाए रखता है।
- source_word: וַחֲמוּדֵיהֶם
  choice: उनकी प्रिय वस्तुएँ
  rationale: חמד से बना यह पद चाही हुई, बहुमूल्य या मनभावनी वस्तुओं का संकेत करता है। ‘प्रिय वस्तुएँ’ भावात्मक अर्थ को रखता है, पर उन्हें स्पष्ट रूप से केवल मूर्तियाँ बताकर मूल की व्यापकता सीमित नहीं करता।
- source_word: בַּל יוֹעִילוּ
  choice: किसी काम की नहीं हैं
  rationale: क्रिया का अर्थ लाभ पहुँचाना या उपयोगी होना है। यह हिन्दी मुहावरा मूल में व्यक्त पूर्ण निष्फलता को साफ और स्वाभाविक ढंग से बताता है।
- source_word: וְעֵדֵיהֶם הֵמָּה
  choice: उनके साक्षी
  rationale: 'शाब्दिक संबंध और संदर्भगत अस्पष्टता दोनों सुरक्षित हैं: ये मूर्तियों के पक्ष में गवाही देनेवाले उपासक हो सकते हैं, या व्यंग्यतः मूर्तियाँ स्वयं। अलग से הֵמָּה का अनुवाद जोड़ने पर हिन्दी भारी होती; उसका बल वाक्य के कर्ता में समाहित है।'
- source_word: בַּל יִרְאוּ וּבַל יֵדְעוּ
  choice: न तो देखते हैं, न जानते हैं
  rationale: दोनों नकारात्मक क्रियाओं को समानांतर हिन्दी संरचना में रखा गया है, जिससे अंधता और अज्ञान—दोनों आरोप बने रहते हैं।
- source_word: לְמַעַן יֵבֹשׁוּ
  choice: जिससे वे लज्जित हों
  rationale: לְמַעַן उद्देश्य अथवा परिणाम सूचित कर सकता है। ‘जिससे’ इस संबंध को स्वाभाविक हिन्दी में रखता है और ‘हों’ मूल के संभाव्य/लक्षित भाव को व्यक्त करता है।
theological_decisions:
- issue: ‘उनके साक्षी’ का संकेत
  choice: मुख्य पाठ में संकेत अनिर्धारित रखा गया है।
  alternative: इसे केवल मूर्तिपूजकों अथवा केवल मूर्तियों के लिए स्पष्ट कर देना।
  rationale: बहुवचन क्रियाएँ ‘न देखते’ और ‘न जानते’ मूर्तिपूजकों पर आरोप हो सकती हैं, और निर्जीव मूर्तियों पर व्यंग्य भी। मूल पाठ दोनों को संभव रहने देता है।
- issue: תֹּהוּ का आशय
  choice: 'व्यावहारिक निष्फलता और मूल्यहीनता: ‘व्यर्थ’।'
  alternative: ‘शून्य’, ‘कुछ नहीं’ या ‘अव्यवस्था’।
  rationale: इस प्रसंग में मूर्ति-निर्माताओं और उनकी वस्तुओं की निरर्थकता पर प्रहार है; सृष्टि-पूर्व अराजकता या उनके तत्त्वतः अस्तित्वहीन होने की घोषणा आवश्यक नहीं।
- issue: לְמַעַן का उद्देश्य या परिणाम
  choice: ‘जिससे’ द्वारा दोनों संभावनाओं के लिए स्थान रखा गया है।
  alternative: ‘इसलिए वे लज्जित होंगे’ केवल परिणाम पर, या ‘ताकि वे लज्जित हों’ केवल उद्देश्य पर अधिक बल देता।
  rationale: इब्रानी अव्यय उद्देश्य और परिणाम दोनों व्यक्त कर सकता है; अनुवाद को अनावश्यक रूप से किसी एक पर निर्णायक नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य स्तर रखा गया है। ‘मूर्ति गढ़नेवाले’, ‘प्रिय वस्तुएँ’ और ‘किसी काम की नहीं’ सामान्य पाठक के लिए स्पष्ट हैं; ‘साक्षी’ भविष्यद्वाणी के गंभीर लहजे और मूल की संदर्भगत अस्पष्टता को बनाए रखता है।
