- source_word: כַּעֲרָבִים
  choice: जैसे ... बेंत-वृक्ष
  rationale: עֲרָבִים जल के पास उगने वाले Salix-वंश के वृक्षों के लिए परंपरागत रूप से समझा जाता है; हिन्दी में वृक्षार्थ स्पष्ट करने के लिए ‘बेंत-वृक्ष’ चुना गया है, जबकि वनस्पति-पहचान की अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: עַל יִבְלֵי מָיִם
  choice: जलधाराओं के किनारे
  rationale: यह पदबंध बहती जल-नालियों या जलधाराओं के पास की स्थिति दर्शाता है; यह हिन्दी में स्पष्ट और काव्यात्मक है।
