- source_word: וְצָמְחוּ
  choice: और वे ... फूट निकलेंगे
  rationale: क़ाल रूप वनस्पति के अंकुरित होने या उग आने का सजीव बोध देता है; भविष्यकाल भी सुरक्षित रहता है।
- source_word: בְּבֵין חָצִיר
  choice: घास के बीच
