id: ISA.44.22
reference: Isaiah 44:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מָחִ֤יתִי כָ/עָב֙ פְּשָׁעֶ֔י/ךָ וְ/כֶ/עָנָ֖ן חַטֹּאותֶ֑י/ךָ שׁוּבָ֥/ה אֵלַ֖/י כִּ֥י גְאַלְתִּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/022.yaml
  text: I have wiped away your transgressions like a cloud[a], and your sins like a mist. Return to me[c][b], for I have redeemed you.
translation:
  language: hi
  text: मैंने तेरे अपराधों को घने बादल की तरह और तेरे पापों को बादल की तरह मिटा दिया है[a]। मेरी ओर लौट आ[b], क्योंकि मैंने तुझे छुड़ा लिया है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने तेरे अपराधों को बादल के समान और तेरे पापों को बादल/कुहरे के समान पोंछकर मिटा दिया है।” इब्रानी काव्य-समानांतरता में बादल के लिए दो निकटार्थी शब्द आए हैं।
    reason: lexical_alternative
  - marker: b
    text: “मेरी ओर लौट आ” का अनुवाद “मेरी ओर फिर जा” या “मेरे पास वापस आ” भी हो सकता है; इसमें वाचा के संबंध में लौटने और पश्चात्ताप करने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'भविष्यसूचक शैली में पूर्ण क्रियाओं को संभवतः इस प्रकार भी समझा जा सकता है: “मैं मिटा दूँगा ... मैं तुझे छुड़ा लूँगा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: מָחִיתִי
  choice: मिटा दिया है
  rationale: मחה का अर्थ पोंछकर मिटाना, लोप कर देना या मिटा देना हो सकता है। यहाँ बादलों के विलीन हो जाने की उपमा के साथ ‘मिटा दिया है’ स्वाभाविक है और पूर्ण हो चुके कार्य के वर्तमान परिणाम को भी व्यक्त करता है।
- source_word: כָעָב
  choice: घने बादल की तरह
  rationale: כ तुलना सूचित करता है और עָב प्रायः घने बादल को दर्शाता है। ‘घने बादल की तरह’ मूल बिंब और पहले बादल-शब्द की विशिष्टता को बनाए रखता है।
- source_word: פְּשָׁעֶיךָ
  choice: तेरे अपराधों
  rationale: פשע में सीमा-उल्लंघन अथवा विद्रोह का भाव है। ‘अपराध’ सामान्य ‘गलती’ से अधिक गंभीर नैतिक अर्थ रखता है, पर अनावश्यक रूप से राजनीतिक विद्रोह तक अर्थ को सीमित नहीं करता।
- source_word: וְכֶעָנָן
  choice: और ... बादल की तरह
  rationale: עָנָן का सामान्य अर्थ ‘बादल’ है। मूल की समानांतर काव्य-पंक्ति में प्रयुक्त दो निकटार्थी बादल-शब्दों को कृत्रिम रूप से बहुत अलग किए बिना यहाँ ‘बादल’ रखा गया है।
- source_word: חַטֹּאותֶיךָ
  choice: तेरे पापों
  rationale: חטאות के लिए ‘पाप’ संदर्भानुकूल और व्यापक रूप से समझा जाने वाला नैतिक-धार्मिक शब्द है।
- source_word: שׁוּבָה אֵלַי
  choice: मेरी ओर लौट आ
  rationale: שוב का आदेशात्मक रूप वापस मुड़ने, संबंध में लौटने और पश्चात्ताप—इन सभी भावों को वहन कर सकता है। ‘मेरी ओर लौट आ’ उस दिशात्मक और संबंधपरक बल को सहज हिन्दी में रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: 'כִּי यहाँ लौटने की आज्ञा का आधार बताता है: परमेश्वर का छुड़ाने का कार्य। ‘क्योंकि’ इस कारणसूचक संबंध को स्पष्ट रखता है।'
- source_word: גְאַלְתִּיךָ
  choice: मैंने तुझे छुड़ा लिया है
  rationale: גאל निकट संबंधी द्वारा छुड़ाने, अपना दावा करके वापस लेने और उद्धार करने का प्रमुख वाचा-संबंधी शब्द है। ‘छुड़ा लिया है’ आधुनिक हिन्दी में स्वाभाविक है और मुक्ति के मूल भाव को बिना किसी एक तंत्र तक सीमित किए व्यक्त करता है।
theological_decisions:
- issue: पूर्ण क्रियाओं מָחִיתִי और גְאַלְתִּיךָ का काल-पक्ष
  choice: 'दोनों को वर्तमान परिणाम वाली पूर्ण क्रिया के रूप में प्रस्तुत किया गया है: ‘मिटा दिया है ... छुड़ा लिया है।’'
  alternative: भविष्यसूचक पूर्ण के रूप में ‘मिटा दूँगा ... छुड़ा लूँगा,’ अथवा सामान्य भूतकाल में ‘मिटा दिया ... छुड़ा लिया।’
  rationale: संदर्भ में लौटने की पुकार परमेश्वर के पूर्ण अथवा सुनिश्चित घोषित कार्य पर आधारित है। हिन्दी का पूर्ण वर्तमान उस पूरे हुए कार्य की वर्तमान प्रासंगिकता दिखाता है; भविष्यसूचक अर्थ की वास्तविक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। परमेश्वर द्वारा एकवचन इस्राएल को संबोधन के कारण ‘तेरे/तुझे’ रखा गया है। काव्यात्मक समानांतरता को एक संतुलित वाक्य में सुरक्षित रखा गया है।
