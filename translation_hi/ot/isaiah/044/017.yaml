base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/017.yaml
  text: And with the rest of it he makes a god—his carved image[a]; he bows down to it and worships, and prays to it and says, “Deliver me[b], for you are my god.”
translation:
  language: hi
  text: और बचे हुए भाग से वह एक देवता—अपनी तराशी हुई मूर्ति[a]—बनाता है; वह उसके आगे झुकता और दण्डवत करता है, उससे प्रार्थना करता और कहता है, “मुझे बचा ले, क्योंकि तू मेरा देवता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी मूर्ति।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאֵרִיתוֹ
  choice: और बचे हुए भाग से
  rationale: שְׁאֵרִיתוֹ पिछले प्रसंग में प्रयुक्त लकड़ी के शेष भाग को सूचित करता है; ‘से’ निर्माण के साधन को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: לְאֵל עָשָׂה
  choice: एक देवता ... बनाता है
  rationale: לְ यहाँ परिणाम अथवा उद्देश्य का भाव देता है। वर्तमान काल पूरे प्रसंग में मूर्ति बनाने और पूजने की सजीव, सामान्यीकृत क्रिया को बनाए रखता है।
- source_word: לְפִסְלוֹ
  choice: अपनी खुदी हुई मूर्ति
  rationale: פֶסֶל विशेष रूप से तराशी या खोदी गई प्रतिमा को दर्शाता है। ‘खुदी हुई मूर्ति’ उसके ठोस निर्माण और मूर्तिपूजक प्रयोग दोनों को सहज रूप में व्यक्त करती है।
- source_word: יִסְגּוֹד לוֹ וְיִשְׁתַּחוּ
  choice: उसके आगे झुकता और दण्डवत करता है
  rationale: दोनों निकटार्थक क्रियाओं को अलग रखते हुए मूल की संचयी व्यंग्यात्मक अभिव्यक्ति बचाई गई है; ‘दण्डवत’ उपासना-सूचक पूर्ण झुकाव को दर्शाता है।
- source_word: וְיִתְפַּלֵּל אֵלָיו
  choice: उससे प्रार्थना करता
  rationale: התפלל אל का सीधा अर्थ किसी से प्रार्थना करना है। हिन्दी में पुल्लिंग ‘उससे’ मूर्ति/देवता की व्याकरणिक संगति और मूल के पुरुषवाचक संकेत—दोनों के अनुरूप है।
- source_word: הַצִּילֵנִי
  choice: मुझे बचा ले
  rationale: נצל का हिफ़ील आज्ञार्थक रूप बचाने या छुड़ाने की विनती है। ‘मुझे बचा ले’ आधुनिक, सहज हिन्दी में मूर्ति से उद्धार माँगने की विडम्बना बनाए रखता है।
- source_word: כִּי אֵלִי אָתָּה
  choice: क्योंकि तू मेरा देवता है
  rationale: כִּי विनती का कारण बताता है और אֵלִי का अर्थ ‘मेरा देवता’ है। ‘तू’ सीधा एकवचन सम्बोधन है और प्रसंग के निकट, व्यक्तिगत दावे को व्यक्त करता है।
theological_decisions:
- issue: मूर्ति के लिए पुरुषवाचक संकेत
  choice: हिन्दी में ‘उसके/उससे/तू’ का प्रयोग
  alternative: वस्तुवाचक ढंग से ‘उस वस्तु/इस मूर्ति’ को दोहराना
  rationale: हिब्रू में אֵל और פֶסֶל पुल्लिंग हैं और आगे के सर्वनाम भी पुल्लिंग एकवचन हैं। हिन्दी में ‘मूर्ति’ स्त्रीलिंग और ‘देवता’ पुल्लिंग है; यहाँ निकटवर्ती ‘देवता’ तथा सीधे सम्बोधन के कारण पुरुषवाचक रूप स्वाभाविक है। इससे मूर्ति के वास्तविक दिव्य व्यक्तित्व की पुष्टि नहीं होती, बल्कि उपासक के दावे की विडम्बना बनी रहती है।
- issue: סגד और שׁחה की निकटार्थक उपासना-क्रियाएँ
  choice: ‘झुकता और दण्डवत करता है’ के रूप में दोनों क्रियाएँ रखना
  alternative: एक क्रिया को अर्थानुसार ‘उपासना करता है’ कहना
  rationale: मूल पाठ क्रियाओं का संचय करके मूर्तिपूजा की विडम्बना को उभारता है। दोनों शारीरिक क्रियाओं को अलग रखना इस अलंकार को सुरक्षित रखता है और किसी विशिष्ट धार्मिक रीति को आयात नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण पर सामान्य पाठक के लिए सहज है। ‘देवता’ को छोटे अर्थक्षेत्र में, मनुष्य द्वारा बनाए और पूजे जा रहे कथित ईश्वर के लिए रखा गया है। मूल की समानान्तर क्रियाओं और व्यंग्य को यथासम्भव सुरक्षित रखा गया है।
