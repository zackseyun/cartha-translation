source:
  edition: WLC
  text: כִּ֤י אֶצָּק מַ֨יִם֙ עַל צָמֵ֔א וְ/נֹזְלִ֖ים עַל יַבָּשָׁ֑ה אֶצֹּ֤ק רוּחִ/י֙ עַל זַרְעֶ֔/ךָ וּ/בִרְכָתִ֖/י עַל צֶאֱצָאֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/003.yaml
  text: For I will pour water on the thirsty land[a], and streams on the dry ground; I will pour out my Spirit on your offspring[c][b], and my blessing on your descendants.
translation:
  language: hi
  text: क्योंकि मैं प्यासी भूमि[a] पर जल और सूखी धरती पर जलधाराएँ[b] उंडेलूँगा; मैं तेरे वंशजों पर अपना आत्मा[c] और तेरी संतानों पर अपनी आशीष उंडेलूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्यासे व्यक्ति पर’ या ‘प्यासे लोगों पर’। इब्रानी विशेषण स्वतंत्र संज्ञा के रूप में भी समझा जा सकता है, पर ‘सूखी धरती’ के समानांतर होने से यहाँ प्यासी भूमि का चित्र अधिक संभावित है।
    reason: alternative_reading
  - marker: b
    text: या ‘बहता हुआ जल’; इब्रानी शब्द का शाब्दिक अर्थ ‘बहने वाली वस्तुएँ’ है।
    reason: lexical_alternative
  - marker: c
    text: ‘अपना आत्मा’ का अनुवाद ‘अपनी श्वास’ या ‘अपनी वायु’ भी हो सकता है, पर भावी पीढ़ियों पर परमेश्वर की आशीष के इस संदर्भ में ‘आत्मा’ अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के आधार या स्पष्टीकरण को प्रस्तुत करता है; ‘क्योंकि’ उसके कारणसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֶצָּק / אֶצֹּק (יצק)
  choice: उंडेलूँगा
  rationale: क्रिया का मूल अर्थ किसी द्रव को उंडेलना है। यही शब्द जल और परमेश्वर के आत्मा—दोनों के साथ प्रयुक्त रूपक को जोड़कर रखता है।
- source_word: צָמֵא
  choice: प्यासी भूमि
  rationale: शब्द औपचारिक रूप से ‘प्यासा’ विशेषण है, पर ‘सूखी धरती’ के समानांतर होने के कारण यहाँ भूमि अभिप्रेत जान पड़ती है। ‘भूमि’ जोड़ने से हिन्दी में चित्र स्पष्ट और स्वाभाविक रहता है।
- source_word: וְנֹזְלִים
  choice: और जलधाराएँ
  rationale: शाब्दिक अर्थ ‘बहने वाली वस्तुएँ’ है। जल और सूखी धरती के संदर्भ में ‘जलधाराएँ’ बहते हुए जल का स्वाभाविक और चित्रात्मक हिन्दी रूप है।
- source_word: יַבָּשָׁה
  choice: सूखी धरती
  rationale: यह सूखी भूमि या धरती को दर्शाता है; ‘सूखी धरती’ पहले अर्धपद की ‘प्यासी भूमि’ के साथ काव्यात्मक समानांतरता बनाए रखती है।
- source_word: רוּחִי
  choice: अपना आत्मा
  rationale: רוּחַ का अर्थ आत्मा, श्वास या वायु हो सकता है। यहाँ भावी पीढ़ियों पर परमेश्वर की आशीष के वचन में ‘मेरा आत्मा’ संदर्भानुकूल है; हिन्दी में कर्ता परमेश्वर होने से ‘अपना आत्मा’ स्वाभाविक है।
- source_word: זַרְעֶךָ
  choice: तेरे वंश
  rationale: शाब्दिक अर्थ ‘तेरा बीज’ है, पर यहाँ सामूहिक रूप से आने वाली पीढ़ी अभिप्रेत है। ‘वंश’ इस भाव को संक्षिप्त और सहज हिन्दी में व्यक्त करता है।
- source_word: וּבִרְכָתִי
  choice: और अपनी आशीष
  rationale: यह संज्ञा परमेश्वर की दी हुई भलाई और कृपा को व्यापक रूप में रखती है। समान कर्ता के कारण हिन्दी में ‘अपनी’ स्वाभाविक है।
- source_word: צֶאֱצָאֶיךָ
  choice: तेरी संतानों
  rationale: यह किसी से उत्पन्न होने वालों को दर्शाता है। ‘संतानों’ समानार्थी समानांतरता को बनाए रखते हुए ‘वंश’ की अनावश्यक पुनरावृत्ति से बचाता है।
theological_decisions:
- issue: वचन के संदर्भ में רוּחִי का अर्थ
  choice: अपना आत्मा
  alternative: अपनी श्वास / अपनी वायु
  rationale: जल का चित्र जीवन और आशीष देने की ओर संकेत करता है और अगला समानांतर पद ‘अपनी आशीष’ कहता है। इसलिए ‘अपना आत्मा’ परमेश्वर की जीवनदायी उपस्थिति का संदर्भानुकूल अर्थ सुरक्षित रखता है, जबकि पादटिप्पणी मूल शब्द की अन्य वास्तविक संभावनाएँ बताती है।
- issue: צָמֵא का अभिप्रेत संदर्भ
  choice: प्यासी भूमि
  alternative: प्यासा व्यक्ति / प्यासे लोग
  rationale: तत्काल काव्यात्मक समानांतर ‘सूखी धरती’ है, इसलिए भूमि का अर्थ अधिक संभावित है। फिर भी विशेषण स्वतंत्र संज्ञा की तरह प्रयुक्त हो सकता है, अतः वैकल्पिक पाठ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। परमेश्वर का संबोधन एकवचन अनौपचारिक ‘तेरे’ में रखा गया है, क्योंकि इब्रानी प्रत्यय एकवचन है और निकटवर्ती संबोधन की काव्यात्मक शैली इससे बनी रहती है। ‘उंडेलूँगा’ की पुनरावृत्ति से बचते हुए हिन्दी में साझा क्रिया को दोनों समानांतर पदों पर लागू किया गया है; मूल का जल-रूपक और आत्मा/आशीष का संतुलन सुरक्षित है।
