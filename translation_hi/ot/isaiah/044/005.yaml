source:
  edition: WLC
  text: זֶ֤ה יֹאמַר֙ לַֽ/יהוָ֣ה אָ֔נִי וְ/זֶ֖ה יִקְרָ֣א בְ/שֵֽׁם יַעֲקֹ֑ב וְ/זֶ֗ה יִכְתֹּ֤ב יָד/וֹ֙ לַֽ/יהוָ֔ה וּ/בְ/שֵׁ֥ם יִשְׂרָאֵ֖ל יְכַנֶּֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/005.yaml
  text: This one will say[a], ‘I am Yahweh’s’; another will call himself by the name of Jacob; and another will write on his hand[c][b], ‘Belonging to Yahweh,’ and will name himself by the name of Israel.
translation:
  language: hi
  text: एक कहेगा[a], “मैं यहोवा का हूँ”; दूसरा याकूब के नाम से अपना परिचय देगा; और एक अपने हाथ पर[b] लिखेगा, “यहोवा का,” और इस्राएल नाम से अपने को अभिहित करेगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “एक कहेगा, ‘यहोवा के लिए, मैं।’” इब्रानी अभिव्यक्ति संक्षिप्त और मुहावरेदार है।'
    reason: lexical_alternative
  - marker: b
    text: “अपने हाथ पर लिखेगा” सम्भवतः यहोवा का होने के चिह्न के रूप में हाथ पर कुछ लिखने या अंकित करने को दर्शाता है।
    reason: cultural_note
  - marker: c
    text: या, “इस्राएल नाम से अपने को नामित करेगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה ... וְזֶה ... וְזֶה
  choice: कोई ... कोई ... और कोई
  rationale: तीन समानांतर अभिव्यक्तियाँ अलग-अलग व्यक्तियों को क्रमशः दिखाती हैं; यह हिन्दी में स्वाभाविक रहते हुए वितरणात्मक अर्थ बनाए रखता है।
- source_word: יֹאמַר
  choice: कहेगा
  rationale: भविष्यसूचक संदर्भ में अपूर्ण क्रिया को भविष्यकाल में प्रस्तुत करना स्वाभाविक है।
- source_word: לַיהוָה אָ֔נִי
  choice: मैं यहोवा का हूँ
  rationale: शाब्दिक संरचना ‘यहोवा के लिए/का, मैं’ संक्षिप्त और मुहावरेदार है; हिन्दी में यह स्वामित्व और निष्ठा दोनों को स्पष्ट रूप से व्यक्त करती है।
- source_word: יִקְרָא בְשֵׁם יַעֲקֹב
  choice: अपना परिचय याकूब के नाम से देगा
  rationale: समानांतर आत्म-पहचान के संदर्भ में इसका संभावित अर्थ याकूब के नाम को अपनी सामुदायिक पहचान के रूप में अपनाना है; यह अनुवाद अनावश्यक रूप से ‘पुकारना’ या ‘आह्वान करना’ नहीं चुनता।
- source_word: יִכְתֹּב יָדוֹ לַיהוָה
  choice: अपने हाथ पर लिखेगा, ‘यहोवा का,’
  rationale: इब्रानी में शब्दशः ‘अपना हाथ यहोवा के लिए लिखेगा’ है। सम्भावित आशय हाथ पर अपने संबंध या स्वामित्व का चिह्न लिखना है; मूर्त बिंब को बनाए रखते हुए निहित लेख स्पष्ट किया गया है।
- source_word: וּבְשֵׁם יִשְׂרָאֵל יְכַנֶּה
  choice: अपने को इस्राएल के नाम से पुकारेगा
  rationale: पिएल क्रिया כנה यहाँ स्वयं को किसी नाम से अभिहित करने का भाव देती है। यह हिन्दी रूप उस आत्म-पहचान को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम के रूप में चतुरक्षरीय नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: पद की अंगीकारात्मक भाषा का स्वरूप
  choice: व्यक्ति स्वयं को खुले रूप में यहोवा और उसकी वाचा-प्रजा से संबंधित बताते हैं।
  alternative: इसे इस्राएल के साथ केवल सामाजिक या जातीय संबद्धता के रूप में पढ़ा जा सकता है।
  rationale: कथन, नाम ग्रहण करने और हाथ पर लिखने की समानांतर क्रियाएँ जानबूझकर अपनाई गई निष्ठा और पहचान की ओर संकेत करती हैं; अनुवाद बाद की धार्मिक श्रेणियाँ आरोपित नहीं करता।
- issue: יִקְרָא בְשֵׁם की सम्भावित अस्पष्टता
  choice: याकूब के नाम से अपना परिचय देना
  alternative: याकूब का नाम पुकारना या उसका आह्वान करना
  rationale: आत्म-पहचान और नामकरण के समानांतर प्रसंग में पहला अर्थ अधिक सम्भावित है, किन्तु इब्रानी मुहावरे की व्यापक अर्थ-सीमा को टिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘यहोवा का हूँ’ और ‘यहोवा का’ मूल की संक्षिप्त स्वामित्व/निष्ठा-सूचक अभिव्यक्ति को स्वाभाविक हिन्दी में रखते हैं। याकूब और इस्राएल दोनों नाम मूल के समान सुरक्षित हैं।
