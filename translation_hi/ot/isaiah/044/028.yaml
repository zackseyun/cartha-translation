  text: הָ/אֹמֵ֤ר לְ/כ֨וֹרֶשׁ֙ רֹעִ֔/י וְ/כָל חֶפְצִ֖/י יַשְׁלִ֑ם וְ/לֵ/אמֹ֤ר לִ/ירוּשָׁלִַ֨ם֙ תִּבָּנֶ֔ה וְ/הֵיכָ֖ל תִּוָּסֵֽד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/028.yaml
  text: who says of Cyrus, ‘He is my shepherd, and he will fulfill all my purpose,’ saying of Jerusalem, ‘She will be rebuilt,’ and of the temple, ‘Its foundation will be laid.’
translation:
  language: hi
  text: जो कुस्रू के विषय में कहता है, “वह मेरा चरवाहा है, और वह मेरी सारी योजना पूरी करेगा,” और यरूशलेम के विषय में कहता है, “वह फिर से बनाया जाएगा,” और मन्दिर के विषय में, “उसकी नींव रखी जाएगी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כּוֹרֶשׁ
  choice: कुस्रू
  rationale: फारसी राजा Cyrus के लिए हिन्दी बाइबल परंपरा में प्रचलित और पहचाना जाने वाला नाम।
- source_word: רֹעִי
  choice: मेरा चरवाहा
  rationale: मूल का प्रत्यक्ष रूपक बनाए रखता है; यहाँ परमेश्वर द्वारा नियुक्त अगुआ और कार्य-साधक का भाव है।
- source_word: חֶפְצִי
  choice: मेरी सारी इच्छा
  rationale: חֵפֶץ यहाँ परमेश्वर की इच्छा/अभिप्राय को व्यक्त करता है; ‘इच्छा’ सहज है और मूल की अर्थ-सीमा बनाए रखती है।
- source_word: יַשְׁלִם
  choice: पूरी करेगा
  rationale: क्रिया का आशय पूर्ण करने या सफलतापूर्वक संपन्न करने से है।
- source_word: תִּבָּנֶה
  choice: फिर बसाया जाएगा
  rationale: शाब्दिक अर्थ ‘बनाया जाएगा’ है, पर नगर के संदर्भ में पुनर्निर्माण और पुनर्बसाहट को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תִּוָּסֵד
  choice: तेरी नींव डाली जाएगी
  rationale: मूल में निपाल रूप नींव रखे जाने को व्यक्त करता है; मन्दिर को प्रत्यक्ष संबोधन होने के कारण ‘तेरी’ रखा गया है।
theological_decisions:
- issue: कुस्रू को परमेश्वर का ‘चरवाहा’ कहना
  choice: रूपक को बिना व्याख्यात्मक नरमी के बनाए रखा गया
  alternative: मेरा नियुक्त अगुआ
  rationale: मूल पाठ एक विदेशी शासक के लिए स्पष्टतः רֹעִי का प्रयोग करता है; इस आश्चर्यजनक धार्मिक तनाव को अनुवाद में सुरक्षित रखना चाहिए।
- issue: מִקְדָּשׁ/הֵיכָל के लिए शब्द
  choice: मन्दिर
  alternative: भवन या राजमहल
  rationale: यरूशलेम और उसकी नींव के संदर्भ में הֵיכָל यहाँ याहवे के मन्दिर को सूचित करता है; ‘मन्दिर’ सामान्य पाठक के लिए स्पष्ट है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। वाक्य की भविष्यवाणी-संबंधी लय और मूल के समानांतर कथनों को बनाए रखा गया है।
