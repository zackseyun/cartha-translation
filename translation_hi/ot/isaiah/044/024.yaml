source:
  edition: WLC
  text: כֹּֽה אָמַ֤ר יְהוָה֙ גֹּאֲלֶ֔/ךָ וְ/יֹצֶרְ/ךָ֖ מִ/בָּ֑טֶן אָנֹכִ֤י יְהוָה֙ עֹ֣שֶׂה כֹּ֔ל נֹטֶ֤ה שָׁמַ֨יִם֙ לְ/בַדִּ֔/י רֹקַ֥ע הָ/אָ֖רֶץ מי את/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/024.yaml
  text: 'Thus says Yahweh[a], your Redeemer, who formed you from the womb: I am Yahweh, who makes all things, who alone stretched out the heavens, who spread out the earth by myself.'
translation:
  language: hi
  text: 'याहवे[a], तुम्हारा उद्धारकर्ता, जिसने गर्भ ही से तुम्हें आकार दिया, यह कहता है:


    “मैं याहवे हूँ, जो सब कुछ बनाता है,


    जो अकेला ही आकाश को तानता है,


    जो पृथ्वी को फैलाता है—मेरे साथ कौन था?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “याहवे” परमेश्वर के इब्रानी व्यक्तिगत नाम יהוה का लिप्यंतरण है।
    reason: divine_name
  - marker: b
    text: अंतिम इब्रानी शब्द कठिन हैं। एक अन्य सम्भव अर्थ है, “जो पृथ्वी को अपने आप फैलाता है।” दोनों अर्थों में भाव यह है कि याहवे ने बिना किसी सहायक के सृष्टि की।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में रखा गया है।
- source_word: גֹּאֲלֶךָ
  choice: तुम्हारा छुड़ानेवाला
  rationale: यह चुनाव उद्धार और मुक्ति के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना हर प्रसंग में निकट-संबंधी की कानूनी भूमिका आरोपित किए।
- source_word: וְיֹצֶרְךָ מִבָּטֶן
  choice: जिसने गर्भ ही से तुम्हें आकार दिया
  rationale: יצר के गढ़ने/आकार देने के चित्र और מִבָּטֶן के गर्भ से आरम्भ होने वाले भाव, दोनों को सुरक्षित रखता है।
- source_word: עֹשֶׂה כֹּל
  choice: जो सब कुछ बनाता है
  rationale: याहवे की सर्वसमावेशी सृजनकारी क्रिया को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נֹטֶה שָׁמַיִם לְבַדִּי
  choice: जो अकेला ही आकाश को तानता है
  rationale: נטה के फैलाकर तानने के सृष्टि-चित्र और לְבַדִּי में निहित एकमात्र कर्तृत्व को बनाए रखता है।
- source_word: רֹקַע הָאָרֶץ
  choice: जो पृथ्वी को फैलाता है
  rationale: רקע के किसी सतह को फैलाने के भाव को धातु पीटने का अनावश्यक रूप से तकनीकी चित्र बनाए बिना संप्रेषित करता है।
- source_word: מי אתי
  choice: मेरे साथ कौन था?
  rationale: मसोरेटिक हाशिये द्वारा सूचित कठिन अंतिम शब्दों को प्रश्नवाचक रूप में ग्रहण करता है; इससे पाठ की कठिनता और याहवे के अकेले सृजन करने का आशय दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम है; उसे उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- issue: सृष्टि में परमेश्वर का एकमात्र कर्तृत्व और कठिन अंतिम इब्रानी शब्द
  choice: मुख्य पाठ में “मेरे साथ कौन था?”
  alternative: “अपने ही बल से”; “मेरी ओर से”
  rationale: लेखन-पाठ मी אתי कठिन है, जबकि मसोरेटिक पाठ-परंपरा का संकेत प्रश्नवाचक अर्थ का समर्थन करता है। प्रश्न याहवे के बिना सहायक सृष्टि करने को व्यक्त करता है, पर पाठगत अस्पष्टता को छिपाता नहीं; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल शैली अपनाई गई है। काव्यात्मक समानांतरता के लिए पंक्ति-विभाजन रखा गया है। “गर्भ ही से” और “आकार दिया” मूल की जन्मपूर्व गठन-छवि को सहज रूप में बनाए रखते हैं।
