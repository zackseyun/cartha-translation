  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹ֥א יָדְע֖וּ וְ/לֹ֣א יָבִ֑ינוּ כִּ֣י טַ֤ח מֵֽ/רְאוֹת֙ עֵֽינֵי/הֶ֔ם מֵ/הַשְׂכִּ֖יל לִבֹּתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/018.yaml
  text: They do not know[a], nor do they understand, because he has shut their eyes from seeing[c][b], and their hearts from understanding.
translation:
  language: hi
  text: वे न तो जानते हैं, न समझते हैं, क्योंकि उसने[b] उनकी आँखों पर लेप कर दिया है[a], ताकि वे न देख सकें, और उनके हृदयों पर भी, ताकि वे समझ न सकें।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘लेप कर दिया’ का शाब्दिक भाव पोतने या पलस्तर चढ़ाने का है; आशय आँखों के देखने में बाधा पड़ने से है। इसका अधिक व्याख्यात्मक अनुवाद ‘अंधा कर दिया’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उसने’ का कर्ता इब्रानी पाठ में स्पष्ट रूप से बताया नहीं गया है।
    reason: alternative_reading
  - marker: c
    text: इब्रानी में ‘हृदय’ विचार और समझ का केंद्र भी माना जाता है, केवल भावनाओं का नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: יָדְעוּ
  choice: जानते हैं
  rationale: नकार के साथ पूर्ण क्रिया यहाँ प्रसंग में वर्तमानकालिक सामान्य दशा बताती है; ‘जानते’ इसका सीधा और स्वाभाविक हिन्दी अर्थ है।
- source_word: יָבִינוּ
  choice: समझते हैं
  rationale: בין का सामान्य अर्थ समझना या परखना है; ‘समझते’ पहले खंड के ‘जानते’ के साथ स्वाभाविक जोड़ी बनाता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उनकी अज्ञानता और नासमझी का कारण प्रस्तुत करता है।
- source_word: טַח
  choice: लेप कर दिया है
  rationale: טח पोतने, लीपने या लेप चढ़ाने की ठोस छवि देता है। ‘लेप कर दिया’ उस रूपक को बनाए रखता है और केवल व्याख्यात्मक ‘अंधा कर दिया’ से अधिक स्रोत-संगत है।
- source_word: מֵרְאוֹת עֵינֵיהֶם
  choice: उनकी आँखों पर ऐसा लेप कर दिया है कि वे देख न सकें
  rationale: מִן और infinitive यहाँ रोक या असमर्थता व्यक्त करते हैं। हिन्दी में परिणामसूचक रचना स्रोत के आशय को स्पष्ट और स्वाभाविक ढंग से व्यक्त करती है।
- source_word: מֵהַשְׂכִּיל לִבֹּתָם
  choice: उनके हृदयों को ऐसा कर दिया है कि वे समझ न सकें
  rationale: השׂכיל बोध या सूझ-बूझ प्राप्त करने को दर्शाता है। हिन्दी वाक्यरचना में निषेधात्मक परिणाम स्पष्ट किया गया है, जबकि ‘हृदय’ की मूल छवि सुरक्षित रखी गई है।
- source_word: לִבֹּתָם
  choice: उनके हृदयों
  rationale: इब्रानी में हृदय विचार, विवेक और इच्छा का केंद्र भी है, केवल भावनाओं का नहीं; इसलिए ‘मन’ से बदलने के बजाय ‘हृदय’ रखा गया है।
theological_decisions:
- issue: טַח का अनुल्लिखित कर्ता
  choice: उसने
  alternative: उनकी आँखों पर लेप चढ़ गया है / उनकी आँखें पोत दी गई हैं
  rationale: इब्रानी क्रिया तीसरे पुरुष पुल्लिंग एकवचन में है, पर कर्ता का नाम नहीं दिया गया। ‘उसने’ व्याकरणिक एकवचन को सुरक्षित रखता है, पर यह तय नहीं करता कि कर्ता परमेश्वर, कारीगर या कोई अन्य है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘लेप’ से मूल ठोस रूपक बचाया गया है; ‘ऐसा…कि’ रचना ने इब्रानी के रोक/असमर्थता वाले भाव को स्वाभाविक हिन्दी में व्यक्त किया है।
