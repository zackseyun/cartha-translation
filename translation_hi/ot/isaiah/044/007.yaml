base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/007.yaml
  text: And who is like me? Let him call and declare it[a], and set it in order for me, since I appointed an ancient people. Let them declare to them the things to come[b], and the things that will come.
translation:
  language: hi
  text: और मेरे समान कौन है? वह पुकारे, इसका वर्णन करे और मेरे सामने इसे क्रम से रखे—जब से मैंने प्राचीन काल के लोगों को स्थापित किया है। वे उन्हें आने वाली घटनाएँ[a] और जो कुछ आगे घटेगा, बता दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चिह्न” या “संकेत।” इब्रानी शब्द का अर्थ “चिह्न” या “संकेत” भी हो सकता है; यहाँ समानांतर वाक्यांश के कारण भाव सम्भवतः भविष्य में होने वाली घटनाओं का है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִי כָמוֹנִי
  choice: और मेरे समान कौन है?
  rationale: रhetorical challenge को स्वाभाविक और गरिमापूर्ण हिन्दी में रखा गया है; וּ से पूर्ववर्ती कथन का संबंध भी बना रहता है।
- source_word: יִקְרָא
  choice: वह पुकारे
  rationale: 'चुनौती के प्रसंग में अपूर्ण क्रिया को आज्ञार्थक/अनुमतिसूचक भाव में लिया गया है: कोई प्रतिद्वंद्वी आगे आकर पुकारे।'
- source_word: וְיַגִּידֶהָ
  choice: इसका वर्णन करे
  rationale: हिफ़ील נגד का अर्थ ‘बतलाना/घोषित करना’ है; स्त्रीलिंग प्रत्यय जिस विषय की ओर संकेत करता है, उसे हिन्दी में ‘इसका’ से खुला छोड़ा गया है।
- source_word: וְיַעְרְכֶהָ לִי
  choice: मेरे सामने इसे क्रम से रखे
  rationale: ערך के ‘व्यवस्थित करना, क्रम से प्रस्तुत करना’ अर्थ को व्यक्त करता है; לִי को प्रसंगानुसार ‘मेरे सामने’ कहा गया है।
- source_word: מִשּׂוּמִי עַם עוֹלָם
  choice: जब से मैंने प्राचीन काल के लोगों को स्थापित किया है
  rationale: מִן सहित infinitive construct को कालवाचक ‘जब से’ और שׂים को ‘स्थापित किया’ माना गया है। עַם עוֹלָם में עוֹלָם को यहाँ प्राचीनता के अर्थ में लिया गया है।
- source_word: וְאֹתִיּוֹת
  choice: आनेवाली घटनाएँ
  rationale: संदर्भ और अगले समानांतर वाक्यांश के कारण इसे भविष्य की घटनाओं के रूप में समझा गया है; ‘चिह्न’ की संभावित व्याख्या पादटिप्पणी में सुरक्षित है।
- source_word: וַאֲשֶׁר תָּבֹאנָה
  choice: और जो कुछ आगे घटेगा
  rationale: भविष्य में आनेवाली बातों को स्वाभाविक हिन्दी में व्यक्त करता है और पहले पदबंध के साथ अर्थगत समानांतरता बनाए रखता है।
- source_word: יַגִּידוּ לָמוֹ
  choice: वे उन्हें बता दें
  rationale: इब्रानी के दोनों तृतीय-पुरुष बहुवचन संकेतों को बनाए रखा गया है, यद्यपि उनके संदर्भ संक्षिप्त और कुछ अस्पष्ट हैं।
theological_decisions:
- issue: עַם עוֹלָם का अर्थ
  choice: प्राचीन काल के लोग
  alternative: सदा रहनेवाले लोग
  rationale: यह प्रसंग इतिहास पर परमेश्वर के अधिकार और भविष्य बताने की उसकी अद्वितीय सामर्थ्य पर केंद्रित है। इसलिए עוֹלָם को प्राचीनता के अर्थ में लेना अधिक संगत है और इस पद में अनावश्यक रूप से किसी समुदाय की शाश्वत स्थिति का सिद्धांत नहीं जोड़ता।
- issue: וְאֹתִיּוֹת का संदर्भ
  choice: आनेवाली घटनाएँ
  alternative: चिह्न या संकेत
  rationale: इसके तुरंत बाद आने वाला ‘जो कुछ आगे घटेगा’ भविष्य की घटनाओं की ओर संकेत करता है। फिर भी शब्द की दूसरी संभावित व्याख्या पादटिप्पणी में दी गई है।
- issue: יַגִּידוּ לָמוֹ में सर्वनामों का संदर्भ
  choice: वे उन्हें बता दें
  alternative: वे इन बातों को घोषित करें
  rationale: इब्रानी की संक्षिप्तता और संदर्भगत अस्पष्टता को पूरी तरह सुगम बनाकर मिटाने के बजाय हिन्दी में यथासंभव बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, साधारण पाठक के लिए बोधगम्य किंतु गरिमापूर्ण। चुनौतीपूर्ण प्रश्न और भविष्यवाणी-संबंधी समानांतरता को बनाए रखा गया है। ‘प्राचीन काल के लोगों’ में सामूहिक एकवचन עַם का स्वाभाविक हिन्दी रूप प्रयुक्त है।
