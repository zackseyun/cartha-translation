source:
  edition: WLC
  text: מִֽי יָצַ֥ר אֵ֖ל וּ/פֶ֣סֶל נָסָ֑ךְ לְ/בִלְתִּ֖י הוֹעִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/010.yaml
  text: Who fashions a god or casts an idol that is profitable for nothing?[a]
translation:
  language: hi
  text: कौन है जो किसी देवता को गढ़ता या ऐसी मूर्ति ढालता है जिससे कोई लाभ नहीं होता?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कौन किसी देवता को गढ़ता और मूर्ति ढालता है—बिना किसी लाभ के?”
    reason: संयोजक וּ तथा לְבִלְתִּי הוֹעִיל की अधिक शाब्दिक वैकल्पिक अभिव्यक्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: מִי
  choice: कौन है जो
  rationale: प्रश्नवाचक सर्वनाम यहाँ तीखा आलंकारिक प्रश्न आरम्भ करता है; यह हिंदी में स्वाभाविक और प्रभावपूर्ण है।
- source_word: יָצַר
  choice: गढ़ता
  rationale: यह क्रिया कारीगर द्वारा किसी वस्तु को रूप देने या बनाने को दर्शाती है; ‘गढ़ता’ इस शिल्पकारी संदर्भ के अनुकूल है।
- source_word: אֵל
  choice: किसी देवता
  rationale: संदर्भ में मनुष्य द्वारा बनाए गए झूठे देवता की बात है, इस्राएल के सच्चे परमेश्वर की नहीं; ‘किसी’ अनिश्चित अर्थ को व्यक्त करता है।
- source_word: וּפֶסֶל
  choice: या ... मूर्ति
  rationale: वाव यहाँ निकट समानांतर अभिव्यक्तियों को जोड़ता है। हिंदी में आलंकारिक प्रश्न के भीतर ‘या’ दोनों प्रकार के निर्माण को स्वाभाविक रूप से संबद्ध करता है।
- source_word: נָסָךְ
  choice: ढालता
  rationale: मूर्ति-निर्माण के संदर्भ में यह क्रिया साँचे में, सम्भवतः धातु से, ढालने का अर्थ देती है।
- source_word: לְבִלְתִּי הוֹעִיל
  choice: जिससे कोई लाभ नहीं होता
  rationale: यह नकारात्मक उद्देश्य अथवा परिणाम को मूर्ति की पूर्ण निष्प्रयोजकता के रूप में स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: मूर्ति-विवाद के संदर्भ में אֵל का अनुवाद
  choice: किसी देवता
  alternative: परमेश्वर
  rationale: पद मनुष्य-निर्मित झूठे देवता का उपहास करता है। ‘परमेश्वर’ कहने से गलत ढंग से सच्चे परमेश्वर का संकेत मिल सकता है।
- issue: वाव को ‘और’ या ‘या’ कहना
  choice: या
  alternative: और
  rationale: दोनों निर्माण-वाक्यांश समानांतर हैं और संभवतः एक ही मूर्तिनिर्माण की पूरक तस्वीर देते हैं। मुख्य पाठ में स्वाभाविक हिंदी के लिए ‘या’ रखा गया है, जबकि ‘और’ वाली अधिक रूपगत व्याख्या पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सरल, गरिमापूर्ण और भविष्यद्वक्ता के तीखे आलंकारिक प्रश्न के अनुरूप रखी गई है। ‘गढ़ता’ और ‘ढालता’ के द्वारा शिल्पकारी के दो निकटवर्ती पहलू स्पष्ट किए गए हैं।
