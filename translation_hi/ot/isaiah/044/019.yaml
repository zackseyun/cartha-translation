base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/019.yaml
  text: And he does not take it to heart[a], and there is no knowledge or understanding to say, “I burned half of it in the fire; I also baked bread on its coals; I roasted meat and ate. Shall I make the rest of it into an abomination? Shall I bow down to a block of wood?”
translation:
  language: hi
  text: वह अपने मन में इस पर विचार नहीं करता; उसमें न ज्ञान है, न समझ कि वह कहे, “मैंने इसका आधा भाग आग में जला दिया; उसके अंगारों पर रोटी भी सेंकी; मैंने मांस भूना और खाया। तो क्या मैं इसके बचे हुए भाग को एक घृणित वस्तु बनाऊँ? क्या मैं लकड़ी के एक कुंदे[a] के आगे दण्डवत् करूँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लकड़ी के एक टुकड़े” अथवा “एक लट्ठे।” इब्रानी पद उपेक्षापूर्ण है और इस बात पर जोर देता है कि मूर्ति लकड़ी मात्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׁיב אֶל לִבּוֹ
  choice: अपने मन में इस पर विचार करता
  rationale: यह इब्रानी मुहावरा किसी बात को मन में लाकर उस पर गंभीरता से विचार करने का भाव देता है। यह हिन्दी में स्वाभाविक है और आंतरिक मनन का अर्थ बनाए रखता है।
- source_word: דַעַת וְלֹא תְבוּנָה
  choice: न ज्ञान है, न समझ
  rationale: दोनों निकटार्थक संज्ञाओं का भेद और उनका संचयी प्रभाव सरल, स्पष्ट हिन्दी में सुरक्षित रहता है।
- source_word: חֶצְיוֹ
  choice: इसका आधा भाग
  rationale: सर्वनाम पहले वर्णित लकड़ी की ओर संकेत करता है; यह अनुवाद उस संदर्भ को स्पष्ट रखता है।
- source_word: שָׂרַפְתִּי בְמוֹ אֵשׁ
  choice: आग में जला दिया
  rationale: यह घरेलू ईंधन के रूप में लकड़ी जलाने के दृश्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאַף אָפִיתִי עַל גֶּחָלָיו לֶחֶם
  choice: उसके अंगारों पर रोटी भी सेंकी
  rationale: ‘भी’ אַף के योगात्मक बल को व्यक्त करता है; ‘उसके अंगारों’ में प्रत्यय का लकड़ी से संबंध बना रहता है।
- source_word: אֶצְלֶה בָשָׂר וְאֹכֵל
  choice: मैंने मांस भूना और खाया
  rationale: צלה आग पर मांस भूनने का सामान्य शब्द है; क्रियाओं का क्रम मूल पाठ के अनुरूप रखा गया है।
- source_word: וְיִתְרוֹ
  choice: इसके बचे हुए भाग
  rationale: यह पहले जलाए गए आधे भाग के विपरीत शेष लकड़ी को स्पष्ट रूप से दर्शाता है।
- source_word: לְתוֹעֵבָה
  choice: एक घृणित वस्तु
  rationale: यह תוֹעֵבָה की प्रबल धार्मिक और नैतिक वितृष्णा को समझने योग्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לְבוּל עֵץ
  choice: लकड़ी के एक कुंदे
  rationale: यह मूर्ति को केवल लकड़ी बताने वाली उपेक्षापूर्ण विडंबना को बनाए रखता है।
theological_decisions:
- issue: मूर्ति की सामग्री के लिए प्रयुक्त उपेक्षापूर्ण पद
  choice: लकड़ी के एक कुंदे
  alternative: लकड़ी के एक टुकड़े; एक लट्ठे
  rationale: भविष्यद्वक्ता सामान्य ईंधन और उसी बची लकड़ी की उपासना के बीच विडंबनापूर्ण विरोध दिखाता है। ‘कुंदा’ मूर्ति के केवल लकड़ी होने पर जोर देता है, बिना पाठ में नई धर्मवैज्ञानिक व्याख्या जोड़े।
- issue: अंतिम दो क्रियाओं का वाक्य-भाव
  choice: अलंकारिक प्रश्न
  alternative: साधारण कथन—मैं उसके बचे भाग को घृणित वस्तु बनाता और उसके आगे दण्डवत् करता हूँ
  rationale: संदर्भ में ये क्रियाएँ आत्म-विवेचन के रूप में हैं और मूर्तिपूजक की असंगति उजागर करती हैं; प्रश्नवाचक रूप मूल की निहित व्यंग्यात्मक शक्ति को हिन्दी में स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली रखी गई है। ‘दण्डवत् करना’ उपासना के शारीरिक भाव को स्पष्ट करता है, जबकि रोटी सेंकने और मांस भूनने के ठोस घरेलू चित्र मूल पाठ के व्यंग्य को बनाए रखते हैं।
