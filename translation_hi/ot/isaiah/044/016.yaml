  text: חֶצְי/וֹ֙ שָׂרַ֣ף בְּמוֹ אֵ֔שׁ עַל חֶצְי/וֹ֙ בָּשָׂ֣ר יֹאכֵ֔ל יִצְלֶ֥ה צָלִ֖י וְ/יִשְׂבָּ֑ע אַף יָחֹם֙ וְ/יֹאמַ֣ר הֶאָ֔ח חַמּוֹתִ֖י רָאִ֥יתִי אֽוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/016.yaml
  text: 'Half of it he burns in the fire[a]; over the other half he eats meat: he roasts a roast and is satisfied. He also warms himself and says, “Aha! I am warm[c][b]; I have seen the fire.”'
translation:
  language: hi
  text: उसके आधे भाग को वह आग में जला देता है; दूसरे आधे से वह मांस खाता है—वह भुना हुआ भोजन भूनता है और तृप्त हो जाता है। वह अपने को गरम भी करता है और कहता है, “आहा! मैं गरम हो गया हूँ; मैंने आग देखी है[b]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या “मैंने लौ देखी है।” इब्रानी शब्द आग, लौ या चमकते प्रकाश को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶצְיוֹ
  choice: उसके आधे भाग को
  rationale: यह शब्द ‘उसका आधा भाग’ दर्शाता है और संदर्भ में लकड़ी की ओर संकेत करता है। ‘उसके आधे भाग को’ आधुनिक हिन्दी में स्वाभाविक रूप से अंश का भाव व्यक्त करता है।
- source_word: שָׂרַף בְּמוֹ אֵשׁ
  choice: वह आग में जला देता है
  rationale: क्रिया पूर्ण रूप में है, पर पूरे अनुच्छेद में कारीगर की सामान्य गतिविधि का सजीव वर्णन हो रहा है; इसलिए हिन्दी वर्तमानकालीन वर्णन उपयुक्त है। बְּמוֹ אֵשׁ जलाने के माध्यम या क्षेत्र को बताता है।
- source_word: עַל חֶצְיוֹ
  choice: दूसरे आधे पर
  rationale: शाब्दिक अर्थ ‘उसके आधे पर’ है। पहले आधे से विरोध स्पष्ट होने के कारण ‘दूसरे’ जोड़ा गया है; ‘पर’ मूल पूर्वसर्ग का स्थानिक भाव बनाए रखता है।
- source_word: בָּשָׂר יֹאכֵל
  choice: वह मांस भूनकर खाता है
  rationale: בָּשָׂר भोजन के रूप में पशु-मांस है। हिन्दी में पकाने और खाने का संबंध स्पष्ट करने के लिए ‘भूनकर खाता है’ स्वाभाविक है, जबकि अगला वाक्य भूनने की क्रिया को विशेष रूप से दोहराता है।
- source_word: יִצְלֶה צָלִי
  choice: वह मांस भूनता है
  rationale: इब्रानी में एक ही धातु से बनी क्रिया और संज्ञा का प्रयोग है, जिसका अत्यंत शाब्दिक हिन्दी रूप अस्वाभाविक होगा। मुख्य पाठ में अर्थ स्पष्ट रखा गया है और धातु-सजातीय अभिव्यक्ति को पादटिप्पणी में बताया गया है।
- source_word: וְיִשְׂבָּע
  choice: और तृप्त हो जाता है
  rationale: क्रिया भोजन से पेट भरने और संतुष्ट होने का परिणाम व्यक्त करती है; ‘तृप्त हो जाता है’ गरिमापूर्ण और सहज हिन्दी है।
- source_word: אַף יָחֹם
  choice: वह अपने को गरम भी करता है
  rationale: אַף एक और उपयोग जोड़ता है और יָחֹם संदर्भ में आग से स्वयं को गरम करने को व्यक्त करता है।
- source_word: הֶאָח
  choice: आहा!
  rationale: यह प्रसन्नता और आत्मसंतोष की विस्मयध्वनि है; ‘आहा!’ हिन्दी में उसके भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חַמּוֹתִי
  choice: मैं गरम हो गया हूँ
  rationale: पूर्ण क्रिया प्राप्त अवस्था को दिखाती है; यह रूप केवल वर्तमान अवस्था से अधिक स्पष्ट रूप से गरम हो जाने के परिणाम को व्यक्त करता है।
- source_word: רָאִיתִי אוּר
  choice: मैंने आग देखी है
  rationale: रूपक या मुहावरे का अर्थ आरोपित किए बिना इब्रानी वाक्य को निकटता से रखा गया है। אוּר आग, लौ या चमकते प्रकाश को दर्शा सकता है।
theological_decisions:
- issue: मूर्तिपूजा-विरोधी व्यंग्य को बिना अतिरिक्त व्याख्या जोड़े व्यक्त करना
  choice: कारीगर के ईंधन, भोजन और गरमी के लिए लकड़ी इस्तेमाल करने तथा आत्मसंतुष्ट होकर बोलने का सीधा वर्णन
  alternative: इस पद में स्पष्ट रूप से जोड़ना कि यही लकड़ी मूर्ति बनाने के लिए भी प्रयोग होती है
  rationale: आसपास का प्रसंग मूर्तिपूजा पर व्यंग्य करता है, पर इस पद में स्वयं केवल लकड़ी के इन साधारण उपयोगों का वर्णन है। सीधा अनुवाद विडंबना को बनाए रखता है और प्रसंग से बाहर की व्याख्या मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण वर्णनात्मक शैली में है। वर्तमानकालीन क्रियाएँ प्रसंग के सजीव और सामान्यीकृत व्यंग्य को बनाए रखती हैं। ‘आहा!’ वक्ता के आत्मसंतोष को बिना अतिरिक्त टिप्पणी के व्यक्त करता है।
