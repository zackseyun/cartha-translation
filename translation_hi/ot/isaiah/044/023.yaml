source:
  edition: WLC
  text: רָנּ֨וּ שָׁמַ֜יִם כִּֽי עָשָׂ֣ה יְהוָ֗ה הָרִ֨יעוּ֙ תַּחְתִּיּ֣וֹת אָ֔רֶץ פִּצְח֤וּ הָרִים֙ רִנָּ֔ה יַ֖עַר וְ/כָל עֵ֣ץ בּ֑/וֹ כִּֽי גָאַ֤ל יְהוָה֙ יַֽעֲקֹ֔ב וּ/בְ/יִשְׂרָאֵ֖ל יִתְפָּאָֽר־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/023.yaml
  text: Sing for joy[a], O heavens, for Yahweh has done it; shout aloud, depths of the earth. Break forth into singing, O mountains, O forest, and every tree in it; for Yahweh has redeemed Jacob[c][b], and in Israel he displays his glory.
translation:
  language: hi
  text: हे आकाश, आनन्द से गाओ,[a] क्योंकि यहोवा ने यह किया है! हे पृथ्वी की गहराइयो,[b] जयजयकार करो! हे पहाड़ो, हे वन और उसमें के हर पेड़, आनन्द-गीत में फूट पड़ो! क्योंकि यहोवा ने याकूब का उद्धार किया है, और इस्राएल में वह अपनी महिमा प्रकट करता है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आनन्द से जयजयकार करो।”
    reason: רנן में उल्लासपूर्ण गायन और जय-पुकार दोनों का भाव हो सकता है।
  - marker: b
    text: शाब्दिक रूप से, “पृथ्वी के सबसे निचले भाग।”
    reason: תחתיות ארץ के स्थानिक और काव्यात्मक अर्थ को दिखाता है।
  - marker: c
    text: या, “वह अपने को महिमामय दिखाता है” अथवा “अपने को महिमान्वित करता है।”
    reason: יִתְפָּאָר के आत्मवाचक/प्रकटीकरण संबंधी अर्थ-विस्तार को सुरक्षित रखता है।
lexical_decisions:
- source_word: רָנּוּ
  choice: आनन्द से गाओ
  rationale: बहुवचन आज्ञार्थक क्रिया उल्लासपूर्ण गायन या जयध्वनि व्यक्त करती है; यह चयन काव्यात्मकता और आनन्द दोनों रखता है।
- source_word: כִּי עָשָׂה יְהוָה
  choice: क्योंकि यहोवा ने यह किया है
  rationale: עשה का कर्म मूल में व्यक्त नहीं है। ‘यह किया है’ हिन्दी में स्वाभाविक है, जबकि पादटिप्पणी मूल की अनिर्दिष्टता बताती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में आए परमेश्वर के व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित रूप ‘यहोवा’ से प्रत्यक्ष रूप में रखा गया है।
- source_word: הָרִיעוּ
  choice: जयजयकार करो
  rationale: हिफ़ील आज्ञार्थक रूप ऊँची, उल्लासपूर्ण जयध्वनि का आह्वान करता है।
- source_word: תַּחְתִּיּוֹת אָרֶץ
  choice: पृथ्वी की गहराइयो
  rationale: यह पृथ्वी के निचले अथवा गहरे भागों के लिए प्रयुक्त काव्यात्मक अभिव्यक्ति है; संबोधन को बहुवचन में बनाए रखा गया है।
- source_word: פִּצְחוּ רִנָּה
  choice: गाते हुए उमड़ पड़ो
  rationale: यह पदबंध अचानक फूट पड़ने वाले आनन्दपूर्ण गीत या पुकार का बोध देता है; चुना हुआ रूप आधुनिक हिन्दी में सजीव और काव्यात्मक है।
- source_word: יַעַר וְכָל עֵץ בּוֹ
  choice: हे वन और उसमें के हर पेड़
  rationale: वन तथा उसके प्रत्येक वृक्ष को प्रत्यक्ष संबोधन के रूप में रखकर सृष्टि-व्यापी आह्वान सुरक्षित रखा गया है।
- source_word: גָאַל
  choice: छुड़ा लिया है
  rationale: גאל निकट संबंधी द्वारा छुड़ाने, वापस लेने या उद्धार करने का अर्थ रखता है; ‘छुड़ा लिया’ साधारण पाठक के लिए स्पष्ट है और मुक्तिदायी बल बनाए रखता है।
- source_word: יִתְפָּאָר
  choice: अपनी महिमा प्रकट करता है
  rationale: हित्पएल रूप यहाँ स्वयं को महिमामय दिखाने या अपनी महिमा प्रकट करने का अर्थ दे सकता है; चयन कर्ता के रूप में यहोवा को स्पष्ट रखता है।
theological_decisions:
- issue: यहोवा नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम יהוה है; इसलिए नाम को उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: יִתְפָּאָר का अर्थ और ‘इस्राएल में’ का संबंध
  choice: इस्राएल में वह अपनी महिमा प्रकट करता है
  alternative: इस्राएल में वह अपने को महिमान्वित करता है / महिमामय दिखाई देता है
  rationale: हिब्रू में परमेश्वर ही क्रिया का कर्ता है, पर क्रिया आत्म-महिमान्वयन और महिमा के प्रकटीकरण दोनों की छाया रखती है। मुख्य पाठ स्वाभाविक हिन्दी देता है और पादटिप्पणी वैकल्पिक अर्थ बचाती है।
- issue: याकूब और इस्राएल का संबंध
  choice: दोनों नाम ज्यों के त्यों रखे गए
  alternative: दोनों को ‘अपनी प्रजा’ के रूप में स्पष्ट करना
  rationale: काव्यात्मक समानांतरता और वाचा-सम्बन्धी नामों को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वक्तीय काव्य-शैली रखी गई है। ‘हे’ से प्रत्यक्ष संबोधन स्पष्ट किया गया है; विस्मयादिबोधक चिह्न उल्लासपूर्ण आज्ञाओं की लय उभारते हैं। भाषा सामान्य पाठक के लिए सुबोध है, पर मूल की ब्रह्मांडीय चित्रात्मकता और अंतिम पंक्ति की अर्थ-तनावपूर्ण अभिव्यक्ति सुरक्षित है।
