  edition: WLC
  text: וְ/עַתָּ֥ה שְׁמַ֖ע יַעֲקֹ֣ב עַבְדִּ֑/י וְ/יִשְׂרָאֵ֖ל בָּחַ֥רְתִּי בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/001.yaml
  text: But now hear[a], Jacob my servant, and Israel, whom I have chosen.
translation:
  language: hi
  text: पर अब सुन, हे याकूब, मेरे सेवक, और हे इस्राएल, जिसे मैंने चुना है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और अब सुन, हे याकूब, मेरे सेवक, और हे इस्राएल, जिसे मैंने चुना।”
    reason: आरम्भिक संयोजक को ‘और’ तथा इब्रानी पूर्ण क्रिया को सामान्य भूतकाल में भी व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: וְעַתָּה
  choice: पर अब
  rationale: यह पद पिछले न्याय और फटकार के संदर्भ से आश्वासन की ओर मुड़ता है। ‘पर अब’ इस विरोधात्मक संक्रमण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׁמַע
  choice: सुन
  rationale: एकवचन आज्ञार्थक रूप की सीधी और भविष्यद्वक्ताओं की वाणी के अनुकूल अभिव्यक्ति; मूल में अनुपस्थित कर्म को नहीं जोड़ा गया।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: इब्रानी व्यक्तिवाचक नाम का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: עַבְדִּי
  choice: मेरे सेवक
  rationale: यहाँ याकूब/इस्राएल की वाचागत और सेवकीय भूमिका प्रमुख है; ‘दास’ सम्भव है, पर आधुनिक हिन्दी में वह बंधन का भाव आवश्यकता से अधिक उभार सकता है।
- source_word: וְיִשְׂרָאֵל
  choice: और हे इस्राएल
  rationale: याकूब और इस्राएल एक ही समुदाय के समानान्तर वाचागत नाम हैं। दूसरा सम्बोधन स्पष्ट और स्वाभाविक बनाने के लिए ‘हे’ दोहराया गया है।
- source_word: בָּחַרְתִּי בוֹ
  choice: जिसे मैंने चुना है
  rationale: בחר के साथ ב का प्रयोग मुहावरेदार है और हिन्दी में सीधे कर्म के रूप में स्वाभाविक है। पूर्ण क्रिया को ‘चुना है’ कहना अतीत में सम्पन्न चयन की वर्तमान प्रासंगिकता बनाए रखता है।
theological_decisions:
- issue: इस्राएल के लिए עַבְדִּי की उपाधि
  choice: मेरे सेवक
  alternative: मेरे दास
  rationale: सन्दर्भ में प्रभु से सम्बन्ध और सौंपा गया सेवकीय कार्य प्रमुख हैं। ‘सेवक’ बंधुआपन को अनावश्यक रूप से प्रधान किए बिना इस अर्थ को व्यक्त करता है।
- issue: וְעַתָּה में आरम्भिक וְ का बल
  choice: पर अब
  alternative: और अब
  rationale: पिछले न्याय और फटकार से नई आश्वासनपूर्ण पुकार की ओर भाषण का मोड़ है; ‘पर’ उस वास्तविक आलंकारिक विरोध को स्पष्ट करता है।
- issue: בחרתי की कालगत अभिव्यक्ति
  choice: मैंने चुना है
  alternative: मैंने चुना
  rationale: इब्रानी पूर्ण रूप सम्पन्न चयन बताता है, जिसकी वाचागत प्रासंगिकता वर्तमान में बनी हुई है; हिन्दी का पूर्ण वर्तमान इस संबंध को स्वाभाविक रूप से दर्शाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सीधा किन्तु गरिमापूर्ण भविष्यद्वक्तीय सम्बोधन। समानान्तर नामों के साथ ‘हे’ का प्रयोग वाक्य की स्पष्टता और मौखिक प्रवाह के लिए किया गया है।
