  text: לִ/כְרָת ל֣/וֹ אֲרָזִ֔ים וַ/יִּקַּ֤ח תִּרְזָה֙ וְ/אַלּ֔וֹן וַ/יְאַמֶּץ ל֖/וֹ בַּ/עֲצֵי יָ֑עַר נָטַ֥ע אֹ֖רֶ וְ/גֶ֥שֶׁם יְגַדֵּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/014.yaml
  text: He cuts down cedars for himself[a], or he takes a cypress tree or an oak and chooses it from among the trees of the forest. He plants a pine[c][b], and the rain makes it grow.
translation:
  language: hi
  text: वह अपने लिए देवदार के पेड़ काटता है; वह सरू[a] और बलूत का पेड़ लेता है और उसे वन के पेड़ों के बीच अपने लिए मजबूत होने देता है[b]। वह चीड़[c] लगाता है, और वर्षा उसे बढ़ाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द תִּרְזָה से किस वृक्ष-प्रजाति का संकेत है, यह निश्चित नहीं है; इसके सम्भव अनुवादों में सरू, सदाबहार बलूत, तारपीन का पेड़ और एल्म शामिल हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “और वह वन के पेड़ों में से अपने लिए एक मजबूत पेड़ चुनता है।” इब्रानी वाक्यांश कठिन है; इसका अर्थ वृक्ष को मजबूत होने देना या वन में से मजबूत वृक्ष चुनना हो सकता है।
    reason: alternative_reading
  - marker: c
    text: इब्रानी शब्द אֹרֶ से किस वृक्ष-प्रजाति का संकेत है, यह निश्चित नहीं है; इसके सम्भव अनुवादों में चीड़, फ़र वृक्ष, ऐश और लॉरेल वृक्ष शामिल हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִכְרָת ל֣וֹ אֲרָזִ֔ים
  choice: वह अपने लिए देवदार के पेड़ काटता है
  rationale: לִכְרָת का शाब्दिक रूप उद्देश्यसूचक क्रियार्थक है, पर प्रसंग में कारीगर की सामान्य गतिविधि का वर्णन करता है; इसलिए हिन्दी में वर्तमानकालीन पूर्ण वाक्य स्वाभाविक है। ל֣וֹ के हितार्थ भाव को ‘अपने लिए’ से व्यक्त किया गया है।
- source_word: וַיִּקַּ֤ח
  choice: वह ... लेता है
  rationale: वाव-युक्त क्रिया वर्णन की अगली गतिविधि जोड़ती है। मूल पाठ में स्पष्ट विकल्पसूचक शब्द नहीं है, इसलिए ‘और’ की सूची-संरचना रखी गई है, न कि अर्थ को अनिवार्यतः ‘या’ बनाया गया है।
- source_word: תִּרְזָה֙
  choice: सरू
  rationale: इस वृक्ष-प्रजाति की पहचान अनिश्चित है। ‘सरू’ एक प्रचलित और प्रसंगानुकूल सम्भावना है; अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: וְאַלּ֔וֹן
  choice: और बलूत का पेड़
  rationale: אַלּוֹן का सामान्य अर्थ ओक है; आधुनिक मानक हिन्दी में ‘बलूत’ सहज और सटीक वृक्ष-नाम है।
- source_word: וַיְאַמֶּץ ל֖וֹ בַּעֲצֵי יָ֑עַר
  choice: और उसे वन के पेड़ों के बीच अपने लिए मजबूत होने देता है
  rationale: אָמַץ का मूल भाव मजबूत या दृढ़ करना है। संक्षिप्त और कठिन इब्रानी वाक्यांश को वृक्ष के वन में मजबूत होकर बढ़ने के अर्थ में रखा गया है, जबकि चयन-संबंधी वैकल्पिक समझ पादटिप्पणी में सुरक्षित है।
- source_word: נָטַ֥ע אֹ֖רֶ
  choice: वह चीड़ लगाता है
  rationale: נָטַע को सामान्य वर्तमान में व्यक्त किया गया है। אֹרֶ की वनस्पति-पहचान अनिश्चित है; ‘चीड़’ एक प्रचलित सम्भावना है, और विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: וְגֶ֥שֶׁם יְגַדֵּֽל
  choice: और वर्षा उसे बढ़ाती है
  rationale: यְגַדֵּל की कारक क्रिया को सीधे ‘बढ़ाती है’ कहा गया है। इससे पेड़ की साधारण प्राकृतिक वृद्धि और प्रसंग का व्यंग्य दोनों बने रहते हैं।
theological_decisions:
- issue: मूर्तिनिर्माता द्वारा लकड़ी जुटाने और वृक्ष बढ़ने के संक्षिप्त, कठिन वर्णन का अनुवाद
  choice: 'कारीगर के सामान्य कार्यों की शृंखला के रूप में अनुवाद: वह लकड़ी काटता या लेता है, वृक्ष को वन में मजबूत होने देता है, दूसरा वृक्ष लगाता है और वर्षा उसे बढ़ाती है।'
  alternative: וַיְאַמֶּץ לּוֹ को ‘वह वन के पेड़ों में से अपने लिए एक मजबूत पेड़ चुनता है’ समझना।
  rationale: मुख्य पाठ אָמַץ के ‘मजबूत’ अर्थ को बनाए रखता है और सामान्य वर्षा से उगे वृक्ष को मूर्ति बनाने की वस्तु बनाए जाने संबंधी प्रसंगगत व्यंग्य को सुरक्षित रखता है। कठिन वाक्यांश को अत्यधिक निश्चित किए बिना वैकल्पिक पाठ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज पर गरिमापूर्ण रखी गई है। ‘देवदार’, ‘सरू’, ‘बलूत’ और ‘चीड़’ साधारण पाठकों के लिए पहचाने जाने योग्य वृक्ष-नाम हैं। कठिन इब्रानी वाक्यांश की वास्तविक अस्पष्टता मुख्य पाठ और पादटिप्पणी के संयोजन से सुरक्षित रखी गई है।
