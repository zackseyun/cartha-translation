  text: בָּנַ֜יִ/ךְ עֻלְּפ֥וּ שָׁכְב֛וּ בְּ/רֹ֥אשׁ כָּל חוּצ֖וֹת כְּ/ת֣וֹא מִכְמָ֑ר הַֽ/מְלֵאִ֥ים חֲמַת יְהוָ֖ה גַּעֲרַ֥ת אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/020.yaml
  text: Your sons have fainted[a]; they lie at the head of every street, like an antelope in a net, full of the wrath of Yahweh[b], the rebuke of your God.
translation:
  language: hi
  text: तेरे बेटे मूर्छित हो गए हैं; वे हर गली के मुहाने पर पड़े हैं, जैसे जाल में फँसा कोई मृग[a]। वे यहोवा के क्रोध और तेरे परमेश्वर की फटकार से भरे हुए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जैसे जाल में फँसा जंगली बैल।” इब्रानी में प्रयुक्त पशु-नाम की सटीक पहचान अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנַיִךְ
  choice: तेरे बेटे
  rationale: बहुवचन संज्ञा का शाब्दिक अर्थ ‘तेरे बेटे’ है; यरूशलेम को स्त्री रूप में संबोधित किए जाने के अनुरूप स्त्रीलिंग एकवचन संबंध रखा गया है।
- source_word: עֻלְּפוּ
  choice: मूर्छित हो गए हैं
  rationale: यह रूप दुर्बलता और विपत्ति के कारण अचेत होकर गिर पड़ने का भाव देता है; ‘मूर्छित’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: שָׁכְבוּ
  choice: पड़े हैं
  rationale: यह उनके गिरकर वर्तमान में पड़े रहने की दशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּרֹאשׁ כָּל חוּצוֹת
  choice: हर गली के मुहाने पर
  rationale: רֹאשׁ का मूल भाव ‘सिर/आरम्भ’ है; गलियों के संदर्भ में ‘मुहाना’ शाब्दिक चित्र और स्वाभाविक हिन्दी दोनों को बनाए रखता है।
- source_word: כְּתוֹא
  choice: जैसे जाल में फँसा कोई मृग
  rationale: पशु की सटीक पहचान अनिश्चित है; ‘मृग’ किसी जंगली, शिकार किए जाने वाले पशु का व्यापक और सहज चित्र देता है, जबकि विकल्प पादटिप्पणी में रखा गया है।
- source_word: מִכְמָר
  choice: जाल में
  rationale: यह पशुओं को पकड़ने के जाल को दर्शाता है और उपमा में सीधा बैठता है।
- source_word: הַמְלֵאִים
  choice: भरे हुए हैं
  rationale: इब्रानी कृदंत बेटों की परिणामी दशा बताता है; हिन्दी में यह वाक्यांश उस स्थिति को स्पष्ट करता है।
- source_word: חֲמַת יְהוָה
  choice: यहोवा के प्रकोप
  rationale: חֵמָה तीव्र, दहकते क्रोध का भाव रखता है; ‘प्रकोप’ न्यायपूर्ण दैवी क्रोध का भार स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दैवी नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि उपाधि से बदला गया है।
- source_word: גַּעֲרַת אֱלֹהָיִךְ
  choice: तेरे परमेश्वर की डाँट
  rationale: גְּעָרָה कठोर फटकार को सूचित करता है; ‘डाँट’ साधारण पाठक के लिए स्पष्ट है और मूल की तीव्रता बनाए रखता है।
theological_decisions:
- issue: दैवी नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा-संबंधी व्यक्तिगत नाम सीधे आया है। हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ अधिक पहचाना जाता है; इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: תוא पशु की पहचान
  choice: मृग
  alternative: जंगली बैल
  rationale: इब्रानी पशु-नाम की सटीक प्रजाति अनिश्चित है और आशय जाल में असहाय पड़े जंगली पशु का है। मुख्य पाठ में व्यापक ‘मृग’ रखा गया तथा वास्तविक वैकल्पिक पहचान पादटिप्पणी में दी गई।
- issue: प्रकोप और डाँट के संबंध का प्रस्तुतीकरण
  choice: दो समानांतर पद, दोनों बेटों की दशा के कारण/विषय के रूप में
  alternative: दूसरे पद को पहले की व्याख्या मानना
  rationale: मूल पाठ दोनों संज्ञा-पदों को साथ रखता है और उनके सटीक तार्किक संबंध को नहीं खोलता; अनुवाद उसी काव्यात्मक समानांतरता और तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक और सहज रूप अपनाया गया है। यरूशलेम के लिए मूल का अंतरंग स्त्रीलिंग एकवचन संबोधन ‘तेरे’ रखा गया है। ‘हर गली के मुहाने’ से इब्रानी स्थान-चित्र स्वाभाविक हिन्दी में सुरक्षित रहता है।
