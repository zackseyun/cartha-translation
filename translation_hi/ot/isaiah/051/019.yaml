  text: שְׁתַּ֤יִם הֵ֨נָּה֙ קֹֽרְאֹתַ֔יִ/ךְ מִ֖י יָנ֣וּד לָ֑/ךְ הַ/שֹּׁ֧ד וְ/הַ/שֶּׁ֛בֶר וְ/הָ/רָעָ֥ב וְ/הַ/חֶ֖רֶב מִ֥י אֲנַחֲמֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/019.yaml
  text: These two things have come upon you—who will mourn for you?—devastation and destruction[a], famine and sword[b]; who will comfort you?
translation:
  language: hi
  text: ये दो विपत्तियाँ तुझ पर आ पड़ी हैं—कौन तेरे लिए विलाप करेगा?[a]—उजाड़ और विनाश, अकाल और तलवार;[b] कौन तुझे सांत्वना देगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस इब्रानी क्रिया का अर्थ ‘तेरे लिए शोक करेगा’ या ‘तुझसे सहानुभूति रखेगा’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी पाठ पहले ‘दो विपत्तियाँ’ कहता है, फिर चार आपदाओं का नाम लेता है। संभवतः वे दो युग्म हैं: ‘उजाड़ और विनाश’ तथा ‘अकाल और तलवार।’'
    reason: textual_cultural_note
lexical_decisions:
- source_word: שְׁתַּיִם הֵנָּה
  choice: ये दो विपत्तियाँ
  rationale: इब्रानी में बलयुक्त संकेतवाचक अभिव्यक्ति के साथ ‘दो’ स्पष्ट है। हिंदी में निहित संज्ञा को ‘विपत्तियाँ’ के रूप में व्यक्त करने से प्रसंग स्वाभाविक और स्पष्ट रहता है।
- source_word: קֹרְאֹתַיִךְ
  choice: तुझ पर आ पड़ी हैं
  rationale: यहाँ קרא का प्रयोग विपत्तियों के किसी पर आ पड़ने या उसे घेर लेने के अर्थ में है; शाब्दिक ‘तुझे पुकारती हैं’ भ्रामक होगा।
- source_word: מִי יָנוּד לָךְ
  choice: कौन तेरे लिए विलाप करेगा?
  rationale: נוּד यहाँ शोक व्यक्त करने, विलाप करने या सहानुभूति दिखाने का भाव रखता है। ‘विलाप करेगा’ आपदा के प्रसंग में मुख्य अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַשֹּׁד
  choice: उजाड़
  rationale: שֹׁד हिंसक तबाही, लूट से हुई बरबादी या उजाड़ को सूचित करता है। ‘उजाड़’ उसके परिणाम और विनाशकारी स्वर दोनों को व्यक्त करता है।
- source_word: הַשֶּׁבֶר
  choice: विनाश
  rationale: שֶׁבֶר का मूल भाव टूटने का है और भविष्यद्वाणी के आपदा-संदर्भ में यह पतन या विनाश को सूचित करता है।
- source_word: הָרָעָב
  choice: अकाल
  rationale: न्याय और राष्ट्रीय आपदा के संदर्भ में רָעָב का मानक और स्पष्ट हिंदी रूप।
- source_word: הַחֶרֶב
  choice: तलवार
  rationale: חֶרֶב यहाँ युद्ध और हिंसक मृत्यु का प्रतिनिधित्व करती है; ‘तलवार’ स्रोत की मूर्त छवि बनाए रखती है।
- source_word: מִי אֲנַחֲמֵךְ
  choice: कौन तुझे सांत्वना देगा?
  rationale: Piel रूप में נחם का अर्थ सांत्वना देना है। ‘सांत्वना’ यशायाह में बार-बार आनेवाले ढाढ़स और दिलासा के विषय को भी बनाए रखती है।
theological_decisions:
- issue: ‘दो’ कहे जाने के बाद चार आपदासूचक संज्ञाओं का आना
  choice: आरंभ में ‘दो विपत्तियाँ’ रखा और चार संज्ञाओं को दो युग्मों—‘उजाड़ और विनाश’ तथा ‘अकाल और तलवार’—के रूप में सुरक्षित रखा।
  alternative: पाठ को संशोधित मानना, ‘दो’ को छोड़ देना, या चार अलग-अलग विपत्तियाँ कहना।
  rationale: मसोरेटी पाठ स्पष्ट रूप से ‘दो’ कहता है, जबकि आगे चार पद स्वाभाविक रूप से दो जुड़े हुए युग्म बनाते हैं। अनुवाद इस तनाव को मिटाने के बजाय सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में काव्यात्मक, गंभीर और सामान्य पाठक के लिए सुबोध शैली रखी गई है। यरूशलेम/सिय्योन को संबोधित एकवचन आत्मीय सर्वनाम ‘तुझ/तेरे’ स्रोत के स्त्रीलिंग एकवचन संबोधन को स्वाभाविक हिंदी में व्यक्त करता है।
