  yaml_path: translation/ot/isaiah/051/021.yaml
  text: 'Therefore, please hear this, afflicted one, drunk, but not from wine:'
translation:
  language: hi
  text: 'इसलिए, हे पीड़िता, कृपया यह सुन: तू मतवाली है, पर दाखमधु से नहीं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: निष्कर्ष या परिणाम सूचित करने वाले इब्रानी संयोजक का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: שִׁמְעִי נָא
  choice: अब यह सुन
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक को संबोधन के अनुरूप रखा गया है; נָא को यहाँ आग्रह और तात्कालिकता दर्शाने वाले स्वाभाविक हिन्दी ‘अब’ से व्यक्त किया गया है, न कि अत्यधिक विनम्र ‘कृपया’ से।
- source_word: עֲנִיָּה
  choice: हे दुःखियारी
  rationale: स्त्रीलिंग संबोधन और पीड़ित-अवस्था दोनों को संक्षिप्त, dignified और काव्यात्मक हिन्दी में व्यक्त करता है।
- source_word: וּשְׁכֻרַת
  choice: तू मतवाली है
  rationale: स्त्रीलिंग ‘मत्त/मतवाली’ अवस्था को स्पष्ट करता है; अगला वाक्यांश बताता है कि यह वास्तविक दाखमधु के कारण नहीं है।
- source_word: וְלֹא מִיָּיִן
  choice: पर दाखमधु से नहीं
  rationale: विरोध को ‘पर’ से और יַיִן के विशिष्ट अर्थ ‘wine’ को ‘दाखमधु’ से व्यक्त किया गया है।
theological_decisions:
- issue: मतवालेपन का कारण
  choice: ‘पर दाखमधु से नहीं’ को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: इसे परमेश्वर के क्रोध या दुःख के कारण मतवाला होना स्पष्ट करना
  rationale: इस पद में कारण केवल नकारात्मक रूप से बताया गया है; उसकी व्याख्या निकटवर्ती संदर्भ पर छोड़ने से मूल की काव्यात्मक और धर्मवैचारिक तनावपूर्णता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक-भविष्यद्वक्तात्मक संबोधन रखा गया है। ‘हे दुःखियारी’ और ‘तू’ स्त्रीरूप नगर/सिय्योन को संबोधित मूल व्याकरण को बनाए रखते हैं। कोई पादटिप्पणी आवश्यक नहीं।
