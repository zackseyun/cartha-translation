id: ISA.51.13
reference: Isaiah 51:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תִּשְׁכַּ֞ח יְהוָ֣ה עֹשֶׂ֗/ךָ נוֹטֶ֣ה שָׁמַיִם֮ וְ/יֹסֵ֣ד אָרֶץ֒ וַ/תְּפַחֵ֨ד תָּמִ֜יד כָּל הַ/יּ֗וֹם מִ/פְּנֵי֙ חֲמַ֣ת הַ/מֵּצִ֔יק כַּ/אֲשֶׁ֥ר כּוֹנֵ֖ן לְ/הַשְׁחִ֑ית וְ/אַיֵּ֖ה חֲמַ֥ת הַ/מֵּצִֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/013.yaml
  text: and you forgot Yahweh your Maker[a], who stretched out the heavens and founded the earth, and you feared continually all day long because of the fury of the oppressor, when he set himself to destroy. But where is the fury of the oppressor?
translation:
  language: hi
  text: और तू याहवे, अपने बनानेवाले को भूल गया, जिसने आकाश को फैलाया और पृथ्वी की नींव डाली; और तू अत्याचारी के क्रोध के कारण दिन भर लगातार डरता रहा, जब वह नाश करने को तैयार था[a]। पर अत्याचारी का क्रोध कहाँ है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“जब वह नाश करने को तैयार था” का अनुवाद यह भी हो सकता है: “मानो वह नाश करने को तैयार हो।”'
    reason: כַּאֲשֶׁר כּוֹנֵן לְהַשְׁחִית के कालगत/स्थितिगत और संभाव्य अर्थों की वास्तविक व्याख्यात्मक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וַתִּשְׁכַּח
  choice: तू भूल गया
  rationale: यह शׁכח का काल रूप है और इस भविष्यद्वाणी-संबंधी उलाहने में पूर्ण हुई क्रिया को स्वाभाविक रूप से व्यक्त करता है। एकवचन संबोधन को बनाए रखने के लिए ‘तू’ रखा गया है।
- source_word: יְהוָה
  choice: यहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; इसलिए इसे किसी उपाधि से बदलने के बजाय हिन्दी में ‘यहवे’ लिप्यंतरित किया गया है।
- source_word: עֹשֶׂךָ
  choice: अपने बनानेवाले
  rationale: עשה के कृदंत और द्वितीय पुरुष एकवचन प्रत्यय का अर्थ ‘तुझे बनानेवाला’ है। ‘अपने बनानेवाले’ हिन्दी में संबोधन के साथ सहज और संक्षिप्त है।
- source_word: נוֹטֶה שָׁמַיִם
  choice: जिसने आकाश को ताना
  rationale: נטה सृष्टि-वर्णन में फैलाने या तानने का बिंब रखता है। ‘ताना’ उस ठोस बिंब को बनाए रखता है।
- source_word: וְיֹסֵד אָרֶץ
  choice: और पृथ्वी की नींव डाली
  rationale: יסד का संबंध नींव डालने या स्थापित करने से है। यह अनुवाद सृष्टि के स्थापत्य-बिंब को स्पष्ट रखता है।
- source_word: וַתְּפַחֵד
  choice: और तू ... डरता रहा
  rationale: פחד का सीधा अर्थ भय करना है। ‘डरता रहा’ आगे के निरंतरता-सूचक पदों के साथ स्वाभाविक हिन्दी देता है और अनावश्यक रूप से शारीरिक काँपने का भाव नहीं जोड़ता।
- source_word: תָּמִיד כָּל הַיּוֹם
  choice: दिन भर लगातार
  rationale: 'दोनों काल-सूचक तत्वों को रखा गया है: כָּל הַיּוֹם ‘दिन भर’ और תָּמִיד ‘लगातार’।'
- source_word: מִפְּנֵי חֲמַת הַמֵּצִיק
  choice: सतानेवाले के क्रोध के कारण
  rationale: מִפְּנֵי यहाँ कारण बताता है; חֲמַת तीव्र क्रोध है और מֵּצִיק उस व्यक्ति को दर्शाता है जो दबाता या सताता है।
- source_word: כַּאֲשֶׁר כּוֹנֵן לְהַשְׁחִית
  choice: जब वह नाश करने को तैयार हुआ
  rationale: כּוֹנֵן में तैयार या दृढ़ होने का भाव है। निकटतम कर्ता सतानेवाला है। खंड का कालगत अर्थ मुख्य पाठ में रखा गया है, जबकि संभाव्य अर्थ पादटिप्पणी में दिया गया है।
- source_word: וְאַיֵּה חֲמַת הַמֵּצִיק
  choice: पर अब सतानेवाले का क्रोध कहाँ है?
  rationale: אַיֵּה का आलंकारिक प्रश्न सतानेवाले की शक्ति की क्षणभंगुरता दिखाता है। ‘पर’ विरोध को और ‘अब’ प्रश्न के वर्तमान बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम יהוה का प्रयोग करता है। ‘यहवे’ नाम को नाम के रूप में सुरक्षित रखता है और उसे उपाधि में नहीं बदलता।
- issue: ‘नाश करने को तैयार हुआ’ का कर्ता
  choice: सतानेवाला
  alternative: अनिश्चित कर्ता; या संभाव्य अर्थ ‘मानो वह नाश करने को तैयार हो’
  rationale: निकटतम व्याकरणिक पूर्वपद הַמֵּצִיק है और अगला प्रश्न भी उसी सतानेवाले के क्रोध पर केंद्रित है। फिर भी כַּאֲשֶׁר כּוֹנֵן की संभाव्य व्याख्या वास्तविक है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली। मूल के द्वितीय पुरुष एकवचन को ‘तू’ से बनाए रखा गया है। सृष्टि-वर्णन के ‘आकाश को ताना’ और ‘पृथ्वी की नींव डाली’ जैसे ठोस बिंब सुरक्षित रखे गए हैं।
