id: ISA.51.10
reference: Isaiah 51:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/ל֤וֹא אַתְּ הִיא֙ הַ/מַּחֲרֶ֣בֶת יָ֔ם מֵ֖י תְּה֣וֹם רַבָּ֑ה הַ/שָּׂ֨מָה֙ מַֽעֲמַקֵּי יָ֔ם דֶּ֖רֶךְ לַ/עֲבֹ֥ר גְּאוּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/010.yaml
  text: Was it not you who dried up the sea[a], the waters of the great deep[b], who made the depths of the sea a way for the redeemed to cross over?
translation:
  language: hi
  text: क्या तू ही नहीं है जिसने समुद्र को, उस महान गहराई के जल को, सुखा दिया था, जिसने समुद्र की गहराइयों को छुड़ाए हुओं[a] के पार जाने के लिए मार्ग बना दिया था?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मोल देकर छुड़ाए गए लोग’।
    reason: גְּאוּלִים के लिए वैकल्पिक अनुवाद; यह छुड़ाए जाने के भाव को अधिक स्पष्ट करता है, जबकि मुख्य पाठ भुगतान के साधन को निर्दिष्ट नहीं करता।
lexical_decisions:
- source_word: הֲלוֹא אַתְּ הִיא
  choice: क्या तू ही वह नहीं है
  rationale: नकारात्मक आलंकारिक प्रश्न अपेक्षित सकारात्मक उत्तर को बनाए रखता है। ‘तू ही’ स्त्रीलिंग एकवचन संबोधन के साथ मूल के बलाघात को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמַּחֲרֶבֶת יָם
  choice: जिसने समुद्र को ... सुखा दिया था
  rationale: חרב का कारक अर्थ यहाँ जल को सुखाने का है। भूतकालीन रूप निर्गमन की घटना की ओर पीछे मुड़कर देखने वाले संदर्भ के अनुकूल है।
- source_word: מֵי תְּהוֹם רַבָּה
  choice: विशाल अथाह गहराई के जल
  rationale: यह रूप תְּהוֹם की गहन और व्यापक जलराशि की छवि को बनाए रखता है, बिना उसे किसी विशेष पौराणिक अर्थ तक सीमित किए।
- source_word: מַעֲמַקֵּי יָם
  choice: समुद्र की गहराइयों
  rationale: बहुवचन ‘गहराइयों’ मूल की बहुवचन संरचना और समुद्र के गहरे भागों की छवि को सुरक्षित रखता है।
- source_word: דֶּרֶךְ לַעֲבֹר
  choice: पार जाने का मार्ग
  rationale: यह समुद्र पार करने की ठोस घटना को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גְּאוּלִים
  choice: छुड़ाए हुओं
  rationale: גאל के निष्क्रिय कृदन्त का अर्थ उन लोगों से है जिन्हें बंधन या संकट से छुड़ाया गया है। यह हिन्दी में उद्धार की क्रिया को स्पष्ट रखता है।
theological_decisions:
- issue: निर्गमन-संबंधी संकेत और छुटकारे की व्यापक छवि
  choice: मुख्य पाठ में केवल ‘समुद्र’ रखा गया है और पार जाने की ऐतिहासिक छवि को स्पष्ट रहने दिया गया है।
  alternative: ‘लाल समुद्र’ को स्पष्ट रूप से लिखना, या कथन को केवल रूपकात्मक छुटकारे के रूप में प्रस्तुत करना।
  rationale: इब्रानी पाठ निर्गमन की घटना का प्रबल संकेत देता है, पर समुद्र का नाम नहीं बताता। सामान्य पद ‘समुद्र’ ऐतिहासिक संकेत और यशायाह में उसके व्यापक उद्धारात्मक प्रयोग—दोनों को बनाए रखता है।
- issue: גְּאוּלִים में छुटकारे का स्वरूप
  choice: ‘छुड़ाए हुए’
  alternative: ‘मोल देकर छुड़ाए गए’ या ‘उद्धार पाए हुए’
  rationale: मूल शब्द में छुड़ाने/छुटकारा दिलाने का भाव है, पर इस पद में भुगतान के साधन को स्पष्ट नहीं किया गया। मुख्य पाठ में वह अतिरिक्त विवरण नहीं जोड़ा गया।
translation_notes:
  register: भाषा काव्यात्मक, गरिमापूर्ण और आधुनिक मानक हिन्दी में रखी गई है। ‘तू’ स्त्रीलिंग एकवचन मूल संबोधन और निकट, प्रत्यक्ष काव्यात्मक पुकार को बनाए रखता है। डैश समानार्थी विस्तार ‘समुद्र’ और ‘विशाल अथाह गहराई के जल’ के संबंध को स्पष्ट करते हैं।
