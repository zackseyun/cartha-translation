source:
  edition: WLC
  text: אֵין מְנַהֵ֣ל לָ֔/הּ מִ/כָּל בָּנִ֖ים יָלָ֑דָה וְ/אֵ֤ין מַחֲזִיק֙ בְּ/יָדָ֔/הּ מִ/כָּל בָּנִ֖ים גִּדֵּֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/018.yaml
  text: There is no one to guide her among all the sons she has borne[a], and no one to take her by the hand among all the sons she has raised.
translation:
  language: hi
  text: जिन पुत्रों को उसने जन्म दिया, उन सब में से कोई भी उसे मार्ग दिखानेवाला नहीं है[a]; और जिन पुत्रों को उसने पाला-पोसा, उन सब में से कोई भी उसका हाथ थामनेवाला नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन सभी पुत्रों को उसने जन्म दिया, उनमें से … जिन सभी पुत्रों को उसने पाला-पोसा, उनमें से।” इब्रानी में विशेष रूप से “पुत्रों” है; व्यापक अनुवाद में “बच्चों” भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנַהֵל
  choice: मार्ग दिखानेवाला
  rationale: נהל का कृदंत नेतृत्व या मार्गदर्शन करने वाले व्यक्ति को दर्शाता है। असहाय स्त्री के रूप में चित्रित सिय्योन के संदर्भ में यह स्वाभाविक हिंदी में दिशा और सहारे—दोनों का भाव देता है।
- source_word: לָהּ
  choice: उसे
  rationale: स्त्रीलिंग एकवचन प्रत्यय मानवीकृत नगर सिय्योन/यरूशलेम की ओर संकेत करता है।
- source_word: מִכָּל בָּנִים
  choice: उन सब पुत्रों में से
  rationale: 'מִן के साथ כָּל पूरे समूह में से चयन का भाव देता है: उसके सभी पुत्रों में से एक भी नहीं। בָּנִים की स्पष्ट पुल्लिंगता बनाए रखने के लिए ‘पुत्रों’ चुना गया है।'
- source_word: יָלָדָה
  choice: उसने जन्म दिया
  rationale: पूर्ण क्रिया मातृ-रूपक में उन पुत्रों को जन्म देने की पूरी हो चुकी क्रिया बताती है; यह आधुनिक हिंदी में स्वाभाविक है।
- source_word: מַחֲזִיק בְּיָדָהּ
  choice: उसका हाथ थामनेवाला
  rationale: शाब्दिक बिंब उसके हाथ को पकड़ने या दृढ़ करने का है और प्रसंग में व्यक्तिगत सहारे का भाव देता है। ‘हाथ थामना’ उस बिंब और भाव दोनों को सहज हिंदी में रखता है।
- source_word: גִּדֵּלָה
  choice: उसने पाला-पोसा
  rationale: גדל का पिएल रूप यहाँ बच्चों को बड़ा करने या पालने के अर्थ में है। ‘पाला-पोसा’ आधुनिक हिंदी में स्पष्ट है और मातृ-रूपक को बनाए रखता है।
- source_word: אֵין ... וְאֵין
  choice: कोई भी ... नहीं है; और ... कोई भी ... नहीं है
  rationale: दोहराई गई अस्तित्ववाचक नकारोक्ति पूर्ण असहायता और परित्याग पर बल देती है; हिंदी में दोनों खंडों में ‘कोई भी नहीं’ उस बल को सुरक्षित रखता है।
theological_decisions:
- issue: בָּנִים का लिंग-सूचक अनुवाद
  choice: पुत्रों
  alternative: बच्चों
  rationale: इब्रानी संज्ञा स्पष्ट रूप से पुल्लिंग बहुवचन है और यरूशलेम के मातृ-रूपक में उसके ‘पुत्रों’ का उल्लेख करती है। इसलिए मुख्य पाठ में लिंग-सटीक रूप रखा गया है, जबकि व्यापक अर्थ की संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। समानांतर इब्रानी संरचना को दोनों खंडों में ‘जिन पुत्रों को... उन सब में से कोई भी... नहीं’ के द्वारा सुरक्षित रखा गया है।
