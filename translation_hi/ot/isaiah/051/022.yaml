source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנַ֣יִ/ךְ יְהוָ֗ה וֵ/אלֹהַ֨יִ/ךְ֙ יָרִ֣יב עַמּ֔/וֹ הִנֵּ֥ה לָקַ֛חְתִּי מִ/יָּדֵ֖/ךְ אֶת כּ֣וֹס הַ/תַּרְעֵלָ֑ה אֶת קֻבַּ֨עַת֙ כּ֣וֹס חֲמָתִ֔/י לֹא תוֹסִ֥יפִי לִ/שְׁתּוֹתָ֖/הּ עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/022.yaml
  text: 'Thus says your Lord[a], Yahweh, and your God, who pleads the cause of his people: Behold, I have taken from your hand the cup of staggering, the bowl of the cup of my wrath[b]; you shall never again drink it.'
translation:
  language: hi
  text: 'तेरा प्रभु, याहवे, और तेरा परमेश्वर, जो अपनी प्रजा की पैरवी करता है, यूं कहता है: “देख, मैंने तेरे हाथ से लड़खड़ाहट का प्याला[a]—मेरे क्रोध के प्याले का कटोरा[b]—ले लिया है; अब तू उसे फिर कभी नहीं पिएगी।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘डगमगाहट का प्याला’ अथवा ‘कंपकंपी का प्याला।’ इब्रानी शब्द यहाँ न्याय के उस स्तब्धकारी प्रभाव को दर्शाता है जिससे मनुष्य मदहोश-सा होकर लड़खड़ाता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘मेरे क्रोध के प्याले का कटोरा/पात्र।’ इब्रानी में बल देने के लिए पीने के पात्रों के बिम्ब एक के ऊपर एक रखे गए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנַיִךְ
  choice: तेरा प्रभु
  rationale: यह अधिकारसूचक ईश्वरीय उपाधि है। ‘प्रभु’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है तथा स्त्रीलिंग एकवचन सम्बोधन को ‘तेरा’ से बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: וֵאלֹהַיִךְ
  choice: और तेरा परमेश्वर
  rationale: सन्दर्भ में यह इस्राएल के एकमात्र परमेश्वर को दर्शाता है और मूल में ईश्वरीय पदवियों के संचय को सुरक्षित रखता है।
- source_word: יָרִיב עַמּוֹ
  choice: जो अपनी प्रजा का मुकदमा लड़ता है
  rationale: 'ריב के न्यायिक अर्थ को स्पष्ट रखता है: वह अपनी प्रजा का पक्ष लेकर उसका मामला लड़ता है।'
- source_word: הִנֵּה
  choice: देख
  rationale: भविष्यद्वाणी की ओर ध्यान खींचने वाली शक्ति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לָקַחְתִּי מִיָּדֵךְ
  choice: मैंने तेरे हाथ से ... ले लिया है
  rationale: पूर्ण हो चुके उद्धारकारी कार्य और हाथ से पात्र हटाए जाने के मूर्त बिम्ब, दोनों को बनाए रखता है।
- source_word: כּוֹס הַתַּרְעֵלָה
  choice: लड़खड़ा देने वाला प्याला
  rationale: תַּרְעֵלָה न्याय से उत्पन्न मदहोशी-जैसी लड़खड़ाहट को सूचित करता है। कारणात्मक हिन्दी अभिव्यक्ति पाठक को प्रभाव स्पष्ट करती है।
- source_word: קֻבַּעַת כּוֹס חֲמָתִי
  choice: अपने क्रोध के प्याले का कटोरा
  rationale: मूल के पात्र-सम्बन्धी दोहरे बिम्ब—प्याला और कटोरा—को सरल बनाए बिना यथासम्भव सुरक्षित रखता है।
- source_word: לֹא תוֹסִיפִי לִשְׁתּוֹתָהּ עוֹד
  choice: अब तू उसे फिर कभी नहीं पिएगी
  rationale: स्त्रीलिंग एकवचन सम्बोधन और भविष्य में उस अनुभव की emphatic समाप्ति, दोनों को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय उपाधियों और नाम का क्रम
  choice: तेरा प्रभु याहवे और तेरा परमेश्वर
  alternative: तेरा स्वामी, याहवे, तेरा परमेश्वर
  rationale: मूल की तीन अभिव्यक्तियों को अलग पहचाने योग्य रखते हुए हिन्दी में स्वाभाविक appositional क्रम दिया गया है; याहवे को ‘प्रभु’ में विलीन नहीं किया गया।
- issue: अपनी प्रजा की ओर से परमेश्वर की न्यायिक भूमिका
  choice: जो अपनी प्रजा का मुकदमा लड़ता है
  alternative: जो अपनी प्रजा की पैरवी करता है
  rationale: न्यायालयीन रूपक को बनाए रखता है और यह खुला छोड़ता है कि इस मुकदमे में प्रतिवाद या प्रतिरक्षा के कौन-कौन से पहलू सम्मिलित हैं।
- issue: ईश्वरीय क्रोध के प्याले का रूपक
  choice: प्याले और कटोरे के बिम्ब को अक्षुण्ण रखना
  alternative: इसे सीधे दण्ड या दुःख के रूप में समझाकर कहना
  rationale: शाब्दिक रूपक बाइबिल के व्यापक अन्तर्पाठीय सम्बन्धों और न्याय की धर्मवैचारिक गम्भीरता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और भविष्यद्वाणी के अनुकूल रखी गई है। ‘तू/तेरा/पिएगी’ मूल के स्त्रीलिंग एकवचन सम्बोधन—सिय्योन/यरूशलेम—को दृश्यमान बनाते हैं। विराम-चिह्न पात्रों की appositional पुनरुक्ति को पढ़ने योग्य बनाते हैं, पर उसे मिटाते नहीं।
