source:
  edition: WLC
  text: וְ/אָֽנֹכִי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ רֹגַ֣ע הַ/יָּ֔ם וַ/יֶּהֱמ֖וּ גַּלָּ֑י/ו יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/015.yaml
  text: For I am Yahweh your God[b][a], who stirs up the sea so that its waves roar— Yahweh of hosts is his name.
translation:
  language: hi
  text: क्योंकि मैं याहवे, तुम्हारा परमेश्वर हूँ, जो समुद्र को उद्वेलित करता है[a], जिससे उसकी लहरें गरज उठती हैं—सेनाओं का याहवे उसका नाम है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो समुद्र को शांत करता है, और उसकी लहरें गरजती हैं।” हिब्रू कृदंत का अर्थ संदर्भ के अनुसार “उद्वेलित करना” या “शांत करना” समझा जा सकता है; यहाँ आगे का वाक्यांश “उसकी लहरें गरज उठती हैं” पहले अर्थ के पक्ष में है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से “उसका नाम है” है। प्रत्यक्ष वाणी के कारण कुछ अनुवाद इसे “मेरा नाम है” कर देते हैं, पर मूल पाठ में तृतीय पुरुष है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: क्योंकि मैं
  rationale: संदर्भ में यह पिछले आश्वासन का कारण बताता है, जबकि स्वतंत्र सर्वनाम ‘मैं’ पर बल देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन संबोधन और वाचा-संबंधी निकटता को सीधे रूप में सुरक्षित रखता है।
- source_word: רֹגַע הַיָּם
  choice: जो समुद्र को मथता है
  rationale: रֹגַע का अर्थ संदर्भानुसार समुद्र को उद्वेलित करना या शांत करना हो सकता है; आगे लहरों के गरजने के कारण यहाँ ‘मथता है’ अधिक स्वाभाविक है।
- source_word: וַיֶּהֱמוּ גַּלָּיו
  choice: और उसकी लहरें गरज उठती हैं
  rationale: क्रिया समुद्र को मथने के परिणामस्वरूप उठने वाले कोलाहल को व्यक्त करती है; ‘गरज उठती हैं’ उस परिणाम और जीवंत बिंब दोनों को रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: यह दिव्य उपाधि सामर्थ्य और सैन्य अर्थ-संकेत को बिना अतिरिक्त व्याख्या के सुरक्षित रखती है।
- source_word: שְׁמוֹ
  choice: उसका नाम है
  rationale: मसोरेटिक पाठ में प्रत्यय तृतीय पुरुष एकवचन है; इसलिए प्रत्यक्ष वाणी में अपेक्षित ‘मेरा’ से इसे नहीं बदला गया।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम को स्पष्ट रखते हुए किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: समुद्र के संबंध में רֹגַע का अर्थ
  choice: समुद्र को मथता है
  alternative: समुद्र को शांत करता है
  rationale: शब्द की वास्तविक अर्थगत अस्पष्टता को पादटिप्पणी में रखा गया है, पर लहरों के गरजने वाला अगला वाक्यांश यहाँ उद्वेलित करने के अर्थ का समर्थन करता है।
- issue: प्रत्यक्ष दिव्य वाणी में שְׁמוֹ का पुरुष
  choice: उसका नाम है
  alternative: मेरा नाम है
  rationale: सहज हिंदी में प्रथम पुरुष अपेक्षित हो सकता है, फिर भी हिब्रू पाठ के तृतीय पुरुष को बनाए रखा गया है ताकि पाठगत तनाव न मिटे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मथता है’ समुद्र की उथल-पुथल का स्वाभाविक हिंदी बिंब देता है; ‘गरज उठती हैं’ परिणाम को सहज रूप से व्यक्त करता है। दिव्य नाम और तृतीय पुरुष की असामान्य रचना मूल पाठ के अनुसार सुरक्षित हैं।
