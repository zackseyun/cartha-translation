  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שְׂאוּ֩ לַ/שָּׁמַ֨יִם עֵֽינֵי/כֶ֜ם וְֽ/הַבִּ֧יטוּ אֶל הָ/אָ֣רֶץ מִ/תַּ֗חַת כִּֽי שָׁמַ֜יִם כֶּ/עָשָׁ֤ן נִמְלָ֨חוּ֙ וְ/הָ/אָ֨רֶץ֙ כַּ/בֶּ֣גֶד תִּבְלֶ֔ה וְ/יֹשְׁבֶ֖י/הָ כְּמוֹ כֵ֣ן יְמוּת֑וּ/ן וִ/ישֽׁוּעָתִ/י֙ לְ/עוֹלָ֣ם תִּֽהְיֶ֔ה וְ/צִדְקָתִ֖/י לֹ֥א תֵחָֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/006.yaml
  text: Lift up your eyes to the heavens[a], and look at the earth beneath; for the heavens will vanish like smoke, and the earth will wear out like a garment, and its inhabitants will die likewise. But my salvation will be forever[b], and my righteousness will not be shattered.
translation:
  language: hi
  text: 'आकाश की ओर अपनी आँखें उठाओ,

    और नीचे पृथ्वी पर दृष्टि करो;

    क्योंकि आकाश धुएँ के समान विलीन हो जाएगा[a],

    पृथ्वी वस्त्र के समान घिस जाएगी,

    और उसके निवासी भी उसी प्रकार मर जाएँगे।

    पर मेरा उद्धार सदा बना रहेगा,

    और मेरी धार्मिकता[b] कभी नष्ट नहीं होगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी क्रिया कठिन है। अनुवाद यह भी हो सकता है: “धुएँ के समान बिखर जाएगा।” आशय आकाश के मिट जाने का है।'
    reason: lexical_alternative
  - marker: b
    text: या, “मेरा न्याय।” इब्रानी शब्द धार्मिकता और न्याय—दोनों का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ ... עֵינֵיכֶם
  choice: अपनी आँखें उठाओ
  rationale: बहुवचन आज्ञार्थक क्रिया और उसके प्रत्यक्ष कर्म को स्वाभाविक हिन्दी मुहावरे में रखते हुए ठोस चित्र सुरक्षित किया गया है।
- source_word: לַשָּׁמַיִם
  choice: आकाश की ओर
  rationale: शׁמים रूपतः बहुवचन है, पर आधुनिक मानक हिन्दी में ब्रह्मांडीय अथवा दृश्य गगन के लिए ‘आकाश’ स्वाभाविक सामूहिक संज्ञा है; ‘आकाशों’ यहाँ असहज होता।
- source_word: וְהַבִּיטוּ אֶל הָאָרֶץ מִתַּחַת
  choice: और नीचे पृथ्वी पर दृष्टि करो
  rationale: ऊपर के आकाश और नीचे की पृथ्वी का समानांतर विरोध बनाए रखा गया है; ‘दृष्टि करो’ गरिमापूर्ण किंतु बोधगम्य है।
- source_word: נִמְלָחוּ
  choice: विलीन हो जाएगा
  rationale: यह इब्रानी क्रिया कठिन और अर्थ की दृष्टि से विवादित है। प्रसंग में आकाश के मिट जाने अथवा धुएँ की तरह बिखर जाने का भाव है; ‘विलीन’ इस भाव को पठनीय हिन्दी में व्यक्त करता है, और विकल्प पादटिप्पणी में दिया गया है।
- source_word: כֶּעָשָׁן
  choice: धुएँ के समान
  rationale: मूल उपमा को सीधे और स्पष्ट रूप में रखा गया है।
- source_word: תִּבְלֶה ... כַּבֶּגֶד
  choice: वस्त्र के समान घिस जाएगी
  rationale: בלה का पुराने पड़ने या उपयोग से घिस जाने का भाव वस्त्र की उपमा के साथ स्पष्ट रूप से व्यक्त होता है।
- source_word: וְיֹשְׁבֶיהָ כְּמוֹ כֵן יְמוּתוּן
  choice: और उसके निवासी भी उसी प्रकार मर जाएँगे
  rationale: पृथ्वी पर रहने वालों और पहले वर्णित नश्वरता के बीच समानता को बिना अनावश्यक व्याख्या के सुरक्षित रखा गया है।
- source_word: וִישׁוּעָתִי לְעוֹלָם תִּהְיֶה
  choice: पर मेरा उद्धार सदा बना रहेगा
  rationale: क्षणभंगुर सृष्टि और परमेश्वर के स्थायी उद्धार के बीच निहित विरोध स्पष्ट करने के लिए हिन्दी में स्वाभाविक ‘पर’ प्रयोग किया गया है।
- source_word: וְצִדְקָתִי לֹא תֵחָת
  choice: और मेरी धार्मिकता कभी नष्ट नहीं होगी
  rationale: חתת का मूल भाव टूटने, चूर होने या समाप्त किए जाने से जुड़ा है; अमूर्त संज्ञा ‘धार्मिकता’ के साथ ‘नष्ट नहीं होगी’ आधुनिक हिन्दी में स्वाभाविक रहते हुए स्थायित्व का आशय सुरक्षित रखता है।
theological_decisions:
- issue: צִדְקָתִי का अर्थ-क्षेत्र
  choice: मेरी धार्मिकता
  alternative: मेरा न्याय
  rationale: צדקה में नैतिक खराई, न्याय और वाचा के प्रति विश्वासयोग्य उद्धारकारी कार्य—इन सबका अर्थ-क्षेत्र हो सकता है। ‘धार्मिकता’ इस व्यापकता को ‘न्याय’ की अपेक्षा अधिक सुरक्षित रखती है; न्याय वाला अर्थ पादटिप्पणी में रखा गया है।
- issue: לֹא תֵחָת का रूपकात्मक प्रयोग
  choice: कभी नष्ट नहीं होगी
  alternative: कभी चूर न होगी / कभी विफल न होगी
  rationale: ‘चूर होना’ मूल क्रिया की छवि के निकट है, पर धार्मिकता के साथ हिन्दी में अत्यंत अस्वाभाविक है; ‘विफल’ प्रभावशीलता का अर्थ अधिक जोड़ सकता है। ‘नष्ट नहीं होगी’ मूल के स्थायित्व-विरोध को बिना किसी विशेष सिद्धान्त की ओर झुकाए व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और काव्यात्मक समानांतरता के अनुकूल। ‘आकाश’, ‘पृथ्वी’, ‘वस्त्र’, ‘उद्धार’ और ‘धार्मिकता’ जैसे परिचित बाइबलीय शब्द रखे गए हैं। पंक्ति-विन्यास मूल पद की काव्यात्मक संरचना और क्षणभंगुर सृष्टि बनाम स्थायी उद्धार के विरोध को उभारता है।
