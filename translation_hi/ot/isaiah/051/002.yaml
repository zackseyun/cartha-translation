base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/002.yaml
  text: Look to Abraham your father and to Sarah who bore you; for I called him when he was one[a], and I blessed him and multiplied him.
translation:
  language: hi
  text: अपने पिता अब्राहम की ओर देखो और सारा की ओर, जिसने तुम्हें जन्म दिया; क्योंकि जब वह एक ही था[a], तब मैंने उसे बुलाया, और मैंने उसे आशीष दी और उसे बहुत बढ़ाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब वह अकेला था।” इब्रानी में शाब्दिक रूप से “एक” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּיטוּ
  choice: की ओर देखो
  rationale: बहुवचन आज्ञार्थक रूप दृश्य रूपक के साथ अब्राहम और सारा को उदाहरण मानकर ध्यान देने का भाव बनाए रखता है।
- source_word: אַבְרָהָם אֲבִיכֶם
  choice: अपने पिता अब्राहम
  rationale: इब्रानी के पारिवारिक और वाचागत संबंध को सीधे तथा स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: שָׂרָה תְּחוֹלֶלְכֶם
  choice: सारा की ओर, जिसने तुम्हें जन्म दिया
  rationale: क्रिया में प्रसव और जन्म देने का मातृ-चित्र है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले दिए गए आग्रह का आधार प्रस्तुत करता है।
- source_word: אֶחָד
  choice: जब वह एक ही था
  rationale: मूल का संक्षिप्त शब्द 'एक' सुरक्षित रहता है और एक व्यक्ति से बहुतों को उत्पन्न करने की बात उभरती है; 'अकेला' को पाद-टिप्पणी में विकल्प रखा गया है।
- source_word: קְרָאתִיו
  choice: मैंने उसे बुलाया
  rationale: दिव्य बुलाहट के प्रसंग में קרא का सीधा अर्थ देता है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: וַאֲבָרְכֵהוּ
  choice: मैंने उसे आशीष दी
  rationale: ברך का स्वाभाविक हिन्दी प्रतिरूप है और वाचा-संबंधी अर्थ को बनाए रखता है।
- source_word: וְאַרְבֵּהוּ
  choice: उसकी वंश-वृद्धि की
  rationale: हिफ़ील रूप 'बहुत करना/बढ़ाना' यहाँ अब्राहम से उत्पन्न जनसमूह की वृद्धि दर्शाता है; केवल 'उसे बढ़ाया' की अपेक्षा हिन्दी में अधिक स्पष्ट है।
theological_decisions:
- issue: बुलाए जाते समय अब्राहम की दशा के संबंध में אֶחָד का अर्थ
  choice: जब वह एक ही था
  alternative: जब वह अकेला था / केवल एक व्यक्ति था
  rationale: मुख्य पाठ इब्रानी के शाब्दिक और सघन 'एक' को बनाए रखता है, जिससे एक व्यक्ति से वाचा-समुदाय की वृद्धि का तनाव सुरक्षित रहता है; 'अकेला' संभावित व्याख्यात्मक अर्थ है, इसलिए उसे पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली। बहुवचन संबोधन 'देखो' रखा गया है। 'जन्म दिया' मातृ-चित्र को स्पष्ट करता है, और 'वंश-वृद्धि' प्रसंगगत परिणाम को स्वाभाविक हिन्दी में व्यक्त करती है।
