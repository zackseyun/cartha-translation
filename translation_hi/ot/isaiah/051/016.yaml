id: ISA.51.16
reference: Isaiah 51:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָ/אָשִׂ֤ים דְּבָרַ/י֙ בְּ/פִ֔י/ךָ וּ/בְ/צֵ֥ל יָדִ֖/י כִּסִּיתִ֑י/ךָ לִ/נְטֹ֤עַ שָׁמַ֨יִם֙ וְ/לִ/יסֹ֣ד אָ֔רֶץ וְ/לֵ/אמֹ֥ר לְ/צִיּ֖וֹן עַמִּ/י אָֽתָּה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/016.yaml
  text: And I have put my words in your mouth[a], and covered you with the shadow of my hand, to plant the heavens and to found the earth, and to say to Zion[b], ‘You are my people.’
translation:
  language: hi
  text: 'मैंने अपने वचन तेरे मुँह में रखे हैं और अपने हाथ की छाया में तुझे ढाँप लिया है[a]—आकाशों को रोपने[b], पृथ्वी की नींव डालने और सिय्योन से यह कहने के लिए: “तू मेरी प्रजा है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने हाथ की छाया से तुझे ढाँप लिया है।”
    reason: इब्रानी पूर्वसर्ग को स्थानवाचक (‘छाया में/तले’) या साधनवाचक (‘छाया से’) समझा जा सकता है।
  - marker: b
    text: या, “आकाशों को स्थापित करने।” इब्रानी में शाब्दिक रूप से “आकाशों को रोपने” है—एक असामान्य छवि, जो सृष्टि या नई-सृष्टि जैसी पुनर्स्थापना का संकेत दे सकती है।
    reason: मूल रूपक को मुख्य पाठ में रखा गया है, जबकि अर्थ स्पष्ट करने वाला विकल्प और छवि का महत्व पादटिप्पणी में दिया गया है।
lexical_decisions:
- source_word: וָאָשִׂים
  choice: मैंने ... रखे हैं
  rationale: שׂים का मूल अर्थ ‘रखना/स्थापित करना’ है। प्रसंग में पूर्ण या आश्वस्त क्रिया व्यक्त करने के लिए वर्तमान पूर्ण रूप स्वाभाविक है और समानांतर כִּסִּיתִיךָ के साथ मेल खाता है।
- source_word: דְּבָרַי
  choice: अपने वचन
  rationale: इब्रानी में बहुवचन ‘मेरे वचन’ है। हिन्दी में ‘अपने वचन’ कर्ता ‘मैं’ से स्वाभाविक संबंध रखता है और बहुवचन की व्यापकता बनाए रखता है।
- source_word: בְּפִיךָ
  choice: तेरे मुँह में
  rationale: यह मूल रूपक और भविष्यद्वक्ताई दायित्व सौंपे जाने की भाषा को सीधे सुरक्षित रखता है; ‘तेरे होंठों पर’ अधिक व्याख्यात्मक होता।
- source_word: וּבְצֵל יָדִי
  choice: अपने हाथ की छाया में
  rationale: בְּ को स्थानवाचक समझते हुए सुरक्षा का रूपक स्वाभाविक हिन्दी में रखा गया है। साधनवाचक ‘अपने हाथ की छाया से’ भी संभव है और पादटिप्पणी में दिया गया है।
- source_word: כִּסִּיתִיךָ
  choice: तुझे ढाँप लिया है
  rationale: כסה का मूल अर्थ ‘ढाँपना’ है। यह शब्द सुरक्षा का भाव आने देता है, पर उसे ‘शरण दी’ कहकर अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: לִנְטֹעַ שָׁמַיִם
  choice: आकाशों को रोपने
  rationale: נטע सामान्यतः ‘रोपना’ है। आकाशों के साथ इसकी असामान्य और प्रभावशाली सृष्टि-छवि को ‘स्थापित करना’ या ‘तानना’ कहकर सामान्य नहीं बनाया गया।
- source_word: וְלִיסֹד אָרֶץ
  choice: पृथ्वी की नींव डालने
  rationale: יסד का अर्थ ‘नींव डालना/स्थापित करना’ है। यह हिन्दी अभिव्यक्ति मूल की आधार-स्थापन छवि को स्पष्ट और स्वाभाविक रूप से रखती है।
- source_word: וְלֵאמֹר לְצִיּוֹן
  choice: सिय्योन से यह कहने
  rationale: אמר के सामान्य अर्थ ‘कहना’ को रखा गया है; ‘घोषणा करना’ मूल की अपेक्षा अधिक ऊँचा और व्याख्यात्मक होता।
- source_word: עַמִּי אָתָּה
  choice: तू मेरी प्रजा है
  rationale: इब्रानी में संबोधन पुल्लिंग एकवचन है और सिय्योन को व्यक्तिरूप में संबोधित करता है। ‘तू’ उस एकवचन प्रत्यक्ष संबोधन को बचाता है, जबकि ‘प्रजा’ सामूहिक वाचा-संबंधी संज्ञा को स्वाभाविक हिन्दी में व्यक्त करती है।
theological_decisions:
- issue: द्वितीय पुरुष एकवचन (‘तेरे मुँह’, ‘तुझे’) का संदर्भ
  choice: एकवचन प्रत्यक्ष संबोधन रखा गया और संबोधित व्यक्ति/समुदाय की पहचान स्पष्ट नहीं की गई।
  alternative: इसे सेवक, भविष्यद्वक्ता, या सामूहिक इस्राएल/सिय्योन के रूप में स्पष्ट करना।
  rationale: इस पद में इब्रानी पाठ संबोधित पात्र की पहचान स्पष्ट नहीं करता। अनुवाद उस वास्तविक अस्पष्टता को बनाए रखता है।
- issue: ‘आकाशों को रोपने और पृथ्वी की नींव डालने’ का अभिप्राय
  choice: सृष्टि-संबंधी भाषा और असामान्य ‘रोपने’ की छवि को मुख्य पाठ में यथावत रखा गया।
  alternative: इसे केवल इस्राएल की पुनर्स्थापना/नई सृष्टि का रूपक मानकर सरल बनाना, या केवल शाब्दिक ब्रह्मांडीय सृष्टि के रूप में सीमित करना।
  rationale: यशायाह में सृष्टि और छुटकारे की छवियाँ परस्पर जुड़ती हैं। पाठ स्वयं दोनों के बीच संबंध को पूरी तरह नहीं खोलता, इसलिए अनुवाद किसी एक व्याख्या तक अर्थ को सीमित नहीं करता।
- issue: उद्देश्यवाचक क्रियाओं का निहित कर्ता
  choice: ‘रोपने…नींव डालने…कहने के लिए’ की समानांतर रचना रखी गई, बिना अलग से कर्ता जोड़ने के।
  alternative: ‘ताकि मैं…’ या ‘ताकि तू…’ जोड़कर कर्ता स्पष्ट करना।
  rationale: इब्रानी उद्देश्यवाचक infinitives में कर्ता प्रत्यक्ष रूप से दुहराया नहीं गया है। हिन्दी रचना उद्देश्य-संबंध को व्यक्त करती है, पर अतिरिक्त सर्वनाम जोड़कर संभावित व्याख्या को स्थिर नहीं करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘तेरे/तुझे/तू’ प्राचीन इब्रानी के एकवचन संबोधन को बचाते हैं और यहाँ अपमानसूचक नहीं, बल्कि प्रत्यक्ष वाचा-संबंधी संबोधन हैं। ‘सिय्योन’ मानक बाइबिलीय नाम-रूप है।
