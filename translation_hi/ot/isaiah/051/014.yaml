base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/014.yaml
  text: The one bent low will soon be set free[a]; he will not die in the pit[b], and his bread will not be lacking.
translation:
  language: hi
  text: जो झुका हुआ है, वह शीघ्र ही मुक्त किया जाएगा[a]; वह गड्ढे में नहीं मरेगा[b], और उसे रोटी की कमी न होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बंदी शीघ्र ही छुड़ा दिया जाएगा।” इब्रानी अभिव्यक्ति कठिन है; इससे अत्याचार के नीचे झुके हुए व्यक्ति और फिर उसकी मुक्ति की छवि उभर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह कारागार में नहीं मरेगा।” इब्रानी शब्द का अर्थ वास्तविक गड्ढा या कारागार हो सकता है और लाक्षणिक रूप से विनाश या कब्र भी।
    reason: alternative_reading
lexical_decisions:
- source_word: מִהַר
  choice: शीघ्र ही
  rationale: यह रूप शीघ्रता या निकटता का भाव देता है; ‘शीघ्र ही’ आने वाली मुक्ति के आश्वासन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: צֹעֶה
  choice: जो दबा हुआ है
  rationale: यह कठिन शब्द झुके, दुहरे हुए या अत्याचार के नीचे दबे व्यक्ति की छवि दे सकता है। यह चयन अपमान और उत्पीड़न की छवि बचाता है, पर उसे केवल बंदी के अर्थ तक सीमित नहीं करता।
- source_word: לְהִפָּתֵחַ
  choice: मुक्त किया जाएगा
  rationale: פתח का निफ़अल रूप शाब्दिक रूप से ‘खोला जाना’ है, पर यहाँ बंधन या कैद से छुड़ाए जाने का मुहावरेदार अर्थ उपयुक्त है।
- source_word: וְלֹא יָמוּת
  choice: वह ... नहीं मरेगा
  rationale: नकारात्मक अपूर्ण क्रिया संरक्षण का सीधा आश्वासन देती है; एकवचन को मूल इब्रानी के अनुसार रखा गया है।
- source_word: לַשַּׁחַת
  choice: गड्ढे में
  rationale: שחת गड्ढे, कारागार, कब्र या विनाश का संकेत दे सकता है। ‘गड्ढा’ ठोस बिंब और अर्थ की व्यापकता दोनों बनाए रखता है।
- source_word: וְלֹא יֶחְסַר לַחְמוֹ
  choice: उसे रोटी की घटी न होगी
  rationale: यह इब्रानी की ठोस ‘रोटी’ की छवि को बनाए रखते हुए आधुनिक, गरिमापूर्ण और सहज हिन्दी में अभाव न होने का आश्वासन देता है।
theological_decisions:
- issue: उत्पीड़ित व्यक्ति की पहचान
  choice: एकवचन में ऐसा दबा हुआ व्यक्ति, जो प्रसंग में निर्वासित परमेश्वर-जन का प्रतिनिधि हो सकता है
  alternative: कोई विशिष्ट बंदी अथवा सामान्य रूप से कोई पीड़ित व्यक्ति
  rationale: इब्रानी के एकवचन रूपों को कायम रखा गया है, जबकि पहचान को इतना खुला छोड़ा गया है कि पद की प्रतिनिधिक और व्यक्तिगत दोनों संभावनाएँ बनी रहें।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सरल, गरिमापूर्ण और मूल के ठोस बिंबों के निकट है। ‘दबा हुआ’ कठिन इब्रानी पद की अस्पष्टता को कुछ सीमा तक सुरक्षित रखता है, और पादटिप्पणियाँ मुख्य वैकल्पिक अर्थ बताती हैं।
