id: ISA.51.11
reference: Isaiah 51:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/פְדוּיֵ֨י יְהוָ֜ה יְשׁוּב֗וּ/ן וּ/בָ֤אוּ צִיּוֹן֙ בְּ/רִנָּ֔ה וְ/שִׂמְחַ֥ת עוֹלָ֖ם עַל רֹאשָׁ֑/ם שָׂשׂ֤וֹן וְ/שִׂמְחָה֙ יַשִּׂיג֔וּ/ן נָ֖סוּ יָג֥וֹן וַ/אֲנָחָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/011.yaml
  text: And the redeemed of Yahweh will return and come to Zion with singing[a]; everlasting joy will be upon their heads; gladness and joy will overtake them[b]; sorrow and sighing will flee away.
translation:
  language: hi
  text: और याहवे के छुड़ाए हुए लोग लौटेंगे और जयजयकार करते हुए[a] सिय्योन में आएँगे। उनके सिरों पर सदा का आनंद होगा; हर्ष और आनंद उन्हें आ पकड़ेंगे[b]; शोक और आहें दूर भाग जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आनंद के गीत गाते हुए”; इब्रानी शब्द उल्लासपूर्ण पुकार और आनंद के गान—दोनों को व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “हर्ष और आनंद उन तक पहुँचेंगे”; इब्रानी क्रिया का मूल भाव पीछे से पहुँचकर पकड़ लेने का है, इसलिए यहाँ हर्ष और आनंद का उनका पीछा करके उन्हें आ पकड़ना चित्रित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פְדוּיֵי
  choice: छुड़ाए हुए लोग
  rationale: पदा धातु का निष्क्रिय कृदन्त उन लोगों को दर्शाता है जिन्हें छुड़ाया या मूल्य देकर मुक्त किया गया है। यह हिन्दी में स्वाभाविक रहते हुए उद्धार का भाव बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम चतुरक्षर का हिन्दी में प्रचलित लिप्यंतरण रखा गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: יְשׁוּבוּן
  choice: लौटेंगे
  rationale: שוב का सामान्य अर्थ लौटना है और यहाँ भावी पुनर्स्थापना के प्रसंग में यही अर्थ उपयुक्त है।
- source_word: וּבָאוּ
  choice: और ... आएँगे
  rationale: בוא का सीधा अर्थ आना है; हिन्दी वाक्य में भविष्यकाल स्पष्ट करने के लिए क्रियारूप पूर्ण रूप में दिया गया है।
- source_word: צִיּוֹן
  choice: सिय्योन
  rationale: स्थाननाम का हिन्दी बाइबलीय परंपरा में परिचित लिप्यंतरण रखा गया है, ताकि उसका काव्यात्मक और धर्मवैचारिक संकेत बना रहे।
- source_word: בְּרִנָּה
  choice: जयजयकार करते हुए
  rationale: רִנָּה आनंद से निकली ऊँची पुकार या गान दोनों को व्यक्त कर सकता है। 'जयजयकार' उस उल्लासपूर्ण ध्वनि को स्वाभाविक हिन्दी में प्रकट करता है; गाने का विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: שִׂמְחַת עוֹלָם
  choice: सदा का आनंद
  rationale: शाब्दिक भाव 'सदैव रहने वाला आनंद' है। यह रूप संक्षिप्त, स्वाभाविक और कालावधि को स्पष्ट रखता है।
- source_word: עַל רֹאשָׁם
  choice: उनके सिरों पर
  rationale: मूल काव्यात्मक बिंब को सीधे बनाए रखा गया है, जिसमें आनंद उनके सिर पर मुकुट की तरह स्थित है।
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: हर्ष और आनंद
  rationale: निकटार्थी संज्ञाओं के काव्यात्मक युग्म को दो अलग किंतु सहज हिन्दी शब्दों से व्यक्त किया गया है।
- source_word: יַשִּׂיגוּן
  choice: उन्हें आ पकड़ेंगे
  rationale: נשׂג का हिफ़ील रूप पीछे से पहुँचकर पकड़ लेने या जा मिलने का भाव देता है। यह चयन हर्ष और आनंद के मानवीकरण को सुरक्षित रखता है।
- source_word: נָסוּ
  choice: दूर भाग जाएँगे
  rationale: यद्यपि रूप क़ातल है, भावी पुनर्स्थापना के काव्यात्मक प्रसंग और समानांतर क्रियाओं के कारण इसे भावी परिणाम के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ की उपाधि नहीं, व्यक्तिगत नाम को हिन्दी में लिप्यंतरित किया गया है। 'यहोवा' साधारण हिन्दी बाइबल पाठकों में अधिक पहचाना जाने वाला रूप है; यह नाम को 'प्रभु' से प्रतिस्थापित नहीं करता।
- issue: नָסוּ का कालगत बल
  choice: भावी परिणाम—‘दूर भाग जाएँगे’
  alternative: पूर्ण भूत—‘भाग गए हैं’
  rationale: यह पंक्ति भावी वापसी और पुनर्स्थापना के वर्णन में आती है। इसलिए क़ातल रूप को उस भविष्य की निश्चित परिणति के रूप में प्रस्तुत करना हिन्दी में प्रसंग और काव्य-समानांतरता दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक और सामान्य पाठकों के लिए सुबोध रूप। हिब्रू की समानांतर रचना, आनंद के मानवीकरण और सिर पर आनंद के बिंब को बनाए रखा गया है।
