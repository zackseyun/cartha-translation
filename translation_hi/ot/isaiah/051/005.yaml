source:
  edition: WLC
  text: קָר֤וֹב צִדְקִ/י֙ יָצָ֣א יִשְׁעִ֔/י וּ/זְרֹעַ֖/י עַמִּ֣ים יִשְׁפֹּ֑טוּ אֵלַ/י֙ אִיִּ֣ים יְקַוּ֔וּ וְ/אֶל זְרֹעִ֖/י יְיַחֵלֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/005.yaml
  text: My righteousness is near[a], my salvation has gone out, and my arms will judge the peoples; the coastlands will wait for me[c][b], and for my arm they will hope.
translation:
  language: hi
  text: मेरी धार्मिकता निकट है[a], मेरा उद्धार निकल चुका है, और मेरी भुजाएँ देश-देश के लोगों का न्याय करेंगी[b]; तटवर्ती प्रदेश मेरी बाट जोहेंगे[c], और वे मेरी भुजा पर आशा रखेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरा न्याय निकट है।” हिब्रू शब्द का अर्थ प्रसंग के अनुसार “धार्मिकता,” “न्याय” या “न्याय-सिद्धि” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ हिब्रू में “मेरी भुजाएँ” बहुवचन है, पर पद के अंत में “मेरी भुजा” एकवचन है। यह चित्र परमेश्वर की सक्रिय सामर्थ्य को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: या, “द्वीप” अथवा “दूरवर्ती तट।”
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב צִדְקִי
  choice: मेरी धार्मिकता निकट है
  rationale: यह पदबंध विधेयात्मक निकटता को व्यक्त करता है। ‘धार्मिकता’ צדק के व्यापक नैतिक, वाचागत और उद्धारकारी अर्थ को बनाए रखती है; न्याय का अर्थ पादटिप्पणी में दिया गया है।
- source_word: יָצָא יִשְׁעִי
  choice: मेरा उद्धार निकल चुका है
  rationale: कतल क्रिया पूर्ण हुई और वर्तमान में प्रभावी कार्रवाई सूचित करती है। ‘निकल चुका है’ मूल की गतिशील छवि को बनाए रखता है।
- source_word: וּזְרֹעַי
  choice: और मेरी भुजाएँ
  rationale: हिब्रू रूप बहुवचन है; इसलिए बाद के एकवचन ‘मेरी भुजा’ से इसका अंतर जानबूझकर सुरक्षित रखा गया है।
- source_word: עַמִּים יִשְׁפֹּטוּ
  choice: देश-देश के लोगों का न्याय करेंगी
  rationale: עַמִּים अनेक जनसमूहों को सूचित करता है। स्वाभाविक हिन्दी में ‘देश-देश के लोग’ इस बहुवचन सामूहिक अर्थ को स्पष्ट करता है, और שׁפט का मूल न्यायिक अर्थ बनाए रखता है।
- source_word: אֵלַי אִיִּים יְקַוּוּ
  choice: समुद्र-पार के देश मेरी बाट जोहेंगे
  rationale: אִיִּים यशायाह में द्वीपों तक सीमित न होकर दूरवर्ती समुद्री या तटीय देशों को भी सूचित कर सकता है। ‘बाट जोहेंगे’ प्रत्याशापूर्ण प्रतीक्षा व्यक्त करता है और अगले ‘आशा रखेंगे’ से काव्यात्मक भेद बनाए रखता है।
- source_word: וְאֶל זְרֹעִי יְיַחֵלוּן
  choice: और वे मेरी भुजा पर आशा रखेंगे
  rationale: एकवचन ‘भुजा’ की सजीव उपमा सुरक्षित है। יחל आशापूर्ण प्रतीक्षा बताता है; ‘आशा रखेंगे’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: उद्धार-संदेश के प्रसंग में צדק का अनुवाद
  choice: मेरी धार्मिकता
  alternative: मेरा न्याय; मेरा न्यायोचित ठहराया जाना
  rationale: यहाँ परमेश्वर की धार्मिकता उसके उद्धार और लोगों के न्याय से जुड़ी है। ‘धार्मिकता’ व्यापक अर्थ को बनाए रखती है, जबकि न्यायिक अर्थ को पादटिप्पणी में सुरक्षित किया गया है।
- issue: परमेश्वर की भुजा/भुजाओं की मानवरूपी उपमा
  choice: शाब्दिक ‘भुजा/भुजाएँ’ को बनाए रखना
  alternative: सामर्थ्य; शक्ति
  rationale: मूल पाठ शरीर-संबंधी उपमा द्वारा परमेश्वर की सक्रिय सामर्थ्य दिखाता है। इसे अमूर्त ‘शक्ति’ में बदलने के बजाय भविष्यद्वाणी की छवि और बहुवचन/एकवचन का तनाव सुरक्षित रखा गया है।
- issue: אִיִּים का भौगोलिक विस्तार
  choice: समुद्र-पार के देश
  alternative: द्वीप; तटवर्ती प्रदेश
  rationale: यशायाह में यह शब्द दूरवर्ती समुद्री क्षेत्रों और वहाँ के लोगों का व्यापक संकेत हो सकता है। चयन सामान्य हिन्दी पाठक के लिए उस व्यापकता को व्यक्त करता है, और अधिक शाब्दिक विकल्प पादटिप्पणी में हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘बाट जोहेंगे’ काव्यात्मक है, पर आज भी स्पष्ट और स्वाभाविक है। मूल की धार्मिकता/न्याय संबंधी अर्थ-बहुलता तथा भुजाओं/भुजा का संख्या-भेद सुरक्षित रखा गया है।
