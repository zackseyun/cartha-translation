id: ISA.51.3
reference: Isaiah 51:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי נִחַ֨ם יְהוָ֜ה צִיּ֗וֹן נִחַם֙ כָּל חָרְבֹתֶ֔י/הָ וַ/יָּ֤שֶׂם מִדְבָּרָ/הּ֙ כְּ/עֵ֔דֶן וְ/עַרְבָתָ֖/הּ כְּ/גַן יְהוָ֑ה שָׂשׂ֤וֹן וְ/שִׂמְחָה֙ יִמָּ֣צֵא בָ֔/הּ תּוֹדָ֖ה וְ/ק֥וֹל זִמְרָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/003.yaml
  text: For Yahweh comforts Zion[a]; he comforts all her ruins. He makes her wilderness like Eden, and her desert like the garden of Yahweh. Joy and gladness will be found in her[d][c][b], thanksgiving and the sound of song.
translation:
  language: hi
  text: क्योंकि याहवे सिय्योन को सांत्वना देता है; वह उसके सभी उजड़े स्थानों को सांत्वना देता है। वह उसके निर्जन प्रदेश को अदन के समान और उसके मरुस्थल को याहवे की वाटिका के समान बना देता है। उसमें हर्ष और आनंद, धन्यवाद तथा स्तुतिगान का स्वर पाया जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का आधार बताता है; इसलिए कारणसूचक अर्थ स्वाभाविक रूप से रखा गया है।
- source_word: נִחַם
  choice: सांत्वना देता है
  rationale: यहाँ क्रिया सिय्योन की पुनर्स्थापना से जुड़ी आश्वस्तिदायक सांत्वना व्यक्त करती है। वर्तमान काल भविष्य की निश्चित प्रतिज्ञा को सजीव रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: צִיּוֹן
  choice: सिय्योन
  rationale: स्थान और मानवीकृत नगर के नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: כָּל חָרְבֹתֶיהָ
  choice: उसके सभी उजड़े स्थानों
  rationale: बहुवचन अभिव्यक्ति केवल टूटे हुए भवनों से अधिक व्यापक उजाड़ स्थानों को सूचित कर सकती है; यह चयन उस अर्थ-व्याप्ति को बनाए रखता है।
- source_word: וַיָּשֶׂם
  choice: बना देता है
  rationale: भविष्य की सुनिश्चित पुनर्स्थापना को सजीव भविष्यसूचक वर्तमान के रूप में व्यक्त किया गया है।
- source_word: מִדְבָּרָהּ
  choice: उसके निर्जन प्रदेश
  rationale: מִדְבָּר के जंगल/बियाबान अर्थ को अगले समानांतर शब्द עֲרָבָה से अलग रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: כְּעֵדֶן
  choice: अदन के समान
  rationale: उत्पत्ति की वाटिका से जुड़ा व्यक्तिवाचक नाम और उसका अंतर्पाठीय संकेत सुरक्षित रखा गया है।
- source_word: וְעַרְבָתָהּ
  choice: उसके मरुस्थल
  rationale: עֲרָבָה यहाँ शुष्क मैदान या मरुस्थल को सूचित करता है; 'मरुस्थल' सरल और संदर्भानुकूल है।
- source_word: כְּגַן יְהוָה
  choice: याहवे की वाटिका के समान
  rationale: संबंधसूचक रचना और अदन-वाटिका के संकेत, दोनों को स्पष्ट और गरिमापूर्ण हिन्दी में रखा गया है।
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: हर्ष और आनन्द
  rationale: उत्सवपूर्ण प्रसन्नता व्यक्त करने वाले समानार्थी युग्म को स्वाभाविक हिन्दी युग्म से प्रस्तुत किया गया है।
- source_word: יִמָּצֵא בָהּ
  choice: उसमें ... सुनाई देगी
  rationale: शाब्दिक 'पाया जाएगा' हिन्दी में कृत्रिम लगता है; अन्तिम पद में ध्वनि के साथ यह रूप उपस्थित होने का भाव स्वाभाविक ढंग से देता है।
- source_word: תּוֹדָה וְקוֹל זִמְרָה
  choice: धन्यवाद और स्तुतिगान की ध्वनि
  rationale: תּוֹדָה को कृतज्ञ धन्यवाद और זִמְרָה को गाए जाने वाले स्तुतिगान के रूप में व्यक्त किया गया है; 'ध्वनि' मूल के קוֹל को स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; उसे उपाधि से प्रतिस्थापित किए बिना हिन्दी लिपि में प्रस्तुत किया गया है।
- issue: पुनर्स्थापना संबंधी भविष्यसूचक क्रियाओं का काल
  choice: 'वर्तमान और भविष्य का मिश्रण: ''सांत्वना देता है'', ''बना देता है'', ''सुनाई देगी'''
  alternative: सभी क्रियाएँ भूतकाल में अथवा सभी भविष्यकाल में
  rationale: इब्रानी क्रियारूप निश्चित भविष्य को सजीव, पूर्णवत घटना की तरह प्रस्तुत कर सकते हैं। मिश्रित हिन्दी इस भविष्यसूचक निश्चितता और भावी परिणति को बिना अनावश्यक काल-निर्धारण के बनाए रखती है।
- issue: सिय्योन का स्त्रीलिंग मानवीकरण
  choice: '''उसके'' और ''उसमें'' द्वारा नगर को मानवीकृत इकाई के रूप में बनाए रखना'
  alternative: सिय्योन के उजड़े स्थानों / वहाँ
  rationale: इब्रानी स्त्रीलिंग प्रत्यय सिय्योन को मानवीकृत नगर के रूप में संदर्भित करते हैं; हिन्दी में अस्पष्ट लिंग-बल दिए बिना संबंध बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। 'वाटिका' ने अदन-संबंधी उद्यान-चित्र को ऊँचे काव्यात्मक रजिस्टर में रखा है; 'निर्जन प्रदेश' और 'मरुस्थल' समानांतर इब्रानी भू-दृश्य शब्दों का भेद बनाए रखते हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई, इसलिए मुख्य पाठ में कोई अनाथ संकेत नहीं है।
