id: ISA.51.9
reference: Isaiah 51:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עוּרִ֨י עוּרִ֤י לִבְשִׁי עֹז֙ זְר֣וֹעַ יְהוָ֔ה ע֚וּרִי כִּ֣/ימֵי קֶ֔דֶם דֹּר֖וֹת עוֹלָמִ֑ים הֲ/ל֥וֹא אַתְּ הִ֛יא הַ/מַּחְצֶ֥בֶת רַ֖הַב מְחוֹלֶ֥לֶת תַּנִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/009.yaml
  text: Awake[a], awake, put on strength, arm of Yahweh; awake, as in days of old, generations of long ago[b]. Was it not you who cut Rahab in pieces, who pierced the dragon?
translation:
  language: hi
  text: जाग उठ, जाग उठ, सामर्थ्य धारण कर, हे याहवे की भुजा! जाग उठ, जैसे प्राचीन दिनों में, बहुत पुरानी पीढ़ियों के समय में। क्या तू ही वह नहीं थी जिसने राहाब[a] के टुकड़े कर दिए, जिसने महानाग[b] को बेध डाला?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: राहाब एक घमंडी शत्रु-शक्ति का काव्यात्मक नाम है; यहाँ इसे प्रायः मिस्र का संकेत माना जाता है।
    reason: cross_reference
  - marker: b
    text: या, “समुद्री दैत्य।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרִי
  choice: जाग उठ
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप मानवीकृत ‘भुजा’ को संबोधित करता है। ‘जाग उठ’ पुनरावृत्ति, आह्वान और काव्यात्मक गरिमा को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לִבְשִׁי עֹז
  choice: सामर्थ्य धारण कर
  rationale: मूल का शाब्दिक रूप ‘सामर्थ्य पहन ले’ है। ‘धारण कर’ वस्त्र पहनने की रूपक-छवि को रखते हुए हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: זְרוֹעַ יְהוָה
  choice: हे याहवे की भुजा
  rationale: यह याहवे की सक्रिय सामर्थ्य का मानवीकृत रूपक और प्रत्यक्ष संबोधन है। ‘भुजा’ के स्त्रीलिंग होने से मूल के स्त्रीलिंग क्रियारूपों का सामंजस्य भी बना रहता है।
- source_word: כִּימֵי קֶדֶם
  choice: जैसे प्राचीन दिनों में
  rationale: दूर अतीत के समय की ओर संकेत करने वाले काव्यात्मक वाक्यांश को सरल, वर्तमान हिन्दी में व्यक्त करता है।
- source_word: דֹּרוֹת עוֹלָמִים
  choice: बीते युगों की पीढ़ियों में
  rationale: यहाँ भाव अनंतता की दार्शनिक धारणा से अधिक सुदूर अतीत का है। यह चयन प्राचीनता की तीव्रता और ‘पीढ़ियों’ की छवि दोनों रखता है।
- source_word: הֲלוֹא אַתְּ הִיא
  choice: क्या तू ही वह नहीं थी
  rationale: स्त्रीलिंग मानवीकृत भुजा से पूछे गए आलंकारिक प्रश्न तथा अतीत के उद्धारकारी कार्यों की ओर संकेत को स्पष्ट रखता है।
- source_word: הַמַּחְצֶבֶת
  choice: जिसने ... के टुकड़े कर दिए
  rationale: क्रिया काटने या चीरने से हिंसक पराजय का बोध कराती है; यह रूप समानांतर काव्य-पंक्ति में अर्थ को स्वाभाविक और सजीव बनाता है।
- source_word: רַהַב
  choice: राहाब
  rationale: काव्यात्मक नाम को लिप्यंतरित रखने से घमंडी शत्रु-शक्ति, सम्भवतः मिस्र, और अराजकता-विरोधी बिंब की परतें बनी रहती हैं।
- source_word: מְחוֹלֶלֶת
  choice: जिसने ... को बेध डाला
  rationale: यह प्रबल प्रहार या आर-पार घायल करने का भाव देता है और राहाब को टुकड़े करने वाली समानांतर छवि के अनुकूल है।
- source_word: תַּנִּין
  choice: महानाग
  rationale: इस काव्यात्मक प्रसंग में साधारण सरीसृप नहीं, एक विकराल अराजकता-प्राणी अभिप्रेत है। ‘महानाग’ हिन्दी में काव्यात्मक और सजीव है; सम्भव ‘समुद्री दैत्य’ अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में वाचा का विशिष्ट नाम सीधे उपस्थित है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: राहाब और תַּנִּין के बिंबों की व्याख्या
  choice: मुख्य पाठ में ‘राहाब’ और ‘महानाग’ के काव्यात्मक बिंब बनाए रखना
  alternative: राहाब को सीधे ‘मिस्र’ और महानाग को ‘समुद्री दैत्य’ कहना
  rationale: पद सम्भवतः मिस्र पर विजय की स्मृति के साथ अराजकता-प्राणी पर विजय की व्यापक काव्यात्मक भाषा भी जगाता है। मुख्य पाठ में बिंब बनाए रखने से इस अर्थ-बहुलता और धर्मवैचारिक तनाव का समयपूर्व समाधान नहीं होता।
- issue: मानवीकृत ‘याहवे की भुजा’ का लिंग और संबोधन
  choice: स्त्रीलिंग ‘तू ... थी’
  alternative: आदरार्थक ‘आप ... थीं’ अथवा लिंग-निरपेक्ष पुनर्गठन
  rationale: हिब्रू में संबोधन और क्रियारूप स्त्रीलिंग एकवचन हैं, जो मानवीकृत ‘भुजा’ से मेल खाते हैं। हिन्दी ‘भुजा’ भी स्त्रीलिंग है; इसलिए यह रूप मूल की व्याकरणिक और काव्यात्मक संरचना बचाता है।
translation_notes:
  register: भाषा आधुनिक, सुबोध और गरिमापूर्ण काव्यात्मक हिन्दी है। आरम्भ की पुनरावृत्ति तथा वस्त्र की तरह सामर्थ्य धारण करने का रूपक सुरक्षित रखा गया है। प्रत्यक्ष संबोधन में ‘तू’ का प्रयोग अनौपचारिकता के लिए नहीं, बल्कि एकवचन काव्यात्मक मानवीकरण और मूल के व्याकरण को बनाए रखने के लिए किया गया है।
