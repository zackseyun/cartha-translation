    issue: 'Unidiomatic possessive construction: ‘उनकी अपमान की बातों’'
    rationale: In modern standard Hindi, ‘अपमान’ does not naturally modify ‘बातों’ through this possessive construction. ‘उनकी अपमानजनक बातों’ is grammatically and idiomatically sound, while accurately conveying abusive or insulting speech.
  - severity: low
    issue: The sequence ‘तुम जो ... हो, हे लोगो, जिनके ... है’ is syntactically cumbersome.
    rationale: The Hebrew addresses one group through two appositional descriptions. Coordinating the two relative clauses after ‘हे लोगो’ yields natural Hindi without altering that relationship.
