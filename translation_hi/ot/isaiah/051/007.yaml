  verdict: revise
  source_fidelity: 'The draft conveys all principal clauses faithfully: the plural summons, those who know righteousness, the internalized divine Torah, and the paired prohibitions concerning human reproach and insults. ‘मनुष्य’ suitably retains the generic singular force of אֱנוֹשׁ, without over-specifying its possible nuance of mortality.'
  naturalness: The phrase ‘उनकी अपमान की बातों’ is not idiomatic modern Hindi. ‘उनकी अपमानजनक बातों’ naturally expresses the hostile speech denoted by מִגִּדֻּפוֹתָם. Reshaping the double vocative into one coordinated description also makes the address more fluent while retaining the Hebrew apposition.
  terminology: ‘धार्मिकता’ is an acceptable rendering of צֶדֶק in this covenantal-moral setting; ‘न्याय’ remains a legitimate alternative but need not displace it. ‘व्यवस्था’ appropriately renders תּוֹרָה here. ‘निन्दा’ and ‘अपमानजनक बातें’ preserve the distinction between חֶרְפָּה and גִּדּוּפוֹת without importing a theological sense of blasphemy.
