  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שִׁמְע֤וּ אֵלַ/י֙ יֹ֣דְעֵי צֶ֔דֶק עַ֖ם תּוֹרָתִ֣/י בְ/לִבָּ֑/ם אַל תִּֽירְאוּ֙ חֶרְפַּ֣ת אֱנ֔וֹשׁ וּ/מִ/גִּדֻּפֹתָ֖/ם אַל תֵּחָֽתּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/007.yaml
  text: 'Listen to me[a], you who know righteousness, people with my law in their hearts: do not fear the reproach of man[d][c][b], and do not be dismayed by their insults.'
translation:
  language: hi
  text: '“मेरी सुनो, हे लोगो, जो धार्मिकता को जानते हो और जिनके हृदय में मेरी व्यवस्था है: मनुष्य की निन्दा से मत डरो, और उनकी अपमानजनक बातों से मत घबराओ।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: मेरी सुनो
  rationale: बहुवचन आज्ञार्थक और אֵלַי मिलकर ध्यानपूर्वक सुनने की सीधी पुकार देते हैं; ‘मेरी सुनो’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יֹדְעֵי צֶדֶק
  choice: तुम जो धार्मिकता को जानते हो
  rationale: צֶדֶק धार्मिकता और न्याय दोनों का अर्थ दे सकता है; यहाँ परमेश्वर की व्यवस्था को हृदय में रखने के समानांतर नैतिक-वाचागत भाव के कारण ‘धार्मिकता’ उपयुक्त है।
- source_word: עַם תּוֹרָתִי בְלִבָּם
  choice: हे लोगो, जिनके हृदय में मेरी व्यवस्था है
  rationale: עַם सामूहिक रूप से संबोधित प्रजा/लोगों को दर्शाता है। תּוֹרָה के वाचागत और मानक भाव को ‘व्यवस्था’ व्यक्त करती है, और एकवचन לֵב का सामूहिक हिन्दी रूप ‘जिनके हृदय में’ स्रोत के निकट है।
- source_word: אַל תִּירְאוּ חֶרְפַּת אֱנוֹשׁ
  choice: मनुष्य की निन्दा से मत डरो
  rationale: חֶרְפָּה तिरस्कारपूर्ण निन्दा या अपमान है। אֱנוֹשׁ एकवचन सामान्य मानव को, प्रायः उसकी नश्वर दुर्बलता के संकेत के साथ, व्यक्त करता है; ‘मनुष्य’ इस रूप को बनाए रखता है।
- source_word: וּמִגִּדֻּפֹתָם אַל תֵּחָתּוּ
  choice: उनकी अपमान की बातों से मत घबराओ
  rationale: גִּדּוּפוֹת अपमानजनक या तिरस्कारपूर्ण वचनों को दर्शाता है। Niphal חתת यहाँ ऐसे वचनों के कारण भयभीत या हतोत्साहित होने का भाव देता है; ‘मत घबराओ’ स्पष्ट, स्वाभाविक हिन्दी है।
theological_decisions:
- issue: צֶדֶק का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: दोनों अर्थ संभव हैं, परन्तु इस संबोधन में परमेश्वर की तोराह के हृदय में होने के साथ नैतिक-वाचागत धार्मिकता प्रमुख है; ‘न्याय’ को वैकल्पिक अर्थ के रूप में स्वीकार किया जाता है।
- issue: תּוֹרָה का अनुवाद
  choice: व्यवस्था
  alternative: शिक्षा
  rationale: यह शब्द शिक्षा भी दर्शा सकता है, किन्तु यहाँ परमेश्वर के मानक और वाचागत निर्देश का भाव ‘व्यवस्था’ से अच्छी तरह आता है; किसी विशिष्ट सम्प्रदायगत व्यवस्था-विभाजन को इसमें नहीं जोड़ा गया।
- issue: אֱנוֹשׁ का सामान्य एकवचन
  choice: मनुष्य
  alternative: नश्वर मनुष्य / इंसान
  rationale: स्रोत का एकवचन सामान्य मानव और उसकी सीमितता को उभारता है। ‘मनुष्य’ हिन्दी में गरिमापूर्ण और स्रोत-संगत है, जबकि नश्वरता का निहित भाव वैकल्पिक टिप्पणी में स्पष्ट किया जा सकता है।
- issue: אַל תֵּחָתּוּ की तीव्रता
  choice: मत घबराओ
  alternative: मत टूटो / हतोत्साहित मत होओ
  rationale: חתת में टूट जाने, भयभीत होने या हतोत्साहित होने की अर्थ-सीमा है। समानांतर ‘मत डरो’ और आधुनिक हिन्दी की स्वाभाविकता के कारण ‘मत घबराओ’ चुना गया, बिना भीतर से टूटने की तीव्र छाया को नकारे।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधा, काव्यात्मक और गरिमापूर्ण संबोधन। ‘मेरी सुनो’ तथा ‘मत डरो/मत घबराओ’ बोलचाल में समझ आने योग्य हैं, जबकि ‘धार्मिकता’ और ‘व्यवस्था’ यशायाह के नैतिक-वाचागत संदर्भ को बनाए रखते हैं।
