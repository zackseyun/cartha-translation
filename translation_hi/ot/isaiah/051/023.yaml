source:
  edition: WLC
  text: וְ/שַׂמְתִּ֨י/הָ֙ בְּ/יַד מוֹגַ֔יִ/ךְ אֲשֶׁר אָמְר֥וּ לְ/נַפְשֵׁ֖/ךְ שְׁחִ֣י וְ/נַעֲבֹ֑רָה וַ/תָּשִׂ֤ימִי כָ/אָ֨רֶץ֙ גֵּוֵ֔/ךְ וְ/כַ/ח֖וּץ לַ/עֹבְרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/023.yaml
  text: And I will put it into the hand of those who afflict you, who said to you, ‘Bow down, so that we may pass over’; and you made your back like the ground, and like the street for those passing by.
translation:
  language: hi
  text: और मैं उस प्याले को तुझे सतानेवालों के हाथ में दे दूँगा, जिन्होंने तुझसे कहा था, “झुक जा, ताकि हम तेरे ऊपर से गुजर जाएँ।” और तूने अपनी पीठ को भूमि के समान, और राहगीरों के लिए सड़क के समान कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשַׂמְתִּיהָ
  choice: और मैं वह प्याला ... दे दूँगा
  rationale: स्त्रीलिंग प्रत्यय הָ का संदर्भ पिछले पद का ‘कटोरा/प्याला’ है; हिन्दी में संदर्भ स्पष्ट रखने के लिए ‘वह प्याला’ व्यक्त किया गया। ‘हाथ में देना’ अगले पदबंध के साथ स्वाभाविक हिन्दी है।
- source_word: מוֹגַיִךְ
  choice: तुम्हें सतानेवालों
  rationale: यह रूप दमन और पीड़ा पहुँचानेवालों को सूचित करता है; ‘सतानेवाले’ अर्थ को सामान्य आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: לְנַפְשֵׁךְ
  choice: तुमसे
  rationale: यहाँ נֶפֶשׁ पूरे व्यक्ति के लिए प्रयुक्त है; शब्दशः ‘तेरे प्राण से’ हिन्दी में अप्राकृतिक होता।
- source_word: שְׁחִי
  choice: झुक जा
  rationale: आज्ञार्थक स्त्रीलिंग एकवचन है और सिय्योन/यरूशलेम से संबोधन जारी रखता है।
- source_word: וְנַעֲבֹרָה
  choice: ताकि हम तेरे ऊपर से निकल जाएँ
  rationale: इच्छासूचक/उद्देश्यपरक भाव को ‘ताकि’ से व्यक्त किया; अगले चित्र से स्पष्ट ‘तेरे ऊपर से’ हिन्दी में जोड़ा गया।
- source_word: גֵּוֵךְ
  choice: अपनी पीठ
  rationale: גֵּו शरीर की पीठ को दर्शाता है; अपमान और रौंदे जाने का चित्र बनाए रखता है।
- source_word: כַחוּץ לַעֹבְרִים
  choice: आने-जानेवालों के लिए सड़क के समान
  rationale: חוּץ का मूल अर्थ बाहर/खुला स्थान है, पर इस समानांतर चित्र में सार्वजनिक मार्ग या सड़क अभिप्रेत है; עֹבְרִים को हिन्दी मुहावरे में ‘आने-जानेवाले’ कहा गया।
theological_decisions:
- issue: स्त्रीलिंग प्रत्यय का पूर्वसंदर्भ
  choice: ‘वह प्याला’ को स्पष्ट किया
  alternative: केवल ‘उसे’
  rationale: पिछले पदों में यहोवा के क्रोध का कटोरा/प्याला स्पष्ट पूर्वसंदर्भ है। इसे व्यक्त करना प्रवचन-संबंध स्पष्ट करता है, कोई नई धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
- issue: ‘पीठ को भूमि/सड़क बनाने’ का रूपक
  choice: रूपक को शारीरिक और अपमानजनक चित्र के रूप में बनाए रखा
  alternative: भावार्थतः ‘तूने अपने को पूरी तरह उनके अधीन कर दिया’
  rationale: मूल पाठ का तीखा काव्यात्मक चित्र धर्मवैज्ञानिक तनाव और पीड़ित सिय्योन की दशा को अधिक निष्ठापूर्वक सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और काव्यात्मक बाइबिलीय शैली। संबोधन में मूल के स्त्रीलिंग एकवचन को ‘तू/तेरे’ से बनाए रखा गया है, क्योंकि व्यक्तित्वयुक्त सिय्योन से सीधा संबोधन है।
