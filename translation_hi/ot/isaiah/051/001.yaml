id: ISA.51.1
reference: Isaiah 51:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שִׁמְע֥וּ אֵלַ֛/י רֹ֥דְפֵי צֶ֖דֶק מְבַקְשֵׁ֣י יְהוָ֑ה הַבִּ֨יטוּ֙ אֶל צ֣וּר חֻצַּבְתֶּ֔ם וְ/אֶל מַקֶּ֥בֶת בּ֖וֹר נֻקַּרְתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/001.yaml
  text: 'Listen to me[a], you who pursue righteousness, you who seek Yahweh: look to the rock from which you were cut[c][b], and to the quarry from which you were dug.'
translation:
  language: hi
  text: “मेरी सुनो, तुम जो धार्मिकता[a] का अनुसरण करते हो, तुम जो यहोवा को खोजते हो! उस चट्टान की ओर देखो जिसमें से तुम काटे[b][c] गए हो, और गड्ढे के उस खोदे हुए स्थान की ओर, जिसमें से तुम खोदकर निकाले गए हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्याय।”
    reason: lexical_alternative
  - marker: b
    text: या “तराशे गए।”
    reason: lexical_alternative
  - marker: c
    text: पद 2 इस रूपक को अब्राहम और सारा से जोड़ता है।
    reason: cross_reference
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: मेरी सुनो
  rationale: बहुवचन आज्ञार्थक आह्वान को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और ध्यानपूर्वक सुनने का भाव बनाए रखता है।
- source_word: רֹדְפֵי צֶדֶק
  choice: तुम जो धार्मिकता का पीछा करते हो
  rationale: कृदन्तीय संबोधन और सक्रिय पीछा करने के रूपक को बनाए रखता है। צֶדֶק के लिए ‘न्याय’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: מְבַקְשֵׁי יְהוָה
  choice: तुम जो यहोवा को खोजते हो
  rationale: परमेश्वर की ओर समर्पित होकर मुड़ने और उसे चाहने के वाचाई भाव को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा सुरक्षित रखता है।
- source_word: הַבִּיטוּ
  choice: की ओर देखो
  rationale: बहुवचन आज्ञार्थक और विचारपूर्ण ध्यान के आह्वान को अगले ठोस रूपकों के साथ स्वाभाविक रूप से प्रस्तुत करता है।
- source_word: צוּר
  choice: चट्टान
  rationale: मूल ठोस रूपक को बिना समय से पहले उसकी व्याख्या किए सुरक्षित रखता है।
- source_word: חֻצַּבְתֶּם
  choice: काटे गए हो
  rationale: חצב के कर्मवाच्य ‘काटकर निकालना/तराशना’ को सरल आधुनिक हिन्दी में व्यक्त करता है; ‘तराशे गए’ वैकल्पिक सूक्ष्मता है।
- source_word: מַקֶּבֶת בּוֹר
  choice: खदान
  rationale: दोनों शब्द मिलकर खोदकर निकाले जाने के स्रोत या खदान-जैसे गड्ढे की छवि देते हैं। हिन्दी में ‘खदान’ ठोस उत्खनन-रूपक को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: נֻקַּרְתֶּם
  choice: खोदकर निकाले गए हो
  rationale: कर्मवाच्य उत्खनन और मूल-स्रोत से निकाले जाने की छवि को स्पष्ट करता है तथा पहले उपवाक्य के समानांतर रहता है।
theological_decisions:
- issue: चट्टान और खदान के रूपक की पहचान
  choice: मुख्य पाठ में रूपक को बिना व्याख्या के बनाए रखना
  alternative: चट्टान और खदान को सीधे अब्राहम और सारा के रूप में पहचानना
  rationale: पद 1 स्वयं रूपक देता है, जबकि पद 2 अब्राहम और सारा का उल्लेख कर उसे खोलता है। इसलिए पहचान को मुख्य पाठ में पहले से जोड़ना उचित नहीं है।
- issue: צֶדֶק का अर्थ-क्षेत्र
  choice: धार्मिकता
  alternative: न्याय
  rationale: यहाँ यहोवा को खोजने के समानांतर नैतिक-वाचाई सहीपन प्रमुख प्रतीत होता है, पर ‘न्याय’ भी वास्तविक शाब्दिक संभावना है और पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, बहुवचन संबोधन और गरिमापूर्ण काव्यात्मक लय। ‘धार्मिकता का पीछा करना’ तथा चट्टान/खदान की ठोस समानांतर छवियाँ जानबूझकर सुरक्षित रखी गई हैं।
