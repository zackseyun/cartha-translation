base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/004.yaml
  text: Pay attention to me[a], my people, and give ear to me, my nation; for instruction will go out from me[c][b], and I will set my justice as a light for the peoples.
translation:
  language: hi
  text: 'हे मेरी प्रजा, मेरी ओर ध्यान दो;


    हे मेरे जन, मेरी ओर कान लगाकर सुनो।


    क्योंकि शिक्षा[a] मेरी ओर से निकलेगी,


    और मैं अपने न्याय[b] को राष्ट्रों के लिए ज्योति के रूप में स्थापित करूँगा।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘शिक्षा’ के स्थान पर ‘व्यवस्था’ या ‘उपदेश’ भी अनुवाद किया जा सकता है (इब्रानी: תּוֹרָה)।'
    reason: lexical_alternative
  - marker: b
    text: '‘न्याय’ के स्थान पर ‘न्याय-निर्णय’ या ‘विधान’ भी संभव है (इब्रानी: מִשְׁפָּטִי)।'
    reason: lexical_alternative
  - marker: c
    text: अंतिम इब्रानी क्रिया का अर्थ ‘मैं अपने न्याय को ठहराऊँगा’ या ‘मैं अपने न्याय को रख दूँगा’ भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבוּ
  choice: ध्यान दो
  rationale: यह आज्ञार्थक क्रिया ध्यानपूर्वक सुनने का आह्वान करती है। ‘ध्यान दो’ आधुनिक और स्वाभाविक हिन्दी में इसका बल बनाए रखता है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: यह परमेश्वर से संबंधित सामूहिक समुदाय को संबोधित करता है। ‘मेरी प्रजा’ वाचागत संबंध और सामूहिक अर्थ दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּלְאוּמִּי
  choice: मेरे जन
  rationale: לְאֹם का अर्थ जन या राष्ट्र हो सकता है। सीधे ‘मेरे राष्ट्र’ कहने की अस्वाभाविकता से बचते हुए ‘मेरे जन’ समानांतर संबोधन को बनाए रखता है।
- source_word: הַאֲזִינוּ
  choice: कान लगाकर सुनो
  rationale: यह पहले आज्ञार्थक पद के समानांतर ध्यानपूर्वक सुनने की क्रिया है। यह रूप दोनों इब्रानी क्रियाओं के बीच हल्का शब्दगत भेद भी बनाए रखता है।
- source_word: תּוֹרָה
  choice: शिक्षा
  rationale: यहाँ תורה केवल विधि-संहिता नहीं, बल्कि परमेश्वर की अधिकारपूर्ण शिक्षा को भी सूचित कर सकती है। ‘शिक्षा’ इस व्यापक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: תֵצֵא
  choice: निकलेगी
  rationale: יצא के बाहर जाने या निकलने के सामान्य अर्थ को निकटता से व्यक्त करता है और परमेश्वर से लोगों की ओर जाने की गति बनाए रखता है।
- source_word: מִשְׁפָּטִי
  choice: अपने न्याय
  rationale: מִשְׁפָּט का अर्थ न्याय, न्याय-निर्णय या विधान हो सकता है। ‘ज्योति’ के समानांतर सकारात्मक संदर्भ में ‘न्याय’ परमेश्वर की धर्मपूर्ण व्यवस्था को व्यक्त करता है, जबकि विकल्प पादटिप्पणी में दिया गया है।
- source_word: לְאוֹר עַמִּים
  choice: राष्ट्रों के लिए ज्योति के रूप में
  rationale: यह उद्देश्य या भूमिका व्यक्त करता है। ‘राष्ट्रों’ से बहुवचन עַמִּים का अंतरराष्ट्रीय विस्तार और ‘ज्योति’ से काव्यात्मक रूपक स्पष्ट रहता है।
- source_word: אַרְגִּיעַ
  choice: स्थापित करूँगा
  rationale: רגע का हिफ़ईल रूप यहाँ कठिन और बहुअर्थी है; वह ठहराने, रख देने या दृढ़ता से स्थापित करने का भाव दे सकता है। मुख्य पाठ में ‘स्थापित करूँगा’ संदर्भानुकूल और स्वाभाविक है, और उसकी वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: राष्ट्रों के संबंध में תורה और מִשְׁפָּט का दायरा
  choice: पद परमेश्वर की शिक्षा और न्याय को राष्ट्रों तक पहुँचने वाले रूप में प्रस्तुत करता है।
  alternative: इसे मुख्यतः इस्राएल के लिए मूसा की व्यवस्था और न्याय-निर्णय तक सीमित समझना।
  rationale: पद में बहुवचन ‘राष्ट्रों’ का स्पष्ट उल्लेख है और शिक्षा के परमेश्वर से निकलने की गति बाहर की ओर है। अनुवाद किसी बाद की धर्मवैज्ञानिक प्रणाली को आरोपित किए बिना इस सार्वभौमिक क्षितिज को बनाए रखता है।
- issue: מִשְׁפָּטִי का अर्थ
  choice: अपने न्याय
  alternative: अपना न्याय-निर्णय अथवा अपना विधान
  rationale: ‘राष्ट्रों के लिए ज्योति’ के संदर्भ में ‘न्याय’ केवल दंडात्मक निर्णय की अपेक्षा परमेश्वर की धर्मपूर्ण व्यवस्था के सकारात्मक प्रकाशन को बेहतर व्यक्त करता है; अन्य संभावित अर्थ पादटिप्पणी में सुरक्षित हैं।
- issue: אַרְגִּיעַ की कठिन क्रिया
  choice: स्थापित करूँगा
  alternative: उसे ठहराऊँगा अथवा रख दूँगा
  rationale: मुख्य पाठ को अर्थपूर्ण हिन्दी देना आवश्यक है, पर इब्रानी क्रिया की अनिश्चितता को निर्णायक रूप से समाप्त नहीं किया गया; पादटिप्पणी उसके अन्य संभव अर्थ बताती है।
