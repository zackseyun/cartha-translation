  text: כִּ֤י כַ/בֶּ֨גֶד֙ יֹאכְלֵ֣/ם עָ֔שׁ וְ/כַ/צֶּ֖מֶר יֹאכְלֵ֣/ם סָ֑ס וְ/צִדְקָתִ/י֙ לְ/עוֹלָ֣ם תִּֽהְיֶ֔ה וִ/ישׁוּעָתִ֖/י לְ/ד֥וֹר דּוֹרִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/008.yaml
  text: For the moth will eat them like a garment[a], and the worm will eat them like wool; but my righteousness will be forever, and my salvation to generation after generation.
translation:
  language: hi
  text: 'क्योंकि जैसे पतंगा वस्त्र को खा जाता है,

    और कीड़ा ऊन को खा जाता है,

    वैसे ही वे उन्हें खा जाएँगे;

    पर मेरी धार्मिकता[a] सदा बनी रहेगी,

    और मेरा उद्धार पीढ़ी-दर-पीढ़ी तक बना रहेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरा न्याय सदा बना रहेगा।” इब्रानी शब्द में धार्मिकता और न्याय—दोनों के भाव हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण प्रस्तुत करता है और पद का तार्किक संबंध बनाए रखता है।
- source_word: כַבֶּגֶד
  choice: वस्त्र के समान
  rationale: בֶּגֶד का अर्थ वस्त्र या पहनावा है; यह चयन काव्यात्मक उपमा को सहज और गरिमापूर्ण हिन्दी में रखता है।
- source_word: יֹאכְלֵם
  choice: उन्हें ... खा जाएगा
  rationale: אכל की सजीव ‘खाने’ वाली छवि को बनाए रखा गया है; प्रसंग में अपूर्ण क्रिया का भावी अर्थ स्वाभाविक है।
- source_word: עָשׁ
  choice: पतंगा
  rationale: यह वस्त्र नष्ट करने वाले पतंगे को दर्शाता है; हिन्दी में ‘पतंगा’ काव्यात्मक छवि को संक्षेप में व्यक्त करता है।
- source_word: וְכַצֶּמֶר
  choice: और ... ऊन के समान
  rationale: צֶמֶר का सीधा अर्थ ऊन है और यह पहले उपमान के समानांतर संरचना बनाए रखता है।
- source_word: סָס
  choice: कीड़ा
  rationale: यह कपड़ा नष्ट करने वाले कीड़े या लार्वे के लिए प्रयुक्त दुर्लभ शब्द है; ‘कीड़ा’ बिना अनावश्यक जैविक विशिष्टता के अर्थ स्पष्ट करता है और עָשׁ से शब्दगत भिन्नता भी रखता है।
- source_word: וְצִדְקָתִי
  choice: पर मेरी धार्मिकता
  rationale: צְדָקָה में नैतिक सच्चाई, न्याय और परमेश्वर की ठीक ठहराने वाली वाचा-संबंधी सक्रियता का व्यापक भाव है। ‘पर’ नाशवान मनुष्यों और परमेश्वर के स्थायी गुण तथा कार्य के बीच का विरोध स्पष्ट करता है।
- source_word: לְעוֹלָם תִּהְיֶה
  choice: सदा बनी रहेगी
  rationale: यह स्थायी निरंतरता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וִישׁוּעָתִי
  choice: और मेरा उद्धार
  rationale: יְשׁוּעָה परमेश्वर के बचाने या छुड़ाने के कार्य को दर्शाता है; ‘उद्धार’ यशायाह के व्यापक धार्मिक और साहित्यिक संदर्भ के अनुकूल है।
- source_word: לְדֹר דּוֹרִים
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह मुहावरा लगातार आने वाली पीढ़ियों तक बने रहने का पुनरावृत्त भाव संक्षेप और सहज रूप में व्यक्त करता है।
theological_decisions:
- issue: भविष्यवाणी के संदर्भ में צִדְקָה का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: ‘धार्मिकता’ शब्द परमेश्वर की नैतिक सत्यता, वाचा के प्रति निष्ठा और उचित बचाने वाले कार्य की व्यापकता को बनाए रखता है। ‘न्याय’ भी सम्भव अर्थ है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। समानांतर पंक्तियों तथा नाशवान विरोधियों और परमेश्वर की स्थायी धार्मिकता व उद्धार के बीच विरोध को सुरक्षित रखा गया है।
