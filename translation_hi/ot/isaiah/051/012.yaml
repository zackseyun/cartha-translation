reference: Isaiah 51:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אָנֹכִ֧י אָנֹכִ֛י ה֖וּא מְנַחֶמְ/כֶ֑ם מִֽי אַ֤תְּ וַ/תִּֽירְאִי֙ מֵ/אֱנ֣וֹשׁ יָמ֔וּת וּ/מִ/בֶּן אָדָ֖ם חָצִ֥יר יִנָּתֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/012.yaml
  text: I[a], I am he who comforts you. Who are you that you fear man, who dies, and the son of man, who is made like grass?
translation:
  language: hi
  text: “मैं, हाँ मैं ही, तुम्हें सांत्वना देनेवाला हूँ। तू कौन है कि उस मनुष्य से डरती है जो मर जाएगा, और मनुष्य का पुत्र[a] से, जिसे घास के समान कर दिया जाएगा?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक मनुष्य।” यहाँ इब्रानी में “मनुष्य का पुत्र” साधारण नश्वर मानव के लिए प्रयुक्त मुहावरा है; यह आवश्यक रूप से कोई मसीहाई उपाधि नहीं है।
    reason: शाब्दिक पदावली के मुहावरेदार, गैर-मसीहाई अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: אָנֹכִי אָנֹכִי הוּא
  choice: मैं, हाँ मैं ही
  rationale: दोहराव के प्रबल आत्म-परिचय को बनाए रखते हुए ‘हाँ’ और ‘ही’ हिन्दी में उसके बल को स्वाभाविक रूप से व्यक्त करते हैं।
- source_word: מְנַחֶמְכֶם
  choice: तुम्हें सांत्वना देनेवाला हूँ
  rationale: कृदन्त परमेश्वर के निरंतर और विशिष्ट कार्य को दर्शाता है। ‘सांत्वना देनेवाला’ वर्तमान हिन्दी में गरिमापूर्ण और स्पष्ट है; ‘तुम्हें’ मूल के बहुवचन कर्म को व्यक्त करता है।
- source_word: מִי אַתְּ וַתִּירְאִי
  choice: तू कौन है कि ... डरती है
  rationale: मूल में संबोधन स्त्रीलिंग एकवचन है। ‘तू’ एकवचन प्रत्यक्ष संबोधन और ‘डरती है’ स्त्रीलिंग को स्पष्ट रखता है; यहाँ यह तिरस्कार नहीं, तीखा आलंकारिक प्रश्न है।
- source_word: אֱנוֹשׁ יָמוּת
  choice: उस मनुष्य से ... जो मर जाएगा
  rationale: אֱנוֹשׁ दुर्बल, नश्वर मनुष्य पर बल देता है, और יָמוּת उसकी निश्चित मृत्यु को अलग से व्यक्त करता है।
- source_word: בֶּן אָדָם
  choice: मनुष्य के पुत्र
  rationale: शाब्दिक पदावली और इब्रानी समानांतरता सुरक्षित रखी गई है। इस प्रसंग में इसका आशय साधारण नश्वर मनुष्य है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: חָצִיר יִנָּתֵן
  choice: जिसे घास के समान कर दिया जाएगा
  rationale: निष्क्रिय क्रिया और मनुष्य की क्षणभंगुरता का रूपक दोनों सुरक्षित रहते हैं। यह ‘घास के रूप में दिया जाएगा’ जैसे अस्पष्ट शाब्दिक अनुवाद से अधिक स्वाभाविक है।
theological_decisions:
- issue: यशायाह के इस गैर-मसीही समानांतर कथन में בֶּן אָדָם का अनुवाद
  choice: मनुष्य के पुत्र
  alternative: एक मनुष्य / नश्वर मनुष्य
  rationale: यहाँ पद אֱנוֹשׁ के समानांतर साधारण नश्वर मानव को सूचित करता है, कोई अनिवार्य मसीही उपाधि नहीं। फिर भी शाब्दिक रूप रखने से मूल की काव्यात्मक बनावट और संभावित पाठकीय तनाव सुरक्षित रहता है; पादटिप्पणी अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण भविष्यद्वक्तीय हिन्दी। परमेश्वर का सामूहिक संबोधन ‘तुम्हें’ और फिर सिय्योन/समुदाय को व्यक्तिरूप में स्त्रीलिंग एकवचन ‘तू ... डरती है’—दोनों मूल के वचन और लिंग-परिवर्तन के अनुसार रखे गए हैं।
