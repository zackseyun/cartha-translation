source:
  edition: WLC
  text: הִתְעוֹרְרִ֣י הִֽתְעוֹרְרִ֗י ק֚וּמִי יְר֣וּשָׁלִַ֔ם אֲשֶׁ֥ר שָׁתִ֛ית מִ/יַּ֥ד יְהוָ֖ה אֶת כּ֣וֹס חֲמָת֑/וֹ אֶת קֻבַּ֜עַת כּ֧וֹס הַ/תַּרְעֵלָ֛ה שָׁתִ֖ית מָצִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/017.yaml
  text: Awake[a], awake, rise up, Jerusalem, you who have drunk from the hand of Yahweh the cup of his wrath; you have drunk the bowl, the cup of staggering[c][b]; you have drained it dry.
translation:
  language: hi
  text: जाग उठ, जाग उठ; खड़ी हो, हे यरूशलेम! तूने याहवे के हाथ से[a] उसके प्रकोप का प्याला पिया है; तूने वह कटोरा, वह लड़खड़ाहट का प्याला[c][b], पी लिया है; तूने उसे पूरी तरह खाली कर दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘याहवे के हाथ से’ एक हिब्रू मुहावरा है; इसका अर्थ है कि यरूशलेम का दुःख याहवे की न्यायिक कार्रवाई से आया।
    reason: cultural_note
  - marker: b
    text: यहाँ प्रयुक्त हिब्रू शब्द कटोरे के आकार के पीने के पात्र को दर्शाता है; अनुवाद ‘प्याला-जैसा पात्र’ भी सम्भव है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक भाव ‘लड़खड़ाहट का प्याला’ है; परम्परागत अनुवाद ‘कँपकँपी का प्याला’ भी मिलता है। शब्द पेय के कारण होने वाली लड़खड़ाहट या चकराहट पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעוֹרְרִי ... הִתְעוֹרְרִי
  choice: जाग उठ, जाग उठ
  rationale: हित्पएल स्त्रीलिंग एकवचन आज्ञार्थक की पुनरावृत्ति तात्कालिकता और आत्म-जागरण का भाव देती है। ‘जाग उठ’ आधुनिक हिन्दी में स्वाभाविक है और पुनरावृत्ति को बनाए रखता है।
- source_word: קוּמִי
  choice: खड़ी हो
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक है और स्त्रीरूप में संबोधित यरूशलेम को उठ खड़े होने के लिए पुकारता है।
- source_word: מִיַּד יְהוָה
  choice: याहवे के हाथ से
  rationale: मूल का ‘हाथ से’ वाला ठोस मुहावरा सुरक्षित रखा गया है; यहाँ हाथ स्रोत और न्यायिक कर्तृत्व को व्यक्त करता है।
- source_word: כּוֹס חֲמָתוֹ
  choice: उसके प्रकोप का प्याला
  rationale: חֵמָה तीव्र क्रोध या प्रकोप को दर्शाता है। ‘प्रकोप’ न्यायपूर्ण दैवी रोष का भार रखता है, और प्याले का भविष्यद्वक्ताओं में प्रयुक्त रूपक अक्षुण्ण रहता है।
- source_word: קֻבַּעַת
  choice: कटोरा
  rationale: यह कटोरे के आकार के पीने के पात्र का द्योतक है। ‘कटोरा’ सामान्य आधुनिक हिन्दी में स्पष्ट और सटीक है।
- source_word: כּוֹס הַתַּרְעֵלָה
  choice: लड़खड़ा देने वाला प्याला
  rationale: תַּרְעֵלָה पेय से उत्पन्न लड़खड़ाहट या चक्कर जैसी दशा बताता है। कारणात्मक हिन्दी पदबंध प्रभाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מָצִית
  choice: पीकर एकदम खाली कर दिया है
  rationale: क्रिया पात्र को तलछट तक निचोड़कर या पीकर खाली करने की पूर्णता दर्शाती है। यह हिन्दी अभिव्यक्ति सम्पूर्ण रूप से पी लेने और दुःख को पूरा सह लेने का भाव रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है; प्रचलित वैकल्पिक उच्चारणों को पाठ में आरोपित नहीं किया गया।
- issue: प्रकोप के प्याले का रूपक
  choice: दैवी न्याय के प्याले का रूपक ज्यों का त्यों रखा गया
  alternative: इसे सीधे ‘दण्ड’ या ‘न्याय’ कहकर व्याख्यायित करना
  rationale: मूल में यरूशलेम याहवे के हाथ से प्याला पीती है। ठोस रूपक दैवी न्याय, अनुभव की तीव्रता और उसे पूरा भोग लेने—तीनों को एक साथ व्यक्त करता है।
- issue: कटोरा और प्याला का संबंध
  choice: दोनों को समानाधिकरण के रूप में रखा गया—‘वह कटोरा, वह ... प्याला’
  alternative: दो अलग पात्र मानना; या एक संज्ञा को हटा देना
  rationale: हिब्रू पदबंध एक ही पात्र के लिए दोनों शब्दों को घनिष्ठ रूप से जोड़ता है। समानाधिकरण मूल की काव्यात्मक पुनरुक्ति और सम्भावित सूक्ष्म अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। स्त्रीलिंग ‘खड़ी हो’ यरूशलेम के व्यक्तिकरण को प्रकट करता है। विस्मयादिबोधक चिह्न दोहरे आह्वान की तीव्रता स्पष्ट करते हैं; अर्धविराम प्याले और कटोरे की समानांतर छवियों को जोड़ता है।
