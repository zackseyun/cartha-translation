  yaml_path: translation/ot/isaiah/019/005.yaml
  text: And the waters of the sea will dry up[b][a], and the river will be parched and dry.
translation:
  language: hi
  text: और समुद्र का पानी सूख जाएगा[a], और नदी[b] सूखकर पूरी तरह शुष्क हो जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समुद्र से पानी चुक जाएगा।” हिब्रू क्रिया पानी के समाप्त हो जाने या सूख जाने—दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: प्रसंग में “नदी” से सम्भवतः नील नदी अभिप्रेत है, लेकिन हिब्रू पाठ में उसका नाम नहीं, बल्कि सामान्य शब्द “नदी” है।
    reason: cultural_note
lexical_decisions:
- source_word: נִשְּׁתוּ
  choice: सूख जाएगा
  rationale: यहाँ निफ़अल रूप पानी के चुक जाने या सूख जाने का परिणाम बताता है; शाब्दिक अर्थ ‘पी लिया जाना’ प्रसंग में उपयुक्त नहीं है।
- source_word: מַיִם מֵהַיָּם
  choice: समुद्र का पानी
  rationale: हिब्रू में बहुवचन ‘जल’ और ‘समुद्र से’ है; आधुनिक हिन्दी में ‘समुद्र का पानी’ स्रोत-संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: נָהָר
  choice: नदी
  rationale: मिस्र के प्रसंग में इसका संकेत सम्भवतः नील नदी की ओर है, फिर भी मूल पाठ जातिवाचक संज्ञा ‘नदी’ ही रखता है; इसलिए मुख्य पाठ में उसका नाम नहीं जोड़ा गया।
- source_word: יֶחֱרַב וְיָבֵשׁ
  choice: सूखकर शुष्क हो जाएगी
  rationale: दोनों निकटार्थक क्रियाओं के बलाघात को बनाए रखने के लिए प्रक्रिया और परिणति व्यक्त की गई है, बिना दोनों को एक ही हिन्दी क्रिया में समतल किए।
