base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/017.yaml
  text: And the land of Judah will become a terror to Egypt[c][b][a]; everyone to whom it is mentioned will fear because of the plan of Yahweh of Armies that he is planning against it.
translation:
  language: hi
  text: यहूदा की भूमि मिस्र के लिए आतंक[a] बन जाएगी। जिस किसी को उसका उल्लेख सुनाया जाएगा[b], वह सेनाओं के याहवे[c] की उस योजना के कारण डर जाएगा, जिसे वह मिस्र के विरुद्ध बना रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भय’, ‘भयावहता’; एक अन्य व्याख्यात्मक परंपरा के अनुसार ‘लड़खड़ाहट’। इब्रानी शब्द दुर्लभ और कठिन है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘हर वह व्यक्ति, जिसके सामने उसका उल्लेख किया जाएगा’; आशय है कि यहूदा का कोई भी उल्लेख मिस्र के व्यक्ति को डरा देगा।
    reason: lexical_alternative
  - marker: c
    text: 'परंपरागत अनुवाद: ‘सेनाओं का यहोवा।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְמַת יְהוּדָה
  choice: यहूदा की भूमि
  rationale: אַדְמָה का अर्थ मिट्टी या भूमि हो सकता है; यहाँ यहूदा और मिस्र के भू-राजनीतिक संदर्भ में ‘भूमि’ स्वाभाविक है।
- source_word: לְמִצְרַיִם
  choice: मिस्र के लिए
  rationale: 'לְ यहाँ संबंध और अनुभव सूचित करता है: यहूदा मिस्र की दृष्टि और अनुभव में आतंक का कारण बनेगा।'
- source_word: לְחָגָּא
  choice: आतंक
  rationale: यह दुर्लभ और कठिन शब्द है। अगले वाक्यांश में भय का स्पष्ट उल्लेख होने के कारण ‘आतंक’ संदर्भ के अनुकूल है; अन्य व्याख्याएँ पादटिप्पणी में रखी गई हैं।
- source_word: כֹּל אֲשֶׁר יַזְכִּיר אֹתָהּ אֵלָיו
  choice: जिस किसी के सामने उसका उल्लेख होगा
  rationale: 'इब्रानी अभिव्यक्ति संक्षिप्त और कुछ अस्पष्ट है। यह अनुवाद उसके वितरणात्मक अर्थ को बनाए रखता है: यहूदा का उल्लेख सुनने वाला प्रत्येक व्यक्ति डरेगा।'
- source_word: יִפְחָד
  choice: डर जाएगा
  rationale: भविष्य में होने वाली भय की प्रतिक्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מִפְּנֵי עֲצַת
  choice: उस योजना के कारण
  rationale: מִפְּנֵי यहाँ कारण सूचित करता है और עֵצָה इस प्रसंग में ईश्वरीय योजना या अभिप्राय है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: याहवे व्यक्तिगत दिव्य नाम को दर्शाता है और ‘सेनाओं के’ צְבָאוֹת के अर्थ को आधुनिक पाठक के लिए स्पष्ट रखता है।
- source_word: אֲשֶׁר הוּא יוֹעֵץ עָלָיו
  choice: जिसे वह मिस्र के विरुद्ध बना रहा है
  rationale: יוֹעֵץ का कृदंत रूप जारी या अभिप्रेत योजना को दिखाता है। अंतिम सर्वनाम का संकेत मिस्र की ओर है; हिन्दी में संभावित सर्वनाम-संदेह हटाने के लिए ‘मिस्र’ दोहराया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: दिव्य व्यक्तिगत नाम को उपाधि में बदलने के बजाय लिप्यंतरित किया गया है; ‘यहोवा’ व्यापक परंपरागत हिन्दी रूप है और पादटिप्पणी में दिया गया है।
- issue: צְבָאוֹת का अनुवाद
  choice: सेनाओं के
  alternative: सेनाओं का यहोवा / सबाओत
  rationale: अर्थ का सीधा अनुवाद आधुनिक पाठक के लिए पारदर्शी है और उपाधि की सामर्थ्य तथा युद्ध-संबंधी छवि बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। कठिन इब्रानी शब्द की अनिश्चितता पादटिप्पणी में सुरक्षित है। ‘उसके विरुद्ध’ की हिन्दी अस्पष्टता से बचने के लिए अंतिम खंड में ‘मिस्र’ स्पष्ट रूप से दोहराया गया है।
