source:
  edition: WLC
  text: וְ/סִכְסַכְתִּ֤י מִצְרַ֨יִם֙ בְּ/מִצְרַ֔יִם וְ/נִלְחֲמ֥וּ אִישׁ בְּ/אָחִ֖י/ו וְ/אִ֣ישׁ בְּ/רֵעֵ֑/הוּ עִ֣יר בְּ/עִ֔יר מַמְלָכָ֖ה בְּ/מַמְלָכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/002.yaml
  text: I will stir up Egyptians against Egyptians[a], and each will fight against his brother, and each against his neighbor, city against city[b], kingdom against kingdom.
translation:
  language: hi
  text: मैं मिस्रियों को मिस्रियों के विरुद्ध भड़काऊँगा[a]; वे आपस में लड़ेंगे—हर एक अपने भाई के विरुद्ध और हर एक अपने पड़ोसी के विरुद्ध, नगर नगर के विरुद्ध और राज्य राज्य के विरुद्ध।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “मिस्र को मिस्र के विरुद्ध।” इसका आशय मिस्र के भीतर आपसी संघर्ष से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: סִכְסַכְתִּי
  choice: भड़काऊँगा
  rationale: यह क्रिया पक्षों को परस्पर संघर्ष के लिए उकसाने या उनमें फूट डालने का कारक भाव व्यक्त करती है। ‘भड़काऊँगा’ आधुनिक हिन्दी में इस सक्रिय कारक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִצְרַיִם בְּמִצְרַיִם
  choice: मिस्रियों को मिस्रियों के विरुद्ध
  rationale: इब्रानी में शाब्दिक रूप से राष्ट्रनाम ‘मिस्र’ दोहराया गया है, पर आगे का बहुवचन और व्यक्ति-व्यक्ति संघर्ष आंतरिक कलह दर्शाता है। हिन्दी में निवासियों का उल्लेख इस सामूहिक अर्थ को स्पष्ट करता है।
- source_word: וְנִלְחֲמוּ
  choice: वे आपस में लड़ेंगे
  rationale: बहुवचन क्रिया के साथ आने वाले वितरक एकवचन पद आंतरिक और व्यापक पारस्परिक संघर्ष खोलकर बताते हैं। ‘आपस में’ नागरिक अंतर्विरोध को सहज हिन्दी में व्यक्त करता है।
- source_word: אִישׁ ... וְאִישׁ
  choice: हर एक ... और हर एक
  rationale: यहाँ אִישׁ का प्रयोग पुरुषत्व पर बल देने के बजाय वितरक अर्थ में है। ‘हर एक’ उसी अर्थ को स्वाभाविक और स्पष्ट रखता है।
- source_word: בְּאָחִיו
  choice: अपने भाई के विरुद्ध
  rationale: ‘भाई’ मूल पारिवारिक बिंब को बनाए रखता है और सामाजिक विघटन की तीव्रता प्रकट करता है।
- source_word: בְּרֵעֵהוּ
  choice: अपने पड़ोसी के विरुद्ध
  rationale: רֵעַ मित्र, साथी या पड़ोसी हो सकता है। यहाँ भाई से व्यापक सामाजिक संबंध की ओर बढ़ती संरचना के कारण ‘पड़ोसी’ उपयुक्त है।
- source_word: עִיר בְּעִיר
  choice: नगर नगर के विरुद्ध
  rationale: संक्षिप्त समानांतर अभिव्यक्ति मूल की क्रमिक तीव्रता और काव्यात्मक गठन को सुरक्षित रखती है।
- source_word: מַמְלָכָה בְּמַמְלָכָה
  choice: राज्य राज्य के विरुद्ध
  rationale: मिस्र के भीतर राजनीतिक इकाइयों के संघर्ष के संदर्भ में ‘राज्य’ आधुनिक हिन्दी में ‘राज्यसत्ता/राजकीय क्षेत्र’ का स्वाभाविक अर्थ देता है और ‘राज्य राज्य के विरुद्ध’ मूल समानांतरता रखता है।
theological_decisions:
- issue: नागरिक संघर्ष के संदर्भ में सामूहिक राष्ट्रनाम מִצְרַיִם का अनुवाद
  choice: मिस्रियों को मिस्रियों के विरुद्ध
  alternative: मिस्र को मिस्र के विरुद्ध
  rationale: मूल पाठ राष्ट्रनाम को दोहराता है, किंतु अगली पंक्ति लोगों और राजनीतिक इकाइयों के आपसी संघर्ष को स्पष्ट करती है। चुना हुआ अनुवाद निहित आंतरिक कलह को हिन्दी पाठक के लिए स्पष्ट करता है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- issue: אִישׁ का वितरक अर्थ
  choice: हर एक ... और हर एक
  alternative: एक मनुष्य ... और एक मनुष्य
  rationale: इस रचना में शब्द का केंद्र लिंग नहीं, बल्कि व्यक्ति-व्यक्ति में फैलता संघर्ष है। ‘हर एक’ मूल वितरक बल को पठनीय हिन्दी में रखता है।
- issue: מַמְלָכָה की राजनीतिक संज्ञा
  choice: राज्य
  alternative: राज्यसत्ता / राज्यक्षेत्र
  rationale: मूल शब्द ‘राज्य’ या ‘राजकीय क्षेत्र’ का बोध दे सकता है। ‘राज्य’ अर्थ को जानबूझकर व्यापक रखता है और पाठ की राजनीतिक इकाइयों के बीच संघर्ष वाली तीव्रता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और मौखिक पठन के अनुकूल शैली। ‘वे आपस में लड़ेंगे’ बहुवचन क्रिया को स्पष्ट करता है; डैश के बाद मूल की क्रमिक समानांतरता—व्यक्ति, परिवार/समाज, नगर और राज्य—बनाए रखी गई है।
