  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶ֤ה מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה בְּ/ת֖וֹךְ אֶ֣רֶץ מִצְרָ֑יִם וּ/מַצֵּבָ֥ה אֵֽצֶל גְּבוּלָ֖/הּ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/019.yaml
  text: In that day there will be an altar to Yahweh in the midst of the land of Egypt[a], and a pillar to Yahweh beside its border.
translation:
  language: hi
  text: उस दिन मिस्र की भूमि के बीच में याहवे के लिए एक वेदी होगी, और उसकी सीमा के पास याहवे के लिए एक स्तंभ होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह मानक भविष्यद्वाणी-संबंधी कालसूचक पदबंध है; हिन्दी में ‘उस दिन’ स्वाभाविक और गरिमापूर्ण है।
- source_word: יִהְיֶה
  choice: होगी / होगा
  rationale: यहाँ היה अस्तित्वसूचक है। हिन्दी वाक्य-रचना में ‘एक वेदी होगी’ और ‘एक खम्भा होगा’ स्वाभाविक रूप से इसका भाव व्यक्त करते हैं।
- source_word: מִזְבֵּחַ
  choice: वेदी
  rationale: यह बलिदान चढ़ाने की वेदी का सामान्य शब्द है; प्रसंग किसी रूपकात्मक अर्थ की माँग नहीं करता।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ל यहाँ समर्पण या संबंध प्रकट करता है। दोनों बार इसे दोहराने से मूल पाठ का बल बना रहता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम की प्रचलित लिप्यंतरण-परंपरा ‘यहोवा’ है; यह शीर्षक से बदलने के बजाय चतुरक्षरी नाम को नाम के रूप में रखती है।
- source_word: בְּתוֹךְ
  choice: के बीच में
  rationale: यह मिस्र की भूमि के भीतर स्थित होने का बोध देता है, केवल उसके किनारे पर होने का नहीं।
- source_word: אֶרֶץ מִצְרָיִם
  choice: मिस्र देश
  rationale: यह मूल के ‘मिस्र की भूमि/देश’ को संक्षिप्त और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּמַצֵּבָה
  choice: और एक खम्भा
  rationale: מַצֵּבָה किसी खड़े किए हुए पत्थर या स्तम्भ को दर्शाता है। ‘खम्भा’ मुख्य पाठ में संक्षिप्त और सहज है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: אֵצֶל
  choice: के पास
  rationale: यह निकटता बताता है; ‘के पास’ हिन्दी में स्वाभाविक है और सीमा के ठीक ऊपर होने की अनावश्यक निश्चितता नहीं जोड़ता।
- source_word: גְּבוּלָהּ
  choice: उसकी सीमा
  rationale: स्त्रीलिंग एकवचन प्रत्यय का संकेत मिस्र की भूमि की ओर है; ‘उसकी सीमा’ मूल की संदर्भगत अस्पष्टता को अनावश्यक रूप से नहीं खोलता।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम है। हिन्दी पाठकों के लिए ‘यहोवा’ स्थापित और बोधगम्य नाम-रूप है; इसे ‘प्रभु’ जैसे शीर्षक से प्रतिस्थापित नहीं किया गया।
- issue: सकारात्मक भविष्यद्वाणी-संदर्भ में מַצֵּבָה
  choice: खम्भा
  alternative: खड़ा किया हुआ पत्थर
  rationale: यह पद उस वस्तु को यहोवा के लिए समर्पित सकारात्मक चिह्न के रूप में रखता है। अनुवाद उसके दूसरे प्रसंगों के विवादास्पद धार्मिक अर्थ को न तो मिटाता है, न यहाँ आरोपित करता है; पादटिप्पणी शाब्दिक विकल्प देती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। भविष्यद्वाणी की संक्षिप्त समानांतर संरचना और ‘यहोवा के लिए’ की पुनरावृत्ति सुरक्षित रखी गई है।
