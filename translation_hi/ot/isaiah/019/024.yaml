base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/024.yaml
  text: In that day Israel will be the third with Egypt and Assyria[a], a blessing in the midst of the earth,
translation:
  language: hi
  text: उस दिन इस्राएल, मिस्र और अश्शूर के साथ तीसरा होगा—पृथ्वी के बीच में एक आशीष।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देश के बीच में एक आशीष।” इब्रानी शब्द אֶרֶץ का अर्थ “पृथ्वी” या “देश,” दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यवाणी में प्रयुक्त मानक काल-सूचक वाक्यांश है; आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: יִהְיֶה
  choice: होगा
  rationale: היה के अपूर्ण रूप का प्रसंगानुकूल सामान्य भविष्यकाल।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: व्यक्तिवाचक नाम का हिन्दी बाइबलीय रूप।
- source_word: שְׁלִישִׁיָּה
  choice: तीसरा
  rationale: स्त्रीलिंग क्रमवाचक यहाँ संज्ञा के रूप में प्रयुक्त है और मिस्र तथा अश्शूर के साथ तीन सदस्यों के समूह में इस्राएल का स्थान बताता है।
- source_word: לְמִצְרַיִם וּלְאַשּׁוּר
  choice: मिस्र और अश्शूर के साथ
  rationale: ל यहाँ दिशा नहीं, बल्कि समूह में सहभागिता या साहचर्य व्यक्त करता है।
- source_word: בְּרָכָה
  choice: एक आशीष
  rationale: मूल के संक्षिप्त विधेय/समानाधिकरण संज्ञा-प्रयोग को बनाए रखता है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: पृथ्वी के बीच में
  rationale: בקרב का निकट अर्थ 'बीच में' है; मिस्र, अश्शूर और इस्राएल का अंतरराष्ट्रीय संदर्भ הארץ के व्यापक अर्थ 'पृथ्वी' का समर्थन करता है।
theological_decisions:
- issue: הָאָרֶץ का भौगोलिक दायरा
  choice: पृथ्वी
  alternative: देश
  rationale: तीन राष्ट्रों और व्यापक आशीष का प्रसंग सार्वभौमिक दायरे की ओर संकेत करता है; फिर भी 'देश' शब्दार्थ की दृष्टि से संभव है, इसलिए उसे पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और भविष्यवाणी-संबंधी शैली। डैश अंतिम पदबंध को इस्राएल, मिस्र और अश्शूर की त्रयी के बारे में समानाधिकरण कथन के रूप में पढ़ने में सहायता देता है, बिना मूल की अर्थगत खुली बनावट को अत्यधिक स्पष्ट किए।
