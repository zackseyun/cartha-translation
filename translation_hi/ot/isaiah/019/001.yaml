source:
  edition: WLC
  text: מַשָּׂ֖א מִצְרָ֑יִם הִנֵּ֨ה יְהוָ֜ה רֹכֵ֨ב עַל עָ֥ב קַל֙ וּ/בָ֣א מִצְרַ֔יִם וְ/נָע֞וּ אֱלִילֵ֤י מִצְרַ֨יִם֙ מִ/פָּנָ֔י/ו וּ/לְבַ֥ב מִצְרַ֖יִם יִמַּ֥ס בְּ/קִרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/001.yaml
  text: 'An oracle concerning Egypt: Behold[a], Yahweh is riding on a swift cloud and is coming to Egypt; the idols of Egypt will tremble before him[c][b], and the heart of Egypt will melt within it.'
translation:
  language: hi
  text: मिस्र के विषय में घोषणा[a]। देखो, याहवे एक तेज़[b] बादल पर सवार होकर मिस्र आ रहा है। मिस्र की मूर्तियाँ उसके सामने[c] थरथराएँगी, और मिस्र का हृदय उसी के भीतर[d] पिघल जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘घोषणा’ के लिए इब्रानी शब्द का अनुवाद ‘भारी संदेश’ या ‘भविष्यसूचक कथन’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘तेज़’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ ‘हल्का’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘उसके सामने से’; अर्थात याहवे की उपस्थिति के कारण।
    reason: lexical_alternative
  - marker: d
    text: इब्रानी में ‘उसके भीतर’; यहाँ ‘उसके’ से मिस्र अभिप्रेत है, जिसे पुल्लिंग एकवचन सत्ता के रूप में प्रस्तुत किया गया है।
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: מַשָּׂא
  choice: घोषणा
  rationale: भविष्यवाणी के शीर्षक में यह शब्द किसी राष्ट्र के विषय में गंभीर और भारपूर्ण नबूवतपूर्ण कथन को सूचित करता है। ‘घोषणा’ आधुनिक हिन्दी में स्वाभाविक है और इसे केवल भविष्य की भविष्यवाणी तक सीमित नहीं करती।
- source_word: מִצְרַיִם / מִצְרָיִם
  choice: मिस्र
  rationale: इस स्थान-नाम का मानक हिन्दी रूप।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह श्रोता का ध्यान खींचकर भविष्यदर्शी दृश्य को सजीव और तात्कालिक बनाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का हिन्दी लिप्यंतरण; इसे किसी उपाधि से नहीं बदला गया है।
- source_word: רֹכֵב עַל עָב קַל
  choice: एक तेज़ बादल पर सवार
  rationale: कृदंत सजीव, आसन्न गति दिखाता है। קַל यहाँ बादल की तीव्र गति बता सकता है; बादल पर सवारी का ईश-प्रकटनात्मक बिंब ज्यों का त्यों रखा गया है।
- source_word: וּבָא
  choice: आ रहा है
  rationale: कृदंत-क्रम में दिखाई गई आसन्न और सजीव क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְנָעוּ
  choice: थरथराएँगी
  rationale: क्रिया डगमगाने, काँपने या हिल उठने का भाव देती है; यहाँ मूर्तियों पर याहवे की उपस्थिति का प्रभाव प्रकट होता है।
- source_word: אֱלִילֵי
  choice: मूर्तियाँ
  rationale: यह मिस्र के पूजित देव-प्रतिमाओं को सूचित करता है; शब्द के अवमाननापूर्ण भाव को अतिरिक्त विशेषण जोड़कर अधिक स्पष्ट नहीं किया गया।
- source_word: מִפָּנָיו
  choice: उसके सामने
  rationale: शाब्दिक भाव ‘उसके मुख/उपस्थिति के सामने से’ है। चुना हुआ रूप हिन्दी में स्वाभाविक रहते हुए याहवे की उपस्थिति को कारण के रूप में बनाए रखता है।
- source_word: וּלְבַב מִצְרַיִם
  choice: मिस्र का हृदय
  rationale: राष्ट्र के भीतरी साहस, संकल्प या मनोबल के लिए प्रयुक्त मानवीकरण और मूल रूपक को सुरक्षित रखता है।
- source_word: יִמַּס
  choice: पिघल जाएगा
  rationale: भय से साहस टूट जाने के इब्रानी रूपक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: בְּקִרְבּוֹ
  choice: उसके भीतर
  rationale: पुल्लिंग एकवचन प्रत्यय मिस्र को एक मानवीकृत सामूहिक सत्ता के रूप में संदर्भित करता है; हिन्दी रूप उसी अस्पष्टता और मानवीकरण को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। उसका लिप्यंतरण नाम और उपाधि के बीच का भेद सुरक्षित रखता है।
- issue: बादल पर सवार याहवे का ईश-प्रकटनात्मक बिंब
  choice: बिंब को सीधे रूप में बनाए रखा गया
  alternative: व्याख्यात्मक भावानुवाद, जैसे ‘याहवे शीघ्र आ रहा है’
  rationale: मूल पाठ याहवे को बादल पर सवार दिखाता है; इसे अमूर्त या केवल रूपकात्मक कथन बनाना मूल की काव्यात्मक और धर्मवैचारिक शक्ति को घटा देता।
- issue: मिस्र का मानवीकरण
  choice: ‘मिस्र का हृदय उसके भीतर’
  alternative: ‘मिस्रवासी अपना साहस खो देंगे’
  rationale: मूल राष्ट्र को एकवचन सत्ता मानकर उसका ‘हृदय’ बताता है। स्पष्टकारी बहुवचन मूल रूपक और उसकी व्यापक राष्ट्रीय व्यंजना को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन में सहज रखी गई है। ‘देखो’ भविष्यदर्शी तात्कालिकता देता है; ‘याहवे’ व्यक्तिगत नाम को स्पष्ट रखता है। राष्ट्रीय मानवीकरण और ‘हृदय पिघलने’ का काव्यात्मक रूपक बिना समतलीकरण के सुरक्षित है।
