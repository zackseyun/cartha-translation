  to: 'सोअन के शासक मूर्ख हो गए हैं;


    नोफ़[a] के शासक धोखे में पड़ गए हैं।


    उन्होंने मिस्र को भटका दिया है—


    वे, जो उसके कुलों के आधारस्तंभ हैं।'
  rationale: Revision improves modern Hindi idiom and clarifies the final construct metaphor while maintaining the Hebrew’s parallelism, passive sense in the second clause, causative sense in the third clause, and the metaphorical ‘cornerstone’ language. No disputed textual or theological interpretation has been introduced.
