reference: Isaiah 19:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: נֽוֹאֲלוּ֙ שָׂ֣רֵי צֹ֔עַן נִשְּׁא֖וּ שָׂ֣רֵי נֹ֑ף הִתְע֥וּ אֶת מִצְרַ֖יִם פִּנַּ֥ת שְׁבָטֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/013.yaml
  text: The princes of Zoan have become foolish; the princes of Noph are deceived. They have led Egypt astray[a], they who are the cornerstone of her tribes.
translation:
  language: hi
  text: 'सोअन के शासक मूर्ख हो गए हैं;


    नोफ़[a] के शासक धोखे में पड़ गए हैं।


    उन्होंने मिस्र को भटका दिया है—


    वे, जो उसके कुलों के आधारस्तंभ हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: नोफ़, मेम्फिस का इब्रानी नाम है।
    reason: आधुनिक पाठक के लिए इब्रानी स्थान-नाम की ऐतिहासिक पहचान स्पष्ट करना।
lexical_decisions:
- source_word: נֽוֹאֲלוּ
  choice: मूर्ख हो गए हैं
  rationale: 'निफ़अल रूप के परिणामसूचक भाव को व्यक्त करता है: वे केवल मूर्खतापूर्ण काम नहीं कर रहे, बल्कि मूर्ख सिद्ध हुए या हो गए हैं।'
- source_word: שָׂרֵי
  choice: हाकिम
  rationale: यहाँ शब्द मिस्र के शासक वर्ग या उच्च अधिकारियों को दर्शाता है। ‘हाकिम’ आधुनिक हिन्दी में राजनीतिक अधिकार और नेतृत्व दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: צֹעַן
  choice: सोअन
  rationale: इब्रानी स्थान-नाम का देवनागरी लिप्यंतरण।
- source_word: נִשְּׁאוּ
  choice: भ्रम में पड़ गए हैं
  rationale: संदर्भ में निफ़अल रूप का अर्थ ‘धोखा खाना’ या ‘भ्रमित होना’ है, न कि ‘ऊँचा किया जाना’। यह समानांतर पंक्ति की मूर्खता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נֹף
  choice: नोफ़
  rationale: इब्रानी नाम को मुख्य पाठ में सुरक्षित रखा गया है; मेम्फिस के रूप में इसकी पहचान पाद-टिप्पणी में दी गई है।
- source_word: הִתְעוּ
  choice: भटका दिया है
  rationale: 'हिफ़ईल की कारणवाचक शक्ति को रखता है: इन हाकिमों ने मिस्र को गलत राह पर लगाया है।'
- source_word: מִצְרַיִם
  choice: मिस्र
  rationale: देश के नाम का प्रचलित मानक हिन्दी रूप।
- source_word: פִּנַּת
  choice: आधारशिला
  rationale: शाब्दिक ‘कोना/कोने का पत्थर’ यहाँ राष्ट्र को सहारा देने वाले प्रमुख लोगों का रूपक है; ‘आधारशिला’ हिन्दी में उसी सहायक और प्रमुख भूमिका को स्पष्ट, गरिमापूर्ण ढंग से रखता है।
- source_word: שְׁבָטֶיהָ
  choice: उसके गोत्रों
  rationale: स्त्रीलिंग प्रत्यय मिस्र की ओर संकेत करता है। ‘गोत्रों’ से मिस्र के घटक समूहों का उल्लेख सुरक्षित रहता है, यद्यपि ‘कुलों’ भी संभव है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और भविष्यद्वाणी के अनुरूप गरिमापूर्ण रखी गई है। समानांतर पंक्तियों और अंतिम रूपक को बनाए रखा गया है। पाद-टिप्पणी का चिह्न ‘नोफ़’ के ठीक बाद रखा गया है, क्योंकि टिप्पणी उसी नाम की पहचान बताती है।
