review_pass:
  verdict: revise
  source_fidelity: 'Draft accurately reflects the three clauses: Zoan''s rulers have become foolish, Noph''s rulers have been deceived, and these leaders have led Egypt astray. The final metaphor is retained, but ‘उसके गोत्रों की आधारशिला’ is syntactically less exact in Hindi: the Hebrew presents the leaders as the supporting/chief element of Egypt’s constituent groups, rather than an ‘foundation belonging to’ those groups.'
  naturalness: The verse is generally clear and suitably elevated. Replacing ‘हाकिम’ with ‘शासक’ avoids a possible judicial sense and is more broadly neutral in modern standard Hindi. ‘कुलों के आधारस्तंभ’ is more idiomatic Hindi than ‘गोत्रों की आधारशिला’ in reference to Egypt’s constituent groups.
  terminology: ‘सोअन,’ ‘नोफ़,’ and ‘मिस्र’ are appropriate. The footnote correctly identifies Noph as Memphis and its anchor is correctly placed. ‘कुल’ avoids importing the specifically South Asian social sense often associated with ‘गोत्र,’ while preserving the Hebrew’s collective-group imagery.
  issues:
  - severity: low
    issue: ‘हाकिम’ can suggest a judge or has a narrower Persianate administrative coloring.
    rationale: ‘शासक’ plainly communicates the political-ruling sense of שָׂרֵי in contemporary standard Hindi.
  - severity: medium
    issue: ‘उसके गोत्रों की आधारशिला’ has an awkward possessive relationship and ‘गोत्र’ is culturally marked in Hindi.
    rationale: The construct phrase פִּנַּת שְׁבָטֶיהָ depicts these leaders as the chief supporting element among Egypt’s groups. ‘उसके कुलों के आधारस्तंभ’ expresses this naturally without over-interpreting the metaphor.
  revised_text: 'सोअन के शासक मूर्ख हो गए हैं;


