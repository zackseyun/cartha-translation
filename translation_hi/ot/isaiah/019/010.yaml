  text: And her foundations will be crushed[b][a]; all who work for wages will be grieved in soul.
translation:
  language: hi
  text: और उसकी नींवें कुचल दी जाएँगी[a]; मज़दूरी के लिए काम करनेवाले सभी मन से शोकाकुल होंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ कठिन है। “उसकी नींवें” का अर्थ “उसके खंभे/सहारे” भी हो सकता है; कुछ विद्वानों ने “उसके बुनकर” अर्थ प्रस्तावित किया है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में अंतिम वाक्यांश अस्पष्ट है। उसका शाब्दिक रूप लगभग “प्राण के तालाब” या “जीवन/अभिलाषा के दलदल” जैसा है; बहुत-से लोग इसे मन के शोक या निराशा का मुहावरेदार वर्णन मानते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁתֹתֶיהָ
  choice: उसकी नींवें
  rationale: दुर्लभ और विवादित शब्द को שׁית/שות, अर्थात् ‘रखना/स्थापित करना’, से संबंधित मानते हुए ‘नींवें’ चुना गया है। यह मिस्र की सामाजिक-आर्थिक व्यवस्था के ढहने की छवि के अनुकूल है; अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: מְדֻכָּאִים
  choice: कुचल दी जाएँगी
  rationale: דכא का निष्क्रिय रूप कुचले या तोड़े जाने का प्रबल भाव देता है। भविष्यसूचक संदर्भ में ‘दी जाएँगी’ स्वाभाविक हिन्दी है।
- source_word: כָּל
  choice: सभी
  rationale: यह आगे बताए गए पूरे वर्ग को समेटने वाला सीधा वितरणात्मक अर्थ व्यक्त करता है।
- source_word: עֹשֵׂי שֶׂכֶר
  choice: मज़दूरी के लिए काम करनेवाले
  rationale: शाब्दिक संरचना ‘मज़दूरी करने/बनानेवाले’ का स्वाभाविक आशय वे लोग हैं जो भुगतान के लिए श्रम करते हैं। चयन अर्थ और वाक्य-रचना दोनों को स्पष्ट रखता है।
- source_word: אַגְמֵי נָפֶשׁ
  choice: मन से शोकाकुल होंगे
  rationale: मसोरेटिक पाठ का वाक्यांश अत्यंत अस्पष्ट है। संदर्भ में यह मज़दूरों की भीतरी उदासी या निराशा का संकेत देता प्रतीत होता है। ‘मन से शोकाकुल’ सम्भावित अर्थ को स्वाभाविक हिन्दी में देता है, जबकि शाब्दिक कठिनाई पादटिप्पणी में सुरक्षित है।
