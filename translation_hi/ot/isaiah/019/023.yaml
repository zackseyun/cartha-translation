source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא תִּהְיֶ֨ה מְסִלָּ֤ה מִ/מִּצְרַ֨יִם֙ אַשּׁ֔וּרָ/ה וּ/בָֽא אַשּׁ֥וּר בְּ/מִצְרַ֖יִם וּ/מִצְרַ֣יִם בְּ/אַשּׁ֑וּר וְ/עָבְד֥וּ מִצְרַ֖יִם אֶת אַשּֽׁוּר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/023.yaml
  text: In that day there will be a highway from Egypt to Assyria[a], and Assyria will come into Egypt, and Egypt into Assyria[b]; and Egypt will serve with Assyria.
translation:
  language: hi
  text: उस दिन मिस्र से अश्शूर तक एक राजमार्ग होगा। अश्शूर मिस्र में आएगा और मिस्र अश्शूर में आएगा[b]; और मिस्र अश्शूर की सेवा करेगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी वाक्यरचना में “अश्शूर” प्रत्यक्ष कर्म है: “मिस्र अश्शूर की सेवा करेगा।” फिर भी, आस-पास के संदर्भ में मिस्र और अश्शूर दोनों परमेश्वर की आशीष में सहभागी हैं; इसलिए इसे “मिस्र अश्शूर के साथ मिलकर परमेश्वर की सेवा या आराधना करेगा” भी समझा जाता है।'
    reason: alternative_reading
  - marker: b
    text: 'इब्रानी में दूसरे खंड में क्रिया दोबारा नहीं कही गई है: “और मिस्र अश्शूर में।” आशय है, “और मिस्र अश्शूर में आएगा।”'
    reason: ellipsis
lexical_decisions:
- source_word: מְסִלָּה
  choice: राजमार्ग
  rationale: यह शब्द प्रायः बनाए हुए ऊँचे मार्ग या मुख्य सड़क को दर्शाता है। यहाँ ‘राजमार्ग’ दोनों देशों के बीच खुले और सीधे संपर्क की छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מִמִּצְרַיִם ... אַשּׁוּרָה
  choice: मिस्र से अश्शूर तक
  rationale: पूर्वसर्ग मिस्र से अश्शूर की दिशा में गति बताते हैं; ‘से…तक’ इस अंतरराष्ट्रीय मार्ग को सहज और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: וּבָא אַשּׁוּר בְּמִצְרַיִם
  choice: अश्शूर के लोग मिस्र में आएँगे
  rationale: בוא के साथ ב किसी स्थान में प्रवेश या आगमन दर्शाता है। देश के नाम को उसके निवासियों के अर्थ में समझकर बहुवचन रूप आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: וּמִצְרַיִם בְּאַשּׁוּר
  choice: मिस्र के लोग अश्शूर में जाएँगे
  rationale: इब्रानी में पिछले खंड का क्रिया-पद यहाँ अध्याहृत है। हिन्दी में उसे स्पष्ट करना आवश्यक है; दिशा के अनुसार ‘जाएँगे’ स्वाभाविक है, यद्यपि शाब्दिक पुनरावृत्ति ‘आएँगे’ हो सकती थी।
- source_word: וְעָבְדוּ
  choice: आराधना करेंगे
  rationale: עבד का अर्थ सामान्य सेवा भी हो सकता है और धार्मिक संदर्भ में उपासना/आराधना भी। निकटवर्ती संदर्भ में मिस्र और अश्शूर दोनों का यहोवा से जुड़ना और आशीष पाना संयुक्त आराधना के अर्थ का समर्थन करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: מִצְרַיִם אֶת־אַשּׁוּר
  choice: मिस्र के लोग अश्शूर के लोगों के साथ मिलकर
  rationale: אֶת सामान्यतः प्रत्यक्ष कर्म को चिह्नित करता है, इसलिए शाब्दिक वाक्यरचना ‘मिस्र अश्शूर की सेवा करेगा’ हो सकती है। फिर भी पद 24–25 का मेल-मिलाप और संयुक्त आशीष वाला संदर्भ दोनों राष्ट्रों की साथ-साथ परमेश्वर की सेवा/आराधना का अर्थ अधिक संभावित बनाता है।
theological_decisions:
- issue: וְעָבְדוּ מִצְרַיִם אֶת־אַשּׁוּר का आशय
  choice: मिस्र और अश्शूर के लोग साथ मिलकर आराधना करेंगे
  alternative: मिस्र अश्शूर की सेवा करेगा; अथवा, धार्मिक अर्थ लेने पर, मिस्र अश्शूर की आराधना करेगा
  rationale: तत्काल वाक्यरचना अश्शूर को क्रिया का कर्म मानने की अनुमति देती है, पर आगे के पद मिस्र और अश्शूर को एक साथ यहोवा से आशीष पाते हुए दिखाते हैं। इसलिए मुख्य पाठ संयुक्त आराधना का संदर्भगत अर्थ देता है, जबकि वास्तविक व्याकरणिक तनाव पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। राष्ट्रों के नामों को जहाँ वे निवासियों के लिए प्रयुक्त हैं, वहाँ ‘के लोग’ जोड़कर स्वाभाविक हिन्दी बनाई गई है। ‘राजमार्ग’ भविष्यवाणी की खुली आवाजाही की छवि बनाए रखता है। अंतिम खंड की वास्तविक व्याकरणिक और धर्मवैचारिक अस्पष्टता को मुख्य पाठ तथा पादटिप्पणी के संयोजन से सुरक्षित रखा गया है।
