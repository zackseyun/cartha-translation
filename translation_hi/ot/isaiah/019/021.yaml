source:
  edition: WLC
  text: וְ/נוֹדַ֤ע יְהוָה֙ לְ/מִצְרַ֔יִם וְ/יָדְע֥וּ מִצְרַ֛יִם אֶת יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וְ/עָֽבְדוּ֙ זֶ֣בַח וּ/מִנְחָ֔ה וְ/נָדְרוּ נֵ֥דֶר לַֽ/יהוָ֖ה וְ/שִׁלֵּֽמוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/021.yaml
  text: And Yahweh will make himself known to Egypt[a], and Egypt will know Yahweh in that day, and they will serve with sacrifice and offering[c][b], and they will vow vows to Yahweh and fulfill them.
translation:
  language: hi
  text: उस दिन याहवे मिस्र के लोगों के सामने अपने आपको प्रकट करेगा[a], और मिस्र के लोग याहवे को जानेंगे। वे बलि और भेंट[b] के साथ याहवे की उपासना करेंगे; वे याहवे के लिए मन्नतें मानेंगे[c] और उन्हें पूरा करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे मिस्र में जाना जाएगा।” इब्रानी क्रिया का अनुवाद अधिक निष्क्रिय ढंग से भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “भेंट” के लिए प्रयुक्त इब्रानी शब्द धार्मिक संदर्भ में अन्नबलि भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से “मन्नत की मन्नत मानेंगे” है; यह सजातीय रचना मन्नत मानने पर बल देती है।
    reason: source_form
lexical_decisions:
- source_word: וְנוֹדַע
  choice: अपने आपको प्रकट करेगा
  rationale: ידע के निफ़अल रूप का अर्थ ‘जाना जाएगा’ भी हो सकता है, पर यहाँ यह अभिव्यक्ति याहवे के मिस्र के सामने स्वयं प्रकट होने का स्वाभाविक हिन्दी बोध देती है; वैकल्पिक निष्क्रिय अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: מִצְרַיִם
  choice: मिस्र / मिस्र के लोग
  rationale: पहली बार देश के नाम के रूप में ‘मिस्र’ रखा गया है; दूसरी बार बहुवचन क्रिया के अनुरूप और स्वाभाविक हिन्दी के लिए उस सामूहिक अर्थ को ‘मिस्र के लोग’ से स्पष्ट किया गया है।
- source_word: וְעָבְדוּ
  choice: उपासना करेंगे
  rationale: עבד का मूल अर्थ ‘सेवा करना’ है, किंतु बलि और भेंट के निकट संदर्भ में धार्मिक आराधना अभिप्रेत है; इसलिए ‘उपासना करेंगे’ संदर्भगत अर्थ को स्पष्ट करता है।
- source_word: זֶבַח וּמִנְחָה
  choice: बलि और भेंट
  rationale: זבח के लिए ‘बलि’ और व्यापक अर्थ वाले מנחה के लिए ‘भेंट’ चुना गया है। दूसरे शब्द को केवल ‘अन्नबलि’ कहना संभव है, पर तत्काल संदर्भ इतना विशिष्ट अर्थ अनिवार्य नहीं करता।
- source_word: וְנָדְרוּ נֵדֶר
  choice: मन्नतें मानेंगे
  rationale: इब्रानी की सजातीय क्रिया-संज्ञा रचना को शब्दशः दोहराने के बजाय हिन्दी की स्वाभाविक बहुवचन अभिव्यक्ति रखी गई है, जो संकल्प लेने की दृढ़ता और वास्तविकता को व्यक्त करती है।
- source_word: וְשִׁלֵּמוּ
  choice: उन्हें पूरा करेंगे
  rationale: मन्नत के साथ שלם का अर्थ उसे चुकाना या पूरा करना है। ‘उन्हें’ पूर्ववर्ती मन्नतों को स्पष्ट रूप से संदर्भित करता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसका लिप्यंतरण है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: עבד का धार्मिक अर्थ
  choice: उपासना करेंगे
  alternative: सेवा करेंगे
  rationale: बलि, भेंट और मन्नतों वाला संदर्भ धार्मिक उपासना की ओर संकेत करता है। फिर भी ‘सेवा’ का मूल अर्थ अनदेखा नहीं किया गया; उपासना यहाँ याहवे की धार्मिक सेवा है।
- issue: וְנוֹדַע में दैवी आत्म-प्रकाशन और निष्क्रिय अर्थ
  choice: अपने आपको प्रकट करेगा
  alternative: मिस्र में जाना जाएगा
  rationale: मुख्य पाठ में प्रसंगानुकूल दैवी आत्म-प्रकाशन व्यक्त किया गया है, जबकि इब्रानी निफ़अल की वास्तविक निष्क्रिय संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी रखी गई है। ‘उस दिन’ से भविष्यद्वाणी का पारंपरिक काल-सूत्र सुरक्षित है। ‘मिस्र के लोग’ सामूहिक राष्ट्रवाचक प्रयोग को हिन्दी में स्पष्ट करता है, और अर्धविराम अंतिम दो निकट संबद्ध कार्यों—मन्नत मानने और उसे पूरा करने—को जोड़ता है।
