  yaml_path: translation/ot/isaiah/019/008.yaml
  text: And the fishermen will lament[a], and all who cast a hook into the Nile will mourn[b]; those who spread a net over the waters will waste away.
translation:
  language: hi
  text: मछुआरे विलाप करेंगे, और नील नदी में मछली पकड़ने का काँटा डालनेवाले सभी शोक मनाएँगे; जल की सतह पर जाल फैलानेवाले निढाल हो जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָנוּ
  choice: विलाप करेंगे
  rationale: क्रिया शोक में कराहने या विलाप करने का भाव व्यक्त करती है; भविष्यकाल भविष्यवाणी के प्रसंग के अनुकूल है।
- source_word: הַדַּיָּגִים
  choice: मछुआरे
  rationale: यह मछली पकड़ने के व्यवसाय में लगे लोगों के लिए आधुनिक और स्वाभाविक हिन्दी शब्द है।
- source_word: וְאָבְלוּ
  choice: शोक मनाएँगे
  rationale: אבל शोक करने का सामान्य भाव व्यक्त करता है; यह पहली क्रिया के समानांतर रहते हुए शब्दगत भिन्नता भी बनाए रखता है।
- source_word: כָּל מַשְׁלִיכֵי
  choice: डालनेवाले सभी
  rationale: कृदन्त लोगों को उनकी नियमित गतिविधि के आधार पर पहचानता है; यह अभिव्यक्ति उस व्यावसायिक अर्थ को स्वाभाविक हिन्दी में रखती है।
- source_word: בַיְאֹר
  choice: नील नदी में
  rationale: मिस्र-संबंधी इस प्रसंग में יְאֹר सामान्यतः नील नदी अथवा उसकी धाराओं को सूचित करता है; यहाँ स्पष्ट संदर्भ के कारण 'नील नदी' उपयुक्त है।
- source_word: חַכָּה
  choice: काँटा
  rationale: संज्ञा मछली पकड़ने के काँटे को दर्शाती है; मछुआरों के प्रसंग में संक्षिप्त 'काँटा' पर्याप्त स्पष्ट है।
- source_word: וּפֹרְשֵׂי
  choice: फैलानेवाले
  rationale: कृदन्त मछली पकड़ने के जाल को फैलाने की क्रिया बताता है।
- source_word: מִכְמֹרֶת
  choice: जाल
  rationale: यह मछली पकड़ने के जाल को सूचित करता है; मूल शब्द किसी अधिक विशिष्ट प्रकार को अनिवार्य नहीं बनाता।
- source_word: עַל פְּנֵי מַיִם
  choice: जल के ऊपर
  rationale: यह मूल के 'जल की सतह पर' वाले चित्र को सहज और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: אֻמְלָלוּ
  choice: मुरझा जाएँगे
  rationale: क्रिया मुरझाने, दुर्बल पड़ने या निस्तेज होने का सजीव रूपक व्यक्त करती है; 'मुरझा जाएँगे' उस रूपक को बिना आर्थिक या भावनात्मक कारण निश्चित किए सुरक्षित रखता है।
