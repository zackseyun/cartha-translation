reference: Isaiah 19:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לֹֽא יִהְיֶ֥ה לְ/מִצְרַ֖יִם מַֽעֲשֶׂ֑ה אֲשֶׁ֧ר יַעֲשֶׂ֛ה רֹ֥אשׁ וְ/זָנָ֖ב כִּפָּ֥ה וְ/אַגְמֽוֹן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/015.yaml
  text: And there will be no work for Egypt that head or tail[a], palm branch or reed[b], can do.
translation:
  language: hi
  text: और मिस्र के लिए ऐसा कोई काम न होगा, जिसे सिर या पूँछ,[a] खजूर की डाल या सरकंडा[b] कर सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में ‘सिर और पूँछ, खजूर की डाल और सरकंडा’ समाज के सबसे ऊँचे से सबसे नीचे तक हर स्तर के लिए प्रयुक्त रूपक है; यशायाह 9:14 में मिलते-जुलते चित्र से तुलना करें।
    reason: cross_reference
  - marker: b
    text: या, ‘सिर और पूँछ, खजूर की डाल और सरकंडा।’ हिब्रू में इन जोड़ियों को ‘और’ से जोड़ा गया है; आशय यह है कि मिस्र का कोई भी भाग—ऊँचा या नीचा—कुछ नहीं कर सकेगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֶׂה
  choice: काम
  rationale: संज्ञा किसी कार्य, कर्म या उपक्रम को दर्शाती है। यहाँ ‘ऐसा कोई काम’ स्वाभाविक हिन्दी है और आगे के संबंधवाचक उपवाक्य से सहज रूप से जुड़ता है।
- source_word: אֲשֶׁר יַעֲשֶׂה
  choice: जिसे ... कर सके
  rationale: यह संबंधवाचक उपवाक्य उस काम को बताता है जिसे करने की क्षमता नहीं होगी। इस प्रसंग में अपूर्ण क्रिया का सामर्थ्य-सूचक भाव ‘कर सके’ से स्पष्ट होता है।
- source_word: רֹאשׁ וְזָנָב
  choice: सिर या पूँछ
  rationale: ये समाज के ऊँचे और नीचे वर्गों के रूपक हैं। यद्यपि हिब्रू में संयोजक वाव है, निषेध के अंतर्गत ‘या’ वितरणात्मक अर्थ—न यह, न वह—को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּפָּה
  choice: खजूर की डाल
  rationale: यह शब्द संभवतः खजूर की ऊँची डाल को सूचित करता है और सरकंडे के साथ ऊँच-नीच का चित्र बनाता है। ‘खजूर की डाल’ वनस्पति-चित्र को स्पष्ट रखता है।
- source_word: אַגְמוֹן
  choice: सरकंडा
  rationale: यह दलदली क्षेत्र में उगने वाले नरकट या सरकंडे जैसे पौधे का नाम है। ‘सरकंडा’ आधुनिक हिन्दी में स्पष्ट है और ऊँची खजूर की डाल के विपरीत नीचे उगने वाले पौधे का चित्र बनाए रखता है।
- source_word: לְמִצְרַיִם
  choice: मिस्र के लिए
  rationale: 'यहाँ ל संबंध या उपलब्धता प्रकट करता है: मिस्र के लिए कोई कार्य अथवा उपलब्धि न होगी।'
- source_word: וְלֹא יִהְיֶה
  choice: और ... न होगा
  rationale: यह भविष्यकालीन अस्तित्ववाचक निषेध है। ‘न होगा’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी है।
