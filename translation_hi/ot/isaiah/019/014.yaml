id: ISA.19.14
reference: Isaiah 19:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְהוָ֛ה מָסַ֥ךְ בְּ/קִרְבָּ֖/הּ ר֣וּחַ עִוְעִ֑ים וְ/הִתְע֤וּ אֶת מִצְרַ֨יִם֙ בְּ/כָֽל מַעֲשֵׂ֔/הוּ כְּ/הִתָּע֥וֹת שִׁכּ֖וֹר בְּ/קִיאֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/014.yaml
  text: Yahweh has mixed within her a spirit of confusion[a], and they have led Egypt astray in all its work[b], as a drunkard staggers in his vomit.
translation:
  language: hi
  text: याहवे ने उसके भीतर भ्रम की आत्मा घोल दी है[a], और वे मिस्र को उसके हर काम में भटका दिया है[b], जैसे कोई मतवाला अपनी उलटी में लड़खड़ाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विकृति की आत्मा,’ ‘टेढ़ेपन की आत्मा,’ अथवा ‘चक्कर की आत्मा।’ हिब्रू अभिव्यक्ति न्याय के रूप में भेजे गए ऐसे प्रभाव को दर्शाती है जो मनुष्य को दिशाहीन और विकृत कर देता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू क्रिया बहुवचन है—‘वे मिस्र को भटका दिया है।’ कर्ता स्पष्ट रूप से नहीं बताया गया है; संकेत भ्रमकारी प्रभावों की ओर या उनके अधीन मिस्र के अगुओं की ओर हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसका प्रचलित हिंदी लिप्यंतरण रखा गया है।
- source_word: מָסַךְ
  choice: घोल दी है
  rationale: क्रिया का मूल अर्थ द्रवों को मिलाना या घोलना है। यह चयन न्याय के रूपक में निहित ठोस चित्र को बनाए रखता है।
- source_word: בְּקִרְבָּהּ
  choice: उसके भीतर
  rationale: स्त्रीलिंग प्रत्यय मिस्र देश की ओर संकेत करता है; हिंदी में ‘उसके भीतर’ स्वाभाविक है और अनावश्यक लिंग-निर्धारण से बचता है।
- source_word: רוּחַ עִוְעִים
  choice: भ्रम की आत्मा
  rationale: यह पदबंध मरोड़ने, विकृत करने और दिशाहीन कर देने वाले प्रभाव को व्यक्त करता है। ‘भ्रम’ प्रसंग में उसके परिणाम को स्पष्ट करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: וְהִתְעוּ
  choice: और वे ... भटका देते हैं
  rationale: हिब्रू की बहुवचन कर्तृवाचक क्रिया को ‘वे’ द्वारा बनाए रखा गया है; अस्पष्ट कर्ता को एकवचन या कर्मवाच्य बनाकर नहीं सुलझाया गया।
- source_word: בְּכָל מַעֲשֵׂהוּ
  choice: उसके हर काम में
  rationale: यह मिस्र के समस्त कार्यों और उपक्रमों को समेटता है और हिंदी में सहज है।
- source_word: כְּהִתָּעוֹת שִׁכּוֹר
  choice: जैसे कोई मतवाला ... लड़खड़ाता है
  rationale: तुलना में नशे से दिशाहीन चाल का भाव है; ‘लड़खड़ाता’ उस गति और नियंत्रणहीनता को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בְּקִיאוֹ
  choice: अपनी उलटी में
  rationale: मूल पाठ की तीखी और अपमानजनक छवि को नरम किए बिना सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘भ्रम की आत्मा’ के द्वारा ईश्वरीय न्याय की कर्तृता
  choice: याहवे को सक्रिय रूप से मिस्र के भीतर दिशाहीन करने वाली आत्मा घोलने वाला बताया गया है।
  alternative: याहवे ने केवल मिस्र में भ्रम उत्पन्न होने दिया।
  rationale: हिब्रू पाठ सीधे याहवे को क्रिया का कर्ता बताता है। अनुवाद इस प्रबल कर्तृता को रखता है, पर प्रत्यक्ष कारण और अनुमति जैसी बाद की व्यवस्थित धर्मवैज्ञानिक श्रेणियाँ पाठ में नहीं जोड़ता।
- issue: बहुवचन क्रिया का अस्पष्ट कर्ता
  choice: ‘वे ... भटका देते हैं’ के द्वारा बहुवचन और उसकी अस्पष्टता सुरक्षित रखी गई है।
  alternative: ‘वह मिस्र को भटका देती है’ अथवा ‘मिस्र भटक गया है।’
  rationale: मसोरेटिक पाठ की क्रिया बहुवचन है, यद्यपि उसका कर्ता स्पष्ट रूप से व्यक्त नहीं हुआ। उसे बहुवचन रखना पाठ की वास्तविक अस्पष्टता का सम्मान करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘घोल दी है’ मूल रूपक को, ‘वे’ स्रोत की व्याकरणिक अस्पष्टता को, और ‘अपनी उलटी में’ मूल की कठोर छवि को सुरक्षित रखते हैं।
