  text: whom Yahweh of Armies has blessed[a], saying, “Blessed be Egypt my people, and Assyria the work of my hands[b], and Israel my inheritance.”
translation:
  language: hi
  text: जिन्हें सेनाओं के याहवे ने यह कहकर आशीष दी[a], “धन्य हो मिस्र, मेरी प्रजा; और अश्शूर, मेरे हाथों का काम[b]; और इस्राएल, मेरी विरासत।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेनाओं का प्रभु।”
    reason: lexical_alternative
  - marker: b
    text: “मेरी प्रजा” और “मेरे हाथों का काम” जैसे पद प्रायः इस्राएल से जुड़े हैं; यहाँ वे क्रमशः मिस्र और अश्शूर के लिए प्रयुक्त हुए हैं।
    reason: cross_reference
lexical_decisions:
- source_word: אֲשֶׁר בֵּרֲכוֹ
  choice: जिन्हें … आशीष दी है
  rationale: सम्बन्धवाचक पद पिछले पद की तीनों इकाइयों—मिस्र, अश्शूर और इस्राएल—की ओर लौटता है। हिब्रू में क्रिया और प्रत्यय व्याकरणतः एकवचन हैं, पर सामूहिक त्रय के लिए हिन्दी में स्वाभाविक बहुवचन ‘जिन्हें’ चुना गया है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहवे
  rationale: व्यक्तिगत दिव्य नाम יהוה को ‘यहवे’ के रूप में रखा गया है और צְבָאוֹת का स्पष्ट आधुनिक अर्थ ‘सेनाओं’ दिया गया है।
- source_word: בָּרוּךְ
  choice: धन्य हो
  rationale: यह विधिवत आशीर्वचन का सूत्र है; ‘धन्य हो’ उसके कामनात्मक और घोषणात्मक बल को बनाए रखता है।
- source_word: עַמִּי מִצְרַיִם
  choice: मेरी प्रजा मिस्र
  rationale: हिब्रू के सीधे समानाधिकरण को बनाए रखा गया है, ताकि मिस्र को दिया गया चौंकाने वाला पद नरम न पड़े।
- source_word: מַעֲשֵׂה יָדַי אַשּׁוּר
  choice: मेरे हाथों की कृति अश्शूर
  rationale: מַעֲשֵׂה का अर्थ किया हुआ कार्य या रचना है; ‘कृति’ संक्षिप्त, गरिमापूर्ण और स्वाभाविक है तथा समानाधिकरण सुरक्षित रखता है।
- source_word: נַחֲלָתִי יִשְׂרָאֵל
  choice: मेरी विरासत इस्राएल
  rationale: נַחֲלָה विरासत अथवा निज भाग/अधिकार को व्यक्त करता है; ‘विरासत’ यहाँ सीधा और धर्मवैचारिक रूप से तटस्थ अनुवाद है।
theological_decisions:
- issue: दिव्य उपाधि יְהוָה צְבָאוֹת
  choice: सेनाओं के यहवे
  alternative: सेनाओं का प्रभु; सेनाधीश यहोवा
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम और उपाधि के सैन्य बहुवचन, दोनों को स्पष्ट रखा गया है; किसी पारंपरिक प्रतिस्थापन को मुख्य पाठ में नहीं लाया गया।
- issue: मिस्र और अश्शूर पर इस्राएल-संबद्ध पदों का प्रयोग
  choice: ‘मेरी प्रजा मिस्र’ और ‘मेरे हाथों की कृति अश्शूर’ को सीधे समानाधिकरण में रखना
  alternative: व्याख्यात्मक रूप, जैसे ‘मिस्र, जो अब मेरी प्रजा है’
  rationale: मूल की धर्मवैचारिक चौंक और तनाव को बिना समझाए या सीमित किए सुरक्षित रखा गया है।
- issue: אֲשֶׁר בֵּרֲכוֹ में एकवचन रूप और त्रयी-संदर्भ
  choice: हिन्दी में ‘जिन्हें … आशीष दी है’
  alternative: ‘जिसे … आशीष दी है’
  rationale: हिब्रू का व्याकरणिक एकवचन सम्भवतः पिछले पद के संयुक्त त्रय को सामूहिक इकाई मानता है; हिन्दी बहुवचन से तीनों संदर्भित पक्ष स्पष्ट होते हैं, जबकि किसी एक को अलग नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए बोधगम्य रूप। आशीर्वचन की काव्यात्मक समानांतर संरचना और विदेशी राष्ट्रों को दिए गए असाधारण पद जानबूझकर सुरक्षित रखे गए हैं।
