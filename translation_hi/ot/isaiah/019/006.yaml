  yaml_path: translation/ot/isaiah/019/006.yaml
  text: The rivers will stink[a]; the canals of Egypt will dwindle and dry up[c][b]; reed and rush will wither.
translation:
  language: hi
  text: नदियाँ दुर्गन्ध देने लगेंगी[a]; मिस्र की नहरें[b] घटती जाएँगी और सूख जाएँगी; सरकंडे और दलदली घास[c] मुरझा जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नदियाँ दूषित हो जाएँगी।” इब्रानी क्रिया दुर्लभ है; इसका आशय जलधाराओं के दुर्गन्धित या दूषित होने से है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मात्सोर की नहरें”; यहाँ “मात्सोर” सम्भवतः मिस्र का काव्यात्मक नाम है।
    reason: lexical_alternative
  - marker: c
    text: या, “पपीरस।” इब्रानी शब्द नदी-तटों और दलदलों में उगने वाली वनस्पति के लिए प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶאֶזְנִיחוּ
  choice: सड़कर दुर्गन्ध देने लगेंगी
  rationale: यह दुर्लभ क्रिया इस प्रसंग में जलधाराओं के दूषित या सड़कर दुर्गन्धयुक्त होने का भाव देती है। यह हिन्दी प्रयोग दुर्गन्ध और सड़न—दोनों निहित अर्थों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נְהָרוֹת
  choice: नदियाँ
  rationale: बहुवचन संज्ञा का सीधा और सामान्य हिन्दी समतुल्य; आगे आने वाली अधिक विशिष्ट ‘नहरें’ से इसका भेद भी बना रहता है।
- source_word: דָּלֲלוּ
  choice: घटती जाएँगी
  rationale: क्रिया के कम, क्षीण या उथला होने के भाव को जल की मात्रा के क्रमशः घटने के रूप में सहज हिन्दी में व्यक्त करता है।
- source_word: וְחָרְבוּ
  choice: सूख जाएँगी
  rationale: जलमार्गों के विषय में חרב का स्वाभाविक अर्थ सूख जाना है।
- source_word: יְאֹרֵי
  choice: नहरें
  rationale: मिस्री प्रसंग में यह शब्द विशेषतः नील से जुड़ी जलधाराओं या नहरों को सूचित कर सकता है; ‘नहरें’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: מָצוֹר
  choice: मिस्र की
  rationale: यहाँ מָצוֹר को मिस्र के काव्यात्मक या विरल नाम के रूप में समझना प्रसंगानुकूल है; पाठ में ‘मिस्र’ भौगोलिक संकेत स्पष्ट करता है, जबकि पादटिप्पणी मूल रूप की जानकारी देती है।
- source_word: קָנֶה
  choice: सरकंडे
  rationale: नदी-तट पर उगने वाले reed/cane के लिए प्रचलित और संदर्भानुकूल हिन्दी शब्द।
- source_word: וָסוּף
  choice: दलदली घास
  rationale: סוּף जलाशयों के किनारे उगने वाली दलदली वनस्पति को सूचित करता है। यह चयन ‘सरकंडे’ से शब्दगत भेद बनाए रखता है और ‘पपीरस’ जैसी अधिक विशिष्ट पहचान को मुख्य पाठ पर नहीं थोपता।
- source_word: קָמֵלוּ
  choice: मुरझा जाएँगे
  rationale: वनस्पति के कुम्हलाने या क्षीण होने का सटीक और स्वाभाविक हिन्दी वर्णन; पहले प्रयुक्त ‘सूख जाएँगी’ की पुनरावृत्ति से भी बचता है।
