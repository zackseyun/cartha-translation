  yaml_path: translation/ot/isaiah/019/009.yaml
  text: Those who work with combed flax will be ashamed[b][a], and those who weave white cloth.
translation:
  language: hi
  text: कंघी किए हुए सन[a] पर काम करनेवाले और उजला कपड़ा[b] बुननेवाले लज्जित होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बारीक सन।” इब्रानी शब्द सम्भवतः विशेष रूप से तैयार किए गए उत्तम किस्म के सन को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “सफेद लिनन।” इब्रानी शब्द सम्भवतः सफेद अथवा विरंजित वस्त्र-सामग्री को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֹשׁוּ
  choice: लज्जित होंगे
  rationale: בוש का सामान्य अर्थ विफलता या विनाश के कारण लज्जित अथवा अपमानित होना है; आर्थिक न्याय के इस संदर्भ में यह सीधा अर्थ सुरक्षित रहता है।
- source_word: עֹבְדֵי
  choice: काम करनेवाले
  rationale: עבד का कृदंत रूप किसी काम या व्यवसाय में लगे लोगों को दर्शाता है; परवर्ती सामग्री के साथ यह स्वाभाविक हिन्दी है।
- source_word: פִשְׁתִּים
  choice: सन
  rationale: यह संज्ञा उस पौधे अथवा रेशेदार सामग्री को दर्शाती है जिससे लिनन बनता है; हिन्दी में इसका सीधा और प्रचलित नाम 'सन' है।
- source_word: שְׂרִיקוֹת
  choice: कंघी किए हुए
  rationale: यह कठिन शब्द सम्भवतः विशेष रूप से तैयार, कंघी या धुनकर सँवारे गए उत्तम सन को दर्शाता है; यह अनुवाद वस्त्र-निर्माण का संदर्भ बनाए रखता है, पर केवल गुणवत्ता का अर्थ निश्चित नहीं करता।
- source_word: וְאֹרְגִים
  choice: और ... बुननेवाले भी
  rationale: ארג का कृदंत बुनाई करनेवालों को दर्शाता है; 'भी' पहले व्यावसायिक समूह के साथ समानांतरता को हिन्दी में स्पष्ट और स्वाभाविक बनाता है।
- source_word: חוֹרָי
  choice: उजला कपड़ा
  rationale: दुर्लभ शब्द का सम्बन्ध सम्भवतः सफेदी अथवा सफेद/विरंजित वस्त्र से है; 'उजला कपड़ा' अनिश्चितता को बनाए रखते हुए अर्थ स्पष्ट करता है और अनावश्यक रूप से सामग्री को लिनन नहीं ठहराता।
