source:
  edition: WLC
  text: וְ/נָבְקָ֤ה רֽוּחַ מִצְרַ֨יִם֙ בְּ/קִרְבּ֔/וֹ וַ/עֲצָת֖/וֹ אֲבַלֵּ֑עַ וְ/דָרְשׁ֤וּ אֶל הָֽ/אֱלִילִים֙ וְ/אֶל הָ֣/אִטִּ֔ים וְ/אֶל הָ/אֹב֖וֹת וְ/אֶל הַ/יִּדְּעֹנִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/003.yaml
  text: And the spirit of Egypt will be emptied out within it[a], and I will swallow up its counsel; and they will seek the idols, the mutterers, the mediums, and the spiritists.
translation:
  language: hi
  text: और मिस्र की आत्मा उसके भीतर खाली हो जाएगी, और मैं उसकी सलाह को निगल जाऊँगा; तब वे मूर्तियों, बुदबुदाने वालों[a], माध्यमों और भूत-विद्या जानने वालों से परामर्श लेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस दुर्लभ इब्रानी शब्द का अर्थ अनिश्चित है; संभवतः “प्रेत” या “मंत्र फूँकने वाले”।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבְקָה
  choice: खाली हो जाएगी
  rationale: निफ़ाल रूप भीतर से खाली या चुक जाने का बिंब देता है; यह केवल ‘हिम्मत टूटना’ कहने की अपेक्षा मूल रूपक को बनाए रखता है।
- source_word: רוּחַ מִצְרַיִם
  choice: मिस्र की आत्मा
  rationale: यह मिस्र की आंतरिक जीवन-शक्ति, मनोबल और सामूहिक भाव-दशा को व्यापक रूप से व्यक्त करता है; केवल ‘साहस’ कहना अर्थ को संकरा कर देता।
- source_word: בְּקִרְבּוֹ
  choice: उसके भीतर
  rationale: पुल्लिंग एकवचन प्रत्यय सामूहिक राष्ट्र ‘मिस्र’ की ओर लौटता है; हिन्दी में ‘उसके भीतर’ स्वाभाविक है।
- source_word: עֲצָתוֹ
  choice: उसकी सलाह
  rationale: עֵצָה सलाह, मंत्रणा या योजना हो सकती है। ‘सलाह’ विचार-विमर्श का भाव बचाती है और अनावश्यक रूप से इसे सैन्य रणनीति तक सीमित नहीं करती।
- source_word: אֲבַלֵּעַ
  choice: मैं ... निगल जाऊँगा
  rationale: मूल क्रिया के ठोस ‘निगलने’ के रूपक को रखा गया है; आशय मिस्र की मंत्रणा को निष्फल कर देना है।
- source_word: וְדָרְשׁוּ אֶל
  choice: वे ... से पूछताछ करेंगे
  rationale: इस भविष्यवाणी-संबंधी संदर्भ में דרשׁ אֶל का अर्थ सहायता या उत्तर पाने के लिए किसी से पूछना/परामर्श लेना है। ‘पूछताछ करेंगे’ इसके उद्देश्य को स्पष्ट करता है।
- source_word: הָאֱלִילִים
  choice: मूर्तियों
  rationale: यह अवमाननापूर्ण इब्रानी शब्द झूठे अथवा निष्फल देव-प्रतिरूपों को सूचित करता है; ‘मूर्तियाँ’ स्पष्ट और प्रचलित हिन्दी है।
- source_word: הָאִטִּים
  choice: बुदबुदाने वालों
  rationale: यह अत्यंत दुर्लभ और अनिश्चित शब्द है। सम्भावित ध्वन्यात्मक अर्थ के आधार पर ‘बुदबुदाने वाले’ चुना गया है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: הָאֹבוֹת
  choice: प्रेत-साधकों
  rationale: אוֹבוֹת मृतात्माओं अथवा उन्हें बुलाने वाले माध्यमों को सूचित कर सकता है। सूची में व्यक्तियों से पूछताछ के समानांतर ‘प्रेत-साधक’ स्वाभाविक है और मृतात्माओं से संपर्क का भाव बताता है।
- source_word: הַיִּדְּעֹנִים
  choice: तांत्रिकों
  rationale: यह निषिद्ध गुप्त आत्मिक ज्ञान से जुड़े साधकों का पद है। आधुनिक हिन्दी में ‘तांत्रिक’ ऐसा समझने योग्य निकटतम शब्द है, यद्यपि पूर्ण समानार्थी नहीं।
theological_decisions:
- issue: गूढ़ साधना से जुड़े पदों को न नरम करना और न उन पर बाद की धर्मवैज्ञानिक श्रेणियाँ थोपना
  choice: मूर्तियाँ, बुदबुदाने वाले, प्रेत-साधक और तांत्रिक
  alternative: मूर्तियाँ, प्रेत, ओझे और भविष्य बताने वाले
  rationale: चुनी हुई शब्दावली संकट में मिस्र द्वारा निषिद्ध आध्यात्मिक साधनों की ओर मुड़ने का भविष्यद्वक्तापूर्ण आरोप बनाए रखती है, पर दुर्लभ הָאִטִּים को निश्चित रूप से ‘प्रेत’ नहीं मानती।
- issue: מִצְרַיִם के व्याकरणिक संदर्भ को हिन्दी में व्यक्त करना
  choice: मिस्र की आत्मा उसके भीतर
  alternative: मिस्र का मनोबल उसके भीतर
  rationale: ‘आत्मा’ मूल की अर्थगत व्यापकता और रूपक को बनाए रखती है; यहाँ इससे मनुष्य की आत्मा पर कोई विशिष्ट सिद्धान्त स्थापित नहीं किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर वाक्य-विन्यास और ‘निगल जाऊँगा’ का ठोस भविष्यद्वक्तापूर्ण बिंब सुरक्षित है। गूढ़-साधना के तकनीकी पदों में हिन्दी के सांस्कृतिक अर्थ-भार को देखते हुए निकटतम सहज शब्द चुने गए हैं और मुख्य अनिश्चितता पाद-टिप्पणी में स्पष्ट की गई है।
