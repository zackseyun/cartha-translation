reference: Isaiah 19:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֔וּא יִֽהְיֶ֥ה מִצְרַ֖יִם כַּ/נָּשִׁ֑ים וְ/חָרַ֣ד וּ/פָחַ֗ד מִ/פְּנֵי֙ תְּנוּפַת֙ יַד יְהוָ֣ה צְבָא֔וֹת אֲשֶׁר ה֖וּא מֵנִ֥יף עָלָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/016.yaml
  text: In that day Egypt will be like women[a], trembling and afraid because of the waving of the hand of Yahweh of Armies[c][b], which he waves against it.
translation:
  language: hi
  text: उस दिन मिस्र स्त्रियों के समान[a] हो जाएगा; सेनाओं के याहवे[b] के हाथ के उस लहराने[c] से, जिसे वह उसके विरुद्ध लहरा रहा है, वह काँपेगा और भयभीत होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘स्त्रियों के समान’ प्राचीन युद्धकालीन चित्रण है, जिसमें असुरक्षा और भय की तत्कालीन सांस्कृतिक धारणा झलकती है; इब्रानी पाठ में स्पष्ट रूप से ‘स्त्रियाँ’ ही है।
    reason: cultural_note
  - marker: b
    text: या, “सेनाओं का यहोवा”; पारंपरिक रूप से, “सेनाओं का प्रभु।”
    reason: lexical_alternative
  - marker: c
    text: या, “हाथ को धमकी भरे ढंग से घुमाने।” अंतिम वाक्यांश का अनुवाद “जिसे वह उसके ऊपर लहरा रहा है” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यवाणी में प्रयुक्त मानक काल-सूचक सूत्र है; संक्षिप्त और स्वाभाविक हिन्दी में उसकी गंभीर लय बनी रहती है।
- source_word: מִצְרַיִם
  choice: मिस्र
  rationale: यहाँ देश को एक इकाई के रूप में मानवीकृत किया गया है; इसलिए आगे एकवचन ‘वह’ रखा गया है।
- source_word: כַּנָּשִׁים
  choice: स्त्रियों के समान
  rationale: इब्रानी में स्पष्ट रूप से ‘स्त्रियाँ’ है। प्राचीन युद्धकालीन उपमा को तटस्थ बनाकर उसकी ऐतिहासिक असहजता मिटाई नहीं गई।
- source_word: וְחָרַד וּפָחַד
  choice: काँपेगा और डर जाएगा
  rationale: दोनों क्रियाएँ भय की तीव्रता व्यक्त करती हैं; हिन्दी में दोनों को अलग-अलग रखकर दोहरे बल को सुरक्षित किया गया है।
- source_word: מִפְּנֵי
  choice: के कारण
  rationale: इस प्रसंग में यह पूर्वसर्ग मिस्र के काँपने और डरने का कारण बताता है।
- source_word: תְּנוּפַת יַד
  choice: हाथ लहराने
  rationale: नוף से बना संज्ञा-रूप हाथ को लहराने अथवा धमकी भरे ढंग से घुमाने का ठोस चित्र देता है; आगे उसी धातु की पुनरावृत्ति भी रखी गई है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: יהוה को व्यक्तिवाचक वाचा-नाम ‘याहवे’ और צבאות को उसके स्पष्ट सैन्य अर्थ ‘सेनाओं’ से अनूदित किया गया है।
- source_word: אֲשֶׁר הוּא מֵנִיף עָלָיו
  choice: जिसे वह उसके विरुद्ध लहरा रहा है
  rationale: सम्बन्धवाचक उपवाक्य हाथ की गति को दोहराता है। न्याय के शत्रुतापूर्ण प्रसंग में עָלָיו का अर्थ ‘उसके विरुद्ध’ लिया गया है, जबकि ‘उसके ऊपर’ सम्भव विकल्प है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: צבאות की उपाधि
  choice: सेनाओं के
  alternative: गणों के; मेज़बानों के
  rationale: न्याय और भय के इस प्रसंग में ‘सेनाएँ’ उपाधि के सैन्य बल को आधुनिक पाठक के लिए स्पष्ट करती हैं।
- issue: ‘स्त्रियों के समान’ उपमा
  choice: मुख्य पाठ में ज्यों की त्यों सुरक्षित
  alternative: ‘निर्बलों के समान’ कहकर तटस्थ बनाना
  rationale: लिंग-सूचक प्राचीन उपमा मूल पाठ का वास्तविक हिस्सा है। उसे बदलने के बजाय सांस्कृतिक पृष्ठभूमि पादटिप्पणी में स्पष्ट की गई है।
- issue: עָלָיו की दिशात्मकता
  choice: उसके विरुद्ध
  alternative: उसके ऊपर
  rationale: दण्ड के प्रसंग में विरोधी दिशा प्रमुख प्रतीत होती है, पर स्थानगत ‘ऊपर’ की सम्भावना को स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गंभीर और भविष्यवाणीय स्वर रखा गया है। ‘स्त्रियों के समान’ की असहज प्राचीन उपमा को मुख्य पाठ में नहीं दबाया गया, और ‘हाथ लहराने’ की पुनरुक्त ठोस छवि सुरक्षित रखी गई है।
