language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/סִכַּרְתִּי֙ אֶת מִצְרַ֔יִם בְּ/יַ֖ד אֲדֹנִ֣ים קָשֶׁ֑ה וּ/מֶ֤לֶךְ עַז֙ יִמְשָׁל בָּ֔/ם נְאֻ֥ם הָ/אָד֖וֹן יְהוָ֥ה צְבָאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/004.yaml
  text: I will give Egypt into the hand of a harsh master[a], and a fierce king will rule over them, declares the Lord[c][b], Yahweh of Armies.
translation:
  language: hi
  text: “मैं मिस्र को एक कठोर स्वामी[b] के हाथ में सौंप दूँगा[a], और एक प्रचण्ड राजा उन पर शासन करेगा”—यह प्रभु, सेनाओं के याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं मिस्र को एक कठोर स्वामी के अधिकार में कर दूँगा।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘स्वामी’ शब्द रूप की दृष्टि से बहुवचन (‘स्वामियों’) है, पर सम्भवतः यहाँ महिमा या तीव्रता बताने वाला एकवचन है; इसके बाद ‘राजा’ और उसकी क्रिया एकवचन में हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסִכַּרְתִּי
  choice: सौंप दूँगा
  rationale: यह क्रिया मिस्र को किसी दूसरे के अधिकार में दे देने का भाव रखती है। ‘सौंप दूँगा’ आधुनिक हिन्दी में स्वाभाविक है और इस भाव को स्पष्ट रखता है।
- source_word: בְּיַד
  choice: के हाथ में
  rationale: मूल इब्रानी मुहावरे का चित्र बनाए रखते हुए यह किसी के अधिकार या वश में दिए जाने का अर्थ सहज रूप से व्यक्त करता है।
- source_word: אֲדֹנִים קָשֶׁה
  choice: एक कठोर स्वामी
  rationale: אֲדֹנִים रूप की दृष्टि से बहुवचन है, पर प्रसंग में अगले एकवचन ‘राजा’ और एकवचन क्रिया के कारण सम्भवतः एक ही कठोर शासक के लिए तीव्रता अथवा महिमा-सूचक बहुवचन है। ‘स्वामी’ मानव शासक को ईश्वरीय उपाधि ‘प्रभु’ से अलग रखता है।
- source_word: וּמֶלֶךְ עַז
  choice: और एक प्रचण्ड राजा
  rationale: עַז सामर्थ्य और उग्रता दोनों व्यक्त कर सकता है। न्याय और दमन के इस प्रसंग में ‘प्रचण्ड’ उसकी कठोर, भयावह सत्ता को व्यक्त करता है।
- source_word: יִמְשָׁל בָּם
  choice: उन पर शासन करेगा
  rationale: यह מָשַׁל के साथ בְ का सीधा और स्वाभाविक राजनीतिक अर्थ है।
- source_word: נְאֻם
  choice: घोषणा
  rationale: भविष्यद्वाणी के इस प्रामाणिक वाणी-सूत्र को ‘घोषणा’ गरिमापूर्ण और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הָאָדוֹן
  choice: प्रभु
  rationale: निश्चित उपपद के साथ यह ईश्वर की उपाधि है और आगे आने वाले व्यक्तिगत नाम याहवे से अलग बनी रहती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह चार अक्षरों वाले इब्रानी ईश्वरीय नाम का लिप्यंतरण है; इसे केवल किसी उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में रखा गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं के
  rationale: यह शब्द सैन्य समूहों या सेनाओं को दर्शाता है। ‘सेनाओं’ आधुनिक पाठक के लिए पारंपरिक किंतु अस्पष्ट ‘गणों’ की अपेक्षा अधिक पारदर्शी है।
theological_decisions:
- issue: הָאָדוֹן יְהוָה צְבָאוֹת उपाधि-क्रम का अनुवाद
  choice: प्रभु, सेनाओं के याहवे
  alternative: प्रभु परमेश्वर, सेनाओं का प्रभु
  rationale: मूल पाठ में הָאָדוֹן एक उपाधि और יְהוָה व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठ दोनों को अलग रखता है और צְבָאוֹת को पारदर्शी ढंग से ‘सेनाओं’ कहता है।
- issue: אֲדֹנִים के रूपगत बहुवचन का अर्थ
  choice: एक कठोर स्वामी
  alternative: कठोर स्वामियों
  rationale: रूपगत बहुवचन को स्वीकार करते हुए भी निकटवर्ती एकवचन ‘राजा’ और एकवचन क्रिया एक शासक की ओर संकेत करते हैं। अनिश्चितता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘हाथ में’ मूल रूपक को बचाता है; ‘सौंप दूँगा’ उसका आशय स्पष्ट करता है। मानव शासक के लिए ‘स्वामी’ और ईश्वर के लिए ‘प्रभु’ रखकर दोनों को अलग किया गया है।
