source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֡וּא יִהְיוּ֩ חָמֵ֨שׁ עָרִ֜ים בְּ/אֶ֣רֶץ מִצְרַ֗יִם מְדַבְּרוֹת֙ שְׂפַ֣ת כְּנַ֔עַן וְ/נִשְׁבָּע֖וֹת לַ/יהוָ֣ה צְבָא֑וֹת עִ֣יר הַ/הֶ֔רֶס יֵאָמֵ֖ר לְ/אֶחָֽת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/018.yaml
  text: In that day there will be five cities in the land of Egypt speaking the language of Canaan and swearing allegiance to the LORD of Armies. One of them will be called the City of Destruction.
translation:
  language: hi
  text: उस दिन मिस्र देश में पाँच नगर होंगे जो कनान की भाषा बोलेंगे और सेनाओं के यहोवा के प्रति निष्ठा की शपथ खाएँगे। उनमें से एक “विनाश का नगर”[a] कहलाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ इब्रानी पांडुलिपियों और प्राचीन अनुवादों में “सूर्य का नगर” है।
    reason: यह הַהֶרֶס (‘विनाश’) और הַחֶרֶס (‘सूर्य’) के बीच प्राचीन और अर्थपूर्ण पाठांतर को दर्ज करता है।
lexical_decisions:
- source_word: שְׂפַת כְּנַעַן
  choice: कनान की भाषा
  rationale: शाब्दिक रूप से ‘कनान का होंठ’; यहाँ ‘होंठ’ भाषा का मुहावरा है, इसलिए स्वाभाविक हिन्दी में ‘भाषा’ रखा गया।
- source_word: וְנִשְׁבָּעוֹת לַיהוָה
  choice: सेनाओं के यहोवा के प्रति शपथ खाएँगे
  rationale: לַיהוָה में निष्ठा की दिशा का भाव है। ‘के प्रति शपथ’ मूल अर्थ को बनाए रखता है, जबकि शपथ की ठीक प्रकृति को आवश्यकता से अधिक स्पष्ट नहीं करता।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: ईश्वरीय नाम और צְבָאוֹת के बहुवचन ‘सेनाओं’—दोनों को स्पष्ट तथा पारंपरिक हिन्दी रूप में रखा गया।
- source_word: עִיר הַהֶרֶס
  choice: विनाश का नगर
  rationale: WLC के स्वरांकित मसोरेटिक पाठ הֶרֶס का सीधा अर्थ ‘विनाश’ है; वैकल्पिक पाठ को पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: यहोवा के प्रति खाई जाने वाली शपथ का आशय
  choice: ‘के प्रति शपथ खाएँगे’
  alternative: ‘के नाम की शपथ खाएँगे’ या ‘निष्ठा की शपथ खाएँगे’
  rationale: मूल में לַיהוָה है। चुना गया रूप मिस्री नगरों की यहोवा की ओर प्रतिबद्धता को व्यक्त करता है, पर शपथ को केवल नाम लेकर शपथ खाने या औपचारिक राजनिष्ठा तक सीमित नहीं करता।
- issue: नगर के नाम का पाठांतर
  choice: मुख्य पाठ में ‘विनाश का नगर’
  alternative: ‘सूर्य का नगर’
  rationale: दिए गए WLC पाठ में הַהֶרֶס है, इसलिए वही मुख्य पाठ का आधार है। महत्वपूर्ण प्राचीन पाठांतर पाठक के लिए पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। भविष्यसूचक ‘उस दिन’ और नगरों के स्त्रीलिंग इब्रानी क्रियारूप को स्वाभाविक हिन्दी वाक्य-विन्यास में व्यक्त किया गया है।
