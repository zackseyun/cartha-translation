  edition: WLC
  text: וְ/נָגַ֧ף יְהוָ֛ה אֶת מִצְרַ֖יִם נָגֹ֣ף וְ/רָפ֑וֹא וְ/שָׁ֨בוּ֙ עַד יְהוָ֔ה וְ/נֶעְתַּ֥ר לָ/הֶ֖ם וּ/רְפָאָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/022.yaml
  text: And Yahweh will strike Egypt[a], striking and healing; and they will return to Yahweh[b], and he will respond to their pleas and heal them.
translation:
  language: hi
  text: याहवे मिस्र पर प्रहार करेगा—वह प्रहार करेगा और चंगा भी करेगा। वे याहवे की ओर लौटेंगे[a]; वह उनकी विनती स्वीकार करेगा[b] और उन्हें चंगा करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘याहवे की ओर मुड़ेंगे।’ इब्रानी क्रिया का अर्थ मुड़ना या लौटना हो सकता है; भविष्यद्वक्ताओं के प्रसंगों में इसमें प्रायः पश्चात्ताप का भाव भी होता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘वह उनकी प्रार्थना सुनेगा।’ इब्रानी अभिव्यक्ति का भाव है कि याहवे उनकी विनती का अनुकूल उत्तर देगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָגַף
  choice: प्रहार करेगा
  rationale: נגף यहाँ दंड देने वाले आघात को व्यक्त करता है। ‘प्रहार करेगा’ आधुनिक और गरिमापूर्ण है तथा रोग, विपत्ति या अन्य प्रकार के दैवी दंड तक अर्थ को सीमित नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה का हिन्दी लिप्यंतरण किया गया है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: מִצְרַיִם
  choice: मिस्र
  rationale: देश और जनसमुदाय दोनों के लिए प्रचलित हिन्दी नाम; अगले बहुवचन ‘वे’ से यहाँ मिस्र के लोगों का भाव स्वाभाविक रूप से स्पष्ट होता है।
- source_word: נָגֹף וְרָפוֹא
  choice: वह प्रहार करेगा और चंगा भी करेगा
  rationale: दोनों क्रियाओं की सघन, संतुलित समानता बनाए रखी गई है। ‘भी’ न्याय और पुनर्स्थापना के आश्चर्यजनक मेल को उभारता है, पर उनके क्रम या ढंग को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: וְשָׁבוּ עַד יְהוָה
  choice: तब वे याहवे की ओर लौटेंगे
  rationale: שוב का मूल लौटने/मुड़ने का भाव और भविष्यद्वक्ताओं के प्रसंग में निहित पश्चात्ताप का संकेत दोनों सुरक्षित हैं। ‘की ओर’ עַד द्वारा व्यक्त दिशा को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: וְנֶעְתַּר לָהֶם
  choice: वह उनकी विनती स्वीकार करेगा
  rationale: עתר के निफ़अल रूप का अर्थ उनकी प्रार्थना से अनुकूल होकर उसका उत्तर देना है। ‘विनती स्वीकार करेगा’ आधुनिक हिन्दी में इस अनुकूल प्रत्युत्तर को स्पष्ट करता है।
- source_word: וּרְפָאָם
  choice: और उन्हें चंगा करेगा
  rationale: רפא का सीधा अर्थ ‘चंगा करना’ है। यही शब्दावली पहले आए चंगा करने के उल्लेख से संबंध बनाए रखती है और शारीरिक, राष्ट्रीय तथा आत्मिक पुनर्स्थापना की व्यापकता खुली रखती है।
theological_decisions:
- issue: दैवी न्याय और पुनर्स्थापना का संबंध
  choice: प्रहार और चंगा करना दोनों याहवे के कार्य के रूप में रखे गए हैं।
  alternative: चंगा करने को केवल राजनीतिक सुधार या प्रहार के बाद की स्वाभाविक बहाली मानना।
  rationale: इब्रानी पाठ दोनों क्रियाएँ याहवे को सौंपता है और चंगाई को लोगों के उसकी ओर लौटने तथा उसकी अनुकूल प्रतिक्रिया से जोड़ता है। अनुवाद इस तनाव को बिना घटाए बनाए रखता है।
- issue: שוב में पश्चात्ताप का संकेत
  choice: याहवे की ओर लौटेंगे
  alternative: याहवे की ओर मुड़ेंगे
  rationale: ‘लौटेंगे’ भविष्यद्वक्ताओं की भाषा में संबंध की बहाली और पश्चात्ताप का संकेत सुरक्षित रखता है, पर किसी पूर्ण विकसित मत-सूत्र को पाठ में नहीं जोड़ता।
- issue: עתר के निफ़अल में परमेश्वर की अनुकूल प्रतिक्रिया
  choice: वह उनकी विनती स्वीकार करेगा
  alternative: वह उनकी विनती सुनेगा / वह उनसे विनती किया जाने देगा
  rationale: यह रूप केवल ध्वनि सुनने के बजाय विनती पर अनुकूल प्रतिक्रिया देने का भाव रखता है। चुना हुआ पाठ उसी संबंधपरक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली रखी गई है। ‘चंगा करना’ की पुनरावृत्ति मूल इब्रानी की शब्द-संगति बनाए रखती है। पहले वाक्य की पुनरावृत्त संरचना נָגֹף וְרָפוֹא के बल और न्याय–चंगाई के संतुलन को दर्शाती है। सभी पाद-टिप्पणी चिह्न संबंधित पदांशों पर लगाए गए हैं।
