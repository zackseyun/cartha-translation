source:
  edition: WLC
  text: אַךְ אֱוִלִים֙ שָׂ֣רֵי צֹ֔עַן חַכְמֵי֙ יֹעֲצֵ֣י פַרְעֹ֔ה עֵצָ֖ה נִבְעָרָ֑ה אֵ֚יךְ תֹּאמְר֣וּ אֶל פַּרְעֹ֔ה בֶּן חֲכָמִ֥ים אֲנִ֖י בֶּן מַלְכֵי קֶֽדֶם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/011.yaml
  text: Surely the princes of Zoan are fools[a]; the wise counselors of Pharaoh give foolish counsel. How can you say to Pharaoh, “I am a son of wise men[b], a son of ancient kings”?
translation:
  language: hi
  text: निश्चय ही सोअन के हाकिम मूर्ख हैं; फ़िरौन के बुद्धिमान सलाहकारों की सलाह मूर्खतापूर्ण है।[a] तुम लोग फ़िरौन से यह कैसे कह सकते हो, “मैं बुद्धिमानों का पुत्र हूँ,[b] प्राचीन राजाओं का पुत्र हूँ”?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बेसमझी की सलाह देते हैं।” इब्रानी में शाब्दिक भाव है, “सलाह मूर्खतापूर्ण या बेसमझ है।”
    reason: lexical_alternative
  - marker: b
    text: “बुद्धिमानों का पुत्र” और “प्राचीन राजाओं का पुत्र” वंश या कुल-परंपरा के मुहावरे हैं; इनका अर्थ अनिवार्य रूप से सगा पुत्र होना नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ यह अव्यय प्रतिबंध नहीं, बल्कि कथन पर जोर देता है।
- source_word: שָׂרֵי צֹעַן
  choice: सोअन के हाकिम
  rationale: שָׂרִים शासकों, राजकीय अधिकारियों या सरदारों को सूचित कर सकता है; मिस्री दरबार के संदर्भ में ‘हाकिम’ स्वाभाविक और व्यापक है। צֹעַן को स्थान-नाम ‘सोअन’ के रूप में लिप्यंतरित किया गया है।
- source_word: אֱוִלִים
  choice: मूर्ख
  rationale: यह सोअन के हाकिमों पर तीखा मूल्यांकन है; ‘मूर्ख’ उसकी स्पष्ट निंदात्मक शक्ति बनाए रखता है।
- source_word: חַכְמֵי יֹעֲצֵי פַרְעֹה
  choice: फ़िरौन के बुद्धिमान सलाहकार
  rationale: वाक्यांश उन सलाहकारों को बुद्धिमान माने जानेवाले लोगों के रूप में प्रस्तुत करता है; आगे उनकी सलाह को मूर्खता कहना जानबूझकर व्यंग्यात्मक विरोध पैदा करता है।
- source_word: עֵצָה נִבְעָרָה
  choice: सलाह निपट मूर्खता है
  rationale: इब्रानी पदबंध संक्षिप्त है और सलाह को जड़-बुद्धि अथवा मूर्ख बताता है। यह हिंदी रूप उसकी तीव्र निंदा और संक्षिप्तता दोनों को बनाए रखता है।
- source_word: אֵיךְ תֹּאמְרוּ אֶל־פַּרְעֹה
  choice: तुम लोग फ़िरौन से यह कैसे कह सकते हो
  rationale: बहुवचन क्रिया सलाहकारों को संबोधित करती है, और प्रश्न अविश्वास तथा चुनौती व्यक्त करता है।
- source_word: בֶּן חֲכָמִים אֲנִי
  choice: मैं बुद्धिमानों का पुत्र हूँ
  rationale: ‘पुत्र’ मूल वंशगत मुहावरे को सुरक्षित रखता है और वक्ताओं के ज्ञान-परंपरा संबंधी घमंड को सीधे व्यक्त करता है।
- source_word: בֶּן מַלְכֵי קֶדֶם
  choice: प्राचीन काल के राजाओं का पुत्र हूँ
  rationale: קֶדֶם यहाँ पूर्व दिशा नहीं, पुराने समय को सूचित करता है; यह रूप प्राचीन राजवंश से जुड़े होने के दावे को बनाए रखता है।
