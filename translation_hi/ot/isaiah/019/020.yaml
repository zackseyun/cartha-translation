  text: וְ/הָיָ֨ה לְ/א֥וֹת וּ/לְ/עֵ֛ד לַֽ/יהוָ֥ה צְבָא֖וֹת בְּ/אֶ֣רֶץ מִצְרָ֑יִם כִּֽי יִצְעֲק֤וּ אֶל יְהוָה֙ מִ/פְּנֵ֣י לֹֽחֲצִ֔ים וְ/יִשְׁלַ֥ח לָ/הֶ֛ם מוֹשִׁ֥יעַ וָ/רָ֖ב וְ/הִצִּילָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/020.yaml
  text: It will be for a sign and for a witness to Yahweh of Armies in the land of Egypt. For they will cry out to Yahweh because of oppressors[a], and he will send them a savior and champion, and he will deliver them.
translation:
  language: hi
  text: वह मिस्र देश में सेनाओं के याहवे के लिए एक चिन्ह और साक्षी होगा। क्योंकि वे अत्याचारियों के कारण याहवे की दुहाई देंगे, और वह उनके लिए एक उद्धारकर्ता और रक्षक[a] भेजेगा, और वह उन्हें छुड़ाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक उद्धारकर्ता और एक वीर”; इब्रानी अभिव्यक्ति कठिन है। दूसरे शब्द का अधिक शाब्दिक अर्थ “एक महान जन” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: वह ... होगा
  rationale: पिछले प्रसंग में वर्णित वेदी अथवा स्तंभ की ओर संकेत करते हुए भविष्य का परिणाम व्यक्त करता है।
- source_word: לְאוֹת וּלְעֵד
  choice: एक चिन्ह और साक्षी
  rationale: אוֹת को सामान्य अर्थ में ‘चिन्ह’ और עֵד को उसके प्रत्यक्ष, वैधानिक भाव सहित ‘साक्षी’ रखा गया है।
- source_word: לַיהוָה צְבָאוֹת
  choice: सेनाओं के याहवे के लिए
  rationale: यहोवा के निजी नाम को ‘याहवे’ और צְבָאוֹת को पारदर्शी रूप से ‘सेनाओं’ अनूदित किया गया है।
- source_word: יִצְעֲקוּ אֶל־יְהוָה
  choice: याहवे की दुहाई देंगे
  rationale: संकट में सहायता के लिए पुकारने का भाव ‘दुहाई देना’ स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: מִפְּנֵי לֹחֲצִים
  choice: अत्याचारियों के कारण
  rationale: מִפְּנֵי यहाँ कारण या दबाव की परिस्थिति बताता है और participle לֹחֲצִים उन लोगों को दर्शाता है जो अत्याचार करते हैं।
- source_word: מוֹשִׁיעַ וָרָב
  choice: एक उद्धारकर्ता और रक्षक
  rationale: מוֹשִׁיעַ उद्धार करने वाले को बताता है। कठिन वाक्यांश וָרָב को प्रसंगानुसार पीड़ितों की ओर से खड़े होने वाले ‘रक्षक’ के रूप में रखा गया है, जबकि अधिक शाब्दिक विकल्प पाद-टिप्पणी में सुरक्षित है।
- source_word: וְהִצִּילָם
  choice: जो उन्हें छुड़ाएगा
  rationale: नצל के हिफ़ील रूप का बचाने या संकट से निकालने का भाव ‘छुड़ाएगा’ से स्पष्ट होता है; संबंधवाचक रचना आधुनिक हिन्दी में वाक्य को सहज बनाती है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का निजी नाम स्पष्ट रूप से आया है; उसे उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- issue: צְבָאוֹת का अर्थ
  choice: सेनाओं के
  alternative: गणों के
  rationale: ‘सेनाओं’ मूल संज्ञा के सैन्य और सार्वभौम अधिकार के भाव को आधुनिक पाठक के लिए अधिक स्पष्ट रखता है।
- issue: מוֹשִׁיעַ וָרָב की कठिन अभिव्यक्ति
  choice: उद्धारकर्ता और रक्षक
  alternative: उद्धारकर्ता और महान जन
  rationale: दूसरे पद का सटीक आशय विवादित है। मुख्य पाठ में प्रसंगसंगत रक्षक का भाव रखा गया है, पर अधिक शाब्दिक संभावना को पाद-टिप्पणी में दिया गया है ताकि अस्पष्टता मिटाई न जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘दुहाई देंगे’ संकटपूर्ण पुकार की तीव्रता व्यक्त करता है, जबकि ‘चिन्ह और साक्षी’ मूल की दोहरी संज्ञा-रचना को बनाए रखता है।
