source:
  edition: WLC
  text: אַיָּ/ם֙ אֵפ֣וֹא חֲכָמֶ֔י/ךָ וְ/יַגִּ֥ידוּ נָ֖א לָ֑/ךְ וְ/יֵ֣דְע֔וּ מַה יָּעַ֛ץ יְהוָ֥ה צְבָא֖וֹת עַל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/012.yaml
  text: Where[a], then, are your wise men? Let them tell you, please; let them know what Yahweh of Armies has purposed against Egypt.
translation:
  language: hi
  text: तो तुम्हारे बुद्धिमान लोग कहाँ हैं? वे तुम्हें बता दें और जान लें कि सेनाओं का याहवे ने मिस्र के विरुद्ध क्या योजना बनाई है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַיָּם אֵפוֹא
  choice: तो ... कहाँ हैं?
  rationale: स्थानवाचक प्रश्न और बलसूचक/निष्कर्षसूचक अव्यय को स्वाभाविक हिन्दी के आलंकारिक प्रश्न में रखा गया है।
- source_word: חֲכָמֶיךָ
  choice: तुम्हारे बुद्धिमान
  rationale: यह मिस्र के ज्ञानी सलाहकारों की ओर संकेत करता है; अनुवाद उनकी भूमिका को अनावश्यक रूप से जादूगरों या पुरोहितों तक सीमित नहीं करता।
- source_word: וְיַגִּידוּ נָא
  choice: वे तुम्हें ज़रा बताएँ
  rationale: क्रिया के चुनौतीसूचक भाव और נָא के आग्रह—जो यहाँ व्यंग्यात्मक चुनौती को तीखा करता है—को आधुनिक हिन्दी में ‘ज़रा’ से व्यक्त किया गया है।
- source_word: וְיֵדְעוּ
  choice: और जानें
  rationale: ידע के मूल अर्थ ‘जानना’ और इच्छार्थक/चुनौतीसूचक क्रियाभाव को बनाए रखा गया है; इसे अधिक व्याख्यात्मक ‘समझ लें’ नहीं बनाया गया।
- source_word: מַה יָּעַץ
  choice: क्या योजना बनाई है
  rationale: יעץ यहाँ सोच-विचार कर उद्देश्य या योजना ठहराने का भाव देता है; पूर्ण क्रिया को हिन्दी के पूर्ण पक्ष में व्यक्त किया गया है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: व्यक्तिगत नाम יְהוָה को ‘याहवे’ के रूप में रखा गया और צְבָאוֹת के सैन्य अर्थ को पारदर्शी आधुनिक शब्द ‘सेनाओं’ से व्यक्त किया गया।
- source_word: עַל מִצְרָיִם
  choice: मिस्र के विरुद्ध
  rationale: यद्यपि עַל का अर्थ ‘के विषय में’ भी हो सकता है, न्याय की इस प्रसंगभूमि में योजना का विरोधात्मक लक्ष्य अधिक संभावित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में आया व्यक्तिगत वाचा-नाम शीर्षक से प्रतिस्थापित न होकर लिप्यंतरित किया गया है।
- issue: יְהוָה צְבָאוֹת पदवी का रूप
  choice: सेनाओं के याहवे
  alternative: सेनाओं के प्रभु
  rationale: ‘सेनाएँ’ צְבָאוֹת का सैन्य/स्वर्गीय सामर्थ्य-संबंधी अर्थ स्पष्ट रखता है, जबकि ‘याहवे’ मूल ईश्वरीय नाम को सुरक्षित रखता है।
- issue: עַל का संबंध
  choice: मिस्र के विरुद्ध
  alternative: मिस्र के विषय में
  rationale: दोनों अर्थ व्याकरणतः संभव हैं, पर अध्याय में मिस्र पर आनेवाले न्याय के कारण विरोधात्मक अर्थ चुना गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सीधी भविष्यद्वक्ताई चुनौती। ‘ज़रा बताएँ’ व्यंग्यात्मक आग्रह को स्वाभाविक बनाता है; वाक्य की समानांतर आज्ञार्थक संरचना यथासंभव सुरक्षित रखी गई है।
