source:
  edition: WLC
  text: הֵ֧ן כֻּלְּ/כֶ֛ם קֹ֥דְחֵי אֵ֖שׁ מְאַזְּרֵ֣י זִיק֑וֹת לְכ֣וּ בְּ/א֣וּר אֶשְׁ/כֶ֗ם וּ/בְ/זִיקוֹת֙ בִּֽעַרְתֶּ֔ם מִ/יָּדִ/י֙ הָיְתָה זֹּ֣את לָ/כֶ֔ם לְ/מַעֲצֵבָ֖ה תִּשְׁכָּבֽוּ/ן׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/011.yaml
  text: 'Look[a], all of you who kindle a fire, who gird yourselves with burning arrows: walk in the light of your fire and among the arrows you have set ablaze[b]. This has come to you from my hand: you will lie down in torment.'
translation:
  language: hi
  text: 'देखो, तुम सब जो आग जलाते हो, जो जलते हुए बाणों[a] से अपने को लैस करते हो—अपनी आग की रोशनी में और उन बाणों के बीच चलो जिन्हें तुमने जलाया है। यह तुम्हारे लिए मेरे हाथ से आया है: तुम पीड़ा[b] में लेटोगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चिनगारियों”; सम्भवतः “जलती मशालों” या “अग्निदंडों”।
    reason: זִיקוֹת का अर्थ अनिश्चित है; यह चिनगारियों, जलती हुई वस्तुओं, या सम्भवतः जलते हुए प्रक्षेपास्त्रों का संकेत कर सकता है।
  - marker: b
    text: या “संताप” अथवा “यातना”।
    reason: מַעֲצֵבָה में पीड़ा, संताप और व्याकुलता का अर्थ-क्षेत्र सम्मिलित है।
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह विस्मयादिबोधक सामने रखी जा रही गंभीर घोषणा की ओर ध्यान खींचता है; ‘देखो’ आधुनिक हिन्दी में उसका स्वाभाविक और प्रभावशाली रूप है।
- source_word: קֹדְחֵי אֵשׁ
  choice: जो आग सुलगाते हो
  rationale: קדח का कृदन्त यहाँ सक्रिय अर्थ में आग जलाने या सुलगाने को व्यक्त करता है।
- source_word: מְאַזְּרֵי זִיקוֹת
  choice: जो धधकते अग्निबाणों से अपने को लैस करते हो
  rationale: מְאַזְּרֵי का मूल बिंब कमर बाँधने या सुसज्जित होने का है। זִיקוֹת का अर्थ अनिश्चित है; प्रसंग में हथियार-जैसा अर्थ सम्भव होने के कारण ‘धधकते अग्निबाण’ मुख्य पाठ में रखा गया है, जबकि ‘चिनगारियाँ/जलती मशालें’ पादटिप्पणी में दिए गए हैं।
- source_word: לְכוּ
  choice: चलो
  rationale: הלך के बहुवचन आदेश को सीधे रखा गया है। प्रसंग के कारण यह प्रोत्साहन नहीं, बल्कि व्यंग्यपूर्ण न्यायिक चुनौती है।
- source_word: בְּאוּר אֶשְׁכֶם
  choice: अपनी आग की रोशनी में
  rationale: אוּר प्रकाश या ज्वाला को दर्शाता है; यह रूप स्वयं बनाई रोशनी पर निर्भरता की विडंबना बनाए रखता है।
- source_word: וּבְזִיקוֹת בִּעַרְתֶּם
  choice: और उन अग्निबाणों के बीच जिन्हें तुमने जला रखा है
  rationale: בִּעַרְתֶּם का सक्रिय अर्थ जलाना या प्रज्वलित करना है। ‘के बीच’ בְּ की स्थानगत शक्ति और स्वयं प्रज्वलित वस्तुओं के बीच चलने का चित्र सुरक्षित रखता है।
- source_word: מִיָּדִי הָיְתָה זֹּאת לָכֶם
  choice: यह तुम्हें मेरे ही हाथ से मिलेगा
  rationale: ‘मेरे हाथ से’ को बनाए रखने से वक्ता की प्रत्यक्ष कर्तृता स्पष्ट रहती है। हिन्दी में भविष्यसूचक न्याय-घोषणा के रूप में ‘मिलेगा’ स्वाभाविक है।
- source_word: לְמַעֲצֵבָה תִּשְׁכָּבוּן
  choice: तुम पीड़ा में पड़े रहोगे
  rationale: מַעֲצֵבָה पीड़ा, संताप या यातना को व्यक्त करता है। ‘पड़े रहोगे’ שכב के लेटने/पड़े होने के चित्र को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ‘अपनी आग की रोशनी में ... चलो’ आदेश का स्वर
  choice: व्यंग्यपूर्ण न्यायिक चुनौती
  alternative: उनके चुने मार्ग पर आगे बढ़ने का तटस्थ निमंत्रण
  rationale: ‘मेरे ही हाथ से’ मिलने वाले परिणाम और अंत की पीड़ा से स्पष्ट है कि यह प्रशंसा या निष्पक्ष अनुमति नहीं, न्याय के अधीन विडंबनापूर्ण आदेश है।
- issue: ‘मेरे ही हाथ’ में वक्ता और कर्तृता
  choice: परमेश्वर घोषित परिणाम को अपने हाथ से आने वाला बताता है
  alternative: केवल सामान्य या मानवीय परिणाम
  rationale: यशायाह के भविष्यवाणी-संदर्भ में प्रथम पुरुष वक्ता की ‘हाथ’ वाली अभिव्यक्ति दैवी कर्तृता और न्याय को दर्शाती है; अनुवाद इसे बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन के योग्य रखी गई है। अग्नि और स्वयं निर्मित प्रकाश के दोहराए गए बिंब सुरक्षित हैं। आदेश की विडंबना को मुख्य पाठ में समझाकर नहीं जोड़ा गया, ताकि मूल की साहित्यिक और धर्मवैचारिक तनावपूर्णता बनी रहे।
