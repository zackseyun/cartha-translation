  text: הֵ֣ן אֲדֹנָ֤/י יְהוִה֙ יַֽעֲזָר לִ֔/י מִי ה֖וּא יַרְשִׁיעֵ֑/נִי הֵ֤ן כֻּלָּ/ם֙ כַּ/בֶּ֣גֶד יִבְל֔וּ עָ֖שׁ יֹאכְלֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/009.yaml
  text: Behold[a], the Lord GOD helps me; who is he who will declare me guilty? Behold, all of them will wear out like a garment; a moth will eat them.
translation:
  language: hi
  text: 'देखो, प्रभु याहवे मेरी सहायता करता है;

    कौन है जो मुझे दोषी ठहराएगा?[a]

    देखो, वे सब वस्त्र के समान जीर्ण हो जाएँगे;

    एक पतंगा उन्हें खा जाएगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कौन मुझे अपराधी ठहराएगा?” इब्रानी क्रिया न्यायिक अर्थ रखती है—निर्णय में किसी को दोषी घोषित करना।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला बलपूर्ण वचन-कण है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इसकी भविष्यद्वक्तापूर्ण गंभीरता बनाए रखता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: यह संयुक्त उपाधि אֲדֹנָי और परमेश्वर के व्यक्तिगत नाम יהוה—दोनों को अलग-अलग व्यक्त करती है; ‘याहवे’ मूल नाम का लिप्यंतरण है।
- source_word: יַעֲזָר לִי
  choice: मेरी सहायता करता है
  rationale: अपूर्ण क्रिया यहाँ सेवक के प्रति परमेश्वर की वर्तमान और भरोसेमंद सहायता का आश्वासन व्यक्त करती है; प्रसंग में भावी सहायता का निहित बल भी बना रहता है।
- source_word: מִי הוּא
  choice: कौन है जो
  rationale: प्रश्न की चुनौती और मूल के स्पष्ट सर्वनाम का बल स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: יַרְשִׁיעֵנִי
  choice: मुझे दोषी ठहराएगा
  rationale: רשע के हिफ़ील रूप का न्यायिक अर्थ किसी को निर्णय में दोषी घोषित करना है; यह अनुवाद उस विधिक भाव को स्पष्ट रखता है।
- source_word: כֻּלָּם
  choice: वे सब
  rationale: यह विरोधियों की पूरी संख्या को समेटने वाले मूल के व्यापक बल को सहज हिन्दी में व्यक्त करता है।
- source_word: כַּבֶּגֶד
  choice: वस्त्र के समान
  rationale: मूल की एकवचन उपमा को सीधे और गरिमापूर्ण ढंग से बनाए रखता है।
- source_word: יִבְלוּ
  choice: जीर्ण हो जाएँगे
  rationale: यह कपड़े के पुराना होकर गलने-घिसने की क्रमिक प्रक्रिया को व्यक्त करता है और हिन्दी में वस्त्र के साथ स्वाभाविक है।
- source_word: עָשׁ
  choice: कपड़े का कीड़ा
  rationale: सिर्फ ‘पतंगा’ हिन्दी में उड़ने वाले कीट की ओर ध्यान ले जा सकता है; ‘कपड़े का कीड़ा’ उस कीट और वस्त्र-भक्षण की छवि को स्पष्ट करता है।
- source_word: יֹאכְלֵם
  choice: उन्हें खा जाएगा
  rationale: मूल की सजीव और ठोस भक्षण-छवि को नरम किए बिना बनाए रखता है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर / प्रभु यहोवा
  rationale: ‘प्रभु याहवे’ אֲדֹנָי को उपाधि और יהוה को व्यक्तिगत वाचा-नाम के रूप में अलग पहचान देता है; इससे दोनों पदों को एक ही सामान्य उपाधि में मिला देने से बचा जाता है।
- issue: יַרְשִׁיעֵנִי का न्यायिक आशय
  choice: मुझे दोषी ठहराएगा
  alternative: मुझे दण्डित करेगा / मेरी निन्दा करेगा
  rationale: मूल क्रिया न्यायिक निर्णय में दोषी घोषित किए जाने पर केंद्रित है, आवश्यक रूप से दण्ड दिए जाने या केवल निन्दा किए जाने पर नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक पंक्ति-विन्यास और गरिमापूर्ण, किंतु सामान्य पाठक के लिए स्पष्ट शब्दावली रखी गई है। दोनों הֵן के लिए ‘देखो’ दोहराकर मूल की वक्तृता सुरक्षित रखी गई है।
