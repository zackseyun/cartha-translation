  text: אַלְבִּ֥ישׁ שָׁמַ֖יִם קַדְר֑וּת וְ/שַׂ֖ק אָשִׂ֥ים כְּסוּתָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/003.yaml
  text: I clothe the heavens with darkness[b][a], and I make sackcloth their covering.
translation:
  language: hi
  text: मैं आकाश को कालिमा[a] पहनाता हूँ और टाट[b] को उसका आवरण ठहराता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अँधेरा,” “कालापन” अथवा “धूमिलता।”
    reason: lexical_alternative
  - marker: b
    text: टाट मोटा और खुरदरा कपड़ा था, जिसे शोक और विलाप के समय पहना जाता था।
    reason: cultural_note
lexical_decisions:
- source_word: אַלְבִּישׁ
  choice: पहनाता हूँ
  rationale: हिफ़ील रूप का कारक अर्थ सुरक्षित रहता है; आकाश को वस्त्र पहनाने की काव्यात्मक छवि हिन्दी में स्वाभाविक ढंग से व्यक्त होती है।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: यहाँ शब्द दृश्य आकाश/आकाशमंडल को सूचित करता है। हिन्दी में एकवचन ‘आकाश’ स्वाभाविक है और मूल के सामूहिक अर्थ को व्यक्त करता है।
- source_word: קַדְרוּת
  choice: कालिमा
  rationale: यह शब्द अँधेरा, कालापन या उदासीभरी धूमिलता दर्शाता है। ‘कालिमा’ वस्त्र-सदृश काले आवरण और शोक—दोनों संकेतों को बनाए रखती है।
- source_word: וְשַׂק
  choice: और टाट
  rationale: ‘टाट’ मोटे, खुरदरे शोक-वस्त्र के लिए प्रचलित हिन्दी शब्द है और सांस्कृतिक छवि सुरक्षित रखता है।
- source_word: אָשִׂים
  choice: बनाता हूँ
  rationale: שׂים का अर्थ रखना/ठहराना है; ‘ओढ़ना बनाता हूँ’ इस वाक्य-विन्यास में स्वाभाविक है और टाट को आकाश का आवरण ठहराने का भाव देता है।
- source_word: כְּסוּתָם
  choice: उसका ओढ़ना
  rationale: כְּסוּת आवरण अथवा वस्त्र है। ‘ओढ़ना’ पहनाने के समानांतर वस्त्र-रूपक को स्पष्ट रखता है। मूल का प्रत्यय व्याकरणतः बहुवचन है, पर हिन्दी में ‘आकाश’ के अनुसार एकवचन सर्वनाम स्वाभाविक है।
theological_decisions:
- issue: न्याय और शोक की ब्रह्मांडीय छवि
  choice: परमेश्वर आकाश को कालिमा पहनाता और टाट से ढकता है—इस काव्यात्मक घोषणा को बिना यह तय किए रखा गया है कि चित्र पूर्णतः शाब्दिक है या रूपकात्मक।
  alternative: इसे केवल वास्तविक ब्रह्मांडीय अंधकार अथवा केवल शोक/न्याय का रूपक मानकर अनुवाद करना।
  rationale: मूल इब्रानी में ब्रह्मांडीय अंधकार और शोक-वस्त्र की छवियाँ साथ आती हैं; अनुवाद दोनों के बीच का धार्मिक-काव्यात्मक तनाव सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। ‘कालिमा पहनाता हूँ’ और ‘ओढ़ना बनाता हूँ’ मूल के वस्त्र-रूपक तथा समानांतरता को बनाए रखते हैं। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न संबद्ध शब्दों/चित्रों के पास दिए गए हैं।
