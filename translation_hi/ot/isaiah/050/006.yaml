base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/006.yaml
  text: I gave my back to those who strike[a], and my cheeks to those who pull out the beard; I did not hide my face from disgrace and spitting.
translation:
  language: hi
  text: मैंने अपनी पीठ मारने वालों को दे दी, और अपने गाल दाढ़ी[a] नोचने वालों को; अपमान और थूकने से मैंने अपना चेहरा नहीं छिपाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाल नोचने वालों को”; हिब्रू में “दाढ़ी” स्पष्ट रूप से नहीं है, यद्यपि प्रसंग में यही सबसे संभावित निहित अर्थ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּוִי
  choice: अपनी पीठ
  rationale: גֵּו शरीर या पीठ को सूचित कर सकता है; मारने के प्रसंग में ‘पीठ’ स्वाभाविक और विशिष्ट है।
- source_word: נָתַתִּי
  choice: मैंने ... दे दी
  rationale: נתן का सीधा अर्थ ‘देना’ है। यह हिब्रू की प्रत्यक्षता और प्रसंग में स्वेच्छा के भाव को बिना बढ़ाए बनाए रखता है।
- source_word: לְמַכִּים
  choice: मारनेवालों को
  rationale: נכה का कृदन्त रूप प्रहार करनेवालों को दर्शाता है; ‘मारनेवाले’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וּלְחָיַי
  choice: और अपने गाल
  rationale: לְחִי गाल अथवा जबड़े के क्षेत्र को दर्शाता है; यहाँ बहुवचन ‘गाल’ शारीरिक अपमान के चित्र को स्पष्ट रखता है।
- source_word: לְמֹרְטִים
  choice: दाढ़ी नोचनेवालों को
  rationale: מרט का अर्थ बाल नोचना या उखाड़ना है। हिब्रू में कर्म स्पष्ट नहीं है, पर ‘गाल’ के बाद दाढ़ी सबसे संभावित निहित कर्म है; इस पूर्ति को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: פָּנַי
  choice: अपना मुँह
  rationale: פנים का अर्थ चेहरा/मुख है; ‘मुँह’ यहाँ थूकने और उसे न छिपाने के प्रसंग में स्वाभाविक हिन्दी है।
- source_word: לֹא הִסְתַּרְתִּי
  choice: मैंने ... नहीं छिपाया
  rationale: हिफ़ील में סתר का अर्थ छिपाना है; यह मूल क्रिया और वक्ता की अडिगता दोनों को सुरक्षित रखता है।
- source_word: מִכְּלִמּוֹת
  choice: अपमान से
  rationale: כְּלִמָּה लज्जा, निरादर या अपमान को दर्शाता है; ‘अपमान’ सामान्य पाठक के लिए सहज है और सामाजिक तिरस्कार का भाव रखता है।
- source_word: וָרֹק
  choice: और थूकने से
  rationale: רֹק थूक या थूकने की अपमानजनक क्रिया को सूचित करता है; ‘थूकने’ समानांतर संरचना में अधिक स्वाभाविक है।
theological_decisions:
- issue: क्या अनुवाद में मसीही/सेवक-सम्बन्धी ख्रीस्तीय प्रयोग को स्पष्ट कर दिया जाए
  choice: वचन को हिब्रू के प्रथम-पुरुष वक्ता के स्तर पर रखा गया है; मसीह या यीशु का नाम नहीं जोड़ा गया।
  alternative: शब्दावली द्वारा यीशु के दुःखभोग की पूर्ति को मुख्य पाठ में प्रमुख बनाना।
  rationale: यह पद ख्रीस्तीय परम्परा में मसीह से सम्बद्ध समझा जाता है, पर हिब्रू पाठ स्वयं प्रथम पुरुष में सेवक की वाणी प्रस्तुत करता है। अनुवाद में पाठ से परे पहचान जोड़ना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और मौखिक रूप से सहज शैली। ‘मारनेवालों’ और ‘नोचनेवालों’ में संयुक्त वर्तनी रखी गई है। वाक्य की समानांतर हिब्रू संरचना को यथासम्भव बनाए रखते हुए ‘अपनी/अपने’ का प्रयोग हिन्दी की स्वाभाविक आत्मवाचक शैली के अनुसार किया गया है।
