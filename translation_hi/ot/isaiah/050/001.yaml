source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אֵ֣י זֶ֠ה סֵ֣פֶר כְּרִית֤וּת אִמְּ/כֶם֙ אֲשֶׁ֣ר שִׁלַּחְתִּ֔י/הָ א֚וֹ מִ֣י מִ/נּוֹשַׁ֔/י אֲשֶׁר מָכַ֥רְתִּי אֶתְ/כֶ֖ם ל֑/וֹ הֵ֤ן בַּ/עֲוֺנֹֽתֵי/כֶם֙ נִמְכַּרְתֶּ֔ם וּ/בְ/פִשְׁעֵי/כֶ֖ם שֻׁלְּחָ֥ה אִמְּ/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/001.yaml
  text: 'Thus says the LORD: Where is your mother''s certificate of divorce, with which I sent her away? Or which of my creditors is it to whom I sold you? Look, you were sold because of your iniquities, and your mother was sent away because of your transgressions.'
translation:
  language: hi
  text: 'यहोवा यों कहता है:


    “तुम्हारी माता के तलाक का वह प्रमाणपत्र कहाँ है, जिसके द्वारा मैंने उसे भेज दिया था?


    या मेरा कौन-सा लेनदार है, जिसे मैंने तुम्हें बेचा था?


    देखो, तुम अपने ही अधर्मों के कारण बेचे गए,


    और तुम्हारे ही अपराधों के कारण तुम्हारी माता भेज दी गई।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित और पहचाने जाने योग्य रूप में रखा गया है।
- source_word: סֵפֶר כְּרִיתוּת
  choice: त्यागपत्र
  rationale: यह पत्नी को औपचारिक रूप से छोड़ने के लिखित प्रमाणपत्र को दर्शाता है; ‘त्यागपत्र’ संक्षिप्त, स्वाभाविक और कानूनी आशय वाला हिन्दी पद है।
- source_word: נֹשַׁי
  choice: लेनदार
  rationale: मूल शब्द ऋण चुकाने की माँग रखने वाले व्यक्ति को सूचित करता है; ‘लेनदार’ इसका सटीक आधुनिक हिन्दी समतुल्य है।
- source_word: עֲוֺנֹתֵיכֶם
  choice: तुम्हारे ही अधर्म
  rationale: עָוֹן नैतिक दोष/टेढ़ेपन तथा उससे जुड़े अपराध का बोध देता है; ‘ही’ इस बात पर बल देता है कि निर्वासन का कारण उनका अपना पाप था।
- source_word: פִשְׁעֵיכֶם
  choice: तुम्हारे ही अपराधों
  rationale: פֶּשַׁע जानबूझकर किए गए विद्रोही उल्लंघन का संकेत देता है; ‘अपराध’ सामान्य पाठक के लिए स्पष्ट रहते हुए गंभीरता बनाए रखता है।
- source_word: שֻׁלְּחָה
  choice: छोड़ दी गई
  rationale: इस वैवाहिक रूपक में क्रिया पत्नी को विदा कर देने/त्याग देने को दर्शाती है और पहले प्रश्न के ‘छोड़ दिया’ से स्वाभाविक संबंध बनाती है।
theological_decisions:
- issue: क्या परमेश्वर ने अपनी प्रजा को अपरिवर्तनीय रूप से त्याग या बेच दिया था?
  choice: दो आलंकारिक प्रश्नों के बाद दोष प्रजा के अपने अधर्म और अपराधों पर रखा गया है।
  alternative: पद को ऐसा कहना मानना कि परमेश्वर ने वास्तव में ऋण के कारण उन्हें बेच दिया या स्थायी तलाक दे दिया।
  rationale: मूल के प्रश्न—त्यागपत्र कहाँ है और कौन-सा लेनदार है—ऐसे बाहरी कानूनी कारणों का निषेध करते हैं; अगली पंक्तियाँ निर्वासन का कारण प्रजा का अपना पाप बताती हैं।
- issue: ‘माता’ की पहचान
  choice: रूपक को बिना स्पष्ट व्याख्यात्मक पहचान जोड़े ‘तुम्हारी माता’ ही रखा गया है।
  alternative: इसे पाठ में सीधे ‘यरूशलेम’, ‘सिय्योन’ या ‘इस्राएल’ कहना।
  rationale: संदर्भ सामुदायिक स्त्री-रूपक की ओर संकेत करता है, पर इस पद में माता का नाम प्रत्यक्ष रूप से नहीं दिया गया; मूल की खुली अर्थ-सीमा सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, श्रव्य और सामान्य पाठकों के लिए स्पष्ट शैली अपनाई गई है। काव्यात्मक समानांतरता और आलंकारिक प्रश्नों को पंक्ति-विन्यास से उभारा गया है। किसी अतिरिक्त व्याख्यात्मक पद या सम्प्रदायगत शब्दावली को पाठ में नहीं जोड़ा गया।
