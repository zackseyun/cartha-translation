source:
  edition: WLC
  text: וַ/אדֹנָ֤/י יְהוִה֙ יַֽעֲזָר לִ֔/י עַל כֵּ֖ן לֹ֣א נִכְלָ֑מְתִּי עַל כֵּ֞ן שַׂ֤מְתִּי פָנַ/י֙ כַּֽ/חַלָּמִ֔ישׁ וָ/אֵדַ֖ע כִּי לֹ֥א אֵבֽוֹשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/007.yaml
  text: But the Lord GOD helps me[a]; therefore I have not been disgraced. Therefore I have set my face like flint[d][c][b], and I know that I will not be put to shame.
translation:
  language: hi
  text: परन्तु प्रभु यहोवा मेरी सहायता करता है; इसलिए मैं अपमानित नहीं हुआ। इसलिए मैंने अपना चेहरा चकमक पत्थर के समान कठोर कर लिया है[a], और मैं जानता हूँ कि मैं लज्जित नहीं होऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “चेहरा चकमक पत्थर के समान कठोर करना” विरोध के सामने अटल निश्चय रखने की अलंकारिक अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: וַאדֹנָי יְהוִה
  choice: परन्तु प्रभु यहोवा
  rationale: וַ संदर्भ में विरोधसूचक है; संयुक्त उपाधि אֲדֹנָי יְהוִה को दोनों घटकों का भेद बनाए रखते हुए स्वाभाविक हिन्दी में प्रस्तुत किया गया है।
- source_word: יַעֲזָר לִי
  choice: मेरी सहायता करता है
  rationale: अपूर्ण क्रिया यहाँ वर्तमान और आगे तक बनी रहने वाली भरोसेपूर्ण सहायता व्यक्त करती है; हिन्दी का सामान्य वर्तमान इस भाव को स्वाभाविक रूप से रखता है।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: दोनों आवृत्तियों में कारण से परिणाम का संबंध और मूल की अलंकारिक पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: לֹא נִכְלָמְתִּי
  choice: मैं अपमानित नहीं हुआ
  rationale: निफ़अल रूप झेली गई लज्जा या अपमान का परिणाम बताता है; यह अनुवाद उसके निष्पन्न और कर्मवाच्य-सदृश भाव को स्पष्ट रखता है।
- source_word: שַׂמְתִּי פָנַי כַּחַלָּמִישׁ
  choice: मैंने अपना मुख चकमक पत्थर के समान दृढ़ कर लिया है
  rationale: मूल की मुख और चकमक की छवि सुरक्षित रखते हुए हिन्दी में मुहावरे का दृढ़ निश्चय वाला आशय स्पष्ट किया गया है।
- source_word: וָאֵדַע
  choice: और मैं जानता हूँ
  rationale: रूप कथन को आगे बढ़ाता है और वक्ता का स्थिर विश्वास व्यक्त करता है; वर्तमान काल हिन्दी में इस निश्चितता को सहज रूप से संप्रेषित करता है।
- source_word: לֹא אֵבוֹשׁ
  choice: मुझे लज्जित नहीं होना पड़ेगा
  rationale: בוש भविष्य में लज्जित या निराश सिद्ध होने का भाव रख सकता है; यह चयन पहले प्रयुक्त 'अपमानित' से हल्का शब्दभेद बनाए रखते हुए भावी निश्चितता रखता है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में सामान्य प्रभुता-सूचक उपाधि और चार-अक्षरीय व्यक्तिगत नाम दोनों उपस्थित हैं। 'प्रभु यहोवा' इस भेद को बनाए रखता है और किसी विशिष्ट सम्प्रदायगत व्याख्या को नहीं जोड़ता।
- issue: लज्जा संबंधी दो निकटार्थक क्रियाओं का संबंध
  choice: अपमानित नहीं हुआ … लज्जित नहीं होना पड़ेगा
  alternative: लज्जित नहीं हुआ … लज्जित नहीं होऊँगा
  rationale: נכלם और בוש के अर्थ-क्षेत्र परस्पर मिलते हैं, फिर भी मूल में अलग शब्द हैं। हिन्दी में निकटार्थक शब्दों द्वारा समानता और सूक्ष्म भेद दोनों रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ स्तर अपनाया गया है। मूल की दोहरी ‘इसलिए’ संरचना, दृढ़ संकल्प की ठोस छवि और लज्जा-विषयक शब्दभेद सुरक्षित रखे गए हैं।
