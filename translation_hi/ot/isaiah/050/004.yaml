source:
  edition: WLC
  text: אֲדֹנָ֣/י יְהֹוִ֗ה נָ֤תַן לִ/י֙ לְשׁ֣וֹן לִמּוּדִ֔ים לָ/דַ֛עַת לָ/ע֥וּת אֶת יָעֵ֖ף דָּבָ֑ר יָעִ֣יר בַּ/בֹּ֣קֶר בַּ/בֹּ֗קֶר יָעִ֥יר לִ/י֙ אֹ֔זֶן לִ/שְׁמֹ֖עַ כַּ/לִּמּוּדִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/004.yaml
  text: The Lord GOD has given me the tongue of those who are taught[a], that I may know how to sustain the weary with a word. Morning by morning he awakens[c][b]; he awakens my ear to hear like those who are taught.
translation:
  language: hi
  text: प्रभु याहवे[c] ने मुझे शिक्षा पाए हुए लोगों की वाणी[a] दी है, ताकि मैं जान सकूँ कि थके हुए को वचन से कैसे संभालूँ[b]। भोर-भोर वह मुझे जगाता है; वह मेरे कान को जागृत करता है, ताकि मैं शिक्षा पाए हुए लोगों के समान सुनूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शिष्यों की वाणी’ अथवा ‘प्रशिक्षित लोगों की वाणी।’
    reason: lexical_alternative
  - marker: b
    text: यहाँ अनूदित इब्रानी क्रिया कठिन है; इसका अर्थ ‘सहारा दूँ’ या ‘सहायता करूँ’, और कम सम्भावना से ‘उत्तर दूँ’, भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘प्रभु याहवे’ में इब्रानी उपाधि אֲדֹנָי (‘प्रभु’) और परमेश्वर का नाम YHWH (‘याहवे’) साथ आए हैं।
    reason: cultural_note
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: यह संयुक्त संबोधन אֲדֹנָי (‘प्रभु’) और परमेश्वर के व्यक्तिगत नाम YHWH (‘याहवे’) दोनों को बनाए रखता है तथा हिन्दी में ‘प्रभु प्रभु’ जैसी अस्वाभाविक पुनरुक्ति से बचता है।
- source_word: לְשׁוֹן לִמּוּדִים
  choice: शिक्षा पाए हुओं की-सी वाणी
  rationale: לְשׁוֹן का शाब्दिक अर्थ ‘जीभ’ है, पर यहाँ वह बोलने की क्षमता या वाणी का रूपक है। לִמּוּדִים उन लोगों को सूचित करता है जिन्हें शिक्षा दी गई है; यह अनुवाद ‘शिष्य’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: לָעוּת
  choice: संभालूँ
  rationale: यह क्रिया पाठ और अर्थ—दोनों दृष्टियों से कठिन है। प्रसंग में थके हुए व्यक्ति को वचन द्वारा सहारा देने का भाव सबसे उपयुक्त है; विकल्प पादटिप्पणी में रखे गए हैं।
- source_word: יָעֵף
  choice: थके हुए
  rationale: यह विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और शारीरिक अथवा आंतरिक थकावट, दोनों के लिए खुला रहता है।
- source_word: דָּבָר
  choice: वचन से
  rationale: यहाँ דָּבָר का अर्थ बोला गया ‘वचन’ है और ‘से’ उसके साधनात्मक प्रयोग को व्यक्त करता है।
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: भोर-भोर
  rationale: दोहराव नियमितता और निरंतरता व्यक्त करता है। ‘भोर-भोर’ मूल की लय और बल को संक्षिप्त, स्वाभाविक हिन्दी में रखता है।
- source_word: יָעִיר לִי אֹזֶן
  choice: वह मेरे कान को जगाता है
  rationale: 'मूल रूपक को सुरक्षित रखा गया है: परमेश्वर कान को ग्रहणशील सुनने के लिए जगाता है।'
- source_word: לִשְׁמֹעַ כַּלִּמּוּדִים
  choice: ताकि मैं शिक्षा पाए हुओं के समान सुनूँ
  rationale: ‘सुनूँ’ שׁמע के मूल अर्थ को रखता है और לִמּוּדִים को पहली पंक्ति के समान अनूदित करने से पद की समानांतरता बनी रहती है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर / प्रभु यहोवा
  rationale: ‘याहवे’ चार अक्षरों वाले व्यक्तिगत नाम YHWH को नाम के रूप में स्पष्ट रखता है, जबकि ‘प्रभु’ אֲדֹנָי का अनुवाद है। इससे दोनों तत्व अलग और दृश्यमान रहते हैं।
- issue: לִמּוּדִים की पहचान
  choice: शिक्षा पाए हुए
  alternative: शिष्य
  rationale: ‘शिष्य’ धार्मिक या संस्थागत पहचान को अधिक स्पष्ट कर सकता है, जबकि इब्रानी रूप मुख्यतः शिक्षा पाए व्यक्ति पर बल देता है। चुना गया रूप इस खुलापन को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वाणी’, ‘वचन’ और ‘भोर-भोर’ काव्यात्मक स्वर बनाए रखते हैं, जबकि कठिन क्रिया का अर्थ पादटिप्पणी में खुला छोड़ा गया है।
