  text: מַדּ֨וּעַ בָּ֜אתִי וְ/אֵ֣ין אִ֗ישׁ קָרָֽאתִי֮ וְ/אֵ֣ין עוֹנֶה֒ הֲ/קָצ֨וֹר קָצְרָ֤ה יָדִ/י֙ מִ/פְּד֔וּת וְ/אִם אֵֽין בִּ֥/י כֹ֖חַ לְ/הַצִּ֑יל הֵ֣ן בְּ/גַעֲרָתִ֞/י אַחֲרִ֣יב יָ֗ם אָשִׂ֤ים נְהָרוֹת֙ מִדְבָּ֔ר תִּבְאַ֤שׁ דְּגָתָ/ם֙ מֵ/אֵ֣ין מַ֔יִם וְ/תָמֹ֖ת בַּ/צָּמָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/002.yaml
  text: Why[a], when I came, was there no man? When I called, was there no one to answer? Is my hand really too short to redeem, or is there no power in me to deliver? Behold[b], by my rebuke I dry up the sea; I make rivers a wilderness[c]; their fish stink for lack of water and die of thirst.
translation:
  language: hi
  text: जब मैं आया, तब वहाँ कोई क्यों नहीं था?[a] जब मैंने पुकारा, तब उत्तर देने वाला कोई क्यों नहीं था? क्या छुड़ाने के लिए मेरा हाथ सचमुच छोटा पड़ गया है,[b] या बचाने की सामर्थ्य मुझमें नहीं है?[c] देखो, मेरी डाँट से मैं समुद्र को सुखा देता हूँ; मैं नदियों को मरुभूमि बना देता हूँ। पानी न होने से उनकी मछलियाँ दुर्गंध देने लगती हैं और प्यास से मर जाती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से ‘कोई पुरुष/मनुष्य नहीं था’; यहाँ यह शब्द प्रतिनिधिक अर्थ में किसी भी व्यक्ति के लिए है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘क्या मेरा हाथ छुड़ाने के लिए बहुत छोटा हो गया है?’ ‘हाथ छोटा पड़ना’ सामर्थ्यहीन होने का रूपक है।
    reason: metaphor_and_lexical_alternative
  - marker: c
    text: ‘बचाने’ का अनुवाद ‘छुड़ाने’ या ‘रक्षा करने’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ בָּאתִי וְאֵין אִישׁ
  choice: जब मैं आया, तब वहाँ कोई क्यों नहीं था?
  rationale: रूपकात्मक प्रश्न और आगमन के बाद किसी के उपस्थित न होने का विरोधाभास स्वाभाविक हिन्दी में सुरक्षित रहता है। אִישׁ का शाब्दिक अर्थ ‘पुरुष/मनुष्य’ है, पर इस अस्तित्वसूचक वाक्य में उसका प्रतिनिधिक अर्थ ‘कोई’ है।
- source_word: קָרָאתִי וְאֵין עוֹנֶה
  choice: जब मैंने पुकारा, तब उत्तर देनेवाला कोई क्यों नहीं था?
  rationale: ‘पुकारा’ में बुलाने और आह्वान करने, दोनों की सम्भावना बनी रहती है; कृदन्त עוֹנֶה को ‘उत्तर देनेवाला’ से व्यक्त किया गया है।
- source_word: הֲקָצוֹר קָצְרָה יָדִי מִפְּדוּת
  choice: क्या छुड़ाने के लिए मेरा हाथ सचमुच छोटा पड़ गया है
  rationale: हिब्रू की बलाघाती रचना और परमेश्वर की सामर्थ्य के लिए प्रयुक्त ‘छोटे हाथ’ का देहात्मक रूपक दोनों बनाए रखे गए हैं। פְדוּת के उद्धार/छुड़ौती-संबंधी अर्थ को यहाँ सहज क्रिया ‘छुड़ाने’ से व्यक्त किया गया है।
- source_word: וְאִם אֵין בִּי כֹחַ לְהַצִּיל
  choice: या बचाने की सामर्थ्य मुझमें नहीं है?
  rationale: כֹחַ के लिए ‘सामर्थ्य’ और נצל के हिफ़ील रूप के लिए व्यापक अर्थ वाला ‘बचाने’ चुना गया है; इससे केवल आत्मिक उद्धार तक अर्थ सीमित नहीं होता।
- source_word: הֵן בְּגַעֲרָתִי אַחֲרִיב יָם
  choice: देखो, अपनी डाँट से मैं समुद्र को सुखा देता हूँ
  rationale: הֵן ध्यान आकर्षित करता है; आधुनिक हिन्दी में ‘देखो’ गरिमापूर्ण और स्पष्ट है। जल के अभाव वाले अगले प्रसंग के कारण חרב का ‘सुखा देना’ अर्थ उपयुक्त है।
- source_word: אָשִׂים נְהָרוֹת מִדְבָּר
  choice: मैं नदियों को मरुभूमि बना देता हूँ
  rationale: परिवर्तन की हिब्रू रचना और מִדְבָּר का उजाड़, निर्जल बिंब संक्षिप्त रूप से सुरक्षित है।
- source_word: תִּבְאַשׁ דְּגָתָם מֵאֵין מַיִם וְתָמֹת בַּצָּמָא
  choice: पानी न रहने से उनकी मछलियाँ सड़ांध मारती हैं और प्यास से मर जाती हैं
  rationale: दुर्गन्ध देने और मरने की क्रमिक, कठोर छवि को बिना नरम किए स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: परमेश्वर के ‘हाथ’ का मानवीय रूपक
  choice: ‘मेरा हाथ सचमुच छोटा पड़ गया है’ रूपक को बनाए रखा गया।
  alternative: ‘क्या मेरी सामर्थ्य छुड़ाने के लिए अपर्याप्त हो गई है?’
  rationale: मूल पाठ स्वयं अगले उपवाक्य में ‘सामर्थ्य’ का उल्लेख करता है; पहले उपवाक्य के हाथ-वाले रूपक को अमूर्त कर देना उसकी पुनरुक्तिपूर्ण बलवत्ता और धर्मग्रंथीय प्रतिध्वनि घटा देता।
- issue: פְדוּת और נצל के बीच अर्थगत संबंध
  choice: पहले के लिए ‘छुड़ाने’ और दूसरे के लिए ‘बचाने’ रखा गया।
  alternative: दोनों के लिए ‘उद्धार करने’ का एक ही पद
  rationale: दो निकटवर्ती किन्तु अलग हिब्रू अभिव्यक्तियों का भेद बचता है और पाठ को केवल किसी एक धर्मवैज्ञानिक तकनीकी अर्थ तक सीमित नहीं किया जाता।
- issue: אִישׁ का लिंगयुक्त रूप
  choice: मुख्य पाठ में प्रसंगानुकूल ‘कोई’ और टिप्पणी में ‘पुरुष/मनुष्य’ का शाब्दिक रूप स्पष्ट किया गया।
  alternative: ‘कोई पुरुष क्यों नहीं था?’
  rationale: यहाँ प्रश्न किसी पुरुष-विशेष के अभाव पर नहीं, प्रत्युत्तर देने वाले किसी भी व्यक्ति के न होने पर है; हिन्दी का ‘कोई’ प्रतिनिधिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—गरिमापूर्ण, पर अनावश्यक रूप से पुरातन नहीं। ‘देखो’, ‘सामर्थ्य’, ‘मरुभूमि’ और ‘सड़ांध मारती हैं’ मूल के गंभीर तथा प्रबल काव्यात्मक स्वर को सामान्य पाठक के लिए स्पष्ट रखते हैं।
