id: ISA.50.5
reference: Isaiah 50:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲדֹנָ֤/י יְהוִה֙ פָּתַֽח לִ֣/י אֹ֔זֶן וְ/אָנֹכִ֖י לֹ֣א מָרִ֑יתִי אָח֖וֹר לֹ֥א נְסוּגֹֽתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/005.yaml
  text: The Lord GOD has opened my ear[a], and I was not rebellious; I did not turn back.
translation:
  language: hi
  text: प्रभु याहवे ने मेरा कान खोल दिया है, और मैंने विद्रोह नहीं किया; मैं पीछे नहीं हटा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मैं पीछे नहीं लौटा।’
    reason: सוג के अर्थ-क्षेत्र में पीछे हटना और पीछे लौटना दोनों शामिल हैं; वैकल्पिक अनुवाद इस सूक्ष्मता को सुरक्षित रखता है।
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: दोनों पदों को बनाए रखते हुए אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ के रूप में प्रस्तुत किया गया है।
- source_word: פָּתַח לִי אֹזֶן
  choice: मेरा कान खोल दिया है
  rationale: शाब्दिक चित्र ‘मेरे लिए कान खोला’ को स्वाभाविक हिन्दी में रखा गया है; इसे केवल ‘मुझे सुनने योग्य बनाया’ कहकर ठोस बिंब को अमूर्त नहीं किया गया। पूर्ण क्रिया के वर्तमान प्रभाव को ‘खोल दिया है’ व्यक्त करता है।
- source_word: מָרִיתִי
  choice: मैंने विद्रोह नहीं किया
  rationale: מרה का मूल अर्थ विद्रोह करना या आज्ञा का प्रतिरोध करना है। यह अनुवाद वक्ता की आज्ञाकारिता को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָחוֹר לֹא נְסוּגֹתִי
  choice: मैं पीछे नहीं हटा
  rationale: סוג और אָחוֹר मिलकर पीछे हटने या लौट जाने का भाव देते हैं। ‘पीछे नहीं हटा’ दायित्व से न कतराने के रूपक को बनाए रखता है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु यहोवा
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम יהוה सीधे उपस्थित है। ‘याहवे’ उसे उपाधि से अलग रखते हुए आधुनिक हिन्दी लिप्यंतरण में सुरक्षित रखता है।
- issue: कान खोलने के बिंब का अर्थ
  choice: मेरा कान खोल दिया है
  alternative: मुझे सुनने और मानने योग्य बनाया है
  rationale: संदर्भ आज्ञाकारिता का संकेत देता है, पर मूल पाठ का ठोस और कुछ हद तक खुला बिंब बनाए रखा गया है; उसके निहितार्थ को मुख्य पाठ में व्याख्या बनाकर नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। एकवचन ‘कान’ और समानांतर नकारात्मक कथनों को मूल के अनुसार बनाए रखा गया है।
