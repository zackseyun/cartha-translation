source:
  edition: WLC
  text: קָרוֹב֙ מַצְדִּיקִ֔/י מִֽי יָרִ֥יב אִתִּ֖/י נַ֣עַמְדָה יָּ֑חַד מִֽי בַ֥עַל מִשְׁפָּטִ֖/י יִגַּ֥שׁ אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/008.yaml
  text: Near is the one who vindicates me[a]; who will contend with me? Let us stand together[b]. Who is the master of my case? Let him come near to me.
translation:
  language: hi
  text: मुझे सही ठहरानेवाला निकट है[a]; कौन मुझसे विवाद करेगा? आओ, हम साथ खड़े हों। मेरे विरुद्ध मुक़दमा करनेवाला कौन है?[b] वह मेरे निकट आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे निर्दोष ठहरानेवाला” अथवा “मुझे धर्मी ठहरानेवाला।” यहाँ इब्रानी क्रिया न्यायालयीन अर्थ रखती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मेरे मुक़दमे का स्वामी,” अर्थात वह व्यक्ति जो मेरे विरुद्ध कानूनी दावा पेश करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב
  choice: निकट है
  rationale: वाक्य के आरम्भ में रखकर इब्रानी के बलाघात और संक्षिप्त न्यायालयीन स्वर को बनाए रखा गया है।
- source_word: מַצְדִּיקִי
  choice: मुझे निर्दोष ठहरानेवाला
  rationale: हिफ़ील रूप यहाँ न्यायालयीन संदर्भ में किसी को सही या निर्दोष घोषित करने का भाव रखता है; यह अनुवाद आंतरिक नैतिक परिवर्तन के बजाय न्यायिक समर्थन को व्यक्त करता है।
- source_word: יָרִיב אִתִּי
  choice: कौन मुझसे विवाद करेगा?
  rationale: ריב में सामान्य विरोध और कानूनी वाद-विवाद दोनों का भाव हो सकता है। ‘विवाद करेगा’ इस व्यापकता को रखता है, जबकि आसपास का संदर्भ न्यायालयीन अर्थ स्पष्ट करता है।
- source_word: נַעַמְדָה יָּחַד
  choice: आओ, हम साथ खड़े हों
  rationale: प्रथम पुरुष बहुवचन के आग्रह और न्यायालय में आमने-सामने उपस्थित होने की चुनौती को संक्षिप्त रूप में रखा गया है।
- source_word: בַעַל מִשְׁפָּטִי
  choice: मेरे विरुद्ध मुक़दमा करनेवाला
  rationale: शाब्दिक पदबंध ‘मेरे मुक़दमे का स्वामी/अधिकारी’ उस व्यक्ति को सूचित करता है जो वक्ता के विरुद्ध कानूनी दावा पेश करता है। मुख्य पाठ में स्वाभाविक हिन्दी के लिए आशय स्पष्ट किया गया है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: יִגַּשׁ אֵלָי
  choice: वह मेरे निकट आए
  rationale: यह चुनौती के रूप में प्रयुक्त आज्ञार्थक भाव को व्यक्त करता है और आरम्भ के ‘निकट’ की प्रतिध्वनि भी बनाए रखता है।
theological_decisions:
- issue: מַצְדִּיקִי का न्यायिक या नैतिक अर्थ
  choice: न्यायिक अर्थ में ‘मुझे निर्दोष ठहरानेवाला’
  alternative: ‘मुझे धर्मी बनाता है’ अथवा तकनीकी धार्मिक पद ‘मुझे धर्मी ठहराता है’
  rationale: विवाद, साथ खड़े होने और मुक़दमा करनेवाले की भाषा स्पष्ट रूप से न्यायालयीन है। इसलिए यहाँ किसी आंतरिक नैतिक परिवर्तन के बजाय न्यायिक निर्णय या सार्वजनिक समर्थन का अर्थ उपयुक्त है; इससे बाद की किसी विशिष्ट धर्मशास्त्रीय व्यवस्था को पाठ में आरोपित नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, संक्षिप्त और सामान्य पाठकों के लिए बोधगम्य शैली अपनाई गई है। ‘मुक़दमा’ न्यायालयीन रूपक को स्पष्ट करता है; ‘विवाद’ मूल क्रिया की व्यापकता बनाए रखता है। आरम्भ और अन्त में ‘निकट’ की पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है।
