  edition: WLC
  text: מִ֤י בָ/כֶם֙ יְרֵ֣א יְהוָ֔ה שֹׁמֵ֖עַ בְּ/ק֣וֹל עַבְדּ֑/וֹ אֲשֶׁ֣ר הָלַ֣ךְ חֲשֵׁכִ֗ים וְ/אֵ֥ין נֹ֨גַהּ֙ ל֔/וֹ יִבְטַח֙ בְּ/שֵׁ֣ם יְהוָ֔ה וְ/יִשָּׁעֵ֖ן בֵּ/אלֹהָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/010.yaml
  text: Who among you fears Yahweh[a], listening to the voice of his servant? Let the one who walks in darkness and has no light trust in the name of Yahweh and lean on his God.
translation:
  language: hi
  text: तुममें से कौन याहवे का भय मानता है और उसके सेवक की वाणी सुनता है?[a] जो अँधेरे में चलता है और जिसके पास कोई उजाला नहीं है, वह याहवे के नाम पर भरोसा रखे और अपने परमेश्वर का सहारा ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वाणी सुनता है’ का अर्थ ‘वाणी मानता है’ या ‘उस पर ध्यान देता है’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי בָכֶם
  choice: तुममें से कौन
  rationale: यह स्वाभाविक हिन्दी में श्रोताओं को सीधे संबोधित करने वाले इब्रानी प्रश्न को सुरक्षित रखता है।
- source_word: יְרֵא יְהוָה
  choice: याहवे का भय मानता
  rationale: यह परमेश्वर के प्रति श्रद्धामिश्रित भय और वाचा-संबंधी भक्ति का भार बनाए रखता है; केवल ‘आदर करता’ कहना अर्थ को अनावश्यक रूप से हल्का कर देता।
- source_word: שֹׁמֵעַ בְּקוֹל עַבְדּוֹ
  choice: उसके सेवक की वाणी सुनता है
  rationale: שׁמע में सुनने, ध्यान देने और आज्ञा मानने के अर्थ हो सकते हैं। मुख्य पाठ श्रवण और सजगता का मूल भाव रखता है, जबकि अधिक प्रबल अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: עַבְדּוֹ
  choice: उसके सेवक
  rationale: यशायाह के सेवक-विषयक संदर्भ में ‘सेवक’ स्वाभाविक है और पद द्वारा अनिर्दिष्ट उसकी पहचान को खुला रखता है।
- source_word: אֲשֶׁר הָלַךְ חֲשֵׁכִים
  choice: जो अँधेरे में चलता है
  rationale: इब्रानी बहुवचन यहाँ अंधकार की अवस्था को तीव्र करता है; हिन्दी में एकवचन ‘अँधेरे’ अधिक स्वाभाविक ढंग से वही अनुभव व्यक्त करता है।
- source_word: וְאֵין נֹגַהּ לוֹ
  choice: जिसके पास कोई उजाला नहीं है
  rationale: नֹגַהּ की चमक, दीप्ति या प्रकाश की अर्थ-सीमा को साधारण और स्पष्ट हिन्दी में व्यक्त किया गया है।
- source_word: יִבְטַח בְּשֵׁם יְהוָה
  choice: याहवे के नाम पर भरोसा रखे
  rationale: ‘नाम’ को बनाए रखने से परमेश्वर के प्रकट चरित्र और पहचान पर निर्भरता का भाव सुरक्षित रहता है।
- source_word: וְיִשָּׁעֵן בֵּאלֹהָיו
  choice: अपने परमेश्वर का सहारा ले
  rationale: यह शारीरिक रूप से किसी पर टिकने के रूपक को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना उसे केवल बौद्धिक विश्वास तक सीमित किए।
theological_decisions:
- issue: ‘उसके सेवक’ की पहचान
  choice: मुख्य पाठ में केवल ‘उसके सेवक’ रखा गया है।
  alternative: भविष्यद्वक्ता, इस्राएल, या मसीही महत्त्व वाला सेवक
  rationale: यशायाह का व्यापक संदर्भ सेवक-विषय को महत्त्व देता है, पर यह पद स्वयं सेवक की पहचान स्पष्ट नहीं करता; इसलिए अनुवाद किसी एक व्याख्या को पाठ में नहीं जोड़ता।
- issue: שֹׁמֵעַ का आशय
  choice: मुख्य पाठ में ‘वाणी सुनता है’
  alternative: ‘वाणी मानता है’ या ‘वाणी पर ध्यान देता है’
  rationale: इब्रानी शब्द में सुनना और आज्ञापालन दोनों समाहित हो सकते हैं। मूल श्रवण-भाव मुख्य पाठ में और प्रबल व्यावहारिक अर्थ पादटिप्पणी में रखकर वास्तविक अस्पष्टता सुरक्षित की गई है।
- issue: अंधकार में चलने वाले के लिए विश्वास का आह्वान
  choice: अंधकार और प्रकाश के अभाव को विश्वास की कमी मानकर नहीं समझाया गया।
  alternative: अंधकार को पाप, संकट, या आत्मिक परित्याग के किसी एक निश्चित अर्थ से पहचानना
  rationale: पद याहवे का भय मानने वाले व्यक्ति को भी अंधकार में दिखाता है; अनुवाद इस धर्मवैचारिक तनाव को बिना समाधान थोपे बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘याहवे’ द्वारा मूल पाठ के व्यक्तिगत ईश्वरीय नाम को प्रत्यक्ष रखा गया है। ‘अँधेरा,’ ‘उजाला,’ ‘भरोसा’ और ‘सहारा’ जैसे सामान्य शब्दों से पद का काव्यात्मक रूपक स्पष्ट और स्वाभाविक बना रहता है।
