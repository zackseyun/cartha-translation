source:
  edition: WLC
  text: וְ/קוֹיֵ֤ יְהוָה֙ יַחֲלִ֣יפוּ כֹ֔חַ יַעֲל֥וּ אֵ֖בֶר כַּ/נְּשָׁרִ֑ים יָר֨וּצוּ֙ וְ/לֹ֣א יִיגָ֔עוּ יֵלְכ֖וּ וְ/לֹ֥א יִיעָֽפוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/031.yaml
  text: But those who wait for Yahweh will renew their strength[a]; they will rise up with wings like eagles; they will run and not grow weary[b]; they will walk and not faint.
translation:
  language: hi
  text: परन्तु जो याहवे की बाट जोहते हैं[a], वे नया बल पाएँगे; वे उकाबों[b] के समान पंख फैलाकर ऊपर उठेंगे; वे दौड़ेंगे और न थकेंगे; वे चलेंगे और निढाल न होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो याहवे पर आशा रखते हैं।” इब्रानी क्रिया में आशाभरी प्रतीक्षा का भाव है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी נְשָׁרִים (नेशारीम) बड़े शिकारी पक्षियों के लिए प्रयुक्त हो सकता है; इसका अनुवाद परम्परागत रूप से “उकाब” किया जाता है, पर कुछ प्रसंगों में यह गिद्ध को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/קוֹיֵ
  choice: परन्तु जो … की बाट जोहते हैं
  rationale: קוה का कृदन्त रूप आशाभरी प्रतीक्षा का भाव रखता है। ‘बाट जोहते हैं’ प्रतीक्षा और अपेक्षा दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; आरम्भिक וְ को पिछले पद के विपरीत भाव के कारण ‘परन्तु’ किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में ध्वन्यंतरण किया गया है।
- source_word: יַחֲלִיפוּ כֹחַ
  choice: नया बल पाएँगे
  rationale: Hiphil חלף और כֹּחַ का संयोजन बल के फिर नया हो जाने अथवा नए बल की प्राप्ति को सूचित करता है। यह हिन्दी प्रयोग स्वाभाविक है और केवल ‘बल बदलेंगे’ जैसी भ्रामक शब्दशः अभिव्यक्ति से बचता है।
- source_word: יַעֲלוּ אֵבֶר
  choice: पंखों से ऊपर उठेंगे
  rationale: עלה ऊपर उठने और אבר पंख का बोध देता है। अनुवाद आरोहण की काव्यात्मक छवि को बिना ‘उड़ेंगे’ को स्पष्ट रूप से जोड़ने के बनाए रखता है।
- source_word: כַּ/נְּשָׁרִים
  choice: उकाबों के समान
  rationale: נשר बड़े शिकारी पक्षी का नाम है। इस सामर्थ्य और ऊँची उड़ान की काव्यात्मक छवि में पारम्परिक और प्रसंगानुकूल ‘उकाब’ चुना गया है; व्यापक प्राणीवैज्ञानिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: יָרוּצוּ וְלֹא יִיגָעוּ
  choice: वे दौड़ेंगे और न थकेंगे
  rationale: रूपक के सीधे समानान्तर क्रम तथा יגע के श्रम से थकने के भाव को संक्षिप्त, स्वाभाविक हिन्दी में रखा गया है।
- source_word: יֵלְכוּ וְלֹא יִיעָפוּ
  choice: वे चलेंगे और शिथिल न होंगे
  rationale: הלך के सामान्य ‘चलना’ और יעף के निर्बल अथवा निढाल हो जाने के प्रबल भाव के बीच का अन्तर सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। उसका ध्वन्यंतरण नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: קוה में प्रतीक्षा और आशा का संयुक्त भाव
  choice: बाट जोहते हैं
  alternative: आशा रखते हैं; प्रतीक्षा करते हैं
  rationale: ‘बाट जोहना’ समयगत प्रतीक्षा को बनाए रखते हुए अपेक्षापूर्ण आशा का संकेत भी देता है। दोनों भावों में से किसी एक को ही निर्णायक बनाने के बजाय दूसरे को पादटिप्पणी में स्पष्ट किया गया है।
- issue: יַחֲלִיפוּ כֹחַ में बल के नवीकरण अथवा परिवर्तन का भाव
  choice: नया बल पाएँगे
  alternative: अपने बल को नया करेंगे; बल बदलेंगे
  rationale: क्रिया में नया होने, बदलने या फिर से प्राप्त होने की अर्थ-सीमा है। प्रसंग दुर्बलों को मिलने वाले सामर्थ्य का है; चुना हुआ रूप इसे स्वाभाविक हिन्दी में व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। समानान्तर क्रियाओं—ऊपर उठना, दौड़ना और चलना—की लय बनाए रखी गई है। ‘बाट जोहना’ साहित्यिक किन्तु प्रचलित हिन्दी है और आशापूर्ण प्रतीक्षा के संयुक्त इब्रानी भाव के लिए उपयुक्त है।
