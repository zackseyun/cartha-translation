  yaml_path: translation/ot/isaiah/040/030.yaml
  text: Even young men grow faint and become weary[a], and young men surely stumble.
translation:
  language: hi
  text: युवक भी दुर्बल हो जाते हैं और थक जाते हैं, और बलवान युवक बुरी तरह लड़खड़ा जाते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיִעֲפוּ
  choice: थककर निढाल हो जाते हैं
  rationale: क्रिया עוף यहाँ थक जाने अथवा शक्तिहीन होने का भाव देती है; यह प्रयोग उस क्रमिक दुर्बलता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נְעָרִים
  choice: जवान
  rationale: נְעָרִים यहाँ बच्चों के बजाय युवावस्था के लोगों को दर्शाता है; समानांतर पद के साथ काव्यात्मक बल बनाए रखने के लिए 'जवान' उपयुक्त है।
- source_word: וְיִגָעוּ
  choice: थककर
  rationale: יגע का अर्थ थकना या श्रम से क्लांत होना है। इसे पहले क्रियापद के साथ संयुक्त वाक्यांश में रखा गया है, जिससे दोनों निकटवर्ती भाव हिन्दी में सहज बने रहते हैं।
- source_word: וּבַחוּרִים
  choice: बलवान युवक
  rationale: בַחוּרִים युवावस्था के उत्कर्ष और सामर्थ्य वाले युवकों को सूचित करता है। 'बलवान युवक' נְעָרִים से शब्दगत भेद और प्रसंग में निहित शक्ति—दोनों को व्यक्त करता है; 'चुने हुए' कहना मूल अर्थ को अनावश्यक रूप से चयन की ओर मोड़ सकता है।
- source_word: כָּשׁוֹל יִכָּשֵׁלוּ
  choice: निश्चय ही ठोकर खाते हैं
  rationale: क्रिया के साथ infinitive absolute क्रिया को प्रबल बनाता है। 'निश्चय ही' इस बलाघात को व्यक्त करता है, जबकि 'ठोकर खाते हैं' मूल की गिरने/लड़खड़ाने संबंधी छवि को बनाए रखता है।
