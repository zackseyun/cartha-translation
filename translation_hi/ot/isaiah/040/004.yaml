source:
  edition: WLC
  text: כָּל גֶּיא֙ יִנָּשֵׂ֔א וְ/כָל הַ֥ר וְ/גִבְעָ֖ה יִשְׁפָּ֑לוּ וְ/הָיָ֤ה הֶֽ/עָקֹב֙ לְ/מִישׁ֔וֹר וְ/הָ/רְכָסִ֖ים לְ/בִקְעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/004.yaml
  text: Every valley will be lifted up[a], and every mountain and hill will be made low; the uneven ground will become level[b], and the ridges a plain.
translation:
  language: hi
  text: हर घाटी ऊपर उठाई जाएगी, और हर पहाड़ और पहाड़ी नीचे किए जाएँगे; टेढ़ी-मेढ़ी भूमि[a] समतल हो जाएगी, और ऊबड़-खाबड़ भूभाग[b] मैदान बन जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ऊँची-नीची भूमि’; इब्रानी शब्द टेढ़े या असमतल भूभाग को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पर्वतीय धारियाँ’; इब्रानी संज्ञा दुर्लभ है और सामान्य रूप से खुरदरे या उभरे हुए भूभाग को सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּיא
  choice: घाटी
  rationale: यह शब्द घाटी या खड्ड को सूचित करता है। यहाँ पहाड़ और पहाड़ी के साथ स्थलाकृतिक विरोध के कारण ‘घाटी’ स्वाभाविक और व्यापक अर्थ देता है।
- source_word: יִנָּשֵׂא
  choice: ऊँची की जाएगी
  rationale: निफ़अल रूप घाटी के ऊपर उठाए जाने का निष्क्रिय भाव देता है; हिंदी में यह अभिव्यक्ति दृश्य को स्पष्ट और स्वाभाविक रखती है।
- source_word: הַר וְגִבְעָה
  choice: पहाड़ और पहाड़ी
  rationale: दोनों शब्द क्रमशः बड़ी और अपेक्षाकृत छोटी ऊँचाई बताते हैं; यह प्रचलित हिंदी युग्म मूल भेद को बनाए रखता है।
- source_word: יִשְׁפָּלוּ
  choice: नीचे कर दिए जाएँगे
  rationale: क्रिया नीचा होने या किए जाने का भाव रखती है। समानांतर पंक्ति के निष्क्रिय रूप के अनुरूप यह अनुवाद स्थल को नीचा किए जाने को स्पष्ट करता है।
- source_word: הֶעָקֹב
  choice: टेढ़ी-मेढ़ी भूमि
  rationale: शब्द टेढ़े, वक्र या असमतल भूभाग को बता सकता है। सड़क तैयार करने के प्रसंग में यह भौतिक भूभाग का स्वाभाविक हिंदी वर्णन है।
- source_word: לְמִישׁוֹר
  choice: समतल
  rationale: מִישׁוֹר समतल भूमि या मैदान को दर्शाता है; ‘टेढ़ी-मेढ़ी भूमि’ के विपरीत ‘समतल’ संक्षिप्त और स्पष्ट है।
- source_word: הָרְכָסִים
  choice: ऊबड़-खाबड़ स्थान
  rationale: यह दुर्लभ संज्ञा खुरदरे, उभरे हुए या धारदार भूभाग को सूचित कर सकती है। ‘ऊबड़-खाबड़ स्थान’ अनिश्चितता को सामान्य भूभाग के रूप में बनाए रखता है।
- source_word: לְבִקְעָה
  choice: मैदान
  rationale: בִקְעָה चौड़ी घाटी या मैदान को दर्शाता है। पहले प्रयुक्त ‘घाटी’ की अनावश्यक पुनरावृत्ति से बचते हुए ‘मैदान’ परिणामी समतल भूभाग को व्यक्त करता है।
theological_decisions:
- issue: चित्रण का स्वरूप
  choice: मुख्य पाठ में भौतिक भू-दृश्य के परिवर्तन के रूप में अनुवाद
  alternative: इसे घमंडियों के नम्र किए जाने और दीनों के ऊँचे उठाए जाने अथवा प्रभु के आगमन की युगांतकारी तैयारी के रूप में सीधे शब्दों में व्यक्त करना
  rationale: इब्रानी पाठ तत्काल प्रसंग में मार्ग तैयार करने से जुड़ा ठोस स्थलाकृतिक चित्र प्रस्तुत करता है। रूपकात्मक और युगांतकारी अर्थ संदर्भ से निकल सकते हैं, पर उन्हें अनुवाद के शब्दों में जोड़ना मूल की खुली अर्थ-सम्भावना को सीमित कर देगा।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और काव्यात्मक गद्य रखा गया है। निष्क्रिय क्रियाएँ मूल के समानांतर ढाँचे को बनाए रखती हैं, जबकि दुर्लभ स्थलाकृतिक पदों की अनिश्चितता पादटिप्पणियों में सुरक्षित है।
