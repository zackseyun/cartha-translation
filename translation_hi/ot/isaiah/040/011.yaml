base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/011.yaml
  text: Like a shepherd he will pasture his flock[a]; with his arm he will gather the lambs, and in his bosom he will carry them[c][b]; he will gently lead the nursing ewes.
translation:
  language: hi
  text: चरवाहे के समान वह अपने झुंड को चराएगा[a]; वह अपनी बाँह से मेमनों को इकट्ठा करेगा और उन्हें अपनी छाती से लगाकर लिए चलेगा[b]; दूध पिलाने वाली भेड़ों को वह धीरे-धीरे ले चलेगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चरवाहे की तरह वह अपने झुंड की देखभाल करेगा।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपनी छाती में” या “अपने वक्ष में”; यह निकट और कोमल देखभाल का चित्र है।
    reason: cultural_note
  - marker: c
    text: या, “बच्चोंवाली भेड़ों को।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרֹעֶה
  choice: चरवाहे के समान
  rationale: उपसर्ग כְּ तुलना प्रकट करता है। यह अभिव्यक्ति चरवाहे के रूपक को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: עֶדְרוֹ יִרְעֶה
  choice: वह अपने झुंड को चराएगा
  rationale: עֵדֶר यहाँ भेड़ों के झुंड को और רעה चराने अथवा चरवाहे की तरह देखभाल करने को दर्शाता है। मुख्य पाठ में ठोस चरवाही-चित्र रखा गया है।
- source_word: בִּזְרֹעוֹ
  choice: अपनी बाँह से
  rationale: בְּ यहाँ साधन का भाव देता है। एकवचन 'बाँह' मूल चित्र और सामर्थ्य के संकेत को सुरक्षित रखता है।
- source_word: יְקַבֵּץ טְלָאִים
  choice: मेमनों को इकट्ठा करेगा
  rationale: קבץ का सामान्य अर्थ इकट्ठा करना है और טְלָאִים मेमनों को दर्शाता है।
- source_word: וּבְחֵיקוֹ יִשָּׂא
  choice: उन्हें अपनी गोद में उठाए रहेगा
  rationale: חֵיק छाती से लगी गोद का निकटता और कोमल देखभाल वाला चित्र देता है; נשא उठाने और लिए रहने, दोनों का भाव रखता है।
- source_word: עָלוֹת
  choice: दूध पिलानेवाली भेड़ों
  rationale: यह स्त्रीलिंग बहुवचन रूप उन मादा पशुओं को सूचित करता है जो बच्चों को दूध पिला रही हैं; संदर्भ के अनुसार 'भेड़ों' को स्पष्ट किया गया है।
- source_word: יְנַהֵל
  choice: धीरे-धीरे ले चलेगा
  rationale: נהל मार्ग दिखाते हुए ले चलने का अर्थ देता है। दूध पिलानेवाली भेड़ों के संदर्भ में यह सावधान और कोमल अगुवाई का भाव व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के चरवाहे का रूपक
  choice: चरवाही के रूपक को सीधे रूप में बनाए रखा गया है।
  alternative: अनुवाद में बाद की मसीही या मसीह-संबंधी पूर्ति को स्पष्ट रूप से जोड़ना।
  rationale: पद अपने संदर्भ में याहवे की सामर्थ्यपूर्ण और कोमल देखभाल को चरवाहे के चित्र द्वारा दिखाता है। अनुवाद मूल चित्र को रखता है और बाद की धर्मवैज्ञानिक व्याख्या को पाठ में नहीं मिलाता।
- issue: עָלוֹת का आशय
  choice: दूध पिलानेवाली भेड़ों
  alternative: बच्चोंवाली भेड़ों
  rationale: मूल शब्द दूध पिलानेवाली मादाओं को सूचित कर सकता है, पर बच्चों के साथ रहने वाली मादाओं का व्यापक अर्थ भी संभव है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण है। 'गोद' ने मूल के अंतरंग चित्र को स्वाभाविक हिन्दी में रखा है; 'धीरे-धीरे ले चलेगा' असहाय पशुओं के प्रति सावधानी को व्यक्त करता है, बिना रूपक में बाद की धर्मवैज्ञानिक व्याख्या जोड़े।
