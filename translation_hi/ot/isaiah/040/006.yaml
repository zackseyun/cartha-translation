source:
  edition: WLC
  text: ק֚וֹל אֹמֵ֣ר קְרָ֔א וְ/אָמַ֖ר מָ֣ה אֶקְרָ֑א כָּל הַ/בָּשָׂ֣ר חָצִ֔יר וְ/כָל חַסְדּ֖/וֹ כְּ/צִ֥יץ הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/006.yaml
  text: A voice says[a], “Cry out!” And I said, “What shall I cry?” All flesh is grass[c][b], and all its loveliness is like the flower of the field.
translation:
  language: hi
  text: एक आवाज़ कहती है[a], “पुकार!” और मैंने कहा, “मैं क्या पुकारूँ?” सारी मानवजाति घास है[b], और उसकी सारी शोभा मैदान के फूल के समान है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक अन्य पारंपरिक पठन के अनुसार: “और किसी ने कहा” अथवा “और उसने कहा।”'
    reason: alternative_reading
  - marker: b
    text: 'शाब्दिक रूप से: “सारा मांस”; अर्थात समस्त मानवजाति या सभी मनुष्य।'
    reason: lexical_alternative
  - marker: c
    text: या “उसकी सारी महिमा।” यहाँ प्रयुक्त इब्रानी शब्द उस वस्तु को दर्शा सकता है जो सुंदर, भव्य या प्रशंसनीय हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל אֹמֵר
  choice: एक आवाज़ कहती है
  rationale: קוֹל यहाँ किसी अज्ञात बोलने वाले की आवाज़ को दर्शाता है, और कृदंत אֹמֵר दृश्य को वर्तमान तथा सजीव रूप में प्रस्तुत करता है।
- source_word: קְרָא / אֶקְרָא
  choice: पुकारकर कह / मैं क्या पुकारकर कहूँ
  rationale: קרא की पुनरावृत्ति को दोनों वाक्यों में एक ही पदबंध से बनाए रखा गया है; इससे ऊँचे स्वर में सार्वजनिक घोषणा करने का भाव स्पष्ट होता है।
- source_word: וְאָמַר
  choice: और मैंने कहा
  rationale: मसोरेटी स्वरांकन प्रथम पुरुष पाठ का समर्थन करता है। व्यंजनात्मक पाठ से संभव तृतीय पुरुष पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: כָּל הַבָּשָׂר
  choice: समस्त मानवजाति
  rationale: शाब्दिक रूप से 'सारा मांस' होने पर भी इस प्रसंग में यह समस्त नश्वर मनुष्यों का सामूहिक संकेत है। स्वाभाविक आधुनिक हिन्दी में 'समस्त मानवजाति' अर्थ को स्पष्ट रखता है।
- source_word: חָצִיר
  choice: घास
  rationale: नश्वरता के रूपक में यह सामान्य और स्पष्ट हिन्दी समतुल्य है।
- source_word: חַסְדּוֹ
  choice: उसकी सारी शोभा
  rationale: חסד प्रायः करुणा या निष्ठावान प्रेम दर्शाता है, पर यहाँ फूल के समानांतर मनुष्य की आकर्षक, प्रशंसनीय अथवा वैभवपूर्ण विशेषता का बोध कराता है। 'शोभा' इस संदर्भगत अर्थ को संक्षेप में व्यक्त करती है।
- source_word: כְּצִיץ הַשָּׂדֶה
  choice: मैदान के फूल के समान
  rationale: ציץ फूल या पुष्प है; 'मैदान का फूल' क्षणभंगुर जंगली फूल की सामान्य छवि को सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: וְאָמַר में वक्ता की पहचान
  choice: 'प्रथम पुरुष: “और मैंने कहा”'
  alternative: “और किसी ने कहा” अथवा “और उसने कहा”
  rationale: मसोरेटी स्वरांकन प्रथम पुरुष है, इसलिए मुख्य पाठ में वही रखा गया है। संवाद के वक्ता की पहचान को अनावश्यक रूप से निश्चित न करने हेतु पारंपरिक वैकल्पिक पठन पादटिप्पणी में दिया गया है।
- issue: חַסְדּוֹ का प्रसंगगत अर्थ
  choice: शोभा
  alternative: उसकी सारी महिमा; शाब्दिक अर्थ-क्षेत्र में करुणा/निष्ठा
  rationale: निकटवर्ती फूल की उपमा यहाँ मानव जीवन की क्षणभंगुर आकर्षकता या वैभव की ओर संकेत करती है। वाचा-संबंधी अर्थ को बिना प्रसंगगत आधार के आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। 'पुकारकर कह' काव्यात्मक भविष्यद्वाणी की सार्वजनिक घोषणा का बल और मूल धातु की पुनरावृत्ति बनाए रखता है। 'समस्त मानवजाति' साधारण पाठक के लिए 'सारा मांस' की अपेक्षा अधिक स्वाभाविक है, जबकि शाब्दिक अभिव्यक्ति पादटिप्पणी में संरक्षित है।
