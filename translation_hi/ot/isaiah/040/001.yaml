source:
  edition: WLC
  text: נַחֲמ֥וּ נַחֲמ֖וּ עַמִּ֑/י יֹאמַ֖ר אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/001.yaml
  text: Comfort[a], comfort my people[b], says your God.
translation:
  language: hi
  text: “मेरी प्रजा को सांत्वना दो, सांत्वना दो,” तुम्हारा परमेश्वर कहता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारा परमेश्वर कहेगा।”
    reason: इब्रानी יֹאמַר रूपतः अपूर्ण काल है और भविष्यकालीन अर्थ दे सकता है; भविष्यद्वाणी के कथन-परिचय में ‘कहता है’ भी स्वाभाविक है।
lexical_decisions:
- source_word: נַחֲמוּ
  choice: सांत्वना दो
  rationale: पिएल बहुवचन आज्ञार्थक यहाँ दूसरों को ढाढ़स और सांत्वना देने का सीधा आह्वान है। ‘सांत्वना दो’ आधुनिक मानक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: נַחֲמוּ נַחֲמוּ
  choice: सांत्वना दो, सांत्वना दो
  rationale: दोहराव को ज्यों का त्यों रखा गया है, जिससे इब्रानी की प्रबलता, तात्कालिकता और गंभीर लय बनी रहती है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: यह सामुदायिक और वाचागत संबंध दोनों व्यक्त करता है; ‘प्रजा’ बाइबलीय प्रसंग में स्वाभाविक है और इसे केवल राजनीतिक ‘राष्ट्र’ तक सीमित नहीं करता।
- source_word: יֹאמַר
  choice: कहता है
  rationale: रूप की दृष्टि से यह अपूर्ण काल है और ‘कहेगा’ हो सकता है, पर भविष्यद्वाणी के कथन-परिचय में वर्तमानार्थक ‘कहता है’ हिन्दी में स्वाभाविक है। मूल रूप का संभावित भाव पादटिप्पणी में रखा गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: यहाँ אֱלֹהִים एकवचन अर्थ में इस्राएल के परमेश्वर के लिए है; द्वितीय पुरुष बहुवचन संबंधसूचक प्रत्यय को ‘तुम्हारा’ से व्यक्त किया गया है।
theological_decisions:
- issue: वक्ता की पहचान और वाचागत स्वर
  choice: ‘मेरी प्रजा’ और ‘तुम्हारा परमेश्वर’ को बनाए रखते हुए इसे परमेश्वर के कथन के रूप में प्रस्तुत किया गया है; आदेश पाने वालों की पहचान नहीं जोड़ी गई।
  alternative: ‘तुम्हारा परमेश्वर कहेगा’ द्वारा अधिक स्पष्ट भविष्यकालीन भाव देना।
  rationale: पद पुनर्स्थापित संबंध की कोमलता और अधिकार दोनों व्यक्त करता है। अनुवाद यह तनाव बनाए रखता है और बहुवचन आज्ञा के संबोधित व्यक्तियों के बारे में मूल से अधिक नहीं कहता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल स्वर। ‘सांत्वना’ सामान्य पाठक के लिए बोधगम्य है, जबकि ‘प्रजा’ वाचागत-सामुदायिक गरिमा बनाए रखती है।
