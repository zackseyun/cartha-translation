base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/019.yaml
  text: As for the idol, a craftsman casts it, and a goldsmith overlays it with gold and forges silver chains for it.
translation:
  language: hi
  text: मूर्ति को कारीगर ढालता है; सुनार उस पर सोना मढ़ता और उसके लिए चाँदी की ज़ंजीरें गढ़ता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפֶּסֶל
  choice: मूर्ति
  rationale: यह शब्द तराशी या ढाली हुई उपासना-वस्तु को सूचित करता है; आधुनिक हिन्दी में ‘मूर्ति’ स्वाभाविक और संदर्भानुकूल है।
- source_word: נָסַךְ
  choice: ढालता है
  rationale: धातु को पिघलाकर साँचे में डालने की कारीगरी यहाँ अभिप्रेत है; ‘ढालता है’ इस प्रक्रिया को स्पष्ट और संक्षेप में व्यक्त करता है।
- source_word: יְרַקְּעֶנּוּ
  choice: उस पर सोना मढ़ता
  rationale: मूल क्रिया धातु को पीटकर पतला फैलाने का भाव रखती है; इस प्रसंग में मूर्ति पर सोने की परत चढ़ाना अभिप्रेत है, जिसके लिए हिन्दी में ‘सोना मढ़ता’ स्वाभाविक है।
- source_word: וּרְתֻקוֹת כֶּסֶף צוֹרֵף
  choice: और उसके लिए चाँदी की ज़ंजीरें गढ़ता है
  rationale: רְתֻקוֹת का अर्थ ज़ंजीरें है और צוֹרֵף यहाँ धातु-कर्म द्वारा उन्हें बनाने का भाव देता है; ‘गढ़ता है’ कारीगरी को व्यक्त करता है, जबकि ‘उसके लिए’ मूर्ति से उनका संबंध स्पष्ट करता है।
theological_decisions:
- issue: הַפֶּסֶל के लिए शब्द-चयन
  choice: मूर्ति
  alternative: मूरत / खुदी हुई प्रतिमा
  rationale: ‘मूर्ति’ किसी विशेष सम्प्रदायगत व्याख्या को जोड़े बिना निर्मित उपासना-वस्तु का सामान्य, प्रतिष्ठित हिन्दी नाम है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। मूल पद की कारीगरी-संबंधी क्रियाओं को स्पष्ट हिन्दी में व्यक्त किया गया है और आरम्भिक विषय-प्रमुख संरचना ‘मूर्ति को’ से बनाए रखी गई है।
