  text: שְׂאוּ מָר֨וֹם עֵינֵי/כֶ֤ם וּ/רְאוּ֙ מִי בָרָ֣א אֵ֔לֶּה הַ/מּוֹצִ֥יא בְ/מִסְפָּ֖ר צְבָאָ֑/ם לְ/כֻלָּ/ם֙ בְּ/שֵׁ֣ם יִקְרָ֔א מֵ/רֹ֤ב אוֹנִים֙ וְ/אַמִּ֣יץ כֹּ֔חַ אִ֖ישׁ לֹ֥א נֶעְדָּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/026.yaml
  text: 'Lift up your eyes on high and see: who created these? He who brings out their host by number[a], calling all of them by name. Because of the greatness of his might and the strength of his power[c][b], not one is missing.'
translation:
  language: hi
  text: 'अपनी आँखें ऊपर उठाकर देखो: किसने इन्हें रचा? वही इनके समूह को गिनती के अनुसार बाहर निकालता है[a] और उन सबको नाम लेकर पुकारता है। उसके अपार सामर्थ्य और प्रबल शक्ति के कारण उनमें से एक भी अनुपस्थित नहीं होता[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “इनका समूह” आकाश में व्यवस्थित असंख्य पिंडों, विशेषकर तारों, की ओर संकेत करता है।
    reason: cultural_note
  - marker: b
    text: शाब्दिक रूप से, “एक व्यक्ति भी अनुपस्थित नहीं है” या “एक जन भी घटता नहीं।” यह इब्रानी की वितरणात्मक अभिव्यक्ति है, जिसका अर्थ है कि उनमें से कोई भी अनुपस्थित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ מָרוֹם עֵינֵיכֶם
  choice: अपनी आँखें ऊपर उठाकर
  rationale: बहुवचन आज्ञार्थक और ऊपर की ओर देखने की स्थानिक गति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מִי בָרָא אֵלֶּה
  choice: किसने इनको सृजा?
  rationale: मूल के आलंकारिक प्रश्न और संकेतवाचक 'इनको' को बनाए रखता है; संदर्भ को मुख्य पाठ में 'तारे' कहकर अनावश्यक रूप से सीमित नहीं करता।
- source_word: הַמּוֹצִיא בְמִסְפָּר צְבָאָם
  choice: वही इनके समूह को गिनती के अनुसार बाहर ले आता है
  rationale: संज्ञात्मक कृदन्त को स्पष्ट हिन्दी संबंध 'वही' से जोड़ता है। 'समूह' צבא के व्यवस्थित बहुल समुदाय का अर्थ देता है, और 'गिनती के अनुसार' क्रमबद्ध गणना का भाव रखता है।
- source_word: לְכֻלָּם בְּשֵׁם יִקְרָא
  choice: उन सबको नाम लेकर पुकारता है
  rationale: मूल के 'उन सबको' और एकवचन 'नाम' की रचना को स्वाभाविक हिन्दी में निकटता से रखता है।
- source_word: מֵרֹב אוֹנִים וְאַמִּיץ כֹּחַ
  choice: उसके अपार सामर्थ्य और प्रबल शक्ति के कारण
  rationale: מִן को संदर्भानुसार कारणसूचक मानते हुए दोनों शक्ति-सूचक पदों की गहन समानांतरता बनाए रखता है।
- source_word: אִישׁ לֹא נֶעְדָּר
  choice: उनमें से एक भी अनुपस्थित नहीं रहता
  rationale: אִישׁ यहाँ पुरुष-विशेष नहीं, वितरणात्मक रूप से प्रत्येक सदस्य को सूचित करता है; यह हिन्दी अभिव्यक्ति उसी अर्थ को स्पष्ट और स्वाभाविक बनाती है।
theological_decisions:
- issue: '''इनको'' और ''इनके समूह'' का संदर्भ'
  choice: मुख्य पाठ में संकेत को खुला रखते हुए इसे आकाशीय पिंडों के व्यवस्थित समुदाय के रूप में समझना
  alternative: मुख्य पाठ में सीधे 'तारे' लिखना
  rationale: ऊपर देखने, समूह को निकालने, गिनने और नाम लेकर पुकारने का निकट संदर्भ तारों/आकाशीय पिंडों की ओर संकेत करता है; फिर भी मूल में 'तारे' शब्द नहीं है, इसलिए उसे पाठ में जोड़ना उचित नहीं।
- issue: אִישׁ का वितरणात्मक प्रयोग
  choice: '''एक भी अनुपस्थित नहीं रहता'''
  alternative: '''कोई मनुष्य नहीं घटता'' अथवा ''एक भी लापता नहीं होता'''
  rationale: यहाँ אִישׁ समूह के हर एक सदस्य के लिए वितरणात्मक है, न कि मानव पुरुष के अर्थ में। चुना हुआ रूप अर्थ को बिना भ्रामक लैंगिक विशिष्टता के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। 'सृजा', 'सामर्थ्य' और 'प्रबल शक्ति' काव्यात्मक-भविष्यद्वक्तापरक गंभीरता बनाए रखते हैं; वाक्य-विन्यास मूल की प्रश्नात्मकता और समानांतर बलाघात को सुरक्षित रखता है।
