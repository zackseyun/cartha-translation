base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/029.yaml
  text: He gives strength to the weary[a], and to the one without vigor he increases might.
translation:
  language: hi
  text: 'वह थके हुए को बल देता है,

    और जिसके पास सामर्थ्य नहीं है, उसकी शक्ति बढ़ाता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֹתֵן
  choice: देता है
  rationale: कर्तृवाचक कृदन्त यहाँ परमेश्वर के सामान्य और निरंतर चरित्रगत कार्य को व्यक्त करता है; हिन्दी का सामान्य वर्तमान स्वाभाविक रूप से यह भाव देता है।
- source_word: לַיָּעֵף
  choice: थके हुए को
  rationale: यह शब्द थककर चूर या निर्बल हो चुके व्यक्ति को दर्शाता है। ‘थके हुए’ आधुनिक, सहज हिन्दी है और काव्यात्मक समानांतरता में उपयुक्त है।
- source_word: כֹּחַ
  choice: बल
  rationale: यहाँ आशय व्यक्ति की कार्य-क्षमता या ताकत से है। ‘बल’ संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: וּלְאֵין אוֹנִים
  choice: और जिसमें सामर्थ्य नहीं
  rationale: אֵין अभाव व्यक्त करता है और אוֹנִים जीवन-शक्ति या सामर्थ्य को। यह अनुवाद अभाव की तीव्रता और व्यक्ति-संदर्भ दोनों को बनाए रखता है।
- source_word: עָצְמָה
  choice: शक्ति
  rationale: यह संज्ञा प्रबलता या शक्ति को दर्शाती है। पहले पद के ‘बल’ से अर्थगत समानांतरता रखते हुए शब्दगत विविधता भी बनी रहती है।
- source_word: יַרְבֶּה
  choice: बढ़ाता है
  rationale: רבה का हिफ़ील रूप किसी वस्तु को अधिक करने का कारणवाचक अर्थ देता है; ‘बढ़ाता है’ हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: पद का अंतर्निहित कर्ता
  choice: ‘वह’ से परमेश्वर का संकेत
  alternative: कर्ता को व्यक्त न करना
  rationale: इब्रानी पद में कर्ता अलग से लिखा नहीं है, पर निकटवर्ती प्रसंग में कर्ता यहोवा है। हिन्दी में स्पष्ट और स्वाभाविक वाक्य के लिए ‘वह’ उचित है, जबकि परमेश्वर का नाम जोड़ना मूल से अधिक स्पष्टता देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण काव्यात्मक शैली। दोनों समानांतर पंक्तियों में ‘बल’ और ‘शक्ति’ रखकर इब्रानी समानांतरता तथा शब्दगत भिन्नता संरक्षित की गई है।
