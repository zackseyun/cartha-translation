source:
  edition: WLC
  text: מִֽי תִכֵּ֥ן אֶת ר֖וּחַ יְהוָ֑ה וְ/אִ֥ישׁ עֲצָת֖/וֹ יוֹדִיעֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/013.yaml
  text: Who has measured the Spirit of Yahweh[b][a], or what man has made his counsel known to him?
translation:
  language: hi
  text: किसने याहवे की आत्मा[a] को नापा है,[b] या कौन मनुष्य याहवे को उसके परामर्श से अवगत करा सकता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे का मन।” हिब्रू शब्द का अर्थ आत्मा, श्वास या आन्तरिक मनोभाव हो सकता है; रोमियों 11:34 में प्रतिबिम्बित यूनानी परम्परा में “मन” है।
    reason: lexical_alternative
  - marker: b
    text: 'या “याहवे की आत्मा को दिशा दी है”; भावार्थ: “उसे निर्देश दे सकता है।” ये हिब्रू क्रियाओं और प्राचीन यूनानी परम्परा पर आधारित व्याख्यात्मक अनुवाद हैं।'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי
  choice: किसने
  rationale: यह प्रश्नवाचक सर्वनाम एक आलंकारिक प्रश्न आरम्भ करता है; क्रिया के साथ ‘किसने’ सहज और सटीक है।
- source_word: תִכֵּן
  choice: नापा है
  rationale: मूल क्रिया नापने, तौलने या परिमाण ठहराने का भाव रखती है। ‘नापा है’ निकटवर्ती पदों की माप-सम्बन्धी छवि को बनाए रखता है।
- source_word: רוּחַ
  choice: आत्मा
  rationale: רוּחַ का अर्थ आत्मा, श्वास, वायु या आन्तरिक मनोभाव हो सकता है। परमेश्वर के नाम के साथ ‘आत्मा’ स्वाभाविक है, जबकि ‘मन’ की सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम है; इसलिए किसी उपाधि से बदलने के बजाय उसका हिन्दी लिप्यंतरण किया गया है।
- source_word: וְאִישׁ
  choice: और कौन मनुष्य
  rationale: शाब्दिक ‘और मनुष्य’ में निहित प्रश्नवाचक बल को हिन्दी में स्पष्ट करने के लिए ‘कौन’ दोहराया गया है।
- source_word: עֲצָתוֹ
  choice: उसकी सम्मति
  rationale: עֵצָה सलाह, सम्मति, योजना या अभिप्राय का अर्थ दे सकता है। ‘सम्मति’ विचार और परामर्श—दोनों की छाया बनाए रखती है।
- source_word: יוֹדִיעֶנּוּ
  choice: उसे … बता सकता है
  rationale: ידע का हिफ़ील रूप ‘ज्ञात कराना’ या ‘बताना’ है और प्रत्यय ‘उसे’ को दर्शाता है। आलंकारिक प्रश्न का सामर्थ्य-बोध स्वाभाविक हिन्दी में ‘सकता है’ से व्यक्त किया गया है।
theological_decisions:
- issue: רוּחַ יְהוָה का अर्थ
  choice: याहवे की आत्मा
  alternative: याहवे का मन
  rationale: ‘आत्मा’ हिब्रू के प्रमुख अर्थ को बनाए रखता है, पर ‘मन’ का अर्थ भी सम्भव है और यूनानी परम्परा तथा रोमियों 11:34 में प्रतिबिम्बित होता है; इसे पादटिप्पणी में रखा गया है।
- issue: תִכֵּן का अर्थ
  choice: नापा है
  alternative: दिशा दी है / निर्देश दिया है
  rationale: ‘नापा’ क्रिया के मूल माप-सम्बन्धी अर्थ और यशायाह 40 के प्रसंग को सुरक्षित रखता है; ‘निर्देश दिया’ प्राचीन अनुवाद-परम्परा से जुड़ी व्याख्यात्मक सम्भावना है।
- issue: दूसरे खण्ड में परामर्श का सम्बन्ध
  choice: कौन मनुष्य उसे उसकी सम्मति बता सकता है
  alternative: कौन उसका सलाहकार बनकर उसे शिक्षा दे सकता है
  rationale: मुख्य पाठ ידע के ‘ज्ञात कराना’ अर्थ और עצה के ‘सम्मति’ अर्थ के निकट रहता है। वैकल्पिक रूप परामर्शदाता और शिक्षण का निहितार्थ अधिक स्पष्ट करता है, पर मूल की व्याकरणिक कसावट को व्याख्या द्वारा खोल देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘याहवे’ व्यक्तिगत ईश्वरीय नाम का लिप्यंतरण है। मुख्य पाठ में मापने की ठोस छवि और दूसरे खण्ड की कठिन, तनावपूर्ण अभिव्यक्ति को अनावश्यक रूप से सरल नहीं किया गया।
