  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ק֣וֹל קוֹרֵ֔א בַּ/מִּדְבָּ֕ר פַּנּ֖וּ דֶּ֣רֶךְ יְהוָ֑ה יַשְּׁרוּ֙ בָּ/עֲרָבָ֔ה מְסִלָּ֖ה לֵ/אלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/003.yaml
  text: 'A voice cries: “In the wilderness prepare the way of Yahweh[a]; make straight in the desert a highway for our God.”'
translation:
  language: hi
  text: 'एक आवाज़ पुकारती है: “निर्जन प्रदेश में याहवे का मार्ग तैयार करो; मरुभूमि में हमारे परमेश्वर के लिए एक राजमार्ग सीधा करो।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'दूसरे विराम-विन्यास के अनुसार: “निर्जन प्रदेश में एक आवाज़ पुकारती है, ‘याहवे का मार्ग तैयार करो; मरुभूमि में हमारे परमेश्वर के लिए एक राजमार्ग सीधा करो।’”'
    reason: alternative_reading
lexical_decisions:
- source_word: ק֣וֹל
  choice: एक आवाज़
  rationale: קוֹל का सामान्य अर्थ ‘आवाज़’ या ‘ध्वनि’ है। यहाँ अगले कृदंत קוֹרֵא के साथ ‘एक आवाज़’ भविष्यद्वाणी की घोषणा का स्वाभाविक हिन्दी रूप है।
- source_word: קוֹרֵא
  choice: पुकारती है
  rationale: यह कृदंत शाब्दिक रूप से ‘पुकार रही’ का भाव देता है। ‘पुकारती है’ वर्तमान और सजीव घोषणात्मक बल को सहज हिन्दी में बनाए रखता है।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר निर्जन, कम आबादी वाले वन्य प्रदेश को सूचित करता है; ‘निर्जन प्रदेश’ आधुनिक हिन्दी में स्पष्ट है और इसे मरुभूमि मात्र तक सीमित नहीं करता। मसोरेटी उच्चारण-चिह्नों के अनुसार इसे अगले आदेश के साथ जोड़ा गया है।
- source_word: פַּנּוּ
  choice: तैयार करो
  rationale: इस प्रसंग में פנה का आदेशात्मक रूप रास्ता साफ़ या तैयार करने का अर्थ रखता है। ‘तैयार करो’ मार्ग-निर्माण की छवि और स्वाभाविक हिन्दी दोनों को बनाए रखता है।
- source_word: דֶּרֶךְ
  choice: मार्ग
  rationale: דֶּרֶךְ रास्ते या मार्ग को दर्शाता है। ‘मार्ग’ इस राजकीय और भविष्यद्वाणी-संबंधी संदर्भ के अनुकूल, गरिमापूर्ण और सामान्यतः बोधगम्य है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण ‘याहवे’ द्वारा प्रस्तुत किया गया है।
- source_word: יַשְּׁרוּ
  choice: सीधा करो
  rationale: इस क्रिया का अर्थ सीधा या समतल करना है। ‘सीधा करो’ मूल रूपक को स्पष्ट रूप से बनाए रखता है और पहले आदेश के समानांतर है।
- source_word: בָּעֲרָבָה
  choice: मरुभूमि में
  rationale: עֲרָבָה शुष्क मैदान या रेगिस्तानी स्टेपी को सूचित करता है। ‘मरुभूमि’ इस भौगोलिक और काव्यात्मक भाव को संक्षेप में व्यक्त करता है।
- source_word: מְסִלָּה
  choice: एक राजमार्ग
  rationale: מְסִלָּה विशेष रूप से बनाया या ऊँचा किया गया मार्ग हो सकता है। ‘राजमार्ग’ साधारण पगडंडी के बजाय विधिवत तैयार बड़े मार्ग और संभावित राजकीय आगमन की छवि व्यक्त करता है।
- source_word: לֵאלֹהֵינוּ
  choice: हमारे परमेश्वर के लिए
  rationale: אֱלֹהִים रूप की दृष्टि से बहुवचन जैसा है, पर यहाँ प्रत्यय और प्रसंग के साथ इस्राएल के एक परमेश्वर के लिए सामान्य एकवचन प्रयोग है।
theological_decisions:
- issue: ‘निर्जन प्रदेश में’ पदबंध का वाक्यगत संबंध
  choice: 'इसे अगले आदेश से जोड़ना: ‘निर्जन प्रदेश में याहवे का मार्ग तैयार करो।’'
  alternative: 'इसे पुकारने वाली आवाज़ से जोड़ना: ‘निर्जन प्रदेश में एक आवाज़ पुकारती है, “याहवे का मार्ग तैयार करो।”’'
  rationale: मसोरेटी उच्चारण-चिह्न इस पदबंध को अगले आदेश से जोड़ने का समर्थन करते हैं। फिर भी इब्रानी व्यंजन-पाठ दूसरी वाक्य-रचना की संभावना को पूरी तरह समाप्त नहीं करता, और वही रूप बाद के प्राचीन उद्धरणों में प्रसिद्ध है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। समानांतर काव्य-पंक्तियों में ‘निर्जन प्रदेश/मरुभूमि’ और ‘मार्ग/राजमार्ग’ का भेद मूल इब्रानी शब्दावली और सड़क तैयार करने की छवि को बनाए रखता है।
