base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/022.yaml
  text: He is the one who sits above the circle of the earth[a], and its inhabitants are like grasshoppers[b]; who stretches out the heavens like a curtain and spreads them out like a tent to dwell in.
translation:
  language: hi
  text: वही है जो पृथ्वी के वृत्त[a] के ऊपर विराजमान है, और उसके निवासी टिड्डों के समान हैं; वही आकाश को महीन परदे[b] की तरह तानता है और उसे रहने के लिए तंबू की तरह फैलाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पृथ्वी के मंडल’, ‘पृथ्वी की मेहराब’ अथवा ‘पृथ्वी के क्षितिज’। इब्रानी शब्द गोल विस्तार या गुंबद-जैसी सीमा को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘महीन कपड़े’ अथवा ‘झीने आवरण’। इब्रानी शब्द किसी पतली या महीन वस्तु को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיֹּשֵׁב
  choice: वही है जो … विराजमान है
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत परमेश्वर की निरंतर अवस्था बताता है। ‘विराजमान’ ऊँचे, काव्यात्मक प्रसंग में स्वाभाविक है, पर इसमें ‘सिंहासन पर’ जैसे अनुल्लिखित शब्द नहीं जोड़े गए।
- source_word: עַל חוּג הָאָרֶץ
  choice: पृथ्वी के वृत्त के ऊपर
  rationale: חוּג का सीधा चित्र ‘वृत्त’ है; ‘ऊपर’ इस प्रसंग में परमेश्वर की महानता और पृथ्वी से ऊँची स्थिति व्यक्त करता है। यह अनुवाद किसी आधुनिक वैज्ञानिक प्रतिपादन को पाठ में नहीं जोड़ता।
- source_word: וְיֹשְׁבֶיהָ
  choice: और उसके निवासी
  rationale: यह पृथ्वी पर रहनेवालों का संक्षिप्त और स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: כַחֲגָבִים
  choice: टिड्डों के समान
  rationale: חָגָב टिड्डे या फुदकनेवाले छोटे कीट को सूचित कर सकता है। यहाँ उपमा मनुष्यों की अत्यल्पता दिखाती है; ‘टिड्डे’ हिन्दी में परिचित और काव्यात्मक रूप है।
- source_word: הַנּוֹטֶה כַדֹּק שָׁמַיִם
  choice: आकाश को महीन परदे के समान फैलाता
  rationale: נטה फैलाने या तानने की क्रिया है और דֹק किसी महीन, पतली वस्तु को सूचित करता है। ‘महीन परदा’ चित्र को सहज हिन्दी में बनाए रखता है। बहुवचन שָׁמַיִם के लिए हिन्दी का स्वाभाविक सामूहिक शब्द ‘आकाश’ चुना गया।
- source_word: וַיִּמְתָּחֵם כָּאֹהֶל לָשָׁבֶת
  choice: रहने के लिए तंबू की तरह तान देता है
  rationale: מתח फैलाने/तानने को और אֹהֶל तंबू को सूचित करता है। לָשָׁבֶת उद्देश्य बताता है; हिन्दी वाक्य तंबू के निवास-स्थान होने का चित्र रखता है, बिना निवासी को अनावश्यक रूप से निश्चित किए।
theological_decisions:
- issue: חוּג הָאָרֶץ में ब्रह्मांड-संबंधी काव्यचित्र
  choice: ‘पृथ्वी का वृत्त’ रखकर काव्यात्मक और दृश्यात्मक भाषा को सुरक्षित रखा गया।
  alternative: ‘पृथ्वी का मंडल’, ‘पृथ्वी की मेहराब’ या ‘पृथ्वी का क्षितिज’
  rationale: पद का उद्देश्य परमेश्वर की श्रेष्ठता और सृजन-सामर्थ्य दिखाना है। ‘वृत्त’ मूल रूपक को आधुनिक वैज्ञानिक दावे या किसी एक प्राचीन ब्रह्मांड-मॉडल में बदले बिना प्रस्तुत करता है।
- issue: לָשָׁבֶת में रहनेवाले का अनिर्दिष्ट होना
  choice: ‘रहने के लिए’
  alternative: ‘जिसमें लोग रहें’ या ‘जिसमें वह रहे’
  rationale: इब्रानी उद्देश्यसूचक रूप स्पष्ट रूप से यह नहीं बताता कि रहनेवाला कौन है। अनुवाद ने इस वास्तविक अस्पष्टता को बनाए रखा है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी रखी गई है। ‘वही है जो’ दोहराकर इब्रानी के समानांतर कृदंतों को स्पष्ट किया गया है। अंग्रेज़ी परामर्श-पाठ में [b] का चिह्न ‘grasshoppers’ के बाद था, पर उसकी टिप्पणी דֹק (‘महीन/पतली वस्तु’) से संबंधित है; इसलिए हिन्दी में [b] को ‘महीन परदे’ के बाद रखा गया है।
