id: ISA.40.28
reference: Isaiah 40:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/ל֨וֹא יָדַ֜עְתָּ אִם לֹ֣א שָׁמַ֗עְתָּ אֱלֹהֵ֨י עוֹלָ֤ם יְהוָה֙ בּוֹרֵא֙ קְצ֣וֹת הָ/אָ֔רֶץ לֹ֥א יִיעַ֖ף וְ/לֹ֣א יִיגָ֑ע אֵ֥ין חֵ֖קֶר לִ/תְבוּנָתֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/028.yaml
  text: Have you not known? Have you not heard? Yahweh is the everlasting God[a], the Creator of the ends of the earth. He does not grow faint or become weary; his understanding is unsearchable.
translation:
  language: hi
  text: क्या तुम नहीं जानते? क्या तुमने नहीं सुना? याहवे[a] सनातन परमेश्वर हैं, पृथ्वी के छोरों के सृष्टिकर्ता। वह न शिथिल पड़ते हैं, न थकते हैं; उनकी समझ की थाह नहीं पाई जा सकती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में YHWH (יהוה), परमेश्वर का व्यक्तिगत नाम; इसका सटीक प्राचीन उच्चारण निश्चित नहीं है। इसे प्रायः ‘याहवे’ कहा और कई अनुवादों में ‘प्रभु’ लिखा जाता है।
    reason: ईश्वरीय नाम के मूल रूप, उच्चारण की अनिश्चितता और अनुवाद-परंपरा को स्पष्ट करना।
lexical_decisions:
- source_word: הֲלוֹא יָדַעְתָּ
  choice: क्या तुम नहीं जानते?
  rationale: नकारात्मक आलंकारिक प्रश्न ऐसी बात याद दिलाता है जिसे सुनने वाले को पहले से जानना चाहिए। ‘क्या तुम नहीं’ उसके स्मरण कराने और हल्की झिड़की के भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אִם לֹא שָׁמַעְתָּ
  choice: क्या तुमने नहीं सुना?
  rationale: यहाँ אִם לֹא शर्त नहीं, बल्कि पहले प्रश्न के समानांतर दूसरा आलंकारिक प्रश्न है।
- source_word: אֱלֹהֵי עוֹלָם
  choice: सनातन परमेश्वर
  rationale: शाब्दिक भाव ‘अनंतकाल के परमेश्वर’ है। ‘सनातन परमेश्वर’ परमेश्वर के अनादि-अनंत अस्तित्व को संक्षिप्त, प्रतिष्ठित और सहज हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले इब्रानी व्यक्तिगत नाम YHWH को उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकटवर्ती लिप्यंतरण ‘याहवे’ दिया गया है।
- source_word: בּוֹרֵא
  choice: सृष्टिकर्ता
  rationale: कर्तृवाचक कृदंत यहाँ परमेश्वर की पहचान बताने वाली संज्ञा के रूप में प्रयुक्त है; ‘सृष्टिकर्ता’ इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: קְצוֹת הָאָרֶץ
  choice: पृथ्वी के छोरों
  rationale: मूल का भौगोलिक बिंब बनाए रखते हुए यह पृथ्वी के दूर-दूर तक फैले समस्त विस्तार का संकेत देता है।
- source_word: לֹא יִיעַף
  choice: न शिथिल पड़ते हैं
  rationale: क्रिया थकावट से शक्ति क्षीण होने या निढाल पड़ने का भाव रखती है। ‘शिथिल पड़ना’ अगली क्रिया से कुछ भेद बनाए रखता है।
- source_word: וְלֹא יִיגָע
  choice: न थकते हैं
  rationale: यह क्रिया श्रम या प्रयास से थक जाने का सामान्य भाव व्यक्त करती है; सरल हिन्दी ‘थकते’ इसके लिए उपयुक्त है।
- source_word: אֵין חֵקֶר לִתְבוּנָתוֹ
  choice: उनकी समझ की थाह नहीं पाई जा सकती
  rationale: मूलतः ‘उसकी समझ की कोई खोज/जाँच नहीं’ का अर्थ है। हिन्दी मुहावरा ‘थाह नहीं पाई जा सकती’ उसकी समझ के अगम और पूरी तरह न जाँचे जा सकने वाले स्वरूप को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में उपाधि नहीं, परमेश्वर का व्यक्तिगत नाम YHWH है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है; पादटिप्पणी उच्चारण की अनिश्चितता और प्रचलित प्रतिस्थापन की जानकारी देती है।
- issue: אֱלֹהֵי עוֹלָם में עוֹלָם का आशय
  choice: सनातन परमेश्वर
  alternative: अनंतकाल के परमेश्वर
  rationale: ‘सनातन’ परमेश्वर के चिरस्थायी अस्तित्व का भाव रखता है, जबकि वाक्य को अस्वाभाविक रूप से अमूर्त नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली रखी गई है। इब्रानी का संबोधन व्याकरणतः पुल्लिंग एकवचन है, पर वह सामूहिक इस्राएल को संबोधित करता है; ‘तुम’ इस सामूहिक और प्रत्यक्ष संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है। परमेश्वर के लिए आदरसूचक बहुवचन क्रियाएँ और सर्वनाम प्रयुक्त हुए हैं।
