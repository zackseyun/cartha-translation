  text: אֶת מִ֤י נוֹעָץ֙ וַ/יְבִינֵ֔/הוּ וַֽ/יְלַמְּדֵ֖/הוּ בְּ/אֹ֣רַח מִשְׁפָּ֑ט וַ/יְלַמְּדֵ֣/הוּ דַ֔עַת וְ/דֶ֥רֶךְ תְּבוּנ֖וֹת יוֹדִיעֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/014.yaml
  text: Whom did he consult[a], and who gave him understanding? Who taught him the path of justice, taught him knowledge[b], and made known to him the way of understanding?
translation:
  language: hi
  text: उसने किससे परामर्श किया, और किसने उसे समझ दी? किसने उसे न्याय का मार्ग[a] सिखाया, उसे ज्ञान सिखाया, और उसे समझ-बूझ का मार्ग[b] बताया?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्णय का मार्ग।”
    reason: lexical_alternative
  - marker: b
    text: या, “अंतर्दृष्टि का मार्ग” अथवा “विवेक का पथ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת מִי נוֹעָץ
  choice: उसने किससे परामर्श किया
  rationale: निफ़अल रूप यहाँ किसी से सलाह लेने या परामर्श करने का भाव देता है। आधुनिक हिन्दी में ‘किससे परामर्श किया’ स्वाभाविक है और परमेश्वर की पूर्ण स्वतंत्र बुद्धि पर बल देने वाले आलंकारिक प्रश्न को स्पष्ट रखता है।
- source_word: וַיְבִינֵהוּ
  choice: किसने उसे समझ दी
  rationale: בין के हिफ़इल रूप का कारणवाचक अर्थ ‘समझ देना/समझाना’ है। ‘समझ दी’ संक्षिप्त, स्वाभाविक और कारणवाचक भाव के अनुकूल है।
- source_word: וַיְלַמְּדֵהוּ בְּאֹרַח מִשְׁפָּט
  choice: किसने उसे न्याय के मार्ग की शिक्षा दी
  rationale: אֹרַח का अर्थ मार्ग और מִשְׁפָּט का अर्थ प्रसंगानुसार न्याय या निर्णय हो सकता है। ‘न्याय का मार्ग’ ज्ञान-साहित्य जैसी अभिव्यक्ति और नैतिक रूप से उचित आचरण, दोनों को व्यक्त करता है।
- source_word: וַיְלַמְּדֵהוּ דַעַת
  choice: उसे ज्ञान दिया
  rationale: דַעַת को ‘ज्ञान’ रखकर בין और תְּבוּנוֹת से उसका शब्दगत भेद बनाए रखा गया है। हिन्दी में ‘ज्ञान सिखाया’ अस्वाभाविक होने के कारण दोहराए गए शिक्षण-भाव को स्वाभाविक रूप से ‘ज्ञान दिया’ कहा गया है।
- source_word: וְדֶרֶךְ תְּבוּנוֹת יוֹדִיעֶנּוּ
  choice: समझ-बूझ के मार्ग से परिचित कराया
  rationale: דֶרֶךְ ‘मार्ग’ है और बहुवचन भाववाचक תְּבוּנוֹת गहरी समझ, अंतर्दृष्टि या विवेक का बोध कराता है। ידע के हिफ़इल का ‘ज्ञात कराना’ भाव हिन्दी में ‘परिचित कराया’ से स्वाभाविक ढंग से व्यक्त होता है।
theological_decisions:
- issue: तीसरे पुरुष के सर्वनामों का संदर्भ
  choice: ‘उसने/उसे’ सर्वनाम बनाए रखे गए हैं; निकटवर्ती प्रसंग उन्हें यहोवा परमेश्वर से जोड़ता है।
  alternative: पद में स्पष्टता के लिए ‘यहोवा’ या ‘परमेश्वर’ जोड़ना।
  rationale: यशायाह 40:13–14 में आलंकारिक प्रश्न यहोवा की अतुलनीय बुद्धि और किसी सलाहकार से उसकी स्वतंत्रता बताते हैं। मूल पद में दिव्य नाम दोहराया नहीं गया, इसलिए अनुवाद भी सर्वनाम रखता है और संदर्भ को उसका परिचय कराने देता है।
- issue: מִשְׁפָּט का अर्थ
  choice: न्याय
  alternative: निर्णय
  rationale: यहाँ ‘न्याय’ नैतिक और न्यायिक बुद्धि के सही मार्ग को आधुनिक हिन्दी में स्पष्ट करता है। ‘निर्णय’ भी संभव अर्थ है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: תְּבוּנוֹת के बहुवचन भाव का निरूपण
  choice: समझ-बूझ
  alternative: अंतर्दृष्टि या विवेक
  rationale: यह शब्द समझ और सूझ-बूझ की सघन या बहुआयामी धारणा व्यक्त कर सकता है। ‘समझ-बूझ’ सामान्य पाठक के लिए सहज है और अर्थ को किसी एक तकनीकी धार्मिक धारणा तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। क्रमिक आलंकारिक प्रश्न और ‘मार्ग’ का समानांतर बिंब सुरक्षित है। पादटिप्पणी-चिह्न उन्हीं पदबंधों पर लगाए गए हैं जिनके वैकल्पिक अर्थ दिए गए हैं।
