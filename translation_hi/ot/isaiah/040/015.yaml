  edition: WLC
  text: הֵ֤ן גּוֹיִם֙ כְּ/מַ֣ר מִ/דְּלִ֔י וּ/כְ/שַׁ֥חַק מֹאזְנַ֖יִם נֶחְשָׁ֑בוּ הֵ֥ן אִיִּ֖ים כַּ/דַּ֥ק יִטּֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/015.yaml
  text: Look[a], the nations are like a drop from a bucket, and are regarded as dust on the scales; look[b], the coastlands he lifts like fine dust.
translation:
  language: hi
  text: देखो, राष्ट्र बाल्टी से टपकी एक बूँद[a] के समान हैं और तराज़ू पर पड़ी धूल के समान समझे जाते हैं; देखो, समुद्रतटीय देशों को वह महीन धूल के समान उठा लेता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘बाल्टी में पड़ी एक बूँद।’ इब्रानी में अधिक शाब्दिक रूप से ‘बाल्टी से’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है। ‘देखो’ आधुनिक, स्वाभाविक हिन्दी में उसके आलंकारिक बल को बनाए रखता है।
- source_word: גּוֹיִם
  choice: राष्ट्र
  rationale: सन्दर्भ में संसार के राष्ट्र या जातीय-राजनीतिक समुदाय अभिप्रेत हैं; ‘राष्ट्र’ संक्षिप्त और व्यापक है।
- source_word: כְּמַר מִדְּלִי
  choice: बालटी से टपकी एक बूँद
  rationale: מַר एक बूँद को और מִן स्रोत को सूचित करता है; इसलिए ‘बालटी से’ इब्रानी रूप के निकट है। ‘टपकी’ स्रोत-संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: וּכְשַׁחַק מֹאזְנַיִם
  choice: तराज़ू पर पड़ी धूल के समान
  rationale: שַׁחַק बारीक धूल और מֹאזְנַיִם तौलने के तराज़ू को दर्शाते हैं। यह बिंब नगण्य भार को स्पष्ट करता है।
- source_word: נֶחְשָׁבוּ
  choice: समझे जाते हैं
  rationale: חשׁב का निष्क्रिय रूप मूल्यांकन या लेखे में गिने जाने का भाव देता है; यह चयन आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אִיִּים
  choice: समुद्रतटीय देश
  rationale: यशायाह में यह शब्द द्वीपों के साथ दूरस्थ समुद्री तटवर्ती भूभागों को भी सूचित कर सकता है; ‘समुद्रतटीय देश’ इस व्यापक भौगोलिक अर्थ को व्यक्त करता है।
- source_word: כַּדַּק
  choice: महीन धूल के समान
  rationale: דַּק किसी महीन, पतली या अत्यल्प वस्तु का बोध कराता है; प्रसंग में ‘महीन धूल’ लघुता और भारहीनता का बिंब बनाए रखता है।
- source_word: יִטּוֹל
  choice: वह उठा लेता है
  rationale: נטל का अर्थ उठाना या उठा लेना है। ‘उठा लेता है’ कार्य की सहजता व्यक्त करता है और निहित कर्ता को सर्वनाम से ही रखता है।
theological_decisions:
- issue: יִטּוֹל का निहित कर्ता
  choice: क्रिया के साथ ‘वह’ रखा गया है, जो प्रसंगानुसार परमेश्वर की ओर संकेत करता है, पर पद में ईश-नाम नहीं जोड़ा गया।
  alternative: ‘परमेश्वर उठा लेता है’ कहकर कर्ता स्पष्ट करना, अथवा निर्वैयक्तिक रूप में ‘उठा लिया जाता है’ कहना।
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन है, पर इस उपवाक्य में कर्ता संज्ञा के रूप में व्यक्त नहीं है। निकटवर्ती प्रसंग परमेश्वर को इंगित करता है; सर्वनाम मूल की व्याकरणिक संक्षिप्तता और प्रसंगगत संकेत दोनों बचाता है।
- issue: अन्तिम उपवाक्य की शब्द-व्यवस्था
  choice: ‘समुद्रतटीय देश … वह उठा लेता है’ द्वारा कर्म को पहले रखा गया है।
  alternative: अधिक सामान्य हिन्दी क्रम में ‘वह समुद्रतटीय देशों को … उठा लेता है।’
  rationale: कर्म-प्रथम क्रम इब्रानी में אִיִּים की प्रमुखता को बनाए रखता है और ‘वह’ को किसी जोड़े गए स्पष्ट ईश-नाम में नहीं बदलता, यद्यपि हिन्दी में वाक्य अब भी बोधगम्य है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तराज़ू,’ ‘बालटी,’ और ‘महीन धूल’ मूल के ठोस बिंबों को सहज रूप में बनाए रखते हैं। दोनों הֵן के लिए ‘देखो’ की पुनरावृत्ति पद की आलंकारिक संरचना सुरक्षित करती है।
