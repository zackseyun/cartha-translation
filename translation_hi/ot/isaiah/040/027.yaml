source:
  edition: WLC
  text: לָ֤/מָּה תֹאמַר֙ יַֽעֲקֹ֔ב וּ/תְדַבֵּ֖ר יִשְׂרָאֵ֑ל נִסְתְּרָ֤ה דַרְכִּ/י֙ מֵֽ/יְהוָ֔ה וּ/מֵ/אֱלֹהַ֖/י מִשְׁפָּטִ֥/י יַעֲבֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/027.yaml
  text: Why do you say[a], O Jacob, and speak, O Israel, “My way is hidden from Yahweh, and my justice is disregarded by my God”?
translation:
  language: hi
  text: हे याकूब, तू क्यों कहता है, और हे इस्राएल, तू क्यों बोलता है, “मेरा मार्ग याहवे से छिपा हुआ है, और मेरे परमेश्वर द्वारा मेरे अधिकार[a] की अनदेखी की जाती है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा न्याय” अथवा “मेरा पक्ष।” इब्रानी शब्द מִשְׁפָּטִי न्याय, किसी के वैध अधिकार, या न्याय पाने के लिए प्रस्तुत उसके पक्ष को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: क्यों
  rationale: यह एक आलंकारिक प्रश्न आरम्भ करता है; ‘क्यों’ उसके प्रश्नात्मक और चुनौतीपूर्ण बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: תֹאמַר ... וּתְדַבֵּר
  choice: तू क्यों कहता है ... और तू क्यों बोलता है
  rationale: אמר और דבר के बीच की शब्दगत भिन्नता को ‘कहता’ और ‘बोलता’ से बनाए रखा गया है तथा समानांतर संबोधन स्पष्ट किया गया है।
- source_word: יַעֲקֹב ... יִשְׂרָאֵל
  choice: हे याकूब ... हे इस्राएल
  rationale: ये वाचा के लोगों के समानांतर नाम हैं; ‘हे’ प्रत्यक्ष संबोधन को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: נִסְתְּרָה דַרְכִּי
  choice: मेरा मार्ग ... छिपा हुआ है
  rationale: ‘मार्ग’ דרך के रूपक को बनाए रखता है और व्यक्ति की दशा या जीवन-क्रम का अर्थ खुला छोड़ता है; निष्क्रिय भाव भी सुरक्षित है।
- source_word: מֵיְהוָה
  choice: याहवे से
  rationale: ईश्वर के विशिष्ट वाचा-नाम יהוה का लिप्यंतरण किया गया है; ‘से’ उस भाव को रखता है कि वक्ता का मार्ग याहवे की दृष्टि या जानकारी से छिपा है।
- source_word: מִשְׁפָּטִי
  choice: मेरे न्याय
  rationale: מִשְׁפָּט न्याय, अधिकार अथवा न्याय के लिए प्रस्तुत पक्ष को सूचित कर सकता है। मुख्य पाठ में ‘न्याय’ मूल शब्द से निकटता रखता है और अन्य सम्भव अर्थ पाद-टिप्पणी में दिए गए हैं।
- source_word: יַעֲבוֹר
  choice: अनदेखी की जाती है
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘पास से निकल जाना/टाल देना’ है; इस प्रसंग में ‘अनदेखी की जाती है’ उपेक्षित किए जाने की शिकायत को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसे असत्य ठहराने या सुलझाने के।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में टेट्राग्रामटन प्रत्यक्ष रूप से आया है। ‘याहवे’ वाचा-नाम को सामान्य उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: מִשְׁפָּטִי का आशय
  choice: मेरे न्याय
  alternative: मेरा अधिकार; मेरा पक्ष
  rationale: इब्रानी शब्द में न्याय, वैध अधिकार और न्याय पाने के लिए प्रस्तुत पक्ष—तीनों अर्थ सम्भव हैं। मुख्य पाठ और पाद-टिप्पणी मिलकर इस वास्तविक अर्थगत विस्तार और ईश्वरीय उपेक्षा की अनुभूत शिकायत को बनाए रखते हैं।
- issue: יַעֲבוֹר में व्यक्त ईश्वरीय उपेक्षा की शिकायत
  choice: मेरे परमेश्वर द्वारा ... अनदेखी की जाती है
  alternative: मेरे परमेश्वर के पास से ... निकल जाता है; मेरा परमेश्वर ... टाल देता है
  rationale: यह वक्ता की शिकायत के रूप में रखा गया है, न कि कथावाचक द्वारा उसकी पुष्टि या खण्डन के रूप में। इससे पद का धार्मिक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रत्यक्ष संबोधन रखा गया है। एकवचन ‘तू’ मूल इब्रानी के एकवचन रूपों और याकूब/इस्राएल को सामूहिक व्यक्ति के रूप में किए गए संबोधन को दर्शाता है; यहाँ इसका भाव अपमानजनक नहीं, बल्कि काव्यात्मक और निकट संबोधन का है।
