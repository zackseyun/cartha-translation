source:
  edition: WLC
  text: אַ֣ף בַּל נִטָּ֗עוּ אַ֚ף בַּל זֹרָ֔עוּ אַ֛ף בַּל שֹׁרֵ֥שׁ בָּ/אָ֖רֶץ גִּזְעָ֑/ם וְ/גַם נָשַׁ֤ף בָּ/הֶם֙ וַ/יִּבָ֔שׁוּ וּ/סְעָרָ֖ה כַּ/קַּ֥שׁ תִּשָּׂאֵֽ/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/024.yaml
  text: Scarcely are they planted[a], scarcely are they sown, scarcely has their stem taken root in the earth, when he merely blows on them and they wither[b], and a storm carries them away like stubble.
translation:
  language: hi
  text: 'मुश्किल से वे रोपे जाते हैं,

    मुश्किल से वे बोए जाते हैं,

    मुश्किल से उनका तना धरती में जड़ पकड़ता है,

    कि वह उन पर फूँक मारता है और वे सूख जाते हैं;

    और आँधी उन्हें सूखे तिनकों की तरह उड़ा ले जाती है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַף בַּל
  choice: अभी ... भी नहीं
  rationale: तीन बार दोहराया गया यह पदबंध प्रबल निषेध के साथ अत्यंत शीघ्रता का भाव देता है—वे ठीक से स्थापित भी नहीं हुए कि उनका अंत हो गया। हिंदी में दोहराया गया ‘अभी ... भी नहीं’ इस कालिक और आलंकारिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נִטָּעוּ
  choice: रोपे ... गए
  rationale: נטע का निष्क्रिय रूप है और शासकों को पौधों की तरह स्थापित किए जाने के रूपक को बनाए रखता है।
- source_word: זֹרָעוּ
  choice: बोए ... गए
  rationale: זרע का निष्क्रिय रूप कृषि-रूपक और पहली पंक्ति के समानांतर विन्यास को बनाए रखता है।
- source_word: שֹׁרֵשׁ ... גִּזְעָם
  choice: उनके तने ने ... जड़ ... पकड़ी
  rationale: שֹׁרֵשׁ का आशय जड़ जमाने या पकड़ने से और גִּזְעָם का आशय उनके तने से है। ‘जड़ पकड़ना’ आधुनिक हिंदी में स्थापित होने का स्वाभाविक पौध-संबंधी मुहावरा है।
- source_word: נָשַׁף בָּהֶם
  choice: वह उन पर फूँकता है
  rationale: क्रिया का अर्थ फूँकना या साँस छोड़ना है। यह अनुवाद परमेश्वर की सहज किंतु प्रभावशाली क्रिया का चित्र सुरक्षित रखता है।
- source_word: וַיִּבָשׁוּ
  choice: वे सूख जाते हैं
  rationale: יבש का मूल अर्थ सूख जाना है; यह वनस्पति-रूपक के अनुरूप सरल और सटीक हिंदी है।
- source_word: סְעָרָה
  choice: आँधी
  rationale: यह शब्द तूफ़ान, आँधी या बवंडर का द्योतक हो सकता है। ‘आँधी’ उड़ाकर ले जाने वाली अगली क्रिया के साथ स्वाभाविक है, पर घूमते हुए बवंडर को अनिवार्य नहीं बनाता।
- source_word: כַּקַּשׁ
  choice: ठूँठ की तरह
  rationale: קַשׁ खेत में कटाई के बाद बची सूखी डंठल या ठूँठ-सदृश वनस्पति को दर्शाता है। ‘ठूँठ’ यहाँ ‘भूसी’ की अपेक्षा कृषि-बिंब के अधिक निकट है।
- source_word: תִּשָּׂאֵם
  choice: उड़ा ले जाती है
  rationale: נשא यहाँ उठाकर या बहाकर ले जाने का अर्थ देता है। आँधी के संदर्भ में ‘उड़ा ले जाती है’ हिंदी में चित्र को स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: ‘वह उन पर फूँकता है’ में एकवचन कर्ता का संदर्भ
  choice: निकटवर्ती संदर्भ के अनुसार परमेश्वर निहित कर्ता है, किंतु इस पद में उसका नाम जोड़े बिना ‘वह’ रखा गया है।
  alternative: इसे किसी अवैयक्तिक हवा के फूँकने के रूप में समझना।
  rationale: यशायाह 40:23–24 में वही व्यक्तिगत कर्ता शासकों को निष्फल करता है। सर्वनाम बनाए रखने से ईश्वरीय सक्रियता सुरक्षित रहती है और जहाँ इब्रानी पाठ नाम नहीं दोहराता वहाँ उसे अनावश्यक रूप से जोड़ा भी नहीं जाता।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और गरिमापूर्ण रखी गई है। आरंभ की तीन समानांतर पंक्तियाँ इब्रानी पुनरावृत्ति और शासकों के क्षणभंगुर उत्थान को उभारती हैं। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, क्योंकि प्रमुख अर्थ-विकल्प मुख्य पाठ में स्वाभाविक रूप से समाहित हैं।
