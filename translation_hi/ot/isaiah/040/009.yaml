theological_decisions:
- issue: स्त्रीलिंग कृदंत מְבַשֶּׂרֶת का सिय्योन और यरूशलेम से वाक्यगत सम्बन्ध
  choice: मुख्य पाठ में एक स्त्रीलिंग संदेशवाहिका को सिय्योन और यरूशलेम के लिए शुभ समाचार लानेवाली माना गया है।
  alternative: सिय्योन और यरूशलेम को सीधे सम्बोधित करके स्वयं उन मानवीकृत नगरों को शुभ समाचार सुनानेवाली माना जा सकता है।
  rationale: इब्रानी रचना दोनों सम्भावनाओं की अनुमति देती है। मुख्य पाठ एक सम्भव वाक्यगत सम्बन्ध अपनाता है और वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखता है।
- issue: אֱלֹהֵיכֶם का अनुवाद
  choice: तुम्हारा परमेश्वर
  alternative: तुम्हारा ईश्वर
  rationale: इस पद में יהוה नहीं, बल्कि प्रत्यययुक्त אֱלֹהִים है; इसलिए ‘यहोवा’ या ‘प्रभु’ न जोड़कर सामान्य ईश्वरीय पद को रखा गया है।
