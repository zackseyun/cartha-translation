base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/009.yaml
  text: Go up on a high mountain[a], bearer of good news to Zion; lift up your voice with strength, bearer of good news to Jerusalem; lift it up, do not fear; say to the cities of Judah[b], “Behold your God!”
translation:
  language: hi
  text: सिय्योन को शुभ समाचार सुनानेवाली, ऊँचे पहाड़ पर चढ़ जा[a]; यरूशलेम को शुभ समाचार सुनानेवाली, पूरी शक्ति से अपनी आवाज़ उठा। उसे उठा, मत डर; यहूदा के नगरों से कह[b], “देखो, तुम्हारा परमेश्वर!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे सिय्योन, शुभ समाचार सुनानेवाली, ऊँचे पहाड़ पर चढ़ जा ... हे यरूशलेम, शुभ समाचार सुनानेवाली, पूरी शक्ति से अपनी आवाज़ उठा।” इब्रानी को इस प्रकार भी पढ़ा जा सकता है कि सिय्योन और यरूशलेम को सीधे संबोधित करके उन्हें ही संदेशवाहिकाएँ कहा गया है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी स्त्रीलिंग एकवचन कृदंत का संबंध किसी स्त्रीलिंग संदेशवाहिका से हो सकता है, न कि मानवीकृत नगर से। इस समझ के अनुसार अर्थ है, “जो सिय्योन को शुभ समाचार सुनाती है ... जो यरूशलेम को शुभ समाचार सुनाती है।”
    reason: lexical_alternative
