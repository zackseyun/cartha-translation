  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ/נּוֹתֵ֥ן רוֹזְנִ֖ים לְ/אָ֑יִן שֹׁ֥פְטֵי אֶ֖רֶץ כַּ/תֹּ֥הוּ עָשָֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/023.yaml
  text: who brings princes to nothing[b][a], and makes the judges of the earth like emptiness.
translation:
  language: hi
  text: 'वह अधिपतियों को मिटा देता है,

    और पृथ्वी[a] के न्यायियों को शून्यता[b] के समान कर देता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘देश’; इब्रानी אֶרֶץ का अर्थ ‘पृथ्वी’ या ‘देश’ हो सकता है, पर यहाँ का व्यापक प्रसंग सार्वभौमिक अर्थ का समर्थन करता है।
    reason: alternative_reading
  - marker: b
    text: या ‘अव्यवस्था के समान,’ ‘सूनेपन के समान,’ अथवा ‘कुछ नहीं के समान’; इब्रानी תֹהוּ शून्यता, सूनापन, निरर्थकता या अव्यवस्था का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתֵן
  choice: वह ... कर देता है
  rationale: कृदन्त पिछले पद से परमेश्वर का वर्णन आगे बढ़ाता है। हिन्दी में वर्तमानकालिक वर्णन ‘वह ... कर देता है’ उसके निरन्तर और विशिष्ट कार्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: רוֹזְנִים
  choice: प्रधान शासकों
  rationale: यह शब्द ऊँचे पद वाले शासकों, सरदारों या राजकीय गणमान्य व्यक्तियों को दर्शाता है। ‘प्रधान शासकों’ से पद और राजनीतिक अधिकार दोनों स्पष्ट रहते हैं, बिना इसे केवल राजवंश के ‘राजकुमारों’ तक सीमित किए।
- source_word: לְאָיִן
  choice: मिटा देता है
  rationale: शाब्दिक भाव ‘अस्तित्वहीनता की ओर कर देना’ है। ‘मिटा देता है’ आधुनिक हिन्दी में उनके अधिकार और प्रभाव को सर्वथा समाप्त कर देने का प्रबल, सहज भाव देता है।
- source_word: שֹׁפְטֵי אֶרֶץ
  choice: पृथ्वी के न्यायियों
  rationale: रचना का सीधा अर्थ ‘पृथ्वी/देश के न्यायी’ है। यशायाह 40 का विश्वव्यापी सन्दर्भ ‘पृथ्वी’ का समर्थन करता है; ‘न्यायियों’ से उनके न्यायिक-शासकीय पद का मूल रूपक बना रहता है।
- source_word: כַּתֹּהוּ
  choice: शून्यता के समान
  rationale: תֹהוּ सूनेपन, निरर्थकता, अव्यवस्था या अनस्तित्व-जैसी दशा को व्यक्त कर सकता है। ‘शून्यता’ यहाँ उनकी सारहीनता को स्पष्ट करता है और उत्पत्ति 1 की ‘बेडौल’ शब्दावली अनावश्यक रूप से नहीं लाता।
- source_word: עָשָׂה
  choice: कर देता है
  rationale: रूप की दृष्टि से यह पूर्ण क्रिया है, पर काव्यात्मक समानान्तरता में परमेश्वर के विशिष्ट और नियमित कार्य का वर्णन करता है। हिन्दी का वर्तमानकालिक ‘कर देता है’ इस बल को स्वाभाविक ढंग से रखता है।
theological_decisions:
- issue: שֹׁפְטֵי אֶרֶץ में אֶרֶץ का दायरा
  choice: पृथ्वी
  alternative: देश
  rationale: आस-पास के प्रसंग में परमेश्वर का प्रभुत्व समस्त संसार और राष्ट्रों पर है। इसलिए ‘पृथ्वी’ सार्वभौमिक दायरा बनाए रखता है, जबकि ‘देश’ कथन को किसी एक भूभाग तक सीमित कर सकता है।
- issue: לְאָיִן में शासकों के विनाश का आशय
  choice: मिटा देता है
  alternative: कुछ नहीं के समान कर देता है
  rationale: यह अनुवाद उनके अस्तित्व, पद या प्रभाव को निष्फल कर देने की तीव्रता रखता है, पर यह निश्चित नहीं करता कि हर प्रसंग में इसका अर्थ केवल शारीरिक मृत्यु ही है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। काव्यात्मक समानान्तरता के लिए दो पंक्तियाँ रखी गई हैं। ‘प्रधान शासक’ ऊँचे राजनीतिक पद को स्पष्ट करता है, और ‘शून्यता’ मूल की बहुअर्थी काव्यात्मक तीव्रता को बनाए रखता है।
