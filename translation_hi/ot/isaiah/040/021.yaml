language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/ל֤וֹא תֵֽדְעוּ֙ הֲ/ל֣וֹא תִשְׁמָ֔עוּ הֲ/ל֛וֹא הֻגַּ֥ד מֵ/רֹ֖אשׁ לָ/כֶ֑ם הֲ/לוֹא֙ הֲבִ֣ינֹתֶ֔ם מוֹסְד֖וֹת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/021.yaml
  text: Do you not know? Do you not hear? Has it not been told to you from the beginning? Have you not understood from the foundations of the earth?[a]
translation:
  language: hi
  text: क्या तुम नहीं जानते? क्या तुम नहीं सुनते? क्या तुम्हें आरम्भ से नहीं बताया गया? क्या पृथ्वी की नींव डाले जाने के समय से तुमने नहीं समझा?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुम पृथ्वी की नींवों को नहीं समझते?”
    reason: अंतिम इब्रानी वाक्यांश को समय/स्रोत बताने वाला अथवा ‘समझना’ क्रिया का कर्म—दोनों प्रकार से ग्रहण किया जा सकता है।
lexical_decisions:
- source_word: הֲלוֹא
  choice: क्या ... नहीं
  rationale: नकारात्मक प्रश्नवाचक पद को प्रत्येक खंड में दोहराकर उस अलंकारिक प्रश्न का बल रखा गया है, जिसका अपेक्षित उत्तर हाँ है।
- source_word: תֵדְעוּ
  choice: जानते
  rationale: यहाँ क्रिया सामान्य ज्ञान या अवगत होने को व्यक्त करती है; ‘जानते’ सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: תִשְׁמָעוּ
  choice: सुना
  rationale: मूल अर्थ ‘सुनना’ है। हिन्दी में पूर्णकालिक रूप इस आशय को स्वाभाविक बनाता है कि यह बात पहले से उनके सुनने में आई है, बिना ‘ध्यान देना’ का अतिरिक्त भाव जोड़े।
- source_word: הֻגַּד
  choice: बताया गया
  rationale: נגד के होफाल रूप में श्रोताओं तक सूचना पहुँचाए जाने का निष्क्रिय भाव है; ‘बताया गया’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: מֵרֹאשׁ
  choice: आरम्भ से
  rationale: यह पद सबसे आरम्भिक समय या प्रारम्भ-बिंदु को सूचित करता है; ‘आरम्भ से’ संक्षिप्त और स्वाभाविक है।
- source_word: הֲבִינֹתֶם
  choice: समझा
  rationale: हिफ़ील रूप यहाँ समझने या विवेक से ग्रहण करने को व्यक्त करता है; ‘समझा’ संज्ञानात्मक बल बनाए रखता है।
- source_word: מוֹסְדוֹת
  choice: नींव डाले जाने के समय
  rationale: संज्ञा का मूल बिंब ‘नींव’ रखा गया है, जबकि मुख्य पाठ में इसे सृष्टि के आरम्भ से संबंधित कालिक/स्रोतगत वाक्यांश के रूप में स्वाभाविक हिन्दी दी गई है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: इस विश्व-सृष्टि संबंधी संदर्भ में अर्थ किसी विशेष देश का नहीं, पूरी पृथ्वी का है।
theological_decisions:
- issue: अंतिम वाक्यांश מוֹסְדוֹת הָאָרֶץ का वाक्यगत संबंध
  choice: क्या पृथ्वी की नींव डाले जाने के समय से तुमने नहीं समझा?
  alternative: क्या तुम पृथ्वी की नींवों को नहीं समझते?
  rationale: इब्रानी में ‘पृथ्वी की नींवों’ से पहले स्पष्ट पूर्वसर्ग नहीं है। इसे ‘समझना’ का कर्म भी माना जा सकता है, पर समानांतर ‘आरम्भ से’ और व्यापक संदर्भ कालिक/स्रोतगत अर्थ का समर्थन करते हैं। इसलिए मुख्य पाठ में सृष्टि की नींव डाले जाने के समय से उपलब्ध बोध का अर्थ रखा गया है और वैध कर्मवाचक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में चार क्रमिक अलंकारिक प्रश्नों की लय बनाए रखी गई है। भाषा सरल किन्तु गरिमापूर्ण है; ‘पृथ्वी की नींव’ का प्राचीन सृष्टि-बिंब सुरक्षित रखा गया है।
