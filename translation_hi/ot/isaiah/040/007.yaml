source:
  edition: WLC
  text: יָבֵ֤שׁ חָצִיר֙ נָ֣בֵֽל צִ֔יץ כִּ֛י ר֥וּחַ יְהוָ֖ה נָ֣שְׁבָה בּ֑/וֹ אָכֵ֥ן חָצִ֖יר הָ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/007.yaml
  text: The grass dries up[a], the flower withers, because the breath of Yahweh blows on it; surely the people are grass.
translation:
  language: hi
  text: घास सूख जाती है, फूल मुरझा जाता है, क्योंकि यहोवा की साँस[a] उस पर बहती है; निश्चय ही लोग घास हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा की हवा उस पर बहती है”; यहाँ “यहोवा की आत्मा उस पर बहती है” अर्थ कम सम्भावित है।
    reason: רוּחַ के ‘साँस’, ‘हवा’ और ‘आत्मा’ अर्थों से उत्पन्न वास्तविक वैकल्पिक पठन को सुरक्षित रखना।
lexical_decisions:
- source_word: יָבֵשׁ
  choice: सूख जाती है
  rationale: काल के सामान्य सत्य वाले काव्यात्मक प्रयोग को स्वाभाविक हिन्दी वर्तमान काल में व्यक्त करता है और वनस्पति के नमी व जीवन खोने का बिंब बनाए रखता है।
- source_word: חָצִיר
  choice: घास
  rationale: इस काव्यात्मक संदर्भ में इसका सामान्य और स्पष्ट अर्थ ‘घास’ है; यही आगे लोगों के क्षणभंगुर होने के रूपक को भी बनाए रखता है।
- source_word: נָבֵל
  choice: मुरझा जाता है
  rationale: फूल के कुम्हलाने या फीका पड़ने के लिए यह सहज आधुनिक हिन्दी है और पहले पद के साथ काव्यात्मक समानांतरता रखती है।
- source_word: צִיץ
  choice: फूल
  rationale: घास और नश्वरता के इस प्रसंग में ‘फूल’ सर्वाधिक परिचित और स्वाभाविक विकल्प है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह संयोजक यहाँ सूखने और मुरझाने का कारण प्रस्तुत करता है।
- source_word: רוּחַ
  choice: साँस
  rationale: רוּחַ के अर्थ ‘साँस’, ‘हवा’ या ‘आत्मा’ हो सकते हैं। यहाँ वनस्पति पर यहोवा के फूँकने के बिंब में ‘साँस’ मुख्य पाठ के लिए उपयुक्त है, जबकि वास्तविक अर्थगत अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम-रूप ‘यहोवा’ चतुरक्षरीय ईश-नाम को किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: נָשְׁבָה
  choice: चलती है
  rationale: हवा या साँस के किसी वस्तु पर चलने के लिए यह स्वाभाविक हिन्दी है और सामान्य सत्य के वर्तमान-कालीय काव्यात्मक भाव को बनाए रखती है।
- source_word: בּוֹ
  choice: उस पर
  rationale: पुल्लिंग एकवचन प्रत्यय निकटवर्ती घास/वनस्पति के बिंब की ओर संकेत करता है; ‘उस पर’ हिन्दी में स्वाभाविक है।
- source_word: אָכֵן
  choice: निश्चय ही
  rationale: यह निष्कर्ष की दृढ़ पुष्टि और वाक्य के बलाघात को स्पष्ट रूप से व्यक्त करता है।
- source_word: הָעָם
  choice: लोग
  rationale: सामूहिक मानव समुदाय का अर्थ देता है और संदर्भ को अनावश्यक रूप से किसी एक राष्ट्र तक सीमित नहीं करता।
theological_decisions:
- issue: רוּחַ יְהוָה का अर्थ
  choice: यहोवा की साँस
  alternative: 'यहोवा की हवा; कम सम्भावित: यहोवा का आत्मा'
  rationale: वनस्पति के सूखने के तत्काल बिंब में ‘साँस’ दिव्य क्रिया को सजीव रखती है। फिर भी רוּחַ का अर्थ ‘हवा’ भी हो सकता है और व्याकरणतः ‘आत्मा’ संभव है; इसलिए अस्पष्टता पाद-टिप्पणी में दी गई है।
- issue: יְהוָה का हिन्दी रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत ईश-नाम है। आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला ‘यहोवा’ नाम को नाम ही रहने देता है, उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। हिब्रू काव्य की दो समानांतर क्रियाएँ और अंतिम emphatic निष्कर्ष बनाए गए हैं; अर्धविराम अंतिम रूपक को पहले कथन से जोड़ता है।
