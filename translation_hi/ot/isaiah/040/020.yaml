source:
  edition: WLC
  text: הַֽ/מְסֻכָּ֣ן תְּרוּמָ֔ה עֵ֥ץ לֹֽא יִרְקַ֖ב יִבְחָ֑ר חָרָ֤שׁ חָכָם֙ יְבַקֶּשׁ ל֔/וֹ לְ/הָכִ֥ין פֶּ֖סֶל לֹ֥א יִמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/020.yaml
  text: He who is too poor for an offering chooses wood that will not rot[c][b][a]; he seeks out for himself a skilled craftsman to prepare an idol that will not totter.
translation:
  language: hi
  text: जो भेंट चढ़ाने के लिए बहुत निर्धन है,[a] वह ऐसी लकड़ी चुनता है जो सड़ने वाली न हो। वह अपने लिए किसी कुशल कारीगर को ढूँढ़ता है,[b] ताकि वह ऐसी मूर्ति[c] बनाए जो डगमगाए नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्धन व्यक्ति भेंट के रूप में ऐसी लकड़ी चुनता है जो सड़ती नहीं।” इब्रानी आरंभ संक्षिप्त है और उसकी वाक्य-रचना एक से अधिक प्रकार से समझी जा सकती है।
    reason: alternative_reading
  - marker: b
    text: या, “वह किसी कुशल कारीगर को अपने लिए ऐसी मूर्ति बनाने के लिए ढूँढ़ता है।”
    reason: word_order_alternative
  - marker: c
    text: या, “गढ़ी हुई प्रतिमा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְסֻכָּן תְּרוּמָה
  choice: जो भेंट चढ़ाने के लिए बहुत निर्धन है
  rationale: इब्रानी आरंभ अत्यंत संक्षिप्त और व्याकरण की दृष्टि से कुछ अस्पष्ट है। यह अनुवाद निर्धनता और भेंट—दोनों भावों को स्वाभाविक हिन्दी में रखता है, जबकि वैकल्पिक रचना पादटिप्पणी में दी गई है।
- source_word: עֵץ לֹא יִרְקַב
  choice: ऐसी लकड़ी ... जो सड़े नहीं
  rationale: यह टिकाऊ लकड़ी चुनने के ठोस चित्र को स्पष्ट और सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יִבְחָר
  choice: चुनता है
  rationale: साधारण वर्तमान काल यहाँ वर्णित सामान्य क्रिया के लिए स्वाभाविक है।
- source_word: חָרָשׁ חָכָם
  choice: कुशल कारीगर
  rationale: חָכָם यहाँ नैतिक बुद्धिमत्ता के बजाय शिल्प-कौशल बताता है; इसलिए ‘कुशल कारीगर’ उपयुक्त है।
- source_word: יְבַקֶּשׁ לוֹ
  choice: अपने लिए ... ढूँढ़ता है
  rationale: ‘अपने लिए’ इब्रानी לוֹ को सुरक्षित रखता है और जानबूझकर कारीगर खोजने का भाव देता है।
- source_word: לְהָכִין
  choice: बनाए
  rationale: मूर्ति और कारीगर के संदर्भ में ‘बनाए’ हिन्दी में स्वाभाविक है और तैयार करने या गढ़ने की क्रिया को पर्याप्त रूप से व्यक्त करता है।
- source_word: פֶּסֶל
  choice: मूर्ति
  rationale: यह गढ़ी हुई उपासना-प्रतिमा के लिए सहज हिन्दी शब्द है; संदर्भ में इसकी मूर्तिपूजक प्रकृति स्पष्ट है, जबकि अधिक स्पष्ट विकल्प पादटिप्पणी में दिया गया है।
- source_word: לֹא יִמּוֹט
  choice: डगमगाए नहीं
  rationale: यह क्रिया के हिलने या अस्थिर होने के भाव और भविष्यवक्ता की विडंबना—स्थिर रखी जाने वाली मूर्ति—दोनों को बनाए रखता है।
theological_decisions:
- issue: मूर्तिपूजा-विरोधी संदर्भ में פֶּסֶל का अनुवाद
  choice: मूर्ति
  alternative: गढ़ी हुई प्रतिमा; देवमूर्ति
  rationale: ‘मूर्ति’ हिन्दी में स्वाभाविक और शाब्दिक रूप से पर्याप्त है। ‘देवमूर्ति’ व्याख्या को अधिक स्पष्ट कर सकती है, पर स्रोत में निहित अर्थ से अधिक विशिष्ट हो सकती है; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- issue: इब्रानी आरंभ में निर्धन व्यक्ति और भेंट का संबंध
  choice: जो भेंट चढ़ाने के लिए बहुत निर्धन है
  alternative: निर्धन व्यक्ति भेंट के रूप में ऐसी लकड़ी चुनता है
  rationale: मुख्य पाठ प्रचलित अर्थ को अपनाता है, पर संक्षिप्त इब्रानी वाक्यांश की वास्तविक संरचनात्मक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बहुत निर्धन’, ‘कुशल कारीगर’ और ‘डगमगाए नहीं’ स्रोत के ठोस तथा व्यंग्यात्मक चित्र को बनाए रखते हैं। इब्रानी आरंभ की वास्तविक अस्पष्टता को मुख्य पाठ में जबरन सुलझाने के बजाय पादटिप्पणी में दर्ज किया गया है।
