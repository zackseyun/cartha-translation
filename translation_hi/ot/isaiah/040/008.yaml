  terminology: ‘परमेश्वर,’ ‘वचन,’ and ‘अटल रहेगा’ are appropriate, established Hindi biblical terms. ‘हमारे परमेश्वर’ correctly represents the first-person plural suffix in אֱלֹהֵינוּ. No doctrinally restrictive interpretation has been introduced.
