reference: Isaiah 40:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יָבֵ֥שׁ חָצִ֖יר נָ֣בֵֽל צִ֑יץ וּ/דְבַר אֱלֹהֵ֖י/נוּ יָק֥וּם לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/008.yaml
  text: The grass withers[a], the flower fades, but the word of our God will stand forever.
translation:
  language: hi
  text: घास सूख जाती है, फूल मुरझा जाता है, परन्तु हमारे परमेश्वर का वचन सदा तक अटल रहेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָבֵשׁ
  choice: सूख जाती है
  rationale: यह क्रिया सूखने या कुम्हलाने का भाव देती है। ‘सूख जाती है’ घास के लिए स्वाभाविक है और अगली क्रिया से भेद बनाए रखती है।
- source_word: חָצִיר
  choice: घास
  rationale: इस काव्यात्मक संदर्भ में सामान्य वनस्पति के लिए ‘घास’ सहज और स्पष्ट शब्द है।
- source_word: נָבֵל
  choice: मुरझा जाता है
  rationale: यह क्रिया मुरझाने या कुम्हलाने का अर्थ देती है; फूल के संदर्भ में ‘मुरझा जाता है’ स्वाभाविक है।
- source_word: צִיץ
  choice: फूल
  rationale: समानांतर पंक्ति में यह खिलने वाले फूल को सूचित करता है; ‘फूल’ आधुनिक हिन्दी में सर्वाधिक सहज है।
- source_word: וּדְבַר
  choice: परन्तु ... वचन
  rationale: वाव का मूल संयोजक अर्थ ‘और’ है, किन्तु यहाँ नश्वर वनस्पति और स्थायी दिव्य वचन के बीच स्पष्ट विरोध है; ‘परन्तु’ उस निहित विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर का
  rationale: यह इस्राएली प्रयोग में एकवचन परमेश्वर को दर्शाता है और प्रथम पुरुष बहुवचन प्रत्यय ‘हमारे’ है।
- source_word: יָקוּם
  choice: अटल रहेगा
  rationale: शाब्दिक अर्थ ‘खड़ा होगा/खड़ा रहेगा’ है; इस प्रसंग में स्थायित्व और प्रभावी बने रहने का भाव है। ‘अटल रहेगा’ हिन्दी में इस ठोस स्थिरता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְעוֹלָם
  choice: सदा तक
  rationale: यह अनन्त या निरन्तर अवधि का मुहावरा है; ‘सदा तक’ गरिमापूर्ण और सामान्य हिन्दी है।
theological_decisions:
- issue: क्षणभंगुर सृष्टि और स्थायी दिव्य वचन के बीच विरोध
  choice: मुख्य पाठ में ‘परन्तु’
  alternative: ‘और’
  rationale: इब्रानी वाव को ‘और’ कहा जा सकता है, पर काव्यात्मक समानांतरता में विरोध स्पष्ट है। ‘परन्तु’ कोई नई धर्मवैज्ञानिक धारणा जोड़े बिना उसी विरोध को सामने लाता है।
- issue: דָּבָר का अनुवाद
  choice: वचन
  alternative: बात; सन्देश; प्रतिज्ञा
  rationale: ‘वचन’ मूल शब्द की व्यापकता और परमेश्वर के कथन का भार बनाए रखता है; ‘प्रतिज्ञा’ या ‘सन्देश’ अर्थ को अनावश्यक रूप से संकीर्ण कर देंगे।
- issue: יָקוּם में स्थायित्व का रूपक
  choice: अटल रहेगा
  alternative: खड़ा रहेगा; बना रहेगा
  rationale: यहाँ क्रिया का आशय परमेश्वर के वचन की स्थायी वैधता है। ‘अटल रहेगा’ हिन्दी में उस स्थिरता को स्पष्ट करता है, जबकि ‘खड़ा रहेगा’ अधिक शाब्दिक पर कुछ अस्वाभाविक हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, काव्यात्मक और गरिमापूर्ण रखी गई है। दोनों वनस्पति-क्रियाओं का भेद ‘सूख जाती है’ और ‘मुरझा जाता है’ से सुरक्षित है।
