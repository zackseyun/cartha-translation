source:
  edition: WLC
  text: וְ/אֶל מִ֖י תְּדַמְּי֣וּ/ן אֵ֑ל וּ/מַה דְּמ֖וּת תַּ֥עַרְכוּ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/018.yaml
  text: To whom[a], then, will you liken God, and what likeness will you compare to him?
translation:
  language: hi
  text: तो तुम परमेश्वर की तुलना किससे करोगे, और कौन-सा रूप उसके समकक्ष रखोगे?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और तुम परमेश्वर को किसके समान ठहराओगे, और कौन-सा रूप उसके सामने रखोगे?”
    reason: आरम्भिक וְ का सीधा अर्थ ‘और’ हो सकता है, जबकि ערך में किसी वस्तु को तुलना के लिए सामने या समकक्ष रखने का भाव भी है।
lexical_decisions:
- source_word: וְ/אֶל מִי
  choice: तो ... किससे
  rationale: אֶל מִי तुलना के लक्ष्य को व्यक्त करता है; हिन्दी में ‘किससे’ स्वाभाविक है। आरम्भिक וְ को प्रसंग के तर्कपूर्ण संक्रमण के अनुसार ‘तो’ कहा गया है।
- source_word: תְּדַמְּיוּן
  choice: तुलना ... करोगे
  rationale: דמה का यहाँ अर्थ किसी के समान ठहराना या तुलना करना है; आधुनिक हिन्दी में ‘तुलना करना’ स्पष्ट और स्वाभाविक है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यशायाह 40 के प्रसंग में אֵל इस्राएल के एकमात्र सच्चे परमेश्वर को सूचित करता है; ‘परमेश्वर’ हिन्दी बाइबलीय शैली में स्वाभाविक निश्चित संदर्भ देता है।
- source_word: וּ/מַה דְּמוּת
  choice: और उसके समान कौन-सा रूप
  rationale: דְּמוּת समानता, प्रतिरूप या आकृति को सूचित करता है। ‘उसके समान ... रूप’ अर्थ को सहज हिन्दी में रखता है और मूर्त रूप की ओर प्रसंगगत संकेत भी बनाए रखता है।
- source_word: תַּעַרְכוּ לֽוֹ
  choice: ठहराओगे
  rationale: ערך का मूल भाव सामने रखने, व्यवस्थित करने या बराबरी में रखने का है। ‘उसके समान ... ठहराओगे’ तुलना हेतु किसी रूप को उसके समकक्ष रखने की धारणा व्यक्त करता है, बिना इसे केवल मानसिक तुलना तक सीमित किए।
theological_decisions:
- issue: मूर्तिपूजा-विरोधी प्रश्न में אֵל का अर्थ
  choice: परमेश्वर
  alternative: कोई देवता
  rationale: निकटवर्ती प्रसंग सृष्टिकर्ता और मूर्तियों के बीच अतुलनीयता पर बल देता है; इसलिए यहाँ अनिश्चित ‘कोई देवता’ के बजाय निश्चित ‘परमेश्वर’ उपयुक्त है।
- issue: דְּמוּת और ערך में प्रतिमा तथा तुलना का संबंध
  choice: उसके समान कौन-सा रूप ठहराओगे
  alternative: कौन-सी समानता उससे तुलना करोगे
  rationale: चुना हुआ पाठ किसी दृश्य रूप को परमेश्वर के समान रखने की संभावना को व्यक्त करता है, पर ‘प्रतिमा’ जोड़कर मूल की व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। समानांतर आलंकारिक प्रश्न को हिन्दी में स्वाभाविक बनाने के लिए पहले खंड में ‘तुलना’ और दूसरे में ‘समान ... रूप ठहराना’ रखा गया है।
