  text: מִֽי מָדַ֨ד בְּ/שָׁעֳל֜/וֹ מַ֗יִם וְ/שָׁמַ֨יִם֙ בַּ/זֶּ֣רֶת תִּכֵּ֔ן וְ/כָ֥ל בַּ/שָּׁלִ֖שׁ עֲפַ֣ר הָ/אָ֑רֶץ וְ/שָׁקַ֤ל בַּ/פֶּ֨לֶס֙ הָרִ֔ים וּ/גְבָע֖וֹת בְּ/מֹאזְנָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/012.yaml
  text: Who has measured the waters in the hollow of his hand[a], and marked off the heavens with a span, and measured the dust of the earth in a measure[c][b], and weighed the mountains in scales and the hills in balances?
translation:
  language: hi
  text: किसने जल को अपने हाथ की खोखली हथेली में मापा है, आकाश को बित्ते से नापा है, पृथ्वी की धूल को एक माप-पात्र में समेटा है[a], और पहाड़ों को तराजू में तथा पहाड़ियों को पलड़ों में तौला है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पृथ्वी की धूल को तिहाई के माप में नापा है।” यहाँ प्रयुक्त इब्रानी शब्द किसी प्राचीन माप या मापने के पात्र को सूचित करता है, जिसकी ठीक क्षमता निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי מָדַד
  choice: किसने ... मापा है
  rationale: מִי अलंकारिक प्रश्न आरम्भ करता है और מָדַד का पूर्ण पक्ष सृष्टि पर परमेश्वर की अतुलनीय प्रभुता दिखाने वाले सम्पन्न कार्य को व्यक्त करता है।
- source_word: בְּשָׁעֳלוֹ
  choice: अपने हाथ की अंजलि में
  rationale: शब्द हाथ की हथेली अथवा उसके कटोरे-जैसे खोखले भाग को सूचित करता है। यह चयन शरीरात्मक मापने के बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מַיִם
  choice: जल
  rationale: बहुवचन रूप यहाँ सामूहिक अर्थ में समस्त जलराशि को दर्शाता है; हिन्दी में 'जल' इसी अर्थ को सहज और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: בַּזֶּרֶת
  choice: बित्ता भर से
  rationale: זֶרֶת अंगूठे और छोटी उँगली को फैलाने पर बनने वाली दूरी, अर्थात बित्ता, का प्राचीन शारीरिक माप है।
- source_word: תִּכֵּן
  choice: नापा है
  rationale: इस प्रसंग में क्रिया आकाश का विस्तार निर्धारित करने या मापने का अर्थ देती है। 'नापा' काव्यात्मक समानांतरता और ठोस मापन-बिंब दोनों रखता है।
- source_word: וְכָל בַּשָּׁלִשׁ
  choice: एक माप-पात्र में समेटा है
  rationale: क्रिया में नापकर समेटने अथवा समाहित करने का भाव है, जबकि שָׁלִשׁ किसी प्राचीन माप या पात्र को सूचित करता है जिसकी ठीक क्षमता अनिश्चित है।
- source_word: עֲפַר הָאָרֶץ
  choice: पृथ्वी की धूल
  rationale: इब्रानी संबंध-पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וְשָׁקַל בַּפֶּלֶס הָרִים וּגְבָעוֹת בְּמֹאזְנָיִם
  choice: पहाड़ों को तराजू पर तथा पहाड़ियों को तुला में तौला है
  rationale: दो समानांतर तौलने के उपकरणों को अलग किन्तु निकटार्थी हिन्दी शब्दों से व्यक्त किया गया है, ताकि मूल कविता की समानांतर रचना बनी रहे।
theological_decisions:
- issue: परमेश्वर के लिए हाथ, बित्ता और तौलने के उपकरणों का मानव-सदृश चित्रण
  choice: शरीरात्मक और हस्तचालित मापन के बिंब को ज्यों का त्यों बनाए रखा गया
  alternative: इसे अमूर्त रूप में 'अपनी सामर्थ्य से' या 'ठीक-ठीक मापकर' कहना
  rationale: इब्रानी कविता जानबूझकर सृष्टि की विशालता को परमेश्वर के हाथ और सामान्य मापों की तुलना में अत्यन्त छोटा दिखाती है। बिंब को अमूर्त करने से उसकी काव्यात्मक शक्ति और परमेश्वर की अतुलनीयता का बल घट जाएगा।
- issue: अलंकारिक प्रश्न में कर्ता की पहचान
  choice: मूल की तरह 'किसने' रखा गया, बिना उत्तर को पद में स्पष्ट रूप से जोड़ने के
  alternative: स्पष्ट रूप से 'परमेश्वर के सिवा किसने' कहना
  rationale: प्रसंग उत्तर को स्पष्ट करता है, पर इस पद का प्रश्नात्मक तनाव स्वयं इब्रानी पाठ का महत्त्वपूर्ण अंग है; इसलिए निहित उत्तर को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक प्रश्नात्मक रूप अपनाया गया है। 'बित्ता', 'अंजलि', 'माप-पात्र', 'तराजू' और 'तुला' ठोस मापन-बिंब सुरक्षित रखते हैं। वाक्य सामान्य पाठक के लिए सुबोध है, जबकि प्राचीन שָׁלִשׁ की अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
