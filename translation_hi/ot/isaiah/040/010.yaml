base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/010.yaml
  text: Behold[a], the Lord GOD comes with strength, and his arm rules for him; behold, his reward is with him[d][c][b], and his recompense before him.
translation:
  language: hi
  text: देखो, प्रभु याहवे[a] सामर्थ्य के साथ आता है[b]; उसकी भुजा उसके लिए शासन करती है[c]। देखो, उसका प्रतिफल उसके साथ है और उसका प्रतिदान उसके आगे है[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में संयुक्त उपाधि ‘अदोनाय याहवे’ है, अर्थात ‘प्रभु याहवे।’
    reason: alternative_reading
  - marker: b
    text: 'या: ‘सामर्थ्य के साथ आएगा’; हिब्रू क्रिया को स्पष्ट भविष्यकाल में भी अनूदित किया जा सकता है।'
    reason: lexical_alternative
  - marker: c
    text: 'या: ‘उसकी भुजा उसकी ओर से शासन करती है।’'
    reason: lexical_alternative
  - marker: d
    text: ‘प्रतिफल’ और ‘प्रतिदान’ के लिए प्रयुक्त हिब्रू शब्दों का अर्थ ‘मजदूरी’ और ‘काम का फल/भुगतान’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह भविष्यद्वाणी की उद्घोषणात्मक पुकार और दोनों स्थलों का आलंकारिक बल बनाए रखता है; आधुनिक हिन्दी में स्वाभाविक भी है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: संयुक्त उपाधि में אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ के रूप में अलग-अलग सुरक्षित रखा गया है।
- source_word: בְּחָזָק
  choice: सामर्थ्य के साथ
  rationale: यह בְּ को रीति/सहचर्य और חָזָק को शक्ति के अर्थ में व्यक्त करता है, बिना इसे अनिवार्य रूप से ‘सामर्थी जन’ की उपाधि बनाए।
- source_word: יָבוֹא
  choice: आ रहा है
  rationale: हिब्रू अपूर्ण क्रिया का भावी अर्थ यहाँ भविष्यद्वाणी की सजीव, निकट और निश्चित प्रस्तुति के रूप में व्यक्त किया गया है।
- source_word: וּזְרֹעוֹ
  choice: उसकी भुजा
  rationale: सामर्थ्य और कार्यकारी शक्ति की मूल देहात्मक उपमा को अमूर्त ‘शक्ति’ में नहीं बदला गया।
- source_word: מֹשְׁלָה לוֹ
  choice: उसके लिए शासन करती है
  rationale: स्त्रीलिंग कृदन्त का संबंध ‘भुजा’ से रखा गया और לוֹ के हित/पक्ष के अर्थ को खुला छोड़ा गया है।
- source_word: שְׂכָרוֹ
  choice: उसका प्रतिफल
  rationale: שָׂכָר के ‘इनाम/मजदूरी/प्रतिफल’ अर्थक्षेत्र को औपचारिक पर स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִתּוֹ
  choice: उसके साथ है
  rationale: साथ होने के सीधे अर्थ को बिना विस्तार के रखा गया है।
- source_word: וּפְעֻלָּתוֹ
  choice: उसका प्रतिदान
  rationale: यह शब्द काम, काम के फल, या उसके भुगतान को सूचित कर सकता है; ‘प्रतिदान’ समानांतर पंक्ति में प्रतिपूर्ति का भाव सुरक्षित रखता है।
- source_word: לְפָנָיו
  choice: उसके आगे है
  rationale: स्थानसूचक रूपक और राजकीय आगमन का काव्यात्मक दृश्य दोनों बने रहते हैं।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर / प्रभु यहोवा
  rationale: मूल में उपाधि और व्यक्तिगत ईश्वरीय नाम दोनों उपस्थित हैं। ‘प्रभु याहवे’ दोनों तत्वों को दिखाता है और नाम को सामान्य पदवी में विलीन नहीं करता।
- issue: भुजा के शासन करने की उपमा
  choice: उपमा को ज्यों का त्यों रखना
  alternative: उसकी शक्ति उसके लिए शासन करती है / वह अपनी सामर्थ्य से शासन करता है
  rationale: मूल पाठ भुजा को व्याकरणिक कर्ता बनाता है। इसे सीधे परमेश्वर के शासन में बदलना उपमा और उसकी जानबूझकर रखी गई अभिव्यक्ति को समतल कर देता।
- issue: प्रतिफल और प्रतिदान के पाने वाले की पहचान
  choice: पाठ में पाने वाले को अनिर्दिष्ट रखना
  alternative: उसके लोगों के लिए प्रतिफल / शत्रुओं के लिए दण्ड
  rationale: इस पद में लाभार्थी स्पष्ट नहीं किया गया; संदर्भगत धर्मवैज्ञानिक निष्कर्ष को मुख्य पाठ में जोड़ना मूल की खुली हुई बात को अनावश्यक रूप से निश्चित कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और उद्घोषणात्मक रखी गई है। ‘देखो’ की पुनरावृत्ति और ‘भुजा’ की ठोस उपमा मूल काव्य का बल बचाती हैं। असामान्य किंतु अर्थपूर्ण वाक्य ‘उसकी भुजा उसके लिए शासन करती है’ मूल की व्याकरणिक तथा धर्मवैज्ञानिक तनावपूर्ण अभिव्यक्ति को सहज व्याख्या में विलीन नहीं करता।
