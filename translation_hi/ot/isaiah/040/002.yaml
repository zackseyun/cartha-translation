source:
  edition: WLC
  text: דַּבְּר֞וּ עַל לֵ֤ב יְרֽוּשָׁלִַ֨ם֙ וְ/קִרְא֣וּ אֵלֶ֔י/הָ כִּ֤י מָֽלְאָה֙ צְבָאָ֔/הּ כִּ֥י נִרְצָ֖ה עֲוֺנָ֑/הּ כִּ֤י לָקְחָה֙ מִ/יַּ֣ד יְהוָ֔ה כִּפְלַ֖יִם בְּ/כָל חַטֹּאתֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/002.yaml
  text: Speak to the heart of Jerusalem[a], and call out to her that her hard service is completed, that her iniquity is pardoned[c][b], that she has received from the hand of Yahweh double for all her sins.
translation:
  language: hi
  text: यरूशलेम से स्नेहपूर्वक बातें करो[a] और उसे पुकारकर यह घोषणा करो कि उसकी कठिन सेवा पूरी हो गई है[b], उसका अधर्म क्षमा कर दिया गया है[c], और उसने अपने सभी पापों के लिए याहवे के हाथ से दुगुना पाया है[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यरूशलेम के हृदय से बातें करो”; यह मुहावरा स्नेहपूर्वक आश्वासन या सांत्वना देने को दर्शाता है।
    reason: cultural_note
  - marker: b
    text: या, “उसका युद्ध समाप्त हो गया है” अथवा “उसकी निर्धारित सेवा-अवधि पूरी हो गई है।”
    reason: lexical_alternative
  - marker: c
    text: या, “उसका दण्ड स्वीकार कर लिया गया है/पर्याप्त माना गया है” अथवा “उसका दोष स्वीकार किया गया है।”
    reason: lexical_alternative
  - marker: d
    text: “दुगुना” पूरी या भरपूर मात्रा के लिए प्रयुक्त मुहावरा हो सकता है; इसका अर्थ आवश्यक रूप से ठीक दो गुना नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: דַּבְּרוּ עַל־לֵב
  choice: मन को ढाढ़स देने वाली बातें कहो
  rationale: यह इब्रानी मुहावरा शाब्दिक रूप से ‘हृदय से/पर बात करना’ है, पर इसका आशय स्नेहपूर्वक, आश्वासन देते हुए या सांत्वना की बात कहना है। चुना हुआ हिन्दी रूप मुहावरे का सांत्वनापूर्ण भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְרוּשָׁלִַם
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: וְקִרְאוּ אֵלֶיהָ
  choice: और उसे पुकारकर कहो
  rationale: קרא אֶל में पुकारने और घोषणा करने, दोनों का भाव हो सकता है। यह रूप सम्बोधन की जीवंतता और संदेश की सार्वजनिक घोषणा को बनाए रखता है।
- source_word: מָלְאָה צְבָאָהּ
  choice: उसकी कठिन सेवा पूरी हो गई है
  rationale: צָבָא युद्ध, सैनिक सेवा अथवा निर्धारित कठिन सेवा-अवधि को सूचित कर सकता है। निर्वासन और बहाली के प्रसंग में ‘कठिन सेवा’ व्यापक अर्थ को बनाए रखता है; अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: נִרְצָה עֲוֺנָהּ
  choice: उसका अधर्म क्षमा कर दिया गया है
  rationale: נרצה का मूल भाव स्वीकार या अनुकूल रूप से ग्रहण किया जाना है। עָוֹן के साथ बहाली के इस सन्दर्भ में परिणाम क्षमा की घोषणा है, यद्यपि दण्ड या दोष के स्वीकार/सन्तुष्ट होने की सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: לָקְחָה מִיַּד יְהוָה
  choice: उसने ... याहवे के हाथ से ... पाया है
  rationale: לקח यहाँ प्राप्त करने के अर्थ में है। ‘हाथ से’ कारण और अधिकार को दर्शाने वाली मूल छवि को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम का हिन्दी लिप्यंतरण, न कि उसके स्थान पर कोई उपाधि।
- source_word: כִּפְלַיִם
  choice: दुगुना
  rationale: शब्द का सीधा अर्थ ‘दुगुना’ या ‘दोहरा’ है। इसे मुख्य पाठ में बनाए रखा गया है, जबकि पूर्ण मात्रा वाले सम्भावित मुहावरेदार अर्थ को पादटिप्पणी में बताया गया है।
- source_word: בְּכָל חַטֹּאתֶיהָ
  choice: अपने सभी पापों के लिए
  rationale: सन्दर्भ में חַטֹּאות का अर्थ पाप है, पापबलि नहीं। ‘के लिए’ पिछले न्याय और पापों के बीच सम्बन्ध को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: याहवे से ‘दुगुना’ पाने का अर्थ
  choice: मुख्य पाठ में ‘दुगुना’ को अक्षुण्ण रखते हुए इसे यरूशलेम के पापों के कारण मिले न्याय से जोड़ा गया है।
  alternative: इसे प्रत्येक पाप के ठीक दोहरे दण्ड, पापों के अनुरूप पूरी मात्रा, अथवा अनुग्रह की बहुतायत के रूप में समझा जा सकता है।
  rationale: निकटवर्ती वाक्य कठिन सेवा के पूरा होने और अधर्म की क्षमा की घोषणा करते हैं। इसलिए यह पहले भोगे गए न्याय की ओर स्वाभाविक रूप से संकेत करता है, पर ‘दुगुना’ को गणितीय अनुपात मानना आवश्यक नहीं; पादटिप्पणी इस तनाव को खुला रखती है।
- issue: נִרְצָה עֲוֺנָהּ का बल
  choice: बहाली के परिणाम को स्पष्ट करने के लिए ‘उसका अधर्म क्षमा कर दिया गया है।’
  alternative: ‘उसका दण्ड स्वीकार कर लिया गया/पर्याप्त माना गया है’ अथवा ‘उसका दोष स्वीकार किया गया है।’
  rationale: इब्रानी क्रिया सीधे ‘क्षमा करना’ नहीं, बल्कि स्वीकार या प्रसन्नतापूर्वक ग्रहण किए जाने का भाव रखती है। सन्दर्भ में इसका परिणाम क्षमा है, पर वैकल्पिक दण्ड/दोष सम्बन्धी अर्थ पादटिप्पणी में सुरक्षित है।
