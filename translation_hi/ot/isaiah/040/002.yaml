  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और भविष्यद्वाणी-सुलभ शैली अपनाई गई है। यरूशलेम को स्त्रीलिंग मानकर सम्बोधित करने का इब्रानी व्याकरण हिन्दी में स्वाभाविक रूप से रखा गया है। इब्रानी मुहावरे को मुख्य पाठ में अर्थ-स्पष्ट रूप दिया गया है और उसका शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
