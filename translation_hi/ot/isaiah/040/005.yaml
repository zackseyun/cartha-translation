  text: וְ/נִגְלָ֖ה כְּב֣וֹד יְהוָ֑ה וְ/רָא֤וּ כָל בָּשָׂר֙ יַחְדָּ֔ו כִּ֛י פִּ֥י יְהוָ֖ה דִּבֵּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/005.yaml
  text: And the glory of Yahweh will be revealed[a], and all flesh together will see, for the mouth of Yahweh has spoken.
translation:
  language: hi
  text: और याहवे की महिमा प्रकट होगी, और सभी मनुष्य[a] एक साथ देखेंगे, क्योंकि याहवे के मुख ने कहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समस्त मानवजाति”; इब्रानी में “समस्त देह।”
    reason: כָּל בָּשָׂר के शाब्दिक रूप और इस प्रसंग में उसके मानवीय अर्थ, दोनों को दिखाने के लिए।
lexical_decisions:
- source_word: וְנִגְלָה
  choice: प्रकट होगी
  rationale: גלה के निफ़अल रूप का भाव निष्क्रिय है—महिमा उजागर या प्रकट की जाएगी। हिन्दी में ‘प्रकट होगी’ इस भाव और भविष्यसूचक आश्वासन, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כְּבוֹד יְהוָה
  choice: याहवे की महिमा
  rationale: כָּבוֹד का अर्थ महिमा, गौरव और प्रभावपूर्ण गरिमा है; सम्बन्धसूचक इब्रानी रचना हिन्दी में स्वाभाविक रूप से ‘याहवे की महिमा’ बनती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह उपाधि नहीं, परमेश्वर का व्यक्तिगत वाचा-नाम है; इसलिए इसे ‘प्रभु’ से प्रतिस्थापित करने के बजाय हिन्दी में ‘याहवे’ लिप्यंतरित किया गया है।
- source_word: וְרָאוּ
  choice: देखेंगे
  rationale: यहाँ क्रिया भविष्यसूचक क्रम में है। मूल में कर्म स्पष्ट रूप से नहीं दिया गया, इसलिए हिन्दी में भी ‘उसे’ नहीं जोड़ा गया।
- source_word: כָל בָּשָׂר
  choice: सब देहधारी
  rationale: शाब्दिक अर्थ ‘समस्त देह’ है और सन्दर्भ में इसका आशय समस्त मानवजाति है। ‘सब देहधारी’ मूल की देहपरक छवि और सार्वभौमिक विस्तार को बनाए रखते हुए हिन्दी में समझने योग्य है।
- source_word: יַחְדָּו
  choice: एक साथ
  rationale: यह सामूहिकता अथवा एक ही समय में देखने के भाव को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पूर्ववर्ती प्रतिज्ञा का आधार और उसकी निश्चितता बताता है; ‘क्योंकि’ हिन्दी में इस कारणसूचक सम्बन्ध को स्पष्ट रखता है।
- source_word: פִּי יְהוָה
  choice: याहवे के मुख
  rationale: मूल की ठोस मानवरूपी अभिव्यक्ति को किसी अमूर्त परिभाषा में बदलने के बजाय सुरक्षित रखा गया है।
- source_word: דִּבֵּר
  choice: कहा है
  rationale: पूर्ण क्रिया कथन को सम्पन्न और इसलिए निश्चित प्रस्तुत करती है। ‘कहा है’ आधुनिक हिन्दी में स्वाभाविक है और उस पूर्ण पक्ष को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में सुरक्षित रखता है।
- issue: כָל בָּשָׂר की देहपरक उपमा को बनाए रखना
  choice: सब देहधारी
  alternative: समस्त मानवजाति / सभी मनुष्य
  rationale: वाक्य का आशय सार्वभौमिक मानव समुदाय है, फिर भी मूल जानबूझकर ‘देह’ कहता है। मुख्य पाठ में यह छवि रखी गई है और सरल अर्थ पादटिप्पणी में दिया गया है।
- issue: וְרָאוּ के अनुल्लिखित कर्म को स्पष्ट करना
  choice: देखेंगे
  alternative: उसे देखेंगे
  rationale: सन्दर्भ में याहवे की महिमा देखी जाने वाली वस्तु है, पर इब्रानी पाठ में कर्मवाचक सर्वनाम नहीं है। इसलिए सम्भावित अर्थ स्पष्ट होते हुए भी ‘उसे’ मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। भविष्यसूचक गम्भीरता बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है। पादटिप्पणी-चिह्न को उसी पदबंध के बाद रखा गया है जिससे वह सम्बन्धित है।
