base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/025.yaml
  text: To whom then will you compare me[a], that I should be equal? says the Holy One.
translation:
  language: hi
  text: “तो तुम मेरी तुलना किससे करोगे कि मैं उसके बराबर ठहरूँ?” पवित्र परमेश्वर कहता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶל מִי
  choice: तो किससे
  rationale: אֶל तुलना के दूसरे पक्ष को सूचित करता है; प्रसंगगत וְ को स्वाभाविक हिन्दी में निष्कर्षात्मक ‘तो’ से व्यक्त किया गया है।
- source_word: תְדַמְּיוּנִי
  choice: तुम मेरी तुलना करोगे
  rationale: पिएल रूप का अर्थ ‘समान ठहराना/तुलना करना’ है। बहुवचन कर्ता को ‘तुम’ और प्रत्यय को ‘मेरी’ से स्पष्ट रखा गया है।
- source_word: וְאֶשְׁוֶה
  choice: कि मैं उसके समान ठहरूँ
  rationale: שוה यहाँ समानता या तुल्यता व्यक्त करता है। ‘उसके’ प्रश्नवाचक ‘किससे’ में निहित संभावित तुलनीय व्यक्ति/वस्तु को स्वाभाविक हिन्दी में ग्रहण करता है, जबकि प्रश्न की आलंकारिक शक्ति बनी रहती है।
- source_word: יֹאמַר
  choice: कहता है
  rationale: भविष्यत्/अपूर्ण क्रिया-रूप भविष्यवाणी के कथन-सूत्र में वर्तमानकालीन ‘कहता है’ के रूप में स्वाभाविक है।
- source_word: קָדוֹשׁ
  choice: पवित्र जन
  rationale: यहाँ शब्द ईश्वर की उपाधि है। मूल में ‘इस्राएल का’ नहीं है, इसलिए विस्तृत पारंपरिक उपाधि नहीं जोड़ी गई।
theological_decisions:
- issue: ईश्वर की अतुलनीयता और आत्म-वर्णन
  choice: आलंकारिक प्रश्न और संक्षिप्त उपाधि ‘पवित्र जन’ को बनाए रखा गया।
  alternative: ‘मेरे समान कौन है?’ या ‘इस्राएल का पवित्र जन’ कहकर विस्तार करना।
  rationale: मूल वाक्य तुलना की चुनौती के द्वारा ईश्वर की अतुलनीयता प्रकट करता है; उसे व्याख्यात्मक कथन में बदलना या उपाधि बढ़ाना मूल से आगे जाता।
- issue: וְאֶשְׁוֶה में समानता का संबंध
  choice: ‘कि मैं उसके समान ठहरूँ’
  alternative: ‘कि मैं बराबर ठहरूँ’
  rationale: क्रिया समान होने का भाव देती है और ‘किससे’ में एक तुलनीय पक्ष निहित है। हिन्दी में ‘उसके समान’ संबंध को सहज बनाता है, यद्यपि मूल में स्वतंत्र तृतीय-पुरुष सर्वनाम नहीं है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘पवित्र जन’ को ईश्वरीय उपाधि के रूप में रखा गया है; अनावश्यक धर्मशास्त्रीय विस्तार से बचा गया है।
