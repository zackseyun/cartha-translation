base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/017.yaml
  text: All the nations are as nothing before him[a]; they are regarded by him as less than nothing and emptiness.
translation:
  language: hi
  text: सभी राष्ट्र उसके सामने शून्य के समान हैं; उसकी दृष्टि में वे शून्य से भी कम और महज़ खालीपन गिने जाते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הַגּוֹיִם
  choice: सारी जातियाँ
  rationale: यह पद सभी राष्ट्रों/जातियों को सामूहिक रूप से दर्शाता है। ‘सारी जातियाँ’ आधुनिक हिन्दी में स्वाभाविक है और किसी विशिष्ट जातीय या धार्मिक समूह तक अर्थ को सीमित नहीं करता।
- source_word: כְּאַיִן
  choice: मानो कुछ भी नहीं
  rationale: तुलनासूचक כְּ और אַיִן की शून्यता को स्वाभाविक हिन्दी में व्यक्त करता है तथा इसे अस्तित्व के बारे में अनावश्यक दार्शनिक दावा बनने से बचाता है।
- source_word: נֶגְדּוֹ
  choice: उसके सामने
  rationale: स्थान और तुलना/मूल्यांकन—दोनों संभावित भावों को बनाए रखता है। संदर्भ में ‘उसके’ का संकेत परमेश्वर की ओर है।
- source_word: מֵאֶפֶס
  choice: शून्य से भी कम
  rationale: מִן को तुलनात्मक मानते हुए इब्रानी की अलंकारिक तीव्रता व्यक्त की गई है।
- source_word: וָתֹהוּ
  choice: और निरर्थक
  rationale: תֹהוּ यहाँ खोखलेपन, व्यर्थता या अव्यवस्था का बोध करा सकता है। ‘निरर्थक’ समानांतर कथन में सहज है, जबकि पादटिप्पणी वास्तविक शाब्दिक विस्तार सुरक्षित रखती है।
- source_word: נֶחְשְׁבוּ לוֹ
  choice: वे उसकी दृष्टि में ... समझी जाती हैं
  rationale: निफ़अल क्रिया के ‘गिनी/समझी जाती हैं’ भाव और לוֹ के मूल्यांकन-संबंधी अर्थ को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दूसरे खंड में नकार की तीव्रता
  choice: ‘शून्य से भी कम और निरर्थक’ के रूप में तीव्र अलंकारिक कथन
  alternative: ‘शून्यता और अव्यवस्था के समान’ अथवा ‘शून्य से भी कम और खाली’
  rationale: यह परमेश्वर की तुलना में जातियों की नगण्यता पर बल देता है, पर उनके वास्तविक अस्तित्व के निषेध जैसा दार्शनिक निष्कर्ष नहीं जोड़ता।
- issue: תֹהוּ का अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘निरर्थक’, पादटिप्पणी में ‘उजाड़पन/खालीपन/अव्यवस्था’
  alternative: मुख्य पाठ में ‘अव्यवस्था’
  rationale: इब्रानी शब्द की वास्तविक बहुअर्थकता सुरक्षित रखी गई है। इस संदर्भ में ‘निरर्थक’ समानांतरता के अनुकूल है, पर सृष्टि-वर्णन से जुड़े ‘अव्यवस्था’ के संभावित भाव को हटाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप। ‘मानो’ तुलना को स्पष्ट करता है; ‘उसके सामने’ और ‘उसकी दृष्टि में’ मूल के दो संबंधसूचक प्रयोगों का स्वाभाविक भेद बनाए रखते हैं।
