  text: וּ/לְבָנ֕וֹן אֵ֥ין דֵּ֖י בָּעֵ֑ר וְ/חַיָּת֔/וֹ אֵ֥ין דֵּ֖י עוֹלָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/016.yaml
  text: Lebanon is not enough to burn[b][a], nor are its animals enough for a burnt offering.
translation:
  language: hi
  text: और लबानोन आग जलाने के लिए पर्याप्त नहीं है,[a] और उसके पशु होमबलि के लिए पर्याप्त नहीं हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ लबानोन संभवतः अपने प्रसिद्ध वनों का संकेत देता है; भाव यह है कि उसकी सारी लकड़ी भी आग जलाने के लिए पर्याप्त न होगी।
    reason: cultural_note
  - marker: b
    text: ‘उसके पशु’ का अनुवाद ‘उसके जीव-जंतु’ भी हो सकता है; इब्रानी शब्द विशेष रूप से लबानोन के पशुओं को बलि के पशुओं के रूप में सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְבָנוֹן
  choice: बल्कि लबानोन
  rationale: इब्रानी में स्थान का नाम सीधे रखा गया है; आरंभिक וּ को प्रसंगानुसार विरोधात्मक ‘बल्कि’ से व्यक्त किया गया है। लबानोन अपने विशाल वनों का लक्षणार्थक संकेत भी देता है।
- source_word: אֵין דֵּי
  choice: पर्याप्त नहीं
  rationale: यह पदबंध अपर्याप्तता व्यक्त करता है; ‘पर्याप्त नहीं’ आधुनिक, स्वाभाविक और परिमाणात्मक अर्थ के निकट है।
- source_word: בָּעֵר
  choice: जलाने के लिए
  rationale: यहाँ क्रिया का आशय बलि की आग के लिए ईंधन जलाने से है; अनुक्त कर्म को जोड़े बिना हिंदी में स्वाभाविक रूप रखा गया है।
- source_word: וְחַיָּתוֹ
  choice: और न उसके जीव
  rationale: חיה पशु अथवा जीव का बोध करा सकता है और प्रत्यय लबानोन की ओर लौटता है। ‘जीव’ व्यापकता बनाए रखता है; ‘वन-पशु’ अर्थ को अनावश्यक रूप से सीमित करता।
- source_word: עוֹלָה
  choice: होमबलि
  rationale: यह उस मानक बलिदान का पद है जो वेदी पर पूर्णतः जलाया जाता था; हिंदी बाइबलीय प्रयोग में ‘होमबलि’ संक्षिप्त और सटीक है।
theological_decisions:
- issue: बलिदान-संबंधी चित्र का आशय
  choice: लबानोन की सारी लकड़ी और उसके जीव भी परमेश्वर की महिमा के अनुरूप होमबलि के लिए पर्याप्त नहीं हैं।
  alternative: यह सामान्य रूप से मानवीय उपासना के सभी साधनों की अपर्याप्तता का कथन है।
  rationale: यशायाह 40:12–17 का निकट प्रसंग परमेश्वर की अतुलनीय महानता पर बल देता है। अनुवाद बलिदान की ठोस भाषा बनाए रखता है और उससे आगे कोई विशिष्ट धर्मसैद्धांतिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और स्पष्ट शैली। ‘होमबलि’ धार्मिक-सांस्कृतिक सटीकता के लिए रखा गया है। दोनों समांतर खंडों में ‘पर्याप्त नहीं’ दोहराकर इब्रानी की संरचना और बल सुरक्षित रखा गया है।
