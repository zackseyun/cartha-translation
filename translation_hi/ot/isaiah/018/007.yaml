  text: בָּ/עֵת֩ הַ/הִ֨יא יֽוּבַל שַׁ֜י לַ/יהוָ֣ה צְבָא֗וֹת עַ֚ם מְמֻשָּׁ֣ךְ וּ/מוֹרָ֔ט וּ/מֵ/עַ֥ם נוֹרָ֖א מִן ה֣וּא וָ/הָ֑לְאָה גּ֣וֹי קַו קָ֣ו וּ/מְבוּסָ֗ה אֲשֶׁ֨ר בָּזְא֤וּ נְהָרִים֙ אַרְצ֔/וֹ אֶל מְק֛וֹם שֵׁם יְהוָ֥ה צְבָא֖וֹת הַר צִיּֽוֹן־־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/007.yaml
  text: At that time a gift will be brought to the LORD of Armies from a people tall and smooth-skinned, from a people feared far and wide, a nation of command upon command and trampling, whose land rivers divide, to the place of the name of the LORD of Armies, Mount Zion.
translation:
  language: hi
  text: उस समय सेनाओं के यहोवा के लिए एक भेंट लाई जाएगी—एक ऐसे लोगों की ओर से जो लंबे कद और चिकनी चमड़ी वाले हैं[a], जिनका भय दूर-दूर तक फैला है, और जो आज्ञा पर आज्ञा देनेवाला तथा रौंदनेवाला राष्ट्र है[b], जिसके देश को नदियाँ विभाजित करती हैं[c]। वह भेंट सेनाओं के यहोवा के नाम के स्थान, अर्थात् सिय्योन पर्वत पर लाई जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदों का अर्थ अनिश्चित है; इन्हें “खींचे हुए और मुंडे हुए” अथवा “लंबे और चिकने” भी समझा गया है।
    reason: מְמֻשָּׁךְ וּמוֹרָט के रूपक और शारीरिक संकेत पर विद्वानों में मतभेद है।
  - marker: b
    text: “आज्ञा पर आज्ञा देनेवाला” का इब्रानी वाक्यांश कठिन है; इसका अर्थ “नापनेवाला,” “पंक्ति पर पंक्ति,” या “सब कुछ पैरों तले रौंदनेवाला” भी समझा गया है।
    reason: קַו־קָו दुर्लभ और विवादित अभिव्यक्ति है; इसलिए मुख्य पाठ को अत्यधिक निश्चित नहीं माना जाना चाहिए।
  - marker: c
    text: या, “जिसके देश को नदियाँ उजाड़ती हैं।”
    reason: בָּזְאוּ को ‘विभाजित करना’ अथवा ‘लूटना/उजाड़ना’ समझा जा सकता है।
lexical_decisions:
- source_word: שַׁי
  choice: भेंट
  rationale: यह शब्द किसी शासक या देवता को दी जाने वाली भेंट अथवा उपहार को सूचित करता है; यहाँ आराधनात्मक संदर्भ में ‘भेंट’ स्वाभाविक है, जबकि ‘कर’ अर्थ को अनावश्यक रूप से सीमित कर देता।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: व्यक्तिगत दिव्य नाम और צְבָאוֹת की सैन्य/स्वर्गीय सेनाओं वाली उपाधि, दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: מְמֻשָּׁךְ וּמוֹרָט
  choice: लंबे कद और चिकनी चमड़ी वाले
  rationale: संदर्भ में किसी जनसमूह के शारीरिक वर्णन की प्रचलित समझ को स्वाभाविक हिन्दी में व्यक्त करता है, पर मूल पदों की अनिश्चितता फुटनोट में रखी गई है।
- source_word: נוֹרָא מִן־הוּא וָהָלְאָה
  choice: जिसका भय दूर-दूर तक फैला है
  rationale: शाब्दिक रूप से कठिन मुहावरे का आशय एक ऐसे लोगों से है जो अपने क्षेत्र से बहुत दूर तक भयभीत करने वाले माने जाते हैं।
- source_word: גּוֹי קַו־קָו וּמְבוּסָה
  choice: आज्ञा-पर-आज्ञा देनेवाला और रौंदनेवाला राष्ट्र
  rationale: कַו־קָו की पुनरुक्ति और וּמְבוּסָה के दमनकारी बिंब को बनाए रखते हुए परामर्श-पाठ के अर्थ को हिन्दी में व्यक्त करता है; वाक्यांश की वास्तविक अस्पष्टता फुटनोट में दी गई है।
- source_word: אֲשֶׁר בָּזְאוּ נְהָרִים אַרְצוֹ
  choice: जिसके देश को नदियाँ चीरती हैं
  rationale: नदी-जाल से विभाजित भूभाग का सजीव और स्वाभाविक वर्णन देता है; क्रिया के वैकल्पिक ‘उजाड़ना/लूटना’ अर्थ को फुटनोट में सुरक्षित रखा गया है।
- source_word: מְקוֹם שֵׁם יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा के नाम के स्थान
  rationale: ‘नाम’ को केवल उपस्थिति के अर्थ में विलीन न करके मूल की धार्मिक अभिव्यक्ति को औपचारिक रूप से बनाए रखता है।
theological_decisions:
- issue: भेंट का स्रोत और प्राप्तकर्ता
  choice: यहोवा के लिए भेंट उन लोगों की ओर से लाई जाएगी
  alternative: वे लोग स्वयं यहोवा के लिए भेंट के रूप में लाए जाएँगे
  rationale: לַיהוָה स्पष्ट रूप से प्राप्तकर्ता को बताता है, जबकि עַם से पहले व्यक्त ‘से’ अर्थ प्रसंग से ग्रहण किया जाता है। वाक्य-विन्यास दूसरी व्याख्या की कुछ गुंजाइश देता है, पर समानांतर आरंभिक घोषणा और प्रचलित स्रोत-पाठ की समझ लोगों को भेंट लाने वाले पक्ष के रूप में पढ़ती है।
- issue: दिव्य नाम का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में चार-अक्षरी व्यक्तिगत नाम יהוה है; ‘यहोवा’ इसे उपाधि ‘प्रभु’ में बदलने के बजाय हिन्दी बाइबलीय परंपरा में पहचाने जाने योग्य रूप में रखता है।
- issue: ‘यहोवा के नाम का स्थान’
  choice: वाक्यांश को यथावत रखा गया
  alternative: यहोवा का निवास-स्थान
  rationale: मूल का ‘नाम’ विषयक धार्मिक कथन जानबूझकर संरक्षित है; उसे सीधे ‘निवास’ कहना निहितार्थ को व्याख्या में बदल देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक-पाठ योग्य रूप अपनाया गया है। पद की लंबी संरचना को डैश और दो वाक्यों में बाँटकर स्पष्टता बढ़ाई गई है, जबकि मूल की पुनरावृत्ति, ‘नाम’ की अभिव्यक्ति और कठिन जातीय वर्णन सुरक्षित रखे गए हैं।
