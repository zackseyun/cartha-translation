  yaml_path: translation/ot/isaiah/018/005.yaml
  text: For before the harvest[a], when the blossom is finished and the flower becomes a ripening grape, he will cut off the shoots with pruning knives[b], and he will remove and lop off the spreading branches.
translation:
  language: hi
  text: क्योंकि कटनी से पहले[a], जब फूल खिलने की अवस्था पूरी हो जाए और फूल कच्चे अंगूर के रूप में विकसित होने लगे, तब वह कोमल डालियों को छँटाई के चाकुओं से काट डालेगा[b]; और फैली हुई शाखाओं को हटा देगा और काट डालेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “जब फूल खिलने की अवस्था पूरी हो जाए और फूल कच्चा अंगूर बनने लगे।” इब्रानी चित्र कटनी से पहले फूल से विकसित होते फल की ओर बढ़ता है।'
