  text: יֵעָזְב֤וּ יַחְדָּו֙ לְ/עֵ֣יט הָרִ֔ים וּֽ/לְ/בֶהֱמַ֖ת הָ/אָ֑רֶץ וְ/קָ֤ץ עָלָי/ו֙ הָ/עַ֔יִט וְ/כָל בֶּהֱמַ֥ת הָ/אָ֖רֶץ עָלָ֥י/ו תֶּחֱרָֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/006.yaml
  text: They will all be left to the birds of prey of the mountains and to the beasts of the earth[a]; and the birds of prey will summer on them[b], and every beast of the earth will winter on them.
translation:
  language: hi
  text: वे सब पहाड़ों के शिकारी पक्षियों और धरती के पशुओं के लिए छोड़ दिए जाएँगे[a]। शिकारी पक्षी उन पर गरमी बिताएँगे[b], और धरती के सब पशु उन पर सर्दी बिताएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “वे एक साथ पहाड़ों के शिकारी पक्षियों और धरती के पशुओं के लिए छोड़ दिए जाएँगे।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘शिकारी पक्षी’ और ‘उस पर’ एकवचन में हैं, पर यहाँ उनका प्रयोग समूहवाचक अर्थ में हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעָזְבוּ
  choice: छोड़ दिए जाएँगे
  rationale: 'निफ़अल रूप यहाँ निष्क्रिय अर्थ देता है: मारे गए लोग खुले में पड़े रहने के लिए छोड़ दिए जाएँगे।'
- source_word: יַחְדָּו
  choice: सब
  rationale: मूल अर्थ ‘एक साथ’ है, पर इस प्रसंग में सामूहिकता को स्वाभाविक हिन्दी में ‘वे सब’ व्यक्त करता है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: לְעֵיט הָרִים
  choice: पहाड़ों के शिकारी पक्षियों के लिए
  rationale: עַיִט शिकारी अथवा मृतभक्षी पक्षी को दर्शाता है। एकवचन रूप यहाँ समूहवाचक है, इसलिए हिन्दी में बहुवचन स्वाभाविक है।
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: और धरती के पशुओं के लिए
  rationale: בְּהֵמָה का अर्थ व्यापक रूप से पशु है। ‘धरती के पशु’ मूल की व्यापकता और समानांतर चित्र को बनाए रखता है।
- source_word: וְקָץ
  choice: गरमी बिताएँगे
  rationale: यह क्रिया गरमी का मौसम बिताने को दर्शाती है। यह हिन्दी में स्पष्ट है और ऋतु-संबंधी समानांतरता बनाए रखती है।
- source_word: תֶּחֱרָף
  choice: सर्दी बिताएँगे
  rationale: यहाँ अर्थ सर्दी का मौसम बिताना है; यह पहले खंड के ‘गरमी बिताएँगे’ के साथ स्वाभाविक समानांतर बनाता है।
- source_word: עָלָיו
  choice: उन पर
  rationale: इब्रानी में सर्वनाम एकवचन है, पर उसका संकेत सामूहिक रूप से छोड़े गए मृतकों अथवा उनके शवों की ओर है; हिन्दी बहुवचन संदर्भ स्पष्ट करता है।
