  text: כָּל יֹשְׁבֵ֥י תֵבֵ֖ל וְ/שֹׁ֣כְנֵי אָ֑רֶץ כִּ/נְשֹׂא נֵ֤ס הָרִים֙ תִּרְא֔וּ וְ/כִ/תְקֹ֥עַ שׁוֹפָ֖ר תִּשְׁמָֽעוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/003.yaml
  text: 'All you inhabitants of the world[a], and you dwellers on the earth: when a banner is raised on the mountains, you will see it; and when a trumpet is blown[b], you will hear it.'
translation:
  language: hi
  text: 'हे संसार के सभी निवासियो, और पृथ्वी पर रहनेवालो: जब पहाड़ों पर ध्वज[a] उठाया जाए, तो तुम उसे देखोगे; और जब तुरही[b] फूँकी जाए, तो तुम उसे सुनोगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संकेत” या “झंडा”; इब्रानी נֵס दूर से दिखाई देने के लिए ऊँचा किया गया चिह्न है।
    reason: lexical_alternative
  - marker: b
    text: या “सींग” अथवा “मेंढ़े का सींग”; इब्रानी שׁוֹפָר सामान्यतः फूँककर बजाया जानेवाला सींग है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יֹשְׁבֵי תֵבֵל
  choice: हे संसार के सभी निवासियो
  rationale: यह पद समस्त बसे हुए संसार को सीधे संबोधित करता है। संबोधनसूचक ‘हे’ हिन्दी में प्रत्यक्ष सार्वभौमिक पुकार को स्पष्ट और स्वाभाविक बनाता है।
- source_word: וְשֹׁכְנֵי אָרֶץ
  choice: और पृथ्वी पर रहनेवालो
  rationale: समानांतर पद की काव्यात्मक विविधता बनाए रखते हुए विश्वव्यापी संबोधन को दोहराता और प्रबल करता है।
- source_word: כִּנְשֹׂא
  choice: जब ... खड़ा किया जाए
  rationale: כִּי के कालवाचक अर्थ और अनिर्दिष्ट कर्ता को हिन्दी के स्वाभाविक कर्मवाच्य में रखा गया है।
- source_word: נֵס
  choice: झंडा
  rationale: यह दूर से दिखाई देने के लिए ऊँचा किया गया संकेत-चिह्न है। ‘झंडा’ सामान्य आधुनिक हिन्दी में सहज है; ‘संकेत-ध्वज’ अधिक विशिष्ट विकल्प है।
- source_word: הָרִים
  choice: पहाड़ों पर
  rationale: मूल के बहुवचन और ऊँचे, दूर से दिखाई देनेवाले स्थान का भाव सुरक्षित है।
- source_word: תִּרְאוּ
  choice: तुम उसे देखोगे
  rationale: द्वितीय पुरुष बहुवचन रखा गया है; ‘उसे’ संदर्भ में झंडे को स्वाभाविक रूप से सूचित करता है।
- source_word: וְכִתְקֹעַ שׁוֹפָר
  choice: और जब नरसिंगा फूँका जाए
  rationale: समानांतर कालवाचक संरचना और अनिर्दिष्ट कर्ता सुरक्षित हैं। שׁוֹפָר के लिए ‘नरसिंगा’ सामान्य ‘तुरही’ की अपेक्षा सींग से बने संकेत-वाद्य का अर्थ अधिक निकटता से व्यक्त करता है।
- source_word: תִּשְׁמָעוּ
  choice: तुम उसे सुनोगे
  rationale: द्वितीय पुरुष बहुवचन रखा गया है; ‘उसे’ फूँके गए नरसिंगे की ध्वनि को संदर्भानुसार व्यक्त करता है।
