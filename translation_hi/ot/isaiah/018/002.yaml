base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/002.yaml
  text: 'who sends envoys by sea in vessels of papyrus over the waters: “Go, swift messengers, to a nation tall and smooth-skinned[a], to a people feared far and wide, a nation that measures out and tramples down[b], whose land rivers divide[c].”'
translation:
  language: hi
  text: 'जो समुद्र के मार्ग से जल के ऊपर पपीरस की नावों में दूत भेजता है:


    “हे फुर्तीले संदेशवाहको, जाओ,


    उस लंबे कद और चिकनी त्वचा वाले राष्ट्र के पास[a],


    उस जाति के पास, जिसका दूर-दूर तक भय है,


    उस राष्ट्र के पास, जो नापता और रौंदता है[b],


    जिसकी भूमि को नदियाँ बाँटती हैं[c]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “खींचा हुआ और चमकाया हुआ”; संभवतः यह लोगों के शारीरिक रूप का वर्णन है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी पदबंध का शाब्दिक रूप लगभग “मापने की डोरी पर डोरी और रौंदना” है; इसका अर्थ अस्पष्ट है। इसका अनुवाद “जो नापता और रौंदता है” भी किया जा सकता है, या इसे किसी अन्य प्रकार का राष्ट्रीय विशेषण समझा जा सकता है।
    reason: alternative_reading
  - marker: c
    text: इसका अनुवाद “जिसकी भूमि को नदियाँ लूटती हैं” या “उजाड़ती हैं” भी हो सकता है। क्रिया का सामान्य अर्थ लूटना है; “बाँटती हैं” संदर्भ पर आधारित भौगोलिक व्याख्या है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֹּׁלֵחַ
  choice: जो ... दूत भेजता है
  rationale: संज्ञार्थक कृदंत पिछले पद में आरम्भ हुए वर्णन को आगे बढ़ाता है; हिन्दी में संबंधवाचक उपवाक्य स्वाभाविक है।
- source_word: צִירִים
  choice: दूत
  rationale: अंतरराष्ट्रीय संदर्भ में यह राजनयिक प्रतिनिधियों या दूतों को सूचित करता है; आगे מַלְאָכִים के लिए ‘संदेशवाहक’ रखकर दोनों शब्दों का हल्का भेद सुरक्षित किया गया है।
- source_word: בַּיָּם
  choice: समुद्र के मार्ग से
  rationale: यह भेजे जाने के जलमार्ग या माध्यम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּבִכְלֵי גֹמֶא
  choice: पपीरस की नावों में
  rationale: גֹמֶא पपीरस वनस्पति को सूचित करता है और כְלֵי यहाँ जलयान हैं; ‘नावों’ से सामान्य पाठक अर्थ तुरंत समझ सकता है।
- source_word: עַל פְּנֵי מַיִם
  choice: जल के ऊपर
  rationale: मूल का ‘जल की सतह पर/ऊपर’ वाला गतिशील चित्र संक्षिप्त और सहज रूप में रखा गया है।
- source_word: לְכוּ
  choice: जाओ
  rationale: बहुवचन आज्ञा का सीधा और स्वाभाविक अनुवाद।
- source_word: מַלְאָכִים קַלִּים
  choice: फुर्तीले संदेशवाहको
  rationale: קַלִּים यहाँ भार में हल्केपन से अधिक तीव्र गति बताता है; संबोधन के कारण ‘संदेशवाहको’ रूप रखा गया है।
- source_word: גּוֹי מְמֻשָּׁךְ וּמוֹרָט
  choice: लंबे और चिकनी त्वचा वाले राष्ट्र
  rationale: कठिन पदबंध की संभावित शारीरिक-वर्णन वाली व्याख्या को सहज हिन्दी में प्रस्तुत किया गया है, जबकि अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: עַם נוֹרָא מִן הוּא וָהָלְאָה
  choice: जिसका भय दूर-दूर तक माना जाता है
  rationale: दुरूह मुहावरे का आशय व्यापक रूप से भय उत्पन्न करने वाली जाति है; यह अनुवाद स्थान या समय की सीमा पर अनावश्यक निर्णय नहीं थोपता।
- source_word: גּוֹי קַו קָו וּמְבוּסָה
  choice: राष्ट्र ... जो नापता और रौंदता है
  rationale: קַו का मापने की डोरी से संबंध और מְבוּסָה का रौंदने का भाव रखा गया है; पदबंध की वास्तविक अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
- source_word: אֲשֶׁר בָּזְאוּ נְהָרִים אַרְצוֹ
  choice: जिसकी भूमि को नदियाँ बाँटती हैं
  rationale: संदर्भानुकूल भौगोलिक अर्थ एक नदियों से विभाजित प्रदेश का चित्र देता है; क्रिया का सामान्य ‘लूटना’ अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: दुरूह राष्ट्रीय विशेषणों की व्याख्या
  choice: मुख्य पाठ में संभावित शारीरिक वर्णन तथा नापने-रौंदने वाला अर्थ
  alternative: ‘खींचा हुआ और चमकाया हुआ’ तथा ‘डोरी पर डोरी और रौंदा हुआ’ जैसे अत्यधिक शाब्दिक रूप
  rationale: यहाँ कोई विशिष्ट सांप्रदायिक या धर्मवैज्ञानिक निष्कर्ष नहीं थोपा गया; सहज मुख्य पाठ के साथ भाषिक अनिश्चितता पादटिप्पणियों में खुलकर रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ काव्यात्मक गद्य रखा गया है। ‘पपीरस’ ऐतिहासिक वनस्पति की सटीक पहचान देता है; ‘फुर्तीले’ वर्तमान हिन्दी में गति का सहज बोध कराता है। मुख्य पाठ की पंक्ति-विभाजन भविष्यवाणी की लय और समानांतरता को उभारता है। सभी वास्तविक पाठगत अस्पष्टताएँ टिप्पणियों में बनाए रखी गई हैं।
