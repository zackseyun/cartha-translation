source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֤ר יְהוָה֙ אֵלַ֔/י אשקוטה וְ/אַבִּ֣יטָה בִ/מְכוֹנִ֑/י כְּ/חֹ֥ם צַח֙ עֲלֵי א֔וֹר כְּ/עָ֥ב טַ֖ל בְּ/חֹ֥ם קָצִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/004.yaml
  text: 'For this is what Yahweh said to me: “I will remain quiet and look on from my dwelling place[a], like clear heat in sunshine[b], like a cloud of dew in the heat of harvest.”'
translation:
  language: hi
  text: 'क्योंकि यहोवा ने मुझसे यह कहा: “मैं शांत रहूँगा और अपने निवास-स्थान से देखूँगा[a]—जैसे धूप में उजली गर्मी[b], जैसे कटनी की गर्मी में ओस का बादल।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं स्थिर रहूँगा और अपने निर्धारित स्थान से देखूँगा।”
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “जैसे प्रकाश पर निर्मल गर्मी।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: वाचा के विशिष्ट ईश्वरीय नाम को सामान्य उपाधि ‘प्रभु’ में बदलने के बजाय हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֵלַי
  choice: मुझसे
  rationale: ‘कहा’ के साथ אֶל और प्रथम पुरुष एकवचन प्रत्यय का स्वाभाविक हिन्दी रूप ‘मुझसे’ है; इससे मूल पाठ में उपस्थित संबोधन स्पष्ट रहता है।
- source_word: אשקוטה
  choice: मैं शांत रहूँगा
  rationale: שׁקט यहाँ निष्क्रिय विश्राम से अधिक शांत, अविचल और जानबूझकर हस्तक्षेप न करने की मुद्रा बताता है।
- source_word: וְאַבִּיטָה
  choice: और ... देखता रहूँगा
  rationale: נבט का आशय ध्यान से देखने का है; ‘देखता रहूँगा’ निरंतर अवलोकन को सहज हिन्दी में व्यक्त करता है।
- source_word: במכוני
  choice: अपने निवास-स्थान से
  rationale: מָכוֹן स्थापित या निश्चित स्थान को सूचित करता है और प्रसंग में ईश्वर के निवास का बोध देता है; ב को अवलोकन के दृष्टिबिंदु के रूप में ‘से’ किया गया है।
- source_word: כחם צח
  choice: जैसे ... निर्मल गरमी
  rationale: חֹם ‘गरमी’ और צַח उज्ज्वलता या निर्मलता व्यक्त करता है। असामान्य बिंब को व्याख्यात्मक रूप से बदलने के बजाय ‘निर्मल गरमी’ रखा गया है।
- source_word: עלי אור
  choice: धूप में
  rationale: शाब्दिक अर्थ ‘प्रकाश पर’ है, पर मौसम-संबंधी उपमा में ‘धूप में’ स्वाभाविक हिन्दी है और बिंब को स्पष्ट रखता है।
- source_word: כעב טל
  choice: जैसे ... ओस का बादल
  rationale: עָב ‘बादल’ और טַל ‘ओस’ है; ‘ओस का बादल’ मूल की ठोस किंतु असामान्य छवि को बनाए रखता है।
- source_word: בחם קציר
  choice: कटनी की गरमी में
  rationale: यह वाक्यांश कटनी के समय की गरमी दर्शाता है; ‘कटनी की गरमी में’ कृषि-परिवेश को संक्षिप्त और स्वाभाविक ढंग से रखता है।
theological_decisions:
- issue: ईश्वर की शांत रहकर देखने की मुद्रा
  choice: क्रियाओं को सीधे ‘मैं शांत रहूँगा और ... देखता रहूँगा’ के रूप में रखा गया है।
  alternative: इसे ‘मैं विश्राम करूँगा’ अथवा गुप्त रूप से दंड की तैयारी के स्पष्ट संकेत के रूप में अनूदित करना।
  rationale: मूल पद ईश्वर को शांत और देखते हुए प्रस्तुत करता है, पर इस मुद्रा को न उदासीनता और न तत्काल न्याय के रूप में स्पष्ट करता है। अनुवाद इस तनाव और अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। ‘निवास-स्थान,’ ‘कटनी’ और ‘ओस का बादल’ मूल के काव्यात्मक तथा कृषि-संबंधी बिंबों को सुरक्षित रखते हैं; दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
