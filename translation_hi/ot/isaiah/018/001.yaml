  text: ה֥וֹי אֶ֖רֶץ צִלְצַ֣ל כְּנָפָ֑יִם אֲשֶׁ֥ר מֵ/עֵ֖בֶר לְ/נַֽהֲרֵי כֽוּשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/001.yaml
  text: Ah[a], land of whirring wings, which is beyond the rivers of Cush[b],
translation:
  language: hi
  text: हाय[a], भनभनाते पंखों वाले देश, जो कूश की नदियों के पार है[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अरे, भनभनाते पंखों वाले देश” अथवा “हाय, सरसराते पंखों वाले देश।” इब्रानी अभिव्यक्ति कठिन है और पंखों, कीटों या पंख-जैसी किसी गतिशील वस्तु की ध्वनि का बोध करा सकती है।
    reason: lexical_alternative
  - marker: b
    text: कूश मिस्र के दक्षिण का क्षेत्र था, जिसे प्रायः नूबिया या प्राचीन इथियोपिया से जोड़ा जाता है।
    reason: cultural_note
lexical_decisions:
- source_word: הוֹי
  choice: हाय
  rationale: यह विस्मयादिबोधक शब्द विलाप, चेतावनी या पुकार आरम्भ कर सकता है। यहाँ स्वर को केवल दण्डसूचक बनाए बिना इसकी उद्गारात्मक शक्ति बनाए रखने के लिए ‘हाय’ चुना गया है।
- source_word: אֶרֶץ
  choice: देश
  rationale: यहाँ शब्द पूरी पृथ्वी नहीं, एक भौगोलिक भूभाग को सूचित करता है; आधुनिक हिन्दी में ‘देश’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: צִלְצַל כְּנָפָיִם
  choice: पंखों की भनभनाहट वाला
  rationale: इब्रानी पद कठिन है और पंखों, कीटों या पंख-जैसी गतिशील वस्तु की ध्वनि जगा सकता है। यह अनुवाद ध्वनि और पंखों की ठोस छवि दोनों को बनाए रखता है।
- source_word: מֵעֵבֶר לְנַהֲרֵי
  choice: नदियों के पार
  rationale: यह संयुक्त अभिव्यक्ति दूसरी ओर स्थित होने का बोध देती है; ‘के पार’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: כּוּשׁ
  choice: कूश
  rationale: ऐतिहासिक स्थान-नाम का लिप्यंतरण आधुनिक देश से अनावश्यक समानता स्थापित किए बिना मूल नाम को सुरक्षित रखता है।
theological_decisions:
- issue: כּוּשׁ की भौगोलिक पहचान
  choice: स्थान-नाम को ‘कूश’ के रूप में रखा गया है।
  alternative: इथियोपिया या नूबिया
  rationale: पाठ एक प्राचीन क्षेत्र का नाम देता है, किसी आधुनिक राष्ट्र-राज्य की सटीक पहचान नहीं; इसलिए लिप्यंतरण ऐतिहासिक अनिश्चितता बनाए रखता है।
- issue: הוֹי का भाव
  choice: ‘हाय’ द्वारा उद्गार और संभावित विलाप/चेतावनी दोनों की गुंजाइश रखी गई है।
  alternative: ‘धिक्कार’ या ‘अरे’
  rationale: ‘धिक्कार’ स्पष्ट निन्दा को पहले ही निश्चित कर देता, जबकि ‘अरे’ सम्भावित अशुभ या विलापपूर्ण स्वर को बहुत हल्का कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। कठिन इब्रानी ध्वनि-चित्र को अत्यधिक स्पष्ट किए बिना ‘पंखों की भनभनाहट’ में सुरक्षित रखा गया है।
