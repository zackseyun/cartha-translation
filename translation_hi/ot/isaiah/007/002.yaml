  text: וַ/יֻּגַּ֗ד לְ/בֵ֤ית דָּוִד֙ לֵ/אמֹ֔ר נָ֥חָֽה אֲרָ֖ם עַל אֶפְרָ֑יִם וַ/יָּ֤נַע לְבָב/וֹ֙ וּ/לְבַ֣ב עַמּ֔/וֹ כְּ/נ֥וֹעַ עֲצֵי יַ֖עַר מִ/פְּנֵי רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/002.yaml
  text: And it was reported to the house of David, saying, “Aram has settled on Ephraim.” And his heart and the heart of his people shook, as the trees of the forest shake before the wind.
translation:
  language: hi
  text: दाऊद के घराने को यह समाचार दिया गया, “अराम एप्रैम पर टिक गया है।” तब उसका हृदय और उसकी प्रजा का हृदय ऐसे काँप उठे, जैसे वन के पेड़ हवा से काँपते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְבֵית דָּוִד
  choice: दाऊद के घराने को
  rationale: यह पदबंध राजवंश या शासक-परिवार को सूचित करता है; ‘घराने’ से हिन्दी में उसका सामूहिक और वंशगत भाव बना रहता है।
- source_word: נָחָה
  choice: आ टिका है
  rationale: मूल क्रिया का सामान्य अर्थ उतरना, ठहरना या टिकना है। यह अनुवाद अराम की एप्रैम पर निर्भरता/स्थिति का रूपक बनाए रखता है और स्पष्ट रूप से ‘सन्धि कर ली’ जोड़कर अस्पष्टता को समाप्त नहीं करता।
- source_word: עַל אֶפְרָיִם
  choice: एप्रैम पर
  rationale: मूल पूर्वसर्ग ‘पर’ को बनाए रखा गया है, क्योंकि वाक्य का सैन्य-राजनीतिक आशय संदर्भ से निकलता है और यहाँ उसे अधिक स्पष्ट करना मूल की अभिव्यक्ति को संकरा कर देता।
- source_word: וַיָּנַע
  choice: काँप उठा
  rationale: क्रिया हिलने या डोलने को दर्शाती है; अगले वन-वृक्ष वाले उपमान से जुड़ते हुए ‘काँप उठा’ भय और शारीरिक हलचल दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְבָבוֹ וּלְבַב עַמּוֹ
  choice: उसका हृदय और उसकी प्रजा का हृदय
  rationale: एकवचन ‘हृदय’ की पुनरावृत्ति रखी गई है, जिससे राजा और प्रजा की समान भयाकुल प्रतिक्रिया उभरती है।
theological_decisions:
- issue: अराम और एप्रैम के संबंध का स्वरूप
  choice: “अराम एप्रैम पर आ टिका है” के रूप में मूल रूपक और अस्पष्टता बनाए रखी गई।
  alternative: “अराम ने एप्रैम से सन्धि कर ली है।”
  rationale: ऐतिहासिक संदर्भ गठबंधन का संकेत दे सकता है, पर हिब्रू में सीधे ‘सन्धि’ नहीं कहा गया। इसलिए व्याख्यात्मक निष्कर्ष को मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज लेकिन गरिमापूर्ण शैली। ‘समाचार दिया गया’ औपचारिक कथन को, और ‘आ टिका है’ मूल के असामान्य स्थानिक रूपक को बनाए रखता है। वन के पेड़ों और हवा का उपमान सरल, दृश्यात्मक भाषा में प्रस्तुत है।
