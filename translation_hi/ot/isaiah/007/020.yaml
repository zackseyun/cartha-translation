id: ISA.7.20
reference: Isaiah 7:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֡וּא יְגַלַּ֣ח אֲדֹנָ/י֩ בְּ/תַ֨עַר הַ/שְּׂכִירָ֜ה בְּ/עֶבְרֵ֤י נָהָר֙ בְּ/מֶ֣לֶךְ אַשּׁ֔וּר אֶת הָ/רֹ֖אשׁ וְ/שַׂ֣עַר הָ/רַגְלָ֑יִם וְ/גַ֥ם אֶת הַ/זָּקָ֖ן תִּסְפֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/020.yaml
  text: In that day the Lord will shave with a hired razor from beyond the River—with the king of Assyria—the head and the hair of the feet[a], and it will also sweep away the beard.
translation:
  language: hi
  text: उस दिन प्रभु नदी के पार से भाड़े पर लिए गए उस्तरे से—अर्थात् अश्शूर के राजा से—सिर और पैरों के बाल[a] मूँड़ देगा; वह उस्तरा दाढ़ी भी साफ कर देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पैरों के बाल’ का अर्थ ‘टाँगों के बाल’ भी हो सकता है। ‘पैर’ जननांगों के लिए शिष्टोक्ति भी हो सकता है, जिससे पूर्ण अपमान का भाव प्रबल होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגַלַּח
  choice: मूँड़ देगा
  rationale: पिएल रूप बालों को उस्तरे से काटने या मूँड़ने का बोध देता है। हिंदी में उस्तरे और सिर के संदर्भ में ‘मूँड़ देगा’ स्वाभाविक और चित्रात्मक है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह परमेश्वर के लिए प्रयुक्त उपाधि अदोनाय है, न कि यहाँ चतुरक्षरीय परमेश्वर-नाम। ‘प्रभु’ आधुनिक हिंदी में इसका प्रतिष्ठित और स्वाभाविक रूप है।
- source_word: בְּתַעַר הַשְּׂכִירָה
  choice: भाड़े पर लिए गए उस्तरे से
  rationale: תער का अर्थ ‘उस्तरा’ और שׂכירה का अर्थ ‘भाड़े पर लिया हुआ’ है। यह वाक्यांश अश्शूर को परमेश्वर द्वारा साधन के रूप में इस्तेमाल किए जाने का रूपक बनाए रखता है।
- source_word: בְּעֶבְרֵי נָהָר
  choice: नदी के पार से
  rationale: शाब्दिक भाव ‘नदी के पार के क्षेत्रों में/से’ है और यहाँ ‘नदी’ से फरात का संकेत है। मुख्य पाठ मूल की भौगोलिक संज्ञा और संक्षिप्तता बनाए रखता है।
- source_word: בְּמֶלֶךְ אַשּׁוּר
  choice: अर्थात् अश्शूर के राजा से
  rationale: यह पद भाड़े के उस्तरे की पहचान अश्शूर के राजा के रूप में करता है और साथ ही साधन का भाव रखता है। ‘अर्थात्’ हिंदी में इस समानाधिकरण को स्पष्ट करता है।
- source_word: הָרֹאשׁ
  choice: सिर
  rationale: यह सीधा शारीरिक शब्द है और मूँड़ने के रूपक का पहला कर्म है।
- source_word: שַׂעַר הָרַגְלָיִם
  choice: पैरों के बाल
  rationale: मुख्य पाठ शाब्दिक अभिव्यक्ति को बनाए रखता है। ‘पैर’ का आशय टाँगें हो सकता है और यह जननांगों के लिए शिष्टोक्ति भी हो सकती है; इसलिए विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: וְגַם אֶת הַזָּקָן
  choice: दाढ़ी भी
  rationale: גם का ‘भी’ वाला बल पूर्ण अपमान की ओर बढ़ते चित्र को सुरक्षित रखता है।
- source_word: תִּסְפֶּה
  choice: साफ कर देगा
  rationale: ספה का भाव पूरी तरह हटा देने या समाप्त कर देने का है। स्त्रीलिंग क्रिया का कर्ता ‘उस्तरा’ है; हिंदी में उसे स्पष्ट दोहराने से कर्ता-संबंध और चित्र दोनों साफ रहते हैं।
theological_decisions:
- issue: मूँड़ने के रूपक की व्याख्या
  choice: प्रभु अश्शूर को यहूदा पर अपमानजनक न्याय के अपने साधन के रूप में इस्तेमाल करता है।
  alternative: इसे अपमान पर विशेष बल दिए बिना केवल सैनिक पराजय का वर्णन माना जाए।
  rationale: सिर, शरीर के निचले भाग के बाल और दाढ़ी तक मूँड़ने का चित्र केवल हार नहीं, बल्कि पूर्ण रूप से बेइज्जत और वंचित किए जाने को दर्शाता है। वाक्य-विन्यास अश्शूर के राजा को प्रभु के हाथ में ‘भाड़े का उस्तरा’ बताता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अर्थात्’ रूपक में उस्तरे और अश्शूर के राजा की पहचान स्पष्ट करता है, जबकि पादटिप्पणी मूल अभिव्यक्ति की वास्तविक शाब्दिक और शिष्टोक्तिपरक अस्पष्टता सुरक्षित रखती है।
