  text: फिर याहवे ने आहाज़ से कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹסֶף
  choice: फिर
  rationale: יָסַף + infinitive का मुहावरा किसी काम के दोबारा या आगे जारी होने को बताता है। प्रसंग में परमेश्वर के पुनः बोलने की बात है; हिंदी में ‘फिर ... कहा’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चतुरक्षरीय व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिंदी में उसके प्रचलित ध्वन्यात्मक रूप ‘यहवे’ से प्रस्तुत किया गया है।
- source_word: דַּבֵּר
  choice: कहा
  rationale: וַיּוֹסֶף के साथ यह infinitive ‘फिर बोलना’ दर्शाता है। अगले पद में प्रत्यक्ष वचन आरंभ होने के कारण ‘कहा’ आधुनिक हिंदी कथा-शैली में सहज है।
- source_word: אֶל
  choice: से
  rationale: बोलने के संबोधित व्यक्ति को हिंदी में स्वाभाविक रूप से ‘आहाज़ से कहा’ द्वारा व्यक्त किया जाता है।
- source_word: אָחָז
  choice: आहाज़
  rationale: इब्रानी व्यक्तिनाम का हिंदी लिप्यंतरण।
- source_word: לֵאמֹר
  choice: कहा
  rationale: לֵאמֹר आगामी कथन का परिचय देता है। हिंदी में अलग ‘यह कहते हुए’ जोड़ना अनावश्यक और बोझिल होता; ‘कहा’ वही वाक्यगत कार्य करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम יהוה है। ‘यहवे’ नाम को नाम ही रहने देता है, जबकि ‘प्रभु’ उसे उपाधि में बदल देता; ‘यहोवा’ एक वैकल्पिक पारंपरिक लिप्यंतरण है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। इब्रानी मुहावरे का शाब्दिक ‘बोलना और बढ़ाया’ न रखकर उसके पुनरावृत्त अर्थ को ‘फिर’ से व्यक्त किया गया है। लֵאמֹר को अलग से दोहराने के बजाय हिंदी के एक ही ‘कहा’ में समाहित किया गया है।
