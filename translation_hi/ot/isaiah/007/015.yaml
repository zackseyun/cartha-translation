  yaml_path: translation/ot/isaiah/007/015.yaml
  text: He will eat curds and honey by the time he knows to refuse the evil and choose the good[a][b].
translation:
  language: hi
  text: वह दही और शहद खाएगा, जब वह बुराई को ठुकराना और भलाई को चुनना जान जाएगा[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उस समय तक दही और शहद खाएगा जब वह बुराई को ठुकराना और भलाई को चुनना जान जाएगा।” इब्रानी अभिव्यक्ति उस समय-सीमा को भी सूचित कर सकती है जिसके भीतर यह बात लागू होती है।
    reason: alternative_reading
  - marker: b
    text: “दही” का अनुवाद “मक्खन” या “मलाई” भी किया जा सकता है; इब्रानी शब्द व्यापक रूप से दूध से बने पदार्थ को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאָה
  choice: दही
  rationale: यह शब्द दूध से बने गाढ़े या जमे हुए पदार्थ को दर्शाता है। इस प्रसंग में आधुनिक हिन्दी का ‘दही’ स्वाभाविक है; ‘मक्खन’ या ‘मलाई’ भी सम्भव हैं।
- source_word: וּדְבַשׁ
  choice: और शहद
  rationale: דְבַשׁ का सामान्य और सहज हिन्दी अर्थ ‘शहद’ है; संयोजक וּ को ‘और’ के रूप में रखा गया है।
- source_word: יֹאכֵל
  choice: वह ... खाएगा
  rationale: भविष्यसूचक प्रसंग में अपूर्ण क्रियारूप को भविष्यकाल में व्यक्त किया गया है।
- source_word: לְדַעְתּוֹ
  choice: जब वह ... जानने लगेगा
  rationale: לְ के साथ क्रियार्थक संज्ञा और प्रत्यय को यहाँ काल-सूचक माना गया है। ‘जानने लगेगा’ बच्चे के उस अवस्था तक पहुँचने का स्वाभाविक हिन्दी संकेत देता है, पर भोजन को नैतिक विवेक का कारण नहीं बनाता।
- source_word: מָאוֹס
  choice: ठुकराना
  rationale: नैतिक विरोध में इसका आशय केवल भावनात्मक घृणा नहीं, बल्कि बुराई को अस्वीकार करना है।
- source_word: בָּרָע
  choice: बुराई को
  rationale: संज्ञीकृत विशेषण और निश्चितता को स्वाभाविक हिन्दी में ‘बुराई’ से व्यक्त किया गया है।
- source_word: וּבָחוֹר
  choice: और ... चुनना
  rationale: यह מָאוֹס के समानांतर क्रिया है; ‘चुनना’ इसका सीधा और सहज अर्थ है।
- source_word: בַּטּוֹב
  choice: भलाई को
  rationale: ‘भलाई’ नैतिक ‘अच्छे’ को संज्ञा के रूप में व्यक्त करती है और ‘बुराई’ के साथ स्पष्ट समानांतर बनाती है।
theological_decisions:
- issue: לְדַעְתּוֹ का बच्चे के भोजन और नैतिक विवेक से काल-संबंध
  choice: इसे ‘जब वह ... जानने लगेगा’ के रूप में काल-सूचक रखा गया है।
  alternative: ‘उस समय तक जब वह ... जानने लगेगा’ अथवा उद्देश्यसूचक ‘ताकि वह ... जाने’।
  rationale: इब्रानी रचना प्रसंग में काल-सूचक अर्थ की अनुमति देती है। यह अनुवाद भोजन को नैतिक विवेक का कारण बताने से बचता है और बच्चे की बढ़ती अवस्था से जुड़ी भविष्यसूचक समय-सीमा बनाए रखता है; समय की दूसरी सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली रखी गई है। ‘दही और शहद’ सामान्य पाठक के लिए स्पष्ट है, जबकि काल-संबंध और दूध से बने पदार्थ की शाब्दिक सम्भावनाएँ पादटिप्पणियों में सुरक्षित रखी गई हैं।
