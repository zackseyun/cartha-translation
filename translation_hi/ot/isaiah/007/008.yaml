base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/008.yaml
  text: For the head of Aram is Damascus[a], and the head of Damascus is Rezin; and within sixty-five years Ephraim will be shattered from being a people.
translation:
  language: hi
  text: क्योंकि अराम का सिर दमिश्क है, और दमिश्क का सिर रसीन है; और पैंसठ वर्ष के भीतर एप्रैम ऐसा चकनाचूर हो जाएगा कि वह एक राष्ट्र न रहेगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एप्रैम चकनाचूर हो जाएगा, ताकि वह राष्ट्र न रहे।”
    reason: इब्रानी מֵעָם को ‘एक राष्ट्र होने से अलग’ अथवा परिणामसूचक, ‘ताकि वह राष्ट्र न रहे,’ के अर्थ में समझा जा सकता है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण अथवा स्पष्टीकरण देता है; इसलिए ‘क्योंकि’ उसके तार्किक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: רֹאשׁ
  choice: सिर
  rationale: 'मूल रूपक और दोनों समानांतर खंडों को सुरक्षित रखा गया है: पहले एक नगर देश का ‘सिर’ है, फिर एक व्यक्ति नगर का ‘सिर’ है। ‘राजधानी’ दूसरे खंड में उपयुक्त नहीं होती।'
- source_word: אֲרָם
  choice: अराम
  rationale: मूल इब्रानी नाम को रखा गया है; ‘सीरिया’ कहने से बाद के भू-राजनीतिक अर्थ जुड़ सकते हैं।
- source_word: דַּמֶּשֶׂק
  choice: दमिश्क
  rationale: स्थान-नाम का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: רְצִין
  choice: रसीन
  rationale: व्यक्ति-नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: וּבְעוֹד
  choice: और ... के भीतर
  rationale: यह अभिव्यक्ति घटना होने तक बची हुई समयावधि बताती है; ‘के भीतर’ आधुनिक हिन्दी में उसका स्वाभाविक अर्थ देता है।
- source_word: שִׁשִּׁים וְחָמֵשׁ שָׁנָה
  choice: पैंसठ वर्ष
  rationale: संख्या-वाक्यांश का मानक आधुनिक हिन्दी रूप।
- source_word: יֵחַת
  choice: चकनाचूर हो जाएगा
  rationale: निफ़ाल रूप यहाँ किसी राष्ट्रीय इकाई के निर्णायक टूटने या ध्वस्त होने को व्यक्त करता है; यह चयन उस तीव्रता को स्पष्ट रखता है।
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: मूल पाठ में दिए विशिष्ट जनजातीय और राष्ट्रीय नाम को किसी व्याख्यात्मक विकल्प, जैसे ‘उत्तरी राज्य’, से नहीं बदला गया।
- source_word: מֵעָם
  choice: कि वह एक प्रजा न रहेगा
  rationale: מִן के वियोगात्मक अथवा परिणामी भाव को स्वाभाविक हिन्दी में इस तरह व्यक्त किया गया है कि एप्रैम का एक विशिष्ट प्रजा के रूप में अस्तित्व समाप्त होगा। अधिक शब्दशः संभाव्यता पादटिप्पणी में सुरक्षित है।
