  yaml_path: translation/ot/isaiah/007/019.yaml
  text: And they will all come and settle in the steep ravines[a], in the clefts of the rocks, in all the thornbushes[c][b], and in all the watering places.
translation:
  language: hi
  text: और वे सब आकर खड़ी ढालों वाली घाटियों[a] में, चट्टानों की दरारों में, सब कँटीली झाड़ियों में और सब चरागाहों[b] में टिक जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी अभिव्यक्ति कठिन है; इसके अनुवाद ‘उजाड़ घाटियाँ’ या ‘खड़ी चट्टानों की घाटियाँ’ भी किए गए हैं।
    reason: lexical_alternative
  - marker: b
    text: यह इब्रानी शब्द दुर्लभ है और इसका अर्थ अनिश्चित है; इसका अर्थ ‘पानी के स्थान’ या ‘घास के मैदान’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  choice: आकर
  rationale: भविष्यसूचक क्रम में क्रिया भावी घटना बताती है; संयुक्त क्रिया ‘आकर ... टिक जाएँगे’ हिन्दी में स्वाभाविक है।
- source_word: וְנָחוּ
  choice: टिक जाएँगे
  rationale: נוח यहाँ झुंडों के उतरकर किसी स्थान पर ठहरने का भाव देता है; ‘टिक जाएँगे’ ‘विश्राम करेंगे’ की अपेक्षा प्रसंगानुकूल और सहज है।
- source_word: כֻלָּם
  choice: वे सब
  rationale: इब्रानी में उल्लिखित पूरे झुंड या दल की समग्रता स्पष्ट रखी गई है।
- source_word: בְּנַחֲלֵי הַבַּתּוֹת
  choice: खड़ी घाटियों में
  rationale: נחלי घाटियों/बरसाती नालों को सूचित करता है, जबकि הבתות कठिन और अनिश्चित पद है; ‘खड़ी घाटियाँ’ दुर्गम, कटी हुई भू-आकृति का संभावित अर्थ संक्षेप में व्यक्त करता है।
- source_word: וּבִנְקִיקֵי הַסְּלָעִים
  choice: चट्टानों की दरारों में
  rationale: नְקִיקֵי चीरों या दरारों और סְּלָעִים चट्टानों को दर्शाता है; यह सीधा और सामान्य हिन्दी रूप है।
- source_word: וּבְכֹל הַנַּעֲצוּצִים
  choice: सब कँटीली झाड़ियों में
  rationale: यह पद काँटेदार वनस्पति को सूचित करता है; ‘कँटीली झाड़ियाँ’ आधुनिक पाठक के लिए स्पष्ट और चित्रात्मक है।
- source_word: וּבְכֹל הַנַּהֲלֹלִים
  choice: सब चरागाहों में
  rationale: दुर्लभ और अनिश्चित पद के लिए ‘चरागाह’ एक मान्य प्रासंगिक अर्थ है; अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
