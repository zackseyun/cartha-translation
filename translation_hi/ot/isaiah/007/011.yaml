reference: Isaiah 7:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שְׁאַל לְ/ךָ֣ א֔וֹת מֵ/עִ֖ם יְהוָ֣ה אֱלֹהֶ֑י/ךָ הַעְמֵ֣ק שְׁאָ֔לָה א֖וֹ הַגְבֵּ֥הַּ לְ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/011.yaml
  text: 'Ask for yourself a sign from Yahweh your God: make it as deep as Sheol or as high as heaven[a].'
translation:
  language: hi
  text: अपने परमेश्वर याहवे से अपने लिए एक चिन्ह माँग—ऐसा चिन्ह जो अधोलोक जितना गहरा या आकाश जितना ऊँचा हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “गहरा कर माँग ... या ऊपर की ओर ऊँचा कर।” ‘अधोलोक’ और ‘आकाश’ क्रमशः निचले और ऊपरी चरम को स्पष्ट करते हैं; अंतिम पद में शाब्दिक रूप से केवल ‘ऊपर की ओर’ है।
    reason: मूल के असामान्य आज्ञार्थक पदबंध और ‘अधोलोक ... आकाश’ की व्याख्यात्मक स्पष्टता को दर्शाना।
lexical_decisions:
- source_word: שְׁאַל לְךָ
  choice: अपने लिए ... माँग
  rationale: द्वितीय पुरुष एकवचन की आज्ञा के साथ לְךָ का व्यक्तिगत बल बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אוֹת
  choice: कोई चिन्ह
  rationale: भविष्यद्वाणी के प्रसंग में यह परमेश्वर की ओर से मिलने वाला प्रमाणसूचक चिन्ह है; ‘चिन्ह’ इसका स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: מֵעִם יְהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर याहवे से
  rationale: מֵעִם स्रोत को व्यक्त करता है; יְהוָה को पदवी से बदलने के बजाय व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: הַעְמֵק שְׁאָלָה
  choice: चाहे अधोलोक की गहराई तक
  rationale: पदबंध में ‘माँगने’ और चरम गहराई की सघन शब्दक्रीड़ा है। मुख्य पाठ ‘अधोलोक’ के साथ निचले चरम को स्पष्ट करता है, जबकि शाब्दिक संरचना और संभावित शब्दक्रीड़ा पादटिप्पणी में सुरक्षित हैं।
- source_word: הַגְבֵּהַּ לְמָעְלָה
  choice: ऊपर आकाश की ऊँचाई तक
  rationale: शाब्दिक अर्थ ‘ऊपर की ओर ऊँचा कर’ है। ‘आकाश’ निहित ऊपरी चरम को सहज हिन्दी में स्पष्ट करता है और अधोलोक के साथ पूरे विस्तार का युग्म बनाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत चतुरक्षरीय नाम है; उसका लिप्यंतरण नाम को किसी पदवी से प्रतिस्थापित नहीं करता।
- issue: गहराई और ऊँचाई के युग्म की व्याख्या
  choice: अधोलोक की गहराई ... आकाश की ऊँचाई
  alternative: माँगने को गहरा कर ... ऊपर की ओर ऊँचा कर
  rationale: यह पाठ चिन्ह माँगने की सीमा को निम्नतम से उच्चतम तक फैलाता है। फिर भी ‘अधोलोक’ और ‘आकाश’ दोनों में व्याख्यात्मक स्पष्टता जुड़ती है, इसलिए अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आज्ञार्थक ‘माँग’ राजा आहाज से सीधे संबोधन को बनाए रखता है; डैश के बाद का युग्म चिन्ह की असीमित परिधि को संक्षेप में व्यक्त करता है।
