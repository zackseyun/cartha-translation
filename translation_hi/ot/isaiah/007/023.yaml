  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא יִֽהְיֶ֣ה כָל מָק֗וֹם אֲשֶׁ֧ר יִֽהְיֶה שָּׁ֛ם אֶ֥לֶף גֶּ֖פֶן בְּ/אֶ֣לֶף כָּ֑סֶף לַ/שָּׁמִ֥יר וְ/לַ/שַּׁ֖יִת יִֽהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/023.yaml
  text: And in that day[b][a], every place where there were a thousand vines worth a thousand pieces of silver will become briars and thorns.
translation:
  language: hi
  text: उस दिन ऐसा होगा कि हर वह स्थान, जहाँ एक हज़ार चाँदी के मूल्य वाली एक हज़ार अंगूर की बेलें हुआ करती थीं[a][b], झाड़-झंखाड़ और काँटों से ढक जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जहाँ एक हज़ार चाँदी के मूल्य वाली एक हज़ार अंगूर की बेलें होंगी।” इब्रानी अपूर्ण क्रिया का अधिक शाब्दिक अनुवाद ऐसा हो सकता है, पर सन्दर्भ पहले की बहुमूल्य दाखबारी और उसके भावी उजाड़ के बीच विरोध का संकेत देता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “एक हज़ार बेलें, एक हज़ार चाँदी में” है। इस पद में मुद्रा की ठीक इकाई स्पष्ट नहीं की गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ऐसा होगा
  rationale: यह भविष्यसूचक परिस्थिति का परिचय देता है; हिन्दी में ‘ऐसा होगा कि’ स्वाभाविक रूप से आगे के परिणाम से जोड़ता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: भविष्यसूचक समय-सूचक सूत्र का सीधा, प्रचलित और गरिमापूर्ण हिन्दी रूप।
- source_word: כָל מָקוֹם
  choice: हर वह स्थान
  rationale: वितरणात्मक अर्थ को स्पष्ट रखते हुए सम्बन्धवाचक उपवाक्य के साथ स्वाभाविक हिन्दी।
- source_word: אֲשֶׁר יִהְיֶה שָּׁם
  choice: जहाँ ... हुआ करती थीं
  rationale: क्रिया रूप अपूर्ण है और शाब्दिकतः भविष्य का अर्थ दे सकता है, पर सन्दर्भ बहुमूल्य दाखबारी की पूर्व दशा और आनेवाली उजाड़ अवस्था के बीच विरोध दर्शाता है।
- source_word: אֶלֶף גֶּפֶן
  choice: एक हज़ार अंगूर की बेलें
  rationale: גפן का आशय दाखलता/अंगूर की बेल है; आधुनिक सामान्य हिन्दी में ‘अंगूर की बेलें’ सर्वाधिक स्पष्ट है।
- source_word: בְּאֶלֶף כָּסֶף
  choice: चाँदी के एक हज़ार सिक्कों के मूल्य की
  rationale: यह मूल्यांकन व्यक्त करता है। मूल में मुद्रा की सटीक इकाई नहीं दी गई, इसलिए ‘सिक्कों’ को सुबोध सामान्य अभिव्यक्ति के रूप में रखा और टिप्पणी में अनिश्चितता बताई गई है।
- source_word: לַשָּׁמִיר וְלַשַּׁיִת
  choice: झाड़-झंखाड़ और काँटे
  rationale: दोनों शब्द काँटेदार, अनियंत्रित वनस्पति की पारम्परिक जोड़ी हैं; सटीक वनस्पति-पहचान अनिश्चित होने के कारण व्यापक और स्वाभाविक हिन्दी चुनी गई।
- source_word: יִהְיֶה
  choice: से भर जाएगा
  rationale: ‘के लिए होगा’ की अपेक्षा यह आनेवाली उजाड़ और काँटेदार दशा को स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि मूल क्रिया सामान्यतः ‘होगा’ है।
