base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/022.yaml
  text: And it will happen that because of the abundance of milk he gives[a], he will eat curds; for everyone left in the midst of the land will eat curds and honey.
translation:
  language: hi
  text: और ऐसा होगा कि दूध की बहुतायत के कारण वह दही[a] खाएगा; क्योंकि देश के बीच में बचे हुए सभी लोग दही और मधु खाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मक्खन।” इब्रानी शब्द חֶמְאָה आधुनिक मक्खन तक सीमित न होकर दही, मलाई या अन्य गाढ़े दुग्ध-पदार्थ का उल्लेख कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: और ऐसा होगा
  rationale: इब्रानी के भावी परिणामसूचक सूत्र को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: מֵרֹב עֲשׂוֹת חָלָב
  choice: उसके पशु इतना अधिक दूध देंगे कि
  rationale: शाब्दिक रूप से वाक्यांश 'दूध उत्पन्न करने की बहुतायत के कारण' है; सन्दर्भ में दूध देने वाले पशु निहित हैं। उन्हें स्पष्ट करने से हिन्दी स्वाभाविक बनती है, और 'इतना...कि' कारण तथा परिणाम का सम्बन्ध दिखाता है।
- source_word: יֹאכַל חֶמְאָה
  choice: वह दही खाएगा
  rationale: חֶמְאָה गाढ़े या जमे हुए दुग्ध-पदार्थ का द्योतक हो सकता है। 'दही' सामान्य आधुनिक हिन्दी में बोधगम्य है और आधुनिक मक्खन का अनावश्यक विशिष्ट अर्थ नहीं थोपता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आगे आने वाले व्यापक कथन को पहले कथन के स्पष्टीकरण या आधार के रूप में प्रस्तुत करता है।
- source_word: חֶמְאָה וּדְבַשׁ
  choice: दही और मधु
  rationale: पहले पद के अनुवाद से संगति रखते हुए परिचित युग्म को सुरक्षित रखता है; 'मधु' यहाँ शहद के लिए गरिमापूर्ण और सहज बाइबलीय हिन्दी है।
- source_word: כָּל הַנּוֹתָר
  choice: बचे हुए सभी लोग
  rationale: संज्ञा की तरह प्रयुक्त कृदन्त को जीवित बचे व्यक्तियों के रूप में स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: देश के बीच में
  rationale: בקרב के 'बीच/मध्य में' वाले स्थानिक भाव को केवल 'देश में' कहकर समतल नहीं करता।
