base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/014.yaml
  text: 'Therefore the Lord himself will give you a sign: behold[a], the young woman is pregnant and is bearing a son[d][c][b], and she will call his name Immanuel.'
translation:
  language: hi
  text: 'इसलिए प्रभु स्वयं तुम लोगों को एक चिह्न देगा: देखो, वह युवती[a] गर्भवती है और एक पुत्र को जन्म देने वाली है[b]; वह उसका नाम इम्मानुएल[d] रखेगी।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वह कुँवारी।’ यहाँ इब्रानी शब्द עַלְמָה (‘युवती’) है। यूनानी सेप्टुआजेंट इसका अनुवाद ऐसे शब्द से करता है जिसे प्रायः ‘कुँवारी’ समझा जाता है, और मत्ती 1:23 इसी रूप में इस पद को उद्धृत करता है।
    reason: alternative_reading
  - marker: b
    text: 'पारंपरिक अनुवाद: ‘गर्भधारण करेगी और पुत्र जनेगी।’ इब्रानी अधिक शाब्दिक रूप से उस स्त्री को गर्भवती और पुत्र को जन्म देने वाली बताता है।'
    reason: lexical_alternative
  - marker: c
    text: या ‘तुम उसका नाम रखोगे।’ कुछ प्राचीन अनुवाद-परंपराओं में ऐसा रूप मिलता है; मत्ती 1:23 में ‘वे उसका नाम रखेंगे’ है।
    reason: textual_variant
  - marker: d
    text: ‘इम्मानुएल’ का अर्थ है ‘परमेश्वर हमारे साथ है।’
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह आहाज के इनकार के परिणामस्वरूप प्रभु द्वारा चिह्न दिए जाने की बात आरंभ करता है।
- source_word: אֲדֹנָי הוּא
  choice: प्रभु स्वयं
  rationale: אֲדֹנָי का स्वाभाविक हिन्दी रूप ‘प्रभु’ है, और स्वतंत्र सर्वनाम הוּא के बल को ‘स्वयं’ व्यक्त करता है।
- source_word: לָכֶם
  choice: तुम लोगों को
  rationale: इब्रानी रूप बहुवचन है; यह अनुवाद हिन्दी में उस बहुवचन को स्पष्ट रखता है।
- source_word: אוֹת
  choice: एक चिह्न
  rationale: यह परमेश्वर की ओर से दिए जाने वाले संकेत अथवा प्रमाण का सामान्य शब्द है।
- source_word: הִנֵּה
  choice: देखो
  rationale: आधुनिक और गरिमापूर्ण हिन्दी में यह ध्यान आकर्षित करने वाली इब्रानी अभिव्यक्ति की शक्ति बनाए रखता है।
- source_word: הָעַלְמָה
  choice: वह युवती
  rationale: עַלְמָה विवाह-योग्य आयु की युवती को सूचित करता है, पर अपने आप में उसके कुँवारी होने को अनिवार्य रूप से व्यक्त नहीं करता। निश्चित उपपद को ‘वह’ से दर्शाया गया है।
- source_word: הָרָה
  choice: गर्भवती है
  rationale: यह रूप वर्तमान गर्भावस्था का वर्णन करने वाला विधेय विशेषण है, इसलिए इसे साधारण भविष्यकाल नहीं बनाया गया।
- source_word: וְיֹלֶדֶת בֵּן
  choice: और एक पुत्र को जन्म दे रही है
  rationale: स्त्रीलिंग एकवचन कृदंत को उसके वर्तमान अथवा निकटवर्ती अर्थ को पूरी तरह भविष्य में बदले बिना व्यक्त किया गया है।
- source_word: וְקָרָאת שְׁמוֹ
  choice: वह उसका नाम … रखेगी
  rationale: मसोरेटिक पाठ का स्त्रीलिंग एकवचन रूप सबसे सीधे तौर पर माता को नाम रखने वाली बताता है; हिन्दी में ‘नाम रखना’ स्वाभाविक मुहावरा है।
- source_word: עִמָּנוּ אֵל
  choice: इम्मानुएल
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है और उसका अर्थ पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: मसीह-संबंधी महत्त्व वाले इस पद में הָעַלְמָה का अनुवाद
  choice: वह युवती
  alternative: वह कुँवारी
  rationale: इब्रानी संज्ञा स्वयं मुख्यतः एक युवती को दर्शाती है और कुँवारेपन को स्पष्ट रूप से नहीं कहती। यूनानी सेप्टुआजेंट और मत्ती 1:23 की परंपरा को मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में पारदर्शी ढंग से सुरक्षित रखा गया है।
- issue: הָרָה וְיֹלֶדֶת का काल और पक्ष
  choice: गर्भवती है और … जन्म दे रही है
  alternative: गर्भधारण करेगी और पुत्र जनेगी
  rationale: इब्रानी में विधेय विशेषण के बाद कृदंत है, जो जारी अथवा निकटवर्ती स्थिति को प्रस्तुत करता है। चुना हुआ रूप इसे केवल साधारण भविष्यकाल में नहीं बदलता।
- issue: וְקָרָאת में बच्चे का नाम कौन रखता है
  choice: वह … नाम रखेगी
  alternative: तुम उसका नाम रखोगे / उसका नाम रखा जाएगा / वे उसका नाम रखेंगे
  rationale: दिए गए मसोरेटिक पाठ का स्त्रीलिंग एकवचन रूप माता की ओर संकेत करता है। प्राचीन अनुवाद-परंपराओं और मत्ती 1:23 में भिन्न कर्ता दिखाई देता है, इसलिए उसे पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है और स्वर गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखा गया है। ‘तुम लोगों को’ से इब्रानी बहुवचन स्पष्ट किया गया है। ‘देखो’ ने הִנֵּה की ध्यानाकर्षक शक्ति को स्वाभाविक हिन्दी में सुरक्षित रखा है। मुख्य पाठ मूल इब्रानी की काल-पक्ष और शब्दार्थ-संबंधी अस्पष्टताओं को बाद की व्याख्यात्मक परंपराओं से नहीं दबाता; महत्त्वपूर्ण वैकल्पिक पाठ पादटिप्पणियों में दिए गए हैं।
