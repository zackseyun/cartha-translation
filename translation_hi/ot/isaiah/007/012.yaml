base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/012.yaml
  text: But Ahaz said[a], “I will not ask[b], and I will not test Yahweh.”
translation:
  language: hi
  text: पर आहाज ने कहा, “मैं नहीं माँगूँगा, और न याहवे[a] की परीक्षा लूँगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम YHWH है। इसे परंपरागत रूप से “प्रभु” लिखा जाता है; “यहोवा” भी एक प्रचलित रूप है।
    reason: alternative_reading
  - marker: b
    text: या, “याहवे को परखूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: पर ... ने कहा
  rationale: वाव-क्रम कथानक को आगे बढ़ाता है, पर पिछले पद में चिन्ह माँगने के निमंत्रण के प्रति आहाज का उत्तर विरोधात्मक है; इसलिए आधुनिक हिन्दी में ‘पर’ प्रसंग का संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָחָז
  choice: आहाज
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: לֹא אֶשְׁאַל
  choice: मैं नहीं माँगूँगा
  rationale: שׁאל का सामान्य अर्थ ‘माँगना’ है। पिछले पद से माँगी जाने वाली वस्तु—एक चिन्ह—स्पष्ट है, इसलिए उसे पाठ में जोड़ना आवश्यक नहीं।
- source_word: וְלֹא אֲנַסֶּה
  choice: और न ... को परखूँगा
  rationale: पिएल रूप נסה का अर्थ ‘परखना/परीक्षा लेना’ है। ‘परखना’ आधुनिक हिन्दी में स्पष्ट है और ‘लुभाना’ जैसे अनुचित नैतिक अर्थ से बचता है।
- source_word: אֶת יְהוָה
  choice: याहवे
  rationale: אֶת कर्म-चिह्न है और हिन्दी में ‘को’ से व्यक्त होता है। יהוה को उसके व्यक्तिगत वाचा-नाम के लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: इब्रानी पाठ में चार अक्षरों वाला ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है; पाठक की परिचितता के लिए पादटिप्पणी दी गई है।
- issue: परमेश्वर के संबंध में אֲנַסֶּה का अर्थ
  choice: परखूँगा
  alternative: परीक्षा लूँगा; परीक्षा में डालूँगा
  rationale: क्रिया का आशय परमेश्वर को जाँचने या उसकी विश्वसनीयता सिद्ध कराने से है। ‘परखूँगा’ इस अर्थ को संक्षेप और स्पष्टता से रखता है, बिना यह संकेत दिए कि परमेश्वर को बुराई के लिए लुभाया जा सकता है।
- issue: आहाज के कथन की धार्मिक मुद्रा
  choice: कथन को बिना व्याख्यात्मक विशेषण के रखा गया
  alternative: इसे विनम्रता या कपट के रूप में स्पष्ट करना
  rationale: पद में आहाज केवल अपना इनकार व्यक्त करता है। उसके उद्देश्य का धार्मिक मूल्यांकन संदर्भ से उभरता है; अनुवाद में उसे चुपचाप तय नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘पर’ पिछले पद के निमंत्रण और आहाज के इनकार के बीच विरोध दिखाता है। समांतर निषेध को स्वाभाविक हिन्दी ‘और न’ से व्यक्त किया गया है।
