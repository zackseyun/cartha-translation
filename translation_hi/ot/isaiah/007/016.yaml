source:
  edition: WLC
  text: כִּ֠י בְּ/טֶ֨רֶם יֵדַ֥ע הַ/נַּ֛עַר מָאֹ֥ס בָּ/רָ֖ע וּ/בָחֹ֣ר בַּ/טּ֑וֹב תֵּעָזֵ֤ב הָ/אֲדָמָה֙ אֲשֶׁ֣ר אַתָּ֣ה קָ֔ץ מִ/פְּנֵ֖י שְׁנֵ֥י מְלָכֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/016.yaml
  text: For before the boy knows to refuse the evil and choose the good[b][a], the land before whose two kings you dread will be forsaken.
translation:
  language: hi
  text: क्योंकि इससे पहले कि वह बालक बुराई को ठुकराना और भलाई को चुनना जान ले, जिस देश के दो राजाओं से तू डरता है[a], वह देश छोड़ दिया जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस देश से तू उसके दो राजाओं के कारण घृणा करता है” अथवा “जिस देश के दो राजाओं के कारण तू भयभीत है।” इब्रानी क्रिया घृणा या वितृष्णा का भाव दे सकती है; इस संदर्भ में वह भय या आतंक से जुड़ा हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “त्याग दिया जाएगा” अथवा “उजाड़ हो जाएगा।” इब्रानी कर्मवाच्य रूप देश के छोड़ दिए जाने या निर्जन हो जाने का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: इससे पहले कि
  rationale: यह समय-सूचक पद बताता है कि बालक के नैतिक विवेक तक पहुँचने से पहले ही आगे कही घटना घटेगी; आधुनिक हिन्दी में यह स्वाभाविक रूप है।
- source_word: הַנַּעַר
  choice: वह बालक
  rationale: נַעַר का अर्थ बालक से युवक तक हो सकता है, पर यहाँ भले-बुरे का चुनाव करना अभी न जानने का संदर्भ कम आयु का संकेत देता है। पुल्लिंग एकवचन और पूर्वसंदर्भ बनाए रखे गए हैं।
- source_word: יֵדַע ... מָאֹס ... וּבָחֹר
  choice: अस्वीकार करना और ... चुनना जाने
  rationale: यह रचना प्राप्त विवेक अथवा क्षमता व्यक्त करती है। हिन्दी में ‘करना जाने’ मूल क्रम और विकासात्मक भाव दोनों को स्वाभाविक ढंग से रखता है।
- source_word: מָאֹס
  choice: अस्वीकार करना
  rationale: यहाँ नैतिक भेद और चुनाव प्रमुख है, केवल भावात्मक घृणा नहीं। ‘अस्वीकार’ का ‘चुनना’ के साथ स्पष्ट विरोध बनता है।
- source_word: בָּרָע ... בַּטּוֹב
  choice: बुराई ... भलाई
  rationale: ये शब्द सामान्य नैतिक श्रेणियों का निश्चित विरोध व्यक्त करते हैं। ‘बुराई’ और ‘भलाई’ आधुनिक हिन्दी में सहज और संतुलित युग्म हैं।
- source_word: תֵּעָזֵב
  choice: छोड़ दिया जाएगा
  rationale: निफ़अल अपूर्ण रूप का कर्मवाच्य भाव सुरक्षित रखा गया है। यह भूमि के त्यागे जाने या निर्जन हो जाने—दोनों संभावित संकेतों को किसी कर्ता का नाम जोड़े बिना खुला रखता है।
- source_word: הָאֲדָמָה
  choice: देश
  rationale: दो राजाओं और राजनीतिक संकट के संदर्भ में अर्थ मिट्टी नहीं, भौगोलिक-राजनीतिक भूभाग है; हिन्दी में ‘देश’ सर्वाधिक स्वाभाविक है।
- source_word: אֲשֶׁר אַתָּה קָץ מִפְּנֵי
  choice: जिसके ... से तू भय खाता है
  rationale: קוץ में घृणा, वितृष्णा या आतंक का भाव हो सकता है। प्रसंग में धमकी देने वाले राजाओं के कारण उत्पन्न भय प्रमुख है; पादटिप्पणी मिश्रित भाव की वैकल्पिक अभिव्यक्ति सुरक्षित रखती है।
- source_word: שְׁנֵי מְלָכֶיהָ
  choice: उसके दो राजा / जिस देश के दो राजा
  rationale: स्त्रीलिंग प्रत्यय का संबंध भूमि/देश से है। सम्बन्धवाचक उपवाक्य में ‘जिस देश के दो राजाओं’ हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ‘बालक’ की पहचान और भूमिका
  choice: सामान्य संज्ञा ‘बालक’ रखी गई है और उसकी पहचान स्पष्ट नहीं की गई।
  alternative: इसे केवल निकटकालीन ऐतिहासिक चिन्ह-बालक अथवा सीधे इम्मानुएल/मसीही संकेत के रूप में पहचानना।
  rationale: इस पद में הַנַּעַר से आगे बालक की पहचान नहीं दी गई। अनुवाद विवादित ऐतिहासिक या मसीही व्याख्या को पाठ में आरोपित किए बिना मूल की धर्मवैज्ञानिक खुली स्थिति बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। एकवचन אַתָּה के लिए संदर्भानुकूल पारंपरिक ‘तू’ रखा गया है। वाक्य की भविष्यद्वाणी-संबंधी गंभीरता बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ या सांप्रदायिक शब्दावली से बचा गया है।
