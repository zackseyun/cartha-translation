  rationale: स्थानवाचक क्रियाविशेषण का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह सशस्त्र होकर आने का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ कारण-संबंध स्पष्ट करता है।
- source_word: שָׁמִיר וָשַׁיִת
  choice: कँटीली झाड़ियाँ और काँटे
  rationale: यशायाह में यह युग्म उजाड़ और खेतीरहित भूमि पर उग आई काँटेदार वनस्पति का बिंब है। हिन्दी अभिव्यक्ति दोनों तत्वों और उनके क्रम को बनाए रखती है।
- source_word: תִּהְיֶה כָל הָאָרֶץ
  choice: सारी भूमि … से भर जाएगी
  rationale: शाब्दिक अर्थ ‘सारी भूमि … होगी’ है। संदर्भ में पहले की खेती योग्य भूमि के काँटेदार वनस्पति से आच्छादित हो जाने का परिणाम है; ‘से भर जाएगी’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
