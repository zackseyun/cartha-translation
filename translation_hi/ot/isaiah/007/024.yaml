  rationale: दोनों ב उपसर्ग साधन अथवा साथ रखे हथियारों का भाव देते हैं। स्वाभाविक हिन्दी में ‘से लैस होकर’ यह स्पष्ट करता है कि व्यक्ति इन हथियारों के साथ आता है।
- source_word: יָבוֹא
  choice: कोई … आएगा
  rationale: क्रिया पुल्लिंग एकवचन है, पर यहाँ उसका प्रयोग सामान्य व्यक्ति के लिए हो सकता है। ‘कोई’ व्याकरणिक एकवचन बनाए रखते हुए किसी निश्चित पुरुष की अनावश्यक पहचान नहीं कराता।
- source_word: שָׁמָּה
