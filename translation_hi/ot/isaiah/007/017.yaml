  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יָבִ֨יא יְהוָ֜ה עָלֶ֗י/ךָ וְ/עַֽל עַמְּ/ךָ֮ וְ/עַל בֵּ֣ית אָבִי/ךָ֒ יָמִים֙ אֲשֶׁ֣ר לֹא בָ֔אוּ לְ/מִ/יּ֥וֹם סוּר אֶפְרַ֖יִם מֵ/עַ֣ל יְהוּדָ֑ה אֵ֖ת מֶ֥לֶךְ אַשּֽׁוּר־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/017.yaml
  text: Yahweh will bring upon you[a], upon your people[b], and upon your father's house days unlike any that have not come since the day Ephraim turned away from Judah—namely, the king of Assyria.
translation:
  language: hi
  text: याहवे तुम पर, तुम्हारी प्रजा पर और तुम्हारे पिता के घराने पर ऐसे दिन लाएगा, जो एप्रैम के यहूदा से अलग होने के दिन से अब तक कभी नहीं आए—अर्थात् अश्शूर का राजा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָבִיא
  choice: लाएगा
  rationale: בוא के हिफ़ील रूप का सामान्य अर्थ ‘ले आना’ है; ‘लाएगा’ कारणवाचक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण से रखा गया है।
- source_word: עָלֶיךָ ... וְעַל עַמְּךָ ... וְעַל בֵּית אָבִיךָ
  choice: तुम पर, तुम्हारी प्रजा पर और तुम्हारे पिता के घराने पर
  rationale: बार-बार आए עַל का ‘पर’ द्वारा निर्वाह किया गया है। עם के लिए राजकीय संदर्भ में ‘प्रजा’ और בית אב के लिए स्वाभाविक हिन्दी मुहावरा ‘पिता का घराना’ चुना गया है।
- source_word: יָמִים אֲשֶׁר לֹא בָאוּ
  choice: ऐसे दिन ... नहीं आए
  rationale: हिब्रू की नकारात्मक तुलनात्मक संरचना को अक्षुण्ण रखते हुए हिन्दी में अभूतपूर्व समय का स्पष्ट बोध कराया गया है।
- source_word: לְמִיּוֹם סוּר אֶפְרַיִם מֵעַל יְהוּדָה
  choice: एप्रैम के यहूदा से अलग होने के दिन से अब तक
  rationale: סוּר का मूल भाव हटने या अलग होने का है। ‘अलग होने’ से ऐतिहासिक विभाजन का संकेत मिलता है, पर ‘विद्रोह’ जैसी अधिक व्याख्यात्मक भाषा नहीं जोड़ी जाती।
- source_word: אֵת מֶלֶךְ אַשּׁוּר
  choice: अर्थात् अश्शूर का राजा
  rationale: अंतिम पदबंध आने वाले संकट को अश्शूर के राजा के रूप में स्पष्ट करता है; ‘अर्थात्’ हिन्दी में इस अपपोज़िशन को सुबोध बनाता है।
theological_decisions:
- issue: अहाज, उसकी प्रजा और राजघराने पर आने वाले न्याय का स्वरूप
  choice: अश्शूर के राजा को याहवे द्वारा लाए जाने वाले अभूतपूर्व संकट की स्पष्ट पहचान के रूप में प्रस्तुत किया गया है।
  alternative: ‘अश्शूर के राजा’ को विराम के बाद एक पृथक कर्म मानना।
  rationale: वाक्य के अंत में אֵת מֶלֶךְ אַשּׁוּר सबसे स्वाभाविक रूप से पूर्वोक्त आने वाले दिनों/संकट का स्पष्टीकरण देता है; इससे आगे कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। संबोधन एकवचन ‘तुम’ है, क्योंकि हिब्रू प्रत्यय अहाज को संबोधित करते हैं; ‘प्रजा’ और ‘घराना’ राजकीय-सामाजिक संदर्भ को सहज हिन्दी में व्यक्त करते हैं।
