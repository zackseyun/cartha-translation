  yaml_path: translation/ot/isaiah/007/004.yaml
  text: and say to him[a], ‘Be careful and stay calm. Do not fear, and do not let your heart be faint because of these two smoldering stubs of firebrands—because of the burning anger of Rezin and Aram, and the son of Remaliah.’
translation:
  language: hi
  text: और उससे कहना, “सावधान रह और शांत रह। मत डर, और धुआँ देती इन दो जलती लकड़ियों के बचे हुए सिरों[a] के कारण—रसीन, अराम, और रमल्याह के पुत्र के भड़के हुए क्रोध के कारण—तेरा मन कमजोर न पड़े।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इन धुआँ देती जलती लकड़ियों की दो पूँछों।” यह चित्र रसीन और रमल्याह के पुत्र को ऐसी जली हुई लकड़ियों के अंतिम सिरों के समान दिखाता है जो अभी धुआँ तो दे रहे हैं, पर बुझने के निकट हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֵר
  choice: सावधान रह
  rationale: निफ़अल आज्ञार्थक यहाँ किसी वस्तु की रखवाली करने के बजाय सतर्क रहने का आग्रह करता है; ‘सावधान रह’ आधुनिक हिन्दी में स्वाभाविक और सीधा है।
- source_word: וְהַשְׁקֵט
  choice: और शांत रह
  rationale: שׁקט का आशय चुप रहने मात्र से नहीं, बल्कि संकट के बीच विचलित न होने और स्थिर रहने से है; ‘शांत रह’ इस प्रसंग में उपयुक्त है।
- source_word: אַל תִּירָא
  choice: मत डर
  rationale: नकारात्मक आज्ञा का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: וּלְבָבְךָ אַל יֵרַךְ
  choice: तेरा मन कमजोर न पड़े
  rationale: ‘हृदय’ के ‘कोमल/निर्बल’ होने का इब्रानी मुहावरा साहस खोने को व्यक्त करता है। ‘मन कमजोर न पड़े’ सामान्य हिन्दी में इसी भीतरी निर्बलता को व्यक्त करता है।
- source_word: מִשְּׁנֵי זַנְבוֹת הָאוּדִים הָעֲשֵׁנִים הָאֵלֶּה
  choice: धुआँ छोड़ती जलती लकड़ियों के इन दो बचे हुए सिरों
  rationale: זנבות का शाब्दिक अर्थ ‘पूँछें’ है, पर जलती लकड़ियों के रूपक में यह उनके बचे हुए अंतिम सिरों को दर्शाता है। यह अनुवाद रूपक और शत्रुओं को घटाकर दिखाने वाले व्यंग्य दोनों को बनाए रखता है।
- source_word: בָּחֳרִי אַף
  choice: भड़कते क्रोध
  rationale: חֳרִי אַף तीव्र, जलते हुए क्रोध का मुहावरा है। ‘भड़कते क्रोध’ निकटवर्ती अग्नि-चित्र को भी बनाए रखता है।
- source_word: רְצִין וַאֲרָם וּבֶן רְמַלְיָהוּ
  choice: रसीन और अराम के तथा रमल्याह के पुत्र के
  rationale: मूल पाठ की सूची और पेकह के लिए प्रयुक्त अप्रत्यक्ष संबोधन ‘रमल्याह का पुत्र’ को बिना स्पष्टकारी नाम जोड़े सुरक्षित रखा गया है।
theological_decisions:
- issue: शत्रुओं को लगभग बुझ चुकी जलती लकड़ियों के रूप में चित्रित करने वाले रूपक को बनाए रखना
  choice: मुख्य पाठ में ‘धुआँ छोड़ती जलती लकड़ियों के इन दो बचे हुए सिरों’ का चित्र बनाए रखा गया
  alternative: इसे अर्थप्रधान ढंग से ‘इन दो मिटती हुई धमकियों’ कहना
  rationale: परमेश्वर की दृष्टि में भयावह दिखने वाले ये शत्रु लगभग चुक चुके हैं; मूल रूपक भविष्यद्वाणी के व्यंग्य और आश्वासन को बिना व्याख्यात्मक समाधान के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज संबोधन रखा गया है। एकवचन अनौपचारिक आज्ञार्थक (‘रह’, ‘मत डर’) मूल इब्रानी के सीधे, एकवचन संबोधन के अनुरूप है। अग्नि और धुएँ की परस्पर जुड़ी छवियों को मुख्य पाठ में सुरक्षित रखा गया है।
