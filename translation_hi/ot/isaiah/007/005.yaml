source:
  edition: WLC
  text: יַ֗עַן כִּֽי יָעַ֥ץ עָלֶ֛י/ךָ אֲרָ֖ם רָעָ֑ה אֶפְרַ֥יִם וּ/בֶן רְמַלְיָ֖הוּ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/005.yaml
  text: Because Aram has planned evil against you, along with Ephraim and the son of Remaliah, saying,
translation:
  language: hi
  text: 'क्योंकि अराम ने एप्रैम और रमल्याह के पुत्र के साथ मिलकर तुम्हारे विरुद्ध बुरी योजना बनाई है, यह कहते हुए:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעַן כִּי
  choice: क्योंकि
  rationale: यह कारण बताने वाला संयुक्त पद है और पिछले कथन का आधार प्रस्तुत करता है।
- source_word: יָעַץ עָלֶיךָ ... רָעָה
  choice: तुम्हारे विरुद्ध बुरी योजना बनाई है
  rationale: יָעַץ का अर्थ योजना या सम्मति करना है; עָלֶיךָ विरोधी लक्ष्य को और רָעָה योजना की बुरी प्रकृति को व्यक्त करता है।
- source_word: אֲרָם
  choice: अराम
  rationale: प्राचीन राज्य का प्रचलित हिंदी लिप्यंतरण।
- source_word: אֶפְרַיִם וּבֶן רְמַלְיָהוּ
  choice: एप्रैम और रमल्याह के पुत्र के साथ मिलकर
  rationale: हिब्रू में अराम एकवचन क्रिया का कर्ता है, जबकि ये संज्ञाएँ साथ जुड़े सहभागी हैं; इस संरचनात्मक भेद को स्पष्ट रखा गया है।
- source_word: לֵאמֹר
  choice: और कहा है,
  rationale: आगे आने वाले प्रत्यक्ष कथन का परिचय देता है; हिंदी में वाक्य का प्रवाह बनाए रखने के लिए संयोजक जोड़ा गया है।
theological_decisions:
- issue: अराम, एप्रैम और रमल्याह के पुत्र के बीच कर्तृत्व-संबंध
  choice: अराम को व्याकरणिक कर्ता और बाकी दोनों को उसके साथ योजना बनाने वाले सहभागी के रूप में प्रस्तुत किया गया है।
  alternative: तीनों को समान संयुक्त कर्ता मानकर ‘अराम, एप्रैम और रमल्याह के पुत्र ने’ कहना।
  rationale: मसोरेटिक पाठ में יָעַץ एकवचन है और אֲרָם उसका निकट कर्ता है; इसलिए स्रोत-पाठ की असममित रचना को बनाए रखना उचित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। डैश हिब्रू वाक्य की संरचना स्पष्ट करता है और यह दिखाता है कि एप्रैम तथा रमल्याह का पुत्र अराम के साथ सहभागी हैं, समान व्याकरणिक कर्ता नहीं।
