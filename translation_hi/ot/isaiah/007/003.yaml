reference: Isaiah 7:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶֽל יְשַׁעְיָהוּ֒ צֵא נָא֙ לִ/קְרַ֣את אָחָ֔ז אַתָּ֕ה וּ/שְׁאָ֖ר יָשׁ֣וּב בְּנֶ֑/ךָ אֶל קְצֵ֗ה תְּעָלַת֙ הַ/בְּרֵכָ֣ה הָ/עֶלְיוֹנָ֔ה אֶל מְסִלַּ֖ת שְׂדֵ֥ה כוֹבֵֽס־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/003.yaml
  text: Then Yahweh said to Isaiah[a], “Go out now to meet Ahaz, you and Shear-jashub your son, at the end of the conduit of the upper pool[b], on the road to the launderer’s field.”
translation:
  language: hi
  text: तब याहवे ने यशायाह से कहा, “तुम और तुम्हारा बेटा शआर-याशूब[a] अभी बाहर निकलो और ऊपरी तालाब की नहर के छोर पर, धोबी के खेत की सड़क पर, आहाज से मिलो[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शआर-याशूब का अर्थ है “एक शेष भाग लौटेगा।”
    reason: व्यक्तिनाम के विषयगत रूप से महत्त्वपूर्ण शाब्दिक अर्थ को सुरक्षित रखने के लिए।
  - marker: b
    text: या, “कपड़ा साफ करने वाले के खेत की सड़क पर।”
    reason: इब्रानी כּוֹבֵס के कपड़ा धोने/साफ करने वाले व्यावसायिक अर्थ का अधिक स्पष्ट वैकल्पिक अनुवाद देने के लिए।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का लिप्यंतरण किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: צֵא נָא
  choice: अभी बाहर जाओ
  rationale: आज्ञार्थक क्रिया और נָא से व्यक्त तात्कालिक आग्रह को सहज आधुनिक हिन्दी में रखा गया है।
- source_word: לִקְרַאת
  choice: से मिलो
  rationale: यहाँ ל के साथ आया रूप बाहर जाने का उद्देश्य बताता है—आहाज से मिलने जाना।
- source_word: שְׁאָר יָשׁוּב
  choice: शआर-याशूब
  rationale: व्यक्तिनाम को मुख्य पाठ में लिप्यंतरित किया गया है और उसके अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: תְּעָלַת הַבְּרֵכָה הָעֶלְיוֹנָה
  choice: ऊपरी तालाब की नहर
  rationale: תְּעָלָה कृत्रिम जल-मार्ग और בְּרֵכָה जल-संग्रह के तालाब को सूचित करते हैं; यह पदबंध स्पष्ट और स्वाभाविक हिन्दी देता है।
- source_word: קְצֵה
  choice: छोर पर
  rationale: इस स्थल-वर्णन में स्थान अथवा गंतव्य का अर्थ है; ‘छोर पर’ संक्षिप्त और स्वाभाविक है।
- source_word: מְסִלַּת שְׂדֵה כוֹבֵס
  choice: धोबी के खेत की सड़क पर
  rationale: מְסִלָּה मार्ग/सड़क और כוֹבֵס कपड़े धोने या साफ़ करने वाले व्यक्ति को दर्शाता है; ‘धोबी’ सामान्य आधुनिक हिन्दी में सुबोध है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम स्पष्ट रूप से है। उसका लिप्यंतरण नाम और उपाधि के बीच का भेद बनाए रखता है।
- issue: शआर-याशूब नाम का अर्थ
  choice: नाम को लिप्यंतरित करके अर्थ पादटिप्पणी में देना
  alternative: मुख्य पाठ में ‘एक बचा हुआ भाग लौटेगा’ कहना
  rationale: व्याकरण में यह यशायाह के पुत्र का व्यक्तिनाम है, किंतु उसका अर्थ यशायाह की भविष्यवाणी में विषयगत महत्त्व रखता है; दोनों बातों को इस प्रकार सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल इब्रानी में पूरी आज्ञा एक वाक्य है; हिन्दी में अंतिम स्थल-वर्णन को ‘वह तुम्हें…मिलेगा’ के रूप में व्यक्त किया गया है ताकि लंबे वाक्य की अस्पष्टता से बचते हुए मिलने के स्थान का वही आशय बना रहे।
