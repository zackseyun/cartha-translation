  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יִשְׁרֹ֤ק יְהוָה֙ לַ/זְּב֔וּב אֲשֶׁ֥ר בִּ/קְצֵ֖ה יְאֹרֵ֣י מִצְרָ֑יִם וְ/לַ֨/דְּבוֹרָ֔ה אֲשֶׁ֖ר בְּ/אֶ֥רֶץ אַשּֽׁוּר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/018.yaml
  text: And in that day Yahweh will whistle for the fly that is at the far end of the streams of Egypt[b][a], and for the bee that is in the land of Assyria.
translation:
  language: hi
  text: उस दिन ऐसा होगा कि याहवे मिस्र की जलधाराओं के सुदूर छोर पर जो मक्खी है[b] और अश्शूर देश में जो मधुमक्खी है, उन्हें सीटी बजाकर बुलाएगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तीखी ध्वनि निकालकर बुलाएगा।” इब्रानी क्रिया बुलाने या संकेत देने के लिए निकाली गई तेज ध्वनि को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: “मिस्र की जलधाराएँ” विशेष रूप से नील नदी की शाखाओं या मिस्र की नहरों की ओर संकेत कर सकती हैं।
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: उस दिन ऐसा होगा कि
  rationale: यह स्वाभाविक आधुनिक हिन्दी में भविष्यसूचक दृश्य का परिचय देता है और मूल के प्रचलित भविष्यसूचक काल-वाक्यांश को बनाए रखता है।
- source_word: יִשְׁרֹק
  choice: सीटी बजाकर बुलाएगा
  rationale: इब्रानी क्रिया किसी को बुलाने या संकेत देने के लिए तीखी ध्वनि निकालने को दर्शाती है। यह हिन्दी में केवल ‘सीटी बजाएगा’ की अपेक्षा बुलाने का आशय अधिक स्पष्ट और स्वाभाविक रूप से व्यक्त करती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: לַזְּבוּב
  choice: मक्खी को
  rationale: मूल का एकवचन और प्रतीकात्मक चित्र बनाए रखा गया है; इसे ‘मक्खियों’ या मिस्र की सेना के रूप में स्पष्ट नहीं किया गया।
- source_word: אֲשֶׁר בִּקְצֵה יְאֹרֵי מִצְרָיִם
  choice: मिस्र की जलधाराओं के सुदूर छोर पर रहने वाली
  rationale: קָצֶה की दूरस्थ सीमा और יְאֹרִים की मिस्री नदी-धाराओं या नहरों का अर्थ व्यक्त किया गया है, बिना मुख्य पाठ में इसे केवल नील की शाखाओं तक सीमित किए।
- source_word: וְלַדְּבוֹרָה
  choice: और ... मधुमक्खी को
  rationale: मक्खी के समान इसका भी मूल एकवचन और समानांतर प्रतीकात्मक चित्र सुरक्षित रखा गया है।
- source_word: אֲשֶׁר בְּאֶרֶץ אַשּׁוּר
  choice: अश्शूर देश में रहने वाली
  rationale: אֶרֶץ की ठोस भौगोलिक अभिव्यक्ति ‘देश’ के द्वारा सुरक्षित रखते हुए स्वाभाविक हिन्दी दी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत नाम को शीर्षक से प्रतिस्थापित नहीं किया गया; ‘याहवे’ मूल नाम का निकट और आधुनिक हिन्दी लिप्यंतरण है।
- issue: मक्खी और मधुमक्खी के बिंब का आशय
  choice: राजनीतिक-सैन्य संकेत को स्पष्ट किए बिना मूल रूपक बनाए रखना
  alternative: मक्खी को मिस्र और मधुमक्खी को अश्शूर की सेना के रूप में सीधे पहचानना
  rationale: संदर्भ विदेशी शक्तियों की ओर संकेत करता है, पर पद स्वयं उन्हें रूपक के माध्यम से प्रस्तुत करता है। इसलिए अनुवाद उस अर्थगत और धर्मवैचारिक तनाव को व्याख्यात्मक विस्तार से समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दोनों प्रतीकात्मक संज्ञाओं का एकवचन सुरक्षित है। [a] और [b] को क्रमशः बुलाने की ध्वनि तथा मिस्र की जलधाराओं से संबद्ध वाक्यांश के बाद रखा गया है।
