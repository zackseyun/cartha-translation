source:
  edition: WLC
  text: וַ/יְהִ֡י בִּ/ימֵ֣י אָ֠חָז בֶּן יוֹתָ֨ם בֶּן עֻזִּיָּ֜הוּ מֶ֣לֶךְ יְהוּדָ֗ה עָלָ֣ה רְצִ֣ין מֶֽלֶךְ אֲ֠רָם וּ/פֶ֨קַח בֶּן רְמַלְיָ֤הוּ מֶֽלֶךְ יִשְׂרָאֵל֙ יְר֣וּשָׁלִַ֔ם לַ/מִּלְחָמָ֖ה עָלֶ֑י/הָ וְ/לֹ֥א יָכֹ֖ל לְ/הִלָּחֵ֥ם עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/001.yaml
  text: And it happened in the days of Ahaz son of Jotham[a], son of Uzziah, king of Judah, that Rezin king of Aram and Pekah son of Remaliah, king of Israel, went up to Jerusalem to wage war against it[b], but they were not able to fight against it.
translation:
  language: hi
  text: यहूदा के राजा आहाज के दिनों में—जो योताम के पुत्र और उज्जियाह के पोते थे—ऐसा हुआ कि अराम[a] के राजा रसीन और रमल्याह के पुत्र, इस्राएल के राजा पेकह, यरूशलेम के विरुद्ध युद्ध करने के लिए चढ़ाई कर आए; पर वह उसके विरुद्ध युद्ध न कर सका[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘अराम’; पारंपरिक रूप से ‘सीरिया’।
    reason: alternative_reading
  - marker: b
    text: इब्रानी क्रिया एकवचन है—शाब्दिक रूप से, ‘वह युद्ध न कर सका’—यद्यपि इससे पहले रसीन और पेकह दोनों का उल्लेख है। कुछ अनुवाद इसे बहुवचन में, ‘वे युद्ध न कर सके,’ करते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בִּימֵי
  choice: के दिनों में ऐसा हुआ
  rationale: इब्रानी ऐतिहासिक कथा के आरंभ और उसके कालसूचक मुहावरे को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: אָחָז בֶּן יוֹתָם בֶּן עֻזִּיָּהוּ
  choice: उज्जियाह के पुत्र योताम के पुत्र आहाज
  rationale: वंश-श्रृंखला को स्पष्ट हिन्दी संबंध-क्रम में रखा गया है और नामों का मानक लिप्यंतरण किया गया है।
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: अराम के राजा रसीन
  rationale: אֲרָם का मूल ऐतिहासिक-भौगोलिक नाम ‘अराम’ रखा गया है; बाद का पारंपरिक नाम ‘सीरिया’ मुख्य पाठ में नहीं लाया गया।
- source_word: וּפֶקַח בֶּן רְמַלְיָהוּ מֶלֶךְ יִשְׂרָאֵל
  choice: और रमल्याह के पुत्र, इस्राएल के राजा पेकह
  rationale: पितृनाम और राजकीय उपाधि दोनों सुरक्षित रखते हुए हिन्दी में स्वाभाविक पदक्रम अपनाया गया है।
- source_word: עָלָה ... יְרוּשָׁלִַם לַמִּלְחָמָה עָלֶיהָ
  choice: यरूशलेम पर चढ़ाई की, ताकि उसके विरुद्ध युद्ध करें
  rationale: עלה के सैन्य भाव को ‘चढ़ाई की’ और उद्देश्यसूचक לַמִּלְחָמָה को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: וְלֹא יָכֹל לְהִלָּחֵם עָלֶיהָ
  choice: पर वह उसके विरुद्ध युद्ध न कर सका
  rationale: मसोरेटिक पाठ के एकवचन क्रिया-रूप को ‘वह ... न कर सका’ द्वारा सुरक्षित रखा गया है, यद्यपि पहले दो राजाओं का उल्लेख है।
theological_decisions:
- issue: אֲרָם का ऐतिहासिक नाम
  choice: अराम
  alternative: सीरिया
  rationale: मूल इब्रानी के जातीय-भौगोलिक नाम को प्राथमिकता दी गई है और बाद की पारंपरिक भौगोलिक संज्ञा को पादटिप्पणी में रखा गया है।
- issue: संयुक्त कर्ता के बाद יָכֹל का एकवचन
  choice: वह ... न कर सका
  alternative: वे ... न कर सके
  rationale: इब्रानी पाठ में क्रिया एकवचन है। उसका संदर्भ केवल रसीन से है, निकटवर्ती या प्रधान कर्ता से है, अथवा संयुक्त सेना को एक इकाई मानता है—यह पूरी तरह स्पष्ट नहीं; इसलिए पाठ की व्याकरणिक और अर्थगत खिंचाव को बहुवचन बनाकर मिटाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘चढ़ाई की’ सैन्य प्रसंग को सहज हिन्दी में व्यक्त करता है। अंतिम खंड में जानबूझकर एकवचन ‘वह ... न कर सका’ रखा गया है, और संभावित अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
