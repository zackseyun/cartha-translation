id: ISA.7.13
reference: Isaiah 7:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר שִׁמְעוּ נָ֖א בֵּ֣ית דָּוִ֑ד הַ/מְעַ֤ט מִ/כֶּם֙ הַלְא֣וֹת אֲנָשִׁ֔ים כִּ֥י תַלְא֖וּ גַּ֥ם אֶת אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/013.yaml
  text: And he said[a], “Listen, please, house of David! Is it too little for you to weary men[b], that you also weary my God?”
translation:
  language: hi
  text: तब उसने कहा, “हे दाऊद के घराने, कृपया सुनो! क्या मनुष्यों को थका देना तुम्हारे लिए छोटी बात है, कि तुम मेरे परमेश्वर को भी थका देते हो?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब उसने कहा
  rationale: वय्यिक्तोल कथन को कथा-प्रवाह में आगे बढ़ाता है; ‘तब उसने कहा’ स्वाभाविक हिन्दी है और वक्ता को अनावश्यक रूप से नाम नहीं देता।
- source_word: שִׁמְעוּ נָא
  choice: कृपया सुनो
  rationale: बहुवचन आज्ञार्थक के साथ נָא की विनय और आग्रह की शक्ति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בֵּית דָּוִד
  choice: हे दाऊद के घराने
  rationale: यह दाऊद के राजवंश और उससे संबद्ध सामूहिक समूह को संबोधन है, केवल किसी भवन या निकट परिवार को नहीं।
- source_word: הַמְעַט מִכֶּם
  choice: क्या ... तुम्हारे लिए छोटी बात है
  rationale: इब्रानी आलंकारिक प्रश्न के रूप और अर्थ—किसी काम को तुच्छ समझना—दोनों को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: הַלְאוֹת ... תַלְאוּ
  choice: थका देना ... थका देते हो
  rationale: एक ही इब्रानी धातु לאה की पुनरावृत्ति को हिन्दी में भी सुरक्षित रखता है और मनुष्यों से परमेश्वर तक बढ़ती हुई तीव्रता दिखाता है।
- source_word: אֲנָשִׁים
  choice: मनुष्यों
  rationale: यहाँ शब्द का आशय परमेश्वर के विपरीत मानव प्राणियों से है; हिन्दी ‘मनुष्य’ इस विरोध को स्पष्ट रखते हुए स्त्री-पुरुष दोनों के लिए सामान्य रूप से प्रयुक्त हो सकता है।
- source_word: כִּי
  choice: कि
  rationale: 'आलंकारिक प्रश्न की अगली, अधिक गंभीर बात को जोड़ता है: मनुष्यों को थकाना ही नहीं, परमेश्वर को भी थकाना।'
- source_word: גַּם
  choice: भी
  rationale: मनुष्यों से परमेश्वर तक आरोप की वृद्धि करने वाली योगात्मक शक्ति को सुरक्षित रखता है।
- source_word: אֶת אֱלֹהָי
  choice: मेरे परमेश्वर को
  rationale: प्रथम पुरुष एकवचन स्वामित्व-प्रत्यय को स्पष्ट रूप से सुरक्षित रखता है और यशायाह के व्यक्तिगत तथा भविष्यद्वक्ताई रुख को सामान्यीकृत नहीं करता।
theological_decisions:
- issue: אֲנָשִׁים का हिन्दी रूप
  choice: मनुष्यों
  alternative: पुरुषों / लोगों
  rationale: संदर्भ में मुख्य विरोध मानव प्राणियों और परमेश्वर के बीच है। ‘मनुष्यों’ मूल के पुल्लिंग बहुवचन से असंगत हुए बिना हिन्दी में मानवजातीय अर्थ और धार्मिक-आलंकारिक विरोध को सबसे स्वाभाविक ढंग से व्यक्त करता है।
- issue: אֱלֹהָי में प्रथम पुरुष स्वामित्व
  choice: मेरे परमेश्वर
  alternative: परमेश्वर
  rationale: मूल पाठ का ‘मेरे’ अर्थपूर्ण है और वक्ता के रुख को दर्शाता है; इसे हटाना पाठ के धर्मवैचारिक और वक्तृत्वगत तनाव को कम कर देगा।
- issue: परमेश्वर को ‘थकाने’ की भाषा
  choice: शाब्दिक पुनरावृत्ति बनाए रखी गई
  alternative: मेरे परमेश्वर के धैर्य की भी परीक्षा लेते हो
  rationale: मूल एक ही धातु को मनुष्यों और परमेश्वर दोनों के लिए दोहराता है। इसे केवल ‘धैर्य की परीक्षा’ बनाना रूपक का अर्थ समझाता तो है, पर मूल की जानबूझकर रखी गई तीखी पुनरावृत्ति को सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और सामान्य पाठक के लिए सहज रखी गई है। ‘हे दाऊद के घराने’ सामूहिक संबोधन को स्पष्ट करता है; ‘तुम’ के बहुवचन प्रयोग से मूल के बहुवचन क्रियारूप सुरक्षित हैं। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, क्योंकि हिन्दी मुख्य पाठ में प्रमुख अर्थ और पुनरावृत्ति स्वाभाविक रूप से व्यक्त हो जाते हैं।
