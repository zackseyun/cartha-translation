base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/006.yaml
  text: Let us go up against Judah[a], and terrify her, and break her open for ourselves[b], and make the son of Tabeel king in her midst.
translation:
  language: hi
  text: आओ, हम यहूदा पर चढ़ाई करें, उसे भयभीत कर दें[a], अपने लिए उसमें सेंध लगाएँ[b], और उसके बीच ताबेल के बेटे को राजा बनाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे दहशत में डाल दें,” “उसे व्याकुल कर दें,” अथवा “उसे सताएँ।” यहाँ प्रयुक्त इब्रानी क्रिया का अर्थ निश्चित नहीं है; मुख्य पाठ ने भय या घबराहट उत्पन्न करने का अर्थ लिया है।
    reason: lexical_alternative
  - marker: b
    text: या “अपने लिए उसे चीर डालें” अथवा “अपने लिए उसमें दरार कर दें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲלֶה בִיהוּדָה
  choice: हम यहूदा पर चढ़ाई करें
  rationale: सैन्य प्रसंग में עלה का अर्थ किसी देश के विरुद्ध चढ़ाई करना है; यह हिन्दी में स्वाभाविक रहते हुए मूल बिंब बनाए रखता है।
- source_word: וּנְקִיצֶנָּה
  choice: उसे भयभीत कर दें
  rationale: קוץ का हिफ़ील रूप यहाँ कठिन है। आक्रमण के प्रसंग में भय या आतंक उत्पन्न करना सबसे उपयुक्त अर्थ है, पर अन्य अर्थ पाद-टिप्पणी में सुरक्षित हैं।
- source_word: וְנַבְקִעֶנָּה אֵלֵינוּ
  choice: अपने लिए उसमें सेंध लगाएँ
  rationale: בקע का मूल भाव चीरने, फाड़ने या तोड़कर रास्ता बनाने का है। किलाबंद क्षेत्र पर आक्रमण के प्रसंग में 'सेंध लगाएँ' स्वाभाविक हिन्दी है और אֵלֵינוּ को 'अपने लिए' व्यक्त करता है।
- source_word: וְנַמְלִיךְ מֶלֶךְ
  choice: राजा बनाएँ
  rationale: מלך का हिफ़ील रूप किसी को राजा बनाने या राजसिंहासन पर बैठाने का कारक अर्थ देता है।
- source_word: בְּתוֹכָהּ
  choice: उसके बीच
  rationale: स्त्रीलिंग प्रत्यय यहूदा की ओर संकेत करता है; 'उसके' मूल के व्यक्तिकरण को हिन्दी में बनाए रखता है।
- source_word: בֶּן טָבְאַל
  choice: ताबेल के बेटे
  rationale: בֶּן सामान्य संज्ञा 'बेटा' है और טָבְאַל व्यक्ति का नाम है, जिसे हिन्दी में 'ताबेल' लिप्यंतरित किया गया है।
theological_decisions:
- issue: यहूदा के लिए स्त्रीलिंग व्यक्तिकरण
  choice: हिन्दी में 'उसे' और 'उसके' द्वारा व्यक्तिकरण बनाए रखा
  alternative: यहूदा को निर्जीव भूभाग मानकर केवल 'उसमें/उसके भीतर' कहना
  rationale: इब्रानी में यहूदा के लिए बार-बार स्त्रीलिंग प्रत्यय हैं। हिन्दी में व्याकरणिक लिंग ठीक उसी तरह नहीं चलता, फिर भी सर्वनामों द्वारा मूल का व्यक्तिकरण यथासंभव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'चढ़ाई करें' सैन्य संदर्भ को स्पष्ट करता है और 'सेंध लगाएँ' בקע की हिंसक भेदन-छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
