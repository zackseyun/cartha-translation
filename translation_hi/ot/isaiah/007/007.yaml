base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/007.yaml
  text: 'Thus says the Lord GOD: It shall not stand[a], and it shall not come to pass.'
translation:
  language: hi
  text: 'प्रभु याहवे यों कहता है: “यह योजना न ठहरेगी[a], न होने पाएगी।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “यह खड़ी नहीं होगी, और यह होगी नहीं।” संदर्भ में बात शत्रुओं की योजना के स्थिर न रहने और वास्तविकता में न आने की है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह नबी के संदेश की पारंपरिक उद्घोषणा है। वर्तमान काल ‘कहता है’ इस ईश्वरीय वचन की जीवंत और स्थायी शक्ति व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त उपाधि में אֲדֹנָי को ‘प्रभु’ और परमेश्वर के निजी नाम יהוה को ‘यहोवा’ के रूप में रखा गया है, जिससे दोनों तत्व स्पष्ट रहते हैं।
- source_word: לֹא תָקוּם
  choice: यह योजना सफल नहीं होगी
  rationale: קום का मूल अर्थ ‘खड़ी होना/स्थिर होना’ है; संदर्भ में इसका कर्ता पिछले पद की शत्रुतापूर्ण योजना है। स्वाभाविक हिन्दी में ‘सफल नहीं होगी’ उस योजना के टिक न पाने और प्रभावी न होने का आशय देता है।
- source_word: וְלֹא תִהְיֶה
  choice: और यह पूरी नहीं होगी
  rationale: היה का शाब्दिक अर्थ ‘होना’ है, पर यहाँ योजना के वास्तविकता न बनने का भाव है। ‘पूरी नहीं होगी’ आधुनिक हिन्दी में इसे स्पष्ट करता है और पहले खंड के समानांतर रहता है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में सामान्य पदवी के साथ चतुरक्षरी निजी नाम भी सीधे उपस्थित है। ‘प्रभु यहोवा’ दोनों को अलग-अलग सुरक्षित रखता है और नाम को सामान्य संज्ञा में नहीं बदलता।
- issue: दो नकारात्मक खंडों का संबंध
  choice: योजना न तो सफल होगी, न पूरी होगी—दो समानांतर कथन
  alternative: दोनों खंडों को एक ही मुहावरे में मिला देना
  rationale: हिब्रू में दो समन्वित निषेध हैं; हिन्दी में दोनों खंड बनाए रखने से मूल की जोरदार पुनरुक्ति और निश्चित निषेध सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘यों कहता है’ नबी-संदेश की औपचारिकता बनाए रखता है, जबकि ‘योजना सफल/पूरी नहीं होगी’ सामान्य पाठक के लिए संदर्भ स्पष्ट करता है।
