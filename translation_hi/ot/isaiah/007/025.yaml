source:
  edition: WLC
  text: וְ/כֹ֣ל הֶ/הָרִ֗ים אֲשֶׁ֤ר בַּ/מַּעְדֵּר֙ יֵעָ֣דֵר֔וּ/ן לֹֽא תָב֣וֹא שָׁ֔מָּ/ה יִרְאַ֖ת שָׁמִ֣יר וָ/שָׁ֑יִת וְ/הָיָה֙ לְ/מִשְׁלַ֣ח שׁ֔וֹר וּ/לְ/מִרְמַ֖ס שֶֽׂה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/025.yaml
  text: And as for all the hills that used to be hoed with a hoe[a], you will not go there for fear of briers and thorns[d][c][b]; they will become a place for the sending out of oxen and for the trampling of sheep.
translation:
  language: hi
  text: और वे सभी पहाड़ियाँ, जिन्हें कुदाल से खोदा जाता था[a]—कँटीली झाड़ियों और काँटों के डर से कोई वहाँ नहीं जाएगा[b]। वे बैलों को खुला छोड़ने की जगह[c] और भेड़-बकरियों के रौंदने का स्थान बन जाएँगी[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जिन पर कुदाल से खेती की जाती थी।’ इब्रानी में ‘कुदाल’ और ‘खोदना’ एक ही शब्द-मूल से बने शब्द हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘तू वहाँ नहीं जाएगा’; यहाँ ‘तू’ सामान्य रूप से किसी भी व्यक्ति के लिए हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'या ‘बैलों को चरने के लिए छोड़ने की जगह’; अधिक भावार्थपरक अनुवाद: ‘बैलों का चरागाह।’'
    reason: lexical_alternative
  - marker: d
    text: इब्रानी שֶׂה किसी भेड़ या बकरी, अथवा व्यापक रूप से छोटे पालतू पशु को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל הֶהָרִים
  choice: और वे सभी पहाड़ियाँ
  rationale: कृषि और चराई के प्रसंग में הַר के लिए ‘पहाड़ियाँ’ स्वाभाविक है; וְכֹל वर्णन में इस अगले भू-भाग को जोड़ता है।
- source_word: אֲשֶׁר בַּמַּעְדֵּר יֵעָדֵרוּן
  choice: जिन्हें कुदाल से खोदा जाता था
  rationale: מַעְדֵּר खेती में प्रयुक्त कुदाल/मट्टॉक है और संबंधित क्रिया भूमि को खोदकर काम करने को बताती है। ‘जाता था’ आगामी उजाड़ दशा के विपरीत पूर्व की नियमित खेती व्यक्त करता है।
- source_word: לֹא תָבוֹא שָׁמָּה
  choice: कोई वहाँ नहीं जाएगा
  rationale: द्वितीय पुरुष एकवचन यहाँ सामान्य व्यक्ति के अर्थ में समझा जा सकता है; आधुनिक हिन्दी में ‘कोई’ इस सामान्य भाव को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יִרְאַת שָׁמִיר וָשַׁיִת
  choice: कँटीली झाड़ियों और काँटों के डर से
  rationale: यह युग्म उजाड़ भूमि में उगने वाली बाधक कँटीली वनस्पति को दर्शाता है; हिन्दी में यह पदबंध चित्र और कारण दोनों स्पष्ट रखता है।
- source_word: לְמִשְׁלַח שׁוֹר
  choice: बैलों को खुला छोड़ने की जगह
  rationale: מִשְׁלַח पशुओं को बाहर भेजने अथवा खुला छोड़ देने का ठोस बिंब रखता है; केवल ‘चरागाह’ कहने से वह बिंब दब जाता।
- source_word: וּלְמִרְמַס שֶׂה
  choice: भेड़-बकरियों के रौंदने का स्थान
  rationale: מִרְמַס रौंदने/पाँव तले चलने को और שֶׂה छोटे पालतू पशु को दर्शाता है; ‘भेड़-बकरियाँ’ इसकी व्यापक सम्भावना को सहज हिन्दी में व्यक्त करता है।
