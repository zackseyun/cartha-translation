  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। कृषि-विनाश का चित्र ठोस रखा गया है। सामान्य अर्थ वाले इब्रानी द्वितीय पुरुष को मुख्य पाठ में ‘कोई’ किया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
