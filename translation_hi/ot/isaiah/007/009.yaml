reference: Isaiah 7:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/רֹ֤אשׁ אֶפְרַ֨יִם֙ שֹׁמְר֔וֹן וְ/רֹ֥אשׁ שֹׁמְר֖וֹן בֶּן רְמַלְיָ֑הוּ אִ֚ם לֹ֣א תַאֲמִ֔ינוּ כִּ֖י לֹ֥א תֵאָמֵֽנוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/009.yaml
  text: And the head of Ephraim is Samaria[a], and the head of Samaria is the son of Remaliah. If you do not believe[b], surely you will not be established.
translation:
  language: hi
  text: और एप्रैम का प्रधान सामरिया है, और सामरिया का प्रधान रमल्याह का पुत्र है। यदि तुम विश्वास न रखोगे, तो निश्चय ही स्थिर न रहोगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में ‘विश्वास रखना’ और ‘स्थिर रहना’ वाली दोनों क्रियाएँ एक ही धातु (אמן) से बनी हैं। इसे इस प्रकार भी अनूदित किया जा सकता है: “यदि तुम भरोसा न रखोगे, तो दृढ़ न टिकोगे।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: प्रधान
  rationale: एक ही शब्द को दोनों समानांतर वाक्यांशों में रखा गया है। यह पहले सामरिया की एप्रैम में प्रमुख स्थिति और फिर रमल्याह के पुत्र के सामरिया पर शासन—दोनों के लिए स्वाभाविक है, यद्यपि इब्रानी का शाब्दिक रूप ‘सिर’ है।
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: इब्रानी स्थान/गोत्र-नाम को बनाए रखा गया है; प्रसंग में यह उत्तरी राज्य को सूचित करता है, पर मुख्य पाठ में उसकी व्याख्या जोड़ना उचित नहीं।
- source_word: שֹׁמְרוֹן
  choice: सामरिया
  rationale: इस स्थान-नाम का प्रचलित हिन्दी रूप अपनाया गया है; यहाँ यह एप्रैम की राजधानी और राजनीतिक केंद्र है।
- source_word: בֶּן רְמַלְיָהוּ
  choice: रमल्याह का पुत्र
  rationale: व्यक्तिगत नाम ‘पेकह’ जोड़ने के बजाय नबी द्वारा प्रयुक्त वंशसूचक संबोधन को यथावत रखा गया है।
- source_word: תַאֲמִינוּ
  choice: विश्वास न रखोगे
  rationale: हिफ़ील रूप का अर्थ विश्वास करना या भरोसा रखना है। यह हिन्दी में स्वाभाविक है और अगले क्रियापद के साथ वैचारिक संबंध बनाए रखता है।
- source_word: כִּי
  choice: तो निश्चय ही
  rationale: शर्त के परिणाम पर दिए गए जोर को स्वाभाविक हिन्दी में व्यक्त करता है; कारणसूचक ‘क्योंकि’ यहाँ भ्रामक होगा।
- source_word: תֵאָמֵנוּ
  choice: स्थिर न रहोगे
  rationale: निफ़ाल रूप का भाव स्थापित, दृढ़ या स्थिर रहने का है। यह राजनीतिक अस्तित्व और टिके रहने की चेतावनी—दोनों को खुला रखता है।
theological_decisions:
- issue: अंतिम कथन में אמן धातु के शब्दालंकार का अनुवाद
  choice: यदि तुम विश्वास न रखोगे, तो निश्चय ही स्थिर न रहोगे।
  alternative: यदि तुम भरोसा न रखोगे, तो दृढ़ न टिकोगे।
  rationale: इब्रानी में दोनों क्रियाएँ एक ही धातु אמן से बनी हैं, किंतु उनके अर्थ क्रमशः विश्वास/भरोसा करना और स्थापित/स्थिर रहना हैं। हिन्दी में एक ही धातु से स्वाभाविक रूप से दोनों अर्थ देना संभव नहीं, इसलिए अर्थगत भेद और वैचारिक संबंध को रखा गया तथा शब्दालंकार को पादटिप्पणी में स्पष्ट किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘प्रधान’ इब्रानी समानांतरता को बनाए रखते हुए हिन्दी के अस्वाभाविक शाब्दिक ‘सिर’ से बचाता है। बहुवचन इब्रानी संबोधन को हिन्दी के संख्या-अनिर्दिष्ट ‘तुम’ से व्यक्त किया गया है।
