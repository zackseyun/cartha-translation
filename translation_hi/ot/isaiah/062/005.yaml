source:
  edition: WLC
  text: כִּֽי יִבְעַ֤ל בָּחוּר֙ בְּתוּלָ֔ה יִבְעָל֖וּ/ךְ בָּנָ֑יִ/ךְ וּ/מְשׂ֤וֹשׂ חָתָן֙ עַל כַּלָּ֔ה יָשִׂ֥ישׂ עָלַ֖יִ/ךְ אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/005.yaml
  text: For as a young man marries a virgin[a], so your sons will marry you; and as a bridegroom rejoices over a bride, so your God will rejoice over you.
translation:
  language: hi
  text: क्योंकि जैसे कोई जवान पुरुष किसी कुँवारी से विवाह करता है, वैसे ही तेरे पुत्र तुझसे विवाह करेंगे[a]; और जैसे दूल्हा अपनी दुल्हन के कारण आनन्दित होता है, वैसे ही तेरा परमेश्वर तेरे कारण आनन्दित होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, कुछ प्राचीन अनुवादों में दिखाई देने वाले वैकल्पिक पाठ और अनेक व्याख्याकारों के अनुसार, “वैसे ही तेरा बनानेवाला तुझसे विवाह करेगा” अथवा “तेरे बनानेवाले तुझसे विवाह करेंगे।” मसोरेटिक इब्रानी पाठ में “तेरे पुत्र” है।
    reason: alternative_reading
lexical_decisions:
- source_word: יִבְעַל / יִבְעָלוּךְ
  choice: विवाह करता है / तुझसे विवाह करेंगे
  rationale: בעל का मूल अर्थ स्वामी होना या अधिकार रखना हो सकता है, पर यहाँ विवाह-संबंधी उपमा में इसका स्वाभाविक अर्थ विवाह करना है। दोनों प्रयोगों में एकरूपता रखी गई है।
- source_word: בָּחוּר
  choice: जवान पुरुष
  rationale: यहाँ विवाह योग्य युवा पुरुष अभिप्रेत है; शब्द में सैनिक होने का भाव आवश्यक नहीं है।
- source_word: בְּתוּלָה
  choice: कुँवारी
  rationale: यह चयन विवाह की उपमा में इब्रानी शब्द की विशिष्टता बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: בָּנָיִךְ
  choice: तेरे पुत्र
  rationale: मसोरेटिक पाठ का स्वरांकन स्पष्टतः 'तेरे पुत्र' पढ़ता है। रूपक असामान्य होने पर भी मुख्य पाठ में प्राप्त इब्रानी को रखा गया है; वैकल्पिक पाठ फुटनोट में दिया गया है।
- source_word: מְשׂוֹשׂ חָתָן עַל כַּלָּה / יָשִׂישׂ
  choice: जैसे दूल्हा अपनी दुल्हन पर आनन्दित होता है / आनन्दित होगा
  rationale: संज्ञात्मक इब्रानी वाक्यांश को हिन्दी में स्वाभाविक तुलनात्मक क्रिया-वाक्य बनाया गया है और ששׂ की आनन्दपूर्ण तीव्रता सुरक्षित रखी गई है।
- source_word: אֱלֹהָיִךְ
  choice: तेरा परमेश्वर
  rationale: אֱלֹהִים का रूप बहुवचन जैसा है, पर यहाँ प्रत्यय और एकवचन क्रिया के संदर्भ में इस्राएल के एक परमेश्वर का एकवचन अर्थ स्पष्ट है।
- source_word: עַל / עָלַיִךְ
  choice: पर / तुझ पर
  rationale: उपमा की समानांतरता और सिय्योन पर परमेश्वर के आनन्द के काव्यात्मक चित्र को बनाए रखने के लिए 'पर' रखा गया है।
theological_decisions:
- issue: בָּנָיִךְ को 'तेरे पुत्र' मानें या प्रस्तावित वैकल्पिक पाठ 'तेरा निर्माता/तेरे निर्माता' अपनाएँ
  choice: तेरे पुत्र
  alternative: तेरा निर्माता अथवा तेरे निर्माता
  rationale: WLC के मसोरेटिक पाठ में 'तेरे पुत्र' है, इसलिए उसे मुख्य पाठ में प्राथमिकता दी गई है। यह सिय्योन को स्त्री के रूप में सम्बोधित करने वाले रूपक में तनाव उत्पन्न करता है, पर उस तनाव को चुपचाप हटाया नहीं गया। कुछ प्राचीन अनुवादों से समर्थित वैकल्पिक पठन फुटनोट में सुरक्षित है।
- issue: सिय्योन के लिए सम्बोधन का लिंग और वचन
  choice: 'स्त्रीलिंग एकवचन अनौपचारिक-काव्यात्मक ''तू'' रूप: तेरे, तुझसे, तुझ पर'
  alternative: सम्मानसूचक 'आप' अथवा सामान्य 'तुम'
  rationale: इब्रानी में सिय्योन/यरूशलेम स्त्रीलिंग एकवचन में व्यक्तित्व ग्रहण करती है। हिन्दी बाइबलीय काव्य की गरिमा और व्याकरणिक निरंतरता के लिए 'तू' के रूप रखे गए हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी अपनाई गई है। 'जवान पुरुष', 'कुँवारी', 'दूल्हा-दुल्हन' और 'आनन्दित' सामान्य पाठक के लिए स्पष्ट हैं। सम्बोधित सिय्योन का स्त्रीलिंग मूल पाठ से स्पष्ट है, यद्यपि हिन्दी सर्वनामों में लिंग प्रकट नहीं होता।
