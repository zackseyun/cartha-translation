source:
  edition: WLC
  text: כִּ֤י מְאַסְפָי/ו֙ יֹאכְלֻ֔/הוּ וְ/הִֽלְל֖וּ אֶת יְהוָ֑ה וּֽ/מְקַבְּצָ֥י/ו יִשְׁתֻּ֖/הוּ בְּ/חַצְר֥וֹת קָדְשִֽׁ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/009.yaml
  text: But those who gather it will eat it and praise Yahweh[b][a], and those who collect it will drink it in the courts of my sanctuary.
translation:
  language: hi
  text: परन्तु[a] जो उसे बटोरते हैं, वे उसे खाएँगे और यहोवा की स्तुति करेंगे; और जो उसे इकट्ठा करते हैं, वे उसे मेरे पवित्र स्थान के आँगनों में पिएँगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि जो उसे बटोरते हैं, वे उसे खाएँगे”; इब्रानी כִּי का अर्थ “क्योंकि” या “निश्चय ही” भी हो सकता है। यहाँ पिछले पद के साथ विरोध के कारण “परन्तु” किया गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “मेरे पवित्र स्थान के प्रांगणों में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: परन्तु
  rationale: पिछले पद में विदेशियों द्वारा उपज खाए-पिए जाने के निषेध के विपरीत यहाँ वास्तविक उपभोक्ताओं को सामने रखा गया है; इसलिए प्रसंग में विरोधसूचक अर्थ स्वाभाविक है।
- source_word: מְאַסְפָיו
  choice: जो उसे बटोरते हैं
  rationale: אסף का कृदन्त उपज बटोरने वालों को दर्शाता है। यह सरल हिन्दी है और प्रत्यय द्वारा पिछले पद की उपज की ओर किए गए संकेत को बनाए रखता है।
- source_word: יֹאכְלֻהוּ
  choice: वे ही उसे खाएँगे
  rationale: क्रिया का सामान्य अर्थ ‘खाना’ है। ‘ही’ पिछले पद के विदेशियों के साथ निहित विरोध को हिन्दी में स्पष्ट और स्वाभाविक बनाता है।
- source_word: וְהִלְלוּ אֶת־יְהוָה
  choice: और यहोवा की स्तुति करेंगे
  rationale: पिएल रूप में הלל का सामान्य अर्थ ‘स्तुति करना’ है; वाक्य का भविष्यकालीन प्रवाह रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को हिन्दी में प्रचलित व्यक्तिवाचक रूप ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: וּמְקַבְּצָיו
  choice: और जो उसे इकट्ठा करते हैं
  rationale: קבץ को पहले समानान्तर कृदन्त אסף से थोड़ा अलग शब्द देकर समानान्तरता और सूक्ष्म शब्दभेद दोनों रखे गए हैं; प्रसंग में इसका सम्बन्ध दाखरस की उपज से है।
- source_word: יִשְׁתֻּהוּ
  choice: वे ही उसे ... पिएँगे
  rationale: שתה का सीधा अर्थ ‘पीना’ है और कर्मवाचक प्रत्यय पिछले पद के दाखरस की ओर संकेत करता है।
- source_word: בְּחַצְרוֹת קָדְשִׁי
  choice: मेरे पवित्रस्थान के आँगनों में
  rationale: חצרות पवित्रस्थान से जुड़े आँगनों को दर्शाता है और קָדְשִׁי को इस स्थानीय-सांस्कृतिक प्रसंग में ठोस अर्थ ‘मेरा पवित्रस्थान’ दिया गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। हिन्दी पाठकों के लिए सुस्थापित रूप ‘यहोवा’ नाम की विशिष्टता को बनाए रखता है; ‘याहवे’ अधिक निकट ध्वन्यात्मक विकल्प है।
- issue: קָדְשִׁי में पवित्र स्थान का स्वरूप
  choice: मेरा पवित्रस्थान
  alternative: मेरा पवित्र स्थान / मेरी पवित्रता
  rationale: ‘आँगनों में’ के साथ ठोस स्थानवाचक अर्थ सबसे स्वाभाविक है। इससे मन्दिर-संबंधी चित्र बना रहता है, जबकि पाठ में उससे आगे कोई विशिष्ट धार्मिक व्यवस्था आरोपित नहीं होती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बटोरते’ और ‘इकट्ठा करते’ समानान्तर इब्रानी क्रियाओं का हल्का शब्दभेद बनाए रखते हैं। ‘वे ही’ पिछले पद से आने वाले बल और विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
