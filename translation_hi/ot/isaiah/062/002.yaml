base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/002.yaml
  text: Nations will see your righteousness[a], and all kings your glory[b]; and you will be called by a new name that the mouth of Yahweh will designate.
translation:
  language: hi
  text: 'राष्ट्र तेरी धार्मिकता[a] देखेंगे,

    और सभी राजा तेरी महिमा;

    तुझे एक नए नाम से पुकारा जाएगा,

    जिसका निर्धारण याहवे का मुख करेगा।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरा न्याय’ अथवा ‘तेरा निर्दोष सिद्ध किया जाना’।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से: ‘जिसे याहवे का मुख ठहराएगा’; मूल इब्रानी में कर्मसूचक प्रत्यय ‘नए नाम’ की ओर संकेत करता है।'
    reason: textual_clarity
lexical_decisions:
- source_word: וְרָאוּ
  choice: देखेंगे
  rationale: भविष्यसूचक कथन में संयोजक सहित पूर्ण क्रिया का भावी अर्थ है; ‘देखेंगे’ इसे सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: גוֹיִם
  choice: राष्ट्र
  rationale: यहाँ शब्द इस्राएल से बाहर के लोगों के व्यापक अंतरराष्ट्रीय समुदायों की ओर संकेत करता है; ‘राष्ट्र’ इस अर्थ को बिना अनावश्यक धार्मिक भेद के व्यक्त करता है।
- source_word: צִדְקֵךְ
  choice: तेरी धार्मिकता
  rationale: צדק में धार्मिकता, न्याय और निर्दोष सिद्ध किए जाने के अर्थ समाए हो सकते हैं। ‘धार्मिकता’ इसकी व्यापक नैतिक-धर्मवैचारिक ध्वनि बनाए रखती है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में दिए गए हैं।
- source_word: וְכָל מְלָכִים
  choice: और सभी राजा
  rationale: यह मूल के सामूहिक और समानांतर कथन का स्वाभाविक हिन्दी रूप है।
- source_word: כְּבוֹדֵךְ
  choice: तेरी महिमा
  rationale: כבוד यहाँ सिय्योन की प्रकट प्रतिष्ठा, वैभव और गौरव को दर्शाता है; ‘महिमा’ इसकी व्यापक बाइबिलीय अर्थच्छटा को सुरक्षित रखती है।
- source_word: וְקֹרָא לָךְ
  choice: तुझे ... पुकारा जाएगा
  rationale: मूल में क्रिया औपचारिक रूप से तृतीय पुरुष एकवचन सक्रिय है, पर कर्ता स्पष्ट नहीं है। हिन्दी का कर्मवाच्य इस अनिर्दिष्ट कर्ता को बनाए रखते हुए नाम दिए जाने का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שֵׁם חָדָשׁ
  choice: एक नया नाम
  rationale: यह केवल अलग संबोधन नहीं, बल्कि नई प्रदत्त पहचान और स्थिति का संकेत देता है।
- source_word: אֲשֶׁר פִּי יְהוָה
  choice: जिसे याहवे का मुख
  rationale: ‘याहवे का मुख’ मूल के स्पष्ट मानवीकरण को सुरक्षित रखता है और दिखाता है कि नया नाम परमेश्वर के अपने वचन से निर्धारित होगा।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह इब्रानी विशिष्ट ईश्वरीय नाम का सीधा लिप्यंतरण है।
- source_word: יִקֳּבֶנּוּ
  choice: ठहराएगा
  rationale: נקב यहाँ नाम निर्दिष्ट या निश्चित करने के अर्थ में है। ‘ठहराएगा’ नए नाम को अधिकारपूर्वक निर्धारित करने का भाव देता है और मूल के पुल्लिंग एकवचन प्रत्यय का संबंध ‘नाम’ से बनाए रखता है।
theological_decisions:
- issue: सिय्योन की सार्वजनिक पुनर्स्थापना के लिए צִדְקֵךְ का अर्थ
  choice: तेरी धार्मिकता
  alternative: तेरा न्याय अथवा तेरा निर्दोष सिद्ध किया जाना
  rationale: संदर्भ में राष्ट्र सिय्योन की बहाल हुई दशा देखते हैं, इसलिए न्याय और सार्वजनिक निर्दोषता दोनों अर्थ संभव हैं। ‘धार्मिकता’ शब्द के व्यापक नैतिक और धर्मवैचारिक तनाव को संकुचित नहीं करती; विकल्प पाद-टिप्पणी में सुरक्षित हैं।
- issue: नया नाम देने वाले की अभिव्यक्ति
  choice: तुझे एक नए नाम से पुकारा जाएगा, जिसे याहवे का मुख ठहराएगा
  alternative: वह तुझे एक नया नाम देगा, जो याहवे का मुख निर्धारित करेगा
  rationale: कर्मवाच्य अनिर्दिष्ट कर्ता को अनावश्यक रूप से पहचानने से बचाता है, जबकि अगली पंक्ति स्पष्ट करती है कि नाम का अंतिम स्रोत याहवे का अपना वचन है। ‘मुख’ को बनाए रखने से मूल का मानवीकरण भी सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। सिय्योन को संबोधित स्त्रीलिंग एकवचन रूप ‘तेरी/तुझे’ बनाए गए हैं। काव्यात्मक समानांतरता के लिए पंक्ति-विभाजन रखा गया है और मूल का ‘याहवे का मुख’ मानवीकरण सुरक्षित रखा गया है।
