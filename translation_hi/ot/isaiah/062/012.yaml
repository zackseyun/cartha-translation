base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/012.yaml
  text: And they will call them[a], “The holy people, the redeemed of Yahweh”; and you will be called, “Sought Out[c][b], a city not forsaken.”
translation:
  language: hi
  text: और वे उन्हें “पवित्र प्रजा, याहवे के छुड़ाए हुए लोग”[a] कहेंगे; और तुम्हें “ढूँढ़ी गई[b], त्यागी न गई नगरी”[c] कहा जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “वे लोग जिन्हें याहवे ने छुड़ाया है” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “ढूँढ़ी गई” का अनुवाद “चाही गई” या “जिसकी खोज-खबर ली गई” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “त्यागी न गई नगरी” का अनुवाद “वह नगरी जिसे छोड़ नहीं दिया गया” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרְאוּ לָהֶם
  choice: और वे उन्हें … कहेंगे
  rationale: भविष्यसूचक प्रसंग में क्रिया का भाव भविष्यकालीन है। अनिर्दिष्ट बहुवचन कर्ता को ‘वे’ और नाम दिए जाने वाले समूह को स्वाभाविक हिन्दी में ‘उन्हें’ कहा गया है।
- source_word: עַם הַקֹּדֶשׁ
  choice: पवित्र प्रजा
  rationale: עַם यहाँ राष्ट्र की राजनीतिक धारणा से अधिक एक समुदाय या प्रजा को दर्शाता है; निश्चित पदबंध को उपाधि के रूप में रखा गया है।
- source_word: גְּאוּלֵי יְהוָה
  choice: याहवे के छुड़ाए हुए लोग
  rationale: रूप उन लोगों को दर्शाता है जिनका छुटकारा हो चुका है। ‘लोग’ जोड़ने से हिन्दी में संज्ञात्मक बहुवचन स्पष्ट और स्वाभाविक बनता है, जबकि याहवे से संबंध की मूल व्याकरणिक व्यापकता बनी रहती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम को सामान्य पदवी से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: וְלָךְ יִקָּרֵא
  choice: और तुम्हें … कहा जाएगा
  rationale: निफ़अल क्रिया का कर्मवाच्य नामकरण-भाव हिन्दी में स्वाभाविक रूप से व्यक्त होता है। स्त्रीलिंग एकवचन संबोधन सिय्योन/यरूशलेम को मानवीकृत नगरी के रूप में संबोधित करता है।
- source_word: דְרוּשָׁה
  choice: ढूँढ़ी गई
  rationale: דרשׁ के ‘ढूँढ़ना, खोज करना, पूछताछ करना’ अर्थ को एक नई सम्मानसूचक उपाधि के रूप में यथासंभव सीधे रखा गया है; यह नहीं बताया गया कि खोजने वाला कौन है।
- source_word: עִיר לֹא נֶעֱזָבָה
  choice: वह नगरी जिसे त्यागा नहीं गया
  rationale: यह पिछली उपाधि के समानांतर नगरी का नया वर्णन है। ‘त्यागा नहीं गया’ यशायाह में पहले के परित्याग और अब पुनर्स्थापना के विरोध को बनाए रखता है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: यहाँ मूल पाठ में चार-अक्षरीय विशिष्ट नाम सीधे आया है; ‘याहवे’ उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: גְּאוּלֵי יְהוָה में संबंध
  choice: याहवे के छुड़ाए हुए लोग
  alternative: वे लोग जिन्हें याहवे ने छुड़ाया है
  rationale: इब्रानी संबंधवाचक रचना स्वामित्व और कर्तृवाचक संबंध दोनों की गुंजाइश रखती है। मुख्य पाठ संक्षिप्त उपाधि बनाए रखता है और पादटिप्पणी स्पष्ट कर्तृवाचक अर्थ देती है।
- issue: דְרוּשָׁה का आशय
  choice: ढूँढ़ी गई
  alternative: चाही गई / जिसकी खोज-खबर ली गई
  rationale: शब्द में खोजे जाने, पूछे जाने या चाही जाने की अर्थ-सीमा है। मुख्य पाठ मूल क्रिया के निकट रहता है और किसी एक धर्मवैचारिक व्याख्या को अंतिम नहीं बनाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। ‘नगरी’ स्त्रीलिंग संबोधन और यरूशलेम के मानवीकरण के साथ स्वाभाविक सामंजस्य रखता है। दोनों नए नाम उद्धरण-चिह्नों में रखे गए हैं, और वाक्य का समानांतर नामकरण-विन्यास सुरक्षित है।
