base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/001.yaml
  text: For Zion’s sake I will not keep silent[a], and for Jerusalem’s sake I will not be quiet[c][b], until her righteousness goes out like brightness and her salvation burns like a torch.
translation:
  language: hi
  text: सिय्योन के निमित्त मैं[c] चुप न रहूँगा, और यरूशलेम के निमित्त शांत न बैठूँगा[a], जब तक उसकी धार्मिकता[b] ज्योति के समान प्रकट न हो जाए और उसका उद्धार मशाल के समान जल न उठे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विश्राम न करूँगा।” इब्रानी क्रिया का अर्थ शांत या स्थिर रहना अथवा विश्राम करना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसका दोषमुक्त ठहराया जाना।” इब्रानी शब्द नैतिक अथवा वाचा-संबंधी धार्मिकता के साथ-साथ सार्वजनिक रूप से सही ठहराए जाने या निर्दोष सिद्ध होने का भाव भी दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: इस पद में वक्ता की पहचान स्पष्ट नहीं है। इसे नबी, यहोवा, या किसी अन्य प्रतिनिधि वाणी के रूप में समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן
  choice: के निमित्त
  rationale: यह प्रेरणा अथवा उद्देश्य व्यक्त करता है और सिय्योन तथा यरूशलेम के बीच काव्यात्मक समानांतरता बनाए रखता है।
- source_word: אֶחֱשֶׁה
  choice: चुप न रहूँगा
  rationale: חשׁה का सीधा अर्थ मौन रहना है; यह वर्तमान हिन्दी में स्वाभाविक और दृढ़ संकल्पसूचक है।
- source_word: אֶשְׁקוֹט
  choice: शांत न बैठूँगा
  rationale: שׁקט में शांत, स्थिर या विश्राम में होने के अर्थ आते हैं। यह मुहावरा मौन और निष्क्रियता—दोनों की छाया बनाए रखता है।
- source_word: יֵצֵא
  choice: प्रकट न हो
  rationale: יצא का मूल भाव बाहर आने का है; धार्मिकता के संदर्भ में ‘प्रकट हो’ सार्वजनिक रूप से दिखाई देने का आशय स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כַנֹּגַהּ
  choice: ज्योति के समान
  rationale: נֹגַהּ चमक या दीप्ति को दर्शाता है। ‘ज्योति’ प्रकाश की उपमा को बनाए रखती है, बिना इसे विशेष रूप से भोर ठहराए।
- source_word: צִדְקָהּ
  choice: उसकी धार्मिकता
  rationale: צדקה नैतिक अथवा वाचागत धार्मिकता और सार्वजनिक दोषमुक्ति—दोनों अर्थ दे सकता है। मुख्य पाठ में व्यापक पारंपरिक अर्थ रखा गया है और दूसरा अर्थ पादटिप्पणी में दिया गया है।
- source_word: וִישׁוּעָתָהּ
  choice: उसका उद्धार
  rationale: ישועה छुटकारे, रक्षा और पुनर्स्थापना की व्यापक धारणा व्यक्त करता है; ‘उद्धार’ इस धार्मिक और ऐतिहासिक विस्तार को बनाए रखता है।
- source_word: כְלַפִּיד יִבְעָר
  choice: मशाल के समान जल न उठे
  rationale: לַפִּיד मशाल है और בער जलने को दर्शाता है। ‘जल उठे’ भविष्य में प्रत्यक्ष और उज्ज्वल रूप से दिखाई देने वाली घटना का सजीव भाव देता है।
theological_decisions:
- issue: प्रथम पुरुष वक्ता की पहचान
  choice: मुख्य पाठ में वक्ता की पहचान स्पष्ट नहीं की गई।
  alternative: वक्ता को नबी, यहोवा, या किसी प्रतिनिधि/पहरेदार की वाणी मानना।
  rationale: इब्रानी पद स्वयं वक्ता का नाम नहीं बताता। केवल ‘मैं’ बनाए रखने से मूल की अनिश्चितता और व्याख्यात्मक तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यवाणी की काव्यात्मक गरिमा बनाए रखने के लिए ‘के निमित्त’, ‘ज्योति’ और ‘मशाल’ जैसे सुबोध साहित्यिक शब्द रखे गए हैं। वाक्य की दोहरी समानांतर रचना और स्त्रीलिंग प्रत्ययों से सूचित सिय्योन/यरूशलेम का संदर्भ सुरक्षित है।
