reference: Isaiah 62:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַל חוֹמֹתַ֣יִ/ךְ יְרוּשָׁלִַ֗ם הִפְקַ֨דְתִּי֙ שֹֽׁמְרִ֔ים כָּל הַ/יּ֧וֹם וְ/כָל הַ/לַּ֛יְלָה תָּמִ֖יד לֹ֣א יֶחֱשׁ֑וּ הַ/מַּזְכִּרִים֙ אֶת יְהוָ֔ה אַל דֳּמִ֖י לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/006.yaml
  text: On your walls[a], Jerusalem, I have appointed watchmen; all day and all night, continually, they will never be silent. You who remind Yahweh, take no rest for yourselves,
translation:
  language: hi
  text: हे यरूशलेम, तेरी दीवारों पर मैंने पहरेदार नियुक्त किए हैं; वे दिन भर और रात भर कभी चुप नहीं रहेंगे—निरंतर। हे याहवे को स्मरण दिलानेवालो[a], तुम अपने लिए कोई विश्राम न लो,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे को पुकारनेवालो” अथवा “याहवे का नाम लेनेवालो।” इब्रानी अभिव्यक्ति असाधारण रूप से सजीव है और परमेश्वर से लगातार विनती करने का चित्र प्रस्तुत करती है।
    reason: הַמַּזְכִּרִים के अर्थ-क्षेत्र में ‘स्मरण दिलाना,’ ‘नाम लेना/उल्लेख करना,’ और सन्दर्भानुसार ‘पुकारना’ सम्मिलित हो सकते हैं; विकल्प मूल की वास्तविक शाब्दिक अस्पष्टता को सुरक्षित रखते हैं।
lexical_decisions:
- source_word: חוֹמֹתַיִךְ
  choice: तेरी दीवारों पर
  rationale: חוֹמָה नगर की रक्षात्मक दीवार को दर्शाता है। ‘दीवारों’ आधुनिक हिन्दी में स्वाभाविक है और यरूशलेम को किए गए सीधे संबोधन को बनाए रखता है।
- source_word: הִפְקַדְתִּי
  choice: मैंने ... नियुक्त किए हैं
  rationale: פקד के हिफ़ील रूप का अर्थ यहाँ किसी दायित्व पर नियुक्त या तैनात करना है। ‘नियुक्त किए हैं’ सोची-समझी जिम्मेदारी सौंपने का भाव रखता है।
- source_word: שֹׁמְרִים
  choice: पहरेदार
  rationale: यह शब्द पहरा देनेवालों को दर्शाता है। ‘पहरेदार’ नगर की दीवारों पर निगरानी रखने की छवि को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל הַיּוֹם וְכָל הַלַּיְלָה תָּמִיד
  choice: दिन भर और रात भर ... निरंतर
  rationale: मूल पाठ के तीनों काल-सूचक तत्व बिना रुके जारी रहने पर बल देते हैं; अनुवाद इस पुनरुक्त बल को बनाए रखता है।
- source_word: יֶחֱשׁוּ
  choice: कभी चुप नहीं रहेंगे
  rationale: חשה का अर्थ चुप या शांत रहना है। नकार सहित अपूर्ण क्रिया यहाँ लगातार मौन न रहने का भाव देती है।
- source_word: הַמַּזְכִּרִים אֶת־יְהוָה
  choice: याहवे को स्मरण दिलानेवालो
  rationale: זכר के हिफ़ील कृदन्त में स्मरण कराने या उल्लेख करने का causative भाव है। यह चयन परमेश्वर से लगातार विनती करने की असामान्य और सजीव इब्रानी छवि को बिना नरम किए सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिन्दी में ‘याहवे’ लिप्यंतरित किया गया है।
- source_word: אַל דֳּמִי לָכֶם
  choice: तुम अपने लिए कोई विश्राम न लो
  rationale: דֳּמִי में मौन, स्थिरता या विश्राम का भाव हो सकता है। לָכֶם के साथ यह उन लोगों को स्वयं विश्राम न लेने और अपनी विनती जारी रखने का आह्वान करता है।
theological_decisions:
- issue: ‘पहरेदारों’ और ‘याहवे को स्मरण दिलानेवालों’ की पहचान
  choice: रूपक को बनाए रखते हुए उनकी पहचान अनिर्धारित रखी गई है।
  alternative: उन्हें स्वर्गदूत रक्षक, भविष्यद्वक्ता, याजक या प्रार्थना करनेवाले मध्यस्थ मानना।
  rationale: इब्रानी पाठ स्पष्ट रूप से यह नहीं बताता कि ये पहरेदार कौन हैं। किसी एक धर्मवैज्ञानिक व्याख्या को अनुवाद में जोड़ने के बजाय मूल अस्पष्टता और निरंतर विनती का आह्वान बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली अपनाई गई है। ‘तेरी’ यरूशलेम के एकवचन स्त्रीलिंग संबोधन को दर्शाता है। वाक्य के अंत में अल्पविराम रखा गया है क्योंकि विचार अगले पद में जारी रहता है।
