  verdict: revise
  source_fidelity: The draft preserves the sequence of imperatives, the repetitions, road-clearing imagery, and the banner image. However, “देश-देश के लोगों” is interpretive and less direct than the plural עַמִּים; “जातियों” better preserves the contrast with the preceding singular collective “लोगों.” “निकलो” can imply simply exiting, whereas “होकर जाओ” more directly conveys passing through the gates.
  naturalness: The revised wording is modern, clear Hindi. “जातियों के ऊपर” retains the deliberately elevated spatial image without the awkward circumlocution “देश-देश के लोगों के ऊपर.”
  terminology: “फाटक,” “रास्ता,” “राजमार्ग,” “पत्थर,” and “ध्वज” are natural and suitably dignified. “ध्वज” is a more fitting public standard/banner term than the more colloquial “झंडा” in this prophetic register.
  issues:
  - severity: medium
    issue: The plural עַמִּים is rendered as “देश-देश के लोगों.”
    rationale: This expands the source expression and sounds awkward in Hindi. “जातियों” directly represents the plural ‘peoples/nations’ and makes its contrast with “लोगों” clearer.
  - severity: low
    issue: “निकलो, निकलो” weakens the sense of passing through the gates.
    rationale: It may mean ‘come out’ rather than movement through. “होकर जाओ, होकर जाओ” keeps the direct movement and repetition.
  - severity: low
    issue: The footnote marker is placed only at the end of the whole sentence.
    rationale: Placing it immediately after “जातियों के ऊपर” makes its anchor unambiguous, since the note concerns the preposition עַל and the banner expression.
