id: ISA.62.10
reference: Isaiah 62:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עִבְר֤וּ עִבְרוּ֙ בַּ/שְּׁעָרִ֔ים פַּנּ֖וּ דֶּ֣רֶךְ הָ/עָ֑ם סֹ֣לּוּ סֹ֤לּוּ הַֽ/מְסִלָּה֙ סַקְּל֣וּ מֵ/אֶ֔בֶן הָרִ֥ימוּ נֵ֖ס עַל הָ/עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/010.yaml
  text: Pass through[a], pass through the gates; clear the way for the people. Build up, build up the highway; clear it of stones[c][b]. Raise up a banner over the peoples.
translation:
  language: hi
  text: फाटकों से होकर जाओ, होकर जाओ; लोगों के लिए रास्ता साफ़ करो। राजमार्ग बनाओ, बनाओ; उसमें से पत्थर हटा दो। जातियों के ऊपर[a] एक ध्वज ऊँचा करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जातियों के लिए एक संकेत-ध्वज खड़ा करो।”
    reason: पूर्वसर्ग עַל का अर्थ “के लिए” भी लिया जा सकता है, और נֵס का अर्थ संकेत-ध्वज या ध्वज हो सकता है।
lexical_decisions:
- source_word: עִבְרוּ עִבְרוּ
  choice: निकलो, निकलो
  rationale: दोहराई गई आज्ञा और फाटकों से होकर आगे बढ़ने का भाव सुरक्षित रहता है; हिन्दी में यह स्वाभाविक है।
- source_word: בַּשְּׁעָרִים
  choice: फाटकों से होकर
  rationale: पूर्वसर्ग और बहुवचन संज्ञा मिलकर फाटकों के आर-पार जाने का भाव देते हैं; मूल में ‘नगर’ स्पष्ट नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: פַּנּוּ דֶּרֶךְ
  choice: मार्ग साफ़ करो
  rationale: पिएल रूप यहाँ रास्ते से बाधाएँ हटाकर उसे तैयार करने का अर्थ देता है और आगे के सड़क-निर्माण वाले चित्र से मेल खाता है।
- source_word: הָעָם
  choice: लोगों
  rationale: एकवचन सामूहिक संज्ञा को ‘लोगों’ से व्यक्त किया गया है; संदर्भ में यह सिय्योन के लोगों की ओर संकेत करता है।
- source_word: סֹלּוּ סֹלּוּ
  choice: बनाओ, बनाओ
  rationale: सड़क के संदर्भ में क्रिया का अर्थ मिट्टी आदि डालकर मार्ग बनाना या ऊँचा करना है; सरल हिन्दी में ‘बनाओ’ स्पष्ट है और मूल की पुनरुक्ति भी रखता है।
- source_word: הַמְסִלָּה
  choice: राजमार्ग
  rationale: यह शब्द विशेष रूप से तैयार किए गए, प्रायः ऊँचे उठाए मार्ग को दर्शाता है; ‘राजमार्ग’ आधुनिक पाठक के लिए सुबोध है।
- source_word: סַקְּלוּ מֵאֶבֶן
  choice: उसमें से पत्थर हटा दो
  rationale: यहाँ क्रिया का आशय मार्ग को पत्थरों से साफ़ करना है; ‘उसमें’ का संकेत राजमार्ग की ओर है और हिन्दी वाक्य को स्वाभाविक बनाता है।
- source_word: הָרִימוּ נֵס
  choice: एक झंडा ऊँचा करो
  rationale: נֵס सार्वजनिक रूप से दिखाई देने वाले संकेत, ध्वज या पताका को दर्शाता है; ‘झंडा’ साधारण आधुनिक हिन्दी में इस बिंब को स्पष्ट रखता है।
- source_word: עַל הָעַמִּים
  choice: देश-देश के लोगों के ऊपर
  rationale: עַל का स्थानगत अर्थ ‘ऊपर’ सुरक्षित रखा गया है और עַמִּים के बहुवचन को अलग-अलग देशों के लोगों के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: ‘लोगों’ (הָעָם) और ‘देश-देश के लोगों’ (הָעַמִּים) का संदर्भ
  choice: पहला पद सिय्योन/इस्राएल के लोगों की ओर और दूसरा अनेक राष्ट्रों के लोगों की ओर संकेत करता है
  alternative: दोनों पद इस्राएल के लिए हों, अथवा दोनों व्यापक रूप से सभी राष्ट्रों के लिए हों
  rationale: मूल पाठ जानबूझकर एकवचन सामूहिक עַם से बहुवचन עַמִּים की ओर जाता है। हिन्दी में इस अंतर को बनाए रखने से भविष्यवाणी का विस्तृत क्षितिज सुरक्षित रहता है।
- issue: झंडे का संबंध राष्ट्रों से
  choice: עַל का सीधा स्थानगत भाव रखते हुए ‘देश-देश के लोगों के ऊपर’
  alternative: ‘देश-देश के लोगों के लिए’ या ‘उनके सामने’
  rationale: पूर्वसर्ग उद्देश्य या संबोधन का भाव भी ले सकता है, पर उसका सबसे सीधा अर्थ ‘ऊपर’ है। मुख्य पाठ में उसे रखा और अधिक अर्थपरक विकल्प को पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल की आज्ञार्थक पुनरुक्तियाँ ‘निकलो, निकलो’ और ‘बनाओ, बनाओ’ ज्यों की त्यों सुरक्षित हैं। ‘फाटक’, ‘मार्ग’, ‘राजमार्ग’ और ‘झंडा’ सड़क तैयार करने तथा सार्वजनिक संकेत खड़ा करने की एकीकृत दृश्यावली बनाए रखते हैं।
