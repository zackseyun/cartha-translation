source:
  edition: WLC
  text: נִשְׁבַּ֧ע יְהוָ֛ה בִּֽ/ימִינ֖/וֹ וּ/בִ/זְר֣וֹעַ עֻזּ֑/וֹ אִם אֶתֵּן֩ אֶת דְּגָנֵ֨/ךְ ע֤וֹד מַֽאֲכָל֙ לְ/אֹ֣יְבַ֔יִ/ךְ וְ/אִם יִשְׁתּ֤וּ בְנֵֽי נֵכָר֙ תִּֽירוֹשֵׁ֔/ךְ אֲשֶׁ֥ר יָגַ֖עַתְּ בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/008.yaml
  text: 'Yahweh has sworn by his right hand and by his strong arm: I will never again give your grain as food for your enemies[c][b][a], nor will foreigners drink your new wine for which you have labored.'
translation:
  language: hi
  text: 'याहवे ने अपने दाहिने हाथ की और अपनी बलवन्त भुजा की शपथ खाई है: “मैं फिर कभी तुम्हारा अनाज तुम्हारे शत्रुओं को भोजन के लिए नहीं दूँगा,[a] और परदेशी[b] तुम्हारा नया दाखमधु, जिसके लिए तुमने परिश्रम किया है, नहीं पिएँगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से, “यदि मैं तुम्हारा अनाज फिर दूँ ... और यदि परदेशी तुम्हारा नया दाखमधु पिएँ ...।” यह शपथ की एक रचना है, जिसमें “यदि” दृढ़ निषेध व्यक्त करता है: “निश्चय ही मैं ऐसा नहीं करूँगा।”'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “परदेश के पुत्र,” अर्थात् परदेशी लोग।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिवाचक वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: נִשְׁבַּע
  choice: शपथ खाई है
  rationale: निफ़अल पूर्ण क्रिया सम्पन्न शपथ-ग्रहण को व्यक्त करती है; हिन्दी में यह स्वाभाविक और गंभीर अभिव्यक्ति है।
- source_word: בִּימִינוֹ
  choice: अपने दाहिने हाथ की
  rationale: शपथ के आश्वासन के रूप में प्रयुक्त शाब्दिक बिंब को बनाए रखता है।
- source_word: וּבִזְרֹעַ עֻזּוֹ
  choice: और अपनी सामर्थी भुजा की
  rationale: עֹז के सामर्थ्य-भाव और भुजा के काव्यात्मक बिंब, दोनों को बनाए रखता है; ‘बलवन्त भुजा’ भी सम्भव है।
- source_word: אִם אֶתֵּן ... וְאִם יִשְׁתּוּ
  choice: मैं ... नहीं दूँगा ... और ... नहीं पिएँगे
  rationale: शपथ के बाद אִם वाली इब्रानी शपथ-रचना प्रबल निषेध व्यक्त करती है; शाब्दिक ‘यदि’ हिन्दी में अर्थ को भ्रामक बना देता।
- source_word: דְּגָנֵךְ
  choice: तुम्हारा अनाज
  rationale: कटे या उपजाए गए अन्न के लिए सरल, व्यापक और आधुनिक हिन्दी शब्द।
- source_word: לְאֹיְבַיִךְ
  choice: तुम्हारे शत्रुओं को
  rationale: ל संबंध को स्वाभाविक हिन्दी में प्राप्तकर्ता के रूप में व्यक्त करता है, जबकि ‘भोजन के लिए’ מַאֲכָל को दर्शाता है।
- source_word: בְנֵי נֵכָר
  choice: परदेशी
  rationale: शाब्दिक ‘परदेश के पुत्र’ का अर्थ विदेशी लोग है; ‘परदेशी’ संक्षिप्त, गरिमापूर्ण और सहज है।
- source_word: תִּירוֹשֵׁךְ
  choice: तुम्हारा नया दाखमधु
  rationale: תִּירוֹשׁ को सामान्य दाखमधु से अलग करते हुए ताज़ी या नई मदिरा का भाव सुरक्षित रखता है।
- source_word: אֲשֶׁר יָגַעַתְּ בּוֹ
  choice: जिसके लिए तुमने परिश्रम किया है
  rationale: स्त्रीलिंग एकवचन संबोधन सिय्योन से है; בּוֹ का अर्थ यहाँ उस उत्पादन के लिए किए गए श्रम से स्वाभाविक रूप में व्यक्त होता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिवाचक नाम है; ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है, बिना किसी सम्प्रदायगत व्याख्या को जोड़ने के।
- issue: शपथ-सूत्र में אִם का आशय
  choice: प्रबल निषेध को स्पष्ट करना—‘नहीं दूँगा ... नहीं पिएँगे’
  alternative: शाब्दिक ‘यदि मैं दूँ ... और यदि वे पिएँ’
  rationale: इब्रानी शपथ-प्रयोग में दण्ड-वाक्य लुप्त है और אִם दृढ़ निषेध का कार्य करता है। हिन्दी में निषेध स्पष्ट करना मूल कथन की प्रतिज्ञात्मक शक्ति को सुरक्षित रखता है।
- issue: दाहिना हाथ और भुजा का मानवीकरणात्मक बिंब
  choice: बिंबों को यथावत रखना
  alternative: सिर्फ ‘अपनी शक्ति की शपथ’
  rationale: मूल की काव्यात्मक भाषा और दोहरे शपथ-आधार को सुरक्षित रखा गया है; इन्हें अमूर्त करने से पाठ का रूपक घट जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल शैली अपनाई गई है। स्त्रीलिंग ‘तुम्हारा/तुमने’ का दृश्य रूप हिन्दी में लिंग नहीं दिखाता, पर संबोधन सिय्योन से समझा जाता है। ‘दाखमधु’ ने תִּירוֹשׁ की मदिरा-संबंधी विशिष्टता रखी है और ‘नया’ ने उसकी ताज़गी/नई उपज का भाव स्पष्ट किया है।
