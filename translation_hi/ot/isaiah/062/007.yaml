  yaml_path: translation/ot/isaiah/062/007.yaml
  text: and give him no rest until he establishes and until he makes Jerusalem a praise in the earth[a][b].
translation:
  language: hi
  text: और उसे तब तक विश्राम न लेने दो, जब तक वह यरूशलेम को स्थापित न कर दे और उसे पृथ्वी पर प्रशंसा का विषय न बना दे[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे मौन न रहने दो”; इब्रानी संज्ञा का अर्थ “मौन”, “शांति” या “विश्राम” हो सकता है, और यह अभिव्यक्ति यहोवा से निरंतर विनती करने का चित्र प्रस्तुत करती है।
    reason: lexical_alternative
  - marker: b
    text: या, “देश में”; इब्रानी אֶרֶץ का अर्थ “पृथ्वी” या “देश” दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל תִּתְּנוּ
  choice: और ... न लेने दो
  rationale: संयोजक और निषेध पिछले पद के आग्रह को आगे बढ़ाते हैं। हिन्दी में ‘उसे विश्राम न लेने दो’ मूल के ‘उसे विश्राम न दो’ भाव का स्वाभाविक मुहावरेदार रूप है।
- source_word: דֳמִי
  choice: विश्राम
  rationale: संज्ञा का अर्थ ‘मौन’, ‘शान्ति’ या ‘विश्राम’ हो सकता है। इस प्रयोग में भाव है कि यहोवा से निरन्तर विनती की जाए और उसे विश्राम न लेने दिया जाए; ‘मौन’ का विकल्प पादटिप्पणी में रखा गया है।
- source_word: לוֹ
  choice: उसे
  rationale: पुल्लिंग एकवचन सर्वनाम निकटवर्ती सन्दर्भ में यहोवा की ओर संकेत करता है।
- source_word: עַד יְכוֹנֵן
  choice: जब तक वह ... दृढ़ता से स्थापित न कर दे
  rationale: כון यहाँ किसी वस्तु को स्थिर, दृढ़ या स्थापित करने का अर्थ देता है। ‘दृढ़ता से स्थापित’ क्रिया की स्थायित्व-छाया को स्पष्ट रखता है।
- source_word: וְעַד יָשִׂים
  choice: और ... न बना दे
  rationale: दोहराया गया עַד दूसरा समानान्तर लक्ष्य जोड़ता है; שׂים का प्रसंगानुकूल अर्थ ‘बना देना’ है।
- source_word: יְרוּשָׁלִַם
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: תְּהִלָּה
  choice: प्रशंसा का विषय
  rationale: 'शाब्दिक ‘प्रशंसा’ के आशय को स्वाभाविक हिन्दी में व्यक्त करता है: यरूशलेम ऐसा नगर बने जिसकी प्रशंसा हो।'
- source_word: בָּאָרֶץ
  choice: पृथ्वी भर में
  rationale: אֶרֶץ का अर्थ ‘पृथ्वी’ अथवा ‘देश’ हो सकता है। व्यापक भविष्यद्वाणी-सन्दर्भ में ‘पृथ्वी’ उपयुक्त है; ‘भर में’ हिन्दी में व्यापक प्रसिद्धि के भाव को स्वाभाविक बनाता है, जबकि ‘देश में’ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ‘उसे/वह’ का सन्दर्भ
  choice: सर्वनाम यहोवा की ओर संकेत करता है, जिससे पहरेदार निरन्तर विनती करें।
  alternative: किसी अनिर्दिष्ट दिव्य या स्वर्गीय कर्ता की ओर संकेत।
  rationale: यशायाह 62:6 में ‘यहोवा को स्मरण दिलानेवालों’ को चुप न रहने को कहा गया है; पद 7 उसी सम्बोधन को स्वाभाविक रूप से जारी रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘प्रशंसा का विषय’ शाब्दिक रूपक का अर्थ स्पष्ट करता है; दोनों वास्तविक शाब्दिक अस्पष्टताएँ पादटिप्पणियों में सुरक्षित रखी गई हैं।
