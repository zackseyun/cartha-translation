source:
  edition: WLC
  text: לֹֽא יֵאָמֵר֩ לָ֨/ךְ ע֜וֹד עֲזוּבָ֗ה וּ/לְ/אַרְצֵ/ךְ֙ לֹא יֵאָמֵ֥ר עוֹד֙ שְׁמָמָ֔ה כִּ֣י לָ֗/ךְ יִקָּרֵא֙ חֶפְצִי בָ֔הּ וּ/לְ/אַרְצֵ֖/ךְ בְּעוּלָ֑ה כִּֽי חָפֵ֤ץ יְהוָה֙ בָּ֔/ךְ וְ/אַרְצֵ֖/ךְ תִּבָּעֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/004.yaml
  text: No longer will you be called Forsaken[a], and your land will no longer be called Desolate; but you will be called My Delight Is in Her, and your land Married; for Yahweh delights in you[b], and your land will be married.
translation:
  language: hi
  text: फिर कभी तुझे “त्यागी हुई” नहीं कहा जाएगा, और तेरी भूमि को फिर “उजाड़” नहीं कहा जाएगा; बल्कि तुझे “मेरा आनंद उसमें है”[a] कहा जाएगा, और तेरी भूमि को “विवाहिता”[b] कहा जाएगा; क्योंकि याहवे तुझ में आनंद पाता है, और तेरी भूमि ब्याही जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: हेप्सीबा—अर्थात् “मेरा आनंद उसमें है।”'
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: ब्यूला—अर्थात् “विवाहिता।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזוּבָה
  choice: त्यागी हुई
  rationale: यह स्त्रीलिंग रूप में सिय्योन को दिया गया पुराना नाम/विशेषण है। ‘त्यागी हुई’ छोड़े जाने के निष्क्रिय भाव को स्पष्ट और स्वाभाविक हिंदी में बनाए रखता है।
- source_word: שְׁמָמָה
  choice: उजाड़
  rationale: भूमि की विनष्ट और निर्जन दशा को व्यक्त करता है तथा नामकरण की समानांतर रचना में संक्षिप्त और स्वाभाविक है।
- source_word: חֶפְצִי בָהּ
  choice: मेरी प्रसन्नता उसमें है
  rationale: अर्थपूर्ण इब्रानी नाम-वाक्यांश का अर्थ सीधे प्रस्तुत किया गया है, ताकि अगले उपवाक्य में חָפֵץ के साथ उसका शब्दार्थ-संबंध दिखाई दे।
- source_word: בְּעוּלָה
  choice: विवाहिता
  rationale: यह स्त्रीलिंग नाम वैवाहिक स्थिति को दर्शाता है। ‘विवाहिता’ आधुनिक, गरिमापूर्ण और संक्षिप्त हिंदी है तथा पुनःनामकरण के रूप में उपयुक्त है।
- source_word: חָפֵץ
  choice: प्रसन्न है
  rationale: यह חֶפְצִי से अर्थगत संबंध बनाए रखता है और हिंदी में याहवे की अनुकूल प्रसन्नता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय उसका प्रचलित निकट लिप्यंतरण दिया गया है।
- source_word: תִּבָּעֵל
  choice: ब्याही जाएगी
  rationale: בעל के निफ़अल रूप का वैवाहिक निष्क्रिय भाव सुरक्षित रहता है और पूर्ववर्ती ‘विवाहिता’ के साथ स्पष्ट संबंध बनता है।
- source_word: לָךְ / אַרְצֵךְ
  choice: तुझे / तेरी भूमि
  rationale: स्त्रीरूप में चित्रित सिय्योन और उसकी भूमि के बीच मूल पाठ का भेद तथा काव्यात्मक समानांतरता सुरक्षित रखी गई है।
theological_decisions:
- issue: पुनःस्थापन के नामों का अर्थानुवाद या लिप्यंतरण
  choice: मुख्य पाठ में अर्थपूर्ण नामों का हिंदी अनुवाद
  alternative: हेप्सीबा और ब्यूला जैसे पारंपरिक लिप्यंतरण मुख्य पाठ में रखना
  rationale: इब्रानी में ये नाम अर्थ की दृष्टि से पारदर्शी हैं और बदली हुई दशा की घोषणाएँ हैं। अर्थानुवाद पद की अलंकारिक शक्ति बनाए रखता है; पारंपरिक रूप पादटिप्पणियों में दिए गए हैं।
- issue: भूमि के लिए वैवाहिक रूपक
  choice: ‘विवाहिता’ और ‘ब्याही जाएगी’ के द्वारा रूपक को प्रत्यक्ष बनाए रखना
  alternative: इसे केवल पुनःस्थापन, स्वामित्व या बसावट के सामान्य कथन में बदलना
  rationale: मूल पाठ नए नाम और अंतिम क्रिया—दोनों में स्पष्ट वैवाहिक भाषा प्रयोग करता है। उसे बनाए रखने से वाचा और पुनःस्थापन से जुड़ा तनाव तथा काव्यात्मक चित्र समतल नहीं होता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। सिय्योन के स्त्रीलिंग मानवीकरण को ‘तुझे/त्यागी हुई’ और भूमि के स्त्रीलिंग वैवाहिक चित्र को ‘विवाहिता/ब्याही जाएगी’ से बनाए रखा गया है।
