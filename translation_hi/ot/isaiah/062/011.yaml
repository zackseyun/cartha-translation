  text: הִנֵּ֣ה יְהוָ֗ה הִשְׁמִ֨יעַ֙ אֶל קְצֵ֣ה הָ/אָ֔רֶץ אִמְרוּ֙ לְ/בַת צִיּ֔וֹן הִנֵּ֥ה יִשְׁעֵ֖/ךְ בָּ֑א הִנֵּ֤ה שְׂכָר/וֹ֙ אִתּ֔/וֹ וּ/פְעֻלָּת֖/וֹ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/011.yaml
  text: 'Behold[a], Yahweh has proclaimed to the end of the earth: Say to Daughter Zion, “Behold, your salvation comes; behold, his reward is with him, and his recompense before him.”'
translation:
  language: hi
  text: 'देखो, याहवे ने पृथ्वी के छोर तक यह घोषणा की है: “सिय्योन की बेटी से कहो, ‘देखो, तुम्हारा उद्धार आ रहा है;[a] देखो, उसका प्रतिफल उसके साथ है, और उसका पारिश्रमिक उसके आगे है।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारा उद्धारकर्ता आ रहा है।” इब्रानी में शाब्दिक रूप से “तुम्हारा उद्धार” है, पर आगे पुल्लिंग प्रत्यय (“उसका प्रतिफल… उसका पारिश्रमिक”) आते हैं, जो आने वाले छुड़ाने वाले के रूप में उद्धार का व्यक्तिकरण कर सकते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ परमेश्वर के व्यक्तिगत नाम को उपाधि से प्रतिस्थापित किए बिना व्यक्त करता है।
- source_word: הִשְׁמִיעַ
  choice: घोषणा की है
  rationale: हिफ़िल रूप का सार्वजनिक रूप से सुनाने या घोषित करने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
- source_word: אֶל קְצֵה הָאָרֶץ
  choice: पृथ्वी के छोर तक
  rationale: इब्रानी के एकवचन ‘छोर’ और घोषणा की व्यापक पहुँच, दोनों को बनाए रखता है।
- source_word: לְבַת צִיּוֹן
  choice: सिय्योन की बेटी से
  rationale: नगर के स्त्री-रूपक को स्पष्ट और परिचित हिन्दी बाइबिलीय भाषा में सुरक्षित रखता है।
- source_word: יִשְׁעֵךְ
  choice: तुम्हारा उद्धार
  rationale: इब्रानी संज्ञा का सीधा अर्थ रखता है और आगे आने वाले पुल्लिंग प्रत्ययों से उत्पन्न व्यक्तिकरण को अनिर्णीत छोड़ता है।
- source_word: בָּא
  choice: आ रहा है
  rationale: भविष्यसूचक घोषणा में पूर्ण रूप की निकट और जीवंत आगमन-सूचक शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׂכָרוֹ
  choice: उसका प्रतिफल
  rationale: שׂכר के पुरस्कार या देय फल के अर्थ को गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: וּפְעֻלָּתוֹ
  choice: और उसका पारिश्रमिक
  rationale: यहाँ किए गए कार्य से अधिक उसके बदले मिलने वाले देय भुगतान का भाव है; ‘पारिश्रमिक’ इसे पिछले ‘प्रतिफल’ से अलग भी रखता है।
- source_word: לְפָנָיו
  choice: उसके आगे
  rationale: स्थानगत रूपक को बनाए रखता है और ‘उसके साथ’ के समानांतर स्वाभाविक बैठता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: तीनों पुनरावृत्तियों में ध्यान आकर्षित करने वाला भविष्यसूचक बल सरल, वर्तमान हिन्दी में बनाए रखता है।
theological_decisions:
- issue: יִשְׁעֵךְ को निर्वैयक्तिक ‘तुम्हारा उद्धार’ माना जाए या आगे के पुल्लिंग प्रत्ययों के कारण वैयक्तिक ‘तुम्हारा उद्धारकर्ता’
  choice: तुम्हारा उद्धार
  alternative: तुम्हारा उद्धारकर्ता
  rationale: इब्रानी में शब्द संज्ञा ‘उद्धार’ है, जबकि आगे ‘उसका प्रतिफल’ और ‘उसका पारिश्रमिक’ के पुल्लिंग रूप उद्धार का आने वाले व्यक्ति में व्यक्तिकरण सुझा सकते हैं। मुख्य पाठ मूल संज्ञा रखता है और वैयक्तिक संभावना पादटिप्पणी में सुरक्षित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। काव्यात्मक पुनरावृत्ति ‘देखो’ तथा ‘उसके साथ/उसके आगे’ का समानांतर विन्यास सुरक्षित है।
