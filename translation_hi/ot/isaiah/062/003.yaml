  text: וְ/הָיִ֛יתְ עֲטֶ֥רֶת תִּפְאֶ֖רֶת בְּ/יַד יְהוָ֑ה ו/צנוף מְלוּכָ֖ה בְּ/כַף אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/003.yaml
  text: You will be a crown of beauty in the hand of Yahweh[a], and a royal turban in the palm of your God.
translation:
  language: hi
  text: तू यहोवा के हाथ में शोभा का मुकुट और अपने परमेश्वर की हथेली में राजकीय पगड़ी[a] होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राजकीय शिरोवस्त्र।” इब्रानी शब्द का अर्थ सिर पर लपेटकर पहना जाने वाला शिरोवस्त्र या पगड़ी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתְ
  choice: तू ... होगी
  rationale: स्त्रीलिंग एकवचन संबोधन सिय्योन/यरूशलेम से है; भविष्यसूचक संदर्भ में पूर्ण क्रिया का भाव भविष्यकालीन है।
- source_word: עֲטֶרֶת תִּפְאֶרֶת
  choice: शोभा का मुकुट
  rationale: संबंधवाचक इब्रानी संरचना को बनाए रखते हुए תִּפְאֶרֶת के सौंदर्य और वैभव—दोनों के भाव के लिए स्वाभाविक हिंदी अभिव्यक्ति चुनी गई है।
- source_word: בְּיַד
  choice: के हाथ में
  rationale: ठोस स्थानात्मक रूपक को सुरक्षित रखा गया है; इसे अमूर्त रूप से 'अधिकार में' नहीं किया गया।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय निज नाम को हिंदी में प्रचलित लिप्यंतरण द्वारा व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וְצָנִיף מְלוּכָה
  choice: और ... राजकीय पगड़ी
  rationale: צָנִיף लपेटकर पहने जाने वाले शिरोवस्त्र को सूचित करता है और מְלוּכָה उसके राजसी स्वरूप को; 'पगड़ी' पहले पद के 'मुकुट' से काव्यात्मक भिन्नता भी बनाए रखती है।
- source_word: בְּכַף
  choice: की हथेली में
  rationale: כַּף का विशिष्ट अर्थ 'हथेली' है; इससे पहले आए יָד 'हाथ' के साथ समानांतरता और शब्दगत भिन्नता दोनों सुरक्षित रहती हैं।
- source_word: אֱלֹהָיִךְ
  choice: अपने परमेश्वर
  rationale: द्वितीय स्त्रीलिंग एकवचन प्रत्यय के साथ यह इस्राएल के एक परमेश्वर को सूचित करता है; हिंदी में कर्ता-सापेक्ष संबंध के कारण 'अपने' स्वाभाविक है।
theological_decisions:
- issue: יְהוָה परमेश्वर के निज नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पाठ में उपाधि नहीं, चतुरक्षरीय निज नाम है। हिंदी पाठकों के लिए प्रतिष्ठित 'यहोवा' रूप नाम को नाम के रूप में सुरक्षित रखता है; 'याहवे' अधिक प्रत्यक्ष विद्वत्तापरक लिप्यंतरण है।
- issue: सिय्योन का स्त्रीलिंग एकवचन संबोधन
  choice: तू ... होगी
  alternative: तुम ... होगी
  rationale: इब्रानी 2 स्त्रीलिंग एकवचन को स्पष्ट रूप से सुरक्षित रखा गया है। 'तू' काव्यात्मक और सीधा है, जबकि आधुनिक हिंदी में 'तुम' भी संभव है, पर वह मूल की वचन-स्पष्टता को कम कर सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण काव्यात्मक हिंदी; स्त्रीलिंग एकवचन संबोधन और हाथ/हथेली की समानांतर बिंब-योजना सुरक्षित रखी गई है।
