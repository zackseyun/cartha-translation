source:
  edition: WLC
  text: הִנְ/נִ֨י עֹשֶׂ֤ה חֲדָשָׁה֙ עַתָּ֣ה תִצְמָ֔ח הֲ/ל֖וֹא תֵֽדָע֑וּ/הָ אַ֣ף אָשִׂ֤ים בַּ/מִּדְבָּר֙ דֶּ֔רֶךְ בִּֽ/ישִׁמ֖וֹן נְהָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/019.yaml
  text: Look[a], I am doing a new thing; now it springs up—do you not perceive it? I will even make a way in the wilderness[b], rivers in the wasteland.
translation:
  language: hi
  text: 'देखो, मैं एक नया काम कर रहा हूँ;

    अब वह अंकुरित हो रहा है—क्या तुम उसे पहचानते नहीं?[a]

    मैं मरुभूमि में भी मार्ग बनाऊँगा

    और उजाड़ प्रदेश में नदियाँ बहाऊँगा।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘क्या तुम उसे जानते नहीं?’ अथवा ‘क्या तुम उसे समझते नहीं?’
    reason: lexical_alternative
  - marker: b
    text: '‘मरुभूमि’ का अनुवाद ‘जंगल’ या ‘रेगिस्तान’ भी हो सकता है। इब्रानी में बंजर भूमि के लिए यहाँ दो संबंधित, पर अलग शब्द हैं: ‘मरुभूमि’ और ‘उजाड़ प्रदेश।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: देखो
  rationale: यह परमेश्वर की घोषणा की ओर ध्यान खींचता है। ‘देखो’ आधुनिक और स्वाभाविक हिन्दी में इसका संकेतात्मक बल बनाए रखता है।
- source_word: עֹשֶׂה חֲדָשָׁה
  choice: मैं एक नया काम कर रहा हूँ
  rationale: कृदन्त वर्तमान या आसन्न सक्रिय कार्य को व्यक्त करता है, और विशेषण यहाँ संज्ञा की तरह प्रयुक्त है। ‘नया काम’ हिन्दी में स्वाभाविक रहते हुए परमेश्वर के नए कार्य का भाव देता है।
- source_word: תִצְמָח
  choice: वह फूट निकल रहा है
  rationale: मूल क्रिया अंकुर फूटने या उगने का सजीव रूपक रखती है; वर्तमान प्रगतिशील रूप उस कार्य के अभी प्रकट होने की तात्कालिकता व्यक्त करता है।
- source_word: תֵדָעוּהָ
  choice: उसे पहचान नहीं रहे
  rationale: ידע का मूल अर्थ ‘जानना’ है, पर यहाँ उभरते हुए कार्य को भाँपने या पहचानने का संदर्भ है। ‘पहचानना’ संदर्भ के अनुकूल है, जबकि अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: אַף
  choice: भी
  rationale: यह आगे कही गई आश्चर्यजनक प्रतिज्ञा पर बल देते हुए उसका विस्तार करता है। हिन्दी में ‘भी’ इस संबंध को सहजता से व्यक्त करता है।
- source_word: בַּמִּדְבָּר דֶּרֶךְ
  choice: जंगल में मार्ग
  rationale: מִדְבָּר निर्जन अथवा बंजर वन-प्रदेश को दर्शा सकता है। ‘जंगल’ बाइबिलीय हिन्दी में प्रचलित है और ‘मार्ग’ भौतिक तथा व्यापक उद्धार-संबंधी दोनों संकेतों को खुला रखता है।
- source_word: בִּישִׁמוֹן נְהָרוֹת
  choice: उजाड़ प्रदेश में नदियाँ
  rationale: יְשִׁימוֹן घोर बंजर और सुनसान भूभाग को दर्शाता है। ‘उजाड़ प्रदेश’ इसे पहले प्रयुक्त מִדְבָּר से अलग रखते हुए समानांतरता बचाता है; ‘नदियाँ बहाऊँगा’ लक्ष्य भाषा में स्वाभाविक रूप से नदी उपलब्ध कराने का भाव व्यक्त करता है।
theological_decisions:
- issue: ‘नए काम’ के रूपक और उद्धार-संबंधी संकेत
  choice: नए सृजन और नए निर्गमन जैसी ठोस छवियों को बनाए रखना, पर किसी एक doctrinal fulfillment को अनुवाद में निश्चित न करना।
  alternative: इसे केवल निर्वासन से लौटने, केवल अंतिम युग के नवीकरण, अथवा केवल मसीही उद्धार की भविष्यवाणी के रूप में स्पष्ट करना।
  rationale: यशायाह के संदर्भ में इन छवियों के अर्थ की अनेक परतें हो सकती हैं। इब्रानी पाठ किसी एक पूर्ति को इस पद में स्पष्ट नहीं करता, इसलिए अनुवाद उसकी धर्मवैचारिक व्यापकता और तनाव को सुरक्षित रखता है।
- issue: मार्ग और नदियों की ठोस तथा रूपकात्मक अर्थ-क्षमता
  choice: ‘मार्ग’ और ‘नदियाँ’ को ठोस चित्रों के रूप में ही रखना।
  alternative: उन्हें सीधे ‘उद्धार का मार्ग’ और ‘आशीष की धाराएँ’ कहना।
  rationale: व्याख्यात्मक विस्तार पाठ में निहित संभावित रूपक को एक निश्चित अर्थ में सीमित कर देगा; मूल चित्र स्वयं पाठक के लिए दोनों स्तर खुले रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक पंक्ति-विन्यास रखा गया है। ‘देखो’ ध्यानाकर्षक उद्घोषणा है; ‘फूट निकल रहा है’ मूल के जैविक रूपक को बनाए रखता है। ‘जंगल’ और ‘उजाड़ प्रदेश’ दो अलग इब्रानी शब्दों का भेद दिखाते हैं।
