id: ISA.43.24
reference: Isaiah 43:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹא קָנִ֨יתָ לִּ֤/י בַ/כֶּ֨סֶף֙ קָנֶ֔ה וְ/חֵ֥לֶב זְבָחֶ֖י/ךָ לֹ֣א הִרְוִיתָ֑/נִי אַ֗ךְ הֶעֱבַדְתַּ֨/נִי֙ בְּ/חַטֹּאותֶ֔י/ךָ הוֹגַעְתַּ֖/נִי בַּ/עֲוֺנֹתֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/024.yaml
  text: You did not buy me sweet cane with silver[a], or satisfy me with the fat of your sacrifices; instead, you burdened me with your sins[b]; you wearied me with your iniquities.
translation:
  language: hi
  text: तूने मेरे लिए चाँदी देकर सुगंधित सरकंडा[a] नहीं खरीदा, न अपने बलिदानों की चरबी से मुझे तृप्त किया; इसके बजाय, तूने अपने पापों के द्वारा मुझसे सेवा कराई[b] और अपने अधर्मों से मुझे थका दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सुगंधित नरकट।” इब्रानी शब्द एक महँगे, सुगंधित सरकंडे को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक: “तूने अपने पापों के द्वारा मुझसे सेवा कराई।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִיתָ לִּי בַכֶּסֶף קָנֶה
  choice: मेरे लिए चाँदी से सुगंधित नरकट नहीं खरीद लाया
  rationale: קנה का व्यापारिक अर्थ यहाँ בַכֶּסֶף के कारण स्पष्ट है; קָנֶה इस प्रसंग में महँगे सुगंधित नरकट को दर्शाता है। हिंदी में ‘खरीद लाया’ भेंट के लिए वस्तु जुटाने की स्वाभाविक अभिव्यक्ति है।
- source_word: חֵלֶב זְבָחֶיךָ
  choice: अपने बलिदानों की चरबी
  rationale: बलिदान-संबंधी प्रसंग में חֵלֶב चढ़ाई जाने वाली चरबी के भागों को दर्शाता है; ठोस बलिदानी बिंब सुरक्षित रखा गया है।
- source_word: הִרְוִיתָנִי
  choice: मुझे तृप्त किया
  rationale: רוה के हिफ़ील रूप में भर देने या तृप्त करने का भाव है। यह मानवीय रूपक को बिना नरम किए स्वाभाविक हिंदी में रखता है।
- source_word: אַךְ
  choice: इसके बदले
  rationale: 'यहाँ तीखा विरोध है: जो इस्राएल ने नहीं किया, उसके विपरीत उसने अपने पापों द्वारा परमेश्वर पर सेवा का भार डाला।'
- source_word: הֶעֱבַדְתַּנִי
  choice: मुझसे सेवा कराई
  rationale: עבד के हिफ़ील का औपचारिक अर्थ ‘सेवा कराना’ है। यह चौंकाने वाला उलटाव सुरक्षित रखता है; भावार्थ ‘मुझ पर बोझ डाला’ पादटिप्पणी में दिया गया है।
- source_word: בְּחַטֹּאותֶיךָ
  choice: अपने पापों से
  rationale: בְּ यहाँ साधन का भाव देता है; ‘से’ संक्षिप्त और स्वाभाविक हिंदी है।
- source_word: הוֹגַעְתַּנִי
  choice: मुझे थका दिया
  rationale: יגע के हिफ़ील का अर्थ थका देना है; मानवीय रूपक स्पष्ट और वर्तमान हिंदी में बना रहता है।
- source_word: בַּעֲוֺנֹתֶיךָ
  choice: अपने अधर्म के कामों से
  rationale: עָוֹן में अधर्म और दोष दोनों का अर्थ-क्षेत्र है। ‘अधर्म के काम’ पिछले ‘पापों’ से कुछ भेद रखते हुए नैतिक गंभीरता व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर को बलिदानों से तृप्त और पापों से थका हुआ बताने वाली मानवीय भाषा
  choice: ‘मुझे तृप्त किया,’ ‘मुझसे सेवा कराई,’ और ‘मुझे थका दिया’ को सीधे बनाए रखा गया।
  alternative: इसे ‘मेरा सम्मान नहीं किया’ या ‘मुझे अप्रसन्न किया’ जैसी अमूर्त भाषा में नरम करना।
  rationale: मूल इब्रानी जानबूझकर तीखी मानवीय भाषा और विडंबनापूर्ण उलटाव प्रस्तुत करता है। इसे बनाए रखना पाठ के धर्मवैचारिक तनाव को सुरक्षित रखता है।
- issue: הֶעֱבַדְתַּנִי का शाब्दिक और भावार्थपरक अनुवाद
  choice: मुख्य पाठ में अधिक शाब्दिक ‘मुझसे सेवा कराई’ रखा गया।
  alternative: ‘मुझ पर बोझ डाला।’
  rationale: शाब्दिक रूप परमेश्वर से सेवा कराने के चौंकाने वाले कथन को सुरक्षित रखता है, जबकि पादटिप्पणी उसका प्रसंगगत भाव स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सीधा भविष्यद्वक्तीय संबोधन। एकवचन ‘तू’ मूल के 2ms रूपों और निकट, आरोपात्मक वाणी को दर्शाता है। ‘सुगंधित नरकट’ सामान्य पाठक के लिए अपेक्षाकृत स्पष्ट है; वैकल्पिक पद पादटिप्पणी में है।
