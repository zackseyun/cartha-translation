  yaml_path: translation/ot/isaiah/043/026.yaml
  text: Remind me[a]; let us argue the case together. State your case[b], so that you may be proved right.
translation:
  language: hi
  text: मुझे स्मरण दिला[a]; आओ, हम साथ मिलकर न्याय-विवाद करें। तू अपनी बात बता, ताकि तू सही ठहरे[b]।
  philosophy: optimal-equivalence
