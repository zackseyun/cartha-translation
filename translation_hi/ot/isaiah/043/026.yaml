lexical_decisions:
- source_word: הַזְכִּירֵנִי
  choice: मुझे स्मरण दिला
  rationale: हिफ़ील आज्ञार्थक रूप और प्रथम पुरुष एकवचन प्रत्यय का सीधा अर्थ ‘मुझे स्मरण दिला’ है; यह परमेश्वर की न्यायालयीन चुनौती को स्वाभाविक और गरिमापूर्ण हिन्दी में रखता है।
- source_word: נִשָּׁפְטָה יָחַד
  choice: आओ, हम मिलकर अपना मुक़दमा लड़ें
  rationale: यह रूप साथ मिलकर न्यायिक विवाद में उतरने या मुक़दमा प्रस्तुत करने का भाव देता है। ‘मुक़दमा लड़ें’ न्यायालयीन संदर्भ को स्पष्ट करता है, जबकि ‘मिलकर’ יָחַד को व्यक्त करता है।
- source_word: סַפֵּר אַתָּה
  choice: तू अपनी बात बता
  rationale: पिएल आज्ञार्थक का अर्थ बताना, सुनाना या बयान करना है। संदर्भ में ‘अपनी बात बता’ अपने पक्ष का विवरण देने का भाव स्वाभाविक हिन्दी में व्यक्त करता है; स्वतंत्र सर्वनाम אַתָּה का बल ‘तू’ से बना रहता है।
- source_word: לְמַעַן תִּצְדָּק
  choice: ताकि तू सही ठहरे
  rationale: לְמַעַן उद्देश्य या अपेक्षित परिणाम बताता है, और צדק का काल रूप न्यायिक संदर्भ में सही या निर्दोष ठहरने का अर्थ देता है। ‘सही ठहरे’ स्पष्ट है और बाद की विशिष्ट धर्मशास्त्रीय शब्दावली आरोपित नहीं करता।
theological_decisions:
- issue: צדק की न्यायालयीन भाषा
  choice: सही ठहरे
  alternative: धर्मी ठहरे; निर्दोष ठहरे; न्यायोचित ठहराया जाए
  rationale: यहाँ परमेश्वर न्यायिक विवाद की चुनौती दे रहे हैं। ‘सही ठहरे’ किसी पक्ष के न्यायालयीन रूप से सही सिद्ध होने का भाव सुरक्षित रखता है, पर ऐसी विशिष्ट धर्मशास्त्रीय व्याख्या नहीं जोड़ता जो इस प्रसंग में अनिवार्य नहीं है।
- issue: נִשָּׁפְטָה की पारस्परिकता और वाच्य
  choice: हम मिलकर अपना मुक़दमा लड़ें
  alternative: हम मिलकर न्याय में प्रवेश करें; हमारा न्याय किया जाए; हम आपस में विवाद करें
  rationale: इब्रानी रूप को केवल निष्क्रिय ‘हमारा न्याय हो’ मानना आवश्यक नहीं; प्रसंग में परस्पर न्यायिक वाद-विवाद का अर्थ प्रबल है। चुनी हुई हिन्दी इस कानूनी तनाव को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी न्यायालयीन भाषा रखी गई है। संबोधन में एकवचन ‘तू’ मूल के אַתָּה और निकटवर्ती आज्ञार्थकों को दर्शाता है; इसे अनादर के अर्थ में नहीं, बाइबिलीय प्रत्यक्ष संबोधन के रूप में प्रयोग किया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
