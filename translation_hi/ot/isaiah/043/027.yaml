source:
  edition: WLC
  text: אָבִ֥י/ךָ הָ/רִאשׁ֖וֹן חָטָ֑א וּ/מְלִיצֶ֖י/ךָ פָּ֥שְׁעוּ בִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/027.yaml
  text: Your first father sinned[b][a], and your spokesmen rebelled against me.
translation:
  language: hi
  text: तेरे पहले पिता[a] ने पाप किया, और तेरी ओर से बोलनेवालों[b] ने मेरे विरुद्ध विद्रोह किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे सबसे आरंभिक पूर्वज।” “तेरे पहले पिता” से सामान्य रूप में इस्राएल का कोई आदिपुरुष अभिप्रेत हो सकता है; पाठ किसी विशेष व्यक्ति का नाम नहीं बताता।
    reason: lexical_alternative
  - marker: b
    text: या “तेरे दुभाषियों” अथवा “तेरे मध्यस्थों।” इब्रानी शब्द उन प्रतिनिधियों के लिए प्रयुक्त हो सकता है जो लोगों की ओर से बोलते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבִיךָ
  choice: तेरे पिता
  rationale: इब्रानी संज्ञा का मूल अर्थ ‘पिता’ है और इसमें एकवचन द्वितीय पुरुष प्रत्यय है। ‘पिता’ मूल बिंब को बनाए रखता है, जबकि प्रसंग में इसका आशय किसी पूर्वज या जाति के प्रतिनिधि पूर्वज से भी हो सकता है।
- source_word: הָרִאשׁוֹן
  choice: पहले
  rationale: यह विशेषण ‘पहला’ या ‘सबसे आरंभिक’ दर्शाता है। ‘पहले’ अनुवाद उस व्यक्ति की पहचान को अनिर्णीत रखता है।
- source_word: חָטָא
  choice: पाप किया
  rationale: नैतिक और धार्मिक प्रसंग में यह क्रिया का स्वाभाविक तथा स्पष्ट हिन्दी अनुवाद है।
- source_word: מְלִיצֶיךָ
  choice: तेरी ओर से बोलनेवालों
  rationale: यह शब्द दुभाषियों, मध्यस्थों या प्रतिनिधि वक्ताओं के लिए प्रयुक्त हो सकता है। यह चयन प्रतिनिधि रूप से बोलने का भाव व्यक्त करता है, पर किसी विशेष याजकीय भूमिका को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: פָּשְׁעוּ
  choice: विद्रोह किया
  rationale: क्रिया जानबूझकर किए गए उल्लंघन या विद्रोह का प्रबल भाव रखती है; ‘विद्रोह किया’ उसकी संबंधपरक और वाचा-संबंधी गंभीरता को बनाए रखता है।
- source_word: בִי
  choice: मेरे विरुद्ध
  rationale: פשע के साथ यह पूर्वसर्ग विरोध की दिशा बताता है; हिन्दी में ‘मेरे विरुद्ध विद्रोह किया’ स्वाभाविक है।
theological_decisions:
- issue: ‘तेरे पहले पिता’ की पहचान
  choice: व्यक्ति की पहचान किए बिना मूल वाक्यांश को बनाए रखा गया।
  alternative: इसे आदम, अब्राहम या याकूब के रूप में स्पष्ट करना।
  rationale: इब्रानी पाठ किसी एक पूर्वज का नाम नहीं बताता। अनिर्णीत अभिव्यक्ति मूल की व्याख्यात्मक और धर्मवैचारिक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। परमेश्वर द्वारा सामूहिक इस्राएल को संबोधित करने के कारण निकट एकवचन ‘तेरे’ रखा गया है। ‘तेरी ओर से बोलनेवालों’ सामान्य पाठक के लिए स्पष्ट है और ‘प्रवक्ता’ से संभावित रूप से उत्पन्न नबी-संबंधी संकीर्ण अर्थ से बचता है।
