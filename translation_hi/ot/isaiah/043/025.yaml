  edition: WLC
  text: אָנֹכִ֨י אָנֹכִ֥י ה֛וּא מֹחֶ֥ה פְשָׁעֶ֖י/ךָ לְמַעֲנִ֑/י וְ/חַטֹּאתֶ֖י/ךָ לֹ֥א אֶזְכֹּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/025.yaml
  text: I[a], I am he who blots out your transgressions for my own sake[c][b], and your sins I will not remember.
translation:
  language: hi
  text: मैं ही—हाँ, मैं ही—वह हूँ जो मेरे ही लिए तेरे अपराधों को मिटाता हूँ[a], और तेरे पापों को स्मरण नहीं करूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मिटाता हूँ’ का अनुवाद ‘पोंछकर दूर करता हूँ’ या ‘मिटा डालता हूँ’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘स्मरण नहीं करूँगा’ का अर्थ यह नहीं कि परमेश्वर की स्मरण-शक्ति समाप्त हो जाती है, बल्कि यह कि वह इन पापों को फिर उनके विरुद्ध ध्यान में नहीं रखेगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי אָנֹכִי הוּא
  choice: मैं ही, हाँ, मैं ही वह हूँ
  rationale: दोहराया हुआ प्रथम-पुरुष सर्वनाम और הוּא परमेश्वर के प्रबल आत्म-परिचय को व्यक्त करते हैं। यह हिन्दी रूप पुनरुक्ति और बल दोनों को स्वाभाविक ढंग से बनाए रखता है।
- source_word: מֹחֶה
  choice: मिटा देता हूँ
  rationale: מחה का अर्थ पोंछकर हटाना या मिटाना है। ‘मिटा देता हूँ’ अपराधों के अभिलेख को समाप्त करने की रूपकात्मक छवि को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: פְשָׁעֶיךָ
  choice: तेरे अपराधों
  rationale: פשע में उल्लंघन और विद्रोह का भाव है। ‘अपराध’ इसकी नैतिक गंभीरता बनाए रखता है और सामान्य पाठक के लिए स्पष्ट है।
- source_word: לְמַעֲנִי
  choice: अपने ही कारण
  rationale: यह पद परमेश्वर के कार्य का आधार उसी में होने पर बल देता है। ‘अपने ही कारण’ इस आत्म-संदर्भित बल को स्पष्ट रखता है, बिना कोई अतिरिक्त कारण जोड़ने के।
- source_word: וְחַטֹּאתֶיךָ
  choice: और तेरे पापों को
  rationale: חטאות के लिए ‘पाप’ सीधा और स्वाभाविक शब्द है तथा पहले प्रयुक्त פשע से संबंधित किंतु अलग शब्दावली बनाए रखता है।
- source_word: לֹא אֶזְכֹּר
  choice: स्मरण नहीं करूँगा
  rationale: यह मूल की भावी प्रतिज्ञा को औपचारिक किंतु सहज हिन्दी में सीधे व्यक्त करता है और जानबूझकर फिर विचार में न लाने के वाचागत अर्थ को खुला रखता है।
theological_decisions:
- issue: क्षमा का दैवी आधार
  choice: ‘अपने ही कारण’—परमेश्वर अपराध मिटाने का आधार अपने भीतर बताता है।
  alternative: मनुष्य के पश्चाताप, योग्यता या किसी अन्य स्पष्ट न किए गए कारण के कारण।
  rationale: लְמַעֲנִי स्पष्ट रूप से परमेश्वर की ओर संकेत करता है; इसलिए अनुवाद में ऐसी कोई शर्त नहीं जोड़ी गई जो इस पद में नहीं है।
- issue: पापों को स्मरण न करना
  choice: मूल अभिव्यक्ति ‘स्मरण नहीं करूँगा’ को बनाए रखा गया है।
  alternative: ‘दण्ड नहीं दूँगा’ या ‘पूरी तरह भूल जाऊँगा।’
  rationale: ये विकल्प निहितार्थ समझा सकते हैं, पर मूल की स्मरण-संबंधी भाषा को संकुचित या अस्तित्वगत विस्मरण में बदल सकते हैं। मुख्य पाठ वास्तविक कथन और उसके धर्मवैचारिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष दैवी वाणी। एकवचन संबोधन को मूल के अनुरूप ‘तेरे/तेरे’ से रखा गया है। ‘मैं ही, हाँ, मैं ही’ हिब्रू की पुनरुक्ति और जोर को स्वाभाविक हिन्दी में बनाए रखता है।
