  source_fidelity: 'The translation accurately renders the collective-personal force of כֹּל in context, the passive identification in הַנִּקְרָא בִשְׁמִי, the purpose phrase “for my glory,” and the three distinct divine actions: create, form, and make. The relative-clause restructuring is a faithful and idiomatic way to handle the Hebrew singular suffixes without falsely limiting the referent to males. “हाँ” adequately conveys the emphatic אַף.'
