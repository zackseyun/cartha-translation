id: ISA.43.7
reference: Isaiah 43:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּ֚ל הַ/נִּקְרָ֣א בִ/שְׁמִ֔/י וְ/לִ/כְבוֹדִ֖/י בְּרָאתִ֑י/ו יְצַרְתִּ֖י/ו אַף עֲשִׂיתִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/007.yaml
  text: everyone who is called by my name[a], whom I created for my glory, whom I formed, indeed whom I made.
translation:
  language: hi
  text: हर वह व्यक्ति जो मेरे नाम से कहलाता है[a], जिसे मैंने अपनी महिमा के लिए सृजा, जिसे मैंने रचा, हाँ, जिसे मैंने बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “हर वह व्यक्ति जो मेरे नाम से कहलाता है—और अपनी महिमा के लिए मैंने उसे सृजा; मैंने उसे रचा, हाँ, मैंने उसे बनाया।”'
    reason: इब्रानी के मूल शब्दक्रम और एकवचन प्रत्ययों का अधिक औपचारिक विकल्प।
lexical_decisions:
- source_word: כֹּל
  choice: हर वह व्यक्ति
  rationale: पद 5–6 के संदर्भ में संकेत उन लोगों की ओर है जिन्हें परमेश्वर इकट्ठा कर रहा है। यह प्रयोग सामूहिक इब्रानी अभिव्यक्ति को स्वाभाविक और व्यक्ति-सूचक हिन्दी में व्यक्त करता है।
- source_word: הַנִּקְרָא בִשְׁמִי
  choice: जो मेरे नाम से कहलाता है
  rationale: निफ़अल रूप और בשם के साथ यह मुहावरा नाम धारण करने तथा उससे पहचाने जाने का भाव देता है। ‘कहलाता है’ केवल बुलाए जाने की घटना के बजाय इस पहचान को स्पष्ट करता है।
- source_word: וְלִכְבוֹדִי
  choice: अपनी महिमा के लिए
  rationale: כבוד यहाँ परमेश्वर की महिमा और सम्मान को सूचित करता है; ‘महिमा’ धार्मिक भार बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְּרָאתִיו
  choice: मैंने ... सृजा
  rationale: ברא के विशिष्ट सृजनार्थ को ‘सृजा’ व्यक्त करता है और आगे आने वाले ‘रचा’ तथा ‘बनाया’ से क्रियाओं का भेद बनाए रखता है।
- source_word: יְצַרְתִּיו
  choice: मैंने रचा
  rationale: יצר में आकार देने या गढ़ने का भाव है। ‘रचा’ इसे संक्षेप और गरिमा से व्यक्त करता है।
- source_word: אַף
  choice: हाँ
  rationale: यहाँ אַף अंतिम क्रिया पर बल देता है। ‘हाँ’ हिन्दी में उस पुष्टिकारक और उत्कर्षकारी बल को सहजता से व्यक्त करता है।
- source_word: עֲשִׂיתִיו
  choice: मैंने बनाया
  rationale: עשה की व्यापक ‘करना/बनाना’ अर्थ-सीमा में ‘बनाया’ उपयुक्त है और तीनों सृजनात्मक क्रियाओं के क्रम को सुरक्षित रखता है।
theological_decisions:
- issue: सामूहिक एकवचन और पुल्लिंग एकवचन प्रत्ययों का निरूपण
  choice: आरंभ में ‘हर वह व्यक्ति’ और फिर ‘जिसे’ वाले संबंधवाचक उपवाक्य
  alternative: ‘हर एक ... और अपनी महिमा के लिए मैंने उसे सृजा; मैंने उसे रचा, हाँ, मैंने उसे बनाया’
  rationale: इब्रानी में सामूहिक एकवचन के बाद 3 पुल्लिंग एकवचन प्रत्यय हैं। संबंधवाचक ‘जिसे’ मूल वस्तु-संबंध को बनाए रखता है, पर अनावश्यक रूप से केवल पुरुषों का संकेत नहीं देता।
- issue: ‘अपनी महिमा के लिए’ का वाक्यगत संबंध
  choice: इसे सृजन के उद्देश्य के रूप में ‘जिसे मैंने अपनी महिमा के लिए सृजा’ से जोड़ा गया
  alternative: इब्रानी शब्दक्रम को अधिक निकटता से रखते हुए ‘और अपनी महिमा के लिए मैंने उसे सृजा’
  rationale: इब्रानी में वाक्यांश सृजन-क्रिया से संबंधित है और उद्देश्य का भाव देता है। चुना हुआ क्रम आधुनिक हिन्दी में स्पष्ट है, जबकि औपचारिक विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप। ‘सृजा—रचा—बनाया’ से मूल की तीन अलग क्रियाएँ सुरक्षित हैं; मुख्य पाठ में संबंधवाचक रचना पठनीयता बढ़ाती है।
