  terminology: “महिमा” is the appropriate established rendering for כבוד in this context. “मेरे नाम से कहलाता है” communicates identification as belonging to or bearing God’s name without over-interpreting it. The footnote gives a legitimate more formal syntactic alternative and is correctly anchored.
