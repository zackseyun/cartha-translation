base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/003.yaml
  text: For I am Yahweh your God[a], the Holy One of Israel, your Savior; I have given Egypt as your ransom[b], Cush and Seba in exchange for you.
translation:
  language: hi
  text: क्योंकि मैं, यहोवा, तुम्हारा परमेश्वर, इस्राएल का पवित्र, तुम्हारा उद्धारकर्ता हूँ; मैंने तुम्हारी छुड़ौती के रूप में मिस्र को, और तुम्हारे बदले[a] कूश[b] और सबा को दे दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तुम्हारे बदले’ का अनुवाद ‘तुम्हारे स्थान पर’ भी हो सकता है। पद के अंत की इब्रानी अभिव्यक्ति प्रतिस्थापन या विनिमय का भाव रखती है।
    reason: lexical_alternative
  - marker: b
    text: कूश मिस्र के दक्षिण में स्थित प्राचीन क्षेत्र था, जिसका संबंध प्रायः नूबिया और इथियोपिया के भूभाग से जोड़ा जाता है।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले आश्वासन का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबिल परंपरा में प्रचलित रूप रखते हुए वाचा-संबंधी व्यक्तिगत ईश्वरीय नाम को सुरक्षित करता है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय और वाचा-सूत्र की व्यक्तिगत संबद्धता को सीधे व्यक्त करता है।
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: इस्राएल का पवित्र जन
  rationale: यशायाह में प्रयुक्त विशिष्ट उपाधि की व्यक्तिवाचक और उपाधिमूलक शक्ति बनाए रखता है।
- source_word: מוֹשִׁיעֶךָ
  choice: तुम्हारा उद्धारकर्ता
  rationale: कर्तृवाचक कृदंत को व्यक्तिगत उपाधि के रूप में व्यक्त करता है और प्रत्यय ‘तुम्हारा’ को बनाए रखता है।
- source_word: נָתַתִּי
  choice: मैंने ... दे दिया है
  rationale: पूर्ण हुई ईश्वरीय क्रिया और उसकी वर्तमान प्रासंगिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָפְרְךָ
  choice: तुम्हारी छुड़ौती
  rationale: यहाँ शब्द किसी के स्थान पर दिए गए प्रतिपूरक मूल्य को दर्शाता है; ‘छुड़ौती’ विनिमय की प्रबल छवि रखती है, बिना इसे अनिवार्यतः अनुष्ठानिक प्रायश्चित बनाने के।
- source_word: מִצְרַיִם
  choice: मिस्र
  rationale: स्थान-नाम का मानक हिन्दी रूप।
- source_word: כּוּשׁ
  choice: कूश
  rationale: प्राचीन क्षेत्र का लिप्यंतरण आधुनिक इथियोपिया से उसका अनैतिहासिक पूर्ण समानीकरण नहीं करता।
- source_word: סְבָא
  choice: सबा
  rationale: स्थान-नाम का सरल हिन्दी लिप्यंतरण, जिसे शेबा से अलग समझना चाहिए।
- source_word: תַּחְתֶּיךָ
  choice: तुम्हारे बदले
  rationale: प्रतिस्थापन अथवा विनिमय का अर्थ संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: मिस्र, कूश और सबा से संबंधित छुड़ौती और विनिमय की भाषा
  choice: पद राष्ट्रों को इस्राएल की रक्षा और मुक्ति के लिए दिए गए छुड़ौती-मूल्य अथवा विनिमय के रूप में प्रस्तुत करता है।
  alternative: इसे छुड़ौती की अपेक्षा अधिक ढीले अर्थ में राजनीतिक प्रतिपूर्ति माना जा सकता है।
  rationale: तात्कालिक प्रसंग राष्ट्रीय मुक्ति और ईश्वरीय संरक्षण का है। ‘छुड़ौती’ और ‘तुम्हारे बदले’ मूल की सशक्त प्रतिस्थापन-भाषा बनाए रखते हैं, पर बाद के किसी विशिष्ट प्रायश्चित-सिद्धांत को पद में नहीं जोड़ते।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। एकवचन ‘तुम्हारा/तुम्हारे’ मूल के 2ms संबोधन को दर्शाता है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न संबंधित वाक्य के अंत में रखे गए हैं।
