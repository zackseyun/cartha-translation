  text: אָנֹכִ֞י הִגַּ֤דְתִּי וְ/הוֹשַׁ֨עְתִּי֙ וְ/הִשְׁמַ֔עְתִּי וְ/אֵ֥ין בָּ/כֶ֖ם זָ֑ר וְ/אַתֶּ֥ם עֵדַ֛/י נְאֻם יְהוָ֖ה וַֽ/אֲנִי אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/012.yaml
  text: I myself declared and saved and announced[a], and there was no foreign god among you; and you are my witnesses, declares Yahweh, and I am God.
translation:
  language: hi
  text: मैंने ही घोषणा की, बचाया और सुनाया[a]; तुम्हारे बीच कोई पराया देवता न था। तुम मेरे गवाह हो—याहवे की यह घोषणा है—और मैं परमेश्वर हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे बीच कोई अजनबी/विदेशी व्यक्ति न था।” इब्रानी शब्द का अर्थ “पराया” या “विदेशी” हो सकता है, पर यहाँ प्रसंग सम्भवतः किसी पराए देवता की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: मैं ही था जिसने
  rationale: स्वतंत्र प्रथम-पुरुष सर्वनाम का बल व्यक्त करता है, पर पद के अंतिम कथन में अनावश्यक रूप से ‘केवल’ नहीं जोड़ता।
- source_word: הִגַּדְתִּי
  choice: घोषणा की
  rationale: हिफ़ील रूप का अर्थ ‘बताया/प्रकट किया’ है; ‘घोषणा की’ पद के गंभीर, साक्ष्य-संबंधी स्वर के अनुकूल है।
- source_word: וְהוֹשַׁעְתִּי
  choice: बचाया
  rationale: ישׁע के हिफ़ील का सीधा अर्थ बचाना या छुड़ाना है; ‘बचाया’ सरल और धर्मवैचारिक प्रतिध्वनि वाला है।
- source_word: וְהִשְׁמַעְתִּי
  choice: सुनाया
  rationale: शाब्दिक भाव ‘सुनने को कराया’ है; ‘सुनाया’ स्वाभाविक हिन्दी में पहले क्रियापद से भिन्नता भी बनाए रखता है।
- source_word: וְאֵין בָכֶם זָר
  choice: तुम्हारे बीच कोई पराया देवता न था
  rationale: संदर्भ याहवे के घोषणा करने और बचाने की अद्वितीय भूमिका का है, इसलिए זָר से निहित पराए देवता को मुख्य पाठ में स्पष्ट किया गया है; शब्द की व्यापक सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: עֵדַי
  choice: मेरे गवाह
  rationale: प्रथम-पुरुष प्रत्यय सहित संज्ञा का स्वाभाविक हिन्दी रूप है और न्यायिक/साक्ष्यात्मक चित्र बनाए रखता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: स्थिर नबूवत-सूत्र को गरिमापूर्ण और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत वाचा-नाम को लिप्यंतरित करके सुरक्षित रखता है।
- source_word: וַאֲנִי אֵל
  choice: और मैं परमेश्वर हूँ
  rationale: אֵל यहाँ सामान्य संज्ञा/उपाधि है; यह अनुवाद कथन की चरम घोषणा को बिना ‘अकेला’ जैसे अतिरिक्त शब्द के व्यक्त करता है।
theological_decisions:
- issue: וְאֵין בָכֶם זָר में זָר का आशय
  choice: पराया देवता
  alternative: पराया व्यक्ति / अजनबी
  rationale: आसपास का प्रसंग उद्धार और दैवी घोषणा के विषय में याहवे की अद्वितीयता पर केंद्रित है, इसलिए देवता का अर्थ अधिक सम्भावित है; फिर भी वास्तविक शब्दगत अस्पष्टता पादटिप्पणी में दी गई है।
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में आए चार-अक्षरीय व्यक्तिगत नाम को नाम के रूप में प्रस्तुत किया गया है।
- issue: וַאֲנִי אֵל में विशिष्टता
  choice: और मैं परमेश्वर हूँ
  alternative: और केवल मैं ही परमेश्वर हूँ
  rationale: संदर्भ विशिष्टता का संकेत देता है, पर इस उपवाक्य में ‘केवल’ स्पष्ट रूप से नहीं है; इसलिए उसे जोड़कर तनाव को समय से पहले नहीं सुलझाया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘घोषणा की, बचाया और सुनाया’ मूल की तीन समानांतर क्रियाओं को सुरक्षित रखता है; डैश नबूवत-सूत्र को मुख्य कथन से स्पष्ट रूप से अलग करते हैं।
