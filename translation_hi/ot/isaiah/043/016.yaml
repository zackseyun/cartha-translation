base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/016.yaml
  text: 'Thus says Yahweh[a], who makes a way in the sea and a path in the mighty waters:'
translation:
  language: hi
  text: 'याहवे यों कहता है—जो समुद्र में[a] मार्ग और प्रबल जलराशियों में पथ बनाता है:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समुद्र के बीच से” और “प्रबल जलराशियों के बीच से।” इब्रानी पूर्वसर्ग का शाब्दिक अर्थ “में” है, पर यहाँ जल के बीच से होकर जाने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह नबूवत की घोषणा का पारंपरिक सूत्र है। “यों कहता है” उसके गरिमापूर्ण स्वर और वर्तमान घोषणात्मक कार्य को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में परमेश्वर का व्यक्तिगत नाम है; इसलिए किसी उपाधि से बदलने के बजाय उसका लिप्यंतरण किया गया है।
- source_word: הַנּוֹתֵן
  choice: जो … बनाता है
  rationale: यह कृदन्त याहवे का वर्णन करता है। דֶּרֶךְ और נְתִיבָה के साथ हिन्दी में “मार्ग/पथ बनाता है” स्वाभाविक है और समुद्र में रास्ता खोलने के संकेत को व्यक्त करता है।
- source_word: בַּיָּם
  choice: समुद्र में
  rationale: בְ का मूल स्थानवाचक अर्थ “में” है। इससे मूल बिंब सुरक्षित रहता है, जबकि गतिसूचक “के बीच से” को पादटिप्पणी में विकल्प के रूप में दिया गया है।
- source_word: דָּרֶךְ
  choice: मार्ग
  rationale: यह शब्द वास्तविक रास्ते और व्यापक रूपक—दोनों को व्यक्त कर सकता है तथा निर्गमन की ओर संकेत बनाए रखता है।
- source_word: וּבְמַיִם עַזִּים
  choice: और प्रबल जलराशियों में
  rationale: עַזִּים का अर्थ शक्तिशाली या प्रबल है। “प्रबल जलराशियाँ” काव्यात्मक, सुबोध और अर्थ की दृष्टि से संयत है; यह जल को अनिवार्य रूप से “उफनता” नहीं ठहराता।
- source_word: נְתִיבָה
  choice: पथ
  rationale: “पथ” דָּרֶךְ के समानार्थी होते हुए भी उससे अलग शब्द है, इसलिए इब्रानी काव्य की समानांतरता बनी रहती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पद में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। “याहवे” उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: समुद्र और जलराशियों के संबंध में בְ का अर्थ
  choice: में
  alternative: के बीच से
  rationale: इब्रानी पूर्वसर्ग मूलतः “में” है, पर निर्गमन-संबंधी संदर्भ में उसमें जल के बीच से होकर जाने का भाव भी हो सकता है। मुख्य पाठ मूल रूप को सुरक्षित रखता है और संभावित गतिसूचक अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर नबूवत की घोषणा के अनुरूप गरिमापूर्ण रखी गई है। “मार्ग/पथ” और “समुद्र/जलराशियाँ” की समानांतर रचना मूल की काव्यात्मकता को सुरक्षित रखती है।
