  text: הַ/מּוֹצִ֥יא רֶֽכֶב וָ/ס֖וּס חַ֣יִל וְ/עִזּ֑וּז יַחְדָּ֤ו יִשְׁכְּבוּ֙ בַּל יָק֔וּמוּ דָּעֲכ֖וּ כַּ/פִּשְׁתָּ֥ה כָבֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/017.yaml
  text: who brings out chariot and horse[a], army and mighty one together; they lie down, they do not rise; they are extinguished, quenched like flax.
translation:
  language: hi
  text: जो रथ और घोड़े, सेना और बलवान को एक साथ निकालता है—वे पड़े हैं, फिर नहीं उठते; वे बुझ गए, सन के समान[a] बुझ गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सन की बत्ती के समान”; हिब्रू में शाब्दिक रूप से “सन के समान” है, जो ऐसी वस्तु का चित्र प्रस्तुत करता है जिसे शीघ्र बुझाया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמּוֹצִיא
  choice: जो ... बाहर निकाल लाता है
  rationale: हिफ़ील कृदंत का वर्णनात्मक बल रखा गया है। वर्तमानकालीन अभिव्यक्ति निर्गमन की ऐतिहासिक ओर संकेत करते हुए भी प्रभु के कार्य का सजीव चित्र प्रस्तुत करती है।
- source_word: רֶכֶב וָסוּס
  choice: रथ और घोड़े
  rationale: दोनों हिब्रू संज्ञाएँ एकवचन में सामूहिक अर्थ रख सकती हैं। हिन्दी में ‘रथ और घोड़े’ सैन्य समूह का सहज और स्पष्ट चित्र देता है।
- source_word: חַיִל וְעִזּוּז
  choice: सेना और बलवान
  rationale: חַיִל को सैन्य संदर्भ में ‘सेना’ और עִזּוּז को बिना ‘योद्धा’ जोड़े निकटतर रूप में ‘बलवान’ किया गया है, जिससे मूल की कुछ अस्पष्टता बनी रहती है।
- source_word: יַחְדָּו
  choice: एक साथ
  rationale: समस्त सैन्य शक्ति के संयुक्त पतन को सीधे व्यक्त करता है।
- source_word: יִשְׁכְּבוּ בַּל יָקוּמוּ
  choice: वे पड़े रहते हैं, उठ नहीं पाते
  rationale: लेटे या पड़े रहने की मूल छवि सुरक्षित है; बलाघाती निषेध को स्वाभाविक हिन्दी में ‘उठ नहीं पाते’ से व्यक्त किया गया है।
- source_word: דָּעֲכוּ ... כָבוּ
  choice: वे बुझ गए ... बुझा दिए गए
  rationale: दोनों क्रियाओं में आग या लौ के बुझने की समानांतर छवि है। हिन्दी में पुनरुक्ति काव्यात्मक जोर और निष्प्राण कर दिए जाने का चित्र बनाए रखती है।
- source_word: כַפִּשְׁתָּה
  choice: सन के समान
  rationale: פִּשְׁתָּה का सीधा अर्थ ‘सन’ है। बत्ती का आशय संभव है, पर वह मूल में स्पष्ट नहीं, इसलिए उसे पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: प्रभु के कार्य और शत्रु की पराजय का कालगत प्रस्तुतीकरण
  choice: प्रभु की क्रिया को वर्तमानकालीन वर्णन और पराजय को सजीव काव्यात्मक क्रम में रखना
  alternative: पूरे वाक्य को सामान्य भूतकाल में रखकर केवल ऐतिहासिक निर्गमन पर बल देना
  rationale: हिब्रू कृदंत तथा क्रियारूप निर्गमन की घटना की ओर संकेत करते हुए भी उसे प्रभु के चरित्र और कार्य का सजीव वर्णन बनाते हैं; अनुवाद इस तनाव को निर्णायक रूप से एक ही काल में सीमित नहीं करता।
- issue: पराजित सैन्य शक्ति की पहचान
  choice: रथ, घोड़े, सेना और बलवान के रूप में सामान्य सैन्य भाषा बनाए रखना
  alternative: मुख्य पाठ में उन्हें मिस्र या फ़िरौन की सेना कहना
  rationale: संदर्भ निर्गमन की ओर प्रबल संकेत करता है, पर इस पद में मिस्र या फ़िरौन का नाम नहीं है; इसलिए संकेतात्मकता को सुरक्षित रखा गया है।
- issue: עִזּוּז का व्यक्तिगत या अमूर्त अर्थ
  choice: बलवान
  alternative: पराक्रम अथवा बलवान योद्धा
  rationale: ‘बलवान’ मूल के व्यक्तिवाचक अर्थ की संभावना रखता है, पर ‘योद्धा’ जैसा अतिरिक्त अर्थ नहीं जोड़ता और ‘पराक्रम’ जैसे पूर्णतः अमूर्त अर्थ को भी अनिवार्य नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। सैन्य शब्दावली सामान्य पाठक के लिए सरल है। ‘सन’ मूल शब्द के निकट है और ‘बत्ती’ की व्याख्यात्मक संभावना पादटिप्पणी में दी गई है।
