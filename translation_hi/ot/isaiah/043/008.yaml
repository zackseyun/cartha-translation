reference: Isaiah 43:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הוֹצִ֥יא עַם עִוֵּ֖ר וְ/עֵינַ֣יִם יֵ֑שׁ וְ/חֵרְשִׁ֖ים וְ/אָזְנַ֥יִם לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/008.yaml
  text: Bring out a blind people[a], though they have eyes, and the deaf, though they have ears.
translation:
  language: hi
  text: एक अंधी प्रजा को बाहर ले आ[a], हालाँकि उसकी आँखें हैं, और बहरे लोगों को, हालाँकि उनके कान हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक अंधी प्रजा को आगे ले चल।”
    reason: הוֹצִיא का अर्थ सन्दर्भ के अनुसार “बाहर ले आ” या “आगे ले चल” हो सकता है।
lexical_decisions:
- source_word: הוֹצִיא
  choice: बाहर ले आ
  rationale: यह יצא का हिफ़ील आज्ञार्थक, पुल्लिंग एकवचन रूप है और किसी को बाहर आने के लिए प्रेरित करने या बाहर लाने की आज्ञा देता है। “बाहर ले आ” आधुनिक हिन्दी में स्वाभाविक है और आज्ञा का बल बनाए रखता है।
- source_word: עַם
  choice: प्रजा
  rationale: עַם किसी सामूहिक जनसमुदाय को दर्शाता है। यहाँ अनिश्चित एकवचन समूह के लिए “एक ... प्रजा” उपयुक्त है और “राष्ट्र” की अपेक्षा कम राजनीतिक अर्थ देता है।
- source_word: עִוֵּר
  choice: अंधी
  rationale: मूल शब्द का सीधा अर्थ बनाए रखा गया है, ताकि शारीरिक भाषा और सन्दर्भ से उभरने वाला रूपक—दोनों खुले रहें।
- source_word: וְעֵינַיִם יֵשׁ
  choice: हालाँकि उसकी आँखें हैं
  rationale: शाब्दिक संरचना “और आँखें हैं” है, पर अंधी कहलाने और आँखें होने के बीच निहित विरोध को हिन्दी में “हालाँकि” स्वाभाविक रूप से व्यक्त करता है। सामूहिक एकवचन “प्रजा” के अनुसार “उसकी” रखा गया है।
- source_word: וְחֵרְשִׁים
  choice: और बहरे लोगों को
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। हिन्दी में “बहरे लोगों” से उसका बहुवचन और समानान्तर वस्तु-रूप स्पष्ट रहता है।
- source_word: וְאָזְנַיִם לָמוֹ
  choice: हालाँकि उनके कान हैं
  rationale: शाब्दिक अर्थ “और उनके कान हैं” है। “हालाँकि” बहरा होने के बावजूद कान होने की व्यंग्यात्मक विषमता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अंधेपन और बहरेपन का स्वरूप
  choice: मुख्य पाठ में इन्द्रिय-संबंधी मूल शब्दों को ज्यों का त्यों रखा गया है और सन्दर्भ को आत्मिक असंवेदनशीलता का संकेत देने दिया गया है।
  alternative: मुख्य पाठ में स्पष्ट रूप से “आत्मिक रूप से अंधी और बहरी” कहना।
  rationale: इब्रानी में अंधेपन और बहरेपन के सामान्य शब्द हैं। यशायाह के व्यापक सन्दर्भ में उनका रूपकात्मक अर्थ हो सकता है, पर उसे मुख्य पाठ में स्पष्ट कर देना मूल की अर्थगत खुली स्थिति और भविष्यद्वाणी की विडम्बना को सीमित कर देगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “प्रजा” सामूहिक एकवचन को बनाए रखता है; “हालाँकि” मूल में निहित विरोध को स्पष्ट करता है, बिना अंधेपन और बहरेपन के रूपकात्मक आशय को मुख्य पाठ में खोलकर बताने के।
