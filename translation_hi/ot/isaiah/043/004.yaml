  text: מֵ/אֲשֶׁ֨ר יָקַ֧רְתָּ בְ/עֵינַ֛/י נִכְבַּ֖דְתָּ וַ/אֲנִ֣י אֲהַבְתִּ֑י/ךָ וְ/אֶתֵּ֤ן אָדָם֙ תַּחְתֶּ֔י/ךָ וּ/לְאֻמִּ֖ים תַּ֥חַת נַפְשֶֽׁ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/004.yaml
  text: Because you are precious in my eyes[a], honored, and I love you, I give men in exchange for you[b], and peoples in place of your life.
translation:
  language: hi
  text: क्योंकि तू मेरी दृष्टि में[a] अनमोल और सम्मानित है, और मैं तुझसे प्रेम करता हूँ, मैं तेरे बदले मनुष्यों को, और तेरे प्राण के बदले जातियों को देता हूँ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि तू मेरी दृष्टि में अनमोल और सम्मानित था, और मैंने तुझसे प्रेम किया है।” संदर्भ में हिब्रू क्रियाओं का भाव भूतकालीन या वर्तमान माना जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैं तेरे बदले मनुष्यों को, और तेरे प्राण के बदले जातियों को दूँगा।” इस भविष्यसूचक संदर्भ में हिब्रू क्रिया का भाव भविष्यकालीन भी माना जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֲשֶׁר
  choice: क्योंकि
  rationale: यहाँ यह पदबंध परमेश्वर के बचाने के कार्य का कारण बताता है; कालवाचक अर्थ संभव है, पर संदर्भ में कारणवाचक अर्थ अधिक उपयुक्त है।
- source_word: יָקַרְתָּ בְעֵינַי
  choice: तू मेरी दृष्टि में अनमोल है
  rationale: हिब्रू मुहावरे के मूल्यांकन-संबंधी अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; पूर्ण क्रिया का वर्तमान प्रभाव संदर्भानुकूल है।
- source_word: נִכְבַּדְתָּ
  choice: सम्मानित है
  rationale: निफ़अल रूप यहाँ आदर या प्रतिष्ठा पाए होने का भाव देता है; यह संबंधपरक संदर्भ में 'महिमामय' से अधिक स्पष्ट है।
- source_word: וַאֲנִי אֲהַבְתִּיךָ
  choice: और मैं तुझसे प्रेम करता हूँ
  rationale: वर्तमानकालीन हिन्दी परमेश्वर के प्रेम की जारी वास्तविकता को व्यक्त करती है, यद्यपि भूतकालीन अनुवाद भी व्याकरणतः संभव है।
- source_word: וְאֶתֵּן
  choice: इसलिए मैं ... दे देता हूँ
  rationale: यिक्तोल को संदर्भ में वर्तमान-भविष्यसूचक घोषणा के रूप में समझा गया है। 'दे देता हूँ' बलिदानी विनिमय की तत्परता और घोषणात्मक बल को स्वाभाविक हिन्दी में दर्शाता है; भविष्यकाल विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: אָדָם
  choice: मनुष्यों
  rationale: सामूहिक रूप से मानव व्यक्तियों का बोध कराता है। हिन्दी में 'मनुष्यों' मूल के मानवीय अर्थ को स्पष्ट रखता और अगले बहुवचन पद से समानांतरता बनाए रखता है।
- source_word: תַּחְתֶּיךָ
  choice: तेरे बदले
  rationale: תחת का स्थानवाचक नहीं, प्रतिस्थापन या विनिमय-संबंधी अर्थ यहाँ अपेक्षित है।
- source_word: וּלְאֻמִּים
  choice: जाति-जाति के लोगों को
  rationale: बहुवचन לאמים अलग-अलग जनसमूहों या जातियों को दर्शाता है; यह हिन्दी प्रयोग केवल व्यक्तियों के बजाय सामूहिक समुदायों का भाव स्पष्ट करता है।
- source_word: תַּחַת נַפְשֶׁךָ
  choice: तेरे प्राण के बदले
  rationale: נפש यहाँ अमूर्त, देह से पृथक आत्मा के बजाय जीवित प्राण या जीवन को सूचित करता है। 'प्राण' मूल बिंब को बनाए रखते हुए हिन्दी में जीवन का अर्थ देता है।
theological_decisions:
- issue: אָדָם का सामूहिक मानवीय अर्थ
  choice: मनुष्यों
  alternative: मानवजाति; लोगों
  rationale: यहाँ किसी एक पुरुष या अमूर्त मानवजाति की नहीं, इस्राएल के बदले दिए जाने वाले मनुष्यों की बात है। यह चयन मूल अर्थ और काव्यात्मक समानांतरता दोनों को बचाता है।
- issue: נֶפֶשׁ का अर्थ
  choice: प्राण
  alternative: जीवन; आत्मा
  rationale: संदर्भ में आशय व्यक्ति के जीवित प्राण या जीवन से है। 'प्राण' हिन्दी में मूल की ठोस जीवन-संबंधी भाषा बनाए रखता है और बाद की द्वैतवादी धारणा को अनावश्यक रूप से आरोपित नहीं करता।
- issue: क्रियाओं का कालगत बल
  choice: 'वर्तमान प्रभाव: है, प्रेम करता हूँ, दे देता हूँ'
  alternative: भूतकालीन 'था/मैंने प्रेम किया'; भविष्यकालीन 'मैं दूँगा'
  rationale: हिब्रू क्रियारूप संदर्भ में वर्तमान स्थिति और भविष्यसूचक घोषणा दोनों की गुंजाइश रखते हैं। मुख्य पाठ वर्तमान प्रभाव को अपनाता है, जबकि वास्तविक कालगत अस्पष्टता पादटिप्पणियों में रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। संबोधन एकवचन और निकट संबंध वाला होने के कारण 'तू/तेरे/तुझसे' रखा गया है। काव्यात्मक समानांतरता तथा प्रतिस्थापन की तीव्र भाषा सुरक्षित रखी गई है।
