source:
  edition: WLC
  text: עַם זוּ֙ יָצַ֣רְתִּי לִ֔/י תְּהִלָּתִ֖/י יְסַפֵּֽרוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/021.yaml
  text: This people I formed for myself[a]; they will declare my praise.
translation:
  language: hi
  text: इस प्रजा को मैंने अपने लिए गढ़ा है; वे मेरी स्तुति का बखान करेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस प्रजा को मैंने अपने लिए रचा है; वे मेरी स्तुति की घोषणा करेंगे।’
    reason: יצר के लिए ‘रचा’ और ספר के लिए ‘घोषणा करेंगे’ स्वाभाविक वैकल्पिक अनुवाद हैं।
lexical_decisions:
- source_word: עַם
  choice: प्रजा
  rationale: यहाँ עַם एक सामूहिक जन-समुदाय को दर्शाता है। ‘प्रजा’ आधुनिक राष्ट्र-राज्य का अर्थ थोपे बिना परमेश्वर से उसके संबंध को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करती है।
- source_word: זוּ
  choice: इस
  rationale: זוּ निकटवाची संकेतवाचक है और पहले उल्लिखित जन-समुदाय की ओर संकेत करता है; इसलिए ‘इस’ उपयुक्त है।
- source_word: יָצַרְתִּי
  choice: मैंने ... गढ़ा है
  rationale: יצר जान-बूझकर आकार देने या गढ़ने का भाव रखता है। ‘गढ़ा’ सृजनात्मक शिल्प और उद्देश्य, दोनों को ‘बनाया’ से अधिक स्पष्ट रखता है।
- source_word: לִי
  choice: अपने लिए
  rationale: प्रथम पुरुष प्रत्यय के साथ ל का भाव ‘मेरे लिए’ है; हिन्दी में ‘अपने लिए’ कर्ता परमेश्वर की ओर स्पष्ट रूप से लौटता है और निजी तथा प्रयोजनात्मक संबंध व्यक्त करता है।
- source_word: תְּהִלָּתִי
  choice: मेरी स्तुति
  rationale: תְּהִלָּה का सामान्य अर्थ स्तुति है। ‘मेरी स्तुति’ मूल के संबंधवाचक रूप को बनाए रखता है और स्तुति के परमेश्वर की ओर निर्देशित होने को व्यक्त करता है।
- source_word: יְסַפֵּרוּ
  choice: वर्णन करेंगे
  rationale: पिएल रूप में ספר सुनाने, गिनाने या वर्णन करने का भाव देता है। ‘वर्णन करेंगे’ स्तुति के कार्यों अथवा कारणों को बताने की व्यापकता बनाए रखता है; ‘घोषणा करेंगे’ भी संभव है।
theological_decisions:
- issue: दूसरे खंड का प्रयोजन अथवा परिणाम-संबंध
  choice: 'दो स्वतंत्र खंडों को अर्धविराम से जोड़कर भविष्यकाल रखा गया: ‘वे मेरी स्तुति का वर्णन करेंगे।’'
  alternative: ‘ताकि वे मेरी स्तुति का वर्णन करें।’
  rationale: इब्रानी में स्पष्ट प्रयोजनबोधक संयोजक नहीं है। अर्धविराम और भविष्यकाल परमेश्वर द्वारा गढ़े जाने तथा उसकी स्तुति सुनाने के बीच संबंध को बनाए रखते हैं, पर प्रयोजन को व्याकरण में आवश्यकता से अधिक स्पष्ट नहीं करते।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘गढ़ा’ भविष्यद्वक्ता की काव्यात्मक शैली और יצर के शिल्पकारी भाव को सुरक्षित रखता है। फुटनोट चिह्न मुख्य पाठ में संबंधित वाक्य के अंत में दिया गया है।
