  text: וְ/לֹא אֹתִ֥/י קָרָ֖אתָ יַֽעֲקֹ֑ב כִּֽי יָגַ֥עְתָּ בִּ֖/י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/022.yaml
  text: Yet you have not called on me[a], Jacob, because you have grown weary of me[b], Israel.
translation:
  language: hi
  text: फिर भी, हे याकूब, तूने मुझे नहीं पुकारा[a], क्योंकि हे इस्राएल, तू मुझसे थक गया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे नहीं बुलाया”; इब्रानी क्रिया का साधारण अर्थ “पुकारना/बुलाना” है, पर प्रार्थना या आराधना के प्रसंग में इसका अर्थ परमेश्वर को पुकारना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तू मेरे कारण थक गया है” अथवा “तू मेरे साथ थक गया है”; इब्रानी पूर्वसर्ग इन निकट अर्थों की गुंजाइश देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: फिर भी ... नहीं
  rationale: संयोजक और निषेध पिछले प्रसंग के साथ विरोध प्रकट करते हैं; ‘फिर भी’ आधुनिक हिन्दी में इस उलाहने को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֹתִי קָרָאתָ
  choice: तूने मुझे नहीं पुकारा
  rationale: קרא का मूल अर्थ ‘पुकारना’ है और परमेश्वर के संदर्भ में यह प्रार्थना या आराधना में उसे पुकारने का भाव भी रख सकता है। हिन्दी का ‘मुझे पुकारा’ मूल रचना और इस भाव—दोनों को बनाए रखता है।
- source_word: יַעֲקֹב
  choice: हे याकूब
  rationale: यह नाम सम्बोधन के रूप में आया है; ‘हे’ हिन्दी में सम्बोधन को स्पष्ट करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह पहले आरोप का कारण प्रस्तुत करता है।
- source_word: יָגַעְתָּ בִּי
  choice: तू मुझसे थक गया है
  rationale: יגע थक जाने या श्रान्त होने को व्यक्त करता है। בִּי के साथ ‘मुझसे थक गया’ परमेश्वर के प्रति उकताहट/थकान का स्वाभाविक हिन्दी रूप है, पर ‘ऊब गया’ जितना अर्थ को सीमित नहीं करता।
- source_word: יִשְׂרָאֵל
  choice: हे इस्राएल
  rationale: यह ‘याकूब’ के समानान्तर दूसरा सम्बोधन है और उसी प्रजा को संबोधित करता है।
theological_decisions:
- issue: इस्राएल की विफलता का स्वरूप
  choice: 'इस्राएल दोनों क्रियाओं का कर्ता है: उसने परमेश्वर को नहीं पुकारा और वह परमेश्वर से थक गया।'
  alternative: इस्राएल ने परमेश्वर को नहीं पुकारा, बल्कि परमेश्वर को थका दिया।
  rationale: इब्रानी व्याकरण में द्वितीय पुरुष एकवचन ‘तू’ दोनों क्रियाओं का कर्ता है। इसलिए अनुवाद सीधे आरोप को बनाए रखता है और परमेश्वर को दूसरी क्रिया का कर्म नहीं बनाता।
- issue: בִּי में व्यक्त सम्बन्ध
  choice: मुझसे थक गया
  alternative: मेरे कारण थक गया / मेरे साथ थक गया
  rationale: पूर्वसर्ग परमेश्वर के संबंध में थक जाने का भाव दे सकता है। मुख्य पाठ प्रसंगानुकूल स्वाभाविक अर्थ देता है, जबकि पादटिप्पणी निकट वैकल्पिक सम्बन्ध को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। एकवचन ‘तू’ मूल इब्रानी के एकवचन सम्बोधन और भविष्यद्वक्ताओं के सीधे उलाहने को बनाए रखता है। ‘हे याकूब’ और ‘हे इस्राएल’ समानान्तर सम्बोधनों के रूप में रखे गए हैं।
