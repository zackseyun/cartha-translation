base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/009.yaml
  text: Let all the nations be gathered together[a], and let the peoples be assembled. Who among them can declare this and make the former things heard? Let them present their witnesses, that they may be justified; and let them hear and say[b], “It is true.”
translation:
  language: hi
  text: 'सब राष्ट्र एक साथ इकट्ठे हों,

    और सब लोग एकत्र हों।

    उनमें से कौन यह घोषित कर सकता है

    और हमें पहले की बातें[a] सुना सकता है?

    वे अपने गवाह प्रस्तुत करें, ताकि वे सही ठहरें[b];

    वे सुनें और कहें, “यह सत्य है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पहली बातें।” यशायाह में यह अभिव्यक्ति पहले की घटनाओं या पहले की गई घोषणाओं का संकेत कर सकती है, जो प्रभु की प्रभुता को प्रमाणित करती हैं।
    reason: lexical_alternative
  - marker: b
    text: या “सही सिद्ध हों” अथवा “अपना पक्ष सही सिद्ध करें।” यहाँ हिब्रू क्रिया का अर्थ न्यायालय के प्रसंग में सही पक्ष पर सिद्ध होना है।
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַגּוֹיִם
  choice: सब राष्ट्र
  rationale: यहाँ גּוֹיִם विश्व के राष्ट्रों को दर्शाता है; ‘राष्ट्र’ न्यायालय-सदृश सार्वभौमिक सभा के संदर्भ में स्वाभाविक है।
- source_word: נִקְבְּצוּ יַחְדָּו
  choice: एक साथ इकट्ठे हों
  rationale: निफ़अल रूप के एकत्र होने के भाव और יַחְדָּו के ‘एक साथ’ अर्थ, दोनों को स्पष्ट रखा गया है।
- source_word: וְיֵאָסְפוּ לְאֻמִּים
  choice: और देश-देश के लोग जमा हों
  rationale: לְאֻמִּים को पहले पद के ‘राष्ट्र’ से थोड़ा अलग रखते हुए समानांतरता और सामूहिक जनसमुदाय का भाव व्यक्त किया गया है।
- source_word: מִי בָהֶם יַגִּיד זֹאת
  choice: उनमें से कौन यह घोषित कर सकता है
  rationale: न्यायिक चुनौती में נגד के हिफ़ील का अर्थ ‘घोषित करना’ है; ‘कर सकता है’ प्रश्न में निहित चुनौती को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְרִאשֹׁנוֹת יַשְׁמִיעֻנוּ
  choice: और हमें आरम्भ की बातें सुना सकता है
  rationale: हिब्रू प्रत्यय ־נוּ का ‘हमें’ अर्थ सुरक्षित रखा गया है। רִאשֹׁנוֹת की अर्थगत खुली प्रकृति को ‘आरम्भ की बातें’ से रखा गया है, जिसे पाद-टिप्पणी स्पष्ट करती है।
- source_word: יִתְּנוּ עֵדֵיהֶם
  choice: वे अपने गवाहों को सामने लाएँ
  rationale: न्यायालय के प्रसंग में נתן और ‘गवाह’ का स्वाभाविक हिन्दी प्रयोग ‘सामने लाना’ है।
- source_word: וְיִצְדָּקוּ
  choice: ताकि वे सही ठहरें
  rationale: צדק के न्यायिक अर्थ को स्पष्ट रखा गया है, लेकिन बाद की धर्मशास्त्रीय तकनीकी शब्दावली आरोपित नहीं की गई।
- source_word: וְיִשְׁמְעוּ וְיֹאמְרוּ אֱמֶת
  choice: और लोग सुनकर कहें, “यह सच है।”
  rationale: अव्यक्त कर्ता की वास्तविक अस्पष्टता को ‘लोग’ द्वारा व्यापक रूप में रखा गया है; אֱמֶת का विधेयात्मक अर्थ सहज हिन्दी में ‘यह सच है’ है।
theological_decisions:
- issue: राष्ट्रों के सामने न्यायिक चुनौती
  choice: गवाह सामने लाने और सही ठहरने की न्यायालय-सदृश भाषा बनाए रखी गई।
  alternative: ‘धर्मी ठहराए जाएँ’ जैसी अधिक तकनीकी धर्मशास्त्रीय भाषा।
  rationale: यशायाह 43 का संदर्भ साक्ष्य और दावे की जाँच का है; अनुवाद इसी न्यायिक अर्थ को रखता है, पर बाद की सैद्धान्तिक शब्दावली नहीं जोड़ता।
- issue: अंतिम क्रियाओं का कर्ता
  choice: ‘और लोग सुनकर कहें’ के द्वारा कर्ता को व्यापक और अपेक्षाकृत अस्पष्ट रखा गया।
  alternative: इसे केवल गवाहों या केवल राष्ट्रों के प्रतिनिधियों से स्पष्ट रूप से जोड़ना।
  rationale: हिब्रू में बहुवचन क्रियाओं का निकट संदर्भ एक से अधिक सम्भव कर्ता देता है; अनुवाद को किसी एक व्याख्या को अनावश्यक रूप से निश्चित नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक न्यायसभा का स्वर रखा गया है। ‘सब राष्ट्र’, ‘देश-देश के लोग’, ‘गवाहों को सामने लाएँ’ और ‘सही ठहरें’ सामान्य पाठक के लिए सहज हैं। काव्यात्मक समानांतरता के लिए पंक्ति-विभाजन रखा गया है।
