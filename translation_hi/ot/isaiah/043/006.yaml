source:
  edition: WLC
  text: אֹמַ֤ר לַ/צָּפוֹן֙ תֵּ֔נִי וּ/לְ/תֵימָ֖ן אַל תִּכְלָ֑אִי הָבִ֤יאִי בָנַ/י֙ מֵ/רָח֔וֹק וּ/בְנוֹתַ֖/י מִ/קְצֵ֥ה הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/006.yaml
  text: I will say to the north[a], ‘Give them up,’ and to the south, ‘Do not hold them back.’ Bring my sons from far away[b], and my daughters from the end of the earth.
translation:
  language: hi
  text: मैं उत्तर से कहूँगा[a], “उन्हें दे दे,” और दक्षिण से, “उन्हें मत रोक। मेरे पुत्रों को दूर से और मेरी पुत्रियों को पृथ्वी के छोर से ले आ।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दे” / “मत रोक”; इब्रानी में कर्म कहा नहीं गया है, पर प्रसंग में संकेत परमेश्वर के बिखरे हुए लोगों की ओर है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “पृथ्वी के छोर से”; इब्रानी में ‘छोर’ एकवचन है, यद्यपि हिन्दी में “पृथ्वी के छोरों से” भी कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: मैं ... कहूँगा
  rationale: प्रथम पुरुष एकवचन अपूर्ण क्रिया इस भविष्यसूचक घोषणा में स्वाभाविक रूप से भविष्यकाल का बोध कराती है।
- source_word: לַצָּפוֹן
  choice: उत्तर से
  rationale: यह दिशा-सूचक संज्ञा है; उत्तर को मानवीकृत करके संबोधित किया गया है। हिन्दी में किसी दिशा को संबोधित करते समय ‘उत्तर से कहूँगा’ स्वाभाविक है।
- source_word: תֵּנִי
  choice: उन्हें दे दे
  rationale: आज्ञार्थक क्रिया का कर्म इब्रानी में व्यक्त नहीं है; प्रसंग से वह परमेश्वर के बिखरे हुए लोग हैं। ‘दे दे’ मूल क्रिया ‘देना’ को सुरक्षित रखता है, जबकि ‘उन्हें’ हिन्दी में आशय स्पष्ट करता है।
- source_word: וּלְתֵימָן
  choice: और दक्षिण से
  rationale: ‘उत्तर’ के समानांतर यहाँ תֵימָן का अर्थ दक्षिण दिशा है, एदोम का तेमान नामक स्थान नहीं।
- source_word: אַל תִּכְלָאִי
  choice: उन्हें मत रोक
  rationale: यह निषेधात्मक आज्ञा है। निहित कर्म को प्रसंगानुसार ‘उन्हें’ से स्पष्ट किया गया है; ‘मत रोक’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: הָבִיאִי
  choice: ले आ
  rationale: हिफ़ील आज्ञार्थक का अर्थ यहाँ दूरस्थ स्थानों से लोगों को लाना है; ‘ले आ’ सहज और स्पष्ट हिन्दी है।
- source_word: בָנַי
  choice: मेरे पुत्रों
  rationale: मूल शब्द स्पष्ट रूप से पुल्लिंग बहुवचन है, इसलिए इसे सामान्य ‘संतानों’ में नहीं बदला गया।
- source_word: מֵרָחוֹק
  choice: दूर से
  rationale: यह दूरस्थ उद्गम बताने वाला संक्षिप्त और स्वाभाविक हिन्दी पद है।
- source_word: וּבְנוֹתַי
  choice: मेरी पुत्रियों
  rationale: मूल शब्द स्त्रीलिंग बहुवचन है और ‘पुत्रों’ के साथ स्पष्ट समानांतर बनाता है।
- source_word: מִקְצֵה הָאָרֶץ
  choice: पृथ्वी के छोर से
  rationale: इब्रानी में ‘छोर’ एकवचन है। हिन्दी का यह रूप मूल की संख्या और दूरस्थ सीमा की छवि दोनों बनाए रखता है।
theological_decisions:
- issue: उत्तर और दक्षिण को दी गई आज्ञाओं का संदर्भ
  choice: उत्तर और दक्षिण मानवीकृत दिशाएँ/प्रदेश हैं, जिन्हें परमेश्वर अपने बिखरे हुए लोगों को छोड़ने और वापस लाने की आज्ञा देता है।
  alternative: इन्हें निर्वासन और पुनःएकत्रीकरण से असंबद्ध, केवल रूपकात्मक ब्रह्मांडीय शक्तियाँ समझना।
  rationale: निकटवर्ती प्रसंग इस्राएल की पुनर्स्थापना और एकत्रीकरण का है। ‘मेरे पुत्रों’ और ‘मेरी पुत्रियों’ से उन लोगों की पहचान स्पष्ट होती है जिन्हें लाया जाना है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पुत्रों’ और ‘पुत्रियों’ का युग्म मूल इब्रानी की लिंग-विशिष्ट समानांतरता बनाए रखता है। दिशाओं के मानवीकरण को स्पष्ट करने के लिए सीधे संबोधन और एकवचन आज्ञाओं का प्रयोग किया गया है।
