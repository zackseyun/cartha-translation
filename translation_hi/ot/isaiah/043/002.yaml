id: ISA.43.2
reference: Isaiah 43:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי תַעֲבֹ֤ר בַּ/מַּ֨יִם֙ אִתְּ/ךָ אָ֔נִי וּ/בַ/נְּהָר֖וֹת לֹ֣א יִשְׁטְפ֑וּ/ךָ כִּֽי תֵלֵ֤ךְ בְּמוֹ אֵשׁ֙ לֹ֣א תִכָּוֶ֔ה וְ/לֶהָבָ֖ה לֹ֥א תִבְעַר בָּֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/002.yaml
  text: When you pass through the waters[a], I am with you; and through the rivers, they will not sweep over you. When you walk through fire, you will not be scorched[b], and the flame will not burn you.
translation:
  language: hi
  text: जब तू जल में से होकर जाए, मैं तेरे साथ हूँ; और जब नदियों में से होकर जाए, वे तुझे बहा न ले जाएँगी[a]। जब तू आग के बीच चले, तू झुलसेगा नहीं[b], और लपट तुझे जलाएगी नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे तुझ पर उमड़ न पड़ेंगी” अथवा “तुझे डुबो न देंगी।” इब्रानी क्रिया बाढ़ की तरह चढ़ आने, बहा ले जाने या अभिभूत कर देने का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “तू जलेगा नहीं।” यहाँ की इब्रानी क्रिया झुलसने या जलने का अर्थ दे सकती है; अगले खंड में लपट के ‘जलाने’ के लिए दूसरी क्रिया आई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: जब
  rationale: यहाँ כִּי समानांतर परिस्थितियों का समयसूचक परिचय देता है। ‘जब’ इस आश्वासन को स्वाभाविक रूप से व्यक्त करता है और इसे केवल काल्पनिक संभावना नहीं बनाता।
- source_word: תַעֲבֹר בַּמַּיִם
  choice: तू जल में से होकर जाए
  rationale: עבר का अर्थ पार होना या होकर जाना है। ‘जल में से होकर जाए’ गति और संकट के ठोस काव्यात्मक चित्र, दोनों को बनाए रखता है।
- source_word: אִתְּךָ אָ֔נִי
  choice: मैं तेरे साथ हूँ
  rationale: यह वर्तमान और बलयुक्त ईश्वरीय आश्वासन का स्वाभाविक हिन्दी रूप है; ‘हूँ’ मूल के ‘मैं’ कथन को भविष्यकाल में नहीं बदलता।
- source_word: וּבַנְּהָרוֹת
  choice: और जब नदियों में से होकर जाए
  rationale: मूल में क्रिया पहले खंड से समझी जाती है। हिन्दी में उसे दोहराने से समानांतरता स्पष्ट और स्वाभाविक रहती है। נְהָרוֹת को उसके सामान्य अर्थ ‘नदियाँ’ में रखा गया है।
- source_word: לֹא יִשְׁטְפוּךָ
  choice: वे तुझे बहा न ले जाएँगी
  rationale: שטף बाढ़ की तरह चढ़ आने, बहा ले जाने या अभिभूत करने का भाव रखता है। यह चयन ठोस जल-चित्र को बनाए रखते हुए सहज हिन्दी देता है।
- source_word: תֵלֵךְ בְּמוֹ אֵשׁ
  choice: तू आग के बीच चले
  rationale: הלך को ‘चले’ और בְּמוֹ אֵשׁ को ‘आग के बीच’ कहना आग के भीतर से गुजरने की काव्यात्मक छवि को स्पष्ट रखता है।
- source_word: לֹא תִכָּוֶה
  choice: तू झुलसेगा नहीं
  rationale: כוה का निफ़अल रूप झुलसने या जलने को बताता है। ‘झुलसेगा’ अगले खंड के ‘जलाएगी’ से भेद बनाए रखता है।
- source_word: וְלֶהָבָה
  choice: और लपट
  rationale: לֶהָבָה का सीधा और सजीव हिन्दी समतुल्य ‘लपट’ है। हिन्दी में यहाँ निश्चितता व्यक्त करने के लिए अलग उपपद आवश्यक नहीं है।
- source_word: לֹא תִבְעַר בָּךְ
  choice: तुझे जलाएगी नहीं
  rationale: בער עם ב व्यक्ति पर आग के जलने या उसे जलाने का भाव देता है। ‘तुझे जलाएगी नहीं’ स्पष्ट और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: जल और आग के चित्रों में प्रतिज्ञा का स्वरूप
  choice: ठोस काव्यात्मक चित्रों में परमेश्वर की उपस्थिति और संकट के बीच उसकी रक्षक देखभाल का आश्वासन
  alternative: इसे केवल आत्मिक परीक्षाओं का रूपक मानना, या विश्वासियों को कभी कोई शारीरिक हानि न होने की सार्वभौमिक गारंटी मानना
  rationale: अनुवाद जल, नदियों, आग और लपट की ठोस भाषा को बनाए रखता है। वह न तो इन चित्रों को केवल रूपक तक सीमित करता है, न पद से आगे बढ़कर हर प्रकार की पीड़ा से पूर्ण छूट की व्याख्या जोड़ता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक मानक हिन्दी। परमेश्वर के सीधे संबोधन में एकवचन ‘तू/तेरे/तुझे’ रखा गया है, क्योंकि इब्रानी में संबोधन एकवचन और निकट है। वाक्य-विन्यास को हिन्दी में सहज बनाने के लिए दूसरे जल-खंड में निहित क्रिया दोहराई गई है।
