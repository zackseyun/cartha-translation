  text: אַֽל תִּזְכְּר֖וּ רִֽאשֹׁנ֑וֹת וְ/קַדְמֹנִיּ֖וֹת אַל תִּתְבֹּנָֽנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/018.yaml
  text: Do not remember the former things[a], and do not consider the things of old.
translation:
  language: hi
  text: 'बीती हुई बातों को याद मत करो,[a]

    और प्राचीन बातों पर ध्यान मत दो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पहली बातों को याद मत करो, और बहुत पुरानी बातों पर मन मत लगाओ।”
    reason: רִאשֹׁנוֹת का अर्थ ‘पहली बातें’ भी हो सकता है, और תִּתְבֹּנָנוּ में ध्यानपूर्वक मन लगाने या विचार करने का भाव है।
lexical_decisions:
- source_word: אַל תִּזְכְּרוּ
  choice: याद मत करो
  rationale: निषेधवाचक אַל के साथ क्रिया זכר का सीधा, स्वाभाविक और आज्ञार्थक हिन्दी रूप।
- source_word: רִאשֹׁנוֹת
  choice: बीती हुई बातें
  rationale: यह स्त्रीलिंग बहुवचन विशेषण संज्ञा की तरह प्रयुक्त होकर पहले की या पूर्वकालीन बातों/घटनाओं को सूचित करता है; यह चयन अगले पद की ‘नई बात’ के साथ विरोध भी बनाए रखता है।
- source_word: וְ
  choice: और
  rationale: दो समानांतर निषेधों को जोड़ने वाले सामान्य समुच्चयबोधक का सीधा हिन्दी प्रतिरूप।
- source_word: קַדְמֹנִיּוֹת
  choice: प्राचीन बातें
  rationale: बहुत पहले की बातों को सूचित करता है और पहले चरण के निकटार्थी पद से काव्यात्मक समानांतरता रखते हुए उसका भेद भी बचाता है।
- source_word: אַל תִּתְבֹּנָנוּ
  choice: ध्यान मत दो
  rationale: בין के आत्मवाचक/चिंतनशील रूप में किसी बात पर मन लगाकर विचार करने या ध्यान केंद्रित करने का भाव है; ‘ध्यान मत दो’ सहज हिन्दी में मानसिक एकाग्रता को व्यक्त करता है।
