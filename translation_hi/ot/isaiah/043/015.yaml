  yaml_path: translation/ot/isaiah/043/015.yaml
  text: I am Yahweh[a], your Holy One, the Creator of Israel, your King.
translation:
  language: hi
  text: मैं याहवे, तुम्हारा पवित्र परमेश्वर, इस्राएल का सृष्टिकर्ता, तुम्हारा राजा हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲנִי
  choice: मैं ... हूँ
  rationale: स्वतंत्र सर्वनाम में बल है; हिन्दी की स्वाभाविक नामवाचक संरचना ‘मैं ... हूँ’ आत्म-परिचय के इस बल को बनाए रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: קְדוֹשְׁכֶם
  choice: तुम्हारा पवित्र जन
  rationale: प्रत्यय सहित पद का अर्थ ‘तुम्हारा पवित्र’ अथवा ‘तुम्हारा पवित्र जन’ है और यहाँ यह परमेश्वर की उपाधि है। ‘पवित्र जन’ मूल की व्यक्तिवाचक उपाधि को बिना किसी अतिरिक्त ईश्वरीय पदवी जोड़े व्यक्त करता है।
- source_word: בּוֹרֵא יִשְׂרָאֵל
  choice: इस्राएल का सृष्टिकर्ता
  rationale: कर्तृवाचक कृदन्त परमेश्वर की विशिष्ट भूमिका अथवा उपाधि बताता है; ‘सृष्टिकर्ता’ उसके शीर्षकीय बल को संक्षेप और स्वाभाविक ढंग से रखता है।
- source_word: מַלְכְּכֶם
  choice: तुम्हारा राजा
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय सहित संज्ञा का सीधा अर्थ रखा गया है; यह इस्राएल के साथ परमेश्वर के राजकीय संबंध को व्यक्त करती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वतापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: קְדוֹשְׁכֶם को ईश्वरीय उपाधि के रूप में व्यक्त करना
  choice: तुम्हारा पवित्र जन
  alternative: तुम्हारा पवित्र परमेश्वर; तुम्हारा पवित्र
  rationale: ‘पवित्र परमेश्वर’ संदर्भानुकूल है, पर ‘परमेश्वर’ मूल पद में नहीं है; केवल ‘तुम्हारा पवित्र’ आधुनिक हिन्दी में असहज है। ‘पवित्र जन’ मूल की उपाधिमूलक और व्यक्तिवाचक प्रकृति को अधिक निकटता से बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गंभीर और काव्यात्मक नामावली रखी गई है। ‘तुम्हारा’ का एकवचन रूप सामूहिक इस्राएल को संबोधन के अनुरूप है; हिन्दी में यही स्वाभाविक है, जबकि इब्रानी प्रत्यय व्याकरणतः बहुवचन है।
