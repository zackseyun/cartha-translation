id: ISA.43.1
reference: Isaiah 43:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֞ה כֹּֽה אָמַ֤ר יְהוָה֙ בֹּרַאֲ/ךָ֣ יַעֲקֹ֔ב וְ/יֹצֶרְ/ךָ֖ יִשְׂרָאֵ֑ל אַל תִּירָא֙ כִּ֣י גְאַלְתִּ֔י/ךָ קָרָ֥אתִי בְ/שִׁמְ/ךָ֖ לִ/י אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/001.yaml
  text: 'But now[a], thus says Yahweh, he who created you, Jacob, and he who formed you, Israel: Do not fear, for I have redeemed you; I have called you by name; you are mine.'
translation:
  language: hi
  text: 'पर अब याहवे यों कहता है—जिसने तुझे रचा है, हे याकूब, और जिसने तुझे गढ़ा है, हे इस्राएल: “मत डर, क्योंकि मैंने तुझे छुड़ाया है; मैंने तुझे नाम से पुकारा है[a]; तू मेरा है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने तुझे नाम लेकर पुकारा है।”
    reason: कָרָאתִי בְשִׁמְךָ के लिए हिन्दी का एक स्वाभाविक वैकल्पिक रूप; मुख्य पाठ का “नाम से” इब्रानी मुहावरे के निकट है।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בֹּרַאֲךָ
  choice: जिसने तेरी सृष्टि की
  rationale: ברא की विशिष्ट सृजनात्मक शक्ति को बनाए रखता है और अगले क्रियापद יצר से भेद करता है।
- source_word: וְיֹצֶרְךָ
  choice: और तुझे गढ़ा
  rationale: יצר में निहित आकार देने या कारीगर की तरह गढ़ने की छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  choice: याकूब ... इस्राएल
  rationale: दोनों वाचा-संबंधी नामों को प्रचलित हिन्दी रूप में रखा गया है; वे एक ही प्रजा को उसके पितृपुरुष और राष्ट्रीय नामों से संबोधित करते हैं।
- source_word: אַל תִּירָא
  choice: मत डर
  rationale: एकवचन निषेध का सीधा, संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: גְאַלְתִּיךָ
  choice: मैंने तुझे छुड़ा लिया है
  rationale: גאל के उद्धार, निकट-संबंधी के दायित्व और अपने अधिकार में वापस लेने के अर्थों को सहज हिन्दी में यथासंभव खुला रखता है।
- source_word: קָרָאתִי בְשִׁמְךָ
  choice: मैंने तुझे नाम लेकर पुकारा है
  rationale: व्यक्तिगत और विशिष्ट पुकार का भाव स्वाभाविक हिन्दी में व्यक्त होता है; अधिक शाब्दिक विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: לִי אָתָּה
  choice: तू मेरा है
  rationale: इब्रानी के संक्षिप्त, क्रियारहित वाक्य और उसके वाचा-संबंधी अधिकार के दावे को ज्यों का त्यों तीखा और स्पष्ट रखता है।
- source_word: וְעַתָּה כֹּה אָמַר
  choice: पर अब ... यों कहता है
  rationale: संदर्भ में आए मोड़ को ‘पर अब’ और भविष्यद्वाणी की औपचारिक उद्घोषणा को ‘यों कहता है’ से व्यक्त किया गया है।
theological_decisions:
- issue: גאל का वाचा-संबंधी और उद्धारात्मक अर्थ
  choice: मैंने तुझे छुड़ा लिया है
  alternative: मैंने तेरा छुटकारा किया है / मैंने तुझे वापस ले लिया है
  rationale: चुना हुआ रूप दैवी उद्धार और अपने अधिकार में लेने, दोनों की संभावना बनाए रखता है और छुटकारे की विधि को मूल पाठ से अधिक संकीर्ण नहीं करता।
- issue: לִי אָתָּה में स्वामित्व का वाचा-संबंधी दावा
  choice: तू मेरा है
  alternative: तू मुझसे संबंध रखता है
  rationale: मूल की संक्षिप्तता तथा चुनाव, संबंध, अधिकार और सुरक्षा के बीच मौजूद धर्मवैज्ञानिक तनाव को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। याकूब/इस्राएल को सामूहिक व्यक्ति के रूप में एकवचन ‘तू/तेरा/तुझे’ से संबोधित करके इब्रानी की व्याकरणिक एकवचनता और निकटता बनाए रखी गई है। समानांतर क्रियाओं ברא और יצר को क्रमशः ‘सृष्टि की’ और ‘गढ़ा’ कहकर अलग रखा गया है।
