id: ISA.43.5
reference: Isaiah 43:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַל תִּירָ֖א כִּ֣י אִתְּ/ךָ אָ֑נִי מִ/מִּזְרָח֙ אָבִ֣יא זַרְעֶ֔/ךָ וּ/מִֽ/מַּעֲרָ֖ב אֲקַבְּצֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/005.yaml
  text: Do not fear[a], for I am with you; from the east I will bring your offspring[b], and from the west I will gather you.
translation:
  language: hi
  text: भय मत कर, क्योंकि मैं तेरे साथ हूँ; पूर्व से मैं तेरी संतान[a] को ले आऊँगा, और पश्चिम से तुझे इकट्ठा करूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘संतान’ सामूहिक एकवचन है; इसका अर्थ ‘वंशज’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘तुझे’ एकवचन है और याकूब/इस्राएल को सामूहिक रूप से संबोधित करता है।
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָא
  choice: भय मत कर
  rationale: निषेधसूचक אַל और ירא के द्वितीय पुरुष एकवचन रूप का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी अनुवाद; इससे एकवचन संबोधन भी बना रहता है।
- source_word: כִּי אִתְּךָ אָנִי
  choice: क्योंकि मैं तेरे साथ हूँ
  rationale: כִּי यहाँ निषेध का कारण बताता है, और इब्रानी वाक्य परमेश्वर की उपस्थिति पर बल देता है।
- source_word: מִמִּזְרָח
  choice: पूर्व से
  rationale: मूल शब्द का भौगोलिक अर्थ ‘पूर्व’ है; ‘सूर्योदय की ओर से’ अनावश्यक रूप से शाब्दिक होता।
- source_word: אָבִיא
  choice: ले आऊँगा
  rationale: בוא के हिफ़ील रूप का स्वाभाविक सकर्मक अर्थ ‘ले आना’ है। ‘वापस ले आऊँगा’ पुनरागमन का ऐसा भाव जोड़ता जो क्रिया में स्वयं स्पष्ट नहीं है।
- source_word: זַרְעֶךָ
  choice: तेरी संतान
  rationale: זֶרַע यहाँ सामूहिक एकवचन में वंशजों को दर्शाता है। ‘संतान’ हिन्दी में इस सामूहिकता को स्वाभाविक रूप से बनाए रखता है।
- source_word: וּמִמַּעֲרָב
  choice: और पश्चिम से
  rationale: पूर्व के समानांतर भौगोलिक दिशा का स्वाभाविक हिन्दी रूप।
- source_word: אֲקַבְּצֶךָ
  choice: तुझे इकट्ठा करूँगा
  rationale: קבץ के पिएल रूप में बिखरे हुओं को एकत्र करने का भाव है। एकवचन कर्म-सर्वनाम को बनाए रखा गया है।
theological_decisions:
- issue: द्वितीय पुरुष एकवचन सर्वनामों का संदर्भ
  choice: ‘तेरे’ और ‘तुझे’ के द्वारा एकवचन संबोधन बनाए रखा गया, जबकि उसका सामूहिक संदर्भ पादटिप्पणी में स्पष्ट किया गया।
  alternative: मुख्य पाठ में ‘तुम लोगों’, ‘तुम्हारे वंशजों’ या ‘तेरे लोगों’ जैसे बहुवचन अथवा व्याख्यात्मक रूप देना।
  rationale: मूल इब्रानी याकूब/इस्राएल को एक सामूहिक व्यक्ति के रूप में एकवचन में संबोधित करता है। मुख्य पाठ में इसे बनाए रखने से भविष्यवाणी की शैली और वाचिक तनाव सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण भविष्यवाणीपरक हिन्दी। ‘भय मत कर’ और एकवचन ‘तेरे/तुझे’ मूल की सीधी संबोधन-शैली को रखते हैं; ‘संतान’ साधारण पाठक के लिए स्वाभाविक है और सामूहिक एकवचन भी सुरक्षित रखता है।
