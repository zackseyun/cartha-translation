  text: וַ/אֲחַלֵּ֖ל שָׂ֣רֵי קֹ֑דֶשׁ וְ/אֶתְּנָ֤ה לַ/חֵ֨רֶם֙ יַעֲקֹ֔ב וְ/יִשְׂרָאֵ֖ל לְ/גִדּוּפִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/028.yaml
  text: So I profaned the princes of the sanctuary[a], and I gave Jacob over to destruction, and Israel to reviling.
translation:
  language: hi
  text: इसलिए मैंने पवित्रस्थान के प्रधानों को अपवित्र किया; मैंने याकूब को विनाश के हवाले[a] और इस्राएल को निन्दा के हवाले कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हेरम के अधीन,” अर्थात “विनाश के लिए समर्पित।” इब्रानी חֵרֶם उस वस्तु या व्यक्ति को सूचित कर सकता है जिसे ईश्वरीय न्याय में विनाश के लिए अलग कर दिया गया हो।
    reason: חֵרֶם के तकनीकी और अन्तरपाठीय अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וַאֲחַלֵּל
  choice: इसलिए मैंने ... अपवित्र किया
  rationale: पिएल रूप पवित्रता से वंचित करने या अपवित्र ठहराने का भाव रखता है। प्रसंग में वाव-संयुक्त रूप को बीते हुए न्याय के परिणाम के रूप में लिया गया है; ‘इसलिए’ पिछले पद से उसका निष्कर्षात्मक संबंध स्पष्ट करता है।
- source_word: שָׂרֵי קֹדֶשׁ
  choice: पवित्रस्थान के प्रधानों
  rationale: रचना पवित्र क्षेत्र या पवित्रस्थान से जुड़े अगुओं की ओर संकेत करती है। ‘याजक’ कहना सम्भावित आशय को मूल पाठ से अधिक निश्चित कर देता, इसलिए व्यापक ‘प्रधानों’ रखा गया है।
- source_word: וְאֶתְּנָה
  choice: हवाले कर दिया
  rationale: נתן का मूल अर्थ ‘देना’ है, पर न्याय के इस प्रसंग में हिन्दी का ‘हवाले कर देना’ दण्ड के लिए सौंपे जाने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: לַחֵרֶם
  choice: विनाश के हवाले
  rationale: חֵרֶם यहाँ ईश्वरीय न्याय में विनाश के लिए अलग या समर्पित कर दिए जाने को सूचित करता है। मुख्य पाठ में सहज हिन्दी रखी गई है और ‘बहिष्कार/विनाश के लिए अर्पित’ का तकनीकी विकल्प टिप्पणी में सुरक्षित है।
- source_word: יַעֲקֹב וְיִשְׂרָאֵל
  choice: याकूब ... और इस्राएल
  rationale: दोनों नाम समानांतर काव्यात्मक पदों में वाचा की प्रजा को सूचित करते हैं; मानक हिन्दी रूप बनाए रखे गए हैं।
- source_word: לְגִדּוּפִים
  choice: निन्दा के हवाले
  rationale: גדופים तिरस्कारपूर्ण वचनों, गालियों या निन्दाओं का बोध कराता है। ‘निन्दा के हवाले’ सार्वजनिक अपमान का भाव गरिमापूर्ण और स्वाभाविक हिन्दी में देता है।
theological_decisions:
- issue: חֵרֶם में ईश्वरीय न्याय की तीव्रता
  choice: याकूब को विनाश के हवाले
  alternative: याकूब को बहिष्कार के अधीन / विनाश के लिए अर्पित कर दिया
  rationale: अनुवाद न्याय की कठोरता को नरम नहीं करता, पर किसी बाद की सैद्धान्तिक श्रेणी को भी आरोपित नहीं करता। तकनीकी अर्थ टिप्पणी में दिया गया है।
- issue: שָׂרֵי קֹדֶשׁ का अभिप्राय
  choice: पवित्रस्थान के प्रधान
  alternative: पवित्र प्रधान / याजक
  rationale: मूल शब्द पवित्र क्षेत्र से जुड़े अगुओं की ओर संकेत करते हैं, पर उन्हें स्पष्टतः ‘याजक’ नहीं कहते। इस कारण अनुवाद उस सम्भावना को खुला रखता है।
- issue: क्रियाओं का काल
  choice: बीते हुए न्याय के रूप में ‘मैंने ... किया/कर दिया’
  alternative: भविष्यसूचक अर्थ में ‘मैं ... करूँगा’
  rationale: निकटवर्ती प्रसंग और वाव-संयुक्त क्रियारूप न्याय को सम्पन्न घटना या निश्चित परिणाम की तरह प्रस्तुत करते हैं; हिन्दी भूतकाल इसी प्रचलित व्याकरणिक समझ को व्यक्त करता है, यद्यपि कथन का भविष्यसूचक आयाम प्रसंग में निहित रह सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर वाक्य-विन्यास को स्वाभाविक हिन्दी के लिए एक संयुक्त संरचना में व्यक्त किया गया है। टिप्पणी-चिह्न उसी शब्द-समूह के बाद रखा गया है जिससे टिप्पणी वास्तव में सम्बन्धित है।
