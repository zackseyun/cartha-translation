  text: אַתֶּ֤ם עֵדַ/י֙ נְאֻם יְהוָ֔ה וְ/עַבְדִּ֖/י אֲשֶׁ֣ר בָּחָ֑רְתִּי לְמַ֣עַן תֵּ֠דְעוּ וְ/תַאֲמִ֨ינוּ לִ֤/י וְ/תָבִ֨ינוּ֙ כִּֽי אֲנִ֣י ה֔וּא לְ/פָנַ/י֙ לֹא נ֣וֹצַר אֵ֔ל וְ/אַחֲרַ֖/י לֹ֥א יִהְיֶֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/010.yaml
  text: You are my witnesses[a], declares Yahweh, and my servant whom I have chosen, so that you may know and believe in me and understand that I am he. Before me no god was formed[c][b], and after me there will be none.
translation:
  language: hi
  text: “तुम मेरे गवाह हो,” यहोवा की यह घोषणा है, “और मेरे सेवक भी हो, जिसे मैंने चुना है, ताकि तुम जानो, मुझ पर विश्वास करो[a], और समझो कि मैं वही हूँ[b]। मुझसे पहले कोई देवता नहीं रचा गया, और मेरे बाद कोई नहीं होगा[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “मेरा विश्वास करो” या “मुझ पर भरोसा रखो” भी हो सकता है। इब्रानी में परमेश्वर को विश्वास या भरोसे का लक्ष्य मानने वाला भाव है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप में: “कि मैं वह हूँ।” यह यशायाह में दिव्य आत्म-पहचान की एक संक्षिप्त अभिव्यक्ति है।'
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी में वाक्य संक्षिप्त है: “और मेरे बाद नहीं होगा।” प्रसंग से आशय है, “कोई देवता नहीं होगा” या “कोई नहीं होगा।”'
    reason: ellipsis
lexical_decisions:
- source_word: עֵדַי
  choice: मेरे गवाह
  rationale: बहुवचन संज्ञा और प्रथम पुरुष एकवचन प्रत्यय को सीधे व्यक्त करता है; सामूहिक इस्राएल को अनेक गवाहों के रूप में संबोधित किया गया है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह घोषणा है
  rationale: भविष्यद्वाणी की गंभीर उद्घोषणा को स्वाभाविक आधुनिक हिन्दी में रखता है और व्यक्तिगत दिव्य नाम को ‘यहोवा’ के रूप में सुरक्षित करता है।
- source_word: וְעַבְדִּי
  choice: और मेरे सेवक भी
  rationale: एकवचन ‘सेवक’ को बनाए रखता है; ‘भी’ हिन्दी में इसे पहले बहुवचन संबोधन के साथ समानाधिकरण के रूप में स्पष्ट करता है, बिना उसके सामूहिक अथवा व्यक्तिगत संदर्भ को पाठ में निर्णायक रूप से सीमित किए।
- source_word: אֲשֶׁר בָּחָרְתִּי
  choice: जिसे मैंने चुना है
  rationale: पूर्व चयन और उसके वर्तमान बने हुए परिणाम, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: मूल के प्रयोजनसूचक अर्थ को सहज और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: תֵּדְעוּ
  choice: तुम जानो
  rationale: לְמַעַן के बाद उद्देश्य को दर्शाता है और जानना–विश्वास करना–समझना की त्रयी सुरक्षित रखता है।
- source_word: וְתַאֲמִינוּ לִי
  choice: मुझ पर विश्वास करो
  rationale: हिफ़ील אמן के साथ לִי का सम्बन्धपरक विश्वास/भरोसे का भाव आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त होता है; सम्भव वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וְתָבִינוּ
  choice: और समझो
  rationale: मूल की तीसरी समानान्तर क्रिया और उसकी बोधात्मक प्रगति को बनाए रखता है।
- source_word: כִּי אֲנִי הוּא
  choice: कि मैं वही हूँ
  rationale: यशायाह में प्रयुक्त संक्षिप्त दिव्य आत्म-पहचान को स्वाभाविक हिन्दी में सुरक्षित रखता है, बिना इसे केवल ‘मैं हूँ’ करके अधिक अर्थ आरोपित किए।
- source_word: לֹא נוֹצַר אֵל
  choice: कोई ईश्वर नहीं रचा गया
  rationale: יצר के निष्क्रिय रूप और אֵל के सामान्य देवता-वाचक अर्थ को बनाए रखता है; वाक्य मूर्तियों के निर्माण से अधिक व्यापक रूप में किसी देवता के अस्तित्व में लाए जाने का निषेध करता है।
- source_word: וְאַחֲרַי לֹא יִהְיֶה
  choice: और मेरे बाद कोई नहीं होगा
  rationale: मूल की संक्षिप्त, अध्याहृत रचना को हिन्दी में बनाए रखता है; ‘कोई ईश्वर’ प्रसंग से समझा जाता है।
theological_decisions:
- issue: ‘मेरे सेवक’ का संदर्भ
  choice: एकवचन ‘सेवक’ को ज्यों का त्यों रखते हुए सामूहिक इस्राएल/याकूब के तात्कालिक संदर्भ को खुला रखना
  alternative: किसी व्यक्तिगत सेवक या भविष्यद्वक्ता-प्रतिनिधि के रूप में स्पष्ट करना
  rationale: निकटवर्ती संदर्भ में संबोधन बहुवचन है, पर मूल में ‘सेवक’ एकवचन है। अनुवाद दोनों विशेषताओं को बनाए रखता है और किसी संकीर्ण मसीही या केवल व्यक्तिगत पहचान को आरोपित नहीं करता।
- issue: אֲנִי הוּא की दिव्य आत्म-पहचान
  choice: ‘मैं वही हूँ’
  alternative: ‘मैं हूँ’ अथवा ‘मैं ही वह हूँ’
  rationale: यह रूप मूल की संक्षिप्त और धर्मवैज्ञानिक रूप से भारयुक्त अभिव्यक्ति को सुरक्षित रखता है, पर बाद की धर्मवैज्ञानिक धारणाओं को पाठ में अधिक स्पष्ट रूप से नहीं जोड़ता।
- issue: ‘कोई ईश्वर नहीं रचा गया’ का आशय
  choice: मूल की निष्क्रिय भाषा को सीधे बनाए रखना
  alternative: ‘मुझसे पहले कोई देवता अस्तित्व में नहीं आया’
  rationale: प्रत्यक्ष अनुवाद सृष्टिकर्ता के रचे जाने की दार्शनिक समस्या को समझाकर समाप्त नहीं करता, बल्कि इस्राएल के परमेश्वर की अद्वितीयता पर मूल के विवादात्मक कथन को उसी तनाव सहित रखता है।
