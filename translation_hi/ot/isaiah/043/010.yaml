  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली अपनाई गई है। ‘यहोवा’ व्यक्तिगत दिव्य नाम को दर्शाता है। उद्धरण-रचना से नְאֻם־सूत्र के बाद परमेश्वर की वाणी स्पष्ट होती है। ‘ईश्वर’ यहाँ אֵל का सामान्य देवता-वाचक प्रयोग है; ‘परमेश्वर’ चुनने से सच्चे परमेश्वर के नाम या पदवी के साथ अनावश्यक भ्रम हो सकता था।
