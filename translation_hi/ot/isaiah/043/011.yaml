  text: אָנֹכִ֥י אָנֹכִ֖י יְהוָ֑ה וְ/אֵ֥ין מִ/בַּלְעָדַ֖/י מוֹשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/011.yaml
  text: I[a], I am Yahweh, and besides me there is no savior.
translation:
  language: hi
  text: मैं—मैं ही याहवे हूँ, और मेरे सिवा[a] कोई उद्धारकर्ता नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझसे अलग कोई उद्धारकर्ता नहीं है।”
    reason: מִבַּלְעָדַי का एक समानार्थी और संभव अनुवाद सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: אָנֹכִי אָנֹכִי
  choice: मैं—मैं ही
  rationale: स्वतंत्र सर्वनाम की पुनरावृत्ति प्रबल आत्म-बलाघात व्यक्त करती है। ‘मैं—मैं ही’ हिंदी में उसकी पुनरावृत्ति और बल दोनों को स्वाभाविक ढंग से बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम टेट्राग्रामटन है। ‘याहवे’ उसका सीधा देवनागरी लिप्यंतरण है; इसे किसी उपाधि से नहीं बदला गया है।
- source_word: וְאֵין
  choice: और ... कोई ... नहीं है
  rationale: אֵין अस्तित्व का निषेध व्यक्त करता है। ‘कोई ... नहीं है’ आधुनिक हिंदी में इसका स्वाभाविक और सटीक रूप है।
- source_word: מִבַּלְעָדַי
  choice: मेरे सिवा
  rationale: यह पदबंध ‘मेरे अतिरिक्त/मुझसे अलग’ का अर्थ देता है। ‘मेरे सिवा’ संक्षिप्त, सहज और दावे की अनन्यता को स्पष्ट रखता है।
- source_word: מוֹשִׁיעַ
  choice: उद्धारकर्ता
  rationale: ישׁע का हिफ़ील कृदंत बचाने या छुड़ाने वाले व्यक्ति को दर्शाता है। ‘उद्धारकर्ता’ व्यापक अर्थ और एकवचन संज्ञात्मक प्रयोग दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ नाम को उपाधि में बदले बिना सुरक्षित रखता है और ‘यहोवा’ की अपेक्षा YHWH के स्वीकृत पुनर्निर्मित उच्चारण के निकट है।
- issue: उद्धारकर्ता की अनन्यता
  choice: मेरे सिवा कोई उद्धारकर्ता नहीं है
  alternative: मुझसे अलग कोई उद्धारकर्ता नहीं है
  rationale: इब्रानी कथन याहवे को एकमात्र उद्धारकर्ता घोषित करता है। मुख्य पाठ इस अनन्यता को बिना घटाए या अतिरिक्त व्याख्या जोड़े सीधे व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सर्वनाम की पुनरावृत्ति को डैश और ‘ही’ के द्वारा स्वाभाविक हिंदी बल दिया गया है; वाक्य की संक्षिप्त घोषणात्मक शक्ति बनाए रखी गई है।
