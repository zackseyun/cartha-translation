  text: כֹּֽה אָמַ֧ר יְהוָ֛ה גֹּאַלְ/כֶ֖ם קְד֣וֹשׁ יִשְׂרָאֵ֑ל לְמַעַנְ/כֶ֞ם שִׁלַּ֣חְתִּי בָבֶ֗לָ/ה וְ/הוֹרַדְתִּ֤י בָֽ/רִיחִים֙ כֻּלָּ֔/ם וְ/כַשְׂדִּ֖ים בָּ/אֳנִיּ֥וֹת רִנָּתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/014.yaml
  text: 'Thus says Yahweh[a], your Redeemer, the Holy One of Israel: For your sake I have sent to Babylon and brought them all down as fugitives, even the Chaldeans[b], in the ships of their rejoicing.'
translation:
  language: hi
  text: 'याहवे यों कहते हैं—तुम्हारा छुड़ानेवाला, इस्राएल का पवित्र:


    “तुम्हारे निमित्त मैंने बाबेल की ओर भेजा है[a]

    और उन सबको भगोड़ों के रूप में नीचे उतार दिया है[b]—

    कसदियों को भी, उनके उल्लास के जहाज़ों में[c]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने बाबेल के विरुद्ध भेजा है।” इब्रानी में शाब्दिक रूप से “बाबेल की ओर” है और क्या या किसे भेजा गया, यह नहीं बताया गया।
    reason: alternative_reading
  - marker: b
    text: “भगोड़ों” के लिए प्रयुक्त इब्रानी शब्द कठिन है। इसका अर्थ “सलाखें” या “द्वार की अड़चनें” भी हो सकता है; तब अर्थ होगा, “मैंने उन सब सलाखों को नीचे गिरा दिया है।” “सामंत” या “कुलीन” भी प्रस्तावित किया गया है, पर इसकी सम्भावना कम है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “उनके उल्लास के जहाज़ों में।” “उल्लास” का अर्थ आनंदपूर्ण जयजयकार या विजयोत्सव का घोष भी हो सकता है।
    reason: translation_clarity
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में सीधे प्रस्तुत किया गया है।
- source_word: גֹּאַלְכֶם
  choice: तुम्हारा छुड़ानेवाला
  rationale: यह चुनाव गाल क्रिया के छुड़ाने और अपना अधिकार देकर वापस लेने के भाव को साधारण आधुनिक हिन्दी में व्यक्त करता है; केवल सामान्य ‘उद्धारकर्ता’ की तुलना में क्रियात्मक संबंध अधिक स्पष्ट रहता है।
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: इस्राएल का पवित्र
  rationale: यशायाह में बार-बार आनेवाली इस विशिष्ट उपाधि की संक्षिप्तता और गंभीरता बनाए रखी गई है; मूल में न होने के कारण ‘परमेश्वर’ नहीं जोड़ा गया।
- source_word: לְמַעַנְכֶם
  choice: तुम्हारे निमित्त
  rationale: यह इस्राएल के हित में किए गए कार्य का लाभार्थक भाव स्वाभाविक और गरिमापूर्ण हिन्दी में रखता है।
- source_word: שִׁלַּחְתִּי בָבֶלָה
  choice: मैंने बाबेल की ओर भेजा है
  rationale: दिशासूचक ה को ‘की ओर’ से व्यक्त किया गया है और भेजी गई वस्तु या शक्ति को मूल की तरह अनकहा छोड़ा गया है। ‘विरुद्ध’ सम्भावित आशय है, पर वह अधिक व्याख्यात्मक है।
- source_word: וְהוֹרַדְתִּי
  choice: नीचे उतार लाया हूँ
  rationale: हिफ़ील रूप के ‘नीचे ले आने’ के सकर्मक भाव को बनाए रखते हुए यह शारीरिक अवरोह और पराजय, दोनों सम्भावनाओं को खुला रखता है।
- source_word: בָרִיחִים
  choice: भगोड़े बनाकर
  rationale: संदर्भ में भागनेवालों का अर्थ बाबेल की पराजय और जहाज़ों में कसदियों के उल्लेख से मेल खाता है; शब्द की वास्तविक पाठगत कठिनाई को पादटिप्पणी में स्पष्ट रखा गया है।
- source_word: כֻּלָּם
  choice: उन सबको
  rationale: सामूहिकता और पूर्णता का बल सीधे रूप में सुरक्षित है।
- source_word: וְכַשְׂדִּים
  choice: कसदियों को भी
  rationale: ‘भी’ कसदियों को उसी समूचे पतन में विशेष रूप से सम्मिलित दिखाता है और वाव के प्रसंगगत बल को स्वाभाविक हिन्दी देता है।
- source_word: בָּאֳנִיּוֹת רִנָּתָם
  choice: उन जहाज़ों में जो उनकी जयजयकार से गूँजते थे
  rationale: रִנָּה के ऊँचे आनंदपूर्ण घोष को ‘जयजयकार’ से व्यक्त किया गया है। संबंधकारक पद को स्वाभाविक हिन्दी में वर्णनात्मक उपवाक्य बनाया गया है, जबकि उसका अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ यहाँ चार-अक्षरीय व्यक्तिगत नाम का प्रयोग करता है। उसका लिप्यंतरण वाचा-नाम को किसी सामान्य उपाधि में बदलने से बचाता है।
- issue: בָרִיחִים का अनिश्चित अर्थ
  choice: भगोड़े
  alternative: बेड़े या अड़चन की सलाखें; सम्भवतः सामंत
  rationale: ‘भगोड़े’ तत्काल प्रसंग में सुसंगत है, पर इब्रानी शब्द का स्वरूप ‘सलाखों’ के अर्थ से भी मेल खाता है। इसलिए अनिश्चितता को छिपाने के बजाय वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- issue: שִׁלַּחְתִּי בָבֶלָה में अनकहा कर्म
  choice: बाबेल की ओर भेजा है
  alternative: बाबेल के विरुद्ध भेजा है
  rationale: दिशासूचक रूप का सीधा अर्थ सुरक्षित रखा गया है और किसे या क्या भेजा गया, यह मूल की तरह अनकहा है। ‘विरुद्ध’ संदर्भतः सम्भव है, पर मूल में स्पष्ट रूप से उपस्थित नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘यों कहते हैं’ और ‘तुम्हारे निमित्त’ भविष्यद्वाणी की औपचारिक शैली बनाए रखते हैं, जबकि ‘छुड़ानेवाला’ सामान्य पाठक के लिए स्पष्ट है। काव्यात्मक पंक्ति-विन्यास मूल की घोषणात्मक गति और अंतिम कसदीय चित्र को उभारता है।
