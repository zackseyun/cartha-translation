base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/023.yaml
  text: You have not brought me sheep for your burnt offerings[a], nor have you honored me with your sacrifices. I have not burdened you with grain offerings, nor wearied you with frankincense.
translation:
  language: hi
  text: तू मेरे लिए अपनी होमबलियों के लिए भेड़ नहीं लाया, और न अपने बलिदानों से मेरा आदर किया। मैंने तुझ पर अन्नबलियों का बोझ नहीं डाला[a], और न लोबान से तुझे थकाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “मैंने तुझसे अन्नबलियों के द्वारा सेवा नहीं कराई।” इब्रानी अभिव्यक्ति में बोझिल सेवा कराने का भाव हो सकता है।'
    reason: हिफ़ील क्रिया הֶעֱבַדְתִּיךָ के अधिक शाब्दिक रूप और उसके प्रसंगगत भाव को दिखाने के लिए।
lexical_decisions:
- source_word: שֵׂה
  choice: भेड़
  rationale: यह शब्द भेड़-बकरी जैसे छोटे पालतू पशु को सूचित कर सकता है; इस प्रसंग में ‘भेड़’ स्वाभाविक है और ‘मेम्ना’ जैसी अनावश्यक आयु-विशिष्टता से बचता है।
- source_word: עֹלֹתֶיךָ
  choice: अपने होमबलियों
  rationale: עֹלָה उस बलि का मानक धार्मिक शब्द है जो वेदी पर पूरी तरह जलाई जाती थी; हिन्दी बाइबिलीय प्रयोग में ‘होमबलि’ संक्षिप्त और सटीक है।
- source_word: זְבָחֶיךָ
  choice: अपने बलिदानों
  rationale: זֶבַח सामान्यतः वध करके चढ़ाई गई बलि को दर्शाता है; ‘बलिदान’ आधुनिक हिन्दी में स्पष्ट धार्मिक अर्थ देता है।
- source_word: כִבַּדְתָּנִי
  choice: मेरा आदर किया
  rationale: पिएल रूप में כבד का सामान्य अर्थ ‘आदर करना’ है; यहाँ बलियों द्वारा परमेश्वर को उचित सम्मान देने की बात है।
- source_word: הֶעֱבַדְתִּיךָ
  choice: मैंने तुझ पर ... का बोझ नहीं डाला
  rationale: हिफ़ील रूप का शाब्दिक भाव ‘सेवा कराना’ है, पर समानांतर ‘तुझे थकाया’ के साथ यह बोझिल सेवा थोपने का भाव देता है।
- source_word: מִנְחָה
  choice: अन्नबलियों
  rationale: बलि-संबंधी प्रसंग में מִנְחָה प्रायः अन्न से तैयार की गई भेंट है; ‘अन्नबलि’ सामान्य ‘भेंट’ से अधिक सटीक है।
- source_word: הוֹגַעְתִּיךָ
  choice: तुझे थकाया
  rationale: हिफ़ील रूप किसी को थकाने का कारण बनने को व्यक्त करता है और पिछले उपवाक्य के साथ समानांतरता बनाए रखता है।
- source_word: לְבוֹנָה
  choice: लोबान
  rationale: यह सामान्य धूप नहीं, विशेष रूप से frankincense को दर्शाता है; उसका प्रचलित हिन्दी नाम ‘लोबान’ है।
- source_word: לִי
  choice: मेरे लिए
  rationale: पूर्वसर्ग दिशा अथवा लाभार्थी का भाव देता है; ‘मेरे लिए’ उसे हिन्दी में स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: बलि-संबंधी सेवा के विषय में परमेश्वर के कथन का आशय
  choice: परमेश्वर कहता है कि उसने इस्राएल पर अन्नबलि और लोबान की बोझिल सेवा नहीं थोपी
  alternative: परमेश्वर कहता है कि उसने ऐसी भेंटें बिल्कुल मांगी ही नहीं थीं
  rationale: ‘बोझ नहीं डाला’ और ‘तुझे थकाया नहीं’ समानांतर कथन हैं। अनुवाद इस तनाव को बनाए रखता है कि व्यवस्था में बलियां थीं, फिर भी यहाँ परमेश्वर अपनी मांगों को उत्पीड़क बोझ के रूप में प्रस्तुत नहीं करता; पद स्वयं इस संबंध की पूरी व्याख्या नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। एकवचन सम्बोधन ‘तू/तुझ’ मूल इब्रानी के एकवचन रूप को सुरक्षित रखता है। ‘होमबलि’, ‘अन्नबलि’ और ‘लोबान’ धार्मिक-सांस्कृतिक अर्थ की सटीकता बनाए रखते हैं।
