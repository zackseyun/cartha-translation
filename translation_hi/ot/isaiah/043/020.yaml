  text: תְּכַבְּדֵ֨/נִי֙ חַיַּ֣ת הַ/שָּׂדֶ֔ה תַּנִּ֖ים וּ/בְנ֣וֹת יַֽעֲנָ֑ה כִּֽי נָתַ֨תִּי בַ/מִּדְבָּ֜ר מַ֗יִם נְהָרוֹת֙ בִּֽ/ישִׁימֹ֔ן לְ/הַשְׁק֖וֹת עַמִּ֥/י בְחִירִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/020.yaml
  text: The beasts of the field will honor me[a], jackals and ostriches, because I give water in the wilderness, rivers in the wasteland, to give drink to my people[c][b], my chosen ones.
translation:
  language: hi
  text: जंगली पशु मेरा सम्मान करेंगे—सियार[a] और शुतुरमुर्ग[b]—क्योंकि मैं निर्जन प्रदेश में जल और बंजर भूमि में नदियाँ देता हूँ, ताकि अपनी प्रजा को, मेरे चुने हुए[c] को, पीने के लिए जल दूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पुराने अनुवादों में ‘अजगर’ मिलता है; यहाँ इब्रानी शब्द का अधिक संभावित अर्थ ‘सियार’ है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘शुतुरमुर्ग की बेटियाँ’; यह शुतुरमुर्गों के लिए एक इब्रानी मुहावरा है। कुछ पुराने अनुवादों में ‘उल्लू’ मिलता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘मेरे चुने हुओं को’। इब्रानी में यह एकवचन है, पर सम्भवतः पूरी प्रजा, अर्थात इस्राएल, को सामूहिक रूप से दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּכַבְּדֵנִי
  choice: मेरा सम्मान करेंगे
  rationale: पिएल रूप का अर्थ ‘सम्मान करना’ या ‘महिमा देना’ है। ‘सम्मान करेंगे’ आधुनिक हिन्दी में स्वाभाविक है और यहाँ पशुओं द्वारा परमेश्वर के कार्य को मान देने का भाव रखता है।
- source_word: חַיַּת הַשָּׂדֶה
  choice: मैदान के जंगली पशु
  rationale: यह इब्रानी पदबंध जंगली जीव-जंतुओं के लिए प्रयुक्त होता है। ‘मैदान के जंगली पशु’ मूल चित्र और सामूहिक अर्थ दोनों को स्पष्ट रखता है।
- source_word: תַּנִּים
  choice: सियार
  rationale: निर्जन प्रदेश के जीवों वाले समानांतर काव्य-संदर्भ में इसका सबसे संभावित अर्थ सियार है, न कि पौराणिक अजगर।
- source_word: בְנוֹת יַעֲנָה
  choice: शुतुरमुर्ग
  rationale: शाब्दिक रूप ‘शुतुरमुर्ग की बेटियाँ’ है, जो शुतुरमुर्गों के लिए इब्रानी मुहावरा है; हिन्दी में सामान्य जातिवाचक रूप अधिक स्वाभाविक है।
- source_word: נָתַתִּי
  choice: देता हूँ
  rationale: यद्यपि इब्रानी क्रिया पूर्ण रूप में है, भविष्यसूचक प्रसंग में यह परमेश्वर के निश्चित और सजीव कार्य को व्यक्त करती है। वर्तमानकालीन हिन्दी उस तात्कालिकता को स्वाभाविक रूप से रखती है।
- source_word: בַמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: यह शब्द उजाड़, अनबसाए भूभाग को दर्शाता है; ‘निर्जन प्रदेश’ केवल रेतीले मरुस्थल तक अर्थ को सीमित नहीं करता।
- source_word: נְהָרוֹת בִּישִׁימוֹן
  choice: बंजर भूमि में नदियाँ
  rationale: ‘बंजर भूमि’ घोर सूखे और उजाड़ स्थान का भाव देता है, जबकि ‘नदियाँ’ परमेश्वर के प्रचुर प्रबंध को बनाए रखता है।
- source_word: לְהַשְׁקוֹת
  choice: पीने के लिए जल दूँ
  rationale: प्रयोजनसूचक क्रिया का ठोस अर्थ स्पष्ट करता है और मनुष्य-वाचक कर्म ‘अपनी प्रजा’ के साथ स्वाभाविक हिन्दी बनाता है।
- source_word: עַמִּי בְחִירִי
  choice: अपनी प्रजा को, अपने चुने हुए को
  rationale: ‘प्रजा’ सामूहिक संज्ञा है और בְחִירִי व्याकरणतः एकवचन है। हिन्दी में एकवचन ‘अपने चुने हुए’ से इस सामूहिक-एकवचन संरचना को सुरक्षित रखा गया है।
theological_decisions:
- issue: इस्राएल के लिए सामूहिक एकवचन בְחִירִי
  choice: अपने चुने हुए को
  alternative: अपने चुने हुओं को / अपनी चुनी हुई प्रजा को
  rationale: मूल पाठ ‘मेरी प्रजा’ के साथ व्याकरणिक एकवचन ‘मेरे चुने हुए’ रखता है। एकवचन को बनाए रखना यशायाह की सामूहिक-व्यक्तिगत अभिव्यक्ति और उसकी वास्तविक अस्पष्टता को सुरक्षित रखता है; बहुवचन अर्थ पाठक के लिए पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। काव्यात्मक समानांतरता ‘निर्जन प्रदेश में जल / बंजर भूमि में नदियाँ’ द्वारा सुरक्षित है। विराम-चिह्नों से ‘सियार और शुतुरमुर्ग’ को जंगली पशुओं के उदाहरण के रूप में स्पष्ट किया गया है।
