source:
  edition: WLC
  text: גַּם מִ/יּוֹם֙ אֲנִ֣י ה֔וּא וְ/אֵ֥ין מִ/יָּדִ֖/י מַצִּ֑יל אֶפְעַ֖ל וּ/מִ֥י יְשִׁיבֶֽ/נָּה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/013.yaml
  text: Indeed[a], from that day on I am he, and there is none who can deliver from my hand; I act[b], and who can turn it back?
translation:
  language: hi
  text: निश्चय ही,[a] उस दिन से मैं वही हूँ; मेरे हाथ से छुड़ानेवाला कोई नहीं। मैं कार्य करता हूँ, और कौन उसे पलट सकता है?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘आज से,’ ‘प्राचीन काल से,’ या अधिक व्याख्यात्मक रूप में ‘अनादिकाल से’ भी हो सकता है। इब्रानी पदबंध संक्षिप्त है और उसके एक से अधिक कालगत अर्थ सम्भव हैं।
    reason: alternative_reading
  - marker: b
    text: या ‘कौन उसे उलट सकता है?’ इब्रानी में शाब्दिक भाव ‘उसे लौटा देना’ या ‘पलट देना’ है; ‘उसे’ परमेश्वर के कार्य की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: निश्चय ही
  rationale: यहाँ यह केवल जोड़ सूचित करने के बजाय कथन पर बल देता है; ‘निश्चय ही’ इस बल को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: מִיּוֹם
  choice: उस दिन से
  rationale: इब्रानी पदबंध संक्षिप्त और कालगत रूप से अस्पष्ट है। ‘उस दिन से’ किसी बिंदु से आगे जारी रहने का भाव देता है, जबकि अन्य सम्भव अर्थ पादटिप्पणी में सुरक्षित रखे गए हैं।
- source_word: אֲנִי הוּא
  choice: मैं वही हूँ
  rationale: यह यशायाह में परमेश्वर का गंभीर आत्म-परिचय सूत्र है। ‘मैं वही हूँ’ उसकी विशिष्ट गूँज बनाए रखता है और पाठ से परे कोई बाद की धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
- source_word: וְאֵין
  choice: कोई नहीं
  rationale: यह नकारात्मक अस्तित्ववाचक कथन को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִיָּדִי
  choice: मेरे हाथ से
  rationale: यह शक्ति, अधिकार और नियंत्रण का रूपक है; शाब्दिक बिंब हिन्दी में भी स्पष्ट और स्वाभाविक है।
- source_word: מַצִּיל
  choice: छुड़ानेवाला
  rationale: कृदन्त का अर्थ बचाने या छुड़ानेवाला है। ‘छुड़ानेवाला’ न्यायिक और उद्धार-संबंधी दोनों सम्भावित भावों को बनाए रखता है।
- source_word: אֶפְעַל
  choice: मैं कार्य करता हूँ
  rationale: פעל का अर्थ करना, कार्य करना या क्रियाशील होना है। यहाँ यह परमेश्वर की निर्णायक कार्रवाई को व्यक्त करता है।
- source_word: יְשִׁיבֶנָּה
  choice: उसे पलट सकता है
  rationale: שוב के हिफ़ील रूप का अर्थ किसी चीज़ को लौटा देना या उलट देना है। स्त्रीलिंग प्रत्यय को पूर्वोक्त निहित कार्रवाई के संदर्भ में ‘उसे’ कहा गया है।
theological_decisions:
- issue: מִיּוֹם का कालगत विस्तार
  choice: उस दिन से
  alternative: आज से; प्राचीन काल से; अनादिकाल से
  rationale: इब्रानी पदबंध अत्यंत संक्षिप्त है और उसका कालगत संकेत विवादित है। मुख्य पाठ निरंतरता का भाव रखता है, पर उससे अकेले अनादित्व का अधिक स्पष्ट दावा नहीं बनाता; अन्य अर्थ पादटिप्पणी में दिए गए हैं।
- issue: אֲנִי הוּא का आत्म-परिचय सूत्र
  choice: मैं वही हूँ
  alternative: मैं ही वह हूँ; मैं हूँ
  rationale: यह अनुवाद परमेश्वर की अद्वितीय पहचान से जुड़े सूत्र का महत्व बनाए रखता है, पर उसे किसी बाद की विशिष्ट धर्मवैज्ञानिक शब्दावली से नहीं भरता।
- issue: परमेश्वर की कार्रवाई को पलटने की असम्भवता
  choice: कौन उसे पलट सकता है?
  alternative: कौन उसे वापस फेर सकता है?
  rationale: आलंकारिक प्रश्न परमेश्वर के कार्य पर किसी अन्य सत्ता की असमर्थता व्यक्त करता है। ‘पलट’ मूल क्रिया के ठोस बिंब और परिणाम को उलटने के भाव दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। ‘मैं वही हूँ’ और ‘मेरे हाथ से’ जैसे मूल बिंब सुरक्षित रखे गए हैं। कालगत अस्पष्टता को मुख्य पाठ में अति-व्याख्यायित न करके पादटिप्पणी में स्पष्ट किया गया है।
