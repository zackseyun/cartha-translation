source:
  edition: WLC
  text: וּ/שְׁאָ֧ר מִסְפַּר קֶ֛שֶׁת גִּבּוֹרֵ֥י בְנֵֽי קֵדָ֖ר יִמְעָ֑טוּ כִּ֛י יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל דִּבֵּֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/017.yaml
  text: And the remainder of the number of the bowmen[a], the mighty men of the sons of Kedar, will be few, for Yahweh, the God of Israel[b], has spoken.
translation:
  language: hi
  text: और केदार के पुत्रों के वीर धनुर्धरों की बची हुई संख्या कम रह जाएगी,[a] क्योंकि इस्राएल के परमेश्वर याहवे ने कहा है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “थोड़ी रह जाएगी।” शाब्दिक रूप से, “धनुष”; यहाँ यह धनुर्धरों के लिए प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या, “केदार के पुत्रों के वीर धनुर्धरों की संख्या का शेष घट जाएगा।” हिब्रू संज्ञा-श्रृंखला का संबंध इस प्रकार भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁאָר מִסְפַּר
  choice: बची हुई संख्या
  rationale: यह सहज हिन्दी में शेष रह जाने वालों की संख्या का मात्रात्मक भाव व्यक्त करता है और अनावश्यक धर्मवैचारिक अर्थ से बचता है।
- source_word: קֶשֶׁת
  choice: धनुर्धरों
  rationale: शाब्दिक अर्थ ‘धनुष’ है, पर यहाँ लक्षणा द्वारा धनुष धारण करने वाले योद्धा अभिप्रेत हैं।
- source_word: גִּבּוֹרֵי
  choice: वीर
  rationale: संदर्भ में यह सामर्थी योद्धाओं को दर्शाता है; ‘वीर’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: בְנֵי קֵדָר
  choice: केदार के पुत्रों
  rationale: मूल के वंश-संबंधी मुहावरे और जातीय नाम को औपचारिक निकटता के साथ सुरक्षित रखता है।
- source_word: יִמְעָטוּ
  choice: घट जाएगी
  rationale: क्रिया का अर्थ कम होना या थोड़े रह जाना है; संख्या के साथ ‘घट जाएगी’ स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप से परमेश्वर के व्यक्तिगत वाचा-नाम को शीर्षक से बदलने के बजाय व्यक्त करता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: हिब्रू संबंधवाचक संरचना का सीधा और मानक हिन्दी रूप है।
- source_word: דִּבֵּר
  choice: ने कहा है
  rationale: पूर्ण क्रिया के भविष्यवाणी को निश्चित ठहराने वाले बल को सहज आधुनिक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को सुरक्षित रखा गया है; हिन्दी पाठकों के लिए ‘यहोवा’ अधिक परिचित लिप्यंतरण है, यद्यपि ‘याहवे’ भी संभावित उच्चारण-आधारित रूप है।
- issue: वाक्यांशों का पारस्परिक संबंध
  choice: ‘वीर’ को ‘धनुर्धरों’ का विशेषण मानकर ‘केदार के पुत्रों के वीर धनुर्धर’
  alternative: ‘केदार के पुत्रों के वीरों की धनुषधारी संख्या’ अथवा ‘केदार के पुत्रों के वीर धनुर्धरों की शेष संख्या थोड़ी रह जाएगी’
  rationale: हिब्रू संज्ञा-श्रृंखला कुछ संकुचित और व्याकरणतः तनावपूर्ण है। मुख्य पाठ सर्वाधिक स्वाभाविक सैन्य अर्थ देता है, जबकि पादटिप्पणी वैकल्पिक परिणामसूचक अभिव्यक्ति सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण भविष्यवाणी-संबंधी लहजा अपनाया गया है। मूल की संकुचित संज्ञा-श्रृंखला को पठनीय बनाया गया है, पर ‘केदार के पुत्र’ और धनुष की सैन्य छवि सुरक्षित रखी गई है।
