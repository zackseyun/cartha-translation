- source_word: מִפְּנֵי
  choice: से
  rationale: चार बार दोहराया गया यह पद भय या संकट के सामने से दूर भागने का भाव व्यक्त करता है। हिन्दी में ‘से’ इस स्थानिक और कारणात्मक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חֲרָבוֹת
  choice: तलवारों
  rationale: बहुवचन को बनाए रखते हुए सशस्त्र खतरे का सामान्य भाव व्यक्त किया गया है।
- source_word: נָדָדוּ
  choice: भाग गए हैं
  rationale: युद्ध के संकट में यह क्रिया भटकने के बजाय पलायन को दर्शाती है; पूर्ण क्रिया के साथ वर्तमान संदर्भ का संबंध भी बना रहता है।
- source_word: חֶרֶב נְטוּשָׁה
  choice: खींची हुई तलवार
  rationale: यह प्रयोग युद्ध के लिए निकालकर तैयार की गई या आगे बढ़ाई गई तलवार का चित्र देता है। ‘खींची हुई’ संक्षिप्त है, जबकि अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: קֶשֶׁת דְּרוּכָה
  choice: तना हुआ धनुष
  rationale: इससे तीर चलाने के लिए तैयार किए गए धनुष का स्वाभाविक और स्पष्ट चित्र मिलता है।
- source_word: כֹּבֶד מִלְחָמָה
  choice: युद्ध का भारी दबाव
  rationale: ‘भारीपन/वज़न’ के मूल रूपक को हिन्दी में बोधगम्य रखते हुए युद्ध की प्रचंडता और दमनकारी शक्ति व्यक्त की गई है।
