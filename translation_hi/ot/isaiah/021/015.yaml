  text: क्योंकि वे तलवारों से भाग गए हैं—म्यान से निकली हुई तलवार से[a], तने हुए धनुष से[b], और युद्ध के भारी दबाव से[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लहराई हुई तलवार।” इब्रानी विशेषण ऐसी तलवार को सूचित कर सकता है जिसे निकालकर युद्ध के लिए तैयार किया गया हो या आगे बढ़ाया गया हो।
    reason: lexical_alternative
  - marker: b
    text: या, “खींचा हुआ” या “चढ़ा हुआ धनुष।” इब्रानी में तीर चलाने के लिए तैयार धनुष का वर्णन है।
    reason: lexical_alternative
