  text: וְ/הִנֵּה זֶ֥ה בָא֙ רֶ֣כֶב אִ֔ישׁ צֶ֖מֶד פָּֽרָשִׁ֑ים וַ/יַּ֣עַן וַ/יֹּ֗אמֶר נָפְלָ֤ה נָֽפְלָה֙ בָּבֶ֔ל וְ/כָל פְּסִילֵ֥י אֱלֹהֶ֖י/הָ שִׁבַּ֥ר לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/009.yaml
  text: And look[a], here comes a chariot, a man with a pair of horsemen. And he answered and said, “Fallen, fallen is Babylon[c][b], and all the carved images of her gods he has shattered to the ground.”
translation:
  language: hi
  text: और देखो, यह आ रहा है—एक रथ, एक पुरुष और घुड़सवारों की एक जोड़ी[a]। तब उसने उत्तर देकर कहा, “गिर गया, गिर गया बाबेल! और उसके देवताओं की सभी खुदी हुई मूर्तियों[b] को उसने भूमि पर चकनाचूर कर दिया है।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध संक्षिप्त और कठिन है; इसे ‘मनुष्यों का एक रथ-दल, घुड़सवारों की एक जोड़ी’ भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसके देवताओं की सभी मूरतों’।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में ‘उसने चकनाचूर कर दिया है’ है, लेकिन कर्ता बताया नहीं गया; उसका संकेत प्रसंग से समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנֵּה זֶה בָא
  choice: और देखो, यह आ रहा है
  rationale: दृश्य की तात्कालिकता और संकेतात्मक बल को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: רֶכֶב אִישׁ צֶמֶד פָּרָשִׁים
  choice: एक रथ, एक पुरुष, घुड़सवारों की एक जोड़ी
  rationale: इब्रानी पदबंध अत्यंत संक्षिप्त और व्याकरणिक रूप से कठिन है; इसलिए उसके घटकों को बिना किसी एक व्याख्या को निर्णायक बनाए निकटता से रखा गया है।
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: तब उसने उत्तर देकर कहा
  rationale: दोनों इब्रानी क्रियाओं का भाव सुरक्षित रखते हुए हिन्दी की स्वाभाविक कथात्मक शैली अपनाई गई है।
- source_word: נָפְלָה נָפְלָה
  choice: गिर गया, गिर गया
  rationale: दोहराव की संक्षिप्तता, पूर्णता और घोषणात्मक बल को बनाए रखता है। हिन्दी में नगर बाबेल का नाम पुल्लिंग रूप में प्रचलित होने के कारण क्रिया पुल्लिंग है।
- source_word: בָּבֶל
  choice: बाबेल
  rationale: इब्रानी नाम का हिन्दी बाइबलीय रूप, जो मूल उच्चारण के निकट है।
- source_word: פְּסִילֵי אֱלֹהֶיהָ
  choice: उसके देवताओं की सभी खुदी हुई मूर्तियाँ
  rationale: פְּסִילֵי के तराशी या खोदी गई प्रतिमाओं के ठोस अर्थ को व्यक्त करता है; वैकल्पिक संक्षिप्त अर्थ ‘मूरतें’ पादटिप्पणी में है।
- source_word: שִׁבַּר לָאָרֶץ
  choice: उसने भूमि पर चकनाचूर कर दिया है
  rationale: एकवचन सक्रिय क्रिया तथा भूमि की ओर गिराकर पूर्णतः तोड़ने की तीव्रता दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: अंतिम उपवाक्य में मूर्तियों को चकनाचूर करने वाला कर्ता
  choice: ‘उसने’ कहकर इब्रानी की पुल्लिंग एकवचन सक्रिय क्रिया को रखा गया, पर कर्ता की पहचान नहीं जोड़ी गई।
  alternative: ‘उन्होंने चकनाचूर कर दिया’ अथवा कर्मवाच्य ‘चकनाचूर कर दी गईं’।
  rationale: मूल पाठ में कर्ता स्पष्ट नहीं है। एकवचन रूप को बनाए रखना और उसकी पहचान अनिर्धारित छोड़ना ईश्वरीय या मानवीय अभिकर्ता के बारे में अनावश्यक सिद्धान्तगत निष्कर्ष से बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और श्रव्य पाठ के अनुकूल रखी गई है। कठिन रथ-वर्णन को जानबूझकर पूरी तरह नहीं सुलझाया गया, ताकि मूल इब्रानी की वास्तविक अस्पष्टता बनी रहे।
