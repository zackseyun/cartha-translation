source:
  edition: WLC
  text: וַ/יִּקְרָ֖א אַרְיֵ֑ה עַל מִצְפֶּ֣ה אֲדֹנָ֗/י אָנֹכִ֞י עֹמֵ֤ד תָּמִיד֙ יוֹמָ֔ם וְ/עַל מִ֨שְׁמַרְתִּ֔/י אָנֹכִ֥י נִצָּ֖ב כָּל הַ/לֵּילֽוֹת־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/008.yaml
  text: Then he cried[a], “A lion! On the watchtower, my lord, I stand continually by day[b], and at my post I am stationed all the nights.”
translation:
  language: hi
  text: तब उसने पुकारा[a], “सिंह! हे मेरे स्वामी, मैं दिन में निरन्तर पहरे की मीनार पर खड़ा रहता हूँ, और अपनी चौकी पर हर रात[b] तैनात रहता हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में इसके बाद शाब्दिक रूप से “सिंह!” आता है। यह वाक्यांश कठिन है; कुछ लोग इसका भाव “सिंह के समान!” अर्थात पहरेदार के जोर से पुकारने की तुलना सिंह की गर्जना से समझते हैं।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “सारी रातें”; भाव “हर रात” या “रात-रात भर” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: तब उसने पुकारा
  rationale: क़ाल कथात्मक क्रिया का अर्थ ‘पुकारना’ है; ‘तब’ कथानक के क्रम को व्यक्त करता है।
- source_word: אַרְיֵה
  choice: सिंह!
  rationale: मसोरेटी पाठ में संज्ञा का सीधा अर्थ ‘सिंह’ है। वाक्यांश कठिन होने पर भी मुख्य पाठ में उसकी असामान्यता और वास्तविक संदिग्धता बनाए रखी गई है।
- source_word: עַל מִצְפֶּה
  choice: पहरे की मीनार पर
  rationale: מִצְפֶּה ऊँचे निगरानी-स्थल या पहरे की मीनार को सूचित करता है; यह हिंदी में स्पष्ट और प्रसंगानुकूल है।
- source_word: אֲדֹנָי
  choice: हे मेरे स्वामी
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित इसका अर्थ संबोधित अधिकारी के लिए ‘मेरे स्वामी’ है; यह यहाँ परमेश्वर के नाम का अनुवाद नहीं है।
- source_word: עֹמֵד תָּמִיד יוֹמָם
  choice: मैं दिन में निरन्तर … खड़ा रहता हूँ
  rationale: कृदन्त निरन्तर स्थिति और תָּמִיד लगातार बने रहने का भाव देता है; יוֹמָם का अर्थ ‘दिन में’ है।
- source_word: וְעַל מִשְׁמַרְתִּי
  choice: और अपनी चौकी पर
  rationale: מִשְׁמֶרֶת पहरे की ड्यूटी या नियत चौकी को दर्शाता है; ‘अपनी चौकी पर’ सहज हिंदी है।
- source_word: נִצָּב
  choice: तैनात रहता हूँ
  rationale: निफ़ाल कृदन्त किसी स्थान पर नियुक्त या स्थापित होने की परिणामी अवस्था व्यक्त करता है।
- source_word: כָּל הַלֵּילוֹת
  choice: हर रात
  rationale: इब्रानी बहुवचन के बार-बार होने वाले रात्रिकालीन पहरे का भाव सहज आधुनिक हिंदी में ‘हर रात’ से स्पष्ट होता है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
