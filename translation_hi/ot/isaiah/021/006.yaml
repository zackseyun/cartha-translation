id: ISA.21.6
reference: Isaiah 21:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י כֹ֥ה אָמַ֛ר אֵלַ֖/י אֲדֹנָ֑/י לֵ֚ךְ הַעֲמֵ֣ד הַֽ/מְצַפֶּ֔ה אֲשֶׁ֥ר יִרְאֶ֖ה יַגִּֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/006.yaml
  text: 'For thus the Lord said to me: “Go[a], station the watchman; let him report what he sees.”'
translation:
  language: hi
  text: 'क्योंकि प्रभु ने मुझसे यह कहा: “जा, पहरेदार को तैनात कर; वह जो कुछ देखे, उसकी सूचना दे।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अव्यय पिछले प्रसंग में कही गई बात का आधार प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כֹה אָמַר
  choice: यह कहा
  rationale: भविष्यद्वाणी के प्रचलित सूत्र का अर्थ सुरक्षित रखते हुए भूतकालीन कथात्मक प्रसंग में यह सहज हिन्दी है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यहाँ परमेश्वर की उपाधि אֲדֹנָי है, चार अक्षरों वाला विशिष्ट नाम नहीं; ‘प्रभु’ इसका स्वाभाविक और गरिमापूर्ण हिन्दी अनुवाद है।
- source_word: לֵךְ
  choice: जा
  rationale: एकवचन आज्ञार्थक रूप को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַעֲמֵד
  choice: तैनात कर
  rationale: हिफ़ील आज्ञार्थक का कारक भाव—किसी को निर्धारित स्थान पर खड़ा करना—पहरे के प्रसंग में ‘तैनात कर’ से स्पष्ट होता है।
- source_word: הַמְצַפֶּה
  choice: पहरेदार
  rationale: צפה के संज्ञार्थक कृदन्त से ऐसे व्यक्ति का बोध होता है जो निगरानी रखता है; ‘पहरेदार’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: אֲשֶׁר יִרְאֶה
  choice: वह जो कुछ देखे
  rationale: सापेक्ष वाक्यांश को अनिश्चित व्यापकता सहित स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יַגִּיד
  choice: उसकी सूचना दे
  rationale: हिफ़ील रूप का अर्थ देखी हुई बात को बताना या प्रकट करना है; आज्ञा के बाद इसका निर्देशात्मक भाव हिन्दी में इस रूप से स्पष्ट रहता है।
theological_decisions:
- issue: ईश्वरीय उपाधि אֲדֹנָי का अनुवाद
  choice: प्रभु
  alternative: मेरे प्रभु
  rationale: यद्यपि इस उपाधि का रूप ऐतिहासिक रूप से प्रथम पुरुष एकवचन प्रत्यय से जुड़ा है, यहाँ यह परमेश्वर के स्थिर संबोधन के रूप में प्रयुक्त है। ‘मेरे प्रभु’ कहने से संदर्भ में अपेक्षा से अधिक स्वामित्व-भाव उभर सकता है; ‘प्रभु’ उपाधि और יהוה नाम के बीच भेद भी बनाए रखता है।
- issue: יַגִּיד का विध्यर्थक भाव
  choice: उसकी सूचना दे
  alternative: वह उसकी सूचना देगा
  rationale: पूर्ववर्ती आज्ञाओं के बाद अपूर्ण क्रिया को निर्देशात्मक/विध्यर्थक समझना प्रसंग के अनुकूल है, पर इसे स्वतंत्र भविष्यवाणी के रूप में भी पढ़ा जा सकता है। हिन्दी में आज्ञात्मक क्रम सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘तैनात कर’ पहरे की परिस्थिति और हिफ़ील की कारकता दोनों व्यक्त करता है; वाक्य-विन्यास मूल के संक्षिप्त आदेशात्मक स्वर को बनाए रखता है।
