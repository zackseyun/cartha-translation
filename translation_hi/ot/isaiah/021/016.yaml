source:
  edition: WLC
  text: כִּי כֹ֛ה אָמַ֥ר אֲדֹנָ֖/י אֵלָ֑/י בְּ/ע֤וֹד שָׁנָה֙ כִּ/שְׁנֵ֣י שָׂכִ֔יר וְ/כָלָ֖ה כָּל כְּב֥וֹד קֵדָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/016.yaml
  text: 'For thus the Lord said to me: Within a year[a], like the years of a hired worker, all the glory of Kedar will come to an end.'
translation:
  language: hi
  text: 'क्योंकि प्रभु ने मुझसे यों कहा: “एक वर्ष के भीतर—मज़दूर के वर्षों की तरह ठीक-ठीक गिनी हुई अवधि में—केदार का सारा वैभव[a] समाप्त हो जाएगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “केदार की सारी प्रतिष्ठा” अथवा “केदार की सारी धन-संपत्ति।” इब्रानी शब्द का अर्थ गौरव, प्रतिष्ठा, वैभव या भौतिक संपन्नता हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ इसके संयोजक बल को बनाए रखता है।
- source_word: כֹה אָמַר
  choice: यों कहा है
  rationale: यह भविष्यद्वक्ताओं की प्रचलित घोषणा-शैली है। वर्तमान-सम्बद्ध पूर्ण रूप हिन्दी में घोषित वचन की स्थायी प्रासंगिकता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: मूल में ईश्वरीय उपाधि अडोनाय है, परमेश्वर का वाचा-नाम YHWH नहीं; इसलिए उपाधि का अनुवाद ‘प्रभु’ किया गया है।
- source_word: אֵלָי
  choice: मुझसे
  rationale: यह यशायाह को ईश्वरीय वचन के प्राप्तकर्ता के रूप में सूचित करता है और हिन्दी में ‘कहा’ के साथ स्वाभाविक है।
- source_word: בְּעוֹד שָׁנָה
  choice: अभी एक वर्ष और
  rationale: यह पूर्ति तक शेष एक वर्ष को दर्शाता है। यह रूप ‘एक और वर्ष’ के भाव को बनाए रखता है और अगले मुहावरे के साथ निश्चित अवधि सूचित करता है।
- source_word: כִּשְׁנֵי שָׂכִיר
  choice: मज़दूर के ठीक-ठीक गिने हुए समय के अनुसार
  rationale: शाब्दिक ‘मज़दूर के वर्षों के समान’ हिन्दी में अस्पष्ट और अस्वाभाविक होगा। यह मुहावरा मज़दूरी पर रखे व्यक्ति द्वारा सावधानी से गिनी जाने वाली निश्चित अवधि को दर्शाता है; अनुवाद उसी अर्थ और तुलना को स्पष्ट करता है।
- source_word: וְכָלָה
  choice: तब ... समाप्त हो जाएगा
  rationale: क्रिया का अर्थ पूरा हो जाना, चुक जाना या अन्त को पहुँचना है। ‘समाप्त हो जाएगा’ न्याय के परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है; ‘तब’ समय-खंड के बाद आने वाले परिणाम को स्पष्ट करता है।
- source_word: כָּל
  choice: सारा
  rationale: केदार के वैभव पर आने वाले न्याय की व्यापकता सुरक्षित रखता है।
- source_word: כְּבוֹד
  choice: वैभव
  rationale: इस शब्द में गौरव, प्रतिष्ठा, शोभा और भौतिक सम्पन्नता के अर्थ आ सकते हैं। ‘वैभव’ इस प्रसंग में शोभा और सम्पन्नता दोनों को समेटता है, जबकि अन्य सम्भावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: קֵדָר
  choice: केदार
  rationale: यह अरबी जनसमूह अथवा उससे जुड़े क्षेत्र का व्यक्तिवाचक नाम है; इसलिए इसका लिप्यंतरण किया गया है।
theological_decisions:
- issue: ईश्वरीय उपाधि אֲדֹנָי का अनुवाद
  choice: प्रभु
  alternative: यहोवा / परमेश्वर
  rationale: मूल पाठ में אֲדֹנָי उपाधि है, YHWH नहीं। इसलिए ‘प्रभु’ स्रोत के भेद को बनाए रखता है और वाचा-नाम को पाठ में आयात नहीं करता।
- issue: כְּבוֹד में निहित गौरव और धन-सम्पत्ति के अर्थ
  choice: वैभव
  alternative: महिमा / प्रतिष्ठा / धन-सम्पत्ति
  rationale: प्रसंग केदार की सामूहिक शक्ति, शोभा और सम्पन्नता के अन्त की घोषणा करता है। ‘वैभव’ अर्थ-क्षेत्र को अनावश्यक रूप से केवल धार्मिक ‘महिमा’ या केवल आर्थिक ‘धन’ तक सीमित नहीं करता; वास्तविक बहुअर्थकता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। भविष्यद्वाणी की औपचारिक घोषणा-शैली के लिए ‘यों कहा है’ रखा गया है। मज़दूर-वाला इब्रानी मुहावरा शब्दशः अस्वाभाविक बनाने के बजाय उसके निश्चित और ठीक-ठीक गिने समय के भाव के साथ प्रस्तुत किया गया है। पादटिप्पणी-चिह्न उस शब्द ‘वैभव’ पर लगाया गया है जिससे पादटिप्पणी वास्तव में सम्बन्धित है।
