  terminology: ‘प्रभु’ appropriately renders אֲדֹנָי as a title, without importing the divine name. ‘केदार’ is a suitable transliteration. ‘वैभव’ is a sound broad rendering of כָּבוֹד here; the footnote preserves relevant alternatives.
  issues:
  - severity: medium
    issue: Tense of the divine speech report
    rationale: The Hebrew אָמַר is a past reporting form in this context (‘said’). Hindi ‘ने ... कहा’ follows it more directly than the present-perfect ‘कहा है’.
  - severity: medium
    issue: Rendering of כִּשְׁנֵי שָׂכִיר
    rationale: ‘मज़दूर के ठीक-ठीक गिने हुए समय के अनुसार’ turns the Hebrew simile into an ‘according to’ construction. Retaining ‘की तरह’ better reflects the source while still expressing the idiom’s sense of a precisely counted period.
