base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/013.yaml
  text: 'An oracle concerning Arabia: In the forest in Arabia you will spend the night[c][b][a], O caravans of Dedanites.'
translation:
  language: hi
  text: 'अरब के विषय में भविष्यसूचक घोषणा:[a]


    हे ददानी कारवाँ,[c] तुम अरब के वन में[b] रात बिताओगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अरब के विषय में भारी वचन” अथवा “घोषणा।” इब्रानी מַשָּׂא भविष्यसूचक शीर्षकों में इन अर्थों में आ सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “अरब की झाड़ियों में।” इब्रानी יַעַר का सामान्य अर्थ “वन” है, पर यहाँ झाड़ीदार वनप्रदेश अभिप्रेत हो सकता है।
    reason: cultural_note
  - marker: c
    text: इब्रानी אֹרְחוֹת का शाब्दिक अर्थ “मार्ग” भी हो सकता है; यहाँ उससे उन पर चलने वाले यात्रा-दल, अर्थात कारवाँ, अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: भविष्यवाणी
  rationale: भविष्यसूचक शीर्षक में यह शब्द परमेश्वर की ओर से दी गई गंभीर घोषणा को सूचित करता है। आधुनिक हिन्दी में ‘भविष्यवाणी’ इस शीर्षकीय कार्य को स्वाभाविक ढंग से व्यक्त करती है; ‘भारी वचन’ अधिक शब्दशः विकल्प है।
- source_word: בַּעְרָב
  choice: अरब के विषय में
  rationale: מַשָּׂא के साथ उपसर्ग בְּ यहाँ घोषणा की विषयवस्तु बताता है। ‘के विरुद्ध’ प्रसंग में संभव है, पर इब्रानी व्याकरण स्वयं वैरभाव अनिवार्य नहीं करता।
- source_word: בַּיַּעַר
  choice: वन में
  rationale: יַעַר का सामान्य अर्थ वन या वनप्रदेश है। अरब के भूभाग में इससे झाड़ीदार क्षेत्र भी अभिप्रेत हो सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בַּעְרַב
  choice: अरब के
  rationale: स्वरांकित मसोराई पाठ इसे फिर स्थाननाम ‘अरब’ के रूप में पढ़ता है। शीर्षक और ददानी संदर्भ भी भौगोलिक अर्थ का समर्थन करते हैं।
- source_word: תָּלִינוּ
  choice: रात बिताओगे
  rationale: לין का अर्थ रात ठहरना या बिताना है। यह रूप संबोधित बहुवचन के लिए भविष्यकालीन/आदेशात्मक छाया रख सकता है; हिन्दी में भविष्यकाल मूल अस्पष्टता के निकट है।
- source_word: אֹרְחוֹת
  choice: कारवाँ
  rationale: शब्द का मूल अर्थ मार्ग या पथ हो सकता है, पर ददानियों के साथ संबोधन में यह उन मार्गों पर चलने वाले यात्रा-दलों के लिए लाक्षणिक रूप से प्रयुक्त है।
- source_word: דְּדָנִים
  choice: ददानी
  rationale: यह ददान से जुड़े लोगों का जातिवाचक रूप है। ‘ददानी कारवाँ’ संक्षिप्त, स्वाभाविक और मूल संबंध को स्पष्ट रखता है।
theological_decisions:
- issue: מַשָּׂא का भविष्यसूचक शीर्षक
  choice: भविष्यवाणी
  alternative: भारी वचन / घोषणा
  rationale: यह चयन कथन को केवल भविष्य बताने तक सीमित करने का जोखिम रखता है, इसलिए पादटिप्पणी में शब्द की ‘भारी वचन’ और ‘घोषणा’ वाली अर्थ-सीमा दी गई है; किसी विशिष्ट धर्मसांप्रदायिक व्याख्या को नहीं जोड़ा गया।
- issue: תָּלִינוּ की विधा
  choice: रात बिताओगे
  alternative: रात बिताओ
  rationale: इब्रानी अपूर्ण क्रिया यहाँ भविष्यवाणी अथवा निर्देश—दोनों की छाया दे सकती है। मुख्य पाठ मसोराई स्वरूप के सीधे भविष्यकालीन बोध को रखता है, जबकि आदेशात्मक संभावना को निर्णायक रूप से आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद को शीर्षक और संबोधन के रूप में दो पंक्तियों में रखा गया है। ‘अरब’ आधुनिक प्रचलित हिन्दी रूप है और ‘ददानी’ मूल जातिनाम को सुरक्षित रखता है। सभी पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद दिए गए हैं।
