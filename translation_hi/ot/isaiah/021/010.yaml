source:
  edition: WLC
  text: מְדֻשָׁתִ֖/י וּ/בֶן גָּרְנִ֑/י אֲשֶׁ֣ר שָׁמַ֗עְתִּי מֵ/אֵ֨ת יְהוָ֧ה צְבָא֛וֹת אֱלֹהֵ֥י יִשְׂרָאֵ֖ל הִגַּ֥דְתִּי לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/010.yaml
  text: O my threshed one[a], and son of my threshing floor, what I have heard from Yahweh of hosts, the God of Israel[b], I have declared to you.
translation:
  language: hi
  text: हे मेरे दाँवे गए लोगो[a], और मेरे खलिहान के पुत्र[b], जो कुछ मैंने सेनाओं के याहवे, इस्राएल के परमेश्वर से सुना है, वह मैंने तुम्हें घोषित किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘मेरे कुचले हुए लोग’ या ‘मेरे रौंदे हुए लोग’ भी हो सकता है। इब्रानी में अनाज दाँवने का चित्र घोर पीड़ा के रूपक के रूप में बना रहता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘मेरे खलिहान के पुत्र’। यह दाँवने के पिछले चित्र से जुड़ा रूपक है और संभवतः ऐसे लोगों को संबोधित करता है जो अनाज की तरह पीटे या कुचले गए हैं।
    reason: cultural_note
lexical_decisions:
- source_word: מְדֻשָׁתִי
  choice: मेरे दाँवे हुए जन
  rationale: यह रूप דושׁ धातु से बना है और अनाज दाँवने का चित्र सामने रखता है। ‘जन’ जोड़ने से हिन्दी में संबोधन स्वाभाविक बनता है, जबकि पीड़ा और कुचले जाने का कृषि-रूपक बना रहता है।
- source_word: וּבֶן גָּרְנִי
  choice: और मेरे खलिहान के पुत्र
  rationale: בֵּן का मूल अर्थ ‘पुत्र’ और גֹּרֶן का अर्थ ‘खलिहान’ अथवा ‘दाँवने का स्थान’ है। शाब्दिक रूपक को बनाए रखा गया है; उसका आशय मुख्य पाठ में सीमित नहीं किया गया।
- source_word: אֲשֶׁר שָׁמַעְתִּי
  choice: जो कुछ मैंने सुना है
  rationale: सापेक्ष सर्वनाम संदेश की विषयवस्तु बताता है। यह हिन्दी में स्वाभाविक है और पूर्ण क्रिया को वर्तमान घोषणा से जोड़ता है।
- source_word: מֵאֵת
  choice: से
  rationale: यह संदेश के स्रोत को सूचित करता है; हिन्दी में ‘से’ पर्याप्त और स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं के
  rationale: यह उपाधि सैन्य समूहों या विशाल दलों का भाव रखती है। ‘सेनाओं’ मूल बिंब को स्पष्ट रखता है और अर्थ को केवल मानवीय सेना तक सीमित नहीं करता।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: यह संबंधवाचक पदबंध सीधे तौर पर इस्राएल के परमेश्वर की पहचान कराता है।
- source_word: הִגַּדְתִּי
  choice: मैंने ... बता दिया है
  rationale: हिफ़इल रूप किसी बात को प्रकट करने या बताने का भाव देता है। ‘बता दिया है’ आधुनिक हिन्दी में स्वाभाविक है और भविष्यद्वक्ता द्वारा प्राप्त संदेश सार्वजनिक करने की पूर्णता व्यक्त करता है।
- source_word: לָכֶם
  choice: तुम लोगों को
  rationale: मूल में संबोधन बहुवचन है। ‘तुम लोगों’ से यह संख्या हिन्दी में स्पष्ट और सहज रूप से व्यक्त होती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। ‘याहवे’ नाम को उपाधि में बदले बिना उसका प्रचलित विद्वत्तापूर्ण उच्चारण देवनागरी में प्रस्तुत करता है।
- issue: दाँवने के रूपक को कितना स्पष्ट किया जाए
  choice: कृषि-रूपक को मुख्य पाठ में बनाए रखना
  alternative: हे मेरे पीड़ित लोगो
  rationale: मूल में दाँवने और खलिहान के परस्पर जुड़े हुए चित्र हैं। उन्हें केवल ‘पीड़ित’ कह देने से काव्यात्मक तीव्रता और दोनों पदों का संबंध मिट जाता; इसलिए संभावित आशय को पादटिप्पणियों में समझाया गया है।
- issue: ‘खलिहान के पुत्र’ की पहचान
  choice: रूपकात्मक संबोधन को अनिर्णीत रखना
  alternative: मेरे खलिहान का अनाज / मेरे कुचले हुए लोग
  rationale: בֵּן शाब्दिक रूप से ‘पुत्र’ है, पर यहाँ रूपकात्मक संबंध दर्शाता है। पाठ यह स्पष्ट नहीं करता कि इसे केवल अनाज, इस्राएल या किसी विशेष पीड़ित समुदाय के रूप में सीमित किया जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और भविष्यद्वाणी के संबोधन के अनुरूप रखी गई है। ‘दाँवे हुए’ कुछ साहित्यिक है, पर कृषि-बिंब को सीधे सुरक्षित रखता है; पादटिप्पणी साधारण पाठक के लिए उसका आशय स्पष्ट करती है।
