  edition: WLC
  text: מַשָּׂ֖א מִדְבַּר יָ֑ם כְּ/סוּפ֤וֹת בַּ/נֶּ֨גֶב֙ לַֽ/חֲלֹ֔ף מִ/מִּדְבָּ֣ר בָּ֔א מֵ/אֶ֖רֶץ נוֹרָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/001.yaml
  text: 'An oracle concerning the wilderness of the sea: like whirlwinds in the Negev sweeping through[a], it comes from the wilderness[c][b], from a fearful land.'
translation:
  language: hi
  text: 'समुद्र के निर्जन प्रदेश के विषय में घोषणा:

    जैसे नेगेव में बवंडर गुजरते हैं,

    वैसे ही वह निर्जन प्रदेश से,

    भयावह देश से आता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आता है’ का कर्ता इब्रानी में प्रकट नहीं है; इसका संकेत अभी वर्णित तूफान-जैसी शक्ति की ओर हो सकता है। ‘नेगेव’ दक्षिणी प्रदेश का नाम है और इसका अर्थ ‘दक्षिण’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: भविष्यवाणी
  rationale: भविष्यद्वाणी-संबंधी शीर्षकों में यह शब्द किसी गंभीर ईश्वरीय घोषणा, प्रायः न्याय की घोषणा, का परिचय देता है। आधुनिक हिन्दी में ‘भविष्यवाणी’ सहज है और भौतिक ‘बोझ’ का भ्रामक अर्थ नहीं लाती।
- source_word: מִדְבַּר יָם
  choice: समुद्र का निर्जन प्रदेश
  rationale: इब्रानी की असामान्य संबंधवाची रचना और उसके काव्यात्मक-भौगोलिक रहस्य को बनाए रखा गया है; इसे सीधे किसी विशिष्ट राष्ट्र या ‘समुद्र के किनारे का मरुस्थल’ के रूप में नहीं सुलझाया गया।
- source_word: כְּסוּפוֹת
  choice: जैसे ... बवंडर
  rationale: यह शब्द हिंसक तूफानी हवाओं को दर्शाता है। ‘बवंडर’ उपमा की तीव्रता और दृश्यात्मकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּנֶּגֶב
  choice: नेगेव में
  rationale: शब्द का अर्थ ‘दक्षिण’ भी हो सकता है, पर यहाँ भौगोलिक रंग बनाए रखने के लिए दक्षिणी मरुस्थलीय क्षेत्र का नाम रखा गया है।
- source_word: לַחֲלֹף
  choice: झोंके मारते हुए निकलते हैं
  rationale: क्रिया का आशय किसी क्षेत्र से तीव्रता से गुजरना है। यह अभिव्यक्ति तूफान की गति को स्वाभाविक हिन्दी में स्पष्ट करती है।
- source_word: מִמִּדְבָּר בָּא
  choice: वह निर्जन प्रदेश से ... आता है
  rationale: इब्रानी में एकवचन क्रिया का कर्ता प्रकट नहीं है। ‘वह’ इस अस्पष्टता को यथासंभव बनाए रखता है और किसी व्यक्ति को अनावश्यक रूप से कर्ता नहीं ठहराता।
- source_word: מֵאֶרֶץ נוֹרָאָה
  choice: एक भयावह देश से
  rationale: ‘भयावह’ उस देश के आतंककारी या डर उत्पन्न करने वाले स्वरूप को व्यक्त करता है, बिना भय के सटीक कारण को निर्धारित किए।
theological_decisions:
- issue: शीर्षक में काव्यात्मक-भौगोलिक पदबंध की व्याख्या की सीमा
  choice: ‘समुद्र का निर्जन प्रदेश’ के रहस्यमय चित्र को मुख्य पाठ में बनाए रखना
  alternative: ‘समुद्र के किनारे का मरुस्थल’ कहना या इसे बाबेल के रूप में स्पष्ट कर देना
  rationale: पद स्वयं एक असामान्य और संभवतः काव्यात्मक भौगोलिक designation देता है। किसी विशिष्ट राष्ट्र की पहचान जोड़ना पाठ से आगे जाना होगा।
- issue: ‘आता है’ का अप्रकट कर्ता
  choice: ‘वह’ द्वारा कर्ता को अनिर्दिष्ट रखना
  alternative: आक्रमणकारी, सेना, तूफान या कोई व्यक्ति स्पष्ट रूप से कर्ता मानना
  rationale: इब्रानी क्रिया एकवचन है, पर उसका कर्ता व्यक्त नहीं है; इसलिए अनुवाद में इस तनाव को पूरी तरह सुलझाना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। काव्यात्मक गति के लिए ‘जैसे... वैसे ही’ रचना अपनाई गई, जबकि असामान्य भौगोलिक पदबंध और अप्रकट कर्ता की मूल अस्पष्टता सुरक्षित रखी गई है।
