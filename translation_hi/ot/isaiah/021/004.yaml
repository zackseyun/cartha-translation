source:
  edition: WLC
  text: תָּעָ֣ה לְבָבִ֔/י פַּלָּצ֖וּת בִּֽעֲתָ֑תְ/נִי אֵ֚ת נֶ֣שֶׁף חִשְׁקִ֔/י שָׂ֥ם לִ֖/י לַ/חֲרָדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/004.yaml
  text: My heart reels; shuddering terrifies me[a]. The twilight I longed for he has turned into terror for me.
translation:
  language: hi
  text: मेरा हृदय डगमगा रहा है; कंपकंपी ने मुझे भयभीत कर दिया है। जिस धुंधलके की मुझे लालसा थी, उसे उसने मेरे लिए आतंक बना दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָּעָה
  choice: डगमगा रहा है
  rationale: क्रिया का मूल अर्थ भटकना या मार्ग से चूकना है; हृदय के साथ यह आंतरिक अस्थिरता और दिशाहीनता व्यक्त करती है। ‘डगमगा रहा है’ इस काव्यात्मक भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: לְבָבִי
  choice: मेरा हृदय
  rationale: ‘हृदय’ भीतरी व्यक्ति—विचार, इच्छा और भावना—की इब्रानी धारणा को ‘मन’ तक सीमित किए बिना सुरक्षित रखता है।
- source_word: פַּלָּצוּת
  choice: थरथराहट
  rationale: यह संज्ञा तीव्र काँपने या सिहरने की दशा बताती है। ‘थरथराहट’ इसके शारीरिक और भावात्मक बल दोनों को व्यक्त करती है।
- source_word: בִּעֲתַתְנִי
  choice: ने मुझे आतंकित कर दिया है
  rationale: בעת भयभीत या आतंकित करने को दर्शाता है। पूर्ण क्रिया का रूप दर्शन से उत्पन्न वर्तमान भयावह दशा को सजीव रूप में व्यक्त कर सकता है।
- source_word: נֶשֶׁף
  choice: गोधूलि
  rationale: נֶשֶׁף मंद प्रकाश की बेला, प्रायः संध्या, को दर्शाता है। ‘गोधूलि’ काव्यात्मक वातावरण और संध्या का संकेत दोनों बनाए रखता है।
- source_word: חִשְׁקִי
  choice: जिसकी मुझे लालसा थी
  rationale: प्रथम पुरुष प्रत्यय वाली संज्ञा का अर्थ ‘मेरी अभिलाषा/लालसा’ है; हिन्दी में संबंधवाचक वाक्य स्वाभाविक ढंग से वही अर्थ देता है।
- source_word: שָׂם לִי
  choice: उसे उसने मेरे लिए ... बना दिया है
  rationale: सक्रिय क्रिया और निहित कर्ता को बनाए रखा गया है। ‘उसने’ कर्ता की पहचान तय नहीं करता और मूल की संदर्भगत अस्पष्टता सुरक्षित रखता है।
- source_word: לַחֲרָדָה
  choice: भय का समय
  rationale: संज्ञा काँपने, घबराहट या आतंक को दर्शा सकती है। हिन्दी में ‘भय का समय’ इच्छित गोधूलि के भयावह अनुभव में बदल जाने का परिणाम स्वाभाविक रूप से बताता है।
theological_decisions:
- issue: שָׂם का निहित कर्ता
  choice: ‘उसने’ कहकर कर्ता को अनिर्दिष्ट रखा गया है
  alternative: ‘परमेश्वर ने’ या निष्क्रिय रूप ‘बन गई’
  rationale: इस पद में कर्ता स्पष्ट रूप से नामित नहीं है। परमेश्वर को सीधे कर्ता कहना मूल से अधिक निश्चित होगा, जबकि निष्क्रिय रूप इब्रानी की सक्रिय रचना को मिटा देगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी; समानांतर भय-चित्रों और निहित कर्ता की अस्पष्टता को सुरक्षित रखा गया है।
