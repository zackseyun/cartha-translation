source:
  edition: WLC
  text: חָז֥וּת קָשָׁ֖ה הֻגַּד לִ֑/י הַ/בּוֹגֵ֤ד בּוֹגֵד֙ וְ/הַ/שּׁוֹדֵ֣ד שׁוֹדֵ֔ד עֲלִ֤י עֵילָם֙ צוּרִ֣י מָדַ֔י כָּל אַנְחָתָ֖/ה הִשְׁבַּֽתִּי־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/002.yaml
  text: 'A harsh vision has been declared to me: the betrayer betrays[a], and the destroyer destroys. Go up, Elam; lay siege, Media[b]. I have put an end to all her groaning.'
translation:
  language: hi
  text: 'एक कठोर दर्शन मुझे बताया गया है: विश्वासघाती विश्वासघात करता है[a], और लुटेरा लूटता है। हे एलाम, चढ़ाई कर! हे मादै, घेरा डाल! उसकी सारी कराहट मैंने बंद कर दी है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छल करने वाला छल करता है, और लूटने वाला लूटता है।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में स्त्रीलिंग एकवचन का भाव है—“उसकी सारी कराहट”; इस पद में यह स्पष्ट नहीं है कि “उसकी” किसके लिए कहा गया है।
    reason: referent_ambiguity
lexical_decisions:
- source_word: חָזוּת קָשָׁה
  choice: एक कठोर दर्शन
  rationale: חָזוּת भविष्यद्वक्ता को दिखाए गए दर्शन को सूचित करता है और קָשָׁה उसकी कठोर तथा दुःखद प्रकृति व्यक्त करता है।
- source_word: הֻגַּד לִי
  choice: मुझे बताया गया है
  rationale: निष्क्रिय रूप उस संदेश के भविष्यद्वक्ता पर प्रकट या ज्ञात किए जाने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַבּוֹגֵד בּוֹגֵד
  choice: विश्वासघाती विश्वासघात करता है
  rationale: एक ही इब्रानी धातु से बने कर्ता और क्रिया की प्रभावशाली पुनरावृत्ति को हिन्दी में बनाए रखता है।
- source_word: וְהַשֹּׁדֵד שֹׁדֵד
  choice: और लुटेरा लूटता है
  rationale: שׁדד सैन्य सन्दर्भ में लूटने और उजाड़ने, दोनों का भाव रखता है; यह चयन मूल की धातुगत पुनरावृत्ति भी सुरक्षित रखता है।
- source_word: עֲלִי עֵילָם
  choice: हे एलाम, चढ़ाई कर!
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप सैन्य आक्रमण के लिए आगे बढ़ने की आज्ञा है।
- source_word: צוּרִי מָדַי
  choice: हे मादै, घेरा डाल!
  rationale: צור का आज्ञार्थक रूप यहाँ किसी नगर पर सैन्य घेरा डालने का अर्थ देता है; मादै पारम्परिक हिन्दी बाइबलीय नाम है।
- source_word: כָּל אַנְחָתָהּ הִשְׁבַּתִּי
  choice: उसका सारा कराहना मैंने बन्द कर दिया है
  rationale: हिफ़ील रूप का कारणवाचक अर्थ व्यक्त होता है और स्त्रीलिंग प्रत्यय के अनिर्दिष्ट संदर्भ को ‘उसका’ द्वारा खुला रखा गया है।
theological_decisions:
- issue: כָּל אַנְחָתָהּ में स्त्रीलिंग प्रत्यय का संदर्भ
  choice: मुख्य पाठ में ‘उसका’ रखकर संदर्भ अनिर्दिष्ट छोड़ा गया
  alternative: इसे बाबेल, देश, या उसके कारण होने वाले कराहने से स्पष्ट रूप से जोड़ना
  rationale: इस पद में स्त्रीलिंग संदर्भ स्पष्ट रूप से पहचाना नहीं गया है; किसी विशेष नगर या देश का नाम जोड़ना व्याख्यात्मक निर्णय होता।
- issue: שׁדד का अर्थक्षेत्र
  choice: लुटेरा लूटता है
  alternative: विनाश करने वाला विनाश करता है
  rationale: मूल शब्द हिंसक लूट और उजाड़ दोनों का अर्थ दे सकता है। ‘लूटता’ मूल धातु की पुनरावृत्ति को सहज हिन्दी में सुरक्षित रखता है, जबकि विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और स्पष्ट हिन्दी; भविष्यद्वाणी की कठोरता तथा दोनों इब्रानी धातुओं की आलंकारिक पुनरावृत्ति यथासम्भव सुरक्षित रखी गई है। आज्ञाओं में सम्बोधन स्पष्ट करने के लिए ‘हे’ का प्रयोग किया गया है।
