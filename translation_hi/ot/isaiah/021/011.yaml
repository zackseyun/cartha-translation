base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/011.yaml
  text: 'An oracle concerning Dumah: One calls to me from Seir[a], “Watchman, what of the night? Watchman[b], what of the night?”'
translation:
  language: hi
  text: 'दूमा[a] के विषय में घोषणा: सेईर से कोई मुझे पुकारता है, “पहरेदार, रात कितनी बीत गई?[b] पहरेदार, रात कितनी बीत गई?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दूमा” नाम में “मौन” के लिए प्रयुक्त हिब्रू शब्द की प्रतिध्वनि भी हो सकती है। अगली पंक्ति में सेईर आने के कारण कुछ लोग इसे एदोम से जोड़ते हैं।
    reason: lexical_alternative
  - marker: b
    text: इस हिब्रू मुहावरे का अर्थ “रात की क्या खबर है?” भी हो सकता है; यह रात की दशा या उसके कितना बीत जाने के बारे में पूछता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מַשָּׂא
  choice: भविष्यवाणी
  rationale: भविष्यसूचक शीर्षक में यह शब्द परमेश्वर की ओर से घोषित वाणी को सूचित करता है। ‘भविष्यवाणी’ आधुनिक हिन्दी में स्वाभाविक और समझने योग्य है; ‘बोझ’ का अत्यधिक शाब्दिक अर्थ यहाँ भ्रामक हो सकता है।
- source_word: דּוּמָה
  choice: दूमा
  rationale: शीर्षक में इसे स्थान अथवा जाति के व्यक्तिवाचक नाम के रूप में लिप्यंतरित किया गया है। इससे ‘मौन’ की संभावित शब्दगत प्रतिध्वनि और एदोम से संभावित संबंध को मुख्य पाठ में निर्णायक बनाए बिना सुरक्षित रखा जाता है।
- source_word: אֵלַי קֹרֵא
  choice: कोई मुझे पुकारता है
  rationale: एकवचन पुल्लिंग कृदन्त का कर्ता स्पष्ट नहीं है। ‘कोई’ उसकी अनिश्चितता को सहज हिन्दी में बनाए रखता है।
- source_word: מִשֵּׂעִיר
  choice: सेईर से
  rationale: स्थाननाम को प्रचलित हिन्दी बाइबलीय रूप में रखा गया है और מִן उपसर्ग पुकार के उद्गम को व्यक्त करता है।
- source_word: שֹׁמֵר
  choice: पहरेदार
  rationale: यह रात में निगरानी करने वाले व्यक्ति को संबोधित करने वाला शब्द है। ‘पहरेदार’ वर्तमान हिन्दी में स्पष्ट है और दोहराए गए संबोधन का काव्यात्मक प्रभाव बनाए रखता है।
- source_word: מַה מִלַּיְלָה / מַה מִלֵּיל
  choice: रात कितनी बीत गई?
  rationale: यह मुहावरा रात की दशा या उसकी प्रगति पूछता है। हिन्दी में ‘रात कितनी बीत गई?’ उसी आशय को सीधे और स्वाभाविक ढंग से व्यक्त करता है; दोनों हिब्रू रूपों को समान अनुवाद देकर जानबूझकर की गई पुनरावृत्ति सुरक्षित रहती है।
theological_decisions:
- issue: דּוּמָה की पहचान
  choice: मुख्य पाठ में व्यक्तिवाचक नाम ‘दूमा’
  alternative: ‘मौन’ का सामान्य संज्ञार्थ अथवा एदोम का अप्रत्यक्ष संकेत
  rationale: भविष्यसूचक शीर्षक की रचना इसे नाम मानने का समर्थन करती है, जबकि अगले वाक्य में सेईर का उल्लेख एदोमी संदर्भ का संकेत देता है। लिप्यंतरण ऐतिहासिक पहचान को अनावश्यक रूप से निश्चित नहीं करता; अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। भविष्यसूचक शीर्षक की औपचारिकता तथा पुकार की काव्यात्मक पुनरावृत्ति सुरक्षित है। मुख्य पाठ में ‘रात कितनी बीत गई?’ को अर्थ-स्पष्ट मुहावरेदार अनुवाद चुना गया है।
