base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/007.yaml
  text: And he saw riders, pairs of horsemen[a], riders on donkeys, riders on camels; and he listened intently, with great attentiveness.
translation:
  language: hi
  text: 'उसने सवारों का एक दल देखा: घुड़सवारों का एक जोड़ा, गधों पर सवार लोगों का एक दल और ऊँटों पर सवार लोगों का एक दल[a]; और उसने बहुत ध्यान से सुना[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द रֶכֶב का अर्थ ‘रथ’ या ‘रथ-दल’ भी हो सकता है। यहाँ घुड़सवारों, गधों और ऊँटों के समानांतर उल्लेख के कारण इसका सामूहिक अर्थ, ‘सवारों का दल,’ लिया गया है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘ध्यान, बहुत ध्यान’ अथवा ‘उसने सुना—बहुत सुनना’ जैसा जोरदार दोहराव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: उसने ... देखा
  rationale: वाव के साथ आया काल-संपन्न क्रिया-रूप यहाँ दर्शन के वर्णन को आगे बढ़ाता है; हिन्दी में सामान्य भूतकाल स्वाभाविक है।
- source_word: רֶכֶב
  choice: सवार लोगों का दल
  rationale: इस प्रसंग में यह शब्द केवल पहियों वाले ‘रथ’ के अर्थ में लेना कठिन है, क्योंकि आगे गधों और ऊँटों का उल्लेख है। सामूहिक अर्थ में सवारों का दल प्रसंगानुकूल है, जबकि शब्द की दूसरी सम्भावना पादटिप्पणी में रखी गई है।
- source_word: צֶמֶד פָּרָשִׁים
  choice: घुड़सवारों का एक जोड़ा
  rationale: צֶמֶד का मूल अर्थ ‘जोड़ा’ और פָּרָשִׁים का अर्थ ‘घुड़सवार’ है; इसलिए संख्या और चित्र दोनों को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: רֶכֶב חֲמוֹר / רֶכֶב גָּמָל
  choice: गधों पर सवार लोगों का दल / ऊँटों पर सवार लोगों का दल
  rationale: समानांतर रचना को बनाए रखते हुए जानवरों पर सवार सामूहिक दलों का अर्थ सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: וְהִקְשִׁיב
  choice: उसने ... ध्यान लगाकर सुना
  rationale: हिफ़ील रूप सक्रिय और एकाग्र होकर सुनने का भाव देता है; ‘ध्यान लगाकर सुना’ उसी बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קֶשֶׁב רַב קָשֶׁב
  choice: बहुत ही ध्यान लगाकर
  rationale: संज्ञा की पुनरावृत्ति और רַב सुनने की तीव्र सावधानी पर जोर देते हैं; मुख्य पाठ में अर्थगत बल रखा गया है और शाब्दिक पुनरावृत्ति पादटिप्पणी में दी गई है।
