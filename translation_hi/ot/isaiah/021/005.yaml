  text: עָרֹ֧ךְ הַ/שֻּׁלְחָ֛ן צָפֹ֥ה הַ/צָּפִ֖ית אָכ֣וֹל שָׁתֹ֑ה ק֥וּמוּ הַ/שָּׂרִ֖ים מִשְׁח֥וּ מָגֵֽן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/005.yaml
  text: They set the table[a], they spread the rugs, they eat, they drink. Rise up, princes[b]; oil the shield.
translation:
  language: hi
  text: वे मेज़ लगाते हैं[a], गलीचे बिछाते हैं, खाते-पीते हैं। हे अधिकारियों, उठो; ढाल पर तेल लगाओ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे पहरे पर निगाह रखते हैं” अथवा “पहरा तैनात करते हैं।” इस खंड का इब्रानी पाठ कठिन है; मुख्य पाठ में भोज की तैयारी वाला अर्थ अपनाया गया है, जो आस-पास की क्रियाओं के क्रम से मेल खाता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक अर्थ “ढाल का अभिषेक करो” है—अर्थात युद्ध के लिए तैयार करने को ढाल पर तेल लगाओ।
    reason: cultural_note
lexical_decisions:
- source_word: עָרֹךְ הַשֻּׁלְחָן
  choice: वे मेज़ लगाते हैं
  rationale: ערך का मूल अर्थ व्यवस्थित करना या लगाना है; ‘मेज़ लगाना’ भोज की तैयारी के संदर्भ में स्वाभाविक और ठोस हिन्दी है।
- source_word: צָפֹה הַצָּפִית
  choice: गलीचे बिछाते हैं
  rationale: यह कठिन और दुर्लभ पदबंध भोज के लिए बिछाए जाने वाले आवरण या गलीचों के अर्थ में लिया गया है; ‘बिछाते हैं’ दृश्य की क्रियात्मक गति बनाए रखता है, जबकि वैकल्पिक पाठ पादटिप्पणी में सुरक्षित है।
- source_word: אָכוֹל שָׁתֹה
  choice: खाते-पीते हैं
  rationale: दोनों infinitive absolute यहाँ जीवंत, निरंतर क्रियाओं की शृंखला बनाते हैं; संयुक्त हिन्दी प्रयोग संक्षिप्त और स्वाभाविक है।
- source_word: קוּמוּ
  choice: उठो
  rationale: बहुवचन आज्ञार्थक रूप अचानक उत्पन्न संकट और तत्परता को व्यक्त करता है।
- source_word: הַשָּׂרִים
  choice: हे हाकिमो
  rationale: שׂרים शासकीय पद वाले प्रधानों, अधिकारियों या राजपुरुषों को सूचित करता है। ‘हाकिम’ दरबारी और प्रशासनिक पद दोनों को समेटता हुआ सामान्य हिन्दी में बोधगम्य है।
- source_word: מִשְׁחוּ מָגֵן
  choice: ढाल पर तेल लगाओ
  rationale: משׁח का शाब्दिक भाव तेल लगाने या अभिषेक करने का है; युद्ध-सामग्री की तैयारी के संदर्भ में ‘तेल लगाओ’ उद्देश्य को बिना धार्मिक अनुष्ठान का अर्थ आरोपित किए स्पष्ट करता है। एकवचन מגן की सामूहिक छवि बनी रहती है।
