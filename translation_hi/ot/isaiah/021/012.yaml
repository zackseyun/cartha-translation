source:
  edition: WLC
  text: אָמַ֣ר שֹׁמֵ֔ר אָתָ֥ה בֹ֖קֶר וְ/גַם לָ֑יְלָה אִם תִּבְעָי֥וּ/ן בְּעָ֖יוּ שֻׁ֥בוּ אֵתָֽיוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/012.yaml
  text: The watchman says[a], “Morning comes, and also night. If you would inquire, inquire; return[b], come.”
translation:
  language: hi
  text: पहरेदार कहता है, “सुबह आती है[a], और रात भी। यदि तुम पूछना चाहते हो, तो पूछो; लौटो[b], आओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सुबह आ गई है, और रात भी”; इब्रानी क्रियारूप को सामान्य आगमन के कथन या अधिक तत्काल घोषणा, दोनों रूपों में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम आज्ञाओं को “मुड़ो, फिर आओ” या “वापस जाओ और फिर आना” भी समझा जा सकता है। इनमें मन फिराने का संकेत हो सकता है, या केवल बाद में दोबारा पूछने के लिए लौटने का; इब्रानी इस बारीकी को खुला छोड़ता है।
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁמֵר
  choice: पहरेदार
  rationale: यह שׁמר का संज्ञार्थक कृदंत है और ऐसे व्यक्ति को दर्शाता है जो पहरा देता है; निकटवर्ती भविष्यवाणी-संदर्भ में ‘पहरेदार’ स्वाभाविक है।
- source_word: אָמַר
  choice: कहता है
  rationale: रूप की दृष्टि से यह पूर्ण क्रिया है, पर यहाँ प्रत्यक्ष कथन का परिचय देता है; वर्तमानकालीन ‘कहता है’ इस उत्तर के संदर्भ में स्वाभाविक है।
- source_word: אָתָה
  choice: आती है
  rationale: אתה का अर्थ ‘आना’ है और בֹקֶר इसका कर्ता है; स्त्रीलिंग ‘आती है’ हिन्दी में ‘सुबह’ के अनुरूप है और आगमन की अभिव्यक्ति बनाए रखता है।
- source_word: בֹקֶר
  choice: सुबह
  rationale: मूल अर्थ ‘सुबह’ है; ‘भोर’ संभव है, पर वह समय-संदर्भ को अधिक संकीर्ण कर सकता है।
- source_word: וְגַם לָיְלָה
  choice: और रात भी
  rationale: यह राहत और फिर अंधकार को साथ रखता है; ‘और...भी’ इब्रानी समन्वय को बिना अनावश्यक विरोधसूचक अर्थ जोड़े सुरक्षित रखता है।
- source_word: אִם תִּבְעָיוּן
  choice: यदि तुम पूछना चाहते हो
  rationale: शर्तसूचक अव्यय और अपूर्ण क्रिया मिलकर पूछने वालों की इच्छा को संबोधित करते हैं; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בְּעָיוּ
  choice: पूछो
  rationale: आज्ञार्थक क्रिया पूर्ववर्ती क्रिया के ही मूल को दोहराती है; ‘पूछना...पूछो’ उस आलंकारिक पुनरावृत्ति को बनाए रखता है।
- source_word: שֻׁבוּ
  choice: लौटो
  rationale: שׁוב का सामान्य अर्थ लौटना या मुड़ना है; ‘लौटो’ शारीरिक वापसी और गहरे परिवर्तन—दोनों संभावनाओं को खुला रखता है।
- source_word: אֵתָיוּ
  choice: आओ
  rationale: यह אתה से बना आज्ञार्थक रूप है; ‘आओ’ सीधा अनुवाद है और ‘लौटो, आओ’ की संक्षिप्त तथा कुछ रहस्यमय लय सुरक्षित रखता है।
theological_decisions:
- issue: सुबह और रात के आगमन का काल तथा आशय
  choice: “सुबह आती है, और रात भी”
  alternative: “सुबह आ गई है, और रात भी”
  rationale: इब्रानी पूर्ण रूप तत्काल आगमन की घोषणा अथवा सामान्य/वर्तमान कथन—दोनों की तरह सुना जा सकता है। मुख्य पाठ एक स्वाभाविक वर्तमान अभिव्यक्ति रखता है और पादटिप्पणी दूसरे कालगत पाठ को सुरक्षित करती है।
- issue: अंतिम आज्ञाओं का संकेत
  choice: “लौटो, आओ” को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: “मन फिराओ और फिर आओ” अथवा “वापस जाकर फिर आना”
  rationale: इब्रानी यह निश्चित नहीं करता कि यहाँ पश्चात्ताप का आह्वान है या बाद में फिर पूछने के लिए लौटना; इसलिए किसी एक धर्मवैचारिक अर्थ को मुख्य पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गंभीर और भविष्यवाणी-संगत शैली रखी गई है। ‘सुबह आती है’ और ‘लौटो, आओ’ की असामान्य किंतु अर्थपूर्ण संक्षिप्तता मूल इब्रानी के तनाव और अस्पष्टता को सुरक्षित रखती है।
