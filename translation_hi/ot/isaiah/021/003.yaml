base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/003.yaml
  text: Therefore my loins are filled with anguish[a]; pains have seized me like the pains of a woman giving birth. I am bent over from hearing[b]; I am dismayed from seeing.
translation:
  language: hi
  text: इसलिए मेरी कमर घोर पीड़ा से भर गई है[a]; प्रसव करने वाली स्त्री की पीड़ाओं के समान पीड़ाओं ने मुझे जकड़ लिया है। सुनकर मैं दोहरा हो गया हूँ[b]; देखकर मैं विचलित हो गया हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कंपकंपी से”; इब्रानी शब्द तीव्र शारीरिक कंपन, ऐंठन या व्याकुल पीड़ा को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “मैं ऐंठ गया हूँ” अथवा “मैं मुड़ गया हूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָלְאוּ מָתְנַי
  choice: मेरी कमर ... भर गई है
  rationale: מָתְנַיִם शरीर के कमर/कटि-भाग को दर्शाता है। आधुनिक हिन्दी में ‘कमर’ ठोस शारीरिक बिंब को स्वाभाविक और स्पष्ट रूप से बनाए रखता है।
- source_word: חַלְחָלָה
  choice: घोर पीड़ा
  rationale: यह संज्ञा तीव्र कंपकंपी, ऐंठन या व्याकुल पीड़ा का बोध कराती है। प्रसव-पीड़ा के अगले बिंब के संदर्भ में ‘घोर पीड़ा’ अनुभव की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करती है; वैकल्पिक शारीरिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: צִירִים
  choice: पीड़ाओं
  rationale: शब्द तीव्र पीड़ा, विशेषकर प्रसव-वेदना, के लिए प्रयुक्त हो सकता है। आगे प्रसव करती स्त्री से स्पष्ट तुलना होने के कारण ‘पीड़ाओं’ मूल संबंध को बनाए रखता है।
- source_word: אֲחָזוּנִי
  choice: मुझे जकड़ लिया है
  rationale: क्रिया बलपूर्वक पकड़ लेने का भाव देती है। ‘जकड़ लिया’ पीड़ाओं के अचानक और प्रबल अधिकार को सजीव रूप से व्यक्त करता है।
- source_word: כְּצִירֵי יוֹלֵדָה
  choice: प्रसव करती स्त्री की पीड़ाओं के समान
  rationale: यह स्पष्ट उपमा मूल के प्रसव-बिंब को बिना संक्षिप्त या अमूर्त किए सुरक्षित रखती है।
- source_word: נַעֲוֵיתִי
  choice: मैं ऐंठ गया हूँ
  rationale: निफ़अल रूप मुड़ने, ऐंठने या दोहरा हो जाने का अर्थ दे सकता है। ‘ऐंठ गया’ तीव्र शारीरिक व्याकुलता को व्यक्त करता है और अर्थ की सीमा को पादटिप्पणी सहित बनाए रखता है।
- source_word: מִשְּׁמֹעַ
  choice: जो मैं सुनता हूँ, उससे
  rationale: מן सहित infinitive को यहाँ कारणसूचक समझा गया है। हिन्दी में यह रूप कारण को स्पष्ट करता है और अगले समानांतर वाक्य से मेल रखता है।
- source_word: נִבְהַלְתִּי
  choice: मैं घबरा गया हूँ
  rationale: क्रिया व्याकुल, स्तब्ध, भयभीत या विचलित हो जाने का भाव देती है। ‘घबरा गया’ तीव्र मानसिक आघात को सामान्य आधुनिक हिन्दी में व्यक्त करता है, बिना अर्थ को केवल आतंक तक सीमित किए।
- source_word: מֵרְאוֹת
  choice: जो मैं देखता हूँ, उससे
  rationale: यह भी कारणसूचक रूप में लिया गया है और ‘जो मैं सुनता हूँ, उससे’ के साथ मूल समानांतरता बनाए रखता है।
