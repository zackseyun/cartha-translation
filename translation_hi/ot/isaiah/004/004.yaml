  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִ֣ם רָחַ֣ץ אֲדֹנָ֗/י אֵ֚ת צֹאַ֣ת בְּנוֹת צִיּ֔וֹן וְ/אֶת דְּמֵ֥י יְרוּשָׁלִַ֖ם יָדִ֣יחַ מִ/קִּרְבָּ֑/הּ בְּ/ר֥וּחַ מִשְׁפָּ֖ט וּ/בְ/ר֥וּחַ בָּעֵֽר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/004.yaml
  text: when the Lord has washed away the filth of the daughters of Zion and cleansed the bloodshed of Jerusalem from her midst by a spirit of justice and by a spirit of burning[a][b].
translation:
  language: hi
  text: जब प्रभु सिय्योन की बेटियों की गंदगी धो डालेगा और यरूशलेम के भीतर से रक्तपात को न्याय की आत्मा और जलाने वाली आत्मा के द्वारा साफ कर देगा[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आत्मा’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ ‘वायु’ या ‘श्वास’ भी हो सकता है। इसलिए इसका अनुवाद ‘न्याय की वायु और दहन की वायु के द्वारा’ भी किया जा सकता है।
    reason: alternative_reading
  - marker: b
    text: ‘रक्तपात’ का अनुवाद ‘रक्तदोष’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: जब
  rationale: यहाँ शर्त काल-सूचक रूप में पिछले पद की प्रतिज्ञा के पूरा होने का अवसर बताती है; ‘जब’ प्रसंग में स्वाभाविक है और अनावश्यक अनिश्चितता नहीं जोड़ता।
- source_word: רָחַץ
  choice: धो डालेगा
  rationale: क्रिया का मूल अर्थ ‘धोना’ है; ‘धो डालेगा’ गंदगी को धोकर दूर करने की पूर्णता और शुद्धिकरण के बिंब को व्यक्त करता है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह परमेश्वर की उपाधि अदोनाय है, न कि चतुरक्षरीय नाम; आधुनिक हिन्दी में ‘प्रभु’ इसका स्वाभाविक और गरिमापूर्ण रूप है।
- source_word: צֹאַת
  choice: गंदगी
  rationale: शब्द अत्यंत अशुद्ध, यहाँ तक कि मल-जैसी गंदगी का तीखा बिंब रखता है; ‘गंदगी’ सामान्य पाठक के लिए स्पष्ट है और बिंब की अप्रियता को बनाए रखता है।
- source_word: בְּנוֹת צִיּוֹן
  choice: सिय्योन की बेटियाँ
  rationale: शाब्दिक रूप भविष्यद्वाणी की सामूहिक और व्यक्तिकृत छवि को सुरक्षित रखता है; इसे केवल ‘स्त्रियाँ’ कहना अधिक व्याख्यात्मक होता।
- source_word: דְּמֵי יְרוּשָׁלִַם
  choice: यरूशलेम का रक्तपात
  rationale: बहुवचन ‘रक्त’ हिंसक रक्तपात अथवा उससे जुड़े रक्तदोष का संकेत दे सकता है। मुख्य पाठ में ‘रक्तपात’ नैतिक शुद्धि के प्रसंग में स्वाभाविक है, जबकि ‘रक्तदोष’ को पादटिप्पणी में रखा गया है।
- source_word: יָדִיחַ
  choice: साफ कर देगा
  rationale: हिफ़इल रूप यहाँ धोकर या बहाकर दूर करने का अर्थ देता है। ‘साफ कर देगा’ पहले प्रयुक्त ‘धो डालेगा’ की अनावश्यक पुनरावृत्ति से बचते हुए हटाने और शुद्ध करने दोनों भाव व्यक्त करता है।
- source_word: מִקִּרְבָּהּ
  choice: उसके बीच से
  rationale: स्त्रीलिंग प्रत्यय यरूशलेम नगर को व्यक्तिकृत स्त्री के रूप में संदर्भित करता है; यह रूप स्थानिक अर्थ और व्यक्तिकरण दोनों को बनाए रखता है।
- source_word: בְּרוּחַ
  choice: आत्मा के द्वारा
  rationale: רוּחַ का अर्थ आत्मा, वायु या श्वास हो सकता है। यहाँ यह शुद्धिकरण के साधन या सक्रिय शक्ति को दर्शाता है; हिन्दी में छोटे अक्षर का भेद न होने के कारण वैकल्पिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: शब्द न्याय और न्यायिक निर्णय दोनों अर्थ रखता है। ‘न्याय’ साधारण आधुनिक हिन्दी में सुबोध रहते हुए दंडात्मक और नैतिक सुधार के भाव को समेटता है।
- source_word: בְּרוּחַ בָּעֵר
  choice: जलाने वाली आत्मा
  rationale: בער का रूप जलने, जलाने या भस्म करने का बिंब देता है। ‘जलाने वाली आत्मा’ हिन्दी में ‘दहन की आत्मा’ से अधिक स्वाभाविक है और शुद्ध करने वाले विनाश की तीव्र छवि बनाए रखता है।
theological_decisions:
- issue: בְּרוּחַ מִשְׁפָּט וּבְרוּחַ בָּעֵר में רוּחַ का आशय
  choice: साधन-सूचक ‘न्याय की आत्मा और जलाने वाली आत्मा के द्वारा’
  alternative: ‘न्याय करने वाले आत्मा और जलाने वाले आत्मा के द्वारा’, अथवा ‘न्याय की वायु और जलाने वाली लपट के द्वारा’
  rationale: इब्रानी संज्ञा आत्मा, वायु या श्वास का अर्थ दे सकती है और पाठ इसे स्पष्ट रूप से पवित्र आत्मा के रूप में चिह्नित नहीं करता। मुख्य पाठ सक्रिय दैवी साधन का भाव रखता है, जबकि पादटिप्पणी वैकल्पिक अर्थों और सम्भावित विशिष्ट ‘आत्मा’ पाठ को सुरक्षित रखती है।
- issue: דְּמֵי יְרוּשָׁלִַם का नैतिक या दृश्य अर्थ
  choice: रक्तपात
  alternative: रक्तदोष; खून के धब्बे
  rationale: ‘रक्तों’ का बहुवचन हिंसा, बहाए गए रक्त या उससे उत्पन्न दोष को सूचित कर सकता है। ‘रक्तपात’ मूल की व्यापकता बनाए रखता है; ‘रक्तदोष’ सम्भव किंतु अधिक न्यायिक-व्याख्यात्मक है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण भविष्यद्वाणीपरक गद्य। ‘सिय्योन की बेटियाँ’ और यरूशलेम के लिए ‘उसके’ रखकर मूल का व्यक्तिकरण सुरक्षित रखा गया है। ‘जलाने वाली आत्मा’ तीव्र शुद्धिकरण-बिंब को स्वाभाविक हिन्दी में व्यक्त करता है।
