reference: Isaiah 4:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בָרָ֣א יְהוָ֡ה עַל֩ כָּל מְכ֨וֹן הַר צִיּ֜וֹן וְ/עַל מִקְרָאֶ֗/הָ עָנָ֤ן יוֹמָם֙ וְ/עָשָׁ֔ן וְ/נֹ֛גַהּ אֵ֥שׁ לֶהָבָ֖ה לָ֑יְלָה כִּ֥י עַל כָּל כָּב֖וֹד חֻפָּֽה־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/005.yaml
  text: Then Yahweh will create over the whole site of Mount Zion and over her assemblies a cloud by day[a], and smoke, and the brightness of a flaming fire by night[d][c][b]; for over all the glory there will be a canopy.
translation:
  language: hi
  text: तब याहवे सिय्योन पर्वत के पूरे क्षेत्र पर और उसकी सभाओं[a] पर दिन को बादल और धुआँ, और रात को धधकती आग की चमक[b][c] रचेगा; क्योंकि सारी महिमा के ऊपर एक छत्र[d] होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी बुलाई हुई सभाओं।” हिब्रू शब्द नियत सभा या बुलाकर इकट्ठा किए गए लोगों के समागम को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “रात को प्रज्वलित आग की दीप्ति।”
    reason: lexical_alternative
  - marker: c
    text: यह चित्र मरुभूमि में याहवे के बादल और आग की याद दिलाता है; देखें निर्गमन 13:21–22।
    reason: cross_reference
  - marker: d
    text: या, “आवरण”; हिब्रू शब्द विवाह-मंडप का संकेत भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרָא
  choice: तब ... रचेगा
  rationale: भविष्य की पुनर्स्थापना के इस भविष्यसूचक संदर्भ में क्रिया को भावी प्रतिज्ञा के रूप में लिया गया है। ‘रचेगा’ ברא की सशक्त सृजनात्मक धारणा को बनाए रखता है, और ‘तब’ प्रसंग की प्रगति व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वरीय नाम के चार अक्षरों को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
- source_word: מְכוֹן הַר צִיּוֹן
  choice: सिय्योन पर्वत के पूरे क्षेत्र
  rationale: מְכוֹן यहाँ स्थिर स्थान या स्थल को दर्शाता है। ‘पूरे क्षेत्र’ आधुनिक हिन्दी में स्वाभाविक है और इसे अनावश्यक रूप से ‘निवास-स्थान’ नहीं बनाता।
- source_word: מִקְרָאֶיהָ
  choice: उसकी सभाओं
  rationale: מִקְרָא बुलाई गई सभा या नियत समागम को सूचित कर सकता है; स्त्रीलिंग प्रत्यय का संबंध सिय्योन से है।
- source_word: עָנָן יוֹמָם וְעָשָׁן
  choice: दिन को बादल और धुआँ
  rationale: दोनों दृश्य चिह्नों को अलग-अलग बनाए रखा गया है और निर्गमन की मरुभूमि-वाली छवि को विस्तार दिए बिना सुरक्षित रखा गया है।
- source_word: וְנֹגַהּ אֵשׁ לֶהָבָה לָיְלָה
  choice: और रात को धधकती आग की चमक
  rationale: נֹגַהּ की चमक और לֶהָבָה की प्रज्वलित लौ—दोनों भावों को सहज हिन्दी में रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अंतिम कथन को पिछली प्रतिज्ञा का व्याख्यात्मक आधार बनाता है।
- source_word: כָּבוֹד
  choice: महिमा
  rationale: शब्द की धार्मिक और प्रतिष्ठामूलक व्यापकता को बनाए रखा गया है; उसे मुख्य पाठ में केवल दिव्य उपस्थिति के अर्थ तक सीमित नहीं किया गया।
- source_word: חֻפָּה
  choice: छत्र
  rationale: यह ऊपर फैले सुरक्षात्मक आवरण की छवि देता है। विवाह-मंडप की संभावित अनुगूँज को मुख्य पाठ में थोपने के बजाय पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: וּבָרָא का भविष्यसूचक काल-पक्ष
  choice: भावी प्रतिज्ञा—‘रचेगा’
  alternative: भूतकाल—‘रचा’
  rationale: यशायाह 4 के आगे की ओर देख रहे पुनर्स्थापना-संदर्भ में यह पूर्ण क्रिया भविष्य में निश्चित रूप से होने वाले कार्य को व्यक्त करती है।
- issue: निर्गमन और नई सृष्टि की संभावित छवि
  choice: बादल, धुआँ और आग की छवि को मूल रूप में बनाए रखना
  alternative: ‘बादल का खंभा’ और ‘आग का खंभा’ कहकर संकेत स्पष्ट कर देना
  rationale: मरुभूमि में याहवे की उपस्थिति का संकेत प्रबल है, पर वे अतिरिक्त शब्द इस पद में नहीं हैं। इसलिए संबंध पादटिप्पणी में बताया गया है, मुख्य पाठ में नहीं।
- issue: חֻפָּה में सुरक्षात्मक और वैवाहिक संकेत
  choice: मुख्य पाठ में ‘छत्र’ और पादटिप्पणी में अन्य संभावनाएँ
  alternative: मुख्य पाठ में ‘विवाह-मंडप’
  rationale: संदर्भ सुरक्षा की छवि को प्रमुख बनाता है, जबकि हिब्रू शब्द वैवाहिक मंडप का संकेत भी दे सकता है। अनिश्चितता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य की काव्यात्मक समानांतरता—दिन/रात, बादल-धुआँ/आग की चमक—सुरक्षित है। ‘याहवे’, ‘सिय्योन’ और ‘महिमा’ जैसे स्थापित बाइबलीय रूप बनाए गए हैं; किसी विशिष्ट सम्प्रदायगत व्याख्या को मुख्य पाठ में नहीं जोड़ा गया।
