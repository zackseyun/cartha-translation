  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ צֶ֣מַח יְהוָ֔ה לִ/צְבִ֖י וּ/לְ/כָב֑וֹד וּ/פְרִ֤י הָ/אָ֨רֶץ֙ לְ/גָא֣וֹן וּ/לְ/תִפְאֶ֔רֶת לִ/פְלֵיטַ֖ת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/002.yaml
  text: In that day the branch of Yahweh will be for beauty and for glory[a], and the fruit of the land for majesty and for splendor[b], for the survivors of Israel.
translation:
  language: hi
  text: उस दिन यहोवा की शाखा सुंदरता और महिमा का कारण होगी[a], और भूमि की उपज वैभव और शोभा का कारण होगी—इस्राएल के बचे हुए लोगों के लिए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहोवा का अंकुर” अथवा “जिसे यहोवा उगाता है।” इब्रानी अभिव्यक्ति भूमि की फिर से होने वाली उपज और बाद की भविष्यवाणियों में यहोवा की “शाखा”—दोनों की ओर संकेत कर सकती है।
    reason: alternative_reading
  - marker: b
    text: या “इस्राएल के शेष लोग।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यसूचक समय-सूचक मुहावरे का स्वाभाविक और संक्षिप्त हिन्दी रूप है।
- source_word: צֶמַח יְהוָה
  choice: यहोवा की अंकुरित शाखा
  rationale: צֶמַח में अंकुर, उगाव और शाखा—तीनों की अर्थ-छाया है। यह रूप कृषि-संबंधी चित्र और संभावित भविष्यसूचक ‘शाखा’ की गूँज, दोनों को खुला रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम को प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: לִצְבִי וּלְכָבוֹד
  choice: सुंदरता और महिमा का कारण
  rationale: दोनों सकारात्मक गुणों का काव्यात्मक समानांतर सुरक्षित है; हिन्दी में उद्देश्य/परिणाम सूचक לְ को स्वाभाविक बनाने के लिए ‘का कारण’ प्रयोग किया गया है।
- source_word: וּפְרִי הָאָרֶץ
  choice: और भूमि की उपज
  rationale: यहाँ פְרִי केवल पेड़ के फल तक सीमित नहीं, बल्कि भूमि की पैदावार भी दर्शा सकता है; इस्राएल-केंद्रित कृषि-संदर्भ में ‘भूमि’ उपयुक्त है।
- source_word: לְגָאוֹן וּלְתִפְאֶרֶת
  choice: वैभव और शोभा का कारण
  rationale: גָאוֹן का यहाँ सकारात्मक अर्थ ‘वैभव’ है, न कि निंदात्मक ‘घमंड’; תִפְאֶרֶת को ‘शोभा’ कहने से काव्यात्मक भेद बना रहता है।
- source_word: לִפְלֵיטַת יִשְׂרָאֵל
  choice: इस्राएल के बचे हुओं के लिए
  rationale: פְלֵיטָה उन लोगों को सूचित करता है जो विपत्ति से बच निकले या जीवित रहे। यह आधुनिक हिन्दी में स्पष्ट है और ‘बचे हुए लोगों’ की भविष्यसूचक धारणा को बनाए रखता है।
theological_decisions:
- issue: क्या צֶמַח יְהוָה को भूमि की नई उर्वरता या मसीही ‘शाखा’ के रूप में निश्चित किया जाए
  choice: यहोवा की अंकुरित शाखा
  alternative: यहोवा का उगाया हुआ अंकुर; यहोवा की कराई हुई बढ़ोतरी
  rationale: इब्रानी पद दोनों दिशाओं की अर्थ-संभावना रखता है। ‘अंकुरित शाखा’ कृषि-चित्र को स्पष्ट रखते हुए बाद के भविष्यसूचक ‘शाखा’ रूपक की संभावित गूँज को भी समाप्त नहीं करता; इसे व्यक्तिवाचक शीर्षक मानकर बड़े अक्षर जैसी व्याख्यात्मक विशेषता नहीं जोड़ी गई।
- issue: क्या פְלֵיטַת יִשְׂרָאֵל के लिए पारंपरिक धर्मवैज्ञानिक शब्दावली अपनाई जाए
  choice: इस्राएल के बचे हुए
  alternative: इस्राएल का शेषांश; इस्राएल के जीवित बचे लोग
  rationale: ‘बचे हुए’ मूल के बच निकलने/जीवित रहने के भाव को सामान्य आधुनिक हिन्दी में सीधे व्यक्त करता है। ‘शेषांश’ की पारंपरिक सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; पद के काव्यात्मक समानांतरों को बनाए रखते हुए अस्वाभाविक शब्दशः रचना से बचा गया है। ‘अंकुरित शाखा’ जानबूझकर अर्थ की कृषि-संबंधी और संभावित मसीही दोनों परतें खुली रखती है।
