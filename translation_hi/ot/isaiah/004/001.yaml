id: ISA.4.1
reference: Isaiah 4:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הֶחֱזִיקוּ֩ שֶׁ֨בַע נָשִׁ֜ים בְּ/אִ֣ישׁ אֶחָ֗ד בַּ/יּ֤וֹם הַ/הוּא֙ לֵ/אמֹ֔ר לַחְמֵ֣/נוּ נֹאכֵ֔ל וְ/שִׂמְלָתֵ֖/נוּ נִלְבָּ֑שׁ רַ֗ק יִקָּרֵ֤א שִׁמְ/ךָ֙ עָלֵ֔י/נוּ אֱסֹ֖ף חֶרְפָּתֵֽ/נוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/001.yaml
  text: And seven women will take hold of one man in that day[a], saying, “We will eat our own bread and wear our own clothing; only let your name be called over us[b]. Take away our reproach.”
translation:
  language: hi
  text: उस दिन सात स्त्रियाँ एक ही पुरुष को पकड़कर कहेंगी, “हम अपनी रोटी खाएँगी और अपने कपड़े पहनेंगी; बस तेरा नाम हम पर रखा जाए[a]। हमारा कलंक दूर कर दे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, “हम तेरे नाम से जानी जाएँ।” इससे संभवतः विवाह या उस पुरुष के साथ कानूनी और सामाजिक संबंध का संकेत मिलता है।
    reason: lexical_alternative
  - marker: b
    text: “कलंक” सामाजिक अपमान या बदनामी को दर्शाता है। इस संदर्भ में शायद यह पहले वर्णित विनाश के बाद पति के नाम और सामाजिक स्थिति से वंचित होने के कलंक की ओर संकेत करता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהֶחֱזִיקוּ
  choice: पकड़कर
  rationale: חזק के हिफ़ईल रूप के साथ ב का अर्थ किसी को दृढ़ता से पकड़ना है। ‘पकड़कर’ स्त्रियों की व्याकुल पहल और कथन से उसका स्वाभाविक संबंध व्यक्त करता है, पर अनावश्यक हिंसा नहीं जोड़ता।
- source_word: שֶׁבַע נָשִׁים
  choice: सात स्त्रियाँ
  rationale: मूल में सामान्य शब्द ‘स्त्रियाँ’ है, ‘पत्नियाँ’ नहीं; विवाह या सामाजिक संबंध का निवेदन आगे केवल निहित है।
- source_word: בְּאִישׁ אֶחָד
  choice: एक ही पुरुष को
  rationale: ב यहाँ पकड़े जाने वाले व्यक्ति को चिह्नित करता है। ‘एक ही’ सात स्त्रियों और एक पुरुष के तीखे अनुपात पर स्वाभाविक हिन्दी में बल देता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यवाणी में प्रयुक्त सूत्रवत अभिव्यक्ति का स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: לַחְמֵנוּ נֹאכֵל
  choice: हम अपनी रोटी खाएँगी
  rationale: प्रथम पुरुष बहुवचन स्त्री-वक्ताओं के अनुसार ‘खाएँगी’ रखा गया है। ‘अपनी’ इस बात को स्पष्ट करता है कि वे अपने भोजन की व्यवस्था स्वयं करेंगी।
- source_word: וְשִׂמְלָתֵנוּ נִלְבָּשׁ
  choice: और अपने कपड़े पहनेंगी
  rationale: שִׂמְלָה यहाँ पहनावे के सामूहिक अर्थ में है। ‘अपने कपड़े’ आत्मनिर्वाह पर दिए गए प्रासंगिक बल को सहज हिन्दी में व्यक्त करता है।
- source_word: רַק
  choice: बस
  rationale: यह उनकी माँग को एक ही बात तक सीमित करता है; संवाद में ‘बस’ स्वाभाविक और प्रभावी है।
- source_word: יִקָּרֵא שִׁמְךָ עָלֵינוּ
  choice: तेरा नाम हम पर रखा जाए
  rationale: यह मूल इब्रानी मुहावरे की संरचना और उसके सामाजिक-कानूनी संकेत को बनाए रखता है, बिना उसे सीधे ‘हमसे विवाह कर ले’ में बदलकर अर्थ को संकरा किए।
- source_word: אֱסֹף
  choice: दूर कर दे
  rationale: אָסַף का मूल अर्थ इकट्ठा करना है, पर कलंक के साथ इसका मुहावरेदार अर्थ हटाना या दूर करना है।
- source_word: חֶרְפָּתֵנוּ
  choice: हमारा कलंक
  rationale: ‘कलंक’ बाहरी सामाजिक अपमान और बदनामी को व्यक्त करता है, पर उसके कारण को मुख्य पाठ में केवल अविवाहित या निःसंतान होने तक सीमित नहीं करता।
theological_decisions:
- issue: ‘तेरा नाम हम पर रखा जाए’ में निहित वैवाहिक या सामाजिक संबंध
  choice: मुख्य पाठ में इब्रानी मुहावरे को बनाए रखा गया है।
  alternative: ‘हम तेरे नाम से जानी जाएँ’ अथवा ‘हमसे विवाह कर ले’
  rationale: वाक्यांश संभवतः पुरुष के नाम और सामाजिक घराने के अधीन आने, शायद विवाह, का संकेत देता है; फिर भी मूल पाठ विवाह के सामान्य क्रियापद का प्रयोग नहीं करता। मुहावरा बनाए रखने से वास्तविक अस्पष्टता और सामाजिक अर्थ सुरक्षित रहते हैं।
- issue: חֶרְפָּה का आशय
  choice: व्यापक सामाजिक अर्थ वाला ‘कलंक’
  alternative: ‘अविवाहित होने का कलंक’ अथवा ‘निःसंतान होने की लज्जा’
  rationale: पूर्ववर्ती विनाश के संदर्भ में पति के नाम और सामाजिक स्थिति से वंचित होने की बदनामी संभावित है, पर पद स्वयं किसी एक कारण को स्पष्ट रूप से निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। स्त्री-वक्ताओं के कारण क्रियाओं में स्त्रीलिंग बहुवचन का प्रयोग किया गया है। मुख्य पाठ में इब्रानी मुहावरे और उसके खुले अर्थ को सुरक्षित रखते हुए टिप्पणियों में संभावित वैवाहिक-सामाजिक आशय समझाया गया है।
