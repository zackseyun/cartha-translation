base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/003.yaml
  text: And it shall be that whoever remains in Zion and whoever is left in Jerusalem will be called holy—everyone who is recorded for life in Jerusalem[a][b].
translation:
  language: hi
  text: तब ऐसा होगा कि सिय्योन में जो बचा रहेगा और यरूशलेम में जो शेष रहेगा, वह पवित्र कहलाएगा—हर वह व्यक्ति जिसका नाम यरूशलेम में जीवन के लिए लिखा हुआ है[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरूशलेम में जीवित लोगों में जिसका नाम लिखा हुआ है।”
    reason: lexical_alternative
  - marker: b
    text: “जीवन के लिए लिखा हुआ” शायद उन लोगों की आधिकारिक सूची की ओर संकेत करता है जिन्हें जीवित रहने के लिए बचाया गया था; साथ ही यह परमेश्वर की जीवन की पुस्तक में लोगों के नाम लिखे होने के व्यापक बाइबलीय विषय की भी प्रतिध्वनि है।
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיָה
  choice: तब ऐसा होगा कि
  rationale: यह भविष्यसूचक कथन की भूमिका को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और उसके भावी अर्थ को बनाए रखता है।
- source_word: הַנִּשְׁאָר
  choice: जो कोई ... बचा रहेगा
  rationale: निफ़अल कृदन्त किसी बचे हुए या जीवित बचे व्यक्ति को दर्शाता है; ‘जो कोई’ उसके सामान्य और प्रतिनिधिक भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: בְּצִיּוֹן
  choice: सिय्योन में
  rationale: स्थान-नाम के भौगोलिक और धर्मवैचारिक महत्व को बनाए रखा गया है।
- source_word: וְהַנּוֹתָר
  choice: और जो कोई ... शेष रहेगा
  rationale: यह पहले कृदन्त के समानान्तर बचे रहने का भाव व्यक्त करता है; ‘शेष रहेगा’ समानार्थक समानान्तरता में हल्की शब्दगत विविधता रखता है।
- source_word: בִּירוּשָׁלִַם
  choice: यरूशलेम में
  rationale: स्थानवाचक अर्थ का सीधा और मानक हिन्दी रूप।
- source_word: קָדוֹשׁ
  choice: पवित्र
  rationale: यह अभिषिक्त या परमेश्वर के लिए अलग किए जाने के गंभीर वाचा-संबंधी भाव को बनाए रखता है।
- source_word: יֵאָמֶר לוֹ
  choice: वह ... कहलाएगा
  rationale: निफ़अल क्रिया और अप्रत्यक्ष कर्म का स्वाभाविक हिन्दी मुहावरे में विधेयात्मक अर्थ यही है कि उस व्यक्ति को पवित्र कहा जाएगा।
- source_word: כָּל
  choice: हर वह व्यक्ति
  rationale: यह अगले कृदन्तीय वाक्यांश को स्पष्ट रूप से प्रत्येक संबंधित व्यक्ति पर लागू करता है।
- source_word: הַכָּתוּב
  choice: जिसका नाम ... लिखा गया है
  rationale: शाब्दिक अर्थ ‘जो लिखा हुआ है’ है; हिन्दी में व्यक्ति के किसी अभिलेख में दर्ज होने के लिए ‘जिसका नाम लिखा गया है’ स्वाभाविक है और पंजीकरण का भाव बनाए रखता है।
- source_word: לַחַיִּים
  choice: जीवन के लिए
  rationale: यह संक्षिप्त इब्रानी अभिव्यक्ति की अस्पष्टता बनाए रखता है—अर्थात जीवन हेतु दर्ज किया जाना या जीवित लोगों में लिखा होना—बिना इसे केवल किसी एक धर्मवैचारिक अर्थ तक सीमित किए।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: अन्तिम स्थानवाचक वाक्यांश को अभिलेख में लिखे जाने की अभिव्यक्ति के साथ बनाए रखा गया है।
theological_decisions:
- issue: क्या पद केवल शारीरिक रूप से जीवित बचे लोगों का उल्लेख करता है या परमेश्वर द्वारा पवित्र ठहराए गए शेष लोगों का
  choice: 'मुख्य पाठ दोनों आयामों को साथ रखता है: वे न्याय के बाद बचे हुए हैं, पवित्र कहलाते हैं और जीवन के लिए लिखे गए हैं।'
  alternative: इसे केवल ऐतिहासिक बचे हुए लोगों या स्पष्ट रूप से बाद में विकसित ‘जीवन की पुस्तक’ की धारणा के रूप में पढ़ना।
  rationale: इब्रानी पाठ स्वयं बचे रहने, पवित्र कहलाने और लिखे जाने की भाषा को जोड़ता है। अनुवाद इस धर्मवैचारिक तनाव को किसी एक अर्थ में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘जो कोई’ इब्रानी एकवचन कृदन्तों के सामान्य/प्रतिनिधिक अर्थ को दर्शाता है। ‘सिय्योन’, ‘यरूशलेम’ और ‘पवित्र’ जैसे मानक बाइबलीय शब्द बनाए गए हैं; ‘अर्थात’ अन्तिम खण्ड के व्याख्यात्मक-समानाधिकरण संबंध को स्पष्ट करता है।
