source:
  edition: WLC
  text: וְ/סֻכָּ֛ה תִּהְיֶ֥ה לְ/צֵל יוֹמָ֖ם מֵ/חֹ֑רֶב וּ/לְ/מַחְסֶה֙ וּ/לְ/מִסְתּ֔וֹר מִ/זֶּ֖רֶם וּ/מִ/מָּטָֽר־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/006.yaml
  text: And there will be a shelter for shade by day from heat[c][b][a], and for a refuge and a hiding place from storm and from rain.
translation:
  language: hi
  text: और दिन में झुलसानेवाली गर्मी से छाया के लिए एक आश्रय[a] होगा, और तूफ़ान[b] और वर्षा से बचने के लिए शरण और छिपने का स्थान होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “आश्रय” के स्थान पर “छप्पर” या “अस्थायी ढका हुआ आश्रय” भी हो सकता है; इब्रानी शब्द ऐसी अस्थायी संरचना पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: “तूफ़ान” के स्थान पर “तेज़ जलधारा,” “मूसलाधार वर्षा,” या “प्रचंड वर्षा-तूफ़ान” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: סֻכָּה
  choice: छप्पर
  rationale: यह शब्द अस्थायी ढकी हुई संरचना को दर्शाता है। 'छप्पर' उसके ठोस बिंब को बनाए रखता है और मौसम से रक्षा के प्रसंग में सहज है।
- source_word: תִּהְיֶה
  choice: होगा / होगी
  rationale: सरल भविष्यकाल को हिन्दी में संबंधित संज्ञाओं के लिंग के अनुसार व्यक्त किया गया है।
- source_word: לְצֵל
  choice: छाया देने के लिए
  rationale: गरमी से सुरक्षा के संदर्भ में 'छाया' स्वाभाविक है; क्रियात्मक रूप हिन्दी वाक्य को स्पष्ट बनाता है।
- source_word: יוֹמָם
  choice: दिन में
  rationale: यह दिन के समय को सूचित करने वाला क्रियाविशेषण है।
- source_word: מֵחֹרֶב
  choice: तपती गरमी से
  rationale: इस मौसम-संबंधी संदर्भ में शब्द तीखी या झुलसाने वाली गरमी का भाव देता है; केवल 'गरमी' की अपेक्षा यह उसकी तीव्रता अधिक स्पष्ट करता है।
- source_word: מַחְסֶה
  choice: शरणस्थान
  rationale: यह सुरक्षा के स्थान को दर्शाता है और अगले शब्द की विशिष्ट 'ओट' वाली छाया से अलग रहता है।
- source_word: מִסְתּוֹר
  choice: ओट
  rationale: यह छिपे या ढके हुए सुरक्षित स्थान का भाव संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: זֶרֶם
  choice: आँधी
  rationale: शब्द प्रचंड मौसम, बहाव या मूसलाधार वर्षा का अर्थ दे सकता है। साथ में 'वर्षा' होने के कारण मुख्य पाठ में 'आँधी' दोनों शब्दों को अलग रखता है।
- source_word: מָטָר
  choice: वर्षा
  rationale: यह सामान्यतः वर्षा के लिए प्रयुक्त शब्द है; यहाँ गरिमापूर्ण काव्यात्मक शैली में 'वर्षा' उपयुक्त है।
theological_decisions:
- issue: सुरक्षा के बिंब की प्रकृति
  choice: पद को मौसम से रक्षा करने वाली ठोस संरचना के काव्यात्मक वर्णन के रूप में प्रस्तुत किया गया है।
  alternative: मुख्य पाठ में इसे सीधे सिय्योन, परमेश्वर की उपस्थिति या मसीही सुरक्षा का प्रतीक बताना।
  rationale: इब्रानी पाठ गरमी, आँधी और वर्षा से सुरक्षा का बिंब देता है, पर इस पद में उसके किसी बाद के धर्मवैज्ञानिक अभिप्राय को स्पष्ट रूप से निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और हल्की काव्यात्मक शैली रखी गई है। समानार्थी सुरक्षा-शब्दों की अलग-अलग छवियाँ 'छप्पर', 'शरणस्थान' और 'ओट' द्वारा बनाए रखी गई हैं।
