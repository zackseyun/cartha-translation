  yaml_path: translation/ot/isaiah/013/003.yaml
  text: I myself have commanded my consecrated ones; I have also summoned my warriors for my anger[a], my proudly exulting ones.
translation:
  language: hi
  text: मैंने स्वयं मेरे लिए अलग किए हुओं को आज्ञा दी है; मैंने अपने क्रोध के प्रयोजन से अपने उन वीरों को भी बुलाया है जो मेरे गौरव में मगन हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो मेरी महिमा में आनन्दित होते हैं,” अथवा “जो मेरी विजय पर जयजयकार करते हैं।”
    reason: עַלִּיזֵי גַּאֲוָתִי पदबंध के संबंध और अर्थ में वास्तविक शब्दार्थगत अस्पष्टता है।
lexical_decisions:
- source_word: אֲנִי
  choice: मैंने स्वयं
  rationale: क्रिया के साथ स्वतंत्र सर्वनाम का प्रयोग बल देता है; ‘स्वयं’ उस बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: צִוֵּיתִי
  choice: आज्ञा दी है
  rationale: पिएल रूप का सामान्य अर्थ ‘आज्ञा देना/नियुक्त करना’ है; यहाँ पूर्ण की गई ईश्वरीय कार्रवाई को व्यक्त किया गया है।
- source_word: לִמְקֻדָּשָׁי
  choice: अपने लिए अलग किए हुओं को
  rationale: यह चयन קדשׁ के ‘किसी उद्देश्य के लिए अलग करना’ वाले भाव को रखता है और इन लोगों को अनिवार्य रूप से नैतिक रूप से पवित्र बताने से बचता है।
- source_word: גַּם קָרָאתִי
  choice: भी बुलाया है
  rationale: גַּם दूसरी समन्वित कार्रवाई जोड़ता है और קרא इस सैनिक संदर्भ में बुलाने अथवा एकत्र होने के लिए बुलावा देने का भाव रखता है।
- source_word: גִּבּוֹרַי
  choice: अपने वीरों को
  rationale: גִּבּוֹר शक्ति और युद्ध-पराक्रम वाले व्यक्ति को दर्शाता है; ‘वीर’ संक्षिप्त, स्वाभाविक और सैनिक संदर्भ के अनुकूल है।
- source_word: לְאַפִּי
  choice: अपने क्रोध को पूरा करने के लिए
  rationale: אַף यहाँ मुहावरे के रूप में ‘क्रोध’ है और לְ उद्देश्य सूचित करता है; हिन्दी वाक्यांश बताता है कि बुलाए गए वीर उस क्रोध के कार्य को अंजाम देंगे।
- source_word: עַלִּיזֵי גַּאֲוָתִי
  choice: जो मेरे गौरव पर मगन होते हैं
  rationale: संक्षिप्त और कठिन इब्रानी पदबंध को ‘मेरे गौरव से/पर हर्षित होनेवाले’ अर्थ में लिया गया है; अन्य संभव अर्थ फुटनोट में सुरक्षित हैं।
theological_decisions:
- issue: ‘अपने लिए अलग किए हुए’ लोगों की पवित्रता का स्वरूप
  choice: परमेश्वर के न्याय-संबंधी उद्देश्य के लिए अलग किए गए अभिकर्ता
  alternative: नैतिक रूप से पवित्र मनुष्य या स्वर्गदूत
  rationale: निकटवर्ती प्रसंग बाबेल के विरुद्ध सेनाओं को जुटाने का है; अतः पद कार्यगत रूप से अलग किए जाने की बात करता है, उनके नैतिक चरित्र का निर्णय नहीं देता।
- issue: עַלִּיזֵי גַּאֲוָתִי का संबंध और अर्थ
  choice: ‘जो मेरे गौरव पर मगन होते हैं’
  alternative: ‘जो मेरी महिमा में आनन्दित होते हैं’ अथवा ‘जो मेरी विजय पर जयजयकार करते हैं’
  rationale: इब्रानी पदबंध संक्षिप्त है और גַּאֲוָה गौरव, महिमा, उत्कर्ष या विजयगत गर्व का भाव दे सकता है; मुख्य पाठ एक निकट अर्थ रखता है और विकल्प फुटनोट में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पवित्र किए हुओं’ के स्थान पर ‘अपने लिए अलग किए हुओं’ से कार्यगत समर्पण स्पष्ट होता है और अनपेक्षित नैतिक निष्कर्ष से बचा जाता है।
