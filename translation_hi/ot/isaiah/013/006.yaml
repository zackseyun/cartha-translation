  text: הֵילִ֕ילוּ כִּ֥י קָר֖וֹב י֣וֹם יְהוָ֑ה כְּ/שֹׁ֖ד מִ/שַּׁדַּ֥י יָבֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/006.yaml
  text: Wail[a], for the day of Yahweh is near[b]; it will come like destruction from the Almighty.
translation:
  language: hi
  text: विलाप करो[a], क्योंकि याहवे का दिन निकट है; वह सर्वशक्तिमान की ओर से विनाश की तरह आएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हाहाकार करो”; इब्रानी आज्ञा शोक या आतंक की ऊँची पुकार के लिए है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “विनाश” (शोद) और “सर्वशक्तिमान” (शद्दाई) के बीच शब्द-ध्वनि का खेल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילִילוּ
  choice: विलाप करो
  rationale: बहुवचन आज्ञार्थक क्रिया ऊँचे स्वर में शोक या भय की पुकार व्यक्त करती है। “विलाप करो” आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है; उसकी तीव्रता को पादटिप्पणी स्पष्ट करती है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आज्ञा का कारण प्रस्तुत करता है और हिन्दी में संबंध को स्पष्ट रूप से व्यक्त करता है।
- source_word: קָרוֹב
  choice: निकट है
  rationale: यह आसन्नता बताने वाला विधेय विशेषण है; “निकट है” संक्षिप्त और भविष्यद्वाणी की शैली के अनुकूल है।
- source_word: יוֹם יְהוָה
  choice: याहवे का दिन
  rationale: यह याहवे के निर्णायक हस्तक्षेप और न्याय के दिन के लिए प्रयुक्त स्थापित भविष्यद्वाणी-संबंधी पदबंध है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: כְּשֹׁד
  choice: विनाश के समान
  rationale: שֹׁד यहाँ हिंसक विनाश या तबाही को सूचित करता है। “के समान” उपमा को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: מִשַּׁדַּי
  choice: सर्वशक्तिमान की ओर से
  rationale: מִן स्रोत को व्यक्त करता है, जबकि שַׁדַּי को दिव्य उपाधि मानकर अर्थानुसार अनूदित किया गया है।
- source_word: יָבֹוא
  choice: वह … आएगा
  rationale: पुल्लिंग एकवचन क्रिया का निकटतम व्याकरणिक संदर्भ “दिन” है; हिन्दी में “वह” इस संबंध को बनाए रखता है और भविष्यसूचक भाव को व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: यह पद उपाधि नहीं, मूल पाठ का व्यक्तिगत दिव्य नाम है; इसलिए उसे लिप्यंतरित करके सुरक्षित रखा गया है।
- issue: दिव्य उपाधि שַׁדַּי का अनुवाद
  choice: सर्वशक्तिमान
  alternative: शद्दाई
  rationale: इसे व्यक्तिगत नाम के बजाय अर्थपूर्ण दिव्य उपाधि के रूप में अनूदित किया गया है। मूल का שֹׁד–שַׁדַּי ध्वनि-साम्य हिन्दी में स्वाभाविक रूप से सुरक्षित नहीं रह सकता, इसलिए उसे पादटिप्पणी में बताया गया है।
- issue: יָבֹוא का संदर्भ
  choice: “वह” से “याहवे का दिन” अभिप्रेत
  alternative: इसे आसन्न विनाश के लिए निरपेक्ष “यह” के रूप में समझना
  rationale: क्रिया पुल्लिंग एकवचन है और “दिन” भी पुल्लिंग एकवचन है, इसलिए यह सीधा व्याकरणिक संबंध है; फिर भी कथन में आनेवाला विनाश प्रमुख अर्थगत विचार बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भविष्यद्वाणी-शैली रखी गई है। “विलाप करो” सामान्य पाठक के लिए स्पष्ट है, जबकि पादटिप्पणी मूल आज्ञा की अधिक तीखी ध्वनि बताती है। वाक्य में मूल की कारण-संरचना, आसन्नता और उपमा सुरक्षित हैं।
