reference: Isaiah 13:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בָּאִ֛ים מֵ/אֶ֥רֶץ מֶרְחָ֖ק מִ/קְצֵ֣ה הַ/שָּׁמָ֑יִם יְהוָה֙ וּ/כְלֵ֣י זַעְמ֔/וֹ לְ/חַבֵּ֖ל כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/005.yaml
  text: They are coming from a distant land[c][b][a], from the end of the heavens— Yahweh and the weapons of his wrath— to destroy the whole earth.
translation:
  language: hi
  text: वे दूर देश से, आकाश के छोर से[a] आ रहे हैं—याहवे और उसके प्रकोप के अस्त्र[b]—ताकि सारी पृथ्वी[c] को नष्ट कर दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आकाश की सबसे दूर की सीमाओं से।”
    reason: מִקְצֵה הַשָּׁמַיִם की अधिक विस्तारपूर्ण शाब्दिक अभिव्यक्ति।
  - marker: b
    text: या, “उसके प्रकोप के उपकरण।”
    reason: כְּלִי का व्यापक अर्थ ‘उपकरण/साधन’ भी हो सकता है, यद्यपि यहाँ सैन्य संदर्भ ‘अस्त्र’ का समर्थन करता है।
  - marker: c
    text: “सारी पृथ्वी” का अनुवाद “सारा देश” या “सारी भूमि” भी हो सकता है; पर इस पद की ब्रह्मांडीय भाषा व्यापक अर्थ का समर्थन करती है।
    reason: אֶרֶץ की वास्तविक शाब्दिक और संदर्भगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: בָּאִים
  choice: आ रहे हैं
  rationale: पुल्लिंग बहुवचन कृदंत की सजीव, जारी भविष्यसूचक गति को स्वाभाविक हिन्दी में व्यक्त करता है; कर्ता प्रसंग से निहित है।
- source_word: מֵאֶרֶץ מֶרְחָק
  choice: दूर देश से
  rationale: אֶרֶץ यहाँ बाद के כָּל הָאָרֶץ से भिन्न रूप में किसी दूरस्थ भूभाग या देश को दर्शाता है; यह संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: מִקְצֵה הַשָּׁמַיִם
  choice: आकाश के छोर से
  rationale: קָצֶה के 'छोर/सीमा' अर्थ को सुरक्षित रखता है और שָׁמַיִם के लिए हिन्दी का स्वाभाविक सामूहिक शब्द 'आकाश' प्रयोग करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: उपाधि से प्रतिस्थापित करने के बजाय इब्रानी व्यक्तिगत नाम का हिन्दी लिप्यंतरण किया गया है।
- source_word: וּכְלֵי זַעְמוֹ
  choice: और उसके प्रकोप के अस्त्र
  rationale: सैन्य और न्याय-संदर्भ में כְּלִי का अर्थ 'अस्त्र' उपयुक्त है; זַעַם की तीव्र दैवी अप्रसन्नता को 'प्रकोप' गरिमापूर्ण और स्पष्ट ढंग से व्यक्त करता है।
- source_word: לְחַבֵּל
  choice: ताकि ... नष्ट कर दें
  rationale: लामेद सहित अनंत क्रिया उद्देश्य बताती है; 'नष्ट करना' חבל की विनाशकारी शक्ति को स्पष्ट रखता है।
- source_word: כָּל הָאָרֶץ
  choice: सारी पृथ्वी
  rationale: निकटवर्ती ब्रह्मांडीय भाषा व्यापक अर्थ का समर्थन करती है, फिर भी 'देश/भूमि' की शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निजी नाम सीधे उपस्थित है; 'याहवे' उसे उपाधि में बदले बिना आधुनिक हिन्दी लिपि में प्रस्तुत करता है।
- issue: כָּל הָאָרֶץ में न्याय का विस्तार
  choice: सारी पृथ्वी
  alternative: सारा देश; सारी भूमि
  rationale: '''आकाश के छोर'' की ब्रह्मांडीय अभिव्यक्ति व्यापक अर्थ को समर्थन देती है, पर स्थानीय भूभाग का अर्थ व्याकरणतः संभव होने के कारण पादटिप्पणी में रखा गया है।'
- issue: याहवे और अस्त्रों का वाक्यगत संबंध
  choice: याहवे और उसके प्रकोप के अस्त्र—दोनों आने वालों के रूप में
  alternative: केवल अस्त्रों को आने वाला मानना
  rationale: मूल का समन्वयी पदबंध יְהוָה וּכְלֵי זַעְמוֹ सीधे आने वाले कर्ता की व्याख्या करता है; अनुवाद उसकी तीखी भविष्यसूचक रचना को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यसूचक शैली रखी गई है। 'याहवे', 'प्रकोप' और 'अस्त्र' गंभीरता बनाए रखते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए स्पष्ट है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबद्ध पदों के बाद दिए गए हैं।
