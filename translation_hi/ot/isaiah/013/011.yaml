source:
  edition: WLC
  text: וּ/פָקַדְתִּ֤י עַל תֵּבֵל֙ רָעָ֔ה וְ/עַל רְשָׁעִ֖ים עֲוֺנָ֑/ם וְ/הִשְׁבַּתִּי֙ גְּא֣וֹן זֵדִ֔ים וְ/גַאֲוַ֥ת עָרִיצִ֖ים אַשְׁפִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/011.yaml
  text: And I will punish the world for its evil[a], and the wicked for their iniquity; I will put an end to the pride of the arrogant[b], and I will humble the haughtiness of the ruthless.
translation:
  language: hi
  text: मैं दुनिया को उसकी बुराई के लिए[a] और दुष्टों को उनके अधर्म के लिए दंड दूँगा; मैं अभिमानियों के घमंड का अंत कर दूँगा और निर्दयों के अहंकार को नीचा कर दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दुनिया’ का अर्थ यहाँ ‘बसा हुआ जगत’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי
  choice: मैं ... दण्ड दूँगा
  rationale: פָקַד का अर्थ-क्षेत्र व्यापक है, पर עַל के साथ बुराई और दुष्टों को कर्म-विषय बनाने पर यहाँ न्यायात्मक दण्ड का भाव स्पष्ट है।
- source_word: תֵּבֵל
  choice: संसार
  rationale: यह शब्द सामान्यतः बसे हुए जगत या मानव-संसार को सूचित करता है। 'संसार' आधुनिक हिन्दी में स्वाभाविक है और पद के व्यापक न्याय-क्षेत्र को बनाए रखता है।
- source_word: רָעָה
  choice: उसकी बुराई
  rationale: दुष्टों और उनके अधर्म के समानांतर होने के कारण यहाँ नैतिक बुराई अभिप्रेत है, विपत्ति नहीं। 'उसकी' से संसार के साथ सम्बन्ध स्पष्ट होता है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: यह बहुवचन संज्ञार्थक विशेषण है; 'दुष्टों' उसका संक्षिप्त और प्रचलित हिन्दी समतुल्य है।
- source_word: עֲוֺנָם
  choice: उनके अधर्म
  rationale: עָוֹן अपराध, दोष या उसके दण्ड का अर्थ दे सकता है; यहाँ दण्ड का नैतिक कारण अभिप्रेत है। 'अधर्म' इस नैतिक भार को बनाए रखता है।
- source_word: וְהִשְׁבַּתִּי
  choice: अन्त कर दूँगा
  rationale: שׁבת के हिफ़ईल रूप का अर्थ किसी वस्तु को रुकवा देना या समाप्त कर देना है; यह वाक्यांश उसके कारक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גְּאוֹן
  choice: घमण्ड
  rationale: זֵדִים के साथ यह आत्मोन्नति के नकारात्मक भाव में है। 'घमण्ड' स्पष्ट और सहज है।
- source_word: זֵדִים
  choice: अभिमानियों
  rationale: यह शब्द ढीठ, उद्दण्ड या अभिमानी लोगों को सूचित करता है। 'अभिमानियों' घमण्ड के साथ स्वाभाविक सम्बन्ध बनाते हुए व्यक्ति-समूह का भाव रखता है।
- source_word: וְגַאֲוַת
  choice: अहंकार
  rationale: यह पहले प्रयुक्त גְּאוֹן का निकटार्थी है। 'अहंकार' समान अर्थ-क्षेत्र रखते हुए हिन्दी में काव्यात्मक समानांतरता और हल्का शब्द-भेद बनाए रखता है।
- source_word: עָרִיצִים
  choice: निर्दयों
  rationale: עָרִיץ हिंसक, अत्याचारी और कठोर लोगों के लिए आता है। 'निर्दयों' इसे केवल औपचारिक शासकों तक सीमित किए बिना उसका नैतिक-सामाजिक बल व्यक्त करता है।
- source_word: אַשְׁפִּיל
  choice: नीचा कर दूँगा
  rationale: שׁפל के हिफ़ईल रूप का मूल चित्र ऊँचे को नीचा करने का है। यह चयन उस प्रतिलोम दृश्य को 'नम्र करूँगा' की अपेक्षा अधिक प्रत्यक्ष रूप से बचाता है।
theological_decisions:
- issue: תֵּבֵל में ईश्वरीय न्याय का क्षेत्र
  choice: यह पद बसे हुए मानव-संसार पर परमेश्वर के न्याय की व्यापक भाषा को बनाए रखता है।
  alternative: इसे केवल 'देश' या केवल बाबेल तक सीमित समझना।
  rationale: यशायाह 13 का प्रसंग बाबेल-विरोधी है, फिर भी यहाँ תֵּבֵל और दुष्टों के अधर्म की सार्वभौमिक भाषा आती है। अनुवाद इस तनाव को किसी संकीर्ण व्याख्या से समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। समानांतर इब्रानी पंक्तियों में 'घमण्ड/अहंकार' तथा 'अन्त कर दूँगा/नीचा कर दूँगा' का भेद रखा गया है। मुख्य पाठ में एकमात्र पादटिप्पणी-चिह्न [a] ठीक सम्बन्धित पद के बाद दिया गया है।
