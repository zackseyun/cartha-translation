id: ISA.13.2
reference: Isaiah 13:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַ֤ל הַר נִשְׁפֶּה֙ שְֽׂאוּ נֵ֔ס הָרִ֥ימוּ ק֖וֹל לָ/הֶ֑ם הָנִ֣יפוּ יָ֔ד וְ/יָבֹ֖אוּ פִּתְחֵ֥י נְדִיבִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/002.yaml
  text: On a bare mountain raise a signal[a]; lift up the voice to them; wave the hand[c][b], that they may enter the gates of the nobles.
translation:
  language: hi
  text: एक उजाड़ पहाड़ पर संकेत-ध्वज[a] खड़ा करो; उनके लिए आवाज़ ऊँची करो; हाथ हिलाओ[b], ताकि वे रईसों के फाटकों[c] में प्रवेश करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “झंडा” अथवा “पताका।” इब्रानी נֵס प्रायः सेना को जुटाने या दिशा देने के लिए ऊँचा किए गए चिह्न को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “हाथ से उन्हें बुलाओ।” यह हाव-भाव सम्भवतः आक्रमणकारी सेना को आगे आने का बुलावा है।
    reason: lexical_alternative
  - marker: c
    text: या “प्रधानों के फाटकों।” इब्रानी נְדִיבִים रईसों, प्रधानों या अन्य प्रतिष्ठित लोगों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁפֶּה
  choice: उजाड़
  rationale: यह शब्द ऐसे पहाड़ का चित्र देता है जो वनस्पति या आवरण से रहित, खुला पड़ा है। ‘उजाड़’ आधुनिक हिन्दी में स्वाभाविक है और संकेत के लिए स्पष्ट ऊँचाई का दृश्य बनाए रखता है।
- source_word: נֵס
  choice: संकेत-ध्वज
  rationale: सैन्य और भविष्यवाणी-संबंधी प्रसंगों में यह ऊँचा किया गया ऐसा चिह्न है जिससे लोगों या सेना को जुटाया अथवा दिशा दी जाती है। ‘संकेत-ध्वज’ उसके रूप और कार्य दोनों को व्यक्त करता है।
- source_word: הָרִימוּ קוֹל
  choice: पुकारो
  rationale: शाब्दिक मुहावरा ‘आवाज़ ऊँची करो’ है; इस प्रसंग में ‘पुकारो’ उसका स्वाभाविक और संक्षिप्त हिन्दी रूप है।
- source_word: לָהֶם
  choice: उन्हें
  rationale: ל यहाँ पुकार की दिशा बताता है। ‘उन्हें’ आक्रमणकारी दल की ओर निर्देशित बुलाहट को बिना अतिरिक्त व्याख्या के रखता है।
- source_word: הָנִיפוּ יָד
  choice: हाथ हिलाकर संकेत दो
  rationale: मूल में हाथ को हिलाने का ठोस चित्र है, जबकि प्रसंग में उसका कार्य बुलाना या आगे आने का संकेत देना है। यह अनुवाद दोनों पक्षों को बनाए रखता है।
- source_word: וְיָבֹאוּ
  choice: ताकि वे ... प्रवेश करें
  rationale: आज्ञार्थक क्रियाओं के बाद यह रूप प्रयोजन या परिणाम प्रकट करता है। अगले शब्द ‘फाटकों’ के साथ ‘प्रवेश करें’ स्वाभाविक है।
- source_word: פִּתְחֵי
  choice: फाटकों
  rationale: बहुवचन रचना प्रवेश-स्थानों को दर्शाती है; नगर या गढ़ के प्रसंग में ‘फाटक’ सबसे उपयुक्त हिन्दी शब्द है।
- source_word: נְדִיבִים
  choice: रईसों
  rationale: यहाँ शब्द उच्च पद या प्रतिष्ठा वाले लोगों को सूचित करता है। ‘रईस’ व्यापक है और ‘राजकुमारों’ जैसी अधिक विशिष्ट व्याख्या को मुख्य पाठ पर नहीं थोपता।
