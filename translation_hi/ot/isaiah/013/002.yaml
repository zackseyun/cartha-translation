  register: आधुनिक, गरिमापूर्ण और मौखिक रूप से सहज मानक हिन्दी। समानांतर आज्ञाओं की तीव्रता बनाए रखने के लिए छोटे क्रियापद रखे गए हैं। ‘रईस’ सामान्य पाठक के लिए बोधगम्य है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
