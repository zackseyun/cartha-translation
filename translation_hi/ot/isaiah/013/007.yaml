  yaml_path: translation/ot/isaiah/013/007.yaml
  text: Therefore all hands will grow weak[a], and every human heart will melt.
translation:
  language: hi
  text: इसलिए सब हाथ ढीले पड़ जाएँगे, और हर मनुष्य[a] का हृदय पिघल जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हर नश्वर मनुष्य का हृदय।” इब्रानी אֱנוֹשׁ सामान्य रूप से मनुष्य को दर्शाता है और प्रायः उसमें मानवीय दुर्बलता या नश्वरता का भाव भी होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पद पिछले न्याय-वर्णन का परिणाम बताता है; ‘इसलिए’ उसके निष्कर्षात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל יָדַיִם
  choice: सब हाथ
  rationale: इब्रानी बहुवचन सामूहिक है। ‘सब हाथ’ कार्य और सामर्थ्य के चुक जाने की सजीव शारीरिक छवि बनाए रखता है।
- source_word: תִּרְפֶּינָה
  choice: ढीले पड़ जाएँगे
  rationale: רפה का अर्थ ढीला, निर्बल या शिथिल हो जाना है। ‘ढीले पड़ जाएँगे’ हाथों की मूल छवि और सामर्थ्य खोने का भाव दोनों बनाए रखता है।
- source_word: וְכָל לְבַב אֱנוֹשׁ
  choice: और हर मनुष्य का हृदय
  rationale: לְבַב भीतरी साहस और संकल्प का केंद्र है, जबकि אֱנוֹשׁ यहाँ सामान्य मानव को उसकी दुर्बलता के संकेत सहित दर्शाता है। ‘हर मनुष्य’ सामान्य, गैर-लिंग-विशिष्ट संदर्भ को स्पष्ट रखता है।
- source_word: יִמָּס
  choice: पिघल जाएगा
  rationale: क्रिया का शाब्दिक अर्थ ‘पिघलना’ है और यहाँ भय से साहस टूटने का रूपक है। शाब्दिक छवि को बनाए रखना हिन्दी में भी स्वाभाविक है।
theological_decisions:
- issue: सामान्य मानव-संदर्भ में אֱנוֹשׁ का अनुवाद
  choice: मनुष्य
  alternative: नश्वर मनुष्य / मानव
  rationale: אֱנוֹשׁ किसी पुरुष विशेष के बजाय सामान्य मानव को दर्शाता है और उसमें दुर्बलता अथवा नश्वरता की छाया हो सकती है। ‘मनुष्य’ प्रतिनिधिक और स्वाभाविक हिन्दी है; ‘नश्वर मनुष्य’ उस अंतर्निहित भाव को अधिक स्पष्ट करता, पर मुख्य पाठ में कुछ अधिक व्याख्यात्मक होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और चित्रात्मक भाषा रखी गई है। ‘हाथ ढीले पड़ना’ और ‘हृदय पिघलना’ मूल इब्रानी की समानांतर शारीरिक रूपक-छवियों को सुरक्षित रखते हैं।
