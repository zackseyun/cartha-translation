- source_word: כָּל הַנִּמְצָא
  choice: जो कोई पाया जाएगा
  rationale: כָּל का वितरणात्मक बल और Niphal कृदन्त הַנִּמְצָא का कर्मवाच्य अर्थ सुरक्षित रहता है; यह स्वाभाविक आधुनिक हिन्दी भी है।
- source_word: יִדָּקֵר
  choice: आर-पार बेधा जाएगा
  rationale: דקר के Niphal रूप में हथियार से छेदे या भेदे जाने का तीव्र भाव है; ‘आर-पार बेधा’ उस युद्धजनित हिंसा को स्पष्ट करता है।
- source_word: וְכָל הַנִּסְפֶּה
  choice: और जो कोई विनाश में समेट लिया जाएगा
  rationale: ספה के कृदन्त में साथ कर लिए जाने, समेटे जाने या बहा ले जाए जाने की व्यापक सम्भावना है। यह चयन तत्काल न्याय-विनाश के प्रसंग के अनुकूल है और केवल ‘पकड़े जाने’ तक अर्थ को सीमित नहीं करता।
- source_word: יִפּוֹל בֶּחָרֶב
  choice: तलवार से मारा जाएगा
  rationale: शाब्दिक अर्थ ‘तलवार से गिरेगा’ है, पर युद्ध-सन्दर्भ में נפל + בחרב मृत्यु का स्वाभाविक मुहावरा है; हिन्दी में ‘मारा जाएगा’ आशय को स्पष्ट और सहज रखता है।
