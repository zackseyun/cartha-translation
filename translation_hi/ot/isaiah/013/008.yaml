  text: וְֽ/נִבְהָ֓לוּ צִירִ֤ים וַֽ/חֲבָלִים֙ יֹֽאחֵז֔וּ/ן כַּ/יּוֹלֵדָ֖ה יְחִיל֑וּ/ן אִ֤ישׁ אֶל רֵעֵ֨/הוּ֙ יִתְמָ֔הוּ פְּנֵ֥י לְהָבִ֖ים פְּנֵי/הֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/008.yaml
  text: They will be dismayed; pains and labor pangs will seize them[a]. They will writhe like a woman giving birth. Each man will stare at his neighbor; their faces will be faces of flame.
translation:
  language: hi
  text: वे व्याकुल हो जाएँगे; पीड़ाएँ और प्रसव-वेदनाएँ उन्हें जकड़ लेंगी। वे प्रसव करती हुई स्त्री की तरह तड़पेंगे। हर आदमी अपने साथी को स्तब्ध होकर देखेगा; उनके चेहरे ज्वालाओं जैसे होंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “ज्वालाओं के चेहरे उनके चेहरे हैं।” यह सजीव इब्रानी चित्र उनके चेहरों के दहक उठने या चेहरे पर दिखाई देनेवाले आतंक की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִבְהָלוּ
  choice: वे घबरा जाएँगे
  rationale: निफ़ाल रूप अचानक भय और व्याकुलता की अवस्था में पड़ने का भाव देता है; यह हिंदी में स्वाभाविक और अर्थानुकूल है।
- source_word: צִירִים וַחֲבָלִים
  choice: पीड़ा और प्रसव-वेदनाएँ
  rationale: पहला शब्द व्यापक शारीरिक पीड़ा और दूसरा प्रसव की ऐंठन दर्शाता है; दोनों को अलग रखते हुए आगामी उपमा स्पष्ट होती है।
- source_word: יֹאחֵזוּן
  choice: उन्हें जकड़ लेंगी
  rationale: אחז का मूल अर्थ पकड़ना या कब्ज़े में लेना है; पीड़ा के संदर्भ में ‘जकड़ लेना’ सजीव और स्वाभाविक है।
- source_word: כַּיּוֹלֵדָה יְחִילוּן
  choice: वे जनती हुई स्त्री के समान तड़पेंगे
  rationale: יולדה प्रसव कर रही स्त्री को और יחילון पीड़ा में ऐंठने या तड़पने को व्यक्त करता है।
- source_word: אִישׁ אֶל־רֵעֵהוּ יִתְמָהוּ
  choice: हर एक अपने साथी को स्तब्ध होकर देखेगा
  rationale: वाक्यांश वितरणात्मक है और תמה विस्मय या आतंक में जड़ होकर देखने का भाव देता है। ‘हर एक’ सामान्य हिब्रू मुहावरे को सहज हिंदी में व्यक्त करता है।
- source_word: פְּנֵי לְהָבִים פְּנֵיהֶם
  choice: उनके चेहरे ज्वाला-समान होंगे
  rationale: शाब्दिक रूप ‘उनके चेहरे ज्वालाओं के चेहरे’ अत्यंत अस्वाभाविक हिंदी होगा; ‘ज्वाला-समान’ मूल की तीव्र रूपकात्मक छवि बचाता है, जबकि उसका सटीक संकेत खुला रखता है।
