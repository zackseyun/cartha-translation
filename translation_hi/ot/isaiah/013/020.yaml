  text: לֹֽא תֵשֵׁ֣ב לָ/נֶ֔צַח וְ/לֹ֥א תִשְׁכֹּ֖ן עַד דּ֣וֹר וָ/ד֑וֹר וְ/לֹֽא יַהֵ֥ל שָׁם֙ עֲרָבִ֔י וְ/רֹעִ֖ים לֹא יַרְבִּ֥צוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/020.yaml
  text: It will never be inhabited[a], and it will not be dwelt in from generation to generation; no Arab will pitch his tent there, and shepherds will not make their flocks lie down there.
translation:
  language: hi
  text: वह फिर कभी आबाद नहीं होगी, और पीढ़ी-दर-पीढ़ी उसमें कोई नहीं बसेगा; कोई अरब[a] वहाँ अपना तंबू नहीं लगाएगा, और चरवाहे वहाँ अपने झुंडों को नहीं लिटाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मरुभूमि का कोई खानाबदोश।” हिब्रू शब्द विशेष रूप से किसी अरब को, अथवा इस प्रसंग में अधिक व्यापक रूप से मरुभूमि में घूमने वाले खानाबदोश को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵשֵׁב
  choice: आबाद नहीं होगी
  rationale: יָשַׁב का मूल अर्थ ‘बैठना/बसना’ है, पर नगर के विषय में यह ‘आबाद होना’ दर्शाता है; स्त्रीलिंग क्रिया प्रसंग में बाबेल नगर के अनुरूप है।
- source_word: לָנֶצַח
  choice: फिर कभी नहीं
  rationale: निषेध के साथ यह अनंत अवधि को व्यक्त करता है; आधुनिक हिन्दी में ‘फिर कभी नहीं’ स्थायी उजाड़ का भाव स्वाभाविक रूप से देता है।
- source_word: תִשְׁכֹּן
  choice: उसमें कोई निवास नहीं करेगा
  rationale: שָׁכַן का अर्थ बसना या निवास करना है। हिन्दी में अव्यक्त निवासियों को ‘कोई’ के द्वारा व्यक्त करना स्वाभाविक है और पहले क्रियापद ‘आबाद होना’ से भेद भी बनाए रखता है।
- source_word: עַד דּוֹר וָדוֹר
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह लगातार आने वाली पीढ़ियों में जारी रहने की अवधि बताने वाला हिब्रू मुहावरा है।
- source_word: יַהֵל
  choice: अपना तंबू नहीं लगाएगा
  rationale: यह क्रिया तंबू गाड़कर पड़ाव डालने को दर्शाती है; स्पष्ट चित्रात्मक हिन्दी के लिए ‘तंबू लगाना’ चुना गया है।
- source_word: עֲרָבִי
  choice: अरबवासी
  rationale: शब्द का सीधा अर्थ अरब या अरब का निवासी है। प्रसंग में मरुभूमि के खानाबदोश का व्यापक संकेत संभव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: רֹעִים
  choice: चरवाहे
  rationale: רעה से बना यह रूप पशुओं के झुंड चराने वालों को दर्शाता है; ‘चरवाहे’ इसका स्पष्ट और प्रचलित हिन्दी पर्याय है।
- source_word: יַרְבִּצוּ
  choice: अपने झुंडों को नहीं बैठाएँगे
  rationale: हिफ़ील रूप का अर्थ ‘लिटाना/बैठाना, विश्राम कराना’ है। कर्म मूल में व्यक्त नहीं है, पर चरवाहों के प्रसंग से उनके झुंड अभिप्रेत हैं; इसे हिन्दी में स्पष्ट किया गया है।
