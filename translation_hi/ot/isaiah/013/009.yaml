source:
  edition: WLC
  text: הִנֵּ֤ה יוֹם יְהוָה֙ בָּ֔א אַכְזָרִ֥י וְ/עֶבְרָ֖ה וַ/חֲר֣וֹן אָ֑ף לָ/שׂ֤וּם הָ/אָ֨רֶץ֙ לְ/שַׁמָּ֔ה וְ/חַטָּאֶ֖י/הָ יַשְׁמִ֥יד מִמֶּֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/009.yaml
  text: Behold[a], the day of Yahweh is coming—cruel, with wrath and fierce anger—to make the land a desolation[d][c][b], and he will destroy its sinners from it.
translation:
  language: hi
  text: देखो, यहोवा का दिन आ रहा है—निर्दयी, रोष और धधकते क्रोध के साथ—ताकि पृथ्वी को उजाड़ बना दे और उसके पापियों को उसमें से नष्ट कर दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: भविष्यद्वाणी की ओर ध्यान खींचने वाली शक्ति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: יוֹם יְהוָה
  choice: यहोवा का दिन
  rationale: हिब्रू के प्रचलित भविष्यद्वाणीय पदबंध और परमेश्वर के विशिष्ट नाम को प्रत्यक्ष रूप से प्रस्तुत करता है।
- source_word: בָּא
  choice: आ रहा है
  rationale: निश्चित और निकट भविष्य की सजीव घोषणा को व्यक्त करता है।
- source_word: אַכְזָרִי
  choice: निर्दयी
  rationale: आने वाले दिन के कठोर और न बख्शने वाले स्वरूप को सामान्य हिन्दी में स्पष्ट करता है।
- source_word: וְעֶבְרָה וַחֲרוֹן אָף
  choice: रोष और धधकते क्रोध से भरा हुआ
  rationale: हिब्रू में क्रोध के लिए प्रयुक्त अनेक तीव्र पदों के संचय को बनाए रखता है; 'धधकता' חֲרוֹן के ताप संबंधी बिंब को व्यक्त करता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: אֶרֶץ का अर्थ 'देश/भूमि' भी हो सकता है, पर अध्याय के व्यापक और विश्वव्यापी न्याय-संदर्भ में 'पृथ्वी' उपयुक्त है।
- source_word: לְשַׁמָּה
  choice: उजाड़
  rationale: विनाश और निर्जनता का अर्थ संक्षिप्त, स्वाभाविक और भविष्यद्वाणीय गरिमा के साथ देता है।
- source_word: וְחַטָּאֶיהָ
  choice: उसके पापियों
  rationale: स्त्रीलिंग प्रत्यय को पूर्ववर्ती 'पृथ्वी' से जोड़ते हुए मूल की संक्षिप्त अभिव्यक्ति सुरक्षित रखता है।
- source_word: יַשְׁמִיד מִמֶּנָּה
  choice: उसमें से नष्ट कर दे
  rationale: निर्णायक विनाश और पृथ्वी से हटाए जाने, दोनों को मूल के निकट रखते हुए व्यक्त करता है।
theological_decisions:
- issue: יַשְׁמִיד का कर्ता
  choice: स्पष्ट सर्वनाम जोड़े बिना उद्देश्यवाचक क्रम में 'नष्ट कर दे'
  alternative: '''वह नष्ट कर देगा''—कर्ता यहोवा; अथवा ''वह दिन नष्ट कर देगा'''
  rationale: हिब्रू पुल्लिंग एकवचन क्रिया का कर्ता यहोवा अथवा निकटवर्ती 'दिन' समझा जा सकता है। हिन्दी में लगातार उद्देश्यवाचक रचना दोनों संभावनाओं को अनावश्यक रूप से तय किए बिना अर्थ स्पष्ट रखती है।
- issue: הָאָרֶץ का क्षेत्र
  choice: पृथ्वी
  alternative: देश/भूमि
  rationale: शब्द दोनों अर्थ रखता है; निकटवर्ती पदों का विश्वव्यापी और ब्रह्मांडीय परिप्रेक्ष्य 'पृथ्वी' का समर्थन करता है, यद्यपि स्थानीय 'देश' संभव है।
- issue: יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: विशिष्ट ईश्वरीय नाम को नाम के रूप में बनाए रखता है और हिन्दी पाठकों के लिए परिचित रूप अपनाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गंभीर भविष्यद्वाणीय शैली, पर अत्यधिक संस्कृतनिष्ठ या पुरातन शब्दावली से परहेज। मूल के क्रोध-संबंधी पदों की तीव्रता और कर्ता की संभावित अस्पष्टता सुरक्षित रखी गई है।
