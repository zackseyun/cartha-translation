  text: उनके शिशु उनकी आँखों के सामने पटककर टुकड़े-टुकड़े कर दिए जाएँगे; उनके घरों को लूट लिया जाएगा, और उनकी पत्नियों का बलात्कार किया जाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मसोराई परंपरा के लिखित रूप में एक कठोर शब्द है, जिसका अर्थ यौन हिंसा है। पढ़ा जाने वाला रूप शाब्दिक रूप से ‘उनके साथ शयन किया जाएगा’ है। इस प्रसंग में दोनों रूप बलात्कार का संकेत करते हैं।
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: עֹלְלֵיהֶם
  choice: उनके शिशु
  rationale: עֹלֵל बहुत छोटे बच्चों या शिशुओं को सूचित करता है। ‘शिशु’ उनकी कम आयु और असहायता को स्वाभाविक, संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: יְרֻטְּשׁוּ
  choice: पटककर टुकड़े-टुकड़े कर दिए जाएँगे
  rationale: רטש का यह कर्मवाच्य रूप युद्ध में हिंसक ढंग से पटककर चूर करने का अर्थ देता है। यह अनुवाद मूल की क्रूरता को नरम नहीं करता।
- source_word: לְעֵינֵיהֶם
  choice: उनकी आँखों के सामने
  rationale: यह इब्रानी मुहावरा बताता है कि घटना उन्हीं के देखते-देखते होगी; आधुनिक हिन्दी में यही सबसे स्वाभाविक समतुल्य है।
- source_word: יִשַּׁסּוּ
  choice: लूट लिए जाएँगे
  rationale: שסס/שסה का अर्थ लूटना या संपत्ति छीन लेना है। ‘घर’ को कर्ता बनाए रखने के लिए हिन्दी में कर्मवाच्य प्रयोग स्वाभाविक है।
- source_word: בָּתֵּיהֶם
  choice: उनके घर
  rationale: בַּיִת का सीधा और प्रसंगानुकूल अर्थ ‘घर’ है।
- source_word: וּנְשֵׁיהֶם
  choice: उनकी पत्नियों
  rationale: बहुवचन संबंधसूचक रूप में אִשָּׁה यहाँ सबसे स्वाभाविक रूप से ‘उनकी पत्नियाँ’ है, न कि अधिक व्यापक ‘उनकी स्त्रियाँ’।
- source_word: תשגלנה
  choice: के साथ बलात्कार किया जाएगा
  rationale: שגל यौन हिंसा के लिए प्रयुक्त स्पष्ट और कठोर शब्द है। ‘बलात्कार’ आधुनिक हिन्दी में उसका सीधा अर्थ बताता है और इस युद्ध-अपराध को शिष्टोक्ति से नहीं ढकता।
theological_decisions:
- issue: न्याय-वाणी में यौन हिंसा के कठोर शब्द का अनुवाद
  choice: उनकी पत्नियों के साथ बलात्कार किया जाएगा
  alternative: उनकी पत्नियों का अपमान किया जाएगा / उनके साथ सहवास किया जाएगा
  rationale: लिखित इब्रानी रूप שגל यौन आक्रमण का कठोर शब्द है। मुख्य पाठ में स्पष्ट आधुनिक शब्द रखना मूल की भयावहता को सुरक्षित रखता है; नरम विकल्प उसका अर्थ कम कर देंगे। मसोराई पढ़े जाने वाले रूप की भिन्नता पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, स्पष्ट और गरिमापूर्ण है। पद की अत्यंत हिंसक सामग्री को न तो सनसनीखेज बनाया गया है, न शिष्टोक्ति द्वारा नरम किया गया है। समानांतर उपवाक्यों और कर्मवाच्य संरचना से इब्रानी काव्य-वाणी का गंभीर स्वर बनाए रखा गया है।
