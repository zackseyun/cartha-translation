lexical_decisions:
- source_word: הִנְנִי
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले हिब्रू उद्घोष और प्रथम-पुरुष दैवी घोषणा को आधुनिक, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵעִיר
  choice: मैं ... उकसा रहा हूँ
  rationale: עור के हिफ़ईल कृदन्त में किसी को उठाकर कार्रवाई के लिए प्रेरित करने का भाव है; वर्तमान प्रगतिशील रूप आसन्न दैवी कार्रवाई को बनाए रखता है।
- source_word: עֲלֵיהֶם
  choice: उनके विरुद्ध
  rationale: सैन्य और शत्रुतापूर्ण संदर्भ में על का स्वाभाविक अर्थ ‘के विरुद्ध’ है।
- source_word: אֶת מָדָי
  choice: मादियों को
  rationale: מָדָי यहाँ भूभाग से अधिक जाति/राष्ट्र के लोगों को सूचित करता है; ‘मादी’ इसका प्रचलित हिन्दी जातिनाम है।
- source_word: כֶּסֶף לֹא יַחְשֹׁבוּ
  choice: चाँदी को कुछ नहीं समझते
  rationale: חשב का अर्थ यहाँ मानसिक रूप से सोचने के बजाय किसी वस्तु को महत्त्व देना या उसका मूल्य आँकना है; यह हिन्दी मुहावरा उनकी धन के प्रति उदासीनता व्यक्त करता है।
- source_word: וְזָהָב לֹא יַחְפְּצוּ בוֹ
  choice: और सोने से प्रसन्न नहीं होते
  rationale: חפץ में इच्छा, रुचि और प्रसन्नता का भाव है; यह अनुवाद उस भावात्मक अर्थ को बनाए रखता है और בו को ‘सोने से’ में व्यक्त करता है।
