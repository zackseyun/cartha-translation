base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/018.yaml
  text: And their bows will dash young men to pieces[a]; they will show no compassion on the fruit of the womb[b]; their eyes will not spare children.
translation:
  language: hi
  text: और उनके धनुष जवानों को चकनाचूर कर देंगे[a]; वे गर्भ के फल पर दया नहीं करेंगे; उनकी आँखें बच्चों[b] को नहीं बख्शेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके धनुष जवानों को तोड़ डालेंगे”; कुछ लोग “धनुष” को लक्षणा के रूप में “धनुर्धर” समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “पुत्रों”; यहाँ इसका व्यापक अर्थ “बच्चों” का होना संभावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קְשָׁתוֹת
  choice: धनुषें
  rationale: मूल शब्द का सामान्य अर्थ ‘धनुष’ है और स्त्रीलिंग बहुवचन क्रिया से इसका स्वाभाविक मेल है; इसलिए इसे धनुर्धरों के अर्थ में नहीं बदला गया।
- source_word: נְעָרִים
  choice: जवानों
  rationale: यह शब्द लड़कों, युवकों या जवान पुरुषों को सूचित कर सकता है; युद्ध-संबंधी प्रसंग में ‘जवानों’ से युवा अवस्था का भाव स्वाभाविक रूप से प्रकट होता है।
- source_word: תְּרַטַּשְׁנָה
  choice: चकनाचूर कर देंगी
  rationale: पिएल रूप हिंसक ढंग से तोड़ डालने या टुकड़े कर देने का भाव रखता है; यह अभिव्यक्ति मूल की कठोरता को बिना नरम किए संप्रेषित करती है।
- source_word: פְרִי בֶטֶן
  choice: गर्भ के फल
  rationale: यह संतानों के लिए प्रयुक्त इब्रानी मुहावरा है; ‘गर्भ के फल’ उसके चित्रात्मक और मार्मिक स्वरूप को बनाए रखता है।
- source_word: יְרַחֵמוּ
  choice: दया नहीं करेंगी
  rationale: क्रिया करुणा या दया का भाव व्यक्त करती है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: בָּנִים
  choice: बच्चों
  rationale: शाब्दिक अर्थ ‘पुत्र’ है, पर इस समानांतर प्रसंग में यह व्यापक रूप से संतानों या बच्चों के लिए प्रयुक्त जान पड़ता है।
- source_word: תָחוּס עֵינָם
  choice: उनकी आँखें ... नहीं बख्शेंगी
  rationale: इब्रानी का शाब्दिक चित्र ‘उनकी आँख ... नहीं बख्शेगी’ है; हिन्दी में बहुवचन ‘आँखें’ अधिक स्वाभाविक है और निर्दयतापूर्वक न बख्शने का भाव बनाए रखता है।
