base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/022.yaml
  text: Hyenas will cry out in her palaces[a], and jackals in her luxurious halls. Her time is near to come[c][b], and her days will not be prolonged.
translation:
  language: hi
  text: 'लकड़बग्घे[a] उसके महलों[b] में चिल्लाएँगे,

    और सियार उसके विलासमय भवनों में।

    उसका समय आने को निकट है[c],

    और उसके दिन लंबे नहीं किए जाएँगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘लकड़बग्घे’ के लिए इब्रानी शब्द אִיִּים का सटीक प्राणी-वाचक अर्थ अनिश्चित है; इसका अनुवाद ‘जंगली पशु’ या ‘सियार’ भी किया जाता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ का इब्रानी शब्द कठिन है। इसका अधिक शाब्दिक अर्थ ‘उसकी विधवाओं में’ समझा जा सकता है, पर प्रसंग और समानांतर पंक्ति भव्य भवनों या महलों की ओर संकेत करते हैं।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में बाबेल नगरी को स्त्री के रूप में मानवीकृत किया गया है; इसलिए ‘समय’ और ‘दिन’ के साथ बाबेल की ओर संकेत करने वाले अधिकारवाचक प्रत्यय स्त्रीलिंग हैं।
    reason: cultural_note
lexical_decisions:
- source_word: וְעָנָה
  choice: चिल्लाएँगे
  rationale: ענה का मूल भाव ‘उत्तर देना/पुकारना’ है; उजाड़ स्थानों में पशुओं के संदर्भ में यह उनकी तीखी आवाज़ को व्यक्त करता है। ‘चिल्लाएँगे’ सहज हिन्दी है और किसी खास पशु-ध्वनि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אִיִּים
  choice: लकड़बग्घे
  rationale: इस दुर्लभ पद का सटीक प्राणी-वाचक अर्थ अनिश्चित है। खंडहरों में रहने वाले हिंस्र या जंगली पशुओं के चित्र में ‘लकड़बग्घे’ एक सम्भाव्य आधुनिक प्रतिशब्द है; अनिश्चितता पाद-टिप्पणी में रखी गई है।
- source_word: בְּאַלְמנוֹתָיו
  choice: उसके उजड़े राजभवनों में
  rationale: मसोरेटिक रूप कठिन है और उसका बाहरी रूप ‘उसकी विधवाओं में’ जैसा अर्थ दे सकता है। समानांतर ‘विलासमय भवनों’ तथा उजड़ी नगरी के प्रसंग में इसे वीरान पड़े भव्य भवनों के रूप में समझना अधिक संगत है। ‘उजड़े’ शब्द मूल रूप से जुड़ी वीरानी की छवि बनाए रखता है।
- source_word: וְתַנִּים
  choice: सियार
  rationale: भविष्यद्वाणी के उजाड़-संबंधी प्रसंगों में תַנִּים का सम्भावित अर्थ सियार है, न कि पौराणिक अजगर या समुद्री जीव।
- source_word: בְּהֵיכְלֵי עֹנֶג
  choice: उसके विलासमय भवनों में
  rationale: הֵיכָל बड़े भव्य भवन, राजमहल या मंदिर-सदृश कक्ष का द्योतक हो सकता है और עֹנֶג सुख-विलास का। यह चयन पूर्व वैभव और आने वाली वीरानी के विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְקָרוֹב לָבוֹא עִתָּהּ
  choice: उसका समय निकट आ पहुँचा है
  rationale: इब्रानी में बाबेल के लिए स्त्रीलिंग प्रत्यय है। हिन्दी का ‘उसका’ लिंग को खुलकर चिह्नित नहीं करता, पर नगरी के नियत समय को संक्षेप में और स्वाभाविक ढंग से व्यक्त करता है। ‘निकट आ पहुँचा है’ आसन्नता को दर्शाता है।
- source_word: וְיָמֶיהָ לֹא יִמָּשֵׁכוּ
  choice: उसके दिन बढ़ाए नहीं जाएँगे
  rationale: निफ़ाल रूप का अर्थ दिनों का लंबा किया जाना या बढ़ाया जाना है। यह हिन्दी मूल की कर्मवाच्य रचना और बाबेल के बचे हुए समय की अल्पता दोनों को बनाए रखती है।
theological_decisions:
- issue: बाबेल का स्त्रीरूप मानवीकरण
  choice: मुख्य पाठ में स्वाभाविक हिन्दी सर्वनाम रखते हुए पाद-टिप्पणी में मानवीकरण स्पष्ट किया गया है।
  alternative: ‘उस स्त्री का समय’ जैसे स्पष्ट स्त्रीलिंग शब्द जोड़ना।
  rationale: इब्रानी स्त्रीलिंग प्रत्यय बाबेल नगरी की ओर संकेत करते हैं, पर हिन्दी में अनावश्यक शब्द जोड़कर चित्र को अधिक स्पष्ट करना मूल से आगे चला जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक समानांतरता के लिए पहली दो पंक्तियों में क्रिया दूसरी पंक्ति में दोहराई नहीं गई। कठिन प्राणी-वाचक और स्थापत्य-वाचक पदों की वास्तविक अनिश्चितता पाद-टिप्पणियों में सुरक्षित है।
