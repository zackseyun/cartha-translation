base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/014.yaml
  text: And it will be like a hunted gazelle[a], and like sheep with no one to gather them; each man will turn to his own people[b], and each will flee to his own land.
translation:
  language: hi
  text: और वे खदेड़े हुए चिकारे के समान, और ऐसी भेड़ों के समान होंगे जिन्हें इकट्ठा करने वाला कोई न हो[a]। हर पुरुष[b] अपने लोगों की ओर मुड़ेगा, और हर एक अपने देश भाग जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उस चिकारे के समान जिसे भगा दिया गया हो’; इब्रानी कर्मवाच्य कृदन्त का अर्थ ‘भगाया हुआ’ या ‘खदेड़ा हुआ’ हो सकता है, केवल ‘शिकार किया हुआ’ तक सीमित नहीं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘हर पुरुष’; यह अभिव्यक्ति यहाँ एक-एक सदस्य के लिए वितरणात्मक अर्थ में प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: तब वे ... होंगे
  rationale: भविष्यसूचक प्रसंग में यह आगामी परिणामी स्थिति को व्यक्त करता है। आगे के बहुवचन क्रियापदों के अनुसार हिन्दी में निहित समूह के लिए ‘वे’ स्पष्ट किया गया है।
- source_word: כִּצְבִי מֻדָּח
  choice: उस चिकारे के समान ... जिसे खदेड़ दिया गया हो
  rationale: צְבִי के लिए प्राणी-विशेष का सटीक आधुनिक नाम ‘चिकारा’ रखा गया है। נדח का कर्मवाच्य भाव ‘खदेड़ दिया गया’ में सुरक्षित है; इसे केवल ‘शिकार किया जा रहा’ मानकर अर्थ सीमित नहीं किया गया।
- source_word: וּכְצֹאן וְאֵין מְקַבֵּץ
  choice: उन भेड़ों के समान जिन्हें इकट्ठा करने वाला कोई न हो
  rationale: צֹאן यहाँ समूहवाचक छोटे पशुधन को दर्शाता है; चरवाहे द्वारा एकत्र किए जाने की छवि में ‘भेड़ें’ सहज और स्पष्ट है। אין तथा कृदन्त का अर्थ किसी एकत्र करने वाले के न होने के रूप में दिया गया है।
- source_word: אִישׁ אֶל עַמּוֹ יִפְנוּ
  choice: हर पुरुष अपने लोगों की ओर मुड़ेगा
  rationale: אִישׁ पुल्लिंग एकवचन होते हुए यहाँ वितरणात्मक है। ‘अपने लोगों’ עַמּוֹ के सामुदायिक अर्थ को व्यक्त करता है, जबकि ‘की ओर मुड़ेगा’ פנה की दिशात्मकता बनाए रखता है।
- source_word: וְאִישׁ אֶל אַרְצוֹ יָנוּסוּ
  choice: और हर एक अपने देश को भाग जाएगा
  rationale: נוּס का मूल अर्थ ‘भागना’ है और אֶרֶץ यहाँ ‘देश’ है। दूसरी बार ‘हर पुरुष’ दोहराने के बजाय ‘हर एक’ हिन्दी में स्वाभाविक है और वितरणात्मक अर्थ बनाए रखता है।
theological_decisions:
- issue: אִישׁ का लिंगयुक्त वितरणात्मक प्रयोग
  choice: पहली बार ‘हर पुरुष’ और दूसरी बार ‘हर एक’
  alternative: ‘हर व्यक्ति’ अथवा दोनों बार ‘हर पुरुष’
  rationale: पहली अभिव्यक्ति मूल के व्याकरणिक पुल्लिंग को सुरक्षित रखती है; दूसरी अभिव्यक्ति उसी संदर्भ को स्वाभाविक हिन्दी में बिना अनावश्यक पुनरावृत्ति के आगे बढ़ाती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चिकारा’ मूल पशु-छवि की अपेक्षाकृत सटीक पहचान देता है; वाक्य-विन्यास को हिन्दी की स्वाभाविक प्रवाहशीलता के लिए थोड़ा स्पष्ट किया गया है।
