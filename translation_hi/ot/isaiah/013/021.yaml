base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/021.yaml
  text: But desert creatures will lie down there[a], and their houses will be full of owls; ostriches will dwell there[b], and wild goats will dance there.
translation:
  language: hi
  text: पर वहाँ मरुभूमि के जीव लेटेंगे, और वहाँ के घर उल्लुओं[a] से भर जाएँगे; वहाँ शुतुरमुर्ग बसेंगे, और जंगली बकरे[b] नाचेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हुआँ-हुआँ करने वाले जीव’ अथवा ‘सियार’; इब्रानी शब्द אֹחִים का अर्थ अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: या ‘बकरा-दैत्य’ अथवा ‘सटायर’; इब्रानी शब्द שְׂעִירִים ‘रोएँदार बकरे’ का अर्थ दे सकता है, पर कुछ प्रसंगों में इसमें पौराणिक या दुष्टात्मिक संकेत भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָבְצוּ
  choice: आकर लेटेंगे
  rationale: רבץ पशुओं के किसी स्थान पर लेटने या टिक जाने को दर्शाता है। ‘आकर लेटेंगे’ उजड़े स्थान पर उनके अधिकार जमा लेने का स्वाभाविक हिन्दी चित्र प्रस्तुत करता है।
- source_word: צִיִּים
  choice: मरुभूमि के जीव
  rationale: यह शब्द शुष्क और उजाड़ स्थानों से जुड़े जीवों का सामान्य संकेत देता है; किसी एक अनिश्चित प्रजाति को चुनने के बजाय व्यापक अर्थ रखा गया है।
- source_word: וּמָלְאוּ בָתֵּיהֶם
  choice: उनके घर ... से भर जाएँगे
  rationale: हिब्रू की सीधी संबंधवाचक रचना और घरों के जीवों से भर जाने के दृश्य को बनाए रखता है।
- source_word: אֹחִים
  choice: उल्लुओं
  rationale: शब्द की पहचान अनिश्चित है। परंपरागत अर्थ ‘उल्लू’ उजड़े घरों के प्रसंग में उपयुक्त है, जबकि अन्य संभावनाएँ पाद-टिप्पणी में सुरक्षित रखी गई हैं।
- source_word: וְשָׁכְנוּ
  choice: बसेंगे
  rationale: שׁכן किसी स्थान में रहने या निवास करने का अर्थ देता है; आधुनिक हिन्दी में ‘बसेंगे’ सहज और गरिमापूर्ण है।
- source_word: בְּנוֹת יַעֲנָה
  choice: शुतुरमुर्ग
  rationale: शाब्दिक रूप ‘शुतुरमुर्ग की बेटियाँ’ एक प्राणी-सूचक हिब्रू मुहावरा है; हिन्दी में प्रजाति का सामान्य नाम अधिक स्वाभाविक है।
- source_word: וּשְׂעִירִים
  choice: जंगली बकरे
  rationale: मूल अर्थ ‘रोएँदार जीव/बकरे’ है। कुछ प्रसंगों में दैत्य-संबंधी संकेत संभव है, पर यहाँ मुख्य पाठ में उससे अधिक निश्चित अर्थ आरोपित नहीं किया गया।
- source_word: יְרַקְּדוּ
  choice: नाचेंगे
  rationale: רקד नाचने, उछलने या कूदने का बोध कराता है। ‘नाचेंगे’ विनाश के बीच उपस्थित सजीव और भयावह काव्यात्मक चित्र को बनाए रखता है।
theological_decisions:
- issue: שְׂעִירִים को वास्तविक जंगली पशु माना जाए या दैत्य-सदृश प्राणी
  choice: मुख्य पाठ में ‘जंगली बकरे’
  alternative: ‘बकरा-दैत्य’ या ‘वनदेव-सदृश प्राणी’
  rationale: शब्द का मूल पशुवाचक अर्थ ‘रोएँदार बकरे’ है, यद्यपि कुछ संदर्भों में उससे पौराणिक या दुष्टात्मिक संबंध भी व्यक्त हो सकता है। मुख्य पाठ कम निर्णायक अर्थ रखता है और संभावित गूढ़ संकेत को पाद-टिप्पणी में सुरक्षित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। अनिश्चित प्राणी-नामों को अत्यधिक विशिष्ट नहीं बनाया गया; दोनों पाद-टिप्पणी चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
