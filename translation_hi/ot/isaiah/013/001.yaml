translation:
  language: hi
  text: बाबेल के विषय में भविष्यवाणी, जिसे आमोज़ के पुत्र यशायाह ने देखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַשָּׂא
  choice: भविष्यवाणी
  rationale: भविष्यद्वक्ताओं के लेखों में यह शब्द किसी गंभीर और प्रायः न्याय-संबंधी ईश्वरीय संदेश के शीर्षक के रूप में आता है। आधुनिक हिन्दी में ‘भविष्यवाणी’ सहज और विधागत रूप से उपयुक्त है; पादटिप्पणी इसके शाब्दिक और वैकल्पिक अर्थों को सुरक्षित रखती है।
- source_word: בָּבֶל
  choice: बाबेल
  rationale: इब्रानी स्थान-नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: אֲשֶׁר
  choice: जिसे
  rationale: यह संबंधवाचक पद ‘भविष्यवाणी’ को आगे आने वाले उपवाक्य से स्वाभाविक हिन्दी में जोड़ता है।
- source_word: חָזָה
  choice: देखा
  rationale: इब्रानी क्रिया के सीधे अर्थ को बनाए रखता है और उसके दर्शन-संबंधी भाव को बिना अनावश्यक व्याख्या के सुरक्षित छोड़ता है।
- source_word: יְשַׁעְיָהוּ
  choice: यशायाह
  rationale: भविष्यद्वक्ता के नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: בֶּן
  choice: पुत्र
  rationale: वंश-सूचक इब्रानी अभिव्यक्ति का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: אָמֹוץ
  choice: आमोस
  rationale: यशायाह के पिता के नाम का प्रचलित हिन्दी बाइबलीय रूप; इसे नबी आमोस के नाम से संदर्भ द्वारा अलग पहचाना जाता है।
theological_decisions:
- issue: भविष्यसूचक शीर्षक מַשָּׂא का अनुवाद
  choice: बाबेल के विषय में वह भविष्यवाणी
  alternative: बाबेल का बोझ; बाबेल के विरुद्ध घोषणा
  rationale: ‘के विषय में’ इब्रानी संबंध की व्यापकता बनाए रखता है और उसे पहले ही ‘विरुद्ध’ तक सीमित नहीं करता, यद्यपि आगे का संदेश न्याय का है। ‘भविष्यवाणी’ आधुनिक पाठक के लिए स्पष्ट है, जबकि ‘बोझ’ अधिक शाब्दिक पर अस्पष्ट हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भविष्यसूचक शीर्षक। ‘देखा’ मूल की दृश्यात्मक भाषा को बनाए रखता है; ‘दर्शन पाया’ जैसी व्याख्यात्मक वृद्धि नहीं की गई।
