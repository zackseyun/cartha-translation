source:
  edition: WLC
  text: כִּֽי כוֹכְבֵ֤י הַ/שָּׁמַ֨יִם֙ וּ/כְסִ֣ילֵי/הֶ֔ם לֹ֥א יָהֵ֖לּוּ אוֹרָ֑/ם חָשַׁ֤ךְ הַ/שֶּׁ֨מֶשׁ֙ בְּ/צֵאת֔/וֹ וְ/יָרֵ֖חַ לֹֽא יַגִּ֥יהַ אוֹרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/010.yaml
  text: For the stars of the heavens and their constellations will not give their light; the sun is darkened at its rising[a], and the moon will not make its light shine.
translation:
  language: hi
  text: क्योंकि आकाश के तारे और उसके नक्षत्र[a] अपना प्रकाश न देंगे; सूर्य उदय के समय अंधकारमय हो जाता है, और चन्द्रमा अपना प्रकाश न चमकाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उसके कालपुरुष (ओरायन)।” इब्रानी शब्द विशेष रूप से ओरायन तारामंडल का संकेत कर सकता है, पर यहाँ वह व्यापक रूप से तारामंडलों का भी सूचक हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले न्याय-वचन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כוֹכְבֵי הַשָּׁמַיִם
  choice: आकाश के तारे
  rationale: इब्रानी संबंध-वाक्यांश को स्पष्ट, गरिमापूर्ण और सामान्य आधुनिक हिन्दी में रखता है।
- source_word: וּכְסִילֵיהֶם
  choice: और उसके नक्षत्र
  rationale: כְּסִיל विशेष रूप से मृगशीर्ष/ओरायन का संकेत दे सकता है, पर यहाँ बहुवचन और आकाश-संबंधी प्रत्यय के साथ व्यापक तारामंडलों का बोध सम्भव है; ‘नक्षत्र’ काव्यात्मक तथा सहज है।
- source_word: לֹא יָהֵלּוּ אוֹרָם
  choice: अपना प्रकाश न देंगे
  rationale: प्रकाश उत्सर्जित करने का अर्थ स्वाभाविक हिन्दी में व्यक्त होता है और मूल के ‘उनका प्रकाश’ संबंध को बनाए रखता है।
- source_word: חָשַׁךְ הַשֶּׁמֶשׁ בְּצֵאתוֹ
  choice: सूर्य उदय होते ही अँधेरा हो जाएगा
  rationale: पूर्ण क्रिया को भावी न्याय के सजीव भविष्यसूचक वर्णन के रूप में समझते हुए घटना का अर्थ देता है; בְּצֵאתוֹ का स्वाभाविक अर्थ सूर्योदय है।
- source_word: וְיָרֵחַ לֹא יַגִּיהַ אוֹרוֹ
  choice: और चन्द्रमा अपना प्रकाश न चमकाएगा
  rationale: हिफ़ील की प्रकाश चमकाने की कारक छाया को पठनीय हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ब्रह्माण्डीय अन्धकार की भाषा का स्वरूप
  choice: न्याय के प्रत्यक्ष ब्रह्माण्डीय बिम्ब के रूप में अनुवाद, बिना यह निश्चित किए कि वह शाब्दिक खगोलीय घटना है या राजनीतिक पतन का रूपक।
  alternative: इसे केवल अन्त-कालीन खगोलीय घटना अथवा केवल सांसारिक शक्तियों के पतन का रूपक मानना।
  rationale: इब्रानी पाठ न्याय के प्रसंग में सृष्टि के उलट जाने जैसा बिम्ब देता है; अनुवाद को उसकी व्याख्यात्मक अनिश्चितता और धर्मवैचारिक भार बनाए रखना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और गरिमापूर्ण भविष्यवाणी-शैली रखी गई है। ‘आकाश’, ‘नक्षत्र’, ‘सूर्य’ और ‘चन्द्रमा’ सामान्य पाठक के लिए स्पष्ट हैं; संस्कृतनिष्ठता को सीमित रखा गया है।
