  edition: WLC
  text: עַל כֵּן֙ שָׁמַ֣יִם אַרְגִּ֔יז וְ/תִרְעַ֥שׁ הָ/אָ֖רֶץ מִ/מְּקוֹמָ֑/הּ בְּ/עֶבְרַת֙ יְהוָ֣ה צְבָא֔וֹת וּ/בְ/י֖וֹם חֲר֥וֹן אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/013.yaml
  text: Therefore I will make the heavens tremble[a], and the earth will shake from its place, at the fury of Yahweh of Armies, in the day of his burning anger.
translation:
  language: hi
  text: इसलिए मैं आकाश को कंपा दूँगा, और पृथ्वी अपने स्थान से हिल जाएगी, सेनाओं के याहवे के प्रकोप में, उनके धधकते क्रोध के दिन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पिछले न्याय-वचन से निकलने वाले परिणाम को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שָׁמַיִם אַרְגִּיז
  choice: मैं आकाश को कंपा दूँगा
  rationale: 'हिफ़ील रूप की कारणवाचक शक्ति को बनाए रखता है: वक्ता आकाश को काँपने या विचलित होने का कारण बनेगा। हिंदी में एकवचन ‘आकाश’ यहाँ समूचे नभमंडल का स्वाभाविक बोध कराता है।'
- source_word: וְתִרְעַשׁ הָאָרֶץ
  choice: और पृथ्वी ... हिल जाएगी
  rationale: רעשׁ भूकंपीय हिलने को दर्शाता है। ‘हिल जाएगी’ पहले खंड के ‘कंपा दूँगा’ से अर्थगत समानांतरता रखते हुए अनावश्यक शब्द-पुनरावृत्ति से बचता है।
- source_word: מִמְּקוֹמָהּ
  choice: अपने स्थान से
  rationale: मूल के विस्थापन-बोध को सीधा और स्वाभाविक रूप देता है।
- source_word: בְּעֶבְרַת
  choice: के प्रकोप के कारण
  rationale: עֶבְרָה अत्यंत उग्र, उमड़ते क्रोध को व्यक्त करता है। यहाँ בְּ को न्यायकारी घटना के कारण या अवसर के रूप में समझना संदर्भानुकूल है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: व्यक्तिगत नाम יְהוָה को ‘याहवे’ और צְבָאוֹת के युद्ध-संबंधी आशय को पारदर्शी रूप से ‘सेनाओं’ द्वारा व्यक्त किया गया है।
- source_word: וּבְיוֹם חֲרוֹן אַפּוֹ
  choice: उनके धधकते क्रोध के दिन
  rationale: यह समय-सूचक पदबंध और क्रोध की जलती हुई तीव्रता—दोनों को सुरक्षित रखता है। ‘उनके’ आधुनिक सम्मानसूचक हिंदी के अनुरूप याहवे की ओर संकेत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में वाचा का व्यक्तिगत नाम सीधे आया है; इसलिए उसे किसी उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
- issue: יְהוָה צְבָאוֹת की उपाधि
  choice: सेनाओं के याहवे
  alternative: सेनाओं का प्रभु; सेनाओं का यहोवा
  rationale: यह चयन צְבָאוֹת के सैन्य आशय को स्पष्ट रखता है और ईश्वरीय नाम तथा उपाधि के बीच मूल संबंध को बनाए रखता है।
- issue: आकाश और पृथ्वी का दायरा
  choice: सृष्टि-व्यापी ‘आकाश’ और ‘पृथ्वी’
  alternative: स्थानीय ‘आसमान’ और ‘देश’
  rationale: दोनों शब्दों की समानांतर जोड़ी इस न्याय-वचन को ब्रह्मांडीय आयाम देती है; इसे केवल किसी स्थानीय भूमि तक सीमित करना संदर्भ की शक्ति घटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। वाक्य की काव्यात्मक समानांतरता, न्याय की तीव्रता और क्रोध की अग्निमय उपमा सुरक्षित हैं। दीर्घ डैश अंतिम कारण और समय-सूचक पदबंधों को मुख्य ब्रह्मांडीय घटना से स्पष्ट रूप से जोड़ता है।
