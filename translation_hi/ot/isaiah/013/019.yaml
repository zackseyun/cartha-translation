reference: Isaiah 13:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיְתָ֤ה בָבֶל֙ צְבִ֣י מַמְלָכ֔וֹת תִּפְאֶ֖רֶת גְּא֣וֹן כַּשְׂדִּ֑ים כְּ/מַהְפֵּכַ֣ת אֱלֹהִ֔ים אֶת סְדֹ֖ם וְ/אֶת עֲמֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/019.yaml
  text: And Babylon[a], the beauty of kingdoms, the glory of the Chaldeans’ pride, will be like God’s overthrow of Sodom and Gomorrah.
translation:
  language: hi
  text: और बाबेल, राज्यों की शोभा, कसदियों के अभिमान का वैभव, परमेश्वर द्वारा सदोम और अमोरा के उलट दिए जाने के समान हो जाएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיְתָה
  choice: ऐसी हो जाएगी
  rationale: भविष्यसूचक प्रसंग में यह रूप बाबेल की आने वाली दशा बताता है; तुलना के साथ यह हिन्दी में स्वाभाविक है।
- source_word: בָבֶל
  choice: बाबेल
  rationale: हिब्रू स्थान-नाम का हिन्दी बाइबलीय रूप।
- source_word: צְבִי מַמְלָכוֹת
  choice: राज्यों की शोभा
  rationale: צְבִי सौंदर्य, शोभा या वैभव सूचित करता है; संबंधवाचक संरचना को सीधे रखा गया है।
- source_word: תִּפְאֶרֶת גְּאוֹן כַּשְׂדִּים
  choice: कसदियों के गौरव का वैभव
  rationale: תִּפְאֶרֶת के लिए ‘वैभव’ और बहुअर्थी גְּאוֹן के लिए ‘गौरव’ रखने से भव्यता का भाव बना रहता है और ‘घमंड’ का नकारात्मक अर्थ अनावश्यक रूप से निश्चित नहीं किया जाता।
- source_word: כַּשְׂדִּים
  choice: कसदियों
  rationale: हिब्रू जातिवाचक नाम को सामान्यीकृत करके ‘बेबीलोनियों’ नहीं किया गया।
- source_word: כְּמַהְפֵּכַת אֱלֹהִים
  choice: जैसे परमेश्वर ने ... उलट दिया था
  rationale: כְּ तुलना और מַהְפֵּכָה विनाशकारी उलट दिए जाने को व्यक्त करते हैं; कर्ता परमेश्वर को हिन्दी में स्पष्ट और स्वाभाविक रूप से रखा गया है।
- source_word: אֶת סְדֹם וְאֶת עֲמֹרָה
  choice: सदोम और अमोरा को
  rationale: दोनों नगरों के प्रचलित हिन्दी बाइबलीय नाम और प्रत्यक्ष कर्म-संरचना।
theological_decisions:
- issue: न्याय-संदर्भ में גְּאוֹן का अर्थ
  choice: गौरव
  alternative: घमंड / अभिमान
  rationale: शब्द महिमा, उत्कर्ष, गौरव अथवा घमंड सूचित कर सकता है। यहाँ ‘गौरव’ बाबेल की प्रसिद्ध भव्यता और उसके आसन्न पतन के तनाव को बनाए रखता है; नकारात्मक अर्थ को मुख्य पाठ में अंतिम रूप से आरोपित नहीं किया गया।
- issue: सदोम और अमोरा के विनाश में परमेश्वर की भूमिका
  choice: परमेश्वर को स्पष्ट कर्ता रखा गया
  alternative: परमेश्वर द्वारा किया गया उलटाव
  rationale: हिब्रू संरचना विनाश को परमेश्वर से स्पष्ट रूप से जोड़ती है; सक्रिय हिन्दी वाक्य अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक गरिमा बनाए रखी गई है। ‘शोभा’, ‘गौरव’ और ‘वैभव’ समानार्थी होते हुए भी हिब्रू के क्रमिक भव्यता-बोध को अलग-अलग शब्दों में व्यक्त करते हैं। कोई पाद-टिप्पणी आवश्यक नहीं रखी गई, क्योंकि मुख्य पाठ में बहुअर्थी גְּאוֹן के लिए अपेक्षाकृत तटस्थ ‘गौरव’ चुना गया है।
