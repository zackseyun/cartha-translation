id: ISA.13.4
reference: Isaiah 13:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ק֥וֹל הָמ֛וֹן בֶּֽ/הָרִ֖ים דְּמ֣וּת עַם רָ֑ב ק֠וֹל שְׁא֞וֹן מַמְלְכ֤וֹת גּוֹיִם֙ נֶֽאֱסָפִ֔ים יְהוָ֣ה צְבָא֔וֹת מְפַקֵּ֖ד צְבָ֥א מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/004.yaml
  text: The sound of a multitude in the mountains[a], like a great people! The sound of an uproar of kingdoms[b], of nations gathered together! Yahweh of hosts is mustering an army for battle.
translation:
  language: hi
  text: पहाड़ों में एक विशाल जनसमूह का कोलाहल—मानो किसी बड़ी जनता का हो![a] राज्यों का, इकट्ठे हुए राष्ट्रों का तुमुलनाद![b] सेनाओं का परमेश्वर याहवे युद्ध के लिए सेना जुटा रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पहाड़ों पर एक विशाल जनसमूह का कोलाहल—मानो किसी बड़ी जनता का हो!”
    reason: lexical_alternative
  - marker: b
    text: या, “राज्यों का, एकत्र होते राष्ट्रों का हुल्लड़!”
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֥וֹל הָמ֛וֹן
  choice: एक विशाल जनसमूह का कोलाहल सुनाई दे रहा है
  rationale: קוֹל श्रव्य ध्वनि को और הָמוֹן बड़ी, शोर करती भीड़ को सूचित करता है। हिंदी में यह वाक्यांश दृश्य की श्रव्यता और जनबहुलता दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בֶּהָרִים
  choice: पहाड़ों में
  rationale: בְּ का सामान्य स्थानवाचक अर्थ ‘में’ है; ‘पहाड़ों में’ मूल भू-दृश्य को बनाए रखता है। ‘पहाड़ों पर’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: דְּמוּת עַם רָב
  choice: मानो कोई बड़ी जाति हो
  rationale: דְּמוּת यहाँ तुलना व्यक्त करता है। עַם सामूहिक जन/जाति और רָב विशालता या बहुसंख्या दर्शाता है; ‘मानो कोई बड़ी जाति हो’ हिंदी में तुलना को स्पष्ट रखता है।
- source_word: שְׁאוֹן מַמְלְכוֹת גּוֹיִם
  choice: राज्यों का तुमुलनाद—राष्ट्र
  rationale: שְׁאוֹן ऊँचे, उथल-पुथल भरे शोर को दर्शाता है। ‘तुमुलनाद’ गरिमामय किंतु समझने योग्य है। מַמְלְכוֹת और גּוֹיִם की सघन, कुछ हद तक समानाधिकरणात्मक रचना को विराम-चिह्न द्वारा खुला रखा गया है।
- source_word: נֶאֱסָפִים
  choice: इकट्ठे हो रहे हैं
  rationale: निफ़अल कृदंत एकत्र होने अथवा किए जाने की प्रगतिशील स्थिति दिखाता है। संदर्भ में ‘इकट्ठे हो रहे हैं’ इस गतिशीलता को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का परमेश्वर यहोवा
  rationale: यहोवा व्यक्तिगत दिव्य नाम को सुरक्षित रखता है। צְבָאוֹת को ‘सेनाओं’ से व्यक्त किया गया है; हिंदी में ‘सेनाओं का परमेश्वर यहोवा’ पदवी और नाम का संबंध स्पष्ट करता है।
- source_word: מְפַקֵּד צְבָא מִלְחָמָה
  choice: युद्ध के लिए सेना जुटा रहा है
  rationale: פקד का यहाँ सैन्य अर्थ ‘सेना का निरीक्षण/गणना करके उसे तैनाती हेतु जुटाना’ है। ‘सेना जुटा रहा है’ प्रसंगानुकूल और आधुनिक हिंदी है; צְבָא מִלְחָמָה का उद्देश्य ‘युद्ध के लिए’ से स्पष्ट होता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में उपाधि के स्थान पर चतुरक्षरीय व्यक्तिगत नाम है, इसलिए उसे ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। आधुनिक हिंदी बाइबल-पाठकों में व्यापक रूप से पहचाने जाने वाले रूप ‘यहोवा’ को चुना गया; ‘याहवे’ अधिक निकट ध्वन्यात्मक विकल्प है।
- issue: יְהוָה צְבָאוֹת में צְבָאוֹת का आशय
  choice: सेनाओं का परमेश्वर यहोवा
  alternative: सेनाओं का यहोवा
  rationale: ‘सेनाओं का परमेश्वर यहोवा’ हिंदी में दिव्य पदवी को सहज बनाता है, जबकि ‘सेनाओं का यहोवा’ मूल संरचना के अधिक निकट है। ‘सेनाओं’ को केवल मानवीय सेना तक सीमित नहीं किया गया; पदवी की व्यापकता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय भविष्यवाणी-शैली रखी गई है। विस्मयादिबोधक वाक्य मूल की तीव्र श्रव्य छवियों और समानांतरता को बनाए रखते हैं। ‘तुमुलनाद’ ऊँचे सामूहिक शोर के लिए चुना गया है; आसपास की सरल भाषा उसके अर्थ को स्पष्ट करती है।
