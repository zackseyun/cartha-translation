  text: אוֹקִ֥יר אֱנ֖וֹשׁ מִ/פָּ֑ז וְ/אָדָ֖ם מִ/כֶּ֥תֶם אוֹפִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/012.yaml
  text: I will make mortal man rarer than fine gold[a], and mankind than the gold of Ophir.
translation:
  language: hi
  text: मैं नश्वर मनुष्य को कुन्दन से भी दुर्लभ कर दूँगा[a], और मानवजाति को ओपीर के सोने से भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं नश्वर मनुष्य को कुन्दन से भी बहुमूल्य कर दूँगा।” इब्रानी क्रिया बहुमूल्यता या मूल्य पर बल दे सकती है; इस प्रसंग में यह सम्भवतः मनुष्यों की अत्यन्त दुर्लभता को सूचित करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹקִיר
  choice: दुर्लभ कर दूँगा
  rationale: हिफ़ील रूप का मूल भाव किसी को बहुमूल्य बनाना है; न्याय के इस प्रसंग में सोने से तुलना मनुष्यों की अत्यन्त घटती संख्या, अर्थात उनकी दुर्लभता, को सूचित करती है।
- source_word: אֱנוֹשׁ
  choice: नश्वर मनुष्य
  rationale: यह शब्द मनुष्य की दुर्बलता और मरणशीलता पर बल दे सकता है; ‘नश्वर मनुष्य’ उस सूक्ष्म अर्थ को बनाए रखता है।
- source_word: מִפָּז
  choice: कुन्दन से भी
  rationale: पाज़ उच्च कोटि के शुद्ध या परिष्कृत सोने को दर्शाता है; आधुनिक हिन्दी में ‘कुन्दन’ संक्षिप्त और स्वाभाविक समतुल्य है।
- source_word: וְאָדָם
  choice: और मानवजाति को
  rationale: यहाँ आदाम समानांतर पंक्ति में समस्त मनुष्यों के लिए सामूहिक रूप से प्रयुक्त है; ‘मानवजाति’ उस व्यापक अर्थ को स्पष्ट करता है।
- source_word: מִכֶּתֶם אוֹפִיר
  choice: ओपीर के सोने से भी
  rationale: केतेम बहुमूल्य सोने को और ओपीर प्रसिद्ध भौगोलिक स्रोत को दर्शाता है; यह अनुवाद संकेत को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
theological_decisions:
- issue: אָדָם का सामूहिक मानवीय अर्थ
  choice: मानवजाति
  alternative: मनुष्य
  rationale: दो समानांतर मानवीय संज्ञाएँ न्याय के कारण लोगों की दुर्लभता बताती हैं। ‘मानवजाति’ दूसरी संज्ञा का सामूहिक विस्तार बनाए रखती है और उसे किसी एक पुरुष तक सीमित नहीं करती।
- issue: אוֹקִיר में मूल्य और दुर्लभता के बीच अर्थगत तनाव
  choice: मुख्य पाठ में ‘दुर्लभ कर दूँगा’
  alternative: ‘बहुमूल्य कर दूँगा’
  rationale: क्रिया में मूल्यवान बनाने का भाव वास्तविक है, पर व्यापक न्याय-संदर्भ में मनुष्यों की संख्या घटना अभिप्रेत परिणाम प्रतीत होता है। वैकल्पिक शाब्दिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज काव्यात्मक गद्य। समानांतरता बनाए रखने के लिए दूसरी पंक्ति में क्रिया का लोप हिन्दी में स्वाभाविक रूप से रखा गया है।
