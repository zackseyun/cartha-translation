base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/022.yaml
  text: There is no peace," says Yahweh[a], "for the wicked.
translation:
  language: hi
  text: “दुष्टों के लिए कोई शान्ति नहीं है,” यहोवा[a] कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम יהוה (YHWH) है; इसे “याहवे” भी लिखा जाता है।
    reason: divine_name
lexical_decisions:
- source_word: אֵין
  choice: कोई … नहीं है
  rationale: इब्रानी अस्तित्व-निषेध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: यह संक्षिप्त और प्रचलित समतुल्य है; इब्रानी शब्द में कुशल-क्षेम और सम्पूर्ण कल्याण का व्यापक भाव भी हो सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אָמַר
  choice: कहता है
  rationale: रूप की दृष्टि से यह पूर्ण क्रिया है, पर भविष्यद्वाणी की इस स्थायी ईश्वरीय घोषणा में हिन्दी का वर्तमानकालीन उद्धरण-सूत्र स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित रूप में प्रस्तुत करता है।
- source_word: לָרְשָׁעִים
  choice: दुष्टों के लिए
  rationale: לָ संबंध या लागू होने वाले पक्ष को दर्शाता है; बहुवचन विशेषण का संज्ञात्मक प्रयोग नैतिक रूप से दुष्ट लोगों के लिए है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला रूप है और उसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
translation_notes:
  register: भाषा संक्षिप्त, गरिमापूर्ण और आधुनिक मानक हिन्दी की है। मूल की कठोर, सूत्रात्मक घोषणा और שָׁלוֹם के केंद्रीय अर्थ ‘शान्ति’ को बनाए रखा गया है।
