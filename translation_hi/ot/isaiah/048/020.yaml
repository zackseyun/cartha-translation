base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/020.yaml
  text: Go out from Babylon[a]; flee from the Chaldeans! Declare this with a shout of joy; make it heard; send it out to the end of the earth. Say[b], “Yahweh has redeemed his servant Jacob.”
translation:
  language: hi
  text: बाबेल से निकलो; कसदियों[a] से भागो! आनन्द की पुकार के साथ इसकी घोषणा करो, इसे सुनाओ; इसे पृथ्वी के छोर[b] तक पहुँचा दो। कहो, “याहवे ने अपने सेवक याकूब को छुड़ाया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “कसदिया से”; इब्रानी में यहाँ उस जाति का नाम है: “कसदियों से।”'
    reason: lexical_alternative
  - marker: b
    text: या “पृथ्वी के छोरों तक।” इब्रानी में ‘छोर’ एकवचन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צְאוּ מִבָּבֶל
  choice: बाबेल से निकलो
  rationale: बहुवचन आज्ञार्थक צְאוּ और प्रस्थान-बिंदु מִבָּבֶל को सीधे, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בִּרְחוּ מִכַּשְׂדִּים
  choice: कसदियों से भागो
  rationale: בִּרְחוּ की तात्कालिकता और आज्ञार्थक बल को ‘भागो’ बनाए रखता है; כַּשְׂדִּים मूलतः जाति-समूह का बहुवचन है।
- source_word: בְּקוֹל רִנָּה
  choice: आनन्द की पुकार के साथ
  rationale: वाक्यांश की ऊँची, सुनाई देने वाली और उल्लासपूर्ण घोषणा—दोनों भावों को सहज हिन्दी में रखता है।
- source_word: הַגִּידוּ הַשְׁמִיעוּ זֹאת
  choice: इसकी घोषणा करो, इसे सुनाओ
  rationale: दो समानांतर आज्ञाओं को अलग रखता है; הַשְׁמִיעוּ के कारक भाव, अर्थात दूसरों को सुनाने, को भी व्यक्त करता है।
- source_word: הוֹצִיאוּהָ עַד קְצֵה הָאָרֶץ
  choice: इसे पृथ्वी के छोर तक पहुँचा दो
  rationale: संदेश को दूर तक प्रसारित करने के कारक भाव को स्वाभाविक हिन्दी में व्यक्त करता है और קְצֵה के एकवचन रूप को सुरक्षित रखता है।
- source_word: גָּאַל
  choice: छुड़ा लिया है
  rationale: पूर्ण क्रिया के संपन्न उद्धार को व्यक्त करता है और גאל के छुड़ाने/मुक्त कराने के अर्थ को सामान्य पाठक के लिए स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम स्पष्ट रूप से उपस्थित है; लिप्यंतरण उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: उद्धार-संदर्भ में גָּאַל का अर्थ
  choice: छुड़ा लिया है
  alternative: उद्धार किया है
  rationale: यह चयन निर्वासन से वास्तविक मुक्ति और मूल क्रिया के ‘छुड़ाने’ वाले अर्थ को रखता है, जबकि बाद की किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और घोषणात्मक भविष्यद्वक्ताई शैली रखी गई है। छोटे आज्ञार्थक खंड मूल की तात्कालिकता बनाए रखते हैं; कठिन संस्कृतनिष्ठ शब्दावली से बचते हुए ‘याहवे’ और ‘याकूब’ जैसे पारंपरिक बाइबलीय नाम सुरक्षित रखे गए हैं।
