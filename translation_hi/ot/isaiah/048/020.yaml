    issue: ‘छुड़ा लिया है’ for גָּאַל
    rationale: The added लेना is not present in the Hebrew and can suggest merely taking someone away. ‘छुड़ाया है’ is more direct for Yahweh’s completed act of redeeming/delivering Jacob.
