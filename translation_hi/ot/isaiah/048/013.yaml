source:
  edition: WLC
  text: אַף יָדִ/י֙ יָ֣סְדָה אֶ֔רֶץ וִֽ/ימִינִ֖/י טִפְּחָ֣ה שָׁמָ֑יִם קֹרֵ֥א אֲנִ֛י אֲלֵי/הֶ֖ם יַעַמְד֥וּ יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/013.yaml
  text: Indeed[a], my hand founded the earth, and my right hand spread out the heavens; when I call to them, they stand together.
translation:
  language: hi
  text: निश्चय ही, मेरे हाथ ने पृथ्वी की नींव डाली, और मेरे दाहिने हाथ ने आकाश को फैलाया[a]; जब मैं उन्हें पुकारता हूँ, तो वे एक साथ खड़े हो जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आकाश को तान दिया।’
    reason: טִפְּחָה के लिए ‘फैलाया’ के अतिरिक्त आकाश को फैलाकर तानने/स्पैन करने का वैकल्पिक अर्थ संभव है।
lexical_decisions:
- source_word: אַף
  choice: निश्चय ही
  rationale: यहाँ यह शब्द कथन पर बल देने वाला निपात है; ‘निश्चय ही’ उसके गंभीर और दृढ़ बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָדִי
  choice: मेरे हाथ
  rationale: शाब्दिक रूप ईश्वर के सृजन-कार्य की सजीव देहात्मक छवि को बनाए रखता है।
- source_word: יָסְדָה
  choice: नींव डाली
  rationale: יסד में आधार या नींव रखने का भाव है; यह हिन्दी में पृथ्वी की स्थापना की मूल छवि को स्पष्ट रखता है।
- source_word: אֶרֶץ
  choice: पृथ्वी
  rationale: समूची सृष्टि के प्रसंग में किसी विशेष देश के बजाय पृथ्वी अभिप्रेत है।
- source_word: וִימִינִי
  choice: और मेरे दाहिने हाथ
  rationale: यह ‘मेरे हाथ’ के साथ समानांतरता तथा सामर्थ्य और प्रत्यक्ष कर्तृत्व की छवि को सुरक्षित रखता है।
- source_word: טִפְּחָה
  choice: फैलाया
  rationale: संदर्भ में क्रिया आकाश को विस्तृत करने या हाथ से नापने/फैलाने की ओर संकेत कर सकती है; ‘फैलाया’ आधुनिक हिन्दी में स्पष्ट है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: हिन्दी में ‘आकाश’ सामूहिक और व्यापक अर्थ में स्वाभाविक है तथा सृष्टि-संदर्भ को ठीक व्यक्त करता है।
- source_word: קֹרֵא אֲנִי אֲלֵיהֶם
  choice: जब मैं उन्हें पुकारता हूँ
  rationale: कृदंत और सर्वनाम की सजीव वर्तमान क्रिया तथा अगली क्रिया से उसके समय-संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: יַעַמְדוּ
  choice: उपस्थित हो जाते हैं
  rationale: עמד का मूल अर्थ ‘खड़ा होना’ है, पर किसी प्रभु की पुकार पर खड़े होने के प्रसंग में ‘उपस्थित हो जाना’ तत्पर आज्ञाकारिता का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יַחְדָּו
  choice: एक साथ
  rationale: यह पृथ्वी और आकाश के संयुक्त रूप से प्रत्युत्तर देने का मूल अर्थ बनाए रखता है।
theological_decisions:
- issue: ईश्वर के सृजन-कार्य के लिए देहात्मक भाषा
  choice: ‘मेरे हाथ’ और ‘मेरे दाहिने हाथ’ की ठोस छवि को बनाए रखा गया है।
  alternative: ‘मेरी शक्ति ने पृथ्वी को स्थापित किया और मेरे सामर्थ्य ने आकाश को फैलाया।’
  rationale: इब्रानी पाठ स्पष्ट रूप से हाथ की छवि का प्रयोग करता है। इसे अमूर्त शक्ति की भाषा में बदलना अनावश्यक व्याख्या होती और सृष्टि में ईश्वर के प्रत्यक्ष, सार्वभौम कर्तृत्व की सजीवता घटा देता।
- issue: पृथ्वी और आकाश का ईश्वर की पुकार पर प्रत्युत्तर
  choice: ‘वे एक साथ उपस्थित हो जाते हैं’ द्वारा सृष्टि को आज्ञा पर तत्पर दिखाने वाली मानवीकृत छवि रखी गई है।
  alternative: ‘वे एक साथ स्थिर रहते हैं।’
  rationale: עמד केवल स्थिर रहने के बजाय पुकार पर खड़े होने या सामने उपस्थित होने का भाव भी दे सकता है। संदर्भ में ईश्वर की पुकार के प्रति सृष्टि का संयुक्त प्रत्युत्तर प्रमुख है; फिर भी इसे अत्यधिक सैद्धांतिक रूप नहीं दिया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पृथ्वी की नींव डाली’ और ‘दाहिने हाथ’ मूल की काव्यात्मक समानांतरता तथा ठोस सृष्टि-छवि को सुरक्षित रखते हैं।
