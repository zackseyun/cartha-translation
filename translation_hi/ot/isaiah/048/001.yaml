  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שִׁמְעוּ זֹ֣את בֵּֽית יַעֲקֹ֗ב הַ/נִּקְרָאִים֙ בְּ/שֵׁ֣ם יִשְׂרָאֵ֔ל וּ/מִ/מֵּ֥י יְהוּדָ֖ה יָצָ֑אוּ הַֽ/נִּשְׁבָּעִ֣ים בְּ/שֵׁ֣ם יְהוָ֗ה וּ/בֵ/אלֹהֵ֤י יִשְׂרָאֵל֙ יַזְכִּ֔ירוּ לֹ֥א בֶ/אֱמֶ֖ת וְ/לֹ֥א בִ/צְדָקָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/001.yaml
  text: Hear this[a], house of Jacob, you who are called by the name of Israel and who came out from the waters of Judah, who swear by the name of Yahweh and invoke the God of Israel, but not in truth or in righteousness.
translation:
  language: hi
  text: हे याकूब के घराने, यह सुनो—तुम जो इस्राएल के नाम से पुकारे जाते हो और यहूदा के जल से निकले हो,[a] जो याहवे के नाम की शपथ खाते और इस्राएल के परमेश्वर का आह्वान करते हो, पर न तो सच्चाई से, न धार्मिकता से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यहूदा के जल से”; संभवतः इसका अर्थ “यहूदा के वंश से उत्पन्न” या “यहूदा की कमर से उत्पन्न” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ זֹאת
  choice: यह सुनो
  rationale: बहुवचन आज्ञार्थक संबोधन को आधुनिक और सीधी हिन्दी में व्यक्त करता है।
- source_word: בֵּית יַעֲקֹב
  choice: हे याकूब के घराने
  rationale: भविष्यद्वक्ताओं में प्रचलित सामूहिक संबोधन और मूल रूपक को बनाए रखता है।
- source_word: הַנִּקְרָאִים בְּשֵׁם יִשְׂרָאֵל
  choice: तुम जो इस्राएल के नाम से पुकारे जाते हो
  rationale: नाम द्वारा पहचाने जाने के निष्क्रिय इब्रानी वाक्य-विन्यास और उसकी वाचा-संबंधी ध्वनि को सुरक्षित रखता है।
- source_word: וּמִמֵּי יְהוּדָה יָצָאוּ
  choice: और यहूदा के जल से निकले हो
  rationale: मूल के असामान्य किंतु अर्थपूर्ण 'जल' रूपक को मुख्य पाठ में बनाए रखता है; वंश-संबंधी आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: הַנִּשְׁבָּעִים בְּשֵׁם יְהוָה
  choice: जो याहवे के नाम की शपथ खाते
  rationale: दिव्य नाम को साक्षी बनाकर शपथ लेने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय व्यक्तिगत दिव्य नाम का हिन्दी लिप्यंतरण है, न कि उसके स्थान पर कोई उपाधि।
- source_word: וּבֵאלֹהֵי יִשְׂרָאֵל יַזְכִּירוּ
  choice: और इस्राएल के परमेश्वर का आह्वान करते हो
  rationale: यहाँ זכר के हिफ़ील रूप का धार्मिक और शपथ-संबंधी प्रयोग केवल उल्लेख करने के बजाय पुकारने या आह्वान करने का भाव रखता है।
- source_word: לֹא בֶאֱמֶת וְלֹא בִצְדָקָה
  choice: पर न तो सच्चाई से, न धार्मिकता से
  rationale: दोनों निषेधों को स्पष्ट रखते हुए אֱמֶת की सत्यता/विश्वसनीयता और צְדָקָה की नैतिक धार्मिकता का तनाव बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; इसलिए उसे उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- issue: מִמֵּי יְהוּדָה के रूपक का निर्वचन
  choice: मुख्य पाठ में 'यहूदा के जल से' रखकर वंश-संबंधी अर्थ पादटिप्पणी में समझाना
  alternative: यहूदा की संतान से; यहूदा के वंश से
  rationale: इब्रानी की वास्तविक और कुछ अस्पष्ट काव्यात्मक छवि को मिटाए बिना पाठक को उसके संभावित मुहावरेदार आशय तक पहुँचाता है।
- issue: אֱמֶת और צְדָקָה का संबंध
  choice: न तो सच्चाई से, न धार्मिकता से
  alternative: न विश्वासयोग्यता से, न न्यायपूर्वक
  rationale: शपथ और धार्मिक आह्वान की कपटपूर्णता पर आरोप को बनाए रखते हुए दोनों नैतिक पदों को एक अर्थ में विलीन नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और भविष्यद्वाणी के सार्वजनिक संबोधन के अनुकूल रखी गई है। 'घराने', 'शपथ खाते' और 'आह्वान' जैसे पद साहित्यिक गंभीरता बनाए रखते हुए सामान्य हिन्दी पाठक के लिए बोधगम्य हैं।
