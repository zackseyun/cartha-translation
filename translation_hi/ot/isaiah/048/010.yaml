source:
  edition: WLC
  text: הִנֵּ֥ה צְרַפְתִּ֖י/ךָ וְ/לֹ֣א בְ/כָ֑סֶף בְּחַרְתִּ֖י/ךָ בְּ/כ֥וּר עֹֽנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/010.yaml
  text: Behold[a], I have refined you, but not as silver[b]; I have chosen you in the furnace of affliction.
translation:
  language: hi
  text: देखो, मैंने तुझे शुद्ध किया है, पर चाँदी की तरह नहीं[a]; मैंने तुझे दुःख की भट्ठी में चुना है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “चाँदी के साथ/में नहीं।” हिब्रू वाक्यांश कठिन है; सम्भवतः भाव यह है कि यह शोधन चाँदी के शोधन जैसा नहीं था।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू क्रिया का सामान्य अर्थ “चुना” है। शोधन के इस संदर्भ में कुछ व्याख्याकार इसे रूपकात्मक रूप से “परखा” भी समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: देख
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है। आधुनिक हिन्दी में “देख” स्वाभाविक है और भविष्यद्वाणी की जोरदार शैली को बनाए रखता है।
- source_word: צְרַפְתִּיךָ
  choice: मैंने तुझे शुद्ध किया है
  rationale: क्रिया धातुओं को गलाकर शुद्ध करने का बिंब देती है। “शुद्ध किया” चाँदी और भट्ठी के रूपक के साथ स्पष्ट और स्वाभाविक है।
- source_word: וְלֹא בְכָסֶף
  choice: पर चाँदी की तरह नहीं
  rationale: בְ का अर्थ यहाँ कठिन है। धातु-शोधन के प्रसंग में तुलनात्मक अर्थ सबसे संभावित है, पर शाब्दिक अस्पष्टता को पादटिप्पणी में रखा गया है।
- source_word: בְּחַרְתִּיךָ
  choice: मैंने तुझे चुना है
  rationale: मसोरेटिक स्वरांकन और क्रिया בחר का सामान्य अर्थ “चुनना” है। भट्ठी के संदर्भ में यह असामान्य तनाव जानबूझकर सुरक्षित रखा गया है; “परखा” संभावित प्रासंगिक व्याख्या के रूप में पादटिप्पणी में दिया गया है।
- source_word: בְּכוּר
  choice: भट्ठी में
  rationale: כּוּר धातु गलाने या शुद्ध करने की भट्ठी है। आस-पास का शोधन-बिंब इसका धातुकर्म-संबंधी अर्थ स्पष्ट करता है।
- source_word: עֹנִי
  choice: दुःख
  rationale: यहाँ संज्ञा कष्ट, दीन दशा या विपत्ति को सूचित करती है। “दुःख” सामान्य पाठक के लिए व्यापक और सहज है।
theological_decisions:
- issue: शोधन के प्रसंग में בְּחַרְתִּיךָ का अर्थ
  choice: मुख्य पाठ में “मैंने तुझे चुना है”
  alternative: “मैंने तुझे परखा है”
  rationale: हिब्रू क्रिया का सामान्य और प्रत्यक्ष अर्थ “चुनना” है। इसे केवल प्रसंग के आधार पर “परखना” कर देना मूल पाठ के वास्तविक तनाव को मिटा सकता है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: וְלֹא בְכָסֶף में पूर्वसर्ग का अर्थ
  choice: “चाँदी की तरह नहीं”
  alternative: “चाँदी के साथ नहीं” अथवा “चाँदी के रूप में नहीं”
  rationale: शोधन और भट्ठी का समानांतर बिंब तुलना का समर्थन करता है, किंतु हिब्रू वाक्यांश संक्षिप्त और कठिन है; अतः अन्य अधिक शाब्दिक संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष शैली रखी गई है। एकवचन संबोधन के लिए “तुझे” मूल के निकट और सामान्य बाइबिलीय हिन्दी में बोधगम्य है। धातु-शोधन का रूपक बनाए रखा गया है और कठिन हिब्रू पदों की अस्पष्टता पादटिप्पणियों में स्पष्ट की गई है।
