  text: אֲנִ֥י אֲנִ֛י דִּבַּ֖רְתִּי אַף קְרָאתִ֑י/ו הֲבִיאֹתִ֖י/ו וְ/הִצְלִ֥יחַ דַּרְכּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/015.yaml
  text: I[a], I have spoken; indeed[b], I have called him; I have brought him, and I will make his way prosper.
translation:
  language: hi
  text: मैंने, मैंने ही कहा है; हाँ, मैंने ही उसे बुलाया है[a]। मैं उसे ले आया हूँ, और वह अपने मार्ग में सफल होगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसे” और आगे “वह” उस व्यक्ति की ओर संकेत करते हैं जिसे परमेश्वर ने बुलाया और ले आया है; संदर्भ में इसे सामान्यतः कुस्रू समझा जाता है (देखें यशायाह 48:14)।
    reason: cross_reference
  - marker: b
    text: शाब्दिक रूप से, “वह अपने मार्ग को सफल बनाएगा।” इब्रानी क्रिया कारणवाचक रूप में है; इसका अर्थ “वह अपने मार्ग में सफल होगा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי אֲנִי
  choice: मैंने, मैंने ही
  rationale: दोहराया हुआ सर्वनाम कर्ता पर प्रबल बल देता है। हिन्दी वाक्य-विन्यास में क्रिया के साथ विभक्ति लगने के कारण “मैंने, मैंने ही” मूल की पुनरुक्ति और बल दोनों को स्वाभाविक ढंग से बनाए रखता है।
- source_word: דִּבַּרְתִּי
  choice: कहा है
  rationale: पूर्ण क्रिया परमेश्वर की निश्चित और सम्पन्न घोषणा व्यक्त करती है; “कहा है” आधुनिक हिन्दी में स्वाभाविक और गंभीर है।
- source_word: אַף
  choice: हाँ
  rationale: यहाँ यह शब्द कथन की पुष्टि करते हुए उसे आगे बढ़ाता है; “हाँ” उसके बलात्मक-पुष्टिकारक भाव को संक्षेप में व्यक्त करता है।
- source_word: קְרָאתִיו
  choice: उसे बुलाया है
  rationale: קרא का अर्थ बुलाना या आह्वान करना हो सकता है। “बुलाया है” मूल की व्यापकता बनाए रखता है और किसी विशेष प्रकार की नियुक्ति को अनावश्यक रूप से नहीं जोड़ता।
- source_word: הֲבִיאֹתִיו
  choice: उसे ले आया हूँ
  rationale: בוא का हिफ़ील रूप किसी को लाने का कारण बनने या उसे ले आने का भाव देता है; “ले आया हूँ” इस कारणवाचक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: וְהִצְלִיחַ
  choice: और वह ... सफल बनाएगा
  rationale: यह हिफ़ील तृतीय पुरुष पुल्लिंग एकवचन रूप है, इसलिए इसका कर्ता “वह” है, न कि “मैं।” कारणवाचक भाव को “सफल बनाएगा” द्वारा सुरक्षित रखा गया है।
- source_word: דַּרְכּוֹ
  choice: अपने मार्ग को
  rationale: प्रत्यय उसी पुल्लिंग एकवचन व्यक्ति की ओर लौटता है जो क्रिया का कर्ता है; हिन्दी में सहसंदर्भ स्पष्ट करने के लिए “अपने” स्वाभाविक है। “मार्ग” जीवन-क्रम, अभियान या कार्यवाही की व्यापकता बनाए रखता है।
theological_decisions:
- issue: पुल्लिंग एकवचन सर्वनामों का संदर्भ
  choice: मुख्य पाठ में व्यक्ति का नाम न जोड़कर “उसे” और “अपने” रखा गया है।
  alternative: मुख्य पाठ में उस व्यक्ति को स्पष्ट रूप से कुस्रू कहना।
  rationale: इस पद के इब्रानी पाठ में केवल सर्वनाम हैं। निकटवर्ती संदर्भ उस व्यक्ति को सामान्यतः कुस्रू के रूप में पहचानता है, पर नाम को मुख्य पाठ में जोड़ना मूल से अधिक स्पष्टता देना होता।
- issue: अंतिम क्रिया का कर्ता
  choice: “वह अपने मार्ग को सफल बनाएगा”
  alternative: “मैं उसके मार्ग को सफल बनाऊँगा” अथवा भावानुवाद में “वह अपने मार्ग में सफल होगा”
  rationale: וְהִצְלִיחַ रूपात्मक रूप से हिफ़ील पूर्ण, तृतीय पुरुष पुल्लिंग एकवचन है। इसलिए प्रथम पुरुष कर्ता को जारी रखना व्याकरण-संगत नहीं है। कारणवाचक अर्थ को मुख्य पाठ में रखा गया है, जबकि अधिक स्वाभाविक अकर्मक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आरम्भ में मूल इब्रानी की बलात्मक पुनरुक्ति सुरक्षित है। “मार्ग” को जानबूझकर व्यापक रखा गया है ताकि अभियान, कार्य और जीवन-क्रम में से किसी एक अर्थ को अनावश्यक रूप से निश्चित न किया जाए।
