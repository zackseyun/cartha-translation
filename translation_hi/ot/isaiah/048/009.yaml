id: ISA.48.9
reference: Isaiah 48:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לְמַ֤עַן שְׁמִ/י֙ אַאֲרִ֣יךְ אַפִּ֔/י וּ/תְהִלָּתִ֖/י אֶחֱטָם לָ֑/ךְ לְ/בִלְתִּ֖י הַכְרִיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/009.yaml
  text: For the sake of my name I delay my anger[a], and for my praise I restrain it for you[c][b], so as not to cut you off.
translation:
  language: hi
  text: अपने नाम के निमित्त मैं क्रोध करने में देर करता हूँ[a], और अपनी स्तुति के लिए मैं उसे तुम्हारे लिए रोक रखता हूँ[b], ताकि तुम्हें काट न डालूँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘मैं अपनी नाक लंबी करता हूँ’ है; यह एक मुहावरा है, जिसका अर्थ ‘मैं अपने क्रोध को देर तक रोकता हूँ’ या ‘मैं क्रोध करने में धीमा हूँ’ है।
    reason: cultural_note
  - marker: b
    text: या ‘मैं उसे थामे रखता हूँ’; इब्रानी क्रिया मुँह बाँधने या लगाम लगाने का बिम्ब जगा सकती है।
    reason: lexical_alternative
  - marker: c
    text: या ‘तुम्हें नष्ट न कर दूँ’ अथवा ‘तुम्हारा नामोनिशान न मिटा दूँ’; ‘काट न डालूँ’ इब्रानी के अधिक शाब्दिक न्यायिक शब्दांकन को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן שְׁמִי
  choice: अपने नाम के निमित्त
  rationale: यह उद्देश्य और प्रेरणा—दोनों का भाव व्यक्त करता है तथा ‘नाम’ को परमेश्वर की प्रतिष्ठा, सम्मान और प्रकट चरित्र के अर्थ सहित बनाए रखता है।
- source_word: אַאֲרִיךְ אַפִּי
  choice: मैं क्रोध करने में देर करता हूँ
  rationale: शाब्दिक इब्रानी मुहावरे ‘मैं अपनी नाक लंबी करता हूँ’ का स्वाभाविक हिन्दी अर्थ देता है और यहाँ सामान्य स्वभाव के बजाय प्रथम पुरुष में कही गई कार्रवाई को बनाए रखता है।
- source_word: וּתְהִלָּתִי
  choice: और अपनी स्तुति के लिए
  rationale: ‘स्तुति’ संज्ञा को बनाए रखता है; सन्दर्भ में इसका आशय परमेश्वर को मिलने वाली स्तुति और उसकी प्रशंसनीय कीर्ति से है।
- source_word: אֶחֱטָם
  choice: मैं उसे ... रोक रखता हूँ
  rationale: क्रिया में लगाम लगाने या मुँह बाँधकर नियंत्रित करने का बिम्ब हो सकता है। हिन्दी में ‘रोक रखता हूँ’ स्पष्ट है, और ‘उसे’ का संकेत पिछले खंड के क्रोध की ओर है।
- source_word: לָךְ
  choice: तुम्हारे लिए
  rationale: सम्बोधित जन के प्रति हित या सम्बन्ध का संक्षिप्त और स्वाभाविक संकेत देता है।
- source_word: לְבִלְתִּי
  choice: ताकि ... न
  rationale: निषेधात्मक उद्देश्य या परिणाम को समकालीन हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: הַכְרִיתֶךָ
  choice: तुम्हें काट न डालूँ
  rationale: ‘काट डालना/काट देना’ मूल כרת के न्यायिक और सम्भावित वाचागत शब्दचित्र को ‘नष्ट करना’ जैसी सामान्यीकृत अभिव्यक्ति से अधिक निकटता से बनाए रखता है।
theological_decisions:
- issue: न्याय को रोकने की परमेश्वर की प्रेरणा
  choice: परमेश्वर अपने नाम और अपनी स्तुति के लिए क्रोध को रोकता है; सम्बोधित जन का बचा रहना उसका घोषित परिणाम है।
  alternative: मुख्य प्रेरणा इस्राएल का हित मानना, या ‘स्तुति’ को मुख्य पाठ में ‘महिमा’ अथवा ‘कीर्ति’ कहना।
  rationale: पद स्वयं परमेश्वर के नाम और स्तुति को उसके संयम का आधार बताता है, मानवीय योग्यता को नहीं। यह शब्दांकन किसी व्यापक साम्प्रदायिक सिद्धान्त को जोड़े बिना उसी बलाघात को बनाए रखता है।
- issue: ‘रोक रखता हूँ’ का अन्तर्निहित कर्म
  choice: पिछले खंड के ‘क्रोध’ को कर्म समझकर ‘उसे’ कहा गया है।
  alternative: कर्म को हिन्दी में भी अनकहा छोड़ना, या स्पष्ट रूप से ‘अपने कोप को’ जोड़ना।
  rationale: स्वाभाविक हिन्दी में यहाँ कर्म अपेक्षित है। ‘उसे’ इब्रानी की लोपयुक्त अभिव्यक्ति का सम्मान करते हुए निकटवर्ती सन्दर्भ से अधिक अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य शैली। ‘निमित्त’ थोड़ा औपचारिक है, पर भविष्यद्वाणी के काव्यात्मक-धार्मिक प्रसंग में स्वाभाविक है। ‘काट न डालूँ’ जानबूझकर मूल के कठोर शब्दचित्र को बनाए रखता है और उसका अर्थ पादटिप्पणी में स्पष्ट किया गया है।
