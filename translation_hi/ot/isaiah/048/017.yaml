base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/017.yaml
  text: 'Thus says Yahweh[a], your Redeemer, the Holy One of Israel: I am Yahweh your God, who teaches you to profit[b], who leads you in the way you should go.'
translation:
  language: hi
  text: 'यहोवा[a], तुम्हारा उद्धारकर्ता, इस्राएल का पवित्र, यों कहता है: “मैं यहोवा, तुम्हारा परमेश्वर हूँ, जो तुम्हें तुम्हारे हित के लिए सिखाता हूँ और जिस मार्ग पर तुम्हें चलना चाहिए[b], उस पर तुम्हारी अगुवाई करता हूँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “यहोवा” इब्रानी में परमेश्वर का व्यक्तिगत नाम יהוה (य्ह्व्ह) है।
    reason: divine_name
  - marker: b
    text: या, “जिस मार्ग पर तुम चलते हो।” इब्रानी क्रिया को वर्णनात्मक (“तुम चलते हो”) या प्रसंगानुसार निर्देशात्मक (“तुम्हें चलना चाहिए”) समझा जा सकता है; मुख्य पाठ में निर्देशात्मक अर्थ लिया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को केवल उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा व्यक्त किया गया है।
- source_word: גֹּאַלְךָ
  choice: तुम्हारा छुड़ानेवाला
  rationale: यह कृदन्त यहाँ यहोवा की उपाधि है। ‘छुड़ानेवाला’ उद्धार और बन्धन से मुक्त करने का भाव स्वाभाविक आधुनिक हिन्दी में रखता है, बिना मुख्य पाठ में निकट संबंधी की कानूनी भूमिका को अनावश्यक रूप से विशेष बनाने के।
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: इस्राएल का पवित्र जन
  rationale: यशायाह में बार-बार आने वाली इस निश्चित उपाधि का पवित्रता और इस्राएल से संबंध दोनों सहित संक्षिप्त अनुवाद।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय सहित वाचाई संबंध को सीधे और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: מְלַמֶּדְךָ
  choice: जो तुम्हें ... शिक्षा देता हूँ
  rationale: कृदन्त परमेश्वर के निरन्तर और विशिष्ट कार्य को दर्शाता है; सम्बन्धवाचक वाक्य हिन्दी में स्वाभाविक है।
- source_word: לְהוֹעִיל
  choice: तुम्हारे लाभ के लिए
  rationale: हिफ़ील धातु का लाभ पहुँचाने वाला प्रयोजन स्पष्ट करता है और ‘लाभ कमाना’ जैसे संकुचित आर्थिक अर्थ से बचता है।
- source_word: מַדְרִיכֲךָ
  choice: तुम्हारी अगुवाई करता हूँ
  rationale: कारक अर्थ और मार्ग पर आगे ले चलने का रूपक दोनों सुरक्षित रहते हैं।
- source_word: בְּדֶרֶךְ תֵּלֵךְ
  choice: जिस मार्ग पर तुम्हें चलना चाहिए
  rationale: मार्ग के जीवनगत रूपक को बनाए रखते हुए अपूर्ण क्रिया के प्रसंगगत निर्देशात्मक भाव को व्यक्त करता है; वैकल्पिक वर्णनात्मक पाठ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה की पुनरावृत्ति
  choice: यहोवा ... मैं यहोवा, तुम्हारा परमेश्वर हूँ
  alternative: प्रभु ... मैं प्रभु, तुम्हारा परमेश्वर हूँ
  rationale: मूल पाठ की दोनों पुनरावृत्तियों और जोरदार आत्म-परिचय को बनाए रखा गया है; नाम को सामान्य उपाधि में विलीन नहीं किया गया।
- issue: ईश्वरीय शिक्षा और मार्गदर्शन का भाव
  choice: तुम्हारे लाभ के लिए शिक्षा देता हूँ ... जिस मार्ग पर तुम्हें चलना चाहिए, उसी पर तुम्हारी अगुवाई करता हूँ
  alternative: लाभ करना सिखाता हूँ ... जिस मार्ग पर तुम चलते हो, उस पर तुम्हारा मार्गदर्शन करता हूँ
  rationale: पहला वाक्यांश परमेश्वर की शिक्षा के हितकारी उद्देश्य को और दूसरा प्रसंग में उचित मार्ग के निर्देशात्मक भाव को व्यक्त करता है, पर मूल की वर्णनात्मक सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सहज स्तर रखा गया है। वचन एक पुरुष श्रोता को एकवचन में सम्बोधित करता है, इसलिए ‘तुम्हारा/तुम्हें’ प्रयुक्त है। मुख्य पाठ में [a] उपस्थित है; निर्देशात्मक और वर्णनात्मक सम्भावना से जुड़ी [b] पादटिप्पणी के लिए उसका चिह्न मुख्य पाठ में ‘चाहिए’ के बाद होना चाहिए।
