review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the temporal sequence, the unopened-ear idiom, intensified treachery, and the designation as rebellious from the womb. However, it represents the threefold emphatic גַּם unevenly: the second occurrence is absorbed into a simple paired negation, and the third is not rendered as an emphatic element. The designation clause is more directly expressed as ‘तुम्हें … कहा जाता था’ than ‘तुम … कहलाते थे.’'
  naturalness: The Hindi is generally clear and suitably dignified. Repeating ‘निश्चय ही’ in all three parallel clauses is rhetorically marked but natural enough in this prophetic accusation and better reflects the Hebrew accumulation. ‘गर्भ से ही तुम्हें विद्रोही कहा जाता था’ is idiomatic modern Hindi.
  terminology: ‘विश्वासघात’ faithfully communicates בגד’s betrayal/breach-of-faith sense, and ‘विद्रोही’ appropriately retains the covenantal-defiant force of פֹשֵׁעַ. The footnotes are correctly anchored in the Hindi text and preserve the non-doctrinal, idiomatic scope of ‘गर्भ से.’
  issues:
  - severity: medium
    issue: The repeated גַּם is not fully represented.
    rationale: The Hebrew uses גַּם three times, each with cumulative emphasis. The draft has ‘निश्चय ही’ only twice and compresses the first two clauses into ‘न सुना था, न जाना था,’ thereby weakening the three-part rhetorical pattern.
  - severity: low
    issue: ‘कहलाते थे’ is less direct than the source idiom.
    rationale: קֹרָא לָךְ expresses being called/designated. ‘तुम्हें विद्रोही कहा जाता था’ more directly and naturally conveys this characterization.
