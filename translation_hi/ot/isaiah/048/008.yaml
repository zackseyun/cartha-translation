revisions:
- from: निश्चय ही, तुमने न सुना था, न जाना था; निश्चय ही, बहुत पहले से तुम्हारा कान नहीं खोला गया था। क्योंकि मैं जानता था कि तुम अवश्य विश्वासघात करोगे, और गर्भ ही से[a] तुम विद्रोही[b] कहलाते थे।
  to: निश्चय ही, तुमने न सुना था; निश्चय ही, तुमने न जाना था; निश्चय ही, बहुत पहले से तुम्हारा कान नहीं खोला गया था। क्योंकि मैं जानता था कि तुम अवश्य विश्वासघात करोगे, और गर्भ से ही[a] तुम्हें विद्रोही[b] कहा जाता था।
  rationale: Revision restores the source’s threefold emphatic progression by rendering each גַּם with ‘निश्चय ही.’ It also changes the final designation to ‘तुम्हें विद्रोही कहा जाता था,’ a more direct Hindi equivalent for being called/designated a transgressor. The wording retains ‘गर्भ से’ without turning the prophetic corporate idiom into a doctrinal claim about prenatal individual guilt.
