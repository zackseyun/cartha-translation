id: ISA.48.8
reference: Isaiah 48:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: גַּ֣ם לֹֽא שָׁמַ֗עְתָּ גַּ֚ם לֹ֣א יָדַ֔עְתָּ גַּ֕ם מֵ/אָ֖ז לֹא פִתְּחָ֣ה אָזְנֶ֑/ךָ כִּ֤י יָדַ֨עְתִּי֙ בָּג֣וֹד תִּבְגּ֔וֹד וּ/פֹשֵׁ֥עַ מִ/בֶּ֖טֶן קֹ֥רָא לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/008.yaml
  text: Indeed[a], you had not heard; indeed, you had not known; indeed, from of old your ear had not been opened. For I knew that you would surely deal treacherously[b], and that from the womb you would be called a transgressor.
translation:
  language: hi
  text: निश्चय ही, तुमने न सुना था; निश्चय ही, तुमने न जाना था; निश्चय ही, बहुत पहले से तुम्हारा कान नहीं खोला गया था। क्योंकि मैं जानता था कि तुम अवश्य विश्वासघात करोगे, और गर्भ से ही[a] तुम्हें विद्रोही[b] कहा जाता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जन्म से ही।’ इब्रानी में शाब्दिक रूप से ‘गर्भ से’ है—जीवन के सबसे आरम्भिक चरण के लिए प्रयुक्त अभिव्यक्ति।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपराधी।’ इब्रानी शब्द ऐसे व्यक्ति को सूचित करता है जो विद्रोह करता या निष्ठा तोड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: निश्चय ही / न…न
  rationale: तीन बार आए इस शब्द की संचयी और बलात्मक भूमिका को स्वाभाविक हिन्दी में आरम्भ और तीसरे खंड में ‘निश्चय ही’ तथा पहले दो समांतर निषेधों में ‘न…न’ से व्यक्त किया गया है।
- source_word: שָׁמַעְתָּ … יָדַעְתָּ
  choice: तुमने न सुना था, न जाना था
  rationale: दोनों पूर्ण क्रियाओं की समानांतरता और पूर्वकालिक दृष्टि को बनाए रखता है। ‘जानना’ ידע के संज्ञानात्मक अर्थ को अनावश्यक व्याख्या के बिना सुरक्षित रखता है।
- source_word: מֵאָז
  choice: बहुत पहले से
  rationale: यह किसी पुराने समय से चली आ रही स्थिति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘आरम्भ से’ जैसी अधिक निश्चित व्याख्या नहीं थोपता।
- source_word: פִתְּחָה אָזְנֶךָ
  choice: तुम्हारा कान नहीं खोला गया था
  rationale: मूल के सजीव मुहावरे को बनाए रखते हुए सुनने की ग्रहणशीलता अथवा प्रकाशन—दोनों संभावित संकेतों को खुला छोड़ता है।
- source_word: בָּגוֹד תִּבְגּוֹד
  choice: तुम अवश्य विश्वासघात करोगे
  rationale: क्रियार्थक संज्ञा और अपूर्ण क्रिया की पुनरुक्ति से आए प्रबल निश्चय को ‘अवश्य’ व्यक्त करता है; ‘विश्वासघात’ בגד के निष्ठा तोड़ने वाले अर्थ को दर्शाता है।
- source_word: מִבֶּטֶן
  choice: गर्भ ही से
  rationale: मूल की ठोस छवि और जीवन के आरम्भिक चरण का मुहावरेदार बल दोनों सुरक्षित रहते हैं।
- source_word: פֹשֵׁעַ
  choice: विद्रोही
  rationale: यह केवल सामान्य अपराध नहीं, बल्कि अधिकार और निष्ठा के विरुद्ध बगावत का भाव व्यक्त करता है।
- source_word: קֹרָא לָךְ
  choice: तुम … कहलाते थे
  rationale: इस पदबंध को पदनाम या चरित्र-निर्धारण के रूप में स्वाभाविक हिन्दी निष्क्रिय अभिव्यक्ति से प्रस्तुत किया गया है।
theological_decisions:
- issue: क्या ‘गर्भ ही से’ जन्मपूर्व व्यक्तिगत दोष का शाब्दिक दावा है या इस्राएल के आरम्भ से चले आए विद्रोह का काव्यात्मक वर्णन
  choice: मूल रूपक ‘गर्भ ही से’ को पाठ में ज्यों का त्यों रखते हुए इसे इस्राएल के आरम्भिक अस्तित्व से चले आए विद्रोही चरित्र के सामूहिक, भविष्यद्वक्तापरक वर्णन के रूप में खुला रखा गया है।
  alternative: इसे गर्भावस्था से व्यक्तिगत नैतिक दोष का स्पष्ट सिद्धान्त बनाकर प्रस्तुत करना।
  rationale: संदर्भ में संबोधन सामूहिक इस्राएल/याकूब से है। अनुवाद मूल की तीव्र भाषा को सुरक्षित रखता है, पर उससे आगे बढ़कर कोई सिद्धान्त निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘कान नहीं खोला गया था’ मूल मुहावरे की असामान्यता को जानबूझकर कुछ हद तक बनाए रखता है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न अपने संबंधित शब्दों से हटे हुए प्रतीत होते हैं; हिन्दी मुख्य पाठ में [a] को ‘गर्भ ही से’ और [b] को ‘विद्रोही’ पर रखा गया है ताकि प्रत्येक टिप्पणी अपने वास्तविक पाठांश से जुड़े।
