  text: וָ/אַגִּ֤יד לְ/ךָ֙ מֵ/אָ֔ז בְּ/טֶ֥רֶם תָּב֖וֹא הִשְׁמַעְתִּ֑י/ךָ פֶּן תֹּאמַר֙ עָצְבִּ֣/י עָשָׂ֔/ם וּ/פִסְלִ֥/י וְ/נִסְכִּ֖/י צִוָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/005.yaml
  text: I declared it to you long ago[a]; before it came to pass I made you hear it, lest you say, ‘My idol did them[b], and my carved image and my cast image commanded them.’
translation:
  language: hi
  text: मैंने तुझे बहुत पहले ही यह बता दिया था; उसके घटित होने से पहले[a] ही मैंने तुझे यह सुनाया था, कहीं ऐसा न हो कि तू कहे, ‘मेरी मूर्ति ने इन्हें घटित किया, और मेरी खुदी हुई प्रतिमा और मेरी ढली हुई प्रतिमा[b] ने इन्हें आज्ञा दी।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: ‘उसके आने से पहले।’'
    reason: lexical_alternative
  - marker: b
    text: ‘ढली हुई प्रतिमा’ का अनुवाद ‘पिघली हुई धातु की प्रतिमा’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַגִּיד
  choice: मैंने ... बता दिया था
  rationale: נגד के हिफ़ील रूप का अर्थ घोषित करना या बता देना है। यहाँ सामान्य पाठक के लिए स्वाभाविक हिंदी रखते हुए पूर्वघोषणा का भाव सुरक्षित है।
- source_word: מֵאָז
  choice: बहुत पहले ही
  rationale: यह बीते हुए पूर्वकाल की ओर संकेत करता है; संदर्भ में परमेश्वर ने घटना से काफी पहले इसकी सूचना दी थी।
- source_word: בְּטֶרֶם תָּבוֹא
  choice: उसके घटित होने से पहले
  rationale: शाब्दिक अर्थ ‘उसके आने से पहले’ है, पर स्त्रीलिंग एकवचन क्रिया संदर्भगत घटना की सिद्धि की ओर संकेत करती है। हिंदी में ‘घटित होने’ से यह अर्थ स्वाभाविक रूप में व्यक्त होता है।
- source_word: הִשְׁמַעְתִּיךָ
  choice: मैंने तुझे सुना दिया था
  rationale: שמע के हिफ़ील का कारणवाचक भाव ‘सुनाना’ से संक्षेप और स्वाभाविक हिंदी में सुरक्षित रहता है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह निषेधात्मक आशंका अथवा निवारक उद्देश्य प्रस्तुत करता है; आधुनिक हिंदी में यह स्वाभाविक समतुल्य है।
- source_word: עָצְבִּי
  choice: मेरी मूर्ति
  rationale: यह शब्द उपासना के लिए गढ़ी गई मूर्ति को सूचित करता है। अगले दो अधिक विशिष्ट मूर्ति-शब्दों से भेद बनाए रखने के लिए ‘मूर्ति’ चुना गया है।
- source_word: עָשָׂם
  choice: ये काम किए
  rationale: पुल्लिंग बहुवचन प्रत्यय पूर्वकथित कार्यों या घटनाओं को संदर्भित करता है। ‘ये काम किए’ हिंदी में अस्पष्ट बहुवचन संकेत को स्वाभाविक बनाता है।
- source_word: פִסְלִי
  choice: मेरी खुदी हुई प्रतिमा
  rationale: यह तराशने या खोदकर बनाने से निर्मित उपास्य प्रतिमा है; ‘खुदी हुई प्रतिमा’ निर्माण-विधि को स्पष्ट रखती है।
- source_word: נִסְכִּי
  choice: मेरी ढली हुई प्रतिमा
  rationale: यह पिघली धातु को साँचे में ढालकर बनाई गई प्रतिमा को दर्शाता है। ‘ढली हुई’ आधुनिक और सहज हिंदी है।
- source_word: צִוָּם
  choice: इनकी आज्ञा दी
  rationale: צוה का सामान्य अर्थ आज्ञा देना है। बहुवचन कर्म-प्रत्यय को ‘इनकी’ द्वारा रखा गया है, जो उन्हीं पूर्वकथित कार्यों की ओर संकेत करता है।
theological_decisions:
- issue: मूर्ति-संबंधी तीन इब्रानी शब्दों का भेद
  choice: ‘मूर्ति,’ ‘खुदी हुई प्रतिमा,’ और ‘ढली हुई प्रतिमा’—तीन अलग अभिव्यक्तियाँ
  alternative: तीनों को केवल ‘मूर्ति’ कहना
  rationale: मूल पाठ तीन संबंधित किन्तु भिन्न शब्दों द्वारा मूर्तियों के विरुद्ध कथन को तीखा करता है। भेद बनाए रखना स्रोत की वाक्पटुता को सुरक्षित रखता है।
- issue: आज्ञा देने का कर्ता
  choice: खुदी हुई और ढली हुई प्रतिमा को संयुक्त कर्ता के रूप में रखना
  alternative: प्रत्येक प्रतिमा को अलग-अलग आज्ञा देने वाला मानकर क्रिया दोहराना
  rationale: इब्रानी में संयुक्त कर्ता के बाद एकवचन क्रिया मिलती है, जो असामान्य होते हुए भी संभव है। हिंदी में दोनों संज्ञाओं को संयुक्त रूप से रखकर मूल तनाव को बिना अतिरिक्त व्याख्या के सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। संबोधन में एकवचन ‘तू/तुझे’ मूल के एकवचन रूपों को दर्शाता है। मूर्ति-संबंधी तीन शब्दों का अर्थगत भेद सुरक्षित रखा गया है।
