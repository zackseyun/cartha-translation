source:
  edition: WLC
  text: מִ/דַּעְתִּ֕/י כִּ֥י קָשֶׁ֖ה אָ֑תָּה וְ/גִ֤יד בַּרְזֶל֙ עָרְפֶּ֔/ךָ וּ/מִצְחֲ/ךָ֖ נְחוּשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/004.yaml
  text: Because I knew that you are stubborn[a], and your neck is an iron sinew, and your forehead is bronze[c][b],
translation:
  language: hi
  text: क्योंकि मैं जानता था कि तू हठी[a] है, और तेरी गर्दन लोहे की स्नायु[b] है, और तेरा माथा काँसे का[c] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘कठोर’ अथवा ‘अड़ियल’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘तेरी गर्दन लोहे की स्नायु है।’ यह चित्र हठपूर्ण प्रतिरोध को व्यक्त करता है।
    reason: cultural_note
  - marker: c
    text: ‘काँसे का माथा’ कठोरता और निर्लज्जता का रूपक है।
    reason: cultural_note
lexical_decisions:
- source_word: מִדַּעְתִּי כִּי
  choice: क्योंकि मैं जानता था कि
  rationale: מִן के कारणसूचक बल और כִּי द्वारा प्रस्तुत ज्ञात विषय—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קָשֶׁה
  choice: हठीला
  rationale: शाब्दिक अर्थ ‘कठोर’ है, पर व्यक्ति के विषय में यहाँ यह अड़ियलपन और अवज्ञाकारी हठ को दर्शाता है।
- source_word: וְגִיד בַּרְזֶל
  choice: लोहे की नस
  rationale: גִּיד नस या स्नायु को सूचित करता है; ‘लोहे की नस’ मूल के ठोस और तीखे रूपक को बनाए रखता है।
- source_word: עָרְפֶּךָ
  choice: तेरी गर्दन
  rationale: शब्द विशेषतः गर्दन के पिछले भाग को भी सूचित कर सकता है, किन्तु हिन्दी में ‘गर्दन’ हठपूर्ण प्रतिरोध के रूपक को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: וּמִצְחֲךָ נְחוּשָׁה
  choice: तेरा माथा काँसे का
  rationale: माथे और धातु के मूल रूपक को बनाए रखते हुए נְחוּשָׁה के लिए प्रसंगानुकूल ‘काँसा’ चुना गया है।
theological_decisions:
- issue: इस्राएल के विद्रोह का देह और धातु के रूपकों द्वारा वर्णन
  choice: ‘गर्दन लोहे की नस’ और ‘माथा काँसे का’ जैसे ठोस रूपक बनाए रखे गए।
  alternative: ‘तू झुकने को तैयार नहीं और निर्लज्ज है’ जैसे अर्थ-व्याख्यात्मक कथन।
  rationale: मूल इब्रानी हठपूर्ण प्रतिरोध और कठोर निर्लज्जता को सीधे अमूर्त शब्दों में नहीं, बल्कि सशक्त शारीरिक रूपकों से व्यक्त करता है; अनुवाद उस तनाव और चित्रात्मकता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। एकवचन संबोधन के लिए ‘तू/तेरी/तेरा’ रखा गया है, क्योंकि भविष्यद्वाणी में सामूहिक इस्राएल को एक व्यक्ति के रूप में सीधे संबोधित किया गया है।
