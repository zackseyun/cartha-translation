  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִקָּבְצ֤וּ כֻלְּ/כֶם֙ וּֽ/שֲׁמָ֔עוּ מִ֥י בָ/הֶ֖ם הִגִּ֣יד אֶת אֵ֑לֶּה יְהוָ֣ה אֲהֵב֔/וֹ יַעֲשֶׂ֤ה חֶפְצ/וֹ֙ בְּ/בָבֶ֔ל וּ/זְרֹע֖/וֹ כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/014.yaml
  text: 'Gather yourselves[a], all of you, and listen: who among them has declared these things? Yahweh loves him; he will carry out his purpose in Babylon, and his arm will be against the Chaldeans.'
translation:
  language: hi
  text: 'तुम सब इकट्ठे हो जाओ और सुनो: उनमें से किसने इन बातों की घोषणा की है? यहोवा उससे प्रेम करता है; वह बाबेल में उसकी इच्छा पूरी करेगा, और उसकी भुजा कसदियों के विरुद्ध होगी।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा उससे प्रेम करता है; वह बाबेल में अपनी इच्छा पूरी करेगा, और उसकी भुजा कसदियों पर होगी।” इस पाठ में बाद के सर्वनाम यहोवा के लिए समझे जाते हैं, न कि उसके चुने हुए साधन के लिए।
    reason: मूल इब्रानी में एकवचन पुल्लिंग सर्वनामों का संदर्भ अस्पष्ट है; वे चुने हुए साधन की ओर या यहोवा की ओर संकेत कर सकते हैं।
lexical_decisions:
- source_word: הִקָּבְצוּ כֻלְּכֶם
  choice: तुम सब इकट्ठे हो जाओ
  rationale: निफ़अल बहुवचन आज्ञार्थक को स्वाभाविक हिन्दी आह्वान के रूप में रखा गया है; כֻלְּכֶם की समावेशी और बलपूर्ण व्यापकता ‘तुम सब’ से व्यक्त होती है।
- source_word: וּשֲׁמָעוּ
  choice: और सुनो
  rationale: बहुवचन आज्ञार्थक में केवल ध्वनि सुनना नहीं, ध्यान देकर सुनना अभिप्रेत है; प्रसंग में ‘सुनो’ स्वाभाविक और पर्याप्त है।
- source_word: מִי בָהֶם הִגִּיד אֶת־אֵלֶּה
  choice: उनमें से किसने इन बातों की घोषणा की है?
  rationale: נגד के हिफ़ईल रूप का अर्थ बताना, घोषित करना या प्रकट करना है। ‘घोषणा की है’ पहले से कही गई भविष्यवाणी के विषय में अलंकारिक प्रश्न को व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम चतुरक्षरीय יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ दिया गया है।
- source_word: אֲהֵבוֹ
  choice: उससे प्रेम करता है
  rationale: אהב के पूर्ण रूप और एकवचन पुल्लिंग कर्म-प्रत्यय को हिन्दी में स्थायी वर्तमान भाव से व्यक्त किया गया है। ‘उससे’ उस अनाम चुने हुए साधन को सूचित करता है, पर पद से बाहर जाकर उसका नाम नहीं जोड़ता।
- source_word: יַעֲשֶׂה חֶפְצוֹ
  choice: वह उसकी इच्छा पूरी करेगा
  rationale: עשה और חפץ का मेल किसी इच्छा या अभिप्राय को कार्यरूप देने का भाव रखता है। ‘इच्छा पूरी करेगा’ वर्तमान हिन्दी में स्वाभाविक है। ‘वह/उसकी’ से मूल के सर्वनाम-संबंध की वास्तविक अस्पष्टता बनी रहती है।
- source_word: בְּבָבֶל
  choice: बाबेल में
  rationale: पूर्वसर्ग ב का सामान्य स्थानीय अर्थ ‘में’ सुरक्षित रखा गया है। न्याय का विरोधी भाव अगले खंड में स्पष्ट है, इसलिए यहाँ ‘के विरुद्ध’ जोड़कर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: וּזְרֹעוֹ כַּשְׂדִּים
  choice: और उसकी भुजा कसदियों के विरुद्ध होगी
  rationale: ‘भुजा’ को सामर्थ्य और कार्यकारी शक्ति के सजीव इब्रानी रूपक के रूप में बनाए रखा गया है। मूल में क्रिया और संबंधसूचक पूर्वसर्ग नहीं हैं; पिछले भविष्यकाल और न्याय-संदर्भ के आधार पर ‘होगी’ तथा ‘के विरुद्ध’ की पूर्ति की गई है।
theological_decisions:
- issue: ‘वह’, ‘उसकी इच्छा’ और ‘उसकी भुजा’ का संदर्भ
  choice: मुख्य पाठ में ‘वह’ और ‘उसकी भुजा’ चुने हुए मानवीय साधन को सूचित करते हैं, जबकि ‘उसकी इच्छा’ का सर्वनाम मूल पाठ की तरह संदर्भगत रूप से खुला रखा गया है; आशय यह हो सकता है कि वह यहोवा की इच्छा पूरी करता है।
  alternative: 'अगले सभी कथनों का कर्ता यहोवा स्वयं समझा जाए: यहोवा बाबेल में अपनी इच्छा पूरी करेगा और उसकी अपनी भुजा कसदियों पर होगी।'
  rationale: निकटवर्ती संदर्भ एक ऐसे व्यक्ति की ओर संकेत करता है जिसे यहोवा ने प्रेम किया और बुलाया है, पर इब्रानी में लगातार एकवचन पुल्लिंग सर्वनाम दोनों संभावित संदर्भों के कारण व्याकरणतः अस्पष्ट हैं। मुख्य पाठ संभावित प्रवाह रखता है और पाद-टिप्पणी वैकल्पिक पाठ को बिना मताग्रही समाधान के सुरक्षित करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘घोषणा’, ‘इच्छा’ और ‘भुजा’ जैसे शब्द मूल के भविष्यवाणी-संबंधी तथा काव्यात्मक स्वर को बनाए रखते हुए सामान्य हिन्दी पाठक के लिए समझने योग्य हैं। पाद-टिप्पणी-चिह्न [a] उसी वाक्य के अंत में रखा गया है जिस पर वैकल्पिक सर्वनाम-पाठ लागू होता है।
