reference: Isaiah 48:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ל֥וּא הִקְשַׁ֖בְתָּ לְ/מִצְוֺתָ֑/י וַ/יְהִ֤י כַ/נָּהָר֙ שְׁלוֹמֶ֔/ךָ וְ/צִדְקָתְ/ךָ֖ כְּ/גַלֵּ֥י הַ/יָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/018.yaml
  text: If only you had paid attention to my commandments! Then your peace would have been like a river[b][a], and your righteousness like the waves of the sea.
translation:
  language: hi
  text: काश, तूने मेरी आज्ञाओं पर ध्यान दिया होता![a] तब तेरी शांति नदी के समान और तेरी धार्मिकता[b] समुद्र की लहरों के समान होती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी आज्ञाओं की बात सुनी होती” अथवा “मेरी आज्ञाओं को माना होता।”
    reason: lexical_alternative
  - marker: b
    text: या “तेरा न्याय।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ל֥וּא
  choice: काश
  rationale: यह अवास्तविक रह गई इच्छा और खेद को स्वाभाविक, संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: הִקְשַׁ֖בְתָּ
  choice: तूने ... ध्यान दिया होता
  rationale: क्रिया केवल सुनने नहीं, बल्कि मन लगाकर सुनने और उसके अनुसार चलने का भाव रखती है; प्रतिकल्पित भूतकाल को ‘दिया होता’ से व्यक्त किया गया है।
- source_word: לְמִצְוֺתָי
  choice: मेरी आज्ञाओं पर
  rationale: ‘आज्ञाएँ’ वाचा-संबंधी और नैतिक भार को बनाए रखता है; हिन्दी में ‘पर ध्यान देना’ स्वाभाविक प्रयोग है।
- source_word: וַיְהִי
  choice: तब ... होती
  rationale: לוּא के बाद यह उस परिणाम को व्यक्त करता है जो शर्त पूरी होने पर घटित होता; हिन्दी की प्रतिकल्पित रचना इसे स्पष्ट करती है।
- source_word: כַנָּהָר
  choice: नदी के समान
  rationale: मूल उपमा को सीधे और काव्यात्मक ढंग से सुरक्षित रखता है।
- source_word: שְׁלוֹמֶךָ
  choice: तेरी शान्ति
  rationale: שָׁלוֹם में कुशलता और सम्पूर्णता के व्यापक अर्थ हो सकते हैं, पर यहाँ ‘शान्ति’ संक्षिप्त, पारंपरिक और प्रसंगानुकूल है।
- source_word: וְצִדְקָתְךָ
  choice: तेरी धार्मिकता
  rationale: यह आज्ञापालन से जुड़ी नैतिक-वाचागत सही अवस्था को व्यक्त करता है; ‘न्याय’ सम्भव अर्थ है और पादटिप्पणी में रखा गया है।
- source_word: כְּגַלֵּי הַיָּם
  choice: समुद्र की लहरों के समान
  rationale: मूल के प्रचुरता और निरन्तरता वाले सजीव काव्य-बिम्ब को बनाए रखता है।
theological_decisions:
- issue: צְדָקָה का प्रसंगगत अर्थ
  choice: धार्मिकता
  alternative: न्याय; निर्दोष ठहराया जाना
  rationale: आज्ञाओं की ओर ध्यान देने के प्रसंग में ‘धार्मिकता’ नैतिक और वाचागत सही अवस्था को व्यापक रूप से सुरक्षित रखती है। फिर भी ‘न्याय’ वास्तविक शाब्दिक सम्भावना है, इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। एकवचन पुल्लिंग सम्बोधन के लिए ‘तू/तेरी’ मूल के निकट और भविष्यद्वक्ताई सम्बोधन में स्वाभाविक है। ‘शान्ति’ की वर्तनी हिन्दी बाइबलीय परम्परा और मानक प्रयोग के अनुरूप चुनी गई है।
