source:
  edition: WLC
  text: כִּֽי מֵ/עִ֤יר הַ/קֹּ֨דֶשׁ֙ נִקְרָ֔אוּ וְ/עַל אֱלֹהֵ֥י יִשְׂרָאֵ֖ל נִסְמָ֑כוּ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/002.yaml
  text: For they are called from the holy city[a], and they lean on the God of Israel; Yahweh of hosts is his name.
translation:
  language: hi
  text: क्योंकि वे पवित्र नगर के नाम से कहलाते हैं[a] और इस्राएल के परमेश्वर का सहारा लेते हैं; सेनाओं का याहवे उसका नाम है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे पवित्र नगर से आते हैं।” हिब्रू में बल नगर से उनके उद्गम पर या नगर के नाम से मिली उनकी पहचान पर हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार बताता है; ‘क्योंकि’ उसके व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: מֵעִיר הַקֹּדֶשׁ
  choice: पवित्र नगर से
  rationale: ‘से’ मूल के מִן को निकटता से व्यक्त करता है और नगर से उद्गम तथा उससे मिली पहचान—दोनों संभावित अर्थों के लिए स्थान छोड़ता है।
- source_word: נִקְרָאוּ
  choice: कहलाते हैं
  rationale: קרא के निफ़अल रूप का स्वाभाविक निष्क्रिय अर्थ ‘कहलाना’ है; इसे ‘अपने आपको कहते हैं’ बनाना अनावश्यक रूप से आत्मवाचक अर्थ जोड़ता।
- source_word: וְעַל אֱלֹהֵי יִשְׂרָאֵל נִסְמָכוּ
  choice: और इस्राएल के परमेश्वर का सहारा लेते हैं
  rationale: ‘सहारा लेते हैं’ סמך में निहित टिकने या निर्भर रहने के रूपक को सहज आधुनिक हिन्दी में बनाए रखता है और संदर्भ की संभावित विडंबना को मिटाता नहीं।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में प्रयुक्त परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: यह व्यापक सामूहिक अर्थ को बनाए रखता है और इसे केवल मानवीय सेनाओं तक सीमित नहीं करता।
- source_word: שְׁמוֹ
  choice: उसका नाम है
  rationale: हिब्रू की प्रचलित नाम-घोषणा संरचना का सीधा और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसका लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: पवित्र नगर से लोगों के संबंध का अर्थ
  choice: पवित्र नगर से कहलाते हैं
  alternative: पवित्र नगर के निवासी कहलाते हैं; पवित्र नगर के नाम से कहलाते हैं
  rationale: हिब्रू में उद्गम या संबद्ध पहचान, दोनों की संभावना है। मुख्य पाठ की संक्षिप्त संरचना इस तनाव को बनाए रखती है और पादटिप्पणी दोनों अर्थ स्पष्ट करती है।
- issue: परमेश्वर पर निर्भरता का भाव
  choice: परमेश्वर का सहारा लेते हैं
  alternative: परमेश्वर पर भरोसा रखते हैं
  rationale: ‘सहारा’ मूल रूपक को बचाता है और आसपास के आरोपों के कारण उत्पन्न संभावित विडंबना को बिना व्याख्यात्मक विस्तार के रहने देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘कहलाते हैं’ और ‘सहारा लेते हैं’ मूल की निष्क्रिय रचना तथा निर्भरता के रूपक को बनाए रखते हैं; वाक्य की संक्षिप्त भविष्यद्वक्ताई शैली भी सुरक्षित है।
