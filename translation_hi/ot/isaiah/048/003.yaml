base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/003.yaml
  text: I declared the former things long ago[a]; they went out from my mouth, and I made them heard. Suddenly I acted[b], and they came to pass.
translation:
  language: hi
  text: पूर्व की बातों को मैंने बहुत पहले घोषित किया था; वे मेरे मुँह से निकलीं, और मैंने उन्हें सुनाया[a]। अचानक मैंने यह किया[b], और वे पूरी हो गईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैंने उनका प्रचार किया।” इब्रानी क्रिया कारणवाचक है, जिसका शाब्दिक भाव है, “मैंने उन्हें सुनवाया।”
    reason: lexical_alternative
  - marker: b
    text: या “मैंने कार्य किया।” इब्रानी में यहाँ ‘करना/बनाना’ की सामान्य क्रिया है; इस प्रसंग में परमेश्वर अपनी घोषित बातों को घटित करने के लिए कार्य करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִאשֹׁנוֹת
  choice: पहली बातें
  rationale: स्त्रीलिंग बहुवचन विशेषण यहाँ संज्ञा के रूप में पहले की घटनाओं या घोषणाओं को दर्शाता है। ‘पहली बातें’ यशायाह में आगे आने वाली ‘नई बातों’ के साथ इसके संबंध को भी बनाए रखता है।
- source_word: מֵאָז
  choice: बहुत पहले
  rationale: यह दूर अतीत में की गई घोषणा की ओर संकेत करता है; आधुनिक हिन्दी में ‘बहुत पहले’ स्वाभाविक और स्पष्ट है।
- source_word: הִגַּדְתִּי
  choice: मैंने घोषित किया था
  rationale: हिफ़ईल रूप किसी बात को औपचारिक रूप से प्रकट करने या बताने का भाव देता है; परमेश्वर की भविष्यसूचक वाणी के लिए ‘घोषित’ उपयुक्त गरिमा रखता है।
- source_word: וּמִפִּי יָצְאוּ
  choice: वे मेरे मुँह से निकलीं
  rationale: यह परमेश्वर के मुँह से वचन निकलने के मूल ठोस रूपक को सुरक्षित रखता है।
- source_word: וְאַשְׁמִיעֵם
  choice: मैंने उन्हें सुनाया
  rationale: שׁמע का हिफ़ईल रूप कारणवाचक है। ‘सुनाया’ हिन्दी में उस कारणवाचक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: פִּתְאֹם
  choice: अचानक
  rationale: यह परमेश्वर के कार्य की आकस्मिकता को सीधे और स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָשִׂיתִי
  choice: मैंने कार्य किया
  rationale: मूल क्रिया का सामान्य अर्थ ‘करना/बनाना’ है। इस प्रसंग में ‘कार्य किया’ परमेश्वर की सक्रियता को बनाए रखता है, पर ‘मैंने उन्हें पूरा किया’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: וַתָּבֹאנָה
  choice: वे पूरी हो गईं
  rationale: स्त्रीलिंग बहुवचन क्रिया ‘पहली बातों’ की ओर लौटती है। घोषणाओं या पूर्वकथित घटनाओं के वास्तविक होने के लिए ‘पूरी हो गईं’ आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: परमेश्वर की पूर्वघोषणा और घटनाओं की पूर्ति का संबंध
  choice: पद में परमेश्वर की घोषणा, उसके बाद उसके कार्य, और फिर बातों के पूरे होने—इन तीनों को रखा गया है।
  alternative: इसे केवल भविष्यवाणी के बाद घटनाएँ घटने के रूप में न्यूनतम ढंग से अनूदित किया जा सकता था, बिना परमेश्वर की सक्रिय भूमिका पर बल दिए।
  rationale: मूल क्रम—‘मैंने घोषित किया… मैंने सुनाया… मैंने किया… वे आ गईं’—घोषणा और परमेश्वर के कार्य दोनों को प्रस्तुत करता है। ‘मैंने कार्य किया’ इस दावे को सुरक्षित रखता है, पर मूल से आगे बढ़कर किसी विशिष्ट नियतिवादी व्याख्या को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘मेरे मुँह से निकलीं’ मूल रूपक को बनाए रखता है, जबकि ‘पूरी हो गईं’ आधुनिक पाठक के लिए पूर्वघोषित बातों के घटित होने का स्वाभाविक हिन्दी रूप है।
