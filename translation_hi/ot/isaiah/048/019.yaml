  terminology: “संतान,” “वंशज,” “कण,” and “उसका नाम” are suitable, consistent choices. “न तो काटा जाता, न मिटाया जाता” keeps the two-fold destructive parallel and is idiomatic enough in context, while the footnotes responsibly identify the lexical and number-related alternatives.
