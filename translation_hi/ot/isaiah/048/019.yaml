id: ISA.48.19
reference: Isaiah 48:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֤י כַ/חוֹל֙ זַרְעֶ֔/ךָ וְ/צֶאֱצָאֵ֥י מֵעֶ֖י/ךָ כִּ/מְעֹתָ֑י/ו לֹֽא יִכָּרֵ֧ת וְֽ/לֹא יִשָּׁמֵ֛ד שְׁמ֖/וֹ מִ/לְּ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/019.yaml
  text: Your offspring would have been like the sand[a], and the descendants from your body like its grains[b]; their name would not have been cut off or destroyed from before me.
translation:
  language: hi
  text: तेरी संतान रेत के समान होती, और तेरे शरीर से उत्पन्न वंशज उसके कणों[a] के समान होते; उसका नाम[b] मेरे सामने से न तो काटा जाता, न मिटाया जाता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके छोटे-छोटे टुकड़ों” अथवा “उसके कंकड़ों”; इब्रानी शब्द रेत के छोटे अंशों को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “उसका नाम”; एकवचन संभवतः संतान अथवा वंश को एक सामूहिक इकाई के रूप में प्रस्तुत करता है। अर्थ के अनुसार “उनका नाम” भी अनुवाद किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: होती / होते
  rationale: पद 18 की अधूरी रह गई शर्त और उसके परिणाम को ध्यान में रखते हुए हिन्दी की अपूर्ण संभावनार्थक रचना चुनी गई है।
- source_word: כַחוֹל
  choice: रेत के समान
  rationale: חוֹל का सामान्य अर्थ ‘रेत’ है; यह असंख्य संतान का स्वाभाविक और स्पष्ट बिंब बनाए रखता है।
- source_word: זַרְעֶךָ
  choice: तेरी संतान
  rationale: यहाँ זֶרַע शाब्दिक ‘बीज’ नहीं, सामूहिक अर्थ में वंश अथवा संतान को सूचित करता है।
- source_word: וְצֶאֱצָאֵי מֵעֶיךָ
  choice: और तेरे शरीर से उत्पन्न वंशज
  rationale: מֵעֶיךָ शाब्दिक रूप से भीतरी अंगों को दर्शाता है, पर इस वंशावली-संदर्भ में शारीरिक उद्गम अभिप्रेत है; यह अनुवाद अर्थ को स्पष्ट और गरिमापूर्ण रखता है।
- source_word: כִּמְעֹתָיו
  choice: उसके कणों के समान
  rationale: प्रत्यय का स्वाभाविक पूर्वपद ‘रेत’ है और दुर्लभ מְעֹתָיו उसके छोटे-छोटे अंशों की ओर संकेत करता है; ‘कण’ इस बिंब के अनुकूल है।
- source_word: לֹא יִכָּרֵת וְלֹא יִשָּׁמֵד
  choice: न तो काटा जाता, न मिटाया जाता
  rationale: दोनों निष्क्रिय क्रियाओं का तीव्र समानांतर सुरक्षित रखा गया है; ‘काटा जाता’ वंश या नाम के समाप्त किए जाने के मूल रूपक को बनाए रखता है।
- source_word: שְׁמוֹ
  choice: उसका नाम
  rationale: इब्रानी में पुल्लिंग एकवचन प्रत्यय है। ‘उसका’ संतान या वंश को सामूहिक और मानवीकृत एकक के रूप में प्रस्तुत करने वाली अस्पष्टता को बनाए रखता है।
- source_word: מִלְּפָנָי
  choice: मेरे सामने से
  rationale: यह मूल के ‘मेरे मुख/उपस्थिति के सामने से’ वाले स्थानिक मुहावरे को निकटता से और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पिछले पद की शर्त के संबंध में इस पद का प्रतिकल्पित अर्थ
  choice: ‘होती/होते’ और ‘न ... जाता’ द्वारा ऐसा परिणाम व्यक्त किया गया जो हो सकता था, पर हुआ नहीं
  alternative: इसे साधारण भूतकाल या भविष्यकाल में कहना
  rationale: पद 19, पद 18 के ‘यदि तूने ध्यान दिया होता’ वाले विलाप का परिणाम है; साधारण काल उस अधूरी रह गई संभावना को धुंधला कर देता।
- issue: שְׁמוֹ का वचन और संदर्भ
  choice: मुख्य पाठ में एकवचन ‘उसका नाम’
  alternative: ‘उनका नाम’ अथवा ‘उस वंश का नाम’
  rationale: मूल पाठ का प्रत्यय एकवचन पुल्लिंग है और संभवतः संतान-समूह को एक वंश के रूप में मानवीकृत करता है। एकवचन रखने से रूप और निहित तनाव दोनों सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण संबोधन रखा गया है। ‘तेरी/तेरे’ मूल के एकवचन संबोधन को स्पष्ट करता है। प्रतिकल्पित भाव हिन्दी की ‘होती/होते’ रचना से व्यक्त किया गया है; मूल के सामूहिक एकवचन ‘उसका नाम’ को सरल बनाकर बहुवचन नहीं किया गया।
