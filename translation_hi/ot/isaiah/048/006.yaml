source:
  edition: WLC
  text: שָׁמַ֤עְתָּֽ חֲזֵה֙ כֻּלָּ֔/הּ וְ/אַתֶּ֖ם הֲ/ל֣וֹא תַגִּ֑ידוּ הִשְׁמַעְתִּ֤י/ךָ חֲדָשׁוֹת֙ מֵ/עַ֔תָּה וּ/נְצֻר֖וֹת וְ/לֹ֥א יְדַעְתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/006.yaml
  text: You have heard; now see all this. And will you not declare it? From now on I make you hear new things, hidden things that you have not known.
translation:
  language: hi
  text: तूने सुना है; यह सब देख। और तुम लोग—क्या तुम इसकी घोषणा नहीं करोगे? अब से मैं तुझे नई बातें सुनाता हूँ—गुप्त रखी हुई बातें[a], जिन्हें तू नहीं जानता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “सुरक्षित रखी हुई बातें।”'
    reason: נְצֻרוֹת का शाब्दिक भाव ‘सुरक्षित/संरक्षित रखी हुई’ है, जबकि प्रसंग में ‘गुप्त’ या अब तक अप्रकट बातें भी अभिप्रेत हो सकती हैं।
lexical_decisions:
- source_word: שָׁמַעְתָּ חֲזֵה
  choice: तूने सुना है; अब ... देख
  rationale: दोनों क्रियाएँ एकवचन पुल्लिंग संबोधन में हैं। ‘अब’ हिब्रू में स्पष्ट रूप से नहीं है, पर अगले निर्देश की स्वाभाविक प्रगति और अंग्रेज़ी परामर्श-पाठ को ध्यान में रखते हुए इसे रखा गया है।
- source_word: כֻּלָּהּ
  choice: यह सब
  rationale: स्त्रीलिंग प्रत्यय का संदर्भ पूर्ववर्ती बातों/घटनाओं के समग्र समूह से है; हिन्दी में ‘यह सब’ स्वाभाविक और पर्याप्त रूप से खुला है।
- source_word: וְאַתֶּם הֲלוֹא תַגִּידוּ
  choice: और तुम लोग—क्या तुम इसकी घोषणा नहीं करोगे?
  rationale: यहाँ संबोधन बहुवचन में बदलता है। ‘तुम लोग’ इस बदलाव को आधुनिक हिन्दी में स्पष्ट करता है; ‘घोषणा’ נגד धातु के सार्वजनिक रूप से बताने के भाव को व्यक्त करती है।
- source_word: הִשְׁמַעְתִּיךָ
  choice: मैं तुझे ... सुनाता हूँ
  rationale: हिफ़िल रूप का अर्थ ‘सुनने देना/सुनाना’ है और प्रत्यय फिर एकवचन है। वर्तमानकालीन ‘सुनाता हूँ’ מֵעַתָּה (‘अब से’) के आरंभिक भाव के अनुकूल है।
- source_word: וּנְצֻרוֹת
  choice: गुप्त रखी हुई बातें
  rationale: नצר का मूल भाव सुरक्षित/संरक्षित रखना है; प्रसंग में ऐसी बातें अभिप्रेत हैं जो अब तक प्रकट नहीं की गईं, इसलिए ‘गुप्त रखी हुई’ दोनों पक्षों को समेटता है।
theological_decisions:
- issue: एकवचन और बहुवचन संबोधन का परिवर्तन
  choice: ‘तू/तुझे’ और ‘तुम लोग’ के द्वारा परिवर्तन को बनाए रखा गया
  alternative: सभी संबोधनों को सामान्य ‘तुम’ से एकरूप करना
  rationale: हिब्रू पाठ पहले एकवचन, बीच में बहुवचन, और फिर एकवचन प्रयोग करता है। इसे समतल करने के बजाय सामूहिक और प्रतिनिधिक संबोधन के बीच मूल तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण हिन्दी अपनाई गई है। एकवचन के लिए ‘तू’ मूल व्याकरणिक भेद को स्पष्ट करता है, जबकि बहुवचन के लिए ‘तुम लोग’ रखा गया है। वाक्य की काव्यात्मक गति के लिए अर्धविराम और दीर्घ विराम का प्रयोग किया गया है।
