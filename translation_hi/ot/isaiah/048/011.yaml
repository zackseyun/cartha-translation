review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the emphatic repetition of לְמַעֲנִי, the unspecified object of ‘I will act,’ the rhetorical question, and the refusal to give divine glory to another. However, ‘कैसे अपवित्र हो?’ is not idiomatic Hindi as a rhetorical passive question and risks being read as an incomplete imperative. ‘यह’ can be used without identifying the implicit Hebrew referent, as in the English audit trail’s ‘it.’
  naturalness: ‘अपने ही कारण’ is understandable but less natural than ‘अपने ही लिए’ for the motive/purpose sense of לְמַעֲנִי. Recasting the question as ‘यह अपवित्र कैसे हो सकता है?’ produces grammatical, modern Hindi while retaining the source’s unspecified referent. Moving ‘मैं’ before ‘अपनी महिमा’ gives smoother Hindi syntax.
  terminology: ‘महिमा’ appropriately renders כָּבוֹד in this divine self-declaration. ‘किसी दूसरे को’ suitably preserves לְאַחֵר without specifying idols or any other referent. ‘अपवित्र’ is an appropriate rendering of the passive sense of יֵחָל.
  issues:
  - severity: medium
    issue: The rhetorical question ‘क्योंकि कैसे अपवित्र हो?’ is syntactically unnatural in modern standard Hindi.
    rationale: Hindi needs a finite passive/modal construction here. ‘यह अपवित्र कैसे हो सकता है?’ is natural and preserves the unspecified referent rather than supplying ‘मेरा नाम.’
  - severity: low
    issue: ‘अपने ही कारण’ is an awkward expression for ‘for my own sake.’
    rationale: ‘अपने ही लिए’ more idiomatically conveys acting for one’s own sake while retaining the repetition and emphasis.
  revised_text: अपने ही लिए, अपने ही लिए मैं कार्य करूँगा; क्योंकि यह अपवित्र कैसे हो सकता है?[a] और मैं अपनी महिमा किसी दूसरे को नहीं दूँगा।
  revised_footnotes:
