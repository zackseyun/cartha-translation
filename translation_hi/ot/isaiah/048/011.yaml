source:
  edition: WLC
  text: לְמַעֲנִ֧/י לְמַעֲנִ֛/י אֶעֱשֶׂ֖ה כִּ֣י אֵ֣יךְ יֵחָ֑ל וּ/כְבוֹדִ֖/י לְ/אַחֵ֥ר לֹֽא אֶתֵּֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/011.yaml
  text: For my own sake[a], for my own sake, I will act; for how can it be profaned? And my glory I will not give to another.
translation:
  language: hi
  text: अपने ही लिए, अपने ही लिए मैं कार्य करूँगा; क्योंकि यह अपवित्र कैसे हो सकता है?[a] और मैं अपनी महिमा किसी दूसरे को नहीं दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि मेरा नाम कैसे अपवित्र हो सकता है?” इब्रानी में कर्ता या संदर्भ स्पष्ट रूप से नहीं बताया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעֲנִי
  choice: अपने ही कारण
  rationale: לְמַעַן उद्देश्य या प्रेरक कारण व्यक्त करता है। ‘अपने ही कारण’ आत्म-संदर्भित बल को व्यक्त करता है, और इसकी पुनरावृत्ति मूल पाठ के जोर को बनाए रखती है।
- source_word: אֶעֱשֶׂה
  choice: मैं कार्य करूँगा
  rationale: עשה का अर्थ व्यापक रूप से ‘करना’ है और यहाँ उसका कर्म व्यक्त नहीं है। ‘कार्य करूँगा’ बिना कोई विशेष कार्य जोड़े परमेश्वर की निर्णायक क्रिया को व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵיךְ יֵחָל
  choice: कैसे अपवित्र हो?
  rationale: יֵחָל, חלל का निफ़अल रूप, ‘अपवित्र होना’ व्यक्त करता है। हिन्दी में कर्ता को अनकहा रखकर संक्षिप्त आलंकारिक प्रश्न मूल इब्रानी की अस्पष्टता और तीखेपन को बचाता है।
- source_word: וּכְבוֹדִי
  choice: और अपनी महिमा
  rationale: כָּבוֹד के लिए ‘महिमा’ इस ईश्वरीय आत्म-घोषणा के संदर्भ में स्वाभाविक और अर्थपूर्ण है। ‘अपनी’ हिन्दी वाक्य में कर्ता से संबंध स्पष्ट करती है।
- source_word: לְאַחֵר
  choice: किसी दूसरे को
  rationale: यह यहोवा से अलग किसी अन्य पक्ष को सूचित करता है। यह अनुवाद मूर्तियों या प्रतिद्वंद्वी दावेदारों को स्पष्ट रूप से जोड़े बिना विरोधी भाव को बनाए रखता है।
- source_word: אֶתֵּן
  choice: मैं ... नहीं दूँगा
  rationale: נתן का सामान्य अर्थ ‘देना’ है। यह सीधा अनुवाद मूल कथन की दृढ़ता को बनाए रखता है।
theological_decisions:
- issue: ‘कैसे अपवित्र हो?’ में अनकहा कर्ता या संदर्भ
  choice: मुख्य पाठ में ‘मेरा नाम’ या ‘मैं’ न जोड़कर कर्ता को अनकहा रखा गया है।
  alternative: ‘क्योंकि मेरा नाम कैसे अपवित्र हो?’ अथवा ‘क्योंकि मैं कैसे अपवित्र होऊँ?’
  rationale: इब्रानी में יֵחָל का संदर्भ स्पष्ट रूप से व्यक्त नहीं है। ‘मेरा नाम’ संदर्भानुसार संभावित और प्रचलित समझ है, पर उसे मुख्य पाठ में जोड़ना स्रोत की वास्तविक अस्पष्टता को समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘कैसे अपवित्र हो?’ जानबूझकर कुछ अंडाकार है, क्योंकि अधिक सहज विस्तार मूल पाठ के अनकहे संदर्भ को व्याख्यात्मक रूप से निश्चित कर देता।
