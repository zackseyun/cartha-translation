source:
  edition: WLC
  text: קִרְב֧וּ אֵלַ֣/י שִׁמְעוּ זֹ֗את לֹ֤א מֵ/רֹאשׁ֙ בַּ/סֵּ֣תֶר דִּבַּ֔רְתִּי מֵ/עֵ֥ת הֱיוֹתָ֖/הּ שָׁ֣ם אָ֑נִי וְ/עַתָּ֗ה אֲדֹנָ֧/י יְהוִ֛ה שְׁלָחַ֖/נִי וְ/רוּחֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/016.yaml
  text: 'Come near to me[a]; hear this: From the beginning I have not spoken in secret; from the time it came to be, I was there. And now the Lord GOD has sent me[c][b], and his Spirit.'
translation:
  language: hi
  text: 'मेरे निकट आओ; यह सुनो: आरम्भ से मैंने गुप्त रूप से बात नहीं की; जिस समय से यह अस्तित्व में आया[a], मैं वहाँ था। और अब प्रभु याहवे ने मुझे भेजा है—और उसकी आत्मा को भी[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस समय से यह घटित हुआ,” अथवा “जिस समय से यह विद्यमान था।” इब्रानी का शाब्दिक भाव है, “इसके होने के समय से।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में अंतिम पदबंध का वाक्यगत संबंध संक्षिप्त है। इसका अर्थ “और उसकी आत्मा” हो सकता है; इसे “उसकी आत्मा ने भी [मुझे भेजा है]” अथवा “प्रभु याहवे ने मुझे और अपनी आत्मा को भेजा है” भी समझा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: קִרְבוּ אֵלַי
  choice: मेरे निकट आओ
  rationale: קרב का बहुवचन आज्ञार्थक रूप सीधे पास आने का आह्वान करता है; यह हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: שִׁמְעוּ זֹאת
  choice: यह सुनो
  rationale: बहुवचन आज्ञार्थक क्रिया और संकेतवाचक सर्वनाम को संक्षिप्त तथा प्रत्यक्ष रूप में रखा गया है।
- source_word: לֹא מֵרֹאשׁ בַּסֵּתֶר דִּבַּרְתִּי
  choice: आरम्भ से मैंने गुप्त में बात नहीं की
  rationale: מֵרֹאשׁ आरम्भ या शुरू से होने का बोध देता है, और בַּסֵּתֶר छिपे या गुप्त ढंग से बोलने को दर्शाता है। हिन्दी शब्दक्रम मूल कथन के बल को बनाए रखता है।
- source_word: מֵעֵת הֱיוֹתָהּ
  choice: जब से यह अस्तित्व में आया
  rationale: शाब्दिक अर्थ ‘इसके होने के समय से’ है। ‘अस्तित्व में आया’ घटना या विषय को जरूरत से अधिक निश्चित किए बिना היות के भाव को सुरक्षित रखता है।
- source_word: שָׁם אָנִי
  choice: तब से मैं वहाँ था
  rationale: मूल में काल स्पष्ट रूप से चिह्नित नहीं है, पर पिछली समय-सूचक अभिव्यक्ति के कारण हिन्दी में भूतकाल स्वाभाविक है। ‘तब से’ प्रसंगगत संबंध स्पष्ट करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को लिप्यंतरित ‘याहवे’ किया गया है; इससे दोनों पदों का भेद बना रहता है।
- source_word: שְׁלָחַנִי
  choice: मुझे भेजा है
  rationale: पूर्ण क्रिया और प्रथम पुरुष कर्म-प्रत्यय वर्तमान दायित्व से जुड़ी पूरी हुई भेजने की क्रिया बताते हैं; हिन्दी पूर्ण वर्तमान यहाँ स्वाभाविक है।
- source_word: וְרוּחוֹ
  choice: और उसकी आत्मा ने भी
  rationale: רוּחַ के अर्थ आत्मा, श्वास या वायु हो सकते हैं। इस भेजे जाने के प्रसंग में ‘आत्मा’ उपयुक्त है। ‘ने भी’ एक सम्भव वाक्यगत संबंध व्यक्त करता है, जबकि वैकल्पिक संरचना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: वक्ता की पहचान
  choice: प्रथम पुरुष के वक्ता को मुख्य पाठ में अनाम रखा गया है।
  alternative: वक्ता को स्पष्ट रूप से दास या मसीह कहना।
  rationale: इब्रानी पाठ इस पद में वक्ता की पहचान स्पष्ट नहीं करता। इसलिए किसी मसीही व्याख्या को अनुवाद के भीतर जोड़ने के बजाय इस अस्पष्टता को बनाए रखा गया है।
- issue: וְרוּחוֹ का वाक्यगत संबंध
  choice: 'मुख्य पाठ में इसे भेजने वाले एक सह-विषय के रूप में पढ़ा गया है: ‘और उसकी आत्मा ने भी।’'
  alternative: 'इसे भेजी गई दूसरी सत्ता के रूप में पढ़ना: ‘प्रभु याहवे ने मुझे और अपनी आत्मा को भेजा है’; अथवा अधिक ढीले रूप में ‘और उसकी आत्मा।’'
  rationale: इब्रानी में अंतिम पदबंध संक्षिप्त है और उसके वाक्यगत संबंध को एक से अधिक प्रकार से समझा जा सकता है। मुख्य पाठ एक प्राचीन और प्रसंग-संगत समझ देता है, पर वैकल्पिक पठन पादटिप्पणी में रखा गया है ताकि त्रित्व-संबंधी निष्कर्ष को पाठ पर जबरन न थोपा जाए।
- issue: יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: यह परमेश्वर का व्यक्तिगत वाचा-नाम है। लिप्यंतरण नाम और אֲדֹנָי ‘प्रभु’ के बीच अंतर बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण भविष्यद्वाणी-संबंधी रजिस्टर रखा गया है। ‘गुप्त में’ और ‘अस्तित्व में आया’ जैसे पद मूल की संक्षिप्तता तथा अर्थगत खुलापन बनाए रखते हैं। सभी पादटिप्पणी-चिह्न संबंधित शब्दखंडों के तुरंत बाद दिए गए हैं।
