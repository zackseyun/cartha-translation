  yaml_path: translation/ot/isaiah/048/012.yaml
  text: 'Listen to me[a], Jacob, and Israel, whom I called: I am he; I am the first[b], and I am the last.'
translation:
  language: hi
  text: '“हे याकूब, मेरी सुन, और हे इस्राएल, जिसे मैंने बुलाया है[a]: मैं वही हूँ[b]; मैं प्रथम हूँ, और मैं ही अन्तिम हूँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक शब्दशः: “इस्राएल, मेरा बुलाया हुआ।”'
    reason: lexical_alternative
  - marker: b
    text: या “मैं वह हूँ।” यह हिब्रू अभिव्यक्ति परमेश्वर के आत्म-परिचय का एक संक्षिप्त सूत्र है, जो यशायाह में बार-बार आता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע אֵלַי
  choice: मेरी सुन
  rationale: एकवचन पुल्लिंग आज्ञार्थक और אֵלַי को स्वाभाविक, वर्तमान हिन्दी में व्यक्त करता है तथा ध्यान देकर सुनने की आज्ञा बनाए रखता है।
- source_word: יַעֲקֹב וְיִשְׂרָאֵל
  choice: हे याकूब … हे इस्राएल
  rationale: दोनों सम्बोधनों को स्पष्ट रखते हुए एक ही वाचा-समुदाय के समानान्तर नामों को सुरक्षित रखता है।
- source_word: מְקֹרָאִי
  choice: जिसे मैंने बुलाया है
  rationale: प्रत्यययुक्त निष्क्रिय/परिणामसूचक रूप का अर्थ सहज हिन्दी में देता है; अधिक शब्दशः अर्थ पादटिप्पणी में रखा गया है।
- source_word: אֲנִי הוּא
  choice: मैं वही हूँ
  rationale: हिब्रू के संक्षिप्त आत्म-परिचय सूत्र में אֲנִי और הוּא दोनों की शक्ति को स्वाभाविक हिन्दी में बनाए रखता है, बिना उसे केवल ‘मैं हूँ’ कर देने के।
- source_word: רִאשׁוֹן
  choice: प्रथम
  rationale: अन्तिम के समानान्तर परमेश्वर की निरपेक्ष प्राथमिकता को संक्षिप्त, गरिमापूर्ण रूप में व्यक्त करता है।
- source_word: אַף אֲנִי אַחֲרוֹן
  choice: और मैं ही अन्तिम हूँ
  rationale: אַף की योगात्मक/बलाघाती शक्ति को ‘और … ही’ से व्यक्त करता है और प्रथम–अन्तिम का संतुलन बनाए रखता है।
theological_decisions:
- issue: אֲנִי הוּא में परमेश्वर का आत्म-परिचय
  choice: मैं वही हूँ
  alternative: मैं वह हूँ; मैं हूँ
  rationale: ‘मैं वही हूँ’ यशायाह में प्रयुक्त इस गूढ़ आत्म-घोषणा की संक्षिप्तता और धर्मवैचारिक भार को बनाए रखता है। यह הוּא को छोड़ता नहीं और किसी बाद की धर्मसैद्धान्तिक व्याख्या को अनुवाद में नहीं जोड़ता।
- issue: רִאשׁוֹן ... אַחֲרוֹן में परमेश्वर की अद्वितीयता
  choice: मैं प्रथम हूँ और मैं ही अन्तिम हूँ
  alternative: मैं पहला हूँ और मैं आखिरी हूँ
  rationale: ‘प्रथम/अन्तिम’ गरिमापूर्ण और स्पष्ट हैं; ‘ही’ אַף के बल को प्रकट करता है, पर कथन को समय या सत्ता की किसी विस्तृत व्याख्या में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किन्तु गरिमापूर्ण सम्बोधन रखा गया है। ‘मेरी सुन’ बोलचाल में समझ आने वाला है, जबकि ‘प्रथम’ और ‘अन्तिम’ आत्म-घोषणा की काव्यात्मक समता तथा गम्भीरता बनाए रखते हैं। दो बार ‘सुन’ देने से हिन्दी वाक्य स्पष्ट होता है; दूसरा प्रयोग अर्थ की व्याख्यात्मक पुनरावृत्ति है, नया कथन नहीं।
