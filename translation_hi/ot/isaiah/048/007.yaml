  text: עַתָּ֤ה נִבְרְאוּ֙ וְ/לֹ֣א מֵ/אָ֔ז וְ/לִ/פְנֵי י֖וֹם וְ/לֹ֣א שְׁמַעְתָּ֑/ם פֶּן תֹּאמַ֖ר הִנֵּ֥ה יְדַעְתִּֽי/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/007.yaml
  text: Now they are created[a], and not from long ago; before today you had not heard them, lest you should say, ‘Look, I knew them.’
translation:
  language: hi
  text: अब वे रची गई हैं[a], बहुत पहले से नहीं; आज से पहले तुमने उनके बारे में नहीं सुना था, कहीं ऐसा न हो कि तुम कहो, “देखो, मैं उन्हें जानता था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अब वे अस्तित्व में लाई गई हैं, प्राचीन काल से नहीं; आज से पहले तुमने उनके बारे में नहीं सुना था।”
    reason: נִבְרְאוּ की सृजनात्मक भाषा और מֵאָז के समयगत भाव का वैकल्पिक, अधिक व्याख्यात्मक रूप।
lexical_decisions:
- source_word: עַתָּה
  choice: अब
  rationale: यह वर्तमान समय में इन बातों के प्रकट या साकार होने को पहले के समय से अलग करता है।
- source_word: נִבְרְאוּ
  choice: वे रची गई हैं
  rationale: निफ़ाल पूर्ण रूप में प्रयुक्त ברא के सृजन-संबंधी बल को बनाए रखते हुए वर्तमान परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵאָז
  choice: बहुत पहले से
  rationale: दूर अतीत से अस्तित्व में होने का निषेध स्पष्ट करता है और 'अब' के साथ समयगत विरोध बनाए रखता है।
- source_word: וְלִפְנֵי יוֹם
  choice: आज से पहले
  rationale: इब्रानी मुहावरे का सहज आधुनिक हिन्दी रूप, जिसका अर्थ इस दिन से पूर्व या पहले है।
- source_word: שְׁמַעְתָּם
  choice: तुमने उनके बारे में नहीं सुना था
  rationale: सुनने अथवा उनके विषय में जानकारी पाने के अर्थ को व्यक्त करता है; 'के बारे में' हिन्दी में निर्जीव बातों के साथ स्वाभाविक है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: रोकथाम या आशंकित परिणाम का अर्थ स्पष्ट और स्वाभाविक हिन्दी में देता है।
- source_word: תֹּאמַר
  choice: तुम कहो
  rationale: פֶּן के बाद संभावित कथन को व्यक्त करता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: दावे पर ध्यान खींचने वाला आधुनिक, गरिमापूर्ण उद्गार है।
- source_word: יְדַעְתִּין
  choice: मैं उन्हें जानता था
  rationale: पूर्वज्ञान के दावे को स्रोत के निकट रखते हुए व्यक्त करता है; 'पहले से' जोड़कर निहितार्थ को अनावश्यक रूप से स्पष्ट नहीं किया गया।
theological_decisions:
- issue: नई बातों के लिए 'रचना' का अर्थ
  choice: '''वे रची गई हैं'' कहकर सृजन की भाषा बनाए रखना'
  alternative: '''वे घटित की गई हैं'' या ''वे प्रकट की गई हैं'''
  rationale: मूल में ברא है, जो परमेश्वर द्वारा इन नई वास्तविकताओं को अस्तित्व में लाने पर बल देता है; इसे केवल घोषणा या भविष्यवाणी तक सीमित नहीं किया गया।
- issue: बहुवचन सर्वनाम का संदर्भ
  choice: '''वे/उनके/उन्हें'' द्वारा संदर्भ को सामान्य रखना'
  alternative: '''ये घटनाएँ'' या ''ये बातें'' स्पष्ट रूप से जोड़ना'
  rationale: संदर्भ नई प्रकट की गई बातों या घटनाओं का है, पर पद स्वयं उनकी प्रकृति को और संकीर्ण नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण शैली। एकवचन पुरुष संबोधन के लिए 'तुम' रखा गया है। इब्रानी की सृजन-भाषा और पद की संदर्भगत अस्पष्टता सुरक्षित रखी गई है।
