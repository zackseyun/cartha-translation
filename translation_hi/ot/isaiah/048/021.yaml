base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/021.yaml
  text: They did not thirst when he led them through the deserts[a]; he made water flow for them from the rock; he split the rock[b], and water gushed out.
translation:
  language: hi
  text: जब वह उन्हें सूखे प्रदेशों से होकर ले गया, तब उन्हें प्यास नहीं लगी[a]; उसने उनके लिए चट्टान से पानी बहाया; उसने चट्टान को चीर दिया[b], और पानी बह निकला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उजाड़ प्रदेशों में” या “सूखे स्थानों से होकर।”
    reason: lexical_alternative
  - marker: b
    text: यह पद जंगल में यहोवा द्वारा चट्टान से पानी देने की घटना की प्रतिध्वनि करता है (उदाहरण के लिए, निर्गमन 17:6; गिनती 20:11)।
    reason: cross_reference
lexical_decisions:
- source_word: צָמְאוּ
  choice: प्यासे नहीं हुए
  rationale: यह क्रियात्मक अर्थ को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: בָּחֳרָבוֹת
  choice: सूखे प्रदेशों से होकर
  rationale: बहुवचन संज्ञा उजाड़ और शुष्क क्षेत्रों को सूचित करती है; गति-सूचक הוֹלִיכָם के साथ ‘से होकर’ प्रसंगानुकूल है और किसी खास भू-आकृति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הוֹלִיכָם
  choice: वह उन्हें ... ले गया
  rationale: हिफ़ील रूप का प्रेरणार्थक भाव सहज हिन्दी में ‘ले गया’ से व्यक्त होता है।
- source_word: הִזִּיל
  choice: उसने ... पानी बहाया
  rationale: 'यह נזל के हिफ़ील रूप का कारणवाचक भाव सुरक्षित रखता है: उसने पानी को बहने दिया अथवा बहाया।'
- source_word: מִצּוּר
  choice: चट्टान से
  rationale: यह पानी के स्रोत को सीधे व्यक्त करता है; हिन्दी में यहाँ अनावश्यक निश्चिततावाचकता जोड़े बिना संकेत स्पष्ट रहता है।
- source_word: וַיִּבְקַע צוּר
  choice: उसने चट्टान को चीर दिया
  rationale: בקע का ठोस बिंब ‘चीर दिया’ से स्पष्ट, गरिमापूर्ण और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: וַיָּזֻבוּ מָיִם
  choice: पानी बह निकला
  rationale: यह पानी के बाहर प्रवाहित होने को व्यक्त करता है और मूल से अधिक तीव्रता आरोपित नहीं करता।
theological_decisions:
- issue: पूरे पद में तीसरे पुरुष एकवचन कर्ता का संदर्भ
  choice: ‘वह/उसने’ को बनाए रखा गया; प्रसंग में इसका संदर्भ यहोवा है
  alternative: मुख्य पाठ में स्पष्ट रूप से ‘यहोवा’ जोड़ना
  rationale: इब्रानी पद में कर्ता के रूप में कोई संज्ञा स्पष्टतः नहीं दी गई है। सर्वनाम-सदृश अभिव्यक्ति प्रसंगगत संदर्भ को सुरक्षित रखती है और मूल से अधिक स्पष्टता नहीं जोड़ती।
- issue: निर्गमनकालीन जंगल में चट्टान से पानी मिलने की अंतर्पाठीय प्रतिध्वनि
  choice: मुख्य पाठ में ऐतिहासिक-काव्यात्मक संकेत को बिना विस्तार के रखा गया
  alternative: इसे प्रतिरूपात्मक या संस्कार-संबंधी अर्थ के रूप में स्पष्ट करना
  rationale: पद जंगल में परमेश्वर द्वारा पानी दिए जाने की घटनाओं की स्पष्ट प्रतिध्वनि करता है, पर बाद की धर्मवैज्ञानिक व्याख्या को मुख्य पाठ में जोड़ना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। समानांतर उपवाक्यों और चट्टान-पानी के ठोस बिंब को बनाए रखते हुए मूल की अस्पष्टता तथा अंतर्पाठीय संकेत सुरक्षित रखे गए हैं।
