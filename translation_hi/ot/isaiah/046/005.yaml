base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/005.yaml
  text: To whom will you liken me and make me equal[a], and compare me, that we may be alike?
translation:
  language: hi
  text: तुम मुझे किसके समान ठहराओगे, और मुझे किसके बराबर ठहराओगे, और मेरी तुलना किससे करोगे कि हम एक समान हों?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में तुलना के लिए कई निकटार्थक क्रियाएँ एक के बाद एक रखी गई हैं, जिससे इस प्रश्न की चुनौती और तीव्र हो जाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמִי
  choice: किससे
  rationale: लְ उपसर्ग सहित प्रश्नवाचक रूप तुलना के दूसरे पक्ष को व्यक्त करता है; हिन्दी में ‘किससे’ स्वाभाविक और सटीक है।
- source_word: תְדַמְיוּנִי
  choice: तुम मेरी उपमा ... दोगे
  rationale: דמה के पिएल रूप का अर्थ किसी के समान ठहराना या उपमा देना है; यह चयन तुलना का भाव और कर्मवाचक प्रत्यय ‘मुझे/मेरी’ दोनों सुरक्षित रखता है।
- source_word: וְתַשְׁווּ
  choice: मुझे ... बराबर ठहराओगे
  rationale: שוה के हिफ़ील में समान स्तर पर रखने का भाव है। समानांतर रचना से निहित कर्म ‘मुझे’ स्पष्ट किया गया है।
- source_word: וְתַמְשִׁלוּנִי
  choice: तुम मेरी तुलना ... करोगे
  rationale: यहाँ משל का हिफ़ील तुलना या समानता स्थापित करने को व्यक्त करता है। ‘तुलना’ पहले निकटार्थक क्रिया से अलग शब्द रखते हुए इब्रानी की संचयी वाग्मिता बनाए रखता है।
- source_word: וְנִדְמֶה
  choice: कि हम एक समान हों
  rationale: דמה का प्रथम पुरुष बहुवचन रूप दोनों तुलना-पक्षों को ‘हम’ में सम्मिलित करता है; ‘हों’ संभावित या कल्पित परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मूर्तिपूजा-विरोधी प्रश्न में तुलना-सूचक क्रियाओं की परतें
  choice: तीनों निकटार्थक अभिव्यक्तियाँ—उपमा देना, बराबर ठहराना और तुलना करना—बनाए रखी गईं।
  alternative: प्रवाह के लिए इन्हें एक या दो क्रियाओं में समेट देना।
  rationale: इब्रानी पाठ परमेश्वर की किसी से तुलना करने की असंभवता पर बल देने के लिए निकटार्थक क्रियाएँ एक के बाद एक रखता है। उन्हें बनाए रखना अलंकारिक चुनौती को सुरक्षित रखता है, बिना कोई अतिरिक्त धर्मसैद्धांतिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज प्रश्नात्मक रूप अपनाया गया है। ‘उपमा देना’, ‘बराबर ठहराना’ और ‘तुलना करना’ इब्रानी की पुनरुक्तिपूर्ण तीव्रता को स्वाभाविक हिन्दी में सुरक्षित रखते हैं।
