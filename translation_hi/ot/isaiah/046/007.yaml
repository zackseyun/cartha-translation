base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/007.yaml
  text: They lift it onto the shoulder[a], they carry it, and they set it in its place, and it stands there; it does not move from its place. Even if someone cries out to it, it does not answer; it does not save him from his distress.
translation:
  language: hi
  text: वे उसे कंधे पर उठाते हैं, उसे ढोते हैं और उसके स्थान पर रख देते हैं[a]। वह वहीं खड़ा रहता है; अपने स्थान से हिलता तक नहीं। कोई उसे पुकारे भी, तो वह उत्तर नहीं देता; वह उसे उसके संकट से नहीं बचाता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप है, “वे उसे उसके नीचे रख देते हैं”; संभवतः आशय है कि मूर्ति को उसके नियत स्थान या आधार पर रख दिया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂאֻהוּ עַל כָּתֵף
  choice: वे उसे उठाकर कंधे पर रखते हैं
  rationale: נשׂא की उठाने की आरंभिक क्रिया को अगले סבל से अलग रखा गया है; एकवचन ‘कंधा’ हिन्दी में भी स्वाभाविक है।
- source_word: יִסְבְּלֻהוּ
  choice: उसे ढोते हैं
  rationale: סבל किसी भार को उठाकर ले जाने का बोध देता है। ‘ढोते’ मूर्ति के भारी बोझ और व्यंग्य को ‘ले जाते’ की अपेक्षा अधिक स्पष्ट रखता है।
- source_word: וְיַנִּיחֻהוּ תַחְתָּיו
  choice: उसके स्थान पर रख देते हैं
  rationale: शाब्दिक ‘उसके नीचे’ प्रसंग में संभवतः मूर्ति को उसके आधार या नियत स्थान पर रखने का संकेत है; मुख्य पाठ में अर्थ स्पष्ट किया गया और शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְיַעֲמֹד מִמְּקוֹמוֹ לֹא יָמִישׁ
  choice: वह वहीं खड़ा रहता है; अपने स्थान से हिलता तक नहीं
  rationale: עמד और מושׁ दोनों को अलग-अलग व्यक्त करते हुए मूर्ति की स्थिरता और असमर्थता पर किया गया व्यंग्य बनाए रखा गया है।
- source_word: אַף יִצְעַק אֵלָיו וְלֹא יַעֲנֶה
  choice: कोई उसे पुकारे भी, तो वह उत्तर नहीं देता
  rationale: אַף की emphatic concessive शक्ति को ‘भी, तो’ से और अनिर्दिष्ट तृतीय पुरुष कर्ता को स्वाभाविक हिन्दी ‘कोई’ से व्यक्त किया गया है।
- source_word: מִצָּרָתוֹ לֹא יוֹשִׁיעֶנּוּ
  choice: वह उसे उसके संकट से नहीं बचाता
  rationale: צרה के लिए ‘संकट’ और ישׁע के हिफ़ील रूप के लिए ‘बचाता’ सरल, गरिमापूर्ण तथा उद्धार की विफलता का भाव रखने वाले विकल्प हैं।
theological_decisions:
- issue: अंतिम उपवाक्य में सामान्य अर्थ वाला पुल्लिंग एकवचन
  choice: ‘कोई ... उसे उसके संकट से’
  alternative: ‘वह पुकारे ... उसे उसके संकट से’ अथवा बहुवचन-सदृश समावेशी रूप
  rationale: इब्रानी का व्याकरणिक पुल्लिंग एकवचन यहाँ सामान्य व्यक्ति के लिए है। ‘कोई’ इस सामान्य अर्थ को स्पष्ट करता है, जबकि आगे के एकवचन सर्वनाम स्रोत की संख्या बनाए रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज पर गरिमापूर्ण शैली। ‘ढोते’ से मूर्ति के भार और निर्बलता का व्यंग्य उभरता है। ‘हिलता तक नहीं’ emphatic भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
