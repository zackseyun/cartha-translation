  text: calling from the east a bird of prey[a], from a distant land the man of my purpose. Indeed, I have spoken; indeed, I will bring it to pass. I have formed it; indeed[b], I will do it.
translation:
  language: hi
  text: मैं पूर्व दिशा से एक शिकारी पक्षी[a] को बुलाता हूँ, दूर देश से मेरी योजना पूरी करने वाले मनुष्य[b] को। निश्चय ही, मैंने कहा है; निश्चय ही, मैं उसे पूरा करूँगा। मैंने उसे रचा है[c]; निश्चय ही, मैं उसे करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: व्यापक संदर्भ में पूर्व दिशा से बुलाए गए इस व्यक्ति को प्रायः कुस्रू समझा जाता है, पर इस पद में उसका नाम नहीं दिया गया है।
    reason: cross_reference
  - marker: b
    text: शाब्दिक रूप से, “मेरी योजना का मनुष्य” या “मेरी सम्मति का मनुष्य।”
    reason: lexical_alternative
  - marker: c
    text: या, “मैंने उसे गढ़ा है” अथवा “मैंने उसे रूप दिया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵא
  choice: मैं ... बुलाता हूँ
  rationale: पुल्लिंग एकवचन क़ाल कृदंत प्रसंग में परमेश्वर के निरंतर/वर्णनात्मक कार्य को व्यक्त करता है। हिन्दी में स्पष्ट कर्ता के साथ वर्तमानकालीन क्रिया स्वाभाविक है।
- source_word: מִמִּזְרָח
  choice: पूर्व दिशा से
  rationale: מִזְרָח का सामान्य भौगोलिक अर्थ ‘पूर्व’ है; ‘पूर्व दिशा से’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: עַיִט
  choice: एक शिकारी पक्षी
  rationale: शब्द किसी विशिष्ट पक्षी-प्रजाति को नहीं, सामान्यतः शिकार करने वाले हिंस्र पक्षी को सूचित करता है; इसलिए ‘उकाब’ जैसी अतिनिर्दिष्ट पहचान से बचा गया है।
- source_word: מֵאֶרֶץ מֶרְחָק
  choice: दूर देश से
  rationale: यह भौगोलिक दूरी बताने वाला स्वाभाविक मुहावरा है और हिब्रू की संक्षिप्तता बनाए रखता है।
- source_word: אִישׁ עֲצָתוֹ
  choice: उस मनुष्य को जो मेरे उद्देश्य को पूरा करेगा
  rationale: עֵצָה यहाँ परमेश्वर की योजना/अभिप्राय के अर्थ में है। केवल ‘मेरे उद्देश्य का मनुष्य’ हिन्दी में अस्वाभाविक है; कार्यात्मक वाक्यांश अर्थ को स्पष्ट करता है, जबकि पादटिप्पणी अधिक रूपगत विकल्प सुरक्षित रखती है।
- source_word: אַף
  choice: हाँ ... भी
  rationale: दोहराया गया אַף दृढ़ पुष्टि और बल देता है। हिन्दी में ‘हाँ’ और ‘भी’ का संयोजन इस आश्वस्तकारी, emphatic लय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: דִּבַּרְתִּי
  choice: मैंने कहा है
  rationale: पूर्ण क्रिया पूर्व में किए गए दिव्य कथन की वर्तमान प्रासंगिकता रखती है; हिन्दी पूर्णकाल इसे ठीक व्यक्त करता है।
- source_word: אֲבִיאֶנָּה
  choice: मैं उसे पूरा भी करूँगा
  rationale: स्त्रीलिंग प्रत्यय सबसे स्वाभाविक रूप से परमेश्वर की कही हुई योजना/बात की ओर संकेत करता है। ‘पूरा करूँगा’ हिन्दी में causative fulfillment का सहज अर्थ देता है।
- source_word: יָצַרְתִּי
  choice: मैंने उसे ठहराया है
  rationale: יָצַר का मूल अर्थ गढ़ना/रचना है, पर यहाँ अमूर्त योजना के लिए उद्देश्यपूर्ण निर्धारण का भाव है। ‘ठहराया’ हिन्दी में इस प्रसंग में स्वाभाविक है; पादटिप्पणी ‘रचा’ के ठोस रूपक को सुरक्षित रखती है।
- source_word: אֶעֱשֶׂנָּה
  choice: मैं उसे कर भी दिखाऊँगा
  rationale: עשה व्यापक ‘करना’ है। ‘कर दिखाऊँगा’ अंतिम कथन की दृढ़ता और हिब्रू की जोरदार समाप्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘शिकारी पक्षी’ और ‘मेरे उद्देश्य’ के मनुष्य की पहचान
  choice: मुख्य पाठ में रूपक को ज्यों का त्यों रखा गया और व्यक्ति का नाम नहीं जोड़ा गया।
  alternative: व्यापक संदर्भ के आधार पर उसे कुस्रू के रूप में स्पष्ट करना।
  rationale: इस पद में व्यक्ति का नाम नहीं है। अनुवाद को ऐतिहासिक पहचान को पाठ में आरोपित करने के बजाय मूल रूपक और उसकी व्याख्यात्मक खुलावट बनाए रखनी चाहिए।
- issue: אֲבִיאֶנָּה और אֶעֱשֶׂנָּה के स्त्रीलिंग प्रत्ययों का संकेत
  choice: ‘उसे’ को परमेश्वर के कहे हुए उद्देश्य/कार्य की ओर संकेत करने दिया गया।
  alternative: इसे बुलाए गए पुरुष के लिए ‘उसे/उसको ले आऊँगा’ समझना।
  rationale: स्त्रीलिंग प्रत्यय पुल्लिंग אִישׁ की अपेक्षा निहित स्त्रीलिंग संज्ञा—योजना, बात या घोषणा—की ओर अधिक स्वाभाविक रूप से संकेत करता है। हिन्दी सर्वनाम जानबूझकर पर्याप्त खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर वाक्यों और दोहराए गए बलसूचक אַף की दृढ़ लय को ‘हाँ ... भी’ तथा ‘कर दिखाऊँगा’ से व्यक्त किया गया है। रूपक को किसी विशिष्ट पक्षी या नामित ऐतिहासिक व्यक्ति तक सीमित नहीं किया गया।
