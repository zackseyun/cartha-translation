source:
  edition: WLC
  text: מַגִּ֤יד מֵֽ/רֵאשִׁית֙ אַחֲרִ֔ית וּ/מִ/קֶּ֖דֶם אֲשֶׁ֣ר לֹא נַעֲשׂ֑וּ אֹמֵר֙ עֲצָתִ֣/י תָק֔וּם וְ/כָל חֶפְצִ֖/י אֶעֱשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/010.yaml
  text: declaring the end from the beginning[a], and from ancient times things that have not been done, saying, ‘My purpose shall stand[c][b], and I will accomplish all my good pleasure.’
translation:
  language: hi
  text: जो आरम्भ ही से अन्त की घोषणा करता है[a], और प्राचीन काल से उन बातों की घोषणा करता है जो अब तक नहीं हुई हैं; जो कहता है, “मेरी योजना स्थिर रहेगी[b], और मैं अपनी सारी इच्छा पूरी करूँगा।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आरम्भ से ही परिणाम की घोषणा करता है।”
    reason: אַחֲרִית का अर्थ ‘अन्त’ के साथ-साथ ‘परिणाम’ भी हो सकता है।
  - marker: b
    text: या “मेरी सम्मति कायम रहेगी” अथवा “मेरा उद्देश्य स्थिर रहेगा।”
    reason: עֵצָה के अर्थ-क्षेत्र में सम्मति, योजना और उद्देश्य शामिल हैं।
  - marker: c
    text: या “जो कुछ मुझे भाता है वह सब मैं करूँगा।”
    reason: חֵפֶץ इच्छा, अभिलाषा या प्रसन्नता को व्यक्त कर सकता है; עשה का अधिक शाब्दिक अनुवाद ‘करूँगा’ है।
lexical_decisions:
- source_word: מַגִּיד
  choice: घोषणा करता है
  rationale: נגד के हिफ़ील कृदन्त का अर्थ किसी बात को प्रकट करना या घोषित करना है; यह चयन भविष्यवाणी की गरिमापूर्ण शैली को बनाए रखता है।
- source_word: מֵרֵאשִׁית אַחֲרִית
  choice: आरम्भ ही से अन्त
  rationale: यह अनुवाद मूल के स्पष्ट कालगत विरोध—आरम्भ और अन्त—को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וּמִקֶּדֶם
  choice: और प्राचीन काल से
  rationale: קֶדֶם यहाँ बहुत पुराने समय का बोध कराता है और पहले वाक्यांश के समानान्तर है।
- source_word: אֲשֶׁר לֹא נַעֲשׂוּ
  choice: उन बातों की जो अब तक नहीं हुईं
  rationale: शाब्दिक अर्थ ‘जो नहीं की गईं’ है, पर प्रसंग में भाव उन घटनाओं का है जो अभी घटित नहीं हुईं; ‘अब तक’ इस निहित कालगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֲצָתִי
  choice: मेरी योजना
  rationale: עֵצָה का अर्थ सम्मति, योजना या उद्देश्य हो सकता है। यहाँ क्रियान्वित होने वाले परमेश्वर के अभिप्राय के लिए ‘योजना’ स्पष्ट और सहज है।
- source_word: תָקוּם
  choice: स्थिर रहेगी
  rationale: קום यहाँ टिके रहने, कायम रहने या प्रभावी सिद्ध होने का अर्थ देता है; ‘स्थिर रहेगी’ दृढ़ता के रूपक को बनाए रखता है।
- source_word: וְכָל חֶפְצִי
  choice: अपनी सारी इच्छा
  rationale: חֵפֶץ इच्छा, अभिलाषा या प्रसन्नता को सूचित कर सकता है। ‘सारी इच्छा’ दिव्य अभिप्राय को स्पष्ट करता है, बिना ‘अच्छी’ जैसा ऐसा विशेषण जोड़े जो मूल में नहीं है।
- source_word: אֶעֱשֶׂה
  choice: पूरी करूँगा
  rationale: עשה का मूल अर्थ ‘करना’ है; योजना और इच्छा के प्रसंग में ‘पूरी करूँगा’ उसके सफल क्रियान्वयन को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: עֲצָתִי और חֶפְצִי में परमेश्वर के अभिप्राय और इच्छा का निरूपण
  choice: मेरी योजना स्थिर रहेगी, और मैं अपनी सारी इच्छा पूरी करूँगा
  alternative: मेरी सम्मति कायम रहेगी, और जो कुछ मुझे भाता है वह सब मैं करूँगा
  rationale: यह रूप परमेश्वर के घोषित अभिप्राय की स्थिरता और उसके क्रियान्वयन—दोनों को बनाए रखता है, पर मूल से परे कोई संप्रदायगत निष्कर्ष नहीं जोड़ता। חֵפֶץ की इच्छा/प्रसन्नता वाली अर्थ-व्याप्ति को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यवाणी-शैली रखी गई है। ‘आरम्भ ही से अन्त’ मूल के संक्षिप्त विरोध को बचाता है; ‘अब तक नहीं हुईं’ शाब्दिक निष्प्राण वाक्य की अपेक्षा सामान्य पाठक के लिए स्वाभाविक है। मुख्य पाठ में ‘योजना’ और ‘इच्छा’ स्पष्ट हैं, जबकि ‘सम्मति,’ ‘उद्देश्य’ और ‘भाता है’ जैसे वास्तविक विकल्प पादटिप्पणियों में दिए गए हैं।
