  text: וְ/עַד זִקְנָה֙ אֲנִ֣י ה֔וּא וְ/עַד שֵיבָ֖ה אֲנִ֣י אֶסְבֹּ֑ל אֲנִ֤י עָשִׂ֨יתִי֙ וַ/אֲנִ֣י אֶשָּׂ֔א וַ/אֲנִ֥י אֶסְבֹּ֖ל וַ/אֲמַלֵּֽט־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/004.yaml
  text: Even to your old age[a], I am he, and to gray hairs I will carry you. I have made, and I will bear; I will carry[b], and I will rescue.
translation:
  language: hi
  text: तुम्हारे बुढ़ापे तक भी मैं वही हूँ, और बाल सफेद होने तक मैं तुम्हें उठाए रहूँगा[a]। मैंने बनाया है, और मैं तुम्हें उठाऊँगा; मैं तुम्हें उठाए रहूँगा और तुम्हें छुड़ाऊँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुम्हें सँभालूँगा।” इब्रानी क्रिया का अर्थ भार को सहारा देकर उठाना या वहन करना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हें बचाऊँगा” या “तुम्हें छुड़ा दूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד זִקְנָה
  choice: तुम्हारे बुढ़ापे तक भी
  rationale: जीवन की वृद्धावस्था तक परमेश्वर की निरंतर देखभाल पर दिए गए बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है। संदर्भ से संबोधित लोगों का भाव स्पष्ट होने के कारण ‘तुम्हारे’ जोड़ा गया है।
- source_word: אֲנִי הוּא
  choice: मैं वही हूँ
  rationale: इब्रानी की संक्षिप्त और गंभीर आत्म-पहचान को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के सुरक्षित रखता है।
- source_word: וְעַד שֵיבָה
  choice: और बाल पकने तक
  rationale: שֵׂיבָה के पके या सफेद बालों वाले ठोस बिंब को आधुनिक, सहज हिन्दी में बनाए रखता है।
- source_word: אֶסְבֹּל
  choice: मैं तुम्हें उठाए रहूँगा
  rationale: סבל के भार सँभालते हुए ढोने के अर्थ और आसपास के उठाने-ढोने के बिंब को व्यक्त करता है; ‘रहूँगा’ निरंतरता को स्वाभाविक रूप से सामने लाता है।
- source_word: עָשִׂיתִי
  choice: मैंने ही तुम्हें बनाया है
  rationale: मूल क्रिया का सामान्य अर्थ ‘बनाना’ है। संदर्भगत कर्म को स्पष्ट किया गया है और ‘ही’ अगले खंड के जोरदार אֲנִי के साथ हिन्दी में संतुलन बनाता है।
- source_word: אֶשָּׂא
  choice: मैं ही तुम्हारा भार उठाऊँगा
  rationale: נשא के उठाने अथवा वहन करने के अर्थ को समर्थन देने वाले रूप में व्यक्त करता है और मूर्तियों को मनुष्यों द्वारा ढोए जाने के विपरीत परमेश्वर द्वारा अपने लोगों का भार उठाने की संदर्भगत तुलना बनाए रखता है।
- source_word: וַאֲנִי אֶסְבֹּל
  choice: मैं तुम्हें उठाए रहूँगा
  rationale: पहले प्रयुक्त उसी इब्रानी क्रिया की पुनरावृत्ति को हिन्दी में भी उसी अभिव्यक्ति से सुरक्षित रखा गया है।
- source_word: וַאֲמַלֵּט
  choice: और तुम्हें छुड़ाऊँगा
  rationale: मूल पिएल रूप के किसी को संकट से निकालकर सुरक्षित करने के अर्थ को सामान्य आधुनिक हिन्दी में व्यक्त करता है, बिना इसे अनावश्यक रूप से व्यापक पारिभाषिक उद्धार-अर्थ देने के।
theological_decisions:
- issue: אֲנִי הוּא में परमेश्वर की आत्म-पहचान
  choice: मैं वही हूँ
  alternative: मैं ही वह हूँ / वह मैं ही हूँ
  rationale: यह चयन मूल की गंभीर आत्म-घोषणा और उसकी संभावित व्यापक धर्मवैज्ञानिक प्रतिध्वनि को बनाए रखता है, पर किसी बाद की धर्मसैद्धांतिक व्याख्या को पाठ में नहीं जोड़ता।
- issue: עָשִׂיתִי का कर्म
  choice: मैंने ही तुम्हें बनाया है
  alternative: मैंने बनाया है
  rationale: मूल में कर्म अव्यक्त है, किंतु निकट संदर्भ में परमेश्वर द्वारा अपने लोगों को बनाने और उठाने की बात है। हिन्दी में ‘तुम्हें’ अर्थ को स्वाभाविक रूप से स्पष्ट करता है, जबकि धर्मवैज्ञानिक विस्तार नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बाल पकने’ का जीवंत बिंब सुरक्षित है। उठाने और भार वहन करने की पुनरावृत्त छवि को यथासंभव बनाए रखा गया है; अनावश्यक संस्कृतनिष्ठ शब्दावली से बचा गया है।
