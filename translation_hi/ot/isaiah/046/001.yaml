id: ISA.46.1
reference: Isaiah 46:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כָּרַ֥ע בֵּל֙ קֹרֵ֣ס נְב֔וֹ הָיוּ֙ עֲצַבֵּי/הֶ֔ם לַ/חַיָּ֖ה וְ/לַ/בְּהֵמָ֑ה נְשֻׂאֹתֵי/כֶ֣ם עֲמוּס֔וֹת מַשָּׂ֖א לַ/עֲיֵפָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/001.yaml
  text: Bel bows down[a]; Nebo stoops. Their idols are for the beasts and the cattle. Your loads are borne[c][b], loaded as a burden for the weary.
translation:
  language: hi
  text: बेल झुक पड़ा है; नबू ढह रहा है। उनकी मूर्तियाँ पशुओं और मवेशियों पर लदी हैं। तुम्हारी ढोई जाने वाली वस्तुएँ लदी हुई हैं[b]—थके हुए पशु के लिए बोझ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: इस हिब्रू पद का रूप कठिन है। इसका अर्थ “तुम्हारी उठाई हुई वस्तुएँ” या जुलूस अथवा परिवहन में उठाई जाने वाली देव-प्रतिमाएँ हो सकता है।
    reason: textual_or_grammatical_difficulty
  - marker: c
    text: या “थके हुए के लिए बोझ।” स्त्रीलिंग एकवचन रूप संभवतः उस भारवाही पशु की ओर संकेत करता है जो मूर्तियों को ढो रहा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרַע
  choice: झुक गया है
  rationale: यह काल 3 पुल्लिंग एकवचन पूर्ण रूप है और भविष्यसूचक दृश्य में बेल के पतन व अपमान को सजीव रूप से दिखाता है।
- source_word: בֵּל
  choice: बेल
  rationale: बेबीलोन के देवता का नाम है; इसे अनुवादित करने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: קֹרֵס
  choice: नीचे को झुक रहा है
  rationale: यह कृदन्त झुकने या ढहने की अवस्था बताता है और पहले खंड के समानांतर पतन का चित्र बनाए रखता है।
- source_word: נְבוֹ
  choice: नबू
  rationale: बेबीलोन के देवता के अक्कादी नाम Nabû के निकट प्रचलित हिन्दी लिप्यंतरण चुना गया है।
- source_word: עֲצַבֵּיהֶם
  choice: उनकी मूर्तियाँ
  rationale: शब्द गढ़ी हुई देव-प्रतिमाओं को सूचित करता है। मुख्य पाठ में स्वाभाविक हिन्दी 'मूर्तियाँ' रखी गई है और उसका निंदात्मक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: לַחַיָּה וְלַבְּהֵמָה
  choice: पशुओं और मवेशियों पर
  rationale: दोनों संज्ञाओं का व्यापक भेद रखते हुए प्रसंगानुसार उन जानवरों का चित्र स्पष्ट किया गया है जिन पर प्रतिमाएँ लादी जाती हैं। हिब्रू संबंधसूचक उपसर्ग यहाँ भार रखे जाने के अर्थ में 'पर' किया गया है।
- source_word: נְשֻׂאֹתֵיכֶם
  choice: जिन्हें तुम उठाए फिरते थे
  rationale: रूप कठिन है और शाब्दिक रूप से 'तुम्हारी उठाई हुई वस्तुएँ/भार' जैसा अर्थ दे सकता है। संदर्भ में इसका संकेत जुलूस या परिवहन में उठाई जाने वाली देव-प्रतिमाओं की ओर है।
- source_word: עֲמוּסוֹת
  choice: लाद दी गई हैं
  rationale: עמס का स्त्रीलिंग बहुवचन कर्मवाच्य कृदन्त है और निकटवर्ती 'मूर्तियाँ/उठाई हुई वस्तुएँ' के लादे जाने की अवस्था व्यक्त करता है।
- source_word: מַשָּׂא
  choice: भारी बोझ
  rationale: मूल अर्थ 'बोझ/भार' है। 'भारी' थके हुए वाहक पर उसके दबाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना अलग नई धारणा जोड़े।
- source_word: לַעֲיֵפָה
  choice: थके हुए पशु के लिए
  rationale: स्त्रीलिंग एकवचन विशेषण संभवतः पहले उल्लिखित किसी भारवाही पशु को निहित रूप से सूचित करता है। मुख्य पाठ में यह संदर्भ स्पष्ट किया गया है, जबकि पादटिप्पणी व्यापक विकल्प बचाती है।
theological_decisions:
- issue: बेबीलोन की देव-प्रतिमाओं का वर्णन
  choice: मुख्य पाठ में 'मूर्तियाँ', पादटिप्पणी में 'देव-मूर्तियाँ/मूर्तिपूजक प्रतिमाएँ'
  alternative: '''उनके बुत'' या ''उनकी देव-मूर्तियाँ'''
  rationale: עצב गढ़ी हुई प्रतिमा को सूचित करता है और इस भविष्यसूचक प्रसंग में झूठे देवताओं पर कटाक्ष करता है। 'मूर्तियाँ' आधुनिक हिन्दी में सहज है; पादटिप्पणी मूल के निंदात्मक धार्मिक बल को सुरक्षित रखती है।
- issue: देवताओं और उनकी प्रतिमाओं के पतन का संबंध
  choice: पहले देवताओं को झुकते हुए और फिर उनकी प्रतिमाओं को पशुओं पर भार बनते हुए प्रस्तुत किया गया है
  alternative: पहली पंक्ति को सीधे प्रतिमाओं के झुकने का वर्णन मानना
  rationale: व्याकरण में बेल और नबू कर्ता हैं, जबकि अगली पंक्ति उनकी प्रतिमाओं को अलग से बताती है। इस तनाव को बनाए रखने से कविता देवताओं की पराजय और उनकी ढोई जाने वाली प्रतिमाओं की असहायता दोनों दिखाती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। कविता की विडंबना—जिन देवताओं को लोगों को बचाना चाहिए, वे स्वयं पशुओं पर भारी बोझ बन जाते हैं—स्वाभाविक हिन्दी में उभारी गई है। नामों को 'बेल' और 'नबू' रूप में लिप्यंतरित किया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
