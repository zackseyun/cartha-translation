lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: मेरी सुनो
  rationale: बहुवचन आज्ञार्थक क्रिया और אֵלַי को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; इसमें केवल सुनाई देने के बजाय ध्यान देकर मानने का आह्वान भी बना रहता है।
- source_word: אַבִּירֵי לֵב
  choice: हठीले मनवालो
  rationale: शाब्दिक रूप से यह ‘मन के बलवान’ है, पर इस भविष्यद्वाणी की फटकार में इसका नकारात्मक भाव हठ या अड़ियलपन है। ‘हठीले मनवालो’ हृदय/मन की इब्रानी छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הָרְחוֹקִים
  choice: तुम जो ... से दूर हो
  rationale: संज्ञा के रूप में प्रयुक्त निश्चित कृदन्त को सम्बोधित लोगों का वर्णन करने वाले सम्बन्धवाचक वाक्यांश के रूप में स्पष्ट और सहज हिन्दी में प्रस्तुत किया गया है।
- source_word: מִצְּדָקָה
  choice: धार्मिकता से
  rationale: צְדָקָה में धार्मिकता, न्याय और परमेश्वर के उद्धारकारी न्यायोचित कार्य के अर्थ आपस में जुड़े हो सकते हैं। मुख्य पाठ में ‘धार्मिकता’ व्यापक पारम्परिक अर्थ रखता है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: צְדָקָה का अर्थ
  choice: धार्मिकता
  alternative: न्याय; न्याय दिलाने या उद्धार करने का कार्य
  rationale: पद 13 में यही शब्द परमेश्वर द्वारा निकट लाई जाने वाली वस्तु है और उसका सम्बन्ध उद्धार से है; फिर भी पद 12 की फटकार नैतिक धार्मिकता से दूरी का भाव भी जगा सकती है। इसलिए मुख्य पाठ व्यापक ‘धार्मिकता’ रखता है और पादटिप्पणी न्याय तथा उद्धारकारी न्याय की सम्भावना बताती है।
