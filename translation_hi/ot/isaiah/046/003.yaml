reference: Isaiah 46:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שִׁמְע֤וּ אֵלַ/י֙ בֵּ֣ית יַעֲקֹ֔ב וְ/כָל שְׁאֵרִ֖ית בֵּ֣ית יִשְׂרָאֵ֑ל הַֽ/עֲמֻסִים֙ מִנִּי בֶ֔טֶן הַ/נְּשֻׂאִ֖ים מִנִּי רָֽחַם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/003.yaml
  text: Listen to me[a], house of Jacob, and all the remnant of the house of Israel, who have been borne by me from birth, carried from the womb.
translation:
  language: hi
  text: “हे याकूब के घराने, और इस्राएल के घराने के बचे हुए सभी लोगों, मेरी सुनो! तुम्हें गर्भ से ही मैंने उठाए रखा है, और कोख से ही मैं तुम्हें ढोता आया हूँ।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में दो निकट-संबंधी अभिव्यक्तियाँ हैं—शाब्दिक रूप से “पेट/गर्भ से” और “कोख से।” ये आरंभिक जीवन से ही परमेश्वर की देखभाल को काव्यात्मक समानांतरता में व्यक्त करती हैं।
    reason: मूल के दो अलग शब्दों और उनके काव्यात्मक समानांतर को स्पष्ट करना।
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: मेरी सुनो
  rationale: बहुवचन आज्ञा में ध्यान देकर सुनने का आह्वान है; ‘मेरी सुनो’ आधुनिक हिन्दी में स्वाभाविक और प्रभावपूर्ण है।
- source_word: בֵּית יַעֲקֹב
  choice: याकूब के घराने
  rationale: ‘घराना’ यहाँ याकूब से उत्पन्न पूरे समुदाय को दर्शाता है और मूल के सामुदायिक व वंशगत मुहावरे को बनाए रखता है।
- source_word: שְׁאֵרִית בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने के बचे हुए सभी लोग
  rationale: यह अनुवाद שְׁאֵרִית के ‘शेष बचे समुदाय’ के अर्थ को सामान्य पाठक के लिए स्पष्ट रखता है, बिना किसी विशेष धार्मिक व्याख्या को जोड़े।
- source_word: הַעֲמֻסִים
  choice: मैंने उठाए रखा है
  rationale: עמס का मूल बिंब भार उठाकर ले चलने का है। प्रसंग में निर्जीव मूर्तियों को मनुष्यों द्वारा ढोए जाने के विपरीत परमेश्वर अपने लोगों को उठाए रखता है।
- source_word: הַנְּשֻׂאִים
  choice: मैं तुम्हें ढोता आया हूँ
  rationale: נשׂא उठाने और वहन करने को व्यक्त करता है। ‘ढोता आया हूँ’ निरंतर देखभाल तथा पहले पदांश के समानांतर वहन-बिंब को बनाए रखता है।
- source_word: מִנִּי בֶטֶן ... מִנִּי רָחַם
  choice: गर्भ से ही ... कोख से ही
  rationale: दोनों पद आरंभिक जीवन से परमेश्वर की निरंतर देखभाल दर्शाते हैं। ‘गर्भ’ और ‘कोख’ हिन्दी में स्वाभाविक काव्यात्मक समानांतर बनाते हैं और दोनों इब्रानी अभिव्यक्तियों का अंतर भी कुछ हद तक रखते हैं।
theological_decisions:
- issue: निष्क्रिय कृदंतों में कर्ता की पहचान
  choice: परमेश्वर को स्पष्ट कर्ता बनाकर ‘मैंने उठाए रखा ... मैं ढोता आया हूँ’
  alternative: ‘जो गर्भ से उठाए गए ... कोख से ढोए गए’
  rationale: इब्रानी में कृदंत निष्क्रिय हैं और कर्ता सीधे व्यक्त नहीं है, पर वक्ता स्वयं परमेश्वर है और निकट प्रसंग (46:1–4) मूर्तियों को मनुष्यों द्वारा ढोए जाने के विपरीत परमेश्वर द्वारा अपने लोगों को उठाए रखने पर आधारित है। हिन्दी में स्पष्ट कर्ता इस प्रसंगगत अर्थ को स्वाभाविक बनाता है।
- issue: שְׁאֵרִית का भविष्यद्वक्ताई अर्थ
  choice: बचे हुए सभी लोग
  alternative: शेष भाग / अवशेष
  rationale: ‘बचे हुए लोग’ इस्राएल के शेष समुदाय का अर्थ स्पष्ट करता है और ‘अवशेष’ की वस्तुवाचक या अस्वाभाविक ध्वनि से बचता है; किसी विशिष्ट अंत-समय संबंधी अर्थ को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। संबोधन में ‘हे’ भविष्यद्वक्ताई आह्वान की गंभीरता बनाए रखता है। ‘उठाए रखा’ और ‘ढोता आया हूँ’ निकट प्रसंग के वहन-बिंब को स्पष्ट रखते हैं।
