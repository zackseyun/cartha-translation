reference: Isaiah 46:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: זִכְרוּ זֹ֖את וְ/הִתְאֹשָׁ֑שׁוּ הָשִׁ֥יבוּ פוֹשְׁעִ֖ים עַל לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/008.yaml
  text: Remember this and be ashamed[a]; take it to heart[c][b], you transgressors.
translation:
  language: hi
  text: इस बात को याद रखो और दृढ़ हो जाओ[a]; हे विद्रोहियो[c], इसे फिर से मन में लाओ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस दुर्लभ इब्रानी क्रिया का अर्थ “अपने को दृढ़ करो,” “मज़बूत बनो” या “साहस बाँधो” भी हो सकता है। कुछ लोग इसका अर्थ “लज्जित हो जाओ” या “अपने को पुरुष सिद्ध करो” समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “हृदय पर वापस लाओ”; अर्थात इस पर गंभीरता से विचार करो या इसे मन में बिठा लो।'
    reason: lexical_alternative
  - marker: c
    text: या “हे अपराध करनेवालो।” इब्रानी शब्द में उल्लंघन के साथ विद्रोह का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ זֹאת
  choice: इस बात को याद रखो
  rationale: बहुवचन आज्ञार्थक और एकवचन संकेतवाचक का सीधा, स्वाभाविक हिन्दी रूप; संदर्भ में זֹאת किसी कही हुई बात की ओर संकेत करता है।
- source_word: וְהִתְאֹשָׁשׁוּ
  choice: और दृढ़ हो जाओ
  rationale: यह दुर्लभ क्रिया दृढ़ता या अपने को सँभालने/मज़बूत करने का भाव देती है। हिन्दी में ‘दृढ़ हो जाओ’ बिना अनावश्यक रूप से पुरुषत्व का भाव जोड़े इस अनिश्चित अर्थ-क्षेत्र को सबसे अच्छी तरह व्यक्त करता है।
- source_word: הָשִׁיבוּ ... עַל־לֵב
  choice: इसे फिर से मन में लाओ
  rationale: मूल अभिव्यक्ति का शाब्दिक भाव ‘हृदय पर वापस लाना’ है। ‘फिर से मन में लाओ’ שוב के लौटाने वाले भाव और विचारपूर्वक ध्यान देने के मुहावरे—दोनों को बनाए रखता है।
- source_word: פוֹשְׁעִים
  choice: हे विद्रोहियो
  rationale: פשע केवल सामान्य अपराध नहीं, बल्कि अधिकार के विरुद्ध विद्रोह या उल्लंघन का भाव रखता है। सम्बोधन के रूप में ‘हे विद्रोहियो’ स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: दुर्लभ क्रिया וְהִתְאֹשָׁשׁוּ का अर्थ
  choice: दृढ़ हो जाओ
  alternative: लज्जित हो जाओ; साहस बाँधो; अपने को पुरुष सिद्ध करो
  rationale: क्रिया अत्यंत दुर्लभ है और उसका व्युत्पत्तिगत विश्लेषण विवादित है। दृढ़ता/मज़बूती वाला अर्थ प्रमुख शब्दकोशीय संभावना है; ‘लज्जित हो जाओ’ एक पाठ-संदर्भगत व्याख्या है, पर उसे मुख्य पाठ में रखने से अस्पष्टता समय से पहले समाप्त हो जाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा बहुवचन आज्ञार्थक प्रयोग किया गया है। ‘हे विद्रोहियो’ भविष्यद्वक्ताओं की गंभीर सम्बोधन-शैली को बनाए रखता है, जबकि वाक्य सामान्य पाठक के लिए स्पष्ट रहता है। ‘हृदय’ के शाब्दिक रूप के बजाय मुख्य पाठ में ‘मन’ हिन्दी मुहावरे के अनुसार है; मूल रूप पादटिप्पणी में सुरक्षित है।
