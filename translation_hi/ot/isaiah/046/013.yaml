reference: Isaiah 46:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: קֵרַ֤בְתִּי צִדְקָתִ/י֙ לֹ֣א תִרְחָ֔ק וּ/תְשׁוּעָתִ֖/י לֹ֣א תְאַחֵ֑ר וְ/נָתַתִּ֤י בְ/צִיּוֹן֙ תְּשׁוּעָ֔ה לְ/יִשְׂרָאֵ֖ל תִּפְאַרְתִּֽ/י׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/013.yaml
  text: I have brought near my righteousness[a]; it is not far away, and my salvation will not delay. I will place salvation in Zion[b], for Israel my splendor.
translation:
  language: hi
  text: मैंने अपनी धार्मिकता[a] को निकट कर दिया है; वह दूर नहीं है, और मेरा उद्धार विलम्ब नहीं करेगा। मैं सिय्योन में उद्धार रखूँगा—इस्राएल के लिए मेरा वैभव[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरा न्याय’ अथवा ‘मेरी सफ़ाई’।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरी महिमा’।
    reason: lexical_alternative
lexical_decisions:
- source_word: קֵרַבְתִּי
  choice: निकट ले आया हूँ
  rationale: काल पूर्ण किए गए कार्य को वर्तमान प्रासंगिकता के साथ व्यक्त करता है; यह हिन्दी प्रयोग क्रिया के कारक भाव को भी सुरक्षित रखता है।
- source_word: צִדְקָתִי
  choice: अपनी धार्मिकता
  rationale: यह शब्द धार्मिकता, न्याय और दोषमुक्ति दिलाने वाले कार्य तक विस्तृत अर्थ रख सकता है। ‘धार्मिकता’ इसकी व्यापकता को संकुचित नहीं करता।
- source_word: לֹא תִרְחָק
  choice: वह दूर नहीं है
  rationale: स्त्रीलिंग क्रिया ‘धार्मिकता’ की ओर संकेत करती है और आसन्नता का स्वाभाविक हिन्दी रूप देती है।
- source_word: וּתְשׁוּעָתִי
  choice: और मेरा उद्धार
  rationale: ‘उद्धार’ भविष्यद्वाणी के प्रसंग में बचाव और छुटकारे, दोनों को समेटने वाला परिचित और गरिमापूर्ण शब्द है।
- source_word: לֹא תְאַחֵר
  choice: देर नहीं करेगा
  rationale: यह आधुनिक हिन्दी में विलम्ब न होने के भाव को स्पष्ट रूप से व्यक्त करता है।
- source_word: וְנָתַתִּי
  choice: मैं … रखूँगा
  rationale: सिय्योन के स्थानवाचक प्रसंग में נתן के ‘रखना/स्थापित करना’ भाव को सीधे व्यक्त करता है।
- source_word: בְצִיּוֹן
  choice: सिय्योन में
  rationale: पूर्वसर्ग ב का सीधा स्थानवाचक अर्थ सुरक्षित है।
- source_word: תְּשׁוּעָה
  choice: उद्धार
  rationale: पहले आए ‘मेरा उद्धार’ की पुनरावृत्ति मूल पाठ के विषयगत बल को बनाए रखती है।
- source_word: לְיִשְׂרָאֵל
  choice: इस्राएल के लिए
  rationale: ל यहाँ इस्राएल के हित या प्राप्तकर्ता होने का भाव व्यक्त कर सकता है।
- source_word: תִּפְאַרְתִּי
  choice: अपना वैभव
  rationale: ‘वैभव’ सौन्दर्य, महिमा और प्रताप के अर्थक्षेत्र को स्वाभाविक हिन्दी में व्यक्त करता है; ‘अपना’ वक्ता से इसका सम्बन्ध स्पष्ट करता है।
theological_decisions:
- issue: ‘मेरी धार्मिकता’ और ‘मेरा उद्धार’ का पारस्परिक सम्बन्ध
  choice: ‘धार्मिकता’ को व्यापक शब्द के रूप में बनाए रखा गया है, जो परमेश्वर के उद्धारकारी कार्य से निकटता से जुड़ा है।
  alternative: ‘मेरा न्याय’ या ‘मेरी दोषमुक्ति’
  rationale: मूल में धार्मिकता नैतिक गुण, न्याय और विश्वासयोग्य उद्धारकारी हस्तक्षेप के अर्थों को साथ रख सकती है; किसी एक अर्थ तक सीमित करना इस तनाव को मिटा देता।
- issue: अंतिम पदबंध में वैभव का इस्राएल से सम्बन्ध
  choice: ‘सिय्योन में उद्धार रखूँगा—इस्राएल के लिए अपना वैभव’ के संक्षिप्त, व्याख्या के लिए खुले रूप को रखा गया है।
  alternative: ‘इस्राएल, जो मेरा वैभव है’ या ‘इस्राएल को अपनी महिमा दूँगा’
  rationale: इब्रानी वाक्य संक्षिप्त है और इस्राएल को वैभव का प्राप्तकर्ता, प्रकटीकरण अथवा समानाधिकरण मानने की सम्भावना खुली रखता है। डैश इस संक्षिप्त सम्बन्ध को बिना अनावश्यक रूप से सुलझाए पठनीय बनाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किन्तु गरिमापूर्ण है। ‘धार्मिकता’, ‘उद्धार’, ‘सिय्योन’ और ‘इस्राएल’ जैसे परिचित बाइबलीय पद रखे गए हैं। अंतिम खंड की इब्रानी संक्षिप्तता और अर्थगत खुलापन डैश द्वारा सुरक्षित रखा गया है।
