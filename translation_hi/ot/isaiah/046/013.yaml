revisions:
- from: मैं अपनी धार्मिकता[a] को निकट ले आया हूँ; वह दूर नहीं है, और मेरा उद्धार देर नहीं करेगा। मैं सिय्योन में उद्धार रखूँगा—इस्राएल के लिए अपना वैभव[b]।
  to: मैंने अपनी धार्मिकता[a] को निकट कर दिया है; वह दूर नहीं है, और मेरा उद्धार विलम्ब नहीं करेगा। मैं सिय्योन में उद्धार रखूँगा—इस्राएल के लिए मेरा वैभव[b]।
  rationale: The revision improves idiomatic Hindi and makes the divine first-person possessive explicit, especially in the final terse clause. It retains the Hebrew repetition of ‘उद्धार,’ the completed-yet-relevant force of the opening perfect, and the unresolved relation expressed by ‘इस्राएल के लिए मेरा वैभव.’
  reviewer_model: gpt-5.6-terra
