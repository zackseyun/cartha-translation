source:
  edition: WLC
  text: זִכְר֥וּ רִאשֹׁנ֖וֹת מֵ/עוֹלָ֑ם כִּ֣י אָנֹכִ֥י אֵל֙ וְ/אֵ֣ין ע֔וֹד אֱלֹהִ֖ים וְ/אֶ֥פֶס כָּמֽוֹ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/009.yaml
  text: Remember the former things of old[a], for I am God, and there is no other; I am God, and there is none like me.
translation:
  language: hi
  text: पूर्वकाल की बातों को स्मरण करो[a], क्योंकि मैं परमेश्वर हूँ और कोई दूसरा नहीं; मैं परमेश्वर हूँ और मेरे समान कोई नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘बहुत पहले की बातें।’ यहाँ इब्रानी अभिव्यक्ति दूरस्थ अतीत की ओर संकेत करती है; इसका अर्थ आवश्यक रूप से अमूर्त अनन्तता नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: स्मरण करो
  rationale: यह זכר का बहुवचन आज्ञार्थक रूप है और श्रोताओं को बीती बातों को सचेत रूप से मन में लाने को कहता है। ‘स्मरण करो’ सीधा, गरिमापूर्ण और प्रचलित हिन्दी प्रयोग है।
- source_word: רִאשֹׁנוֹת
  choice: पूर्व बातें
  rationale: स्त्रीलिंग बहुवचन विशेषण यहाँ संज्ञा के रूप में पहले के कार्यों या घटनाओं को दर्शाता है। ‘पूर्व बातें’ यशायाह में पूर्व और आनेवाली बातों के बीच पाए जानेवाले अंतर को बनाए रखता है।
- source_word: מֵעוֹלָם
  choice: प्राचीन समय की
  rationale: इस संदर्भ में עוֹלָם दूरस्थ अतीत को सूचित करता है, अमूर्त अनन्तता को आवश्यक रूप से नहीं। ‘प्राचीन समय की’ इस कालगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह स्मरण करने की आज्ञा का आधार बताता है। ‘क्योंकि’ हिन्दी में इसका स्पष्ट व्याख्यात्मक संबंध व्यक्त करता है।
- source_word: אָנֹכִי אֵל
  choice: मैं परमेश्वर हूँ
  rationale: אֵל यहाँ परमेश्वर के लिए सामान्य पद है, ऐसा व्यक्तिवाचक नाम नहीं जिसका लिप्यंतरण आवश्यक हो। ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय भाषा में स्वाभाविक और गरिमापूर्ण है।
- source_word: וְאֵין עוֹד
  choice: और कोई दूसरा नहीं
  rationale: यह इब्रानी मुहावरा परमेश्वर की अद्वितीयता और अनन्यता व्यक्त करता है। यह हिन्दी रूप संक्षिप्त और स्पष्ट है।
- source_word: אֱלֹהִים
  choice: मैं परमेश्वर हूँ
  rationale: यद्यपि रूप की दृष्टि से यह बहुवचन है, यहाँ एकमात्र परमेश्वर को सूचित करता है। समानांतर कथन में ‘मैं ... हूँ’ को स्पष्ट करना हिन्दी में अर्थ और बल दोनों को सुरक्षित रखता है।
- source_word: וְאֶפֶס כָּמוֹנִי
  choice: और मेरे समान कोई नहीं
  rationale: אֶפֶס और כָּמוֹנִי मिलकर अतुलनीयता व्यक्त करते हैं। चुना हुआ रूप स्वाभाविक हिन्दी में इसी दावे को सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर का आत्म-परिचय और अनन्यता
  choice: אֵל और אֱלֹהִים दोनों के लिए ‘परमेश्वर’ रखा गया है और दोनों समानांतर दावों को पूर्ण रूप में व्यक्त किया गया है।
  alternative: אֵל को ‘ईश्वर’ या ‘बलवान परमेश्वर’ कहना, अथवा दूसरे खंड में ‘मैं परमेश्वर हूँ’ को निहित छोड़ देना।
  rationale: इब्रानी पाठ समानांतर खंडों द्वारा एकमात्र परमेश्वर और उसकी अतुलनीयता का प्रबल दावा करता है। पुनरुक्ति को बनाए रखना पाठ के धर्मवैचारिक बल को सुरक्षित रखता है, बिना कोई अतिरिक्त सांप्रदायिक अर्थ जोड़े।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘स्मरण करो’ और ‘परमेश्वर’ सामान्य पाठकों के लिए बोधगम्य बाइबलीय पद हैं। इब्रानी समानांतरता और दोहराव को सुरक्षित रखा गया है।
