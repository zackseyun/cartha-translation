source:
  edition: WLC
  text: הַ/זָּלִ֤ים זָהָב֙ מִ/כִּ֔יס וְ/כֶ֖סֶף בַּ/קָּנֶ֣ה יִשְׁקֹ֑לוּ יִשְׂכְּר֤וּ צוֹרֵף֙ וְ/יַעֲשֵׂ֣/הוּ אֵ֔ל יִסְגְּד֖וּ אַף יִֽשְׁתַּחֲוּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/006.yaml
  text: Those who lavish gold from the purse and weigh out silver on the scale hire a goldsmith[a], and he makes it into a god; they bow down, indeed they prostrate themselves.
translation:
  language: hi
  text: जो थैली से सोना उँडेलते हैं और तराज़ू[a] पर चाँदी तौलते हैं, वे एक सुनार को काम पर रखते हैं, और वह उससे एक देवता बनाता है; वे झुकते हैं, हाँ, दण्डवत् भी करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तराज़ू की डंडी से चाँदी तौलते हैं।’ इब्रानी शब्द का शाब्दिक अर्थ ‘नरकट/डंडा’ है; यहाँ उससे तराज़ू की डंडी या तौलने के उपकरण का संकेत हो सकता है।
    reason: कָנֶה के शाब्दिक अर्थ और इस संदर्भ में उसके संभावित तकनीकी अर्थ को दर्शाने के लिए।
lexical_decisions:
- source_word: הַזָּלִים זָהָב מִכִּיס
  choice: जो थैली से सोना उँडेलते
  rationale: הַזָּלִים का चित्र धन को खुले हाथ से निकालने या बहाने का है; ‘उँडेलते’ उस ठोस और अपव्ययी भाव को बनाए रखता है। כִּיס के लिए ‘थैली’ सहज और सटीक है।
- source_word: וְכֶסֶף בַּקָּנֶה יִשְׁקֹלוּ
  choice: और तराज़ू पर चाँदी तौलते हैं
  rationale: קָנֶה का मूल अर्थ नरकट/डंडा है, पर यहाँ तौलने के उपकरण के डंडे या काँटे का लाक्षणिक संकेत है। आधुनिक हिन्दी में ‘तराज़ू पर’ क्रिया का अर्थ स्वाभाविक रूप से स्पष्ट करता है।
- source_word: יִשְׂכְּרוּ צוֹרֵף
  choice: एक सुनार को मज़दूरी पर रखते हैं
  rationale: צוֹרֵף धातु गलाने, परिष्कृत करने या गढ़ने वाला कारीगर है; सोने-चाँदी और मूर्ति-निर्माण के संदर्भ में ‘सुनार’ उपयुक्त है। שׂכר के भुगतान-संबंधी भाव को ‘मज़दूरी पर रखते हैं’ व्यक्त करता है।
- source_word: וְיַעֲשֵׂהוּ אֵל
  choice: और वह उससे एक देवता बनाता है
  rationale: पुल्लिंग प्रत्यय को हिन्दी में अस्पष्ट रखने के बजाय ‘उससे’ पूर्वोक्त बहुमूल्य धातु-सामग्री की ओर संकेत करता है। אֵל का सीधा अर्थ ‘देवता’ रखा गया है, ‘मूर्ति’ कहकर व्याख्या नहीं की गई।
- source_word: יִסְגְּדוּ אַף יִשְׁתַּחֲווּ
  choice: वे उसके आगे झुकते, बल्कि दण्डवत् करते हैं
  rationale: दोनों आराधनात्मक शारीरिक क्रियाओं और אַף की तीव्रता को बनाए रखने के लिए पहले ‘झुकते’ और फिर अधिक प्रबल ‘दण्डवत् करते’ रखा गया है।
theological_decisions:
- issue: मनुष्य-निर्मित उपास्य के लिए אֵל का अनुवाद
  choice: एक देवता
  alternative: एक मूर्ति
  rationale: मूल पाठ जानबूझकर אֵל (‘देवता’) कहता है और संदर्भ उसकी मनुष्य-निर्मित असत्यता प्रकट करता है। ‘मूर्ति’ अर्थ की व्याख्या कर देता और मूल की व्यंग्यात्मक धार्मिक कसावट घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और मौखिक रूप से सहज शैली। ‘उँडेलते’ मूल बिंब को तथा ‘बल्कि’ अंतिम दो क्रियाओं की अलंकारिक तीव्रता को सुरक्षित रखता है। ‘दण्डवत्’ सामान्य धार्मिक हिन्दी में परिचित है और पूर्णतः भूमि की ओर झुकने का भाव देता है।
