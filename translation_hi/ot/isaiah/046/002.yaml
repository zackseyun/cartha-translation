base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/002.yaml
  text: They stoop[a]; they bow down together. They are unable to save the burden[b], and they themselves go into captivity.
translation:
  language: hi
  text: वे धँस गए[a], वे एक साथ झुक गए। वे उस बोझ को छुड़ा न सके; और वे स्वयं[b] बंदी होकर चले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दबकर बैठ गए” अथवा “ढह गए”; इब्रानी क्रिया नीचे धँसने या गिर पड़ने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “और उनका प्राण बंदी होकर चला गया।” यहाँ इब्रानी נֶפֶשׁ का अर्थ “प्राण,” “जीवन” या “स्वयं” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְסוּ
  choice: धँस गए
  rationale: क्रिया नीचे धँसने, दबने या गिरने की ओर संकेत करती है। ‘धँस गए’ समानांतर क्रिया ‘झुक गए’ से अलग रहते हुए पूर्णतः ढह जाने का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: כָרְעוּ
  choice: झुक गए
  rationale: यह क्रिया घुटने टेकने या नीचे झुकने का बोध देती है। यहाँ ‘झुक गए’ मूर्तियों की विवश मुद्रा और निहित विडंबना दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: יַחְדָּו
  choice: सब एक साथ
  rationale: संयुक्त क्रिया का भाव स्पष्ट करता है; ‘सब’ बहुवचन कर्ताओं की समग्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא יָכְלוּ מַלֵּט
  choice: छुड़ा न सके
  rationale: מלט यहाँ किसी को या किसी वस्तु को बच निकलने देना अथवा छुड़ाना है। ‘छुड़ा न सके’ तत्काल प्रसंग में बोझ को संकट से निकाल पाने की असमर्थता व्यक्त करता है।
- source_word: מַשָּׂא
  choice: उस बोझ
  rationale: शब्द का मूल अर्थ उठाया या ढोया जाने वाला बोझ है। निश्चितता को ‘उस’ से व्यक्त किया गया है, जो पूर्ववर्ती प्रसंग में पशुओं पर लदी देव-प्रतिमाओं की ओर संकेत करता है।
- source_word: וְנַפְשָׁם
  choice: वे स्वयं ही
  rationale: נֶפֶשׁ का अर्थ प्राण, जीवन या स्वयं व्यक्ति हो सकता है। प्रसंग में आत्मवाचक अर्थ सहज है, फिर भी शाब्दिक ‘उनका प्राण’ की संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: בַּשְּׁבִי הָלָכָה
  choice: बंदी होकर चले गए
  rationale: हिब्रू पूर्णकालीन रूप को कथात्मक भूतकाल में रखा गया है। ‘बंदी होकर’ captivity की अवस्था और ‘चले गए’ הָלָכָה की गति—दोनों को व्यक्त करता है।
theological_decisions:
- issue: देवताओं/मूर्तियों का मानवीकरण और נֶפֶשׁ का अर्थ
  choice: वे स्वयं ही बंदी होकर चले गए
  alternative: उनका प्राण बंदी होकर चला गया
  rationale: यह पाठ बाबेली देवताओं की असमर्थता पर व्यंग्य करता है। आत्मवाचक अनुवाद हिन्दी में स्पष्ट और स्वाभाविक है, पर ‘प्राण’ का शाब्दिक अर्थ पादटिप्पणी में देकर मूल की अर्थगत व्यापकता और मानवीकरण का तनाव बनाए रखा गया है।
- issue: क्रियाओं का काल
  choice: भूतकाल—धँस गए, झुक गए, छुड़ा न सके, चले गए
  alternative: वर्तमानकाल—धँसते हैं, झुकते हैं, छुड़ा नहीं सकते, चले जाते हैं
  rationale: हिब्रू में मुख्य क्रियाएँ पूर्णकालीन हैं; इसलिए हिन्दी में भूतकाल स्रोत-रूप के अधिक निकट है। इसे किसी सामान्य सार्वकालिक कथन में बदले बिना भविष्यसूचक दृश्य की पूर्णता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और संक्षिप्त काव्यात्मक गद्य अपनाया गया है। समानांतर पंक्तियों और मूर्तियों पर किए गए व्यंग्य को बनाए रखा गया है; अत्यधिक संस्कृतनिष्ठ या किसी विशिष्ट सांप्रदायिक शब्दावली से बचा गया है।
