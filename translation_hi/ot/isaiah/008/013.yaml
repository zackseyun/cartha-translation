source:
  edition: WLC
  text: אֶת יְהוָ֥ה צְבָא֖וֹת אֹת֣/וֹ תַקְדִּ֑ישׁוּ וְ/ה֥וּא מוֹרַאֲ/כֶ֖ם וְ/ה֥וּא מַֽעֲרִֽצְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/013.yaml
  text: Yahweh of hosts—you shall regard him as holy[a]. Let him be your fear[b], and let him be your dread.
translation:
  language: hi
  text: सेनाओं के याहवे—उसी को पवित्र मानो[a]। वही तुम्हारा भय हो और वही तुम्हारा आतंक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “उसी को पवित्र ठहराओ।” इसका अर्थ उसे पवित्र बनाना नहीं, बल्कि उसकी पवित्रता को स्वीकार करना और उसके साथ पवित्र के समान व्यवहार करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित रूप ‘यहोवा’ परमेश्वर के व्यक्तिगत नाम को शीर्षक से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: צְבָאוֹת
  choice: सेनाओं के
  rationale: यह बहुवचन पद स्वर्गीय अथवा सांसारिक सैन्य समूहों की व्यापकता बनाए रखता है; ‘सेनाओं के यहोवा’ हिन्दी में स्थापित और अर्थ-संगत उपाधि है।
- source_word: אֹתוֹ תַקְדִּישׁוּ
  choice: उसी को पवित्र मानो
  rationale: हिफ़ील रूप यहाँ यहोवा को पवित्र बनाना नहीं, बल्कि उसकी पवित्रता स्वीकार करके उसके साथ वैसा ही व्यवहार करना बताता है। ‘उसी’ मूल के बलाघात को भी व्यक्त करता है।
- source_word: מוֹרַאֲכֶם
  choice: तुम्हारा भय
  rationale: संज्ञात्मक विधेय की निकट संरचना बनाए रखते हुए उस व्यक्ति को व्यक्त करता है जिससे भय रखना चाहिए।
- source_word: מַעֲרִצְכֶם
  choice: तुम्हारा आतंक
  rationale: यह दूसरे समानांतर पद की अधिक तीव्रता को ‘भय’ से अलग बनाए रखता है।
- source_word: וְהוּא ... וְהוּא
  choice: वही ... हो और वही ...
  rationale: हिब्रू के संज्ञात्मक वाक्यों और दोहराए गए सर्वनाम को रखते हुए प्रसंग की आदेशात्मक शक्ति स्वाभाविक हिन्दी में व्यक्त होती है।
theological_decisions:
- issue: ईश्वरीय नाम और उपाधि יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  alternative: सेनाओं के याहवे; सेनाओं का प्रभु
  rationale: व्यक्तिगत ईश्वरीय नाम को किसी सामान्य उपाधि में बदलने के बजाय हिन्दी में परिचित नाम-रूप से रखा गया है; ‘सेनाओं’ पद की व्यापकता को सीमित नहीं करता।
- issue: यहोवा को ‘पवित्र करने’ की आज्ञा
  choice: उसी को पवित्र मानो
  alternative: उसी को पवित्र ठहराओ; उसी को पवित्र जानो
  rationale: यह स्पष्ट करता है कि मनुष्य परमेश्वर को पवित्र बनाते नहीं, बल्कि उसकी पवित्रता स्वीकार करते और उसके अनुरूप उसका आदर करते हैं।
- issue: भय और आतंक के विधेयों की आदेशात्मक अथवा कथनात्मक शक्ति
  choice: वही तुम्हारा भय हो और वही तुम्हारा आतंक
  alternative: वही तुम्हारा भय और वही तुम्हारा आतंक है
  rationale: हिब्रू में स्पष्ट क्रिया नहीं है, पर पिछले आदेश से जुड़ा प्रसंग प्रोत्साहनात्मक/आदेशात्मक अर्थ देता है। ‘हो’ इस संबंध को दर्शाता है, जबकि पादटिप्पणी में अधिक शाब्दिक कथनात्मक संभावना सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘भय’ और ‘आतंक’ की समानांतरता तथा दूसरे पद की बढ़ी हुई तीव्रता सुरक्षित है। हिब्रू के אֹתוֹ पर बल को ‘उसी’ से और וְהוּא की पुनरावृत्ति को ‘वही ... वही’ से व्यक्त किया गया है।
