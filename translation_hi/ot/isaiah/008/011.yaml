source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֧ר יְהוָ֛ה אֵלַ֖/י כְּ/חֶזְקַ֣ת הַ/יָּ֑ד וְ/יִסְּרֵ֕/נִי מִ/לֶּ֛כֶת בְּ/דֶ֥רֶךְ הָֽ/עָם הַ/זֶּ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/011.yaml
  text: 'For thus Yahweh said to me with a strong hand[a], warning me not to walk in the way of this people[b], saying:'
translation:
  language: hi
  text: 'क्योंकि यहोवा ने मुझसे इस प्रकार कहा, जब उसका हाथ मुझ पर दृढ़ता से था[a], और मुझे इस प्रजा के मार्ग पर चलने से चेताया[b], यह कहते हुए:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब उसका हाथ मुझ पर प्रबल था।” यह हिब्रू मुहावरा परमेश्वर के प्रबल दबाव या बाध्यकारी प्रभाव का भाव व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: “मुझे चेताया” का अनुवाद “मुझे शिक्षा दी” या “मुझे अनुशासित किया” भी हो सकता है। मूल क्रिया में सुधार, अनुशासन और चेतावनी—इन सबका भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: क्योंकि ... इस प्रकार कहा
  rationale: כִּי पिछले संदर्भ की व्याख्या आरम्भ करता है और כֹה आने वाले कथन की ओर संकेत करता है; यह हिन्दी में स्वाभाविक तथा भविष्यद्वक्ताई शैली के अनुरूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से प्रतिस्थापित न करके हिन्दी में प्रचलित लिप्यंतरण दिया गया है।
- source_word: כְּחֶזְקַת הַיָּד
  choice: अपना हाथ मुझ पर दृढ़ता से रखकर
  rationale: शाब्दिक हाथ-बिंब और परमेश्वर के प्रबल दबाव—दोनों को व्यक्त करता है; प्रत्यय न होने पर भी संदर्भ में हाथ यहोवा का है और क्रिया वक्ता पर प्रभाव दर्शाती है।
- source_word: וְיִסְּרֵנִי
  choice: और मुझे चिताया
  rationale: יסר में शिक्षा, अनुशासन, सुधार और चेतावनी का अर्थ-क्षेत्र है। अगले निषेध के संदर्भ में ‘चिताया’ चेतावनी और सुधारात्मक निर्देश दोनों को समेटता है।
- source_word: מִלֶּכֶת בְּדֶרֶךְ
  choice: कि मैं ... के मार्ग पर न चलूँ
  rationale: מן यहाँ किसी आचरण से रोकने का भाव देता है; ‘मार्ग पर चलना’ जीवन-व्यवहार के मूल रूपक को बनाए रखता है।
- source_word: הָעָם הַזֶּה
  choice: इस प्रजा
  rationale: एकवचन सामूहिक संज्ञा और भविष्यद्वक्ताई संबोधन के लिए ‘प्रजा’ स्वाभाविक है।
- source_word: לֵאמֹר
  choice: 'उसने कहा:'
  rationale: अगले पद में जारी प्रत्यक्ष वचन का स्पष्ट परिचय देता है और पद-सीमा पर अपूर्ण संरचना को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम है। हिन्दी पाठकों में पहचाने जाने वाले ‘यहोवा’ से नाम को उपाधि में बदले बिना प्रस्तुत किया गया है।
- issue: כְּחֶזְקַת הַיָּד में ईश्वरीय बल का स्वरूप
  choice: अपना हाथ मुझ पर दृढ़ता से रखकर
  alternative: बलवन्त हाथ से; जब उसका हाथ मुझ पर प्रबल था
  rationale: अभिव्यक्ति को केवल हिंसक बल या दंड के रूप में निश्चित नहीं किया गया; यह प्रबल ईश्वरीय प्रभाव अथवा बाध्यकारी निर्देशन को दर्शाती है।
- issue: יסר का अर्थ
  choice: चिताया
  alternative: शिक्षा दी; अनुशासित किया; चेतावनी दी
  rationale: मूल क्रिया के सुधारात्मक और चेतावनीपूर्ण तनाव को बनाए रखते हुए अगले निषेध से उसका संबंध स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘मार्ग पर चलना’ मूल नैतिक रूपक को बनाए रखता है। प्रत्यक्ष वचन अगले पद में आरम्भ होने के कारण अंत में द्विबिंदु रखा गया है।
