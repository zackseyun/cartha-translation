  text: צ֖וֹר תְּעוּדָ֑ה חֲת֥וֹם תּוֹרָ֖ה בְּ/לִמֻּדָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/016.yaml
  text: Bind up the testimony[b][a]; seal the instruction among my disciples.
translation:
  language: hi
  text: गवाही को बाँधकर रख; शिक्षा[a] को मेरे शिष्यों[b] के बीच मुहर लगाकर बंद कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘व्यवस्था’ अथवा ‘शिक्षण।’ इब्रानी शब्द तोराह का अर्थ व्यापक रूप से शिक्षा या निर्देश भी हो सकता है; यह केवल विधि-संहिता तक सीमित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरे सिखाए हुए लोग।’ इब्रानी अभिव्यक्ति उन लोगों को दर्शाती है जिन्हें वक्ता ने शिक्षा दी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צ֖וֹר
  choice: बाँधकर रख
  rationale: यह पुल्लिंग एकवचन आज्ञार्थक क्रिया है, जिसका अर्थ किसी वस्तु को सुरक्षित रखने के लिए बाँधना या लपेटना है। ‘बाँधकर रख’ ठोस बिंब और संरक्षण—दोनों भाव बनाए रखता है।
- source_word: תְּעוּדָה
  choice: गवाही
  rationale: यह औपचारिक साक्ष्य या प्रमाणसूचक वचन को दर्शाता है और प्रसंग में पहले दिए गए भविष्यद्वाणी-संबंधी साक्ष्य की ओर संकेत कर सकता है।
- source_word: חֲת֥וֹם
  choice: मुहर लगा
  rationale: यह भी पुल्लिंग एकवचन आज्ञार्थक क्रिया है और किसी दस्तावेज़ को मुहर लगाकर बंद या सुरक्षित करने का बिंब प्रस्तुत करती है।
- source_word: תּוֹרָ֖ה
  choice: शिक्षा
  rationale: यशायाह के इस प्रसंग में यह शब्द केवल विधि-संहिता नहीं, बल्कि व्यापक रूप से भविष्यद्वाणी-संबंधी निर्देश या शिक्षा भी व्यक्त कर सकता है।
- source_word: בְּ/לִמֻּדָֽ/י
  choice: मेरे शिष्यों के बीच
  rationale: मूल अभिव्यक्ति का शाब्दिक भाव ‘मेरे सिखाए हुए लोगों’ का है। आधुनिक हिन्दी में ‘मेरे शिष्य’ स्वाभाविक है, और उपसर्ग ב को यहाँ उस समुदाय के दायरे के अर्थ में ‘के बीच’ कहा गया है।
theological_decisions:
- issue: भविष्यद्वाणी के प्रसंग में תּוֹרָה का अर्थ
  choice: शिक्षा
  alternative: व्यवस्था; शिक्षण
  rationale: ‘शिक्षा’ मूल शब्द के व्यापक अर्थ को बनाए रखता है और उसे बिना पर्याप्त आधार के केवल मूसा की व्यवस्था या विधि-संहिता तक सीमित नहीं करता।
- issue: בְּלִמֻּדָי में संबद्धता और समुदाय
  choice: मेरे शिष्यों के बीच
  alternative: मेरे सिखाए हुए लोगों के बीच
  rationale: ‘शिष्य’ उन लोगों को सहज रूप से दर्शाता है जिन्हें वक्ता ने शिक्षा दी है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण और दस्तावेज़-संबंधी बिंबों को बनाए रखने वाला रूप। एकवचन आज्ञार्थक क्रियाएँ मूल इब्रानी व्याकरण के अनुरूप रखी गई हैं; ‘शिष्य’ सामान्य पाठक के लिए स्वाभाविक है, जबकि उसके अधिक शाब्दिक अर्थ को पादटिप्पणी में दिया गया है।
