  yaml_path: translation/ot/isaiah/008/021.yaml
  text: And he will pass through it[a], hard-pressed and hungry; and when he is hungry, he will become enraged and curse his king and his God, and he will turn upward.
translation:
  language: hi
  text: और वह उसमें से होकर गुज़रेगा—संकट से दबा हुआ और भूखा। जब वह भूखा होगा, तब वह क्रोध से भर उठेगा और अपने राजा और अपने परमेश्वर को शाप देगा; फिर वह ऊपर की ओर मुड़ेगा[क]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “ऊपर की ओर देखेगा।” इब्रानी में शाब्दिक रूप से “ऊपर की ओर मुड़ेगा” है; यह संभवतः पीड़ित व्यक्ति के स्वर्ग की ओर रुख करने का वर्णन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר בָּהּ
  choice: और वह उसमें से होकर गुज़रेगा
  rationale: עבר के साथ בָּהּ उस क्षेत्र या परिस्थिति में से होकर जाने का भाव देता है। पुल्लिंग एकवचन क्रिया को प्रतिनिधिक एकवचन ‘वह’ से बनाए रखा गया है।
- source_word: נִקְשֶׁה וְרָעֵב
  choice: संकट से दबा हुआ और भूखा
  rationale: נִקְשֶׁה भारी दबाव या दुर्दशा में होने का भाव देता है; ‘संकट से दबा हुआ’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक विशिष्टीकरण से बचता है। רָעֵב का सीधा अर्थ ‘भूखा’ है।
- source_word: וְהָיָה כִּי יִרְעַב
  choice: जब वह भूखा होगा, तब
  rationale: यह संरचना आगे की प्रतिक्रिया की कालगत परिस्थिति प्रस्तुत करती है। हिन्दी का ‘जब…तब’ संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְהִתְקַצַּף
  choice: वह क्रोध से भर उठेगा
  rationale: हित्पएल रूप क्रोध की अवस्था में प्रवेश करने या उग्र हो उठने का भाव रखता है; ‘भर उठेगा’ इस आरंभिक तीव्रता को व्यक्त करता है।
- source_word: וְקִלֵּל בְּמַלְכּוֹ וּבֵאלֹהָיו
  choice: अपने राजा और अपने परमेश्वर को शाप देगा
  rationale: קלל के साथ ב यहाँ शाप के लक्ष्य को चिह्नित करता है। दोनों संबंधसूचक प्रत्ययों को ‘अपने’ से व्यक्त किया गया है; אֱלֹהָיו को प्रसंगानुसार एकवचन ‘अपने परमेश्वर’ रखा गया है।
- source_word: וּפָנָה לְמָעְלָה
  choice: फिर वह ऊपर की ओर मुँह करेगा
  rationale: פנה का मूल भाव मुड़ना या रुख करना है और לְמָעְלָה ‘ऊपर की ओर’ है। हिन्दी में ‘मुँह करना’ बिना यह कहे स्वाभाविक शारीरिक दिशा व्यक्त करता है कि वह अनिवार्यतः देखता है।
theological_decisions:
- issue: न्याय के प्रसंग में प्रतिनिधिक पुल्लिंग एकवचन
  choice: पूरे पद में एकवचन ‘वह’ बनाए रखना
  alternative: अनिश्चित ‘कोई’ या बहुवचन ‘वे’ प्रयोग करना
  rationale: इब्रानी में क्रियाएँ और प्रत्यय लगातार पुल्लिंग एकवचन हैं। यह किसी नामित पुरुष तक अर्थ को सीमित किए बिना स्रोत की प्रतिनिधिक एकवचन अभिव्यक्ति को सुरक्षित रखता है।
- issue: ‘उसका परमेश्वर’ का अभिप्राय
  choice: ‘अपने परमेश्वर’ कहना, पहचान को और संकीर्ण न करना
  alternative: ‘अपने देवताओं’ या विशेष रूप से ‘यहोवा’ कहना
  rationale: पाठ में אֱלֹהָיו है, पर दिव्य नाम नहीं है। एकवचन अनुवाद सबसे संभावित है, जबकि व्यक्ति की धार्मिक पहचान या परमेश्वर की अधिक विशिष्ट पहचान को अनिर्णीत रहने दिया गया है।
- issue: ऊपर की ओर मुड़ने की क्रिया
  choice: ‘ऊपर की ओर मुँह करेगा’
  alternative: ‘ऊपर देखेगा’ या केवल ‘ऊपर की ओर मुड़ेगा’
  rationale: ‘ऊपर देखेगा’ देखने की क्रिया को स्पष्ट कर देता है, जो मूल में प्रत्यक्ष नहीं है। ‘मुँह करेगा’ दिशा और शारीरिक रुख को स्वाभाविक हिन्दी में रखता है, पर इसे प्रार्थना या पश्चात्ताप के रूप में नहीं समझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रूप। ‘शाप देगा’ मूल की कठोरता बनाए रखता है। वाक्य-विन्यास में डैश और अर्धविराम से संकट, प्रतिक्रिया और ऊपर की ओर रुख करने की क्रमिकता स्पष्ट की गई है।
