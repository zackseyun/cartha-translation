  text: לֹא תֹאמְר֣וּ/ן קֶ֔שֶׁר לְ/כֹ֧ל אֲשֶׁר יֹאמַ֛ר הָ/עָ֥ם הַ/זֶּ֖ה קָ֑שֶׁר וְ/אֶת מוֹרָא֥/וֹ לֹֽא תִֽירְא֖וּ וְ/לֹ֥א תַעֲרִֽיצוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/012.yaml
  text: Do not call conspiracy everything that this people calls conspiracy[a], and do not fear what they fear[b], nor be in dread.
translation:
  language: hi
  text: जिस किसी बात को यह प्रजा षड्यंत्र कहती है, उसे तुम षड्यंत्र मत कहो[a]। जिससे यह प्रजा डरती है, उससे तुम मत डरो[b], और भयभीत मत हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “जिस किसी बात के बारे में यह प्रजा कहती है, ‘षड्यंत्र है,’ उसके बारे में तुम मत कहो, ‘षड्यंत्र है।’”'
    reason: मूल इब्रानी की वाक्य-संरचना का अधिक शाब्दिक विकल्प।
  - marker: b
    text: इब्रानी पद का शाब्दिक रूप ‘उसका भय’ है; इसका अर्थ उसके भय की वस्तु अथवा उसके द्वारा अनुभव किया जाने वाला भय—दोनों हो सकता है।
    reason: मूल पद में भय और भय की वस्तु के बीच अर्थगत अस्पष्टता है।
lexical_decisions:
- source_word: קֶשֶׁר / קָשֶׁר
  choice: षड्यंत्र
  rationale: यह शब्द गुप्त राजनीतिक या सामाजिक साज़िश अथवा षड्यंत्रकारी गठजोड़ को सूचित करता है। ‘षड्यंत्र’ आधुनिक हिन्दी में इस अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: תֹאמְרוּן
  choice: कहो
  rationale: मूल क्रिया का सीधा अर्थ ‘कहना’ है। हिन्दी की संरचना ‘किसी बात को षड्यंत्र कहना’ नाम देने या ठहराने का भाव भी स्वाभाविक रूप से व्यक्त करती है।
- source_word: הָעָם הַזֶּה
  choice: यह प्रजा
  rationale: ‘यह प्रजा’ मूल के एकवचन सामूहिक पद और उसमें निहित दूरी या फटकार के भाव को बनाए रखता है; ‘ये लोग’ अधिक बोलचाल का किंतु कम चिह्नित विकल्प होता।
- source_word: מוֹרָאוֹ
  choice: जिससे वह डरती है
  rationale: एकवचन प्रत्यय ‘यह प्रजा’ की ओर संकेत करता है। यह अनुवाद प्रसंग में भय के कारण या भय की वस्तु को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पद की व्यापक अर्थ-संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: תִירְאוּ
  choice: मत डरो
  rationale: यह ירא का सीधा और संक्षिप्त हिन्दी समतुल्य है तथा समानांतर निषेध को स्पष्ट रखता है।
- source_word: תַעֲרִיצוּ
  choice: न आतंकित हो
  rationale: हिफ़ील रूप भय से अभिभूत या आतंकित होने का तीव्र भाव देता है। ‘आतंकित हो’ पहले ‘डरो’ की केवल पुनरावृत्ति किए बिना काव्यात्मक तीव्रता बनाए रखता है।
theological_decisions:
- issue: भय संबंधी निषेध का संदर्भ और आशय
  choice: परमेश्वर के लोगों को प्रजा के भयपूर्ण आकलन और घबराहट को अपनाने से रोका गया है।
  alternative: यह निषेध किसी वास्तविक राजनीतिक षड्यंत्र में भाग लेने के विरुद्ध है, या मुख्यतः स्वयं प्रजा से डरने के विरुद्ध है।
  rationale: ‘षड्यंत्र’ की पुनरावृत्ति और समानांतर भय-संबंधी वाक्य समुदाय की आशंकित व्याख्या को दोहराने तथा उसके भय में सहभागी होने के विरुद्ध चेतावनी का समर्थन करते हैं। अनुवाद ऐतिहासिक संदर्भ को आवश्यकता से अधिक निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘यह प्रजा’ मूल के चिह्नित सामूहिक एकवचन को सुरक्षित रखता है; ‘मत डरो’ और ‘न आतंकित हो’ क्रमिक काव्यात्मक तीव्रता बनाए रखते हैं।
