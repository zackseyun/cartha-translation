id: ISA.8.14
reference: Isaiah 8:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֖ה לְ/מִקְדָּ֑שׁ וּ/לְ/אֶ֣בֶן נֶ֠גֶף וּ/לְ/צ֨וּר מִכְשׁ֜וֹל לִ/שְׁנֵ֨י בָתֵּ֤י יִשְׂרָאֵל֙ לְ/פַ֣ח וּ/לְ/מוֹקֵ֔שׁ לְ/יוֹשֵׁ֖ב יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/014.yaml
  text: And he will become a sanctuary[a], but a stone to strike against and a rock to stumble over for both houses of Israel[b], a trap and a snare to the inhabitant of Jerusalem.
translation:
  language: hi
  text: और वह पवित्रस्थान बनेगा; परन्तु इस्राएल के दोनों घरानों के लिए टकराने का पत्थर[a] और ठोकर खाने की चट्टान, और यरूशलेम में रहने वालों के लिए[b] फंदा और जाल बनेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे ‘ठोकर का पत्थर’ भी कहा जा सकता है। यहाँ ‘टकराने का पत्थर’ अगले पदबंध ‘ठोकर खाने की चट्टान’ से शब्दगत अंतर बनाए रखता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘यरूशलेम में रहने वाले के लिए’; इब्रानी का एकवचन यहाँ सामूहिक अर्थ में प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: और वह ... बनेगा
  rationale: भविष्यसूचक प्रसंग में यह रूप भविष्य का भाव देता है। ‘बनेगा’ आगे बताए गए विभिन्न रूपों और भूमिकाओं की ओर होने वाले परिवर्तन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְמִקְדָּשׁ
  choice: पवित्रस्थान
  rationale: מִקְדָּשׁ किसी पवित्र अथवा उपासना-स्थान को दर्शाता है। ‘पवित्रस्थान’ उसके धार्मिक और सुरक्षात्मक दोनों संदर्भों को बनाए रखता है, बिना उसे केवल ‘शरणस्थान’ तक सीमित किए।
- source_word: אֶבֶן נֶגֶף
  choice: टकराने का पत्थर
  rationale: נֶגֶף में आघात या टकराव का भाव है। यह अनुवाद अगली अभिव्यक्ति מִכְשׁוֹל में स्पष्ट ठोकर खाने के भाव से इसका सूक्ष्म अंतर बनाए रखता है।
- source_word: צוּר מִכְשׁוֹל
  choice: ठोकर खाने की चट्टान
  rationale: צוּר का अर्थ ‘चट्टान’ और מִכְשׁוֹל का अर्थ ठोकर का कारण है। यह चयन ठोस रूपक को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: לִשְׁנֵי בָתֵּי יִשְׂרָאֵל
  choice: इस्राएल के दोनों घरानों के लिए
  rationale: यह पद इस्राएल के दो ऐतिहासिक-राजनीतिक घरानों की द्वैतता को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לְפַח
  choice: फंदा
  rationale: פַּח प्रायः किसी प्राणी को पकड़ने वाले फंदे के लिए प्रयुक्त होता है। ‘फंदा’ हिन्दी में स्पष्ट और मूर्त शब्द है।
- source_word: וּלְמוֹקֵשׁ
  choice: और जाल
  rationale: מוֹקֵשׁ फँसाने वाले जाल या पाश को दर्शाता है। ‘फंदा और जाल’ मूल के दो समान, पर अलग शब्दों को एक में नहीं मिलाता।
- source_word: לְיוֹשֵׁב יְרוּשָׁלִָם
  choice: यरूशलेम में रहने वालों के लिए
  rationale: मूल में एकवचन कृदन्त सामूहिक अर्थ रखता है। हिन्दी में बहुवचन अभिव्यक्ति इस सामूहिक अर्थ को अधिक स्वाभाविक और स्पष्ट बनाती है।
theological_decisions:
- issue: ‘वह’ का संदर्भ
  choice: सर्वनाम ‘वह’ को बनाए रखा गया है; निकटवर्ती प्रसंग में इसका संदर्भ यहोवा है।
  alternative: मूल सर्वनाम के स्थान पर सीधे ‘यहोवा’ कहना, या इसे किसी निराकार भविष्यसूचक संदेश से जोड़ना।
  rationale: यशायाह 8:13 में निकटतम संदर्भ यहोवा का है, पर मूल पद यहाँ उनका नाम दोहराने के बजाय सर्वनाम-सदृश कर्ता पर निर्भर है। इसलिए अनुवाद प्रसंगगत संदर्भ को सुरक्षित रखते हुए मूल से अधिक स्पष्टता नहीं जोड़ता।
- issue: ईश्वरीय सुरक्षा और न्याय का विरोधाभास
  choice: उसी कर्ता को ‘पवित्रस्थान’ और साथ ही ‘पत्थर/चट्टान’ तथा ‘फंदा/जाल’ के रूप में प्रस्तुत किया गया है।
  alternative: ‘पवित्रस्थान’ को केवल ‘शरणस्थान’ बनाकर शेष रूपकों को केवल मानवीय प्रतिक्रिया के रूप में समझाना।
  rationale: मूल पाठ एक ही संदर्भ में सुरक्षा और ठोकर अथवा न्याय के तनाव को जानबूझकर साथ रखता है। ‘परन्तु’ हिन्दी में इस विरोधाभास को स्पष्ट करता है, उसे किसी एक धर्मवैज्ञानिक अर्थ में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘पवित्रस्थान’, ‘घरानों’, ‘चट्टान’, ‘फंदा’ और ‘जाल’ मूल के ठोस तथा धार्मिक रूपकों को बनाए रखते हैं। अर्धविराम सुरक्षा और न्याय के तीखे विरोध को पढ़ने में स्पष्ट करता है।
