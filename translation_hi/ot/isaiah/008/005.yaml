  text: Yahweh spoke to me again[a], saying,
translation:
  language: hi
  text: याहवे ने फिर मुझसे कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: फिर
  rationale: यहाँ יסף के साथ बोलने की क्रिया का अर्थ एक और बार बोलना है; शाब्दिक ‘बोलना जोड़ा’ के बजाय ‘फिर’ स्वाभाविक हिन्दी में पुनरावृत्ति स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण ‘याहवे’ दिया गया है।
- source_word: דַּבֵּר אֵלַי
  choice: मुझसे कहा
  rationale: דבר का मूल अर्थ ‘बोलना’ और אֵלַי का अर्थ ‘मेरी ओर/मुझसे’ है। हिन्दी में अगले पद के सीधे कथन की भूमिका के रूप में ‘मुझसे कहा’ अधिक स्वाभाविक है और आशय सुरक्षित रखता है।
- source_word: עוֹד
  choice: फिर
  rationale: यह क्रियाविशेषण यहाँ परमेश्वर के वचन की पुनरावृत्ति दर्शाता है और וַיֹּסֶף के साथ मिलकर हिन्दी ‘फिर’ में स्वाभाविक रूप से व्यक्त होता है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह कथन-सूचक infinitive अगले पद में आने वाले सीधे वचन की भूमिका बनाता है। हिन्दी में ‘कहा’ यही कार्य करता है; ‘यह कहते हुए’ अनावश्यक रूप से भारी होता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत चतुरक्षरीय नाम है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है; स्वरांकन पूर्णतः निश्चित न होने के कारण अन्य लिप्यंतरण संभव हैं।
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण हिन्दी। मूल इब्रानी की ‘फिर बोलना’ वाली पुनरुक्ति को हिन्दी के स्वाभाविक ‘फिर मुझसे कहा’ में समेटा गया है। पद अगले पद के सीधे कथन की भूमिका है, इसलिए अंत में अल्पविराम रखा गया है।
