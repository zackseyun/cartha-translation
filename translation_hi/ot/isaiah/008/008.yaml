id: ISA.8.8
reference: Isaiah 8:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/חָלַ֤ף בִּֽ/יהוּדָה֙ שָׁטַ֣ף וְ/עָבַ֔ר עַד צַוָּ֖אר יַגִּ֑יעַ וְ/הָיָה֙ מֻטּ֣וֹת כְּנָפָ֔י/ו מְלֹ֥א רֹֽחַב אַרְצְ/ךָ֖ עִמָּ֥נוּ אֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/008.yaml
  text: It will sweep on into Judah; it will overflow and pass through; it will reach up to the neck. And the spread of its wings will fill the breadth of your land[a], O Immanuel.
translation:
  language: hi
  text: वह यहूदा में घुस आएगा; वह उमड़ेगा और आर-पार बह जाएगा; वह गले तक पहुँच जाएगा। उसके पंखों का फैलाव तेरे देश की पूरी चौड़ाई को भर देगा, हे इम्मानुएल![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इम्मानुएल का अर्थ है, ‘परमेश्वर हमारे साथ है।’
    reason: नाम का शाब्दिक अर्थ बताने और मूल इब्रानी की अर्थवत्ता सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: וְחָלַף
  choice: वह बढ़ता चला आएगा
  rationale: पिछले पद की नदी और बाढ़ की उपमा के संदर्भ में यह आगे बढ़ती हुई विनाशकारी गति व्यक्त करता है; केवल ‘गुज़रेगा’ कहने से यह बल कम हो जाता।
- source_word: בִּיהוּדָה
  choice: यहूदा में
  rationale: गति-सूचक क्रिया के साथ यह आक्रमणकारी बाढ़ के यहूदा में प्रवेश को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שָׁטַף וְעָבַר
  choice: उमड़ेगा और आर-पार बह जाएगा
  rationale: दोनों क्रियाओं को अलग रखते हुए बाढ़ के उमड़ने और पूरे देश से होकर निकलने की जल-उपमा सुरक्षित रखी गई है।
- source_word: עַד צַוָּאר יַגִּיעַ
  choice: गले तक पहुँच जाएगा
  rationale: यह निकट-पूर्ण डूबने और अत्यंत संकट की सजीव उपमा को सहज हिन्दी में बनाए रखता है।
- source_word: מֻטּוֹת כְּנָפָיו
  choice: उसके पंखों का फैलाव
  rationale: मूल में पंख फैलाने की आकृति है, जो आक्रमणकारी शक्ति के व्यापक विस्तार को दिखाती है; ‘उसके’ का संकेत उसी एकवचन शक्ति की ओर है।
- source_word: מְלֹא רֹחַב אַרְצְךָ
  choice: तेरे देश की पूरी चौड़ाई को भर देगा
  rationale: ‘चौड़ाई’ רֹחַב का औपचारिक अर्थ सुरक्षित रखती है, जबकि ‘पूरी’ מְלֹא द्वारा व्यक्त पूर्ण विस्तार को स्पष्ट करती है।
- source_word: עִמָּנוּ אֵל
  choice: हे इम्मानुएल
  rationale: यशायाह 7:14 में पहले से प्रस्तुत नाम के साथ साहित्यिक संबंध बनाए रखने के लिए इसे नाम और प्रत्यक्ष संबोधन के रूप में लिप्यंतरित किया गया है; अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: עִמָּנוּ אֵל को नाम/संबोधन माना जाए या ‘परमेश्वर हमारे साथ है’ वाक्य के रूप में अनूदित किया जाए
  choice: मुख्य पाठ में प्रत्यक्ष संबोधन ‘हे इम्मानुएल’
  alternative: ‘परमेश्वर हमारे साथ है’ अथवा ‘हे हमारे-साथ-परमेश्वर’
  rationale: यशायाह 7:14 में यह बालक के नाम के रूप में आ चुका है। यहाँ नाम बनाए रखने से साहित्यिक संबंध और यह तनाव दोनों सुरक्षित रहते हैं कि देश को उसी नामधारी से संबद्ध बताया जा रहा है; नाम का अर्थ पादटिप्पणी में स्पष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सजीव और सामान्य पाठक के लिए सुबोध शैली। ‘उमड़ेगा’, ‘आर-पार बह जाएगा’ और ‘गले तक’ से बाढ़ की निरंतर उपमा रखी गई है। एकवचन ‘तेरे’ मूल के एकवचन संबोधन को सुरक्षित रखता है।
