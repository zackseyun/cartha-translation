  text: 'And I will take for myself faithful witnesses: Uriah the priest and Zechariah son of Jeberekiah[a][b].'
translation:
  language: hi
  text: और मैं अपने लिए विश्वसनीय गवाहों को नियुक्त करूँगा[a]—याजक ऊरिय्याह और यबेरेक्याह के पुत्र जकर्याह।
