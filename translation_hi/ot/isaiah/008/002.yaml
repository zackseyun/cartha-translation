    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָעִידָה
  choice: और मैं ... गवाह ठहराऊँगा
  rationale: העוד के हिफ़ील रूप का यहाँ अर्थ औपचारिक प्रमाण के लिए गवाह नियुक्त या बुलाना है। ‘गवाह ठहराऊँगा’ कानूनी-साक्ष्यात्मक भाव को स्वाभाविक हिन्दी में बनाए रखता है; अन्य सम्भव अर्थ पादटिप्पणी में दिया गया है।
- source_word: לִּי
  choice: अपने लिए
  rationale: प्रथम पुरुष एकवचन प्रत्यय वाला पूर्वसर्ग वक्ता की निजी भागीदारी और हित को सूचित करता है।
- source_word: עֵדִים נֶאֱמָנִים
  choice: विश्वसनीय गवाह
  rationale: נֶאֱמָנִים में भरोसेमंद और निष्ठावान होने का भाव है। गवाहों के संदर्भ में ‘विश्वसनीय’ आधुनिक हिन्दी में सबसे स्पष्ट और स्वाभाविक है।
- source_word: אוּרִיָּה הַכֹּהֵן
  choice: ऊरिय्याह याजक
  rationale: व्यक्तिनाम का मानक हिन्दी बाइबलीय लिप्यंतरण रखा गया है और निश्चित पदवी הַכֹּהֵן को ‘याजक’ से व्यक्त किया गया है।
- source_word: זְכַרְיָהוּ בֶּן יְבֶרֶכְיָהוּ
  choice: जकर्याह, जो यबेरेक्याह का पुत्र है
  rationale: नामों को हिन्दी में पारंपरिक और स्रोत-सन्निकट रूपों में लिप्यंतरित किया गया है। संबंधवाचक उपवाक्य हिन्दी में पितृनाम संबंध को स्पष्ट और सहज बनाता है।
theological_decisions:
- issue: गवाहों को लेने, बुलाने या नियुक्त करने में क्रिया का अर्थ
  choice: गवाह ठहराऊँगा
  alternative: गवाहों को बुलाऊँगा / गवाही दिलाऊँगा
  rationale: क्रिया औपचारिक साक्ष्य स्थापित करने का संकेत देती है, पर उसकी सटीक प्रक्रिया अस्पष्ट है। मुख्य पाठ में नियुक्ति का व्यापक भाव रखा गया है और विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट शैली अपनाई गई है। ‘विश्वसनीय’ विश्वस्तता और भरोसेमंदी दोनों को व्यक्त करता है। वाक्य को अत्यधिक कानूनी या पुरातन बनाने से बचाते हुए हिब्रू की औपचारिक साक्ष्यात्मक छाया सुरक्षित रखी गई है।
