source:
  edition: WLC
  text: וְ/לָ/כֵ֡ן הִנֵּ֣ה אֲדֹנָ/י֩ מַעֲלֶ֨ה עֲלֵי/הֶ֜ם אֶת מֵ֣י הַ/נָּהָ֗ר הָ/עֲצוּמִים֙ וְ/הָ֣/רַבִּ֔ים אֶת מֶ֥לֶךְ אַשּׁ֖וּר וְ/אֶת כָּל כְּבוֹד֑/וֹ וְ/עָלָה֙ עַל כָּל אֲפִיקָ֔י/ו וְ/הָלַ֖ךְ עַל כָּל גְּדוֹתָֽי/ו־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/007.yaml
  text: Therefore[a], behold, the Lord is bringing up against them the waters of the River, mighty and many—the king of Assyria and all his glory[b]. And it will rise over all its channels and go over all its banks.
translation:
  language: hi
  text: इसलिए देखो, प्रभु उनके विरुद्ध नदी का प्रबल और अपार जल चढ़ा रहा है—अश्शूर का राजा और उसका सारा वैभव। वह अपने सभी नालों के ऊपर चढ़ आएगा और अपने सभी तटों के ऊपर से बह जाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “नदी” से सम्भवतः फरात नदी का आशय है, जो अश्शूर से जुड़ी महान नदी थी।
    reason: cultural_note
lexical_decisions:
- source_word: וְלָכֵן
  choice: इसलिए
  rationale: यह पिछले पद में शीलोह के धीमे बहने वाले जल को ठुकराने के परिणाम को स्पष्ट करता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: ध्यान आकर्षित करने वाली भविष्यद्वाणी की जीवंतता को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह אֲדֹנָי है, परमेश्वर का निजी नाम नहीं; इसलिए उपाधि के रूप में ‘प्रभु’ उपयुक्त है।
- source_word: מַעֲלֶה עֲלֵיהֶם
  choice: उन पर ... चढ़ा रहा है
  rationale: कृदंत निकट और जीवंत क्रिया व्यक्त करता है तथा चढ़ते हुए बाढ़ के जल का बिंब सुरक्षित रखता है।
- source_word: מֵי הַנָּהָר
  choice: नदी का पानी
  rationale: मूल पाठ केवल निश्चित ‘नदी’ कहता है, नाम नहीं देता; सम्भावित भौगोलिक पहचान टिप्पणी में रखी गई है।
- source_word: הָעֲצוּמִים וְהָרַבִּים
  choice: महान और बहुत जलवाली
  rationale: दोनों विशेषणों को रखते हुए पहले में प्रबलता और दूसरे में जल की प्रचुरता व्यक्त होती है।
- source_word: אֶת מֶלֶךְ אַשּׁוּר וְאֶת כָּל כְּבוֹדוֹ
  choice: अश्शूर का राजा और उसका सारा वैभव
  rationale: यह नदी के जल की व्याख्यात्मक समानाधिकरण रचना है; ‘वैभव’ כבוד के गौरव, शक्ति और राजकीय ठाठ के व्यापक अर्थ को समेटता है।
- source_word: אֲפִיקָיו
  choice: अपने सभी नालों
  rationale: जल के मार्गों या धाराओं के लिए सहज हिन्दी शब्द है और बाढ़ का रूपक बनाए रखता है।
- source_word: וְהָלַךְ עַל כָּל גְּדוֹתָיו
  choice: अपने सभी तटों को लाँघ जाएगा
  rationale: सामान्य सीमाओं से बाहर बह निकलने का अर्थ स्वाभाविक और स्पष्ट हिन्दी में देता है।
theological_decisions:
- issue: आक्रमणकारी जल की पहचान
  choice: ‘नदी का पानी’ रूपक रूप में अश्शूर के राजा और उसके समूचे साम्राज्यिक वैभव को दर्शाता है, जिसे प्रभु न्याय के साधन के रूप में चढ़ा रहा है।
  alternative: इसे केवल वास्तविक नदी की बाढ़ का वर्णन मानना।
  rationale: इब्रानी पाठ स्वयं ‘नदी के पानी’ के बाद ‘अश्शूर का राजा और उसका सारा वैभव’ को समानाधिकरण में रखकर रूपक की पहचान कराता है।
- issue: अंतिम क्रियाओं का कर्ता और व्याकरणिक लिंग
  choice: ‘वह ... उठेगा ... लाँघ जाएगा’ अश्शूर के राजा को निकटतम व्याख्यात्मक कर्ता मानते हुए पुल्लिंग एकवचन को बनाए रखता है।
  alternative: ‘पानी ... उठेगा’ अथवा ‘नदी ... उठेगी’ द्वारा बाढ़ के बिंब को प्रत्यक्ष कर्ता बनाना।
  rationale: इब्रानी क्रियाएँ पुल्लिंग एकवचन हैं और निकटतम स्पष्ट पुल्लिंग एकवचन संज्ञा ‘अश्शूर का राजा’ है, जबकि रूपक का नदी-बाढ़ पक्ष भी सक्रिय रहता है; अनुवाद इस तनाव को पूरी तरह समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, स्पष्ट भविष्यद्वाणी शैली। ‘देखो’ הִנֵּה की ध्यानाकर्षक शक्ति रखता है; ‘अश्शूर’ प्रचलित बाइबलीय नामरूप है। मुख्य पाठ में केवल वही एक टिप्पणी-चिह्न रखा गया है जिसकी टिप्पणी दी गई है।
