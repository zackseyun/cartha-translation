  text: וְ/כָ֥שְׁלוּ בָ֖/ם רַבִּ֑ים וְ/נָפְל֣וּ וְ/נִשְׁבָּ֔רוּ וְ/נוֹקְשׁ֖וּ וְ/נִלְכָּֽדוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/015.yaml
  text: And many among them will stumble[a]; they will fall and be broken; they will be snared and captured.
translation:
  language: hi
  text: और उनमें से बहुत-से लोग ठोकर खाएँगे[a]; वे गिरेंगे और टूट जाएँगे; वे फंदे में फँसेंगे और पकड़ लिए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत-से लोग उनमें ठोकर खाएँगे” अथवा “उनके कारण ठोकर खाएँगे”; यहाँ सर्वनाम निकट संदर्भ के पत्थर और फंदे के बिंबों की ओर संकेत कर सकता है।
    reason: 'वैकल्पिक पाठ-समझ: בָם के सर्वनाम का संदर्भ लोगों के समूह के बजाय पिछले पत्थर/फंदे के बिंबों से जोड़ा जा सकता है।'
lexical_decisions:
- source_word: וְכָשְׁלוּ
  choice: ठोकर खाएँगे
  rationale: כשל ठोकर खाने या लड़खड़ाने का भाव देता है। निकट संदर्भ में ‘ठोकर का पत्थर’ होने के कारण ‘ठोकर खाएँगे’ ठोस रूपक और भावी परिणाम दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בָם
  choice: उनमें से
  rationale: בָם का शाब्दिक रूप ‘उनमें/उनके द्वारा’ हो सकता है। यहाँ רַבִּים के साथ ‘उनमें से बहुत-से लोग’ सहज हिन्दी है और लोगों के समूह के भीतर बहुतों की ओर संकेत करता है; वस्तु-संदर्भ की सम्भावना पाद-टिप्पणी में सुरक्षित है।
- source_word: רַבִּים
  choice: बहुत-से लोग
  rationale: רַבִּים का अर्थ ‘बहुत-से’ है। हिन्दी में अभिप्रेत मानवीय कर्ता स्पष्ट करने के लिए ‘लोग’ जोड़ा गया है।
- source_word: וְנָפְלוּ
  choice: वे गिरेंगे
  rationale: נפל का सामान्य अर्थ ‘गिरना’ है। अलग कर्ता देकर परिणामों की शृंखला हिन्दी में स्पष्ट रखी गई है।
- source_word: וְנִשְׁבָּרוּ
  choice: टूट जाएँगे
  rationale: שבר के निफ़अल रूप में निष्क्रिय/परिणामी अर्थ है। ‘टूट जाएँगे’ रूपक को बिना अनावश्यक तीव्रता बढ़ाए स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְנוֹקְשׁוּ
  choice: फंदे में फँसेंगे
  rationale: יקשׁ का निफ़अल रूप फंदे में पकड़े जाने को दर्शाता है। ‘फंदे में फँसेंगे’ आधुनिक पाठक के लिए स्पष्ट है और मूल शिकार-रूपक बनाए रखता है।
- source_word: וְנִלְכָּדוּ
  choice: पकड़ लिए जाएँगे
  rationale: לכד पकड़ने या अधिकार में लेने को दर्शाता है। यह पिछले ‘फंदे में फँसेंगे’ से आगे बढ़कर अन्तिम पकड़ का भाव देता है।
theological_decisions:
- issue: ठोकर के पत्थर और फंदे के संदर्भ में न्याय का रूपक
  choice: ठोकर खाने, गिरने, टूटने, फंदे में फँसने और पकड़ लिए जाने की ठोस क्रमिक छवियाँ बनाए रखी गई हैं।
  alternative: इसे सामान्य विनाश या केवल आत्मिक पतन जैसे अमूर्त कथन में बदलना।
  rationale: यह पद तत्काल पूर्ववर्ती संदर्भ की ठोकर और फंदे की छवियों को आगे बढ़ाता है। अनुवाद किसी एक धर्मवैचारिक व्याख्या में रूपक को सीमित किए बिना न्याय की तीव्रता और तनाव बनाए रखता है।
- issue: בָם में सर्वनाम का संदर्भ
  choice: मुख्य पाठ में इसे लोगों के समूह की ओर संकेत करते हुए ‘उनमें से’ समझा गया है।
  alternative: इसे पिछले पत्थर/फंदे के बिंब की ओर संकेत करते हुए ‘उस पर’ या ‘उसके कारण’ समझना।
  rationale: दोनों व्याकरणिक-संदर्भगत सम्भावनाएँ मौजूद हैं। मुख्य पाठ सहज सामूहिक अर्थ देता है, जबकि पाद-टिप्पणी वास्तविक वैकल्पिक संदर्भ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और रूपक-सचेत शैली। समानांतर क्रियाओं की क्रमिकता और न्याय की ठोस छवियाँ सुरक्षित रखी गई हैं।
