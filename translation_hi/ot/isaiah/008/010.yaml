source:
  edition: WLC
  text: עֻ֥צוּ עֵצָ֖ה וְ/תֻפָ֑ר דַּבְּר֤וּ דָבָר֙ וְ/לֹ֣א יָק֔וּם כִּ֥י עִמָּ֖/נוּ אֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/010.yaml
  text: Make a plan[a], and it will be thwarted; speak a word, and it will not stand, for God is with us.
translation:
  language: hi
  text: योजना बनाओ, पर वह विफल कर दी जाएगी; कोई बात कहो, पर वह टिकेगी नहीं, क्योंकि परमेश्वर हमारे साथ है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक क्रम है, “क्योंकि हमारे साथ परमेश्वर है”; यह यशायाह 7:14 और 8:8 के नाम ‘इम्मानुएल’ (“परमेश्वर हमारे साथ”) की प्रतिध्वनि है।
    reason: cross_reference
lexical_decisions:
- source_word: עֻצוּ עֵצָה
  choice: योजना बनाओ
  rationale: बहुवचन आज्ञार्थक क्रिया और उसके सजातीय संज्ञा-रूप का आशय विरोधियों को चुनौती देते हुए योजना बनाने से है। यह आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: וְתֻפָר
  choice: पर वह विफल कर दी जाएगी
  rationale: פרר के निफ़अल रूप में योजना के निष्फल या रद्द कर दिए जाने का भाव है। कर्मवाच्य अनुवाद इब्रानी रूप को बनाए रखता है।
- source_word: דַּבְּרוּ דָבָר
  choice: कोई बात कहो
  rationale: क्रिया और उसी मूल से संबंधित संज्ञा के बलाघात को सहज हिन्दी में व्यक्त करता है, बिना ‘आदेश’ या ‘घोषणा’ जैसा अधिक विशिष्ट अर्थ जोड़ने के।
- source_word: וְלֹא יָקוּם
  choice: पर वह टिकेगी नहीं
  rationale: קום यहाँ कही गई बात के कायम रहने या प्रभावी सिद्ध होने को दर्शाता है। ‘टिकेगी नहीं’ संक्षिप्त, स्वाभाविक और रूपक के निकट है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह विरोधियों की योजना और बात के विफल होने का कारण प्रस्तुत करता है।
- source_word: עִמָּנוּ אֵל
  choice: परमेश्वर हमारे साथ है
  rationale: इब्रानी में यह ‘हमारे साथ [है] परमेश्वर’ की विधेयात्मक उक्ति है। हिन्दी में स्वाभाविक शब्दक्रम रखते हुए इसका अर्थ स्पष्ट किया गया है और इम्मानुएल की प्रतिध्वनि पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: यशायाह 7–8 में עִמָּנוּ אֵל का ‘इम्मानुएल’ विषय से संबंध
  choice: मुख्य पाठ में ‘परमेश्वर हमारे साथ है’ और पादटिप्पणी में ‘इम्मानुएल’ की प्रतिध्वनि
  alternative: मुख्य पाठ में ‘इम्मानुएल’ अथवा अधिक शब्दशः ‘हमारे साथ परमेश्वर’
  rationale: यहाँ इब्रानी पाठ दो शब्दों की उक्ति के रूप में है, एक संयुक्त व्यक्तिवाचक नाम के रूप में नहीं; फिर भी यह यशायाह 7:14 और 8:8 के ‘इम्मानुएल’ को स्पष्ट रूप से प्रतिध्वनित करता है। इसलिए उक्ति का अनुवाद मुख्य पाठ में और अंतर्पाठीय संबंध पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। समानांतर चुनौतीपूर्ण वाक्य-विन्यास को दोनों बहुवचन आज्ञाओं में बनाए रखा गया है; ‘पर’ विरोध और परिणाम को सहज हिन्दी में स्पष्ट करता है।
