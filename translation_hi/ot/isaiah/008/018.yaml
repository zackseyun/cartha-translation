source:
  edition: WLC
  text: הִנֵּ֣ה אָנֹכִ֗י וְ/הַ/יְלָדִים֙ אֲשֶׁ֣ר נָֽתַן לִ֣/י יְהוָ֔ה לְ/אֹת֥וֹת וּ/לְ/מוֹפְתִ֖ים בְּ/יִשְׂרָאֵ֑ל מֵ/עִם֙ יְהוָ֣ה צְבָא֔וֹת הַ/שֹּׁכֵ֖ן בְּ/הַ֥ר צִיּֽוֹן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/018.yaml
  text: Behold[a], I and the children whom Yahweh has given me are for signs and wonders in Israel from Yahweh of Armies, who dwells on Mount Zion.
translation:
  language: hi
  text: देखो, मैं और वे बच्चे जिन्हें यहोवा ने मुझे दिया है, सेनाओं के यहोवा की ओर से इस्राएल में चिन्हों और चमत्कारों के लिए हैं, जो सिय्योन पर्वत पर निवास करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला सूचक उद्गार है। आधुनिक हिन्दी में “देखो” इसकी बलपूर्ण भविष्यद्वाणी-संबंधी भूमिका को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אָנֹכִי וְהַיְלָדִים
  choice: मैं और वे बच्चे
  rationale: स्वतंत्र सर्वनाम से आए बल को आरम्भिक “देखो” और संयुक्त पदबंध पर्याप्त रूप से प्रकट करते हैं; יְלָדִים के लिए व्यापक और प्रसंगानुकूल शब्द “बच्चे” है।
- source_word: אֲשֶׁר נָתַן לִי יְהוָה
  choice: जिन्हें यहोवा ने मुझे दिया है
  rationale: पूर्ण क्रिया के वर्तमान परिणाम को हिन्दी का पूर्णकाल स्वाभाविक रूप से दिखाता है, और יְהוָה को उसके व्यक्तिगत नाम “यहोवा” से प्रस्तुत किया गया है।
- source_word: לְאֹתוֹת וּלְמוֹפְתִים
  choice: चिन्ह और अद्भुत संकेत हैं
  rationale: लाम यहाँ भूमिका अथवा परिणाम बताता है। “अद्भुत संकेत” מוֹפְתִים की चमत्कारिक अथवा शकुनात्मक व्यापकता को समझने योग्य हिन्दी में रखता है और “चिन्ह” के साथ अर्थगत संबंध बनाए रखता है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल में
  rationale: ב का सीधा स्थानवाचक अर्थ सुरक्षित रखा गया है।
- source_word: מֵעִם יְהוָה צְבָאוֹת
  choice: ये सेनाओं के यहोवा की ओर से हैं
  rationale: מֵעִם व्यक्तिगत स्रोत दर्शाता है; हिन्दी में “की ओर से” इसे स्पष्ट करता है। צְבָאוֹת का अर्थ पारदर्शी रूप से “सेनाओं” किया गया है।
- source_word: הַשֹּׁכֵן בְּהַר צִיּוֹן
  choice: जो सिय्योन पर्वत पर निवास करता है
  rationale: कृदन्त परमेश्वर के निरन्तर और विशिष्ट निवास को बताता है; “निवास करता है” गरिमापूर्ण तथा स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम है, केवल “प्रभु” की उपाधि नहीं। हिन्दी पाठकों के लिए प्रचलित लिप्यन्तरण “यहोवा” चुना गया, जबकि उच्चारण का वैकल्पिक पुनर्निर्माण “याहवे” है।
- issue: יְהוָה צְבָאוֹת की उपाधि
  choice: सेनाओं के यहोवा
  alternative: सेनाओं का यहोवा; सर्वशक्तिमान यहोवा
  rationale: “सेनाओं के यहोवा” צְבָאוֹת को अर्थानुसार रखता है और मूल की सैन्य/स्वर्गीय बहुवचन छवि को किसी व्याख्यात्मक ईश्वरीय गुण में विलीन नहीं करता।
- issue: यशायाह और बच्चों की संकेतात्मक भूमिका
  choice: चिन्ह और अद्भुत संकेत हैं
  alternative: चिन्हों और चमत्कारों के लिए हैं
  rationale: לְ यहाँ उनके कार्य अथवा नियत भूमिका को दर्शाता है। वाक्य उन्हें स्वयं संकेतात्मक ठहराता है; अनुवाद यह निर्णय नहीं करता कि प्रत्येक संकेत किस प्रकार पूरा होता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सामान्य पाठक के लिए स्पष्ट किन्तु भविष्यद्वाणी के अनुरूप गरिमापूर्ण। वाक्य के दूसरे भाग में “ये” जोड़ा गया है ताकि हिन्दी में स्रोत-संबंध स्पष्ट रहे और ऐसा न लगे कि बच्चे सिय्योन पर निवास करते हैं।
