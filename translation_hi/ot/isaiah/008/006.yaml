base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/006.yaml
  text: Because this people has rejected the waters of Shiloah that flow gently[a], and rejoices over Rezin and the son of Remaliah[b],
translation:
  language: hi
  text: क्योंकि इस प्रजा ने शीलोह के धीरे-धीरे बहने वाले जल को अस्वीकार किया है[a], और वह रसीन और रमल्याह के पुत्र को लेकर आनन्दित होती है[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शीलोह इब्रानी नाम है; यूनानी परंपरा में इसका रूप शीलोआम है।
    reason: lexical_alternative
  - marker: b
    text: या, इस कठिन पाठ की एक वैकल्पिक समझ के अनुसार, “और वह रसीन और रमल्याह के पुत्र के सामने कांपती है।” इब्रानी पाठ में “आनन्दित होती है” है, पर कुछ लोग प्रसंग के आधार पर इसका भाव अलग समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן כִּי
  choice: क्योंकि
  rationale: यह संयुक्त अव्यय अगले पद में घोषित न्याय का कारण बताता है; ‘क्योंकि’ आधुनिक हिन्दी में स्वाभाविक रूप से कारण-संबंध बनाए रखता है।
- source_word: מָאַס
  choice: तुच्छ जाना है
  rationale: क्रिया में ठुकराने और तिरस्कार करने दोनों का भाव हो सकता है। यहाँ परमेश्वर की शांत व्यवस्था के प्रति अनादर का भाव रखने के लिए ‘तुच्छ जाना’ चुना गया है।
- source_word: הָעָם הַזֶּה
  choice: इस प्रजा
  rationale: ‘प्रजा’ भविष्यद्वाणी के सामुदायिक और शासकीय संदर्भ में स्वाभाविक है तथा इब्रानी एकवचन सामूहिक संज्ञा को दर्शाती है।
- source_word: מֵי הַשִּׁלֹחַ
  choice: शीलोह के ... जल
  rationale: स्थान-नाम को इब्रानी שִׁלֹחַ से सीधे ‘शीलोह’ रूप में लिप्यंतरित किया गया है; यूनानी परंपरा का ‘शीलोआम’ रूप पादटिप्पणी में दिया गया है।
- source_word: הַהֹלְכִים לְאַט
  choice: धीरे-धीरे बहने वाले
  rationale: शाब्दिक अर्थ ‘धीरे/शांत रूप से जाने वाले’ है। जल के लिए ‘बहने वाले’ सहज हिन्दी है और अगले पद की प्रबल नदी से विरोध भी बनाए रखता है।
- source_word: וּמְשׂוֹשׂ
  choice: और वह ... पर आनन्दित होती है
  rationale: मसोरेटी पाठ का स्वाभाविक संबंध שׂושׂ, ‘आनन्दित होना/हर्षित होना,’ से है। प्रसंग कठिन होने पर भी मुख्य पाठ में अनुमानित नकारात्मक अर्थ नहीं रखा गया।
- source_word: אֶת רְצִין וּבֶן רְמַלְיָהוּ
  choice: रसीन और रमल्याह के पुत्र पर
  rationale: व्यक्तिनाम मूल इब्रानी के अनुसार लिप्यंतरित हैं। ‘रमल्याह का पुत्र’ मूल की अभिव्यक्ति और पेकह का नाम न लेने वाली दूरी को बिना व्याख्या जोड़े सुरक्षित रखता है।
theological_decisions:
- issue: וּמְשׂוֹשׂ אֶת רְצִין וּבֶן רְמַלְיָהוּ का कठिन अर्थ
  choice: मुख्य पाठ में ‘रसीन और रमल्याह के पुत्र पर आनन्दित होती है’
  alternative: ‘रसीन और रमल्याह के पुत्र से थरथराती है’
  rationale: मसोरेटी पाठ שׂושׂ (‘आनन्दित होना’) से बना है, इसलिए उसे प्रसंग सुगम करने हेतु अनुमानित भय-संबंधी अर्थ से नहीं बदला गया। संदर्भ के कारण प्रस्तावित वैकल्पिक समझ पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य अगले पद में जारी रहने के कारण अंत में अल्पविराम रखा गया है। ‘शीलोह’ मूल इब्रानी नाम का रूप है; कठिन अंतिम उपवाक्य की अस्पष्टता मुख्य पाठ और पादटिप्पणी के माध्यम से सुरक्षित रखी गई है।
