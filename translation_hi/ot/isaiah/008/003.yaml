language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָ/אֶקְרַב֙ אֶל הַ/נְּבִיאָ֔ה וַ/תַּ֖הַר וַ/תֵּ֣לֶד בֵּ֑ן וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י קְרָ֣א שְׁמ֔/וֹ מַהֵ֥ר שָׁלָ֖ל חָ֥שׁ בַּֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/003.yaml
  text: So I went near to the prophetess[a], and she conceived and bore a son. Then Yahweh said to me[b], “Call his name Maher-shalal-hash-baz.”
translation:
  language: hi
  text: तब मैं नबिया के निकट गया, और वह गर्भवती हुई और उसने एक पुत्र को जन्म दिया। तब याहवे ने मुझसे कहा, “उसका नाम महेर-शालाल-हाश-बज़[a] रखो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस नाम का अर्थ संभवतः “लूट के लिए शीघ्र, शिकार के लिए तेज़” है।
    reason: नाम कथा में प्रतीकात्मक महत्त्व रखता है। इब्रानी पदबंध अत्यंत संक्षिप्त है, इसलिए अर्थ को ‘संभवतः’ के साथ दिया गया है।
lexical_decisions:
- source_word: וָאֶקְרַב
  choice: मैं ... के निकट गया
  rationale: קרב का मूल अर्थ ‘निकट जाना’ है। प्रसंग में यह दाम्पत्य संबंध के लिए संयत संकेत है; अनुवाद मूल की शालीन अप्रत्यक्षता बनाए रखता है।
- source_word: הַנְּבִיאָה
  choice: नबिया
  rationale: यह ‘नबी’ का स्त्रीलिंग रूप है। ‘नबिया’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट रूप से स्त्रीलिंग पद को व्यक्त करता है।
- source_word: וַתַּהַר
  choice: वह गर्भवती हुई
  rationale: הרה का अर्थ गर्भ धारण करना या गर्भवती होना है। यह वर्तमान हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: וַתֵּלֶד בֵּן
  choice: उसने एक पुत्र को जन्म दिया
  rationale: यह हिन्दी में ילד और בֵּן के अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले इब्रानी व्यक्तिगत नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: קְרָא שְׁמוֹ
  choice: उसका नाम ... रखो
  rationale: इब्रानी नामकरण-सूत्र का स्वाभाविक हिन्दी समतुल्य है।
- source_word: מַהֵר שָׁלָל חָשׁ בַּז
  choice: माहेर-शालाल-हाश-बज़
  rationale: यह प्रतीकात्मक व्यक्तिगत नाम है, इसलिए मुख्य पाठ में इसका लिप्यंतरण किया गया है; अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: נגשׁ/קרב के प्रसंगगत दाम्पत्य अर्थ को कितना स्पष्ट किया जाए
  choice: मूल का संयत वाक्य ‘नबिया के निकट गया’ बनाए रखना
  alternative: ‘मैंने नबिया के साथ दाम्पत्य संबंध बनाए’
  rationale: गर्भधारण से दाम्पत्य आशय स्पष्ट होता है, पर इब्रानी उसे सीधे नहीं कहता। अधिक स्पष्ट अनुवाद मूल पाठ की शालीन अप्रत्यक्षता को अनावश्यक रूप से खोल देता।
- issue: याहवे के नाम का अनुवाद या प्रतिस्थापन
  choice: व्यक्तिगत नाम ‘याहवे’ का लिप्यंतरण
  alternative: ‘प्रभु’
  rationale: मूल में सामान्य उपाधि नहीं, बल्कि יהוה नाम है; इसलिए पाठ में उस भेद को सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नबिया’ प्रचलित बाइबलीय पद है; ‘के निकट गया’ मूल इब्रानी की संयत अभिव्यक्ति को बचाता है। वाव-क्रम की प्रवाहशीलता को हिन्दी में ‘तब’ और अर्धविराम द्वारा व्यक्त किया गया है।
