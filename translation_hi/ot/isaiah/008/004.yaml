base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/004.yaml
  text: For before the boy knows how to cry[c][b][a], ‘My father’ and ‘My mother,’ the wealth of Damascus and the spoil of Samaria will be carried away before the king of Assyria.
translation:
  language: hi
  text: क्योंकि इससे पहले कि वह बालक “मेरे पिता!” और “मेरी माता!” पुकारना[a] जाने, दमिश्क की धन-संपत्ति और सामरिया की लूट[b] अश्शूर के राजा के सामने ले जाई जाएगी।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कहना।”
    reason: lexical_alternative
  - marker: b
    text: या, “सामरिया से लूटा हुआ माल।”
    reason: lexical_alternative
  - marker: c
    text: हिब्रू पाठ में केवल “वह बालक” है; निकट संदर्भ में संभवतः पिछले पदों में नाम दिए गए बालक की ओर संकेत है।
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के कारण अथवा उसकी व्याख्या को प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּטֶרֶם
  choice: इससे पहले कि
  rationale: यह स्पष्ट करता है कि अगली घटना बालक की बताई गई विकास-अवस्था से पहले घटेगी।
- source_word: יֵדַע ... קְרֹא
  choice: पुकारना जाने
  rationale: यह रचना किसी काम को करने की व्यावहारिक क्षमता बताती है; ‘पुकारना जाने’ मूल के निकट और हिन्दी में सहज है।
- source_word: הַנַּעַר
  choice: वह बालक
  rationale: नַעַר का अर्थ बालक से युवक तक हो सकता है, पर माता-पिता को पुकारने का संदर्भ छोटी आयु सूचित करता है। निश्चित पहचान को पाठ में नहीं जोड़ा गया।
- source_word: אָבִי וְאִמִּי
  choice: “मेरे पिता” और “मेरी माता”
  rationale: हिब्रू के प्रथम पुरुष एकवचन संबंधसूचक रूप को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: חֵיל
  choice: धन-संपत्ति
  rationale: यह शब्द सामर्थ्य, सेना अथवा संपत्ति का अर्थ दे सकता है; ‘लूट’ के समानांतर होने के कारण यहाँ भौतिक धन-संपत्ति सर्वाधिक उपयुक्त है।
- source_word: שְׁלַל
  choice: लूट
  rationale: युद्ध में छीनी गई वस्तुओं के लिए यह आधुनिक हिन्दी का संक्षिप्त और स्वाभाविक शब्द है।
- source_word: יִשָּׂא
  choice: उठा ले जाई जाएगी
  rationale: हिब्रू में क्रिया सक्रिय होते हुए भी कर्ता अनिर्दिष्ट है; हिन्दी का कर्मवाच्य किसी अनकहे कर्ता को जोड़े बिना आशय प्रकट करता है।
- source_word: לִפְנֵי מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा के सामने
  rationale: לִפְנֵי का स्थानिक/उपस्थितिगत अर्थ ‘के सामने’ सुरक्षित रखा गया है और सामान को राजा के पास प्रस्तुत किए जाने का संकेत मिलता है।
theological_decisions:
- issue: ‘वह बालक’ का संदर्भ
  choice: मुख्य पाठ में केवल ‘वह बालक’ रखा गया है।
  alternative: उसे स्पष्ट रूप से महेर-शालाल-हाश-बज या व्यापक भविष्यसूचक चिन्ह के बालक के रूप में पहचानना।
  rationale: पद स्वयं केवल निश्चित पदबंध ‘बालक’ कहता है। निकट संदर्भ पहचान की ओर संकेत करता है, पर अनुवाद में उसे निर्णायक रूप से जोड़ना मूल से अधिक कहना होगा।
- issue: लूट को ले जाने वाला कर्ता
  choice: अनिर्दिष्ट कर्ता को बनाए रखने के लिए कर्मवाच्य प्रयोग किया गया है।
  alternative: ‘अश्शूर का राजा उठा ले जाएगा।’
  rationale: संदर्भ अश्शूर की भूमिका स्पष्ट करता है, फिर भी हिब्रू क्रिया का व्याकरणिक कर्ता राजा नहीं, दमिश्क की संपत्ति और सामरिया की लूट हैं; अतः स्पष्ट एजेंट जोड़ना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘मेरे पिता’ और ‘मेरी माता’ मूल के स्पष्ट संबंधसूचक रूप को बनाए रखते हैं; अधिक बोलचाल के ‘पापा/माँ’ नहीं जोड़े गए। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
