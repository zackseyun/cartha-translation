base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/023.yaml
  text: For there will be no gloom for her who was in anguish[a]. In the former time he brought contempt on the land of Zebulun and the land of Naphtali, but in the latter time he will make glorious the way of the sea, beyond the Jordan[c][b], Galilee of the nations.
translation:
  language: hi
  text: क्योंकि जो संकट में थी, उसके लिए अंधकार[a] न रहेगा। पहले समय में उसने जबूलून के देश और नप्ताली के देश को अपमानित किया था, पर बाद के समय में वह समुद्र के मार्ग, यरदन के पार, और जातियों के गलील[b][c] को गौरव देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरम्भ का हिब्रू पाठ कठिन है। ‘अंधकार’ का अनुवाद ‘घना अँधेरा’ या ‘धुँधलापन’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘गैर-यहूदियों का गलील’ भी हो सकता है; हिब्रू में शाब्दिक अर्थ ‘जातियों का गलील’ है।
    reason: lexical_alternative
  - marker: c
    text: मत्ती 4:15–16 में यीशु की सार्वजनिक सेवा के आरम्भ के संबंध में इस क्षेत्र का उल्लेख किया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: מוּעָף
  choice: अंधकार
  rationale: यह दुर्लभ और कठिन शब्द दबानेवाले धुँधलेपन या निराशा से भरे अंधकार का बोध देता है। संदर्भ में आगे आनेवाले प्रकाश के साथ इसका स्वाभाविक विरोध बनता है; अनिश्चितता को पादटिप्पणी में रखा गया है।
- source_word: מוּצָק
  choice: संकट
  rationale: यह दबाव, क्लेश या विपत्ति की दशा बताता है। ‘संकट’ आधुनिक हिन्दी में व्यापक और स्वाभाविक है तथा भावनात्मक अर्थ को जरूरत से अधिक संकीर्ण नहीं करता।
- source_word: הֵקַל
  choice: अपमानित किया था
  rationale: हिफ़ील रूप यहाँ बाद के הִכְבִּיד के विपरीत है और उस प्रदेश को हल्का, तुच्छ या आदरहीन ठहराने का भाव देता है। ‘अपमानित’ इस विरोध को स्पष्ट रखता है।
- source_word: הִכְבִּיד
  choice: गौरव देगा
  rationale: मूल अर्थ ‘भारी/महत्त्वपूर्ण बनाना’ है; הֵקַל के साथ विरोध में यह आदर और प्रतिष्ठा लौटाने का संकेत देता है। भविष्यकाल प्रसंग में न्याय से आशा की ओर होनेवाले परिवर्तन को व्यक्त करता है।
- source_word: דֶּרֶךְ הַיָּם
  choice: समुद्र का मार्ग
  rationale: यह हिब्रू भौगोलिक अभिव्यक्ति को औपचारिक रूप से सुरक्षित रखता है और किसी विशेष आधुनिक मार्ग की पहचान आरोपित नहीं करता।
- source_word: עֵבֶר הַיַּרְדֵּן
  choice: यरदन के पार का क्षेत्र
  rationale: ‘पार’ मूल की दिशात्मक अस्पष्टता को बनाए रखता है; ‘क्षेत्र’ जोड़ने से हिन्दी में भौगोलिक पदों की शृंखला स्पष्ट होती है।
- source_word: גְּלִיל הַגּוֹיִם
  choice: जातियों का गलील
  rationale: גּוֹיִם का व्यापक और अधिक शाब्दिक अर्थ ‘जातियाँ/राष्ट्र’ है। ‘गैर-यहूदियों’ वाला अर्थ पादटिप्पणी में दिया गया है।
- source_word: כִּי לֹא
  choice: क्योंकि ... न रहेगा
  rationale: यह पिछले प्रसंग के अंधकार से आगे की आशा की ओर संक्रमण और अपेक्षित भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַאֲשֶׁר מוּצָק לָהּ
  choice: जो संकट में थी, उसके लिए
  rationale: स्त्रीलिंग प्रत्यय को बनाए रखते हुए पीड़ित भूमि/प्रदेश के मानवीकरण को सुरक्षित रखा गया है, बिना मूल में अनुपस्थित संज्ञा को मुख्य पाठ में जोड़ने के।
theological_decisions:
- issue: अंतिम खंड को भावी गौरव मानना या जारी दण्ड
  choice: 'भावी प्रतिष्ठा: ‘वह ... गौरव देगा’'
  alternative: 'जारी दण्ड: ‘उसने ... बोझिल किया’ या ‘उस पर भारी संकट डाला’'
  rationale: पहले के अपमान और बाद के गौरव का विरोध, तथा निकटवर्ती संदर्भ में अंधकार से प्रकाश की ओर गति, भावी पुनःप्रतिष्ठा का समर्थन करते हैं। फिर भी क्रिया के शाब्दिक ‘भारी करना’ भाव को निर्णय का आधार मानकर दर्ज किया गया है।
- issue: पीड़ित स्त्रीलिंग संदर्भ की पहचान
  choice: स्त्रीलिंग मानवीकरण को ‘जो ... थी’ के रूप में बनाए रखना
  alternative: 'स्पष्ट करना: ‘वह भूमि जो संकट में थी’'
  rationale: संदर्भ भूमि की ओर संकेत करता है, पर इस पद में संज्ञा प्रत्यक्ष नहीं है। इसलिए अनुवाद उसे चुपचाप पाठ में नहीं जोड़ता।
- issue: גּוֹיִם को ‘जातियाँ’ या ‘गैर-यहूदी’ कहना
  choice: मुख्य पाठ में ‘जातियाँ’
  alternative: ‘गैर-यहूदियों का गलील’
  rationale: ‘जातियाँ’ हिब्रू का व्यापक अर्थ और यशायाह के ऐतिहासिक क्षितिज को सुरक्षित रखता है; संकीर्णतर धार्मिक अर्थ पादटिप्पणी में उपलब्ध है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जबूलून’, ‘नप्ताली’, ‘यरदन’ और ‘गलील’ प्रचलित हिन्दी बाइबिलीय नामरूप हैं। मुख्य पाठ में भूगोल की काव्यात्मक शृंखला और स्त्रीलिंग मानवीकरण सुरक्षित हैं; पादटिप्पणी-चिह्नों को उनके वास्तविक विषयों के साथ रखा गया है।
