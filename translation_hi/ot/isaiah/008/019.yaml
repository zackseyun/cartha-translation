  text: וְ/כִֽי יֹאמְר֣וּ אֲלֵי/כֶ֗ם דִּרְשׁ֤וּ אֶל הָ/אֹבוֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים הַֽ/מְצַפְצְפִ֖ים וְ/הַ/מַּהְגִּ֑ים הֲ/לוֹא עַם֙ אֶל אֱלֹהָ֣י/ו יִדְרֹ֔שׁ בְּעַ֥ד הַ/חַיִּ֖ים אֶל הַ/מֵּתִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/019.yaml
  text: And when they say to you[b][a], “Consult the mediums and the spiritists who chirp and mutter,” should not a people consult its God? Should they consult the dead on behalf of the living?
translation:
  language: hi
  text: और जब वे तुमसे कहें, “ओझाओं[a] और प्रेत-साधकों से पूछो, जो चूँ-चूँ करते और बुदबुदाते हैं[b],” तो क्या लोगों को अपने परमेश्वर से नहीं पूछना चाहिए? क्या जीवितों के लिए मरे हुओं से पूछना चाहिए?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अनुवाद “मृतात्माओं” या “प्रेतों” के रूप में भी किया जा सकता है। यहाँ संभवतः उनसे संपर्क कराने का दावा करने वाले ओझा अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: या “जो चीं-चीं करते और बुदबुदाते हैं।” इब्रानी शब्द प्रेत-संपर्क से जोड़ी जाने वाली पक्षियों जैसी तीखी और धीमी, अस्पष्ट ध्वनियों का अनुकरण करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: और जब
  rationale: यह पद एक संभावित अथवा अपेक्षित परिस्थिति प्रस्तुत करता है; ‘और जब’ प्रसंग के प्रवाह और इस अपेक्षित स्थिति, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דִּרְשׁוּ
  choice: पूछो
  rationale: इस प्रसंग में क्रिया का अर्थ मार्गदर्शन पाने के लिए किसी से पूछना या परामर्श लेना है। ‘पूछो’ सामान्य पाठक के लिए सहज है और आगे परमेश्वर तथा मृतकों से पूछने के विरोध को बनाए रखता है।
- source_word: הָאֹבוֹת
  choice: ओझाओं
  rationale: यह शब्द मृतात्माओं से संपर्क कराने वाले व्यक्तियों अथवा स्वयं आत्माओं को सूचित कर सकता है। मुख्य पाठ में ‘ओझाओं’ से तांत्रिक-माध्यमों का प्रसंग स्पष्ट होता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: הַיִּדְּעֹנִים
  choice: प्रेत-साधकों
  rationale: यह प्रेतात्माओं से कथित संपर्क और गुप्त ज्ञान से जुड़े साधकों को दर्शाता है। ‘प्रेत-साधक’ आधुनिक हिन्दी में स्पष्ट है और काल्पनिक कथाओं से जुड़े ‘जादूगर’ जैसे अर्थ से बचता है।
- source_word: הַמְצַפְצְפִים
  choice: जो चूँ-चूँ करते
  rationale: इब्रानी कृदंत पक्षियों जैसी तीखी, अस्पष्ट ध्वनि का अनुकरण करता है; ‘चूँ-चूँ’ उस श्रव्य प्रभाव को हिन्दी में बनाए रखता है।
- source_word: וְהַמַּהְגִּים
  choice: और बुदबुदाते हैं
  rationale: यह धीमी, अस्पष्ट ध्वनि निकालने को व्यक्त करता है। ‘बुदबुदाते’ प्रेत-साधना से जुड़ी मंद वाणी का स्वाभाविक हिन्दी रूप है।
- source_word: הֲלוֹא עַם אֶל אֱלֹהָיו יִדְרֹשׁ
  choice: तो क्या किसी प्रजा को अपने परमेश्वर से नहीं पूछना चाहिए?
  rationale: प्रश्नवाचक रूप अपेक्षित सकारात्मक उत्तर वाली फटकार है। ‘प्रजा’ सामूहिक עַם और ‘अपने परमेश्वर’ एकवचन संबंधसूचक प्रत्यय को सुरक्षित रखते हैं।
- source_word: בְּעַד הַחַיִּים אֶל הַמֵּתִים
  choice: क्या जीवितों के लिए मरे हुओं से पूछना चाहिए?
  rationale: अंतिम वाक्य में पहले प्रयुक्त ‘पूछना’ निहित है। ‘जीवितों के लिए’ בְּעַד का प्रयोजनार्थक भाव रखता है और ‘मरे हुओं’ के साथ तीखा विरोध स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर से पूछने और मृतकों से पूछने के बीच अलंकारिक विरोध
  choice: पद को ऐसी फटकार के रूप में रखा गया है जो लोगों को मृतात्मा-संपर्क के साधकों अथवा मृतकों के बजाय अपने परमेश्वर से मार्गदर्शन माँगने को कहती है।
  alternative: इसे केवल मृतकों से पूछने की निरर्थकता पर व्यंग्य, अथवा मृतकों की दशा पर एक विस्तृत धर्मसैद्धांतिक कथन माना जा सकता है।
  rationale: इब्रानी पाठ का सीधा बल मार्गदर्शन के उचित स्रोत पर है। अनुवाद इस विरोध को स्पष्ट रखता है, पर मृतकों की सामर्थ्य या दशा के विषय में वह निष्कर्ष नहीं जोड़ता जो इस पद में प्रत्यक्ष रूप से नहीं दिया गया।
translation_notes:
  register: भाषा आधुनिक, सुबोध और गरिमापूर्ण रखी गई है। ‘ओझा’ और ‘प्रेत-साधक’ सामान्य हिन्दी में तांत्रिक माध्यमों को स्पष्ट करते हैं; ध्वन्यात्मक ‘चूँ-चूँ’ मूल की असामान्य श्रव्य छवि को जानबूझकर बनाए रखता है।
