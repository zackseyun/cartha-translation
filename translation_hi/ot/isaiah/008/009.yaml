source:
  edition: WLC
  text: רֹ֤עוּ עַמִּים֙ וָ/חֹ֔תּוּ וְ/הַֽאֲזִ֔ינוּ כֹּ֖ל מֶרְחַקֵּי אָ֑רֶץ הִתְאַזְּר֣וּ וָ/חֹ֔תּוּ הִֽתְאַזְּר֖וּ וָ/חֹֽתּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/009.yaml
  text: Be shattered[a], O peoples, and be broken; listen, all distant parts of the earth. Strap yourselves on for battle, and be broken; strap yourselves on for battle[b], and be broken.
translation:
  language: hi
  text: हे राष्ट्रों, चूर-चूर हो जाओ[a] और टूट जाओ! पृथ्वी के सभी दूर-दराज़ प्रदेशों, ध्यान से सुनो! युद्ध के लिए कमर कसो और टूट जाओ; कमर कसो[b] और टूट जाओ!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरंभ का इब्रानी आज्ञार्थक शब्द कठिन है। इसका अनुवाद “हे राष्ट्रों, युद्ध का नारा लगाओ” या “हे राष्ट्रों, एकजुट हो जाओ” भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या “अपनी कमर बाँधो”; इब्रानी में स्वयं को तैयार करने, संभवतः युद्ध के लिए, का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעוּ
  choice: चूर-चूर हो जाओ
  rationale: इब्रानी रूप कठिन और विवादित है। निकट संदर्भ में बार-बार आने वाले ‘टूट जाओ’ तथा शत्रु जातियों को दी गई व्यंग्यपूर्ण चुनौती के साथ ‘चूर-चूर हो जाओ’ स्वाभाविक मेल रखता है। अन्य संभव अर्थ पादटिप्पणी में सुरक्षित रखे गए हैं।
- source_word: עַמִּים
  choice: जाति-जाति के लोगो
  rationale: बहुवचन में अनेक समुदायों को सीधे संबोधन को दर्शाता है और हिन्दी में काव्यात्मक तथा सहज है।
- source_word: וָחֹתּוּ
  choice: और टूट जाओ
  rationale: חתת पराजय, टूटने या भयभीत होने का भाव दे सकता है। यहाँ शत्रुओं की तैयारी के निष्फल परिणाम के रूप में ‘टूट जाओ’ शारीरिक और मनोबल—दोनों प्रकार के पतन का संकेत देता है।
- source_word: וְהַאֲזִינוּ
  choice: ध्यान से सुनो
  rationale: हिफ़ील आज्ञार्थक का आशय केवल सुनना नहीं, बल्कि कान लगाकर ध्यान देना है।
- source_word: כֹּל מֶרְחַקֵּי אָרֶץ
  choice: पृथ्वी के सभी दूर-दराज़ प्रदेशो
  rationale: यह भौगोलिक रूप से दूर स्थित समस्त क्षेत्रों को संबोधित करता है; सम्बोधन-वाचक रूप हिन्दी में मूल की व्यापक पुकार को बनाए रखता है।
- source_word: הִתְאַזְּרוּ
  choice: युद्ध के लिए कमर कसो
  rationale: हित्पएल रूप स्वयं कमर बाँधकर तैयार होने, विशेषतः संघर्ष के लिए तैयार होने, का भाव देता है। ‘कमर कसो’ आधुनिक हिन्दी का स्वाभाविक मुहावरा है; संदर्भ से निहित सैन्य तैयारी पहली आवृत्ति में स्पष्ट की गई है।
theological_decisions:
- issue: आरंभिक आज्ञार्थक רֹעוּ का अर्थ
  choice: 'शत्रु जातियों के विनाश की व्यंग्यपूर्ण घोषणा: ‘चूर-चूर हो जाओ’'
  alternative: ‘युद्ध का नारा लगाओ’ या ‘एकजुट हो जाओ’
  rationale: पद में उनकी तैयारी के बावजूद उनके टूट जाने की घोषणा दो बार आती है। चुना गया पाठ इस न्याय-संबंधी और व्यंग्यपूर्ण काव्य-बल को बनाए रखता है, जबकि इब्रानी की वास्तविक अनिश्चितता को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ में सहज रखी गई है। विस्मयादिबोधक चिह्न भविष्यद्वक्ता की तीखी चुनौती को व्यक्त करते हैं। ‘कमर कसो’ परिचित हिन्दी मुहावरा है, और मूल की पुनरुक्ति को बनाए रखा गया है।
