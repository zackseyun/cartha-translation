base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/001.yaml
  text: 'Then Yahweh said to me[b][a], “Take for yourself a large tablet and write on it with an ordinary stylus: ‘Maher-shalal-hash-baz.’”'
translation:
  language: hi
  text: 'तब याहवे ने मुझसे कहा, “अपने लिए एक बड़ी पटिया ले और उस पर साधारण लेखनी से[a] लिख: ‘माहेर-शालाल-हाश-बाज़।’[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “मनुष्य की लेखनी से”; इसका अर्थ “आम कलम से” या “सामान्य लिपि में” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी नाम माहेर-शालाल-हाश-बाज़ का संभावित अर्थ है, “लूटने में शीघ्र, माल छीनने में तेज़।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम को उसके नाम के रूप में लिप्यंतरित किया गया है; इसे उपाधि ‘प्रभु’ से नहीं बदला गया।
- source_word: גִּלָּיוֹן גָּדוֹל
  choice: एक बड़ी पटिया
  rationale: גִּלָּיוֹן किसी बड़े लिखने योग्य पटल, पत्र या सतह का द्योतक हो सकता है। प्रसंग में सार्वजनिक रूप से लिखे जाने योग्य वस्तु के लिए ‘पटिया’ स्वाभाविक और स्पष्ट है।
- source_word: קַח לְךָ
  choice: अपने लिए ... ले
  rationale: לְךָ के आत्मवाचक या व्यक्तिगत भाव को बनाए रखा गया है।
- source_word: וּכְתֹב עָלָיו
  choice: और उस पर ... लिख
  rationale: आज्ञार्थक क्रिया और संबंधसूचक पदबंध का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: בְּחֶרֶט אֱנוֹשׁ
  choice: साधारण लेखनी से
  rationale: חֶרֶט लेखनी, कलम या खोदने के औज़ार का अर्थ दे सकता है, और אֱנוֹשׁ यहाँ सामान्य मानवीय उपयोग या आम लिपि का भाव दे सकता है। मुख्य पाठ में सहज अर्थ दिया गया और वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: לְמַהֵר שָׁלָל חָשׁ בַּז
  choice: माहेर-शालाल-हाश-बज़
  rationale: आगे के प्रसंग में यह प्रतीकात्मक नाम बनता है, इसलिए मुख्य पाठ में इसका लिप्यंतरण किया गया है और संभावित अर्थ पादटिप्पणी में दिया गया है।
- source_word: וַיֹּאמֶר ... אֵלַי
  choice: तब ... ने मुझसे कहा
  rationale: वाव-क्रमागत कथानक को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उस क्रम को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर-नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला विशिष्ट परमेश्वर-नाम है। नाम को नाम के रूप में सुरक्षित रखने के लिए ‘याहवे’ चुना गया है।
- issue: לְמַהֵר שָׁלָל חָשׁ בַּז को अर्थानुवाद करना या नाम के रूप में लिखना
  choice: मुख्य पाठ में ‘माहेर-शालाल-हाश-बज़’ का लिप्यंतरण
  alternative: ‘लूट शीघ्र आती है, माल जल्द आता है’ जैसे अर्थानुवाद
  rationale: अगले पदों में यही वाक्यांश बालक के प्रतीकात्मक नाम के रूप में प्रयुक्त होता है। नाम का रूप मुख्य पाठ में और उसका अर्थ पादटिप्पणी में रखने से दोनों पहलू सुरक्षित रहते हैं।
- issue: בְּחֶרֶט אֱנוֹשׁ में אֱנוֹשׁ का आशय
  choice: साधारण/आम लेखनी
  alternative: मनुष्य की लेखनी; सामान्य लिपि
  rationale: शाब्दिक रूप ‘मनुष्य की लेखनी’ संभव है, पर पदबंध संभवतः सामान्य और सबके पढ़ने योग्य लेखन का संकेत देता है। अनिश्चितता को पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। एकवचन आज्ञाओं को हिन्दी में स्वाभाविक रूप से व्यक्त किया गया है। प्रतीकात्मक इब्रानी नाम को देवनागरी में लिप्यंतरित किया गया है, जबकि दो वास्तविक शाब्दिक अस्पष्टताओं को पादटिप्पणियों में सुरक्षित रखा गया है।
