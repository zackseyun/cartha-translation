base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/022.yaml
  text: And he will look to the earth[a], and behold, distress and darkness, the gloom of anguish[b]; and thick darkness will be driven away.
translation:
  language: hi
  text: और वह धरती की ओर देखेगा[a]—और देखो, संकट और अंधकार, व्यथा का धुंधलका होगा; और वह घोर अंधकार में खदेड़ दिया जाएगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देश की ओर।”
    reason: אֶרֶץ का अर्थ प्रसंग के अनुसार ‘धरती’ या ‘देश’ हो सकता है।
  - marker: b
    text: 'इब्रानी अत्यन्त संक्षिप्त है: “संकट और अंधकार, व्यथा का धुंधलका, और घोर अंधकार—खदेड़ा हुआ।” अंतिम शब्द पुल्लिंग एकवचन है; इसलिए वह स्त्रीलिंग “घोर अंधकार” के बजाय सम्भवतः निहित व्यक्ति को सूचित करता है: “वह घोर अंधकार में खदेड़ दिया जाएगा।”'
    reason: मूल के अंतिम पदबंध में निहित विषय और संबंध संक्षिप्त रूप में हैं; हिन्दी मुख्य-पाठ व्याकरणतः अधिक सम्भावित समझ को व्यक्त करता है।
lexical_decisions:
- source_word: אֶרֶץ
  choice: धरती
  rationale: ऊपर की ओर देखने और फिर नीचे धरती की ओर देखने के प्रसंगगत विरोध को स्वाभाविक हिन्दी में व्यक्त करता है; ‘देश’ भी सम्भव है।
- source_word: יַבִּיט
  choice: देखेगा
  rationale: נבט के हिफ़ील रूप का सामान्य अर्थ ‘देखना/निहारना’ है; यहाँ ‘देखेगा’ सहज और प्रसंगानुकूल है।
- source_word: וְהִנֵּה
  choice: वहाँ
  rationale: यह दृष्टि के सामने उपस्थित दशा की ओर ध्यान खींचता है; हिन्दी में डैश के बाद ‘वहाँ’ उसी संकेतात्मक बल को स्वाभाविक ढंग से रखता है।
- source_word: צָרָה וַחֲשֵׁכָה
  choice: संकट और अंधकार
  rationale: दोनों संज्ञाओं को उनकी सीधी अर्थ-सीमा और काव्यात्मक समानांतरता सहित रखा गया है।
- source_word: מְעוּף צוּקָה
  choice: पीड़ा की उदासी
  rationale: दुर्लभ מְעוּף को צוּקָה के साथ संबंधवाचक पदबंध मानते हुए घनी, दमनकारी gloom का अर्थ दिया गया है; मूल की संक्षिप्तता बनी रहती है।
- source_word: אֲפֵלָה
  choice: घोर अंधकार
  rationale: यह חֲשֵׁכָה से अधिक गहरे और दमनकारी अंधकार का बोध कराता है।
- source_word: מְנֻדָּח
  choice: खदेड़ दिया जाएगा
  rationale: נדח का पुअल कृदन्त किसी पुरुषवाचक एकवचन व्यक्ति के बलपूर्वक हटाए या खदेड़े जाने को सूचित करता है। स्त्रीलिंग אֲפֵלָה के साथ लिंग-सामंजस्य न होने के कारण इसे ‘अंधकार खदेड़ा जाएगा’ नहीं माना गया।
theological_decisions:
- issue: अंतिम पदबंध में खदेड़े जाने वाला कौन है
  choice: 'निहित पुरुषवाचक व्यक्ति: ‘वह घोर अंधकार में खदेड़ दिया जाएगा’'
  alternative: 'अत्यन्त संक्षिप्त रूप: ‘घोर अंधकार—खदेड़ा हुआ’'
  rationale: מְנֻדָּח पुल्लिंग एकवचन है, जबकि אֲפֵלָה स्त्रीलिंग है; इसलिए कृदन्त का विषय अंधकार नहीं, प्रसंग का व्यक्ति अधिक सम्भावित है। फिर भी इब्रानी वाक्य अत्यन्त संक्षिप्त है, इसलिए अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक गद्य। ‘निहारना’ जैसे अधिक साहित्यिक शब्द के बजाय सहज ‘देखेगा’ रखा गया है, जबकि ‘घोर अंधकार’ भविष्यवाणी के गंभीर और दमनकारी बिंब को बनाए रखता है।
