id: ISA.8.20
reference: Isaiah 8:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לְ/תוֹרָ֖ה וְ/לִ/תְעוּדָ֑ה אִם לֹ֤א יֹֽאמְרוּ֙ כַּ/דָּבָ֣ר הַ/זֶּ֔ה אֲשֶׁ֥ר אֵֽין ל֖/וֹ שָֽׁחַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/020.yaml
  text: To the law and to the testimony! If they do not speak according to this word[b][a], there is no dawn for them.
translation:
  language: hi
  text: शिक्षा[a] और गवाही की ओर! यदि वे इस वचन के अनुसार न बोलें, तो उनके लिए कोई भोर नहीं है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘व्यवस्था’। हिब्रू शब्द तोराह का अर्थ ‘शिक्षा’ भी हो सकता है और ‘व्यवस्था’ भी।
    reason: lexical_alternative
  - marker: b
    text: 'हिब्रू का अंतिम वाक्यांश बहुत संक्षिप्त है और इसका अनुवाद इस प्रकार भी किया जा सकता है: ‘यदि वे इस संदेश के अनुसार न कहें—जिसके लिए कोई भोर नहीं है।’ इसके संबंध और आशय को एक से अधिक प्रकार से समझा गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: לְתוֹרָה
  choice: शिक्षा की ओर
  rationale: תּוֹרָה का अर्थ व्यापक रूप से परमेश्वर की ‘शिक्षा’ और अधिक विशिष्ट रूप से ‘व्यवस्था’ हो सकता है। यहाँ ‘शिक्षा’ आधुनिक हिन्दी में स्वाभाविक है और अर्थ को केवल विधिक नियमों तक सीमित नहीं करती।
- source_word: וְלִתְעוּדָה
  choice: और गवाही की ओर
  rationale: תְּעוּדָה किसी प्रामाणिक गवाही या साक्ष्य को दर्शाता है। ‘गवाही’ सरल, प्रचलित और ‘शिक्षा’ के समानांतर उपयुक्त है।
- source_word: אִם לֹא יֹאמְרוּ
  choice: यदि वे ... न बोलें
  rationale: אִם לֹא को उसके सीधे शर्तसूचक अर्थ में रखा गया है। ‘बोलें’ प्रसंग में शिक्षा देने या मार्गदर्शन प्रस्तुत करने की व्यापक क्रिया को व्यक्त करता है।
- source_word: כַּדָּבָר הַזֶּה
  choice: इस वचन के अनुसार
  rationale: דָּבָר का अर्थ ‘वचन’, ‘बात’ या ‘संदेश’ हो सकता है। ‘वचन’ प्रामाणिक कथन का भाव बनाए रखता है और हिन्दी में सहज है।
- source_word: אֲשֶׁר אֵין לוֹ שָׁחַר
  choice: तो उनके लिए कोई भोर नहीं है
  rationale: שַׁחַר के ठोस बिंब ‘भोर’ को सुरक्षित रखा गया है। हिब्रू के एकवचन לוֹ को पहले आए सामूहिक बहुवचन कर्ता के संदर्भ में स्वाभाविक हिन्दी बहुवचन ‘उनके लिए’ से व्यक्त किया गया है।
theological_decisions:
- issue: अंतिम उपवाक्य का संबंध और आशय
  choice: जो लोग प्रकट की गई शिक्षा और गवाही के अनुसार नहीं बोलते, उनके लिए कोई भोर नहीं है।
  alternative: अंतिम शब्दों को अधिक शाब्दिक एकवचन में ‘जिसके लिए कोई भोर नहीं है’ पढ़ा जा सकता है; कुछ व्याख्याएँ इसे उस कथन की असत्यता से भी जोड़ती हैं।
  rationale: निकटवर्ती प्रसंग अवैध मार्गदर्शन की तुलना परमेश्वर द्वारा दी गई शिक्षा से करता है। मुख्य पाठ में चेतावनी को बोलने वालों से जोड़ना प्रसंगानुकूल है, पर हिब्रू की संक्षिप्त और अस्पष्ट रचना को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आरंभिक हिब्रू पदबंध की जानबूझकर संक्षिप्त पुकार को ‘की ओर!’ के रूप में बनाए रखा गया है; पाठ में निहित न होने के कारण ‘लौटो’ जैसी क्रिया नहीं जोड़ी गई।
