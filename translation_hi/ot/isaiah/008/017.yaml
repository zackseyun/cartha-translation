base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/017.yaml
  text: And I will wait for Yahweh[a], who hides his face from the house of Jacob[b], and I will hope in him.
translation:
  language: hi
  text: और मैं याहवे की प्रतीक्षा करूँगा, जो याकूब के घराने[b] से अपना मुख छिपा रहा है[a]; मैं उस पर आशा रखूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जो अपना मुख छिपाता है’ अथवा ‘जिसने अपना मुख छिपा लिया है।’ इब्रानी कृदन्त को निरंतर या विशेषतासूचक क्रिया के अर्थ में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘याकूब का घर’; यह याकूब के वंशजों, अर्थात् इस्राएल, के लिए सामूहिक पदनाम है।
    reason: cultural_note
lexical_decisions:
- source_word: וְחִכִּיתִי
  choice: और मैं ... प्रतीक्षा करूँगा
  rationale: חכה अपेक्षापूर्ण प्रतीक्षा को व्यक्त करता है। ‘प्रतीक्षा करूँगा’ आधुनिक मानक हिन्दी में स्वाभाविक है और क्रिया में ‘धीरज से’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: לַיהוָה
  choice: याहवे की
  rationale: ל उस व्यक्ति को सूचित करता है जिसकी प्रतीक्षा की जा रही है। יְהוָה को वाचा-संबंधी व्यक्तिगत नाम के रूप में ‘याहवे’ लिप्यंतरित किया गया है। हिन्दी मुहावरे के अनुसार ‘प्रतीक्षा’ के साथ संबंधकारक ‘की’ प्रयुक्त है।
- source_word: הַמַּסְתִּיר פָּנָיו
  choice: जो ... अपना मुख छिपा रहा है
  rationale: सक्रिय कृदन्त चल रही अथवा विशिष्ट/नियमित क्रिया व्यक्त कर सकता है। ‘अपना मुख छिपा रहा है’ उसके प्रगतिशील बल और मूल इब्रानी रूपक, दोनों को बनाए रखता है।
- source_word: מִבֵּית יַעֲקֹב
  choice: याकूब के घराने से
  rationale: ‘घराना’ यहाँ वंशजों के सामूहिक समुदाय को व्यक्त करता है और ‘याकूब के घर’ की बाइबलीय-सांस्कृतिक धारणा को सहज हिन्दी में बनाए रखता है।
- source_word: וְקִוֵּיתִי
  choice: मैं ... आशा रखूँगा
  rationale: קוה में प्रतीक्षा और आशापूर्ण भरोसे का अर्थक्षेत्र है। पहली क्रिया से काव्यात्मक समानता रखते हुए ‘आशा रखूँगा’ इसकी अपेक्षापूर्ण भरोसे की विशिष्ट छाया व्यक्त करता है।
- source_word: לוֹ
  choice: उसी पर
  rationale: पूर्वसर्ग का लक्ष्य याहवे है। ‘उसी पर आशा रखना’ हिन्दी में निर्देशित भरोसे को स्वाभाविक ढंग से व्यक्त करता है और बलसूचक ‘उसी’ संदर्भ को स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: परमेश्वर का अपना मुख छिपाना
  choice: मूल रूपक ‘अपना मुख छिपा रहा है’ बनाए रखा
  alternative: अपनी कृपा हटा रहा है; याकूब के घराने से मुँह मोड़ रहा है
  rationale: इब्रानी रूपक में वाचा-संबंधी और धर्मवैज्ञानिक तनाव निहित है। उसे कृपा हटाने जैसी व्याख्या से स्पष्ट करना अनुवाद से आगे बढ़ जाता; इसलिए रूपक को यथावत रखा गया है।
- issue: הַמַּסְתִּיר कृदन्त का कालगत बल
  choice: 'चल रही क्रिया: ‘छिपा रहा है’'
  alternative: 'विशिष्ट/नियमित क्रिया: ‘छिपाता है’; पूर्ण क्रिया: ‘छिपा लिया है’'
  rationale: कृदन्त संदर्भ में चल रही या चरित्रगत क्रिया दोनों बता सकता है। मुख्य पाठ में प्रगतिशील अर्थ चुना गया है, पर वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘प्रतीक्षा करूँगा’ और ‘आशा रखूँगा’ समानांतर क्रियाओं के अर्थगत अंतर को बनाए रखते हैं। पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं।
