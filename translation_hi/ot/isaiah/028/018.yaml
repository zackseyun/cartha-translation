  yaml_path: translation/ot/isaiah/028/018.yaml
  text: And your covenant with death will be annulled[a], and your agreement with Sheol will not stand; when the overwhelming scourge passes through[b], you will become a trampling place for it.
translation:
  language: hi
  text: 'और मृत्यु के साथ तुम्हारी वाचा रद्द कर दी जाएगी,[a]

    और शिओल[b] के साथ तुम्हारा समझौता कायम नहीं रहेगा।

    जब वह उमड़ता हुआ कोड़ा[c] गुज़रेगा,

    तब तुम उसके लिए रौंदे जाने की वस्तु बन जाओगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया का मूल अर्थ ‘ढाँपना’ या ‘प्रायश्चित करना’ भी हो सकता है; यहाँ वाचा के विधिक संदर्भ और समानांतर वाक्य के अनुसार अर्थ है कि वह निष्प्रभावी या निरस्त कर दी जाएगी।
    reason: lexical_alternative
  - marker: b
    text: शिओल मृतकों के लोक के लिए प्रयुक्त इब्रानी शब्द है; इसका अनुवाद ‘अधोलोक’ या ‘कब्र’ भी किया जाता है।
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी बिंब कोड़े की मार और उमड़ती बाढ़ जैसी बहा ले जाने वाली शक्ति को एक साथ जोड़ता है; अन्य अनुवाद: ‘बहा ले जाने वाला कोड़ा’।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻפַּר
  choice: रद्द कर दी जाएगी
  rationale: मूल का यह क्रियारूप सामान्यतः ढाँपने या प्रायश्चित करने से संबंधित हो सकता है, पर वाचा के इस विधिक और व्यंग्यपूर्ण संदर्भ में अर्थ उसका निष्प्रभावी या निरस्त किया जाना है।
- source_word: בְּרִיתְכֶם אֶת־מָוֶת
  choice: मृत्यु के साथ बाँधी गई तुम्हारी वाचा
  rationale: ‘वाचा’ औपचारिक संबंध का भाव बनाए रखती है, जबकि ‘मृत्यु के साथ’ मूल में मृत्यु के मानवीकरण को सुरक्षित रखता है। ‘बाँधी गई’ हिन्दी में वाचा के संबंध को स्वाभाविक बनाता है।
- source_word: חָזוּתְכֶם אֶת־שְׁאוֹל
  choice: शिओल के साथ किया गया तुम्हारा समझौता
  rationale: חָזוּת यहाँ समानांतर रचना के कारण ‘दर्शन’ नहीं, बल्कि समझौता या संधि दर्शाता है। शिओल का लिप्यंतरण उसके व्यापक इब्रानी वैचारिक अर्थ को केवल ‘कब्र’ तक सीमित नहीं करता।
- source_word: לֹא תָקוּם
  choice: कायम नहीं रहेगा
  rationale: समझौते के संदर्भ में קום का आशय प्रभावी या स्थिर बने रहने से है; यह हिन्दी अभिव्यक्ति उसी अर्थ को सहजता से देती है।
- source_word: שׁוֹט שׁוֹטֵף
  choice: बहा ले जाने वाला कोड़ा
  rationale: यह पद कोड़े की मार और बाढ़ जैसी बहा ले जाने वाली शक्ति—दोनों बिंबों को जोड़ता है। हिन्दी में यह असामान्य पर जानबूझकर संयुक्त रूपक को बनाए रखता है।
- source_word: כִּי יַעֲבֹר
  choice: जब ... होकर गुज़रेगा
  rationale: עבר यहाँ विनाशकारी शक्ति के क्षेत्र के भीतर से गुज़रने को दर्शाता है; ‘होकर गुज़रेगा’ बचाकर निकल जाने का भाव पैदा नहीं करता।
- source_word: לְמִרְמָס
  choice: रौंदने की जगह
  rationale: यह संज्ञा रौंदे जाने या रौंदने के स्थल का ठोस बिंब देती है। ‘जगह’ मूल संज्ञात्मक रूपक को बनाए रखती है, यद्यपि हिन्दी में ‘रौंदे जाओगे’ अधिक सहज विकल्प है।
theological_decisions:
- issue: मृत्यु और शिओल का मानवीकरण
  choice: ‘मृत्यु’ और ‘शिओल’ को उन शक्तियों के रूप में रखा गया है जिनके साथ वाचा या समझौता किया गया है।
  alternative: ‘मृत्यु’ और ‘कब्र’ कहकर बिंब को अधिक सामान्य बनाना।
  rationale: मूल पाठ यहूदा की झूठी सुरक्षा का उपहास करने के लिए मृत्यु और शिओल को मानवीकृत करता है। इसे बनाए रखना कोई अतिरिक्त सिद्धान्त स्थापित किए बिना इब्रानी अलंकार को सुरक्षित रखता है।
- issue: שְׁאוֹל का अनुवाद
  choice: मुख्य पाठ में ‘शिओल’ का लिप्यंतरण।
  alternative: ‘अधोलोक’, ‘मृतलोक’ या ‘कब्र’।
  rationale: ‘कब्र’ अर्थ को संकुचित कर देती है; ‘शिओल’ मृत्यु के समानांतर मूल अवधारणा और उसकी व्याख्यात्मक व्यापकता बनाए रखता है। अर्थ पाठक के लिए पादटिप्पणी में स्पष्ट किया गया है।
- issue: כֻפַּר में प्रायश्चित-संबंधी संभाव्यता
  choice: वाचा के निरस्त होने का प्रसंगगत अर्थ मुख्य पाठ में दिया गया है।
  alternative: ‘ढाँप दी जाएगी’ या ‘उसका प्रायश्चित होगा’।
  rationale: इस वाक्य में विधिक वाचा और अगले समानांतर खंड ‘कायम नहीं रहेगा’ से निरस्तीकरण का अर्थ समर्थित है। फिर भी धातु की व्यापक अर्थ-सीमा पादटिप्पणी में बताई गई है ताकि तनाव पूरी तरह छिपे नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘वाचा’ और ‘शिओल’ जैसे पाठ-विशिष्ट शब्दों को अर्थ की सटीकता के लिए रखा गया है, और ‘शिओल’ को पादटिप्पणी में समझाया गया है। काव्यात्मक समानांतरता बनाए रखने के लिए पाठ को चार पंक्तियों में प्रस्तुत किया गया है।
