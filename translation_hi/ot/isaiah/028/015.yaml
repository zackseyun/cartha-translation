  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י אֲמַרְתֶּ֗ם כָּרַ֤תְנֽוּ בְרִית֙ אֶת מָ֔וֶת וְ/עִם שְׁא֖וֹל עָשִׂ֣ינוּ חֹזֶ֑ה שיט שׁוֹטֵ֤ף כִּֽי עבר לֹ֣א יְבוֹאֵ֔/נוּ כִּ֣י שַׂ֧מְנוּ כָזָ֛ב מַחְסֵ֖/נוּ וּ/בַ/שֶּׁ֥קֶר נִסְתָּֽרְנוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/015.yaml
  text: Because you have said[a], “We have made a covenant with death, and with Sheol we have made an agreement. When the overwhelming scourge passes through, it will not come to us[c][b], because we have made falsehood our refuge and have hidden ourselves in deceit.”
translation:
  language: hi
  text: क्योंकि तुमने कहा है, “हमने मृत्यु के साथ वाचा बाँधी है और अधोलोक[b] के साथ समझौता किया है[a]। जब बाढ़ की तरह उमड़ता हुआ कोड़ा गुज़रेगा, तब वह हम तक नहीं पहुँचेगा, क्योंकि हमने झूठ को अपना शरणस्थान बनाया है और छल में अपने आपको छिपा लिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द कठिन है। इसका अर्थ “संधि” या “करार” भी हो सकता है; कुछ लोग इसे “दर्शन” मानते हैं, पर इस संदर्भ में यह संभवतः “वाचा” के समानांतर किसी समझौते को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “शिओल,” अर्थात मृतकों का लोक; इसे बाद की नरक संबंधी धारणाओं के बिल्कुल समान नहीं समझना चाहिए।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास के संदर्भ में आनेवाले न्याय का कारण बताता है और इब्रानी के कारणसूचक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּרַתְנוּ בְרִית
  choice: हमने ... वाचा बाँधी है
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘वाचा काटना’ है; ‘वाचा बाँधना’ स्वाभाविक हिन्दी मुहावरा है और वाचा का औपचारिक भाव बनाए रखता है।
- source_word: מָוֶת
  choice: मृत्यु
  rationale: मूल अर्थ को सीधे रखता है और मृत्यु को वाचा के सहभागी के रूप में प्रस्तुत करनेवाले मानवीकरण को सुरक्षित रखता है।
- source_word: שְׁאוֹל
  choice: अधोलोक
  rationale: यह मृतकों के लोक की प्राचीन इब्रानी धारणा को सामान्य हिन्दी में व्यक्त करता है, बिना इसे बाद की ‘नरक’ संबंधी धारणाओं के समान ठहराए।
- source_word: עָשִׂינוּ חֹזֶה
  choice: समझौता किया है
  rationale: संदर्भ में חֹזֶה का अर्थ समानांतर शब्द ‘वाचा’ के अनुरूप समझौता या संधि है; ‘समझौता’ पठनीय है और कठिन शब्द के संभावित ‘दर्शन’ अर्थ को अनावश्यक रूप से नहीं अपनाता।
- source_word: שיט שׁוֹטֵף
  choice: बाढ़-सा प्रचंड कोड़ा
  rationale: कठिन इब्रानी पदबंध में बहा ले जानेवाली बाढ़ और मारनेवाले कोड़े—दोनों की छवियाँ जुड़ी हैं; यह रूप दोनों को यथासंभव संक्षेप में बनाए रखता है।
- source_word: לֹא יְבוֹאֵנוּ
  choice: वह हम तक नहीं पहुँचेगा
  rationale: विनाशकारी शक्ति के उनके पास न पहुँचने के दावे को सहज हिन्दी में स्पष्ट करता है।
- source_word: כָזָב מַחְסֵנוּ
  choice: झूठ को अपना शरणस्थान
  rationale: अमूर्त संज्ञा और शरण की रूपकात्मक छवि दोनों को बनाए रखता है।
- source_word: וּבַשֶּׁקֶר נִסְתָּרְנוּ
  choice: छल में अपने आपको छिपा लिया है
  rationale: क्रिया के आत्मवाचक भाव और पहले अर्धवाक्य के समानांतर छल की धारणा को सुरक्षित रखता है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: अधोलोक
  alternative: शिओल; कब्र; मृतकों का लोक
  rationale: ‘अधोलोक’ आधुनिक हिन्दी पाठक के लिए समझने योग्य है और इसे सीधे ‘नरक’ कहकर बाद की धर्मवैज्ञानिक धारणा आरोपित नहीं करता; पादटिप्पणी इसकी सीमा स्पष्ट करती है।
- issue: मृत्यु और अधोलोक का मानवीकरण
  choice: उन्हें वाचा और समझौते के सहभागी के रूप में बनाए रखा गया है
  alternative: इसे केवल मृत्यु से बचने के दावे के रूप में स्पष्ट कर देना
  rationale: मूल की व्यंग्यपूर्ण और तनावपूर्ण अलंकारिक भाषा को समझाकर समाप्त करने के बजाय ज्यों का त्यों रखा गया है।
- issue: שיט שׁוֹטֵף की मिश्रित छवि
  choice: बाढ़-सा प्रचंड कोड़ा
  alternative: उमड़ता हुआ कोड़ा; बहा ले जानेवाली विपत्ति
  rationale: पाठ की कठिनाई को पूरी तरह एक ही रूपक में हल नहीं किया गया; बाढ़ और कोड़े दोनों की छवियाँ रखी गई हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वाचा बाँधना,’ ‘शरणस्थान’ और ‘अधोलोक’ जैसे शब्द बाइबलीय गंभीरता बनाए रखते हैं, जबकि पादटिप्पणियाँ कठिन इब्रानी पदों की वास्तविक अनिश्चितता स्पष्ट करती हैं।
