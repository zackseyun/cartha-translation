source:
  edition: WLC
  text: כִּ֚י בְּ/לַעֲגֵ֣י שָׂפָ֔ה וּ/בְ/לָשׁ֖וֹן אַחֶ֑רֶת יְדַבֵּ֖ר אֶל הָ/עָ֥ם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/011.yaml
  text: For with mocking lips and with another tongue he will speak to this people[b][a],
translation:
  language: hi
  text: क्योंकि वह उपहास भरे होंठों से[a] और दूसरी भाषा में[b] इस प्रजा से बात करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हकलाते होंठों से”; कुछ अनुवाद इस वाक्यांश को उपहास के बजाय ऐसी वाणी मानते हैं जिसे समझना कठिन है।
    reason: lexical_alternative
  - marker: b
    text: “दूसरी भाषा” से आशय विदेशी भाषा है; सम्भवतः यह बताता है कि परमेश्वर विदेशी आक्रमणकारियों के द्वारा न्याय की बात इस प्रजा तक पहुँचाएगा।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है और प्रसंग का तार्किक संबंध बनाए रखता है।
- source_word: בְּלַעֲגֵי שָׂפָה
  choice: उपहास भरे होंठों से
  rationale: לַעַג का सामान्य अर्थ उपहास, तिरस्कार या ठट्ठा है। यह अनुवाद मूल के 'होंठ' रूपक को रखते हुए स्वाभाविक हिन्दी देता है; अस्पष्ट या हकलाती वाणी की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: וּבְלָשׁוֹן אַחֶרֶת
  choice: और दूसरी भाषा में
  rationale: לָשׁוֹן का शाब्दिक अर्थ 'जीभ' और विस्तारित अर्थ 'भाषा' हो सकता है। यहाँ 'दूसरी भाषा' आधुनिक हिन्दी में स्वाभाविक रूप से विदेशी बोली का भाव व्यक्त करती है।
- source_word: יְדַבֵּר
  choice: वह ... बात करेगा
  rationale: अपूर्ण क्रिया को इस भविष्यसूचक प्रसंग में भविष्यकाल में लिया गया है। इब्रानी में कर्ता निहित है; 'वह' उसे बिना अनावश्यक रूप से पहचान निर्धारित किए बनाए रखता है।
- source_word: אֶל הָעָם הַזֶּה
  choice: इस प्रजा से
  rationale: עָם के लिए 'प्रजा' भविष्यवाणी-संबंधी गरिमा और सामूहिक अर्थ को बनाए रखता है, जबकि संकेतवाचक 'इस' स्पष्ट रहता है। हिन्दी में 'बात करना' के साथ 'से' स्वाभाविक है।
theological_decisions:
- issue: उपहासपूर्ण अथवा अस्पष्ट वाणी का अर्थ
  choice: मुख्य पाठ में 'उपहास भरे होंठों' को रखा गया है।
  alternative: '''हकलाते होंठों'' या ''अस्पष्ट वाणी'' के अर्थ में लेना।'
  rationale: לַעַג अधिक सीधे उपहास या तिरस्कार की ओर संकेत करता है, पर वाणी के अपरिचित या अस्पष्ट सुनाई देने का अर्थ पूरी तरह समाप्त नहीं किया गया; उसे पादटिप्पणी में रखा गया है।
- issue: दूसरी भाषा के माध्यम से बोलने वाला
  choice: कर्ता को केवल 'वह' रखा गया है और विदेशी भाषा के न्याय-संबंधी प्रसंग को पादटिप्पणी में बताया गया है।
  alternative: मुख्य पाठ में स्पष्ट करना कि परमेश्वर विदेशी आक्रमणकारियों के द्वारा बोलेगा।
  rationale: इब्रानी पद स्वयं न तो कर्ता का नाम लेता है, न माध्यम को स्पष्ट करता है। व्यापक प्रसंग उस व्याख्या का समर्थन करता है, पर उसे मुख्य पाठ में जोड़ना मूल की अंतर्निहित अस्पष्टता को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। 'उपहास भरे होंठ' मूल रूपक को सुरक्षित रखता है, जबकि 'दूसरी भाषा' हिन्दी पाठक के लिए 'दूसरी जीभ' से अधिक स्वाभाविक है।
