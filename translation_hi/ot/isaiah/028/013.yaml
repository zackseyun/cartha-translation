base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/013.yaml
  text: So the word of Yahweh will be to them[a], “Order on order, order on order, line on line, line on line, a little here, a little there,” so that they may go, and stumble backward, and be broken, and snared, and captured.
translation:
  language: hi
  text: 'इसलिए याहवे का वचन उनके लिए ऐसा होगा: “आज्ञा पर आज्ञा, आज्ञा पर आज्ञा; रेखा पर रेखा, रेखा पर रेखा; थोड़ा यहाँ, थोड़ा वहाँ,”[a] ताकि वे जाएँ, पीछे की ओर ठोकर खाएँ, टूट जाएँ, फंदे में फँसें और पकड़ लिए जाएँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “आदेश पर आदेश, आदेश पर आदेश” भी हो सकता है; परंपरागत रूप से, “उपदेश पर उपदेश, उपदेश पर उपदेश।” इब्रानी बहुत संक्षिप्त है और संभवतः उपहासपूर्ण या बच्चों जैसी पुनरुक्ति की नकल करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: इसलिए ... ऐसा होगा
  rationale: यहाँ वाव + हाया पिछले प्रसंग से निकलने वाले परिणाम को व्यक्त करता है। ‘इसलिए ... ऐसा होगा’ आधुनिक हिन्दी में उस परिणामसूचक संबंध को स्वाभाविक ढंग से रखता है।
- source_word: דְּבַר יְהוָה
  choice: याहवे का वचन
  rationale: דָּבָר के ‘वचन/संदेश’ अर्थों में से ‘वचन’ भविष्यद्वाणी की परिचित अभिव्यक्ति को बनाए रखता है; יְהוָה को उसके व्यक्तिगत नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: צַו לָצָו צַו לָצָו
  choice: आज्ञा पर आज्ञा, आज्ञा पर आज्ञा
  rationale: यह कठिन, अत्यंत संक्षिप्त पदबंध संभवतः उपहासपूर्ण या बच्चों जैसी दोहराव-भरी बोली की नकल करता है। ‘आज्ञा’ צוה से जुड़े आदेश के अर्थ को और पुनरुक्ति की कटी-फटी लय को सुरक्षित रखता है।
- source_word: קַו לָקָו קַו לָקָו
  choice: रेखा पर रेखा, रेखा पर रेखा
  rationale: קַו सामान्यतः रेखा या नापने की डोरी है। ‘रेखा पर रेखा’ मूल की संक्षिप्त पुनरावृत्ति और शब्द-लय को बनाए रखता है।
- source_word: זְעֵיר שָׁם זְעֵיר שָׁם
  choice: थोड़ा यहाँ, थोड़ा वहाँ
  rationale: זְעֵיר का अर्थ ‘थोड़ा’ है। दोहराव वाले इस विन्यास में हिन्दी की वितरणसूचक अभिव्यक्ति ‘थोड़ा यहाँ, थोड़ा वहाँ’ स्वाभाविक है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: לְמַעַן उद्देश्य अथवा परिणाम प्रस्तुत करता है। ‘ताकि’ दोनों के बीच मूल पाठ में उपस्थित तनाव को खुला रखता है।
- source_word: וְכָשְׁלוּ אָחוֹר
  choice: पीछे की ओर ठोकर खाएँ
  rationale: כשל ठोकर खाने या लड़खड़ाने को और אָחוֹר पीछे की दिशा को व्यक्त करता है; अनुवाद दोनों बिंबों को स्पष्ट रखता है।
- source_word: וְנִשְׁבָּרוּ
  choice: तोड़े जाएँ
  rationale: שבר के निफ़अल रूप का निष्क्रिय भाव सुरक्षित रखा गया है और मूल से अधिक तीव्र ‘चकनाचूर’ जैसा शब्द नहीं जोड़ा गया।
- source_word: וְנוֹקְשׁוּ וְנִלְכָּדוּ
  choice: फंदे में फँसें और पकड़ लिए जाएँ
  rationale: पहला क्रियापद फंदे में फँसने और दूसरा पकड़े जाने का अर्थ देता है; अलग-अलग हिन्दी क्रियाएँ क्रमिक तीव्रता को बनाए रखती हैं।
theological_decisions:
- issue: अंतिम उपवाक्य में न्याय का उद्देश्य अथवा परिणाम
  choice: ‘ताकि’ के द्वारा वचन और उनके पतन के बीच न्यायसूचक संबंध रखा गया है।
  alternative: इसे केवल इस वर्णन के रूप में समझा जा सकता है कि वे भविष्यद्वाणी के वचन को उपहासपूर्ण ढंग से कैसे सुनते हैं।
  rationale: निकट प्रसंग और לְמַעַן के बाद आने वाली क्रियाएँ तटस्थ वर्णन से अधिक प्रबल न्यायसूचक संबंध दिखाती हैं। फिर भी ‘ताकि’ उद्देश्य और परिणाम के बीच की वास्तविक अस्पष्टता को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। उद्धरण की जानबूझकर कटी-फटी, दोहराव-भरी लय को सहज गद्य में समतल नहीं किया गया। ‘याहवे’ व्यक्तिगत दिव्य नाम का सीधा देवनागरी लिप्यंतरण है।
