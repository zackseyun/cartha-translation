id: ISA.28.12
reference: Isaiah 28:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲשֶׁ֣ר אָמַ֣ר אֲלֵי/הֶ֗ם זֹ֤את הַ/מְּנוּחָה֙ הָנִ֣יחוּ לֶֽ/עָיֵ֔ף וְ/זֹ֖את הַ/מַּרְגֵּעָ֑ה וְ/לֹ֥א אָב֖וּא שְׁמֽוֹעַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/012.yaml
  text: to whom he said, “This is rest; give rest to the weary, and this is repose,” yet they were not willing to hear.
translation:
  language: hi
  text: जिनसे उसने कहा था, “यह विश्राम है—थके हुए को विश्राम दो; और यह चैन है।” फिर भी उन्होंने सुनना नहीं चाहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְּנוּחָה
  choice: विश्राम
  rationale: यह शब्द विश्राम अथवा विश्राम-स्थान का भाव देता है; संदर्भ में स्वाभाविक और प्रतिष्ठित हिंदी के लिए ‘विश्राम’ उपयुक्त है।
- source_word: הָנִיחוּ
  choice: विश्राम दो
  rationale: 'हिफ़ील आज्ञार्थक बहुवचन का प्रेरणार्थक अर्थ बनाए रखता है: थके हुए व्यक्ति को विश्राम पाने देना या देना।'
- source_word: לֶעָיֵף
  choice: थके हुए को
  rationale: पूर्वसर्ग ל और विशेषण/संज्ञात्मक रूप עָיֵף का सीधा अर्थ है ‘थके हुए को’; संख्या की अस्पष्टता हिंदी में भी बनी रहती है।
- source_word: הַמַּרְגֵּעָה
  choice: चैन
  rationale: यह दुर्लभ संज्ञा राहत, शांति या चैन का संकेत देती है; ‘चैन’ पहले प्रयुक्त ‘विश्राम’ से अर्थगत निकटता रखते हुए शब्द-भेद भी बचाता है।
- source_word: וְלֹא אָבוּא שְׁמוֹעַ
  choice: फिर भी उन्होंने सुनना नहीं चाहा
  rationale: אָבָה इच्छा या सहमति व्यक्त करता है; नकार सहित अर्थ ‘वे सुनने को राज़ी/इच्छुक न हुए’ है। हिंदी में ‘नहीं चाहा’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: वक्ता की पहचान
  choice: उसने
  alternative: याहवे ने
  rationale: इस पद में कर्ता सर्वनाम पूर्वसंदर्भ से समझा जाता है; स्रोत में दिव्य नाम को स्पष्ट रूप से जोड़ना इस पद के पाठ से अधिक व्याख्यात्मक होगा।
- issue: विश्राम देने की आज्ञा बनाम थके हुए को स्वयं विश्राम करने देना
  choice: थके हुए को विश्राम दो
  alternative: थके हुए को विश्राम करने दो
  rationale: हिब्रू प्रेरणार्थक दोनों छायाएँ सह सकता है। ‘विश्राम दो’ अंग्रेज़ी परामर्श-पाठ और मूल के सक्रिय प्रेरणार्थक बल के अनुरूप है, बिना यह निर्धारित किए कि विश्राम किस धार्मिक व्यवस्था द्वारा दिया जाता है।
- issue: अंतिम खंड का संबंध
  choice: फिर भी
  alternative: और
  rationale: हिब्रू וְ सामान्य संयोजक है, पर यहाँ प्रस्तावित विश्राम और सुनने से इनकार के बीच स्पष्ट विरोध है; ‘फिर भी’ उस विमर्शगत संबंध को स्वाभाविक हिंदी में व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण शैली। समानांतर काव्यात्मक संरचना ‘विश्राम यही है… और चैन यही है’ द्वारा रखी गई है; अनावश्यक धार्मिक पारिभाषिक शब्दावली से बचा गया है।
