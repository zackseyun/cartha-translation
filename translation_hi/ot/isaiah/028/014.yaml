id: ISA.28.14
reference: Isaiah 28:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵ֛ן שִׁמְע֥וּ דְבַר יְהוָ֖ה אַנְשֵׁ֣י לָצ֑וֹן מֹֽשְׁלֵי֙ הָ/עָ֣ם הַ/זֶּ֔ה אֲשֶׁ֖ר בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/014.yaml
  text: Therefore hear the word of Yahweh[a], you scoffing men, rulers of this people who are in Jerusalem.
translation:
  language: hi
  text: इसलिए हे ठट्ठा करनेवाले पुरुषो, जो यरूशलेम में इस प्रजा पर शासन करते हो, यहोवा का वचन सुनो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले कथन से निष्कर्ष निकालनेवाला संयोजक है और भविष्यद्वाणी के तर्क-प्रवाह को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक रूप है। ‘सुनो’ श्रवण और ध्यान देने—दोनों की सम्भावना रखता है, पर इसे स्पष्टतः ‘मानो’ बनाकर अर्थ को सीमित नहीं करता।
- source_word: דְבַר יְהוָה
  choice: यहोवा का वचन
  rationale: स्थापित भविष्यद्वाणी-सूत्र को बनाए रखता है; ‘वचन’ मूल की औपचारिक और प्रकाशन-संबंधी छटा को ‘संदेश’ से अधिक निकटता से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत वाचा-नाम का प्रचलित लिप्यंतरण; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אַנְשֵׁי לָצוֹן
  choice: ठट्ठा करनेवाले पुरुषो
  rationale: शाब्दिक संरचना ‘ठट्ठे के पुरुष’ हिन्दी में अस्वाभाविक है। यह रूप उपहास करने के स्वभाव को स्पष्ट करते हुए पुरुषवाचक संबोधन को सुरक्षित रखता है।
- source_word: מֹשְׁלֵי הָעָם הַזֶּה
  choice: इस प्रजा पर शासन करते हो
  rationale: इब्रानी कृदन्तीय संरचना को स्वाभाविक संबोधन-खंड में व्यक्त करता है और इन पुरुषों की शासकीय भूमिका स्पष्ट रखता है।
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: जो यरूशलेम में
  rationale: सम्बन्धवाचक उपवाक्य को शासकों से जोड़ता है और उनके स्थान को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे उपस्थित है। हिन्दी पाठकों के लिए परिचित ‘यहोवा’ उसका नामरूप बनाए रखता है; ‘प्रभु’ नाम को उपाधि में बदल देता।
- issue: אַנְשֵׁי में पुरुषवाचक संबोधन
  choice: पुरुषो
  alternative: ठट्ठा करनेवालो
  rationale: संदर्भ यरूशलेम के विशिष्ट पुरुष शासकों को संबोधित करता है, इसलिए मूल का पुरुषवाचक संकेत सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और सार्वजनिक वाचन के योग्य रखी गई है। हिन्दी वाक्य-प्रवाह के लिए संबोधन पहले और ‘यहोवा का वचन सुनो’ अंत में रखा गया है; इससे मूल अर्थ या बल नहीं बदलता।
