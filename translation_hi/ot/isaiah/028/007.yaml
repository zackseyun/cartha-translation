source:
  edition: WLC
  text: וְ/גַם אֵ֨לֶּה֙ בַּ/יַּ֣יִן שָׁג֔וּ וּ/בַ/שֵּׁכָ֖ר תָּע֑וּ כֹּהֵ֣ן וְ/נָבִיא֩ שָׁג֨וּ בַ/שֵּׁכָ֜ר נִבְלְע֣וּ מִן הַ/יַּ֗יִן תָּעוּ֙ מִן הַ/שֵּׁכָ֔ר שָׁגוּ֙ בָּֽ/רֹאֶ֔ה פָּק֖וּ פְּלִילִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/007.yaml
  text: 'And even these reel with wine and stagger from strong drink: priest and prophet reel with strong drink[a], they are swallowed up by wine, they stagger from strong drink; they reel in vision[b], they totter in judgment.'
translation:
  language: hi
  text: 'और ये भी दाखमधु पीकर लड़खड़ाते हैं और मदिरा से डगमगाते हैं: याजक और नबी मदिरा से लड़खड़ाते हैं; वे दाखमधु में डूब गए हैं, वे मदिरा से डगमगाते हैं। वे दर्शन में लड़खड़ाते हैं[a] और न्याय में ठोकर खाते हैं[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दर्शन में चूकते हैं” अथवा “देखने में लड़खड़ाते हैं”; इब्रानी शब्द सामान्य देखने या भविष्यदर्शी दर्शन, दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “निर्णय में डगमगाते हैं” अथवा “न्यायिक निर्णय देने में ठोकर खाते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֵלֶּה
  choice: और ये भी
  rationale: וְגַם का संयोजक और बलात्मक अर्थ बनाए रखते हुए यह पिछले प्रसंग से स्वाभाविक संबंध जोड़ता है।
- source_word: בַּיַּיִן
  choice: दाखमधु पीकर
  rationale: यहाँ ב नशे के साधन या कारण को सूचित करता है; आधुनिक हिन्दी में ‘पीकर’ कारण और दृश्य दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׁגוּ
  choice: लड़खड़ाते हैं / चूकते हैं
  rationale: क्रिया में भटकने या गलती करने का भाव है। नशे के वर्णन में ‘लड़खड़ाते’ और दर्शन के प्रसंग में ‘चूकते’ उसके शारीरिक तथा कार्यगत दोनों आयाम व्यक्त करते हैं।
- source_word: שֵׁכָר
  choice: मदिरा
  rationale: यह दाखमधु से अलग किसी मादक पेय का व्यापक संकेत है। ‘मदिरा’ dignified और सामान्य हिन्दी में इस भेद को पर्याप्त रूप से व्यक्त करती है।
- source_word: תָּעוּ
  choice: डगमगाते हैं
  rationale: मूल क्रिया भटकने का अर्थ भी दे सकती है, पर नशे के तात्कालिक संदर्भ में शारीरिक अस्थिरता प्रमुख है।
- source_word: כֹּהֵן וְנָבִיא
  choice: याजक और नबी
  rationale: एकवचन संज्ञाएँ यहाँ प्रतिनिधिक या सामूहिक अर्थ रखती हैं; हिन्दी में बिना अनावश्यक व्याख्या के यही रूप स्वाभाविक है।
- source_word: נִבְלְעוּ מִן הַיַּיִן
  choice: वे दाखमधु के वश में हो गए हैं
  rationale: शाब्दिक बिंब ‘निगल लिए गए’ का आशय पूरी तरह अभिभूत या परास्त होना है। ‘वश में हो गए’ आधुनिक हिन्दी में अर्थ स्पष्ट रखता है, यद्यपि मूल बिंब को कुछ नरम करता है।
- source_word: בָּרֹאֶה
  choice: दर्शन में
  rationale: רֹאֶה देखने या दर्शनीय/भविष्यदर्शी अनुभूति की ओर संकेत कर सकता है। याजक और नबी के संदर्भ में ‘दर्शन’ उपयुक्त है, जबकि पादटिप्पणी अस्पष्टता बनाए रखती है।
- source_word: פָּקוּ פְּלִילִיָּה
  choice: न्याय करने में ठोकर खाते हैं
  rationale: פָּקוּ अस्थिर होने या ठोकर खाने का और פְּלִילִיָּה न्यायिक निर्णय का बोध देता है। यह अनुवाद शारीरिक रूपक तथा नेतृत्वगत विफलता दोनों को रखता है।
theological_decisions:
- issue: क्या अंतिम दो खंडों को स्पष्ट रूप से भविष्यदर्शी दर्शन और न्यायिक निर्णय से जोड़ा जाए
  choice: मुख्य पाठ में ‘दर्शन में चूकते हैं’ और ‘न्याय करने में ठोकर खाते हैं’
  alternative: ‘देखने में लड़खड़ाते हैं’ और ‘निर्णय में डगमगाते हैं’
  rationale: संदर्भ धार्मिक अगुओं की नशे के कारण अपने उत्तरदायित्वों में विफलता दिखाता है। मुख्य पाठ अर्थ को सुबोध बनाता है, पर पादटिप्पणियाँ मूल की संक्षिप्तता और lexical ambiguity को सुरक्षित रखती हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर अपनाया गया है। ‘दाखमधु’ और ‘मदिरा’ से יין तथा שׁכר का भेद रखा गया है। समानांतर क्रियाओं में ‘लड़खड़ाना’, ‘डगमगाना’, ‘चूकना’ और ‘ठोकर खाना’ प्रयोग करके मूल की पुनरावृत्ति और अर्थगत गति दोनों व्यक्त की गई हैं।
