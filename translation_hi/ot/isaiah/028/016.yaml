id: ISA.28.16
reference: Isaiah 28:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֛י יִסַּ֥ד בְּ/צִיּ֖וֹן אָ֑בֶן אֶ֣בֶן בֹּ֜חַן פִּנַּ֤ת יִקְרַת֙ מוּסָ֣ד מוּסָּ֔ד הַֽ/מַּאֲמִ֖ין לֹ֥א יָחִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/016.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am laying in Zion a stone, a tested stone, a precious cornerstone, a sure foundation[c][b]; the one who believes will not be in haste.'
translation:
  language: hi
  text: 'इसलिए प्रभु यहोवा यों कहते हैं: “देखो, मैं सिय्योन में एक पत्थर रख रहा हूँ—एक परखा हुआ पत्थर, कोने का बहुमूल्य पत्थर, एक दृढ़ नींव[c]। जो विश्वास करता है[a], वह उतावली नहीं करेगा[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो भरोसा रखता है।” इब्रानी शब्द में विश्वास करने और भरोसा रखकर निर्भर होने—दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “जल्दबाजी नहीं करेगा”; कुछ लोग इसका भाव “घबराएगा नहीं” समझते हैं।
    reason: lexical_alternative
  - marker: c
    text: इस “पत्थर” को बाद में रोमियों 9:33 और 1 पतरस 2:6 में मसीह पर लागू किया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: उपाधि और परमेश्वर के व्यक्तिगत नाम—दोनों को अलग और स्वाभाविक हिन्दी रूप में बनाए रखा गया है।
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: यह रूप वक्ता की घोषणा पर जोर देता है; ‘देखो’ आधुनिक हिन्दी में उसका गंभीर संकेतात्मक बल बनाए रखता है।
- source_word: יִסַּד
  choice: रख रहा हूँ
  rationale: पत्थर और नींव के स्थापत्य बिंब के साथ यह स्वाभाविक है और घोषणा की वर्तमान/आसन्न क्रियात्मकता व्यक्त करता है।
- source_word: אֶבֶן אֶבֶן בֹּחַן
  choice: एक पत्थर—एक परखा हुआ पत्थर
  rationale: मूल की पुनरुक्ति को जोर देने के लिए बनाए रखा गया है; בֹּחַן के लिए ‘परखा हुआ’ परीक्षण और प्रमाणित विश्वसनीयता दोनों का संकेत देता है।
- source_word: פִּנַּת יִקְרַת
  choice: कोने का बहुमूल्य पत्थर
  rationale: निर्माण-संबंधी अर्थ और पत्थर के मूल्य/सम्मान, दोनों को स्पष्ट तथा सहज हिन्दी में रखा गया है।
- source_word: מוּסָד מוּסָּד
  choice: दृढ़ता से रखी हुई नींव
  rationale: सजातीय शब्द-युग्म का शाब्दिक दोहराव हिन्दी में अस्वाभाविक होता; यह रूप नींव के सुनिश्चित और मजबूती से स्थापित होने का तीव्र भाव व्यक्त करता है।
- source_word: הַמַּאֲמִין
  choice: जो उस पर भरोसा रखता है
  rationale: אמן का प्रसंगगत भाव भरोसे और निर्भरता का है। ‘उस पर’ पत्थर/नींव की ओर स्वाभाविक संकेत करता है, यद्यपि इब्रानी में कर्म प्रत्यक्ष रूप से नहीं दिया गया।
- source_word: לֹא יָחִישׁ
  choice: वह उतावली नहीं करेगा
  rationale: क्रिया के जल्दी करने या जल्दबाजी में कदम उठाने के मूल अर्थ को बिना ‘घबराना’ जैसी अधिक व्याख्यात्मक संकीर्णता के व्यक्त करता है।
theological_decisions:
- issue: नींव के पत्थर की मसीही पहचान
  choice: मुख्य पाठ में स्थापत्य रूपक को ही रखा गया है।
  alternative: पत्थर को अनुवाद में सीधे मसीह कहना।
  rationale: इब्रानी पाठ सिय्योन में यहोवा द्वारा रखे जाने वाले नींव के पत्थर का बिंब देता है; रोमियों 9:33 और 1 पतरस 2:6 में इसका मसीही प्रयोग है, पर वह पहचान मुख्य अनुवाद में जोड़ी नहीं गई।
- issue: הַמַּאֲמִין का विश्वास/भरोसा संबंधी अर्थ
  choice: जो उस पर भरोसा रखता है
  alternative: जो विश्वास करता है
  rationale: मूल धातु विश्वास करने के साथ भरोसेमंद निर्भरता का भाव भी रखती है। इस प्रसंग में ‘भरोसा रखता है’ और उतावली न करने के बीच संबंध अधिक सहज है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: לֹא יָחִישׁ का परिणाम
  choice: उतावली नहीं करेगा
  alternative: घबराएगा नहीं
  rationale: ‘घबराएगा नहीं’ संभावित प्रसंगगत अर्थ है, पर मूल क्रिया का प्राथमिक भाव जल्दी/उतावली करना है; इसलिए अधिक विशिष्ट भाव को मुख्य पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर, सार्वजनिक-पाठ योग्य स्तर अपनाया गया है। ‘यों कहते हैं,’ ‘सिय्योन,’ और ‘यहोवा’ बाइबलीय गरिमा बनाए रखते हैं, जबकि वाक्यरचना और शब्दावली साधारण आधुनिक पाठक के लिए सुबोध हैं।
