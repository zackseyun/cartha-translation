source:
  edition: WLC
  text: וְ/עַתָּה֙ אַל תִּתְלוֹצָ֔צוּ פֶּֽן יֶחְזְק֖וּ מֽוֹסְרֵי/כֶ֑ם כִּֽי כָלָ֨ה וְ/נֶחֱרָצָ֜ה שָׁמַ֗עְתִּי מֵ/אֵ֨ת אֲדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת עַל כָּל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/022.yaml
  text: So now[a], do not scoff, lest your bonds be made stronger[b]; for I have heard from the Lord GOD of Armies a complete destruction decreed against the whole land.
translation:
  language: hi
  text: इसलिए अब ठट्ठा मत करो, नहीं तो तुम्हारे बंधन और कस जाएँगे; क्योंकि मैंने सेनाओं[a] के प्रभु याहवे से सुना है कि सारी भूमि[b] पर पूर्ण विनाश ठहराया गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी צְבָאוֹת का शाब्दिक अर्थ “सेनाओं के” है; इसका अनुवाद “सैन्य-दलों के” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “सारी पृथ्वी पर।” इब्रानी शब्द का अर्थ “भूमि” या “पृथ्वी,” दोनों हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: वाव और ‘अब’ के संयुक्त बल को स्वाभाविक हिन्दी में व्यक्त करता है; यह पिछले सन्दर्भ से निष्कर्ष और वर्तमान चेतावनी—दोनों का संकेत देता है।
- source_word: תִּתְלוֹצָצוּ
  choice: ठट्ठा मत करो
  rationale: לוץ से निकला यह रूप घमण्डपूर्ण उपहास या तिरस्कार सूचित करता है। ‘ठट्ठा करना’ साधारण पाठक के लिए स्पष्ट और भविष्यद्वक्ताई फटकार के अनुकूल है।
- source_word: פֶּן
  choice: नहीं तो
  rationale: चेतावनी के अनचाहे परिणाम को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יֶחְזְקוּ מוֹסְרֵיכֶם
  choice: तुम्हारे बंधन और कस जाएँगे
  rationale: शाब्दिक अर्थ ‘तुम्हारे बंधन दृढ़ हो जाएँ’ है। बंधनों के सन्दर्भ में ‘कस जाना’ हिन्दी में स्वाभाविक है और न्याय के बंधन की ठोस उपमा बनाए रखता है।
- source_word: כָלָה וְנֶחֱרָצָה
  choice: पूर्ण विनाश का निर्णय हो चुका है
  rationale: כָלָה न्याय के सन्दर्भ में पूर्ण अंत या विनाश और נֶחֱרָצָה निश्चित किए गए निर्णय को सूचित करता है। यह अनुवाद दोनों भावों को संक्षेप में रखता है।
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: सेनाओं के प्रभु याहवे
  rationale: अֲדֹנָי को ‘प्रभु’, परमेश्वर के निज नाम יהוה को ‘याहवे’ और צְבָאוֹת को ‘सेनाओं’ के रूप में अलग-अलग सुरक्षित रखते हुए हिन्दी में एक सुबोध उपाधि बनती है।
- source_word: עַל כָּל הָאָרֶץ
  choice: सारी भूमि के विरुद्ध
  rationale: स्थानीय न्याय के सन्दर्भ में אֶרֶץ के लिए ‘भूमि’ उपयुक्त है; ‘पृथ्वी’ का व्यापक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: अֲדֹנָי יְהוִה में परमेश्वर के नाम और उपाधि का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: ‘याहवे’ इब्रानी निज नाम को स्पष्ट रखता है, जबकि ‘प्रभु’ אֲדֹנָי को व्यक्त करता है; इससे दोनों तत्व एक ही सामान्य उपाधि में विलीन नहीं होते।
- issue: הָאָרֶץ का भौगोलिक विस्तार
  choice: सारी भूमि
  alternative: सारी पृथ्वी
  rationale: यशायाह के निकटवर्ती सन्दर्भ में यह देश पर आने वाले न्याय को सूचित कर सकता है, पर इब्रानी शब्द विश्वव्यापी अर्थ भी रखता है; इसलिए व्यापक सम्भावना पादटिप्पणी में दी गई है।
- issue: מוֹסְרֵיכֶם की छवि
  choice: तुम्हारे बंधन
  alternative: तुम्हारी ताड़नाएँ
  rationale: ठोस ‘बंधन’ की छवि को बनाए रखा गया है और इसे केवल अनुशासन या ताड़ना मानकर धर्मवैचारिक अर्थ सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और जनसुलभ हिन्दी। ‘नहीं तो’ चेतावनी को सहज बनाता है; ‘बंधन और कस जाएँगे’ मूल की ठोस न्याय-संबंधी उपमा को स्वाभाविक हिन्दी में बनाए रखता है।
