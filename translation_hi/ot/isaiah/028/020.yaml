review_pass:
  verdict: revise
  source_fidelity: The causal כִּי, the paired imagery of an inadequate bed and covering, and the reflexive actions are all represented accurately. The draft appropriately conveys the implied insufficiency with ‘इतना…कि…नहीं जा सकता।’ However, ‘तनकर लेटना’ can suggest lying stiffly or erectly, rather than the Hebrew sense of stretching/spreading oneself out.
  naturalness: The verse is clear and suitably proverbial in modern standard Hindi. Replacing ‘तनकर’ with ‘फैलकर’ gives the first image its more natural and precise sense. ‘ओढ़ने का कपड़ा’ is a natural broad equivalent for the contextual sense of מַסֵּכָה without specifying a particular kind of blanket.
  terminology: ‘बिछौना’ is apt for מַצָּע. ‘ओढ़ने का कपड़ा’ preserves the contextual bedding-cover sense of מַסֵּכָה and avoids its unrelated ‘cast image’ sense. No theological terminology is involved.
  issues:
  - severity: low
    issue: ‘तनकर लेटा’ is not the closest idiomatic rendering of the reflexive verb.
    rationale: It may evoke lying rigidly rather than stretching or spreading oneself out. ‘फैलकर लेटा’ better matches הִשְׂתָּרֵעַ in this bedding image.
  revised_text: क्योंकि बिछौना इतना छोटा है कि उस पर फैलकर लेटा नहीं जा सकता, और ओढ़ने का कपड़ा इतना सँकरा है कि उसमें अपने को लपेटा नहीं जा सकता।
  revised_footnotes: []
