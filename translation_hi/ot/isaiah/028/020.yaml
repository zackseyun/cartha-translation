  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों समानांतर पदांशों में ‘इतना…कि…नहीं जा सकता’ की संरचना रखकर इब्रानी कहावत की लय और अपर्याप्तता का बिंब सुरक्षित किया गया है।
