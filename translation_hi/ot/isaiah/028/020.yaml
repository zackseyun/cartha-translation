source:
  edition: WLC
  text: כִּֽי קָצַ֥ר הַ/מַּצָּ֖ע מֵֽ/הִשְׂתָּרֵ֑עַ וְ/הַ/מַּסֵּכָ֥ה צָ֖רָה כְּ/הִתְכַּנֵּֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/020.yaml
  text: For the bed is too short to stretch oneself out on[a], and the covering too narrow to wrap oneself in.
translation:
  language: hi
  text: क्योंकि बिछौना इतना छोटा है कि उस पर फैलकर लेटा नहीं जा सकता, और ओढ़ने का कपड़ा इतना सँकरा है कि उसमें अपने को लपेटा नहीं जा सकता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ उसके संबंध को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: קָצַר הַמַּצָּע
  choice: बिछौना इतना छोटा है
  rationale: מַצָּע लेटने के लिए बिछाई गई वस्तु या शय्या है। ‘बिछौना’ सामान्य आधुनिक हिन्दी में उपयुक्त है, और ‘इतना छोटा’ आगे आने वाले परिणाम के साथ उसकी अपर्याप्तता व्यक्त करता है।
- source_word: מֵהִשְׂתָּרֵעַ
  choice: कि उस पर तनकर लेटा नहीं जा सकता
  rationale: हितपोलल रूप अपने को फैलाने या पसारने का भाव देता है। हिन्दी में ‘तनकर लेटना’ इस आत्मवाचक क्रिया और बिछौने की अपर्याप्त लंबाई को सहज रूप से व्यक्त करता है।
- source_word: וְהַמַּסֵּכָה
  choice: और ओढ़ना
  rationale: इस शय्या-संबंधी संदर्भ में מַסֵּכָה शरीर पर खींचे जाने वाले आवरण को दर्शाता है। ‘ओढ़ना’ न तो अनावश्यक रूप से किसी खास प्रकार के कंबल तक अर्थ सीमित करता है, न यहाँ अप्रासंगिक ‘ढली हुई मूर्ति’ वाला अर्थ लाता है।
- source_word: צָרָה
  choice: इतना सँकरा है
  rationale: विशेषण का मूल अर्थ ‘सँकरा’ है; परिणामवाचक रचना के साथ यह इच्छित उपयोग के लिए उसकी अपर्याप्तता स्पष्ट करता है।
- source_word: כְּהִתְכַּנֵּס
  choice: कि उसमें अपने को लपेटा नहीं जा सकता
  rationale: यह रूप आवरण को अपने चारों ओर समेटने का आत्मवाचक भाव रखता है। ‘अपने को लपेटना’ उस क्रिया को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions: []
