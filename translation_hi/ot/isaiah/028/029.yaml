  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: גַּם זֹ֕את מֵ/עִ֛ם יְהוָ֥ה צְבָא֖וֹת יָצָ֑אָה הִפְלִ֣יא עֵצָ֔ה הִגְדִּ֖יל תּוּשִׁיָּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/029.yaml
  text: This also has come from Yahweh of hosts[a]; he is wonderful in counsel and great in wisdom.
translation:
  language: hi
  text: यह भी सेनाओं के यहोवा की ओर से आया है; वह परामर्श में अद्भुत और बुद्धि में महान है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם זֹאת
  choice: यह भी
  rationale: यह पद पिछले कृषि-दृष्टांत से इस कथन को जोड़ता है; ‘यह भी’ उस संयोजक बल को सहज हिन्दी में बनाए रखता है।
- source_word: מֵעִם ... יָצָאָה
  choice: की ओर से आया है
  rationale: क्रिया और पूर्वसर्ग मिलकर स्रोत या उद्गम बताते हैं। पूर्ण क्रिया के पक्ष को ‘आया है’ द्वारा सुरक्षित रखा गया है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: ‘यहोवा’ वाचा के विशिष्ट नाम को प्रत्यक्ष रूप में रखता है, और ‘सेनाओं’ से צְבָאוֹת का सैन्य अथवा स्वर्गीय दलों का बिंब बना रहता है।
- source_word: הִפְלִיא עֵצָה
  choice: परामर्श में अद्भुत
  rationale: यह संक्षिप्त काव्यात्मक अभिव्यक्ति यहोवा के परामर्श की असाधारण उत्कृष्टता बताती है। हिन्दी में यह रूप स्वाभाविक है और क्रिया की प्रशंसात्मक शक्ति को व्यक्त करता है।
- source_word: הִגְדִּיל תּוּשִׁיָּה
  choice: सूझ-बूझ में महान
  rationale: תּוּשִׁיָּה केवल सामान्य ज्ञान नहीं, बल्कि ठोस, व्यावहारिक और प्रभावकारी बुद्धि को सूचित कर सकता है। ‘सूझ-बूझ’ उस व्यावहारिक अर्थ को सहज हिन्दी में व्यक्त करती है; वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है। हिन्दी में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को प्रयोग किया गया है, न कि उसे सामान्य उपाधि ‘प्रभु’ से प्रतिस्थापित किया गया।
- issue: दो अंतिम हिफ़ील क्रियाओं का अर्थ
  choice: वह परामर्श में अद्भुत और सूझ-बूझ में महान है
  alternative: उसने परामर्श को अद्भुत और सूझ-बूझ को महान किया है
  rationale: शाब्दिक सकर्मक रूप हिन्दी में अस्पष्ट और अस्वाभाविक हो सकता है। चुना हुआ रूप इस काव्यात्मक स्तुति का आशय व्यक्त करता है, पर यह भी मानता है कि हिब्रू क्रियाएँ सक्रिय रूप में ‘अद्भुत करना’ और ‘महान करना’ कहती हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। समानांतर काव्य-विन्यास ‘परामर्श में अद्भुत’ और ‘सूझ-बूझ में महान’ बनाए रखा गया है।
