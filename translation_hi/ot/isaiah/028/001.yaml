source:
  edition: WLC
  text: ה֗וֹי עֲטֶ֤רֶת גֵּאוּת֙ שִׁכֹּרֵ֣י אֶפְרַ֔יִם וְ/צִ֥יץ נֹבֵ֖ל צְבִ֣י תִפְאַרְתּ֑/וֹ אֲשֶׁ֛ר עַל רֹ֥אשׁ גֵּֽיא שְׁמָנִ֖ים הֲל֥וּמֵי יָֽיִן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/001.yaml
  text: Woe to the proud crown of the drunkards of Ephraim[a], and to the fading flower of his glorious beauty, which is on the head of the fertile valley[c][b], those overcome by wine.
translation:
  language: hi
  text: एप्रैम के उन मतवालों के घमंड के मुकुट पर धिक्कार, जो दाखमधु से पछाड़े हुए हैं; और उसकी गौरवमयी शोभा के उस मुरझाते फूल पर भी, जो उपजाऊ घाटी के शीर्ष पर है!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹי
  choice: हाय
  rationale: यह भविष्यद्वाणी में विलाप और न्याय की घोषणा दोनों का परिचय देता है; ‘हाय’ आधुनिक हिन्दी में इसकी गंभीर और निंदात्मक शक्ति बनाए रखता है।
- source_word: עֲטֶרֶת גֵּאוּת
  choice: घमंड का मुकुट
  rationale: इब्रानी संबंध-पदबंध को सीधे रखते हुए मुकुट/माला और अहंकार—दोनों अर्थ-तत्व सुरक्षित रखे गए हैं।
- source_word: שִׁכֹּרֵי אֶפְרַיִם
  choice: एप्रैम के मतवाले
  rationale: यह एप्रैम से संबंधित, मदिरा के वश में रहने वाले लोगों को दर्शाता है; ‘मतवाले’ काव्यात्मक किंतु सहज हिन्दी है।
- source_word: וְצִיץ נֹבֵל
  choice: और ... मुरझाते फूल पर
  rationale: צִיץ का ‘फूल’ और נֹבֵל का निरंतर मुरझाने का भाव रखा गया है; समानांतर धिक्कार को स्पष्ट करने के लिए ‘पर’ दोहराया गया है।
- source_word: צְבִי תִפְאַרְתּוֹ
  choice: उसकी शोभायमान सुंदरता
  rationale: צְבִי और תִפְאֶרֶת के परस्पर बलवर्धक सौंदर्य तथा वैभव के भाव को गरिमापूर्ण और स्वाभाविक हिन्दी में व्यक्त करता है; पुल्लिंग प्रत्यय की सामूहिक संदर्भ-संभावना बनी रहती है।
- source_word: אֲשֶׁר עַל רֹאשׁ גֵּיא שְׁמָנִים
  choice: जो उपजाऊ घाटी के सिर पर है
  rationale: רֹאשׁ की जीवंत स्थानिक उपमा ‘सिर’ के रूप में और ‘मोटाइयों की घाटी’ का मुहावरेदार अर्थ ‘उपजाऊ घाटी’ के रूप में रखा गया है।
- source_word: הֲלוּמֵי יָיִן
  choice: जो दाखमधु से धराशायी हैं
  rationale: הלם के मारे जाने या पछाड़े जाने के सशक्त बिंब को ‘धराशायी’ सुरक्षित रखता है, जबकि दाखमधु को कारण के रूप में स्पष्ट करता है।
theological_decisions:
- issue: मुकुट और फूल का संदर्भ
  choice: दोनों काव्यात्मक बिंबों को बिना स्पष्ट पहचान जोड़े समानांतर रखा गया है।
  alternative: इन्हें व्याख्यात्मक रूप से सामरिया नगर या उसके शासक वर्ग के रूप में नाम देना।
  rationale: पद स्वयं इनकी ऐतिहासिक पहचान स्पष्ट नाम से नहीं देता; अनुवाद में निहित रूपक और उसकी संदर्भगत खुली गुंजाइश सुरक्षित रहनी चाहिए।
- issue: अंतिम पदबंध का व्याकरणिक संबंध
  choice: ‘उन पर जो दाखमधु से धराशायी हैं’ को अलग संकेतक वाक्यांश के रूप में रखा गया है।
  alternative: इसे केवल घाटी या मुकुट के साथ कसकर जोड़ना।
  rationale: इब्रानी कविता में הֲלוּמֵי יָיִן का सटीक संबंध कुछ खुला है; यह विन्यास लोगों की ओर संकेत करता है पर रूपक की काव्यात्मक तनावशीलता समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-काव्य की है। ‘दाखमधु’ बाइबिलीय संदर्भ में स्वाभाविक और विशिष्ट है; ‘धराशायी’ मूल के प्रहार-सदृश बिंब को बनाए रखता है। वाक्य की रूपकात्मक सघनता जानबूझकर सुरक्षित रखी गई है।
