  yaml_path: translation/ot/isaiah/028/028.yaml
  text: Bread grain is crushed[a], but not forever does one keep threshing it; though the wheel of his cart and his horses rumble over it[b], he does not crush it fine.
translation:
  language: hi
  text: रोटी के लिए अनाज कुचला जाता है[a], पर उसकी मड़ाई सदा नहीं की जाती। यद्यपि उसकी गाड़ी का पहिया और उसके घोड़े उसके ऊपर गड़गड़ाते हुए चलते हैं[b], फिर भी वह उसे बारीक नहीं कुचलता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रोटी का अनाज कुचला जाता है।” यहाँ इब्रानी शब्द לֶחֶם (“रोटी”) का अर्थ रोटी बनाने के लिए रखा गया अनाज है।
    reason: lexical_alternative
  - marker: b
    text: या, “घुड़सवारों।” इब्रानी शब्द का अर्थ कुछ संदर्भों में सवार हो सकता है, पर यहाँ कृषि और गाड़ी के चित्र में “घोड़े” अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: रोटी के लिए अनाज
  rationale: यहाँ ‘रोटी’ का प्रयोग उस अनाज के लिए लाक्षणिक रूप से हुआ है जिससे रोटी बनाई जाती है। यह रूप कृषि-संदर्भ को स्पष्ट रखते हुए मूल चित्र को बनाए रखता है।
- source_word: יוּדָק
  choice: कुचला जाता है
  rationale: דקק का अर्थ कुचलना या बारीक करना है। कर्मवाच्य रूप मूल इब्रानी व्याकरण को दर्शाता है और आगे उसी धातु की पुनरावृत्ति से संबंध बनाए रखता है।
- source_word: כִּי לֹא לָנֶצַח
  choice: पर ... सदा नहीं
  rationale: 'כִּי यहाँ व्याख्यात्मक-विरोधसूचक बल रखता है: अनाज कुचला तो जाता है, किंतु मड़ाई अनंत समय तक नहीं चलती।'
- source_word: אָדוֹשׁ יְדוּשֶׁנּוּ
  choice: उसकी मड़ाई ... नहीं की जाती
  rationale: धातु के क्रियार्थक संज्ञा और अपूर्ण क्रिया के संयुक्त प्रयोग में निरंतर या जोरदार क्रिया का भाव है। ‘सदा नहीं की जाती’ उस अवधि-सम्बन्धी बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהָמַם
  choice: गड़गड़ाते हुए चलाता
  rationale: המם शोर या हलचल उत्पन्न करने का भाव दे सकता है। यहाँ खलिहान में पहिए और पशुओं की आवाज़ तथा गति अभिप्रेत है, इसलिए ‘गड़गड़ाते हुए’ कृषि-दृश्य के अनुकूल है।
- source_word: גִּלְגַּל עֶגְלָתוֹ
  choice: अपनी गाड़ी के पहिए
  rationale: यह चयन ‘गाड़ी के पहिए’ के मूल संबंध को सीधे और सहज हिन्दी में रखता है। हिन्दी में क्रिया के साथ स्वाभाविक सामंजस्य के लिए एकवचन सामूहिक वस्तु को बहुवचन रूप में व्यक्त किया गया है।
- source_word: וּפָרָשָׁיו
  choice: घोड़ों
  rationale: פָרָשׁ का अर्थ कुछ संदर्भों में ‘घुड़सवार’ हो सकता है, पर गाड़ी और मड़ाई के इस कृषि-दृश्य में गाड़ी चलाने वाले घोड़े अधिक उपयुक्त हैं। वैकल्पिक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: לֹא יְדֻקֶּנּוּ
  choice: उसे बारीक चूर नहीं करता
  rationale: दोहरे דקק को आरंभ के ‘कुचला’ से जोड़ा गया है, जबकि ‘बारीक चूर’ उस सीमा को स्पष्ट करता है कि मड़ाई में अनाज को पूरी तरह पीसकर चूर्ण नहीं बना दिया जाता।
