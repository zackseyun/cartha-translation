source:
  edition: WLC
  text: וּ/לְ/ר֖וּחַ מִשְׁפָּ֑ט לַ/יּוֹשֵׁב֙ עַל הַ/מִּשְׁפָּ֔ט וְ/לִ֨/גְבוּרָ֔ה מְשִׁיבֵ֥י מִלְחָמָ֖ה שָֽׁעְרָ/ה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/006.yaml
  text: and a spirit of justice to the one who sits in judgment[c][b][a], and strength to those who turn back the battle at the gate.
translation:
  language: hi
  text: और न्याय करने को बैठनेवाले के लिए न्याय की आत्मा[a], और फाटक पर युद्ध को पीछे हटानेवालों के लिए सामर्थ्य।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्णय की आत्मा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְרוּחַ מִשְׁפָּט
  choice: और ... न्याय की आत्मा
  rationale: לְ से आरम्भ यह पद पिछले वचन की आशीषों को आगे बढ़ाता है। ‘न्याय की आत्मा’ מִשְׁפָּט के नैतिक तथा न्यायिक अर्थ-क्षेत्र को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַיֹּשֵׁב עַל הַמִּשְׁפָּט
  choice: जो न्याय करने बैठता है, उसके लिए
  rationale: एकवचन कृदन्त को स्वाभाविक हिन्दी संबंधवाचक रचना में रखा गया है। ‘न्याय करने बैठता है’ न्यायिक कार्य का भाव देता है, जबकि इब्रानी के ‘पर’ को यांत्रिक रूप से नहीं दोहराता।
- source_word: וְלִגְבוּרָה
  choice: और ... सामर्थ्य
  rationale: גְּבוּרָה यहाँ युद्ध के प्रसंग में शक्ति, पराक्रम या वीरता दर्शाता है। ‘सामर्थ्य’ समानांतर आशीष की रचना में स्वाभाविक है और शक्ति के अर्थ को बनाए रखता है।
- source_word: מְשִׁיבֵי מִלְחָמָה
  choice: जो ... युद्ध को पीछे धकेलते हैं
  rationale: שוב का कारक भाव ऐसे रक्षकों को सूचित करता है जो युद्ध अथवा हमले को उलटा देते हैं। ‘पीछे धकेलते हैं’ आधुनिक हिन्दी में इस सक्रिय सैन्य भाव को स्पष्ट रखता है।
- source_word: שַׁעְרָה
  choice: फाटक पर
  rationale: दिशात्मक/स्थानवाचक रूप नगर के फाटक के क्षेत्र की ओर संकेत करता है। रक्षात्मक युद्ध के प्रसंग में ‘फाटक पर’ संघर्ष का स्थान स्वाभाविक रूप से बताता है।
theological_decisions:
- issue: पद 6 का पिछले पद के कर्ता से संबंध
  choice: वाक्य को पिछले पद में यहोवा के विषय में कही गई बात को आगे बढ़ाने वाली आशीषों की शृंखला के रूप में रखा गया है।
  alternative: इसे बिना किसी निहित कर्ता के, केवल दिए जाने वाले वरदानों की सूची के रूप में पढ़ा जा सकता है।
  rationale: इब्रानी पाठ में पूर्वसर्गीय पद पिछले वाक्य पर निर्भर हैं। हिन्दी में भी कर्ता या क्रिया जोड़कर अर्थ को धर्मवैचारिक रूप से अधिक निश्चित करने के बजाय यह संबंध खुला रखा गया है।
- issue: מִשְׁפָּט का गुण और न्यायिक कार्य के रूप में प्रयोग
  choice: पहले प्रयोग में ‘न्याय की आत्मा’ और दूसरे में ‘न्याय करने’ रखा गया है।
  alternative: दोनों स्थानों पर ‘निर्णय’ अथवा ‘न्यायिक निर्णय’ रखा जा सकता है।
  rationale: एक ही इब्रानी शब्द का अर्थ-क्षेत्र दोनों जगह बना रहता है, पर हिन्दी में पहला गुण को और दूसरा न्यायिक कार्य को स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद की काव्यात्मक समानांतरता—न्याय करनेवाले के लिए आत्मा और रक्षकों के लिए सामर्थ्य—सुरक्षित है; साथ ही पिछले पद पर इसकी वाक्यगत निर्भरता को अनावश्यक शब्द जोड़कर समाप्त नहीं किया गया।
