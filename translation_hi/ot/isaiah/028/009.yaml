source:
  edition: WLC
  text: אֶת מִי֙ יוֹרֶ֣ה דֵעָ֔ה וְ/אֶת מִ֖י יָבִ֣ין שְׁמוּעָ֑ה גְּמוּלֵי֙ מֵֽ/חָלָ֔ב עַתִּיקֵ֖י מִ/שָּׁדָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/009.yaml
  text: Whom will he teach knowledge[a], and to whom will he explain the message? Those weaned from milk[b], those taken from the breasts?
translation:
  language: hi
  text: वह[b] किसे ज्ञान सिखाएगा, और किसे संदेश[a] समझाएगा? क्या दूध से छुड़ाए हुओं को, स्तनों से अलग किए हुओं को?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समाचार” अथवा “सुनी हुई बात”।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “सिखाएगा” और “समझाएगा” का कर्ता स्पष्ट रूप से नहीं बताया गया है। संदर्भ में संभव है कि यशायाह का उपहास करते हुए उसी की ओर संकेत किया गया हो।
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹרֶה דֵעָה
  choice: ज्ञान की शिक्षा देगा
  rationale: हिफ़ील क्रिया יוֹרֶה के ‘सिखाना/शिक्षा देना’ अर्थ और דֵעָה के ‘ज्ञान’ अर्थ—दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יָבִין
  choice: समझाएगा
  rationale: בין के हिफ़ील रूप का कारक अर्थ ‘समझने योग्य बनाना’ है; ‘समझाएगा’ इसका सहज और संक्षिप्त हिन्दी रूप है।
- source_word: שְׁמוּעָה
  choice: संदेश
  rationale: यह शब्द ‘सुनी हुई बात,’ ‘समाचार’ या ‘संदेश’ हो सकता है। शिक्षण-संदर्भ में ‘संदेश’ स्वाभाविक है, जबकि अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: גְּמוּלֵי מֵחָלָב
  choice: जिनका दूध छुड़ाया जा चुका है
  rationale: निष्क्रिय भाव और מן द्वारा व्यक्त अलगाव को स्पष्ट, प्रचलित हिन्दी मुहावरे में बनाए रखता है।
- source_word: עַתִּיקֵי מִשָּׁדָיִם
  choice: जिन्हें स्तनों से अलग किया जा चुका है
  rationale: עַתִּיקֵי के हटाए या अलग किए जाने के भाव तथा מִשָּׁדָיִם के बहुवचन शारीरिक संकेत को बनाए रखता है।
- source_word: אֶת מִי ... וְאֶת מִי
  choice: किसे ... और किसे
  rationale: दो समानांतर आलंकारिक प्रश्नों की पुनरावृत्ति और संरचना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: एकवचन क्रियाओं का अनिर्दिष्ट कर्ता
  choice: ‘वह’ रखा गया, पर उसकी पहचान नहीं बताई गई।
  alternative: इसे यशायाह, यहोवा, अथवा यशायाह का उपहास करते याजकों और भविष्यद्वक्ताओं के कथन के रूप में स्पष्ट करना।
  rationale: इब्रानी क्रियाएँ तीसरे पुरुष एकवचन में हैं, किंतु इस पद में कर्ता का नाम नहीं है। ‘वह’ व्याकरणिक संकेत को रखता है और संदर्भगत अनिश्चितता को किसी एक व्याख्या से नहीं भरता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर प्रश्नात्मक बनावट सुरक्षित है। शिशुओं का संकेत स्पष्ट है, पर मूल में संज्ञा न होने के कारण ‘बच्चों’ को मुख्य पाठ में नहीं जोड़ा गया।
