  yaml_path: translation/ot/isaiah/028/026.yaml
  text: For his God instructs him in justice[a]; he teaches him.
translation:
  language: hi
  text: क्योंकि उसका परमेश्वर उसे उचित रीति से[a] निर्देश देता है; वही उसे सिखाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे उचित विधि की शिक्षा देता है।” यहाँ इब्रानी לַמִּשְׁפָּט का अर्थ “न्याय के अनुसार,” “उचित विधि से” या “सही नियम की शिक्षा” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִסְּרוֹ
  choice: उसे निर्देश देता है
  rationale: पिएल रूप में יסר यहाँ किसान को खेती की सही विधि का प्रशिक्षण देने के अर्थ में है, न कि दंड देने के अर्थ में। ‘निर्देश देता है’ इस शिक्षात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַמִּשְׁפָּט
  choice: उचित रीति से
  rationale: מִשְׁפָּט का सामान्य अर्थ ‘न्याय/निर्णय’ है, पर इस कृषि-संदर्भ में इसका आशय उचित नियम, विधि या प्रक्रिया से है। क्रियाविशेषणीय अनुवाद प्रसंग के अनुरूप है, जबकि पादटिप्पणी मूल की दूसरी सम्भव संरचना बताती है।
- source_word: אֱלֹהָיו
  choice: उसका परमेश्वर
  rationale: तृतीय पुरुष एकवचन संबंधसूचक प्रत्यय को बनाए रखा गया है; किसान के व्यावहारिक ज्ञान का स्रोत उसका परमेश्वर बताया गया है।
- source_word: יוֹרֶנּוּ
  choice: वही उसे सिखाता है
  rationale: हिफ़ील रूप ירה का अर्थ ‘सिखाना/निर्देश देना’ है। ‘वही’ से स्पष्ट होता है कि परमेश्वर दोनों समानांतर क्रियाओं का कर्ता है और हिन्दी वाक्य स्वाभाविक रहता है।
theological_decisions:
- issue: खेती की बुद्धि का स्रोत
  choice: पद किसान को उचित विधि सिखानेवाले के रूप में परमेश्वर को प्रस्तुत करता है।
  alternative: इसे अधिक सामान्य रूप से मानवीय कौशल पर परमेश्वर के विधान या मार्गदर्शन के कथन के रूप में समझा जा सकता है।
  rationale: ‘उसका परमेश्वर’ स्पष्ट कर्ता है और दोनों शिक्षात्मक क्रियाएँ किसान के ज्ञान को परमेश्वर से जोड़ती हैं; इससे आगे कोई विशिष्ट सिद्धान्त नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘न्याय में’ जैसे शाब्दिक किन्तु इस कृषि-संदर्भ में अस्पष्ट प्रयोग से बचते हुए मूल शब्द की अर्थ-व्याप्ति पादटिप्पणी में सुरक्षित रखी गई है।
