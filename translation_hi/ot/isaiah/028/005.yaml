translation:
  language: hi
  text: उस दिन सेनाओं का यहोवा[a] अपनी प्रजा के बचे हुए लोगों के लिए शोभा का मुकुट और वैभव का किरीट होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी उपाधि יְהוָה צְבָאוֹת का परम्परागत अनुवाद “सेनाओं का प्रभु” भी किया जाता है। इसमें परमेश्वर का नाम “यहोवा” और “सेनाएँ” दोनों आते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यवाणी में प्रयुक्त मानक काल-सूचक पदबंध है; ‘उस दिन’ स्वाभाविक हिन्दी में इसकी भविष्यसूचक लय बनाए रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: ‘यहोवा’ परमेश्वर के व्यक्तिगत नाम को रखता है और ‘सेनाओं का’ צְבָאוֹת के मूल अर्थ को आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: יִהְיֶה
  choice: होगा
  rationale: अपूर्ण क्रिया यहाँ भविष्य की अवस्था व्यक्त करती है।
- source_word: לַעֲטֶרֶת צְבִי
  choice: शोभा का मुकुट
  rationale: עֲטֶרֶת का अर्थ ‘मुकुट’ और צְבִי का अर्थ यहाँ ‘शोभा/सुन्दरता’ है; यह अगले समानांतर पद से शब्दगत भिन्नता बनाए रखता है।
- source_word: וְלִצְפִירַת תִּפְאָרָה
  choice: और वैभव का राजमुकुट
  rationale: צְפִירָה यहाँ सिर पर पहना जाने वाला विशिष्ट अलंकार/मुकुट है; ‘राजमुकुट’ पहले ‘मुकुट’ के साथ काव्यात्मक समानांतरता और हल्का भेद दोनों रखता है। תִּפְאָרָה के लिए ‘वैभव’ गरिमापूर्ण और सुबोध है।
- source_word: לִשְׁאָר עַמּוֹ
  choice: अपनी प्रजा के बचे हुओं के लिए
  rationale: שְׁאָר यशायाह में न्याय के बाद बची हुई प्रजा को सूचित करता है। ‘बचे हुए’ हिन्दी में ‘शेष’ की अपेक्षा अधिक सहज है, जबकि भविष्यसूचक आशय सुरक्षित रहता है।
theological_decisions:
- issue: יְהוָה צְבָאוֹת का अनुवाद
  choice: सेनाओं का यहोवा
  alternative: सेनाओं का प्रभु / सर्वशक्तिमान यहोवा
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम יְהוָה और ‘सेनाएँ’ दोनों उपस्थित हैं। चुना हुआ रूप नाम और उपाधि को बिना किसी अतिरिक्त धार्मिक व्याख्या के सुरक्षित रखता है।
- issue: שְׁאָר का आशय
  choice: बचे हुए
  alternative: शेष जन
  rationale: संदर्भ में यह केवल संख्या की बचत नहीं, बल्कि न्याय के बाद बची परमेश्वर की प्रजा का भविष्यसूचक विचार है। ‘बचे हुए’ इस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। समानांतर मुकुट-चित्रों के लिए ‘मुकुट’ और ‘राजमुकुट’, तथा צְבִי और תִּפְאָרָה के लिए ‘शोभा’ और ‘वैभव’ का भेद बनाए रखा गया है।
