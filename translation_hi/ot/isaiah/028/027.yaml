base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/027.yaml
  text: For black cumin is not threshed with a sledge[a], nor is a cart wheel rolled over cumin; rather, black cumin is beaten out with a staff[b], and cumin with a rod.
translation:
  language: hi
  text: क्योंकि कलौंजी[a] की मड़ाई मड़ाई के दाँतेदार पटरे से नहीं की जाती, और न जीरे[b] के ऊपर गाड़ी का पहिया चलाया जाता है; क्योंकि कलौंजी को डंडे से और जीरे को छड़ी से पीटा जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘काला जीरा’; इब्रानी क़ेत्सह की पहचान संभवतः कलौंजी (Nigella sativa) से है, पर पौधे की पहचान पूरी तरह निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या संभवतः ‘विलायती जीरा’ (कैरवे); इब्रानी कम्मोन का सामान्य अर्थ ‘जीरा’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרוּץ
  choice: दाँतेदार पटरा
  rationale: कृषि-संदर्भ में यह धारदार या दाँतेदार मड़ाई-उपकरण है। ‘दाँतेदार पटरा’ ठोस कृषि-चित्र को बनाए रखते हुए आधुनिक हिन्दी में समझने योग्य है।
- source_word: יוּדַשׁ
  choice: मड़ाई ... की जाती
  rationale: דוש का होफ़ाल रूप यहाँ अनाज या बीज की मड़ाई किए जाने को बताता है। निष्क्रिय रचना मूल के व्याकरण और कृषि-संदर्भ दोनों को सुरक्षित रखती है।
- source_word: קֶצַח
  choice: कलौंजी
  rationale: इस पौधे की सामान्य पहचान Nigella sativa से की जाती है, जिसका प्रचलित हिन्दी नाम ‘कलौंजी’ है। पहचान पूरी तरह निश्चित न होने के कारण विकल्प पादटिप्पणी में रखा गया है।
- source_word: אוֹפַן עֲגָלָה
  choice: गाड़ी का पहिया
  rationale: यह मूल पदबंध का सीधा और स्वाभाविक हिन्दी रूप है तथा कृषि-चित्र को स्पष्ट रखता है।
- source_word: יוּסָּב
  choice: ऊपर ... चलाया जाता
  rationale: סבב का यहाँ कारक/निष्क्रिय भाव पहिए को उपज के ऊपर घुमाने या चलाने की क्रिया व्यक्त करता है।
- source_word: כַּמֹּן
  choice: जीरा
  rationale: इस वनस्पति की सामान्य पहचान cumin के रूप में है; कम संभावित वैकल्पिक पहचान पादटिप्पणी में दी गई है।
- source_word: מַטֶּה
  choice: डंडा
  rationale: यह हाथ से प्रहार करने वाले लकड़ी के साधन को स्वाभाविक हिन्दी में व्यक्त करता है और समानांतर ‘छड़ी’ से कुछ भेद बनाए रखता है।
- source_word: יֵחָבֶט
  choice: पीटकर अलग किया जाता
  rationale: חבט का आशय उपज को पीटकर बीज निकालने या अलग करने से है। यह रूप क्रिया के कृषि-परिणाम को स्पष्ट करता है, बिना भारी तकनीकी शब्दावली के।
- source_word: שֵׁבֶט
  choice: छड़ी
  rationale: यह अपेक्षाकृत हल्के प्रहार-साधन को दर्शाता है और מַטֶּה के लिए चुने गए ‘डंडा’ से काव्यात्मक समानांतरता तथा भेद दोनों रखता है।
- source_word: כִּי ... כִּי
  choice: क्योंकि ... बल्कि
  rationale: पहला כִּי कारण या व्याख्या आरम्भ करता है; दूसरा उचित विधि को पहले निषेध के विपरीत रखता है, जिसे हिन्दी में ‘बल्कि’ स्वाभाविक रूप से व्यक्त करता है।
