base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/003.yaml
  text: The proud crown of the drunkards of Ephraim will be trampled underfoot[a].
translation:
  language: hi
  text: एप्रैम के मतवालों के घमण्ड का मुकुट पैरों तले रौंदा जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרַגְלַיִם
  choice: पैरों तले
  rationale: בְּ के साथ द्विवचन ‘पैर’ रौंदे जाने का साधन और स्थान सूचित करता है। ‘पैरों तले’ आधुनिक हिन्दी में स्वाभाविक है और मूल बिंब को बनाए रखता है।
- source_word: תֵּרָמַסְנָה
  choice: रौंदा जाएगा
  rationale: רמס का निफ़ाल अपूर्ण रूप निष्क्रिय भाव में भविष्य की घटना बताता है। स्त्रीलिंग रूप का कर्ता ‘मुकुट’ है; हिन्दी में ‘मुकुट’ पुल्लिंग होने से क्रिया ‘रौंदा जाएगा’ रखी गई है।
- source_word: עֲטֶרֶת
  choice: मुकुट
  rationale: शब्द मुकुट, पुष्पमाला या सिर पर पहनी जाने वाली माला को सूचित कर सकता है। प्रसंग में सामरिया की गौरवपूर्ण प्रमुखता के रूपक के लिए ‘मुकुट’ उपयुक्त है।
- source_word: גֵּאוּת
  choice: घमण्ड का
  rationale: मूल में यह संज्ञा ‘गर्व/घमण्ड’ है। ‘घमण्ड का मुकुट’ सम्बन्धवाचक संरचना को सुरक्षित रखता है और प्रसंग की नकारात्मक नैतिक ध्वनि स्पष्ट करता है।
- source_word: שִׁכּוֹרֵי
  choice: मतवालों का
  rationale: यह बहुवचन रूप उन लोगों को दर्शाता है जिनकी पहचान मदहोशी से है। ‘मतवाले’ dignified yet current Hindi में ‘drunkards’ का स्पष्ट और संक्षिप्त समतुल्य है।
- source_word: אֶפְרָיִם
  choice: एप्रैम
  rationale: मूल पाठ में आए जातीय/भौगोलिक नाम को हिन्दी बाइबलीय लिप्यंतरण में रखा गया है; प्रसंगतः यह उत्तरी राज्य का प्रतिनिधित्व करता है, पर अनुवाद में नाम को विस्तृत नहीं किया गया।
theological_decisions:
- issue: עֲטֶרֶת גֵּאוּת की रूपकात्मक सम्बन्धवाचक रचना
  choice: घमण्ड का मुकुट
  alternative: घमण्डी मुकुट
  rationale: संज्ञात्मक ‘घमण्ड का’ मूल की संरचना और उसके सम्भावित अर्थगत तनाव को अधिक निकटता से बनाए रखता है। विशेषण ‘घमण्डी’ अधिक सहज हो सकता है, पर वह घमण्ड को स्वयं मुकुट का गुण बनाकर सम्बन्ध को कुछ अधिक निश्चित कर देता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। पद की काव्यात्मक उलटबाँसी को हिन्दी की स्वाभाविक वाक्य-रचना में ढाला गया है, जबकि ‘मुकुट’, ‘घमण्ड’ और ‘पैरों तले रौंदे जाने’ के मूल बिंब सुरक्षित हैं।
