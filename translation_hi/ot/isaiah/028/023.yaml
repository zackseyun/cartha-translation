  text: Give ear and hear my voice[a]; pay attention and hear my word.
translation:
  language: hi
  text: कान लगाओ और मेरी आवाज़ सुनो; ध्यान दो और मेरी बात सुनो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֲזִינוּ
  choice: कान लगाओ
  rationale: हिफ़ील बहुवचन आज्ञार्थक का अर्थ ध्यानपूर्वक सुनने के लिए कान लगाने का आह्वान है। यह अभिव्यक्ति ऊँचे काव्यात्मक स्वर और क्रिया की सक्रियता दोनों को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: וְשִׁמְעוּ
  choice: और ... सुनो
  rationale: काल बहुवचन आज्ञार्थक को अलग क्रिया के रूप में रखा गया है, ताकि הַאֲזִינוּ के साथ मूल इब्रानी का युग्म और सुनने पर दिया गया बल बना रहे।
- source_word: קוֹלִי
  choice: मेरी आवाज़
  rationale: प्रत्यक्ष संबोधन में קוֹל का सामान्य और सहज अर्थ ‘आवाज़’ है।
- source_word: הַקְשִׁיבוּ
  choice: ध्यान दो
  rationale: हिफ़ील बहुवचन आज्ञार्थक एकाग्र होकर ध्यान देने का आह्वान करता है। ‘ध्यान दो’ आधुनिक हिन्दी में स्पष्ट है और पहले प्रयुक्त ‘कान लगाओ’ से इसका भेद भी बनाए रखता है।
- source_word: וְשִׁמְעוּ
  choice: और ... सुनो
  rationale: दोहराई गई इब्रानी क्रिया שמע को भी दोहराकर अनूदित किया गया है, जिससे पद का समानांतर विन्यास और अलंकारिक पुनरावृत्ति सुरक्षित रहती है।
- source_word: אִמְרָתִי
  choice: मेरी बात
  rationale: אִמְרָה का अर्थ कथन, वचन या कही हुई बात हो सकता है। ‘मेरी बात’ सामान्य आधुनिक हिन्दी में स्वाभाविक है, एकवचन भाव रखता है और ‘मेरी आवाज़’ के समानांतर ठीक बैठता है।
