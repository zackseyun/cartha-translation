translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। दोनों समानांतर खंडों की अलग-अलग आज्ञाएँ तथा ‘सुनो’ की जानबूझकर की गई पुनरावृत्ति सुरक्षित रखी गई है।
