  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘घाटी के सिर पर’ मूल के स्थल-बिंब को सुरक्षित रखता है, जबकि ‘उपजाऊ घाटी’ हिब्रू मुहावरे का स्वाभाविक हिन्दी रूप है। फुटनोट चिह्न संबंधित शब्दों के साथ रखे गए हैं।
