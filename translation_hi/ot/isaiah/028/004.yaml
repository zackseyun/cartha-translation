id: ISA.28.4
reference: Isaiah 28:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְֽ/הָ֨יְתָ֜ה צִיצַ֤ת נֹבֵל֙ צְבִ֣י תִפְאַרְתּ֔/וֹ אֲשֶׁ֥ר עַל רֹ֖אשׁ גֵּ֣יא שְׁמָנִ֑ים כְּ/בִכּוּרָהּ֙ בְּ/טֶ֣רֶם קַ֔יִץ אֲשֶׁ֨ר יִרְאֶ֤ה הָֽ/רֹאֶה֙ אוֹתָ֔/הּ בְּ/עוֹדָ֥/הּ בְּ/כַפּ֖/וֹ יִבְלָעֶֽ/נָּה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/004.yaml
  text: 'And the fading flower of his glorious beauty[a], which is on the head of the fertile valley, will be like an early fig before summer: whoever sees it, while it is still in his palm[b], swallows it down.'
translation:
  language: hi
  text: 'और उसकी महिमामय शोभा का मुरझाता फूल, जो उपजाऊ घाटी[a] की चोटी पर है, गरमी आने से पहले की पहली पकी अंजीर[b] जैसा होगा: उसे देखने वाला, जब वह अभी उसकी हथेली में ही हो, उसे निगल लेता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘समृद्धियों की घाटी’; यह भरपूर और उपजाऊ घाटी के लिए हिब्रू मुहावरा है।
    reason: cultural_note
  - marker: b
    text: या ‘गरमी आने से पहले का पहला पका फल।’ हिब्रू शब्द בִּכּוּרָה सामान्य रूप से पहले पके फल को भी दर्शा सकता है, हालाँकि यहाँ सामान्यतः आरम्भिक अंजीर समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צִיצַת נֹבֵל
  choice: मुरझाता फूल
  rationale: צִיצַת फूल या पुष्प-सदृश शोभा को और נֹבֵל मुरझाने की जारी अवस्था को व्यक्त करता है; यह चयन दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: צְבִי תִפְאַרְתּוֹ
  choice: उसकी महिमामय शोभा
  rationale: दोनों संज्ञाओं में शोभा, वैभव और महिमा का संयुक्त बल है; प्रत्यय को ‘उसकी’ से स्पष्ट किया गया है।
- source_word: גֵּיא שְׁמָנִים
  choice: उपजाऊ घाटी
  rationale: शाब्दिक रूप ‘चिकनाइयों/समृद्धियों की घाटी’ है, जो हिब्रू मुहावरे में भरपूर और उपजाऊ भूमि को दर्शाता है।
- source_word: כְּבִכּוּרָהּ בְּטֶרֶם קַיִץ
  choice: गरमी आने से पहले की पहली पकी अंजीर
  rationale: בִּכּוּרָה प्रथम पकने वाले फल को दर्शाता है और इस भविष्यद्वाणी के कृषि-बिंब में सामान्यतः आरम्भिक अंजीर समझा जाता है; ‘गरमी आने से पहले’ समय-संबंध को स्पष्ट रखता है।
- source_word: אֲשֶׁר יִרְאֶה הָרֹאֶה אוֹתָהּ
  choice: उसे देखने वाला
  rationale: हिब्रू की बलाघाती पुनरुक्ति को शब्दशः दोहराने के बजाय उसके अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में रखा गया है।
- source_word: בְּעוֹדָהּ בְּכַפּוֹ
  choice: उसे अपनी हथेली में रहते ही
  rationale: כַּף का अधिक सटीक ठोस अर्थ ‘हथेली’ है; ‘रहते ही’ फल को तुरन्त खा लेने की जीवंतता को बनाए रखता है।
- source_word: יִבְלָעֶנָּה
  choice: निगल जाएगा
  rationale: בלע का मूल बिंब निगलने का है और यहाँ शीघ्र उपभोग का भाव देता है।
- source_word: וְהָיְתָה
  choice: जैसा होगा
  rationale: यह रूप पूर्ववर्ती विषय के भविष्य में इस उपमा के समान हो जाने का परिणाम बताता है।
