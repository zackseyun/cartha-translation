base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/021.yaml
  text: For Yahweh will rise up as at Mount Perazim[a]; he will be stirred up as in the Valley of Gibeon[c][b], to do his work—his strange work—and to perform his task—his foreign task.
translation:
  language: hi
  text: क्योंकि याहवे जैसे परासीम पर्वत पर उठ खड़ा हुआ था[a], वैसे ही वह उठ खड़ा होगा; जैसे गिबोन की घाटी में, वैसे ही वह उद्वेलित होगा[b], अपना काम—अपना अनोखा काम—करने और अपना कार्य—अपना पराया कार्य—पूरा करने के लिए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परासीम पर्वत उस घटना की याद दिलाता है जब याहवे दाऊद के शत्रुओं के विरुद्ध टूट पड़ा था (2 शमूएल 5:20; 1 इतिहास 14:11)।
    reason: cross_reference
  - marker: b
    text: गिबोन की घाटी संभवतः गिबोन के युद्ध में याहवे के हस्तक्षेप की ओर संकेत करती है (यहोशू 10:10–14)।
    reason: cross_reference
  - marker: c
    text: या, “अपना पराया काम … अपना अनोखा कार्य।” दोनों विशेषण बताते हैं कि न्याय का यह कार्य असामान्य या अपरिचित रूप में चित्रित किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण प्रस्तुत करता है और हिब्रू के कारणसूचक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כְהַר פְּרָצִים
  choice: परासीम पर्वत पर की तरह
  rationale: तुलनासूचक כְ और उस स्थान से जुड़ी पिछली घटना—दोनों की ओर संकेत बना रहता है।
- source_word: יָקוּם
  choice: उठ खड़ा होगा
  rationale: यह निर्णायक हस्तक्षेप के लिए उठने का सजीव भाव व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप से परमेश्वर के व्यक्तिगत नाम को प्रस्तुत करता है, किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: כְעֵמֶק בְּגִבְעוֹן
  choice: गिबोन की घाटी में की तरह
  rationale: तुलना को गिबोन की घाटी में हुई घटना से जोड़ता है और स्थल-संदर्भ को स्पष्ट रखता है।
- source_word: יִרְגָּז
  choice: उत्तेजित होगा
  rationale: רגז के विचलित, उद्वेलित या कार्य के लिए प्रेरित होने के अर्थ-क्षेत्र को रखता है, बिना नियंत्रण खोने का भाव जोड़े।
- source_word: לַעֲשׂוֹת מַעֲשֵׂהוּ
  choice: अपना काम करे
  rationale: क्रिया और संज्ञा की निकटता को संक्षिप्त, स्वाभाविक हिन्दी में रखता है।
- source_word: זָר
  choice: अनोखा
  rationale: यहाँ अपेक्षा से भिन्न या असामान्य होने का भाव देता है; इसे व्याख्यात्मक रूप से केवल 'दंड' नहीं बनाया गया।
- source_word: וְלַעֲבֹד עֲבֹדָתוֹ
  choice: और अपना कार्य पूरा करे
  rationale: हिब्रू की समांतर सजातीय अभिव्यक्ति को स्वाभाविक हिन्दी में दूसरे पद के रूप में प्रस्तुत करता है।
- source_word: נָכְרִיָּה
  choice: अपरिचित
  rationale: पराया, विदेशी अथवा सामान्य स्वभाव से भिन्न लगने का भाव रखता है और זָר से शब्दगत भिन्नता भी बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों के लिए व्यापक रूप से पहचाना जाने वाला 'यहोवा' नाम को उपाधि में बदले बिना प्रस्तुत करता है।
- issue: परमेश्वर के काम को 'अनोखा/अपरिचित' कहना
  choice: रूपकात्मक तनाव को मुख्य पाठ में बनाए रखना
  alternative: इसे मुख्य पाठ में 'असामान्य दंड' या 'अप्रत्याशित न्याय' कहकर स्पष्ट कर देना
  rationale: हिब्रू जानबूझकर इस कार्य को זָר और נָכְרִיָּה कहता है। अनुवाद इस धार्मिक तनाव को किसी एक व्याख्या में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप। हिब्रू की दोहरी समानांतर रचना, ऐतिहासिक संकेत और 'अनोखा/अपरिचित' धार्मिक तनाव सुरक्षित रखे गए हैं।
