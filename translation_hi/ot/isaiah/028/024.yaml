  yaml_path: translation/ot/isaiah/028/024.yaml
  text: Does the plowman plow all day to sow? Does he keep opening and harrowing his ground?[a]
translation:
  language: hi
  text: क्या हल चलाने वाला बोने के लिए दिन भर हल चलाता रहता है? क्या वह अपनी भूमि को लगातार तोड़ता और उस पर पाटा चलाता रहता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या वह अपनी मिट्टी को लगातार तोड़ता और समतल करता रहता है?” यहाँ प्रयुक्त इब्रानी कृषि-क्रियाओं का अर्थ कुछ अधिक सामान्य ढंग से भी व्यक्त किया जा सकता है; मुख्य पाठ खेत तैयार करने की संभावित क्रमिक क्रियाओं को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכֹל הַיּוֹם
  choice: क्या ... दिन भर
  rationale: प्रश्नवाचक הֲ के साथ यह एक आलंकारिक प्रश्न है। ‘दिन भर’ समय की व्यापकता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יַחֲרֹשׁ / הַחֹרֵשׁ
  choice: हल चलानेवाला ... हल चलाता
  rationale: क्रिया और कर्ता में एक ही इब्रानी मूल की पुनरावृत्ति है; हिन्दी में भी ‘हल चलानेवाला ... हल चलाता’ कृषि-बिंब और शब्द-संबंध दोनों को सुरक्षित रखता है।
- source_word: לִזְרֹעַ
  choice: बोने के लिए
  rationale: यह उद्देश्यसूचक क्रिया-रूप है और बताता है कि हल चलाना बोआई की तैयारी के लिए है।
- source_word: יְפַתַּח
  choice: चीरता
  rationale: मूल अर्थ ‘खोलना’ है; खेती के संदर्भ में भूमि या मिट्टी को चीरकर खोलना अभिप्रेत है। ‘चीरता’ इस दृश्य बिंब को स्वाभाविक हिन्दी में रखता है।
- source_word: וִישַׂדֵּד
  choice: उस पर पाटा चलाता
  rationale: यहाँ यह विशेष कृषि-क्रिया संभवतः जुताई के बाद ढेले तोड़ने और भूमि समतल करने को सूचित करती है। ‘पाटा चलाता’ उस क्रम को ठोस कृषि-भाषा में व्यक्त करता है।
- source_word: אַדְמָתוֹ
  choice: अपनी भूमि
  rationale: यह खेती की जा रही धरती या मिट्टी है। ‘अपनी भूमि’ सरल, स्वाभाविक और प्रसंगानुकूल है।
