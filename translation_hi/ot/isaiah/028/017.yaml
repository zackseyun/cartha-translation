review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the two architectural standards, the hail, and the false refuge. However, “जल ... बहा ले जाएगा” renders the final image as carrying the shelter away, whereas יִשְׁטֹפוּ more directly depicts waters overwhelming/inundating it. “डुबो देगा” retains that flood image more closely.
  naturalness: The Hindi is generally modern, dignified, and clear. “न्याय को नापने की डोरी ... बनाऊँगा” is understandable, but “ठहराऊँगा” more naturally expresses appointing these as standards. “बाढ़ का पानी” makes the destructive-water image idiomatic without obscuring the Hebrew plural’s collective force.
  terminology: “न्याय / धार्मिकता” appropriately preserves the distinction between מִשְׁפָּט and צְדָקָה. “नापने की डोरी / साहुल” accurately retains the paired construction imagery; the clarification of “साहुल” is useful. “झूठ की शरण” and “छिपने की जगह” preserve the distinct refuge/concealment terms.
  issues:
  - severity: medium
    issue: The final verb phrase “जल छिपने की जगह को बहा ले जाएगा” shifts the image from inundation to carrying away.
    rationale: שׁטף denotes overflow or flooding. Although it can imply sweeping away, the verse’s immediate parallel is best represented in Hindi by waters overwhelming or submerging the shelter.
  - severity: low
    issue: “बनाऊँगा” is slightly less idiomatic than “ठहराऊँगा” for establishing justice and righteousness as measuring standards.
    rationale: In this metaphorical predication, “ठहराऊँगा” clearly conveys setting or appointing a norm while retaining the source sense of שׂוּם.
  revised_text: मैं न्याय को नापने की डोरी और धार्मिकता को साहुल[a] ठहराऊँगा; ओले झूठ की शरण को बुहार ले जाएँगे, और बाढ़ का पानी छिपने की जगह[b] को डुबो देगा।
  revised_footnotes:
  - marker: a
    text: अर्थात सीध जाँचने के लिए डोरी से लटकाया गया भार।
