- from: मैं न्याय को नापने की डोरी और धार्मिकता को साहुल[a] बनाऊँगा; ओले झूठ की शरण को बुहार ले जाएँगे, और जल छिपने की जगह[b] को बहा ले जाएगा।
  to: मैं न्याय को नापने की डोरी और धार्मिकता को साहुल[a] ठहराऊँगा; ओले झूठ की शरण को बुहार ले जाएँगे, और बाढ़ का पानी छिपने की जगह[b] को डुबो देगा।
  rationale: The revision retains the draft’s sound terminology and its clear architectural metaphor. It changes the final clause to express the Hebrew image of waters flooding or overwhelming the shelter, rather than specifically carrying it away, and uses “ठहराऊँगा” for the establishment of justice and righteousness as standards. Footnote anchors remain attached to the terms they clarify.
