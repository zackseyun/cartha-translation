id: ISA.28.17
reference: Isaiah 28:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֤י מִשְׁפָּט֙ לְ/קָ֔ו וּ/צְדָקָ֖ה לְ/מִשְׁקָ֑לֶת וְ/יָעָ֤ה בָרָד֙ מַחְסֵ֣ה כָזָ֔ב וְ/סֵ֥תֶר מַ֖יִם יִשְׁטֹֽפוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/017.yaml
  text: And I will make justice the measuring line[a], and righteousness the plumb line; hail will sweep away the refuge of lies[c][b], and waters will flood the shelter.
translation:
  language: hi
  text: मैं न्याय को नापने की डोरी और धार्मिकता को साहुल[a] ठहराऊँगा; ओले झूठ की शरण को बुहार ले जाएँगे, और बाढ़ का पानी छिपने की जगह[b] को डुबो देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात सीध जाँचने के लिए डोरी से लटकाया गया भार।
    reason: lexical_clarification
  - marker: b
    text: या “आड़”; हिब्रू शब्द छिपने या सुरक्षा पाने की जगह को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: मैं ... बनाऊँगा
  rationale: שׂוּם का अर्थ यहाँ किसी वस्तु को मानक ठहराना या बनाना है; हिंदी में यह रूप दोनों समानांतर पदों के साथ स्वाभाविक है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: यहाँ शब्द परमेश्वर के न्यायपूर्ण निर्णय और व्यवस्था को उस मानक के रूप में प्रस्तुत करता है जिससे मापा जाएगा।
- source_word: לְקָו
  choice: नापने की डोरी
  rationale: קָו निर्माण में नापने के लिए प्रयुक्त डोरी है; यह अनुवाद स्थापत्य रूपक को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: וּצְדָקָה
  choice: और धार्मिकता
  rationale: यह चयन מִשְׁפָּט से भेद बनाए रखते हुए नैतिक खराई का भाव और हिब्रू समानांतरता सुरक्षित रखता है।
- source_word: לְמִשְׁקָלֶת
  choice: साहुल
  rationale: מִשְׁקָלֶת सीध जाँचने के लिए लटकाए गए भार अथवा साहुल को सूचित करता है; हिंदी में 'साहुल' सटीक निर्माण-संबंधी शब्द है।
- source_word: וְיָעָה
  choice: बुहार ले जाएँगे
  rationale: יעה में बुहारकर साफ कर देने का भाव है; ओलों के साथ यह विनाश का सजीव चित्र बनाए रखता है।
- source_word: בָרָד
  choice: ओले
  rationale: यह सामान्य और प्रत्यक्ष हिंदी समतुल्य है; बहुवचन क्रिया के साथ स्वाभाविक बैठता है।
- source_word: מַחְסֵה כָזָב
  choice: झूठ की शरण
  rationale: यह संबंधवाची संरचना को बनाए रखता है और निकटवर्ती प्रसंग में छल पर आधारित सुरक्षा की ओर संकेत करता है।
- source_word: וְסֵתֶר
  choice: और ... छिपने की जगह
  rationale: סֵתֶר ऐसी जगह है जहाँ छिपाव या सुरक्षा मिलती है; 'छिपने की जगह' मूल अर्थ को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: מַיִם
  choice: जल
  rationale: हिंदी में द्रव्यवाचक एकवचन स्वाभाविक है और हिब्रू बहुवचन के सामूहिक, प्रचंड जल के अर्थ को व्यक्त कर सकता है।
- source_word: יִשְׁטֹפוּ
  choice: बहा ले जाएगा
  rationale: שׁטף में उमड़कर डुबोने या बहा देने का भाव है; इस कर्म के साथ 'बहा ले जाना' स्वाभाविक और चित्रात्मक है।
theological_decisions:
- issue: מִשְׁפָּט / צְדָקָה की नैतिक शब्द-जोड़ी
  choice: न्याय / धार्मिकता
  alternative: निर्णय / न्याय; अथवा दोनों के लिए 'न्याय'
  rationale: अलग शब्द रखने से न्यायपूर्ण निर्णय या व्यवस्था और नैतिक खराई के बीच मूल का सूक्ष्म भेद बचता है; दोनों को एक ही शब्द से प्रस्तुत करने पर समानांतरता सपाट हो जाती।
- issue: वचन में स्थापत्य मानकों का रूपक
  choice: नापने की डोरी / साहुल
  alternative: रेखा / लटकता हुआ भार
  rationale: दोनों वास्तविक निर्माण-उपकरणों को सूचित करते हैं और इस बात को स्पष्ट रखते हैं कि न्याय तथा धार्मिकता परमेश्वर के परखने के मानक हैं, बिना रूपक को सिद्धांतात्मक व्याख्या में बदलने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। 'नापने की डोरी' सामान्य पाठक के लिए स्पष्ट है; अपेक्षाकृत कम प्रचलित लेकिन सटीक निर्माण-शब्द 'साहुल' को पादटिप्पणी में समझाया गया है। दोनों विनाशकारी चित्रों में क्रियाएँ स्वाभाविक हिंदी के अनुसार कर्ता-वचन से मिलाई गई हैं।
