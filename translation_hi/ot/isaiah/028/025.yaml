base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/025.yaml
  text: Does he not[a], when he has leveled its surface, scatter black cumin and sow cumin, and put wheat in rows, and barley in its appointed place[c][b], and spelt at its border?
translation:
  language: hi
  text: क्या वह भूमि की सतह समतल कर लेने के बाद कलौंजी[a] नहीं बिखेरता और जीरा नहीं बोता? क्या वह गेहूँ कतारों में[b], जौ उसके नियत स्थान पर, और स्पेल्ट गेहूँ[c] उसकी सीमा पर नहीं लगाता?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘काली जीरी’; קֶצַח नामक पौधे की ठीक-ठीक पहचान निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द שׂוֹרָה का अर्थ अनिश्चित है; इसका अर्थ ‘कतारों में’, ‘मुख्य फसल के रूप में’, या ‘सबसे अच्छी जगह में’ हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘एमर गेहूँ’; כֻסֶּמֶת से अभिप्रेत प्राचीन अनाज की ठीक-ठीक पहचान निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא אִם
  choice: क्या वह ... कर लेने के बाद ... नहीं
  rationale: यह संयोजन शर्त-सदृश कालगत भाव वाली आलंकारिक प्रश्नवाचक रचना है। हिन्दी में ‘कर लेने के बाद ... क्या ... नहीं’ उसका स्वाभाविक प्रवाह रखता है।
- source_word: שִׁוָּה פָנֶיהָ
  choice: भूमि की सतह समतल कर लेने
  rationale: यहाँ क्रिया भूमि को सम या समतल करने और स्त्रीलिंग प्रत्यय उसकी सतह की ओर संकेत करता है। स्पष्टता के लिए ‘भूमि’ व्यक्त किया गया है।
- source_word: הֵפִיץ קֶצַח
  choice: कलौंजी नहीं बिखेरता
  rationale: הֵפִיץ व्यापक रूप से बिखेरने का बोध देता है। קֶצַח की सामान्य आधुनिक पहचान कलौंजी (Nigella) है, यद्यपि वनस्पति-परक निश्चितता सीमित है।
- source_word: כַמֹּן יִזְרֹק
  choice: जीरा नहीं बोता
  rationale: יִזְרֹק का मूल भाव फेंकना या छितराना है, पर बीज के कृषि-संदर्भ में ‘बोना’ स्वाभाविक अर्थ देता है; כַמֹּן जीरा है।
- source_word: חִטָּה שׂוֹרָה
  choice: गेहूँ कतारों में
  rationale: חִטָּה का अर्थ गेहूँ है। कठिन शब्द שׂוֹרָה के लिए व्यवस्थित रोपण का संभावित अर्थ ‘कतारों में’ चुना गया है और अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: שְׂעֹרָה נִסְמָן
  choice: जौ उसके ठहराए हुए स्थान पर
  rationale: שְׂעֹרָה जौ है और נִסְמָן संभवतः चिह्नित या निर्धारित स्थान को बताता है। ‘ठहराए हुए स्थान’ जानबूझकर किए गए खेत-विभाजन को व्यक्त करता है।
- source_word: כֻסֶּמֶת גְּבֻלָתוֹ
  choice: कठिया गेहूँ खेत की मेड़ पर
  rationale: כֻסֶּמֶת प्राचीन गेहूँ की एक किस्म है, जिसकी सटीक पहचान अनिश्चित है; ‘कठिया गेहूँ’ हिन्दी में स्पेल्ट के लिए बोधगम्य नाम है। גְּבֻלָתוֹ खेत की सीमा या किनारे को सूचित करता है, जिसके लिए कृषि-संदर्भ में ‘खेत की मेड़’ स्वाभाविक है।
