source:
  edition: WLC
  text: הִנֵּ֨ה חָזָ֤ק וְ/אַמִּץ֙ לַֽ/אדֹנָ֔/י כְּ/זֶ֥רֶם בָּרָ֖ד שַׂ֣עַר קָ֑טֶב כְּ֠/זֶרֶם מַ֣יִם כַּבִּירִ֥ים שֹׁטְפִ֛ים הִנִּ֥יחַ לָ/אָ֖רֶץ בְּ/יָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/002.yaml
  text: Behold[a], the Lord has one who is mighty and strong; like a storm of hail, a destroying tempest, like a storm of mighty, overflowing waters[b], he casts it down to the earth with his hand.
translation:
  language: hi
  text: देखो[a], प्रभु के पास एक बलवान और सामर्थी जन है; वह ओलों की झड़ी और विनाशकारी आँधी के समान, प्रचंड, उमड़ते जलों की धारा के समान, उसे अपने हाथ से धरती पर पटक देगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देखो, प्रभु के लिए एक बलवान और सामर्थी जन तैयार है।” इब्रानी वाक्यांश यह भाव दे सकता है कि यह जन प्रभु का है या उसके उपयोग के लिए तैयार है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह उसे अपने हाथ से भूमि पर गिरा देता है” या “भूमि पर रख देता है।” इब्रानी क्रिया का अर्थ कम तीव्र भी हो सकता है, पर तूफान के बिंब बलपूर्वक नीचे गिराने के अर्थ का समर्थन करते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह भविष्यद्वाणी की ओर ध्यान खींचने वाला जीवंत संकेत है; आधुनिक हिन्दी में ‘देखो’ स्वाभाविक रहते हुए उसका आह्वानकारी बल बनाए रखता है।
- source_word: חָזָק וְאַמִּץ
  choice: एक बलवान और सामर्थी जन
  rationale: दोनों विशेषण उस अनिर्दिष्ट कर्ता की शक्ति पर संयुक्त बल देते हैं; ‘जन’ जोड़ने से हिन्दी में व्यक्ति-सूचक प्रयोग स्पष्ट होता है, पर उसकी पहचान निर्धारित नहीं की जाती।
- source_word: לַאדֹנָי
  choice: प्रभु के पास
  rationale: לְ यहाँ प्रभु के लिए उपलब्ध अथवा उसके अधिकार में स्थित साधन का भाव दे सकता है। ‘प्रभु के पास’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כְּזֶרֶם בָּרָד
  choice: ओलों की झड़ी के समान
  rationale: זֶרֶם तीव्र वर्षा, झड़ी या बाढ़-सदृश प्रवाह दर्शाता है; ओलों के साथ ‘झड़ी’ स्वाभाविक और प्रबल मौसमी बिंब है।
- source_word: שַׂעַר קָטֶב
  choice: विनाशकारी आँधी
  rationale: यह पद विनाश लाने वाले तूफान का बिंब देता है; अनिश्चित शब्दरूप के बावजूद ‘आँधी’ और ‘विनाशकारी’ दोनों मुख्य अर्थघटकों को बनाए रखते हैं।
- source_word: מַיִם כַּבִּירִים שֹׁטְפִים
  choice: उमड़ती हुई प्रचंड जलधारा
  rationale: כַּבִּירִים जल की विशाल शक्ति और שֹׁטְפִים बहकर सब पर छा जाने की क्रिया व्यक्त करता है; एकवचन सामूहिक ‘जलधारा’ हिन्दी में चित्र को सघन बनाती है।
- source_word: הִנִּיחַ לָאָרֶץ
  choice: धरती पर पटक देगा
  rationale: मूल क्रिया का सामान्य कारणार्थ ‘रख देना’ हो सकता है, पर न्याय और तूफान के संदर्भ में यहाँ बलपूर्वक नीचे गिराने का भाव संभावित है। भविष्यकाल हिन्दी की भविष्यद्वाणी में स्वाभाविक है।
- source_word: בְּיָד
  choice: अपने हाथ से
  rationale: शाब्दिक शारीरिक बिंब प्रत्यक्ष और नियंत्रित कार्यवाही को उभारता है; इसे केवल अमूर्त ‘शक्ति से’ नहीं बनाया गया।
theological_decisions:
- issue: ‘बलवान और सामर्थी जन’ की पहचान
  choice: कर्ता को अनिर्दिष्ट रखा गया है।
  alternative: अश्शूर, अश्शूर का राजा, प्रभु का कोई न्यायकारी साधन, अथवा स्वयं प्रभु
  rationale: मूल पद तत्काल पहचान नहीं बताता, यद्यपि संदर्भ उसे प्रभु के न्याय के साधन के रूप में समझने की दिशा देता है। अनुवाद किसी एक पहचान को आरोपित नहीं करता।
- issue: अंतिम उपवाक्य का कर्ता और कर्म
  choice: व्यक्तिगत कर्ता को ‘वह’ से जारी रखा और कर्म को ‘उसे’ कहकर संदर्भगत परंतु अनिर्दिष्ट रखा गया है।
  alternative: क्रिया का कर्ता स्वयं प्रभु मानना; अथवा गर्व के मुकुट/नगर को स्पष्ट कर्म बनाना
  rationale: एकवचन क्रिया व्यक्तिगत कर्ता से मेल खाती है, लेकिन कर्म मूल में व्यक्त नहीं है। हिन्दी के लिए सर्वनाम आवश्यक है; इसलिए संदर्भ से ‘उसे’ दिया गया, पर विशिष्ट वस्तु नहीं जोड़ी गई।
- issue: הִנִּיחַ की तीव्रता
  choice: ‘पटक देगा’
  alternative: ‘धरती पर रख देगा’ या ‘नीचा कर देगा’
  rationale: क्रिया स्वयं अपेक्षाकृत व्यापक है, पर ओलों, विनाशकारी आँधी और उमड़ते जल का रूपक बलपूर्ण गिराए जाने का समर्थन करता है; वैकल्पिक कम तीव्र अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज भविष्यद्वाणीपरक रजिस्टर रखा गया है। ‘देखो’, ‘प्रभु’, ‘विनाशकारी आँधी’ और ‘प्रचंड जलधारा’ ऊँचे काव्यात्मक स्वर को बनाए रखते हैं। मुख्य पाठ में [b] को संबंधित अंतिम क्रिया के साथ जोड़ना आवश्यक है।
