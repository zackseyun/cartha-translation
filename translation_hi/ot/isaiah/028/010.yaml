base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/010.yaml
  text: For it is[a], “Command on command, command on command, line on line, line on line, a little here, a little there.”
translation:
  language: hi
  text: 'क्योंकि[a]: “आज्ञा पर आज्ञा, आज्ञा पर आज्ञा; डोरी पर डोरी, डोरी पर डोरी; थोड़ा यहाँ, थोड़ा वहाँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप: “आज्ञा के लिए आज्ञा, आज्ञा के लिए आज्ञा; डोरी के लिए डोरी, डोरी के लिए डोरी; थोड़ा वहाँ, थोड़ा वहाँ।” इब्रानी अत्यंत दोहरावपूर्ण है और संभवतः उपहासपूर्ण, बच्चों जैसी बोली की नकल करता है।'
    reason: शाब्दिक विकल्प और अलंकारिक प्रभाव
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में व्यक्त उपहास या आरोप की व्याख्या आरम्भ करता है; ‘क्योंकि’ प्रसंगगत संबंध को स्वाभाविक ढंग से दिखाता है।
- source_word: צַו
  choice: आज्ञा
  rationale: यदि इसे צוה धातु से समझा जाए, तो इसका अर्थ आदेश या निर्देश है। ‘आज्ञा’ संक्षिप्त है और दोहराव की कटी-फटी लय बनाए रखता है।
- source_word: לָצָו
  choice: पर आज्ञा
  rationale: 'इस दोहरावपूर्ण रचना में ל को हिन्दी मुहावरे के अनुसार ‘पर’ से व्यक्त किया गया है: ‘आज्ञा पर आज्ञा।’'
- source_word: קַו
  choice: डोरी
  rationale: यह संज्ञा सामान्यतः नापने की डोरी या रेखा को सूचित करती है। ‘डोरी’ मूल ठोस बिंब को बनाए रखती है और लय में संक्षिप्त रहती है।
- source_word: לָקָו
  choice: पर डोरी
  rationale: לָצָו के समान समानांतर रचना बनाए रखने के लिए इसे ‘पर डोरी’ किया गया है।
- source_word: זְעֵיר
  choice: थोड़ा
  rationale: इसका अर्थ ‘थोड़ा’ या ‘कम’ है; ‘थोड़ा’ सरल और लयात्मक है।
- source_word: שָׁם
  choice: वहाँ
  rationale: इस क्रियाविशेषण का सीधा अर्थ ‘वहाँ’ है। मुख्य पाठ में हिन्दी के स्वाभाविक वितरणात्मक मुहावरे ‘यहाँ…वहाँ’ का प्रयोग किया गया है, जबकि शाब्दिक दोहराव पादटिप्पणी में रखा गया है।
- source_word: זְעֵיר שָׁם ... זְעֵיר שָׁם
  choice: थोड़ा यहाँ, थोड़ा वहाँ
  rationale: इब्रानी में ‘वहाँ…वहाँ’ दोहराया गया है, पर हिन्दी में वितरण का स्वाभाविक मुहावरा ‘यहाँ…वहाँ’ है। यह छोटा-सा गतिशील समायोजन उपहासपूर्ण, गाने-जैसी लय को समझने योग्य बनाता है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: क्या पद को सीधी शिक्षा के रूप में समझा जाए या उपहासपूर्ण, बाल-सुलभ लय वाली उद्धृत वाणी के रूप में
  choice: उद्धरण-चिह्नों और दोहरावपूर्ण लय द्वारा उपहासपूर्वक कही गई वाणी के रूप में प्रस्तुत किया गया है; ‘वे कहते हैं’ को व्याकरणगत रूप से निहित वक्ताओं को स्पष्ट करने हेतु रखा गया है।
  alternative: बिना स्पष्ट उपहास के शिक्षण-पद्धति का सीधा कथन
  rationale: यशायाह 28:9–13 के प्रसंग में अगुवे भविष्यद्वक्ता की शिक्षा का बाल-सुलभ दोहराव कहकर उपहास करते प्रतीत होते हैं। अनुवाद इस संभावना को सुरक्षित रखता है, पर मूल से बाहर कोई तिरस्कारसूचक पद नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। छोटे खंडों तथा जानबूझकर किए गए दोहराव से इब्रानी की कटी-फटी, गाने-जैसी लय सुरक्षित की गई है। ‘रेखा’ की अपेक्षा ‘डोरी’ मूल नापने की डोरी के बिंब को अधिक स्पष्ट रखती है।
