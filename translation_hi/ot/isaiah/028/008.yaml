  text: כִּ֚י כָּל שֻׁלְחָנ֔וֹת מָלְא֖וּ קִ֣יא צֹאָ֑ה בְּלִ֖י מָקֽוֹם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/008.yaml
  text: For all the tables are full of vomit and filth, with no place left.
translation:
  language: hi
  text: क्योंकि सारी मेज़ें उलटी और मल से भरी हैं—कहीं कोई जगह नहीं बची।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִיא
  choice: उलटी
  rationale: यह शब्द वमन या उलटी को दर्शाता है; आधुनिक हिन्दी में ‘उलटी’ सीधा, स्वाभाविक और सामान्य पाठक के लिए स्पष्ट है।
- source_word: צֹאָה
  choice: मल
  rationale: यहाँ गंदगी, विशेषतः मल-मूत्र जैसी अशुद्ध वस्तु का कठोर चित्र है। ‘मल’ मूल की तीव्रता बनाए रखते हुए गरिमापूर्ण और स्पष्ट है।
- source_word: בְּלִי מָקוֹם
  choice: कहीं कोई जगह नहीं बची
  rationale: शाब्दिक अर्थ ‘जगह के बिना’ है। सन्दर्भ में आशय है कि मेज़ों पर कोई खाली या स्वच्छ स्थान शेष नहीं है; यह हिन्दी रूप उस संक्षिप्त इब्रानी अभिव्यक्ति को स्वाभाविक ढंग से व्यक्त करता है, बिना ‘स्वच्छ’ शब्द स्पष्ट रूप से जोड़े।
theological_decisions: []
