  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। मूल पद की घृणास्पद और आरोपात्मक छवि को नरम नहीं किया गया; इब्रानी की अंतिम संक्षिप्त अभिव्यक्ति को डैश के द्वारा प्रभावशाली बनाया गया है।
