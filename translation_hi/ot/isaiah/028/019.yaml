base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/019.yaml
  text: As often as it passes through[a], it will seize you; for morning by morning it will pass through, by day and by night[b]; and it will be sheer terror to understand the message.
translation:
  language: hi
  text: जब-जब वह होकर गुजरेगा,[a] वह तुम्हें अपनी चपेट में ले लेगा; क्योंकि वह सुबह-दर-सुबह, दिन और रात, होकर गुजरेगा। संदेश को समझना ही घोर भय होगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जितनी बार वह होकर गुजरेगा, वह तुम्हें अपनी चपेट में ले लेगा।”
    reason: lexical_alternative
  - marker: b
    text: या, “उस समाचार को समझना ही घोर भय होगा।” कुछ अनुवाद “संदेश को सुनना ही भयावह होगा” करते हैं और ‘समझना’ को सुनी हुई बात के साथ निकटता से जोड़ते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: מִדֵּי עָבְרוֹ
  choice: जितनी बार वह आगे बढ़ेगा
  rationale: מִדֵּי के आवृत्तिमूलक अर्थ को स्पष्ट रखता है, जबकि עבר के विनाशकारी रूप से क्षेत्र में होकर आगे बढ़ने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִקַּח אֶתְכֶם
  choice: वह तुम्हें अपनी चपेट में ले लेगा
  rationale: לקח का मूल भाव ‘लेना’ है; न्याय के प्रसंग में ‘अपनी चपेट में लेना’ शत्रुतापूर्ण पकड़ और बहा ले जाने वाले प्रहार की छवि को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַבֹּקֶר בַבֹּקֶר
  choice: हर सुबह
  rationale: दोहराव वाले इब्रानी वितरणात्मक मुहावरे का सहज आधुनिक हिन्दी समतुल्य है।
- source_word: בַיּוֹם וּבַלָּיְלָה
  choice: दिन और रात
  rationale: निरंतरता बताने वाले इस युग्म को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: רַק זְוָעָה
  choice: केवल आतंक
  rationale: רַק के सीमाबोधक बल और זְוָעָה के तीव्र भय को निकटता से सुरक्षित रखता है।
- source_word: הָבִין שְׁמוּעָה
  choice: उस संदेश को समझना
  rationale: הָבִין का सीधा अर्थ ‘समझना’ रखा गया है; שְׁמוּעָה के लिए ‘संदेश’ इस प्रसंग में सुबोध है, यद्यपि ‘समाचार/वृत्तांत’ भी संभव हैं।
theological_decisions:
- issue: एकवचन पुल्लिंग क्रियाओं का कर्ता
  choice: ‘वह’ को पिछले पद के प्रबल प्रकोप/कोड़े की ओर संकेत करने दिया गया है
  alternative: इस पद में ही ‘वह प्रबल प्रकोप’ स्पष्ट रूप से जोड़ना
  rationale: इब्रानी पाठ कर्ता को पिछले संदर्भ से ग्रहण करता है; सर्वनाम रखने से अनावश्यक व्याख्यात्मक शब्द नहीं जुड़ते।
- issue: अंतिम खंड की संक्षिप्त और कठिन वाक्य-रचना
  choice: ‘उस संदेश को समझना ही केवल आतंक का कारण होगा’
  alternative: ‘उस संदेश को सुनना ही आतंक होगा’
  rationale: הָבִין के ‘समझना’ अर्थ को बनाए रखते हुए कठिन संबंध को पठनीय बनाया गया है; सुनने और समझने के बीच की संभावित व्याख्यात्मक भिन्नता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आवृत्ति, निरंतरता और अंतिम खंड की असहज धार्मिक-वाणीगत तीव्रता को यथासंभव सुरक्षित रखा गया है।
