  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बटोरी’ की पुनरावृत्ति मूल इब्रानी के सजातीय शब्द-प्रयोग को दर्शाती है। दुर्लभ शब्दों से उत्पन्न अनिश्चितता को मुख्य पाठ में पठनीय रखते हुए पादटिप्पणियों में सुरक्षित किया गया है; ‘वे’ का संदर्भ जानबूझकर अनिर्दिष्ट रखा गया है, क्योंकि इब्रानी किसी स्पष्ट मानवीय कर्ता का उल्लेख नहीं करता।
