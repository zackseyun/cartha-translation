  text: And your spoil will be gathered like the gathering of locusts[a]; like the rushing of swarms[b], they rush upon it.
translation:
  language: hi
  text: तुम्हारी लूट ऐसे बटोरी जाएगी, जैसे टिड्डियाँ बटोरती हैं[a]; जैसे झुंड उमड़ पड़ते हैं[b], वैसे ही वे उस पर उमड़ पड़ते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जैसे भक्षक टिड्डी बटोरती है’; इब्रानी शब्द חָסִיל टिड्डी के किसी विशेष प्रकार या अवस्था को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: दूसरी उपमा का इब्रानी पाठ कठिन है। इसका अनुवाद ‘जैसे टिड्डियों के दल आक्रमण करते हैं’ या ‘जैसे टिड्डियाँ इधर-उधर उमड़ती हैं’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֻסַּף
  choice: बटोरी जाएगी
  rationale: אסף का यह निष्क्रिय रूप संदर्भ में भावी कार्रवाई बताता है। ‘बटोरी जाएगी’ युद्ध में प्राप्त लूट को इकट्ठा करने का स्वाभाविक हिन्दी प्रयोग है।
- source_word: שְׁלַלְכֶם
  choice: तुम्हारी लूट
  rationale: שׁלל युद्ध में छीनी गई संपत्ति या लूट को दर्शाता है; ‘लूट’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: אֹסֶף
  choice: जैसे ... बटोरती हैं
  rationale: यह אסף से बना सजातीय संज्ञा-रूप है। हिन्दी में क्रिया की पुनरावृत्ति द्वारा मूल की शब्दगत प्रतिध्वनि और तुलना को स्वाभाविक ढंग से रखा गया है।
- source_word: הֶחָסִיל
  choice: टिड्डियाँ
  rationale: חָסִיל किसी विशेष प्रकार या अवस्था की भक्षक टिड्डी को सूचित कर सकता है। मुख्य पाठ में सामान्य ‘टिड्डियाँ’ सहज है, जबकि विशिष्ट अर्थ पादटिप्पणी में रखा गया है।
- source_word: כְּמַשַּׁק
  choice: जैसे ... उमड़ पड़ते हैं
  rationale: दुर्लभ מַשָּׁק तीव्र गति, धावे या आक्रमण का बोध देता है। ‘उमड़ पड़ना’ झुंड की आकस्मिक और प्रबल गति को व्यक्त करता है।
- source_word: גֵּבִים
  choice: झुंड
  rationale: यह दुर्लभ और कठिन शब्द प्रसंग में झुंड या उमड़ती हुई भीड़ का संकेत देता प्रतीत होता है। ‘झुंड’ टिड्डियों की छवि से मेल खाता है, पर किसी अत्यधिक निश्चित पहचान को मुख्य पाठ में नहीं थोपता।
- source_word: שׁוֹקֵק
  choice: उमड़ पड़ेंगे
  rationale: कृदंत तेज, उत्सुक या बार-बार की गतिशीलता दर्शाता है। हिन्दी का भावी बहुवचन पहले खंड के भावी संदर्भ से मेल खाता और दृश्य की सजीवता बनाए रखता है।
- source_word: בּוֹ
  choice: उस पर
  rationale: पूर्वसर्ग और सर्वनाम का संकेत लूट की ओर है; ‘उस पर’ किसी वस्तु पर झपटने या टूट पड़ने की छवि के अनुकूल है।
