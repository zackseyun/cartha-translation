    reason: lexical_alternative
lexical_decisions:
- source_word: תַּהֲרוּ
  choice: गर्भ में धारण करते हो
  rationale: हरा धातु के गर्भधारण-संबंधी रूपक को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: חֲשַׁשׁ
  choice: भूसा
  rationale: हल्की, सूखी और शीघ्र जलने वाली निरर्थक सामग्री का बोध कराता है तथा न्याय के अग्नि-चित्र के अनुकूल है।
- source_word: תֵּלְדוּ
  choice: जन्म देते हो
  rationale: यालद के प्रसव-रूपक को सीधे और सहज ढंग से व्यक्त करता है।
- source_word: קַשׁ
  choice: पराली
  rationale: कटाई के बाद बची सूखी डंठल-सामग्री के लिए वर्तमान हिन्दी का परिचित शब्द है; यह भूसे के साथ समानांतरता और ज्वलनशीलता दोनों बनाए रखता है।
- source_word: רוּחֲכֶם
  choice: तुम्हारी साँस
  rationale: रूअह के ठोस अर्थ ‘साँस’ को सामने रखता है, जबकि पादटिप्पणी ‘आत्मा’ और ‘वायु’ की वास्तविक शब्दार्थगत संभावनाएँ सुरक्षित रखती है।
- source_word: אֵשׁ
  choice: आग
  rationale: मूल के सीधे अग्नि-बिंब को स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: תֹּאכַלְכֶם
  choice: तुम्हें भस्म कर देगी
  rationale: आग के कर्ता होने पर अखल (‘खा जाना/निगल जाना’) की विनाशकारी शक्ति को हिन्दी में मुहावरेदार ढंग से व्यक्त करता है।
theological_decisions:
- issue: भविष्यद्वाणी के न्याय-बिंब में רוּחֲכֶם का अर्थ
  choice: तुम्हारी साँस
  alternative: तुम्हारी आत्मा; तुम्हारी वायु
  rationale: ‘साँस’ लोगों से निकलने वाली उसी वस्तु को उनके विनाश का साधन दिखाने वाला सजीव बिंब बनाए रखती है। पादटिप्पणी अन्य अर्थों को खुला रखती है और पद के धर्मवैचारिक तनाव को अनावश्यक रूप से हल नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और भविष्यद्वाणी के तीखे न्याय-बिंब के अनुरूप। बहुवचन ‘तुम’ मूल के द्वितीय पुरुष बहुवचन को दर्शाता है।
