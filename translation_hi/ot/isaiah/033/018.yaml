base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/018.yaml
  text: 'Your heart will meditate on terror: “Where is the scribe? Where is the one who weighs? Where is the one who counts the towers?”[a][b]'
translation:
  language: hi
  text: 'तुम्हारा मन भय पर विचार करेगा: “लिपिक कहाँ है? तौलनेवाला कहाँ है? बुर्जों को गिननेवाला कहाँ है?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भय पर मनन करेगा” अथवा “भय के विषय में मन ही मन बोलेगा।” इब्रानी क्रिया आंतरिक मनन या धीमे स्वर में बोलने—दोनों का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: “लिपिक… तौलनेवाला… बुर्जों को गिननेवाला” सम्भवतः कर या नजराने के आकलन, अथवा घेराबंदी के लिए गणना करनेवाले विदेशी अधिकारियों की ओर संकेत करता है।
    reason: cultural_note
lexical_decisions:
- source_word: לִבְּךָ
  choice: तुम्हारा मन
  rationale: לֵב यहाँ सोच-विचार करनेवाले भीतरी व्यक्तित्व को दर्शाता है। आधुनिक हिन्दी में इस संज्ञानात्मक अर्थ के लिए ‘मन’ स्वाभाविक है, जबकि मूल का आंतरिकता-बोध बना रहता है।
- source_word: יֶהְגֶּה
  choice: विचार करेगा
  rationale: הגה मनन करने, मन ही मन सोचने, अथवा धीमे स्वर में बोलने का अर्थ दे सकता है। इस प्रसंग में बीते आतंक पर आंतरिक चिंतन प्रमुख है; अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: אֵימָה
  choice: आतंक
  rationale: यह शब्द तीव्र भय या दहशत का बोध कराता है; ‘आतंक’ उसकी तीव्रता को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: סֹפֵר
  choice: लिपिक
  rationale: यह कृदंत लिखने, अभिलेख रखने या गणना करनेवाले अधिकारी को सूचित कर सकता है। ‘लिपिक’ प्रशासनिक भूमिका को व्यक्त करता है, पर उसके विशिष्ट कार्य को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: שֹׁקֵל
  choice: तौलनेवाला
  rationale: שקל का शाब्दिक अर्थ ‘तौलना’ है। यह पारदर्शी अनुवाद कर या चाँदी तौलने की सम्भावित पृष्ठभूमि को मुख्य पाठ में निश्चित तथ्य नहीं बनाता।
- source_word: סֹפֵר אֶת הַמִּגְדָּלִים
  choice: बुर्जों को गिननेवाला
  rationale: यहाँ ספר का स्वाभाविक अर्थ ‘गिनना’ है। ‘बुर्ज’ किलेबंदी से जुड़े מִגְדָּלִים की ठोस सैन्य छवि को हिन्दी में सहजता से व्यक्त करता है।
- source_word: אַיֵּה
  choice: कहाँ है?
  rationale: तीनों एकवचन पदों के साथ दोहराया गया प्रश्न मूल की ललकारपूर्ण और विजय-सूचक लय को बनाए रखता है।
