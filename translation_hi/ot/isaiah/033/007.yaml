lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है; ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल का बल बनाए रखता है।
- source_word: אֶרְאֶלָּם
  choice: उनके वीर
  rationale: यह दुर्लभ और विवादित शब्द प्रसंग में सम्भवतः वीर या पराक्रमी जनों को सूचित करता है; प्रत्यय का अर्थ ‘उनके’ है। अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: צָעֲקוּ
  choice: पुकार रहे हैं
  rationale: क्रिया संकट या दुःख में ऊँची पुकार को व्यक्त करती है। भविष्यद्वाणी की सजीव चित्रात्मक शैली के लिए हिन्दी वर्तमान काल उपयुक्त है।
- source_word: חֻצָה
  choice: बाहर
  rationale: यह बाहर या खुले स्थान की ओर संकेत करता है। ‘बाहर’ मूल की अनिर्दिष्टता को सुरक्षित रखता है और अनावश्यक रूप से ‘गलियों में’ नहीं जोड़ता।
- source_word: מַלְאֲכֵי שָׁלוֹם
  choice: शान्ति के दूत
  rationale: מַלְאָךְ का अर्थ दूत, संदेशवाहक या राजदूत हो सकता है। सन्धि और वार्ता के प्रसंग में ये मानवीय शान्ति-दूत हैं; व्यापक अर्थ वाला अनुवाद रखा गया है।
- source_word: מַר יִבְכָּיוּן
  choice: फूट-फूटकर रो रहे हैं
  rationale: מַר यहाँ रोने की कटु और तीव्र दशा को क्रियाविशेषण रूप में व्यक्त करता है। यह हिन्दी मुहावरा उस गहरे विलाप को स्वाभाविक ढंग से प्रकट करता है।
theological_decisions:
- issue: אֶרְאֶלָּם की पहचान
  choice: मानवीय वीर या पराक्रमी जन
  alternative: ‘अरीएल के जन’, ‘परमेश्वर के सिंह’, अथवा कोई अन्य दुर्लभ उपाधि
  rationale: निकटवर्ती प्रसंग में विनाश, निष्फल कूटनीति और सार्वजनिक विलाप है; इसलिए मानवीय वीरों का अर्थ सबसे अधिक संगत है। फिर भी शब्द की वास्तविक शाब्दिक अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
- issue: מַלְאֲכֵי שָׁלוֹם का आशय
  choice: शान्ति के लिए भेजे गए मानवीय दूत
  alternative: ‘शान्ति के राजदूत’ या सामान्य ‘सन्देशवाहक’
  rationale: प्रसंग राजनीतिक वार्ता और टूटी हुई वाचा का है, इसलिए स्वर्गदूतों के बजाय मानवीय प्रतिनिधि अभिप्रेत हैं। ‘दूत’ पद राजनयिक अर्थ को सम्भव रखते हुए मूल की व्यापकता भी बचाता है।
