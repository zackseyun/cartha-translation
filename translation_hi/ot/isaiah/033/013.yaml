id: ISA.33.13
reference: Isaiah 33:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שִׁמְע֥וּ רְחוֹקִ֖ים אֲשֶׁ֣ר עָשִׂ֑יתִי וּ/דְע֥וּ קְרוֹבִ֖ים גְּבֻרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/013.yaml
  text: Hear[a], you who are far away, what I have done; and know, you who are near[b], my might.
translation:
  language: hi
  text: हे दूर के लोगो[a], सुनो कि मैंने क्या किया है; और हे पास के लोगो, मेरे पराक्रम को जानो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दूरवाले’ / ‘पासवाले’। इब्रानी में ये बहुवचन विशेषण लोगों के समूहों के लिए संज्ञा के रूप में प्रयुक्त हुए हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरी सामर्थ्य’ अथवा ‘मेरी शक्ति’।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक रूप है। ‘सुनो’ सीधे आह्वान और भविष्यद्वाणी की गंभीरता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: רְחוֹקִים
  choice: हे दूर रहनेवालो
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में संबोधन है। यह अनुवाद संबोधन और ‘निकट’ के साथ उसके विरोध को स्पष्ट रखता है।
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: कि मैंने क्या किया है
  rationale: सम्बन्धवाचक अव्यय के साथ प्रथम पुरुष एकवचन पूर्ण क्रिया है। यह रूप सम्पन्न कार्य और उसकी वर्तमान प्रासंगिकता दोनों को स्वाभाविक हिन्दी में व्यक्त कर सकता है।
- source_word: וּדְעוּ
  choice: और ... जानो
  rationale: ידע का बहुवचन आज्ञार्थक रूप है। ‘जानो’ मूल अर्थ और ‘सुनो’ के साथ समानांतरता को बनाए रखता है; ‘स्वीकार करो’ अनावश्यक रूप से अधिक व्याख्यात्मक होता।
- source_word: קְרוֹבִים
  choice: हे निकट रहनेवालो
  rationale: यह बहुवचन विशेषण भी संज्ञात्मक संबोधन है और רְחוֹקִים के साथ स्पष्ट अलंकारिक विरोध बनाता है।
- source_word: גְּבֻרָתִי
  choice: मेरे पराक्रम
  rationale: גְּבוּרָה सामर्थ्य, शक्ति या पराक्रम को सूचित करता है। ‘पराक्रम’ यहाँ परमेश्वर की प्रकट सामर्थ्य का गरिमापूर्ण और संदर्भानुकूल बोध देता है, बिना इसे केवल किसी एक ‘पराक्रमी कार्य’ तक सीमित किए।
theological_decisions:
- issue: प्रथम पुरुष क्रियाओं और प्रत्यय से सूचित वक्ता की पहचान
  choice: वक्ता संदर्भ में यहोवा हैं, पर पद में उनका नाम न होने के कारण अनुवाद में नाम नहीं जोड़ा गया।
  alternative: ‘यहोवा ने क्या किया है’ अथवा ‘यहोवा का पराक्रम’ कहकर वक्ता को स्पष्ट करना।
  rationale: ‘मैंने किया’ और ‘मेरे पराक्रम’ प्रसंगानुसार यहोवा की ओर संकेत करते हैं, किन्तु मूल पंक्ति में निहित कर्ता को स्पष्ट नाम देकर अनुवाद में जोड़ना आवश्यक नहीं है।
- issue: גְּבֻרָתִי का अमूर्त गुण या विशिष्ट कार्य
  choice: अमूर्त अर्थ ‘मेरे पराक्रम’ रखा गया।
  alternative: ‘मेरा पराक्रमी कार्य’।
  rationale: संदर्भ किसी प्रदर्शित सामर्थ्य की ओर संकेत कर सकता है, फिर भी संज्ञा स्वयं ‘पराक्रम/सामर्थ्य’ का व्यापक अर्थ रखती है; इसलिए विशिष्ट कार्य का अर्थ थोपना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर भविष्यद्वाणी-संबंधी संबोधन रखा गया है। ‘हे ... रहनेवालो’ सामान्य पाठक के लिए स्पष्ट है और दूर/निकट की समानांतर संरचना बचाता है। ‘पराक्रम’ गरिमापूर्ण है, पर अत्यधिक पुरातन नहीं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
