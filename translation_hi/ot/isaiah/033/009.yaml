base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/009.yaml
  text: The land mourns and withers[a]; Lebanon is ashamed and withers away. Sharon has become like the Arabah[b], and Bashan and Carmel shake off their leaves.
translation:
  language: hi
  text: भूमि विलाप करती और मुरझाती है; लबानोन लज्जित और मुरझाया हुआ है। शारोन अराबा[a] के समान हो गया है, और बाशान और कर्मेल अपने पत्ते झाड़ते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रेगिस्तानी मैदान के समान” अथवा “निर्जन प्रदेश के समान।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “बाशान और कर्मेल झाड़ते हैं”; आशय है कि उनकी हरियाली झड़ जाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבַל
  choice: शोक मनाता है
  rationale: क्रिया का सामान्य अर्थ शोक करना है; देश का मानवीकरण बनाए रखते हुए यह उजाड़ होने का भाव भी जगाती है।
- source_word: אֻמְלְלָה
  choice: मुरझाता है
  rationale: निर्बल पड़ने, कुम्हलाने या सूखने का भाव; वनस्पति-संबंधी चित्र के लिए स्वाभाविक है।
- source_word: אֶרֶץ
  choice: देश
  rationale: यहाँ समूची पृथ्वी नहीं, विनाश से प्रभावित भूभाग अभिप्रेत है; हिन्दी में 'देश' इस सामूहिक भूक्षेत्र को सहजता से व्यक्त करता है।
- source_word: הֶחְפִּיר
  choice: लज्जित होकर
  rationale: मूल क्रिया लज्जित या अपमानित होने का बोध देती है और लबानोन के काव्यात्मक मानवीकरण को बनाए रखती है।
- source_word: לְבָנוֹן
  choice: लबानोन
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: קָמַל
  choice: सूख जाता है
  rationale: कुम्हलाने और सूख जाने की वनस्पति-छवि व्यक्त करता है तथा पहले प्रयुक्त 'मुरझाता' से हल्का भेद बनाए रखता है।
- source_word: הַשָּׁרוֹן
  choice: शारोन
  rationale: क्षेत्र के नाम का हिन्दी लिप्यंतरण; मूल का निश्चित पद हिन्दी में नाम से ही स्वाभाविक रूप से व्यक्त है।
- source_word: כָּעֲרָבָה
  choice: अराबा के समान
  rationale: भौगोलिक संकेत को सुरक्षित रखा गया है; इसके रेगिस्तानी मैदान या निर्जन प्रदेश वाले अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: נֹעֵר
  choice: अपने पत्ते झाड़ देते हैं
  rationale: मूल में झाड़ने या झटक देने की क्रिया है, पर कर्म व्यक्त नहीं है; संदर्भगत पर्णहीनता को स्पष्ट करने के लिए 'पत्ते' जोड़ा गया है, और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: בָּשָׁן
  choice: बाशान
  rationale: क्षेत्र के नाम का मानक हिन्दी लिप्यंतरण।
- source_word: כַרְמֶל
  choice: कर्मेल
  rationale: स्थान-नाम का लिप्यंतरण; मूल में यहाँ 'पर्वत' शब्द स्पष्ट रूप से नहीं है।
