  text: וְ/הָי֥וּ עַמִּ֖ים מִשְׂרְפ֣וֹת שִׂ֑יד קוֹצִ֥ים כְּסוּחִ֖ים בָּ/אֵ֥שׁ יִצַּֽתּוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/012.yaml
  text: And the peoples will become burnings of lime; like cut thornbushes[a], they will be burned in the fire.
translation:
  language: hi
  text: और जनसमुदाय चूने की भट्टियों के दहकने के समान हो जाएँगे; काँटों की कटी हुई झाड़ियों के समान, वे आग में जल उठेंगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे आग पकड़ लेंगे” अथवा “वे प्रज्वलित होंगे।” इब्रानी क्रिया आग पकड़ने या सुलग उठने के भाव पर भी बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: और ... हो जाएँगे
  rationale: היה के साथ विधेय संज्ञा यहाँ न्याय के फलस्वरूप एक नई दशा में पहुँचने का भाव देती है; इसलिए केवल ‘होंगे’ की अपेक्षा ‘हो जाएँगे’ अधिक उपयुक्त है।
- source_word: עַמִּים
  choice: जनसमुदाय
  rationale: बहुवचन עַמִּים सामूहिक रूप से विभिन्न लोगों या जनों को सूचित करता है। ‘जनसमुदाय’ व्यापक सामूहिक अर्थ रखता है और आधुनिक हिन्दी में ‘जातियाँ’ से उत्पन्न हो सकने वाले जाति-व्यवस्था संबंधी भ्रम से बचाता है।
- source_word: מִשְׂרְפוֹת שִׂיד
  choice: जलकर चूने के समान
  rationale: इब्रानी पदबंध अत्यंत संक्षिप्त है और चूना बनाने वाली प्रचंड जलन का चित्र प्रस्तुत करता है। हिन्दी में शब्दशः ‘चूने के जलाव’ अस्वाभाविक होता; यह रूप दहन और उसके विनाशकारी परिणाम, दोनों को स्पष्ट रखते हुए उपमा को बनाए रखता है।
- source_word: קוֹצִים כְּסוּחִים
  choice: काटी हुई कँटीली झाड़ियाँ
  rationale: קוֹצִים कँटीली वनस्पति को और כְּסוּחִים उसके काटे जाने को व्यक्त करता है। यह अनुवाद आग में डालने के लिए काटी गई सूखी कँटीली झाड़ियों का स्वाभाविक चित्र देता है।
- source_word: בָּאֵשׁ
  choice: आग में
  rationale: संदर्भ में בְּ का स्थानवाचक अर्थ स्वाभाविक है और आग में डाली गई झाड़ियों के बिंब के अनुकूल है।
- source_word: יִצַּתּוּ
  choice: जला दिए जाएँगे
  rationale: क्रिया आग लगाए जाने, आग पकड़ने या जलने का भाव दे सकती है। न्याय के इस चित्र में कर्मवाच्य ‘जला दिए जाएँगे’ विनाश के परिणाम को स्पष्ट करता है, जबकि आग पकड़ने का संभावित बल पादटिप्पणी में सुरक्षित है।
