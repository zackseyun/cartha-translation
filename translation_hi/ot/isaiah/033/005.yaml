id: ISA.33.5
reference: Isaiah 33:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: נִשְׂגָּ֣ב יְהוָ֔ה כִּ֥י שֹׁכֵ֖ן מָר֑וֹם מִלֵּ֣א צִיּ֔וֹן מִשְׁפָּ֖ט וּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/005.yaml
  text: Yahweh is exalted[a], for he dwells on high; he has filled Zion with justice and righteousness.
translation:
  language: hi
  text: याहवे महान है, क्योंकि वह ऊँचे स्थान पर निवास करता है[a]; उसने सिय्योन को न्याय और धार्मिकता से भर दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऊँचाइयों में निवास करता है।”
    reason: מָרוֹם को एकवचन सामूहिक ‘ऊँचा स्थान’ या बहुवचन भाव वाले ‘ऊँचाइयाँ’ के रूप में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: נִשְׂגָּב
  choice: महान है
  rationale: यह रूप याहवे की ऊँची और महिमामय स्थिति बताता है। शाब्दिक ‘ऊँचा है’ आधुनिक हिन्दी में अस्पष्ट या अस्वाभाविक लग सकता है; ‘महान है’ उसके सम्मानसूचक बल को स्वाभाविक रूप से व्यक्त करता है, जबकि अगला वाक्यांश स्थानगत ऊँचाई को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ कारण-संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שֹׁכֵן מָרוֹם
  choice: वह ऊँचे स्थान पर निवास करता है
  rationale: कृदंत निरंतर निवास का भाव देता है और מָרוֹם ऊँचे क्षेत्र या स्थान की स्थानगत छवि बनाए रखता है।
- source_word: מִלֵּא
  choice: उसने ... भर दिया है
  rationale: इब्रानी पूर्ण क्रिया को ऐसे पूर्ण कार्य के रूप में प्रस्तुत किया गया है जिसका परिणाम वर्तमान में बना हुआ है।
- source_word: צִיּוֹן
  choice: सिय्योन
  rationale: यह स्थान-नाम का हिन्दी बाइबलीय रूप है और उसके वाचागत तथा काव्यात्मक संबंधों को बनाए रखता है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: צְדָקָה के साथ युग्म में यह केवल न्यायिक निर्णय नहीं, बल्कि सामाजिक और नैतिक न्याय-व्यवस्था को सूचित करता है।
- source_word: צְדָקָה
  choice: धार्मिकता
  rationale: यह नैतिक सच्चाई और सही आचरण का भाव बनाए रखता है तथा מִשְׁפָּט से इसका भेद स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: מִשְׁפָּט וּצְדָקָה का युग्म
  choice: न्याय और धार्मिकता
  alternative: न्याय और नेकी
  rationale: दो अलग शब्द रखकर सामाजिक न्याय और नैतिक खराई—दोनों आयाम सुरक्षित रहते हैं; उन्हें एक ही हिन्दी शब्द में मिला नहीं दिया गया है।
- issue: נִשְׂגָּב में ऊँचाई और महिमा का संयुक्त भाव
  choice: महान है
  alternative: ऊँचा है / सर्वोच्च है
  rationale: ‘महान है’ आधुनिक हिन्दी में सम्मान और उत्कर्ष का भाव स्वाभाविक रूप से देता है। स्थानगत ऊँचाई अगली पंक्ति में अलग से बनी रहती है, इसलिए दोनों वाक्यांशों को एक ही अर्थ में समेटा नहीं गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। समानांतर काव्यात्मक कथनों को अर्धविराम से जोड़ा गया है; ‘न्याय और धार्मिकता’ की पारंपरिक धर्मवैचारिक जोड़ी को अर्थगत भेद सहित रखा गया है।
