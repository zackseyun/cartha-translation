source:
  edition: WLC
  text: וּ/בַל יֹאמַ֥ר שָׁכֵ֖ן חָלִ֑יתִי הָ/עָ֛ם הַ/יֹּשֵׁ֥ב בָּ֖/הּ נְשֻׂ֥א עָוֺֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/024.yaml
  text: And no inhabitant will say[a], “I am sick”; the people who dwell there are forgiven their iniquity.
translation:
  language: hi
  text: और कोई निवासी यह न कहेगा, “मैं बीमार हूँ”; उसमें रहने वाले लोगों का अधर्म क्षमा कर दिया गया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनका दोष उठा लिया गया है” अथवा “उनका पाप दूर कर दिया गया है।” इब्रानी मुहावरे में अधर्म को उठा लेने या हटा देने की बात है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַל יֹאמַר
  choice: और ... कोई भी यह न कहेगा
  rationale: संयोजक וּ और प्रबल निषेध בַל को स्वाभाविक हिन्दी भविष्यकाल में व्यक्त किया गया है।
- source_word: שָׁכֵן
  choice: वहाँ रहने वाला
  rationale: यह एकवचन रूप किसी भी निवासी के लिए सामान्य रूप से प्रयुक्त है; प्रसंग के स्थान-सूचक भाव को स्पष्ट करने के लिए ‘वहाँ’ रखा गया है।
- source_word: חָלִיתִי
  choice: मैं बीमार हूँ
  rationale: חלה बीमारी या दुर्बलता की अवस्था बताता है; प्रत्यक्ष कथन में वर्तमान अवस्था स्वाभाविक हिन्दी में व्यक्त होती है।
- source_word: הָעָם הַיֹּשֵׁב בָּהּ
  choice: उसमें रहने वाले लोग
  rationale: सामूहिक एकवचन भाव को हिन्दी के स्वाभाविक बहुवचन में दिया गया है और स्त्रीलिंग प्रत्यय בָּהּ का स्थान-संबंध ‘उसमें’ से सुरक्षित रखा गया है।
- source_word: נְשֻׂא עָוֺן
  choice: अधर्म क्षमा कर दिया गया है
  rationale: נשׂא के निष्क्रिय रूप के साथ עָוֺן वह इब्रानी मुहावरा है जिसमें अधर्म या दोष के उठा लिए जाने, दूर किए जाने और फलतः क्षमा होने का भाव है। मुख्य पाठ में अर्थ स्पष्ट किया गया है और शाब्दिक बिंब पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: बीमारी के अभाव और अधर्म की क्षमा का संबंध
  choice: पद में सिय्योन के निवासियों के लिए बीमारी के अभाव और अधर्म की क्षमा—दोनों आशीषों को साथ रखा गया है।
  alternative: बीमारी को केवल आत्मिक दशा का रूपक मानना, या हर व्यक्ति की बीमारी को सीधे उसके निजी पाप का परिणाम ठहराना।
  rationale: इब्रानी पाठ दोनों बातों को साथ रखता है, पर उनके बीच सार्वभौमिक, एक-से-एक कारण-संबंध स्पष्ट नहीं करता; इसलिए अनुवाद उस धार्मिक तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अधर्म’ ने עָוֺן के नैतिक और धार्मिक भार को बनाए रखा है; ‘क्षमा कर दिया गया है’ मुहावरे का स्वाभाविक हिन्दी अर्थ देता है।
