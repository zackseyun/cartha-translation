base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/003.yaml
  text: At the sound of the tumult[a], peoples fled; at your rising up[b], nations were scattered.
translation:
  language: hi
  text: कोलाहल[a] सुनते ही देश-देश के लोग भाग गए; तेरे उठ खड़े होने[b] पर राष्ट्र तितर-बितर हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उपद्रव की आवाज़ सुनते ही।”
    reason: lexical_alternative
  - marker: b
    text: या “तेरे ऊँचा होने पर”; इब्रानी अभिव्यक्ति परमेश्वर के कार्य करने के लिए उठने अथवा उसकी उच्च महिमा के प्रकट होने—दोनों में से किसी पर बल दे सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: מִקּוֹל הָמוֹן
  choice: कोलाहल सुनते ही
  rationale: מִן के कारण अथवा अवसरसूचक बल और קוֹל הָמוֹן के शोरपूर्ण उपद्रव को स्वाभाविक हिन्दी में व्यक्त करता है। ‘सुनते ही’ उस ध्वनि से तत्काल उत्पन्न प्रतिक्रिया को स्पष्ट करता है।
- source_word: נָדְדוּ
  choice: भाग गए
  rationale: यद्यपि क्रिया का मूल अर्थ इधर-उधर भटकना या हट जाना भी हो सकता है, यहाँ युद्ध और भय के प्रसंग में पलायन सबसे संभावित अर्थ है।
- source_word: עַמִּים
  choice: देश-देश के लोग
  rationale: यह बहुवचन जनसमुदायों को दर्शाता है और आगे आने वाले גּוֹיִם से कुछ शब्दगत भेद बनाए रखता है; साधारण हिन्दी में ‘देश-देश के लोग’ सहज और स्पष्ट है।
- source_word: מֵרוֹמְמֻתֶךָ
  choice: तेरे उठ खड़े होने पर
  rationale: रום से बना यह रूप उठने अथवा ऊँचा होने, दोनों का भाव रख सकता है। प्रसंग में परमेश्वर के कार्रवाई के लिए उठने की सजीव छवि उपयुक्त है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: נָפְצוּ
  choice: तितर-बितर हो गईं
  rationale: यहाँ क्रिया राष्ट्रों के बिखर जाने को व्यक्त करती है। यह हिन्दी में स्वाभाविक है और ‘चकनाचूर’ जैसे अधिक कठोर संभावित अर्थ को अनावश्यक रूप से नहीं थोपती।
- source_word: גּוֹיִם
  choice: जातियाँ
  rationale: यशायाह में यह शब्द सामान्यतः राष्ट्रों अथवा जातियों के लिए आता है। ‘जातियाँ’ עַמִּים के अनुवाद से भेद रखता है और यहाँ बाद के धार्मिक अर्थ वाला शब्द आरोपित नहीं करता।
theological_decisions:
- issue: ‘तेरे उठ खड़े होने’ में द्वितीय पुरुष एकवचन प्रत्यय का संदर्भ
  choice: संबोधन को सीधा रखते हुए इसे प्रसंगानुसार परमेश्वर के कार्रवाई के लिए उठने के रूप में प्रस्तुत किया गया है।
  alternative: यह परमेश्वर के ऊँचा होने या उसकी उच्च महिमा के प्रकट होने का संकेत हो सकता है; कम संभावित रूप से संबोधन मानवीकृत सिय्योन/यरूशलेम से समझा जा सकता है।
  rationale: निकटवर्ती प्रसंग में यहोवा को संबोधन और शत्रु जातियों के विरुद्ध उसका हस्तक्षेप प्रमुख हैं। अनुवाद संभावित दैवी संदर्भ को ग्रहण करता है, पर नाम जोड़कर संदर्भ को पाठ से अधिक निश्चित नहीं बनाता और अर्थगत विकल्प पादटिप्पणी में रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। समानांतर पंक्तियों की काव्यात्मक गति बनाए रखने के लिए ‘सुनते ही ... पर’ और ‘भाग गए ... तितर-बितर हो गईं’ का प्रयोग किया गया है।
