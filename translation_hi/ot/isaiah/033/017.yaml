  yaml_path: translation/ot/isaiah/033/017.yaml
  text: Your eyes will behold the king in his beauty[a]; they will see a far-reaching land.
translation:
  language: hi
  text: तुम्हारी आँखें राजा को उसकी सुंदरता में निहारेंगी; वे दूर-दूर तक फैला हुआ देश[a] देखेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दूरस्थ देश”; अधिक शाब्दिक रूप में, “दूरियों का देश।”
    reason: מַרְחַקִּים भूभाग के दूर तक विस्तार अथवा उसकी दूरी—दोनों रूपों में समझा जा सकता है; पादटिप्पणी इस वास्तविक शाब्दिक अस्पष्टता को सुरक्षित रखती है।
lexical_decisions:
- source_word: מֶלֶךְ
  choice: राजा
  rationale: संज्ञा का अर्थ ‘राजा’ है। यद्यपि इब्रानी में निश्चित उपपद नहीं है, संदर्भ किसी विशिष्ट राजकीय व्यक्ति की ओर संकेत कर सकता है; हिन्दी में ‘राजा’ दोनों संभावनाओं को स्वाभाविक रूप से खुला रखता है।
- source_word: בְּיָפְיוֹ
  choice: उसकी सुंदरता में
  rationale: यह रूप सुंदरता, मनोहर रूप या शोभा को व्यक्त कर सकता है। ‘उसकी सुंदरता में’ इब्रानी रचना के निकट रहते हुए शारीरिक सौंदर्य, राजकीय वैभव और पुनःस्थापित गरिमा के बीच निर्णय नहीं करता।
- source_word: תֶּחֱזֶינָה
  choice: निहारेंगी
  rationale: חזה सामान्यतः ध्यान से देखने या निहारने का भाव दे सकता है। ‘निहारेंगी’ साधारण ‘देखेंगी’ से इस सूक्ष्मता को अलग रखता है और काव्यात्मक समानांतरता बनाए रखता है।
- source_word: עֵינֶיךָ
  choice: तेरी आँखें
  rationale: इब्रानी में एकवचन पुल्लिंग संबोधन के साथ ‘तेरी आँखें’ स्पष्ट है। इसे बनाए रखने से पद की सजीवता और स्त्रीलिंग बहुवचन क्रियाओं का संबंध सुरक्षित रहता है।
- source_word: תִּרְאֶינָה
  choice: वे ... देखेंगी
  rationale: स्त्रीलिंग बहुवचन क्रिया ‘आँखें’ से मेल खाती है। ‘वे’ जोड़ने से हिन्दी में दोनों खंडों का संबंध स्पष्ट और स्वाभाविक रहता है।
- source_word: אֶרֶץ
  choice: देश
  rationale: אֶרֶץ का अर्थ ‘देश’ या ‘भूमि’ हो सकता है। यहाँ ‘देश’ व्यापक भूभाग के लिए सहज आधुनिक हिन्दी है; निश्चितता को अनावश्यक रूप से नहीं बढ़ाया गया।
- source_word: מַרְחַקִּים
  choice: दूर-दूर तक फैला हुआ
  rationale: मूल में दूरी को व्यक्त करने वाली बहुवचन संज्ञा है, जिसका अधिक शाब्दिक रूप ‘दूरियों का’ होगा। मुख्य पाठ का चयन विस्तृत भूभाग का अर्थ स्वाभाविक हिन्दी में देता है, जबकि वैकल्पिक ‘दूर देश’ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘राजा’ की पहचान
  choice: केवल ‘राजा’ कहा गया है; उसकी पहचान स्पष्ट नहीं की गई।
  alternative: हिजकिय्याह, स्वयं यहोवा, अथवा मसीही/अंतकालीन राजा
  rationale: इस पद का इब्रानी पाठ राजा की पहचान नहीं बताता। किसी एक व्याख्यात्मक परंपरा को पाठ में जोड़ने के बजाय अनिश्चितता और धर्मवैज्ञानिक तनाव को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। एकवचन संबोधन के लिए ‘तेरी’ मूल के व्याकरण को दर्शाता है। ‘निहारेंगी’ और ‘देखेंगी’ के भेद से दोनों इब्रानी दृष्टि-क्रियाओं की सूक्ष्म समानांतरता व्यक्त होती है।
