  text: Now I will arise[a], says Yahweh; now I will be exalted; now I will lift myself up.
translation:
  language: hi
  text: “अब मैं उठ खड़ा होऊँगा,” याहवे कहते हैं; “अब मैं महिमान्वित होऊँगा; अब मैं ऊँचा उठाया जाऊँगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम दोनों इब्रानी क्रियाएँ अर्थ में बहुत निकट हैं और उनके वाच्य को अलग-अलग ढंग से समझा जाता है। इन्हें इस प्रकार भी अनुवादित किया जा सकता है: “अब मैं ऊँचा उठूँगा; अब मैं अपने को ऊँचा उठाऊँगा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: अब
  rationale: तात्कालिक दैवी कार्रवाई को सूचित करता है। मूल की आलंकारिक शक्ति बनाए रखने के लिए इसे तीनों बार दोहराया गया है।
- source_word: אָקוּם
  choice: मैं उठ खड़ा होऊँगा
  rationale: קום के क़ाल अपूर्ण 1 एकवचन को निर्णायक हस्तक्षेप के अर्थ में स्वाभाविक हिन्दी दी गई है; केवल ‘उठूँगा’ की अपेक्षा यह संकल्प और सक्रियता अधिक स्पष्ट करता है।
- source_word: יֹאמַר יְהוָה
  choice: याहवे कहते हैं
  rationale: भविष्यद्वक्ता के कथन-सूत्र को वर्तमानकालीन हिन्दी में स्वाभाविक रूप से व्यक्त किया गया है। יְהוָה को उपाधि से बदलने के बजाय व्यक्तिगत नाम ‘याहवे’ लिखा गया है।
- source_word: אֵרוֹמָם
  choice: मैं महान ठहरूँगा
  rationale: רום से बने इस रूप में ऊँचा अथवा महान होने का भाव है। ‘महान ठहरूँगा’ अगली समानार्थी क्रिया से कुछ भेद बनाए रखता है, पर कर्तृवाच्य या कर्मवाच्य को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: אֶנָּשֵׂא
  choice: मैं ऊँचा उठूँगा
  rationale: נשׂא के निफ़अल रूप में ऊँचा उठने, उठाए जाने या महिमान्वित होने का भाव हो सकता है। हिन्दी में ‘ऊँचा उठूँगा’ इस लचीलेपन को अपेक्षाकृत स्वाभाविक ढंग से बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत चतुरक्षरीय नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: अंतिम दो, निकटार्थी उत्कर्ष-सूचक क्रियाओं का भेद
  choice: ‘मैं महान ठहरूँगा’ और ‘मैं ऊँचा उठूँगा’
  alternative: ‘मैं ऊँचा किया जाऊँगा’ और ‘मैं अपने को ऊँचा उठाऊँगा’; अथवा दोनों जगह लगभग एक ही अभिव्यक्ति
  rationale: दो अलग इब्रानी धातुओं और उनके काव्यात्मक आरोह को कुछ हद तक अलग रखा गया है, जबकि उनके वाच्य और अर्थ की वास्तविक निकटता को पादटिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और बोलचाल में बोधगम्य मानक हिन्दी। तीन बार आए ‘अब’ और समानांतर वाक्य-रचना को मूल की तात्कालिकता तथा काव्यात्मक आरोह के लिए सुरक्षित रखा गया है। प्रत्यक्ष वचन के उद्धरण-चिह्न स्पष्टता के लिए जोड़े गए हैं।
