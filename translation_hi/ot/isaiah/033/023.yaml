source:
  edition: WLC
  text: נִטְּשׁ֖וּ חֲבָלָ֑יִ/ךְ בַּל יְחַזְּק֤וּ כֵן תָּרְנָ/ם֙ בַּל פָּ֣רְשׂוּ נֵ֔ס אָ֣ז חֻלַּ֤ק עַֽד שָׁלָל֙ מַרְבֶּ֔ה פִּסְחִ֖ים בָּ֥זְזוּ בַֽז־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/023.yaml
  text: Your ropes hang loose[a]; they cannot hold firm the base of their mast; they cannot spread the sail. Then abundant plunder will be divided[b]; even the lame will carry off the spoil.
translation:
  language: hi
  text: तेरी रस्सियाँ ढीली पड़ी हैं; वे मस्तूल के आधार को मज़बूत नहीं कर सकतीं; वे पाल[a] नहीं फैला सकतीं। तब बहुत-सी लूट बाँटी जाएगी[b]; लँगड़े भी लूट लेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ध्वज/निशान।” इब्रानी शब्द का सामान्य अर्थ ध्वज या संकेत-चिह्न है, पर इस पद के जहाज़-संबंधी चित्र में “पाल” अर्थ के अनुकूल है।
    reason: lexical_alternative
  - marker: b
    text: यह पद असमर्थ जहाज़ के रूपक द्वारा शत्रु के पतन और उसकी लूट को बड़ी आसानी से ले लिए जाने का चित्र प्रस्तुत करता है।
    reason: cultural_note
lexical_decisions:
- source_word: נִטְּשׁוּ חֲבָלָיִךְ
  choice: तेरी रस्सियाँ ढीली पड़ी हैं
  rationale: निष्क्रिय पूर्ण रूप रस्सियों के छोड़े या ढीले पड़ जाने को व्यक्त करता है; जहाज़ के रूपक में यह स्वाभाविक और स्पष्ट है। स्त्रीलिंग एकवचन संबोधन को ‘तेरी’ से बनाए रखा गया है।
- source_word: בַּל יְחַזְּקוּ
  choice: दृढ़ नहीं रख सकतीं
  rationale: प्रबल निषेध और जहाज़ की असमर्थ अवस्था—दोनों को व्यक्त करता है; केवल इच्छा नहीं, क्षमता का अभाव संदर्भ में प्रमुख है।
- source_word: כֵן תָּרְנָם
  choice: मस्तूल के आधार को
  rationale: כֵן यहाँ कठिन और अनिश्चित शब्द है, संभवतः मस्तूल के आधार, टेक या खाँचे का संकेत करता है। ‘आधार’ अनावश्यक तकनीकी निश्चितता से बचते हुए नौकिक चित्र को स्पष्ट रखता है।
- source_word: בַּל פָּרְשׂוּ נֵס
  choice: वे पाल नहीं फैला सकतीं
  rationale: נֵס सामान्यतः ध्वज या निशान है, पर मस्तूल और रस्सियों के संदर्भ में ‘पाल’ जहाज़ के रूपक को सुसंगत बनाता है। शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: אָז חֻלַּק עַד שָׁלָל מַרְבֶּה
  choice: तब बहुत-सी लूट बाँटी जाएगी
  rationale: भविष्यसूचक क्रम में אָז परिणाम का परिचय देता है; निष्क्रिय क्रिया को ‘बाँटी जाएगी’ और बड़ी मात्रा को सहज आधुनिक हिन्दी में ‘बहुत-सी लूट’ से व्यक्त किया गया है।
- source_word: פִּסְחִים בָּזְזוּ בַז
  choice: लँगड़े भी लूट का माल ले जाएँगे
  rationale: यह शत्रु की ऐसी पूर्ण पराजय दिखाता है कि सामान्यतः दुर्बल माने जाने वाले लोग भी लूट उठा सकेंगे। ‘लँगड़े’ मूल अर्थ को सीधे और सम्मानजनक ढंग से व्यक्त करता है।
