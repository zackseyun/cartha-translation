source:
  edition: WLC
  text: וְ/הָיָה֙ אֱמוּנַ֣ת עִתֶּ֔י/ךָ חֹ֥סֶן יְשׁוּעֹ֖ת חָכְמַ֣ת וָ/דָ֑עַת יִרְאַ֥ת יְהוָ֖ה הִ֥יא אוֹצָרֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/006.yaml
  text: And he will be the stability of your times[a], a wealth of salvation, wisdom, and knowledge[c][b]; the fear of Yahweh is his treasure.
translation:
  language: hi
  text: और वह तेरे समयों की स्थिरता और उद्धार, बुद्धि और ज्ञान की प्रचुर संपदा होगा; यहोवा का भय उसका खज़ाना है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे समयों में स्थिरता होगी”; हिब्रू क्रिया को व्यक्तिगत कर्ता “वह” के साथ या निर्वैयक्तिक रूप में समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “उसका” का पूर्वपद निश्चित नहीं है। हिब्रू में यह तीसरे पुरुष पुल्लिंग एकवचन प्रत्यय है; इसका अर्थ “उसका खज़ाना” हो सकता है, जबकि कुछ व्याख्याएँ इसे सिय्योन/यहूदा या प्रसंग के किसी अन्य पूर्वपद से संबद्ध समझती हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: और वह ... होगा
  rationale: पुल्लिंग एकवचन क्रिया को निकटवर्ती संदर्भ में यहोवा की ओर संकेत करने वाले व्यक्तिगत कर्ता के रूप में रखा गया है; निर्वैयक्तिक अर्थ की वास्तविक संभावना पादटिप्पणी में दी गई है।
- source_word: אֱמוּנַת עִתֶּיךָ
  choice: तेरे समयों की स्थिरता
  rationale: אֱמוּנָה यहाँ विश्वास करने की क्रिया से अधिक दृढ़ता, भरोसेमंदी और स्थायित्व बताता है; बहुवचन עִתֶּיךָ की व्यापकता के लिए ‘तेरे समयों’ रखा गया है।
- source_word: חֹסֶן
  choice: भंडार
  rationale: यह शब्द धन, संपदा या प्रचुर भंडार का अर्थ दे सकता है। आगे के उद्धारों, बुद्धि और ज्ञान को समेटने के लिए ‘भंडार’ स्वाभाविक और चित्रात्मक है।
- source_word: יְשׁוּעֹת
  choice: उद्धारों
  rationale: मूल में बहुवचन है, जो अनेक छुटकारों अथवा उद्धार की प्रचुरता व्यक्त कर सकता है; हिन्दी में बहुवचन रखकर इस रूप को दृश्यमान रखा गया है।
- source_word: חָכְמַת וָדָעַת
  choice: बुद्धि और ज्ञान
  rationale: दोनों समन्वित संज्ञाओं का सीधा और प्रचलित हिन्दी रूप।
- source_word: יִרְאַת יְהוָה
  choice: यहोवा का भय
  rationale: वाचा के परमेश्वर का व्यक्तिगत नाम सुरक्षित रखा गया है; ‘भय’ मूल अभिव्यक्ति की श्रद्धामय तथा नैतिक गंभीरता को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: הִיא אוֹצָרוֹ
  choice: ही उसका खज़ाना है
  rationale: הִיא पिछले स्त्रीलिंग पद ‘यहोवा का भय’ पर बल देता है। तीसरे पुरुष पुल्लिंग एकवचन प्रत्यय को ‘उसका’ रखा गया है, जबकि उसके संदर्भ की अस्पष्टता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: आरंभिक क्रिया का कर्ता
  choice: ‘वह ... होगा’, संदर्भतः यहोवा
  alternative: ‘तेरे समयों में स्थिरता होगी’
  rationale: हिब्रू पुल्लिंग एकवचन व्यक्तिगत कर्ता को संभव बनाता है और व्यापक संदर्भ इसका समर्थन करता है, पर निर्वैयक्तिक वाचन भी व्याकरणतः संभव है; इसलिए विकल्प पादटिप्पणी में रखा गया है।
- issue: אוֹצָרוֹ में प्रत्यय का संदर्भ
  choice: ‘उसका खज़ाना’
  alternative: ‘तेरा खज़ाना’ या ‘उसका/उसकी संपत्ति का खज़ाना’, संदर्भतः सिय्योन अथवा पूर्ववर्ती विषय
  rationale: मूल प्रत्यय तीसरे पुरुष पुल्लिंग एकवचन है, पर पद में उसका स्पष्ट पूर्वपद नहीं है। मुख्य पाठ रूपात्मक अर्थ रखता है और संभावित संदर्भ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। संबोधन के एकवचन रूप को मूल के अनुरूप ‘तेरे’ से रखा गया है। ‘उद्धारों’ कुछ असामान्य होते हुए भी मूल बहुवचन और अनेक छुटकारों की धारणा को सुरक्षित रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
