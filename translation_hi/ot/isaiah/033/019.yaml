  text: אֶת עַ֥ם נוֹעָ֖ז לֹ֣א תִרְאֶ֑ה עַ֣ם עִמְקֵ֤י שָׂפָה֙ מִ/שְּׁמ֔וֹעַ נִלְעַ֥ג לָשׁ֖וֹן אֵ֥ין בִּינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/019.yaml
  text: You will no longer see the insolent people[a], a people of speech too deep to understand[c][b], of a stammering tongue without comprehension.
translation:
  language: hi
  text: तुम उन उद्दंड लोगों को फिर नहीं देखोगे[a]—ऐसे लोगों को, जिनकी बोली इतनी दुर्बोध है कि सुनकर समझ में नहीं आती[b], और जिनकी लड़खड़ाती-सी बोली समझ में नहीं आती[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भयंकर लोगों’ अथवा ‘हठीले लोगों’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘सुनने के लिए गहरे होंठों वाले लोग’; अर्थात जिनकी बोली इतनी अस्पष्ट है कि सुनकर समझ में नहीं आती।
    reason: lexical_alternative
  - marker: c
    text: या ‘उपहास करने वाली बोली’ अथवा ‘विदेशी/अपरिचित बोली’। इब्रानी पद कठिन है और संभवतः ऐसी विदेशी बोली को दर्शाता है जो सुनने वाले को समझ में नहीं आती।
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹעָז
  choice: उद्दंड
  rationale: यह शब्द धृष्ट, अक्खड़ या भय उत्पन्न करने वाली निर्भीकता का भाव दे सकता है। ‘उद्दंड’ यहाँ अहंकारी और धमकाने वाले स्वभाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תִרְאֶה
  choice: देखोगे
  rationale: ראה का सामान्य अर्थ ‘देखना’ है। प्रसंग में इसका आशय उस विदेशी उत्पीड़क से फिर सामना न होने से है; इसलिए निषेध के साथ ‘फिर नहीं देखोगे’ रखा गया है।
- source_word: עִמְקֵי שָׂפָה
  choice: जिनकी बोली इतनी गूढ़ है
  rationale: शाब्दिक चित्र ‘होंठ के गहरे’ हिन्दी में अस्पष्ट होगा। यह मुहावरा ऐसी बोली को बताता है जो सुनने वाले की पहुँच से बाहर और समझने में कठिन है।
- source_word: מִשְּׁמוֹעַ
  choice: कि सुनकर समझ में नहीं आती
  rationale: शाब्दिक अर्थ ‘सुनने से’ है, पर इस रचना में आशय सुनी हुई बात का अर्थ न समझ पाने से है। हिन्दी वाक्यांश सुनने और समझने, दोनों को बनाए रखता है।
- source_word: נִלְעַג לָשׁוֹן
  choice: लड़खड़ाती भाषा
  rationale: यह कठिन पद उपहासपूर्ण, अस्पष्ट, विदेशी अथवा लड़खड़ाती-सी सुनाई देने वाली वाणी का संकेत दे सकता है। समानांतर पंक्ति के संदर्भ में ‘लड़खड़ाती भाषा’ सुनने वाले को अबोध लगने वाली विदेशी वाणी का भाव रखती है, न कि अनिवार्य रूप से वास्तविक वाक्-दोष का।
- source_word: אֵין בִּינָה
  choice: समझ से परे है
  rationale: शाब्दिक रूप ‘समझ नहीं’ है। यहाँ भाषा की अबोधगम्यता अभिप्रेत है; ‘समझ से परे’ हिन्दी में इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַם ... עַם
  choice: लोगों ... ऐसे लोगों
  rationale: इब्रानी की पुनरावृत्ति को हिन्दी में बनाए रखा गया है, पर दूसरे प्रयोग में ‘ऐसे’ जोड़कर संबंध स्पष्ट और वाक्य स्वाभाविक किया गया है।
