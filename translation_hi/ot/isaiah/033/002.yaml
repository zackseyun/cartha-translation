source:
  edition: WLC
  text: יְהוָ֥ה חָנֵּ֖/נוּ לְ/ךָ֣ קִוִּ֑ינוּ הֱיֵ֤ה זְרֹעָ/ם֙ לַ/בְּקָרִ֔ים אַף יְשׁוּעָתֵ֖/נוּ בְּ/עֵ֥ת צָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/002.yaml
  text: O Yahweh[a], be gracious to us; we wait for you. Be our arm every morning, also our salvation in the time of distress.
translation:
  language: hi
  text: हे यहोवा, हम पर अनुग्रह कर; हम तेरी प्रतीक्षा करते हैं। हर सुबह उनकी भुजा[a] बन; संकट के समय हमारा उद्धार भी बन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में “उनकी भुजा” है। कुछ अनुवादक इसे प्रार्थना कर रहे समुदाय के सामूहिक उल्लेख के रूप में समझकर “हमारी भुजा” अनुवाद करते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को ‘यहोवा’ से और प्रत्यक्ष प्रार्थनात्मक संबोधन को ‘हे’ से व्यक्त किया गया है।
- source_word: חָנֵּנוּ
  choice: हम पर अनुग्रह कर
  rationale: חנן की आज्ञार्थक विनती कृपा या अनुग्रह दिखाने का भाव रखती है; यह अभिव्यक्ति प्रार्थनात्मक और स्वाभाविक है।
- source_word: לְךָ קִוִּינוּ
  choice: हम तेरी बाट जोहते हैं
  rationale: קוה में आशाभरी प्रतीक्षा का भाव है। ‘बाट जोहते हैं’ प्रतीक्षा के चित्र को बनाए रखता है और हिन्दी में प्रार्थनात्मक गरिमा देता है।
- source_word: זְרֹעָם
  choice: उनकी भुजा
  rationale: इब्रानी रूप में तृतीय पुरुष बहुवचन प्रत्यय ‘उनकी’ है। ‘भुजा’ शक्ति और रक्षा के मूल रूपक को बनाए रखती है।
- source_word: לַבְּקָרִים
  choice: हर सुबह
  rationale: ‘सुबहों में’ का बहुवचन रूप बार-बार, प्रतिदिन होने का भाव देता है; ‘हर सुबह’ इसका सहज हिन्दी रूप है।
- source_word: אַף
  choice: भी
  rationale: यह कण दूसरी विनती को पहली से जोड़ते हुए अतिरिक्त बल देता है।
- source_word: יְשׁוּעָתֵנוּ
  choice: हमारा उद्धार
  rationale: יְשׁוּעָה संकट से छुटकारे और व्यापक उद्धार—दोनों का अर्थ दे सकता है; ‘उद्धार’ इस व्यापकता को बनाए रखता है।
- source_word: בְּעֵת צָרָה
  choice: संकट के समय
  rationale: यह צָרָה के दुःख, विपत्ति या दबाव के भाव को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: זְרֹעָם में सर्वनाम
  choice: उनकी भुजा
  alternative: हमारी भुजा
  rationale: व्यंजनात्मक और स्वरांकित इब्रानी पाठ का स्वाभाविक अर्थ ‘उनकी भुजा’ है, यद्यपि सामुदायिक प्रार्थना में ‘हम’ से ‘उनकी’ का अचानक परिवर्तन आता है। इस तनाव को मुख्य पाठ में सुरक्षित रखा गया है; संदर्भ के आधार पर किए जाने वाले ‘हमारी’ पाठ-सुलभीकरण को पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण प्रार्थनात्मक शैली रखी गई है। ‘भुजा’ के इब्रानी रूपक और मूल पाठ के सर्वनाम-परिवर्तन को जानबूझकर सुरक्षित रखा गया है।
