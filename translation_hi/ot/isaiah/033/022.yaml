id: ISA.33.22
reference: Isaiah 33:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י יְהוָה֙ שֹׁפְטֵ֔/נוּ יְהוָ֖ה מְחֹקְקֵ֑/נוּ יְהוָ֥ה מַלְכֵּ֖/נוּ ה֥וּא יוֹשִׁיעֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/022.yaml
  text: For Yahweh is our judge[a]; Yahweh is our lawgiver; Yahweh is our king[b]; he will save us.
translation:
  language: hi
  text: 'क्योंकि याहवे[a] हमारा न्यायाधीश है;

    याहवे हमारा विधानकर्ता[b] है;

    याहवे हमारा राजा है;

    वही हमें बचाएगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परमेश्वर के नाम YHWH का यहाँ लिप्यंतरण ‘याहवे’ किया गया है; एक अन्य प्रचलित रूप ‘यहोवा’ है।
    reason: alternative_reading
  - marker: b
    text: ‘विधानकर्ता’ का अनुवाद ‘विधिदाता’ या, कुछ संदर्भों में, ‘शासक’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस संयोजक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम YHWH को उपाधि से बदलने के बजाय हिन्दी में निकट लिप्यंतरण के रूप में रखा गया है।
- source_word: שֹׁפְטֵנוּ
  choice: हमारा न्यायाधीश
  rationale: यह रूप न्याय करनेवाले की पदवी बताता है; ‘न्यायाधीश’ संक्षिप्त, स्पष्ट और वर्तमान हिन्दी में स्वाभाविक है।
- source_word: מְחֹקְקֵנוּ
  choice: हमारा विधि देनेवाला
  rationale: मूल शब्द नियम ठहराने या विधान करने से जुड़ा है। यह चयन कानूनी-शासकीय अर्थ को सहज हिन्दी में रखता है, बिना इसे केवल सामान्य ‘शासक’ बना देने के।
- source_word: מַלְכֵּנוּ
  choice: हमारा राजा
  rationale: यह सीधी राजकीय पदवी है और पद की राजतंत्रीय छवि को सुरक्षित रखती है।
- source_word: הוּא
  choice: वही
  rationale: स्पष्ट सर्वनाम के बल को हिन्दी में ‘वही’ द्वारा व्यक्त किया गया है, जिससे अंतिम कथन का उत्कर्ष बना रहता है।
- source_word: יוֹשִׁיעֵנוּ
  choice: हमें बचाएगा
  rationale: हिफ़ील अपूर्ण रूप भावी उद्धारकारी कार्य को बताता है; ‘बचाएगा’ सीधा और व्यापक हिन्दी पर्याय है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे किसी उपाधि से बदले बिना और प्रचलित वैकल्पिक उच्चारण को मुख्य पाठ में अपनाए बिना प्रस्तुत करता है।
- issue: מְחֹקְקֵנוּ का अर्थ-क्षेत्र
  choice: हमारा विधि देनेवाला
  alternative: हमारा विधानकर्ता; हमारा शासक
  rationale: पद में न्यायाधीश, विधि देनेवाला और राजा की त्रिस्तरीय शासकीय-राजकीय रचना है। चुना हुआ रूप बीच की पदवी को अलग रखता है और उसे सामान्य ‘शासक’ में नहीं मिलाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। मूल की तीन समानांतर पदवियों और अंतिम बलयुक्त निष्कर्ष को पंक्ति-विन्यास तथा ‘वही’ से सुरक्षित रखा गया है।
