base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/014.yaml
  text: 'Sinners in Zion are afraid[d][c][b][a]; trembling has seized the godless: “Who among us can dwell with a consuming fire? Who among us can dwell with everlasting burnings?”'
translation:
  language: hi
  text: 'सिय्योन में पापी डर गए हैं; अधर्मियों[a] को थरथराहट ने आ पकड़ा है: “हममें से कौन भस्म करने वाली आग के साथ रह सकता है?[b] हममें से कौन सदा धधकती ज्वालाओं के साथ रह सकता है?”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कपटियों को।” इब्रानी शब्द का अर्थ केवल ढोंगी या असच्चा व्यक्ति नहीं, बल्कि अधार्मिक या ईश्वर-विमुख व्यक्ति भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “रह सकता है” का अनुवाद “प्रवासी होकर ठहर सकता है” भी हो सकता है। “भस्म करने वाली आग” परमेश्वर की पवित्र और न्यायकारी उपस्थिति के लिए प्रयुक्त बाइबलीय भाषा की प्रतिध्वनि है; तुलना करें व्यवस्थाविवरण 4:24; इब्रानियों 12:29।
    reason: lexical_alternative_and_cross_reference
  - marker: c
    text: या, “अनन्त दाह” अथवा “निरंतर जलती लपटें।” इब्रानी में अर्थ सदा रहने वाली जलनों या दहकती ज्वालाओं का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּחֲדוּ בְצִיּוֹן חַטָּאִים
  choice: सिय्योन में पापी डर गए हैं
  rationale: पूर्ण क्रिया भय के उत्पन्न हो जाने को व्यक्त करती है; ‘डर गए हैं’ उस परिणामी अवस्था को स्वाभाविक हिन्दी में रखता है। בְ का स्थानवाचक अर्थ ‘में’ है।
- source_word: אָחֲזָה רְעָדָה
  choice: कंपकंपी ने जकड़ लिया है
  rationale: मूल की मूर्त छवि—कंपन का किसी को पकड़ लेना—को सहज हिन्दी में सुरक्षित रखा गया है।
- source_word: חֲנֵפִים
  choice: भक्तिहीनों
  rationale: यह शब्द केवल कपटपूर्ण व्यवहार नहीं, बल्कि अधार्मिकता और ईश्वर-विमुखता भी सूचित कर सकता है; ‘भक्तिहीन’ इस व्यापक नैतिक-धार्मिक अर्थ को व्यक्त करता है।
- source_word: מִי יָגוּר לָנוּ
  choice: हममें से कौन ... के साथ रह सकता है
  rationale: לָנוּ को सामुदायिक आत्म-संदर्भ ‘हममें से’ और גור को इस प्रसंग में टिककर रहने के अर्थ में ‘रह सकता है’ दिया गया है; संगति ‘के साथ’ आग की उपस्थिति में रहने की कठिनाई व्यक्त करती है।
- source_word: אֵשׁ אוֹכֵלָה
  choice: भस्म करनेवाली आग
  rationale: ‘भस्म करनेवाली’ आग की सक्रिय, विनाशकारी शक्ति को स्पष्ट और परिचित बाइबलीय हिन्दी में व्यक्त करता है।
- source_word: מוֹקְדֵי עוֹלָם
  choice: सदा धधकती ज्वालाओं
  rationale: बहुवचन की ज्वलंत छवि और עוֹלָם की निरंतरता दोनों सुरक्षित हैं; ‘धधकती ज्वालाएँ’ आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: भस्म करनेवाली आग और सदा धधकती ज्वालाओं का अभिप्राय
  choice: मुख्य पाठ में आग की उपमा को बिना स्पष्ट पहचान दिए सुरक्षित रखा गया है।
  alternative: इसे सीधे परमेश्वर की पवित्र और न्यायकारी उपस्थिति, दुष्टों पर दंड की आग, अथवा सिय्योन की वेदी की आग कहना।
  rationale: तात्कालिक संदर्भ परमेश्वर की भयावह पवित्रता और न्यायकारी उपस्थिति की ओर संकेत करता है, और अगला पद बताता है कि वहाँ कौन रह सकता है; फिर भी पद स्वयं आग को स्पष्टतः परमेश्वर नहीं कहता, इसलिए अनुवाद उस अर्थगत तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और मौखिक रूप से सहज हिन्दी चुनी गई है। काव्यात्मक समानांतरता और दोनों प्रश्नों की पुनरावृत्ति बनाए रखी गई है। ‘कपटी’ की संकीर्ण सम्भावना के बजाय व्यापक धार्मिक अर्थ के लिए ‘भक्तिहीन’ रखा गया है; पाठ को अत्यधिक व्याख्यात्मक बनाने से बचने हेतु इसका अलग पादलेख नहीं जोड़ा गया।
