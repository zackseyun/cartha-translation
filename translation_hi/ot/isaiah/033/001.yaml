  text: ה֣וֹי שׁוֹדֵ֗ד וְ/אַתָּה֙ לֹ֣א שָׁד֔וּד וּ/בוֹגֵ֖ד וְ/לֹא בָ֣גְדוּ ב֑/וֹ כַּ/הֲתִֽמְ/ךָ֤ שׁוֹדֵד֙ תּוּשַּׁ֔ד כַּ/נְּלֹתְ/ךָ֥ לִ/בְגֹּ֖ד יִבְגְּדוּ בָֽ/ךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/001.yaml
  text: Woe to you[a], destroyer, though you yourself have not been destroyed, and betrayer, though they have not betrayed you. When you finish destroying, you will be destroyed; when you cease betraying[c][b], they will betray you.
translation:
  language: hi
  text: हाय तुझ पर, हे नाश करने वाले—यद्यपि तेरा नाश नहीं हुआ; और हे विश्वासघाती—यद्यपि उन्होंने तेरे साथ विश्वासघात नहीं किया। जब तू नाश करना समाप्त करेगा, तब तेरा नाश किया जाएगा; जब तू विश्वासघात करना छोड़ देगा, तब वे तेरे साथ विश्वासघात करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹי
  choice: तुझ पर हाय
  rationale: यह भविष्यद्वाणी की भर्त्सना और आनेवाले न्याय की घोषणा है। ‘तुझ पर हाय’ उसके गंभीर और अशुभ स्वर को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שׁוֹדֵד / שָׁדוּד / תּוּשַּׁד
  choice: नाश करनेवाले / नाश नहीं किया / नाश किया जाएगा
  rationale: एक ही हिन्दी मूल को दोहराने से इब्रानी की शब्दावृत्ति और कर्म के उलटकर कर्ता पर आने की धारणा सुरक्षित रहती है। मूल शब्द लूटने अथवा उजाड़ने का भाव भी रख सकता है।
- source_word: בּוֹגֵד / בגד
  choice: विश्वासघाती / विश्वासघात करना
  rationale: संज्ञात्मक संबोधन और बार-बार आनेवाली क्रिया के बीच इब्रानी का शब्द-संबंध बनाए रखने के लिए एक ही हिन्दी मूल चुना गया है।
- source_word: בָגְדוּ בוֹ
  choice: किसी ने तेरे साथ विश्वासघात नहीं किया
  rationale: पूरे वाक्य के प्रत्यक्ष संबोधन और समानांतर रचना के अनुसार मुख्य पाठ में दूसरे पुरुष का प्रयोग किया गया है; इब्रानी के तीसरे पुरुष रूप को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: כַּהֲתִמְךָ
  choice: जब तू ... पूरा कर लेगा
  rationale: यह कालवाचक रचना विनाशकारी कार्य के पूरा होने पर उसके प्रतिफल का समय बताती है।
- source_word: כַּנְּלֹתְךָ לִבְגֹּד
  choice: जब तू विश्वासघात करना छोड़ देगा
  rationale: यह विश्वासघाती आचरण के समाप्त या पूरा हो जाने को व्यक्त करता है। सहज हिन्दी के लिए ‘छोड़ देगा’ रखा गया है, जबकि ‘पूरा कर लेगा’ की सम्भावना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: בָגְדוּ בוֹ में सर्वनाम का पुरुष
  choice: मुख्य पाठ में ‘तेरे साथ’
  alternative: ‘उसके साथ’
  rationale: इब्रानी व्यंजन-पाठ में तीसरा पुरुष एकवचन है, पर पद का बाकी भाग उसी विनाशक और विश्वासघाती को सीधे संबोधित करता है। मुख्य पाठ में समानांतर प्रत्यक्ष संबोधन रखा गया है और वास्तविक पाठगत अस्पष्टता पादटिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और भविष्यद्वाणी के अनुकूल रखी गई है। ‘नाश’ और ‘विश्वासघात’ की पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है, ताकि मूल की शब्दावृत्ति और प्रतिशोधात्मक उलटाव स्पष्ट रहे।
