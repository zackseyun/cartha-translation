id: ISA.33.21
reference: Isaiah 33:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י אִם שָׁ֞ם אַדִּ֤יר יְהוָה֙ לָ֔/נוּ מְקוֹם נְהָרִ֥ים יְאֹרִ֖ים רַחֲבֵ֣י יָדָ֑יִם בַּל תֵּ֤לֶךְ בּ/וֹ֙ אֳנִי שַׁ֔יִט וְ/צִ֥י אַדִּ֖יר לֹ֥א יַעַבְרֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/021.yaml
  text: But there the majestic Yahweh will be for us a place of rivers[a], of broad streams, where no rowing ship can go[c][b], and no mighty vessel can pass through.
translation:
  language: hi
  text: पर वहाँ प्रतापी याहवे हमारे लिए नदियों और चौड़ी जलधाराओं का स्थान होगा[b], जहाँ कोई चप्पू से चलनेवाला जहाज़ नहीं जाएगा[c], और कोई शक्तिशाली जलयान उसमें से होकर नहीं गुज़रेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “हाथों में चौड़ी”; यह बहुत चौड़े जलमार्गों के लिए प्रयुक्त मुहावरा है।
    reason: मूल मुहावरे की ठोस छवि और सांस्कृतिक-भाषिक अर्थ स्पष्ट करना।
  - marker: c
    text: या, “चप्पूदार जहाज़”; इब्रानी पद सक्रिय रूप से खेए जानेवाले जलयान का संकेत देता है।
    reason: जहाज़ के प्रकार से संबंधित सम्भव अधिक शाब्दिक अनुवाद बताना।
lexical_decisions:
- source_word: כִּי אִם
  choice: पर
  rationale: यह पद पिछले संदर्भ के विपरीत सिय्योन की सुरक्षा प्रस्तुत करता है; इसलिए आधुनिक हिन्दी में विरोधसूचक ‘पर’ स्वाभाविक है।
- source_word: אַדִּיר יְהוָה
  choice: प्रतापी याहवे
  rationale: אַדִּיר में प्रताप, सामर्थ्य और महिमा का भाव है। ‘प्रतापी’ इन अर्थों को संक्षेप में व्यक्त करता है, और יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: לָנוּ מְקוֹם
  choice: हमारे लिए ... का स्थान होगा
  rationale: לָנוּ लाभ का भाव व्यक्त करता है और מְקוֹם को बनाए रखने से यह साहसिक रूपक सुरक्षित रहता है कि याहवे स्वयं अपने लोगों के लिए सुरक्षादायक जल-प्रदेश होगा।
- source_word: נְהָרִים יְאֹרִים רַחֲבֵי יָדָיִם
  choice: नदियों और दूर-दूर तक फैली जलधाराओं
  rationale: दोनों जलवाची शब्दों का भेद रखा गया है। רַחֲבֵי יָדָיִם का शाब्दिक अर्थ ‘हाथों/किनारों में चौड़ी’ है; ‘दूर-दूर तक फैली’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: אֳנִי שַׁיִט
  choice: चप्पुओं से चलनेवाला कोई जहाज़
  rationale: שַׁיִט सक्रिय नौचालन, सम्भवतः चप्पुओं से चलने, का संकेत देता है। यह रूप सामान्य पाठक के लिए ‘चप्पूदार जहाज़’ से अधिक स्पष्ट है।
- source_word: וְצִי אַדִּיר
  choice: कोई शक्तिशाली जलयान
  rationale: צִי जहाज़ या जलयान है और אַדִּיר यहाँ उसके बड़े, प्रभावशाली अथवा शक्तिशाली होने का भाव देता है।
- source_word: לֹא יַעַבְרֶנּוּ
  choice: उसे पार नहीं करेगा
  rationale: क्रिया के प्रत्यय को जल-प्रदेश/जलमार्ग की ओर संकेत करते हुए एकवचन ‘उसे’ से दर्शाया गया है; भविष्यसूचक निषेध को सीधा रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम है। उसका लिप्यंतरण करने से पद में प्रकट वाचा-संबंधी नाम सुरक्षित रहता है और उसे किसी उपाधि से नहीं बदला जाता।
- issue: याहवे और सुरक्षादायक जलमार्गों के बीच रूपक
  choice: याहवे ... नदियों और ... जलधाराओं का स्थान होगा
  alternative: याहवे हमारे लिए नदियों और जलधाराओं के समान होगा
  rationale: मूल में स्पष्ट उपमा-सूचक शब्द नहीं है; इसलिए कठिन किन्तु अर्थपूर्ण रूपक को उपमा बनाकर सरल नहीं किया गया।
- issue: אַדִּיר का व्याकरणिक संबंध
  choice: प्रतापी याहवे
  alternative: वहाँ याहवे हमारे लिए प्रतापी होगा
  rationale: אַדִּיר को याहवे का विशेषण मानना प्रसंग और शब्दक्रम के अनुकूल है, पर पद-विन्यास दूसरी सम्भावना की अनुमति देता है; उसे पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘जलयान’ और ‘जलधारा’ जैसे मानक शब्द काव्यात्मक भविष्यवाणी के स्तर को बनाए रखते हैं, जबकि ‘चप्पुओं से चलनेवाला’ दुर्लभ नौसैनिक शब्दावली से बचाता है।
