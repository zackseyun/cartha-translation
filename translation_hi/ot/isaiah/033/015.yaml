base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/015.yaml
  text: He who walks in righteousness and speaks what is upright[a], who despises gain from extortions, who shakes his hands free from taking a bribe, who stops his ears from hearing of bloodshed[c][b], and shuts his eyes from looking on evil—
translation:
  language: hi
  text: जो धार्मिकता से चलता है और खरी बातें बोलता है,[a] जो अत्याचार से होने वाले लाभ को तुच्छ जानता है,[b] जो घूस लेने से अपने हाथ झटक लेता है, जो रक्तपात की बात सुनने से अपने कान बंद कर लेता है,[c] और बुराई देखने से अपनी आँखें मूँद लेता है—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धर्म के काम करता और सीधी बातें बोलता है”; अथवा “न्याय से चलता है।”
    reason: lexical_alternative
  - marker: b
    text: या “शोषण से होने वाले लाभ को।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से “लहुओं”; यह रक्तपात या रक्तदोष के लिए प्रयुक्त मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: הֹלֵךְ צְדָקוֹת
  choice: धार्मिकता के मार्ग पर चलता है
  rationale: הלך नैतिक आचरण के रूपक को व्यक्त करता है; צְדָקוֹת का बहुवचन यहाँ व्यापक धार्मिकता अथवा धर्मपूर्ण आचरण का गुणात्मक भाव देता है। यह हिंदी रूपक और नैतिक व्यापकता दोनों को स्वाभाविक ढंग से रखता है।
- source_word: וְדֹבֵר מֵישָׁרִים
  choice: सीधी बातें बोलता है
  rationale: מֵישָׁרִים में सीधाई, खरापन और न्यायसंगतता का भाव है। ‘सीधी बातें’ मूल रूपक को बनाए रखते हुए आधुनिक हिंदी में सत्यनिष्ठ वाणी का संकेत देती है।
- source_word: מֹאֵס
  choice: तुच्छ जानता है
  rationale: क्रिया केवल अस्वीकार करने से अधिक प्रबल नैतिक घृणा और अवमानना व्यक्त करती है; ‘तुच्छ जानता है’ उस मूल्यांकनात्मक बल को व्यक्त करता है।
- source_word: בְּבֶצַע מַעֲשַׁקּוֹת
  choice: अत्याचार से होनेवाले लाभ को
  rationale: בצע अनुचित लाभ और מעשקות दमनकारी या शोषणकारी कृत्यों को सूचित करता है। यह अनुवाद स्रोत और लाभ के संबंध को स्पष्ट रखते हुए ‘अत्याचार’ की व्यापकता बचाता है।
- source_word: נֹעֵר כַּפָּיו מִתְּמֹךְ בַּשֹּׁחַד
  choice: घूस लेने से अपने हाथ झटक लेता है
  rationale: हाथ झटकने का इब्रानी चित्र घूस ग्रहण करने से सक्रिय इनकार और स्वयं को उससे अलग रखने को दर्शाता है; हिंदी में भी यह चित्र समझने योग्य है।
- source_word: אֹטֵם אָזְנוֹ מִשְּׁמֹעַ דָּמִים
  choice: रक्तपात की बात सुनने से अपने कान बंद कर लेता है
  rationale: דָּמִים शाब्दिक रूप से ‘लहू’ का बहुवचन है और रक्तपात या रक्तदोष का मुहावरा हो सकता है। ‘रक्तपात की बात’ हिंसक योजना या हिंसा में सहमति से सुनने की संभावित धारणा को खुला रखती है।
- source_word: וְעֹצֵם עֵינָיו מֵרְאוֹת בְּרָע
  choice: बुराई देखने से अपनी आँखें मूँद लेता है
  rationale: वाक्यांश बुराई पर जानबूझकर दृष्टि टिकाने या उसमें रुचि लेने से सक्रिय परहेज़ व्यक्त करता है। ‘आँखें मूँद लेता है’ मूल शारीरिक चित्र को स्वाभाविक हिंदी में रखता है।
theological_decisions:
- issue: इब्रानी में संबंधवाचक सर्वनाम के बिना आए नैतिक कृदंतों की शृंखला
  choice: जो ... चलता ... बोलता है
  alternative: वह जो ...; जो कोई ...
  rationale: ‘जो’ से आरंभ शृंखला अगले पद की प्रतिज्ञा की ओर खुली रहती है और एक प्रतिनिधि व्यक्ति का वर्णन करती है; इसमें अनावश्यक रूप से सार्वत्रिक ‘जो कोई’ नहीं जोड़ा गया।
- issue: צְדָקוֹת का धार्मिकता और न्यायपूर्ण कर्मों के बीच अर्थक्षेत्र
  choice: धार्मिकता के मार्ग पर
  alternative: धर्म के काम करता है; न्याय के मार्ग पर चलता है
  rationale: संदर्भ व्यक्ति के व्यापक नैतिक चरित्र का वर्णन करता है। ‘धार्मिकता’ उस व्यापकता को रखती है, जबकि पादटिप्पणी कर्म और न्याय की वास्तविक शाब्दिक संभावनाएँ सुरक्षित रखती है।
- issue: מִשְּׁמֹעַ דָּמִים में हिंसा की खबर सुनना या हिंसक योजना में सम्मति देना
  choice: रक्तपात की बात सुनने से
  alternative: रक्तपात की योजना सुनने से; रक्तदोष की बात सुनने से
  rationale: मूल पाठ योजना का स्पष्ट उल्लेख नहीं करता। इसलिए मुख्य पाठ सामान्य अभिव्यक्ति रखता है और हिंसक षड्यंत्र तक अर्थ को सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। समानांतर कृदंतीय संरचना को ‘जो’ की पुनरावृत्ति से स्पष्ट रखा गया है। ‘धार्मिकता’, ‘अत्याचार’, ‘घूस’, ‘रक्तपात’ और ‘बुराई’ सामान्य पाठक के लिए परिचित नैतिक शब्द हैं; मूल के हाथ झटकने, कान बंद करने और आँखें मूँदने वाले सजीव रूपक सुरक्षित रखे गए हैं।
