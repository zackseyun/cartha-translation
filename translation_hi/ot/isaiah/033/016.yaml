base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/016.yaml
  text: He will dwell on the heights[a]; rocky fortresses will be his refuge; his bread will be given[b], his water will be sure.
translation:
  language: hi
  text: 'वह ऊँचे स्थानों पर बसेगा;


    चट्टानी दुर्ग उसका शरणस्थान[a] होंगे।


    उसकी रोटी उसे दी जाएगी,


    और उसके पानी की आपूर्ति सुनिश्चित रहेगी[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसका ऊँचा गढ़’। हिब्रू शब्द ऊँचाई पर स्थित सुरक्षित आश्रय का भाव देता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसकी पानी की आपूर्ति कभी नहीं चूकेगी।’ हिब्रू में पानी के विश्वसनीय या सुनिश्चित होने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְרוֹמִים
  choice: ऊँचे स्थानों पर
  rationale: बहुवचन संज्ञा ऊँचे, सुरक्षित स्थानों का स्थानिक बिंब देती है; यह हिन्दी में स्वाभाविक भी है।
- source_word: יִשְׁכֹּן
  choice: बसेगा
  rationale: क्रिया का अर्थ टिककर रहना या निवास करना है; ‘बसेगा’ स्थायी और सुरक्षित निवास का भाव व्यक्त करता है।
- source_word: מְצָדוֹת סְלָעִים
  choice: चट्टानी दुर्ग
  rationale: शाब्दिक भाव ‘चट्टानों के दुर्ग’ है; ‘चट्टानी दुर्ग’ दुर्गमता और रक्षा, दोनों बिंब बनाए रखता है।
- source_word: מִשְׂגַּבּוֹ
  choice: उसका शरणस्थान
  rationale: यह शब्द ऊँचे और सुरक्षित आश्रय को सूचित करता है; ‘शरणस्थान’ उसके रक्षात्मक अर्थ को स्पष्ट रखता है।
- source_word: לַחְמוֹ
  choice: उसकी रोटी
  rationale: ठोस संज्ञा ‘रोटी’ को सामान्य ‘भोजन’ में बदलने के बजाय मूल बिंब बनाए रखा गया है।
- source_word: נִתָּן
  choice: उसे दी जाएगी
  rationale: निष्क्रिय रूप को प्रसंग के प्रतिज्ञात्मक, भविष्याभिमुख भाव के अनुसार व्यक्त किया गया है।
- source_word: מֵימָיו נֶאֱמָנִים
  choice: उसका पानी निश्चित रूप से मिलता रहेगा
  rationale: हिब्रू में पानी के विश्वसनीय, सुनिश्चित बने रहने का भाव है; स्वाभाविक हिन्दी में यह पानी की निरंतर उपलब्धता बताता है, बिना उसके स्रोत को निर्दिष्ट किए।
- source_word: הוּא
  choice: वह
  rationale: सर्वनाम पिछले पद में वर्णित धर्मी पुरुष की ओर संकेत करता है; हिन्दी में ‘वह’ इस संदर्भ को स्वाभाविक ढंग से बनाए रखता है।
theological_decisions:
- issue: एकवचन पुल्लिंग सर्वनाम का संदर्भ
  choice: यह पद पिछले पद में वर्णित धर्मी पुरुष की बात आगे बढ़ाता है।
  alternative: इसे सामान्य रूप से धर्मी व्यक्ति या प्रतिरूपात्मक रूप से विश्वासयोग्य बचे हुओं पर लागू समझना।
  rationale: यशायाह 33:15 में धर्मी आचरण करने वाले व्यक्ति के लक्षण हैं और पद 16 उसी को मिलने वाली सुरक्षा और प्रावधान बताता है; इसलिए अनुवाद सीधे परमेश्वर या मसीह को संदर्भित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक किंतु सहज रूप रखा गया है। समानांतर पंक्तियों में सुरक्षा और जीवनोपयोगी प्रावधान के बिंब सुरक्षित हैं।
