base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/020.yaml
  text: Look upon Zion[a], the city of our appointed feasts; your eyes will see Jerusalem, a quiet habitation, a tent that will not be moved; its stakes will never be pulled up[c][b], and none of its ropes will be torn apart.
translation:
  language: hi
  text: 'सिय्योन को देखो—हमारे नियत पर्वों का नगर![a] तुम्हारी आँखें यरूशलेम को देखेंगी: एक शांत निवास,[b] एक ऐसा तंबू जो हटाया नहीं जाएगा। उसकी कोई खूंटी कभी उखाड़ी नहीं जाएगी, और उसकी कोई रस्सी नहीं टूटेगी।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हमारी नियत सभाओं का नगर’ अथवा ‘हमारे पर्वों का नगर।’ इब्रानी शब्द नियत समय या सभा, विशेषकर उपासना के पर्वों, को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘एक सुरक्षित निवास’ अथवा ‘एक निर्विघ्न निवास।’
    reason: lexical_alternative
  - marker: c
    text: 'यहाँ यरूशलेम के स्थायित्व के लिए तंबू का बिंब है: उसकी खूंटियाँ उखाड़ी नहीं जाएँगी और उसकी रस्सियाँ नहीं टूटेंगी।'
    reason: cultural_note
lexical_decisions:
- source_word: חֲזֵה
  choice: देखो
  rationale: पुल्लिंग एकवचन आज्ञार्थक क्रिया का सीधा और स्वाभाविक हिन्दी रूप; यह ध्यानपूर्वक देखने के आह्वान को बनाए रखता है।
- source_word: קִרְיַת מוֹעֲדֵנוּ
  choice: हमारे नियत पर्वों का नगर
  rationale: מוֹעֵד नियत समय या सभा को, विशेषकर उपासना और पर्व के संदर्भ में, व्यक्त कर सकता है। सिय्योन के प्रसंग में ‘नियत पर्व’ सामुदायिक उपासना का भाव स्पष्ट रखते हुए मूल के ‘नियत’ पहलू को भी बचाता है।
- source_word: עֵינֶיךָ תִרְאֶינָה
  choice: तुम्हारी आँखें ... देखेंगी
  rationale: मूल में ‘तुम्हारी आँखें’ स्पष्ट कर्ता हैं; इसलिए देहगत और प्रत्यक्ष दर्शन का बल सुरक्षित रखा गया है।
- source_word: נָוֶה שַׁאֲנָן
  choice: एक शांत निवास
  rationale: נָוֶה निवास-स्थान और שַׁאֲנָן निश्चिंत, निर्विघ्न या सुरक्षित दशा दर्शाता है। ‘शांत निवास’ सहज हिन्दी में शांति का मुख्य भाव रखता है, जबकि सुरक्षा का संभव अर्थ पादटिप्पणी में दिया गया है।
- source_word: אֹהֶל בַּל יִצְעָן
  choice: एक ऐसा तंबू जो हटाया नहीं जाएगा
  rationale: אֹהֶל का सामान्य अर्थ ‘तंबू’ है और दुर्लभ क्रिया יִצְעָן यहाँ विस्थापित या स्थानांतरित किए जाने का भाव देती है। ‘हटाया नहीं जाएगा’ स्थायित्व और तंबू के बिंब दोनों को बनाए रखता है।
- source_word: בַּל יִסַּע יְתֵדֹתָיו לָנֶצַח
  choice: उसकी कोई खूंटी कभी उखाड़ी नहीं जाएगी
  rationale: נסע तंबू की खूंटियों के साथ पड़ाव उठाते समय उन्हें निकालने का संकेत देता है। ‘कोई ... कभी नहीं’ हिन्दी में मूल के सार्वकालिक निषेध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְכָל חֲבָלָיו בַּל יִנָּתֵקוּ
  choice: उसकी कोई रस्सी नहीं टूटेगी
  rationale: חֲבָלִים यहाँ तंबू की रस्सियाँ हैं और נתק का निफ़ाल रूप टूटने या अलग हो जाने को दर्शाता है। मूल के ‘सब ... नहीं’ को हिन्दी के स्वाभाविक ‘कोई ... नहीं’ में व्यक्त किया गया है।
theological_decisions:
- issue: सिय्योन और यरूशलेम के स्थायित्व का स्वरूप
  choice: यरूशलेम को शांत और स्थिर निवास के रूप में प्रस्तुत करते हुए तंबू, खूंटियों और रस्सियों के बिंब को अक्षुण्ण रखना
  alternative: इसे शब्दावली में ही केवल ऐतिहासिक-राजनीतिक पुनर्स्थापना या केवल अंतिमकालीन परमेश्वर की प्रजा का रूपक ठहराना
  rationale: इब्रानी पाठ सुरक्षित यरूशलेम का वादा तंबू के विरोधाभासी किंतु प्रभावशाली स्थायित्व-बिंब से करता है। अनुवाद व्यापक ऐतिहासिक या अंतिमकालीन पूर्ति का निर्णय किए बिना इस तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘नियत पर्व’, ‘शांत निवास’, ‘तंबू’, ‘खूंटी’ और ‘रस्सी’ मूल के उपासना-संदर्भ तथा ठोस तंबू-बिंब को बिना अनावश्यक धार्मिक पारिभाषिकता के व्यक्त करते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
