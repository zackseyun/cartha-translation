  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: נָשַׁ֣מּוּ מְסִלּ֔וֹת שָׁבַ֖ת עֹבֵ֣ר אֹ֑רַח הֵפֵ֤ר בְּרִית֙ מָאַ֣ס עָרִ֔ים לֹ֥א חָשַׁ֖ב אֱנֽוֹשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/008.yaml
  text: The highways lie desolate[a]; the traveler has ceased from the road. He has broken the covenant, despised the cities[b], and regarded no man.
translation:
  language: hi
  text: राजमार्ग सुनसान पड़े हैं; राहगीर का आना-जाना रुक गया है। उसने वाचा तोड़ दी, नगरों का तिरस्कार किया[a], और किसी मनुष्य की परवाह नहीं की[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन अनुवादों के अनुसार, ‘नगरों का तिरस्कार किया’ के स्थान पर ‘साक्षियों का तिरस्कार किया।’ मसोरेटिक पाठ में ‘नगरों’ है।
    reason: textual_variant
  - marker: b
    text: इब्रानी में ‘मनुष्य’ (एनोश), एक मानव या नश्वर मनुष्य के लिए एकवचन शब्द; यहाँ इसका अर्थ सामान्य रूप से किसी भी मनुष्य से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁמּוּ
  choice: सुनसान पड़े हैं
  rationale: यह क्रिया उजाड़ या निर्जन हो जाने से उत्पन्न वर्तमान दशा बताती है; ‘सुनसान पड़े हैं’ हिन्दी में उस परिणामात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מְסִלּוֹת
  choice: राजमार्ग
  rationale: यह बहुवचन संज्ञा सामान्य पगडंडी के बजाय प्रमुख, सार्वजनिक मार्गों को सूचित करती है; हिन्दी में ‘राजमार्ग’ उसी बड़े मार्ग का बोध कराता है।
- source_word: שָׁבַת
  choice: अब नहीं रहा
  rationale: पूर्ण क्रिया किसी गतिविधि के रुक जाने को बताती है। ‘राह से गुजरनेवाला अब नहीं रहा’ यातायात के समाप्त हो जाने का स्वाभाविक हिन्दी चित्र प्रस्तुत करता है।
- source_word: עֹבֵר אֹרַח
  choice: राह से गुजरनेवाला
  rationale: कृदन्त और संज्ञा का संयोजन मार्ग पर चलने या उससे गुजरनेवाले व्यक्ति को दर्शाता है; यह रूप मूल के एकवचन को भी बनाए रखता है।
- source_word: הֵפֵר בְּרִית
  choice: उसने वाचा तोड़ दी
  rationale: यह पदबंध वाचा या संधि का उल्लंघन करने का सामान्य बाइबिलीय प्रयोग है। ‘वाचा’ प्रमुख धर्मग्रंथीय शब्द को बनाए रखता है, जबकि प्रसंग में राजनीतिक संधि की संभावना को नकारता नहीं।
- source_word: מָאַס עָרִים
  choice: नगरों को तुच्छ जाना
  rationale: मसोरेटिक पाठ में ‘नगर’ है और क्रिया तिरस्कार या अस्वीकार का भाव रखती है। कुछ प्राचीन साक्ष्य दूसरे पाठ का समर्थन करते हैं, जिसे पादटिप्पणी में रखा गया है।
- source_word: לֹא חָשַׁב אֱנוֹשׁ
  choice: किसी मनुष्य की परवाह नहीं की
  rationale: यह मुहावरा किसी मानव के प्रति आदर या सरोकार न रखने को व्यक्त करता है। ‘मनुष्य’ אֱנוֹשׁ के मानव अथवा नश्वर व्यक्ति के अर्थ को बनाए रखता है, और ‘परवाह नहीं की’ आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: אֱנוֹשׁ का सामान्य मानव के अर्थ में एकवचन प्रयोग
  choice: किसी मनुष्य
  alternative: किसी की / मानवता की
  rationale: मूल का एकवचन मानव-संज्ञक रूप ‘मनुष्य’ द्वारा रखा गया है, जबकि ‘किसी’ से उसका सामान्य, सभी मनुष्यों पर लागू होनेवाला बल स्पष्ट होता है।
- issue: पद के उत्तरार्ध में एकवचन क्रियाओं का कर्ता
  choice: अनिर्दिष्ट ‘उसने’
  alternative: शत्रु / विश्वासघाती / वाचा तोड़नेवाला
  rationale: इब्रानी में कर्ता का नाम इस पद में स्पष्ट नहीं किया गया। ‘उसने’ उस अस्पष्टता को सुरक्षित रखता है और व्यापक प्रसंग से किसी पहचान को अनिवार्य रूप से पाठ में नहीं जोड़ता।
- issue: בְּרִית का प्रसंगगत स्वरूप
  choice: वाचा
  alternative: संधि
  rationale: निकट प्रसंग में राजनीतिक संधि संभव है, पर मूल शब्द का अर्थ केवल उसी तक सीमित नहीं है। ‘वाचा’ उसकी बाइबिलीय व्यापकता और संभावित प्रसंगगत तनाव दोनों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर काव्य-पंक्तियों की संक्षिप्तता बनाए रखते हुए परिणामात्मक क्रियाभाव और अनिर्दिष्ट कर्ता सुरक्षित रखे गए हैं। सभी पादटिप्पणी-चिह्न संबंधित शब्दों के बाद मुख्य पाठ में दिए गए हैं।
