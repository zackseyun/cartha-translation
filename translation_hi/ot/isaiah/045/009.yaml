id: ISA.45.9
reference: Isaiah 45:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ה֗וֹי רָ֚ב אֶת יֹ֣צְר֔/וֹ חֶ֖רֶשׂ אֶת חַרְשֵׂ֣י אֲדָמָ֑ה הֲ/יֹאמַ֨ר חֹ֤מֶר לְ/יֹֽצְר/וֹ֙ מַֽה תַּעֲשֶׂ֔ה וּ/פָעָלְ/ךָ֖ אֵין יָדַ֥יִם לֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/009.yaml
  text: Woe to the one who contends with his Maker— a potsherd among the potsherds of the earth! Shall the clay say to the one who forms it[a], “What are you making?” or your work, “He has no hands”?
translation:
  language: hi
  text: हाय उस पर जो अपने रचनेवाले से झगड़ता है—धरती के ठीकरों में बस एक ठीकरा! क्या मिट्टी अपने गढ़नेवाले से कहेगी, “तू क्या बना रहा है?” या तेरी बनाई वस्तु कहेगी, “उसके हाथ ही नहीं हैं”?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “इसके हत्थे नहीं हैं।” इस अर्थ में अंतिम वाक्य बनानेवाले की क्षमता पर नहीं, बल्कि पात्र के आकार पर उसकी अपनी आपत्ति है।
    reason: יָדַיִם का सामान्य अर्थ ‘हाथ’ है, पर पात्र के प्रसंग में ‘हत्थे’ भी संभव है; मूल वाक्य की सर्वनाम-संबंधी संक्षिप्तता दोनों व्याख्याओं की गुंजाइश देती है।
lexical_decisions:
- source_word: הוֹי
  choice: हाय उस पर
  rationale: यह भविष्यद्वाणी की चेतावनी और धिक्कार का उद्घोष है। ‘हाय उस पर’ आधुनिक हिन्दी में उसका गंभीर और स्वाभाविक बल बनाए रखता है।
- source_word: רָב אֶת יֹצְרוֹ
  choice: जो अपने रचनेवाले से झगड़ता है
  rationale: רָב का अर्थ यहाँ विवाद करना या भिड़ना है। יֹצְרוֹ उस व्यक्ति को सूचित करता है जिसने उसे आकार दिया; ‘रचनेवाला’ सृष्टिकर्ता और सृष्ट प्राणी के विरोध को बनाए रखता है।
- source_word: חֶרֶשׂ אֶת חַרְשֵׂי אֲדָמָה
  choice: धरती के ठीकरों में बस एक ठीकरा
  rationale: इब्रानी पदबंध संक्षिप्त और कुछ अण्डाकार है। ‘ठीकरा’ मिट्टी के टूटे पात्र के टुकड़े को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘में बस एक’ मनुष्य की समान भौतिक तथा निम्न स्थिति स्पष्ट करता है।
- source_word: הֲיֹאמַר חֹמֶר לְיֹצְרוֹ
  choice: क्या मिट्टी अपने गढ़नेवाले से कहेगी
  rationale: कुम्हार के बिंब में חֹמֶר ‘मिट्टी’ है और יֹצֵר आकार देनेवाला। ‘गढ़नेवाला’ इस हस्तकौशलपूर्ण आकार देने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַה תַּעֲשֶׂה
  choice: तू क्या बना रहा है?
  rationale: עשה का अर्थ ‘करना’ या ‘बनाना’ दोनों हो सकता है; मिट्टी और कुम्हार के प्रसंग में ‘बना रहा है’ अधिक सटीक है। एकवचन ‘तू’ मूल के सीधे, निर्भीक और धृष्ट संबोधन का बल रखता है।
- source_word: וּפָעָלְךָ
  choice: या तेरी बनाई वस्तु
  rationale: פֹּעַל कार्य, कृति या उत्पाद को सूचित कर सकता है। यहाँ बोलनेवाली गढ़ी हुई वस्तु है; ‘तेरी बनाई वस्तु’ समानांतर वाक्य को हिन्दी में स्पष्ट रखता है।
- source_word: אֵין יָדַיִם לוֹ
  choice: उसके हाथ ही नहीं हैं
  rationale: शाब्दिक अर्थ ‘उसके लिए/उसके हाथ नहीं हैं’ है। मुख्य पाठ इसे बनानेवाले की योग्यता पर सृष्ट वस्तु की धृष्ट टिप्पणी के रूप में रखता है; ‘ही’ तिरस्कार का बल व्यक्त करता है। ‘हाथ’ का ‘हत्थे’ अर्थ भी संभव है और पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: अंतिम उपवाक्य में बनानेवाले की मानवरूपी आलोचना
  choice: बनाई हुई वस्तु अपने बनानेवाले के विषय में कहती है, ‘उसके हाथ ही नहीं हैं।’
  alternative: पात्र अपने विषय में कहता है, ‘इसके हत्थे नहीं हैं।’
  rationale: प्रसंग सृष्ट प्राणी द्वारा अपने सृष्टिकर्ता से विवाद करने की निंदा करता है। इसलिए मुख्य पाठ में ‘हाथ’ बनानेवाले की क्षमता पर अपमानजनक आक्षेप के रूप में अधिक स्वाभाविक है। फिर भी יָדַיִם का पात्र के ‘हत्थे’ के रूप में अर्थ लेना भाषिक रूप से संभव है, इसलिए उस तनाव को पाद-टिप्पणी में बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘रचनेवाला’ सृष्टि-संबंधी व्यापक अर्थ देता है, जबकि ‘गढ़नेवाला’ अगले मिट्टी-कुम्हार बिंब को मूर्त बनाता है। सीधे संबोधन में ‘तू/तेरी’ मूल की एकवचन निकटता और धृष्टता व्यक्त करते हैं, न कि अनादरपूर्ण अनुवादकीय स्वर।
