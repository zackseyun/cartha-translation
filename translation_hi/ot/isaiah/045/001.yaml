base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/001.yaml
  text: 'Thus says Yahweh to his anointed[a], to Cyrus, whose right hand I have grasped, to subdue nations before him and to loosen the loins of kings, to open doors before him[c][b], and gates shall not be shut:'
translation:
  language: hi
  text: 'याहवे अपने अभिषिक्त[a], कुस्रू, से यों कहता है—


    “जिसका दाहिना हाथ मैंने थाम लिया है,

    ताकि उसके सामने राष्ट्रों को वश में करूँ,

    राजाओं के कमरबंद ढीले कर दूँ[b],

    उसके सामने दोहरे द्वार खोल दूँ[c],

    और फाटक बंद नहीं किए जाएँगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ ‘अभिषिक्त’ उसी शब्द-परिवार से है जिससे ‘मसीह’ शब्द जुड़ा है। इस पद में यह याहवे द्वारा इस काम के लिए नियुक्त कुस्रू को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “राजाओं की कमरें/कटि खोल दूँ।” यह मुहावरा उन्हें निर्बल या निरस्त्र करने का संकेत हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी शब्द द्विवचन में है; इसका अर्थ “दोहरे द्वार” हो सकता है, यद्यपि सामान्य रूप से “द्वार” भी लिया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यवाणी की औपचारिक उद्घोषणा को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले इब्रानी व्यक्तिगत नाम का निकट लिप्यंतरण है; इसे सामान्य उपाधि में बदलने से नाम की वाचाई विशिष्टता खो जाती।
- source_word: לִמְשִׁיחוֹ
  choice: अपने अभिषिक्त
  rationale: मूल अर्थ ‘जिसका अभिषेक किया गया’ सुरक्षित रहता है। यहाँ यह कुस्रू को सौंपे गए ऐतिहासिक कार्य को बताता है, फिर भी बाद के ‘मसीह’ संबंधी शब्द-साम्य को मिटाता नहीं।
- source_word: לְכוֹרֶשׁ
  choice: कुस्रू
  rationale: फारसी राजा Cyrus के लिए हिन्दी बाइबलीय परंपरा में परिचित नाम-रूप है।
- source_word: הֶחֱזַקְתִּי בִימִינוֹ
  choice: मैंने उसका दाहिना हाथ थाम लिया है
  rationale: सहारा देने और सामर्थ्य प्रदान करने की ठोस छवि को स्पष्ट, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לְרַד לְפָנָיו גּוֹיִם
  choice: ताकि उसके सामने जातियों को वश में करूँ
  rationale: רדה के राजनीतिक-सैनिक अधीनता वाले भाव और गּוֹיִם के भू-राजनीतिक अर्थ को व्यक्त करता है। प्रथम पुरुष ‘करूँ’ निकटवर्ती दिव्य कर्ता के साथ संरचना को स्पष्ट करता है।
- source_word: וּמָתְנֵי מְלָכִים אֲפַתֵּחַ
  choice: राजाओं के कमरबंद खोल दूँ
  rationale: शाब्दिक ‘राजाओं की कमर खोलूँ’ हिन्दी में भ्रामक है। कमरबंद खोलना मूल दृश्य को बनाए रखते हुए राजाओं को निर्बल या निरस्त्र करने के मुहावरे की ओर संकेत करता है।
- source_word: דְּלָתַיִם
  choice: दोहरे द्वार
  rationale: इब्रानी द्विवचन को मुख्य पाठ में सुरक्षित रखता है और नगर अथवा महल के जोड़ीदार द्वारों की छवि देता है।
- source_word: וּשְׁעָרִים לֹא יִסָּגֵרוּ
  choice: और फाटक बंद न किए जाएँ
  rationale: मूल के निष्क्रिय रूप और भावी कार्य के उद्देश्य/परिणाम को हिन्दी में बनाए रखता है।
theological_decisions:
- issue: कुस्रू के लिए מְשִׁיחוֹ का प्रयोग
  choice: अपने अभिषिक्त
  alternative: अपने मसीह से
  rationale: ‘अभिषिक्त’ मूल शब्द का सामान्य अर्थ और इस पद का आश्चर्य सुरक्षित रखता है कि याहवे एक विदेशी राजा को अपने कार्य के लिए नियुक्त करता है; ‘मसीह’ यहाँ बाद के विशिष्ट उद्धारकर्ता-संबंधी अर्थ को अनावश्यक रूप से आरोपित कर सकता है।
- issue: कुस्रू की विजय में कर्तृत्व
  choice: याहवे प्रथम पुरुष में जातियों को वश में करता और राजाओं के कमरबंद खोलता है
  alternative: कुस्रू स्वयं इन क्रियाओं को करता है
  rationale: मूल वाक्य में ‘मैंने थामा’ और ‘मैं खोलूँगा’ दिव्य कर्तृत्व को रेखांकित करते हैं, जबकि कुस्रू उसका नियुक्त साधन है। अनुवाद इसी तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्य-पंक्तियाँ मूल की समानांतर रचना को उभारती हैं। ‘याहवे’ व्यक्तिगत दिव्य नाम को सुरक्षित रखता है; ‘कुस्रू’ हिन्दी पाठकों के लिए स्थापित नाम-रूप है। मुहावरेदार कठिनाइयों को मुख्य पाठ में पठनीय रखा गया है और शाब्दिक विकल्प पादटिप्पणियों में दिए गए हैं।
