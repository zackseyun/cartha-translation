base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/013.yaml
  text: I have stirred him up in righteousness[a], and I will make all his ways straight. He will rebuild my city and send my exiles away, not for a price and not for a bribe[c][b], says Yahweh of Armies.
translation:
  language: hi
  text: “मैंने उसे धार्मिकता में उभारा है,[a] और मैं उसके सभी मार्ग सीधे करूँगा। वह मेरे नगर को फिर से बनाएगा[b] और मेरे निर्वासितों को मुक्त कर देगा, किसी दाम या घूस के बदले नहीं,” सेनाओं का याहवे[c] कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने उसे धार्मिकता में जगा उठाया है।”
    reason: הַעִירֹתִהוּ जगाने, उकसाने या सक्रिय करने का भाव भी दे सकता है।
  - marker: b
    text: शाब्दिक रूप से, “वह मेरे नगर को बनाएगा।” विनाश के बाद पुनर्स्थापना के संदर्भ में मुख्य पाठ में “फिर से बनाएगा” है।
    reason: इब्रानी क्रिया अपने आप में केवल ‘बनाना’ कहती है; पुनर्निर्माण का भाव प्रसंग से आता है।
  - marker: c
    text: परंपरागत रूप से, “सेनाओं का यहोवा”; अन्य अनुवादों में, “सेनाओं का प्रभु।”
    reason: יהוה व्यक्तिगत दिव्य नाम है, जबकि צְבָאוֹת का अनुवाद परंपरा में अलग-अलग ढंग से किया गया है।
lexical_decisions:
- source_word: הַעִירֹתִהוּ
  choice: उसे उभारा है
  rationale: हिफ़ील रूप का अर्थ जगाना, सक्रिय करना या किसी उद्देश्य के लिए प्रेरित करना हो सकता है। ‘उभारा’ परमेश्वर की पहल को व्यक्त करता है, पर पद या राजसत्ता पर बैठाने का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: בְצֶדֶק
  choice: धार्मिकता में
  rationale: यह सीधा और व्यापक अनुवाद है, जो नैतिक धार्मिकता और न्याय—दोनों की अर्थ-छाया को खुला रखता है।
- source_word: אֲיַשֵּׁר ... דְּרָכָיו
  choice: उसके सभी मार्ग सीधे करूँगा
  rationale: इब्रानी रूपक को बनाए रखता है और उसके कार्य-पथ को सुगम या निर्देशित करने का भाव व्यक्त करता है।
- source_word: יִבְנֶה עִירִי
  choice: मेरे नगर को फिर से बनाएगा
  rationale: क्रिया का मूल अर्थ ‘बनाना’ है; विनष्ट यरूशलेम की पुनर्स्थापना के ऐतिहासिक संदर्भ में ‘फिर से बनाएगा’ स्वाभाविक और स्पष्ट है।
- source_word: גָלוּתִי
  choice: मेरे निर्वासित लोगों
  rationale: संज्ञा निर्वासन की दशा या निर्वासित समुदाय, दोनों को सूचित कर सकती है। यहाँ मुक्त किए जाने वाले लोगों का अर्थ प्रसंग में सबसे स्वाभाविक है।
- source_word: יְשַׁלֵּחַ
  choice: मुक्त कर देगा
  rationale: पिएल रूप भेज देने, जाने देने या रिहा करने का अर्थ दे सकता है। निर्वासित लोगों के संदर्भ में ‘मुक्त कर देगा’ सहज है और उनकी वापसी का गंतव्य पाठ में नहीं जोड़ता।
- source_word: לֹא בִמְחִיר וְלֹא בְשֹׁחַד
  choice: न कोई दाम लेकर, न कोई घूस लेकर
  rationale: वाणिज्यिक भुगतान और अनुचित प्रलोभन के समानांतर निषेध को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: व्यक्तिगत दिव्य नाम को नाम के रूप में रखता है और צְבָאוֹת के बहुवचन तथा सामरिक भाव को पारदर्शी रूप से अनूदित करता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत दिव्य नाम है। ‘याहवे’ उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: सर्वनाम का संकेत कुस्रू की ओर है या नहीं
  choice: मुख्य पाठ में ‘उसे/उसके/वह’ बनाए रखना
  alternative: मुख्य पाठ में कुस्रू का नाम स्पष्ट करना
  rationale: आस-पास का संदर्भ कुस्रू की पहचान कराता है, लेकिन इस पद में केवल सर्वनाम हैं; इसलिए नाम जोड़ना अनावश्यक व्याख्यात्मक विस्तार होता।
- issue: בְצֶדֶק में धार्मिकता और न्याय की अर्थ-छाया
  choice: धार्मिकता में
  alternative: न्याय के लिए; न्याय के अनुसार
  rationale: व्यापक शब्दावली नैतिक और न्यायिक दोनों अर्थों को खुला रखती है और किसी एक धर्मवैज्ञानिक व्याख्या को निर्णायक नहीं बनाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के लिए सहज रखी गई है। ‘उभारा,’ ‘मार्ग सीधे करूँगा,’ और ‘सेनाओं का याहवे’ मूल के प्रमुख रूपकों और नाम को सुरक्षित रखते हैं; ‘मुक्त कर देगा’ तथा ‘दाम लेकर’ सामान्य पाठक के लिए स्वाभाविक हिन्दी देते हैं।
