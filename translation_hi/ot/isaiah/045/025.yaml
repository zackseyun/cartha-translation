  yaml_path: translation/ot/isaiah/045/025.yaml
  text: In Yahweh all the offspring of Israel will be justified and will boast[a][b].
translation:
  language: hi
  text: याहवे में इस्राएल के सारे वंशज[b] धर्मी ठहराए जाएंगे[a] और गर्व करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सही सिद्ध होंगे” या “निर्दोष सिद्ध होंगे।” इब्रानी क्रिया का अर्थ किसी को सही ठहराया जाना या उसका सही सिद्ध होना भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “इस्राएल का सारा बीज।” यहाँ “बीज” का अर्थ वंशज है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיהוָה
  choice: याहवे में
  rationale: בְּ यहाँ संबंध, आधार या क्षेत्र का भाव रख सकता है। “याहवे में” इब्रानी की संक्षिप्तता बनाए रखता है और धर्मी ठहराए जाने तथा गर्व करने—दोनों को याहवे से संबद्ध करता है।
- source_word: יִצְדְּקוּ
  choice: धर्मी ठहराया जाएगा
  rationale: צדק का क़ाल रूप यहाँ सही सिद्ध होने, निर्दोष ठहराए जाने या धर्मी ठहराए जाने का भाव दे सकता है। “धर्मी ठहराया जाएगा” न्यायिक/परिणामसूचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וְיִתְהַלְלוּ
  choice: और उस पर गर्व करेगा
  rationale: הלל के हित्पएल रूप का अर्थ गर्व करना या गौरव मानना है। हिन्दी में केवल “गर्व करेगा” संभावित रूप से आत्मगर्व का संकेत दे सकता है; “उस पर” जोड़कर याहवे में गर्व करने का निहित संबंध स्पष्ट और स्वाभाविक होता है।
- source_word: כָּל
  choice: सारा
  rationale: כָּל सामूहिक पद זֶרַע יִשְׂרָאֵל को पूर्णता से विशेषित करता है; “सारा वंश” आधुनिक हिन्दी में स्वाभाविक है।
- source_word: זֶרַע יִשְׂרָאֵל
  choice: इस्राएल का सारा वंश
  rationale: זֶרַע का शाब्दिक अर्थ “बीज” है, पर यहाँ यह सामूहिक रूप से वंशजों को दर्शाता है। “वंश” गरिमापूर्ण और सहज हिन्दी है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में वाचा-संबंधी निजी नाम יהוה है। “याहवे” उसका सीधा लिप्यंतरण करता है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: उद्धार के संदर्भ में צדק की अर्थ-छाया
  choice: धर्मी ठहराया जाएगा
  alternative: सही सिद्ध होगा / निर्दोष ठहराया जाएगा
  rationale: यह चयन ईश्वर के संबंध में सही ठहराए जाने का घोषणात्मक भाव व्यक्त करता है, पर क्रिया को किसी संकीर्ण परवर्ती सिद्धान्त तक सीमित नहीं करता। वास्तविक वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: וְיִתְהַלְלוּ में गर्व का विषय/आधार
  choice: उस पर गर्व करेगा
  alternative: गर्व करेगा / गौरव करेगा
  rationale: इब्रानी में पूर्वसर्गीय पद “याहवे में” दोनों क्रियाओं से जुड़ सकता है। हिन्दी में “उस पर गर्व करेगा” उस संबंध को स्वाभाविक बनाता है, बिना आत्मगर्व का अर्थ थोपे।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामूहिक एकवचन वाला वाक्य-विन्यास अपनाया गया है। “धर्मी ठहराया जाएगा” धार्मिक शब्दावली से परिचित पाठकों के लिए अर्थपूर्ण है, और पादटिप्पणी उसकी व्यापक इब्रानी अर्थ-सीमा बचाती है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
