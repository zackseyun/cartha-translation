  rationale: संशोधन से हिन्दी वाक्य अधिक स्वाभाविक होता है, כֻּלָּם और יַחְדָּו का काव्यात्मक/वाक्यगत वितरण स्पष्ट होता है, और ‘disgrace’ का भाव हिन्दी मुहावरे में सुरक्षित रहता है। पादटिप्पणी-चिह्न और उसका शब्दगत विकल्प यथावत् उपयुक्त हैं।
