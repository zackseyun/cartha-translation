id: ISA.45.16
reference: Isaiah 45:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בּ֥וֹשׁוּ וְ/גַֽם נִכְלְמ֖וּ כֻּלָּ֑/ם יַחְדָּו֙ הָלְכ֣וּ בַ/כְּלִמָּ֔ה חָרָשֵׁ֖י צִירִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/016.yaml
  text: They are put to shame and also humiliated[a], all of them together; the makers of idols go in disgrace.
translation:
  language: hi
  text: वे सभी लज्जित और अपमानित हुए; मूर्तियों[a] के कारीगर एक साथ अपमानित होकर चले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रतिमाओं के कारीगर।”
    reason: צִירִים का अर्थ गढ़ी हुई आकृतियाँ या प्रतिमाएँ भी लिया जा सकता है; प्रसंग के कारण मुख्य पाठ में ‘मूर्तियाँ’ रखा गया है।
lexical_decisions:
- source_word: בּוֹשׁוּ
  choice: लज्जित हुए
  rationale: यह क्रिया लज्जा और आशा टूटने से उत्पन्न सार्वजनिक निरादर का भाव व्यक्त करती है। हिब्रू पूर्ण रूप को हिन्दी भूतकाल में रखा गया है, जिससे भविष्यसूचक घोषणा का निश्चय भी बना रहता है।
- source_word: וְגַם נִכְלְמוּ
  choice: और अपमानित भी हुए
  rationale: וְגַם के बलाघात को ‘भी’ और נִכְלְמוּ की तीव्रतर लज्जा को ‘अपमानित’ से व्यक्त किया गया है; इससे समानांतर पदों का अर्थगत उत्कर्ष बना रहता है।
- source_word: כֻּלָּם
  choice: वे सब के सब
  rationale: सर्वसमावेशी अर्थ और सर्वनामिक प्रत्यय, दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: יַחְדָּו
  choice: एक साथ
  rationale: मसोरेटिक वाक्य-विभाजन के अनुसार इसे अगले क्रियापद ‘चले गए’ के साथ रखा गया है।
- source_word: הָלְכוּ בַכְּלִמָּה
  choice: अपमान में चले गए
  rationale: शाब्दिक गति-रूपक और अपमान की अवस्था, दोनों को बनाए रखता है; हिन्दी में यह गंभीर और बोधगम्य है।
- source_word: חָרָשֵׁי צִירִים
  choice: मूर्तियों के कारीगर
  rationale: חָרָשֵׁי कारीगरों या बनाने वालों को और צִירִים गढ़ी हुई आकृतियों को दर्शाता है। निकटवर्ती मूर्तिपूजा-विरोधी प्रसंग में ‘मूर्तियाँ’ संदर्भ को स्वाभाविक रूप से स्पष्ट करता है।
theological_decisions:
- issue: חָרָשֵׁי צִירִים का आशय
  choice: मूर्तियों के कारीगर
  alternative: प्रतिमाओं के कारीगर
  rationale: यशायाह 45 के प्रसंग में यह वाक्यांश झूठे देवताओं की गढ़ी हुई आकृतियाँ बनाने वालों को सूचित करता है। मुख्य पाठ में ‘मूर्तियाँ’ प्रसंगगत धार्मिक आशय स्पष्ट करता है, जबकि पादटिप्पणी अधिक सामान्य शब्दगत विकल्प सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। हिब्रू के समानांतर लज्जा-शब्दों को ‘लज्जित’ और ‘अपमानित’ के रूप में अलग रखा गया है। अर्धविराम दोनों काव्य-पदों का विभाजन दिखाता है, और ‘एक साथ’ को मसोरेटिक विराम-चिह्नों के अनुरूप दूसरे पद से जोड़ा गया है।
