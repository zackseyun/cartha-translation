source:
  edition: WLC
  text: לְמַ֣עַן יֵדְע֗וּ מִ/מִּזְרַח שֶׁ֨מֶשׁ֙ וּ/מִ/מַּ֣עֲרָבָ֔/הּ כִּי אֶ֖פֶס בִּלְעָדָ֑/י אֲנִ֥י יְהוָ֖ה וְ/אֵ֥ין עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/006.yaml
  text: so that they may know[a], from the rising of the sun and from its setting, that there is none besides me. I am Yahweh[b], and there is no other.
translation:
  language: hi
  text: ताकि जहाँ सूर्य उगता है वहाँ से लेकर जहाँ वह अस्त होता है वहाँ तक लोग जानें कि मेरे सिवा कोई नहीं है। मैं याहवे हूँ, और कोई दूसरा नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן יֵדְעוּ
  choice: ताकि ... लोग जान लें
  rationale: לְמַעַן के प्रयोजनसूचक बल और उसके साथ आए अपूर्ण क्रियारूप को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है। बहुवचन कर्ता को स्पष्ट करने के लिए ‘लोग’ जोड़ा गया है।
- source_word: מִמִּזְרַח שֶׁמֶשׁ וּמִמַּעֲרָבָהּ
  choice: सूर्य के उदय से लेकर उसके अस्त होने तक
  rationale: मूल के सूर्य-उदय और सूर्य-अस्त के काव्यात्मक बिंब तथा स्त्रीलिंग प्रत्यय से सूर्य की ओर लौटते संकेत को बनाए रखता है; हिन्दी में ‘से लेकर ... तक’ पूरे भौगोलिक विस्तार को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ यह जानने की विषयवस्तु का परिचय देता है, कारण का नहीं।
- source_word: אֶפֶס בִּלְעָדָי
  choice: मेरे सिवा कोई नहीं है
  rationale: यह वाक्यांश विशिष्ट और अनन्य अस्तित्व की घोषणा करता है। ‘कोई’ सन्दर्भ में परमेश्वर की तुलना किसी अन्य सत्ता से होने का भाव स्पष्ट रखता है।
- source_word: אֲנִי יְהוָה
  choice: मैं याहवे हूँ
  rationale: स्पष्ट सर्वनाम אֲנִי के बल को बनाए रखा गया है और चार-अक्षरीय ईश्वरीय नाम יהוה को उपाधि में बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: וְאֵין עוֹד
  choice: और कोई दूसरा नहीं है
  rationale: यशायाह में प्रयुक्त अनन्यता की संक्षिप्त घोषणा को स्पष्ट, वर्तमान हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ संभावित प्राचीन उच्चारण का प्रचलित लिप्यंतरण है; इसे केवल उपाधि ‘प्रभु’ से बदलने पर नाम और उपाधि का भेद मिट जाता।
- issue: भौगोलिक अभिव्यक्ति का दायरा
  choice: सूर्य के उदय से लेकर उसके अस्त होने तक
  alternative: पूर्व से पश्चिम तक
  rationale: मूल में दिशाओं के साधारण नामों के बजाय सूर्य का काव्यात्मक बिंब है। चुना हुआ रूप उसी बिंब के साथ व्यापक भौगोलिक दायरा व्यक्त करता है।
- issue: अनन्यता की घोषणा
  choice: मेरे सिवा कोई नहीं है ... कोई दूसरा नहीं है
  alternative: मेरे अतिरिक्त कुछ नहीं है ... और कुछ नहीं
  rationale: सन्दर्भ में दावा किसी अन्य देव-सत्ता के न होने पर केंद्रित है। ‘कोई’ इस बल को बनाए रखता है, पर बाद की किसी व्यवस्थित धर्मशास्त्रीय व्याख्या को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘सूर्य के उदय ... अस्त होने’ से काव्यात्मकता बनी रहती है, जबकि वाक्य-विन्यास सामान्य हिन्दी पाठक के लिए सहज है।
