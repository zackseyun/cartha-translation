    text: या “मैं तुम्हारी कमर कसता हूँ,” “मैं तुम्हें बल देता हूँ,” अथवा “मैं तुम्हें हथियारबंद करता हूँ।” इब्रानी क्रिया का अर्थ किसी को शक्ति देकर कार्य के लिए तैयार या सुसज्जित करना भी हो सकता है।
