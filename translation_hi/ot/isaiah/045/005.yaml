lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित और पहचाना जाने वाला रूप, जो उपाधि से बदलने के बजाय इब्रानी व्यक्तिगत नाम को प्रस्तुत करता है।
- source_word: וְאֵין עוֹד
  choice: और कोई दूसरा नहीं
  rationale: यह आधुनिक, स्वाभाविक हिन्दी में पूर्ण अनन्यता का कथन सुरक्षित रखता है।
- source_word: זוּלָתִי אֵין אֱלֹהִים
  choice: मेरे सिवा कोई परमेश्वर नहीं
  rationale: זוּלָתִי के अपवर्जक अर्थ और אֱלֹהִים के इस प्रसंग में एकमात्र सच्चे परमेश्वर के अर्थ को स्पष्ट तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲאַזֶּרְךָ
  choice: मैं तुम्हें सामर्थ्य से सुसज्जित करता हूँ
  rationale: पिएल क्रिया אזר में कमर बाँधने, समर्थ करने और कार्य के लिए सुसज्जित करने का अर्थ-क्षेत्र है। यह चयन केवल आंतरिक बल देने के बजाय कार्य हेतु समर्थ-सुसज्जित करने की छवि को बनाए रखता है।
- source_word: וְלֹא יְדַעְתָּנִי
  choice: यद्यपि तुमने मुझे नहीं जाना
  rationale: 'प्रसंग में וְ को रियायती भाव में समझना स्वाभाविक है: यहोवा कुस्रू को उसके द्वारा पहले से पहचाने न जाने पर भी सुसज्जित करता है। पूर्ण पक्ष को ‘तुमने ... नहीं जाना’ से व्यक्त किया गया है।'
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है; इसलिए इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। हिन्दी पाठकों के लिए स्थापित लिप्यंतरण ‘यहोवा’ चुना गया है।
- issue: अंतिम उपवाक्य में וְ का संबंध
  choice: यद्यपि तुमने मुझे नहीं जाना
  alternative: और तुमने मुझे नहीं जाना
  rationale: निकटवर्ती प्रसंग यह विरोधाभास उभारता है कि परमेश्वर कुस्रू को उसके द्वारा परमेश्वर को न जानने पर भी नियुक्त और समर्थ करता है। रियायती अनुवाद इस तनाव को व्यक्त करता है, बिना ‘जानने’ को किसी संप्रदायगत अर्थ तक सीमित किए।
- issue: אֲאַזֶּרְךָ में सामर्थ्य और सुसज्जन
  choice: सामर्थ्य से सुसज्जित करता हूँ
  alternative: तुम्हें बल देता हूँ
  rationale: क्रिया का अर्थ केवल शक्ति प्रदान करना नहीं, बल्कि कमर बाँधकर या साधन देकर कार्य के लिए तैयार करना भी हो सकता है। चुना हुआ पद दोनों पहलुओं को साथ रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और घोषणात्मक शैली। समानांतर वाक्य-विन्यास और एकेश्वरवादी अनन्यता सुरक्षित रखी गई है। ‘सामर्थ्य से सुसज्जित’ सामान्य ‘बल देता’ से कुछ अधिक औपचारिक है, पर मूल क्रिया के व्यापक अर्थ को बेहतर व्यक्त करता है।
