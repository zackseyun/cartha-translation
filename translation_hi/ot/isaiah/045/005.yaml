base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/005.yaml
  text: I am Yahweh[a], and there is no other; besides me there is no God. I strengthen you, though you have not known me.
translation:
  language: hi
  text: मैं याहवे हूँ, और कोई दूसरा नहीं; मेरे सिवा कोई परमेश्वर नहीं। मैं तुम्हें सशक्त करूँगा[a], यद्यपि तुमने मुझे नहीं जाना।
  philosophy: optimal-equivalence
  footnotes:
