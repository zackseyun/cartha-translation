source:
  edition: WLC
  text: הַגִּ֣ידוּ וְ/הַגִּ֔ישׁוּ אַ֥ף יִֽוָּעֲצ֖וּ יַחְדָּ֑ו מִ֣י הִשְׁמִיעַ֩ זֹ֨את מִ/קֶּ֜דֶם מֵ/אָ֣ז הִגִּידָ֗/הּ הֲ/ל֨וֹא אֲנִ֤י יְהוָה֙ וְ/אֵֽין ע֤וֹד אֱלֹהִים֙ מִ/בַּלְעָדַ֔/י אֵֽל צַדִּ֣יק וּ/מוֹשִׁ֔יעַ אַ֖יִן זוּלָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/021.yaml
  text: Declare it and present your case[a]; indeed, let them consult together. Who announced this from long ago? Who declared it from former times? Was it not I, Yahweh? There is no other God besides me, a righteous God and a Savior[c][b]; there is none except me.
translation:
  language: hi
  text: घोषणा करो और अपना पक्ष प्रस्तुत करो[a]; हाँ, वे आपस में विचार-विमर्श करें। यह किसने बहुत पहले से ज्ञात कराया और प्राचीन काल से इसकी घोषणा की? क्या मैं, याहवे[b], ही नहीं था? मेरे सिवा कोई दूसरा परमेश्वर नहीं; मैं धर्मी[c] परमेश्वर और उद्धारकर्ता हूँ; मेरे अतिरिक्त कोई नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इसे निकट लाओ” अथवा “इसे प्रस्तुत करो”; यहाँ इब्रानी अभिव्यक्ति में न्यायालय की तरह अपना पक्ष या प्रमाण सामने रखने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: YHWH, परमेश्वर का व्यक्तिगत नाम; परंपरागत रूप से इसका अनुवाद “प्रभु” किया गया है।'
    reason: lexical_alternative
  - marker: c
    text: या “न्यायी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידוּ
  choice: घोषणा करो
  rationale: बहुवचन आज्ञार्थक रूप औपचारिक रूप से बताने या घोषित करने का आह्वान करता है; विवादात्मक संदर्भ में ‘घोषणा करो’ स्वाभाविक है।
- source_word: וְהַגִּישׁוּ
  choice: अपना पक्ष प्रस्तुत करो
  rationale: हिफ़ील आज्ञार्थक का मूल अर्थ ‘निकट लाओ’ है, पर यहाँ न्यायालय-जैसे विवाद में प्रमाण या पक्ष सामने रखने का भाव संभावित है; वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: אַף יִוָּעֲצוּ יַחְדָּו
  choice: हाँ, वे मिलकर परामर्श करें
  rationale: कण אַף बल देता है और निफ़अल रूप सामूहिक विचार-विमर्श का आह्वान करता है।
- source_word: מִי הִשְׁמִיעַ זֹאת מִקֶּדֶם
  choice: किसने बहुत पहले से यह बात सुनाई?
  rationale: हिफ़ील क्रिया ‘सुनवाना/ज्ञात कराना’ का भाव देती है और מִקֶּדֶם दूर अतीत की ओर संकेत करता है।
- source_word: מֵאָז הִגִּידָהּ
  choice: किसने प्राचीन काल से इसकी घोषणा की?
  rationale: पहले प्रश्न से समानांतर, लुप्त प्रश्नवाचक को हिंदी में दोहराया गया है; מֵאָז को प्राचीन अतीत के कालगत संकेत के रूप में रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिब्रू में व्यक्तिगत वाचा-नाम YHWH है; हिंदी में प्रचलित नामरूप ‘यहोवा’ मुख्य पाठ में रखा गया है और तथ्य पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וְאֵין עוֹד אֱלֹהִים מִבַּלְעָדַי
  choice: मेरे सिवा कोई और परमेश्वर नहीं है
  rationale: यह परमेश्वर की अद्वितीयता का स्पष्ट कथन है; हिंदी में स्वाभाविक निषेधात्मक रचना अपनाई गई है।
- source_word: אֵל צַדִּיק
  choice: धर्मी परमेश्वर
  rationale: צַדִּיק में नैतिक धार्मिकता और न्यायपरायणता दोनों के भाव हो सकते हैं; ‘धर्मी’ मुख्य पाठ में है और ‘न्यायी’ विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: וּמוֹשִׁיעַ
  choice: और उद्धारकर्ता
  rationale: यह बचाने या छुड़ाने वाले के लिए प्रयुक्त कृदंत है; ‘उद्धारकर्ता’ संज्ञात्मक बल और गरिमा बनाए रखता है।
- source_word: אַיִן זוּלָתִי
  choice: मेरे अतिरिक्त कोई नहीं
  rationale: अंतिम वाक्य पिछले अद्वितीयता-वचन को बलपूर्वक दोहराता है; शब्दगत पुनरावृत्ति घटाते हुए अर्थ सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम YHWH है। ‘यहोवा’ हिंदी पाठकों के लिए स्थापित रूप है; पादटिप्पणी मूल रूप बताती है।
- issue: צַדִּיק का परमेश्वर के लिए अर्थ
  choice: धर्मी
  alternative: न्यायी
  rationale: दोनों अर्थ शब्द में निहित हैं। ‘धर्मी’ व्यापक नैतिक और वाचागत भाव रखता है, जबकि ‘न्यायी’ वैध विकल्प के रूप में पादटिप्पणी में दिया गया है।
- issue: אֵל צַדִּיק וּמוֹשִׁיעַ में संबंध
  choice: मैं धर्मी परमेश्वर और उद्धारकर्ता हूँ
  alternative: एक धर्मी परमेश्वर और उद्धारकर्ता
  rationale: हिब्रू में एक ही वक्ता के लिए दोनों विशेषण साथ आते हैं। हिंदी में ‘मैं...हूँ’ जोड़ना निहित विधेय को स्पष्ट करता है, बिना धार्मिकता और उद्धार के संबंध को अलग किए।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सार्वजनिक घोषणा और न्यायिक चुनौती के अनुकूल रजिस्टर। छोटे प्रश्नवाचक वाक्य मूल की वादात्मक लय बनाए रखते हैं। ‘परामर्श करें’, ‘पक्ष प्रस्तुत करो’ और ‘उद्धारकर्ता’ सामान्य बाइबलीय हिंदी में बोधगम्य हैं; अस्पष्ट न्यायालयीय संकेत और צַדִּיק का वैकल्पिक अर्थ पादटिप्पणियों में सुरक्षित रखे गए हैं।
