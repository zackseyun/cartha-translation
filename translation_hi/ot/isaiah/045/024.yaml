source:
  edition: WLC
  text: אַ֧ךְ בַּ/יהוָ֛ה לִ֥/י אָמַ֖ר צְדָק֣וֹת וָ/עֹ֑ז עָדָי/ו֙ יָב֣וֹא וְ/יֵבֹ֔שׁוּ כֹּ֖ל הַ/נֶּחֱרִ֥ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/024.yaml
  text: Only in Yahweh[a], it shall be said of me, are righteousness and strength; to him they shall come[b], and all who were enraged against him shall be put to shame.
translation:
  language: hi
  text: “निश्चय ही, याहवे में धार्मिकता और सामर्थ्य हैं,” ऐसा कहा जाएगा[a]। उसके पास लोग आएँगे[b], और वे सब जो उसके विरुद्ध क्रोधित हैं, लज्जित होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पदबंध संक्षिप्त और अस्पष्ट है। इसका अनुवाद यह भी हो सकता है: “कोई कहेगा, ‘केवल याहवे में धार्मिकता और सामर्थ्य हैं,’” अथवा “उसने मुझसे कहा, ‘केवल याहवे में धार्मिकता और सामर्थ्य हैं।’”'
    reason: alternative_reading
  - marker: b
    text: इब्रानी क्रिया रूपतः एकवचन है, अर्थात “वह उसके पास आएगा,” पर यहाँ कर्ता अनिश्चित या सामूहिक हो सकता है।
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: אַךְ
  choice: केवल … ही
  rationale: यहाँ अव्यय अनन्यता और बल दोनों प्रकट करता है; हिन्दी में ‘केवल … ही’ इस अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בַּיהוָה
  choice: याहवे में
  rationale: בְ को उपलब्धता अथवा आधार के क्षेत्र के रूप में ‘में’ से व्यक्त किया गया है, और יהוה को उसके नाम के रूप में ‘याहवे’ लिखा गया है।
- source_word: לִי אָמַר
  choice: मेरे विषय में ऐसा कहा जाएगा
  rationale: यह अत्यंत संक्षिप्त और वाक्य-विन्यास की दृष्टि से संदिग्ध पदबंध है। मुख्य पाठ में इसे भविष्यसूचक कथन के रूप में रखा गया है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: צְדָקוֹת
  choice: धार्मिकता
  rationale: इब्रानी बहुवचन धार्मिक कार्यों, न्यायपूर्ण हस्तक्षेपों अथवा निर्दोष ठहराए जाने के प्रसंगों को सूचित कर सकता है; ‘धार्मिकता’ हिन्दी में इसकी व्यापक अमूर्त धारणा को स्वाभाविक रूप से व्यक्त करती है।
- source_word: וָעֹז
  choice: और सामर्थ्य
  rationale: עֹז शक्ति अथवा सामर्थ्य को दर्शाता है; ‘सामर्थ्य’ गरिमापूर्ण और सहज आधुनिक हिन्दी है।
- source_word: עָדָיו יָבֹא
  choice: लोग उसके पास आएँगे
  rationale: क्रिया रूप एकवचन है, पर प्रसंग में उसका कर्ता अनिश्चित अथवा सामूहिक समझा जा सकता है; हिन्दी में बहुवचन कथन अगले बहुवचन उपवाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: וְיֵבֹשׁוּ
  choice: लज्जित होंगे
  rationale: בוש यहाँ अपमान और निराशा का परिणाम व्यक्त करता है। मूल क्रिया को अनावश्यक रूप से कर्मवाच्य बनाए बिना ‘लज्जित होंगे’ उसका सीधा अर्थ देता है।
- source_word: הַנֶּחֱרִים בּוֹ
  choice: जो उसके विरुद्ध क्रोध से भरे थे
  rationale: חרה तीव्र, जलते हुए क्रोध का बोध देता है और בּוֹ उस क्रोध की दिशा बताता है; चुना हुआ वाक्यांश दोनों बातों को स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: צְדָקוֹת का अर्थ
  choice: धार्मिकता
  alternative: धार्मिक कार्य; न्यायपूर्ण विजय; निर्दोष ठहराने के कार्य
  rationale: यह शब्द बहुवचन है और परमेश्वर के न्यायपूर्ण चरित्र तथा उसके न्यायपूर्ण कार्य—दोनों की ओर संकेत कर सकता है। मुख्य पाठ व्यापक अर्थ रखता है और बहुवचन की बारीकी पादटिप्पणी में दी गई है।
- issue: לִי אָמַר की वाक्यगत अस्पष्टता
  choice: मेरे विषय में ऐसा कहा जाएगा
  alternative: कोई कहेगा, ‘केवल याहवे में धार्मिकता और सामर्थ्य हैं’; उसने मुझसे कहा
  rationale: इब्रानी में कथनकर्ता और לִי का संबंध स्पष्ट नहीं है। मुख्य पाठ एक सम्भव पाठ ग्रहण करता है, पर अन्य व्याकरणतः सम्भव पाठों को पादटिप्पणी में सुरक्षित रखता है।
- issue: याहवे के पास आने वाले का वचन और संख्या
  choice: लोग उसके पास आएँगे
  alternative: वह उसके पास आएगा
  rationale: יָבֹא रूपतः एकवचन है, पर कर्ता अनिश्चित या सामूहिक हो सकता है और इसके बाद बहुवचन क्रिया आती है। हिन्दी में सामूहिक बहुवचन प्रसंग को सहज बनाता है, जबकि रूपगत एकवचन पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य की इब्रानी अस्पष्टता को मुख्य पाठ में अत्यधिक बोझिल किए बिना पादटिप्पणियों में स्पष्ट किया गया है। ‘क्रोध से भरे थे’ तीव्रता बनाए रखता है और ‘लज्जित होंगे’ मूल क्रिया का सीधा, स्वाभाविक रूप है।
