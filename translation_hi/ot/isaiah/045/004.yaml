base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/004.yaml
  text: For the sake of my servant Jacob[a], and Israel my chosen one, I called you by your name; I surnamed you, though you did not know me.
translation:
  language: hi
  text: मेरे सेवक याकूब और मेरे चुने हुए इस्राएल के लिए, मैंने तुम्हें तुम्हारे नाम से पुकारा; मैंने तुम्हें उपाधि दी[a], यद्यपि तुम मुझे नहीं जानते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने तुम्हें एक विशेष नाम दिया” अथवा “मैंने तुम्हें एक सम्मानसूचक नाम दिया।” इब्रानी क्रिया किसी को पदनाम, उपनाम या सम्मानसूचक नाम देने का अर्थ रख सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: के निमित्त
  rationale: यह उद्देश्य और प्रेरक कारण—दोनों का भाव रखता है; ‘के निमित्त’ आधुनिक, गरिमापूर्ण हिन्दी में इस संयुक्त अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַבְדִּי
  choice: अपने सेवक
  rationale: यहाँ यह याकूब के लिए वाचाई और सम्मानसूचक पद है; ‘दास’ अनावश्यक रूप से बंधुआ स्थिति पर बल दे सकता है।
- source_word: בְּחִירִי
  choice: अपने चुने हुए
  rationale: विशेषण यहाँ संज्ञा के समान प्रयुक्त होकर इस्राएल को परमेश्वर द्वारा चुना हुआ बताता है।
- source_word: וָאֶקְרָא לְךָ בִּשְׁמֶךָ
  choice: मैंने तुम्हें तुम्हारे नाम से पुकारा
  rationale: यह अनुवाद संबोधन की व्यक्तिगतता को बनाए रखता है और मूल में उपस्थित दोनों द्वितीय-पुरुष प्रत्ययों को स्पष्ट करता है।
- source_word: אֲכַנְּךָ
  choice: मैंने तुम्हें एक उपाधि दी
  rationale: पिएल रूप किसी व्यक्ति को पदनाम, विशेष नाम या उपाधि देने का संकेत देता है। ‘उपाधि दी’ अस्पष्टता को पर्याप्त रूप से बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְלֹא יְדַעְתָּנִי
  choice: यद्यपि तुम मुझे नहीं जानते थे
  rationale: 'संदर्भ में वाक्यांश रियायती विरोध व्यक्त करता है: परमेश्वर ने कुस्रू को नियुक्त और नामित किया, जबकि वह परमेश्वर को नहीं जानता था।'
theological_decisions:
- issue: सम्बोधित व्यक्ति का परमेश्वर को न जानना
  choice: कुस्रू को सम्बोधित मानते हुए उसके परमेश्वर को न जानने की बात स्पष्ट रखी गई है।
  alternative: ‘न जानना’ को केवल पूर्ण पहचान या स्वीकार की कमी के रूप में नरम करना।
  rationale: निकटवर्ती संदर्भ में सम्बोधित व्यक्ति कुस्रू है। पाठ इस तनाव को बनाए रखता है कि परमेश्वर ऐसे शासक को नियुक्त करता है जो उसे नहीं जानता; उसके बाद के परिवर्तन की कोई धारणा नहीं जोड़ी गई।
- issue: प्रथम पुरुष कर्म-प्रत्यय में निहित ईश्वरीय वक्ता
  choice: ‘मुझे’
  alternative: ‘यहोवा को’ या ‘प्रभु को’
  rationale: मूल पाठ में केवल प्रथम पुरुष कर्म-प्रत्यय है। वक्ता की पहचान संदर्भ से स्पष्ट है, इसलिए ईश्वरीय नाम जोड़ना अनुवाद से अधिक व्याख्या होता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष रखी गई है। एकवचन सम्बोधन के लिए ‘तुम्हें/तुम’ चुना गया है, जो आज की हिन्दी में स्वाभाविक है और न तो अत्यधिक अनौपचारिक है, न कृत्रिम रूप से पुरातन।
