base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/017.yaml
  text: Israel is saved by Yahweh with an everlasting salvation[b][a]; you will not be put to shame or disgraced forever and ever.
translation:
  language: hi
  text: याहवेह के द्वारा इस्राएल को अनन्त उद्धार प्राप्त होता है[a]; वे युगानुयुग न तो लज्जित होंगे, न अपमानित।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवेह में”; इब्रानी पूर्वसर्ग साधन या कर्ता के भाव के साथ-साथ उस क्षेत्र को भी व्यक्त कर सकता है जिसमें उद्धार प्राप्त होता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂרָאֵל נוֹשַׁע
  choice: इस्राएल ... बचाया जाता है
  rationale: निफ़अल रूप इस्राएल के उद्धार को व्यक्त करता है। वर्तमानकालीन सामान्य कथन इब्रानी की कालगत खुली प्रकृति को बनाए रखता है और इसे केवल अतीत या भविष्य तक सीमित नहीं करता।
- source_word: בַּיהוָה
  choice: याहवेह के द्वारा
  rationale: निष्क्रिय क्रिया के साथ ב को यहाँ साधन अथवा कर्ता-सदृश अर्थ में स्वाभाविक रूप से समझा जा सकता है; फिर भी 'याहवेह में' का क्षेत्रगत अर्थ संभव है और पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יהוה
  choice: याहवेह
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम को नाम के रूप में प्रस्तुत किया गया है।
- source_word: תְּשׁוּעַת עוֹלָמִים
  choice: सदा के उद्धार से
  rationale: रचना का शाब्दिक भाव 'युगों का उद्धार' है; 'सदा का उद्धार' उसकी स्थायी अवधि को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לֹא תֵבֹשׁוּ
  choice: लज्जित किए जाओगे
  rationale: यह सार्वजनिक लज्जा अथवा लज्जित होने के परिणामगत भाव को व्यक्त करता है।
- source_word: וְלֹא תִכָּלְמוּ
  choice: न अपमानित होगे
  rationale: यह पहले पद के समानांतर रहते हुए भी तिरस्कार और अपमान की अलग छाया को बनाए रखता है।
- source_word: עַד עוֹלְמֵי עַד
  choice: सदा-सर्वदा
  rationale: यह प्रबल अनंतकालिक मुहावरे का स्वाभाविक और गरिमापूर्ण हिन्दी समतुल्य है।
theological_decisions:
- issue: בַּיהוָה में ב का कर्तृवाचक अथवा क्षेत्रगत भाव
  choice: याहवेह के द्वारा
  alternative: याहवेह में
  rationale: निष्क्रिय 'बचाया जाता है' के साथ कर्तृवाचक भाव संदर्भ में सहज है, पर इब्रानी पूर्वसर्ग क्षेत्रगत अर्थ भी दे सकता है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: יהוה का अनुवाद
  choice: याहवेह
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है; उसे सामान्य उपाधि में बदलने के बजाय लिप्यंतरित किया गया है, बिना किसी अतिरिक्त सम्प्रदायगत व्याख्या के।
- issue: נוֹשַׁע की कालगत व्याख्या
  choice: बचाया जाता है
  alternative: बचाया गया है; बचाया जाएगा
  rationale: इब्रानी रूप स्वयं कथन को स्पष्ट रूप से केवल भूत या भविष्य में सीमित नहीं करता। हिन्दी वर्तमान सामान्य कथन उस खुलेपन को अपेक्षाकृत सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सहज। काव्यात्मक समानांतरता के लिए ‘लज्जित’ और ‘अपमानित’ को अलग रखा गया है; ‘सदा-सर्वदा’ अंतिम इब्रानी मुहावरे की तीव्रता बनाए रखता है।
