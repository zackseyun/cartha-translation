  edition: WLC
  text: הַרְעִ֤יפוּ שָׁמַ֨יִם֙ מִ/מַּ֔עַל וּ/שְׁחָקִ֖ים יִזְּלוּ צֶ֑דֶק תִּפְתַּח אֶ֣רֶץ וְ/יִפְרוּ יֶ֗שַׁע וּ/צְדָקָ֤ה תַצְמִ֨יחַ֙ יַ֔חַד אֲנִ֥י יְהוָ֖ה בְּרָאתִֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/008.yaml
  text: Drip down from above[a], O heavens, and let the clouds pour down righteousness; let the earth open, that salvation may sprout, and let righteousness spring up together. I, Yahweh, have created it.
translation:
  language: hi
  text: 'हे आकाश, ऊपर से टपको,

    और बादल धार्मिकता[a] बरसाएँ;

    पृथ्वी खुल जाए,

    ताकि उद्धार फले-फूले,

    और धार्मिकता भी साथ-साथ उगे।

    मैंने, याहवे ने, इसे रचा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्याय”; इब्रानी शब्द צֶדֶק और צְדָקָה प्रसंग के अनुसार धार्मिकता, सही व्यवस्था या न्याय का भाव व्यक्त कर सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְעִיפוּ
  choice: बूँदें बरसाओ
  rationale: क्रिया רָעַף टपकने या बूँदों के रूप में बरसने का चित्र देती है। यह चयन वर्षा-बिंब को स्वाभाविक हिन्दी में बनाए रखता है, बिना तूफ़ानी वर्षा का अनावश्यक अर्थ जोड़े।
- source_word: שָׁמַיִם מִמַּעַל
  choice: हे आकाशो, ऊपर से
  rationale: बहुवचन सम्बोधन और ऊर्ध्व दिशा—दोनों को स्पष्ट रखते हुए काव्यात्मक, किंतु सहज हिन्दी दी गई है।
- source_word: שְׁחָקִים יִזְּלוּ
  choice: बादल … बरसाएँ
  rationale: शְׁחָקִים यहाँ वर्षा लाने वाले बादलों को सूचित करता है और נזל नीचे बहने या टपकने को। हिन्दी में ‘बरसाएँ’ समानांतर वर्षा-बिंब को स्वाभाविक रूप से व्यक्त करता है।
- source_word: צֶדֶק / צְדָקָה
  choice: धार्मिकता
  rationale: दोनों सजातीय शब्दों के लिए एक ही पद रखने से पद की पुनरावृत्ति सुरक्षित रहती है। ‘धार्मिकता’ सही संबंध, नैतिक सत्यता और न्यायपूर्ण व्यवस्था की व्यापकता व्यक्त करती है; ‘न्याय’ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: תִּפְתַּח אֶרֶץ
  choice: पृथ्वी खुल जाए
  rationale: काव्यात्मक इच्छार्थक क्रम तथा विश्वव्यापी कृषि-बिंब को सीधे सुरक्षित रखा गया है।
- source_word: וְיִפְרוּ יֶשַׁע
  choice: उद्धार फले-फूले
  rationale: פרה मूलतः फलने या फलवन्त होने को व्यक्त करता है। संक्षिप्त और कुछ असामान्य इब्रानी रचना को अत्यधिक स्पष्ट किए बिना हिन्दी में उद्धार के वनस्पति-जैसे प्रकट होने का भाव रखा गया है।
- source_word: וּצְדָקָה תַצְמִיחַ יַחַד
  choice: और वह धार्मिकता को भी साथ-साथ उगाए
  rationale: תַצְמִיחַ हिफ़ील स्त्रीलिंग एकवचन है, इसलिए निकटवर्ती स्त्रीलिंग ‘पृथ्वी’ को कर्ता मानना व्याकरणतः स्वाभाविक है। ‘साथ-साथ’ יחד की समकालिकता और ‘उगाए’ वनस्पति-बिंब को सुरक्षित रखते हैं।
- source_word: אֲנִי יְהוָה
  choice: मैं, याहवे
  rationale: वाचा के व्यक्तिगत नाम יהוה को हिन्दी में ‘याहवे’ के रूप में लिप्यंतरित किया गया है; इब्रानी की समानाधिकरणात्मक रचना भी बनी रहती है।
- source_word: בְּרָאתִיו
  choice: ने इसे रचा है
  rationale: ברא के सृजनार्थ को ‘रचा’ व्यक्त करता है। पुल्लिंग एकवचन प्रत्यय का संदर्भ सम्भवतः उद्धार अथवा पूरे वर्णित कार्य से है; ‘इसे’ उस संदर्भ को जानबूझकर अनिर्दिष्ट रखता है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसका सीधा आधुनिक हिन्दी लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: צדק और צדקה का अर्थक्षेत्र
  choice: धार्मिकता
  alternative: न्याय
  rationale: उद्धार के साथ प्रयुक्त व्यापक सृष्टि-पुनर्स्थापन के सन्दर्भ में ‘धार्मिकता’ नैतिक और संबंधपरक पूर्णता को समेटती है। फिर भी इन शब्दों में न्याय का वास्तविक अर्थ भी हो सकता है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: תַצְמִיחַ का कर्ता
  choice: पृथ्वी धार्मिकता को उगाए
  alternative: धार्मिकता स्वयं उग आए
  rationale: क्रिया हिफ़ील स्त्रीलिंग एकवचन है और ‘पृथ्वी’ स्त्रीलिंग कर्ता के रूप में स्वाभाविक है। वैकल्पिक अनुवाद काव्य का सामान्य आशय देता है, पर क्रिया की सकर्मक बनावट को कम स्पष्ट करता है।
- issue: בְּרָאתִיו के प्रत्यय का संदर्भ
  choice: इसे
  alternative: इन सबको / उद्धार को
  rationale: इब्रानी में पुल्लिंग एकवचन प्रत्यय है, पर उसका अभिप्रेत संदर्भ पूरी तरह निश्चित नहीं। ‘इसे’ मूल की संदर्भगत अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक सम्बोधन रखा गया है। पंक्ति-विभाजन इब्रानी समानांतरता और वर्षा से अंकुरण तक बढ़ते चित्र को उभारता है। ‘फले-फूले’ और ‘उगाए’ सामान्य पाठक के लिए सहज हैं और मूल के कृषि-बिंब को बनाए रखते हैं।
