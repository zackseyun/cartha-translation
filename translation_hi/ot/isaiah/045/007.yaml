  yaml_path: translation/ot/isaiah/045/007.yaml
  text: forming light and creating darkness[a], making peace and creating calamity; I am Yahweh, who does all these things.
translation:
  language: hi
  text: मैं याहवे हूँ—प्रकाश को गढ़नेवाला और अंधकार को रचनेवाला, शांति लानेवाला और विपत्ति उत्पन्न करनेवाला; मैं ही ये सब करता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹצֵר
  choice: गढ़नेवाला
  rationale: यह יצר के आकार देने या गढ़ने के भाव को व्यक्त करता है और आगे आनेवाले ברא से क्रियात्मक भेद बनाए रखता है।
- source_word: אוֹר
  choice: उजियाला
  rationale: यह प्रकाश का सामान्य और काव्यात्मक हिन्दी रूप है तथा ‘अंधकार’ के साथ स्पष्ट विरोध बनाता है।
- source_word: וּבוֹרֵא
  choice: और ... रचनेवाला
  rationale: ברא की सृजनात्मक क्रिया को व्यक्त करते हुए इब्रानी सहभागी रूप की वर्णनात्मक शक्ति बनाए रखता है।
- source_word: חֹשֶׁךְ
  choice: अंधकार
  rationale: मूल शब्द का सीधा अर्थ है और ‘उजियाला’ के साथ काव्यात्मक प्रतिविरोध सुरक्षित रखता है।
- source_word: עֹשֶׂה
  choice: लानेवाला / करता हूँ
  rationale: עשה व्यापक क्रिया है। शांति के साथ ‘लाना’ स्वाभाविक हिन्दी है, जबकि समापन में ‘करता हूँ’ כָל־אֵלֶּה के व्यापक सारांश को ठीक से व्यक्त करता है।
- source_word: שָׁלוֹם
  choice: शांति
  rationale: שלום कल्याण और संपूर्णता को भी समेट सकता है, पर यहाँ רָע के विपरीत ‘शांति’ संक्षिप्त, परिचित और संदर्भानुकूल है।
- source_word: רָע
  choice: विपत्ति
  rationale: שלום के विपरीत और भविष्यद्वाणी के न्याय-संदर्भ में यह हानि, आपदा या विपत्ति का संकेत देता है। ‘विपत्ति’ नैतिक बुराई का अर्थ अनावश्यक रूप से आरोपित किए बिना मूल की कठोरता बनाए रखती है।
- source_word: אֲנִי יְהוָה
  choice: मैं याहवे हूँ
  rationale: स्पष्ट सर्वनाम और ईश्वरीय नाम के द्वारा दी गई आत्म-पहचान को सीधे रखता है; יְהוָה को ‘याहवे’ लिखा गया है।
- source_word: עֹשֶׂה כָל־אֵלֶּה
  choice: ये सब मैं ही करता हूँ
  rationale: यह पूर्ववर्ती सभी युग्मों पर याहवे के व्यापक कर्तृत्व का सार देता है। ‘ही’ स्पष्ट אֲנִי और वाक्य के बलाघात को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय कर्तृत्व के संबंध में רָע का अनुवाद
  choice: विपत्ति
  alternative: बुराई / आपदा
  rationale: यह पद शांति और प्रतिकूल दशा के ऊपर याहवे की प्रभुता घोषित करता है। רָע में वास्तविक अर्थगत व्यापकता है, इसलिए मुख्य पाठ में संदर्भानुकूल ‘विपत्ति’ रखा गया है और ‘बुराई’ सहित अन्य संभावनाएँ पादटिप्पणी में दी गई हैं; इस प्रकार न तो नैतिक बुराई का दावा थोपा गया है, न मूल शब्द की कठिनाई छिपाई गई है।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में वाचा-संबंधी व्यक्तिगत नाम सीधे उपस्थित है; ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। आरंभिक सहभागी क्रियाओं को ‘-नेवाला’ संरचना में रखा गया है, जिससे इब्रानी समानांतरता और अंतिम आत्म-पहचान दोनों स्वाभाविक हिन्दी में बने रहें।
