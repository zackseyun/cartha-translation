  edition: WLC
  text: אָכֵ֕ן אַתָּ֖ה אֵ֣ל מִסְתַּתֵּ֑ר אֱלֹהֵ֥י יִשְׂרָאֵ֖ל מוֹשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/015.yaml
  text: Truly[a], you are a God who hides himself, the God of Israel, the Savior.
translation:
  language: hi
  text: सचमुच[a], आप ऐसे परमेश्वर हैं जो अपने आपको छिपाते हैं—इस्राएल के परमेश्वर, उद्धारकर्ता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निश्चय ही, आप छिपे हुए परमेश्वर हैं।” इब्रानी कृदंत का अर्थ आत्मवाचक रूप में (“जो अपने आपको छिपाते हैं”) या अधिक स्थितिवाचक रूप में (“जो छिपे हुए हैं”) समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
  choice: सचमुच
  rationale: यह शब्द जोरदार स्वीकार या अनुभूति व्यक्त करता है; ‘सचमुच’ आधुनिक हिन्दी में इसकी गंभीर और स्वाभाविक अभिव्यक्ति है।
- source_word: אַתָּה
  choice: आप
  rationale: यह परमेश्वर के लिए प्रयुक्त द्वितीय पुरुष एकवचन सर्वनाम है; हिन्दी में आदरपूर्ण प्रत्यक्ष संबोधन के लिए ‘आप’ स्वाभाविक है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: संदर्भ में यह इस्राएल के परमेश्वर को सूचित करता है; ‘परमेश्वर’ dignified और प्रचलित हिन्दी समतुल्य है।
- source_word: מִסְתַּתֵּר
  choice: जो अपने आपको छिपाते हैं
  rationale: हित्पएल कृदंत का आत्मवाचक अथवा मध्य भाव इस अनुवाद में बना रहता है और क्रियात्मक अर्थ को केवल ‘छिपे हुए’ विशेषण में नहीं बदलता।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: यह पहले आए ‘परमेश्वर’ की समानाधिकरण पहचान है; हिन्दी में बिना कृत्रिम संबोधन-सूचक पद जोड़े यह रूप स्वाभाविक है।
- source_word: מוֹשִׁיעַ
  choice: उद्धारकर्ता
  rationale: ישׁע के हिफ़ील कृदंत का अर्थ बचाने या छुड़ाने वाला है; ‘उद्धारकर्ता’ उसके शीर्षकीय और निरंतर गुणसूचक भाव को व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के छिपे होने का अर्थ
  choice: ‘जो अपने आपको छिपाते हैं’—इसे परमेश्वर के आत्म-गोपन की स्वीकारोक्ति के रूप में रखा गया है।
  alternative: ‘जो छिपे हुए हैं’ अथवा ‘छिपे हुए परमेश्वर’
  rationale: इब्रानी कृदंत आत्मवाचक/मध्य तथा अधिक स्थितिवाचक अर्थ की गुंजाइश रखता है। मुख्य पाठ क्रियात्मक आत्मवाचक अर्थ देता है, जबकि पादटिप्पणी वास्तविक वैकल्पिक अर्थ सुरक्षित रखती है; पद यह नहीं बताता कि यह अगम्यता, छिपा हुआ विधान या अस्थायी गोपन है।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और गंभीर रखी गई है। ‘आप…हैं/छिपाते हैं’ हिन्दी के सम्मानसूचक व्याकरण के अनुरूप है। समानाधिकरण पदों को डैश से जोड़ा गया है ताकि वाक्य सहज रहे और उन्हें अनावश्यक रूप से अलग संबोधन न बनाया जाए।
