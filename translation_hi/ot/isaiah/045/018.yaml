source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָֽמַר יְ֠הוָה בּוֹרֵ֨א הַ/שָּׁמַ֜יִם ה֣וּא הָ/אֱלֹהִ֗ים יֹצֵ֨ר הָ/אָ֤רֶץ וְ/עֹשָׂ/הּ֙ ה֣וּא כֽוֹנְנָ֔/הּ לֹא תֹ֥הוּ בְרָאָ֖/הּ לָ/שֶׁ֣בֶת יְצָרָ֑/הּ אֲנִ֥י יְהוָ֖ה וְ/אֵ֥ין עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/018.yaml
  text: 'For thus says Yahweh[a], who created the heavens—he is God—who formed the earth and made it, he established it; he did not create it as a wasteland, but formed it to be inhabited: I am Yahweh, and there is no other.'
translation:
  language: hi
  text: 'क्योंकि याहवे[a] ऐसा कहते हैं—जिसने आकाश को रचा, वही परमेश्वर है; जिसने पृथ्वी को आकार दिया और उसे बनाया, उसी ने उसे स्थापित किया। उसने उसे उजाड़ होने के लिए नहीं रचा, बल्कि बसाए जाने के लिए उसे आकार दिया: “मैं याहवे हूँ, और कोई नहीं है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसने उसे सूना नहीं रचा,’ ‘उसने उसे अव्यवस्था के लिए नहीं रचा,’ या ‘उसने उसे निराकार नहीं रचा’ भी संभव है। हिब्रू शब्द तोहू खालीपन, उजाड़पन या अव्यवस्था का बोध करा सकता है; यहाँ ‘बसाए जाने के लिए’ के साथ विरोध होने के कारण मुख्य पाठ में ‘उजाड़’ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी में प्रचलित रूप से परमेश्वर के व्यक्तिगत नाम को दर्शाता है और इसे किसी उपाधि से नहीं बदलता।
- source_word: בּוֹרֵא הַשָּׁמַיִם
  choice: जिसने आकाश को रचा
  rationale: कृदंत का संबंधवाचक वाक्य के रूप में स्वाभाविक अनुवाद किया गया है; हिंदी में ‘आकाश’ सामूहिक रूप से हिब्रू बहुवचन की ब्रह्मांडीय व्यापकता व्यक्त करता है।
- source_word: הוּא הָאֱלֹהִים
  choice: वही परमेश्वर है
  rationale: ‘वही’ हिब्रू सर्वनाम की बलात्मक पहचान को व्यक्त करता है, पर अंतिम कथन से पहले ‘अकेला’ जोड़कर अर्थ को समय से पूर्व स्पष्ट नहीं करता।
- source_word: יֹצֵר הָאָרֶץ
  choice: जिसने पृथ्वी को आकार दिया
  rationale: ‘आकार दिया’ יצר के गढ़ने अथवा रूप देने के भाव को बनाए रखता है और ברא ‘रचा’ से भेद भी दिखाता है।
- source_word: וְעֹשָׂהּ
  choice: और उसे बनाया
  rationale: עשה की व्यापक और सीधी क्रिया को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: כּוֹנְנָהּ
  choice: उसी ने उसे स्थिर किया
  rationale: כון के स्थापित करने और दृढ़ करने के भाव को व्यक्त करता है; ‘उसी ने’ हिब्रू के स्वतंत्र बलात्मक सर्वनाम को दर्शाता है।
- source_word: תֹהוּ
  choice: उजाड़
  rationale: यहाँ बसाए जाने के स्पष्ट विरोध में निर्जनता अथवा वीरानी का अर्थ सबसे उपयुक्त है; शब्द की अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: לָשֶׁבֶת
  choice: बसाए जाने के लिए
  rationale: पृथ्वी के अभिप्रेत उद्देश्य—उस पर निवास होना—को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: יְצָרָהּ
  choice: उसे आकार दिया
  rationale: पहले आए יֹצֵר के साथ शब्दगत संबंध और सोद्देश्य रचना का भाव बनाए रखता है।
- source_word: וְאֵין עוֹד
  choice: और कोई दूसरा नहीं
  rationale: परमेश्वर की अद्वितीयता के स्पष्ट हिब्रू दावे को बिना विस्तार जोड़े सीधे व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिंदी बाइबल-परंपरा में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण से प्रस्तुत किया गया है।
- issue: תֹהוּ का अर्थ
  choice: उजाड़
  alternative: सूना; अव्यवस्थित; निराकार
  rationale: ‘बसाए जाने के लिए’ के विरोध से यहाँ निर्जन या उजाड़ दशा प्रमुख है। फिर भी शब्द की वास्तविक अर्थ-व्याप्ति पादटिप्पणी में दी गई है।
- issue: הוּא הָאֱלֹהִים की बलात्मकता
  choice: वही परमेश्वर है
  alternative: वह परमेश्वर है; वही अकेला परमेश्वर है
  rationale: ‘वही’ पहचान पर बल देता है, जबकि ‘अकेला’ नहीं जोड़ा गया क्योंकि अनन्यता पद के अंत में स्पष्ट रूप से कही गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। सृष्टि-वर्णन की काव्यात्मक पुनरावृत्ति तथा हिब्रू के बलात्मक सर्वनामों को जहाँ संभव था, स्वाभाविक हिंदी में सुरक्षित रखा गया है।
