source:
  edition: WLC
  text: ה֛וֹי אֹמֵ֥ר לְ/אָ֖ב מַה תּוֹלִ֑יד וּ/לְ/אִשָּׁ֖ה מַה תְּחִילִֽי/ן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/010.yaml
  text: Woe to one who says to a father[a], ‘What are you fathering?’ or to a woman[b], ‘What are you giving birth to?’
translation:
  language: hi
  text: धिक्कार है उस पर जो किसी पिता से कहता है[a], “तुम किसे उत्पन्न कर रहे हो?” या किसी स्त्री से कहता है[b], “तुम किसे जन्म देने की पीड़ा सह रही हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम किस संतान के पिता बन रहे हो?” इब्रानी क्रिया विशेष रूप से पिता द्वारा संतान उत्पन्न करने का बोध देती है।
    reason: lexical_alternative
  - marker: b
    text: या, “तुम किसे जन्म दे रही हो?” इब्रानी क्रिया प्रसव-पीड़ा और बच्चे को जन्म देने की छवि जगाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: हाय उस पर
  rationale: यह भविष्यद्वक्ताओं की चेतावनी और धिक्कार की तीव्रता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֹמֵר
  choice: जो ... कहता है
  rationale: इब्रानी कृदन्त यहाँ सामान्य एकवचन व्यक्ति को सूचित करता है; हिन्दी का सम्बन्धवाचक प्रयोग सहज और सटीक है।
- source_word: לְאָב
  choice: किसी पिता से
  rationale: मूल पाठ में संबंधवाचक प्रत्यय नहीं है, इसलिए ‘अपने पिता से’ जोड़ना उचित नहीं होगा।
- source_word: תּוֹלִיד
  choice: तुम किसे उत्पन्न कर रहे हो
  rationale: ילד का हिफ़ील रूप पुरुष को संबोधित होकर पिता द्वारा संतान उत्पन्न करने का बोध देता है। ‘उत्पन्न कर रहे हो’ उस पैतृक अर्थ को बनाए रखते हुए आधुनिक हिन्दी में बोधगम्य है।
- source_word: וּלְאִשָּׁה
  choice: या किसी स्त्री से कहता है
  rationale: दूसरी समानांतर उक्ति को हिन्दी में ‘या’ से जोड़ना स्वाभाविक है। मूल में ‘उसकी माता’ नहीं, केवल ‘स्त्री’ है। स्पष्टता के लिए ‘कहता है’ दोहराया गया है।
- source_word: תְּחִילִין
  choice: तुम किसे जनने की पीड़ा सह रही हो
  rationale: חול/חיל यहाँ प्रसव के समय पीड़ा से तड़पने का बोध देता है। यह अनुवाद केवल जन्म के परिणाम के बजाय प्रसव-पीड़ा की मूल छवि को सुरक्षित रखता है।
theological_decisions:
- issue: माता-पिता और संतान की उपमा का आशय
  choice: पिता और स्त्री की ठोस छवि को ज्यों का त्यों रखना तथा इस पद में निहित संकेत को स्पष्ट व्याख्या में न बदलना
  alternative: ‘अपने पिता’ और ‘अपनी माता’ कहना, या सीधे जोड़ना कि मनुष्य अपने सृष्टिकर्ता से प्रश्न कर रहा है
  rationale: आसपास का प्रसंग सृष्टिकर्ता से विवाद करने की ओर संकेत करता है, पर यह पद स्वयं माता-पिता की उपमा द्वारा बात कहता है। व्याख्यात्मक विस्तार मूल की साहित्यिक और धर्मवैचारिक कसावट को कम कर देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘उत्पन्न करना’ पिता की विशिष्ट भूमिका को पूरी तरह बोलचाल की हिन्दी में व्यक्त न कर पाने पर भी ‘जन्म देना’ की अपेक्षा लिंग-भेद को बेहतर सुरक्षित रखता है; पादटिप्पणी इस सूक्ष्मता को स्पष्ट करती है।
