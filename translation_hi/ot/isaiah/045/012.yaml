  yaml_path: translation/ot/isaiah/045/012.yaml
  text: I made the earth[a], and I created man upon it; my hands stretched out the heavens, and I commanded all their host.
translation:
  language: hi
  text: मैंने ही पृथ्वी को बनाया और उस पर मनुष्य[a] को रचा। मैंने ही अपने हाथों से आकाश को ताना, और आकाश के सारे गणों को आज्ञा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘मनुष्य’ के लिए प्रयुक्त इब्रानी शब्द ‘आदम’ सामूहिक एकवचन है और पूरी मानवजाति को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנֹכִי עָשִׂ֣יתִי
  choice: मैंने ही ... बनाया
  rationale: स्वतंत्र सर्वनाम אָֽנֹכִי कर्ता पर बल देता है; हिन्दी में ‘ही’ उस बल को स्वाभाविक रूप से व्यक्त करता है। ‘बनाया’ עשה को दर्शाता है और आगे के ברא ‘रचा’ से भेद बनाए रखता है।
- source_word: אֶ֔רֶץ
  choice: पृथ्वी
  rationale: ‘आकाश’ के समानांतर सृष्टि-संदर्भ में इसका ब्रह्मांडीय अर्थ ‘पृथ्वी’ उपयुक्त है, न कि किसी विशेष भूभाग का ‘देश’।
- source_word: וְאָדָ֖ם
  choice: मनुष्य
  rationale: אָדָם यहाँ मानवजाति के लिए सामूहिक एकवचन है। आधुनिक हिन्दी में ‘मनुष्य’ मूल के एकवचन रूप और सार्वमानवीय आशय, दोनों को सहजता से रखता है।
- source_word: עָלֶ֣יהָ
  choice: उस पर
  rationale: स्त्रीलिंग प्रत्यय का संकेत पृथ्वी की ओर है; हिन्दी में ‘उस पर’ स्पष्ट और स्वाभाविक है।
- source_word: בָרָ֑אתִי
  choice: रचा
  rationale: ברא ईश्वरीय सृजन को व्यक्त करता है। ‘रचा’ सृष्टि-संदर्भ में गरिमापूर्ण है और עשה के लिए प्रयुक्त ‘बनाया’ से क्रियात्मक भेद रखता है।
- source_word: אֲנִ֗י יָדַי֙
  choice: मैंने—मेरे हाथों ने—
  rationale: हिब्रू में स्वतंत्र सर्वनाम के बाद ‘मेरे हाथ’ आने से असामान्य, बलयुक्त रचना बनती है। डैशयुक्त हिन्दी उस तनाव और व्यक्तिगत कर्तृत्व को ‘अपने’ जैसे अतिरिक्त अर्थ के बिना सुरक्षित रखती है।
- source_word: נָט֣וּ שָׁמַ֔יִם
  choice: आकाश को ताना
  rationale: נטה का मूल चित्र फैलाने या तानने का है। ‘आकाश को ताना’ हिन्दी में सृष्टि के काव्यात्मक बिंब को संक्षेप और गरिमा के साथ रखता है।
- source_word: וְכָל צְבָאָ֖ם
  choice: उसके सारे गण
  rationale: צָבָא यहाँ आकाश से संबद्ध समूचे व्यवस्थित समुदाय को दर्शाता है। एकवचन ‘उसके’ हिब्रू प्रत्यय और हिन्दी ‘आकाश’ के व्याकरणिक रूप के अनुरूप है; ‘गण’ अस्पष्टता को अनावश्यक रूप से केवल तारों या स्वर्गदूतों तक सीमित नहीं करता।
- source_word: צִוֵּֽיתִי
  choice: मैंने आज्ञा दी
  rationale: צוה का सामान्य अर्थ आज्ञा देना है; यह आकाशीय गण पर परमेश्वर के अधिकार को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
theological_decisions:
- issue: אָדָם का सामूहिक और सार्वमानवीय अर्थ
  choice: मनुष्य
  alternative: मानवजाति
  rationale: ‘मनुष्य’ मूल के सामूहिक एकवचन को बनाए रखते हुए सामान्य आधुनिक हिन्दी में समस्त मानवता का अर्थ दे सकता है। पादटिप्पणी इस व्यापक आशय को स्पष्ट करती है।
- issue: כָל־צְבָאָם की पहचान
  choice: उसके सारे गण
  alternative: उसके सारे तारागण / उसकी सारी सेना
  rationale: पद स्वयं इस गण की सटीक पहचान नहीं खोलता। ‘गण’ आकाश के समस्त व्यवस्थित समुदाय का व्यापक अर्थ रखकर संभावित धार्मिक या खगोलीय संदर्भ को समय से पहले निश्चित नहीं करता।
- issue: אֲנִי יָדַי की बलयुक्त वाक्यरचना
  choice: मैंने—मेरे हाथों ने—
  alternative: मेरे ही हाथों ने
  rationale: हिब्रू का स्वतंत्र ‘मैं’ और बहुवचन क्रिया का वास्तविक कर्ता ‘मेरे हाथ’ दोनों सुरक्षित रहते हैं। इससे परमेश्वर के व्यक्तिगत कर्तृत्व पर बल आता है, पर मूल में निहित न होने वाला ‘अपने/ही’ नहीं जोड़ा जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर सृष्टि-वाक्यों की काव्यात्मकता बचाने के लिए ‘पृथ्वी’, ‘आकाश को ताना’ और ‘गण’ चुने गए हैं। असामान्य हिब्रू बलरचना को डैश से दिखाया गया है, ताकि उसे सहज बनाते हुए उसका जोर न मिटे।
