source:
  edition: WLC
  text: בִּ֣/י נִשְׁבַּ֔עְתִּי יָצָ֨א מִ/פִּ֧/י צְדָקָ֛ה דָּבָ֖ר וְ/לֹ֣א יָשׁ֑וּב כִּי לִ/י֙ תִּכְרַ֣ע כָּל בֶּ֔רֶךְ תִּשָּׁבַ֖ע כָּל לָשֽׁוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/023.yaml
  text: 'By myself I have sworn[a]; from my mouth has gone out a righteous word, and it will not return: to me every knee will bow[b], every tongue will swear allegiance.'
translation:
  language: hi
  text: मैंने अपनी ही शपथ खाई है; मेरे मुँह से धार्मिकता में एक ऐसा वचन निकला है जो लौटकर नहीं आएगा:[a] मेरी ओर हर घुटना झुकेगा, हर जीभ शपथ खाएगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे मुँह से एक धर्ममय वचन निकला है”; इब्रानी पदबंध इस बात पर बल दे सकता है कि वचन धर्ममय है या वह धार्मिकता में कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “हर जीभ निष्ठा की शपथ खाएगी,” अथवा “हर जीभ शपथ लेगी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: मैंने अपनी ही शपथ खाई है
  rationale: इब्रानी शपथ-सूत्र में בִּי का अर्थ स्वयं को शपथ का आधार बनाना है। ‘अपनी ही’ इस आत्म-संदर्भ और बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָצָא מִפִּי
  choice: मेरे मुँह से ... निकला है
  rationale: परमेश्वर के मुख से वचन के निकलने का ठोस बिंब सुरक्षित रखा गया है।
- source_word: צְדָקָה דָּבָר
  choice: धार्मिकता में एक वचन
  rationale: यह संक्षिप्त इब्रानी पदबंध इस बात पर बल दे सकता है कि वचन धर्ममय है अथवा धार्मिकता में कहा गया है। मुख्य पाठ में उत्तरवर्ती अर्थ रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְלֹא יָשׁוּב
  choice: और वह वापस नहीं लौटेगा
  rationale: निकले हुए वचन के न लौटने का मूल रूपक रखा गया है; ‘रद्द नहीं होगा’ जैसे व्याख्यात्मक विस्तार से बचा गया है।
- source_word: לִי תִּכְרַע כָּל בֶּרֶךְ
  choice: मेरे सामने हर घुटना झुकेगा
  rationale: לִי का शाब्दिक अर्थ ‘मेरे लिए/मेरी ओर’ है, पर घुटना झुकाने के हिन्दी मुहावरे में ‘मेरे सामने’ स्वाभाविक रूप से परमेश्वर के प्रति अधीनता प्रकट करता है।
- source_word: תִּשָּׁבַע כָּל לָשׁוֹן
  choice: हर जीभ शपथ खाएगी
  rationale: ‘जीभ’ वाला सामूहिक बिंब और שבע का शपथ लेना—दोनों सुरक्षित हैं। निष्ठा की शपथ का संदर्भगत भाव संभव है, पर उसे मुख्य पाठ में स्पष्ट जोड़कर अर्थ को सीमित नहीं किया गया।
theological_decisions:
- issue: सार्वभौमिक अधीनता का स्वरूप
  choice: हर घुटने के झुकने और हर जीभ के शपथ खाने का कथन रखा गया, पर यह नहीं बताया गया कि यह स्वेच्छा से होगा या विवश होकर।
  alternative: हर जीभ निष्ठा की शपथ खाएगी / अंगीकार करेगी
  rationale: इब्रानी सार्वभौमिक रूप से याहवे की प्रभुता स्वीकार किए जाने को दर्शाता है, किंतु अधीनता की आंतरिक दशा स्पष्ट नहीं करता। शाब्दिक अभिव्यक्ति इस धार्मिक तनाव को सुरक्षित रखती है।
- issue: צְדָקָה और वचन का संबंध
  choice: धार्मिकता में एक वचन
  alternative: एक धर्ममय वचन
  rationale: व्याकरणिक संबंध संक्षिप्त और कुछ हद तक अस्पष्ट है। मुख्य पाठ एक संभव संबंध देता है और पादटिप्पणी दूसरे को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अपनी ही शपथ’, ‘मेरे मुँह से’, ‘हर घुटना’ और ‘हर जीभ’ जैसे मूल बिंब सुरक्षित हैं।
