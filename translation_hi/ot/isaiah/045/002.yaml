source:
  edition: WLC
  text: אֲנִי֙ לְ/פָנֶ֣י/ךָ אֵלֵ֔ךְ וַ/הֲדוּרִ֖ים אושר דַּלְת֤וֹת נְחוּשָׁה֙ אֲשַׁבֵּ֔ר וּ/בְרִיחֵ֥י בַרְזֶ֖ל אֲגַדֵּֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/002.yaml
  text: I myself will go before you[a], and I will level the rough places; I will break in pieces doors of bronze, and I will cut through bars of iron.
translation:
  language: hi
  text: मैं स्वयं तेरे आगे-आगे चलूँगा और ऊबड़-खाबड़ स्थानों को समतल कर दूँगा[a]; मैं काँसे के द्वारों को चकनाचूर कर दूँगा और लोहे की सलाखों को काट डालूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और ऊँचे-नीचे स्थानों को समतल कर दूँगा”; यहाँ का इब्रानी वाक्यांश पाठ और शब्दार्थ की दृष्टि से कठिन है। कुछ अनुवाद इसे अधिक विशिष्ट रूप से “पहाड़ों” या “ऊँचे स्थानों” के रूप में प्रस्तुत करते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: לְפָנֶיךָ
  choice: तेरे आगे-आगे
  rationale: यह स्थानवाचक मुहावरा किसी से पहले चलने और उसके लिए मार्ग तैयार करने का भाव रखता है; ‘आगे-आगे’ आधुनिक हिन्दी में इस अग्रगामी अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵלֵךְ
  choice: चलूँगा
  rationale: भविष्यसूचक प्रतिज्ञा के प्रसंग में प्रथम पुरुष एकवचन अपूर्ण क्रिया को भविष्यकाल में प्रस्तुत किया गया है।
- source_word: וַהֲדוּרִים אושר
  choice: और ऊबड़-खाबड़ स्थानों को समतल कर दूँगा
  rationale: इब्रानी वाक्यांश पाठगत और शब्दार्थ की दृष्टि से कठिन है। यह अनुवाद दुर्गम या असमतल भूभाग को समतल किए जाने का संभावित आशय व्यक्त करता है, पर ‘पहाड़ों’ जैसे अधिक विशिष्ट अर्थ को मुख्य पाठ में निश्चित नहीं करता।
- source_word: דַּלְתוֹת נְחוּשָׁה
  choice: काँसे के द्वारों
  rationale: דַּלְתוֹת का मूल अर्थ ‘दरवाज़े/द्वार’ है और נְחוּשָׁה यहाँ काँसे को दर्शाता है; दुर्गबंदी के प्रसंग में ‘द्वार’ स्वाभाविक और गरिमापूर्ण है।
- source_word: אֲשַׁבֵּר
  choice: चकनाचूर कर दूँगा
  rationale: पिएल रूप प्रबल और पूर्ण रूप से तोड़ने का भाव देता है; ‘चकनाचूर’ उस तीव्रता को सहज हिन्दी में बनाए रखता है।
- source_word: בְרִיחֵי בַרְזֶל
  choice: लोहे की सलाखों
  rationale: בְרִיחַ द्वार को बंद रखने वाली आड़ी छड़ या साँकल को सूचित कर सकता है। ‘सलाखों’ काँसे के द्वारों के समानांतर सुदृढ़ अवरोध का अर्थ स्पष्ट रखता है।
- source_word: אֲגַדֵּעַ
  choice: काट डालूँगा
  rationale: क्रिया काटकर अलग करने या नष्ट करने का प्रबल भाव रखती है; ‘काट डालूँगा’ सलाखों के साथ स्वाभाविक है और निर्णायक कार्रवाई व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय आत्म-उल्लेख का बल
  choice: मैं स्वयं
  alternative: मैं
  rationale: स्पष्ट सर्वनाम אֲנִי क्रिया में निहित प्रथम पुरुष से अतिरिक्त बल देता है। ‘मैं स्वयं’ परमेश्वर की व्यक्तिगत प्रतिज्ञा पर यह जोर बनाए रखता है, बिना अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। एकवचन सम्बोधन ‘तेरे’ मूल इब्रानी के एकवचन रूप को सुरक्षित रखता है। वाक्य की काव्यात्मक समानांतरता और ईश्वरीय प्रतिज्ञा की दृढ़ता बनाए रखी गई है।
