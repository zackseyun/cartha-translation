source:
  edition: WLC
  text: כֹּֽה אָמַ֧ר יְהוָ֛ה קְד֥וֹשׁ יִשְׂרָאֵ֖ל וְ/יֹצְר֑/וֹ הָ/אֹתִיּ֣וֹת שְׁאָל֔וּ/נִי עַל בָּנַ֛/י וְ/עַל פֹּ֥עַל יָדַ֖/י תְּצַוֻּֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/011.yaml
  text: 'Thus says Yahweh[a], the Holy One of Israel and his Maker: Ask me about the things to come concerning my sons[c][b], and command me concerning the work of my hands.'
translation:
  language: hi
  text: 'यहोवा, इस्राएल का पवित्र परमेश्वर और उसका रचयिता, यों कहता है:


    “मेरे पुत्रों[b] से सम्बन्धित आनेवाली बातों[a] के विषय में मुझसे पूछो,


    और मेरे हाथों के काम के विषय में मुझे आज्ञा दो[c]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भावी बातें’ अथवा ‘जो बातें आनेवाली हैं।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘मेरे पुत्र’; इसका सामूहिक संकेत परमेश्वर की प्रजा इस्राएल की ओर हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘मुझे आज्ञा दो’ का शब्द-विन्यास सम्भवतः इस प्रसंग में जानबूझकर चौंकानेवाला है; कुछ लोग इसे सीधी अनुमति के बजाय आलंकारिक झिड़की समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: वाचा से जुड़े परमेश्वर के निज नाम को हिन्दी में प्रचलित लिप्यंतरण के द्वारा सुरक्षित रखा गया है।
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: इस्राएल का पवित्र जन
  rationale: यशायाह में प्रयुक्त इस विशिष्ट उपाधि के सम्बन्धवाचक अर्थ और व्यक्तिगत स्वरूप, दोनों को बनाए रखता है।
- source_word: וְיֹצְרוֹ
  choice: और उसका रचयिता
  rationale: तीसरे पुरुष एकवचन पुल्लिंग प्रत्यय को स्पष्ट रूप से रखा गया है; निकटतम सम्भावित संकेत इस्राएल की ओर है, पर अनावश्यक व्याख्या नहीं जोड़ी गई।
- source_word: הָאֹתִיּוֹת
  choice: आनेवाली बातें
  rationale: इस प्रसंग में यह पद भावी या घटित होनेवाली बातों को सूचित करता है; ‘चिह्न’ की अपेक्षा यह अर्थ अधिक उपयुक्त है।
- source_word: שְׁאָלוּנִי
  choice: मुझसे पूछो
  rationale: बहुवचन आज्ञार्थ और प्रथम पुरुष कर्म-प्रत्यय को सहज आधुनिक हिन्दी में सीधे व्यक्त करता है।
- source_word: עַל בָּנַי
  choice: मेरे पुत्रों के विषय में
  rationale: मूल के स्पष्ट पुल्लिंग बहुवचन ‘पुत्रों’ को बनाए रखा गया है, यद्यपि सामूहिक रूप से इस्राएल के लोग अभिप्रेत हो सकते हैं।
- source_word: פֹּעַל יָדַי
  choice: मेरे हाथों का काम
  rationale: सृष्टि अथवा परमेश्वर के किए हुए कार्य के लिए प्रयुक्त ठोस शारीरिक बिम्ब और समानांतरता को सुरक्षित रखता है।
- source_word: תְּצַוֻּנִי
  choice: मुझे आज्ञा दो
  rationale: क्रिया के प्रबल और चौंकानेवाले सामान्य अर्थ को नरम किए बिना रखा गया है।
theological_decisions:
- issue: क्या मनुष्यों द्वारा परमेश्वर को आज्ञा देने की धारणा से बचने के लिए अंतिम खंड को नरम किया जाए
  choice: मुख्य पाठ में सीधे ‘मुझे आज्ञा दो’ रखा गया
  alternative: इसे आलंकारिक झिड़की मानकर ‘क्या तुम मुझे आज्ञा दोगे?’ करना, अथवा ‘मुझ पर छोड़ दो’ जैसे शब्दों से नरम करना
  rationale: इब्रानी कथन जानबूझकर तीखा और चौंकानेवाला है। प्रसंग में यह व्यंग्यात्मक या झिड़की के रूप में समझा जा सकता है, पर अनुवाद में उस धार्मिक तनाव को पहले से हल नहीं किया गया।
- issue: בָּנַי का लिंग-सटीक अनुवाद
  choice: ‘मेरे पुत्रों’
  alternative: ‘मेरी सन्तान’ या ‘मेरे बच्चों’
  rationale: मूल पाठ व्याकरणतः पुल्लिंग बहुवचन है। इसका व्यापक संकेत इस्राएल के समुदाय की ओर हो सकता है, जिसकी सूचना टिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक समानांतरता तथा ‘मेरे हाथों के काम’ का ठोस बिम्ब सुरक्षित है। ‘उसका रचयिता’ मूल के पुल्लिंग एकवचन प्रत्यय को दर्शाता है और सम्भावित संकेत को अनावश्यक रूप से स्पष्ट नहीं करता।
