  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נָתַתִּ֤י לְ/ךָ֙ אוֹצְר֣וֹת חֹ֔שֶׁךְ וּ/מַטְמֻנֵ֖י מִסְתָּרִ֑ים לְמַ֣עַן תֵּדַ֗ע כִּֽי אֲנִ֧י יְהוָ֛ה הַ/קּוֹרֵ֥א בְ/שִׁמְ/ךָ֖ אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/003.yaml
  text: And I will give you the treasures of darkness and the hidden riches of secret places[a], so that you may know that I am Yahweh, the one who calls you by name[c][b], the God of Israel.
translation:
  language: hi
  text: और मैं तुझे अंधकार के खज़ाने और गुप्त स्थानों में छिपी धन-संपत्तियाँ दूँगा,[a] ताकि तू जान ले कि मैं याहवे हूँ,[b] जो तुझे नाम लेकर बुलाता है—इस्राएल का परमेश्वर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अंधकार के खज़ाने” का अर्थ “अंधकार में छिपे खज़ाने” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “याहवे” इब्रानी ईश्वरीय नाम YHWH का लिप्यंतरण है; परंपरागत अनुवादों में इसके स्थान पर प्रायः “यहोवा” या “प्रभु” मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: और मैं ... दूँगा
  rationale: संयोजक वाव के साथ प्रथम पुरुष एकवचन पूर्ण क्रिया भविष्यसूचक प्रतिज्ञा के संदर्भ में भविष्य का अर्थ देती है।
- source_word: אוֹצְרוֹת חֹשֶׁךְ
  choice: अंधकार के खज़ाने
  rationale: इब्रानी संबंध-पदबंध की काव्यात्मक छवि को औपचारिक रूप से बनाए रखता है; इसका आशय अंधकार में छिपे खज़ाने भी हो सकता है।
- source_word: וּמַטְמֻנֵי מִסְתָּרִים
  choice: गुप्त स्थानों में छिपी धन-संपत्तियाँ
  rationale: מַטְמֻנִים में छिपाकर रखी मूल्यवान वस्तुओं और מִסְתָּרִים में गुप्त स्थानों—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְמַעַן תֵּדַע
  choice: ताकि तू जान ले
  rationale: उद्देश्यसूचक बल को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम YHWH का लिप्यंतरण है; इसे किसी उपाधि से नहीं बदलता।
- source_word: הַקּוֹרֵא בְשִׁמְךָ
  choice: जो तुझे नाम लेकर बुलाता है
  rationale: विशिष्ट रूप से नाम लेकर बुलाने या आह्वान करने का भाव स्वाभाविक आधुनिक हिन्दी में देता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: इब्रानी संबंध-रचना का मानक, स्पष्ट और गरिमापूर्ण हिन्दी रूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। लिप्यंतरण मूल की विशिष्टता को सुरक्षित रखता है और उसे उपाधि में नहीं बदलता।
- issue: खज़ानों और छिपी संपत्तियों का आशय
  choice: अंधकार अथवा गुप्त स्थानों में छिपी वास्तविक धन-संपत्ति की ठोस छवि
  alternative: आत्मिक खज़ानों का रूपक
  rationale: कुस्रू को संबोधित निकटवर्ती संदर्भ में राज्यों, द्वारों और संपत्ति की बात ठोस भौतिक अर्थ का समर्थन करती है; अनुवाद इसे आत्मिक रूपक बनाकर तनाव को समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुबोध शैली। एकवचन संबोधन के लिए “तू” रखा गया है, क्योंकि यह प्रत्यक्ष व्यक्तिगत संबोधन है और हिन्दी बाइबिलीय काव्य-भाषा में स्वाभाविक है।
