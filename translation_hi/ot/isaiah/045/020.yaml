  edition: WLC
  text: הִקָּבְצ֥וּ וָ/בֹ֛אוּ הִֽתְנַגְּשׁ֥וּ יַחְדָּ֖ו פְּלִיטֵ֣י הַ/גּוֹיִ֑ם לֹ֣א יָדְע֗וּ הַ/נֹּֽשְׂאִים֙ אֶת עֵ֣ץ פִּסְלָ֔/ם וּ/מִתְפַּלְלִ֔ים אֶל אֵ֖ל לֹ֥א יוֹשִֽׁיעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/020.yaml
  text: Gather yourselves and come[a]; draw near together, you survivors of the nations. They have no knowledge[c][b], those who carry the wood of their carved image and pray to a god that cannot save.
translation:
  language: hi
  text: अपने को इकट्ठा करो और आओ[a]; हे राष्ट्रों के बचे हुए लोगो, सब मिलकर निकट आओ। जो अपनी खुदी हुई लकड़ी की मूर्ति[b] उठाए फिरते हैं और ऐसे देवता से प्रार्थना करते हैं जो उद्धार नहीं कर सकता[c], वे कुछ नहीं जानते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इकट्ठे होओ और आओ; सब मिलकर पास आओ।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘उनकी खुदी हुई मूर्ति की लकड़ी’; अर्थात लकड़ी की मूर्ति।
    reason: lexical_alternative
  - marker: c
    text: या ‘जो उद्धार नहीं करता।’
    reason: alternative_reading
lexical_decisions:
- source_word: הִקָּבְצוּ וָבֹאוּ
  choice: इकट्ठे होकर आओ
  rationale: निफ़अल बहुवचन आज्ञार्थक और उसके बाद आए सामान्य आज्ञार्थक का स्वाभाविक हिन्दी रूप; यह स्वयं एकत्र होने और आने, दोनों क्रियाओं को बनाए रखता है।
- source_word: הִתְנַגְּשׁוּ יַחְדָּו
  choice: सब मिलकर निकट आओ
  rationale: हित्वपेल आज्ञार्थक का अर्थ यहाँ पास आने का आह्वान है; יַחְדָּו की सामूहिकता को ‘सब मिलकर’ व्यक्त करता है।
- source_word: פְּלִיטֵי הַגּוֹיִם
  choice: राष्ट्रों में से बचे हुए लोगो
  rationale: פְּלִיטֵי बच निकलने अथवा जीवित बचे रहने वालों को दर्शाता है। ‘में से’ सम्भवतः राष्ट्रों से आए बचे हुओं का अर्थ स्पष्ट करते हुए सम्बोधन को स्वाभाविक बनाता है।
- source_word: לֹא יָדְעוּ
  choice: वे कुछ नहीं जानते
  rationale: इब्रानी पूर्ण क्रिया यहाँ इन उपासकों की सामान्य दशा बताती है। यह रूप भविष्यद्वक्तापूर्ण दोषारोपण को सरल और दृढ़ हिन्दी में रखता है।
- source_word: הַנֹּשְׂאִים
  choice: जो ... उठाए फिरते हैं
  rationale: कर्ता के रूप में प्रयुक्त कृदन्त निरन्तर या अभ्यस्त क्रिया दर्शाता है; ‘उठाए फिरते हैं’ हिन्दी में इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֵץ פִּסְלָם
  choice: अपनी खुदी हुई मूर्ति की लकड़ी
  rationale: शाब्दिक संरचना ‘उनकी खुदी हुई मूर्ति की लकड़ी’ को बनाए रखने से मूर्ति के केवल लकड़ी होने पर किया गया व्यंग्य सुरक्षित रहता है।
- source_word: וּמִתְפַּלְלִים אֶל אֵל
  choice: और ऐसे देवता से प्रार्थना करते हैं
  rationale: कृदन्त की अभ्यस्त क्रिया और प्रार्थना के लक्ष्य दोनों को सहज हिन्दी में व्यक्त करता है। ‘देवता’ यहाँ राष्ट्रों द्वारा देव मानी गई सत्ता के लिए अनिश्चित और व्यंग्यात्मक प्रयोग है।
- source_word: לֹא יוֹשִׁיעַ
  choice: जो उद्धार नहीं कर सकता
  rationale: हिफ़ील क्रिया बचाने या छुड़ाने का अर्थ देती है। प्रसंग मूर्ति-देवता की असमर्थता पर बल देता है, इसलिए ‘नहीं कर सकता’ उपयुक्त है।
theological_decisions:
- issue: אֵל לֹא יוֹשִׁיעַ में मूर्ति-पूजा के विरुद्ध व्यंग्य
  choice: ऐसे देवता ... जो उद्धार नहीं कर सकता
  alternative: ऐसे देवता ... जो उद्धार नहीं करता
  rationale: ‘देवता’ मूल के אֵל को बनाए रखता है, पर उसे सच्चा परमेश्वर घोषित नहीं करता; ‘नहीं कर सकता’ झूठे देवता की उद्धार करने की असमर्थता को सामने लाता है।
- issue: לֹא יָדְעוּ का नैतिक और बौद्धिक आरोप
  choice: वे कुछ नहीं जानते
  alternative: उनमें ज्ञान नहीं है
  rationale: दोनों सम्भव हैं; चुना हुआ रूप मूल क्रिया की सीधाई बनाए रखता है और यह तय नहीं करता कि अज्ञान केवल बौद्धिक है या दोषपूर्ण आध्यात्मिक अंधता भी।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘खुदी हुई मूर्ति की लकड़ी’ जानबूझकर कुछ असामान्य है, क्योंकि यह मूल इब्रानी के मूर्ति-विरोधी व्यंग्य को सुरक्षित रखता है; फुटनोट उसका आशय स्पष्ट करता है।
