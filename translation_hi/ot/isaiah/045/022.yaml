  text: פְּנוּ אֵלַ֥/י וְ/הִוָּשְׁע֖וּ כָּל אַפְסֵי אָ֑רֶץ כִּ֥י אֲנִי אֵ֖ל וְ/אֵ֥ין עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/022.yaml
  text: Turn to me and be saved[a], all the ends of the earth; for I am God, and there is no other.
translation:
  language: hi
  text: हे पृथ्वी के दूर-दूर के सभी लोगों, मेरी ओर मुड़ो और उद्धार पाओ[a], क्योंकि मैं परमेश्वर हूँ, और कोई दूसरा नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मेरी ओर देखो और उद्धार पाओ।’ इब्रानी क्रिया का अर्थ किसी की ओर मुड़ना हो सकता है और इस प्रसंग में परमेश्वर की ओर दृष्टि लगाने का भाव भी शामिल हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנוּ
  choice: मेरी ओर फिरो
  rationale: פנה का बहुवचन आज्ञार्थक रूप किसी की ओर मुड़ने या उन्मुख होने का आह्वान करता है। ‘मेरी ओर फिरो’ दिशात्मक अर्थ को स्वाभाविक हिन्दी में रखता है और केवल देखने तक अर्थ को सीमित नहीं करता।
- source_word: אֵלַי
  choice: मेरी ओर
  rationale: אֶל के प्रथम पुरुष एकवचन प्रत्यय से वक्ता की ओर गति या उन्मुखता व्यक्त होती है; ‘मेरी ओर’ हिन्दी में इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְהִוָּשְׁעוּ
  choice: और उद्धार पाओ
  rationale: ישׁע का निफ़अल बहुवचन आज्ञार्थक रूप प्राप्त किए जाने वाले छुटकारे को व्यक्त करता है। ‘उद्धार पाओ’ इस ग्रहणशील भाव को बनाए रखता है।
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: हे पृथ्वी के दूर-दूर के सभी लोगो
  rationale: शाब्दिक मुहावरा ‘पृथ्वी के सभी छोर’ दूरस्थ क्षेत्रों और वहाँ के लोगों को संबोधित करता है। हिन्दी में प्रत्यक्ष संबोधन स्पष्ट करने हेतु ‘दूर-दूर के सभी लोगो’ स्वाभाविक है, जबकि विश्वव्यापी दायरा बना रहता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आह्वान का आधार प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका स्पष्ट कारणसूचक रूप है।
- source_word: אֲנִי אֵל
  choice: मैं ही परमेश्वर हूँ
  rationale: אֵל यहाँ सामान्य उपाधि ‘परमेश्वर’ है। हिन्दी का बलसूचक ‘ही’ अगले वाक्यांश में स्पष्ट की गई विशिष्टता को स्वाभाविक रूप से व्यक्त करता है, बिना ‘अकेला’ जैसी अलग अवधारणा जोड़ने के।
- source_word: וְאֵין עוֹד
  choice: और कोई दूसरा नहीं
  rationale: यह इब्रानी मुहावरा परमेश्वर की अनुपम और अनन्य सत्ता की घोषणा करता है। यह रूप संक्षिप्त, स्पष्ट और मूल की निरपेक्षता के अनुरूप है।
theological_decisions:
- issue: परमेश्वर की अनन्यता / एकेश्वरवादी घोषणा
  choice: मैं ही परमेश्वर हूँ, और कोई दूसरा नहीं
  alternative: मैं परमेश्वर हूँ, और मेरे सिवा कोई नहीं
  rationale: मूल पाठ परमेश्वर की अनन्यता को उद्धार के विश्वव्यापी आह्वान का आधार बनाता है। चुना हुआ रूप उस दावे को बनाए रखता है और अंतिम खंड में ‘मेरे सिवा’ जोड़कर निहित सर्वनाम को स्पष्टतः नहीं बढ़ाता।
- issue: उद्धार के आह्वान का ग्रहणशील स्वर
  choice: उद्धार पाओ
  alternative: अपना उद्धार करो
  rationale: निफ़अल रूप उद्धार को स्वयं उत्पन्न करने की अपेक्षा प्राप्त छुटकारे के रूप में प्रस्तुत करता है; इसलिए ऐसा सक्रिय रूप नहीं चुना गया जो आत्म-उद्धार का संकेत दे।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष और सर्वसुलभ शैली। ‘हे ... लोगो’ से बहुवचन संबोधन स्पष्ट किया गया है। ‘पृथ्वी के दूर-दूर के’ मूल मुहावरे के विश्वव्यापी, दूरस्थ विस्तार को सहज हिन्दी में व्यक्त करता है।
