  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה יְגִ֨יעַ מִצְרַ֥יִם וּֽ/סְחַר כּוּשׁ֮ וּ/סְבָאִים֮ אַנְשֵׁ֣י מִדָּה֒ עָלַ֤יִ/ךְ יַעֲבֹ֨רוּ֙ וְ/לָ֣/ךְ יִֽהְי֔וּ אַחֲרַ֣יִ/ךְ יֵלֵ֔כוּ בַּ/זִּקִּ֖ים יַעֲבֹ֑רוּ וְ/אֵלַ֤יִ/ךְ יִֽשְׁתַּחֲוּוּ֙ אֵלַ֣יִ/ךְ יִתְפַּלָּ֔לוּ אַ֣ךְ בָּ֥/ךְ אֵ֛ל וְ/אֵ֥ין ע֖וֹד אֶ֥פֶס אֱלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/014.yaml
  text: 'Thus says Yahweh: The wealth of Egypt and the merchandise of Cush and the Sabeans[a], men of great stature, will pass over to you and will be yours; they will walk behind you, they will pass over in chains; they will bow down to you, they will pray to you: ‘Surely God is in you, and there is no other[b]; there is no other god.’'
translation:
  language: hi
  text: 'याहवे यों कहता है:

    “मिस्र की कमाई और कूश[a] का व्यापारिक माल,

    और सबा के लोग—ऊँचे कद के पुरुष—

    तेरे पास आएँगे और तेरे हो जाएँगे।

    वे तेरे पीछे चलेंगे;

    वे बेड़ियों में जकड़े हुए आएँगे।

    वे तेरे सामने झुकेंगे

    और तुझसे प्रार्थना करेंगे:[b]

    ‘निश्चय ही परमेश्वर तेरे बीच में है,

    और कोई दूसरा नहीं;

    कोई और ईश्वर नहीं है।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कूश’ प्राचीन इब्रानी स्थान-नाम है; कुछ पुराने अनुवादों में इसे ‘इथियोपिया’ कहा गया है।
    reason: cultural_note
  - marker: b
    text: इसका अनुवाद ‘तुझसे विनती करेंगे’ भी हो सकता है। इब्रानी क्रिया प्रार्थना अथवा गंभीर निवेदन, दोनों का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचिक नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: יְגִיעַ
  choice: कमाई
  rationale: यहाँ संज्ञा मिस्र के श्रम से प्राप्त उपज या संपदा को दर्शाती है; ‘कमाई’ आर्थिक अर्थ और श्रम-संबंध दोनों को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: סְחַר
  choice: व्यापारिक माल
  rationale: यह शब्द व्यापार की वस्तुओं अथवा उनसे होने वाले लाभ को सूचित करता है; समानांतर आर्थिक संदर्भ में ‘व्यापारिक माल’ ठोस और स्पष्ट है।
- source_word: כּוּשׁ
  choice: कूश
  rationale: प्राचीन स्थान-नाम को किसी आधुनिक देश के साथ अनिश्चित रूप से समान ठहराने के बजाय लिप्यंतरित किया गया है।
- source_word: סְבָאִים
  choice: सबा के लोग
  rationale: जाति-सूचक शब्द को उसके मूल स्थान-नाम सबा से जोड़कर साधारण हिन्दी पाठक के लिए स्पष्ट किया गया है।
- source_word: אַנְשֵׁי מִדָּה
  choice: ऊँचे कद के पुरुष
  rationale: शाब्दिक ‘नाप के पुरुष’ का आशय उल्लेखनीय शारीरिक कद है; यह चयन उसी पुरुषवाचक और शारीरिक अर्थ को सहज हिन्दी में देता है।
- source_word: עָלַיִךְ יַעֲבֹרוּ
  choice: तेरे पास आएँगे
  rationale: स्त्रीलिंग एकवचन संबोधन सिय्योन/इस्राएल की ओर गति को बताता है; हिन्दी में यह उस दिशात्मक भाव का स्वाभाविक रूप है।
- source_word: בַּזִּקִּים
  choice: बेड़ियों में जकड़े हुए
  rationale: शब्द बंधनों या जंजीरों को दर्शाता है; यह रूप अधीनता और बंदी दशा की सजीव छवि बनाए रखता है।
- source_word: וְאֵלַיִךְ יִשְׁתַּחֲוּוּ
  choice: तेरे सामने झुकेंगे
  rationale: क्रिया झुकने, दंडवत करने या प्रसंगानुसार उपासना का अर्थ दे सकती है। यहाँ संबोधन स्त्रीलिंग एकवचन है, इसलिए ‘झुकेंगे’ अनावश्यक रूप से दिव्य उपासना का निष्कर्ष निकाले बिना दृश्य को सुरक्षित रखता है।
- source_word: אֵלַיִךְ יִתְפַּלָּלוּ
  choice: तुझसे प्रार्थना करेंगे
  rationale: हिब्रू में दिशा स्पष्टतः स्त्रीलिंग एकवचन संबोधित पात्र की ओर है। औपचारिक अर्थ को मुख्य पाठ में रखा गया है और ‘विनती’ की सम्भावना पादटिप्पणी में दी गई है।
- source_word: אַךְ בָּךְ אֵל
  choice: निश्चय ही परमेश्वर तेरे बीच में है
  rationale: אַךְ की दृढ़ पुष्टि और בָּךְ के भीतर/बीच में होने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאֵין עוֹד אֶפֶס אֱלֹהִים
  choice: और कोई दूसरा नहीं; कोई और ईश्वर नहीं है
  rationale: मूल की दोहरी, जोरदार नकारात्मक घोषणा को दो अलग वाक्यांशों में बनाए रखा गया है।
theological_decisions:
- issue: क्या יִשְׁתַּחֲוּוּ को सिय्योन/इस्राएल की ‘उपासना’ के रूप में अनूदित किया जाए
  choice: ‘तेरे सामने झुकेंगे’
  alternative: ‘तेरी उपासना करेंगे’ या ‘तेरे सामने दंडवत करेंगे’
  rationale: संबोधित पात्र स्त्रीलिंग एकवचन है। ‘झुकेंगे’ सम्मान और अधीनता की शारीरिक क्रिया को रखता है, पर यह तय नहीं करता कि सिय्योन को दिव्य उपासना दी जा रही है।
- issue: क्या אֵלַיִךְ יִתְפַּלָּלוּ का अर्थ सिय्योन से प्रार्थना करना है या उससे विनती करना
  choice: मुख्य पाठ में ‘तुझसे प्रार्थना करेंगे’, साथ में पादटिप्पणी में ‘विनती करेंगे’
  alternative: ‘तुझसे विनती करेंगे’
  rationale: क्रिया सामान्यतः प्रार्थना के लिए प्रयुक्त होती है और दिशा-सूचक रूप सीधे स्त्रीलिंग एकवचन संबोधित पात्र की ओर है। कठिन धार्मिक तनाव को हटाने के बजाय औपचारिक अर्थ रखा गया और व्यापक निवेदनार्थक सम्भावना स्पष्ट की गई।
- issue: अंतिम אֱלֹהִים को विशिष्ट नाम माना जाए या सामान्य संज्ञा
  choice: ‘ईश्वर’—सामान्य संज्ञा के रूप में
  alternative: ‘परमेश्वर’
  rationale: वाक्य का अंतिम पद किसी अन्य देवता/ईश्वर के अस्तित्व का निषेध करता है; इसलिए सामान्य संज्ञा इस राष्ट्रगत अंगीकार की संरचना को अधिक निकटता से व्यक्त करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्त्रीलिंग एकवचन ‘तेरे/तुझसे’ मूल पाठ में सिय्योन या इस्राएल को किए गए संबोधन को सुरक्षित रखता है। काव्यात्मक पंक्ति-विन्यास समानांतरता, क्रमिक अधीनता और अंतिम एकेश्वरवादी घोषणा के जोर को उभारता है।
