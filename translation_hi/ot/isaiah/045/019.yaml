  text: לֹ֧א בַ/סֵּ֣תֶר דִּבַּ֗רְתִּי בִּ/מְקוֹם֙ אֶ֣רֶץ חֹ֔שֶׁךְ לֹ֥א אָמַ֛רְתִּי לְ/זֶ֥רַע יַעֲקֹ֖ב תֹּ֣הוּ בַקְּשׁ֑וּ/נִי אֲנִ֤י יְהוָה֙ דֹּבֵ֣ר צֶ֔דֶק מַגִּ֖יד מֵישָׁרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/019.yaml
  text: I did not speak in secret[a], in a land of darkness; I did not say to the offspring of Jacob, ‘Seek me in vain.’ I, Yahweh, speak righteousness[b], declaring what is upright.
translation:
  language: hi
  text: 'मैंने गुप्त में,

    अंधकारमय देश के किसी स्थान में, बात नहीं की;

    मैंने याकूब के वंश से यह नहीं कहा,

    “व्यर्थ मुझे खोजो।”[a]

    मैं याहवे हूँ; मैं जो उचित है वह कहता हूँ,

    और जो सीधा है उसकी घोषणा करता हूँ।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बिना फल के मुझे खोजो।” हिब्रू शब्द תֹהוּ का अर्थ शून्यता, निष्फलता या निराकार अवस्था हो सकता है; यहाँ भाव यह है कि याहवे को खोजना निरर्थक नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या “मैं धार्मिकता की बात कहता हूँ” अथवा “मैं न्याय की बात कहता हूँ।” हिब्रू शब्द צֶדֶק धार्मिकता, सहीपन या न्याय का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַסֵּתֶר
  choice: गुप्त में
  rationale: यह अभिव्यक्ति छिपाव या गोपनीयता का भाव रखती है और परमेश्वर के खुले प्रकाशन के साथ निहित विरोध को बनाए रखती है।
- source_word: בִּמְקוֹם אֶרֶץ חֹשֶׁךְ
  choice: अंधकारमय देश के किसी स्थान से
  rationale: हिब्रू की ‘अंधकार के देश के किसी स्थान में/से’ संरचना को स्वाभाविक हिन्दी में रखते हुए स्थान और अंधकार—दोनों बिंब सुरक्षित किए गए हैं।
- source_word: לְזֶרַע יַעֲקֹב
  choice: याकूब के वंश से
  rationale: זֶרַע यहाँ सामूहिक रूप से याकूब के वंशजों को दर्शाता है; ‘वंश’ संक्षिप्त, स्वाभाविक और प्रतिष्ठित हिन्दी है।
- source_word: תֹּהוּ
  choice: व्यर्थ ही
  rationale: यहाँ शब्द का आशय शून्यता, निष्फलता या निरर्थकता है; ‘व्यर्थ ही’ यह बताता है कि यहोवा को खोजना निष्फल नहीं है।
- source_word: בַקְּשׁוּנִי
  choice: मुझे खोजो
  rationale: आज्ञार्थक क्रिया और प्रथम पुरुष प्रत्यय का सीधा तथा स्वाभाविक अनुवाद।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: דֹּבֵר צֶדֶק
  choice: धार्मिकता की बातें कहता है
  rationale: צֶדֶק की धार्मिकता, न्याय और सहीपन संबंधी व्यापकता को ‘धार्मिकता’ बनाए रखती है; हिन्दी में क्रिया के साथ स्वाभाविकता हेतु ‘की बातें’ जोड़ा गया है।
- source_word: מַגִּיד מֵישָׁרִים
  choice: सीधी बातें घोषित करता है
  rationale: מֵישָׁרִים के सीधेपन, खराई और उचित बातों के बिंब को ‘सीधी बातें’ सुरक्षित रखता है, जबकि ‘घोषित करता है’ מַגִּיד के सार्वजनिक कथन का भाव देता है।
theological_decisions:
- issue: पद के अंत में यहोवा का आत्म-वर्णन
  choice: मैं यहोवा हूँ, जो धार्मिकता की बातें कहता है, जो सीधी बातें घोषित करता है।
  alternative: मैं यहोवा हूँ, जो न्याय की बात कहता और उचित बातों की घोषणा करता है।
  rationale: चुना हुआ पाठ צֶדֶק और מֵישָׁרִים की नैतिक तथा वाचागत गहराई बनाए रखता है और उन्हें केवल विधिक ‘न्याय’ या केवल तथ्यात्मक ‘सत्य’ तक सीमित नहीं करता।
- issue: תֹּהוּ के साथ खोजने की आज्ञा का अर्थ
  choice: “व्यर्थ ही मुझे खोजो।”
  alternative: “शून्यता में मुझे खोजो।” / “बिना फल के मुझे खोजो।”
  rationale: संदर्भ यहोवा को खोजने की निष्फलता का निषेध करता है। ‘व्यर्थ ही’ अर्थ स्पष्ट करता है, पर शब्द में निहित शून्यता और निरर्थकता की व्यापकता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु भविष्यद्वाणी की गरिमा और काव्यात्मक समानांतरता बनाए रखी गई है। ‘गुप्त में’, ‘अंधकारमय देश’ और ‘सीधी बातें’ जैसे पद मूल बिंबों को सुरक्षित रखते हैं। दिव्य नाम के लिए ‘यहोवा’ प्रयोग किया गया है।
