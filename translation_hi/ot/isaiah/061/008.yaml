reference: Isaiah 61:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י אֲנִ֤י יְהוָה֙ אֹהֵ֣ב מִשְׁפָּ֔ט שֹׂנֵ֥א גָזֵ֖ל בְּ/עוֹלָ֑ה וְ/נָתַתִּ֤י פְעֻלָּתָ/ם֙ בֶּ/אֱמֶ֔ת וּ/בְרִ֥ית עוֹלָ֖ם אֶכְר֥וֹת לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/008.yaml
  text: For I[a], Yahweh, love justice; I hate robbery with burnt offering. And I will give them their recompense in faithfulness[c][b], and I will cut an everlasting covenant with them.
translation:
  language: hi
  text: क्योंकि मैं, यहोवा, न्याय से प्रेम करता हूँ; मैं होमबलि से जुड़ी लूट से घृणा करता हूँ।[a] मैं निष्ठापूर्वक उन्हें उनका प्रतिफल[b] दूँगा और उनके साथ सदा की वाचा बाँधूँगा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू वाक्यांश कठिन है। इसका अनुवाद ‘होमबलि में लूट’, ‘होमबलि के लिए लूट’, या संभवतः ‘दुष्टता के साथ लूट’ भी किया गया है। यह चोरी या लूट की वस्तुओं को बलि में चढ़ाने अथवा आराधना के साथ अन्याय मिलाने की ओर संकेत कर सकता है।
    reason: alternative_reading
  - marker: b
    text: या ‘उनकी मजदूरी’ अथवा ‘उनका पुरस्कार’।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू मुहावरा शाब्दिक रूप से ‘वाचा काटना’ है, अर्थात वाचा बाँधना या स्थापित करना।
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचागत नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी में प्रचलित नामरूप से सुरक्षित रखा गया है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: लूट के साथ नैतिक विरोध के कारण यहाँ न्यायिक निर्णय से अधिक सामाजिक और नैतिक न्याय का अर्थ प्रमुख है।
- source_word: גָזֵל
  choice: लूट
  rationale: यह शब्द अन्यायपूर्वक या बलपूर्वक छीनी गई वस्तु अथवा लूटने के कृत्य को दर्शाता है; ‘लूट’ हिन्दी में दोनों संकेतों को संक्षेप में बनाए रखता है।
- source_word: בְּעוֹלָה
  choice: होमबलि से जुड़ी
  rationale: मसोरेटिक पाठ עוֹלָה को ‘होमबलि’ पढ़ता है, पर उपसर्ग בְּ का सटीक संबंध अस्पष्ट है। ‘से जुड़ी’ लूट और बलि के संबंध को व्यक्त करता है, बिना यह तय किए कि लूट बलि में, बलि के लिए, या बलि के साथ है।
- source_word: פְעֻלָּתָם
  choice: उनका प्रतिफल
  rationale: सन्दर्भ में आशय उस फल या पारिश्रमिक से है जो परमेश्वर उन्हें देता है, न कि केवल उनके काम से।
- source_word: בֶּאֱמֶת
  choice: निष्ठापूर्वक
  rationale: यह परमेश्वर के देने की विश्वसनीयता और सत्यनिष्ठा को स्वाभाविक हिन्दी में व्यक्त करता है और वाचा-संबंधी भाव बनाए रखता है।
- source_word: בְרִית עוֹלָם
  choice: सदा की वाचा
  rationale: यह स्थायी, निरंतर रहने वाली वाचा का संक्षिप्त और प्रतिष्ठित हिन्दी रूप है।
- source_word: אֶכְרֹת
  choice: बाँधूँगा
  rationale: हिब्रू में शाब्दिक मुहावरा ‘वाचा काटना’ है। हिन्दी का ‘वाचा बाँधना’ स्वाभाविक वाचागत मुहावरा है और केवल सपाट ‘करना’ की अपेक्षा मूल अभिव्यक्ति के रूपकात्मक स्वर को अधिक बनाए रखता है।
theological_decisions:
- issue: גָזֵל בְּעוֹלָה का अर्थ
  choice: होमबलि से जुड़ी लूट
  alternative: होमबलि में लूट; होमबलि के लिए लूट; दुष्टता के साथ लूट
  rationale: मसोरेटिक व्यंजन और स्वरांकन עוֹלָה, ‘होमबलि’, का समर्थन करते हैं। बְּ संबंध को कई प्रकार से समझा जा सकता है, इसलिए मुख्य पाठ अन्याय और आराधना के बीच संबंध तो रखता है, पर उसकी ठीक प्रकृति को निश्चित नहीं करता। ‘दुष्टता’ का पाठ संभव है केवल भिन्न शब्द/पाठगत समझ के आधार पर, इसलिए उसे मुख्य पाठ में नहीं अपनाया गया।
- issue: פְעֻלָּתָם का आशय
  choice: उनका प्रतिफल
  alternative: उनकी मजदूरी; उनका पुरस्कार; उनका काम
  rationale: पद में परमेश्वर द्वारा निष्ठापूर्वक कुछ देने और वाचा बाँधने की प्रतिज्ञा है; इसलिए देय फल का अर्थ संदर्भ के अनुकूल है, जबकि शब्द की व्यापक अर्थ-सीमा पादटिप्पणी में सुरक्षित है।
- issue: כרת ברית का अनुवाद
  choice: वाचा बाँधूँगा
  alternative: वाचा करूँगा; शाब्दिक रूप से, वाचा काटूँगा
  rationale: हिन्दी में ‘वाचा बाँधना’ अर्थपूर्ण और प्रतिष्ठित मुहावरा है। यह हिब्रू के शाब्दिक ‘काटना’ को अस्वाभाविक ढंग से आरोपित किए बिना वाचागत क्रिया की गंभीरता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यवाणी और वाचा के प्रसंग के अनुरूप गरिमापूर्ण रखी गई है। ‘होमबलि’, ‘प्रतिफल’ और ‘वाचा बाँधना’ जैसे शब्द बाइबलीय अवधारणाओं को स्पष्ट रखते हैं; कठिन हिब्रू संबंध को पादटिप्पणी में खुला रखा गया है।
