id: ISA.61.11
reference: Isaiah 61:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י כָ/אָ֨רֶץ֙ תּוֹצִ֣יא צִמְחָ֔/הּ וּ/כְ/גַנָּ֖ה זֵרוּעֶ֣י/הָ תַצְמִ֑יחַ כֵּ֣ן אֲדֹנָ֣/י יְהוִ֗ה יַצְמִ֤יחַ צְדָקָה֙ וּ/תְהִלָּ֔ה נֶ֖גֶד כָּל הַ/גּוֹיִֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/011.yaml
  text: For as the earth brings forth its growth[a], and as a garden causes what is sown in it to spring up, so the Lord GOD will cause righteousness and praise to spring up before all the nations.
translation:
  language: hi
  text: क्योंकि जैसे पृथ्वी अपनी उपज उत्पन्न करती है, और जैसे बाग में बोई हुई वस्तुएँ उगती हैं, वैसे ही प्रभु याहवे सब राष्ट्रों के सामने धार्मिकता[a] और स्तुति उत्पन्न करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्याय”; इब्रानी शब्द में सार्वजनिक रूप से सही ठहराए जाने या न्याय प्रकट होने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָאָרֶץ
  choice: पृथ्वी
  rationale: यह सामान्य कृषि-उपमा है, किसी विशेष भूभाग का उल्लेख नहीं; इसलिए ‘पृथ्वी’ उपयुक्त है।
- source_word: צִמְחָהּ
  choice: अपना अंकुर
  rationale: यह शब्द पृथ्वी से निकलने वाली नई बढ़वार या अंकुर को दर्शाता है; ‘अंकुर’ कृषि-बिंब को स्पष्ट रखता है।
- source_word: זֵרוּעֶיהָ
  choice: उसमें बोई हुई चीज़ों
  rationale: इब्रानी रूप केवल अमूर्त ‘बीज’ नहीं, बल्कि बोई गई वस्तुओं की ओर संकेत करता है; यह वाक्यांश उस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תַצְמִיחַ / יַצְמִיחַ
  choice: अंकुरित करती है / अंकुरित करेगा
  rationale: दोनों क्रियाओं की कारकता और पद की दोहराई गई कृषि-छवि को बनाए रखा गया है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: ‘प्रभु’ उपाधि और परमेश्वर के व्यक्तिवाचक वाचा-नाम, दोनों को अलग और स्पष्ट रखा गया है।
- source_word: צְדָקָה
  choice: धार्मिकता
  rationale: यह नैतिक और वाचागत सहीपन को व्यक्त करता है, जबकि सार्वजनिक न्याय या निर्दोष ठहराए जाने का संभावित भाव पादटिप्पणी में सुरक्षित है।
- source_word: תְהִלָּה
  choice: स्तुति
  rationale: यह परमेश्वर के उद्धारकारी कार्य के प्रत्युत्तर में उठने वाली प्रशंसा का सामान्य अर्थ व्यक्त करता है।
- source_word: נֶגֶד כָּל הַגּוֹיִם
  choice: सब राष्ट्रों के सामने
  rationale: ‘सामने’ सार्वजनिक और प्रत्यक्ष प्रकट होने के भाव को बनाए रखता है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में उपाधि אֲדֹנָי और व्यक्तिवाचक नाम יְהוִה दोनों हैं; यह अनुवाद दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- issue: पुनर्स्थापना की भविष्यवाणी में צְדָקָה का अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: मूल शब्द में नैतिक-वाचागत सहीपन के साथ सार्वजनिक न्याय या समर्थन का भाव भी हो सकता है; मुख्य पाठ व्यापक पारंपरिक अर्थ रखता है और विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘अंकुरित’ की पुनरावृत्ति मूल की कृषि-उपमा और צמח धातु की पुनरावृत्ति को जानबूझकर बनाए रखती है।
