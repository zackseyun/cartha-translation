    text: या “न्याय”; इब्रानी शब्द में सार्वजनिक रूप से सही ठहराए जाने या न्याय प्रकट होने का भाव भी हो सकता है।
    reason: lexical_alternative
  revision_rationale: The revision replaces awkward uses of ‘अंकुरित करना’ with ‘उत्पन्न करना/उगना,’ preserving the Hebrew agricultural simile and its causative conclusion in idiomatic Hindi. It also uses the more current ‘बाग.’ The middle clause is rendered intransitively (‘बोई हुई वस्तुएँ उगती हैं’), which naturally expresses the garden’s causing what is sown to grow without introducing a misleading agent. The theological terminology and footnote are retained.
