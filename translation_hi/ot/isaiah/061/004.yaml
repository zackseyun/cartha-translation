  text: וּ/בָנוּ֙ חָרְב֣וֹת עוֹלָ֔ם שֹׁמְמ֥וֹת רִֽאשֹׁנִ֖ים יְקוֹמֵ֑מוּ וְ/חִדְּשׁוּ֙ עָ֣רֵי חֹ֔רֶב שֹׁמְמ֖וֹת דּ֥וֹר וָ/דֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/004.yaml
  text: They will rebuild the ancient ruins[a]; they will raise up the former desolations; they will renew the ruined cities[b], the desolations of generation after generation.
translation:
  language: hi
  text: वे प्राचीन खंडहरों[a] को फिर से बनाएँगे; पूर्वकाल के उजड़े स्थानों को फिर खड़ा करेंगे। वे उजड़े हुए नगरों को नवीकृत करेंगे, जो पीढ़ी-दर-पीढ़ी उजाड़ पड़े रहे हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पुराने समय के खंडहरों।” यहाँ इब्रानी शब्द עוֹלָם सुदूर प्राचीन काल या बहुत लंबी अवधि का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “जो बहुत-सी पीढ़ियों से उजाड़ पड़े रहे हैं।” इब्रानी में शाब्दिक अभिव्यक्ति “पीढ़ी और पीढ़ी” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנוּ
  choice: वे ... फिर से बनाएँगे
  rationale: בנה का मूल अर्थ ‘बनाना’ है; खंडहरों के संदर्भ में ‘फिर से बनाएँगे’ पुनर्स्थापन का निहित भाव स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: חָרְבוֹת עוֹלָם
  choice: प्राचीन खंडहरों
  rationale: חָרְבוֹת उजड़े या ध्वस्त स्थानों को और עוֹלָם यहाँ सुदूर अतीत अथवा दीर्घ अवधि को सूचित करता है; ‘प्राचीन खंडहर’ संक्षिप्त और स्वाभाविक है।
- source_word: שֹׁמְמוֹת רִאשֹׁנִים
  choice: बीते समय के उजड़े स्थानों
  rationale: שֹׁמְמוֹת उजाड़ स्थानों या उजड़ी दशा को व्यक्त करता है और רִאשֹׁנִים यहाँ क्रमसूचक ‘पहले’ से अधिक कालगत ‘पूर्वकालीन’ है।
- source_word: יְקוֹמֵמוּ
  choice: फिर खड़ा करेंगे
  rationale: קום का यह रूप उजड़ी वस्तु को पुनः खड़ा करने का कारक और पुनर्स्थापक भाव रखता है; इस चयन से मूल का ठोस रूपक बचा रहता है।
- source_word: וְחִדְּשׁוּ
  choice: फिर नया करेंगे
  rationale: חדשׁ का सीधा अर्थ नया करना या नवीकृत करना है; ‘फिर नया करेंगे’ पिछले क्रियापदों से भेद बनाए रखते हुए पुनर्नवीकरण का भाव देता है।
- source_word: עָרֵי חֹרֶב
  choice: उजड़े हुए नगरों
  rationale: यह संबंधवाचक पद ऐसे नगरों को बताता है जिनकी विशेषता विनाश या उजाड़ दशा है; ‘उजड़े हुए नगर’ आधुनिक हिन्दी में सहज है।
- source_word: שֹׁמְמוֹת דּוֹר וָדוֹר
  choice: जो पीढ़ी-दर-पीढ़ी उजाड़ पड़े रहे हैं
  rationale: דּוֹר וָדוֹר लगातार आने वाली पीढ़ियों का वितरक भाव रखता है; हिन्दी का ‘पीढ़ी-दर-पीढ़ी’ उस संरचना और दीर्घकालीन उजाड़पन दोनों को व्यक्त करता है।
