  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप रखा गया है। तीनों पुनर्स्थापनकारी क्रियाओं—बनाना, खड़ा करना और नया करना—का भेद यथासंभव सुरक्षित रखा गया है; अंतिम पदबंध को नगरों की व्याख्या के रूप में स्पष्ट किया गया है।
