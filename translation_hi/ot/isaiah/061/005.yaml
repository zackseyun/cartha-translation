id: ISA.61.5
reference: Isaiah 61:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עָמְד֣וּ זָרִ֔ים וְ/רָע֖וּ צֹאנְ/כֶ֑ם וּ/בְנֵ֣י נֵכָ֔ר אִכָּרֵי/כֶ֖ם וְ/כֹרְמֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/005.yaml
  text: Foreigners will stand and shepherd your flocks[b][a], and foreigners' sons will be your farmers and your vinedressers.
translation:
  language: hi
  text: परदेशी खड़े होंगे और तुम्हारी भेड़-बकरियों के झुंड चराएँगे[a]; और पराए देश के लोग[b] तुम्हारे किसान और दाख की बारी में काम करनेवाले होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी भेड़-बकरियों की चरवाही करेंगे।”
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में “पराए देश के पुत्र”; यह विदेशी राष्ट्रों के लोगों के लिए प्रयुक्त मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: זָרִים
  choice: परदेशी
  rationale: यह शब्द संबोधित समुदाय से बाहर के लोगों को सूचित करता है। ‘परदेशी’ आधुनिक हिन्दी में स्वाभाविक है और जातीय अथवा राष्ट्रीय बाहरीपन का भाव बनाए रखता है।
- source_word: וְעָמְדוּ
  choice: खड़े होंगे
  rationale: क्रिया के मूल ‘खड़ा होना’ अर्थ और सेवा के लिए उपस्थित रहने की छवि को बिना अनावश्यक व्याख्या के सुरक्षित रखा गया है।
- source_word: וְרָעוּ
  choice: चराएँगे
  rationale: רעה यहाँ पशुओं को चराने अथवा उनकी चरवाही करने के अर्थ में है। ‘चराएँगे’ सहज हिन्दी है और पशुपालकीय क्रिया को स्पष्ट रखता है।
- source_word: צֹאנְכֶם
  choice: तुम्हारी भेड़-बकरियों के झुंड
  rationale: सामूहिक संज्ञा צאן छोटे पालतू पशुओं, विशेषतः भेड़ों और बकरियों, को समेट सकती है; यह चयन उस व्यापकता को स्पष्ट करता है।
- source_word: בְנֵי נֵכָר
  choice: पराए देश के लोग
  rationale: शाब्दिक ‘पराए देश के पुत्र’ एक सामी मुहावरा है जिसका आशय विदेशी राष्ट्रों के लोग है। स्वाभाविक हिन्दी में अर्थ व्यक्त किया गया है और मुहावरे की जानकारी पादटिप्पणी में रखी गई है।
- source_word: אִכָּרֵיכֶם
  choice: तुम्हारे किसान
  rationale: संज्ञा भूमि जोतने या खेती करनेवालों को सूचित करती है। ‘किसान’ स्पष्ट, वर्तमान और व्यापक रूप से समझा जानेवाला पद है।
- source_word: כֹרְמֵיכֶם
  choice: दाख की बारी में काम करनेवाले
  rationale: यह शब्द विशेष रूप से अंगूर की बारियों में काम करनेवालों के लिए है। यह वाक्यांश ‘दाखबारी’ जैसे कम प्रचलित पद की अपेक्षा सामान्य पाठक के लिए अधिक स्पष्ट है।
theological_decisions:
- issue: सिय्योन की पुनर्स्थापना में सामाजिक भूमिकाओं का उलटाव
  choice: पद में परदेशियों को पुनर्स्थापित संबोधित समुदाय के लिए पशुपालन और कृषि का काम करते हुए दर्शाया गया है।
  alternative: इसे केवल अंतरराष्ट्रीय सहयोग या समृद्धि के रूपक के रूप में सामान्यीकृत करना।
  rationale: इब्रानी पाठ सेवा-संबंधी भूमिकाओं की विषमता को स्पष्ट रूप से प्रस्तुत करता है। अनुवाद इस तनाव को न तो नरम करता है, न इसे बाद की किसी कलीसियाई व्याख्या से बदलता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘खड़े होंगे’ मूल की औपचारिक छवि को सुरक्षित रखता है, जबकि ‘दाख की बारी में काम करनेवाले’ विशिष्ट कृषि-भूमिका को सहज हिन्दी में व्यक्त करता है।
