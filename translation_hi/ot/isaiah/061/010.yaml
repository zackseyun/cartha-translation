base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/010.yaml
  text: I will greatly rejoice in Yahweh[a]; my soul will exult in my God, for he has clothed me with garments of salvation; he has wrapped me in a robe of righteousness, like a bridegroom who adorns himself with a priestly headdress[b], and like a bride who decks herself with her jewelry.
translation:
  language: hi
  text: 'मैं याहवे में अत्यन्त आनन्दित होऊँगा;

    मेरा प्राण मेरे परमेश्वर में उल्लसित होगा,

    क्योंकि उसने मुझे उद्धार के वस्त्र पहनाए हैं,

    और धार्मिकता का चोगा ओढ़ाया है[a]—

    उस दूल्हे के समान, जो याजकीय सिरोवस्त्र से अपना शृंगार करता है[b],

    और उस दुल्हन के समान, जो अपने आभूषणों से अपना शृंगार करती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धार्मिकता का लबादा”; צְדָקָה का अनुवाद “न्याय” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में संभवतः याजकीय सज्जा का संकेत है; इसका अर्थ यह भी हो सकता है: “उस दूल्हे के समान, जो याजक की तरह सिरोवस्त्र पहनता है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׂוֹשׂ אָשִׂישׂ
  choice: अत्यन्त आनन्दित होऊँगा
  rationale: धातु के साथ प्रयुक्त infinitive absolute आनन्द की तीव्रता बताता है; हिन्दी में स्वाभाविक रीति से इसे ‘अत्यन्त’ द्वारा व्यक्त किया गया है।
- source_word: בַּיהוָה
  choice: याहवे में
  rationale: ב यहाँ आनन्द के आधार अथवा विषय को दर्शाता है। परमेश्वर के निज नाम יהוה को लिप्यंतरित करके ‘याहवे’ रखा गया है।
- source_word: תָּגֵל נַפְשִׁי
  choice: मेरा प्राण ... उल्लसित होगा
  rationale: גיל प्रबल और उमंग-भरे हर्ष का भाव देता है; ‘उल्लसित’ पहले खंड की पुनरुक्ति से बचते हुए काव्यात्मक समानांतरता बनाए रखता है। נֶפֶשׁ को यहाँ संपूर्ण आंतरिक व्यक्ति के अर्थ में ‘प्राण’ कहा गया है।
- source_word: בֵּאלֹהַי
  choice: मेरे परमेश्वर में
  rationale: यह ב पिछले खंड के समानांतर आनन्द के विषय अथवा आधार को सूचित करता है।
- source_word: הִלְבִּישַׁנִי
  choice: उसने मुझे ... पहनाए हैं
  rationale: पूर्ण की गई क्रिया के वर्तमान परिणाम को हिन्दी के पूर्ण वर्तमान काल से व्यक्त किया गया है।
- source_word: בִּגְדֵי יֶשַׁע
  choice: उद्धार के वस्त्र
  rationale: יֶשַׁע छुटकारे अथवा उद्धार का बोध कराता है; ‘उद्धार’ धार्मिक और व्यापक अर्थ को बनाए रखता है।
- source_word: מְעִיל צְדָקָה
  choice: धार्मिकता का चोगा
  rationale: מְעִיל बाहरी, लपेटकर पहने जाने वाले वस्त्र को दर्शाता है। צְדָקָה के नैतिक, संबंधपरक और वाचा-संबंधी विस्तार को ‘धार्मिकता’ सुरक्षित रखता है।
- source_word: יְעָטָנִי
  choice: ओढ़ाया है
  rationale: क्रिया किसी वस्त्र से ढकने या लपेटने का भाव देती है; चोगे के साथ ‘ओढ़ाया’ स्वाभाविक हिन्दी है।
- source_word: יְכַהֵן פְּאֵר
  choice: याजक की तरह शोभायमान सिर-पोश पहनता है
  rationale: दुर्लभ יְכַהֵן संभवतः याजकीय सज्जा की ओर संकेत करता है और פְּאֵר अलंकृत सिर-पोश को। अनुवाद ने विवाह और याजकीय संकेत दोनों को स्पष्ट किंतु संयत रूप में रखा है।
- source_word: תַּעְדֶּה כֵלֶיהָ
  choice: अपने आभूषणों से अपना शृंगार करती है
  rationale: עדה स्वयं को सजाने और כֵלִים इस वैवाहिक प्रसंग में गहनों या अलंकारों को दर्शाता है; चुना गया वाक्यांश आधुनिक हिन्दी में सहज है।
theological_decisions:
- issue: परमेश्वर के निज नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में टेट्राग्राम יהוה स्पष्ट रूप से है। ‘याहवे’ उसके संभावित प्राचीन उच्चारण का निकट हिन्दी लिप्यंतरण है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: צְדָקָה का अर्थ
  choice: धार्मिकता
  alternative: न्याय; खरी दशा
  rationale: शब्द में न्याय का पक्ष सम्मिलित हो सकता है, पर इस दैवी वस्त्रदान के रूपक में ‘धार्मिकता’ उसके नैतिक और वाचा-संबंधी अर्थ को बिना केवल सामाजिक या न्यायिक क्षेत्र तक सीमित किए बनाए रखती है।
- issue: יְכַהֵן में याजकीय संकेत
  choice: दूल्हा याजक की तरह शोभायमान सिर-पोश पहनता है
  alternative: दूल्हा पगड़ी से अपना शृंगार करता है; दूल्हा सिर-पोश पहनकर याजक का काम करता है
  rationale: रूप दुर्लभ और कुछ हद तक अस्पष्ट है। चुना गया पाठ संभावित याजकीय शब्दालंकार को बनाए रखता है, पर यह दावा नहीं करता कि दूल्हा वास्तव में याजकीय सेवा कर रहा है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘चोगा’, ‘सिर-पोश’ और ‘आभूषण’ दृश्य वस्त्र-रूपक को बनाए रखते हैं; पंक्ति-विन्यास इब्रानी समानांतरता और तुलना की संरचना को उभारता है।
