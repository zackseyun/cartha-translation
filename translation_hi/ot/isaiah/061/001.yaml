id: ISA.61.1
reference: Isaiah 61:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ר֛וּחַ אֲדֹנָ֥/י יְהוִ֖ה עָלָ֑/י יַ֡עַן מָשַׁח֩ יְהוָ֨ה אֹתִ֜/י לְ/בַשֵּׂ֣ר עֲנָוִ֗ים שְׁלָחַ֨/נִי֙ לַ/חֲבֹ֣שׁ לְ/נִשְׁבְּרֵי לֵ֔ב לִ/קְרֹ֤א לִ/שְׁבוּיִם֙ דְּר֔וֹר וְ/לַ/אֲסוּרִ֖ים פְּקַח קֽוֹחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/001.yaml
  text: The Spirit of the Lord GOD is upon me[a], because Yahweh has anointed me to bring good news to the humble; he has sent me to bind up the brokenhearted[b], to proclaim liberty to the captives and opening of the prison to the bound.
translation:
  language: hi
  text: 'प्रभु यहोवा का आत्मा मुझ पर है,

    क्योंकि यहोवा ने मेरा अभिषेक किया है

    कि मैं दीनों[a] को शुभ समाचार सुनाऊँ।

    उसने मुझे भेजा है

    कि मैं टूटे मन वालों के घावों पर पट्टी बाँधूँ,

    बन्दियों के लिए रिहाई की घोषणा करूँ

    और बंधे हुओं के लिए कारागार खुलने[b] की घोषणा करूँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गरीबों को” अथवा “पीड़ितों को”; इब्रानी עֲנָוִים नम्र, दीन, पीड़ित या गरीब लोगों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी פְּקַח־קוֹחַ का अर्थ कठिन और अनिश्चित है; सम्भव अनुवाद हैं “आँखें खुलने” या अधिक सामान्य रूप से “बंधनों के खुलने।”
    reason: alternative_reading
lexical_decisions:
- source_word: ר֛וּחַ
  choice: आत्मा
  rationale: ईश्वरीय उपाधि के साथ और भविष्यद्वक्ता को कार्य सौंपे जाने के प्रसंग में यह परमेश्वर के आत्मा को दर्शाता है, न कि केवल हवा, श्वास या मनोभाव को।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: इस संयुक्त उपाधि में אֲדֹנָי को ‘प्रभु’ और परमेश्वर के निज नाम יהוה को ‘यहोवा’ से व्यक्त किया गया है, जिससे इब्रानी के दोनों तत्व सुरक्षित रहते हैं।
- source_word: עָלַי
  choice: मुझ पर है
  rationale: यह भविष्यद्वक्ता को सामर्थ्य और कार्य दिए जाने की भाषा को सरल तथा स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מָשַׁח
  choice: अभिषेक किया है
  rationale: यह पूर्ण हो चुके उस नियुक्ति-कर्म को व्यक्त करता है जिसका प्रभाव वर्तमान मिशन में बना हुआ है; साथ ही मूल पाठ की अभिषेक-संबंधी प्रतिध्वनि सुरक्षित रहती है।
- source_word: לְבַשֵּׂר
  choice: शुभ समाचार सुनाऊँ
  rationale: क्रिया का अर्थ अच्छा समाचार पहुँचाना या घोषित करना है; यह चयन आधुनिक हिन्दी में सहज और सामान्य पाठक के लिए स्पष्ट है।
- source_word: עֲנָוִים
  choice: दीनों
  rationale: ‘दीन’ सामाजिक कष्ट, नम्रता और असहाय दशा की परस्पर जुड़ी हुई अर्थ-छायाओं को समेट सकता है; ‘गरीबों’ जैसी अधिक संकीर्ण सम्भावना पादटिप्पणी में दी गई है।
- source_word: לַחֲבֹשׁ לְנִשְׁבְּרֵי לֵב
  choice: टूटे मनवालों के घाव बाँधूँ
  rationale: ‘घाव बाँधना’ मूल क्रिया के उपचारात्मक रूपक को बनाए रखता है और ‘टूटे मनवाले’ इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप है।
- source_word: דְּרוֹר
  choice: रिहाई
  rationale: यह बन्दी अवस्था से स्वतंत्र किए जाने की सार्वजनिक घोषणा का अर्थ स्पष्ट रूप से व्यक्त करता है।
- source_word: פְּקַח־קוֹחַ
  choice: कारागार खुलने
  rationale: यह कठिन इब्रानी पद का प्रसंगानुकूल अर्थ देता है, पर इसकी पाठगत और अर्थगत अनिश्चितता को पादटिप्पणी में स्पष्ट रूप से सुरक्षित रखा गया है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: ‘प्रभु यहोवा’ मूल में उपस्थित उपाधि और निज नाम, दोनों को अलग-अलग पहचानने देता है और ‘प्रभु प्रभु’ जैसी अस्वाभाविक पुनरुक्ति से बचाता है।
- issue: अभिषेक और सम्भावित मसीही आशय
  choice: मेरा अभिषेक किया है
  alternative: मुझे नियुक्त किया है
  rationale: मूल क्रिया का सीधा अनुवाद रखा गया है। इससे मसीही प्रतिध्वनि बनी रहती है, पर पद में बाद की धर्मवैज्ञानिक पहचान को स्पष्ट रूप से जोड़कर उसकी व्याख्या पहले से तय नहीं की जाती।
- issue: פְּקַח־קוֹחַ की कठिन अभिव्यक्ति
  choice: कारागार खुलने
  alternative: आँखें खुलने / बंधन खुलने
  rationale: मुख्य पाठ में बन्दियों और बंधे हुओं के समानांतर प्रसंग के अनुकूल अर्थ चुना गया है, जबकि वास्तविक इब्रानी अस्पष्टता को पादटिप्पणी में दबाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर काव्यात्मक भविष्यद्वाणी के अनुरूप गरिमापूर्ण रखी गई है। पंक्ति-विभाजन इब्रानी कथन की समानांतर रचना और मिशन के क्रमिक उद्देश्यों को स्पष्ट करता है। ‘दीन’, ‘शुभ समाचार’, ‘अभिषेक’, ‘रिहाई’ और ‘कारागार’ जैसे शब्द सामान्य पाठक के लिए बोधगम्य रहते हुए धार्मिक-काव्यात्मक गरिमा बनाए रखते हैं।
