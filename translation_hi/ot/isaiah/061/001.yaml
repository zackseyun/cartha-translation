  source_fidelity: 'The draft accurately represents the commissioning sequence: Yahweh''s Spirit is upon the speaker; Yahweh has anointed and sent him; good news is for the עֲנָוִים; binding up concerns the brokenhearted; and liberty is proclaimed for captives. “कारागार खुलने” is a contextually defensible rendering of the difficult פְּקַח־קוֹחַ, provided its uncertainty remains footnoted.'
