  text: לָ/שׂ֣וּם לַ/אֲבֵלֵ֣י צִיּ֗וֹן לָ/תֵת֩ לָ/הֶ֨ם פְּאֵ֜ר תַּ֣חַת אֵ֗פֶר שֶׁ֤מֶן שָׂשׂוֹן֙ תַּ֣חַת אֵ֔בֶל מַעֲטֵ֣ה תְהִלָּ֔ה תַּ֖חַת ר֣וּחַ כֵּהָ֑ה וְ/קֹרָ֤א לָ/הֶם֙ אֵילֵ֣י הַ/צֶּ֔דֶק מַטַּ֥ע יְהוָ֖ה לְ/הִתְפָּאֵֽר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/003.yaml
  text: to appoint for the mourners of Zion[a], to give them a headdress instead of ashes, oil of gladness instead of mourning, a garment of praise instead of a faint spirit; and they will be called oaks of righteousness, the planting of Yahweh[d][c][b], that he may display his glory.
translation:
  language: hi
  text: 'सिय्योन के शोक मनानेवालों के लिए यह ठहराना: उन्हें राख के बदले उत्सवी सिरपोश[a], शोक के बदले आनंद का तेल, और निस्तेज आत्मा के बदले स्तुति का वस्त्र देना; और वे धार्मिकता के बलूत वृक्ष[b][c], याहवे का रोपण कहलाएँगे, जिससे वह अपनी महिमा प्रकट करे[d]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राख के बदले शोभा।” इब्रानी शब्द פְּאֵר शोभा, अलंकरण, या उत्सव में पहना जानेवाला सिरपोश दर्शा सकता है। यहाँ संभवतः शोक के समय सिर पर डाली गई राख के स्थान पर पहने जानेवाले उत्सवी सिरपोश का बिंब है।
    reason: lexical_alternative
  - marker: b
    text: या “धार्मिकता के तारपीन-वृक्ष।” इब्रानी वृक्ष-शब्द किसी बड़े, दृढ़ वृक्ष को दर्शाता है और विशेष रूप से बलूत अथवा तारपीन-वृक्ष के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “न्याय के बलूत वृक्ष।” इब्रानी צֶדֶק प्रसंग के अनुसार धार्मिकता और न्याय दोनों को दर्शा सकता है।
    reason: alternative_reading
  - marker: d
    text: या “जिससे उसकी महिमा हो।” अंतिम इब्रानी क्रिया का अर्थ यह भी हो सकता है कि याहवे अपने लगाए हुए इन लोगों के द्वारा महिमा पाए।
    reason: alternative_reading
lexical_decisions:
- source_word: לָשׂוּם לַאֲבֵלֵי צִיּוֹן
  choice: सिय्योन के शोक मनानेवालों के लिए यह ठहराने को
  rationale: लָשׂוּם उद्देश्य और प्रबंध करने का भाव देता है। यह अनुवाद पिछले प्रसंग से जुड़े infinitive ढाँचे को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: פְּאֵר תַּחַת אֵפֶר
  choice: राख के बदले सुंदर पगड़ी
  rationale: פְּאֵר यहाँ सिर पर पहने जानेवाले शोभायमान उत्सवी अलंकरण को सूचित करता है, जो शोक में सिर पर डाली जानेवाली राख के विपरीत है। 'सुंदर पगड़ी' ठोस बिंब को सहज हिन्दी में व्यक्त करती है।
- source_word: שֶׁמֶן שָׂשׂוֹן
  choice: आनंद का तेल
  rationale: यह उत्सव और हर्ष से जुड़े अभिषेक अथवा सुगंधित तेल का बिंब है। 'आनंद' שָׂשׂוֹן का स्पष्ट और काव्यात्मक हिन्दी समतुल्य है।
- source_word: מַעֲטֵה תְהִלָּה
  choice: स्तुति का वस्त्र
  rationale: מַעֲטֶה बाहरी ओढ़ावे या वस्त्र को दर्शाता है। 'वस्त्र' रूपक और समानांतर काव्य-रचना दोनों को बनाए रखता है।
- source_word: רוּחַ כֵּהָה
  choice: बुझी हुई आत्मा
  rationale: כֵּהָה में मंद, क्षीण या निस्तेज होने का भाव है। 'बुझी हुई आत्मा' आंतरिक निस्तेजता का रूपक बचाती है और उसे केवल मनोवैज्ञानिक निराशा तक सीमित नहीं करती।
- source_word: וְקֹרָא לָהֶם
  choice: तब वे ... कहलाएँगे
  rationale: एकवचन क्रिया यहाँ अनिश्चित कर्ता के साथ निष्क्रिय अर्थ देती है। हिन्दी का निष्क्रिय प्रयोग बिना किसी अनकहे कर्ता को जोड़े परिणाम व्यक्त करता है।
- source_word: אֵילֵי הַצֶּדֶק
  choice: धार्मिकता के बाँज वृक्ष
  rationale: אֵילֵי रोपण के संदर्भ में बड़े और दृढ़ वृक्षों का बिंब है, जिसे बाँज या संभवतः तारपीन-वृक्ष समझा जा सकता है। 'बाँज वृक्ष' परिचित वृक्ष-बिंब और दृढ़ता को बनाए रखता है।
- source_word: מַטַּע יְהוָה
  choice: याहवे का लगाया हुआ पौधा
  rationale: מַטַּע किसी लगाए हुए पौधे या रोपण को दर्शाता है। यह रूप इस बात को स्पष्ट रखता है कि स्थापित करनेवाला याहवे है।
- source_word: לְהִתְפָּאֵר
  choice: जिससे वह अपनी महिमा प्रकट करे
  rationale: हिथ्पाएल रूप महिमामय दिखाई देने, अपनी शोभा प्रकट करने, अथवा महिमा पाने का अर्थ दे सकता है। चुना हुआ रूप याहवे के रोपण में उसकी महिमा के प्रदर्शन का उद्देश्य व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला विशिष्ट वाचा-नाम है। उसका लिप्यंतरण सामान्य उपाधि से बदलने के बजाय नाम को स्पष्ट रखता है।
- issue: צֶדֶק का अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: पुनर्स्थापित लोगों के गुणसूचक वृक्ष-बिंब में नैतिक और वाचागत 'धार्मिकता' उपयुक्त है, पर शब्द में सामाजिक 'न्याय' का वास्तविक अर्थ भी संभव है और उसे पाद-टिप्पणी में रखा गया है।
- issue: לְהִתְפָּאֵר में महिमा का संबंध
  choice: जिससे वह अपनी महिमा प्रकट करे
  alternative: जिससे उसकी महिमा हो
  rationale: अंतिम क्रिया याहवे के अपने रोपण द्वारा महिमामय प्रकट होने और उसके महिमा पाने—दोनों तरह समझी जा सकती है। मुख्य पाठ पहला भाव रखता है और दूसरा पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और काव्यात्मक रखी गई है। 'बदले' की तीन बार आती संरचना मूल के समानांतर विनिमय-बिंब को स्पष्ट करती है। 'बुझी हुई आत्मा' मूल की मंदता का रूपक बनाए रखती है; 'सुंदर पगड़ी', 'आनंद का तेल' और 'स्तुति का वस्त्र' शोक से उत्सव की ओर परिवर्तन को ठोस चित्रों में व्यक्त करते हैं।
