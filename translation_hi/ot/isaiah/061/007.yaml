source:
  edition: WLC
  text: תַּ֤חַת בָּשְׁתְּ/כֶם֙ מִשְׁנֶ֔ה וּ/כְלִמָּ֖ה יָרֹ֣נּוּ חֶלְקָ֑/ם לָ/כֵ֤ן בְּ/אַרְצָ/ם֙ מִשְׁנֶ֣ה יִירָ֔שׁוּ שִׂמְחַ֥ת עוֹלָ֖ם תִּֽהְיֶ֥ה לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/007.yaml
  text: Instead of your shame[a], there will be a double portion; and instead of disgrace, they will shout for joy over their portion. Therefore in their land they will possess a double portion[c][b]; everlasting joy will be theirs.
translation:
  language: hi
  text: तुम्हारी लज्जा के बदले दुगना भाग होगा[a]; और अपमान के बदले वे अपने भाग पर जयजयकार करेंगे[b]। इसलिए अपनी भूमि में वे दुगना भाग पाएँगे[c]; सदा का आनन्द उनका होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू पाठ ‘तुम्हारी लज्जा’ से आगे ‘उनका भाग/उनकी भूमि/वे पाएँगे’ की ओर बदलता है। पठनीयता के लिए अनेक अनुवाद पूरे वाक्य में ‘तुम/तुम्हारा’ रखते हैं।
    reason: alternative_reading
  - marker: b
    text: या, “वे अपने भाग पर आनन्द से गाएँगे।”
    reason: lexical_alternative
  - marker: c
    text: या, “वे दुगना भाग विरासत में पाएँगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: के बदले
  rationale: यहाँ पूर्वसर्ग स्थान नहीं, बल्कि दशा के उलटने और प्रतिफल मिलने का भाव व्यक्त करता है।
- source_word: בָּשְׁתְּכֶם
  choice: तुम्हारी लज्जा
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय को बनाए रखता है और मान-अपमान की पृष्ठभूमि में मूल संज्ञा का सीधा अर्थ देता है।
- source_word: מִשְׁנֶה
  choice: दुगना भाग
  rationale: यह केवल ‘दुगना’ नहीं, बल्कि हिस्से या विरासत की दुगनी मात्रा का संकेत देता है।
- source_word: וּכְלִמָּה
  choice: और अपमान के बदले
  rationale: כְּלִמָּה सार्वजनिक तिरस्कार या अपमान का भाव रखता है; इससे पहले प्रयुक्त ‘लज्जा’ से अर्थगत भेद भी बना रहता है।
- source_word: יָרֹנּוּ
  choice: वे जयजयकार करेंगे
  rationale: רנן ऊँचे स्वर में उल्लास प्रकट करने का बोध देता है; ‘जयजयकार करेंगे’ इसकी मुखरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֶלְקָם
  choice: अपने भाग के कारण
  rationale: חֵלֶק का अर्थ हिस्सा या भाग है। साथ का בְּ कारण, विषय अथवा क्षेत्र का भाव दे सकता है; यहाँ ‘के कारण’ सुसंगत है, जबकि ‘अपने भाग पर’ भी संभव है।
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पूर्ववर्ती उलटाव से निकलने वाले परिणाम को स्पष्ट करता है।
- source_word: בְּאַרְצָם
  choice: अपने देश में
  rationale: אֶרֶץ पुनर्स्थापना के संदर्भ में उनकी अपनी भूमि को दर्शाता है; ‘देश’ आधुनिक हिन्दी में स्वाभाविक है और स्वामित्व का भाव बनाए रखता है।
- source_word: יִירָשׁוּ
  choice: वे पाएँगे
  rationale: ירשׁ का अर्थ अधिकार पाना, अपने अधिकार में लेना या विरासत में पाना हो सकता है। ‘पाएँगे’ सहज है, और वैकल्पिक विरासत-अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: שִׂמְחַת עוֹלָם
  choice: सदा का आनन्द
  rationale: यह स्थायी, चिरकालिक आनन्द को गरिमापूर्ण और सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: תִּהְיֶה לָהֶם
  choice: उनका होगा
  rationale: हिब्रू के अस्तित्व-सहित-अधिकार वाले वाक्यांश को स्वाभाविक हिन्दी में अधिकारसूचक रूप देता है।
theological_decisions:
- issue: द्वितीय पुरुष ‘तुम्हारी लज्जा’ से तृतीय पुरुष बहुवचन ‘वे/अपने/उनका’ की ओर सर्वनाम-परिवर्तन
  choice: मसोरेटिक पाठ में उपस्थित सर्वनाम-परिवर्तन को अनुवाद में बनाए रखा गया।
  alternative: 'पठनीयता के लिए पूरे पद को द्वितीय पुरुष में समरूप करना: ‘तुम... अपने भाग... अपने देश... पाओगे।’'
  rationale: मूल पाठ में व्यक्ति का वास्तविक परिवर्तन है। उसे बनाए रखना पाठ-साक्ष्य के प्रति पारदर्शिता रखता है और संभावित अर्थगत तनाव को चुपचाप समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘लज्जा/अपमान’ समानार्थी होते हुए भी हिब्रू के दो अलग शब्दों का हल्का भेद बनाए रखते हैं। मुख्य पाठ में मूल का सर्वनाम-परिवर्तन सुरक्षित है; सभी पादटिप्पणी-चिह्न पाठ में उपस्थित हैं।
