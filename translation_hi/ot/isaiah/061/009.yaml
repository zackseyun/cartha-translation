- from: उनका वंश जाति-जाति के लोगों के बीच प्रसिद्ध होगा, और उनकी संतानें देश-देश के लोगों के बीच; जो कोई उन्हें देखेगा, वह पहचान लेगा कि वे ऐसा वंश हैं जिसे यहोवा ने आशीष दी है।
  to: उनका वंश राष्ट्रों के बीच जाना जाएगा[a], और उनके वंशज लोगों के बीच; उन्हें देखने वाले सभी लोग उन्हें ऐसे वंश के रूप में पहचानेंगे, जिस पर याहवे की आशीष है[b]।
