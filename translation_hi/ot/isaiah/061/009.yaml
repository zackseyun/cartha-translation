  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נוֹדַ֤ע בַּ/גּוֹיִם֙ זַרְעָ֔/ם וְ/צֶאֱצָאֵי/הֶ֖ם בְּ/ת֣וֹךְ הָ/עַמִּ֑ים כָּל רֹֽאֵי/הֶם֙ יַכִּיר֔וּ/ם כִּ֛י הֵ֥ם זֶ֖רַע בֵּרַ֥ךְ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/009.yaml
  text: Their offspring will be known among the nations[a], and their descendants in the midst of the peoples[b]; all who see them will recognize that they are offspring blessed by Yahweh.
translation:
  language: hi
  text: उनका वंश राष्ट्रों के बीच जाना जाएगा[a], और उनके वंशज लोगों के बीच; उन्हें देखने वाले सभी लोग उन्हें ऐसे वंश के रूप में पहचानेंगे, जिस पर याहवे की आशीष है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गैर-यहूदी जातियों के बीच।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में पहले और अंतिम स्थान पर एक ही शब्द “बीज/वंश” है; यहाँ स्वाभाविक हिन्दी के लिए “वंश” किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנוֹדַע
  choice: प्रसिद्ध होगा
  rationale: निफ़अल रूप का अर्थ यहाँ ‘जाना-पहचाना होगा’ है। ‘प्रसिद्ध होगा’ स्वाभाविक हिन्दी में उनकी सार्वजनिक पहचान को व्यक्त करता है, बिना किसी मानवीय कर्ता को जोड़ने के।
- source_word: בַּגּוֹיִם
  choice: जाति-जाति के लोगों के बीच
  rationale: גּוֹיִם व्यापक अर्थ में अनेक राष्ट्रों या जातियों को दर्शाता है। यह रूप आधुनिक पाठक के लिए स्वाभाविक है और अनावश्यक रूप से ‘गैर-यहूदी’ अर्थ तक सीमित नहीं करता।
- source_word: זַרְעָם
  choice: उनका वंश
  rationale: זֶרַע सामूहिक अर्थ में वंश या संतान को दर्शाता है। ‘वंश’ हिन्दी में सामूहिक और पीढ़ीगत भाव सुरक्षित रखता है।
- source_word: וְצֶאֱצָאֵיהֶם
  choice: उनकी संतानें
  rationale: यह निकटार्थी समानांतर पद है। ‘संतानें’ पहले पद के ‘वंश’ से काव्यात्मक समानता रखते हुए शब्दगत भिन्नता भी बनाए रखता है।
- source_word: בְּתוֹךְ הָעַמִּים
  choice: देश-देश के लोगों के बीच
  rationale: בְּתוֹךְ का भाव ‘बीच में’ है और עַמִּים अनेक जनसमूहों को दर्शाता है। हिन्दी अभिव्यक्ति पहले अर्धपद के समानांतर अंतरराष्ट्रीय विस्तार को सहज रूप में रखती है।
- source_word: כָּל רֹאֵיהֶם
  choice: जो कोई उन्हें देखेगा
  rationale: इब्रानी कृदन्तीय रचना को स्वाभाविक हिन्दी सम्बन्धवाचक वाक्य में व्यक्त किया गया है।
- source_word: יַכִּירוּם
  choice: वह पहचान लेगा
  rationale: हिफ़ईल נכר का यहाँ अर्थ पहचानना है। हिन्दी में एकवचन ‘जो कोई…वह’ सामूहिक ‘सब देखने वालों’ का स्वाभाविक समतुल्य है।
- source_word: כִּי
  choice: कि
  rationale: यह उस बात की विषय-वस्तु आरम्भ करता है जिसे देखने वाले पहचानते हैं।
- source_word: זֶרַע
  choice: वंश
  rationale: पहले זֶרַע के साथ शब्दगत संबंध बनाए रखने के लिए फिर ‘वंश’ रखा गया है।
- source_word: בֵּרַךְ
  choice: जिसे … ने आशीष दी है
  rationale: संक्षिप्त इब्रानी अभिव्यक्ति का अर्थ हिन्दी में सम्बन्धवाचक उपवाक्य द्वारा स्पष्ट और स्वाभाविक ढंग से व्यक्त होता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: वाचा-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण है और नाम को ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
- issue: आशीष पाए वंश की पहचान
  choice: वे ऐसा वंश हैं जिसे यहोवा ने आशीष दी है
  alternative: वे यहोवा के आशीष पाए हुए वंश हैं
  rationale: सम्बन्धवाचक रचना परमेश्वर की आशीष को स्पष्ट करती है, जबकि यह दावा नहीं जोड़ती कि देखने वाले उस वंश के विषय में इससे अधिक क्या निष्कर्ष निकालते हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। समानांतरता बनाए रखने हेतु ‘वंश/संतानें’ और ‘जाति-जाति/देश-देश के लोग’ का प्रयोग किया गया है।
