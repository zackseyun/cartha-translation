source:
  edition: WLC
  text: לִ/קְרֹ֤א שְׁנַת רָצוֹן֙ לַֽ/יהוָ֔ה וְ/י֥וֹם נָקָ֖ם לֵ/אלֹהֵ֑י/נוּ לְ/נַחֵ֖ם כָּל אֲבֵלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/002.yaml
  text: to proclaim the year of Yahweh’s favor and the day of vengeance of our God[a], to comfort all who mourn[b],
translation:
  language: hi
  text: याहवे के अनुग्रह का वर्ष[a] और हमारे परमेश्वर के प्रतिशोध का दिन घोषित करने, और सभी शोक करने वालों को सांत्वना देने के लिए,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे की स्वीकृति का वर्ष।”
    reason: רָצוֹן में अनुग्रह के साथ स्वीकृति अथवा ग्रहणयोग्यता का भाव भी हो सकता है।
lexical_decisions:
- source_word: לִקְרֹא
  choice: घोषणा करने
  rationale: यहाँ קרא सार्वजनिक रूप से संदेश सुनाने के अर्थ में है; इसलिए सामान्य ‘बुलाने’ के बजाय ‘घोषणा करने’ से अभिप्राय अधिक स्पष्ट होता है।
- source_word: שְׁנַת רָצוֹן
  choice: अनुग्रह का वर्ष
  rationale: רָצוֹן यहाँ परमेश्वर की प्रसन्नता, स्वीकृति और कृपापूर्ण पक्ष को व्यक्त करता है। ‘अनुग्रह’ आधुनिक धार्मिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: לַיהוָה
  choice: याहवे के
  rationale: ל संबंध को सूचित करता है—यह याहवे के अनुग्रह से चिह्नित वर्ष है। יהוה को उसके covenantal नाम ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: וְיוֹם נָקָם
  choice: और ... प्रतिशोध का दिन
  rationale: נָקָם दैवी दंडात्मक प्रतिफल को व्यक्त करता है। ‘प्रतिशोध’ इस पद की गंभीरता को बनाए रखता है और इसे केवल सामान्य न्याय तक सीमित नहीं करता।
- source_word: לֵאלֹהֵינוּ
  choice: हमारे परमेश्वर के
  rationale: प्रत्यय ‘हमारे’ के वाचाई-संबंधपरक भाव को बनाए रखता है, और ל को स्वाभाविक हिन्दी संबंधकारक से व्यक्त किया गया है।
- source_word: לְנַחֵם
  choice: सांत्वना देने के लिए
  rationale: נחם का प्रसंगानुकूल अर्थ दुखियों को ढाढ़स और राहत देना है; ‘सांत्वना देना’ आधुनिक, सहज और गरिमापूर्ण अभिव्यक्ति है।
- source_word: כָּל אֲבֵלִים
  choice: शोक करने वाले सभी लोगों
  rationale: इब्रानी बहुवचन रूप को लैंगिक रूप से सामान्य अर्थ में लिया गया है। यह अनुवाद किसी एक लिंग तक अर्थ सीमित किए बिना स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम יהוה है। ‘याहवे’ उसे उपाधि में बदलने के बजाय covenantal नाम के रूप में सुरक्षित रखता है।
- issue: अनुग्रह और प्रतिशोध के बीच तनाव
  choice: ‘अनुग्रह के वर्ष’ और ‘प्रतिशोध के दिन’—दोनों को समान स्पष्टता से बनाए रखना
  alternative: प्रतिशोध को नरम करके केवल ‘न्याय’ कहना या उसे गौण करना
  rationale: मूल पद दैवी अनुग्रह और दैवी प्रतिफल को साथ रखता है। अनुवाद इस धर्मवैचारिक तनाव को बिना नरम किए अथवा समझाकर समाप्त किए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है, किंतु भविष्यद्वाणी की गरिमा और काव्यात्मक समानांतरता बनाए रखी गई है। पद वाक्यांश के रूप में पिछले पद से जुड़ता है, इसलिए अंत में अल्पविराम रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित हैं।
