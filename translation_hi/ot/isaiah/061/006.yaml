source:
  edition: WLC
  text: וְ/אַתֶּ֗ם כֹּהֲנֵ֤י יְהוָה֙ תִּקָּרֵ֔אוּ מְשָׁרְתֵ֣י אֱלֹהֵ֔י/נוּ יֵאָמֵ֖ר לָ/כֶ֑ם חֵ֤יל גּוֹיִם֙ תֹּאכֵ֔לוּ וּ/בִ/כְבוֹדָ֖/ם תִּתְיַמָּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/006.yaml
  text: But you will be called the priests of Yahweh; they will say of you, "Ministers of our God." You will eat the wealth of nations[a], and in their glory you will boast.
translation:
  language: hi
  text: पर तुम याहवे के याजक कहलाओगे; तुम्हें “हमारे परमेश्वर के सेवक” कहा जाएगा। तुम राष्ट्रों की सम्पत्ति खाओगे, और उनके वैभव में गर्व करोगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके वैभव में आनन्दित होगे।” अन्तिम क्रिया दुर्लभ है और उसके सटीक भाव पर मतभेद है; मुख्य पाठ में उसका सामान्य अर्थ “गर्व करना” लिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּהֲנֵי יְהוָה
  choice: याहवे के याजक
  rationale: सम्बन्धवाचक रचना और याजकीय पदवी को सीधे बनाए रखता है; परमेश्वर के व्यक्तिगत नाम को ‘याहवे’ के रूप में प्रस्तुत किया गया है।
- source_word: מְשָׁרְתֵי אֱלֹהֵינוּ
  choice: हमारे परमेश्वर के सेवक
  rationale: यह पद औपचारिक अथवा उपासना-संबंधी सेवा करनेवालों को दर्शाता है। ‘सेवक’ आधुनिक हिन्दी में स्वाभाविक है और बाद के किसी विशिष्ट कलीसियाई पद का अर्थ नहीं थोपता।
- source_word: יֵאָמֵר לָכֶם
  choice: तुम्हें … कहा जाएगा
  rationale: इब्रानी के अवैयक्तिक कथन को स्वाभाविक हिन्दी कर्मवाच्य में व्यक्त करता है और पिछले ‘कहलाओगे’ के साथ समानांतरता बनाए रखता है।
- source_word: חֵיל גּוֹיִם
  choice: राष्ट्रों की सम्पत्ति
  rationale: חֵיל का अर्थ सामर्थ्य, साधन या धन-सम्पत्ति हो सकता है; ‘खाओगे’ के साथ इस प्रसंग में राष्ट्रों की भौतिक समृद्धि प्रमुख अर्थ है।
- source_word: תֹּאכֵלוּ
  choice: खाओगे
  rationale: मूल के ठोस रूपक को बनाए रखा गया है; भाव राष्ट्रों की सम्पत्ति का उपभोग करने का है।
- source_word: וּבִכְבוֹדָם
  choice: उनके वैभव पर
  rationale: כָּבוֹד के महिमा, सम्मान और वैभव जैसे अर्थों में यहाँ ‘वैभव’ राष्ट्रों की सम्पत्ति और प्रतिष्ठा—दोनों से स्वाभाविक रूप से जुड़ता है।
- source_word: תִּתְיַמָּרוּ
  choice: गर्व करोगे
  rationale: यह दुर्लभ और विवादित क्रिया है; सन्दर्भ में ‘गर्व करना/महिमा करना’ एक प्रचलित समझ है, जबकि दूसरी सम्भावना पाद-टिप्पणी में रखी गई है।
theological_decisions:
- issue: क्या इस्राएल की याजकीय भूमिका को बाद की किसी कलीसियाई श्रेणी में आध्यात्मिक बना दिया जाए
  choice: प्रत्यक्ष भविष्यसूचक सम्बोधन और ‘याजक’ तथा ‘सेवक’ की उपासना-संबंधी भाषा को बनाए रखना
  alternative: इसे केवल सामान्य आध्यात्मिक सेवा के कथन के रूप में पुनर्लेखित करना
  rationale: इब्रानी पाठ स्पष्ट रूप से याजकीय और उपासना-संबंधी पदों का प्रयोग करता है; अनुवाद उस बिम्ब को न तो मिटाता है, न किसी बाद की सम्प्रदायगत पहचान में सीमित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सम्पत्ति खाओगे’ जानबूझकर कुछ असामान्य है, क्योंकि यह मूल इब्रानी के सजीव रूपक को सुरक्षित रखता है।
