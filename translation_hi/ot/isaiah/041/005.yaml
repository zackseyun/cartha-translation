source:
  edition: WLC
  text: רָא֤וּ אִיִּים֙ וְ/יִירָ֔אוּ קְצ֥וֹת הָ/אָ֖רֶץ יֶחֱרָ֑דוּ קָרְב֖וּ וַ/יֶּאֱתָיֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/005.yaml
  text: The coastlands have seen and fear[a]; the ends of the earth tremble[b]. They draw near and come.
translation:
  language: hi
  text: 'तटवर्ती देशों[a] ने देखा और वे डर गए;

    पृथ्वी के छोर काँप उठे।

    वे पास आए और आ पहुँचे।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “द्वीपों” अथवा “दूरस्थ समुद्री प्रदेशों।”
    reason: lexical_alternative
  - marker: b
    text: 'अन्त की दोनों हिब्रू क्रियाएँ निकटार्थक हैं और आगे बढ़कर आने पर बल देती हैं: “वे पास आए और आ पहुँचे।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּ
  choice: ने देखा
  rationale: हिब्रू पूर्ण क्रिया को साधारण भूतकाल में रखा गया है; इससे देखे जाने के बाद उत्पन्न भय का क्रम स्वाभाविक हिन्दी में स्पष्ट रहता है।
- source_word: אִיִּים
  choice: तटवर्ती देशों
  rationale: यशायाह में यह शब्द केवल वास्तविक द्वीपों तक सीमित न होकर दूरस्थ समुद्री या तटीय भूभागों और वहाँ के लोगों को भी सूचित कर सकता है।
- source_word: וְיִירָאוּ
  choice: और वे डर गए
  rationale: यहाँ ירא का अर्थ श्रद्धापूर्ण उपासना के बजाय देखी हुई घटना के कारण भयभीत होना है।
- source_word: קְצוֹת הָאָרֶץ
  choice: पृथ्वी के छोर
  rationale: यह दूर-दराज़ के क्षेत्रों के लिए प्रयुक्त हिब्रू मुहावरे का संक्षिप्त और परिचित हिन्दी रूप है।
- source_word: יֶחֱרָדוּ
  choice: काँप उठे
  rationale: חרד भय या घबराहट से काँपने को व्यक्त करता है; ‘काँप उठे’ शारीरिक और भावनात्मक दोनों प्रभावों को बनाए रखता है।
- source_word: קָרְבוּ
  choice: वे पास आए
  rationale: क्रिया किसी स्थान की ओर निकट आने की गति बताती है।
- source_word: וַיֶּאֱתָיוּן
  choice: और आ पहुँचे
  rationale: काव्यात्मक क्रिया אתה/אתי का अर्थ ‘आना’ है। ‘पास आए और आ पहुँचे’ मूल की निकटार्थक क्रियाओं और उनकी गतिशीलता को बनाए रखता है।
theological_decisions:
- issue: दूरस्थ जातियों की प्रतिक्रिया का स्वरूप
  choice: उनकी प्रतिक्रिया को भय और काँपने के रूप में प्रस्तुत किया गया है, जबकि उनके पास आने का उद्देश्य अनिर्णीत रखा गया है।
  alternative: इसे श्रद्धापूर्ण विस्मय, पश्चात्ताप, समर्पण या शत्रुतापूर्ण एकजुटता के रूप में स्पष्ट करना।
  rationale: पद भय और काँपने को स्पष्ट करता है, पर यह नहीं बताता कि पास आना समर्पण के लिए है या आगामी मूर्ति-निर्माण के प्रसंग से जुड़ी भयभीत तैयारी है। अनुवाद इस तनाव को नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। काव्यात्मक समानांतरता के लिए पंक्ति-विन्यास रखा गया है; अंतिम दो क्रियाओं की जानबूझकर की गई पुनरुक्ति को मिटाया नहीं गया।
