source:
  edition: WLC
  text: קָרְב֥וּ רִֽיבְ/כֶ֖ם יֹאמַ֣ר יְהוָ֑ה הַגִּ֨ישׁוּ֙ עֲצֻמ֣וֹתֵי/כֶ֔ם יֹאמַ֖ר מֶ֥לֶךְ יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/021.yaml
  text: Present your case,” says Yahweh[c][b][a]; “bring forward your strong arguments,” says the King of Jacob.
translation:
  language: hi
  text: “अपना मुक़दमा पेश करो,” याहवे[a] कहता है; “अपनी ज़ोरदार दलीलें सामने लाओ,” याकूब का राजा कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू: YHWH; परंपरागत रूप से ‘प्रभु’ अनुवाद किया जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: קָרְבוּ רִיבְכֶם
  choice: अपना मुक़दमा पेश करो
  rationale: शाब्दिक रूप से ‘अपने विवाद/मुक़दमे को निकट लाओ’; यहाँ न्यायालयीन चुनौती है, इसलिए यह स्वाभाविक हिन्दी अभिव्यक्ति आदेश और विधिक संदर्भ दोनों को स्पष्ट करती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिब्रू चतुरक्षरीय परमेश्वर-नाम YHWH को हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: הַגִּישׁוּ
  choice: सामने लाओ
  rationale: हिफ़ील आज्ञार्थक का अर्थ ‘निकट लाओ/पेश करो’ है; न्यायालयीन प्रसंग में ‘सामने लाओ’ स्वाभाविक और सजीव है।
- source_word: עֲצֻמוֹתֵיכֶם
  choice: अपनी ज़ोरदार दलीलें
  rationale: इस दुर्लभ पद का आशय यहाँ समर्थ कारणों, प्रमाणों या प्रतिरक्षाओं से हो सकता है। ‘ज़ोरदार दलीलें’ उसकी शक्ति-सूचक छाया और न्यायालयीन अर्थ दोनों बनाए रखता है।
- source_word: מֶלֶךְ יַעֲקֹב
  choice: याकूब का राजा
  rationale: हिब्रू संबंध-वाक्यांश का सीधा रूप सुरक्षित रखते हुए याकूब पर शासन करने वाले राजा की वाचा-संबंधी पहचान व्यक्त की गई है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत परमेश्वर-नाम है। हिन्दी पाठकों में स्थापित नाम-रूप ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से बदलने से बचाता है; वैकल्पिक लिप्यंतरण पादटिप्पणी में दिया गया है।
- issue: ईश्वरीय चुनौती की न्यायालयीन उपमा
  choice: मुक़दमा और दलीलों की न्यायालयीन भाषा
  alternative: 'अधिक शाब्दिक स्थान-सूचक भाषा: ‘अपने विवाद को निकट लाओ’'
  rationale: קרב और נגשׁ के स्थान-सूचक अर्थ इस प्रसंग में विधिक समन और पक्ष प्रस्तुत करने का मुहावरा बनाते हैं। स्पष्ट हिन्दी न्यायालयीन भाषा मूल का आशय खोलती है, पर दलीलों की प्रकृति को अनावश्यक रूप से निश्चित नहीं करती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘मुक़दमा’, ‘पेश करो’ और ‘दलीलें’ न्यायालयीन दृश्य को स्वाभाविक बनाते हैं; ‘ज़ोरदार’ עֲצֻמוֹתֵיכֶם की सामर्थ्य-सूचक छाया बनाए रखता है।
