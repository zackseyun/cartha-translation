id: ISA.41.4
reference: Isaiah 41:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִֽי פָעַ֣ל וְ/עָשָׂ֔ה קֹרֵ֥א הַ/דֹּר֖וֹת מֵ/רֹ֑אשׁ אֲנִ֤י יְהוָה֙ רִאשׁ֔וֹן וְ/אֶת אַחֲרֹנִ֖ים אֲנִי הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/004.yaml
  text: Who has acted and done this[a], calling the generations from the beginning? I, Yahweh, am the first, and with the last ones—I am he.
translation:
  language: hi
  text: किसने यह काम किया और पूरा किया, आरम्भ से पीढ़ियों को बुलाते हुए? मैं, याहवे, प्रथम हूँ; और अन्तिम लोगों के साथ भी मैं वही हूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू वाक्यांश संक्षिप्त और कठिन है; इसका अनुवाद ‘और बाद में आने वालों के साथ मैं वही हूँ’ अथवा ‘अन्त तक मैं वही हूँ’ भी किया जा सकता है।
    reason: मूल के וְאֶת אַחֲרֹנִים की वास्तविक व्याकरणिक और अर्थगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: מִי
  choice: किसने
  rationale: यह आलंकारिक प्रश्न आरम्भ करने वाला प्रश्नवाचक सर्वनाम है; सकर्मक क्रियाओं के कारण हिन्दी में ‘किसने’ स्वाभाविक है।
- source_word: פָעַל וְעָשָׂה
  choice: यह काम किया और पूरा किया
  rationale: दोनों क्रियाओं को रखते हुए प्रभावी और सिद्ध किए गए कार्य का भाव व्यक्त किया गया है। ‘यह’ निकटवर्ती ऐतिहासिक घटनाओं की ओर संकेत करने के लिए प्रसंगानुसार जोड़ा गया है।
- source_word: קֹרֵא
  choice: बुलाते हुए
  rationale: हिब्रू कृदन्त को बनाए रखता है और पीढ़ियों को इतिहास में बुलाने की निरन्तर अथवा विशिष्ट क्रिया व्यक्त करता है।
- source_word: הַדֹּרוֹת
  choice: पीढ़ियों
  rationale: यह דּוֹרוֹת का सीधा और आधुनिक हिन्दी में स्वाभाविक अर्थ है।
- source_word: מֵרֹאשׁ
  choice: आरम्भ से
  rationale: यहाँ मुख्यतः कालगत अर्थ है—इतिहास के आरम्भ से।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू ईश्वरीय नाम का देवनागरी लिप्यन्तरण किया गया है, किसी उपाधि से उसका स्थानापन्न नहीं किया गया।
- source_word: רִאשׁוֹן
  choice: प्रथम
  rationale: यह विधेय विशेषण परमेश्वर की प्राथमिकता और सबसे पहले होने को व्यक्त करता है।
- source_word: וְאֶת אַחֲרֹנִים
  choice: और अन्तिम लोगों के साथ भी
  rationale: कठिन और संक्षिप्त हिब्रू रचना में אֵת को ‘साथ’ के अर्थ में तथा बहुवचन אַחֲרֹנִים को ‘अन्तिम लोगों’ के रूप में रखा गया है। ‘भी’ हिन्दी में आरम्भ से अन्त तक निरन्तरता स्पष्ट करता है।
- source_word: אֲנִי הוּא
  choice: मैं वही हूँ
  rationale: यह संक्षिप्त आत्म-पहचान सूत्र परमेश्वर की निरन्तर एक ही पहचान को व्यक्त करता है और हिन्दी में धार्मिक गरिमा बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है; इसलिए उसे उपाधि में बदलने के बजाय हिन्दी में लिप्यन्तरित किया गया है।
- issue: וְאֶת אַחֲרֹנִים में परमेश्वर और ‘अन्तिम लोगों’ का सम्बन्ध
  choice: अन्तिम लोगों के साथ भी मैं वही हूँ
  alternative: अन्त तक मैं वही हूँ / और अन्तिम के साथ मैं वही हूँ
  rationale: हिब्रू वाक्यांश संक्षिप्त और व्याख्यात्मक रूप से कठिन है। मुख्य पाठ אֵת के ‘साथ’ वाले अर्थ और אַחֲרֹנִים के बहुवचन को सुरक्षित रखता है, बिना परमेश्वर को स्वयं ‘अन्तिम’ कहकर अस्पष्टता मिटाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘प्रथम’ और ‘मैं वही हूँ’ मूल की संक्षिप्त धार्मिक गम्भीरता रखते हैं; कठिन अन्तिम पदबंध को मुख्य पाठ में निकट रूप से अनूदित कर पादटिप्पणी में वैकल्पिक अर्थ दिए गए हैं।
