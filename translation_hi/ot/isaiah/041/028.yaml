base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/028.yaml
  text: And I looked[a], but there was no man; among these there was no counselor, that I might ask them[b] and they would answer a word.
translation:
  language: hi
  text: मैंने देखा[a], पर कोई मनुष्य नहीं था; इनमें कोई सलाहकार नहीं था कि मैं उनसे पूछूँ और वे कोई उत्तर दें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने निरीक्षण किया।” हिब्रू क्रिया देखने या निरीक्षण करने का भाव रखती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वे एक बात का उत्तर दें।” यहाँ अर्थ है, “वे कुछ उत्तर दें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵרֶא
  choice: मैंने देखा
  rationale: ראה का क़ाल अपूर्ण प्रथम पुरुष एकवचन यहाँ भविष्यद्वाणी के वर्णन में भूतकालीन निरीक्षण व्यक्त करता है। ‘मैंने देखा’ स्वाभाविक हिन्दी है और देखने/परखने की क्रिया को बनाए रखता है।
- source_word: וְאֵין אִישׁ
  choice: पर कोई मनुष्य नहीं था
  rationale: אִישׁ का मूल अर्थ ‘मनुष्य/पुरुष’ है, पर इस निषेधात्मक वाक्य में वह प्रतिनिधिक रूप से किसी भी व्यक्ति के न होने को बताता है। ‘कोई मनुष्य’ मूल की मानव-संज्ञा बनाए रखता है।
- source_word: וּמֵאֵלֶּה
  choice: इनमें
  rationale: מִן यहाँ अंशवाचक है—‘इनमें से/इनके बीच’। संक्षिप्त ‘इनमें’ इस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और संदर्भित समूह को अनिर्दिष्ट रहने देता है।
- source_word: וְאֵין יוֹעֵץ
  choice: कोई सलाहकार नहीं था
  rationale: יוֹעֵץ, יעץ का कृदन्त-संज्ञात्मक प्रयोग है और सलाह देने वाले को दर्शाता है। ‘सलाहकार’ संक्षिप्त और वर्तमान मानक हिन्दी में स्पष्ट है।
- source_word: וְאֶשְׁאָלֵם
  choice: जिससे मैं उनसे पूछता
  rationale: 'वाव-सहित अपूर्ण रूप इस प्रसंग में संभावित अथवा अभिप्रेत क्रिया व्यक्त कर सकता है: ऐसा कोई सलाहकार नहीं था जिससे प्रश्न किया जा सके। यह चयन इसे निश्चित भूतकाल ‘मैंने पूछा’ नहीं बनाता।'
- source_word: וְיָשִׁיבוּ דָבָר
  choice: और वे कोई उत्तर देते
  rationale: השיב यहाँ ‘उत्तर देना’ है। דָבָר का शाब्दिक अर्थ ‘बात/वचन’ है, पर निषेध और प्रश्नोत्तर के प्रसंग में ‘कोई उत्तर’ स्वाभाविक रूप से उसके आशय को व्यक्त करता है।
theological_decisions:
- issue: ‘इनमें’ और अनुपस्थित सलाहकार का संदर्भ
  choice: मुख्य पाठ में संदर्भ को केवल ‘इनमें’ कहकर खुला रखा गया है; निकट प्रसंग में यह मूर्तियों और उनसे जुड़े दावेदारों की ओर संकेत करता है।
  alternative: यह व्यापक रूप से राष्ट्रों या उनके देवताओं की ओर संकेत कर सकता है।
  rationale: यशायाह 41:21–29 में मूर्तियों को घटनाएँ घोषित और स्पष्ट करने की न्यायालयीय चुनौती दी गई है, फिर भी पद स्वयं संज्ञा को दोहराता नहीं; इसलिए अनुवाद उससे अधिक विशिष्ट नहीं होता।
- issue: אִישׁ का अनुवाद
  choice: कोई मनुष्य
  alternative: कोई भी / कोई व्यक्ति
  rationale: हिब्रू में पुल्लिंग एकवचन संज्ञा है, जो यहाँ प्रतिनिधिक ढंग से प्रयुक्त हुई है। ‘मनुष्य’ मूल रूप को दिखाते हुए हिन्दी में व्यापक मानवीय अर्थ भी रखता है।
- issue: अंतिम क्रियाओं का काल और भाव
  choice: 'संभावना/अभिप्राय: ‘जिससे मैं उनसे पूछता और वे ... देते’'
  alternative: 'निश्चित भूतकाल: ‘जब मैंने उनसे पूछा, तो उन्होंने ... दिया’'
  rationale: अपूर्ण क्रियाएँ इस संदर्भ में उस अनुपस्थित व्यक्ति के होने पर संभावित प्रश्न और उत्तर को दिखाती हैं; उन्हें घटित भूतकाल बनाना अर्थ को अनावश्यक रूप से निश्चित करेगा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। अर्धविराम मूल पद की दो समानांतर अनुपस्थिति-वाचक धाराओं को अलग करता है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न [a] और [b] दिए गए हैं।
