source:
  edition: WLC
  text: אַל תִּירָא֙ כִּ֣י עִמְּ/ךָ אָ֔נִי אַל תִּשְׁתָּ֖ע כִּֽי אֲנִ֣י אֱלֹהֶ֑י/ךָ אִמַּצְתִּ֨י/ךָ֙ אַף עֲזַרְתִּ֔י/ךָ אַף תְּמַכְתִּ֖י/ךָ בִּ/ימִ֥ין צִדְקִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/010.yaml
  text: Do not fear[a], for I am with you; do not look around in dread, for I am your God. I will strengthen you; surely I will help you[b]; surely I will uphold you with my righteous right hand.
translation:
  language: hi
  text: मत डर, क्योंकि मैं तेरे साथ हूँ; भय से इधर-उधर मत देख[a], क्योंकि मैं तेरा परमेश्वर हूँ। मैं तुझे दृढ़ करूँगा[b]; निश्चय ही मैं तेरी सहायता करूँगा; निश्चय ही मैं अपने धर्ममय दाहिने हाथ से तुझे सम्भाले रखूँगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मत घबरा।” इब्रानी क्रिया में सम्भवतः व्याकुलता या भय से इधर-उधर देखने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: “दृढ़ करूँगा,” “सहायता करूँगा” और “सम्भाले रखूँगा” के इब्रानी क्रियारूपों का अधिक शाब्दिक अनुवाद “मैंने तुझे दृढ़ किया है ... सहायता की है ... सम्भाला है” हो सकता है; यहाँ वे निश्चित दैवी आश्वासन के रूप में समझे गए हैं।
    reason: aspectual_ambiguity
  - marker: c
    text: शाब्दिक रूप से, “अपनी धार्मिकता के दाहिने हाथ से।”
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּירָא
  choice: मत डर
  rationale: יִרָא के निषेधात्मक रूप की सीधी और स्वाभाविक हिन्दी; इब्रानी कथन की संक्षिप्तता और दृढ़ता बनी रहती है।
- source_word: כִּי עִמְּךָ אָנִי
  choice: क्योंकि मैं तेरे साथ हूँ
  rationale: כִּי यहाँ निषेध का कारण बताता है। हिन्दी में सामान्य शब्दक्रम रखते हुए परमेश्वर की उपस्थिति का आश्वासन स्पष्ट किया गया है।
- source_word: אַל תִּשְׁתָּע
  choice: भय से इधर-उधर मत देख
  rationale: क्रिया में घबराहट या आशंका के साथ चारों ओर देखने का सम्भावित दृश्यात्मक भाव है। यह अनुवाद केवल ‘मत घबरा’ कहने की अपेक्षा उस बिंब को बनाए रखता है।
- source_word: אֲנִי אֱלֹהֶיךָ
  choice: मैं तेरा परमेश्वर हूँ
  rationale: वाचा-संबंधी पहचान का सीधा अनुवाद; אֱלֹהִים रूप में बहुवचन होते हुए भी यहाँ अर्थ में एकवचन है।
- source_word: אִמַּצְתִּיךָ
  choice: मैं तुझे दृढ़ करूँगा
  rationale: אָמַץ का अर्थ बलवान या दृढ़ करना है। सन्दर्भ में यह अगली क्रियाओं के साथ भविष्य का दैवी आश्वासन व्यक्त करता है।
- source_word: אַף
  choice: निश्चय ही
  rationale: यहाँ אַף केवल एक और बात जोड़ने के बजाय आश्वासन पर बल देता है। दोनों बार इसकी पुनरावृत्ति से इब्रानी की अलंकारिक प्रगति बनी रहती है।
- source_word: עֲזַרְתִּיךָ
  choice: मैं तेरी सहायता करूँगा
  rationale: עזר का सामान्य अर्थ सहायता करना है; प्रसंग में इसे प्रतिज्ञात्मक भविष्य के रूप में व्यक्त किया गया है।
- source_word: תְּמַכְתִּיךָ
  choice: मैं ... तुझे सम्भाले रखूँगा
  rationale: תמך में थामने, सहारा देने और टिकाए रखने का भाव है। ‘सम्भाले रखूँगा’ साधारण पाठक के लिए स्वाभाविक है और निरन्तर सहारे का बिंब बनाए रखता है।
- source_word: בִּימִין צִדְקִי
  choice: अपने धर्ममय दाहिने हाथ से
  rationale: בְּ को साधनवाचक ‘से’ और construct पदबंध को स्वाभाविक विशेषणात्मक हिन्दी में व्यक्त किया गया है। ‘धर्ममय’ में धार्मिकता, न्याय और विश्वसनीयता का व्यापक भाव बना रहता है।
theological_decisions:
- issue: בִּימִין צִדְקִי का सम्बन्ध और अर्थ
  choice: अपने धर्ममय दाहिने हाथ से
  alternative: अपनी धार्मिकता के दाहिने हाथ से
  rationale: मुख्य पाठ की अभिव्यक्ति हिन्दी में स्वाभाविक है और परमेश्वर की सामर्थ्य को उसकी धार्मिकता से जोड़ती है; अधिक रूपात्मक अनुवाद पादटिप्पणी में देकर इब्रानी संरचना को छिपाया नहीं गया।
- issue: आश्वासन देने वाली तीन क्रियाओं का काल-पक्ष
  choice: भविष्य की प्रतिज्ञाएँ—‘दृढ़ करूँगा/सहायता करूँगा/सम्भाले रखूँगा’
  alternative: पूर्ण अथवा वर्तमान-जैसे आश्वासन—‘दृढ़ किया है/सहायता की है/सम्भाला है’
  rationale: इब्रानी रूप पूर्ण क्रिया के हैं, पर भविष्यवाणी के इस सन्दर्भ में वे परमेश्वर की निश्चित कार्रवाई का आश्वासन देते हैं। हिन्दी भविष्यकाल उस प्रतिज्ञात्मक प्रवाह को स्पष्ट करता है; रूपात्मक विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। एकवचन सम्बोधन ‘तू/तेरा/तुझे’ मूल के एकवचन रूप को सुरक्षित रखता है और हिन्दी बाइबलीय शैली में परमेश्वर के आत्मीय, प्रत्यक्ष सम्बोधन के अनुकूल है। ‘धर्ममय’ सामान्य बोलचाल से कुछ ऊँचा है, पर पद के काव्यात्मक और धर्मवैचारिक भार के लिए स्पष्ट तथा उपयुक्त है।
