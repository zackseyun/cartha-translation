  text: מִֽי הִגִּ֤יד מֵ/רֹאשׁ֙ וְ/נֵדָ֔עָה וּ/מִ/לְּ/פָנִ֖ים וְ/נֹאמַ֣ר צַדִּ֑יק אַ֣ף אֵין מַגִּ֗יד אַ֚ף אֵ֣ין מַשְׁמִ֔יעַ אַ֥ף אֵין שֹׁמֵ֖עַ אִמְרֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/026.yaml
  text: Who declared it from the beginning[a], so that we might know, and beforehand, so that we might say, ‘He is right’? But there was no one declaring it, no one making it heard[b], no one hearing your words.
translation:
  language: hi
  text: किसने आरम्भ से यह घोषित किया, ताकि हम जानें, और पहले से यह बताया, ताकि हम कहें, “वह सही है”[b]? फिर भी कोई भी यह घोषित करनेवाला नहीं था, कोई भी इसे सुनानेवाला नहीं था, और कोई भी तुम्हारी बातें सुननेवाला नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'या, “वह सही ठहरा”; परम्परागत अनुवाद: “वह धर्मी है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הִגִּיד
  choice: किसने ... घोषणा की थी
  rationale: प्रश्न की सीधी और चुनौतीपूर्ण शैली बनाए रखते हुए נגד के हिफ़ील रूप का सार्वजनिक रूप से ज्ञात कराने का भाव व्यक्त करता है।
- source_word: מֵרֹאשׁ
  choice: आरम्भ से ही
  rationale: यह पूर्वकालिक घोषणा की ओर संकेत करता है; ‘ही’ आरम्भिक समय पर दिए गए बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְנֵדָעָה
  choice: ताकि हम जानें
  rationale: कोहोर्टेटिव का उद्देश्य अथवा परिणामसूचक भाव वर्तमान मानक हिन्दी में स्पष्ट करता है।
- source_word: וּמִלְּפָנִים
  choice: और पहले से ही
  rationale: यह מֵרֹאשׁ के समानान्तर है और घटना से पहले सूचना दिए जाने पर बल देता है।
- source_word: צַדִּיק
  choice: वह सही है
  rationale: यहाँ शब्द भविष्यवाणी करनेवाले के दावे के सत्य और प्रमाणित होने का निर्णय व्यक्त करता है, मुख्यतः उसके नैतिक चरित्र का वर्णन नहीं।
- source_word: מַשְׁמִיעַ
  choice: इसे सुनानेवाला
  rationale: שמע के हिफ़ील रूप का किसी बात को दूसरों तक सुनाई देने योग्य बनाने का कारणवाचक भाव सुरक्षित रखता है।
- source_word: שֹׁמֵעַ אִמְרֵיכֶם
  choice: तुम्हारी बातें सुननेवाला
  rationale: मूल के कृदन्तीय समानान्तर विन्यास और दूसरे पुरुष बहुवचन सम्बोधन दोनों को बनाए रखता है।
- source_word: אַף אֵין ... אַף אֵין ... אַף אֵין
  choice: न कोई ... न कोई ... और न कोई
  rationale: तीन बार दोहराए गए प्रबल निषेध को स्वाभाविक हिन्दी के क्रमिक समानान्तर निषेध द्वारा व्यक्त करता है।
theological_decisions:
- issue: भविष्यवाणी की चुनौती में निहित कर्म का सन्दर्भ
  choice: स्त्रीलिंग सर्वनाम ‘इसकी/इसे’ द्वारा निहित बात या घटना का सामान्य संकेत
  alternative: किसी निश्चित व्यक्ति अथवा घटना का नाम स्पष्ट रूप से जोड़ना
  rationale: इब्रानी में कर्म प्रकट नहीं है। हिन्दी में क्रिया को स्वाभाविक बनाने के लिए न्यूनतम सामान्य संकेत दिया गया है, पर किसी खास व्यक्ति या घटना को निश्चित नहीं किया गया।
- issue: צַדִּיק का प्रसंगगत अर्थ
  choice: “वह सही है”
  alternative: “वह धर्मी है” अथवा “वह सही ठहरा”
  rationale: प्रसंग में प्रश्न यह है कि किसका पूर्वकथन सत्य सिद्ध हुआ; इसलिए न्यायिक/प्रमाणित होने का भाव प्रमुख है, जबकि पारम्परिक नैतिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। प्रश्न की न्यायालय-सदृश चुनौती और अन्त के तीन समानान्तर निषेध सुरक्षित हैं। मूल में दूसरे खण्ड की क्रिया निहित है; स्पष्ट और स्वाभाविक हिन्दी के लिए ‘बताया था’ दोहराया गया है।
