reference: Isaiah 41:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ֤י הֵעִיר֙ מִ/מִּזְרָ֔ח צֶ֖דֶק יִקְרָאֵ֣/הוּ לְ/רַגְל֑/וֹ יִתֵּ֨ן לְ/פָנָ֤י/ו גּוֹיִם֙ וּ/מְלָכִ֣ים יַ֔רְדְּ יִתֵּ֤ן כֶּֽ/עָפָר֙ חַרְבּ֔/וֹ כְּ/קַ֥שׁ נִדָּ֖ף קַשְׁתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/002.yaml
  text: Who has stirred up one from the east[a], calling him in righteousness to his feet? He gives nations before him and subdues kings; he gives them like dust to his sword[b], like driven stubble to his bow.
translation:
  language: hi
  text: पूर्व से एक व्यक्ति को किसने उठाया है, और धार्मिकता के साथ उसे अपने चरणों के पास बुलाया है?[a] वह जातियों को उसके सामने सौंप देता है और राजाओं को उसके अधीन करता है;[b] वह उन्हें उसकी तलवार के सामने धूल के समान और उसके धनुष के सामने हवा में उड़ते सूखे भूसे के समान कर देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विजय के लिए” अथवा “न्याय के अनुसार उसे अपने चरणों के पास बुलाया है।” इब्रानी पदबंध कठिन है; यहाँ “धार्मिकता” में न्यायोचित ठहराए जाने या विजय का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में यह उपवाक्य पाठगत और वाक्यगत दृष्टि से कठिन है। सम्भव अनुवाद हैं: “और उसके सामने राजाओं को वश में कर देता है” या “और उसे राजाओं को रौंदने देता है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵעִיר
  choice: जगाया है
  rationale: हिफ़ील रूप किसी व्यक्ति को कार्य के लिए उठाने या सक्रिय करने का कारणवाचक भाव व्यक्त करता है। ‘जगाया है’ इस भाव को सरल और स्वाभाविक हिन्दी में रखता है।
- source_word: מִמִּזְרָח
  choice: पूर्व दिशा से
  rationale: शब्दशः यह सूर्योदय की दिशा या स्थान है; भौगोलिक अर्थ में ‘पूर्व दिशा’ स्वाभाविक हिन्दी है।
- source_word: צֶדֶק
  choice: धर्मपूर्वक
  rationale: צֶדֶק धार्मिकता, न्याय, उचित ठहराए जाने या विजय का भाव रख सकता है। क्रियाविशेषणात्मक ‘धर्मपूर्वक’ मूल अर्थ को बनाए रखता है, जबकि अन्य संभावनाएँ पाद-टिप्पणी में सुरक्षित हैं।
- source_word: יִקְרָאֵהוּ לְרַגְלוֹ
  choice: उसे अपने चरणों के पास बुलाया है
  rationale: ‘अपने चरणों के पास’ इब्रानी बिंब को बनाए रखता है, जो किसी के पीछे चलने, उसकी सेवा में उपस्थित होने या उसके अधिकार में रहने का संकेत दे सकता है।
- source_word: יִתֵּן לְפָנָיו גּוֹיִם
  choice: जातियों को उसके सामने कर देता है
  rationale: נתן और ‘उसके सामने’ का मेल जातियों को विजेता के सामने सौंप देने या रख देने का भाव देता है। अनुवाद मूल संरचना के निकट रहते हुए हिन्दी में बोधगम्य है।
- source_word: וּמְלָכִים יַרְדְּ
  choice: राजाओं को उसके अधीन कर देता है
  rationale: यह कठिन रूप संदर्भ में राजाओं को वश में करने या उन पर प्रभुत्व दिलाने का संकेत देता है। मुख्य पाठ विजय का प्रसंग स्पष्ट करता है और वैकल्पिक विश्लेषण पाद-टिप्पणी में रखा गया है।
- source_word: יִתֵּן כֶּעָפָר חַרְבּוֹ
  choice: उसकी तलवार के आगे उन्हें धूल के समान कर देता है
  rationale: वाक्य पराजित जातियों और राजाओं की तुलना तलवार के आगे धूल से करता है। हिन्दी में स्पष्टता के लिए ‘उन्हें’ जोड़ा गया है।
- source_word: כְּקַשׁ נִדָּף קַשְׁתּוֹ
  choice: उसके धनुष के आगे हवा में उड़ती ठूँठ के समान
  rationale: קַשׁ खेत में बची सूखी ठूँठ या पुआल है और נִדָּף उड़ाए या बिखेरे जाने का भाव देता है। यह चयन कृषि-बिंब को बनाए रखता है।
theological_decisions:
- issue: पूर्व दिशा से जगाए गए व्यक्ति की पहचान
  choice: मुख्य पाठ में व्यक्ति को अनाम रखना
  alternative: कुस्रू, अब्राहम, या परमेश्वर द्वारा उठाया गया कोई आदर्श विजेता
  rationale: इस पद में उस व्यक्ति का नाम नहीं दिया गया है। किसी विशिष्ट व्यक्ति की पहचान जोड़ने से पाठ की खुली संदर्भात्मकता अनावश्यक रूप से सीमित हो जाएगी।
- issue: צֶדֶק का अर्थ और वाक्यगत संबंध
  choice: इसे बुलाने के ढंग के रूप में ‘धर्मपूर्वक’ प्रस्तुत करना
  alternative: ‘विजय के लिए’, ‘न्याय के अनुसार’, या ‘धार्मिकता उसे अपने चरणों तक बुलाती है’
  rationale: इब्रानी पदबंध कठिन है और धार्मिकता, न्याय, निर्दोष सिद्ध होने तथा विजय के अर्थ-क्षेत्रों को स्पर्श कर सकता है। मुख्य पाठ एक सम्भव स्वाभाविक वाचन देता है, जबकि पाद-टिप्पणी अस्पष्टता बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘चरणों के पास’ मूल इब्रानी बिंब को सुरक्षित रखता है; ‘जातियाँ’, ‘अधीन’ और ‘धनुष’ बाइबिलीय काव्य के अनुरूप हैं, पर भाषा अत्यधिक संस्कृतनिष्ठ नहीं रखी गई।
