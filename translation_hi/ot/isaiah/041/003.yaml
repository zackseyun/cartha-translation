base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/003.yaml
  text: He pursues them and passes on safely[a], by a path his feet had not traveled.
translation:
  language: hi
  text: वह उनका पीछा करता और सकुशल आगे बढ़ता है[a], ऐसे मार्ग से जिस पर उसके पाँव पहले कभी नहीं चले थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उनका पीछा करता और शान्ति से पार निकल जाता है; ऐसे मार्ग से जिस पर उसके पाँव नहीं चले थे।” अन्तिम इब्रानी वाक्यांश कठिन है; वह या तो उसके सकुशल आगे बढ़ने पर, या ऐसे मार्ग पर चलने पर बल दे सकता है जिस पर वह पहले कभी नहीं चला था।
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְדְּפֵם
  choice: वह उनका पीछा करता
  rationale: רדף के क़ाल अपूर्ण 3ms और 3mp प्रत्यय को भविष्यसूचक जीवंत वर्णन में वर्तमान काल से व्यक्त किया गया है; इससे सक्रिय पीछा करने का भाव बना रहता है।
- source_word: יַעֲבוֹר
  choice: और ... आगे बढ़ता है
  rationale: עבר का मूल अर्थ पार होना या आगे निकलना है। विजयपूर्ण सैन्य प्रगति के संदर्भ में ‘आगे बढ़ता है’ स्वाभाविक है और किसी विशेष वस्तु को पार करने का अनावश्यक संकेत नहीं देता।
- source_word: שָׁלוֹם
  choice: सकुशल
  rationale: शाब्दिक अर्थ ‘शान्ति’ है, पर यहाँ क्रियाविशेषण रूप में निर्बाध और बिना हानि के आगे बढ़ने का भाव है। ‘सकुशल’ आधुनिक हिन्दी में इसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֹרַח
  choice: मार्ग
  rationale: אֹרַח किसी पथ, बाट या मार्ग को दर्शाता है। ‘मार्ग’ गरिमापूर्ण और सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: בְּרַגְלָיו
  choice: उसके पाँव
  rationale: शाब्दिक रूप से ‘उसके पाँवों से/के द्वारा’ है। हिन्दी में ‘उसके पाँव ... नहीं चले थे’ यात्रा की शारीरिक छवि को सहजता से बनाए रखता है।
- source_word: לֹא יָבוֹא
  choice: पहले कभी नहीं चले थे
  rationale: शाब्दिक रूप से ‘नहीं आया’ है, पर ‘मार्ग’ और ‘पाँव’ के साथ संकुचित इब्रानी वाक्यांश उस मार्ग पर पहले न जाने का संकेत देता है। ‘पहले कभी नहीं चले थे’ इस कठिन अभिव्यक्ति का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: अन्तिम वाक्यांश אֹרַח בְּרַגְלָיו לֹא יָבוֹא की व्याख्या
  choice: विजेता ऐसे मार्ग से आगे बढ़ता है जिस पर उसके पाँव पहले कभी नहीं चले थे।
  alternative: वह ऐसे मार्ग पर बढ़ता है जिसे उसके पाँव छूते नहीं; अथवा वह ऐसे मार्ग से आता है, अपने पाँवों से नहीं।
  rationale: इब्रानी वाक्यांश संक्षिप्त और कठिन है। प्रसंग में सबसे सम्भावित अर्थ विजेता की अभूतपूर्व अथवा निर्बाध प्रगति है; फिर भी टिप्पणी में शाब्दिक संरचना और दूसरी सम्भावना को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘सकुशल’ शָׁלוֹם के प्रसंगगत क्रियाविशेषण अर्थ को व्यक्त करता है, जबकि पादटिप्पणी ‘शान्ति से’ वाले अधिक शाब्दिक विकल्प और अन्तिम खण्ड की वास्तविक अस्पष्टता को सुरक्षित रखती है।
