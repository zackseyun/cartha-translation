id: ISA.41.15
reference: Isaiah 41:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִנֵּ֣ה שַׂמְתִּ֗י/ךְ לְ/מוֹרַג֙ חָר֣וּץ חָדָ֔שׁ בַּ֖עַל פִּֽיפִיּ֑וֹת תָּד֤וּשׁ הָרִים֙ וְ/תָדֹ֔ק וּ/גְבָע֖וֹת כַּ/מֹּ֥ץ תָּשִֽׂים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/015.yaml
  text: Behold[a], I have made you a new sharp threshing sledge with double edges; you will thresh the mountains and crush them, and you will make the hills like chaff.
translation:
  language: hi
  text: देख, मैंने तुझे मड़ाई का एक नया, धारदार पाटा बनाया है, जो धारों वाला है[a]। तू पहाड़ों को दाँवेगा और उन्हें चूर-चूर कर देगा; तू पहाड़ियों को भूसी के समान कर देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मुखों/धारों वाला।” इसका अर्थ “दोहरी धार वाला,” “काटने वाली बहुत-सी धारों वाला,” या “दाँतों वाला” भी हो सकता है।
    reason: इब्रानी अभिव्यक्ति उपकरण की काटने वाली सतहों का संकेत करती है, पर उसकी सटीक बनावट या धारों की संख्या अस्पष्ट है।
lexical_decisions:
- source_word: הִנֵּה
  choice: देख
  rationale: यह ध्यान आकर्षित करने वाला जोरदार भविष्यद्वाणी-सूचक पद है। ‘देख’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसका बल बनाए रखता है।
- source_word: שַׂמְתִּיךְ
  choice: मैंने तुझे ... बनाया है
  rationale: שׂוּם का यहाँ अर्थ किसी को एक साधन के रूप में बनाना है; पूर्ण क्रिया का वर्तमान परिणाम ‘बनाया है’ से व्यक्त होता है।
- source_word: לְמוֹרַג
  choice: अनाज दाँवने का ... पाटा
  rationale: מוֹרַג अनाज को दाँवकर भूसी अलग करने वाला भारी पाटा या फलक है। यह अनुवाद कृषि-चित्र को ठोस और समझने योग्य रखता है।
- source_word: חָרוּץ חָדָשׁ
  choice: नया, धारदार
  rationale: विशेषण साधन के नए और काटने में सक्षम होने को बताते हैं; ‘धारदार’ प्रसंगगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּעַל פִּיפִיּוֹת
  choice: जिसमें अनेक धारें हैं[a]
  rationale: पद का शाब्दिक बिंब ‘मुखों/धारों का स्वामी’ है। बहुवचन को ‘अनेक धारें’ से रखा गया है और उपकरण की सटीक बनावट संबंधी अस्पष्टता को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: תָּדוּשׁ
  choice: तू ... दाँवेगा
  rationale: דּוּשׁ अनाज दाँवने की मानक क्रिया है। उसी क्रिया को बनाए रखने से साधन और कार्य का विस्तृत रूपक सुरक्षित रहता है।
- source_word: וְתָדֹק
  choice: और उन्हें चूर-चूर कर देगा
  rationale: דקק किसी वस्तु को बहुत छोटे टुकड़ों या महीन कणों में कुचलने का अर्थ देता है। ‘उन्हें’ का संदर्भ पहाड़ों से है।
- source_word: כַּמֹּץ תָּשִׂים
  choice: भूसी के समान कर देगा
  rationale: מוֹץ दँवाई में अलग होने वाली हल्की भूसी है; उपमा और परिणामसूचक שׂוּם दोनों सीधे बनाए रखे गए हैं।
theological_decisions:
- issue: याकूब/इस्राएल को दँवाई के साधन के रूप में प्रस्तुत करने वाला रूपक
  choice: पहाड़ों, पहाड़ियों, दँवाई और भूसी के ठोस कृषि-चित्र को ज्यों का त्यों रखा गया है।
  alternative: पहाड़ों और पहाड़ियों की व्याख्या शत्रु राष्ट्रों या बड़ी बाधाओं के रूप में मुख्य पाठ में करना।
  rationale: इब्रानी पाठ इस पद में रूपक के वास्तविक लक्ष्य को स्पष्ट नहीं करता। उसकी व्याख्या जोड़ने के बजाय काव्यात्मक और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘दाँवना’ कृषि-रूपक को सटीक रखता है, जबकि ‘अनाज दाँवने का पाटा’ कम परिचित क्रिया का संदर्भ स्पष्ट करता है।
