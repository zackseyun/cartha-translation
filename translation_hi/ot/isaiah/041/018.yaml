source:
  edition: WLC
  text: אֶפְתַּ֤ח עַל שְׁפָיִים֙ נְהָר֔וֹת וּ/בְ/ת֥וֹךְ בְּקָע֖וֹת מַעְיָנ֑וֹת אָשִׂ֤ים מִדְבָּר֙ לַ/אֲגַם מַ֔יִם וְ/אֶ֥רֶץ צִיָּ֖ה לְ/מוֹצָ֥אֵי מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/018.yaml
  text: I will open rivers on the bare heights[a], and springs in the midst of the valleys; I will make the wilderness into a pool of water[b], and the dry land into springs of water.
translation:
  language: hi
  text: 'मैं उजाड़ पहाड़ियों पर नदियाँ निकालूँगा,

    और घाटियों के बीच में सोते निकालूँगा;

    मैं वीराने को जल का ताल बना दूँगा

    और सूखी भूमि को जल-स्रोतों में बदल दूँगा[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या “पानी के फूट निकलने के स्थानों में” अथवा “जल के सोतों में”।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְתַּח
  choice: निकालूँगा
  rationale: פתח का मूल अर्थ ‘खोलना’ है, पर नदियों के साथ हिन्दी में ‘नदियाँ खोलूँगा’ अस्वाभाविक है। ‘नदियाँ निकालूँगा’ पानी के मार्ग खोल देने की सक्रिय, प्रथम-पुरुष प्रतिज्ञा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׁפָיִים
  choice: उजाड़ पहाड़ियों
  rationale: यह शब्द खुली, वनस्पतिहीन या बंजर ऊँचाइयों का बोध कराता है। ‘उजाड़ पहाड़ियाँ’ ऊँचाई और निर्जनता दोनों को साधारण हिन्दी में व्यक्त करता है तथा ‘ऊँचे स्थान’ के संभावित उपासना-संबंधी अर्थ से बचता है।
- source_word: נְהָרוֹת
  choice: नदियाँ
  rationale: शब्द का सामान्य अर्थ ‘नदियाँ’ है और यहाँ पानी की प्रचुरता के काव्यात्मक चित्र को बनाए रखता है।
- source_word: וּבְתוֹךְ בְּקָעוֹת
  choice: और घाटियों के बीच में
  rationale: בקעות घाटियों अथवा विस्तृत निचले भूभागों को सूचित कर सकता है। ऊँचाइयों के समानांतर विरोध में ‘घाटियाँ’ स्पष्ट है, और ‘बीच में’ בתוך को सुरक्षित रखता है।
- source_word: מַעְיָנוֹת
  choice: सोते
  rationale: यह प्राकृतिक जल-स्रोतों को दर्शाता है। ‘सोते’ संक्षिप्त, परिचित और कृत्रिम फव्वारों से भिन्न है।
- source_word: אָשִׂים
  choice: बना दूँगा / बदल दूँगा
  rationale: שים का अर्थ रखना, स्थापित करना या बना देना हो सकता है। परिवर्तन के इस प्रसंग में दोनों हिन्दी क्रियाएँ काव्यात्मक समानांतरता को स्वाभाविक ढंग से व्यक्त करती हैं।
- source_word: מִדְבָּר
  choice: वीराने
  rationale: מִדְבָּר केवल रेतीले मरुस्थल तक सीमित नहीं है; ‘वीराना’ व्यापक निर्जन और शुष्क भूभाग को व्यक्त करता है।
- source_word: לַאֲגַם מַיִם
  choice: जलाशय
  rationale: אגם जमा हुए पानी के ताल, पोखर या दलदली जल-क्षेत्र को सूचित कर सकता है। ‘जलाशय’ आकार या दलदली प्रकृति को अनावश्यक रूप से निश्चित किए बिना एकत्र जल का चित्र देता है।
- source_word: אֶרֶץ צִיָּה
  choice: सूखी भूमि
  rationale: यह सूखे या प्यासे भूभाग का बोध कराता है। ‘सूखी भूमि’ सरल, स्पष्ट और अर्थ की दृष्टि से पर्याप्त है।
- source_word: לְמוֹצָאֵי מָיִם
  choice: जल-स्रोतों में
  rationale: מוֹצָאֵי का शाब्दिक संबंध पानी के निकलने के स्थानों से है। ‘जल-स्रोत’ इस भाव को सुरक्षित रखता है और पहले आए ‘सोते’ की अनावश्यक पुनरावृत्ति से बचता है।
theological_decisions:
- issue: परिवर्तन के चित्र का स्वरूप
  choice: पद को परमेश्वर द्वारा उजाड़ स्थानों में भरपूर पानी देने की ठोस प्रतिज्ञा के रूप में रखा गया है, जबकि इसकी भविष्यद्वाणीपरक काव्यात्मकता बनी रहती है।
  alternative: इसे मुख्यतः आत्मिक नवीकरण का रूपक या केवल भावी नई सृष्टि का वर्णन मानना।
  rationale: इब्रानी पाठ प्रत्यक्ष पर्यावरणीय चित्रों में प्रथम-पुरुष प्रतिज्ञा करता है। अनुवाद न तो इन चित्रों को रूपक में बदलता है, न उनकी पूर्ति के किसी एक धर्मवैज्ञानिक ढाँचे को निर्धारित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रजिस्टर अपनाया गया है। समानांतर पंक्तियों में ऊँचाई/घाटी और वीराना/सूखी भूमि के विरोध को स्पष्ट रखा गया है। ‘सोते’ और ‘जल-स्रोत’ के भेद से מַעְיָנוֹת तथा מוֹצָאֵי के निकटार्थी, पर समान न होने वाले रूप सुरक्षित रहते हैं।
