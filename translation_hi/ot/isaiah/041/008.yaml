id: ISA.41.8
reference: Isaiah 41:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַתָּה֙ יִשְׂרָאֵ֣ל עַבְדִּ֔/י יַעֲקֹ֖ב אֲשֶׁ֣ר בְּחַרְתִּ֑י/ךָ זֶ֖רַע אַבְרָהָ֥ם אֹהֲבִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/008.yaml
  text: But you[a], Israel, my servant, Jacob, whom I have chosen, offspring of Abraham, my friend—
translation:
  language: hi
  text: 'परन्तु तू, हे इस्राएल, मेरा सेवक,

    हे याकूब, जिसे मैंने चुना है,

    मेरे मित्र[a] अब्राहम की सन्तान—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “जो मुझसे प्रेम करता है।”
    reason: इब्रानी אֹהֲבִי में ‘मेरा मित्र’ और ‘मुझसे प्रेम करने वाला’ दोनों अर्थ सम्भव हैं।
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: परन्तु तू
  rationale: स्वतन्त्र सर्वनाम के साथ संयोजक आसपास वर्णित राष्ट्रों और इस्राएल के बीच प्रबल विरोध दिखाता है। ‘परन्तु तू’ इस विरोध को स्वाभाविक हिन्दी में व्यक्त करता है और एकवचन सम्बोधन बनाए रखता है।
- source_word: יִשְׂרָאֵל
  choice: हे इस्राएल
  rationale: व्यक्तिवाचक नाम को मानक हिन्दी रूप में रखा गया है; ‘हे’ प्रत्यक्ष सम्बोधन को स्पष्ट करता है।
- source_word: עַבְדִּי
  choice: मेरा सेवक
  rationale: यहाँ עבד इस्राएल के लिए परमेश्वर से सम्बन्ध सूचित करने वाली उपाधि है; ‘सेवक’ प्रसंगानुकूल है और बन्धुआ होने पर अनावश्यक बल नहीं देता।
- source_word: יַעֲקֹב
  choice: हे याकूब
  rationale: मानक हिन्दी नाम; यह ‘इस्राएल’ के समानाधिकरण में है और उसी समुदाय को सम्बोधित करता है।
- source_word: אֲשֶׁר בְּחַרְתִּיךָ
  choice: जिसे मैंने चुना है
  rationale: सम्बन्धवाचक उपवाक्य और पूर्ण हो चुके चुनाव को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: זֶרַע אַבְרָהָם
  choice: अब्राहम की सन्तान
  rationale: זֶרַע सामूहिक एकवचन है। ‘सन्तान’ इस सामूहिक अर्थ को बनाए रखते हुए आधुनिक हिन्दी में ‘बीज’ से अधिक स्वाभाविक है।
- source_word: אֹהֲבִי
  choice: मेरे मित्र
  rationale: प्रथम पुरुष प्रत्यययुक्त कृदन्त यहाँ अब्राहम के परमेश्वर के साथ विशेष सम्बन्ध को मुहावरेदार ढंग से व्यक्त कर सकता है। अधिक शाब्दिक सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: अब्राहम के लिए אֹהֲבִי का अर्थ
  choice: मेरे मित्र
  alternative: जो मुझसे प्रेम करता है
  rationale: इब्रानी रूप का शाब्दिक अर्थ ‘मुझसे प्रेम करने वाला’ हो सकता है, जबकि प्रसंग में यह मित्रता के विशेष सम्बन्ध का मुहावरा भी है। मुख्य पाठ में स्वाभाविक सम्बन्धपरक अर्थ रखा गया है और वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रत्यक्ष सम्बोधन वाली है। काव्यात्मक समानाधिकरण और पद के अन्त का अपूर्ण विराम अगले कथन की ओर संकेत करने के लिए बनाए रखे गए हैं।
