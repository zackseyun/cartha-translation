  edition: WLC
  text: הַגִּ֨ידוּ֙ הָ/אֹתִיּ֣וֹת לְ/אָח֔וֹר וְ/נֵ֣דְעָ֔ה כִּ֥י אֱלֹהִ֖ים אַתֶּ֑ם אַף תֵּיטִ֣יבוּ וְ/תָרֵ֔עוּ וְ/נִשְׁתָּ֖עָה ו/נרא יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/023.yaml
  text: Declare to us the things to come afterward[a], that we may know that you are gods; indeed, do good or do harm[c][b], that we may be dismayed and see together.
translation:
  language: hi
  text: आगे होने वाली बातें हमें बताओ[a], ताकि हम जानें कि तुम देवता हो। हाँ, भला करो या हानि पहुँचाओ[b], ताकि हम घबरा जाएँ[c] और साथ मिलकर देखें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाद की बातें।” इब्रानी अभिव्यक्ति बाद में होने वाली बातों को दर्शाती है; यहाँ यह भविष्य बताने की चुनौती है।
    reason: lexical_alternative
  - marker: b
    text: या “भला और बुरा करो।” आशय यह चुनौती देना है कि वे लाभ पहुँचाकर या हानि पहुँचाकर अपनी कोई वास्तविक सामर्थ्य दिखाएँ।
    reason: lexical_alternative
  - marker: c
    text: “घबरा जाएँ” के लिए प्रयुक्त इब्रानी क्रिया दुर्लभ है; इसका अर्थ “विस्मय से देखें” या “घबराकर इधर-उधर देखें” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידוּ
  choice: घोषित करो
  rationale: बहुवचन आज्ञार्थक रूप सार्वजनिक रूप से बताने की चुनौती देता है; ‘घोषित करो’ भविष्यद्वाणी संबंधी औपचारिक चुनौती के स्वर को बनाए रखता है।
- source_word: הָאֹתִיּוֹת לְאָחוֹר
  choice: आगे होनेवाली बातें
  rationale: शाब्दिक भाव ‘बाद की बातें’ है, पर प्रसंग में भविष्य में होनेवाली घटनाएँ बताने की चुनौती है; चुना हुआ रूप समय-संबंधी अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: וְנֵדְעָה
  choice: ताकि हम जानें
  rationale: आज्ञा के बाद आया प्रथम पुरुष बहुवचन कोहोर्टेटिव उद्देश्य या परिणाम व्यक्त करता है।
- source_word: כִּי אֱלֹהִים אַתֶּם
  choice: कि तुम देवता हो
  rationale: संबोधन बहुवचन मूर्तियों से है; इसलिए यहाँ אֱלֹהִים का बहुवचन अर्थ ‘देवता’ प्रसंगानुकूल है।
- source_word: אַף
  choice: हाँ
  rationale: यह चुनौती को और बल देता है; आधुनिक हिन्दी में ‘हाँ’ संक्षिप्त और स्वाभाविक रूप से यह जोर व्यक्त करता है।
- source_word: תֵּיטִיבוּ וְתָרֵעוּ
  choice: भला करो या हानि पहुँचाओ
  rationale: दोनों क्रियाएँ लाभ या हानि पहुँचाने की वास्तविक सामर्थ्य दिखाने की चुनौती हैं; हिन्दी में ‘या’ इस द्विमुखी चुनौती को स्पष्ट करता है।
- source_word: וְנִשְׁתָּעָה
  choice: ताकि हम घबरा जाएँ
  rationale: यह दुर्लभ क्रियारूप भय, विस्मय या व्याकुल दृष्टि की प्रतिक्रिया सूचित कर सकता है; ‘घबरा जाएँ’ प्रसंग के चुनौतीपूर्ण स्वर में संभावित भय को व्यक्त करता है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: וְנִרְאֶה
  choice: और देखें
  rationale: मूल में स्पष्ट कर्म के बिना साधारण प्रथम पुरुष बहुवचन क्रिया है; हिन्दी में भी अनावश्यक कर्म जोड़े बिना इसे रखा गया है।
- source_word: יַחְדָּו
  choice: साथ मिलकर
  rationale: यह देखनेवालों की सामूहिक प्रतिक्रिया बतानेवाला क्रियाविशेषण है।
theological_decisions:
- issue: मूर्तियों के विरुद्ध व्यंग्यात्मक चुनौती में אֱלֹהִים का अनुवाद
  choice: देवता
  alternative: ईश्वर / दिव्य प्राणी
  rationale: द्वितीय पुरुष बहुवचन संबोधन और इस पद का मूर्ति-विरोधी प्रसंग बहुवचन ‘देवता’ का समर्थन करते हैं। इससे झूठे देवताओं को चुनौती देनेवाला व्यंग्य बना रहता है और मूल में अनावश्यक एकवचन नहीं थोपा जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। भविष्यवाणी और सामर्थ्य दिखाने की व्यंग्यात्मक चुनौती को औपचारिक किंतु स्वाभाविक हिन्दी में व्यक्त किया गया है; दुर्लभ क्रिया की वास्तविक अनिश्चितता पादटिप्पणी में दी गई है।
