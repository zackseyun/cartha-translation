base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/009.yaml
  text: you whom I took hold of from the ends of the earth[a], and called from its farthest corners, and said to you, ‘You are my servant; I have chosen you and not rejected you,’
translation:
  language: hi
  text: तू, जिसे मैंने पृथ्वी के छोरों से पकड़ लिया और उसके सुदूर कोनों[a] से बुलाया, और जिससे कहा, “तू मेरा सेवक है; मैंने तुझे चुना है और तुझे ठुकराया नहीं है,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “उसके सुदूर छोरों से।” यहाँ प्रयुक्त हिब्रू शब्द का अर्थ विवादित है। कुछ लोग इसका अर्थ “उसके कुलीनों में से” समझते हैं, पर “पृथ्वी के छोरों” के समानांतर भौगोलिक अर्थ अधिक उपयुक्त जान पड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזַקְתִּיךָ
  choice: मैंने ... पकड़ लिया
  rationale: חזק के हिफ़ील रूप का यहाँ अर्थ पकड़ना या अपने अधिकार में लेना है। पृथ्वी के छोरों से बुलाने के स्थानिक संदर्भ में यह अर्थ ‘बल देना’ की अपेक्षा अधिक उपयुक्त है और मूल बिंब को बनाए रखता है।
- source_word: מִקְצוֹת הָאָרֶץ
  choice: पृथ्वी के छोरों से
  rationale: यह दूरस्थ भूभागों के लिए प्रयुक्त परिचित काव्यात्मक अभिव्यक्ति है और हिब्रू की भौगोलिक व्यापकता को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: וּמֵאֲצִילֶיהָ
  choice: उसके सुदूर कोनों से
  rationale: काव्यात्मक समानांतरता में אציל को पृथ्वी के दूरस्थ किनारों या छोरों के अर्थ में लिया गया है। ‘सुदूर कोनों’ से दूरी का भाव स्पष्ट होता है; शब्द की वास्तविक शाब्दिक अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: קְרָאתִיךָ
  choice: बुलाया
  rationale: यह दैवी बुलाहट और आह्वान दोनों के लिए स्पष्ट तथा स्वाभाविक हिन्दी है।
- source_word: עַבְדִּי
  choice: मेरा सेवक
  rationale: यशायाह में इस वाचा-संबंधी संबोधन के लिए ‘सेवक’ स्वाभाविक और संदर्भानुकूल है; यहाँ दासत्व का सामाजिक पक्ष प्रमुख नहीं है।
- source_word: בְּחַרְתִּיךָ
  choice: मैंने तुझे चुना है
  rationale: यह भूतकाल में हुए चुनाव के वर्तमान और बने रहने वाले परिणाम को व्यक्त करता है तथा अगले खंड के साथ संतुलित है।
- source_word: מְאַסְתִּיךָ
  choice: तुझे ठुकराया नहीं है
  rationale: מאס यहाँ अस्वीकार करने या त्याग देने का भाव रखता है। ‘ठुकराया’ आधुनिक हिन्दी में स्पष्ट है और ‘तुच्छ समझा’ जैसी अनावश्यक भावात्मक तीव्रता नहीं जोड़ता।
theological_decisions:
- issue: द्वितीय पुरुष एकवचन का संदर्भ
  choice: पूरे पद में एकवचन ‘तू/तुझे’ रखा गया है, जो इस्राएल/याकूब को सामूहिक रूप से एक सेवक मानकर किए गए संबोधन को दर्शाता है।
  alternative: भाव स्पष्ट करने के लिए बहुवचन ‘तुम/तुम्हें’ करना।
  rationale: हिब्रू में संबोधन निरंतर पुल्लिंग एकवचन है। इसे बनाए रखने से सामूहिक एकवचन की साहित्यिक और धर्मवैचारिक शक्ति सुरक्षित रहती है और संबोधित पात्र की संरचना बदली नहीं जाती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘तू’ मूल के एकवचन और निकट वाचा-संबंधी संबोधन को सुरक्षित रखता है। वाक्य को अगले पद से जुड़ सकने वाले काव्यात्मक खंड के रूप में रखा गया है।
