lexical_decisions:
- source_word: אֶתֵּן / אָשִׂים
  choice: लगाऊँगा
  rationale: पेड़ों को किसी स्थान में रखने के संदर्भ में हिन्दी का स्वाभाविक क्रियापद ‘लगाना’ है; दोनों समानांतर इब्रानी क्रियाओं का ठोस स्थान-निर्धारण भाव सुरक्षित रहता है।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
