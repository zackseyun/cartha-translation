  text: मैं निर्जन प्रदेश में देवदार, बबूल, मर्टल और जैतून का पेड़[a] लगाऊँगा; मैं मरुभूमि में सरू, चिनार और चीड़ को एक साथ लगाऊँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
