- source_word: אֶרֶז
  choice: देवदार
  rationale: बाइबलीय प्रयोग में यह सामान्यतः देवदार, सम्भवतः लबानोन के देवदार, का नाम है।
- source_word: שִׁטָּה
  choice: बबूल
  rationale: यह अकासिया कुल का वृक्ष है; ‘बबूल’ साधारण हिन्दी पाठक के लिए परिचित और स्वाभाविक नाम है।
- source_word: הֲדַס
  choice: मेंहदी
  rationale: हिब्रू शब्द myrtle वृक्ष को दर्शाता है; हिन्दी बाइबलीय और वनस्पतिक प्रयोग में ‘मेंहदी’ सुबोध समतुल्य है।
- source_word: עֵץ שָׁמֶן
  choice: जैतून का पेड़
  rationale: शाब्दिक अर्थ ‘तेल का पेड़’ है और सम्भावित अभिप्राय जैतून है; मुख्य पाठ में परिचित वृक्षनाम रखा गया और शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: בָּעֲרָבָה
  choice: मरुभूमि में
  rationale: यहाँ עֲרָבָה को किसी विशिष्ट भू-नाम के बजाय सूखे मरु-मैदान के सामान्य अर्थ में लेना काव्यात्मक समानांतरता के अनुकूल है।
- source_word: בְּרוֹשׁ
  choice: सरू
  rationale: वृक्ष की सटीक जाति अनिश्चित है; ‘सरू’ परम्परागत और सुबोध प्रतिनिधि नाम है, जबकि अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: תִּדְהָר
  choice: चिनार
  rationale: सटीक वनस्पतिक पहचान अनिश्चित है; plane tree के लिए ‘चिनार’ हिन्दी में परिचित नाम है।
- source_word: תְאַשּׁוּר
  choice: चीड़
  rationale: प्रजाति अनिश्चित है; ‘चीड़’ सन्दर्भ में एक स्वाभाविक वृक्षनाम है और विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: יַחְדָּו
  choice: इन सबको एक साथ
  rationale: यह सामूहिक रूप से लगाए जाने पर बल देता है; ‘इन सबको’ से हिन्दी में उसका विस्तार स्पष्ट और स्वाभाविक बनता है।
