base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/007.yaml
  text: The craftsman strengthens the metalworker[a]; the one who smooths with the hammer strengthens the one who strikes the anvil, saying of the soldering, “It is good”[b]; then he fastens it with nails so that it will not totter.
translation:
  language: hi
  text: कारीगर धातुकार को हौसला देता है; हथौड़े से चिकना करनेवाला निहाई पर चोट करनेवाले को हौसला देता है और जोड़ के विषय में कहता है, “यह अच्छा है,”[a] फिर वह उसे कीलों से कस देता है, ताकि वह डगमगाए नहीं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “टाँके के बारे में,” “जोड़ने की प्रक्रिया के बारे में,” अथवा कम संभावना से “गोंद के बारे में।” हिब्रू शब्द उस सामग्री या प्रक्रिया को दर्शा सकता है जिससे बनाई गई वस्तु के हिस्से जोड़े जाते हैं।
    reason: lexical_alternative
  - marker: b
    text: या “ताकि वह हिले नहीं” अथवा “ताकि वह गिर न पड़े।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: हौसला देता है
  rationale: पिएल रूप का अर्थ ‘मज़बूत करना’ भी हो सकता है, पर यहाँ अलग-अलग कारीगरों के पारस्परिक प्रोत्साहन का भाव स्वाभाविक है; मूर्ति को भौतिक रूप से कसने का अर्थ पद के उत्तरार्ध में अलग ढंग से व्यक्त हुआ है।
- source_word: חָרָשׁ
  choice: कारीगर
  rationale: यह कुशल कामगार के लिए सामान्य शब्द है और अगले अधिक विशिष्ट धातु-कर्म संबंधी पद से भेद बनाए रखता है।
- source_word: צֹרֵף
  choice: धातुकार
  rationale: यह धातु गलाने, शुद्ध करने या उस पर काम करनेवाले को दर्शाता है; ‘सुनार’ कहना धातु को अनावश्यक रूप से सोने तक सीमित कर देता।
- source_word: מַחֲלִיק פַּטִּישׁ
  choice: हथौड़े से चिकना करनेवाला
  rationale: क्रियात्मक अनुवाद धातु की सतह को हथौड़े से समतल या चिकना करने की प्रक्रिया स्पष्ट करता है।
- source_word: הוֹלֶם פָּעַם
  choice: निहाई पर चोट करनेवाला
  rationale: कार्यशाला के संदर्भ में פעם को चोट सहनेवाली सतह, अर्थात निहाई, समझना संगत है; הולם बार-बार प्रहार करने की क्रिया बताता है।
- source_word: לַדֶּבֶק
  choice: जोड़ के बारे में
  rationale: דבק जोड़ने की सामग्री या प्रक्रिया दोनों को सूचित कर सकता है। सामान्य शब्द ‘जोड़’ इस अस्पष्टता को ‘टाँका’ जैसे अधिक विशिष्ट धातुकर्मीय अर्थ से बेहतर बचाए रखता है।
- source_word: טוֹב הוּא
  choice: यह अच्छा है
  rationale: सरल मूल्यांकन को हिब्रू के सीधे कथन के अनुरूप रखा गया है।
- source_word: וַיְחַזְּקֵהוּ בְמַסְמְרִים
  choice: फिर वह उसे कीलों से कस देता है
  rationale: यहाँ חזק का अर्थ निर्मित वस्तु को भौतिक रूप से दृढ़ और सुरक्षित करना है; ‘कीलों से कस देता है’ हिन्दी में ठोस क्रिया को स्पष्ट करता है।
- source_word: לֹא יִמּוֹט
  choice: ताकि वह डगमगाए नहीं
  rationale: מוט के निफ़ाल रूप में अस्थिर होने या हिलने का भाव है। ‘डगमगाए’ वस्तु की अस्थिरता और पद की व्यंग्यात्मक धार दोनों बनाए रखता है।
theological_decisions:
- issue: भविष्यद्वक्ता के व्यंग्य में निर्मित वस्तु की पहचान
  choice: मुख्य पाठ में ‘मूर्ति’ शब्द नहीं जोड़ा गया
  alternative: संदर्भ स्पष्ट करने के लिए ‘मूर्ति’ जोड़ना
  rationale: आस-पास का संदर्भ मूर्ति-निर्माण की ओर संकेत करता है, पर इस पद के हिब्रू पाठ में वस्तु का नाम सीधे नहीं दिया गया। सर्वनाम बनाए रखने से स्रोत की अभिव्यक्ति और उसका अंतर्निहित व्यंग्य सुरक्षित रहता है।
- issue: कारीगरों के परस्पर संबंध में חזק का अर्थ
  choice: पहली घटना में ‘हौसला देता है’, अंतिम घटना में ‘कस देता है’
  alternative: दोनों जगह ‘मज़बूत करता है’
  rationale: 'एक ही हिब्रू मूल के अर्थ-क्षेत्र को संदर्भानुसार स्वाभाविक हिन्दी में व्यक्त किया गया है: पहले कारीगरों का पारस्परिक प्रोत्साहन, फिर वस्तु का भौतिक स्थिरीकरण। इससे कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा जाता।'
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कारीगरी-संबंधी शब्द-भंडार अपनाया गया है। ‘धातुकार’ व्यापक है, ‘सुनार’ की अनावश्यक विशिष्टता से बचता है। ‘जोड़’ मूल की सामग्री/प्रक्रिया संबंधी अस्पष्टता बनाए रखता है। मुख्य पाठ में सभी पाद-टिप्पणी चिह्न उपस्थित हैं।
