source:
  edition: WLC
  text: הֵ֤ן יֵבֹ֨שׁוּ֙ וְ/יִכָּ֣לְמ֔וּ כֹּ֖ל הַ/נֶּחֱרִ֣ים בָּ֑/ךְ יִֽהְי֥וּ כְ/אַ֛יִן וְ/יֹאבְד֖וּ אַנְשֵׁ֥י רִיבֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/011.yaml
  text: Behold[a], all who are enraged against you will be put to shame and humiliated; they will become as nothing, and the men who contend with you will perish.
translation:
  language: hi
  text: देखो, जितने लोग तुम पर क्रोध से भड़के हुए हैं, वे सब लज्जित और अपमानित होंगे; वे कुछ भी नहीं के समान हो जाएँगे, और तुमसे झगड़नेवाले पुरुष नष्ट हो जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह अव्यय श्रोता का ध्यान खींचते हुए कथन की निश्चितता पर बल देता है; आधुनिक हिन्दी में “देखो” इसकी भविष्यवाणी-संबंधी शक्ति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יֵבֹשׁוּ וְיִכָּלְמוּ
  choice: लज्जित और अपमानित होंगे
  rationale: 'दोनों समानार्थी क्रियाओं को अलग-अलग रखा गया है: पहली लज्जा और दूसरी सार्वजनिक अपमान की तीव्रता व्यक्त करती है।'
- source_word: הַנֶּחֱרִים בָּךְ
  choice: तुम पर क्रोध से भड़के हुए हैं
  rationale: חרה का मूल बिंब जलने या भड़कने का है और यहाँ यह तीव्र शत्रुतापूर्ण क्रोध का मुहावरा है; “तुम पर” בָּךְ की विरोधात्मक दिशा व्यक्त करता है।
- source_word: יִהְיוּ כְאַיִן
  choice: वे मानो कुछ भी न रहेंगे
  rationale: यह रूप भविष्यकालीन अवस्था तथा כְ की तुलनात्मक छाया दोनों बनाए रखता है और पूर्ण अस्तित्व-विनाश का अनावश्यक दार्शनिक दावा नहीं करता।
- source_word: וְיֹאבְדוּ
  choice: नष्ट हो जाएँगे
  rationale: Qal रूप का अकर्मक परिणाम सुरक्षित है; अनुवाद यह नहीं जोड़ता कि उन्हें किस साधन से नष्ट किया जाएगा।
- source_word: אַנְשֵׁי רִיבֶךָ
  choice: तुमसे झगड़नेवाले पुरुष
  rationale: “पुरुष” אַנְשֵׁי की स्पष्ट पुल्लिंग संज्ञा को बनाए रखता है, जबकि “झगड़नेवाले” ריב के विवाद और विरोध के अर्थ को सहज हिन्दी में देता है।
theological_decisions:
- issue: אַנְשֵׁי רִיבֶךָ में लिंग-सूचक अभिव्यक्ति
  choice: तुमसे झगड़नेवाले पुरुष
  alternative: तुमसे झगड़नेवाले लोग / तुम्हारे विरोधी
  rationale: हिब्रू में स्पष्ट रूप से पुल्लिंग बहुवचन संज्ञा है; इसलिए बिना संदर्भगत आवश्यकता के उसे लिंग-निरपेक्ष नहीं किया गया।
- issue: יִהְיוּ כְאַיִן में विनाश की प्रकृति
  choice: मानो कुछ भी न रहेंगे
  alternative: मिट जाएँगे / उनका अस्तित्व समाप्त हो जाएगा
  rationale: כְ की तुलना को बनाए रखकर पाठ की अलंकारिक और धर्मवैचारिक गुंजाइश सुरक्षित रखी गई है; इसे अस्तित्व के पूर्ण उन्मूलन के विशिष्ट सिद्धान्त में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, स्पष्ट और गरिमापूर्ण भविष्यवाणी-संबंधी शैली। “लज्जित और अपमानित” हिब्रू समानांतरता को बनाए रखता है; “क्रोध से भड़के हुए” मूल मुहावरे की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
