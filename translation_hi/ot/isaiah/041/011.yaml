review_pass:
  verdict: revise
  source_fidelity: Draft accurately retains the attention particle, the twofold shame language, the hostile anger, the future reversal, and the distinct final clause concerning the men involved in contention. However, “मानो” can imply uncertainty or mere appearance in Hindi; the Hebrew comparative כְ in כְאַיִן is better represented directly as “के समान.”
  naturalness: The register is modern, clear, and suitably elevated. “क्रोध से भड़के हुए” and “तुमसे झगड़नेवाले पुरुष” are natural enough in context. The revised wording makes the middle clause more direct while retaining its poetic comparison.
  terminology: “लज्जित और अपमानित” appropriately preserves the paired verbs. “पुरुष” properly reflects the masculine אַנְשֵׁי without turning the construct phrase into an overly technical expression. “नष्ट हो जाएँगे” suitably renders the intransitive sense of אבד.
  issues:
  - severity: low
    issue: “मानो कुछ भी न रहेंगे” renders כְאַיִן with “मानो.”
    rationale: In modern Hindi, “मानो” may suggest uncertainty, supposition, or only apparent resemblance. The Hebrew is a direct comparison (“as/like nothing”), so “कुछ भी नहीं के समान हो जाएँगे” more clearly preserves both the comparison and the future change of state.
  revised_text: देखो, जितने लोग तुम पर क्रोध से भड़के हुए हैं, वे सब लज्जित और अपमानित होंगे; वे कुछ भी नहीं के समान हो जाएँगे, और तुमसे झगड़नेवाले पुरुष नष्ट हो जाएँगे।
