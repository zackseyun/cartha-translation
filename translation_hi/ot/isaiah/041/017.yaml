reference: Isaiah 41:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הָ/עֲנִיִּ֨ים וְ/הָ/אֶבְיוֹנִ֜ים מְבַקְשִׁ֥ים מַ֨יִם֙ וָ/אַ֔יִן לְשׁוֹנָ֖/ם בַּ/צָּמָ֣א נָשָׁ֑תָּה אֲנִ֤י יְהוָה֙ אֶעֱנֵ֔/ם אֱלֹהֵ֥י יִשְׂרָאֵ֖ל לֹ֥א אֶעֶזְבֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/017.yaml
  text: The poor and needy seek water[a], but there is none; their tongue is parched with thirst. I, Yahweh, will answer them; I, the God of Israel, will not forsake them.
translation:
  language: hi
  text: गरीब और ज़रूरतमंद पानी खोज रहे हैं, पर पानी नहीं है; उनकी जीभ प्यास से सूख गई है। मैं, याहवे,[a] उन्हें उत्तर दूँगा; मैं, इस्राएल का परमेश्वर, उन्हें नहीं त्यागूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का नाम चार व्यंजनों יהוה (YHWH) से लिखा है; इसे परंपरागत रूप से ‘यहोवा’ भी कहा गया है और अनेक अनुवादों में ‘प्रभु’ लिखा जाता है।
    reason: ईश्वरीय नाम के इब्रानी रूप और प्रमुख वैकल्पिक प्रस्तुतियों को स्पष्ट करना।
lexical_decisions:
- source_word: הָעֲנִיִּים וְהָאֶבְיוֹנִים
  choice: गरीब और ज़रूरतमंद
  rationale: दोनों शब्द अभावग्रस्त लोगों को समानांतर रूप में प्रस्तुत करते हैं। ‘गरीब’ आर्थिक दीनता को और ‘ज़रूरतमंद’ किसी आवश्यक वस्तु के अभाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מְבַקְשִׁים מַיִם
  choice: पानी खोज रहे हैं
  rationale: इब्रानी कृदंत जारी क्रिया को दर्शाता है; हिन्दी का वर्तमान प्रगतिशील रूप उस जीवंत, निरंतर खोज को स्पष्ट रखता है।
- source_word: וָאַיִן
  choice: पर पानी कहीं नहीं है
  rationale: अस्तित्व के अभाव को बताने वाले इब्रानी पद का आशय यहाँ खोजे जा रहे पानी का न मिलना है। संज्ञा को दोहराना हिन्दी में संदर्भ को साफ और स्वाभाविक बनाता है।
- source_word: לְשׁוֹנָם בַּצָּמָא נָשָׁתָּה
  choice: प्यास से उनकी जीभ सूख गई है
  rationale: एकवचन ‘जीभ’ इब्रानी के सामूहिक एकवचन को बनाए रखता है। ‘प्यास से’ कारण/परिस्थिति को और ‘सूख गई है’ पूर्ण हुई अवस्था के वर्तमान परिणाम को सहज हिन्दी में व्यक्त करता है।
- source_word: אֲנִי יְהוָה
  choice: मैं, याहवे
  rationale: स्वतंत्र सर्वनाम का बल बनाए रखने के लिए ‘मैं’ रखा गया है और चार अक्षरों वाले वाचा-नाम को व्यक्तिगत नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: אֶעֱנֵם
  choice: उन्हें उत्तर दूँगा
  rationale: क्रिया ענה का सीधा अर्थ ‘उत्तर देना’ है। पाठ में पुकार का स्पष्ट उल्लेख न होने के कारण उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: मैं, इस्राएल का परमेश्वर
  rationale: दूसरे समानांतर आत्म-उल्लेख को स्पष्ट करने के लिए हिन्दी में ‘मैं’ दोहराया गया है; इससे मूल का जोर और काव्यात्मक संतुलन बना रहता है।
- source_word: לֹא אֶעֶזְבֵם
  choice: उन्हें नहीं त्यागूँगा
  rationale: עזב का अर्थ छोड़ना या त्यागना है। ‘त्यागूँगा’ सम्बन्धपरक और वाचागत गंभीरता को संक्षिप्त, प्रतिष्ठित हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं, परमेश्वर का विशिष्ट वाचा-नाम है। ‘याहवे’ प्रचलित विद्वत पुनर्निर्मित उच्चारण का निकट हिन्दी लिप्यंतरण है; पाद-टिप्पणी पाठक को इब्रानी रूप और वैकल्पिक परंपरा से अवगत कराती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक समानांतरता तथा अभाव, प्यास और परमेश्वर के प्रत्युत्तर की जीवंत छवियाँ सुरक्षित हैं; अनावश्यक धार्मिक व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
