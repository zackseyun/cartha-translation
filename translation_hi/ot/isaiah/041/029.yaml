reference: Isaiah 41:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֵ֣ן כֻּלָּ֔/ם אָ֥וֶן אֶ֖פֶס מַעֲשֵׂי/הֶ֑ם ר֥וּחַ וָ/תֹ֖הוּ נִסְכֵּי/הֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/029.yaml
  text: Look[a], all of them are nothing; their works are nothing[b]. Their cast images are wind and emptiness.
translation:
  language: hi
  text: देखो, वे सब व्यर्थ[a] हैं; उनके काम कुछ भी नहीं हैं। उनकी ढली हुई मूर्तियाँ[b] हवा और शून्यता हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निकम्मे” अथवा “मूल्यहीन।” इब्रानी शब्द का अर्थ अनर्थ या दुष्टता भी हो सकता है, पर यहाँ मुख्य बल असारता पर है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात धातु को पिघलाकर साँचे में ढाली गई प्रतिमाएँ।
    reason: lexical_clarification
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह ध्यान खींचते हुए एक जोरदार निष्कर्ष प्रस्तुत करता है; ‘देखो’ आधुनिक हिन्दी में स्वाभाविक है और मूल का बल बनाए रखता है।
- source_word: כֻּלָּם
  choice: वे सब
  rationale: बहुवचन सर्वनाम का स्पष्ट सामूहिक भाव बनाए रखता है और संदर्भ में मूर्तियों तथा उनसे जुड़ी व्यवस्था की ओर संकेत खुला छोड़ता है।
- source_word: אָוֶן
  choice: व्यर्थ
  rationale: इस मूर्ति-विरोधी संदर्भ में शब्द का मुख्य बल निकम्मेपन और मूल्यहीनता पर है; ‘व्यर्थ’ स्वाभाविक हिन्दी में इस अर्थ को स्पष्ट करता है।
- source_word: אֶפֶס
  choice: कुछ भी नहीं
  rationale: यह उनके कामों की पूर्ण निष्फलता पर बल देता है; हिन्दी में विधेय के रूप में यह स्पष्ट और मुहावरेदार है।
- source_word: מַעֲשֵׂיהֶם
  choice: उनके काम
  rationale: यह व्यापक अभिव्यक्ति उनके किए हुए कार्यों और बनाई हुई वस्तुओं, दोनों के संभावित संकेत को अनावश्यक रूप से सीमित नहीं करती।
- source_word: רוּחַ
  choice: हवा
  rationale: תֹהוּ के साथ समानांतर प्रयोग में यह असारता और पकड़ में न आने वाली वस्तु को दर्शाता है; ‘आत्मा’ यहाँ भ्रामक धार्मिक अर्थ दे सकता था।
- source_word: תֹהוּ
  choice: शून्यता
  rationale: यहाँ अर्थ असारता और रिक्तता है, न कि आवश्यक रूप से आदिकालीन अव्यवस्था; ‘शून्यता’ काव्यात्मक समानांतरता बनाए रखती है।
- source_word: נִסְכֵּיהֶם
  choice: उनकी ढली हुई मूर्तियाँ
  rationale: यह ढालकर बनाई गई, विशेषतः धातु की, प्रतिमाओं का संकेत देता है; यह रूप आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: निंदा का संदर्भ
  choice: वचन मूर्तियों और उनसे जुड़े कामों को व्यर्थ और असार ठहराता है, पर बहुवचन संदर्भ को अत्यधिक सीमित नहीं करता।
  alternative: इसे मूर्ति बनाने वालों और उनकी मूर्तियों—दोनों—की संयुक्त निंदा के रूप में स्पष्ट करना।
  rationale: निकटवर्ती प्रसंग मूर्तियों की असमर्थता पर केंद्रित है, और अंतिम पदबंध ढली हुई मूर्तियों को स्पष्ट करता है; फिर भी बहुवचन प्रत्यय पूरे मूर्ति-तंत्र को समेट सकते हैं, इसलिए अनुवाद मूल की व्यापकता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। ‘व्यर्थ’, ‘हवा’ और ‘शून्यता’ मूल की तीखी समानांतरता और मूर्ति-विरोधी अलंकार को बनाए रखते हैं।
