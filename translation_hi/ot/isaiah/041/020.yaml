  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לְמַ֧עַן יִרְא֣וּ וְ/יֵדְע֗וּ וְ/יָשִׂ֤ימוּ וְ/יַשְׂכִּ֨ילוּ֙ יַחְדָּ֔ו כִּ֥י יַד יְהוָ֖ה עָ֣שְׂתָה זֹּ֑את וּ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל בְּרָאָֽ/הּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/020.yaml
  text: so that they may see and know[a], and may consider and understand together, that the hand of Yahweh has done this, and the Holy One of Israel has created it.
translation:
  language: hi
  text: ताकि वे देखें और जानें, मन में विचार करें और एक साथ समझें[a] कि यहोवा के हाथ ने यह किया है और इस्राएल के पवित्र ने इसे रचा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मन में रखें और अंतर्दृष्टि प्राप्त करें।” इब्रानी क्रियाओं में मन में रखने या विचार करने तथा अंतर्दृष्टि प्राप्त करने के भाव हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य अथवा परिणाम का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יִרְאוּ וְיֵדְעוּ
  choice: वे देखें और जानें
  rationale: दोनों मूल क्रियाओं के प्रत्यक्ष और ज्ञानात्मक भाव तथा उनकी क्रमबद्धता को बनाए रखता है।
- source_word: וְיָשִׂימוּ
  choice: मन लगाकर विचार करें
  rationale: सिर्फ़ ‘रखना’ कहने के बजाय यहाँ निहित मानसिक ध्यान और अंतर्मुखी विचार का भाव व्यक्त करता है।
- source_word: וְיַשְׂכִּילוּ יַחְדָּו
  choice: सब मिलकर समझें
  rationale: שׂכל के अंतर्दृष्टिपूर्ण समझने के भाव और יַחְדָּו के सामूहिक अर्थ को सहज हिन्दी में रखता है।
- source_word: יַד יְהוָה
  choice: यहोवा के हाथ
  rationale: ईश्वरीय सामर्थ्य और कर्तृत्व बताने वाले इब्रानी मानवीकरण को औपचारिक रूप से सुरक्षित रखता है।
- source_word: עָשְׂתָה זֹּאת
  choice: यह काम ... किया है
  rationale: עשה के व्यापक ‘करना’ अर्थ और זֹאת के संकेत को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּקְדוֹשׁ יִשְׂרָאֵל
  choice: और ... इस्राएल के पवित्र परमेश्वर
  rationale: यशायाह में प्रयुक्त ईश्वरीय उपाधि को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है; ‘परमेश्वर’ हिन्दी में उपाधि के आशय को सहज बनाता है।
- source_word: בְּרָאָהּ
  choice: इसे ... रचा है
  rationale: ברא की सृजनात्मक शक्ति को ‘रचा’ व्यक्त करता है और स्त्रीलिंग प्रत्यय को पूर्ववर्ती ‘यह काम’ के संदर्भ में ‘इसे’ से ग्रहण करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में आए विशिष्ट वाचा-नाम को किसी उपाधि में बदलने के बजाय हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- issue: ‘किया’ और ‘रचा’ का संबंध
  choice: दोनों अलग क्रियाएँ बनाए रखी गईं
  alternative: दोनों को एक ही क्रिया में मिला देना
  rationale: मूल के עשה और ברא अलग-अलग हैं; दोनों को बनाए रखने से ईश्वरीय कर्तृत्व की आलंकारिक पूर्णता सुरक्षित रहती है।
- issue: चार ज्ञानात्मक क्रियाओं की प्रगति
  choice: देखें / जानें / मन लगाकर विचार करें / समझें
  alternative: देखें / पहचानें / मन में रखें / अंतर्दृष्टि पाएँ
  rationale: मूल की क्रमिक और कुछ हद तक अतिव्यापी क्रियाओं को बिना कृत्रिम doctrinal भेद बनाए पठनीय हिन्दी में अलग रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सामान्य पाठक के लिए सहज। इब्रानी की चार क्रियाओं, ‘हाथ’ के मानवीकरण और ‘किया/रचा’ के समानांतरपन को सुरक्षित रखा गया है।
