source:
  edition: WLC
  text: תְּבַקְשֵׁ/ם֙ וְ/לֹ֣א תִמְצָאֵ֔/ם אַנְשֵׁ֖י מַצֻּתֶ֑/ךָ יִהְי֥וּ כְ/אַ֛יִן וּ/כְ/אֶ֖פֶס אַנְשֵׁ֥י מִלְחַמְתֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/012.yaml
  text: You will seek them and not find them—those men who contend with you[a]. The men who wage war against you will become like nothing[b], like nonexistence.
translation:
  language: hi
  text: तू उन लोगों को ढूँढ़ेगा जो तुझसे झगड़ते हैं[a], पर उन्हें पाएगा नहीं। तुझसे युद्ध करने वाले लोग कुछ न के समान[b] और शून्य के समान हो जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरे झगड़े के लोग’; अर्थात वे जो तुझसे विवाद या झगड़ा करते हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘कुछ न के समान और אֶפֶס के समान’; दूसरे शब्द का अनुवाद ‘पूर्ण शून्यता’ या ‘बिलकुल कुछ नहीं’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּבַקְשֵׁם
  choice: तू उन्हें ढूँढ़ेगा
  rationale: בקש के पिएल रूप का अर्थ खोजने या ढूँढ़ने का प्रयत्न करना है। ‘ढूँढ़ेगा’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और आगे आने वाले ‘पाएगा नहीं’ के साथ स्पष्ट समानता बनाता है।
- source_word: וְלֹא תִמְצָאֵם
  choice: पर पाएगा नहीं
  rationale: מצא का मूल अर्थ ‘पाना’ है। हिन्दी में विरोधात्मक परिणाम स्पष्ट करने के लिए वाव को ‘पर’ से व्यक्त किया गया है; कर्म ‘उन्हें’ को अनावश्यक रूप से दोहराया नहीं गया।
- source_word: אַנְשֵׁי מַצֻּתֶךָ
  choice: उन लोगों को जो तुझसे झगड़ते हैं
  rationale: शाब्दिक रचना ‘तेरे झगड़े के लोग’ है। מַצּוּת झगड़े, विवाद या संघर्ष को सूचित करता है; सम्बन्धवाचक उपवाक्य हिन्दी में अर्थ को स्वाभाविक और व्यक्तिगत बनाए रखता है।
- source_word: יִהְיוּ
  choice: हो जाएँगे
  rationale: היה का अर्थ ‘होना’ या ‘हो जाना’ हो सकता है। शत्रुओं की वर्तमान दशा से उनके मिट जाने जैसी दशा में परिवर्तन के सन्दर्भ में ‘हो जाएँगे’ उपयुक्त है।
- source_word: כְאַיִן
  choice: कुछ न के समान
  rationale: אַיִן अभाव या ‘कुछ भी नहीं’ को व्यक्त करता है और כְ की तुलना को ‘के समान’ से सुरक्षित रखा गया है।
- source_word: וּכְאֶפֶס
  choice: और शून्य के समान
  rationale: אֶפֶס शून्यता, पूर्ण अभाव या नगण्यता दर्शा सकता है। ‘शून्य’ पहले पद से निकट सम्बन्ध रखते हुए भी दोनों इब्रानी शब्दों को एक ही हिन्दी शब्द में समतल नहीं करता।
- source_word: אַנְשֵׁי מִלְחַמְתֶּךָ
  choice: तुझसे युद्ध करनेवाले लोग
  rationale: शाब्दिक अर्थ ‘तेरे युद्ध के लोग’ है, अर्थात वे लोग जो तेरे विरुद्ध युद्ध करते हैं। चुनी हुई अभिव्यक्ति इस सम्बन्ध को सहज हिन्दी में स्पष्ट करती है।
theological_decisions:
- issue: शत्रुओं के पूर्ण लोप को व्यक्त करने वाले दो समानान्तर पद
  choice: ‘कुछ न के समान और शून्य के समान’—दो अलग किन्तु निकटार्थी अभिव्यक्तियाँ
  alternative: दोनों पदों को केवल ‘कुछ भी नहीं’ कहना, या व्याख्यात्मक रूप से ‘पूरी तरह मिट जाएँगे’ कहना
  rationale: यह चयन इब्रानी काव्य की तुलना और तीव्र होती समानान्तरता को बनाए रखता है। साथ ही यह कथन को शत्रुओं के आध्यात्मिक या तत्त्वमीमांसात्मक विनाश की निश्चित घोषणा बनाकर मूल की काव्यात्मक भाषा से आगे नहीं जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में एकवचन आत्मीय सम्बोधन ‘तू/तुझसे’ रखा गया है, जो इब्रानी के एकवचन सम्बोधन को दर्शाता है। भाषा साधारण पाठक के लिए स्पष्ट है, पर भविष्यवाणी की गरिमा और काव्यात्मक समानान्तरता भी बनाए रखती है।
