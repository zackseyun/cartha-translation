  terminology: ‘झगड़ते हैं’ suitably conveys contention, and ‘युद्ध करने वाले’ conveys those who wage war. ‘कुछ न के समान’ and ‘शून्य के समान’ preserve the distinct, closely parallel expressions without overstating them.
