source:
  edition: WLC
  text: הַעִיר֤וֹתִי מִ/צָּפוֹן֙ וַ/יַּ֔את מִ/מִּזְרַח שֶׁ֖מֶשׁ יִקְרָ֣א בִ/שְׁמִ֑/י וְ/יָבֹ֤א סְגָנִים֙ כְּמוֹ חֹ֔מֶר וּ/כְמ֥וֹ יוֹצֵ֖ר יִרְמָס טִֽיט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/025.yaml
  text: I have stirred up one from the north[a], and he has come; from the rising of the sun he calls on my name. He will come upon rulers as upon clay[c][b], and like a potter he treads mud.
translation:
  language: hi
  text: मैंने उत्तर से एक जन[c] को उठाया है, और वह आया है; सूर्य के उदय से[a] वह मेरा नाम पुकारता है[b]। वह शासकों पर चढ़ आएगा—मानो वे गारा हों—और उन्हें वैसे रौंदेगा जैसे कुम्हार कीचड़ को रौंदता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, पूर्व से; इब्रानी में शाब्दिक रूप से, ‘सूर्य के उदय से’।
    reason: lexical_alternative
  - marker: b
    text: ‘मेरा नाम पुकारता है’ का अनुवाद ‘मेरे नाम का आह्वान करता है’ या ‘मेरे नाम की घोषणा करता है’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: परमेश्वर द्वारा उठाया गया यह व्यक्ति प्रायः कुरूश समझा जाता है; इस पद के इब्रानी पाठ में उसका नाम नहीं दिया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: הַעִירוֹתִי
  choice: मैंने ... उभारा है
  rationale: हिफ़ील रूप यहाँ किसी व्यक्ति को कार्य के लिए उठाने या सक्रिय करने में परमेश्वर की पहल व्यक्त करता है। ‘उभारा है’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से उसके जागने या सैन्य नियुक्ति का अर्थ नहीं जोड़ता।
- source_word: מִצָּפוֹן
  choice: उत्तर दिशा से
  rationale: यह स्पष्ट दिशासूचक पद है; ‘उत्तर दिशा से’ साधारण पाठक के लिए सहज और मूल के निकट है।
- source_word: וַיַּאת
  choice: और वह आ गया है
  rationale: पूर्ण क्रिया के बाद यह रूप आरम्भ किए गए कार्य के परिणाम को सामने रखता है। हिन्दी का पूर्ण पक्ष भविष्यवाणी में घटना की सुनिश्चितता और परिणति दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: सूर्य के उदय की ओर से
  rationale: शाब्दिक बिंब ‘सूर्य के उदय’ को बनाए रखा गया है; इसका दिशात्मक अर्थ ‘पूर्व से’ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: יִקְרָא בִשְׁמִי
  choice: वह मेरा नाम पुकारता है
  rationale: קרא בשם का अर्थ किसी के नाम को पुकारना, उसका आह्वान करना, या कभी उसका नाम घोषित करना हो सकता है। ‘मेरा नाम पुकारता है’ मूल मुहावरे और उसकी धार्मिक अस्पष्टता को बनाए रखता है।
- source_word: וְיָבֹא סְגָנִים
  choice: वह शासकों पर ... चढ़ आएगा
  rationale: סְגָנִים उच्च अधिकारियों या शासकों को सूचित करता है। प्रसंग में בוא उनके विरुद्ध बढ़ने का भाव रखता है; ‘चढ़ आएगा’ आक्रामक गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כְּמוֹ חֹמֶר
  choice: जैसे गारे पर
  rationale: חֹמֶר यहाँ मिट्टी या गारे को सूचित करता है। ‘गारा’ अगले टुकड़े की गीली मिट्टी से संबद्ध बिंब बनाए रखता है और शासकों पर आसानी से चढ़ आने की उपमा को व्यक्त करता है।
- source_word: וּכְמוֹ יוֹצֵר יִרְמָס טִיט
  choice: और जैसे कुम्हार गीली मिट्टी को रौंदता है
  rationale: יוֹצֵר के लिए ‘कुम्हार’ सहज समतुल्य है। רמס में पैरों से रौंदने का बल है और טיט गीली मिट्टी या कीचड़ है; कुम्हार के प्रसंग में ‘गीली मिट्टी’ सबसे स्पष्ट है।
theological_decisions:
- issue: परमेश्वर द्वारा उभारे गए व्यक्ति की पहचान
  choice: मुख्य पाठ में उसे केवल ‘एक जन’ कहा गया है और उसका नाम नहीं जोड़ा गया।
  alternative: उसे सीधे कुस्रू के रूप में पहचानना।
  rationale: व्यापक साहित्यिक प्रसंग में इस व्यक्ति को प्रायः कुस्रू समझा जाता है, पर इस पद का इब्रानी पाठ उसका नाम नहीं बताता। पादटिप्पणी संभावित पहचान बताती है, जबकि मुख्य पाठ मूल की अनिर्दिष्टता बनाए रखता है।
- issue: ‘मेरा नाम पुकारता है’ में उस व्यक्ति की धार्मिक मुद्रा
  choice: मुहावरे का सीधा अनुवाद रखा गया है, बिना यह तय किए कि वह सच्ची आराधना, आह्वान, या सार्वजनिक घोषणा है।
  alternative: ‘मेरी आराधना करता है’, ‘मेरा आह्वान करता है’, या ‘मेरे नाम की घोषणा करता है’।
  rationale: इब्रानी קרא בשם इन अर्थ-छायाओं को वहन कर सकता है। किसी एक को मुख्य पाठ में निश्चित करने से उस व्यक्ति की भक्ति के विषय में मूल से अधिक कहा जाता।
- issue: उत्तर और सूर्य के उदय की दिशा का संबंध
  choice: दोनों दिशात्मक पदों को ज्यों का त्यों रखा गया है।
  alternative: दोनों को केवल पूर्व की ओर संकेत मानकर समरूप कर देना या किसी एक दिशा को रूपक बना देना।
  rationale: पद स्वयं ‘उत्तर से’ और ‘सूर्य के उदय की ओर से’ दोनों कहता है। भौगोलिक या ऐतिहासिक सामंजस्य थोपने के बजाय पाठ का तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘एक जन’, ‘उभारा’, ‘चढ़ आएगा’ और कुम्हार का ठोस बिंब साहित्यिक ऊँचाई बनाए रखते हैं, पर अत्यधिक संस्कृतनिष्ठ या सांप्रदायिक शब्दावली से बचते हैं।
