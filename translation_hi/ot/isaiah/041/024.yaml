id: ISA.41.24
reference: Isaiah 41:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֵן אַתֶּ֣ם מֵ/אַ֔יִן וּ/פָעָלְ/כֶ֖ם מֵ/אָ֑פַע תּוֹעֵבָ֖ה יִבְחַ֥ר בָּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/024.yaml
  text: Look[a], you are from nothing, and your work is from nonexistence; whoever chooses you is an abomination.
translation:
  language: hi
  text: देखो, तुम कुछ भी नहीं हो, और तुम्हारा काम शून्य से भी कम है[a]; जो तुम्हें चुनता है, वह घृणित है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द दुर्लभ और कठिन है; इसका अर्थ सम्भवतः “अस्तित्वहीनता से” या “कुछ भी नहीं” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह विस्मयादिबोधक शब्द एक जोरदार घोषणा आरम्भ करता है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक है और मूल का बल बनाए रखता है।
- source_word: מֵאַיִן
  choice: कुछ भी नहीं
  rationale: मूर्ति-विरोधी प्रसंग में यह अस्तित्वहीनता और पूर्ण तुच्छता का बोध कराता है। शाब्दिक ‘कुछ नहीं से’ की अपेक्षा ‘कुछ भी नहीं हो’ हिन्दी में अर्थ को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּפָעָלְכֶם
  choice: और तुम्हारा काम
  rationale: यह मूर्तियों के कार्य, प्रभाव या उनसे जुड़े कृत्य को व्यापक रूप से व्यक्त करता है और इब्रानी समानांतरता को बनाए रखता है।
- source_word: מֵאָפַע
  choice: शून्य से भी कम
  rationale: यह शब्द दुर्लभ और अर्थ की दृष्टि से कठिन है। समानांतर מֵאַיִן और प्रसंग में यह पूर्ण निरर्थकता को तीव्र करता जान पड़ता है; अनिश्चितता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: תּוֹעֵבָה
  choice: घृणित
  rationale: यह प्रबल नैतिक और धार्मिक घृणा व्यक्त करता है। ‘घृणित’ आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल की कठोर निन्दा को बनाए रखता है।
- source_word: יִבְחַר בָּכֶם
  choice: जो तुम्हें चुनता है
  rationale: एकवचन क्रिया यहाँ सामान्य अर्थ में ऐसे किसी भी व्यक्ति की ओर संकेत करती है जो इन मूर्तियों को चुनता या प्राथमिकता देता है।
theological_decisions:
- issue: द्वितीय पुरुष बहुवचन ‘तुम’ का संदर्भ
  choice: ‘तुम’ आसपास के प्रसंग में ललकारी जा रही मूर्तियों अथवा देवताओं को सम्बोधित करता है।
  alternative: इसे लक्षणा द्वारा मूर्ति बनाने वालों को सम्बोधित माना जा सकता है।
  rationale: निकटवर्ती प्रसंग राष्ट्रों के देवताओं और मूर्तियों को घोषणा तथा कार्य करने की चुनौती देता है, और अन्तिम उपवाक्य उन्हें चुनने वाले व्यक्ति की निन्दा करता है। सीधे सर्वनाम बनाए रखने से भविष्यद्वक्ता का व्यंग्य बिना अतिरिक्त व्याख्या के सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। भविष्यद्वक्ता की तीखी, उपहासपूर्ण निन्दा को सीधे सम्बोधन और संक्षिप्त वाक्य-विन्यास द्वारा बनाए रखा गया है।
