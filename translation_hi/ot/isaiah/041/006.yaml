lexical_decisions:
- source_word: אִישׁ
  choice: हर एक
  rationale: एकवचन संज्ञा यहाँ वितरणात्मक और सामूहिक अर्थ में है। ‘हर एक’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना अनावश्यक रूप से केवल पुरुषों तक सीमित किए।
- source_word: אֶת רֵעֵהוּ
  choice: अपने साथी की
  rationale: רֵעַ का अर्थ साथी, संगी, मित्र या पड़ोसी हो सकता है। प्रसंग में परस्पर सहयोग दिखाने के लिए ‘साथी’ व्यापक और स्वाभाविक है; अन्य सम्भावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: יַעְזֹרוּ
  choice: सहायता करता है
  rationale: बहुवचन अपूर्ण क्रिया सामूहिक-वितरणात्मक कर्ता से मेल खाती है और यहाँ दृश्य का सामान्य अथवा सजीव वर्णन करती है; इसलिए वर्तमानकालीन हिन्दी उपयुक्त है।
- source_word: וּלְאָחִיו
  choice: और अपने भाई से
  rationale: אָח का सीधा अर्थ ‘भाई’ है, यद्यपि इसका व्यापक अर्थ संबंधी या समुदाय का साथी भी हो सकता है। मुख्य पाठ में सीधा अर्थ रखा गया है।
- source_word: יֹאמַר
  choice: कहता है
  rationale: यह अपूर्ण क्रिया पूर्ववर्ती क्रिया के समान सजीव या सामान्य वर्तमान का भाव देती है।
- source_word: חֲזָק
  choice: मज़बूत बनो!
  rationale: חזק का आदेश शक्ति, दृढ़ता या साहस धारण करने का आह्वान है। ‘मज़बूत बनो’ प्रत्यक्ष, समझने योग्य और आदेशात्मक बल को बनाए रखता है।
