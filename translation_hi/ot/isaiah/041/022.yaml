  text: יַגִּ֨ישׁוּ֙ וְ/יַגִּ֣ידוּ לָ֔/נוּ אֵ֖ת אֲשֶׁ֣ר תִּקְרֶ֑ינָה הָ/רִאשֹׁנ֣וֹת מָ֣ה הֵ֗נָּה הַגִּ֜ידוּ וְ/נָשִׂ֤ימָה לִבֵּ֨/נוּ֙ וְ/נֵדְעָ֣ה אַחֲרִיתָ֔/ן א֥וֹ הַ/בָּא֖וֹת הַשְׁמִיעֻֽ/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/022.yaml
  text: Let them bring them forward and tell us what will happen[a]. Tell us the former things—what they are—that we may set our heart on them and know their outcome[c][b]; or declare to us the things to come.
translation:
  language: hi
  text: वे उन्हें आगे लाएँ और हमें बताएँ कि क्या होनेवाला है।[a] पहले की बातें क्या हैं, यह बताएँ, ताकि हम उन पर मन लगाएँ[b] और उनका परिणाम जानें;[c] या आनेवाली बातें हमें सुनाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वे उन्हें प्रस्तुत करें और हमें बताएँ कि क्या घटित होगा।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘हम अपना हृदय लगाएँ’; इस मुहावरे का अर्थ ध्यानपूर्वक विचार करना है।
    reason: cultural_note
  - marker: c
    text: या ‘उनका अंत जानें।’
    reason: lexical_alternative
lexical_decisions:
- source_word: יַגִּישׁוּ
  choice: वे उन्हें आगे लाएँ
  rationale: नגשׁ के हिफ़ील रूप में यहाँ न्यायालय-जैसी चुनौती के भीतर मूर्तियों अथवा उनके प्रमाणों को प्रस्तुत करने का भाव है। संदर्भ से निहित कर्म को हिन्दी में स्पष्ट किया गया है।
- source_word: וְיַגִּידוּ / הַגִּידוּ
  choice: हमें बताएँ / यह बताओ
  rationale: נגד के हिफ़ील का सामान्य अर्थ बताना या घोषित करना है। आधुनिक हिन्दी में ‘बताना’ स्वाभाविक है और दोनों रूपों के बीच शब्दगत संबंध बनाए रखता है।
- source_word: אֵת אֲשֶׁר תִּקְרֶינָה
  choice: क्या होनेवाला है
  rationale: קרה होने या घटित होने को दर्शाता है। हिन्दी में यह संक्षिप्त अभिव्यक्ति निहित बहुवचन घटनाओं का सहज रूप से प्रतिनिधित्व करती है।
- source_word: הָרִאשֹׁנוֹת מָה הֵנָּה
  choice: पहले की बातें क्या थीं
  rationale: ראשׁון यहाँ पूर्व घटनाओं को सूचित करता है। इब्रानी का शब्दशः प्रश्न ‘वे क्या हैं?’ है; कालगत संदर्भ के कारण हिन्दी में ‘क्या थीं’ अधिक स्वाभाविक है, जबकि पहचान बताने की चुनौती बनी रहती है।
- source_word: וְנָשִׂימָה לִבֵּנוּ
  choice: ताकि हम उन पर मन लगाएँ
  rationale: ‘हृदय रखना’ ध्यानपूर्वक विचार करने का इब्रानी मुहावरा है। ‘मन लगाना’ हिन्दी में उसी मानसिक एकाग्रता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְנֵדְעָה אַחֲרִיתָן
  choice: और जानें कि उनका परिणाम क्या हुआ
  rationale: אַחֲרִית का अर्थ अंत, उत्तरकाल या परिणाम हो सकता है। ‘परिणाम’ तत्काल संदर्भ में स्पष्ट है और अनावश्यक रूप से अंतकालीन अर्थ नहीं जोड़ता।
- source_word: אוֹ הַבָּאוֹת
  choice: या आनेवाली बातें
  rationale: בוא का कृदन्त रूप आनेवाली घटनाओं को दर्शाता है और ‘पहले की बातें’ के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: הַשְׁמִיעֻנוּ
  choice: हमें सुनाओ
  rationale: שׁמע के हिफ़ील का शब्दशः भाव ‘हमें सुनने दो/सुनाओ’ है और संदर्भ में घोषणा करना अभिप्रेत है। ‘सुनाओ’ मूल श्रवण-चित्र को भी बचाता है और हिन्दी में स्वाभाविक है।
