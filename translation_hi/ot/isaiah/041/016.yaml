base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/016.yaml
  text: You will winnow them[a], and the wind will carry them away, and the storm will scatter them; but you will rejoice in Yahweh[c][b]; in the Holy One of Israel you will boast.
translation:
  language: hi
  text: तू उन्हें फटकेगा[a]; हवा उन्हें उड़ा ले जाएगी, और आँधी उन्हें तितर-बितर कर देगी। पर तू याहवे[b] में आनन्दित होगा; तू इस्राएल के पवित्र परमेश्वर में गौरव करेगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू उन्हें बिखेर देगा।” इब्रानी क्रिया सामान्य रूप से बिखेरने का अर्थ भी दे सकती है, पर यहाँ पिछले पद के दाँवने के बिंब के कारण “फटकेगा” रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में परमेश्वर का नाम יהוה (YHWH) है।
    reason: alternative_reading
  - marker: c
    text: या, “तू इस्राएल के पवित्र परमेश्वर पर गर्व करेगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּזְרֵם
  choice: तू उन्हें फटकेगा
  rationale: זרה यहाँ अनाज फटकने का बिंब रखता है; पिछले पद के दाँवने के प्रसंग में ‘फटकना’ सामान्य ‘बिखेरना’ से अधिक सटीक है।
- source_word: רוּחַ
  choice: हवा
  rationale: आँधी के समानांतर प्रयोग और उड़ा ले जाने की क्रिया से यहाँ मौसम-संबंधी अर्थ स्पष्ट है।
- source_word: תִּשָּׂאֵם
  choice: उन्हें उड़ा ले जाएगी
  rationale: נשׂא का मूल भाव उठाना या ले जाना है; भूसी के बिंब में ‘उड़ा ले जाना’ परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: סְעָרָה
  choice: आँधी
  rationale: यह प्रचण्ड वायु-तूफान का द्योतक है; ‘आँधी’ आधुनिक हिन्दी में संक्षिप्त और प्रसंगानुकूल है।
- source_word: תָּפִיץ
  choice: तितर-बितर कर देगी
  rationale: פוץ के हिफ़ील रूप का अर्थ बिखेर देना है; यह शत्रुओं के भूसी की तरह फैल जाने का बिंब स्पष्ट करता है।
- source_word: תָּגִיל
  choice: आनन्दित होगा
  rationale: גיל उल्लासपूर्ण आनन्द बताता है; ‘आनन्दित होगा’ गरिमापूर्ण और सहज है।
- source_word: בַּיהוָה
  choice: यहोवा में
  rationale: יהוה को हिन्दी में प्रचलित ध्वन्यात्मक रूप ‘यहोवा’ से व्यक्त किया गया है और ב की समानांतर रचना बनाए रखी गई है।
- source_word: בִּקְדוֹשׁ יִשְׂרָאֵל
  choice: इस्राएल के पवित्र परमेश्वर पर
  rationale: यशायाह की प्रमुख ईश्वरीय उपाधि को पूर्णतः रखा गया है; हिन्दी में गर्व करने के साथ ‘पर’ स्वाभाविक संबंधसूचक है।
- source_word: תִּתְהַלָּל
  choice: गर्व करेगा
  rationale: הלל के हितपएल में स्वयं को गौरवान्वित समझने अथवा गर्व करने का भाव है; यहाँ गर्व का आधार परमेश्वर है, आत्मश्लाघा नहीं।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा का व्यक्तिगत नाम सीधे आया है; उसे उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी पाठकों में परिचित नामरूप ‘यहोवा’ रखा गया है, और वैकल्पिक उच्चारण पादटिप्पणी में दिया गया है।
- issue: תִּתְהַלָּל की गर्व-संबंधी भाषा
  choice: गर्व करेगा
  alternative: महिमा करेगा / गौरवान्वित होगा
  rationale: यहाँ भाव पापपूर्ण आत्म-अभिमान नहीं, बल्कि उद्धारकर्ता परमेश्वर को अपने आनन्द और गौरव का आधार मानना है; ‘गर्व करेगा’ मूल की तीक्ष्णता बनाए रखता है।
- issue: समानांतर בַּיהוָה और בִּקְדוֹשׁ יִשְׂרָאֵל
  choice: यहोवा में … इस्राएल के पवित्र परमेश्वर पर
  alternative: यहोवा में … इस्राएल के पवित्र परमेश्वर में
  rationale: दोनों पद एक ही परमेश्वर की ओर संकेत करते हैं। पहले में ‘में’ मूल समानांतरता को निकटता से रखता है, जबकि दूसरे में ‘गर्व करना’ के साथ स्वाभाविक हिन्दी के लिए ‘पर’ चुना गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, एकवचन निकट संबोधन ‘तू’, और भविष्यकाल रखा गया है। भाषा गरिमापूर्ण पर सामान्य पाठक के लिए सहज है। दाँवने–फटकने–हवा में उड़ने का कृषि-बिंब सुरक्षित रखा गया है; अन्तिम दो खंडों की काव्यात्मक समानांतरता भी यथासंभव बनाए रखी गई है।
