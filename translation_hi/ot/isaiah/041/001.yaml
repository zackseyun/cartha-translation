id: ISA.41.1
reference: Isaiah 41:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַחֲרִ֤ישׁוּ אֵלַ/י֙ אִיִּ֔ים וּ/לְאֻמִּ֖ים יַחֲלִ֣יפוּ כֹ֑חַ יִגְּשׁוּ֙ אָ֣ז יְדַבֵּ֔רוּ יַחְדָּ֖ו לַ/מִּשְׁפָּ֥ט נִקְרָֽבָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/001.yaml
  text: Be silent before me[a], coastlands; let the peoples renew their strength. Let them come near; then let them speak[c][b]. Together let us draw near for judgment.
translation:
  language: hi
  text: हे द्वीप-प्रदेशों, मेरे सामने चुप रहो[a]; और लोग अपनी शक्ति फिर से प्राप्त करें[b]। वे पास आएँ, तब बोलें। आओ, हम मिलकर न्याय के लिए निकट आएँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘द्वीप-प्रदेशों’ का अर्थ ‘द्वीप’, ‘समुद्रपारीय प्रदेश’ या ‘दूरस्थ तटवर्ती देश’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी मुहावरे का अर्थ ‘अपनी शक्ति नई करें’ या ‘नई शक्ति प्राप्त करें’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘न्याय के लिए’ में न्यायिक विवाद या निर्णय के लिए एकत्र होने का भाव है; इब्रानी पाठ यह नहीं बताता कि कार्यवाही का ठीक स्वरूप क्या है।
    reason: cultural_note
lexical_decisions:
- source_word: הַחֲרִישׁוּ אֵלַי
  choice: मेरे सामने चुप रहो
  rationale: हिफ़ील बहुवचन आज्ञार्थक यहाँ दैवी संबोधन अथवा न्यायिक बुलावे के सामने मौन रहने की आज्ञा देता है। אֵלַי का शाब्दिक अर्थ ‘मेरी ओर/मेरे पास’ है, पर इस संदर्भ में ‘मेरे सामने’ स्वाभाविक हिन्दी है और सुनने का भाव अनावश्यक रूप से नहीं जोड़ता।
- source_word: אִיִּים
  choice: द्वीप-प्रदेशो
  rationale: यह शब्द केवल छोटे द्वीपों तक सीमित नहीं, बल्कि समुद्रपारीय भूभागों और दूरस्थ तटवर्ती देशों को भी सूचित कर सकता है। ‘द्वीप-प्रदेश’ मूल बिंब और व्यापक भौगोलिक अर्थ दोनों को बनाए रखता है।
- source_word: וּלְאֻמִּים
  choice: और देश-देश के लोग
  rationale: बहुवचन לְאֻמִּים विभिन्न जनसमुदायों अथवा राष्ट्रों को दर्शाता है। ‘देश-देश के लोग’ आधुनिक हिन्दी में स्वाभाविक है और समानांतर पंक्ति में संबोधित मानव समुदायों को स्पष्ट करता है।
- source_word: יַחֲלִיפוּ כֹחַ
  choice: अपनी शक्ति नई करें
  rationale: इस इब्रानी मुहावरे में शक्ति को बदलने, नया करने अथवा फिर प्राप्त करने का भाव है। ‘शक्ति नई करें’ मुहावरे की कुछ खुली अर्थ-सीमा रखते हुए सहज हिन्दी देता है।
- source_word: יִגְּשׁוּ אָז יְדַבֵּרוּ
  choice: वे पास आएँ, तब बोलें
  rationale: 'दोनों अपूर्ण क्रियाएँ यहाँ आज्ञार्थक/अनुमतिसूचक बल रखती हैं, और אָז क्रम दिखाता है: पहले पास आना, फिर बोलना।'
- source_word: יַחְדָּו לַמִּשְׁפָּט נִקְרָבָה
  choice: आओ, हम सब मिलकर न्याय के लिए निकट आएँ
  rationale: נִקְרָבָה प्रथम पुरुष बहुवचन कोहोर्टेटिव है; ‘आओ...आएँ’ उसका प्रेरणार्थक बल व्यक्त करता है। מִשְׁפָּט को ‘न्याय’ रखा गया है, जो निर्णय और न्यायिक कार्यवाही दोनों की अर्थ-संभावना बनाए रखता है।
theological_decisions:
- issue: पद का न्यायिक संदर्भ
  choice: दैवी न्यायिक बुलावे की पृष्ठभूमि को शब्दावली और क्रम से प्रकट करना, पर मुख्य पाठ में ‘अदालत’ जैसा विस्तृत रूपक न जोड़ना
  alternative: इसे केवल राष्ट्रों को सुनने के सामान्य आह्वान के रूप में प्रस्तुत करना, या स्पष्ट रूप से ‘अदालत में मुकदमा लड़ने’ का भाव जोड़ना
  rationale: मौन रहना, शक्ति नई करना, पास आना, बोलना और न्याय के लिए निकट आना—यह क्रम न्यायिक विवाद की ओर संकेत करता है। फिर भी मूल पाठ कार्यवाही का सटीक स्वरूप नहीं बताता, इसलिए अनिश्चितता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। संबोधन में ‘हे’ तथा ‘निकट आएँ’ न्यायिक-भविष्यद्वाणी शैली की औपचारिकता रखते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए सीधी है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
