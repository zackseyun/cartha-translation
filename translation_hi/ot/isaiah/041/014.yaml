source:
  edition: WLC
  text: אַל תִּֽירְאִי֙ תּוֹלַ֣עַת יַֽעֲקֹ֔ב מְתֵ֖י יִשְׂרָאֵ֑ל אֲנִ֤י עֲזַרְתִּי/ךְ֙ נְאֻם יְהוָ֔ה וְ/גֹאֲלֵ֖/ךְ קְד֥וֹשׁ יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/014.yaml
  text: Do not fear[a], worm Jacob, men of Israel; I myself help you, declares Yahweh, your Redeemer[c][b], the Holy One of Israel.
translation:
  language: hi
  text: हे कीड़े याकूब, मत डर; हे इस्राएल के नश्वर लोगो,[a] मैं स्वयं तेरी सहायता करूँगा[b]—याहवे की यह घोषणा है—तेरा छुड़ानेवाला, इस्राएल का पवित्र।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “इस्राएल के मनुष्य”; इसका अर्थ “इस्राएल के नश्वर जन” या सामान्यतः “इस्राएल के लोग” भी हो सकता है। यहाँ उनकी दुर्बलता पर बल जान पड़ता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू क्रिया का रूप शाब्दिक रूप से “मैंने तेरी सहायता की है” है; इस भविष्यसूचक आश्वासन में इसका अर्थ “मैं तेरी सहायता करता हूँ” या “करूँगा” भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: मत डर
  rationale: אַל के साथ अपूर्ण क्रिया निषेध व्यक्त करती है। स्त्रीलिंग एकवचन रूप सामूहिक रूप से याकूब/इस्राएल को संबोधित करता है; हिंदी में 'मत डर' इसे स्वाभाविक रूप से बनाए रखता है।
- source_word: תּוֹלַעַת יַעֲקֹב
  choice: हे कीड़े-समान याकूब
  rationale: תּוֹלַעַת का मूल अर्थ 'कीड़ा' है और यहाँ यह निर्बलता तथा दीनता का तीखा रूपक है। '-समान' हिंदी में इसे अपमानसूचक शाब्दिक पहचान समझे जाने से बचाते हुए मूल बिंब बनाए रखता है।
- source_word: מְתֵי יִשְׂרָאֵל
  choice: हे इस्राएल के नश्वर लोगो
  rationale: מְתֵי का अर्थ 'मनुष्य/नश्वर जन' हो सकता है और समानांतर पद में मानवीय दुर्बलता प्रमुख है। 'नश्वर लोगो' इस भाव को आधुनिक हिंदी में स्पष्ट करता है; संबोधन के कारण 'लोगो' प्रयुक्त है।
- source_word: אֲנִי
  choice: मैं स्वयं
  rationale: अलग से आए सर्वनाम אֲנִי पर बल है; 'मैं स्वयं' उस आश्वासनकारी बल को व्यक्त करता है।
- source_word: עֲזַרְתִּיךְ
  choice: तेरी सहायता करूँगा
  rationale: रूप की दृष्टि से यह पूर्णकाल है, पर भविष्यसूचक आश्वासन के प्रसंग में निश्चित भावी सहायता व्यक्त कर सकता है। हिंदी भविष्यकाल प्रसंग में स्वाभाविक है, जबकि पादटिप्पणी कालगत अस्पष्टता सुरक्षित रखती है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: נְאֻם भविष्यद्वक्ताई घोषणा-सूत्र है। יְהוָה को उसके विशिष्ट वाचा-नाम 'याहवे' से लिप्यंतरित किया गया है।
- source_word: וְגֹאֲלֵךְ
  choice: तेरा छुड़ानेवाला
  rationale: גֹאֵל उस निकट संबंधी अथवा संरक्षक को सूचित करता है जो छुड़ाता और अधिकार पुनः स्थापित करता है। 'छुड़ानेवाला' साधारण पाठक के लिए स्पष्ट है, और पादटिप्पणी संबंधी-कुटुंबीय आयाम बताती है।
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: इस्राएल का पवित्र जन
  rationale: यह यशायाह में प्रमुख ईश्वरीय उपाधि है। 'पवित्र जन' व्यक्तिवाचक उपाधि का रूप और गौरव बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला विशिष्ट वाचा-नाम है; 'याहवे' उसे किसी सामान्य उपाधि में बदले बिना प्रस्तुत करता है।
- issue: עֲזַרְתִּיךְ का कालगत बल
  choice: तेरी सहायता करूँगा
  alternative: मैंने तेरी सहायता की है / मैं तेरी सहायता करता हूँ
  rationale: हिब्रू पूर्ण रूप भविष्यसूचक निश्चितता के रूप में समझा जा सकता है। मुख्य पाठ प्रसंगानुकूल भावी आश्वासन देता है, जबकि टिप्पणी औपचारिक भूतकाल और वर्तमान-सदृश संभावना बनाए रखती है।
- issue: גֹאֵל में छुटकारे और संबंधी-दायित्व का आयाम
  choice: छुड़ानेवाला
  alternative: मुक्तिदाता / संबंधी-छुड़ानेवाला
  rationale: यह शब्द उद्धार के साथ निकट संबंधी के रक्षक-दायित्व की पृष्ठभूमि भी रख सकता है। मुख्य पाठ में कोई संकीर्ण धर्मसैद्धांतिक अर्थ आरोपित नहीं किया गया; टिप्पणी व्यापक अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय, सीधा भविष्यद्वक्ताई संबोधन रखा गया है। याकूब/इस्राएल को एक सामूहिक व्यक्ति मानते हुए 'तेरी' और 'डर' के एकवचन रूप प्रयुक्त हैं। दुर्लभ या अत्यधिक संस्कृतनिष्ठ शब्दावली से बचते हुए मूल की तीखी दुर्बलता-छवि और ईश्वरीय उपाधियाँ सुरक्षित रखी गई हैं।
