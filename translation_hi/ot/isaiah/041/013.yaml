  yaml_path: translation/ot/isaiah/041/013.yaml
  text: For I am Yahweh your God[a], who takes hold of your right hand, who says to you, ‘Do not fear; I will help you.’
translation:
  language: hi
  text: क्योंकि मैं याहवे, तुम्हारा परमेश्वर, तुम्हारा दाहिना हाथ थामे हुए हूँ; मैं तुमसे कहता हूँ, “मत डर; मैं तुम्हारी सहायता करूँगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में इसका शाब्दिक रूप “मैंने तुम्हारी सहायता की है” या “मैंने तुम्हारी सहायता की” है; यहाँ संदर्भ में इसके प्रतिज्ञासूचक बल को व्यक्त करने के लिए “मैं तुम्हारी सहायता करूँगा” अनूदित किया गया है।
    reason: क्रिया के पूर्णकालीन रूप और संदर्भगत भविष्यसूचक आश्वासन—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले आश्वासन का कारण प्रस्तुत करता है और इब्रानी संयोजक का स्वाभाविक हिन्दी रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम का लिप्यंतरण किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: संबंधसूचक एकवचन संबोधन और वाचा-संबंध दोनों को सीधे बनाए रखता है।
- source_word: מַחֲזִיק
  choice: थामे हुए है
  rationale: हिफ़ील कृदंत यहाँ दाहिने हाथ को दृढ़ता से पकड़े रहने और सहारा देने का सतत चित्र प्रस्तुत करता है।
- source_word: יְמִינֶךָ
  choice: तुम्हारा दाहिना हाथ
  rationale: मूल पाठ के ठोस शारीरिक बिंब को सामान्यीकृत किए बिना सुरक्षित रखता है।
- source_word: הָאֹמֵר לְךָ
  choice: तुमसे कहता है
  rationale: दूसरा कृदंत याहवे का आगे वर्णन करता है; यह आधुनिक हिन्दी में सहज और मूल संरचना के निकट है।
- source_word: אַל תִּירָא
  choice: मत डर
  rationale: निषेधात्मक आदेश का संक्षिप्त, सीधा और स्वाभाविक हिन्दी रूप।
- source_word: עֲזַרְתִּיךָ
  choice: मैं तुम्हारी सहायता करूँगा
  rationale: रूप की दृष्टि से यह पूर्णकाल है, पर भय न करने के आश्वासन में इसका बल निश्चित प्रतिज्ञा पर है; हिन्दी भविष्यकाल इस प्रसंगगत अर्थ को स्पष्ट करता है, जबकि औपचारिक कालगत विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल में चतुराक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में बदलने से बचाता है।
- issue: ईश्वरीय आश्वासन में עֲזַרְתִּיךָ का काल-पक्ष
  choice: 'प्रतिज्ञासूचक भविष्य: ‘मैं तुम्हारी सहायता करूँगा’'
  alternative: 'पूर्ण/भूत: ‘मैंने तुम्हारी सहायता की है’ अथवा ‘मैंने तुम्हारी सहायता की’'
  rationale: इब्रानी पूर्ण रूप निश्चितता व्यक्त कर सकता है। ‘मत डर’ के साथ भविष्यसूचक हिन्दी आश्वासन का व्यावहारिक बल व्यक्त करती है; मूल रूप की वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
