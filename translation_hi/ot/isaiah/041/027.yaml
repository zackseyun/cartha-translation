base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/027.yaml
  text: The first says to Zion[a], ‘Look[d][c][b], here they are!’ and to Jerusalem I give a herald of good news.
translation:
  language: hi
  text: सिय्योन को सबसे पहले यह कहनेवाला[a], “देखो, वे यहाँ हैं!”[b] और यरूशलेम को मैं शुभ समाचार का एक संदेशवाहक देता हूँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी वाक्य बहुत संक्षिप्त है। शाब्दिक रूप से, “सिय्योन के लिए प्रथम: देखो, वे यहाँ हैं!”; इसका अर्थ “मैं सिय्योन को सबसे पहले कहता हूँ...” भी हो सकता है।'
    reason: alternative_reading
  - marker: b
    text: इब्रानी पाठ यह नहीं बताता कि “वे” कौन हैं; इसका संकेत पहले घोषित लोगों या घटनाओं की ओर हो सकता है।
    reason: referential_ambiguity
  - marker: c
    text: या, “यरूशलेम को मैं शुभ समाचार का एक संदेशवाहक दूँगा।”
    reason: aspectual_alternative
lexical_decisions:
- source_word: רִאשׁוֹן
  choice: पहला व्यक्ति
  rationale: शब्द का मूल अर्थ ‘पहला’ है। ‘व्यक्ति’ हिंदी में संज्ञात्मक प्रयोग स्पष्ट करने के लिए जोड़ा गया है, पर यह नहीं बताया गया कि वह कौन है; कठिन और संक्षिप्त इब्रानी वाक्य की अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: לְצִיּוֹן
  choice: सिय्योन से
  rationale: לְ को यहाँ कथन के संबोधित प्राप्तकर्ता के रूप में समझा गया है; हिंदी में ‘सिय्योन से कहता है’ स्वाभाविक है।
- source_word: הִנֵּה הִנָּם
  choice: देखो, वे रहे!
  rationale: दोहरा संकेतवाचक बल बनाए रखता है और הִנָּם के बहुवचन को व्यक्त करता है, बिना यह निश्चित किए कि ‘वे’ कौन हैं।
- source_word: מְבַשֵּׂר
  choice: शुभ समाचार सुनानेवाला
  rationale: בשׂר के कृदंत का कर्तृवाचक अर्थ और समाचार की शुभ प्रकृति दोनों सरल, वर्तमान हिंदी में व्यक्त होते हैं।
- source_word: אֶתֵּן
  choice: मैं दूँगा
  rationale: प्रथम पुरुष एकवचन अपूर्ण क्रिया को भविष्यसूचक संदर्भ में भविष्यकाल से व्यक्त किया गया है; ‘नियुक्त करूँगा’ या ‘भेजूँगा’ की अपेक्षा ‘दूँगा’ मूल क्रिया נתן के निकट है।
theological_decisions:
- issue: ‘वे रहे’ में बहुवचन सर्वनाम का संदर्भ
  choice: संदर्भ को अनिर्दिष्ट रखा गया है।
  alternative: लौटनेवाले निर्वासित लोग, पहले से घोषित घटनाएँ, या उद्धार के साधन/दूत
  rationale: इब्रानी पाठ यह स्पष्ट नहीं करता कि बहुवचन किसकी ओर संकेत करता है; किसी एक व्याख्या को मुख्य पाठ में रखने से पाठ की वास्तविक अस्पष्टता मिट जाती।
- issue: רִאשׁוֹן का वाक्यगत संबंध
  choice: ‘पहला व्यक्ति ... कहता है’ के रूप में पढ़ा गया है।
  alternative: ‘सबसे पहले सिय्योन से...’ या ‘मैं पहला हूँ जो सिय्योन से कहता है...’
  rationale: मूल पंक्ति अत्यंत संक्षिप्त है और उसमें ‘कहता है’ स्पष्ट रूप से नहीं है। चुना हुआ रूप ‘पहला’ को संज्ञात्मक रखता है और ‘मैं हूँ’ को सीधे पाठ में जोड़ने से बचता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। कठिन आरंभिक पदबंध को अत्यधिक व्याख्यात्मक बनाने के बजाय मुख्य पाठ में संक्षिप्त रखा गया है और वैकल्पिक वाक्य-संबंध पादटिप्पणी में दिए गए हैं। ‘शुभ समाचार सुनानेवाला’ सामान्य पाठक के लिए ‘शुभ-संदेशवाहक’ से अधिक पारदर्शी है।
