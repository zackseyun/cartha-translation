base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/022.yaml
  text: The smallest will become a thousand[a], and the least a mighty nation. I am Yahweh[c][b]; in its time I will hasten it.
translation:
  language: hi
  text: सबसे छोटा बढ़कर हज़ार हो जाएगा, और सबसे नगण्य एक सामर्थी राष्ट्र बन जाएगा। मैं याहवे हूँ; नियत समय पर मैं उसे शीघ्र घटित करूँगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या ‘उसके नियत समय पर मैं उसे शीघ्र करूँगा।’ इब्रानी में नियत समय और शीघ्र पूर्ति—दोनों का भाव साथ बना रहता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַקָּטֹן
  choice: सबसे छोटा
  rationale: यह विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और छोटेपन अथवा नगण्यता को व्यक्त करता है; ‘सबसे छोटा’ समानांतर पंक्ति के साथ स्वाभाविक है।
- source_word: יִהְיֶה לָאֶלֶף
  choice: बढ़कर एक हज़ार हो जाएगा
  rationale: היה यहाँ परिवर्तन का भाव देता है, जबकि לָאֶלֶף परिणाम बताता है। ‘बढ़कर’ प्रसंग में निहित असाधारण वृद्धि को स्पष्ट करता है।
- source_word: אֶלֶף
  choice: एक हज़ार
  rationale: शब्द का सामान्य संख्यात्मक अर्थ ‘हज़ार’ है। यद्यपि इसका अर्थ कुछ प्रसंगों में ‘कुल’ भी हो सकता है, यहाँ ‘सामर्थी राष्ट्र’ के समानांतर वृद्धि का संख्यात्मक अर्थ अधिक उपयुक्त है।
- source_word: הַצָּעִיר
  choice: सबसे तुच्छ
  rationale: यहाँ आयु में छोटे के बजाय पद, महत्त्व या सामर्थ्य में नगण्य होने का भाव प्रमुख है।
- source_word: לְגוֹי עָצוּם
  choice: एक सामर्थी राष्ट्र
  rationale: גּוֹי का अर्थ ‘राष्ट्र’ और עָצוּם का अर्थ सामर्थी या शक्तिशाली है; यह चयन प्रतिज्ञात विस्तार की व्यापकता बनाए रखता है।
- source_word: אֲנִי יְהוָה
  choice: मैं यहोवा हूँ
  rationale: व्यक्तिगत वाचा-नाम को देवनागरी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בְּעִתָּהּ
  choice: उसके समय पर
  rationale: स्त्रीलिंग प्रत्यय प्रतिज्ञात घटना या उसकी पूर्ति की ओर संकेत करता है। यह शाब्दिक अभिव्यक्ति निर्धारित समय का भाव बनाए रखती है।
- source_word: אֲחִישֶׁנָּה
  choice: मैं इसे शीघ्र पूरा करूँगा
  rationale: हिफ़ील रूप में शीघ्र कराने या शीघ्र घटित करने का भाव और कर्ता के रूप में परमेश्वर की सक्रियता है; हिन्दी में यह वाक्यांश स्वाभाविक रहते हुए उसी अर्थ को देता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा-नाम सीधे उपस्थित है। हिन्दी पाठकों के लिए परिचित देवनागरी रूप ‘यहोवा’ व्यक्तिगत नाम को बनाए रखता है; ‘याहवे’ संभावित वैकल्पिक लिप्यंतरण है।
- issue: निर्धारित समय और शीघ्र पूर्ति के बीच तनाव
  choice: उसके समय पर मैं इसे शीघ्र पूरा करूँगा
  alternative: जब उसका समय आएगा, तब मैं इसे तुरन्त करूँगा
  rationale: मूल इब्रानी निर्धारित समय और ईश्वरीय शीघ्रता को साथ रखता है। मुख्य पाठ दोनों को बिना इस तनाव को मिटाए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और सामान्य पाठक के लिए बोधगम्य शैली। समानांतर काव्य-संरचना तथा अंतिम कथन में समय और शीघ्रता के तनाव को बनाए रखा गया है।
