id: ISA.60.6
reference: Isaiah 60:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שִֽׁפְעַ֨ת גְּמַלִּ֜ים תְּכַסֵּ֗/ךְ בִּכְרֵ֤י מִדְיָן֙ וְ/עֵיפָ֔ה כֻּלָּ֖/ם מִ/שְּׁבָ֣א יָבֹ֑אוּ זָהָ֤ב וּ/לְבוֹנָה֙ יִשָּׂ֔אוּ וּ/תְהִלֹּ֥ת יְהוָ֖ה יְבַשֵּֽׂרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/006.yaml
  text: A multitude of camels will cover you[a], the young camels of Midian and Ephah; all of them will come from Sheba. They will carry gold and frankincense[b], and they will proclaim the praises of Yahweh.
translation:
  language: hi
  text: ऊँटों की बहुतायत तुझे ढक लेगी—मिद्यान और एफा के जवान ऊँट; वे सब शेबा से आएँगे। वे सोना और लोबान लेकर आएँगे, और यहोवा की स्तुतियों का शुभ संदेश घोषित करेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे यहोवा की स्तुतियों की घोषणा करेंगे।” इब्रानी क्रिया में शुभ समाचार सुनाने और सार्वजनिक रूप से घोषणा करने, दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְעַת גְּמַלִּים
  choice: ऊँटों का एक विशाल झुंड
  rationale: שִׁפְעַת बहुतायत या प्रचुरता व्यक्त करता है। हिंदी में 'विशाल झुंड' अनेक ऊँटों के दृश्य को स्वाभाविक और सजीव ढंग से व्यक्त करता है।
- source_word: תְּכַסֵּךְ
  choice: तुझे ढक लेगा
  rationale: क्रिया के मूल 'ढकना' को बनाए रखा गया है; स्त्रीलिंग एकवचन संबोधन सिय्योन/यरूशलेम की ओर है।
- source_word: בִּכְרֵי
  choice: जवान ऊँट
  rationale: यह पद जवान ऊँटों को सूचित करता है; अस्पष्ट प्राणी-विज्ञान संबंधी पारंपरिक शब्द के बजाय सहज आधुनिक हिंदी चुनी गई है।
- source_word: מִדְיָן וְעֵיפָה
  choice: मिद्यान और एपा
  rationale: व्यक्तियों/समुदायों के नामों का प्रचलित हिंदी लिप्यंतरण किया गया है।
- source_word: מִשְּׁבָא
  choice: शेबा से
  rationale: מִן उपसर्ग से उद्गम स्पष्ट होता है; नाम का हिंदी लिप्यंतरण रखा गया है।
- source_word: זָהָב וּלְבוֹנָה
  choice: सोना और लोबान
  rationale: לְבוֹנָה विशेष रूप से frankincense है, इसलिए सामान्य 'धूप' के बजाय सटीक और प्रचलित 'लोबान' चुना गया है।
- source_word: יִשָּׂאוּ
  choice: उठाए आएँगे
  rationale: नָשָׂא के उठाने/ढोने के भाव और गंतव्य की ओर आने के प्रसंग, दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וּתְהִלֹּת יְהוָה
  choice: यहोवा की स्तुतियों
  rationale: बहुवचन תְהִלֹּת को बनाए रखते हुए संबंधवाचक रचना मूल की इस संभावित व्यापकता को रहने देती है कि ये यहोवा की प्रशंसा अथवा उसके प्रशंसनीय कार्य हैं।
- source_word: יְבַשֵּׂרוּ
  choice: शुभ समाचार सुनाएँगे
  rationale: בשר केवल सामान्य घोषणा नहीं, बल्कि शुभ समाचार सुनाने/घोषित करने का भाव भी रखता है; यह भाव मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का हिंदी में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम है। हिंदी पाठकों में परिचित लिप्यंतरण 'यहोवा' नाम को उपाधि में बदले बिना सुरक्षित रखता है।
- issue: וּתְהִלֹּת יְהוָה יְבַשֵּׂרוּ का अर्थ
  choice: यहोवा की स्तुतियों का शुभ समाचार सुनाएँगे
  alternative: यहोवा की स्तुति का प्रचार करेंगे
  rationale: मुख्य पाठ בשר के शुभ समाचार वाले अर्थ और תהלות के बहुवचन को बनाए रखता है। संबंधवाचक पदबंध यह पूरी तरह तय नहीं करता कि आशय मुखर स्तुति है या यहोवा के प्रशंसनीय कार्यों की घोषणा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्त्रीलिंग एकवचन संबोधन को 'तुझे' से सुरक्षित रखा गया है। मुख्य पाठ में मूल की काव्यात्मक छवि और בשר का शुभ-संदेश संबंधी अर्थ दोनों बनाए गए हैं।
