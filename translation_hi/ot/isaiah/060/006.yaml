review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the profusion of camels, the feminine singular addressee, the young camels of Midian and Ephah, goods of gold and frankincense, and the proclamation concerning Yahweh's praises. However, एपा is not the standard Hindi transliteration for עֵיפָה (Ephah); एफा is preferable. The main rendering of יְבַשֵּׂרוּ as ‘शुभ समाचार सुनाएँगे’ is lexically possible, but with ‘यहोवा की स्तुतियों’ it is somewhat strained in Hindi. A wording that retains both heralding and good-news nuance is clearer.
  naturalness: ‘ऊँटों की बहुतायत तुझे ढक लेगी’ is natural, maintains the Hebrew noun’s abundance sense, and agrees idiomatically in Hindi. ‘लेकर आएँगे’ naturally conveys the carrying of tribute in its destination-oriented context. ‘शुभ संदेश की घोषणा करेंगे’ reads more fluently than ‘स्तुतियों का शुभ समाचार सुनाएँगे’ while preserving the verb’s favorable-heralding sense.
  terminology: लोबान is an appropriate precise rendering of frankincense. यहोवा preserves the divine personal name rather than replacing it with a title and is familiar in Hindi biblical usage. ‘स्तुतियाँ’ properly reflects the Hebrew plural. Proper names are rendered as मिद्यान, एफा, and शेबा.
  issues:
  - severity: medium
    issue: The name עֵיפָה is rendered ‘एपा’.
    rationale: ‘एफा’ is the standard and phonetically appropriate Hindi transliteration of Ephah; ‘एपा’ obscures the name’s established form.
  - severity: low
    issue: ‘यहोवा की स्तुतियों का शुभ समाचार सुनाएँगे’ is awkward Hindi.
    rationale: The Hebrew verb can mean to herald good news, but attaching ‘शुभ समाचार’ directly to ‘स्तुतियों’ produces an unnatural collocation. A revised construction can preserve the lexical nuance without implying a different object.
  revised_text: ऊँटों की बहुतायत तुझे ढक लेगी—मिद्यान और एफा के जवान ऊँट; वे सब शेबा से आएँगे। वे सोना और लोबान लेकर आएँगे, और यहोवा की स्तुतियों का शुभ संदेश घोषित करेंगे।[a]
