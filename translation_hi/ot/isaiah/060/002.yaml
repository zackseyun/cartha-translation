  verdict: revise
  source_fidelity: The verse’s parallel clauses, future sense, contrast, and light imagery are accurately represented. However, כְּבוֹדוֹ is more fully and conventionally rendered here as “महिमा” than “तेज”; the latter narrows the term to visible radiance, whereas the Hebrew retains the broader sense of manifested glory.
  naturalness: The Hindi is clear, dignified, and suitable for poetic scripture. “क्योंकि देखो” is an acceptable biblical-register rendering of כי הנה, and the ellipsis in the second darkness clause is naturally supplied by the shared verb.
  terminology: “यहोवा” appropriately preserves the personal divine name יהוה. “महिमा” is preferred for כָּבוֹד, preserving both its visible manifestation in context and its broader theological-semantic range.
  issues:
  - severity: low
    issue: “उसका तेज” for כְּבוֹדוֹ
    rationale: Though contextually plausible, “तेज” primarily denotes brightness and can restrict the Hebrew כָּבוֹד to radiance. “महिमा” better represents the source term and matches established Hindi biblical terminology while still fitting the imagery of appearing light.
  revised_text: क्योंकि देखो, अंधकार पृथ्वी को और घोर अंधकार राष्ट्रों को ढक लेगा; परन्तु तुम्हारे ऊपर यहोवा उदय होगा, और उसकी महिमा तुम्हारे ऊपर दिखाई देगी।
