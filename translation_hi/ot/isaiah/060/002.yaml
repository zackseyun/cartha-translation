language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי הִנֵּ֤ה הַ/חֹ֨שֶׁךְ֙ יְכַסֶּה אֶ֔רֶץ וַ/עֲרָפֶ֖ל לְאֻמִּ֑ים וְ/עָלַ֨יִ/ךְ֙ יִזְרַ֣ח יְהוָ֔ה וּ/כְבוֹד֖/וֹ עָלַ֥יִ/ךְ יֵרָאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/002.yaml
  text: For look, darkness will cover the earth, and thick darkness the peoples; but the LORD will rise upon you, and his glory will appear over you.
translation:
  language: hi
  text: क्योंकि देखो, अंधकार पृथ्वी को और घोर अंधकार राष्ट्रों को ढक लेगा; परन्तु तुम्हारे ऊपर यहोवा उदय होगा, और उसकी महिमा तुम्हारे ऊपर दिखाई देगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले हिब्रू सूचक को सहज और प्रत्यक्ष हिन्दी में बनाए रखता है।
- source_word: הַחֹשֶׁךְ
  choice: अंधकार
  rationale: सामान्य अंधकार के लिए सीधा और गरिमापूर्ण समतुल्य।
- source_word: עֲרָפֶל
  choice: घोर अंधकार
  rationale: यह शब्द गहरे अथवा सघन अंधकार को दर्शाता है; यह चयन חֹשֶׁךְ से उसकी तीव्रता का भेद बनाए रखता है।
- source_word: יִזְרַח
  choice: उदय होगा
  rationale: क्रिया का मूल अर्थ चमकने या सूर्य की तरह उदित होने का है; 'उदय होगा' यहाँ के प्रकाश-विरोधी बिंब को स्वाभाविक हिन्दी में रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम को उपाधि में बदलने के बजाय हिन्दी में प्रचलित रूप से प्रस्तुत करता है।
- source_word: כְבוֹדוֹ
  choice: उसका तेज
  rationale: כבוד के प्रकट, दीप्तिमान वैभव को इस प्रकाश-संदर्भ में स्वाभाविक हिन्दी से व्यक्त करता है।
- source_word: יֵרָאֶה
  choice: दिखाई देगा
  rationale: निफ़अल रूप के प्रकट या दृष्टिगोचर होने के भाव को सीधे व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में उपाधि नहीं बल्कि चार-अक्षरी व्यक्तिगत नाम है; 'यहोवा' हिन्दी बाइबल परंपरा में पहचाना जाने वाला रूप है और स्रोत का यह भेद बनाए रखता है।
- issue: כבוד को प्रकाश-संदर्भ में व्यक्त करना
  choice: तेज
  alternative: महिमा
  rationale: दोनों अर्थ संभव हैं, पर उदय होने, अंधकार और दिखाई देने के निकट संदर्भ में 'तेज' दृश्य दीप्ति को अधिक स्वाभाविक ढंग से व्यक्त करता है, बिना दिव्य वैभव को नकारे।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक समानांतरता और अंधकार बनाम दिव्य प्रकाश का विरोध सुरक्षित रखा गया है। स्त्रीलिंग एकवचन 'तुम्हारे' का हिन्दी रूप लिंग को प्रकट नहीं करता, पर संदर्भगत संबोधन सिय्योन/यरूशलेम की ओर बना रहता है।
