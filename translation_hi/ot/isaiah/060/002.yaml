  to: क्योंकि देखो, अंधकार पृथ्वी को और घोर अंधकार राष्ट्रों को ढक लेगा; परन्तु तुम्हारे ऊपर यहोवा उदय होगा, और उसकी महिमा तुम्हारे ऊपर दिखाई देगी।
