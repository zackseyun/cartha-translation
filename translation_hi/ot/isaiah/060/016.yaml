source:
  edition: WLC
  text: וְ/יָנַקְתְּ֙ חֲלֵ֣ב גּוֹיִ֔ם וְ/שֹׁ֥ד מְלָכִ֖ים תִּינָ֑קִי וְ/יָדַ֗עַתְּ כִּ֣י אֲנִ֤י יְהוָה֙ מֽוֹשִׁיעֵ֔/ךְ וְ/גֹאֲלֵ֖/ךְ אֲבִ֥יר יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/016.yaml
  text: You will nurse on the milk of nations[a], and you will suck the breast of kings; and you will know that I, Yahweh, am your Savior and your Redeemer, the Mighty One of Jacob.
translation:
  language: hi
  text: तू राष्ट्रों का दूध पिएगी और राजाओं के स्तनों को चूसेगी;[a] तब तू जान लेगी कि मैं, याहवे, तेरा उद्धारकर्ता और तेरा छुड़ानेवाला, याकूब का पराक्रमी हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू में स्तनपान का सजीव रूपक है: राष्ट्रों का “दूध” और राजाओं के “स्तन।” यह सिय्योन को राष्ट्रों से मिलने वाले पोषण और सम्मान की ओर संकेत करता है।'
    reason: metaphor_clarification
lexical_decisions:
- source_word: וְיָנַקְתְּ חֲלֵב גּוֹיִם
  choice: तू राष्ट्रों का दूध पिएगी
  rationale: ינק के दूध पीने/चूसने के ठोस बिंब और חלב के मूल अर्थ ‘दूध’ को बनाए रखा गया है। स्त्रीलिंग एकवचन क्रिया सिय्योन/यरूशलेम को संबोधित करती है।
- source_word: וְשֹׁד מְלָכִים תִּינָקִי
  choice: और राजाओं का स्तन चूसेगी
  rationale: शरीर और स्तनपान के जानबूझकर प्रयुक्त सजीव रूपक को अमूर्त ‘धन’ या ‘सहायता’ में नहीं बदला गया। हिंदी में ‘चूसेगी’ मूल क्रिया की प्रत्यक्षता और काव्यात्मक समानांतरता रखता है।
- source_word: גּוֹיִם
  choice: राष्ट्रों
  rationale: यहाँ विदेशी जनसमूहों और उनकी सामूहिक राजनीतिक पहचान के लिए ‘राष्ट्र’ स्वाभाविक तथा संदर्भानुकूल है।
- source_word: וְיָדַעַתְּ
  choice: तब तू जान लेगी
  rationale: वाव से जुड़े क्रम का परिणामात्मक भाव संदर्भ में स्वाभाविक है; ‘तब’ इसे हिंदी में स्पष्ट करता है, बिना आशय को बढ़ाए। स्त्रीलिंग एकवचन संबोधन सुरक्षित है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिंदी लिपि में लिप्यंतरित किया गया है।
- source_word: מוֹשִׁיעֵךְ
  choice: तेरा उद्धारकर्ता
  rationale: हिफ़ील कृदंत के बचानेवाले, उपाधि-सदृश अर्थ को संक्षिप्त और प्रचलित हिंदी में व्यक्त करता है।
- source_word: וְגֹאֲלֵךְ
  choice: तेरा छुड़ानेवाला
  rationale: גאל के छुड़ाने और अपने अधिकार में वापस लेने के भाव को सामान्य हिंदी में रखा गया है; ‘कुटुम्बी-छुड़ानेवाला’ कहना इस संदर्भ में आवश्यकता से अधिक विशिष्ट होता।
- source_word: אֲבִיר יַעֲקֹב
  choice: याकूब का पराक्रमी
  rationale: मूल के दैवी विशेषण ‘पराक्रमी/सामर्थी जन’ और ‘याकूब’ नाम दोनों को सुरक्षित रखा गया है; ‘इस्राएल’ से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु या यहोवा
  rationale: मूल पाठ में व्यक्तिगत नाम है; इसलिए उसे उपाधि ‘प्रभु’ से नहीं बदला गया। ‘याहवे’ स्रोत-नाम का निकट हिंदी लिप्यंतरण है।
- issue: स्तनपान के रूपक को शाब्दिक रखना या धन-संपदा के रूप में खोलना
  choice: दूध और स्तन चूसने का बिंब मुख्य पाठ में बनाए रखना
  alternative: तू राष्ट्रों और राजाओं की धन-संपदा पाएगी
  rationale: हिब्रू में दूध, स्तन और चूसने की क्रिया स्पष्ट रूप से दोहराई गई है। रूपक संभवतः राष्ट्रों से पोषण, सम्मान और संसाधन मिलने की ओर संकेत करता है, पर मुख्य पाठ को इस व्याख्या तक सीमित नहीं करना चाहिए।
- issue: גאל में कुटुम्बी-छुड़ानेवाले का भाव
  choice: छुड़ानेवाला
  alternative: कुटुम्बी-छुड़ानेवाला या मुक्तिदाता
  rationale: यह शब्द छुड़ाने और पुनः अपना करने का वाचागत भाव रख सकता है, किंतु इस पद में रिश्तेदारी की तकनीकी भूमिका स्पष्ट नहीं की गई; इसलिए उसे अनावश्यक रूप से नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रत्यक्ष हिंदी। स्त्रीलिंग एकवचन ‘तू’ सिय्योन/यरूशलेम के व्यक्तिकरण को दर्शाता है। असामान्य पर जानबूझकर प्रयुक्त स्तनपान-बिंब को मूल के अनुरूप रखा गया है।
