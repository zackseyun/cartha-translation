source:
  edition: WLC
  text: לֹא יִֽהְיֶה לָּ֨/ךְ ע֤וֹד הַ/שֶּׁ֨מֶשׁ֙ לְ/א֣וֹר יוֹמָ֔ם וּ/לְ/נֹ֕גַהּ הַ/יָּרֵ֖חַ לֹא יָאִ֣יר לָ֑/ךְ וְ/הָיָה לָ֤/ךְ יְהוָה֙ לְ/א֣וֹר עוֹלָ֔ם וֵ/אלֹהַ֖יִ/ךְ לְ/תִפְאַרְתֵּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/019.yaml
  text: The sun will no longer be for you the light by day[a], nor will the moon shine for you for brightness; but Yahweh will be for you an everlasting light[c][b], and your God your glory.
translation:
  language: hi
  text: सूर्य दिन में फिर तेरे लिए प्रकाश न होगा, न चाँद अपनी चमक[a] से तुझे उजाला देगा; बल्कि याहवे[b] तेरे लिए सदा का प्रकाश होगा, और तेरा परमेश्वर तेरा वैभव[c] होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दीप्ति’।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में: YHWH; परंपरागत रूप से ‘प्रभु’ अनुवादित।'
    reason: alternative_reading
  - marker: c
    text: या ‘महिमा’ अथवा ‘शोभा’।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִהְיֶה לָּךְ עוֹד
  choice: फिर तेरा ... नहीं होगा
  rationale: नकार, भावी क्रिया, संबंधसूचक לָךְ और עוֹד को स्वाभाविक हिन्दी में इस प्रकार व्यक्त किया गया है कि पहले की स्थिति के समाप्त होने का भाव बना रहे।
- source_word: לְאוֹר יוֹמָם
  choice: दिन में ... प्रकाश
  rationale: לְ यहाँ भूमिका या कार्य बताता है और יוֹמָם दिन के समय को; हिन्दी वाक्य-विन्यास में ‘दिन में सूर्य ... तेरा प्रकाश’ अर्थ और काव्यात्मकता दोनों बनाए रखता है।
- source_word: וּלְנֹגַהּ
  choice: अपनी चमक से
  rationale: נֹגַהּ का अर्थ चमक या दीप्ति है। ‘अपनी चमक से’ चाँद के प्रकाश देने की समानांतर पंक्ति को सहज हिन्दी में व्यक्त करता है।
- source_word: לֹא יָאִיר לָךְ
  choice: तुझे उजाला देगा
  rationale: אור के हिफ़ील रूप का अर्थ प्रकाश देना या प्रकाशित करना है; नकार ‘न’ के साथ ‘तुझे उजाला देगा’ संबंधसूचक לָךְ को स्वाभाविक रूप से रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम YHWH का हिन्दी लिप्यंतरण किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: לְאוֹר עוֹלָם
  choice: सदा का प्रकाश
  rationale: עוֹלָם यहाँ स्थायी और अनंत अवधि का भाव देता है; ‘सदा का प्रकाश’ आधुनिक हिन्दी में संक्षिप्त, काव्यात्मक और अर्थनिष्ठ है।
- source_word: לְתִפְאַרְתֵּךְ
  choice: तेरा वैभव
  rationale: תִפְאֶרֶת महिमा, शोभा या वैभव को सूचित कर सकता है। ‘वैभव’ प्रकाश और दीप्ति की काव्यात्मक पृष्ठभूमि के अनुकूल है और मूल की अर्थ-व्याप्ति को अत्यधिक संकीर्ण नहीं करता।
theological_decisions:
- issue: सूर्य और चाँद की आवश्यकता न रहने वाली भविष्यवाणी की प्रकृति
  choice: काव्यात्मक-भविष्यसूचक चित्रण को बिना यह निर्धारित किए बनाए रखना कि वह शाब्दिक, रूपकात्मक या युगांत-संबंधी है
  alternative: इसे केवल ब्रह्मांडीय परिवर्तन या केवल आत्मिक प्रकाश का स्पष्ट कथन मानना
  rationale: इब्रानी पाठ स्वयं पूर्ति का ढंग स्पष्ट नहीं करता; अनुवाद सृष्ट प्रकाशों की जगह याहवे के अनंत प्रकाश बनने के तनाव और भव्यता को सुरक्षित रखता है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम YHWH का प्रयोग करता है; लिप्यंतरण नाम और उपाधि के बीच का भेद बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय भविष्यसूचक शैली रखी गई है। सिय्योन/यरूशलेम को संबोधित इब्रानी स्त्रीलिंग एकवचन का निकट संबोधन ‘तेरा/तुझे’ द्वारा सुरक्षित है। वाक्य में सूर्य, चाँद, प्रकाश और वैभव की काव्यात्मक समानांतरता बनाए रखी गई है।
