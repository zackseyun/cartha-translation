source:
  edition: WLC
  text: וְ/עַמֵּ/ךְ֙ כֻּלָּ֣/ם צַדִּיקִ֔ים לְ/עוֹלָ֖ם יִ֣ירְשׁוּ אָ֑רֶץ נֵ֧צֶר מטע/ו מַעֲשֵׂ֥ה יָדַ֖/י לְ/הִתְפָּאֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/021.yaml
  text: And all your people will be righteous[a]; forever they will possess the land, the shoot of my planting, the work of my hands[c][b], that I may be glorified.
translation:
  language: hi
  text: 'और तेरे सभी लोग धर्मी होंगे;

    वे सदा के लिए देश[b] के अधिकारी होंगे[a]।

    वे उसकी लगाई हुई पौध का अंकुर[c],

    मेरे हाथों की कृति हैं,

    ताकि मैं अपनी महिमा प्रकट करूँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वे देश को विरासत में पाएँगे।” हिब्रू क्रिया का अर्थ “विरासत में पाना” या “अधिकार में रखना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “पृथ्वी।” हिब्रू शब्द אֶרֶץ का अर्थ “देश/भूमि” या “पृथ्वी” हो सकता है; यहाँ पुनर्स्थापना के संदर्भ में “देश” अधिक विशिष्ट है।
    reason: lexical_alternative
  - marker: c
    text: 'हिब्रू: “उसकी लगाई हुई पौध का अंकुर।” इसके बाद “मेरे हाथों की कृति” आता है। कुछ व्याख्याकार अगले वाक्यांश के अनुसार पुरुष-परिवर्तन को एकरूप करके “मेरी लगाई हुई पौध” समझते हैं, पर मुख्य पाठ प्रदत्त मसोरेटिक रूप को बनाए रखता है।'
    reason: textual_variant
lexical_decisions:
- source_word: וְעַמֵּךְ כֻּלָּם
  choice: और तेरे सभी लोग
  rationale: וְ को ‘और’ से व्यक्त किया गया है। עַמֵּךְ में स्त्रीलिंग एकवचन संबोधन सिय्योन/यरूशलेम से है; हिन्दी में स्वाभाविक रूप ‘तेरे लोग’ है। כֻּלָּם की समग्रता ‘सभी’ से सुरक्षित रहती है।
- source_word: צַדִּיקִים
  choice: धर्मी
  rationale: यह शब्द नैतिक और वाचा-संबंधी सही स्थिति का बोध कराता है। ‘धर्मी’ आधुनिक हिन्दी में परिचित है और इसका धर्मवैचारिक भार बनाए रखता है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: यह स्थायी और निरंतर अवधि दर्शाता है। ‘सदा’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: יִירְשׁוּ
  choice: अधिकारी बने रहेंगे
  rationale: ירשׁ का अर्थ विरासत पाना अथवा अधिकारपूर्वक अपने पास रखना हो सकता है। पुनर्स्थापना के संदर्भ में यह चयन स्थायी अधिकार और निवास को सहज हिन्दी में व्यक्त करता है; ‘विरासत में पाएँगे’ को पादटिप्पणी में रखा गया है।
- source_word: אָרֶץ
  choice: देश
  rationale: यशायाह 60 के पुनर्स्थापना-संदर्भ में अपने देश/भूमि का अर्थ अधिक निकट है। व्यापक अर्थ ‘पृथ्वी’ संभव है और पादटिप्पणी में दिया गया है।
- source_word: נֵצֶר
  choice: पौधे की कोंपल
  rationale: נֵצֶר नई निकली हुई डाल या अंकुर को दर्शाता है। ‘कोंपल’ हिन्दी में नई वृद्धि की सजीव छवि देता है।
- source_word: מטעו
  choice: उसके लगाए हुए पौधे की
  rationale: प्रदत्त स्रोत-पाठ में प्रत्यय तीसरे पुरुष एकवचन ‘उसके’ का संकेत देता है। इसलिए अगले प्रथम पुरुष वाक्यांश के साथ आने वाले पुरुष-परिवर्तन को सुधारा या समतल नहीं किया गया।
- source_word: מַעֲשֵׂה יָדַי
  choice: मेरे हाथों की कृति
  rationale: यह परमेश्वर द्वारा रचे और सँवारे गए कार्य की ठोस छवि को संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: לְהִתְפָּאֵר
  choice: ताकि मेरी महिमा प्रकट हो
  rationale: פאר का हित्पएल रूप यहाँ परमेश्वर की महिमा के प्रकट होने का उद्देश्य या परिणाम बताता है। यह अनुवाद अर्थ को सहज हिन्दी में रखता है और अनावश्यक रूप से किसी एक व्याख्यात्मक दिशा को कठोर नहीं करता।
theological_decisions:
- issue: ‘उसके लगाए हुए पौधे की कोंपल, मेरे हाथों की कृति’ में पुरुष-परिवर्तन
  choice: प्रदत्त मसोरेटिक पाठ के अनुसार ‘उसके’ से ‘मेरे’ का परिवर्तन मुख्य पाठ में बनाए रखा गया है।
  alternative: ‘मेरे लगाए हुए पौधे की कोंपल’ कहकर दोनों वाक्यांशों को प्रथम पुरुष में एकरूप करना।
  rationale: प्रदत्त हिब्रू रूप מטעו में तीसरे पुरुष एकवचन प्रत्यय है, जबकि ידי प्रथम पुरुष है। वास्तविक पाठगत तनाव को बिना प्रमाण चुपचाप दूर करना उचित नहीं; पाठक को पादटिप्पणी द्वारा स्थिति बताई गई है।
- issue: לְהִתְפָּאֵר में परमेश्वर की महिमा का आशय
  choice: ‘ताकि मेरी महिमा प्रकट हो’
  alternative: ‘ताकि मैं महिमा पाऊँ’ या ‘ताकि मैं अपनी महिमा दिखाऊँ।’
  rationale: चुना हुआ रूप उद्देश्य और आत्म-प्रकाशन दोनों की संभावना को बनाए रखता है, पर हिन्दी में ऐसे निष्क्रिय प्रयोग से बचता है जो यह संकेत दे सकता था कि परमेश्वर किसी बाहरी स्रोत से महिमा प्राप्त करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर काव्यात्मक समानांतरता और भविष्यवाणी की गरिमा बनाए रखी गई है। सिय्योन से एकवचन आत्मीय संबोधन के लिए ‘तेरे’ चुना गया है। पंक्ति-विन्यास ने लोगों, कोंपल और परमेश्वर की कृति के बीच काव्यात्मक समानाधिकरण को स्पष्ट रखा है।
