source:
  edition: WLC
  text: וּ/פִתְּח֨וּ שְׁעָרַ֧יִ/ךְ תָּמִ֛יד יוֹמָ֥ם וָ/לַ֖יְלָה לֹ֣א יִסָּגֵ֑רוּ לְ/הָבִ֤יא אֵלַ֨יִ/ךְ֙ חֵ֣יל גּוֹיִ֔ם וּ/מַלְכֵי/הֶ֖ם נְהוּגִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/011.yaml
  text: Your gates will be open continually[a]; day and night they will not be shut, so that the wealth of the nations may be brought to you[b], with their kings led in procession.
translation:
  language: hi
  text: तेरे फाटक सदा खुले रहेंगे; दिन और रात वे बन्द नहीं किए जाएँगे, ताकि राष्ट्रों की धन-सम्पत्ति तेरे पास लाई जाए[a], और उनके राजाओं को ले जाया जाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राष्ट्रों का वैभव”; इब्रानी शब्द का अर्थ “सामर्थ्य” या “सेना” भी हो सकता है, पर यहाँ सम्भवतः भौतिक धन-सम्पत्ति अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: या “उनके राजा जुलूस में लाए जाएँ” अथवा “उनके राजा अधीन करके हाँके जाएँ।” इब्रानी कर्मवाच्य कृदन्त राजाओं के ले जाए जाने का भाव देता है, पर सम्मानपूर्ण अनुरक्षण और अधीन करके ले जाने के बीच निश्चित निर्णय नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִתְּחוּ שְׁעָרַיִךְ תָּמִיד
  choice: तेरे फाटक सदा खुले रहेंगे
  rationale: भविष्यसूचक सन्दर्भ में फाटकों की निरन्तर खुली अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है। स्त्रीलिंग एकवचन सम्बोधन ‘तेरे’ से सिय्योन/यरूशलेम को सम्बोधित किया गया है।
- source_word: יוֹמָם וָלַיְלָה לֹא יִסָּגֵרוּ
  choice: दिन हो या रात, वे बन्द नहीं किए जाएँगे
  rationale: ‘दिन और रात’ के मेरिज़्म का आशय बिना रुकावट की अवधि है; ‘दिन हो या रात’ आधुनिक हिन्दी में यही भाव स्पष्ट करता है, जबकि कर्मवाच्य मूल के निफ़अल रूप को बनाए रखता है।
- source_word: לְהָבִיא אֵלַיִךְ
  choice: ताकि ... तेरे पास लाई जाए
  rationale: לְ उपसर्गयुक्त क्रियार्थक रूप यहाँ उद्देश्य बताता है। ‘तेरे पास’ सिय्योन की ओर गति को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: חֵיל גּוֹיִם
  choice: राष्ट्रों की धन-सम्पत्ति
  rationale: חֵיל का अर्थ सामर्थ्य, सेना या सम्पत्ति हो सकता है। यशायाह 60 में सोना, जहाज़ और अन्य संसाधन सिय्योन में लाए जाने के प्रसंग में ‘धन-सम्पत्ति’ सर्वाधिक संगत है।
- source_word: וּמַלְכֵיהֶם נְהוּגִים
  choice: और उनके राजा अगुवाई करके लाए जाएँ
  rationale: נהג के कर्मवाच्य कृदन्त में राजाओं को किसी के द्वारा आगे ले जाए जाने का भाव है। यह चयन मूल की निष्क्रिय गति को रखता है और न तो निश्चित रूप से सम्मानपूर्ण शोभायात्रा मानता है, न बन्दी बनाकर हाँके जाने का अर्थ थोपता है।
theological_decisions:
- issue: חֵיל גּוֹיִם का अर्थ
  choice: राष्ट्रों की आर्थिक धन-सम्पत्ति और संसाधन
  alternative: राष्ट्रों की शक्ति या सेना
  rationale: आस-पास के पद राष्ट्रों द्वारा सिय्योन में भौतिक वस्तुएँ और धन लाने पर बल देते हैं। फिर भी मूल शब्द की व्यापक अर्थ-सीमा पादटिप्पणी में सुरक्षित रखी गई है।
- issue: נְהוּגִים में राजाओं को ले जाए जाने की रीति
  choice: राजाओं का अगुवाई करके लाया जाना
  alternative: राजाओं को शोभायात्रा में लाया जाना या पराजित बन्दियों की तरह हाँका जाना
  rationale: कर्मवाच्य कृदन्त नेतृत्व/संचालन को स्पष्ट करता है, पर सम्मानपूर्ण जुलूस और अधीन करके ले जाने के बीच निर्णय नहीं करता। इसलिए मुख्य पाठ उस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यसूचक लहजा रखा गया है। ‘फाटक’, ‘राष्ट्र’ और ‘धन-सम्पत्ति’ सामान्य पाठक के लिए स्पष्ट हैं। राजाओं की अगुवाई में निहित सम्मान अथवा अधीनता की वास्तविक अस्पष्टता को मुख्य पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
