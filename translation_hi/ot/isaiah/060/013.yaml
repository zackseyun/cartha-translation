  text: כְּב֤וֹד הַ/לְּבָנוֹן֙ אֵלַ֣יִ/ךְ יָב֔וֹא בְּר֛וֹשׁ תִּדְהָ֥ר וּ/תְאַשּׁ֖וּר יַחְדָּ֑ו לְ/פָאֵר֙ מְק֣וֹם מִקְדָּשִׁ֔/י וּ/מְק֥וֹם רַגְלַ֖/י אֲכַבֵּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/013.yaml
  text: The glory of Lebanon will come to you—cypress[a], plane tree, and pine together—to beautify the place of my sanctuary[b], and I will honor the place of my feet.
translation:
  language: hi
  text: लबानोन का वैभव तेरे पास आएगा—सनौवर[a], चिनार और चीड़, सब एक साथ—मेरे पवित्रस्थान को सुशोभित करने के लिए; और मैं अपने चरणों के स्थान[b] को महिमा दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में तीन प्रकार के वृक्षों के नाम हैं। दूसरे और तीसरे वृक्ष की सटीक प्रजातियाँ अनिश्चित हैं; उनके लिए ‘एल्म’ और ‘बॉक्स वृक्ष’ जैसे अर्थ भी प्रस्तावित किए गए हैं। पहले वृक्ष का अनुवाद ‘सरू’ या ‘फ़र’ भी किया जाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मेरी पादपीठ।” इब्रानी में अधिक शाब्दिक रूप से, “मेरे चरणों का स्थान” है।
    reason: alternative_reading
lexical_decisions:
- source_word: כְּבוֹד
  choice: वैभव
  rationale: यहाँ शब्द लबानोन के प्रसिद्ध वन-संसाधनों की शोभा और बहुमूल्यता को व्यक्त करता है; ‘वैभव’ इस ठोस और काव्यात्मक दोनों अर्थों को सहज हिंदी में समेटता है।
- source_word: הַלְּבָנוֹן
  choice: लबानोन
  rationale: स्थान-नाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
- source_word: אֵלַיִךְ
  choice: तेरे पास
  rationale: स्त्रीलिंग एकवचन संबोधन सिय्योन/यरूशलेम की ओर है; पद में उसका नाम जोड़े बिना मूल संबोधन सुरक्षित रखा गया है।
- source_word: יָבוֹא
  choice: आएगा
  rationale: काल इम्परफेक्ट का सीधा सक्रिय अर्थ ‘आएगा’ है; प्रसंगगत कर्मवाच्य अर्थ अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: בְּרוֹשׁ
  choice: सनौवर
  rationale: सटीक वृक्ष-प्रजाति अनिश्चित है; ‘सनौवर’ बहुमूल्य शंकुधारी वृक्ष के लिए परिचित और उपयुक्त हिंदी विकल्प है।
- source_word: תִּדְהָר
  choice: चिनार
  rationale: प्रजाति निश्चित नहीं है; ‘चिनार’ plane tree का स्वाभाविक हिंदी नाम है और अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: תְאַשּׁוּר
  choice: चीड़
  rationale: सटीक पहचान विवादित है; ‘चीड़’ वांछनीय इमारती वृक्ष के प्रसंग में एक प्रचलित संभावित अर्थ है।
- source_word: יַחְדָּו
  choice: सब एक साथ
  rationale: सूचीबद्ध वृक्षों के सामूहिक रूप से आने पर बल देता है।
- source_word: לְפָאֵר
  choice: सुशोभित करें
  rationale: पिएल रूप का अर्थ सुंदर या शोभायमान बनाना है; पवित्रस्थान के संदर्भ में ‘सुशोभित करना’ स्वाभाविक और गरिमापूर्ण है।
- source_word: מְקוֹם מִקְדָּשִׁי
  choice: मेरे पवित्रस्थान की जगह
  rationale: मूल के संबंध-विन्यास को पारदर्शी ढंग से रखता है और ‘पवित्रस्थान’ उपासना-स्थल का अर्थ स्पष्ट करता है।
- source_word: וּמְקוֹם רַגְלַי
  choice: अपने चरणों की जगह
  rationale: मूल का शाब्दिक बिंब सुरक्षित है; ‘चरण’ ईश्वर के संदर्भ में गरिमापूर्ण आधुनिक हिंदी है और ‘पाँव रखने की चौकी’ जैसे व्याख्यात्मक अर्थ को मुख्य पाठ में नहीं थोपता।
- source_word: אֲכַבֵּד
  choice: महिमा दूँगा
  rationale: पिएल रूप यहाँ उस स्थान को गौरवशाली बनाने या महिमा देने का भाव रखता है; यह आरंभिक ‘वैभव’ से अनावश्यक शब्द-पुनरावृत्ति भी टालता है।
theological_decisions:
- issue: पवित्रस्थान के साथ परमेश्वर के संबंध का मानवरूपी चित्र
  choice: मुख्य पाठ में ‘अपने चरणों की जगह’ बनाए रखा
  alternative: ‘अपने पाँव रखने की चौकी’
  rationale: इब्रानी में सामान्यतः ‘पाँव रखने की चौकी’ के लिए प्रयुक्त संज्ञा नहीं, बल्कि अक्षरशः ‘मेरे चरणों की जगह’ है। मूल काव्य-बिंब को रखना व्याख्यात्मक निष्कर्ष थोपने से बचाता है।
- issue: स्त्रीलिंग एकवचन ‘तू’ का संदर्भ
  choice: मुख्य पाठ में संबोधित नगर का नाम नहीं जोड़ा
  alternative: ‘हे सिय्योन’ या ‘हे यरूशलेम’
  rationale: व्यापक प्रसंग में संबोधन सिय्योन/यरूशलेम से है, पर इस पद में नाम नहीं आता; इसलिए मूल की अंतर्निहित संदर्भता सुरक्षित रखी गई है।
- issue: अंतिम क्रिया में सम्मान अथवा महिमामंडन
  choice: ‘महिमा दूँगा’
  alternative: ‘सम्मान दूँगा’
  rationale: כבד का पिएल दोनों अर्थ दे सकता है। स्थान को शोभायमान करने के समानांतर ‘महिमा दूँगा’ काव्यात्मक और प्रसंगानुकूल है, जबकि अभिप्राय को किसी संप्रदायगत अर्थ में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, काव्यात्मक और सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। सिय्योन के लिए स्त्रीलिंग एकवचन संबोधन ‘तेरे’ से रखा गया है। वृक्ष-नामों की वास्तविक अनिश्चितता मुख्य पाठ को बोझिल किए बिना पादटिप्पणी में स्पष्ट की गई है।
