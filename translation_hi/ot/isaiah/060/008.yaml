- source_word: תְּעוּפֶינָה
  choice: उड़ते चले आ रहे हैं
  rationale: यह Qal अपूर्ण 3 स्त्रीलिंग बहुवचन है। दृश्य में वक्ता की ओर आते समूह और अगले खंड में घर की ओर लौटते कबूतरों की गति को स्वाभाविक हिन्दी में व्यक्त किया गया है, बिना क्रिया में 'शीघ्र' जैसा अतिरिक्त अर्थ जोड़े।
- source_word: וְכַיּוֹנִים
  choice: और कबूतरों के समान
  rationale: संयोजक और समानांतर उपमा दोनों स्पष्ट रखे गए हैं।
- source_word: אֶל
  choice: की ओर
  rationale: दिशासूचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और लक्ष्य की ओर उड़ान का भाव बनाए रखता है।
- source_word: אֲרֻבֹּתֵיהֶם
  choice: अपनी खिड़कियों
  rationale: אֲרֻבָּה का मूल अर्थ खिड़की या खुला स्थान है। कबूतरखाने के संदर्भगत अर्थ को मुख्य पाठ में निश्चित न करके पादटिप्पणी में सुरक्षित रखा गया है।
