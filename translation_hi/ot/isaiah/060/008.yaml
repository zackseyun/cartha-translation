  choice: ये कौन हैं
  rationale: प्रश्नवाचक सर्वनाम और बहुवचन संकेतवाचक को स्वाभाविक हिन्दी प्रश्न-विन्यास में रखा गया है; इब्रानी में निहित योजक क्रिया हिन्दी में स्पष्ट की गई है।
- source_word: כָּעָב
