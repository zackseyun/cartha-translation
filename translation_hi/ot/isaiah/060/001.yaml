source:
  edition: WLC
  text: ק֥וּמִי א֖וֹרִי כִּ֣י בָ֣א אוֹרֵ֑/ךְ וּ/כְב֥וֹד יְהוָ֖ה עָלַ֥יִ/ךְ זָרָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/001.yaml
  text: Arise[a], shine, for your light has come[b], and the glory of Yahweh has risen upon you.
translation:
  language: hi
  text: उठ, प्रकाशमान हो[a], क्योंकि तेरा प्रकाश आ गया है, और याहवे[b] की महिमा तेरे ऊपर उदित हुई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उठ, चमक उठ’; हिब्रू आज्ञा का अर्थ स्वयं उज्ज्वल होना या प्रकाश देना, दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'हिब्रू: ‘YHWH’, परमेश्वर का व्यक्तिगत वाचा-नाम; यहाँ ‘याहवे’ लिखा गया है।'
    reason: divine_name
lexical_decisions:
- source_word: ק֥וּמִי
  choice: उठ
  rationale: यह קום का स्त्रीलिंग एकवचन आज्ञार्थक रूप है और सिय्योन/यरूशलेम को सीधे उठने का आह्वान करता है। ‘उठ’ आधुनिक हिन्दी में स्वाभाविक और भविष्यद्वाणी की गरिमा के अनुकूल है।
- source_word: א֖וֹרִי
  choice: प्रकाशमान हो
  rationale: यह אור का स्त्रीलिंग एकवचन आज्ञार्थक रूप है। यहाँ अर्थ उज्ज्वल होने अथवा प्रकाश बिखेरने, दोनों की ओर संकेत कर सकता है; ‘प्रकाशमान हो’ इस व्यापकता को बनाए रखता है और अगले वाक्यांश ‘तेरा प्रकाश’ से जुड़ता है।
- source_word: כִּ֣י
  choice: क्योंकि
  rationale: यह दोनों आज्ञाओं का कारण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इसके कारणवाचक बल को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָ֣א אוֹרֵ֑ךְ
  choice: तेरा प्रकाश आ गया है
  rationale: בוא के पूर्ण रूप और אוֹר पर लगे स्त्रीलिंग एकवचन संबंधसूचक प्रत्यय को सीधे व्यक्त किया गया है। पूर्ण वर्तमान भविष्यद्वाणी में प्रतिज्ञात घटना को निश्चित और मानो घटित दिखाने वाली सजीवता बनाए रखता है।
- source_word: וּכְב֥וֹד יְהוָ֖ה
  choice: और यहोवा की महिमा
  rationale: כבוד में सम्मान, वैभव और प्रकट दिव्य तेज के भाव समाहित हैं; ‘महिमा’ इन्हें अनावश्यक रूप से सीमित नहीं करती। יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: עָלַ֥יִךְ זָרָֽח
  choice: तेरे ऊपर उदित हुई है
  rationale: זרח प्रायः सूर्य या प्रकाश के उगने और चमकने के लिए आता है। ‘उदित हुई है’ उषाकालीन बिंब को सुरक्षित रखता है; हिन्दी में क्रिया ‘महिमा’ के अनुसार स्त्रीलिंग है, जबकि हिब्रू क्रिया व्याकरणतः כבוד के अनुसार पुल्लिंग है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत दिव्य नाम स्पष्ट रूप से है। ‘यहोवा’ सामान्य हिन्दी पाठक के लिए पहचाना हुआ रूप है और नाम को केवल उपाधि में बदलने से बचाता है।
- issue: בָא और זָרָח के हिब्रू पूर्ण रूपों का कालगत बल
  choice: पूर्ण वर्तमान—‘आ गया है’, ‘उदित हुई है’
  alternative: भविष्यकाल—‘आएगा’, ‘उदित होगी’
  rationale: भविष्यद्वाणी के प्रसंग में ये रूप भावी पुनर्स्थापना को निश्चित और सजीव रूप में मानो घटित प्रस्तुत कर सकते हैं। पूर्ण वर्तमान उस तनाव को बनाए रखता है और पाठ को केवल अतीत अथवा स्पष्ट भविष्य में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सिय्योन/यरूशलेम को स्त्रीलिंग एकवचन में संबोधन हिब्रू रूपों में स्पष्ट है; हिन्दी में ‘तेरा/तेरे’ संबोधन निकटता और काव्यात्मक प्रत्यक्षता बनाए रखता है। ‘प्रकाशमान हो’ अपेक्षाकृत औपचारिक है, पर भविष्यद्वाणी के काव्यात्मक स्वर और אור की अर्थ-व्याप्ति के अनुकूल है।
