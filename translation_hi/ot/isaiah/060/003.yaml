base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/003.yaml
  text: Nations will come to your light[c][b][a], and kings to the brightness of your rising.
translation:
  language: hi
  text: राष्ट्र[b] तेरे प्रकाश की ओर आएँगे[a], और राजा तेरे उदय की दीप्ति[c] की ओर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चलेंगे’ अथवा ‘जाएँगे।’
    reason: lexical_alternative
  - marker: b
    text: ‘राष्ट्र’ का अनुवाद कुछ प्रसंगों में ‘ग़ैर-यहूदी जातियाँ’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘तेरी भोर की आभा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: आएँगे
  rationale: הלך का मूल अर्थ ‘चलना/जाना’ है, पर לְ के साथ किसी लक्ष्य की ओर बढ़ने के संदर्भ में हिन्दी में ‘आएँगे’ स्वाभाविक है; भविष्यकाल भविष्यसूचक प्रसंग के अनुकूल है।
- source_word: גוֹיִם
  choice: राष्ट्र
  rationale: यह शब्द राष्ट्रों अथवा जाति-समुदायों को दर्शाता है। यहाँ ‘राष्ट्र’ व्यापक और प्रसंगानुकूल है; ‘ग़ैर-यहूदी’ अधिक व्याख्यात्मक होगा।
- source_word: לְאוֹרֵךְ
  choice: तेरे प्रकाश की ओर
  rationale: אוֹר का अर्थ ‘प्रकाश’ है और לְ दिशात्मक अर्थ देता है। स्त्रीलिंग एकवचन प्रत्यय उस सिय्योन/यरूशलेम की ओर संकेत करता है जिसे सीधे संबोधित किया गया है।
- source_word: וּמְלָכִים
  choice: और राजा
  rationale: מְלָכִים का सीधा अर्थ ‘राजा’ है; ‘शासक’ स्रोत से अधिक व्यापक होता।
- source_word: לְנֹגַהּ
  choice: दीप्ति की ओर
  rationale: נֹגַהּ चमक, आभा या दीप्ति को व्यक्त करता है। ‘दीप्ति’ काव्यात्मक गरिमा रखते हुए आधुनिक हिन्दी में बोधगम्य है।
- source_word: זַרְחֵךְ
  choice: तेरे उदय की
  rationale: זרח में उगने अथवा चमककर प्रकट होने का बिंब है। ‘तेरे उदय’ उस व्यापक बिंब को सुरक्षित रखता है; ‘तेरी भोर’ सम्भव, पर कुछ अधिक विशिष्ट है।
theological_decisions:
- issue: स्त्रीलिंग एकवचन प्रत्ययों का संदर्भ
  choice: स्त्री के रूप में व्यक्त सिय्योन/यरूशलेम को संबोधन
  alternative: अधिक सामान्य रूप से परमेश्वर की प्रजा को संबोधन
  rationale: यशायाह 60 के निकटवर्ती प्रसंग में सिय्योन को स्त्रीलिंग एकवचन में संबोधित किया गया है। हिन्दी पाठ ‘तेरे’ द्वारा सीधा संबोधन बनाए रखता है और मुख्य पाठ में कोई व्यापक कलीसियाई अर्थ आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक है। हिन्दी में अनावश्यक पुनरावृत्ति से बचने के लिए ‘आएँगे’ को दोनों समानांतर खंडों के लिए अंत में रखा गया है।
