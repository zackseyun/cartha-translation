  text: לֹא יָב֥וֹא עוֹד֙ שִׁמְשֵׁ֔/ךְ וִ/ירֵחֵ֖/ךְ לֹ֣א יֵאָסֵ֑ף כִּ֣י יְהוָ֗ה יִֽהְיֶה לָּ/ךְ֙ לְ/א֣וֹר עוֹלָ֔ם וְ/שָׁלְמ֖וּ יְמֵ֥י אֶבְלֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/020.yaml
  text: Your sun will no longer go down[a], and your moon will not withdraw; for Yahweh will be your everlasting light[b], and the days of your mourning will be ended.
translation:
  language: hi
  text: अब तुम्हारा सूर्य फिर कभी अस्त न होगा,[a] और तुम्हारा चंद्रमा लुप्त न होगा;[b] क्योंकि याहवे तुम्हारे लिए सदा का प्रकाश होगा, और तुम्हारे शोक के दिन समाप्त हो जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारा सूर्य फिर कभी नहीं आएगा।” यहाँ यह सूर्य के अस्त होने के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हारा चंद्रमा समेटा नहीं जाएगा” अर्थात् उसके प्रकाश को हटाया या वापस नहीं लिया जाएगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יָבוֹא עוֹד שִׁמְשֵׁךְ
  choice: अब तुम्हारा सूर्य फिर कभी अस्त न होगा
  rationale: יָבוֹא का शाब्दिक अर्थ ‘आएगा’ है, पर सूर्य के साथ यहाँ यह अस्त होने का मुहावरा है। ‘अस्त न होगा’ आधुनिक हिन्दी में स्वाभाविक है; ‘अब’ और ‘फिर कभी’ עוֹד के भविष्य में पुनरावृत्ति न होने के भाव को व्यक्त करते हैं।
- source_word: וִירֵחֵךְ לֹא יֵאָסֵף
  choice: और तुम्हारा चंद्रमा ओझल न होगा
  rationale: יֵאָסֵף, אסף का निफ़अल रूप, मूलतः ‘समेट लिया जाना/हटा लिया जाना’ है। ‘ओझल न होगा’ प्रकाश से हटने या दिखाई न देने का भाव सहज हिन्दी में देता है; शाब्दिक विकल्प फुटनोट में सुरक्षित है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: יִהְיֶה לָךְ לְאוֹר עוֹלָם
  choice: तुम्हारे लिए सदा का प्रकाश होगा
  rationale: לָךְ की ‘तुम्हारे लिए’ संरचना को बनाए रखा गया है और עוֹלָם को यहाँ स्थायी, अनंतकालीन प्रकाश के अर्थ में सहज ‘सदा का’ कहा गया है।
- source_word: וְשָׁלְמוּ יְמֵי אֶבְלֵךְ
  choice: और तुम्हारे शोक के दिन समाप्त हो जाएँगे
  rationale: שָׁלְמוּ का अर्थ पूरा या समाप्त हो जाना है। ‘शोक के दिन समाप्त हो जाएँगे’ अवधि के पूर्ण अंत को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल पाठ में निजी नाम स्पष्ट रूप से है। इसलिए उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया; हिन्दी पाठकों में परिचित लिप्यंतरण ‘यहोवा’ चुना गया।
- issue: सूर्य और चंद्रमा की भविष्यसूचक छवि
  choice: ब्रह्मांडीय छवि को पाठ में यथावत रखना
  alternative: इसे केवल सांत्वना या समृद्धि का रूपक बनाकर कहना
  rationale: मूल पद सृष्ट प्रकाशों और यहोवा के स्थायी प्रकाश के बीच तनावपूर्ण भविष्यसूचक छवि रखता है। अनुवाद किसी एक युगांत-विषयक व्याख्या को आरोपित किए बिना उस छवि को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। स्त्रीलिंग एकवचन संबोधन हिन्दी में अलग रूप से दिखाई नहीं देता, पर संदर्भ में यह सिय्योन/यरूशलेम से संबोधन है। विरामचिह्न दो समानांतर प्रतिज्ञाओं और उनके कारण को स्पष्ट करते हैं।
