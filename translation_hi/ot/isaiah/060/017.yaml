base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/017.yaml
  text: Instead of bronze I will bring gold[a], and instead of iron I will bring silver; instead of wood, bronze, and instead of stones, iron. And I will make peace your overseers[c][b], and righteousness your taskmasters.
translation:
  language: hi
  text: 'काँसे के बदले मैं सोना लाऊँगा,

    और लोहे के बदले चाँदी;

    लकड़ी के बदले काँसा,

    और पत्थरों के बदले लोहा।

    मैं तुम्हारे प्रशासन[a] को शान्ति

    और तुमसे बेगार कराने वालों[c] को धार्मिकता[b] बना दूँगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारी देखरेख’, ‘तुम्हारा पद’ अथवा ‘तुम्हारे अधिकारी’। इब्रानी शब्द देखरेख, पद, प्रशासन या अधिकारियों का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘न्याय’। इब्रानी शब्द नैतिक धार्मिकता और सार्वजनिक व्यवस्था में न्याय—दोनों का बोध करा सकता है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात वे जो श्रम या कर कठोरता से वसूल करते हैं; इसका अनुवाद ‘तुम पर अत्याचार करने वाले’ भी हो सकता है। इब्रानी रूप बहुवचन है।
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: के बदले
  rationale: यहाँ निर्माण-सामग्री की अदला-बदली का भाव है; स्थानसूचक अर्थ ‘के नीचे’ नहीं।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: यह शब्द ताँबे अथवा काँसे के लिए व्यापक रूप से प्रयुक्त हो सकता है; निर्माण-सामग्री की इस सूची में ‘काँसा’ स्वाभाविक है और ‘पीतल’ जैसी अनैतिहासिक विशिष्टता से बचता है।
- source_word: אָבִיא
  choice: मैं ... लाऊँगा
  rationale: बोא के हिफ़ील रूप में यहाँ परमेश्वर द्वारा उत्तम सामग्री उपलब्ध कराने का भाव है।
- source_word: כֶסֶף
  choice: चाँदी
  rationale: सोने, काँसे और लोहे के समानान्तर यहाँ धातु अभिप्रेत है, धन नहीं।
- source_word: עֵצִים
  choice: लकड़ी
  rationale: बहुवचन संज्ञा यहाँ सामूहिक रूप से निर्माण में प्रयुक्त लकड़ी को दर्शाती है।
- source_word: פְקֻדָּתֵךְ
  choice: तुम्हारा प्रशासक
  rationale: פקד से बनी यह संज्ञा देखरेख, पद, प्रशासन या अधिकारी का बोध करा सकती है। व्यक्तिगत पदनाम चुनने से अगले समानान्तर पद के साथ काव्यात्मक मानवीकरण बना रहता है; अस्पष्टता पादटिप्पणी में दी गई है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: शब्द में कुशलता और समग्र कल्याण भी समाहित हैं, पर पुनर्स्थापित सामाजिक व्यवस्था के इस दर्शन में ‘शान्ति’ उसका केंद्रीय और परिचित अर्थ है।
- source_word: נֹגְשַׂיִךְ
  choice: तुमसे बेगार वसूलने वाला
  rationale: यह शब्द श्रम या कर कठोरता से वसूलने वाले व्यक्ति को दर्शाता है। यह चयन पुराने दमनकारी पद और उसके धार्मिकता में रूपान्तरण की तीखी काव्यात्मक विडम्बना बनाए रखता है।
- source_word: צְדָקָה
  choice: धार्मिकता
  rationale: यह नैतिक धार्मिकता और सार्वजनिक न्याय, दोनों का अर्थ दे सकता है। मुख्य पाठ में पारम्परिक व्यापक पद रखा गया है और ‘न्याय’ को पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: अन्तिम पंक्ति में शासन-संबंधी शब्दों और अमूर्त गुणों का सम्बन्ध
  choice: शान्ति और धार्मिकता को नगर के अधिकारी तथा बेगार वसूलने वाले के रूप में मानवीकृत रखना
  alternative: ‘मैं तुम्हारे प्रशासन को शान्तिमय और तुम्हारे शासकों को न्यायी बनाऊँगा’
  rationale: इब्रानी को प्रशासन की दशा या अधिकारियों के काव्यात्मक व्यक्तित्व—दोनों रूपों में समझा जा सकता है। चुना हुआ पाठ मूल की संक्षिप्त समानान्तर रचना, मानवीकरण और दमनकारी पद के रूपान्तरण को बचाता है, बिना किसी विशिष्ट शासन-व्यवस्था को आरोपित किए।
- issue: צְדָקָה का अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘धार्मिकता’
  alternative: ‘न्याय’
  rationale: दोनों अर्थ संदर्भ में सम्भव हैं। ‘धार्मिकता’ व्यापक नैतिक अर्थ को बनाए रखती है, जबकि सार्वजनिक न्याय का अर्थ पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक पंक्तियाँ रखी गई हैं। ‘काँसा’, ‘बेगार वसूलने वाला’ और ‘प्रशासक’ सामान्य पाठक के लिए स्पष्ट हैं। अन्तिम दो पंक्तियों में मूल का मानवीकरण और समानान्तर तनाव सुरक्षित रखा गया है; सम्भव प्रशासनिक और न्याय-संबंधी अर्थ पादटिप्पणियों में दिए गए हैं।
