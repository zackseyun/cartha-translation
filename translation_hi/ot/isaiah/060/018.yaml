id: ISA.60.18
reference: Isaiah 60:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹא יִשָּׁמַ֨ע ע֤וֹד חָמָס֙ בְּ/אַרְצֵ֔/ךְ שֹׁ֥ד וָ/שֶׁ֖בֶר בִּ/גְבוּלָ֑יִ/ךְ וְ/קָרָ֤את יְשׁוּעָה֙ חוֹמֹתַ֔יִ/ךְ וּ/שְׁעָרַ֖יִ/ךְ תְּהִלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/018.yaml
  text: Violence will no longer be heard in your land[a], devastation or destruction within your borders; and you will call your walls Salvation, and your gates Praise.
translation:
  language: hi
  text: तुम्हारे देश में फिर कभी हिंसा की बात सुनाई नहीं देगी, न तुम्हारी सीमाओं के भीतर उजाड़ और विनाश होगा[a]; और तुम अपनी दीवारों को ‘उद्धार’ और अपने फाटकों को ‘स्तुति’ कहोगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लूटपाट और बरबादी’।
    reason: שֹׁד और שֶׁבֶר क्रमशः लूट/तबाही तथा टूटन/बरबादी के अर्थ भी दे सकते हैं; पादटिप्पणी इस वास्तविक शब्दार्थ-विकल्प को सुरक्षित रखती है।
lexical_decisions:
- source_word: יִשָּׁמַע
  choice: बात सुनाई नहीं देगी
  rationale: निफ़अल रूप का निष्क्रिय अर्थ बनाए रखते हुए यह हिंसा की आवाज़ या उसके समाचार—दोनों की संभावित व्याप्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חָמָס
  choice: हिंसा
  rationale: यह शब्द हिंसक अन्याय, क्रूरता और उत्पीड़न को सूचित करता है; समानांतर विनाशकारी शब्दों के साथ ‘हिंसा’ सबसे सीधा और व्यापक विकल्प है।
- source_word: בְּאַרְצֵךְ
  choice: तुम्हारे देश में
  rationale: אֶרֶץ के भौगोलिक अर्थ को आधुनिक हिन्दी में स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: שֹׁד
  choice: उजाड़
  rationale: यह शब्द लूट से उत्पन्न तबाही या उजाड़ को सूचित कर सकता है। मुख्य पाठ में परिणामपरक अर्थ रखा गया है और वैकल्पिक ‘लूटपाट’ पादटिप्पणी में दिया गया है।
- source_word: שֶׁבֶר
  choice: विनाश
  rationale: मूलतः टूटने या ध्वंस की धारणा वाला यह शब्द भविष्यद्वाणी के संदर्भ में बरबादी या विनाश का बोध देता है।
- source_word: בִּגְבוּלָיִךְ
  choice: तुम्हारी सीमाओं के भीतर
  rationale: सीमा और उससे घिरे भूभाग—दोनों स्थानिक पक्षों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְקָרָאת
  choice: और तुम ... कहोगी
  rationale: इब्रानी संयोजक וְ को ‘और’ के रूप में रखा गया है; स्त्रीलिंग क्रिया सिय्योन/नगर को संबोधन के अनुरूप है।
- source_word: יְשׁוּעָה
  choice: ‘उद्धार’
  rationale: दीवारों को दिए जाने वाले नाम के रूप में यह बचाव और मुक्ति, दोनों का अर्थ रखता है तथा भविष्यद्वाणी की उद्धार-विषयक भाषा को बनाए रखता है।
- source_word: חוֹמֹתַיִךְ
  choice: अपनी दीवारों को
  rationale: नगर की रक्षात्मक दीवारों के बिंब का सीधा और सुबोध अनुवाद है।
- source_word: שְׁעָרַיִךְ
  choice: अपने फाटकों को
  rationale: नगर के प्रवेश-द्वारों का पारंपरिक किंतु आज भी बोधगम्य हिन्दी रूप है।
- source_word: תְּהִלָּה
  choice: ‘स्तुति’
  rationale: नाम के रूप में प्रयुक्त संज्ञा के स्तुति और प्रशंसा संबंधी अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: יְשׁוּעָה और תְּהִלָּה को सामान्य वर्णन मानना या दीवारों और फाटकों के दिए हुए नाम
  choice: 'उद्धरण-चिह्नों सहित नाम-सदृश पद: ‘उद्धार’ और ‘स्तुति’'
  alternative: इन्हें बिना नाम-संकेत के सामान्य संज्ञाओं ‘उद्धार’ और ‘स्तुति’ के रूप में पढ़ना
  rationale: ‘तुम ... कहोगी’ की वाक्य-रचना इन्हें दिए गए नामों के रूप में प्रस्तुत करती है। हिन्दी में उद्धरण-चिह्न इस नामकरण को स्पष्ट करते हैं, बिना अनावश्यक व्यक्तिकरण जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। स्त्रीलिंग ‘कहोगी’ से संबोधित सिय्योन/नगर का व्याकरणिक स्वरूप व्यक्त होता है। ‘और’ मूल इब्रानी संयोजक का अनुसरण करता है और स्रोत में निहित न होने वाला स्पष्ट विरोध नहीं जोड़ता।
