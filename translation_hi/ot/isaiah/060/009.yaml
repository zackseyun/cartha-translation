  text: כִּֽי לִ֣/י אִיִּ֣ים יְקַוּ֗וּ וָ/אֳנִיּ֤וֹת תַּרְשִׁישׁ֙ בָּ/רִ֣אשֹׁנָ֔ה לְ/הָבִ֤יא בָנַ֨יִ/ךְ֙ מֵֽ/רָח֔וֹק כַּסְפָּ֥/ם וּ/זְהָבָ֖/ם אִתָּ֑/ם לְ/שֵׁם֙ יְהוָ֣ה אֱלֹהַ֔יִ/ךְ וְ/לִ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל כִּ֥י פֵאֲרָֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/009.yaml
  text: Surely the coastlands wait for me[a], and the ships of Tarshish first, to bring your sons from far away, with their silver and their gold with them, for the name of Yahweh your God, and for the Holy One of Israel[b], because he has glorified you.
translation:
  language: hi
  text: निश्चय ही समुद्र-पार के देश मेरी बाट जोहेंगे,[a] और तर्शीश के जहाज़ सबसे पहले तुम्हारे पुत्रों को दूर से ले आने के लिए आएँगे, उनकी चाँदी और उनका सोना उनके साथ होगा, तुम्हारे परमेश्वर यहोवा के नाम के लिए और इस्राएल के पवित्र के लिए, क्योंकि उसने तुम्हें महिमा दी है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “द्वीप” अथवा “दूर के समुद्री तट”; इब्रानी शब्द प्रायः समुद्री क्षेत्रों और तटवर्ती देशों के लिए व्यापक रूप से प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: या “क्योंकि उसने तुम्हें सुन्दर बनाया है” अथवा “क्योंकि उसने तुम्हें सम्मान दिया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: निश्चय ही
  rationale: यहाँ यह शब्द पिछले संदर्भ से जुड़ी आश्वस्त करने वाली और बलाघाती व्याख्या प्रस्तुत करता है।
- source_word: אִיִּים
  choice: समुद्र-पार के देश
  rationale: यशायाह में यह शब्द केवल द्वीपों तक सीमित नहीं, बल्कि दूरस्थ समुद्री तटवर्ती क्षेत्रों और देशों को भी सूचित करता है; यह चुनाव उस व्यापक अर्थ को सहज हिन्दी में रखता है।
- source_word: יְקַוּוּ
  choice: बाट जोहेंगे
  rationale: क्रिया आशापूर्ण और उत्सुक प्रतीक्षा का भाव रखती है; 'बाट जोहना' साधारण पाठक के लिए स्वाभाविक और अर्थपूर्ण है।
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: तर्शीश के जहाज़
  rationale: इब्रानी संबंधवाचक पदबंध को ज्यों का त्यों रखा गया है, बिना यह तय किए कि तर्शीश गंतव्य है या बड़े समुद्री व्यापारिक जहाज़ों का संकेत।
- source_word: בָּרִאשֹׁנָה
  choice: सबसे पहले
  rationale: यह प्राथमिकता अथवा अग्रणी स्थान बताता है; हिन्दी में 'सबसे पहले' स्पष्ट और स्वाभाविक है।
- source_word: בָנַיִךְ
  choice: तुम्हारे पुत्रों
  rationale: मूल में स्पष्ट पुल्लिंग बहुवचन है और आसपास के संदर्भ में पुत्रियों का अलग उल्लेख है, इसलिए लिंग-विशिष्ट अर्थ सुरक्षित रखा गया है।
- source_word: כַּסְפָּם וּזְהָבָם אִתָּם
  choice: उनका चाँदी और सोना भी उनके साथ होगा
  rationale: मूल के दोनों स्वत्वसूचक रूपों और 'उनके साथ' के बल को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: לְשֵׁם יְהוָה אֱלֹהַיִךְ
  choice: तुम्हारे परमेश्वर यहोवा के नाम के लिए
  rationale: לְ का प्रयोजन और सम्मान का भाव व्यक्त किया गया है तथा व्यक्तिवाचक वाचा-नाम को 'यहोवा' से लिप्यंतरित किया गया है।
- source_word: וְלִקְדוֹשׁ יִשְׂרָאֵל
  choice: और इस्राएल के पवित्र परमेश्वर के लिए
  rationale: यशायाह की विशिष्ट ईश्वरीय उपाधि को हिन्दी में स्पष्ट किया गया है और पिछले प्रयोजनवाचक पदबंध के समानांतर रखा गया है।
- source_word: פֵאֲרָךְ
  choice: तुम्हें महिमा दी है
  rationale: पिअेल क्रिया का मुख्य भाव गौरवान्वित अथवा शोभायमान करना है; 'महिमा दी है' संदर्भ में प्रतिष्ठा और वैभव दोनों को समेटता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा का व्यक्तिवाचक नाम सीधे आया है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले 'यहोवा' को रखा गया है, न कि उसे केवल 'प्रभु' पदवी से बदला गया है।
- issue: בָנַיִךְ में लिंग-सूचना
  choice: तुम्हारे पुत्रों
  alternative: तुम्हारी सन्तानों
  rationale: मूल का पुल्लिंग बहुवचन और निकटवर्ती संदर्भ में पुत्रियों का पृथक उल्लेख विशिष्ट अर्थ का समर्थन करता है।
- issue: פֵאֲרָךְ का अर्थ
  choice: उसने तुम्हें महिमा दी है
  alternative: उसने तुम्हें सुन्दर बनाया है / सम्मान दिया है
  rationale: क्रिया महिमान्वित करने, शोभा देने या सम्मानित करने की अर्थ-सीमा रखती है। मुख्य पाठ में व्यापक धार्मिक-साहित्यिक अर्थ लिया गया और अन्य वास्तविक संभावनाएँ टिप्पणी में रखी गईं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक पाठ के योग्य रूप अपनाया गया है। स्त्रीलिंग एकवचन संबोधन 'तुम' के स्वाभाविक हिन्दी रूप में है। वाक्य-विन्यास को मूल के प्रयोजन और समानांतरता के निकट रखते हुए अनावश्यक इब्रानीपन से बचाया गया है।
