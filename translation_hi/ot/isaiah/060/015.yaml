base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/015.yaml
  text: Instead of your being forsaken and hated[a], with no one passing through, I will make you an everlasting majesty, a joy from generation to generation.
translation:
  language: hi
  text: तेरे परित्यक्त और घृणा की पात्र होने, और किसी के तेरे बीच से होकर न गुजरने के बदले, मैं तुझे सदा का गौरव[a] और पीढ़ी-दर-पीढ़ी आनंद बनाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सदा का वैभव,” “सदा की महिमा” अथवा “सदा का ऊँचा सम्मान।” इब्रानी शब्द ऊँची, प्रतिष्ठित दशा का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת הֱיוֹתֵךְ
  choice: उस दशा के बदले
  rationale: यह पदबंध सिय्योन की पिछली दशा और परमेश्वर द्वारा लाई जाने वाली नई दशा के बीच उलटाव या विनिमय व्यक्त करता है। हिंदी में वाक्य के अंत तक संबंध स्पष्ट रखने के लिए इसे पूर्व दशा के वर्णन के बाद रखा गया है।
- source_word: עֲזוּבָה
  choice: त्याग दी गई थी
  rationale: स्त्रीलिंग निष्क्रिय रूप सिय्योन/यरूशलेम के परित्यक्त होने को सीधे व्यक्त करता है।
- source_word: וּשְׂנוּאָה
  choice: जिससे घृणा की जाती थी
  rationale: यह निष्क्रिय भाव में घृणा की वस्तु होने का सीधा अर्थ रखता है; ‘तुच्छ समझी गई’ की अपेक्षा मूल अर्थ के अधिक निकट है।
- source_word: וְאֵין עוֹבֵר
  choice: कोई तुझमें से होकर नहीं गुजरता था
  rationale: उजाड़ नगर में आवागमन न होने की ठोस छवि को बनाए रखता है।
- source_word: וְשַׂמְתִּיךְ
  choice: मैं तुझे ... बनाऊँगा
  rationale: इस प्रसंग में שׂים + ל किसी को नई स्थिति प्रदान करने का अर्थ देता है।
- source_word: לִגְאוֹן עוֹלָם
  choice: सदा का गौरव
  rationale: גאון यहाँ परमेश्वर से मिली ऊँची और सम्मानित स्थिति को दर्शाता है, न कि पापपूर्ण घमंड को; עוֹלָם उसके स्थायी बने रहने पर बल देता है।
- source_word: מְשׂוֹשׂ
  choice: आनंद का कारण
  rationale: हिंदी में यह स्पष्ट और स्वाभाविक ढंग से बताता है कि पुनर्स्थापित नगर पीढ़ियों के लिए आनंद का विषय होगा।
- source_word: דּוֹר וָדוֹר
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह प्रचलित हिंदी अभिव्यक्ति लगातार आने वाली पीढ़ियों का मूल भाव सुरक्षित रखती है।
theological_decisions:
- issue: पुनर्स्थापना की भविष्यवाणी में גאון का अर्थ
  choice: गौरव
  alternative: वैभव, महिमा, ऊँचा सम्मान
  rationale: संदर्भ में यह सिय्योन को परमेश्वर द्वारा प्रदान की गई प्रतिष्ठित और उन्नत दशा है। ‘गौरव’ सकारात्मक सम्मान को व्यक्त करता है और ‘घमंड’ के नकारात्मक नैतिक अर्थ से बचता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्त्रीलिंग संबोधन से सिय्योन/यरूशलेम का व्यक्तित्व बना रहता है। लंबी इब्रानी संरचना को हिंदी में स्वाभाविक बनाने के लिए ‘उस दशा के बदले’ को पूर्व दशा के वर्णन के बाद रखा गया है।
