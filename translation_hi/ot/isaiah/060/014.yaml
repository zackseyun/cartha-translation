base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/014.yaml
  text: The sons of those who afflicted you will come to you bowed down[a], and all who despised you will bow down at the soles of your feet; and they will call you The City of Yahweh[c][b], Zion of the Holy One of Israel.
translation:
  language: hi
  text: तेरे दुःख देनेवालों के बेटे झुके हुए तेरे पास आएँगे[a]; और वे सभी जिन्होंने तुझे तुच्छ जाना था, तेरे पैरों के तलवों के सामने दण्डवत् करेंगे[b]। वे तुझे “याहवे का नगर, इस्राएल के पवित्र परमेश्वर का सिय्योन” कहेंगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे अत्याचारियों के बेटे झुके हुए तेरे पास आएँगे।” इब्रानी में शाब्दिक रूप से “तुझे दुःख देनेवालों के बेटे” है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “दण्डवत् करेंगे” सिय्योन के प्रति अधीनता या सम्मान प्रकट करता है, नगर की ईश्वरीय उपासना नहीं।
    reason: cultural_note
  - marker: c
    text: इब्रानी वाक्यांश एक संक्षिप्त उपाधि है, जिसका आशय है कि सिय्योन इस्राएल के पवित्र परमेश्वर का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁחֹחַ
  choice: झुके हुए
  rationale: यह शारीरिक रूप से नीची की हुई मुद्रा और उससे व्यक्त अधीनता—दोनों को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: בְּנֵי מְעַנַּיִךְ
  choice: जिन्होंने तुझे दुःख दिया था, उनके बेटे
  rationale: बְּנֵי के पुल्लिंग और शाब्दिक अर्थ ‘बेटे’ को सुरक्षित रखते हुए מְעַנַּיִךְ को उसके सताने/दुःख देने के अर्थ में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: וְהִשְׁתַּחֲווּ
  choice: दण्डवत् करेंगे
  rationale: क्रिया भूमि तक झुकने या साष्टांग होने की मुद्रा बताती है। इस प्रसंग में यह सिय्योन के प्रति अधीनता और सम्मान है, उसकी ईश्वरीय उपासना नहीं।
- source_word: עַל כַּפּוֹת רַגְלַיִךְ
  choice: तेरे पैरों के तलवों पर
  rationale: כַּפּוֹת की ‘तलवों’ वाली सजीव छवि को सामान्य ‘पैरों पर’ कहकर समतल नहीं किया गया।
- source_word: מְנַאֲצָיִךְ
  choice: जिन्होंने तुझे तुच्छ जाना था
  rationale: यह נאץ में निहित तिरस्कार और अवमानना को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עִיר יְהוָה
  choice: याहवे का नगर
  rationale: יְהוָה को वाचा-संबंधी व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है; संबंधसूचक रचना शीर्षक को स्वाभाविक हिन्दी देती है।
- source_word: צִיּוֹן קְדוֹשׁ יִשְׂרָאֵל
  choice: इस्राएल के पवित्र परमेश्वर का सिय्योन
  rationale: संक्षिप्त इब्रानी रचना को ऐसे संबंधसूचक शीर्षक के रूप में व्यक्त किया गया है जिससे स्पष्ट हो कि सिय्योन ‘इस्राएल के पवित्र परमेश्वर’ से संबंधित है, न कि सिय्योन स्वयं वह पवित्र जन है।
- source_word: וְקָרְאוּ לָךְ
  choice: वे तुझे … कहेंगे
  rationale: नाम या उपाधि से पुकारने के इब्रानी मुहावरे का सीधा और सहज हिन्दी रूप है।
theological_decisions:
- issue: सिय्योन के सामने किए गए प्रणाम का स्वरूप
  choice: मानवीय विरोधी पुनर्स्थापित सिय्योन के सामने अधीनता में दण्डवत् करते हैं
  alternative: इसे नगर की ईश्वरीय उपासना मानना
  rationale: השתחוה ईश्वर-संबंधी प्रसंगों में उपासना सूचित कर सकती है, पर यहाँ उसका लक्ष्य सिय्योन है; अतः शारीरिक प्रणाम और अधीनता को रखा गया है, नगर की उपासना को नहीं।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: צִיּוֹן קְדוֹשׁ יִשְׂרָאֵל की संक्षिप्त रचना
  choice: इस्राएल के पवित्र परमेश्वर का सिय्योन
  alternative: सिय्योन, इस्राएल का पवित्र जन
  rationale: संबंधसूचक अनुवाद उस आशय को व्यक्त करता है कि सिय्योन इस्राएल के पवित्र परमेश्वर का है और उस भ्रामक अर्थ से बचता है कि सिय्योन स्वयं ‘इस्राएल का पवित्र जन’ है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सुबोध रूप अपनाया गया है। यशायाह में स्त्रीलिंग नगर सिय्योन को एकवचन निकट संबोधन होने के कारण ‘तुझे/तेरे’ रखा गया है। ‘दण्डवत्’ सामान्य धार्मिक शब्दावली में परिचित है, पर पादटिप्पणी उसके यहाँ अधीनता-सूचक अर्थ को स्पष्ट करती है।
