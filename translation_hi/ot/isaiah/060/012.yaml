  edition: WLC
  text: כִּֽי הַ/גּ֧וֹי וְ/הַ/מַּמְלָכָ֛ה אֲשֶׁ֥ר לֹא יַעַבְד֖וּ/ךְ יֹאבֵ֑דוּ וְ/הַ/גּוֹיִ֖ם חָרֹ֥ב יֶחֱרָֽבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/012.yaml
  text: For the nation and the kingdom that will not serve you will perish[b][a], and those nations will be utterly laid waste.
translation:
  language: hi
  text: क्योंकि जो जाति और राज्य तेरी सेवा न करेंगे, वे नष्ट हो जाएँगे; और जातियाँ[a] पूरी तरह उजाड़ हो जाएँगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में पहले ‘जाति और राज्य’ एकवचन में हैं, फिर ‘जातियाँ’ बहुवचन में आता है; यह परिवर्तन अलंकारिक प्रभाव उत्पन्न करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘निश्चय ही उजाड़ हो जाएँगी।’ इब्रानी में बल देने के लिए एक ही धातु का निरपेक्ष धातुरूप और उससे बनी रूपांतरित क्रिया प्रयुक्त हुई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण प्रस्तुत करता है; ‘क्योंकि’ इस संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַגּוֹי וְהַמַּמְלָכָה
  choice: जाति और राज्य
  rationale: दोनों संज्ञाओं को उनके एकवचन रूप में रखा गया है, जैसा इब्रानी पाठ में है। ‘जाति’ और ‘राज्य’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक हैं।
- source_word: אֲשֶׁר לֹא יַעַבְדוּךְ
  choice: जो तेरी सेवा न करेंगे
  rationale: עבד का सामान्य अर्थ ‘सेवा करना’ है। ‘न करेंगे’ भविष्यसूचक प्रसंग के अनुकूल है और ‘इनकार करेंगे’ जैसी अतिरिक्त इच्छात्मक धारणा नहीं जोड़ता। ‘तेरी’ स्त्रीलिंग एकवचन में संबोधित सिय्योन/यरूशलेम के सीधे संबोधन को बिना व्याख्यात्मक विस्तार के रखता है।
- source_word: יֹאבֵדוּ
  choice: नष्ट हो जाएँगे
  rationale: אבד यहाँ विनाश या मिट जाने को व्यक्त करता है। यह चयन विनाश के साधन को अनावश्यक रूप से निश्चित किए बिना व्यापक अर्थ देता है।
- source_word: וְהַגּוֹיִם
  choice: और जातियाँ
  rationale: इब्रानी के बहुवचन और साधारण संयोजक को रखा गया है। हिन्दी में निश्चित उपपद न होने के कारण ‘जातियाँ’ स्वाभाविक रूप से प्रसंग में उल्लिखित राष्ट्रों को दर्शाता है; ‘वे जातियाँ’ जोड़ना इब्रानी में निहित न होने वाला संकेतवाचक भाव ला सकता था।
- source_word: חָרֹב יֶחֱרָבוּ
  choice: पूरी तरह उजाड़ हो जाएँगी
  rationale: एक ही धातु के क्रियार्थक संज्ञा-रूप और सीमित क्रिया का मेल तीव्र बल देता है। ‘पूरी तरह’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘उजाड़ हो जाएँगी’ חרב के उजड़ने या तबाह होने के भाव को रखता है।
theological_decisions:
- issue: ‘तेरी सेवा’ में स्त्रीलिंग एकवचन संबोधन का संदर्भ
  choice: सीधा संबोधन ‘तेरी’ के रूप में बनाए रखा
  alternative: ‘सिय्योन की सेवा’ अथवा ‘यरूशलेम की सेवा’ कहकर संदर्भ स्पष्ट करना
  rationale: निकटवर्ती प्रसंग सिय्योन/यरूशलेम को स्त्रीलिंग एकवचन में संबोधित करता है। अनुवाद नगर, उसके लोगों और उनके धार्मिक अर्थ के संबंध को किसी एक व्याख्या में सीमित नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। अर्धविराम दोनों न्याय-वाक्यों को स्पष्ट रूप से अलग करता है। ‘तेरी’ स्रोत के एकवचन सीधे संबोधन को बचाता है, यद्यपि आधुनिक सामान्य वार्तालाप में ‘तुम्हारी’ अधिक प्रचलित हो सकता है।
