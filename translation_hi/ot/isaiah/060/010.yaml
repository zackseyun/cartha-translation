  text: וּ/בָנ֤וּ בְנֵֽי נֵכָר֙ חֹמֹתַ֔יִ/ךְ וּ/מַלְכֵי/הֶ֖ם יְשָׁרְת֑וּ/נֶךְ כִּ֤י בְ/קִצְפִּ/י֙ הִכִּיתִ֔י/ךְ וּ/בִ/רְצוֹנִ֖/י רִֽחַמְתִּֽי/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/010.yaml
  text: The sons of foreigners will rebuild your walls[a], and their kings will minister to you; for in my wrath I struck you[d][c][b], but in my favor I have had compassion on you.
translation:
  language: hi
  text: विदेशियों के पुत्र तुम्हारी नगर-दीवारों को फिर से बनाएँगे,[a] और उनके राजा तुम्हारी सेवा करेंगे; क्योंकि अपने क्रोध में मैंने तुम्हें मारा, पर अपने अनुग्रह से मैंने तुम पर दया की है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “विदेशी के पुत्र”; यह इब्रानी अभिव्यक्ति सामान्य रूप से विदेशियों के लिए भी प्रयुक्त हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנוּ
  choice: फिर बनाएँगे
  rationale: मूल क्रिया का अर्थ ‘बनाना’ है; उजड़ी हुई नगरी की शहरपनाहों के संदर्भ में ‘फिर बनाएँगे’ पुनर्स्थापना का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְנֵי נֵכָר
  choice: परदेशी
  rationale: शाब्दिक रूप ‘परदेशी के पुत्र’ है, पर यह इब्रानी मुहावरा व्यापक रूप से परदेशियों को सूचित कर सकता है; आधुनिक हिन्दी में ‘परदेशी’ स्पष्ट और स्वाभाविक है।
- source_word: חֹמֹתַיִךְ
  choice: तुम्हारी शहरपनाहों
  rationale: बहुवचन संज्ञा और स्त्रीलिंग एकवचन संबोधन को बनाए रखते हुए नगर की रक्षात्मक दीवारों के लिए सटीक हिन्दी शब्द चुना गया है।
- source_word: וּמַלְכֵיהֶם
  choice: और उनके राजा
  rationale: मूल के संबंधसूचक बहुवचन को सीधे और स्पष्ट रूप में रखा गया है।
- source_word: יְשָׁרְתוּנֶךְ
  choice: तुम्हारी सेवा करेंगे
  rationale: पिएल रूप परिचर्या अथवा सेवकाई का भाव दे सकता है; ‘सेवा करेंगे’ आधुनिक हिन्दी में व्यापक अर्थ रखते हुए अस्पष्टता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: בְקִצְפִּי
  choice: अपने क्रोध में
  rationale: קצף का प्रबल न्यायिक भाव ‘क्रोध’ से स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त होता है।
- source_word: הִכִּיתִיךְ
  choice: मैंने तुम्हें मारा था
  rationale: נכה का मूल अर्थ ‘मारना/प्रहार करना’ है। ‘मारा था’ पिछले न्याय और वर्तमान दया के विरोध को स्पष्ट करता है, बिना ‘नष्ट किया’ जैसा अतिरिक्त अर्थ जोड़े।
- source_word: וּבִרְצוֹנִי
  choice: पर अपनी कृपा में
  rationale: רצון यहाँ अनुग्रह, प्रसन्नता अथवा सद्भाव का अर्थ देता है; ‘कृपा’ क्रोध के साथ स्वाभाविक विरोध बनाती है और केवल इच्छा का अर्थ नहीं देती।
- source_word: רִחַמְתִּיךְ
  choice: मैंने तुम पर दया की है
  rationale: רחם करुणामय दया व्यक्त करता है; यह हिन्दी वाक्यांश भावात्मक और कृपालु दोनों पहलुओं को सहज रूप से संप्रेषित करता है।
theological_decisions:
- issue: स्त्रीलिंग एकवचन संबोधन की पहचान
  choice: मुख्य पाठ में केवल ‘तुम्हारी/तुम्हें/तुम पर’ रखा गया है।
  alternative: ‘हे यरूशलेम’ या ‘हे सिय्योन’ जोड़ना।
  rationale: संदर्भ में संबोधित पात्र मानवीकृत नगर है, पर इस पद में उसका नाम नहीं आया; नाम जोड़ने से मूल से अधिक स्पष्टता आरोपित होती।
- issue: ईश्वरीय न्याय और करुणा का विरोध
  choice: ‘अपने क्रोध में मैंने तुम्हें मारा था, पर अपनी कृपा में मैंने तुम पर दया की है।’
  alternative: न्याय को हल्का करके ‘दण्ड दिया’ अथवा कृपा को केवल ‘प्रसन्नता’ कहना।
  rationale: यह रूप मूल में उपस्थित प्रहार और दया, दोनों को पूर्ण बल के साथ रखता है और उनके बीच के धर्मवैचारिक तनाव की व्याख्या करके उसे मिटाता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वाणी-संबंधी लहजा रखा गया है। ‘शहरपनाह’ सामान्य ‘दीवार’ की अपेक्षा חומה के नगर-रक्षा संबंधी अर्थ को अधिक ठीक व्यक्त करता है। संबोधन का स्त्रीलिंग हिन्दी में सर्वनामों से प्रकट नहीं होता, इसलिए संदर्भगत मानवीकरण को बिना अतिरिक्त नाम जोड़े सुरक्षित रखा गया है।
