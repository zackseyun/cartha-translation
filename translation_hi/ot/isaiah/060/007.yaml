source:
  edition: WLC
  text: כָּל צֹ֤אן קֵדָר֙ יִקָּ֣בְצוּ לָ֔/ךְ אֵילֵ֥י נְבָי֖וֹת יְשָׁרְת֑וּ/נֶךְ יַעֲל֤וּ עַל רָצוֹן֙ מִזְבְּחִ֔/י וּ/בֵ֥ית תִּפְאַרְתִּ֖/י אֲפָאֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/007.yaml
  text: All the flocks of Kedar will be gathered to you[a]; the rams of Nebaioth will minister to you. They will go up with acceptance on my altar[b], and I will beautify my glorious house.
translation:
  language: hi
  text: केदार के सारे झुंड तेरे पास इकट्ठे किए जाएँगे; नबायोत के मेढ़े तेरी सेवा करेंगे। वे मेरी वेदी पर स्वीकार्य रूप से चढ़ेंगे[a], और मैं अपने महिमामय भवन को शोभायमान करूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वे मेरी वेदी पर अनुकूल स्वीकृति के साथ चढ़ेंगे।” इब्रानी पदबंध में “ऊपर चढ़ने” और अनुकूल रूप से स्वीकार किए जाने—दोनों का भाव है।
    reason: lexical_alternative
  - marker: b
    text: “मेरे महिमामय भवन” का शाब्दिक भाव “मेरी शोभा/महिमा का भवन” है; यहाँ संकेत मन्दिर की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹאן
  choice: झुंड
  rationale: यह छोटे पालतू पशुओं, विशेषकर भेड़-बकरियों, के लिए सामूहिक संज्ञा है; ‘झुंड’ इसकी व्यापकता बनाए रखता है।
- source_word: קֵדָר
  choice: केदार
  rationale: अरबी जनसमूह अथवा क्षेत्र का व्यक्तिवाचक नाम; प्रचलित हिन्दी बाइबलीय रूप अपनाया गया है।
- source_word: יִקָּבְצוּ לָךְ
  choice: तेरे पास इकट्ठे किए जाएँगे
  rationale: निफ़अल रूप के कर्मवाच्य भाव और לָךְ के दिशात्मक अर्थ, दोनों को व्यक्त करता है।
- source_word: אֵילֵי נְבָיוֹת
  choice: नबायोत के मेढ़े
  rationale: वेदी और बलि के प्रसंग में אֵילֵי का पशुवाचक अर्थ ‘मेढ़े’ स्पष्ट है; नबायोत व्यक्तिवाचक नाम है।
- source_word: יְשָׁרְתוּנֶךְ
  choice: तेरी सेवा करेंगे
  rationale: שרת सेवा करने को दर्शाता है और कभी उपासना-संबंधी सेवा का भी बोध देता है; सहज हिन्दी में ‘सेवा करेंगे’ दोनों संभावनाओं को खुला रखता है।
- source_word: יַעֲלוּ עַל רָצוֹן
  choice: स्वीकार्य बलि के रूप में चढ़ेंगे
  rationale: ‘ऊपर जाना/चढ़ना’ और अनुकूल स्वीकृति के संयुक्त भाव को बलि-संबंधी प्रसंग में स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक संरचना पादटिप्पणी में दी गई है।
- source_word: מִזְבְּחִי
  choice: मेरी वेदी
  rationale: מזבח और प्रथम पुरुष एकवचन प्रत्यय का सीधा, मानक अनुवाद।
- source_word: בֵית תִּפְאַרְתִּי
  choice: अपने महिमामय भवन
  rationale: शाब्दिक भाव ‘मेरी शोभा/महिमा का भवन’ है; ‘महिमामय भवन’ गरिमापूर्ण और स्वाभाविक हिन्दी है तथा मन्दिर-संदर्भ को बिना अनावश्यक विस्तार के बनाए रखता है।
- source_word: אֲפָאֵר
  choice: और शोभायमान करूँगा
  rationale: पिएल रूप में क्रिया का अर्थ सजाना, सुशोभित करना या महिमा देना हो सकता है; ‘शोभायमान करूँगा’ भवन-पुनर्स्थापन की ठोस छवि और गरिमा दोनों रखता है।
theological_decisions:
- issue: द्वितीय पुरुष स्त्रीलिंग प्रत्ययों (‘तेरे/तेरी’) का संदर्भ
  choice: सीधे स्त्रीलिंग एकवचन सम्बोधन को बनाए रखा गया है, जो निकटवर्ती प्रसंग में मानवीकृत सिय्योन/यरूशलेम की ओर संकेत करता है।
  alternative: इसे व्यापक रूप से परमेश्वर की प्रजा के लिए सम्बोधन मानना।
  rationale: यशायाह 60 का तात्कालिक प्रसंग सिय्योन/यरूशलेम को स्त्री के रूप में सम्बोधित करता है; अनुवाद ‘तेरे/तेरी’ रखकर आगे की धर्मवैज्ञानिक पहचान तय नहीं करता।
- issue: पशुओं और वेदी पर चढ़ने का बलि-संबंधी अर्थ
  choice: स्वीकार्य बलि के रूप में वेदी पर चढ़ाए जाने की छवि स्पष्ट रखी गई है।
  alternative: इसे केवल भेंट, कर अथवा सामान्य सेवा की छवि मानना।
  rationale: झुंड, मेढ़े, वेदी और अनुकूल स्वीकृति का मेल बलिदान का प्रबल संकेत देता है, फिर भी अनुवाद इससे आगे कोई अनुष्ठानिक या सम्प्रदायगत निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय शैली रखी गई है। सिय्योन के स्त्रीलिंग एकवचन सम्बोधन के कारण ‘तेरे/तेरी’ प्रयुक्त है। ‘भवन’ मन्दिर-संदर्भ को सम्मानपूर्ण ढंग से व्यक्त करता है, जबकि पादटिप्पणियाँ इब्रानी की शाब्दिक संरचना और अर्थ-व्याप्ति सुरक्षित रखती हैं।
