id: ISA.60.5
reference: Isaiah 60:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אָ֤ז תִּרְאִי֙ וְ/נָהַ֔רְתְּ וּ/פָחַ֥ד וְ/רָחַ֖ב לְבָבֵ֑/ךְ כִּֽי יֵהָפֵ֤ךְ עָלַ֨יִ/ךְ֙ הֲמ֣וֹן יָ֔ם חֵ֥יל גּוֹיִ֖ם יָבֹ֥אוּ לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/005.yaml
  text: Then you will see and be radiant[a], and your heart will tremble and swell, because the abundance of the sea will be turned to you[b]; the wealth of the nations will come to you.
translation:
  language: hi
  text: तब तू देखेगी और दमक उठेगी[a]; तेरा हृदय थरथराएगा और उमंग से भर उठेगा, क्योंकि समुद्र की प्रचुरता तेरी ओर मोड़ दी जाएगी[b]; राष्ट्रों की धन-संपत्ति तेरे पास आएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उज्ज्वल हो उठेगी।” इब्रानी क्रिया देखी हुई बात के प्रत्युत्तर में चमकने या उजला होने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “समुद्र की धन-संपत्ति तेरी ओर मोड़ दी जाएगी।” यह पद विशेष रूप से समुद्री मार्ग से सिय्योन लाई जाने वाली संपदा का उल्लेख कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּרְאִי
  choice: तू देखेगी
  rationale: यह ראה का काल रूप, स्त्रीलिंग एकवचन संबोधन में, सिय्योन/यरूशलेम से सीधे भविष्यसूचक कथन करता है।
- source_word: וְנָהַרְתְּ
  choice: और दमक उठेगी
  rationale: संदर्भ में क्रिया का भाव देखी हुई बहाली के प्रत्युत्तर में चमकने या उज्ज्वल होने का है; ‘दमक उठेगी’ इसे स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: וּפָחַד
  choice: थरथराएगा
  rationale: कर्ता अगला पद ‘तेरा हृदय’ है। ‘थरथराएगा’ केवल नकारात्मक भय निश्चित किए बिना गहरे विस्मय की शारीरिक-भावनात्मक प्रतिक्रिया बनाए रखता है।
- source_word: וְרָחַב לְבָבֵךְ
  choice: तेरा हृदय ... उमंग से भर उठेगा
  rationale: शाब्दिक चित्र हृदय के चौड़ा होने का है। हिन्दी में ‘उमंग से भर उठेगा’ हर्ष और विस्मय से हृदय के फैलने का भाव स्वाभाविक रूप से व्यक्त करता है, यद्यपि रूपक कुछ स्पष्ट किया गया है।
- source_word: יֵהָפֵךְ עָלַיִךְ
  choice: तेरी ओर मोड़ दी जाएगी
  rationale: निफ़अल रूप का निष्क्रिय भाव और सिय्योन की ओर दिशा/हस्तांतरण दोनों सुरक्षित रहते हैं।
- source_word: הֲמוֹן יָם
  choice: समुद्र की प्रचुरता
  rationale: הֲמוֹן में बहुतायत, जनसमूह या हलचल का विस्तार है। समानांतर पद धन का संकेत देता है, पर ‘प्रचुरता’ मूल की व्यापकता बनाए रखता है।
- source_word: חֵיל גּוֹיִם
  choice: राष्ट्रों की धन-संपत्ति
  rationale: חֵיל का अर्थ सामर्थ्य, सेना या संपत्ति हो सकता है; इस प्रसंग में सिय्योन की ओर आने वाली वस्तुओं और समुद्री प्रचुरता के समानांतर ‘धन-संपत्ति’ सर्वाधिक उपयुक्त है।
- source_word: יָבֹאוּ לָךְ
  choice: तेरे पास आएगी
  rationale: सरल गति और प्राप्तकर्ता का भाव सीधे और स्वाभाविक हिन्दी में व्यक्त होता है; संयुक्त कर्ता ‘धन-संपत्ति’ के अनुसार एकवचन क्रिया रखी गई है।
theological_decisions:
- issue: सिय्योन की भावनात्मक प्रतिक्रिया
  choice: हर्ष, विस्मय और कंपन की मिली-जुली प्रतिक्रिया
  alternative: केवल भय अथवा केवल आनंद
  rationale: देखने, दमकने, हृदय के थरथराने और भर उठने का क्रम बहाली के सामने अभिभूत आनंद और विस्मय दोनों दर्शाता है; अनुवाद इस तनाव को किसी एक भाव में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली। स्त्रीलिंग एकवचन ‘तू/तेरी’ से सिय्योन अथवा यरूशलेम का प्रत्यक्ष संबोधन सुरक्षित रखा गया है। ‘दमक उठेगी’ काव्यात्मक है, पर सामान्य पाठक के लिए स्पष्ट है; अर्धविराम दोनों समानांतर परिणाम-वाक्यों को जोड़ता है।
