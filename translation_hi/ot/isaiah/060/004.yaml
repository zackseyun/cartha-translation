base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/004.yaml
  text: Lift up your eyes all around and see[a]; all of them gather together; they come to you. Your sons will come from far away[b], and your daughters will be carried on the hip.
translation:
  language: hi
  text: चारों ओर अपनी आँखें उठाकर देख; वे सब इकट्ठे होते हैं, वे तेरे पास आते हैं। तेरे बेटे दूर से आएँगे, और तेरी बेटियाँ कमर पर उठाकर लाई जाएँगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “पार्श्व पर”; आशय संभवतः कमर या कूल्हे पर संभालकर ले जाने का है। क्रिया में पालन-पोषण या सहारा दिए जाने की अर्थ-छाया भी हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאִי סָבִיב עֵינַיִךְ וּרְאִי
  choice: चारों ओर अपनी आँखें उठाकर देख
  rationale: स्त्रीलिंग एकवचन आज्ञाएँ मानवीकृत सिय्योन को संबोधित हैं। हिंदी में यह क्रम स्वाभाविक है और चारों दिशाओं में देखने का भाव रखता है।
- source_word: כֻּלָּם נִקְבְּצוּ בָאוּ לָךְ
  choice: वे सब इकट्ठे होते हैं, वे तेरे पास आते हैं
  rationale: पूर्ण क्रियाओं को भविष्यसूचक दृश्य की जीवंत वर्तमानता के रूप में रखा गया है; לָךְ दिशा और संबोधन दोनों स्पष्ट करता है।
- source_word: בָּנַיִךְ מֵרָחוֹק יָבֹאוּ
  choice: तेरे बेटे दूर से आएँगे
  rationale: ‘बेटे’ को ‘बच्चे’ बनाकर लिंग-विशिष्ट समानांतरता नहीं मिटाई गई; अपूर्ण क्रिया का भाव यहाँ स्वाभाविक रूप से भविष्यकालीन है।
- source_word: וּבְנֹתַיִךְ עַל צַד תֵּאָמַנָה
  choice: और तेरी बेटियाँ गोद में उठाकर लाई जाएँगी
  rationale: תֵאָמַנָה का पुअल रूप पालन-पोषण अथवा सहारा देकर ले जाने का भाव रख सकता है। עַל צַד के साथ तत्काल चित्र छोटी बच्चियों को देह के पार्श्व/कमर पर संभालकर लाने का है; हिंदी ‘गोद में उठाकर’ इस दृश्य को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: पुनर्स्थापना का लिंग-विशिष्ट चित्र
  choice: ‘बेटे’ और ‘बेटियाँ’ दोनों को स्पष्ट रखा गया
  alternative: ‘बच्चे’
  rationale: इब्रानी समानांतर पंक्तियाँ सिय्योन की संपूर्ण संतान की वापसी को पुत्र-पुत्रियों की जोड़ी से चित्रित करती हैं; इसे तटस्थ करना मूल की विशिष्टता घटाता।
- issue: भविष्यसूचक क्रियाओं का काल-पक्ष
  choice: पहली पूर्ण क्रियाएँ जीवंत वर्तमान में और बाद की अपूर्ण क्रियाएँ भविष्य में
  alternative: सभी क्रियाएँ भविष्यकाल में अथवा सभी भूत/पूर्ण काल में
  rationale: यह आरंभिक दृश्य की भविष्यसूचक प्रत्यक्षता और दूसरी पंक्ति की आगे की प्रतिज्ञा के बीच मूल भाषा के तनाव को बनाए रखता है।
- issue: תֵּאָמַנָה में देखभाल और वहन का भाव
  choice: गोद में उठाकर लाई जाएँगी
  alternative: पाला-पोसा जाएगा; सहारा देकर लाया जाएगा; कमर पर उठाकर लाई जाएँगी
  rationale: संदर्भ में दूर से लौटते पुत्रों के समानांतर बेटियों के लाए जाने का दृश्य प्रमुख है, पर क्रिया में देखभाल का संभावित भाव पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। मानवीकृत सिय्योन के लिए निकट, एकवचन ‘तू/तेरे’ संबोधन रखा गया है। ‘गोद में’ स्वाभाविक हिंदी है, जबकि अधिक शाब्दिक पार्श्व/कमर का चित्र पादटिप्पणी में दिया गया है।
