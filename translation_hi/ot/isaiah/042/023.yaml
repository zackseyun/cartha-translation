  yaml_path: translation/ot/isaiah/042/023.yaml
  text: Who among you will listen to this[a], will pay attention and hear hereafter?
translation:
  language: hi
  text: तुम में से कौन इस पर कान देगा, ध्यान देगा और आने वाले समय के लिए सुनेगा?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भविष्य के लिए,” “इसके बाद,” अथवा “बाद में।” इब्रानी में शाब्दिक रूप से “पीछे/बाद के लिए” है, जो मुहावरे के रूप में बाद में आने वाले समय की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי בָכֶם
  choice: तुममें से कौन
  rationale: प्रश्नवाचक सर्वनाम और בָכֶם के सामूहिक संबोधन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יַאֲזִין
  choice: कान लगाएगा
  rationale: हिफ़िल रूप का अर्थ ध्यान से सुनना है; यह पदबंध श्रवण के साथ सचेत ग्रहणशीलता भी बनाए रखता है।
- source_word: זֹאת
  choice: इस बात पर
  rationale: एकवचन संकेतवाचक शब्द वर्तमान संदेश या चेतावनी की ओर संकेत करता है; हिन्दी में ‘इस बात’ स्पष्ट और स्वाभाविक है।
- source_word: יַקְשִׁב
  choice: ध्यान देगा
  rationale: קשב की ध्यानपूर्वक सुनने की छाया को पहले क्रियापद से अलग रखते हुए व्यक्त करता है।
- source_word: וְיִשְׁמַע
  choice: और ... सुनेगा
  rationale: שמע यहाँ सुनने के अर्थ में है; ‘आज्ञा मानेगा’ कहना प्रसंग में संभव निहितार्थ को अनावश्यक रूप से निश्चित कर देता।
- source_word: לְאָחוֹר
  choice: आगे के लिए
  rationale: शाब्दिक रूप से ‘पीछे/बाद के लिए’ वाला यह मुहावरा बाद के समय की ओर संकेत करता है; ‘आगे के लिए’ हिन्दी में कालगत भाव को सहज रूप से देता है।
theological_decisions:
- issue: שמע में सुनने और आज्ञापालन का संबंध
  choice: सुनेगा
  alternative: मानेगा
  rationale: निकटवर्ती श्रवण-संबंधी क्रियाओं के कारण प्रत्यक्ष अर्थ ‘सुनना’ रखा गया है, जबकि आज्ञापालन का संभावित निहितार्थ पाठक के लिए खुला रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानार्थी श्रवण-क्रियाओं के बीच भेद बनाए रखने के लिए ‘कान लगाएगा,’ ‘ध्यान देगा’ और ‘सुनेगा’ का क्रम रखा गया है।
