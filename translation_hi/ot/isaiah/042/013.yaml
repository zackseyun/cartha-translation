  text: יְהוָה֙ כַּ/גִּבּ֣וֹר יֵצֵ֔א כְּ/אִ֥ישׁ מִלְחָמ֖וֹת יָעִ֣יר קִנְאָ֑ה יָרִ֨יעַ֙ אַף יַצְרִ֔יחַ עַל אֹיְבָ֖י/ו יִתְגַּבָּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/013.yaml
  text: Yahweh goes out like a mighty warrior[a]; like a man of war he stirs up zeal. He shouts, yes, he raises a battle cry[c][b]; over his enemies he shows himself mighty.
translation:
  language: hi
  text: याहवेह पराक्रमी योद्धा के समान निकलता है; युद्धवीर के समान वह जोश जगाता है[a]। वह ललकारता है, हाँ, ऊँची युद्ध-पुकार लगाता है; अपने शत्रुओं पर वह अपना पराक्रम दिखाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह ईर्ष्या जगाता है।” इब्रानी शब्द क़िनआह का अर्थ ‘जोश’ या ‘ईर्ष्या’ दोनों हो सकता है, विशेषकर वाचा के प्रसंगों में।
    reason: lexical_alternative
  - marker: b
    text: या, “वह अपने शत्रुओं पर प्रबल होता है।” अंतिम क्रिया अपना बल दिखाने और विजय पाने—दोनों का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवेह
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: כַּגִּבּוֹר
  choice: पराक्रमी योद्धा के समान
  rationale: गिब्बोर की शक्ति और सैनिक संदर्भ, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יֵצֵא
  choice: निकलता है
  rationale: मूल क्रिया के सामान्य अर्थ को रखता है और ‘कूच करता है’ जैसी अतिरिक्त सैनिक विशिष्टता नहीं जोड़ता।
- source_word: כְּאִישׁ מִלְחָמוֹת
  choice: युद्धवीर के समान
  rationale: शाब्दिक ‘युद्धों के पुरुष’ हिन्दी में अस्वाभाविक है; ‘युद्धवीर’ युद्ध में अनुभवी पुरुष की छवि और काव्यात्मक समानांतरता को संक्षेप में रखता है।
- source_word: יָעִיר קִנְאָה
  choice: वह अपना जोश जगाता है
  rationale: קִנְאָה यहाँ प्रबल सक्रिय उत्साह अथवा ईर्ष्या दोनों का भाव दे सकता है; मुख्य पाठ में प्रसंगानुकूल ‘जोश’ रखा और विकल्प पादटिप्पणी में दिया है।
- source_word: יָרִיעַ
  choice: वह ललकारता है
  rationale: सैनिक प्रसंग में ऊँची पुकार का स्वाभाविक हिन्दी रूप है और अगली अधिक तीव्र पुकार के लिए क्रम बनाए रखता है।
- source_word: אַף יַצְרִיחַ
  choice: हाँ, ऊँची युद्ध-पुकार लगाता है
  rationale: אַף की तीव्रता को ‘हाँ’ और יַצְרִיחַ की प्रबल युद्ध-संबंधी पुकार को स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: עַל אֹיְבָיו יִתְגַּבָּר
  choice: अपने शत्रुओं पर वह अपना पराक्रम दिखाता है
  rationale: יִתְגַּבָּר के आत्मवाचक बल को रखता है और आरंभ के पराक्रमी शब्द से ध्वन्यात्मक-सार्थक संबंध बनाता है।
theological_decisions:
- issue: याहवेह की योद्धा-संबंधी छवि
  choice: युद्ध, ललकार और शत्रुओं पर पराक्रम की भाषा को स्पष्ट रूप से बनाए रखा गया
  alternative: इसे केवल सामान्य सामर्थ्य या विजय की भाषा में नरम करना
  rationale: इब्रानी पाठ स्वयं याहवेह को योद्धा के रूप में चित्रित करता है; इस तनावपूर्ण छवि को कम करना पाठ के आशय को बदल देता।
- issue: קִנְאָה का अर्थ
  choice: मुख्य पाठ में ‘जोश’
  alternative: ‘ईर्ष्या’ अथवा ‘जलन’
  rationale: इस युद्ध-संदर्भ में तीव्र दैवी उत्साह अधिक सहज है, पर वाचा-संबंधी ईर्ष्या भी वास्तविक शाब्दिक संभावना है और पादटिप्पणी में सुरक्षित है।
- issue: אִישׁ מִלְחָמוֹת की पुरुषवाची अभिव्यक्ति
  choice: ‘युद्धवीर’
  alternative: ‘युद्धों के पुरुष के समान’
  rationale: मूल की पुरुष योद्धा-छवि को बनाए रखते हुए अस्वाभाविक शाब्दिक हिन्दी से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमामय किंतु सामान्य पाठक के लिए सहज रखी गई है। मार्शल काव्य की तीव्रता बनाए रखने के लिए ‘पराक्रमी योद्धा’, ‘ललकारता’ और ‘युद्ध-पुकार’ चुने गए हैं।
