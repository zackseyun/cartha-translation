    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂימוּ
  choice: महिमा दें
  rationale: שׂים का मूल अर्थ ‘रखना/स्थापित करना’ है, पर כָּבוֹד और לַיהוָה के साथ यह मुहावरे के रूप में ‘महिमा देना/ठहराना’ व्यक्त करता है। ‘महिमा दें’ हिन्दी में स्वाभाविक है और आज्ञार्थक-प्रेरणार्थक भाव बनाए रखता है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: ל संबंध अथवा अप्रत्यक्ष कर्म को चिह्नित करता है; यְהוָה परमेश्वर का विशिष्ट नाम है, जिसे यहाँ ‘याहवे’ लिप्यंतरित किया गया है।
- source_word: כָּבוֹד
  choice: महिमा
  rationale: כָּבוֹד का अर्थ ‘महिमा’ या ‘सम्मान’ हो सकता है। आराधना और समानांतर ‘स्तुति’ के प्रसंग में ‘महिमा’ सबसे उपयुक्त है।
- source_word: וּתְהִלָּתוֹ
  choice: और उसकी स्तुति
  rationale: תְּהִלָּה का सामान्य अर्थ ‘स्तुति’ है और 3 पुं. एक. प्रत्यय ‘उसकी’ को व्यक्त करता है; यह כָּבוֹד के साथ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: בָּאִיִּים
  choice: द्वीपों में
  rationale: אִיִּים का शाब्दिक अर्थ ‘द्वीपों’ है; यशायाह में यह दूर के समुद्री या तटीय प्रदेशों के लिए भी प्रयुक्त हो सकता है। मुख्य पाठ शाब्दिक चित्र रखता है और व्यापक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: יַגִּידוּ
  choice: बखान करें
  rationale: נגד के हिफ़ील रूप का अर्थ ‘घोषित करना, बताना, प्रकट करना’ है। ‘बखान करें’ स्तुति को सार्वजनिक रूप से सुनाने का भाव देता है और हिन्दी के गरिमापूर्ण काव्यात्मक रजिस्टर में स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला विशिष्ट ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि में बदलने के बजाय नाम के रूप में बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बखान करें’ काव्यात्मक तथा सार्वजनिक घोषणा का भाव देता है; वाक्य की दोनों समानांतर आज्ञार्थक धाराएँ सुरक्षित हैं।
