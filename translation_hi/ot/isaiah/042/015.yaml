base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/015.yaml
  text: I will lay waste mountains and hills[a], and I will dry up all their vegetation; I will turn rivers into islands, and I will dry up pools.
translation:
  language: hi
  text: मैं पहाड़ों और पहाड़ियों को उजाड़ दूँगा, और उनकी सारी वनस्पति सुखा दूँगा; मैं नदियों को द्वीपों[a] में बदल दूँगा, और जलाशयों को सुखा दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समुद्रतटीय भूभागों”; इब्रानी शब्द का अर्थ द्वीप या समुद्रतटीय प्रदेश हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרִיב
  choice: उजाड़ दूँगा
  rationale: हिफ़ील रूप किसी स्थान को उजाड़ या निर्जन कर देने का भाव व्यक्त करता है। यह चयन विनाश के न्याय-संबंधी स्वर को बनाए रखता है, पर पूर्णतः मिटा देने का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: הָרִים וּגְבָעוֹת
  choice: पहाड़ों और पहाड़ियों
  rationale: दोनों भू-आकृतियों के सामान्य और स्वाभाविक हिन्दी अर्थ; यहाँ उपासना-स्थलों का कोई संकेत नहीं है।
- source_word: וְכָל עֶשְׂבָּם
  choice: और उनकी सारी वनस्पति
  rationale: עֵשֶׂב घास, पौधों या व्यापक रूप से वनस्पति को दर्शा सकता है। संबंधसूचक प्रत्यय पहाड़ों और पहाड़ियों, दोनों की वनस्पति की ओर संकेत करता है।
- source_word: אוֹבִישׁ
  choice: सुखा दूँगा
  rationale: यבש का हिफ़ील रूप ‘सूखा कर देना’ है। वनस्पति और जलाशयों, दोनों के लिए यही अभिव्यक्ति रखकर मूल की पुनरावृत्ति सुरक्षित की गई है।
- source_word: וְשַׂמְתִּי
  choice: में बदल दूँगा
  rationale: שׂים का मूल अर्थ रखना या बनाना है; कर्म और परिणामी अवस्था वाली इस रचना में ‘में बदल दूँगा’ स्वाभाविक हिन्दी में परिवर्तन का भाव स्पष्ट करता है।
- source_word: נְהָרוֹת
  choice: नदियों
  rationale: נהרות का सामान्य अर्थ ‘नदियाँ’ है; संदर्भ इसे ‘धाराओं’ तक सीमित करने की माँग नहीं करता।
- source_word: לָאִיִּים
  choice: द्वीपों में
  rationale: אִיִּים सामान्यतः द्वीपों या समुद्रतटीय भूभागों को दर्शाता है। सीधे शाब्दिक अर्थ को मुख्य पाठ में रखा गया है और दूसरा संभव अर्थ पादटिप्पणी में दिया गया है।
- source_word: וַאֲגַמִּים
  choice: और जलाशयों को
  rationale: אֲגַמִּים तालाबों, जलकुंडों या दलदली जलक्षेत्रों को दर्शा सकता है। ‘जलाशय’ सामान्य आधुनिक हिन्दी में पर्याप्त व्यापक और संदर्भानुकूल है।
theological_decisions:
- issue: सृष्टि पर परमेश्वर के न्याय की छवि
  choice: भूभाग और जल को उजाड़ने-सुखाने की ठोस घोषणा के रूप में अनुवाद
  alternative: इसे केवल बाधाएँ हटाने का रूपक मानकर अनुवाद करना
  rationale: इब्रानी पाठ ठोस प्राकृतिक दृश्यों का प्रयोग करता है। व्यापक प्रसंग में इनके रूपकात्मक निहितार्थ हो सकते हैं, पर अनुवाद यह तय नहीं करता कि भाषा केवल रूपक है; वह इसके प्रत्यक्ष और प्रबल चित्रण को बनाए रखता है।
- issue: प्रथम पुरुष की चार क्रियाओं का बल
  choice: हर क्रिया में ‘दूँगा’ रखकर कर्ता की संकल्पपूर्ण कार्रवाई को बनाए रखना
  alternative: दूसरी और चौथी क्रिया में सहायक क्रिया हटाकर वाक्य को अधिक संक्षिप्त बनाना
  rationale: मूल में चारों क्रियाएँ प्रथम पुरुष एकवचन में हैं। हिन्दी में प्रत्येक खंड में पूर्ण क्रियारूप रखने से वक्ता की लगातार और संप्रभु कार्रवाई का आलंकारिक बल सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, स्पष्ट और सार्वजनिक पाठ के योग्य स्तर रखा गया है। ‘उजाड़ दूँगा’ और ‘सुखा दूँगा’ सहज होते हुए भी भविष्यवाणी के न्यायपूर्ण स्वर को बनाए रखते हैं। पादटिप्पणी-चिह्न उसी शब्द ‘द्वीपों’ के बाद रखा गया है जिससे वह संबंधित है।
