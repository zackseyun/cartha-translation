  text: הֵ֤ן עַבְדִּ/י֙ אֶתְמָךְ בּ֔/וֹ בְּחִירִ֖/י רָצְתָ֣ה נַפְשִׁ֑/י נָתַ֤תִּי רוּחִ/י֙ עָלָ֔י/ו מִשְׁפָּ֖ט לַ/גּוֹיִ֥ם יוֹצִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/001.yaml
  text: Behold my servant[a], whom I uphold, my chosen one, in whom my soul delights. I have put my Spirit upon him[c][b]; he will bring forth justice to the nations.
translation:
  language: hi
  text: देखो, मेरा सेवक, जिसे मैं सँभाले रखता हूँ; मेरा चुना हुआ, जिससे मेरा मन प्रसन्न है[a]। मैंने अपनी आत्मा उस पर रखी है[c]; वह राष्ट्रों के लिए न्याय[b] प्रकट करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिससे मैं प्रसन्न हूँ।”
    reason: lexical_alternative
  - marker: b
    text: “न्याय” का अनुवाद “न्यायिक निर्णय” या “न्यायपूर्ण व्यवस्था” भी किया जा सकता है; इब्रानी מִשְׁפָּט (मिश्पाट) इन अर्थों को व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: नए नियम में यह पद यीशु मसीह पर लागू किया गया है (देखें मत्ती 12:18)।
    reason: cross_reference
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह अव्यय श्रोता का ध्यान सेवक की ओर खींचता है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए भविष्यवाणी की गंभीरता बनाए रखता है।
- source_word: עַבְדִּי
  choice: मेरा सेवक
  rationale: यह पद भूमिका और संबंध को दर्शाता है; यहाँ ‘दास’ अनावश्यक रूप से बंधुआ स्थिति पर जोर दे सकता है।
- source_word: אֶתְמָךְ בּוֹ
  choice: जिसे मैं सँभाले रखता हूँ
  rationale: תמך ב का अर्थ सहारा देना, थामे रहना या बनाए रखना है। यह वाक्यांश परमेश्वर के निरंतर समर्थन का भाव व्यक्त करता है।
- source_word: בְּחִירִי
  choice: मेरा चुना हुआ
  rationale: यह विशेष रूप से चुने गए व्यक्ति का द्योतक है और हिन्दी में व्यक्तिगत संज्ञात्मक बल को बनाए रखता है।
- source_word: רָצְתָה נַפְשִׁי
  choice: जिससे मेरा मन प्रसन्न है
  rationale: शाब्दिक ‘मेरा प्राण प्रसन्न है’ आधुनिक हिन्दी में अस्वाभाविक लगता है; ‘मेरा मन’ मूल की आंतरिक और गहरी प्रसन्नता को सहज रूप से व्यक्त करता है।
- source_word: נָתַתִּי רוּחִי עָלָיו
  choice: मैंने अपना आत्मा उस पर रखा है
  rationale: ‘रखा है’ נתן ... על की ठोस छवि बनाए रखता है, और ‘अपना आत्मा’ वक्ता परमेश्वर की सामर्थ्यदायक आत्मा को दर्शाता है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: यहाँ शब्द केवल न्यायालयीन निर्णय नहीं, बल्कि न्यायपूर्ण व्यवस्था और न्याय की सार्वजनिक स्थापना का व्यापक भाव रखता है।
- source_word: לַגּוֹיִם
  choice: राष्ट्रों के लिए
  rationale: गैर-इस्राएली लोगों सहित व्यापक राष्ट्रों को लाभार्थी या लक्ष्य के रूप में व्यक्त करता है, बिना अर्थ को केवल बाद के धार्मिक अर्थ वाले ‘अन्यजातियों’ तक सीमित किए।
- source_word: יוֹצִיא
  choice: प्रकट करेगा
  rationale: हिफ़ील रूप का मूल भाव किसी बात को बाहर लाना है; न्याय के साथ ‘प्रकट करेगा’ हिन्दी में स्वाभाविक रूप से उसके सार्वजनिक रूप से सामने लाए जाने को बताता है।
theological_decisions:
- issue: सेवक की पहचान और भूमिका
  choice: मुख्य पाठ में केवल ‘मेरा सेवक’ रखा गया है।
  alternative: इसे सीधे इस्राएल, किसी भविष्यद्वक्ता या मसीह यीशु के रूप में पहचानना।
  rationale: इस पद का इब्रानी पाठ सेवक की पहचान स्पष्ट नहीं करता। इसलिए अनुवाद उसकी वास्तविक अस्पष्टता बनाए रखता है, जबकि नए नियम में इसके मसीही अनुप्रयोग को पादटिप्पणी में बताया गया है।
- issue: רוּחִי का आशय
  choice: ‘अपना आत्मा’
  alternative: ‘अपनी साँस’ या केवल मानवीय ‘आत्मिक वृत्ति’
  rationale: वक्ता परमेश्वर है और वह सेवक पर अपनी सामर्थ्यदायक आत्मा रखता है; इसलिए ‘आत्मा’ संदर्भ के धार्मिक भार को बिना अतिरिक्त व्याख्या जोड़े सुरक्षित रखता है।
- issue: מִשְׁפָּט का अर्थ-क्षेत्र
  choice: ‘न्याय’
  alternative: ‘निर्णय’ या ‘न्यायपूर्ण व्यवस्था’
  rationale: ‘न्याय’ न्यायिक निर्णय और स्थापित न्यायपूर्ण व्यवस्था—दोनों संभावनाओं के लिए पर्याप्त व्यापक है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘देखो’ भविष्यवाणी की ध्यानाकर्षक शैली बनाए रखता है; ‘सँभाले रखता हूँ’ निरंतर दिव्य सहारे को स्वाभाविक हिन्दी में व्यक्त करता है। सेवक की पहचान मुख्य पाठ में व्याख्यात्मक रूप से निश्चित नहीं की गई है।
