base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/021.yaml
  text: Yahweh was pleased[a], for the sake of his righteousness[c][b], to make the law great and glorious.
translation:
  language: hi
  text: याहवे अपनी धार्मिकता[a] के निमित्त व्यवस्था[b] को महान और महिमामय करने से प्रसन्न था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने न्याय के निमित्त।”
    reason: alternative_reading
  - marker: b
    text: 'हिब्रू: तोराह; इसका अर्थ “शिक्षा” या “उपदेश” भी हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: חָפֵץ
  choice: चाहता था
  rationale: यह क्रिया प्रसन्नता, इच्छा या संकल्प व्यक्त कर सकती है। प्रसंग में ‘चाहता था’ आधुनिक हिन्दी में स्वाभाविक रूप से उसकी अनुकूल इच्छा को व्यक्त करता है।
- source_word: לְמַעַן
  choice: के कारण
  rationale: यहाँ पदबंध याहवे की धार्मिकता को उसके कार्य के आधार अथवा प्रेरक कारण के रूप में प्रस्तुत करता है; हिन्दी में ‘के कारण’ इसे सहजता से व्यक्त करता है।
- source_word: צִדְקוֹ
  choice: अपनी धार्मिकता
  rationale: प्रत्यावर्ती ‘अपनी’ का संबंध याहवे से स्पष्ट है। ‘धार्मिकता’ मूल शब्द के व्यापक नैतिक और वाचागत अर्थ को बनाए रखती है; ‘न्याय’ संभावित विकल्प है।
- source_word: יַגְדִּיל
  choice: महान करना
  rationale: हिफ़ील रूप का कारणवाचक अर्थ ‘महान बनाना/करना’ है; ‘महान करना’ संक्षिप्त और गरिमापूर्ण है।
- source_word: תּוֹרָה
  choice: व्यवस्था
  rationale: ‘व्यवस्था’ तोराह के विधिक और वाचागत भार को बनाए रखती है, जबकि ‘शिक्षा’ और ‘उपदेश’ इसके व्यापक संभावित अर्थ हैं।
- source_word: וְיַאְדִּיר
  choice: और महिमामय करना
  rationale: दूसरे कारणवाचक क्रिया-रूप को स्पष्ट रूप से व्यक्त किया गया है; इससे मूल की समानांतर संरचना भी बनी रहती है।
theological_decisions:
- issue: צִדְקוֹ का अर्थ और याहवे के कार्य से उसका संबंध
  choice: अपनी धार्मिकता के कारण
  alternative: अपने न्याय के कारण
  rationale: ‘धार्मिकता’ शब्द नैतिक, वाचागत और न्यायिक अर्थ-क्षेत्र को अनावश्यक रूप से संकुचित नहीं करता। ‘न्याय’ वास्तविक वैकल्पिक अर्थ है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: תּוֹרָה का अर्थ
  choice: व्यवस्था
  alternative: शिक्षा या उपदेश
  rationale: इस प्रसंग में वाचागत-विधिक अर्थ प्रमुख हो सकता है, किंतु हिब्रू शब्द केवल विधि तक सीमित नहीं है; इस व्यापकता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। मूल की दोनों कारणवाचक क्रियाओं को स्पष्ट रखा गया है। पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद रखने के बजाय वाक्य के अंत में दिए गए हैं, और दोनों मुख्य पाठ में उपस्थित हैं।
