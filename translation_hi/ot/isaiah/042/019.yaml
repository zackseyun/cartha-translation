source:
  edition: WLC
  text: מִ֤י עִוֵּר֙ כִּ֣י אִם עַבְדִּ֔/י וְ/חֵרֵ֖שׁ כְּ/מַלְאָכִ֣/י אֶשְׁלָ֑ח מִ֤י עִוֵּר֙ כִּ/מְשֻׁלָּ֔ם וְ/עִוֵּ֖ר כְּ/עֶ֥בֶד יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/019.yaml
  text: Who is blind but my servant[a], and deaf like my messenger whom I send? Who is blind like the one who is at peace, and blind like the servant of Yahweh?
translation:
  language: hi
  text: मेरे सेवक के सिवा कौन अंधा है, और मेरे उस दूत के समान कौन बहरा है, जिसे मैं भेजता हूँ? जो कुशल-मंगल में है, उसके समान कौन अंधा है,[a] और यहोवा के सेवक के समान कौन अंधा है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो सिद्ध/निर्दोष है” अथवा “जो पूर्ण/संपूर्ण है।” इब्रानी מְשֻׁלָּם का अर्थ कठिन है; इसमें पूर्णता, संपूर्णता या कुशल-मंगल में होने का भाव हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: עִוֵּר
  choice: अंधा
  rationale: मानक अर्थ रखा गया है और पद में इसकी पुनरावृत्ति अलंकारिक बल बनाए रखने के लिए समान रूप से अनूदित की गई है।
- source_word: חֵרֵשׁ
  choice: बहरा
  rationale: ‘अंधा’ के समानांतर सीधा और स्वाभाविक हिन्दी शब्द।
- source_word: עַבְדִּי
  choice: मेरे सेवक
  rationale: यशायाह में सेवक-संबंधी भाषा के अनुरूप; यहाँ ‘दास’ की अपेक्षा ‘सेवक’ अधिक स्वाभाविक है।
- source_word: מַלְאָכִי אֶשְׁלָח
  choice: मेरे भेजे हुए दूत
  rationale: מַלְאָךְ का अर्थ यहाँ समानांतर ‘सेवक’ और भेजे जाने के विचार के कारण स्वर्गदूत नहीं, नियुक्त संदेशवाहक है। हिन्दी में यह पदबंध स्रोत के आशय को सहजता से व्यक्त करता है।
- source_word: כִּי אִם
  choice: को छोड़ कौन
  rationale: अलंकारिक प्रश्न में अपवाद अथवा विशिष्टता का भाव स्पष्ट करता है।
- source_word: מְשֻׁלָּם
  choice: जो कुशल-मंगल में है
  rationale: यह कठिन शब्द שלם के पूर्णता, सलामती और शांति-संबंधी अर्थक्षेत्र को दर्शाता है, बिना ‘मेरे साथ’ जैसे स्रोत में अनुपस्थित संबंध को जोड़ने के। वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: עֶבֶד יְהוָה
  choice: यहोवा के सेवक
  rationale: समास का सीधा अनुवाद; सेवक-विषयक शब्दावली में संगति रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को नाम के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ‘मेरे सेवक / मेरे दूत’ की पहचान
  choice: अनुवाद में पहचान को केवल पद के अपने शब्दों तक सीमित रखा गया है।
  alternative: इसे सामूहिक इस्राएल, नबी या आदर्श सेवक के रूप में स्पष्ट करना।
  rationale: पद स्वयं इससे अधिक संकीर्ण पहचान निश्चित नहीं करता; इसलिए भविष्यद्वाणी की वैचारिक और धर्मवैज्ञानिक खिंचाव को खुला रखा गया है।
- issue: מְשֻׁלָּם का अर्थ
  choice: जो कुशल-मंगल में है
  alternative: जो सिद्ध/निर्दोष है; जो पूर्ण है; जिसे प्रतिफल मिल चुका है
  rationale: शब्द दुर्लभ और विवादित है। मुख्य पाठ में שלם के सलामती/संपूर्णता-वाले अर्थक्षेत्र को स्वाभाविक हिन्दी में रखा गया है और अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रूप। दो अलंकारिक प्रश्न और ‘अंधा’ की पुनरावृत्ति सुरक्षित रखी गई है।
