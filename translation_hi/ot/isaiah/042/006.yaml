id: ISA.42.6
reference: Isaiah 42:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲנִ֧י יְהוָ֛ה קְרָאתִ֥י/ךָֽ בְ/צֶ֖דֶק וְ/אַחְזֵ֣ק בְּ/יָדֶ֑/ךָ וְ/אֶצָּרְ/ךָ֗ וְ/אֶתֶּנְ/ךָ֛ לִ/בְרִ֥ית עָ֖ם לְ/א֥וֹר גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/006.yaml
  text: I am Yahweh[a]; I have called you in righteousness, and I will take hold of your hand; I will keep you and give you as a covenant for the people[c][b], as a light for the nations.
translation:
  language: hi
  text: “मैं याहवे[a] हूँ; मैंने धार्मिकता[b] के अनुसार तुझे बुलाया है। मैं तेरा हाथ थामूँगा, तेरी रक्षा करूँगा[c], और तुझे लोगों के लिए वाचा[d] तथा राष्ट्रों के लिए ज्योति के रूप में दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “याहवे” इब्रानी יהוה, परमेश्वर के व्यक्तिगत नाम, का लिप्यंतरण है; कई अनुवाद यहाँ “प्रभु” लिखते हैं।
    reason: divine_name
  - marker: b
    text: या, “न्याय के अनुसार।” इब्रानी शब्द धार्मिकता और न्याय, दोनों का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “तुझे सुरक्षित रखूँगा” अथवा “तेरी रखवाली करूँगा।”
    reason: lexical_alternative
  - marker: d
    text: या, “एक प्रजा के लिए वाचा।” यहाँ “लोगों” से सम्भवतः इस्राएल अभिप्रेत है, जो आगे आए “राष्ट्रों” के समानांतर है।
    reason: textual_semantic_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसका निकट देवनागरी लिप्यंतरण रखा गया है।
- source_word: קְרָאתִיךָ
  choice: मैंने ... तुझे बुलाया है
  rationale: इब्रानी पूर्ण क्रिया उस संपन्न बुलाहट को व्यक्त करती है जिसका वर्तमान महत्व बना हुआ है; हिन्दी का पूर्ण वर्तमान इसे स्वाभाविक रूप से प्रकट करता है।
- source_word: בְצֶדֶק
  choice: धार्मिकता के अनुसार
  rationale: यह पदबंध नैतिक धार्मिकता और न्यायपूर्णता, दोनों की अर्थ-सीमा को खुला रखता है तथा हिन्दी में स्वाभाविक है।
- source_word: וְאַחְזֵק בְּיָדֶךָ
  choice: मैं तेरा हाथ थामूँगा
  rationale: यह हाथ पकड़ने की ठोस छवि और उससे सूचित दैवी सहारा, दोनों को बनाए रखता है।
- source_word: וְאֶצָּרְךָ
  choice: तेरी रक्षा करूँगा
  rationale: נצר के पहरा देने, सुरक्षित रखने और संभालने के भाव को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְאֶתֶּנְךָ
  choice: तुझे ... के रूप में दूँगा
  rationale: נתן के मूल अर्थ ‘देना’ को बनाए रखा गया है; इसे केवल ‘नियुक्त करना’ या ‘बनाना’ नहीं किया गया।
- source_word: לִבְרִית עָם
  choice: लोगों के लिए वाचा
  rationale: सेवक को स्वयं वाचा के रूप में दिए जाने की असाधारण इब्रानी अभिव्यक्ति सुरक्षित रहती है; ‘वाचा का मध्यस्थ’ जैसी व्याख्यात्मक बढ़ोतरी नहीं की गई।
- source_word: לְאוֹר גּוֹיִם
  choice: राष्ट्रों के लिए ज्योति
  rationale: ‘ज्योति’ मूल रूपक को रखता है और ‘राष्ट्रों’ से व्यापक गैर-इस्राएली संसार का भाव बिना अनावश्यक तकनीकी धार्मिक शब्दावली के व्यक्त होता है।
theological_decisions:
- issue: सम्बोधित सेवक का ‘लोगों के लिए वाचा’ होना
  choice: तुझे लोगों के लिए वाचा ... के रूप में दूँगा
  alternative: तुझे लोगों के लिए वाचा का मध्यस्थ ठहराऊँगा
  rationale: मूल पाठ सेवक को केवल मध्यस्थ नहीं कहता, बल्कि उसे स्वयं वाचा के रूप में दिए जाने की बात करता है। सीधी और अर्थसमृद्ध भाषा तत्काल यशायाह-संदर्भ तथा आगे की मसीही समझ, दोनों को पाठक पर थोपे बिना खुला रखती है।
- issue: ‘लोगों’ और ‘राष्ट्रों’ का पारस्परिक संबंध
  choice: लोगों ... राष्ट्रों
  alternative: इस्राएल ... अन्यजातियों
  rationale: यह मूल के व्यापक सामूहिक शब्दों और उनके काव्यात्मक विरोध को बचाता है, पर मुख्य पाठ में उनके संदर्भ को व्याख्यात्मक रूप से संकुचित नहीं करता।
- issue: צֶדֶק की अर्थ-सीमा
  choice: धार्मिकता
  alternative: न्याय
  rationale: मुख्य पाठ में ‘धार्मिकता’ रखा गया है और ‘न्याय’ को पादटिप्पणी में दिया गया है, ताकि नैतिक और न्यायिक दोनों अर्थ-संभावनाएँ बनी रहें।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। एकवचन सम्बोधन को ‘तू/तेरा’ रूप में रखा गया है क्योंकि यह काव्यात्मक दैवी सम्बोधन है और हिन्दी बाइबलीय शैली में गरिमापूर्ण सुनाई देता है। ‘वाचा’ धार्मिक-साहित्यिक शब्द है, पर ‘नियम’ या ‘समझौता’ की तुलना में בְּרִית का अधिक सटीक और स्थापित हिन्दी रूप है।
