  text: קָנֶ֤ה רָצוּץ֙ לֹ֣א יִשְׁבּ֔וֹר וּ/פִשְׁתָּ֥ה כֵהָ֖ה לֹ֣א יְכַבֶּ֑/נָּה לֶ/אֱמֶ֖ת יוֹצִ֥יא מִשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/003.yaml
  text: A bruised reed he will not break[a], and a dimly burning wick he will not extinguish[b]; he will faithfully bring forth justice.
translation:
  language: hi
  text: कुचले हुए सरकंडे को वह नहीं तोड़ेगा, और मंद जलती हुई बत्ती[a] को वह नहीं बुझाएगा; वह निष्ठापूर्वक न्याय प्रकट करेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “मंद पड़ा हुआ सन।” यहाँ सम्भवतः सन से बनी दीपक की बत्ती अभिप्रेत है।'
    reason: lexical_alternative
  - marker: b
    text: 'या: “वह सत्य में/सच्चाई से न्याय प्रकट करेगा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: קָנֶה רָצוּץ
  choice: कुचला हुआ सरकंडा
  rationale: ‘सरकंडा’ קָנֶה की वनस्पति-संबंधी छवि को स्वाभाविक हिन्दी में बनाए रखता है। ‘कुचला हुआ’ רָצוּץ से व्यक्त क्षतिग्रस्त और अत्यन्त नाज़ुक दशा बताता है, पर उसे पहले से टूटा हुआ नहीं कहता।
- source_word: לֹא יִשְׁבּוֹר
  choice: वह नहीं तोड़ेगा
  rationale: अपूर्ण क्रिया सेवक के भावी अथवा चारित्रिक आचरण को व्यक्त करती है; हिन्दी का सामान्य भविष्यकाल दोनों भावों के अनुकूल है।
- source_word: פִשְׁתָּה כֵהָה
  choice: धीमे जलती हुई बत्ती
  rationale: פִשְׁתָּה का शाब्दिक अर्थ सन है, किन्तु बुझाने और मंद होने के प्रसंग में सन से बनी दीपक की बत्ती अभिप्रेत है। ‘धीमे जलती हुई’ כֵהָה की मंद पड़ती लौ को स्पष्ट करता है, बिना केवल धुआँ देने का अर्थ थोपे।
- source_word: לֹא יְכַבֶּנָּה
  choice: वह नहीं बुझाएगा
  rationale: ‘बुझाना’ दीपक या बत्ती के लिए सहज आधुनिक हिन्दी है और כבה के अर्थ को ठीक व्यक्त करता है।
- source_word: לֶאֱמֶת
  choice: सच्चाई से
  rationale: यह पदबंध ‘सत्य में’ अथवा ‘विश्वासयोग्यता से’ का भाव दे सकता है। ‘सच्चाई से’ हिन्दी में क्रियाविशेषणीय प्रयोग को स्वाभाविक रखते हुए सत्यनिष्ठा और विश्वसनीयता दोनों की गुंजाइश बनाए रखता है।
- source_word: יוֹצִיא מִשְׁפָּט
  choice: न्याय को सामने लाएगा
  rationale: יצא के हिफ़ील रूप का मूल भाव किसी वस्तु को बाहर या सामने लाना है। ‘न्याय को सामने लाएगा’ इस गतिशीलता को बनाए रखता है और מִשְׁפָּט को केवल न्यायिक निर्णय तक सीमित नहीं करता।
theological_decisions:
- issue: सेवक द्वारा दुर्बलों के साथ व्यवहार की रूपकात्मक तस्वीर
  choice: ‘कुचला हुआ सरकंडा’ और ‘धीमे जलती हुई बत्ती’ की ठोस छवियाँ बनाए रखी गईं।
  alternative: इन्हें सीधे ‘कमज़ोर व्यक्ति’ और ‘निराश व्यक्ति’ के रूप में स्पष्ट करना।
  rationale: इब्रानी पाठ रूपकों की व्याख्या स्वयं नहीं करता। मूल छवियों को बनाए रखने से काव्यात्मक प्रभाव और व्याख्यात्मक खुलापन सुरक्षित रहता है।
- issue: לֶאֱמֶת का अर्थ
  choice: सच्चाई से
  alternative: सत्य में; विश्वासयोग्यता से
  rationale: אֱמֶת सत्य, निष्ठा और विश्वसनीयता का अर्थ दे सकता है। मुख्य पाठ का चुनाव स्वाभाविक हिन्दी है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प को सुरक्षित रखती है।
- issue: מִשְׁפָּט का आशय
  choice: न्याय
  alternative: निर्णय; न्याय-व्यवस्था
  rationale: यहाँ शब्द का आशय केवल अदालत के किसी निर्णय से अधिक व्यापक, न्यायपूर्ण व्यवस्था से है; इसलिए ‘न्याय’ सबसे उपयुक्त और खुला अनुवाद है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर काव्यात्मक संरचना सुरक्षित है। ‘सरकंडा’ और ‘बत्ती’ सामान्य पाठक के लिए स्पष्ट हैं; ‘न्याय को सामने लाएगा’ मूल क्रिया की गति को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
