  text: אֲנִ֥י יְהוָ֖ה ה֣וּא שְׁמִ֑/י וּ/כְבוֹדִ/י֙ לְ/אַחֵ֣ר לֹֽא אֶתֵּ֔ן וּ/תְהִלָּתִ֖/י לַ/פְּסִילִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/008.yaml
  text: I am Yahweh; that is my name. I will not give my glory to another[a], nor my praise to idols.
translation:
  language: hi
  text: मैं याहवे हूँ; यही मेरा नाम है। मैं अपनी महिमा किसी दूसरे को नहीं दूँगा, और न अपनी स्तुति गढ़ी हुई मूर्तियों को दूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में प्रस्तुत करता है।
- source_word: הוּא שְׁמִי
  choice: यही मेरा नाम है
  rationale: הוּא यहाँ पहचान पर बल देता है; ‘यही’ हिन्दी में उसके संकेतात्मक और बलात्मक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כְבוֹדִי
  choice: अपनी महिमा
  rationale: כָּבוֹד के लिए ‘महिमा’ इस प्रसंग में परमेश्वर के अद्वितीय गौरव और सम्मान—दोनों—को समेटने वाला स्थापित तथा सुबोध शब्द है।
- source_word: לְאַחֵר
  choice: किसी दूसरे को
  rationale: אַחֵר का अनिश्चित विरोधात्मक अर्थ बना रहता है और यह अनावश्यक रूप से उसके संदर्भ को सीमित नहीं करता।
- source_word: אֶתֵּן
  choice: नहीं दूँगा
  rationale: अपूर्ण क्रिया-रूप यहाँ दृढ़ संकल्प अथवा भावी निषेध व्यक्त करता है; ‘नहीं दूँगा’ इसे स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: תְהִלָּתִי
  choice: अपनी स्तुति
  rationale: यह मूल के संक्षिप्त संबंधसूचक रूप को रखता है और ‘मुझे दी जाने वाली स्तुति’ जैसी व्याख्यात्मक वृद्धि से बचता है।
- source_word: לַפְּסִילִים
  choice: गढ़ी हुई मूर्तियों को
  rationale: פְּסִילִים विशेषतः काटकर या गढ़कर बनाई गई प्रतिमाओं को सूचित करता है; यह चयन भौतिक रूप से निर्मित होने का भाव सुरक्षित रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। उसे ‘प्रभु’ जैसी उपाधि से बदलने के बजाय हिन्दी में पहचाने जाने वाले नाम-रूप से प्रस्तुत किया गया है; इब्रानी उच्चारण की सटीकता अनिश्चित है।
- issue: ‘अपनी स्तुति’ का अर्थ स्पष्ट करना
  choice: मूल का संक्षिप्त संबंधसूचक रूप बनाए रखना
  alternative: वह स्तुति जो मुझे मिलनी चाहिए
  rationale: विस्तारित विकल्प आशय स्पष्ट करता है, पर मूल कविता से अधिक व्याख्या जोड़ता है।
- issue: פְּסִילִים में मूर्तिपूजा और निर्माण—दोनों भाव
  choice: गढ़ी हुई मूर्तियाँ
  alternative: मूरतें; खुदी हुई प्रतिमाएँ
  rationale: चयन मूल शब्द के निर्मित/तराशे हुए रूप को प्रत्यक्ष रखता है, जबकि प्रसंग में उनका पूजनीय प्रतिमा होना स्वतः स्पष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमामय और सामान्य पाठक के लिए सहज। समानांतर काव्य-वाक्यों की संक्षिप्तता रखी गई है। ‘गढ़ी हुई मूर्तियाँ’ ने ऐसी पाद-टिप्पणी की आवश्यकता घटा दी जो केवल अधिक शाब्दिक विकल्प बताती।
