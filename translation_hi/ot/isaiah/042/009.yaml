id: ISA.42.9
reference: Isaiah 42:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הָ/רִֽאשֹׁנ֖וֹת הִנֵּה בָ֑אוּ וַֽ/חֲדָשׁוֹת֙ אֲנִ֣י מַגִּ֔יד בְּ/טֶ֥רֶם תִּצְמַ֖חְנָה אַשְׁמִ֥יע אֶתְ/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/009.yaml
  text: Behold[a], the former things have come to pass, and I declare new things; before they spring up[c][b], I announce them to you.
translation:
  language: hi
  text: देखो, पिछली बातें[a] घट चुकी हैं[b]; और नई बातें मैं बताता हूँ। उनके अंकुरित होने[c] से पहले ही मैं तुम्हें उनकी सूचना देता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पहली बातें’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘आ चुकी हैं’; प्रसंग में भाव है, ‘घट चुकी हैं’ या ‘पूरी हो चुकी हैं’।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी क्रिया का शाब्दिक भाव पौधे के ‘उगने’ या ‘अंकुर फूटने’ का है; यहाँ ऐसी घटनाओं के प्रकट होने का बिंब है जो अभी दिखाई नहीं दी हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִאשֹׁנוֹת
  choice: पिछली बातें
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और आगे की ‘नई बातें’ के साथ विरोध बनाता है। ‘पिछली बातें’ आधुनिक हिन्दी में स्वाभाविक है, जबकि ‘पहली बातें’ भी सम्भव है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है। ‘देखो’ भविष्यद्वाणी की प्रबलता बनाए रखते हुए आधुनिक हिन्दी में सहज और गरिमापूर्ण है।
- source_word: בָאוּ
  choice: घट चुकी हैं
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘आ चुकी हैं’ है, पर यहाँ पहले कही गई घटनाओं के घटित हो जाने का भाव है।
- source_word: חֲדָשׁוֹת
  choice: नई बातें
  rationale: यह भी संज्ञा के रूप में प्रयुक्त बहुवचन विशेषण है। ‘नई बातें’ मूल की संक्षिप्तता और समानांतर रचना को बनाए रखता है, बिना उन्हें केवल घटनाएँ मानकर सीमित किए।
- source_word: מַגִּיד
  choice: बताता हूँ
  rationale: הגיד का अर्थ प्रकट करना, बताना या घोषित करना है। ‘बताता हूँ’ सामान्य पाठक के लिए स्वाभाविक है और ईश्वरीय सूचना देने का भाव स्पष्ट रखता है।
- source_word: בְּטֶרֶם
  choice: से पहले ही
  rationale: यह समयसूचक अव्यय ‘इससे पहले कि’ का अर्थ देता है; ‘ही’ आगामी बात के पहले से घोषित होने पर स्वाभाविक बल देता है।
- source_word: תִּצְמַחְנָה
  choice: उनके अंकुरित होने
  rationale: क्रिया צמח पौधे के उगने या अंकुर फूटने का बिंब रखती है। ‘अंकुरित होने’ उस बिंब को स्पष्ट और संक्षिप्त हिन्दी में सुरक्षित रखता है।
- source_word: אַשְׁמִיע אֶתְכֶם
  choice: मैं तुम्हें उनकी सूचना देता हूँ
  rationale: शाब्दिक भाव ‘मैं तुम्हें सुनाता हूँ’ या ‘तुम्हें सुनने देता हूँ’ है। प्रसंग से विषय ‘नई बातें’ है; ‘उनकी सूचना देता हूँ’ संप्रेषण के कारणवाचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पहले की बातों का घटित होना और नई बातों की घोषणा
  choice: पद को पहले कही गई बातों के घटित हो जाने और परमेश्वर द्वारा नई बातों को उनके प्रकट होने से पहले बताने के विरोध के रूप में प्रस्तुत किया गया है।
  alternative: इसे पूर्वघोषणा की विशेष छाया के बिना केवल बीते हुए और आने वाले कार्यों के सामान्य विरोध के रूप में भी पढ़ा जा सकता है।
  rationale: ‘पिछली बातें घट चुकी हैं’, ‘नई बातें मैं बताता हूँ’ और ‘पहले ही’ का संयोजन पूर्वघोषणा और उसकी सिद्धि का संकेत देता है; फिर भी अनुवाद इससे आगे कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और भविष्यद्वाणी के अनुकूल स्वर रखा गया है। छोटे समानांतर वाक्यों से इब्रानी पद की गति बनी रहती है। ‘अंकुरित होने’ द्वारा मूल का वनस्पति-बिंब सुरक्षित रखा गया है।
