source:
  edition: WLC
  text: לֹ֤א יִכְהֶה֙ וְ/לֹ֣א יָר֔וּץ עַד יָשִׂ֥ים בָּ/אָ֖רֶץ מִשְׁפָּ֑ט וּ/לְ/תוֹרָת֖/וֹ אִיִּ֥ים יְיַחֵֽילוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/004.yaml
  text: He will not grow dim or be crushed until he establishes justice in the earth[a], and the coastlands will wait for his instruction.
translation:
  language: hi
  text: वह न मंद पड़ेगा, न कुचला जाएगा, जब तक वह पृथ्वी पर न्याय स्थापित न कर दे; और समुद्र-पार के देश उसकी शिक्षा की आशा भरी प्रतीक्षा करेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी शिक्षा की आशा लगाए रहेंगे।” इब्रानी क्रिया में आशा के साथ प्रतीक्षा करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכְהֶה
  choice: मन्द पड़ेगा
  rationale: כהה का मूल भाव मन्द या धुँधला पड़ना है। यह पद 3 की मन्द जलती बत्ती की छवि से संबंध बनाए रखता है और सेवक के स्वयं शिथिल न पड़ने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָרוּץ
  choice: कुचला जाएगा
  rationale: רצץ का अर्थ कुचलना या तोड़ना है। कर्मवाच्य रूप मूल की व्यंजनात्मक पुनरुक्ति तथा पिछले पद की कुचली हुई नरकट की छवि को बनाए रखता है।
- source_word: עַד יָשִׂים
  choice: जब तक ... स्थापित न कर दे
  rationale: שים का शाब्दिक अर्थ रखना है, पर מִשְׁפָּט के साथ यहाँ न्याय को दृढ़ता से लागू या स्थापित करने का परिणामसूचक भाव है।
- source_word: בָּאָרֶץ
  choice: पृथ्वी पर
  rationale: אֶרֶץ का अर्थ देश या पृथ्वी दोनों हो सकता है। आगे दूरस्थ समुद्री भूभागों के उल्लेख के कारण यहाँ व्यापक, सार्वभौमिक क्षितिज अधिक उपयुक्त है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: यहाँ शब्द केवल न्यायिक निर्णय नहीं, बल्कि न्यायपूर्ण व्यवस्था का भाव देता है।
- source_word: לְתוֹרָתוֹ
  choice: उसकी शिक्षा
  rationale: תורה का अर्थ केवल विधि-संहिता नहीं, बल्कि अधिकारपूर्ण शिक्षा या निर्देश भी है। 'शिक्षा' आधुनिक हिन्दी में स्वाभाविक रहते हुए इस व्यापक अर्थ को रखती है।
- source_word: אִיִּים
  choice: समुद्र-पार के देश
  rationale: भविष्यवाणी-साहित्य में אִיִּים द्वीपों के साथ दूरस्थ समुद्रतटीय भूभागों को भी सूचित करता है। 'समुद्र-पार के देश' साधारण हिन्दी पाठक के लिए अर्थ स्पष्ट करता है, बिना इसे केवल द्वीपों तक सीमित किए।
- source_word: יְיַחֵילוּ
  choice: आशा लगाए रहेंगे
  rationale: יחל के पिएल रूप में आशापूर्ण प्रतीक्षा का भाव है। यह चयन प्रतीक्षा और आशा दोनों को स्वाभाविक हिन्दी में समेटता है।
theological_decisions:
- issue: सेवक के कार्य का भौगोलिक विस्तार
  choice: '''पृथ्वी'' और ''समुद्र-पार के देश'' द्वारा व्यापक दायरा'
  alternative: '''देश'' से मुख्यतः इस्राएल की भूमि का संकेत'
  rationale: पद में אֶרֶץ के साथ אִיִּים का उल्लेख स्थानीय सीमा से परे क्षितिज सुझाता है; अनुवाद इसी संकेत को व्यक्त करता है, पर बाद की धर्मवैज्ञानिक पहचान को पाठ में नहीं जोड़ता।
- issue: सेवक के धैर्य और पीड़ा का संबंध
  choice: वह न मन्द पड़ेगा, न कुचला जाएगा
  alternative: वह न थकेगा, न निराश होगा
  rationale: रूपकात्मक क्रियाएँ पद 3 की छवियों की प्रतिध्वनि करती हैं। उन्हें मनोवैज्ञानिक शब्दों में बदलने से मूल का काव्यात्मक और शाब्दिक संबंध मिट जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। 'मन्द पड़ेगा' और 'कुचला जाएगा' मूल रूपकों तथा पिछले पद से उनके संबंध को बनाए रखते हैं। पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित वाक्य के अंत में दिया गया है।
