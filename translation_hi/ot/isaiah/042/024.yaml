  text: מִֽי נָתַ֨ן ל/משוסה יַעֲקֹ֛ב וְ/יִשְׂרָאֵ֥ל לְ/בֹזְזִ֖ים הֲ/ל֣וֹא יְהוָ֑ה ז֚וּ חָטָ֣אנוּ ל֔/וֹ וְ/לֹֽא אָב֤וּ בִ/דְרָכָי/ו֙ הָל֔וֹךְ וְ/לֹ֥א שָׁמְע֖וּ בְּ/תוֹרָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/024.yaml
  text: Who gave Jacob over to plunder[a], and Israel to looters? Was it not Yahweh, he against whom we have sinned? They were not willing to walk in his ways[b], and they did not listen to his law.
translation:
  language: hi
  text: किसने याकूब को लूट का शिकार होने के लिए[a] और इस्राएल को लुटेरों के हाथ सौंप दिया? क्या वह यहोवा नहीं था—वही जिसके विरुद्ध हमने पाप किया? वे उसके मार्गों पर चलने को तैयार नहीं थे और उन्होंने उसकी व्यवस्था[b] को नहीं सुना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में भाव है ‘लूटे जाने के लिए’; याकूब और इस्राएल को लूट का शिकार बनने के लिए सौंपे जाने का चित्र है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसकी शिक्षा’; इब्रानी शब्द तोराह का अर्थ ‘व्यवस्था’ के साथ-साथ ‘शिक्षा’ या ‘निर्देश’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ל/משוסה
  choice: लूट का शिकार होने के लिए
  rationale: מְשׁוֹסָה किसी को लूटे जाने या लूट का शिकार बनने के लिए सौंपे जाने का भाव देता है। हिंदी में यह प्रयोग स्वाभाविक रहते हुए पीड़ित अवस्था स्पष्ट करता है।
- source_word: לְ/בֹזְזִים
  choice: लुटेरों के हाथ
  rationale: בזז से बना यह बहुवचन कृदंत लूटने वालों को दर्शाता है। ‘लुटेरों के हाथ सौंप दिया’ शत्रु-कर्ताओं और सुपुर्द किए जाने, दोनों भावों को स्वाभाविक हिंदी में रखता है।
- source_word: הֲ/לֹא יְהוָה
  choice: क्या वह यहोवा नहीं था
  rationale: प्रश्नवाचक रचना सकारात्मक उत्तर की अपेक्षा करती है। वाचा-सूचक नाम יהוה को ‘यहोवा’ के रूप में लिप्यंतरित किया गया है।
- source_word: זוּ חָטָאנוּ ל/וֹ
  choice: वही, जिसके विरुद्ध हमने पाप किया
  rationale: זוּ को संबंधसूचक बल के साथ ‘वही, जिसके’ और חטא ל को हिंदी मुहावरे के अनुसार ‘के विरुद्ध पाप करना’ प्रस्तुत किया गया है।
- source_word: וְ/לֹא אָבוּ
  choice: वे ... तैयार नहीं थे
  rationale: אבה इच्छा या तत्परता व्यक्त करता है। ‘तैयार नहीं थे’ अनिच्छा को व्यक्त करता है, पर ‘उन्होंने साफ इनकार किया’ जैसी अधिक तीखी व्याख्या नहीं जोड़ता।
- source_word: בִ/דְרָכָי/ו הָלוֹךְ
  choice: उसके मार्गों पर चलने
  rationale: यह आचरण का हिब्रू मुहावरा है। ‘मार्गों पर चलना’ हिंदी बाइबलीय भाषा में परिचित और अर्थपूर्ण है।
- source_word: בְּ/תוֹרָת/וֹ
  choice: उसकी व्यवस्था
  rationale: תּוֹרָה का अर्थ शिक्षा या निर्देश भी हो सकता है, पर इस वाचागत संदर्भ में ‘व्यवस्था’ सशक्त और परिचित है; विकल्प को पादटिप्पणी में रखा गया है।
- source_word: שָׁמְעוּ
  choice: ध्यान नहीं दिया
  rationale: שׁמע में सुनने के साथ मानने का भाव निहित हो सकता है। בְּתוֹרָתוֹ के साथ ‘ध्यान देना’ सुनने और ग्रहण करने के बीच की व्यापकता को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  choice: याकूब ... इस्राएल
  rationale: दोनों नाम ज्यों के त्यों रखे गए हैं ताकि काव्यात्मक समानांतरता और लोगों की वाचागत पहचान बनी रहे।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा-सूचक व्यक्तिगत नाम सीधे आया है। आधुनिक हिंदी पाठकों के लिए व्यापक रूप से पहचाना जाने वाला लिप्यंतरण ‘यहोवा’ रखा गया है, न कि पदवी ‘प्रभु’।
- issue: ‘हमने पाप किया’ से ‘वे तैयार नहीं थे’ की पुरुष-वचन संबंधी अदला-बदली
  choice: मूल का प्रथम पुरुष बहुवचन से तृतीय पुरुष बहुवचन में परिवर्तन बनाए रखना
  alternative: सभी उपवाक्यों को ‘हम’ करके समरूप बनाना
  rationale: हिब्रू में सामुदायिक अंगीकार ‘हमने’ के बाद लोगों का वर्णन ‘वे’ से होता है। इस वास्तविक तनाव को सहज बनाने के लिए मिटाया नहीं गया।
- issue: זוּ का संबंधसूचक बल
  choice: वही, जिसके विरुद्ध
  alternative: जिसके विरुद्ध
  rationale: ‘वही’ हिब्रू זוּ के औपचारिक जोर को बनाए रखता है, जबकि संबंधवाचक रचना हिंदी में स्पष्ट रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मार्गों पर चलना’ जैसे मूल रूपक को बनाए रखा गया है। पहले पुरुष ‘हम’ से तीसरे पुरुष ‘वे’ में मूल पाठ का बदलाव सुरक्षित रखा गया है।
