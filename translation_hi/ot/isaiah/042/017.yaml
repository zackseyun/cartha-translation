source:
  edition: WLC
  text: נָסֹ֤גוּ אָחוֹר֙ יֵבֹ֣שׁוּ בֹ֔שֶׁת הַ/בֹּטְחִ֖ים בַּ/פָּ֑סֶל הָ/אֹמְרִ֥ים לְ/מַסֵּכָ֖ה אַתֶּ֥ם אֱלֹהֵֽי/נוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/017.yaml
  text: They will be turned back[a]; they will be utterly put to shame—those who trust in an idol, who say to a cast image[d][c][b], “You are our gods.”
translation:
  language: hi
  text: वे पीछे लौट जाएँगे[a] और पूरी तरह लज्जित होंगे[b]—वे जो गढ़ी हुई मूर्ति पर भरोसा रखते हैं और ढली हुई प्रतिमा से कहते हैं, “तुम हमारे देवता हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पीछे हटा दिए जाएँगे”; इब्रानी क्रिया का अर्थ पीछे लौटना या पीछे हटाया जाना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “लज्जा से लज्जित होंगे,” जो अत्यधिक लज्जित होने का बलाघाती प्रयोग है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָסֹגוּ אָחוֹר
  choice: पीछे हटाए जाएँगे
  rationale: נסג के पीछे लौटने, पीछे हटने या पीछे धकेले जाने के अर्थ और न्याय-संदर्भ के परिणामात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יֵבֹשׁוּ בֹשֶׁת
  choice: पूरी तरह लज्जित होंगे
  rationale: सजातीय क्रिया और संज्ञा से बने इब्रानी बलाघात को बिना अस्वाभाविक पुनरुक्ति के हिन्दी में व्यक्त करता है।
- source_word: הַבֹּטְחִים
  choice: जो लोग ... भरोसा रखते हैं
  rationale: संज्ञा के रूप में प्रयुक्त कृदन्त को ऐसे लोगों की लगातार विशेषता के रूप में दर्शाता है।
- source_word: בַּפָּסֶל
  choice: गढ़ी हुई मूर्ति पर
  rationale: פֶּסֶל पूजा के लिए बनाई गई, प्रायः तराशी या गढ़ी हुई प्रतिमा को दर्शाता है; यह चयन उसके निर्मित होने के भाव को बनाए रखता है।
- source_word: לְמַסֵּכָה
  choice: ढली हुई प्रतिमा से
  rationale: מַסֵּכָה सामान्यतः साँचे में ढाली गई धातु की प्रतिमा है; 'ढली हुई प्रतिमा' निर्माण-विधि को स्पष्ट और सहज हिन्दी में रखता है।
- source_word: אַתֶּם אֱלֹהֵינוּ
  choice: तुम हमारे देवता हो
  rationale: सर्वनाम और संज्ञा दोनों के इब्रानी बहुवचन को हिन्दी में बनाए रखता है; 'हो' हिन्दी में बहुवचन संबोधन के अनुकूल है।
theological_decisions:
- issue: פֶּסֶל और מַסֵּכָה का भेद
  choice: '''गढ़ी हुई मूर्ति'' और ''ढली हुई प्रतिमा'' के रूप में अलग-अलग प्रस्तुत करना'
  alternative: दोनों को केवल 'मूर्ति' कहना
  rationale: मूल पाठ उपासना के लिए निर्मित वस्तुओं के दो अलग शब्द इस्तेमाल करता है। हिन्दी में भेद रखने से उनकी धार्मिक भूमिका और निर्माण-संबंधी चित्र दोनों सुरक्षित रहते हैं।
- issue: אֱלֹהֵינוּ की वचन-संख्या
  choice: बहुवचन 'हमारे देवता' बनाए रखना
  alternative: एकवचन 'हमारा देवता' करना
  rationale: इब्रानी संज्ञा और उसके साथ का द्वितीय पुरुष सर्वनाम दोनों बहुवचन हैं; इसलिए सहजता के नाम पर इसे एकवचन करना मूल की व्याकरणिक विशेषता मिटा देता।
- issue: न्याय-वचन का काल और वाच्य
  choice: भविष्यकालीन परिणाम के रूप में 'पीछे हटाए जाएँगे ... लज्जित होंगे'
  alternative: पूर्णकाल 'पीछे हट गए हैं' या कर्तृवाच्य 'पीछे हटेंगे'
  rationale: संदर्भ में आने वाले दण्ड का स्वर है। पहला पद रूपतः पूर्ण है, पर भविष्यसूचक प्रवचन में निश्चित भावी परिणाम बता सकता है; हिन्दी में कर्मवाच्य संभावित प्रेरित/परिणामात्मक अर्थ को भी खुला रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। वाक्य को हिन्दी की स्वाभाविक सूचना-रचना के अनुसार संबंधवाचक उपवाक्यों से आरम्भ किया गया है। 'गढ़ी हुई मूर्ति' और 'ढली हुई प्रतिमा' मूल के दो अलग उपासना-वस्तु संबंधी शब्दों का भेद रखते हैं; बहुवचन 'देवता' जानबूझकर सुरक्षित है।
