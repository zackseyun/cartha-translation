source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר הָ/אֵ֣ל יְהוָ֗ה בּוֹרֵ֤א הַ/שָּׁמַ֨יִם֙ וְ/נ֣וֹטֵי/הֶ֔ם רֹקַ֥ע הָ/אָ֖רֶץ וְ/צֶאֱצָאֶ֑י/הָ נֹתֵ֤ן נְשָׁמָה֙ לָ/עָ֣ם עָלֶ֔י/הָ וְ/ר֖וּחַ לַ/הֹלְכִ֥ים בָּֽ/הּ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/005.yaml
  text: 'Thus says God[a], Yahweh, who created the heavens and stretched them out, who spread out the earth and its offspring[c][b], who gives breath to the people on it and spirit to those who walk in it:'
translation:
  language: hi
  text: 'परमेश्वर यहोवा इस प्रकार कहता है—वह, जिसने आकाश को रचा और उसे तान दिया, जिसने पृथ्वी और उससे निकलनेवाली वस्तुओं को फैलाया[a][b], जो उस पर बसे लोगों को साँस और उस पर चलनेवालों को आत्मा[c] देता है:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पृथ्वी को पीटकर फैलाया।” इब्रानी क्रिया किसी वस्तु को पीटकर चौड़ा करने या फैलाने की छवि दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “उससे निकलनेवाली चीज़ें”; इसका अर्थ उसकी उपज या उससे उत्पन्न जीव भी हो सकते हैं।
    reason: lexical_alternative
  - marker: c
    text: या, “श्वास।” इब्रानी शब्द का अर्थ “आत्मा,” “श्वास” या “वायु” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל יְהוָה
  choice: परमेश्वर यहोवा
  rationale: सामान्य ईश्वरीय पदवी और वाचा के व्यक्तिगत नाम, दोनों को सीधे और स्वाभाविक हिंदी में रखा गया है।
- source_word: בּוֹרֵא הַשָּׁמַיִם וְנֹטֵיהֶם
  choice: जिसने आकाश को रचा और उसे तान दिया
  rationale: सृष्टि के संदर्भ में שָׁמַיִם का सामूहिक अर्थ हिंदी के स्वाभाविक ‘आकाश’ से व्यक्त होता है; ‘तान दिया’ नָטָה की विस्तारण-छवि बनाए रखता है।
- source_word: רֹקַע הָאָרֶץ
  choice: जिसने पृथ्वी को फैलाया
  rationale: רָקַע में पीटकर चौड़ा करने और फैलाने, दोनों की छवि हो सकती है। मुख्य पाठ में परिणामसूचक और सहज ‘फैलाया’ रखा गया है तथा अधिक मूर्त विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְצֶאֱצָאֶיהָ
  choice: और उससे निकलनेवाली हर चीज़ को उत्पन्न किया
  rationale: צֶאֱצָאִים का मूल भाव पृथ्वी से निकलने या उपजनेवाली वस्तुओं/जीवों का है। यह व्यापक हिंदी अभिव्यक्ति अर्थ को केवल वनस्पति या संतान तक सीमित नहीं करती। ‘उत्पन्न किया’ हिंदी वाक्य में समानांतर सृष्टिकर्म को स्वाभाविक बनाता है।
- source_word: נֹתֵן נְשָׁמָה
  choice: साँस देता है
  rationale: נְשָׁמָה यहाँ जीवनदायी श्वास है; ‘साँस’ आधुनिक हिंदी में स्पष्ट है और इसे ‘आत्मा’ बनाकर दोनों इब्रानी शब्दों को एक नहीं करता।
- source_word: וְרוּחַ
  choice: और आत्मा
  rationale: רוּחַ के ‘आत्मा’, ‘श्वास’ और ‘वायु’ अर्थ हो सकते हैं। यहाँ נְשָׁמָה से भिन्न शब्द होने के कारण ‘आत्मा’ चुना गया है और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: לַהֹלְכִים בָּהּ
  choice: उस पर चलनेवालों को
  rationale: शाब्दिक चलने की ठोस छवि बचाते हुए पृथ्वी के लिए स्वाभाविक हिंदी परसर्ग ‘पर’ प्रयुक्त हुआ है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत वाचा-नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। हिंदी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जानेवाला लिप्यंतरण ‘यहोवा’ चुना गया है।
- issue: נְשָׁמָה और רוּחַ के बीच भेद
  choice: साँस … आत्मा
  alternative: साँस … श्वास
  rationale: मूल पाठ दो निकटार्थी किंतु अलग शब्दों का प्रयोग करता है। उन्हें अलग हिंदी शब्दों से व्यक्त करना मूल की मानव-स्वरूप संबंधी अर्थ-गहनता और तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सृष्टि-वर्णन की काव्यात्मक समानांतरता को सापेक्ष उपवाक्यों द्वारा बनाए रखा गया है। ‘परमेश्वर यहोवा’ में मूल की पदवी और व्यक्तिगत नाम दोनों सुरक्षित हैं।
