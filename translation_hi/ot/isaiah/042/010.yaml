source:
  edition: WLC
  text: שִׁ֤ירוּ לַֽ/יהוָה֙ שִׁ֣יר חָדָ֔שׁ תְּהִלָּת֖/וֹ מִ/קְצֵ֣ה הָ/אָ֑רֶץ יוֹרְדֵ֤י הַ/יָּם֙ וּ/מְלֹא֔/וֹ אִיִּ֖ים וְ/יֹשְׁבֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/010.yaml
  text: Sing to Yahweh a new song[a], his praise from the end of the earth, you who go down to the sea, and all that fills it[b], the coastlands and those who dwell in them.
translation:
  language: hi
  text: 'याहवे के लिए नया गीत गाओ,

    पृथ्वी के छोर से उसकी स्तुति गाओ—

    हे समुद्र में उतरने वालों,

    और हे जो कुछ उसमें भरा है,

    हे तटीय देशों और उनमें रहने वालों!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁירוּ לַיהוָה שִׁיר חָדָשׁ
  choice: याहवे के लिए एक नया गीत गाओ
  rationale: बहुवचन आज्ञार्थक क्रिया और ‘नया गीत’ की सामान्य इब्रानी अभिव्यक्ति को सीधे, स्वाभाविक हिन्दी में रखा गया है।
- source_word: תְּהִלָּתוֹ מִקְצֵה הָאָרֶץ
  choice: पृथ्वी के छोर से उसकी स्तुति करो
  rationale: इब्रानी में क्रिया दूसरे पद में निहित है; हिन्दी में अर्थ और आह्वान स्पष्ट करने के लिए ‘करो’ जोड़ा गया। एकवचन קְצֵה को ‘छोर’ रखा गया है।
- source_word: יוֹרְדֵי הַיָּם
  choice: हे समुद्र में उतरने वालो
  rationale: शाब्दिक और चित्रात्मक सहभागी पद को बनाए रखा गया; यह समुद्री यात्रा करने वालों की ओर संकेत करता है, पर उसे केवल ‘नाविक’ कहकर सीमित नहीं किया गया।
- source_word: וּמְלֹאוֹ
  choice: और जो कुछ उसमें भरा है
  rationale: מְלֹאֹו समुद्र की ‘परिपूर्णता’, अर्थात उसमें मौजूद सब कुछ, को दर्शाता है। हिन्दी वाक्यांश मूल रूपक को बनाए रखता है।
- source_word: אִיִּים
  choice: द्वीपो
  rationale: אִיִּים का मूल अर्थ द्वीप हो सकता है और भविष्यद्वाणी के प्रयोग में समुद्रतटीय या दूरस्थ भूभाग भी; मुख्य पाठ में संक्षिप्त ‘द्वीप’ और पादटिप्पणी में व्यापक अर्थ दिया गया है।
- source_word: וְיֹשְׁבֵיהֶם
  choice: और उनमें रहने वालो
  rationale: सर्वनाम का बहुवचन संकेत אִיִּים की ओर है; संबोधनात्मक शैली और ‘रहने’ की क्रियात्मक छाया सुरक्षित रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है। ‘याहवे’ उसका प्रचलित विद्वतापूर्ण लिप्यंतरण है और उसे किसी पदवी से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक आराधना के योग्य रखी गई है। काव्यात्मक संबोधन के लिए ‘हे ... वालो’ प्रयुक्त है। ‘पृथ्वी के छोर’ का एकवचन मूल इब्रानी के अनुसार सुरक्षित है।
