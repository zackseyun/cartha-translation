source:
  edition: WLC
  text: וְ/הוֹלַכְתִּ֣י עִוְרִ֗ים בְּ/דֶ֨רֶךְ֙ לֹ֣א יָדָ֔עוּ בִּ/נְתִיב֥וֹת לֹֽא יָדְע֖וּ אַדְרִיכֵ֑/ם אָשִׂים֩ מַחְשָׁ֨ךְ לִ/פְנֵי/הֶ֜ם לָ/א֗וֹר וּ/מַֽעֲקַשִּׁים֙ לְ/מִישׁ֔וֹר אֵ֚לֶּה הַ/דְּבָרִ֔ים עֲשִׂיתִ֖/ם וְ/לֹ֥א עֲזַבְתִּֽי/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/016.yaml
  text: And I will lead the blind by a way they have not known; on paths they have not known I will guide them. I will make the darkness before them into light[a], and the crooked places into level ground. These are the things I have done, and I have not forsaken them.
translation:
  language: hi
  text: और मैं अंधों को ऐसे मार्ग पर ले चलूँगा जिसे वे नहीं जानते; जिन पथों को वे नहीं जानते, उन पर मैं उनका मार्गदर्शन करूँगा। मैं उनके आगे के अंधकार को उजाला और टेढ़े-मेढ़े स्थानों को समतल भूमि बना दूँगा। ये काम मैंने किए हैं, और मैंने उन्हें नहीं छोड़ा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ये वे काम हैं जिन्हें मैं करूँगा, और मैं उन्हें नहीं छोड़ूँगा।” यहाँ हिब्रू में पूर्ण क्रियाएँ हैं; वे पूरे हो चुके कार्यों को या परमेश्वर की प्रतिज्ञा की ऐसी निश्चितता को व्यक्त कर सकती हैं जिसमें होनेवाले कार्य को पूरा हुआ बताया जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוֹלַכְתִּי
  choice: और मैं ... ले चलूँगा
  rationale: הלך के हिफ़ील रूप का अर्थ किसी को चलाना या ले जाना है; ‘ले चलूँगा’ स्वाभाविक हिन्दी में ईश्वरीय अगुवाई का भाव बनाए रखता है।
- source_word: עִוְרִים
  choice: अंधों को
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। यह मूल बिंब को बिना यह तय किए सुरक्षित रखता है कि अंधापन केवल शारीरिक है या रूपकात्मक भी।
- source_word: בְּדֶרֶךְ לֹא יָדָעוּ
  choice: ऐसे मार्ग पर ... जिसे वे नहीं जानते
  rationale: דרך यात्रा के मार्ग को दर्शाता है और ב इस संदर्भ में उस मार्ग पर चलने का भाव देता है। ‘नहीं जानते’ मूल ידע की जानने अथवा अनुभव से परिचित होने की व्यापकता बनाए रखता है।
- source_word: בִּנְתִיבוֹת ... אַדְרִיכֵם
  choice: जिन पथों को वे नहीं जानते, उन पर मैं उनका मार्गदर्शन करूँगा
  rationale: נתיבות काव्यात्मक बहुवचन ‘पथ’ है और דרך का हिफ़ील रूप यहाँ दिशा देने या मार्ग दिखाने को व्यक्त करता है। ‘मार्गदर्शन’ पहले ‘ले चलूँगा’ की अनावश्यक पुनरावृत्ति से बचता है।
- source_word: מַחְשָׁךְ לִפְנֵיהֶם לָאוֹר
  choice: उनके आगे के अंधकार को उजाला
  rationale: यह स्थानिक चित्र उनके सामने पड़े अंधकार के उजाले में बदलने का है। हिन्दी में ‘अंधकार को उजाला ... बना दूँगा’ परिवर्तन को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּמַעֲקַשִּׁים לְמִישׁוֹר
  choice: टेढ़े-मेढ़े स्थानों को समतल भूमि
  rationale: מַעֲקַשִּׁים टेढ़ी या विकृत चीज़ों/स्थानों का बोध कराता है, जबकि מִישׁוֹר समतल स्थान या भूमि है। यात्रा के रूपक में यह ठोस भू-दृश्य स्वाभाविक है।
- source_word: אֵלֶּה הַדְּבָרִים עֲשִׂיתִם
  choice: ये काम मैंने किए हैं
  rationale: דברים यहाँ प्रतिज्ञात कार्यों को सूचित करता है। पूर्ण क्रिया को हिन्दी पूर्ण वर्तमान में रखा गया है ताकि मूल पाठ का काल-पक्ष परिवर्तन बना रहे।
- source_word: וְלֹא עֲזַבְתִּים
  choice: और मैंने उन्हें नहीं छोड़ा है
  rationale: पूर्ण क्रिया और बहुवचन कर्म-प्रत्यय दोनों सुरक्षित हैं; ‘उन्हें’ निकट संदर्भ में उन अंधे लोगों की ओर संकेत करता है जिन्हें परमेश्वर ले चलता है।
theological_decisions:
- issue: भविष्य की प्रतिज्ञाओं के संदर्भ में अंतिम दो पूर्ण क्रियाओं का काल
  choice: ‘मैंने किए हैं ... मैंने नहीं छोड़ा है’ द्वारा हिब्रू पूर्ण रूपों को बनाए रखना
  alternative: ‘मैं करूँगा ... मैं नहीं छोड़ूँगा’ के रूप में पूरे कथन को भविष्यकाल में करना
  rationale: पद स्पष्ट भविष्यसूचक क्रियाओं से आरम्भ होता है, पर अंत में पूर्ण रूपों का प्रयोग करता है। हिन्दी पूर्ण वर्तमान इस तनाव को सुरक्षित रखता है और प्रतिज्ञा की निश्चितता को ऐसे व्यक्त होने देता है मानो कार्य संपन्न हो चुका हो; पादटिप्पणी स्वाभाविक भविष्यकालीन समझ भी बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मार्ग/पथ’, ‘अंधकार/उजाला’ और ‘टेढ़े-मेढ़े स्थान/समतल भूमि’ की काव्यात्मक समानांतरता सुरक्षित है। अंतिम हिब्रू पूर्ण क्रियाओं की वास्तविक काल-पक्षीय अस्पष्टता मुख्य पाठ और पादटिप्पणी दोनों में दिखाई गई है।
