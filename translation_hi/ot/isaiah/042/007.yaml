  text: to open blind eyes[a], to bring a prisoner out from confinement[c][b], from the prison house those who sit in darkness.
translation:
  language: hi
  text: अंधी आँखें खोलने के लिए[a], बंदीगृह से बंदी को बाहर निकालने के लिए[b], और कारागार से अंधकार में बैठे हुओं को निकालने के लिए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अंधों की आँखें।’
    reason: lexical_alternative
  - marker: b
    text: ‘बंदीगृह’ के लिए प्रयुक्त इब्रानी शब्द बंद रखने की अवस्था या निरुद्ध रखने की जगह का अर्थ दे सकता है; अनुवाद ‘कैद से’ या ‘कारागार से’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘अंधकार में रहने वालों को।’
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְקֹחַ
  choice: खोलने के लिए
  rationale: उद्देश्य सूचक infinitive construct को स्वाभाविक हिन्दी में व्यक्त करता है और ‘आँखें खोलना’ मूल इब्रानी प्रयोग के निकट है।
- source_word: עֵינַיִם עִוְרוֹת
  choice: अंधी आँखें
  rationale: विशेषण सीधे ‘आँखों’ का विशेषण है; यह संक्षिप्त रूप मूल बिंब को बनाए रखता है।
- source_word: לְהוֹצִיא
  choice: बाहर निकालने के लिए
  rationale: कारणवाचक क्रिया और उद्देश्य दोनों को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִמַּסְגֵּר
  choice: बंदीगृह से
  rationale: यह शब्द बंद रखने की जगह अथवा अवस्था का बोध करा सकता है; ‘बंदीगृह’ स्थानगत बिंब को रखते हुए अपेक्षाकृत व्यापक है।
- source_word: אַסִּיר
  choice: बंदी
  rationale: प्रतिनिधि एकवचन को बनाए रखता है और कैद या निरुद्ध व्यक्ति के अर्थ के अनुकूल है।
- source_word: מִבֵּית כֶּלֶא
  choice: कारागार से
  rationale: इब्रानी का शाब्दिक भाव ‘कैद का घर’ है; आधुनिक हिन्दी में ‘कारागार’ उसी स्थानगत अर्थ को गरिमापूर्ण और सहज ढंग से देता है।
- source_word: יֹשְׁבֵי חֹשֶׁךְ
  choice: जो अंधकार में बैठे हैं
  rationale: ישב के ‘बैठना/रहना’ वाले जीवंत बिंब को सुरक्षित रखता है और किसी दशा में बने रहने का काव्यात्मक संकेत भी बनाए रखता है।
theological_decisions:
- issue: अंधेपन, बंदीपन और अंधकार का शाब्दिक तथा रूपकात्मक दायरा
  choice: मुख्य पाठ में ठोस बिंबों को बिना आध्यात्मिक व्याख्या जोड़े बनाए रखना
  alternative: इसे स्पष्ट रूप से आत्मिक प्रकाश और मुक्ति के रूप में प्रस्तुत करना
  rationale: इब्रानी पाठ इन बिंबों को स्वयं व्याख्यायित नहीं करता; उनका शाब्दिक और रूपकात्मक तनाव बनाए रखना अधिक स्रोत-निष्ठ है।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक समानांतरता और मूल के ठोस बिंबों को रखते हुए सामान्य पाठक के लिए सहज, गरिमापूर्ण शब्दावली अपनाई गई है।
