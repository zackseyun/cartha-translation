lexical_decisions:
- source_word: הַחֵרְשִׁים
  choice: हे बहिरो
  rationale: सप्रत्यय विशेषण यहाँ संबोधन के रूप में स्वाभाविक रूप से पढ़ा जाता है। ‘हे बहिरो’ प्रत्यक्ष भविष्यद्वक्ताई पुकार और ठोस बिंब दोनों को बनाए रखता है।
- source_word: שְׁמָעוּ
  choice: सुनो
  rationale: यह שׁמע का बहुवचन आज्ञार्थक रूप है। ‘सुनो’ आधुनिक हिन्दी में सीधा और प्रभावशाली आदेश है तथा केवल शारीरिक श्रवण से आगे ध्यान देने का अर्थ भी संदर्भ के लिए खुला रखता है।
- source_word: וְהַעִוְרִים
  choice: और हे अंधो
  rationale: संयोजक दूसरे समानांतर संबोधन को जोड़ता है। ‘और हे अंधो’ इब्रानी की प्रत्यक्ष पुकार और काव्यात्मक समानांतरता को सुरक्षित रखता है।
- source_word: הַבִּיטוּ
  choice: दृष्टि लगाओ
  rationale: נבט के हिफ़ील बहुवचन आज्ञार्थक में किसी ओर ध्यानपूर्वक देखने का भाव है। ‘दृष्टि लगाओ’ साधारण ‘देखो’ की तुलना में इस निर्देशित देखने को अधिक स्पष्ट करता है और अगले ‘देखने’ के साथ अनावश्यक शब्द-पुनरावृत्ति घटाता है।
- source_word: לִרְאוֹת
  choice: देखने के लिए
  rationale: ל के साथ क्रिया का साधारण रूप उद्देश्य व्यक्त करता है। ‘देखने के लिए’ इब्रानी की संक्षिप्तता और ‘दृष्टि लगाओ ... देखने के लिए’ की जानबूझकर रखी गई विडंबना को बनाए रखता है।
theological_decisions:
- issue: ‘बहिरों’ और ‘अंधों’ को शाब्दिक इंद्रिय-संबंधी शब्दों में रखा जाए या सीधे आत्मिक असंवेदनशीलता के रूप में समझाकर अनुवाद किया जाए
  choice: मुख्य पाठ में ‘बहिरो’ और ‘अंधो’ के ठोस शब्द बनाए रखे गए
  alternative: हे आत्मिक रूप से बहिरे और अंधे लोगो
  rationale: संदर्भ में ये शब्द इस्राएल की अनुत्तरदायिता का रूपक हो सकते हैं, पर इब्रानी ठोस इंद्रिय-संबंधी शब्द ही प्रयोग करता है। उन्हें बनाए रखने से भविष्यद्वक्ताई बिंब सुरक्षित रहता है और व्याख्या अनुवाद में आरोपित नहीं होती।
- issue: सप्रत्यय विशेषणों को संबोधन माना जाए या संज्ञा-सदृश वर्णन
  choice: 'प्रत्यक्ष संबोधन: ‘हे बहिरो ... हे अंधो’'
  alternative: ‘बहरे सुनें ... अंधे दृष्टि लगाएँ’
  rationale: दोनों व्याकरणिक संभावनाएँ वास्तविक हैं। आज्ञार्थक क्रियाओं के साथ संबोधन इस संदर्भ में अधिक स्वाभाविक और प्रभावशाली है, जबकि वैकल्पिक पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वक्ताई संबोधन रखा गया है। ‘हे’ प्रत्यक्ष पुकार को स्पष्ट करता है; ‘बहिरा’ साहित्यिक किंतु सामान्यतः बोधगम्य है। वाक्य की समानांतर रचना और सुनने/देखने की ठोस छवियाँ सुरक्षित हैं।
