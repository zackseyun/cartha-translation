  text: לֹ֥א יִצְעַ֖ק וְ/לֹ֣א יִשָּׂ֑א וְ/לֹֽא יַשְׁמִ֥יעַ בַּ/ח֖וּץ קוֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/002.yaml
  text: He will not cry out or raise his voice[a], or make his voice heard in the street.
translation:
  language: hi
  text: वह न चिल्लाएगा, न अपनी आवाज़ ऊँची करेगा[a], और न सड़क पर अपनी आवाज़ सुनाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह न पुकारेगा, न ऊँचा उठाएगा, और न बाहर अपनी आवाज़ सुनाएगा।”
    reason: ‘अपनी आवाज़’ दूसरे खंड में निहित कर्म के रूप में समझा गया है; इब्रानी को अधिक शाब्दिक ढंग से बिना कर्म के भी पढ़ा जा सकता है, और חוּץ का अर्थ ‘बाहर’ भी हो सकता है।
lexical_decisions:
- source_word: יִצְעַק
  choice: चिल्लाएगा
  rationale: צעק ऊँची आवाज़ में पुकारने या चिल्लाने को व्यक्त करता है। यहाँ सेवक के संयमित सार्वजनिक व्यवहार के संदर्भ में ‘चिल्लाएगा’ स्वाभाविक और स्पष्ट है।
- source_word: יִשָּׂא
  choice: अपनी आवाज़ ऊँची करेगा
  rationale: נשׂא का मूल अर्थ ‘उठाना’ है; अगले खंड में ‘उसकी आवाज़’ आने के कारण यहाँ निहित कर्म ‘आवाज़’ को स्पष्ट करना हिन्दी में मुहावरेदार है।
- source_word: יַשְׁמִיעַ
  choice: अपनी आवाज़ सुनाएगा
  rationale: שׁמע का हिफ़ील रूप कारणवाचक है—‘सुनाई देना/सुनाना’। ‘अपनी आवाज़ सुनाएगा’ इस कारणवाचक भाव को सहज हिन्दी में बनाए रखता है।
- source_word: בַּחוּץ
  choice: सड़क पर
  rationale: חוּץ बाहरी या सार्वजनिक स्थान को दर्शाता है और यहाँ सार्वजनिक घोषणा के दृश्य में ‘सड़क पर’ उपयुक्त है।
- source_word: קוֹלוֹ
  choice: अपनी आवाज़
  rationale: קוֹל वाणी के संदर्भ में ‘आवाज़’ है। हिन्दी में कर्ता के साथ स्वाभाविक संबंध दिखाने के लिए ‘अपनी’ प्रयुक्त हुआ है।
- source_word: לֹא ... וְלֹא ... וְלֹא
  choice: न ... न ... और न
  rationale: तीन समानांतर निषेधों की काव्यात्मक लय को आधुनिक हिन्दी में ‘न ... न ... और न’ स्वाभाविक रूप से सुरक्षित रखता है।
theological_decisions:
- issue: सेवक-गीत के संदर्भ में अपूर्ण क्रियाओं का काल/पक्ष
  choice: भविष्य-सदृश वर्णन—‘वह ... नहीं/न ... करेगा’
  alternative: वर्तमान आदतन वर्णन—‘वह ... नहीं करता’
  rationale: यशायाह 42 में सेवक का चित्र कार्यक्रमात्मक और आगे की ओर उन्मुख है; इसलिए भविष्यकाल संदर्भ के अनुकूल है, जबकि कथन उसके स्वभावगत आचरण को भी व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक लय वाला अनुवाद। ‘चिल्लाएगा’ सार्वजनिक ऊँची पुकार का भाव देता है; ‘आवाज़ ऊँची करेगा’ हिन्दी का स्वाभाविक मुहावरा है।
