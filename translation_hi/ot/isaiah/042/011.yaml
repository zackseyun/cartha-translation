- from: मरुभूमि और उसके नगर अपनी आवाज़ उठाएँ; जिन बस्तियों में केदार रहता है, वे जयजयकार करें। सेला[a] के निवासी आनन्द से गाएँ; वे पर्वतों की चोटियों से ऊँचे स्वर में पुकारें।
  to: मरुभूमि और उसके नगर अपना स्वर उठाएँ; जिन बस्तियों में केदार रहता है, वे आनन्द से गाएँ। सेला[a] के निवासी आनन्द से गाएँ; वे पर्वतों की चोटियों से ऊँचे स्वर में पुकारें।
  rationale: A small lexical revision replaces ‘जयजयकार करें’ with ‘आनन्द से गाएँ’ to reflect יָרֹנּוּ more directly and to retain the repetition of the same Hebrew verb in the two parallel calls to praise. ‘अपना स्वर’ is a stylistic refinement of the implied object of יִשְׂאוּ; no change of meaning is intended.
