source:
  edition: WLC
  text: יִשְׂא֤וּ מִדְבָּר֙ וְ/עָרָ֔י/ו חֲצֵרִ֖ים תֵּשֵׁ֣ב קֵדָ֑ר יָרֹ֨נּוּ֙ יֹ֣שְׁבֵי סֶ֔לַע מֵ/רֹ֥אשׁ הָרִ֖ים יִצְוָֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/011.yaml
  text: Let the wilderness and its cities lift up their voice[a], the settlements where Kedar dwells; let the inhabitants of Sela sing for joy; let them shout from the tops of the mountains.
translation:
  language: hi
  text: मरुभूमि और उसके नगर अपना स्वर उठाएँ; जिन बस्तियों में केदार रहता है, वे आनन्द से गाएँ। सेला[a] के निवासी आनन्द से गाएँ; वे पर्वतों की चोटियों से ऊँचे स्वर में पुकारें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चट्टान के निवासी’, यदि סֶלַע को स्थान-नाम ‘सेला’ के बजाय सामान्य संज्ञा माना जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: अपनी आवाज़ उठाएँ
  rationale: נשׂא का अपूर्ण/आज्ञार्थक प्रयोग यहाँ स्तुति के लिए पुकार व्यक्त करता है। इब्रानी में कर्म निहित है; हिन्दी में स्वाभाविक अर्थ के लिए ‘अपनी आवाज़’ जोड़ा गया है और उठाने का रूपक सुरक्षित रखा गया है।
- source_word: מִדְבָּר
  choice: मरुभूमि
  rationale: यह निर्जन, शुष्क प्रदेश को दर्शाता है और भविष्यद्वाणी की काव्यात्मक शैली में स्वाभाविक है।
- source_word: וְעָרָיו
  choice: और उसके नगर
  rationale: पुल्लिंग एकवचन प्रत्यय का सबसे स्वाभाविक पूर्वपद ‘मरुभूमि’ है; इसलिए सम्बन्धसूचक अर्थ ‘उसके’ रखा गया है।
- source_word: חֲצֵרִים
  choice: बस्तियाँ
  rationale: यह प्रायः बिना परकोटे वाली छोटी बसाहटों या अर्ध-घुमंतू निवासों को दर्शाता है; ‘बस्तियाँ’ व्यापक और सहज हिन्दी है।
- source_word: תֵּשֵׁב קֵדָר
  choice: जिन बस्तियों में केदार रहता है
  rationale: स्त्रीलिंग एकवचन क्रिया को सामूहिक अर्थ में लेकर सम्बन्धवाचक वाक्य बनाया गया है। ‘केदार’ अरबी कबीले अथवा उससे जुड़े क्षेत्र का नाम है।
- source_word: יָרֹנּוּ
  choice: जयजयकार करें / आनन्द से गाएँ
  rationale: רנן में हर्षपूर्ण गायन अथवा उल्लासभरी पुकार दोनों का भाव है। समान पद की पुनरावृत्ति से बचते हुए पहले खंड में ‘जयजयकार करें’ और सेला के निवासियों के लिए ‘आनन्द से गाएँ’ रखा गया है।
- source_word: יֹשְׁבֵי
  choice: के निवासी
  rationale: यह किसी स्थान में रहने वालों के लिए प्रयुक्त कृदन्त-संज्ञा है; ‘निवासी’ संक्षिप्त और स्वाभाविक है।
- source_word: סֶלַע
  choice: सेला
  rationale: केदार के समानांतर होने के कारण इसे सम्भवतः स्थान-नाम माना गया है। सामान्य संज्ञा ‘चट्टान’ का सम्भव अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: מֵרֹאשׁ הָרִים
  choice: पर्वतों की चोटियों से
  rationale: शाब्दिक बिंब ‘पर्वतों के सिरों से’ है; ‘चोटियों से’ आधुनिक हिन्दी में स्पष्ट रहते हुए स्थानगत चित्र बनाए रखता है।
- source_word: יִצְוָחוּ
  choice: ऊँचे स्वर में पुकारें
  rationale: צוח ऊँची आवाज़ से पुकारने या चिल्लाने को दर्शाता है। स्तुति के प्रसंग में ‘ऊँचे स्वर में पुकारें’ उत्साह व्यक्त करता है और अनावश्यक रूप से संकट का भाव नहीं लाता।
