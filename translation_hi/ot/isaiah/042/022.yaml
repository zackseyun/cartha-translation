  text: וְ/הוּא֮ עַם בָּז֣וּז וְ/שָׁסוּי֒ הָפֵ֤חַ בַּֽ/חוּרִים֙ כֻּלָּ֔/ם וּ/בְ/בָתֵּ֥י כְלָאִ֖ים הָחְבָּ֑אוּ הָי֤וּ לָ/בַז֙ וְ/אֵ֣ין מַצִּ֔יל מְשִׁסָּ֖ה וְ/אֵין אֹמֵ֥ר הָשַֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/022.yaml
  text: But this is a people plundered and pillaged[a], all of them trapped in holes and hidden away in prison houses. They have become spoil, with no one to rescue them; plunder, with no one saying, “Restore!”
translation:
  language: hi
  text: पर यह लूटा और उजाड़ा हुआ लोगों का एक समूह है; वे सब गड्ढों[a] में फँसे हैं और बंदीगृहों में छिपा दिए गए हैं। वे लूट का माल हो गए हैं, और उन्हें बचाने वाला कोई नहीं; वे लूट का शिकार बन गए हैं, और कोई नहीं कहता, “लौटा दो!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “जवानों के बीच”; בַּחוּרִים का अधिक प्रचलित अर्थ “जवान” है, पर इस प्रसंग में “गड्ढों” या “छिपने के स्थानों” जैसा अर्थ अधिक उपयुक्त जान पड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא עַם
  choice: पर यह ... जनसमुदाय है
  rationale: एकवचन सर्वनाम का संकेत सामूहिक संज्ञा עַם की ओर है। ‘पर यह’ प्रसंग के विरोधसूचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘जनसमुदाय’ सामूहिक अर्थ बनाए रखता है।
- source_word: בָּזוּז וְשָׁסוּי
  choice: लूटा और उजाड़ा गया
  rationale: दोनों निष्क्रिय कृदंत हिंसक लूट और तबाही का संयुक्त चित्र देते हैं। दो अलग हिन्दी क्रियाएँ इब्रानी के समानांतर शब्दों को सपाट किए बिना सहज भाषा में रखती हैं।
- source_word: הָפֵחַ
  choice: फँसे हैं
  rationale: कठिन रूप का प्रसंगानुकूल अर्थ जाल में पड़ने या फँसने का है। ‘फँसे हैं’ वर्तमान दुर्दशा को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בַּחוּרִים
  choice: गड्ढों में
  rationale: बंदीगृहों में छिपाए जाने वाले समानांतर वाक्यांश के कारण यहाँ छेद, गड्ढे या छिपने के स्थान का अर्थ प्रसंगानुकूल है। अधिक प्रचलित ‘जवानों के बीच’ अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וּבְבָתֵּי כְלָאִים הָחְבָּאוּ
  choice: और बंदीगृहों में छिपा दिए गए हैं
  rationale: ‘बंदीगृह’ confinement के घर का ठोस भाव रखता है। निष्क्रिय रूप को ‘छिपा दिए गए’ से व्यक्त किया गया है, जिससे उनके विरुद्ध की गई कार्रवाई का भाव बना रहता है।
- source_word: הָיוּ לָבַז
  choice: वे लूट का माल हो गए हैं
  rationale: היה ל־ की परिणामी संरचना को ‘हो गए हैं’ से और सामूहिक युद्ध-लूट को ‘लूट का माल’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: וְאֵין מַצִּיל
  choice: और उन्हें बचाने वाला कोई नहीं
  rationale: अस्तित्ववाचक निषेध और उद्धार करने वाले कृदंत—दोनों को सीधे तथा सुबोध ढंग से रखा गया है।
- source_word: מְשִׁסָּה
  choice: लूट
  rationale: यह पहले के לָבַז के समानांतर उनकी दशा को दूसरों की लूट के रूप में दोहराता है; ‘लूट’ संक्षिप्त और आधुनिक हिन्दी में स्पष्ट है।
- source_word: הָשַׁב
  choice: लौटा दो!
  rationale: आज्ञार्थक रूप में कर्म व्यक्त नहीं है। हिन्दी में भी कर्म को अनकहा रखकर मूल की खुली व्यंजना और पुकार का बल सुरक्षित रखा गया है।
theological_decisions:
- issue: וְהוּא में एकवचन सर्वनाम का संदर्भ
  choice: इसे सामूहिक रूप से इस्राएल/यहाँ वर्णित जनसमुदाय के लिए ‘पर यह ... जनसमुदाय है’ किया गया है।
  alternative: अधिक शब्दशः ‘और वह एक जन है’।
  rationale: यह मुख्यतः व्याकरण और प्रवचन-संदर्भ का प्रश्न है, कोई सिद्धान्तगत निर्धारण नहीं। इसके तुरंत बाद आया עַם सर्वनाम को सामूहिक रूप से स्पष्ट करता है।
- issue: הָשַׁב में अनकहा कर्म
  choice: “लौटा दो!” में कर्म को अनकहा रखा गया है।
  alternative: “उन्हें लौटा दो!” या “लूट को वापस कर दो!”
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि लोगों को लौटाना है या छीनी गई वस्तु को; किसी एक अर्थ को जोड़ना मूल की वास्तविक अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जनसमुदाय’, ‘बंदीगृह’ और ‘लूट का माल’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि युद्ध, कैद और असहायता की काव्यात्मक समानांतरता भी बनी रहती है।
