source:
  edition: WLC
  text: וַ/יִּשְׁפֹּ֤ךְ עָלָי/ו֙ חֵמָ֣ה אַפּ֔/וֹ וֶ/עֱז֖וּז מִלְחָמָ֑ה וַ/תְּלַהֲטֵ֤/הוּ מִ/סָּבִיב֙ וְ/לֹ֣א יָדָ֔ע וַ/תִּבְעַר בּ֖/וֹ וְ/לֹא יָשִׂ֥ים עַל לֵֽב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/025.yaml
  text: So he poured out on him the heat of his anger and the might of battle[a]; it set him ablaze all around, but he did not know; it burned in him[d][c][b], but he did not take it to heart.
translation:
  language: hi
  text: इसलिए उसने उस पर अपने क्रोध की तपिश और युद्ध की प्रचण्डता उँडेल दी[a]; उसने उसे चारों ओर से जला दिया, फिर भी वह नहीं समझा; वह उसके भीतर जल उठी, फिर भी उसने इस बात पर ध्यान नहीं दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युद्ध का प्रचण्ड बल।”
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “उसने इसे हृदय पर नहीं रखा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּךְ
  choice: उँडेल दी
  rationale: שׁפך का मूल बिंब ‘उँडेलना’ है; क्रोध और न्याय के संदर्भ में यह रूपक हिन्दी में भी स्वाभाविक और सजीव है।
- source_word: עָלָיו
  choice: उस पर
  rationale: एकवचन पुरुषवाचक रूप को बनाए रखा गया है; संदर्भ में यह इस्राएल को एक व्यक्ति के रूप में प्रस्तुत करता है।
- source_word: חֵמָה אַפּוֹ
  choice: अपने क्रोध की तपिश
  rationale: חֵמָה में गर्मी और प्रचण्ड रोष दोनों के भाव हैं, जबकि אַף क्रोध को सूचित करता है; ‘क्रोध की तपिश’ आग के आगे आने वाले बिंब को भी बनाए रखती है।
- source_word: וֶעֱזוּז מִלְחָמָה
  choice: और युद्ध की प्रचण्डता
  rationale: עֱזוּז शक्ति, उग्रता या प्रचण्ड बल व्यक्त करता है। ‘युद्ध की प्रचण्डता’ इस अस्पष्टता को पर्याप्त रूप से सुरक्षित रखते हुए स्वाभाविक हिन्दी देती है।
- source_word: וַתְּלַהֲטֵהוּ
  choice: उसने उसे ... धधका दिया
  rationale: क्रिया ज्वाला भड़काने या धधका देने का सजीव भाव रखती है। हिन्दी में स्त्रीलिंग ‘प्रचण्डता’ इसके व्याकरणिक कर्ता के रूप में सहज है।
- source_word: מִסָּבִיב
  choice: चारों ओर से
  rationale: यह चारों तरफ से घिरे होने का अर्थ स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְלֹא יָדָע
  choice: फिर भी वह नहीं समझा
  rationale: ידע का मूल अर्थ ‘जानना’ है, पर यहाँ न्याय के अर्थ को पहचानने या समझने में विफलता अभिप्रेत है; ‘नहीं समझा’ संदर्भगत अर्थ को स्पष्ट करता है।
- source_word: וַתִּבְעַר בּוֹ
  choice: वह उसके भीतर जलती रही
  rationale: בער जलने या भस्म करने को व्यक्त करता है और בּוֹ का निकट अर्थ ‘उसमें/उसके भीतर’ है। स्त्रीलिंग ‘वह’ निकटवर्ती ‘प्रचण्डता’ की ओर स्वाभाविक संकेत करता है।
- source_word: וְלֹא יָשִׂים עַל לֵב
  choice: उसने इस बात पर ध्यान नहीं दिया
  rationale: शाब्दिक रूप ‘हृदय पर रखना’ है; मुहावरे का अर्थ बात को गंभीरता से ग्रहण करना या उस पर मन लगाना है। ‘ध्यान नहीं दिया’ सामान्य आधुनिक हिन्दी में यही भाव स्पष्ट करता है।
theological_decisions:
- issue: एकवचन सर्वनामों का संदर्भ
  choice: ‘उस/वह’ के एकवचन रूप बनाए रखे गए हैं और वे व्यक्ति के रूप में चित्रित इस्राएल/याकूब की प्रजा को सूचित करते हैं।
  alternative: समकालीन स्पष्टता के लिए ‘उन/वे’ बहुवचन करना।
  rationale: इब्रानी संदर्भ में सामूहिक प्रजा के लिए निरंतर एकवचन रूप हैं। एकवचन रखने से भविष्यद्वाणी का साहित्यिक मानवीकरण सुरक्षित रहता है।
- issue: न्याय-संबंधी क्रियाओं का कर्ता
  choice: आरम्भिक ‘उसने’ परमेश्वर की ओर संकेत करता है; बाद की स्त्रीलिंग क्रियाओं को निकटवर्ती ‘युद्ध की प्रचण्डता’ से जोड़ा गया है।
  alternative: पूरे वाक्य में परमेश्वर को स्पष्ट कर्ता बनाना, या क्रोध को ही प्रत्येक क्रिया का कर्ता बताना।
  rationale: इब्रानी में परमेश्वर के कार्य से उँडेले गए न्याय की सक्रिय शक्ति की ओर व्याकरणिक बदलाव आता है। हिन्दी स्त्रीलिंग रूप इस बदलाव को बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े स्वाभाविक ढंग से व्यक्त करते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘तपिश’, ‘प्रचण्डता’, ‘धधका’ और ‘जलती’ से मूल के क्रमिक अग्नि-बिंब सुरक्षित हैं। सामूहिक इस्राएल के लिए मूल का एकवचन बनाए रखा गया है, पर अनावश्यक व्याख्यात्मक नाम मुख्य पाठ में नहीं जोड़ा गया।
