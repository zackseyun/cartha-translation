  edition: WLC
  text: הֶחֱשֵׁ֨יתִי֙ מֵֽ/עוֹלָ֔ם אַחֲרִ֖ישׁ אֶתְאַפָּ֑ק כַּ/יּוֹלֵדָ֣ה אֶפְעֶ֔ה אֶשֹּׁ֥ם וְ/אֶשְׁאַ֖ף יָֽחַד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/014.yaml
  text: I have kept silent from long ago[a]; I have been quiet and restrained myself. Like a woman in labor I will cry out[b]; I will gasp and pant together.
translation:
  language: hi
  text: मैं बहुत समय से चुप रहा हूँ[a]; मैं शांत रहा हूँ और मैंने अपने को रोके रखा है। जैसे प्रसव करती स्त्री, मैं चिल्लाऊँगा; मैं हाँफूँगा और एक साथ तेज़ साँसें लूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहुत पहले से” अथवा “प्राचीन काल से।”
    reason: lexical_alternative
  - marker: b
    text: 'अंतिम वाक्यांश का अनुवाद यह भी हो सकता है: “मैं एकाएक हाँफूँगा और तेज़ साँसें लूँगा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱשֵׁיתִי
  choice: मैं ... चुप रहा हूँ
  rationale: हिफ़िल रूप यहाँ वक्ता के अपने को मौन रखने को व्यक्त करता है। हिन्दी का पूर्ण वर्तमान लंबे समय से चली आ रही अवस्था को स्वाभाविक ढंग से दर्शाता है।
- source_word: מֵעוֹלָם
  choice: बहुत समय से
  rationale: संदर्भ में यह निरपेक्ष अनन्तता नहीं, बल्कि बीते हुए लंबे समय को सूचित करता है। यह आधुनिक हिन्दी में स्वाभाविक है; अन्य संभव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: אַחֲרִישׁ
  choice: मैं शांत रहा
  rationale: यह मौन या शांत रहने के अर्थ-क्षेत्र का शब्द है। पहले पद के ‘चुप’ की अनावश्यक पुनरावृत्ति से बचते हुए समानांतरता सुरक्षित रखी गई है।
- source_word: אֶתְאַפָּק
  choice: अपने आपको रोके रहा हूँ
  rationale: हित्पएल रूप आत्म-संयम या अपने को पीछे रोके रखने का भाव देता है।
- source_word: כַּיּוֹלֵדָה
  choice: प्रसव-पीड़ा में पड़ी स्त्री के समान
  rationale: मूल उपमा प्रसव कर रही स्त्री की है। यह अभिव्यक्ति आधुनिक हिन्दी में स्पष्ट है और प्रसव की तीव्रता को बनाए रखती है।
- source_word: אֶפְעֶה
  choice: मैं चिल्ला उठूँगा
  rationale: क्रिया पीड़ा में ऊँची आवाज़ निकालने को व्यक्त करती है। ‘चिल्ला उठूँगा’ आगामी अचानक और तीव्र क्रिया का भाव भी देता है।
- source_word: אֶשֹּׁם
  choice: मैं हाँफूँगा
  rationale: प्रसव और श्वास के निकट संदर्भ में हाँफने का अर्थ सबसे उपयुक्त है।
- source_word: וְאֶשְׁאַף
  choice: और ... तेज़ साँसें लूँगा
  rationale: यह क्रिया साँस खींचने या हाँफने का भाव रखती है। यह चयन पहली श्वास-क्रिया से भेद रखते हुए चित्र की तीव्रता बनाए रखता है।
- source_word: יָחַד
  choice: एक ही साथ
  rationale: यह दोनों श्वास-क्रियाओं की समकालिकता बताता है; प्रसंग में ‘एकाएक’ का भाव भी संभव है।
theological_decisions:
- issue: परमेश्वर का प्रसव करती स्त्री की उपमा से अपना वर्णन करना
  choice: ‘प्रसव-पीड़ा में पड़ी स्त्री के समान’ उपमा को बिना नरम किए बनाए रखा गया है।
  alternative: इसे तीव्र पुकार की सामान्य छवि से बदलना या केवल व्याख्या में रूपक मानना।
  rationale: इब्रानी पाठ वक्ता की रोकी गई तीव्रता और आसन्न क्रिया की तुलना स्पष्ट रूप से प्रसव करती स्त्री से करता है। उपमा को सुरक्षित रखना पाठ के धर्मवैचारिक तनाव और चित्रात्मक बल दोनों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘प्रसव-पीड़ा’ मूल उपमा की तीव्रता को स्पष्ट करती है, और अंतिम दो क्रियाओं में श्वास की बढ़ती हुई बेचैनी को स्वाभाविक हिन्दी में व्यक्त किया गया है।
