base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/020.yaml
  text: You have seen many things[a], but you do not observe; his ears are open, but he does not hear.
translation:
  language: hi
  text: तूने बहुत-सी बातें देखी हैं[a], पर तू उन पर ध्यान नहीं देता; उसके कान खुले हैं, पर वह सुनता नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में पद के पहले भाग में ‘तू’ है, लेकिन दूसरे भाग में बात ‘उसके/वह’ के रूप में कही गई है। कुछ अनुवाद इसे एकरूप करके ‘तेरे/तू’ कर देते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ראית
  choice: तूने ... देखी हैं
  rationale: ראה का काल रूप पूर्ण 2 पुल्लिंग एकवचन है। ‘देखी हैं’ पूर्ण पक्ष को बनाए रखते हुए वर्तमान भर्त्सना के संदर्भ में स्वाभाविक है।
- source_word: רַבּוֹת
  choice: बहुत-सी बातें
  rationale: स्त्रीलिंग बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है; हिन्दी में ‘बहुत-सी बातें’ इसका स्वाभाविक समतुल्य है।
- source_word: וְלֹא תִשְׁמֹר
  choice: पर तू उन पर ध्यान नहीं देता
  rationale: שׁמר का मूल अर्थ रखना, रक्षा करना या ध्यानपूर्वक देखना है। देखने के बावजूद उचित ध्यान न देने के इस संदर्भ में यह अभिव्यक्ति अर्थ को स्पष्ट और सहज रखती है; ‘उन पर’ हिन्दी में अपेक्षित कर्म को स्पष्ट करता है।
- source_word: פָּקוֹחַ אָזְנַיִם
  choice: उसके कान खुले हैं
  rationale: פָּקוֹחַ कानों की खुली हुई अवस्था बताता है। हिन्दी में बहुवचन ‘कान’ के साथ ‘खुले हैं’ स्वाभाविक है; ‘उसके’ अगले तीसरे पुरुष के क्रियारूप को व्यक्त करता है।
- source_word: וְלֹא יִשְׁמָע
  choice: पर वह सुनता नहीं
  rationale: שמע का अपूर्ण 3 पुल्लिंग एकवचन रूप है। सामान्य वर्तमान ‘सुनता नहीं’ कान खुले होने के साथ संवेदनात्मक विरोध को बनाए रखता है।
theological_decisions:
- issue: पद के भीतर व्याकरणिक पुरुष का परिवर्तन
  choice: पहले भाग में दूसरे पुरुष एकवचन ‘तू’ और दूसरे भाग में तीसरे पुरुष ‘उसके/वह’ को बनाए रखा गया है।
  alternative: 'पूरे पद को दूसरे पुरुष में करना: ‘तेरे कान खुले हैं, पर तू सुनता नहीं।’'
  rationale: मसोरेटिक इब्रानी पाठ में यह वास्तविक पुरुष-परिवर्तन है। इसे समतल करने के बजाय बनाए रखना पाठ की आलंकारिक असंगति और तनाव के प्रति निष्ठावान है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली। एकवचन ‘तू’ मूल पाठ के सीधे, एकवचन संबोधन और भविष्यद्वक्ताई भर्त्सना को स्पष्ट करता है।
