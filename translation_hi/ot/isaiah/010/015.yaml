source:
  edition: WLC
  text: הֲ/יִתְפָּאֵר֙ הַ/גַּרְזֶ֔ן עַ֖ל הַ/חֹצֵ֣ב בּ֑/וֹ אִם יִתְגַּדֵּ֤ל הַ/מַּשּׂוֹר֙ עַל מְנִיפ֔/וֹ כְּ/הָנִ֥יף שֵׁ֨בֶט֙ וְ/אֶת מְרִימָ֔י/ו כְּ/הָרִ֥ים מַטֶּ֖ה לֹא עֵֽץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/015.yaml
  text: Does the axe boast over the one who chops with it? Or does the saw magnify itself over the one who wields it? As if a rod were to wield the one who lifts it up[a], or as if a staff were to lift up one who is not wood!
translation:
  language: hi
  text: क्या कुल्हाड़ा उस पर डींग मारेगा जो उससे काटता है? क्या आरी उसे चलानेवाले से अपने को बड़ा ठहराएगी? यह तो ऐसा होगा मानो छड़ी अपने उठानेवालों को चलाए,[a] या डंडा उसे उठा ले जो लकड़ी नहीं है!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी का अंतिम तुलनात्मक वाक्यांश संक्षिप्त और कुछ अस्पष्ट है। अधिक शाब्दिक रूप: “मानो छड़ी अपने उठानेवालों को चलाए, या मानो डंडा उस वस्तु को उठाए जो लकड़ी नहीं है।” अंतिम शब्दों का अर्थ “जो लकड़ी नहीं है” अथवा “जो वस्तु लकड़ी नहीं है” भी हो सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: יִתְפָּאֵר
  choice: घमंड करेगा
  rationale: हित्पएल रूप आत्म-प्रशंसा या अपने को ऊँचा करने का भाव देता है; आधुनिक हिन्दी में ‘घमंड करना’ स्वाभाविक है।
- source_word: הַגַּרְזֶן
  choice: कुल्हाड़ा
  rationale: काटने के इस औज़ार का मानक और सर्वसुलभ हिन्दी पर्याय।
- source_word: הַחֹצֵב בּוֹ
  choice: जो उससे काटता है
  rationale: कृदंत व्यक्ति को और בּוֹ साधन के अर्थ को व्यक्त करता है; वाक्य सहज भी रहता है।
- source_word: יִתְגַּדֵּל
  choice: अपने को बड़ा ठहराएगी
  rationale: आत्म-महिमा या आत्मोन्नति का भाव रखते हुए पहले प्रश्न के समानांतर अभिव्यक्ति देता है।
- source_word: הַמַּשּׂוֹר
  choice: आरी
  rationale: औज़ार के लिए सीधा और प्रचलित हिन्दी शब्द।
- source_word: מְנִיפוֹ
  choice: उसे चलाने वाले
  rationale: नוף/הניף के लहराने अथवा चलाने के भाव को आरी के संदर्भ में स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כְּהָנִיף שֵׁבֶט
  choice: मानो छड़ी उसे ही चलाए
  rationale: कठिन और संक्षिप्त इब्रानी में कर्ता-करण का उलटाव मुख्य चित्र है; हिन्दी में क्रियात्मक रूप उस असंगति को स्पष्ट रखता है।
- source_word: שֵׁבֶט
  choice: छड़ी
  rationale: מַטֶּה से शब्दगत भेद बनाए रखते हुए हाथ में उठाए जाने वाले साधन का अर्थ देता है।
- source_word: מְרִימָיו
  choice: जो उसे उठाता है
  rationale: रूपात्मक बहुवचन के बावजूद प्रसंग का सामान्य एकवचन कर्ता हिन्दी में सहज है और आसपास के एकवचन चित्र से मेल खाता है।
- source_word: כְּהָרִים מַטֶּה
  choice: या डंडा उसे उठा ले
  rationale: दूसरे उलटे चित्र को पहले के समानांतर, स्वाभाविक हिन्दी में रखता है।
- source_word: מַטֶּה
  choice: डंडा
  rationale: שֵׁבֶט के लिए प्रयुक्त ‘छड़ी’ से भेद रखते हुए निकट अर्थक्षेत्र सुरक्षित रखता है।
- source_word: לֹא עֵץ
  choice: जो लकड़ी नहीं है
  rationale: इब्रानी की संक्षिप्तता और विडंबना को निकटता से रखता है; वैकल्पिक व्याकरणिक समझ को पाद-टिप्पणी में बताया गया है।
theological_decisions:
- issue: अंतिम संक्षिप्त वाक्यांश לֹא עֵץ की व्याख्या
  choice: ‘जो लकड़ी नहीं है’ को डंडे द्वारा उठाए जाने वाले जीवित, मानवीय कर्ता के रूप में समझना
  alternative: ‘जो वस्तु लकड़ी नहीं है’; अथवा ‘ऐसा डंडा जो लकड़ी का नहीं है’
  rationale: पूरे पद में औज़ार और उसे चलाने वाले की भूमिकाएँ उलटने की असंगति दिखाई गई है। मुख्य पाठ उस अलंकार को बनाए रखता है, जबकि इब्रानी की वास्तविक अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘कुल्हाड़ा/आरी’ और ‘छड़ी/डंडा’ से काव्यात्मक समानांतरता तथा दोनों इब्रानी औज़ार-शब्दों का भेद रखा गया है। अलंकारिक प्रश्नों और उलटी कर्तृता की विडंबना को स्पष्ट किया गया है, पर अंतिम वाक्यांश की अस्पष्टता पाद-टिप्पणी में सुरक्षित रखी गई है।
