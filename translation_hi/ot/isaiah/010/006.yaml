base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/006.yaml
  text: Against a godless nation I send him[a], and against the people of my wrath I command him, to seize spoil and to carry off plunder[c][b], and to make it a trampling place like the mud of the streets.
translation:
  language: hi
  text: एक भक्तिहीन जाति के विरुद्ध मैं उसे भेजता हूँ[a], और उस प्रजा के विरुद्ध जिस पर मेरा कोप है, मैं उसे आज्ञा देता हूँ कि वह लूट का माल ले और संपत्ति लूटे[b], और उसे गलियों की कीचड़ के समान रौंदने की वस्तु बना दे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अधर्मी जाति’। इब्रानी विशेषण का अर्थ भक्तिहीन, अपवित्र या धर्मविरुद्ध हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘लूट का माल लेना’ और ‘संपत्ति लूटना’ जैसे सजातीय शब्द-प्रयोग हैं, जो लूट के कार्य पर बल देते हैं।
    reason: lexical_alternative
  - marker: c
    text: ‘उसे’ के लिए इब्रानी प्रत्यय पुल्लिंग एकवचन है और लक्षित जाति या प्रजा को एक सामूहिक इकाई के रूप में प्रस्तुत करता है। मִרְמָס का अर्थ ‘रौंदी जाने वाली वस्तु’ या ‘रौंदने का स्थान’ भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: גּוֹי חָנֵף
  choice: भक्तिहीन जाति
  rationale: גּוֹי राजनीतिक-सामूहिक अर्थ में ‘जाति’ है, और חָנֵף यहाँ केवल कपट नहीं बल्कि परमेश्वर के प्रति अधर्म या भक्तिहीनता का बोध कराता है।
- source_word: אֲשַׁלְּחֶנּוּ
  choice: मैं उसे भेजता हूँ
  rationale: प्रथम पुरुष अपूर्ण क्रिया को भविष्यसूचक वाणी की सजीव वर्तमान शैली में रखा गया है; पुल्लिंग एकवचन प्रत्यय ‘उसे’ से सुरक्षित है।
- source_word: עַם עֶבְרָתִי
  choice: उस प्रजा के विरुद्ध जिस पर मेरा कोप है
  rationale: עַם को ‘प्रजा’ देकर גּוֹי से उसका शब्दगत भेद रखा गया है। संबंधसूचक इब्रानी पदबंध को स्वाभाविक हिन्दी में व्यक्त करते हुए परमेश्वर के कोप का सीधा न्याय-संबंधी बल बनाए रखा गया है।
- source_word: אֲצַוֶּנּוּ
  choice: मैं उसे आज्ञा देता हूँ
  rationale: צוה का सीधा अर्थ ‘आज्ञा देना’ है और यह न्याय के साधन पर परमेश्वर के अधिकार को स्पष्ट रखता है।
- source_word: לִשְׁלֹל שָׁלָל וְלָבֹז בַּז
  choice: खूब लूट मचाए और लूट का माल छीन ले
  rationale: दोनों धातु-सजातीय संज्ञा-प्रयोग लूट की तीव्रता और समानांतरता प्रकट करते हैं। ‘खूब’ पहले प्रयोग की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि दूसरा वाक्यांश माल छीन ले जाने का भाव रखता है।
- source_word: וּלְשִׂימוֹ מִרְמָס
  choice: उसे ऐसा बना दे कि वह ... पैरों तले रौंदी जाए
  rationale: पुल्लिंग एकवचन प्रत्यय को सामूहिक जाति/प्रजा के लिए ‘उसे’ से सुरक्षित रखा गया है; מִרְמָס का पैरों तले रौंदे जाने का परिणाम सहज हिन्दी में व्यक्त हुआ है।
- source_word: כְּחֹמֶר חוּצוֹת
  choice: गलियों की कीचड़ के समान
  rationale: חֹמֶר यहाँ गीली मिट्टी या कीचड़ है और חוּצוֹת नगर के खुले मार्गों या गलियों को सूचित करता है; यह रूपक हिन्दी में सजीव और सुबोध है।
theological_decisions:
- issue: ‘उसे’ का संदर्भ
  choice: ‘उसे’ अश्शूर के राजा अथवा अश्शूर रूपी न्याय-साधन के पुल्लिंग एकवचन संदर्भ को बनाए रखता है।
  alternative: इसे सामूहिक रूप से केवल ‘अश्शूर’ मानकर बहुवचन में व्यक्त करना।
  rationale: पद 5 का निकट संदर्भ अश्शूर को परमेश्वर के कोप की छड़ी बताता है, जबकि इब्रानी प्रत्यय पुल्लिंग एकवचन है। हिन्दी ‘उसे’ व्यक्तिगत और सामूहिक दोनों संबद्धताओं को संदर्भ के लिए खुला रखता है।
- issue: परमेश्वर का कोप
  choice: ‘मेरा कोप’ का स्पष्ट प्रथम-पुरुष न्याय-संबंधी कथन सुरक्षित रखा गया है।
  alternative: इसे नरम करके केवल ‘जिनसे मैं क्रोधित हूँ’ कहना।
  rationale: עֶבְרָתִי स्पष्ट रूप से परमेश्वर के कोप को व्यक्त करता है; अनुवाद इस कठिन धर्मवैज्ञानिक तनाव को कम नहीं करता।
- issue: रौंदे जाने वाली इकाई
  choice: एकवचन ‘उसे’ द्वारा लक्षित जाति/प्रजा को सामूहिक इकाई माना गया है।
  alternative: बहुवचन ‘उन्हें’ द्वारा व्यक्तियों पर बल देना।
  rationale: וּלְשִׂימוֹ में पुल्लिंग एकवचन प्रत्यय है, इसलिए सामूहिक एकवचन को सुरक्षित रखना स्रोत के अधिक निकट है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘कोप’, ‘प्रजा’ और ‘आज्ञा’ गरिमापूर्ण बाइबलीय स्वर रखते हैं, पर वाक्यरचना सामान्य पाठक के लिए सहज है। ‘गलियों की कीचड़’ मूल रूपक को ठोस और वर्तमान हिन्दी में स्वाभाविक रखता है।
