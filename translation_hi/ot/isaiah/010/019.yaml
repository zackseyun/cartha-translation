  yaml_path: translation/ot/isaiah/010/019.yaml
  text: And the remaining trees of his forest will be few in number[b][a], and a boy can write them down.
translation:
  language: hi
  text: और उसके वन के बचे हुए पेड़ गिनती में थोड़े ही होंगे,[a] और एक लड़का[b] उन्हें लिख सकेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके वन के बचे हुए पेड़ गिने जा सकने लायक होंगे, और एक लड़का उन्हें लिखेगा।” इब्रानी में “संख्या” का प्रयोग मुहावरे के रूप में इतनी कम संख्या के लिए हुआ है कि उसे गिना जा सके।
    reason: lexical_alternative
  - marker: b
    text: “लड़का” का अनुवाद करने वाला इब्रानी शब्द (नाअर) संदर्भ के अनुसार “किशोर” या “युवक” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר
  choice: और ... बचे हुए
  rationale: שְׁאָר का अर्थ बचा हुआ भाग है। यहाँ संदर्भ वन के पेड़ों का है, इसलिए ‘बचे हुए’ स्वाभाविक है और ‘शेष’ के संभावित पारिभाषिक धार्मिक अर्थ से बचता है।
- source_word: עֵץ יַעְרוֹ
  choice: उसके वन में ... पेड़
  rationale: עֵץ रूप में एकवचन होते हुए भी यहाँ सामूहिक अर्थ में वन के पेड़ों को दर्शाता है। प्रत्यय 3 पुं. एक. है, जिसे ‘उसके’ से बनाए रखा गया है।
- source_word: מִסְפָּר יִהְיוּ
  choice: गिनती में थोड़े ही होंगे
  rationale: शाब्दिक रूप से ‘संख्या होंगे’; यह मुहावरा इतनी कम संख्या बताता है कि उन्हें गिना जा सके। ‘गिनती में थोड़े’ स्रोत की गणनीयता और अल्पता दोनों रखता है।
- source_word: נַעַר
  choice: लड़का
  rationale: נַעַר का अर्थ संदर्भानुसार लड़का, किशोर या युवक हो सकता है। यहाँ ‘लड़का’ उस चित्र को स्पष्ट रखता है कि बचे पेड़ इतने कम होंगे कि कम आयु वाला भी उन्हें दर्ज कर सकेगा।
- source_word: יִכְתְּבֵם
  choice: उन्हें लिख सकेगा
  rationale: शाब्दिक अर्थ ‘उन्हें लिखेगा’ है; प्रसंग में भाव उनकी छोटी संख्या के कारण उन्हें आसानी से दर्ज कर सकने का है। ‘लिख सकेगा’ यह निहित सामर्थ्य स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘शेष’ शब्द के संभावित धार्मिक-पारिभाषिक अर्थ
  choice: पेड़ों के लिए ‘बचे हुए’
  alternative: ‘उसके वन के शेष पेड़’
  rationale: यहाँ प्रत्यक्ष बिंब नष्ट किए गए वन का है; ‘बचे हुए’ मूल अर्थ रखता है, पर किसी विशिष्ट ‘शेष जन’ सिद्धांत को पेड़ों पर आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और दृश्यात्मक शैली। ‘वन’ काव्यात्मक-भविष्यद्वाणीपरक प्रसंग के अनुकूल है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सहज रखा गया है।
