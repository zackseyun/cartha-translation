reference: Isaiah 10:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יָס֤וּר סֻבֳּל/וֹ֙ מֵ/עַ֣ל שִׁכְמֶ֔/ךָ וְ/עֻלּ֖/וֹ מֵ/עַ֣ל צַוָּארֶ֑/ךָ וְ/חֻבַּ֥ל עֹ֖ל מִ/פְּנֵי שָֽׁמֶן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/027.yaml
  text: And in that day his burden will depart from your shoulder[a], and his yoke from your neck; and the yoke will be broken because of fatness.
translation:
  language: hi
  text: उस दिन ऐसा होगा कि उसका बोझ तेरे कंधे पर से हट जाएगा और उसका जुआ तेरी गर्दन पर से उतर जाएगा; चर्बी के कारण[a] वह जुआ टूट जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “तेल के कारण”; परंपरागत अनुवाद: “अभिषेक के कारण।”'
    reason: कठिन इब्रानी पदबंध के वैकल्पिक अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: उस दिन ऐसा होगा कि
  rationale: भविष्यसूचक काल-सूत्र को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יָסוּר סֻבֳּלוֹ מֵעַל שִׁכְמֶךָ
  choice: उसका बोझ तेरे कंधे पर से हट जाएगा
  rationale: יָסוּר के हटने के भाव और कंधे पर रखे दमनकारी बोझ की देहगत छवि, दोनों को बनाए रखता है।
- source_word: וְעֻלּוֹ מֵעַל צַוָּארֶךָ
  choice: और उसका जुआ तेरी गर्दन पर से उतर जाएगा
  rationale: दासता और प्रभुत्व के कृषि-रूपक को ‘जुआ’ द्वारा सुरक्षित रखता है; ‘उतर जाएगा’ हिन्दी में गर्दन से हटाए जाने की स्वाभाविक अभिव्यक्ति है।
- source_word: וְחֻבַּל עֹל
  choice: वह जुआ टूट जाएगा
  rationale: निष्क्रिय क्रिया के विनाशकारी भाव को जुए की ठोस छवि के अनुरूप ‘टूट जाएगा’ से व्यक्त किया गया है।
- source_word: מִפְּנֵי שָׁמֶן
  choice: पुष्टता के कारण
  rationale: कठिन इब्रानी पदबंध में שָׁמֶן के मूल ‘चर्बी/पुष्टता’ संबंधी अर्थ को सुरक्षित रखता है और बिना आधार ‘अभिषेक’ को मुख्य पाठ में नहीं लाता।
theological_decisions:
- issue: מִפְּנֵי שָׁמֶן की व्याख्या
  choice: पुष्टता के कारण
  alternative: तेल के कारण; परंपरागत रूप से ‘अभिषेक के कारण’
  rationale: इब्रानी शब्द का सामान्य अर्थ चर्बी, पुष्टता या तेल है। निकटवर्ती संदर्भ किसी अभिषेक-विधि या अभिषिक्त व्यक्ति का स्पष्ट उल्लेख नहीं करता, इसलिए मुख्य पाठ अपेक्षाकृत शाब्दिक और खुला रखा गया है तथा अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज भविष्यसूचक शैली। एकवचन सम्बोधन ‘तेरे’ द्वारा मूल इब्रानी के एकवचन रूप को बनाए रखा गया है। अंतिम कठिन रूपक को स्पष्ट करने के बजाय उसकी वास्तविक अर्थगत अस्पष्टता सुरक्षित रखी गई है।
