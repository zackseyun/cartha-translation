review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the future setting, the singular second-person imagery, the oppressor's burden and yoke, and the passive breaking of the yoke. The difficult phrase מִפְּנֵי שָׁמֶן is appropriately retained as causal and not doctrinally expanded in the main text.
  naturalness: The sentence is clear and has a suitably elevated prophetic register. However, ‘पुष्टता’ is abstract and does not naturally convey the concrete fat/oil imagery of שָׁמֶן. ‘चर्बी’ preserves that image more directly while leaving the difficult metaphor unexplained.
  terminology: ‘बोझ’ and ‘जुआ’ are accurate, natural equivalents. ‘तेरे’ and ‘तेरी’ appropriately retain the Hebrew singular addressee in a dignified register. The footnote responsibly records ‘तेल’ and the traditional ‘अभिषेक’ rendering without presenting the latter as the required sense.
  issues:
  - severity: low
    issue: ‘पुष्टता’ for שָׁמֶן is overly abstract.
    rationale: שָׁמֶן fundamentally denotes fatness/oil. ‘पुष्टता’ can suggest general health or strength and weakens the deliberately concrete, difficult Hebrew image. ‘चर्बी’ is more lexically transparent and preserves the ambiguity that the footnote addresses.
  revised_text: उस दिन ऐसा होगा कि उसका बोझ तेरे कंधे पर से हट जाएगा और उसका जुआ तेरी गर्दन पर से उतर जाएगा; चर्बी के कारण[a] वह जुआ टूट जाएगा।
