- from: उस दिन ऐसा होगा कि उसका बोझ तेरे कंधे पर से हट जाएगा और उसका जुआ तेरी गर्दन पर से उतर जाएगा; पुष्टता के कारण[a] वह जुआ टूट जाएगा।
