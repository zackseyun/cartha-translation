base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/017.yaml
  text: And the light of Israel will become a fire[a], and his Holy One a flame[c][b]; it will burn and consume his thorns and his briers in a single day.
translation:
  language: hi
  text: और इस्राएल की ज्योति आग बन जाएगी[a], और उसका पवित्र ज्वाला बन जाएगा[b]; वह धधक उठेगी और उसके काँटों और कँटीली झाड़ियों[c] को एक ही दिन में भस्म कर देगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आग होगी’; इब्रानी रचना यहाँ आग बन जाने का भाव भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: ‘उसका पवित्र’ सम्भवतः इस्राएल के परमेश्वर की उपाधि है; यशायाह में यह एक प्रमुख विषय है।
    reason: cross_reference
  - marker: c
    text: ‘काँटों’ और ‘कँटीली झाड़ियों’ के लिए प्रयुक्त इब्रानी शब्द कँटीली वनस्पति को सूचित करते हैं; पहला शब्द अपेक्षाकृत दुर्लभ है और उसका अर्थ व्यापक रूप से ‘झाड़-झंखाड़’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: बन जाएगी
  rationale: היה के साथ לְ परिणाम या नई अवस्था का भाव देता है; इसलिए केवल ‘होगी’ की अपेक्षा ‘बन जाएगी’ अधिक उपयुक्त है।
- source_word: אוֹר יִשְׂרָאֵל
  choice: इस्राएल की ज्योति
  rationale: मूल रूपक को बिना व्याख्यात्मक विस्तार के स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: לְאֵשׁ
  choice: आग
  rationale: आग बनने के परिणामसूचक भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: וּקְדוֹשׁוֹ
  choice: उसका पवित्र जन
  rationale: इब्रानी पद की व्यक्तिवाचक और उपाधिसूचक प्रकृति बनाए रखता है, जबकि मुख्य पाठ में उसके अभिप्राय को स्पष्टतः निर्धारित नहीं करता।
- source_word: לְלֶהָבָה
  choice: ज्वाला
  rationale: ‘आग’ के साथ काव्यात्मक समानांतरता को संक्षिप्त और स्वाभाविक रूप में बनाए रखता है।
- source_word: וּבָעֲרָה
  choice: वह धधक उठेगी
  rationale: स्त्रीलिंग क्रिया आग/ज्वाला की छवि से मेल खाती है; भविष्यसूचक क्रम और प्रज्वलन की तीव्रता दोनों व्यक्त होते हैं।
- source_word: וְאָכְלָה
  choice: भस्म कर देगी
  rationale: आग द्वारा पूरी तरह नष्ट किए जाने के रूपक को आधुनिक हिन्दी में सजीव और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שִׁיתוֹ
  choice: उसके काँटों
  rationale: दुर्लभ शब्द को उसके कँटीली वनस्पति-संदर्भ में स्पष्ट रखते हुए पारंपरिक अर्थ सुरक्षित करता है।
- source_word: וּשְׁמִירוֹ
  choice: कँटीली झाड़ियों
  rationale: पहले शब्द से भिन्न समानांतर वनस्पति-चित्र को बनाए रखता है और सामान्य पाठक के लिए स्पष्ट है।
- source_word: בְּיוֹם אֶחָד
  choice: एक ही दिन में
  rationale: अचानक और पूर्ण विनाश पर मूल बल को स्वाभाविक हिन्दी में प्रकट करता है।
theological_decisions:
- issue: ‘इस्राएल की ज्योति’ और ‘उसका पवित्र जन’ का अभिप्राय
  choice: मुख्य पाठ में रूपक और उपाधि को बनाए रखना, तथा पादटिप्पणी में सम्भावित दिव्य अभिप्राय बताना
  alternative: मुख्य पाठ में सीधे ‘यहोवा’ या ‘परमेश्वर’ लिखना
  rationale: यशायाह में यह भाषा प्रबल रूप से इस्राएल के परमेश्वर की ओर संकेत करती है, पर पद स्वयं काव्यात्मक उपाधियों का प्रयोग करता है; अनुवाद इस तनाव को अनावश्यक रूप से नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘ज्योति—आग’ तथा ‘पवित्र जन—ज्वाला’ की समानांतर रचना और विनाश की आकस्मिकता सुरक्षित रखी गई है।
