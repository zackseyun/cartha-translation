id: ISA.10.34
reference: Isaiah 10:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נִקַּ֛ף סִֽבְכֵ֥י הַ/יַּ֖עַר בַּ/בַּרְזֶ֑ל וְ/הַ/לְּבָנ֖וֹן בְּ/אַדִּ֥יר יִפּֽוֹל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/034.yaml
  text: And the thickets of the forest will be cut down with iron[a], and Lebanon will fall by a mighty one.
translation:
  language: hi
  text: और वन के घने झुरमुट लोहे से काट डाले जाएँगे, और लबानोन एक बलशाली के हाथ से गिर पड़ेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लबानोन उस सामर्थी के हाथ से गिर पड़ेगा,” जहाँ “सामर्थी” को परमेश्वर की उपाधि समझा गया है।
    reason: 'वैकल्पिक पाठ: संदर्भ परमेश्वर के न्याय की ओर संकेत कर सकता है, किंतु इब्रानी पदबंध स्वयं कर्ता को स्पष्ट रूप से परमेश्वर नहीं कहता।'
lexical_decisions:
- source_word: וְנִקַּף
  choice: काट डाली जाएँगी
  rationale: यहाँ क्रिया वन की उलझी और घनी वनस्पति को गिराए जाने का चित्र देती है। निष्क्रिय प्रयोग को स्वाभाविक हिन्दी में व्यक्त किया गया है और वृक्ष काटने की समानांतर छवि बनाए रखी गई है।
- source_word: סִבְכֵי
  choice: घनी झाड़ियाँ
  rationale: यह शब्द उलझी हुई वनस्पति, झुरमुट या आपस में गुंथी डालियों को सूचित करता है। ‘घनी झाड़ियाँ’ सामान्य पाठक के लिए स्पष्ट है और केवल ऊपरी डालियों तक अर्थ को सीमित नहीं करता।
- source_word: הַיַּעַר
  choice: वन
  rationale: यह ‘जंगल’ या ‘वन’ का सामान्य शब्द है। काव्यात्मक और गरिमापूर्ण शैली में ‘वन’ उपयुक्त है।
- source_word: בַּבַּרְזֶל
  choice: लोहे से
  rationale: इब्रानी में अक्षरशः ‘लोहे से’ है, जहाँ लोहा संभवतः लोहे के औज़ार का लक्षणार्थक उल्लेख है। किसी विशेष औज़ार, जैसे कुल्हाड़ी, को पाठ में जोड़े बिना मूल बिंब सुरक्षित रखा गया है।
- source_word: וְהַלְּבָנוֹן
  choice: और लबानोन
  rationale: स्थान-नाम को ज्यों का त्यों रखा गया है, जिससे पर्वतीय क्षेत्र, प्रसिद्ध देवदारु-वन और उसकी प्रतीकात्मक भव्यता—इन संभावनाओं को खुला रखा जा सके।
- source_word: בְּאַדִּיר
  choice: एक बलशाली के हाथ से
  rationale: אַדִּיר का अर्थ बलशाली, सामर्थी या प्रतापी हो सकता है। ‘के हाथ से’ साधन अथवा कर्ता बताने वाले בְּ को स्वाभाविक हिन्दी में व्यक्त करता है। ‘एक बलशाली’ मूल की अनिश्चितता को बनाए रखता है और उसे मुख्य पाठ में स्पष्ट रूप से परमेश्वर की उपाधि नहीं बनाता।
- source_word: יִפּוֹל
  choice: गिर पड़ेगा
  rationale: मूल क्रिया का सीधा अर्थ ‘गिरना’ है। ‘गिर पड़ेगा’ काव्यात्मक आघात को व्यक्त करता है, पर ‘काट गिराया जाएगा’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
theological_decisions:
- issue: क्या אַדִּיר को परमेश्वर की स्पष्ट उपाधि के रूप में प्रस्तुत किया जाए
  choice: एक बलशाली के हाथ से
  alternative: सामर्थी अर्थात परमेश्वर के हाथ से
  rationale: संदर्भ में न्याय करने वाला परमेश्वर समझा जा सकता है, लेकिन इस पद में न तो परमेश्वर का नाम आया है, न ही अभिव्यक्ति अपने आप में निर्विवाद दिव्य उपाधि है। इसलिए मुख्य पाठ अस्पष्टता बनाए रखता है और संभावित दिव्य संदर्भ को पादटिप्पणी में बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। ‘लोहे से’ मूल रूपक को सुरक्षित रखता है; ‘एक बलशाली’ जानबूझकर उस धार्मिक अस्पष्टता को बनाए रखता है जिसे पादटिप्पणी स्पष्ट करती है।
