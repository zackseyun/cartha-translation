base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/002.yaml
  text: to turn aside the poor from justice[a], and to rob the afflicted of my people of their right, so that widows may become their spoil[b], and they may plunder the fatherless.
translation:
  language: hi
  text: गरीबों को न्याय से वंचित करने और मेरी प्रजा के पीड़ितों[a] का अधिकार छीनने के लिए, ताकि वे विधवाओं को अपनी लूट बना लें और पितृहीनों[b] को लूटें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी प्रजा के गरीबों।” इब्रानी शब्द गरीबी, दुःख या उत्पीड़न की दशा को व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अनाथों।” शाब्दिक अर्थ “पितृहीनों” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַטּוֹת מִדִּין
  choice: न्याय से वंचित करने
  rationale: נטה का हिफ़ील रूप यहाँ न्याय को किसी से दूर मोड़ देने, अर्थात उसे न्याय न मिलने देने का भाव रखता है। हिंदी में ‘न्याय से वंचित करना’ कानूनी-सामाजिक संदर्भ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: דַּלִּים
  choice: गरीबों
  rationale: דַּל आर्थिक रूप से गरीब या सामाजिक रूप से दुर्बल व्यक्ति को दर्शा सकता है; इस संदर्भ में ‘गरीबों’ सीधा और सहज है।
- source_word: וְלִגְזֹל מִשְׁפַּט
  choice: अधिकार छीनने
  rationale: גזל अन्यायपूर्वक या बल से छीनने को और מִשְׁפָּט यहाँ किसी के न्यायसंगत कानूनी हक़ को दर्शाता है। ‘अधिकार छीनना’ दोनों का संयुक्त अर्थ स्पष्ट करता है।
- source_word: עֲנִיֵּי עַמִּי
  choice: मेरी प्रजा के पीड़ितों
  rationale: עָנִי गरीबी, दुःख और उत्पीड़न—इन परस्पर जुड़े भावों को व्यक्त कर सकता है। ‘पीड़ितों’ संदर्भ का उत्पीड़न उभारता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है; עַמִּי का प्रथम पुरुष प्रत्यय ‘मेरी प्रजा’ के रूप में सुरक्षित है।
- source_word: לִהְיוֹת
  choice: ताकि ... बन जाएँ
  rationale: यह infinitive यहाँ उद्देश्य अथवा परिणाम का संबंध व्यक्त करता है; ‘ताकि’ उस संबंध को स्वाभाविक हिंदी में बनाए रखता है और उसकी संभावित उद्देश्य-परिणाम अस्पष्टता को पूरी तरह बंद नहीं करता।
- source_word: אַלְמָנוֹת שְׁלָלָם
  choice: विधवाएँ उनकी लूट बन जाएँ
  rationale: שָׁלָל युद्ध या हिंसक छापे में हथियाई गई लूट को दर्शाता है। यह अनुवाद शोषण की हिंसक और शिकारी छवि बनाए रखता है।
- source_word: יְתוֹמִים
  choice: पितृहीनों
  rationale: יָתוֹם विशेष रूप से पिता से वंचित व्यक्ति की सामाजिक श्रेणी को दर्शाता है। ‘पितृहीन’ इस विशिष्टता को ‘अनाथ’ से अधिक निकटता से सुरक्षित रखता है।
- source_word: יָבֹזּוּ
  choice: लूट लें
  rationale: בזז का अर्थ लूटना या माल छीन लेना है। ‘लूट लें’ हिंदी में सजीव और संदर्भानुकूल है।
theological_decisions:
- issue: भविष्यद्वक्ता की भर्त्सना में असुरक्षित सामाजिक समूहों का उल्लेख
  choice: ‘विधवाएँ’ और ‘पितृहीन’ जैसी ठोस श्रेणियाँ बनाए रखी गईं।
  alternative: इन्हें सामान्यीकृत करके ‘असहाय लोग’ कहना।
  rationale: इब्रानी पाठ उन विशिष्ट समूहों को नाम देता है जो सामाजिक और कानूनी शोषण के प्रति विशेष रूप से असुरक्षित थे। सामान्यीकरण करने से आरोप की ठोस नैतिक धार कम हो जाती।
- issue: עַמִּי में प्रथम पुरुष एकवचन प्रत्यय
  choice: ‘मेरी प्रजा’
  alternative: ‘उसकी प्रजा’
  rationale: इब्रानी में स्पष्ट प्रथम पुरुष एकवचन है, जो संदर्भ में परमेश्वर के वक्तव्य का स्वर बनाए रखता है; इसे तृतीय पुरुष में बदलना उचित नहीं।
- issue: לִהְיוֹת का उद्देश्य अथवा परिणाम संबंध
  choice: ‘ताकि ... बन जाएँ’
  alternative: ‘जिसके परिणामस्वरूप ... बन जाती हैं’
  rationale: इब्रानी रचना उद्देश्य और परिणाम दोनों की छाया रख सकती है। ‘ताकि’ अपराधियों की मंशा को संभव रखता है, पर वाक्य के परिणामात्मक प्रवाह को भी स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। कानूनी अन्याय के लिए ‘न्याय से वंचित करना’ और ‘अधिकार छीनना’ जैसे सहज पद चुने गए हैं, जबकि ‘लूट’ की पुनरावृत्ति मूल की हिंसक शोषण-छवि को बनाए रखती है।
