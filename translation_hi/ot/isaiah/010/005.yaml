reference: Isaiah 10:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ה֥וֹי אַשּׁ֖וּר שֵׁ֣בֶט אַפִּ֑/י וּ/מַטֶּה ה֥וּא בְ/יָדָ֖/ם זַעְמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/005.yaml
  text: Woe to Assyria[a], the rod of my anger[b]; the staff in their hand is my wrath.
translation:
  language: hi
  text: अश्शूर पर हाय! वह मेरे क्रोध की छड़ी है; उनके हाथ में[a] जो लाठी है, वह मेरा रोष है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘उनके हाथ में’ है—‘उनके’ बहुवचन है, पर ‘हाथ’ एकवचन। कुछ अनुवाद रूपक को सहज बनाने के लिए ‘उसके हाथ में’ करते हैं।
    reason: मसोरा-पाठ के असामान्य वचन-संयोजन और प्रचलित वैकल्पिक अनुवाद को स्पष्ट करना।
lexical_decisions:
- source_word: הוֹי
  choice: हाय … पर
  rationale: यह विस्मयादिबोधक यहाँ विलाप के साथ न्याय की घोषणा भी करता है। ‘हाय … पर’ आधुनिक हिन्दी में उस भविष्यद्वाणी-संबंधी चेतावनी का बल बनाए रखता है।
- source_word: אַשּׁוּר
  choice: अश्शूर
  rationale: राष्ट्र के इब्रानी नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: שֵׁבֶט
  choice: छड़ी
  rationale: यह मारने या दंड देने के साधन का रूपक है; ‘राजदंड’ कहने से राजकीय अधिकार का अनावश्यक भाव जुड़ सकता है।
- source_word: אַפִּי
  choice: मेरे क्रोध
  rationale: शाब्दिक अर्थ ‘मेरी नाक’ है, पर यह क्रोध के लिए इब्रानी मुहावरा है।
- source_word: מַטֶּה
  choice: लाठी
  rationale: यह שֵׁבֶט के समानांतर प्रहार या शासन के साधन को दर्शाता है और हिन्दी में रूपक को स्पष्ट रखता है।
- source_word: בְיָדָם
  choice: उनके हाथ में
  rationale: मसोरा-पाठ में प्रत्यय बहुवचन ‘उनके’ है, जबकि ‘हाथ’ संज्ञा एकवचन है। हिन्दी में ‘उनके हाथ में’ इस रूप को स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: זַעְמִי
  choice: मेरा रोष
  rationale: यह परमेश्वर के तीव्र क्रोध को व्यक्त करता है; ‘रोष’ पहले खंड के ‘क्रोध’ के साथ काव्यात्मक समानांतरता और अर्थ की तीव्रता दोनों बनाए रखता है।
theological_decisions:
- issue: न्याय के साधन के रूप में अश्शूर और परमेश्वर की सक्रियता
  choice: अश्शूर को परमेश्वर के क्रोध की छड़ी और उसके हाथ की लाठी को परमेश्वर का रोष कहा गया है।
  alternative: अश्शूर को केवल संयोगवश या पूरी तरह स्वतंत्र न्यायकारी शक्ति के रूप में प्रस्तुत करना।
  rationale: इब्रानी पाठ सीधे अश्शूर को परमेश्वर के क्रोध का साधन बताता है। अनुवाद इस तनाव को बनाए रखता है, पर इससे आगे परमेश्वर की सक्रियता या अश्शूर की नैतिक जिम्मेदारी की व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और भविष्यद्वाणी के न्याय-वचन के अनुरूप गरिमापूर्ण है। विस्मयादिबोधक और डैश पहले काव्यखंड की तीव्रता को दर्शाते हैं; दूसरे खंड में मूल का बहुवचन प्रत्यय बिना कृत्रिम हिन्दी के सुरक्षित रखा गया है।
