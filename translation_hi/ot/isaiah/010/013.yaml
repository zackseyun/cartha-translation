source:
  edition: WLC
  text: כִּ֣י אָמַ֗ר בְּ/כֹ֤חַ יָדִ/י֙ עָשִׂ֔יתִי וּ/בְ/חָכְמָתִ֖/י כִּ֣י נְבֻנ֑וֹתִי וְ/אָסִ֣יר גְּבוּלֹ֣ת עַמִּ֗ים ו/עתידתי/הם שׁוֹשֵׂ֔תִי וְ/אוֹרִ֥יד כַּ/אבִּ֖יר יוֹשְׁבִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/013.yaml
  text: For he says[a], “By the strength of my hand I have done it, and by my wisdom, for I have understanding. I remove the boundaries of peoples, and I plunder their treasures[c][b]; like a mighty man I bring down those who sit enthroned.”
translation:
  language: hi
  text: क्योंकि वह कहता है, “मैंने यह अपने हाथ की शक्ति से और अपनी बुद्धि से किया है, क्योंकि मुझमें समझ है। मैं लोगों की सीमाएँ हटा देता हूँ, उनकी संचित सम्पत्ति लूटता हूँ[a], और बलवान के समान बैठे हुए लोगों को नीचे गिरा देता हूँ[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके भंडार,” “उनकी जमा की हुई वस्तुएँ,” अथवा “उनकी सम्पत्ति।” यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और संभवतः संचित धन-दौलत को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: “बैठे हुए लोगों” का अर्थ “निवासियों” भी हो सकता है। संदर्भ में यह सत्ता में बैठे लोगों की ओर संकेत कर सकता है, पर मूल शब्द इसे निश्चित नहीं करता। “बलवान” का अनुवाद “शक्तिशाली जन” या “पराक्रमी” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אָמַר
  choice: क्योंकि वह कहता है
  rationale: כִּי पिछले प्रसंग में अश्शूर के घमंड पर दिए गए न्याय का कारण बताता है; पूर्णकालिक אָמַר यहाँ उसके प्रतिनिधि और जीवंत दावे को वर्तमान काल में व्यक्त कर सकता है।
- source_word: בְּכֹחַ יָדִי
  choice: अपने हाथ की शक्ति से
  rationale: यह शाब्दिक शारीरिक बिंब और अपनी सैन्य सामर्थ्य पर घमंड, दोनों को बनाए रखता है।
- source_word: עָשִׂיתִי
  choice: मैंने यह ... किया है
  rationale: व्यापक क्रिया עשה को स्वाभाविक हिन्दी में रखा गया है; “यह” संदर्भ से पूरित है।
- source_word: וּבְחָכְמָתִי כִּי נְבֻנוֹתִי
  choice: और अपनी बुद्धि से ... क्योंकि मुझमें समझ है
  rationale: חָכְמָה और בין से जुड़े ‘बुद्धि’ तथा ‘समझ’ के निकटवर्ती, किंतु अलग, भाव सुरक्षित रहते हैं।
- source_word: וְאָסִיר גְּבוּלֹת עַמִּים
  choice: मैंने जाति-जाति की सीमाएँ हटा दीं
  rationale: הסיר का कारक अर्थ ‘हटाना’ है; עַמִּים को आधुनिक राष्ट्र-राज्य तक सीमित किए बिना ‘जाति-जाति’ से व्यक्त किया गया है। संदर्भानुसार क्रियाओं को पूर्ण किए गए विजय-कृत्यों के रूप में रखा गया है।
- source_word: וַעֲתִידֹתֵיהֶם שׁוֹשֵׂתִי
  choice: उनकी संचित सम्पत्ति लूट ली
  rationale: दुर्लभ עֲתִידוֹת संभवतः तैयार या जमा की हुई वस्तुओं/धन को सूचित करता है; ‘संचित सम्पत्ति’ इस अर्थ को बिना अत्यधिक निश्चित किए व्यक्त करती है। שׁסס का अर्थ लूटना है।
- source_word: וְאוֹרִיד כַּאַבִּיר יוֹשְׁבִים
  choice: एक बलवान की तरह सिंहासनों पर बैठे लोगों को नीचे उतार दिया
  rationale: כַּאַבִּיר की तुलना को ‘एक बलवान की तरह’ रखा गया है। יוֹשְׁבִים मूलतः ‘बैठे/रहनेवाले’ है; ‘नीचे उतारने’ के साथ सत्ता में बैठे लोगों का अर्थ संदर्भानुकूल है, पर विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: घमंड करने वाले वक्ता की पहचान
  choice: एकवचन ‘वह’ और प्रथम पुरुष उद्धरण को सुरक्षित रखा गया है, जो निकट संदर्भ में अश्शूर के राजा का घमंड दर्शाता है।
  alternative: इसे पूरे अश्शूर का सामूहिक मानवीकरण माना जा सकता है।
  rationale: यशायाह 10:12-15 राजा के घमंडी हृदय और अश्शूर की सामूहिक भूमिका, दोनों को निकटता से जोड़ता है; अनुवाद इब्रानी एकवचन रखकर प्रश्न को अनावश्यक रूप से तय नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। अश्शूरी वक्ता के आत्मश्लाघी स्वर को बार-बार आए ‘अपने/अपनी’ और प्रथम पुरुष क्रियाओं से उभारा गया है। दुर्लभ पद और יוֹשְׁבִים की अस्पष्टता पादटिप्पणियों में संरक्षित है।
