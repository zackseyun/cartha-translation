source:
  edition: WLC
  text: בִּלְתִּ֤י כָרַע֙ תַּ֣חַת אַסִּ֔יר וְ/תַ֥חַת הֲרוּגִ֖ים יִפֹּ֑לוּ בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/004.yaml
  text: Nothing remains but to crouch among the prisoners or to fall among the slain. For all this his anger has not turned away[a], and his hand is still stretched out.
translation:
  language: hi
  text: बन्दियों के बीच झुकने या मारे हुओं के बीच गिरने के सिवा कुछ नहीं बचेगा। इस सब पर भी उसका क्रोध नहीं टला है[a], और उसका हाथ अभी भी बढ़ा हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बन्दियों के नीचे झुकने के सिवा, वे मारे हुओं के नीचे गिरेंगे।” इब्रानी अत्यन्त संक्षिप्त है; क्रियाओं और सम्बन्धबोधकों का ठीक परस्पर सम्बन्ध विवादित है।
    reason: वैकल्पिक पाठ-संरचना और अधिक शाब्दिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: בִּלְתִּי
  choice: के सिवा कुछ नहीं बचेगा
  rationale: यह अत्यन्त संक्षिप्त इब्रानी वाक्यांश सन्दर्भ में केवल दो अनिवार्य परिणाम शेष रहने का भाव देता है। यह हिन्दी प्रयोग उस लोपित अस्तित्ववाचक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָרַע
  choice: दुबकने
  rationale: क्रिया झुकने, घुटने टेकने या नीचे सिमटने का अर्थ दे सकती है। यहाँ ‘दुबकने’ से बन्धुआ दशा में विवश होकर नीचे पड़े रहने का भाव आता है और उपासना का अनचाहा संकेत नहीं जुड़ता।
- source_word: תַּחַת
  choice: के बीच
  rationale: शाब्दिक अर्थ ‘नीचे’ है, पर इस न्याय-सन्दर्भ में किसी समूह के साथ गिने या रखे जाने का अर्थ सम्भव है। मुख्य पाठ में ‘के बीच’ सहज है; अधिक शाब्दिक सम्भावना पादटिप्पणी में रखी गई है।
- source_word: אַסִּיר
  choice: बन्दियों
  rationale: यह संज्ञा बँधे हुए व्यक्ति या बन्दी को दर्शाती है। सामूहिक सन्दर्भ में बहुवचन हिन्दी में स्वाभाविक है।
- source_word: הֲרוּגִים
  choice: मारे हुओं
  rationale: हרג का कर्मवाचक रूप हिंसक रीति से मारे गए लोगों को सूचित करता है; ‘मृतकों’ की अपेक्षा ‘मारे हुओं’ में यह विशिष्टता बनी रहती है।
- source_word: יִפֹּלוּ
  choice: गिरने
  rationale: रूप की दृष्टि से यह ‘वे गिरेंगे’ है, किन्तु संक्षिप्त वाक्य में इसे पहले क्रियापद के समानान्तर अनन्त क्रिया के रूप में लेना मुख्य सम्भाव्य अर्थ को सहज हिन्दी में देता है। वैकल्पिक वाक्य-संरचना पादटिप्पणी में दी गई है।
- source_word: בְּכָל זֹאת
  choice: इस सब पर भी
  rationale: यशायाह में बार-बार आने वाला यह वाक्यांश बताता है कि इतना न्याय हो चुकने पर भी क्रोध समाप्त नहीं हुआ। ‘इस सब पर भी’ विरोधात्मक बल और आवर्ती लय दोनों को स्पष्ट करता है।
- source_word: לֹא שָׁב אַפּוֹ
  choice: उसका क्रोध नहीं टला है
  rationale: אַף यहाँ मुहावरे के अनुसार ‘क्रोध’ है और שׁוּב उसके पीछे हटने या शान्त होने को दर्शाता है। ‘नहीं टला है’ वर्तमान तक जारी स्थिति को स्वाभाविक हिन्दी में रखता है।
- source_word: יָדוֹ נְטוּיָה
  choice: उसका हाथ अब भी उठा हुआ है
  rationale: यह यशायाह में जारी सक्रिय न्याय का मानवीय-रूपक चित्र है। ‘उठा हुआ’ हिन्दी में दण्ड देने के लिए तत्पर हाथ का स्वाभाविक बोध कराता है और रूपक को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय न्याय के लिए मानवीय-रूपक भाषा
  choice: ‘उसका क्रोध’ और ‘उसका हाथ अब भी उठा हुआ है’ को प्रत्यक्ष रूपक के रूप में बनाए रखा गया।
  alternative: इसे अमूर्त करके ‘उसका न्याय अब भी जारी है’ कहना।
  rationale: इब्रानी पाठ परमेश्वर के जारी न्याय को शरीर-संबंधी सजीव चित्रों से व्यक्त करता है। अनुवाद इन चित्रों और उनके तनाव को व्याख्यात्मक अमूर्तन से नहीं बदलता।
- issue: संक्षिप्त प्रथम खण्ड की वाक्य-संरचना
  choice: 'दोनों क्रियाओं को समानान्तर अनिवार्य परिणाम माना गया: बन्दियों के बीच दुबकना या मारे हुओं के बीच गिरना।'
  alternative: ‘बन्दियों के नीचे झुकने के सिवा, वे मारे हुओं के नीचे गिरेंगे।’
  rationale: इब्रानी अत्यन्त संक्षिप्त है और יִפֹּלוּ रूपतः बहुवचन सीमित क्रिया है। मुख्य पाठ सन्दर्भगत समानान्तरता को अपनाता है, पर दूसरी सम्भावना को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज किन्तु गरिमापूर्ण रखी गई है। ‘बन्दी’, ‘क्रोध’ और ‘हाथ उठा हुआ’ जैसे परिचित शब्द मूल की न्याय-संबंधी तीव्रता और काव्यात्मक रूपक को बनाए रखते हैं।
