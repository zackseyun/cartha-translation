source:
  edition: WLC
  text: לָ֠/כֵן יְשַׁלַּ֨ח הָ/אָד֜וֹן יְהוָ֧ה צְבָא֛וֹת בְּ/מִשְׁמַנָּ֖י/ו רָז֑וֹן וְ/תַ֧חַת כְּבֹד֛/וֹ יֵקַ֥ד יְקֹ֖ד כִּ/יק֥וֹד אֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/016.yaml
  text: Therefore the Lord[a], Yahweh of Armies, will send wasting sickness among his stout warriors[c][b], and under his glory a burning will be kindled like the burning of fire.
translation:
  language: hi
  text: इसलिए प्रभु, सेनाओं का याहवे, उसके हृष्ट-पुष्ट जनों में क्षीणता भेजेगा[a], और उसके वैभव के नीचे ऐसी ज्वाला भड़केगी, जैसी आग की ज्वाला[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हृष्ट-पुष्ट जनों में क्षीणता’ का शाब्दिक चित्र ‘उसके मोटे/समृद्ध जनों में दुबलापन’ है; यह उसके शक्तिशाली, संपन्न या सुदृढ़ लोगों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उसके वैभव के नीचे’ का अनुवाद ‘उसके वैभव के स्थान पर’ भी हो सकता है; ‘वैभव’ का अर्थ यहाँ शोभा, गौरव या ठाठ-बाट हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पूर्ववर्ती कथन से निकलने वाले परिणाम को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: הָאָדוֹן יְהוָה צְבָאוֹת
  choice: प्रभु, सेनाओं का यहोवा
  rationale: הָאָדוֹן को उपाधि ‘प्रभु’, יהוה को व्यक्तिवाचक नाम ‘यहोवा’, और צְבָאוֹת को अर्थानुसार ‘सेनाओं का’ रखा गया है।
- source_word: בְּמִשְׁמַנָּיו
  choice: उसके हृष्ट-पुष्ट जनों में
  rationale: शाब्दिक ‘उसके मोटे/समृद्ध जनों में’ शक्ति, संपन्नता और सुदृढ़ अभिजात वर्ग की छवि है; ‘हृष्ट-पुष्ट जन’ उस रूपक को बचाता है और मूल में निहित न होने के कारण ‘योद्धा’ नहीं जोड़ता।
- source_word: רָזוֹן
  choice: क्षीणता
  rationale: संज्ञा दुबले या क्षीण हो जाने की दशा बताती है। ‘क्षीणता’ दंडस्वरूप दुर्बलता को व्यक्त करती है, पर ‘रोग’ जैसी अतिरिक्त धारणा नहीं जोड़ती।
- source_word: וְתַחַת כְּבֹדוֹ
  choice: और उसके वैभव के नीचे
  rationale: תחת का प्राथमिक स्थानवाचक अर्थ ‘नीचे’ रखा गया है, जिससे बाहरी वैभव के नीचे धधकते विनाश का चित्र बना रहता है; प्रतिस्थापन का संभावित अर्थ पादटिप्पणी में दिया गया है।
- source_word: יֵקַד יְקֹד כִּיקוֹד אֵשׁ
  choice: ऐसी ज्वाला भड़केगी, जैसी आग की ज्वाला
  rationale: मूल की धातु-संबद्ध पुनरुक्ति और तीव्र अग्नि-चित्र को स्वाभाविक हिन्दी में यथासंभव बनाए रखता है।
theological_decisions:
- issue: יהוה ईश्वरीय नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा का व्यक्तिवाचक नाम सीधे उपस्थित है। हिन्दी बाइबल परंपरा में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ से इसे उपाधि ‘प्रभु’ से अलग रखा गया है।
- issue: ‘हृष्ट-पुष्ट जनों’ की पहचान
  choice: मूल का व्यापक रूपक बनाए रखना
  alternative: ‘बलवान योद्धा’ कहकर अश्शूर के सैनिक अभिजात वर्ग के रूप में स्पष्ट करना
  rationale: संदर्भ सैन्य शक्ति की ओर संकेत करता है, किंतु पद में स्वयं ‘योद्धा’ शब्द नहीं है; इसलिए अनावश्यक विशिष्टीकरण से बचते हुए रूपक सुरक्षित रखा गया है।
- issue: תחת का अर्थ
  choice: वैभव के नीचे
  alternative: वैभव के स्थान पर
  rationale: दोनों अर्थ भाषिक रूप से संभव हैं। मुख्य पाठ में स्थानवाचक अग्नि-चित्र रखा गया है और प्रतिस्थापन का अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण मानक हिन्दी। मूल की शारीरिक ‘पुष्टता बनाम क्षीणता’ और अग्नि की पुनरुक्त छवियों को रखा गया है, जबकि ‘योद्धा’ और ‘रोग’ जैसे संदर्भगत परंतु मूल में अनुल्लिखित विवरण मुख्य पाठ में नहीं जोड़े गए।
