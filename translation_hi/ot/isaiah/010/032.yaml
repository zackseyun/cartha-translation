  text: ע֥וֹד הַ/יּ֖וֹם בְּ/נֹ֣ב לַֽ/עֲמֹ֑ד יְנֹפֵ֤ף יָד/וֹ֙ הַ֣ר בית צִיּ֔וֹן גִּבְעַ֖ת יְרוּשָׁלִָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/032.yaml
  text: Still this very day he will halt at Nob[a]; he will shake his hand at the mountain of the daughter of Zion[b], the hill of Jerusalem.
translation:
  language: hi
  text: आज भी वह नोब में आकर ठहरेगा; वह सिय्योन के भवन के पर्वत[b] और यरूशलेम की पहाड़ी की ओर अपना हाथ लहराएगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपना हाथ हिलाएगा/तानकर दिखाएगा।’ इब्रानी क्रिया धमकी भरे संकेत को भी व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘सिय्योन के भवन का पर्वत।’ कुछ अनुवाद इस असामान्य पदबंध को अलग ढंग से सहज बनाते हैं, पर यहाँ दिए गए इब्रानी पाठ में ‘भवन/घर’ शब्द है।
    reason: alternative_reading
lexical_decisions:
- source_word: ע֥וֹד הַיּ֖וֹם
  choice: आज ही
  rationale: यह पदबंध भविष्यद्वाणी के दृश्य की तात्कालिकता दिखाता है। आधुनिक हिन्दी में ‘आज ही’ स्वाभाविक है और उसी दिन की निरंतर बढ़ती हुई कार्रवाई का भाव रखता है।
- source_word: בְּ/נֹ֣ב לַֽ/עֲמֹ֑ד
  choice: नोब में आकर ठहरेगा
  rationale: स्थानवाचक पद के बाद עמד का infinitive आगे बढ़ते आक्रमणकारी के नोब पहुँचकर रुकने या मोर्चा लेने का भाव देता है। ‘आकर’ सन्दर्भगत गति को सहज हिन्दी में व्यक्त करता है, बिना ठहरने के मूल भाव को खोए।
- source_word: יְנֹפֵ֤ף יָד/וֹ֙
  choice: अपना हाथ लहराएगा
  rationale: נוף हाथ को हिलाने, लहराने या धमकी के भाव से उठाने का संकेत दे सकता है। ‘हाथ लहराएगा’ मूल क्रिया की व्यापकता बनाए रखता है; धमकी का सम्भावित भाव पादटिप्पणी में दिया गया है।
- source_word: הַ֣ר בית צִיּ֔וֹן
  choice: सिय्योन के भवन के पर्वत
  rationale: प्रदत्त WLC पाठ में בית स्पष्ट रूप से उपस्थित है। कुछ पाठ-परम्पराएँ या अनुवाद इसे ‘सिय्योन की बेटी’ अथवा केवल ‘सिय्योन पर्वत’ के रूप में सहज बनाते हैं, पर मुख्य पाठ स्रोत की असामान्य अभिव्यक्ति को बनाए रखता है।
- source_word: גִּבְעַ֖ת יְרוּשָׁלִָֽם
  choice: यरूशलेम की पहाड़ी
  rationale: यह construct phrase का सीधा और स्वाभाविक हिन्दी रूप है तथा पहले स्थलाकृतिक पद के समानांतर रहता है।
theological_decisions:
- issue: एकवचन कर्ता का अभिप्राय
  choice: ‘वह’ को बिना पहचान बताए बनाए रखा गया है।
  alternative: अश्शूर का राजा अथवा मानवीकृत अश्शूरी सेना
  rationale: निकट सन्दर्भ अश्शूरी आक्रमणकारी की ओर संकेत करता है, पर इब्रानी पद स्वयं यहाँ उसका नाम नहीं लेता। अनुवाद उस व्याख्यात्मक तनाव को खुला रखता है।
- issue: הַר בית ציון में בית का अर्थ
  choice: ‘सिय्योन के भवन के पर्वत’ के रूप में בית को मुख्य पाठ में रखा गया है।
  alternative: ‘सिय्योन की बेटी का पर्वत’ अथवा ‘सिय्योन पर्वत’
  rationale: प्रदत्त मूल-पाठ में ‘भवन/घर’ के लिए בית है। इसे ‘बेटी’ में बदलना अलग पाठ या पाठ-सुधार को मुख्य अनुवाद में अपनाना होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘नोब’ और ‘सिय्योन’ प्रचलित बाइबलीय नाम-रूप हैं। असामान्य ‘सिय्योन के भवन के पर्वत’ को स्रोत-पाठ के कारण जानबूझकर बनाए रखा गया और पादटिप्पणी से स्पष्ट किया गया है।
