  text: וְ/הוּא֙ לֹא כֵ֣ן יְדַמֶּ֔ה וּ/לְבָב֖/וֹ לֹא כֵ֣ן יַחְשֹׁ֑ב כִּ֚י לְ/הַשְׁמִ֣יד בִּ/לְבָב֔/וֹ וּ/לְ/הַכְרִ֥ית גּוֹיִ֖ם לֹ֥א מְעָֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/007.yaml
  text: But he does not think so[a], and his heart does not reckon so; for it is in his heart to destroy[b], and to cut off not a few nations.
translation:
  language: hi
  text: परन्तु वह ऐसा नहीं सोचता[a], और उसका मन ऐसा विचार नहीं करता; क्योंकि उसके मन में नाश करने और बहुत-से राष्ट्रों को मिटा देने की मंशा है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘ऐसा इरादा नहीं रखता’; इब्रानी क्रिया में सोचने, कल्पना करने या उद्देश्य बनाने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘थोड़े नहीं’ है; यह न्यूनोक्ति बड़ी संख्या को व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַמֶּה
  choice: सोचता
  rationale: पिएल रूप यहाँ किसी बात को मन में समझने, कल्पना करने या उद्देश्य बनाने का भाव दे सकता है। ‘सोचता’ सहज हिन्दी है और मूल की अर्थगत व्यापकता बनाए रखता है; वैकल्पिक आशय पाद-टिप्पणी में दिया गया है।
- source_word: לְבָבוֹ / בִּלְבָבוֹ
  choice: उसका मन / उसके मन में
  rationale: लֵבָב यहाँ भावनाओं तक सीमित नहीं, बल्कि विचार और इच्छा के भीतरी केंद्र को दर्शाता है। आधुनिक हिन्दी में संज्ञानात्मक और इच्छात्मक आशय के लिए ‘मन’ स्वाभाविक है और दोनों आवृत्तियों को बनाए रखता है।
- source_word: יַחְשֹׁב
  choice: विचार करता है
  rationale: חשב का अर्थ सोचना, विचार करना या योजना बनाना हो सकता है। ‘विचार करता है’ पहले क्रियापद से हल्का भेद रखते हुए समानांतरता को सुरक्षित रखता है।
- source_word: כִּי
  choice: बल्कि
  rationale: यहाँ כִּי अश्शूरी राजा के वास्तविक भीतरी उद्देश्य को पहले कथन के विपरीत सामने लाता है। हिन्दी में ‘बल्कि’ इस विरोध और स्पष्टीकरण को स्पष्ट व स्वाभाविक बनाता है।
- source_word: לְהַשְׁמִיד
  choice: नाश करने
  rationale: שׁמד का हिफ़ील रूप विनाश कराने या नष्ट करने का भाव देता है। ‘नाश करना’ व्यापक और गरिमापूर्ण है तथा पूर्ण सर्वनाश का अनावश्यक अतिरिक्त दावा नहीं करता।
- source_word: לְהַכְרִית
  choice: मिटा देने
  rationale: כרת के हिफ़ील का आशय काट डालना, हटा देना या समाप्त कर देना है। राष्ट्रों के संदर्भ में ‘मिटा देना’ स्वाभाविक हिन्दी है और उनके उन्मूलन की मंशा व्यक्त करता है।
- source_word: גּוֹיִם
  choice: राष्ट्रों
  rationale: इस भू-राजनीतिक प्रसंग में גּוֹיִם राजनीतिक समुदायों या राष्ट्रों को दर्शाता है; ‘राष्ट्र’ सटीक और प्रचलित चयन है।
- source_word: לֹא מְעָט
  choice: बहुत-से
  rationale: शाब्दिक ‘कम नहीं’ एक न्यूनोक्ति है जिसका आशय बड़ी संख्या है। मुख्य पाठ में ‘बहुत-से’ स्वाभाविक हिन्दी में उसका अभिप्राय देता है, जबकि मूल अलंकार पाद-टिप्पणी में दर्ज है।
- source_word: וְהוּא
  choice: परन्तु वह
  rationale: पिछले पद में बताए गए परमेश्वर के उद्देश्य और अश्शूरी के अपने विचार के बीच विरोध है; इसलिए संयोजक का विरोधार्थक अनुवाद उचित है।
theological_decisions:
- issue: प्रसंग में परमेश्वर के उद्देश्य और अश्शूर के राजा के उद्देश्य का संबंध
  choice: पद में केवल दोनों उद्देश्यों के बीच निहित विरोध रखा गया है; राजा के न समझने को अतिरिक्त धर्मवैज्ञानिक व्याख्या से नहीं खोला गया।
  alternative: स्पष्ट रूप से जोड़ना कि वह परमेश्वर के उद्देश्य को नहीं समझता।
  rationale: निकटवर्ती प्रसंग यह विरोध स्पष्ट करता है, पर इस पद के शब्द केवल कहते हैं कि वह ‘ऐसा’ नहीं सोचता और उसके मन में विनाश है। अनुवाद इस तनाव को बनाए रखता है और पाठ से अधिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘मन’ द्वारा इब्रानी हृदय-संबंधी मुहावरे का विचार और इच्छा वाला आशय व्यक्त किया गया है। मुख्य पाठ में कठिन न्यूनोक्ति को स्वाभाविक ‘बहुत-से’ से प्रस्तुत कर उसका शाब्दिक रूप पाद-टिप्पणी में सुरक्षित रखा गया है।
