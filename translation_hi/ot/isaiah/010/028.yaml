  text: He has come against Aiath; he has passed through Migron. At Michmash he stores his baggage.
translation:
  language: hi
  text: वह अय्यात पर चढ़ आया है; वह मिग्रोन से होकर गुज़रा है। मिकमाश में वह अपना सामान जमा करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּא עַל
  choice: पर चढ़ आया है
  rationale: בוא על यहाँ सैन्य अभियान की गति को दर्शाता है; ‘पर चढ़ आया’ गंतव्य और आक्रमण—दोनों भावों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עָבַר בְּמִגְרוֹן
  choice: मिग्रोन से होकर गुज़रा है
  rationale: क्रिया עבר और स्थान-सूचक בְּ का प्रसंगानुकूल अर्थ किसी स्थान से होकर आगे बढ़ना है।
- source_word: יַפְקִיד כֵּלָיו
  choice: उसने अपना सामान रख छोड़ा है
  rationale: יַפְקִיד का रूप अपूर्ण है, पर यात्रा-वृत्तांत में इसे वर्णनात्मक पूर्ण भूत के रूप में समझा जा सकता है; הפקיד में किसी वस्तु को जमा/सुरक्षित रखने का भाव है और כֵּלָיו सैन्य साज-सामान या सामान को सूचित कर सकता है। सामान्य पाठक के लिए ‘सामान रख छोड़ा’ स्वाभाविक है।
