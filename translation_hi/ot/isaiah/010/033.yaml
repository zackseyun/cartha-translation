  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִנֵּ֤ה הָ/אָדוֹן֙ יְהוָ֣ה צְבָא֔וֹת מְסָעֵ֥ף פֻּארָ֖ה בְּ/מַעֲרָצָ֑ה וְ/רָמֵ֤י הַ/קּוֹמָה֙ גְּדוּעִ֔ים וְ/הַ/גְּבֹהִ֖ים יִשְׁפָּֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/033.yaml
  text: Behold[a], the Lord, Yahweh of Armies, is lopping off the boughs with terrifying power; the tall in stature are cut down[b], and the lofty are brought low.
translation:
  language: hi
  text: देखो, प्रभु, सेनाओं का याहवे, भयावह बल से[a] डालियाँ काट रहा है; ऊँचे कद वाले काट डाले जाते हैं[b], और जो ऊँचे हैं वे नीचा किए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पद का अर्थ ‘धमाके के साथ,’ ‘हिंसक बल से,’ या ‘आतंक के साथ’ भी हो सकता है; इसमें भय उत्पन्न करने वाली हिंसक शक्ति का भाव है।
    reason: lexical_alternative
  - marker: b
    text: यह चित्र डालियों और ऊँचे वृक्षों को काटने का है; साथ ही यह ऊँचे या प्रतिष्ठित लोगों के पतन का संकेत देता है।
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला अव्यय है। ‘देखो’ भविष्यद्वाणी की सजीव और गरिमामय पुकार को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: הָאָדוֹן יְהוָה צְבָאוֹת
  choice: प्रभु, सेनाओं का याहवे
  rationale: सव्यंजक אָדוֹן को उपाधि ‘प्रभु’ और परमेश्वर के निज नाम יְהוָה को ‘याहवे’ रखा गया है। צְבָאוֹת का अर्थ पारदर्शी रूप से ‘सेनाओं का’ किया गया है।
- source_word: מְסָעֵף
  choice: काट रहा है
  rationale: कृदन्त क्रिया निकट या सजीव रूप से चल रही कार्रवाई दिखाती है। सन्दर्भ डालियों को काटने का है; हिन्दी में ‘काट रहा है’ स्पष्ट और स्वाभाविक है।
- source_word: פֻּארָה
  choice: डालियाँ
  rationale: शब्द वृक्ष की फैली हुई शाखाओं अथवा सघन शाखा-वृद्धि को सूचित करता है। ‘डालियाँ’ वृक्ष-विषयक बिम्ब को सहज हिन्दी में सुरक्षित रखता है।
- source_word: בְמַעֲרָצָה
  choice: भयावह प्रचंडता से
  rationale: इस दुर्लभ संज्ञा में हिंसक, आतंककारी बल अथवा धमाके की ध्वनि का भाव है। चुना हुआ पद बल और भय, दोनों को व्यक्त करता है; अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: רָמֵי הַקּוֹמָה
  choice: ऊँचे कदवाले
  rationale: शाब्दिक ऊँचाई के वृक्ष-बिम्ब को बनाए रखा गया है, जबकि सन्दर्भ में प्रतिष्ठित या घमण्डी लोगों की ओर सम्भावित संकेत को स्पष्ट व्याख्या बनाकर आरोपित नहीं किया गया।
- source_word: גְּדוּעִים
  choice: काट डाले जाते हैं
  rationale: निष्क्रिय/परिणामसूचक रूप काटने या धराशायी करने का भाव देता है। यह अनुवाद वृक्ष काटे जाने और न्याय, दोनों की छवि को खुला रखता है।
- source_word: הַגְּבֹהִים יִשְׁפָּלוּ
  choice: जो ऊँचे हैं वे नीचा किए जाएँगे
  rationale: ‘ऊँचे’ शाब्दिक ऊँचाई और रूपकात्मक उच्चता दोनों सम्भावनाएँ सुरक्षित रखता है; निष्क्रिय वाक्यांश दीन किए जाने को बिना नैतिक अर्थ अधिक स्पष्ट किए व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के निज नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का निज नाम सीधे उपस्थित है। उसे उपाधि ‘प्रभु’ में विलीन न करके ‘याहवे’ के रूप में लिप्यन्तरित किया गया है।
- issue: वृक्ष काटने के बिम्ब का नैतिक अर्थ
  choice: मुख्य पाठ में वृक्ष और ऊँचाई का बिम्ब बनाए रखना
  alternative: इसे सीधे घमण्डियों के न्याय के रूप में स्पष्ट करना
  rationale: पद ऊँची डालियों और ऊँचों को काटे या नीचा किए जाने की भाषा से न्याय का संकेत देता है। अनुवाद उस संकेत को सुरक्षित रखता है, पर रूपक को व्याख्यात्मक गद्य में नहीं बदलता।
- issue: גְּדוּעִים और יִשְׁפָּלוּ के काल/पक्ष का सामंजस्य
  choice: पहले को सजीव वर्तमान और दूसरे को भविष्य रूप में रखना
  alternative: दोनों को भविष्यकाल में रखना
  rationale: पहला रूप निष्क्रिय कृदन्त है और दूसरा अपूर्ण क्रियारूप। भिन्न रूपों को बनाए रखने से भविष्यद्वाणी का सजीव दृश्य और आगामी परिणाम दोनों व्यक्त होते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमामय और सजीव रखी गई है। ‘देखो’ भविष्यद्वाणी की उद्घोषणात्मक शक्ति देता है। ‘डालियाँ,’ ‘ऊँचे कदवाले’ और ‘नीचा किए जाएँगे’ मूल के वृक्ष-बिम्ब तथा शाब्दिक और रूपकात्मक अर्थों के बीच की जानबूझकर रखी गई अस्पष्टता को सुरक्षित रखते हैं।
