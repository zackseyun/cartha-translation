lexical_decisions:
- source_word: שְׁאָר
  choice: बचा हुआ भाग
  rationale: यह संज्ञा न्याय या विनाश के बाद बचे हुए लोगों को दर्शाती है। ‘बचा हुआ भाग’ सामान्य आधुनिक हिन्दी में सहज है और यशायाह में इसकी सामूहिक तथा धर्मवैचारिक शक्ति बनाए रखता है।
- source_word: יָשׁוּב
  choice: लौटेगा
  rationale: שוב का कालरूप यहाँ भविष्यसूचक अर्थ ‘लौटेगा’ देता है। यह परमेश्वर की ओर भौतिक वापसी और मन-फिराव, दोनों की संभावित अर्थछाया को खुला रखता है।
- source_word: שְׁאָר יַעֲקֹב
  choice: याकूब का बचा हुआ भाग
  rationale: सम्बन्धवाचक इब्रानी पदबंध का स्वाभाविक हिन्दी रूप है; ‘याकूब’ को मूल पाठ के अनुसार बनाए रखा गया है।
- source_word: אֶל
  choice: के पास
  rationale: यह दिशा और व्यक्ति की ओर लौटने को स्वाभाविक हिन्दी में व्यक्त करता है। ‘की ओर’ भी सम्भव है, पर ‘के पास लौटना’ अधिक सहज है।
- source_word: אֵל גִּבּוֹר
  choice: पराक्रमी परमेश्वर
  rationale: सन्दर्भ में यह एक गम्भीर ईश्वरीय उपाधि है। ‘पराक्रमी’ גִּבּוֹר की शक्ति और वीरता की अर्थछाया को बनाए रखता है, जबकि ‘परमेश्वर’ यहाँ אֵל के ईश्वरीय संकेत को स्पष्ट और स्वाभाविक हिन्दी में देता है।
theological_decisions:
- issue: אֵל גִּבּוֹר का अर्थ और सन्दर्भ
  choice: पराक्रमी परमेश्वर
  alternative: 'परमेश्वर, जो पराक्रमी है; कम सम्भावित: कोई पराक्रमी देवता या पराक्रमी वीर'
  rationale: निकटवर्ती सन्दर्भ में बचा हुआ भाग उसी के पास लौटता है, इसलिए ईश्वरीय सन्दर्भ सबसे स्वाभाविक है। यही उपाधि यशायाह 9:6 में भी आती है। फिर भी पदबंध की शाब्दिक वैकल्पिक व्याख्याएँ टिप्पणी में सुरक्षित रखी गई हैं।
- issue: יָשׁוּב में वापसी और मन-फिराव की अर्थछाया
  choice: लौटेगा
  alternative: फिर आएगा; मन फिराकर लौटेगा
  rationale: ‘लौटेगा’ मूल क्रिया की वास्तविक अस्पष्टता को बनाए रखता है और केवल भौगोलिक वापसी या केवल आत्मिक मन-फिराव में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
