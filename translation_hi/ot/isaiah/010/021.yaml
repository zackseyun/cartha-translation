  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। पहले और दूसरे ‘बचा हुआ भाग’ की पुनरावृत्ति मूल इब्रानी के बलाघात तथा शब्द-प्रतिध्वनि को सुरक्षित रखती है। डैश वाक्य में पुनरुक्त पद की व्याख्यात्मक समानाधिकरण संरचना स्पष्ट करता है।
