  text: וּ/מַֽה תַּעֲשׂוּ֙ לְ/י֣וֹם פְּקֻדָּ֔ה וּ/לְ/שׁוֹאָ֖ה מִ/מֶּרְחָ֣ק תָּב֑וֹא עַל מִי֙ תָּנ֣וּסוּ לְ/עֶזְרָ֔ה וְ/אָ֥נָה תַעַזְב֖וּ כְּבוֹדְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/003.yaml
  text: What will you do on the day of punishment[a], and in the devastation that comes from far away? To whom will you flee for help, and where will you leave your wealth?
translation:
  language: hi
  text: दण्ड के दिन और उस विनाश के समय जो दूर से आएगा, तुम क्या करोगे? सहायता के लिए तुम किसके पास भागोगे, और अपनी सम्पत्ति[a] कहाँ छोड़ोगे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी महिमा” या “अपना सम्मान।” इब्रानी शब्द का अर्थ महिमा या सम्मान हो सकता है, पर इस संदर्भ में वह मूल्यवान सम्पत्ति या धन का भी संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדָּה
  choice: दण्ड
  rationale: न्याय-संबंधी भविष्यवाणी के संदर्भ में यह शब्द दण्ड देने के लिए किए गए निरीक्षण या हिसाब लेने का भाव रखता है; ‘दण्ड’ आधुनिक हिन्दी में इसे स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: שׁוֹאָה
  choice: विनाश
  rationale: यह संज्ञा भीषण उजाड़, बरबादी या विपत्ति को दर्शाती है; ‘विनाश’ इस न्याय की प्रबलता को सहज हिन्दी में व्यक्त करता है।
- source_word: מִמֶּרְחָק
  choice: दूर से
  rationale: मूल वाक्यांश स्थानगत दूरी से उत्पत्ति बताता है, सम्भवतः दूर से आनेवाले आक्रमणकारी न्याय की ओर संकेत करता है।
- source_word: תָּבוֹא
  choice: आनेवाले
  rationale: अपूर्ण क्रिया का भाव यहाँ भविष्य में आनेवाले विनाश से है; कृदन्तीय हिन्दी रचना प्रश्न के भविष्यकालीन संदर्भ को स्वाभाविक रूप से बनाए रखती है।
- source_word: תָּנוּסוּ
  choice: भागोगे
  rationale: क्रिया संकट से बच निकलने के लिए भागने का अर्थ देती है; ‘किसके पास भागोगे’ लक्ष्य और सहायता, दोनों को स्पष्ट रखता है।
- source_word: לְעֶזְרָה
  choice: सहायता पाने के लिए
  rationale: यह सहायता या सहारा पाने के उद्देश्य को दर्शाता है; हिन्दी में उद्देश्य स्पष्ट करने के लिए यह स्वाभाविक अभिव्यक्ति है।
- source_word: אָנָה
  choice: कहाँ
  rationale: यह स्थानवाचक प्रश्नवाचक शब्द है; ‘कहाँ’ आधुनिक हिन्दी का सीधा और सहज समानार्थक है।
- source_word: תַעַזְבוּ
  choice: छोड़ोगे
  rationale: मूल क्रिया छोड़ने या त्यागने का व्यापक भाव रखती है; ‘छोड़ोगे’ यह अस्पष्टता बनाए रखता है कि सम्पत्ति कहाँ रखी, सौंपी या त्यागी जाएगी।
- source_word: כְּבוֹדְכֶם
  choice: अपनी सम्पत्ति
  rationale: यद्यपि כָּבוֹד का सामान्य अर्थ ‘महिमा’ या ‘सम्मान’ है, इस प्रसंग में वह मूल्यवान वस्तुओं या धन-सम्पत्ति का ठोस बोध करा सकता है। मुख्य पाठ में प्रसंगानुकूल अर्थ रखा गया है और शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: न्याय-वाणी में כְּבוֹדְכֶם का ठोस या अमूर्त अर्थ
  choice: अपनी सम्पत्ति
  alternative: अपनी महिमा; अपना सम्मान
  rationale: संकट के समय शासक किसके पास सहायता के लिए भागेंगे और अपनी बहुमूल्य वस्तुएँ कहाँ छोड़ेंगे—इन समानांतर प्रश्नों में ‘सम्पत्ति’ प्रसंग के ठोस संकेत को स्पष्ट करता है। फिर भी मूल शब्द के ‘महिमा/सम्मान’ अर्थ को पादटिप्पणी में रखा गया है ताकि वास्तविक शाब्दिक अस्पष्टता न मिटे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर आलंकारिक प्रश्नों की संरचना सुरक्षित है। ‘आनेवाले’ मानक वर्तनी में संयुक्त रूप से रखा गया है।
