  text: मदमेना भाग गई है; गेबीम के निवासियों ने शरण ली है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू क्रिया का अर्थ यहाँ अनिश्चित है; इसका अनुवाद ‘सुरक्षा के लिए भाग गए हैं’ भी हो सकता है। इसमें बचाव के लिए की गई जल्दबाज़ी का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָדְדָה
  choice: भाग निकला है
  rationale: यह נדד का क़ाल पूर्ण रूप है और आक्रमण से उत्पन्न पलायन के संदर्भ में ‘भाग निकला है’ स्वाभाविक रूप से पूर्ण हुई कार्रवाई व्यक्त करता है।
- source_word: מַדְמֵנָה
  choice: मदमेना
  rationale: स्थान-नाम का अर्थानुवाद न करके उसका देवनागरी लिप्यंतरण किया गया है।
- source_word: יֹשְׁבֵי
  choice: के निवासी
  rationale: ישב का संबंध-वाचक कृदंत यहाँ सामूहिक रूप से किसी स्थान में रहने वालों को दर्शाता है; ‘के निवासी’ सहज और सटीक हिन्दी है।
- source_word: הַגֵּבִים
  choice: गेबीम
  rationale: स्थान-नाम को देवनागरी में लिप्यंतरित किया गया है; हिब्रू का निश्चित उपपद हिन्दी में अलग से व्यक्त करना आवश्यक नहीं है।
- source_word: הֵעִיזוּ
  choice: सुरक्षित स्थान की ओर भाग गए हैं
  rationale: इस कठिन हिफ़ील रूप को सैन्य भय और नगरों के पलायन के प्रसंग में सुरक्षा के लिए शीघ्र भागने के अर्थ में लिया गया है। यह भ्रामक अति-शाब्दिक अर्थ ‘बल दिखाया’ से बचता है, जबकि सुरक्षा की ओर की हड़बड़ी को बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों पूर्ण क्रियाओं को हिन्दी के पूर्ण वर्तमान से व्यक्त किया गया है, और छोटे समानांतर उपवाक्यों की काव्यात्मक गति बनाए रखी गई है।
