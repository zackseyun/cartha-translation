source:
  edition: WLC
  text: כַּ/אֲשֶׁר֙ מָצְאָ֣ה יָדִ֔/י לְ/מַמְלְכֹ֖ת הָ/אֱלִ֑יל וּ/פְסִ֣ילֵי/הֶ֔ם מִ/ירֽוּשָׁלִַ֖ם וּ/מִ/שֹּׁמְרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/010.yaml
  text: As my hand has reached the kingdoms of the idols[a], whose carved images were greater than those of Jerusalem and Samaria,
translation:
  language: hi
  text: जैसे मेरा हाथ मूर्तियों वाले राज्यों तक पहुँच गया है—जिनकी तराशी हुई प्रतिमाएँ यरूशलेम और सामरिया की प्रतिमाओं से बढ़कर थीं[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “जैसे मेरे हाथ ने मूर्तियों वाले राज्यों को पाया, और उनकी तराशी हुई प्रतिमाएँ यरूशलेम और सामरिया से।” इब्रानी वाक्य संक्षिप्त है; प्रसंग में इसका भाव तुलनात्मक है।'
    reason: मूल इब्रानी की अध्याहृत रचना और अधिक शाब्दिक विकल्प को सुरक्षित रखना।
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: जैसे
  rationale: यह अगले पद तक चलने वाली तुलना का आरम्भ करता है और अश्शूर के राजा की डींग का आधार प्रस्तुत करता है।
- source_word: מָצְאָה יָדִי
  choice: मेरे हाथ ने ... अपने वश में कर लिया
  rationale: शाब्दिक अर्थ ‘मेरे हाथ ने पाया’ है; साम्राज्यवादी विजय के प्रसंग में यह पहुँचकर अधिकार कर लेने का मुहावरा है। ‘हाथ’ का रूपक सुरक्षित रखते हुए हिन्दी में आशय स्पष्ट किया गया है।
- source_word: לְמַמְלְכֹת הָאֱלִיל
  choice: मूर्तियों के राज्यों को
  rationale: אֱלִיל तिरस्कारसूचक रूप से निर्बल या निरर्थक देव-प्रतिमाओं का बोध करा सकता है; ‘मूर्तियाँ’ यहाँ सहज और सीधा हिन्दी पर्याय है।
- source_word: וּפְסִילֵיהֶם
  choice: जिनकी खुदी हुई प्रतिमाएँ
  rationale: פְסִיל मूर्तिकार द्वारा गढ़ी या खोदी गई प्रतिमा है। ‘जिनकी’ राज्यों और उनकी प्रतिमाओं का संबंध स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִירוּשָׁלִַם וּמִשֹּׁמְרוֹן
  choice: यरूशलेम और सामरिया की प्रतिमाओं से बढ़कर
  rationale: מן को प्रसंगगत तुलनात्मक अर्थ में ‘से’ लिया गया है। इब्रानी के अध्याहृत तुलना-वाक्य को समझने योग्य बनाने के लिए ‘प्रतिमाओं’ और ‘बढ़कर’ को स्पष्ट किया गया है।
theological_decisions:
- issue: अंतिम वाक्यांश में निहित तुलना को स्पष्ट करना
  choice: ‘जिनकी खुदी हुई प्रतिमाएँ यरूशलेम और सामरिया की प्रतिमाओं से बढ़कर थीं’
  alternative: 'अधिक शाब्दिक: ‘और उनकी खुदी हुई प्रतिमाएँ यरूशलेम और सामरिया से’'
  rationale: इब्रानी वाक्य संक्षिप्त और अध्याहृत है, पर अगले पद सहित प्रसंग में अश्शूरी राजा उन राज्यों की प्रतिमाओं की तुलना यरूशलेम और सामरिया से कर रहा है। स्पष्ट अनुवाद मूल तर्क को सामने लाता है, जबकि पादटिप्पणी शाब्दिक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। अश्शूरी शासक की आत्मश्लाघा को व्यक्त करने के लिए ‘अपने वश में कर लिया’ चुना गया है। पद अगले पद में पूर्ण होने वाले वाक्य का आरम्भ है, इसलिए अंत में डैश और अल्पविराम-सदृश प्रवाह रखा गया है।
