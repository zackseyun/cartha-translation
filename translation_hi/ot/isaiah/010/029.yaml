  register: आधुनिक, गरिमापूर्ण और दृश्यात्मक हिन्दी। इब्रानी कविता के तीव्र सैनिक यात्रा-वृत्तांत को छोटे वाक्यखंडों में रखा गया है। नगरों के काँपने और भागने का मूल मानवीकरण बनाए रखा गया है। अंग्रेज़ी परामर्श-पाठ की दूसरी पादटिप्पणी वास्तव में ‘रामा काँपता है’ से संबंधित नहीं थी और केवल ‘शाऊल का गिबा’ के वैकल्पिक विन्यास को बताती थी; हिन्दी में वह विन्यास पहले ही स्वाभाविक और स्पष्ट है, इसलिए अनावश्यक पादटिप्पणी नहीं जोड़ी गई।
