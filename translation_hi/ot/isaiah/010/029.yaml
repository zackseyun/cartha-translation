- source_word: מָלוֹן לָנוּ
  choice: हमारे रात बिताने का स्थान है
  rationale: शाब्दिक ‘हमारे लिए ठहरने का स्थान’ का सहज हिन्दी रूप, जो रात के पड़ाव का ठोस अर्थ बनाए रखता है।
- source_word: חָרְדָה
  choice: काँप उठा है
  rationale: חרד के क़ाल पूर्ण स्त्रीलिंग रूप में भय से काँपने और पूर्ण घटना, दोनों को व्यक्त करता है।
- source_word: הָרָמָה
  choice: रामा
