  rationale: עבר के क़ाल पूर्ण 3 बहुवचन रूप को आक्रमणकारियों की पूरी हो चुकी और वर्तमान दृश्य में प्रासंगिक आगे बढ़त के रूप में व्यक्त करता है।
- source_word: מַעְבָּרָה
