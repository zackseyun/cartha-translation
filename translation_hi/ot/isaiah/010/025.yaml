  text: כִּי ע֖וֹד מְעַ֣ט מִזְעָ֑ר וְ/כָ֣לָה זַ֔עַם וְ/אַפִּ֖/י עַל תַּבְלִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/025.yaml
  text: For in just a very little while[a], indignation will come to an end, and my anger will be for their destruction.
translation:
  language: hi
  text: क्योंकि बस बहुत ही थोड़े समय में रोष समाप्त हो जाएगा, और मेरा क्रोध उनके विनाश के लिए होगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम इब्रानी संज्ञा दुर्लभ है और इसका सटीक अर्थ विवादित है। इसका अनुवाद “उनका सर्वनाश,” “उनका क्षय,” या “उनका अंत” भी किया जा सकता है; प्रसंग उत्पीड़क शत्रुओं के पतन की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले आश्वासन का कारण प्रस्तुत करता है और हिन्दी में वाक्य-संबंध स्वाभाविक रखता है।
- source_word: עוֹד מְעַט מִזְעָר
  choice: अब बस बहुत ही थोड़ा समय रह गया है
  rationale: दो निकटार्थक अल्पता-सूचक शब्दों के बलाघात और शेष रह गई अत्यल्प अवधि, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְכָלָה
  choice: समाप्त हो जाएगा
  rationale: भविष्यसूचक प्रसंग में क्रिया रोष के शीघ्र अंत को दर्शाती है।
- source_word: זַעַם
  choice: रोष
  rationale: ईश्वरीय अप्रसन्नता का गरिमापूर्ण शब्द है और अगले אַפִּי से शब्दगत भेद बनाए रखता है।
- source_word: וְאַפִּי
  choice: और मेरा क्रोध
  rationale: शाब्दिक रूप से 'मेरी नाक' वाला इब्रानी मुहावरा यहाँ स्पष्टतः क्रोध का अर्थ देता है और प्रथम पुरुष संबंध बनाए रखता है।
- source_word: עַל תַּבְלִיתָם
  choice: उनके विनाश पर टूट पड़ेगा
  rationale: עַל को लक्ष्य के रूप में और दुर्लभ תַּבְלִיתָם को उत्पीड़कों के विनाश के रूप में व्यक्त करता है; हिन्दी मुहावरा क्रोध के उस लक्ष्य की ओर मुड़ने को स्पष्ट करता है।
theological_decisions:
- issue: תַּבְלִיתָם में 'उनके' का संदर्भ
  choice: निकटवर्ती संदर्भ के शत्रुओं/उत्पीड़कों, विशेषकर अश्शूर, की ओर संकेत
  alternative: इसे बिना स्पष्ट व्यक्तिगत संदर्भ के सामान्यतः 'विनाश के लिए' समझना
  rationale: आसपास का प्रसंग प्रभु के रोष का अपनी प्रजा पर से समाप्त होकर अश्शूर के विरुद्ध होने की बात करता है; फिर भी मुख्य पाठ केवल 'उनके' कहकर मूल की संदर्भगत संक्षिप्तता बनाए रखता है।
- issue: अंतिम पदबंध का अर्थ
  choice: क्रोध उत्पीड़कों के विनाश को लक्ष्य बनाता है
  alternative: क्रोध स्वयं उनके अंत या क्षय में समाप्त होता है
  rationale: עַל के साथ प्रसंग शत्रुओं की पराजय की ओर संकेत करता है, पर दुर्लभ संज्ञा के कारण शब्दार्थ की अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सहज रूप। अर्धविराम अत्यल्प शेष समय और उसके बाद होने वाले परिणाम को जोड़ता है; 'रोष' और 'क्रोध' मूल के दो संबंधित किन्तु भिन्न शब्दों का अंतर बनाए रखते हैं।
