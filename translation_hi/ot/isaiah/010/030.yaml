- source_word: צַהֲלִי קוֹלֵךְ
  choice: ऊँचे स्वर से पुकार
  rationale: स्त्रीलिंग एकवचन आज्ञा के साथ ‘तेरी आवाज़’ का प्रयोग तीखी या गूँजती हुई पुकार का भाव देता है। हिंदी में यह अभिव्यक्ति उसकी तीव्रता और सुनाई देने वाले स्वर को स्वाभाविक ढंग से व्यक्त करती है, पर उसे आनंद या भय की पुकार के रूप में अनावश्यक रूप से निश्चित नहीं करती।
- source_word: בַּת גַּלִּים
  choice: गल्लীম की बेटी
  rationale: नगर अथवा उसके निवासियों को स्त्री के रूप में संबोधित करने वाली भविष्यद्वक्ताओं की रूपकात्मक शैली को बनाए रखा गया है।
- source_word: הַקְשִׁיבִי
  choice: ध्यान दे
  rationale: קשׁב की स्त्रीलिंग एकवचन आज्ञा केवल सुनने नहीं, बल्कि ध्यानपूर्वक सुनने का आह्वान करती है।
- source_word: לַיְשָׁה
  choice: लैशा
  rationale: इसे स्थान-नाम मानकर उसके मसोरेटी रूप का लिप्यंतरण किया गया है; इसे अधिक परिचित ‘लैश’ में नहीं बदला गया।
- source_word: עֲנִיָּה
  choice: दुःखियारी
  rationale: विशेषण गरीबी, दीनता, दुःख या उत्पीड़ित दशा सूचित कर सकता है। ‘दुःखियारी’ आक्रमण के प्रसंग में नगर की दयनीय दशा व्यक्त करता है, जबकि अधिक संकीर्ण अर्थ थोपने से बचता है।
- source_word: עֲנָתוֹת
  choice: अनातोत
  rationale: स्थान-नाम का हिंदी लिप्यंतरण; निकटवर्ती स्त्रीलिंग विशेषण के साथ इसे सीधे संबोधन के रूप में प्रस्तुत किया गया है।
