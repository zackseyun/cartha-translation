base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/022.yaml
  text: For though your people[a], Israel, are like the sand of the sea, only a remnant of them will return. A destruction is decreed[b], overflowing with righteousness.
translation:
  language: hi
  text: क्योंकि चाहे तेरी प्रजा, इस्राएल, समुद्र की बालू के समान हो, फिर भी उसमें से केवल बचे हुए लोग लौटेंगे। न्याय से परिपूर्ण विनाश ठहराया गया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या, “धार्मिकता से परिपूर्ण विनाश ठहराया गया है।”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם יִהְיֶה
  choice: क्योंकि चाहे … हो, फिर भी
  rationale: यहाँ पदबंध संख्या की विशालता और लौटने वाले थोड़े-से शेष लोगों के बीच रियायती विरोध प्रकट करता है; यह हिंदी संरचना उस प्रवाह को स्वाभाविक रूप से व्यक्त करती है।
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: तेरी प्रजा, इस्राएल
  rationale: दूसरे पुरुष एकवचन प्रत्यय और व्याख्यात्मक व्यक्तिवाचक नाम, दोनों को सीधे बनाए रखता है।
- source_word: כְּחוֹל הַיָּם
  choice: समुद्र की बालू के समान
  rationale: मूल उपमा और असंख्य जनसमूह की छवि सुरक्षित रहती है।
- source_word: שְׁאָר
  choice: बचे हुए लोग
  rationale: שְׁאָר उस शेष समुदाय को सूचित करता है जो पूरी प्रजा में से बचा है; आधुनिक हिंदी में यह ‘शेषांश’ की अपेक्षा अधिक सहज है।
- source_word: יָשׁוּב
  choice: लौटेंगे
  rationale: שוב के मूल अर्थ ‘लौटना/फिरना’ को बनाए रखता है और इसे केवल पश्चात्ताप या निर्वासन से वापसी तक सीमित नहीं करता। हिंदी में सामूहिक ‘लोग’ के अनुसार बहुवचन क्रिया प्रयुक्त है।
- source_word: בּוֹ
  choice: उसमें से
  rationale: इब्रानी में सर्वनाम एकवचन है और सामूहिक संज्ञा ‘प्रजा/इस्राएल’ की ओर लौटता है। ‘उसमें से’ हिंदी में अंशसूचक अर्थ स्पष्ट करता है।
- source_word: כִּלָּיוֹן
  choice: विनाश
  rationale: यह नाश या समाप्त कर देने की कार्रवाई को स्पष्ट करता है, पर ‘सर्वनाश’ कहकर शेष लोगों के बचने के साथ अनावश्यक तनाव उत्पन्न नहीं करता।
- source_word: חָרוּץ
  choice: निश्चित किया गया है
  rationale: निर्णीत और दृढ़ता से ठहराए गए न्यायिक परिणाम का भाव देता है।
- source_word: שׁוֹטֵף
  choice: उमड़ता हुआ
  rationale: शब्द में निहित बाढ़ या प्रबल प्रवाह की सजीव उपमा सुरक्षित रखता है।
- source_word: צְדָקָה
  choice: धार्मिकता
  rationale: यह ठहराए गए विनाश के नैतिक रूप से सही चरित्र को व्यक्त करता है; ‘न्याय’ भी प्रसंगानुकूल विकल्प है और पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: शेष लोगों के ‘लौटने’ का आशय
  choice: सामान्य और खुला ‘लौटेंगे’
  alternative: ‘पश्चात्ताप करेंगे’ अथवा विशेष रूप से ‘निर्वासन से लौटेंगे’
  rationale: इब्रानी क्रिया भौतिक वापसी और परमेश्वर की ओर फिरने, दोनों की प्रतिध्वनि दे सकती है। सामान्य अनुवाद भविष्यवाणी के इस तनाव को किसी एक अर्थ तक सीमित नहीं करता।
- issue: צְדָקָה का अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: दोनों अर्थ शब्द और प्रसंग में संभव हैं। मुख्य पाठ में परमेश्वर के निर्णय की नैतिक सच्चाई के लिए ‘धार्मिकता’ रखा गया है, जबकि न्यायिक बल को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिंदी। ‘तेरी’ मूल के एकवचन संबोधन को बनाए रखती है; ‘उमड़ता हुआ’ भविष्यवाणी की बाढ़-संबंधी काव्यात्मक छवि को सुरक्षित रखता है।
