  text: וְ/הָיָ֗ה כִּֽי יְבַצַּ֤ע אֲדֹנָ/י֙ אֶת כָּל מַֽעֲשֵׂ֔/הוּ בְּ/הַ֥ר צִיּ֖וֹן וּ/בִ/ירוּשָׁלִָ֑ם אֶפְקֹ֗ד עַל פְּרִי גֹ֨דֶל֙ לְבַ֣ב מֶֽלֶךְ אַשּׁ֔וּר וְ/עַל תִּפְאֶ֖רֶת ר֥וּם עֵינָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/012.yaml
  text: And it will happen that when the Lord has finished all his work on Mount Zion and in Jerusalem[a], I will punish the fruit of the greatness of the heart of the king of Assyria[c][b], and the splendor of his haughty eyes.
translation:
  language: hi
  text: और ऐसा होगा कि जब प्रभु सिय्योन पर्वत पर और यरूशलेम में अपना सारा कार्य पूरा कर लेगा, तब मैं अश्शूर के राजा के हृदय के घमंड के फल[a] और उसकी ऊँची आँखों की शान[b] को दण्ड दूँगा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अश्शूर के राजा के हृदय की महानता का फल।” यहाँ ‘हृदय की महानता’ घमंड या अहंकार को सूचित करती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसकी आँखों की ऊँचाई की शान,” अर्थात उसकी घमंड भरी दृष्टि।
    reason: lexical_alternative
  - marker: c
    text: “दण्ड दूँगा” का अनुवाद “जवाबदेह ठहराऊँगा” भी हो सकता है; इब्रानी क्रिया यहाँ न्याय के लिए दैवी निरीक्षण को सूचित करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: और ऐसा होगा कि जब
  rationale: यह भावी परिस्थिति का परिचय देता है और समयवाचक उपवाक्य को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: יְבַצַּע
  choice: पूरा कर चुकेगा
  rationale: पिएल रूप यहाँ किसी कार्य को पूर्ण करने का अर्थ देता है; भविष्य के संदर्भ में पूर्णता का भाव रखा गया है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह परमेश्वर की उपाधि अदोनाय है, इसलिए इसे प्रचलित और गरिमापूर्ण हिन्दी उपाधि से अनूदित किया गया है।
- source_word: כָּל מַעֲשֵׂהוּ
  choice: अपना सारा काम
  rationale: एकवचन सामूहिक पद परमेश्वर की समूची कार्रवाई को सूचित करता है।
- source_word: בְּהַר צִיּוֹן וּבִירוּשָׁלָם
  choice: सिय्योन पर्वत पर और यरूशलेम में
  rationale: पूर्वसर्ग का स्थानवाचक अर्थ और दोनों स्थानों के साथ स्वाभाविक हिन्दी विभक्तियाँ सुरक्षित रखी गई हैं।
- source_word: אֶפְקֹד עַל
  choice: दंड दूँगा
  rationale: न्याय के प्रसंग में क्रिया का अर्थ दैवी लेखा लेने अथवा दंड देने का है; मुख्य पाठ में स्पष्ट न्यायिक अर्थ रखा गया है।
- source_word: פְּרִי גֹדֶל לְבַב
  choice: हृदय के घमंड से निकले फल
  rationale: ‘फल’ का मूल रूपक सुरक्षित है, जबकि גֹדֶל לְבַב का नकारात्मक आशय स्वाभाविक हिन्दी में ‘घमंड’ से व्यक्त हुआ है।
- source_word: מֶלֶךְ אַשּׁוּר
  choice: अश्शूर का राजा
  rationale: निर्मित पदबंध का मानक हिन्दी रूप है और पारंपरिक बाइबलीय स्थान-नाम ‘अश्शूर’ रखा गया है।
- source_word: תִּפְאֶרֶת רוּם עֵינָיו
  choice: उसकी ऊँची आँखों का वैभव
  rationale: ‘वैभव’ और ‘आँखों की ऊँचाई’ की मूल छवि को बचाया गया है; पादटिप्पणी मुहावरे का घमंडी दृष्टि वाला अर्थ स्पष्ट करती है।
theological_decisions:
- issue: सिय्योन और यरूशलेम में प्रभु के कार्य को केवल स्थानवाचक रखना या ‘विरुद्ध’ कहना
  choice: 'स्थानवाचक: ‘सिय्योन पर्वत पर और यरूशलेम में’'
  alternative: ‘सिय्योन पर्वत और यरूशलेम के विरुद्ध’
  rationale: इब्रानी पूर्वसर्ग यहाँ स्थान को सूचित कर सकता है। ‘विरुद्ध’ जोड़ने से न्याय और पुनर्स्थापन के बीच पाठ में उपस्थित तनाव अनावश्यक रूप से एक दिशा में सुलझ जाता।
- issue: אֶפְקֹד के प्रथम पुरुष वक्ता की पहचान
  choice: ‘तब वह कहता है’ जोड़कर प्रभु के प्रथम पुरुष कथन को उद्धरण में रखा
  alternative: बिना किसी परिचायक के सीधे ‘तब मैं दंड दूँगा’
  rationale: इब्रानी में ‘प्रभु’ तीसरे पुरुष में आने के बाद अचानक प्रथम पुरुष क्रिया आती है। हिन्दी में वक्ता को स्पष्ट करते हुए उसी दैवी प्रथम पुरुष को सुरक्षित रखा गया है; इसे भविष्यवक्ता का कथन नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। ‘फल’ और ‘ऊँची आँखों’ जैसी मूल काव्यात्मक छवियाँ बचाई गई हैं, और कठिन शाब्दिक अर्थ पादटिप्पणियों में दिए गए हैं।
