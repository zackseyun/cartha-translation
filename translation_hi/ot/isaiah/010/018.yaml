base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/018.yaml
  text: And the glory of his forest and of his fruitful land he will consume[a], from soul to flesh, and it will be like the wasting away of a sick man.
translation:
  language: hi
  text: और वह उसके वन और उसकी उपजाऊ भूमि का वैभव प्राण से लेकर शरीर तक भस्म कर देगा; और उसका हाल ऐसा होगा जैसे कोई रोगी क्षीण होता जाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उसका हाल ऐसा होगा जैसे कोई क्षीण होता जाता है।” अंतिम इब्रानी वाक्यांश कठिन है, और कुछ विद्वान अंतिम शब्द का अर्थ अलग समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְבוֹד
  choice: वैभव
  rationale: यहाँ כָּבוֹד अश्शूर के वन और उपजाऊ भूमि की भव्यता तथा प्रचुरता को दर्शाता है; ‘वैभव’ रूपक का भार स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יַעְרוֹ
  choice: उसके वन
  rationale: יַעַר का सीधा अर्थ ‘वन’ है और प्रसंग में यह अश्शूर की शक्ति तथा बहुलता के चित्र का अंग है।
- source_word: וְכַרְמִלּוֹ
  choice: और उसकी उपजाऊ भूमि
  rationale: כַּרְמֶל यहाँ व्यक्तिवाचक ‘कर्मेल’ के बजाय फलदायी, उद्यान-सदृश भूमि का सामान्य अर्थ देता है और ‘वन’ के समानांतर है।
- source_word: מִנֶּפֶשׁ וְעַד בָּשָׂר
  choice: प्राण से लेकर शरीर तक
  rationale: शाब्दिक विस्तार और सम्पूर्ण विनाश का बोध दोनों सुरक्षित रहते हैं; इसे केवल ‘पूरी तरह’ कहकर मूल की मानवीय और काव्यात्मक तनावपूर्ण अभिव्यक्ति को समतल नहीं किया गया।
- source_word: יְכַלֶּה
  choice: भस्म कर देगा
  rationale: पिएल में כלה का अर्थ समाप्त करना, नष्ट करना या खपा देना है; निकटवर्ती अग्नि-चित्र के कारण ‘भस्म करना’ यहाँ स्वाभाविक और प्रसंगानुकूल है।
- source_word: כִמְסֹס נֹסֵס
  choice: मानो कोई रोगी घुलता जा रहा हो
  rationale: अत्यंत कठिन अंतिम वाक्यांश की पारंपरिक और प्रसंगसम्मत समझ क्रमिक क्षय की है; ‘घुलता जा रहा’ उस प्रक्रिया को सहज हिन्दी में व्यक्त करता है।
