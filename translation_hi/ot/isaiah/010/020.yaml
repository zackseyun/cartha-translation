id: ISA.10.20
reference: Isaiah 10:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא לֹֽא יוֹסִ֨יף ע֜וֹד שְׁאָ֤ר יִשְׂרָאֵל֙ וּ/פְלֵיטַ֣ת בֵּֽית יַעֲקֹ֔ב לְ/הִשָּׁעֵ֖ן עַל מַכֵּ֑/הוּ וְ/נִשְׁעַ֗ן עַל יְהוָ֛ה קְד֥וֹשׁ יִשְׂרָאֵ֖ל בֶּ/אֱמֶֽת׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/020.yaml
  text: And in that day the remnant of Israel and the survivors of the house of Jacob will no longer continue to lean on the one who struck them, but will lean on the LORD, the Holy One of Israel, in truth.
translation:
  language: hi
  text: उस दिन ऐसा होगा कि इस्राएल के बचे हुए लोग और याकूब के घराने के जीवित बचे लोग फिर कभी उसका सहारा नहीं लेंगे जिसने उन्हें मारा था, बल्कि वे यहोवा, इस्राएल के पवित्र परमेश्वर, का सच्चाई से सहारा लेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁאָר יִשְׂרָאֵל
  choice: इस्राएल के बचे हुए लोग
  rationale: ‘शेष’ की मूल धारणा को साधारण आधुनिक हिन्दी में स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: פְלֵיטַת בֵּית יַעֲקֹב
  choice: याकूब के घराने के जीवित बचे लोग
  rationale: פְלֵיטָה संकट से बच निकले अथवा जीवित बचे लोगों को सूचित करता है; यह पदबंध उस भाव को स्पष्ट रखता है।
- source_word: לְהִשָּׁעֵן עַל / וְנִשְׁעַן עַל
  choice: पर भरोसा रखना
  rationale: शाब्दिक अर्थ ‘पर टिकना/सहारा लेना’ है, पर प्रसंग में निर्भरता और विश्वास का भाव है; दोनों occurrences में समान अभिव्यक्ति रखी गई है।
- source_word: מַכֵּהוּ
  choice: जिसने उन्हें मारा था
  rationale: हिब्रू participle प्रहार करने वाले को दर्शाता है; सामूहिक ‘लोग’ के अनुरूप हिन्दी में बहुवचन सर्वनाम लिया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को सामान्य हिन्दी बाइबलीय रूप में सुरक्षित रखा गया है।
- source_word: בֶּאֱמֶת
  choice: सचमुच
  rationale: यह क्रियाविशेषण निष्ठापूर्वक/सच्चाई से भरोसा रखने का भाव दे सकता है; ‘सचमुच’ मूल की संक्षिप्तता और संभावित बलाघात को बनाए रखता है।
theological_decisions:
- issue: בֶּאֱמֶת का संबंध और अर्थ
  choice: ‘सचमुच’ को यहोवा पर भरोसा रखने की क्रिया के साथ रखा गया
  alternative: ‘सच्चाई/विश्वासयोग्यता के साथ’ या ‘सच्चे मन से’
  rationale: हिब्रू में यह अंत में है और भरोसा रखने की वास्तविकता अथवा निष्ठा पर बल दे सकता है। ‘सचमुच’ किसी विशिष्ट धार्मिक व्याख्या को आरोपित किए बिना इस खुलेपन को काफी हद तक बनाए रखता है।
- issue: מַכֵּהוּ की पहचान
  choice: 'अनाम रखा गया: ‘जिसने उन्हें मारा था’'
  alternative: अश्शूर का स्पष्ट नाम जोड़ना
  rationale: निकटवर्ती प्रसंग अश्शूर की ओर संकेत करता है, पर इस पद में नाम नहीं है; इसलिए पाठ की अंतर्निहित अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘फिर कभी ... न रखेंगे’ से לֹא יוֹסִיף עוֹד की पुनरावृत्ति समाप्त होने का भाव व्यक्त किया गया है। समान हिब्रू क्रिया के लिए दोनों खंडों में ‘भरोसा रखना’ दोहराकर विरोधी समानांतरता सुरक्षित रखी गई है।
