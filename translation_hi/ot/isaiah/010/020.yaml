- from: उस दिन ऐसा होगा कि इस्राएल के बचे हुए लोग और याकूब के घराने के जीवित बचे लोग फिर कभी उस पर भरोसा न रखेंगे जिसने उन्हें मारा था, बल्कि वे सचमुच इस्राएल के पवित्र परमेश्वर यहोवा पर भरोसा रखेंगे।
  to: उस दिन ऐसा होगा कि इस्राएल के बचे हुए लोग और याकूब के घराने के जीवित बचे लोग फिर कभी उसका सहारा नहीं लेंगे जिसने उन्हें मारा था, बल्कि वे यहोवा, इस्राएल के पवित्र परमेश्वर, का सच्चाई से सहारा लेंगे।
  rationale: The revision preserves the unnamed identity of the striker and the source’s parallel use of ‘lean on’ in both clauses. It replaces an insufficiently precise adverb with ‘सच्चाई से,’ retaining the Hebrew’s open sense of truthfulness/faithful reliance without adding doctrinal interpretation.
  reviewer_model: gpt-5.6-terra
