base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/001.yaml
  text: Woe to those who decree decrees of wickedness[a], and the writers who keep writing oppression[b],
translation:
  language: hi
  text: हाय उन पर जो अन्यायपूर्ण नियम ठहराते हैं[a], और उन पर जो दमनकारी आदेश लिखते हैं[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जो अनर्थ के नियम ठहराते हैं।” इब्रानी में “नियम ठहराने” वाली क्रिया और “नियम” संज्ञा एक ही मूल से बने हैं, जिससे पुनरुक्ति होती है। “अनर्थ” का अर्थ दुष्टता, अन्याय, या हानिकारक बुराई भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: जिस इब्रानी शब्द का अनुवाद “दमनकारी” किया गया है, उसका अर्थ कष्ट, विपत्ति, श्रमसाध्य बोझ, अथवा बोझिल अन्याय भी हो सकता है। यहाँ विधिक संदर्भ में इसका आशय ऐसे आदेशों से है जो लोगों पर अन्यायपूर्ण बोझ डालते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: हाय उन पर
  rationale: यह भविष्यद्वाणी में आनेवाले न्याय की गंभीर घोषणा है; ‘हाय उन पर’ आधुनिक हिन्दी में स्वाभाविक और प्रभावशाली है।
- source_word: הַחֹקְקִים חִקְקֵי
  choice: जो ... नियम बनाते हैं
  rationale: क्रिया और उसी मूल से बने संज्ञा-पद की इब्रानी पुनरुक्ति कानूनी नियम निर्धारित करने पर बल देती है। हिन्दी में ‘नियम बनाते हैं’ उसका विधिक अर्थ स्वाभाविक रूप से व्यक्त करता है; पुनरुक्ति का संकेत पादटिप्पणी में रखा गया है।
- source_word: אָוֶן
  choice: अन्याय
  rationale: यहाँ शब्द उन नियमों की नैतिक बुराई और छलपूर्ण अन्याय को दर्शाता है। अगले पदों के न्यायिक-सामाजिक संदर्भ में ‘अन्याय’ उपयुक्त है, जबकि शब्द के व्यापक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: וּמְכַתְּבִים ... כִּתֵּבוּ
  choice: और जो ... आदेश लिखते रहते हैं
  rationale: लिखने से जुड़े दोनों रूप लिखित शासकीय निर्णय तैयार करने की लगातार क्रिया पर बल देते हैं। ‘लिखते रहते हैं’ इस तीव्र और जारी गतिविधि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עָמָל
  choice: उत्पीड़न
  rationale: शब्द कष्ट, विपत्ति या बोझिल अन्याय का अर्थ दे सकता है। यहाँ लिखित नियमों द्वारा निर्बलों को हानि पहुँचाने के संदर्भ में ‘उत्पीड़न’ सबसे सटीक है।
theological_decisions:
- issue: भ्रष्ट नियमों की नैतिक प्रकृति
  choice: ‘अन्याय के नियम’—शासकों के कार्य को नैतिक और न्यायिक भ्रष्टता के रूप में प्रस्तुत किया गया है।
  alternative: ‘दुष्टता के नियम’ या ‘अनर्थ के नियम’
  rationale: ‘अन्याय’ निकटवर्ती संदर्भ में गरीबों और असहायों से न्याय छीनने के सामाजिक-कानूनी अपराध को स्पष्ट करता है, पर इब्रानी शब्द के व्यापक नैतिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और भविष्यद्वाणी के न्याय-संदेश के अनुरूप रखी गई है। ‘विधि बनाना’ जैसे आधुनिक संस्थागत शब्द से बचते हुए ‘नियम बनाते हैं’ चुना गया है। दूसरे खंड में ‘आदेश’ जोड़ा गया है ताकि लिखी जानेवाली दमनकारी कानूनी सामग्री हिन्दी में स्पष्ट हो; यह संदर्भगत विस्तार है।
