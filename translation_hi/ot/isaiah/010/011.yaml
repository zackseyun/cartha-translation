    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... न करूँगा?
  rationale: यह अलंकारिक प्रश्न है, जिसका अपेक्षित उत्तर हाँ है; हिन्दी में यह रचना उसके भविष्यकालीन और दृढ़ भाव को स्वाभाविक रूप से रखती है।
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: जैसा ... वैसा ही
  rationale: यह तुलना सामरिया पर की गई कार्रवाई और यरूशलेम पर होने वाली कार्रवाई के बीच स्पष्ट समानता दिखाती है।
- source_word: עָשִׂיתִי
  choice: मैंने ... किया
  rationale: पूर्ण क्रिया सामरिया के विरुद्ध पहले ही पूरी हो चुकी कार्रवाई को व्यक्त करती है।
- source_word: לְשֹׁמְרוֹן ... לִירוּשָׁלִַם
  choice: सामरिया ... के साथ; यरूशलेम ... के साथ
  rationale: इस प्रसंग में עשה ל प्रभावित लक्ष्य के प्रति कार्रवाई बताता है। हिन्दी में ‘के साथ किया’ मूल की अपेक्षाकृत खुली अभिव्यक्ति को बनाए रखते हुए स्वाभाविक है।
- source_word: אֱלִילֶיהָ
  choice: उसकी मूरतों
  rationale: אֱלִילִים झूठे या निकम्मे देव-प्रतिरूपों के लिए प्रयुक्त होता है। ‘मूरतें’ यहाँ उपासना की वस्तुओं का अर्थ स्पष्ट करता है और दूसरे इब्रानी शब्द से भेद भी रखता है।
- source_word: אֶעֱשֶׂה
  choice: मैं ... करूँगा
  rationale: प्रथम पुरुष अपूर्ण क्रिया यहाँ भावी और अभिप्रेत कार्रवाई व्यक्त करती है।
- source_word: עֲצַבֶּיהָ
  choice: उसकी मूर्तियों
  rationale: עֲצַבִּים निर्मित देव-प्रतिमाओं या मूर्तियों को सूचित करता है। ‘मूर्तियाँ’ सटीक और आधुनिक मानक हिन्दी है।
theological_decisions:
- issue: सामरिया और यरूशलेम के लिए प्रयुक्त दो अलग इब्रानी मूर्ति-संज्ञाएँ
  choice: मुख्य पाठ में क्रमशः ‘मूरतों’ और ‘मूर्तियों’ द्वारा हल्का शब्दगत भेद रखना
  alternative: दोनों के लिए एक ही शब्द ‘मूर्तियों’ का प्रयोग करना
  rationale: इब्रानी में אֱלִילִים और עֲצַבִּים अलग शब्द हैं। हिन्दी के निकटार्थी शब्द तुलना की समानांतरता बनाए रखते हुए उस वास्तविक शब्दगत भेद को भी सुनाई देते हैं; पादटिप्पणी इसे स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट अलंकारिक प्रश्न। ‘जैसा ... वैसा ही’ मूल तुलना को स्वाभाविक ढंग से व्यक्त करता है। ‘मूरतों/मूर्तियों’ का हल्का भेद मूल के दो समानार्थी, पर अलग, इब्रानी शब्दों को दर्शाता है।
