  text: क्या मैं यरूशलेम और उसकी मूर्तियों के साथ वैसा ही न करूँगा, जैसा मैंने सामरिया और उसकी मूरतों के साथ किया?[a]
  philosophy: optimal-equivalence
  footnotes:
