source:
  edition: WLC
  text: וְ/עוֹרֵ֨ר עָלָ֜י/ו יְהוָ֤ה צְבָאוֹת֙ שׁ֔וֹט כְּ/מַכַּ֥ת מִדְיָ֖ן בְּ/צ֣וּר עוֹרֵ֑ב וּ/מַטֵּ֨/הוּ֙ עַל הַ/יָּ֔ם וּ/נְשָׂא֖/וֹ בְּ/דֶ֥רֶךְ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/026.yaml
  text: And Yahweh of hosts will stir up a whip against him[a], as at the striking down of Midian at the rock of Oreb; and his staff will be over the sea[c][b], and he will lift it as in the way of Egypt.
translation:
  language: hi
  text: और सेनाओं का याहवे उसके विरुद्ध कोड़ा उठाएगा,[a] जैसे ओरेब की चट्टान पर मिद्यान पर प्रहार हुआ था;[b] उसका डंडा समुद्र के ऊपर होगा, और वह उसे मिस्र की रीति से उठाएगा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके विरुद्ध कोड़ा चलाएगा।” इब्रानी क्रिया किसी वस्तु को जगाने, सक्रिय करने, या उभारने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: “ओरेब की चट्टान” न्यायियों 7:25 की याद दिलाती है, जहाँ मिद्यानी अगुआ ओरेब मारा गया था।
    reason: cross_reference
  - marker: c
    text: शाब्दिक रूप से, “मिस्र के मार्ग के अनुसार”; सम्भवतः यह निर्गमन के समय समुद्र पर डंडा उठाए जाने की ओर संकेत है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְעוֹרֵר
  choice: उठाएगा
  rationale: हिफ़ील रूप किसी साधन को सक्रिय करने या उठाने का भाव देता है; ‘कोड़ा उठाएगा’ हिन्दी में न्याय के साधन को काम में लाने का स्वाभाविक चित्र प्रस्तुत करता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: ईश्वरीय व्यक्तिगत नाम को ‘याहवे’ और צְבָאוֹת को ‘सेनाओं’ से व्यक्त किया गया है, जिससे उसके अधीन सामर्थ्यवान दलों का भाव स्पष्ट रहता है।
- source_word: שׁוֹט
  choice: कोड़ा
  rationale: यह प्रहार करने के ठोस साधन को दर्शाता है और दंड के रूपक को बनाए रखता है।
- source_word: כְּמַכַּת מִדְיָן
  choice: जैसे उसने ... मिद्यान को मारा था
  rationale: מַכָּה के प्रहार/मारने के भाव को बनाए रखते हुए हिन्दी में ऐतिहासिक तुलना को सहज वाक्य के रूप में रखा गया है; ‘संहार’ जैसे अधिक तीव्र अर्थ को नहीं जोड़ा गया।
- source_word: בְּצוּר עוֹרֵב
  choice: ओरेब की चट्टान पर
  rationale: स्थान-सूचक अर्थ और न्यायियों 7:25 के ऐतिहासिक संकेत दोनों सुरक्षित रहते हैं।
- source_word: וּמַטֵּהוּ
  choice: उसका डंडा
  rationale: מַטֶּה के लिए ‘डंडा’ सामान्य और ठोस हिन्दी है। ‘उसका’ मूल पाठ की सर्वनाम-संबंधी संभावित अस्पष्टता को बनाए रखता है।
- source_word: עַל הַיָּם
  choice: समुद्र के ऊपर
  rationale: स्थानिक चित्र को सीधे सुरक्षित रखता है और निर्गमन की घटना की ओर संकेत करता है, बिना क्रिया को पाठ में जोड़े।
- source_word: וּנְשָׂאוֹ
  choice: और वह उसे ... उठाएगा
  rationale: נשׂא का मूल अर्थ उठाना है; ‘उसे’ डंडे की ओर संकेत करता है, जबकि कर्ता को सर्वनाम के रूप में रहने देता है।
- source_word: בְּדֶרֶךְ מִצְרָיִם
  choice: मिस्र के समय की रीति से
  rationale: דרך को शाब्दिक ‘मार्ग’ बनाने के बजाय कार्य करने की रीति के रूप में व्यक्त किया गया है; ‘मिस्र के समय’ निर्गमन-संबंधी ऐतिहासिक प्रसंग को स्वाभाविक हिन्दी में संकेत करता है।
theological_decisions:
- issue: दूसरे खंड में सर्वनामों का संदर्भ
  choice: ‘उसका डंडा ... वह उसे उठाएगा’ द्वारा मूल सर्वनाम रखे गए हैं; मुख्य प्रवाह में इन्हें याहवे की कार्रवाई के रूप में समझा जा सकता है।
  alternative: इन्हें अश्शूर के डंडे का संदर्भ माना जा सकता है, जिसे उसी के विरुद्ध मोड़ा जाता है।
  rationale: समुद्र और मिस्र का उल्लेख याहवे के निर्गमनकालीन कार्य की ओर दृढ़ संकेत करता है, फिर भी हिन्दी में संज्ञा दोहराकर मूल की संभावित तनावपूर्ण अस्पष्टता समाप्त नहीं की गई।
- issue: ऐतिहासिक संकेत
  choice: पद में मिद्यान की पराजय और समुद्र पर मिस्र से छुटकारे—दोनों की स्मृति सुरक्षित रखी गई है।
  alternative: इन वाक्यांशों को केवल सामान्य युद्ध और भौगोलिक यात्रा के रूप में पढ़ना।
  rationale: ओरेब की चट्टान और समुद्र पर उठाया गया डंडा क्रमशः न्यायियों 7:25 और निर्गमन की घटनाओं की ओर संकेत करते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-अनुकूल शैली अपनाई गई है। ‘याहवे’ व्यक्तिगत ईश्वरीय नाम को सुरक्षित रखता है। वाक्य ने काव्यात्मक समानांतरता और ऐतिहासिक संकेत बनाए रखे हैं; सर्वनामों की वास्तविक अस्पष्टता को अनावश्यक व्याख्या से समाप्त नहीं किया गया।
