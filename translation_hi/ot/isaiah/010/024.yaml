id: ISA.10.24
reference: Isaiah 10:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֞ר אֲדֹנָ֤/י יְהוִה֙ צְבָא֔וֹת אַל תִּירָ֥א עַמִּ֛/י יֹשֵׁ֥ב צִיּ֖וֹן מֵֽ/אַשּׁ֑וּר בַּ/שֵּׁ֣בֶט יַכֶּ֔/כָּה וּ/מַטֵּ֥/הוּ יִשָּֽׂא עָלֶ֖י/ךָ בְּ/דֶ֥רֶךְ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/024.yaml
  text: 'Therefore thus says the Lord GOD of hosts: Do not fear[a], my people who dwell in Zion, because of Assyria. He will strike you with the rod, and he will lift up his staff against you in the manner of Egypt.'
translation:
  language: hi
  text: 'इसलिए सेनाओं के प्रभु याहवे यों कहते हैं: “हे मेरी प्रजा, जो सिय्योन में रहती है, अश्शूर से मत डर। वह तुझे छड़ी से मारेगा और मिस्र की रीति के अनुसार[a] तेरे विरुद्ध अपना डंडा उठाएगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मिस्र के मार्ग में।” संभवतः यह मिस्र द्वारा इस्राएल पर किए गए पुराने अत्याचार की ओर संकेत है।
    reason: मूल पदबंध में ‘रीति’ और ‘मार्ग’ दोनों अर्थ संभव हैं; ऐतिहासिक संकेत संभावित है, पर उसे निर्विवाद बनाना उचित नहीं।
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले प्रसंग से निकले निष्कर्ष को व्यक्त करने वाला संबंधसूचक शब्द है।
- source_word: כֹּה אָמַר
  choice: यों कहते हैं
  rationale: भविष्यद्वक्ता के संदेश की प्रचलित उद्घोषणा को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: सेनाओं के प्रभु याहवे
  rationale: אֲדֹנָי को ‘प्रभु’, परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ और צְבָאוֹת को ‘सेनाओं के’ रूप में रखते हुए संयुक्त उपाधि की संरचना सुरक्षित रखी गई है।
- source_word: אַל תִּירָא
  choice: मत डर
  rationale: एकवचन में दिए गए सीधे निषेध और उसके आश्वासनपूर्ण बल को बनाए रखता है।
- source_word: עַמִּי יֹשֵׁב צִיּוֹן
  choice: हे मेरी प्रजा, जो सिय्योन में रहती है
  rationale: इब्रानी में एकवचन रूप सामूहिक प्रजा को संबोधित करता है; हिन्दी में ‘प्रजा’ के साथ एकवचन क्रिया स्वाभाविक है।
- source_word: מֵאַשּׁוּר
  choice: अश्शूर से
  rationale: भय के कारण अथवा विषय के रूप में अश्शूर को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בַּשֵּׁבֶט יַכֶּכָּה
  choice: वह तुझे छड़ी से मारेगा
  rationale: करणवाचक पूर्वसर्ग, प्रहार के साधन और भविष्यसूचक अपूर्ण क्रिया—तीनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: וּמַטֵּהוּ יִשָּׂא עָלֶיךָ
  choice: तेरे विरुद्ध अपना डंडा उठाएगा
  rationale: नियंत्रण अथवा दमन के डंडे को किसी के विरुद्ध धमकीपूर्वक उठाने की सजीव छवि बनाए रखता है।
- source_word: בְּדֶרֶךְ מִצְרָיִם
  choice: मिस्र की रीति के अनुसार
  rationale: ‘मार्ग/रीति’ के अर्थक्षेत्र में यहाँ मिस्र के पुराने दमन से तुलना सबसे संभावित है; शाब्दिक भौगोलिक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को छिपाने के बजाय लिप्यंतरित किया गया है, जबकि אֲדֹנָי की अलग उपाधि ‘प्रभु’ के रूप में बनी रहती है।
- issue: בְּדֶרֶךְ מִצְרָיִם में ऐतिहासिक संकेत
  choice: मिस्र की रीति के अनुसार
  alternative: मिस्र के मार्ग में
  rationale: मुख्य पाठ में मिस्र द्वारा इस्राएल के पूर्व दमन की तुलना व्यक्त की गई है, पर मूल पदबंध की ‘मार्ग’ संबंधी वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण भविष्यद्वक्ताई स्वर रखा गया है। सामूहिक ‘प्रजा’ को मूल के अनुसार एकवचन ‘तू’ रूपों—‘मत डर’, ‘तुझे’, ‘तेरे’—से संबोधित किया गया है। ‘अश्शूर’ और ‘सिय्योन’ प्रचलित हिन्दी बाइबलीय नामरूप हैं।
