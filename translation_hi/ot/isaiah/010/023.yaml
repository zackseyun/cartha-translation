id: ISA.10.23
reference: Isaiah 10:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֥י כָלָ֖ה וְ/נֶחֱרָצָ֑ה אֲדֹנָ֤/י יְהוִה֙ צְבָא֔וֹת עֹשֶׂ֖ה בְּ/קֶ֥רֶב כָּל הָ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/023.yaml
  text: For the Lord Yahweh of hosts is carrying out a complete destruction[a], one that has been decreed, in the midst of all the earth.
translation:
  language: hi
  text: क्योंकि सेनाओं का प्रभु यहोवा सारी पृथ्वी[a] के बीच में एक पूर्ण, निर्धारित विनाश को कार्यान्वित कर रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सारा देश।’ इब्रानी אֶרֶץ का अर्थ संदर्भ के अनुसार ‘पृथ्वी’ या ‘देश’ हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार प्रस्तुत करता है; इसलिए कारणसूचक संबंध स्पष्ट रखा गया है।
- source_word: כָלָה
  choice: पूर्ण विनाश
  rationale: न्याय के इस संदर्भ में यह शब्द किसी बात के पूर्ण अंत या समाप्त कर दिए जाने को दर्शाता है; ‘पूर्ण विनाश’ अंतिमता और दंड, दोनों भावों को व्यक्त करता है।
- source_word: וְנֶחֱרָצָה
  choice: ठहराया हुआ
  rationale: निफ़अल रूप किसी निश्चित या निर्णीत बात को दर्शाता है और स्त्रीलिंग संज्ञा כָלָה का विशेषण है; हिंदी में इसे विनाश के लिए प्रयुक्त विशेषण के रूप में स्वाभाविक ढंग से रखा गया है।
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: सेनाओं का प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’, परमेश्वर के व्यक्तिगत नाम יהוה को ‘यहोवा’, और צְבָאוֹת को व्यापक पारंपरिक अर्थ में ‘सेनाओं का’ अनूदित किया गया है।
- source_word: עֹשֶׂה
  choice: कर रहा है
  rationale: वर्तमान कृदंत न्याय के कार्य को सक्रिय या आसन्न रूप में प्रस्तुत करता है; यह हिंदी में चल रही निश्चित कार्रवाई को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּקֶרֶב
  choice: के बीच
  rationale: यह पूरे क्षेत्र के भीतर घटित होने का स्थानिक भाव बनाए रखता है।
- source_word: כָּל הָאָרֶץ
  choice: सारी पृथ्वी
  rationale: אֶרֶץ का अर्थ ‘पृथ्वी’ या ‘देश/भूमि’ हो सकता है। मुख्य पाठ में व्यापक अर्थ चुना गया है, जबकि संदर्भगत संकीर्ण अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में יהוה व्यक्तिगत नाम के रूप में उपस्थित है; ‘यहोवा’ उस नाम को सामान्य उपाधि में बदले बिना स्पष्ट रूप से प्रस्तुत करता है।
- issue: הָאָרֶץ का भौगोलिक विस्तार
  choice: सारी पृथ्वी
  alternative: सारा देश
  rationale: शब्द में विश्वव्यापी और किसी विशेष देश से संबंधित, दोनों अर्थ संभव हैं। व्यापक अर्थ मुख्य पाठ में रखा गया है और तात्कालिक ऐतिहासिक संदर्भ के कारण संकीर्ण अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य-क्रम हिंदी की स्वाभाविकता के अनुसार है, पर ‘ठहराया हुआ पूर्ण विनाश’ मूल के निर्णीत और संपूर्ण न्याय—दोनों पक्षों को बनाए रखता है।
