revisions:
- from: क्योंकि सेनाओं का प्रभु यहोवा सारी पृथ्वी[a] के बीच ठहराया हुआ पूर्ण विनाश कर रहा है।
  to: क्योंकि सेनाओं का प्रभु यहोवा सारी पृथ्वी[a] के बीच में एक पूर्ण, निर्धारित विनाश को कार्यान्वित कर रहा है।
  rationale: The revision clarifies that the destruction is both complete and decreed, uses idiomatic Hindi for carrying out the decreed judgment, and corrects the singular land alternative in the footnote. It retains the ambiguity of אֶרֶץ and preserves the source’s causal and participial force.
