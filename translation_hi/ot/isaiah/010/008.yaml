  text: כִּ֖י יֹאמַ֑ר הֲ/לֹ֥א שָׂרַ֛/י יַחְדָּ֖ו מְלָכִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/008.yaml
  text: For he says[b][a], “Are not my commanders all kings?”
translation:
  language: hi
  text: क्योंकि वह कहता है, “क्या मेरे सभी सेनापति राजा नहीं हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יֹאמַר
  choice: वह कहता है
  rationale: भविष्यत्सूचक प्रवचन में यह अपूर्ण क्रिया वर्तमान भाव में घमंड भरी उक्ति का परिचय देती है।
- source_word: הֲלֹא
  choice: क्या ... नहीं हैं?
  rationale: यह सकारात्मक उत्तर की अपेक्षा रखने वाले आलंकारिक प्रश्न को सीधे और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שָׂרַי
  choice: मेरे सेनापति
  rationale: शब्द का अर्थ प्रधान, शासक, अधिकारी या सेनापति हो सकता है; अश्शूरी सैन्य-साम्राज्यिक संदर्भ में ‘सेनापति’ सर्वाधिक उपयुक्त है और वंशानुगत राजकुमार का भ्रामक अर्थ नहीं देता।
- source_word: יַחְדָּו
  choice: सभी
  rationale: शाब्दिक अर्थ ‘एक साथ’ है, पर यहाँ यह समूचे वर्ग पर बल देता है—वे सब समान रूप से राजा जैसे हैं।
- source_word: מְלָכִים
  choice: राजा
  rationale: यह मूल संज्ञा का सीधा अर्थ है और अधीनस्थ सेनापतियों की राजा-समान हैसियत के दावे को सुरक्षित रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण है। आलंकारिक प्रश्न तथा अश्शूर के राजा का घमंड सुरक्षित रखा गया है। ‘सेनापति’ प्रसंगगत अर्थ देता है; इस छोटे पद में पाठ को बाधित न करने के लिए कोई पाद-टिप्पणी आवश्यक नहीं मानी गई।
