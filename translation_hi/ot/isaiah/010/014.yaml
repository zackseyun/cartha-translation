language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תִּמְצָ֨א כַ/קֵּ֤ן יָדִ/י֙ לְ/חֵ֣יל הָֽ/עַמִּ֔ים וְ/כֶ/אֱסֹף֙ בֵּיצִ֣ים עֲזֻב֔וֹת כָּל הָ/אָ֖רֶץ אֲנִ֣י אָסָ֑פְתִּי וְ/לֹ֤א הָיָה֙ נֹדֵ֣ד כָּנָ֔ף וּ/פֹצֶ֥ה פֶ֖ה וּ/מְצַפְצֵֽף׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/014.yaml
  text: My hand found the wealth of the peoples as one finds a nest[a]; and as one gathers abandoned eggs, I gathered all the earth, and there was none that fluttered a wing, or opened a mouth[b], or chirped.
translation:
  language: hi
  text: मेरे हाथ ने लोगों की धन-संपत्ति[a] को ऐसे पा लिया, जैसे कोई घोंसला पा ले; और जैसे कोई छोड़े हुए अंडे बटोर ले, वैसे ही मैंने सारी पृथ्वी[b] को बटोर लिया। न कोई पंख फड़फड़ाता था, न मुँह खोलता था, न चहचहाता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जातियों की दौलत।’ हिब्रू חַיִל का अर्थ धन-संपत्ति, संसाधन, सामर्थ्य या सैन्य-बल हो सकता है; यहाँ प्रसंग सहजता से लूटी गई संपत्ति या धन की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सारे देश को।’ हिब्रू אֶרֶץ का अर्थ ‘पृथ्वी’ या ‘देश/भूमि’ हो सकता है; यहाँ ‘पृथ्वी’ रखा गया है, क्योंकि वक्ता का घमंडी दावा जानबूझकर सार्वभौमिक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּמְצָא
  choice: पा लिया
  rationale: מצא का मूल अर्थ ‘पाना’ है। ‘पा लिया’ विजय में सहज प्राप्ति के घमंडी भाव को बनाए रखता है और ‘छीन लिया’ जैसा अधिक व्याख्यात्मक अर्थ नहीं जोड़ता।
- source_word: כַקֵּן
  choice: जैसे कोई घोंसला पा ले
  rationale: हिब्रू का संक्षिप्त उपमान हिन्दी में स्वाभाविक ढंग से खोला गया है; इससे आसानी से मिले, असुरक्षित घोंसले का चित्र स्पष्ट रहता है।
- source_word: יָדִי
  choice: मेरे हाथ ने
  rationale: शाब्दिक चित्र वक्ता की अपनी शक्ति और कार्य-क्षमता के घमंड को व्यक्त करता है।
- source_word: לְחֵיל הָעַמִּים
  choice: लोगों की धन-संपत्ति
  rationale: חַיִל के अर्थ धन, संसाधन, सामर्थ्य या सेना हो सकते हैं। घोंसले, अंडों और बटोरने के प्रसंग में विजय के द्वारा सहजता से हथियाई गई संपत्ति सर्वाधिक उपयुक्त है; עַמִּים के लिए ‘लोगों’ रखा गया है।
- source_word: וְכֶאֱסֹף בֵּיצִים עֲזֻבוֹת
  choice: और जैसे कोई छोड़े हुए अंडे बटोर ले
  rationale: עֲזֻבוֹת असुरक्षित छोड़ दिए गए अंडों को दर्शाता है। ‘बटोर ले’ सहज अधिग्रहण और आगे आने वाले אָסַפְתִּי की पुनरावृत्ति दोनों को बनाए रखता है।
- source_word: כָּל הָאָרֶץ
  choice: सारी पृथ्वी
  rationale: אֶרֶץ का अर्थ ‘भूमि/देश’ या ‘पृथ्वी’ हो सकता है। यहाँ साम्राज्यवादी घमंड के जानबूझकर सार्वभौमिक दावे को ‘सारी पृथ्वी’ व्यक्त करता है।
- source_word: אָסַפְתִּי
  choice: मैंने ... बटोर लिया
  rationale: אסף के इकट्ठा करने के अर्थ को अंडे बटोरने के रूपक से जोड़े रखता है।
- source_word: וְלֹא הָיָה נֹדֵד כָּנָף
  choice: न कोई पंख फड़फड़ाता था
  rationale: नֹדֵד के गति करने या फड़फड़ाने के भाव को पक्षी-विषयक चित्र में स्वाभाविक हिन्दी मिली है।
- source_word: וּפֹצֶה פֶה
  choice: न मुँह खोलता था
  rationale: ‘मुँह खोलना’ मूल चित्र को सुरक्षित रखता है और इसे केवल मानवीय विरोध के रूप में व्याख्यायित नहीं करता।
- source_word: וּמְצַפְצֵף
  choice: न चहचहाता था
  rationale: यह क्रिया पक्षी की हल्की आवाज़ या चहचहाहट बताती है। चयन घोंसले, अंडों और पंखों की निरंतर छवि को बनाए रखता है।
