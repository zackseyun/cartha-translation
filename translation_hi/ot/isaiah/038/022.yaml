source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר חִזְקִיָּ֖הוּ מָ֣ה א֑וֹת כִּ֥י אֶעֱלֶ֖ה בֵּ֥ית יְהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/022.yaml
  text: And Hezekiah said[a], “What is the sign that I shall go up to the house of Yahweh?”
translation:
  language: hi
  text: तब हिजकिय्याह ने कहा, “कौन-सा चिन्ह होगा कि मैं याहवे के भवन में जाऊँगा?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमागत कथा को आगे बढ़ाता है। ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है, बिना कारणात्मक संबंध जोड़े।
- source_word: חִזְקִיָּהוּ
  choice: हिजकिय्याह
  rationale: यह हिब्रू नाम का हिन्दी बाइबलीय परंपरा में प्रचलित और पहचानने योग्य रूप है।
- source_word: מָה אוֹת
  choice: क्या चिन्ह
  rationale: מָה पहचान पूछता है और אוֹת पुष्टि करने वाले ‘चिन्ह’ को दर्शाता है। ‘क्या चिन्ह’ मूल प्रश्न की सीधी और स्पष्ट अभिव्यक्ति है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי उस बात की विषय-वस्तु प्रस्तुत करता है जिसकी पुष्टि चिन्ह से होगी; हिन्दी में ‘कि’ इसका स्वाभाविक समकक्ष है।
- source_word: אֶעֱלֶה
  choice: मैं ... जाऊँगा
  rationale: क़ाल अपूर्ण यहाँ भावी क्रिया बताता है। עלה में ऊपर जाने का भाव है, किंतु हिन्दी में मंदिर जाने के लिए ‘ऊपर जाऊँगा’ अस्वाभाविक और भ्रामक हो सकता है; ‘जाऊँगा’ संदर्भगत गंतव्य को स्पष्ट और सहज रखता है।
- source_word: בֵּית יְהוָה
  choice: याहवे के भवन में
  rationale: ‘भवन’ हिब्रू בֵּית के रूपक और मंदिर-संदर्भ दोनों को बनाए रखता है; ‘में’ हिन्दी में गंतव्य के साथ स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: वाचा-संबंधी दिव्य नाम को पदवी से बदलने के बजाय हिन्दी में उसके प्रचलित लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चतुराक्षरीय निजी नाम सीधे आया है। ‘याहवे’ नाम को नाम के रूप में सुरक्षित रखता है और उसे पदवी में नहीं बदलता।
- issue: हिजकिय्याह के प्रश्न में भावी कथन की निश्चितता
  choice: कि मैं ... जाऊँगा
  alternative: कि मैं ... जा सकूँगा
  rationale: אֶעֱלֶה को सामान्य भावी कथन के रूप में रखा गया है। ‘जा सकूँगा’ सामर्थ्य या अनुमति का अर्थ जोड़ देता, जो मूल रूप में स्पष्ट नहीं है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘याहवे के भवन’ मूल पदबंध को बनाए रखता है, जबकि ‘मंदिर’ की अपेक्षा हिब्रू रूपक के अधिक निकट है। प्रश्न की वैकल्पिक अनिश्चित/अस्तित्वसूचक व्याख्या पादटिप्पणी में सुरक्षित रखी गई है।
