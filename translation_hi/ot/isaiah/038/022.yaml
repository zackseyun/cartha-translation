  to: तब हिजकिय्याह ने कहा, “कौन-सा चिन्ह होगा कि मैं याहवे के भवन में जाऊँगा?”
  rationale: The demonstrative “इसका” and its footnote have been removed because no corresponding referent appears in the Hebrew text. The revised question remains natural Hindi and preserves the request for a confirming sign concerning Hezekiah’s future going to Yahweh’s house.
