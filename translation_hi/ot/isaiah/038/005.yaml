  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הָל֞וֹךְ וְ/אָמַרְתָּ֣ אֶל חִזְקִיָּ֗הוּ כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵי֙ דָּוִ֣ד אָבִ֔י/ךָ שָׁמַ֨עְתִּי֙ אֶת תְּפִלָּתֶ֔/ךָ רָאִ֖יתִי אֶת דִּמְעָתֶ֑/ךָ הִנְ/נִי֙ יוֹסִ֣ף עַל יָמֶ֔י/ךָ חֲמֵ֥שׁ עֶשְׂרֵ֖ה שָׁנָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/005.yaml
  text: 'Go and say to Hezekiah, ‘Thus says the LORD, the God of David your father: I have heard your prayer; I have seen your tears. Look, I will add fifteen years to your days.’'
translation:
  language: hi
  text: '“जाकर हिजकिय्याह से कह, ‘यहोवा, तेरे पूर्वज दाऊद का परमेश्वर, यह कहता है: मैंने तेरी प्रार्थना सुनी है और तेरे आँसू देखे हैं। देख, मैं तेरी आयु में पंद्रह वर्ष और बढ़ा दूँगा।’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָלוֹךְ וְאָמַרְתָּ
  choice: जाकर ... कह
  rationale: हिब्रू के आदेशात्मक मुहावरे को स्वाभाविक और सीधी आधुनिक हिन्दी में रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से व्यक्त किया गया है।
- source_word: אֱלֹהֵי דָּוִד אָבִיךָ
  choice: तेरे पूर्वज दाऊद का परमेश्वर
  rationale: אָבִיךָ का शाब्दिक अर्थ ‘तेरा पिता’ है, पर यहाँ राजवंशीय पूर्वज दाऊद अभिप्रेत है; ‘पूर्वज’ आधुनिक हिन्दी में आशय स्पष्ट करता है।
- source_word: הִנְנִי
  choice: देख
  rationale: ध्यान आकर्षित करने वाले प्रस्तुतीकरण कण की शक्ति को संक्षिप्त हिन्दी आदेश ‘देख’ से बनाए रखा गया है।
- source_word: יוֹסִף עַל יָמֶיךָ חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: मैं तेरी आयु में पंद्रह वर्ष और बढ़ा दूँगा
  rationale: ‘तेरे दिनों पर जोड़ना’ का अर्थ स्वाभाविक हिन्दी में व्यक्त करते हुए पंद्रह अतिरिक्त वर्षों का भाव सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वर के वाचा-नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में सामान्य उपाधि אֲדֹנָי नहीं, बल्कि विशिष्ट नाम יהוה है; इसलिए स्रोत-पाठ का भेद बनाए रखा गया है।
- issue: दाऊद और हिजकिय्याह का संबंध
  choice: पूर्वज दाऊद
  alternative: पिता दाऊद
  rationale: शाब्दिक पितृत्व का भ्रम टालते हुए हिब्रू में ‘पिता’ के वंशगत प्रयोग को व्यक्त किया गया है।
- issue: हִנְנִי की वाक्यगत शक्ति
  choice: देख
  alternative: निश्चय ही
  rationale: मूल का ध्यानाकर्षक रूप बनाए रखा गया है; इसे केवल आश्वासनसूचक क्रियाविशेषण बनाकर उसकी चित्रात्मकता समाप्त नहीं की गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधे संबोधन वाली है। भविष्यवक्ता से एकवचन आदेश तथा हिजकिय्याह के लिए ‘तेरी’ मूल हिब्रू के निकट हैं। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
