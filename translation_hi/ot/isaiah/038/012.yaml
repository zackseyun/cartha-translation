  text: דּוֹרִ֗/י נִסַּ֧ע וְ/נִגְלָ֛ה מִ/נִּ֖י כְּ/אֹ֣הֶל רֹעִ֑/י קִפַּ֨דְתִּי כָ/אֹרֵ֤ג חַיַּ/י֙ מִ/דַּלָּ֣ה יְבַצְּעֵ֔/נִי מִ/יּ֥וֹם עַד לַ֖יְלָה תַּשְׁלִימֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/012.yaml
  text: My dwelling is pulled up and carried away from me like a shepherd’s tent[a]; I have rolled up my life like a weaver; from the loom he cuts me off[c][b]. From day to night you bring me to an end.
translation:
  language: hi
  text: 'मेरा बसेरा चरवाहे के तंबू की तरह उखाड़कर मुझसे दूर ले जाया गया है[a]।


    मैंने जुलाहे की तरह अपना जीवन लपेट दिया है[b];


    वह मुझे करघे के लटकते धागों से अलग काट देता है[c]।


    दिन से रात तक तू मेरा अंत कर देता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी पीढ़ी मुझसे कूच कर गई और चरवाहे के तंबू की तरह हटा दी गई।” हिब्रू शब्द का अर्थ “पीढ़ी” भी हो सकता है; इस संदर्भ में “निवास” या “बसेरा” अर्थ भी संभव है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैंने जुलाहे की तरह अपना जीवन काट दिया है।” हिब्रू क्रिया का अर्थ निश्चित नहीं है; मुख्य अनुवाद बुनाई की छवि के अनुसार इसे “लपेट दिया” समझता है।
    reason: lexical_alternative
  - marker: c
    text: या, “वह मुझे ताने के धागों से अलग काट देता है।” हिब्रू शब्द अधिक विशेष रूप से करघे पर लटकते धागों या ताने की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹרִי
  choice: मेरा बसेरा
  rationale: דּוֹר का सामान्य अर्थ ‘पीढ़ी’ है, पर यहाँ चलायमान चरवाहे के तंबू का रूपक ‘निवास/बसेरा’ अर्थ का समर्थन करता है। ‘बसेरा’ आधुनिक, सहज और अस्थायी निवास की छवि के अनुकूल है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: נִסַּע וְנִגְלָה
  choice: उखाड़कर ... दूर ले जाया गया है
  rationale: दोनों क्रियाएँ तंबू को उखाड़कर हटा ले जाने की संयुक्त छवि बनाती हैं। यह हिंदी अभिव्यक्ति कर्मवाच्य और वक्ता से अलग किए जाने, दोनों को बनाए रखती है।
- source_word: כְּאֹהֶל רֹעִי
  choice: चरवाहे के तंबू की तरह
  rationale: यह पदबंध चरवाहे के अस्थायी और चलायमान आश्रय की ठोस छवि को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: קִפַּדְתִּי
  choice: मैंने ... लपेट दिया है
  rationale: क्रिया कठिन और विवादित है। बुनाई के संदर्भ में ‘लपेट दिया’ बुने हुए कपड़े या धागे को समेटने की संभावित छवि व्यक्त करता है, जबकि ‘काट दिया’ विकल्प पादटिप्पणी में दिया गया है।
- source_word: כָאֹרֵג חַיַּי
  choice: मैंने जुलाहे की तरह अपना जीवन
  rationale: हिब्रू की संक्षिप्त काव्यात्मक तुलना को अधिक व्याख्यात्मक बनाए बिना हिंदी में स्पष्ट रखा गया है। ‘जुलाहा’ साधारण पाठक के लिए बुनकर की छवि तुरंत उपस्थित करता है।
- source_word: מִדַּלָּה
  choice: करघे के लटकते धागों से
  rationale: यह दुर्लभ शब्द संभवतः करघे के लटकते धागों, ताने या बुनाई के आधार को सूचित करता है। मुख्य पाठ में समझने योग्य वर्णन चुना गया है और अधिक तकनीकी विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: יְבַצְּעֵנִי
  choice: वह मुझे ... काट देता है
  rationale: क्रिया काटने या अलग कर देने का भाव रखती है और बुनाई के रूपक के साथ जीवन के अंत को भी व्यक्त करती है। तीसरे पुरुष के कर्ता को जानबूझकर बनाए रखा गया है।
- source_word: מִיּוֹם עַד לַיְלָה
  choice: दिन से रात तक
  rationale: यह हिब्रू शब्दावली के निकट है और बहुत थोड़े समय में अंत आ जाने की तीव्रता को बनाए रखती है।
- source_word: תַּשְׁלִימֵנִי
  choice: तू मेरा अंत कर देता है
  rationale: हिफ़ील रूप यहाँ पूरा करने अर्थात अंत तक पहुँचा देने का भाव देता है। ‘अंत कर देता है’ गंभीर, सीधा और स्वाभाविक है।
theological_decisions:
- issue: तीसरे पुरुष से दूसरे पुरुष की ओर कर्ता का काव्यात्मक परिवर्तन
  choice: ‘वह मुझे ... काट देता है; ... तू मेरा अंत कर देता है’ के रूप में परिवर्तन बनाए रखना
  alternative: दोनों वाक्यांशों में परमेश्वर को सीधे ‘तू’ कहना, या कर्ता को अव्यक्त कर देना
  rationale: हिब्रू पाठ बुनाई की छवि में तीसरे पुरुष की क्रिया से परमेश्वर को सीधे संबोधित करने वाले दूसरे पुरुष की ओर जाता प्रतीत होता है। इसे बनाए रखने से मूल की व्याकरणिक और भावात्मक खिंचाव सुरक्षित रहता है तथा पाठ को अनावश्यक रूप से समरूप नहीं बनाया जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है, किंतु विलाप और काव्य के अनुरूप गरिमापूर्ण रखी गई है। ‘बसेरा’, ‘चरवाहे का तंबू’, ‘जुलाहा’ और ‘करघे के लटकते धागे’ रूपकों को साधारण पाठक के लिए ठोस रखते हैं। परमेश्वर के प्रत्यक्ष संबोधन में ‘तू’ बाइबिलीय काव्य की निकटता और गंभीरता व्यक्त करता है, अनादर नहीं।
