source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֥ הָ/א֖וֹת מֵ/אֵ֣ת יְהוָ֑ה אֲשֶׁר֙ יַעֲשֶׂ֣ה יְהוָ֔ה אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה אֲשֶׁ֥ר דִּבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/007.yaml
  text: 'And this will be the sign to you from Yahweh[a], that Yahweh will do this thing that he has spoken:'
translation:
  language: hi
  text: 'और तुम्हारे लिए याहवे की ओर से यह चिन्ह होगा कि याहवे अपनी कही हुई इस बात[a] को पूरा करेगा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस विषय’ अथवा ‘इस वचन’; इब्रानी दावार का अर्थ बात, विषय, घटना या बोला हुआ वचन हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: और ... यह
  rationale: संयोजक और संकेतवाचक शब्द पिछले कथन से संबंध बनाए रखते हुए चिन्ह की घोषणा आरम्भ करते हैं।
- source_word: לְךָ
  choice: तुम्हारे लिए
  rationale: लामेद और द्वितीय पुरुष एकवचन प्रत्यय चिन्ह पाने वाले हिजकिय्याह को दर्शाते हैं; आधुनिक हिन्दी में ‘तुम्हारे लिए’ स्वाभाविक है।
- source_word: הָאוֹת
  choice: यह चिन्ह
  rationale: संज्ञा निश्चित है और परमेश्वर द्वारा दिए जाने वाले एक विशिष्ट पुष्टिकारक चिन्ह को दर्शाती है।
- source_word: מֵאֵת יְהוָה
  choice: याहवे की ओर से
  rationale: מֵאֵת स्रोत को दर्शाता है। יְהוָה को उसके व्यक्तिवाचक वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: אֲשֶׁר יַעֲשֶׂה יְהוָה
  choice: कि याहवे ... पूरा करेगा
  rationale: सम्बन्धवाचक उपवाक्य चिन्ह के पुष्टिकारक अर्थ को बताता है। हिन्दी में ‘पूरा करेगा’ कही हुई बात को कार्यरूप देने का स्वाभाविक ढंग है।
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: इस बात को
  rationale: דָּבָר का अर्थ बात, विषय, घटना या वचन हो सकता है। ‘इस बात’ प्रसंग में स्वाभाविक है और शब्द की व्यापकता को काफी हद तक बनाए रखता है।
- source_word: אֲשֶׁר דִּבֵּר
  choice: अपनी कही हुई
  rationale: यह याहवे की पहले कही हुई घोषणा की ओर लौटता है। कृदन्तीय हिन्दी रचना मूल सम्बन्धवाचक उपवाक्य का अर्थ संक्षेप और स्वाभाविक रूप से देती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिवाचक नाम सीधे दो बार आया है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: कही हुई बात को ‘पूरा करना’
  choice: पूरा करेगा
  alternative: करेगा; कार्यरूप देगा
  rationale: मूल עשה का सामान्य अर्थ ‘करना’ है, पर हिन्दी में किसी कही हुई ‘बात को करना’ अस्वाभाविक है। ‘पूरा करेगा’ कथन को वास्तविकता में लाने का भाव व्यक्त करता है, बिना उसे विशेष रूप से ‘प्रतिज्ञा’ घोषित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य के अंत का द्विबिंदु अगले पद में आने वाले चिन्ह के विवरण से इसके संबंध को बनाए रखता है।
