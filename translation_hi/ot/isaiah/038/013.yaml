source:
  edition: WLC
  text: שִׁוִּ֤יתִי עַד בֹּ֨קֶר֙ כָּֽ/אֲרִ֔י כֵּ֥ן יְשַׁבֵּ֖ר כָּל עַצְמוֹתָ֑/י מִ/יּ֥וֹם עַד לַ֖יְלָה תַּשְׁלִימֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/013.yaml
  text: I waited until morning[a]; like a lion, so he breaks all my bones[b]. From day to night you bring me to an end.
translation:
  language: hi
  text: मैं भोर तक प्रतीक्षा करता रहा[a]; सिंह के समान वह मेरी सारी हड्डियाँ तोड़ डालता है[b]। दिन से रात तक तू मेरा अंत कर देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने भोर तक अपने को सँभाले रखा।” आरम्भिक क्रिया का अर्थ कठिन है; कुछ लोग इसे प्रतीक्षा के बजाय अपने को स्थिर या संयत रखने के अर्थ में समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यहाँ “वह ... तोड़ डालता है” के बाद “तू ... अंत कर देता है” आता है। संबोधन का यह काव्यात्मक परिवर्तन अनुवाद में सुरक्षित रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁוִּיתִי
  choice: मैं ... प्रतीक्षा करता रहा
  rationale: क्रिया का अर्थ यहाँ कठिन और प्रसंग-निर्भर है। עַד בֹּקֶר के साथ दुःख की रात भोर तक सहते हुए प्रतीक्षा करने का भाव प्रसंग में स्वाभाविक है; इसकी अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: עַד בֹּקֶר
  choice: भोर तक
  rationale: यह स्पष्ट कालवाचक पद है। हिन्दी में ‘भोर तक’ रात से सुबह होने की प्रतीक्षा को सहज रूप से व्यक्त करता है।
- source_word: כָּאֲרִי
  choice: सिंह के समान
  rationale: כ उपसर्ग और אֲרִי प्रत्यक्ष उपमा बनाते हैं; हिंसक और कुचल देने वाला बिंब सुरक्षित रखा गया है।
- source_word: כֵּן
  choice: वाक्य में उपमा के प्रवाह से व्यक्त
  rationale: हिन्दी में ‘सिंह के समान वह...’ स्वयं तुलना और उसके अनुरूप क्रिया व्यक्त करता है; अलग से ‘वैसे ही’ जोड़ना बोझिल होता।
- source_word: יְשַׁבֵּר
  choice: तोड़ डालता है
  rationale: שבר के पिएल रूप की तीव्रता को ‘तोड़ डालता है’ स्वाभाविक और सजीव हिन्दी में व्यक्त करता है।
- source_word: כָּל עַצְמוֹתָי
  choice: मेरी सारी हड्डियाँ
  rationale: चरम शारीरिक पीड़ा का ठोस बिंब सीधे सुरक्षित रखा गया है।
- source_word: מִיּוֹם עַד לַיְלָה
  choice: दिन से रात तक
  rationale: इब्रानी काल-विस्तार को शाब्दिक और स्वाभाविक हिन्दी में रखा गया है।
- source_word: תַּשְׁלִימֵנִי
  choice: तू मेरा अंत कर देता है
  rationale: इस प्रसंग में שלם का हिफ़ील रूप ‘पूरा कर देना’ के अर्थ में जीवन का अंत करने को दर्शाता है। द्वितीय पुरुष एकवचन को ‘तू’ से रखा गया है, जो विलाप की सीधी और तीव्र संबोधन-शैली के अनुकूल है।
theological_decisions:
- issue: पद के भीतर तृतीय पुरुष से द्वितीय पुरुष संबोधन की ओर परिवर्तन
  choice: ‘वह ... तोड़ डालता है’ से ‘तू ... अंत कर देता है’ का इब्रानी परिवर्तन सुरक्षित रखा
  alternative: दोनों उपवाक्यों को परमेश्वर के लिए तृतीय पुरुष में एकरूप करना, या सिंह की उपमा को पूरे पद में सीधे परमेश्वर की स्पष्ट पहचान मानना
  rationale: इब्रानी विलाप का काव्यात्मक संबोधन-परिवर्तन भावनात्मक तीव्रता और वास्तविक अस्पष्टता दोनों बनाए रखता है। उसे एकरूप करने से मूल पाठ का तनाव अनावश्यक रूप से हल हो जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज विलाप-शैली अपनाई गई है। ठोस शारीरिक बिंब और अकस्मात संबोधन-परिवर्तन को बनाए रखा गया है; ‘तू’ निकट, सीधा और काव्यात्मक संबोधन है, अनादर सूचित करने के लिए नहीं।
