lexical_decisions:
- source_word: וַיְהִי
  choice: तब … पहुँचा
  rationale: वाव-क्रमवाचक कथानक में अगली घटना प्रस्तुत करता है। ‘तब’ इस क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: דְּבַר
  choice: वचन
  rationale: दְּבַר יְהוָה नबूवत का स्थापित सूत्र है। ‘वचन’ दिव्य प्रकाशन की इस परिचित अभिव्यक्ति को बनाए रखता है और ‘संदेश’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम YHWH है। ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में लिप्यंतरित करता है।
- source_word: אֶל
  choice: के पास
  rationale: यह पूर्वसर्ग यहाँ दिव्य वचन पाने वाले व्यक्ति को सूचित करता है; ‘यशायाह के पास पहुँचा’ हिन्दी में स्वाभाविक भविष्यद्वाणी-सूत्र है।
- source_word: יְשַׁעְיָהוּ
  choice: यशायाह
  rationale: हिब्रू व्यक्तिगत नाम का हिन्दी में प्रचलित बाइबलीय रूप अपनाया गया है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप आगे आने वाले कथन का परिचय देता है। हिन्दी में वचन के बाद लगाया गया द्विबिंदु इसी कार्य को संक्षेप और स्वाभाविक ढंग से करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: पद में चार अक्षरों वाला इब्रानी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत ध्वन्यात्मक लिप्यंतरण है; पादटिप्पणी हिन्दी पाठकों के परिचित वैकल्पिक रूप को भी बताती है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘के पास पहुँचा’ हिन्दी में अधिक स्वाभाविक है, जबकि ‘वचन’ मूल भविष्यद्वाणी-सूत्र की औपचारिकता बनाए रखता है।
