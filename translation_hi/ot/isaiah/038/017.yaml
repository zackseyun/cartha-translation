source:
  edition: WLC
  text: הִנֵּ֥ה לְ/שָׁל֖וֹם מַר לִ֣/י מָ֑ר וְ/אַתָּ֞ה חָשַׁ֤קְתָּ נַפְשִׁ/י֙ מִ/שַּׁ֣חַת בְּלִ֔י כִּ֥י הִשְׁלַ֛כְתָּ אַחֲרֵ֥י גֵוְ/ךָ֖ כָּל חֲטָאָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/017.yaml
  text: Behold[a], for my peace I had great bitterness; but you have held my soul back from the pit of destruction, for you have cast all my sins behind your back.
translation:
  language: hi
  text: देखो, मेरी भलाई के लिए मुझे घोर कड़वाहट सहनी पड़ी; परन्तु तूने मेरे प्राण को विनाश के गड्ढे से बचा लिया[a], क्योंकि तूने मेरे सारे पाप अपनी पीठ के पीछे फेंक दिए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तूने मेरे प्राण से प्रेम किया और उसे विनाश के गड्ढे से दूर रखा।” इब्रानी क्रिया गहरे लगाव या प्रेम का अर्थ भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשָׁלוֹם
  choice: मेरी भलाई के लिए
  rationale: שָׁלוֹם यहाँ केवल संघर्ष के अभाव से अधिक व्यापक रूप से कुशलता, कल्याण और पूर्ण भलाई का बोध करा सकता है। यह वाक्यांश לְ की उद्देश्य अथवा परिणाम-संबंधी अस्पष्टता को पर्याप्त रूप से बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מַר לִי מָר
  choice: मुझे घोर कड़वाहट सहनी पड़ी
  rationale: मूल में ‘कड़वा’ शब्द की पुनरावृत्ति तीव्रता व्यक्त करती है। ‘घोर कड़वाहट’ उसी जोर को स्वाभाविक हिन्दी में प्रकट करता है, जबकि ‘सहनी पड़ी’ अनुभव की पीड़ादायक प्रकृति स्पष्ट करता है।
- source_word: חָשַׁקְתָּ
  choice: बचाए रखा
  rationale: क्रिया का मूल भाव गहरे लगाव या प्रेम का हो सकता है; इस प्रसंग में उस लगाव का फल विनाश के गड्ढे से रक्षा है। मुख्य पाठ प्रसंगगत उद्धार को व्यक्त करता है और शाब्दिक प्रेम-संबंधी संभावना को पादटिप्पणी में सुरक्षित रखता है।
- source_word: נַפְשִׁי
  choice: मेरी जान
  rationale: נֶפֶשׁ यहाँ व्यक्ति के जीवन अथवा स्वयं व्यक्ति को सूचित करता है। ‘मेरी जान’ आधुनिक हिन्दी में स्वाभाविक है और मृत्यु के गड्ढे से बचाए जाने के प्रसंग के अनुकूल है।
- source_word: מִשַּׁחַת בְּלִי
  choice: विनाश के गड्ढे से
  rationale: שַׁחַת गड्ढे और विनाश दोनों की छवि रखता है; בְּלִי पूर्ण नाश की धारणा को तीव्र करता है। यह अनुवाद ठोस रूपक और विनाशकारी अर्थ दोनों बचाए रखता है।
- source_word: הִשְׁלַכְתָּ אַחֲרֵי גֵוְךָ
  choice: अपनी पीठ के पीछे फेंक दिए हैं
  rationale: यह मूल की सजीव देहात्मक उपमा को सीधे और स्वाभाविक ढंग से रखता है तथा पापों को दृष्टि और विचार से दूर कर देने का भाव देता है।
- source_word: חֲטָאַי
  choice: मेरे सारे पाप
  rationale: बहुवचन חֲטָאַי का सीधा अर्थ ‘मेरे पाप’ है; כָּל के कारण ‘सारे’ जोड़ा गया है।
theological_decisions:
- issue: חָשַׁקְתָּ נַפְשִׁי में परमेश्वर के प्रेम/लगाव और उद्धारकारी रक्षा के बीच संबंध
  choice: मुख्य पाठ में परिणामस्वरूप रक्षा को ‘मेरी जान को ... बचाए रखा’ कहा गया है।
  alternative: ‘तूने मेरी जान से ऐसा प्रेम किया कि उसे विनाश के गड्ढे से निकाल लिया।’
  rationale: חָשַׁקְתָּ सामान्यतः प्रेम या गहरे लगाव को व्यक्त कर सकता है, जबकि מִן के साथ यह प्रसंग मृत्यु से बचाए जाने की दिशा बताता है। मुख्य पाठ प्रसंगगत उद्धार पर बल देता है, पर प्रेम का वास्तविक शाब्दिक विकल्प पादटिप्पणी में बनाए रखता है।
- issue: לְשָׁלוֹם को संकीर्ण ‘शान्ति’ या व्यापक कल्याण के रूप में प्रस्तुत करना
  choice: ‘मेरी भलाई के लिए’
  alternative: ‘मेरी शान्ति के लिए’
  rationale: हिजकिय्याह की बीमारी और चंगाई के प्रसंग में שָׁלוֹם व्यापक कुशलता या कल्याण का संकेत देता है। ‘भलाई’ इस विस्तार को दर्शाती है, बिना यह तय किए कि कड़वाहट किस विशिष्ट साधन से भलाई बनी।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। परमेश्वर को संबोधन में एकवचन निकटतापूर्ण ‘तू’ मूल के एकवचन संबोधन और हिन्दी बाइबिलीय काव्य-शैली के अनुरूप है। ‘घोर कड़वाहट’ मूल की पुनरुक्त तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
