  footnotes:
  - marker: a
    text: अर्थात अश्शूर के राजा के वश या अधिकार से। हिब्रू में शाब्दिक रूप से ‘हाथ से’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכַּף
  choice: के हाथ से
  rationale: हिब्रू में ‘हथेली/हाथ से’ का ठोस बिंब किसी के अधिकार या वश से छुटकारे का मुहावरा है। हिन्दी में ‘के हाथ से छुड़ाना’ स्वाभाविक है और मूल बिंब भी बनाए रखता है।
- source_word: מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा
  rationale: यह संबंधवाचक पद उस शत्रु शासक की सीधी पहचान कराता है; ‘अश्शूर के राजा’ मानक और स्पष्ट हिन्दी है।
- source_word: אַצִּילְךָ
  choice: मैं तुम्हें ... छुड़ाऊँगा
  rationale: נצל के हिफ़ील रूप का अर्थ खतरे या किसी के अधिकार से निकालना अथवा छुड़ाना है। सैन्य-ऐतिहासिक प्रसंग में ‘छुड़ाऊँगा’ स्वाभाविक है और अनावश्यक व्यापक धर्मवैज्ञानिक अर्थ नहीं जोड़ता।
- source_word: וְאֵת הָעִיר הַזֹּאת
  choice: और इस नगर को
  rationale: निश्चयवाचक संकेत उसी उल्लिखित नगर की ओर करता है। ‘इस नगर को’ प्रत्यक्ष कर्म को स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: וְגַנּוֹתִי
  choice: और ... रक्षा करूँगा
  rationale: גנן का अर्थ ढाँकना, बचाना या सुरक्षा देना है। आक्रमण के सैन्य प्रसंग में ‘रक्षा करूँगा’ सक्रिय संरक्षण को ठीक प्रकार व्यक्त करता है।
- source_word: עַל הָעִיר הַזֹּאת
  choice: इस नगर की
  rationale: גנן के साथ עַל नगर पर या उसके लिए सुरक्षात्मक कार्य सूचित करता है। हिन्दी में ‘इस नगर की रक्षा करूँगा’ स्वाभाविक है; शब्दशः ‘इस नगर के ऊपर रक्षा’ असहज होता।
theological_decisions:
- issue: ऐतिहासिक सैन्य प्रसंग में परमेश्वर द्वारा छुड़ाए जाने की भाषा
  choice: अश्शूर के राजा के अधिकार और आक्रमण से हिजकिय्याह तथा नगर को छुड़ाने के अर्थ में ‘छुड़ाऊँगा’
  alternative: ‘बचाऊँगा’ या ‘उद्धार करूँगा’
  rationale: यहाँ तत्काल संदर्भ शत्रु राजा से ऐतिहासिक सुरक्षा का है। ‘छुड़ाऊँगा’ मूल क्रिया की दिशा और ‘हाथ से’ मुहावरे को बनाए रखता है, जबकि ऐसा व्यापक आध्यात्मिक उद्धारार्थ नहीं जोड़ता जिसे पद स्वयं स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण मानक हिन्दी। एकवचन संबोधन को आधुनिक प्रयोग में ‘तुम्हें’ से व्यक्त किया गया है। ‘नगर’ और ‘अश्शूर’ बाइबलीय-ऐतिहासिक प्रसंग के अनुरूप हैं; वाक्यरचना सहज रखते हुए हिब्रू के ठोस ‘हाथ’ बिंब को सुरक्षित रखा गया है।
