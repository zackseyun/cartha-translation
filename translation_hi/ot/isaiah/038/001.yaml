base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/001.yaml
  text: 'In those days Hezekiah became sick to the point of death[a], and Isaiah the prophet, the son of Amoz, came to him and said to him, “Thus says Yahweh: Set your house in order, for you are about to die; you shall not live.”'
translation:
  language: hi
  text: 'उन दिनों हिजकिय्याह इतना बीमार पड़ा कि मरने पर था। और आमोस का पुत्र यशायाह नबी उसके पास आया और उससे कहा, “याहवे यों कहता है: अपने घरबार की व्यवस्था कर ले, क्योंकि तू मरने वाला है[a]; तू जीवित नहीं रहेगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “क्योंकि तू मर रहा है” या “क्योंकि तू मरा हुआ है”; हिब्रू अभिव्यक्ति निकट और निश्चित मृत्यु की घोषणा करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: उन दिनों
  rationale: यह प्रचलित कालवाचक मुहावरा है और पूर्ववर्ती कथा से संबंध बनाए रखता है।
- source_word: חָלָה ... לָמוּת
  choice: इतना बीमार पड़ा कि मरने पर था
  rationale: חָלָה बीमारी की अवस्था में आने को और לָמוּת यहाँ बीमारी की घातक सीमा को व्यक्त करता है; यह रूप आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: आमोस का पुत्र यशायाह नबी
  rationale: हिब्रू के सभी संबंधसूचक तत्त्वों को हिन्दी की स्वाभाविक पद-रचना में रखा गया है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: यह नबूवत का औपचारिक संदेश-सूत्र है; יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: צַו לְבֵיתֶךָ
  choice: अपने घरबार की व्यवस्था कर ले
  rationale: शाब्दिक अर्थ ‘अपने घर/घराने को आदेश दे’ है, पर प्रसंग में इसका आशय मृत्यु से पहले घराने और अपने मामलों की व्यवस्था करने से है। ‘घरबार’ इस व्यापक अर्थ को सामान्य हिन्दी में व्यक्त करता है।
- source_word: כִּי מֵת אַתָּה
  choice: क्योंकि तू मरने वाला है
  rationale: विधेय कृदंत निश्चित और निकट आती मृत्यु की घोषणा करता है। यह अनुवाद असंभव शाब्दिक अर्थ ‘तू मरा हुआ है’ से बचते हुए घोषणा की निश्चितता बनाए रखता है।
- source_word: וְלֹא תִחְיֶה
  choice: तू जीवित नहीं रहेगा
  rationale: यह सीधे तौर पर आगे जीवित न रहने की बात कहता है; ‘तू स्वस्थ नहीं होगा’ कहना मूल से अधिक चिकित्सकीय व्याख्या जोड़ देता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम स्पष्ट रूप से आया है; लिप्यंतरण उसे सामान्य उपाधि में बदलने के बजाय सुरक्षित रखता है।
- issue: כִּי מֵת אַתָּה וְלֹא תִחְיֶה में मृत्यु की घोषणा का बल
  choice: क्योंकि तू मरने वाला है; तू जीवित नहीं रहेगा
  alternative: क्योंकि तू मर रहा है; तू स्वस्थ नहीं होगा
  rationale: चुना हुआ पाठ निकट और निश्चित मृत्यु की भविष्यसूचक घोषणा को बनाए रखता है, पर ‘स्वस्थ नहीं होगा’ जैसी प्रसंगाधारित संकीर्ण व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। सम्बोधन में ‘तू’ एकवचन हिब्रू रूप की सीधाई और भविष्यसूचक घोषणा की गंभीरता को रखता है; इसे अनादर सूचित करने के लिए नहीं चुना गया।
