source:
  edition: WLC
  text: אָמַ֨רְתִּי֙ לֹא אֶרְאֶ֣ה יָ֔הּ יָ֖הּ בְּ/אֶ֣רֶץ הַ/חַיִּ֑ים לֹא אַבִּ֥יט אָדָ֛ם ע֖וֹד עִם י֥וֹשְׁבֵי חָֽדֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/011.yaml
  text: I said[a], “I will not see Yah, Yah in the land of the living[b]; I will no longer look on man among the inhabitants of cessation.”
translation:
  language: hi
  text: मैंने कहा, “मैं जीवितों की धरती पर याह, याह को न देखूँगा;[a] मैं फिर इस नश्वर संसार के निवासियों के साथ किसी मनुष्य को निहारूँगा।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “याह” परमेश्वर के नाम का संक्षिप्त काव्यात्मक रूप है; इब्रानी में यह यहाँ दो बार आया है। कई अनुवाद इसे “प्रभु” या “यहोवा” लिखते हैं।
    reason: alternative_reading
  - marker: b
    text: अंतिम इब्रानी पदबंध कठिन है। इसका अनुवाद “मैं फिर चुकने/समाप्ति के निवासियों के साथ किसी मनुष्य को निहारूँगा” भी किया जा सकता है। חָדֶל में चुकने, क्षणभंगुरता या निर्बलता का भाव हो सकता है; इसका सटीक संदर्भ अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: मैंने कहा
  rationale: क़ाल पूर्ण 1 एकवचन का सीधा अर्थ है और यह हिजकिय्याह के विलाप का प्रत्यक्ष कथन आरम्भ करता है।
- source_word: לֹא אֶרְאֶה
  choice: फिर न देखूँगा
  rationale: निषेध के साथ अपूर्ण क्रिया यहाँ भविष्य में किसी अनुभव से वंचित हो जाने की आशंका व्यक्त करती है; हिन्दी में ‘फिर न’ प्रसंगानुकूल है।
- source_word: יָהּ יָהּ
  choice: याह, याह
  rationale: मूल में परमेश्वर के नाम का संक्षिप्त काव्यात्मक रूप दो बार आया है; लिप्यंतरण और पुनरुक्ति दोनों सुरक्षित रखे गए हैं।
- source_word: בְּאֶרֶץ הַחַיִּים
  choice: जीवितों की धरती पर
  rationale: यह जीवित मनुष्यों के लोक के लिए प्रयुक्त इब्रानी मुहावरा है, जो मृत्यु से विपरीत है।
- source_word: לֹא אַבִּיט ... עוֹד
  choice: फिर ... न देखूँगा
  rationale: नבט का अर्थ ‘देखना/निहारना’ है और निषेध के साथ עוֹד ‘फिर कभी नहीं’ का भाव देता है।
- source_word: אָדָם
  choice: किसी मनुष्य को
  rationale: एकवचन प्रतिनिधिक संज्ञा यहाँ मानव संगति के किसी सदस्य को सूचित करती है; ‘किसी’ निषेधात्मक हिन्दी वाक्य में स्वाभाविक है।
- source_word: עִם יֹשְׁבֵי
  choice: निवासियों के बीच
  rationale: עִם का मूल अर्थ ‘साथ’ है, पर यहाँ सामाजिक संगति/परिवेश को स्वाभाविक हिन्दी में ‘के बीच’ व्यक्त करता है।
- source_word: חָדֶל
  choice: नश्वर संसार
  rationale: दुर्लभ और कठिन शब्द का संबंध चुक जाने, क्षणभंगुरता या निर्बलता से है। ‘नश्वर संसार’ सामान्य जीवन से कटे मृतलोक को निश्चित मान लेने के बजाय इस अस्पष्टता को पठनीय हिन्दी में बनाए रखता है।
theological_decisions:
- issue: יָהּ के संक्षिप्त दिव्य नाम का अनुवाद
  choice: याह, याह
  alternative: यहोवा, यहोवा / प्रभु, प्रभु
  rationale: यहाँ पूर्ण चतुरक्षरी नाम नहीं, बल्कि संक्षिप्त काव्यात्मक रूप יָהּ दो बार है। इसलिए उसका लिप्यंतरण और बलसूचक पुनरुक्ति बनाए रखी गई है।
- issue: חָדֶל के संदर्भ का निर्धारण
  choice: नश्वर संसार
  alternative: मृतकों का लोक / समाप्ति
  rationale: दुर्लभ शब्द का ठीक संदर्भ विवादित है। मुख्य पाठ में उसके क्षणभंगुरता/चुकने के भाव को स्वाभाविक हिन्दी दी गई है, जबकि पादटिप्पणी अन्य संभावनाएँ बताती है और इसे निश्चित रूप से अधोलोक नहीं ठहराती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विलाप की काव्यात्मक शैली के अनुरूप रखी गई है। ‘याह’ मूल रूप को सुरक्षित रखता है; कठिन अंतिम पदबंध को अत्यधिक तकनीकी ‘समाप्ति के निवासी’ बनाने के बजाय पठनीय रखा गया है, और उसकी वास्तविक अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
