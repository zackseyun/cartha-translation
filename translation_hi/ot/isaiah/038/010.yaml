id: ISA.38.10
reference: Isaiah 38:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲנִ֣י אָמַ֗רְתִּי בִּ/דְמִ֥י יָמַ֛/י אֵלֵ֖כָה בְּ/שַׁעֲרֵ֣י שְׁא֑וֹל פֻּקַּ֖דְתִּי יֶ֥תֶר שְׁנוֹתָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/010.yaml
  text: I said[a], “In the middle of my days I must go through the gates of Sheol[b]; I am deprived of the rest of my years.”
translation:
  language: hi
  text: मैंने कहा, “अपने जीवन के मध्य में ही[a] मुझे शिओल के फाटकों से होकर जाना होगा[b]; मेरे शेष वर्षों से मुझे वंचित कर दिया गया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध कठिन है; इसका अर्थ “मेरे दिनों के कट जाने पर” भी हो सकता है। यहाँ आशय संभवतः जीवन के मध्य या उत्कर्ष में है।
    reason: lexical_alternative
  - marker: b
    text: 'शिओल: मृतकों का लोक; कभी-कभी “अधोलोक” या “कब्र” अनूदित।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּדְמִי יָמַי
  choice: अपने जीवन के मध्य में ही
  rationale: דְּמִי एक कठिन शब्द है, पर शेष वर्षों से वंचित होने की समानांतर शिकायत के कारण यहाँ जीवन के मध्य या यौवनावस्था में अकाल मृत्यु का भाव सबसे उपयुक्त है। ‘ही’ समय से पहले मृत्यु की व्यथा को स्वाभाविक हिन्दी में उभारता है।
- source_word: אֵלֵכָה בְּשַׁעֲרֵי
  choice: फाटकों से होकर जाना होगा
  rationale: क्रिया आसन्न और अनिवार्य प्रस्थान को व्यक्त करती है। בְּ के साथ ‘फाटक’ प्रवेश के मार्ग का बोध करा सकता है; इसलिए ‘से होकर’ मृत्यु के लोक में प्रवेश को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׁאוֹל
  choice: शिओल
  rationale: इब्रानी संकल्पना को केवल ‘कब्र’ या बाद की किसी विशिष्ट नरक-धारणा में सीमित किए बिना सुरक्षित रखने के लिए लिप्यंतरण अपनाया गया है; अर्थ पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: פֻּקַּדְתִּי יֶתֶר שְׁנוֹתָי
  choice: मेरे शेष वर्षों से मुझे वंचित कर दिया गया है
  rationale: विलाप के प्रसंग में यह निष्क्रिय रूप वक्ता के बचे हुए जीवन-वर्ष उससे ले लिए जाने का भाव देता है। यह हिन्दी में हानि और असहायता दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: आसन्न मृत्यु के प्रसंग में שְׁאוֹל का अनुवाद
  choice: शिओल
  alternative: अधोलोक; मृतकों का लोक; कब्र
  rationale: ‘शिओल’ इस्राएली मृत्यु-भाषा की व्यापक और कुछ हद तक अस्पष्ट संकल्पना को बनाए रखता है तथा पाठ में बाद की विकसित ‘नरक’ संबंधी धारणा नहीं जोड़ता।
- issue: בִּדְמִי के कठिन अर्थ का निरूपण
  choice: जीवन के मध्य में
  alternative: मेरे दिनों के कट जाने पर; मेरे दिनों की निस्तब्धता में
  rationale: पद की अगली पंक्ति में शेष वर्षों के खो जाने का विलाप जीवन के मध्य या उत्कर्ष में मृत्यु के अर्थ का समर्थन करता है, फिर भी वैकल्पिक शाब्दिक संभावना पाद-टिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘जीवन के मध्य’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘शिओल’ मूल इब्रानी मृत्यु-संकल्पना को सुरक्षित रखता है और पाद-टिप्पणी उसका अर्थ बताती है।
