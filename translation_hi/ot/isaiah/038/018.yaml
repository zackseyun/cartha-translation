id: ISA.38.18
reference: Isaiah 38:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י לֹ֥א שְׁא֛וֹל תּוֹדֶ֖/ךָּ מָ֣וֶת יְהַלְלֶ֑/ךָּ לֹֽא יְשַׂבְּר֥וּ יֽוֹרְדֵי ב֖וֹר אֶל אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/018.yaml
  text: For Sheol does not thank you[a]; death does not praise you[b]; those who go down to the pit do not hope for your faithfulness.
translation:
  language: hi
  text: क्योंकि अधोलोक[a] आपका धन्यवाद नहीं करता, मृत्यु आपकी स्तुति नहीं करती; गड्ढे में उतरनेवाले आपकी विश्वासयोग्यता की आशा नहीं रखते।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शिओल,’ अर्थात ‘मृतकों का लोक’; केवल ‘कब्र’ नहीं।
    reason: lexical_alternative
  - marker: b
    text: या ‘आपकी सच्चाई की बाट नहीं जोहते।’ इब्रानी वाक्यांश का अर्थ ‘आपकी सच्चाई/विश्वासयोग्यता की आशा रखना’ या ‘उसकी बाट जोहना’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: अधोलोक
  rationale: यह शब्द केवल कब्र नहीं, बल्कि मृतकों के लोक को दर्शाता है। ‘अधोलोक’ मूल धारणा को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: תּוֹדֶךָּ
  choice: आपका धन्यवाद नहीं करता
  rationale: ידה के हिफ़ील रूप में धन्यवाद देने अथवा प्रशंसा करने का भाव है। ‘धन्यवाद’ अगले खंड की ‘स्तुति’ से क्रियात्मक भेद बनाए रखता है।
- source_word: מָוֶת
  choice: मृत्यु
  rationale: मूल शब्द का सीधा अनुवाद है और यहाँ अधोलोक के समानांतर काव्यात्मक रूप से व्यक्तित्वयुक्त है।
- source_word: יְהַלְלֶךָּ
  choice: आपकी स्तुति नहीं करती
  rationale: הלל के पिएल रूप का सामान्य अर्थ स्तुति करना है; हिन्दी में यह स्वाभाविक और गरिमापूर्ण है।
- source_word: יְשַׂבְּרוּ
  choice: आशा नहीं रखते
  rationale: שׂבר के पिएल रूप में आशापूर्वक प्रतीक्षा करने या बाट जोहने का भाव हो सकता है। ‘आशा रखना’ प्रसंग में स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: יוֹרְדֵי בוֹר
  choice: गड्ढे में उतरनेवाले
  rationale: यह सहभागी पद मृतकों अथवा मृत्यु की ओर जानेवालों को चित्रात्मक ढंग से व्यक्त करता है। शाब्दिक बिंब को बनाए रखा गया है।
- source_word: בּוֹר
  choice: गड्ढा
  rationale: मृत्यु के लोक के लिए प्रयुक्त ठोस काव्यात्मक बिंब को ‘कब्र’ बनाकर सीमित नहीं किया गया।
- source_word: אֲמִתֶּךָ
  choice: आपकी विश्वासयोग्यता
  rationale: אֱמֶת का अर्थ सत्य, विश्वसनीयता या विश्वासयोग्यता हो सकता है। ‘आशा रखना’ के साथ ‘विश्वासयोग्यता’ उपयुक्त है, पर ‘सच्चाई’ की वास्तविक संभावना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: मृतकों द्वारा परमेश्वर की स्तुति न किए जाने का आशय
  choice: 'पद को उसके काव्यात्मक कथन के रूप में रखा गया है: अधोलोक और मृत्यु में गए लोग जीवितों की तरह धन्यवाद, स्तुति और आशापूर्ण प्रतीक्षा नहीं करते।'
  alternative: इसे इस स्पष्ट तात्त्विक दावे के रूप में समझना कि मृतक हर प्रकार की चेतन अवस्था या परमेश्वर से किसी भी संबंध में पूर्णतः असमर्थ हैं।
  rationale: इब्रानी पद मृत्यु के क्षेत्र में सांसारिक धन्यवाद और स्तुति के अभाव पर बल देता है, पर मध्यवर्ती अवस्था का पूरा सिद्धांत प्रस्तुत नहीं करता। अनुवाद इस तनाव को अनिर्णीत रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘अधोलोक’ और ‘गड्ढा’ मूल के मृत्यु-संबंधी समानांतर बिंबों को अलग-अलग बनाए रखते हैं; परमेश्वर के लिए आदरसूचक ‘आप’ का प्रयोग किया गया है।
