  terminology: '‘धन्यवाद’ and ‘स्तुति’ preserve the meaningful distinction between the first two Hebrew verbs. ‘विश्वासयोग्यता’ is a sound contextual rendering of אֱמֶת, while the footnote properly retains ‘सच्चाई’ and ‘बाट जोहना’ as viable alternatives. The footnotes are correctly anchored: a to ‘अधोलोक’ and b to the final clause it qualifies.'
