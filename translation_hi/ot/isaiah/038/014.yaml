base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/014.yaml
  text: Like a swift or a crane[a], so I chirp; I moan like a dove. My eyes grow weak looking upward. Lord, I am oppressed; be my pledge.
translation:
  language: hi
  text: 'अबाबील या सारस[a] की तरह मैं चहचहाता हूँ;

    कबूतरी की तरह कराहता हूँ।

    ऊपर देखते-देखते मेरी आँखें थक गई हैं।

    हे प्रभु, मुझ पर अत्याचार हो रहा है;

    मेरे लिए ज़मानत दे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्विफ्ट या सारस।” पहले पक्षी की पहचान अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּסוּס עָגוּר
  choice: अबाबील या सारस
  rationale: दोनों पक्षी-संज्ञाओं में, विशेषकर סוּס की पहचान अनिश्चित है। ‘अबाबील या सारस’ पक्षियों की ध्वनि पर आधारित उपमा को स्वाभाविक हिन्दी में रखता है और ‘या’ के द्वारा अनिश्चितता को खुला छोड़ता है।
- source_word: אֲצַפְצֵף
  choice: मैं चहचहाता हूँ
  rationale: यह क्रिया पक्षियों की ऊँची, हल्की ध्वनि को व्यक्त करती है; ‘चहचहाता हूँ’ आधुनिक हिन्दी में सहज और चित्रात्मक है।
- source_word: אֶהְגֶּה
  choice: कराहता हूँ
  rationale: मूल क्रिया धीमी ध्वनि, बुदबुदाहट या विलाप का बोध करा सकती है। दुःख के इस प्रसंग में ‘कराहता हूँ’ वक्ता की पीड़ा को उचित रूप से व्यक्त करता है।
- source_word: כַּיּוֹנָה
  choice: कबूतरी की तरह
  rationale: स्त्रीलिंग संज्ञा יוֹנָה के अनुरूप ‘कबूतरी’ रखा गया है; उसकी गुटरगूँ जैसी शोकपूर्ण ध्वनि यहाँ कराहने की उपमा बनती है।
- source_word: דַּלּוּ עֵינַי
  choice: मेरी आँखें थक गई हैं
  rationale: मुहावरा लगातार ताकते रहने से आँखों के निर्बल या निष्फल हो जाने को व्यक्त करता है। ‘थक गई हैं’ सहज हिन्दी में उसी शारीरिक और भावनात्मक क्षीणता को संप्रेषित करता है।
- source_word: לַמָּרוֹם
  choice: ऊपर देखते-देखते
  rationale: शाब्दिक अर्थ ‘ऊँचाई की ओर’ है। यह अनुवाद दृष्टि की दिशा स्पष्ट करता है, पर मूल से अधिक विशिष्ट ‘स्वर्ग’ नहीं जोड़ता।
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: यह परमेश्वर के लिए प्रयुक्त उपाधि है और यहाँ सीधे संबोधन में है; ‘हे प्रभु’ आधुनिक, सम्मानपूर्ण और स्पष्ट है।
- source_word: עָשְׁקָה לִּי
  choice: मुझ पर अत्याचार हो रहा है
  rationale: संक्षिप्त और कठिन इब्रानी वाक्यांश עשׁק धातु से उत्पीड़न या अन्याय का भाव देता है। वर्तमानकालीन शिकायत इस विलाप के अनुरूप है।
- source_word: עָרְבֵנִי
  choice: मेरे लिए ज़मानत दे
  rationale: क्रिया किसी के लिए जामिन या प्रत्याभूति देने का कानूनी-संबंधपरक बिंब रखती है। यह रूप ‘मेरी सहायता कर’ जैसे सामान्यीकरण की अपेक्षा मूल बिंब को अधिक सुरक्षित रखता है।
theological_decisions:
- issue: אֲדֹנָי में परमेश्वर को संबोधन
  choice: हे प्रभु
  alternative: हे मेरे प्रभु
  rationale: मूल शब्द परमेश्वर की उपाधि है, न कि चतुरक्षरीय वाचा-नाम। हिन्दी में संबोधन स्पष्ट करने के लिए ‘हे’ जोड़ा गया, जबकि मूल में यहाँ अलग से व्यक्त ‘मेरे’ को नहीं जोड़ा गया।
- issue: כְּסוּס עָגוּר में पक्षियों की अनिश्चित पहचान
  choice: अबाबील या सारस
  alternative: स्विफ्ट या सारस
  rationale: प्राणी-विज्ञान संबंधी पहचान निश्चित नहीं है। मुख्य पाठ और पादटिप्पणी अनिश्चितता को बनाए रखते हैं और किसी एक पहचान को निर्विवाद नहीं ठहराते।
- issue: עָרְבֵנִי का कानूनी-संबंधपरक रूपक
  choice: मेरे लिए ज़मानत दे
  alternative: मेरी सहायता कर
  rationale: प्रार्थना परमेश्वर से केवल सामान्य सहायता नहीं, बल्कि वक्ता के लिए जामिन बनने का आग्रह करती है। इसलिए मूल का रूपक बनाए रखा गया है, यद्यपि उसका आशय सहायता और सुरक्षा भी समेटता है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और विलाप के काव्यात्मक स्वर के अनुकूल रखी गई है। ‘चहचहाता’ और ‘कराहता’ ऊँची तथा धीमी पक्षी-ध्वनियों का विरोध उभारते हैं। ‘ज़मानत दे’ कुछ औपचारिक है, पर मूल के कानूनी रूपक को सामान्य पाठक के लिए अपेक्षाकृत स्पष्ट रखते हुए सुरक्षित करता है।
