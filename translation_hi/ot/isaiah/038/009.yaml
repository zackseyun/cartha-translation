lexical_decisions:
- source_word: מִכְתָּב
  choice: लिखित रचना
  rationale: यह संज्ञा किसी लिखी हुई रचना या दस्तावेज़ को सूचित करती है, पर उसकी सटीक साहित्यिक विधा तय नहीं करती। ‘लिखित रचना’ इस व्यापकता को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: לְחִזְקִיָּהוּ
  choice: हिजकिय्याह की
  rationale: शीर्षक में לְ को रचना के संबंध या कर्तृत्व के संकेत के रूप में समझा गया है। हिन्दी में ‘हिजकिय्याह की’ संक्षिप्त और स्वाभाविक है।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा
  rationale: यह सीधी संबंध-रचना हिजकिय्याह के पद और राज्य की पहचान कराती है।
- source_word: בַּחֲלֹתוֹ
  choice: जब वह बीमार था
  rationale: בְּ के साथ infinitive construct समयगत परिस्थिति बताता है। यह अनुवाद बीमारी आरम्भ होने का ऐसा भाव नहीं जोड़ता जो रूप में स्पष्ट नहीं है।
- source_word: וַיְחִי
  choice: स्वस्थ हो गया था
  rationale: शाब्दिक अर्थ ‘और वह जी उठा/जीवित हुआ’ है, पर ‘अपनी बीमारी से’ के साथ यह स्वास्थ्य-लाभ का मुहावरा है; ‘स्वस्थ हो गया’ पुनरुत्थान का अनावश्यक अर्थ जोड़े बिना आशय व्यक्त करता है।
- source_word: מֵחָלְיוֹ
  choice: अपनी बीमारी से
  rationale: מִן स्रोत या अलगाव बताता है—बीमारी की दशा से निकलना। यह पूर्ववर्ती ‘बीमार’ से स्पष्ट संबंध बनाए रखता है।
