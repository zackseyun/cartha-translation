  footnotes:
  - marker: a
    text: या ‘हिजकिय्याह की कविता,’ ‘हिजकिय्याह का लेख,’ अथवा ‘हिजकिय्याह का लिखित वृत्तांत।’ इब्रानी शब्द किसी लिखित रचना को सूचित करता है, पर उसकी सटीक साहित्यिक विधा नहीं बताता।
