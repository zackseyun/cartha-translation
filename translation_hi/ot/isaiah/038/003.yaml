base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/003.yaml
  text: And he said[a], “Please, O Yahweh, remember how I have walked before you in faithfulness and with a whole heart[c][b], and have done what is good in your eyes.” And Hezekiah wept greatly.
translation:
  language: hi
  text: और उसने कहा, “हे यहोवा, कृपया स्मरण कर कि मैं तेरे सामने सच्चाई से और पूरे मन से चलता आया हूँ, और मैंने वही किया है जो तेरी दृष्टि में अच्छा है।” तब हिजकिय्याह बहुत रोया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: शाब्दिक रूप से, “उसने बड़ा रोना रोया।”
    reason: literal_rendering
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से व्यक्त किया गया है।
- source_word: אָנָּה ... נָא
  choice: कृपया
  rationale: दोनों विनय-सूचक अव्ययों की प्रार्थनापूर्ण और आग्रहपूर्ण शक्ति को स्वाभाविक आधुनिक हिन्दी में एक साथ व्यक्त करता है।
- source_word: זְכָר
  choice: स्मरण कर
  rationale: आज्ञार्थक विनती को गरिमापूर्ण और स्पष्ट हिन्दी में रखता है।
- source_word: הִתְהַלַּכְתִּי לְפָנֶיךָ
  choice: मैं तेरे सामने ... चलता रहा हूँ
  rationale: परमेश्वर के सम्मुख जीवन-आचरण के बाइबिलीय रूपक को बनाए रखता है; सतत भूतकालीन आचरण भी व्यक्त होता है।
- source_word: בֶּאֱמֶת
  choice: सच्चाई
  rationale: यहाँ सत्यनिष्ठा और विश्वासयोग्यता दोनों का भाव संभव है; ‘सच्चाई’ हिन्दी में इस अर्थ-क्षेत्र को खुला रखती है।
- source_word: וּבְלֵב שָׁלֵם
  choice: पूरे मन से
  rationale: सम्पूर्ण अथवा अविभाजित निष्ठा का अर्थ देता है, पर निष्पाप सिद्धता का अनावश्यक संकेत नहीं देता।
- source_word: וְהַטּוֹב בְּעֵינֶיךָ עָשִׂיתִי
  choice: मैंने वही किया है जो तेरी दृष्टि में अच्छा है
  rationale: मूल के मूल्यांकन-संबंधी मुहावरे ‘तेरी आँखों में अच्छा’ को स्वाभाविक हिन्दी ‘तेरी दृष्टि में अच्छा’ से सुरक्षित रखता है।
- source_word: וַיֵּבְךְּ ... בְּכִי גָדוֹל
  choice: फूट-फूटकर रोया
  rationale: मूल के तीव्रतासूचक सजातीय प्रयोग, शाब्दिक रूप से ‘बड़ा रोना रोया,’ को स्वाभाविक हिन्दी में प्रबल रुदन के रूप में व्यक्त करता है।
- source_word: חִזְקִיָּהוּ
  choice: हिजकिय्याह
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी बाइबिलीय परंपरा में पहचाना जाने वाला लिप्यंतरण है।
theological_decisions:
- issue: हिजकिय्याह के आत्म-वर्णन को निष्पाप सिद्धता का दावा बनाए बिना प्रस्तुत करना
  choice: पूरे मन से
  alternative: सिद्ध मन से / अविभाजित मन से
  rationale: שָׁלֵם सम्पूर्ण और निष्कपट निष्ठा का संकेत देता है। ‘पूरे मन से’ इस अर्थ को बनाए रखता है, पर पूर्ण निष्पापता का धर्मवैज्ञानिक निष्कर्ष नहीं थोपता।
- issue: בֶּאֱמֶת के सत्य और विश्वासयोग्यता-संबंधी अर्थ
  choice: सच्चाई
  alternative: विश्वासयोग्यता / सत्यनिष्ठा
  rationale: संदर्भ में निष्ठावान आचरण प्रमुख है, फिर भी मूल शब्द का ‘सत्य’ संबंधी आयाम वास्तविक है; ‘सच्चाई’ उस अर्थगत तनाव को बनाए रखती है और पादटिप्पणी विकल्प स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। ‘तेरे’ का प्रयोग प्रत्यक्ष एकवचन संबोधन और हिन्दी बाइबिलीय शैली के अनुरूप है। मूल का ‘चलना’ रूपक तथा ‘तेरी दृष्टि में अच्छा’ मुहावरा सुरक्षित रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
