source:
  edition: WLC
  text: אֲדֹנָ֖/י עֲלֵי/הֶ֣ם יִֽחְי֑וּ וּ/לְ/כָל בָּ/הֶן֙ חַיֵּ֣י רוּחִ֔/י וְ/תַחֲלִימֵ֖/נִי וְ/הַחֲיֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/016.yaml
  text: Lord[a], by these things men live, and in all these is the life of my spirit[c][b]; so restore me to health and let me live.
translation:
  language: hi
  text: हे प्रभु, इन बातों से लोग जीवित रहते हैं[a], और इन सब में मेरी आत्मा का जीवन है; इसलिए मुझे फिर से स्वस्थ कर[b] और मुझे जीवित रख[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वे जीवित रहते हैं” अथवा “मनुष्य जीवित रहता है”; इब्रानी क्रिया का कर्ता स्पष्ट रूप से नहीं दिया गया है।
    reason: lexical_alternative
  - marker: b
    text: या “मुझे चंगा कर।” मूल क्रिया किसी को स्वस्थ करने या फिर से स्वास्थ्य देने का अर्थ रख सकती है।
    reason: lexical_alternative
  - marker: c
    text: या “मुझे फिर से जीवन दे” अथवा “मेरे प्राण बचा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: ईश्वर को सीधे संबोधित करने वाले आदरपूर्ण दिव्य पदनाम के रूप में; हिन्दी में संबोधन स्पष्ट करने के लिए ‘हे’ स्वाभाविक है।
- source_word: עֲלֵיהֶם
  choice: इन्हीं बातों से
  rationale: यह पद पिछले अनुभवों या वास्तविकताओं की ओर संकेत करता है और यहाँ जीवन के साधन अथवा आधार का भाव देता है। ‘से’ उस अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: יִחְיוּ
  choice: लोग जीवित रहते हैं
  rationale: क्रिया तृतीय पुरुष बहुवचन है, पर उसका स्पष्ट कर्ता नहीं दिया गया। ‘लोग’ सामान्य मानवीय संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: וּלְכָל בָּהֶן
  choice: और इन्हीं सब में
  rationale: पूर्वोक्त बातों को समग्र रूप से संदर्भित करते हुए मूल के क्षेत्रवाचक ‘में’ को बनाए रखता है।
- source_word: חַיֵּי רוּחִי
  choice: मेरी आत्मा का जीवन
  rationale: रूअख यहाँ मनुष्य के भीतर के जीवन या जीवनी-शक्ति को सूचित करती है; ‘आत्मा’ मूल की व्यापकता को केवल श्वास तक सीमित नहीं करती।
- source_word: וְתַחֲלִימֵנִי
  choice: मुझे फिर से स्वस्थ कर
  rationale: हिफ़ील रूप बीमारी से स्वास्थ्य में लौटाने का कारणवाचक भाव देता है; यह अनुवाद उस पुनर्स्थापना को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְהַחֲיֵנִי
  choice: मुझे जीवित रख
  rationale: हिफ़ील रूप का अर्थ जीवित करना, जीवन देना या जीवित बनाए रखना हो सकता है। बीमारी से बचाए जाने की प्रार्थना में ‘जीवित रख’ सहज है, जबकि अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
theological_decisions:
- issue: יִחְיוּ का अनिर्दिष्ट कर्ता
  choice: सामान्य मानवीय कर्ता के रूप में ‘लोग जीवित रहते हैं’
  alternative: ‘वे जीवित रहते हैं’ अथवा ‘मनुष्य जीवित रहता है’
  rationale: इब्रानी में कर्ता स्पष्ट नहीं है। मुख्य पाठ में सामान्य अर्थ को पठनीय रखा गया है, पर किसी विशिष्ट समूह की पहचान नहीं जोड़ी गई।
- issue: רוּחִי का अर्थ-क्षेत्र
  choice: ‘मेरी आत्मा’
  alternative: ‘मेरे प्राण’ अथवा ‘मेरी श्वास’
  rationale: प्रसंग शारीरिक आरोग्य और जीवन से जुड़ा है, फिर भी शब्द केवल साँस नहीं बल्कि भीतरी जीवन-शक्ति को भी सूचित कर सकता है। ‘आत्मा’ इस व्यापकता को बनाए रखता है और आत्मा-शरीर संबंध पर अतिरिक्त सिद्धान्त नहीं थोपता।
- issue: וְהַחֲיֵנִי में जीवन देने या बचाए रखने का भाव
  choice: ‘मुझे जीवित रख’
  alternative: ‘मुझे फिर से जीवन दे’
  rationale: राजा बीमारी और मृत्यु के संकट में प्रार्थना कर रहा है। ‘जीवित रख’ संरक्षण के प्रसंग में उपयुक्त है, पर मूल में पुनर्जीवित करने का संभावित भाव पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, प्रार्थनात्मक और गरिमापूर्ण रूप अपनाया गया है। ‘हे प्रभु’ सीधा संबोधन स्पष्ट करता है; ‘इन्हीं बातों’ पूर्ववर्ती प्रसंग से संबंध को बनाए रखता है। सभी वास्तविक अर्थ-विकल्प पादटिप्पणियों में दिए गए हैं।
