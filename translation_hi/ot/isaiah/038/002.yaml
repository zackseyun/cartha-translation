  yaml_path: translation/ot/isaiah/038/002.yaml
  text: Then Hezekiah turned his face to the wall and prayed to Yahweh[b][a],
translation:
  language: hi
  text: तब हिजकिय्याह ने अपना मुख दीवार की ओर[a] फेर लिया और याहवे[b] से प्रार्थना की।
  philosophy: optimal-equivalence
