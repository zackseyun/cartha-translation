    text: 'इब्रानी: “YHWH”; इसका परंपरागत रूप से “यहोवा” के रूप में लिप्यंतरण या “प्रभु” के रूप में अनुवाद भी किया गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: फेर लिया
  rationale: हिफ़ील रूप यहाँ शारीरिक रूप से दिशा बदलने का संकेत देता है। ‘मुख … फेर लिया’ स्वाभाविक हिन्दी है और दृश्य की ठोस क्रिया बनाए रखता है।
- source_word: חִזְקִיָּהוּ
  choice: हिजकिय्याह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: פָּנָיו
  choice: अपना मुख
  rationale: इब्रानी में शरीर के अंग ‘मुख’ का स्पष्ट उल्लेख है; इसे बनाए रखने से हिजकिय्याह की मुद्रा और प्रसंग का भाव सुरक्षित रहता है।
- source_word: אֶל הַקִּיר
  choice: दीवार की ओर
  rationale: אֶל दिशा या लक्ष्य बता सकता है। ‘की ओर’ आधुनिक हिन्दी में स्वाभाविक है और यह अनावश्यक रूप से नहीं बताता कि उनका मुख दीवार को छू रहा था।
- source_word: וַיִּתְפַּלֵּל
  choice: प्रार्थना की
  rationale: התפעל रूप में פלל का सामान्य अर्थ परमेश्वर से प्रार्थना करना है।
- source_word: אֶל יְהוָה
  choice: याहवे से
  rationale: אֶל प्रार्थना के संबोधित व्यक्ति को दर्शाता है; हिन्दी में ‘से प्रार्थना की’ स्वाभाविक प्रयोग है। יהוה को उपाधि से बदलने के बजाय उसके व्यक्तिगत नाम के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम יהוה है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है; पादटिप्पणी अन्य पारंपरिक प्रस्तुतियों से पाठक को परिचित कराती है, बिना मूल नाम को मुख्य पाठ में उपाधि से बदलने के।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अपना मुख … फेर लिया’ मूल की शारीरिक मुद्रा को सुरक्षित रखता है, जबकि ‘से प्रार्थना की’ लक्ष्य भाषा में स्वाभाविक वाक्य-विन्यास देता है।
