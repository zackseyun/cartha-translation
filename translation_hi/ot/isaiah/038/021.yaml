    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने कहा था
  rationale: रूप सामान्यतः ‘और उसने कहा’ है, पर यहाँ वचन पिछले घटनाक्रम की व्याख्यात्मक पृष्ठभूमि देता है; इसलिए हिन्दी में पूर्ण भूतकाल स्वाभाविक है।
- source_word: יִשְׂאוּ
  choice: लाकर
  rationale: נשׂא का अर्थ उठाना, ले जाना या लाना हो सकता है; उपचार की वस्तु मँगाने के प्रसंग में ‘लाकर’ सहज है।
- source_word: דְּבֶלֶת תְּאֵנִים
  choice: अंजीरों की एक टिकिया
  rationale: यह पद दबाकर बनाए गए अंजीरों के पिंड या टिकिया को दर्शाता है; ‘टिकिया’ आधुनिक हिन्दी में स्पष्ट और स्रोत के निकट है।
- source_word: וְיִמְרְחוּ
  choice: लगा दो
  rationale: מרח का मूल भाव मलने या फैलाकर लगाने का है; औषधीय प्रसंग में ‘लगा दो’ स्वाभाविक और स्पष्ट है।
- source_word: עַל הַשְּׁחִין
  choice: फोड़े पर
  rationale: שְׁחִין सूजे हुए त्वचा-घाव या फोड़े को दर्शाता है; यहाँ ‘फोड़ा’ सीधा और प्रचलित अनुवाद है।
- source_word: וְיֶחִי
  choice: ताकि वह चंगा हो जाए
  rationale: חיה का शाब्दिक अर्थ ‘जीना’ है, किंतु रोग से स्वस्थ होने के प्रसंग में ‘चंगा हो जाए’ आशय को स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
