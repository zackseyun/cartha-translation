reference: Isaiah 38:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְהוָ֖ה לְ/הוֹשִׁיעֵ֑/נִי וּ/נְגִנוֹתַ֧י נְנַגֵּ֛ן כָּל יְמֵ֥י חַיֵּ֖י/נוּ עַל בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/020.yaml
  text: Yahweh is ready to save me[c][b][a]; and we will play my songs on stringed instruments all the days of our lives at the house of Yahweh.
translation:
  language: hi
  text: याहवे मुझे बचाने को तैयार हैं[a]; और हम जीवन भर याहवे के भवन में[c] तार-वाद्यों पर मेरी धुनें बजाएँगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “याहवे मुझे बचाएँगे” भी हो सकता है। अधिक शाब्दिक रूप है, “याहवे मुझे बचाने के लिए”; हिब्रू अभिव्यक्ति अण्डाकार है।
    reason: मूल हिब्रू की अण्डाकार वाक्य-रचना और उसके वैकल्पिक अर्थों को सुरक्षित रखना।
  - marker: b
    text: या “मेरा संगीत” अथवा “मेरा तार-वाद्य-संगीत।”
    reason: נְגִינוֹת के संगीत और तार-वाद्य से जुड़े अर्थ-क्षेत्र को दिखाना।
  - marker: c
    text: या “याहवे के भवन में।” हिब्रू में शाब्दिक पूर्वसर्ग “पर” है, जो यहाँ उपासना-स्थल से संबंध सूचित करता है।
    reason: עַל के असामान्य स्थानीय प्रयोग और संभावित स्थानगत विकल्प को बताना।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी में प्रचलित निकट लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: לְהוֹשִׁיעֵנִי
  choice: मुझे बचाने को तैयार हैं
  rationale: לְ के साथ क्रिया का infinitive construct यहाँ अपूर्ण या लुप्त-पद वाली अभिव्यक्ति है। संदर्भ में यह याहवे की बचाने की तत्परता अथवा निश्चित बचाने की क्रिया को व्यक्त कर सकता है; मुख्य पाठ स्वाभाविक हिन्दी में तत्परता का भाव देता है और विकल्प पादटिप्पणी में रखता है।
- source_word: וּנְגִינוֹתַי
  choice: तार वाले वाद्यों पर मेरी धुनें
  rationale: נְגִינוֹת संगीत या विशेष रूप से तार वाले वाद्यों से जुड़ी धुनों को सूचित कर सकता है। यह अनुवाद possessive ‘मेरी’ और वाद्य-संगीत, दोनों संकेतों को बनाए रखता है।
- source_word: נְנַגֵּן
  choice: हम ... बजाएँगे
  rationale: נגן का पिएल रूप वाद्य बजाने या संगीत करने का अर्थ देता है। प्रथम पुरुष बहुवचन और भावी/संकल्पात्मक बल को स्वाभाविक हिन्दी में रखा गया है।
- source_word: כָּל יְמֵי חַיֵּינוּ
  choice: जीवन भर
  rationale: शाब्दिक ‘हमारे जीवन के सभी दिन’ का संक्षिप्त और सहज हिन्दी मुहावरा, जिसमें आजीवन अवधि बनी रहती है।
- source_word: עַל בֵּית יְהוָה
  choice: याहवे के भवन में
  rationale: עַל सामान्यतः ‘पर/ऊपर’ है, पर यहाँ उपासना के स्थान से संबंधित स्थानीय अर्थ देता है। हिन्दी में ‘भवन में’ संदर्भानुकूल है; स्थान-संबंधी व्यापक विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उस नाम को उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: לְהוֹשִׁיעֵנִי की अपूर्ण वाक्य-रचना
  choice: मुझे बचाने को तैयार हैं
  alternative: 'मुझे बचाएँगे; शाब्दिक: मुझे बचाने के लिए'
  rationale: हिब्रू अभिव्यक्ति में स्पष्ट finite verb नहीं है। मुख्य अनुवाद संदर्भगत तत्परता व्यक्त करता है, जबकि निश्चित भविष्य और शाब्दिक अपूर्ण रूप को पादटिप्पणी में देकर मूल की वास्तविक अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जीवन भर’ सामान्य हिन्दी मुहावरा है; ‘भवन’ उपासना-स्थल के लिए dignified शब्द है। वाक्य में मूल के एकवचन ‘मेरी’ और बहुवचन ‘हम’ के तनाव को बिना समझाए या समतल किए बनाए रखा गया है।
