base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/008.yaml
  text: Behold[a], I will make the shadow go back ten steps, which had gone down on the steps of Ahaz by the sun[b]. And the sun went back ten steps on the steps on which it had gone down.
translation:
  language: hi
  text: “देखो, मैं आहाज़ की उन सीढ़ियों[b] की छाया को दस सीढ़ियाँ[a] पीछे लौटा दूँगा, जिन पर सूर्य नीचे उतर गया था।” और सूर्य उन सीढ़ियों पर दस सीढ़ियाँ पीछे लौट गया, जिन पर वह नीचे उतर गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दस अंश।” इब्रानी शब्द का शाब्दिक अर्थ “सीढ़ियाँ” या “चढ़ाव” है; कुछ लोग इसे सीढ़ीनुमा धूपघड़ी का संकेत मानते हैं।
    reason: lexical_alternative
  - marker: b
    text: या “आहाज़ की धूपघड़ी।” इब्रानी में “आहाज़ की सीढ़ियाँ” है; सम्भव है कि यह सूर्य की छाया मापने के लिए प्रयुक्त किसी संरचना को दर्शाता हो।
    reason: alternative_reading
lexical_decisions:
- source_word: הִנְנִי
  choice: देख, मैं
  rationale: यह पद एक गंभीर ईश्वरीय घोषणा आरम्भ करता है। ‘देख, मैं’ मूल के संकेतात्मक और ध्यान आकर्षित करने वाले बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מֵשִׁיב
  choice: पीछे लौटा दूँगा
  rationale: שוב का हिफ़ील रूप कारक अर्थ देता है; इसलिए यह चयन स्पष्ट करता है कि परमेश्वर छाया को वापस कराएगा।
- source_word: צֵל
  choice: छाया
  rationale: मूल में चिन्ह के दृश्य पक्ष के लिए सीधा और ठोस शब्द है; इसे बिना व्याख्यात्मक विस्तार के रखा गया है।
- source_word: מַעֲלוֹת
  choice: सीढ़ियाँ
  rationale: शब्द का मूल अर्थ ‘सीढ़ियाँ’ या ‘चढ़ाव’ है। ‘अंश’ सम्भव व्याख्या है, पर वह किसी समय-मापक यंत्र की धारणा को पहले से मान लेती है।
- source_word: בְמַעֲלוֹת אָחָז
  choice: आहाज़ की सीढ़ियों पर
  rationale: यह मूल पदबंध का सीधा रूप है और उस संरचना का ठीक स्वरूप अनिर्धारित छोड़ता है।
- source_word: בַּשֶּׁמֶשׁ
  choice: सूर्य के कारण
  rationale: यह छाया के नीचे उतरने में सूर्य की भूमिका को व्यक्त करता है, बिना किसी विशिष्ट यांत्रिक व्यवस्था को मान लेने के।
- source_word: אֲחֹרַנִּית עֶשֶׂר מַעֲלוֹת
  choice: दस सीढ़ियाँ पीछे
  rationale: दिशा और माप दोनों को स्पष्ट रखते हुए मूल की ठोस सीढ़ी-संबंधी भाषा सुरक्षित रखी गई है।
- source_word: וַתָּשָׁב הַשֶּׁמֶשׁ
  choice: तब सूर्य ... पीछे लौट गया
  rationale: इब्रानी पाठ स्पष्ट रूप से ‘सूर्य’ को कर्ता बनाता है। अनुवाद घटना को उसी प्रेक्षणात्मक भाषा में प्रस्तुत करता है।
- source_word: אֲשֶׁר יָרָדָה
  choice: जिन पर वह नीचे उतर गया था
  rationale: यह सूर्य की पहले हुई नीचे की गति की ओर लौटकर संकेत करता है और इब्रानी के दिशात्मक बिंब को बनाए रखता है।
theological_decisions:
- issue: सूर्य और छाया से जुड़े चिन्ह की प्रकृति
  choice: घटना को पाठ की प्रेक्षणात्मक भाषा में चमत्कारी चिन्ह के रूप में प्रस्तुत करना
  alternative: केवल धूपघड़ी की यांत्रिक क्रिया के रूप में अनुवाद करना, या सूर्य के पीछे लौटने की भाषा को टालना
  rationale: इब्रानी पाठ पहले छाया और फिर स्पष्ट रूप से सूर्य के पीछे लौटने का वर्णन करता है। अनुवाद न तो इसे वैज्ञानिक व्याख्या से सीमित करता है और न चमत्कारी तनाव को कम करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘सीढ़ियाँ’ मूल के ठोस बिंब को सुरक्षित रखता है, जबकि पादटिप्पणियाँ ‘अंश’ और ‘धूपघड़ी’ जैसी सम्भव व्याख्याएँ देती हैं। मुख्य पाठ सूर्य के पीछे लौटने की कथन-भाषा को बिना वैज्ञानिक या सम्प्रदायगत स्पष्टीकरण के बनाए रखता है।
