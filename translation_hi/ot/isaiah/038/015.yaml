source:
  edition: WLC
  text: מָֽה אֲדַבֵּ֥ר וְ/אָֽמַר לִ֖/י וְ/ה֣וּא עָשָׂ֑ה אֶדַּדֶּ֥ה כָל שְׁנוֹתַ֖/י עַל מַ֥ר נַפְשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/015.yaml
  text: What can I say? He has spoken to me[a], and he himself has done it. I will walk slowly all my years because of the bitterness of my soul.
translation:
  language: hi
  text: मैं क्या कहूँ? उसने मुझसे कहा है, और उसी ने यह किया है। अपनी आत्मा की कड़वाहट के कारण मैं अपने जीवन के सारे वर्ष धीरे-धीरे चलूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी आत्मा की कड़वाहट में मैं अपने जीवन के सारे वर्ष दबे पाँव चलूँगा।” यह दुर्लभ क्रिया दबे पाँव या धीरे चलने का अर्थ दे सकती है, और “कड़वाहट” वाला वाक्यांश कारण के बजाय चलने की दशा भी बता सकता है।
    reason: दुर्लभ क्रिया और पूर्वसर्गीय वाक्यांश की वास्तविक शाब्दिक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: מָה אֲדַבֵּר
  choice: मैं क्या कहूँ?
  rationale: यह स्वाभाविक हिन्दी में असमर्थता या विस्मय व्यक्त करने वाला आलंकारिक प्रश्न है और इब्रानी की प्रश्नात्मक शक्ति बनाए रखता है।
- source_word: וְאָמַר לִי
  choice: उसने मुझसे कहा है
  rationale: पूर्ण हो चुकी उस वाणी को दर्शाता है जिस पर वक्ता वर्तमान में मनन कर रहा है; हिन्दी में यह सहज और प्रसंगानुकूल है।
- source_word: וְהוּא עָשָׂה
  choice: और उसी ने यह किया है
  rationale: व्यक्त सर्वनाम הוּא के बल को ‘उसी ने’ से सुरक्षित रखा गया है; ‘यह’ उस कर्म को अनिर्दिष्ट छोड़ता है, जैसे मूल पाठ करता है।
- source_word: אֶדַּדֶּה
  choice: मैं ... धीरे-धीरे चलूँगा
  rationale: यह दुर्लभ क्रिया दबे, धीमे या संयत ढंग से चलने का संकेत दे सकती है। मुख्य पाठ में स्पष्ट आधुनिक हिन्दी दी गई है और वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: כָּל שְׁנוֹתַי
  choice: अपने जीवन के सारे वर्ष
  rationale: ‘मेरे सारे वर्ष’ का स्वाभाविक हिन्दी रूप है; ‘शेष’ नहीं जोड़ा गया, क्योंकि वह मूल पाठ में स्पष्ट नहीं है।
- source_word: עַל מַר נַפְשִׁי
  choice: अपनी आत्मा की कड़वाहट के कारण
  rationale: עַל को कारणसूचक समझते हुए अनुवाद किया गया है। נֶפֶשׁ के मानवीय-अस्तित्व संबंधी रूपक को ‘आत्मा’ द्वारा सुरक्षित रखा गया है।
theological_decisions:
- issue: तीसरे पुरुष की क्रियाओं का कर्ता
  choice: कर्ता को सर्वनाम ‘उसने/उसी ने’ के रूप में रखा गया है; प्रसंग में संकेत परमेश्वर की ओर है।
  alternative: पाठ में सीधे ‘परमेश्वर’ या ‘यहोवा’ जोड़ना।
  rationale: आसपास का गीत परमेश्वर की वाणी और कार्य की ओर संकेत करता है, पर इस पद में उसका नाम स्पष्ट रूप से नहीं आता। इसलिए मूल की अंतर्निहितता और धार्मिक तनाव को सुरक्षित रखा गया है।
- issue: कड़वाहट और धीमे चलने का संबंध
  choice: मुख्य पाठ में कड़वाहट को कारण माना गया है।
  alternative: ‘अपनी आत्मा की कड़वाहट में’—कड़वाहट को चलने की दशा या रीति मानना।
  rationale: עַל कारण अथवा संबंध दोनों व्यक्त कर सकता है; मुख्य पाठ में संभावित कारणसूचक अर्थ अपनाया गया है और वास्तविक वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘उसी ने’ इब्रानी के emphatic pronoun का बल व्यक्त करता है। ‘आत्मा की कड़वाहट’ मूल रूपक को बनाए रखता है; विरल क्रिया की अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
