source:
  edition: WLC
  text: חַ֥י חַ֛י ה֥וּא יוֹדֶ֖/ךָ כָּמ֣וֹ/נִי הַ/יּ֑וֹם אָ֣ב לְ/בָנִ֔ים יוֹדִ֖יעַ אֶל אֲמִתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/019.yaml
  text: The living[a], the living—he gives thanks to you, as I do today[b]; a father makes your faithfulness known to children.
translation:
  language: hi
  text: 'जीवित, जीवित व्यक्ति तेरा धन्यवाद करता है,

    जैसे मैं आज करता हूँ;

    पिता बच्चों[a] को तेरी विश्वासयोग्यता[b] बताता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘पुत्रों’। यहाँ यह शब्द सामान्य रूप से अगली पीढ़ी की संतान को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सच्चाई’। इब्रानी אֱמֶת का अर्थ सच्चाई, विश्वासयोग्यता या भरोसेमंदी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי חַי
  choice: जीवित, हाँ, जीवित व्यक्ति
  rationale: इब्रानी की emphatic पुनरुक्ति को बनाए रखते हुए ‘हाँ’ उसके बल को स्वाभाविक हिन्दी में व्यक्त करता है; ‘व्यक्ति’ जोड़ने से संज्ञार्थक विशेषण स्पष्ट होता है।
- source_word: יוֹדֶךָ
  choice: तेरा धन्यवाद करता है
  rationale: इस धन्यवाद-गीत में ידה का हिफ़ील रूप परमेश्वर को धन्यवाद देने या उसकी स्तुति करने का भाव रखता है; यहाँ ‘धन्यवाद करता है’ प्रसंगानुकूल और विशिष्ट है।
- source_word: כָּמוֹנִי הַיּוֹם
  choice: जैसे मैं आज कर रहा हूँ
  rationale: स्वाभाविक हिन्दी के लिए पिछले खंड की क्रिया को यहाँ निहित रूप से दोहराया गया है, जिससे वक्ता की वर्तमान स्थिति से तुलना स्पष्ट होती है।
- source_word: אָב לְבָנִים
  choice: पिता अपने बच्चों को
  rationale: בנים का शाब्दिक अर्थ ‘पुत्रों’ है, पर पीढ़ी-दर-पीढ़ी परमेश्वर की विश्वासयोग्यता बताने के इस सामान्य कथन में यह संतान को व्यापक रूप से सूचित कर सकता है। ‘अपने’ सम्बन्ध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: יוֹדִיעַ
  choice: बताता है
  rationale: ידע के हिफ़ील का अर्थ ‘ज्ञात कराना’ है। ‘बताता है’ साधारण आधुनिक हिन्दी में इस causative भाव को सहजता से व्यक्त करता है।
- source_word: אֲמִתֶּךָ
  choice: तेरी विश्वासयोग्यता
  rationale: אמת सत्य, विश्वसनीयता या निष्ठा का अर्थ दे सकता है। यहाँ अगली पीढ़ी को परमेश्वर के भरोसेमंद चरित्र से परिचित कराने के प्रसंग में ‘विश्वासयोग्यता’ उपयुक्त है, जबकि ‘सच्चाई’ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: בָּנִים का लैंगिक और पीढ़ीगत आशय
  choice: बच्चों
  alternative: पुत्रों
  rationale: रूप की दृष्टि से संज्ञा पुल्लिंग बहुवचन है, किंतु यह सामान्य पीढ़ीगत कथन है और संतान को सामूहिक रूप से सूचित कर सकता है। शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- issue: परमेश्वर के संदर्भ में אֱמֶת का अर्थ
  choice: विश्वासयोग्यता
  alternative: सच्चाई
  rationale: प्रसंग परमेश्वर के भरोसेमंद चरित्र को अगली पीढ़ी तक पहुँचाने पर बल देता है। फिर भी मूल शब्द की ‘सत्य/सच्चाई’ वाली वास्तविक अर्थ-संभावना को पादटिप्पणी में बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक समानांतरता और ‘जीवित’ की emphatic पुनरुक्ति सुरक्षित है। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तेरा/तेरी’ प्रयुक्त हुआ है, जो पद के प्रत्यक्ष संबोधन से मेल खाता है।
