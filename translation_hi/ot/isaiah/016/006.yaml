base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/006.yaml
  text: We have heard of the pride of Moab—how very proud he is—of his arrogance[a], his pride, and his fury; his boasts are not so.
translation:
  language: hi
  text: हमने मोआब के घमंड के बारे में सुना है—कि वह बहुत घमंडी है—उसका अहंकार, उसका घमंड और उसका रोष; उसकी डींगें सच नहीं हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी खोखली बातें सत्य नहीं हैं,” अथवा, “उसके दावे झूठे हैं।” इब्रानी शब्द घमंड भरे दावों, खोखली बातों या झूठ को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ
  choice: हमने ... सुना है
  rationale: काल और रिपोर्ट-सूचक भाव को वर्तमान प्रासंगिकता के साथ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גְאוֹן מוֹאָב
  choice: मोआब का घमंड
  rationale: न्याय के इस प्रसंग में גְאוֹן का आशय महिमा नहीं, बल्कि अभिमानी ऊँचाई है।
- source_word: גֵּא מְאֹד
  choice: वह अत्यन्त घमंडी है
  rationale: מְאֹד की तीव्रता और मूल की जोरदार पुनरुक्ति को स्पष्ट, स्वाभाविक वाक्य में सुरक्षित रखता है।
- source_word: גַּאֲוָתוֹ
  choice: उसका अहंकार
  rationale: निकटार्थी गर्व-सूचक शब्दों की अलंकारिक शृंखला में अर्थभेद बनाए रखने के लिए 'अहंकार' चुना गया है।
- source_word: וּגְאוֹנוֹ
  choice: उसका घमंड
  rationale: גאון की पुनरावृत्ति को उसी केंद्रीय अर्थ 'घमंड' से व्यक्त किया गया है।
- source_word: וְעֶבְרָתוֹ
  choice: उसका क्रोध
  rationale: עברה उफनते रोष या कोप को दर्शाता है; 'क्रोध' वर्तमान मानक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: לֹא כֵן בַּדָּיו
  choice: उसकी डींगें सच नहीं हैं
  rationale: בדיו को संदर्भानुसार घमंड भरे दावों के रूप में लिया गया है और לא כן उनकी सत्यता का निषेध करता है; सम्भव वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित हैं।
