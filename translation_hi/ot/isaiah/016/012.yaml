  text: और जब यह दिखाई देगा कि मोआब ऊँचे स्थान[b] पर थक चुका है[a], और वह प्रार्थना करने के लिए अपने पवित्र स्थान में आएगा, तो वह समर्थ न होगा[c]।
  philosophy: optimal-equivalence
  footnotes:
