    text: 'इसका अनुवाद यह भी हो सकता है: ‘मोआब ऊँचे स्थान पर थका हुआ दिखाई देगा।’ इब्रानी आरंभिक वाक्यांश को व्यक्तिगत या अवैयक्तिक, दोनों प्रकार से समझा जा सकता है।'
    reason: lexical_alternative
