source:
  edition: WLC
  text: שִׁלְחוּ כַ֥ר מֹשֵֽׁל אֶ֖רֶץ מִ/סֶּ֣לַע מִדְבָּ֑רָ/ה אֶל הַ֖ר בַּת צִיּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/001.yaml
  text: Send a lamb to the ruler of the land[b][a], from Sela in the wilderness to the mountain of daughter Zion.
translation:
  language: hi
  text: एक मेमना देश के शासक के पास भेजो[b]—निर्जन प्रदेश में स्थित सेला[a] से सिय्योन की बेटी के पर्वत तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘चट्टान से’ अथवा ‘शैल से’; इब्रानी शब्द סלע सामान्य संज्ञा हो सकता है, यद्यपि यहाँ संभवतः स्थान-नाम सेला है।
    reason: lexical_alternative
  - marker: b
    text: यह मेमना संभवतः शासक को कर-भेंट के रूप में भेजा जाता था।
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ
  choice: भेजो
  rationale: यह שלח का काल आज्ञार्थक, पुल्लिंग बहुवचन रूप है; हिन्दी में ‘भेजो’ संबोधित समुदाय को दी गई सीधी आज्ञा स्वाभाविक रूप से व्यक्त करता है।
- source_word: כַר
  choice: एक मेमना
  rationale: शब्द का प्रत्यक्ष अर्थ मेमना अथवा भेड़-वर्ग का छोटा पशु है। प्रसंग में यह संभवतः कर-भेंट है, पर वह अर्थ मुख्य पाठ में जोड़ने के बजाय टिप्पणी में रखा गया है।
- source_word: מֹשֵׁל אֶרֶץ
  choice: देश के शासक के पास
  rationale: מֹשֵׁל का अर्थ ‘शासन करनेवाला’ और אֶרֶץ का यहाँ क्षेत्रीय प्रसंग में ‘देश’ है। ‘के पास’ हिन्दी में भेजने के प्राप्तकर्ता को सहज ढंग से व्यक्त करता है।
- source_word: מִסֶּלַע
  choice: सेला से
  rationale: סלע सामान्य संज्ञा ‘चट्टान’ हो सकती है, किंतु यहाँ इसे संभवतः स्थान-नाम सेला समझना अधिक उचित है। वैकल्पिक पठन टिप्पणी में सुरक्षित है।
- source_word: מִדְבָּרָה
  choice: जंगल में स्थित
  rationale: दिशासूचक ה के साथ यह रूप कठिन और कुछ अस्पष्ट है। वाक्य-संबंध के अनुसार इसे सेला का स्थान बतानेवाले पद के रूप में प्रस्तुत किया गया है; ‘जंगल’ यहाँ निर्जन वनप्रदेश का बोध देता है, न कि केवल घने वन का।
- source_word: אֶל הַר בַּת צִיּוֹן
  choice: सिय्योन की बेटी के पर्वत तक
  rationale: यह अनुवाद הַר ‘पर्वत’ और काव्यात्मक मानवीकरण בַּת־צִיּוֹן ‘सिय्योन की बेटी’ दोनों को बनाए रखता है; इसे केवल ‘यरूशलेम’ कहकर रूपक को समतल नहीं किया गया।
theological_decisions:
- issue: क्या मेमने को कर-भेंट के रूप में मुख्य पाठ में स्पष्ट किया जाए
  choice: मुख्य पाठ में ठोस शब्द ‘एक मेमना’ रखा गया और संभावित कर-भेंट का आशय टिप्पणी में दिया गया।
  alternative: ‘कर के रूप में एक मेमना भेजो’ अथवा ‘मेमनों की भेंट भेजो।’
  rationale: राजनीतिक प्रसंग कर-भेंट की ओर संकेत करता है, पर इब्रानी पाठ सीधे כַר, ‘मेमना’, कहता है। मुख्य पाठ में व्याख्या जोड़ना मूल की ठोस छवि और उसकी संभावित अर्थ-परत को समय से पहले निश्चित कर देता।
- issue: סלע को स्थान-नाम मानना या सामान्य संज्ञा
  choice: मुख्य पाठ में स्थान-नाम ‘सेला’ रखा गया।
  alternative: ‘चट्टान से’ अथवा ‘चट्टानी दुर्ग से।’
  rationale: भौगोलिक प्रसंग में स्थान-नाम संभावित है, पर इब्रानी रूप सामान्य संज्ञा भी हो सकता है; इसलिए वास्तविक शाब्दिक अस्पष्टता टिप्पणी में रखी गई है।
- issue: מִדְבָּרָה का वाक्यगत संबंध
  choice: इसे सेला का वर्णन मानकर ‘जंगल में स्थित सेला’ किया गया।
  alternative: ‘सेला से जंगल के रास्ते’ अथवा ‘सेला से जंगल की ओर।’
  rationale: रूप में दिशासूचक प्रत्यय होने के कारण निर्माण कठिन है। मुख्य पाठ एक संभव और पठनीय संबंध देता है, जबकि मार्ग अथवा दिशा का अर्थ निश्चित रूप से आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सिय्योन की बेटी’ मूल की काव्यात्मक मानवीकरण-छवि को सुरक्षित रखता है। टिप्पणियों के चिह्न मुख्य पाठ में संबद्ध शब्दों के तुरंत बाद दिए गए हैं।
