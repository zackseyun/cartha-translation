source:
  edition: WLC
  text: כִּ֣י שַׁדְמוֹת֩ חֶשְׁבּ֨וֹן אֻמְלָ֜ל גֶּ֣פֶן שִׂבְמָ֗ה בַּעֲלֵ֤י גוֹיִם֙ הָלְמ֣וּ שְׂרוּקֶּ֔י/הָ עַד יַעְזֵ֥ר נָגָ֖עוּ תָּ֣עוּ מִדְבָּ֑ר שְׁלֻ֣חוֹתֶ֔י/הָ נִטְּשׁ֖וּ עָ֥בְרוּ יָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/008.yaml
  text: For the fields of Heshbon languish[a], the vine of Sibmah as well. The lords of the nations have struck down its choice vines; they reached as far as Jazer, they wandered into the wilderness[c][b]; its shoots spread out and crossed the sea.
translation:
  language: hi
  text: 'क्योंकि हेशबोन के खेत कुम्हला गए हैं,

    और सिबमा की दाखलता भी कुम्हला गई है।

    राष्ट्रों के शासकों ने उसकी उत्तम लताओं को तोड़ डाला;

    वे याजेर तक पहुँच गई थीं,

    वे वीराने में भटकती रहीं;

    उसकी टहनियाँ फैल गईं[a]

    और समुद्र को पार कर गईं।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी टहनियाँ छोड़ दी गईं।” यहाँ प्रयुक्त इब्रानी क्रिया कठिन है और उसका अर्थ एक से अधिक प्रकार से समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “समुद्र” से इस क्षेत्र का मृत सागर अभिप्रेत हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: שַׁדְמוֹת
  choice: खेत
  rationale: यह शब्द खेती की हुई भूमि को सूचित करता है। ‘खेत’ सहज हिन्दी है और सिबमा की दाखलता के समानांतर उपयुक्त बैठता है।
- source_word: אֻמְלָל
  choice: मुरझा गए हैं
  rationale: क्रिया के सूखने, निर्बल होने या कुम्हलाने के भाव को कृषि-संदर्भ में स्वाभाविक रूप से व्यक्त करता है।
- source_word: גֶּפֶן שִׂבְמָה
  choice: सिबमा की दाखलता
  rationale: इब्रानी के काव्यात्मक एकवचन को बनाए रखता है; यहाँ एक दाखलता पूरे दाख-उत्पादक क्षेत्र का सामूहिक चित्र हो सकती है।
- source_word: בַּעֲלֵי גוֹיִם
  choice: राष्ट्रों के शासक
  rationale: בעלים यहाँ स्वामियों अथवा प्रभुओं के अर्थ में विदेशी शासकों या विजेताओं को सूचित करता है; आधुनिक हिन्दी में ‘शासक’ स्पष्ट और गरिमापूर्ण है।
- source_word: הָלְמוּ
  choice: तोड़ डाला
  rationale: मूल क्रिया प्रहार करने का बोध देती है। लताओं के संदर्भ में ‘तोड़ डाला’ विनाशकारी आघात को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׂרוּקֶיהָ
  choice: उसकी उत्तम लताओं
  rationale: यह कठिन शब्द चुनी हुई या उत्कृष्ट दाख की बेलों/लताओं का बोध करा सकता है; ‘उत्तम लताओं’ गुणवत्ता के भाव और काव्यात्मक बहुवचन दोनों को रखता है।
- source_word: עַד יַעְזֵר נָגָעוּ
  choice: वे याजेर तक पहुँच गई थीं
  rationale: निकटवर्ती पंक्तियों में दाखलता की वृद्धि और विस्तार का वर्णन है; इसलिए स्त्रीलिंग बहुवचन को लताओं से जोड़ना संदर्भानुकूल है।
- source_word: תָּעוּ מִדְבָּר
  choice: वे वीराने में भटकती हुई फैल गई थीं
  rationale: ‘भटकना’ क्रिया के मूल रूपक को रखता है, जबकि ‘फैल गई थीं’ हिन्दी पाठक को बताता है कि बात लताओं के व्यापक विस्तार की है।
- source_word: שְׁלֻחוֹתֶיהָ
  choice: उसकी डालियाँ
  rationale: शाब्दिक रूप से बाहर भेजी गई बढ़वार या शाखाओं का संकेत है; दाखलता के लिए ‘डालियाँ’ सामान्य और स्पष्ट हिन्दी है।
- source_word: נִטְּשׁוּ
  choice: दूर तक फैल गईं
  rationale: रूप कठिन है और छोड़े जाने अथवा खुला फैलने का अर्थ दे सकता है; समानांतर ‘समुद्र को पार कर गईं’ के कारण विस्तार का अर्थ मुख्य पाठ में उपयुक्त है, पर अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: עָבְרוּ יָם
  choice: समुद्र को पार कर गईं
  rationale: मूल वाक्यांश का सीधा अर्थ बनाए रखता है और समुद्र की विशिष्ट पहचान मुख्य पाठ में तय नहीं करता।
