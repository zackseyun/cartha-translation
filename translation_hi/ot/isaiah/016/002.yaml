source:
  edition: WLC
  text: וְ/הָיָ֥ה כְ/עוֹף נוֹדֵ֖ד קֵ֣ן מְשֻׁלָּ֑ח תִּֽהְיֶ֨ינָה֙ בְּנ֣וֹת מוֹאָ֔ב מַעְבָּרֹ֖ת לְ/אַרְנֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/002.yaml
  text: And like a wandering bird[a], like a scattered nest[b], so the daughters of Moab will be at the fords of the Arnon.
translation:
  language: hi
  text: और भटकते हुए पक्षी के समान, बिखरे हुए घोंसले के समान[a], मोआब की बेटियाँ[b] अर्नोन के घाटों पर होंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक भाव ‘निकाला गया’ या ‘दूर कर दिया गया घोंसला’ भी हो सकता है। संक्षिप्त काव्यात्मक छवि किसी उजड़े और छोड़ दिए गए घोंसले की ओर संकेत करती है।
    reason: lexical_alternative
  - marker: b
    text: ‘मोआब की बेटियाँ’ से मोआबी स्त्रियाँ अभिप्रेत हो सकती हैं; यह मोआब के नगरों या बस्तियों का मानवीकरण भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה ... תִּהְיֶינָה
  choice: और ... होंगी
  rationale: आरंभिक वाव और היה का रूप आगामी स्थिति का परिचय देता है; स्त्रीलिंग बहुवचन कर्ता के अनुरूप ‘होंगी’ स्वाभाविक और सटीक है।
- source_word: כְעוֹף נוֹדֵד
  choice: भटकते हुए पक्षी के समान
  rationale: עוֹף का सामान्य अर्थ ‘पक्षी’ है और נוֹדֵד अस्थिर भटकने या दूर जा पड़ने का भाव देता है। यह अनुवाद विस्थापन की छवि रखता है, पर भय या पलायन को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: קֵן מְשֻׁלָּח
  choice: बिखरे हुए घोंसले के समान
  rationale: शाब्दिक रूप से यह ‘निकाला/दूर किया गया घोंसला’ है। ‘बिखरा हुआ घोंसला’ हिन्दी में उजड़ने, असुरक्षा और तितर-बितर होने की संक्षिप्त काव्यात्मक छवि को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּנוֹת מוֹאָב
  choice: मोआब की बेटियाँ
  rationale: शाब्दिक अभिव्यक्ति को बनाए रखने से मोआबी स्त्रियों और मानवीकृत नगरों/बस्तियों—दोनों संभावित संकेतों की काव्यात्मक अस्पष्टता सुरक्षित रहती है।
- source_word: מַעְבָּרוֹת לְאַרְנוֹן
  choice: अर्नोन के घाटों पर
  rationale: מַעְבָּרוֹת नदी पार करने के उथले स्थानों को दर्शाता है; हिन्दी में ‘घाट’ इस भौगोलिक संदर्भ में स्वाभाविक है और बहुवचन भी बनाए रखता है।
theological_decisions:
- issue: ‘मोआब की बेटियाँ’ का संकेत
  choice: शाब्दिक और काव्यात्मक रूप ‘मोआब की बेटियाँ’ रखा गया
  alternative: ‘मोआब की स्त्रियाँ’ या ‘मोआब के नगर’
  rationale: मूल पाठ यह निश्चित नहीं करता कि अभिव्यक्ति केवल स्त्रियों के लिए है या मोआब की बस्तियों के मानवीकरण के लिए; इसलिए किसी एक व्याख्या को मुख्य पाठ में थोपना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी में रखी गई है। समानांतर इब्रानी उपमाओं को स्पष्ट करने के लिए दोनों के साथ ‘के समान’ दोहराया गया है। ‘घाट’ सामान्य पाठक के लिए ‘नदी पार करने के उथले स्थान’ की तुलना में अधिक संक्षिप्त और काव्यात्मक है।
