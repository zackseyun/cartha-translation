base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/014.yaml
  text: But now Yahweh has spoken[a], saying, “Within three years, like the years of a hired worker, the glory of Moab will be brought low, with all its great multitude; and the remnant will be few, very small[c][b], not mighty.”
translation:
  language: hi
  text: पर अब याहवे ने कहा है, “तीन वर्षों के भीतर—जैसे किसी मज़दूर के वर्ष गिने जाते हैं[a]—मोआब का गौरव उसके सारे विशाल जनसमूह समेत तुच्छ हो जाएगा[b]; और जो बचेंगे, वे थोड़े, बहुत कम, और सामर्थ्यवान नहीं होंगे[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तीन वर्षों में।” मज़दूर के वर्षों की उपमा एक ठीक-ठीक निश्चित अवधि का संकेत देती है, जिसे बढ़ाया नहीं जाएगा।
    reason: בְּשָׁלֹשׁ שָׁנִים और כִּשְׁנֵי שָׂכִיר के समय-संबंधी और उपमात्मक बल को स्पष्ट करना।
  - marker: b
    text: या “मोआब के गौरव का अपमान होगा।” “जनसमूह” के लिए प्रयुक्त शब्द प्रचुरता, धन-संपदा, या वैभव का भाव भी रख सकता है।
    reason: נִקְלָה और הָמוֹן के वैकल्पिक अर्थों को सुरक्षित रखना।
  - marker: c
    text: या “महान नहीं होंगे” अथवा “शक्तिशाली नहीं होंगे।”
    reason: כַּבִּיר की महानता और शक्ति से जुड़ी अर्थ-सीमा को दिखाना।
lexical_decisions:
- source_word: וְעַתָּה
  choice: पर अब
  rationale: यह पद पिछले कथन से वर्तमान और निर्णायक दिव्य घोषणा की ओर मुड़ता है; ‘पर अब’ इस संक्रमण और हल्के विरोध दोनों को व्यक्त करता है।
- source_word: דִּבֶּר יְהוָה
  choice: यहोवा ने कहा है
  rationale: पूर्ण क्रिया एक हो चुकी, किंतु अब भी प्रभावी और अधिकारपूर्ण भविष्यवाणी की घोषणा दर्शाती है। יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בְּשָׁלֹשׁ שָׁנִים כִּשְׁנֵי שָׂכִיר
  choice: तीन वर्षों में—मज़दूर के गिने हुए वर्षों के समान
  rationale: मूल उपमा ऐसे मज़दूर की नियत सेवा-अवधि की ओर संकेत करती है जिसका समय ठीक-ठीक गिना जाता है। हिंदी में ‘गिने हुए’ इस निश्चितता को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: וְנִקְלָה כְּבוֹד מוֹאָב
  choice: मोआब का गौरव … तुच्छ हो जाएगा
  rationale: קלה का निफ़अल रूप मान-सम्मान घटने, अपमानित होने या तुच्छ ठहरने का भाव देता है। ‘गौरव … तुच्छ हो जाएगा’ मूल के जानबूझकर रखे गए विरोध को बनाए रखता है।
- source_word: בְּכֹל הֶהָמוֹן הָרָב
  choice: उसके सारे विशाल जनसमूह समेत
  rationale: הָמוֹן भीड़, बहुसंख्या या प्रचुरता को सूचित कर सकता है। प्रसंग में मोआब की बड़ी जनसंख्या मुख्य अर्थ है, जबकि टिप्पणी में व्यापक अर्थ सुरक्षित रखा गया है।
- source_word: וּשְׁאָר מְעַט מִזְעָר
  choice: जो शेष रहेंगे, वे गिनती में बहुत थोड़े होंगे
  rationale: שְׁאָר को अमूर्त धार्मिक पारिभाषिक शब्द बनाने के बजाय बचे हुए लोगों के रूप में स्वाभाविक हिंदी में व्यक्त किया गया है। מְעַט מִזְעָר की तीव्रता ‘बहुत थोड़े’ में आती है।
- source_word: לֹא כַבִּיר
  choice: सामर्थ्यवान नहीं होंगे
  rationale: כַבִּיר महान, प्रबल या सामर्थ्यवान होने का अर्थ दे सकता है। राष्ट्रीय पराजय के संदर्भ में ‘सामर्थ्यवान नहीं’ उपयुक्त है, और अन्य संभव अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम सीधे आया है। हिंदी पाठकों के लिए प्रचलित और पहचाना जाने वाला रूप ‘यहोवा’ रखा गया है, न कि उसे उपाधि ‘प्रभु’ से बदलकर छिपाया गया है।
- issue: שְׁאָר में ‘शेष’ की धारणा
  choice: जो शेष रहेंगे
  alternative: बचा हुआ दल
  rationale: यहाँ मुख्य बल न्याय के बाद बचने वालों की अत्यल्प संख्या और निर्बलता पर है। यह अनुवाद किसी आशावादी ‘शेष जन’ संबंधी धर्मवैज्ञानिक अर्थ को अनावश्यक रूप से नहीं जोड़ता।
- issue: मोआब के गौरव का तुच्छ होना
  choice: गौरव … तुच्छ हो जाएगा
  alternative: गौरव का अपमान होगा
  rationale: मूल में गौरव और हीनता के बीच तनाव है। उसे स्पष्ट रखा गया है, पर यह तय नहीं किया गया कि बात केवल प्रतिष्ठा की है या समग्र राष्ट्रीय वैभव की।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सुबोध रखी गई है। वाक्य की भविष्यवाणी-संबंधी गंभीरता बनाए रखने के लिए सीधी उद्धरण-रचना अपनाई गई है। ‘गिने हुए वर्षों’ से नियत अवधि का भाव आता है, जबकि पादटिप्पणियाँ वास्तविक शब्दार्थगत अस्पष्टताओं को बिना हल किए प्रस्तुत करती हैं।
