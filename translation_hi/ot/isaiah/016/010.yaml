source:
  edition: WLC
  text: וְ/נֶאֱסַ֨ף שִׂמְחָ֤ה וָ/גִיל֙ מִן הַ/כַּרְמֶ֔ל וּ/בַ/כְּרָמִ֥ים לֹֽא יְרֻנָּ֖ן לֹ֣א יְרֹעָ֑ע יַ֗יִן בַּ/יְקָבִ֛ים לֹֽא יִדְרֹ֥ךְ הַ/דֹּרֵ֖ךְ הֵידָ֥ד הִשְׁבַּֽתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/010.yaml
  text: Joy and gladness are taken away from the fruitful field[a], and in the vineyards no one sings for joy, no one shouts; no treader treads out wine in the presses[b]; I have put an end to the vintage shout.
translation:
  language: hi
  text: उपजाऊ भूमि से आनन्द और उल्लास हटा दिए गए हैं,[a] और दाख की बारियों में न कोई आनन्द का गीत गाता है, न जयजयकार करता है। दाखरस निकालने के कुण्डों में कोई अंगूर रौंदनेवाला अंगूर नहीं रौंदता; दाख की कटनी की पुकार[b] मैंने बन्द करवा दी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कर्मेल से’; इब्रानी शब्द को ‘उपजाऊ भूमि’ के बजाय स्थाननाम भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में अंगूर की कटनी या उन्हें रौंदते समय लगाई जानेवाली ऊँची पुकार।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱסַף
  choice: छिन गए हैं
  rationale: निफ़अल रूप यहाँ शाब्दिक ‘इकट्ठा किए गए’ के बजाय आनन्द और उल्लास के हटा लिए जाने को व्यक्त करता है; ‘छिन गए हैं’ विनाश और अभाव के प्रसंग में स्वाभाविक है।
- source_word: שִׂמְחָה וָגִיל
  choice: आनन्द और उल्लास
  rationale: निकटार्थी काव्यात्मक युग्म को दो अलग किन्तु सम्बद्ध हिन्दी शब्दों से सुरक्षित रखा गया है।
- source_word: כַּרְמֶל
  choice: फलवन्त खेत
  rationale: दाख की बारियों और दाखरस के कुण्डों के कृषि-सन्दर्भ में जातिवाचक अर्थ ‘उपजाऊ/फलवन्त भूमि’ स्थाननाम कर्मेल से अधिक उपयुक्त है।
- source_word: יְרֻנָּן לֹא יְרֹעָע
  choice: न कोई आनन्द का गीत गाता है, न जयजयकार करता है
  rationale: दोनों समानान्तर क्रियाओं—हर्षपूर्ण गायन और ऊँची उत्सवी पुकार—का भेद पठनीय आधुनिक हिन्दी में रखा गया है।
- source_word: יְקָבִים
  choice: दाखरस के कुण्डों
  rationale: यह शब्द अंगूर रौंदने और रस एकत्र करने के कुण्डों/हौदों को दर्शाता है; ‘दाखरस के कुण्ड’ प्रसंग को स्पष्ट करता है।
- source_word: יִדְרֹךְ הַדֹּרֵךְ
  choice: कोई अंगूर रौंदनेवाला अंगूर नहीं रौंदता
  rationale: क्रिया और कृदन्त की मूल पुनरुक्ति को हिन्दी में यथासम्भव बनाए रखा गया है और कर्म ‘अंगूर’ सन्दर्भ से स्पष्ट किया गया है।
- source_word: הֵידָד
  choice: कटनी की वह पुकार
  rationale: यह अंगूर की कटनी अथवा रौंदाई के समय की सामूहिक ऊँची पुकार है; केवल आनन्द का भाव जोड़ने के बजाय कृषि-सन्दर्भ सुरक्षित रखा गया है।
- source_word: הִשְׁבַּתִּי
  choice: मैंने बन्द कर दी है
  rationale: हिफ़ईल का कारक अर्थ—किसी चीज़ को रुकवा देना—स्वाभाविक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: पद के अन्त में प्रथम पुरुष वक्ता की पहचान
  choice: ‘मैंने बन्द कर दी है’ रखकर वक्ता का नाम नहीं जोड़ा गया
  alternative: ‘मैं, यहोवा, ने बन्द कर दी है’
  rationale: इब्रानी पाठ में प्रथम पुरुष एकवचन स्पष्ट है, पर इस पद में नाम दोहराया नहीं गया। व्यापक प्रसंग से दिव्य वक्ता पहचाना जाता है; मुख्य पाठ में नाम जोड़ना मूल से आगे जाता।
- issue: כַּרְמֶל जातिवाचक है या स्थाननाम
  choice: जातिवाचक ‘फलवन्त खेत’
  alternative: ‘कर्मेल’
  rationale: तत्कालीन काव्यात्मक समानान्तरता—दाख की बारियाँ, अंगूर और दाखरस के कुण्ड—उपजाऊ भूमि के अर्थ का समर्थन करती है, फिर भी स्थाननाम की सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। कृषि-चित्रण के लिए ‘दाख की बारियाँ’, ‘दाखरस के कुण्ड’ और ‘अंगूर रौंदना’ प्रयोग किए गए हैं। काव्यात्मक समानान्तरता और अन्तिम प्रथम-पुरुष कथन को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
