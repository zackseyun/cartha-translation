source:
  edition: WLC
  text: יָג֤וּרוּ בָ/ךְ֙ נִדָּחַ֔/י מוֹאָ֛ב הֱוִי סֵ֥תֶר לָ֖/מוֹ מִ/פְּנֵ֣י שׁוֹדֵ֑ד כִּֽי אָפֵ֤ס הַ/מֵּץ֙ כָּ֣לָה שֹׁ֔ד תַּ֥מּוּ רֹמֵ֖ס מִן הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/004.yaml
  text: Let the outcasts of Moab stay with you; be a shelter for them from the destroyer. For the oppressor has come to an end[a], destruction has ceased, those who trample have vanished from the land.
translation:
  language: hi
  text: मोआब के निकाले हुए लोग तेरे यहाँ रहें; विनाश करनेवाले से उनके लिए शरण बन। क्योंकि अत्याचारी का अन्त हो गया है,[a] विनाश थम गया है, और रौंदनेवाले देश से मिट गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक अन्य प्रचलित पाठ-विन्यास: “मेरे निकाले हुए लोग तेरे यहाँ रहें, हे मोआब; विनाश करनेवाले से उसके लिए शरण बन।” यह आरम्भिक शब्दों के भिन्न स्वरांकन या विभाजन पर आधारित है।'
    reason: alternative_reading
lexical_decisions:
- source_word: יָגוּרוּ בָךְ
  choice: तेरे यहाँ रहने पाएँ
  rationale: גור अस्थायी या आश्रित निवासी के रूप में रहने का भाव देता है। यह अभिव्यक्ति संरक्षण के लिए ठहरने का अर्थ स्वाभाविक आधुनिक हिन्दी में रखती है।
- source_word: נִדָּחַי מוֹאָב
  choice: मोआब के निकाले हुए लोग
  rationale: נדח उन लोगों को दर्शाता है जिन्हें खदेड़ दिया गया, निर्वासित किया गया या तितर-बितर कर दिया गया हो। ‘निकाले हुए लोग’ उसके निष्क्रिय भाव को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: הֱוִי סֵתֶר
  choice: उन्हें शरण दे
  rationale: संज्ञा סתר छिपने या सुरक्षा पाने के स्थान को दर्शाती है। हिन्दी में ‘शरण दे’ संबोधित व्यक्ति से माँगी गई सुरक्षात्मक भूमिका को स्वाभाविक रूप से व्यक्त करता है, यद्यपि रूप की दृष्टि से ‘ओट बन’ अधिक शाब्दिक है।
- source_word: מִפְּנֵי שׁוֹדֵד
  choice: विनाश करनेवाले से
  rationale: שׁודד लूटने और उजाड़ने वाले सक्रिय आक्रमणकारी को दर्शाता है। ‘विनाश करनेवाला’ व्यापक हिंसक खतरे को स्पष्ट रखता है।
- source_word: אָפֵס הַמֵּץ
  choice: अत्याचारी का अन्त हो गया है
  rationale: אפס समाप्त हो जाने या न रहने को व्यक्त करता है; הַמֵּץ कठिन शब्द है, जिसे सन्दर्भ में अत्याचारी या उत्पीड़क समझना समानान्तर हिंसक पदों से मेल खाता है।
- source_word: כָּלָה שֹׁד
  choice: विनाश थम गया है
  rationale: שֹׁד हिंसक उजाड़, तबाही या लूट को दर्शाता है और כלה उसके समाप्त हो जाने की बात कहता है।
- source_word: תַּמּוּ רֹמֵס
  choice: रौंदनेवाले ... मिट गए हैं
  rationale: क्रिया बहुवचन है, जबकि רֹמֵס सामूहिक अर्थ दे सकता है। बहुवचन हिन्दी क्रिया मूल व्याकरणिक संख्या को बनाए रखती है।
- source_word: מִן הָאָרֶץ
  choice: देश से
  rationale: मोआब और क्षेत्रीय संकट के सन्दर्भ में ארץ का स्थानीय अर्थ ‘देश’ अधिक उपयुक्त है।
theological_decisions:
- issue: आरम्भिक निवेदन का सम्बोधन और वाक्य-विन्यास
  choice: स्त्रीलिंग एकवचन सम्बोधित पात्र या स्थान से कहा गया है कि वह मोआब के निकाले हुए लोगों को अपने यहाँ रहने और शरण पाने दे।
  alternative: 'एक अन्य प्रचलित विन्यास है: ‘मेरे निकाले हुए लोग तेरे यहाँ रहें, हे मोआब; विनाश करनेवाले से उनके लिए शरण बन।’'
  rationale: प्रदत्त मसोराई स्वरांकन בָךְ को स्त्रीलिंग एकवचन ‘तेरे यहाँ’ और נִדָּחַי מוֹאָב को ‘मोआब के निकाले हुए लोग’ के रूप में पढ़ने का समर्थन करता है। वैकल्पिक पाठ शब्द-विभाजन या स्वरांकन की दूसरी समझ पर निर्भर है, इसलिए उसे मुख्य पाठ में समतल करने के बजाय पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। एकवचन स्त्रीलिंग सम्बोधन के कारण ‘तेरे यहाँ’ चुना गया है। हिंसा से जुड़े समानान्तर पदों—विनाश करनेवाला, अत्याचारी, विनाश और रौंदनेवाले—का भेद यथासम्भव सुरक्षित रखा गया है।
