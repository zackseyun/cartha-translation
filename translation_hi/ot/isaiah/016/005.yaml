  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הוּכַ֤ן בַּ/חֶ֨סֶד֙ כִּסֵּ֔א וְ/יָשַׁ֥ב עָלָ֛י/ו בֶּ/אֱמֶ֖ת בְּ/אֹ֣הֶל דָּוִ֑ד שֹׁפֵ֛ט וְ/דֹרֵ֥שׁ מִשְׁפָּ֖ט וּ/מְהִ֥ר צֶֽדֶק׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/005.yaml
  text: A throne will be established in steadfast love[a], and one will sit on it in faithfulness in the tent of David[c][b], judging and seeking justice and swift to do righteousness.
translation:
  language: hi
  text: अटल प्रेम के द्वारा[a] एक सिंहासन स्थापित किया जाएगा, और दाऊद के तंबू में उस पर एक जन[b] विश्वासयोग्यता से[c] विराजमान होगा—वह न्याय करेगा, न्याय की खोज करेगा और न्यायसंगत कार्य करने में तत्पर होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अटल प्रेम में।” इब्रानी संबंध स्थापना के साधन या उसके परिवेश—दोनों का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह उस पर विराजमान होगा।” इब्रानी में कर्ता स्पष्ट रूप से नहीं दिया गया है।
    reason: alternative_reading
  - marker: c
    text: या, “सच्चाई से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּכַן
  choice: स्थिर किया जाएगा
  rationale: הוכן, כון का होफ़अल रूप, किसी वस्तु के दृढ़ता से स्थापित किए जाने का भाव देता है। ‘स्थिर किया जाएगा’ इसके कर्मवाच्य और परिणामसूचक अर्थ को बनाए रखता है।
- source_word: בַּחֶסֶד
  choice: अटल प्रेम के द्वारा
  rationale: חֶסֶד दयालु, विश्वसनीय और प्रायः वाचा-संबंधी निष्ठावान प्रेम को व्यक्त करता है। ‘अटल प्रेम’ सामान्य पाठक के लिए स्वाभाविक है; ‘के द्वारा’ सिंहासन की स्थापना के आधार या साधन के रूप में ב को व्यक्त करता है, जबकि वैकल्पिक स्थानवाचक अर्थ पादटिप्पणी में रखा गया है।
- source_word: כִּסֵּא
  choice: एक सिंहासन
  rationale: इब्रानी संज्ञा के साथ निश्चित उपपद नहीं है; इसलिए ‘एक सिंहासन’ औपचारिक रूप से पारदर्शी है।
- source_word: וְיָשַׁב עָלָיו
  choice: उस पर एक जन विराजमान होगा
  rationale: क्रिया पुल्लिंग एकवचन है, पर कर्ता स्पष्ट रूप से व्यक्त नहीं किया गया। ‘एक जन’ इस अनिर्दिष्टता को बनाए रखता है और ‘विराजमान होगा’ राजकीय संदर्भ में स्वाभाविक है।
- source_word: בֶּאֱמֶת
  choice: विश्वासयोग्यता से
  rationale: אֱמֶת का अर्थ सत्य, विश्वसनीयता या विश्वासयोग्यता हो सकता है। राजकीय और न्यायिक संदर्भ में ‘विश्वासयोग्यता से’ भरोसेमंद शासन का भाव देता है; ‘सच्चाई से’ पादटिप्पणी में रखा गया है।
- source_word: בְּאֹהֶל דָּוִד
  choice: दाऊद के तंबू में
  rationale: यह इब्रानी रूपक को सीधे बनाए रखता है और उसे व्याख्यात्मक रूप से ‘दाऊद के घराने’ में नहीं बदलता।
- source_word: שֹׁפֵט
  choice: वह न्याय करेगा
  rationale: कृदंत शासक के निरंतर न्यायिक कार्य का वर्णन करता है। हिंदी में पूर्ण उपवाक्य अधिक स्वाभाविक और स्पष्ट है।
- source_word: וְדֹרֵשׁ מִשְׁפָּט
  choice: न्याय की खोज करेगा
  rationale: דרשׁ यहाँ न्याय को सक्रियता से खोजने, उसका ध्यान रखने या उसे लागू करने का भाव देता है। शब्दगत पुनरावृत्ति इब्रानी काव्य के बलाघात को बनाए रखती है।
- source_word: וּמְהִר צֶדֶק
  choice: धार्मिकता करने में तत्पर होगा
  rationale: संक्षिप्त इब्रानी पदबंध शीघ्रता या तत्परता को धार्मिक आचरण अथवा न्यायपूर्ण कार्य से जोड़ता है। यह हिंदी रूप अर्थ को स्वाभाविक ढंग से व्यक्त करता है, बिना उसे केवल अमूर्त गुण बना देने के।
theological_decisions:
- issue: दाऊदी शासक की पहचान
  choice: पद को एक आदर्श दाऊदी शासक का भविष्यसूचक वर्णन रहने दिया गया है; अनुवाद में उस व्यक्ति को स्पष्ट रूप से मसीह नहीं कहा गया।
  alternative: इसे किसी ऐतिहासिक दाऊदी राजा या प्रत्यक्ष रूप से मसीह के विषय में कहना।
  rationale: इब्रानी पाठ दाऊद के तंबू और सिंहासन पर बैठनेवाले शासक का वर्णन करता है, पर उसकी स्पष्ट पहचान नहीं बताता। अनुवाद इस संयम और संभावित मसीही पूर्ति दोनों के लिए स्थान रखता है।
- issue: अव्यक्त कर्ता
  choice: ‘एक जन’ द्वारा कर्ता को अनिर्दिष्ट रखा गया है।
  alternative: ‘वह’ कहकर पिछले संदर्भ के किसी निश्चित पुरुष को स्पष्ट कर्ता मानना।
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन है, पर संज्ञात्मक कर्ता अनुपस्थित है। किसी निश्चित पहचान को अनुवाद में आरोपित न करना मूल की अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘तंबू’ जैसे मूल रूपक और ‘न्याय’ की काव्यात्मक पुनरावृत्ति सुरक्षित हैं; वाक्य को सहज बनाने के लिए कृदंतों को हिंदी के समानांतर क्रियात्मक उपवाक्यों में व्यक्त किया गया है।
