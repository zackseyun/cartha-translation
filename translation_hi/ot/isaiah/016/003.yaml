base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/003.yaml
  text: Bring counsel[a]; make a decision. Make your shadow like the night in the middle of noon; hide the outcasts[c][b]; do not betray the fugitive.
translation:
  language: hi
  text: सलाह दो; फैसला करो[a]। भरी दोपहर में अपनी छाया[b] को रात के समान कर दो; भगाए गए लोगों को छिपाओ; भागे हुए व्यक्ति को प्रकट न करो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्णय करो,” “न्याय करो,” “न्यायपूर्ण फैसला दो,” अथवा “मध्यस्थता करो।” इब्रानी शब्द में न्यायिक निर्णय का भाव है।
    reason: lexical_alternative
  - marker: b
    text: “छाया” का अर्थ यहाँ धूप से बचानेवाली “छाँह” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “उजागर न करो” या “उसका पता न खोलो”; संदर्भ में इसका भाव उसे पकड़वाने के लिए धोखा न देने का भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הביאו עֵצָה
  choice: सलाह दो
  rationale: बहुवचन आज्ञार्थक वाक्यांश का स्वाभाविक हिन्दी रूप; ‘सलाह प्रस्तुत करो’ की अपेक्षा अधिक सहज, पर राजनीतिक परामर्श का भाव बनाए रखता है।
- source_word: עֲשׂוּ פְלִילָה
  choice: न्याय करो
  rationale: פְלִילָה के न्यायिक अर्थ को संक्षेप और स्पष्ट रूप में व्यक्त करता है; ‘निर्णय करो’ और ‘मध्यस्थता करो’ वैध विकल्प हैं, इसलिए उन्हें पादटिप्पणी में रखा गया है।
- source_word: שִׁיתִי כַלַּיִל צִלֵּךְ
  choice: अपनी छाया को रात के समान कर दो
  rationale: रात जैसी गहरी ओट की उपमा को सीधे बनाए रखता है। हिन्दी में संबोधित स्त्रीलिंग एकवचन का रूप इस आज्ञार्थक रचना में अलग से दिखाई नहीं देता।
- source_word: בְּתוֹךְ צָהֳרָיִם
  choice: भरी दोपहर में
  rationale: शाब्दिक ‘दोपहर के बीच में’ का स्वाभाविक आधुनिक हिन्दी समतुल्य; पूर्ण उजाले और रात जैसी ओट के विरोध को उभारता है।
- source_word: סַתְּרִי נִדָּחִים
  choice: भगाए गए लोगों को छिपाओ
  rationale: נִדָּחִים उन लोगों को दर्शाता है जिन्हें खदेड़ा या निकाल दिया गया है; यह रूप केवल सामाजिक बहिष्कार का अर्थ लेने से बचता है।
- source_word: נֹדֵד
  choice: भागे हुए व्यक्ति
  rationale: संदर्भ में यह भाग रहे या शरण खोज रहे व्यक्ति को सूचित करता है; ‘भटकनेवाला’ भी संभव है, पर यहाँ पलायन का भाव अधिक उपयुक्त है।
- source_word: אַל תְּגַלִּי
  choice: प्रकट न करो
  rationale: גלה के मूल अर्थ ‘खोलना/प्रकट करना’ के निकट है और शरण लेनेवाले को उसके खोजियों के सामने उजागर न करने का संदर्भगत भाव भी ग्रहण कर सकता है।
