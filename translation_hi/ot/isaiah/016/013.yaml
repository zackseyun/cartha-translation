  text: This is the word that Yahweh spoke concerning Moab in time past[a].
translation:
  language: hi
  text: यह वह वचन है जो याहवे ने मोआब के विषय में पूर्वकाल में कहा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह वह संदेश है जो याहवे ने मोआब के विषय में पहले कहा था।”
    reason: דָּבָר के लिए ‘वचन’ या ‘संदेश’ और מֵאָז के लिए ‘पूर्वकाल में’ या ‘पहले’—दोनों अर्थगत रूप से संभव हैं।
lexical_decisions:
- source_word: זֶה הַדָּבָר
  choice: यह वह वचन है
  rationale: यह पद पहले दिए गए भविष्यसूचक कथन की ओर संकेत करता है। ‘वचन’ דָּבָר के औपचारिक भविष्यसूचक प्रयोग को बनाए रखता है, जबकि ‘यह वह…है’ हिन्दी में उसके संकेतात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: דִּבֶּר
  choice: कहा था
  rationale: भूतकाल में दिए गए वचन के लिए हिन्दी में ‘कहा था’ स्वाभाविक है और ‘बोला था’ की अपेक्षा इस वाक्य-संरचना में अधिक सहज है; इसमें मूल से अतिरिक्त घोषणा-बल नहीं जोड़ा गया।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֶל־מוֹאָב
  choice: मोआब के विषय में
  rationale: यहाँ אֶל भविष्यवाणी के विषय या संदर्भ को सूचित करता है। ‘के विषय में’ न तो अनावश्यक शत्रुता जोड़ता है और न इसे सीधे संबोधन के रूप में सीमित करता है।
- source_word: מֵאָז
  choice: पहले
  rationale: यह शब्द वर्तमान कथन की तुलना में पूर्व समय को दर्शाता है। ‘पहले’ संक्षिप्त और स्वाभाविक हिन्दी है तथा मूल में स्पष्ट न की गई लंबी समयावधि नहीं जोड़ता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; इसलिए उसे सामान्य उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: मोआब के साथ אֶל का आशय
  choice: मोआब के विषय में
  alternative: मोआब से / मोआब के विरुद्ध
  rationale: यह पद मोआब-संबंधी भविष्यवाणी का सार प्रस्तुत करता है। चुना गया रूप संदर्भसूचक अर्थ बनाए रखता है और प्रत्यक्ष संबोधन या विरोध का ऐसा बल नहीं जोड़ता जो पूर्वसर्ग में अनिवार्य नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और भविष्यसूचक प्रसंग के अनुरूप शैली। ‘वचन’ पारंपरिक धार्मिक मुहावरे को बनाए रखता है, पर पूरा वाक्य सामान्य पाठक के लिए सहज रखा गया है।
