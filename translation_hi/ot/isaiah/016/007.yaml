  text: לָ/כֵ֗ן יְיֵלִ֥יל מוֹאָ֛ב לְ/מוֹאָ֖ב כֻּלֹּ֣/ה יְיֵלִ֑יל לַ/אֲשִׁישֵׁ֧י קִיר חֲרֶ֛שֶׂת תֶּהְגּ֖וּ אַךְ נְכָאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/007.yaml
  text: Therefore Moab will wail for Moab; all of it will wail. You will moan[a] for the raisin-cakes of Kir-hareseth, utterly stricken.
translation:
  language: hi
  text: इसलिए मोआब अपने ही लिए विलाप करेगा; पूरा मोआब विलाप करेगा। तुम कीर-हरेसेत की किशमिश की टिकियों के लिए कराहोगे[a], पूरी तरह टूटे हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “कीर-हरेसेत की नींवों के लिए”; इब्रानी אֲשִׁישֵׁי कठिन है, पर मसोरेटिक पाठ का सबसे स्वाभाविक अर्थ “किशमिश की टिकियाँ” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह निष्कर्षसूचक अव्यय पिछले न्याय-वचन के परिणाम को प्रस्तुत करता है।
- source_word: יְיֵלִיל
  choice: विलाप करेगा
  rationale: ילל का यह रूप ऊँचे स्वर में शोक करने को व्यक्त करता है; न्याय के प्रसंग में ‘विलाप’ स्वाभाविक और गरिमापूर्ण है।
- source_word: מוֹאָב לְמוֹאָב
  choice: मोआब अपने ही लिए
  rationale: राष्ट्र को व्यक्तिरूप में प्रस्तुत करते हुए यह मोआब के आत्म-विलाप को व्यक्त करता है; ‘अपने ही लिए’ हिन्दी में पुनरुक्ति का आशय स्पष्ट करता है।
- source_word: כֻּלֹּה
  choice: पूरा मोआब
  rationale: यह मोआब की समग्रता का बोध कराता है; स्पष्ट संज्ञा की पुनरावृत्ति हिन्दी में ‘वह पूरा’ से अधिक स्वाभाविक है।
- source_word: לַאֲשִׁישֵׁי
  choice: किशमिश की टिकियों के लिए
  rationale: मसोरेटिक पाठ में אֲשִׁישָׁה का सर्वाधिक स्वाभाविक अर्थ किशमिश या दबाए हुए फलों की टिकिया है, जो खोई हुई समृद्धि की ओर संकेत कर सकता है; कठिन वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: קִיר חֲרֶשֶׂת
  choice: कीर-हरेसेत
  rationale: यह मोआब के एक नगर का स्थान-नाम है, इसलिए इसका लिप्यंतरण किया गया है।
- source_word: תֶּהְגּוּ
  choice: तुम ... कराहोगे
  rationale: הגה यहाँ धीमी, सुनाई देने वाली शोक-ध्वनि को व्यक्त करता है; द्वितीय पुरुष बहुवचन को बनाए रखते हुए ‘कराहोगे’ उपयुक्त है।
- source_word: אַךְ נְכָאִים
  choice: पूरी तरह टूटे हुए
  rationale: אַךְ यहाँ तीव्रता देता है और נְכָאִים विपत्ति से पीटे, कुचले या टूटे होने का भाव रखता है; यह पदबंध हिन्दी में उस दशा को सहज रूप से व्यक्त करता है।
