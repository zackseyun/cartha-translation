source:
  edition: WLC
  text: עַל כֵּ֡ן אֶבְכֶּ֞ה בִּ/בְכִ֤י יַעְזֵר֙ גֶּ֣פֶן שִׂבְמָ֔ה אֲרַיָּ֨וֶ/ךְ֙ דִּמְעָתִ֔/י חֶשְׁבּ֖וֹן וְ/אֶלְעָלֵ֑ה כִּ֧י עַל קֵיצֵ֛/ךְ וְ/עַל קְצִירֵ֖/ךְ הֵידָ֥ד נָפָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/009.yaml
  text: Therefore I weep with the weeping of Jazer for the vine of Sibmah[a]; I drench you with my tears, Heshbon and Elealeh[b], because over your summer fruit and over your harvest the battle shout has fallen.
translation:
  language: hi
  text: इसलिए मैं याज़ेर के रोने के साथ सिबमा की अंगूर की बेल के लिए रोऊँगा; हे हेशबोन और एलाले, मैं तुम्हें अपने आँसुओं से भिगो दूँगा[a], क्योंकि तुम्हारे गर्मी के फलों और तुम्हारी फसल पर घोष आ पड़ा है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुम्हें अपने आँसुओं से सराबोर कर दूँगा।” क्रिया पूरी तरह भिगो देने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: “घोष आ पड़ा है” से आशय फसल पर टूट पड़ने वाला आक्रमणकारियों का युद्धघोष हो सकता है; अथवा भाव यह हो सकता है कि फसल का हर्षपूर्ण घोष समाप्त हो गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֶבְכֶּה
  choice: मैं ... रोऊँगा
  rationale: कल अपूर्ण 1 एकवचन भविष्य अथवा भावात्मक अर्थ दे सकता है; विलाप के इस संदर्भ में हिन्दी का भविष्यकाल निरंतर/संकल्पित शोक को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בִּבְכִי יַעְזֵר
  choice: याज़ेर के रोने के साथ
  rationale: בְּ को सहचारी अर्थ में रखते हुए इब्रानी संरचना और याज़ेर के शोक के साथ वक्ता की सहभागिता सुरक्षित रहती है।
- source_word: גֶּפֶן שִׂבְמָה
  choice: सिबमा की दाखलता
  rationale: גֶּפֶן एकवचन 'दाखलता' है, यद्यपि काव्य में सामूहिक अर्थ हो सकता है; मूर्त कृषि-बिंब को बनाए रखा गया है।
- source_word: אֲרַיָּוֶךְ דִּמְעָתִי
  choice: मैं तुम्हें अपने आँसुओं से भिगो दूँगा
  rationale: पिएल रूप का अर्थ सराबोर/तृप्त करना है; आँसुओं के संदर्भ में 'भिगो दूँगा' स्पष्ट, सजीव और स्वाभाविक हिन्दी है।
- source_word: קֵיצֵךְ
  choice: तुम्हारे गरमी के फलों
  rationale: קֵיץ यहाँ गरमी में पकने या बटोरे जाने वाले फल/उत्पाद को दर्शाता है; 'गरमी के फल' सामान्य पाठक के लिए पारदर्शी है।
- source_word: קְצִירֵךְ
  choice: तुम्हारी फसल
  rationale: कृषि-संबंधी मानक अर्थ 'फसल/कटनी' है; यहाँ 'फसल' अधिक स्वाभाविक है।
- source_word: הֵידָד
  choice: जयघोष
  rationale: शब्द ऊँचे सामूहिक घोष को दर्शाता है, जो फसल या युद्ध दोनों संदर्भों में हो सकता है। 'जयघोष' उसकी ध्वनि और संभावित द्व्यर्थता को 'युद्धघोष' की अपेक्षा अधिक सुरक्षित रखता है।
- source_word: נָפָל
  choice: आ पड़ा है
  rationale: मूल क्रिया का शाब्दिक अर्थ 'गिरना' है; हिन्दी मुहावरे में 'पर आ पड़ा है' किसी विनाशकारी घटना के उतर आने का चित्र बनाए रखता है।
theological_decisions:
- issue: अंतिम पदबंध הֵידָד נָפָל की व्याख्या
  choice: '''जयघोष आ पड़ा है'' के रूप में अपेक्षाकृत शाब्दिक और खुला अनुवाद'
  alternative: '''युद्धघोष टूट पड़ा है'' अथवा ''फसल का हर्षनाद बंद हो गया है'''
  rationale: इब्रानी में घोष आक्रमणकारी युद्धनाद भी हो सकता है और फसल का हर्षनाद भी; मुख्य पाठ किसी एक दृश्य को पूर्णतः निश्चित नहीं करता, इसलिए तनाव को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, काव्यात्मक परंतु सामान्य पाठक के लिए सुबोध। स्थान-नामों को हिन्दी बाइबिलीय परंपरा के निकट लिप्यंतरित किया गया है। संबोधन स्पष्ट करने के लिए 'हे' जोड़ा गया है; मूल में स्त्रीलिंग एकवचन प्रत्यय के बावजूद दो नगरों का संयुक्त संबोधन काव्यात्मक रूप से रखा गया है।
