    reason: alternative_reading
lexical_decisions:
- source_word: מֵעַי
  choice: मेरा अंतरंग
  rationale: इस शब्द का शाब्दिक अर्थ शरीर के भीतरी अंग या अंतड़ियाँ है, पर यहाँ यह गहरी भावनाओं का बिंब है। ‘मेरा अंतरंग’ उस आंतरिक वेदना को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: לְמוֹאָב
  choice: मोआब के लिए
  rationale: यहाँ ל उस जनसमुदाय को दर्शाता है जिसके लिए विलाप हो रहा है; ‘के लिए’ सहानुभूतिपूर्ण शोक को स्पष्ट रखता है।
- source_word: כַכִּנּוֹר
  choice: वीणा के समान
  rationale: כִּנּוֹר एक तार वाला वाद्य था। ‘वीणा’ आधुनिक हिन्दी पाठक के लिए परिचित है और उपमा की गूँज तथा करुण ध्वनि को व्यक्त करती है।
- source_word: יֶהֱמוּ
  choice: कराहता है
  rationale: המה गहरी गूँज, हलचल या कराह की ध्वनि बता सकता है। विलाप के इस प्रसंग में ‘कराहता है’ भाव और ध्वनि दोनों को संप्रेषित करता है।
- source_word: וְקִרְבִּי
  choice: और मेरा अंतर्मन
  rationale: קֶרֶב यहाँ व्यक्ति के भीतरी अस्तित्व को दर्शाता है और מֵעַי के समानांतर है। ‘अंतर्मन’ अनावश्यक शारीरिक कठोरता के बिना इस भीतरी शोक को व्यक्त करता है।
- source_word: לְקִיר חָרֶשׂ
  choice: कीर-हेरेस के लिए
  rationale: यह मोआब के एक नगर का नाम है। नाम को लिप्यंतरित करना उसके स्थाननाम होने को स्पष्ट रखता है।
