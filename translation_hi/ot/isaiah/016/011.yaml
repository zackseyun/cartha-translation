  text: इसलिए मोआब के लिए मेरे भीतर के अंग वीणा[a] की तरह कराहते हैं, और कीर-हेरेस[b] के लिए मेरा अंतर्मन कराहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तार वाले वाद्य की तरह’; इब्रानी किन्नोर एक तार वाला वाद्य था।
    reason: lexical_alternative
