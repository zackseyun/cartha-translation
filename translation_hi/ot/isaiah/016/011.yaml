review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the lament directed toward Moab and Kir-heres and retains the kinnor simile. However, מֵעַי is morphologically plural (‘my inward parts’), while the Hindi singular noun and singular verb reduce that imagery. The second parallel clause has no expressed verb in Hebrew, but Hindi needs a supplied verb for a complete, natural sentence.
  naturalness: ‘मेरा अंतरंग’ is not idiomatic here as the subject of ‘कराहता है’; it more commonly functions adjectivally or denotes intimacy. ‘मेरे भीतर के अंग’ is a clear, suitably concrete rendering of the Hebrew bodily image, while ‘अंतर्मन’ works naturally in the second colon.
  terminology: ‘वीणा’ is an acceptable conventional rendering of כִּנּוֹר, with the lexical note preserving the broader sense of a stringed instrument. The transliterated place name ‘कीर-हेरेस’ and its traditional alternative are appropriate.
  issues:
  - severity: medium
    issue: The first clause renders plural מֵעַי with singular ‘मेरा अंतरंग ... कराहता है।’
    rationale: The Hebrew explicitly uses the plural ‘my inward parts’ and a plural verb. Revising to ‘मेरे भीतर के अंग ... कराहते हैं’ better preserves both the concrete image and grammatical number.
  - severity: low
    issue: The second Hindi clause lacks an explicit predicate.
    rationale: Hebrew poetry can omit the repeated verb, but supplying ‘कराहता है’ makes the Hindi sentence complete and preserves the parallel lament.
