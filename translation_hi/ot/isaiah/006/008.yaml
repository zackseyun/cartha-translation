source:
  edition: WLC
  text: וָ/אֶשְׁמַ֞ע אֶת ק֤וֹל אֲדֹנָ/י֙ אֹמֵ֔ר אֶת מִ֥י אֶשְׁלַ֖ח וּ/מִ֣י יֵֽלֶךְ לָ֑/נוּ וָ/אֹמַ֖ר הִנְ/נִ֥י שְׁלָחֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/008.yaml
  text: Then I heard the voice of the Lord saying[a], “Whom shall I send, and who will go for us?” And I said, “Here am I[b]. Send me.”
translation:
  language: hi
  text: तब मैंने प्रभु की वाणी सुनी; वे यह कहते हुए बोले, “मैं किसे भेजूँ, और हमारे लिए कौन जाएगा?[a]” तब मैंने कहा, “मैं यहाँ हूँ।[b] मुझे भेजिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘हमारे लिए’ सचमुच बहुवचन है। यह स्वर्गीय सभा के प्रसंग की ओर संकेत कर सकता है; कुछ मसीही पाठक इसमें बाद के त्रिएक प्रकाशन की प्रतिध्वनि भी देखते हैं। यह पद स्वयं इसका संदर्भ निश्चित नहीं करता।
    reason: alternative_reading
  - marker: b
    text: इसे ‘मैं उपस्थित हूँ’ भी कहा जा सकता है। यह इब्रानी मुहावरा तत्परता और उपलब्धता व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: तब मैंने … सुनी
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ उसके क्रमिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קוֹל
  choice: वाणी
  rationale: यह स्पष्ट, अर्थपूर्ण कथन की ध्वनि है; ‘वाणी’ इस बुलाहट के प्रसंग में ‘आवाज़’ से अधिक गरिमापूर्ण और उपयुक्त है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यहाँ यह ईश्वर के लिए प्रयुक्त उपाधि है; ‘प्रभु’ आधुनिक हिन्दी में स्वाभाविक और स्थापित समतुल्य है।
- source_word: אֹמֵר
  choice: वे कह रहे थे
  rationale: कृदन्त का जारी कथन वाला भाव बना रहता है और हिन्दी में वाक्य सहज सुनाई देता है।
- source_word: מִי אֶשְׁלַח
  choice: मैं किसे भेजूँ
  rationale: प्रश्नवाचक सर्वनाम भेजे जाने वाले व्यक्ति का कर्म है; यह हिन्दी में सीधा और सटीक रूप है।
- source_word: וּמִי יֵלֶךְ לָנוּ
  choice: और हमारे लिए कौन जाएगा
  rationale: לָנוּ प्रथम पुरुष बहुवचन है; ‘हमारे लिए’ उस बहुवचन को बिना व्याख्यात्मक रूप से हल किए सुरक्षित रखता है।
- source_word: הִנְנִי
  choice: मैं यहाँ हूँ
  rationale: इब्रानी मुहावरा स्वयं को प्रस्तुत करने, तत्परता और उपलब्धता का भाव व्यक्त करता है; यह रूप आधुनिक हिन्दी में स्वाभाविक है।
- source_word: שְׁלָחֵנִי
  choice: मुझे भेजिए
  rationale: आज्ञार्थक रूप और प्रथम पुरुष एकवचन प्रत्यय को एक प्रत्यक्ष, स्वेच्छापूर्ण निवेदन के रूप में व्यक्त किया गया है; आदरसूचक क्रिया संबोधन के प्रसंग के अनुरूप है।
theological_decisions:
- issue: ईश्वरीय कथन में प्रथम पुरुष बहुवचन—‘हमारे लिए’
  choice: मुख्य पाठ में बहुवचन ‘हमारे लिए’ को बनाए रखा गया और उसका संदर्भ निश्चित नहीं किया गया।
  alternative: इसे स्वर्गीय सभा, गरिमासूचक अथवा विचार-विमर्शात्मक बहुवचन, या बाद के त्रिएक प्रकाशन की मसीही प्रामाणिक प्रतिध्वनि के रूप में समझना।
  rationale: इब्रानी में प्रथम पुरुष बहुवचन स्पष्ट है, पर उसका संदर्भ पाठ स्वयं निर्दिष्ट नहीं करता। अनुवाद इस वास्तविक अस्पष्टता और धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सरल किंतु गरिमापूर्ण रखी गई है। ‘वाणी’ और आदरसूचक ‘भेजिए’ भविष्यद्वक्ता की बुलाहट के गंभीर प्रसंग के अनुरूप हैं; बहुवचन को बिना सांप्रदायिक निष्कर्ष थोपे सुरक्षित रखा गया है।
