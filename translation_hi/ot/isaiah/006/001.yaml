source:
  edition: WLC
  text: בִּ/שְׁנַת מוֹת֙ הַ/מֶּ֣לֶךְ עֻזִּיָּ֔הוּ וָ/אֶרְאֶ֧ה אֶת אֲדֹנָ֛/י יֹשֵׁ֥ב עַל כִּסֵּ֖א רָ֣ם וְ/נִשָּׂ֑א וְ/שׁוּלָ֖י/ו מְלֵאִ֥ים אֶת הַ/הֵיכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/001.yaml
  text: In the year of King Uzziah’s death[a], I saw the Lord seated on a throne, high and lifted up[b], and the hem of his robe filled the temple.
translation:
  language: hi
  text: राजा उजिय्याह की मृत्यु के वर्ष में, मैंने प्रभु को ऊँचे और ऊपर उठे हुए सिंहासन पर बैठे देखा; उनके वस्त्र के किनारे[a] मन्दिर[b] को भर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके वस्त्र की लम्बी झालर।”
    reason: lexical_alternative
  - marker: b
    text: हिब्रू शब्द का अर्थ “राजमहल” भी हो सकता है; इस दर्शन के सन्दर्भ में “मन्दिर” उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת מוֹת הַמֶּלֶךְ עֻזִּיָּהוּ
  choice: जिस वर्ष राजा उजिय्याह की मृत्यु हुई
  rationale: हिब्रू रचना दर्शन का समय बताती है। हिन्दी में उपवाक्य के रूप में यह स्वाभाविक है और ‘मृत्यु’ को घटना के रूप में व्यक्त करती है।
- source_word: וָאֶרְאֶה
  choice: मैंने ... देखा
  rationale: प्रथम पुरुष एकवचन की कथात्मक क्रिया को सरल भूतकाल में रखा गया है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यहाँ परमेश्वर के लिए उपाधि אֲדֹנָי है, יהוה नाम नहीं; इसलिए ‘प्रभु’ सटीक और प्रचलित हिन्दी रूप है।
- source_word: יֹשֵׁב עַל כִּסֵּא
  choice: सिंहासन पर बैठे
  rationale: यह प्रभु की सिंहासनारूढ़ मुद्रा का सीधा और सहज वर्णन है।
- source_word: רָם וְנִשָּׂא
  choice: ऊँचे और ऊपर उठे हुए
  rationale: दोनों हिब्रू विशेषणों की स्थानिक और महिमामय छवि को एक ही अमूर्त शब्द में समेटे बिना सुरक्षित रखा गया है। हिन्दी में ये निकटवर्ती ‘सिंहासन’ को विशेषित करते हैं।
- source_word: שׁוּלָיו
  choice: उनके वस्त्र के छोरों
  rationale: बहुवचन रूप और वस्त्र के निचले अथवा फैलते किनारों की ठोस छवि को स्पष्ट आधुनिक हिन्दी में रखा गया है।
- source_word: מְלֵאִים אֶת הַהֵיכָל
  choice: से मन्दिर भरा हुआ था
  rationale: शाब्दिक ‘मन्दिर को भर रहे थे’ हिन्दी में असहज होता; यह रचना उसी परिणामी दृश्य को स्वाभाविक हिन्दी में व्यक्त करती है।
theological_decisions:
- issue: אֲדֹנָי का दैवी उपाधि के रूप में अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ दैवी उपाधि को व्यक्त करता है, पर मूल में न लिखे हुए יהוה नाम को नहीं जोड़ता।
- issue: הֵיכָל का अर्थ
  choice: मन्दिर
  alternative: राजमहल
  rationale: शब्द दोनों अर्थ दे सकता है। आगामी स्वर्गीय आराधना और पवित्रता के दर्शन के संदर्भ में ‘मन्दिर’ मुख्य अर्थ है, जबकि पाठक के लिए वैकल्पिक राजमहल-अर्थ पादटिप्पणी में सुरक्षित है।
- issue: רָם וְנִשָּׂא किसे विशेषित करता है
  choice: सिंहासन को
  alternative: प्रभु को
  rationale: हिब्रू में यह पदबंध निकटवर्ती ‘सिंहासन’ के साथ स्वाभाविक रूप से जुड़ता है। फिर भी सिंहासन की ऊँचाई उसके ऊपर विराजमान प्रभु की महिमा को प्रकट करती है; अनुवाद इससे आगे कोई अलग धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। परमेश्वर के लिए आदरसूचक बहुवचन ‘उनके’ प्रयुक्त हुआ है। पादटिप्पणी-चिह्न सम्बद्ध शब्दों के बाद रखे गए हैं; दिए गए अंग्रेज़ी परामर्श-पाठ में उनकी अवस्थिति और विषय परस्पर उलटे प्रतीत होते थे।
