  text: וַ/יַּגַּ֣ע עַל פִּ֔/י וַ/יֹּ֕אמֶר הִנֵּ֛ה נָגַ֥ע זֶ֖ה עַל שְׂפָתֶ֑י/ךָ וְ/סָ֣ר עֲוֺנֶ֔/ךָ וְ/חַטָּאתְ/ךָ֖ תְּכֻפָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/007.yaml
  text: And he touched my mouth and said, “Look, this has touched your lips; your guilt is removed, and your sin is atoned for.”
translation:
  language: hi
  text: उसने मेरे मुँह को छुआ और कहा, “देख, यह तेरे होंठों को छू गया है; तेरा दोष दूर हो गया है और तेरे पाप का प्रायश्चित हो गया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגַּע עַל־פִּי
  choice: उसने मेरे मुँह को छुआ
  rationale: स्पर्श के लिए נגע और संबंधसूचक עַל का प्रसंगानुकूल, स्वाभाविक हिन्दी रूप; कर्ता पिछले पद का सराफ है।
- source_word: הִנֵּה
  choice: देख
  rationale: ध्यान आकर्षित करने वाले प्रत्यक्ष संबोधन का सरल और वर्तमान हिन्दी रूप।
- source_word: עֲוֺנֶךָ
  choice: तेरा दोष
  rationale: עָוֹן यहाँ पाप से उत्पन्न दोष अथवा अपराध-दोष को सूचित करता है; अगले पदबंध में חַטָּאת के लिए ‘पाप’ रखने से भेद बना रहता है।
- source_word: וְסָר
  choice: दूर हो गया है
  rationale: סוּר के हट जाने या दूर हो जाने के अर्थ को पूर्ण हुई क्रिया के रूप में व्यक्त करता है।
- source_word: תְּכֻפָּר
  choice: प्रायश्चित हो गया है
  rationale: 'כפר के पुअल रूप का निष्क्रिय अर्थ सुरक्षित है: पाप के लिए प्रायश्चित किया गया है, बिना कर्ता को पाठ से अधिक स्पष्ट किए।'
theological_decisions:
- issue: כפר के निष्क्रिय रूप और प्रायश्चित की अवधारणा
  choice: तेरे पाप का प्रायश्चित हो गया है
  alternative: तेरा पाप क्षमा हो गया है
  rationale: ‘प्रायश्चित’ अनुष्ठानिक-धार्मिक अर्थ और निष्क्रिय वाच्य को बनाए रखता है; केवल ‘क्षमा’ कहना स्रोत की प्रायश्चित-संबंधी अर्थछाया को संकुचित कर देता।
- issue: עָוֹן और חַטָּאת का भेद
  choice: दोष … पाप
  alternative: अधर्म … पाप
  rationale: इस प्रसंग में पहला शब्द हटाए गए अपराध-दोष पर और दूसरा स्वयं पाप पर केंद्रित है; यह चयन दोनों को एक ही शब्द में विलीन नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सरल शैली रखी गई है। एकवचन निकट संबोधन के कारण ‘तेरे’ प्रयुक्त है, जो इब्रानी द्वितीय पुरुष एकवचन प्रत्ययों के अनुरूप है।
