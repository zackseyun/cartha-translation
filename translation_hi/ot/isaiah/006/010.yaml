  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘हृदय’, ‘कान भारी’ और ‘आँखें मूँदना’ जैसे मूल शारीरिक रूपक सुरक्षित हैं। सामूहिक ‘प्रजा’ के साथ एकवचन सर्वनाम हिन्दी में स्वाभाविक होने के कारण मूल इब्रानी की संख्या भी बनी रहती है।
