  text: הַשְׁמֵן֙ לֵב הָ/עָ֣ם הַ/זֶּ֔ה וְ/אָזְנָ֥י/ו הַכְבֵּ֖ד וְ/עֵינָ֣י/ו הָשַׁ֑ע פֶּן יִרְאֶ֨ה בְ/עֵינָ֜י/ו וּ/בְ/אָזְנָ֣י/ו יִשְׁמָ֗ע וּ/לְבָב֥/וֹ יָבִ֛ין וָ/שָׁ֖ב וְ/רָ֥פָא לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/010.yaml
  text: Make the heart of this people dull[a], and make their ears heavy, and blind their eyes, lest they see with their eyes, and hear with their ears, and understand with their heart, and turn back[c][b], and be healed.
translation:
  language: hi
  text: इस प्रजा का हृदय संवेदनहीन कर दे, उसके कान भारी कर दे और उसकी आँखें मूँद दे[a], ऐसा न हो कि वह अपनी आँखों से देखे, अपने कानों से सुने, अपने हृदय से समझे, फिर लौट आए[b] और उसे चंगाई मिले[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी आँखें ढक दे’; इब्रानी क्रिया आँखों को बंद करने या उन्हें देखने में असमर्थ बनाने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मुड़ आए’; यहाँ प्रयुक्त क्रिया सामान्य रूप से लौटने के साथ-साथ इस संदर्भ में पश्चाताप का भाव भी दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: या ‘वह चंगी हो जाए’; इब्रानी अभिव्यक्ति संक्षिप्त है और चंगा करने वाले कर्ता को स्पष्ट नहीं करती।
    reason: textual_ambiguity
lexical_decisions:
- source_word: הַשְׁמֵן
  choice: संवेदनहीन कर दे
  rationale: इस हिफ़ील आज्ञार्थक क्रिया का शाब्दिक अर्थ ‘मोटा कर’ है, पर ‘हृदय’ के साथ यह भीतर से असंवेदनशील या ग्रहण न करने वाला बना देने का मुहावरा है। ‘संवेदनहीन’ आधुनिक हिन्दी में उसका प्रभाव स्पष्ट करता है।
- source_word: לֵב / לְבָבוֹ
  choice: हृदय / अपने हृदय
  rationale: यह शब्द विचार, इच्छा और भीतरी व्यक्ति को समेटता है। ‘हृदय’ मूल बाइबलीय बिंब को बनाए रखता है और इसे केवल ‘मन’ तक सीमित नहीं करता।
- source_word: הָעָם הַזֶּה
  choice: इस प्रजा
  rationale: ‘प्रजा’ सामूहिक एकवचन को स्वाभाविक हिन्दी में व्यक्त करती है और भविष्यवाणी के गरिमापूर्ण कथन के अनुकूल है।
- source_word: הַכְבֵּד
  choice: भारी कर दे
  rationale: ‘कानों’ के साथ मूल क्रिया ग्रहणशीलता घटने का बिंब देती है। ‘भारी’ उस रूपक को सुरक्षित रखता है; ‘कठोर’ कहना स्रोत से अधिक अर्थ जोड़ता।
- source_word: הָשַׁע
  choice: आँखें मूँद दे
  rationale: दुर्लभ क्रिया आँखों को बंद, ढका हुआ या निष्क्रिय बनाने का भाव देती है। ‘मूँद दे’ प्रभाव और संभावित बिंब दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: פֶּן
  choice: ऐसा न हो कि
  rationale: यह निषेधात्मक या निवारक आशय को स्पष्ट रूप से व्यक्त करता है और आज की हिन्दी में ‘कहीं ऐसा न हो कि’ से अधिक संक्षिप्त है।
- source_word: יִרְאֶה ... יִשְׁמָע ... יָבִין
  choice: वह ... देखे ... सुने ... समझे
  rationale: इब्रानी क्रियाएँ सामूहिक एकवचन ‘इस प्रजा’ के अनुरूप एकवचन हैं। हिन्दी में ‘प्रजा’ के लिए ‘वह’ स्वाभाविक है, इसलिए मूल की संख्या भी सुरक्षित रहती है।
- source_word: וָשָׁב
  choice: फिर लौट आए
  rationale: שׁוב का मूल अर्थ मुड़ना या लौटना है। ‘लौट आए’ पश्चाताप की सम्भावित ध्वनि को खुला रखता है, पर उसे व्याख्या के रूप में स्पष्टतः नहीं जोड़ता।
- source_word: וְרָפָא לוֹ
  choice: उसे चंगाई मिले
  rationale: इब्रानी वाक्यांश संक्षिप्त है और स्पष्ट कर्ता नहीं बताता। ‘उसे चंगाई मिले’ परिणाम को स्वाभाविक हिन्दी में व्यक्त करते हुए चंगा करने वाले कर्ता को अनावश्यक रूप से नहीं जोड़ता।
theological_decisions:
- issue: न्यायिक असंवेदनशीलता में परमेश्वर की सक्रिय आज्ञा
  choice: 'आज्ञार्थक रूप सीधे रखे गए हैं: ‘संवेदनहीन कर दे ... भारी कर दे ... मूँद दे।’'
  alternative: 'इन्हें अनुमति या केवल परिणाम के रूप में कहना: ‘हो जाने दे’ अथवा ‘हो जाएगा।’'
  rationale: इब्रानी में नबी को संबोधित तीन स्पष्ट पुल्लिंग एकवचन आज्ञार्थक रूप हैं। उन्हें नरम करने से मूल पाठ का कठोर धर्मवैचारिक तनाव मिट जाता।
- issue: लौटने का अर्थ
  choice: ‘लौट आए’
  alternative: ‘पश्चाताप करे’
  rationale: संदर्भ में पश्चाताप निहित हो सकता है, पर मूल क्रिया व्यापक रूप से लौटने या मुड़ने को भी दर्शाती है। अनुवाद इस अर्थ-सीमा को खुला रखता है।
- issue: चंगाई देने वाला कर्ता
  choice: ‘उसे चंगाई मिले’ कहकर कर्ता को अनिर्दिष्ट रखा गया है।
  alternative: ‘मैं उसे चंगा करूँ’ अथवा ‘वह चंगी हो जाए।’
  rationale: וְרָפָא לוֹ की रचना संक्षिप्त और कुछ हद तक दीर्घवृत्तीय है। अनुवाद परिणाम को व्यक्त करता है, पर ऐसे स्पष्ट प्रथम-पुरुष कर्ता को नहीं जोड़ता जो इस पद में लिखा नहीं है।
