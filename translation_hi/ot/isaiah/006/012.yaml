id: ISA.6.12
reference: Isaiah 6:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/רִחַ֥ק יְהוָ֖ה אֶת הָ/אָדָ֑ם וְ/רַבָּ֥ה הָ/עֲזוּבָ֖ה בְּ/קֶ֥רֶב הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/012.yaml
  text: And Yahweh will remove people far away[b][a], and the forsaken places will be many in the midst of the land.
translation:
  language: hi
  text: और यहोवा लोगों को दूर कर देगा, और देश के बीच बहुत वीरानी होगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देश के बीच छोड़े हुए स्थान बहुत होंगे।” इब्रानी का अर्थ “त्याग बहुत होगा” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְרִחַק
  choice: दूर कर देगा
  rationale: क्रिया यहाँ लोगों को दूर हटा देने या निर्वासित कर देने का परिणाम व्यक्त करती है; भविष्यवाणी के प्रसंग में हिन्दी भविष्यकाल स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है, किसी उपाधि से नहीं बदला गया।
- source_word: הָאָדָם
  choice: लोगों को
  rationale: एकवचन रूप यहाँ सामूहिक अर्थ में देश की मानव-आबादी को दर्शाता है; आधुनिक हिन्दी में ‘लोगों’ से यह अर्थ स्वाभाविक और स्पष्ट रहता है।
- source_word: וְרַבָּה
  choice: बहुत बढ़ जाएगा
  rationale: रבה यहाँ परिमाण या व्यापकता बढ़ने का भाव देता है। यह अनुवाद ‘बहुत होगा’ की अपेक्षा प्राकृतिक हिन्दी है और अमूर्त עֲזוּבָה के साथ ठीक बैठता है।
- source_word: הָעֲזוּבָה
  choice: उजाड़
  rationale: यह रूप छोड़े जाने, वीरानी या उजाड़ की अवस्था को सूचित कर सकता है। ‘उजाड़’ हिन्दी में इस अमूर्त और परिणामी दोनों भावों को संक्षेप में बनाए रखता है।
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: देश के बीच
  rationale: स्थान-सूचक मूल बिंब को निकटता से रखते हुए यह देश के भीतर व्यापक उजाड़ का संकेत देता है।
theological_decisions:
- issue: הָאָדָם का सामूहिक अर्थ
  choice: लोगों को
  alternative: मनुष्य को / मानवजाति को
  rationale: सन्दर्भ न्याय के कारण आबादी को दूर किए जाने का है। ‘लोगों’ से किसी एक पुरुष या केवल पुरुषों का अर्थ नहीं निकलता, जबकि इब्रानी सामूहिक एकवचन का आशय बना रहता है।
- issue: הָעֲזוּבָה की व्याख्या
  choice: उजाड़ बहुत बढ़ जाएगा
  alternative: त्याग बहुत होगा / छोड़े हुए स्थान बहुत होंगे
  rationale: इब्रानी को अमूर्त ‘त्याग/वीरानी’ या उसके ठोस परिणाम ‘उजड़े स्थान’ के रूप में समझा जा सकता है। मुख्य पाठ में स्वाभाविक हिन्दी के लिए ‘उजाड़’ चुना गया और वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और भविष्यवाणी के न्याय-सन्दर्भ के अनुकूल है। वाक्य-रचना मूल की दो समन्वित धाराओं को बनाए रखती है।
