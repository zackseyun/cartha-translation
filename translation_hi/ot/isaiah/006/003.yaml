id: ISA.6.3
reference: Isaiah 6:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/קָרָ֨א זֶ֤ה אֶל זֶה֙ וְ/אָמַ֔ר קָד֧וֹשׁ קָד֛וֹשׁ קָד֖וֹשׁ יְהוָ֣ה צְבָא֑וֹת מְלֹ֥א כָל הָ/אָ֖רֶץ כְּבוֹדֽ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/003.yaml
  text: 'And one called to another and said: “Holy[a], holy, holy is Yahweh of hosts[b]; the whole earth is full of his glory.”'
translation:
  language: hi
  text: 'और एक ने दूसरे को पुकारकर कहा:

    “पवित्र, पवित्र, पवित्र सेनाओं का यहोवा[a][b] है;

    सारी पृथ्वी उसकी महिमा से भरी हुई है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सेनाओं का प्रभु।” इब्रानी उपाधि उन स्वर्गीय और पार्थिव सेनाओं या शक्तियों की ओर संकेत करती है जो उसके अधिकार में हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में YHWH, जिसे परंपरागत रूप से “प्रभु” लिखा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְקָרָא
  choice: पुकारकर
  rationale: קרא के क़ाल रूप का अर्थ यहाँ ऊँचे स्वर से पुकारना है। ‘पुकारकर कहा’ दूसरे की ओर संबोधित उद्घोषणा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: זֶה אֶל זֶה
  choice: एक ने दूसरे को
  rationale: यह पारस्परिक संबोधन का मुहावरा है; यह चयन इब्रानी अर्थ को स्पष्ट और सहज हिन्दी में रखता है।
- source_word: קָדוֹשׁ קָדוֹשׁ קָדוֹשׁ
  choice: पवित्र, पवित्र, पवित्र
  rationale: तीन बार की पुनरावृत्ति को उसके बल, लय और आराधनात्मक प्रभाव सहित ज्यों का त्यों रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम YHWH को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: यह शब्द संगठित सैन्य समूहों या सैन्य दलों को सूचित करता है। ईश्वरीय उपाधि में ‘सेनाओं का’ स्वर्गीय और पार्थिव शक्तियों पर उसके अधिकार की व्यापकता बनाए रखता है।
- source_word: מְלֹא כָל־הָאָרֶץ
  choice: सारी पृथ्वी ... भरी हुई है
  rationale: इब्रानी संज्ञात्मक रचना को स्वाभाविक हिन्दी विधेय-वाक्य में व्यक्त किया गया है, बिना उसके सार्वभौमिक विस्तार को घटाए।
- source_word: כְּבוֹדוֹ
  choice: उसकी महिमा से
  rationale: ‘भरना’ के साथ हिन्दी में ‘महिमा से’ सहज है और प्रत्यय के पुल्लिंग एकवचन संदर्भ को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। इसलिए नाम को रखा गया और पारंपरिक प्रतिस्थापन को पादटिप्पणी में बताया गया है।
- issue: יְהוָה צְבָאוֹת उपाधि का अर्थ
  choice: सेनाओं का यहोवा
  alternative: स्वर्गीय सेनाओं का यहोवा
  rationale: ‘सेनाओं’ मूल शब्द के सैन्य और सामूहिक भाव को सुरक्षित रखता है; ‘स्वर्गीय’ जोड़ने से संदर्भ अनावश्यक रूप से सीमित हो सकता था।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। त्रिगुणित ‘पवित्र’ और दो पंक्तियों की उद्घोषणात्मक लय सुरक्षित है। ‘सेनाओं का यहोवा’ हिन्दी बाइबलीय प्रयोग से परिचित है, जबकि पादटिप्पणियाँ नाम और उपाधि दोनों को सामान्य पाठक के लिए स्पष्ट करती हैं।
