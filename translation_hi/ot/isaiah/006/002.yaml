- source_word: בִּשְׁתַּיִם
  choice: दो पंखों से / दो से
  rationale: करणवाचक ב को हिन्दी के ‘से’ द्वारा व्यक्त किया गया है; पहली बार ‘पंखों’ को स्पष्ट करके बाद में अनावश्यक पुनरावृत्ति से बचा गया है।
- source_word: יְכַסֶּה
  choice: ढकता था
  rationale: वितरक एकवचन और दर्शन में वर्णित नियमित/जारी क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: פָנָיו
  choice: अपना चेहरा
  rationale: कर्ता और संबंधसूचक प्रत्यय एक ही सराफ़ को सूचित करते हैं; हिन्दी का निजवाचक ‘अपना’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: רַגְלָיו
  choice: अपने पैर
  rationale: संदर्भ में רֶגֶל का सामान्य शारीरिक अर्थ ‘पैर’ उपयुक्त है; बहुवचन तथा निजवाचक संबंध सुरक्षित हैं।
- source_word: יְעוֹפֵף
  choice: उड़ता था
  rationale: इब्रानी क्रिया दर्शन में प्रत्येक सराफ़ की क्रिया बताती है; ‘उड़ता था’ पूर्ववर्ती ‘ढकता था’ के साथ काल और पक्ष की संगति रखता है।
theological_decisions:
- issue: שְׂרָפִים का शाब्दिक अर्थ दिया जाए या स्वर्गीय प्राणियों का विशिष्ट नाम
  choice: सराफ़
  alternative: दहकते हुए प्राणी
  rationale: संदर्भ में यह स्वर्गीय प्राणियों का एक विशिष्ट वर्ग है। ध्वन्यात्मक नाम पाठ की विशिष्टता बचाता है, जबकि संभावित व्युत्पत्ति को पादटिप्पणी में रखकर उसे निश्चित अर्थ नहीं बनाया गया।
- issue: לוֹ का संदर्भ
  choice: उसके ऊपर
  alternative: उसके/उस वस्तु के ऊपर
  rationale: निकटवर्ती संदर्भ में सिंहासन पर विराजमान प्रभु केंद्र में हैं; पुल्लिंग एकवचन प्रत्यय का व्यक्तिगत अनुवाद सबसे स्वाभाविक है, पर इसमें अतिरिक्त पहचान या सिद्धांत नहीं जोड़ा गया।
- issue: सराफ़ों के लिए वितरक एकवचन क्रियाएँ
  choice: हर एक ... वह ... ढकता था ... उड़ता था
  alternative: वे ... ढकते थे ... उड़ते थे
  rationale: इब्रानी बहुवचन समूह से प्रत्येक सदस्य पर केंद्रित एकवचन में आता है। हिन्दी में ‘हर एक’ और ‘वह’ इस वितरक बल को स्पष्ट और स्वाभाविक रूप से सुरक्षित रखते हैं।
