  yaml_path: translation/ot/isaiah/006/002.yaml
  text: 'Seraphim were standing above him. Each had six wings: with two he covered his face[a], and with two he covered his feet, and with two he flew.'
translation:
  language: hi
  text: 'सराफ़[a] उसके ऊपर खड़े थे। हर एक के छह-छह पंख थे: दो पंखों से वह अपना चेहरा ढकता था, दो से अपने पाँव ढकता था और दो से उड़ता था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सराफ़’ शब्द संभवतः उस इब्रानी धातु से जुड़ा है जिसका अर्थ ‘जलना’ है; इसलिए इसे ‘दहकते हुए प्राणी’ के रूप में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂרָפִים
  choice: सराफ़
  rationale: इस विशिष्ट स्वर्गीय वर्ग के लिए प्रचलित ध्वन्यात्मक नाम रखा गया है। शब्द की व्युत्पत्ति संभवतः ‘जलना’ धातु से जुड़ी है, पर ‘दहकते हुए’ को सीधे मुख्य पाठ में रखने से अनिश्चित व्युत्पत्तिगत अर्थ को निश्चित मान लेने का जोखिम होता।
- source_word: עֹמְדִים
  choice: खड़े थे
  rationale: इब्रानी कृदंत दर्शन के दृश्य में उनकी जारी अवस्था दर्शाता है; ‘खड़े थे’ स्वाभाविक हिन्दी में इसे व्यक्त करता है।
- source_word: מִמַּעַל לוֹ
  choice: उसके ऊपर
  rationale: यह सिंहासन पर विराजमान प्रभु के सापेक्ष सराफ़ों की स्थिति बताता है और पुल्लिंग एकवचन प्रत्यय को व्यक्तिगत रूप में बनाए रखता है।
- source_word: שֵׁשׁ כְּנָפַיִם ... שֵׁשׁ כְּנָפַיִם לְאֶחָד
