  text: וָ/אֹמַ֞ר אֽוֹי לִ֣/י כִֽי נִדְמֵ֗יתִי כִּ֣י אִ֤ישׁ טְמֵֽא שְׂפָתַ֨יִם֙ אָנֹ֔כִי וּ/בְ/תוֹךְ֙ עַם טְמֵ֣א שְׂפָתַ֔יִם אָנֹכִ֖י יוֹשֵׁ֑ב כִּ֗י אֶת הַ/מֶּ֛לֶךְ יְהוָ֥ה צְבָא֖וֹת רָא֥וּ עֵינָֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/005.yaml
  text: And I said[a], “Woe is me, for I am ruined; for I am a man of unclean lips, and I dwell among a people of unclean lips; for my eyes have seen the King[b], Yahweh of Armies.”
translation:
  language: hi
  text: तब मैंने कहा, “हाय, मैं नाश हो गया हूँ[a], क्योंकि मैं अशुद्ध होंठों वाला मनुष्य हूँ और अशुद्ध होंठों वाले लोगों के बीच रहता हूँ; क्योंकि मेरी आँखों ने राजा, सेनाओं के याहवे[b], को देखा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘मेरा अन्त हो गया है’, ‘मैं मिट गया हूँ’ या संभवतः ‘मैं चुप करा दिया गया हूँ’ भी हो सकता है।
    reason: नִדְמֵיתִי की अर्थ-सीमा और संदर्भगत अनिश्चितता को सुरक्षित रखना।
  - marker: b
    text: 'इब्रानी: ‘सेनाओं के याहवे’; पारंपरिक रूप: ‘सेनाधीश यहोवा’ या ‘सेनाओं के प्रभु’।'
    reason: दिव्य नाम और צְבָאוֹת के परिचित पारंपरिक अनुवादों की जानकारी देना।
lexical_decisions:
- source_word: אֽוֹי לִי
  choice: हाय मुझ पर!
  rationale: यह विलाप और आसन्न दण्ड की तीव्र पुकार है। यह हिन्दी में स्वाभाविक रहते हुए मूल की गंभीरता बनाए रखती है।
- source_word: נִדְמֵיתִי
  choice: मैं नष्ट हो गया हूँ
  rationale: निफ़अल रूप यहाँ परमेश्वर की उपस्थिति में यशायाह के विनाश या अन्त की अनुभूति व्यक्त करता है। मूल शब्द में ‘नष्ट होना’, ‘मिट जाना’ अथवा संभवतः ‘चुप करा दिया जाना’ जैसी अर्थ-छायाएँ हैं; मुख्य पाठ में स्पष्ट और व्यापक विकल्प रखा गया है।
- source_word: אִישׁ טְמֵא שְׂפָתַיִם
  choice: अशुद्ध होंठोंवाला मनुष्य
  rationale: यह यशायाह का अपने विषय में पुल्लिंग एकवचन कथन है। ‘होंठ’ वाणी से जुड़ी अशुद्धता को मूल की ठोस छवि के साथ बनाए रखता है।
- source_word: וּבְתוֹךְ עַם
  choice: लोगों के बीच
  rationale: בְּתוֹךְ का स्थान-संबंधी अर्थ ‘बीच’ से स्वाभाविक रूप में आता है; עַם को यहाँ सामूहिक समुदाय के अर्थ में ‘लोग’ कहा गया है।
- source_word: יוֹשֵׁב
  choice: रहता हूँ
  rationale: ישׁב का कृदन्त यहाँ बैठने के बजाय निरंतर निवास का अर्थ देता है; ‘रहता हूँ’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित पदवी को सीधे ‘राजा’ कहा गया है; देवनागरी में अनावश्यक अंग्रेज़ी-प्रभावित अक्षर-पूँजीकरण संभव नहीं है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: व्यक्तिगत दिव्य नाम יהוה को ‘याहवे’ और צְבָאוֹת को उसके सामान्य अर्थ ‘सेनाओं’ से व्यक्त किया गया है। यह पारंपरिक किंतु आज अस्पष्ट हो सकने वाले ‘सेनाधीश यहोवा’ जैसे रूप की अपेक्षा स्रोत की संरचना और अर्थ को अधिक साफ रखता है।
- source_word: רָאוּ עֵינַי
  choice: मेरी आँखों ने ... देखा है
  rationale: बहुवचन ‘मेरी आँखों ने’ मूल की प्रत्यक्ष-दर्शन वाली अभिव्यक्ति को रखता है; पूर्ण क्रिया का वर्तमान परिणाम हिन्दी के ‘देखा है’ से व्यक्त होता है।
theological_decisions:
- issue: יהוה दिव्य नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे उपस्थित है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है; परिचित वैकल्पिक रूप पादटिप्पणी में दिया गया है।
- issue: יְהוָה צְבָאוֹת पदबंध का अर्थ
  choice: सेनाओं के याहवे
  alternative: सेनाधीश यहोवा / सेनाओं के प्रभु
  rationale: צְבָאוֹת को ‘सेनाओं’ कहना ईश्वरीय सार्वभौमिक और स्वर्गीय सैन्य प्रभुता की छवि बनाए रखता है, बिना यह निश्चित किए कि यहाँ केवल मानवीय या केवल स्वर्गीय सेनाएँ अभिप्रेत हैं।
- issue: כִּי के तीसरे प्रयोग का संबंध
  choice: फिर भी ... देखा है
  alternative: क्योंकि ... देखा है
  rationale: इस खंड में כִּי यशायाह की भयपूर्ण प्रतिक्रिया का आधार बताता है, किंतु हिन्दी में लगातार तीन ‘क्योंकि’ बोझिल और संबंध को धुँधला कर सकते हैं। ‘फिर भी’ अशुद्ध मनुष्य द्वारा राजा को देखने की विस्मयकारी और घातक समझी जाने वाली विडंबना को सामने लाता है, यद्यपि शाब्दिक कारणसूचक रूप वैकल्पिक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के अनुकूल रखी गई है। ‘अशुद्ध होंठ’ जैसी मूल की प्रमुख धार्मिक-काव्यात्मक छवि अक्षुण्ण है। लंबे वाक्य में राजा की पदवी को डैश से अलग किया गया है ताकि दर्शन का केन्द्र स्पष्ट रहे।
