reference: Isaiah 6:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָ/אֹמַ֕ר עַד מָתַ֖י אֲדֹנָ֑/י וַ/יֹּ֡אמֶר עַ֣ד אֲשֶׁר֩ אִם שָׁא֨וּ עָרִ֜ים מֵ/אֵ֣ין יוֹשֵׁ֗ב וּ/בָתִּים֙ מֵ/אֵ֣ין אָדָ֔ם וְ/הָ/אֲדָמָ֖ה תִּשָּׁאֶ֥ה שְׁמָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/011.yaml
  text: Then I said[a], “Until when, Lord?” And he said, “Until cities lie waste, without inhabitant, and houses without man, and the land is laid waste[b], a desolation.”
translation:
  language: hi
  text: तब मैंने कहा, “हे प्रभु, कब तक?” और उसने कहा, “जब तक नगर उजड़ न जाएँ और उनमें कोई निवासी न रहे, और घरों में कोई मनुष्य न रहे, और भूमि उजड़कर वीरान न हो जाए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמַר
  choice: तब मैंने कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक क्रम व्यक्त करता है।
- source_word: עַד מָתַי
  choice: कब तक
  rationale: शाब्दिक अर्थ ‘कब तक’/‘किस समय तक’ है। हिन्दी में ‘कब तक’ स्वाभाविक है और उत्तर में आने वाले ‘जब तक’ से मूल की पुनरुक्ति बनाए रखता है।
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: यह परमेश्वर को संबोधित करने वाली उपाधि है; सम्बोधन में ‘हे प्रभु’ स्वाभाविक और गरिमापूर्ण है।
- source_word: עַד אֲשֶׁר אִם
  choice: जब तक ... न
  rationale: यह विनाश की चरम सीमा बताता है। हिन्दी में ‘जब तक ... न’ इस अर्थ को स्वाभाविक रूप से व्यक्त करता है; אִם को पृथक शर्त के रूप में अनावश्यक रूप से नहीं उभारा गया।
- source_word: שָׁאוּ עָרִים מֵאֵין יוֹשֵׁב
  choice: नगर ऐसे उजाड़ न हो जाएँ कि उनमें कोई निवासी न रहे
  rationale: उजाड़ होने की परिणति और निवासियों के पूर्ण अभाव, दोनों को स्पष्ट रखते हुए हिन्दी वाक्य को स्वाभाविक बनाया गया है।
- source_word: וּבָתִּים מֵאֵין אָדָם
  choice: और घर ऐसे न हो जाएँ कि उनमें कोई मनुष्य न रहे
  rationale: אָדָם यहाँ सामान्य मानव के अर्थ में है। ‘कोई मनुष्य’ स्रोत के अर्थ को बनाए रखता है और आधुनिक हिन्दी में पुरुष-विशेष का भ्रम पैदा नहीं करता।
- source_word: וְהָאֲדָמָה תִּשָּׁאֶה שְׁמָמָה
  choice: और भूमि उजड़कर निर्जन न हो जाए
  rationale: ‘भूमि’ राष्ट्रीय भूभाग के अर्थ में उपयुक्त है। क्रिया और संज्ञा के संचित उजाड़पन को ‘उजड़कर निर्जन’ से संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: אָדָם का सामान्य मानव-वाचक अर्थ
  choice: कोई मनुष्य
  alternative: कोई जन / कोई व्यक्ति
  rationale: संदर्भ में किसी पुरुष-विशेष की नहीं, घरों में किसी भी मनुष्य के न रहने की बात है। ‘मनुष्य’ स्रोत की प्रतिनिधिक मानव-वाचकता और हिन्दी की स्पष्टता दोनों बनाए रखता है।
- issue: विनाश की अवधि और सीमा
  choice: जब तक ... न हो जाएँ
  alternative: यहाँ तक कि ... उजाड़ हो जाएँ
  rationale: उत्तर तत्काल समाप्ति की तारीख नहीं देता, बल्कि न्याय के उस बिंदु तक चलने को बताता है जहाँ नगर, घर और भूमि उजड़ जाते हैं। हिन्दी का यह ढाँचा उस तनाव को बिना अतिरिक्त व्याख्या के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण किंतु सहज है। मूल के ‘कब तक/जब तक’ संबंध को सुरक्षित रखा गया है। विनाश-संबंधी समानार्थी शब्दों की तीव्रता को यांत्रिक पुनरावृत्ति के बजाय ‘उजाड़’ और ‘निर्जन’ से व्यक्त किया गया है।
