id: ISA.6.9
reference: Isaiah 6:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לֵ֥ךְ וְ/אָמַרְתָּ֖ לָ/עָ֣ם הַ/זֶּ֑ה שִׁמְע֤וּ שָׁמ֨וֹעַ֙ וְ/אַל תָּבִ֔ינוּ וּ/רְא֥וּ רָא֖וֹ וְ/אַל תֵּדָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/009.yaml
  text: 'And he said[a], “Go, and say to this people: ‘Keep hearing, but do not understand; keep seeing, but do not perceive.’”'
translation:
  language: hi
  text: 'और उसने कहा[a], “जा और इस प्रजा से कह: ‘सुनते ही रहो, पर समझो मत; देखते ही रहो, पर जानो मत।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे अधिक शब्दशः इस प्रकार भी अनुवाद किया जा सकता है: “सुनो, अवश्य सुनो, पर समझो मत; देखो, अवश्य देखो, पर जानो मत।” इस पंक्ति में भविष्यसूचक बल भी समझा जा सकता है: “तुम निश्चय सुनोगे ... तुम निश्चय देखोगे ...।”'
    reason: हिब्रू में आज्ञार्थक क्रिया के साथ infinitive absolute का बलवर्धक प्रयोग है; यह आज्ञार्थक रूप को सुरक्षित रखते हुए संभावित भविष्यसूचक अर्थ की जानकारी देता है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: और उसने कहा
  rationale: वाव-युक्त कथात्मक क्रिया को सामान्य हिब्रू कथाप्रवाह के अनुरूप रखा गया है; कर्ता पिछले प्रसंग से स्पष्ट है।
- source_word: לֵךְ וְאָמַרְתָּ
  choice: जा और ... कह
  rationale: दोनों आज्ञार्थक भावों को सीधे और स्वाभाविक हिन्दी में रखा गया है; ये यशायाह को संबोधित एकवचन आदेश हैं।
- source_word: לָעָם הַזֶּה
  choice: इस प्रजा से
  rationale: עָם सामूहिक अर्थ में ‘प्रजा/लोग’ है। ‘इस प्रजा’ एकवचन सामूहिकता और मूल के कुछ दूरी सूचक लहजे को बनाए रखता है।
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: सुनते ही रहो
  rationale: आज्ञार्थक क्रिया के साथ infinitive absolute सुनने की क्रिया को प्रबल करता है। ‘ही रहो’ हिन्दी में निरंतरता और बल दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְאַל תָּבִינוּ
  choice: पर समझो मत
  rationale: בין का मुख्य भाव समझना या विवेक करना है। ‘पर’ दोनों खंडों के विरोध को स्पष्ट करता है, जबकि निषेधात्मक आज्ञा सुरक्षित रहती है।
- source_word: וּרְאוּ רָאוֹ
  choice: देखते ही रहो
  rationale: आज्ञार्थक क्रिया और infinitive absolute के बल तथा निरंतरता को पहले खंड के समानांतर हिन्दी संरचना में रखा गया है।
- source_word: וְאַל תֵּדָעוּ
  choice: पर जानो मत
  rationale: ידע का सीधा समतुल्य ‘जानना’ है। इसे ‘समझना’ या ‘पहचानना’ न बनाकर בין और ידע के बीच मूल पाठ का शब्दगत अंतर बनाए रखा गया है, यद्यपि प्रसंग में बोध/पहचान का भाव भी संभव है।
theological_decisions:
- issue: आज्ञाओं को सीधा आदेश माना जाए या न्यायसूचक भविष्यवाणी
  choice: 'व्याकरण के अनुसार सीधे आज्ञार्थक रूप: ‘सुनते ही रहो ... समझो मत; देखते ही रहो ... जानो मत।’'
  alternative: 'भविष्यसूचक अर्थ: ‘तुम निश्चय सुनोगे ... पर समझोगे नहीं; तुम निश्चय देखोगे ... पर जानोगे नहीं।’'
  rationale: שִׁמְעוּ और רְאוּ रूपतः आज्ञार्थक हैं और אַל के साथ अगले क्रियारूप निषेधात्मक आदेश का स्वाभाविक क्रम बनाते हैं। प्रसंग में इनका न्यायसूचक और विडंबनापूर्ण बल है, पर अनुवाद ने उसे केवल भविष्यवाणी में बदलकर व्याकरणिक तनाव समाप्त नहीं किया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और मौखिक रूप से स्पष्ट शैली अपनाई गई है। ‘प्रजा’ सामूहिक और कुछ दूरी सूचक संबोधन को बनाए रखता है। आदेशों में एकवचन ‘जा/कह’ और उद्धृत संदेश में बहुवचन ‘रहो/समझो/जानो’ मूल के वचन-भेद के अनुसार हैं।
