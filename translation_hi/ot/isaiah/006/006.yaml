base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/006.yaml
  text: Then one of the seraphim flew to me[a], and in his hand was a glowing coal that he had taken from the altar with tongs.
translation:
  language: hi
  text: तब सराफ़ों में से एक मेरी ओर उड़कर आया। उसके हाथ में एक दहकता अंगारा[a] था, जिसे उसने चिमटे से वेदी पर से लिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तपता पत्थर।” इब्रानी शब्द वेदी से लिए गए तपते पत्थर या जलते अंगारे को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעָף
  choice: उड़कर आया
  rationale: עוּף का अर्थ उड़ना है; אֵלַי के साथ ‘उड़कर आया’ हिन्दी में दिशा और गति दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵלַי
  choice: मेरी ओर
  rationale: אֶל के प्रथम पुरुष एकवचन प्रत्यय से वक्ता की ओर निर्देशित गति व्यक्त होती है।
- source_word: אֶחָד מִן־הַשְּׂרָפִים
  choice: सराफ़ों में से एक
  rationale: दर्शन में यह एक विशिष्ट वर्ग के स्वर्गीय प्राणियों का नाम है; इसलिए व्युत्पत्तिमूलक ‘जलनेवाले’ कहने के बजाय पारंपरिक नाम को लिप्यंतरित किया गया है।
- source_word: וּבְיָדוֹ
  choice: उसके हाथ में ... था
  rationale: इब्रानी नामवाचक वाक्यांश की ठोस छवि को स्वाभाविक हिन्दी में सहायक क्रिया के साथ रखा गया है।
- source_word: רִצְפָּה
  choice: एक दहकता अंगारा
  rationale: शब्द वेदी से लिए गए तपते पत्थर अथवा अंगारे को सूचित कर सकता है। ‘दहकता अंगारा’ आधुनिक हिन्दी में गर्म और प्रज्वलित वस्तु की छवि स्पष्ट करता है; ‘तपता पत्थर’ की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: בְּמֶלְקַחַיִם
  choice: चिमटे से
  rationale: यह संज्ञा अंगारा उठाने के उपकरण, अर्थात चिमटे, को दर्शाती है।
- source_word: לָקַח
  choice: लिया था
  rationale: यह पूर्ण क्रिया सराफ़ के उड़कर आने से पहले संपन्न हुई क्रिया को संदर्भ में स्वाभाविक रूप से व्यक्त करती है।
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: वेदी के ऊपर से
  rationale: מֵעַל का शाब्दिक स्थानिक भाव ‘ऊपर से’ है; यह बताता है कि वस्तु वेदी की सतह से उठाई गई थी।
theological_decisions:
- issue: स्वर्गीय सिंहासन-कक्ष के दर्शन में שְׂרָפִים का अनुवाद
  choice: सराफ़ों
  alternative: जलनेवालों
  rationale: यहाँ शब्द स्वर्गीय प्राणियों के एक विशिष्ट वर्ग का नाम है। लिप्यंतरण दर्शन की साहित्यिक और धर्मवैज्ञानिक विशिष्टता बचाता है और व्युत्पत्ति को उनकी पहचान मान लेने से बचता है।
- issue: वेदी से शुद्धीकरण के दृश्य में רִצְפָּה का अनुवाद
  choice: दहकता अंगारा
  alternative: तपता पत्थर
  rationale: मूल शब्द की अर्थ-सीमा में तपता पत्थर और अंगारा दोनों संभव हैं। मुख्य पाठ में सहज और दृश्यात्मक अभिव्यक्ति रखी गई है, जबकि वास्तविक शब्दगत अस्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सराफ़’ को विशिष्ट स्वर्गीय प्राणी के पारंपरिक नाम के रूप में रखा गया है। मूल की लंबी संयुक्त संरचना को स्पष्ट हिन्दी के लिए दो वाक्यों में बाँटा गया है, पर घटनाक्रम और सभी अर्थगत तत्व सुरक्षित हैं।
