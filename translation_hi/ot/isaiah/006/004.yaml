base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/004.yaml
  text: The foundations of the thresholds shook at the sound of the one calling[b][a], and the house was filled with smoke.
translation:
  language: hi
  text: पुकारनेवाले की आवाज़ से दहलीज़ों के आधार[b] हिल उठे, और भवन[a] धुएँ से भर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मन्दिर।” इब्रानी में “घर/भवन,” जो मन्दिर के पवित्र भवन के लिए प्रचलित शब्द है।
    reason: lexical_alternative
  - marker: b
    text: या “दहलीज़ों के खम्भे” अथवा “दहलीज़ों के सहारे।” इब्रानी पद द्वार और दहलीज़ के क्षेत्र के संरचनात्मक भागों को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנֻעוּ
  choice: हिल उठे
  rationale: נוּעַ के भौतिक हिलने के भाव को स्वाभाविक और सजीव हिन्दी में व्यक्त करता है।
- source_word: אַמּוֹת הַסִּפִּים
  choice: दहलीज़ों के आधार
  rationale: यह संयुक्त पद द्वार अथवा दहलीज़ के संरचनात्मक आधारों को दर्शाता है; अनिश्चित स्थापत्य-संदर्भ के लिए वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: מִקּוֹל הַקּוֹרֵא
  choice: पुकारनेवाले की आवाज़ से
  rationale: מִן के कारणवाचक भाव और substantival participle הַקּוֹרֵא के चलते हुए क्रियात्मक भाव—‘जो पुकार रहा है’—दोनों को संक्षिप्त, स्वाभाविक हिन्दी में रखता है।
- source_word: וְהַבַּיִת
  choice: और भवन
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है; दर्शन के संदर्भ में यह मन्दिर-भवन है। ‘भवन’ स्रोत की सामान्य संज्ञा को बनाए रखते हुए हिन्दी में गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: יִמָּלֵא עָשָׁן
  choice: धुएँ से भर गया
  rationale: निफ़अल रूप के निष्क्रिय/परिणामी भाव को हिन्दी कथा-क्रम में स्वाभाविक पूर्ण क्रिया से व्यक्त करता है।
theological_decisions:
- issue: भविष्यद्वक्ता के दर्शन में मन्दिर-संबंधी शब्दावली
  choice: भवन
  alternative: मन्दिर
  rationale: इब्रानी पाठ में सामान्य शब्द בַּיִת है, जो इस प्रसंग में मन्दिर के पवित्र भवन को सूचित करता है। मुख्य पाठ में ‘भवन’ रखने से मूल की शब्दगत व्यापकता बनी रहती है; ‘मन्दिर’ को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज है। ‘पुकारनेवाले’ से इब्रानी कृदन्त की अस्पष्ट पहचान और जारी पुकार का भाव सुरक्षित रखा गया है।
