source:
  edition: WLC
  text: וְ/ע֥וֹד בָּ/הּ֙ עֲשִׂ֣רִיָּ֔ה וְ/שָׁ֖בָה וְ/הָיְתָ֣ה לְ/בָעֵ֑ר כָּ/אֵלָ֣ה וְ/כָ/אַלּ֗וֹן אֲשֶׁ֤ר בְּ/שַׁלֶּ֨כֶת֙ מַצֶּ֣בֶת בָּ֔/ם זֶ֥רַע קֹ֖דֶשׁ מַצַּבְתָּֽ/הּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/013.yaml
  text: And though a tenth remains in it[a], it will again be for burning, like a terebinth or like an oak whose stump remains when it is felled. The holy seed is its stump.
translation:
  language: hi
  text: और यदि उसमें दसवाँ भाग बच भी जाए, तो वह फिर जलाए जाने के लिए होगा—बुतुम या बलूत के उस पेड़ के समान जिसका ठूँठ काट गिराए जाने पर रह जाता है।[a] पवित्र वंश उसका ठूँठ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पतझड़ में” अथवा “जब उसके पत्ते झड़ते हैं।” यहाँ प्रयुक्त इब्रानी शब्द कठिन है; मुख्य पाठ में ठूँठ की छवि के अनुरूप पेड़ काट गिराए जाने का अर्थ लिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֥וֹד בָּהּ עֲשִׂרִיָּה
  choice: यदि उसमें दसवाँ भाग बच भी जाए
  rationale: ע֥וֹד और संदर्भ के संयुक्त बल को स्वाभाविक हिन्दी में रियायती भाव के साथ व्यक्त किया गया है; עֲשִׂרִיָּה की मात्रात्मक छवि ‘दसवाँ भाग’ में बनी रहती है।
- source_word: וְשָׁבָה וְהָיְתָה לְבָעֵר
  choice: तो वह फिर जलाए जाने के लिए होगा
  rationale: שׁוב पुनरावृत्ति का भाव देता है और לְבָעֵר को परिणाम को जरूरत से अधिक निश्चित किए बिना ‘जलाए जाने के लिए’ के रूप में रखा गया है।
- source_word: כָּאֵלָה וְכָאַלּוֹן
  choice: जैसे बुतुम या बलूत के पेड़
  rationale: दोनों विशिष्ट वृक्षों को सामान्य ‘बड़ा पेड़’ न बनाकर अलग-अलग रखा गया है; हिन्दी में बुतुम और बलूत अपेक्षाकृत सटीक नाम हैं।
- source_word: בְּשַׁלֶּכֶת
  choice: काट गिराने पर
  rationale: शब्द कठिन और विवादित है। ठूँठ की निकटवर्ती छवि के कारण मुख्य पाठ में पेड़ गिराए जाने का अर्थ लिया गया है, जबकि पतझड़ वाला विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: מַצֶּבֶת בָּם
  choice: उसका ठूँठ रह जाता है
  rationale: वृक्ष-रूपक में מַצֶּבֶת खड़े बचे हुए तने या ठूँठ को सूचित करता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: זֶרַע קֹדֶשׁ
  choice: पवित्र वंश
  rationale: זֶרַע का ‘बीज’ और ‘वंश/संतति’ दोनों से जुड़ा अर्थ है। मनुष्यों के बचे हुए समुदाय की ओर संकेत करते हुए ‘वंश’ स्वाभाविक है और रूपक का अर्थ अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: מַצַּבְתָּהּ
  choice: उसका ठूँठ होगा
  rationale: पहले आए מַצֶּבֶת से शब्दगत और रूपकगत संबंध बनाए रखने के लिए वही ‘ठूँठ’ शब्द दोहराया गया है।
theological_decisions:
- issue: ‘पवित्र वंश’ की पहचान
  choice: वाक्य को ‘पवित्र वंश उसका ठूँठ होगा’ रखा गया है, बिना यह निर्धारित किए कि यह विश्वासयोग्य बचे हुओं, भावी इस्राएल या मसीही वंश में से किसे विशेष रूप से दर्शाता है।
  alternative: इसे स्पष्टतः ‘विश्वासयोग्य बचे हुए लोग’, ‘वाचा के बचे हुए लोग’ या ‘मसीही वंश’ कहना।
  rationale: इब्रानी पाठ न्याय के बाद बचे एक पवित्र मूल की छवि देता है, पर इस पद में उसकी पहचान को अधिक संकीर्ण रूप से परिभाषित नहीं करता। शाब्दिक रूपक धार्मिक तनाव और वास्तविक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘बुतुम’ और ‘बलूत’ वृक्षों की विशिष्टता बचाते हैं; वाक्य-विन्यास हिन्दी की स्वाभाविकता के लिए दो वाक्यों में रखा गया है।
