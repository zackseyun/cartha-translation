source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה שִׁמְר֥וּ מִשְׁפָּ֖ט וַ/עֲשׂ֣וּ צְדָקָ֑ה כִּֽי קְרוֹבָ֤ה יְשֽׁוּעָתִ/י֙ לָ/ב֔וֹא וְ/צִדְקָתִ֖/י לְ/הִגָּלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/001.yaml
  text: 'Thus says Yahweh: Keep justice[a], and do righteousness, for my salvation is near to come[b], and my righteousness to be revealed.'
translation:
  language: hi
  text: 'याहवे यों कहता है:


    “न्याय का पालन करो और धार्मिकता का आचरण करो,


    क्योंकि मेरा उद्धार[a] आने को निकट है,


    और मेरी धार्मिकता[b] प्रकट होनेवाली है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरा छुटकारा।”
    reason: lexical_alternative
  - marker: b
    text: या, “मेरा न्याय” अथवा “मेरा पक्ष सिद्ध करना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: यह भविष्यद्वाणी की घोषणा का सूत्र है। वर्तमान काल हिन्दी में इस सतत अधिकारपूर्ण वचन को स्वाभाविक रूप से व्यक्त करता है, और याहवे मूल पाठ में आए परमेश्वर के विशिष्ट नाम को दर्शाता है।
- source_word: שִׁמְרוּ מִשְׁפָּט
  choice: न्याय का पालन करो
  rationale: שׁמר यहाँ न्याय को सावधानी से मानने और व्यवहार में बनाए रखने का भाव देता है। ‘न्याय का पालन करो’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וַעֲשׂוּ צְדָקָה
  choice: और धार्मिकता के काम करो
  rationale: यह अभिव्यक्ति עשה की क्रियात्मकता को बनाए रखती है और צְדָקָה को पहले आए מִשְׁפָּט ‘न्याय’ से अलग रखती है।
- source_word: יְשׁוּעָתִי
  choice: मेरा उद्धार
  rationale: यह परमेश्वर द्वारा दिए जानेवाले व्यापक बचाव को व्यक्त करता है; ‘छुटकारा’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: קְרוֹבָה ... לָבוֹא
  choice: शीघ्र आनेवाला है
  rationale: शाब्दिक ‘आने के लिए निकट है’ हिन्दी में अस्वाभाविक होगा। यह रूप निकटता और आगमन—दोनों भाव स्वाभाविक हिन्दी में रखता है।
- source_word: וְצִדְקָתִי
  choice: और मेरी धार्मिकता
  rationale: यह परमेश्वर के धर्मी स्वभाव और उसके न्यायपूर्ण, उद्धारकारी कार्य—दोनों की संभावित व्याप्ति को संकुचित नहीं करता।
- source_word: לְהִגָּלוֹת
  choice: प्रकट होनेवाली है
  rationale: निफ़अल रूप किसी बात के प्रकट या प्रत्यक्ष होने का भाव देता है; चुना गया रूप हिन्दी में सहज है और मूल का कर्मवाच्य भाव रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला परमेश्वर का विशिष्ट वाचा-नाम सीधे आया है। ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: מִשְׁפָּט और צְדָקָה का परस्पर संबंध
  choice: न्याय का पालन करो और धार्मिकता के काम करो
  alternative: न्याय को बनाए रखो और सही काम करो
  rationale: 'दोनों निकटार्थी नैतिक शब्दों के बीच का भेद बनाए रखा गया है: पहला न्यायपूर्ण व्यवस्था और निर्णय पर, दूसरा धर्ममय आचरण पर बल देता है।'
- issue: परमेश्वर की צְדָקָה का अर्थ
  choice: मेरी धार्मिकता
  alternative: मेरा न्याय; मेरा न्यायपूर्ण समर्थन
  rationale: यशायाह में यह शब्द परमेश्वर के धर्मी चरित्र, न्यायपूर्ण कार्य और उद्धारकारी समर्थन को समेट सकता है। ‘धार्मिकता’ इस अर्थगत और धर्मवैज्ञानिक तनाव को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और घोषणात्मक रखी गई है। काव्यात्मक समानांतरता को पंक्ति-विभाजन से स्पष्ट किया गया है; अत्यधिक संस्कृतनिष्ठ या किसी संप्रदाय-विशेष की शब्दावली से बचा गया है।
