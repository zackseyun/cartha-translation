id: ISA.56.4
reference: Isaiah 56:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה לַ/סָּֽרִיסִים֙ אֲשֶׁ֤ר יִשְׁמְרוּ֙ אֶת שַׁבְּתוֹתַ֔/י וּ/בָֽחֲר֖וּ בַּ/אֲשֶׁ֣ר חָפָ֑צְתִּי וּ/מַחֲזִיקִ֖ים בִּ/בְרִיתִֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/004.yaml
  text: 'For thus says the LORD to the eunuchs who keep my Sabbaths, and choose what I delight in, and hold fast to my covenant:'
translation:
  language: hi
  text: 'क्योंकि यहोवा उन नपुंसकों से यों कहता है जो मेरे विश्राम-दिनों को मानते हैं, जो वही चुनते हैं जो मुझे प्रिय है, और मेरी वाचा को दृढ़ता से थामे रहते हैं:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को सामान्य हिन्दी में पहचाने जाने योग्य रूप में सुरक्षित रखा गया है।
- source_word: סָּרִיסִים
  choice: नपुंसकों
  rationale: यहाँ संदर्भ शारीरिक रूप से नपुंसक पुरुषों का है; पद 3 की पृष्ठभूमि और आगे संतान के उल्लेख के कारण व्यापक अर्थ 'दरबारी अधिकारी' उपयुक्त नहीं है।
- source_word: יִשְׁמְרוּ אֶת שַׁבְּתוֹתַי
  choice: मेरे विश्राम-दिनों को मानते हैं
  rationale: שמר में पालन, रक्षा और सावधानी से मानने का भाव है; हिन्दी में 'मानते हैं' धार्मिक आज्ञापालन को स्वाभाविक रूप से व्यक्त करता है। बहुवचन 'विश्राम-दिनों' मूल पाठ के बहुवचन को रखता है।
- source_word: וּבָחֲרוּ בַּאֲשֶׁר חָפָצְתִּי
  choice: जो उसे चुनते हैं जिससे मैं प्रसन्न होता हूँ
  rationale: חפץ के प्रसन्नता/रुचि के भाव और मनुष्य के नैतिक चुनाव, दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में रखा गया है।
- source_word: וּמַחֲזִיקִים בִּבְרִיתִי
  choice: और मेरी वाचा को दृढ़ता से थामे रहते हैं
  rationale: מחזיק में मजबूती से पकड़े रहने और निष्ठापूर्वक जुड़े रहने का भाव है; 'थामे रहते हैं' उसकी निरंतरता को व्यक्त करता है।
theological_decisions:
- issue: नपुंसकों की पहचान
  choice: शारीरिक रूप से नपुंसक व्यक्तियों को सूचित करने वाला 'नपुंसकों'
  alternative: '''दरबारी अधिकारियों'''
  rationale: निकटवर्ती संदर्भ में सूखे वृक्ष और नाम/संतान का विरोध शारीरिक नपुंसकता की ओर संकेत करता है; पद उनके वाचा-समुदाय में स्वागत पर बल देता है।
- issue: वाचा से जुड़े कर्मों का संबंध
  choice: तीनों समन्वित क्रियाओं को समानांतर रखा गया है
  alternative: किसी एक क्रिया को अन्य क्रियाओं का कारण या परिणाम बनाना
  rationale: हिब्रू पाठ उन्हें וּ के द्वारा जोड़ता है और स्पष्ट कारणात्मक क्रम निर्धारित नहीं करता; इसलिए theological tension को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, सार्वजनिक पाठ के अनुकूल शैली। 'यों कहता है' भविष्यद्वाणी की पारंपरिक उद्घोषणा को सहज रूप में रखता है; 'वाचा' स्थापित बाइबिलीय शब्दावली है।
