  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה מְקַבֵּ֖ץ נִדְחֵ֣י יִשְׂרָאֵ֑ל ע֛וֹד אֲקַבֵּ֥ץ עָלָ֖י/ו לְ/נִקְבָּצָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/008.yaml
  text: 'The declaration of the Lord GOD[b][a], who gathers the outcasts of Israel: I will gather still more to him besides those already gathered to him.'
translation:
  language: hi
  text: 'इस्राएल के तितर-बितर किए गए लोगों को इकट्ठा करने वाले प्रभु याहवे[a] की यह घोषणा है: “मैं उसके पास उसके पहले से इकट्ठे किए हुओं के अतिरिक्त और लोगों को भी इकट्ठा करूँगा।”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में ‘अदोनाय याहवे’, अर्थात् ‘प्रभु याहवे’।
    reason: lexical_alternative
  - marker: b
    text: या, “मैं उनके पास उनके पहले से इकट्ठे किए हुओं के अतिरिक्त और लोगों को भी इकट्ठा करूँगा।” हिब्रू प्रत्यय एकवचन हैं, पर उनका भाव सामूहिक मानकर बहुवचन में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: נְאֻם
  choice: की यह घोषणा है
  rationale: यह संज्ञात्मक रूप में आए गंभीर ईश्वरीय कथन को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנָי יְהוָה
  choice: प्रभु याहवे
  rationale: अदोनाय को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ के रूप में रखा गया है; इससे दोनों हिब्रू पद अलग-अलग बने रहते हैं।
- source_word: מְקַבֵּץ
  choice: इकट्ठा करने वाले
  rationale: हिब्रू कृदंत प्रभु का वर्णन उस व्यक्ति के रूप में करता है जो लोगों को इकट्ठा करता है।
- source_word: נִדְחֵי יִשְׂרָאֵל
  choice: इस्राएल के तितर-बितर किए गए लोगों
  rationale: यह उन लोगों के लिए है जिन्हें धकेलकर दूर कर दिया गया या बिखेर दिया गया; कर्मवाच्य रूप उस भाव को बनाए रखता है।
- source_word: עוֹד אֲקַבֵּץ
  choice: मैं और भी लोगों को ... इकट्ठा करूँगा
  rationale: עוֹד का योगात्मक बल और अपूर्ण क्रिया में निहित भावी प्रतिज्ञा दोनों स्पष्ट होते हैं।
- source_word: עָלָיו
  choice: उसके पास
  rationale: एकवचन प्रत्यय को बनाए रखते हुए על को यहाँ किसी व्यक्ति या सामूहिक रूप से समझे गए इस्राएल के पास इकट्ठा करने के अर्थ में लिया गया है।
- source_word: לְנִקְבָּצָיו
  choice: जो उसके पास पहले से इकट्ठे किए जा चुके हैं, उनके अलावा
  rationale: यह अनुवाद पहले से एकत्र समूह और उसमें आगे जोड़े जाने वाले लोगों का भाव स्पष्ट करता है तथा हिब्रू के एकवचन प्रत्यय को सुरक्षित रखता है।
theological_decisions:
- issue: אֲדֹנָי יְהוָה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर; प्रभु यहोवा
  rationale: यह चयन उपाधि אֲדֹנָי और वाचा के व्यक्तिगत नाम יהוה, दोनों को अलग और स्पष्ट रखता है तथा ‘प्रभु प्रभु’ जैसी पुनरावृत्ति से बचता है।
- issue: עָלָיו और נִקְבָּצָיו के एकवचन प्रत्ययों का संदर्भ
  choice: एकवचन ‘उसके’ को बनाए रखना
  alternative: सामूहिक अर्थ को बहुवचन बनाकर ‘उनके पास’ कहना; इसे भूमि या सिय्योन का संदर्भ मानना
  rationale: हिब्रू पाठ दोनों स्थानों पर पुल्लिंग एकवचन प्रत्यय रखता है। मुख्य पाठ उसे बनाए रखता है और सम्भव सामूहिक बहुवचन अर्थ को पादटिप्पणी में देता है, ताकि अस्पष्टता समय से पहले समाप्त न हो।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘तितर-बितर किए गए’ निर्वासन या जबरन बिखेर दिए जाने का भाव रखता है; ‘इकट्ठा’ साधारण पाठक के लिए सहज है। वाक्य की गरिमा भविष्यवाणी की औपचारिक घोषणा के अनुरूप रखी गई है।
