source:
  edition: WLC
  text: וְ/נָתַתִּ֨י לָ/הֶ֜ם בְּ/בֵיתִ֤/י וּ/בְ/חֽוֹמֹתַ/י֙ יָ֣ד וָ/שֵׁ֔ם ט֖וֹב מִ/בָּנִ֣ים וּ/מִ/בָּנ֑וֹת שֵׁ֤ם עוֹלָם֙ אֶתֶּן ל֔/וֹ אֲשֶׁ֖ר לֹ֥א יִכָּרֵֽת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/005.yaml
  text: And I will give them[a], in my house and within my walls, a monument and a name better than sons and daughters[b]; I will give them an everlasting name that will not be cut off.
translation:
  language: hi
  text: और मैं उन्हें अपने घर में और अपनी दीवारों के भीतर एक स्मारक और एक नाम दूँगा[a], जो पुत्रों और पुत्रियों से उत्तम होगा; मैं उसे एक सदा रहने वाला नाम दूँगा, जो कभी काटा नहीं जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘स्मारक और नाम’—इब्रानी में शाब्दिक रूप से ‘हाथ और नाम’; यहाँ ‘हाथ’ संभवतः किसी स्मृति-चिह्न या स्मारक के अर्थ में है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यहाँ पहले के बहुवचन ‘उन्हें’ से एकवचन ‘उसे’ की ओर परिवर्तन है। ‘काटा नहीं जाएगा’ का भाव है कि यह नाम कभी समाप्त या मिट नहीं जाएगा।
    reason: source_form_and_lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: और मैं ... दूँगा
  rationale: נתן का सामान्य अर्थ ‘देना’ है; यही सरल और स्वाभाविक है तथा पद में क्रिया की पुनरावृत्ति बनाए रखता है।
- source_word: לָהֶם
  choice: उन्हें
  rationale: बहुवचन सर्वनाम पूर्ववर्ती समूह की ओर संकेत करता है, इसलिए प्रथम खंड में बहुवचन रखा गया है।
- source_word: בְּבֵיתִי וּבְחֹמֹתַי
  choice: अपने भवन में और अपनी दीवारों के भीतर
  rationale: ‘भवन’ मूल के בית को बिना उसे स्पष्टतः ‘मन्दिर’ बनाकर व्याख्यायित किए रखता है; ‘दीवारों के भीतर’ पवित्र परिसर में स्थान का स्वाभाविक बोध देता है।
- source_word: יָד וָשֵׁם
  choice: एक स्मारक और नाम
  rationale: יָד का मूल अर्थ ‘हाथ’ है, पर इस मुहावरे में यह स्थायी स्मृति-चिह्न या स्मारक को सूचित करता है। ‘स्मारक’ हिन्दी में बोधगम्य रहते हुए ठोस स्मृति का भाव रखता है।
- source_word: טוֹב מִבָּנִים וּמִבָּנוֹת
  choice: पुत्रों और पुत्रियों से उत्तम
  rationale: तुलनात्मक מן को स्पष्ट रखा गया है और ‘पुत्रों और पुत्रियों’ से मूल की लिंग-विशिष्ट शब्दावली सुरक्षित रहती है।
- source_word: שֵׁם עוֹלָם
  choice: सदा बना रहने वाला ... नाम
  rationale: עוֹלָם यहाँ स्थायी और अनन्तकालिक बने रहने का भाव देता है; यह हिन्दी में स्वाभाविक और गरिमापूर्ण अभिव्यक्ति है।
- source_word: אֶתֶּן לוֹ
  choice: मैं उसे ... दूँगा
  rationale: मसोरेटिक पाठ में यहाँ एकवचन לוֹ है। ‘उसे’ बहुवचन समूह से व्यक्तिगत सदस्य की ओर होने वाले वास्तविक संख्या-परिवर्तन को सुरक्षित रखता है।
- source_word: אֲשֶׁר לֹא יִכָּרֵת
  choice: जो कभी मिटाया नहीं जाएगा
  rationale: כרת निफ़अल का शाब्दिक अर्थ ‘काटा नहीं जाएगा’ है, किंतु नाम के साथ हिन्दी में ‘मिटाया नहीं जाएगा’ स्थायी स्मृति और वंश समाप्त होने की ध्वनि को अधिक स्वाभाविक ढंग से व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: יָד וָשֵׁם का मुहावरेदार अर्थ
  choice: एक स्मारक और नाम
  alternative: एक हाथ और नाम; एक स्मृति-चिह्न और नाम
  rationale: शाब्दिक ‘हाथ’ आधुनिक हिन्दी में अस्पष्ट होगा। ‘स्मारक’ संतान-विहीन लोगों को स्थायी स्मरण और सम्मान दिए जाने की प्रतिज्ञा का ठोस, सार्वजनिक भाव व्यक्त करता है।
- issue: לָהֶם से לוֹ तक संख्या-परिवर्तन
  choice: ‘उन्हें’ ... ‘उसे’
  alternative: पूरे पद में ‘उन्हें’; अथवा ‘उनमें से हर एक को’
  rationale: इब्रानी पाठ बहुवचन से एकवचन में बदलता है। उसे बनाए रखने से सामूहिक संबोधन के भीतर व्यक्ति पर केंद्रित प्रतिज्ञा सुरक्षित रहती है; सामंजस्य बैठाकर बहुवचन करना वास्तविक पाठगत विशेषता मिटा देता।
- issue: לֹא יִכָּרֵת का रूपक
  choice: कभी मिटाया नहीं जाएगा
  alternative: कभी काटा नहीं जाएगा; कभी समाप्त नहीं होगा
  rationale: नाम को ‘मिटाना’ हिन्दी में स्वाभाविक है और स्थायी स्मरण का आशय देता है। फिर भी मूल के ‘काटे जाने’ वाले रूपक और उसकी संभावित अंतर्ध्वनि को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘भवन’ मूल के ‘मेरे घर’ को धार्मिक संदर्भ में सम्मानपूर्ण ढंग से रखता है, जबकि उसे व्याख्यात्मक रूप से केवल ‘मन्दिर’ तक सीमित नहीं करता। विराम-चिह्न मूल के दो निकटवर्ती प्रतिज्ञात्मक खंडों को स्पष्ट करते हैं।
