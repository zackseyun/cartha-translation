  to: और मैं उन्हें अपने घर में और अपनी दीवारों के भीतर एक स्मारक और एक नाम दूँगा[a], जो पुत्रों और पुत्रियों से उत्तम होगा; मैं उसे एक सदा रहने वाला नाम दूँगा, जो कभी काटा नहीं जाएगा[b]।
