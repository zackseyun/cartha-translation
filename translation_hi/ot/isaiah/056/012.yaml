  yaml_path: translation/ot/isaiah/056/012.yaml
  text: Come[a], let me get wine, and let us fill ourselves with strong drink; and tomorrow will be like this day[b], great beyond measure.
translation:
  language: hi
  text: “आओ, मैं दाखरस ले आऊँ; हम मदिरा से जी भरकर पिएँ[a]; कल आज जैसा ही होगा, बल्कि उससे भी बहुत अधिक[b]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम मदिरा से अपने को भर लें।” हिब्रू क्रिया भरने या तृप्त होने का भाव दे सकती है; प्रसंग में मदिरापान की अति निहित है।
    reason: lexical_alternative
  - marker: b
    text: या, “कल आज जैसा होगा—और भी बहुत अधिक।” अंतिम हिब्रू पदबंध अगले दिन की बहुतायत के विषय में की गई डींग को तीव्र करता है।
