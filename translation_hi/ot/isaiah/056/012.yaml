lexical_decisions:
- source_word: אֵתָיוּ
  choice: आओ
  rationale: यह समूह को संबोधित आमंत्रणसूचक उद्गार है; ‘आओ’ संक्षिप्त, स्वाभाविक और प्रसंग के उच्छृंखल निमंत्रण के अनुरूप है।
- source_word: אֶקְחָה
  choice: मैं … ले आऊँ
  rationale: प्रथम पुरुष का यह रूप वक्ता की इच्छा या प्रस्ताव व्यक्त करता है। हिंदी में ‘मैं … ले आऊँ’ आमंत्रण के भीतर उस स्वैच्छिक भाव को स्वाभाविक रूप से प्रकट करता है।
- source_word: יַיִן
  choice: दाखमधु
  rationale: यह अंगूर से बनी मदिरा का सामान्य हिब्रू शब्द है। ‘दाखमधु’ बाइबलीय संदर्भ में परिचित और अर्थ की दृष्टि से सटीक है।
- source_word: וְנִסְבְּאָה
  choice: और हम … जी भरकर पिएँ
  rationale: סבא तृप्त या भर जाने का भाव रखता है और यहाँ पेय के साथ अति तक पीने की ओर संकेत करता है। ‘जी भरकर पिएँ’ मूल बिंब और प्रसंगगत अति दोनों को सहज हिंदी में व्यक्त करता है, बिना सीधे ‘मतवाले हो जाएँ’ कहकर अर्थ को अधिक निश्चित किए।
- source_word: שֵׁכָר
  choice: मदिरा
  rationale: यह दाखमधु से अलग किसी नशीले पेय का व्यापक पद है। हिंदी में ‘मदिरा’ स्वाभाविक और पर्याप्त रूप से व्यापक है; ‘तेज़ मदिरा’ आधुनिक आसुत शराब का भ्रामक संकेत दे सकती है।
- source_word: וְהָיָה
  choice: होगा
  rationale: यह साधारण भावी कथन है; हिंदी वाक्य में ‘कल’ इसका स्वाभाविक कर्ता बनता है।
- source_word: כָזֶה
  choice: आज जैसा
  rationale: शाब्दिक अर्थ ‘इस जैसा’ है और संकेत वर्तमान दिन या परिस्थिति की ओर है। हिंदी में ‘आज जैसा’ उस संदर्भ को स्पष्ट करते हुए तुलना को बनाए रखता है।
- source_word: יוֹם מָחָר
  choice: कल
  rationale: शाब्दिक ‘कल का दिन’ को हिंदी में सहज रूप से ‘कल’ कहा जाता है।
- source_word: גָּדוֹל
  choice: बढ़कर
  rationale: गָּדוֹל का मूल भाव ‘बड़ा/महान’ है, पर यहाँ अगले दिन की मात्रा या भरपूरी की डींग में तुलनात्मक हिंदी ‘बढ़कर’ अधिक स्वाभाविक है।
- source_word: יֶתֶר מְאֹד
  choice: कहीं बढ़कर
  rationale: यह पदबंध तीव्र वृद्धि या अधिकता व्यक्त करता है। ‘कहीं बढ़कर’ अगले दिन के और भी अधिक होने की शेखी को स्वाभाविक हिंदी में रखता है।
