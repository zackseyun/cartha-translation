  text: וּ/בְנֵ֣י הַ/נֵּכָ֗ר הַ/נִּלְוִ֤ים עַל יְהוָה֙ לְ/שָׁ֣רְת֔/וֹ וּֽ/לְ/אַהֲבָה֙ אֶת שֵׁ֣ם יְהוָ֔ה לִ/הְי֥וֹת ל֖/וֹ לַ/עֲבָדִ֑ים כָּל שֹׁמֵ֤ר שַׁבָּת֙ מֵֽ/חַלְּל֔/וֹ וּ/מַחֲזִיקִ֖ים בִּ/בְרִיתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/006.yaml
  text: And the sons of the foreigner who join themselves to Yahweh[a], to minister to him, and to love the name of Yahweh[d][c][b], to be his servants—everyone who keeps the Sabbath from profaning it and holds fast my covenant—
translation:
  language: hi
  text: और परदेशी के वे पुत्र जो यहवे से जुड़ते हैं—उसकी सेवा करने, यहवे के नाम से प्रेम रखने और उसके सेवक बनने के लिए—हर वह व्यक्ति जो सब्त को अपवित्र करने से बचता है और मेरी वाचा को दृढ़ता से थामे रहता है—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי הַנֵּכָר
  choice: परदेशी के वे पुत्र
  rationale: इब्रानी के ठोस मुहावरे ‘परदेशी के पुत्र’ को बनाए रखता है; यहाँ यह सामूहिक रूप से परदेशी लोगों को सूचित करता है। स्वाभाविक विकल्प ‘परदेशी’ पादटिप्पणी में दिया गया है।
- source_word: הַנִּלְוִים עַל יְהוָה
  choice: जो यहवे से जुड़ जाते हैं
  rationale: निफ़अल कृदंत में स्वेच्छा से संबंध और निष्ठा जोड़ने का भाव है; ‘से जुड़ जाते हैं’ इसे सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לְשָׁרְתוֹ
  choice: उसकी सेवा करने
  rationale: שרת परमेश्वर के सम्मुख धार्मिक अथवा उपासना-संबंधी सेवा को सूचित कर सकता है। हिन्दी में ‘सेवा करने’ स्वाभाविक है और यह अर्थ सुरक्षित रखता है।
- source_word: וּלְאַהֲבָה אֶת שֵׁם יְהוָה
  choice: यहवे के नाम से प्रेम करने
  rationale: मूल पाठ में ‘नाम’ स्पष्टतः उपस्थित है; उसे बनाए रखने से वाचागत और श्रद्धामय अर्थ सुरक्षित रहता है।
- source_word: לִהְיוֹת לוֹ לַעֲבָדִים
  choice: उसके सेवक बनने
  rationale: עֲבָדִים में सेवक अथवा दास दोनों अर्थ संभव हैं। इस उपासना और वाचा के प्रसंग में ‘सेवक’ अधिक स्वाभाविक है, जबकि दूसरा अर्थ पादटिप्पणी में रखा गया है।
- source_word: כָּל שֹׁמֵר שַׁבָּת מֵחַלְּלוֹ
  choice: हर वह व्यक्ति जो सब्त को अपवित्र करने से बचता है
  rationale: כָּל के साथ एकवचन कृदंत का वितरणात्मक भाव ‘हर वह व्यक्ति’ से स्पष्ट होता है। ‘अपवित्र करने से बचता है’ מִן के साथ आए infinitive का आशय स्वाभाविक हिन्दी में देता है।
- source_word: וּמַחֲזִיקִים בִּבְרִיתִי
  choice: और मेरी वाचा को दृढ़ता से थामे रहता है
  rationale: חזק में मजबूती से पकड़ने और न छोड़ने का भाव है। ‘दृढ़ता से थामे रहता है’ इस निरंतर वाचागत निष्ठा को व्यक्त करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चार अक्षरों वाले ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण ‘यहवे’ के रूप में रखा गया है।
theological_decisions:
- issue: परदेशियों के वाचागत समावेश की भाषा
  choice: मूल का ठोस पदबंध ‘परदेशी के वे पुत्र’ रखते हुए उनके यहवे से जुड़ने और उसकी सेवा करने को स्पष्ट करना
  alternative: केवल ‘परदेशी’ कहना
  rationale: इससे मूल इब्रानी अभिव्यक्ति और परदेशियों के पूर्ण वाचागत संबंध, दोनों सुरक्षित रहते हैं; पाठ से आगे की कोई धार्मिक व्यवस्था आरोपित नहीं होती।
- issue: עֲבָדִים का अर्थ
  choice: सेवक
  alternative: दास
  rationale: शब्द में दोनों अर्थों की संभावना है। यहाँ मुख्य बल उपासना, सेवा और वाचा से संबंध पर है, इसलिए मुख्य पाठ में ‘सेवक’ चुना गया है और कठोरतर विकल्प पादटिप्पणी में रखा गया है।
- issue: כָּל שֹׁמֵר की वचन-संगति
  choice: हर वह व्यक्ति जो… बचता है… थामे रहता है
  alternative: वे सभी जो… बचते हैं… थामे रहते हैं
  rationale: एकवचन कृदंत के साथ כָּל का वितरणात्मक अर्थ बनाए रखने के लिए हिन्दी में एकवचन संरचना अपनाई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और स्रोत-समीपी शैली। वाक्य के अंत का दीर्घ विराम अगले पद में जारी रहने वाली संरचना को दर्शाता है। केवल वही पादटिप्पणी रखी गई है जिसके लिए मुख्य पाठ में वास्तविक और उपयोगी शाब्दिक विकल्प आवश्यक है।
