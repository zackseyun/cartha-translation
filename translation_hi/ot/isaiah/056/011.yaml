source:
  edition: WLC
  text: וְ/הַ/כְּלָבִ֣ים עַזֵּי נֶ֗פֶשׁ לֹ֤א יָֽדְעוּ֙ שָׂבְעָ֔ה וְ/הֵ֣מָּה רֹעִ֔ים לֹ֥א יָדְע֖וּ הָבִ֑ין כֻּלָּ/ם֙ לְ/דַרְכָּ֣/ם פָּנ֔וּ אִ֥ישׁ לְ/בִצְע֖/וֹ מִ/קָּצֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/011.yaml
  text: And the dogs are greedy in appetite[a]; they do not know satisfaction. And they are shepherds who do not know understanding; all of them have turned to their own way, each one to his own gain[c][b], every one without exception.
translation:
  language: hi
  text: और इन कुत्तों की भूख बड़ी प्रबल है[a]; वे तृप्ति को नहीं जानते। और वे ऐसे चरवाहे हैं जो समझना नहीं जानते[b]। वे सब अपने-अपने मार्ग की ओर मुड़ गए हैं, हर एक अपने लाभ के पीछे—बिना किसी अपवाद के।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “इनकी भूख कभी नहीं मिटती”; शाब्दिक अर्थ के निकट: “प्रबल/उग्र भूख वाले।”'
    reason: lexical_alternative
  - marker: b
    text: या “वे समझ नहीं रखते” अथवा “वे विवेक की बात नहीं जानते।”
    reason: lexical_alternative
  - marker: c
    text: अंतिम इब्रानी पदबंध कठिन है; इसका अनुवाद “हर ओर से” भी हो सकता है। संभवतः यह उनके भ्रष्ट स्वार्थ की सर्वव्यापकता पर बल देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּלָבִים
  choice: कुत्तों
  rationale: इब्रानी के ठोस और तीखे रूपक को बनाए रखा गया है; इसे व्याख्यात्मक रूप से ‘अगुवे’ या ‘पहरेदार’ नहीं बनाया गया।
- source_word: עַזֵּי נֶפֶשׁ
  choice: भूख बड़ी प्रबल है
  rationale: נֶפֶשׁ यहाँ इच्छा या भूख का बोध देता है और עַזֵּי उसकी तीव्रता बताता है। यह रूप स्वाभाविक हिन्दी में उनकी भयंकर लालसा व्यक्त करता है, जबकि ‘अतृप्त’ कहकर अगली पंक्ति को पहले से नहीं दोहराता।
- source_word: לֹא יָדְעוּ שָׂבְעָה
  choice: वे तृप्ति को नहीं जानते
  rationale: ‘जानना’ और ‘तृप्ति’ दोनों को रखते हुए इब्रानी अभिव्यक्ति तथा पिछली पंक्ति से उसका संबंध सुरक्षित रखा गया है।
- source_word: רֹעִים
  choice: चरवाहे
  rationale: मूल का नेतृत्व-संबंधी रूपक सुरक्षित रखा गया है; इसे ‘पास्टर’ या सामान्य ‘अगुवे’ में नहीं बदला गया।
- source_word: לֹא יָדְעוּ הָבִין
  choice: समझना नहीं जानते
  rationale: इब्रानी में दोहराए गए ‘नहीं जानते’ को बनाए रखता है और हिन्दी में भी अर्थ स्पष्ट रहता है।
- source_word: כֻּלָּם לְדַרְכָּם פָּנוּ
  choice: वे सब अपने-अपने मार्ग की ओर मुड़ गए हैं
  rationale: समूह पर लगाए गए आरोप और ‘मार्ग’ के नैतिक रूपक, दोनों को बनाए रखा गया है।
- source_word: אִישׁ לְבִצְעוֹ
  choice: हर एक अपने लाभ के पीछे
  rationale: אִישׁ की वितरणात्मक शक्ति ‘हर एक’ से व्यक्त होती है। בֶּצַע लाभ या स्वार्थपूर्ण कमाई का नकारात्मक भाव रख सकता है, पर मुख्य पाठ में ‘अन्यायपूर्ण’ जोड़कर अर्थ को आवश्यकता से अधिक निश्चित नहीं किया गया।
- source_word: מִקָּצֵהוּ
  choice: बिना किसी अपवाद के
  rationale: कठिन पदबंध को प्रसंग में समूचे समूह पर लागू आरोप की व्यापकता के रूप में प्रस्तुत किया गया है; स्थानगत विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ‘कुत्तों’ और ‘चरवाहों’ की रूपकात्मक पहचान
  choice: मुख्य पाठ में दोनों रूपकों को यथावत रखना
  alternative: उन्हें सीधे ‘भ्रष्ट अगुवे’ या ‘पहरेदार’ कहना
  rationale: मूल पाठ की स्तरित और तीखी कल्पना को बनाए रखने से किसी विशेष संस्था या पद पर संकीर्ण व्याख्या नहीं थोपी जाती।
- issue: בֶּצַע का नैतिक स्वर
  choice: मुख्य पाठ में ‘लाभ’
  alternative: ‘अन्यायपूर्ण लाभ’ या ‘बेईमानी की कमाई’
  rationale: प्रसंग लोभ और भ्रष्टता का संकेत देता है, पर शब्द को मुख्य पाठ में अत्यधिक स्पष्ट करके उसकी संभावित अर्थ-सीमा संकुचित नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। दोहराए गए ‘नहीं जानते’, ‘कुत्ते’, ‘चरवाहे’ और ‘मार्ग’ जैसे मूल बिंब सुरक्षित हैं। ‘अपने-अपने’ सामूहिक कथन के भीतर प्रत्येक व्यक्ति के स्वार्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
