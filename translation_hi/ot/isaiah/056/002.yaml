id: ISA.56.2
reference: Isaiah 56:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַשְׁרֵ֤י אֱנוֹשׁ֙ יַעֲשֶׂה זֹּ֔את וּ/בֶן אָדָ֖ם יַחֲזִ֣יק בָּ֑/הּ שֹׁמֵ֤ר שַׁבָּת֙ מֵֽ/חַלְּל֔/וֹ וְ/שֹׁמֵ֥ר יָד֖/וֹ מֵ/עֲשׂ֥וֹת כָּל רָֽע־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/002.yaml
  text: 'Blessed is the man who does this, and the son of man who holds fast to it: keeping the Sabbath from profaning it, and keeping his hand from doing any evil.'
translation:
  language: hi
  text: धन्य है वह मनुष्य जो ऐसा करता है, और वह मनुष्य जो इसे दृढ़ता से थामे रहता है—जो विश्राम-दिन को अपवित्र करने से बचता है और अपने हाथ को कोई भी बुरा काम करने से रोकता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: धन्य है
  rationale: यह बहुवचन रूप वाला हिब्रू मंगल-वचन है; हिन्दी में स्वाभाविक और पारंपरिक मंगल-वचन के रूप में ‘धन्य है’ उपयुक्त है।
- source_word: אֱנוֹשׁ ... בֶן־אָדָם
  choice: वह मनुष्य ... वह मनुष्य
  rationale: दोनों पद मानवीय व्यक्ति को समानांतर ढंग से व्यक्त करते हैं। ‘मनुष्य का पुत्र’ आधुनिक हिन्दी में यहाँ अनावश्यक मसीही पदवी का आभास दे सकता है, जबकि हिब्रू प्रयोग सामान्य मनुष्य पर बल देता है।
- source_word: יַחֲזִיק בָּהּ
  choice: इसे दृढ़ता से थामे रहता है
  rationale: क्रिया में मजबूती से पकड़े रहने और न छोड़ने का भाव है; स्त्रीलिंग सर्वनाम का संदर्भ पूर्ववर्ती ‘ऐसा/यह’ अर्थात बताए गए आचरण से है।
- source_word: שַׁבָּת
  choice: विश्राम-दिन
  rationale: शब्बात के विशिष्ट धार्मिक दिन को अर्थ-स्पष्ट, गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מֵחַלְּלוֹ
  choice: अपवित्र करने से बचता है
  rationale: חלל का अर्थ पवित्रता भंग करना या अपवित्र करना है; हिब्रू की ‘से’ वाली रोकथाम की रचना को स्वाभाविक हिन्दी में रखा गया है।
- source_word: שֹׁמֵר יָדוֹ
  choice: अपने हाथ को ... रोकता है
  rationale: ‘हाथ की रखवाली करना’ का आशय अपने कर्मों को बुराई से रोकना है; ‘हाथ’ का मूल बिंब भी सुरक्षित रखा गया है।
- source_word: כָּל־רָע
  choice: किसी भी बुरे काम
  rationale: संदर्भ में עשה ‘करना’ के साथ רָע कर्मगत बुराई को दर्शाता है; ‘किसी भी’ निषेध के व्यापक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘इस/ऐसा’ का संदर्भ
  choice: सर्वनाम को खुला रखा गया है
  alternative: इसे केवल न्याय या केवल वाचा-पालन के रूप में स्पष्ट करना
  rationale: हिब्रू זֹּאת और בָּהּ पूर्ववर्ती पद तथा आगे बताए गए आचरण दोनों से जुड़ सकते हैं; अनुवाद इस संबंध को अनावश्यक रूप से सीमित नहीं करता।
- issue: ‘बेन आदाम’ का अर्थ
  choice: सामान्य मानव के अर्थ में ‘मनुष्य’
  alternative: ‘मनुष्य का पुत्र’
  rationale: यहाँ समानांतर काव्य-पंक्ति में सामान्य नश्वर मानव अभिप्रेत है, कोई विशिष्ट मसीही उपाधि नहीं।
- issue: शब्बात-पालन और आशीष का संबंध
  choice: वाक्य को मंगल-वचन और वर्णित आचरण के रूप में रखा गया है
  alternative: इसे उद्धार अर्जित करने की शर्त के रूप में विस्तार देना
  rationale: मूल पाठ आज्ञाकारिता की प्रशंसा करता है, पर इस एक पद में कृपा और कर्म के व्यवस्थित धार्मिक संबंध को परिभाषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण है। काव्यात्मक समानांतरता को ‘वह मनुष्य ... वह मनुष्य’ और डैश के बाद दो समान क्रियात्मक खंडों द्वारा बनाए रखा गया है। किसी पाद-टिप्पणी की आवश्यकता नहीं समझी गई।
