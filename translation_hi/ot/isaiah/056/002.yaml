- from: धन्य है वह मनुष्य जो ऐसा करता है, और वह मनुष्य जो इसे दृढ़ता से थामे रहता है—जो विश्राम-दिन को अपवित्र करने से बचता है और अपने हाथ को किसी भी बुरे काम से रोकता है।
  to: धन्य है वह मनुष्य जो ऐसा करता है, और वह मनुष्य जो इसे दृढ़ता से थामे रहता है—जो विश्राम-दिन को अपवित्र करने से बचता है और अपने हाथ को कोई भी बुरा काम करने से रोकता है।
