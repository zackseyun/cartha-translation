  text: צפו עִוְרִ֤ים כֻּלָּ/ם֙ לֹ֣א יָדָ֔עוּ כֻּלָּ/ם֙ כְּלָבִ֣ים אִלְּמִ֔ים לֹ֥א יוּכְל֖וּ לִ/נְבֹּ֑חַ הֹזִים֙ שֹֽׁכְבִ֔ים אֹהֲבֵ֖י לָ/נֽוּם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/010.yaml
  text: His watchmen are blind[a], all of them; they know nothing. All of them are mute dogs, unable to bark, dreamers, lying down, loving to slumber.
translation:
  language: hi
  text: उसके पहरेदार सब अंधे हैं; वे कुछ नहीं जानते। वे सब गूँगे कुत्ते हैं, जो भौंक नहीं सकते; वे स्वप्न देखते हुए[a] पड़े रहते हैं और ऊँघना पसंद करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘स्वप्न देखते हुए’ के लिए प्रयुक्त इब्रानी शब्द הֹזִים दुर्लभ और प्रसंग की दृष्टि से कठिन है; इसका अर्थ ‘बड़बड़ाते हुए’ भी हो सकता है। मुख्य पाठ में आसपास के निद्रा-संबंधी बिंबों के अनुरूप अर्थ दिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צפו
  choice: उसके पहरेदार
  rationale: यह रूप צפה से पहरा देने वालों की ओर संकेत करता है। संदर्भ और परंपरागत व्याख्या के अनुसार निहित संबंधवाचक अर्थ को ‘उसके’ से व्यक्त किया गया है।
- source_word: עִוְרִים
  choice: अंधे
  rationale: मूल का ठोस बिंब बनाए रखा गया है; संदर्भ में यह अगुवों की आत्मिक या नैतिक दृष्टिहीनता का रूपक है।
- source_word: לֹא יָדָעוּ
  choice: वे कुछ नहीं जानते
  rationale: नकार सहित ידע यहाँ ज्ञान या समझ के अभाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כְּלָבִים אִלְּמִים
  choice: गूँगे कुत्ते
  rationale: तीखे भविष्यद्वाणी-संबंधी रूपक को सीधे बनाए रखता है और उनकी चेतावनी देने की अक्षमता दिखाता है।
- source_word: לֹא יוּכְלוּ לִנְבֹּחַ
  choice: जो भौंक नहीं सकते
  rationale: क्षमता के अभाव और कुत्तों के रूपक, दोनों को स्पष्ट तथा सहज हिन्दी में सुरक्षित रखता है।
- source_word: הֹזִים
  choice: स्वप्न देखते हुए
  rationale: यह दुर्लभ और संदिग्ध शब्द है। सोने, पड़े रहने और ऊँघने के निकटवर्ती बिंबों के कारण ‘स्वप्न देखते हुए’ प्रसंगानुकूल है, पर वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: שֹׁכְבִים
  choice: पड़े रहते हैं
  rationale: शारीरिक निष्क्रियता का बिंब रखता है और हिन्दी में निरंतर आलस्य का स्वाभाविक भाव देता है।
- source_word: אֹהֲבֵי לָנוּם
  choice: ऊँघना पसंद करते हैं
  rationale: נוּם की तंद्रा या झपकी की छाया को ‘ऊँघना’ व्यक्त करता है; ‘पसंद करते हैं’ प्रेमसूचक सहभागी रूप का सहज हिन्दी समतुल्य है।
