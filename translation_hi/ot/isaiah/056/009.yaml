  text: All you beasts of the field[b][a], come to devour— all you beasts of the forest.
translation:
  language: hi
  text: हे खुले मैदान के सब जंगली पशुओ[a], खाने के लिए आओ—हे जंगल के सब जंगली पशुओ!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘खाने’ का अर्थ इस प्रसंग में ‘खा जाने’ या ‘निगल जाने’ का भाव भी दे सकता है। पशुओं को दिया गया यह बुलावा आने वाले न्याय का बिंब जान पड़ता है; कुछ व्याख्याकार इन पशुओं को आक्रमणकारी शत्रुओं का रूपक मानते हैं।
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: כֹּל
  choice: सब
  rationale: यह संबोधित पशुओं की समग्रता बताने वाला परिमाणवाचक शब्द है; सामूहिक संबोधन में ‘सब’ स्वाभाविक है।
- source_word: חַיְתוֹ
  choice: जंगली पशुओ
  rationale: ‘मैदान’ और ‘जंगल’ के साथ यह सामान्य जीवधारियों के बजाय वन्य पशुओं को सूचित करता है; संबोधन के कारण ‘पशुओ’ रूप रखा गया है।
- source_word: שָׂדָי
  choice: मैदान के
  rationale: שׂדה का सामान्य अर्थ खुला मैदान या देहात है; ‘मैदान’ जंगल के साथ मूल विरोध को स्पष्ट रखता है।
- source_word: אֵתָיוּ
  choice: आओ
  rationale: बहुवचन आज्ञार्थक बुलावा है; ‘आओ’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: לֶאֱכֹל
  choice: खाने के लिए
  rationale: यह सामान्य हिब्रू क्रिया ‘खाना’ है। मुख्य पाठ में उसका सीधा अर्थ रखने से ‘निगलने’ जैसी संदर्भगत तीव्रता को अनिवार्य नहीं बनाया जाता।
- source_word: בַּיָּעַר
  choice: जंगल के
  rationale: शाब्दिक रूप से उपसर्ग ‘जंगल में’ है, पर यह ‘जंगल में रहने वाले सब जंगली पशुओ’ का संक्षिप्त संबंधसूचक प्रयोग है; हिन्दी समानांतरता में ‘जंगल के’ स्वाभाविक है।
theological_decisions:
- issue: बुलाए गए पशुओं का भविष्यद्वाणी-संबंधी बिंब
  choice: मुख्य पाठ में वास्तविक जंगली पशुओं का सीधा संबोधन बनाए रखा गया है, जो आने वाले न्याय का बिंब हो सकता है।
  alternative: पशुओं को सीधे आक्रमणकारी शत्रुओं या राष्ट्रों का रूपक मानकर अनुवाद करना।
  rationale: हिब्रू पाठ पशुओं को ही संबोधित करता है। मानवीय आक्रमणकारियों का संकेत संदर्भगत व्याख्या हो सकता है, इसलिए उसे मुख्य पाठ में आरोपित करने के बजाय पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और मौखिक रूप से स्पष्ट हिन्दी। विस्मयादिबोधक संबोधन मूल भविष्यद्वाणी के तीखे बुलावे को बनाए रखता है। ‘जंगली पशु’ सामान्य पाठक के लिए ‘वन-पशु’ से अधिक सहज है।
