base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/007.yaml
  text: I will bring them to my holy mountain[a], and I will make them glad in my house of prayer; their burnt offerings and their sacrifices will be accepted on my altar, for my house will be called a house of prayer for all peoples.
translation:
  language: hi
  text: मैं उन्हें अपने पवित्र पर्वत पर ले आऊँगा और अपने प्रार्थना-भवन में उन्हें आनन्द दूँगा। उनकी होमबलियाँ और उनके बलिदान मेरी वेदी पर स्वीकार किए जाएँगे, क्योंकि मेरा भवन सब जातियों[a] के लिए प्रार्थना का भवन कहलाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सब राष्ट्रों।” इब्रानी शब्द עַמִּים का अर्थ जातियाँ अथवा राष्ट्र हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲבִיאוֹתִים
  choice: मैं उन्हें ... ले आऊँगा
  rationale: हिफ़ील रूप परमेश्वर की प्रेरक और सक्रिय भूमिका व्यक्त करता है; ‘ले आऊँगा’ आधुनिक हिन्दी में स्वाभाविक रूप से इस कारक अर्थ को बनाए रखता है।
- source_word: אֶל הַר קָדְשִׁי
  choice: अपने पवित्र पर्वत पर
  rationale: यह सीधा संबंध-वाचक पद है; ‘पवित्र पर्वत’ सिय्योन और मंदिर-पर्वत की धार्मिक छवि को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: וְשִׂמַּחְתִּים
  choice: उन्हें आनन्दित करूँगा
  rationale: पिएल रूप में परमेश्वर द्वारा आनन्द उत्पन्न करने का भाव है; यह चयन उस कारक अर्थ को संक्षेप और स्वाभाविकता से रखता है।
- source_word: בְּבֵית תְּפִלָּתִי
  choice: अपने प्रार्थना-भवन में
  rationale: यह मंदिर को विशेष रूप से प्रार्थना के स्थान के रूप में प्रस्तुत करता है; ‘उपासना-भवन’ कहना मूल की विशिष्टता को अनावश्यक रूप से व्यापक कर देता।
- source_word: עוֹלֹתֵיהֶם
  choice: उनकी होमबलियाँ
  rationale: עוֹלָה का परंपरागत और सटीक हिन्दी बाइबलीय प्रतिशब्द ‘होमबलि’ है, जो पूर्णतः जलाए जाने वाले बलिदान को सूचित करता है।
- source_word: וְזִבְחֵיהֶם
  choice: और उनके बलिदान
  rationale: זֶבַח एक व्यापक बलिदानी शब्द है; अधिक विशिष्ट ‘होमबलियाँ’ के साथ ‘बलिदान’ उपयुक्त सामान्य प्रतिशब्द है।
- source_word: לְרָצוֹן
  choice: ग्रहण किए जाएँगे
  rationale: बलिदानी संदर्भ में רָצוֹן स्वीकृति अथवा कृपा से ग्रहण किए जाने का भाव देता है; हिन्दी में क्रियात्मक अभिव्यक्ति स्वाभाविक है।
- source_word: עַל מִזְבְּחִי
  choice: मेरी वेदी पर
  rationale: पूर्वसर्ग और संज्ञा का सीधा तथा स्वाभाविक हिन्दी अनुवाद।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या कारण प्रस्तुत करता है; ‘क्योंकि’ उस व्याख्यात्मक संबंध को स्पष्ट रखता है।
- source_word: בֵּיתִי בֵּית תְּפִלָּה
  choice: मेरा भवन ... प्रार्थना का भवन
  rationale: ‘भवन’ की पुनरावृत्ति मूल इब्रानी के बलाघात को बनाए रखती है और औपचारिक घोषणा की गरिमा सुरक्षित रखती है।
- source_word: יִקָּרֵא
  choice: कहलाएगा
  rationale: निफ़ाल रूप का सामान्य कर्मवाच्य अर्थ ‘कहलाना’ है; यह नामकरण और सार्वजनिक पहचान दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְכָל הָעַמִּים
  choice: सब जातियों के लिए
  rationale: עַמִּים विभिन्न जातीय-सामुदायिक समूहों या राष्ट्रों को सूचित कर सकता है। ‘जातियों’ आधुनिक राष्ट्र-राज्यों तक अर्थ को सीमित किए बिना प्रसंग की समावेशी जातीय व्यापकता को बनाए रखता है; לְ को यहाँ प्रयोजन/हित के अर्थ में लिया गया है।
theological_decisions:
- issue: לְכָל הָעַמִּים का दायरा
  choice: सब जातियों के लिए
  alternative: सब राष्ट्रों के लिए
  rationale: निकटवर्ती प्रसंग में परदेशियों को प्रभु की आराधना में सम्मिलित किया गया है। ‘जातियों’ עַמִּים की व्यापक जातीय-सामुदायिक परिधि को सुरक्षित रखता है और पाठ के सार्वभौमिक क्षितिज से आगे कोई सिद्धान्तगत निष्कर्ष नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘होमबलियाँ’ आवश्यक बलिदानी पारिभाषिक शब्द है; शेष पदावली यथासंभव सहज हिन्दी में है। मुख्य पाठ में पादटिप्पणी चिह्न [a] संबंधित शब्द के तुरंत बाद रखा गया है।
