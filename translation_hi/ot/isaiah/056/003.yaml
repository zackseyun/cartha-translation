id: ISA.56.3
reference: Isaiah 56:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַל יֹאמַ֣ר בֶּן הַ/נֵּכָ֗ר הַ/נִּלְוָ֤ה אֶל יְהוָה֙ לֵ/אמֹ֔ר הַבְדֵּ֧ל יַבְדִּילַ֛/נִי יְהוָ֖ה מֵ/עַ֣ל עַמּ֑/וֹ וְ/אַל יֹאמַר֙ הַ/סָּרִ֔יס הֵ֥ן אֲנִ֖י עֵ֥ץ יָבֵֽשׁ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/003.yaml
  text: Let not the foreigner who has joined himself to the LORD say, “The LORD will surely separate me from his people”; and let not the eunuch say, “Look, I am a dry tree.”
translation:
  language: hi
  text: जो परदेशी यहोवा से जुड़ गया है, वह यह न कहे, “यहोवा निश्चय ही मुझे अपनी प्रजा से अलग कर देगा।” और नपुंसक भी यह न कहे, “देखो, मैं तो एक सूखा पेड़ हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן הַנֵּכָר
  choice: परदेशी
  rationale: शाब्दिक रूप से ‘पराए देश का पुत्र’; यहाँ स्वाभाविक हिन्दी में उस विदेशी व्यक्ति का बोध है जो इस्राएल की प्रजा से बाहर जन्मा है।
- source_word: הַנִּלְוָה אֶל־יְהוָה
  choice: यहोवा से जुड़ गया है
  rationale: נלוה का अर्थ स्वयं को जोड़ना या संग लेना है; यहोवा के साथ व्यक्ति के संबंध को सीधे और बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: הַבְדֵּל יַבְדִּילַנִי
  choice: निश्चय ही मुझे ... अलग कर देगा
  rationale: हिब्रू infinitive absolute और finite verb की पुनरुक्ति क्रिया की निश्चितता/तीव्रता पर बल देती है।
- source_word: סָרִיס
  choice: नपुंसक
  rationale: यह प्रचलित और संदर्भानुकूल हिन्दी पद है; मूल में राजकीय अधिकारी का संभावित अर्थ हो सकता है, पर ‘सूखा पेड़’ की संतानहीनता वाली छवि यहाँ शारीरिक अर्थ को प्रमुख बनाती है।
- source_word: הֵן
  choice: देखो
  rationale: वक्ता की पीड़ापूर्ण आत्म-स्थिति की ओर ध्यान खींचने वाले हिब्रू उद्गार का सरल आधुनिक हिन्दी समतुल्य।
- source_word: עֵץ יָבֵשׁ
  choice: सूखा पेड़
  rationale: मूल रूपक को अक्षुण्ण रखता है और निष्फलता तथा वंशहीनता के निहितार्थ को पाठक पर खुला छोड़ता है।
theological_decisions:
- issue: परदेशी का यहोवा और उसकी प्रजा से संबंध
  choice: ‘यहोवा से जुड़ गया है’ और उसके अलग किए जाने की आशंका—दोनों को ज्यों का त्यों रखा गया है।
  alternative: इसे स्पष्ट रूप से धर्म-परिवर्तन या वाचा-सदस्यता की किसी विशिष्ट धार्मिक श्रेणी के रूप में व्याख्यायित करना।
  rationale: पद संबंध की वास्तविकता और समुदाय से बहिष्कार की आशंका के बीच तनाव रखता है; अनुवाद को आगे के पदों से पहले उसका समाधान नहीं करना चाहिए।
- issue: नपुंसक की ‘सूखे पेड़’ वाली आत्म-पहचान
  choice: रूपक को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: ‘मेरी कोई संतान नहीं’ लिखकर रूपक को स्पष्ट कर देना।
  rationale: मूल पाठ रूपकात्मक है और उसमें निष्फलता, वंशहीनता तथा सामाजिक निराशा के कई परस्पर जुड़े अर्थ संभव हैं।
- issue: दिव्य नाम יהוה
  choice: यहोवा
  alternative: प्रभु
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित व्यक्तिगत नाम मूल के विशेष नाम को सामान्य उपाधि से अलग रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; निषेधात्मक वाक्य विन्यास गरिमापूर्ण किंतु सहज रखा गया है। ‘मैं तो’ आत्म-वर्णन की वेदना और बल को स्वाभाविक हिन्दी में व्यक्त करता है।
