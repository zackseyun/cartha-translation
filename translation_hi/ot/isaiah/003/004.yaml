  rationale: The revision changes only ‘अधिकारी’ to ‘शासक’ in order to preserve the source term’s governing authority. The difficult final plural remains rendered with both child imagery and capricious behavior, while the footnote preserves the lexical and interpretive range without deciding whether the description is strictly literal or figurative.
