  text: וְ/נָתַתִּ֥י נְעָרִ֖ים שָׂרֵי/הֶ֑ם וְ/תַעֲלוּלִ֖ים יִמְשְׁלוּ בָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/004.yaml
  text: And I will make youths their princes[a], and capricious children will rule over them.
translation:
  language: hi
  text: और मैं किशोरों को उनके शासक ठहराऊँगा, और मनमौजी बालक[a] उन पर शासन करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बच्चे,” “शिशु,” अथवा “बालसुलभ और मनमौजी लोग”; इब्रानी शब्द कम आयु या अस्थिर, मनमौजी व्यवहार पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: और मैं ... ठहराऊँगा
  rationale: נתן का मूल अर्थ ‘देना’ है, पर यहाँ शासन के संदर्भ में इसका भाव किसी को पद पर नियुक्त या स्थापित करना है; ‘ठहराऊँगा’ इस नियुक्ति-संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נְעָרִים
  choice: किशोरों
  rationale: נְעָרִים युवा पुरुषों या लड़कों का बोध कराता है। ‘किशोरों’ से उनकी कम आयु और अनुभवहीनता सामने आती है, पर अर्थ को केवल छोटे बच्चों तक सीमित नहीं किया जाता।
- source_word: שָׂרֵיהֶם
  choice: उनके अधिकारी
  rationale: שַׂר का अर्थ प्रधान, शासक, राजकुमार या अधिकारी हो सकता है। इस न्याय-घोषणा के प्रशासनिक संदर्भ में ‘अधिकारी’ स्वाभाविक है और किसी वंशानुगत राजपद का अनावश्यक संकेत नहीं देता।
- source_word: וְתַעֲלוּלִים
  choice: और मनमौजी बालक[a]
  rationale: यह दुर्लभ शब्द बालपन, अस्थिर मनमानी या उद्दंड व्यवहार की ओर संकेत कर सकता है। ‘मनमौजी बालक’ आयु की छवि और अविवेकी, अस्थिर आचरण—दोनों को बनाए रखता है; अनिश्चितता पाद-टिप्पणी में स्पष्ट की गई है।
- source_word: יִמְשְׁלוּ בָם
  choice: उन पर शासन करेंगे
  rationale: משל के साथ ב किसी पर शासन करने या अधिकार चलाने का सीधा अर्थ देता है; ‘उन पर शासन करेंगे’ स्पष्ट और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: न्याय के चित्र में शासकों की कम आयु या बालसुलभ अयोग्यता
  choice: पद पर रखे गए शासकों को कम उम्र और मनमौजी व्यवहार की भाषा में प्रस्तुत किया गया है, जिससे शाब्दिक और रूपक—दोनों संभावनाएँ बनी रहती हैं।
  alternative: इसे केवल सचमुच कम आयु वाले शासकों का उल्लेख मानना, अथवा केवल अपरिपक्व और अयोग्य वयस्क शासकों का रूपक मानना।
  rationale: इब्रानी के दोनों पद युवावस्था और बालसुलभ व्यवहार से जुड़े हैं। भविष्यवाणी की न्याय-वाणी दोनों स्तरों पर काम कर सकती है, इसलिए अनुवाद किसी एक व्याख्या को अनिवार्य नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भविष्यवाणी-शैली रखी गई है। ‘अधिकारी’ और ‘शासन’ सामान्य पाठक के लिए स्पष्ट हैं; ‘मनमौजी बालक’ मूल की कठिन और जानबूझकर तनावपूर्ण छवि को सहज भाषा में बनाए रखता है।
