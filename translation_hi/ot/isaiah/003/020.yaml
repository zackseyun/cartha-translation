source:
  edition: WLC
  text: הַ/פְּאֵרִ֤ים וְ/הַ/צְּעָדוֹת֙ וְ/הַ/קִּשֻּׁרִ֔ים וּ/בָתֵּ֥י הַ/נֶּ֖פֶשׁ וְ/הַ/לְּחָשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/020.yaml
  text: the headdresses[a], the ankle chains, the sashes, the perfume boxes[b], and the amulets.
translation:
  language: hi
  text: सिर के आभूषण, पायलें, कमरबंद, इत्र की डिब्बियाँ[a] और ताबीज़[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘प्राण’ या ‘जीवन के घर’; संभवतः इत्र या सुगंधित पदार्थ रखने के छोटे पात्र।
    reason: lexical_alternative
  - marker: b
    text: यह इब्रानी शब्द फुसफुसाने या मंत्र बोलने से संबंधित है; इससे मंत्रों से जुड़े ताबीज़ अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּאֵרִים
  choice: सिर के आभूषण
  rationale: यह बहुवचन संज्ञा सिर पर पहनी जाने वाली सजावटी वस्तुओं या शोभायमान शिरोवस्त्रों को सूचित करती है। ‘सिर के आभूषण’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से किसी खास प्रकार की पगड़ी निर्धारित नहीं करता।
- source_word: הַצְּעָדוֹת
  choice: पायलें
  rationale: यह पद चलने या कदम रखने से जुड़े मूल से बना है और पैरों या टखनों में पहने जाने वाले आभूषणों को सूचित करता है। ‘पायलें’ सामान्य हिन्दी में स्पष्ट है; ठीक-ठीक बनावट—जंजीर या अन्य प्रकार—निश्चित नहीं की गई।
- source_word: הַקִּשֻּׁרִים
  choice: कमरबंद
  rationale: बाँधने वाले मूल से निकला यह शब्द वस्त्र के साथ पहनी जाने वाली बाँधने की सजावटी वस्तुओं को सूचित करता है। ‘कमरबंद’ सूची के परिधान-संदर्भ में स्वाभाविक और गरिमापूर्ण है।
- source_word: בָּתֵּי הַנֶּפֶשׁ
  choice: इत्र की डिब्बियाँ
  rationale: शाब्दिक अर्थ ‘प्राण/जीवन के घर’ है, किंतु आभूषणों की इस सूची में इससे सुगंधित पदार्थ रखने के छोटे पात्र समझे जाते हैं। मुख्य पाठ में संभावित वस्तु स्पष्ट की गई है और शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: הַלְּחָשִׁים
  choice: ताबीज़
  rationale: यह शब्द फुसफुसाने या मंत्रोच्चार से संबंधित है और यहाँ पहनी जाने वाली ऐसी वस्तुओं को सूचित करता है जिन्हें मंत्र या जादुई प्रभाव से जोड़ा जाता था। ‘ताबीज़’ भौतिक वस्तु और उसके मंत्र-संबंधी संकेत दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: הַלְּחָשִׁים का संभावित मंत्र या जादू-संबंधी अर्थ
  choice: मुख्य पाठ में ‘ताबीज़’
  alternative: मंत्र; जादुई ताबीज़
  rationale: पद भौतिक सजावटी वस्तुओं की सूची है, इसलिए मुख्य पाठ में किसी पहनी जाने वाली वस्तु का नाम उपयुक्त है। फिर भी शब्द का मंत्रोच्चार से संबंध पादटिप्पणी में रखा गया है, ताकि संभावित धार्मिक या जादुई अर्थ दब न जाए।
- issue: בָּתֵּי הַנֶּפֶשׁ की दुर्बोध शाब्दिक अभिव्यक्ति
  choice: मुख्य पाठ में ‘इत्र की डिब्बियाँ’
  alternative: प्राण के घर; सुगंध-पात्र
  rationale: मूल अभिव्यक्ति का शाब्दिक अर्थ अस्पष्ट है। संदर्भ के आधार पर संभावित वस्तु मुख्य पाठ में दी गई है, जबकि शाब्दिक रूप पादटिप्पणी में बताकर अनिश्चितता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण सूची-रूप। सामान्य पाठक के लिए परिचित शब्द चुने गए हैं; जहाँ इब्रानी अर्थ अनिश्चित है, वहाँ मुख्य पाठ को सहज रखते हुए पादटिप्पणियों में शाब्दिक अर्थ और वैकल्पिक संकेत सुरक्षित किए गए हैं।
