lexical_decisions:
- source_word: נִצָּב
  choice: अपना स्थान लेकर खड़ा है
  rationale: निफ़अल कृदंत एक दृढ़, तत्पर मुद्रा में खड़े होने का भाव देता है। यह प्रयोग न्यायिक दृश्य की सजीवता बनाए रखता है।
- source_word: לָרִיב
  choice: मुकदमा लड़ने
  rationale: ריב का यहाँ न्यायिक विवाद या वाद चलाने का भाव है। ‘मुकदमा लड़ने’ से कानूनी टकराव स्पष्ट होता है, पर यह निर्धारित नहीं होता कि याहवे अभियोग लगा रहे हैं या किसी पक्ष की पैरवी कर रहे हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी मूल पाठ में परमेश्वर का व्यक्तिगत नाम है; इसलिए इसे किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: וְעֹמֵד
  choice: वह ... खड़ा है
  rationale: कृदंत पहले खंड की खड़े होने वाली न्यायिक मुद्रा को समानांतर रूप में जारी रखता है। हिंदी में सर्वनाम जोड़ने से वाक्य स्वाभाविक और स्पष्ट रहता है।
- source_word: לָדִין
  choice: न्याय करने के लिए
  rationale: इस संदर्भ में דין का सर्वाधिक स्वाभाविक अर्थ न्यायिक निर्णय करना है।
- source_word: עַמִּים
  choice: लोगों
  rationale: हिंदी में ‘लोगों’ स्वाभाविक है और सामूहिक बहुवचन का भाव देता है। पादटिप्पणी इस संभावना को खुला रखती है कि आशय विभिन्न जातियों या राष्ट्रों से हो सकता है।
theological_decisions:
- issue: यְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ के परमेश्वर-वाचक व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक हिंदी में निकट लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- issue: עַמִּים का दायरा
  choice: लोगों
  alternative: जातियों / राष्ट्रों
  rationale: मूल शब्द बहुवचन है और उसका दायरा विभिन्न जनसमूहों या राष्ट्रों तक हो सकता है। मुख्य पाठ इसे अनावश्यक रूप से केवल गैर-इस्राएली राष्ट्रों तक सीमित नहीं करता।
- issue: ריב में याहवे की न्यायिक भूमिका
  choice: मुकदमा लड़ने
  alternative: वाद चलाने / मुकदमा पेश करने
  rationale: मूल क्रिया कानूनी विवाद का संकेत देती है, पर प्रक्रिया में याहवे की भूमिका को अत्यधिक विशिष्ट नहीं करती। चुना हुआ रूप उस न्यायिक तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। अर्धविराम ने इब्रानी समानांतरता को स्पष्ट किया है, जबकि ‘खड़ा है’ की पुनरावृत्ति मूल की न्यायिक मुद्रा और काव्यात्मक संरचना को बनाए रखती है।
