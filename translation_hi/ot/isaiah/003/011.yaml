source:
  edition: WLC
  text: א֖וֹי לְ/רָשָׁ֣ע רָ֑ע כִּֽי גְמ֥וּל יָדָ֖י/ו יֵעָ֥שֶׂה לּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/011.yaml
  text: Woe to the wicked! It will go badly for him[a], for the work of his hands will be done to him.
translation:
  language: hi
  text: दुष्ट पर हाय! उसका बुरा होगा[a], क्योंकि उसके हाथों के किए का प्रतिफल उसी को दिया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “दुष्ट पर हाय! उस पर विपत्ति है, क्योंकि उसके हाथों के किए का प्रतिफल उसी को दिया जाएगा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: א֖וֹי
  choice: हाय
  rationale: यह भविष्यद्वक्ताओं की शोक और न्याय-घोषणा की प्रचलित उक्ति है; ‘हाय’ दोनों भावों को संक्षेप में बनाए रखता है।
- source_word: לְ/רָשָׁ֣ע
  choice: दुष्ट पर
  rationale: לְ यहाँ घोषित विपत्ति के लक्ष्य को सूचित करता है। ‘दुष्ट पर’ प्रतिनिधिक एकवचन को बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: רָ֑ע
  choice: उसका बुरा होगा
  rationale: यहाँ רַע प्रतिकूल परिणाम को व्यक्त करता है। ‘उसका बुरा होगा’ नैतिक बुराई और आने वाली दुर्दशा के बीच मूल की संक्षिप्तता को कुछ हद तक बनाए रखता है।
- source_word: כִּֽי
  choice: क्योंकि
  rationale: यह घोषित विपत्ति का कारण प्रस्तुत करता है।
- source_word: גְמ֥וּל יָדָ֖י/ו
  choice: उसके हाथों का किया
  rationale: גְּמוּל में किए हुए कार्य और उसके अनुरूप प्रतिफल दोनों की छाया हो सकती है। यह अनुवाद हाथों की ठोस छवि और कर्म-प्रतिफल के संबंध को बनाए रखता है।
- source_word: יֵעָ֥שֶׂה לּֽ/וֹ
  choice: उसी के साथ किया जाएगा
  rationale: निफ़अल रूप का निष्क्रिय भाव रखा गया है और उसी मूल क्रिया ‘करना’ की पुनरावृत्ति से माप के अनुसार प्रतिफल का बल सुरक्षित रहता है।
theological_decisions:
- issue: न्याय-वचन में प्रतिनिधिक पुल्लिंग एकवचन
  choice: ‘दुष्ट’ और ‘उसका/उसी’ के द्वारा एकवचन बनाए रखा गया।
  alternative: बहुवचन ‘दुष्टों/उनके’
  rationale: इब्रानी व्याकरणिक रूप से एकवचन है और एक प्रतिनिधिक व्यक्ति के रूप में दुष्ट की बात करता है; इसे अनावश्यक रूप से बहुवचन नहीं बनाया गया।
- issue: प्रतिफलात्मक न्याय की अभिव्यक्ति
  choice: ‘उसके हाथों का किया उसी के साथ किया जाएगा’
  alternative: ‘उसे उसके कामों का बदला मिलेगा’
  rationale: चुना हुआ रूप किसी तकनीकी धर्मवैज्ञानिक शब्दावली को जोड़े बिना कर्म के अनुरूप लौटने वाले न्याय और עשה की क्रियात्मक प्रतिध्वनि को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘हाय’ भविष्यद्वक्ताओं की न्याय-घोषणा का स्वर रखता है; मुख्य पाठ मुहावरेदार है, जबकि पादटिप्पणी רַע और גְּמוּל की अधिक औपचारिक सम्भावना दिखाती है।
