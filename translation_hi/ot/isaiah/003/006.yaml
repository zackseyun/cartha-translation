base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/006.yaml
  text: 'For a man will seize his brother in his father''s house: “You have a cloak[a]; you shall be our leader[b], and this ruin shall be under your hand.”'
translation:
  language: hi
  text: क्योंकि कोई पुरुष अपने पिता के घर में अपने भाई को पकड़कर कहेगा, “तेरे पास एक चोगा है; तू हमारा अगुवा बन, और यह विनाश[a] तेरे हाथ के अधीन[b] हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह पतन”; अधिक शाब्दिक रूप से, “यह ठोकर का कारण।”
    reason: lexical_alternative
  - marker: b
    text: “हाथ के अधीन” एक इब्रानी मुहावरा है, जिसका अर्थ है किसी के अधिकार या जिम्मेदारी में होना।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले प्रसंग में वर्णित सामाजिक अव्यवस्था का कारण या उदाहरण प्रस्तुत करता है; ‘क्योंकि’ उसके व्याख्यात्मक संबंध को बनाए रखता है।
- source_word: יִתְפֹּשׂ
  choice: पकड़कर
  rationale: क्रिया किसी को दृढ़ता से पकड़ लेने का भाव देती है और नेतृत्व स्वीकार कराने के सामाजिक दबाव को व्यक्त करती है।
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: इब्रानी संज्ञा पुल्लिंग एकवचन है और इस उदाहरण में एक पुरुष व्यक्ति का संकेत करती है।
- source_word: בְּאָחִיו
  choice: अपने भाई को
  rationale: אָח का सामान्य अर्थ ‘भाई’ है; साथ आया पैतृक घराने का उल्लेख निकट पारिवारिक संबंध का समर्थन करता है।
- source_word: בֵּית אָבִיו
  choice: अपने पिता के घराने में
  rationale: ‘घराने’ से केवल भवन नहीं, बल्कि पिता से जुड़ा परिवार या पैतृक गृह भी स्वाभाविक रूप से व्यक्त होता है; ‘में’ मूल के स्थान-सूचक रूप को बनाए रखता है।
- source_word: שִׂמְלָה
  choice: चोगा
  rationale: यह शब्द सामान्यतः ऊपर पहने जाने वाले वस्त्र को दर्शाता है; ‘चोगा’ उस विशिष्ट और सम्मानजनक बाहरी वस्त्र का भाव देता है जिसके होने को नेतृत्व की योग्यता माना जा रहा है।
- source_word: לְכָה
  choice: तेरे पास
  rationale: यहाँ संबंधसूचक रूप स्वामित्व व्यक्त करता है; आधुनिक हिन्दी में ‘तेरे पास चोगा है’ इसका स्वाभाविक रूप है।
- source_word: קָצִין
  choice: अगुवा
  rationale: यह अधिकार रखने वाले प्रधान या शासक को दर्शाता है; ‘अगुवा’ सैन्य अर्थ थोपे बिना नेतृत्व का भाव व्यक्त करता है।
- source_word: תִּהְיֶה לָּנוּ
  choice: तू हमारा अगुवा बन
  rationale: अपूर्ण क्रिया यहाँ आग्रह अथवा नियुक्ति जैसी बलवती इच्छा व्यक्त करती है; हिन्दी में ‘बन’ उस भाव को स्वाभाविक रूप से रखता है।
- source_word: הַמַּכְשֵׁלָה
  choice: यह उजाड़
  rationale: शब्द का मूल भाव ठोकर या गिरने का कारण है, पर इस प्रसंग में वह ध्वस्त सामाजिक दशा को दर्शाता है; ‘उजाड़’ उस व्यापक दुर्दशा को संक्षेप में व्यक्त करता है और विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: תַּחַת יָדֶךָ
  choice: तेरे हाथ के अधीन
  rationale: मूल इब्रानी बिंब को बनाए रखते हुए यह अधिकार और जिम्मेदारी—दोनों अर्थों की गुंजाइश रखता है।
