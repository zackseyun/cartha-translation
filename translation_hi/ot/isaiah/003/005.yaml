  yaml_path: translation/ot/isaiah/003/005.yaml
  text: And the people will oppress one another—man against man[a], and each against his neighbor; the youth will act arrogantly toward the elder[c][b], and the despised toward the honored.
translation:
  language: hi
  text: लोग एक-दूसरे पर अत्याचार करेंगे—एक व्यक्ति दूसरे पर और हर एक अपने पड़ोसी पर[a]। जवान बुज़ुर्ग[b] के प्रति, और तुच्छ समझा जानेवाला व्यक्ति आदरणीय व्यक्ति के प्रति ढिठाई करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “एक मनुष्य मनुष्य पर और मनुष्य अपने पड़ोसी पर।” इब्रानी में दोहराई गई अभिव्यक्ति व्यापक पारस्परिक शत्रुता पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: “बुज़ुर्ग” का अर्थ “वृद्ध व्यक्ति” या सामाजिक वरिष्ठता रखनेवाला “वरिष्ठ व्यक्ति” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִגַּשׂ
  choice: अत्याचार करेंगे
  rationale: निफ़अल रूप यहाँ केवल पास आने का नहीं, बल्कि समाज में एक-दूसरे को दबाने और सताने का भाव व्यक्त करता है।
- source_word: אִישׁ בְּאִישׁ וְאִישׁ בְּרֵעֵהוּ
  choice: एक व्यक्ति दूसरे पर और हर एक अपने पड़ोसी पर
  rationale: यह अनुवाद इब्रानी की दोनों वितरणात्मक समानांतर अभिव्यक्तियों और व्यापक पारस्परिक वैर के बल को बनाए रखता है।
- source_word: יִרְהֲבוּ
  choice: ढिठाई करेंगे
  rationale: यह क्रिया घमंडपूर्ण, उद्दंड और सामाजिक मर्यादा तोड़नेवाले व्यवहार को दर्शाती है; आधुनिक हिन्दी में ‘ढिठाई करना’ इसे सहज रूप से व्यक्त करता है।
- source_word: הַנַּעַר
  choice: जवान
  rationale: संदर्भ में इसका विरोध बुज़ुर्ग से है, इसलिए किसी विशेष बालक के बजाय आयु-वर्ग का संकेत देनेवाला ‘जवान’ उपयुक्त है।
- source_word: בַּזָּקֵן
  choice: बुज़ुर्ग के सामने
  rationale: ‘बुज़ुर्ग’ आयु और सामाजिक वरिष्ठता, दोनों संभावित अर्थों को समेटता है। ‘के सामने’ उद्दंड टकराव का स्वाभाविक हिन्दी प्रयोग है।
- source_word: הַנִּקְלֶה
  choice: तुच्छ समझा जानेवाला व्यक्ति
  rationale: यह निष्क्रिय भाव से उस व्यक्ति को सूचित करता है जिसे समाज में कम मान दिया जाता है; यह उसके अंतर्निहित मूल्य पर निर्णय नहीं करता।
- source_word: בַּנִּכְבָּד
  choice: आदरणीय व्यक्ति के सामने
  rationale: यह सामाजिक रूप से सम्मानित या प्रतिष्ठित व्यक्ति के अर्थ को स्पष्ट रखता है और נִקְלֶה के साथ विरोध को उभारता है।
