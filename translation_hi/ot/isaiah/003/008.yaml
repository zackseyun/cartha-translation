base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/008.yaml
  text: For Jerusalem has stumbled[a], and Judah has fallen, because their tongue and their deeds are against Yahweh, rebelling before the eyes of his glory.
translation:
  language: hi
  text: 'क्योंकि यरूशलेम ठोकर खा चुका है,

    और यहूदा गिर चुका है;

    क्योंकि उनकी जीभ और उनके काम याहवे के विरुद्ध हैं,

    और उसकी महिमा की आँखों के सामने वे विद्रोह करते हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी महिमा की दृष्टि में।” हिब्रू में शाब्दिक अभिव्यक्ति “उसकी महिमा की आँखें” है, जो याहवे की महिमामय उपस्थिति के सामने खुले विद्रोह का सजीव चित्र प्रस्तुत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: पहला כִּי पिछले कथन का कारण बताता है और दूसरा पतन का कारण स्पष्ट करता है; हिन्दी में ‘क्योंकि’ दोनों संबंधों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָשְׁלָה
  choice: ठोकर खा चुका है
  rationale: यह क्रिया लड़खड़ाने या ठोकर खाने का रूपक रखती है; इसे पूर्ण विनाश के अर्थ में बढ़ाकर नहीं कहा गया।
- source_word: וִיהוּדָה נָפָל
  choice: और यहूदा गिर चुका है
  rationale: ‘गिर चुका है’ मूल क्रिया נפל का सीधा अर्थ देता है और यरूशलेम के ठोकर खाने के साथ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: לְשׁוֹנָם
  choice: उनकी जीभ
  rationale: यहाँ ‘जीभ’ वाणी के लिए लक्षणा है। ठोस हिब्रू बिंब को बनाए रखने के लिए ‘बातों’ के बजाय ‘जीभ’ रखा गया है।
- source_word: וּמַעַלְלֵיהֶם
  choice: और उनके काम
  rationale: מעללים आचरण या किए गए कार्यों को सूचित करता है; ‘काम’ आधुनिक हिन्दी में स्पष्ट और नैतिक संदर्भ के अनुकूल है।
- source_word: אֶל יְהוָה
  choice: याहवे के विरुद्ध
  rationale: विद्रोह के संदर्भ में אֶל विरोध की दिशा व्यक्त करता है; ‘के विरुद्ध’ इस अर्थ को स्पष्ट करता है।
- source_word: לַמְרוֹת
  choice: विद्रोह करते हैं
  rationale: מרה उद्दंड अवज्ञा या विद्रोह का भाव देता है। हिन्दी में सक्रिय क्रिया से जारी विरोध स्पष्ट होता है, बिना उसे केवल मानसिक भाव बना देने के।
- source_word: עֵנֵי כְבוֹדוֹ
  choice: उसकी महिमा की आँखों के सामने
  rationale: मूल का असामान्य और सजीव पदबंध ‘उसकी महिमा की आँखें’ यथासंभव सुरक्षित रखा गया है; यह खुले रूप से परमेश्वर की महिमामय उपस्थिति के सामने किए गए विद्रोह को दर्शाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: עֵנֵי כְבוֹדוֹ में मानवीय बिंब
  choice: उसकी महिमा की आँखों के सामने
  alternative: उसकी महिमामय उपस्थिति में
  rationale: सुगम विकल्प अर्थ स्पष्ट करता, पर मूल की जानबूझकर सजीव और कुछ असामान्य अभिव्यक्ति को समतल कर देता। मुख्य पाठ में बिंब रखा गया और फुटनोट में सहज विकल्प दिया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। पंक्ति-विन्यास मूल की काव्यात्मक समानांतरता दिखाता है। ‘जीभ’ और ‘महिमा की आँखें’ जैसे मूल बिंब जानबूझकर सुरक्षित रखे गए हैं; कठिन अंतिम अभिव्यक्ति के लिए फुटनोट दिया गया है।
