  text: עַמִּ/י֙ נֹגְשָׂ֣י/ו מְעוֹלֵ֔ל וְ/נָשִׁ֖ים מָ֣שְׁלוּ ב֑/וֹ עַמִּ/י֙ מְאַשְּׁרֶ֣י/ךָ מַתְעִ֔ים וְ/דֶ֥רֶךְ אֹֽרְחֹתֶ֖י/ךָ בִּלֵּֽעוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/012.yaml
  text: My people—his oppressors are children[a], and women rule over him. My people[b], your guides lead you astray and swallow up the course of your paths.
translation:
  language: hi
  text: हे मेरी प्रजा—उसके अत्याचारी बच्चे हैं, और स्त्रियाँ उस पर शासन करती हैं। हे मेरी प्रजा, तुम्हारे मार्गदर्शक[a] तुम्हें भटका रहे हैं; वे तुम्हारी राहों की दिशा को निगल गए हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हें धन्य कहनेवाले।” इब्रानी रूप का यह अर्थ भी हो सकता है, पर प्रसंग में संभवतः ऐसे अगुओं या मार्गदर्शकों की बात है जो प्रजा को गलत दिशा में ले जाते हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी का शाब्दिक भाव है, “तुम्हारी राहों का मार्ग उन्होंने निगल लिया है”—यह प्रजा की सही दिशा मिटा देने का सजीव रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגְשָׂיו
  choice: उसके अत्याचारी
  rationale: נגשׂ कठोरता से दबाने, हाँकने या वसूली करने वालों को सूचित करता है। ‘अत्याचारी’ सामाजिक-राजनीतिक निंदा को स्वाभाविक हिन्दी में व्यक्त करता है; एकवचन प्रत्यय को सामूहिक संज्ञा ‘प्रजा’ के अनुरूप ‘उसके’ से रखा गया है।
- source_word: מְעוֹלֵל
  choice: बच्चे हैं
  rationale: रूप और वाक्य-विन्यास कठिन हैं, पर प्रसंग में अत्याचारियों को बच्चों के रूप में चित्रित करना सबसे संभावित है। यह अयोग्य और अपरिपक्व शासन की छवि को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: וְנָשִׁים מָשְׁלוּ בוֹ
  choice: और स्त्रियाँ उस पर शासन करती हैं
  rationale: यह נָשִׁים और משל ב का सीधा अनुवाद है। ‘उस पर’ सामूहिक एकवचन ‘मेरी प्रजा’ की ओर संकेत करता है।
- source_word: מְאַשְּׁרֶיךָ
  choice: तुम्हारे मार्गदर्शक
  rationale: यद्यपि אשר का पिएल रूप ‘धन्य कहना’ भी हो सकता है, ‘भटकाते हैं’ के साथ समानांतरता यहाँ निर्देशन करने वालों का अर्थ प्रबल करती है। वास्तविक वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: מַתְעִים
  choice: तुम्हें भटका रहे हैं
  rationale: תעה के कारक अर्थ ‘भटकाना’ को सहज हिन्दी में व्यक्त करता है और गलत दिशा में ले जाने की रूपक-छवि बनाए रखता है।
- source_word: דֶרֶךְ אֹרְחֹתֶיךָ
  choice: तुम्हारी राहों की दिशा
  rationale: इब्रानी में ‘मार्ग’ और ‘राहों’ के दोहरे प्रयोग को अत्यधिक कृत्रिम बनाए बिना ‘राहों की दिशा’ से व्यक्त किया गया है।
- source_word: בִּלֵּעוּ
  choice: निगल गए हैं
  rationale: בלע का जीवंत मूल अर्थ ‘निगलना/ग्रस लेना’ है। यहाँ यह प्रजा की सही दिशा मिटा देने का रूपक है; ‘नष्ट कर दिया’ की अपेक्षा ‘निगल गए हैं’ मूल छवि को बचाता है।
theological_decisions:
- issue: स्त्रियों के शासन का संभावित अपमानसूचक उल्लेख
  choice: ‘स्त्रियाँ उस पर शासन करती हैं’ को मूल पाठ के अनुसार बनाए रखा गया है, बिना इसे सामान्य रूप से स्त्रियों के विषय में सिद्धान्त बनाने के।
  alternative: इसे ‘निर्बल लोग उस पर शासन करते हैं’ कहना, या पाठ-संशोधन के आधार पर ‘लेनदार उस पर शासन करते हैं’ समझना।
  rationale: मसोरा-पाठ स्पष्ट रूप से ‘स्त्रियाँ’ कहता है। यशायाह के तत्कालीन न्याय और सामाजिक अव्यवस्था के आलंकारिक संदर्भ से आगे कोई सार्वभौमिक दावा जोड़ना उचित नहीं है।
- issue: ‘प्रजा’ के साथ इब्रानी सामूहिक एकवचन
  choice: पहले वाक्य में ‘उसके/उस पर’ रखकर सामूहिक एकवचन को दर्शाया गया है।
  alternative: स्वाभाविक हिन्दी के लिए ‘उनके/उन पर’ बहुवचन का प्रयोग।
  rationale: इब्रानी में עַם के लिए 3 पुल्लिंग एकवचन प्रत्यय हैं। हिन्दी में ‘प्रजा’ व्याकरणतः स्त्रीलिंग है, फिर भी ‘उसके/उस पर’ सामूहिक एकवचन संबंध को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘हे मेरी प्रजा’ भविष्यद्वाणी के प्रत्यक्ष संबोधन को स्पष्ट करता है। रूपक को समझाने के बजाय मुख्य पाठ में सुरक्षित रखा गया है; वास्तविक शाब्दिक विकल्प पादटिप्पणियों में दिए गए हैं।
