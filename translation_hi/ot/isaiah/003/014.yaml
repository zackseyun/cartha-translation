source:
  edition: WLC
  text: יְהוָה֙ בְּ/מִשְׁפָּ֣ט יָב֔וֹא עִם זִקְנֵ֥י עַמּ֖/וֹ וְ/שָׂרָ֑י/ו וְ/אַתֶּם֙ בִּֽעַרְתֶּ֣ם הַ/כֶּ֔רֶם גְּזֵלַ֥ת הֶֽ/עָנִ֖י בְּ/בָתֵּי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/014.yaml
  text: 'Yahweh enters into judgment with the elders of his people and its princes: “It is you who have devoured the vineyard[d][c][b][a]; the plunder of the poor is in your houses.”'
translation:
  language: hi
  text: 'याहवे अपनी प्रजा के बुज़ुर्गों और उसके हाकिमों के साथ न्याय करने आएगा[a]: “तुम ही ने दाख की बारी को उजाड़ डाला है[b][c]; गरीब से लूटा हुआ माल तुम्हारे घरों में है[d]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्याय में आएगा” अथवा “न्याय के लिए आएगा।”
    reason: lexical_alternative
  - marker: b
    text: “उजाड़ डाला है” का अनुवाद “खा डाला है,” “चरा डाला है” या “भस्म कर डाला है” भी हो सकता है; इब्रानी क्रिया विनाशकारी रूप से समाप्त कर देने का भाव रखती है।
    reason: lexical_alternative
  - marker: c
    text: “दाख की बारी” संभवतः प्रजा या समुदाय का रूपक है; तुलना करें यशायाह 5:1–7।
    reason: cross_reference
  - marker: d
    text: शाब्दिक रूप से “गरीब की लूट”; अर्थात गरीब से छीनी या चुराई गई वस्तुएँ।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: בְּמִשְׁפָּט יָבוֹא
  choice: न्याय करने आएगा
  rationale: यह स्वाभाविक हिन्दी में न्यायिक कार्यवाही के लिए आने का भाव व्यक्त करता है; इब्रानी अपूर्ण क्रिया का भावी बल भी बना रहता है।
- source_word: עִם
  choice: के साथ
  rationale: इब्रानी पूर्वसर्ग का सीधा अर्थ रखा गया है; प्रसंग इसे विरोधात्मक न्यायिक मुठभेड़ बनाता है, पर मुख्य पाठ में ‘के विरुद्ध’ जोड़कर अर्थ को अधिक निश्चित नहीं किया गया।
- source_word: זִקְנֵי עַמּוֹ
  choice: अपनी प्रजा के पुरनियों
  rationale: ‘पुरनिये’ यहाँ केवल वृद्ध पुरुष नहीं, बल्कि समुदाय के मान्य अगुवे हैं; यह पद हिन्दी बाइबलीय भाषा में परिचित और गरिमापूर्ण है।
- source_word: וְשָׂרָיו
  choice: और उसके हाकिमों
  rationale: ‘हाकिम’ शासकीय अगुवों का अर्थ सामान्य आधुनिक पाठक के लिए स्पष्ट रखता है और ‘राजकुमारों’ की संभावित वंशगत धारणा से बचता है।
- source_word: וְאַתֶּם
  choice: तुम ही ने
  rationale: स्वतंत्र सर्वनाम का आरोपात्मक जोर ‘ही’ से व्यक्त किया गया है।
- source_word: בִּעַרְתֶּם
  choice: उजाड़ डाली है
  rationale: क्रिया के विनाशकारी उपभोग—खा जाने, चरा डालने अथवा भस्म करने—के व्यापक भाव को दाख की बारी के प्रसंग में स्वाभाविक हिन्दी से व्यक्त किया गया है।
- source_word: הַכֶּרֶם
  choice: दाख की बारी
  rationale: मूल कृषि-रूपक को बिना व्याख्यात्मक रूप से ‘प्रजा’ में बदल दिए सुरक्षित रखा गया है।
- source_word: גְּזֵלַת הֶעָנִי
  choice: गरीब से लूटा हुआ माल
  rationale: यह उस वस्तु या संपत्ति को स्पष्ट रूप से व्यक्त करता है जिसे असहाय व्यक्ति से अन्यायपूर्वक छीन लिया गया है।
- source_word: בְּבָתֵּיכֶם
  choice: तुम्हारे घरों में है
  rationale: इब्रानी बहुवचन और अन्याय से प्राप्त माल को अगुवों के निवासों में पाए जाने के आरोप, दोनों को बनाए रखा गया है।
theological_decisions:
- issue: ‘दाख की बारी’ का रूपकात्मक अर्थ
  choice: मुख्य पाठ में ‘दाख की बारी’ को रूपक के रूप में बनाए रखना
  alternative: इसे व्याख्यात्मक रूप से ‘मेरी प्रजा’ या ‘समुदाय’ कहना
  rationale: यशायाह की व्यापक दाख की बारी संबंधी कल्पना यहाँ सुनाई देती है, पर मूल पद स्वयं रूपक का अर्थ स्पष्ट नहीं करता; इसलिए अनुवाद उसे मौन रूप से निश्चित नहीं करता।
- issue: न्यायिक प्रसंग में עִם का संबंध
  choice: ‘के साथ’
  alternative: ‘के विरुद्ध’
  rationale: आरोप से विरोध का भाव स्पष्ट है, फिर भी मूल पूर्वसर्ग सामान्यतः ‘साथ’ है; यही चुनाव वास्तविक भाषिक तनाव को सुरक्षित रखता है।
- issue: וְשָׂרָיו में प्रत्यय का संदर्भ
  choice: ‘उसके हाकिमों’ द्वारा संदर्भ को उतना ही खुला रखना जितना हिन्दी में संभव है
  alternative: ‘प्रजा के हाकिमों’ या ‘याहवे के हाकिमों’ द्वारा संदर्भ स्पष्ट कर देना
  rationale: इब्रानी पुल्लिंग एकवचन प्रत्यय का संदर्भ परमेश्वर अथवा सामूहिक ‘प्रजा’ से जोड़ा जा सकता है; प्रसंग इन्हें प्रजा के अगुवे बताता है, पर अनुवाद अनावश्यक रूप से संबंध को अधिक संकीर्ण नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पुरनियों’ और ‘हाकिमों’ से सामाजिक नेतृत्व का भाव आता है; आरोप की तीव्रता ‘तुम ही ने’ और ‘लूटा हुआ माल’ से बनी रहती है।
