source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה יַ֚עַן כִּ֤י גָֽבְהוּ֙ בְּנ֣וֹת צִיּ֔וֹן וַ/תֵּלַ֨כְנָה֙ נטוות גָּר֔וֹן וּֽ/מְשַׂקְּר֖וֹת עֵינָ֑יִם הָל֤וֹךְ וְ/טָפֹף֙ תֵּלַ֔כְנָה וּ/בְ/רַגְלֵי/הֶ֖ם תְּעַכַּֽסְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/016.yaml
  text: 'And Yahweh said: Because the daughters of Zion are haughty[a], and walk with outstretched necks, glancing with their eyes, walking and mincing as they go, and making a jingling with their feet[b],'
translation:
  language: hi
  text: 'और याहवे ने कहा: “क्योंकि सिय्योन की बेटियाँ घमंडी हो गई हैं, वे गर्दन ताने चलती हैं, आँखों से इशारे करती हैं[a], छोटे-छोटे कदम रखकर इठलाती हुई चलती हैं और अपने पैरों से छनछनाहट करती हैं[b]—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आँखें मटकाती हैं’ अथवा ‘लुभाने वाली नज़रें डालती हैं।’ इब्रानी अभिव्यक्ति दुर्लभ है और आँखों की चंचल, लुभावनी या छलपूर्ण चेष्टा की ओर संकेत कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपने पैरों से पायलों को छनकाती हैं।’ इब्रानी क्रिया संभवतः पैरों के आभूषणों से उत्पन्न छनछनाहट बताती है, हालाँकि इस पद में ‘पायल’ का स्पष्ट उल्लेख नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय उसके प्रचलित लिप्यंतरण द्वारा व्यक्त किया गया है।
- source_word: יַעַן כִּי
  choice: क्योंकि … इसलिए—
  rationale: यह कारण बताने वाला पदबंध है, जिसका परिणाम अगले पद में आता है। हिंदी में ‘क्योंकि … इसलिए’ संबंध को स्पष्ट करता है, और दीर्घ विराम बताता है कि वाक्य अगले पद में पूरा होगा।
- source_word: גָבְהוּ
  choice: घमंडी हो गई हैं
  rationale: मूल क्रिया का शाब्दिक भाव ‘ऊँचा होना’ है, पर यहाँ वह अहंकारी मनोभाव और व्यवहार को दर्शाती है।
- source_word: בְּנוֹת צִיּוֹן
  choice: सिय्योन की बेटियाँ
  rationale: मूल के वाचिक और वाचागत रूपक को बनाए रखा गया है; इसे केवल ‘यरूशलेम की स्त्रियाँ’ बनाकर सपाट नहीं किया गया।
- source_word: נטוות גָּרוֹן
  choice: गर्दन ताने
  rationale: यह स्वाभाविक हिंदी में उस बनावटी, घमंडी मुद्रा को व्यक्त करता है जिसमें गर्दन खींची या ऊँची रखी जाती है।
- source_word: מְשַׂקְּרוֹת עֵינָיִם
  choice: आँखों से इशारे करती हैं
  rationale: यह दुर्लभ और अनिश्चित अभिव्यक्ति आँखों की जानबूझकर की गई चेष्टा बताती है। मुख्य पाठ में अपेक्षाकृत तटस्थ भाषा रखी गई है और संभावित लुभावने अर्थ को पादटिप्पणी में दिया गया है।
- source_word: הָלוֹךְ וְטָפֹף תֵּלַכְנָה
  choice: छोटे-छोटे कदम रखकर इठलाती हुई चलती हैं
  rationale: यह अनुवाद बार-बार छोटे कदम रखने और बनावटी चाल, दोनों को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: וּבְרַגְלֵיהֶם תְּעַכַּסְנָה
  choice: अपने पैरों से छनछनाहट करती हैं
  rationale: क्रिया संभवतः पैरों के आभूषणों से उत्पन्न झंकार बताती है, पर इस पद में पायल या नूपुर का उल्लेख स्पष्टतः नहीं है; इसलिए मुख्य पाठ में केवल ध्वनि रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से प्रतिस्थापित न करके लिप्यंतरित किया गया है। ‘याहवे’ मूल नाम के व्यापक रूप से स्वीकृत उच्चारण को दर्शाता है।
- issue: न्याय की भूमिका वाले अधूरे कारण-वाक्य को प्रस्तुत करना
  choice: ‘क्योंकि … इसलिए—’ के साथ अगले पद की ओर खुला रखना
  alternative: इस पद को स्वतंत्र पूर्ण वाक्य बनाना
  rationale: इब्रानी वाक्य में दंड का परिणाम अगले पद में आता है। इसे इसी पद में पूरा कर देना मूल की वाक्यगत संरचना और तनाव को बदल देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘गर्दन ताने’, ‘छोटे-छोटे कदम’ और ‘छनछनाहट’ मूल की दृश्य एवं श्रव्य छवियाँ बचाते हैं। पद के अंत का दीर्घ विराम अगले पद में आने वाले न्याय-वचन से इसकी व्याकरणिक कड़ी दिखाता है।
