  text: the captain of fifty[a], and the man of rank, and the counselor, and the skillful craftsman, and the expert enchanter.
translation:
  language: hi
  text: पचास सैनिकों का अधिकारी, प्रतिष्ठित व्यक्ति, सलाहकार, कुशल कारीगर और मंत्र फूँकने में निपुण व्यक्ति[a] को भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘फुसफुसाकर मंत्र पढ़ने का जानकार।’ इब्रानी पद का शाब्दिक आशय फुसफुसाने या मंत्रोच्चार में समझदार अथवा निपुण व्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר חֲמִשִּׁים
  choice: पचास सैनिकों के अधिकारी
  rationale: שַׂר किसी प्रधान या अधिकारी को और חֲמִשִּׁים पचास की इकाई को दर्शाता है। प्रसंग में यह पचास सैनिकों पर नियुक्त अधिकारी का पद है; हिन्दी में यह अर्थ स्वाभाविक और स्पष्ट है।
- source_word: נְשׂוּא פָנִים
  choice: प्रतिष्ठित व्यक्ति
  rationale: शाब्दिक भाव ‘जिसका मुख ऊँचा उठाया गया’ है; यह सम्मानित या ऊँची सामाजिक हैसियत वाले व्यक्ति के लिए मुहावरा है।
- source_word: יוֹעֵץ
  choice: सलाहकार
  rationale: यह सलाह देने वाले व्यक्ति को दर्शाता है; ‘सलाहकार’ आधुनिक हिन्दी में सीधा और स्वाभाविक पदनाम है।
- source_word: חֲכַם חֲרָשִׁים
  choice: कुशल कारीगर
  rationale: חֲכַם यहाँ व्यावहारिक निपुणता और חֲרָשִׁים कारीगरों/शिल्पियों को सूचित करता है। ‘कुशल कारीगर’ तकनीकी दक्षता को संक्षेप में व्यक्त करता है।
- source_word: נְבוֹן לָחַשׁ
  choice: मंत्र फूँकने में निपुण व्यक्ति
  rationale: נְבוֹן समझ और विशेषज्ञता को तथा לָחַשׁ धीमे स्वर में बोले जाने वाले मंत्र या जादुई उच्चारण को दर्शा सकता है। यह चयन अस्पष्ट प्रथा को सामान्य सलाह या वक्तृत्व में बदलने के बजाय उसके अनुष्ठानिक-जादुई आशय को बनाए रखता है।
theological_decisions:
- issue: जादुई या मंत्र-संबंधी प्रथा के पद का अनुवाद
  choice: मंत्र फूँकने में निपुण व्यक्ति
  alternative: फुसफुसाकर मंत्र पढ़ने का जानकार
  rationale: मूल पाठ संभवतः धीमे स्वर में मंत्र या टोना करने में दक्ष व्यक्ति की बात करता है। अनुवाद उस प्रथा को न तो स्वीकृति देता है, न उसकी निंदा का कोई अतिरिक्त भाव जोड़ता है; वह सूची के भीतर उसके साधारण उल्लेख को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज सूची-शैली रखी गई है। पदों को अनावश्यक रूप से संस्कृतनिष्ठ नहीं बनाया गया। पद्य पिछले वाक्य से जुड़ी सूची का अंश है, इसलिए अन्त में ‘को भी’ रखा गया है। उपलब्ध अंग्रेज़ी पाठ में [a] का स्थान पहले पद के बाद था, पर उसकी टिप्पणी נְבוֹן לָחַשׁ से संबंधित है; स्रोत-संगति के लिए चिह्न संबंधित अंतिम पद पर लगाया गया है।
