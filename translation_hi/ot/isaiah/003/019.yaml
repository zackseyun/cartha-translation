  rationale: यह संज्ञा संभवतः लटकने वाले या बूँद के आकार के आभूषण को दर्शाती है। सामान्य हिन्दी में ‘लटकते आभूषण’ अर्थ को स्पष्ट रखता है, पर इसे अनावश्यक रूप से कान की बाली तक सीमित नहीं करता।
- source_word: הַשֵּׁירוֹת
