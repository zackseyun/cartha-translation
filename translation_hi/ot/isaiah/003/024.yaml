source:
  edition: WLC
  text: וְ/הָיָה֩ תַ֨חַת בֹּ֜שֶׂם מַ֣ק יִֽהְיֶ֗ה וְ/תַ֨חַת חֲגוֹרָ֤ה נִקְפָּה֙ וְ/תַ֨חַת מַעֲשֶׂ֤ה מִקְשֶׁה֙ קָרְחָ֔ה וְ/תַ֥חַת פְּתִיגִ֖יל מַחֲגֹ֣רֶת שָׂ֑ק כִּי תַ֖חַת יֹֽפִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/024.yaml
  text: 'And it shall be: instead of perfume[a], rottenness; and instead of a belt, a rope; and instead of well-set hair, baldness; and instead of a rich robe, a girding of sackcloth[c][b]; branding instead of beauty.'
translation:
  language: hi
  text: 'और ऐसा होगा: इत्र के बदले सड़न, कमरबंद के बदले रस्सी[a], सँवारे हुए बालों[b] के बदले गंजापन, और कीमती वस्त्र के बदले टाट का कमरबंद; सुंदरता के बदले दागे जाने का निशान[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘डोरी’। यह इब्रानी शब्द दुर्लभ है और रस्सी, डोरी अथवा अपमान के रस्सी-जैसे निशान की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह इब्रानी वाक्यांश कठिन है और विस्तृत सजावट या बारीकी से बने वस्त्र का भी संकेत दे सकता है; पर ‘गंजापन’ के साथ इसका विरोध सँवारे हुए बालों के अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: c
    text: अंतिम वाक्यांश पाठ और शब्दार्थ की दृष्टि से कठिन है। बहुत-से लोग इसका अर्थ दागे जाने का निशान समझते हैं; अन्य अनुवाद अधिक सामान्य रूप से ‘सुंदरता के बदले लज्जा’ जैसे शब्द रखते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: בֹּשֶׂם
  choice: इत्र
  rationale: यह सुगंधित द्रव्य या इत्र को दर्शाता है। आधुनिक हिन्दी में ‘इत्र’ संक्षिप्त और स्वाभाविक है तथा सड़ांध के साथ तीखा विरोध बनाता है।
- source_word: מַק
  choice: सड़ांध
  rationale: मूल शब्द सड़न या गलने की दशा को व्यक्त करता है; ‘सड़ांध’ उस दुर्गंधयुक्त दशा को सहज हिन्दी में सामने लाता है।
- source_word: חֲגוֹרָה
  choice: कमरबंद
  rationale: कमर पर बाँधी जाने वाली वस्तु के लिए यह स्पष्ट आधुनिक शब्द है और सजावटी पहनावे के संदर्भ में उपयुक्त है।
- source_word: נִקְפָּה
  choice: रस्सी
  rationale: यह दुर्लभ शब्द संभवतः रस्सी या डोरी को दर्शाता है। मुख्य पाठ में सर्वाधिक प्रचलित अर्थ रखा गया है और अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: מַעֲשֶׂה מִקְשֶׁה
  choice: सँवारे हुए बाल
  rationale: वाक्यांश कठिन है, पर ‘गंजापन’ के साथ उसका विरोध यह संकेत देता है कि आशय कलात्मक ढंग से सजाए गए बालों से है।
- source_word: קָרְחָה
  choice: गंजापन
  rationale: यह मूल संज्ञा का सीधा और स्वाभाविक हिन्दी अर्थ है।
- source_word: פְּתִיגִיל
  choice: कीमती वस्त्र
  rationale: दुर्लभ शब्द किसी समृद्ध, विशेष या उत्सवी पोशाक को सूचित करता है। ‘कीमती वस्त्र’ विलासिता का भाव रखता है, पर वस्त्र की अनिश्चित बनावट को निश्चित नहीं करता।
- source_word: מַחֲגֹרֶת שָׂק
  choice: कमर में टाट
  rationale: मूल अभिव्यक्ति टाट को कमर से बाँधने या लपेटने का चित्र देती है। यह हिन्दी में स्वाभाविक रहते हुए शोक और अपमान का दृश्य बनाए रखती है।
- source_word: כִּי תַחַת יֹפִי
  choice: सुंदरता के बदले दाग
  rationale: मसोराई व्यंजन-पाठ में ‘दाग’ के लिए अपेक्षित संज्ञा स्पष्ट नहीं है, फिर भी संदर्भ और प्राचीन व्याख्यात्मक परंपरा सुंदरता की जगह दागे जाने का निशान समझने का समर्थन करती है। संक्षिप्त हिन्दी मूल की तीखी समाप्ति को बनाए रखती है।
