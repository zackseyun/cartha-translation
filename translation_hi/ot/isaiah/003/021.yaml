lexical_decisions:
- source_word: הַטַּבָּעוֹת
  choice: अँगूठियाँ
  rationale: טַבָּעוֹת का सामान्य अर्थ अंगुलियों में पहनी जाने वाली अँगूठियाँ है। आभूषणों की इस सूची में यह स्वाभाविक और स्पष्ट हिन्दी है; ‘मुहरदार अँगूठियाँ’ सम्भव अर्थ है, पर यहाँ अनावश्यक रूप से प्रकार निश्चित कर देगा।
- source_word: וְנִזְמֵי הָאָף
  choice: और नथें
  rationale: נִזְמֵי הָאָף का शाब्दिक भाव ‘नाक के छल्ले/आभूषण’ है। आधुनिक हिन्दी में स्त्रियों के नाक के आभूषण के लिए ‘नथें’ संक्षिप्त, स्वाभाविक और सांस्कृतिक रूप से सहज है।
- source_word: הָאָף
  choice: नाक
  rationale: אָף यहाँ शारीरिक अर्थ में ‘नाक’ है। संयुक्त पद का हिन्दी रूप ‘नथें’ इस अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
