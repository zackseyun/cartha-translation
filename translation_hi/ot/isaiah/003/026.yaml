base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/026.yaml
  text: And her gates will lament and mourn[a], and she will be stripped bare and sit on the ground.
translation:
  language: hi
  text: उसके फाटक विलाप करेंगे और शोक मनाएँगे; वह खाली कर दी जाएगी[a] और भूमि पर बैठ जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उजाड़ दी जाएगी” अथवा “सब कुछ से वंचित हो जाएगी।” इब्रानी क्रिया खाली कर दिए जाने या पूरी तरह से वंचित हो जाने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנ֥וּ
  choice: विलाप करेंगे
  rationale: अנה यहाँ शोक की सुनाई देने वाली अभिव्यक्ति बताता है। यह चयन फाटकों के मानवीकरण और अगले समानांतर क्रियापद से उसके भेद को बनाए रखता है।
- source_word: וְאָבְל֖וּ
  choice: और शोक मनाएँगे
  rationale: אבל विनाश या मृत्यु के कारण शोक करने को व्यक्त करता है; यह ‘विलाप करेंगे’ के साथ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: פְּתָחֶ֑י/הָ
  choice: उसके फाटक
  rationale: संज्ञा का अर्थ प्रवेश-द्वार भी हो सकता है, पर नगर के संदर्भ में ‘फाटक’ स्वाभाविक है और शहरी बिंब को सुरक्षित रखता है।
- source_word: וְנִקָּ֖תָה
  choice: वह खाली कर दी जाएगी
  rationale: נקה के निफ़अल रूप का यहाँ आशय खाली कर दिए जाने या सब कुछ से वंचित हो जाने से है। यह अनुवाद मूल की क्रियात्मकता और अर्थगत अनिश्चितता को यथासंभव बनाए रखता है।
- source_word: לָ/אָ֥רֶץ
  choice: भूमि पर
  rationale: ישב के साथ यह पद यहाँ अपमान और शोक की शारीरिक मुद्रा—भूमि पर बैठना—व्यक्त करता है।
- source_word: תֵּשֵֽׁב
  choice: बैठ जाएगी
  rationale: ישב का अर्थ ‘रहना’ भी हो सकता है, किंतु ‘भूमि पर’ के साथ यहाँ बैठने की ठोस मुद्रा सबसे उपयुक्त है।
theological_decisions:
- issue: स्त्रीलिंग एकवचन कर्ता का संदर्भ
  choice: सिय्योन/यरूशलेम को स्त्री के रूप में मानवीकृत रखते हुए ‘वह’
  alternative: किसी सामान्य स्त्रीलिंग नगर का मानवीकरण
  rationale: आसपास का प्रसंग सिय्योन की पुत्रियों और यरूशलेम के विनाश से संबंधित है। ‘उसके’ और ‘वह’ मानवीकरण को बनाए रखते हैं, पर पद में नाम जोड़कर संदर्भ को आवश्यकता से अधिक स्पष्ट नहीं करते।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘विलाप करेंगे और शोक मनाएँगे’ मूल के दो समानांतर शोकसूचक क्रियापदों तथा फाटकों के काव्यात्मक मानवीकरण को बनाए रखता है।
