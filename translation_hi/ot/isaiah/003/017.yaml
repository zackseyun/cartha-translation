  yaml_path: translation/ot/isaiah/003/017.yaml
  text: therefore the Lord will strike the crown of the daughters of Zion with scabs[a], and Yahweh will lay bare their private parts.
translation:
  language: hi
  text: इसलिए प्रभु सिय्योन की बेटियों के सिरों की चोटी को पपड़ीदार कर देगा, और यहोवा उनके गुप्तांगों[a] को उघाड़ देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनका नंगापन।” यहाँ प्रयुक्त इब्रानी शब्द कठिन है। कुछ इसे अधिक विशेष रूप से गुप्तांगों के लिए शिष्टोक्ति मानते हैं, जबकि कुछ इसका अर्थ अलग, जैसे “माथा,” समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׂפַּח
  choice: पपड़ियों से भर देगा
  rationale: क्रिया सिर की त्वचा को रोगग्रस्त या पपड़ीदार कर देने का दंडसूचक भाव रखती है; यह हिन्दी में स्वाभाविक और स्पष्ट है। आरम्भिक वाव को प्रसंगानुसार ‘इसलिए’ से व्यक्त किया गया है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह परमेश्वर के सार्वभौम स्वामी होने का पदनाम है और आगे आए व्यक्तिगत दिव्य नाम יהוה से अलग रखा गया है।
- source_word: קָדְקֹד
  choice: सिर की चोटी
  rationale: शब्द सिर के सबसे ऊपरी भाग को दर्शाता है; यह हिन्दी में ‘मुकुट’ की सम्भावित राजकीय भ्रांति से बचता है।
- source_word: בְּנוֹת צִיּוֹן
  choice: सिय्योन की बेटियाँ
  rationale: शाब्दिक-प्रतीकात्मक अभिव्यक्ति भविष्यद्वाणी की काव्यात्मक और वाचागत भाषा को बनाए रखती है।
- source_word: וַיהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को लिप्यंतरित करने से इसी पद में אֲדֹנָי ‘प्रभु’ और יהוה के बीच मूल भेद सुरक्षित रहता है।
- source_word: פָּתְהֵן
  choice: उनके गुप्तांग
  rationale: कठिन शब्द को अपमानजनक शारीरिक अनावरण के प्रसंग में अंतरंग अंगों के लिए प्रयुक्त शिष्टोक्ति माना गया है; अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
- source_word: יְעָרֶה
  choice: उघाड़ देगा
  rationale: क्रिया का अर्थ खोलना या नंगा कर देना है; ‘उघाड़ देगा’ न्याय और सार्वजनिक अपमान की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: एक ही पद में אֲדֹנָי और יהוה का अलग-अलग अनुवाद
  choice: אֲדֹנָי के लिए ‘प्रभु’ और יהוה के लिए ‘यहोवा’
  alternative: दोनों के लिए ‘प्रभु’; अथवा יהוה के लिए ‘याहवे’
  rationale: मूल इब्रानी समानांतर वाक्यों में दो अलग दिव्य संबोधनों का प्रयोग करता है; भेद बनाए रखना स्रोत-पाठ के स्वरूप को सुरक्षित रखता है।
- issue: अपमान के न्याय-संदेश में פָּתְהֵן का अर्थ
  choice: अंतरंग अंगों के लिए शिष्टोक्ति—‘गुप्तांग’
  alternative: ‘नंगापन’; अथवा कुछ व्याख्याओं में ‘माथा’
  rationale: ‘उघाड़ देगा’ क्रिया और अपमान का प्रसंग शारीरिक अनावरण का समर्थन करते हैं, पर कठिन शब्द की वास्तविक अनिश्चितता को पादटिप्पणी में बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी शैली रखी गई है। ‘गुप्तांग’ स्पष्ट किंतु अश्लीलतारहित है; ‘सिय्योन की बेटियाँ’ मूल की काव्यात्मक अभिव्यक्ति को बनाए रखता है।
