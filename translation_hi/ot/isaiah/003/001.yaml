id: ISA.3.1
reference: Isaiah 3:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי֩ הִנֵּ֨ה הָ/אָד֜וֹן יְהוָ֣ה צְבָא֗וֹת מֵסִ֤יר מִ/ירוּשָׁלִַ֨ם֙ וּ/מִ֣/יהוּדָ֔ה מַשְׁעֵ֖ן וּ/מַשְׁעֵנָ֑ה כֹּ֚ל מִשְׁעַן לֶ֔חֶם וְ/כֹ֖ל מִשְׁעַן מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/001.yaml
  text: 'For look, the Lord, the LORD of Armies, is removing from Jerusalem and from Judah support and supply: all support of bread and all support of water.'
translation:
  language: hi
  text: क्योंकि देखो, प्रभु, सेनाओं का यहोवा, यरूशलेम और यहूदा से सहारा और साधन हटा रहा है—रोटी का सारा सहारा और पानी का सारा सहारा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: क्योंकि देखो
  rationale: כִּי प्रसंगगत कारणसूचक है और הִנֵּה ध्यान आकर्षित करता है; यह संयोजन मूल की उद्घोषणात्मक तात्कालिकता बनाए रखता है।
- source_word: הָאָדוֹן יְהוָה צְבָאוֹת
  choice: प्रभु, सेनाओं का यहोवा
  rationale: הָאָדוֹן को उपाधि ‘प्रभु’ और दिव्य नाम יהוה को ‘यहोवा’ के रूप में अलग रखा गया है; צְבָאוֹת का स्वाभाविक अर्थ ‘सेनाओं का’ है।
- source_word: מֵסִיר
  choice: हटा रहा है
  rationale: हिफ़ील कृदन्त चल रही अथवा निकट निश्चित कार्रवाई का बोध देता है।
- source_word: מַשְׁעֵן וּמַשְׁעֵנָה
  choice: सहारा और साधन
  rationale: दो समानार्थी, भिन्न-लिंग संज्ञाओं की शब्द-क्रीड़ा हिन्दी में हूबहू सुरक्षित नहीं हो सकती; ‘सहारा और साधन’ व्यापक आधार तथा जीवन-निर्वाह की उपलब्ध व्यवस्था दोनों को व्यक्त करता है।
- source_word: כֹּל מִשְׁעַן לֶחֶם וְכֹל מִשְׁעַן מָיִם
  choice: रोटी का सारा सहारा और पानी का सारा सहारा
  rationale: मूल की पुनरुक्ति और रोटी-पानी पर निर्भरता की ठोस छवि को बनाए रखा गया है।
theological_decisions:
- issue: दिव्य नाम יהוה का निरूपण
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: पद में אֲדֹנָי/הָאָדוֹן-सदृश उपाधि और יהוה साथ आते हैं; दोनों को ‘प्रभु’ कहने से मूल का भेद मिट जाता। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय पाठकों में व्यापक रूप से पहचाना जाने वाला नामरूप है।
- issue: צְבָאוֹת का आशय
  choice: सेनाओं का
  alternative: सर्वशक्तिमान
  rationale: ‘सर्वशक्तिमान’ व्याख्यात्मक धर्मवैज्ञानिक विस्तार होगा; ‘सेनाओं का’ मूल उपाधि की सजीव और कुछ हद तक खुली अर्थ-सीमा बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, स्पष्ट और श्रव्य शैली। मूल की पुनरावृत्ति जानबूझकर रखी गई है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
