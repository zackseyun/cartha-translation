    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלְיֹנִים
  choice: दर्पणों
  rationale: यह शब्द चिकनी या चमकाई हुई वस्तुओं का सूचक हो सकता है; विलासिता की वस्तुओं की इस सूची में धातु के दर्पण सबसे उपयुक्त अर्थ हैं।
- source_word: סְּדִינִים
  choice: मलमल के वस्त्रों
  rationale: शब्द महीन सन के कपड़े से बने परिधान को दर्शाता है। ‘मलमल के वस्त्र’ सामग्री और बारीकी का भाव रखता है, पर वस्त्र का निश्चित प्रकार नहीं ठहराता।
- source_word: צְּנִיפוֹת
  choice: पगड़ियों
  rationale: यह सिर के चारों ओर लपेटे जाने वाले आवरण को दर्शाता है; ‘पगड़ी’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त रूप से सटीक है।
- source_word: רְדִידִים
  choice: ओढ़नियों
  rationale: यह सम्भवतः स्त्रियों द्वारा ओढ़ा जाने वाला हल्का बाहरी आवरण था। ‘ओढ़नी’ चेहरे के घूँघट का अर्थ अनावश्यक रूप से निश्चित किए बिना लपेटे या ओढ़े जाने वाले वस्त्र का भाव देती है।
