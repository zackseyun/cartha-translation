  yaml_path: translation/ot/isaiah/003/007.yaml
  text: On that day he will cry out[a], saying, “I will not be a healer, for in my house there is no bread and there is no cloak[b]; you must not make me leader of the people.”
translation:
  language: hi
  text: उस दिन वह ऊँची आवाज़ में[a] कहेगा, “मैं मरहम-पट्टी करनेवाला[b] नहीं बनूँगा; मेरे घर में न रोटी है, न वस्त्र। मुझे लोगों का प्रधान मत बनाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उठाकर कहेगा”; आशय आवाज़ उठाकर या दृढ़तापूर्वक कहने का हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “घाव बाँधनेवाला”; यहाँ संकटग्रस्त समाज को सँभालने के लिए उपचार का रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: ऊँची आवाज़ में कहेगा
  rationale: क्रिया का मूल अर्थ ‘उठाना’ है; यहाँ לֵאמֹר के साथ यह आवाज़ उठाकर दृढ़तापूर्वक बोलने का भाव देती है। हिंदी में यह अभिव्यक्ति उस सार्वजनिक और ज़ोरदार इनकार को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: חֹבֵשׁ
  choice: मरहम-पट्टी करनेवाला
  rationale: यह חבש का कृदंत है, जिसका ठोस चित्र घाव बाँधने या पट्टी करनेवाले व्यक्ति का है। यह चयन सामाजिक संकट को सँभालने के रूपक को सुरक्षित रखते हुए सामान्य हिंदी में समझने योग्य है।
- source_word: לֶחֶם
  choice: रोटी
  rationale: मूल शब्द का प्राथमिक अर्थ रोटी है, यद्यपि वह व्यापक रूप से भोजन को भी सूचित कर सकता है। यहाँ बुनियादी आवश्यकताओं का ठोस चित्र बनाए रखने के लिए ‘रोटी’ रखा गया है।
- source_word: שִׂמְלָה
  choice: वस्त्र
  rationale: यह किसी पहनने के वस्त्र, विशेषकर बाहरी वस्त्र, को सूचित करता है। ‘वस्त्र’ पद 6 से शब्दगत संबंध बनाए रखता है और किसी एक विशेष प्रकार के पहनावे को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: תְשִׂימֻנִי
  choice: मुझे ... मत बनाओ
  rationale: שׂים का अर्थ रखना, ठहराना या नियुक्त करना है। संदर्भ में पद स्वीकार करने से सीधा इनकार है, जिसे यह हिंदी प्रयोग स्वाभाविक रूप से व्यक्त करता है।
- source_word: קְצִין עָם
  choice: लोगों का प्रधान
  rationale: קְצִין किसी अधिकारी, मुखिया या अगुए को दर्शाता है। ‘प्रधान’ नेतृत्व और अधिकार दोनों व्यक्त करता है, पर अनावश्यक सैनिक अर्थ नहीं जोड़ता।
