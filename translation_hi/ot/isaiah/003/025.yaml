  text: מְתַ֖יִ/ךְ בַּ/חֶ֣רֶב יִפֹּ֑לוּ וּ/גְבוּרָתֵ֖/ךְ בַּ/מִּלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/025.yaml
  text: Your men will fall by the sword[a], and your mighty men in battle.
translation:
  language: hi
  text: 'तेरे पुरुष तलवार से मारे जाएँगे,

    और तेरे वीर[a] युद्ध में गिरेंगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरे योद्धा’ अथवा ‘तेरे शूरवीर’।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְתַיִךְ
  choice: तेरे पुरुष
  rationale: काव्यात्मक संदर्भ में מְתַיִךְ का अर्थ ‘तेरे जन/पुरुष’ है, न कि पहले से मरे हुए लोग। ‘पुरुष’ संबोधित नगर के पुरुषों को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: तलवार से मारे जाएँगे
  rationale: शाब्दिक रूप ‘तलवार से गिरेंगे’ है, पर युद्ध-संदर्भ में נפל मृत्यु का प्रचलित मुहावरा है। हिन्दी में ‘तलवार से मारे जाएँगे’ अभिप्रेत परिणाम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּגְבוּרָתֵךְ
  choice: तेरे वीर
  rationale: גְּבוּרָה सामान्यतः ‘सामर्थ्य/वीरता’ है, पर यहाँ ‘तेरे पुरुष’ के समानांतर व्यक्तियों—नगर के वीर योद्धाओं—के लिए लाक्षणिक रूप से प्रयुक्त है। ‘वीर’ संक्षिप्त और काव्यात्मक है।
- source_word: בַּמִּלְחָמָה
  choice: युद्ध में
  rationale: מִלְחָמָה का सीधा अर्थ ‘युद्ध’ है; ‘युद्ध में’ इस समानांतर पंक्ति में स्वाभाविक है।
- source_word: יִפֹּלוּ
  choice: गिरेंगे
  rationale: दूसरी पंक्ति में ‘गिरेंगे’ मूल क्रिया के युद्ध में मारे जाने वाले मुहावरे को बनाए रखता है और हिन्दी में अर्थ स्पष्ट रहता है।
theological_decisions:
- issue: स्त्रीलिंग एकवचन द्वितीय पुरुष प्रत्ययों का संदर्भ
  choice: पद में ‘तेरे’ रखकर सिय्योन/यरूशलेम को व्यक्तिरूप में किया गया संबोधन सुरक्षित रखा गया है।
  alternative: इसे सामूहिक रूप से सिय्योन की पुत्रियों के प्रति संबोधन समझना।
  rationale: निकटवर्ती संदर्भ स्त्रीलिंग एकवचन में सिय्योन/यरूशलेम को संबोधित करता है। पद में नाम जोड़ना अनावश्यक व्याख्या होती; ‘तेरे’ मूल संबोधन को खुला रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। समानांतरता स्पष्ट रखने के लिए दोनों पंक्तियों में मृत्यु की क्रिया व्यक्त की गई है; पहली में हिन्दी के स्वाभाविक युद्ध-मुहावरे ‘मारे जाएँगे’ और दूसरी में मूल ‘गिरेंगे’ रखा गया है।
