id: ISA.3.10
reference: Isaiah 3:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִמְר֥וּ צַדִּ֖יק כִּי ט֑וֹב כִּֽי פְרִ֥י מַעַלְלֵי/הֶ֖ם יֹאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/010.yaml
  text: Say of the righteous that it will be well[a], for they will eat the fruit of their deeds.
translation:
  language: hi
  text: धर्मी के विषय में कहो कि उसका भला होगा,[a] क्योंकि वे अपने कर्मों का फल खाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या अधिक शाब्दिक रूप में: “धर्मी के विषय में कहो कि भला है, क्योंकि वे अपने कर्मों का फल खाएँगे।” इब्रानी में “धर्मी” प्रतिनिधिक एकवचन है, किंतु अंतिम उपवाक्य में क्रिया और संबंधसूचक प्रत्यय बहुवचन हैं।'
    reason: शाब्दिक विकल्प और मूल पाठ में एकवचन से बहुवचन के परिवर्तन को स्पष्ट करना।
lexical_decisions:
- source_word: אִמְרוּ
  choice: कहो
  rationale: बहुवचन आज्ञार्थक क्रिया का सीधा और संक्षिप्त हिन्दी समतुल्य; बोलने या घोषणा करने की आज्ञा को बनाए रखता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रतिनिधिक एकवचन है। ‘धर्मी’ नैतिक अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: כִּי טוֹב
  choice: कि उसका भला होगा
  rationale: पहला כִּי कही जाने वाली बात का परिचय देता है। טוֹב शाब्दिक रूप से ‘अच्छा/भला’ है, पर प्रसंग में धर्मी के अच्छे परिणाम को दर्शाता है; ‘उसका भला होगा’ प्राकृतिक हिन्दी है।
- source_word: כִּי
  choice: क्योंकि
  rationale: दूसरा כִּי कारण बताता है कि धर्मी का भला क्यों होगा।
- source_word: פְרִי
  choice: फल
  rationale: मूल कृषि-रूपक और कर्मों के परिणाम या प्रतिफल—दोनों को सुरक्षित रखता है।
- source_word: מַעַלְלֵיהֶם
  choice: अपने कामों का
  rationale: ‘काम’ सामान्य आधुनिक हिन्दी में कर्मों/कार्यों को स्पष्ट रूप से व्यक्त करता है; आत्मवाचक ‘अपने’ बहुवचन कर्ता के साथ स्वाभाविक है।
- source_word: יֹאכֵלוּ
  choice: वे ... खाएँगे
  rationale: मूल की बहुवचन क्रिया और फल खाने के प्रतिफल-रूपक को शाब्दिक रूप से बनाए रखता है।
theological_decisions:
- issue: प्रतिनिधिक एकवचन से बहुवचन में परिवर्तन
  choice: आरम्भ में ‘धर्मी’ और ‘उसका’ एकवचन रखा, फिर अंतिम उपवाक्य में मूल के अनुसार ‘वे अपने कामों का फल खाएँगे’ बहुवचन रखा।
  alternative: 'पूरे वाक्य को एकवचन करना: ‘धर्मी के विषय में कहो कि उसका भला होगा, क्योंकि वह अपने कामों का फल खाएगा।’'
  rationale: इब्रानी पाठ צַדִּיק और निहित संबंध को एकवचन में रखता है, पर מַעַלְלֵיהֶם और יֹאכֵלוּ बहुवचन हैं। असामान्य संख्या-परिवर्तन को समतल करने के बजाय मुख्य पाठ में सुरक्षित रखा गया है।
- issue: טוֹב का काल और अर्थ
  choice: ‘उसका भला होगा’
  alternative: ‘वह अच्छा है’ अथवा ‘यह अच्छा है’
  rationale: मूल में केवल ‘अच्छा/भला’ है और स्पष्ट क्रिया नहीं है। प्रसंग तथा आगे दिए कारण के आधार पर यह धर्मी के कल्याणकारी परिणाम को व्यक्त करता है; फिर भी अधिक औपचारिक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज है। ‘फल खाएँगे’ के मूल रूपक को बनाए रखा गया है, और इब्रानी के एकवचन से बहुवचन में परिवर्तन को जानबूझकर सुरक्षित रखा गया है।
