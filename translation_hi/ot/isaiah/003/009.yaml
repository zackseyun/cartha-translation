source:
  edition: WLC
  text: הַכָּרַ֤ת פְּנֵי/הֶם֙ עָ֣נְתָה בָּ֔/ם וְ/חַטָּאתָ֛/ם כִּ/סְדֹ֥ם הִגִּ֖ידוּ לֹ֣א כִחֵ֑דוּ א֣וֹי לְ/נַפְשָׁ֔/ם כִּֽי גָמְל֥וּ לָ/הֶ֖ם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/009.yaml
  text: The look on their faces testifies against them[a], and they proclaim their sin like Sodom; they do not hide it. Woe to themselves[c][b], for they have brought evil on themselves.
translation:
  language: hi
  text: उनके चेहरों के भाव उनके विरुद्ध गवाही देते हैं[a]; वे सदोम के समान अपने पाप का खुला बखान करते हैं[b], उसे छिपाते नहीं। हाय उन्हें![c] क्योंकि वे अपने ही ऊपर बुराई ले आए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके चेहरों का रूप उनके विरुद्ध साक्षी देता है।” इब्रानी उनके दिखाई देनेवाले चेहरे या भाव को दोष के प्रमाण के रूप में सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “सदोम के समान” खुली और निर्लज्ज दुष्टता की याद दिलाता है; उत्पत्ति 13:13; 19:5 देखें।
    reason: cross_reference
  - marker: c
    text: या, “हाय उनके प्राणों को!” अथवा “हाय उन पर!” यहाँ इब्रानी शब्द का अर्थ “स्वयं,” “जीवन,” या “व्यक्ति” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכָּרַת פְּנֵיהֶם
  choice: उनके चेहरों के भाव
  rationale: यह पदबंध उनके चेहरे पर दिखाई देनेवाले भाव या रूप की ओर संकेत करता है, जो उनके दोष का प्रमाण बनता है। यह हिन्दी में स्वाभाविक है और संदर्भ के अनुकूल है।
- source_word: עָנְתָה בָּם
  choice: उनके विरुद्ध गवाही देते हैं
  rationale: ענה के साथ ב यहाँ न्यायिक अर्थ में किसी के विरुद्ध साक्ष्य देने को व्यक्त करता है।
- source_word: וְחַטָּאתָם ... הִגִּידוּ
  choice: अपने पाप का खुला बखान करते हैं
  rationale: हिफ़ील הִגִּידוּ का अर्थ बताना या प्रकट करना है। 'खुला बखान' सार्वजनिक और निर्लज्ज प्रकटीकरण का भाव देता है, जबकि एकवचन 'पाप' इब्रानी सामूहिक एकवचन को बनाए रखता है।
- source_word: כִּסְדֹם
  choice: सदोम के समान
  rationale: सीधी तुलना की संक्षिप्तता और सदोम की कुख्यात दुष्टता की ओर संकेत दोनों सुरक्षित रहते हैं।
- source_word: לֹא כִחֵדוּ
  choice: उसे छिपाते नहीं
  rationale: כחד का सीधा अर्थ छिपाना या गुप्त रखना है; सर्वनाम 'उसे' पाप की ओर स्पष्ट रूप से लौटता है।
- source_word: אוֹי לְנַפְשָׁם
  choice: उन पर हाय!
  rationale: נפש यहाँ संपूर्ण व्यक्ति या स्वयं को सूचित करता है, न कि अनिवार्य रूप से अमूर्त आत्मा को। हिन्दी का यह मुहावरा व्यक्ति-केंद्रित अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כִּי גָמְלוּ לָהֶם רָעָה
  choice: क्योंकि उन्होंने अपने ही ऊपर विपत्ति ला दी है
  rationale: גמל और לָהֶם का मेल आत्म-उपार्जित परिणाम का भाव देता है। यहाँ רָעָה परिणामस्वरूप आई विपत्ति को सूचित कर सकता है; यह अनुवाद उसके तंत्र को अनावश्यक रूप से परिभाषित नहीं करता।
theological_decisions:
- issue: לְנַפְשָׁם में נֶפֶשׁ का अर्थ
  choice: 'व्यक्ति या स्वयं: ''उन पर हाय'''
  alternative: '''उनकी आत्मा पर हाय'' या ''उनके प्राण पर हाय'''
  rationale: נפש अनेक संदर्भों में पूरे व्यक्ति, जीवन या स्वयं को दर्शाता है। यहाँ संकीर्ण देह-आत्मा संबंधी अर्थ आरोपित नहीं किया गया।
- issue: अंतिम उपवाक्य में न्याय का स्वरूप
  choice: उनके कर्मों से उन्हीं पर आई विपत्ति
  alternative: स्पष्ट रूप से कहा गया दैवी प्रतिशोध, या केवल सामाजिक परिणाम
  rationale: इब्रानी उनके अपने ऊपर बुराई या विपत्ति लाने की बात कहता है, पर यहाँ उसका माध्यम स्पष्ट नहीं करता। अनुवाद इसी तनाव को बनाए रखता है।
- issue: सदोम से तुलना का आशय
  choice: पाप का खुला और निर्लज्ज प्रकटीकरण
  alternative: सदोम के किसी एक विशिष्ट पाप की पहचान
  rationale: इस पद का बल अपने पाप को घोषित करने और न छिपाने पर है। किसी एक विशिष्ट पाप को निर्धारित करना पाठ से आगे जाना होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली रखी गई है। न्यायिक रूपक के लिए 'गवाही', निर्लज्ज सार्वजनिकता के लिए 'खुला बखान', और נפש के व्यापक व्यक्ति-सूचक अर्थ के लिए स्वाभाविक 'उन पर हाय' चुना गया है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
