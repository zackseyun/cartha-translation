translation:
  language: hi
  text: उत्सव के परिधान[a], लबादे[b], शॉल[c] और बटुए[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बहुमूल्य परिधान’। इब्रानी शब्द संभवतः साधारण कपड़ों के बजाय विशेष अवसरों पर पहने जाने वाले महँगे वस्त्रों को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘ओढ़ने के वस्त्र’।
    reason: lexical_alternative
  - marker: c
    text: या ‘स्कार्फ़’ अथवा ‘घूँघट’। कपड़े से बनी इस वस्तु का ठीक प्रकार निश्चित नहीं है।
    reason: lexical_alternative
  - marker: d
    text: या ‘थैलियाँ’ अथवा ‘छोटी पोटलियाँ’।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַּחֲלָצוֹת
  choice: उत्सव के परिधान
  rationale: यह शब्द साधारण कपड़ों के बजाय विशेष या बहुमूल्य परिधानों को सूचित करता है। ‘उत्सव के परिधान’ विशेष अवसर और प्रतिष्ठा का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מַּעֲטָפוֹת
  choice: लबादे
  rationale: मूल धातु लपेटने या ढकने से जुड़ी है और यहाँ बाहरी वस्त्र का संकेत देती है। ‘लबादे’ पर्याप्त स्पष्ट है और ओढ़कर शरीर ढकने वाले बड़े वस्त्र का भाव बनाए रखता है।
- source_word: מִּטְפָּחוֹת
  choice: शॉल
  rationale: यह किसी ओढ़े या लपेटे जाने वाले कपड़े का नाम है, पर उसकी ठीक बनावट अनिश्चित है। ‘शॉल’ पहनावे की ऐसी वस्तु को दर्शाता है और अनावश्यक रूप से चेहरे के आवरण का अर्थ नहीं जोड़ता।
- source_word: חֲרִיטִים
  choice: बटुए
  rationale: यह शब्द धन या मूल्यवान वस्तुएँ रखने की थैली अथवा छोटी पोटली को दर्शाता है। सूची के विलासपूर्ण सामान के संदर्भ में ‘बटुए’ सहज और सटीक है।
