  yaml_path: translation/ot/isaiah/003/015.yaml
  text: What do you mean by crushing my people and grinding the faces of the poor? declares the Lord GOD of hosts[a][b].
translation:
  language: hi
  text: “तुम्हें क्या हुआ है कि तुम मेरे लोगों को कुचलते हो और दीन-दुखियों के चेहरों को पीसते हो?” सेनाओं के प्रभु यहोवा की यह घोषणा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָה־לָכֶם
  choice: तुम ... क्यों ... रहे हो?
  rationale: यह अण्डाकार इब्रानी मुहावरा कड़ी फटकार व्यक्त करता है। आधुनिक हिन्दी में प्रश्नवाचक ‘क्यों’ उसका आरोपात्मक बल स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תְּדַכְּאוּ
  choice: कुचल रहे हो
  rationale: पिएल रूप में क्रिया हिंसक रूप से दबाने या कुचलने का बिंब रखती है; अमूर्त ‘अत्याचार करना’ की अपेक्षा इसे सुरक्षित रखा गया है।
- source_word: עַמִּי
  choice: मेरे लोगों
  rationale: प्रथम पुरुष स्वामित्व और पीड़ितों के साथ परमेश्वर की वाचा-संबंधी पहचान को सीधे बनाए रखता है।
- source_word: וּפְנֵי עֲנִיִּים
  choice: और दीन-दुखियों के चेहरों को
  rationale: פנים के ठोस ‘चेहरे’ वाले बिंब को रखा गया है; עֲנִיִּים आर्थिक निर्धनता के साथ पीड़ा और सामाजिक दुर्बलता भी व्यक्त कर सकता है, इसलिए ‘दीन-दुखियों’ चुना गया।
- source_word: תִּטְחָנוּ
  choice: पीस रहे हो
  rationale: क्रिया का मूल अर्थ चक्की में पीसना है। इसे बनाए रखने से निर्मम उत्पीड़न का तीखा रूपक और पहली क्रिया से उसका भेद सुरक्षित रहता है।
- source_word: נְאֻם
  choice: यह घोषणा है
  rationale: यह भविष्यवाणी में अधिकारपूर्ण ईश्वरीय वचन का सूत्र है; हिन्दी में ‘घोषणा’ उसका औपचारिक बल रखता है।
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: सेनाओं के स्वामी यहोवा
  rationale: אֲדֹנָי को ‘स्वामी’, יהוה को व्यक्तिगत वाचा-नाम ‘यहोवा’, और צְבָאוֹת को ‘सेनाओं’ के रूप में व्यक्त किया गया है। यह हिन्दी में अस्वाभाविक ‘प्रभु यहोवा सेनाओं का’ से बचते हुए पूरे संयुक्त पद का अर्थ रखता है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: स्वामी यहोवा
  alternative: प्रभु परमेश्वर / प्रभु याहवे
  rationale: मूल पाठ में वाचा-नाम יהוה स्पष्ट है, इसलिए उसे सामान्य उपाधि ‘परमेश्वर’ में विलीन नहीं किया गया। हिन्दी में प्रचलित बाइबिलीय रूप ‘यहोवा’ सामान्य पाठक के लिए पहचान योग्य है; אֲדֹנָי का अलग अर्थ ‘स्वामी’ से सुरक्षित है।
- issue: עֲנִיִּים का सामाजिक अर्थ
  choice: दीन-दुखियों
  alternative: गरीबों / पीड़ितों
  rationale: शब्द निर्धन, पीड़ित या दबे हुए लोगों को सूचित कर सकता है। ‘दीन-दुखियों’ इस अर्थ-विस्तार को किसी एक आर्थिक या आध्यात्मिक श्रेणी तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधे आरोप लगाने वाली रखी गई है। दो हिंसक रूपकों—‘कुचलना’ और ‘चेहरे पीसना’—को नरम नहीं किया गया। प्रश्न के बाद घोषणा-सूत्र रखा गया है, जिससे हिन्दी वाक्य स्वाभाविक रहता है और मूल की भविष्यवाणीय अधिकार-ध्वनि बनी रहती है।
