  text: the mighty man and the man of war[a], the judge and the prophet, the diviner and the elder.
translation:
  language: hi
  text: वीर पुरुष और योद्धा, न्यायाधीश और भविष्यद्वक्ता, दैवज्ञ[a] और बुज़ुर्ग।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात वह व्यक्ति जो दैवज्ञान के द्वारा छिपी बातों या भविष्य को जानने का दावा करता है।
    reason: lexical_clarification
lexical_decisions:
- source_word: גִּבּוֹר
  choice: वीर पुरुष
  rationale: यहाँ शब्द किसी बलवान और पराक्रमी पुरुष को सामाजिक सहारे के रूप में दर्शाता है। ‘वीर पुरुष’ उसके पुल्लिंग एकवचन और प्रतिनिधि भूमिका को बनाए रखता है तथा अगले सैन्य पद से भेद भी रखता है।
- source_word: אִישׁ מִלְחָמָה
  choice: योद्धा
  rationale: इब्रानी का शाब्दिक अर्थ ‘युद्ध का पुरुष’ है; स्वाभाविक आधुनिक हिन्दी में ‘योद्धा’ वही सैन्य भूमिका स्पष्ट रूप से व्यक्त करता है।
- source_word: שׁוֹפֵט
  choice: न्यायाधीश
  rationale: यह नागरिक अथवा न्यायिक रूप से निर्णय करनेवाले व्यक्ति का सीधा और प्रचलित पदनाम है।
- source_word: נָבִיא
  choice: भविष्यद्वक्ता
  rationale: यह उस मान्य भूमिका का प्रचलित हिन्दी पद है जिसमें व्यक्ति परमेश्वर की ओर से संदेश सुनाता है।
- source_word: קֹסֵם
  choice: शकुन-विचारक
  rationale: यह शब्द निषिद्ध दैवज्ञान अथवा शकुन के द्वारा छिपी बात या भविष्य जानने का दावा करनेवाले व्यक्ति को दर्शाता है। यह अनुवाद वर्णनात्मक है और उस प्रथा का अनुमोदन नहीं करता।
- source_word: זָקֵן
  choice: पुरनिया
  rationale: इस सूची में आशय केवल अधिक आयु के व्यक्ति से नहीं, बल्कि समुदाय में मान और नेतृत्व रखनेवाले बुज़ुर्ग से है। ‘पुरनिया’ इस सामाजिक भूमिका को संक्षेप में व्यक्त करता है।
- source_word: וְ
  choice: और
  rationale: बार-बार आए संयोजक को हिन्दी में पद-युग्मों के बीच ‘और’ तथा अन्य स्थानों पर अल्पविराम से स्वाभाविक सूची के रूप में रखा गया है।
theological_decisions:
- issue: नबी और दैवज्ञ के बीच קֹסֵם का भेद
  choice: शकुन-विचारक
  alternative: भविष्य बतानेवाला
  rationale: ‘भविष्य बतानेवाला’ נָבִיא के लिए प्रयुक्त ‘भविष्यद्वक्ता’ से अर्थगत भ्रम पैदा कर सकता है। ‘शकुन-विचारक’ दैवज्ञान की अलग और तोराह में निषिद्ध प्रथा को स्पष्ट करता है, जबकि पद का वर्णनात्मक तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सूची की काव्यात्मक लय के अनुरूप रखी गई है। ‘पुरनिया’ भारतीय हिन्दी में समुदाय के सम्मानित बुज़ुर्ग अथवा अगुए का परिचित पद है; बाकी पद औपचारिक लेकिन सामान्य पाठक के लिए सुबोध हैं।
