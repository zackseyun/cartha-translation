base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/011.yaml
  text: On the day you plant[a], you make it grow luxuriantly; and in the morning you make your seed sprout[b]. But the harvest flees away in a day of grief and incurable pain.
translation:
  language: hi
  text: जिस दिन तुम रोपती हो, तुम उसे लहलहाने देती हो, और सुबह अपने बीज को अंकुरित कर देती हो; लेकिन रोग[b] और असाध्य पीड़ा के दिन फसल गायब हो जाती है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘फसल गायब हो जाती है’ के लिए इब्रानी पदबंध कठिन है। इसे अधिक शाब्दिक रूप से ‘कटनी का ढेर’ भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘रोग के दिन’ का अनुवाद ‘दुःख के दिन’ या ‘विपत्ति के दिन’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִטְעֵךְ
  choice: तुम पौधा लगाती हो
  rationale: यह रूप शाब्दिक रूप से ‘तुम्हारा रोपना/लगाना’ है और संबोधित व्यक्ति स्त्रीलिंग एकवचन है। स्वाभाविक हिन्दी में इसे क्रियात्मक रूप दिया गया है।
- source_word: תְּשַׂגְשֵׂגִי
  choice: उसे खूब बढ़ाती हो
  rationale: क्रिया पौधे की भरपूर या लहलहाती वृद्धि कराने का भाव देती है। हिन्दी में कर्म ‘उसे’ जोड़ने से कृषि-बिंब स्पष्ट रहता है।
- source_word: זַרְעֵךְ תַּפְרִיחִי
  choice: अपने बीज को अंकुरित कर देती हो
  rationale: פרח के हिफ़ईल रूप में उगाने, अंकुरित कराने या खिलाने का कारक भाव है। बीज के संदर्भ में ‘अंकुरित कर देती हो’ सबसे स्वाभाविक है।
- source_word: נֵד קָצִיר
  choice: फसल गायब हो जाएगी
  rationale: यह कठिन पदबंध प्रसंग में आशा की गई फसल के अचानक नष्ट या लुप्त हो जाने के अर्थ में लिया गया है। नֵד को ‘ढेर’ समझने की अधिक शाब्दिक संभावना पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: בְּיוֹם נַחֲלָה
  choice: रोग ... के दिन
  rationale: यहाँ נַחֲלָה को उसके सामान्य ‘विरासत’ अर्थ के बजाय रोग, दुःख या विपत्ति के अर्थ में समझना अगले पद ‘असाध्य पीड़ा’ के समानांतर अधिक उपयुक्त है।
- source_word: וּכְאֵב אָנֽוּשׁ
  choice: और असाध्य पीड़ा
  rationale: כאב ‘पीड़ा’ है और אָנושׁ यहाँ उसकी गंभीर, निराशाजनक या असाध्य दशा व्यक्त करता है।
