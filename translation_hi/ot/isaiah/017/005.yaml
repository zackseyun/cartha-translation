base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/005.yaml
  text: And it will be as when one gathers standing grain at harvest[a], and his arm reaps the ears[b]; and it will be as when one gleans ears in the Valley of Rephaim.
translation:
  language: hi
  text: और ऐसा होगा, जैसे कटनी के समय कोई खड़ी फसल समेटता है और उसकी बाँह बालें काटती है; और ऐसा होगा, जैसे कोई रपाईम की घाटी में बालें बीनता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “रपाईम” एक स्थान का नाम है; इस नाम को वैकल्पिक रूप से “दैत्यों” से भी जोड़ा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: כֶּאֱסֹף
  choice: जैसे ... कोई ... समेटे
  rationale: כ prefixed infinitive construct comparison व्यक्त करता है। अनिश्चित कर्ता ‘कोई’ के साथ यह हिन्दी में स्वाभाविक रहते हुए सामान्य क्रिया को बनाए रखता है।
- source_word: קָצִיר
  choice: कटनी के समय
  rationale: यहाँ शब्द फसल काटने के अवसर अथवा ऋतु का बोध देता है; ‘कटनी के समय’ सामान्य आधुनिक हिन्दी में कृषि-संदर्भ स्पष्ट करता है।
- source_word: קָמָה
  choice: खड़ी फसल
  rationale: यह खेत में अभी खड़े अन्न को दर्शाता है। ‘खड़ी फसल’ सटीक और सहज हिन्दी है।
- source_word: וּזְרֹעוֹ
  choice: और उसकी बाँह
  rationale: मूल पाठ शरीर-अंग की सजीव छवि को स्पष्ट रूप से रखता है; उसे ‘हाथ से’ बनाकर सामान्यीकृत नहीं किया गया।
- source_word: שִׁבֳּלִים
  choice: बालें
  rationale: यह अन्न की बालियों को दर्शाता है। ‘बालें’ संक्षिप्त, स्वाभाविक और कृषि-चित्र के अनुकूल है।
- source_word: יִקְצוֹר
  choice: काटे
  rationale: क्रिया फसल काटने के लिए प्रयुक्त सामान्य शब्द है। ‘बालें काटे’ हिन्दी में स्पष्ट है और कटनी की छवि बनाए रखता है।
- source_word: כִּמְלַקֵּט
  choice: जैसे कोई ... बीनता हो
  rationale: לקט कटनी के बाद बची हुई उपज चुनने-बीनने की क्रिया है। ‘बालें बीनता हो’ उस विशिष्ट कृषि-भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּעֵמֶק רְפָאִים
  choice: रपाईम की घाटी में
  rationale: यह भौगोलिक नाम है, इसलिए अर्थानुवाद करने के बजाय नाम को देवनागरी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: स्थान-नाम רְפָאִים का अनुवाद
  choice: रपाईम की घाटी
  alternative: दैत्य जाति की घाटी / दैत्यों की घाटी
  rationale: संदर्भ में यह स्थान-नाम है। लिप्यंतरण भौगोलिक पहचान को सुरक्षित रखता है और नाम से जुड़े संभावित अर्थ को पाठ में निर्णायक रूप से आरोपित नहीं करता।
translation_notes:
