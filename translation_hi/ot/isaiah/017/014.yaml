language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לְ/עֵ֥ת עֶ֨רֶב֙ וְ/הִנֵּ֣ה בַלָּהָ֔ה בְּ/טֶ֥רֶם בֹּ֖קֶר אֵינֶ֑/נּוּ זֶ֚ה חֵ֣לֶק שׁוֹסֵ֔י/נוּ וְ/גוֹרָ֖ל לְ/בֹזְזֵֽי/נוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/014.yaml
  text: At evening time, look—terror! Before morning, he is no more. This is the portion of those who plunder us, and the lot of those who loot us.
translation:
  language: hi
  text: साँझ के समय, देखो—आतंक! भोर से पहले ही वह नहीं रहता। यही हमारे लुटेरों का भाग और हमें लूटनेवालों का हिस्सा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַלָּהָה
  choice: आतंक
  rationale: यह शब्द अचानक छा जानेवाले भय या दहशत को व्यक्त करता है; संक्षिप्त विस्मयात्मक वाक्य मूल की तीव्रता बनाए रखता है।
- source_word: אֵינֶנּוּ
  choice: उसका नामोनिशान नहीं रहता
  rationale: शाब्दिक अर्थ ‘वह नहीं है’ है; प्रसंग में आक्रमणकारी के अचानक पूरी तरह मिट जाने का स्वाभाविक हिन्दी बोध देता है, जबकि पुल्लिंग एकवचन की अनिश्चितता बनी रहती है।
- source_word: חֵלֶק
  choice: भाग
  rationale: किसी को मिलनेवाले नियत प्रतिफल या अंश के अर्थ में सामान्य और स्रोत-समीप शब्द।
- source_word: גּוֹרָל
  choice: हिस्सा
  rationale: मूलतः चिट्ठी द्वारा मिला भाग; यहाँ नियत परिणाम या प्राप्त हिस्से का समानांतर अर्थ है।
- source_word: שׁוֹסֵינוּ וְ...בֹזְזֵינוּ
  choice: हमें लूटनेवालों ... हमें लूट का माल बनानेवालों
  rationale: दो निकटार्थक हिब्रू कृदंतों के काव्यात्मक समानांतर को हिन्दी में हल्का शब्दभेद देकर सुरक्षित किया गया है।
theological_decisions:
- issue: אֵינֶנּוּ में निहित कर्ता की पहचान
  choice: पुल्लिंग एकवचन ‘उसका’ रखा, पर उसकी पहचान नहीं बताई
  alternative: ‘वे नहीं रहते’ या ‘आतंक नहीं रहता’
  rationale: हिब्रू व्याकरण पुल्लिंग एकवचन संकेत देता है, किंतु निकट पद में उसका स्पष्ट नाम नहीं है; इसलिए उसे किसी विशेष राजा, सेना या राष्ट्र के रूप में निर्धारित नहीं किया गया।
- issue: लुटेरों को मिलनेवाले परिणाम का स्वरूप
  choice: ‘भाग’ और ‘हिस्सा’ के न्यायपरक, किंतु निष्पक्ष शब्द
  alternative: ‘दंड’ या ‘विनाश’
  rationale: पद परिणाम को नियत भाग और चिट्ठी के रूपक से कहता है; स्पष्ट व्याख्यात्मक ‘दंड’ जोड़ना मूल से अधिक निश्चित होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली। ‘देखो—आतंक!’ मूल के וְהִנֵּה और आकस्मिक दृश्य-परिवर्तन को तीखे ढंग से रखता है। पद के अंतिम दो समानांतर खंडों में लय और अर्थभेद दोनों सुरक्षित हैं।
