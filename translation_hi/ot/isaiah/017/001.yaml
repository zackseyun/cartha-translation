source:
  edition: WLC
  text: מַשָּׂ֖א דַּמָּ֑שֶׂק הִנֵּ֤ה דַמֶּ֨שֶׂק֙ מוּסָ֣ר מֵ/עִ֔יר וְ/הָיְתָ֖ה מְעִ֥י מַפָּלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/001.yaml
  text: 'An oracle concerning Damascus: Behold[a], Damascus will be removed from being a city[b], and it will become a heap of ruins.'
translation:
  language: hi
  text: 'दमिश्क के विषय में भविष्यवाणी[a]: देखो, दमिश्क नगर न रह जाएगा[b], और वह खंडहरों का ढेर हो जाएगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दमिश्क के विषय में भार’ अथवा ‘दमिश्क के विषय में घोषणा।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक अर्थ है ‘नगर से हटा दिया जाएगा’; अर्थात वह नगर न रहेगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: भविष्यवाणी
  rationale: भविष्यद्वाणी-संबंधी शीर्षकों में यह शब्द प्रायः न्याय की गंभीर घोषणा का परिचय देता है। ‘भविष्यवाणी’ आधुनिक हिन्दी में स्वाभाविक और बोधगम्य है; पादटिप्पणी इसके अधिक शाब्दिक और व्यापक विकल्प सुरक्षित रखती है।
- source_word: דַּמָּשֶׂק
  choice: दमिश्क
  rationale: यह इस स्थान-नाम का मानक हिन्दी रूप है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह आगामी घोषणा की ओर ध्यान खींचने वाली जीवंत और गंभीर पुकार को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מוּסָר מֵעִיר
  choice: नगर न रह जाएगा
  rationale: शाब्दिक रूप ‘नगर से हटा दिया जाएगा’ यहाँ स्थानांतरण नहीं, बल्कि दमिश्क के नगर का दर्जा और स्वरूप खो देने का भाव देता है। यह अनुवाद उस आशय को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: וְהָיְתָה
  choice: और वह ... हो जाएगा
  rationale: संदर्भ में क्रिया विनाश के परिणामस्वरूप होने वाले परिवर्तन को दर्शाती है, इसलिए ‘हो जाएगा’ उपयुक्त है।
- source_word: מְעִי מַפָּלָה
  choice: खंडहरों का ढेर
  rationale: यह पद गिरावट और विनाश से बने ढेर का चित्र प्रस्तुत करता है। ‘खंडहरों का ढेर’ उस दृश्य को सहज आधुनिक हिन्दी में बनाए रखता है।
