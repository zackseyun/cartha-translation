  text: לְאֻמִּ֗ים כִּ/שְׁא֞וֹן מַ֤יִם רַבִּים֙ יִשָּׁא֔וּ/ן וְ/גָ֥עַר בּ֖/וֹ וְ/נָ֣ס מִ/מֶּרְחָ֑ק וְ/רֻדַּ֗ף כְּ/מֹ֤ץ הָרִים֙ לִ/פְנֵי ר֔וּחַ וּ/כְ/גַלְגַּ֖ל לִ/פְנֵ֥י סוּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/013.yaml
  text: The peoples roar like the roaring of many waters[a], but he rebukes it, and it flees far away, chased like chaff on the mountains before the wind[d][c][b], and like whirling dust before the storm.
translation:
  language: hi
  text: जनजातियाँ बहुत-से जल की गर्जना के समान गरजती हैं[a]; पर वह उसे डाँटता है, और वह दूर भाग जाता है[b]। वह हवा के आगे पहाड़ों पर की भूसी के समान और आँधी के आगे चक्कर खाती किसी वस्तु के समान खदेड़ा जाता है[c][d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राष्ट्र बहुत-से जल की गर्जना के समान गरजते हैं।”
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में यहाँ एकवचन रूप हैं—“वह उसे डाँटता है … वह भाग जाता है।” संभवतः अनेक जनजातियों को एक सामूहिक जनराशि या एक ही कोलाहल के रूप में देखा गया है।
    reason: alternative_reading
  - marker: c
    text: हिब्रू शब्द का अर्थ “चक्कर खाती कोई वस्तु,” “लुढ़कती वस्तु,” या “लुढ़कता सूखा पौधा” भी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: “आँधी” का अनुवाद “बवंडर” या “प्रचंड तूफान” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֻמִּים
  choice: देश-देश के लोग
  rationale: यह बहुवचन विभिन्न जनों या राष्ट्रों को सूचित करता है। ‘देश-देश के लोग’ आधुनिक हिन्दी में मानवीय सामूहिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है और ‘राष्ट्र’ के अत्यधिक राजनीतिक भाव से बचता है।
- source_word: כִּשְׁאוֹן מַיִם רַבִּים יִשָּׁאוּן
  choice: बहुत-से जल के गर्जन के समान गरजते हैं
  rationale: शब्दावली प्रचंड और बहुतायत वाले जल की ऊँची, टकराती ध्वनि पर बल देती है; ‘गर्जन…गरजते’ मूल की ध्वन्यात्मक पुनरावृत्ति को बनाए रखता है।
- source_word: וְגָעַר בּוֹ
  choice: पर वह उसे डाँटता है
  rationale: גּער अधिकारपूर्वक रोकने या धमकाकर शांत करने वाली डाँट को दर्शाता है। कर्ता मूल में अनाम है, इसलिए हिन्दी में भी केवल ‘वह’ रखा गया है; एकवचन ‘उसे’ सामूहिक जनराशि या उसके कोलाहल को एक इकाई के रूप में प्रस्तुत करता है।
- source_word: וְנָס מִמֶּרְחָק
  choice: और वह दूर भाग जाता है
  rationale: एकवचन क्रिया को सुरक्षित रखा गया है। ממרחק यहाँ बहुत दूर हट जाने का भाव देता है, जिसे ‘दूर भाग जाता है’ सहज हिन्दी में व्यक्त करता है।
- source_word: וְרֻדַּף כְּמֹץ הָרִים לִפְנֵי רוּחַ
  choice: वह हवा के आगे पहाड़ों की भूसी के समान … खदेड़ा जाता है
  rationale: पुअल रूप बाहरी शक्ति द्वारा खदेड़े जाने का निष्क्रिय भाव रखता है। מֹץ के लिए ‘भूसी’ सामान्य हिन्दी में हवा से उड़ने वाले हलके अनाज-अवशेष की परिचित छवि देता है; ‘पहाड़ों की’ मूल के संक्षिप्त संबंध को यथासंभव बनाए रखता है।
- source_word: וּכְגַלְגַּל לִפְנֵי סוּפָה
  choice: और आँधी के आगे उड़ते-फिरते धूल-कणों के समान
  rationale: גַלְגַּל यहाँ लुढ़कती या चक्कर खाती हलकी वस्तु के लिए अस्पष्ट काव्यात्मक पद है। ‘उड़ते-फिरते धूल-कण’ गति और हलके मलबे की छवि देता है, जबकि पादटिप्पणी अन्य संभावनाएँ सुरक्षित रखती है। סוּפָה के लिए ‘आँधी’ हिंसक तूफानी हवा का स्वाभाविक हिन्दी पर्याय है।
theological_decisions:
- issue: बहुवचन ‘लोगों’ के बाद एकवचन सर्वनाम और क्रियाएँ
  choice: ‘उसे … वह दूर भाग जाता है … खदेड़ा जाता है’ द्वारा हिब्रू का एकवचन रखा गया है।
  alternative: हिन्दी व्याकरण को सरल बनाने के लिए ‘उन्हें … वे दूर भाग जाते हैं … खदेड़े जाते हैं’ कहना।
  rationale: וְגָעַר בּוֹ, וְנָס और וְרֻדַּף एकवचन हैं और संभवतः बहुत-से लोगों को एक सामूहिक जनराशि या कोलाहल मानते हैं। बहुवचन करने से मूल का अर्थपूर्ण व्याकरणिक परिवर्तन मिट जाता।
- issue: डाँटने वाले की पहचान
  choice: मूल की तरह केवल ‘वह’ रखकर कर्ता को निहित छोड़ा गया है।
  alternative: संदर्भ के आधार पर ‘यहोवा’ या ‘परमेश्वर’ स्पष्ट रूप से जोड़ना।
  rationale: व्यापक संदर्भ में डाँटने वाला परमेश्वर समझा जा सकता है, पर इस पद में उसका नाम नहीं है। नाम जोड़ना मूल की अंतर्निहितता को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, साहित्यिक किंतु सहज हिन्दी में रखी गई है। जल का गर्जन, हवा में उड़ती भूसी और आँधी में चक्कर खाते हलके कण—इन तीनों काव्यात्मक चित्रों को स्पष्ट रखा गया है। जानबूझकर रखे गए एकवचन रूप हिन्दी में कुछ असामान्य लग सकते हैं, पर वे हिब्रू के सामूहिक दृष्टिकोण और उसकी अर्थपूर्ण अस्पष्टता को सुरक्षित रखते हैं।
