  text: בַּ/יּ֣וֹם הַ/ה֔וּא יִשְׁעֶ֥ה הָ/אָדָ֖ם עַל עֹשֵׂ֑/הוּ וְ/עֵינָ֕י/ו אֶל קְד֥וֹשׁ יִשְׂרָאֵ֖ל תִּרְאֶֽינָה־־׃
base_translation:
