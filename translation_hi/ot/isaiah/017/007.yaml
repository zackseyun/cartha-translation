  yaml_path: translation/ot/isaiah/017/007.yaml
  text: In that day man will look to his Maker[b][a], and his eyes will look to the Holy One of Israel.
translation:
  language: hi
  text: उस दिन मनुष्य अपने बनानेवाले की ओर दृष्टि करेगा, और उसकी आँखें इस्राएल के पवित्र की ओर देखेंगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: भविष्यवाणी के इस प्रचलित काल-सूचक मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है; हिन्दी में ‘उस दिन’ ही ‘उस दिन में’ की अपेक्षा अधिक सहज है।
- source_word: יִשְׁעֶה
  choice: ध्यान लगाएगा
  rationale: यहाँ क्रिया किसी की ओर अपना ध्यान या सरोकार लगाने का भाव रखती है। यह समानांतर पंक्ति के देखने के बिंब को बनाए रखती है, पर ‘भरोसा करेगा’ या ‘मन फिराएगा’ जैसी अधिक स्पष्ट धार्मिक व्याख्या नहीं जोड़ती।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: एकवचन सामूहिक प्रतिनिधि रूप को सुरक्षित रखता है और आधुनिक हिन्दी में सामान्य मानव के लिए स्वाभाविक है।
- source_word: עַל
  choice: की ओर
  rationale: שׁעה के साथ दिशा और अभिमुखता व्यक्त करता है; शाब्दिक ‘पर’ हिन्दी में अप्राकृतिक और भ्रामक होता।
- source_word: עֹשֵׂהוּ
  choice: अपने बनानेवाले
  rationale: ‘जिसने उसे बनाया’ के व्यक्तिगत संबंध को संक्षिप्त रूप में सुरक्षित रखता है। ‘अपने’ का संबंध प्रतिनिधि एकवचन ‘मनुष्य’ से है।
- source_word: וְעֵינָיו
  choice: और उसकी आँखें
  rationale: इब्रानी कविता के शारीरिक बिंब और दोनों पंक्तियों की समानांतरता को यथासंभव अक्षुण्ण रखता है।
- source_word: אֶל
  choice: की ओर
  rationale: लक्ष्य की दिशा बतानेवाले सरल संबंधसूचक का स्वाभाविक हिन्दी रूप।
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: इस्राएल के पवित्र परमेश्वर
  rationale: यशायाह में प्रयुक्त विशिष्ट ईश्वरीय उपाधि को अर्थपूर्ण और स्वाभाविक हिन्दी में व्यक्त करता है; ‘परमेश्वर’ जोड़ने से हिन्दी पाठक के लिए उपाधि का दैवी संदर्भ स्पष्ट होता है।
- source_word: תִּרְאֶינָה
  choice: लगी रहेंगी
  rationale: शाब्दिक अर्थ ‘देखेंगी’ है, पर ‘आँखें ... की ओर लगी रहेंगी’ हिन्दी में लक्ष्य की ओर सचेत दृष्टि का स्वाभाविक मुहावरा है और पहली पंक्ति के अभिमुख ध्यान से समानांतरता रखता है।
theological_decisions:
- issue: הָאָדָם का प्रतिनिधि एकवचन
  choice: मनुष्य
  alternative: मानवजाति
  rationale: इब्रानी में रूप व्याकरणतः एकवचन है, किंतु सामान्य मानवता का प्रतिनिधित्व करता है। ‘मनुष्य’ दोनों पहलुओं को बिना अमूर्त बहुवचन बनाए सुरक्षित रखता है।
- issue: क्या पद में भरोसा या पश्चाताप स्पष्ट कर दिया जाए
  choice: ध्यान लगाएगा
  alternative: भरोसा करेगा / मन फिराएगा
  rationale: संदर्भ परमेश्वर की ओर नई अभिमुखता का संकेत दे सकता है, पर प्रयुक्त क्रिया सीधे ‘भरोसा’ या ‘पश्चाताप’ नहीं कहती। इसलिए निहित धार्मिक अर्थ को व्याख्या बनाकर पाठ में नहीं जोड़ा गया।
- issue: קְדוֹשׁ יִשְׂרָאֵל में निहित दैवी उपाधि
  choice: इस्राएल के पवित्र परमेश्वर
  alternative: इस्राएल के पवित्र जन
  rationale: यह यशायाह की स्थापित दैवी उपाधि है। ‘पवित्र परमेश्वर’ आधुनिक हिन्दी में संदर्भ को स्पष्ट और गरिमापूर्ण रखता है, जबकि ‘पवित्र जन’ मानव व्यक्ति का भ्रम उत्पन्न कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण भविष्यवाणी-काव्य शैली। ‘मनुष्य’ प्रतिनिधि एकवचन है। दोनों अर्धपंक्तियों में परमेश्वर की ओर अभिमुख होने की समानांतर छवि रखी गई है; अनावश्यक रूप से ‘भरोसा’ या ‘पश्चाताप’ नहीं जोड़ा गया।
