source:
  edition: WLC
  text: כִּ֤י שָׁכַ֨חַתְּ֙ אֱלֹהֵ֣י יִשְׁעֵ֔/ךְ וְ/צ֥וּר מָעֻזֵּ֖/ךְ לֹ֣א זָכָ֑רְתְּ עַל כֵּ֗ן תִּטְּעִי֙ נִטְעֵ֣י נַעֲמָנִ֔ים וּ/זְמֹ֥רַת זָ֖ר תִּזְרָעֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/010.yaml
  text: For you have forgotten the God of your salvation[a], and have not remembered the Rock of your refuge[c][b]; therefore you plant pleasant plants and sow it with a foreign vine.
translation:
  language: hi
  text: क्योंकि तुम अपने उद्धार के परमेश्वर को भूल गई हो और अपनी शरण की चट्टान को याद नहीं किया है। इसलिए तुम मनभावने पौधे[a] लगाती हो और उनमें परदेशी बेल की कलम[b] रोपती हो।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चुने हुए रोपण’; सम्भव है कि यह विदेशी धार्मिक प्रथाओं में प्रयुक्त उगाए गए पौधों की ओर संकेत हो।
    reason: lexical_alternative
  - marker: b
    text: या ‘अजनबी कलम’ अथवा ‘परदेशी अंकुर’।
    reason: lexical_alternative
  - marker: c
    text: यह कृषि-चित्रण शायद यह संकेत करता है कि लोग यहोवा के बजाय विदेशी उपासना-पद्धतियों या राजनीतिक गठजोड़ों पर भरोसा कर रहे थे, पर इब्रानी पाठ इसे स्पष्ट रूप से नहीं कहता।
    reason: cultural_note
lexical_decisions:
- source_word: שָׁכַחַתְּ
  choice: भूल गई हो
  rationale: काल रूप पूर्ण क्रिया और उसके वर्तमान परिणाम को व्यक्त करता है; स्त्रीलिंग एकवचन संबोधन को भी बनाए रखता है।
- source_word: אֱלֹהֵי יִשְׁעֵךְ
  choice: अपने उद्धार के परमेश्वर
  rationale: सम्बन्धवाचक पदबंध और יֵשַׁע के संज्ञात्मक अर्थ ‘उद्धार’ को सुरक्षित रखता है।
- source_word: צוּר מָעֻזֵּךְ
  choice: अपनी शरण की चट्टान
  rationale: ईश्वर के स्थिर रक्षक होने की चट्टान-वाली उपमा और מָעוֹז के संरक्षणार्थक भाव को बनाए रखता है।
- source_word: לֹא זָכָרְתְּ
  choice: याद नहीं किया
  rationale: ‘भूल गई हो’ के समानांतर रहते हुए मूल क्रिया ‘स्मरण करना’ का सीधा अर्थ देता है।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: कारण से निकलने वाले परिणाम को सहज और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: תִּטְּעִי
  choice: लगाती हो
  rationale: अपूर्ण क्रिया को प्रसंग में वर्तमान व्यवहार के सजीव वर्णन के रूप में लिया गया है; स्त्रीलिंग एकवचन संबोधन सुरक्षित है।
- source_word: נִטְעֵי נַעֲמָנִים
  choice: मनभावने पौधे
  rationale: वांछनीय या सुखद रोपण का अर्थ रखता है और किसी विशिष्ट उपासना-पद्धति को मुख्य पाठ में नहीं जोड़ता।
- source_word: זְמֹרַת זָר
  choice: परदेशी बेल की कलम
  rationale: זְמֹרָה के बेल की डाली अथवा कलम होने और זָר के परदेशी/अजनबी भाव, दोनों को कृषि-संदर्भ में स्पष्ट करता है।
- source_word: תִּזְרָעֶנּוּ
  choice: उनमें ... रोपती हो
  rationale: זרע का मूल भाव बोना है, पर बेल की कलम के साथ हिन्दी में ‘रोपना’ स्वाभाविक है; प्रत्यय का सामूहिक संदर्भ ‘उनमें’ से व्यक्त होता है।
theological_decisions:
- issue: क्या कृषि-चित्रण को मुख्य पाठ में स्पष्ट रूप से मूर्तिपूजक कर्म या विदेशी राजनीतिक गठजोड़ कहा जाए
  choice: कृषि-चित्रण को उसी रूप में रखा गया है और सम्भावित धार्मिक या राजनीतिक संकेत को टिप्पणी में बताया गया है।
  alternative: ‘मूर्तिपूजक उपवन’ अथवा विदेशी शक्तियों पर निर्भरता को मुख्य पाठ में स्पष्ट कर देना।
  rationale: परमेश्वर को भूलने का प्रसंग अनुचित धार्मिक या राजनीतिक भरोसे की ओर संकेत कर सकता है, पर इब्रानी पाठ इसे प्रत्यक्ष रूप से नहीं कहता; इसलिए उसकी अर्थगत खुली जगह और धार्मिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तुम ... गई हो/लगाती हो’ मूल के स्त्रीलिंग एकवचन संबोधन को दर्शाता है, सम्भवतः नगर या समुदाय को व्यक्तिरूप में संबोधित करते हुए। ‘चट्टान’ की बाइबिलीय उपमा और कृषि-चित्रण दोनों सुरक्षित हैं।
