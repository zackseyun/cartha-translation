base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/002.yaml
  text: The cities of Aroer are abandoned[a]; they will be for flocks[b], and they will lie down with no one to make them afraid.
translation:
  language: hi
  text: अरोएर के नगर उजाड़ पड़े हैं[a]; वे पशुओं के झुंडों के लिए हो जाएँगे[b]। वे झुंड वहाँ लेटेंगे, और उन्हें डराने वाला कोई न होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘त्याग दिए गए हैं’ अथवा ‘निर्जन पड़े हैं’।
    reason: lexical_alternative
  - marker: b
    text: ‘पशुओं के झुंड’ का अनुवाद ‘रेवड़ों’ अथवा ‘झुंडों’ भी हो सकता है; आशय है कि उजड़े हुए नगर पशुओं के चरने और विश्राम करने की जगह बन जाएँगे।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזֻבוֹת
  choice: उजाड़ पड़े हैं
  rationale: यह עזב का स्त्रीलिंग बहुवचन निष्क्रिय कृदंत है और नगरों के त्यागे या निर्जन पड़े होने की अवस्था बताता है। ‘उजाड़ पड़े हैं’ आधुनिक हिन्दी में स्वाभाविक है और निर्जनता का दृश्य स्पष्ट रखता है।
- source_word: עָרֵי
  choice: नगर
  rationale: עִיר का बहुवचन संबंधरूप है। ‘नगर’ भविष्यद्वाणी की गरिमामय शैली में स्वाभाविक है और बड़े या छोटे आबादी-केंद्र दोनों के लिए पर्याप्त व्यापक है।
- source_word: עֲרֹעֵר
  choice: अरोएर
  rationale: स्थान-नाम को हिन्दी ध्वन्यात्मक रूप में लिप्यंतरित किया गया है।
- source_word: לַעֲדָרִים
  choice: भेड़-बकरियों के झुंडों के लिए
  rationale: עֵדֶר चरने वाले पशुओं के झुंड को सूचित कर सकता है। हिन्दी में केवल ‘झुंडों’ की अपेक्षा ‘भेड़-बकरियों के झुंडों’ से पशु-संबंधी अर्थ तुरंत स्पष्ट होता है, जबकि पादटिप्पणी व्यापक अर्थ सुरक्षित रखती है।
- source_word: תִּהְיֶינָה
  choice: वे ... हो जाएँगे
  rationale: היה का यह स्त्रीलिंग बहुवचन रूप भविष्य की अवस्था बताता है। ‘हो जाएँगे’ त्यागे हुए नगरों के पशुओं की जगह बन जाने का स्वाभाविक हिन्दी रूप है।
- source_word: וְרָבְצוּ
  choice: वे वहाँ लेटेंगे
  rationale: רבץ प्रायः पशुओं के बैठने या लेटकर विश्राम करने के लिए आता है। निकटतम बहुवचन संज्ञा ‘झुंड’ होने के कारण यहाँ पशु कर्ता समझे गए हैं; ‘वहाँ’ हिन्दी में संदर्भित स्थान को सहजता से स्पष्ट करता है।
- source_word: וְאֵין מַחֲרִיד
  choice: और उन्हें डराने वाला कोई न होगा
  rationale: यह मुहावरा बिना बाधा और भय के पड़े रहने का भाव देता है। निहित कर्म ‘उन्हें’ स्पष्ट करने से हिन्दी स्वाभाविक बनती है और मूल अर्थ बना रहता है।
