source:
  edition: WLC
  text: בַּ/יּ֨וֹם הַ/ה֜וּא יִהְי֣וּ עָרֵ֣י מָעֻזּ֗/וֹ כַּ/עֲזוּבַ֤ת הַ/חֹ֨רֶשׁ֙ וְ/הָ֣/אָמִ֔יר אֲשֶׁ֣ר עָזְב֔וּ מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָיְתָ֖ה שְׁמָמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/009.yaml
  text: In that day his fortified cities will be like the deserted places of the forest and the treetop[a], which they abandoned before the sons of Israel[b]; and it will become a desolation.
translation:
  language: hi
  text: उस दिन उसके किलेबंद नगर वन में और वृक्ष की चोटी पर स्थित छोड़े हुए स्थानों के समान होंगे[a], जिन्हें वे इस्राएल के पुत्रों के सामने से छोड़ गए थे[b]; और वह उजाड़ हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सबसे ऊपरी डाल’। इब्रानी शब्द वृक्ष के सबसे ऊपरी भाग को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जिन्हें वे इस्राएल के पुत्रों के कारण छोड़ गए थे।’ इब्रानी अभिव्यक्ति इस्राएल की उपस्थिति के सामने से पीछे हटने का भाव भी दे सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यद्वाणी में प्रयुक्त मानक काल-सूचक वाक्यांश है; आधुनिक हिन्दी में ‘उस दिन’ स्वाभाविक और स्पष्ट है।
- source_word: עָרֵי מָעֻזּוֹ
  choice: उसके किलेबंद नगर
  rationale: מָעוֹז दृढ़ या सुरक्षित स्थान/गढ़ का बोध कराता है। ‘किलेबंद नगर’ अर्थ को सहज हिन्दी में व्यक्त करता है और एकवचन पुल्लिंग प्रत्यय को ‘उसके’ द्वारा बनाए रखता है।
- source_word: כַּעֲזוּבַת הַחֹרֶשׁ
  choice: वन के उन उजाड़ स्थानों के समान
  rationale: עֲזוּבַת छोड़ दिए जाने या उजाड़ दशा का बोध कराता है और חֹרֶשׁ वन अथवा घनी वनस्पति को। हिन्दी में बहुवचन ‘उजाड़ स्थानों’ से नगरों के साथ तुलना स्पष्ट और स्वाभाविक बनती है।
- source_word: וְהָאָמִיר
  choice: और वृक्ष की चोटी
  rationale: אָמִיר वृक्ष के सबसे ऊपरी भाग, ऊपरी डाल या शिखर को सूचित कर सकता है। ‘वृक्ष की चोटी’ सामान्य पाठक के लिए स्पष्ट है; निकट विकल्प पाद-टिप्पणी में रखा गया है।
- source_word: אֲשֶׁר עָזְבוּ
  choice: जिन्हें वे ... छोड़ गए थे
  rationale: बहुवचन क्रिया עָזְבוּ के अनिर्दिष्ट कर्ता को मूल की तरह ‘वे’ ही रहने दिया गया है और सक्रिय क्रिया-बल सुरक्षित रखा गया है।
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के सामने से
  rationale: מִפְּנֵי में किसी की उपस्थिति के सामने से हटने या पीछे हटने का भाव हो सकता है। ‘सामने से’ इस स्थानिक मुहावरे को सुरक्षित रखता है; संभावित कारणवाचक अर्थ पाद-टिप्पणी में दिया गया है। בְּנֵי יִשְׂרָאֵל का रूप ‘इस्राएल के पुत्रों’ के रूप में रखा गया है।
- source_word: וְהָיְתָה שְׁמָמָה
  choice: और वह उजाड़ हो जाएगा
  rationale: यह वाक्यांश परिणामी वीरानी व्यक्त करता है। ‘उजाड़ हो जाएगा’ उस परिवर्तन/परिणाम को सहज हिन्दी में व्यक्त करता है, जबकि सर्वनाम का संदर्भ मूल की तरह खुला रहता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל में लिंग-सूचक जातिनाम
  choice: इस्राएल के पुत्र
  alternative: इस्राएली / इस्राएल के लोग
  rationale: मूल इब्रानी की पुरुषवाची संरचना और उसके अंतरपाठीय स्वर को सुरक्षित रखने के लिए शाब्दिक रूप चुना गया है; इससे कोई अतिरिक्त सांप्रदायिक अर्थ नहीं जोड़ा गया।
- issue: מִפְּנֵי का स्थानिक अथवा कारणवाचक संबंध
  choice: इस्राएल के पुत्रों के सामने से
  alternative: इस्राएल के पुत्रों के कारण
  rationale: मुख्य पाठ में पीछे हटने/उपस्थिति के सामने से चले जाने का वास्तविक इब्रानी तनाव सुरक्षित रखा गया है; कारणवाचक संभावना को पाद-टिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट भविष्यद्वाणी-शैली रखी गई है। ‘किलेबंद नगर’ और ‘उजाड़ स्थान’ सामान्य पाठक के लिए सहज हैं। कठिन वृक्ष-संबंधी बिंब तथा מִפְּנֵי की वास्तविक अर्थगत अस्पष्टता पाद-टिप्पणियों में सुरक्षित रखी गई है।
