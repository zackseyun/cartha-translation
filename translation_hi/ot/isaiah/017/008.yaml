base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/008.yaml
  text: And he will not look to the altars[a], the work of his hands[b], and he will not regard what his fingers have made—the Asherim and the incense altars.
translation:
  language: hi
  text: वह उन वेदियों की ओर ध्यान नहीं देगा, जो उसके हाथों का काम हैं; और जो कुछ उसकी उँगलियों ने बनाया है, उस पर वह दृष्टि नहीं डालेगा—न अशेरिम[a] पर, न सूर्य-पूजा से जुड़े पंथ-स्तंभों[b] पर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द अशेरा की उपासना से जुड़ी पंथ-वस्तुओं के लिए है; इसे “अशेरा-खंभे” या “अशेरा की प्रतिमाएँ” भी समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का सटीक अर्थ अनिश्चित है; संभवतः सूर्य-पूजा से जुड़े स्तंभ, सूर्य-प्रतिमाएँ, या धूप-वेदियाँ अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁעֶה
  choice: की ओर ध्यान नहीं देगा
  rationale: यहाँ क्रिया केवल देखने नहीं, बल्कि श्रद्धा या भरोसे के साथ किसी ओर ध्यान लगाने का भाव रखती है।
- source_word: הַמִּזְבְּחוֹת
  choice: वेदियों
  rationale: यह सामान्य और सटीक धार्मिक शब्द है; संदर्भ स्वयं बताता है कि ये मनुष्य की बनाई उपासना-वस्तुएँ हैं।
- source_word: מַעֲשֵׂה יָדָיו
  choice: उसके अपने हाथों का काम
  rationale: हिब्रू की ठोस छवि और मनुष्य-निर्मित उपासना-वस्तुओं के विरुद्ध भविष्यद्वक्ता की आलोचना सुरक्षित रहती है।
- source_word: וַאֲשֶׁר עָשׂוּ אֶצְבְּעֹתָיו
  choice: जो कुछ उसकी उँगलियों ने बनाया है
  rationale: मूल की उँगलियों वाली सजीव छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יִרְאֶה
  choice: उसकी ओर वह दृष्टि नहीं करेगा
  rationale: समानांतर पंक्ति में इसका अर्थ ध्यानपूर्वक या आदर से देखने का है; यह पहले खंड की पुनरावृत्ति किए बिना उस भाव को रखता है।
- source_word: הָאֲשֵׁרִים
  choice: अशेरा-स्तंभों
  rationale: यह अशेरा की उपासना से जुड़ी पंथ-वस्तुओं का बोध कराता है। हिन्दी पाठक के लिए पहचान योग्य रूप दिया गया है, जबकि वस्तु का सटीक स्वरूप पादटिप्पणी में अनिश्चित रखा गया है।
- source_word: הַחַמָּנִים
  choice: सूर्य-स्तंभों
  rationale: यह कठिन पंथ-संबंधी शब्द संभवतः सूर्य-पूजा से जुड़े स्तंभों या प्रतिमाओं का सूचक है; सटीक स्वरूप की अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
theological_decisions:
- issue: मूर्तिपूजक पंथ-वस्तुओं का निरूपण
  choice: ठोस उपासना-वस्तुओं के नाम देना और उनकी अनिश्चित पहचान पादटिप्पणियों में बताना
  alternative: मुख्य पाठ में सामान्य रूप से “मूर्तियाँ” कहना
  rationale: इससे मनुष्य के हाथों बनी वस्तुओं पर भरोसा न करने का मूल वाद-विवाद स्पष्ट रहता है, पर पाठ में अतिरिक्त सांप्रदायिक व्याख्या नहीं जोड़ी जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट भविष्यद्वाणी-शैली रखी गई है। “अपने हाथों” और “उँगलियों” की समानांतर छवि मूल के व्यंग्य और बल को बनाए रखती है; दुर्लभ पंथ-संबंधी शब्दों को मुख्य पाठ में संक्षिप्त और पादटिप्पणियों में सावधानी से समझाया गया है।
