base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/003.yaml
  text: And the fortress will cease from Ephraim[a], and the kingdom from Damascus; and the remnant of Aram will be like the glory of the sons of Israel[b], declares Yahweh of hosts.
translation:
  language: hi
  text: एप्रैम से गढ़ और दमिश्क से राज्य समाप्त हो जाएगा; और अराम के बचे हुए लोग इस्राएल के पुत्रों के वैभव के समान होंगे[a]—सेनाओं के यहोवा की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वैभव’ का अनुवाद ‘महिमा’ या ‘सम्मान’ भी हो सकता है। यह तुलना संभवतः अराम के बचे हुए लोगों की उस दशा की ओर संकेत करती है जो इस्राएल के पुत्रों के वैभव के समान होगी; पर इब्रानी पाठ समानता का ठीक आधार स्पष्ट नहीं करता। निकटवर्ती संदर्भ में दोनों की घटती दशा का संकेत देखा जा सकता है, किंतु यह पद स्वयं उसे स्पष्ट रूप से नहीं कहता।
    reason: lexical_alternative; alternative_reading
lexical_decisions:
- source_word: וְנִשְׁבַּת
  choice: मिट जाएगा
  rationale: निफ़अल रूप यहाँ किसी वस्तु के समाप्त या हटा दिए जाने को दर्शाता है। हिंदी में ‘मिट जाएगा’ स्वाभाविक है और विनाश की रीति को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: מִבְצָר
  choice: गढ़
  rationale: यह किसी किलेबंद स्थान या सैन्य दुर्ग को सूचित करता है। ‘गढ़’ संक्षिप्त, ठोस और आधुनिक हिंदी में बोधगम्य है।
- source_word: מֵאֶפְרַיִם
  choice: एप्रैम से
  rationale: इब्रानी में दिए गए क्षेत्रीय/वंशीय नाम को ‘इस्राएल’ के रूप में व्याख्यायित किए बिना बनाए रखा गया है।
- source_word: וּמַמְלָכָה מִדַּמֶּשֶׂק
  choice: और दमिश्क से राज्य
  rationale: מַמְלָכָה का राजनीतिक अर्थ ‘राज्य’ है; समानांतर वाक्य-रचना में ‘मिट जाएगा’ दोनों संज्ञाओं पर लागू होता है।
- source_word: וּשְׁאָר אֲרָם
  choice: और अराम के बचे हुए लोग
  rationale: שְׁאָר शेष या बचे हुए अंश को दर्शाता है। संदर्भ में जनसमुदाय के लिए ‘बचे हुए लोग’ सहज हिंदी है और ‘अराम’ मूल स्थान-नाम को सुरक्षित रखता है।
- source_word: כִּכְבוֹד
  choice: वैभव के समान
  rationale: כָּבוֹד में महिमा, सम्मान या वैभव का भाव हो सकता है। यहाँ ‘वैभव’ तुलना को स्वाभाविक बनाता है, पर तुलना का आशय स्पष्ट करके मूल की अनिश्चितता नहीं मिटाता।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल का स्पष्ट पुरुषवाची बहुवचन औपचारिक रूप से सुरक्षित रखा गया है।
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: यह सेनाओं के यहोवा की घोषणा है
  rationale: נְאֻם भविष्यद्वाणी की घोषणा का सूत्र है। परमेश्वर का व्यक्तिगत नाम ‘यहोवा’ और צְבָאוֹת का अर्थ ‘सेनाओं’ रखा गया है।
theological_decisions:
- issue: अराम के बचे हुए लोगों और इस्राएल के पुत्रों के वैभव के बीच तुलना का आशय
  choice: मुख्य पाठ में तुलना को अस्पष्ट रखा गया है।
  alternative: इसे स्पष्ट रूप से अराम और इस्राएल की समान भावी अवनति अथवा घटती प्रतिष्ठा के रूप में व्यक्त किया जा सकता था।
  rationale: इब्रानी पाठ समानता का आधार नहीं बताता। निकटवर्ती संदर्भ अवनति की ओर संकेत कर सकता है, पर उसे पद के भीतर जोड़ना व्याख्यात्मक निर्णय होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और भविष्यद्वाणी के अनुरूप रखी गई है। समानांतर इब्रानी संरचना को हिंदी में अर्धविराम द्वारा स्पष्ट किया गया है और मूल की प्रमुख व्याख्यात्मक अस्पष्टता पाद-टिप्पणी सहित सुरक्षित रखी गई है।
