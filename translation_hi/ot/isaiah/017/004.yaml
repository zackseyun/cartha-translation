  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא יִדַּ֖ל כְּב֣וֹד יַעֲקֹ֑ב וּ/מִשְׁמַ֥ן בְּשָׂר֖/וֹ יֵרָזֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/004.yaml
  text: And in that day the glory of Jacob will become thin[b][a], and the fatness of his flesh will waste away.
translation:
  language: hi
  text: उस दिन याकूब का वैभव घट जाएगा[a], और उसके शरीर की चर्बी क्षीण हो जाएगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्षीण हो जाएगा।” हिब्रू क्रिया का अर्थ कम, दुर्बल, या पतला हो जाना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसका हृष्ट-पुष्ट शरीर दुबला हो जाएगा।” शारीरिक मोटाई और दुबलेपन का यह बिंब याकूब की शक्ति और समृद्धि के क्षय को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: हिब्रू का प्रचलित भविष्यसूचक काल-सूत्र हिन्दी में स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त होता है; भविष्यकाल की क्रियाएँ घटना की भावी प्रकृति स्पष्ट करती हैं।
- source_word: יִדַּל
  choice: घट जाएगा
  rationale: דלל का अर्थ कम, दुर्बल या क्षीण होना हो सकता है। 'घट जाएगा' वैभव के साथ स्वाभाविक है और अर्थ को केवल शारीरिक दुबलेपन तक सीमित नहीं करता।
- source_word: כְּבוֹד
  choice: वैभव
  rationale: यहाँ כבוד याकूब की प्रतिष्ठा, समृद्धि और राष्ट्रीय भव्यता को समेटता है। 'वैभव' आधुनिक हिन्दी में इस व्यापक भाव को सहज रूप से रखता है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: मूल पाठ के वाचायी और राष्ट्रीय नाम को बिना व्याख्यात्मक प्रतिस्थापन के ज्यों का त्यों रखा गया है।
- source_word: וּמִשְׁמַן בְּשָׂרוֹ
  choice: और उसके शरीर की चर्बी
  rationale: शारीरिक मोटाई और समृद्धि की ठोस उपमा को बनाए रखा गया है। हिन्दी में 'शरीर की चर्बी' 'मांस की चर्बी' से अधिक स्वाभाविक है।
- source_word: יֵרָזֶה
  choice: सूख जाएगी
  rationale: रזה का भाव दुबला या क्षीण हो जाना है। 'सूख जाएगी' विनाशकारी क्षीणता को स्वाभाविक हिन्दी में व्यक्त करते हुए शारीरिक बिंब बनाए रखता है।
theological_decisions:
- issue: '''याकूब'' का संदर्भ'
  choice: '''याकूब'' नाम को मुख्य पाठ में बनाए रखा गया'
  alternative: '''इस्राएल'' या ''याकूब के लोग'''
  rationale: संदर्भ में यह नाम राष्ट्र या लोगों की ओर संकेत करता है, फिर भी हिब्रू पाठ स्वयं 'याकूब' कहता है। नाम को बनाए रखने से वाचायी और भविष्यसूचक अनुगूँज सुरक्षित रहती है।
- issue: शारीरिक बिंब और राष्ट्रीय पतन का संबंध
  choice: वैभव के घटने और शरीर की चर्बी सूखने—दोनों बिंबों को बनाए रखा गया
  alternative: पूरी पंक्ति को केवल शक्ति और समृद्धि के नाश के रूप में अमूर्त करना
  rationale: हिब्रू राष्ट्रीय अपमान और क्षय को शारीरिक दुबलेपन के माध्यम से चित्रित करता है; अनुवाद इस तनाव को समझाकर समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण भविष्यसूचक शैली। 'वैभव' और 'शरीर की चर्बी' क्रमशः व्यापक सामाजिक प्रतिष्ठा तथा मूल के ठोस शारीरिक बिंब को सुरक्षित रखते हैं।
