reference: Isaiah 17:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נִשְׁאַר בּ֤/וֹ עֽוֹלֵלֹת֙ כְּ/נֹ֣קֶף זַ֔יִת שְׁנַ֧יִם שְׁלֹשָׁ֛ה גַּרְגְּרִ֖ים בְּ/רֹ֣אשׁ אָמִ֑יר אַרְבָּעָ֣ה חֲמִשָּׁ֗ה בִּ/סְעִפֶ֨י/הָ֙ פֹּֽרִיָּ֔ה נְאֻם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/006.yaml
  text: 'Yet gleanings will be left in it[a], as when an olive tree is beaten: two or three berries at the top of the highest bough, four or five on its fruitful branches, declares Yahweh, the God of Israel.'
translation:
  language: hi
  text: 'फिर भी उसमें बीनने के लिए कुछ फल रह जाएँगे,

    जैसे जैतून के पेड़ को झाड़ने के बाद

    सबसे ऊँची डाल की चोटी पर दो या तीन जैतून

    और उसकी फलदार शाखाओं में चार या पाँच रह जाते हैं।

    यह यहोवा, इस्राएल के परमेश्वर, की घोषणा है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִשְׁאַר בּוֹ
  choice: फिर भी उसमें ... रह जाएँगे
  rationale: निफ़ाल रूप शेष रह जाने का भाव देता है; प्रसंग में וְ का विरोधात्मक बल ‘फिर भी’ से स्वाभाविक रूप में व्यक्त होता है। בּוֹ को तटस्थ ढंग से ‘उसमें’ रखा गया है।
- source_word: עֹלֵלֹת
  choice: कुछ फल बीनने के लिए
  rationale: यह शब्द कटनी के बाद बीनने के लिए छूटे हुए फल को दर्शाता है। हिंदी में केवल ‘बिनाई’ की अपेक्षा यह वाक्यांश अधिक सहज और स्पष्ट है।
- source_word: כְּנֹקֶף זַיִת
  choice: जैसे जैतून के पेड़ को झाड़ने पर
  rationale: נֹקֶף जैतून उतारने के लिए पेड़ को मारने या झाड़ने की क्रिया को दर्शाता है; ‘झाड़ने’ से कटाई की छवि स्वाभाविक हिंदी में बनी रहती है।
- source_word: גַּרְגְּרִים
  choice: जैतून
  rationale: शब्द का मूल अर्थ अलग-अलग दाने या छोटे फल है; जैतून के पेड़ के स्पष्ट संदर्भ में ‘जैतून’ हिंदी पाठक के लिए सटीक और सहज है।
- source_word: בְּרֹאשׁ אָמִיר
  choice: सबसे ऊँची डाल की चोटी पर
  rationale: רֹאשׁ ‘चोटी’ और אָמִיר ऊपरी अथवा शीर्षस्थ डाल को सूचित करता है; इस अनुवाद में ऊँचाई और स्थान दोनों सुरक्षित हैं।
- source_word: בִּסְעִפֶיהָ פֹּרִיָּה
  choice: उसकी फलदार शाखाओं पर
  rationale: स्त्रीलिंग प्रत्यय जैतून के पेड़ की ओर लौटता है और פֹּרִיָּה शाखाओं के फलदार होने का वर्णन करता है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की घोषणा है
  rationale: मानक नबूवत-सूत्र को गरिमापूर्ण आधुनिक हिंदी में रखा गया है और व्यक्तिगत दिव्य नाम को नाम के रूप में सुरक्षित किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: मूल रचना का सीधा और स्वाभाविक हिंदी रूप, जो परमेश्वर की इस्राएल से पहचान को पूर्णतः बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे उपस्थित है। हिंदी में व्यापक रूप से पहचाने जाने वाले नामरूप ‘यहोवा’ से इसे उपाधि ‘प्रभु’ में बदले बिना सुरक्षित रखा गया है; ‘याहवे’ संभावित वैकल्पिक लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद्यात्मक समानांतरता तथा कटाई के बाद केवल थोड़े-से बचे फल की शेषांश-छवि को पंक्ति-विन्यास में उभारा गया है।
