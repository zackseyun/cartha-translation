translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिंदी अपनाई गई है। पंक्ति-विन्यास ने समानांतर काव्य-रचना को स्पष्ट रखा है। “अहा” से बचा गया क्योंकि आधुनिक हिंदी में वह प्रायः प्रसन्नता या प्रशंसा व्यक्त करता है; “हाय” संदर्भ की गंभीरता के अधिक अनुकूल है।
