id: ISA.17.12
reference: Isaiah 17:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ה֗וֹי הֲמוֹן֙ עַמִּ֣ים רַבִּ֔ים כַּ/הֲמ֥וֹת יַמִּ֖ים יֶהֱמָי֑וּ/ן וּ/שְׁא֣וֹן לְאֻמִּ֔ים כִּ/שְׁא֛וֹן מַ֥יִם כַּבִּירִ֖ים יִשָּׁאֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/012.yaml
  text: Ah[a], the roar of many peoples— they roar like the roaring of the seas[b]; and the rushing of nations— they rush like the rushing of mighty waters.
translation:
  language: hi
  text: 'हाय[a], बहुत-से लोगों का कोलाहल!

    वे समुद्रों के गर्जन के समान गर्जते हैं[b];

    और राष्ट्रों का शोर!

    वे प्रचंड जलराशियों के शोर के समान शोर मचाते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हाय, बहुत-से लोगों की भीड़ …” आरंभिक इब्रानी विस्मयादिबोधक הוֹי विलाप, चेतावनी या ध्यान खींचने वाली पुकार व्यक्त कर सकता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शोर से जुड़े शब्दों—“कोलाहल/गर्जन” और “शोर”—तथा उनसे संबंधित क्रियाओं की पुनरावृत्ति है। इससे समुद्रों और प्रचंड जल के समान राष्ट्रों के शोर की तीव्रता बढ़ती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: हाय
  rationale: यह विस्मयादिबोधक शब्द विलाप, चेतावनी या ध्यान खींचने वाली पुकार व्यक्त कर सकता है। हिंदी में “हाय” इसकी गंभीर और अशुभ ध्वनि को बनाए रखता है, पर पादटिप्पणी में दूसरी संभावनाएँ भी दी गई हैं।
- source_word: הֲמוֹן עַמִּים רַבִּים
  choice: बहुत-से लोगों का कोलाहल
  rationale: הֲמוֹן भीड़ या जनसमूह के साथ उसके शोर का भी बोध करा सकता है। निकटवर्ती समुद्री गर्जन और सजातीय क्रिया הָמָה के कारण यहाँ श्रव्य अर्थ “कोलाहल” उपयुक्त है।
- source_word: כַּהֲמוֹת יַמִּים יֶהֱמָיוּן
  choice: वे समुद्रों के गर्जन के समान गर्जते हैं
  rationale: स्रोत में संज्ञा और सजातीय क्रिया की ध्वन्यात्मक पुनरावृत्ति है; “गर्जन … गर्जते” उसे हिंदी में यथासंभव सुरक्षित रखता है। יַמִּים का बहुवचन “समुद्रों” के रूप में रखा गया है।
- source_word: וּשְׁאוֹן לְאֻמִּים
  choice: और राष्ट्रों का शोर
  rationale: שָׁאוֹן ऊँचे शोर, गर्जन या कोलाहल को सूचित करता है। “शोर” पहले खंड के “कोलाहल” से हल्का शब्दगत अंतर रखते हुए समानांतरता बनाए रखता है; לְאֻמִּים को “राष्ट्रों” कहा गया है।
- source_word: כִּשְׁאוֹן מַיִם כַּבִּירִים יִשָּׁאוּן
  choice: वे प्रचंड जलराशियों के शोर के समान शोर मचाते हैं
  rationale: “प्रचंड जलराशियाँ” מַיִם כַּבִּירִים की विशालता और शक्ति व्यक्त करती हैं। “शोर … शोर मचाते” मूल की संबंधित संज्ञा और क्रिया की पुनरावृत्ति तथा श्रव्य प्रभाव को बनाए रखता है।
