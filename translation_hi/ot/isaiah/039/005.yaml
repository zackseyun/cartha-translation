base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/005.yaml
  text: Then Isaiah said to Hezekiah[b][a], “Hear the word of Yahweh of Hosts.”
translation:
  language: hi
  text: तब यशायाह ने हिजकिय्याह से कहा, “सेनाओं के याहवे[a][b] का वचन सुनो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH; परंपरागत रूप से इसका अनुवाद “प्रभु” किया जाता है।'
    reason: alternative_reading
  - marker: b
    text: या, “सेनाओं के प्रभु।” यह इब्रानी उपाधि याहवे को स्वर्गीय और सांसारिक सेनाओं के शासक के रूप में प्रस्तुत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְשַׁעְיָהוּ
  choice: यशायाह
  rationale: भविष्यद्वक्ता के नाम का हिन्दी बाइबल-परंपरा में प्रचलित रूप।
- source_word: אֶל חִזְקִיָּהוּ
  choice: हिजकिय्याह से
  rationale: אמר ... אל के साथ सम्बोधित व्यक्ति को हिन्दी में स्वाभाविक रूप से ‘से’ द्वारा व्यक्त किया जाता है; नाम का प्रचलित हिन्दी रूप रखा गया है।
- source_word: שְׁמַע
  choice: सुनो
  rationale: एकवचन आज्ञार्थक रूप की प्रत्यक्षता और भविष्यद्वाणी-संबंधी आह्वान की शक्ति बनाए रखता है।
- source_word: דְּבַר
  choice: वचन
  rationale: भविष्यद्वाणी के सूत्र में यह परमेश्वर से प्राप्त बोले गए संदेश को दर्शाता है; ‘वचन’ हिन्दी में स्थापित और बोधगम्य धार्मिक प्रयोग है।
- source_word: יְהוָה
  choice: याहवे
  rationale: टेट्राग्राम YHWH को किसी उपाधि से बदलने के बजाय उसके व्यक्तिगत नाम का हिन्दी लिप्यंतरण किया गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं के
  rationale: दिव्य उपाधि की व्यापकता को बनाए रखता है, जिसमें स्वर्गीय और सांसारिक सैन्य समूह दोनों निहित हो सकते हैं।
theological_decisions:
- issue: दिव्य नाम और उपाधि יְהוָה צְבָאוֹת का अनुवाद
  choice: सेनाओं के याहवे
  alternative: सेनाओं के प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम YHWH है, इसलिए उसे ‘याहवे’ के रूप में रखा गया है। ‘सेनाओं’ से צְבָאוֹת की बहुव्यंजकता बनी रहती है और इसे केवल सांसारिक सेना तक सीमित नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तब’ कथात्मक क्रम स्पष्ट करता है, जबकि ‘वचन सुनो’ मूल आज्ञा और भविष्यद्वाणी-सूत्र की औपचारिकता बनाए रखता है।
