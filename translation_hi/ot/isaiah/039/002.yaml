base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/002.yaml
  text: And Hezekiah was glad because of them[a], and he showed them his treasure house—the silver, the gold, the spices, the fine oil, all his armory, and all that was found in his storehouses[e][d][c][b]. There was nothing in his house or in all his dominion that Hezekiah did not show them.
translation:
  language: hi
  text: हिजकिय्याह उनसे प्रसन्न हुआ[a] और उसने उन्हें अपना खजाना-घर[b] दिखाया—चाँदी, सोना, सुगंध-द्रव्य, उत्तम तेल, अपना सारा शस्त्रागार[c] और अपने भंडारों[d] में पाई जाने वाली हर वस्तु। उसके घर में या उसके पूरे अधिकार-क्षेत्र[e] में ऐसी कोई वस्तु न थी, जो हिजकिय्याह ने उन्हें न दिखाई हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके कारण आनन्दित हुआ” अथवा “उन पर प्रसन्न हुआ।” इब्रानी मुहावरा दूतों या उनके उपहारों के कारण हुई प्रसन्नता और उनकी ओर व्यक्त प्रसन्नता—दोनों अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “उसकी बहुमूल्य वस्तुओं का घर”; परम्परागत रूप से इसे खजाना या खजाना-घर समझा गया है।
    reason: lexical_alternative
  - marker: c
    text: या “उसके उपकरणों का पूरा घर।” इस प्रसंग और 2 राजा 20:13 के समानांतर वर्णन के आधार पर अनेक लोग इसे “शस्त्रागार” समझते हैं।
    reason: alternative_reading
  - marker: d
    text: या “खजानों।”
    reason: lexical_alternative
  - marker: e
    text: या “पूरे राज्य” अथवा “समूचे प्रभुत्व-क्षेत्र।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמַח עֲלֵיהֶם
  choice: उनसे प्रसन्न हुआ
  rationale: שׂמח के साथ עַל का प्रयोग उनके कारण आनन्दित होने या उनकी ओर प्रसन्नता व्यक्त करने, दोनों अर्थ दे सकता है। यह सहज हिन्दी है और पादटिप्पणी में मूल की अस्पष्टता सुरक्षित रखता है।
- source_word: וַיַּרְאֵם
  choice: उसने उन्हें ... दिखाया
  rationale: ראה का हिफ़ील रूप सामान्यतः ‘देखने देना’ या ‘दिखाना’ है; इस प्रसंग में राजकीय सम्पदा दिखाने के लिए ‘दिखाया’ स्वाभाविक है।
- source_word: בֵּית נכתה
  choice: अपना खजाना-घर
  rationale: पदबंध बहुमूल्य वस्तुओं के घर या संग्रह-स्थान को सूचित करता है। सूची के प्रसंग में ‘खजाना-घर’ स्पष्ट और स्वाभाविक है।
- source_word: הַכֶּסֶף
  choice: चाँदी
  rationale: राजकीय सम्पदा की सूची में धातु ‘चाँदी’ अभिप्रेत है, सामान्य अर्थ ‘धन’ नहीं।
- source_word: הַזָּהָב
  choice: सोना
  rationale: यहाँ बहुमूल्य धातु का सीधा अर्थ है।
- source_word: הַבְּשָׂמִים
  choice: सुगंध-द्रव्य
  rationale: यह शब्द मसालों, सुगंधित रालों या इत्र-सामग्री जैसे सुगंधित पदार्थों के लिए व्यापक रूप से प्रयुक्त हो सकता है; ‘सुगंध-द्रव्य’ इस विस्तार को सुरक्षित रखता है।
- source_word: הַשֶּׁמֶן הַטּוֹב
  choice: उत्तम तेल
  rationale: शाब्दिक अर्थ ‘अच्छा तेल’ है; यहाँ मूल्यवान या उच्च कोटि के तेल का भाव है, इसलिए ‘उत्तम तेल’ सहज है और इसे अनिवार्य रूप से सुगंधित तेल नहीं ठहराता।
- source_word: כָּל בֵּית כֵּלָיו
  choice: अपना सारा शस्त्रागार
  rationale: शाब्दिक संरचना ‘उसके उपकरणों/पात्रों का पूरा घर’ है। राजकीय सूची और 2 राजा 20:13 के समानांतर प्रसंग में इसे सामान्यतः हथियारों या सैन्य सामान के भंडार के रूप में समझा जाता है।
- source_word: כָּל אֲשֶׁר נִמְצָא בְּאֹצְרֹתָיו
  choice: अपने भंडारों में पाई जाने वाली हर वस्तु
  rationale: אֹצָר का अर्थ भंडार या खजाना हो सकता है। ‘भंडारों’ से अर्थ स्पष्ट रहता है और पहले आए ‘खजाना-घर’ की अनावश्यक पुनरावृत्ति नहीं होती।
- source_word: לֹא הָיָה דָבָר אֲשֶׁר לֹא הֶרְאָם
  choice: ऐसी कोई वस्तु न थी, जो हिजकिय्याह ने उन्हें न दिखाई हो
  rationale: मूल के दोहरे निषेध को हिन्दी में स्वाभाविक रखते हुए सम्पूर्णता पर उसका बल सुरक्षित किया गया है।
- source_word: בְּבֵיתוֹ
  choice: उसके भवन में
  rationale: मूलतः ‘उसके घर में’ है। राजा के प्रसंग में ‘भवन’ घरेलू ‘घर’ की अपेक्षा अधिक उपयुक्त है, पर ‘राजमहल’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וּבְכָל מֶמְשַׁלְתּוֹ
  choice: उसके पूरे अधिकार-क्षेत्र में
  rationale: מֶמְשָׁלָה शासन, प्रभुत्व या वह क्षेत्र दर्शाता है जो किसी के अधिकार में हो। ‘अधिकार-क्षेत्र’ राजनीतिक भूभाग तक अर्थ को सीमित किए बिना इसकी व्यापकता व्यक्त करता है।
