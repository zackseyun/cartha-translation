base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/001.yaml
  text: At that time Merodach-baladan son of Baladan[a], king of Babylon, sent letters and a gift to Hezekiah, for he heard that he had been sick and had recovered.
translation:
  language: hi
  text: उस समय बाबेल के राजा, बलदान के पुत्र मरोदक-बलदान ने हिजकिय्याह के पास पत्र और एक भेंट भेजे, क्योंकि उसने सुना था कि हिजकिय्याह बीमार पड़ा था और स्वस्थ हो गया था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “बलवान हो गया था।” इब्रानी अभिव्यक्ति यहाँ बीमारी के बाद स्वस्थ होने को दर्शाती है।
    reason: lexical_alternative
