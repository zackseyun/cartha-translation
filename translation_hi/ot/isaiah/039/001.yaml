- source_word: וּמִנְחָה
  choice: और एक भेंट
  rationale: यहाँ शब्द धार्मिक चढ़ावे के बजाय राजनयिक उपहार को दर्शाता है।
- source_word: וַיִּשְׁמַע כִּי
  choice: क्योंकि उसने सुना था कि
  rationale: כִּי सुनी गई बात की विषय-वस्तु प्रस्तुत करता है; पूरे वाक्य में यह सूचना पत्र और भेंट भेजने का कारण भी स्पष्ट करती है।
- source_word: חָלָה
  choice: बीमार पड़ा था
  rationale: पूर्व में हुई बीमारी को सहज हिन्दी में व्यक्त करता है।
- source_word: וַיֶּחֱזָק
  choice: फिर स्वस्थ हो गया था
  rationale: मूल अर्थ ‘बलवान होना’ है, पर बीमारी के बाद के संदर्भ में यह स्वास्थ्य-लाभ का स्वाभाविक संकेत है; ‘फिर’ क्रम और पुनः प्राप्त दशा को स्पष्ट करता है।
