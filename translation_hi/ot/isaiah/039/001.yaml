- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा
  rationale: राजकीय उपाधि का सीधा और प्रचलित बाइबिलीय हिन्दी रूप।
- source_word: סְפָרִים
  choice: पत्र
