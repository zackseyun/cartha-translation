base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/003.yaml
  text: Then Isaiah the prophet came to King Hezekiah and said to him, “What did these men say, and where did they come to you from?” And Hezekiah said, “They came to me from a distant land, from Babylon.”
translation:
  language: hi
  text: तब यशायाह नबी राजा हिजकिय्याह के पास आया और उससे पूछा, “इन लोगों ने क्या कहा, और ये तुम्हारे पास कहाँ से आए?” हिजकिय्याह ने उत्तर दिया, “वे दूर देश से, बाबेल से, मेरे पास आए हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנָּבִיא
  choice: नबी
  rationale: यह आधुनिक मानक हिन्दी में परिचित, सहज और पद की धार्मिक भूमिका को स्पष्ट रूप से व्यक्त करने वाला शब्द है।
- source_word: מָה אָמְרוּ
  choice: क्या कहा
  rationale: हिब्रू प्रश्न का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: מֵאַיִן יָבֹאוּ אֵלֶיךָ
  choice: ये तुम्हारे पास कहाँ से आए?
  rationale: आगमन के स्रोत और राजा तक पहुँचने—दोनों अर्थों को बनाए रखते हुए सहज हिन्दी वाक्य-विन्यास अपनाया गया है।
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: दूर देश से
  rationale: हिब्रू के अनिश्चित पदबंध को बिना अतिरिक्त व्याख्या के संक्षिप्त और स्वाभाविक रूप में रखा गया है।
- source_word: מִבָּבֶל
  choice: बाबेल से
  rationale: हिब्रू स्थाननाम בָּבֶל का पारंपरिक और स्रोत-सन्निकट हिन्दी लिप्यंतरण।
