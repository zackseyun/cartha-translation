id: ISA.39.6
reference: Isaiah 39:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִנֵּה֮ יָמִ֣ים בָּאִים֒ וְ/נִשָּׂ֣א כָּל אֲשֶׁ֣ר בְּ/בֵיתֶ֗/ךָ וַ/אֲשֶׁ֨ר אָצְר֧וּ אֲבֹתֶ֛י/ךָ עַד הַ/יּ֥וֹם הַ/זֶּ֖ה בָּבֶ֑ל לֹֽא יִוָּתֵ֥ר דָּבָ֖ר אָמַ֥ר יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/006.yaml
  text: Look[a], days are coming when all that is in your house, and what your fathers have stored up until this day, will be carried to Babylon; not a thing will be left, says Yahweh.
translation:
  language: hi
  text: “देखो, दिन आ रहे हैं जब तुम्हारे घर में जो कुछ है और जो कुछ तुम्हारे पुरखों[a] ने आज तक संचित किया है, सब कुछ बाबेल ले जाया जाएगा। कुछ भी नहीं बचेगा,” याहवे कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे पिता।” इब्रानी में शाब्दिक रूप से “तुम्हारे पिता” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह शब्द एक गंभीर भविष्यद्वाणी की ओर ध्यान खींचता है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसके संकेतात्मक बल को बनाए रखता है।
- source_word: יָמִים בָּאִים
  choice: ऐसे दिन आ रहे हैं
  rationale: यह आने वाले न्याय की घोषणा करने वाला प्रचलित भविष्यद्वाणी-संबंधी मुहावरा है। ‘ऐसे’ हिन्दी में आगामी परिस्थिति से वाक्य का स्वाभाविक संबंध जोड़ता है।
- source_word: וְנִשָּׂא
  choice: ले जाया जाएगा
  rationale: निफ़ाल रूप यहाँ कर्मवाच्य है और वस्तुओं को बाबेल पहुँचा दिए जाने को व्यक्त करता है; यह चयन लूट या निर्वासन जैसी अतिरिक्त व्याख्या जोड़े बिना उस गति और गंतव्य को स्पष्ट करता है।
- source_word: כָּל אֲשֶׁר בְּבֵיתֶךָ
  choice: तुम्हारे घर में जो कुछ है
  rationale: मूल शब्द ‘घर’ है; उसे ‘महल’ या ‘संपत्ति’ बनाकर संदर्भगत अर्थ को मूल पाठ में आरोपित नहीं किया गया।
- source_word: וַאֲשֶׁר אָצְרוּ אֲבֹתֶיךָ
  choice: और जो कुछ तुम्हारे पुरखों ने ... संचित किया है
  rationale: אָצַר धन या भंडार जमा करने का अर्थ देता है। ‘संचित किया’ आर्थिक भाव को गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: אֲבֹתֶיךָ
  choice: तुम्हारे पुरखों
  rationale: बहुवचन पुल्लिंग ऐतिहासिक पारिवारिक पद को लिंग-निरपेक्ष ‘पूर्वजों’ में बदलने के बजाय ‘पुरखों’ से व्यक्त किया गया है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज के दिन तक
  rationale: यह संग्रह के वर्तमान समय तक जारी रहने की सीमा बताता है और इब्रानी मुहावरे का निकट अनुवाद है।
- source_word: בָּבֶל
  choice: बाबेल
  rationale: इब्रानी स्थान-नाम בָּבֶל का हिन्दी बाइबलीय लिप्यंतरण।
- source_word: לֹא יִוָּתֵר דָּבָר
  choice: कुछ भी नहीं बचेगा
  rationale: यह स्वाभाविक और बलपूर्ण हिन्दी में हानि की पूर्णता व्यक्त करता है।
- source_word: אָמַר יְהוָה
  choice: यहोवा कहता है
  rationale: भविष्यद्वाणी के सूत्र को वर्तमान काल में रखा गया है और चार-अक्षरीय ईश्वरीय नाम को उपाधि से बदलने के बजाय ‘यहोवा’ के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में वाचा-संबंधी व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ उसे किसी उपाधि से बदले बिना हिन्दी में प्रचलित रूप से प्रस्तुत करता है।
- issue: ऐतिहासिक पारिवारिक पद אֲבֹתֶיךָ
  choice: तुम्हारे पुरखों
  alternative: तुम्हारे पूर्वजों
  rationale: इब्रानी पद व्याकरणतः पुल्लिंग बहुवचन है। ‘पुरखों’ उसके पुरुष-सूचक ऐतिहासिक स्वर को बनाए रखता है, जबकि ‘पूर्वजों’ सम्भव किन्तु अधिक लिंग-निरपेक्ष विकल्प है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, सार्वजनिक-पाठ योग्य भविष्यद्वाणी शैली रखी गई है। वाक्य विन्यास स्वाभाविक है, पर ‘घर’, पूर्ण निषेध और ईश्वरीय नाम जैसे मूल-पाठ के प्रमुख तत्व सुरक्षित हैं।
