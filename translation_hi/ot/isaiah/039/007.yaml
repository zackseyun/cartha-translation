source:
  edition: WLC
  text: וּ/מִ/בָּנֶ֜י/ךָ אֲשֶׁ֨ר יֵצְא֧וּ מִמְּ/ךָ֛ אֲשֶׁ֥ר תּוֹלִ֖יד יִקָּ֑חוּ וְ/הָיוּ֙ סָרִיסִ֔ים בְּ/הֵיכַ֖ל מֶ֥לֶךְ בָּבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/007.yaml
  text: And some of your sons who will come from you[a], whom you will father, will be taken, and they will become eunuchs in the palace of the king of Babylon.
translation:
  language: hi
  text: और तुम्हारे पुत्रों में से कुछ को—जो तुमसे उत्पन्न होंगे, जिनके तुम पिता होगे—ले जाया जाएगा; और वे बाबेल के राजा के महल में नपुंसक[a] होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘राजदरबारी अधिकारी’। इब्रानी शब्द का अर्थ वास्तविक नपुंसक भी हो सकता है और कुछ प्रसंगों में राजकीय अधिकारी भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבָּנֶיךָ
  choice: और तुम्हारे पुत्रों में से कुछ को
  rationale: מִן का अंशवाचक प्रयोग यहाँ ‘पुत्रों में से कुछ’ का अर्थ देता है। ‘पुत्र’ मूल की पारिवारिक भाषा को बनाए रखता है, जबकि ‘वंशज’ अपेक्षाकृत व्यापक अर्थ होता।
- source_word: אֲשֶׁר יֵצְאוּ מִמְּךָ
  choice: जो तुमसे उत्पन्न होंगे
  rationale: यह वाक्यांश हिजकिय्याह से निकलने वाली वंश-परंपरा को दर्शाता है। ‘तुमसे उत्पन्न होंगे’ हिन्दी में स्वाभाविक है और वंशगत संबंध स्पष्ट रखता है।
- source_word: אֲשֶׁר תּוֹלִיד
  choice: जिनके तुम पिता होगे
  rationale: ילד का हिफ़ील रूप पुरुष कर्ता के साथ संतान उत्पन्न करने अथवा पिता बनने का अर्थ देता है। ‘जिनके तुम पिता होगे’ आधुनिक हिन्दी में स्वाभाविक है और पुरुष के लिए असहज ‘जिन्हें तुम जन्म दोगे’ से बचता है।
- source_word: יִקָּחוּ
  choice: ले जाया जाएगा
  rationale: इब्रानी क्रिया रूपतः सक्रिय है, पर उसका कर्ता अनिर्दिष्ट है। हिन्दी में निर्वासन अथवा बंदी बनाकर ले जाने के इस भाव को कर्मवाच्य में कहना अधिक स्वाभाविक है।
- source_word: וְהָיוּ
  choice: और वे ... होंगे
  rationale: היה यहाँ ‘होना’ या ‘बनना’ दोनों भाव दे सकता है। हिन्दी में ‘होंगे’ मूल की अस्पष्टता को बनाए रखता है और अनावश्यक रूप से स्थिति-परिवर्तन को स्पष्ट नहीं करता।
- source_word: סָרִיסִים
  choice: नपुंसक
  rationale: शब्द का प्रमुख अर्थ राजमहल में सेवा करने वाले बधिया पुरुषों से है, यद्यपि यह कभी-कभी व्यापक अर्थ में राजकीय अधिकारियों के लिए भी प्रयुक्त होता है। मुख्य पाठ में सीधा अर्थ रखा गया है और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: בְּהֵיכַל
  choice: महल में
  rationale: राजा के संदर्भ में הֵיכָל का अर्थ राजमहल है, मंदिर नहीं।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा
  rationale: यह इब्रानी संबंधवाचक रचना का सीधा और प्रचलित हिन्दी रूप है।
theological_decisions:
- issue: राजदरबार की भविष्यवाणी में סָרִיסִים का अर्थ
  choice: मुख्य पाठ में ‘नपुंसक’
  alternative: ‘राजदरबारी अधिकारी’
  rationale: इब्रानी शब्द वास्तविक रूप से बधिया किए गए पुरुषों को सूचित कर सकता है और अर्थ-विस्तार से राजकीय अधिकारियों को भी। प्रसंग में पुत्रों को विदेशी राजमहल में ले जाए जाने के कारण मुख्य पाठ में अधिक सीधा अर्थ रखा गया है, पर अर्थगत तनाव बनाए रखने के लिए व्यापक प्रशासनिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। एकवचन संबोधन के लिए ‘तुम्हारे/तुम’ रखा गया है। मूल के दो निकटवर्ती वंशगत उपवाक्यों को डैश के भीतर रखकर उनकी पुनरुक्ति सुरक्षित रखते हुए वाक्य को पठनीय बनाया गया है।
