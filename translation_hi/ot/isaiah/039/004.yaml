  yaml_path: translation/ot/isaiah/039/004.yaml
  text: And he said[a], “What have they seen in your house?” And Hezekiah said, “They have seen everything that is in my house. There was nothing that I did not show them in my treasuries.”
translation:
  language: hi
  text: उसने पूछा, “उन्होंने तुम्हारे घर[a] में क्या देखा?” हिजकिय्याह ने उत्तर दिया, “उन्होंने मेरे घर में जो कुछ है, वह सब देखा है। मेरे भंडारों में ऐसी कोई वस्तु नहीं थी जो मैंने उन्हें न दिखाई हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे राजमहल में।” हिब्रू में शाब्दिक रूप से “तुम्हारे घर में” है, जो राजकीय संदर्भ में राजमहल का भी संकेत कर सकता है।
    reason: lexical_alternative
