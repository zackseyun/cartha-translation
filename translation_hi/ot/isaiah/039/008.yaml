  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר חִזְקִיָּ֨הוּ֙ אֶֽל יְשַׁעְיָ֔הוּ ט֥וֹב דְּבַר יְהוָ֖ה אֲשֶׁ֣ר דִּבַּ֑רְתָּ וַ/יֹּ֕אמֶר כִּ֥י יִהְיֶ֛ה שָׁל֥וֹם וֶ/אֱמֶ֖ת בְּ/יָמָֽ/י־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/008.yaml
  text: Then Hezekiah said to Isaiah, “The word of the LORD that you have spoken is good.” For he thought, “There will be peace and stability in my days.”
translation:
  language: hi
  text: तब हिजकिय्याह ने यशायाह से कहा, “यहोवा का जो वचन तुमने कहा है, वह अच्छा है।” फिर उसने कहा, “क्योंकि मेरे जीवनकाल में शान्ति और स्थिरता बनी रहेगी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב
  choice: अच्छा
  rationale: मूल के सीधे मूल्यांकन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: דְּבַר יְהוָה
  choice: यहोवा का वचन
  rationale: दिव्य नाम और भविष्यद्वाणी-संबंधी ‘वचन’ दोनों को स्पष्ट रूप से प्रस्तुत करता है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: यहाँ सुरक्षा और कुशलता के व्यापक भाव सहित प्रचलित और उपयुक्त समतुल्य है।
- source_word: אֱמֶת
  choice: स्थिरता
  rationale: इस प्रसंग में אֱמֶת का भाव विश्वसनीय, टिकाऊ व्यवस्था या स्थायित्व है; ‘सत्य’ की तुलना में ‘स्थिरता’ अर्थ को अधिक स्वाभाविक ढंग से व्यक्त करती है।
- source_word: בְיָמָי
  choice: मेरे जीवनकाल में
  rationale: शाब्दिक ‘मेरे दिनों में’ का वर्तमान हिन्दी में स्वाभाविक और प्रसंगानुकूल रूप।
theological_decisions:
- issue: וַיֹּאמֶר की दूसरी occurrence को कथित वचन मानना या आंतरिक विचार
  choice: फिर उसने कहा
  alternative: क्योंकि उसने सोचा
  rationale: हिब्रू में स्पष्ट रूप से ‘उसने कहा’ है; पाठ यह नहीं बताता कि कथन केवल मन में था। औपचारिक कथन को बनाए रखना वास्तविक अस्पष्टता और हिजकिय्याह की प्रतिक्रिया की तीक्ष्णता सुरक्षित रखता है।
- issue: אֱמֶת का अर्थ
  choice: स्थिरता
  alternative: सत्य
  rationale: शान्ति के साथ युग्म में इसका संकेत स्थायित्व, विश्वसनीयता और सुरक्षित व्यवस्था की ओर हो सकता है; ‘स्थिरता’ प्रसंग में उपयुक्त है, यद्यपि ‘सत्य’ शाब्दिक विकल्प है।
- issue: כִּי का संबंध
  choice: क्योंकि मेरे जीवनकाल में...
  alternative: क्या मेरे जीवनकाल में... नहीं रहेगा?
  rationale: व्यंजन-पाठ और मसोराई स्वरांकन इसे कारणसूचक ‘क्योंकि’ के रूप में समर्थन देते हैं; प्रश्नवाचक अर्थ सम्भव मानने की आवश्यकता नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और स्रोत-सन्निकट शैली। ‘फिर उसने कहा’ को अंग्रेज़ी परामर्श-पाठ के ‘उसने सोचा’ के बजाय मूल हिब्रू के अनुसार रखा गया है।
