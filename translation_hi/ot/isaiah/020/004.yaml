  text: כֵּ֣ן יִנְהַ֣ג מֶֽלֶךְ אַ֠שּׁוּר אֶת שְׁבִ֨י מִצְרַ֜יִם וְ/אֶת גָּל֥וּת כּ֛וּשׁ נְעָרִ֥ים וּ/זְקֵנִ֖ים עָר֣וֹם וְ/יָחֵ֑ף וַ/חֲשׂוּפַ֥י שֵׁ֖ת עֶרְוַ֥ת מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/004.yaml
  text: so the king of Assyria will lead away the captives of Egypt and the exiles of Cush[a], young and old, naked and barefoot[b], with buttocks uncovered—the nakedness of Egypt.
translation:
  language: hi
  text: उसी प्रकार अश्शूर का राजा मिस्र के बंदियों और कूश के निर्वासितों को—युवा और वृद्धों को—नंगे और नंगे-पाँव, नितंब उघाड़े हुए ले जाएगा—मिस्र की नग्नता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֵּן
  choice: उसी प्रकार
  rationale: यह पिछले पद के प्रतीकात्मक कार्य को उसके भावी परिणाम से जोड़ता है और स्वाभाविक हिन्दी में रीति-साम्य व्यक्त करता है।
- source_word: יִנְהַג
  choice: ले जाएगा
  rationale: נהג का अर्थ ले चलना या हाँकना हो सकता है; बंदियों के निर्वासन के संदर्भ में ‘ले जाएगा’ बाध्य होकर दूर ले जाए जाने का भाव सहज रूप से देता है।
- source_word: שְׁבִי
  choice: बंदी
  rationale: प्रत्यक्ष कर्म और समानांतर ‘निर्वासितों’ के कारण यहाँ अमूर्त ‘बंदी अवस्था’ नहीं, बल्कि बंदी बनाए गए लोग अभिप्रेत हैं।
- source_word: גָּלוּת
  choice: निर्वासित
  rationale: यहाँ शब्द निर्वासन की अवस्था के बजाय निर्वासित समुदाय को दर्शाता है और ‘बंदियों’ के समानांतर है।
- source_word: כּוּשׁ
  choice: कूश
  rationale: प्राचीन भौगोलिक नाम को आधुनिक राष्ट्र ‘इथियोपिया’ से अनुचित रूप से समान ठहराने के बजाय लिप्यंतरित किया गया है।
- source_word: נְעָרִים וּזְקֵנִים
  choice: जवानों और बूढ़ों
  rationale: यह जोड़ी आयु के पूरे विस्तार को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: עָרוֹם וְיָחֵף
  choice: नंगे और नंगे पाँव
  rationale: यह मूल के स्पष्ट और अपमानसूचक चित्र को तथा आस-पास के प्रतीकात्मक कार्य की भाषा को बनाए रखता है।
- source_word: חֲשׂוּפַי שֵׁת
  choice: नितंब उघाड़े हुए
  rationale: मूल अभिव्यक्ति जानबूझकर चित्रात्मक है; यह सार्वजनिक अपमान के भाव को शालीन बनाकर मिटाए बिना आधुनिक हिन्दी में स्पष्ट रखती है।
- source_word: עֶרְוַת מִצְרָיִם
  choice: मिस्र का नंगापन
  rationale: शाब्दिक ‘नंगापन’ पिछले दृश्य से शब्दार्थगत संबंध बनाए रखता है; लज्जा और अपमान का आशय संदर्भ से उभरता है।
