  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली रखी गई है। इब्रानी के समानांतर कारण-वाक्यांशों और दोनों भावात्मक क्रियाओं को सुरक्षित रखा गया है; संज्ञात्मक पदबंधों को स्वाभाविक हिन्दी संबंधवाचक उपवाक्यों में व्यक्त किया गया है।
