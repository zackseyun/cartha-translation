base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/005.yaml
  text: And they will be dismayed and ashamed because of Cush[a], their hope, and because of Egypt[c][b], their boast.
translation:
  language: hi
  text: वे कूश[a] के कारण, जिस पर उनकी आशा[b] टिकी थी, और मिस्र के कारण, जिस पर उन्हें गर्व[c] था, घबरा जाएँगे और लज्जित होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कूश मिस्र के दक्षिण में स्थित प्राचीन क्षेत्र था, जिसे प्रायः नूबिया से जोड़ा जाता है; पुराने अनुवादों में कभी-कभी इसे “इथियोपिया” कहा गया है।
    reason: cultural_note
  - marker: b
    text: या “जिससे उन्हें अपेक्षा थी”; मूल शब्द में उस वस्तु का भाव है जिसकी ओर आशा या भरोसे से देखा जाता है।
    reason: lexical_alternative
  - marker: c
    text: या “जो उनका गौरव था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחַתּוּ
  choice: घबरा जाएँगे
  rationale: חתת यहाँ भविष्यसूचक क्रम में भय, निराशा और मनोबल टूटने की दशा व्यक्त करता है। आधुनिक हिन्दी में “घबरा जाएँगे” इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וָבֹשׁוּ
  choice: और लज्जित होंगे
  rationale: בושׁ अपमानित या लज्जित होने का भाव रखता है। “लज्जित होंगे” गरिमापूर्ण और सहज हिन्दी है तथा पहले क्रियापद के साथ स्वाभाविक युग्म बनाता है।
- source_word: מִכּוּשׁ
  choice: कूश के कारण
  rationale: מן यहाँ समानांतर वाक्यांशों में कारण का बोध कराता है। प्राचीन स्थान-नाम को भ्रामक आधुनिक पहचान देने के बजाय “कूश” रखा गया है।
- source_word: מַבָּטָם
  choice: जिस पर उनकी आशा टिकी थी
  rationale: מַבָּט का मूल भाव ‘देखना’ या ‘जिसकी ओर देखा जाए’ है; प्रसंग में यह भरोसे और अपेक्षा के केंद्र को दर्शाता है। यह हिन्दी वाक्यांश उस संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּמִן מִצְרַיִם
  choice: और मिस्र के कारण
  rationale: पहले מן-वाक्यांश के समान यहाँ भी कारण का अर्थ है; समानांतर रचना को हिन्दी में बनाए रखा गया है।
- source_word: תִּפְאַרְתָּם
  choice: जिस पर उन्हें गर्व था
  rationale: תפארת का अर्थ ‘वैभव’, ‘गौरव’ या ‘गर्व का विषय’ हो सकता है। यहाँ मिस्र उस वस्तु या राष्ट्र को दर्शाता है जिस पर वे इतराते थे; “जिस पर उन्हें गर्व था” इस संबंधपरक अर्थ को सहज हिन्दी में देता है।
