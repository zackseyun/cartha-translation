base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/006.yaml
  text: And the inhabitant of this coastland will say in that day[a], ‘Look, this is our hope, where we fled for help to be delivered from the king of Assyria[b]. And how shall we escape?’
translation:
  language: hi
  text: उस दिन इस तटवर्ती प्रदेश[a] के निवासी कहेंगे, “देखो, यही हमारी आशा[b] है, जिसकी ओर हम सहायता के लिए भागे थे, ताकि अश्शूर के राजा से बचाए जाएँ। और हम कैसे बच निकलेंगे?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तटवर्ती प्रदेश” का अनुवाद “द्वीप” भी किया जा सकता है। यशायाह में यह शब्द प्रायः समुद्र से जुड़े तटवर्ती क्षेत्रों के लिए व्यापक रूप से प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जिसकी ओर हम आशा से देखते थे” अथवा “हमारी अपेक्षा।” इब्रानी अभिव्यक्ति उस व्यक्ति या वस्तु की ओर संकेत करती है जिस पर उन्होंने अपनी आशा लगाई थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֵׁב הָאִי הַזֶּה
  choice: इस तटवर्ती प्रदेश के निवासी
  rationale: יֹשֵׁב व्याकरण की दृष्टि से एकवचन होते हुए भी यहाँ सामूहिक अर्थ रखता है; इसलिए हिन्दी में स्वाभाविक सामूहिक बहुवचन लिया गया है। אִי द्वीप के साथ समुद्रतटीय भूभाग को भी सूचित कर सकता है और यशायाह में प्रायः इसी व्यापक अर्थ में आता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यसूचक काल-सूचक सूत्र का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह श्रोताओं का ध्यान खींचने वाला उद्गार है; ‘देखो’ आधुनिक हिन्दी में इसके बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כֹּה מַבָּטֵנוּ
  choice: यही हमारी आशा है
  rationale: מַבָּט मूलतः उस व्यक्ति या वस्तु को दर्शाता है जिसकी ओर अपेक्षा और भरोसे से देखा जाता है। ‘हमारी आशा’ प्रसंगगत अर्थ को स्पष्ट रखता है, जबकि पादटिप्पणी मूल बिंब को सुरक्षित करती है।
- source_word: אֲשֶׁר נַסְנוּ שָׁם לְעֶזְרָה
  choice: जिसके पास हम सहायता के लिए भागे थे
  rationale: נוּס भागने को और שָׁם गंतव्य को व्यक्त करता है। हिन्दी में ‘जिसके पास’ आश्रय या सहायता की ओर भागने का भाव स्वाभाविक ढंग से देता है।
- source_word: לְהִנָּצֵל מִפְּנֵי מֶלֶךְ אַשּׁוּר
  choice: ताकि अश्शूर के राजा से बचाए जाएँ
  rationale: निफ़अल रूप का कर्मवाच्य भाव ‘बचाए जाएँ’ में सुरक्षित है; מִפְּנֵי यहाँ राजा के खतरे से छुटकारे का अर्थ देता है।
- source_word: וְאֵיךְ נִמָּלֵט אֲנָחְנוּ
  choice: अब हम कैसे बच निकलेंगे?
  rationale: यह निराशा व्यक्त करने वाला आलंकारिक प्रश्न है। ‘अब’ पूर्ववर्ती सहारे के विफल होने से निकले परिणाम को हिन्दी में स्वाभाविक रूप से जोड़ता है।
