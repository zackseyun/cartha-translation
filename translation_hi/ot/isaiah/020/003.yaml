  text: וַ/יֹּ֣אמֶר יְהוָ֔ה כַּ/אֲשֶׁ֥ר הָלַ֛ךְ עַבְדִּ֥/י יְשַׁעְיָ֖הוּ עָר֣וֹם וְ/יָחֵ֑ף שָׁלֹ֤שׁ שָׁנִים֙ א֣וֹת וּ/מוֹפֵ֔ת עַל מִצְרַ֖יִם וְ/עַל כּֽוּשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/003.yaml
  text: Then Yahweh said[b][a], “Just as my servant Isaiah has walked naked and barefoot for three years as a sign and a portent against Egypt and Cush,”
translation:
  language: hi
  text: तब याहवे ने कहा, “जिस प्रकार मेरा सेवक यशायाह तीन वर्ष तक नंगा[a] और नंगे पाँव चलता रहा—मिस्र और कूश[b] के विरुद्ध एक चिन्ह और पूर्वसूचक संकेत के रूप में—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अर्थ ‘वस्त्र उतारे हुए’ भी हो सकता है—अर्थात पूरी तरह निर्वस्त्र होने के बजाय केवल अधोवस्त्र पहने हुए।
    reason: lexical_alternative
  - marker: b
    text: कूश मिस्र के दक्षिण का क्षेत्र था, जिसे प्रायः नूबिया से जोड़ा जाता है; कुछ अनुवाद इसे ‘इथियोपिया’ कहते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय उसके प्रचलित विद्वत्तापूर्ण उच्चारण का देवनागरी रूप रखा गया है।
- source_word: כַּאֲשֶׁר
  choice: जिस प्रकार
  rationale: यह अगले कथन का आधार बनने वाली तुलना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הָלַךְ
  choice: चलता रहा
  rationale: क्रिया के मूल अर्थ ‘चलना/फिरना’ और तीन वर्ष की निरंतर अवधि—दोनों को व्यक्त करता है।
- source_word: עַבְדִּי
  choice: मेरा सेवक
  rationale: यह यशायाह की परमेश्वर द्वारा सौंपी गई भविष्यद्वक्ताई सेवा को दर्शाता है; यहाँ दासत्व पर बल देना संदर्भानुकूल नहीं है।
- source_word: יְשַׁעְיָהוּ
  choice: यशायाह
  rationale: भविष्यद्वक्ता के नाम का हिन्दी में स्थापित रूप।
- source_word: עָרוֹם
  choice: नंगा
  rationale: इब्रानी विशेषण का सीधा अर्थ सुरक्षित रखा गया है; बाहरी वस्त्र उतार देने की सम्भावना पादटिप्पणी में दी गई है।
- source_word: וְיָחֵף
  choice: और नंगे पाँव
  rationale: मूल के दूसरे शारीरिक वर्णन का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: שָׁלֹשׁ שָׁנִים
  choice: तीन वर्ष तक
  rationale: अवधि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אוֹת
  choice: चिन्ह
  rationale: ऐसे प्रतीकात्मक कार्य के लिए स्थापित शब्द, जो अपने से आगे किसी घटना की ओर संकेत करता है।
- source_word: וּמוֹפֵת
  choice: और भविष्यसूचक संकेत
  rationale: चिन्ह से जुड़े, आने वाली घटना को पहले से दर्शाने वाले आश्चर्यजनक/पूर्वसूचक चिह्न का भाव व्यक्त करता है, बिना इसे केवल चमत्कार बना देने के।
- source_word: עַל
  choice: के विरुद्ध
  rationale: न्याय-संदर्भ में मिस्र और कूश को लक्षित करने वाला प्रतिकूल भाव सुरक्षित रखता है।
- source_word: מִצְרַיִם
  choice: मिस्र
  rationale: देश का हिन्दी में स्थापित नाम।
- source_word: כּוּשׁ
  choice: कूश
  rationale: प्राचीन भूभाग का नाम लिप्यंतरित किया गया है; इसे आधुनिक इथियोपिया के साथ पूरी तरह समान नहीं माना गया।
theological_decisions:
- issue: यशायाह के नंगे होने की सीमा
  choice: मुख्य पाठ में ‘नंगा’ रखा गया है और आंशिक निर्वस्त्रता की सम्भावना पादटिप्पणी में बताई गई है।
  alternative: ‘बाहरी वस्त्र उतारे हुए’ या ‘केवल अधोवस्त्र पहने हुए’
  rationale: עָרוֹם का सीधा अर्थ ‘नंगा’ है, इसलिए मुख्य पाठ में इसे नरम नहीं किया गया। फिर भी प्राचीन पहनावे और भविष्यद्वक्ताई प्रतीकात्मक कार्य के संदर्भ में इसका आशय बाहरी वस्त्र उतारना भी हो सकता है; इस वास्तविक अस्पष्टता को पादटिप्पणी सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद अगले पद में पूरी होने वाली तुलना का पहला भाग है; इसलिए अन्त में दीर्घ विराम के साथ वाक्य की अपेक्षा खुली रखी गई है।
