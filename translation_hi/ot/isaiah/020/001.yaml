  yaml_path: translation/ot/isaiah/020/001.yaml
  text: In the year that the Tartan came to Ashdod[a], when Sargon king of Assyria sent him, and he fought against Ashdod and captured it,
translation:
  language: hi
  text: जिस वर्ष तर्तान अशदोद आया, जब अश्शूर के राजा सर्गोन ने उसे भेजा था, उसने अशदोद के विरुद्ध युद्ध किया और उसे जीत लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת
  choice: जिस वर्ष
  rationale: समयवाचक ב और שְׁנַת आगामी घटना को काल-निर्धारक उपवाक्य के रूप में प्रस्तुत करते हैं; ‘जिस वर्ष’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: תַרְתָּן
  choice: प्रधान सेनापति
  rationale: यह सम्भवतः व्यक्तिगत नाम नहीं, बल्कि असीरियाई उच्च सैन्य पदवी है; अर्थानुवाद साधारण पाठक के लिए भूमिका स्पष्ट करता है।
- source_word: אַשְׁדּוֹדָ/ה
  choice: अशदोद भेजा
  rationale: दिशासूचक ה नगर की ओर गति बताता है; हिन्दी में ‘अशदोद भेजा’ यही भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: בִּ/שְׁלֹח אֹת/וֹ
  choice: सर्गोन ने ... भेजा
  rationale: ב के साथ infinitive construct समकालीन परिस्थिति, ‘जब उसने भेजा,’ व्यक्त करता है; हिन्दी वाक्य में सर्गोन को कर्ता बनाना मूल वाक्य-संबंध स्पष्ट रखता है।
- source_word: סַרְגוֹן
  choice: सर्गोन
  rationale: राजकीय नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा
  rationale: Construct chain सर्गोन की पहचान अश्शूर के राजा के रूप में कराती है; ‘अश्शूर’ बाइबलीय साम्राज्य का उपयुक्त हिन्दी रूप है।
- source_word: וַ/יִּלָּחֶם בְּ/אַשְׁדּוֹד
  choice: उसने अशदोद के विरुद्ध युद्ध किया
  rationale: לחם के साथ ב यहाँ किसी नगर के विरुद्ध लड़ने का अर्थ देता है; अनावश्यक रूप से ‘आक्रमण’ जोड़ने के बजाय मूल सैन्य अभिव्यक्ति बनाए रखी गई है।
- source_word: וַ/יִּלְכְּדָ/הּ
  choice: उस पर अधिकार कर लिया
  rationale: सैन्य प्रसंग में לכד नगर को जीतकर अपने अधिकार में लेने को दर्शाता है; स्त्रीलिंग प्रत्यय का संदर्भ अशदोद है।
