source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא דִּבֶּ֣ר יְהוָה֮ בְּ/יַ֣ד יְשַׁעְיָ֣הוּ בֶן אָמוֹץ֮ לֵ/אמֹר֒ לֵ֗ךְ וּ/פִתַּחְתָּ֤ הַ/שַּׂק֙ מֵ/עַ֣ל מָתְנֶ֔י/ךָ וְ/נַעַלְ/ךָ֥ תַחֲלֹ֖ץ מֵ/עַ֣ל רַגְלֶ֑י/ךָ וַ/יַּ֣עַשׂ כֵּ֔ן הָלֹ֖ךְ עָר֥וֹם וְ/יָחֵֽף־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/002.yaml
  text: At that time Yahweh spoke by the hand of Isaiah son of Amoz[a], saying, “Go, loosen the sackcloth from your waist, and remove your sandals from your feet.” And he did so, walking naked and barefoot.
translation:
  language: hi
  text: उस समय यहोवा ने आमोस के पुत्र यशायाह के द्वारा कहा, “जा, अपनी कमर से टाट का वस्त्र खोल दे और अपने पैरों से जूते उतार दे।” उसने ऐसा ही किया; वह नंगा[a] और नंगे पाँव चलता-फिरता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अधनंगा” अथवा “वस्त्र उतारे हुए”; हिब्रू शब्द कुछ संदर्भों में पूरी तरह वस्त्रहीन होने के बजाय अपर्याप्त वस्त्र पहने होने का अर्थ भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित लिप्यंतरण का प्रयोग किया गया है; इसे उपाधि से नहीं बदला गया।
- source_word: דִּבֶּר ... בְּיַד
  choice: के द्वारा कहा
  rationale: शाब्दिक 'हाथ से कहा' हिन्दी में अस्वाभाविक और भ्रामक हो सकता है; यहाँ בְּיַד भविष्यद्वक्ता के माध्यम से बोलने का भाव व्यक्त करता है।
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ
  choice: आमोस के पुत्र यशायाह
  rationale: हिब्रू पुत्र-संबंधी रचना को स्वाभाविक हिन्दी शब्दक्रम में रखा गया है।
- source_word: וּפִתַּחְתָּ הַשַּׂק מֵעַל מָתְנֶיךָ
  choice: अपनी कमर से टाट खोल दे
  rationale: פתח यहाँ पहने हुए टाट को खोलने का निर्देश देता है; 'टाट' शׂק का संक्षिप्त और परिचित हिन्दी समतुल्य है।
- source_word: וְנַעַלְךָ תַחֲלֹץ מֵעַל רַגְלֶיךָ
  choice: अपने पैरों से जूतियाँ उतार दे
  rationale: एकवचन נעל को सामूहिक अर्थ में स्वाभाविक हिन्दी बहुवचन से व्यक्त किया गया है; חלץ का अर्थ यहाँ उतारना है।
- source_word: הָלֹךְ עָרוֹם וְיָחֵף
  choice: नंगा और नंगे पाँव चलता रहा
  rationale: הלך के इस रूप में जारी अवस्था/आचरण का भाव है; 'चलता रहा' उसे सहज हिन्दी में व्यक्त करता है। ערום का प्राथमिक अर्थ 'नंगा' है और יחף का 'नंगे पाँव'।
theological_decisions:
- issue: यशायाह के चिह्नात्मक कार्य में עָרוֹם से अभिप्रेत वस्त्रहीनता की सीमा
  choice: मुख्य पाठ में “नंगा”
  alternative: “अधनंगा,” “वस्त्र उतारे हुए,” अथवा केवल अपर्याप्त वस्त्र पहने हुए
  rationale: עָרוֹם का सामान्य और सीधा अर्थ 'नंगा' है, इसलिए मुख्य पाठ में उसे नरम नहीं किया गया। फिर भी कुछ संदर्भों में यह पूर्ण नग्नता के बजाय अपर्याप्त वस्त्रधारण बता सकता है; इस वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। प्रत्यक्ष वाणी में एकवचन अनौपचारिक आज्ञार्थक रूप मूल हिब्रू के सीधे संबोधन को दर्शाता है। नामों के लिए हिन्दी बाइबलीय परंपरा में परिचित रूप 'यहोवा', 'यशायाह' और 'आमोस' रखे गए हैं।
