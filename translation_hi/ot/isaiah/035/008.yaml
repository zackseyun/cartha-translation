  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָה שָׁ֞ם מַסְל֣וּל וָ/דֶ֗רֶךְ וְ/דֶ֤רֶךְ הַ/קֹּ֨דֶשׁ֙ יִקָּ֣רֵא לָ֔/הּ לֹֽא יַעַבְרֶ֥/נּוּ טָמֵ֖א וְ/הוּא לָ֑/מוֹ הֹלֵ֥ךְ דֶּ֛רֶךְ וֶ/אֱוִילִ֖ים לֹ֥א יִתְעֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/008.yaml
  text: And there shall be a highway there[a], and a road, and it shall be called the Holy Way. The unclean shall not pass over it, but it shall be for them[b]; whoever walks on the way—even fools—shall not go astray.
translation:
  language: hi
  text: 'वहाँ एक राजमार्ग और एक रास्ता होगा;

    वह “पवित्र मार्ग” कहलाएगा।

    कोई अशुद्ध व्यक्ति उस पर से नहीं गुज़रेगा;

    पर वह उनके लिए होगा।[a]

    उस मार्ग पर चलनेवाले—मूर्ख भी—नहीं भटकेंगे।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह हिब्रू वाक्यांश कठिन है। इसका अर्थ “और वह उनके साथ होगा” या “वह उनका होगा” भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या “मार्ग से नहीं भटकेंगे” अथवा “गलती नहीं करेंगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַסְלוּל
  choice: राजमार्ग
  rationale: यह शब्द बनाए या ऊँचे किए गए चौड़े मार्ग को दर्शाता है। ‘राजमार्ग’ आधुनिक हिन्दी में तैयार और प्रमुख मार्ग की छवि स्वाभाविक रूप से व्यक्त करता है।
- source_word: דֶּרֶךְ
  choice: रास्ता / मार्ग
  rationale: पद में इस शब्द की पुनरावृत्ति है। पहले ‘रास्ता’ राजमार्ग के साथ सहज है, जबकि नामसूचक पदबंध ‘पवित्र मार्ग’ और आगे यात्रा के संदर्भ में ‘मार्ग’ अधिक गरिमापूर्ण और स्वाभाविक है।
- source_word: הַקֹּדֶשׁ
  choice: पवित्र
  rationale: דֶּרֶךְ के साथ यह परमेश्वर के लिए अलग किए हुए मार्ग का बोध देता है। ‘पवित्र मार्ग’ धार्मिक और नैतिक दोनों अनुगूँजों को बनाए रखता है।
- source_word: יִקָּרֵא לָהּ
  choice: वह … कहलाएगा
  rationale: קרא का निफ़अल रूप यहाँ नाम दिए जाने का निष्क्रिय सूत्र है। हिन्दी में ‘कहलाएगा’ संक्षिप्त और स्वाभाविक है।
- source_word: טָמֵא
  choice: कोई अशुद्ध व्यक्ति
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘अशुद्ध’ अनुष्ठानिक और नैतिक दोनों संभावित अर्थों को खुला रखता है, और ‘व्यक्ति’ हिन्दी में इसे स्पष्ट करता है।
- source_word: יַעַבְרֶנּוּ
  choice: उस पर से नहीं गुज़रेगा
  rationale: עבר गति या पार जाने को व्यक्त करता है और प्रत्यय मार्ग की ओर संकेत करता है। यह अनुवाद यात्रा की ठोस छवि बनाए रखता है।
- source_word: וְהוּא לָמוֹ
  choice: पर वह उनके लिए होगा
  rationale: यह वाक्यांश व्याकरण की दृष्टि से कठिन और संक्षिप्त है। मुख्य पाठ में सर्वनाम को मार्ग से जोड़ना निकटवर्ती संदर्भ के अनुकूल है; वास्तविक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: הֹלֵךְ דֶּרֶךְ
  choice: उस मार्ग पर चलनेवाले
  rationale: कृदंत यात्रियों के एक सामान्य वर्ग का वर्णन करता है। बहुवचन हिन्दी आगे के बहुवचन क्रियारूप और ‘मूर्ख’ के साथ सहज मेल रखता है।
- source_word: אֱוִילִים
  choice: मूर्ख
  rationale: शब्द केवल कम बुद्धि नहीं, बल्कि विवेकहीनता का संकेत देता है। ‘मूर्ख’ इसका संक्षिप्त और प्रचलित हिन्दी समतुल्य है।
- source_word: לֹא יִתְעוּ
  choice: नहीं भटकेंगे
  rationale: תעה का अर्थ मार्ग से भटकना या गलती करना हो सकता है। ‘भटकेंगे’ यात्रा की प्रत्यक्ष छवि और रूपकात्मक अर्थ दोनों को बनाए रखता है।
theological_decisions:
- issue: ‘अशुद्ध’ की प्रकृति
  choice: ‘अशुद्ध’ को व्यापक रखा गया है; इसे केवल अनुष्ठानिक या केवल नैतिक अशुद्धता तक सीमित नहीं किया गया।
  alternative: ‘अनुष्ठानिक रूप से अशुद्ध’ या ‘नैतिक रूप से अपवित्र’
  rationale: भविष्यद्वाणी के संदर्भ में हिब्रू शब्द धार्मिक-विधिक और नैतिक दोनों अर्थच्छटाएँ रख सकता है। किसी एक अर्थ को चुनना पाठ की वास्तविक तनावपूर्ण व्यापकता को अनावश्यक रूप से सीमित कर देता।
- issue: कठिन वाक्यांश וְהוּא לָמוֹ का अभिप्राय
  choice: सर्वनाम को मार्ग की ओर संकेत करने वाला मानकर ‘पर वह उनके लिए होगा’ रखा गया है।
  alternative: ‘और वह उनके साथ होगा’ अथवा ‘वह उनका होगा’
  rationale: वाक्यांश अत्यंत संक्षिप्त और व्याकरण की दृष्टि से अस्पष्ट है। संदर्भ में मार्ग को परमेश्वर के लोगों के लिए मानना अशुद्ध व्यक्ति के निषेध और आगे मार्ग पर चलनेवालों के उल्लेख के साथ अच्छी तरह जुड़ता है, पर वैकल्पिक पाठ-संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। समानार्थी ‘राजमार्ग’, ‘रास्ता’ और ‘मार्ग’ हिब्रू की पुनरावृत्ति को बोझिल बनाए बिना उसकी मार्ग-छवि को बनाए रखते हैं। काव्यात्मक पंक्ति-विन्यास और दीर्घ विराम कठिन खंडों को स्पष्ट करते हैं।
