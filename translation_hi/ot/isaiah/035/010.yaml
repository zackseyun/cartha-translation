base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/010.yaml
  text: And the redeemed of Yahweh will return and come to Zion with singing; everlasting joy will be upon their heads. Gladness and joy will overtake them[a], and sorrow and sighing will flee away.
translation:
  language: hi
  text: 'और याहवे के छुड़ाए हुए[a] लोग लौटेंगे;

    वे आनंद से गाते हुए सिय्योन आएँगे।

    उनके सिर पर सदा का आनंद होगा।

    हर्ष और आनंद उन्हें आ पकड़ेंगे,

    और शोक और आहें भाग जाएँगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के दाम देकर छुड़ाए हुए लोग।” इब्रानी शब्द उन लोगों को सूचित कर सकता है जिन्हें छुड़ाया या फिरौती देकर मुक्त किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְדוּיֵי יְהוָה
  choice: यहोवा के छुड़ाए हुए लोग
  rationale: פדה का निष्क्रिय रूप उन लोगों को सूचित करता है जिन्हें छुड़ाया या दाम देकर मुक्त किया गया है। ‘छुड़ाए हुए’ आधुनिक हिन्दी में स्वाभाविक है और मूल की व्यापक मुक्ति-संबंधी अर्थछाया बनाए रखता है। יְהוָה को व्यक्तिवाचक वाचा-नाम के रूप में ‘यहोवा’ लिखा गया है।
- source_word: יְשֻׁבוּן
  choice: लौटेंगे
  rationale: שוב का सीधा अर्थ लौटना है; भविष्यकाल मूल क्रिया का भाव स्पष्ट रूप से व्यक्त करता है।
- source_word: וּבָאוּ צִיּוֹן
  choice: सिय्योन आएँगे
  rationale: בוא का अर्थ ‘आना’ या ‘प्रवेश करना’ हो सकता है। बिना व्यक्त पूर्वसर्ग वाले मूल पाठ के लिए ‘सिय्योन आएँगे’ स्वाभाविक और पर्याप्त रूप से सटीक है।
- source_word: בְּרִנָּה
  choice: जयजयकार करते हुए
  rationale: רִנָּה आनंद की ऊँची पुकार, उल्लास या गान को सूचित करता है। ‘जयजयकार करते हुए’ उसकी श्रव्य और उत्सवी शक्ति को ‘गाते हुए’ से अधिक व्यापक रूप में रखता है।
- source_word: וְשִׂמְחַת עוֹלָם
  choice: सदा का आनंद
  rationale: शाब्दिक अर्थ ‘सदैव का आनंद’ है। यह सरल, काव्यात्मक और עוֹלָם की स्थायी अवधि को व्यक्त करता है।
- source_word: עַל רֹאשָׁם
  choice: उनके सिर पर
  rationale: मूल की सजीव छवि को सीधे बनाए रखा गया है; आनंद मानो सिर पर धारण किया हुआ मुकुट हो।
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: हर्ष और आनंद
  rationale: दो निकटार्थी संज्ञाओं को दो अलग हिन्दी शब्दों से व्यक्त किया गया है, जिससे मूल की काव्यात्मक जोड़ी सुरक्षित रहती है।
- source_word: יַשִּׂיגוּ
  choice: उन्हें आ मिलेंगे
  rationale: נשׂג का अर्थ पहुँच जाना, जा पकड़ना या पा लेना हो सकता है। यहाँ हर्ष और आनंद कर्ता हैं; ‘आ मिलेंगे’ हिन्दी में सहज रहते हुए उस मानवीकरण को बनाए रखता है कि वे लोगों तक पहुँचते हैं।
- source_word: וְנָסוּ
  choice: दूर भाग जाएँगे
  rationale: נוס का अर्थ भागना है। यह अनुवाद शोक और आह भरने के मानवीकरण को सुरक्षित रखता है।
- source_word: יָגוֹן וַאֲנָחָה
  choice: शोक और आह भरना
  rationale: יָגוֹן दुःख या शोक है और אֲנָחָה आह भरना या कराहना। चुनी हुई जोड़ी भावात्मक और श्रव्य दोनों पक्षों को व्यक्त करती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। हिन्दी के साधारण बाइबलीय पाठकों के लिए परिचित ‘यहोवा’ नाम को पदवी ‘प्रभु’ से बदलने के बजाय नाम के रूप में रखा गया है; ‘याहवे’ अधिक संभावित शैक्षिक उच्चारण है।
- issue: פְדוּיֵי में ‘छुड़ाए हुए’ और ‘दाम देकर मुक्त किए हुए’ के बीच चयन
  choice: छुड़ाए हुए
  alternative: दाम देकर मुक्त किए हुए
  rationale: मूल शब्द दोनों अर्थछायाएँ वहन कर सकता है। ‘छुड़ाए हुए’ व्यापक उद्धारात्मक अर्थ को स्वाभाविक हिन्दी में रखता है और भुगतान की धारणा को अनावश्यक रूप से अनिवार्य नहीं बनाता; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय काव्यात्मक शैली रखी गई है। पंक्ति-विन्यास ने इब्रानी पद्य के समानांतर भावों को स्पष्ट किया है। ‘जयजयकार’, ‘सिर पर’, और ‘दूर भाग जाएँगे’ मूल की सजीव काव्यात्मक छवियाँ बनाए रखते हैं।
