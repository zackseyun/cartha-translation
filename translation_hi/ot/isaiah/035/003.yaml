  yaml_path: translation/ot/isaiah/035/003.yaml
  text: Strengthen weak hands[a], and make firm feeble knees.
translation:
  language: hi
  text: निर्बल हाथों को बल दो, और डगमगाते घुटनों को दृढ़ करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַזְּקוּ
  choice: बल दो
  rationale: पिएल बहुवचन आज्ञार्थक रूप यहाँ ‘हाथों’ को सशक्त करने का आह्वान है; ‘बल दो’ आधुनिक और स्वाभाविक हिन्दी है।
- source_word: יָדַיִם רָפוֹת
  choice: निर्बल हाथों
  rationale: रָפוֹת शक्ति की कमी या ढीलेपन को व्यक्त करता है; ‘निर्बल’ शारीरिक बिंब को स्पष्ट और गरिमापूर्ण ढंग से रखता है।
- source_word: וּבִרְכַּיִם
  choice: और ... घुटनों को
  rationale: संयोजक और संज्ञा को स्पष्ट रखते हुए इब्रानी समानांतर रचना सुरक्षित रखी गई है।
- source_word: כֹּשְׁלוֹת
  choice: डगमगाते
  rationale: כשל का कृदंत ठोकर खाने, लड़खड़ाने या जवाब देने की स्थिति का सजीव बिंब प्रस्तुत करता है; ‘डगमगाते’ घुटनों के संदर्भ में स्वाभाविक रहते हुए उस गतिशील बिंब को बचाता है।
- source_word: אַמֵּצוּ
  choice: दृढ़ करो
  rationale: पिएल बहुवचन आज्ञार्थक रूप पहले क्रियापद के अर्थ से मिलता-जुलता है, पर काव्यात्मक विविधता रखता है; ‘दृढ़ करो’ उसी भेद को बनाए रखता है।
