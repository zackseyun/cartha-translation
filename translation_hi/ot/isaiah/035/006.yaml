  text: אָ֣ז יְדַלֵּ֤ג כָּֽ/אַיָּל֙ פִּסֵּ֔חַ וְ/תָרֹ֖ן לְשׁ֣וֹן אִלֵּ֑ם כִּֽי נִבְקְע֤וּ בַ/מִּדְבָּר֙ מַ֔יִם וּ/נְחָלִ֖ים בָּ/עֲרָבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/006.yaml
  text: Then the lame will leap like a deer[a], and the tongue of the mute will sing for joy; for waters have burst forth in the wilderness[b], and streams in the desert plain.
translation:
  language: hi
  text: तब लँगड़ा हिरन के समान छलाँग लगाएगा, और गूँगे की जीभ आनंद से गाएगी[a]; क्योंकि उजाड़ प्रदेश में जल फूट निकले हैं, और मरुभूमि के मैदान में जलधाराएँ फूट निकली हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘आनंद से पुकार उठेगी।’
    reason: lexical_alternative
  - marker: b
    text: ‘मरुभूमि के मैदान’ के स्थान पर ‘अरावा में’ भी संभव है, यदि इस शब्द को सामान्य संज्ञा के बजाय भौगोलिक नाम माना जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: יְדַלֵּג
  choice: छलाँग लगाएगा
  rationale: पिएल रूप सजीव और जोरदार उछलने का भाव देता है; यह हिन्दी में स्वाभाविक है और चंगाई के चित्र को स्पष्ट रखता है।
- source_word: כָּאַיָּל
  choice: हिरन के समान
  rationale: אַיָּל हिरन या नर हिरन को सूचित कर सकता है; सामान्य और सहज हिन्दी के लिए ‘हिरन’ चुना गया है।
- source_word: פִּסֵּחַ
  choice: लँगड़ा
  rationale: विशेषण यहाँ संज्ञा के रूप में एक चलने में असमर्थ व्यक्ति के लिए प्रयुक्त है; एकवचन और सामान्य प्रतिनिधिक अर्थ बनाए रखा गया है।
- source_word: וְתָרֹן
  choice: आनन्द से गाएगी
  rationale: רנן आनन्दपूर्ण पुकार या गान दोनों का अर्थ दे सकता है; ‘जीभ’ के साथ ‘आनन्द से गाएगी’ स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: לְשׁוֹן אִלֵּם
  choice: गूँगे की जीभ
  rationale: मूल का ठोस शारीरिक चित्र निकटता से सुरक्षित रहता है और पुनः प्राप्त वाणी पर बल पड़ता है।
- source_word: נִבְקְעוּ
  choice: फूट निकले हैं
  rationale: निफ़अल रूप के फटकर खुलने और जल के अचानक निकल आने का भाव हिन्दी मुहावरे ‘फूट निकलना’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: בַמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר उजाड़, अनकृषित या मरुस्थलीय क्षेत्र को सूचित करता है; यह चयन अगले עֲרָבָה से कुछ भेद भी बनाए रखता है।
- source_word: מַיִם
  choice: जल
  rationale: हिन्दी में द्रव्यवाचक ‘जल’ अधिक स्वाभाविक है; इब्रानी बहुवचन का आशय घटाए बिना कृत्रिम ‘जलराशियाँ’ से बचा गया है।
- source_word: וּנְחָלִים
  choice: जलधाराएँ
  rationale: נְחָלִים बहती धाराओं या वादियों को सूचित कर सकता है; प्रसंग में उभरते बहते जल पर बल देने के लिए ‘जलधाराएँ’ स्पष्ट है।
- source_word: בָּעֲרָבָה
  choice: मरुभूमि के मैदान में
  rationale: सामान्य संज्ञा के रूप में यह शुष्क स्तेपी या रेगिस्तानी मैदान है और काव्यात्मक समानांतरता में उपयुक्त बैठता है; भौगोलिक नाम की संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: पुनर्स्थापना के चित्र का स्वरूप
  choice: शारीरिक चंगाई और पर्यावरणीय नवीकरण के ठोस भविष्यसूचक चित्र को यथावत रखना
  alternative: इसे केवल आत्मिक रूपक या केवल किसी एक विशिष्ट अंतकालीन पूर्ति के रूप में सीमित करना
  rationale: इब्रानी पाठ वास्तविक शारीरिक असमर्थताओं के उलटने और उजाड़ भूमि में जल आने का चित्र देता है, पर इस पद में उसकी पूर्ति की धर्मवैज्ञानिक योजना निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज काव्यात्मक गद्य; मूल के एकवचन, शारीरिक पुनर्स्थापना और उजाड़ भूमि में अचानक जल फूटने के सजीव चित्र को सुरक्षित रखा गया है।
