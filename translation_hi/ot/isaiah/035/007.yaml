base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/007.yaml
  text: The burning sand will become a pool[a], and the thirsty ground springs of water; in the haunt of jackals, where they lie down, there will be grass, reeds[c][b], and rushes.
translation:
  language: hi
  text: तपती रेत जलाशय बन जाएगी[a], और प्यासी भूमि में जल के सोते फूट निकलेंगे। सियारों के बसेरे में, जहाँ वे लेटते हैं, वहाँ घास, सरकंडे और नरकट[c] उगेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मृगतृष्णा जलाशय बन जाएगी।’ इब्रानी शब्द שָׁרָב झुलसाने वाली गर्मी या गर्मी से झिलमिलाते मरुस्थलीय दृश्य को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इस खंड का इब्रानी वाक्य-विन्यास संक्षिप्त है। इसका अनुवाद यह भी हो सकता है: ‘सियारों के बसेरे में, उनके विश्राम-स्थान में, घास, सरकंडे और नरकट उगेंगे।’'
    reason: lexical_alternative
  - marker: c
    text: ‘नरकट’ के लिए प्रयुक्त इब्रानी शब्द גֹמֶא का अनुवाद ‘पपीरस’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁרָב
  choice: तपती रेत
  rationale: यह शब्द झुलसाने वाली गर्मी या गर्मी से तपते और झिलमिलाते मरुस्थल का बोध करा सकता है। ‘तपती रेत’ दृश्य को ठोस और स्वाभाविक हिन्दी में व्यक्त करती है; ‘मृगतृष्णा’ वैकल्पिक अर्थ है।
- source_word: לַאֲגַם
  choice: जलाशय
  rationale: אֲגַם जल से भरे ताल या दलदली जलाशय को सूचित करता है। ‘जलाशय’ परिवर्तन के दृश्य को बिना अनावश्यक पारिस्थितिक विशिष्टता के व्यक्त करता है।
- source_word: צִמָּאוֹן
  choice: प्यासी भूमि
  rationale: संज्ञा का अर्थ ‘प्यास’ अथवा ‘सूखा स्थान’ हो सकता है। काव्यात्मक समानांतरता में यह भू-दृश्य को दर्शाती है; ‘प्यासी भूमि’ मूल के सजीव मानवीकरण को बनाए रखती है।
- source_word: לְמַבּוּעֵי מָיִם
  choice: जल के सोते
  rationale: מַבּוּעַ जल के फूटने वाले प्राकृतिक स्रोत को दर्शाता है और बहुवचन प्रचुरता का संकेत देता है। ‘जल के सोते’ आधुनिक हिन्दी में सहज है।
- source_word: בִּנְוֵה תַנִּים
  choice: सियारों के बसेरे में
  rationale: נָוֶה निवास या बसेरे का और תַנִּים यहाँ उजाड़ में रहने वाले सियारों का बोध कराता है। यह पुरातन ‘अजगरों’ जैसे अनुवाद से अधिक स्रोत-संगत है।
- source_word: רִבְצָהּ
  choice: जहाँ वे लेटते हैं
  rationale: רבץ का अर्थ लेटना या दुबकना है। क्रियात्मक हिन्दी अनुवाद सियारों के बसेरे से इसका संबंध स्पष्ट करता है, जबकि पादटिप्पणी संकुचित इब्रानी वाक्य-विन्यास की दूसरी सम्भावना सुरक्षित रखती है।
- source_word: חָצִיר לְקָנֶה וָגֹמֶא
  choice: घास की जगह सरकंडे और नरकट उगेंगे
  rationale: לְ परिणाम या परिवर्तन सूचित कर सकता है। यह अनुवाद सूखे प्रदेश की घास से आर्द्रभूमि की वनस्पति में परिवर्तन को व्यक्त करता है; वाक्यांश की व्याकरणिक संक्षिप्तता पादटिप्पणी में बताई गई है।
- source_word: גֹמֶא
  choice: नरकट
  rationale: यह आर्द्रभूमि में उगने वाले नरकट अथवा विशेष रूप से पपीरस को दर्शा सकता है। सामान्य पाठक के लिए ‘नरकट’ स्वाभाविक है और ‘पपीरस’ पादटिप्पणी में सुरक्षित है।
