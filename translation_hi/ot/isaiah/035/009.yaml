base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/009.yaml
  text: No lion will be there[a], and no ravenous beast will go up on it; it will not be found there[c][b], but the redeemed will walk there.
translation:
  language: hi
  text: वहाँ कोई सिंह न होगा, और कोई खूँखार पशु[a] उस पर[b] न चढ़ेगा; वह वहाँ पाया न जाएगा। परन्तु छुड़ाए गए लोग[c] वहाँ चलेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हिंसक पशु,’ ‘भयंकर पशु,’ अथवा ‘शिकारी पशु।’
    reason: lexical_alternative
  - marker: b
    text: ‘उस पर’ का संकेत सम्भवतः पिछले पद में बताए गए राजमार्ग की ओर है।
    reason: cross_reference
  - marker: c
    text: या ‘मुक्त किए गए लोग।’ यहाँ ‘छुड़ाए गए’ के लिए इब्रानी शब्द गाअल प्रयुक्त है, जो अगले पद में प्रयुक्त पादा से भिन्न है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְיֵה
  choice: सिंह
  rationale: यह पशु का सीधा और स्वाभाविक नाम है; एकवचन यहाँ जाति का सामान्य प्रतिनिधित्व करता है।
- source_word: פְרִיץ חַיּוֹת
  choice: खूँखार पशु
  rationale: פְרִיץ हिंसक, क्रूर या उग्र शक्ति का बोध कराता है; पशु-संदर्भ में ‘खूँखार पशु’ खतरे और शिकारी स्वभाव को सहज हिन्दी में व्यक्त करता है।
- source_word: בַּל
  choice: न
  rationale: काव्यात्मक निषेध को आधुनिक हिन्दी में स्वाभाविक रूप से ‘न’ द्वारा व्यक्त किया गया है।
- source_word: יַעֲלֶנָּה
  choice: उस पर न चढ़ेगा
  rationale: עלה का मूल अर्थ ‘चढ़ना/ऊपर जाना’ है। स्त्रीलिंग प्रत्यय का सबसे स्वाभाविक पूर्वपद पिछले पद में उल्लिखित सड़क या राजमार्ग है; ‘उस पर’ इस संदर्भ को बिना अनावश्यक विस्तार के बनाए रखता है।
- source_word: תִמָּצֵא
  choice: वह वहाँ पाया भी न जाएगा
  rationale: מצא का निफ़अल सामान्यतः ‘पाया जाना’ है। हिन्दी में ‘भी’ निषेध की काव्यात्मक दृढ़ता और पहले कथन के साथ इसके संबंध को स्वाभाविक बनाता है।
- source_word: גְּאוּלִים
  choice: छुड़ाए गए लोग
  rationale: גאל का कर्मवाच्य कृदन्त उन लोगों को दर्शाता है जिन्हें छुड़ाया या वापस पाया गया है। यह रूप अर्थ को स्पष्ट, सहज और धर्मवैज्ञानिक गहराई सहित रखता है।
- source_word: וְהָלְכוּ
  choice: वहाँ चलेंगे
  rationale: הלך का सामान्य अर्थ ‘चलना/जाना’ है। ‘वहाँ चलेंगे’ सुरक्षित मार्ग पर निर्भय यात्रा के संदर्भ को बनाए रखता है।
- source_word: שָׁם
  choice: वहाँ
  rationale: स्थानवाचक क्रियाविशेषण की पुनरावृत्ति उस स्थान की सुरक्षा पर बल देती है; हिन्दी में ‘वहाँ’ इसे स्वाभाविक रूप से सुरक्षित रखता है।
theological_decisions:
- issue: גְּאוּלִים में छुटकारे की शब्दावली
  choice: छुड़ाए गए लोग
  alternative: मोल देकर छुड़ाए गए लोग / मुक्त किए गए लोग
  rationale: यहाँ גאל प्रयुक्त है, जबकि अगले पद में פדה आता है। मुख्य पाठ में सहज हिन्दी रखी गई है और पादटिप्पणी में दोनों इब्रानी शब्दों का भेद बताया गया है, ताकि उनके अर्थों को अनावश्यक रूप से एक न कर दिया जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की काव्यात्मक पुनरावृत्ति तथा मार्ग की सुरक्षा पर दिया गया बल सुरक्षित रखा गया है। ‘परन्तु’ विपरीतता को स्पष्ट करता है, जबकि ‘उस पर’ पिछले पद के राजमार्ग से संबंध बनाए रखता है।
