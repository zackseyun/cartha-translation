source:
  edition: WLC
  text: אִמְרוּ֙ לְ/נִמְהֲרֵי לֵ֔ב חִזְק֖וּ אַל תִּירָ֑אוּ הִנֵּ֤ה אֱלֹֽהֵי/כֶם֙ נָקָ֣ם יָב֔וֹא גְּמ֣וּל אֱלֹהִ֔ים ה֥וּא יָב֖וֹא וְ/יֹשַׁעֲ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/004.yaml
  text: Say to those with an anxious heart[a], “Be strong; do not fear. Look, your God will come with vengeance, with the recompense of God[b]; he himself will come and save you.”
translation:
  language: hi
  text: व्याकुल मन वालों से कहो[a], “हिम्मत बाँधो, मत डरो! देखो, तुम्हारा परमेश्वर प्रतिशोध और परमेश्वर का प्रतिफल लेकर आएगा[b]। वह स्वयं आएगा और तुम्हें बचाएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, शाब्दिक रूप से, “मन के उतावलों से”; आशय उन लोगों से है जो भीतर से व्याकुल, घबराए या आतंकित हैं।
    reason: lexical_alternative
  - marker: b
    text: या, अधिक शाब्दिक रूप से, “प्रतिशोध आएगा, परमेश्वर का प्रतिफल।” इब्रानी वाक्यरचना संक्षिप्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִמְהֲרֵי לֵב
  choice: घबराए हुए मनवालों
  rationale: मुहावरे का शाब्दिक अर्थ ‘मन के उतावले’ है, पर प्रसंग में यह भीतर से व्याकुल, घबराए या आतंकित लोगों को सूचित करता है। चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक है और अगली आज्ञा ‘मत डरो’ से अनावश्यक रूप से हूबहू नहीं दोहराता।
- source_word: חִזְקוּ
  choice: हिम्मत बाँधो
  rationale: बहुवचन आज्ञा का प्रोत्साहनात्मक बल हिन्दी के इस स्वाभाविक मुहावरे में स्पष्ट रूप से व्यक्त होता है; ‘दृढ़ हो जाओ’ भी संभव है।
- source_word: אַל תִּירָאוּ
  choice: मत डरो
  rationale: नकारात्मक बहुवचन आज्ञा का सीधा, संक्षिप्त और सहज अनुवाद।
- source_word: הִנֵּה
  choice: देखो
  rationale: आगे कही जाने वाली बात की ओर ध्यान खींचने वाले इब्रानी संकेतक को बनाए रखता है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय सहित पद का सीधा अनुवाद, जो संबंधपरक बल को बनाए रखता है।
- source_word: נָקָם
  choice: बदला लेने
  rationale: संज्ञा का अर्थ प्रतिशोध अथवा बदला है। हिन्दी में क्रियात्मक रूप वाक्य को स्वाभाविक बनाता है, पर परमेश्वर के प्रतिशोध के स्पष्ट और कठोर आशय को नरम नहीं करता।
- source_word: גְּמוּל אֱלֹהִים
  choice: परमेश्वर की ओर से प्रतिफल देने
  rationale: ‘परमेश्वर का प्रतिफल’ मूल संरचना के निकट है, पर हिन्दी में संबंध को स्पष्ट करने के लिए ‘परमेश्वर की ओर से’ स्वाभाविक है। पादटिप्पणी संक्षिप्त इब्रानी वाक्यरचना का अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: הוּא
  choice: वह स्वयं
  rationale: स्वतंत्र सर्वनाम के बलाघात को सुरक्षित रखता है कि परमेश्वर स्वयं आएगा।
- source_word: וְיֹשַׁעֲכֶם
  choice: और तुम्हें बचाएगा
  rationale: हिफ़ील रूप के ‘बचाने/छुड़ाने’ के अर्थ को व्यापक और प्रसंगानुकूल हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के प्रतिशोध और उद्धार का संबंध
  choice: प्रतिशोध, प्रतिफल और अपने लोगों को बचाने—तीनों बातों को साथ और स्पष्ट रखा गया है।
  alternative: ‘बदला’ को केवल सामान्य ‘न्याय’ बनाकर नरम करना, अथवा बचाने को केवल आत्मिक उद्धार मानना।
  rationale: इब्रानी पाठ परमेश्वर के बदले और प्रतिफल को उसके लोगों को बचाने के साथ रखता है। अनुवाद इस धर्मवैचारिक तनाव को बिना समझाकर समाप्त किए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के लिए सहज रखी गई है। ‘हिम्मत बाँधो’ सामान्य हिन्दी में प्रोत्साहन का स्वाभाविक रूप है। ‘बदला’ और ‘प्रतिफल’ दोनों रखकर मूल की समानांतर तथा धर्मवैचारिक धार को सुरक्षित रखा गया है।
