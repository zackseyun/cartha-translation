id: ISA.35.5
reference: Isaiah 35:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אָ֥ז תִּפָּקַ֖חְנָה עֵינֵ֣י עִוְרִ֑ים וְ/אָזְנֵ֥י חֵרְשִׁ֖ים תִּפָּתַֽחְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/005.yaml
  text: Then the eyes of the blind will be opened[a], and the ears of the deaf will be opened.
translation:
  language: hi
  text: तब अंधों की आँखें खुल जाएँगी, और बहरों के कान भी खुल जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण भविष्य में होने वाले उस परिणाम को दिखाता है जो पिछले कथन से जुड़ा है; ‘तब’ संक्षिप्त और स्वाभाविक है।
- source_word: תִּפָּקַחְנָה
  choice: खुल जाएँगी
  rationale: פקח के निफ़अल अपूर्ण रूप का कर्ता ‘आँखें’ है। ‘खुल जाएँगी’ उसके भावी और अकर्मक/भाववाच्य अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘पूरी तरह’ जैसा अतिरिक्त बल जोड़े।
- source_word: עֵינֵי עִוְרִים
  choice: अंधों की आँखें
  rationale: हिब्रू में ‘अंधे’ विशेषण का संज्ञा के रूप में बहुवचन प्रयोग हुआ है। यह हिन्दी में संक्षिप्त, स्पष्ट और समानांतर काव्य-रचना के अनुकूल है।
- source_word: וְאָזְנֵי חֵרְשִׁים
  choice: और बहरों के कान भी
  rationale: ‘बहरों के कान’ मूल की संबंधसूचक रचना को सीधे व्यक्त करता है। ‘भी’ हिब्रू संयोजक से बने समानांतर और समावेशी भाव को हिन्दी में सहज बनाता है, कोई नया आशय नहीं जोड़ता।
- source_word: תִּפָּתַחְנָה
  choice: खुल जाएँगे
  rationale: פתח के निफ़अल अपूर्ण रूप का मूल अर्थ ‘खोले जाएँगे/खुल जाएँगे’ है। कानों के साथ ‘खुल जाएँगे’ आधुनिक हिन्दी में स्वाभाविक है और बहरेपन से सुनने की बहाली की ठोस छवि बनाए रखता है।
theological_decisions:
- issue: पुनर्स्थापना की शारीरिक छवि का स्वरूप
  choice: आँखों और कानों के खुलने को ठोस शारीरिक पुनर्स्थापना की भाषा में रखा गया है, पर उसके अर्थ को केवल शारीरिक या केवल आत्मिक नहीं ठहराया गया।
  alternative: इसे केवल चमत्कारी शारीरिक चंगाई या केवल आत्मिक समझ की उपमा के रूप में स्पष्ट करना।
  rationale: पद स्वयं शरीर के अंगों और उनकी बहाली की ठोस भाषा प्रयोग करता है। अनुवाद को व्यापक भविष्यद्वाणी-संबंधी अर्थ पर निर्णय थोपे बिना यही तनाव बनाए रखना चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और काव्यात्मक समानांतरता के अनुकूल। दोनों उपवाक्यों में ‘खुल जाएँगी/खुल जाएँगे’ रखकर मूल के दो निकटार्थक क्रियापदों की साझा छवि सुरक्षित की गई है; ‘भी’ हिन्दी के स्वाभाविक समानांतर प्रवाह के लिए प्रयुक्त है।
