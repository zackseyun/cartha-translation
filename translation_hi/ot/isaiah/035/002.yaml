base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/002.yaml
  text: It will blossom abundantly and rejoice—yes[a], with rejoicing and a shout of joy. The glory of Lebanon will be given to it, the majesty of Carmel and Sharon. They will see the glory of Yahweh[c][b], the majesty of our God.
translation:
  language: hi
  text: वह खूब खिलेगी और उल्लसित होगी—हाँ,[a] उल्लास और जयजयकार के साथ। लबानोन की महिमा उसे दी जाएगी, कर्मेल और शारोन का वैभव भी। वे यहोवा[b] की महिमा, हमारे परमेश्वर का वैभव देखेंगे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वह निश्चय ही खिलेगी’; इब्रानी में क्रिया के साथ उसी धातु का infinitive absolute प्रयोग करके जोर दिया गया है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में परमेश्वर का नाम ‘YHWH’ है; इसे ‘याहवे’ भी लिखा जाता है और परम्परागत अनुवादों में प्रायः ‘प्रभु’ कहा गया है।
    reason: alternative_reading
  - marker: c
    text: लबानोन, कर्मेल और शारोन अपनी प्राकृतिक सुन्दरता और उर्वरता के लिए प्रसिद्ध प्रदेश थे; यहाँ निर्जन भूमि को उनकी शोभा मिलने का चित्र है। ‘वे’ किसे सूचित करता है, यह इब्रानी में स्पष्ट नहीं किया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: פָּרֹחַ תִּפְרַח
  choice: भरपूर फूलेगा
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute प्रबलता या प्रचुरता व्यक्त करता है; ‘भरपूर फूलेगा’ आधुनिक हिन्दी में पुष्पित होने की तीव्र और समृद्ध छवि बनाए रखता है।
- source_word: וְתָגֵל ... גִּילַת
  choice: आनन्द मनाएगा—हाँ, आनन्द ... के साथ
  rationale: एक ही मूल से बने क्रिया और संज्ञा का दोहराव उल्लास पर बल देता है; हिन्दी में सीमित पुनरावृत्ति उस काव्यात्मक जोर को सुरक्षित रखती है।
- source_word: וְרַנֵּן
  choice: जयजयकार के साथ
  rationale: רנן हर्षपूर्ण गान या ऊँची आनन्द-ध्वनि दोनों सूचित कर सकता है; ‘जयजयकार’ उसका श्रव्य और उत्सवपूर्ण भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כְּבוֹד הַלְּבָנוֹן
  choice: लबानोन का वैभव
  rationale: כבוד यहाँ प्राकृतिक भव्यता सूचित करता है। ‘वैभव’ भूमि के सौन्दर्य के लिए स्वाभाविक है, जबकि बाद में परमेश्वर के लिए ‘महिमा’ हिन्दी में अधिक उपयुक्त है; मूल की पुनरावृत्ति अर्थगत रूप से बनी रहती है, यद्यपि एक ही हिन्दी शब्द से नहीं।
- source_word: נִתַּן לָהּ
  choice: उसे दिया जाएगा
  rationale: रूप पूर्णकालिक निष्क्रिय है, पर भविष्याभिमुख भविष्यवाणी के प्रसंग में हिन्दी का भविष्यकाल स्वाभाविक है। स्त्रीलिंग एकवचन प्रत्यय का संदर्भ पिछले पद की निर्जन भूमि से है।
- source_word: הֲדַר הַכַּרְמֶל וְהַשָּׁרוֹן
  choice: कर्मेल और शारोन की शोभा
  rationale: הדר सौन्दर्य, वैभव या गरिमा व्यक्त करता है। इन उर्वर प्रदेशों के संदर्भ में ‘शोभा’ स्पष्ट और काव्यात्मक है।
- source_word: הֵמָּה יִרְאוּ
  choice: वे ... देखेंगे
  rationale: स्पष्ट पुल्लिंग बहुवचन सर्वनाम और क्रिया को बनाए रखा गया है। उसका सटीक मानवीय संदर्भ पाठ में खुला है; अनुवाद उसे स्पष्ट करके नहीं थोपता।
- source_word: כְבוֹד יְהוָה
  choice: यहोवा की महिमा
  rationale: ईश्वरीय नाम יהוה को नाम के रूप में ‘यहोवा’ दिया गया है और כבוד को ईश्वरीय संदर्भ में प्रचलित ‘महिमा’ से व्यक्त किया गया है।
- source_word: הֲדַר אֱלֹהֵינוּ
  choice: हमारे परमेश्वर की शोभा
  rationale: הדר के लिए वही ‘शोभा’ रखा गया है जो कर्मेल और शारोन के संदर्भ में आया है, जिससे भूमि की शोभा और परमेश्वर की शोभा के बीच काव्यात्मक समानता सुरक्षित रहती है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में टेट्राग्राम יהוה प्रत्यक्ष है। उसे उपाधि में बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले नामरूप ‘यहोवा’ से प्रस्तुत किया गया है; पादटिप्पणी अन्य प्रचलित रूप और परम्परागत प्रस्तुति बताती है।
- issue: הֵמָּה (‘वे’) का संदर्भ
  choice: बहुवचन सर्वनाम ‘वे’ को ज्यों का त्यों रखना
  alternative: ‘वहीं ... दिखाई देगी’ कहकर सर्वनाम हटाना; भूभागों को मानवीकृत कर्ता मानना
  rationale: मूल में जोरदार बहुवचन सर्वनाम और बहुवचन क्रिया है, जबकि पहले निर्जन भूमि स्त्रीलिंग एकवचन है। ‘वे’ पाठ के व्याकरण और संदर्भ की वास्तविक अस्पष्टता को बनाए रखता है।
- issue: כבוד और הדר के बीच शब्दगत संबंध
  choice: כבוד के लिए ‘वैभव/महिमा’ और הדר के लिए ‘शोभा’
  alternative: दोनों स्थानों पर क्रमशः ‘महिमा’ और ‘प्रताप’
  rationale: हिन्दी में प्राकृतिक प्रदेशों की ‘महिमा’ और परमेश्वर का ‘प्रताप’ संभव हैं, पर चुने हुए शब्द साधारण पाठक के लिए अधिक स्वाभाविक हैं। साथ ही הדר की दोनों आवृत्तियों में ‘शोभा’ रखकर मूल समानांतरता सुरक्षित की गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘भरपूर फूलेगा’, ‘आनन्द’ और ‘जयजयकार’ मूल की बढ़ती हुई उल्लास-ध्वनि व्यक्त करते हैं। ‘वे’ की अस्पष्टता जानबूझकर सुरक्षित है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
