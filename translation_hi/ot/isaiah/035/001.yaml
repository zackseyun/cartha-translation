  text: The wilderness and the dry land will rejoice[a]; the desert plain will be glad and blossom like the crocus.
translation:
  language: hi
  text: निर्जन प्रदेश और सूखी भूमि उल्लसित होंगे; रेगिस्तानी मैदान मगन होगा और क्रोकस[a] के समान खिलेगा।
  philosophy: optimal-equivalence
  footnotes:
