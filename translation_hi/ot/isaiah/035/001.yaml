    reason: lexical_alternative
lexical_decisions:
- source_word: יְשֻׂשׂוּם
  choice: आनन्द मनाएँगे
  rationale: שׂוּשׂ प्रबल हर्ष व्यक्त करता है। रूप में कठिन 3 पुं. बहु. प्रत्यय है, पर पद्य की समानांतर रचना में जंगल और सूखी भूमि को आनन्दित कर्ता मानना सबसे स्वाभाविक है। भविष्यकाल भविष्यसूचक संदर्भ के अनुकूल है।
- source_word: מִדְבָּר
  choice: जंगल
  rationale: यहाँ मִדְבָּר निर्जन, अनजुती वनभूमि या उजाड़ प्रदेश को दर्शाता है; ‘जंगल’ सामान्य हिन्दी पाठक के लिए स्वाभाविक है और इसे केवल रेतीला रेगिस्तान नहीं बनाता।
- source_word: צִיָּה
  choice: सूखी भूमि
  rationale: यह शब्द शुष्कता पर बल देता है और מִדְבָּר के साथ अर्थपूर्ण युग्म बनाता है।
- source_word: תָגֵל
  choice: मगन होगी
  rationale: גיל उल्लासपूर्ण प्रसन्नता दर्शाता है। ‘मगन होगी’ पहले खंड के ‘आनन्द मनाएँगे’ से काव्यात्मक विविधता रखते हुए उसका समानांतर अर्थ बचाता है।
- source_word: עֲרָבָה
  choice: मरुभूमि
  rationale: इस संदर्भ में इसे विशिष्ट भौगोलिक नाम ‘अरावा’ के बजाय शुष्क मैदानी प्रदेश के सामान्य अर्थ में लिया गया है। ‘मरुभूमि’ संक्षिप्त और काव्यात्मक है।
- source_word: תִפְרַח
  choice: खिलेगी
  rationale: פרח वनस्पति के फूलने या खिलने को व्यक्त करता है और हिन्दी में फूल की उपमा के साथ ‘खिलेगी’ सहज है।
- source_word: חֲבַצָּלֶת
  choice: कुमुदिनी
  rationale: वनस्पति की सटीक पहचान अनिश्चित है। ‘कुमुदिनी’ एक परिचित, गरिमापूर्ण पुष्पनाम है; अनिश्चितता और अन्य सम्भावित पहचानों को पादटिप्पणी में स्पष्ट किया गया है।
