  edition: WLC
  text: אַֽל תִּשְׁמְע֖וּ אֶל חִזְקִיָּ֑הוּ כִּי֩ כֹ֨ה אָמַ֜ר הַ/מֶּ֣לֶךְ אַשּׁ֗וּר עֲשֽׂוּ אִתִּ֤/י בְרָכָה֙ וּ/צְא֣וּ אֵלַ֔/י וְ/אִכְל֤וּ אִישׁ גַּפְנ/וֹ֙ וְ/אִ֣ישׁ תְּאֵנָת֔/וֹ וּ/שְׁת֖וּ אִ֥ישׁ מֵי בוֹרֽ/וֹ־־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/016.yaml
  text: 'Do not listen to Hezekiah[a], for this is what the king of Assyria says: Make peace with me and come out to me, and let each man eat from his own vine and each from his own fig tree, and let each man drink the water of his own cistern[b],'
translation:
  language: hi
  text: '“हिजकिय्याह की बात मत सुनो, क्योंकि अश्शूर का राजा यह कहता है: मेरे साथ संधि कर लो[a] और निकलकर मेरे पास आओ; और हर पुरुष अपनी दाखलता से खाए, और हर पुरुष अपने अंजीर के पेड़ से खाए, और हर पुरुष अपने कुंड का पानी पीए[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “मेरे साथ आशीष करो।” यहाँ यह मुहावरा संधि करने या अनुकूल शर्तों पर समझौता करने के अर्थ में है।'
    reason: lexical_alternative
  - marker: b
    text: “हर पुरुष” उस इब्रानी शब्द का अनुवाद है जो यहाँ तीन बार एकवचन में वितरणात्मक अर्थ देता है—समूह का प्रत्येक पुरुष।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְעוּ אֶל
  choice: की बात सुनो
  rationale: यह इब्रानी मुहावरा किसी की बात पर ध्यान देने या उसे मानने का भाव रखता है। ‘की बात सुनो’ आधुनिक हिन्दी में स्वाभाविक है और इसे सीधे ‘आज्ञा मानो’ कहकर आवश्यकता से अधिक स्पष्ट नहीं करता।
- source_word: חִזְקִיָּהוּ
  choice: हिजकिय्याह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: כִּי כֹה אָמַר
  choice: क्योंकि ... यह कहता है
  rationale: प्रत्यक्ष कथन आरम्भ कराने वाले दूत-सूत्र को आधुनिक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: הַמֶּלֶךְ אַשּׁוּר
  choice: अश्शूर का राजा
  rationale: इब्रानी संबंध-वाक्यांश का सीधा और हिन्दी में प्रचलित रूप।
- source_word: עֲשׂוּ אִתִּי בְרָכָה
  choice: मेरे साथ संधि कर लो
  rationale: शाब्दिक रूप में ‘मेरे साथ आशीष करो’ है, पर इस राजनयिक संदर्भ में इसका आशय अनुकूल शर्तों पर समझौता या संधि करना है। ‘संधि कर लो’ शांति स्थापित करने और अधीनता की शर्तें स्वीकार करने के बीच मूल की तनावपूर्ण व्यापकता को पर्याप्त रूप से बनाए रखता है।
- source_word: וּצְאוּ אֵלַי
  choice: और निकलकर मेरे पास आओ
  rationale: יצא के मूल ‘निकलना’ को बनाए रखता है; ‘आत्मसमर्पण करो’ निहित आशय हो सकता है, पर वह मूल शब्द से अधिक व्याख्यात्मक है।
- source_word: אִישׁ
  choice: हर पुरुष
  rationale: बार-बार प्रयुक्त इब्रानी पुल्लिंग एकवचन का वितरणात्मक अर्थ व्यक्त करता है और स्रोत के लिंग-सूचक रूप को सुरक्षित रखता है।
- source_word: גַּפְנוֹ
  choice: अपनी ही दाखलता
  rationale: स्वामित्वसूचक प्रत्यय को ‘अपनी ही’ से स्पष्ट किया गया है; दाखलता स्थिरता और समृद्धि की परिचित बाइबलीय छवि है।
- source_word: תְּאֵנָתוֹ
  choice: अपने ही अंजीर के पेड़
  rationale: स्वामित्वसूचक प्रत्यय और व्यक्तिगत सुरक्षा की छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵי בוֹרוֹ
  choice: अपने ही कुंड का पानी
  rationale: בּוֹר यहाँ जल-संग्रह के लिए खोदा या बनाया गया कुंड है, झरने से पोषित कुआँ नहीं; ‘कुंड’ सामान्य हिन्दी पाठक के लिए सटीक और सुबोध है।
theological_decisions:
- issue: अश्शूरी निमंत्रण में ‘संधि’ और ‘आत्मसमर्पण’ का संबंध
  choice: मुख्य पाठ में ‘संधि कर लो’ और ‘निकलकर मेरे पास आओ’ रखा गया है।
  alternative: ‘मेरे सामने आत्मसमर्पण कर दो’
  rationale: संदर्भ आत्मसमर्पण का संकेत देता है, पर इब्रानी अभिव्यक्ति उसे सीधे उस शब्द में नहीं कहती। इसलिए राजनीतिक दबाव और प्रकट शांति-प्रस्ताव के बीच मूल तनाव को खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। राजकीय घोषणा का औपचारिक स्वर बना रहता है। ‘दाखलता’ और ‘कुंड’ जैसे शब्द स्रोत की कृषि तथा जल-संग्रह संबंधी छवियों को सटीक रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
