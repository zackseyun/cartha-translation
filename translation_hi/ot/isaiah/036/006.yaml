  text: הִנֵּ֣ה בָטַ֡חְתָּ עַל מִשְׁעֶנֶת֩ הַ/קָּנֶ֨ה הָ/רָצ֤וּץ הַ/זֶּה֙ עַל מִצְרַ֔יִם אֲשֶׁ֨ר יִסָּמֵ֥ךְ אִישׁ֙ עָלָ֔י/ו וּ/בָ֥א בְ/כַפּ֖/וֹ וּ/נְקָבָ֑/הּ כֵּ֚ן פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם לְ/כָֽל הַ/בֹּטְחִ֖ים עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/006.yaml
  text: Look[a], you are trusting in Egypt, that broken reed of a staff, which, if a man leans on it, goes into his hand and pierces it. So is Pharaoh king of Egypt to all who trust in him.
translation:
  language: hi
  text: देखो, तुम मिस्र पर—टूटे हुए सरकंडे की उस लाठी पर—भरोसा कर रहे हो। यदि कोई आदमी[a] उस पर टेक लगाए, तो वह सरकंडा उसकी हथेली में घुस जाता है और उसे बेध देता है। मिस्र का राजा फ़िरौन उन सभी के लिए ऐसा ही है जो उस पर भरोसा करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘आदमी’ है; यहाँ पुल्लिंग एकवचन का प्रयोग प्रतिनिधिक अर्थ में हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह शब्द श्रोता का ध्यान खींचता है। ‘देखो’ आधुनिक और स्वाभाविक हिन्दी में उसके संकेतात्मक बल को बनाए रखता है।
- source_word: בָטַחְתָּ
  choice: तुम ... भरोसा कर रहे हो
  rationale: इब्रानी पूर्ण रूप यहाँ वर्तमान में जारी राजनीतिक निर्भरता को व्यक्त करता है; हिन्दी का अपूर्ण वर्तमान इसे स्वाभाविक ढंग से प्रकट करता है।
- source_word: מִשְׁעֶנֶת הַקָּנֶה הָרָצוּץ
  choice: टूटे हुए सरकंडे की ... लाठी
  rationale: מִשְׁעֶנֶת सहारा लेने की वस्तु है और आगे उस पर टेक लगाने की बात आती है। ‘लाठी’ ठोस रूपक को बनाए रखती है, जबकि ‘टूटा हुआ सरकंडा’ उसकी अविश्वसनीयता दिखाता है।
- source_word: עַל מִצְרַיִם
  choice: मिस्र पर
  rationale: בטח के साथ עַל निर्भरता का लक्ष्य बताता है। हिन्दी में ‘मिस्र पर भरोसा’ स्वाभाविक है और ‘पर’ मूल पूर्वसर्ग के रूपकात्मक संबंध को भी बनाए रखता है।
- source_word: אֲשֶׁר יִסָּמֵךְ אִישׁ עָלָיו
  choice: यदि कोई आदमी उस पर टेक लगाए
  rationale: सापेक्ष वाक्य सरकंडे पर सहारा लेने की काल्पनिक स्थिति बताता है। ‘यदि’ उस निहित शर्त को स्पष्ट और स्वाभाविक बनाता है।
- source_word: אִישׁ
  choice: कोई आदमी
  rationale: पुल्लिंग एकवचन को प्रतिनिधिक उदाहरण के रूप में रखा गया है; ‘कोई’ उसके सामान्य प्रयोग को स्पष्ट करता है।
- source_word: וּבָא בְכַפּוֹ וּנְקָבָהּ
  choice: वह उसकी हथेली में घुसकर उसे छेद देती है
  rationale: यह टूटे सरकंडे के हाथ में धँसने और हथेली को भेदने का सजीव परिणाम बताता है। वर्तमान काल इब्रानी वर्णन की प्रत्यक्ष, सामान्य परिणति को बनाए रखता है।
- source_word: כֵּן
  choice: ऐसा ही है
  rationale: यह सरकंडे के चित्र और फ़िरौन के बीच स्पष्ट तुलना स्थापित करता है।
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: मिस्र का राजा फ़िरौन
  rationale: यह इब्रानी के संक्षिप्त समानाधिकरण को स्वाभाविक हिन्दी पदक्रम में प्रस्तुत करता है।
- source_word: לְכָל הַבֹּטְחִים עָלָיו
  choice: उन सभी के लिए ... जो उस पर भरोसा करते हैं
  rationale: यह फ़िरौन के चरित्र और परिणाम को हर उस व्यक्ति के संबंध में व्यक्त करता है जो उस पर निर्भर है; पहले प्रयुक्त ‘भरोसा’ से शब्द-संगति भी बनी रहती है।
