source:
  edition: WLC
  text: וְ/עַתָּה֙ הֲ/מִ/בַּלְעֲדֵ֣י יְהוָ֔ה עָלִ֛יתִי עַל הָ/אָ֥רֶץ הַ/זֹּ֖את לְ/הַשְׁחִיתָ֑/הּ יְהוָה֙ אָמַ֣ר אֵלַ֔/י עֲלֵ֛ה אֶל הָ/אָ֥רֶץ הַ/זֹּ֖את וְ/הַשְׁחִיתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/010.yaml
  text: And now[a], was it apart from Yahweh that I came up against this land to destroy it? Yahweh said to me, ‘Go up against this land and destroy it.’
translation:
  language: hi
  text: और अब[a], क्या मैं याहवे के बिना इस देश को नष्ट करने के लिए इस देश के विरुद्ध चढ़ आया हूँ? याहवे ने मुझसे कहा, ‘इस देश पर चढ़ाई कर और इसे नष्ट कर दे।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे से स्वतंत्र होकर।”
    reason: מִבַּלְעֲדֵי का अर्थ ‘के बिना’ (मुख्य पाठ) अथवा ‘से स्वतंत्र होकर’ हो सकता है।
lexical_decisions:
- source_word: הֲמִבַּלְעֲדֵי
  choice: क्या ... याहवे के बिना
  rationale: प्रश्नवाचक הֲ और מִבַּלְעֲדֵי मिलकर एक आलंकारिक प्रश्न बनाते हैं। ‘के बिना’ स्वाभाविक हिन्दी है और यह अर्थ खुला रखता है कि कार्य याहवे से स्वतंत्र अथवा उनकी अनुमति के बिना नहीं किया गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: עָלִיתִי עַל הָאָרֶץ הַזֹּאת
  choice: इस देश ... पर चढ़ आया हूँ
  rationale: עלה के दिशासूचक अर्थ और על के विरोधात्मक सैनिक संदर्भ को बनाए रखते हुए ‘पर चढ़ आया’ चुना गया है।
- source_word: לְהַשְׁחִיתָהּ
  choice: इसे नष्ट करने के लिए
  rationale: שׁחת के हिफ़ील रूप का सीधा विनाशकारी अर्थ व्यक्त करता है और स्त्रीलिंग प्रत्यय का संकेत ‘इस देश’ की ओर रखता है।
- source_word: עֲלֵה אֶל הָאָרֶץ הַזֹּאת
  choice: इस देश पर चढ़ाई कर
  rationale: आज्ञार्थक עלה और सैनिक प्रसंग को सहज आधुनिक हिन्दी में व्यक्त करने के लिए ‘चढ़ाई कर’ चुना गया है।
- source_word: וְהַשְׁחִיתָהּ
  choice: और इसे नष्ट कर दे
  rationale: दूसरी स्पष्ट आज्ञा और मूल की पुनरावृत्ति को बनाए रखा गया है।
theological_decisions:
- issue: याहवे द्वारा आक्रमण की आज्ञा दिए जाने का अश्शूरी प्रवक्ता का दावा
  choice: दावे को सीधे उद्धृत कथन के रूप में रखा गया
  alternative: दावे को अनिश्चित या झूठा बताने वाला व्याख्यात्मक शब्द जोड़ना
  rationale: मूल पाठ वक्ता का दावा प्रस्तुत करता है, पर इसी पद में उसकी सत्यता पर निर्णय नहीं देता; इसलिए अनुवाद न तो उसका समर्थन करता है, न उसे चुपचाप अस्वीकार करता है।
- issue: יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से प्रतिस्थापित न करके उसका लिप्यंतरण रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सैनिक प्रसंग में ‘चढ़ आया’ और आज्ञा में ‘चढ़ाई कर’ स्वाभाविक हैं। मुख्य पाठ का [a] चिह्न संबंधित पादटिप्पणी से मेल खाता है।
