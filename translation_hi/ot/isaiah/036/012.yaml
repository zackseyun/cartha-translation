base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/012.yaml
  text: But the Rabshakeh said[a], “Has my master sent me to your master and to you to speak these words? Has he not sent me to the men sitting on the wall, to eat their own dung and drink their own urine with you?”
translation:
  language: hi
  text: परन्तु रबशाके ने कहा, “क्या मेरे स्वामी ने मुझे ये बातें कहने के लिए तुम्हारे स्वामी और तुम्हारे पास भेजा है? क्या उसने मुझे शहर की दीवार पर बैठे उन आदमियों के पास नहीं भेजा, जिन्हें तुम्हारे साथ अपना ही मल खाना और अपना ही मूत्र पीना पड़ेगा?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में यहाँ घेराबंदी से जुड़ी जानबूझकर भद्दी भाषा है; शाब्दिक अर्थ है, “अपना मल खाना और अपना मूत्र पीना।” “मूत्र” के लिए लिखा हुआ रूप अधिक अशिष्ट अभिव्यक्ति के स्थान पर प्रयुक्त लिपिकीय शिष्टोक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: रबशाके
  rationale: अश्शूरी पदवी का प्रचलित ऐतिहासिक लिप्यंतरण रखा गया है; पद का अनुमानित अनुवाद करने से पहचान धुंधली हो सकती थी।
- source_word: אֲדֹנֶיךָ / אֲדֹנִי
  choice: तुम्हारे स्वामी / मेरे स्वामी
  rationale: दोनों पद राजनीतिक अधीनता के संबंध को बताते हैं—पहला हिजकिय्याह और दूसरा अश्शूर के राजा के लिए—इसलिए ईश्वरीय अर्थ-संकेत से बचते हुए ‘स्वामी’ चुना गया।
- source_word: לְדַבֵּר אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ये बातें कहने के लिए
  rationale: हिन्दी में स्वाभाविक रहते हुए दूत के संदेश बोलने का अर्थ व्यक्त करता है।
- source_word: הָאֲנָשִׁים הַיֹּשְׁבִים עַל הַחוֹמָה
  choice: शहरपनाह पर बैठे उन पुरुषों
  rationale: ‘पुरुषों’ से मूल का पुल्लिंग बहुवचन सुरक्षित है और ‘शहरपनाह’ घिरे हुए नगर की रक्षात्मक दीवार को स्पष्ट करता है।
- source_word: לֶאֱכֹל ... וְלִשְׁתּוֹת
  choice: जिन्हें ... खाना और ... पीना पड़ेगा
  rationale: हिब्रू infinitives घेराबंदी के उस भयावह परिणाम को लक्ष्य बनाकर कहे गए हैं; हिन्दी में ‘पड़ेगा’ इस प्रसंगगत विवशता को स्वाभाविक रूप से व्यक्त करता है, बिना ‘अभिशप्त’ जैसी अतिरिक्त धारणा जोड़े।
- source_word: חראיהם
  choice: अपना ही मल
  rationale: मूल की जानबूझकर अशिष्ट और अपमानजनक भाषा को साफ, समझने योग्य आधुनिक हिन्दी में सुरक्षित रखा गया है।
- source_word: שיניהם
  choice: अपना ही मूत्र
  rationale: लिखित रूप एक लिपिकीय शिष्टोक्ति है जो अधिक भद्दे शब्द का स्थान लेती है; ‘मूत्र’ अर्थ को स्पष्ट रखता है और पाठ-समस्या पादटिप्पणी में बताई गई है।
- source_word: עִמָּכֶם
  choice: तुम्हारे साथ
  rationale: द्वितीय पुरुष बहुवचन का सहचर्य-सूचक अर्थ सीधे व्यक्त किया गया है।
