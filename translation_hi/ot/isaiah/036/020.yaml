language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ֗י בְּ/כָל אֱלֹהֵ֤י הָֽ/אֲרָצוֹת֙ הָ/אֵ֔לֶּה אֲשֶׁר הִצִּ֥ילוּ אֶת אַרְצָ֖/ם מִ/יָּדִ֑/י כִּֽי יַצִּ֧יל יְהוָ֛ה אֶת יְרוּשָׁלִַ֖ם מִ/יָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/020.yaml
  text: Who among all the gods of these lands has delivered their land from my hand, that Yahweh should deliver Jerusalem from my hand?
translation:
  language: hi
  text: इन देशों के सब देवताओं में से किसने अपने देश को मेरे हाथ से छुड़ाया है, कि याहवे यरूशलेम को मेरे हाथ से छुड़ा लेगा?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הָאֲרָצוֹת הָאֵלֶּה
  choice: इन देशों के सब देवताओं में से किसने
  rationale: ‘में से किसने’ प्रश्नवाचक चुनौती को स्वाभाविक हिन्दी में व्यक्त करता है; ‘देश’ यहाँ विजित भू-राज्यों के लिए उपयुक्त है।
- source_word: הִצִּילוּ
  choice: छुड़ाया है
  rationale: נצל का अर्थ बचाना या किसी के अधिकार से छुड़ाना है; सैनिक-राजनीतिक प्रसंग में ‘छुड़ाया’ और ‘मेरे हाथ से’ का मेल सटीक है।
- source_word: אַרְצָם
  choice: अपने देश को
  rationale: इब्रानी बहुवचन प्रत्यय देवताओं और उनसे जुड़े देशों की सामूहिक-वितरणात्मक ओर संकेत करता है; हिन्दी में ‘किसने अपने देश को’ प्रत्येक देवता के संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: מִיָּדִי
  choice: मेरे हाथ से
  rationale: शक्ति और नियंत्रण का ठोस इब्रानी रूपक हिन्दी में भी पारदर्शी है, इसलिए इसे बनाए रखा गया है।
- source_word: כִּי יַצִּיל
  choice: कि ... छुड़ा लेगा
  rationale: כִּי यहाँ उपहासपूर्ण अलंकारिक प्रश्न की अगली धारा प्रस्तुत करता है; अपूर्ण क्रिया को हिन्दी भविष्यकाल में देना घमंडी चुनौती का स्वाभाविक भाव रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: टेट्राग्राम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: יְרוּשָׁלִַם
  choice: यरूशलेम
  rationale: स्थान-नाम का मानक आधुनिक हिन्दी रूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है, इसलिए ‘प्रभु’ जैसी उपाधि नहीं रखी गई। हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ अधिक परिचित और सहज रूप है, यद्यपि ‘याहवे’ संभावित उच्चारण का निकटतर लिप्यंतरण माना जाता है।
- issue: अश्शूरी वक्ता के दावे का भाव
  choice: उपहासपूर्ण अलंकारिक प्रश्न के रूप में रखा गया
  alternative: साधारण भविष्यवाणी या तथ्य-वचन
  rationale: वक्ता यहोवा को अन्य देशों के देवताओं के समान मानकर यरूशलेम के छुटकारे की संभावना को चुनौती देता है; अनुवाद उसके दावे को उद्धृत करता है, उसका समर्थन नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। मूल की पुनरुक्ति ‘मेरे हाथ से’ और ‘छुड़ाना’ दोनों स्थानों पर जानबूझकर बनाए रखी गई है ताकि शेखी और अलंकारिक दबाव सुरक्षित रहें।
