base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/011.yaml
  text: Then Eliakim[a], Shebna, and Joah said to the Rabshakeh, “Please speak to your servants in Aramaic, for we understand it[b]. And do not speak to us in Judean in the hearing of the people who are on the wall.”
translation:
  language: hi
  text: तब एल्याकीम, शेब्ना और योआह ने रबशाके[b] से कहा, “कृपया अपने सेवकों से अरामी भाषा में बात कीजिए, क्योंकि हम उसे समझते हैं। दीवार पर मौजूद लोगों के सुनते हुए हमसे यहूदा की भाषा[a] में बात मत कीजिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इब्रानी भाषा।” इब्रानी शब्द יְהוּדִית अधिक विशेष रूप से यहूदा या यहूदा के लोगों की भाषा को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: “रबशाके” संभवतः किसी व्यक्ति का नाम नहीं, बल्कि एक अश्शूरी अधिकारी की पदवी थी।
    reason: cultural_note
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: रबशाके
  rationale: यह संभवतः अक्कादी मूल की अश्शूरी पदवी है। पद का निश्चित कार्य बताने के बजाय पारंपरिक रूप को लिप्यंतरित किया गया है और स्पष्टीकरण पादटिप्पणी में दिया गया है।
- source_word: דַּבֶּר נָא
  choice: कृपया ... बात कीजिए
  rationale: आज्ञार्थक क्रिया के साथ נָא विनम्र अनुरोध व्यक्त करता है; यह हिंदी में स्वाभाविक और सम्मानपूर्ण रूप है।
- source_word: עֲבָדֶיךָ
  choice: अपने सेवकों से
  rationale: राजनयिक विनम्रता में वक्ता स्वयं को सामने वाले के सेवक कहते हैं; ‘दासों’ से सामाजिक स्थिति आवश्यकता से अधिक कठोर हो जाती।
- source_word: אֲרָמִית
  choice: अरामी भाषा में
  rationale: यह अरामी भाषा का स्पष्ट और आधुनिक हिंदी रूप है।
- source_word: כִּי שֹׁמְעִים אֲנָחְנוּ
  choice: क्योंकि हम उसे समझते हैं
  rationale: भाषा के संदर्भ में שׁמע का आशय केवल सुनना नहीं, समझना है।
- source_word: יְהוּדִית
  choice: यहूदी भाषा
  rationale: शब्द विशेष रूप से यहूदा के लोगों की भाषा को सूचित करता है; ‘इब्रानी’ परिचित विकल्प है, पर अधिक तकनीकी और व्यापक हो सकता है।
- source_word: בְּאָזְנֵי
  choice: के सुनते हुए
  rationale: इब्रानी मुहावरा किसी की सुनवाई के भीतर बोलने को दर्शाता है; हिंदी रूप सुन सकने की बात को स्पष्ट रखता है।
- source_word: הָעָם אֲשֶׁר עַל הַחוֹמָה
  choice: दीवार पर मौजूद लोग
  rationale: הָעָם का सामान्य अर्थ ‘लोग’ है; उन्हें केवल सैनिक कहना मूल से अधिक विशिष्ट होता।
