source:
  edition: WLC
  text: וְ/כִי תֹאמַ֣ר אֵלַ֔/י אֶל יְהוָ֥ה אֱלֹהֵ֖י/נוּ בָּטָ֑חְנוּ הֲ/לוֹא ה֗וּא אֲשֶׁ֨ר הֵסִ֤יר חִזְקִיָּ֨הוּ֙ אֶת בָּמֹתָ֣י/ו וְ/אֶת מִזְבְּחֹתָ֔י/ו וַ/יֹּ֤אמֶר לִֽ/יהוּדָה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם לִ/פְנֵ֛י הַ/מִּזְבֵּ֥חַ הַ/זֶּ֖ה תִּֽשְׁתַּחֲוֽוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/007.yaml
  text: But if you say to me, ‘We trust in the LORD our God,’ is it not he whose high places and whose altars Hezekiah has removed, saying to Judah and to Jerusalem, ‘You shall bow down before this altar’?”
translation:
  language: hi
  text: पर यदि तुम मुझसे कहो, ‘हम यहोवा, अपने परमेश्वर, पर भरोसा रखते हैं,’ तो क्या वह वही नहीं है जिसके ऊँचे स्थानों और वेदियों को हिजकिय्याह ने हटा दिया, और यहूदा और यरूशलेम से कहा, ‘तुम इस वेदी के सामने दण्डवत् करोगे’?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित और स्पष्ट रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בָּמוֹתָיו
  choice: उसके ऊँचे स्थानों
  rationale: במה यहाँ उपासना के लिए बने ‘ऊँचे स्थान’ को दर्शाता है; रबशाके इन्हें यहोवा से सम्बद्ध मानकर हिजकिय्याह के सुधारों को गलत रूप में प्रस्तुत करता है।
- source_word: מִזְבְּחֹתָיו
  choice: उसकी वेदियों
  rationale: बहुवचन और सम्बन्धवाचक प्रत्यय को बनाए रखा गया है।
- source_word: תִּשְׁתַּחֲווּן
  choice: तुम ... दण्डवत् करना
  rationale: क्रिया उपासना में झुकने या दण्डवत् करने का अर्थ देती है; हिन्दी में धार्मिक सन्दर्भ के अनुकूल स्वाभाविक अभिव्यक्ति चुनी गई है।
theological_decisions:
- issue: हिजकिय्याह द्वारा ऊँचे स्थान हटाने का धार्मिक मूल्यांकन
  choice: वक्ता के प्रश्न को बिना व्याख्यात्मक सुधार के ज्यों का त्यों प्रस्तुत किया गया है।
  alternative: यह स्पष्ट जोड़ना कि वे ऊँचे स्थान अनुचित उपासना-स्थल थे और हिजकिय्याह का कार्य सही था।
  rationale: मूल पद रबशाके की भ्रामक दलील प्रस्तुत करता है, कथावाचक की स्वीकृति नहीं; अनुवाद को उसकी विडंबना और तनाव बनाए रखना चाहिए।
- issue: एक वेदी पर उपासना का आदेश
  choice: ‘इसी वेदी के सामने दण्डवत् करना’
  alternative: ‘केवल इसी वेदी पर उपासना करना’
  rationale: מִזְבֵּחַ ‘वेदी’ है और לִפְנֵי का शाब्दिक भाव ‘सामने’ है; ‘केवल’ आशय में निहित हो सकता है, पर मूल में प्रत्यक्ष नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वाक्य-विन्यास रखा गया है। प्रत्यक्ष कथनों के भीतर उद्धरण-चिह्न बनाए गए हैं और वक्ता की व्यंग्यात्मक चुनौती को स्पष्ट किंतु अव्याख्यायित रखा गया है।
