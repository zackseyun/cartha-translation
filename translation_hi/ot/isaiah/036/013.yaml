lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: रबशाके
  rationale: यह अश्शूरी पदवी है; नाम के समान प्रचलित लिप्यंतरण रखा गया है, ताकि अनिश्चित पदगत अर्थ को अनावश्यक रूप से न खोला जाए।
- source_word: יְהוּדִית
  choice: यहूदा की भाषा में
  rationale: संदर्भ में इसका अर्थ यहूदा के लोगों की भाषा, अर्थात् स्थानीय यहूदी बोली है; यह सहज हिंदी में स्थानांतरित किया गया है।
- source_word: בְקוֹל גָּדוֹל
  choice: ऊँचे स्वर से
  rationale: इब्रानी मुहावरे का स्वाभाविक और अर्थनिष्ठ हिंदी रूप।
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: महान राजा
  rationale: उपाधिसूचक बल और अश्शूरी राजा के आत्म-महिमामंडन को सीधे सुरक्षित रखता है।
