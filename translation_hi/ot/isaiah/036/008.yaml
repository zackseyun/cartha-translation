  text: וְ/עַתָּה֙ הִתְעָ֣רֶב נָ֔א אֶת אֲדֹנִ֖/י הַ/מֶּ֣לֶךְ אַשּׁ֑וּר וְ/אֶתְּנָ֤ה לְ/ךָ֙ אַלְפַּ֣יִם סוּסִ֔ים אִם תּוּכַ֕ל לָ֥/תֶת לְ/ךָ֖ רֹכְבִ֥ים עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/008.yaml
  text: Now then[a], please make a wager with my master, the king of Assyria, and I will give you two thousand horses, if you are able to provide riders for them.
translation:
  language: hi
  text: अब तो कृपया मेरे स्वामी, अश्शूर के राजा, के साथ शर्त लगाओ[a]। मैं तुम्हें दो हज़ार घोड़े दूँगा—यदि तुम उनके लिए सवार जुटा सको।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘प्रतिज्ञा कर’ अथवा ‘समझौता कर।’ इब्रानी क्रिया प्रतिज्ञा, लेन-देन या दाँव में उतरने का भाव दे सकती है; यहाँ प्रसंग में व्यंग्यपूर्ण शर्त या चुनौती का अर्थ अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעָרֶב
  choice: शर्त लगा
  rationale: हित्पएल रूप, אֶת के साथ, यहाँ अश्शूरी दूत की व्यंग्यपूर्ण चुनौती को व्यक्त करता है। ‘शर्त लगा’ आधुनिक हिन्दी में दाँव या चुनौती का स्वाभाविक भाव देता है, जबकि पाठ में निहित प्रतिज्ञा अथवा समझौते की सम्भावना को पादटिप्पणी में रखा गया है।
- source_word: נָא
  choice: कृपया
  rationale: यह आग्रहसूचक विनम्र अव्यय है। ‘कृपया’ आदेश की ऊपरी विनम्रता और उसके भीतर छिपे व्यंग्य, दोनों को बनाए रखता है।
- source_word: אֶת אֲדֹנִי הַמֶּלֶךְ אַשּׁוּר
  choice: मेरे स्वामी, अश्शूर के राजा, से
  rationale: אֲדֹנִי यहाँ वक्ता के मानवीय अधिपति को सूचित करता है; इसलिए ‘मेरे स्वामी’ उपयुक्त है। हिन्दी में शर्त लगाने वाले दूसरे पक्ष को ‘से’ द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: וְאֶתְּנָה לְךָ
  choice: मैं तुझे ... दूँगा
  rationale: यह चुनौती के बाद दिया गया प्रथम-पुरुष प्रस्ताव है। ‘दूँगा’ प्रत्यक्ष और स्वाभाविक भविष्यकालीन आश्वासन देता है।
- source_word: אַלְפַּיִם סוּסִים
  choice: दो हज़ार घोड़े
  rationale: मूल संख्या और संज्ञा का सीधा, स्पष्ट अनुवाद।
- source_word: אִם תּוּכַל
  choice: यदि तू ... सके
  rationale: शर्त और सामर्थ्य दोनों को व्यक्त करता है। एकवचन सम्बोधन और तिरस्कारपूर्ण चुनौती को बनाए रखने के लिए ‘तू’ रखा गया है।
- source_word: לָתֵת לְךָ רֹכְבִים עֲלֵיהֶם
  choice: उनके लिए सवार जुटा सके
  rationale: भाव केवल लोगों को घोड़ों पर बैठाने का नहीं, बल्कि पर्याप्त सवार उपलब्ध कराने का है। ‘जुटा सके’ सैन्य संसाधनों की कमी पर किए गए उपहास को स्वाभाविक हिन्दी में स्पष्ट करता है।
