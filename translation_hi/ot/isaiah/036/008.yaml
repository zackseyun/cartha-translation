translation_notes:
  register: भाषा आधुनिक, dignified और मौखिक चुनौती के अनुरूप रखी गई है। ‘कृपया’ अश्शूरी दूत की बनावटी विनम्रता को और ‘तू’ एकवचन, तिरस्कारपूर्ण सम्बोधन को व्यक्त करता है। विराम-चिह्न शर्त के बाद आने वाले उपहासपूर्ण प्रस्ताव को उभारते हैं।
