id: ISA.36.18
reference: Isaiah 36:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: פֶּן יַסִּ֨ית אֶתְ/כֶ֤ם חִזְקִיָּ֨הוּ֙ לֵ/אמֹ֔ר יְהוָ֖ה יַצִּילֵ֑/נוּ הַ/הִצִּ֜ילוּ אֱלֹהֵ֤י הַ/גּוֹיִם֙ אִ֣ישׁ אֶת אַרְצ֔/וֹ מִ/יַּ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/018.yaml
  text: Do not let Hezekiah mislead you[a], saying, ‘Yahweh will deliver us.’ Have any of the gods of the nations, each one[b], delivered his land from the hand of the king of Assyria?
translation:
  language: hi
  text: कहीं हिजकिय्याह तुम्हें यह कहकर बहका न दे[a], ‘याहवे हमें छुड़ाएगा।’ क्या जातियों के देवताओं में से किसी एक ने भी[b] अपने देश को अश्शूर के राजा के हाथ से छुड़ाया है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक भाव: “कहीं हिजकिय्याह तुम्हें उकसाए/बहकाए, यह कहते हुए।”'
    reason: lexical_alternative
  - marker: b
    text: 'या: “क्या जातियों के देवताओं ने—उनमें से किसी ने भी—अपने देश को अश्शूर के राजा के हाथ से छुड़ाया है?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: कहीं ... न
  rationale: चेतावनी और नकारात्मक आशंका व्यक्त करने वाले इब्रानी प्रयोग का स्वाभाविक हिन्दी रूप।
- source_word: יַסִּית
  choice: बहका न दे
  rationale: सות के हिफ़ील रूप में उकसाने, फुसलाने या गलत दिशा में ले जाने का भाव है; प्रसंग में ‘बहकाना’ स्वाभाविक है और ‘धोखा देना’ से कम निर्णायक है।
- source_word: חִזְקִיָּהוּ
  choice: हिजकिय्याह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: יַצִּילֵנוּ
  choice: हमें छुड़ाएगा
  rationale: नצל का हिफ़ील रूप सैन्य संकट से बचाने या छुड़ाने को दर्शाता है।
- source_word: הַהִצִּילוּ
  choice: क्या ... छुड़ाया है?
  rationale: प्रश्नवाचक कण और पूर्ण क्रिया मिलकर अपेक्षित नकारात्मक उत्तर वाला आलंकारिक प्रश्न बनाते हैं।
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: जातियों के देवताओं
  rationale: रचना को सीधे रखते हुए גּוֹיִם के जातीय-राजनीतिक अर्थ को ‘जातियाँ’ से व्यक्त किया गया है।
- source_word: אִישׁ
  choice: किसी एक ने भी
  rationale: यहाँ אִישׁ वितरणात्मक अर्थ में है; ‘किसी एक ने भी’ आलंकारिक प्रश्न में उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַרְצוֹ
  choice: अपने देश को
  rationale: एकवचन प्रत्यय वितरणात्मक ‘किसी एक’ से जुड़ा है; ‘अपने देश’ हिन्दी में लिंग का अनावश्यक निर्धारण किए बिना मूल संबंध बनाए रखता है।
- source_word: מִיַּד מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा के हाथ से
  rationale: ‘हाथ से’ शक्ति या नियंत्रण का इब्रानी बिंब है और हिन्दी में भी समझने योग्य है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: पद में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: अन्य जातियों के देवताओं के विषय में रबशाके का दावा
  choice: वक्ता के आलंकारिक प्रश्न को उसी रूप में रखा गया
  alternative: दावे को धर्मवैज्ञानिक स्पष्टीकरण के साथ सीमित करना
  rationale: यह रबशाके की चुनौती है; अनुवाद उसके कथन को न तो अनुमोदित करता है, न पद के भीतर अतिरिक्त खंडन जोड़ता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘कहीं ... न’ चेतावनी का स्वाभाविक रूप है; ‘हाथ से’ मूल इब्रानी बिंब को सुरक्षित रखता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
