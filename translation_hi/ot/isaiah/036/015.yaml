reference: Isaiah 36:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַל יַבְטַ֨ח אֶתְ/כֶ֤ם חִזְקִיָּ֨הוּ֙ אֶל יְהוָ֣ה לֵ/אמֹ֔ר הַצֵּ֥ל יַצִּילֵ֖/נוּ יְהוָ֑ה לֹ֤א תִנָּתֵן֙ הָ/עִ֣יר הַ/זֹּ֔את בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/015.yaml
  text: And do not let Hezekiah make you trust in Yahweh[a], saying, ‘Yahweh will surely deliver us[b]; this city will not be given into the hand of the king of Assyria.’
translation:
  language: hi
  text: और हिजकिय्याह यह कहकर तुम्हें याहवे पर भरोसा न दिलाए, “याहवे निश्चय ही हमें बचाएगा[a]; यह नगर अश्शूर के राजा के हाथ में नहीं दिया जाएगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘बचाना’ क्रिया का बलवर्धक प्रयोग है—एक ही मूल के दो रूप साथ आए हैं; इसका अर्थ है, “निश्चय ही हमें बचाएगा।”
    reason: lexical_alternative
  - marker: b
    text: अथवा, “अश्शूर के राजा के अधिकार में नहीं सौंपा जाएगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל יַבְטַח אֶתְכֶם חִזְקִיָּהוּ
  choice: और हिजकिय्याह ... तुम्हें ... भरोसा न दिलाए
  rationale: 'हिफ़ईल रूप की कारणवाचक शक्ति को रखा गया है: हिजकिय्याह स्वयं केवल भरोसा नहीं करता, बल्कि लोगों को भरोसा दिलाता है। यह अनुवाद निषेध और वाक्य के प्रवाह दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।'
- source_word: אֶל יְהוָה
  choice: याहवे पर
  rationale: בטח के साथ हिन्दी में ‘पर भरोसा’ स्वाभाविक है। परमेश्वर के विशिष्ट नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: לֵאמֹר
  choice: यह कहकर
  rationale: यह रूप आगे आने वाले उद्धरण का परिचय देता है; ‘यह कहकर’ हिन्दी में उसके साधनात्मक भाव और वाक्य-संबंध को स्पष्ट करता है।
- source_word: הַצֵּל יַצִּילֵנוּ
  choice: निश्चय ही हमें बचाएगा
  rationale: सजातीय क्रिया के infinitive absolute और finite verb का संयोजन कथन पर विशेष बल देता है। ‘निश्चय ही’ उस बल को सहज हिन्दी में सुरक्षित रखता है। सैन्य संकट के संदर्भ में ‘बचाएगा’ स्पष्ट और स्वाभाविक है।
- source_word: לֹא תִנָּתֵן
  choice: नहीं दिया जाएगा
  rationale: निफ़अल का कर्मवाच्य रूप औपचारिक निकटता के साथ रखा गया है; इसका आशय शत्रु के अधिकार में सौंपे जाने से है।
- source_word: הָעִיר הַזֹּאת
  choice: यह नगर
  rationale: संज्ञा और संकेतवाचक के निश्चित रूप का स्वाभाविक हिन्दी प्रतिरूप है।
- source_word: בְּיַד מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा के हाथ में
  rationale: ‘हाथ में’ मूल इब्रानी बिंब को बनाए रखता है और अधिकार अथवा नियंत्रण में दिए जाने का अर्थ हिन्दी में भी समझ में आता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला विशिष्ट वाचा-नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: הַצֵּל יַצִּילֵנוּ में कथन का बल
  choice: निश्चय ही हमें बचाएगा
  alternative: हमें बचाएगा / अवश्य हमारा उद्धार करेगा
  rationale: मूल इब्रानी रचना दृढ़ आश्वासन व्यक्त करती है। ‘निश्चय ही’ उस बल को रखता है, जबकि कथन को उससे अधिक धर्मवैज्ञानिक अर्थ नहीं देता जितना सैन्य संकट का संदर्भ माँगता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। राजकीय-सैन्य प्रसंग के अनुरूप ‘नगर’, ‘राजा’ और ‘हाथ में दिया जाना’ जैसे शब्द चुने गए हैं। उद्धृत आश्वासन रबशाके द्वारा हिजकिय्याह के कथन के रूप में प्रस्तुत है; अनुवाद उसकी सत्यता या असत्यता पर अपनी ओर से कोई टिप्पणी नहीं जोड़ता।
