  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַיֵּ֞ה אֱלֹהֵ֤י חֲמָת֙ וְ/אַרְפָּ֔ד אַיֵּ֖ה אֱלֹהֵ֣י סְפַרְוָ֑יִם וְ/כִֽי הִצִּ֥ילוּ אֶת שֹׁמְר֖וֹן מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/019.yaml
  text: Where are the gods of Hamath and Arpad? Where are the gods of Sepharvaim? And have they delivered Samaria from my hand?[a]
translation:
  language: hi
  text: हमात और अर्पाद के देवता कहाँ हैं? सपर्वैम के देवता कहाँ हैं? क्या उन्होंने शोमरोन को मेरे हाथ से छुड़ाया[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘छुड़ाया’ के विकल्प: “बचाया” या “उद्धार किया।”'
    reason: ‘छुड़ाया’ के लिए मूल क्रिया के उपयुक्त शाब्दिक विकल्प।
lexical_decisions:
- source_word: אַיֵּה
  choice: कहाँ हैं
  rationale: यह स्थान पूछने वाला प्रश्नवाचक शब्द है; बहुवचन ‘देवता’ के साथ हिन्दी में स्वाभाविक रूप से ‘कहाँ हैं’ कहा गया है।
- source_word: אֱלֹהֵי
  choice: के देवता
  rationale: यह אֱלֹהִים का संबंधवाचक बहुवचन रूप है और इसके बाद स्थानों के नाम आते हैं।
- source_word: חֲמָת וְאַרְפָּד
  choice: हमात और अर्पाद
  rationale: स्थान-नामों का प्रचलित हिन्दी लिप्यंतरण रखा गया है और संयोजक को ‘और’ से व्यक्त किया गया है।
- source_word: סְפַרְוָיִם
  choice: सपर्वैम
  rationale: स्थान-नाम को मूल उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: וְכִי
  choice: क्या
  rationale: यहाँ यह उपहासपूर्ण चरम प्रश्न को आरम्भ करता है; हिन्दी में ‘क्या’ उस प्रश्नात्मक चुनौती को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִצִּילוּ
  choice: छुड़ाया
  rationale: נצל के हिफ़ील रूप का अर्थ बचाना, छुड़ाना या मुक्त कराना है; सैन्य प्रसंग में ‘छुड़ाया’ उपयुक्त है।
- source_word: אֶת שֹׁמְרוֹן
  choice: शोमरोन को
  rationale: प्रत्यक्ष कर्म चिह्न אֶת का अलग अनुवाद नहीं किया गया; नगर का नाम मूल के निकट लिप्यंतरित है।
- source_word: מִיָּדִי
  choice: मेरे हाथ से
  rationale: मूल की ‘हाथ’ वाली शक्ति और नियंत्रण की सजीव उपमा हिन्दी में स्पष्ट है, इसलिए उसे बनाए रखा गया है।
theological_decisions:
- issue: रबशाके के कथन में ‘मेरे हाथ’ का संदर्भ
  choice: प्रथम पुरुष के दंभपूर्ण कथन को बिना व्याख्यात्मक योग के बनाए रखना
  alternative: इसे स्पष्ट करके ‘अश्शूर के राजा के हाथ से’ या भावानुवाद करके ‘मेरी शक्ति से’ कहना
  rationale: इब्रानी पाठ वक्ता का प्रथम पुरुष कथन प्रस्तुत करता है। अनुवाद उसी अलंकार और तनाव को सुरक्षित रखता है तथा मुख्य पाठ में संदर्भ की व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। दोहराए गए प्रश्नों और अंतिम उपहासपूर्ण चुनौती की वक्तृता सुरक्षित रखी गई है; ‘मेरे हाथ से’ की मूल उपमा भी ज्यों की त्यों रखी गई है।
