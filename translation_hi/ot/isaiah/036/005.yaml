source:
  edition: WLC
  text: אָמַ֨רְתִּי֙ אַךְ דְּבַר שְׂפָתַ֔יִם עֵצָ֥ה וּ/גְבוּרָ֖ה לַ/מִּלְחָמָ֑ה עַתָּה֙ עַל מִ֣י בָטַ֔חְתָּ כִּ֥י מָרַ֖דְתָּ בִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/005.yaml
  text: You say—but they are only words of the lips—‘There is counsel and strength for war.’ Now in whom have you trusted, that you have rebelled against me?
translation:
  language: hi
  text: मैंने कहा, ‘युद्ध के लिए सलाह और सामर्थ्य तो केवल होंठों की बातें हैं।’ अब तुमने किस पर भरोसा किया है कि तुमने मेरे विरुद्ध विद्रोह किया है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: मैं कहता हूँ
  rationale: WLC के प्रथम पुरुष एकवचन रूप को सीधे रखा गया है। प्रसंग में यह रबशाके का आकलन प्रस्तुत करता है; समानांतर पाठ और कुछ अनुवादों के ‘तुम कहते हो’ को पाद-टिप्पणी में बताया गया है।
- source_word: דְּבַר שְׂפָתַיִם
  choice: मुँह की बातें
  rationale: शाब्दिक अर्थ ‘होंठों की बात’ है; आधुनिक हिन्दी में ‘मुँह की बातें’ खोखली या केवल कही गई बातों का स्वाभाविक बोध कराता है।
- source_word: עֵצָה וּגְבוּרָה
  choice: नीति और सामर्थ्य
  rationale: עֵצָה यहाँ युद्ध-योजना/रणनीतिक समझ और גְבוּרָה युद्ध करने की शक्ति को सूचित करता है; संक्षिप्त युग्म मूल की शैली बनाए रखता है।
- source_word: בָטַחְתָּ
  choice: भरोसा किया है
  rationale: पूर्ण क्रिया को वर्तमान स्थिति से जुड़े हुए भरोसे के रूप में व्यक्त किया गया है।
- source_word: מָרַדְתָּ
  choice: विद्रोह कर बैठे
  rationale: राजनीतिक अधीनता तोड़ने के अर्थ को स्पष्ट करता है और प्रश्न में निहित परिणामात्मक भाव को स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: אָמַרְתִּי में वक्ता और पाठांतर
  choice: मुख्य पाठ में ‘मैं कहता हूँ’
  alternative: ‘तुम कहते हो’
  rationale: प्रदत्त WLC में אָמַרְתִּי स्पष्टतः ‘मैंने कहा/मैं कहता हूँ’ है। 2 राजा 18:20 के समानांतर पाठ और प्राचीन अनुवाद-परंपरा के आधार पर ‘तुम कहते हो’ संभव है, पर उसे मूल पाठ में चुपचाप प्रतिस्थापित नहीं किया गया।
- issue: עֵצָה וּגְבוּרָה का कथन किसका है
  choice: उद्धृत दावे के रूप में खुला रखा गया
  alternative: ‘मेरे पास युद्ध की नीति और सामर्थ्य है’
  rationale: इब्रानी में ‘मेरे पास’ नहीं है; उसे जोड़ने से वक्ता और आशय आवश्यकता से अधिक निश्चित हो जाते।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘तुम’ राजनयिक संबोधन में स्वाभाविक है; ‘मुँह की बातें’ सामान्य पाठक के लिए सहज है। विराम-चिह्न मूल वाक्य की कठिन संरचना को पठनीय बनाते हैं, बिना ‘मेरे पास’ जैसे अनुल्लिखित शब्द जोड़े।
