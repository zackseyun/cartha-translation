  text: וַֽ/יַּחֲרִ֔ישׁוּ וְ/לֹֽא עָנ֥וּ אֹת֖/וֹ דָּבָ֑ר כִּֽי מִצְוַ֨ת הַ/מֶּ֥לֶךְ הִ֛יא לֵ/אמֹ֖ר לֹ֥א תַעֲנֻֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/021.yaml
  text: But they kept silent and did not answer him a word[a], for the king’s command was, saying, “Do not answer him.”
translation:
  language: hi
  text: परन्तु वे चुप रहे और उसे एक शब्द भी उत्तर न दिया, क्योंकि राजा की आज्ञा थी, “उसे उत्तर मत देना।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּחֲרִישׁוּ
  choice: वे चुप रहे
  rationale: क्रिया חרשׁ यहाँ जान-बूझकर मौन रहने का भाव देती है; ‘चुप रहे’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: וְלֹא עָנוּ אֹתוֹ דָּבָר
  choice: और उसे एक शब्द भी उत्तर न दिया
  rationale: मूल इब्रानी की अभिव्यक्ति और उसके जोर को बनाए रखते हुए यह स्पष्ट करता है कि उन्होंने कोई उत्तर नहीं दिया।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उनके मौन रहने का कारण प्रस्तुत करता है।
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: राजा की आज्ञा
  rationale: מִצְוָה यहाँ अधिकारपूर्वक दिए गए आदेश को दर्शाता है; ‘आज्ञा’ गरिमापूर्ण और सहज हिन्दी है।
- source_word: הִיא לֵאמֹר
  choice: थी
  rationale: हिन्दी में उद्धरण के साथ ‘राजा की आज्ञा थी’ मूल निर्माण का अर्थ स्वाभाविक ढंग से देता है; अलग से ‘यह कहते हुए’ जोड़ना अनावश्यक और कृत्रिम होता।
- source_word: לֹא תַעֲנֻהוּ
  choice: उसे उत्तर मत देना
  rationale: यह समूह को दिया गया निषेधात्मक निर्देश है; हिन्दी में ‘मत देना’ उद्धृत आज्ञा को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions: []
