  text: עַד בֹּאִ֕/י וְ/לָקַחְתִּ֥י אֶתְ/כֶ֖ם אֶל אֶ֣רֶץ כְּ/אַרְצְ/כֶ֑ם אֶ֤רֶץ דָּגָן֙ וְ/תִיר֔וֹשׁ אֶ֥רֶץ לֶ֖חֶם וּ/כְרָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/017.yaml
  text: until I come and take you away to a land like your own land—a land of grain and new wine[b][a], a land of bread and vineyards.
translation:
  language: hi
  text: जब तक कि मैं आकर तुम्हें तुम्हारे अपने देश के समान एक देश में ले जाऊँ[a]—अन्न और नए दाखरस[b] का देश, रोटी और दाख की बारियों का देश।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हें तुम्हारे अपने देश के समान एक देश में ले लूँ।” इब्रानी क्रिया का सामान्य अर्थ “लेना” है; प्रसंग में “ले जाऊँ” स्थानांतरण या निर्वासन का भाव स्पष्ट करता है।
    reason: lexical_alternative
  - marker: b
    text: “नया दाखरस” इब्रानी תירוש का अनुवाद है; यह शब्द प्रायः दाखरस के अधिक सामान्य शब्द से अलग समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד בֹּאִי
  choice: जब तक कि मैं आकर
  rationale: עַד समय की सीमा बताता है और בֹּאִי प्रथम पुरुष एकवचन में ‘मेरे आने’ का भाव देता है; संयुक्त हिन्दी वाक्य में ‘जब तक कि मैं आकर’ स्वाभाविक है।
- source_word: וְלָקַחְתִּי אֶתְכֶם
  choice: तुम्हें ... न ले जाऊँ
  rationale: לקח का मूल अर्थ ‘लेना’ है; गंतव्य के साथ हिन्दी में ‘ले जाना’ स्वाभाविक है और निर्वासन का प्रसंग प्रकट करता है, पर ‘बंदी बनाकर’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: אֶל אֶרֶץ כְּאַרְצְכֶם
  choice: तुम्हारे अपने देश जैसे एक देश में
  rationale: כְ तुलना दर्शाता है, पहचान नहीं। ‘अपने’ आश्वासनकारी प्रचारात्मक लहजे को स्वाभाविक हिन्दी में उभारता है।
- source_word: דָּגָן
  choice: अन्न
  rationale: यह सामान्य रूप से अनाज अथवा धान्य-उपज को सूचित करता है; ‘अन्न’ आधुनिक हिन्दी में व्यापक और गरिमापूर्ण विकल्प है।
- source_word: תִירוֹשׁ
  choice: नई दाखमधु
  rationale: תירוש को सामान्य יין से अलग रखते हुए ताज़ी अथवा नई दाखमधु का संकेत सुरक्षित किया गया है।
- source_word: לֶחֶם
  choice: रोटी
  rationale: शाब्दिक कृषि-समृद्धि की छवि बनाए रखने के लिए इसे सामान्य ‘भोजन’ नहीं किया गया।
- source_word: כְרָמִים
  choice: दाख की बारियाँ
  rationale: बहुवचन ‘दाख की बारियाँ’ अंगूर उगाने के स्थानों और कृषि-समृद्धि की छवि को स्पष्ट तथा सहज हिन्दी में रखता है।
