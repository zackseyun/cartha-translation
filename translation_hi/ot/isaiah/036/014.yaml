base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/014.yaml
  text: 'Thus says the king: Do not let Hezekiah deceive you[b][a], for he will not be able to deliver you.'
translation:
  language: hi
  text: 'राजा यों कहता है: हिजकिय्याह को तुम्हें धोखा देने मत दो[a], क्योंकि वह तुम्हें छुड़ा नहीं सकेगा[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तुम्हें भटकाने।’ इब्रानी क्रिया का अर्थ धोखा देना या भटका देना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘बचा नहीं सकेगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: राजा यह कहता है
  rationale: यह राजकीय संदेश की औपचारिक उद्घोषणा है। हिन्दी में यह विन्यास स्वाभाविक और गरिमापूर्ण है तथा मूल के ‘राजा’ को बिना नाम जोड़े बनाए रखता है।
- source_word: אַל יַשִּׁא לָכֶם חִזְקִיָּהוּ
  choice: हिजकिय्याह को अपने आप को धोखा न देने दो
  rationale: निषेधात्मक रूप और संबोधित बहुवचन को स्पष्ट रखा गया है। נשׁא यहाँ धोखा देने अथवा भटका देने का भाव व्यक्त करता है।
- source_word: כִּי לֹא יוּכַל
  choice: क्योंकि वह ... नहीं सकेगा
  rationale: כִּי कारण बताता है और יכל असमर्थता; भविष्याभिमुख संदर्भ में ‘नहीं सकेगा’ उपयुक्त है।
- source_word: לְהַצִּיל אֶתְכֶם
  choice: तुम्हें छुड़ा
  rationale: הציל संकट या शत्रु के हाथ से बचाने अथवा छुड़ाने के लिए प्रयुक्त है; सैन्य घेराबंदी के संदर्भ में ‘छुड़ाना’ स्वाभाविक है।
theological_decisions:
- issue: ‘राजा’ का संदर्भ
  choice: मूल पाठ के अनुसार केवल ‘राजा’ रखा गया है; प्रसंग इसे अश्शूर के राजा से जोड़ता है।
  alternative: ‘सन्हेरीब’ अथवा ‘महान राजा’ जोड़ना।
  rationale: इस पद के इब्रानी पाठ में केवल הַמֶּלֶךְ है। नाम या उपाधि जोड़ने से ऐसी सूचना आ जाती जो इस पद में स्पष्टतः नहीं है।
- issue: הציל का अर्थ
  choice: छुड़ाना
  alternative: बचाना
  rationale: दोनों अर्थ संभव हैं। ‘छुड़ाना’ यहाँ घेराबंदी और शत्रु के खतरे से मुक्ति के सैन्य संदर्भ को अच्छी तरह व्यक्त करता है, जबकि पादटिप्पणी वैकल्पिक अर्थ सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन है। शैली औपचारिक राजकीय घोषणा के अनुरूप, पर सामान्य पाठक के लिए सहज रखी गई है।
