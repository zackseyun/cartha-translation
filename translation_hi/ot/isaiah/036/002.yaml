  text: וַ/יִּשְׁלַ֣ח מֶֽלֶךְ אַשּׁ֣וּר אֶת רַב שָׁקֵ֨ה מִ/לָּכִ֧ישׁ יְרוּשָׁלְַ֛מָ/ה אֶל הַ/מֶּ֥לֶךְ חִזְקִיָּ֖הוּ בְּ/חֵ֣יל כָּבֵ֑ד וַֽ/יַּעֲמֹ֗ד בִּ/תְעָלַת֙ הַ/בְּרֵכָ֣ה הָ/עֶלְיוֹנָ֔ה בִּ/מְסִלַּ֖ת שְׂדֵ֥ה כוֹבֵֽס־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/002.yaml
  text: Then the king of Assyria sent the Rabshakeh from Lachish to Jerusalem, to King Hezekiah, with a heavy force. And he stood by the conduit of the upper pool, on the highway to the launderer’s field.
translation:
  language: hi
  text: तब अश्शूर के राजा ने रबशाके[a] को भारी सैन्य बल के साथ लाकीश से यरूशलेम में राजा हिजकिय्याह के पास भेजा। वह ऊपरी जलाशय की नहर के पास, धोबी के खेत के रास्ते पर आ खड़ा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “रबशाके” अश्शूर के एक उच्च अधिकारी की उपाधि थी; इसका शाब्दिक अर्थ संभवतः “मुख्य साकी” है।
    reason: उपाधि का लिप्यंतरण रखा गया है; टिप्पणी उसके ऐतिहासिक स्वरूप और संभावित शाब्दिक अर्थ को स्पष्ट करती है, बिना किसी अनिश्चित सैन्य पदनाम को आरोपित किए।
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: रबशाके
  rationale: यह अश्शूरी अधिकारी की उपाधि है। इसे किसी अनुमानित सैन्य पदनाम में बदलने के बजाय लिप्यंतरित किया गया है, और अर्थ-संबंधी जानकारी पाद-टिप्पणी में दी गई है।
- source_word: בְּחֵיל כָּבֵד
  choice: एक विशाल सैन्य बल के साथ
  rationale: חַיִל यहाँ संगठित सैन्य बल को और כָּבֵד उसके बड़े या प्रभावशाली आकार को व्यक्त करता है। यह हिन्दी में स्वाभाविक रहते हुए मूल अर्थ को सुरक्षित रखता है।
- source_word: בִּתְעָלַת הַבְּרֵכָה הָעֶלְיוֹנָה
  choice: ऊपरी जलाशय की नहर के पास
  rationale: תְּעָלָה जल ले जाने वाली नहर या जलमार्ग है और בְּרֵכָה जलाशय है; स्थानसूचक בְּ को प्रसंगानुसार ‘के पास’ कहा गया है।
- source_word: בִּמְסִלַּת שְׂדֵה כוֹבֵס
  choice: धोबी के खेत की सड़क पर
  rationale: מְסִלָּה निर्मित सड़क या मार्ग को दर्शाता है और כוֹבֵס कपड़े धोने या साफ करने वाले कारीगर को; ‘धोबी’ सामान्य आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण ऐतिहासिक गद्य रखा गया है। नामों के प्रचलित हिन्दी बाइबलीय रूप—अश्शूर, लाकीश, यरूशलेम और हिजकिय्याह—अपनाए गए हैं।
