source:
  edition: WLC
  text: וַ/יְהִ֡י בְּ/אַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה לַ/מֶּ֣לֶךְ חִזְקִיָּ֗הוּ עָלָ֞ה סַנְחֵרִ֤יב מֶֽלֶךְ אַשּׁוּר֙ עַ֣ל כָּל עָרֵ֧י יְהוּדָ֛ה הַ/בְּצֻר֖וֹת וַֽ/יִּתְפְּשֵֽׂ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/001.yaml
  text: In the fourteenth year of King Hezekiah, Sennacherib king of Assyria came up against all the fortified cities of Judah and captured them.
translation:
  language: hi
  text: राजा हिजकिय्याह के शासन के चौदहवें वर्ष में अश्शूर के राजा सन्हेरीब ने यहूदा के सभी किलेबंद नगरों पर चढ़ाई की और उन पर कब्ज़ा कर लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: '[अलग शब्द के रूप में व्यक्त नहीं]'
  rationale: यह रूप नए कथात्मक प्रसंग का आरंभ कराता है। आधुनिक हिन्दी में वाक्य को सीधे काल-सूचक पदबंध से शुरू करना स्वाभाविक है; ‘और ऐसा हुआ’ जोड़ना अनावश्यक और कुछ पुरातन लगता।
- source_word: בְּאַרְבַּע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ חִזְקִיָּהוּ
  choice: राजा हिजकिय्याह के शासन के चौदहवें वर्ष में
  rationale: यह राजकीय शासन-वर्ष बताने वाला सूत्र है। ‘के शासन के’ से हिन्दी पाठक के लिए स्पष्ट होता है कि राजा की आयु नहीं, उसके शासन का चौदहवाँ वर्ष अभिप्रेत है।
- source_word: עָלָה ... עַל
  choice: पर चढ़ाई की
  rationale: सैन्य प्रसंग में यह पद hostile advance को व्यक्त करता है। ‘चढ़ाई की’ दिशा और आक्रमण, दोनों भाव स्वाभाविक हिन्दी में देता है।
- source_word: סַנְחֵרִיב
  choice: सन्हेरीब
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा
  rationale: समास-संबंध सन्हेरीब के पद और राज्य को बताता है; हिन्दी में संबंधकारक संरचना स्वाभाविक है।
- source_word: עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: यहूदा के सभी किलेबंद नगरों
  rationale: הַבְּצֻרוֹת उन नगरों को सुरक्षा-निर्माणों से दृढ़ किए हुए बताता है। ‘किलेबंद’ आधुनिक हिन्दी में सटीक और सहज सैन्य शब्द है।
- source_word: וַיִּתְפְּשֵׂם
  choice: और उन्हें जीत लिया
  rationale: नगरों के सैन्य अधिग्रहण के प्रसंग में תפשׂ का अर्थ पकड़ना नहीं, विजय करके अधिकार में लेना है; ‘जीत लिया’ इसे संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, कथात्मक और गरिमापूर्ण शैली रखी गई है। पारंपरिक व्यक्तिनाम बनाए गए हैं, जबकि सैन्य शब्दावली साधारण पाठक के लिए सहज रखी गई है।
