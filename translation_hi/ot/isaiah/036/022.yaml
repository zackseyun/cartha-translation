base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/022.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, and Shebna the scribe, and Joah son of Asaph, the recorder, came to Hezekiah with their clothes torn and told him the words of the Rabshakeh.
translation:
  language: hi
  text: तब हिल्किय्याह का पुत्र एल्याकीम, जो राजघराने का प्रबंधक था, शेबना सचिव, और आसाप का पुत्र योआह, अभिलेखपाल, फटे हुए वस्त्र पहने हिजकिय्याह के पास आए और उन्होंने उसे रबशाके[a] की बातें बताईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: रबशाके एक अश्शूरी अधिकारी की पदवी थी। इसे प्रायः ‘मुख्य पिलाने वाला’ या राजदरबार के किसी अन्य उच्च अधिकारी की पदवी समझा जाता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: तब ... आए
  rationale: वय्यिक्तोल रूप कथा में अगली घटना को क्रम से आगे बढ़ाता है; ‘तब’ इस प्रगति को स्वाभाविक हिन्दी में व्यक्त करता है। संयुक्त कर्ता के कारण बहुवचन ‘आए’ रखा गया है।
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: राजमहल का प्रबंधक
  rationale: यह इब्रानी प्रशासनिक मुहावरा राजघराने अथवा राजमहल की व्यवस्था के प्रभारी उच्च अधिकारी को दर्शाता है। ‘राजमहल का प्रबंधक’ पद के कार्य को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: הַסּוֹפֵר
  choice: राजकीय सचिव
  rationale: סֹפֵר लेखक अथवा लिपिक के साथ राजदरबार के सचिव को भी सूचित कर सकता है। यहाँ अधिकारियों की सूची में ‘राजकीय सचिव’ संदर्भानुकूल है।
- source_word: הַמַּזְכִּיר
  choice: अभिलेखपाल
  rationale: यह राजकीय अभिलेख या स्मरण-विवरण रखने वाले अधिकारी की पदवी है; ‘अभिलेखपाल’ उसके प्रशासनिक कार्य को संक्षेप में व्यक्त करता है।
- source_word: קְרוּעֵי בְגָדִים
  choice: अपने वस्त्र फाड़े हुए
  rationale: यह उनके आगमन की दशा बताता है और शोक, संकट या व्यथा के सांस्कृतिक संकेत को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: וַיַּגִּידוּ לוֹ
  choice: उन्होंने उसे ... बताईं
  rationale: हिफ़ील रूप का अर्थ यहाँ बताना या सूचना देना है। ‘बताईं’ आगे आने वाली बहुवचन ‘बातें’ के साथ स्वाभाविक हिन्दी है।
- source_word: דִּבְרֵי
  choice: की बातें
  rationale: דָּבָר का बहुवचन यहाँ बोले गए वचनों को दर्शाता है। ‘बातें’ सहज हिन्दी में मूल की मौखिक सामग्री को बनाए रखता है।
- source_word: רַב שָׁקֵה
  choice: रबशाके
  rationale: यह अश्शूरी अधिकारी की पदवी है जो कथानक में स्थिर संबोधन की तरह प्रयुक्त होती है। संभावित किंतु अनिश्चित कार्यगत अनुवाद थोपने के बजाय ऐतिहासिक पदवी का लिप्यंतरण रखा गया है।
