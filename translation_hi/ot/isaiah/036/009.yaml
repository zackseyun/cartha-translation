source:
  edition: WLC
  text: וְ/אֵ֣יךְ תָּשִׁ֗יב אֵ֠ת פְּנֵ֨י פַחַ֥ת אַחַ֛ד עַבְדֵ֥י אֲדֹנִ֖/י הַ/קְטַנִּ֑ים וַ/תִּבְטַ֤ח לְ/ךָ֙ עַל מִצְרַ֔יִם לְ/רֶ֖כֶב וּ/לְ/פָרָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/009.yaml
  text: How then can you repulse a single captain of the least of my master's servants[b][a], when you trust in Egypt for chariots and horsemen?
translation:
  language: hi
  text: तो फिर तुम मेरे स्वामी के सबसे निम्न श्रेणी के सेवकों में से एक हाकिम[a] को भी कैसे पीछे हटा सकते हो[b], जबकि तुम रथों और घुड़सवारों के लिए मिस्र पर भरोसा करते हो?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “हाकिम” का अनुवाद “राज्यपाल” या “अधिकारी” भी हो सकता है; इब्रानी शब्द किसी अधीनस्थ शासक अथवा पदाधिकारी को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “एक हाकिम का मुँह फेर सकते हो”; यह किसी का सामना करके उसे रोकने या पीछे खदेड़ने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵיךְ
  choice: तो फिर…कैसे
  rationale: संयोजक वाव और आलंकारिक प्रश्न की तर्कगत प्रगति—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תָּשִׁיב אֵת פְּנֵי
  choice: पीछे हटा सकते हो
  rationale: शाब्दिक अर्थ ‘मुँह फेरना/लौटाना’ है, पर यहाँ सैन्य प्रसंग में किसी को रोकने या खदेड़ने का मुहावरेदार भाव है।
- source_word: פַחַת
  choice: हाकिम
  rationale: यह अधीनस्थ शासक, प्रांतीय अधिकारी या सैन्य पदाधिकारी के लिए प्रयुक्त व्यापक पद है; ‘हाकिम’ इस व्यापकता को बनाए रखता है।
- source_word: אַחַד
  choice: एक…भी
  rationale: व्यंग्य की तीव्रता स्पष्ट करता है कि यहूदा निम्न पद के एक अधिकारी तक को रोकने में असमर्थ है।
- source_word: עַבְדֵי אֲדֹנִי הַקְטַנִּים
  choice: मेरे स्वामी के छोटे से छोटे सेवकों में से
  rationale: ‘छोटे’ को शारीरिक आकार नहीं, निम्न पद के अर्थ में प्रस्तुत करता है और सम्बन्धसूचक रचना को स्वाभाविक हिन्दी देता है।
- source_word: וַתִּבְטַח לְךָ עַל מִצְרַיִם
  choice: जबकि तुम…मिस्र पर भरोसा रखते हो
  rationale: यहूदा की मिस्र पर निर्भरता को प्रश्न की पृष्ठभूमि के रूप में व्यक्त करता है; לְךָ को हिन्दी में अलग से व्यक्त करना अनावश्यक और अस्वाभाविक होगा।
- source_word: לְרֶכֶב וּלְפָרָשִׁים
  choice: रथों और घुड़सवारों के लिए
  rationale: मिस्र से अपेक्षित सैन्य सहायता के दोनों साधनों को सीधे और स्पष्ट रूप से दर्शाता है।
