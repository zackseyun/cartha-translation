  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘छोटे से छोटे’ पद की हीनता और ताने की तीव्रता को व्यक्त करता है; ‘हाकिम’ मूल पद की नागरिक और सैन्य दोनों सम्भावनाओं को खुला रखता है।
