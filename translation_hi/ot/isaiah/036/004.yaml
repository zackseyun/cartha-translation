base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/004.yaml
  text: 'Then the Rabshakeh said to them[a], “Please say to Hezekiah, ‘Thus says the great king[b], the king of Assyria: What is this confidence that you have trusted in?’”'
translation:
  language: hi
  text: 'तब रबशाके[a] ने उनसे कहा, “कृपया हिजकिय्याह से कहो, ‘महान राजा, अश्शूर का राजा, ऐसा कहता है: यह कैसा भरोसा है, जिस पर तुमने भरोसा किया है?[b]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “रबशाके” संभवतः अश्शूर के किसी उच्च अधिकारी की पदवी थी। इसका अर्थ “मुख्य पिलानेवाला” या कोई अन्य वरिष्ठ राजकीय अथवा सैनिक अधिकारी हो सकता है।
    reason: cultural_note
  - marker: b
    text: 'इब्रानी में “भरोसा” की संज्ञा और “भरोसा करना” की क्रिया एक ही मूल से हैं; यह पुनरावृत्ति प्रश्न पर बल देती है। भावार्थ: “तुम्हारा यह कैसा भरोसा है?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: रबशाके
  rationale: यह संभवतः अक्कादी मूल की एक अश्शूरी पदवी है, जिसका निश्चित कार्य विवादित है। पदवी का लिप्यंतरण ऐतिहासिक पहचान बनाए रखता है और किसी अनिश्चित पदनाम को थोपने से बचता है।
- source_word: אִמְרוּ נָא
  choice: कृपया ... कहो
  rationale: आज्ञार्थक क्रिया के साथ נָא निवेदन या विनम्र आग्रह का भाव देती है; आधुनिक हिन्दी में “कृपया ... कहो” इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: חִזְקִיָּהוּ
  choice: हिजकिय्याह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: כֹּה אָמַר
  choice: ऐसा कहता है
  rationale: दूत अथवा राजकीय घोषणा के सूत्र को सहज, गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: महान राजा
  rationale: अश्शूरी राजकीय उपाधि और उसके दर्पपूर्ण स्वर को सीधे बनाए रखता है।
- source_word: מֶלֶךְ אַשּׁוּר
  choice: अश्शूर का राजा
  rationale: इब्रानी संबंधवाचक रचना का स्वाभाविक हिन्दी रूप; “राजा” की पुनरावृत्ति मूल के पदवी-सदृश समानाधिकरण को बनाए रखती है।
- source_word: הַבִּטָּחוֹן הַזֶּה אֲשֶׁר בָּטָחְתָּ
  choice: यह कैसा भरोसा है, जिस पर तुमने भरोसा किया है?
  rationale: संज्ञा בִּטָּחוֹן और उसी मूल की क्रिया בָּטַח की जानबूझकर की गई पुनरावृत्ति को हिन्दी में भी रखा गया है, ताकि व्यंग्यपूर्ण आलंकारिक प्रश्न का बल न घटे।
