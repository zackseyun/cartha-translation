base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/003.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, came out to him, along with Shebna the scribe and Joah son of Asaph[d][c][b], the recorder.
translation:
  language: hi
  text: तब हिल्कियाह का पुत्र एल्याकीम, जो राजमहल का प्रबंधक था,[b] सचिव[c] शेबना और आसाप का पुत्र योआह, जो अभिलेखपाल[d] था, बाहर निकलकर उसके पास आए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाहर निकलकर उसके पास गए।”
    reason: lexical_alternative
  - marker: b
    text: “राजमहल का प्रबंधक” एक उच्च राजकीय अधिकारी था, जो महल के प्रशासन की देखरेख करता था।
    reason: cultural_note
  - marker: c
    text: या, “लेखक।”
    reason: lexical_alternative
  - marker: d
    text: या, “इतिहास-लेखक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: बाहर निकलकर आए
  rationale: יצא का मूल भाव ‘बाहर निकलना’ है। पूर्ववर्ती प्रसंग में अश्शूरी प्रतिनिधि के पास आने के दृष्टिकोण से ‘आए’ स्वाभाविक है; ‘गए’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है। यद्यपि इब्रानी क्रिया एकवचन है और पहले एल्याकीम आता है, उसके बाद जुड़े तीनों कर्ताओं के कारण स्वाभाविक हिन्दी में बहुवचन क्रिया प्रयुक्त हुई है।
- source_word: אֵלָיו
  choice: उसके पास
  rationale: אֶל और तृतीय पुरुष एकवचन प्रत्यय का सीधा अर्थ ‘उसके पास’ है; संदर्भ में यह पिछले पद के अश्शूरी प्रतिनिधि की ओर संकेत करता है।
- source_word: אֶלְיָקִים בֶּן חִלְקִיָּהוּ
  choice: हिल्कियाह का पुत्र एल्याकीम
  rationale: व्यक्तिनामों का देवनागरी लिप्यंतरण किया गया और इब्रानी पुत्र-संबंध को स्पष्ट, स्वाभाविक हिन्दी में रखा गया है।
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: जो राजमहल का प्रबंधक था
  rationale: शाब्दिक संरचना ‘जो घर के ऊपर था’ राजकीय पद का मुहावरा है—महल और उसके प्रशासन का प्रधान अधिकारी। ‘राजमहल का प्रबंधक’ आधुनिक पाठक को पद का आशय स्पष्ट करता है, जबकि पादटिप्पणी सांस्कृतिक अर्थ बताती है।
- source_word: הַסֹּפֵר
  choice: सचिव
  rationale: סֹפֵר का अर्थ लेखक/शास्त्री भी हो सकता है, पर राजकीय अधिकारियों की इस सूची में प्रशासनिक ‘सचिव’ अधिक स्वाभाविक है। वैकल्पिक ‘लेखक’ पादटिप्पणी में सुरक्षित है।
- source_word: וְיוֹאָח בֶּן אָסָף
  choice: और आसाप का पुत्र योआह
  rationale: व्यक्तिनामों का लिप्यंतरण और पुत्र-संबंध मूल के अनुरूप रखा गया है।
- source_word: הַמַּזְכִּיר
  choice: अभिलेखपाल
  rationale: यह राजकीय उपाधि अभिलेख रखने और आवश्यक बातें स्मरणार्थ प्रस्तुत करने वाले अधिकारी को सूचित करती है। ‘अभिलेखपाल’ संक्षिप्त और वर्तमान हिन्दी में बोधगम्य है; ‘इतिहास-लेखक’ वैकल्पिक अर्थ है।
