  text: הַ/כְּ/מַכַּ֥ת מַכֵּ֖/הוּ הִכָּ֑/הוּ אִם כְּ/הֶ֥רֶג הֲרֻגָ֖י/ו הֹרָֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/007.yaml
  text: Has he struck him as he struck the one who struck him? Or has he been killed as his slain were killed?[a][b]
translation:
  language: hi
  text: क्या उसने उसे वैसा ही मारा है जैसा उसे मारनेवाले ने उसे मारा था?[a] या क्या वह उसी तरह मार डाला गया है, जिस तरह उसके मारे हुए लोग मार डाले गए थे?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप के अधिक निकट: “क्या उसने उसे उसके मारनेवाले की मार के समान मारा है?” मूल की संक्षिप्त रचना में कर्ता और कर्म का संबंध पूरी तरह व्यक्त नहीं किया गया है।'
    reason: मूल की तुलनात्मक रचना और सर्वनाम-संदर्भ की संक्षिप्तता को दर्ज करना।
  - marker: b
    text: प्रसंग में आशय सम्भवतः यह है कि जिसे यहाँ संबोधित किया गया है, उसका नाश उसी प्रकार नहीं हुआ जैसे उसके द्वारा—या उसके शत्रु द्वारा—मारे गए लोगों का हुआ था। इब्रानी में सर्वनामों के संदर्भ संक्षिप्त और कुछ हद तक अप्रकट हैं।
    reason: सर्वनाम-संदर्भ और कर्तृत्व की वास्तविक अस्पष्टता को दर्ज करना।
lexical_decisions:
- source_word: הַכְּמַכַּת
  choice: क्या ... वैसी मार
  rationale: प्रश्नवाचक ה और तुलनात्मक כְּ दोनों को स्वाभाविक हिन्दी में बनाए रखता है और तुलना को समानता के प्रश्न के रूप में प्रस्तुत करता है।
- source_word: מַכֵּהוּ
  choice: उसे मारनेवाले
  rationale: נכה के हिफ़ील कृदन्त और तृतीय पुरुष एकवचन प्रत्यय का अर्थ उस व्यक्ति से है जो उसे मारता है; यह रूप कर्ता और कर्म दोनों को संक्षिप्त रूप में सुरक्षित रखता है।
- source_word: הִכָּהוּ
  choice: उसने उसे ... मारी
  rationale: पूर्ण क्रिया को हिन्दी के प्रसंगानुकूल भूतकाल में रखा गया है; मार शब्द की पुनरावृत्ति मूल के מַכַּת/הִכָּה संबंध को कुछ हद तक बनाए रखती है।
- source_word: אִם
  choice: या
  rationale: यह समानान्तर दूसरे प्रश्न अथवा विकल्प को प्रस्तुत करता है, इसलिए यहाँ शर्तसूचक ‘यदि’ के बजाय ‘या’ उपयुक्त है।
- source_word: כְּהֶרֶג
  choice: उसी तरह ... जिस तरह ... मारे गए
  rationale: वध/मार डालने की तुलना को हिन्दी में स्वाभाविक क्रियात्मक रचना से व्यक्त किया गया है।
- source_word: הֲרֻגָיו
  choice: उसके मारे हुए लोग
  rationale: यह संक्षिप्त प्रयोग मूल के स्वत्ववाचक प्रत्यय को बनाए रखता है और यह पूरी तरह स्पष्ट नहीं करता कि वे उसके द्वारा मारे गए थे या केवल उससे संबद्ध मृतक थे।
- source_word: הֹרָג
  choice: मारा गया
  rationale: मूल के कर्मवाच्य अर्थ को सीधी और वर्तमान हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अलंकारिक तुलना में सर्वनामों के संदर्भ
  choice: मुख्य पाठ में ‘उसने’, ‘उसे’ और ‘उसके’ जैसे सर्वनाम बनाए रखे गए हैं।
  alternative: मुख्य पाठ में कर्ता और कर्म को स्पष्ट रूप से ‘यहोवा’, ‘इस्राएल’ और ‘इस्राएल को मारनेवाला’ कहना।
  rationale: पद स्वयं इन संदर्भों को नाम से स्पष्ट नहीं करता। प्रसंग सम्भवतः यहोवा द्वारा याकूब/इस्राएल को अनुशासित करने और उसके शत्रुओं का न्याय करने के बीच भेद दिखाता है, पर अनुवाद में नाम जोड़ना मूल की संक्षिप्तता और तनाव को समय से पहले सुलझा देता।
- issue: הֲרֻגָיו में स्वत्व अथवा कर्तृत्व
  choice: ‘उसके मारे हुए लोग’ द्वारा संबंध को संक्षिप्त और कुछ हद तक खुला रखा गया है।
  alternative: ‘उसके द्वारा मारे गए लोग’, जो कर्तृत्व को स्पष्ट कर देता है।
  rationale: प्रत्यय स्वत्व या संबद्धता दर्शाता है और प्रसंग में कर्तृत्व सम्भावित है, किन्तु उसे मुख्य पाठ में अनिवार्य रूप से स्पष्ट करना मूल से अधिक निर्णायक होता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘मार मारी’ की नियंत्रित पुनरावृत्ति जानबूझकर रखी गई है ताकि मूल में संज्ञा और उसी धातु की क्रिया के शब्द-संबंध को दिखाया जा सके; दूसरे अर्ध में ‘मारा गया/मारे गए’ की समानान्तरता भी सुरक्षित है।
