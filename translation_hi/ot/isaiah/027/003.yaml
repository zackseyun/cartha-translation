base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/003.yaml
  text: I[a], Yahweh, am its keeper[b]; I water it continually. Lest anyone punish it, I guard it night and day.
translation:
  language: hi
  text: 'मैं, याहवे, उसका रखवाला हूँ;

    मैं उसे हर क्षण[a] सींचता हूँ।

    ताकि कोई उस पर हमला न करे[b],

    मैं रात-दिन उसकी रखवाली करता हूँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘क्षण-क्षण’ या ‘हर घड़ी’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘ताकि कोई उसे दंड न दे’ अथवा ‘उसके विरुद्ध कार्रवाई न करे।’ इब्रानी क्रिया शत्रुतापूर्ण हस्तक्षेप या दंडात्मक कार्रवाई—दोनों का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: נֹצְרָהּ
  choice: उसकी रखवाली करता हूँ
  rationale: नצר यहाँ दाख की बारी की सतर्क रक्षा और देखभाल व्यक्त करता है; स्त्रीलिंग प्रत्यय का स्वाभाविक हिन्दी रूप ‘उसकी’ है।
- source_word: לִרְגָעִים
  choice: हर घड़ी
  rationale: शाब्दिक रूप से ‘क्षणों पर/क्षण-क्षण’ है और सन्दर्भ में बार-बार तथा निरन्तर की जाने वाली देखभाल बताता है।
- source_word: אַשְׁקֶנָּה
  choice: मैं उसे ... सींचता हूँ
  rationale: שקה का हिफ़ील रूप ‘पानी पिलाना’ है; दाख की बारी के लिए ‘सींचना’ स्वाभाविक और सटीक है।
- source_word: פֶּן
  choice: कहीं ... न
  rationale: यह रोकथाम या आशंकित परिणाम बताने वाली निषेधात्मक उपवाक्य-रचना है, जिसका सहज हिन्दी रूप ‘कहीं ... न’ है।
- source_word: יִפְקֹד עָלֶיהָ
  choice: कोई उस पर आक्रमण न करे
  rationale: פקד על यहाँ प्रतिकूल या दंडात्मक हस्तक्षेप का अर्थ दे सकता है। दाख की बारी की रक्षा के प्रसंग में ‘आक्रमण’ शत्रुतापूर्ण कार्रवाई को स्पष्ट करता है, जबकि विकल्प पादटिप्पणी में रखा गया है।
- source_word: לַיְלָה וָיוֹם
  choice: रात-दिन
  rationale: यह निरन्तर अवधि सूचित करने वाला स्वाभाविक हिन्दी युग्म है।
- source_word: אֶצֳּרֶנָּה
  choice: मैं ... उसकी रखवाली करता हूँ
  rationale: नצר की पुनरावृत्ति को बनाए रखा गया है, जिससे आरम्भ और अन्त में परमेश्वर की सतत रक्षा पर बल बना रहता है।
theological_decisions:
- issue: परमेश्वर-नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में व्यक्तिगत परमेश्वर-नाम है; इसलिए उसे उपाधि से बदलने के बजाय लिप्यंतरित करना स्रोत के अधिक निकट है।
- issue: יִפְקֹד का अनिर्दिष्ट कर्ता
  choice: कोई
  alternative: वह अथवा कोई शत्रु
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन है, पर उसका स्पष्ट कर्ता नहीं दिया गया। ‘कोई’ इस अनिर्दिष्टता को हिन्दी में सुरक्षित रखता है।
- issue: יִפְקֹד עָלֶיהָ का प्रतिकूल अथवा दंडात्मक अर्थ
  choice: उस पर आक्रमण करे
  alternative: उसे दंड दे अथवा उसके विरुद्ध कार्रवाई करे
  rationale: बारी की रक्षा का प्रसंग शत्रुतापूर्ण हस्तक्षेप की ओर संकेत करता है, लेकिन क्रिया में दंडात्मक ‘लेखा लेना/दंड देना’ का अर्थ भी सम्भव है; इस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक समानान्तरता तथा आरम्भ और अन्त में ‘रखवाली’ की पुनरावृत्ति सुरक्षित है।
