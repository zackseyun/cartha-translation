  text: בַּ/יּ֣וֹם הַ/ה֡וּא יִפְקֹ֣ד יְהוָה֩ בְּ/חַרְב֨/וֹ הַ/קָּשָׁ֜ה וְ/הַ/גְּדוֹלָ֣ה וְ/הַֽ/חֲזָקָ֗ה עַ֤ל לִוְיָתָן֙ נָחָ֣שׁ בָּרִ֔חַ וְ/עַל֙ לִוְיָתָ֔ן נָחָ֖שׁ עֲקַלָּת֑וֹן וְ/הָרַ֥ג אֶת הַ/תַּנִּ֖ין אֲשֶׁ֥ר בַּ/יָּֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/001.yaml
  text: In that day Yahweh will punish Leviathan the fleeing serpent[a], Leviathan the twisting serpent, with his fierce and great and strong sword[c][b]; and he will kill the dragon that is in the sea.
translation:
  language: hi
  text: उस दिन याहवे अपनी भयानक, बड़ी और शक्तिशाली तलवार से लिव्यातान—भागने वाले सर्प[a]—को और लिव्यातान—बल खाते सर्प[b]—को दंड देगा; और वह समुद्री दैत्य[c] को मार डालेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वेगवान सर्प।”
    reason: lexical_alternative
  - marker: b
    text: या, “टेढ़ा-मेढ़ा सर्प।”
    reason: lexical_alternative
  - marker: c
    text: या, “ड्रैगन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यद्वाणी में प्रयुक्त मानक कालसूचक अभिव्यक्ति है और आधुनिक हिन्दी में सहज है।
- source_word: יִפְקֹד
  choice: दण्ड देगा
  rationale: עַל के साथ इस न्याय-संदर्भ में פקד का अर्थ दण्ड देना या न्याय करना है; ‘दण्ड देगा’ इसे स्पष्ट और संक्षिप्त रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: בְּחַרְבוֹ
  choice: अपनी ... तलवार से
  rationale: בְּ का करणवाचक अर्थ ‘से’ है; ‘अपनी’ तलवार के परमेश्वर से संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַקָּשָׁה וְהַגְּדוֹלָה וְהַחֲזָקָה
  choice: कठोर, बड़ी और शक्तिशाली
  rationale: तीनों विशेषणों का संचय बनाए रखते हुए हथियार और न्याय के संदर्भ में קָשָׁה को ‘कठोर’ तथा חֲזָקָה को ‘शक्तिशाली’ कहा गया है।
- source_word: לִוְיָתָן
  choice: लिव्यातान
  rationale: पौराणिक-काव्यात्मक प्राणी के नाम का अर्थ निर्धारित करने के बजाय उसका लिप्यंतरण किया गया है।
- source_word: נָחָשׁ בָּרִחַ
  choice: भागनेवाला सर्प
  rationale: נָחָשׁ के लिए गरिमापूर्ण ‘सर्प’ और בָּרִחַ के प्राथमिक अर्थ के लिए ‘भागनेवाला’ चुना गया है; ‘वेगवान’ की संभावना पादटिप्पणी में रखी गई है।
- source_word: נָחָשׁ עֲקַלָּתוֹן
  choice: बल खाता सर्प
  rationale: यह अभिव्यक्ति सर्प के मुड़े हुए या घुमावदार रूप को जीवंत और स्वाभाविक हिन्दी में व्यक्त करती है, बिना प्रतीक की पहचान तय किए।
- source_word: וְהָרַג
  choice: और वह ... मार डालेगा
  rationale: भविष्यद्वाणी के क्रम में पूर्ण क्रिया का भाव भविष्यकालीन है; ‘मार डालेगा’ आधुनिक हिन्दी में निर्णायक क्रिया को स्पष्ट करता है।
- source_word: הַתַּנִּין
  choice: अजगर
  rationale: תַּנִּין के सर्पाकार, दैत्याकार प्राणी की काव्यात्मक छवि के लिए ‘अजगर’ चुना गया है; व्यापक ‘समुद्री दैत्य’ विकल्प पादटिप्पणी में दिया गया है।
- source_word: אֲשֶׁר בַּיָּם
  choice: समुद्र में रहनेवाले
  rationale: सापेक्ष उपवाक्य को स्वाभाविक हिन्दी विशेषण-वाक्यांश में व्यक्त किया गया है; किसी विशिष्ट नामित समुद्र का संकेत नहीं जोड़ा गया।
theological_decisions:
- issue: लिव्यातान और תַּנִּין की पौराणिक-काव्यात्मक छवि
  choice: दोनों प्राणियों की छवि को यथावत रखा गया है और उन्हें शैतान, किसी साम्राज्य या किसी विशेष ऐतिहासिक शक्ति के रूप में नहीं पहचाना गया।
  alternative: इन्हें अराजक बुराई, शत्रु राष्ट्रों या शैतान का स्पष्ट प्रतीक मानकर अनुवाद करना।
  rationale: इब्रानी पद इन प्राणियों का नाम और वर्णन करता है, पर इसी पद में उनके प्रतीकात्मक अभिप्राय को निश्चित नहीं करता। अनुवाद उस वास्तविक अस्पष्टता और धर्मवैचारिक तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक है। दो समानांतर ‘लिव्यातान’ पदबंधों को डैश से स्पष्ट किया गया है, जबकि तलवार को दोनों पर होने वाले एक ही दण्ड का साधन रखा गया है।
