source:
  edition: WLC
  text: חֵמָ֖ה אֵ֣ין לִ֑/י מִֽי יִתְּנֵ֜/נִי שָׁמִ֥יר שַׁ֨יִת֙ בַּ/מִּלְחָמָ֔ה אֶפְשְׂעָ֥ה בָ֖/הּ אֲצִיתֶ֥/נָּה יָּֽחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/004.yaml
  text: I have no wrath[a]. Who would set briers and thorns against me in battle? I would march against them[b]; I would burn them up together.
translation:
  language: hi
  text: मुझमें कोई क्रोध नहीं है। कौन युद्ध में मेरे सामने कँटीली झाड़ियाँ और काँटे रखेगा?[a] मैं उन पर चढ़ दौड़ूँगा[b] और उन सबको एक साथ जला डालूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “कौन युद्ध में मुझे कँटीली झाड़ियाँ और काँटे देगा?” यह विरोधियों को अपने सामने लाने की चुनौती या इच्छा व्यक्त करने वाला कथन है।
    reason: lexical_alternative
  - marker: b
    text: “उन पर” और “उन सबको” के लिए इब्रानी में स्त्रीलिंग एकवचन प्रत्यय हैं, जो ‘कँटीली झाड़ियाँ और काँटे’ को एक सामूहिक इकाई के रूप में संदर्भित करते हैं। हिन्दी में अर्थ की स्पष्टता के लिए बहुवचन रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵמָה
  choice: क्रोध
  rationale: यह शब्द प्रचंड, जलते हुए रोष को व्यक्त करता है। आधुनिक हिन्दी में ‘क्रोध’ स्वाभाविक और गरिमापूर्ण है तथा कथन की तीव्रता बनाए रखता है।
- source_word: אֵין לִי
  choice: मुझमें कोई ... नहीं है
  rationale: शाब्दिक अस्तित्व-संबंधी रचना ‘मेरे लिए नहीं है’ हिन्दी में अस्वाभाविक होती; ‘मुझमें कोई क्रोध नहीं है’ वक्ता की वर्तमान मनोदशा को स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: מִי יִתְּנֵנִי
  choice: कौन ... मेरे विरुद्ध खड़े करेगा?
  rationale: शाब्दिक अर्थ ‘कौन मुझे देगा?’ है, पर प्रसंग में यह विरोधियों को सामने लाने की चुनौती व्यक्त करता है। प्रश्नवाचक रूप मूल की चुनौती और संभाव्यता दोनों बनाए रखता है।
- source_word: שָׁמִיר שַׁיִת
  choice: कँटीली झाड़ियाँ और काँटे
  rationale: यह युग्म हानिकारक और जलाए जाने योग्य कँटीली वनस्पति का सामूहिक चित्र देता है। चुनी हुई हिन्दी साधारण पाठकों के लिए स्पष्ट है और दाख की बारी के रूपक से मेल खाती है।
- source_word: בַּמִּלְחָמָה
  choice: युद्ध में
  rationale: यह विरोधपूर्ण, युद्ध-सदृश परिस्थिति को सीधे और संक्षेप में व्यक्त करता है।
- source_word: אֶפְשְׂעָה בָהּ
  choice: मैं उन पर चढ़ दौड़ूँगा
  rationale: पशׂע यहाँ कदम बढ़ाने या आगे चढ़ आने का भाव रखता है। युद्ध के प्रसंग में ‘चढ़ दौड़ूँगा’ आक्रामक अग्रसरता को व्यक्त करता है, बिना इसे केवल ‘कुचलना’ मानकर सीमित किए।
- source_word: אֲצִיתֶנָּה
  choice: उन सबको ... जला दूँगा
  rationale: हिफ़ील रूप आग लगाने का अर्थ देता है। ‘जला दूँगा’ प्रज्वलन और विनाश दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: יַחַד
  choice: एक साथ
  rationale: यह समूची कँटीली वनस्पति के संयुक्त और पूर्ण दहन पर बल देता है।
theological_decisions:
- issue: दाख की बारी के प्रति वक्ता की मनोदशा
  choice: ‘मुझमें कोई क्रोध नहीं है’ को यहोवा की अपनी सुरक्षित दाख की बारी के प्रति वर्तमान मनोदशा के रूप में अनिर्दिष्ट ही रखा गया है।
  alternative: इसे परमेश्वर के क्रोध का सर्वथा और सार्वकालिक निषेध माना जा सकता है, अथवा स्पष्ट रूप से ‘मैं इस दाख की बारी पर क्रोधित नहीं हूँ’ कहा जा सकता है।
  rationale: मूल कथन में क्रोध का कर्म स्पष्ट नहीं है। निकटवर्ती प्रसंग दाख की बारी की रक्षा का है, पर अनुवाद में कर्म जोड़ने से मूल की खुली हुई अभिव्यक्ति और उसका धर्मवैचारिक तनाव समाप्त हो जाता।
- issue: कँटीली वनस्पति का संकेत
  choice: कँटीली झाड़ियों और काँटों को रूपकात्मक संभाव्यता सहित ठोस वनस्पति-चित्र के रूप में रखा गया है।
  alternative: उन्हें सीधे ‘शत्रु’ या ‘दुष्ट लोग’ कहा जा सकता है।
  rationale: मूल पाठ स्वयं रूपक की पहचान नहीं खोलता। ठोस चित्र बनाए रखने से पाठक प्रसंग में उसके संभावित शत्रुतापूर्ण संकेत को समझ सकता है, जबकि अनुवाद कोई एक व्याख्या आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण है। ‘चढ़ दौड़ूँगा’ युद्धगत अग्रसरता का सजीव भाव देता है। प्रश्न, सामूहिक वनस्पति-रूपक और क्रोध के अनिर्दिष्ट संबंध को मूल के अनुसार खुला रखा गया है।
