    issue: “पुरवाई” for קָדִים
    rationale: In standard Hindi, “पुरवाई” commonly suggests a gentle, often welcome easterly breeze. The context and the Hebrew biblical image require a scorching/destructive east wind; “पूर्वी आँधी” communicates this safely.
  - severity: low
    issue: Footnote c says “पूर्व से रेगिस्तान की ओर से आने वाली”
    rationale: 'This wording is directionally confused: it says the wind comes from the east toward the desert. The intended note should say that it comes from the desert/eastern desert regions.'
