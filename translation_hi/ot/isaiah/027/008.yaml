  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/סַּאסְּאָ֖ה בְּ/שַׁלְחָ֣/הּ תְּרִיבֶ֑/נָּה הָגָ֛ה בְּ/רוּח֥/וֹ הַ/קָּשָׁ֖ה בְּ/י֥וֹם קָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/008.yaml
  text: By measure[a], when you sent her away, you contended with her[c][b]; he drove her out with his fierce wind on the day of the east wind.
translation:
  language: hi
  text: नाप-तौलकर[a], जब तूने उसे दूर भेजा, तब तूने उससे वाद-विवाद किया[b]; पूर्वी आँधी[c] के दिन उसने अपनी प्रचण्ड वायु से उसे उड़ा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘संयम के साथ’ अथवा ‘ठीक माप के अनुसार।’ यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और सम्भवतः यह बताता है कि दण्ड सीमित था, सर्वनाश करने वाला नहीं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘उसे/उससे’ के लिए स्त्रीलिंग रूप है; सम्भवतः सिय्योन, इज़राइल या परमेश्वर की प्रजा को स्त्री के रूप में चित्रित किया गया है।
    reason: alternative_reading
  - marker: c
    text: ‘पूर्वी आँधी’ पूर्व अथवा पूर्वी रेगिस्तानी क्षेत्रों से आने वाली तपती, विनाशकारी हवा का बिंब है।
    reason: cultural_note
lexical_decisions:
- source_word: בְּסַּאסְּאָה
  choice: नाप-तौलकर
  rationale: यह दुर्लभ इब्रानी रूप सम्भवतः मापी हुई या सीमित कार्रवाई बताता है। यह चयन माप के रूपक और संयमित न्याय—दोनों संकेतों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּשַׁלְחָהּ
  choice: जब तूने उसे दूर भेजा
  rationale: שלח के साथ स्त्रीलिंग एकवचन प्रत्यय है। ‘दूर भेजा’ निर्वासन अथवा न्याय का संकेत देता है, पर तलाक़ या पूर्ण विनाश जैसा कोई अधिक विशिष्ट अर्थ नहीं थोपता।
- source_word: תְּרִיבֶנָּה
  choice: तूने उससे विवाद किया
  rationale: ריב में विवाद करने, किसी के विरुद्ध वाद चलाने या न्यायिक रूप से उलझने का भाव हो सकता है। ‘विवाद किया’ इस व्यापक न्यायिक-काव्यात्मक अर्थ को खुला रखता है।
- source_word: הָגָה
  choice: उसे निकाल दिया
  rationale: सन्दर्भ और प्रचण्ड वायु के साधनात्मक चित्र के कारण क्रिया को बलपूर्वक हटाने के अर्थ में लिया गया है।
- source_word: בְּרוּחוֹ
  choice: अपनी ... वायु से
  rationale: רוּחַ का अर्थ वायु, श्वास या आत्मा हो सकता है; परन्तु यहाँ ‘पुरवाई’ के समानान्तर प्रयोग के कारण ‘वायु’ सर्वाधिक उपयुक्त है।
- source_word: הַקָּשָׁה
  choice: प्रचण्ड
  rationale: विशेषण कठोरता और तीव्रता व्यक्त करता है। हिन्दी में ‘प्रचण्ड वायु’ विनाशकारी बल को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: בְּיוֹם קָדִים
  choice: पुरवाई के दिन
  rationale: קָדִים पूर्व दिशा से आने वाली गरम और विनाशकारी हवा है। ‘पुरवाई’ संक्षिप्त, काव्यात्मक और सामान्य हिन्दी में बोधगम्य है; उसका सांस्कृतिक आशय पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: स्त्रीलिंग प्रत्ययों का संकेतार्थ
  choice: मुख्य पाठ में संकेतार्थ को ‘उसे/उससे’ के रूप में अनिर्दिष्ट रखा गया है और पादटिप्पणी में इब्रानी स्त्रीलिंग बताया गया है।
  alternative: इज़राइल, सिय्योन या परमेश्वर की प्रजा को स्पष्ट रूप से नाम देना।
  rationale: पद स्वयं स्त्रीरूप में चित्रित पात्र की स्पष्ट पहचान नहीं करता; इसलिए किसी एक व्याख्या को पाठ में आरोपित नहीं किया गया।
- issue: द्वितीय पुरुष से तृतीय पुरुष में आकस्मिक परिवर्तन
  choice: ‘तूने ... उसने’ के द्वारा पुरुष-परिवर्तन बनाए रखा गया है।
  alternative: दोनों खण्डों में ‘तूने’ करके वाक्य को समरूप बनाना।
  rationale: इब्रानी का ध्यान देने योग्य काव्यात्मक पुरुष-परिवर्तन वास्तविक पाठगत विशेषता है; उसे चुपचाप समतल करना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण काव्यात्मक गद्य अपनाया गया है। ‘तूने ... उसने’ से मूल का आकस्मिक पुरुष-परिवर्तन सुरक्षित है। ‘नाप-तौलकर’ दुर्लभ आरम्भिक पद का रूपक बनाए रखता है, जबकि पादटिप्पणी उसकी अनिश्चितता बताती है।
