  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵ֗ן בְּ/זֹאת֙ יְכֻפַּ֣ר עֲוֺֽן יַעֲקֹ֔ב וְ/זֶ֕ה כָּל פְּרִ֖י הָסִ֣ר חַטָּאת֑/וֹ בְּ/שׂוּמ֣/וֹ כָּל אַבְנֵ֣י מִזְבֵּ֗חַ כְּ/אַבְנֵי גִר֙ מְנֻפָּצ֔וֹת לֹֽא יָקֻ֥מוּ אֲשֵׁרִ֖ים וְ/חַמָּנִֽים־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/009.yaml
  text: 'Therefore by this the guilt of Jacob will be atoned for, and this will be the full fruit of the removal of his sin: when he makes all the stones of the altar like crushed chalkstones, the Asherah poles and incense altars will not stand.'
translation:
  language: hi
  text: 'इसलिए इसी के द्वारा याकूब के दोष का प्रायश्चित किया जाएगा, और उसके पाप को दूर करने का पूरा फल यह होगा: जब वह वेदी के सभी पत्थरों को चूर किए हुए चूना-पत्थरों के समान कर देगा, तब न अशेरा-स्तंभ और न सूर्य-स्तंभ खड़े रहेंगे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְכֻפַּר
  choice: प्रायश्चित होगा
  rationale: पुअल रूप पाप अथवा दोष के प्रायश्चित किए जाने को व्यक्त करता है; यह हिंदी में स्वाभाविक रहते हुए धार्मिक आशय बनाए रखता है।
- source_word: עֲוֺן
  choice: अधर्म
  rationale: यह शब्द दोष, अपराध और उसके दंड के अर्थ-क्षेत्र को समेटता है; यहाँ ‘अधर्म’ याकूब के पापपूर्ण अपराध को संक्षेप में व्यक्त करता है।
- source_word: כָּל־פְּרִי
  choice: पूरा फल
  rationale: 'हिब्रू रूपक को बनाए रखा गया है: पाप हटने का प्रत्यक्ष परिणाम मूर्तिपूजक वेदियों और प्रतीकों का नाश है।'
- source_word: אַבְנֵי־גִר מְנֻפָּצוֹת
  choice: चूर किए हुए चूना-पत्थर
  rationale: גִר को चूने/चाक जैसे भुरभुरे पत्थर और מְנֻפָּצוֹת को कुचले या चूर किए हुए पत्थर के रूप में व्यक्त किया गया है।
- source_word: אֲשֵׁרִים
  choice: अशेरा-स्तंभ
  rationale: यह अशेरा से जुड़े उपासना-प्रतीकों के लिए तकनीकी बहुवचन है; ‘स्तंभ’ सामान्य पाठक को भौतिक वस्तु का संकेत देता है, जबकि नाम का ऐतिहासिक स्वरूप बचा रहता है।
- source_word: חַמָּנִים
  choice: सूर्य-स्तंभ
  rationale: यह शब्द संभवतः सूर्य-पूजा से जुड़े धार्मिक स्तंभों या प्रतीकों को दर्शाता है; ‘धूप-वेदियाँ’ कहना स्रोत से कम सुनिश्चित है।
theological_decisions:
- issue: प्रायश्चित और मूर्तिपूजक वेदियों के विनाश का संबंध
  choice: वचन के ‘इसी के द्वारा’ और ‘पूरा फल’ को यथावत रखकर दोनों के बीच निकट संबंध व्यक्त किया गया है।
  alternative: मूर्तियों के विनाश को प्रायश्चित का साधन या केवल उसका प्रमाण मानकर संबंध को स्पष्ट कर देना।
  rationale: हिब्रू पाठ कारण, माध्यम और परिणाम के बीच जानबूझकर तनाव रखता है; अनुवाद इसे किसी एक व्यवस्थित धर्मवैज्ञानिक व्याख्या में सीमित नहीं करता।
- issue: הָסִר חַטָּאתוֹ में कर्ता
  choice: ‘उसके पाप को दूर करने’ द्वारा कर्ता को अनिर्दिष्ट रखा गया है।
  alternative: ‘जब परमेश्वर उसका पाप दूर करेगा’ या ‘जब याकूब अपना पाप दूर करेगा।’
  rationale: मसोराई पाठ में क्रियारूप कर्ता को स्पष्ट नहीं करता; इसलिए अनुवाद अस्पष्टता को सुरक्षित रखता है।
- issue: בְּשׂוּמוֹ में ‘वह’ का संदर्भ
  choice: ‘जब वह ... कर देगा’ में सर्वनाम रखा गया है।
  alternative: कर्ता को परमेश्वर या याकूब के रूप में स्पष्ट करना।
  rationale: निकट संदर्भ में सर्वनाम का निश्चित संदर्भ विवादित है; स्रोत की अस्पष्टता को नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और साधारण पाठकों के लिए बोधगम्य हिंदी। वाक्य की काव्यात्मक कारण-परिणाम संरचना और मूल पाठ के अस्पष्ट सर्वनाम सुरक्षित रखे गए हैं।
