  yaml_path: translation/ot/isaiah/027/005.yaml
  text: Or let him take hold of my strength[a]; let him make peace with me; let him make peace with me.
translation:
  language: hi
  text: या वह मेरी सामर्थ्य को थाम ले[a]; वह मेरे साथ मेल करे; वह मेरे साथ मेल करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे शरणस्थान को” अथवा “मेरे गढ़ को।”
    reason: lexical_alternative
lexical_decisions:
- source_word: א֚וֹ
  choice: या
  rationale: यह पिछले न्याय-वर्णन के सामने एक वैकल्पिक मार्ग प्रस्तुत करता है; ‘या’ संक्षिप्त और स्वाभाविक है।
- source_word: יַחֲזֵ֣ק
  choice: थाम ले
  rationale: यहाँ हिफ़ील रूप सक्रिय रूप से पकड़ने या आश्रय के लिए थामने का भाव देता है; यह ठोस रूपक को बनाए रखता है।
- source_word: בְּמָעוּזִּ֔י
  choice: मेरे शरणस्थान को
  rationale: מָעוֹז किसी दृढ़ सुरक्षित स्थान, शरण या सामर्थ्य के स्रोत को सूचित कर सकता है। संदर्भ में ‘शरणस्थान’ ईश्वरीय सुरक्षा का भाव स्पष्ट करता है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: יַעֲשֶׂ֥ה שָׁל֖וֹם לִ֑י
  choice: वह मेरे साथ मेल करे
  rationale: עשה שׁלום לְ संबंधगत मेल स्थापित करने का मुहावरा है। हिंदी में ‘मेरे साथ मेल करे’ स्वाभाविक है और आदेशात्मक/आमंत्रणात्मक बल को रखता है।
- source_word: שָׁל֖וֹם יַֽעֲשֶׂה לִּֽי
  choice: वह मेरे साथ मेल करे
  rationale: मूल पाठ की पूर्ण पुनरावृत्ति बल और आग्रह व्यक्त करती है; इसलिए इसे संक्षिप्त या लुप्त नहीं किया गया।
theological_decisions:
- issue: प्रथम पुरुष सर्वनामों का वक्ता
  choice: वक्ता परमेश्वर है, जो अपनी शरण लेने और अपने साथ मेल करने का विकल्प देता है।
  alternative: ऐसा निर्वैयक्तिक पाठ जिसमें परमेश्वर के प्रत्यक्ष आत्म-संदर्भ को कम कर दिया जाए।
  rationale: यशायाह 27 के निकट संदर्भ में वाणी परमेश्वर की है। अनुवाद इस प्रत्यक्ष आमंत्रण को बनाए रखता है, पर इससे आगे कोई सांप्रदायिक निष्कर्ष नहीं जोड़ता।
- issue: שָׁלוֹם का संबंधगत अर्थ
  choice: मेल
  alternative: शांति, कुशलता या संपूर्णता
  rationale: לִי के साथ इस वाक्य-विन्यास में मुख्य भाव परमेश्वर के साथ संबंध का मेल है। ‘मेल’ इसे स्पष्ट करता है, जबकि शब्द के व्यापक अर्थों को अनुचित रूप से पद में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल के पकड़ने वाले रूपक तथा ‘मेरे साथ मेल करे’ की जानबूझकर की गई पुनरावृत्ति दोनों सुरक्षित हैं।
