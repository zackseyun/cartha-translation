base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/013.yaml
  text: And in that day a great trumpet will be blown[c][b][a], and those perishing in the land of Assyria and those driven away in the land of Egypt will come and worship Yahweh on the holy mountain in Jerusalem.
translation:
  language: hi
  text: उस दिन ऐसा होगा कि एक बड़ा नरसिंगा फूँका जाएगा। तब अश्शूर देश में नाश हो रहे लोग[a] और मिस्र देश में निकाल दिए गए लोग[b] आएँगे और यरूशलेम में पवित्र पर्वत पर यहोवा की उपासना करेंगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खोए हुए लोग’।
    reason: lexical_alternative
  - marker: b
    text: या ‘निर्वासित लोग’ अथवा ‘बहिष्कृत लोग’।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक अर्थ ‘यहोवा को झुककर प्रणाम करेंगे’ या ‘दण्डवत करेंगे’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: उस दिन ऐसा होगा कि
  rationale: यह भविष्य की निर्णायक घटना का परिचय देने वाला भविष्यसूचक सूत्र है। यह रूप हिब्रू की समय-सूचना और घटना-सूचक बल दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: יִתָּקַע בְּשׁוֹפָר גָּדוֹל
  choice: एक बड़ा नरसिंगा फूँका जाएगा
  rationale: निफ़अल क्रिया का कर्मवाच्य बल सुरक्षित है। שׁוֹפָר सींग से बने वाद्य को दर्शाता है; ‘नरसिंगा’ हिन्दी पाठक के लिए ‘शोफ़ार’ की अपेक्षा अधिक सुबोध है और ‘बड़ा’ उसके आकार अथवा महत्त्व—दोनों की सम्भावना खुली रखता है।
- source_word: הָאֹבְדִים
  choice: नाश हो रहे लोग
  rationale: אבד का कृदन्त नाश होने, मिटने अथवा खो जाने की दशा बता सकता है। ‘नाश हो रहे’ उसके जारी क्रियात्मक बल को रखता है; ‘खोए हुए’ को पादटिप्पणी में विकल्प के रूप में दिया गया है।
- source_word: וְהַנִּדָּחִים
  choice: दूर निकाल दिए गए लोग
  rationale: נדח का कर्मवाच्य कृदन्त बलपूर्वक दूर किए जाने अथवा निर्वासन का भाव देता है। यह अनुवाद उस कर्मवाच्य बल को बनाए रखता है, जबकि ‘निर्वासित’ और ‘बहिष्कृत’ सम्भव विकल्प हैं।
- source_word: וְהִשְׁתַּחֲווּ לַיהוָה
  choice: यहोवा की उपासना करेंगे
  rationale: क्रिया का मूल दृश्य झुकने या भूमि पर दण्डवत करने का है, और यहोवा इसके लक्ष्य हैं; प्रसंग में ‘उपासना’ धार्मिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करती है। शारीरिक भाव पादटिप्पणी में सुरक्षित है।
- source_word: בְּהַר הַקֹּדֶשׁ בִּירוּשָׁלָם
  choice: यरूशलेम में पवित्र पर्वत पर
  rationale: स्थान-संबंधों और पवित्र पर्वत की निश्चित पहचान को स्पष्ट तथा स्वाभाविक हिन्दी क्रम में रखा गया है।
theological_decisions:
- issue: भविष्यसूचक पुनःएकत्रीकरण का समय और स्वरूप
  choice: अश्शूर और मिस्र से आने की भविष्यसूचक छवि को बिना सीमित व्याख्या के रखा गया है।
  alternative: इसे केवल ऐतिहासिक निर्वासन से वापसी या केवल अंतिम युग के एकत्रीकरण के रूप में स्पष्ट करना।
  rationale: ‘उस दिन’ और पुनःएकत्रीकरण की भाषा ऐतिहासिक तथा अंतिम-कालीन क्षितिजों के बीच तनाव को खुला रखती है; अनुवाद उनमें से किसी एक को अनिवार्य नहीं बनाता।
- issue: יהוה का हिन्दी रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और सामान्य संज्ञा ‘प्रभु’ की अपेक्षा नाम होने का संकेत स्पष्ट रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण भविष्यसूचक गद्य अपनाया गया है। ‘नरसिंगा’, ‘अश्शूर’, ‘यरूशलेम’ और ‘पवित्र पर्वत’ बाइबलीय परिवेश को बनाए रखते हुए सामान्य पाठक के लिए सुबोध हैं।
