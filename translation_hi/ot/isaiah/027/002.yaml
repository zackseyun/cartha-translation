- source_word: עַנּוּ
  choice: गाओ
  rationale: यहाँ ענה बहुवचन आज्ञार्थक रूप में संगीतात्मक या प्रतिगान के अर्थ में है—अर्थात् गीत में उत्तर देना। हिन्दी में ‘गाओ’ सबसे स्पष्ट और सहज अनुवाद है।
- source_word: לָהּ
  choice: उसके विषय में
  rationale: स्त्रीलिंग एकवचन सर्वनाम दाख की बारी की ओर संकेत करता है। לְ के कारण ‘उसके लिए,’ ‘उसको,’ या ‘उसके विषय में’ जैसी बारीकियाँ सम्भव हैं; मुख्य पाठ में प्रसंगानुकूल ‘उसके विषय में’ रखा गया है।
