source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא יַחְבֹּ֧ט יְהוָ֛ה מִ/שִּׁבֹּ֥לֶת הַ/נָּהָ֖ר עַד נַ֣חַל מִצְרָ֑יִם וְ/אַתֶּ֧ם תְּלֻקְּט֛וּ לְ/אַחַ֥ד אֶחָ֖ד בְּנֵ֥י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/012.yaml
  text: And in that day Yahweh will thresh from the channel of the River to the Wadi of Egypt[a], and you will be gathered one by one[d][c][b], O sons of Israel.
translation:
  language: hi
  text: उस दिन ऐसा होगा कि याहवे नदी की धारा[a] से लेकर मिस्र की वादी[b] तक मड़ाई करेगा, और हे इस्राएल के पुत्रों[d], तुम एक-एक करके[c] बटोरे जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “फरात नदी।” बाइबल में “नदी” प्रायः फरात के लिए प्रयुक्त होता है।
    reason: cross_reference
  - marker: b
    text: अथवा “मिस्र का नाला।” हिब्रू शब्द किसी वादी या मौसमी जलधारा को सूचित करता है; इसका अर्थ अनिवार्य रूप से नील नदी नहीं है।
    reason: lexical_alternative
  - marker: c
    text: यह क्रिया और “एक-एक करके” खेत में मड़ाई के बाद बची उपज को अलग-अलग चुनकर इकट्ठा करने की छवि जगाते हैं।
    reason: cultural_note
  - marker: d
    text: अथवा “इस्राएल की संतानों।” हिब्रू में शाब्दिक रूप से “इस्राएल के पुत्रों” है और यह पूरे इस्राएली समुदाय का संबोधन हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: उस दिन ऐसा होगा कि
  rationale: यह भविष्यसूचक समय-सूचक सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और हिब्रू के ‘ऐसा होगा’ भाव को बनाए रखता है।
- source_word: יַחְבֹּט
  choice: फसल झाड़ेगा
  rationale: हिब्रू क्रिया पीटकर दाने या फल अलग करने की कृषि-छवि जगाती है। हिन्दी में ‘फसल झाड़ना’ उस रूपक को समझने योग्य बनाता है; ‘फसल’ क्रिया में निहित कर्म को स्पष्ट करता है, जबकि अगले वाक्यांश में लोगों को एक-एक कर बटोरना इसी छवि को आगे बढ़ाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह चार अक्षरों वाले व्यक्तिगत दिव्य नाम का प्रचलित हिन्दी लिप्यंतरण है; इसे किसी उपाधि से नहीं बदला गया है।
- source_word: מִשִּׁבֹּלֶת הַנָּהָר
  choice: उस नदी की धारा से
  rationale: שִׁבֹּלֶת यहाँ भौगोलिक सीमा के संदर्भ में धारा या प्रवाह को सूचित करता है। הַנָּהָר को मूल की तरह ‘उस नदी’ रखा गया है और संभावित पहचान पाद-टिप्पणी में दी गई है।
- source_word: עַד נַחַל מִצְרָיִם
  choice: मिस्र के वादी तक
  rationale: נַחַל प्रायः मौसमी जलधारा या उसकी घाटी है, अनिवार्यतः नील जैसी सदानीरा नदी नहीं। ‘वादी’ इस भौगोलिक अर्थ को सुरक्षित रखता है।
- source_word: תְּלֻקְּטוּ
  choice: बटोरे जाओगे
  rationale: निष्क्रिय क्रिया खेत में बची उपज को चुनकर इकट्ठा करने की छवि रखती है। ‘बटोरे जाओगे’ उस कृषि-संबंधी अर्थ और पुनः एकत्र किए जाने, दोनों को व्यक्त करता है।
- source_word: לְאַחַד אֶחָד
  choice: एक-एक करके
  rationale: यह वितरणात्मक अभिव्यक्ति प्रत्येक व्यक्ति को अलग-अलग एकत्र किए जाने पर बल देती है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: हे इस्राएल के पुत्रो
  rationale: यह मूल के शाब्दिक पुल्लिंग बहुवचन और प्रत्यक्ष संबोधन को सुरक्षित रखता है। ‘पुत्रो’ में हिन्दी संबोधन-रूप स्वाभाविक है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। उसका लिप्यंतरण करना नाम को सुरक्षित रखता है और उसे किसी उपाधि में नहीं बदलता।
- issue: בְּנֵי יִשְׂרָאֵל में लिंग और सामुदायिक संबोधन
  choice: इस्राएल के पुत्रो
  alternative: इस्राएल की सन्तानो; इस्राएल के लोगो
  rationale: मुख्य पाठ में हिब्रू के स्पष्ट पुल्लिंग बहुवचन को बनाए रखा गया है। साथ ही पाद-टिप्पणी बताती है कि यह पूरे इस्राएली समुदाय के लिए प्रचलित जातीय-सामुदायिक संबोधन भी हो सकता है।
- issue: झाड़ने और बटोरने के कृषि-रूपक का संबंध
  choice: रूपक को दोनों खंडों में बनाए रखना
  alternative: इसे सीधे न्याय और पुनर्स्थापना के रूप में व्याख्यायित करना
  rationale: पाठ कृषि-छवि के माध्यम से बोलता है और स्वयं उसका पूरा धर्मवैचारिक आशय स्पष्ट नहीं करता। इसलिए अनुवाद न्याय या उद्धार में से किसी एक अर्थ को मुख्य पाठ में निर्णायक रूप से नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वादी’ अपेक्षाकृत विशिष्ट भौगोलिक शब्द है, इसलिए उसका अर्थ पाद-टिप्पणी में स्पष्ट किया गया है। कृषि-रूपक को सरल व्याख्यात्मक गद्य में बदलने के बजाय मुख्य पाठ में सुरक्षित रखा गया है।
