source:
  edition: WLC
  text: הַ/בָּאִים֙ יַשְׁרֵ֣שׁ יַֽעֲקֹ֔ב יָצִ֥יץ וּ/פָרַ֖ח יִשְׂרָאֵ֑ל וּ/מָלְא֥וּ פְנֵי תֵבֵ֖ל תְּנוּבָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/006.yaml
  text: In days to come Jacob will take root[a]; Israel will blossom and flower[b], and they will fill the face of the world with fruit.
translation:
  language: hi
  text: आने वाले दिनों में याकूब जड़ पकड़ेगा[a]; इस्राएल कोंपलें निकालेगा और फूलेगा, और वे सारे जगत को फल[b] से भर देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आने वाले लोग—याकूब जड़ पकड़ेगा।” इब्रानी आरंभ का अधिक शाब्दिक अर्थ “आने वाले” है, पर संदर्भ में संभवतः यह “आने वाले दिनों में” के अर्थ में कालवाचक मुहावरा है।
    reason: alternative_reading
  - marker: b
    text: “फल” का अनुवाद “उपज” या “पैदावार” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּאִים
  choice: आनेवाले दिनों में
  rationale: सप्रत्यय कृदंत का शाब्दिक अर्थ ‘आनेवाले’ हो सकता है, पर इस संदर्भ में यह भविष्यकाल सूचित करनेवाली संक्षिप्त कालवाचक अभिव्यक्ति जान पड़ती है।
- source_word: יַשְׁרֵשׁ
  choice: जड़ पकड़ेगा
  rationale: हिफ़ील रूप कारणवाचक अर्थ भी दे सकता है, पर पौधे की समानांतर उपमा में अकर्मक भाव ‘जड़ पकड़ना’ स्वाभाविक है।
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  choice: याकूब / इस्राएल
  rationale: दोनों नाम ज्यों के त्यों रखे गए हैं; यहाँ वे सामूहिक रूप से लोगों को दर्शाते हैं, पर पाठ में इसका व्याख्यात्मक विस्तार नहीं किया गया।
- source_word: יָצִיץ
  choice: कोंपलें निकालेगा
  rationale: क्रिया अंकुरित होने या कली निकलने का बोध देती है और अगली क्रिया ‘फूलेगा’ से अलग वनस्पति-विकास की अवस्था को स्पष्ट रखती है।
- source_word: וּפָרַח
  choice: और फूलेगा
  rationale: यह ठोस वनस्पति-बिंब को बनाए रखता है और अमूर्त ‘फले-फूलेगा’ जैसी व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: וּמָלְאוּ
  choice: और वे ... भर देंगे
  rationale: इब्रानी में क्रिया बहुवचन है; ‘वे’ जोड़कर याकूब/इस्राएल नामों के पीछे निहित सामूहिक जनसमुदाय और वचन-परिवर्तन स्पष्ट किया गया है।
- source_word: פְנֵי תֵבֵל
  choice: सारे जगत को
  rationale: शाब्दिक ‘जगत के मुख को’ हिन्दी में अस्वाभाविक है; ‘सारे जगत को’ פני के व्यापक सतही/स्थानिक भाव को सहज रूप में व्यक्त करता है।
- source_word: תְּנוּבָה
  choice: फल
  rationale: संज्ञा उपज या पैदावार दर्शाती है; आसपास के पौधों के बिंब के कारण ‘फल’ स्वाभाविक और रूपक-सक्षम है।
theological_decisions:
- issue: कृषि-रूपक में याकूब/इस्राएल की सामूहिक पहचान
  choice: नामों को सीधे रखते हुए बहुवचन ‘वे’ से सामूहिकता उभरने दी गई है।
  alternative: ‘याकूब/इस्राएल के वंशज’ कहकर सामूहिक अर्थ को स्पष्ट करना।
  rationale: इब्रानी काव्य नामों को ही समानांतर रखता है और बाद की बहुवचन क्रिया सामूहिक आशय बताती है; विस्तार जोड़ना अनावश्यक व्याख्या होता।
- issue: יַשְׁרֵשׁ का कारणवाचक या अकर्मक भाव
  choice: ‘जड़ पकड़ेगा’
  alternative: ‘जड़ जमाएगा’ या ‘जड़ पकड़वाएगा’
  rationale: कर्ता याकूब और आगे अंकुरित होने व फूलने की समानांतर क्रियाओं के कारण यहाँ प्रभावी अकर्मक अर्थ अधिक संगत है, यद्यपि रूप कारणवाचक अर्थ की संभावना रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; कृषि-बिंबों को ठोस रखा गया है। ‘आनेवाले दिनों में’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पाद-टिप्पणी इब्रानी आरंभ की वास्तविक व्याकरणिक अस्पष्टता सुरक्षित रखती है।
