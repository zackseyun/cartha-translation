  text: כִּ֣י עִ֤יר בְּצוּרָה֙ בָּדָ֔ד נָוֶ֕ה מְשֻׁלָּ֥ח וְ/נֶעֱזָ֖ב כַּ/מִּדְבָּ֑ר שָׁ֣ם יִרְעֶ֥ה עֵ֛גֶל וְ/שָׁ֥ם יִרְבָּ֖ץ וְ/כִלָּ֥ה סְעִפֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/010.yaml
  text: For the fortified city is solitary[a], a habitation deserted and abandoned like the wilderness; there a calf grazes[b], and there it lies down and strips its branches bare.
translation:
  language: hi
  text: 'क्योंकि किलेबंद नगर एकाकी पड़ा है,


    वह निवास-स्थान मरुभूमि के समान छोड़ दिया गया और त्याग दिया गया है[a];


    वहाँ एक बछड़ा चरता है, वहीं वह लेटता है


    और उसकी डालियाँ पूरी तरह खा जाता है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘निवास-स्थान’ के लिए ‘चरागाह’ या ‘बसने का स्थान’ भी सम्भव है। इब्रानी נָוֶה में आवासीय और चरागाही, दोनों अर्थ-छायाएँ हो सकती हैं।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उसकी डालियों को पूरी तरह खा जाता है।’ इब्रानी क्रिया पूर्ण उपभोग या समाप्त कर देने का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण या आधार प्रस्तुत करता है; ‘क्योंकि’ उसके व्याख्यात्मक-कारणसूचक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: עִיר בְּצוּרָה
  choice: गढ़वाला नगर
  rationale: यह पदबंध किलेबंद या सुरक्षित नगर को दर्शाता है। ‘गढ़वाला नगर’ सामान्य आधुनिक पाठक के लिए स्पष्ट और काव्यात्मक रूप से सहज है।
- source_word: בָּדָד
  choice: उजाड़ पड़ा है
  rationale: शब्द का मूल भाव अकेले या अलग पड़े होने का है; संदर्भ में नगर की निर्जन दशा को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘उजाड़ पड़ा है’ चुना गया।
- source_word: נָוֶה
  choice: निवास-स्थान
  rationale: यह शब्द निवास या चरागाह दोनों का संकेत दे सकता है। नगर के समानाधिकरण में ‘निवास-स्थान’ प्रमुख आवासीय अर्थ रखता है, जबकि वैकल्पिक चरागाही अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: מְשֻׁלָּח וְנֶעֱזָב
  choice: निर्जन और ... त्यागा हुआ
  rationale: दोनों निष्क्रिय रूप उस स्थान को छोड़ दिए जाने की तीव्र तस्वीर बनाते हैं। हिन्दी में दोनों भाव अलग रखते हुए अनावश्यक रूप से एक ही शब्द दोहराने से बचा गया है।
- source_word: כַּמִּדְבָּר
  choice: मरुभूमि के समान
  rationale: यह नगर की असंवर्धित, जनहीन दशा की तुलना निर्जन भूभाग से करता है। ‘मरुभूमि’ गरिमापूर्ण और व्यापक बाइबिलीय प्रयोग के अनुकूल है।
- source_word: שָׁם יִרְעֶה עֵגֶל
  choice: वहाँ बछड़ा चरता है
  rationale: एकवचन עֵגֶל को ‘बछड़ा’ और רעה के पशु-चराई वाले अर्थ को सरल वर्तमान ‘चरता है’ से व्यक्त किया गया है।
- source_word: וְשָׁם יִרְבָּץ
  choice: वहीं वह लेटता है
  rationale: क्रिया पशु के बैठने या लेटकर विश्राम करने को बताती है; ‘वह’ का संदर्भ बछड़े से है।
- source_word: וְכִלָּה סְעִפֶיהָ
  choice: और उसकी डालियाँ पूरी तरह खा जाता है
  rationale: כלה पूर्ण उपभोग का भाव देता है और סְעִפֶיהָ डालियों को दर्शाता है। हिन्दी रूप क्रिया की पूर्णता स्पष्ट करता है, जबकि स्त्रीलिंग प्रत्यय का संबंध नगर/निवास-स्थान अथवा वहाँ की वनस्पति से बना रहता है।
