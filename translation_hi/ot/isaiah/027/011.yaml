id: ISA.27.11
reference: Isaiah 27:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בִּ/יבֹ֤שׁ קְצִירָ/הּ֙ תִּשָּׁבַ֔רְנָה נָשִׁ֕ים בָּא֖וֹת מְאִיר֣וֹת אוֹתָ֑/הּ כִּ֣י לֹ֤א עַם בִּינוֹת֙ ה֔וּא עַל כֵּן֙ לֹֽא יְרַחֲמֶ֣/נּוּ עֹשֵׂ֔/הוּ וְ/יֹצְר֖/וֹ לֹ֥א יְחֻנֶּֽ/נּוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/011.yaml
  text: When its branches[a] dry up, they are broken; women come and set them on fire. For this is a people without understanding; therefore its Maker will not have compassion on it, and the one who formed it will show it no favor.
translation:
  language: hi
  text: जब उसकी टहनियाँ[a] सूख जाती हैं, तो वे तोड़ दी जाती हैं; स्त्रियाँ आकर उन्हें जला देती हैं। क्योंकि यह ऐसी प्रजा है जिसमें समझ नहीं है; इसलिए उसका बनानेवाला उस पर दया नहीं करेगा, और उसे रचनेवाला उस पर कृपा नहीं करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘वे तोड़ दी जाती हैं’ के लिए बहुवचन क्रिया है, लेकिन ‘जला देती हैं’ का कर्म एकवचन स्त्रीलिंग है। संभवतः टहनियों या वनस्पति को सामूहिक रूप से एक इकाई माना गया है।
    reason: व्याकरण
lexical_decisions:
- source_word: בִּיבֹשׁ
  choice: जब ... सूख जाती हैं
  rationale: ב prefixed form is temporal here. ‘जब ... सूख जाती हैं’ naturally introduces the condition of the vegetation before it is broken and burned.
- source_word: קְצִירָהּ
  choice: उसकी टहनियाँ
  rationale: Though the noun can ordinarily denote harvest or cut growth, the immediate context depicts dried vegetation that is broken and burned; ‘टहनियाँ’ communicates that concrete image clearly.
- source_word: תִּשָּׁבַרְנָה
  choice: वे तोड़ दी जाती हैं
  rationale: The feminine plural passive verb is retained as plural in Hindi and refers to the dried branches.
- source_word: נָשִׁים בָּאוֹת
  choice: स्त्रियाँ आकर
  rationale: This gives the straightforward sequence of women coming and then acting upon the dried vegetation.
- source_word: מְאִירוֹת אוֹתָהּ
  choice: उन्हें जला देती हैं
  rationale: The expression depicts kindling or burning the dried vegetation. Hindi uses a plural object naturally with ‘टहनियाँ’; the Hebrew collective singular object is documented in the footnote.
- source_word: לֹא עַם בִּינוֹת הוּא
  choice: यह ऐसी प्रजा है जिसमें समझ नहीं है
  rationale: This is natural modern Hindi and preserves the source judgment that the people lack understanding without turning it into a claim that they are not a people.
- source_word: לֹא יְרַחֲמֶנּוּ
  choice: उस पर दया नहीं करेगा
  rationale: רחם denotes compassion or mercy; ‘दया’ is clear and idiomatic in this judgment context.
- source_word: עֹשֵׂהוּ
  choice: उसका बनानेवाला
  rationale: This preserves the participial designation of God as the one who made the people in direct, accessible Hindi.
- source_word: וְיֹצְרוֹ
  choice: उसे रचनेवाला
  rationale: ‘रचनेवाला’ retains the distinct forming or fashioning imagery of יצר and keeps it parallel to, but not identical with, עשה.
- source_word: לֹא יְחֻנֶּנּוּ
  choice: उस पर कृपा नहीं करेगा
  rationale: חנן concerns gracious favor. ‘कृपा’ preserves that sense while remaining natural and theologically non-sectarian.
theological_decisions:
- issue: वनस्पति के चित्र में वचन और सामूहिक संदर्भ
  choice: मुख्य पाठ में बहुवचन ‘टहनियाँ ... वे’ रखा गया है, जबकि इब्रानी के सामूहिक एकवचन कर्म का उल्लेख पादटिप्पणी में है।
  alternative: ‘जब उसकी कटाई सूख जाए, तो वह तोड़ दी जाती है; स्त्रियाँ आकर उससे आग जलाती हैं।’
  rationale: The Hebrew combines a feminine plural verb with a feminine singular object, apparently viewing the vegetation both as multiple pieces and as a collective whole. The translation preserves the vivid plural image without concealing the grammatical shift.
- issue: ईश्वरीय न्याय में बनाने और रचने की समानांतर उपाधियाँ
  choice: ‘उसका बनानेवाला’ और ‘उसे रचनेवाला’ दोनों अभिव्यक्तियाँ अलग-अलग रखी गई हैं।
  alternative: दोनों को समेटकर ‘परमेश्वर उस पर दया नहीं करेगा’ कहना।
  rationale: The two Hebrew participles עשה and יצר intentionally present parallel but distinct creator images. Keeping both preserves the theological tension that the people’s own Maker and Former withholds compassion and favor.
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रजा’ सामूहिक जनसमुदाय को व्यक्त करती है, और ‘बनानेवाला/रचनेवाला’ स्रोत की दो समानांतर सृष्टि-संबंधी अभिव्यक्तियों को अलग बनाए रखते हैं।
