  yaml_path: translation/ot/isaiah/055/004.yaml
  text: Behold[a], I have made him a witness to the peoples[c][b], a leader and commander for the peoples.
translation:
  language: hi
  text: देखो, मैंने उसे[a][b] राष्ट्रों[c] के लिए साक्षी, राष्ट्रों का अगुआ और आज्ञा देनेवाला बनाया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने उसे राष्ट्रों के लिए साक्षी के रूप में दिया है।”
    reason: lexical_alternative
  - marker: b
    text: ‘उसे’ से संभवतः दाऊद या दाऊद के वंश के प्रतिनिधि का संकेत है; कुछ पाठक यहाँ मसीह संबंधी संकेत समझते हैं।
    reason: alternative_reading
  - marker: c
    text: या, “जनसमुदायों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह ध्यान आकर्षित करने और कथन पर बल देने वाला संवाद-कण है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए भविष्यद्वाणी की बलपूर्ण शैली बनाए रखता है।
- source_word: עֵד
  choice: साक्षी
  rationale: इस वाक्य-विन्यास में यह अमूर्त ‘गवाही’ नहीं, बल्कि गवाही देने वाले व्यक्ति को दर्शाता है।
- source_word: לְאוּמִּים
  choice: जाति-जाति के लोगों के लिए
  rationale: बहुवचन संज्ञा अलग-अलग जनसमुदायों या राष्ट्रों को दर्शाती है। यह रूप केवल सामान्य बहुवचन ‘लोगों’ की तुलना में उसके सामूहिक-बहुवचन भाव को अधिक स्पष्ट रखता है।
- source_word: נְתַתִּיו
  choice: मैंने उसे … ठहराया है
  rationale: क्रिया का मूल अर्थ ‘मैंने उसे दिया है’ है, पर ‘साक्षी, अगुआ और आज्ञा देनेवाला’ जैसे विधेय पदों के साथ हिन्दी में ‘ठहराया है’ स्वाभाविक रूप से नियुक्ति का भाव व्यक्त करता है और पूर्ण क्रिया की वर्तमान प्रासंगिकता बनाए रखता है।
- source_word: נָגִיד
  choice: अगुआ
  rationale: यह दूसरों पर नेतृत्व के लिए नियुक्त व्यक्ति को दर्शाता है। ‘अगुआ’ व्यापक नेतृत्व व्यक्त करता है; ‘राजकुमार’ राजवंशीय अर्थ को अनावश्यक रूप से सीमित करता और ‘शासक’ बलपूर्वक अधिकार को अधिक उभार सकता है।
- source_word: וּמְצַוֵּה
  choice: और आज्ञा देनेवाला
  rationale: צוה से बना यह कृदंत आज्ञाएँ देने वाले व्यक्ति को दर्शाता है। यह ‘सेनापति’ जैसे केवल सैन्य अर्थ या ‘विधि देनेवाला’ जैसे अधिक विशिष्ट अर्थ को आरोपित नहीं करता।
- source_word: לְאֻמִּים
  choice: जाति-जाति के लोगों का
  rationale: अगुआ और आज्ञा देनेवाले की उन जनसमुदायों से भूमिका-संबंध स्पष्ट करने के लिए सम्बन्धकारक रूप स्वाभाविक है। मूल पाठ की पुनरावृत्ति को हिन्दी में भी बनाए रखा गया है।
theological_decisions:
- issue: पुल्लिंग एकवचन प्रत्यय ‘उसे’ का संदर्भ
  choice: अनुवाद में केवल ‘उसे’ रखा गया है; संदर्भित व्यक्ति का नाम स्पष्ट नहीं किया गया।
  alternative: इसे विशेष रूप से दाऊद, दाऊदी राजा/मसीहा, अथवा व्यक्तिरूप में इस्राएल बताना।
  rationale: निकटवर्ती संदर्भ में दाऊद से की गई वाचा की प्रतिज्ञाएँ आती हैं, इसलिए संकेत दाऊद या उसके दाऊदी प्रतिनिधि की ओर हो सकता है। फिर भी इब्रानी पद स्वयं केवल सर्वनाम रखता है; अतः अनुवाद इस धार्मिक-व्याख्यात्मक संभावना को खुला रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। ‘जाति-जाति के लोगों’ द्वारा לְאוּמִּים का बहु-जनसमुदाय भाव और मूल की पुनरावृत्ति सुरक्षित रखी गई है; ‘आज्ञा देनेवाला’ स्रोत के कृदंत को किसी खास सैन्य या विधायी पद में सीमित नहीं करता।
