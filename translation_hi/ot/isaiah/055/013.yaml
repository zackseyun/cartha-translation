  text: תַּ֤חַת הַֽ/נַּעֲצוּץ֙ יַעֲלֶ֣ה בְר֔וֹשׁ תחת הַ/סִּרְפַּ֖ד יַעֲלֶ֣ה הֲדַ֑ס וְ/הָיָ֤ה לַֽ/יהוָה֙ לְ/שֵׁ֔ם לְ/א֥וֹת עוֹלָ֖ם לֹ֥א יִכָּרֵֽת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/013.yaml
  text: Instead of the thornbush[a], the cypress will come up; instead of the brier, the myrtle will come up. And it will be for Yahweh a name[c][b], an everlasting sign that will not be cut off.
translation:
  language: hi
  text: काँटेदार झाड़ी के स्थान पर सरू का पेड़[a] उगेगा, और बिच्छू-बूटी[b] के स्थान पर मर्टल का पेड़ उगेगा। यह यहोवा के लिए कीर्ति[c] बनेगा—एक चिरस्थायी चिन्ह, जो कभी काटा नहीं जाएगा[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सरू’ के स्थान पर ‘सनौबर’ भी सम्भव है; इब्रानी בְּרוֹשׁ से सूचित वृक्ष की ठीक प्रजाति निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या ‘काँटेदार जंगली झाड़ी’; इब्रानी סִרְפַּד से सूचित पौधे की ठीक पहचान निश्चित नहीं है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘नाम’; यहाँ इसका भाव यश, प्रतिष्ठा या स्मरण से है।
    reason: idiom_clarification
  - marker: d
    text: शाब्दिक रूप से ‘जो काटा नहीं जाएगा’; अर्थात ऐसा चिरस्थायी चिन्ह जो समाप्त नहीं होगा।
    reason: source_metaphor
lexical_decisions:
- source_word: תַּחַת
  choice: के स्थान पर
  rationale: काव्यात्मक समानांतरता में यह स्थान नहीं, बल्कि एक वस्तु के बदले दूसरी वस्तु आने का भाव व्यक्त करता है।
- source_word: הַנַּעֲצוּץ
  choice: काँटेदार झाड़ी
  rationale: शब्द किसी हानिकारक काँटेदार पौधे को सूचित करता है; उसकी ठीक प्रजाति निश्चित नहीं है, इसलिए सामान्य और स्वाभाविक पद चुना गया।
- source_word: בְרוֹשׁ
  choice: सरू का पेड़
  rationale: यह एक शोभायमान सदाबहार वृक्ष है; प्रजाति अनिश्चित होने पर भी ‘सरू’ हिन्दी में सुलभ और प्रचलित समतुल्य है।
- source_word: הַסִּרְפַּד
  choice: बिच्छू-बूटी
  rationale: पौधे की ठीक पहचान अनिश्चित है। ‘बिच्छू-बूटी’ अवांछित चुभने वाले वनस्पति का स्पष्ट चित्र देती है, जबकि विकल्प पादटिप्पणी में रखा गया है।
- source_word: הֲדַס
  choice: मेंहदी का पेड़
  rationale: हिन्दी बाइबलीय प्रयोग में यह मर्टल वृक्ष के लिए परिचित पद है और सामान्य पाठक के लिए सहज है।
- source_word: וְהָיָה
  choice: यह ... बनेगा
  rationale: एकवचन क्रिया पूर्ववर्णित समूचे परिवर्तन और उसके परिणाम को समेटती है।
- source_word: לַיהוָה לְשֵׁם
  choice: यहोवा के लिए कीर्ति बनेगा
  rationale: शाब्दिक ‘नाम’ यहाँ प्रतिष्ठा या यश का मुहावरा है; ‘कीर्ति’ उसका स्वाभाविक हिन्दी अर्थ देता है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: לְאוֹת עוֹלָם
  choice: एक चिरस्थायी चिन्ह
  rationale: यह सार्वजनिक और स्थायी प्रमाण के भाव को स्पष्ट तथा गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: לֹא יִכָּרֵת
  choice: जो कभी मिटाया नहीं जाएगा
  rationale: शाब्दिक काटे जाने की छवि हिन्दी में ‘चिन्ह’ के साथ अस्वाभाविक लगती है; ‘मिटाया नहीं जाएगा’ स्थायी रूप से समाप्त न होने का आशय देता है, और शाब्दिक छवि पादटिप्पणी में दी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है। हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ रूप से इसे सामान्य उपाधि में बदले बिना व्यक्तिगत नाम के रूप में रखा गया है।
- issue: परिवर्तन किसके लिए ‘नाम’ बनेगा
  choice: समूचा वर्णित परिवर्तन यहोवा के लिए कीर्ति बनेगा
  alternative: वृक्ष स्वयं यहोवा का नाम या स्मारक बनेगा
  rationale: एकवचन וְהָיָה पूर्ववर्ती दृश्य को सामूहिक रूप से समेट सकता है। अनुवाद इसी व्यापक संदर्भ को रखता है और किसी एक वृक्ष तक संकेत को सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद की दोहरी प्रतिस्थापन-रचना को बनाए रखा गया है। वनस्पतियों की अनिश्चित पहचान को मुख्य पाठ में अत्यधिक तकनीकी बनाए बिना पादटिप्पणियों में स्पष्ट किया गया है; अंतिम क्रिया की शाब्दिक काटने की छवि भी पादटिप्पणी में संरक्षित है।
