source:
  edition: WLC
  text: הֵ֣ן גּ֤וֹי לֹֽא תֵדַע֙ תִּקְרָ֔א וְ/ג֥וֹי לֹֽא יְדָע֖וּ/ךָ אֵלֶ֣י/ךָ יָר֑וּצוּ לְמַ֨עַן֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/לִ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל כִּ֥י פֵאֲרָֽ/ךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/005.yaml
  text: Behold[a], you will call a nation that you do not know, and a nation that did not know you will run to you, because of Yahweh your God, and the Holy One of Israel[c][b], for he has glorified you.
translation:
  language: hi
  text: देख, तू एक ऐसे राष्ट्र को बुलाएगा जिसे तू नहीं जानता, और ऐसा राष्ट्र जो तुझे नहीं जानता था, तेरे पास दौड़ा आएगा[a]—याहवे, तेरे परमेश्वर, और इस्राएल के पवित्र के कारण[b]; क्योंकि उसने तुझे महिमा दी है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे पास शीघ्र आएगा।”
    reason: lexical_alternative
  - marker: b
    text: या, “तेरे परमेश्वर याहवे और इस्राएल के पवित्र के निमित्त।”
    reason: lexical_alternative
  - marker: c
    text: या, “उसने तुझे सुशोभित किया है” अथवा “उसने तुझे सम्मान दिया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देख
  rationale: यह शब्द जोर देकर ध्यान खींचने वाली भविष्यवाणी की घोषणा आरंभ करता है। ‘देख’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसका बल बनाए रखता है।
- source_word: גּוֹי
  choice: राष्ट्र
  rationale: यह किसी जातीय या राजनीतिक जनसमूह को सूचित करता है। ‘राष्ट्र’ मूल की व्यापकता बनाए रखता है और अनावश्यक रूप से ‘अन्यजाति’ का अर्थ नहीं जोड़ता।
- source_word: לֹא תֵדַע
  choice: जिसे तू नहीं जानता
  rationale: अपूर्ण क्रिया को भविष्य-संबंधी कथन के भीतर वर्तमान अवस्था के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: תִּקְרָא
  choice: तू ... बुलाएगा
  rationale: קרא का सामान्य अर्थ बुलाना या आह्वान करना है। ‘बुलाएगा’ भविष्यकाल और सीधेपन को सुरक्षित रखता है।
- source_word: לֹא יְדָעוּךָ
  choice: जो तुझे नहीं जानता था
  rationale: पूर्ण क्रिया भावी दौड़कर आने से पहले की अपरिचित अवस्था बताती है। हिन्दी में राष्ट्र को सामूहिक एकवचन मानकर वाक्य स्वाभाविक रखा गया है।
- source_word: אֵלֶיךָ יָרוּצוּ
  choice: तेरे पास दौड़ा आएगा
  rationale: רוּץ तेज और प्रत्यक्ष गति दर्शाता है। ‘दौड़ा आएगा’ हिन्दी में लक्ष्य की ओर शीघ्र आने का सजीव भाव देता है।
- source_word: לְמַעַן
  choice: के कारण
  rationale: यहाँ यह राष्ट्र के आने का कारण बताता है। ‘के कारण’ आधुनिक हिन्दी में कारणार्थक संबंध स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम के प्रचलित विद्वत्तापूर्ण उच्चारण का देवनागरी लिप्यंतरण किया गया है; उसके स्थान पर कोई उपाधि नहीं रखी गई।
- source_word: אֱלֹהֶיךָ
  choice: तेरे परमेश्वर
  rationale: सम्बन्धवाचक प्रत्यय सहित पद का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: וְלִקְדוֹשׁ יִשְׂרָאֵל
  choice: और इस्राएल के पवित्र जन
  rationale: संयोजक और पूर्वसर्ग को पिछले कारणार्थक पद के साथ जारी रखा गया है। ‘पवित्र जन’ इस उपाधि के व्यक्तिवाचक अर्थ को सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अगले कथन को राष्ट्र के प्रत्युत्तर के स्पष्टीकरण या आधार के रूप में जोड़ता है।
- source_word: פֵאֲרָךְ
  choice: उसने तुझे महिमा दी है
  rationale: פאר के पिएल रूप में सुशोभित करने, सम्मान देने और महिमान्वित करने का अर्थ-क्षेत्र है। यहाँ ‘महिमा दी है’ सार्वजनिक सम्मान और वैभव दोनों को समेटता है।
theological_decisions:
- issue: द्वितीय पुरुष एकवचन का संदर्भ
  choice: मूल के सीधे द्वितीय पुरुष एकवचन ‘तू/तुझे/तेरे’ को बनाए रखा गया है और संबोधित व्यक्ति की पहचान नहीं बताई गई।
  alternative: संबोधित व्यक्ति को स्पष्ट रूप से सिय्योन/यरूशलेम, इस्राएल, सेवक या दाऊदी शासक कहना।
  rationale: इब्रानी पाठ पुल्लिंग एकवचन में संबोधित करता है, पर इस पद में उसकी पहचान स्पष्ट नहीं करता। अनुवाद में पहचान जोड़ने से वास्तविक व्याख्यात्मक तनाव समाप्त हो जाता।
- issue: याहवे और इस्राएल के पवित्र जन का संबंध
  choice: ‘और’ को बनाए रखते हुए दोनों पदों को एक ही कारणार्थक संरचना में रखा गया है।
  alternative: ‘अर्थात् इस्राएल के पवित्र जन’ कहकर दूसरे पद को स्पष्ट समानाधिकरण बनाना।
  rationale: दोनों उपाधियाँ एक ही परमेश्वर की ओर संकेत करती हैं, फिर भी इब्रानी וְ को स्पष्ट व्याख्यात्मक ‘अर्थात्’ में बदलना आवश्यक नहीं है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘तू’ मूल के द्वितीय पुरुष एकवचन को ठीक से सुरक्षित करता है; इसका प्रयोग यहाँ अनादर के लिए नहीं, बल्कि सीधे एकवचन संबोधन के लिए है। भविष्यवाणी की सजीवता हेतु ‘देख’ और ‘दौड़ा आएगा’ जैसे ठोस पद चुने गए हैं।
