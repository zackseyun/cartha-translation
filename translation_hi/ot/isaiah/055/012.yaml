  edition: WLC
  text: כִּֽי בְ/שִׂמְחָ֣ה תֵצֵ֔אוּ וּ/בְ/שָׁל֖וֹם תּֽוּבָל֑וּ/ן הֶ/הָרִ֣ים וְ/הַ/גְּבָע֗וֹת יִפְצְח֤וּ לִ/פְנֵי/כֶם֙ רִנָּ֔ה וְ/כָל עֲצֵ֥י הַ/שָּׂדֶ֖ה יִמְחֲאוּ כָֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/012.yaml
  text: For you will go out with joy and be led in peace[a]; the mountains and the hills will break out in singing before you[b], and all the trees of the field will clap their hands.
translation:
  language: hi
  text: 'क्योंकि तुम आनंद के साथ निकलोगे,

    और तुम्हें शांति के साथ ले जाया जाएगा[a];

    तुम्हारे आगे पहाड़ और पहाड़ियाँ आनंद से गा उठेंगे[b],

    और मैदान के सभी पेड़ तालियाँ बजाएँगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शांति में तुम्हारी अगुवाई की जाएगी।” इब्रानी क्रिया का अर्थ ‘ले जाया जाना’ या ‘अगुवाई में पहुँचाया जाना’ है; यहाँ ‘बाहर’ शब्द स्पष्ट रूप से नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या “तुम्हारे आगे उल्लास के गीत में फूट पड़ेंगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले निमंत्रण और प्रतिज्ञा से कारण अथवा परिणाम के रूप में जुड़ता है; ‘क्योंकि’ इस संयोजक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְשִׂמְחָה
  choice: आनन्द के साथ
  rationale: בְּ के साथ संज्ञा שִׂמְחָה यहाँ क्रियाविशेषणीय भाव देती है। संज्ञात्मक रूप बनाए रखते हुए यह हिन्दी में स्वाभाविक है।
- source_word: תֵצֵאוּ
  choice: तुम ... निकलोगे
  rationale: יָצָא का सामान्य अर्थ बाहर निकलना या प्रस्थान करना है; यह रूप पुनर्स्थापना और नए निर्गमन की काव्यात्मक पृष्ठभूमि के अनुकूल है।
- source_word: וּבְשָׁלוֹם
  choice: और शान्ति के साथ
  rationale: שָׁלוֹם में शान्ति, कुशलता और समग्र कल्याण का भाव है। ‘शान्ति के साथ’ मूल शब्द की व्यापक प्रतिध्वनि को बिना अनावश्यक विस्तार के सुरक्षित रखता है।
- source_word: תּוּבָלוּן
  choice: तुम्हारी अगुवाई की जाएगी
  rationale: יבל का होफाल रूप ‘ले जाए जाना’ अथवा ‘अगुवाई किया जाना’ दर्शाता है। यह अनुवाद कर्मवाच्य को बनाए रखता है और मूल में न आए ‘बाहर’ को मुख्य पाठ में नहीं जोड़ता।
- source_word: הֶהָרִים וְהַגְּבָעוֹת
  choice: पहाड़ और पहाड़ियाँ
  rationale: यह प्राकृतिक भू-दृश्य की मानक काव्यात्मक जोड़ी है; दोनों शब्दों का सीधा और सहज हिन्दी रूप रखा गया है।
- source_word: יִפְצְחוּ ... רִנָּה
  choice: जयगीत गा उठेंगे
  rationale: פצח और רִנָּה का संयोग उल्लासपूर्ण गीत या जयध्वनि के अचानक फूट पड़ने को व्यक्त करता है। ‘गा उठेंगे’ उस आकस्मिक, प्रबल आरम्भ को सहज हिन्दी में व्यक्त करता है।
- source_word: לִפְנֵיכֶם
  choice: तुम्हारे आगे
  rationale: यह लौटते हुए लोगों के सामने या उनके आगे प्रकृति की प्रतिक्रिया का चित्र प्रस्तुत करता है। यहाँ ‘आगे’ गतिशील प्रसंग के अनुकूल है, जबकि ‘सामने’ भी सम्भव है।
- source_word: וְכָל עֲצֵי הַשָּׂדֶה
  choice: और मैदान के सब पेड़
  rationale: שָׂדֶה यहाँ खुले ग्रामीण भू-भाग को सूचित करता है। ‘मैदान’ सामान्य हिन्दी में काव्यात्मक चित्र को स्पष्ट रखता है।
- source_word: יִמְחֲאוּ כָף
  choice: तालियाँ बजाएँगे
  rationale: यह ताली बजाने का इब्रानी मुहावरा है। पेड़ों के मानवीकरण को सपाट किए बिना हिन्दी का स्वाभाविक मुहावरा अपनाया गया है।
theological_decisions:
- issue: पुनर्स्थापना के चित्र में सृष्टि का काव्यात्मक मानवीकरण
  choice: पहाड़ों, पहाड़ियों और पेड़ों को लोगों के आनन्द में सहभागी मानवीकृत पात्रों के रूप में बनाए रखना
  alternative: प्रकृति की सुन्दरता का अमानवीकृत, सामान्य वर्णन करना
  rationale: इब्रानी कविता जानबूझकर सृष्टि को आनन्द मनाते हुए दिखाती है। यह रूप पुनर्स्थापना की व्यापकता को सुरक्षित रखता है, पर उससे आगे कोई विशिष्ट सिद्धान्त आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर काव्यात्मक गरिमा बनाए रखी गई है। पद की समानान्तर पंक्तियाँ और सृष्टि का मानवीकरण सुरक्षित हैं। ‘अगुवाई की जाएगी’ कर्मवाच्य को स्पष्ट करता है; ‘जयगीत गा उठेंगे’ मूल के आकस्मिक उल्लास को स्वाभाविक हिन्दी में व्यक्त करता है।
