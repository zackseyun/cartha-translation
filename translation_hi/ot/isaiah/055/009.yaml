  text: כִּֽי גָבְה֥וּ שָׁמַ֖יִם מֵ/אָ֑רֶץ כֵּ֣ן גָּבְה֤וּ דְרָכַ/י֙ מִ/דַּרְכֵי/כֶ֔ם וּ/מַחְשְׁבֹתַ֖/י מִ/מַּחְשְׁבֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/009.yaml
  text: For as the heavens are higher than the earth[a], so my ways are higher than your ways[b], and my thoughts than your thoughts.
translation:
  language: hi
  text: क्योंकि जैसे आकाश[a] पृथ्वी से ऊँचा है, वैसे ही मेरे मार्ग तुम्हारे मार्गों से, और मेरे विचार[b] तुम्हारे विचारों से ऊँचे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू शब्द बहुवचन रूप में है और इसका अनुवाद ‘आकाशमण्डल’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस प्रसंग में ‘विचार’ का अर्थ ‘योजनाएँ’ या ‘अभिप्राय’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: גָבְהוּ
  choice: ऊँचा है / ऊँचे हैं
  rationale: संदर्भ में क्रिया ऊँचाई की स्थायी और तुलनात्मक अवस्था बताती है। हिन्दी में कर्ता के वचन के अनुसार ‘ऊँचा है’ और ‘ऊँचे हैं’ किया गया है।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: हिब्रू शब्द रूप की दृष्टि से बहुवचन है, पर आधुनिक मानक हिन्दी में ‘आकाश’ इस दृश्य और काव्यात्मक तुलना का सबसे स्वाभाविक तथा गरिमापूर्ण रूप है।
- source_word: מֵאָרֶץ
  choice: पृथ्वी से
  rationale: यहाँ מִן तुलना सूचित करता है; हिन्दी में ‘से’ उसी तुलनात्मक संबंध को स्पष्ट रखता है।
- source_word: כֵּן
  choice: वैसे ही
  rationale: यह आकाश-पृथ्वी की तुलना को परमेश्वर और मनुष्यों के मार्गों तथा विचारों की तुलना से जोड़ता है।
- source_word: דְרָכַי
  choice: मेरे मार्ग
  rationale: ‘मार्ग’ मूल रूपक को बनाए रखता है और परमेश्वर के कार्य करने के ढंग को बिना संकुचित व्याख्या के व्यक्त करता है।
- source_word: מִדַּרְכֵיכֶם
  choice: तुम्हारे मार्गों से
  rationale: तुलनात्मक מִן को ‘से’ द्वारा व्यक्त करके मूल समानांतरता सुरक्षित रखी गई है।
- source_word: וּמַחְשְׁבֹתַי
  choice: और मेरे विचार
  rationale: מַחֲשָׁבוֹת का अर्थ विचार, योजनाएँ या अभिप्राय हो सकता है। ‘विचार’ व्यापक अर्थ और पिछले पद के साथ शब्दगत संबंध बनाए रखता है।
- source_word: מִמַּחְשְׁבֹתֵיכֶם
  choice: तुम्हारे विचारों से
  rationale: यह अनुवाद तुलना और काव्यात्मक समानांतरता दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर और मनुष्य के सोचने तथा कार्य करने की मानव-सदृश तुलना
  choice: ‘मेरे मार्ग’ और ‘मेरे विचार’ के प्रत्यक्ष रूपकों को बनाए रखा गया है।
  alternative: ‘मेरे कार्य करने के ढंग’ और ‘मेरी योजनाएँ’
  rationale: व्याख्यात्मक विस्तार अर्थ को अनावश्यक रूप से संकीर्ण कर सकता है। मूल रूपक परमेश्वर की महानता और मानवीय सीमा के बीच निहित धर्मवैज्ञानिक तनाव तथा काव्यात्मक प्रभाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। ‘जैसे… वैसे ही’ से मूल उपमा और समानांतर रचना स्पष्ट रहती है; ‘मार्ग’ और ‘विचार’ मूल के व्यापक रूपकों को सुरक्षित रखते हैं।
