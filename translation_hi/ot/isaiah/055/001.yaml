  text: ה֤וֹי כָּל צָמֵא֙ לְכ֣וּ לַ/מַּ֔יִם וַ/אֲשֶׁ֥ר אֵֽין ל֖/וֹ כָּ֑סֶף לְכ֤וּ שִׁבְרוּ֙ וֶֽ/אֱכֹ֔לוּ וּ/לְכ֣וּ שִׁבְר֗וּ בְּ/לוֹא כֶ֛סֶף וּ/בְ/ל֥וֹא מְחִ֖יר יַ֥יִן וְ/חָלָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/001.yaml
  text: Come[a], everyone who is thirsty, come to the waters; and he who has no money, come, buy and eat! Yes[b], come, buy wine and milk without money and without price.
translation:
  language: hi
  text: आओ[a], सभी प्यासे लोगो, जल के पास आओ! और जिनके पास पैसे नहीं हैं, वे भी आओ, खरीदो और खाओ! और आओ, बिना पैसे और बिना दाम के दाखरस और दूध खरीदो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक औपचारिक रूप में, “हो! सभी प्यासे लोगो, जल के पास आओ!”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: अरे
  rationale: यह विस्मयादिबोधक यहाँ विलाप नहीं, बल्कि ध्यान खींचने वाला तात्कालिक आमंत्रण है। ‘अरे’ उसके स्वतंत्र आह्वान-स्वर को बचाता है; अधिक स्वाभाविक हिंदी विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: כָּל צָמֵא
  choice: तुम सब प्यासे लोगो
  rationale: एकवचन विशेषण सामूहिक अर्थ में है। यह संबोधन सार्वभौमिक दायरा और प्रत्यक्ष आमंत्रण दोनों स्पष्ट करता है।
- source_word: לְכוּ
  choice: आओ
  rationale: क्रिया का मूल अर्थ ‘जाओ/चलो’ हो सकता है, पर इस आमंत्रण में हिंदी का ‘आओ’ स्वाभाविक है। हिब्रू की आग्रहपूर्ण पुनरावृत्ति यथासंभव रखी गई है।
- source_word: לַמַּיִם
  choice: पानी के पास
  rationale: हिब्रू में रूप बहुवचन है, जो प्रायः ‘जल/पानी’ के लिए प्रयुक्त होता है। हिंदी में ‘पानी के पास’ स्पष्ट और सहज है; ‘जलधाराओं’ कहना स्रोत से अधिक विशिष्ट होता।
- source_word: וַאֲשֶׁר אֵין לוֹ כָּסֶף
  choice: और जिसके पास पैसा नहीं है, वह भी आए
  rationale: हिब्रू व्याकरणतः पुल्लिंग एकवचन है, पर प्रतिनिधिक सामान्य अर्थ रखता है। हिंदी में ‘जिसके...वह’ स्रोत की एकवचन रचना रखते हुए स्वाभाविक रूप से समावेशी है। ‘भी’ निहित समावेशन को सहज हिंदी में प्रकट करता है।
- source_word: שִׁבְרוּ
  choice: खरीदो
  rationale: भोजन प्राप्त करने के प्रसंग में क्रिया का सामान्य अर्थ ‘खरीदना’ है। वस्तु को अनावश्यक रूप से ‘अनाज’ तक सीमित नहीं किया गया।
- source_word: וֶאֱכֹלוּ
  choice: और खाओ
  rationale: आज्ञार्थक क्रम और साधारण संयोजक को सीधे बनाए रखा गया है।
- source_word: בְּלוֹא כֶסֶף וּבְלוֹא מְחִיר
  choice: बिना पैसे और बिना दाम दिए
  rationale: दोनों समानांतर पदों का भेद रखा गया है। ‘दाम दिए’ हिंदी में स्वाभाविक है और बिना भुगतान प्राप्त करने के विरोधाभासी बाजार-बिंब को स्पष्ट करता है।
- source_word: יַיִן וְחָלָב
  choice: दाखमधु और दूध
  rationale: ठोस पोषण और समृद्धि के बिंब को बिना आध्यात्मिक व्याख्या जोड़े अक्षुण्ण रखा गया है। ‘दाखमधु’ יין का स्पष्ट, गरिमापूर्ण हिंदी रूप है।
theological_decisions:
- issue: सामान्य अर्थ वाला पुल्लिंग एकवचन
  choice: ‘जिसके पास पैसा नहीं है, वह भी आए’
  alternative: ‘जिस किसी के पास पैसा नहीं है, वह आए’
  rationale: यह हिंदी रचना हिब्रू के एकवचन प्रतिनिधिक रूप को बनाए रखती है, पर उसे केवल पुरुषों तक सीमित नहीं करती।
- issue: आर्थिक और पोषण-संबंधी बिंब बनाम आध्यात्मिक भावानुवाद
  choice: ‘खरीदो’, ‘दाखमधु’ और ‘दूध’ जैसे मूर्त शब्द बनाए रखे गए
  alternative: मुफ़्त उद्धार या आत्मिक आशीष को सीधे व्यक्त करने वाला व्याख्यात्मक रूप
  rationale: हिब्रू धर्मवैज्ञानिक अर्थ को बाजार और पोषण के मूर्त काव्यात्मक बिंबों से प्रस्तुत करता है; अनुवाद में उस अर्थ को पहले से खोल देना पाठ के तनाव और चित्रात्मकता को घटाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य हिंदी। ‘अरे’ मूल विस्मयादिबोधक को अलग रखता है, जबकि पाद-टिप्पणी उसका अधिक सहज आमंत्रणात्मक रूप देती है। विराम-चिह्न हिब्रू की तीव्र, आग्रहपूर्ण पुकार को उभारते हैं।
