base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/011.yaml
  text: 'so will my word be that goes out from my mouth: it will not return to me empty[c][b][a], but it will accomplish what I desire and succeed in the purpose for which I sent it.'
translation:
  language: hi
  text: 'उसी प्रकार मेरा वचन, जो मेरे मुँह से निकलता है, होगा: वह निष्फल[a] मेरे पास नहीं लौटेगा, बल्कि जो मैं चाहता हूँ उसे पूरा करेगा और जिस उद्देश्य के लिए मैंने उसे भेजा है उसमें सफल होगा।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “खाली”; अर्थात बिना कोई परिणाम लाए।
    reason: lexical_alternative
  - marker: b
    text: या, “और जिस उद्देश्य के लिए मैंने उसे भेजा है, उसमें फलवन्त होगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: उसी प्रकार
  rationale: यह पिछले पद में वर्षा और हिम के दृष्टांत से स्पष्ट तुलना जोड़ता है; ‘उसी प्रकार’ तुलनात्मक बल को सहज हिन्दी में बनाए रखता है।
- source_word: יִהְיֶה דְבָרִי
  choice: मेरा वचन होगा
  rationale: भविष्यसूचक अर्थ और दैवी कथन की गरिमा सुरक्षित रहती है।
- source_word: דְבָרִי
  choice: मेरा वचन
  rationale: ‘वचन’ דָּבָר के कथन/संदेश संबंधी व्यापक अर्थ और दैवी वाणी की साहित्यिक प्रतिध्वनि को सुरक्षित रखता है।
- source_word: אֲשֶׁר יֵצֵא מִפִּי
  choice: मेरे मुँह से निकलने वाला
  rationale: दैवी उच्चारण के ठोस बिंब और יצא के सामान्य अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לֹא יָשׁוּב אֵלַי רֵיקָם
  choice: वह निष्फल मेरे पास नहीं लौटेगा
  rationale: רֵיקָם का आशय ‘बिना परिणाम’ है; ‘निष्फल’ हिन्दी में इस प्रसंग का अर्थ स्पष्ट करता है, जबकि लौटने का मूल बिंब भी बना रहता है।
- source_word: כִּי אִם
  choice: बल्कि
  rationale: नकार के बाद आने वाले प्रबल विरोध—‘नहीं..., बल्कि...’—को स्पष्ट रूप से व्यक्त करता है।
- source_word: עָשָׂה אֵת אֲשֶׁר חָפַצְתִּי
  choice: मेरी इच्छा पूरी करेगा
  rationale: हिब्रू का शाब्दिक भाव ‘जो मैंने चाहा, वह करेगा’ है; यह रूप स्वाभाविक हिन्दी में दैवी अभिलाषा और उसके पूर्ण होने दोनों को व्यक्त करता है।
- source_word: וְהִצְלִיחַ
  choice: सफल होगा
  rationale: क्रिया के सफल होने/सिद्ध होने के अर्थ को बिना भौतिक समृद्धि का संकेत दिए स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲשֶׁר שְׁלַחְתִּיו
  choice: जिस काम के लिए मैंने उसे भेजा है, उसमें
  rationale: हिब्रू संबंधवाचक रचना में निहित लक्ष्य को सहज हिन्दी में स्पष्ट करता है, बिना किसी अतिरिक्त धर्मवैज्ञानिक अवधारणा को जोड़े।
theological_decisions:
- issue: ‘मेरा वचन’ का संभावित व्यक्तिकरण
  choice: इसे परमेश्वर की प्रभावकारी कही हुई वाणी के रूप में रखा गया है, स्पष्ट व्यक्तिगत उपाधि के रूप में नहीं।
  alternative: व्यापक बाइबलीय धर्मविज्ञान के आधार पर इसे देहधारण-पूर्व पुत्र से सीधे जोड़ना।
  rationale: यशायाह 55 के निकट संदर्भ में वर्षा और हिम के दृष्टांत द्वारा परमेश्वर की कही हुई बात की प्रभावशीलता दिखाई गई है; मूल हिब्रू यहाँ स्पष्ट मसीह-विषयक उपाधि की माँग नहीं करता।
- issue: दैवी वचन की प्रभावशीलता और मानवीय प्रत्युत्तर
  choice: वचन के निश्चित रूप से फलदायी होने को दृढ़ता से व्यक्त किया गया है, पर नियतिवादी या संप्रदायगत भाषा नहीं जोड़ी गई।
  alternative: इसे ‘अप्रतिरोध्य आदेश’ अथवा केवल ‘प्रेरक संदेश’ जैसे अधिक धर्मसैद्धांतिक शब्दों में समझाना।
  rationale: हिब्रू कहता है कि वचन निष्फल नहीं लौटता, बल्कि परमेश्वर की इच्छा पूरी करता और अपने भेजे जाने के काम में सफल होता है; अनुवाद इसी दावे तक सीमित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण धार्मिक गद्य। ‘वचन’ पारंपरिक होने पर भी सामान्य पाठकों के लिए बोधगम्य है। वाक्य में पिछले पद से तुलना, दैवी वाणी का बिंब और उसके निश्चित परिणाम—तीनों सुरक्षित रखे गए हैं।
