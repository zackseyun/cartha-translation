source:
  edition: WLC
  text: דִּרְשׁ֥וּ יְהוָ֖ה בְּ/הִמָּצְא֑/וֹ קְרָאֻ֖/הוּ בִּֽ/הְיוֹת֥/וֹ קָרֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/006.yaml
  text: Seek Yahweh while he may be found[a]; call on him while he is near.
translation:
  language: hi
  text: याहवे को खोजो, जब तक वे मिल सकते हैं[a]; जब तक वे निकट हैं, उन्हें पुकारो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जब वे मिलते हैं।’
    reason: מצא के infinitive रूप को उपलब्धता (‘मिल सकते हैं’) या अधिक शाब्दिक कालवाचक अर्थ (‘मिलते हैं’) में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: खोजो
  rationale: आज्ञार्थक रूप यहाँ परमेश्वर की ओर मुड़ने, उन्हें पाने की इच्छा रखने और उनकी शरण लेने का आह्वान करता है। ‘खोजो’ संक्षिप्त, स्वाभाविक और मूल exhortation की शक्ति को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; इसलिए किसी उपाधि से बदलने के बजाय उसका प्रचलित लिप्यंतरण ‘याहवे’ रखा गया है।
- source_word: בְּהִמָּצְאוֹ
  choice: जब तक उन्हें पाया जा सकता है
  rationale: בְּ के साथ מצא का infinitive construct यहाँ समय और वर्तमान अवसर का बोध देता है। यह हिंदी वाक्यांश उस तात्कालिकता को स्वाभाविक ढंग से व्यक्त करता है, यद्यपि मूल को अधिक शाब्दिक रूप से ‘उनके पाए जाने के समय’ भी समझा जा सकता है।
- source_word: קְרָאֻהוּ
  choice: उन्हें पुकारो
  rationale: इस संदर्भ में קרא किसी व्यक्ति को पुकारने अथवा सहायता और प्रार्थना में उसका आह्वान करने का अर्थ देता है। ‘उन्हें पुकारो’ दोनों अर्थों को खुला रखता है।
- source_word: בִּהְיוֹתוֹ
  choice: जब तक वे हैं
  rationale: בְּ और היה का infinitive construct कालवाचक है। हिंदी में ‘जब तक’ समानांतर पंक्तियों और अवसर की तात्कालिकता को बनाए रखता है।
- source_word: קָרוֹב
  choice: निकट
  rationale: ‘निकट’ स्थानगत समीपता के साथ उपलब्धता और संबंधगत समीपता की अनुगूँज भी बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: पद में चार-अक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसे उपाधि में बदले बिना नाम के रूप में सुरक्षित रखता है।
- issue: בְּהִמָּצְאוֹ में उपलब्ध अवसर का भाव
  choice: जब तक उन्हें पाया जा सकता है
  alternative: जब वे पाए जाते हैं
  rationale: मुख्य पाठ स्वाभाविक हिंदी में सीमित वर्तमान अवसर और तात्कालिकता व्यक्त करता है, जबकि पादटिप्पणी उस अधिक शाब्दिक कालवाचक संभावना को सुरक्षित रखती है; यह नहीं बताया गया कि परमेश्वर स्वयं अनिश्चित हैं या मनुष्य की खोज निर्णायक कारण है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण आज्ञार्थक शैली रखी गई है। परमेश्वर के लिए आदरसूचक बहुवचन सर्वनाम ‘वे/उन्हें’ और ‘हैं’ प्रयुक्त हैं। दोनों समानांतर खंडों में ‘जब तक’ अवसर की तात्कालिकता को उभारता है।
