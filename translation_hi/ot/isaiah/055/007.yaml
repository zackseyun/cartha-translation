source:
  edition: WLC
  text: יַעֲזֹ֤ב רָשָׁע֙ דַּרְכּ֔/וֹ וְ/אִ֥ישׁ אָ֖וֶן מַחְשְׁבֹתָ֑י/ו וְ/יָשֹׁ֤ב אֶל יְהוָה֙ וִֽ/ירַחֲמֵ֔/הוּ וְ/אֶל אֱלֹהֵ֖י/נוּ כִּֽי יַרְבֶּ֥ה לִ/סְלֽוֹחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/007.yaml
  text: Let the wicked man forsake his way[a], and the man of iniquity his thoughts; let him return to Yahweh, and he will have compassion on him, and to our God[e][d][c][b], for he will abundantly pardon.
translation:
  language: hi
  text: दुष्ट अपना मार्ग छोड़ दे, और अधर्मी अपने विचार; वह याहवे[a] के पास लौट आए[b], और वह उस पर दया करेगा; और वह हमारे परमेश्वर के पास लौट आए, क्योंकि परमेश्वर बहुतायत से क्षमा करता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का नाम YHWH है।
    reason: alternative_reading
  - marker: b
    text: या, “वापस मुड़े”; भावार्थ में, “मन फिराए।”
    reason: lexical_alternative
  - marker: c
    text: या, “उदारता से क्षमा करता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲזֹב
  choice: छोड़ दे
  rationale: यहाँ क़ाल अपूर्ण क्रिया उपदेशात्मक भाव में है। ‘छोड़ दे’ पापपूर्ण मार्ग और विचारों को जान-बूझकर त्यागने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: यह शब्द संज्ञा के रूप में प्रयुक्त है और एक प्रतिनिधि व्यक्ति को दर्शाता है। हिन्दी में ‘दुष्ट’ इसी तरह स्वाभाविक रूप से संज्ञा-सदृश प्रयुक्त हो सकता है।
- source_word: דַּרְכּוֹ
  choice: अपनी चाल
  rationale: ‘चाल’ जीवन के मार्ग या आचरण की इब्रानी रूपक-छवि को बनाए रखती है; इसे केवल ‘कामों’ तक सीमित नहीं करती।
- source_word: אִישׁ אָוֶן
  choice: अधर्मी
  rationale: इस नैतिक संदर्भ में אָוֶן बुराई या अधर्म को दर्शाता है। ‘अधर्मी’ समानांतर पंक्ति में स्वाभाविक और सुबोध है, जबकि अत्यधिक शाब्दिक ‘अधर्म का मनुष्य’ आधुनिक हिन्दी में असहज होगा।
- source_word: מַחְשְׁבֹתָיו
  choice: अपने विचार
  rationale: यह शब्द विचारों, अभिप्रायों या योजनाओं को व्यक्त कर सकता है। ‘विचार’ बाहरी ‘चाल’ के समानांतर भीतरी जीवन को व्यापक रूप से दर्शाता है।
- source_word: וְיָשֹׁב
  choice: लौट आए
  rationale: שׁוּב का मूल स्थानिक और संबंधपरक रूपक सुरक्षित रखा गया है। ‘मन फिराए’ की तुलना में यह किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को सीधे पाठ में नहीं थोपता।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह परमेश्वर के व्यक्तिगत नाम YHWH का हिन्दी लिप्यंतरण है; मूल पाठ में आए नाम को किसी उपाधि से नहीं बदला गया।
- source_word: וִירַחֲמֵהוּ
  choice: और वह उस पर दया करेगा
  rationale: רחם की करुणा और दया की व्यक्तिगत भावना बनी रहती है। उपदेश के बाद आई अपूर्ण क्रिया को परिणामस्वरूप प्रतिज्ञा के रूप में व्यक्त किया गया है।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: प्रथम पुरुष बहुवचन प्रत्यय को बनाए रखकर नबी की सामुदायिक और वाचागत वाणी सुरक्षित रखी गई है।
- source_word: כִּי יַרְבֶּה לִסְלוֹחַ
  choice: क्योंकि वह भरपूर क्षमा करेगा
  rationale: רבה के तीव्रतासूचक भाव को ‘भरपूर’ स्वाभाविक हिन्दी में व्यक्त करता है और क्षमा की प्रचुरता पर बल बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम सीधे उपस्थित है। ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: שׁוּב को स्पष्ट धर्मवैज्ञानिक शब्द से व्यक्त करना
  choice: लौट आए
  alternative: मन फिराए; पश्चाताप करे
  rationale: पद स्वयं दुष्ट चाल और विचार छोड़ने की बात करता है, पर क्रिया का प्रत्यक्ष रूपक परमेश्वर के पास लौटना है। चुना गया रूप उस व्यापक संबंधपरक अर्थ और धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
- issue: दो समानांतर गंतव्यों की हिन्दी संरचना
  choice: ‘वह हमारे परमेश्वर के पास लौट आए’ में क्रिया को दोहराना
  alternative: ‘और हमारे परमेश्वर के पास’ को बिना क्रिया के छोड़ना
  rationale: इब्रानी में ‘लौटे’ क्रिया याहवे और हमारे परमेश्वर—दोनों समानांतर पदों को नियंत्रित करती है। हिन्दी में क्रिया दोहराने से संबंध स्पष्ट होता है और कोई नया अर्थ नहीं जोड़ा जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘चाल/विचार’ का बाहरी और भीतरी समानांतरपन तथा ‘याहवे/हमारे परमेश्वर’ की समानांतर संरचना सुरक्षित है। दूसरे गंतव्य के साथ ‘लौट आए’ दोहराना हिन्दी की स्पष्टता के लिए आवश्यक पूर्ति है।
