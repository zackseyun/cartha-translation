base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/010.yaml
  text: For just as the rain and the snow come down from heaven and do not return there unless they have watered the earth[a], made it bear fruit, and made it sprout, and have given seed to the sower and bread to the eater[b],
translation:
  language: hi
  text: क्योंकि जिस प्रकार वर्षा और हिम आकाश[a] से उतरते हैं और वहाँ तब तक नहीं लौटते, जब तक वे धरती को सींचकर उसे फलवती न कर दें और उसमें अंकुर न उगाएँ,[b] और बोनेवाले को बीज तथा खानेवाले को रोटी न दें,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आकाशों’। इब्रानी शब्द שָׁמַיִם रूप की दृष्टि से बहुवचन है और सन्दर्भ के अनुसार ‘आकाश’, ‘आकाशों’ या ‘नभ’ का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसे उपज देनेवाली बना दें और उसमें अंकुर उगाएँ’। दोनों इब्रानी क्रियाएँ धरती पर वर्षा और हिम के फलदायक प्रभाव पर बल देती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כַּאֲשֶׁר
  choice: क्योंकि जिस प्रकार
  rationale: כִּי के कारणसूचक बल और כַּאֲשֶׁר के तुलनात्मक बल—दोनों को सुरक्षित रखता है और अगले पद के ‘उसी प्रकार’ के लिए स्वाभाविक भूमिका बनाता है।
- source_word: יֵרֵד הַגֶּשֶׁם וְהַשֶּׁלֶג
  choice: वर्षा और हिम ... उतरते हैं
  rationale: ירד की नीचे आने की दिशात्मक छवि को बनाए रखते हुए आधुनिक हिन्दी में संयुक्त कर्ता के साथ स्वाभाविक बहुवचन प्रयोग किया गया है।
- source_word: מִן הַשָּׁמַיִם
  choice: आकाश से
  rationale: सन्दर्भ में שָׁמַיִם वर्षा और हिम के आने के स्थान, अर्थात आकाश, को दर्शाता है; हिन्दी में एकवचन सामूहिक रूप सबसे स्वाभाविक है।
- source_word: וְשָׁמָּה לֹא יָשׁוּב כִּי אִם
  choice: और वहाँ तब तक नहीं लौटते, जब तक
  rationale: שָׁמָּה को स्पष्ट रूप से ‘वहाँ’ कहा गया है और כִּי אִם की अपवाद/सीमा की भावना को स्वाभाविक हिन्दी ‘तब तक नहीं…जब तक’ से व्यक्त किया गया है।
- source_word: הִרְוָה אֶת הָאָרֶץ
  choice: धरती को सींचकर
  rationale: רוה के हिफ़ील रूप का अर्थ धरती को पर्याप्त जल देना है; ‘सींचना’ कृषि-बिम्ब और कारक अर्थ दोनों को स्पष्ट रखता है।
- source_word: וְהוֹלִידָהּ וְהִצְמִיחָהּ
  choice: उसे फलवती न कर दें और उसमें अंकुर न उगाएँ
  rationale: दोनों कारक क्रियाओं को अलग रखते हुए पहली में धरती की उपज देने की क्षमता और दूसरी में वास्तविक अंकुरण की जीवंत कृषि-छवि व्यक्त होती है।
- source_word: וְנָתַן זֶרַע לַזֹּרֵעַ וְלֶחֶם לָאֹכֵל
  choice: और बोनेवाले को बीज तथा खानेवाले को रोटी न दें
  rationale: मूल का समानांतर विन्यास और ठोस शब्द ‘बीज’ तथा ‘रोटी’ सुरक्षित रखे गए हैं।
