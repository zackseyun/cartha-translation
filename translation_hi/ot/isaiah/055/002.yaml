source:
  edition: WLC
  text: לָ֤/מָּה תִשְׁקְלוּ כֶ֨סֶף֙ בְּֽ/לוֹא לֶ֔חֶם וִ/יגִיעֲ/כֶ֖ם בְּ/ל֣וֹא לְ/שָׂבְעָ֑ה שִׁמְע֨וּ שָׁמ֤וֹעַ אֵלַ/י֙ וְ/אִכְלוּ ט֔וֹב וְ/תִתְעַנַּ֥ג בַּ/דֶּ֖שֶׁן נַפְשְׁ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/002.yaml
  text: Why do you weigh out silver for what is not bread[a], and your labor for what does not satisfy? Listen carefully to me, and eat what is good[c][b], and let your soul delight itself in richness.
translation:
  language: hi
  text: तुम उस चीज़ के लिए चाँदी क्यों तौलते हो जो रोटी नहीं है[a], और अपनी मेहनत उस चीज़ के लिए क्यों लगाते हो जिससे तृप्ति नहीं मिलती? मेरी बात ध्यान से सुनो[b] और जो अच्छा है उसे खाओ; तुम्हारा प्राण समृद्धि में आनंद पाए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पैसा क्यों खर्च करते हो”; इब्रानी में शाब्दिक अर्थ “चाँदी क्यों तौलते हो” है, क्योंकि प्राचीन समय में भुगतान के लिए चाँदी वजन से तौली जाती थी।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “सुनो, मेरी बात अवश्य सुनो”; इब्रानी रचना आज्ञा पर विशेष बल देती है।
    reason: lexical_alternative
  - marker: c
    text: या “तुम्हारा प्राण पुष्ट भोजन में आनंद पाए” अथवा “बहुलता में आनंद पाए”; इब्रानी शब्द का शाब्दिक भाव चिकनाई, समृद्धि और भरपूरी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁקְלוּ כֶסֶף
  choice: चाँदी तौलते हो
  rationale: शाब्दिक प्राचीन आर्थिक बिंब को सुरक्षित रखता है, जब भुगतान के लिए चाँदी वजन से तौली जाती थी; पादटिप्पणी आधुनिक अर्थ ‘पैसा खर्च करना’ स्पष्ट करती है।
- source_word: בְּלוֹא לֶחֶם
  choice: उस चीज़ के लिए ... जो रोटी नहीं है
  rationale: नकारात्मक संज्ञा-वाक्यांश और रोटी के ठोस रूपक दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וִיגִיעֲכֶם
  choice: अपनी मेहनत ... लगाते हो
  rationale: יְגִיעַ मेहनत, परिश्रम अथवा उसके फल का बोध करा सकता है। ‘मेहनत लगाना’ इस व्यापकता को काफी हद तक रखता है और पहले प्रश्न के समानांतर है।
- source_word: לְשָׂבְעָה
  choice: जिससे तृप्ति नहीं मिलती
  rationale: שָׂבְעָה की भरपेट होने या तृप्ति की धारणा को आधुनिक हिन्दी में स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: ध्यान से सुनो
  rationale: आज्ञार्थक क्रिया के साथ infinitive absolute से आई तीव्रता को अस्वाभाविक पुनरुक्ति के बिना व्यक्त करता है; पादटिप्पणी शाब्दिक संरचना बताती है।
- source_word: וְאִכְלוּ טוֹב
  choice: जो अच्छा है उसे खाओ
  rationale: טוֹב के संज्ञावत प्रयोग को स्वाभाविक हिन्दी में व्यक्त करते हुए उसके व्यापक ‘अच्छा’ अर्थ और भोजन-बिंब को बनाए रखता है।
- source_word: וְתִתְעַנַּג ... נַפְשְׁכֶם
  choice: तुम्हारा प्राण ... आनन्दित हो
  rationale: स्त्रीलिंग एकवचन क्रिया का कर्ता נֶפֶשׁ है। ‘प्राण’ काव्यात्मक और समझने योग्य है तथा पूरे व्यक्ति/अंतरात्मिक जीवन के भाव को अत्यधिक संकीर्ण नहीं करता।
- source_word: בַּדֶּשֶׁן
  choice: भरपूरी से
  rationale: דֶּשֶׁן का मूल बिंब चिकनाई या पुष्ट भोजन और उससे निकला समृद्धि/बहुलता का भाव है। ‘भरपूरी’ आधुनिक हिन्दी में प्रसंगानुकूल है; पादटिप्पणी मूल बिंब सुरक्षित करती है।
theological_decisions:
- issue: पोषण के रूपक का आशय
  choice: ‘रोटी,’ ‘खाओ,’ और ‘तृप्ति’ के ठोस भोजन-बिंब को यथावत रखा गया है।
  alternative: इसे मुख्य पाठ में सीधे ‘आत्मिक पोषण’ या ‘आत्मिक संतोष’ कहना।
  rationale: इब्रानी पाठ स्वयं ठोस आमंत्रणात्मक रूपक देता है; उसका आध्यात्मिक आशय स्पष्ट करके जोड़ना अनुवाद में व्याख्या आयात करता और काव्यात्मक तनाव घटाता।
- issue: נֶפֶשׁ का अर्थ-क्षेत्र
  choice: ‘तुम्हारा प्राण’
  alternative: ‘तुम्हारी आत्मा’ अथवा ‘तुम स्वयं’
  rationale: נֶפֶשׁ आत्मा, जीवन, प्राण या स्वयं व्यक्ति को सूचित कर सकता है। ‘प्राण’ काव्यात्मक संदर्भ में व्यापक अर्थ रखता है और इसे केवल अमूर्त, शरीर-विरहित ‘आत्मा’ तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर यशायाह की काव्यात्मक गरिमा के लिए ‘चाँदी तौलते,’ ‘तृप्ति,’ और ‘प्राण’ जैसे पद रखे गए हैं। संबोधन बहुवचन ‘तुम’ है। विरामचिह्नों से दो अलंकारिक प्रश्नों और फिर आने वाले आग्रह को स्पष्ट किया गया है।
