  text: הַטּ֤וּ אָזְנְ/כֶם֙ וּ/לְכ֣וּ אֵלַ֔/י שִׁמְע֖וּ וּ/תְחִ֣י נַפְשְׁ/כֶ֑ם וְ/אֶכְרְתָ֤ה לָ/כֶם֙ בְּרִ֣ית עוֹלָ֔ם חַֽסְדֵ֥י דָוִ֖ד הַ/נֶּאֱמָנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/003.yaml
  text: Incline your ear and come to me; hear[a], and your soul shall live; and I will make with you an everlasting covenant—the faithful covenant love promised to David.
translation:
  language: hi
  text: अपना कान मेरी ओर झुकाओ और मेरे पास आओ; सुनो, ताकि तुम्हारा प्राण जीवित रहे। मैं तुम्हारे साथ सदा की वाचा बाँधूँगा—दाऊद को दी गई अटल कृपाएँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दाऊद की पक्की करुणाएँ,” “दाऊद से की गई अटल प्रेमपूर्ण प्रतिज्ञाएँ,” अथवा “दाऊद से संबंधित विश्वसनीय निष्ठावान प्रेम।” इब्रानी חֶסֶד में वाचा का निष्ठावान प्रेम, कृपा और करुणा जैसे भाव आते हैं; ‘दाऊद’ के साथ इसका व्याकरणिक संबंध एक से अधिक प्रकार से समझा जा सकता है।
    reason: חַסְדֵי דָוִד הַנֶּאֱמָנִים के शब्दार्थगत और संबंधकारक विकल्पों को सुरक्षित रखना।
lexical_decisions:
- source_word: הַטּוּ אָזְנְכֶם
  choice: अपना कान लगाओ
  rationale: ‘कान लगाना’ आधुनिक हिन्दी का स्वाभाविक मुहावरा है, जो ध्यान से सुनने के लिए कान झुकाने के इब्रानी रूपक को बनाए रखता है।
- source_word: וּלְכוּ אֵלַי
  choice: और मेरे पास आओ
  rationale: वक्ता की ओर आने के निमंत्रण के संदर्भ में הלך אֶל का स्वाभाविक अर्थ ‘मेरे पास आओ’ है।
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: यह श्रवण के साथ ग्रहणशील प्रत्युत्तर का संकेत दे सकता है; ‘सुनो’ उस व्यापकता को ‘आज्ञा मानो’ कहकर अनावश्यक रूप से सीमित नहीं करता।
- source_word: וּתְחִי נַפְשְׁכֶם
  choice: और तुम्हारा प्राण जीवित रहेगा
  rationale: यह इब्रानी वाक्य-क्रम और परिणामसूचक बल को रखता है तथा נֶפֶשׁ को केवल ‘तुम’ में विलीन न करके ‘प्राण’ के रूप में व्यक्त करता है।
- source_word: וְאֶכְרְתָה לָכֶם בְּרִית
  choice: मैं तुम्हारे साथ ... वाचा बाँधूँगा
  rationale: כרת ברית के स्थापित वाचागत मुहावरे का हिन्दी समतुल्य ‘वाचा बाँधना’ है; ‘तुम्हारे साथ’ संबंध को स्पष्ट रखता है।
- source_word: בְּרִית עוֹלָם
  choice: सदा की वाचा
  rationale: यह עוֹלָם के स्थायी, अनवरत वाचागत भाव को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: חַסְדֵי דָוִד הַנֶּאֱמָנִים
  choice: दाऊद से प्रतिज्ञा किया गया अटल प्रेम
  rationale: חֶסֶד को वाचा के संदर्भ में निष्ठावान, कृपालु प्रेम के रूप में और נֶאֱמָנִים को उसकी निश्चितता तथा भरोसेमंदी के रूप में व्यक्त किया गया है। ‘दाऊद से प्रतिज्ञा किया गया’ यहाँ दाऊद-संबंधी अनुग्रह को परमेश्वर की विश्वसनीय वाचागत प्रतिज्ञा समझता है, जबकि वैकल्पिक व्याकरणिक रूपों को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘दाऊद की/के חַסְדֵי’ और सदा की वाचा का संबंध
  choice: इसे दाऊद से प्रतिज्ञा किए गए परमेश्वर के भरोसेमंद वाचागत प्रेम के रूप में प्रस्तुत किया गया है, जो अब श्रोताओं से बाँधी जाने वाली वाचा से जोड़ा गया है।
  alternative: ‘दाऊद की पक्की करुणाएँ,’ ‘दाऊद को दी गई अटल कृपाएँ,’ या दाऊद द्वारा किए गए निष्ठापूर्ण कार्य।
  rationale: संदर्भ में परमेश्वर स्वयं वाचा बाँधने की घोषणा करते हैं, इसलिए वाक्यांश को दाऊद से संबंधित विश्वसनीय वाचागत अनुग्रह समझना सबसे संभावित है। फिर भी इब्रानी संबंधकारक और חֶסֶד की अर्थ-व्याप्ति पूरी तरह एकार्थी नहीं है, अतः विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘अपना कान लगाओ,’ ‘प्राण,’ और ‘वाचा बाँधूँगा’ मूल के रूपक तथा वाचागत स्वर को बनाए रखते हैं; कठिन अंतिम पदबंध को मुख्य पाठ में सुबोध रखा गया है और उसकी वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
