source:
  edition: WLC
  text: כִּ֣י לֹ֤א מַחְשְׁבוֹתַ/י֙ מַחְשְׁב֣וֹתֵי/כֶ֔ם וְ/לֹ֥א דַרְכֵי/כֶ֖ם דְּרָכָ֑/י נְאֻ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/008.yaml
  text: For my thoughts are not your thoughts[a], and your ways are not my ways, declares Yahweh.
translation:
  language: hi
  text: क्योंकि मेरे विचार तुम्हारे विचार नहीं हैं[a], और न तुम्हारे मार्ग मेरे मार्ग हैं—यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि मेरी योजनाएँ तुम्हारी योजनाएँ नहीं हैं, और तुम्हारे मार्ग मेरे मार्ग नहीं हैं।” ‘विचार’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ ‘योजनाएँ’ या ‘अभिप्राय’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले आह्वान का कारण या आधार प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इसके व्याख्यात्मक-कारणसूचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מַחְשְׁבוֹתַי / מַחְשְׁבוֹתֵיכֶם
  choice: मेरे विचार / तुम्हारे विचार
  rationale: מַחֲשָׁבָה का अर्थ विचार, योजना या अभिप्राय हो सकता है। ‘विचार’ मूल की पुनरावृत्ति और व्यापक अर्थ-क्षेत्र को बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: דַרְכֵיכֶם / דְּרָכָי
  choice: तुम्हारे मार्ग / मेरे मार्ग
  rationale: ‘मार्ग’ मूल रूपक को बनाए रखते हुए चाल-चलन, जीवन-पद्धति और कार्य-विधि की सांकेतिक व्यापकता भी व्यक्त करता है।
- source_word: לֹא ... וְלֹא
  choice: नहीं हैं ... और न ... हैं
  rationale: इब्रानी की संतुलित नकारात्मक समानांतर रचना को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: נְאֻם की गंभीर भविष्यवाणी-सूचक उक्ति को वर्तमान, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुराक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
theological_decisions:
- issue: מַחְשְׁבוֹת को केवल मानसिक ‘विचार’ मानना या योजनाओं/अभिप्रायों को भी शामिल समझना
  choice: मुख्य पाठ में ‘विचार’, पादटिप्पणी में ‘योजनाएँ’ और ‘अभिप्राय’
  alternative: मुख्य पाठ में ‘योजनाएँ’
  rationale: इब्रानी शब्द का अर्थ-क्षेत्र व्यापक है। मुख्य पाठ में ‘विचार’ समानांतर पुनरावृत्ति और अस्पष्टता बनाए रखता है, जबकि पादटिप्पणी उसके योजनात्मक अर्थ को सामने लाती है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है; लिप्यंतरण उसे किसी उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक समानांतरता, गंभीर भविष्यवाणीपरक स्वर और मूल की अर्थगत व्यापकता सुरक्षित रखी गई है। ‘तुम्हारे’ का प्रयोग बहुवचन संबोधन के अनुरूप है।
