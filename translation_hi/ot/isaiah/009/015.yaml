reference: Isaiah 9:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּֽהְי֛וּ מְאַשְּׁרֵ֥י הָֽ/עָם הַ/זֶּ֖ה מַתְעִ֑ים וּ/מְאֻשָּׁרָ֖י/ו מְבֻלָּעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/015.yaml
  text: And the guides of this people have become those who lead them astray[a], and those guided by them are swallowed up.
translation:
  language: hi
  text: और इस प्रजा के अगुवे उसे भटकानेवाले हो गए हैं[a], और उनके मार्गदर्शन में रहनेवाले निगले जा रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और इस प्रजा को धन्य कहनेवाले उसे भटका रहे हैं, और जिन्हें वे धन्य कहते हैं, वे निगले जा रहे हैं।” אשר से बने इब्रानी शब्द-रूपों का सम्बन्ध किसी को धन्य कहने से भी समझा जा सकता है, यद्यपि सन्दर्भ ‘अगुवों’ और ‘उनके मार्गदर्शन में रहनेवालों’ के अर्थ का भी समर्थन करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: हो गए हैं
  rationale: यह रूप एक परिणामी अवस्था को व्यक्त करता है; ‘हो गए हैं’ परिवर्तन और वर्तमान परिणाम दोनों को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: מְאַשְּׁרֵי
  choice: अगुवे
  rationale: सन्दर्भ में यह कृदन्त उन लोगों को सूचित करता है जो प्रजा को राह दिखाते या उसका नेतृत्व करते हैं। ‘अगुवे’ सामान्य, गरिमापूर्ण और अगले पद ‘भटकानेवाले’ के साथ विडंबनापूर्ण विरोध को स्पष्ट रखता है।
- source_word: הָעָם הַזֶּה
  choice: इस प्रजा
  rationale: עַם के लिए ‘प्रजा’ भविष्यद्वाणी के सन्दर्भ में स्वाभाविक है और संकेतवाचक ‘इस’ को बनाए रखता है।
- source_word: מַתְעִים
  choice: उसे भटकानेवाले
  rationale: תעה का हिफ़ील कृदन्त कारणवाचक है—दूसरों को मार्ग से भटकाना। एकवचन सामूहिक ‘प्रजा’ का निर्देश ‘उसे’ से स्पष्ट होता है।
- source_word: וּמְאֻשָּׁרָיו
  choice: जिनकी वे अगुवाई करते हैं
  rationale: निष्क्रिय कृदन्त का आशय अगुवों से मार्गदर्शन पानेवालों से है। हिन्दी में सक्रिय सम्बन्धवाचक रचना अधिक स्वाभाविक है और आशय को बिना अतिरिक्त व्याख्या के स्पष्ट करती है।
- source_word: מְבֻלָּעִים
  choice: निगल लिए गए हैं
  rationale: בלע की सजीव रूपकात्मक छवि को बनाए रखा गया है; इसे केवल ‘नष्ट’ कहकर उसके अर्थ को संकुचित नहीं किया गया।
theological_decisions:
- issue: इस पद में אשר से बने दोनों रूपों का अर्थ
  choice: पहले रूप को अगुवों और दूसरे को उनकी अगुवाई पानेवालों के रूप में प्रस्तुत करना
  alternative: इन्हें इस प्रजा को धन्य कहनेवालों और उनके द्वारा धन्य कहे गए लोगों के रूप में प्रस्तुत करना
  rationale: निकटवर्ती מַתְעִים (‘भटकानेवाले’) और दोनों रूपों की समान्तर संरचना नेतृत्व/अगुवाई के अर्थ का समर्थन करती है। फिर भी ‘धन्य कहना’ इब्रानी रूपों की वास्तविक सम्भावना है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भविष्यद्वाणी-शैली रखी गई है। ‘अगुवे’ सामान्य पाठक के लिए सुबोध है; ‘निगल लिए गए’ मूल रूपक और उसके कठोर परिणाम को सुरक्षित रखता है।
