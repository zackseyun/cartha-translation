source:
  edition: WLC
  text: כִּי יֶ֣לֶד יֻלַּד לָ֗/נוּ בֵּ֚ן נִתַּן לָ֔/נוּ וַ/תְּהִ֥י הַ/מִּשְׂרָ֖ה עַל שִׁכְמ֑/וֹ וַ/יִּקְרָ֨א שְׁמ֜/וֹ פֶּ֠לֶא יוֹעֵץ֙ אֵ֣ל גִּבּ֔וֹר אֲבִי עַ֖ד שַׂר שָׁלֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/005.yaml
  text: For a child has been born to us[a], a son has been given to us, and the rule is on his shoulder; and his name is called Wonderful Counselor, Mighty God, Father of Eternity[b], Prince of Peace.
translation:
  language: hi
  text: क्योंकि हमारे लिए एक बालक जन्मा है[a], हमें एक पुत्र दिया गया है, और शासन उसके कंधे पर है; और उसका नाम अद्भुत परामर्शदाता, सामर्थी परमेश्वर, अनन्तकाल का पिता[b], शान्ति का राजकुमार कहलाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, भविष्यसूचक प्रसंग में अधिक परम्परागत रूप से: “क्योंकि हमारे लिए एक बालक जन्म लेगा, हमें एक पुत्र दिया जाएगा, और शासन उसके कंधे पर होगा; और उसका नाम ... कहलाएगा।”'
    reason: alternative_reading
  - marker: b
    text: “अनन्तकाल का पिता” हिब्रू का अधिक शाब्दिक अनुवाद है; परम्परागत रूप से “अनन्त पिता” भी कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले प्रसंग में व्यक्त आशा का कारण या आधार प्रस्तुत करता है; ‘क्योंकि’ हिब्रू के व्याख्यात्मक-कारणात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יֶלֶד
  choice: बालक
  rationale: यह सामान्य रूप से छोटे बच्चे को दर्शाता है; ‘बालक’ गरिमापूर्ण और सहज है तथा अगले समानान्तर पद ‘पुत्र’ से मेल खाता है।
- source_word: יֻלַּד לָנוּ
  choice: हमारे लिए ... जन्मा है
  rationale: निष्क्रिय पूर्ण क्रिया सम्पन्न घटना को वर्तमान प्रासंगिकता के साथ व्यक्त करती है; ‘जन्मा है’ भविष्यसूचक उद्घोषणा की निश्चितता को बनाए रखता है।
- source_word: בֵּן
  choice: पुत्र
  rationale: हिब्रू शब्द स्पष्ट रूप से पुरुष संतान को सूचित करता है; ‘पुत्र’ इसका सीधा और गरिमापूर्ण हिन्दी रूप है।
- source_word: נִתַּן לָנוּ
  choice: हमें ... दिया गया है
  rationale: यह पहली निष्क्रिय पूर्ण क्रिया के समानान्तर है और किसी अनुल्लिखित कर्ता को जोड़े बिना दिए जाने का भाव सुरक्षित रखता है।
- source_word: הַמִּשְׂרָה
  choice: शासन
  rationale: यह राजकीय अधिकार और प्रभुत्व को दर्शाता है; ‘शासन’ आधुनिक हिन्दी में स्वाभाविक है और ‘सरकार’ की अपेक्षा संस्था के बजाय शासनाधिकार पर बल देता है।
- source_word: וַתְּהִי ... עַל שִׁכְמוֹ
  choice: उसके कंधे पर है
  rationale: यह हिब्रू की प्रत्यक्ष कंधे वाली छवि को बिना ‘आ टिका’ जैसे अतिरिक्त परिणामात्मक अर्थ के बनाए रखता है।
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: उसका नाम ... कहलाता है
  rationale: एकवचन क्रिया का कर्ता अनिर्दिष्ट है और यह नामकरण-सूत्र की तरह काम करती है; ‘कहलाता है’ किसी विशिष्ट कर्ता को आरोपित किए बिना उस सूत्र को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פֶּלֶא יוֹעֵץ
  choice: अद्भुत परामर्शदाता
  rationale: इसे संयुक्त राजकीय उपाधि के रूप में लेना वाक्यरचना के अनुकूल है; यह असाधारणता और बुद्धिमान परामर्श, दोनों को सुरक्षित रखता है।
- source_word: אֵל גִּבּוֹר
  choice: सामर्थी परमेश्वर
  rationale: यशायाह में इस पदबंध का प्रबल ईश्वरीय अर्थ है; यह सीधा अनुवाद उस बल को निर्बल किए बिना बनाए रखता है।
- source_word: אֲבִי עַד
  choice: अनन्तता का पिता
  rationale: हिब्रू रचना का शाब्दिक अर्थ ‘अनन्तता/सदैवता का पिता’ है; यह परम्परागत ‘अनन्तकाल का पिता’ की तुलना में मूल संबंध को अधिक पारदर्शी ढंग से दिखाता है।
- source_word: שַׂר שָׁלוֹם
  choice: शान्ति का राजकुमार
  rationale: यह मान्य और सटीक राजकीय उपाधि है; ‘शान्ति’ मुख्य पाठ में शालोम के व्यापक भाव को संक्षेप में सुरक्षित रखती है।
theological_decisions:
- issue: बालक को दी गई राजकीय उपाधियों का पूरा बल
  choice: 'पूरी शृंखला को बालक की उपाधियों के रूप में प्रस्तुत किया गया है: ‘अद्भुत परामर्शदाता, सामर्थी परमेश्वर, अनन्तता का पिता, शान्ति का राजकुमार।’'
  alternative: कुछ पदों को परमेश्वर के वर्णन के रूप में अलग करना, या אֵל גִּבּוֹר को ‘वीर नायक’ जैसे निर्बल, गैर-ईश्वरीय अर्थ में प्रस्तुत करना।
  rationale: नामकरण-सूत्र के बाद की वाक्यरचना स्वाभाविक रूप से इन सबको बालक के नामों या उपाधियों के रूप में पढ़ती है। अनुवाद न तो इनके प्रबल अर्थ को घटाता है, न मूल में निहित न होने वाली जटिल व्याख्या जोड़ता है।
- issue: भविष्यसूचक प्रसंग में क्रियाओं का काल
  choice: 'मुख्य पाठ में वर्तमान-पूर्ण/वर्तमान परिणामात्मक रूप रखे गए हैं: ‘जन्मा है’, ‘दिया गया है’, ‘है’, ‘कहलाता है’।'
  alternative: सभी क्रियाओं को साधारण भूतकाल में रखना, अथवा ‘जन्मेगा’, ‘दिया जाएगा’, ‘कहलाएगा’ जैसे भविष्यकालीन रूप लेना।
  rationale: हिब्रू रूप भविष्यसूचक उद्घोषणा में कालगत बहुअर्थकता रखते हैं। चुने हुए हिन्दी रूप घटना की सुनिश्चित और सम्पन्न उद्घोषणा को रखते हैं, जबकि परम्परागत भविष्यकालीन पाठ को पादटिप्पणी में सुरक्षित किया गया है।
- issue: אֲבִי עַד का संबंधवाचक अर्थ
  choice: ‘अनन्तता का पिता’
  alternative: ‘अनन्त पिता’ या ‘सदा का पिता’
  rationale: चुना हुआ रूप हिब्रू construct की संरचना को स्पष्ट रखता है और उपाधि को किसी बाद की व्यवस्थित धर्मवैज्ञानिक परिभाषा में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘शासन’ राजकीय अधिकार को व्यक्त करता है; उपाधियों में समानान्तर संज्ञात्मक शैली रखी गई है। वर्तनी में ‘शान्ति’ का मानक तत्सम रूप अपनाया गया है।
