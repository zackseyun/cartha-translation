  yaml_path: translation/ot/isaiah/009/014.yaml
  text: The elder and the honored man is the head[b][a], and the prophet who teaches falsehood is the tail.
translation:
  language: hi
  text: वृद्ध और प्रतिष्ठित व्यक्ति सिर है[a], और झूठ सिखाने वाला भविष्यद्वक्ता[b] पूँछ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बूढ़ा और ऊँचे पद वाला व्यक्ति।” हिब्रू मुहावरे का शाब्दिक अर्थ है, “वृद्ध और वह जिसका मुख उठाया गया है।”
    reason: lexical_alternative
  - marker: b
    text: या “झूठ की शिक्षा देने वाला भविष्यद्वक्ता।”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן
  choice: वृद्ध
  rationale: यह शब्द आयु में बड़े व्यक्ति या समाज के बुज़ुर्ग अगुवे को सूचित कर सकता है। “वृद्ध” मूल अर्थ को स्पष्ट और संक्षिप्त रूप में बनाए रखता है।
- source_word: וּנְשׂוּא פָנִים
  choice: और प्रतिष्ठित व्यक्ति
  rationale: शाब्दिक मुहावरे “जिसका मुख उठाया गया है” का आशय सम्मानित या ऊँचे पद वाले व्यक्ति से है। “प्रतिष्ठित व्यक्ति” आधुनिक हिन्दी में सामाजिक सम्मान और ऊँची हैसियत दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הוּא הָרֹאשׁ
  choice: ही सिर है
  rationale: प्रत्यक्ष शारीरिक रूपक “सिर” को सुरक्षित रखा गया है। “ही” हिब्रू सर्वनाम से मिलने वाले पहचान-संबंधी बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְנָבִיא
  choice: और ... भविष्यद्वक्ता
  rationale: यहाँ भविष्यद्वक्ता एक प्रतिनिधि धार्मिक व्यक्ति के रूप में सिर और पूँछ के रूपकीय विरोध में आता है। प्रचलित बाइबलीय पद “भविष्यद्वक्ता” अर्थ को बिना विस्तार के व्यक्त करता है।
- source_word: מוֹרֶה שֶּׁקֶר
  choice: झूठ सिखाने वाला
  rationale: कृदन्त निरंतर या चरित्रगत कार्य का बोध देता है। यह अनुवाद שֶׁקֶר के झूठ अथवा मिथ्या के नैतिक अर्थ को सीधे बनाए रखता है।
- source_word: הוּא הַזָּנָב
  choice: ही पूँछ है
  rationale: “पूँछ” को व्याख्यात्मक अर्थ से बदलने के बजाय मूल रूपक ज्यों का त्यों रखा गया है; “ही” पहचान पर दिए गए बल को दर्शाता है।
theological_decisions:
- issue: सामाजिक और धार्मिक अगुवों की “सिर” और “पूँछ” के रूप में पहचान
  choice: दोनों शारीरिक रूपकों को बिना व्याख्यात्मक विस्तार के सीधे रखा गया है।
  alternative: “सिर” को “अगुवा” और “पूँछ” को “तुच्छ या अधीन व्यक्ति” के रूप में खोलकर कहना।
  rationale: हिब्रू पाठ ठोस रूपकीय भाषा का प्रयोग करता है, जिसकी व्याख्या निकटवर्ती संदर्भ में होती है। रूपकों को बनाए रखने से भविष्यद्वाणी की तीक्ष्णता और जानबूझकर रखा गया विरोध सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “सिर” और “पूँछ” के सशक्त मूल रूपक सुरक्षित हैं; सामाजिक प्रतिष्ठा वाले हिब्रू मुहावरे को मुख्य पाठ में स्वाभाविक हिन्दी के रूप में प्रस्तुत कर शाब्दिक रूप पादटिप्पणी में दिया गया है।
