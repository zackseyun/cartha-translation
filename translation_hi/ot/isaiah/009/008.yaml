base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/008.yaml
  text: And all the people will know—Ephraim and the inhabitants of Samaria—who say in pride and in arrogance of heart,[a]
translation:
  language: hi
  text: और सारी प्रजा जान लेगी—एप्रैम और सामरिया के निवासी—जो घमण्ड और मन के अहंकार में कहते हैं,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘हृदय की बड़ाई में’ है। यहाँ यह मुहावरा घमण्ड से स्वयं को बड़ा समझने का भाव देता है; इसलिए ‘मन के अहंकार में’ अनुवाद किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: और ... जान लेगी
  rationale: भविष्यसूचक सन्दर्भ में संयोजक सहित पूर्ण क्रिया को भावी परिणाम के रूप में समझना स्वाभाविक है। ‘प्रजा’ हिन्दी में स्त्रीलिंग एकवचन है, इसलिए ‘जान लेगी’ रखा गया है।
- source_word: הָעָם כֻּלּוֹ
  choice: सारी प्रजा
  rationale: यह अभिव्यक्ति समुदाय की समग्रता बताती है; ‘सारी प्रजा’ आधुनिक हिन्दी में सहज और व्यापक है।
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: मूल पाठ उत्तरी राज्य का संकेत करने के लिए भी इसी व्यक्तिवाचक नाम का प्रयोग करता है, इसलिए नाम को बनाए रखा गया है।
- source_word: וְיוֹשֵׁב שֹׁמְרוֹן
  choice: और सामरिया के निवासी
  rationale: एकवचन कृदन्त का सामूहिक अर्थ है; हिन्दी में बहुवचन ‘निवासी’ स्वाभाविक रूप से वही अर्थ देता है।
- source_word: בְּגַאֲוָה
  choice: घमण्ड में
  rationale: यहाँ शब्द आत्मोन्नति और दर्प का नकारात्मक भाव रखता है; ‘घमण्ड’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: וּבְגֹדֶל לֵבָב
  choice: और मन के अहंकार में
  rationale: शाब्दिक अर्थ ‘हृदय की बड़ाई/महानता’ है, पर प्रसंग में यह गर्वपूर्ण आत्म-बड़ाई का मुहावरा है। ‘मन का अहंकार’ नकारात्मक आशय स्पष्ट करता है।
- source_word: לֵאמֹר
  choice: जो ... कहते हैं
  rationale: यह अगले पद में आने वाली डींग की विषय-वस्तु का परिचय देता है; ‘जो ... कहते हैं’ हिन्दी में आगे जारी उद्धरण से सहज रूप से जुड़ता है।
