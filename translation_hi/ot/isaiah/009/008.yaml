  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य का अधूरा-सा अन्त मूल पाठ के לֵאמֹר के अनुरूप है, क्योंकि कथन अगले पद में जारी रहता है।
