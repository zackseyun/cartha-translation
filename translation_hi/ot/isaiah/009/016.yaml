source:
  edition: WLC
  text: עַל כֵּ֨ן עַל בַּחוּרָ֜י/ו לֹֽא יִשְׂמַ֣ח אֲדֹנָ֗/י וְ/אֶת יְתֹמָ֤י/ו וְ/אֶת אַלְמְנֹתָי/ו֙ לֹ֣א יְרַחֵ֔ם כִּ֤י כֻלּ/וֹ֙ חָנֵ֣ף וּ/מֵרַ֔ע וְ/כָל פֶּ֖ה דֹּבֵ֣ר נְבָלָ֑ה בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/016.yaml
  text: Therefore the Lord does not rejoice over their young men[a], and he does not have compassion on their fatherless and their widows; for every one of them is godless and an evildoer, and every mouth speaks folly. For all this his anger has not turned away[b], and his hand is still stretched out.
translation:
  language: hi
  text: इसलिए प्रभु उनके जवानों से प्रसन्न नहीं होगा[a], और उनके अनाथों और विधवाओं पर दया नहीं करेगा; क्योंकि उनमें से हर एक भक्तिहीन और कुकर्मी है, और हर मुँह नीचता की बातें करता है[b]। इस सब पर भी उसका क्रोध नहीं टला, और उसका हाथ अब भी उठा हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से ‘उसके जवानों … उसके अनाथों … उसकी विधवाओं’ है; एकवचन अधिकारसूचक रूप पूरी प्रजा को एक सामूहिक इकाई मानता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘हर मुँह मूर्खतापूर्ण बातें करता है’; यहाँ प्रयुक्त हिब्रू शब्द में नैतिक रूप से नीच, लज्जाजनक और मूर्खतापूर्ण वाणी का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पिछले अभियोग के परिणाम को प्रस्तुत करता है और हिब्रू के निष्कर्षसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בַּחוּרָיו
  choice: उनके जवानों
  rationale: בָּחוּר यहाँ जीवन की युवावस्था में पुरुषों को दर्शाता है। एकवचन प्रत्यय का संदर्भ सामूहिक प्रजा से है, इसलिए हिन्दी में बहुवचन ‘उनके’ स्वाभाविक है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यशायाह में यह परमेश्वर के लिए प्रयुक्त प्रचलित ईश्वरीय उपाधि है; ‘प्रभु’ आधुनिक हिन्दी में संक्षिप्त और प्रतिष्ठित रूप है।
- source_word: יְתֹמָיו
  choice: उनके अनाथों
  rationale: יָתוֹם विशेषतः पितृहीन बच्चे को सूचित कर सकता है, पर आधुनिक हिन्दी में ‘अनाथ’ इस असुरक्षित सामाजिक वर्ग के लिए सर्वाधिक स्वाभाविक पद है।
- source_word: אַלְמְנֹתָיו
  choice: उनकी विधवाओं
  rationale: यह बहुवचन संज्ञा का सीधा और स्वाभाविक हिन्दी रूप है; सामूहिक संदर्भ के कारण ‘उनकी’ रखा गया है।
- source_word: יְרַחֵם
  choice: दया नहीं करेगा
  rationale: רִחַם करुणामय दया को व्यक्त करता है; यह हिन्दी में सहज और अर्थपूर्ण है।
- source_word: כֻּלּוֹ
  choice: उनमें से हर एक
  rationale: एकवचन सामूहिक रूप की सर्वसमावेशी तीव्रता को हिन्दी में स्पष्ट करता है।
- source_word: חָנֵף
  choice: भक्तिहीन
  rationale: भविष्यद्वाणी के इस संदर्भ में शब्द केवल कपट नहीं, बल्कि परमेश्वर के प्रति अपवित्र और अधार्मिक वृत्ति दर्शाता है।
- source_word: מֵרַע
  choice: कुकर्मी
  rationale: यह बुराई करने वाले व्यक्ति को संक्षिप्त और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: כָל פֶּה דֹּבֵר נְבָלָה
  choice: हर मुँह नीचता की बातें करता है
  rationale: ‘हर मुँह’ हिब्रू की ठोस अभिव्यक्ति को सुरक्षित रखता है। נְבָלָה में मूर्खता के साथ नैतिक निकृष्टता और लज्जाजनकता भी है; ‘नीचता की बातें’ उस व्यापक बल को व्यक्त करता है।
- source_word: בְּכָל זֹאת
  choice: इस सब पर भी
  rationale: यशायाह के आवर्ती कथन में यह पूर्ववर्णित न्याय के बावजूद क्रोध के न टलने की बात जोड़ता है।
- source_word: לֹא שָׁב אַפּוֹ
  choice: उसका क्रोध नहीं टला
  rationale: אַף का शाब्दिक अर्थ ‘नाक’ है, पर यहाँ मुहावरे में क्रोध है; שׁוּב के साथ ‘नहीं टला’ स्वाभाविक हिन्दी है।
- source_word: וְעוֹד יָדוֹ נְטוּיָה
  choice: उसका हाथ अब भी उठा हुआ है
  rationale: यह जारी ईश्वरीय न्याय की हिब्रू छवि को बिना अनावश्यक व्याख्या के बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय उपाधि אֲדֹנָי का अनुवाद
  choice: प्रभु
  alternative: मेरे प्रभु
  rationale: रूप की ऐतिहासिक संरचना के बावजूद भविष्यद्वाणी में यह परमेश्वर की स्थापित उपाधि के रूप में काम करता है; ‘मेरे’ जोड़ने से यहाँ भ्रामक व्यक्तिगत स्वामित्व का भाव आ सकता है।
- issue: ‘जवानों’, ‘अनाथों’ और ‘विधवाओं’ के साथ अधिकारसूचक प्रत्यय
  choice: उनके/उनकी
  alternative: उसके/उसकी
  rationale: हिब्रू प्रत्यय एकवचन है, किंतु उसका संदर्भ प्रजा या राष्ट्र को सामूहिक इकाई के रूप में है। हिन्दी में बहुवचन अधिकारसूचक रूप संदर्भ को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- issue: उठे हुए हाथ की छवि
  choice: शाब्दिक छवि को बनाए रखा
  alternative: उसका दंड अब भी जारी है
  rationale: छवि ईश्वरीय न्याय का संकेत देती है, पर उसका अर्थ पूरी तरह खोल देने के बजाय मूल की काव्यात्मक और धर्मवैचारिक गंभीरता को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। समानांतर वाक्यरचना और अंतिम न्याय-छवि को मूल के निकट रखा गया है; दुर्लभ या अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
