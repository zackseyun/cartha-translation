source:
  edition: WLC
  text: וְ/הָ/עָ֥ם לֹא שָׁ֖ב עַד הַ/מַּכֵּ֑/הוּ וְ/אֶת יְהוָ֥ה צְבָא֖וֹת לֹ֥א דָרָֽשׁוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/012.yaml
  text: But the people did not return to him who struck them[a], nor did they seek Yahweh of Armies.
translation:
  language: hi
  text: फिर भी वे लोग उन्हें मारनेवाले की ओर नहीं लौटे, और न उन्होंने सेनाओं के यहवे[a] को खोजा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'पारंपरिक अनुवाद: “सेनाओं का प्रभु।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעָם
  choice: फिर भी वे लोग
  rationale: संदर्भ में दण्ड के बावजूद लोगों की प्रतिक्रिया न होने का विरोधाभास है; इसलिए וְ को यहाँ स्वाभाविक हिन्दी में ‘फिर भी’ कहा गया है।
- source_word: לֹא שָׁב
  choice: नहीं लौटे
  rationale: שׁוּב का मूल अर्थ ‘लौटना/मुड़ना’ है। ‘लौटे’ परमेश्वर की ओर संबंधात्मक वापसी का भाव रखता है, पर इसे सीधे ‘मन फिराया’ कहकर अर्थ को संकीर्ण नहीं करता।
- source_word: עַד הַמַּכֵּהוּ
  choice: उसे मारनेवाले की ओर
  rationale: हिब्रू में ‘उसको मारनेवाले तक/की ओर’ है। एकवचन प्रत्यय सामूहिक संज्ञा הָעָם को संदर्भित करता है; हिन्दी में ‘वे लोग ... उसे’ इस सामूहिकता और व्याकरणिक तनाव को स्वाभाविक रूप से बनाए रखता है।
- source_word: וְאֶת
  choice: और न
  rationale: अगली निषेधात्मक क्रिया के साथ וְ का समन्वय हिन्दी में ‘और न’ द्वारा स्पष्ट और सहज है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहवे
  rationale: יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहवे’ से और צְבָאוֹת को आधुनिक, पारदर्शी ‘सेनाओं’ से व्यक्त किया गया है।
- source_word: לֹא דָרָשׁוּ
  choice: न उन्होंने ... खोजा
  rationale: דָּרַשׁ यहाँ परमेश्वर को सहायता, मार्गदर्शन और संबंध के लिए खोजने का व्यापक अर्थ रखता है; ‘खोजा’ इसे अनावश्यक रूप से केवल ‘पूछताछ की’ तक सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे उपस्थित है। ‘यहवे’ उसका प्रचलित विद्वत्तापरक हिन्दी लिप्यंतरण है और वाचा-नाम को सामान्य उपाधि में नहीं बदलता।
- issue: צְבָאוֹת युक्त ईश्वरीय उपाधि
  choice: सेनाओं के यहवे
  alternative: सेनाओं के यहवे के लिए पारंपरिक रूप ‘सेनाओं का प्रभु’
  rationale: ‘सेनाएँ’ צְבָאוֹת के सामान्य अर्थ को आधुनिक पाठक के लिए स्पष्ट रखता है। शब्दक्रम हिन्दी में संबंधसूचक निर्माण के अनुरूप रखा गया है।
- issue: दण्ड देनेवाले की पहचान
  choice: उसे मारनेवाले
  alternative: जिसने उन्हें मारा था
  rationale: कर्ता को पद में नामित नहीं किया गया, यद्यपि संदर्भ उसे परमेश्वर से जोड़ता है। अनुवाद इस निहित पहचान को स्पष्ट जोड़कर मूल की अप्रत्यक्षता समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘फिर भी’ संदर्भगत विरोध को व्यक्त करता है; ‘मारनेवाले’ मूल के कृदन्तीय रूप के निकट है। मुख्य पाठ का [a] चिह्न संबंधित पारंपरिक उपाधि का विकल्प देता है।
