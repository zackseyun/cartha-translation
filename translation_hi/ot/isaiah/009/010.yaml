  yaml_path: translation/ot/isaiah/009/010.yaml
  text: And Yahweh raised up the adversaries of Rezin against him[a], and stirred up his enemies[b],
translation:
  language: hi
  text: और याहवे ने रसीन के विरोधियों को उसके विरुद्ध खड़ा किया[a], और उसके शत्रुओं को उकसा दिया[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सशक्त किया” अथवा “ऊँचा उठाया।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पाठ में एकवचन सर्वनाम है—“उसके विरुद्ध … उसके शत्रुओं”; व्यापक प्रसंग में लक्ष्य उत्तरी राज्य, अर्थात् एप्रैम, समझा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׂגֵּב
  choice: बलवान किया
  rationale: हिफ़ील रूप का कारणवाचक अर्थ यहाँ विरोधियों को शक्तिशाली या प्रबल करने का भाव देता है। यह विकल्प सम्मान देने के अर्थ से बचते हुए न्याय के प्रसंग में स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: צָרֵי רְצִין
  choice: रसीन के विरोधियों
  rationale: समास-पद का सीधा अर्थ ‘रसीन के विरोधी’ है। ‘विरोधियों’ से आगे आने वाले ‘शत्रुओं’ की अनावश्यक पुनरावृत्ति भी टलती है।
- source_word: עָלָיו
  choice: उसके विरुद्ध
  rationale: शत्रुतापूर्ण प्रसंग में עַל का अर्थ ‘विरुद्ध’ है। पुल्लिंग एकवचन प्रत्यय को अस्पष्टता सहित ‘उसके’ के रूप में सुरक्षित रखा गया है।
- source_word: אֹיְבָיו
  choice: उसके शत्रुओं
  rationale: संज्ञा और उसके पुल्लिंग एकवचन संबंधसूचक प्रत्यय का सहज और सीधा हिन्दी रूप।
- source_word: יְסַכְסֵךְ
  choice: भड़का दिया
  rationale: क्रिया शत्रुतापूर्ण संघर्ष के लिए उकसाने या सक्रिय करने का भाव रखती है; ‘भड़का दिया’ आधुनिक हिन्दी में इस कारणवाचक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम है; इसलिए उसे उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: ‘उसके विरुद्ध’ और ‘उसके शत्रुओं’ में एकवचन सर्वनाम का संदर्भ
  choice: मूल का एकवचन ‘उसके’ बनाए रखा गया
  alternative: इस्राएल के विरुद्ध / एप्रैम के शत्रुओं
  rationale: व्यापक प्रसंग उत्तरी राज्य या एप्रैम की ओर संकेत करता है, पर इस पद में नाम स्पष्ट नहीं किया गया। मूल की वास्तविक अस्पष्टता को मुख्य पाठ में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद अगले वाक्यांश में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
