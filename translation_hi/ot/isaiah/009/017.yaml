base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/017.yaml
  text: For wickedness burns like a fire; it devours brier and thorn[a], and it kindles the thickets of the forest, and they roll upward in a column of smoke.
translation:
  language: hi
  text: क्योंकि दुष्टता आग के समान धधकती है; वह कँटीली झाड़ियों और काँटों को भस्म कर देती है, वन के घने झुरमुटों में आग लगा देती है, और धुएँ के ऊँचे गुबार ऊपर उमड़ते हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम उपवाक्य का इब्रानी पाठ कठिन है। इसका अनुवाद यह भी हो सकता है: ‘और वे उठते हुए धुएँ में चक्कर खाते हुए ऊपर जाते हैं।’'
    reason: दुर्लभ क्रिया וַיִּתְאַבְּכוּ और גֵּאוּת עָשָׁן के संबंध की शाब्दिक तथा वाक्यगत अनिश्चितता बताने के लिए।
lexical_decisions:
- source_word: בָעֲרָה
  choice: धधकती है
  rationale: कालगत रूप सिद्ध क्रिया है, पर भविष्यद्वाणी के सजीव वर्णन में वर्तमान प्रभाव व्यक्त करता है। ‘धधकती है’ आग की तीव्रता और निरंतरता को स्वाभाविक हिन्दी में रखता है।
- source_word: רִשְׁעָה
  choice: दुष्टता
  rationale: यह नैतिक बुराई का अमूर्त संज्ञा-रूप है और यहाँ आग की तरह कार्य करने वाली मानवीकृत शक्ति के रूप में प्रस्तुत है।
- source_word: שָׁמִיר וָשַׁיִת
  choice: कँटीली झाड़ियाँ और काँटे
  rationale: दोनों शब्द अनुपयोगी, चुभने वाली वनस्पति के पारंपरिक युग्म को सूचित करते हैं; ठीक-ठीक वनस्पति-परिचय अनिश्चित है, इसलिए सामान्य और स्पष्ट शब्द चुने गए हैं।
- source_word: תֹּאכֵל
  choice: भस्म कर देती है
  rationale: אכל का मूल अर्थ ‘खा जाना’ है, पर आग के संदर्भ में ‘भस्म करना’ उसका सजीव और स्वाभाविक रूपकात्मक अर्थ व्यक्त करता है।
- source_word: וַתִּצַּת
  choice: जला देती है
  rationale: क्रिया का अर्थ आग लगाना या प्रज्वलित करना है। यह हिन्दी पदबंध झाड़ियों से वन की घनी वृद्धि तक फैलती आग की गति स्पष्ट करता है।
- source_word: סִבְכֵי הַיַּעַר
  choice: वन की घनी झाड़ियाँ
  rationale: סבך उलझी और सघन वनस्पति या झुरमुट को दर्शाता है। यह चयन चित्र को सामान्य पाठक के लिए स्पष्ट रखते हुए मूल अर्थ के निकट है।
- source_word: וַיִּתְאַבְּכוּ
  choice: ऊपर उमड़ते हैं
  rationale: यह दुर्लभ और कठिन क्रिया धुएँ के लहराते, गुबार बनाते हुए ऊपर उठने का संकेत देती प्रतीत होती है। ‘उमड़ते हैं’ गति को व्यक्त करता है, पर उसकी दिशा या रूप को अत्यधिक निश्चित नहीं करता।
- source_word: גֵּאוּת עָשָׁן
  choice: धुएँ के ऊँचे गुबारों में
  rationale: גֵּאוּת ऊँचाई, उभार या फूलते हुए समूह का बोध करा सकता है। धुएँ के साथ ‘ऊँचे गुबार’ हिन्दी में इस दृश्य को स्वाभाविक रूप से व्यक्त करता है।
