  language: hi
  text: क्योंकि कोलाहल में धमकते योद्धा का हर जूता[a] और लहू में लिथड़ा हर वस्त्र जलाने के लिए होंगे, आग के ईंधन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘कोलाहल में धमकता हुआ हर जूता।’ यहाँ प्रयुक्त इब्रानी पदबंध दुर्लभ और कठिन है; कुछ अनुवाद इसे जूते के बजाय युद्ध की गड़गड़ाहट या शोर के अर्थ में लेते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार बताता है; प्रसंग में कारणसूचक ‘क्योंकि’ स्वाभाविक है।
- source_word: סְאוֹן סֹאֵן
  choice: धमकते योद्धा का हर जूता
  rationale: दुर्लभ और कठिन पदबंध को सैन्य प्रसंग तथा रक्तरंजित वस्त्र के समानांतर रखकर युद्ध में धमकते जूते के चित्र के रूप में प्रस्तुत किया गया है; अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: בְּרַעַשׁ
  choice: युद्ध के कोलाहल में
  rationale: רַעַשׁ हिलने, गड़गड़ाहट या कोलाहल को सूचित करता है; आसपास के सैन्य बिंब के कारण ‘युद्ध के’ अर्थ को स्वाभाविक रूप से स्पष्ट करता है, यद्यपि यह शब्द मूल में अलग से नहीं है।
- source_word: שִׂמְלָה מְגוֹלָלָה בְדָמִים
  choice: लहू में लिथड़ा हर वस्त्र
  rationale: मूल का चित्र रक्त में लपेटे या सने वस्त्र का है; ‘लहू में लिथड़ा’ आधुनिक हिन्दी में वही वीभत्स युद्ध-बिंब स्वाभाविक और सजीव ढंग से देता है।
- source_word: לִשְׂרֵפָה
  choice: जलाने के लिए होगा
  rationale: गंतव्य या प्रयोजन सूचित करने वाली मूल रचना ‘जलाने के लिए’ से औपचारिक रूप से सुरक्षित रहती है।
- source_word: מַאֲכֹלֶת אֵשׁ
  choice: आग का ईंधन
  rationale: शाब्दिक अर्थ ‘आग का भोजन’ है; ‘आग का ईंधन’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक समतुल्य है।
