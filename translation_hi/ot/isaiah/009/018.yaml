id: ISA.9.18
reference: Isaiah 9:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/עֶבְרַ֛ת יְהוָ֥ה צְבָא֖וֹת נֶעְתַּ֣ם אָ֑רֶץ וַ/יְהִ֤י הָ/עָם֙ כְּ/מַאֲכֹ֣לֶת אֵ֔שׁ אִ֥ישׁ אֶל אָחִ֖י/ו לֹ֥א יַחְמֹֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/018.yaml
  text: By the wrath of Yahweh of hosts the land is scorched[a], and the people have become like fuel for the fire; no man spares his brother.
translation:
  language: hi
  text: सेनाओं के यहोवा के प्रकोप से देश झुलस गया है[a], और लोग आग का ईंधन बन गए हैं; कोई अपने भाई को नहीं बख्शता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘देश जल गया है’ अथवा ‘देश अन्धकारमय हो गया है।’ हिब्रू क्रिया दुर्लभ है और उसका ठीक अर्थ विवादित है; निकटवर्ती आग की छवि ‘झुलस गया है’ का समर्थन करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֶבְרַת
  choice: के प्रकोप से
  rationale: उपसर्ग בְּ का साधनवाचक अर्थ और עֶבְרָה की तीव्र, उमड़ती हुई क्रोध-भावना—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: यְהוָה को वाचा-सूचक व्यक्तिगत नाम ‘यहोवा’ और צְבָאוֹת को व्यापक बहुवचन ‘सेनाओं’ के रूप में रखा गया है; यह स्वर्गीय सैन्य-शक्ति और सार्वभौम प्रभुता की छवि बनाए रखता है।
- source_word: נֶעְתַּם
  choice: झुलस गया है
  rationale: यह दुर्लभ क्रिया अर्थ की दृष्टि से विवादित है। निकटवर्ती आग और ईंधन की छवि के कारण ‘झुलस गया है’ संदर्भानुकूल है, पर वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: אָרֶץ
  choice: देश
  rationale: यहाँ न्याय एक विशिष्ट प्रजा और उसके सामाजिक विघटन पर केंद्रित है, इसलिए ‘पृथ्वी’ की अपेक्षा संदर्भ-सीमित ‘देश’ अधिक उपयुक्त है।
- source_word: וַיְהִי הָעָם
  choice: और लोग ... बन गए हैं
  rationale: क्रिया घटनाक्रम को आगे बढ़ाते हुए परिणामी अवस्था बताती है; हिन्दी का पूर्ण वर्तमान उस अवस्था को सहज ढंग से व्यक्त करता है।
- source_word: כְּמַאֲכֹלֶת אֵשׁ
  choice: आग का ईंधन
  rationale: शाब्दिक भाव ‘आग द्वारा खाई जाने वाली वस्तु’ है। ‘आग का ईंधन’ आधुनिक हिन्दी में स्वाभाविक है और भस्म किए जाने की उपमा को बनाए रखता है।
- source_word: אִישׁ אֶל אָחִיו לֹא יַחְמֹלוּ
  choice: कोई अपने भाई को नहीं बख्शता
  rationale: हिब्रू का वितरणात्मक भाव स्वाभाविक हिन्दी में ‘कोई ... नहीं’ से व्यक्त होता है। ‘भाई’ पारिवारिक भाषा और आपसी हिंसा की भयावहता को रखता है; ‘नहीं बख्शता’ दया के कारण छोड़ देने के अर्थ को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। हिन्दी बाइबल-परंपरा में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम के रूप में प्रस्तुत है; इसे उपाधि ‘प्रभु’ से नहीं बदला गया।
- issue: צְבָאוֹת की व्याप्ति
  choice: सेनाओं
  alternative: सेनाओं का यहोवा / सर्वशक्तिमान यहोवा
  rationale: ‘सेनाओं’ मूल सैन्य और स्वर्गीय छवि को बनाए रखता है, जबकि ‘सर्वशक्तिमान’ अर्थ की व्याख्या करके मूल रूपक को हटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और जनसुलभ रखी गई है। वाक्य की भविष्यद्वाणी-संबंधी तीव्रता, अग्नि-रूपक और भ्रातृ-संबंध की सामाजिक भयावहता को बनाए रखा गया है। दुर्लभ क्रिया की वास्तविक अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
