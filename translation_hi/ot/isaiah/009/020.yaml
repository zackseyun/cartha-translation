source:
  edition: WLC
  text: מְנַשֶּׁ֣ה אֶת אֶפְרַ֗יִם וְ/אֶפְרַ֨יִם֙ אֶת מְנַשֶּׁ֔ה יַחְדָּ֥ו הֵ֖מָּה עַל יְהוּדָ֑ה בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/020.yaml
  text: Manasseh devours Ephraim[a], and Ephraim Manasseh; together they are against Judah. For all this his anger has not turned away, and his hand is still stretched out.
translation:
  language: hi
  text: मनश्शे एप्रैम को निगलता है[a], और एप्रैम मनश्शे को; दोनों मिलकर यहूदा के विरुद्ध हैं। इतना सब होने पर भी उसका क्रोध नहीं टला, और उसका हाथ अब भी फैला हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मनश्शे एप्रैम को, और एप्रैम मनश्शे को।” हिब्रू में क्रिया नहीं है; “निगलता है” पिछले पद की भक्षण-छवि से पूरा किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנַשֶּׁה
  choice: मनश्शे
  rationale: इस्राएली गोत्र का पारंपरिक और प्रचलित हिन्दी नाम।
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: इस्राएली गोत्र का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֶת
  choice: को
  rationale: हिब्रू प्रत्यक्ष कर्म-चिह्न का हिन्दी में स्वाभाविक प्रतिनिधित्व कर्म-परसर्ग ‘को’ से किया गया है।
- source_word: יַחְדָּו הֵמָּה
  choice: दोनों मिलकर
  rationale: स्वतंत्र सर्वनाम और क्रियाविशेषण के संयुक्त बल को सहज हिन्दी में व्यक्त करता है; परस्पर संघर्ष के बाद यहूदा के विरुद्ध उनकी संयुक्त कार्रवाई स्पष्ट होती है।
- source_word: עַל יְהוּדָה
  choice: यहूदा के विरुद्ध
  rationale: शत्रुतापूर्ण संदर्भ में עַל का विरोधसूचक अर्थ उपयुक्त है।
- source_word: בְּכָל זֹאת
  choice: इतना सब होने पर भी
  rationale: आसपास के पदों में दोहराए गए निष्कर्ष का विरोधात्मक बल स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לֹא שָׁב אַפּוֹ
  choice: उसका क्रोध नहीं टला
  rationale: אַף का मुहावरेदार अर्थ ‘क्रोध’ है; שׁוּב के साथ ‘नहीं टला’ हिन्दी में क्रोध के जारी रहने को संक्षेप और स्वाभाविक ढंग से कहता है।
- source_word: וְעוֹד
  choice: अब भी
  rationale: न्याय की कार्रवाई के लगातार जारी रहने का भाव व्यक्त करता है।
- source_word: יָדוֹ נְטוּיָה
  choice: उसका हाथ अब भी उठा हुआ है
  rationale: दैवी सामर्थ्य और जारी न्याय की शारीरिक छवि को बनाए रखता है; हिन्दी में ‘हाथ उठा हुआ’ प्रहार के लिए तत्परता का स्वाभाविक बोध देता है।
theological_decisions:
- issue: ‘उसका क्रोध’ और ‘उसका हाथ’ किसके हैं
  choice: मुख्य पाठ में केवल पुरुषवाचक सर्वनाम ‘उसका’ रखा गया है।
  alternative: ‘यहोवा का क्रोध’ और ‘यहोवा का हाथ’ स्पष्ट रूप से जोड़ना।
  rationale: साहित्यिक संदर्भ इन सर्वनामों को परमेश्वर से जोड़ता है, पर हिब्रू पाठ स्वयं यहाँ नाम नहीं दोहराता। सर्वनाम बनाए रखने से मूल रूप और आवर्ती काव्यात्मक लय सुरक्षित रहती है।
- issue: पहले दो खंडों में लुप्त क्रिया
  choice: पिछले पद की भक्षण-छवि से ‘निगलता है’ की पूर्ति की गई है और इसे पादटिप्पणी में बताया गया है।
  alternative: ‘मनश्शे एप्रैम के विरुद्ध, और एप्रैम मनश्शे के विरुद्ध’ कहकर क्रिया न जोड़ना।
  rationale: हिब्रू में क्रिया लुप्त है, इसलिए वाक्य व्याकरणतः खुला है; पिछले पद में खाने की छवि ‘निगलता है’ को मजबूत संदर्भगत आधार देती है, किंतु वास्तविक अस्पष्टता पादटिप्पणी द्वारा सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक गद्य रखा गया है। गोत्रों के प्रचलित हिन्दी नाम अपनाए गए हैं। आवर्ती न्याय-वाक्य की तीव्रता बनाए रखते हुए अनावश्यक धार्मिक व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
