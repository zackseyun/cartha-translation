base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/011.yaml
  text: Aram from the east and the Philistines from the west devoured Israel with full mouth[a]. For all this, his anger has not turned away[b], and his hand is still stretched out.
translation:
  language: hi
  text: पूर्व से अराम और पश्चिम से[a] पलिश्तियों ने इस्राएल को मुँह भरकर[b] निगल गए। इतना सब होने पर भी उसका क्रोध नहीं टला, और उसका हाथ अब भी फैला हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पीछे से”; यहाँ “पूर्व से” के समानांतर इसका अर्थ संभवतः “पश्चिम से” है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “समूचे मुँह से”; अर्थात बहुत प्रचंडता से या पूरी तरह।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרָם
  choice: अराम
  rationale: इब्रानी जातीय-भौगोलिक नाम का सीधा लिप्यंतरण रखा गया है; आधुनिक देशनाम ‘सीरिया’ आरोपित नहीं किया गया।
- source_word: מִקֶּדֶם
  choice: पूर्व से
  rationale: קֶדֶם का अर्थ ‘आगे’ भी हो सकता है, पर מֵאָחוֹר के साथ दिशात्मक समानांतरता में यहाँ ‘पूर्व’ स्वाभाविक है।
- source_word: פְלִשְׁתִּים
  choice: पलिश्ती
  rationale: इस जनसमूह के नाम का प्रचलित हिन्दी रूप।
- source_word: מֵאָחוֹר
  choice: पश्चिम से
  rationale: शाब्दिक अर्थ ‘पीछे से’ है, पर ‘पूर्व से’ के समानांतर भौगोलिक प्रयोग में पश्चिम अभिप्रेत है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: וַיֹּאכְלוּ
  choice: निगल लिया
  rationale: मूल क्रिया ‘खाना’ है, पर शत्रुओं द्वारा इस्राएल के विनाश का सजीव रूपक व्यक्त करने के लिए ‘निगल लिया’ स्वाभाविक और प्रभावशाली है।
- source_word: בְּכָל פֶּה
  choice: पूरा मुँह खोलकर
  rationale: शाब्दिक ‘समूचे मुँह से’ की भक्षक और प्रचंड छवि को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: בְּכָל זֹאת
  choice: इतना सब होने पर भी
  rationale: पिछले दंड के बावजूद परमेश्वर के क्रोध के जारी रहने का विरोधात्मक भाव स्पष्ट करता है।
- source_word: לֹא שָׁב אַפּוֹ
  choice: उसका क्रोध नहीं टला
  rationale: אַף का प्रसंगानुसार अर्थ ‘क्रोध’ है; ‘नहीं टला’ क्रोध के न फिरने या न हटने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְעוֹד יָדוֹ נְטוּיָה
  choice: उसका हाथ अब भी बढ़ा हुआ है
  rationale: चलते हुए न्याय की भविष्यद्वक्तापरक छवि को निकटता से रखता है और ‘हाथ’ के रूपक को नहीं खोलता।
theological_decisions:
- issue: अंतिम वाक्य में सर्वनाम का संदर्भ
  choice: ‘उसका’ रखा गया है; प्रसंग में यह परमेश्वर की ओर संकेत करता है।
  alternative: स्पष्ट करके ‘यहोवा का क्रोध’ और ‘उसका हाथ’ कहना।
  rationale: प्रसंग परमेश्वर के जारी न्याय को स्पष्ट करता है, पर मूल इब्रानी केवल तृतीय पुरुष सर्वनाम रखता है। इसलिए संदर्भ को अनावश्यक रूप से स्पष्ट किए बिना मूल की अभिव्यक्ति और तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘निगल लिया’ और ‘हाथ बढ़ा हुआ’ जैसे मूल रूपक सुरक्षित हैं। सभी पादटिप्पणी चिह्न मुख्य पाठ में अपने संबंधित पदों के तुरंत बाद रखे गए हैं।
