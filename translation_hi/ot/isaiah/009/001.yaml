source:
  edition: WLC
  text: הָ/עָם֙ הַ/הֹלְכִ֣ים בַּ/חֹ֔שֶׁךְ רָא֖וּ א֣וֹר גָּד֑וֹל יֹשְׁבֵי֙ בְּ/אֶ֣רֶץ צַלְמָ֔וֶת א֖וֹר נָגַ֥הּ עֲלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/001.yaml
  text: The people walking in darkness have seen a great light; on those dwelling in a land of deep darkness[a], light has shone.
translation:
  language: hi
  text: अंधकार में चलने वाले लोगों ने एक बड़ी ज्योति देखी है; घोर अंधकार[a] की भूमि में रहने वालों पर ज्योति चमकी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मृत्यु की छाया की भूमि।” इब्रानी शब्द צַלְמָוֶת का पारंपरिक अनुवाद इस प्रकार किया जाता है, यद्यपि इसका अर्थ सामान्य रूप से घोर अंधकार या गहन उदासी भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: लोगों
  rationale: यह एकवचन सामूहिक संज्ञा किसी जनसमुदाय को सूचित करती है; हिंदी वाक्य में ‘लोगों ने’ स्वाभाविक रूप से इसका सामूहिक अर्थ व्यक्त करता है।
- source_word: הַהֹלְכִים
  choice: चलने वाले
  rationale: वर्तमान कृदंत निरंतर दशा या जीवन-चाल का बिंब रखता है; ‘चलने वाले’ इस बिंब को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: בַּחֹשֶׁךְ
  choice: अंधकार में
  rationale: यह पद शाब्दिक और रूपक दोनों अर्थों के लिए खुला है; सीधा हिंदी अनुवाद दोनों को सुरक्षित रखता है।
- source_word: רָאוּ
  choice: देखी है
  rationale: पूर्ण क्रिया को वर्तमान प्रासंगिकता वाले संपन्न कार्य के रूप में व्यक्त किया गया है, जो भविष्यसूचक घोषणा के प्रभाव को बनाए रखता है।
- source_word: אוֹר גָּדוֹל
  choice: एक बड़ी ज्योति
  rationale: ‘ज्योति’ गरिमापूर्ण किंतु सामान्यतः बोधगम्य है; विशेषण और संज्ञा का सीधा संबंध सुरक्षित है।
- source_word: יֹשְׁבֵי
  choice: रहने वालों
  rationale: कृदंत जारी अवस्था को व्यक्त करता है; ‘रहने वालों’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: בְּאֶרֶץ
  choice: भूमि में
  rationale: यहाँ वर्णनात्मक संबंध ‘घोर अंधकार की भूमि’ के रूप में स्वाभाविक और स्रोत के निकट है।
- source_word: צַלְמָוֶת
  choice: घोर अंधकार
  rationale: संदर्भ में यह अत्यंत गहरे अंधकार या विषाद का बोध करा सकता है; पारंपरिक ‘मृत्यु की छाया’ को पादटिप्पणी में रखा गया है।
- source_word: אוֹר
  choice: ज्योति
  rationale: पहले आए समान शब्द की पुनरावृत्ति साहित्यिक प्रभाव के लिए सुरक्षित रखी गई है।
- source_word: נָגַהּ
  choice: चमकी है
  rationale: क्रिया का मूल अर्थ प्रकाश देना या चमकना है; यह सीधा और स्वाभाविक हिंदी रूप है।
- source_word: עֲלֵיהֶם
  choice: उन पर
  rationale: इब्रानी पूर्वसर्ग का सीधा अर्थ ‘उन पर’ है और हिंदी में भी यही स्वाभाविक है।
theological_decisions:
- issue: मसीह-संबंधी महत्त्व रखने वाले भविष्यसूचक संदर्भ में צַלְמָוֶת का अनुवाद
  choice: घोर अंधकार
  alternative: मृत्यु की छाया
  rationale: यह इब्रानी पद इस संदर्भ में संभवतः अत्यंत गहरे अंधकार का मुहावरेदार बोध देता है, पर मृत्यु-संबंधी पारंपरिक व्युत्पत्ति और अनुवाद भी महत्त्वपूर्ण हैं। मुख्य पाठ संभावित प्रासंगिक अर्थ देता है और पादटिप्पणी वास्तविक वैकल्पिक अर्थ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘अंधकार’, ‘ज्योति’ और ‘भूमि’ मूल काव्यात्मक बिंब को बनाए रखते हैं। पादटिप्पणी चिह्न मुख्य पाठ में संबंधित पद के बाद रखा गया है।
