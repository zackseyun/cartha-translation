  edition: WLC
  text: וַ/יִּגְזֹ֤ר עַל יָמִין֙ וְ/רָעֵ֔ב וַ/יֹּ֥אכַל עַל שְׂמֹ֖אול וְ/לֹ֣א שָׂבֵ֑עוּ אִ֥ישׁ בְּשַׂר זְרֹע֖/וֹ יֹאכֵֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/019.yaml
  text: He cuts on the right[a], but is hungry; he eats on the left, but is not satisfied[b]. Each one eats the flesh of his own arm.
translation:
  language: hi
  text: वह दाहिनी ओर काटता है[a], फिर भी भूखा रहता है; वह बाईं ओर खाता है, फिर भी वे तृप्त नहीं होते[b]। हर एक अपनी ही बाँह का मांस खाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह दाहिनी ओर झपटता है … वह बाईं ओर निगलता है।” हिब्रू बिंब साधारण भोजन के बजाय हिंसक ढंग से भोजन हथियाने का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हर एक अपनी बाँह का मांस खाता है।” यह भयावह बिंब अत्यंत भीतरी संघर्ष या आत्म-विनाश को दर्शा सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְזֹר
  choice: वह ... काटता है
  rationale: גזר का मूल अर्थ ‘काटना’ या ‘काट डालना’ है। प्रसंग में हिंसक ढंग से भोजन झपटने या काट लेने का भाव संभव है; मुख्य पाठ में ‘काटता है’ ठोस और अस्पष्ट बिंब को बनाए रखता है।
- source_word: עַל יָמִין
  choice: दाहिनी ओर
  rationale: यह स्थान-सूचक पद है और आगे के ‘बाईं ओर’ के साथ समानांतर संरचना बनाता है।
- source_word: וְרָעֵב
  choice: फिर भी भूखा रहता है
  rationale: पिछली क्रिया के बावजूद भूख बने रहने का विरोधात्मक और परिणामी भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: וַיֹּאכַל
  choice: वह ... खाता है
  rationale: אכל का सामान्य अर्थ ‘खाना’ है; अधिक व्याख्यात्मक ‘निगलना’ के बजाय मूल क्रिया रखी गई है।
- source_word: עַל שְׂמֹאול
  choice: बाईं ओर
  rationale: ‘दाहिनी ओर’ के समानांतर दिशात्मक अभिव्यक्ति को सुरक्षित रखता है।
- source_word: וְלֹא שָׂבֵעוּ
  choice: फिर भी तृप्त नहीं होता
  rationale: שׂבע भोजन से भरने या तृप्त होने को दर्शाता है। हिब्रू के बहुवचन को distributive ‘हर एक’ के संदर्भ में स्वाभाविक हिन्दी एकवचन में व्यक्त किया गया है।
- source_word: אִישׁ
  choice: हर एक
  rationale: एकवचन संज्ञा यहाँ वितरणात्मक अर्थ रखती है; ‘हर एक’ उस व्यक्तिगत और सामूहिक दोनों प्रभाव को स्पष्ट करता है।
- source_word: בְּשַׂר
  choice: मांस
  rationale: ‘मांस’ शरीर-संबंधी भयावह बिंब को सीधे और स्वाभाविक रूप से व्यक्त करता है।
- source_word: זְרֹעוֹ
  choice: अपने ही बाजू का
  rationale: זְרוֹעַ का सामान्य अर्थ ‘बाँह/बाजू’ है। ‘अपने ही’ प्रसंग में निहित आत्म-विनाशकारी संबंध को स्पष्ट करता है, बिना इसे रूपक ‘शक्ति’ में बदलने के।
- source_word: יֹאכֵלוּ
  choice: खाता है
  rationale: हिब्रू में אִישׁ के बाद बहुवचन क्रिया वितरणात्मक रचना है; हिन्दी में ‘हर एक ... खाता है’ स्वाभाविक व्याकरणिक सामंजस्य देता है।
theological_decisions:
- issue: अपने बाजू का मांस खाने के बिंब की व्याख्या
  choice: मुख्य पाठ में शारीरिक बिंब को यथावत रखा गया
  alternative: इसे सीधे ‘आपस में लड़कर अपना विनाश करते हैं’ कहना
  rationale: हिब्रू का हिंसक, संभवतः नरभक्षी या आत्म-विनाशकारी बिंब बहुअर्थी है; उसे किसी एक व्याख्या में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और ठोस भाषा रखी गई है। ‘दाहिनी ओर/बाईं ओर’ का समानांतर संतुलन और भूख-तृप्ति का विरोध सुरक्षित है। मुख्य पाठ में हिब्रू की तीखी शारीरिक छवि को नरम नहीं किया गया।
