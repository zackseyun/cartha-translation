base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/009.yaml
  text: Bricks have fallen[a], but we will rebuild with cut stone; sycamores have been cut down[b], but we will replace them with cedars.
translation:
  language: hi
  text: ईंटें गिर गई हैं, पर हम तराशे हुए पत्थरों[a] से फिर बनाएँगे; शिकमोर-अंजीर के पेड़[b] काट डाले गए हैं, पर हम उनकी जगह देवदार लगाएंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तराशा हुआ पत्थर।”
    reason: lexical_alternative
  - marker: b
    text: “शिकमोर-अंजीर” उस वृक्ष को दर्शाता है जिसे अंग्रेज़ी में sycamore-fig कहते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: לְבֵנִים
  choice: ईंटें
  rationale: यह सामान्य निर्माण में प्रयुक्त ईंटों को दर्शाता है। इब्रानी पाठ स्वयं उनकी निर्माण-सामग्री को स्पष्ट नहीं करता, इसलिए अधिक विशिष्ट ‘कच्ची ईंटें’ नहीं जोड़ा गया।
- source_word: נָפָלוּ
  choice: गिर गई हैं
  rationale: पूर्ण हो चुकी घटना को वर्तमान स्थिति से जोड़ते हुए स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גָזִית
  choice: तराशे हुए पत्थर
  rationale: यह निर्माण के लिए काटकर और गढ़कर तैयार किए गए पत्थर को दर्शाता है तथा साधारण ईंटों के साथ उसका विरोध स्पष्ट रखता है।
- source_word: נִבְנֶה
  choice: हम ... फिर बनाएँगे
  rationale: क्रिया का मूल अर्थ ‘हम बनाएँगे’ है; गिरी हुई ईंटों के संदर्भ में ‘फिर’ पुनर्निर्माण का स्वाभाविक भाव व्यक्त करता है।
- source_word: שִׁקְמִים
  choice: गूलर के पेड़
  rationale: यह क्षेत्र में पाए जाने वाले sycamore-fig वृक्ष का नाम है। ‘गूलर’ हिन्दी में संक्षिप्त और परिचित निकटतम नाम है; सही वानस्पतिक पहचान पादटिप्पणी में दी गई है।
- source_word: גֻּדָּעוּ
  choice: काट डाले गए हैं
  rationale: निष्क्रिय रूप और पेड़ों को काटकर गिरा दिए जाने की पूर्ण घटना, दोनों को स्पष्ट करता है।
- source_word: אֲרָזִים
  choice: देवदार
  rationale: यह अधिक मूल्यवान और मजबूत माने जाने वाले देवदार वृक्षों का बहुवचन है; हिन्दी में जातिवाचक प्रयोग स्वाभाविक है।
- source_word: נַחֲלִיף
  choice: हम उनकी जगह ... लाएँगे
  rationale: हिफ़ील रूप यहाँ एक वस्तु के स्थान पर दूसरी रखने या बदलने का अर्थ देता है। यह हिन्दी अभिव्यक्ति अनावश्यक रूप से यह तय नहीं करती कि पेड़ लगाए जाएँगे या देवदार की लकड़ी निर्माण में लाई जाएगी।
theological_decisions:
- issue: वक्ताओं की घोषणा का स्वर
  choice: बेहतर सामग्री से फिर निर्माण करने का आत्मविश्वासी और चुनौतीपूर्ण निश्चय
  alternative: पुनर्निर्माण का तटस्थ कथन
  rationale: निकटवर्ती संदर्भ इसे न्याय के सामने नम्र पश्चाताप नहीं, बल्कि घमंडी आत्मनिर्भरता की प्रतिक्रिया के रूप में प्रस्तुत करता है। अनुवाद में यह भाव सामग्री के बढ़ते वैभव—ईंट से तराशे पत्थर और गूलर से देवदार—के द्वारा उभरता है, बिना अतिरिक्त व्याख्या जोड़े।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर वाक्य-रचना इब्रानी पद की लय और साधारण सामग्री के बदले अधिक प्रतिष्ठित सामग्री लाने के बढ़ते दावे को सुरक्षित रखती है।
