source:
  edition: WLC
  text: ל/םרבה הַ/מִּשְׂרָ֜ה וּ/לְ/שָׁל֣וֹם אֵֽין קֵ֗ץ עַל כִּסֵּ֤א דָוִד֙ וְ/עַל מַמְלַכְתּ֔/וֹ לְ/הָכִ֤ין אֹתָ/הּ֙ וּֽ/לְ/סַעֲדָ֔/הּ בְּ/מִשְׁפָּ֖ט וּ/בִ/צְדָקָ֑ה מֵ/עַתָּה֙ וְ/עַד עוֹלָ֔ם קִנְאַ֛ת יְהוָ֥ה צְבָא֖וֹת תַּעֲשֶׂה זֹּֽאת־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/006.yaml
  text: Of the increase of the dominion and of peace there will be no end[a], on the throne of David and over his kingdom, to establish it and to uphold it with justice and with righteousness from now on and forever. The zeal of Yahweh of Armies will do this.
translation:
  language: hi
  text: शासन की वृद्धि और शांति का कोई अंत न होगा। दाऊद के सिंहासन पर और उसके राज्य के ऊपर वह शासन करेगा और उसे न्याय और धार्मिकता के साथ अब से सदा तक स्थापित और संभाले रखेगा। सेनाओं का याहवे[a] यह करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सेनाओं का यहोवा”; पारंपरिक अनुवाद, “सेनाओं का प्रभु।”
    reason: दिव्य नाम और צְבָאוֹת के प्रचलित वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: למרבה הַמִּשְׂרָה
  choice: उसके शासन की वृद्धि
  rationale: מִשְׂרָה राजकीय शासन या प्रभुत्व को दर्शाता है, और למרבה उसकी निरंतर वृद्धि का भाव देता है। ‘शासन की वृद्धि’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस अर्थ को सुरक्षित रखता है।
- source_word: וּלְשָׁלוֹם אֵין קֵץ
  choice: और शांति का कोई अंत न होगा
  rationale: שָׁלוֹם में शांति, कुशलता और संपूर्ण भलाई के भाव समाहित हैं। संक्षिप्त ‘शांति’ मूल समानांतरता बनाए रखता है; भविष्यकाल प्रसंग में प्रतिज्ञात शासन की निरंतरता स्पष्ट करता है।
- source_word: עַל כִּסֵּא דָוִד וְעַל מַמְלַכְתּוֹ
  choice: दाऊद की राजगद्दी और उसके राज्य पर शासन करेगा
  rationale: मूल में ‘राजगद्दी पर और राज्य के ऊपर’ की राजकीय छवि है। हिन्दी में क्रिया न जोड़ने पर वाक्य अस्वाभाविक और अधूरा लगता; ‘शासन करेगा’ इसी छवि में निहित अर्थ को स्पष्ट करता है, कोई नया पद या पहचान नहीं जोड़ता।
- source_word: לְהָכִין אֹתָהּ וּלְסַעֲדָהּ
  choice: उसे ... स्थिर और संभाले रखेगा
  rationale: כון का हिफ़ील रूप स्थापित या दृढ़ करने और סעד सहारा देकर बनाए रखने का अर्थ देता है। ‘स्थिर और संभाले रखेगा’ दोनों क्रियाओं का भेद सहज हिन्दी में बनाए रखता है।
- source_word: בְּמִשְׁפָּט וּבִצְדָקָה
  choice: न्याय और धार्मिकता के द्वारा
  rationale: מִשְׁפָּט न्यायपूर्ण शासन और צְדָקָה नैतिक धार्मिकता/सही आचरण को व्यक्त करते हैं। अलग शब्द रखने से मूल युग्म का तनाव और व्यापकता सुरक्षित रहती है।
- source_word: מֵעַתָּה וְעַד עוֹלָם
  choice: अब से लेकर सदा तक
  rationale: यह मुहावरा वर्तमान भविष्यसूचक क्षितिज से आरंभ होकर अनंत काल तक चलने वाली अवधि दर्शाता है।
- source_word: קִנְאַת
  choice: उत्साह
  rationale: कִנְאָה का अर्थ ईर्ष्या या प्रबल उत्साह हो सकता है। यहाँ यह अपनी प्रतिज्ञा पूरी करने के लिए याहवे की प्रबल प्रतिबद्धता को दर्शाता है; ‘उत्साह’ भ्रामक क्षुद्र ईर्ष्या का भाव नहीं लाता।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: יְהוָה को उसके विशिष्ट वाचा-नाम ‘याहवे’ से और צְבָאוֹת को उसके सामान्य अर्थ ‘सेनाएँ’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: दाऊदी प्रतिज्ञा के मसीहाई दायरे को बाद की धर्मवैज्ञानिक पहचान से विस्तार देना
  choice: दाऊद की राजगद्दी, उसके राज्य और अनंत शासन की भाषा को रखा गया है, पर इस पद में कोई अतिरिक्त मसीही पहचान नहीं जोड़ी गई।
  alternative: राजा को अनुवाद में सीधे ‘मसीह’ या किसी बाद की स्पष्ट पहचान से संबोधित करना।
  rationale: मूल पाठ दाऊदी राजवंश और चिरस्थायी शासन का व्यापक मसीहाई क्षितिज देता है, किंतु इस पंक्ति में स्वयं बाद की पहचान को स्पष्ट रूप से नहीं जोड़ता।
- issue: יְהוָה צְבָאוֹת का अनुवाद
  choice: सेनाओं के याहवे
  alternative: सेनाओं का यहोवा; सेनाओं का प्रभु
  rationale: मुख्य पाठ में व्यक्तिगत दिव्य नाम और צְבָאוֹת का ठोस अर्थ सुरक्षित रखा गया है; परिचित पारंपरिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के लिए सुबोध रखी गई है। ‘राजगद्दी’, ‘धार्मिकता’ और ‘याहवे’ जैसे बाइबलीय पद अर्थगत सटीकता के लिए बनाए गए हैं। उपलब्ध हिब्रू पाठ प्रचलित अध्याय-पद क्रम में यशायाह 9:7 से मेल खाता है, यद्यपि अनुरोध में संदर्भ यशायाह 9:6 दिया गया है; मसौदा उपलब्ध मूल-पाठ का ही अनुवाद करता है।
