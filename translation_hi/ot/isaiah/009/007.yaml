source:
  edition: WLC
  text: דָּבָ֛ר שָׁלַ֥ח אֲדֹנָ֖/י בְּ/יַעֲקֹ֑ב וְ/נָפַ֖ל בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/007.yaml
  text: The Lord sent a word into Jacob[a], and it fell on Israel.
translation:
  language: hi
  text: प्रभु ने याकूब को एक वचन भेजा[a], और वह इस्राएल पर आ पड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु ने याकूब के विरुद्ध एक वचन भेजा।” ‘वचन’ का अनुवाद ‘संदेश’ भी हो सकता है।
    reason: בְּיַעֲקֹב दिशात्मक लक्ष्य अथवा, इस न्याय-संदर्भ में, प्रतिकूल लक्ष्य का भाव व्यक्त कर सकता है; דָּבָר का एक स्वाभाविक विकल्प ‘संदेश’ है।
lexical_decisions:
- source_word: דָּבָר
  choice: एक वचन
  rationale: דָּבָר का अर्थ ‘वचन’, ‘संदेश’ या ‘बात’ हो सकता है। ‘वचन’ ईश्वरीय घोषणा की संक्षिप्तता और प्रभावशीलता को बनाए रखता है।
- source_word: שָׁלַח
  choice: भेजा
  rationale: मूल क्रिया का सामान्य अर्थ ‘भेजना’ है; सरल भूतकाल यहाँ स्वाभाविक है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यहाँ יהוה नहीं, बल्कि ईश्वरीय उपाधि אֲדֹנָי है; इसलिए इसे आधुनिक हिन्दी में प्रचलित उपाधि ‘प्रभु’ के रूप में अनूदित किया गया है।
- source_word: בְּיַעֲקֹב
  choice: याकूब में
  rationale: בְּ का मूल स्थानवाचक बल ‘में’ से सुरक्षित रहता है। संदर्भ में लक्ष्य अथवा दिशा का भाव भी संभव है, जिसे पादटिप्पणी में रखा गया है ताकि न्याय-संबंधी अर्थ को मुख्य पाठ में अनावश्यक रूप से निश्चित न किया जाए।
- source_word: וְנָפַל
  choice: और वह ... आ पड़ा
  rationale: נפל का चित्रात्मक अर्थ ‘गिरना/आ पड़ना’ है। ‘आ पड़ा’ हिन्दी में वचन के प्रभावपूर्वक पहुँचने का सजीव रूप बनाए रखता है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल पर
  rationale: נפל के साथ בְּ प्रभाव या लक्ष्य को सूचित करता है; हिन्दी में ‘पर आ पड़ा’ स्वाभाविक है और मूल रूपक को बचाता है।
theological_decisions:
- issue: אֲדֹנָי को ईश्वरीय उपाधि के रूप में प्रस्तुत करना
  choice: प्रभु
  alternative: यहोवा
  rationale: मूल पाठ में אֲדֹנָי है, יהוה नहीं; इसलिए वाचा-नाम के स्थान पर उपाधि का अनुवाद उचित है।
- issue: בְּיַעֲקֹב में संबंधबोधक अव्यय का बल
  choice: याकूब में
  alternative: याकूब के पास / याकूब के विरुद्ध
  rationale: ‘में’ मूल बְּ की अस्पष्टता और वचन के समुदाय के भीतर पहुँचने की छवि को सुरक्षित रखता है। प्रसंग न्याय का है, पर ‘विरुद्ध’ कहने से वह अर्थ मुख्य पाठ में अधिक स्पष्ट कर दिया जाता; इसलिए संभावित दिशात्मक अर्थ पादटिप्पणी में दिया गया है।
- issue: ईश्वरीय वचन के ‘गिरने’ का रूपक
  choice: वह इस्राएल पर आ पड़ा
  alternative: वह इस्राएल तक पहुँचा
  rationale: ‘आ पड़ा’ मूल נפל के रूपक और न्यायकारी प्रभाव को बनाए रखता है; ‘पहुँचा’ उसे सपाट कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और भविष्यद्वक्त्रीय शैली वाला रूप। ‘वचन’ बाइबलीय प्रयोग में परिचित है, जबकि ‘आ पड़ा’ मूल की सजीव छवि को सहज हिन्दी में बनाए रखता है।
