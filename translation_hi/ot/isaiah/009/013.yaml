  yaml_path: translation/ot/isaiah/009/013.yaml
  text: So Yahweh cut off from Israel head and tail[a], palm branch and reed[b], in one day.
translation:
  language: hi
  text: और याहवे ने एक ही दिन में इस्राएल में से सिर और पूँछ[a], खजूर की डाल और सरकंडे[b] को काट डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् राष्ट्र के ऊँचे पद वाले लोगों से लेकर निम्न पद वाले लोगों तक पूरी श्रेणी; अगले पद में इस बिंब की व्याख्या की गई है।
    reason: cross_reference
  - marker: b
    text: या, ‘नरकट।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְרֵת
  choice: काट डाला
  rationale: हिफ़ील रूप यहाँ निर्णायक रूप से अलग कर देने या मिटा देने का भाव रखता है। ‘काट डाला’ न्याय की तीव्रता और मूल बिंब दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित ध्वन्यात्मक रूप में रखा गया है।
- source_word: מִיִּשְׂרָאֵל
  choice: इस्राएल में से
  rationale: מן भीतर से अलग किए जाने का भाव व्यक्त करता है; ‘में से’ इसे स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: רֹאשׁ וְזָנָב
  choice: सिर और पूँछ
  rationale: मूल पाठ के ठोस शारीरिक बिंब को सुरक्षित रखा गया है, क्योंकि अगले पद में उसका अर्थ समझाया जाता है।
- source_word: כִּפָּה
  choice: खजूर की डाल
  rationale: यह शब्द खजूर के वृक्ष के ऊँचे भाग या डाल को सूचित करता है और सरकंडे के साथ ऊँच-नीच का बिंब बनाता है।
- source_word: וְאַגְמוֹן
  choice: सरकंडे
  rationale: אַגְמוֹן दलदली क्षेत्र में उगने वाले नरकट या सरकंडे के लिए प्रयुक्त होता है। यहाँ विभक्ति के कारण ‘सरकंडे को’ स्वाभाविक हिन्दी रूप है।
- source_word: יוֹם אֶחָד
  choice: एक ही दिन में
  rationale: यह न्याय के अचानक और पूर्ण रूप से घटित होने पर बल देने वाला स्वाभाविक हिन्दी प्रयोग है।
- source_word: וַ
  choice: तब
  rationale: कथन को पिछले संदर्भ से जोड़ने वाले वाव को हिन्दी में सहज क्रमसूचक संयोजक ‘तब’ से व्यक्त किया गया है।
theological_decisions:
- issue: रूपक को बनाए रखना या उसका अर्थ मुख्य पाठ में खोल देना
  choice: मुख्य पाठ में ‘सिर और पूँछ, खजूर की डाल और सरकंडा’ का बिंब बनाए रखा गया
  alternative: ‘ऊँचे से नीचे तक सभी अगुवों और लोगों’ जैसा व्याख्यात्मक अनुवाद
  rationale: अगला पद इस रूपक की व्याख्या करता है। इसलिए इसी पद में अर्थ खोल देना मूल की काव्यात्मक संरचना और जानबूझकर रखे गए बिंब को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर बिंबों की संक्षिप्त काव्यात्मकता सुरक्षित है; ‘एक ही दिन में’ को आगे रखकर अचानक घटने वाले न्याय पर स्वाभाविक हिन्दी बल दिया गया है।
