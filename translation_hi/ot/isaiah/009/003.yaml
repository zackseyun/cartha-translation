id: ISA.9.3
reference: Isaiah 9:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י אֶת עֹ֣ל סֻבֳּל֗/וֹ וְ/אֵת֙ מַטֵּ֣ה שִׁכְמ֔/וֹ שֵׁ֖בֶט הַ/נֹּגֵ֣שׂ בּ֑/וֹ הַחִתֹּ֖תָ כְּ/י֥וֹם מִדְיָֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/003.yaml
  text: For the yoke of his burden[a], and the staff on his shoulder[c][b], the rod of his oppressor—you have shattered them as on the day of Midian.
translation:
  language: hi
  text: क्योंकि उसके बोझ का जुआ[a], उसके कंधे पर रखा डंडा और उस पर अत्याचार करने वाले की लाठी—इन सबको तूने मिद्यान के दिन[b] के समान चकनाचूर कर दिया है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके लदे हुए भार का जुआ’ अथवा ‘उसके उत्पीड़न का जुआ’।
    reason: lexical_alternative
  - marker: b
    text: ‘मिद्यान का दिन’ सम्भवतः गिदोन के दिनों में यहोवा द्वारा मिद्यान को पराजित किए जाने की घटना की याद दिलाता है (न्यायियों 7)।
    reason: cross_reference
  - marker: c
    text: इब्रानी में पूर्ण क्रिया है, ‘तूने चकनाचूर कर दिया है।’ यह परमेश्वर की विजय को निश्चित मानकर भविष्य की घटना को पूर्ण रूप में कहने की भविष्यसूचक शैली हो सकती है; कुछ अनुवाद इसे ‘तू चकनाचूर कर देगा’ करते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: עֹל סֻבֳּלוֹ
  choice: उसके बोझ का जुआ
  rationale: עֹל का ठोस बिंब ‘जुआ’ के रूप में रखा गया है और סֻבֳּלוֹ को ‘उसके बोझ’ कहा गया है। इससे लादा हुआ भार और दासता, दोनों का संकेत बना रहता है।
- source_word: מַטֵּה שִׁכְמוֹ
  choice: उसके कंधे पर रखा डंडा
  rationale: מַטֶּה यहाँ दमन के साधन को सूचित करता है। ‘डंडा’ सामान्य और स्पष्ट है, जबकि ‘कंधे पर रखा’ बोझ लादने के दृश्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שֵׁבֶט הַנֹּגֵשׂ בּוֹ
  choice: उस पर अत्याचार करने वाले की लाठी
  rationale: שֵׁבֶט को दंड देने वाली ‘लाठी’ और נֹגֵשׂ को ‘अत्याचार करने वाला’ कहा गया है, जिससे बलपूर्वक दबाने वाले व्यक्ति और उसके हिंसक अधिकार का भाव स्पष्ट रहता है।
- source_word: הַחִתֹּתָ
  choice: तूने ... चकनाचूर कर दिया है
  rationale: חתת के तोड़ने या चूर करने के प्रबल भाव को ‘चकनाचूर कर दिया’ व्यक्त करता है। इब्रानी का द्वितीय पुरुष एकवचन और पूर्ण क्रिया-रूप सुरक्षित रखा गया है; ‘इन सबको’ तीनों पूर्ववर्ती वस्तुओं को स्वाभाविक हिन्दी में समेटता है।
- source_word: כְּיוֹם מִדְיָן
  choice: मिद्यान के दिन के समान
  rationale: ऐतिहासिक तुलना को निकटता से सुरक्षित रखते हुए हिन्दी में स्वाभाविक रूप दिया गया है; यह मिद्यान पर निर्णायक विजय की ओर संकेत करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह शब्द पिछले कथन में वर्णित आनन्द और उद्धार का कारण बताता है, इसलिए कारणसूचक ‘क्योंकि’ उपयुक्त है।
theological_decisions:
- issue: भविष्यसूचक पूर्ण क्रिया और परमेश्वर को सीधा संबोधन
  choice: पूर्ण क्रिया को ‘तूने ... चकनाचूर कर दिया है’ के रूप में, परमेश्वर से सीधे एकवचन संबोधन के साथ रखा गया है।
  alternative: ‘तू ... चकनाचूर कर देगा’ के रूप में भविष्यकाल में अनुवाद करना।
  rationale: इब्रानी भविष्यसूचक वाणी में पूर्ण क्रिया आने वाली विजय को इतना निश्चित दिखा सकती है मानो वह घट चुकी हो। पूर्णता और सीधे संबोधन को बनाए रखने से मूल की अलंकारिक शक्ति तथा कालगत तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। ‘जुआ’, ‘डंडा’ और ‘लाठी’ के ठोस बिंब अलग-अलग रखे गए हैं। ‘उसके’ का संदर्भ मूल की तरह स्पष्ट किए बिना छोड़ा गया है, और परमेश्वर के लिए प्रत्यक्ष एकवचन संबोधन ‘तूने’ सुरक्षित रखा गया है।
