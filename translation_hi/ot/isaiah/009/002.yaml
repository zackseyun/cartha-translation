source:
  edition: WLC
  text: הִרְבִּ֣יתָ הַ/גּ֔וֹי לא הִגְדַּ֣לְתָּ הַ/שִּׂמְחָ֑ה שָׂמְח֤וּ לְ/פָנֶ֨י/ךָ֙ כְּ/שִׂמְחַ֣ת בַּ/קָּצִ֔יר כַּ/אֲשֶׁ֥ר יָגִ֖ילוּ בְּ/חַלְּקָ֥/ם שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/002.yaml
  text: You have multiplied the nation[a]; you have not increased the joy. They rejoice before you as with the joy at harvest[b], as men exult when they divide spoil.
translation:
  language: hi
  text: तूने राष्ट्र को बढ़ाया; तूने आनन्द को नहीं बढ़ाया[a]। वे तेरे सामने ऐसे आनन्दित हुए, जैसे कटनी के समय आनन्द होता है, और जैसे लूट का माल बाँटते समय लोग हर्षित होते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन अनुवाद और अनेक आधुनिक अनुवाद यहाँ “तूने उसका आनन्द बढ़ाया” पढ़ते हैं; यह इब्रानी לֹא (“नहीं”) के स्थान पर לוֹ (“उसके लिए/उसका”) जैसे पाठ को दर्शाता है।
    reason: textual_variant
lexical_decisions:
- source_word: הִרְבִּיתָ
  choice: बढ़ाया
  rationale: रבה के हिफ़ील रूप का अर्थ यहाँ संख्या या विस्तार में बढ़ाना है। ‘बढ़ाया’ राष्ट्र के विस्तार को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַגּוֹי
  choice: राष्ट्र
  rationale: एकवचन גוי के सामूहिक और राजनीतिक-सामुदायिक भाव को ‘राष्ट्र’ निकटता से सुरक्षित रखता है।
- source_word: לֹא הִגְדַּלְתָּ הַשִּׂמְחָה
  choice: तूने आनन्द को नहीं बढ़ाया
  rationale: प्रदत्त मसोराई पाठ में לֹא स्पष्ट रूप से ‘नहीं’ है। कठिन अर्थ को सहज बनाने के लिए पाठ में मौन संशोधन नहीं किया गया।
- source_word: שָׂמְחוּ לְפָנֶיךָ
  choice: वे तेरे सामने ... आनन्दित हुए
  rationale: क्रिया के पूर्ण रूप को भूतकाल में रखा गया और לְפָנֶיךָ का परमेश्वर की उपस्थिति की ओर संकेत ‘तेरे सामने’ से सुरक्षित किया गया।
- source_word: כְּשִׂמְחַת בַּקָּצִיר
  choice: जैसे कटनी के समय आनन्द होता है
  rationale: यह उपमा कटनी के अवसर के सामूहिक उल्लास को दर्शाती है; ‘कटनी’ सामान्य और बाइबिलीय हिन्दी में स्पष्ट है।
- source_word: כַּאֲשֶׁר יָגִילוּ
  choice: जैसे ... लोग हर्षित होते हैं
  rationale: גיל तीव्र उल्लास व्यक्त करता है। ‘हर्षित होते हैं’ इस ऊँचे भाव को सहज हिन्दी में रखता है और बहुवचन कर्ता को सामान्य ‘लोग’ से स्पष्ट करता है।
- source_word: בְּחַלְּקָם שָׁלָל
  choice: लूट का माल बाँटते समय
  rationale: यह युद्ध में प्राप्त माल के विभाजन का चित्र है। ‘लूट का माल’ आधुनिक पाठक के लिए ‘लूट’ अकेले से अधिक स्पष्ट है।
theological_decisions:
- issue: दूसरे खंड में לֹא (‘नहीं’) और לוֹ (‘उसके लिए/उसका’) का पाठांतर
  choice: मुख्य पाठ में मसोराई पाठ के अनुसार ‘तूने आनन्द को नहीं बढ़ाया’
  alternative: ‘तूने उसका आनन्द बढ़ाया’
  rationale: प्रदत्त WLC पाठ לֹא पढ़ता है। यद्यपि प्रसंग में वैकल्पिक पाठ अधिक सहज है और कुछ प्राचीन साक्ष्य उसका समर्थन करते हैं, मूल पाठ की कठिनाई और धर्मवैचारिक तनाव को मौन रूप से दूर नहीं किया गया; पाठांतर पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। परमेश्वर को संबोधन मूल के एकवचन निकट संबोधन के अनुरूप ‘तू/तेरे’ में रखा गया है। मसोराई पाठ की असहज नकारात्मक पंक्ति को मुख्य पाठ में सुरक्षित रखा गया है।
