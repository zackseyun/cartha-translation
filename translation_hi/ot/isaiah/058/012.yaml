source:
  edition: WLC
  text: וּ/בָנ֤וּ מִמְּ/ךָ֙ חָרְב֣וֹת עוֹלָ֔ם מוֹסְדֵ֥י דוֹר וָ/ד֖וֹר תְּקוֹמֵ֑ם וְ/קֹרָ֤א לְ/ךָ֙ גֹּדֵ֣ר פֶּ֔רֶץ מְשֹׁבֵ֥ב נְתִיב֖וֹת לָ/שָֽׁבֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/012.yaml
  text: Those from among you will rebuild the ancient ruins[a]; you will raise up the foundations of generation after generation, and you will be called the repairer of the breach[b], the restorer of paths for dwelling.
translation:
  language: hi
  text: तुममें से लोग प्राचीन खंडहरों को फिर बनाएँगे; तुम पीढ़ी-दर-पीढ़ी की नींवों को फिर खड़ा करोगे[a]। तुम्हारा नाम “दरार को पाटनेवाला” और “बसने के लिए मार्गों को बहाल करनेवाला”[b] रखा जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पीढ़ी और पीढ़ी की नींवें”; अर्थ “अनेक पीढ़ियों की नींवें” या “बहुत पुरानी नींवें” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “रहने-बसने के लिए पथों को बहाल करनेवाला” या “निवास के लिए गलियों को फिर ठीक करनेवाला” भी हो सकता है। अंतिम पदबंध संभवतः समुदाय को दोबारा बसने योग्य बनाने की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנוּ מִמְּךָ
  choice: तुममें से लोग फिर बनाएँगे
  rationale: बहुवचन क्रिया के बाद מִמְּךָ का अर्थ संबोधित व्यक्ति या समुदाय में से निकलनेवाले लोग है; पुनर्स्थापना के प्रसंग में בנה के लिए ‘फिर बनाएँगे’ स्वाभाविक है।
- source_word: חָרְבוֹת עוֹלָם
  choice: प्राचीन खंडहरों
  rationale: חָרְבוֹת उजड़े हुए स्थानों या खंडहरों को और עוֹלָם यहाँ उनकी बहुत पुरानी अवस्था को सूचित करता है।
- source_word: מוֹסְדֵי דוֹר וָדוֹר
  choice: पीढ़ी-दर-पीढ़ी की नींवों
  rationale: यह हिब्रू पदबंध शाब्दिक रूप से ‘पीढ़ी और पीढ़ी की नींवें’ है और लगातार अनेक पीढ़ियों से जुड़ी प्राचीन नींवों का भाव देता है।
- source_word: תְּקוֹמֵם
  choice: फिर खड़ा करोगे
  rationale: קום का कारक रूप किसी वस्तु को खड़ा करने का चित्र बनाए रखता है; ‘फिर’ खंडहरों की पुनर्स्थापना का प्रसंग स्पष्ट करता है।
- source_word: וְקֹרָא לְךָ
  choice: तुम्हारा नाम … रखा जाएगा
  rationale: हिब्रू की अनिश्चित कर्ता वाली एकवचन क्रिया को हिन्दी में कर्मवाच्य रूप से व्यक्त करना स्वाभाविक है और प्राप्त होनेवाली उपाधि का भाव सुरक्षित रहता है।
- source_word: גֹּדֵר פֶּרֶץ
  choice: दरार को पाटनेवाला
  rationale: גדר किसी टूटे या खुले स्थान को बंद करने और פֶּרֶץ टूटन, सेंध या दरार को सूचित करता है; चुना हुआ रूप रूपक को खुला रखता है।
- source_word: מְשֹׁבֵב נְתִיבוֹת
  choice: मार्गों को बहाल करनेवाला
  rationale: מְשֹׁבֵב में वापस लाने या पुनर्स्थापित करने का भाव है और נְתִיבוֹת पथों, मार्गों या गलियों के लिए प्रयुक्त हो सकता है।
- source_word: לָשָׁבֶת
  choice: बसने के लिए
  rationale: यह धातुरूप उद्देश्य या परिणाम व्यक्त करता है—मार्गों की ऐसी पुनर्स्थापना जिससे फिर निवास संभव हो।
