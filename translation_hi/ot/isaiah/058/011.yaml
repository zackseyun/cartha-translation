base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/011.yaml
  text: And Yahweh will guide you continually[a], and satisfy your soul in parched places, and strengthen your bones; and you will be like a well-watered garden[c][b], and like a spring of water whose waters do not fail.
translation:
  language: hi
  text: याहवे निरन्तर तुम्हारी अगुवाई करेगा। वह झुलसे हुए स्थानों में तुम्हारे प्राण को तृप्त करेगा[a] और तुम्हारी हड्डियों को सुदृढ़ करेगा[b]। तुम भली-भाँति सींचे हुए बगीचे के समान और ऐसे जल-स्रोत के समान होगे, जिसका जल कभी नहीं चूकता[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सूखे प्रदेशों में” अथवा “शुष्क स्थानों में।” इब्रानी शब्द धूप से झुलसी, अत्यन्त सूखी परिस्थितियों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “तुम्हारी हड्डियों को पुष्ट करेगा” अथवा “तुम्हारी हड्डियों को तरोताज़ा करेगा।” यहाँ प्रयुक्त इब्रानी क्रिया दुर्लभ है और सशक्त या स्फूर्त करने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “जिसका जल झूठा सिद्ध नहीं होता”—अर्थात जिसका जल विफल नहीं होता या आवश्यकता के समय निराश नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָחֲךָ
  choice: तुम्हारी अगुवाई करेगा
  rationale: נחה का सामान्य अर्थ मार्ग दिखाना या अगुवाई करना है। यह पद में ईश्वरीय निर्देशन की प्रतिज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यन्तरित किया गया है।
- source_word: תָּמִיד
  choice: निरन्तर
  rationale: यह चलते रहनेवाले, नियमित ईश्वरीय मार्गदर्शन का भाव संक्षिप्त और गरिमापूर्ण हिन्दी में देता है।
- source_word: וְהִשְׂבִּיעַ ... נַפְשֶׁךָ
  choice: तुम्हारे प्राण को तृप्त करेगा
  rationale: שבע के हिफ़ील रूप में आवश्यकता को पूरी तरह भर देने का भाव है। נֶפֶשׁ यहाँ व्यक्ति के जीवित, चाहने और आवश्यकता अनुभव करनेवाले प्राण को सूचित करता है; ‘प्राण’ काव्यात्मक गहराई बचाता है और केवल अमूर्त ‘आत्मा’ तक अर्थ सीमित नहीं करता।
- source_word: בְּצַחְצָחוֹת
  choice: सूखे स्थानों में भी
  rationale: यह दुर्लभ बहुवचन शब्द झुलसी हुई, शुष्क परिस्थितियों या प्रदेशों को दर्शाता है। ‘सूखे स्थानों’ से पर्यावरणीय चित्र स्पष्ट रहता है; ‘भी’ हिन्दी में प्रतिकूल परिस्थिति के बीच तृप्ति का निहित विरोध स्वाभाविक बनाता है।
- source_word: וְעַצְמֹתֶיךָ יַחֲלִיץ
  choice: तुम्हारी हड्डियों में नई शक्ति भरेगा
  rationale: यहाँ חלץ का अर्थ अनिश्चित है, पर सन्दर्भ में पुष्ट, सशक्त या स्फूर्त करने का भाव सम्भावित है। चयन ठोस ‘हड्डियों’ के बिम्ब को रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: כְּגַן רָוֶה
  choice: भली-भाँति सींचे हुए बगीचे के समान
  rationale: רוה भरपूर पानी पाए हुए या सिंचित होने का भाव देता है। यह रूप उर्वरता और प्रचुर सिंचाई दोनों स्पष्ट करता है।
- source_word: וּכְמוֹצָא מַיִם
  choice: जल-स्रोत के समान
  rationale: מוֹצָא पानी के निकलने के स्थान या स्रोत को बताता है। ‘जल-स्रोत’ किसी विशेष कृत्रिम संरचना को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: אֲשֶׁר לֹא יְכַזְּבוּ מֵימָיו
  choice: जिसका पानी कभी नहीं चूकता
  rationale: כזב का मूल भाव झूठा या अविश्वसनीय सिद्ध होना है। पानी के विषय में मुहावरे का आशय है कि स्रोत आवश्यकता के समय विफल नहीं होता; ‘कभी नहीं चूकता’ उस सजीव रूपक को हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में प्रयुक्त व्यक्तिगत नाम को उपाधि ‘प्रभु’ से नहीं बदला गया। ‘याहवे’ उपलब्ध स्वर-साक्ष्य पर आधारित प्रचलित विद्वत्तापूर्ण लिप्यन्तरण का हिन्दी रूप है।
- issue: נֶפֶשׁ का मानवशास्त्रीय अर्थ
  choice: तुम्हारे प्राण
  alternative: तुम्हारी आत्मा / तुम्हें
  rationale: ‘प्राण’ मूल शब्द के जीवन, अभिलाषा और सम्पूर्ण जीवित व्यक्ति से जुड़े व्यापक काव्यात्मक भाव को बनाए रखता है। इससे पद को केवल देह-विरुद्ध अमूर्त आत्मा के कथन के रूप में निश्चित नहीं किया जाता।
- issue: חלץ का कठिन अर्थ
  choice: हड्डियों में नई शक्ति भरेगा
  alternative: हड्डियों को पुष्ट करेगा / हड्डियों को तरोताज़ा करेगा
  rationale: दुर्लभ क्रिया के कारण अर्थगत अनिश्चितता को पादटिप्पणी में रखा गया है। मुख्य पाठ सन्दर्भानुकूल शारीरिक नवीकरण बताता है, पर किसी विशिष्ट चिकित्सकीय या आध्यात्मिक अर्थ को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप रखा गया है। सम्बोधन एकवचन पुल्लिंग है, जैसा इब्रानी में है; हिन्दी में ‘तुम’ इसे सहज और व्यापक रूप से पठनीय बनाता है। वाक्य को तीन भागों में बाँटकर समानान्तर प्रतिज्ञाओं और अन्तिम दो उपमाओं को स्पष्ट किया गया है।
