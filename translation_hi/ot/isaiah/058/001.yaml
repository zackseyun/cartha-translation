  text: קְרָ֤א בְ/גָרוֹן֙ אַל תַּחְשֹׂ֔ךְ כַּ/שּׁוֹפָ֖ר הָרֵ֣ם קוֹלֶ֑/ךָ וְ/הַגֵּ֤ד לְ/עַמִּ/י֙ פִּשְׁעָ֔/ם וּ/לְ/בֵ֥ית יַעֲקֹ֖ב חַטֹּאתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/001.yaml
  text: Cry out with your throat[a]; do not hold back. Raise your voice like a trumpet, and declare to my people their rebellion[b], and to the house of Jacob their sins.
translation:
  language: hi
  text: गला खोलकर पुकार; अपने को मत रोक। तुरही[a] के समान अपनी आवाज़ ऊँची कर। मेरी प्रजा को उनका विद्रोह[b] और याकूब के घराने को उनके पाप बता दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शोफ़ार, अर्थात संकेत देने या सार्वजनिक घोषणा करने के लिए फूँका जाने वाला सींग-वाद्य।
    reason: cultural_note
  - marker: b
    text: या “अपराध”; इब्रानी शब्द में परमेश्वर के विरुद्ध जानबूझकर विद्रोह करने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָא בְגָרוֹן
  choice: गला खोलकर पुकार
  rationale: इब्रानी में शाब्दिक रूप से ‘गले से पुकार’ है। यह चयन उसकी शारीरिक सजीवता और ऊँची, निर्भीक घोषणा—दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אַל תַּחְשֹׂךְ
  choice: अपने को मत रोक
  rationale: यह निषेध आवाज़ या घोषणा को दबाने और पीछे हटने से मना करता है; हिन्दी में यह सीधा और स्वाभाविक है।
- source_word: כַּשּׁוֹפָר
  choice: नरसिंगे के समान
  rationale: שׁוֹפָר संकेत और सार्वजनिक घोषणा के लिए प्रयुक्त सींग का वाद्य था। ‘नरसिंगा’ सामान्य ‘तुरही’ की अपेक्षा उसके सींगनुमा रूप को अधिक निकटता से बनाए रखता है।
- source_word: הָרֵם קוֹלֶךָ
  choice: अपनी आवाज़ ऊँची कर
  rationale: यह इब्रानी मुहावरे का स्पष्ट और प्रचलित हिन्दी समतुल्य है तथा आज्ञा का बल बनाए रखता है।
- source_word: וְהַגֵּד
  choice: बता दे
  rationale: संदर्भ में यह सीधे और स्पष्ट रूप से अपराध प्रकट करने की आज्ञा है। ‘बता दे’ साधारण पाठक के लिए स्वाभाविक है और आदेश की तीव्रता रखता है।
- source_word: לְעַמִּי
  choice: मेरी प्रजा को
  rationale: यह परमेश्वर और लोगों के बीच व्यक्त अधिकार और संबंध को सीधे बनाए रखता है।
- source_word: פִּשְׁעָם
  choice: उसका विद्रोह
  rationale: פֶּשַׁע केवल सामान्य गलती नहीं, बल्कि जानबूझकर की गई अवज्ञा या बगावत का भाव रख सकता है। सामूहिक संज्ञा ‘प्रजा’ के साथ हिन्दी में एकवचन सर्वनाम स्वाभाविक है।
- source_word: וּלְבֵית יַעֲקֹב
  choice: और याकूब के घराने को
  rationale: यह covenantal/national designation को पारंपरिक परंतु सुबोध हिन्दी में अलग पदबंध के रूप में सुरक्षित रखता है।
- source_word: חַטֹּאתָם
  choice: उसके पाप
  rationale: इब्रानी में ‘पाप’ बहुवचन है। ‘घराना’ सामूहिक एकवचन होने के कारण हिन्दी में ‘उसके’ स्वाभाविक है, जबकि ‘पाप’ की बहुलता बनी रहती है।
theological_decisions:
- issue: ‘मेरी प्रजा’ और ‘याकूब के घराने’ का परस्पर संबंध
  choice: दोनों अभिव्यक्तियों को समानांतर पर अलग-अलग रखा गया है।
  alternative: दूसरे पदबंध को पहले का केवल स्पष्टीकरण मानकर दोनों को एक ही अभिव्यक्ति में मिला देना।
  rationale: इब्रानी में दोनों अलग समानांतर कर्म हैं। इन्हें बनाए रखने से वाचा-संबंधी भाषा और भविष्यद्वाणी के अभियोग का अलंकारिक बल सुरक्षित रहता है, बिना उनके संबंध को आवश्यकता से अधिक निश्चित किए।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘गला खोलकर’ मूल की सजीव देहात्मक छवि को स्वाभाविक हिन्दी में व्यक्त करता है। आज्ञार्थक एकवचन रूप भविष्यद्वक्ता को दिए गए सीधे आदेश का बल बनाए रखते हैं।
