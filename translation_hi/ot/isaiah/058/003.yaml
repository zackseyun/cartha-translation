source:
  edition: WLC
  text: לָ֤/מָּה צַּ֨מְנוּ֙ וְ/לֹ֣א רָאִ֔יתָ עִנִּ֥ינוּ נַפְשֵׁ֖/נוּ וְ/לֹ֣א תֵדָ֑ע הֵ֣ן בְּ/י֤וֹם צֹֽמְ/כֶם֙ תִּמְצְאוּ חֵ֔פֶץ וְ/כָל עַצְּבֵי/כֶ֖ם תִּנְגֹּֽשׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/003.yaml
  text: Why have we fasted[a], and you have not seen? Why have we humbled ourselves, and you do not notice? Look, on the day of your fast you pursue your own pleasure[c][b], and you drive all your laborers hard.
translation:
  language: hi
  text: “हमने उपवास क्यों किया, जब तूने देखा ही नहीं? हमने अपने आपको कष्ट दिया[a], जब तूने ध्यान ही नहीं दिया? देखो, अपने उपवास के दिन तुम अपनी ही इच्छा के पीछे चलते हो[b] और अपने सभी मज़दूरों से कठोरता से काम लेते हो[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका शाब्दिक अर्थ है, “हमने अपने प्राण को दुःख दिया।” इसका अनुवाद “हमने अपने आप को दीन किया” या “हमने अपनी इच्छाओं से वंचित रखा” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “अपना ही सुख खोजते हो,” “अपनी ही इच्छा पूरी करते हो,” या संभवतः “अपना ही कारोबार करते हो” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इसका अनुवाद “अपने सभी कामगारों पर अत्याचार करते हो” भी हो सकता है। इब्रानी शब्द मज़दूरों अथवा उनसे कठोरता से वसूले जाने वाले श्रम/काम—दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: क्यों
  rationale: लोगों की शिकायत को सीधे प्रश्न के रूप में प्रस्तुत करता है।
- source_word: צַּמְנוּ
  choice: हमने उपवास किया
  rationale: काल-संदर्भ में पूर्ण हो चुके धार्मिक कर्म और उसके आधार पर की जा रही वर्तमान शिकायत, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רָאִיתָ
  choice: तूने देखा ही नहीं
  rationale: मूल क्रिया ‘देखना’ को बनाए रखता है; ‘ही’ शिकायत के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עִנִּינוּ נַפְשֵׁנוּ
  choice: हमने अपने आप को दीन किया
  rationale: शाब्दिक रूप से ‘अपने प्राण/स्वयं को दुःख देना’ है; यहाँ उपवास से जुड़ी आत्म-दीनता या आत्म-वंचना का भाव है। मुख्य पाठ में गरिमापूर्ण और समझने योग्य मुहावरा चुना गया है, तथा अन्य अर्थ पादटिप्पणी में रखे गए हैं।
- source_word: תֵדָע
  choice: तूने ध्यान ही नहीं दिया
  rationale: समानांतर ‘देखा’ के साथ यहाँ केवल बौद्धिक ज्ञान नहीं, बल्कि ध्यान देने या संज्ञान लेने का भाव है।
- source_word: הֵן
  choice: देखो
  rationale: ईश्वरीय प्रत्युत्तर की ओर ध्यान खींचने वाला आधुनिक, स्वाभाविक और गरिमापूर्ण रूप।
- source_word: בְּיוֹם צֹמְכֶם
  choice: अपने उपवास के दिन भी
  rationale: मूल कालवाचक अभिव्यक्ति को स्पष्ट रखता है; ‘भी’ धार्मिक आचरण और व्यवहार के विरोधाभास को हिन्दी में उभारता है।
- source_word: תִּמְצְאוּ חֵפֶץ
  choice: तुम अपनी ही इच्छा पूरी करने में लगे रहते हो
  rationale: מצא + חפץ का आशय यहाँ अपने सुख, इच्छा, हित या कामकाज में लगे रहने से हो सकता है। चुना हुआ रूप आत्महित की आलोचना को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: עַצְּבֵיכֶם
  choice: अपने सभी मज़दूरों
  rationale: संदर्भ में यह रूप परिश्रम करने वालों अथवा उनसे लिए जाने वाले श्रम—दोनों की ओर संकेत कर सकता है। मुख्य पाठ में सामाजिक आरोप को स्पष्ट करने वाला संभावित व्यक्तिवाचक अर्थ चुना गया है।
- source_word: תִּנְגֹּשׂוּ
  choice: से कठोरता से काम लेते हो
  rationale: क्रिया में दबाव डालने, कठोरता बरतने अथवा श्रम वसूलने का भाव है। यह हिन्दी रूप आर्थिक शोषण का आशय स्पष्ट करता है, बिना अर्थ को अनावश्यक रूप से बढ़ाए।
theological_decisions:
- issue: उपवास के साथ जुड़ी आत्म-दीनता का स्वरूप
  choice: अपने आप को दीन करना
  alternative: अपने आप को दुःख देना अथवा अपनी इच्छाओं से वंचित रखना
  rationale: मूल मुहावरा शारीरिक/आत्मिक आत्म-वंचना और नम्रता दोनों का संकेत दे सकता है। मुख्य पाठ धार्मिक आत्म-दीनता को व्यक्त करता है और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखता है।
- issue: दूसरे अर्धांश का सामाजिक आरोप
  choice: अपने हित में लगे रहना और मज़दूरों से कठोरता से काम लेना
  alternative: अपना कारोबार करना और अपने सारे श्रम/काम वसूल करना
  rationale: חפץ और נגשׂ का संयोजन धार्मिक उपवास के बीच आत्महित और श्रमिकों पर दबाव की आलोचना को संभवतः व्यक्त करता है। फिर भी संज्ञाओं की वास्तविक अर्थगत अस्पष्टता पादटिप्पणियों में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सीधी किंतु गरिमापूर्ण शैली। लोगों के संबोधन में एकवचन ‘तू’ और ईश्वरीय उत्तर में बहुवचन ‘तुम’ मूल इब्रानी के व्यक्ति-वचन भेद को सुरक्षित रखते हैं। सभी अर्थगत विकल्पों को मुख्य पाठ में ठूँसने के बजाय पादटिप्पणियों में रखा गया है।
