  text: אָ֗ז תִּתְעַנַּג֙ עַל יְהוָ֔ה וְ/הִרְכַּבְתִּ֖י/ךָ עַל בָּ֣מֳותֵי אָ֑רֶץ וְ/הַאֲכַלְתִּ֗י/ךָ נַחֲלַת֙ יַעֲקֹ֣ב אָבִ֔י/ךָ כִּ֛י פִּ֥י יְהוָ֖ה דִּבֵּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/014.yaml
  text: then you will delight yourself in Yahweh[a], and I will make you ride on the heights of the earth; I will feed you with the inheritance of Jacob your father[b], for the mouth of Yahweh has spoken.
translation:
  language: hi
  text: 'तब तुम याहवे में आनन्द पाओगे,


    और मैं तुम्हें पृथ्वी की ऊँचाइयों पर चलाऊँगा[a];


    मैं तुम्हें तुम्हारे पिता याकूब की विरासत का उपभोग कराऊँगा[b],


    क्योंकि याहवे के मुख से यह कहा गया है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पृथ्वी के ऊँचे स्थानों पर’ अथवा ‘देश की ऊँचाइयों पर’।
    reason: lexical_alternative
  - marker: b
    text: ‘तुम्हारे पिता याकूब’ वाचा-परिवार की भाषा है; यहाँ याकूब से आशय इस्राएली लोगों के पूर्वज से है।
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְעַנַּג עַל
  choice: में आनन्द पाओगे
  rationale: हित्पाएल रूप गहरे आनन्द का अनुभव करने का भाव देता है। ‘में आनन्द पाना’ आधुनिक हिन्दी में स्वाभाविक है और याहवे को आनन्द का केंद्र बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके नाम का लिप्यंतरण किया गया है।
- source_word: וְהִרְכַּבְתִּיךָ
  choice: मैं तुम्हें ... सवारी कराऊँगा
  rationale: हिफ़ील रूप का कारणवाचक अर्थ—‘सवारी करवाना’—स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित है।
- source_word: בָּמוֹתֵי אָרֶץ
  choice: पृथ्वी की ऊँचाइयों पर
  rationale: मूल रूपक को बनाए रखा गया है और इसे सैन्य विजय, भौगोलिक ऊँचाई या मूर्तिपूजक ऊँचे स्थानों के अर्थ तक सीमित नहीं किया गया।
- source_word: וְהַאֲכַלְתִּיךָ
  choice: मैं तुम्हें ... से तृप्त करूँगा
  rationale: अक्षरशः ‘मैं तुम्हें खिलाऊँगा’ है। विरासत जैसी अमूर्त वस्तु के साथ हिन्दी में ‘से तृप्त करूँगा’ पोषण और भरपूर उपभोग की खाद्य-छवि को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נַחֲלַת יַעֲקֹב אָבִיךָ
  choice: तुम्हारे पिता याकूब की विरासत
  rationale: ‘विरासत’ वाचा-संबंधी उत्तराधिकार का भाव रखती है। ‘पिता याकूब’ की पारिवारिक भाषा को मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: כִּי פִּי יְהוָה דִּבֵּר
  choice: क्योंकि याहवे के मुख ने कहा है
  rationale: मूल की गंभीर भविष्यवाणी-सूचक अभिव्यक्ति ‘याहवे के मुख’ को संक्षिप्त करके केवल ‘याहवे ने कहा’ नहीं किया गया।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; उसका लिप्यंतरण नाम और उपाधि के अंतर को सुरक्षित रखता है।
- issue: ‘पृथ्वी की ऊँचाइयों’ का आशय
  choice: रूपक को बिना सीमित व्याख्या के बनाए रखना
  alternative: देश पर विजयी शासन; देश में समृद्धि; देश के ऊँचे स्थान
  rationale: यह पद उन्नति, सुरक्षा, विजय या आशीष की कई परस्पर संबद्ध ध्वनियाँ रख सकता है; मुख्य पाठ किसी एक को निर्णायक नहीं बनाता।
- issue: ‘याकूब तुम्हारा पिता’ की वाचा-परिवार भाषा
  choice: पिता याकूब
  alternative: तुम्हारे पूर्वज याकूब
  rationale: शाब्दिक पारिवारिक संबोधन सामूहिक वाचा-पहचान को व्यक्त करता है; आधुनिक पाठक के लिए उसका आशय पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, काव्यात्मक और गरिमापूर्ण रखी गई है। समानांतर पंक्तियाँ मूल की भविष्यवाणी-कविता को दर्शाती हैं। ‘याहवे के मुख’ और ‘पृथ्वी की ऊँचाइयों’ जैसी मूल छवियों को सहजता के नाम पर हटाया नहीं गया।
