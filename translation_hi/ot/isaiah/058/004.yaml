source:
  edition: WLC
  text: הֵ֣ן לְ/רִ֤יב וּ/מַצָּה֙ תָּצ֔וּמוּ וּ/לְ/הַכּ֖וֹת בְּ/אֶגְרֹ֣ף רֶ֑שַׁע לֹא תָצ֣וּמוּ כַ/יּ֔וֹם לְ/הַשְׁמִ֥יעַ בַּ/מָּר֖וֹם קוֹלְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/004.yaml
  text: Look[a], you fast for strife and contention, and to strike with a wicked fist[b]. You are not fasting today to make your voice heard on high.
translation:
  language: hi
  text: देखो, तुम झगड़े और कलह के लिए, और दुष्टता की मुट्ठी से मारने के लिए उपवास रखते हो[a]। आज तुम जैसा उपवास रखते हो, वैसा उपवास अपनी आवाज़ ऊँचाई पर सुनाने के लिए नहीं रखते[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “दुष्टता की मुट्ठी से।”
    reason: lexical_alternative
  - marker: b
    text: “ऊँचाई पर” से ऊर्ध्व या स्वर्गीय क्षेत्र का बोध हो सकता है—अर्थात अपनी आवाज़ परमेश्वर तक पहुँचाना।
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह शब्द ध्यान खींचते हुए जोरदार भविष्यद्वक्तापूर्ण फटकार आरम्भ करता है; ‘देखो’ आधुनिक हिन्दी में स्वाभाविक और प्रभावशाली है।
- source_word: לְרִיב וּמַצָּה
  choice: झगड़े और कलह के लिए
  rationale: दोनों संज्ञाएँ विवाद और संघर्ष के निकटार्थक पहलुओं को व्यक्त करती हैं; यह युग्म मूल की समानांतरता बनाए रखता है।
- source_word: תָּצוּמוּ
  choice: उपवास रखते हो
  rationale: सन्दर्भ में द्वितीय पुरुष बहुवचन अपूर्ण क्रिया वर्तमान में चल रहे या अभ्यस्त आचरण पर भविष्यद्वक्तापूर्ण फटकार व्यक्त करती है।
- source_word: וּלְהַכּוֹת
  choice: और ... मारते हो
  rationale: हिफ़ील infinitive उद्देश्य या परिणामी आचरण व्यक्त करता है। हिन्दी में समन्वित क्रिया ‘मारते हो’ आरोप को अधिक स्वाभाविक ढंग से प्रस्तुत करती है।
- source_word: בְּאֶגְרֹף רֶשַׁע
  choice: दुष्ट मुट्ठी से
  rationale: यह मूल की सघन अभिव्यक्ति को निकटता से रखता है और हिंसा की नैतिक दुष्टता भी स्पष्ट करता है। अधिक शाब्दिक संबंध पादटिप्पणी में दिया गया है।
- source_word: לֹא תָצוּמוּ כַיּוֹם
  choice: आज तुम इस तरह उपवास नहीं कर रहे
  rationale: ‘आज/आज की तरह’ के तुलनात्मक-कालिक बल को रखते हुए वर्तमान फटकार व्यक्त की गई है; इससे वर्तमान उपवास की रीति और स्वीकार्य उपवास के बीच विरोध बना रहता है।
- source_word: לְהַשְׁמִיעַ ... קוֹלְכֶם
  choice: कि तुम्हारी आवाज़ ... सुनाई दे
  rationale: हिफ़ील का कारक अर्थ हिन्दी के स्वाभाविक कर्मवाच्य ‘आवाज़ सुनाई दे’ द्वारा व्यक्त होता है।
- source_word: בַּמָּרוֹם
  choice: ऊँचे लोक में
  rationale: यह ऊँचाई/ऊर्ध्व क्षेत्र का स्थानिक संकेत बनाए रखता है और परमेश्वर या स्वर्ग को मूल से अधिक स्पष्ट रूप से नामित नहीं करता।
theological_decisions:
- issue: ‘ऊँचे लोक’ का आशय
  choice: स्थानिक अभिव्यक्ति ‘ऊँचे लोक में’ रखी गई है, परमेश्वर या स्वर्ग को स्पष्ट रूप से नहीं जोड़ा गया।
  alternative: स्वर्ग में; परमेश्वर के सामने
  rationale: इब्रानी מָרוֹם ऊँचे स्थान या ऊर्ध्व क्षेत्र को दर्शाता है और प्रसंग में परमेश्वर द्वारा सुने जाने का संकेत सम्भव है, पर इस पद में परमेश्वर या स्वर्ग स्पष्टतः नहीं कहा गया।
- issue: अन्तिम निषेध का बल
  choice: 'वर्तमान आचरण की फटकार: ‘आज तुम इस तरह उपवास नहीं कर रहे कि...’।'
  alternative: आज की तरह उपवास मत रखो; आज की तरह उपवास रखकर तुम अपनी आवाज़ नहीं सुना सकते
  rationale: לֹא और अपूर्ण क्रिया कथन, निषेध या परिणामगत असमर्थता की छाया दे सकते हैं। चुना हुआ पाठ अंग्रेज़ी परामर्श-पाठ के वर्तमानकालीन आरोप के अनुरूप है और उद्देश्य-वाक्य की तनावपूर्ण संरचना को पूरी तरह कारण-परिणाम में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी भविष्यद्वक्तापूर्ण फटकार के अनुरूप है। ‘उपवास रखते हो’, ‘झगड़े और कलह’ तथा ‘आवाज़ ... सुनाई दे’ सामान्य पाठक के लिए सहज हैं; ‘ऊँचे लोक’ मूल की धार्मिक-सांकेतिक अस्पष्टता बनाए रखता है।
