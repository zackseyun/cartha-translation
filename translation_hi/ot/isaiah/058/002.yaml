base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/002.yaml
  text: Yet day after day they seek me[a], and they delight to know my ways, as if they were a nation that practiced righteousness and had not forsaken the justice of its God. They ask me for righteous judgments; they delight in the nearness of God.
translation:
  language: hi
  text: फिर भी वे दिन-प्रतिदिन मुझे खोजते हैं और मेरे मार्गों को जानने में प्रसन्न होते हैं, मानो वे ऐसा राष्ट्र हों जो धार्मिकता का आचरण करता हो और जिसने अपने परमेश्वर के न्याय को नहीं त्यागा हो। वे मुझसे न्यायपूर्ण निर्णय माँगते हैं; वे परमेश्वर की निकटता[a] से प्रसन्न होते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वे परमेश्वर के निकट आने में प्रसन्न होते हैं।” इब्रानी पदबंध का अर्थ परमेश्वर की निकटता या परमेश्वर के निकट आने का कार्य—दोनों हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאוֹתִי יוֹם יוֹם יִדְרֹשׁוּן
  choice: फिर भी वे दिन-प्रतिदिन मुझे खोजते हैं
  rationale: संदर्भ में וְ का भाव पिछले पद की भर्त्सना के विपरीत है, इसलिए ‘फिर भी’ उपयुक्त है। יוֹם יוֹם की आवृत्ति को ‘दिन-प्रतिदिन’ और דרשׁ के परमेश्वर को खोजने/उससे पूछने के भाव को ‘खोजते हैं’ से व्यक्त किया गया है।
- source_word: וְדַעַת דְּרָכַי יֶחְפָּצוּן
  choice: और मेरे मार्गों को जानने में प्रसन्न होते हैं
  rationale: यह अनुवाद ज्ञान की इच्छा और उसमें आनंद—दोनों भावों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: כְּגוֹי אֲשֶׁר
  choice: मानो वे ऐसा राष्ट्र हों जो
  rationale: '‘मानो’ भविष्यद्वक्ता की व्यंग्यपूर्ण तुलना को व्यक्त करता है: उनका धार्मिक व्यवहार ऐसा दिखता है जैसे वे वास्तव में न्यायी राष्ट्र हों।'
- source_word: צְדָקָה עָשָׂה
  choice: धार्मिकता के काम करता हो
  rationale: शाब्दिक ‘धार्मिकता करता हो’ के बजाय यह हिन्दी में स्वाभाविक है और निरंतर नैतिक आचरण का भाव रखता है।
- source_word: וּמִשְׁפַּט אֱלֹהָיו לֹא עָזָב
  choice: और जिसने अपने परमेश्वर का न्याय न छोड़ा हो
  rationale: מִשְׁפָּט में न्याय, विधि और न्यायपूर्ण व्यवस्था के अर्थ संभव हैं। ‘न्याय’ संक्षिप्त रहते हुए इस प्रसंग के नैतिक बल को बनाए रखता है।
- source_word: יִשְׁאָלוּנִי מִשְׁפְּטֵי צֶדֶק
  choice: वे मुझसे न्यायपूर्ण निर्णय माँगते हैं
  rationale: שׁאל का अर्थ पूछना या माँगना हो सकता है; निर्णयों को परमेश्वर से चाहने के संदर्भ में ‘माँगते हैं’ सहज है। מִשְׁפְּטֵי צֶדֶק को ‘न्यायपूर्ण निर्णय’ स्पष्ट और आधुनिक रूप में व्यक्त करता है।
- source_word: קִרְבַת אֱלֹהִים יֶחְפָּצוּן
  choice: वे परमेश्वर की निकटता से प्रसन्न होते हैं
  rationale: קִרְבָה का संज्ञात्मक अर्थ ‘निकटता’ रखा गया है और חפץ को पहले प्रयोग के अनुरूप ‘प्रसन्न होते हैं’ कहा गया है। परमेश्वर के निकट आने का वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: तुलना में निहित व्यंग्य को कितना स्पष्ट किया जाए
  choice: ‘मानो वे ऐसा राष्ट्र हों’
  alternative: ‘ऐसे राष्ट्र के समान जो’
  rationale: आसपास का संदर्भ बाहरी धार्मिकता और वास्तविक अन्याय के बीच विरोध दिखाता है। ‘मानो’ मूल तुलना के व्यंग्य को स्वाभाविक हिन्दी में सुनाई देता है, बिना कोई अतिरिक्त धार्मिक निष्कर्ष जोड़े।
- issue: קִרְבַת אֱלֹהִים का अर्थ
  choice: मुख्य पाठ में ‘परमेश्वर की निकटता’
  alternative: ‘परमेश्वर के निकट आना’
  rationale: इब्रानी पदबंध परमेश्वर की निकटता या मनुष्य के परमेश्वर के निकट आने—दोनों का बोध करा सकता है। मुख्य पाठ संज्ञात्मक रूप को रखता है और वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दिन-प्रतिदिन’, ‘मानो’ और ‘न्यायपूर्ण निर्णय’ जैसे पद मूल की पुनरावृत्ति, व्यंग्य और न्याय-विषयक बल को स्वाभाविक हिन्दी में व्यक्त करते हैं। पादटिप्पणी चिह्न उसी अंतिम पदबंध पर रखा गया है जिससे उसका वैकल्पिक पाठ संबंधित है।
