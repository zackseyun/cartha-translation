id: ISA.58.5
reference: Isaiah 58:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/כָ/זֶ֗ה יִֽהְיֶה֙ צ֣וֹם אֶבְחָרֵ֔/הוּ י֛וֹם עַנּ֥וֹת אָדָ֖ם נַפְשׁ֑/וֹ הֲ/לָ/כֹ֨ף כְּ/אַגְמֹ֜ן רֹאשׁ֗/וֹ וְ/שַׂ֤ק וָ/אֵ֨פֶר֙ יַצִּ֔יעַ הֲ/לָ/זֶה֙ תִּקְרָא צ֔וֹם וְ/י֥וֹם רָצ֖וֹן לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/005.yaml
  text: 'Is this the fast that I choose: a day for a man to humble himself? Is it to bow down his head like a reed, and to spread out sackcloth and ashes? Will you call this a fast, and a day acceptable to the LORD?'
translation:
  language: hi
  text: क्या यही वह उपवास है जिसे मैं चुनता हूँ—मनुष्य के अपने प्राण को दुःख देने का दिन? क्या वह सरकंडे की तरह अपना सिर झुकाए और अपने नीचे टाट और राख बिछाए? क्या इसी को तुम उपवास और यहोवा को स्वीकार्य दिन कहोगे?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַנּוֹת ... נַפְשׁוֹ
  choice: अपने प्राण को दुःख दे
  rationale: हिब्रू मुहावरे के आत्म-दमन, कष्ट उठाने और उपवास के भाव को बनाए रखता है; केवल ‘नम्र हो’ कहने से इसका शारीरिक और आंतरिक तनाव कम हो जाता।
- source_word: כְאַגְמֹן
  choice: सरकंडे की तरह
  rationale: झुक जानेवाले दलदली पौधे की मूल उपमा को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: שַׂק וָאֵפֶר יַצִּיעַ
  choice: टाट और राख बिछाए
  rationale: शोक और पश्चात्ताप के बाहरी चिह्नों का मूल चित्र यथावत रखता है; क्रिया का अर्थ अपने नीचे बिछाने से है।
- source_word: יוֹם רָצוֹן לַיהוָה
  choice: यहोवा को प्रसन्न करनेवाला दिन
  rationale: רָצוֹן के कृपापात्र/स्वीकार्य होने के भाव को सामान्य आधुनिक हिन्दी में व्यक्त करता है और दिव्य नाम को प्रत्यक्ष रूप से रखता है।
theological_decisions:
- issue: נפשׁו का अर्थ
  choice: अपने प्राण को दुःख दे
  alternative: अपने आपको दीन करे
  rationale: ‘प्राण’ मूल संज्ञा को सुरक्षित रखता है और आत्म-संयम या कष्ट का कठोर भाव बनाए रखता है, बिना इसे केवल मनोवैज्ञानिक नम्रता तक सीमित किए।
- issue: दिव्य नाम יהוה
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में आए विशिष्ट दिव्य नाम को हिन्दी में प्रचलित प्रत्यक्ष रूप से प्रस्तुत किया गया है; इससे יהוה और אֲדֹנָי का भेद बना रहता है।
- issue: प्रश्नों का आलंकारिक स्वर
  choice: तीनों प्रश्नों को प्रश्न ही रखा गया
  alternative: उन्हें स्पष्ट निषेधात्मक कथनों में बदलना
  rationale: मूल की चुनौतीपूर्ण प्रश्नात्मक शैली पाठक को बाहरी धार्मिक कर्म और परमेश्वर को ग्राह्य उपवास के बीच तनाव स्वयं ग्रहण करने देती है।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और मौखिक पाठ के अनुकूल है। ‘मनुष्य’ लिंग-समावेशी सामान्य मानवीय अर्थ देता है। मूल की पुनरुक्त प्रश्न-रचना और बाहरी पश्चात्ताप के दृश्य बिंब सुरक्षित रखे गए हैं।
