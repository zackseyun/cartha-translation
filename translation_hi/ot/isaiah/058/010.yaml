  text: וְ/תָפֵ֤ק לָֽ/רָעֵב֙ נַפְשֶׁ֔/ךָ וְ/נֶ֥פֶשׁ נַעֲנָ֖ה תַּשְׂבִּ֑יעַ וְ/זָרַ֤ח בַּ/חֹ֨שֶׁךְ֙ אוֹרֶ֔/ךָ וַ/אֲפֵלָתְ/ךָ֖ כַּֽ/צָּהֳרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/010.yaml
  text: and if you pour yourself out for the hungry and satisfy the afflicted soul[a], then your light will rise in the darkness[b], and your gloom will be like noonday.
translation:
  language: hi
  text: और यदि तुम भूखे के लिए अपने आप को लगा दो और पीड़ित व्यक्ति की आवश्यकता पूरी करो,[a] तो अन्धकार में तुम्हारा प्रकाश चमक उठेगा, और तुम्हारा घोर अन्धकार दोपहर के उजाले के समान हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यदि तुम भूखे के लिए अपना प्राण निकालो और पीड़ित प्राण को तृप्त करो।” यहाँ “प्राण” (נֶפֶשׁ) प्रायः पूरे व्यक्ति या उसके जीवन को सूचित करता है। पहले पद में भाव यह है कि तुम अपने आप को भूखे के हित में लगा दो।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָפֵק ... נַפְשֶׁךָ
  choice: अपने आपको उंडेल दो
  rationale: हिफ़इल क्रिया और נֶפֶשׁ का यह मेल भूखे के हित में स्वयं को लगा देने या खपा देने का भाव देता है। यह हिन्दी अभिव्यक्ति मूल के आत्मदान वाले रूपक को बनाए रखती है।
- source_word: לָרָעֵב
  choice: भूखे के लिए
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और ל लाभार्थी को दर्शाता है।
- source_word: וְנֶפֶשׁ נַעֲנָה
  choice: दुःखी व्यक्ति
  rationale: נֶפֶשׁ यहाँ केवल अमूर्त 'आत्मा' नहीं, बल्कि पूरे व्यक्ति को सूचित करता है; נַעֲנָה पीड़ित, दबे या दुःखी होने का भाव देता है।
- source_word: תַּשְׂבִּיעַ
  choice: तृप्त करो
  rationale: שׂבע का हिफ़इल रूप भरपूर संतुष्ट या तृप्त करने को दर्शाता है और भूख के प्रसंग से भी स्वाभाविक रूप से जुड़ता है।
- source_word: וְזָרַח
  choice: उदय होगा
  rationale: सशर्त कथन के परिणाम में यह भविष्यगत अर्थ रखता है; प्रकाश के निकलने या चमक उठने की छवि को 'उदय होगा' सुरक्षित रखता है।
- source_word: בַּחֹשֶׁךְ אוֹרֶךָ
  choice: अन्धकार में तुम्हारा प्रकाश
  rationale: मूल की ठोस प्रकाश-अन्धकार छवि को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
- source_word: וַאֲפֵלָתְךָ
  choice: तुम्हारा घोर अन्धकार
  rationale: אֲפֵלָה साधारण अन्धकार से अधिक गहन अन्धकार या निराशाजनक धुँधलके का संकेत देता है।
- source_word: כַּצָּהֳרָיִם
  choice: दोपहर के समान
  rationale: צָהֳרַיִם दिन के मध्य के उजाले को दर्शाता है; हिन्दी में यह उपमा स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: दोनों स्थानों पर נֶפֶשׁ का मानवशास्त्रीय अर्थ
  choice: पहले प्रयोग को 'अपने आपको' और दूसरे को 'व्यक्ति' के रूप में प्रस्तुत किया
  alternative: दोनों स्थानों पर 'प्राण' या 'आत्मा' रखा जा सकता है
  rationale: दोनों प्रयोग सम्पूर्ण व्यक्ति या जीवन को सूचित करते हैं, किसी पृथक अमूर्त आत्मा का तकनीकी सिद्धान्त नहीं। प्रसंगानुकूल हिन्दी मूल का अर्थ स्पष्ट करती है, जबकि पादटिप्पणी शाब्दिक रूप को सुरक्षित रखती है।
- issue: आशीष के रूपक का अर्थ
  choice: '''प्रकाश'', ''अन्धकार'' और ''दोपहर'' की छवियाँ ज्यों की त्यों रखीं'
  alternative: इनका अर्थ समृद्धि, मार्गदर्शन या पुनर्स्थापना के रूप में स्पष्ट करके अनुवाद किया जा सकता था
  rationale: मूल काव्यात्मक भाषा अनेक संबंधित अर्थों के लिए खुली है; किसी एक धर्मवैज्ञानिक व्याख्या को मुख्य पाठ में थोपना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में dignified, सहज काव्यात्मक शैली अपनाई गई है। 'उंडेल दो' आत्मदान का रूपक बनाए रखता है; 'दुःखी व्यक्ति' अनावश्यक देह-आत्मा द्वैत से बचते हुए सामान्य पाठक के लिए अर्थ स्पष्ट करता है।
