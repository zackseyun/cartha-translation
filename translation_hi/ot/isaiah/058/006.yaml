source:
  edition: WLC
  text: הֲ/ל֣וֹא זֶה֮ צ֣וֹם אֶבְחָרֵ/הוּ֒ פַּתֵּ֨חַ֙ חַרְצֻבּ֣וֹת רֶ֔שַׁע הַתֵּ֖ר אֲגֻדּ֣וֹת מוֹטָ֑ה וְ/שַׁלַּ֤ח רְצוּצִים֙ חָפְשִׁ֔ים וְ/כָל מוֹטָ֖ה תְּנַתֵּֽקוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/006.yaml
  text: 'Is not this the fast that I choose: to loosen the chains of wickedness[a], to untie the cords of the yoke, to send the oppressed out free[c][b], and to tear off every yoke?'
translation:
  language: hi
  text: जिस उपवास को मैं चुनता हूँ, क्या वह यह नहीं है—दुष्टता के बंधनों[a] को खोलना, जुए की रस्सियों को खोल देना, दबे-कुचलों[b] को स्वतंत्र करके जाने देना, और हर जुए[c] को तोड़ डालना?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दुष्टता की बेड़ियों’।
    reason: lexical_alternative
  - marker: b
    text: या ‘उत्पीड़ितों’। इब्रानी शब्द का शाब्दिक भाव ‘कुचले हुए’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में ‘जुआ’ दो बार आया है। यह पुनरावृत्ति उत्पीड़न को ऐसे शारीरिक बंधन के रूप में दिखाती है जिसे हटाना आवश्यक है।
    reason: cultural_note
lexical_decisions:
- source_word: צ֣וֹם
  choice: उपवास
  rationale: यह धार्मिक उपवास की प्रथा के लिए प्रचलित, स्पष्ट और स्वाभाविक हिन्दी शब्द है।
- source_word: אֶבְחָרֵהוּ
  choice: जिसे मैं चुनता हूँ
  rationale: בחר के मूल अर्थ ‘चुनना’ को सीधे रखता है और वर्तमान प्रसंग में परमेश्वर की स्वीकृत पसंद व्यक्त करता है।
- source_word: פַּתֵּחַ
  choice: खोलना
  rationale: बंधन के साथ प्रयुक्त क्रिया का ठोस चित्र बनाए रखता है; केवल अमूर्त ‘मुक्त करना’ कहने से अधिक स्रोत-संगत है।
- source_word: חַרְצֻבּוֹת
  choice: बंधन
  rationale: यह शब्द बेड़ियों या कसकर बाँधने वाले बंधनों का बोध देता है; ‘बंधन’ आधुनिक हिन्दी में स्वाभाविक है और भौतिक रूपक को बनाए रखता है।
- source_word: רֶשַׁע
  choice: दुष्टता
  rationale: नैतिक बुराई का व्यापक अर्थ सुरक्षित रखता है; प्रसंग में सामाजिक अन्याय सम्मिलित है, पर अर्थ उसी तक सीमित नहीं किया गया।
- source_word: הַתֵּר
  choice: खोल देना
  rationale: बँधी हुई वस्तु को खोलने की क्रिया व्यक्त करता है और मुक्ति की पूर्णता के लिए ‘देना’ स्वाभाविक हिन्दी बल प्रदान करता है।
- source_word: אֲגֻדּוֹת
  choice: रस्सियाँ
  rationale: जुए को बाँधने वाली पट्टियों या बंधनों का ठोस और सामान्य-बोधगम्य चित्र देता है।
- source_word: מוֹטָה
  choice: जुआ
  rationale: उत्पीड़न को शारीरिक बोझ और नियंत्रण के रूप में दिखाने वाला मूल रूपक सुरक्षित रहता है।
- source_word: וְשַׁלַּח
  choice: जाने देना
  rationale: שלח के ‘भेजना/जाने देना’ वाले क्रियात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רְצוּצִים
  choice: दबे-कुचले
  rationale: רצץ के ‘कुचलना’ और प्रसंगगत ‘उत्पीड़ित करना’ दोनों भावों को हिन्दी के प्रचलित युग्म में समेटता है।
- source_word: חָפְשִׁים
  choice: स्वतंत्र करके
  rationale: मुक्त किए गए लोगों की नई दशा को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: תְּנַתֵּקוּ
  choice: तोड़ डालना
  rationale: נתק की बलपूर्वक अलग करने या तोड़ने की तीव्रता को बनाए रखता है; ‘डालना’ क्रिया के निर्णायक बल को स्वाभाविक हिन्दी में उभारता है।
theological_decisions:
- issue: परमेश्वर द्वारा चुने गए उपवास का स्वरूप
  choice: उपवास को उत्पीड़न मिटाने और लोगों को मुक्त करने के ठोस कार्यों के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल भीतरी भक्ति या सामान्य दयालुता का रूपक मानना।
  rationale: इब्रानी क्रियात्मक पद वास्तविक बंधन खोलने और उत्पीड़ितों को मुक्त करने के कार्य बताते हैं; अनुवाद इस सामाजिक-नैतिक ठोसपन को सुरक्षित रखता है।
- issue: जुए के रूपक की पुनरावृत्ति
  choice: מוֹטָה के दोनों प्रयोगों में ‘जुआ’ रखा गया है।
  alternative: एक या दोनों स्थानों पर अमूर्त शब्द ‘बोझ’ या ‘उत्पीड़न’ रखना।
  rationale: पुनरावृत्त भौतिक रूपक अन्याय को नियंत्रणकारी बंधन के रूप में चित्रित करता है; उसे बनाए रखने से भविष्यद्वक्ताई बल और वास्तविक अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक पाठ के योग्य रूप अपनाया गया है। वाक्य की प्रश्नात्मक संरचना, क्रियाओं की क्रमिक समानता और बंधन-जुए का ठोस रूपक सुरक्षित रखा गया है; कठिन शब्दों के स्थान पर सामान्य-बोधगम्य अभिव्यक्तियाँ चुनी गई हैं।
