base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/008.yaml
  text: Then your light will break forth like the dawn[a], and your healing will spring up quickly; your righteousness will go before you[c][b], and the glory of Yahweh will be your rear guard.
translation:
  language: hi
  text: तब तुम्हारा प्रकाश भोर के समान फूट निकलेगा, और तुम्हारी चंगाई शीघ्र उग आएगी[a]; तुम्हारी धार्मिकता[b] तुम्हारे आगे-आगे चलेगी, और याहवे की महिमा तुम्हारे पीछे से तुम्हारी रक्षा करेगी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारा स्वास्थ्यलाभ” अथवा “तुम्हारी पुनःस्थापना।”
    reason: lexical_alternative
  - marker: b
    text: या “तुम्हारा न्याय”; इब्रानी शब्द “निर्दोष ठहराया जाना” का भाव भी दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी क्रिया का अधिक शाब्दिक अर्थ “तुम्हें इकट्ठा करेगी” या “समेटेगी” है। प्रसंग में इसका अर्थ पीछे से सुरक्षा देना है।
    reason: alternative_reading
lexical_decisions:
- source_word: יִבָּקַע
  choice: फूट निकलेगा
  rationale: निफ़अल रूप किसी वस्तु के फटकर या वेग से प्रकट होने का भाव देता है। प्रकाश और भोर के बिंब के साथ ‘फूट निकलेगा’ स्वाभाविक और सजीव है।
- source_word: כַּשַּׁחַר
  choice: भोर के समान
  rationale: שׁחר का अर्थ भोर या पौ फटना है; यह रूप मूल उपमा को स्पष्ट और गरिमापूर्ण हिन्दी में रखता है।
- source_word: אוֹרֶךָ
  choice: तुम्हारा प्रकाश
  rationale: אוֹר का सीधा अर्थ ‘प्रकाश’ है और संबंधसूचक प्रत्यय को बनाए रखा गया है।
- source_word: אֲרֻכָתְךָ
  choice: तुम्हारा घाव भरना
  rationale: אֲרֻכָה घाव के भरने, आरोग्य या पुनःस्थापना को व्यक्त कर सकता है। हिन्दी में ‘तुम्हारा घाव भरने लगेगा’ उपचार के भाव को स्वाभाविक ढंग से व्यक्त करते हुए अगले क्रियापद की अंकुरण-वृद्धि की गतिशीलता भी बनाए रखता है।
- source_word: מְהֵרָה תִצְמָח
  choice: शीघ्र भरने लगेगा
  rationale: מְהֵרָה तीव्रता बताता है और צמח का मूल भाव उगने या अंकुरित होने का है। अमूर्त ‘आरोग्य’ के साथ कृत्रिम अभिव्यक्ति से बचते हुए ‘भरने लगेगा’ तेजी से विकसित होते आरोग्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהָלַךְ לְפָנֶיךָ
  choice: तुम्हारे आगे-आगे चलेगी
  rationale: הלך + לפני का अर्थ किसी के आगे चलना है। ‘आगे-आगे’ अग्रगमन और नेतृत्व अथवा सुरक्षा के स्थानिक चित्र को साफ रखता है।
- source_word: צִדְקֶךָ
  choice: तुम्हारी धार्मिकता
  rationale: צדק में धार्मिकता, न्याय और सही ठहराए जाने की अर्थ-सीमा है। यहाँ व्यक्ति की विशेषता का मानवीकरण करके उसके आगे चलने की बात है, इसलिए ‘धार्मिकता’ व्यापक नैतिक और वाचागत भाव को बनाए रखती है; ‘न्याय’ को पादटिप्पणी में रखा गया है।
- source_word: כְּבוֹד יְהוָה
  choice: यहोवा की महिमा
  rationale: כבוד को ‘महिमा’ और परमेश्वर के व्यक्तिगत नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: יַאַסְפֶךָ
  choice: तुम्हें पीछे से समेटे रखेगी
  rationale: אסף का मूल अर्थ इकट्ठा करना या समेटना है। आगे चलने वाली धार्मिकता के समानांतर यह पीछे से सुरक्षापूर्वक समेटने का चित्र देता है। यह अनुवाद मूल क्रिया की वास्तविक अस्पष्टता बचाता है; सैन्य अर्थ वाला ‘पिछला रक्षक’ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। उसे ‘प्रभु’ से बदलने के बजाय नाम के रूप में रखा गया है; आधुनिक हिन्दी बाइबल पाठकों में ‘यहोवा’ अधिक पहचाना जाने वाला देवनागरी रूप है।
- issue: צִדְקֶךָ का अर्थ
  choice: तुम्हारी धार्मिकता
  alternative: तुम्हारा न्याय
  rationale: अध्याय में सामाजिक न्याय प्रमुख है, फिर भी यह शब्द नैतिक, वाचागत और न्याय-संबंधी व्यापकता रखता है। ‘धार्मिकता’ उस तनाव को अधिक खुला रखती है, जबकि ‘न्याय’ की संभावना पादटिप्पणी में सुरक्षित है।
- issue: יַאַסְפֶךָ का प्रसंगगत अर्थ
  choice: तुम्हें पीछे से समेटे रखेगी
  alternative: तुम्हारी पिछली रक्षा करेगी
  rationale: प्रसंग पीछे की सुरक्षा का संकेत देता है, पर क्रिया का शाब्दिक केंद्र ‘समेटना/इकट्ठा करना’ है। मुख्य पाठ में उसी बिंब को रखा गया है और अधिक व्याख्यात्मक सैन्य पाठ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। काव्यात्मक समानांतरता—प्रकाश/भोर, आगे चलती धार्मिकता और पीछे से समेटती महिमा—को सुरक्षित रखा गया है। एकवचन पुल्लिंग संबोधन के हिन्दी-रूप ‘तुम्हारा/तुम्हें’ मूल के द्वितीय पुरुष एकवचन को दर्शाते हैं।
