  text: הֲ/ל֨וֹא פָרֹ֤ס לָֽ/רָעֵב֙ לַחְמֶ֔/ךָ וַ/עֲנִיִּ֥ים מְרוּדִ֖ים תָּ֣בִיא בָ֑יִת כִּֽי תִרְאֶ֤ה עָרֹם֙ וְ/כִסִּית֔/וֹ וּ/מִ/בְּשָׂרְ/ךָ֖ לֹ֥א תִתְעַלָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/007.yaml
  text: Is it not to share your bread with the hungry[a], and bring the poor who are cast out into your house? When you see the naked, to cover him[b], and not hide yourself from your own flesh?
translation:
  language: hi
  text: क्या यह नहीं है कि तू भूखे को अपनी रोटी बाँट दे, और बेघर किए गए गरीबों को अपने घर में ले आए?[a] जब तू किसी को नंगा देखे, तो उसे ढाँप दे, और अपने ही मांस से अपने को न छिपाए?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बेघर किए गए’ के लिए प्रयुक्त इब्रानी शब्द कठिन है; इसका अर्थ ‘निकाले गए,’ ‘भटकते हुए,’ या ‘आश्रयहीन’ गरीब लोग भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, ‘अपने ही मांस से अपने को न छिपा।’ ‘अपने ही मांस’ अपने कुटुम्ब या निकट संबंधियों को सूचित कर सकता है और व्यापक अर्थ में साझा मानवता से संबंध पर भी बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פָרֹס לָרָעֵב לַחְמֶךָ
  choice: तू अपनी रोटी भूखे के साथ बाँटे
  rationale: פָרֹס का मूल भाव रोटी को तोड़ने या बाँटने का है। प्रसंग में ‘रोटी ... बाँटे’ ठोस बिंब और दानशीलता—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֲנִיִּים מְרוּדִים
  choice: बेघर किए गए दीन-दुखियों
  rationale: עֲנִיִּים गरीबी और दुर्दशा से पीड़ित लोगों को सूचित करता है; कठिन מְרוּדִים में निकाले जाने, भटकने या आश्रयहीन होने का भाव हो सकता है। ‘बेघर किए गए’ विस्थापन के संभावित निष्क्रिय भाव को बनाए रखता है, जबकि ‘दीन-दुखियों’ केवल आर्थिक गरीबी से अधिक व्यापक पीड़ा व्यक्त करता है।
- source_word: תָּבִיא בָיִת
  choice: अपने घर में ले आए
  rationale: हिफ़ील क्रिया और ‘घर’ का संयोजन आश्रय देने के लिए भीतर लाने का संकेत करता है। हिन्दी में यह आतिथ्य की क्रिया स्पष्ट और स्वाभाविक रूप से बताता है।
- source_word: כִּי תִרְאֶה עָרֹם
  choice: जब तू किसी को नंगा देखे
  rationale: כִּי यहाँ परिस्थिति प्रस्तुत करता है और עָרֹם विशेषण संज्ञा की तरह प्रयुक्त है। ‘किसी को नंगा’ आधुनिक हिन्दी में ‘नंगे को’ से अधिक स्वाभाविक है।
- source_word: וְכִסִּיתוֹ
  choice: तो उसे ढाँपे
  rationale: क्रिया का शाब्दिक अर्थ ‘ढाँपना’ है और प्रसंग में वस्त्र देने का आशय है। ‘ढाँपे’ मूल बिंब को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: וּמִבְּשָׂרְךָ לֹא תִתְעַלָּם
  choice: अपने ही मांस से मुँह न मोड़े
  rationale: ‘अपने ही मांस’ मूल रूपक को बनाए रखता है। התעלם में अपने को छिपाने या जानबूझकर ध्यान हटाने का भाव है; हिन्दी मुहावरा ‘मुँह न मोड़े’ उस नैतिक दूरी बनाने को स्पष्ट करता है।
theological_decisions:
- issue: ‘अपने ही मांस’ का दायरा
  choice: मूल रूपक ‘अपने ही मांस’ को मुख्य पाठ में बनाए रखा गया।
  alternative: अपने परिवार/कुटुम्ब से मुँह न मोड़े
  rationale: यह वाक्यांश निकट रक्त-संबंधियों की ओर संकेत कर सकता है, पर साझा मानवता तक विस्तृत नैतिक प्रतिध्वनि भी रखता है। इसे केवल परिवार तक सीमित करने से मूल की अर्थगत खुलावट समय से पहले समाप्त हो जाती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। एकवचन सम्बोधन के लिए ‘तू’ रखा गया है ताकि इब्रानी के प्रत्यक्ष, व्यक्तिगत और भविष्यद्वक्ताई आग्रह को सुरक्षित रखा जा सके। ‘दीन-दुखियों’ और ‘मुँह न मोड़े’ स्वाभाविक हिन्दी हैं; मुख्य रूपक ‘अपने ही मांस’ को अर्थगत तनाव बनाए रखने के लिए ज्यों का त्यों रखा गया है।
