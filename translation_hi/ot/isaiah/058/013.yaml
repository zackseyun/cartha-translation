source:
  edition: WLC
  text: אִם תָּשִׁ֤יב מִ/שַּׁבָּת֙ רַגְלֶ֔/ךָ עֲשׂ֥וֹת חֲפָצֶ֖י/ךָ בְּ/י֣וֹם קָדְשִׁ֑/י וְ/קָרָ֨אתָ לַ/שַּׁבָּ֜ת עֹ֗נֶג לִ/קְד֤וֹשׁ יְהוָה֙ מְכֻבָּ֔ד וְ/כִבַּדְתּ/וֹ֙ מֵ/עֲשׂ֣וֹת דְּרָכֶ֔י/ךָ מִ/מְּצ֥וֹא חֶפְצְ/ךָ֖ וְ/דַבֵּ֥ר דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/013.yaml
  text: If you turn back your foot from the Sabbath[a], from doing your own pleasure on my holy day, and call the Sabbath a delight, the holy thing of Yahweh honorable, and honor it by not going your own ways, nor seeking your own pleasure, nor speaking a word[c][b],
translation:
  language: hi
  text: यदि तुम सब्त का उल्लंघन करने से अपने पाँव रोक लो, मेरे पवित्र दिन पर जो तुम्हें भाता है वह न करो, और सब्त को आनंद का दिन तथा याहवे के पवित्र दिन को आदरणीय कहो, और अपनी राहों पर न चलकर, अपनी इच्छा पूरी न करके[b] और कोई बात न बोलकर[c] उसका आदर करो[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसका” याहवे की ओर संकेत कर सकता है; तब अर्थ होगा, “याहवे का आदर करो।”
    reason: alternative_reading
  - marker: b
    text: “अपनी इच्छा” का अर्थ प्रसंग में “अपना निजी कामकाज” या “अपना व्यवसाय” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से “कोई बात बोलना” है; इसका आशय सामान्य, अपने स्वार्थ की या व्यर्थ बातें करने से रुकना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשִׁיב מִשַּׁבָּת רַגְלֶךָ
  choice: सब्त के दिन अपने पाँव को रोक लो
  rationale: हिफ़ील क्रिया और ‘पाँव’ की ठोस इब्रानी छवि को रखा गया है; हिंदी में यह सब्त के दिन अपनी सामान्य गतिविधि से रुकने का स्वाभाविक संकेत देता है।
- source_word: עֲשׂוֹת חֲפָצֶיךָ
  choice: अपनी इच्छा के काम न करो
  rationale: חפץ में इच्छा, रुचि और निजी कामकाज के अर्थ संभव हैं। यह अनुवाद निजी पसंद के अनुसार किए जाने वाले काम को व्यक्त करता है, पर अर्थ को केवल व्यापार तक सीमित नहीं करता।
- source_word: בְּיוֹם קָדְשִׁי
  choice: मेरे पवित्र दिन
  rationale: सरल संबंधसूचक रचना परमेश्वर के इस दिन पर अधिकार और उसकी पवित्रता दोनों बनाए रखती है।
- source_word: וְקָרָאתָ לַשַּׁבָּת עֹנֶג
  choice: सब्त को आनंद का दिन ... कहो
  rationale: עֹנֶג का मूल भाव आनंद या प्रसन्नता है। हिंदी में ‘आनंद का दिन’ स्वाभाविक है और सब्त के दिन की ओर संकेत स्पष्ट करता है।
- source_word: לִקְדוֹשׁ יְהוָה מְכֻבָּד
  choice: याहवे के पवित्र दिन को आदरणीय
  rationale: संक्षिप्त इब्रानी पदबंध को प्रसंग के अनुसार सब्त, अर्थात याहवे के पवित्र दिन, से जोड़ा गया है। מְכֻבָּד को ‘आदरणीय’ कहना उस दिन को सम्मान योग्य मानने का भाव रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम का हिंदी लिप्यंतरण किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וְכִבַּדְתּוֹ
  choice: उसका आदर करो
  rationale: पुल्लिंग एकवचन सर्वनाम को निकटवर्ती सब्त/पवित्र दिन से जोड़ा गया है। याहवे को इसका संदर्भ मानने की व्याकरण-सम्मत संभावना पादटिप्पणी में सुरक्षित है।
- source_word: מֵעֲשׂוֹת דְּרָכֶיךָ
  choice: अपनी राहों पर न चलकर
  rationale: ‘राहों’ की रूपकात्मक छवि को रखते हुए व्यक्तिगत व्यवहार और गतिविधि का भाव स्वाभाविक हिंदी में व्यक्त किया गया है।
- source_word: מִמְּצוֹא חֶפְצְךָ
  choice: अपनी इच्छा पूरी न करके
  rationale: מצא और חפץ का मेल अपनी चाह या निजी प्रयोजन का पीछा करने का भाव देता है। ‘इच्छा’ पहले आए חפץ से शब्दार्थीय संबंध भी बनाए रखती है।
- source_word: וְדַבֵּר דָּבָר
  choice: कोई बात न बोलकर
  rationale: इब्रानी की संक्षिप्त और जानबूझकर अस्पष्ट अभिव्यक्ति को बिना ‘व्यर्थ’, ‘सांसारिक’ या ‘व्यावसायिक’ जैसे व्याख्यात्मक विशेषण जोड़े रखा गया है।
theological_decisions:
- issue: וְכִבַּדְתּוֹ में सर्वनाम का संदर्भ
  choice: 'सर्वनाम सब्त/पवित्र दिन की ओर संकेत करता है: ‘उसका आदर करो।’'
  alternative: 'सर्वनाम याहवे की ओर संकेत कर सकता है: ‘उसका [याहवे का] आदर करो।’'
  rationale: वाक्य का तात्कालिक प्रवाह सब्त को आनंद और याहवे के पवित्र दिन को आदरणीय कहने के बाद उसी का आदर करने की ओर जाता है। फिर भी पुल्लिंग सर्वनाम के कारण याहवे को संदर्भ मानना संभव है, इसलिए इस तनाव को पादटिप्पणी में रखा गया है।
- issue: सब्त के दिन חפץ का आशय
  choice: इसे ‘अपनी इच्छा’ के रूप में रखा गया है।
  alternative: प्रसंग में इसका अर्थ ‘अपना कामकाज’ या ‘अपना व्यवसाय’ भी हो सकता है।
  rationale: शब्द इच्छा, प्रसन्नता, निजी प्रयोजन या कामकाज का संकेत दे सकता है। मुख्य पाठ व्यापक अर्थ रखता है और पादटिप्पणी प्रसंगगत विकल्प बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी में सम्मानपूर्ण किंतु सहज ‘तुम’ का प्रयोग किया गया है। वाक्य की शर्तात्मक रचना अगले पद में पूरी होती है, इसलिए इस पद के अंत में अल्पविराम रखा गया है। ‘सब्त’, ‘याहवे’, ‘पवित्र दिन’ और ‘आदरणीय’ जैसे शब्द बाइबलीय गरिमा बनाए रखते हुए सामान्य पाठक के लिए बोधगम्य हैं।
