  text: אָ֤ז תִּקְרָא֙ וַ/יהוָ֣ה יַעֲנֶ֔ה תְּשַׁוַּ֖ע וְ/יֹאמַ֣ר הִנֵּ֑/נִי אִם תָּסִ֤יר מִ/תּֽוֹכְ/ךָ֙ מוֹטָ֔ה שְׁלַ֥ח אֶצְבַּ֖ע וְ/דַבֶּר אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/009.yaml
  text: Then you will call[a], and Yahweh will answer; you will cry for help, and he will say, ‘Here I am.’ If you remove from your midst the yoke, the pointing of the finger, and speaking wickedness[c][b],
translation:
  language: hi
  text: तब तू पुकारेगा और याहवे उत्तर देगा; तू सहायता के लिए दुहाई देगा और वह कहेगा, “मैं यहाँ हूँ।” यदि तू अपने बीच से जुआ[a], उँगली उठाना[b] और बुरी बातें कहना[c] दूर कर दे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘जुआ’ यहाँ दूसरों पर लादे गए दमनकारी बोझ या अत्याचारी व्यवहार का रूपक है।
    reason: cultural_note
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘उँगली बढ़ाना’ है; संभवतः इसका अर्थ किसी पर दोष लगाने या तिरस्कार से संकेत करने का हावभाव है।
    reason: lexical_alternative
  - marker: c
    text: इसका अनुवाद ‘दुष्टता की बातें कहना’ या ‘हानिकारक बातें कहना’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण पहले कही गई शर्तों के परिणाम का संकेत देता है; ‘तब’ संक्षिप्त और स्वाभाविक है।
- source_word: תִּקְרָא
  choice: तू पुकारेगा
  rationale: प्रार्थना के संदर्भ में קרא परमेश्वर को पुकारने का भाव रखता है और अगले समानांतर वाक्य के साथ मेल खाता है।
- source_word: וַיהוָה
  choice: और याहवे
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को लिप्यंतरित रूप में रखा गया है।
- source_word: תְּשַׁוַּע
  choice: तू सहायता के लिए दुहाई देगा
  rationale: שוע का यह रूप संकट में सहायता के लिए की गई तीव्र पुकार व्यक्त करता है; ‘दुहाई देना’ उस तात्कालिकता को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: הִנֵּנִי
  choice: मैं यहाँ हूँ
  rationale: यह उत्तर उपस्थिति, तत्परता और ध्यान देने का भाव व्यक्त करता है; हिन्दी में यही उसका स्वाभाविक और सीधा रूप है।
- source_word: מִתּוֹכְךָ
  choice: अपने बीच से
  rationale: दूसरा पुरुष एकवचन संबोधन होते हुए भी प्रसंग सामाजिक समुदाय की ओर संकेत करता है; ‘अपने बीच से’ इस सामुदायिक आयाम को बनाए रखता है।
- source_word: מוֹטָה
  choice: जुए
  rationale: मूल का ठोस रूपक बनाए रखा गया है; यहाँ जुआ दूसरों पर लादे गए दमनकारी बोझ या व्यवहार का संकेत देता है।
- source_word: שְׁלַח אֶצְבַּע
  choice: उँगली उठाने
  rationale: शाब्दिक चित्र ‘उँगली बढ़ाना/फैलाना’ है, जो आरोप लगाने या तिरस्कार दिखाने वाले संकेत के लिए प्रयुक्त मुहावरा जान पड़ता है।
- source_word: וְדַבֶּר אָוֶן
  choice: दुष्टता की बातें कहने
  rationale: אָוֶן में दुष्टता, अनर्थ अथवा हानिकारक बुराई का भाव हो सकता है; यह अनुवाद नैतिक और सामाजिक दोनों आयामों को खुला रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा-नाम सीधे आया है; ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: दूसरे पुरुष एकवचन का दायरा
  choice: ‘तू/अपने’ रखते हुए सामुदायिक अर्थ को संदर्भ में खुला रखना
  alternative: बहुवचन ‘तुम लोग/तुम्हारे बीच’
  rationale: इब्रानी व्याकरण एकवचन है, किंतु अन्याय समुदाय के भीतर का है। औपचारिक संख्या को बनाए रखते हुए ‘अपने बीच से’ सामुदायिक आशय को व्यक्त करता है।
- issue: מוֹטָה का रूपक
  choice: जुआ
  alternative: अत्याचार / दमन
  rationale: ठोस रूपक को मुख्य पाठ में सुरक्षित रखा गया है ताकि पाठक दमनकारी बोझ का चित्र स्वयं ग्रहण कर सके; अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। भविष्यकालीन प्रतिज्ञा और उसके बाद आने वाली शर्त के बीच मूल का तनाव सुरक्षित है। इब्रानी के दूसरे पुरुष पुल्लिंग एकवचन को ‘तू’ से बनाए रखा गया है, जबकि ‘अपने बीच से’ सामाजिक-सामुदायिक संदर्भ प्रकट करता है।
