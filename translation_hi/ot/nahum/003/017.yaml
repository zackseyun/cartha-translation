translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सहज शैली रखी गई है। समानांतर पंक्तियाँ और टिड्डियों का विस्तृत रूपक सुरक्षित हैं। दुर्लभ पदनामों को अत्यधिक विशिष्ट बनाने के बजाय मुख्य पाठ और फुटनोट मिलकर उनकी वास्तविक अनिश्चितता व्यक्त करते हैं।
