  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִנְּזָרַ֨יִ/ךְ֙ כָּֽ/אַרְבֶּ֔ה וְ/טַפְסְרַ֖יִ/ךְ כְּ/ג֣וֹב גֹּבָ֑י הַֽ/חוֹנִ֤ים בַּ/גְּדֵרוֹת֙ בְּ/י֣וֹם קָרָ֔ה שֶׁ֤מֶשׁ זָֽרְחָה֙ וְ/נוֹדַ֔ד וְ/לֹֽא נוֹדַ֥ע מְקוֹמ֖/וֹ אַיָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/017.yaml
  text: Your guards are like locusts[a], and your scribes like swarms of locusts, settling on the walls on a cold day. The sun rises, and they fly away[d][c][b]; no one knows where they are.
translation:
  language: hi
  text: 'तेरे मुकुटधारी[a] टिड्डियों जैसे हैं,

    और तेरे अधिकारी[b] टिड्डियों के झुंडों जैसे।

    वे ठंड के दिन बाड़ों[c] पर डेरा डालते हैं;

    सूरज निकलते ही वे उड़ जाते हैं,

    और उनका ठिकाना पता नहीं चलता—वे कहाँ हैं?[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दुर्लभ हिब्रू शब्द का अर्थ अनिश्चित है; इसके अनुवाद ‘तेरे अभिषिक्त जन,’ ‘तेरे राजकुमार,’ ‘तेरे पहरेदार’ या ‘तेरे मुकुटधारी’ भी किए जाते हैं।
    reason: lexical_alternative
  - marker: b
    text: इस पदनाम का अर्थ ‘तेरे लेखाधिकारी,’ ‘तेरे सेनापति’ या ‘तेरे सैनिक अधिकारी’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘घेरों पर’ अथवा ‘दीवारों पर।’
    reason: lexical_alternative
  - marker: d
    text: 'हिब्रू में सामूहिक एकवचन और बहुवचन का मेल है; शाब्दिक रूप लगभग ऐसा है: ‘वह चला जाता है, और उसका ठिकाना मालूम नहीं—वे कहाँ हैं?’'
    reason: textual_ambiguity
lexical_decisions:
- source_word: מִנְּזָרַיִךְ
  choice: तेरे मुकुटधारी
  rationale: यह अत्यंत दुर्लभ और विवादित संज्ञा נזר (‘मुकुट/अभिषेक/अलग किया जाना’) से जुड़ी जान पड़ती है। ‘मुकुटधारी’ उसके रूपक और उच्च पद का संकेत बनाए रखता है; संभावित पदगत अर्थ फुटनोट में दिए गए हैं।
- source_word: כָּאַרְבֶּה
  choice: टिड्डियों जैसे
  rationale: एकवचन हिब्रू संज्ञा यहाँ जातिवाचक और सामूहिक है; हिन्दी में बहुवचन तुलना स्वाभाविक है।
- source_word: טַפְסְרַיִךְ
  choice: तेरे अधिकारी
  rationale: यह अक्कादी मूल का दुर्लभ पदनाम है, जो प्रशासनिक या सैनिक उच्च अधिकारी को सूचित कर सकता है। ‘अधिकारी’ अनिश्चित पद को किसी एक विशिष्ट कार्य तक सीमित नहीं करता।
- source_word: כְּגֹב גֹּבָי
  choice: टिड्डियों के झुंडों जैसे
  rationale: दोहराया हुआ रूप टिड्डियों की घनी भीड़ या दल का प्रभाव देता है; ‘झुंडों’ से सामूहिक चित्र स्पष्ट और स्वाभाविक बनता है।
- source_word: הַחוֹנִים
  choice: डेरा डालते हैं
  rationale: חנה का मूल अर्थ डेरा डालना या टिकना है। यह सैनिक अधिकारियों और ठंड में एकत्र कीटों—दोनों के चित्र को बनाए रखता है।
- source_word: בַּגְּדֵרוֹת
  choice: बाड़ों पर
  rationale: גדרות सामान्यतः बाड़ों, घेरों या दीवारों को दर्शाता है। ‘बाड़ों’ से मूल की व्यापक ग्रामीण/रक्षात्मक छवि बनी रहती है; नगर की दीवारें भी संभव हैं।
- source_word: בְּיוֹם קָרָה
  choice: ठंड के दिन
  rationale: यह समय-सूचक वाक्यांश का सीधा और सहज हिन्दी रूप है।
- source_word: שֶׁמֶשׁ זָרְחָה
  choice: सूरज निकलते ही
  rationale: हिब्रू सिद्ध क्रिया दृश्य में सूर्योदय को प्रस्तुत करती है; ‘निकलते ही’ अगली क्रिया से उसके तत्काल संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְנוֹדַד
  choice: वे उड़ जाते हैं
  rationale: क्रिया का अर्थ भटक जाना, हट जाना या भाग जाना है। टिड्डी-चित्र के संदर्भ में ‘उड़ जाते हैं’ निहित गति को स्पष्ट करता है; हिब्रू का सामूहिक एकवचन फुटनोट में सुरक्षित है।
- source_word: וְלֹא נוֹדַע מְקוֹמוֹ אַיָּם
  choice: उनका ठिकाना पता नहीं चलता—वे कहाँ हैं?
  rationale: यह हिब्रू के अज्ञात ठिकाने और अंतिम प्रश्न दोनों को बनाए रखता है। हिन्दी में बहुवचन मुख्य संदर्भ के अनुकूल है, जबकि मूल का एकवचन से बहुवचन में परिवर्तन फुटनोट में बताया गया है।
