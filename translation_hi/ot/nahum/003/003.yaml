base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/003.yaml
  text: Horsemen charging[a], and the flashing sword and the gleaming spear, and a multitude of slain, and heaps of corpses[c][b]; and there is no end to the bodies— they stumble over the bodies.
translation:
  language: hi
  text: 'घुड़सवार धावा बोल रहे हैं;


    तलवार की ज्वाला[a] और भाले की बिजली[b] चमक रही हैं!


    मारे हुओं की भरमार है,


    लाशों का भारी ढेर लगा है।


    शवों का कोई अंत नहीं—


    वे उनकी लाशों पर ठोकर खाते हैं।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘तलवार की ज्वाला’; इसे ‘तलवार की चमकती धार’ भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘भाले की बिजली’; अर्थात उसकी बिजली-जैसी चमक।
    reason: lexical_alternative
  - marker: c
    text: ‘उनकी’ मूल इब्रानी के बहुवचन प्रत्यय को दर्शाता है; इसका संकेत संभवतः वहाँ पड़े मारे गए लोगों की ओर है।
    reason: referential_ambiguity
lexical_decisions:
- source_word: פָּרָשׁ מַעֲלֶה
  choice: घुड़सवार धावा बोल रहे हैं
  rationale: פָּרָשׁ व्याकरणतः एकवचन है, पर युद्ध-दृश्य में सामूहिक अर्थ रख सकता है। מַעֲלֶה का मूल भाव ‘ऊपर आना/चढ़ना’ है; प्रसंग में ‘धावा बोल रहे हैं’ घुड़सवार आक्रमण की गतिशीलता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַהַב חֶרֶב
  choice: तलवार की ज्वाला
  rationale: לַהַב का मूल अर्थ ‘ज्वाला’ है। इस सजीव काव्यात्मक रूपक को सीधे रखा गया है; अगले पद के साथ ‘चमक रही है’ जोड़ने से आधुनिक हिन्दी में दृश्य स्पष्ट होता है।
- source_word: בְרַק חֲנִית
  choice: भाले की बिजली
  rationale: בְרַק का शाब्दिक अर्थ ‘बिजली/बिजली की चमक’ है। ‘भाले की बिजली’ मूल की तीखी दृश्यात्मक उपमा को सुरक्षित रखती है।
- source_word: רֹב חָלָל
  choice: मारे हुओं की भरमार
  rationale: इस युद्ध-संदर्भ में חָלָל केवल घायल नहीं, बल्कि मारे गए लोगों को सूचित करता है; רֹב उनकी अत्यधिक संख्या पर बल देता है।
- source_word: כֹבֶד פָּגֶר
  choice: लाशों का भारी ढेर
  rationale: כֹבֶד का मूल भाव ‘भारीपन/भार’ है और यहाँ शवों की विशाल मात्रा दर्शाता है। यह चुनाव ‘भारी’ की छवि और ढेर की वास्तविकता दोनों बनाए रखता है।
- source_word: אֵין קֵצֶה לַגְּוִיָּה
  choice: शवों का कोई अंत नहीं
  rationale: यह पद मृत देहों की अंतहीन संख्या पर बल देता है। ‘शव’ वर्तमान हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: יכשלו
  choice: वे ... ठोकर खाते हैं
  rationale: כשל का निफ़अल रूप यहाँ ठोकर खाने या लड़खड़ाने का भाव देता है। ‘ठोकर खाते हैं’ प्रत्यक्ष और प्रसंगानुकूल है।
- source_word: בִּגְוִיָּתָם
  choice: उनकी लाशों पर
  rationale: तीसरे पुरुष बहुवचन प्रत्यय को ‘उनकी’ द्वारा सुरक्षित रखा गया है। इसका संदर्भ संभवतः पहले उल्लिखित मारे गए लोगों से है, यद्यपि दृश्य में सर्वनाम का संबंध कुछ खुला रहता है।
