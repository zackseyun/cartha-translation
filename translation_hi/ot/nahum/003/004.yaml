  text: מֵ/רֹב֙ זְנוּנֵ֣י זוֹנָ֔ה ט֥וֹבַת חֵ֖ן בַּעֲלַ֣ת כְּשָׁפִ֑ים הַ/מֹּכֶ֤רֶת גּוֹיִם֙ בִּ/זְנוּנֶ֔י/הָ וּ/מִשְׁפָּח֖וֹת בִּ/כְשָׁפֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/004.yaml
  text: because of the many prostitutions of the prostitute[a], charming in grace, mistress of sorceries[b], who sells nations by her prostitutions and clans by her sorceries.
translation:
  language: hi
  text: उस वेश्या के बहुत-से व्यभिचारों के कारण—जो मोहक आकर्षण वाली[a] और जादू-टोनों की स्वामिनी है, जो अपने व्यभिचारों से राष्ट्रों को और अपने जादू-टोनों से कुलों[b] को बेचती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मनभावन” अथवा “लुभावनी छवि वाली।” इब्रानी अभिव्यक्ति मोह लेने वाले आकर्षण का वर्णन करती है।
    reason: lexical_alternative
  - marker: b
    text: या “परिवारों।” इब्रानी शब्द विस्तृत पारिवारिक समूहों अथवा कुलों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֹב
  choice: बहुत-से ... के कारण
  rationale: מִן के कारणसूचक अर्थ और רֹב की बहुलता, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: זְנוּנֵי / זוֹנָה
  choice: वेश्या के ... व्यभिचारों
  rationale: मूल के दोहरे, तीखे यौन रूपक को बनाए रखता है और उसे केवल मूर्तिपूजा अथवा राजनीति तक सीमित नहीं करता।
- source_word: טוֹבַת חֵן
  choice: मोहक आकर्षण वाली
  rationale: यह अभिव्यक्ति लुभावने आकर्षण को व्यक्त करती है, पर अर्थ को केवल शारीरिक सुंदरता तक सीमित नहीं करती।
- source_word: בַּעֲלַת כְּשָׁפִים
  choice: जादू-टोनों की स्वामिनी
  rationale: स्त्रीलिंग व्यक्तिकरण और किसी वस्तु से विशेष रूप से युक्त होने के भाव को सुरक्षित रखता है।
- source_word: הַמֹּכֶרֶת
  choice: जो ... बेचती है
  rationale: मूल के व्यापारिक और शोषणकारी रूपक का सीधा अनुवाद है।
- source_word: גּוֹיִם
  choice: राष्ट्रों
  rationale: न्यायवाणी के भू-राजनीतिक संदर्भ में גּוֹיִם के सामान्य अर्थ को व्यक्त करता है।
- source_word: בִּזְנוּנֶיהָ / בִּכְשָׁפֶיהָ
  choice: अपने व्यभिचारों से / अपने जादू-टोनों से
  rationale: בְּ के साधनवाचक अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִשְׁפָּחוֹת
  choice: कुलों
  rationale: यहाँ शब्द केवल छोटे परिवारों के बजाय विस्तृत पारिवारिक या वंशगत समूहों को सूचित कर सकता है।
theological_decisions:
- issue: वेश्या और जादू-टोने के रूपक का आशय
  choice: रूपक को बहुआयामी रखते हुए नीनवे की लुभाने वाली, भ्रष्ट और शोषणकारी शक्ति के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल मूर्तिपूजा, केवल यौन पाप, अथवा केवल राजनीतिक-आर्थिक छल के रूप में स्पष्ट कर देना।
  rationale: मूल पाठ इन क्षेत्रों के बीच कोई एकार्थी सीमा नहीं खींचता; इसलिए अनुवाद उसकी भविष्यवाणी-संबंधी व्यापकता और तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। वाक्य को पिछले पद से जुड़े कारणसूचक खंड के रूप में रखा गया है; स्त्रीलिंग व्यक्तिकरण, कठोर वेश्यावृत्ति-रूपक और जादू-टोने की भाषा को नरम नहीं किया गया।
