  yaml_path: translation/ot/nahum/003/013.yaml
  text: Look[a], your troops are women in your midst; the gates of your land stand wide open to your enemies[c][b]; fire has consumed your bars.
translation:
  language: hi
  text: देख, तेरे बीच तेरे लोग स्त्रियाँ हैं। तेरे देश के फाटक तेरे शत्रुओं के लिए पूरी तरह खोल दिए गए हैं; आग ने तेरी सांकलों को भस्म कर दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: देख
  rationale: यह विस्मयादिबोधक ध्यान खींचते हुए जोरदार घोषणा आरम्भ करता है; ‘देख’ आधुनिक और स्वाभाविक हिन्दी में उसका बल बनाए रखता है।
- source_word: עַמֵּךְ
  choice: तेरे लोग
  rationale: עַם का सामान्य और सीधा अर्थ ‘लोग/प्रजा’ है। सैनिक प्रसंग में इसका संकेत रक्षकों की ओर हो सकता है, पर मूल शब्द की व्यापकता बनाए रखने के लिए ‘लोग’ रखा गया है।
- source_word: נָשִׁים
  choice: स्त्रियाँ
  rationale: मूल में बिना किसी स्पष्ट तुलनासूचक शब्द के बहुवचन संज्ञा ‘स्त्रियाँ’ है; भविष्यद्वाणी के कटाक्ष को न नरम किया गया है, न विस्तृत व्याख्या में बदला गया है।
- source_word: בְּקִרְבֵּךְ
  choice: तेरे बीच
  rationale: यह स्थानवाचक अभिव्यक्ति स्वाभाविक हिन्दी में ‘तेरे बीच’ है और नगर के भीतर की दशा बताती है।
- source_word: לְאֹיְבַיִךְ
  choice: तेरे शत्रुओं के लिए
  rationale: पूर्वसर्ग לְ यहाँ खुले फाटकों का शत्रुओं के लिए उपलब्ध होना व्यक्त करता है।
- source_word: פָּתוֹחַ נִפְתְּחוּ
  choice: पूरी तरह खोल दिए गए हैं
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute क्रिया को तीव्र करता है; ‘पूरी तरह’ उस जोर को स्पष्ट करता है और कर्मवाच्य/परिणामी भाव बनाए रखता है।
- source_word: שַׁעֲרֵי אַרְצֵךְ
  choice: तेरे देश के फाटक
  rationale: यह construct phrase का सीधा और स्वाभाविक हिन्दी रूप है; ‘देश’ यहाँ नीनवे के अधीन क्षेत्र को समेटता है।
- source_word: אָכְלָה אֵשׁ
  choice: आग ने ... भस्म कर दिया है
  rationale: मूल में आग कर्ता है और पूर्ण क्रिया विनाश के सिद्ध परिणाम को दिखाती है; आग के संदर्भ में ‘भस्म कर दिया’ सजीव और स्वाभाविक है।
- source_word: בְּרִיחָיִךְ
  choice: तेरे बेड़ों
  rationale: यह नगर के फाटकों को सुरक्षित करने वाले आड़े मजबूत डंडों अथवा बेड़ों को सूचित करता है; निकटवर्ती ‘फाटक’ से संदर्भ स्पष्ट है।
theological_decisions:
- issue: נָשִׁים में लिंग-आधारित सैनिक कटाक्ष
  choice: मुख्य पाठ में शाब्दिक ‘स्त्रियाँ’ बनाए रखा गया है।
  alternative: ‘स्त्रियों के समान’ अथवा ‘स्त्रियों की तरह निर्बल’
  rationale: इब्रानी में न स्पष्ट तुलनासूचक अव्यय है, न ‘निर्बल’ विशेषण। इसलिए उस युग के कटाक्षपूर्ण कथन को ज्यों का त्यों रखा गया है, बिना उसे स्वीकार्य ठहराने या नरम करने के।
- issue: עַמֵּךְ का सैनिक संदर्भ
  choice: ‘तेरे लोग’
  alternative: ‘तेरे सैनिक’ अथवा ‘तेरी सेना’
  rationale: संदर्भ रक्षकों की ओर संकेत कर सकता है, किंतु עַם का मूल अर्थ व्यापक ‘लोग/प्रजा’ है। मुख्य पाठ में इस वास्तविक अर्थगत व्यापकता को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सीधा, गरिमापूर्ण और भविष्यद्वाणी के कटाक्ष के अनुरूप तीखा लहजा। नीनवे को स्त्रीलिंग एकवचन में संबोधित करने वाले इब्रानी प्रत्ययों के अनुरूप ‘तेरे’ रूप का प्रयोग किया गया है।
