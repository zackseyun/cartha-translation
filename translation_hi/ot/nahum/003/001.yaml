base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/001.yaml
  text: Woe to the city of bloodshed[a], all of it full of lies, full of plunder[d][c][b]; prey never departs.
translation:
  language: hi
  text: रक्तपात की नगरी पर हाय[a]! वह पूरी की पूरी छल और लूट[b] से भरी है; शिकार कभी दूर नहीं होता[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘खूनों की नगरी’; यह रक्तपात और रक्तदोष से चिह्नित नगर के लिए इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: ‘लूट’ का अनुवाद ‘छीना हुआ माल’ भी हो सकता है; इब्रानी शब्द हिंसक ढंग से छीनने का भाव रखता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘शिकार का सिलसिला नहीं थमता।’ इब्रानी में शाब्दिक भाव है कि शिकार दूर नहीं जाता।
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
  choice: हाय … पर!
  rationale: यह विस्मयादिबोधक शब्द शोक और दंड की भविष्यवाणी—दोनों का भाव रखता है। ‘हाय … पर!’ आधुनिक हिन्दी में उसकी भविष्यद्वक्ताई तीव्रता बनाए रखता है।
- source_word: עִיר דָּמִים
  choice: रक्तपात की नगरी
  rationale: शाब्दिक रूप ‘खूनों की नगरी’ है, जो हिंसक रक्तपात और उससे जुड़े दोष का इब्रानी मुहावरा है। ‘रक्तपात की नगरी’ अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: כֻּלָּהּ
  choice: वह पूरी की पूरी
  rationale: स्त्रीलिंग प्रत्यय नगर की ओर संकेत करता है और नगर की समग्रता पर बल देता है।
- source_word: כַּחַשׁ
  choice: छल
  rationale: यह संज्ञा झूठ, कपट या धोखे को दर्शाती है। ‘छल’ यहाँ नगर के व्यापक कपटपूर्ण चरित्र को संक्षेप में व्यक्त करता है।
- source_word: פֶּרֶק
  choice: लूट
  rationale: इस शब्द में हिंसक ढंग से छीनने अथवा उससे मिले लूट के माल का भाव है। ‘लूट’ अगले पद के शिकारी बिंब से भी मेल खाता है।
- source_word: מְלֵאָה
  choice: से भरी है
  rationale: यह स्त्रीलिंग विशेषण नगर की दशा बताता है और ‘छल और लूट’ दोनों से स्वाभाविक रूप से जुड़ता है।
- source_word: לֹא יָמִישׁ
  choice: कभी नहीं हटता
  rationale: क्रिया का मूल अर्थ हटना या दूर जाना है। निषेध के साथ यह शिकार की निरंतर उपस्थिति को व्यक्त करता है।
- source_word: טָרֶף
  choice: शिकार
  rationale: यह प्रायः किसी हिंसक पशु द्वारा फाड़े गए शिकार को दर्शाता है। ‘शिकार’ नीनवे की भक्षक और हिंसक छवि को बनाए रखता है।
