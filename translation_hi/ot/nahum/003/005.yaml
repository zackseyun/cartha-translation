  to: देखो, मैं तेरे विरुद्ध हूँ—सेनाओं के याहवे की यह वाणी है। मैं तेरे वस्त्रों का घेरा तेरे चेहरे तक उठा दूँगा[a]; मैं राष्ट्रों को तेरी नग्नता और राज्यों को तेरी लज्जा दिखाऊँगा।
