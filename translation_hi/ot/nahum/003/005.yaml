review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys Yahweh’s hostile declaration against the feminine-singular city, the title ‘Yahweh of hosts,’ and the parallel public exposure before nations and kingdoms. However, ‘तेरे वस्त्र का छोर उठाकर तेरे चेहरे पर डाल दूँगा’ changes the concrete action somewhat: the Hebrew says that the garment’s skirts/hem are uncovered or lifted up over the face, rather than simply being thrown onto it. ‘नंगापन’ is understandable but less natural and less fitting in this formal prophetic register than ‘नग्नता.’'
  naturalness: The translation is generally clear and suitably solemn. ‘देख’ is concise but can sound abrupt in modern Hindi; ‘देखो’ more naturally carries the prophetic attention-call. ‘वस्त्रों का घेरा ... चेहरे तक उठा दूँगा’ is both idiomatic and closer to the image. ‘नग्नता’ is standard formal Hindi.
  terminology: ‘याहवे’ appropriately represents the Tetragrammaton, and ‘सेनाओं के याहवे’ preserves the title. ‘राष्ट्रों,’ ‘राज्यों,’ and ‘लज्जा’ accurately retain the political scope and shame imagery. The feminine singular ‘तेरे/तेरी’ properly maintains Nineveh’s personification.
  issues:
  - severity: medium
    issue: The garment image is rendered as throwing a garment edge onto the face.
    rationale: וְגִלֵּיתִי שׁוּלַיִךְ עַל־פָּנָיִךְ depicts lifting/uncovering the skirts or hem up over the face in a public-shaming image. ‘चेहरे पर डाल दूँगा’ is less exact and can suggest covering the face rather than lifting the garment to expose the body.
  - severity: low
    issue: ‘नंगापन’ is stylistically weaker than ‘नग्नता.’
    rationale: The source denotes nakedness/exposure. ‘नग्नता’ is the more natural modern-standard Hindi term in a dignified prophetic register.
