  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִנְ/נִ֣י אֵלַ֗יִ/ךְ נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת וְ/גִלֵּיתִ֥י שׁוּלַ֖יִ/ךְ עַל פָּנָ֑יִ/ךְ וְ/הַרְאֵיתִ֤י גוֹיִם֙ מַעְרֵ֔/ךְ וּ/מַמְלָכ֖וֹת קְלוֹנֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/005.yaml
  text: Behold[a], I am against you, declares Yahweh of hosts, and I will uncover your skirts over your face, and I will show the nations your nakedness and the kingdoms your shame.
translation:
  language: hi
  text: देखो, मैं तेरे विरुद्ध हूँ—सेनाओं के याहवे की यह वाणी है। मैं तेरे वस्त्रों का घेरा तेरे चेहरे तक उठा दूँगा[a]; मैं राष्ट्रों को तेरी नग्नता और राज्यों को तेरी लज्जा दिखाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या भावार्थ, “मैं तेरी नग्नता प्रकट कर दूँगा।” इब्रानी में स्त्री के वस्त्रों को चेहरे तक उठा देने का बिंब सार्वजनिक अपमान को दर्शाता है।
    reason: मूल रूपक का अर्थ और सम्भव भावानुवाद स्पष्ट करना।
lexical_decisions:
- source_word: הִנְנִי אֵלַיִךְ
  choice: देख, मैं तेरे विरुद्ध हूँ
  rationale: הִנְנִי की ध्यान आकर्षित करने वाली भविष्यद्वाणी-संबंधी शक्ति को ‘देख’ बनाए रखता है, और אֵלַיִךְ का इस प्रसंग में सीधा अर्थ शत्रुतापूर्ण रूप से ‘तेरे विरुद्ध’ है।
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे की यह वाणी है
  rationale: नְאֻם को औपचारिक ईश्वरीय घोषणा के रूप में ‘यह वाणी है’ और צְבָאוֹת को उसके सैन्य तथा विश्वव्यापी बिंब सहित ‘सेनाओं के’ कहा गया है।
- source_word: וְגִלֵּיתִי שׁוּלַיִךְ עַל־פָּנָיִךְ
  choice: मैं तेरे वस्त्र का छोर उठाकर तेरे चेहरे पर डाल दूँगा
  rationale: यह अनुवाद वस्त्र उठाकर सार्वजनिक रूप से अपमानित करने के ठोस और कठोर इब्रानी बिंब को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וְהַרְאֵיתִי גוֹיִם מַעְרֵךְ
  choice: मैं राष्ट्रों को तेरा नंगापन ... दिखाऊँगा
  rationale: हिफ़ील क्रिया का कारक भाव ‘दिखाऊँगा’ से और מַעְרֵךְ का लज्जाजनक अनावृत अवस्था का अर्थ ‘नंगापन’ से स्पष्ट होता है, बिना अनावश्यक रूप से अधिक स्पष्ट भाषा अपनाए।
- source_word: וּמַמְלָכוֹת קְלוֹנֵךְ
  choice: और राज्यों को तेरी लज्जा
  rationale: ‘राज्यों’ से राजनीतिक समानांतरता और ‘लज्जा’ से सार्वजनिक अपमान का अर्थ संक्षेप में सुरक्षित रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है; ‘याहवे’ उसका आधुनिक हिन्दी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: निनवे को स्त्रीलिंग एकवचन में संबोधन
  choice: तेरे/तेरी
  alternative: तुम्हारे/तुम्हारी
  rationale: इब्रानी के स्त्रीलिंग एकवचन संबोधन को निकटता से दर्शाने और नगर के व्यक्तिकरण को बनाए रखने के लिए एकवचन रूप रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। कठोर न्याय-बिंब को नरम नहीं किया गया, पर शब्दावली को अनावश्यक रूप से अश्लील भी नहीं बनाया गया।
