  text: גַּם אַ֣תְּ תִּשְׁכְּרִ֔י תְּהִ֖י נַֽעֲלָמָ֑ה גַּם אַ֛תְּ תְּבַקְשִׁ֥י מָע֖וֹז מֵ/אוֹיֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/011.yaml
  text: You too will become drunk[a]; you will be hidden[b]. You too will seek a refuge from the enemy.
translation:
  language: hi
  text: तू भी मदहोश हो जाएगी[a]; तू छिपी हुई होगी। तू भी शत्रु से बचने के लिए शरण[b] ढूँढ़ेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “मदहोश” होना संभवतः केवल वास्तविक नशे को नहीं, बल्कि न्याय से अभिभूत होकर लड़खड़ाने के भविष्यसूचक बिंब को भी व्यक्त करता है।
    reason: cultural_note
  - marker: b
    text: या “गढ़” अथवा “दुर्ग”।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אַתְּ
  choice: तू भी
  rationale: यह स्त्रीलिंग एकवचन संबोधन नीनवे से है और पिछले पदों में नो-अमोन के साथ की गई तुलना को आगे बढ़ाता है। ‘तू भी’ उसकी समान नियति पर स्वाभाविक रूप से बल देता है।
- source_word: תִּשְׁכְּרִי
  choice: मदहोश हो जाएगी
  rationale: שׁכר का काल-रूप नशे में होने या मदहोश हो जाने का ठोस बिंब देता है। भविष्यसूचक न्याय के प्रसंग में यह अभिभूत होकर लड़खड़ाने का भाव भी रख सकता है, इसलिए मुख्य पाठ में बिंब को बनाए रखा गया है।
- source_word: תְּהִי נַעֲלָמָה
  choice: तू छिपी हुई होगी
  rationale: היה के साथ עלם का यह रूप छिपे या ओझल होने की परिणामी अवस्था व्यक्त करता है। यह अनुवाद मूल के निष्क्रिय भाव को बिना किसी अनकहे कर्ता को जोड़े बनाए रखता है।
- source_word: תְּבַקְשִׁי
  choice: ढूँढ़ेगी
  rationale: בקש यहाँ किसी सुरक्षा-स्थान को खोजने या पाने का प्रयत्न व्यक्त करता है। ‘ढूँढ़ेगी’ आधुनिक हिन्दी में सहज है और सक्रिय खोज का भाव स्पष्ट रखता है।
- source_word: מָעוֹז
  choice: शरणस्थान
  rationale: מָעוֹז सुरक्षा या सामर्थ्य देने वाले स्थान को दर्शाता है। प्रसंग में नीनवे आक्रमण से बचाव खोजती है, इसलिए ‘शरणस्थान’ कार्यात्मक अर्थ को स्पष्ट करता है; किलेबंद स्थान का अधिक ठोस अर्थ पादटिप्पणी में रखा गया है।
- source_word: מֵאוֹיֵב
  choice: शत्रु से बचने के लिए
  rationale: מִן यहाँ शत्रु से दूरी या सुरक्षा का संबंध व्यक्त करता है। हिन्दी में ‘शत्रु से बचने के लिए’ इस आशय को स्वाभाविक और स्पष्ट बनाता है।
theological_decisions:
- issue: मदहोशी के बिंब का आशय
  choice: मुख्य पाठ में मदहोशी का ठोस बिंब बनाए रखा गया
  alternative: सीधे ‘न्याय से अभिभूत हो जाएगी’ कहना
  rationale: भविष्यसूचक संदर्भ में यह न्याय के अधीन अभिभूत होकर लड़खड़ाने की ओर संकेत कर सकता है, पर इस पद में ‘न्याय’ या ‘क्रोध’ स्पष्ट रूप से नहीं कहा गया। इसलिए व्याख्यात्मक अर्थ थोपने के बजाय मूल बिंब और उसकी तनावपूर्ण व्यापकता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। नीनवे के लिए मूल इब्रानी के स्त्रीलिंग एकवचन संबोधन को ‘तू’ और स्त्रीलिंग क्रियाओं से सुरक्षित रखा गया है। निष्क्रिय परिणामी भाव के लिए ‘छिपी हुई होगी’ चुना गया है, ताकि मूल में न बताए गए कर्ता को न जोड़ा जाए।
