source:
  edition: WLC
  text: ק֣וֹל שׁ֔וֹט וְ/ק֖וֹל רַ֣עַשׁ אוֹפָ֑ן וְ/ס֣וּס דֹּהֵ֔ר וּ/מֶרְכָּבָ֖ה מְרַקֵּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/002.yaml
  text: The crack of the whip[a], and the rumble of the wheel[b], with galloping horse and bounding chariot!
translation:
  language: hi
  text: चाबुक की चटकार[a] और पहिए की गड़गड़ाहट[b]—सरपट दौड़ता घोड़ा और उछलता रथ!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चाबुक की आवाज़ और खड़खड़ाते पहिए की आवाज़।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में कोई पूर्ण क्रिया दिए बिना छोटी-छोटी ध्वनि और गति की छवियाँ एक के बाद एक रखी गई हैं; इससे युद्ध का दृश्य तत्काल और तीव्र जान पड़ता है।
    reason: cultural_note
lexical_decisions:
- source_word: קוֹל
  choice: चटकार / गड़गड़ाहट
  rationale: קוֹל का सामान्य अर्थ ‘आवाज़’ है। यहाँ जिन वस्तुओं की आवाज़ है, उनके अनुरूप ‘चटकार’ और ‘गड़गड़ाहट’ कहना दृश्य की श्रव्य तीव्रता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שׁוֹט
  choice: चाबुक
  rationale: यह हाँकने या मारने के लिए प्रयुक्त चाबुक को सूचित करता है; युद्ध-रथ के प्रसंग में यह सरल और प्रचलित शब्द है।
- source_word: רַעַשׁ
  choice: गड़गड़ाहट
  rationale: इस शब्द में हिलने, खड़खड़ाने या भारी शोर का भाव है। पहिए के साथ ‘गड़गड़ाहट’ तीव्र गति से चलते रथ की भारी ध्वनि को व्यक्त करती है।
- source_word: אוֹפָן
  choice: पहिया
  rationale: इसका सामान्य अर्थ ‘पहिया’ है; आगे रथ का उल्लेख होने के कारण ‘रथ का पहिया’ जोड़ना आवश्यक नहीं है।
- source_word: סוּס
  choice: घोड़ा
  rationale: मूल शब्द केवल ‘घोड़ा’ कहता है। युद्ध का प्रसंग होने पर भी ‘युद्ध-घोड़ा’ जैसी व्याख्यात्मक वृद्धि नहीं की गई।
- source_word: דֹּהֵר
  choice: सरपट दौड़ता
  rationale: कृदन्त घोड़े की तेज़ गति दर्शाता है। ‘सरपट दौड़ता’ आधुनिक हिन्दी में स्पष्ट, सजीव और घोड़े के लिए स्वाभाविक है।
- source_word: מֶרְכָּבָה
  choice: रथ
  rationale: एकवचन संज्ञा का सीधा और प्रसंगानुकूल हिन्दी रूप ‘रथ’ है।
- source_word: מְרַקֵּדָה
  choice: उछलता
  rationale: רקד का मूल भाव उछलने या नाचने का है। तेज़ गति में झटके खाते रथ के लिए ‘उछलता’ भौतिक चित्र को सुरक्षित रखता है और उत्सवपूर्ण ‘नाचता’ के भ्रामक भाव से बचाता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सजीव और गरिमापूर्ण रखी गई है। मूल की क्रियारहित, तीव्र चित्र-माला को बनाए रखने के लिए पूर्ण वाक्य की क्रिया नहीं जोड़ी गई; डैश श्रव्य चित्रों से गतिशील दृश्य की ओर तेज़ संक्रमण दिखाता है।
