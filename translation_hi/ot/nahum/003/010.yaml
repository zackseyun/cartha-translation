  text: גַּם הִ֗יא לַ/גֹּלָה֙ הָלְכָ֣ה בַ/שֶּׁ֔בִי גַּ֧ם עֹלָלֶ֛י/הָ יְרֻטְּשׁ֖וּ בְּ/רֹ֣אשׁ כָּל חוּצ֑וֹת וְ/עַל נִכְבַּדֶּ֨י/הָ֙ יַדּ֣וּ גוֹרָ֔ל וְ/כָל גְּדוֹלֶ֖י/הָ רֻתְּק֥וּ בַ/זִּקִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/010.yaml
  text: Yet she too went into exile[a], into captivity; her children too were dashed to pieces at the head of every street. They cast lots for her honored men[d][c][b], and all her great men were bound in chains.
translation:
  language: hi
  text: फिर भी वह भी निर्वासन में गई, बंदी बनाकर ले जाई गई; उसके नन्हे बच्चे भी हर गली के मुहाने पर पटककर मार डाले गए। उसके प्रतिष्ठित पुरुषों पर चिट्ठियाँ डाली गईं, और उसके सभी बड़े लोग बेड़ियों में जकड़े गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם הִיא
  choice: फिर भी वह भी
  rationale: גַּם तुलना और बल दोनों व्यक्त करता है; प्रसंग में नो-अमोन का उदाहरण नीनवे के सामने रखा गया है। स्त्रीलिंग एकवचन संकेत भी सुरक्षित है।
- source_word: לַגֹּלָה הָלְכָה בַשֶּׁבִי
  choice: निर्वासन में गई, बंदी बनाकर ले जाई गई
  rationale: הלך + גולה निर्वासित होने को व्यक्त करता है, जबकि בַשֶּׁבִי बंदी बनाए जाने की समानांतर और तीव्रतर छवि जोड़ता है। हिंदी में कर्मवाच्य विस्तार जबरन ले जाए जाने का आशय स्वाभाविक रूप से स्पष्ट करता है।
- source_word: עֹלָלֶיהָ
  choice: उसके नन्हे बच्चे
  rationale: עֹלָלִים बहुत छोटे बच्चों को सूचित करता है; 'नन्हे बच्चे' सामान्य पाठक के लिए सहज रहते हुए आयु-संबंधी विशिष्टता बनाए रखता है।
- source_word: יְרֻטְּשׁוּ
  choice: पटककर मार डाले गए
  rationale: רטש यहाँ बच्चों की क्रूर हत्या का ग्राफिक वर्णन है। यह हिंदी अभिव्यक्ति हिंसा को नरम किए बिना स्वाभाविक और स्पष्ट है।
- source_word: בְּרֹאשׁ כָּל חוּצוֹת
  choice: हर गली के मुहाने पर
  rationale: शाब्दिक अर्थ 'हर गली के सिर पर' है; 'मुहाने पर' प्रवेश-स्थान या प्रमुख सिरे का अर्थ आधुनिक हिंदी में स्वाभाविक ढंग से देता है।
- source_word: נִכְבַּדֶּיהָ
  choice: उसके प्रतिष्ठित पुरुष
  rationale: כבד से निकला यह रूप सामाजिक सम्मान और ऊँचे दर्जे का बोध देता है। 'प्रतिष्ठित पुरुष' मूल की सम्मान-संबंधी छाया रखता है, बिना इसे केवल शासकीय कुलीनता तक सीमित किए।
- source_word: יַדּוּ גוֹרָל
  choice: चिट्ठियाँ डाली गईं
  rationale: यह बाँटने या स्वामित्व तय करने के लिए चिट्ठी डालने का प्रचलित मुहावरा है। हिंदी में कर्मवाच्य संदर्भ के अनिर्दिष्ट विजेताओं को स्वाभाविक रूप से दर्शाता है।
- source_word: גְּדוֹלֶיהָ
  choice: उसके सभी बड़े लोग
  rationale: यह सामाजिक रूप से शक्तिशाली या प्रमुख व्यक्तियों को दर्शाता है। 'बड़े लोग' अर्थ की व्यापकता रखता है; 'नेता' कहना इसे अनावश्यक रूप से संकीर्ण कर देता।
- source_word: רֻתְּקוּ בַזִּקִּים
  choice: बेड़ियों में जकड़े गए
  rationale: क्रिया मजबूती से बाँधे जाने और זִקִּים लोहे के बंधनों का बोध देती है। यह हिंदी वाक्यांश कैद और अपमान दोनों को स्पष्ट करता है।
