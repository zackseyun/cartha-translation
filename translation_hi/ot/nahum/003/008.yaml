source:
  edition: WLC
  text: הֲ/תֵֽיטְבִי֙ מִ/נֹּ֣א אָמ֔וֹן הַ/יֹּֽשְׁבָה֙ בַּ/יְאֹרִ֔ים מַ֖יִם סָבִ֣יב לָ֑/הּ אֲשֶׁר חֵ֣יל יָ֔ם מִ/יָּ֖ם חוֹמָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/008.yaml
  text: Are you better than No-amon, who sat among the Nile channels, with waters all around her, whose rampart was the sea, whose wall was from the sea?
translation:
  language: hi
  text: क्या तू नो-अमोन[a] से बढ़कर है, जो नील की धाराओं के बीच बसी थी, जिसके चारों ओर पानी था, जिसका परकोटा समुद्र था और जिसकी शहरपनाह समुद्र ही से थी?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: नो-अमोन मिस्र का प्राचीन नगर थीब्स था।
    reason: लिप्यंतरित प्राचीन स्थान-नाम की पहचान आधुनिक पाठकों के लिए स्पष्ट करना।
lexical_decisions:
- source_word: הֲתֵיטְבִי מִנֹּא אָמוֹן
  choice: क्या तू नो-अमोन से बढ़कर है
  rationale: स्त्रीलिंग एकवचन संबोधन नीनवे से है। יטב מן का तुलनात्मक भाव यहाँ ‘से बढ़कर/बेहतर होना’ है; ‘बढ़कर’ नगर की सामर्थ्य और सुरक्षित स्थिति के संदर्भ में स्वाभाविक है।
- source_word: נֹא אָמוֹן
  choice: नो-अमोन
  rationale: मिस्र के प्राचीन नगर का इब्रानी नाम लिप्यंतरित किया गया है; पाठक की सहायता के लिए पादटिप्पणी में इसकी पहचान दी गई है।
- source_word: הַיֹּשְׁבָה
  choice: बसी थी
  rationale: ישׁב का अर्थ बैठना या निवास करना हो सकता है। नगर के भौगोलिक स्थान के वर्णन में ‘बसी थी’ आधुनिक हिन्दी में स्वाभाविक है और मूल अर्थ को सुरक्षित रखता है।
- source_word: בַיְאֹרִים
  choice: नील की धाराओं के बीच
  rationale: יְאֹרִים बहुवचन में नील की शाखाओं या जलधाराओं को सूचित करता है; केवल सामान्य ‘नदियाँ’ कहने से मिस्री भौगोलिक संकेत खो जाता।
- source_word: חֵיל
  choice: परकोटा
  rationale: यहाँ חיל सैन्य शक्ति के बजाय नगर की बाहरी रक्षात्मक संरचना या प्राचीर का बोध देता है।
- source_word: חוֹמָתָהּ
  choice: उसकी शहरपनाह
  rationale: חוֹמָה नगर की दीवार है। ‘शहरपनाह’ इसे परकोटे से अलग रखते हुए काव्यात्मक समानांतरता बनाए रखता है।
theological_decisions:
- issue: नीनवे और नो-अमोन की तुलना
  choice: प्रश्न को सीधी, अनिर्णीत चुनौती के रूप में रखा गया है
  alternative: क्या तू नो-अमोन से अधिक सुरक्षित है
  rationale: मूल में तुलना सामान्य रूप से ‘बेहतर/बढ़कर’ है; ‘अधिक सुरक्षित’ प्रसंगानुकूल व्याख्या है, पर मूल की व्यापकता को सीमित कर देती है।
- issue: समुद्र का अर्थ
  choice: ‘समुद्र’ बनाए रखा गया है
  alternative: नील / विशाल जलराशि
  rationale: יָם का शाब्दिक रूप ‘समुद्र’ है और यहाँ संभवतः नील अथवा उसके विस्तृत जल का काव्यात्मक उल्लेख है। अनुवाद में इस चित्रात्मक अस्पष्टता को नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। नीनवे के लिए स्त्रीलिंग ‘तू’ और नो-अमोन के लिए ‘बसी थी’ रखा गया है। ‘परकोटा’ तथा ‘शहरपनाह’ मूल की दो रक्षात्मक संज्ञाओं का भेद और काव्यात्मक समानांतरता व्यक्त करते हैं।
