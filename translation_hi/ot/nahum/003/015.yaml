  text: שָׁ֚ם תֹּאכְלֵ֣/ךְ אֵ֔שׁ תַּכְרִיתֵ֣/ךְ חֶ֔רֶב תֹּאכְלֵ֖/ךְ כַּ/יָּ֑לֶק הִתְכַּבֵּ֣ד כַּ/יֶּ֔לֶק הִֽתְכַּבְּדִ֖י כָּ/אַרְבֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/015.yaml
  text: There the fire will devour you; the sword will cut you off; it will devour you like the locust[a]. Multiply yourself like the locust; multiply yourself like the swarming locust.
translation:
  language: hi
  text: वहाँ आग तुझे निगल जाएगी; तलवार तेरा नाश कर देगी; वह तुझे टिड्डी[a] की तरह निगल जाएगी। टिड्डी की तरह अपनी संख्या बढ़ा; टिड्डी-दल की तरह अपनी संख्या बढ़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में यहाँ टिड्डी-सदृश कीटों के लिए दो संबंधित शब्द आए हैं: יֶלֶק, जो संभवतः टिड्डी के किसी प्रकार या अवस्था को दर्शाता है, और אַרְבֶּה, जो टिड्डी के लिए सामान्य शब्द है। मुख्य पाठ में इनके लिए क्रमशः ‘टिड्डी’ और ‘टिड्डी-दल’ कहा गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: वहीं
  rationale: यह स्थानवाचक क्रियाविशेषण उसी स्थान पर बल देता है जहाँ नीनवे अपने को सुरक्षित समझती है; ‘वहीं’ इस बल को स्वाभाविक हिन्दी में रखता है।
- source_word: תֹּאכְלֵךְ ... אֵשׁ
  choice: आग तुझे निगल जाएगी
  rationale: אָכַל का मूल चित्र ‘खाना/निगलना’ है। आग के साथ ‘निगल जाएगी’ विनाश की सजीव उपमा और क्रिया की तीव्रता बनाए रखता है।
- source_word: תַּכְרִיתֵךְ חֶרֶב
  choice: तलवार तेरा नाश कर देगी
  rationale: כרת के हिफ़ील रूप का अर्थ यहाँ काट डालना या नष्ट कर देना है। शाब्दिक ‘तुझे काट देगी’ आधुनिक हिन्दी में अपेक्षित आशय अस्पष्ट कर सकता है, इसलिए ‘नाश कर देगी’ चुना गया।
- source_word: תֹּאכְלֵךְ
  choice: वह तुझे ... निगल जाएगी
  rationale: दोहराई गई क्रिया को ‘निगल जाएगी’ के रूप में फिर रखा गया है। ‘वह’ निकटवर्ती स्त्रीलिंग ‘तलवार’ की ओर संकेत करता है और इब्रानी की संक्षिप्तता बनाए रखता है।
- source_word: כַּיָּלֶק / כַּיֶּלֶק
  choice: भक्षक टिड्डी की तरह
  rationale: יֶלֶק किसी भक्षण करने वाले टिड्डी-सदृश कीट या टिड्डी की अवस्था को सूचित करता है। ‘भक्षक टिड्डी’ विनाशकारी क्रिया से इसका संबंध स्पष्ट करते हुए दूसरे कीट-शब्द से कुछ भेद भी बनाए रखता है।
- source_word: הִתְכַּבֵּד / הִתְכַּבְּדִי
  choice: अपनी संख्या बढ़ा
  rationale: כבד का यह आत्मवाचक आदेश यहाँ भारी अथवा बहुत हो जाने, अर्थात संख्या में बढ़ने, का भाव देता है। यह व्यंग्यपूर्ण आज्ञा आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: כָּאַרְבֶּה
  choice: टिड्डी-दल की तरह
  rationale: אַרְבֶּה टिड्डी का सामान्य शब्द है और सामूहिक झुंड की छवि जगा सकता है। ‘टिड्डी-दल’ पहले की יֶלֶק-संज्ञा से भेद रखते हुए बहुसंख्या का भाव व्यक्त करता है।
