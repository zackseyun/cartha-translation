id: NAM.3.19
reference: Nahum 3:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֵין כֵּהָ֣ה לְ/שִׁבְרֶ֔/ךָ נַחְלָ֖ה מַכָּתֶ֑/ךָ כֹּ֣ל שֹׁמְעֵ֣י שִׁמְעֲ/ךָ֗ תָּ֤קְעוּ כַף֙ עָלֶ֔י/ךָ כִּ֗י עַל מִ֛י לֹֽא עָבְרָ֥ה רָעָתְ/ךָ֖ תָּמִֽיד־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/019.yaml
  text: There is no healing for your fracture[a]; your wound is grievous. All who hear the report about you clap their hands over you[b], for over whom has your evil not continually passed?
translation:
  language: hi
  text: तेरी टूटन का कोई उपचार नहीं है[a]; तेरा घाव गंभीर है। तेरे बारे में समाचार सुननेवाले सभी तुझ पर तालियाँ बजाते हैं[b], क्योंकि तेरी बुराई से कौन लगातार पीड़ित नहीं हुआ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरी टूटन से कोई राहत नहीं; तेरा घाव बहुत गहरा है।’
    reason: lexical_alternative
  - marker: b
    text: इस आलंकारिक प्रश्न का आशय है कि नीनवे की बुराई से लगभग सभी लोग प्रभावित हुए थे; इसलिए राष्ट्र उसके पतन पर आनन्द मनाते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: אֵין כֵּהָה לְשִׁבְרֶךָ
  choice: तेरी टूटन का कोई उपचार नहीं है
  rationale: अस्तित्ववाचक निषेध और चोट के रूपक को स्वाभाविक हिन्दी में व्यक्त करता है। ‘टूटन’ שׁבר की टूटने, विनाश और पतन की अर्थ-व्याप्ति को बनाए रखता है, जबकि ‘उपचार’ כֵּהָה के राहत या चंगाई के भाव को संदर्भानुकूल रूप देता है।
- source_word: נַחְלָה מַכָּתֶךָ
  choice: तेरा घाव गंभीर है
  rationale: מַכָּה के चोट या घाव के रूपक को बनाए रखते हुए נַחְלָה की गंभीरता को व्यक्त करता है; ‘लाइलाज’ कहकर निहितार्थ को मूल से अधिक स्पष्ट नहीं किया गया।
- source_word: כֹּל שֹׁמְעֵי שִׁמְעֲךָ
  choice: तेरे बारे में समाचार सुननेवाले सभी
  rationale: यह वाक्यांश नीनवे के विषय में फैले समाचार, विशेषकर उसके पतन के समाचार, को सूचित करता है। हिन्दी में ‘तेरे बारे में समाचार’ इसी संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: תָּקְעוּ כַף עָלֶיךָ
  choice: तुझ पर तालियाँ बजाते हैं
  rationale: हथेली पर हाथ मारने के इब्रानी मुहावरे को हिन्दी के परिचित मुहावरे से व्यक्त किया गया है। ‘तुझ पर’ से नीनवे के पतन पर शत्रुतापूर्ण हर्ष का भाव बना रहता है।
- source_word: כִּי עַל מִי לֹא עָבְרָה רָעָתְךָ תָּמִיד
  choice: क्योंकि तेरी बुराई से कौन लगातार पीड़ित नहीं हुआ?
  rationale: मूल के आलंकारिक प्रश्न और व्यापक नैतिक आरोप को स्वाभाविक हिन्दी में रखा गया है। עבר की शाब्दिक गति-छवि हिन्दी में अस्वाभाविक होती; ‘पीड़ित हुआ’ उसके संदर्भगत परिणाम को व्यक्त करता है, और ‘लगातार’ תָּמִיד को दर्शाता है।
theological_decisions:
- issue: न्याय-वाणी में רָעָתְךָ का अर्थ
  choice: तेरी बुराई
  alternative: तेरी दुष्टता / तेरी क्रूरता / तेरे द्वारा पहुँचाई गई हानि
  rationale: यहाँ अश्शूर/नीनवे की हिंसक और अत्याचारी गतिविधियों पर नैतिक अभियोग है। ‘बुराई’ व्यापक नैतिक अर्थ को सुरक्षित रखती है और इसे केवल क्रूरता या उसके परिणामस्वरूप हुई हानि तक सीमित नहीं करती।
- issue: अंतिम प्रश्न का व्यापक आशय
  choice: आलंकारिक प्रश्न को प्रश्न के रूप में बनाए रखना
  alternative: नीनवे की बुराई से लगभग सभी पीड़ित हुए थे
  rationale: मूल पाठ सार्वभौमिक प्रभाव का दावा आलंकारिक प्रश्न द्वारा करता है। उसे कथन में बदलने के बजाय प्रश्न-रूप रखने से उसकी काव्यात्मक तीक्ष्णता और संभावित अतिशयोक्तिपूर्ण व्यापकता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज रूप अपनाया गया है। नीनवे को संबोधन होने के कारण एकवचन अनौपचारिक ‘तू/तेरा’ रखा गया है, जो भविष्यद्वाणी की सीधी और तीखी वाणी के अनुकूल है। चोट और घाव का मूल रूपक सुरक्षित रखा गया है।
