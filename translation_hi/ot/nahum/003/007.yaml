translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। नीनवे को संबोधित करने वाले मूल के स्त्रीलिंग एकवचन रूपों को ‘तुझे/तेरे’ से बनाए रखा गया है, जबकि उद्धरण में ‘उसके’ द्वारा संबोधन से तीसरे पुरुष में हुए मूल परिवर्तन को भी सुरक्षित रखा गया है।
