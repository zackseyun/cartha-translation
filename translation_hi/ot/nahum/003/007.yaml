source:
  edition: WLC
  text: וְ/הָיָ֤ה כָל רֹאַ֨יִ/ךְ֙ יִדּ֣וֹד מִמֵּ֔/ךְ וְ/אָמַר֙ שָׁדְּדָ֣ה נִֽינְוֵ֔ה מִ֖י יָנ֣וּד לָ֑/הּ מֵ/אַ֛יִן אֲבַקֵּ֥שׁ מְנַחֲמִ֖ים לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/007.yaml
  text: And it will happen that all who see you will shrink from you and say, ‘Nineveh is devastated; who will grieve for her? Where can I seek comforters for you?’
translation:
  language: hi
  text: और ऐसा होगा कि हर कोई जो तुझे देखेगा, तुझसे दूर हट जाएगा और कहेगा, “नीनवे उजाड़ दी गई है! उसके लिए कौन शोक करेगा? मैं तेरे लिए सांत्वना देनेवाले कहाँ से खोजूँ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִדּוֹד מִמֵּךְ
  choice: तुझसे दूर हट जाएगा
  rationale: यह क्रिया किसी से दूर चले जाने या पीछे हटने का भाव देती है। यह अनुवाद भय या घृणा के कारण पलायन का संकेत बनाए रखता है, पर मूल से अधिक तीव्र ‘भाग जाएगा’ नहीं कहता।
- source_word: שָׁדְּדָה
  choice: उजाड़ दी गई है
  rationale: मूल का रूप नीनवे के विनाश और बरबादी को व्यक्त करता है; कर्मवाच्य हिन्दी इस पूर्ण हुई विपत्ति को स्वाभाविक ढंग से प्रस्तुत करती है।
- source_word: יָנוּד לָהּ
  choice: उसके लिए कौन शोक करेगा
  rationale: נוּד यहाँ किसी की दुर्दशा पर दुःख या सहानुभूति प्रकट करने का भाव रखता है। ‘शोक करेगा’ अगले वाक्यांश में सांत्वना देनेवालों के उल्लेख से भी स्वाभाविक रूप से जुड़ता है।
- source_word: מְנַחֲמִים
  choice: सांत्वना देनेवाले
  rationale: बहुवचन संज्ञा को स्पष्ट रूप से बनाए रखते हुए यह आधुनिक मानक हिन्दी में दिलासा या सांत्वना देनेवाले व्यक्तियों को दर्शाती है।
