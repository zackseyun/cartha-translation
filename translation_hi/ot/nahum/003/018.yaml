base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/018.yaml
  text: Your shepherds slumber[a], O king of Assyria; your nobles lie down. Your people are scattered on the mountains[d][c][b], and there is no one to gather them.
translation:
  language: hi
  text: हे अश्शूर के राजा, तेरे चरवाहे ऊँघ रहे हैं[a][b]; तेरे प्रतापी जन लेटे हुए हैं[c]। तेरी प्रजा पहाड़ों पर तितर-बितर हो गई है[d], और उसे इकट्ठा करनेवाला कोई नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सो रहे हैं।” इब्रानी चित्र लापरवाह, असमर्थ या निष्क्रिय अगुवों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “चरवाहे” अश्शूर के शासकों या अगुवों के लिए प्रयुक्त रूपक है।
    reason: cultural_note
  - marker: c
    text: या “तेरे प्रतापी जन निवास करते हैं/विश्राम करते हैं।” इब्रानी क्रिया का सामान्य अर्थ “निवास करना” है, पर यहाँ संभवतः निष्क्रिय पड़े अगुवों का चित्र जारी रहता है।
    reason: alternative_reading
  - marker: d
    text: “तितर-बितर हो गई है” के पीछे का इब्रानी रूप कठिन है; इस अर्थ को अगली पंक्ति—“उसे इकट्ठा करनेवाला कोई नहीं”—से समर्थन मिलता है।
    reason: textual_variant
lexical_decisions:
- source_word: נָמוּ
  choice: ऊँघ रहे हैं
  rationale: इब्रानी क्रिया נום नींद या ऊँघने को व्यक्त करती है। यह चुनाव अगुवों की निष्क्रियता का काव्यात्मक चित्र बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: רֹעֶיךָ
  choice: तेरे चरवाहे
  rationale: शाब्दिक चरवाहे का रूपक सुरक्षित रखा गया है; भविष्यद्वाणी के संदर्भ में यह राजा के अधीन शासकों या अगुवों की ओर संकेत करता है।
- source_word: מֶלֶךְ אַשּׁוּר
  choice: हे अश्शूर के राजा
  rationale: संदर्भ प्रत्यक्ष संबोधन का है; ‘हे’ हिन्दी में संबोधन को स्पष्ट और काव्यात्मक बनाता है।
- source_word: יִשְׁכְּנוּ
  choice: पड़े हुए हैं
  rationale: שׁכן का सामान्य अर्थ बसना है, पर यहाँ सोते हुए चरवाहों के समानांतर यह निष्क्रिय पड़े रहने या विश्राम करने का भाव देता है। वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: אַדִּירֶיךָ
  choice: तेरे सामंत
  rationale: यह शब्द प्रतापी, सामर्थी या कुलीन व्यक्तियों को सूचित कर सकता है। राजकीय संदर्भ में ‘सामंत’ सामाजिक-राजनीतिक पद और प्रतिष्ठा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נָפֹשׁוּ
  choice: तितर-बितर हो गई है
  rationale: इब्रानी रूप कठिन है, पर पहाड़ों पर होने और इकट्ठा करनेवाला कोई न होने की अगली पंक्ति से बिखराव का भाव प्रबल होता है। कठिनाई पादटिप्पणी में स्पष्ट की गई है।
- source_word: עַמְּךָ
  choice: तेरी प्रजा
  rationale: עַם का सामान्य अर्थ लोग या प्रजा है। राजा से संबोधन के कारण ‘प्रजा’ स्वाभाविक है और इसे अनावश्यक रूप से केवल सेना तक सीमित नहीं करता।
- source_word: עַל הֶהָרִים
  choice: पहाड़ों पर
  rationale: यह इब्रानी पूर्वसर्गीय वाक्यांश का सीधा और स्वाभाविक अनुवाद है।
- source_word: וְאֵין מְקַבֵּץ
  choice: और उसे इकट्ठा करनेवाला कोई नहीं
  rationale: इब्रानी में कर्म संदर्भ से समझा जाता है। हिन्दी में ‘उसे’ जोड़कर इसका संबंध सामूहिक संज्ञा ‘प्रजा’ से स्पष्ट किया गया है।
