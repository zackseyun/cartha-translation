base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/012.yaml
  text: All your fortresses are fig trees with first-ripe figs; if they are shaken[a], they fall into the mouth of the eater.
translation:
  language: hi
  text: तेरे सभी गढ़ जल्दी पकने वाले अंजीरों से लदे अंजीर के पेड़ों के समान हैं; यदि उन्हें हिलाया जाए, तो वे खाने वाले के मुँह में गिर पड़ते हैं।[क]
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, ‘जल्दी पकने वाले अंजीरों के समान’; यहाँ ‘अंजीर के पेड़’ लिया गया है, क्योंकि गढ़ों की तुलना और उन्हें हिलाने का बिंब पेड़ों के साथ अधिक स्वाभाविक बैठता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְצָרַיִךְ
  choice: तेरे सभी गढ़
  rationale: यह संज्ञा किलेबंद स्थानों को दर्शाती है। ‘गढ़’ सैन्य बिंब को ठोस और सहज हिन्दी में बनाए रखता है; स्त्रीलिंग एकवचन प्रत्यय से संबोधन नीनवे से है।
- source_word: תְּאֵנִים
  choice: अंजीर के पेड़ों के समान
  rationale: रूप का अर्थ ‘अंजीर’ भी हो सकता है, पर किलेबंद स्थानों की तुलना अंजीर के पेड़ों से करना अगले खंड में उन्हें हिलाए जाने और फल गिरने के बिंब से अधिक स्वाभाविक रूप से जुड़ता है। ‘के समान’ हिन्दी में निहित उपमा स्पष्ट करता है।
- source_word: עִם בִּכּוּרִים
  choice: पहले पके अंजीरों से लदे
  rationale: בִּכּוּרִים यहाँ आरम्भ में पकने वाले फलों को दर्शाता है। ‘पहले पके अंजीर’ कृषि-बिंब को बनाए रखता है और अनावश्यक रीति-विधान संबंधी अर्थ नहीं जोड़ता; ‘से लदे’ पेड़ों और फलों का स्वाभाविक संबंध व्यक्त करता है।
- source_word: אִם
  choice: यदि
  rationale: मूल का सशर्त भाव सुरक्षित रखा गया है, यद्यपि उपमा में परिणाम सहज और अपेक्षित है।
- source_word: יִנּוֹעוּ
  choice: उन्हें हिलाया जाए
  rationale: נוע का अर्थ हिलना, डोलना या हिलाया जाना हो सकता है। यहाँ फलदार पेड़ों पर बाहरी क्रिया का निष्क्रिय रूप प्रसंगानुकूल है।
- source_word: וְנָפְלוּ
  choice: तो वे ... आ गिरते हैं
  rationale: शर्त के बाद आया पूर्ण क्रियारूप परिणामी क्रिया बताता है। वर्तमानकाल सामान्य और सजीव उपमा को हिन्दी में स्वाभाविक बनाता है।
- source_word: עַל פִּי אוֹכֵל
  choice: खानेवाले के मुँह में
  rationale: शाब्दिक रूप ‘खानेवाले के मुँह पर’ है; हिन्दी में ‘मुँह में आ गिरते हैं’ फल की सहज उपलब्धता और गढ़ों की असुरक्षा को स्पष्ट और मुहावरेदार ढंग से व्यक्त करता है।
