base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/009.yaml
  text: Cush was her strength[a], and Egypt without end[d][c][b]; Put and the Libyans were among your helpers.
translation:
  language: hi
  text: कूश उसकी[a] शक्ति था, और मिस्र का कोई अंत न था[b]; पूत[c] और लूबी लोग[d] तेरी सहायता के लिए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ ‘उसकी’ है, लेकिन वचन के अंत में संबोधन ‘तेरी’ हो जाता है। कुछ अनुवाद दोनों को मिलाकर यहाँ भी ‘तेरी शक्ति’ करते हैं।
    reason: alternative_reading
  - marker: b
    text: 'शाब्दिक रूप से: ‘और कोई अंत न था।’ यह संक्षिप्त पदबंध किससे जुड़ता है, यह पूरी तरह स्पष्ट नहीं; यहाँ इसे निकटवर्ती ‘मिस्र’ से जोड़ा गया है और इसका भाव अपरिमित सामर्थ्य या संसाधन है।'
    reason: lexical_alternative
  - marker: c
    text: ‘पूत’ एक प्राचीन जाति या भूभाग का नाम है; इसे कभी-कभी ‘फूत’ भी लिखा जाता है।
    reason: cultural_note
  - marker: d
    text: इब्रानी ‘लूबीम’; संभवतः लीबिया क्षेत्र के लोग।
    reason: cultural_note
lexical_decisions:
- source_word: כּוּשׁ
  choice: कूश
  rationale: इसे किसी आधुनिक देश से निश्चित रूप से समान ठहराने के बजाय इब्रानी स्थान/जाति-नाम का लिप्यंतरण किया गया है।
- source_word: עָצְמָהּ
  choice: उसकी शक्ति था
  rationale: संज्ञा पर लगा प्रत्यय अन्य स्त्रीलिंग एकवचन का है, इसलिए ‘उसकी’ रखा गया है; बाद के द्वितीय पुरुष ‘तेरी’ के साथ आए मूल पाठ के पुरुष-परिवर्तन को समतल नहीं किया गया।
- source_word: וּמִצְרַיִם
  choice: और मिस्र भी
  rationale: मिस्र को कूश के साथ उस नगर की शक्ति में सम्मिलित सहयोगी के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: וְאֵין קֵצֶה
  choice: जिसका कोई अंत न था
  rationale: इब्रानी मुहावरा अपरिमित विस्तार या संख्या बताता है। निकटतम व्याकरणिक संबंध मिस्र से रखा गया है, जबकि टिप्पणी में मूल की संक्षिप्तता और संभावित अस्पष्टता बताई गई है।
- source_word: פּוּט
  choice: पूत
  rationale: इब्रानी जाति/स्थान-नाम का सीधा देवनागरी लिप्यंतरण।
- source_word: לוּבִים
  choice: लूबी लोग
  rationale: इब्रानी जातिवाचक बहुवचन को नाम के निकट रहते हुए हिन्दी में लोगों के समूह के रूप में स्पष्ट किया गया है।
- source_word: הָיוּ בְּעֶזְרָתֵךְ
  choice: तेरी सहायता के लिए थे
  rationale: בְּעֶזְרָתֵךְ का आशय उस संबोधित स्त्रीलिंग नगर को उपलब्ध सहायता से है; हिन्दी में यह सहज और अर्थनिष्ठ है तथा द्वितीय पुरुष स्त्रीलिंग संबोधन बनाए रखता है।
