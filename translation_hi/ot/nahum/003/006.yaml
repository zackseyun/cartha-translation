  text: וְ/הִשְׁלַכְתִּ֥י עָלַ֛יִ/ךְ שִׁקֻּצִ֖ים וְ/נִבַּלְתִּ֑י/ךְ וְ/שַׂמְתִּ֖י/ךְ כְּ/רֹֽאִי׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/006.yaml
  text: And I will throw filth upon you[a], and treat you with contempt[b], and make you a spectacle.
translation:
  language: hi
  text: मैं तुझ पर घिनौनी वस्तुएँ फेंकूँगा[a], तेरा अपमान करूँगा, और तुझे तमाशा बना दूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घृणित वस्तुएँ” अथवा “गंदगी।” इब्रानी शब्द प्रायः धार्मिक या नैतिक रूप से घिनौनी मानी जाने वाली चीज़ों के लिए आता है; यहाँ सार्वजनिक रूप से अपमानित करने के लिए फेंकी गई घिनौनी वस्तुओं का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक भाव: “तुझे देखने की वस्तु बना दूँगा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁלַכְתִּי עָלַיִךְ
  choice: मैं तुझ पर ... फेंकूँगा
  rationale: हिफ़िल क्रिया जान-बूझकर फेंकने का भाव देती है, और עַל के साथ स्त्रीलिंग एकवचन प्रत्यय नीनवे को संबोधित करते हुए स्थानगत अर्थ ‘तुझ पर’ देता है।
- source_word: שִׁקֻּצִים
  choice: घिनौनी वस्तुएँ
  rationale: यह शब्द उन वस्तुओं के लिए आता है जो धार्मिक या नैतिक रूप से घृणित मानी जाती हैं। इस अपमान के प्रसंग में ठोस, घिन पैदा करने वाली वस्तुओं का संकेत संभव है; ‘घिनौनी वस्तुएँ’ उस अर्थ-सीमा को ‘गंदगी’ की अपेक्षा अधिक खुला रखता है।
- source_word: וְנִבַּלְתִּיךְ
  choice: तेरा अपमान करूँगा
  rationale: पिएल रूप यहाँ नीचा दिखाने, अपमानित करने या तिरस्कार का पात्र बनाने का भाव रखता है। ‘तेरा अपमान करूँगा’ आधुनिक हिन्दी में स्वाभाविक और सीधा है।
- source_word: וְשַׂמְתִּיךְ כְּרֹאִי
  choice: तुझे तमाशा बना दूँगा
  rationale: शाब्दिक भाव किसी को देखने की वस्तु के रूप में रख देना है। ‘तमाशा बना दूँगा’ सार्वजनिक प्रदर्शन और अपमान दोनों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: स्त्री के रूप में व्यक्त नीनवे के सार्वजनिक अपमान और न्याय का बिंब
  choice: कठोर न्याय और सार्वजनिक अपमान के बिंब को बिना नरम किए बनाए रखा गया है।
  alternative: 'अधिक शाब्दिक रूप: ‘तुझे देखने की वस्तु बना दूँगा’; अथवा שִׁקֻּצִים को केवल ‘गंदगी’ कहना।'
  rationale: इब्रानी पाठ नीनवे को स्त्रीलिंग एकवचन में संबोधित करता है और उसके अपमान को चित्रित करता है। अनुवाद इसमें अतिरिक्त यौनार्थ या सांप्रदायिक व्याख्या नहीं जोड़ता, और शेष पद्यांश के अर्थ को स्वाभाविक हिन्दी में रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; नीनवे के लिए मूल पाठ के स्त्रीलिंग एकवचन संबोधन को ‘तुझ/तेरा/तुझे’ से बनाए रखा गया है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है।
