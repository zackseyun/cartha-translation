  choice: घेराबंदी के लिए ... पानी
  rationale: शाब्दिक अर्थ ‘घेराबंदी का पानी’ है; प्रसंग में आने वाली घेराबंदी की तैयारी हेतु पानी जमा करने का भाव है।
- source_word: שַׁאֲבִי לָךְ
  choice: अपने वास्ते पानी भर ले
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप और לָךְ के हितार्थक/आत्मसंबंधी भाव को सुरक्षित रखता है; संबोधन स्त्री के रूप में मानवीकृत नगर से है।
- source_word: חַזְּקִי מִבְצָרָיִךְ
  choice: अपने गढ़ों को मज़बूत कर
  rationale: חזק के पिएल आज्ञार्थक का अर्थ ‘मज़बूत करना’ और מִבְצָר का ठोस अर्थ किलाबंद स्थान या गढ़ है।
- source_word: בֹּאִי בַטִּיט
  choice: गारे में उतर
  rationale: טיט मिट्टी या गारा हो सकता है; ईंट बनाने के प्रसंग में ‘गारा’ स्वाभाविक है, और ‘उतर’ मूल की गति को व्यक्त करता है।
- source_word: וְרִמְסִי בַחֹמֶר
  choice: मिट्टी को पैरों से रौंद
  rationale: רמס का मूल भाव पैरों से रौंदना है; חֹמֶר यहाँ ईंट बनाने योग्य मिट्टी को सूचित करता है। ‘पैरों से’ हिन्दी में क्रिया की भौतिक छवि स्पष्ट करता है।
- source_word: הַחֲזִיקִי מַלְבֵּן
  choice: ईंट का साँचा थाम ले
  rationale: הַחֲזִיקִי यहाँ वस्तु को पकड़ने या थामने का अर्थ देता है। दुर्लभ מַלְבֵּן के लिए निकटवर्ती मिट्टी और गारे के काम के कारण ‘ईंट का साँचा’ मुख्य पाठ में चुना गया है।
