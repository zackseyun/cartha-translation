base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/014.yaml
  text: Draw water for yourself for the siege; strengthen your fortresses[a]. Go into the clay and tread the mortar; take hold of the brick mold.
translation:
  language: hi
  text: घेराबंदी के लिए अपने वास्ते पानी भर ले; अपने गढ़ों को मज़बूत कर। मिट्टी में उतर और गारे को पैरों से रौंद; ईंट का साँचा[a] थाम ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ईंट की भट्ठी।” इब्रानी शब्द מַלְבֵּן दुर्लभ है और उसका अर्थ ईंट का साँचा अथवा ईंट की भट्ठी हो सकता है; निकटवर्ती प्रसंग में गारे और मिट्टी पर काम होने के कारण “ईंट का साँचा” अधिक उपयुक्त लगता है।
    reason: lexical_alternative
