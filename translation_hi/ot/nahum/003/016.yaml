base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/016.yaml
  text: You multiplied your merchants more than the stars of the heavens[b][a]; the locust strips bare and flies away.
translation:
  language: hi
  text: तूने अपने व्यापारियों की संख्या आकाश के तारों से भी अधिक कर ली है। टिड्डी[a] उजाड़कर उड़ जाती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘छोटी टिड्डी’ अथवा ‘हॉपर’; इब्रानी शब्द टिड्डी की किसी विशेष जाति या अवस्था को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी क्रिया का अर्थ ‘फैलना’ या ‘उतार देना/नंगा कर देना’ भी हो सकता है; यहाँ संभवतः टिड्डी के उजाड़कर उड़ जाने का चित्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְבֵּית
  choice: तूने ... बढ़ा लिया है
  rationale: हिफ़ील पूर्ण, स्त्रीलिंग एकवचन में नीनवे को सीधा संबोधन है। यह चुनाव संख्या बढ़ाने के कारक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רֹכְלַיִךְ
  choice: अपने व्यापारियों को
  rationale: रֹכֵל का अर्थ व्यापारी या सौदागर है; नीनवे के व्यापक वाणिज्य के संदर्भ में ‘व्यापारी’ सहज और स्पष्ट है।
- source_word: מִכּוֹכְבֵי הַשָּׁמָיִם
  choice: आकाश के तारों से भी अधिक
  rationale: מִן यहाँ तुलना दिखाता है। ‘आकाश के तारों से भी अधिक’ असंख्यता का भाव स्पष्ट और स्वाभाविक ढंग से रखता है।
- source_word: יֶלֶק
  choice: टिड्डी
  rationale: यह शब्द टिड्डी की किसी विशेष जाति या अवस्था का द्योतक हो सकता है। मुख्य पाठ में सामान्य और सुबोध ‘टिड्डी’ रखा गया है तथा विशिष्टता की अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: פָּשַׁט
  choice: सब कुछ चट कर जाती
  rationale: क्रिया के अर्थों में फैलना, उतार देना या नंगा कर देना शामिल हैं। टिड्डी के प्रसंग में यह भूमि या वनस्पति को उजाड़ देने का चित्र है; हिन्दी मुहावरा ‘सब कुछ चट कर जाती’ उस विनाशकारी क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיָּעֹף
  choice: और उड़ जाती है
  rationale: עוּף का मूल अर्थ ‘उड़ना’ है। संयोजक क्रम को ‘और’ बनाए रखता है तथा टिड्डी के खाने के बाद अचानक चले जाने का चित्र देता है।
