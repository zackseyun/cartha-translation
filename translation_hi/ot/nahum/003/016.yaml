  register: आधुनिक मानक हिन्दी में नीनवे के लिए स्त्रीलिंग एकवचन ‘तू’ का सीधा संबोधन रखा गया है। शैली संक्षिप्त, काव्यात्मक और सामान्य पाठक के लिए सहज है; टिड्डी की अवस्था तथा פָּשַׁט की अर्थगत अनिश्चितता पादटिप्पणियों में सुरक्षित रखी गई है।
