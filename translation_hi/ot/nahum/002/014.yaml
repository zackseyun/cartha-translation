  text: הִנְ/נִ֣י אֵלַ֗יִ/ךְ נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת וְ/הִבְעַרְתִּ֤י בֶֽ/עָשָׁן֙ רִכְבָּ֔/הּ וּ/כְפִירַ֖יִ/ךְ תֹּ֣אכַל חָ֑רֶב וְ/הִכְרַתִּ֤י מֵ/אֶ֨רֶץ֙ טַרְפֵּ֔/ךְ וְ/לֹֽא יִשָּׁמַ֥ע ע֖וֹד ק֥וֹל מַלְאָכֵֽ/כֵה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/014.yaml
  text: Behold[a], I am against you, declares Yahweh of hosts, and I will burn your chariots in smoke; the sword will devour your young lions. I will cut off your prey from the earth[c][b], and the voice of your messengers will no longer be heard.
translation:
  language: hi
  text: देखो[a], मैं तेरे विरुद्ध हूँ—सेनाओं के याहवे की यह घोषणा है। मैं तेरे रथों को धुएँ में जला दूँगा[b], और तलवार तेरे जवान सिंहों[c] को निगल जाएगी। मैं धरती से तेरा शिकार मिटा दूँगा, और तेरे दूतों[d] की आवाज़ फिर कभी सुनाई नहीं देगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक भाव ‘देखो’ या ‘ध्यान दो’ है; यह आने वाली गंभीर घोषणा की ओर ध्यान खींचता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘धुआँ बनाकर जला दूँगा।’ इब्रानी वाक्यांश जलाने की रीति (‘धुएँ में’) अथवा उसके परिणाम (‘धुआँ बनाकर’) पर बल दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘जवान सिंह’ नीनवे से जुड़े सिंह-बिंब को आगे बढ़ाता है; संभवतः इससे उसके योद्धा या शासक अभिप्रेत हैं।
    reason: cultural_note
  - marker: d
    text: या ‘राजदूतों।’ इब्रानी शब्द आधिकारिक काम से भेजे गए मानवीय संदेशवाहकों के लिए भी प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי אֵלַיִךְ
  choice: देख, मैं तेरे विरुद्ध हूँ
  rationale: यह भविष्यद्वक्ताओं में प्रयुक्त गंभीर सामना-सूचक सूत्र है। ‘देख’ ध्यान खींचने वाले הִנְנִי का स्वाभाविक आधुनिक हिन्दी रूप है; אֵלַיִךְ यहाँ विरोध का भाव रखता है।
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे की यह घोषणा है
  rationale: נְאֻם को औपचारिक ईश्वरीय घोषणा के रूप में और צְבָאוֹת को अर्थानुसार ‘सेनाओं के’ रखा गया है; יְהוָה को नाम ‘याहवे’ से व्यक्त किया गया है।
- source_word: וְהִבְעַרְתִּי בֶעָשָׁן רִכְבָּהּ
  choice: मैं तेरे रथों को धुएँ में जला दूँगा
  rationale: רִכְבָּהּ व्याकरणतः एकवचन होते हुए भी सामूहिक रथ-सेना का बोध करा सकता है। בֶעָשָׁן में जलने की रीति अथवा परिणाम—दोनों की संभावना है, जिसे पाठ और पादटिप्पणी में बनाए रखा गया है।
- source_word: וּכְפִירַיִךְ תֹּאכַל חָרֶב
  choice: तलवार तेरे जवान सिंहों को निगल जाएगी
  rationale: शाब्दिक सिंह-बिंब को सुरक्षित रखा गया है और तलवार के ‘निगलने’ वाले सजीव रूपक को हिन्दी में बनाए रखा गया है।
- source_word: וְהִכְרַתִּי מֵאֶרֶץ טַרְפֵּךְ
  choice: मैं धरती से तेरा शिकार मिटा दूँगा
  rationale: טֶרֶף को ‘शिकार’ कहना पिछले सिंह-बिंब को जारी रखता है। הכרתּי का आशय यहाँ हटाने या समाप्त कर देने का है; ‘मिटा दूँगा’ स्वाभाविक हिन्दी में वही प्रभाव देता है।
- source_word: וְלֹא יִשָּׁמַע עוֹד קוֹל מַלְאָכֵכֵה
  choice: तेरे दूतों की आवाज़ फिर कभी सुनाई नहीं देगी
  rationale: निफ़अल के कर्मवाच्य रूप और עוֹד की अंतिमता को सहज हिन्दी में रखा गया है। מַלְאָךְ यहाँ मानवीय संदेशवाहक या राजदूत है, स्वर्गदूत नहीं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा-संबंधी विशिष्ट नाम सीधे उपस्थित है; लिप्यंतरण उसे सामान्य उपाधि में बदलने से बचाता है।
- issue: जवान सिंहों की पहचान
  choice: रूपक को पाठ में अनिर्णीत रखते हुए ‘जवान सिंह’
  alternative: योद्धा; शासक
  rationale: संदर्भ संभवतः नीनवे के योद्धाओं या शासकों की ओर संकेत करता है, पर मूल जानबूझकर सिंह-बिंब बनाए रखता है; मुख्य पाठ में उसका अर्थ खोल देना तनाव को अनावश्यक रूप से समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गंभीर भविष्यद्वाणीपरक लहजा। नीनवे को स्त्रीलिंग एकवचन में संबोधित करने वाले इब्रानी रूपों के अनुरूप निकट संबोधन ‘तेरे’ रखा गया है। अल्पविराम और दीर्घ विराम वाक्य की उद्घोषणात्मक गति को स्पष्ट करते हैं।
