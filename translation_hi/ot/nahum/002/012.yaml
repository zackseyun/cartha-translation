source:
  edition: WLC
  text: אַיֵּה֙ מְע֣וֹן אֲרָי֔וֹת וּ/מִרְעֶ֥ה ה֖וּא לַ/כְּפִרִ֑ים אֲשֶׁ֣ר הָלַךְ֩ אַרְיֵ֨ה לָבִ֥יא שָׁ֛ם גּ֥וּר אַרְיֵ֖ה וְ/אֵ֥ין מַחֲרִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/012.yaml
  text: Where is the lions’ den[a], the feeding place of the young lions, where the lion and lioness walked, where the lion’s cub was[b], with none to make them afraid?
translation:
  language: hi
  text: सिंहों की मांद कहाँ है, और जवान सिंहों के भोजन करने का स्थान[a] कहाँ है—जहाँ सिंह और सिंहनी[b] चलते थे, जहाँ सिंह का शावक था, और उन्हें डराने वाला कोई न था?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जवान सिंहों का चरागाह।’ यहाँ प्रयुक्त इब्रानी शब्द चरागाह या भोजन करने की जगह को भी दर्शा सकता है; सिंहों के चित्र में इसका प्रयोग रूपक के रूप में हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘बड़ा सिंह।’ इब्रानी शब्द לָבִיא के सिंह-संबंधी अर्थ अलग-अलग ढंग से समझे जा सकते हैं; यहाँ सिंह, सिंहनी और शावक के क्रम के कारण ‘सिंहनी’ चुना गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: कहाँ है
  rationale: यह स्थानवाचक प्रश्न है, जो नीनवे के पतन पर ताने के रूप में पूछा गया है।
- source_word: מְעוֹן אֲרָיוֹת
  choice: सिंहों की मांद
  rationale: מְעוֹן का मूल अर्थ निवास है; सिंह-रूपक में ‘मांद’ स्वाभाविक और सटीक है।
- source_word: וּמִרְעֶה ... לַכְּפִרִים
  choice: जवान सिंहों का चरने का स्थान
  rationale: מִרְעֶה चरागाह या चरने/भोजन करने के स्थान को सूचित करता है। रूपक में स्रोत की चराई-संबंधी छवि बनाए रखने के लिए यह रूप चुना गया है।
- source_word: הָלַךְ
  choice: चलते थे
  rationale: मूल क्रिया का सामान्य अर्थ चलना या जाना है; ‘घूमते’ अथवा ‘शिकार की ताक में फिरते’ कहना अर्थ को अनावश्यक रूप से बढ़ाता। संयुक्त कर्ताओं के कारण हिंदी में बहुवचन है।
- source_word: לָבִיא
  choice: सिंहनी
  rationale: शब्द सिंह-वर्ग के प्राणी के लिए प्रयुक्त होता है और कभी बड़े/बलवान सिंह के अर्थ में भी समझा जाता है; यहाँ सिंह और बच्चे के साथ पारिवारिक चित्र में ‘सिंहनी’ प्रसंगानुकूल है।
- source_word: גּוּר אַרְיֵה
  choice: सिंह का बच्चा
  rationale: यह रचना एक छोटे सिंह या शावक को दर्शाती है; साधारण पाठक के लिए ‘सिंह का बच्चा’ स्पष्ट और स्वाभाविक है।
- source_word: וְאֵין מַחֲרִיד
  choice: उन्हें डराने वाला कोई न था
  rationale: מַחֲרִיד भय उत्पन्न करने या चौंका देने वाले को दर्शाता है। बहुवचन ‘उन्हें’ पूरे सिंह-समूह को स्वाभाविक रूप से संदर्भित करता है।
theological_decisions:
- issue: לָבִיא की पहचान
  choice: सिंहनी
  alternative: बड़ा/बलवान सिंह
  rationale: सिंह, לָבִיא और सिंह के बच्चे की क्रमिक छवि परिवार-सदृश समूह का संकेत दे सकती है, पर शब्द की वैकल्पिक सिंह-संबंधी व्याख्या पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और काव्यात्मक प्रश्न-विन्यास रखा गया है। ‘मांद’, ‘चरने का स्थान’ और ‘सिंह का बच्चा’ साधारण पाठक के लिए स्पष्ट हैं; मूल की पुनरुक्त स्थानवाचक संरचना को दो बार ‘कहाँ है/जहाँ’ द्वारा बनाए रखा गया है।
