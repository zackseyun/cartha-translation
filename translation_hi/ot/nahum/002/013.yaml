source:
  edition: WLC
  text: אַרְיֵ֤ה טֹרֵף֙ בְּ/דֵ֣י גֹֽרוֹתָ֔י/ו וּ/מְחַנֵּ֖ק לְ/לִבְאֹתָ֑י/ו וַ/יְמַלֵּא טֶ֣רֶף חֹרָ֔י/ו וּ/מְעֹֽנֹתָ֖י/ו טְרֵפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/013.yaml
  text: The lion tore enough for his cubs and strangled prey for his lionesses[b][a]; he filled his dens with prey and his lairs with torn flesh.
translation:
  language: hi
  text: शेर ने अपने शावकों के लिए पर्याप्त शिकार फाड़ा[a] और अपनी शेरनियों के लिए शिकार का गला घोंटा; उसने अपनी मांदों को शिकार से और अपने बसेरों को फाड़े हुए मांस[b] से भर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शेर अपने शावकों के लिए पर्याप्त शिकार फाड़ता रहता था।” इब्रानी कृदंत लगातार चलने वाली क्रिया का भाव भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: “फाड़े हुए मांस” का अनुवाद “शिकार” या “जो फाड़ा गया था” भी हो सकता है। यहाँ पहले आए “शिकार” से इब्रानी की काव्यात्मक शब्द-विविधता अलग रखने के लिए यह अभिव्यक्ति चुनी गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְיֵה
  choice: शेर
  rationale: एकवचन संज्ञा नीनवे/अश्शूर को हिंसक पशु के रूप में चित्रित करती है; राजनीतिक आशय को खोलकर बताए बिना मूल बिंब रखा गया है।
- source_word: טֹרֵף בְּדֵי
  choice: पर्याप्त शिकार फाड़ा
  rationale: टֹרֵף शिकार को फाड़ने और בְּדֵי पर्याप्तता का भाव देता है। यह अनुवाद हिंसक क्रिया और शावकों के लिए पर्याप्त मात्रा—दोनों को व्यक्त करता है।
- source_word: גֹרוֹתָיו
  choice: अपने शावकों
  rationale: यह सिंह के बच्चों के लिए प्रयुक्त शब्द है; आधुनिक हिन्दी में ‘शावक’ सटीक और स्वाभाविक है।
- source_word: וּמְחַנֵּק
  choice: और ... शिकार का गला घोंटा
  rationale: חנק का मूल अर्थ गला घोंटना है। हिन्दी में स्पष्टता के लिए प्रसंग से निहित कर्म ‘शिकार’ जोड़ा गया है।
- source_word: לְלִבְאֹתָיו
  choice: अपनी शेरनियों के लिए
  rationale: स्त्रीलिंग बहुवचन सिंहनियों को सूचित करता है; ‘शेरनियाँ’ सामान्य आधुनिक हिन्दी है।
- source_word: וַיְמַלֵּא
  choice: उसने ... भर दिया
  rationale: क्रिया वर्णन को आगे बढ़ाती है; पूर्ण भूतकाल हिन्दी में परिणामी क्रिया को सहजता से व्यक्त करता है।
- source_word: טֶרֶף
  choice: शिकार
  rationale: यह फाड़े गए शिकार को दर्शाता है और सिंह-बिंब बनाए रखता है; व्यापक संदर्भ में लूट का संकेत भी अंतर्निहित रह सकता है।
- source_word: חֹרָיו
  choice: अपनी मांदों
  rationale: पशु के बिल या मांद का अर्थ यहाँ सिंह-बिंब में ‘मांद’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: וּמְעֹנֹתָיו
  choice: अपने बसेरों
  rationale: यह חֹרָיו के समानांतर निवास-स्थानों को दर्शाता है, पर उसी शब्द की पुनरावृत्ति नहीं करता; ‘बसेरे’ काव्यात्मक भिन्नता बचाता है।
- source_word: טְרֵפָה
  choice: फाड़े हुए मांस
  rationale: यह फाड़े गए शिकार या मांस को सूचित करता है। ‘फाड़े हुए मांस’ पहले आए ‘शिकार’ से मूल की शब्दगत विविधता अलग रखता है।
theological_decisions:
- issue: अश्शूर/नीनवे के लिए शेर का रूपक
  choice: मुख्य पाठ में शेर के बिंब को शाब्दिक रूप से बनाए रखा गया है।
  alternative: इसे सीधे अश्शूर के राजा द्वारा अपनी प्रजा के लिए लूट बटोरने के रूप में व्याख्यायित करना।
  rationale: पद नीनवे के विरुद्ध काव्यात्मक ताने के भीतर आता है। रूपक को बिना खोले रखना मूल की कविता और अर्थगत तनाव का सम्मान करता है तथा व्याख्या को अनुवाद में आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—गरिमापूर्ण, किंतु सामान्य पाठक के लिए स्पष्ट। ‘शावक’, ‘मांद’ और ‘बसेरे’ सिंह के सजीव काव्य-बिंब को बनाए रखते हैं; हिंसक क्रियाओं को नरम नहीं किया गया है।
