  edition: WLC
  text: וְ/הֻצַּ֖ב גֻּלְּתָ֣ה הֹֽעֲלָ֑תָה וְ/אַמְהֹתֶ֗י/הָ מְנַֽהֲגוֹת֙ כְּ/ק֣וֹל יוֹנִ֔ים מְתֹפְפֹ֖ת עַל לִבְבֵ/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/008.yaml
  text: 'It is fixed: she is stripped bare[a], she is carried away; and her servant girls are led off, moaning like the sound of doves[b], beating on their hearts.'
translation:
  language: hi
  text: 'यह निश्चित हो चुका है: उसे निर्वस्त्र कर दिया गया है[a], उसे ले जाया गया है। उसकी दासियाँ भी हाँकी जा रही हैं; वे कबूतरों जैसी आवाज़ में कराहती हुई अपनी छाती पीट रही हैं[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे उघाड़ दिया गया है” अथवा “उसे निर्वासित कर दिया गया है।” यहाँ हिब्रू कठिन है और इसमें अपमानित करके अनावृत करने तथा देश निकाला देने—दोनों के बिंब जुड़े हो सकते हैं।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “अपने हृदयों पर प्रहार करती हुई।” यह शोक में छाती पीटने का मुहावरा हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֻצַּב
  choice: यह निश्चित हो चुका है
  rationale: कठिन हिब्रू रूप को अवैयक्तिक निष्पन्न भाव में लिया गया है—बात तय या स्थिर हो चुकी है। यह ‘आदेश दिया गया है’ जैसे स्पष्ट न्यायिक अर्थ को अनावश्यक रूप से नहीं जोड़ता।
- source_word: גֻּלְּתָה
  choice: उसे निर्वस्त्र कर दिया गया है
  rationale: גלה के निष्क्रिय रूप में उघाड़े या अनावृत किए जाने का अपमानजनक चित्र सम्भव है। अगला पद बंदी बनाकर ले जाए जाने को अलग से व्यक्त करता है, इसलिए यहाँ निर्वासन का अर्थ दोहराया नहीं गया।
- source_word: הֹעֲלָתָה
  choice: उसे बंदी बनाकर ले जाया जा रहा है
  rationale: עלה के होफाल रूप में विवश करके ले जाए जाने का भाव है। ‘बंदी बनाकर’ नगर की पराजय और निर्वासन की परिस्थिति को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: אַמְהֹתֶיהָ
  choice: उसकी दासियाँ
  rationale: אָמָה अधीन सामाजिक स्थिति वाली स्त्री दासी को सूचित करता है। ‘दासियाँ’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है तथा ‘सेविकाएँ’ की अपेक्षा मूल सामाजिक अधीनता को बेहतर बनाए रखता है।
- source_word: מְנַהֲגוֹת
  choice: हाँकी जा रही हैं
  rationale: यह रूप दूसरों के नियंत्रण में आगे ले जाए जाने, यहाँ तक कि हाँके जाने, का चित्र देता है। बंदियों के जुलूस के संदर्भ में यह ‘ले जाई जा रही हैं’ से अधिक सशक्त है।
- source_word: כְּקוֹל יוֹנִים
  choice: कबूतरों जैसी आवाज़ में
  rationale: मूल पाठ तुलना को स्पष्टतः उनकी आवाज़ से जोड़ता है। यह अनुवाद उस श्रव्य बिंब को बनाए रखता है।
- source_word: מְתֹפְפֹת עַל לִבְבֵהֶן
  choice: अपनी छाती पीट रही हैं
  rationale: शाब्दिक रूप ‘अपने हृदयों पर प्रहार करती हुई’ है, पर शोक की शारीरिक मुद्रा को आधुनिक हिन्दी में स्वाभाविक रूप से ‘छाती पीटना’ कहा जाता है। शाब्दिक स्वरूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: וְהֻצַּב को ईश्वरीय आदेश के रूप में स्पष्ट करना
  choice: अवैयक्तिक ‘यह निश्चित हो चुका है’
  alternative: ‘यह आदेश दिया गया है’
  rationale: पाठ में कर्ता व्यक्त नहीं है और कठिन रूप न्यायिक आदेश को अनिवार्य नहीं बनाता। चुना गया रूप निर्णय की निश्चितता रखता है, पर छिपे कर्ता या आदेश की प्रकृति को निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। स्त्रीलिंग एकवचन को नगर के मानवीकरण के रूप में बनाए रखा गया है। ‘निर्वस्त्र’ अपमान के बिंब को, ‘बंदी बनाकर ले जाया जा रहा है’ निर्वासन को, और ‘हाँकी जा रही हैं’ दासियों की विवश गति को अलग-अलग स्पष्ट करता है।
