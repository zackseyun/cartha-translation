  text: שַׁעֲרֵ֥י הַ/נְּהָר֖וֹת נִפְתָּ֑חוּ וְ/הַֽ/הֵיכָ֖ל נָמֽוֹג׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/007.yaml
  text: The gates of the rivers are opened[b][a], and the palace melts away.
translation:
  language: hi
  text: नदियों के फाटक खोल दिए गए हैं[a], और राजमहल पिघल जाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नहरों के फाटक खोल दिए गए हैं,” यदि यहाँ यह शब्द सामान्य नदियों के बजाय नीनवे के जलमार्गों के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या, “मन्दिर,” क्योंकि इब्रानी शब्द הֵיכָל राजमहल या मन्दिर—दोनों के लिए प्रयुक्त हो सकता है; यहाँ प्रसंग ‘राजमहल’ के पक्ष में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעֲרֵי
  choice: के फाटक
  rationale: यह שַׁעַר का संबंधसूचक बहुवचन रूप है; ‘नदियों के फाटक’ मूल संरचना और दुर्ग-द्वार के बिंब को बनाए रखता है।
- source_word: הַנְּהָרוֹת
  choice: नदियों
  rationale: נָהָר का सामान्य अर्थ ‘नदी’ है। नीनवे की जल-व्यवस्था के संदर्भ में ‘नहरें’ संभव है, इसलिए उसे पाठ-टिप्पणी में रखा गया है।
- source_word: נִפְתָּחוּ
  choice: खोल दिए गए हैं
  rationale: यह פָּתַח का निफ़अल पूर्ण, अन्य पुरुष बहुवचन रूप है और निष्क्रिय अर्थ देता है। यह अनुवाद भविष्यवाणी के सजीव वर्णन तथा पूर्ण क्रिया, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַהֵיכָל
  choice: राजमहल
  rationale: הֵיכָל का अर्थ ‘राजमहल’ या ‘मन्दिर’ हो सकता है। नीनवे के पतन के प्रसंग में शाही भवन अधिक संभावित है; ‘राजमहल’ इसे सामान्य ‘महल’ से अधिक स्पष्ट करता है।
- source_word: נָמוֹג
  choice: पिघल जाता है
  rationale: क्रिया में पिघलने, गल जाने या निर्बल होकर ढहने का भाव है। ‘पिघल जाता है’ मूल रूपक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
