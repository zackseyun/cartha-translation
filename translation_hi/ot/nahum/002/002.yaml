  text: עָלָ֥ה מֵפִ֛יץ עַל פָּנַ֖יִ/ךְ נָצ֣וֹר מְצֻרָ֑ה צַפֵּה דֶ֨רֶךְ֙ חַזֵּ֣ק מָתְנַ֔יִם אַמֵּ֥ץ כֹּ֖חַ מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/002.yaml
  text: A scatterer has come up against your face[a]. Guard the fortress; watch the road; strengthen your loins[c][b]; muster your strength greatly.
translation:
  language: hi
  text: तितर-बितर करनेवाला[a] तेरे सामने[b] चढ़ आया है। गढ़[c] की रक्षा कर; मार्ग पर नज़र रख; कमर कस; अपनी शक्ति को बहुत सुदृढ़ बना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चकनाचूर करनेवाला” अथवा “टुकड़े-टुकड़े करनेवाला”; इब्रानी शब्द बिखेरने या कुचलकर नष्ट करने—दोनों में से किसी भाव पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “तेरे मुख के विरुद्ध” है; यह मुहावरा सीधे तेरे सामने या तेरे विरुद्ध आने को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: या “किला”; संभवतः “घेराबंदी का मोर्चा/किलाबंदी।” इब्रानी संज्ञा किसी किलाबंद या घिरे हुए स्थान को अधिक व्यापक रूप से सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: चढ़ आया है
  rationale: सैन्य प्रसंग में क्रिया किसी स्थान के विरुद्ध आगे बढ़ आने को दर्शाती है; पूर्ण रूप आक्रमणकारी को निकट आ चुका या आगे बढ़ चुका प्रस्तुत करता है।
- source_word: מֵפִיץ
  choice: तितर-बितर करनेवाला
  rationale: यह कृदन्त विनाशकारी रूप से बिखेरनेवाले व्यक्ति को सूचित करता है। मूल शब्द में कुचलने या चकनाचूर करने की अधिक प्रबल छाया भी संभव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: עַל־פָּנַיִךְ
  choice: तेरे सामने
  rationale: शाब्दिक चित्र ‘तेरे मुख के विरुद्ध/ऊपर’ है; हिन्दी में ‘तेरे सामने’ सीधे आमने-सामने आ जाने या विरुद्ध आ खड़े होने का स्वाभाविक अर्थ सुरक्षित रखता है।
- source_word: נָצוֹר
  choice: रक्षा कर
  rationale: आज्ञार्थक रूप तत्काल प्रतिरक्षात्मक कार्रवाई का आह्वान करता है।
- source_word: מְצֻרָה
  choice: गढ़
  rationale: इस संज्ञा का अर्थ किलाबंद स्थान हो सकता है; संक्षिप्त सैन्य आदेशों के इस क्रम में ‘गढ़’ स्वाभाविक है, जबकि घेराबंदी या मोर्चाबंदी का अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: צַפֵּה דֶרֶךְ
  choice: मार्ग पर नज़र रख
  rationale: यह आने-जाने या आक्रमण के मार्ग पर चौकसी करने का आदेश है।
- source_word: חַזֵּק מָתְנַיִם
  choice: कमर कस
  rationale: ‘कटि को मजबूत कर’ वाले शारीरिक रूपक का प्रचलित और सशक्त हिन्दी समतुल्य है, जो दृढ़तापूर्वक कार्रवाई के लिए तैयार होने को व्यक्त करता है।
- source_word: אַמֵּץ כֹּחַ מְאֹד
  choice: अपनी शक्ति को बहुत दृढ़ कर
  rationale: यह अनुवाद शक्ति को अत्यधिक सुदृढ़ करने के आदेश और מְאֹד की तीव्रता, दोनों को स्पष्ट रखता है।
