  source_fidelity: יִזְכֹּר in this military context can carry the contextual sense of calling up/mustering men, as reflected in the English audit trail, though its basic sense is “remember.” אַדִּירָיו denotes his prominent men, officers, or nobles rather than specifically courageous fighters. The passive concluding clause and the reference to the city wall are retained.
  naturalness: The draft is generally clear and appropriately terse. “अपनी चाल में” more closely and naturally represents “in their march/going” than “चलते हुए,” while “नगर की दीवार” is more transparent in modern standard Hindi than the comparatively literary “शहरपनाह.”
  terminology: “सरदारों” preserves the rank/prominence of אַדִּירָיו better than “वीरों.” “घेराबंदी की ढाल” suitably conveys the likely covered siege protection/device without over-specifying its construction.
