  text: יִזְכֹּר֙ אַדִּירָ֔י/ו יִכָּשְׁל֖וּ ב/הלכות/ם יְמַֽהֲרוּ֙ חֽוֹמָתָ֔/הּ וְ/הֻכַ֖ן הַ/סֹּכֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/006.yaml
  text: He summons his nobles; they stumble in their march. They hurry to her wall, and the siege shelter is set up.
translation:
  language: hi
  text: वह अपने सरदारों को बुलाता है; वे अपनी चाल में ठोकर खाते हैं। वे उसकी नगर की दीवार की ओर दौड़ते हैं, और घेराबंदी की ढाल खड़ी कर दी जाती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִזְכֹּר
  choice: बुलाता है
  rationale: मूल क्रिया का सामान्य अर्थ ‘याद करना’ है, पर इस सैन्य प्रसंग में अपने प्रमुख योद्धाओं को ध्यान में लाकर तलब करने का भाव है; इसलिए स्वाभाविक हिन्दी में ‘बुलाता है’ चुना गया।
- source_word: אַדִּירָיו
  choice: अपने वीरों को
  rationale: शब्द प्रतिष्ठित, शक्तिशाली या प्रमुख पुरुषों को सूचित कर सकता है। युद्ध के संदर्भ में ‘वीरों’ से पद और सैन्य सामर्थ्य का भाव संक्षेप में व्यक्त होता है।
- source_word: בַּהֲלִיכֹתָם
  choice: चलते हुए
  rationale: शाब्दिक भाव ‘उनके चलने में/अपनी चाल में’ है। ‘चलते हुए’ ठोकर खाने की क्रिया से इसे सहज हिन्दी में जोड़ता है।
- source_word: חוֹמָתָהּ
  choice: उसकी शहरपनाह
  rationale: स्त्रीलिंग प्रत्यय नगर की दीवार की ओर संकेत करता है। ‘शहरपनाह’ साधारण दीवार के बजाय नगर की रक्षात्मक प्राचीर का ठीक भाव देता है।
- source_word: הַסֹּכֵךְ
  choice: घेराबंदी की ढाल
  rationale: यह आक्रमणकारियों को रक्षा देने वाले ढके हुए घेराबंदी उपकरण या बड़े सुरक्षात्मक आवरण को सूचित करता है। ‘घेराबंदी की ढाल’ संक्षिप्त और प्रसंगानुकूल है।
theological_decisions:
- issue: ‘वह’ किस पक्ष के सेनानायक को सूचित करता है
  choice: सर्वनाम को अनिर्दिष्ट रखा गया
  alternative: स्पष्ट रूप से नीनवे का राजा या आक्रमणकारी सेनानायक कहना
  rationale: इब्रानी पाठ कर्ता की पहचान स्पष्ट नहीं करता; किसी एक व्याख्या को मुख्य पाठ में थोपना उचित नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और युद्ध-वर्णन के अनुकूल हिन्दी रखी गई है। छोटे समानांतर वाक्यों से मूल की तीव्र गति बनी रहती है; ‘शहरपनाह’ और ‘घेराबंदी की ढाल’ ऐतिहासिक सैन्य संदर्भ को स्पष्ट रखते हैं।
