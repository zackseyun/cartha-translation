  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י שָׁ֤ב יְהוָה֙ אֶת גְּא֣וֹן יַעֲקֹ֔ב כִּ/גְא֖וֹן יִשְׂרָאֵ֑ל כִּ֤י בְקָקוּ/ם֙ בֹּֽקְקִ֔ים וּ/זְמֹרֵי/הֶ֖ם שִׁחֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/003.yaml
  text: For Yahweh is restoring the majesty of Jacob like the majesty of Israel[c][b][a], though destroyers have destroyed them and ruined their vine branches.
translation:
  language: hi
  text: क्योंकि यहोवा याकूब के वैभव को इस्राएल के वैभव के समान पुनः स्थापित कर रहा है[a][b], यद्यपि उजाड़ने वालों ने उन्हें पूरी तरह उजाड़ दिया है[c] और उनकी अंगूरलता की डालियाँ नष्ट कर दी हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पुनः स्थापित कर चुका है” अथवा “पुनः स्थापित करेगा”; इब्रानी क्रिया भविष्यसूचक निश्चितता व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “याकूब का गौरव, इस्राएल के गौरव के समान”; ‘वैभव’ के लिए आए इब्रानी शब्द का अर्थ ‘गर्व’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “खाली करने वालों ने उन्हें खाली कर दिया है”; आशय है कि लुटेरों ने उन्हें पूरी तरह लूटकर उजाड़ दिया।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: फिर लौटा रहा है
  rationale: שוב का क़ातल रूप यहाँ पूर्ण भूत, वर्तमान निश्चितता या भविष्यसूचक निश्चितता व्यक्त कर सकता है। संदर्भ में परमेश्वर द्वारा दशा पलटने की जीवंत प्रक्रिया को स्वाभाविक हिन्दी में व्यक्त करने के लिए यह चयन किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: גְּאוֹן
  choice: वैभव
  rationale: शब्द का अर्थ सकारात्मक रूप में महिमा, उत्कर्ष या वैभव और नकारात्मक रूप में घमंड हो सकता है। यहाँ यहोवा उसे लौटा रहा है, इसलिए सकारात्मक अर्थ संदर्भानुकूल है।
- source_word: כִּ/גְאוֹן
  choice: के वैभव के समान
  rationale: उपसर्ग כ को तुलनात्मक अर्थ में लिया गया है, जिससे याकूब और इस्राएल के बीच मूल पाठ की समानांतरता बनी रहती है।
- source_word: בְקָקוּם ... בֹּקְקִים
  choice: उजाड़ने वालों ने उन्हें पूरी तरह उजाड़ दिया है
  rationale: בקק खाली कर देने, लूटकर उजाड़ने या बरबाद करने को दर्शाता है। एक ही धातु से बने कर्ता और क्रिया का बल हिन्दी में पुनरुक्ति तथा 'पूरी तरह' से व्यक्त किया गया है।
- source_word: וּזְמֹרֵיהֶם
  choice: उनकी अंगूरलता की डालियाँ
  rationale: זְמֹרָה सामान्य डाली नहीं, विशेषतः अंगूरलता की शाखा या टहनी है; इसलिए कृषि-बिंब को स्पष्ट रखा गया है।
- source_word: שִׁחֵתוּ
  choice: नष्ट कर दी हैं
  rationale: पिएल रूप यहाँ बिगाड़ देने, बरबाद करने या नष्ट करने का अर्थ देता है और अंगूरलता की डालियों के विनाश के साथ स्वाभाविक बैठता है।
theological_decisions:
- issue: याकूब/इस्राएल के संबंध में גְּאוֹן का भाव
  choice: परमेश्वर द्वारा लौटाया जाने वाला सकारात्मक वैभव
  alternative: घमंड या अभिमान
  rationale: यहोवा की अनुकूल पुनर्स्थापनात्मक क्रिया के कारण सकारात्मक अर्थ अधिक उपयुक्त है, पर वैकल्पिक शाब्दिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: שָׁב का कालगत अर्थ
  choice: वर्तमान प्रगतिशील भविष्यसूचक निश्चितता—'फिर लौटा रहा है'
  alternative: '''लौटा चुका है'' या ''फिर लौटाएगा'''
  rationale: इब्रानी क़ातल संदर्भ में संपन्न कार्य अथवा निश्चित भविष्य की भविष्यसूचक प्रस्तुति हो सकता है; मुख्य पाठ एक स्वाभाविक मध्यवर्ती विकल्प रखता है और अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और गरिमापूर्ण शैली रखी गई है। 'वैभव' सकारात्मक גְּאוֹן को स्पष्ट करता है; 'अंगूरलता की डालियाँ' मूल कृषि-बिंब को सुरक्षित रखता है। पादटिप्पणी-चिह्न संबंधित पदांशों के तुरंत बाद दिए गए हैं।
