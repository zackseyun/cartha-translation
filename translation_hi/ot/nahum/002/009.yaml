  text: וְ/נִינְוֵ֥ה כִ/בְרֵֽכַת מַ֖יִם מִ֣/ימֵי הִ֑יא וְ/הֵ֣מָּה נָסִ֔ים עִמְד֥וּ עֲמֹ֖דוּ וְ/אֵ֥ין מַפְנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/009.yaml
  text: Nineveh has been like a pool of water from her earliest days[a], yet they are fleeing[b]. “Stop! Stop!”—but no one turns back.
translation:
  language: hi
  text: नीनवे अपने आरम्भिक दिनों से जल के कुण्ड जैसी रही है[a], फिर भी वे भागे जा रहे हैं। “रुको! रुको!”[b]—पर कोई पीछे नहीं मुड़ता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उन दिनों से जब वह थी”; यह नीनवे के आरम्भिक अस्तित्व या बहुत पुराने समय को सूचित करने वाली अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: या “खड़े रहो! खड़े रहो!” इब्रानी आज्ञाओं का अधिक शाब्दिक अनुवाद ऐसा है; पलायन के इस दृश्य में “रुको! रुको!” उनका आशय स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִינְוֵה
  choice: नीनवे
  rationale: स्थान के प्रचलित हिन्दी नाम का प्रयोग किया गया है।
- source_word: כִבְרֵכַת מַיִם
  choice: जल के कुण्ड जैसी
  rationale: यह नगर की तुलना इकट्ठे जल के एक बड़े स्थिर भंडार से करता है; ‘कुण्ड’ मूल बिंब को बिना अनावश्यक तकनीकी विशिष्टता के बनाए रखता है।
- source_word: מִימֵי הִיא
  choice: अपने आरम्भिक दिनों से
  rationale: शाब्दिक रचना ‘उन दिनों से जब वह थी’ नीनवे के बहुत पुराने, आरम्भिक समय की ओर संकेत करती है। हिन्दी में यह अर्थ स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: וְהֵמָּה נָסִים
  choice: फिर भी वे भागे जा रहे हैं
  rationale: 'सर्वनाम और कृदन्त जारी पलायन का दृश्य प्रस्तुत करते हैं। प्रसंग में विरोध स्पष्ट है: पुराने समय से स्थिर नगर अब खाली हो रहा है। ‘वे’ मूल की अनिर्दिष्टता को बनाए रखता है।'
- source_word: עִמְדוּ עֲמֹדוּ
  choice: रुको! रुको!
  rationale: दोहराई गई आज्ञा पलायन कर रहे लोगों को तत्काल रुकने की पुकार है। अधिक शाब्दिक ‘खड़े रहो’ को पादटिप्पणी में रखा गया है।
- source_word: וְאֵין מַפְנֶה
  choice: पर कोई पीछे नहीं मुड़ता
  rationale: व्यक्तिगत और दृश्यात्मक अनुवाद पुकार के उत्तर में किसी के भी पलटकर न आने का भाव स्पष्ट करता है।
