base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/011.yaml
  text: Devastation[a], desolation, and destruction! Hearts melt, knees give way, anguish is in every waist, and all their faces grow pale.
translation:
  language: hi
  text: उजाड़, वीरानी और विनाश! हृदय पिघल रहे हैं, घुटने जवाब दे रहे हैं, हर कमर में ऐंठन है, और उन सबके चेहरों का रंग उड़ गया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “उन सबके चेहरों पर कालिमा छा गई है।” इब्रानी अभिव्यक्ति कठिन है और आतंक के कारण चेहरे के काला पड़ने या उसकी रंगत उड़ जाने का वर्णन कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוּקָה וּמְבוּקָה וּמְבֻלָּקָה
  choice: उजाड़, वीरानी और विनाश
  rationale: तीन निकटार्थक शब्दों की तीव्र, क्रमिक शृंखला को तीन स्वाभाविक हिन्दी संज्ञाओं से व्यक्त किया गया है। मूल का ध्वन्यात्मक शब्दालंकार पूरी तरह लाना कठिन है, पर विनाश की बढ़ती हुई तीव्रता सुरक्षित रहती है।
- source_word: לֵב נָמֵס
  choice: हृदय पिघल रहे हैं
  rationale: भय से साहस टूटने के मूल रूपक को व्याख्यात्मक ढंग से बदलने के बजाय सुरक्षित रखा गया है; सामूहिक संदर्भ के कारण हिन्दी में बहुवचन स्वाभाविक है।
- source_word: פִק בִּרְכַּיִם
  choice: घुटने काँप रहे हैं
  rationale: यह पद भय से घुटनों के लड़खड़ाने या जवाब दे जाने को दर्शाता है। 'काँप रहे हैं' सामान्य हिन्दी में शारीरिक आतंक को स्पष्ट और सजीव बनाता है।
- source_word: חַלְחָלָה בְּכָל מָתְנַיִם
  choice: हर कमर में थरथराहट है
  rationale: חַלְחָלָה की शारीरिक कंपकंपी या ऐंठन और מָתְנַיִם के शारीरिक स्थान, दोनों को सहज आधुनिक हिन्दी में बनाए रखा गया है।
- source_word: וּפְנֵי כֻלָּם קִבְּצוּ פָארוּר
  choice: उन सबके चेहरों का रंग उड़ गया है
  rationale: दुर्बोध इब्रानी मुहावरे का संदर्भानुकूल अर्थ भय से चेहरे की रंगत बदलना है। सहज हिन्दी मुहावरा दृश्य प्रभाव बताता है, जबकि अधिक शाब्दिक और अनिश्चित अर्थ पादटिप्पणी में सुरक्षित है।
