source:
  edition: WLC
  text: מָגֵ֨ן גִּבֹּרֵ֜י/הוּ מְאָדָּ֗ם אַנְשֵׁי חַ֨יִל֙ מְתֻלָּעִ֔ים בְּ/אֵשׁ פְּלָד֥וֹת הָ/רֶ֖כֶב בְּ/י֣וֹם הֲכִינ֑/וֹ וְ/הַ/בְּרֹשִׁ֖ים הָרְעָֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/004.yaml
  text: The shield of his mighty men is red[a]; the men of valor are clothed in scarlet. The chariots flash with the fire of steel on the day of his preparation[b], and the cypress spears are brandished.
translation:
  language: hi
  text: उसके वीरों की ढालें लाल हैं; योद्धा गहरे लाल वस्त्र पहने हुए हैं। उसकी तैयारी के दिन रथ आग-सी चमकती धातु से दमकते हैं,[a] और सरू के भाले लहराए जाते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध कठिन है; इसका अर्थ ‘रथ अग्निमय धातु से सुसज्जित हैं’ भी हो सकता है। संभवतः यह रथों पर लगी चमकती धातु या धारों का वर्णन है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘सरू के वृक्ष हिलाए जाते हैं।’ यहाँ ‘सरू’ संभवतः उस लकड़ी से बने भालों या उनके डंडों के लिए प्रयुक्त है; क्रिया का अर्थ ‘कंपाए जाते हैं’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מָגֵן גִּבֹּרֵיהוּ
  choice: उसके वीरों की ढालें
  rationale: מָגֵן सामूहिक अर्थ में ढालों को दर्शाता है और גִּבֹּרֵיהוּ का प्रत्यय ‘उसके’ को सुरक्षित रखा गया है। ‘वीर’ युद्ध-कुशल शक्तिशाली पुरुषों का स्वाभाविक हिन्दी रूप है।
- source_word: מְאָדָּם
  choice: लाल हैं
  rationale: यह אדם धातु का वर्णनात्मक रूप है, जो ढालों के लाल या लाल किए हुए दिखाई देने को बताता है। सहज हिन्दी में ‘लाल हैं’ उपयुक्त है।
- source_word: אַנְשֵׁי חַיִל
  choice: उसके योद्धा
  rationale: इस युद्ध-संदर्भ में पदबंध समर्थ और पराक्रमी लड़ाकों को दर्शाता है। ‘योद्धा’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: מְתֻלָּעִים
  choice: सुर्ख लाल वस्त्र पहने हुए हैं
  rationale: यह शब्द किरमिजी या सुर्ख लाल रंग से जुड़ा है और यहाँ सैनिकों के पहनावे का संकेत देता है। अनकहे वस्त्र-संदर्भ को हिन्दी में स्पष्ट करना स्वाभाविक है।
- source_word: בְּאֵשׁ פְּלָדוֹת
  choice: आग-सी चमकती धातु से दमकते हैं
  rationale: यह अत्यंत कठिन पदबंध आग जैसी चमक और संभवतः रथों की धातु की सज्जा या धारदार जड़ाव को चित्रित करता है। ‘इस्पात’ की अपेक्षा ‘धातु’ स्रोत की अनिश्चितता को बेहतर बनाए रखता है।
- source_word: הָרֶכֶב
  choice: रथ
  rationale: एकवचन रूप यहाँ सामूहिक रथ-दल के लिए प्रयुक्त है; हिन्दी में ‘रथ’ को बहुवचन क्रिया के साथ सामूहिक रूप से प्रस्तुत किया गया है।
- source_word: בְּיוֹם הֲכִינוֹ
  choice: उसकी तैयारी के दिन
  rationale: यह रूप तैयारी करने की क्रिया और पुरुषवाचक प्रत्यय दोनों रखता है। अनिश्चित कर्ता या तैयारी के विशिष्ट प्रकार को न ठहराते हुए निकट औपचारिक रूप अपनाया गया है।
- source_word: וְהַבְּרֹשִׁים
  choice: सरो की लकड़ी के भाले
  rationale: शाब्दिक अर्थ सरो या उसी प्रकार के वृक्ष हैं, पर सैन्य संदर्भ में लकड़ी से बने भालों या उनके डंडों के लिए लक्षणा संभावित है। इसे मुख्य पाठ में समझने योग्य बनाया गया है।
- source_word: הָרְעָלוּ
  choice: लहराए जाते हैं
  rationale: दुर्लभ क्रिया हिलाने, कंपाने या जोर से घुमाने का भाव देती है। भालों के संदर्भ में ‘लहराए जाते हैं’ स्वाभाविक है, जबकि कठिनाई पादटिप्पणी में सुरक्षित है।
