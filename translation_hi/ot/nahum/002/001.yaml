language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִנֵּ֨ה עַל הֶ/הָרִ֜ים רַגְלֵ֤י מְבַשֵּׂר֙ מַשְׁמִ֣יעַ שָׁל֔וֹם חָגִּ֧י יְהוּדָ֛ה חַגַּ֖יִ/ךְ שַׁלְּמִ֣י נְדָרָ֑יִ/ךְ כִּי֩ לֹ֨א יוֹסִ֥יף ע֛וֹד ל/עבור בָּ֥/ךְ בְּלִיַּ֖עַל כֻּלֹּ֥/ה נִכְרָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/001.yaml
  text: Look[a], on the mountains are the feet of one who brings good news, who announces peace. Celebrate your festivals, Judah; fulfill your vows[b], for the worthless one will never again pass through you; he is completely cut off.
translation:
  language: hi
  text: देखो, पहाड़ों पर शुभ समाचार लानेवाले[a] के पाँव हैं, जो शांति की घोषणा करता है। हे यहूदा, अपने पर्व मना और अपनी मन्नतें पूरी कर, क्योंकि वह अधम जन[b] फिर कभी तेरे बीच से होकर नहीं गुज़रेगा; वह पूरी तरह मिटा दिया गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शुभ समाचार के दूत के पाँव।”
    reason: lexical_alternative
  - marker: b
    text: या, “दुष्ट जन”; परंपरागत रूप से, “बेलियाल।”
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह दृश्य की ओर तुरंत ध्यान खींचता है और आधुनिक हिन्दी में स्वाभाविक रहते हुए हिब्रू के संकेतात्मक बल को बनाए रखता है।
- source_word: רַגְלֵי מְבַשֵּׂר
  choice: शुभ समाचार लानेवाले के पाँव
  rationale: हिब्रू के ठोस चित्र ‘पाँव’ को बनाए रखते हुए कृदन्त का अर्थ स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: מַשְׁמִיעַ שָׁלוֹם
  choice: जो शांति की घोषणा करता है
  rationale: हिफ़ील कृदन्त का आशय शांति को सुनाना या घोषित करना है; यह रूप दूत की सार्वजनिक घोषणा का भाव रखता है।
- source_word: חָגִּי ... חַגַּיִךְ
  choice: अपने पर्व मना
  rationale: आज्ञार्थक संबोधन और धार्मिक उत्सवों का अर्थ सरल, वर्तमान हिन्दी में व्यक्त होता है।
- source_word: שַׁלְּמִי נְדָרָיִךְ
  choice: अपनी मन्नतें पूरी कर
  rationale: ‘मन्नत पूरी करना’ हिन्दी में व्रतपूर्वक की गई प्रतिज्ञा को निभाने के लिए स्वाभाविक धार्मिक मुहावरा है।
- source_word: בְּלִיַּעַל
  choice: अधम जन
  rationale: यह पद यहाँ शत्रु के निकृष्ट और दुष्ट चरित्र का वर्णन करता जान पड़ता है। ‘अधम जन’ नैतिक हीनता का अर्थ देता है, पर इसे अनिवार्य रूप से किसी परवर्ती व्यक्तिवाचक दुष्ट सत्ता का नाम नहीं बनाता।
- source_word: לֹא יוֹסִיף עוֹד לַעֲבוֹר בָּךְ
  choice: फिर कभी तेरे बीच से होकर नहीं गुज़रेगा
  rationale: दोबारा न होने के बल और ‘तेरे बीच से होकर गुजरने’ के मूल रूपक—जिसमें शत्रुतापूर्ण चढ़ाई निहित हो सकती है—दोनों को सुरक्षित रखा गया है।
- source_word: כֻּלֹּה נִכְרָת
  choice: वह पूरी तरह मिटा दिया गया है
  rationale: शत्रु के संपूर्ण उन्मूलन का बल स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘काटे जाने’ की हिब्रू अभिव्यक्ति को असहज रूप से शाब्दिक बनाने के।
theological_decisions:
- issue: क्या בְּלִיַּעַל को व्यक्तिवाचक नाम माना जाए या वर्णनात्मक संज्ञा
  choice: मुख्य पाठ में वर्णनात्मक पद ‘अधम जन’
  alternative: ‘दुष्ट जन’ अथवा परंपरागत लिप्यंतरण ‘बेलियाल’
  rationale: इस भविष्यद्वाणी के प्रसंग में शब्द निकृष्ट या दुष्ट शत्रु का वर्णन कर सकता है; इसे ‘बेलियाल’ नाम मानना परवर्ती धार्मिक अर्थ को पाठ में ला सकता है। विकल्प को पादटिप्पणी में रखकर वास्तविक व्याख्यात्मक संभावना सुरक्षित की गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। यहूदा को सीधे एकवचन में संबोधित करने के लिए ‘हे यहूदा’ और ‘तेरे’ का प्रयोग हुआ है। वाक्य का संदेशवाही चित्र और शत्रु के पूर्ण अंत का निर्णायक स्वर दोनों बनाए रखे गए हैं।
