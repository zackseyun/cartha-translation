id: NAM.2.5
reference: Nahum 2:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בַּֽ/חוּצוֹת֙ יִתְהוֹלְל֣וּ הָ/רֶ֔כֶב יִֽשְׁתַּקְשְׁק֖וּ/ן בָּ/רְחֹב֑וֹת מַרְאֵי/הֶן֙ כַּ/לַּפִּידִ֔ם כַּ/בְּרָקִ֖ים יְרוֹצֵֽצוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/005.yaml
  text: In the streets the chariots race wildly[a]; they rattle through the squares. Their appearance is like torches[c][b]; like lightning they dart about.
translation:
  language: hi
  text: सड़कों पर रथ उन्मत्त होकर दौड़ते हैं[a]; वे चौकों में खड़खड़ाते हुए भागते हैं[b]। उनका रूप मशालों जैसा है; वे बिजली की तरह इधर-उधर लपकते हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उपद्रव मचाते हैं”; इब्रानी क्रिया उन्मत्त या पागलपन-भरे व्यवहार का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “खड़खड़ाते हैं”; दुर्लभ इब्रानी क्रिया संभवतः ध्वन्यात्मक है और शोर के साथ झटके खाते हुए चलने पर बल देती है।
    reason: lexical_alternative
  - marker: c
    text: या “तेजी से आगे-पीछे दौड़ते हैं”; इब्रानी क्रिया तीव्र गति से इधर-उधर जाने पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּצוֹת
  choice: सड़कों पर
  rationale: शहरी संदर्भ में חוּצוֹת नगर की सड़कों या खुले मार्गों को दर्शाता है; अगली पंक्ति के ‘चौकों’ के समानांतर ‘सड़कों’ स्वाभाविक है।
- source_word: יִתְהוֹלְלוּ
  choice: उन्मत्त होकर दौड़ते हैं
  rationale: हितपोलेल रूप यहाँ प्रशंसा नहीं, बल्कि उन्मत्त और बेलगाम गति व्यक्त करता है। यह चयन गति और उन्माद दोनों को बनाए रखता है।
- source_word: הָרֶכֶב
  choice: रथ
  rationale: एकवचन रूप यहाँ सामूहिक अर्थ में रथ-दल को दर्शाता है; हिन्दी में ‘रथ’ प्रसंगानुसार बहुवचन-सामूहिक बोध दे सकता है और क्रिया बहुवचन में है।
- source_word: יִשְׁתַּקְשְׁקוּן
  choice: खड़खड़ाते हुए भागते हैं
  rationale: यह दुर्लभ, संभवतः ध्वन्यात्मक क्रिया शोर, झटकों और तेज गति का संयुक्त बोध देती है; ‘खड़खड़ाते हुए भागते हैं’ इन पक्षों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בָּרְחֹבוֹת
  choice: चौकों में
  rationale: רְחֹבוֹת नगर के चौड़े सार्वजनिक स्थानों या चौकों को दर्शाता है।
- source_word: מַרְאֵיהֶן
  choice: उनका रूप
  rationale: यह दृश्य रूप या दिखाई देने वाली छवि को सूचित करता है और आगे की उपमाओं से सहज जुड़ता है।
- source_word: כַּלַּפִּידִם
  choice: मशालों जैसा
  rationale: לַפִּידִים जलती मशालों या अग्निशलाकाओं को दर्शाता है; ‘मशालों’ संक्षिप्त और सजीव है।
- source_word: כַּבְּרָקִים
  choice: बिजली की तरह
  rationale: בְּרָקִים बिजली की चमकों को दर्शाता है; हिन्दी में एकवचन सामूहिक ‘बिजली’ अधिक स्वाभाविक उपमा है।
- source_word: יְרוֹצֵצוּ
  choice: इधर-उधर लपकते हैं
  rationale: क्रिया तीव्र, बार-बार या दिशाओं में दौड़ने की गति व्यक्त करती है; ‘इधर-उधर लपकते हैं’ बिजली-जैसी चपलता और आवागमन दोनों बनाए रखता है।
