id: NAM.2.10
reference: Nahum 2:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בֹּ֥זּוּ כֶ֖סֶף בֹּ֣זּוּ זָהָ֑ב וְ/אֵ֥ין קֵ֨צֶה֙ לַ/תְּכוּנָ֔ה כָּבֹ֕ד מִ/כֹּ֖ל כְּלִ֥י חֶמְדָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/010.yaml
  text: Plunder silver! Plunder gold! There is no end to the treasure[b][a], an abundance of every precious thing.
translation:
  language: hi
  text: चाँदी लूटो! सोना लूटो! संचित धन[a] का कोई अंत नहीं—हर प्रकार की बहुमूल्य वस्तु[b] की भरमार है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भंडार।” यहाँ प्रयुक्त इब्रानी संज्ञा दुर्लभ है और संभवतः सामान्य धन के बजाय जमा किए हुए भंडार पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हर बहुमूल्य पात्र”; इब्रानी पदबंध व्यापक अर्थ में हर प्रकार की मनचाही या कीमती वस्तु को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּזּוּ
  choice: लूटो!
  rationale: בזז के बहुवचन आज्ञार्थक रूप का युद्ध में माल छीन लेने का प्रबल भाव व्यक्त करता है। दोनों बार इसकी पुनरावृत्ति रखी गई है, जिससे मूल की तात्कालिकता और काव्यात्मक बल बना रहे।
- source_word: כֶסֶף
  choice: चाँदी
  rationale: सोने के समानांतर यहाँ मुद्रा के बजाय बहुमूल्य धातु का अर्थ संदर्भ के अनुकूल है।
- source_word: זָהָב
  choice: सोना
  rationale: चाँदी के समानांतर इसका सीधा और स्वाभाविक अर्थ लिया गया है।
- source_word: וְאֵין קֵצֶה
  choice: का कोई अंत नहीं
  rationale: नकारात्मक अस्तित्ववाचक पद और ‘अंत/सीमा’ के मेल को सहज हिन्दी में व्यक्त करता है और अपरिमित मात्रा का भाव बनाए रखता है।
- source_word: תְּכוּנָה
  choice: संचित धन
  rationale: यह दुर्लभ संज्ञा संदर्भ में जमा किए हुए भंडार या लूट के लिए उपलब्ध संपत्ति की ओर संकेत करती है। ‘संचित धन’ धन-संपदा और उसके जमा होने, दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है; अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: כָּבֹד
  choice: भरमार
  rationale: यद्यपि इस शब्द का सामान्य अर्थ ‘महिमा/प्रतिष्ठा’ है, भौतिक संपदा के इस संदर्भ में यह भारी मात्रा या प्रचुरता का भाव देता है। ‘भरमार’ अंतिम पदबंध को स्वाभाविक रूप से जोड़ती है।
- source_word: מִכֹּל כְּלִי חֶמְדָּה
  choice: हर प्रकार की बहुमूल्य वस्तु
  rationale: כְּלִי पात्र, उपकरण या व्यापक रूप से किसी वस्तु के लिए आ सकता है, और חֶמְדָּה चाहने योग्य अथवा बहुमूल्य होने का भाव देता है। संकीर्ण ‘पात्र’ के बजाय यह अनुवाद संदर्भगत व्यापकता बनाए रखता है।
theological_decisions: []
translation_notes:
  register: आज्ञार्थक पुनरावृत्ति को संक्षिप्त और जोरदार रखा गया है। भाषा आधुनिक, सहज और गरिमापूर्ण है। अंतिम अर्धपंक्ति में मूल के घने संज्ञात्मक विन्यास को हिन्दी में ‘भरमार है’ द्वारा स्वाभाविक बनाया गया है, जबकि दुर्लभ תְּכוּנָה और व्यापक כְּלִי की वास्तविक शाब्दिक अनिश्चितताएँ पादटिप्पणियों में सुरक्षित हैं।
