  source_fidelity: ‘चाँदी लूटो! सोना लूटो!’ accurately retains the repeated plural imperative and the concrete metals. ‘संचित धन का कोई अंत नहीं’ appropriately renders the rare תְּכוּנָה as accumulated wealth/store while preserving its lexical uncertainty in note a. The final clause, ‘हर प्रकार की बहुमूल्य वस्तु की भरमार है,’ conveys the contextual sense of כָּבֹד together with מִכֹּל כְּלִי חֶמְדָּה as an abundance of precious valuables. It does not over-specify כְּלִי as only a vessel.
