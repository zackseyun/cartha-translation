source:
  edition: WLC
  text: אֵ֣ל קַנּ֤וֹא וְ/נֹקֵם֙ יְהוָ֔ה נֹקֵ֥ם יְהוָ֖ה וּ/בַ֣עַל חֵמָ֑ה נֹקֵ֤ם יְהוָה֙ לְ/צָרָ֔י/ו וְ/נוֹטֵ֥ר ה֖וּא לְ/אֹיְבָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/002.yaml
  text: Yahweh is a jealous and avenging God[a]; Yahweh is avenging and full of wrath. Yahweh takes vengeance on his adversaries[c][b], and he keeps wrath for his enemies.
translation:
  language: hi
  text: याहवे ईर्ष्यालु[a] और प्रतिशोध लेनेवाला परमेश्वर है; याहवे प्रतिशोध लेनेवाला और प्रचंड क्रोध से भरा हुआ है[b]। याहवे अपने विरोधियों से प्रतिशोध लेता है, और वह अपने शत्रुओं के लिए क्रोध संजोए रखता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ईर्ष्यालु’ का अनुवाद ‘उत्साही’ भी हो सकता है। इब्रानी शब्द वाचा के संबंध में अपनी अनन्य निष्ठा चाहने वाले परमेश्वर के जोश को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘क्रोध का स्वामी’ या ‘क्रोध का अधिकारी।’
    reason: lexical_alternative
  - marker: c
    text: अर्थ यह भी हो सकता है, ‘वह अपने शत्रुओं के लिए प्रकोप सुरक्षित रखता है।’ इब्रानी में ‘क्रोध’ कर्म के रूप में स्पष्टतः दोहराया नहीं गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ אֵל याहवे के स्वरूप का वर्णन करता है। ‘परमेश्वर’ आधुनिक हिन्दी में स्वाभाविक और संदर्भानुकूल है; ‘सामर्थी परमेश्वर’ मूल से अधिक अर्थ जोड़ता।
- source_word: קַנּוֹא
  choice: ईर्ष्यालु
  rationale: यह शब्द वाचा के संबंध में अनन्य निष्ठा की मांग करनेवाले जोश को व्यक्त करता है। ‘ईर्ष्यालु’ पारंपरिक बाइबलीय अर्थ को बनाए रखता है, जबकि पादटिप्पणी इसे तुच्छ मानवीय डाह समझे जाने से बचाती है।
- source_word: נֹקֵם / וְנֹקֵם
  choice: प्रतिशोध लेनेवाला / प्रतिशोध लेता है
  rationale: נקם की तीन बार हुई पुनरावृत्ति हिन्दी में भी रखी गई है। ‘प्रतिशोध’ न्यायपूर्ण दंड की गंभीरता व्यक्त करता है और ‘बदला’ की अपेक्षा अधिक गरिमापूर्ण है।
- source_word: יְהוָה
  choice: याहवे
  rationale: दिव्य नाम को किसी उपाधि से बदलने के बजाय उसके प्रचलित हिन्दी लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: וּבַעַל חֵמָה
  choice: और प्रचंड क्रोध से भरा हुआ है
  rationale: בעל का शाब्दिक अर्थ ‘स्वामी/अधिकारी’ है, पर इस मुहावरे में अर्थ क्रोध से युक्त या उसकी विशेषता रखनेवाला है। यह हिन्दी अभिव्यक्ति अर्थ को स्वाभाविक ढंग से देती है।
- source_word: חֵמָה
  choice: प्रचंड क्रोध
  rationale: न्याय-संबंधी तीव्र रोष को व्यक्त करने के लिए ‘प्रचंड क्रोध’ चुना गया है; यह अनियंत्रित आवेश का अनावश्यक संकेत नहीं देता।
- source_word: לְצָרָיו
  choice: अपने विरोधियों से
  rationale: נקם के साथ यह पूर्वसर्ग प्रतिशोध के लक्ष्य को बताता है। हिन्दी में ‘किसी से प्रतिशोध लेना’ स्वाभाविक प्रयोग है।
- source_word: וְנוֹטֵר
  choice: अपना क्रोध बचाए रखता है
  rationale: נטר में रखे रहने, सुरक्षित रखने या कायम रखने का भाव है। संदर्भ में क्रोध निहित है; ‘बचाए रखता है’ शत्रुओं के लिए उसे सुरक्षित रखने का भाव व्यक्त करता है।
- source_word: הוּא
  choice: वह
  rationale: मूल का स्पष्ट सर्वनाम अंतिम उपवाक्य में बल देता है; इसलिए हिन्दी में भी ‘वह’ रखा गया है।
- source_word: לְאֹיְבָיו
  choice: अपने शत्रुओं के लिए
  rationale: यहाँ לְ उस लक्ष्य को दर्शाता है जिसके लिए क्रोध बचाकर रखा गया है। ‘के लिए’ इस सूक्ष्म अर्थ को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर की ईर्ष्या का अर्थ
  choice: ‘ईर्ष्यालु’ को वाचा में अनन्य निष्ठा की धार्मिक मांग के अर्थ में रखा गया है।
  alternative: ‘जोशीला’ अथवा ‘अपनी अनन्य भक्ति के लिए उत्साही’
  rationale: קַנּוֹא को केवल मानवीय डाह समझना उचित नहीं, पर उसे ‘जोशीला’ करने से संबंधपरक और वाचागत धार कम हो सकती है। पादटिप्पणी आवश्यक स्पष्टीकरण देती है।
- issue: ईश्वरीय प्रतिशोध और क्रोध
  choice: प्रतिशोध और प्रचंड क्रोध की कठोर न्याय-वाणी को अक्षुण्ण रखा गया है।
  alternative: इसे हल्का करके ‘दंड देता है’ या ‘क्रोधित है’ कहना
  rationale: पद में נקם तीन बार दोहराया गया है और חֵמָה तीव्र रोष दर्शाता है; इसलिए मूल की न्यायात्मक तीव्रता को नरम करना उचित नहीं।
- issue: अंतिम उपवाक्य में निहित कर्म
  choice: संदर्भ के आधार पर ‘अपना क्रोध’ स्पष्ट किया गया है।
  alternative: ‘वह अपने शत्रुओं के विरुद्ध बनाए रखता है’ कहकर कर्म को अनकहा छोड़ना
  rationale: हिब्रू में נטר का कर्म स्पष्ट रूप से नहीं दोहराया गया; निकटवर्ती חֵמָה से क्रोध स्वाभाविक रूप से समझ में आता है। हिन्दी में वाक्य पूरा और स्पष्ट रखने हेतु इसे व्यक्त किया गया, साथ ही पादटिप्पणी में वैकल्पिक बोध दर्ज है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर भविष्यद्वक्ताई लहजे के साथ रखी गई है। ‘प्रतिशोध’ न्यायात्मक गंभीरता देता है, और मूल में נקם की तीन बार हुई पुनरावृत्ति को जानबूझकर सुरक्षित रखा गया है। वाक्य सामान्य पाठक के लिए स्पष्ट है, पर ईर्ष्या और अंतिम क्रिया की अर्थगत सूक्ष्मता पादटिप्पणियों में खुली रखी गई है।
