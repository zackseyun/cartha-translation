  text: הָרִים֙ רָעֲשׁ֣וּ מִמֶּ֔/נּוּ וְ/הַ/גְּבָע֖וֹת הִתְמֹגָ֑גוּ וַ/תִּשָּׂ֤א הָ/אָ֨רֶץ֙ מִ/פָּנָ֔י/ו וְ/תֵבֵ֖ל וְ/כָל יֹ֥שְׁבֵי בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/005.yaml
  text: The mountains quake before him[a], and the hills melt away; the earth rises up before his face[b], the world and all who dwell in it.
translation:
  language: hi
  text: उसके सामने पहाड़ काँप उठते हैं[a], और पहाड़ियाँ पिघल जाती हैं; उसके मुख के सम्मुख धरती ऊपर उठती है[b]—संसार और उसमें रहने वाले सभी निवासी भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘उससे’; संदर्भ में ‘उसके कारण’ का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘उसके मुख के सम्मुख’; इसे ‘उसके सामने’ या ‘उसकी उपस्थिति में’ भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִים רָעֲשׁוּ
  choice: पहाड़ काँप उठते हैं
  rationale: רעש तीव्र काँपने या हिलने को व्यक्त करता है। ‘काँप उठते हैं’ ईश्वरीय उपस्थिति के सामने सृष्टि की तीव्र प्रतिक्रिया को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: מִמֶּנּוּ
  choice: उसके सामने
  rationale: शाब्दिक रूप से ‘उससे’ हो सकता है, पर इस ईश्वर-दर्शनात्मक संदर्भ में कारण अथवा उपस्थिति का भाव है। ‘उसके सामने’ अगले מִפָּנָיו के साथ समानता भी बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: הַגְּבָעוֹת הִתְמֹגָגוּ
  choice: पहाड़ियाँ पिघल जाती हैं
  rationale: हित्पएल रूप गलने या विलीन होने की सजीव छवि देता है। ‘पिघल जाती हैं’ उस तीव्र चित्र को बिना नरम किए बनाए रखता है।
- source_word: וַתִּשָּׂא הָאָרֶץ
  choice: धरती ऊपर उठती है
  rationale: נשׂא का मूल भाव उठने या ऊपर किए जाने का है। यहाँ धरती के उभरने, ऊपर उठने या उथल-पुथल होने की छवि संभव है; मुख्य पाठ ऊपर की गति को सुरक्षित रखता है और अन्य संभावनाएँ पादटिप्पणी में हैं।
- source_word: מִפָּנָיו
  choice: उसके मुख के सामने
  rationale: हिब्रू पद का अधिक शाब्दिक अर्थ ‘उसके मुख के सामने’ है। यह मानवरूपी अभिव्यक्ति और मूल की काव्यात्मक तीव्रता को सुरक्षित रखता है।
- source_word: תֵבֵל וְכָל יֹשְׁבֵי בָהּ
  choice: संसार और उसमें रहनेवाले सभी लोग
  rationale: תֵבֵל व्यवस्थित अथवा आबाद संसार को दर्शाता है, और उसके बाद का कृदन्तीय पद उसके सभी निवासियों को सम्मिलित करता है।
theological_decisions:
- issue: ईश्वरीय न्याय में ब्रह्मांडीय ईश्वर-दर्शन की छवि
  choice: पद को यह दिखाते हुए अनूदित किया गया है कि प्रभु की उपस्थिति के सामने सृष्टि स्वयं काँपती, पिघलती और उठती है।
  alternative: इसे केवल राजनीतिक उथल-पुथल का रूपक मानकर अनुवाद करना।
  rationale: निकटवर्ती संदर्भ में ईश्वरीय क्रोध और महिमा का प्रकटन है। अनुवाद ब्रह्मांडीय छवि को बनाए रखता है, पर पाठ से आगे जाकर उसकी प्रकृति को न तो केवल शाब्दिक और न केवल रूपकात्मक ठहराता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु भविष्यद्वक्ताओं की गरिमामय और सजीव काव्यात्मक शैली बनाए रखी गई है। ‘उसके मुख के सामने’ जानबूझकर कुछ औपचारिक रखा गया है ताकि मूल हिब्रू की मानवरूपी अभिव्यक्ति न मिटे।
