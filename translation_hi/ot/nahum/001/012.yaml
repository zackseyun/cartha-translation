id: NAM.1.12
reference: Nahum 1:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אִם שְׁלֵמִים֙ וְ/כֵ֣ן רַבִּ֔ים וְ/כֵ֥ן נָגֹ֖זּוּ וְ/עָבָ֑ר וְ/עִ֨נִּתִ֔/ךְ לֹ֥א אֲעַנֵּ֖/ךְ עֽוֹד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/012.yaml
  text: 'Thus says the LORD: Though they are whole, and likewise many, even so they will be cut down and pass away. Though I have afflicted you, I will afflict you no more.'
translation:
  language: hi
  text: 'यहोवा यों कहता है:


    “चाहे वे पूरी शक्ति में हों और बहुत-से हों,


    फिर भी वे काट डाले जाएँगे और चले जाएँगे।


    मैंने तुझे दुःख दिया है,


    पर अब फिर तुझे दुःख न दूँगा।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिवाचक वाचा-नाम को सामान्य उपाधि से अलग रखते हुए हिन्दी में प्रचलित रूप दिया गया है।
- source_word: שְׁלֵמִים
  choice: पूरी शक्ति में
  rationale: मूल शब्द का अर्थ ‘संपूर्ण/अक्षुण्ण’ है; इस सैन्य-संदर्भ में संख्या के साथ यह उनकी साबुत और सक्षम दशा को व्यक्त करता है।
- source_word: רַבִּים
  choice: बहुत से
  rationale: बहुवचन विशेषण का सीधा और स्वाभाविक हिन्दी रूप, जो शत्रु की बड़ी संख्या दर्शाता है।
- source_word: נָגֹזּוּ
  choice: काट डाले जाएँगे
  rationale: क्रिया के ‘काटना/छाँटना’ अर्थ और शत्रु के विनाश की छवि को सुरक्षित रखता है।
- source_word: וְעָבָר
  choice: मिट जाएँगे
  rationale: शाब्दिक ‘गुज़र जाना’ यहाँ दृश्य से हट जाने या समाप्त हो जाने को दर्शाता है; ‘मिट जाएँगे’ स्वाभाविक हिन्दी में परिणाम स्पष्ट करता है।
- source_word: עִנִּתִךְ
  choice: मैंने तुझे दुःख दिया है
  rationale: द्वितीय पुरुष स्त्रीलिंग एकवचन को ‘तुझे’ से बनाए रखा गया है; क्रिया को अनुशासन या दमन जैसे अधिक विशिष्ट धार्मिक अर्थ में सीमित नहीं किया गया।
theological_decisions:
- issue: वक्ता और सम्बोधित स्त्रीलिंग एकवचन की पहचान
  choice: वक्ता को यहोवा और सम्बोधित पक्ष को अनिर्दिष्ट ‘तू’ रखा गया है
  alternative: सम्बोधित पक्ष को स्पष्ट रूप से ‘यहूदा’ या ‘हे सिय्योन’ कहना
  rationale: मूल पद में नाम नहीं है; स्त्रीलिंग एकवचन संभवतः यहूदा/सिय्योन की ओर संकेत करता है, पर अनुवाद में नाम जोड़ना मूल की निहित अस्पष्टता को समाप्त कर देता।
- issue: विपत्ति में ईश्वरीय कर्तृत्व
  choice: ‘मैंने तुझे दुःख दिया है’
  alternative: ‘तूने दुःख सहा है’
  rationale: मूल में प्रथम पुरुष कर्ता स्पष्ट है; इसलिए ईश्वरीय कर्तृत्व को निष्क्रिय बनाकर नहीं हटाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। समानांतर पंक्तियों को बनाए रखा गया है; अनावश्यक व्याख्यात्मक नाम नहीं जोड़े गए।
