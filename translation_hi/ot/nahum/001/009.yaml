    issue: The clause “वह पूरी तरह अन्त कर देगा” is structurally incomplete/unnatural in Hindi.
    rationale: The verbal expression “अन्त कर देना” generally takes an object, whereas the Hebrew tersely states that he is making a complete end. Recasting it as “वह पूर्ण अंत करेगा” preserves the source’s concise, object-unspecified force.
