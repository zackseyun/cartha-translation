  terminology: “यहोवा,” “षड्यंत्र रच रहे हो,” and “संकट” are suitable modern-standard Hindi choices. “संकट” appropriately retains the Hebrew’s ambiguity regarding whose trouble is in view. The standard modern spelling “अंत” is preferred here.
  issues:
