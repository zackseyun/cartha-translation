  text: מַה תְּחַשְּׁבוּ/ן֙ אֶל יְהוָ֔ה כָּלָ֖ה ה֣וּא עֹשֶׂ֑ה לֹֽא תָק֥וּם פַּעֲמַ֖יִם צָרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/009.yaml
  text: What are you plotting against Yahweh? He will make a complete end[b][a]; trouble will not rise up a second time.
translation:
  language: hi
  text: तुम यहोवा के विरुद्ध क्या षड्यंत्र रच रहे हो?[a] वह पूर्ण अंत करेगा; संकट दूसरी बार नहीं उठेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम यहोवा के विरुद्ध क्या योजना बना रहे हो?” इस क्रिया का अर्थ “सोचना,” “योजना बनाना” या “षड्यंत्र रचना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “विपत्ति दो बार नहीं आएगी।” संक्षिप्त इब्रानी कथन शत्रु के फिर आक्रमण न कर पाने अथवा न्याय को दोहराने की आवश्यकता न रहने—दोनों की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מַה
  choice: क्या
  rationale: यह आलंकारिक प्रश्न आरम्भ करने वाला प्रश्नवाचक शब्द है; ‘क्या’ इब्रानी रूप का सीधा और स्वाभाविक हिन्दी प्रतिरूप है।
- source_word: תְּחַשְּׁבוּן
  choice: षड्यंत्र रच रहे हो
  rationale: חשׁב का अर्थ ‘सोचना, योजना बनाना, युक्ति करना’ हो सकता है; यहोवा के विरुद्ध शत्रुतापूर्ण प्रसंग में ‘षड्यंत्र रचना’ अभिप्रेत विरोध को स्पष्ट करता है।
- source_word: אֶל
  choice: के विरुद्ध
  rationale: यद्यपि אֶל सामान्यतः ‘की ओर’ है, यहाँ योजना बनाने की शत्रुतापूर्ण क्रिया के साथ विरोध का भाव है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: כָּלָה
  choice: पूरी तरह अन्त
  rationale: शब्द पूर्णता अथवा निर्णायक अन्त को दर्शाता है; यह चुनाव न्याय की समग्र और निर्णायक प्रकृति बनाए रखता है।
- source_word: הוּא עֹשֶׂה
  choice: वह ... कर देगा
  rationale: सर्वनाम सहित कृदन्त भविष्य में निश्चित या आसन्न भविष्यद्वाणी-संबंधी कार्य को व्यक्त करता है।
- source_word: לֹא תָקוּם
  choice: नहीं उठेगा
  rationale: קום के ‘उठना/खड़ा होना’ बिंब को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: פַּעֲמַיִם
  choice: दूसरी बार
  rationale: इस वाक्य में ‘दो बार’ की अपेक्षा ‘दूसरी बार’ अधिक स्वाभाविक है और पुनरावृत्ति के भाव को ठीक व्यक्त करता है।
- source_word: צָרָה
  choice: संकट
  rationale: צָרָה का अर्थ संकट, विपत्ति या क्लेश हो सकता है; ‘संकट’ पर्याप्त व्यापक है और अस्पष्ट संदर्भ को संकुचित नहीं करता।
theological_decisions:
- issue: अन्तिम उपवाक्य में ‘संकट’ का संदर्भ और आशय
  choice: निर्णायक अन्त के बाद संकट दूसरी बार नहीं उठेगा।
  alternative: यह शत्रु के दोबारा आक्रमण न करने, अथवा परमेश्वर के लोगों पर विपत्ति फिर न आने की ओर संकेत कर सकता है।
  rationale: इब्रानी कथन अत्यन्त संक्षिप्त है और संकट के पक्ष या कर्ता को स्पष्ट नहीं करता। मुख्य पाठ इस अस्पष्टता को बनाए रखता है और पादटिप्पणी सम्भावित अर्थ बताती है, बिना किसी एक धर्मवैज्ञानिक निष्कर्ष को थोपे।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज स्तर रखा गया है। ‘षड्यंत्र रच रहे हो’ शत्रुतापूर्ण प्रसंग को स्वाभाविक ढंग से व्यक्त करता है; ‘संकट’ अन्तिम पंक्ति की वास्तविक अर्थगत व्यापकता को बनाए रखता है।
