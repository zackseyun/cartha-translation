source:
  edition: WLC
  text: וּ/בְ/שֶׁ֣טֶף עֹבֵ֔ר כָּלָ֖ה יַעֲשֶׂ֣ה מְקוֹמָ֑/הּ וְ/אֹיְבָ֖י/ו יְרַדֶּף חֹֽשֶׁךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/008.yaml
  text: But with an overwhelming flood he will make a complete end of its place[a], and darkness will pursue his enemies.
translation:
  language: hi
  text: परन्तु वह उमड़ती हुई बाढ़ से उसके स्थान का पूर्ण अन्त कर देगा[a], और अन्धकार यहोवा के शत्रुओं का पीछा करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में ‘उसके स्थान’ के लिए स्त्रीलिंग एकवचन प्रत्यय है: शाब्दिक रूप से, ‘उसका स्थान।’ सम्भवतः यह न्याय के अधीन नगर, शायद नीनवे, को स्त्रीरूप में व्यक्त करता है; इसे ‘उस स्थान’ भी समझा जा सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְשֶׁטֶף עֹבֵר
  choice: परन्तु वह उमड़ती हुई बाढ़ से
  rationale: וּ को पद 7 के आश्रय और भलाई के विपरीत यहाँ ‘परन्तु’ कहना सन्दर्भानुकूल है। שֶׁטֶף עֹבֵר बहकर चढ़ आने और सब कुछ ढक लेने वाली बाढ़ का सजीव चित्र देता है; ‘उमड़ती हुई बाढ़’ इसे स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כָּלָה יַעֲשֶׂה
  choice: पूरी तरह अन्त कर देगा
  rationale: यह पदबंध केवल किसी सामान्य अन्त को नहीं, बल्कि पूर्ण विनाश को व्यक्त करता है। हिन्दी में यह क्रियात्मक रूप स्वाभाविक है और כָּלָה की सम्पूर्णता भी बचाता है।
- source_word: מְקוֹמָהּ
  choice: उसके स्थान
  rationale: इब्रानी प्रत्यय स्त्रीलिंग एकवचन है और सम्भवतः न्याय के अधीन नगर या शक्ति की ओर संकेत करता है। हिन्दी का ‘उसके’ लिंग को प्रकट नहीं करता, इसलिए अस्पष्ट पूर्वपद को थोपे बिना मूल का सम्बन्ध बनाए रखता है।
- source_word: וְאֹיְבָיו
  choice: और उसके शत्रुओं
  rationale: पुल्लिंग एकवचन प्रत्यय सन्दर्भ में यहोवा की ओर संकेत करता है। हिन्दी में ‘उसके’ का स्पष्ट आशय निकटवर्ती व्यापक सन्दर्भ से परमेश्वर के शत्रु हैं।
- source_word: יְרַדֶּף
  choice: पीछा करेगा
  rationale: רדף के गहन रूप का सीधा अर्थ पीछा करना है; यह न्याय की सक्रिय और धमकीपूर्ण छवि को सुरक्षित रखता है।
- source_word: חֹשֶׁךְ
  choice: अन्धकार
  rationale: शाब्दिक ठोस बिम्ब रखा गया है; न्याय का आशय व्याख्या में जोड़े बिना सन्दर्भ से उभरता है।
theological_decisions:
- issue: מְקוֹמָהּ और אֹיְבָיו के प्रत्ययों के अलग-अलग सम्भावित सन्दर्भ
  choice: पहले प्रत्यय को न्यायाधीन स्त्रीलिंग नगर/शक्ति से और दूसरे को यहोवा से सम्बद्ध समझते हुए हिन्दी में दोनों के लिए ‘उसके’ रखा गया है।
  alternative: ‘उस नगर के स्थान’ और ‘यहोवा के शत्रुओं’ कहकर सन्दर्भों को स्पष्ट करना; अथवा पहले को निर्जीव अर्थ में ‘उस स्थान’ कहना।
  rationale: मूल पाठ स्त्रीलिंग और पुल्लिंग प्रत्ययों के बीच परिवर्तन करता है, पर उनके संज्ञात्मक पूर्वपद यहाँ प्रकट नहीं हैं। मुख्य पाठ में नाम जोड़ना अस्पष्टता को आवश्यकता से अधिक सुलझा देता; पादटिप्पणी पहले प्रत्यय की वास्तविक व्याकरणिक विशेषता बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उमड़ती हुई बाढ़’ भविष्यद्वाणी के ठोस बिम्ब को बनाए रखता है और ‘पूरी तरह अन्त कर देगा’ सम्पूर्ण विनाश की तीव्रता व्यक्त करता है। ‘अन्धकार’ को व्याख्यात्मक विस्तार दिए बिना मूल रूप में रखा गया है।
