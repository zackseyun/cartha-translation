base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/011.yaml
  text: From you has come one who plots evil against Yahweh[a], a counselor of worthlessness.
translation:
  language: hi
  text: तुझ से एक निकला है, जो यहोवा के विरुद्ध बुराई की योजना बनाता है—एक निकृष्ट सलाहकार।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, यदि בְּלִיָּעַל को “निकृष्ट” के बजाय नाम-सदृश पद माना जाए, “बिलियाल का सलाहकार।”
    reason: वैकल्पिक पाठ
lexical_decisions:
- source_word: מִמֵּךְ
  choice: तुझमें से
  rationale: מִן के साथ स्त्रीलिंग एकवचन प्रत्यय स्रोत या उद्गम बताता है। यहाँ संभवतः नगर या राज्य को एक इकाई के रूप में संबोधित किया गया है; हिंदी में “तुझमें से” इस प्रत्यक्ष संबोधन और उद्गम दोनों को स्वाभाविक रूप से रखता है।
- source_word: יָצָא
  choice: निकला है
  rationale: पूर्ण क्रिया किसी व्यक्ति के उस संबोधित सत्ता में से प्रकट होने को बताती है। “निकला है” हिंदी में पूर्ण घटना और उसके वर्तमान महत्व दोनों को व्यक्त करता है।
- source_word: חֹשֵׁב
  choice: योजना बनाता है
  rationale: חשׁב का कृदन्त यहाँ सोचने मात्र के बजाय जानबूझकर कुछ रचने या षड्यंत्र करने का भाव रखता है। “बुराई की योजना बनाता है” शत्रुतापूर्ण आशय को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: עַל יְהוָה
  choice: यहोवा के विरुद्ध
  rationale: इस शत्रुतापूर्ण प्रसंग में עַל का विरोधसूचक अर्थ है। ईश्वरीय नाम יהוה को शीर्षक से बदलने के बजाय “यहोवा” के रूप में रखा गया है।
- source_word: רָעָה
  choice: बुराई
  rationale: यहाँ רָעָה नियोजित नैतिक दुष्टता को दर्शाता है, केवल हानि या विपत्ति को नहीं।
- source_word: יֹעֵץ
  choice: सलाह देनेवाला
  rationale: कृदन्त पहले वर्णित व्यक्ति के समानाधिकरण में है। “सलाह देनेवाला” सामान्य आधुनिक हिंदी में स्वाभाविक है और क्रियात्मक बल बनाए रखता है।
- source_word: בְּלִיָּעַל
  choice: अधमता
  rationale: बाइबिलीय इब्रानी में यह शब्द प्रायः निकृष्टता, अधमता या दुष्टता का गुणसूचक सामान्य नाम है। “अधमता” इस नैतिक और गुणात्मक अर्थ को रखता है, जबकि बाद के व्यक्तिनाम-सदृश अर्थ को मुख्य पाठ पर आरोपित नहीं करता।
theological_decisions:
- issue: בְּלִיָּעַל को सामान्य गुणसूचक संज्ञा मानना या व्यक्तिनाम
  choice: मुख्य पाठ में “अधमता”
  alternative: “बिलियाल” को नाम-सदृश पद मानकर “बिलियाल की सलाह देनेवाला”
  rationale: इस प्रसंग में सामान्य संज्ञा के रूप में निकृष्टता या दुष्टता का अर्थ पर्याप्त है; व्यक्तिनाम मानना आवश्यक नहीं। फिर भी इब्रानी पद नाम-सदृश रूप में समझा जा सकता है, इसलिए वैकल्पिक पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: יהוה का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। उसका लिप्यंतरण नाम और उपाधि के भेद को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रत्यक्ष भविष्यद्वाणी-संबोधन के अनुरूप है। “तुझमें से” मूल के स्त्रीलिंग एकवचन संबोधन का संख्या-भाव बनाए रखता है, यद्यपि हिंदी में व्याकरणिक स्त्रीलिंग स्पष्ट नहीं होता। डैश समानाधिकरण में आए अंतिम वर्णन को उभारता है।
