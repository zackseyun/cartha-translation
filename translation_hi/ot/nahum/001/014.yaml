source:
  edition: WLC
  text: וְ/צִוָּ֤ה עָלֶ֨י/ךָ֙ יְהוָ֔ה לֹֽא יִזָּרַ֥ע מִ/שִּׁמְ/ךָ֖ ע֑וֹד מִ/בֵּ֨ית אֱלֹהֶ֜י/ךָ אַכְרִ֨ית פֶּ֧סֶל וּ/מַסֵּכָ֛ה אָשִׂ֥ים קִבְרֶ֖/ךָ כִּ֥י קַלּֽוֹתָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/014.yaml
  text: 'Yahweh has commanded concerning you: No more will your name be sown[a]. From the house of your gods I will cut off carved image and cast image. I will make your grave[c][b], for you are contemptible.'
translation:
  language: hi
  text: 'याहवे ने तुम्हारे विषय में आज्ञा दी है: “अब तुम्हारे नाम से कोई बीज फिर नहीं बोया जाएगा।[a] तुम्हारे देवताओं के भवन से मैं तराशी हुई मूर्ति और ढली हुई मूर्ति को नष्ट कर दूँगा। मैं तुम्हारी कब्र तैयार करूँगा, क्योंकि तुम तुच्छ हो।”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् तुम्हारा नाम या वंश आगे नहीं चलेगा; इसका अनुवाद यह भी हो सकता है, “अब तुम्हारे नाम से कोई वंशज उत्पन्न न होगा।”
    reason: lexical_alternative
  - marker: b
    text: “तुच्छ” का अर्थ यहाँ “घृणित,” “तिरस्करणीय” या “महत्त्वहीन” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה עָלֶיךָ יְהוָה
  choice: याहवे ने तुम्हारे विषय में आज्ञा दी है
  rationale: पूर्ण क्रिया जारी की जा चुकी ईश्वरीय आज्ञा को वर्तमान प्रभाव सहित व्यक्त करती है; עָלֶיךָ को व्यापक और स्वाभाविक ‘तुम्हारे विषय में’ से व्यक्त किया गया है।
- source_word: לֹא יִזָּרַע מִשִּׁמְךָ עוֹד
  choice: अब तुम्हारे नाम का बीज फिर न बोया जाएगा
  rationale: זרע के बोने वाले रूपक को बनाए रखते हुए हिन्दी में उसका वंश अथवा नाम आगे चलने का संकेत समझने योग्य बनाया गया है।
- source_word: מִבֵּית אֱלֹהֶיךָ
  choice: तुम्हारे देवताओं के भवन से
  rationale: אֱלֹהֶיךָ के रूपगत बहुवचन को रखा गया है और בֵּית का ठोस अर्थ ‘भवन’ चुना गया है; प्रसंग में यह देवालय है।
- source_word: אַכְרִית
  choice: नष्ट कर दूँगा
  rationale: כרת का आशय यहाँ मूर्तियों को हटा देना या समाप्त कर देना है; हिन्दी में ‘काट डालूँगा’ मूर्तियों के साथ अस्वाभाविक होता, इसलिए न्यायात्मक बल सहित स्वाभाविक अभिव्यक्ति चुनी गई है।
- source_word: פֶּסֶל וּמַסֵּכָה
  choice: खुदी हुई मूर्ति और ढली हुई मूर्ति
  rationale: दोनों निर्माण-विधियों—तराशने और धातु ढालने—का भेद स्पष्ट रखा गया है।
- source_word: אָשִׂים קִבְרֶךָ
  choice: मैं तुम्हारी कब्र तैयार करूँगा
  rationale: संक्षिप्त इब्रानी मुहावरा मृत्यु और दफन के ईश्वरीय निर्धारण को सूचित करता है; ‘तैयार करूँगा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כִּי קַלּוֹתָ
  choice: क्योंकि तुम तुच्छ हो
  rationale: קלל के ‘हल्का, कम मूल्य का, तिरस्करणीय’ अर्थ-क्षेत्र को ‘तुच्छ’ संक्षेप और गरिमा के साथ व्यक्त करता है, पर अर्थ की वैकल्पिक छटाएँ टिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; उसे किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- issue: ‘तुम्हारे नाम का बीज बोया जाना’ का अर्थ
  choice: मुख्य पाठ में रूपक को बनाए रखना
  alternative: ‘तुम्हारा वंश आगे नहीं चलेगा’
  rationale: पंक्ति संभवतः वंश, राजवंश या स्मरण की निरंतरता के अंत को बताती है, पर मूल रूपक की व्यापकता और वास्तविक अस्पष्टता को मुख्य पाठ में सुरक्षित रखा गया है।
- issue: אֱלֹהֶיךָ की संख्या
  choice: तुम्हारे देवताओं
  alternative: तुम्हारे देवता
  rationale: रूप रूपगत बहुवचन है और अश्शूरी बहुदेववादी प्रसंग बहुवचन का समर्थन करता है; एकवचन को निर्णायक रूप से अपनाना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी भविष्यवाणी-संबंधी शैली रखी गई है। पद्य की कठोरता बचाने के लिए वाक्य छोटे रखे गए हैं। ‘खुदी हुई’ और ‘ढली हुई’ सामान्य पाठक के लिए मूर्ति-निर्माण की दो विधियाँ स्पष्ट करते हैं। सभी टिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
