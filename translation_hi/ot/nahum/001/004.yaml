source:
  edition: WLC
  text: גּוֹעֵ֤ר בַּ/יָּם֙ וַֽ/יַּבְּשֵׁ֔/הוּ וְ/כָל הַ/נְּהָר֖וֹת הֶֽחֱרִ֑יב אֻמְלַ֤ל בָּשָׁן֙ וְ/כַרְמֶ֔ל וּ/פֶ֥רַח לְבָנ֖וֹן אֻמְלָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/004.yaml
  text: He rebukes the sea and dries it up; he makes all the rivers run dry[a]. Bashan and Carmel wither; even the blossom of Lebanon withers.
translation:
  language: hi
  text: 'वह समुद्र को डाँटता है और उसे सुखा देता है;

    वह सभी नदियों को सुखा देता है।


    बाशान और कर्मेल मुरझा जाते हैं;

    लबानोन का फूल मुरझा जाता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גּוֹעֵר
  choice: डाँटता है
  rationale: यह क्रिया किसी को सामर्थ्यपूर्वक झिड़कने या आदेश देकर रोकने का भाव रखती है। ‘डाँटता है’ समुद्र पर परमेश्वर के व्यक्तिगत और प्रभावशाली अधिकार को सजीव रखता है।
- source_word: וַיַּבְּשֵׁהוּ
  choice: उसे सुखा देता है
  rationale: पुल्लिंग एकवचन प्रत्यय का संबंध ‘समुद्र’ से है; यह अनुवाद क्रिया के कारक भाव और परिणाम दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְכָל הַנְּהָרוֹת הֶחֱרִיב
  choice: वह सभी नदियों को सूखा देता है
  rationale: हिफ़ील रूप यहाँ जलधाराओं को सूखा देने का कारक अर्थ रखता है। जल के संदर्भ में ‘उजाड़ देता है’ की अपेक्षा ‘सूखा देता है’ अधिक स्पष्ट और सटीक है।
- source_word: אֻמְלַל
  choice: मुरझा जाते हैं / मुरझा जाता है
  rationale: वनस्पति और उपजाऊ प्रदेशों के संदर्भ में यह क्रिया कुम्हलाने या सूखने का भाव देती है। दोनों बार समान मूल अर्थ रखने से काव्यात्मक पुनरावृत्ति बनी रहती है।
- source_word: בָּשָׁן וְכַרְמֶל
  choice: बाशान और कर्मेल
  rationale: दोनों स्थान-नामों का हिन्दी लिप्यंतरण किया गया है; मूल में ‘पर्वत’ शब्द नहीं है, इसलिए उसे जोड़ा नहीं गया।
- source_word: וּפֶרַח לְבָנוֹן
  choice: लबानोन का फूल भी
  rationale: פֶרַח का अर्थ ‘फूल/पुष्प’ है। ‘भी’ अंतिम बिंब की काव्यात्मक पराकाष्ठा को स्वाभाविक हिन्दी में उभारता है, जबकि मूल संयोजक וּ־ से आगे जुड़ाव बना रहता है।
theological_decisions:
- issue: पद में कर्ता का अप्रकट होना
  choice: ‘वह’ का प्रयोग, जिसका संदर्भ निकटवर्ती प्रसंग में यहोवा से है
  alternative: ‘यहोवा’ नाम को इस पद में दोहराना
  rationale: इब्रानी में क्रियाएँ पुल्लिंग एकवचन हैं और कर्ता पिछले पदों से समझा जाता है। हिन्दी में ‘वह’ प्रवाह बनाए रखता है और ऐसा ईश्वरीय नाम नहीं जोड़ता जो इस पद में स्वयं उपस्थित नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पंक्ति-विन्यास इब्रानी काव्य के समानांतर बिंबों को स्पष्ट करता है। किसी पादटिप्पणी की आवश्यकता नहीं समझी गई, क्योंकि नदियों को ‘सूखा देता है’ कहना इब्रानी क्रिया का सीधा और स्वाभाविक हिन्दी रूप है।
