source:
  edition: WLC
  text: יְהֹוָ֗ה אֶ֤רֶךְ אַפַּ֨יִם֙ ו/גדול כֹּ֔חַ וְ/נַקֵּ֖ה לֹ֣א יְנַקֶּ֑ה יְהוָ֗ה בְּ/סוּפָ֤ה וּ/בִ/שְׂעָרָה֙ דַּרְכּ֔/וֹ וְ/עָנָ֖ן אֲבַ֥ק רַגְלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/003.yaml
  text: Yahweh is slow to anger and great in power[a], and he will by no means leave the guilty unpunished. Yahweh—his way is in the whirlwind and the storm, and clouds are the dust of his feet.
translation:
  language: hi
  text: याहवे क्रोध करने में धीमा और सामर्थ्य में महान है; वह दोषी को किसी भी तरह दण्ड से नहीं छोड़ेगा। याहवे—उसका मार्ग बवंडर और आँधी में है, और बादल उसके चरणों की धूल हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक शाब्दिक: “वह किसी भी तरह दोषमुक्त नहीं करेगा” अथवा “वह निश्चय ही निर्दोष नहीं ठहराएगा।”'
    reason: וְנַקֵּה לֹא יְנַקֶּה की प्रबल निषेधात्मक न्यायिक रचना के औपचारिक वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: יְהֹוָה / יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में निकटवर्ती लिप्यंतरण द्वारा रखा गया है।
- source_word: אֶרֶךְ אַפַּיִם
  choice: क्रोध करने में धीरजवन्त
  rationale: शाब्दिक मुहावरा ‘लम्बी नासिका वाला’ क्रोध करने में विलम्ब और धैर्य व्यक्त करता है; चुना हुआ रूप अर्थ और गरिमा दोनों बनाए रखता है।
- source_word: וּגְדוֹל־כֹּחַ
  choice: और सामर्थ्य में महान
  rationale: גדול और כח के सीधे अर्थ को स्वाभाविक हिन्दी पदबंध में सुरक्षित रखा गया है।
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: पर वह दोषी को किसी भी तरह दण्ड से नहीं छोड़ेगा
  rationale: एक ही धातु की प्रबल निषेधात्मक रचना का आशय है कि याहवे अपराधी को निर्दोष ठहराकर या दण्ड दिए बिना नहीं छोड़ेगा; हिन्दी में निहित कर्म ‘दोषी’ स्पष्ट किया गया है।
- source_word: בְּסוּפָה וּבִשְׂעָרָה
  choice: बवंडर और आँधी में
  rationale: दोनों हिंसक मौसमी चित्रों का भेद सहज आधुनिक हिन्दी में बवंडर और आँधी से व्यक्त होता है।
- source_word: דַּרְכּוֹ
  choice: उसका मार्ग
  rationale: דרך का सीधा अर्थ ‘मार्ग’ है और यहाँ वह याहवे की गतिशील उपस्थिति का चित्र प्रस्तुत करता है।
- source_word: וְעָנָן אֲבַק רַגְלָיו
  choice: और बादल उसके चरणों की धूल हैं
  rationale: एकवचन सामूहिक ‘बादल’ को हिन्दी में स्वाभाविक रूप से रखा गया है; ‘चरण’ काव्यात्मक गरिमा के अनुकूल है।
theological_decisions:
- issue: दिव्य नाम YHWH का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिवाचक वाचा-नाम आया है; उसका लिप्यंतरण नाम और उपाधि का भेद बनाए रखता है।
- issue: וְנַקֵּה לֹא יְנַקֶּה में न्यायिक बल
  choice: वह दोषी को किसी भी तरह दण्ड से नहीं छोड़ेगा
  alternative: वह किसी भी तरह निर्दोष नहीं ठहराएगा
  rationale: यह रूप परमेश्वर के क्रोध में धीरज और न्याय की निश्चितता के बीच मूल तनाव को बनाए रखता है, जबकि निहित दोषी व्यक्ति को हिन्दी में स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए बोधगम्य शैली। ‘धीरजवन्त’, ‘सामर्थ्य’, ‘मार्ग’ और ‘चरण’ भविष्यद्वाणी के ऊँचे काव्यात्मक स्वर को रखते हैं, जबकि वाक्यरचना सरल है।
