  text: לִ/פְנֵ֤י זַעְמ/וֹ֙ מִ֣י יַֽעֲמ֔וֹד וּ/מִ֥י יָק֖וּם בַּ/חֲר֣וֹן אַפּ֑/וֹ חֲמָת/וֹ֙ נִתְּכָ֣ה כָ/אֵ֔שׁ וְ/הַ/צֻּרִ֖ים נִתְּצ֥וּ מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/006.yaml
  text: Who can stand before his indignation? And who can rise up in the heat of his anger? His wrath is poured out like fire[c][b][a], and the rocks are shattered by him.
translation:
  language: hi
  text: उसके रोष के सामने कौन ठहर सकता है?[a] और उसके क्रोध की ज्वाला में कौन उठ खड़ा हो सकता है? उसका प्रकोप आग के समान उंडेला जाता है, और चट्टानें[b] उसके कारण चूर-चूर हो जाती हैं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके रोष के सामने कौन सह सकता है? और उसके भड़कते क्रोध के सामने कौन खड़ा रह सकता है?”
    reason: lexical_alternative
  - marker: b
    text: या, “शैल” अथवा “चट्टानी कगारें”।
    reason: lexical_alternative
  - marker: c
    text: “उसके कारण” का अनुवाद “उसके द्वारा” अथवा “उससे” भी हो सकता है; हिब्रू पूर्वसर्ग कारण, कर्तृत्व या स्रोत का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי זַעְמוֹ
  choice: उसके रोष के सामने
  rationale: לִפְנֵי का स्वाभाविक स्थानवाचक अर्थ ‘के सामने’ है। זַעַם के लिए ‘रोष’ दिव्य अप्रसन्नता और तीव्र क्रोध—दोनों को व्यक्त करता है।
- source_word: יַעֲמוֹד
  choice: ठहर सकता है
  rationale: 'प्रश्न यहाँ सामर्थ्य का है: कौन परमेश्वर के रोष के सामने टिक या ठहर सकता है। ‘ठहर सकता है’ शारीरिक रूपक और सह पाने के भाव दोनों को बनाए रखता है।'
- source_word: יָקוּם
  choice: उठ खड़ा हो सकता है
  rationale: קוּם का मूल भाव ‘उठना/उठ खड़ा होना’ है। यह पहले प्रश्न के ‘ठहरने’ के समानांतर रहते हुए अलग हिब्रू क्रिया को भी दर्शाता है।
- source_word: בַּחֲרוֹן אַפּוֹ
  choice: उसके धधकते क्रोध में
  rationale: חֲרוֹן אַף में क्रोध के जलने या धधकने का रूपक है। ‘धधकता क्रोध’ आधुनिक हिन्दी में स्वाभाविक है और उस रूपक को बनाए रखता है।
- source_word: חֲמָתוֹ
  choice: उसका प्रकोप
  rationale: חֵמָה न्यायकारी तीव्र क्रोध को सूचित करता है। ‘प्रकोप’ काव्यात्मक गरिमा रखता है और पहले प्रयुक्त ‘रोष’ तथा ‘क्रोध’ से हिब्रू शब्द-विविधता को अलग दिखाता है।
- source_word: נִתְּכָה כָאֵשׁ
  choice: आग के समान उंडेला जाता है
  rationale: निफ़ाल रूप का अर्थ यहाँ ‘उंडेला जाना’ है और כָאֵשׁ स्पष्ट उपमा है। हिन्दी वाक्य स्रोत के प्रचंड प्रवाह-चित्र को बनाए रखता है।
- source_word: הַצֻּרִים
  choice: चट्टानें
  rationale: צוּר चट्टान, शैल या कगार को सूचित कर सकता है। ‘चट्टानें’ व्यापक, सहज और इस ब्रह्मांडीय न्याय-चित्र के अनुकूल है।
- source_word: נִתְּצוּ
  choice: चूर-चूर हो जाती हैं
  rationale: क्रिया के टूटने, ढहने या टुकड़े होने के तीव्र भाव को ‘चूर-चूर हो जाती हैं’ स्पष्ट और प्रभावी हिन्दी में व्यक्त करता है।
- source_word: מִמֶּנּוּ
  choice: उसके कारण
  rationale: מִן यहाँ कारण या स्रोत का भाव दे सकता है और संभवतः कर्तृत्व का भी। मुख्य पाठ में ‘उसके कारण’ चुना गया है; पादटिप्पणी ‘उसके द्वारा’ और ‘उससे’ की सम्भावना सुरक्षित रखती है।
theological_decisions:
- issue: दिव्य क्रोध के लिए प्रयुक्त अनेक समानार्थी हिब्रू शब्द
  choice: ‘रोष’, ‘क्रोध’ और ‘प्रकोप’—तीन संबंधित पर अलग हिन्दी शब्द
  alternative: पूरे पद में केवल ‘क्रोध’ दोहराना, या अधिक भावात्मक ‘कोप/उग्रता’ चुनना
  rationale: मूल पद कई क्रोध-सूचक शब्दों को जोड़कर तीव्रता बढ़ाता है। हिन्दी में नियंत्रित विविधता काव्यात्मक बनावट को बचाती है और किसी अतिरिक्त सिद्धान्तगत अर्थ को नहीं जोड़ती।
- issue: दोनों प्रश्नों का आलंकारिक बल
  choice: ‘कौन ... सकता है?’ के रूप में सामर्थ्य-वाचक प्रश्न
  alternative: साधारण वर्तमान/भविष्य रूप, या व्याख्यात्मक ‘कौन सह सकता है?’
  rationale: संदर्भ परमेश्वर के न्याय के सामने टिकने की असमर्थता पर बल देता है। ‘सकता है’ इस आलंकारिक बल को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि उत्तर को पाठ में अनावश्यक रूप से नहीं जोड़ता।
- issue: מִמֶּנּוּ में कारण, स्रोत या कर्तृत्व
  choice: मुख्य पाठ में ‘उसके कारण’, विकल्प पादटिप्पणी में
  alternative: ‘उसके द्वारा’ या ‘उससे’
  rationale: हिब्रू पूर्वसर्ग का संबंध कारण, स्रोत या कर्ता के रूप में समझा जा सकता है। किसी एक सूक्ष्म अर्थ को पूर्णतः निश्चित न करते हुए मुख्य पाठ स्वाभाविक रखा गया है और वास्तविक अस्पष्टता पादटिप्पणी में संरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यद्वाणी-काव्य की गरिमा और तीव्रता बनाए रखती है। ‘धधकते’, ‘उंडेला’ और ‘चूर-चूर’ जैसे सहज चित्रात्मक शब्द मूल के अग्नि और विनाश-बिंबों को स्पष्ट करते हैं।
