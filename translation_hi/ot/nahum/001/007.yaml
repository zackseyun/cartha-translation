source:
  edition: WLC
  text: ט֣וֹב יְהוָ֔ה לְ/מָע֖וֹז בְּ/י֣וֹם צָרָ֑ה וְ/יֹדֵ֖עַ חֹ֥סֵי בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/007.yaml
  text: Yahweh is good[a], a stronghold in the day of distress[c][b]; he knows those who take refuge in him.
translation:
  language: hi
  text: 'याहवे भला है;

    संकट के दिन[b] वह एक दृढ़ गढ़[a] है।

    जो उसमें शरण लेते हैं[c], उन्हें वह जानता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शरणस्थान’ अथवा ‘किला’।
    reason: lexical_alternative
  - marker: b
    text: या ‘मुसीबत के दिन’।
    reason: lexical_alternative
  - marker: c
    text: या ‘जो उस पर भरोसा रखते हैं’। इब्रानी में अधिक शाब्दिक रूप से उसमें शरण लेने की बात है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: भला
  rationale: यह विशेषण याहवे के चरित्र और हितकारी स्वभाव को व्यापक रूप से व्यक्त करता है। ‘भला’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके प्रचलित लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: לְמָעוֹז
  choice: एक दृढ़ गढ़
  rationale: מָעוֹז सुरक्षा और प्रतिरक्षा के स्थान को दर्शाता है। ‘दृढ़ गढ़’ ठोस रक्षात्मक बिंब बनाए रखता है; हिन्दी में स्पष्टता के लिए ‘वह ... है’ जोड़ा गया है।
- source_word: בְּיוֹם צָרָה
  choice: संकट के दिन
  rationale: यह पदबंध कठिनाई अथवा विपत्ति के समय को सामान्य रूप से बताता है। ‘संकट के दिन’ मूल की कालवाचक अभिव्यक्ति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וְיֹדֵעַ
  choice: उन्हें वह जानता है
  rationale: ידע का मूल अर्थ ‘जानना’ है और यहाँ व्यक्तिगत पहचान तथा सरोकार का भाव भी हो सकता है। अनुवाद ने ‘देखभाल करता है’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचते हुए मूल अर्थ रखा है।
- source_word: חֹסֵי בוֹ
  choice: जो उसमें शरण लेते हैं
  rationale: חסה सुरक्षा के लिए आश्रय लेने को दर्शाता है। ‘शरण लेते हैं’ इस ठोस रूपक को बनाए रखता है और ‘गढ़’ के बिंब के साथ मेल खाता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में व्यक्तिगत परमेश्वर-नाम सीधे आया है। ‘याहवे’ उसे उपाधि से बदले बिना प्रस्तुत करता है।
- issue: ‘संकट के दिन’ का आशय
  choice: संकट के समय का सामान्य अर्थ
  alternative: अंत-समय का कोई विशिष्ट संकट-दिवस
  rationale: इस पद में अपने आप ऐसा कोई संकेत नहीं है जो इसे अनिवार्य रूप से अंत-समय का तकनीकी पद बनाए; इसलिए व्यापक कालवाचक अर्थ सुरक्षित रखा गया है।
- issue: יֹדֵעַ में ज्ञान और संबंध का तनाव
  choice: जानता है
  alternative: पहचानता है; उनकी सुधि लेता है
  rationale: ‘जानता है’ मूल क्रिया की अर्थ-सीमा को सुरक्षित रखता है और व्यक्तिगत संबंध की सम्भावना को बंद नहीं करता, पर देखभाल का अर्थ अनुवाद में स्पष्ट रूप से आरोपित भी नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है और भविष्यद्वाणी-साहित्य के अनुरूप संक्षिप्त तथा गरिमापूर्ण रखी गई है। काव्यात्मक समानांतरता दिखाने के लिए पंक्ति-विभाजन किया गया है। ‘दृढ़ गढ़’ और ‘शरण लेते हैं’ मूल के परस्पर जुड़े सुरक्षा-बिंबों को बनाए रखते हैं।
