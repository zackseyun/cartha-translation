base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/013.yaml
  text: And now I will break his yoke from upon you[a], and I will tear off your bonds.
translation:
  language: hi
  text: और अब मैं उसका जुआ तुम्हारे ऊपर से तोड़ दूँगा[a], और तुम्हारे बंधनों को तोड़ डालूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसका डंडा’। इब्रानी शब्द का अर्थ छड़, डंडा या जुआ हो सकता है; यहाँ अत्याचार और बंधनों की समानांतर छवि के कारण ‘जुआ’ अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: कालसूचक कथन-चिह्न के साथ संयोजक को भी सुरक्षित रखता है और आसन्न ईश्वरीय कार्य का स्वाभाविक परिचय देता है।
- source_word: אֶשְׁבֹּר
  choice: मैं ... तोड़ दूँगा
  rationale: שבר के काल रूप का सीधा और प्रसंगानुकूल अनुवाद; ‘जुआ’ की छवि के साथ स्वाभाविक है।
- source_word: מֹטֵהוּ
  choice: उसका जुआ
  rationale: मूल शब्द छड़, डंडा या जुए को सूचित कर सकता है। बंधनों के समानांतर और अधीनता के प्रसंग में ‘जुआ’ सबसे उपयुक्त है; पुरुषवाचक एकवचन प्रत्यय ‘उसका’ के रूप में सुरक्षित है।
- source_word: מֵעָלָיִךְ
  choice: तुम्हारे ऊपर से
  rationale: मूल में स्त्रीलिंग एकवचन संबोधन और किसी भार के ऊपर रखे होने की सजीव छवि दोनों को व्यक्त करता है; हिन्दी में लिंग इस सर्वनाम-रूप में प्रकट नहीं होता।
- source_word: וּמוֹסְרֹתַיִךְ
  choice: और तुम्हारे बंधनों को
  rationale: अधीनता या बंदीपन के बंधनों का व्यापक और स्वाभाविक रूपकात्मक अनुवाद है।
- source_word: אֲנַתֵּק
  choice: तोड़ डालूँगा
  rationale: נתק के पिएल रूप में बलपूर्वक अलग करने, उखाड़ने या चटका देने का भाव है। बंधनों के साथ ‘तोड़ डालना’ आधुनिक हिन्दी में स्पष्ट और प्रभावी है।
theological_decisions:
- issue: מֹטֵהוּ में तृतीय पुरुष एकवचन प्रत्यय का संदर्भ
  choice: ‘उसका जुआ’ रखकर संदर्भ को अनिर्दिष्ट रहने देना
  alternative: ‘अश्शूर का जुआ’ या ‘उसका डंडा’
  rationale: निकट प्रसंग अत्याचारी शक्ति, संभवतः अश्शूर या उसके राजा, की ओर संकेत करता है; फिर भी इब्रानी पाठ केवल तृतीय पुरुष एकवचन प्रत्यय देता है। इसलिए मुख्य पाठ में स्पष्ट पहचान जोड़ना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप। स्त्रीलिंग एकवचन संबोधन इब्रानी में स्पष्ट है, पर हिन्दी ‘तुम्हारे’ में उसका लिंग अलग से व्यक्त नहीं होता।
