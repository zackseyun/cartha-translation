source:
  edition: WLC
  text: כִּ֚י עַד סִירִ֣ים סְבֻכִ֔ים וּ/כְ/סָבְאָ֖/ם סְבוּאִ֑ים אֻ֨כְּל֔וּ כְּ/קַ֥שׁ יָבֵ֖שׁ מָלֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/010.yaml
  text: For though they are tangled like thorns[a], and drenched with their drink[b], they will be consumed like fully dry stubble.
translation:
  language: hi
  text: क्योंकि चाहे वे काँटों की तरह आपस में उलझे हों[a] और अपनी मदिरा से सराबोर हों[b], वे पूरी तरह सूखी पराली के समान भस्म हो जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस आरंभिक इब्रानी वाक्यांश का अर्थ कठिन है; इसका अनुवाद “क्योंकि जब वे काँटों की तरह आपस में उलझे हों” भी किया जा सकता है।
    reason: alternative_reading
  - marker: b
    text: इस कठिन इब्रानी अभिव्यक्ति को “और मतवाले अपनी मदिरा से मतवाले हों” या “और अपनी मदहोशी में हों” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי עַד
  choice: क्योंकि चाहे
  rationale: काव्यात्मक रूप से संक्षिप्त आरंभ को कारणसूचक और रियायती अर्थ में प्रस्तुत करता है; इब्रानी की कठिनाई को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: סִירִים סְבֻכִים
  choice: काँटों की तरह आपस में उलझे
  rationale: कँटीली वनस्पति और उसके परस्पर गुँथे होने की सजीव उपमा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּכְסָבְאָם סְבוּאִים
  choice: और अपनी मदिरा से सराबोर
  rationale: मदिरा से तृप्त, भीगे या मतवाले होने की कठिन और शब्दालंकारयुक्त इब्रानी अभिव्यक्ति को अनावश्यक रूप से किसी एक अर्थ तक सीमित किए बिना तरलता और नशे दोनों की छवि बनाए रखता है।
- source_word: אֻכְּלוּ
  choice: भस्म हो जाएँगे
  rationale: भविष्य की निश्चित भविष्यवाणी के रूप में प्रयुक्त पूर्ण क्रिया को पराली की दहनशील छवि के अनुरूप व्यक्त करता है।
- source_word: כְּקַשׁ יָבֵשׁ מָלֵא
  choice: पूरी तरह सूखी पराली के समान
  rationale: קשׁ के खेत में बचे सूखे डंठलों या पुआल-सदृश अवशेष और מָלֵא की तीव्रता को सामान्य, स्पष्ट हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: भविष्यवाणी में इब्रानी पूर्ण क्रिया का काल
  choice: भस्म हो जाएँगे
  alternative: भस्म हो गए
  rationale: संदर्भ में यह आने वाले न्याय की निश्चितता व्यक्त करने वाला भविष्यसूचक पूर्ण है; भविष्यकाल उस बल को स्वाभाविक हिन्दी में दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। “सराबोर” मदिरा से भीगे और मतवाले—दोनों संभावित भावों को सँभालता है, जबकि “पराली” शीघ्र जल जाने वाले सूखे कृषि-अवशेष की छवि सामान्य पाठक के लिए स्पष्ट करती है।
