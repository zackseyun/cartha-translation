  text: מַשָּׂ֖א נִֽינְוֵ֑ה סֵ֧פֶר חֲז֛וֹן נַח֖וּם הָ/אֶלְקֹשִֽׁי׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/001.yaml
  text: An oracle concerning Nineveh[a]. The book of the vision of Nahum the Elkoshite.
translation:
  language: hi
  text: नीनवे के विषय में भविष्यवाणी[a]। एल्कोशी नहूम के दर्शन की पुस्तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नीनवे का भार’ अथवा ‘नीनवे के विषय में घोषणा’।
    reason: מַשָּׂא के अर्थ में भारी या गंभीर भविष्यसूचक संदेश और अधिकारपूर्ण घोषणा—दोनों भाव संभव हैं।
lexical_decisions:
- source_word: מַשָּׂא
  choice: भविष्यवाणी
  rationale: भविष्यद्वक्ताओं की पुस्तक के शीर्षकों में यह शब्द किसी शाब्दिक बोझ के बजाय गंभीर, अधिकारपूर्ण भविष्यसूचक संदेश या घोषणा को दर्शाता है। ‘भविष्यवाणी’ सामान्य हिन्दी पाठक के लिए स्वाभाविक है; शब्द में निहित ‘भार’ और ‘घोषणा’ के संभावित अर्थ पादटिप्पणी में सुरक्षित रखे गए हैं।
- source_word: נִינְוֵה
  choice: नीनवे
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: סֵפֶר
  choice: पुस्तक
  rationale: यह लिखित दस्तावेज़, पुस्तक या लेख को दर्शाता है; इस शीर्षक में ‘पुस्तक’ सबसे सीधा और स्वाभाविक विकल्प है।
- source_word: חֲזוֹן
  choice: दर्शन
  rationale: भविष्यसूचक रीति से प्रकट किए गए दृश्य या संदेश का मानक शब्द; यह प्रकाशन के स्वरूप को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
- source_word: נַחוּם
  choice: नहूम
  rationale: व्यक्ति-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: הָאֶלְקֹשִׁי
  choice: एल्कोशी
  rationale: संज्ञावाचक विशेषण नहूम को एल्कोश के मूल निवासी या उससे संबद्ध व्यक्ति के रूप में पहचानता है; संक्षिप्त मूल रूप को बनाए रखा गया है।
theological_decisions:
- issue: शीर्षक में दो संज्ञात्मक खंडों का परस्पर संबंध
  choice: 'दो छोटे शीर्षक-वाक्य: ‘नीनवे के विषय में भविष्यवाणी। एल्कोशी नहूम के दर्शन की पुस्तक।’'
  alternative: 'एक ही शीर्षक-पंक्ति: ‘नीनवे की भविष्यवाणी, एल्कोशी नहूम के दर्शन की पुस्तक।’'
  rationale: इब्रानी में दो परस्पर संबद्ध शीर्षकीय खंड हैं। उन्हें दो वाक्यों में रखना संरचना को स्पष्ट करता है और ‘नीनवे की’ से उत्पन्न यह संभावित भ्रम टालता है कि नीनवे संदेश का स्रोत है; ‘के विषय में’ उसे संदेश का विषय बताता है।
- issue: מַשָּׂא का भविष्यसूचक अर्थ
  choice: मुख्य पाठ में ‘भविष्यवाणी’, साथ में ‘भार’ और ‘घोषणा’ के विकल्प
  alternative: मुख्य पाठ में ‘भार’ या ‘घोषणा’
  rationale: शब्द में गंभीर अथवा बोझिल संदेश की छाया हो सकती है, पर भविष्यसूचक शीर्षक में इसका कार्य एक अधिकारपूर्ण संदेश को नाम देना है। हिन्दी में शाब्दिक ‘भार’ अस्पष्ट होगा, जबकि केवल ‘घोषणा’ भविष्यसूचक संदर्भ को कम स्पष्ट कर सकती है। पादटिप्पणी वास्तविक शब्दार्थ-विस्तार को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भविष्यसूचक शीर्षक। ‘एल्कोशी’ मूल के जातिवाचक/स्थान-संबंधी रूप को बनाए रखता है; इसे व्याख्यात्मक रूप से ‘एल्कोश का निवासी’ नहीं बनाया गया।
