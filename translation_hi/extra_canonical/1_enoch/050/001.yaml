  text: And in those days a change shall come for the holy ones and the chosen ones[a][b].
translation:
  language: hi
  text: और उन दिनों पवित्र जनों और चुने हुओं के लिए एक परिवर्तन होगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक पलटाव होगा।”
    reason: मूल संज्ञा परिवर्तन, मुड़ने या दशा पलटने का भाव व्यक्त कर सकती है।
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: उन दिनों
  rationale: यह प्रकाशन-साहित्य में समय बताने वाला प्रचलित सूत्र है; ‘दिनों’ मूल की पुनरावृत्त अभिव्यक्ति को बनाए रखता है।
- source_word: ሚጠት
  choice: परिवर्तन
  rationale: यह संज्ञा मुड़ने, बदलने या दशा पलटने के अर्थ-क्षेत्र से जुड़ी है। इसलिए ‘परिवर्तन’ उपयुक्त है; ‘दया’ अर्थ की दृष्टि से सही नहीं है।
- source_word: ትከውን
  choice: होगा
  rationale: सामान्य क्रिया ‘होना/हो जाना’ को स्वाभाविक भविष्यकाल में व्यक्त करता है और परिवर्तन के घटित होने का भाव बनाए रखता है।
- source_word: ለቅዱሳን
  choice: पवित्र जनों के लिए
  rationale: यह अभिषिक्त या पवित्र व्यक्तियों को सूचित करता है; ‘पवित्र जन’ आधुनिक हिन्दी में स्पष्ट है और बाद की संस्थागत धारणाएँ नहीं जोड़ता।
- source_word: ወለኅሩያን
  choice: और चुने हुओं के लिए
  rationale: हनोक-साहित्य की प्रमुख पदवी को सरल और स्वाभाविक हिन्दी में व्यक्त करता है, बिना किसी परवर्ती सम्प्रदायगत अर्थ को आरोपित किए।
theological_decisions:
- issue: ሚጠት को ‘दया’ अथवा ‘अनुग्रह’ मानना
  choice: परिवर्तन
  alternative: पलटाव
  rationale: मूल शब्द का अर्थ परिवर्तन या मुड़ना है, दया नहीं। यह चयन न्याय के प्रसंग में दशा बदलने की संभावना को खुला रखता है और बाद का धर्मवैज्ञानिक आशय नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पवित्र जन’ और ‘चुने हुए’ पारदर्शी पद हैं; वाक्य मूल की संक्षिप्त भविष्यवाणी-संबंधी शैली बनाए रखता है।
