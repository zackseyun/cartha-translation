base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/003.yaml
  text: And before the sun and the signs were created[a], before the stars of heaven were made[c][b], his name was called before the Lord of Spirits.
translation:
  language: hi
  text: और सूर्य तथा चिह्नों के रचे जाने से पहले, आकाश के तारों के बनाए जाने से पहले, आत्माओं के प्रभु के सामने[a] उसका नाम पुकारा गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आत्माओं के प्रभु की उपस्थिति में।” मूल गीज़ पद का अर्थ किसी के सामने अथवा उसकी उपस्थिति में होना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ዘእንበለ / እንበለ
  choice: …से पहले
  rationale: दोनों पदबंध समय की पूर्वता बताते हैं और सृष्टि से पहले की दो समानांतर उपवाक्य-रचनाओं को स्पष्ट रखते हैं।
- source_word: ትትፈጠር
  choice: रचे जाने
  rationale: निष्क्रिय सृष्टि-वाचक अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ፀሐይ ወታእምር
  choice: सूर्य तथा चिह्नों
  rationale: गीज़ वाक्य-विन्यास के अनुसार ‘सूर्य’ और ‘चिह्न’ पहले क्रिया-पद के संयुक्त कर्ता हैं; ‘चिह्नों’ को अगले पद ‘आकाश के तारों’ से नहीं जोड़ा गया।
- source_word: ይትገበሩ
  choice: बनाए जाने
  rationale: निष्क्रिय रूप और पहले सृष्टि-वाचक पद के साथ समानांतरता बनाए रखता है।
- source_word: ከዋክብተ ሰማይ
  choice: आकाश के तारों
  rationale: मूल संबंधवाचक संरचना का सहज हिन्दी रूप है।
- source_word: ስሙ ተጸውዐ
  choice: उसका नाम पुकारा गया था
  rationale: पुल्लिंग एकवचन सर्वनाम को बनाए रखता है और क्रिया में नामकरण अथवा उद्घोषणा—दोनों संभावित भावों को अनावश्यक रूप से सीमित नहीं करता।
- source_word: በቅድመ
  choice: के सामने
  rationale: यहाँ स्थानिक और राज-दरबारी उपस्थिति का भाव है; इसे तीसरी बार कालवाचक ‘पहले’ कहना हिन्दी में भ्रम पैदा करता।
- source_word: እግዚአ መናፈስት
  choice: आत्माओं के प्रभु
  rationale: हनोक की दृष्टांत-संबंधी सामग्री में प्रयुक्त स्थापित उपाधि का सीधा और गरिमापूर्ण अनुवाद है।
theological_decisions:
- issue: ‘उसका नाम’ में निहित पुरुष की पहचान
  choice: केवल ‘उसका’ रखा गया; कोई व्याख्यात्मक उपाधि नहीं जोड़ी गई।
  alternative: उसे स्पष्ट रूप से ‘चुना हुआ’ या ‘मनुष्य का पुत्र’ कहना।
  rationale: आसपास का प्रसंग उस महिमामय पुरुष की ओर संकेत करता है, पर इस पद में केवल पुल्लिंग सर्वनाम है। निहित संदर्भ और धर्मवैचारिक तनाव को सुरक्षित रखने के लिए पहचान स्पष्ट नहीं की गई।
- issue: नाम पुकारे जाने का अर्थ
  choice: ‘उसका नाम पुकारा गया था’
  alternative: ‘उसका नाम रखा गया था’
  rationale: मूल क्रिया नामकरण, पुकारे जाने या उद्घोषणा का भाव दे सकती है; ‘पुकारा गया’ इस दायरे को अधिक खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। दो सृष्टि-पूर्व कालवाचक उपवाक्यों की समानांतरता सुरक्षित है। ‘समक्ष’ की अपेक्षा अधिक सर्वसुलभ ‘सामने’ चुना गया, जबकि पादटिप्पणी में उपस्थिति का औपचारिक भाव स्पष्ट किया गया है।
