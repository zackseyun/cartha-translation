base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/007.yaml
  text: And the wisdom of the Lord of Spirits has revealed him to the holy and to the righteous[a]; for they have kept the portion of the righteous, because they hated and despised this world of unrighteousness, and they hated all its works and its ways in the name of the Lord of Spirits. For by his name they are saved[d][c][b], and by his good pleasure their life came to be.
translation:
  language: hi
  text: और आत्माओं के प्रभु की बुद्धि ने पवित्र जनों[a] और धर्मियों को उसे प्रकट किया है; क्योंकि उन्होंने धर्मियों का भाग[b] सुरक्षित रखा है। उन्होंने इस अधर्ममय संसार से घृणा की है और उसे तुच्छ जाना है, और आत्माओं के प्रभु के नाम में उसके सभी कामों और उसके मार्गों से घृणा की है। क्योंकि उसके नाम से उनका उद्धार होता है[c], और उसकी इच्छा से उनका जीवन अस्तित्व में आया[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्र लोगों’। गीज़ का बहुवचन उन लोगों को सामूहिक रूप से दर्शाता है जो पवित्र ठहराए गए हैं।
    reason: lexical_alternative
  - marker: b
    text: ‘धर्मियों का भाग’ से उनका हिस्सा, नियत अंश या उत्तराधिकार अभिप्रेत हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘उसके नाम से उनका उद्धार होगा।’ क्रिया सामान्य वर्तमान सत्य अथवा भावी उद्धार की ओर संकेत कर सकती है।
    reason: textual_ambiguity
  - marker: d
    text: या ‘उसकी इच्छा से उनका जीवन स्थापित हुआ।’ अंतिम वाक्य धर्मियों के जीवन को आत्माओं के प्रभु की इच्छा पर निर्भर बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ከሠተ
  choice: प्रकट किया है
  rationale: क्रिया सक्रिय है और ‘खोलना/प्रकट करना’ व्यक्त करती है; इसका कर्ता ‘आत्माओं के प्रभु की बुद्धि’ है। पुल्लिंग कर्म-सर्वनाम का अनुवाद ‘उसे’ रखा गया है, यद्यपि उसका स्पष्ट पूर्वपद इस पद से पहले आता है।
- source_word: ቅዱሳን
  choice: पवित्र जनों
  rationale: यह सामूहिक रूप से परमेश्वर के लिए अलग किए गए लोगों को दर्शाता है। ‘संतों’ की अपेक्षा ‘पवित्र जनों’ में बाद की संस्थागत ध्वनि कम है।
- source_word: ጻድቃን
  choice: धर्मियों
  rationale: हनोक के साहित्य में यह एक प्रमुख नैतिक और प्रलय-संबंधी वर्ग है; ‘धर्मी’ आधुनिक हिन्दी में स्वाभाविक और सुसंगत है।
- source_word: ዐቀቡ
  choice: बनाए रखा है
  rationale: क्रिया रखने, सुरक्षित रखने या संभाले रहने का भाव देती है। यहाँ ‘बनाए रखा’ हिन्दी में स्वाभाविक है और वफादारी का स्थायी परिणाम व्यक्त करता है।
- source_word: ክፍሎሙ
  choice: भाग
  rationale: शब्द हिस्से, नियत अंश या उत्तराधिकार का संकेत दे सकता है। ‘भाग’ इस अर्थ-क्षेत्र को खुला रखता है और ‘नियत हिस्सा’ जैसी अतिव्याख्या से बचता है।
- source_word: ዘዓመፃ
  choice: अधर्ममय
  rationale: यह संसार को नैतिक अन्याय या अधर्म से चिह्नित करता है। ‘अधर्ममय संसार’ धर्मियों के साथ मूल पाठ का नैतिक विरोध बनाए रखता है।
- source_word: ምግባሮ
  choice: कामों
  rationale: कर्मों अथवा आचरण का सामान्य अर्थ है; ‘मार्गों’ के साथ मिलकर मूल की दोहरी अभिव्यक्ति बनी रहती है।
- source_word: ፍናዊሁ
  choice: मार्गों
  rationale: यह रास्ते, चाल या जीवन-पद्धति को दर्शाता है। ‘मार्ग’ नैतिक पथ की छवि सुरक्षित रखता है।
- source_word: በስሙ
  choice: नाम में / नाम से
  rationale: पहली occurrence में निष्ठा अथवा अधिकार का भाव ‘नाम में’ से और उद्धार के आधार का भाव दूसरी occurrence में ‘नाम से’ से स्वाभाविक रूप से व्यक्त होता है; दोनों में मूल पूर्वसर्ग की व्यापकता बनी रहती है।
- source_word: ይድኅኑ
  choice: उनका उद्धार होता है
  rationale: रूप सामान्य या वर्तमान सत्य व्यक्त कर सकता है, जबकि भविष्यगत संकेत भी संभव है। मुख्य पाठ वर्तमान सामान्य कथन रखता है और पादटिप्पणी भविष्य विकल्प बताती है।
- source_word: በፈቃዱ
  choice: उसकी इच्छा से
  rationale: यह प्रभु की इच्छा, अभिलाषा या प्रसन्न उद्देश्य का द्योतक है। ‘इच्छा’ स्पष्ट और तटस्थ है तथा अनावश्यक सिद्धान्तगत विस्तार नहीं जोड़ती।
- source_word: ኮነ፡ ሕይወቶሙ
  choice: उनका जीवन अस्तित्व में आया
  rationale: शाब्दिक बनने/होने का भाव सुरक्षित है। इसे केवल ‘स्थापित हुआ’ कहना संभव है, पर वह मूल की व्यापक अभिव्यक्ति को कुछ संकुचित कर सकता है।
theological_decisions:
- issue: उद्धार वर्तमान, भविष्य या सामान्य सत्य है
  choice: उसके नाम से उनका उद्धार होता है
  alternative: उसके नाम से उनका उद्धार होगा
  rationale: गीज़ रूप सामान्य वर्तमान सत्य और भावी उद्धार—दोनों की ओर संकेत कर सकता है। मुख्य पाठ सामान्य कथन रखता है और पादटिप्पणी भावी पाठ की संभावना सुरक्षित रखती है।
- issue: ‘धर्मियों का भाग’ का आशय
  choice: धर्मियों का भाग
  alternative: धर्मियों का नियत हिस्सा अथवा उत्तराधिकार
  rationale: पद हिस्सा, भाग्य में मिला अंश या उत्तराधिकार सूचित कर सकता है। केवल ‘उत्तराधिकार’ चुनना अनिश्चित अर्थ को आवश्यकता से अधिक निश्चित कर देता।
- issue: अंतिम वाक्य में जीवन और ईश्वरीय इच्छा का संबंध
  choice: उसकी इच्छा से उनका जीवन अस्तित्व में आया
  alternative: उसकी इच्छा से उनका जीवन स्थापित हुआ
  rationale: मूल जीवन के होने को प्रभु की इच्छा पर निर्भर बताता है, पर यह स्पष्ट नहीं करता कि अभिप्राय सृष्टि, संरक्षण या स्थापना में से कौन-सा है। इसलिए व्यापक अभिव्यक्ति मुख्य पाठ में रखी गई है।
- issue: बुद्धि ने किसे प्रकट किया
  choice: उसे
  alternative: उस व्यक्ति को, जिसका उल्लेख पिछले प्रसंग में है
  rationale: मूल में कर्म का पुल्लिंग सर्वनाम है, पर इस पद में उसका पूर्वपद नहीं दिया गया। ‘उसे’ पूर्ववर्ती संदर्भ पर निर्भर मूल संरचना और उसकी अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सहज शैली अपनाई गई है। ‘आत्माओं का प्रभु’, ‘धर्मी’, ‘अधर्ममय संसार’ और ‘उद्धार’ जैसे मुख्य हनोकी पद सुसंगत रखे गए हैं। वाक्य-विन्यास को हिन्दी-पठनीय बनाया गया है, पर ‘उसे’, ‘भाग’, उद्धार के काल और अंतिम वाक्य की अर्थगत अनिश्चितता को पादटिप्पणियों सहित सुरक्षित रखा गया है।
