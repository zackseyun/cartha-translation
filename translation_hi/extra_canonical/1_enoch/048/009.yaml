base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/009.yaml
  text: And into the hands of my chosen ones I will deliver them[a], and like straw in the fire, so they will burn before the face of the holy ones; and like lead in water, they will sink before the face of the righteous[e][d][c][b], and no trace will be found for them.
translation:
  language: hi
  text: और मैं उन्हें अपने चुने हुओं के हाथों में सौंप दूँगा[a]; जैसे आग में भूसा[b], वैसे ही वे पवित्र जनों के सामने जलेंगे; और जैसे पानी में सीसा डूबता है, वैसे ही वे धर्मियों के सामने डूब जाएँगे, और उनका कोई निशान नहीं मिलेगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने चुने हुओं के हाथों में”; इसका आशय न्याय के समय उनके अधिकार में सौंपना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “सूखी घास”; यहाँ शीघ्र जल जाने वाले वनस्पति-पदार्थ का बिंब है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात उनका कोई चिह्न या अवशेष नहीं बचेगा।
    reason: lexical_clarification
lexical_decisions:
- source_word: ውስተ፡ እዴሆሙ፡ ለኅሩያን፡ ዚአየ
  choice: अपने चुने हुओं के हाथों में
  rationale: वाक्यांश में हाथ का ठोस बिंब है और ዚአየ का अर्थ यहाँ ‘मेरे/अपने’ है। हिन्दी में ‘हाथों में’ रखने से न्याय के लिए उनके अधिकार में दिए जाने का भाव निहित रहता है, पर उसे व्याख्यात्मक रूप से थोपा नहीं जाता।
- source_word: እወድዮሙ
  choice: मैं उन्हें … सौंप दूँगा
  rationale: यह प्रथम पुरुष एकवचन का अपूर्ण/भावी क्रियारूप है, जिसका अर्थ ‘मैं उन्हें दे दूँगा/सौंप दूँगा’ है; इसे ‘मैंने देखा’ समझना रूपगत रूप से उचित नहीं है।
- source_word: ኅሩያን
  choice: चुने हुए
  rationale: यह प्रकाशनात्मक साहित्य में एक समूह-संज्ञा है। ‘चुने हुए’ सहज आधुनिक हिन्दी है और किसी बाद की विशिष्ट धर्मशास्त्रीय शब्दावली को नहीं थोपता।
- source_word: ከመ፡ ሣዕር፡ ውስተ፡ እሳት፡ ከመዝ
  choice: जैसे आग में भूसा, वैसे ही
  rationale: दोनों तुलना-सूचक पदों की परस्पर संरचना को ‘जैसे…वैसे ही’ से व्यक्त किया गया है। ‘भूसा’ शीघ्र जल जाने वाले सूखे वनस्पति-पदार्थ का स्पष्ट और स्वाभाविक बिंब देता है।
- source_word: ይውዕዩ
  choice: वे … जलेंगे
  rationale: अपूर्ण क्रियारूप भावी न्याय को सूचित करता है। ‘जलेंगे’ प्रत्यक्ष अग्नि-बिंब बनाए रखता है और ‘भस्म हो जाएँगे’ जैसी अतिरिक्त परिणति नहीं जोड़ता।
- source_word: እምቅድመ፡ ገጸ፡ ቅዱሳን
  choice: पवित्र जनों के सामने
  rationale: मूल मुहावरा शाब्दिक रूप से ‘पवित्र जनों के मुख के सामने’ है। हिन्दी में ‘के सामने’ उसी उपस्थिति-संबंधी अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ዐረር፡ ውስተ፡ ማይ
  choice: पानी में सीसा
  rationale: विशिष्ट भारी धातु ‘सीसा’ को बनाए रखने से तेजी और निश्चितता से डूबने का बिंब सुरक्षित रहता है।
- source_word: ይሠጠሙ
  choice: डूब जाएँगे
  rationale: क्रिया डूबने अथवा जलमग्न होने को बताती है। भावी काल और विनाशकारी परिणाम दोनों हिन्दी में सहज रूप से व्यक्त होते हैं।
- source_word: ጻድቃን
  choice: धर्मी
  rationale: यह निर्दोष ठहराए गए समुदाय के लिए प्रचलित पद है। ‘धर्मी’ आधुनिक बाइबलीय हिन्दी में स्पष्ट और संक्षिप्त है।
- source_word: አሰር
  choice: निशान
  rationale: समापन में पूर्ण लोप का भाव है—उनका कोई चिह्न अथवा अवशेष नहीं मिलेगा। ‘निशान’ सामान्य पाठक के लिए स्पष्ट है और मूल अर्थ-सीमा के भीतर रहता है।
theological_decisions:
- issue: ‘चुने हुओं के हाथों में’ का अर्थ स्थानगत बिंब है या न्यायिक अधिकार
  choice: हाथ का मूल बिंब रखते हुए ‘सौंप दूँगा’ कहा गया है
  alternative: ‘चुने हुओं के अधिकार में कर दूँगा’ अथवा ‘चुने हुओं के हाथों दंड दिलाऊँगा’
  rationale: मूल पाठ हाथों की भाषा का प्रयोग करता है और सौंपे जाने का भाव देता है, पर चुने हुए स्वयं किस प्रकार न्याय लागू करेंगे यह स्पष्ट नहीं करता। इसलिए न्यायिक अधिकार की सम्भावना खुली रखी गई है।
- issue: ‘पवित्र जन’ और ‘धर्मी’ एक ही समुदाय हैं या अलग समूह
  choice: दोनों पदों को अलग-अलग समूह-संज्ञाओं के रूप में ज्यों का त्यों रखा गया है
  alternative: दोनों को एक ही मानव समुदाय मानना, अथवा ‘पवित्र जनों’ को स्वर्गदूत और ‘धर्मियों’ को मनुष्य मानना
  rationale: पद समानांतर हैं, पर मूल पाठ उनकी सटीक पहचान नहीं बताता। अनुवाद इस धर्मशास्त्रीय अस्पष्टता का निर्णय नहीं करता।
- issue: क्रियाओं का काल
  choice: भावी न्याय के रूप में ‘सौंप दूँगा’, ‘जलेंगे’, ‘डूब जाएँगे’ और ‘नहीं मिलेगा’
  alternative: दर्शन में पहले से घटित घटना के रूप में भूतकाल
  rationale: गीज़ के अपूर्ण क्रियारूप और निकटवर्ती प्रलय-विषयक संदर्भ भावी अर्थ का समर्थन करते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर न्याय-दृश्य की गरिमा और काव्यात्मक समानांतरता बनाए रखी गई है। ‘जैसे…वैसे ही’ से गीज़ की तुलना-संरचना स्पष्ट की गई है। ‘मुख के सामने’ के अत्यधिक शाब्दिक रूप के बदले स्वाभाविक ‘के सामने’ चुना गया है।
