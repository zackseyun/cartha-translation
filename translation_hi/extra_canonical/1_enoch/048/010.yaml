lexical_decisions:
- source_word: በዕለተ
  choice: के दिन
  rationale: काल-सूचक पदबंध को स्वाभाविक हिन्दी में रखते हुए मूल के सर्वनाश-संबंधी समय-संकेत को बनाए रखता है।
- source_word: ጻሕበ
  choice: दुःख
  rationale: यह शब्द दबाव, कष्ट या विपत्ति का बोध कराता है। ‘दुःख’ आधुनिक पाठकों के लिए सहज है और किसी तकनीकी युगांत-संबंधी अर्थ को आरोपित नहीं करता।
- source_word: ዚአሆሙ
  choice: उनके
  rationale: सम्बन्धवाचक सर्वनाम पूर्ववर्ती समूह की ओर संकेत करता है; हिन्दी में स्वाभाविक अधिकार-सूचक रूप।
- source_word: ዕረፍት
  choice: विश्राम
  rationale: मूल अर्थ रुकने, चैन या विश्रांति का है। ‘विश्राम’ यह खुला रखता है कि बात राहत, शांति या न्याय के बाद ठहराव की है।
- source_word: ትከውን
  choice: होगा
  rationale: अस्तित्व अथवा घटित होने वाले भाव को सीधे दर्शाता है; अधिक घटनात्मक अनुवाद ‘आएगा’ भी सम्भव है।
- source_word: ዲበ ምድር
  choice: पृथ्वी पर
  rationale: इस सर्वनाश-संबंधी प्रसंग में व्यापक भौतिक संसार का अर्थ स्वाभाविक है; ‘देश में’ अनावश्यक रूप से दायरा संकरा कर सकता है।
theological_decisions:
- issue: ‘विश्राम’ का दायरा और अभिप्राय
  choice: पृथ्वी पर होने वाला सामान्य सर्वनाश-संबंधी विश्राम
  alternative: विशेष रूप से धर्मियों को राहत; न्याय के बाद ठहराव; देश में शांति
  rationale: संक्षिप्त वाक्य यह नहीं बताता कि विश्राम के लाभार्थी कौन हैं या उसका ठीक स्वरूप क्या है; अनुवाद इस अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और संक्षिप्त रखी गई है। ‘दुःख’ सामान्य पाठक के लिए बोधगम्य है, जबकि ‘विश्राम’ मूल की अर्थगत और धर्मवैचारिक खुलावट बनाए रखता है।
