base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/002.yaml
  text: And at that hour that Son of Man was named in the presence of the Lord of Spirits[b][a], and his name was before the Head of Days.
translation:
  language: hi
  text: और उस घड़ी उस मनुष्य-पुत्र का नाम आत्माओं के प्रभु की उपस्थिति में रखा गया[a], और उसका नाम दिनों के प्रधान के सामने था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पुकारा गया।’ मूल की निष्क्रिय क्रिया नाम दिए जाने, पदनाम से पुकारे जाने या बुलाए जाने का भाव दे सकती है; अगली पंक्ति में ‘उसका नाम’ आने के कारण यहाँ ‘नाम रखा गया’ अपनाया गया है।
    reason: lexical_alternative
  - marker: b
    text: ‘दिनों के प्रधान’ इस खंड में प्रयुक्त एक विशिष्ट ईश्वरीय उपाधि का अपेक्षाकृत शाब्दिक अनुवाद है। मूल में ‘शिर/प्रधान’ और ‘दिनों’ की छवि है; इसे किसी अधिक परिचित उपाधि से बदलकर वह छवि मिटाई नहीं गई है।
    reason: cultural_note
lexical_decisions:
- source_word: በይእቲ ሰዓት
  choice: उस घड़ी
  rationale: मूल के विशिष्ट और गंभीर काल-सूचक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ተጸውዐ
  choice: नाम रखा गया
  rationale: निष्क्रिय क्रिया यहाँ नामकरण या पदनाम दिए जाने का संकेत देती है; अगली उपवाक्य में ‘उसका नाम’ आने से यह चयन संदर्भानुकूल है।
- source_word: ወልደ ሰብእ ዝኩ
  choice: उस मनुष्य-पुत्र
  rationale: दूरवाची संकेतवाचक किसी पहले से दृष्टिगोचर विशिष्ट व्यक्ति की ओर इंगित करता है; ‘मनुष्य-पुत्र’ पदवी-सदृश बल को सुरक्षित रखता है।
- source_word: በኀበ እግዚአ መናፈስት
  choice: आत्माओं के प्रभु की उपस्थिति में
  rationale: स्वर्गीय प्रभु के सम्मुख निकटता और राजदरबारी दृश्य—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ስሙ
  choice: उसका नाम
  rationale: मूल में ‘नाम’ की अर्थपूर्ण पुनरावृत्ति को बनाए रखता है।
- source_word: መቅድመ
  choice: के सामने था
  rationale: उपस्थिति, अग्रता अथवा पूर्व-अस्तित्व की सम्भावित अर्थ-छायाओं को किसी एक अर्थ में सीमित नहीं करता।
- source_word: ርእሰ መዋዕል
  choice: युगों के शिरोमणि
  rationale: विशिष्ट ईश्वरीय उपाधि की ‘शिर/प्रधान’ संबंधी छवि को रखते हुए हिन्दी में गरिमापूर्ण और बोधगम्य रूप देता है।
theological_decisions:
- issue: ወልደ ሰብእ को सामान्य मानवीय अभिव्यक्ति मानें या विशिष्ट पदवी
  choice: उस मनुष्य-पुत्र
  alternative: उस मनुष्य को / उस मनुष्य के पुत्र को
  rationale: दृष्टान्तों के इस प्रसंग में संकेतवाचक शब्द एक विशिष्ट, महिमामय अंतकालीन व्यक्ति की ओर इंगित करता है। अनुवाद स्थानीय पदवी-सदृश बल रखता है, पर बाद की ईसाई शब्दावली से अतिरिक्त अर्थ आरोपित नहीं करता।
- issue: ‘उसका नाम युगों के शिरोमणि के सामने था’ में पूर्व-अस्तित्व का संकेत
  choice: के सामने था
  alternative: के सामने उसका नाम रखा गया था / अनादि काल से उनके सामने था
  rationale: मूल कथन संक्षिप्त है और उपस्थिति, अग्रता या पूर्व-अस्तित्व की ओर संकेत कर सकता है। मुख्य पाठ इस धर्मवैचारिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सर्वसुलभ और प्रकाशन-योग्य शैली। वाक्य की पुनरावृत्ति तथा मूल की संक्षिप्त धर्मवैचारिक अस्पष्टता सुरक्षित रखी गई है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
