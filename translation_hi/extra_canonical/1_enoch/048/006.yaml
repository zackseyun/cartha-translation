base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/006.yaml
  text: For this reason[a], he was chosen and hidden before him before the world was created[c][b], and forever.
translation:
  language: hi
  text: इसी कारण वह उसके सामने[a] चुना हुआ और छिपा हुआ था—संसार[b] की सृष्टि होने से पहले से लेकर सदा तक।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसकी उपस्थिति में।’ यहाँ ‘उसके’ का संकेत सम्भवतः परमेश्वर की ओर है, पर मूल पाठ सर्वनाम का नाम लेकर अर्थ स्पष्ट नहीं करता।
    reason: lexical_alternative
  - marker: b
    text: मूल शब्द का अर्थ प्रसंग के अनुसार ‘युग’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: अधिक शाब्दिक रूप में, ‘अनन्तकाल तक’ या ‘युग तक।’
    reason: lexical_alternative
lexical_decisions:
- source_word: በእንተዝ
  choice: इसी कारण
  rationale: यह पद पिछले कथन का आधार बताता है। ‘इसी कारण’ कारणसूचक बल को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ኮነ
  choice: था
  rationale: ‘चुना हुआ’ और ‘छिपा हुआ’ के साथ यह क्रिया यहाँ मुख्यतः अवस्थासूचक है; इसलिए ‘था’ स्वाभाविक है, जबकि ‘हो गया’ अनावश्यक रूप से परिवर्तन का भाव ला सकता है।
- source_word: ኅሩየ
  choice: चुना हुआ
  rationale: यह किसी को दिव्य निर्णय से अलग ठहराए जाने का सामान्य प्रकाशन-साहित्यिक पद है। यह अनुवाद स्पष्ट है और बाद की पारिभाषिक धर्मशास्त्रीय भाषा नहीं थोपता।
- source_word: ወኅቡአ
  choice: और छिपा हुआ
  rationale: यह ‘चुना हुआ’ के समानांतर अवस्थासूचक पद को बनाए रखता है और उस व्यक्ति के नियत समय तक प्रकट न किए जाने के भाव को व्यक्त करता है।
- source_word: በቅድሜሁ
  choice: उसके सामने
  rationale: यह मूल के स्थानिक-संबंधपरक रूप को बनाए रखता है। सर्वनाम का संकेत स्वाभाविक रूप से परमेश्वर की ओर समझा जा सकता है, पर अनुवाद उसे स्पष्ट करके मूल की अस्पष्टता समाप्त नहीं करता।
- source_word: ዘእንበለ ይትፈጠር ዓለም
  choice: संसार की सृष्टि होने से पहले
  rationale: यह उपवाक्य सृष्टि से पूर्व की कालिक प्राथमिकता बताता है। यहाँ ዓለም के लिए ‘संसार’ प्रसंगानुकूल है, यद्यपि शब्द का अर्थ कुछ प्रसंगों में ‘युग’ भी हो सकता है।
- source_word: ወእስከ ለዓለም
  choice: लेकर सदा तक
  rationale: ‘पहले से लेकर सदा तक’ हिन्दी में पूरे कालिक विस्तार को सहजता से जोड़ता है और मूल के स्थायी-अवधि वाले भाव को बनाए रखता है।
theological_decisions:
- issue: क्या पद को बाद की स्पष्ट मसीह-विषयक पूर्व-अस्तित्व की पारिभाषिक भाषा में अनूदित किया जाए
  choice: 'स्थानीय प्रकाशन-साहित्यिक भाषा को बनाए रखना: ‘उसके सामने चुना हुआ और छिपा हुआ था’'
  alternative: ‘परमेश्वर के साथ पहले से विद्यमान था’ या ‘अनादि काल से पूर्वनियत था’
  rationale: पद उस व्यक्ति के सृष्टि-पूर्व चुने और छिपे होने का प्रबल दावा करता है, पर स्पष्ट रूप से बाद की धर्मशास्त्रीय पारिभाषिक शब्दावली का प्रयोग नहीं करता। इसलिए अनुवाद दावे को बनाए रखता है, पर उसका अतिरिक्त सिद्धान्तीकरण नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। ‘उसके सामने’ मूल की संबंधपरक अस्पष्टता बचाता है; डैश सृष्टि-पूर्व से अनन्त भविष्य तक के कालिक विस्तार को स्पष्ट करता है।
