base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/001.yaml
  text: In that place I saw the spring of righteousness[a], which is inexhaustible, and around it were many springs of wisdom. And all the thirsty drank from them and were filled with wisdom[f][e][d][c][b], and their dwelling was with the righteous and the holy and the chosen.
translation:
  language: hi
  text: उस स्थान पर मैंने धार्मिकता का एक ऐसा सोता देखा जो कभी चुकता नहीं था। बुद्धि के बहुत-से सोते उसे चारों ओर से घेरे हुए थे।[a] सभी प्यासों ने उनमें से पिया और वे बुद्धि से भर गए। उनका निवास धर्मियों, पवित्र जनों और चुने हुओं के साथ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस बिंदु पर इथियोपिक पाठ कठिन है और ‘चारों ओर’ से संबंधित रूप दोहराया गया है। संभवतः आशय यह है कि बुद्धि के बहुत-से सोते धार्मिकता के सोते को चारों ओर से घेरे हुए थे।
    reason: textual_variant
lexical_decisions:
- source_word: መካን
  choice: स्थान
  rationale: यह सामान्य स्थानवाचक शब्द है; ‘स्थान’ दर्शन के परिवेश को बनाए रखता है और अनावश्यक भौगोलिक विशिष्टता नहीं जोड़ता।
- source_word: ነቅዐ / አንቅዕተ
  choice: सोता / सोते
  rationale: यह पीने योग्य जल-स्रोत की सजीव छवि रखता है और एकवचन तथा बहुवचन के बीच समानता बनाए रखता है।
- source_word: ጽድቅ
  choice: धार्मिकता
  rationale: यह नैतिक और युगांत-संबंधी अर्थ को व्यक्त करता है तथा ‘धर्मी’ से शब्दगत संबंध बनाए रखता है।
- source_word: ዘኢይትኄለቍ
  choice: जो कभी चुकता नहीं था
  rationale: सोते के संदर्भ में यह उसकी अथाह, अक्षय प्रचुरता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: አውዳ፡ የአውዳ
  choice: उसे चारों ओर से घेरे हुए थे
  rationale: कठिन और संभवतः दूषित पाठ में चारों ओर होने के साथ सक्रिय रूप से घेरने का भाव भी दिखाई देता है; यह अनुवाद दोनों संकेतों को समेटता है।
- source_word: ጥበብ
  choice: बुद्धि
  rationale: यह मानक अर्थ है और पीने तथा भर जाने की ज्ञानपरक-दर्शनात्मक छवि को बनाए रखता है।
- source_word: ጽሙኣን
  choice: सभी प्यासों
  rationale: मूल की ठोस संज्ञात्मक छवि को बिना उसका रूपक स्पष्ट करके सीमित किए सुरक्षित रखता है।
- source_word: ይሰትዩ፡ ወይትመልኡ
  choice: पिया और वे बुद्धि से भर गए
  rationale: दर्शन के घटनाक्रम को सहज हिन्दी भूतकाल में रखता है और भर दिए जाने के परिणामात्मक भाव को सुरक्षित रखता है।
- source_word: ማኅደሪሆሙ
  choice: उनका निवास
  rationale: स्थायी वास और संगति, दोनों के भाव के अनुकूल एक स्वाभाविक और गरिमापूर्ण शब्द।
- source_word: ጻድቃን፡ ወቅዱሳን፡ ወኅሩያን
  choice: धर्मियों, पवित्र जनों और चुने हुओं
  rationale: तीन समानांतर समूहों या उपाधियों को बनाए रखता है; ‘पवित्र जन’ स्पष्ट करता है कि संकेत व्यक्तियों की ओर है, जबकि ‘चुने हुए’ बाद की पारिभाषिक भाषा थोपने से बचता है।
theological_decisions:
- issue: अंतिम तीन समूहों को बाद की पारंपरिक धार्मिक शब्दावली में प्रस्तुत करना या मूल की समानांतर उपाधियाँ बनाए रखना
  choice: धर्मियों, पवित्र जनों और चुने हुओं
  alternative: न्यायियों, संतों और निर्वाचितों
  rationale: चुना गया रूप तीनों पदों का सामूहिक और युगांत-संबंधी स्वर बनाए रखता है, पर बाद की कलीसियाई या सम्प्रदायगत पारिभाषिकता नहीं थोपता।
- issue: जल की छवि की व्याख्या मुख्य पाठ में रूपक के रूप में खोलना
  choice: सोते, प्यासे, पीना और भर जाना—इन प्रत्यक्ष दर्शनात्मक छवियों को बनाए रखना
  alternative: धार्मिकता और बुद्धि प्राप्त करने के अमूर्त कथन में बदल देना
  rationale: मूल का दर्शनात्मक तनाव और काव्यात्मक रूपक स्वयं बोलना चाहिए; मुख्य पाठ में उसकी व्याख्या करके उसे सपाट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और दर्शनात्मक शैली अपनाई गई है। ‘सोता’ सामान्य पाठक के लिए बोधगम्य रहते हुए जल-स्रोत की मूल छवि को बनाए रखता है। वाक्य छोटे रखे गए हैं, पर मूल के समानांतर बिंब और अंतिम त्रयी सुरक्षित हैं।
