base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/005.yaml
  text: And all who dwell upon the dry land shall fall down and bow before him[a], and they shall praise and bless and sing to the Lord of Spirits.
translation:
  language: hi
  text: और सूखी भूमि पर रहनेवाले सभी लोग उसके सामने गिर पड़ेंगे और दण्डवत् करेंगे[a]; वे उसकी स्तुति करेंगे, उसे धन्य कहेंगे और आत्माओं के प्रभु के लिए गीत गाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सूखी भूमि’ का अर्थ यहाँ व्यापक रूप से ‘पृथ्वी’ भी समझा जा सकता है। गीइज़ का शब्दशः भाव ‘सूखी भूमि पर’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወድቁ
  choice: गिर पड़ेंगे
  rationale: यह क्रिया अधीनता या श्रद्धा में गिरने की शारीरिक मुद्रा व्यक्त करती है; ‘गिर पड़ेंगे’ उस दृश्य को बनाए रखता है।
- source_word: ይሰግዱ
  choice: दण्डवत् करेंगे
  rationale: यह झुकने अथवा भूमि तक झुककर सम्मान प्रकट करने का बोध देता है। ‘दण्डवत् करेंगे’ शारीरिक भाव को स्पष्ट रखता है, बिना मुख्य पाठ में केवल ‘आराधना’ जैसा अधिक व्याख्यात्मक शब्द रखने के।
- source_word: ቅድሜሁ
  choice: उसके सामने
  rationale: यह सीधा स्थानवाचक अर्थ है और दर्शन में श्रद्धा के पात्र को संकेतित करता है।
- source_word: ኵሎሙ
  choice: सभी लोग
  rationale: मूल पाठ के सार्वभौमिक विस्तार को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: እለ የኃድሩ ዲበ የብስ
  choice: सूखी भूमि पर रहनेवाले
  rationale: मूल गीइज़ में पृथ्वी के सामान्य शब्द की अपेक्षा ‘सूखी भूमि’ का ठोस बिंब है; इसे मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: ይሴብሕዎ
  choice: वे उसकी स्तुति करेंगे
  rationale: क्रिया के साथ लगे एकवचन कर्म-प्रत्यय को स्पष्ट रूप से रखा गया है; ‘स्तुति’ स्तुतिपरक प्रसंग में स्वाभाविक है।
- source_word: ይባርክዎ
  choice: उसे धन्य कहेंगे
  rationale: ईश्वर या किसी महिमामय व्यक्ति के विषय में हिन्दी में ‘उसे आशीष देंगे’ की अपेक्षा ‘उसे धन्य कहेंगे’ अधिक स्वाभाविक है और मूल के आशीर्वचन का भाव बचाता है।
- source_word: ይዜምሩ
  choice: गीत गाएँगे
  rationale: यह गाकर प्रशंसा करने का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ለእግዚአ መናፈስት
  choice: आत्माओं के प्रभु के लिए
  rationale: यह 1 हनोक में बार-बार आनेवाली दिव्य उपाधि है। सम्बन्धकारक बहुवचन और गीत के प्राप्तकर्ता को यथासंभव स्पष्ट रखा गया है।
theological_decisions:
- issue: अंतिम दिव्य उपाधि से पहले ‘उसके/उसे’ का संदर्भ
  choice: एकवचन सर्वनामों को ज्यों का त्यों रखा गया है, और अंतिम खंड में ‘आत्माओं के प्रभु’ को गीत का स्पष्ट प्राप्तकर्ता बनाया गया है।
  alternative: सभी सर्वनामों और ‘आत्माओं के प्रभु’ को बिना किसी भेद के एक ही व्यक्ति का उल्लेख मानना; अथवा पूरे पद में केवल परमेश्वर को संदर्भित मानना।
  rationale: गीइज़ पाठ पहले एकवचन कर्म-प्रत्ययों का प्रयोग करता है और फिर स्पष्ट उपाधि ‘आत्माओं के प्रभु’ देता है। अनुवाद निकट संदर्भ के महिमामय व्यक्ति और अंतिम दिव्य उपाधि के बीच की धार्मिक-वैचारिक तनावपूर्ण निकटता को मिटाता नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। भविष्यकालीन दर्शनात्मक लय, शारीरिक श्रद्धा की छवि और ‘आत्माओं के प्रभु’ की पारंपरिक अपोकैलिप्टिक उपाधि सुरक्षित रखी गई है।
