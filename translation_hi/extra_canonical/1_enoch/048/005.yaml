  source_fidelity: 'Hindi text accurately represents the Ge''ez sequence: universal subject, dwelling on the dry land, falling and bowing before him, then praising and blessing him and singing to the Lord of Spirits. It appropriately leaves the relationship between the pronoun referent and the explicit final title unresolved.'
