  terminology: ‘आत्माओं के प्रभु’ consistently and transparently renders the recurring title ‘Lord of Spirits.’ ‘सूखी भूमि’ correctly retains the concrete Ge'ez expression rather than prematurely substituting ‘पृथ्वी.’ The footnote is accurately anchored and explains the alternative without overstating it.
