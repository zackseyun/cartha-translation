base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/004.yaml
  text: He will be a staff for the righteous[a], so that they may lean on him and not fall; and he will be the light of the nations[c][b], and he will be hope for those who are troubled in heart.
translation:
  language: hi
  text: वह धर्मियों के लिए एक लाठी होगा[a], ताकि वे उस पर टेक लगाएँ और न गिरें; वह राष्ट्रों की ज्योति होगा[b], और वह उन लोगों के लिए आशा होगा जो अपने हृदय में पीड़ा सहते हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दण्ड।” यहाँ प्रसंग राजकीय अधिकार से अधिक सहारे का बिंब सामने रखता है।
    reason: lexical_alternative
  - marker: b
    text: या, “राष्ट्रों के लिए ज्योति।” मूल वाक्यांश का अर्थ “राष्ट्रों की ज्योति” भी हो सकता है और उसके आशय को “राष्ट्रों के लिए ज्योति” के रूप में भी व्यक्त किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “जो अपने हृदय में दुःख सहते/बीमार हैं।” यहाँ केवल शारीरिक रोग नहीं, भीतरी पीड़ा भी अभिप्रेत हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: በትረ
  choice: लाठी
  rationale: यह ठोस सहारे की वस्तु को दर्शाता है और आगे आने वाले ‘टेक लगाने’ तथा ‘न गिरने’ के बिंब से स्वाभाविक रूप से जुड़ता है। ‘राजदण्ड’ से अनावश्यक राजकीय अर्थ आ सकता था।
- source_word: ለጻድቃን
  choice: धर्मियों के लिए
  rationale: यह बहुवचन वर्ग-संज्ञा का स्वाभाविक हिन्दी रूप है और किसी विशेष संप्रदायगत अर्थ को नहीं जोड़ता।
- source_word: ይትመረጐዙ
  choice: उस पर टेक लगाएँ
  rationale: यह मूल के सहारा लेने वाले सजीव बिंब को बनाए रखता है और अगली क्रिया ‘न गिरें’ के साथ स्पष्ट रूप से जुड़ता है।
- source_word: ወኢይደቁ
  choice: और न गिरें
  rationale: लाठी और टेक लगाने के प्रसंग में ‘गिरना’ सबसे सीधा अर्थ है; ‘ठोकर खाना’ भी संभव है, पर वह सहारे के बिंब को कुछ कम स्पष्ट करता है।
- source_word: ብርሃነ አሕዛብ
  choice: राष्ट्रों की ज्योति
  rationale: यह समास का निकट और गरिमापूर्ण रूप है। ‘राष्ट्रों’ से व्यापक जनसमुदायों का भाव आता है और बाद के यहूदी–गैर-यहूदी धार्मिक वर्गीकरण को अनावश्यक रूप से नहीं थोपा जाता।
- source_word: ተስፋ
  choice: आशा
  rationale: यह शब्द प्रसंग के भविष्यपरक और सांत्वनापूर्ण बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ለእለ የሐምሙ በልቦሙ
  choice: उन लोगों के लिए ... जो अपने हृदय में पीड़ा सहते हैं
  rationale: मूल क्रिया दुःख सहने या बीमार होने दोनों का भाव दे सकती है। हृदय के उल्लेख के कारण हिन्दी में आंतरिक पीड़ा का अर्थ प्रमुख रखते हुए मूल बिंब भी सुरक्षित रखा गया है।
theological_decisions:
- issue: बार-बार आए ውእቱ का संदर्भ
  choice: पूरे पद में व्यक्तिगत सर्वनाम ‘वह’ रखा गया है।
  alternative: हर बार ‘यह व्यक्ति’ कहना या कर्ता को निहित छोड़ना।
  rationale: निकटवर्ती संदर्भ एक विशिष्ट, एकवचन महिमामय व्यक्ति की ओर संकेत करता है। ‘वह’ हिन्दी में स्वाभाविक है, पर बाद की सिद्धान्तगत उपाधियाँ पाठ में नहीं जोड़ता।
- issue: ብርሃነ አሕዛብ का धार्मिक दायरा
  choice: ‘राष्ट्रों की ज्योति’
  alternative: ‘गैर-यहूदियों की ज्योति’ या ‘राष्ट्रों के लिए ज्योति’
  rationale: मूल संरचना ‘राष्ट्रों/जातियों की ज्योति’ के निकट है। ‘गैर-यहूदी’ कहना बाद की धार्मिक श्रेणी को अधिक स्पष्ट कर देता, जबकि मूल की व्यापकता बनाए रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘लाठी—टेक लगाना—न गिरना’ के मूल रूपक को सजीव रखा गया है। ‘ज्योति’ पाठ की काव्यात्मक और प्रकाश-संबंधी भाषा के अनुकूल है, जबकि वाक्यरचना सामान्य पाठक के लिए सीधी रखी गई है।
