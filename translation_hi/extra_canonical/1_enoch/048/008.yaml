base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/008.yaml
  text: In those days the faces of the kings of the earth and the mighty who possess the dry land shall be humbled[a], because of the works of their hands; for on the day of their distress and affliction[d][c][b], they will not save themselves.
translation:
  language: hi
  text: उन दिनों पृथ्वी के राजाओं और उन शक्तिशाली लोगों के मुख झुक जाएँगे[a], जो सूखी भूमि[b] पर अधिकार रखते हैं—उनके हाथों के कामों के कारण[c]; क्योंकि अपने संकट और क्लेश के दिन वे अपने आप को बचा नहीं सकेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक भाव: “वे मुख से झुके हुए हो जाएँगे।” प्राप्त गीइज़ पाठ यहाँ संक्षिप्त है; संभवतः क्रिया ይከውኑ (“वे हो जाएँगे”) का पाठ बिगड़कर ክኑ रह गया है।'
    reason: textual_and_syntactic_note
  - marker: b
    text: “सूखी भूमि” मूल का शाब्दिक रूप है। यहाँ इससे मनुष्यों के वास और शासन के अधीन भूमि अथवा पृथ्वी का अभिप्राय हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “हाथों के काम” उनके कर्मों के लिए व्यापक मुहावरा है। इसमें मनुष्य की बनाई सत्ता या मूर्तियों की प्रतिध्वनि संभव है, पर मूल शब्दावली अर्थ को केवल मूर्तिपूजा तक सीमित नहीं करती।
    reason: cultural_note
lexical_decisions:
- source_word: በዝንቱ፡ መዋዕል
  choice: उन दिनों
  rationale: यह सर्वनाश-संबंधी प्रसंगों में प्रयुक्त मानक कालसूचक पदबंध है और भावी न्याय के समय की ओर संकेत करता है।
- source_word: ይከውኑ ትሑታነ ገጽ (पांडुलिपि-पाठ में संक्षिप्त/भ्रष्ट ክኑ)
  choice: उनके मुख झुक जाएँगे
  rationale: संभावित मूल क्रिया का अर्थ ‘हो जाना’ है और ትሑታነ ገጽ उसका विधेय है, अर्थात राजा और शक्तिशाली लोग ‘झुके मुखवाले’ हो जाएँगे। यह हिंदी रूप लज्जा, पराजय और दीन दशा की मुख-संबंधी छवि को बनाए रखता है।
- source_word: ነገሥተ ምድር
  choice: पृथ्वी के राजा
  rationale: यह सांसारिक शासकों के लिए प्रचलित सर्वनाश-संबंधी अभिव्यक्ति है; ‘पृथ्वी’ इसके व्यापक दायरे को बनाए रखती है।
- source_word: ጽኑዓን
  choice: शक्तिशाली लोग
  rationale: यह राजाओं के साथ रखे गए प्रभावशाली और सामर्थी व्यक्तियों को दर्शाता है; वर्तमान हिंदी में यह स्पष्ट और स्वाभाविक है।
- source_word: እለ ይእኅዝዋ ለየብስ
  choice: जो सूखी भूमि पर अधिकार रखते हैं
  rationale: የብስ का शाब्दिक अर्थ ‘सूखी भूमि’ है और क्रिया धारण करने, अधिकार रखने या अपने अधीन रखने का भाव देती है। ठोस भू-छवि को सामान्य ‘संसार’ में नहीं बदला गया।
- source_word: በእንተ ምግባረ እደዊሆሙ
  choice: उनके हाथों के कामों के कारण
  rationale: यह मानवीय कर्मों के लिए प्रयुक्त बाइबलीय मुहावरा है। इससे नैतिक दोष स्पष्ट रहता है, जबकि मूर्तिपूजा का संभावित संकेत अनावश्यक रूप से निश्चित नहीं किया जाता।
- source_word: በዕለተ ጻዕቆሙ ወጻሕቦሙ
  choice: अपने संकट और क्लेश के दिन
  rationale: दोनों संज्ञाओं को रखकर न्याय के समय की तीव्र विपत्ति का द्विगुणित वर्णन सुरक्षित किया गया है।
- source_word: ኢይድኅኑ ርእሶሙ
  choice: वे अपने आप को बचा नहीं सकेंगे
  rationale: मूल में आत्मवाचक कर्म स्पष्ट है। यह रूप असमर्थता और आत्म-उद्धार की विफलता दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: ‘झुके मुख’ का राजाओं और शक्तिशाली लोगों से व्याकरणिक संबंध
  choice: इसे उन्हीं न्यायाधीन राजाओं और शक्तिशाली लोगों की होनेवाली दशा माना गया है।
  alternative: संक्षिप्त पाठ को इस प्रकार समझना कि ‘दीन मुखवाले’ कोई अलग समूह हैं, या कि उनके विषय में कहा गया है कि वे लज्जित किए जाएँगे।
  rationale: संभावित पूर्ण क्रिया ይከውኑ (‘वे हो जाएँगे’) के साथ यह पदबंध विधेय के रूप में सबसे स्वाभाविक है। इससे दुष्ट शासकों को सद्गुणी ‘दीन’ लोगों के रूप में प्रस्तुत करने की भ्रांति से बचते हुए पाठ की मुख और लज्जा की छवि बनी रहती है।
- issue: ‘हाथों के काम’ में मूर्तिपूजा का संभावित संकेत
  choice: मुख्य पाठ में व्यापक मुहावरा ‘उनके हाथों के काम’ रखा गया है।
  alternative: इसे विशेष रूप से ‘उनकी मूर्तियाँ’ या केवल उनकी राजनीतिक करतूतें कहना।
  rationale: मूल पदबंध मूर्तिपूजा की प्रतिध्वनि रख सकता है, पर उसका अर्थ उसी तक सीमित नहीं करता। व्यापक अनुवाद इस संभावित अर्थ को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘मुख’ से मूल की सम्मान-लज्जा संबंधी ठोस छवि बचती है; ‘सूखी भूमि’ को जानबूझकर सामान्यीकृत नहीं किया गया। वाक्य-विन्यास न्याय, कारण और अंतिम असमर्थता की क्रमिक गति को बनाए रखता है।
