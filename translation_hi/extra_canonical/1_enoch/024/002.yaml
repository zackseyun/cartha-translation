  yaml_path: translation/extra_canonical/1_enoch/024/002.yaml
  text: And I went in that direction and saw seven glorious mountains[a], each one differing from the other; and their stones were glorious and beautiful, and all of them were glorious and splendid in appearance, and fair in face. Three were toward the east, one set upon another, and three toward the north, one set upon another, with deep and winding ravines[d][c][b], no one coming near to another.
translation:
  language: hi
  text: और मैं अपने मार्ग पर आगे गया[a] और मैंने सात महिमामय पर्वत देखे। हर एक दूसरे से भिन्न था; उनके पत्थर भव्य और सुंदर थे। वे सभी देखने में महिमामय और शोभायमान थे, और उनका मुख सुंदर था[b]। तीन पूर्व की ओर थे, एक के ऊपर एक दृढ़ता से स्थित, और तीन उत्तर की ओर थे, एक के ऊपर एक दृढ़ता से स्थित। वहाँ गहरी और घुमावदार घाटियाँ थीं, जिनमें से कोई भी दूसरी के निकट नहीं आती थी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उस दिशा में आगे गया।” गीइज़ वाक्यांश को ‘अपने मार्ग पर’ अथवा दिशासूचक अर्थ में समझा जा सकता है।
    reason: lexical_ambiguity
  - marker: b
    text: मूल पाठ शाब्दिक रूप से पर्वतों के “मुख” को सुंदर बताता है और इस प्रकार उन्हें लगभग मानवीय रूप में चित्रित करता है।
    reason: cultural_note
  - marker: c
    text: अंतिम वर्णन का वाक्य-संबंध कठिन है। “गहरी और घुमावदार घाटियाँ” संभवतः पर्वत-समूहों के बीच की भू-आकृतियों को बताता है; अगला स्त्रीलिंग वाक्य इन्हीं घाटियों के एक-दूसरे के निकट न आने की बात करता है।
    reason: textual_ambiguity
