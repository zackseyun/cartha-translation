  rationale: प्रथम पुरुष की दर्शन-यात्रा और ‘मार्ग’ की मूल छवि दोनों को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: ነጸርኩ
  choice: मैंने ... देखे
  rationale: यह प्रत्यक्ष दृश्य-बोध का सामान्य क्रियापद है; ‘देखा’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ሰብዐተ፡ አድባረ፡ ክቡራነ
  choice: सात महिमामय पर्वत
  rationale: ክቡራነ में गौरव, वैभव और प्रतिष्ठा का भाव है; ‘महिमामय’ प्रलयदर्शी वर्णन की ऊँची शैली को बनाए रखता है।
- source_word: ወኵሉ፡ ፩እምነ፡ ፩እንዘ፡ ይትዌለጥ
  choice: हर एक दूसरे से भिन्न था
  rationale: यह पर्वतों के गुणात्मक भेद को व्यक्त करता है, केवल उनकी स्थानिक दूरी को नहीं।
- source_word: እእባኒ፡ ክቡራነ፡ ወሠናያነ
  choice: उनके पत्थर भव्य और सुंदर थे
  rationale: ‘पत्थर’ पर्वतों की भौतिक बनावट पर मूल पाठ के स्पष्ट ध्यान को बनाए रखता है; विशेषण वैभव और सौंदर्य दोनों व्यक्त करते हैं।
- source_word: ወኵሉ፡ ክቡር፡ ወስቡሕ፡ ራእዮሙ
  choice: वे सभी देखने में महिमामय और शोभायमान थे
  rationale: दृश्य वैभव की दोहरी तीव्रता को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ወሠናይ፡ ገጾሙ
  choice: उनका मुख सुंदर था
  rationale: शाब्दिक ‘मुख’ पर्वतों के लगभग मानवीकृत चित्रण को सपाट ‘रूप’ में बदलने के बजाय सुरक्षित रखता है।
- source_word: ጽኑዓን፡ ፩ዲበ፡ ፩
  choice: एक दूसरे के ऊपर दृढ़ता से स्थित
  rationale: वाक्यांश की स्तरीकृत व्यवस्था और दृढ़ता, दोनों भावों को व्यक्त करता है, बिना यह संकेत दिए कि पर्वत कृत्रिम रूप से बनाए गए थे।
- source_word: ቈላት፡ ዕሙቅ፡ ወጠዋያት
  choice: गहरी और घुमावदार घाटियाँ
  rationale: ዕሙቅ गहराई और ጠዋያት घुमावदार या टेढ़े स्वरूप को बताता है; इसे ‘एक घाटी’ मानना मूल के बहुवचन को खो देगा।
- source_word: አሐቲ፡ ለአሐቲ፡ ኢይትቃረባ
  choice: जिनमें से कोई भी दूसरी के निकट नहीं आती थी
  rationale: स्त्रीलिंग एकवचन रूपों को घाटियों से संबद्ध रखता है और उन्हें व्यक्तियों के रूप में समझने से बचाता है।
