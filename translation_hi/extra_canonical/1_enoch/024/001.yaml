base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/024/001.yaml
  text: And from there I went to another place of the earth[a], and he showed me a mountain of fire that blazed day and night.
translation:
  language: hi
  text: और वहाँ से मैं पृथ्वी के एक और स्थान पर गया, और उसने मुझे आग का एक पहाड़ दिखाया, जो दिन-रात धधकता रहता था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसने मुझे दिखाया’ का कर्ता गीइज़ पाठ में निहित है; प्रसंग से संभवतः हनोक का स्वर्गदूतीय मार्गदर्शक अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እምህየ
  choice: वहाँ से
  rationale: दर्शन-यात्रा में पिछले स्थान से आगे बढ़ने की स्थानिक कड़ी को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ሖርኩ
  choice: मैं ... गया
  rationale: प्रथम पुरुष के सीधे गति-वाचक कथन को बिना अतिरिक्त यात्रा-संबंधी अर्थ जोड़े सुरक्षित रखता है।
- source_word: ካልአ መካነ ምድር
  choice: पृथ्वी के एक और स्थान पर
  rationale: मूल के ‘पृथ्वी/भूमि का दूसरा स्थान’ को सुबोध हिन्दी में रखते हुए उसके ब्रह्मांडीय-भौगोलिक स्वर को बनाए रखता है।
- source_word: አርአየኒ
  choice: उसने मुझे ... दिखाया
  rationale: दर्शन-वर्णन के क्रियार्थ को सीधे व्यक्त करता है; कर्ता को स्वर्गदूत या मार्गदर्शक कहकर स्पष्ट नहीं किया गया।
- source_word: ደብረ እሳት
  choice: आग का एक पहाड़
  rationale: मूल समास की प्रबल अपोकैलिप्टिक छवि को विशेषण में बदलने के बजाय यथासंभव सीधे रूप में रखता है।
- source_word: ዘያንበለብል
  choice: जो ... धधकता रहता था
  rationale: लगातार प्रज्वलित रहने की तीव्र और चालू क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: መዐልተ ወሌሊተ
  choice: दिन-रात
  rationale: निरंतरता बताने वाली कालगत जोड़ी को संक्षिप्त और प्रचलित हिन्दी रूप में सुरक्षित रखता है।
theological_decisions:
- issue: ‘उसने मुझे दिखाया’ का अंतर्निहित कर्ता
  choice: मुख्य पाठ में केवल ‘उसने’ रखा गया।
  alternative: ‘स्वर्गदूत ने’ अथवा ‘मेरे मार्गदर्शक ने’
  rationale: संदर्भ संभवतः हनोक के स्वर्गदूतीय मार्गदर्शक की ओर संकेत करता है, पर इस पद में कर्ता का नाम नहीं दिया गया; इसलिए मूल की अस्पष्टता सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और दर्शन-वर्णन के सीधे प्रवाह के अनुरूप। ‘धधकता रहता था’ सतत ज्वलन को स्पष्ट करता है, जबकि अंतर्निहित कर्ता की अस्पष्टता बनाए रखी गई है।
