  choice: वक्ता ने ऐसी सुगंध पहले कभी नहीं सूँघी थी।
  alternative: सुगंध गन्धरस जैसी थी।
  rationale: ‘गन्धरस’ वाला अर्थ OCR में बिगड़े हुए अंतिम शब्द और ገሙራ की गलत संज्ञात्मक व्याख्या पर निर्भर है। सुधरा हुआ गीइज़ पाठ और यूनानी साक्ष्य ‘मैंने कभी नहीं सूँघी’ का समर्थन करते हैं।
