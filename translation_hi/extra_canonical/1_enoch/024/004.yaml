  choice: जिसकी सुगंध मैंने पहले कभी नहीं सूँघी थी
  rationale: समीक्षित पाठ-पुनर्निर्माण में अंतिम रूप ‘मैंने सूँघा’ है और नकारात्मक मुहावरा ‘कभी नहीं’ का अर्थ देता है। हिन्दी में सुगंध को स्पष्ट करना संदर्भानुकूल और स्वाभाविक है।
