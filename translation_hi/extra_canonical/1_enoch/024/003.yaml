base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/024/003.yaml
  text: And the seventh mountain was in the midst of these[a], and its height surpassed them all, resembling the seat of a throne[c][b], and fragrant trees encircled it.
translation:
  language: hi
  text: और सातवाँ पहाड़ इनके बीच में था। वह ऊँचाई में उन सबसे बढ़कर था[a] और सिंहासन के आसन के समान था[b]; सुगंधित वृक्ष उसे चारों ओर से घेरे हुए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ गीज़ पाठ कठिन और संभवतः विकृत है। यूनानी पाठ का आशय है, ‘वह ऊँचाई में उनसे बढ़कर था’; इसी के आधार पर यहाँ सातवें पहाड़ को बाकी सब से ऊँचा बताया गया है।
    reason: textual_variant
  - marker: b
    text: मूल में ‘आसन’ और ‘सिंहासन’ दोनों शब्द आए हैं; इसलिए दोहरी अभिव्यक्ति को केवल ‘सिंहासन’ कहकर सरल नहीं किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ሳብዕ ደብር
  choice: सातवाँ पहाड़
  rationale: क्रमसूचक विशेषण और ‘पहाड़’ का सीधा, स्वाभाविक अनुवाद; यह दर्शन में वर्णित पर्वतों की शृंखला को बनाए रखता है।
- source_word: ማእከሎሙ ለእሎንቱ
  choice: इनके बीच में
  rationale: 'संकेतवाचक पद सहित स्थान-संबंधी अर्थ को स्पष्ट करता है: सातवाँ पहाड़ पहले बताए गए पहाड़ों के मध्य था।'
- source_word: ኖኆሙ ዘይትማሰሉ [ኵሎሙ]
  choice: वह ऊँचाई में उन सब से बढ़कर था
  rationale: गीज़ पाठ यहाँ कठिन और संभवतः विकृत है; उपलब्ध यूनानी साक्ष्य सातवें पहाड़ के अन्य सभी से ऊँचा होने का स्पष्ट अर्थ सुरक्षित रखता है। ‘उन सब’ कोष्ठकित ኵሎሙ का भाव भी व्यक्त करता है।
- source_word: መንበረ አትራኖስ
  choice: सिंहासन के आसन
  rationale: दोनों संज्ञाओं—‘आसन’ और ‘सिंहासन’—को बनाए रखता है, ताकि मूल की दोहरी राजकीय छवि केवल ‘सिंहासन’ में न सिमट जाए।
- source_word: የአውድዎ
  choice: उसे चारों ओर से घेरे हुए थे
  rationale: घेरने या चारों ओर होने की क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: ዕጸወ መዓዛ
  choice: सुगंधित वृक्ष
  rationale: शाब्दिक ‘सुगंध के वृक्ष’ की अपेक्षा स्वाभाविक हिन्दी में वही सुगंध-संबंधी संवेदनात्मक अर्थ देता है।
theological_decisions:
- issue: पहाड़ और सिंहासन के बीच संबंध
  choice: ‘जैसा दिखाई देता था’ द्वारा समानता व्यक्त की गई है, पहचान नहीं।
  alternative: पहाड़ को सीधे सिंहासन कहना।
  rationale: गीज़ का तुलनात्मक क्रियापद समानता दर्शाता है; पाठ पहाड़ को स्वयं सिंहासन घोषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। वाक्य को पठनीय बनाने के लिए दो स्वतंत्र वाक्यों में बाँटा गया है। ‘सिंहासन के आसन’ की जानबूझकर रखी गई पुनरुक्ति मूल की दोहरी अभिव्यक्ति सुरक्षित करती है; उसका स्पष्टीकरण पादटिप्पणी में दिया गया है।
