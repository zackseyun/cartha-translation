translation:
  language: hi
  text: और वह उन्हें दण्ड के लिए स्वर्गदूतों के हवाले कर देगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वह उन्हें दण्ड सहित स्वर्गदूतों के हवाले कर देगा।” गीइज़ में ‘दण्ड’ के साथ प्रयुक्त रचना उद्देश्य या परिणाम (“दण्ड के लिए”) अथवा अधिक साधनात्मक अर्थ (“दण्ड सहित”) दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይሜጥዎሙ
  choice: और वह उन्हें ... के हवाले कर देगा
  rationale: क्रिया लोगों को दूसरे के अधिकार या अभिरक्षा में सौंपने का भाव देती है। ‘के हवाले कर देगा’ न्यायिक और प्रलय-संबंधी संदर्भ को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है; आरम्भिक संयोजक को ‘और’ से व्यक्त किया गया है।
- source_word: ለመላእክት
  choice: स्वर्गदूतों के हवाले
  rationale: पूर्वसर्ग प्राप्तकर्ता को चिह्नित करता है। हिन्दी में ‘स्वर्गदूतों के हवाले’ उस भाव को सहज रूप से व्यक्त करता है कि वे उनकी अभिरक्षा या अधिकार में सौंपे जाएँगे, बिना किसी विशेष प्रकार के दण्ड देने वाले स्वर्गदूत मान लेने के।
- source_word: በመቅሠፍት
  choice: दण्ड के लिए
  rationale: संज्ञा दण्ड, ताड़ना या प्रहार का अर्थ दे सकती है। ‘दण्ड के लिए’ न्यायिक भाव रखता है और शारीरिक यातना को अनावश्यक रूप से निश्चित नहीं करता; गीइज़ रचना का साधनात्मक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: स्वर्गदूतों की पहचान और भूमिका
  choice: केवल ‘स्वर्गदूतों’ कहा गया है और उन्हें दण्डात्मक अभिरक्षा के प्राप्तकर्ता के रूप में प्रस्तुत किया गया है
  alternative: उन्हें विशेष रूप से ‘दण्ड देने वाले स्वर्गदूत’ कहना
  rationale: गीइज़ पाठ केवल ‘स्वर्गदूतों’ कहता है और उनके किसी विशिष्ट वर्ग का उल्लेख नहीं करता। इसलिए अनुवाद पाठ की संयमित अभिव्यक्ति और उसकी धर्मवैचारिक अनिश्चितता बनाए रखता है।
- issue: उपलब्ध स्रोत-पाठ की सीमा
  choice: केवल दिए गए और सत्यापित गीइज़ वाक्यांश का अनुवाद
  alternative: अन्य संस्करणों में इस पद से जोड़े गए प्रतिशोध और उत्पीड़न संबंधी अगले वाक्यांश को सम्मिलित करना
  rationale: प्रस्तुत मूल-भाषा स्रोत में केवल यही वाक्यांश उपलब्ध है। संभावित रूप से छूटी हुई सामग्री को बिना पद-संरेखित स्रोत-साक्ष्य के मुख्य पाठ में जोड़ना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज शैली। ‘दण्ड’ न्यायिक स्वर बनाए रखता है, जबकि ‘के हवाले कर देगा’ अधिकार और अभिरक्षा में सौंपने का भाव स्पष्ट करता है।
