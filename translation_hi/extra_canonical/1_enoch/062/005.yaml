base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/005.yaml
  text: And one half of them shall look at the other half[a], and they shall be terrified, and their faces shall fall[b], and pain shall seize them when they see that Son of Man sitting on the throne of his glory.
translation:
  language: hi
  text: और उनमें से आधे लोग दूसरे आधे लोगों की ओर देखेंगे[a]; वे आतंकित हो जाएँगे, उनके चेहरे उतर जाएँगे[b], और जब वे उस मनुष्य-पुत्र[c] को उसकी महिमा के सिंहासन पर बैठे देखेंगे, तब पीड़ा उन्हें जकड़ लेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘उनका एक आधा उनके दूसरे आधे [की ओर]’। दोहराया गया पद समूह के दो हिस्सों की ओर संकेत करता है; इसे केवल ‘वे एक-दूसरे को देखेंगे’ कहना इस ठोस छवि को कम कर देता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उनके चेहरे झुक जाएँगे।’ मूल मुहावरा भय या लज्जा से मुख उतरने अथवा नीचे होने का भाव देता है।
    reason: lexical_alternative
  - marker: c
    text: ‘मनुष्य-पुत्र’ यहाँ दृष्टांतों में प्रयुक्त एक विशिष्ट प्रलयकालीन पद है; अनुवाद इस पद को बनाए रखता है, बिना बाद की धर्मवैचारिक भाषा को इसमें जोड़ने के।
    reason: cross_reference
lexical_decisions:
- source_word: መንፈቆሙ ... ለመንፈቆሙ
  choice: उनमें से एक आधा दूसरे आधे को
  rationale: दोहराई गई संज्ञा और सर्वनाम-प्रत्यय सभा के दो भागों का ठोस चित्र प्रस्तुत करते हैं। यह हिंदी में उस विभाजित समूह का भाव बनाए रखता है, यद्यपि पारस्परिक अर्थ भी संभव है।
- source_word: ይሬእዩ
  choice: देखेगा / देखेंगे
  rationale: यह देखने की सामान्य क्रिया है। पहले खंड में सामूहिक कर्ता ‘एक आधा’ के साथ ‘देखेगा’ और बाद में बहुवचन कर्ता के साथ ‘देखेंगे’ स्वाभाविक हिंदी है।
- source_word: ይደነግጹ
  choice: आतंकित हो जाएँगे
  rationale: न्याय के प्रसंग में यह शब्द तीव्र भय व्यक्त करता है; ‘घबरा जाएँगे’ की अपेक्षा ‘आतंकित’ उसकी तीव्रता बेहतर बनाए रखता है।
- source_word: ይቴሕቱ ገጾሙ
  choice: उनके चेहरे उतर जाएँगे
  rationale: यह स्वाभाविक आधुनिक हिंदी मुहावरा भय, लज्जा या निराशा से मुख-मुद्रा गिर जाने का सजीव भाव व्यक्त करता है।
- source_word: ይእኅዞሙ ሕማም
  choice: पीड़ा उन्हें जकड़ लेगी
  rationale: मूल रचना में पीड़ा या व्याधि द्वारा पकड़ लिए जाने का चित्र है। ‘जकड़ लेगी’ उस बलवान रूपक को बनाए रखता है और शारीरिक अथवा मानसिक पीड़ा में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ወልደ ብእሲ
  choice: मनुष्य के पुत्र
  rationale: दृष्टांतों के इस भाग में यह विशिष्ट प्रलयकालीन व्यक्ति के लिए प्रयुक्त पद है। हिंदी का स्थापित पदबंध स्थानीय शीर्षकीय भार को बनाए रखता है।
- source_word: ይነብር
  choice: बैठे
  rationale: क्रिया का अर्थ बैठना, रहना या निवास करना हो सकता है, पर सिंहासन के साथ यहाँ बैठना संदर्भानुकूल है; ‘विराजमान’ मूल से अधिक व्याख्यात्मक होता।
- source_word: መንበረ ስብሐቲሁ
  choice: उसकी महिमा के सिंहासन
  rationale: यह चयन मूल की संबंधवाचक रचना और प्रलय-साहित्य की सिंहासन-छवि को सुरक्षित रखता है; ‘महिमामय सिंहासन’ अर्थ की संरचना को कुछ अधिक समतल कर देता।
theological_decisions:
- issue: क्या ወልደ ብእሲ को उपाधि के रूप में या सामान्य मानव-संज्ञा के रूप में अनूदित किया जाए
  choice: विशिष्ट पद ‘उस मनुष्य के पुत्र’ के रूप में अनुवाद
  alternative: ‘उस मनुष्य-पुत्र’ या ‘उस मानव’
  rationale: इस खंड में यह अभिव्यक्ति बार-बार एक विशिष्ट अंतकालीन पात्र की पहचान कराती है और ለዝኩ का संकेतवाचक बल ‘उस’ से प्रकट होता है। अनुवाद इसे विशिष्ट पद बनाए रखता है, पर बाद की धर्मवैचारिक धारणाओं को पद में जोड़ता नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में स्वाभाविक, गंभीर और प्रलय-दर्शन के अनुरूप रखी गई है। ‘चेहरे उतर जाएँगे’ सामान्य पाठक के लिए बोधगम्य मुहावरा है, जबकि ‘महिमा का सिंहासन’ मूल की गरिमामय संरचना बनाए रखता है।
