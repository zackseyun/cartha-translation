base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/001.yaml
  text: And thus the Lord commanded the kings and the mighty and the exalted[a], and those who dwell on the earth, and said, “Open your eyes and lift up your horns[b], if you are able to recognize the Chosen One.”
translation:
  language: hi
  text: और इस प्रकार प्रभु ने राजाओं, शक्तिशाली लोगों, ऊँचे पदवालों और पृथ्वी पर रहनेवालों को आज्ञा दी और कहा, “अपनी आँखें खोलो और अपने सींग ऊँचे उठाओ[a], यदि तुम उस चुने हुए जन[b] को पहचान सको।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपने सींग ऊँचे उठाओ” में सींग सम्भवतः शक्ति, ऊँचे दर्जे या घमंडी सामर्थ्य का प्रतीक हैं; अनुवाद ने इसे किसी अमूर्त शब्द से बदलने के बजाय मूल छवि को बनाए रखा है।
    reason: cultural_note
  - marker: b
    text: या “निर्वाचित जन।” गीइज़ में यह केवल वर्णनात्मक विशेषण नहीं, बल्कि इस खंड में प्रयुक्त एक औपचारिक, एकवचन उपाधि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: አዘዘ
  choice: आज्ञा दी
  rationale: यह प्रबल निर्देश देनेवाली क्रिया है और न्याय-संबंधी प्रकाशनात्मक प्रसंग के अनुरूप है।
- source_word: እግዚእ
  choice: प्रभु
  rationale: यहाँ यह पृथ्वी के शासकों को संबोधित करनेवाले सार्वभौम दिव्य अधिकारी की उपाधि है।
- source_word: ነገሥት
  choice: राजाओं
  rationale: मूल शब्द विशेष रूप से राजाओं को दर्शाता है; सामान्य ‘शासकों’ की अपेक्षा यही अधिक सटीक है।
- source_word: ዐዚዛን
  choice: शक्तिशाली लोगों
  rationale: यह सामर्थ्य और प्रभाव रखनेवाले लोगों को दर्शाता है तथा आधुनिक हिन्दी में सहज है।
- source_word: ልዑላን
  choice: ऊँचे पदवालों
  rationale: मूल में ऊँचे दर्जे या प्रतिष्ठा का भाव है; यह अनुवाद किसी एक निश्चित सामाजिक वर्ग को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: እለ የሐድርዋ ለምድር
  choice: पृथ्वी पर रहनेवालों
  rationale: यह पृथ्वी के निवासियों के लिए प्रयुक्त व्यापक प्रकाशनात्मक अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है।
- source_word: ክሥቱ አዕይንቲክሙ
  choice: अपनी आँखें खोलो
  rationale: आँखें खोलने का आदेश उस प्रकट सत्य को देखने और ग्रहण करने के आह्वान के अनुकूल है।
- source_word: አንሥኡ አቅርንቲክሙ
  choice: अपने सींग ऊँचे उठाओ
  rationale: सींगों की मूल प्रकाशनात्मक छवि को बनाए रखा गया है; इसे केवल ‘अपनी शक्ति दिखाओ’ जैसे अमूर्त कथन में नहीं बदला गया।
- source_word: ትክሉ
  choice: यदि तुम ... सकते हो
  rationale: यह योग्यता या सामर्थ्य की शर्त को स्वाभाविक किन्तु गंभीर हिन्दी में व्यक्त करता है।
- source_word: አእምሮቶ
  choice: पहचान
  rationale: प्रसंग में किसी प्रकट किए जा रहे व्यक्ति को पहचानने का भाव केवल सामान्य ज्ञान या समझ से अधिक उपयुक्त है।
- source_word: ሐሩይ
  choice: चुने हुए जन
  rationale: यह खंड में प्रयुक्त औपचारिक उपाधि के रूप में स्पष्ट है और किसी बाद की विशिष्ट धर्मवैज्ञानिक शब्दावली को आरोपित नहीं करता।
theological_decisions:
- issue: दृष्टान्तों में ሐሩይ उपाधि का अनुवाद
  choice: चुने हुए जन
  alternative: निर्वाचित जन
  rationale: ‘चुने हुए जन’ आधुनिक हिन्दी में अधिक स्पष्ट और स्वाभाविक है, साथ ही व्यक्ति की औपचारिक उपाधि का बल बनाए रखता है।
- issue: ‘अपने सींग ऊँचे उठाओ’ को मुख्य पाठ में रूपकात्मक बनाना या मूल छवि बनाए रखना
  choice: मूल छवि ‘अपने सींग ऊँचे उठाओ’ बनाए रखना
  alternative: अपनी शक्ति दिखाओ
  rationale: प्रकाशनात्मक साहित्य की प्रतीकात्मक छवि को अमूर्त व्याख्या में समतल नहीं किया गया; संभावित अर्थ टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर प्रकाशनात्मक और न्यायिक प्रसंग के अनुरूप गरिमामय रखी गई है। सूची की सामाजिक श्रेणियाँ अलग-अलग रखी गई हैं और ‘सींग’ जैसी मूल प्रतीकात्मक छवि को सुरक्षित रखा गया है।
