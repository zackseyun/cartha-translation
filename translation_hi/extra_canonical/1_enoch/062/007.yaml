base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/007.yaml
  text: For from the beginning the Son of Man was hidden[a], and the Most High kept him in the presence of his power[b], and revealed him to the chosen ones.
translation:
  language: hi
  text: क्योंकि आरम्भ से मनुष्य का पुत्र छिपा हुआ था, और परमप्रधान ने उसे अपनी सामर्थ्य के सामने[a] सुरक्षित रखा और उसे चुने हुओं को प्रकट किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी सामर्थ्य की उपस्थिति में” अथवा “अपनी शक्ति के सामने।” गीइज़ का यह पदबंध कठिन है; अनुवाद उसकी स्थानगत छवि को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में इसके संयोजक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: እምቅድሙ
  choice: आरम्भ से
  rationale: यहाँ पद समयसूचक क्रियाविशेषण है, जिसका अर्थ ‘आरम्भ से’ या ‘पहले से’ है; इसे स्थानसूचक ‘उसके सामने’ समझना उचित नहीं।
- source_word: ኅቡእ ኮነ
  choice: छिपा हुआ था
  rationale: यह छिपे होने की अवस्था बताता है और बाद के ‘प्रकट किया’ के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: ወልደ እጓለ እመሕያው
  choice: मनुष्य का पुत्र
  rationale: दृष्टान्तों के इस भाग में यह एक पहचाने जाने योग्य सर्वनामीय/उपाधिसूचक पदबंध है। हिन्दी का प्रचलित रूप रखा गया है, पर बाद की धर्मवैज्ञानिक व्याख्या इसमें नहीं जोड़ी गई।
- source_word: ዐቀቦ
  choice: सुरक्षित रखा
  rationale: क्रिया में रखने, बचाए रखने और रक्षा करने का अर्थ-क्षेत्र है; ‘सुरक्षित रखा’ प्रकाशन से पहले दिव्य संरक्षण का भाव स्पष्ट करता है।
- source_word: ልዑል
  choice: परमप्रधान
  rationale: यह परमेश्वर की उपाधि है; ‘परमप्रधान’ हिन्दी के धार्मिक-साहित्यिक प्रयोग में स्वाभाविक और गरिमापूर्ण है।
- source_word: በቅድመ ኃይሉ
  choice: अपनी सामर्थ्य के सामने
  rationale: कठिन गीइज़ पदबंध की स्थानगत छवि और ठोस संज्ञा ‘सामर्थ्य’ को बिना सहज व्याख्या में घोले यथासम्भव सुरक्षित रखा गया है।
- source_word: ከሠቶ
  choice: उसे प्रकट किया
  rationale: यह पहले के छिपे होने के विपरीत प्रकाशन को व्यक्त करता है और सर्वनाम के कर्म-सन्दर्भ को बनाए रखता है।
- source_word: ለኅሩያን
  choice: चुने हुओं पर
  rationale: गीइज़ संबंधसूचक अव्यय का यहाँ प्रकाशन के प्राप्तकर्ताओं की ओर संकेत है। हिन्दी में ‘पर ... प्रकट किया’ स्वाभाविक है और चुने हुए समुदाय को दर्शाता है।
theological_decisions:
- issue: ወልደ እጓለ እመሕያው को उपाधि के रूप में प्रस्तुत करना
  choice: मनुष्य का पुत्र
  alternative: मनुष्य-पुत्र; जीवितों की सन्तान का पुत्र
  rationale: स्थानीय सन्दर्भ में पदबंध एक विशिष्ट प्रलयदर्शी व्यक्तित्व की पहचान कराता है। प्रचलित उपाधिसूचक हिन्दी रूप अर्थ को स्पष्ट रखता है, किन्तु पाठ में बाद की मसीही पहचान या सिद्धान्त नहीं जोड़ता।
- issue: पूर्व-अस्तित्व और गुप्त रखे जाने के भाव की स्पष्टता
  choice: आरम्भ से ... छिपा हुआ था ... सुरक्षित रखा ... प्रकट किया
  alternative: अनादिकाल से छिपा था; परमप्रधान ने उसे नियत करके रखा था
  rationale: पाठ आरम्भ से छिपे होने और बाद में प्रकट किए जाने की बात कहता है, पर ‘अनादि’ जैसे अधिक प्रबल तत्वमीमांसात्मक दावे नहीं करता। चुना हुआ रूप इस तनाव को बिना बढ़ाए सुरक्षित रखता है।
- issue: በቅድመ ኃይሉ की कठिन छवि
  choice: अपनी सामर्थ्य के सामने
  alternative: अपनी सामर्थ्य की उपस्थिति में; अपनी शक्ति के द्वारा
  rationale: मूल पदबंध अस्पष्ट और असामान्य है। औपचारिक छवि बनाए रखना इसे साधनवाचक अर्थ में बदल देने से अधिक सावधान है; वैकल्पिक सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रलयदर्शी शैली रखी गई है। वाक्य सामान्य पाठक के लिए सुबोध है, जबकि कठिन गीइज़ पदबंध की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
