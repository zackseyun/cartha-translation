review_pass:
  verdict: revise
  source_fidelity: ‘आरम्भ से’ correctly reflects the temporal force of እምቅድሙ, and the sequence of hiddenness, divine keeping, and revelation is preserved. The difficult phrase በቅድመ ኃይሉ is appropriately retained in a spatially concrete rendering with a footnote. However, ለኅሩያን marks the recipients of revelation and is more accurately rendered in modern Hindi as ‘चुने हुओं को,’ rather than ‘चुने हुओं पर.’
  naturalness: The register is suitably elevated and generally natural. ‘चुने हुओं को उसे प्रकट किया’ is clearer and more idiomatic modern Hindi for revelation to a group than ‘चुने हुओं पर उसे प्रकट किया.’
  terminology: ‘मनुष्य का पुत्र’ appropriately maintains the title-like expression without adding later doctrinal interpretation. ‘परमप्रधान’ and ‘सामर्थ्य’ suit the register. The footnote responsibly preserves the uncertainty of the difficult Ge’ez phrase.
  issues:
  - severity: medium
    issue: Recipient of revelation rendered as ‘चुने हुओं पर’
    rationale: The prepositional phrase ለኅሩያን is dative, indicating those to whom he was revealed. In modern standard Hindi, ‘चुने हुओं को उसे प्रकट किया’ clearly conveys this relation; ‘पर’ can suggest manifestation upon them and is less direct here.
  revised_text: क्योंकि आरम्भ से मनुष्य का पुत्र छिपा हुआ था, और परमप्रधान ने उसे अपनी सामर्थ्य के सामने[a] सुरक्षित रखा और उसे चुने हुओं को प्रकट किया।
