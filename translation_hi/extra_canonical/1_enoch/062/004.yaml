base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/004.yaml
  text: And pain shall come upon them as upon a woman in labor[a], when her child comes to the mouth of the womb[c][b], and she is constrained in giving birth.
translation:
  language: hi
  text: और उन पर वैसी ही पीड़ा आ पड़ेगी जैसी प्रसव-वेदना में स्त्री पर आती है[a]। जब उसका बच्चा गर्भाशय के मुख तक आ पहुँचता है[b], तब वह प्रसव के समय पीड़ा से जकड़ जाती है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘जैसे प्रसव-वेदना में स्त्री पर आती है’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘गर्भाशय के मुख पर’; यह शारीरिक अभिव्यक्ति प्रसव के बिंब को तीव्र बनाती है।
    reason: lexical_alternative
  - marker: c
    text: एक स्रोत-पाठ में ‘और वह प्रसव से जकड़ जाती है’ के समान एक वाक्यांश इससे पहले भी कोष्ठकों में मिलता है। उसके पाठ और वाक्य-विन्यास को लेकर अनिश्चितता है; यहाँ स्पष्ट, प्राप्त अर्थ को अनावश्यक पुनरावृत्ति के बिना प्रस्तुत किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ሕማም
  choice: पीड़ा
  rationale: यह शब्द शारीरिक दर्द और गहरी व्यथा दोनों व्यक्त कर सकता है। प्रसव के ठोस रूपक में ‘पीड़ा’ उसका शारीरिक और प्रलय-दर्शी दोनों प्रभाव बनाए रखता है।
- source_word: ማሕምም
  choice: प्रसव-वेदना में पड़ी
  rationale: यह पद प्रसव की पीड़ा से गुजर रही स्त्री की अवस्था बताता है। यह हिन्दी में स्वाभाविक है और पुराने ढंग की भाषा से बचते हुए मूल बिंब को स्पष्ट रखता है।
- source_word: የዓፅብ / ተዐፅብ
  choice: पीड़ा से जकड़ जाती है
  rationale: क्रिया दबाव, कठिनाई से घिरने या विवश हो जाने का भाव रखती है। ‘जकड़ जाती है’ प्रसव के शारीरिक दबाव को बनाए रखता है, जबकि ‘पीड़ा से’ हिन्दी में आशय स्पष्ट करता है।
- source_word: ወሊድ
  choice: जन्म देते समय
  rationale: यहाँ संज्ञा प्रसव की क्रिया को सूचित करती है। हिन्दी में क्रियात्मक रूप सहज है और प्रसव के ठोस दृश्य को सुरक्षित रखता है।
- source_word: በአፈ ማሕፀን
  choice: गर्भ के मुख तक
  rationale: शाब्दिक अर्थ ‘गर्भ के मुख पर/तक’ है। यह चयन मूल की सजीव शारीरिक उपमा को बनाए रखता है; अधिक चिकित्सकीय ‘गर्भमुख’ की अपेक्षा सामान्य पाठक के लिए भी स्पष्ट है।
theological_decisions:
- issue: प्रसव के बिंब को सामान्य भय या व्यथा में बदलना
  choice: प्रसव-पीड़ा, बच्चे के गर्भ के मुख तक पहुँचने और जन्म देते समय जकड़े जाने के ठोस बिंब को बनाए रखा गया है।
  alternative: इसे केवल ‘उन पर बड़ी व्यथा आएगी’ जैसे सामान्य कथन में रूपांतरित करना।
  rationale: मूल पाठ लगातार चलने वाली प्रसव-उपमा का प्रयोग करता है। उसकी शारीरिक विशिष्टता प्रलय-दर्शी वाणी की तीव्रता का अंग है; उसे अमूर्त कर देना मूल के प्रभाव को घटाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘प्रसव-वेदना’ और ‘गर्भ के मुख’ मूल के ठोस बिंब को रखते हैं; वाक्य-विन्यास हिन्दी की स्वाभाविक तुलना को स्पष्ट करता है, ताकि पीड़ा की तुलना स्त्री से नहीं बल्कि स्त्री पर आने वाली प्रसव-पीड़ा से हो।
