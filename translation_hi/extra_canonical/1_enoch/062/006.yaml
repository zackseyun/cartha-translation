base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/006.yaml
  text: And the kings and the mighty and all who possess the earth shall bless and praise and exalt him who rules over all that is hidden[a][b].
translation:
  language: hi
  text: और राजा, शक्तिशाली लोग और वे सब जो पृथ्वी पर अधिकार रखते हैं,[a] उसे धन्य कहेंगे, उसकी स्तुति करेंगे और उसे महिमामंडित करेंगे—उसे, जो हर छिपी हुई वस्तु पर शासन करता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे सब जो पृथ्वी को अपने अधिकार में रखते हैं।” गीइज़ क्रिया का अर्थ थामना या अधिकार में रखना हो सकता है; यहाँ सम्भवतः पृथ्वी पर सत्ता चलाने वाले लोग अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: मूल पाठ इस व्यक्ति के लिए कोई स्पष्ट उपाधि नहीं देता, बल्कि केवल उसे “हर छिपी हुई वस्तु पर शासन करने वाला” कहता है; इसलिए उसकी पहचान यहाँ निश्चित नहीं की गई है।
    reason: alternative_reading
lexical_decisions:
- source_word: ይባርክዎ
  choice: उसे धन्य कहेंगे
  rationale: यह क्रिया आशीर्वचन या धन्य कहने का भाव रखती है। यहाँ अधीनस्थ जन उस व्यक्ति की प्रशंसा कर रहे हैं, इसलिए ‘उसे धन्य कहेंगे’ स्वाभाविक और अर्थ-स्पष्ट है।
- source_word: ይሴብሕዎ
  choice: उसकी स्तुति करेंगे
  rationale: यह उपासना और सार्वजनिक प्रशंसा की भाषा है; ‘स्तुति’ इसके उच्च तथा धर्म-साहित्यिक स्वर को बनाए रखती है।
- source_word: የልዕልዎ
  choice: उसका गुणगान करेंगे
  rationale: मूल क्रिया ऊँचा उठाने या महिमा बढ़ाने का भाव देती है। आधुनिक हिन्दी में किसी व्यक्ति को स्वयं ‘ऊँचा करेंगे’ कहना संभावित रूप से पदोन्नति का अर्थ दे सकता है; ‘गुणगान करेंगे’ प्रशंसात्मक आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ነገሥት
  choice: राजा
  rationale: सामान्य और राजनीतिक रूप से ठोस अर्थ ‘राजा’ है।
- source_word: መዛዝእት
  choice: सामर्थी लोग
  rationale: यह राजाओं के साथ उल्लिखित शक्तिशाली व्यक्तियों को सूचित करता है। ‘सामर्थी लोग’ सामाजिक और राजनीतिक शक्ति का व्यापक भाव बनाए रखता है।
- source_word: ኵሎሙ እለ ይእሕዝዋ ለምድር
  choice: वे सब जो पृथ्वी पर अधिकार रखते हैं
  rationale: क्रिया का मूल भाव पकड़ने, थामने या अपने अधिकार में रखने का है। ‘अधिकार रखते हैं’ राजनीतिक संदर्भ में स्वाभाविक है, जबकि हिंसक कब्ज़े का अनिश्चित भाव मुख्य पाठ में नहीं जोड़ता।
- source_word: ለዘይመልክ
  choice: उसका, जो ... शासन करता है
  rationale: सम्बन्धवाचक रचना एकवचन व्यक्ति को उसके शासन द्वारा वर्णित करती है; कोई विशिष्ट उपाधि जोड़ना मूल से आगे जाना होगा।
- source_word: ኵሎ ዘኅቡእ
  choice: हर छिपी हुई वस्तु
  rationale: यह व्यापक पद है और इसे केवल ‘रहस्यों’ तक सीमित नहीं किया जाना चाहिए। यह दृश्य, गोपनीय या प्रकट न हुई सभी बातों की व्यापकता बनाए रखता है।
theological_decisions:
- issue: ‘हर छिपी हुई वस्तु पर शासन करने वाले’ एकवचन व्यक्ति की पहचान
  choice: मुख्य पाठ में उसे केवल वर्णनात्मक सम्बन्धवाचक वाक्यांश से व्यक्त किया गया है।
  alternative: इसे ‘आत्माओं का प्रभु’, ‘मनुष्य का पुत्र/चुना हुआ’, या छिपी बातों के ज्ञाता और शासक परमेश्वर के रूप में स्पष्ट करना।
  rationale: इस पद का गीइज़ पाठ कोई स्पष्ट उपाधि नहीं देता। इसलिए पहचान को निश्चित करना सन्दर्भ से निकाला गया धर्मवैचारिक निष्कर्ष होता; वर्णनात्मक अनुवाद मूल की अस्पष्टता और तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध रूप। भविष्यसूचक क्रम के लिए ‘करेंगे’ रखा गया है। तीन प्रशंसात्मक क्रियाओं को हिन्दी में स्वाभाविक क्रम में रखा गया है, और अंतिम वर्णनात्मक खंड को डैश के बाद दोहराए गए ‘उसका’ से स्पष्ट जोड़ा गया है।
