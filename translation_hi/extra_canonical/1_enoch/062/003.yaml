base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/003.yaml
  text: And in that day all the kings and the mighty and the exalted[a], and those who possess the earth, shall stand up, and they shall see and recognize that he sits on the throne of his glory; and righteousness shall be judged before him[b], and no lying word shall be spoken before him.
translation:
  language: hi
  text: और उस दिन सभी राजा, सामर्थी और ऊँचे पदवाले, और पृथ्वी पर अधिकार रखनेवाले[a], उठ खड़े होंगे। वे देखेंगे और पहचान लेंगे कि वह अपनी महिमा के सिंहासन पर बैठा है; और उसके सामने धार्मिकता का न्याय किया जाएगा[b], और उसके सामने कोई झूठी बात नहीं कही जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पृथ्वी को अपने अधिकार में रखनेवाले’ अथवा ‘देश/संसार पर शासन करनेवाले।’ गीज़ क्रिया का अर्थ पकड़कर रखना, स्वामित्व रखना या नियंत्रण करना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘धार्मिकता का न्याय किया जाएगा’ वाला वाक्यांश इथियोपिक पाठ और वाक्य-विन्यास की दृष्टि से कठिन है। अनुवाद ने इसे अधिक परिचित अभिव्यक्ति में बदलने के बजाय मूल शब्दों का न्यायिक भाव बनाए रखा है।
    reason: textual_variant
lexical_decisions:
- source_word: ወይቀውሙ
  choice: उठ खड़े होंगे
  rationale: यह क्रिया उठने या खड़े होने का बोध कराती है। न्यायालय-जैसे दृश्य की शारीरिक छवि सुरक्षित रहती है, पर इसे पुनरुत्थान मानकर अर्थ सीमित नहीं किया गया।
- source_word: በይእቲ ዕለት
  choice: उस दिन
  rationale: यह प्रलय-साहित्य में प्रयुक्त समय-सूचक सूत्र है; आधुनिक हिन्दी में स्वाभाविक रहते हुए इसका भविष्यसूचक स्वर बना रहता है।
- source_word: ኵሎሙ ነገሥት ወዐዚዛን ወልዑላን
  choice: सभी राजा, सामर्थी और ऊँचे पदवाले
  rationale: तीनों पद राजनीतिक-सामाजिक अभिजात वर्ग की अलग-अलग श्रेणियाँ दिखाते हैं; उन्हें एक ही सामान्य शब्द में नहीं समेटा गया।
- source_word: ወእለ ይእኅዝዋ ለምድር
  choice: और पृथ्वी पर अधिकार रखनेवाले
  rationale: मूल क्रिया पकड़ने, अपने अधिकार में रखने या नियंत्रण करने का अर्थ दे सकती है। यह हिन्दी पदबंध स्वामित्व और शासन—दोनों संभावनाओं को खुला रखता है।
- source_word: ወይሬእይዎ ወያአምርዎ
  choice: वे देखेंगे और पहचान लेंगे
  rationale: क्रियाओं की जोड़ी प्रत्यक्ष देखने के साथ पहचान या स्वीकार करने का भाव भी रखती है; इसलिए दोनों पहलू सुरक्षित रखे गए।
- source_word: ከመ ይነብር ዲበ መንበረ ስብሐቲሁ
  choice: कि वह अपनी महिमा के सिंहासन पर बैठा है
  rationale: यह सिंहासनारूढ़ होने का दृश्य है। मूल में केवल सर्वनाम है, इसलिए व्यक्ति की उपाधि जोड़कर उसकी पहचान निश्चित नहीं की गई।
- source_word: ወጽድቅ ቅድሜሁ ይትኴነን
  choice: और उसके सामने धार्मिकता का न्याय किया जाएगा
  rationale: पंक्ति पाठ और वाक्य-विन्यास की दृष्टि से कठिन है। संज्ञा ‘धार्मिकता’ और क्रिया का न्यायिक भाव दोनों रखे गए हैं, यद्यपि हिन्दी में कथन असामान्य प्रतीत होता है।
- source_word: ወነገረ በከ አልቦ ዘይትበሀል በቅድሜሁ
  choice: और उसके सामने कोई झूठी बात नहीं कही जाएगी
  rationale: यह उसके सामने झूठ या छलपूर्ण वचन बोले जाने का निषेध करता है और न्यायालय-जैसे गंभीर प्रसंग को बनाए रखता है।
theological_decisions:
- issue: सिंहासन पर बैठे व्यक्ति की पहचान
  choice: मूल के अनुसार केवल ‘वह’ रखा गया।
  alternative: आस-पास के प्रसंग के आधार पर उसे स्पष्ट रूप से ‘मनुष्य का पुत्र’ या ‘आत्माओं का प्रभु’ कहना।
  rationale: इस पद में उपाधि दोहराई नहीं गई है। सर्वनाम बनाए रखने से स्थानीय अस्पष्टता सुरक्षित रहती है और आसपास के पदों से कोई पहचान आरोपित नहीं होती।
- issue: ‘पृथ्वी पर अधिकार रखनेवालों’ का आशय
  choice: अर्थ को स्वामित्व, नियंत्रण और प्रभुत्व के बीच व्यापक रखा गया।
  alternative: इसे केवल भूमिधरों अथवा केवल संसार के शासकों तक सीमित करना।
  rationale: गीज़ अभिव्यक्ति अधिकार में रखने, स्वामित्व रखने या नियंत्रण करने के अर्थ दे सकती है; प्रलय-साहित्यिक प्रसंग में इसे समय से पहले संकीर्ण करना उचित नहीं।
- issue: ‘धार्मिकता का न्याय’ वाला कठिन वाक्यांश
  choice: कठिन न्यायिक वाक्य-विन्यास को यथासंभव सुरक्षित रखा गया।
  alternative: इसे ‘उसके सामने धर्ममय न्याय होगा’ या ‘वह धार्मिकता से न्याय करेगा’ बनाकर सहज करना।
  rationale: वैकल्पिक रूप अधिक सहज हैं, पर वे मूल में ‘धार्मिकता’ और कर्मवाच्य न्यायिक क्रिया के बीच विद्यमान तनाव को हल कर देते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध रखी गई है। ‘उठ खड़े होंगे’, ‘महिमा का सिंहासन’ और कर्मवाच्य न्यायिक कथन से प्रलय-साहित्य तथा राजकीय न्यायसभा का स्वर बना रहता है। कठिन मूल वाक्यांश को अत्यधिक सहज करके उसके अर्थगत तनाव को मिटाया नहीं गया।
