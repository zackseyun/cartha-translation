  text: And the congregation of the chosen and the holy ones shall be sown[c][b][a], and all the chosen shall stand before him on that day.
translation:
  language: hi
  text: और चुने हुओं तथा पवित्र जनों[b] का समुदाय[a] बोया जाएगा[c], और उस दिन सभी चुने हुए उसके सामने खड़े होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सभा’।
    reason: lexical_alternative
  - marker: b
    text: ‘पवित्र जन’ से पवित्र किया गया समुदाय अभिप्रेत हो सकता है; प्रलयदर्शी साहित्य में यह पद स्वर्गीय पवित्र प्राणियों के अर्थ में भी आ सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘बोया जाएगा’; भाव की दृष्टि से ‘रोपा जाएगा’ भी संभव है।
    reason: metaphor_clarification
lexical_decisions:
- source_word: ወይዘራእ
  choice: बोया जाएगा
  rationale: यह ዘርአ (‘बोना’) का कर्मवाच्य रूप है। इसलिए मूल के बीज बोने संबंधी रूपक को बनाए रखा गया है; ‘दिखाई देगा’ इस रूप का अर्थ नहीं देता।
- source_word: ማኅበረ
  choice: समुदाय
  rationale: यह एकत्रित समूह को सूचित करता है। ‘समुदाय’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है; ‘सभा’ भी संभव है।
- source_word: ኅሩያን
  choice: चुने हुए
  rationale: मूल के चयन-संबंधी अर्थ को स्पष्ट रूप से व्यक्त करता है और ‘निर्वाचित’ जैसे अधिक पारिभाषिक शब्द का अनावश्यक धर्मवैज्ञानिक भार नहीं लाता।
- source_word: ቅዱሳን
  choice: पवित्र जन
  rationale: बहुवचन संज्ञात्मक प्रयोग को सुरक्षित रखता है और इसे केवल मनुष्य या केवल स्वर्गीय प्राणी मानकर सीमित नहीं करता।
- source_word: ወይቀውሙ
  choice: खड़े होंगे
  rationale: खड़े होने या अपना स्थान ग्रहण करने का सीधा अर्थ देता है और उपस्थिति अथवा न्याय के दृश्य के अनुकूल है।
- source_word: በቅድሜሁ
  choice: उसके सामने
  rationale: मूल में व्यक्त किसी की उपस्थिति के भाव को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: ኵሎሙ
  choice: सभी
  rationale: समस्त चुने हुओं पर दिए गए स्पष्ट बल को बनाए रखता है।
- source_word: በይእቲ ዕለት
  choice: उस दिन
  rationale: मूल की काल-सूचक और प्रलयदर्शी अभिव्यक्ति का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ቅዱሳን का आशय मानवीय धर्मी जन हैं या स्वर्गीय पवित्र प्राणी
  choice: ‘पवित्र जन’ रखकर संदर्भ को खुला रखा गया है।
  alternative: ‘संत’ कहकर इसे मुख्यतः मानवीय विश्वासियों तक सीमित करना, या ‘पवित्र स्वर्गदूत’ कहकर केवल स्वर्गीय प्राणियों तक सीमित करना।
  rationale: ‘चुने हुओं’ के साथ इसका युग्म मानवीय धर्मी समुदाय की ओर संकेत कर सकता है, पर प्रलयदर्शी साहित्य में यह पद स्वर्गीय पवित्र प्राणियों के लिए भी प्रयुक्त हो सकता है। अनुवाद मूल की इस अर्थगत व्यापकता को सुरक्षित रखता है।
- issue: समुदाय के ‘बोए जाने’ का रूपक
  choice: असामान्य होते हुए भी ‘बोया जाएगा’ को मूल रूपक के रूप में रखा गया है।
  alternative: ‘रोपा जाएगा’ या ‘स्थापित किया जाएगा’।
  rationale: मूल क्रिया बीज बोने को व्यक्त करती है और हनोक की पुस्तक में धार्मिकता की पौध से जुड़े व्यापक बिंब के अनुकूल है। इसे साधारण ‘स्थापित’ में बदलना मूल रूपक को मिटा देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रलयदर्शी शैली रखी गई है। वाक्य सरल और पठनीय है, किंतु ‘बोया जाएगा’ जैसे मूल के जानबूझकर असामान्य रूपक को सहज बनाने के नाम पर हटाया नहीं गया।
