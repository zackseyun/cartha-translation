base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/002.yaml
  text: And the Lord of Spirits seated him on the throne of his glory[a], and the spirit of righteousness was poured out upon him, and the word of his mouth slays all the sinners[d][c][b], and all the lawless are destroyed from before his face.
translation:
  language: hi
  text: और आत्माओं के प्रभु ने उसे अपनी महिमा के सिंहासन पर बैठाया, और उस पर धार्मिकता की आत्मा उंडेली गई; और उसके मुख का वचन सब पापियों को मार डालता है, और सब व्यवस्था-विरोधी उसके सामने से नष्ट हो जाते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से अंतिम वाक्यांश ‘उसके चेहरे के सामने से’ है; यह न्याय के समय उसकी उपस्थिति से हटा दिए जाने या नष्ट हो जाने का मुहावरा है। अपूर्ण क्रियाओं का अनुवाद ‘मार डालेगा’ और ‘नष्ट हो जाएँगे’ भी किया जा सकता है।
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: አንበረ
  choice: बैठाया
  rationale: यह क्रिया सकर्मक-कारक अर्थ में है—‘बैठाना’ या ‘स्थान देना’; इसलिए आत्माओं के प्रभु को स्वयं बैठने वाला न बनाकर किसी निहित पुरुषवाचक कर्म को सिंहासन पर बैठाने वाला रखा गया है।
- source_word: እግዚእ መናፍስት
  choice: आत्माओं के प्रभु
  rationale: 1 हनोक के दृष्टांतों में प्रयुक्त इस विशिष्ट उपाधि को गंभीर अपोकैलिप्टिक शैली में अक्षुण्ण रखा गया है।
- source_word: መንበረ ስብሐቲሁ
  choice: अपनी महिमा के सिंहासन
  rationale: संबंधवाचक संरचना और राज्याभिषेक-दर्शन की छवि को ‘महिमामय सिंहासन’ में समेटने के बजाय स्पष्ट रखा गया है।
- source_word: መንፈሰ ጽድቅ
  choice: धार्मिकता की आत्मा
  rationale: यह पद नैतिक शुद्धता और न्याय—दोनों की छाया रखता है; ‘धार्मिकता’ मूल अभिव्यक्ति की व्यापकता को बेहतर बनाए रखती है।
- source_word: ተክዕወ ዲቤሁ
  choice: उस पर ... उंडेली गई
  rationale: क्रिया के ‘उंडेले जाने’ के प्रबल बिंब को बनाए रखा गया है, न कि उसे केवल ‘ठहरने’ या ‘दिए जाने’ में हल्का किया गया है।
- source_word: ነገረ አፉሁ
  choice: उसके मुख का वचन
  rationale: मूल की गंभीर न्यायिक अभिव्यक्ति तथा मुख से निकले प्रभावकारी वचन की छवि सुरक्षित रहती है।
- source_word: ይቀትል ኵሎሙ ኃጥኣነ
  choice: सब पापियों को मार डालता है
  rationale: अपूर्ण पक्ष को वर्तमानकालीन प्रभावकारी कथन से व्यक्त किया गया है; क्रिया का स्पष्ट प्राणघातक अर्थ भी बना रहता है।
- source_word: ዐማፂያን
  choice: व्यवस्था-विरोधी
  rationale: शब्द विद्रोहियों या उल्लंघन करने वालों को सूचित कर सकता है। ‘व्यवस्था-विरोधी’ ईश्वरीय व्यवस्था के विरुद्ध बने रहने का भाव देता है, बिना इसे केवल राजनीतिक विद्रोह तक सीमित किए।
- source_word: እምገጹ ይትሐጐሉ
  choice: उसके सामने से नष्ट हो जाते हैं
  rationale: ‘उसके मुख के सामने से’ वाले स्थानिक-न्यायिक मुहावरे को स्वाभाविक हिन्दी में रखा गया है और अपूर्ण क्रिया का वर्तमान/चरित्रगत बल बचाया गया है।
theological_decisions:
- issue: ‘उसे’ और ‘उस पर’ का संदर्भ
  choice: पुरुषवाचक सर्वनाम को बिना नाम जोड़े बनाए रखा गया है।
  alternative: संदर्भ के आधार पर ‘चुने हुए जन’ या ‘मनुष्य के पुत्र’ को स्पष्ट रूप से जोड़ना; अथवा दूसरे सर्वनाम को सिंहासन से जोड़ना।
  rationale: गीज़ पाठ में पुरुषवाचक एकवचन रूप है, जबकि इस पद में उसका नाम प्रत्यक्ष नहीं है। अनुवाद संदर्भगत संभावना को स्वीकार करता है, पर उसे पाठ में सिद्ध तथ्य नहीं बनाता।
- issue: मुख के वचन द्वारा न्याय
  choice: वचन को पापियों को मार डालने वाला प्रभावकारी न्यायिक कथन बनाया गया है।
  alternative: उसने कहा और पापी मर गए; अथवा उसके मुख की श्वास ने उन्हें नष्ट किया।
  rationale: मूल पाठ न्याय को वाणी के प्रभाव से जोड़ता है। यह रूप उस बिंब को बचाता है, पर बाद की धार्मिक शब्दावली से अनावश्यक सामंजस्य नहीं बैठाता।
- issue: अपूर्ण क्रियाओं का काल-पक्ष
  choice: ‘मार डालता है’ और ‘नष्ट हो जाते हैं’
  alternative: ‘मार डालेगा’ और ‘नष्ट हो जाएँगे’
  rationale: गीज़ अपूर्ण रूप चरित्रगत, जारी या भावी प्रभाव व्यक्त कर सकते हैं। हिन्दी वर्तमान यहाँ उस खुली पक्षगत शक्ति को अपेक्षाकृत अच्छी तरह बनाए रखता है; केवल निश्चित भविष्य ठहराना अनावश्यक संकीर्णता होती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और दर्शनात्मक शैली रखी गई है। ‘आत्माओं के प्रभु’, ‘महिमा का सिंहासन’ और ‘मुख का वचन’ जैसे मूल बिंब सुरक्षित हैं। सर्वनाम का संदर्भ जानबूझकर स्पष्ट नाम से नहीं बदला गया, और अपूर्ण क्रियाओं की वर्तमान/भावी खुली शक्ति को टिप्पणी में दर्ज किया गया है।
