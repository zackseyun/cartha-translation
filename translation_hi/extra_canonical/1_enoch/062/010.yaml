base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/010.yaml
  text: And the Lord of Spirits will drive them so that they hasten and go out from before his face[a], and their faces will be filled with shame[c][b], and darkness will be added to their faces.
translation:
  language: hi
  text: और आत्माओं का प्रभु उन्हें इस प्रकार खदेड़ेगा कि वे जल्दी से उसके मुख के सामने से निकल जाएँ[a]। उनके मुख लज्जा से भर जाएँगे, और उनके मुखों पर अन्धकार और बढ़ाया जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी उपस्थिति से।” गीज़ में अधिक शाब्दिक रूप से “उसके मुख के सामने से” है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उनके मुखों पर अन्धकार जोड़ा जाएगा।” अर्थात अन्धकार और गहरा होगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: ይጐጕኦሙ
  choice: उन्हें खदेड़ेगा
  rationale: क्रिया बलपूर्वक आगे बढ़ाने या दूर भगाने का भाव रखती है। ‘खदेड़ेगा’ न्याय के इस प्रसंग में बाध्यकारी गति को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे केवल भय के अर्थ तक सीमित किए।
- source_word: እግዚአ መናፍስት
  choice: आत्माओं का प्रभु
  rationale: यह 1 हनोक में प्रयुक्त एक स्थापित उपाधि है; हिन्दी में संबंधकारक रचना इसके शीर्षकीय स्वरूप को बनाए रखती है।
- source_word: ከመ ይፍጥኑ
  choice: ताकि वे शीघ्रता करें
  rationale: मूल का प्रयोजनसूचक संबंध और बाध्य की गई तत्परता दोनों सुरक्षित रहते हैं।
- source_word: ወይፃኡ እምቅድመ ገጹ
  choice: और उसके मुख के सामने से निकल जाएँ
  rationale: मूल में ‘मुख’ का स्पष्ट, सजीव और राजदरबारी बिंब है। उसे केवल ‘उपस्थिति’ बनाकर अमूर्त नहीं किया गया।
- source_word: ገጾሙ ይመልእ ኃፍረተ
  choice: उनके मुख लज्जा से भर जाएँगे
  rationale: ‘मुख’ के बिंब तथा सार्वजनिक अपमान के भाव को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: ጽልመት ይትዌሰክ ገጾሙ
  choice: उनके मुखों पर अन्धकार और बढ़ जाएगा
  rationale: ይትዌሰክ का मूल भाव जुड़ने या बढ़ने का है। ‘और बढ़ जाएगा’ संचयी अन्धकार को व्यक्त करता है और ‘ढक लेगा’ जैसे भिन्न अर्थक्षेत्र से बचता है।
theological_decisions:
- issue: ईश्वरीय उपस्थिति के लिए मानवरूपी ‘मुख’ का प्रयोग
  choice: उसके मुख के सामने से
  alternative: उसकी उपस्थिति से
  rationale: गीज़ पाठ स्पष्ट रूप से ‘मुख’ कहता है। प्रकाशन-संबंधी सजीव बिंब को बनाए रखना इसे अमूर्त धार्मिक भाषा में समतल करने से अधिक स्रोत-संगत है।
- issue: न्याय में अन्धकार का संचयी बिंब
  choice: अन्धकार और बढ़ जाएगा
  alternative: अन्धकार उनके मुखों को ढक लेगा
  rationale: मूल क्रिया वृद्धि या योग दर्शाती है, आवरण नहीं। इसलिए न्यायगत अन्धकार की तीव्रता को बनाए रखते हुए ‘ढकना’ नहीं अपनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय शैली रखी गई है। ‘मुख’ को ‘चेहरा’ पर वरीयता दी गई, क्योंकि यह ईश्वरीय ‘मुख’ और दोषियों के ‘मुखों’ की मूल शब्दगत पुनरावृत्ति तथा न्याय-दरबार के स्वर को बनाए रखता है। ‘अन्धकार’ की पारंपरिक वर्तनी चुनी गई है।
