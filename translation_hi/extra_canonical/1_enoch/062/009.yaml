base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/009.yaml
  text: And all the kings and the mighty and the exalted[a], and those who rule the dry land, shall fall down before him on their faces, and they shall bow down and set their hope on that Son of Man[c][b], and they shall petition him and seek mercy from him.
translation:
  language: hi
  text: और सब राजा, शक्तिशाली और ऊँचे पद वाले, तथा सूखी भूमि पर शासन करने वाले[a], उसके सामने मुँह के बल गिर पड़ेंगे। वे उस मनुष्य के पुत्र के आगे झुकेंगे और उस पर अपनी आशा रखेंगे[b]; और उससे विनती करेंगे और उससे दया माँगेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धरती पर शासन करने वाले।” गीज़ में शाब्दिक रूप से “सूखी भूमि” कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: “झुकेंगे” का अर्थ “दण्डवत् करेंगे” या अधिक प्रबल अर्थ में “आराधना करेंगे” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወድቁ
  choice: गिर पड़ेंगे
  rationale: यह क्रिया गिरने और दण्डवत् होने की शारीरिक मुद्रा व्यक्त करती है; ‘गिर पड़ेंगे’ दृश्य की तीव्रता बनाए रखती है।
- source_word: ነገሥት
  choice: राजा
  rationale: सामान्य अर्थ ‘राजा’ है और इससे न्याय-दृश्य का ठोस राजनीतिक आशय बना रहता है।
- source_word: መዛዝእት
  choice: शक्तिशाली
  rationale: यह व्यापक रूप से सामर्थ्यवान या अधिकार-संपन्न व्यक्तियों को सूचित करता है।
- source_word: ልዑላን
  choice: ऊँचे पदवाले
  rationale: यह उच्च सामाजिक हैसियतवालों का बोध कराता है; आधुनिक हिन्दी में यह ‘उच्च जन’ की अपेक्षा अधिक स्पष्ट और स्वाभाविक है।
- source_word: እለ ይመልከዋ ለየብስ
  choice: सूखी भूमि पर शासन करनेवाले
  rationale: गीज़ की ठोस ‘सूखी भूमि’ वाली छवि सुरक्षित रखी गई है, उसे केवल ‘पृथ्वी’ कहकर सामान्यीकृत नहीं किया गया।
- source_word: በቅድሜሁ በገጾሙ
  choice: उसके सामने मुँह के बल
  rationale: दोनों पद मिलकर पूर्ण शारीरिक दण्डवत् मुद्रा को तीव्र करते हैं।
- source_word: ይሰግዱ
  choice: उसके आगे झुकेंगे
  rationale: यह समर्पण और श्रद्धा व्यक्त करता है, पर ‘आराधना करेंगे’ कहकर धार्मिक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ይሴፈዉ
  choice: अपनी आशा रखकर
  rationale: क्रिया किसी पर आशा या भरोसा रखने का अर्थ देती है; यह हिन्दी में स्वाभाविक और दिशात्मक अर्थ के अनुरूप है।
- source_word: ለዝኩ ወልደ እጓለ እመሕያው
  choice: उस मनुष्य के पुत्र
  rationale: यहाँ संकेतवाचक तत्व और हनोक के दृष्टान्तों में पदवी-सदृश प्रयोग दोनों सुरक्षित रखे गए हैं।
- source_word: ይስእልዎ ወይስእሉ ኀቤሁ ምሕረተ
  choice: उससे विनती करेंगे और उससे दया माँगेंगे
  rationale: दोहराए गए माँगने के भाव को दो समानार्थी, स्वाभाविक हिन्दी क्रियाओं से व्यक्त किया गया है; इससे अनुनय की तीव्रता बनी रहती है।
theological_decisions:
- issue: मनुष्य के पुत्र के सामने किए गए अभिवादन को स्पष्टतः आराधना कहा जाए या नहीं
  choice: उसके आगे झुकेंगे
  alternative: उसकी आराधना करेंगे; उसे दण्डवत् करेंगे
  rationale: गीज़ क्रिया सम्मानपूर्ण दण्डवत् से लेकर आराधना तक अर्थ दे सकती है। चुना गया रूप इस धार्मिक तनाव को खुला रखता है।
- issue: ወልደ እጓለ እመሕያው पदवी का रूप
  choice: उस मनुष्य के पुत्र
  alternative: उस मनुष्य-पुत्र; जीवित प्राणियों की सन्तान के उस पुत्र
  rationale: यह हनोक के इस खंड में पहचानी हुई अपोकैलिप्टिक पदवी की तरह प्रयुक्त है; अनुवाद स्थानीय प्रयोग को दर्शाता है और बाद की धर्मवैज्ञानिक शब्दावली नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज अपोकैलिप्टिक शैली अपनाई गई है। छोटे वाक्य-विभाजन से लंबी गीज़ संरचना को पठनीय बनाया गया है। ‘सूखी भूमि’ की ठोस छवि और श्रद्धा/आराधना की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
