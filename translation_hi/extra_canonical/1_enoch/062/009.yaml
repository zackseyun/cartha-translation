  source_fidelity: The draft accurately represents the ranks, their prostration, the concrete expression “dry land,” homage, hope in the Son of Man, and the twofold petition for mercy. However, “आशा रखकर ... झुकेंगे” reverses the source sequence, which first states bowing and then placing hope in the Son of Man.
  naturalness: The register is clear, modern, and suitably elevated. Spacing forms such as “ऊँचे पद वाले” and “शासन करने वाले” are more standard in contemporary Hindi prose.
  terminology: “मनुष्य के पुत्र” appropriately preserves the established title-like Enochic expression without making an interpretive doctrinal claim. “झुकेंगे” properly retains the range between obeisance and worship; the footnote supplies the stronger alternative.
  issues:
  - severity: low
    issue: The order of bowing and hoping is reversed.
    rationale: The Geʽez coordinates the actions as bowing down and then hoping in the Son of Man. Reordering them in Hindi is not seriously misleading but is unnecessary and slightly weakens formal fidelity.
  - severity: low
    issue: Compound participial expressions are closed with “वाले.”
    rationale: 'Modern standard Hindi ordinarily writes these as separate words: “पद वाले,” “करने वाले.”'
