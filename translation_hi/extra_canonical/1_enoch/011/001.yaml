base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/011/001.yaml
  text: And in those days I will open the storehouses of blessing that are in heaven[a], so that I may bring them down upon the earth, upon their work and upon their labor[g][f][e][d][c][b], for the children of men.
translation:
  language: hi
  text: और उन दिनों मैं स्वर्ग में स्थित आशीष के भंडारों को खोलूँगा, ताकि उन्हें पृथ्वी पर, मनुष्यों की संतानों के काम और परिश्रम पर उतार दूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በእማንቱ፡ መዋዕል
  choice: उन दिनों
  rationale: यह गीइज़ का प्रलय-साहित्य संबंधी प्रचलित कालसूचक पदबंध है; መዋዕል का अर्थ यहाँ ‘दिन’ है, ‘द्वार’ नहीं।
- source_word: እፈትሕ
  choice: मैं ... खोलूँगा
  rationale: प्रथम पुरुष एकवचन अपूर्ण क्रिया का यहाँ स्वाभाविक भविष्यकालीन अर्थ है।
- source_word: መዛግብተ፡ በረከት
  choice: आशीष के भंडार
  rationale: शब्दशः ‘आशीष के भंडार/कोष’; यह हनोक की ठोस स्वर्गीय-भंडार वाली छवि बनाए रखता है और एकवचन በረከት को सामूहिक भाव में रखता है।
- source_word: እለ፡ በሰማይ
  choice: स्वर्ग में स्थित
  rationale: संबंधवाचक उपवाक्य ‘जो स्वर्ग में हैं’ को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: አውርዶሙ
  choice: उनमें की वस्तुएँ ... उतार दूँ
  rationale: क्रिया ‘नीचे उतारना’ के साथ तृतीय पुरुष बहुवचन कर्म-प्रत्यय है। हिन्दी में उसके संदर्भ को स्पष्ट करने हेतु भंडारों की सामग्री को ‘उनमें की वस्तुएँ’ कहा गया है, बिना उसे केवल ‘आशीषें’ मानकर अस्पष्ट व्याकरणिक तनाव मिटाए।
- source_word: ዲበ፡ ምድር
  choice: पृथ्वी पर
  rationale: विश्वव्यापी प्रसंग में ምድር का अर्थ ‘पृथ्वी’ है, किसी स्थानीय ‘देश’ का नहीं।
- source_word: ግብሮሙ፡ ወዲበ፡ ፃማሆሙ
  choice: मनुष्यों के काम और उनके परिश्रम पर
  rationale: ግብር ‘काम/कार्य’ और ፃማ ‘परिश्रम, श्रम, कठिन मेहनत’ है; दोनों समानांतर पदों को बनाए रखा गया है।
- source_word: ለውሉደ፡ ሰብእ
  choice: मनुष्यों के
  rationale: शब्दशः ‘मनुष्यों की संतानों के लिए’; प्रसंग में इसका आशय मानवजाति है। सहज हिन्दी में लाभार्थी संबंध को काम और परिश्रम के साथ जोड़ा गया है।
theological_decisions:
- issue: प्रथम पुरुष वक्ता की पहचान
  choice: वक्ता को पाठ में अनाम प्रथम पुरुष ही रखा गया है
  alternative: स्पष्ट रूप से ‘परमेश्वर’ जोड़ना
  rationale: प्रसंग में दिव्य वक्ता सर्वाधिक संभावित है, पर पद स्वयं कोई नाम नहीं देता; इसलिए नाम जोड़कर अर्थ को आवश्यकता से अधिक निश्चित नहीं किया गया।
- issue: ‘मनुष्यों की संतान’ का मुहावरा
  choice: मनुष्यों
  alternative: मनुष्यों की संतानें / मानवजाति
  rationale: आधुनिक हिन्दी में ‘मनुष्यों’ आशय को स्पष्ट और स्वाभाविक बनाता है; लिंग-विशेष का अनावश्यक संकेत नहीं देता।
- issue: ‘आशीष’ की संख्या
  choice: एकवचन सामूहिक ‘आशीष’
  alternative: बहुवचन ‘आशीषें’
  rationale: गीइज़ में በረከት एकवचन है, पर सामूहिक लाभ का बोध करा सकता है; हिन्दी एकवचन अमूर्त संज्ञा इस तनाव को सुरक्षित रखती है।
- issue: बहुवचन कर्म-प्रत्यय का पूर्वपद
  choice: भंडारों की सामग्री को सामान्य रूप से ‘उनमें की वस्तुएँ’ कहा गया
  alternative: ‘उन्हें’ अथवा ‘आशीषें’
  rationale: मूल में बहुवचन प्रत्यय है, जबकि निकटवर्ती ‘आशीष’ एकवचन है और ‘भंडार’ बहुवचन। चुना हुआ रूप अर्थ को पठनीय रखता है, लेकिन यह दावा नहीं करता कि नीचे उतारी जाने वाली वस्तुएँ स्वयं भंडार हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘भंडार’, ‘आशीष’ और ‘परिश्रम’ मूल की ठोस तथा धार्मिक शैली बनाए रखते हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई, इसलिए मुख्य पाठ में कोई अनाथ संकेत नहीं है।
