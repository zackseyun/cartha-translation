  yaml_path: translation/extra_canonical/1_enoch/011/002.yaml
  text: And peace and truth shall be partners throughout all the days of the world and throughout all the generations of the world[a][b][c][d].
translation:
  language: hi
  text: और शान्ति और सच्चाई संसार के सारे दिनों और संसार की सारी पीढ़ियों में साथ-साथ रहेंगी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शान्ति और सच्चाई प्रचुर होंगी” या “बढ़ती जाएँगी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰላም
  choice: शान्ति
  rationale: यह गीइज़ का सामान्य शब्द है; यहाँ सच्चाई के साथ मिलकर कुशलता और सुव्यवस्था की दशा व्यक्त करता है।
- source_word: ርትዕ
  choice: सच्चाई
  rationale: ‘सत्य’ या ‘सहीपन’ सम्भव हैं; ‘शान्ति और सच्चाई’ सामान्य पाठक के लिए स्वाभाविक और अर्थ-सन्तुलित युग्म है।
- source_word: ሱቱፋነ ይከውኑ
  choice: बहुतायत से होंगी
  rationale: इस पदबंध को बहुलता या प्रचुरता व्यक्त करने वाला माना गया है; हिन्दी में यह कर्ताओं के प्रचुर रूप से विद्यमान होने का सहज संकेत देता है और केवल ‘साझीदार होंगी’ कहकर सम्भावित अर्थ को सीमित नहीं करता।
- source_word: በኵሉ
  choice: सारे … में
  rationale: पूर्वसर्ग और सार्वभौमिक परिमाण को व्यापक कालगत विस्तार के रूप में व्यक्त करता है।
- source_word: መዋዕለ ዓለም
  choice: संसार के सारे दिनों में
  rationale: መዋዕል का मूल अर्थ ‘दिन’ है; प्रसंग में यह संसार के समस्त काल तक चलने वाला विस्तार दर्शाता है।
- source_word: ትውልደ ዓለም
  choice: संसार की सारी पीढ़ियों में
  rationale: क्रमिक मानव पीढ़ियों का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ዓለም
  choice: संसार
  rationale: इस सम्बन्धकारक रचना में ‘संसार’ ठोस और व्यापक दायरा बनाए रखता है; प्रसंगानुसार ‘युग’ भी सम्भव है।
theological_decisions:
- issue: आशीष का कालगत दायरा
  choice: संसार के सारे दिनों और सारी पीढ़ियों तक व्यापक तथा निरन्तर दायरा
  alternative: इसे केवल एक भावी अन्तकालीन युग तक सीमित करना
  rationale: दोनों पदों के साथ सार्वभौमिक परिमाण समस्त काल और पीढ़ियों पर बल देता है; पाठ किसी विशिष्ट अन्तकालीन समय-सारणी को निर्धारित नहीं करता।
- issue: ሱቱፋነ ይከውኑ का सम्बन्ध
  choice: शान्ति और सच्चाई की प्रचुर उपस्थिति
  alternative: शान्ति और सच्चाई एक-दूसरे की सहभागी होंगी
  rationale: उपलब्ध शब्द-साक्ष्य बहुलता/प्रचुरता का समर्थन करता है, किन्तु रूप की व्याख्या विवादरहित नहीं है; इसलिए वैकल्पिक सम्बन्धात्मक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली रखी गई है। ‘संसार के सारे दिन’ मूल की सामी मुहावरेदार काल-अभिव्यक्ति को बचाता है; ‘बहुतायत से होंगी’ प्रचुरता के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
