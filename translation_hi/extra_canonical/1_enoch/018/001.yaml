base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/001.yaml
  text: And I saw the storehouses of all the winds[b][a], and I saw how with them he adorned all creation and the foundations of the earth.
translation:
  language: hi
  text: और मैंने सभी हवाओं के भंडार[a] देखे, और मैंने देखा कि उसने उनके द्वारा सारी सृष्टि और पृथ्वी की नींवों को कैसे सजाया[b] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कोष।” यहाँ बिंब उन स्वर्गीय कक्षों का है जिनमें हवाएँ रखी जाती हैं।
    reason: lexical_alternative
  - marker: b
    text: इस क्रिया का अर्थ “व्यवस्थित किया” या “स्थापित किया” भी हो सकता है, केवल “सजाया” ही नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: መዛግብተ
  choice: भंडार
  rationale: यह शब्द कोष या भंडार का बोध कराता है। यहाँ ‘भंडार’ उन स्वर्गीय कक्षों की ठोस ब्रह्मांडीय छवि बनाए रखता है जहाँ हवाएँ रखी जाती हैं।
- source_word: ኵሉ ነፋሳት
  choice: सभी हवाएँ
  rationale: यद्यपि ነፋሳት का अर्थ आत्माएँ या श्वास भी हो सकता है, इस ब्रह्मांड-वर्णन और भंडारों के संदर्भ में ‘हवाएँ’ सबसे स्वाभाविक है।
- source_word: ከመ
  choice: कैसे
  rationale: यह हनोक द्वारा देखी गई बात की रीति का परिचय देता है; ‘कैसे’ दर्शन-वृत्तांत के प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ቦሙ
  choice: उनके द्वारा
  rationale: यह पीछे उल्लिखित हवाओं की ओर संकेत करते हुए साधन का भाव व्यक्त करता है।
- source_word: አሰርገወ
  choice: सजाया
  rationale: क्रिया का प्रमुख बिंब सजाने या सुंदर बनाने का है; साथ ही इसमें व्यवस्थित या स्थापित करने की छाया संभव है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ኵሎ ፍጥረተ
  choice: सारी सृष्टि
  rationale: सामूहिक एकवचन यहाँ समस्त सृष्टि के ब्रह्मांडीय विस्तार को व्यक्त करता है।
- source_word: መሰረታቲሃ ለምድር
  choice: पृथ्वी की नींवें
  rationale: यह ठोस स्थापत्य-बिंब वाली प्रलयदर्शी ब्रह्मांड-रचना को बनाए रखता है।
theological_decisions:
- issue: क्या ነፋሳት का अनुवाद ‘हवाएँ’ हो या ‘आत्माएँ’
  choice: हवाएँ
  alternative: आत्माएँ; श्वासें
  rationale: आसपास का प्रसंग विश्व की संरचना और प्राकृतिक शक्तियों का दर्शन है। ‘हवाएँ’ स्थानीय अर्थ के अनुकूल है और अनावश्यक देवदूत-संबंधी अर्थ आरोपित नहीं करता।
- issue: क्या አሰርገወ सृष्टि को सुंदर बनाने या स्थापित/व्यवस्थित करने का वर्णन करता है
  choice: सजाया
  alternative: व्यवस्थित किया; स्थापित किया; सुंदर बनाया
  rationale: मुख्य पाठ में जीवंत सजावटी बिंब रखा गया है, जबकि ब्रह्मांडीय व्यवस्था या स्थापना की वास्तविक अर्थ-संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘भंडार,’ ‘सृष्टि’ और ‘पृथ्वी की नींवें’ मूल की ठोस प्रलयदर्शी ब्रह्मांडीय छवि को बनाए रखते हैं; कठिन क्रिया की अर्थगत अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
