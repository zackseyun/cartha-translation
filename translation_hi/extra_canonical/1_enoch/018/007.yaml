base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/007.yaml
  text: And those toward the east were of colored stone, and one was of pearl stone, and one of healing stone; and those toward the south were of red stone.
translation:
  language: hi
  text: और पूर्व की ओर के वे पर्वत रंगीन पत्थर के थे; उनमें से एक मोती के पत्थर का और एक चंगाई के पत्थर का था। दक्षिण की ओर के वे पर्वत लाल पत्थर के थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽባሕሰ
  choice: पूर्व की ओर
  rationale: दिशासूचक पद को संदर्भानुसार स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: እብነ ሕብር
  choice: रंगीन पत्थर
  rationale: ሕብር रंग अथवा विविध वर्ण का संकेत देता है; इसलिए स्रोत की सामान्य और कुछ अस्पष्ट अभिव्यक्ति को बनाए रखा गया है।
- source_word: እብነ ባሕርይ
  choice: मोती का पत्थर
  rationale: ባሕርይ समुद्र से संबद्ध वस्तु की ओर संकेत कर सकता है और इस पाठ-परंपरा में इसे pearl के रूप में समझा गया है; 'मोती का पत्थर' मूल की पत्थर-संज्ञा भी सुरक्षित रखता है।
- source_word: እብነ ፈውስ
  choice: औषधि-पत्थर
  rationale: ፈውስ का अर्थ उपचार, चंगाई अथवा औषधि है। 'औषधि-पत्थर' असामान्य स्रोत-वाक्यांश को किसी निश्चित रत्न-नाम में बदले बिना सुरक्षित रखता है।
- source_word: አዜብ
  choice: दक्षिण की ओर
  rationale: दक्षिण दिशा के सामान्य अर्थ को सहज हिन्दी में दिया गया है।
- source_word: እብነ ቀይሕ
  choice: लाल पत्थर
  rationale: ቀይሕ का सीधा अर्थ लाल है।
