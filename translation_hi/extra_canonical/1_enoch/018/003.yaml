base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/003.yaml
  text: And I saw how the winds support the heights of heaven[a], and they stand between heaven and earth; these are the pillars of heaven.
translation:
  language: hi
  text: और मैंने देखा कि हवाएँ आकाश की ऊँचाइयों को थामे रहती हैं[a], जो आकाश और पृथ्वी के बीच खड़े हैं; यही आकाश के स्तंभ हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त गीइज़ क्रिया का अर्थ कठिन है। इसका अर्थ ‘फैलाती हैं’, ‘विस्तृत करती हैं’, ‘सहारा देती हैं’ या ऐसा ही कोई कार्य हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ነፋሳት
  choice: हवाएँ
  rationale: इस ब्रह्मांडीय दर्शन में यह बहुवचन प्राकृतिक अथवा ब्रह्मांडीय शक्तियों के रूप में हवाओं को सबसे स्वाभाविक ढंग से व्यक्त करता है; ‘आत्माएँ’ कहना अनावश्यक रूप से व्यक्तिपरक स्वर्गदूतीय अर्थ जोड़ सकता है।
- source_word: ይረብብዋ
  choice: थामे रहती हैं
  rationale: क्रिया का अर्थ कठिन और अनिश्चित है। प्रसंग में आकाशीय संरचना पर हवाओं की क्रिया दिखाई गई है; ‘थामे रहती हैं’ सहज हिन्दी में सहारा देने का भाव रखता है, जबकि पादटिप्पणी फैलाने अथवा विस्तृत करने की सम्भावना सुरक्षित रखती है।
- source_word: አዕልና፡ ሰማይ
  choice: आकाश की ऊँचाइयों
  rationale: इस पदबंध को अंतिम वाक्यांश ‘आकाश के स्तंभ’ से अलग रखा गया है, जिससे स्रोत में उपस्थित भेद मिटे नहीं।
- source_word: ይቀውሙ
  choice: खड़ी हैं
  rationale: यह सीधा और दृश्यात्मक अनुवाद है, जो दर्शन में उनके आकाश और पृथ्वी के बीच स्थित होने को व्यक्त करता है।
- source_word: ማእከለ፡ ሰማይ፡ ወምድር
  choice: आकाश और पृथ्वी के बीच
  rationale: यह शाब्दिक ‘आकाश और पृथ्वी के मध्य’ का स्वाभाविक आधुनिक हिन्दी रूप है और स्थानिक चित्र को स्पष्ट रखता है।
- source_word: እሙንቱ፡ ውእቶሙ
  choice: यही ... हैं
  rationale: यह बलयुक्त पहचानसूचक रचना है; ‘यही’ पहले देखी गई वस्तुओं की ओर संकेत करते हुए उसके व्याख्यात्मक बल को बनाए रखता है।
- source_word: አዕማደ፡ ሰማይ
  choice: आकाश के स्तंभ
  rationale: यह ब्रह्मांडीय संरचनात्मक रूपक को स्पष्ट और गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ነፋሳት का अर्थ ‘हवाएँ’ लिया जाए या ‘आत्माएँ’
  choice: हवाएँ
  alternative: आत्माएँ; हवाएँ/आत्माएँ
  rationale: सृष्टि की संरचना और ब्रह्मांडीय शक्तियों का स्थानीय प्रसंग ‘हवाएँ’ के पक्ष में है। इससे स्रोत द्वारा अपेक्षित न होने वाली स्वर्गदूत-विषयक विशिष्टता आरोपित नहीं होती।
- issue: मध्यवर्ती बहुवचन कर्ता और अंतिम ‘स्तंभों’ की पहचान
  choice: स्रोत के सर्वनामगत तनाव को बनाए रखते हुए ‘वे’ और ‘यही’ रखा गया
  alternative: कर्ता को स्पष्ट रूप से ‘ऊँचाइयाँ’, ‘सहारे’ या ‘हवाएँ’ बताना
  rationale: स्रोत का बहुवचन संकेत व्याख्यात्मक रूप से असुविधाजनक है और अंतिम उपवाक्य उसे ‘आकाश के स्तंभ’ कहता है। किसी एक पूर्वपद को स्पष्ट कर्ता बनाना वास्तविक अस्पष्टता को चुपचाप सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आकाश’ पूरे पद में एकरूप है। स्त्रीलिंग बहुवचन ‘खड़ी हैं’ निकटतम स्पष्ट संज्ञा ‘हवाएँ’ से व्याकरणिक मेल रखता है, जबकि ‘यही आकाश के स्तंभ हैं’ स्रोत की अचानक पहचान और उसके अंतर्निहित तनाव को सुरक्षित रखता है।
