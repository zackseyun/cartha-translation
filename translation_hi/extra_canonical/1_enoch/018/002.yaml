base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/002.yaml
  text: And I saw the cornerstones of the earth[c][b][a], and I saw the four winds that bear up the earth and the firmament of heaven.
translation:
  language: hi
  text: और मैंने पृथ्वी के कोनों के पत्थर[a] देखे; और मैंने उन चार पवनों[b] को देखा, जो पृथ्वी और आकाश-मंडल[c] को थामे हुए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पृथ्वी के कोने के पत्थर।” गीइज़ पदबंध वास्तुशिल्पीय है और इस दर्शन में पृथ्वी के आधारभूत कोनों या सीमांत भागों का बिंब प्रस्तुत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ अनूदित शब्द “पवन” का अर्थ कुछ प्रसंगों में “आत्माएँ” या “श्वासें” भी हो सकता है; परंतु यहाँ ब्रह्मांडीय प्रसंग “पवनों” के अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: c
    text: “आकाश-मंडल” प्राचीन विश्व-कल्पना में आकाश के एक संरचित विस्तार या गुंबद का बिंब बनाए रखता है।
    reason: cultural_note
lexical_decisions:
- source_word: እብነ ማእዘንተ ምድር
  choice: पृथ्वी के कोनों के पत्थर
  rationale: यह पदबंध शाब्दिक वास्तुशिल्पीय बिंब को बनाए रखता है। केवल ‘कोने’ कहने से ‘पत्थर’ लुप्त हो जाता, जबकि ‘कोने के पत्थर’ हिंदी में भवन के कोने में लगे पत्थरों के रूप में भी समझा जा सकता था।
- source_word: ምድር
  choice: पृथ्वी
  rationale: दर्शन के ब्रह्मांडीय प्रसंग में स्थानीय ‘भूमि’ की अपेक्षा संपूर्ण पृथ्वी का अर्थ अधिक उपयुक्त है।
- source_word: አርባዕተ ነፋሳተ
  choice: चार पवनों
  rationale: ነፋሳተ का अर्थ प्रसंगानुसार पवन, श्वास या आत्माएँ हो सकता है; चार दिशाओं और ब्रह्मांडीय संरचना के प्रसंग में ‘पवन’ सर्वाधिक स्वाभाविक है।
- source_word: ይጸውርዋ
  choice: थामे हुए हैं
  rationale: क्रिया उठाए रखने, ढोने या सहारा देने का भाव व्यक्त करती है। ‘थामे हुए हैं’ हिंदी में ब्रह्मांड को टिकाए रखने का सजीव चित्र बनाए रखता है।
- source_word: ወጽንዐ ሰማይ
  choice: और आकाश-मंडल
  rationale: यह चयन प्राचीन विश्व-कल्पना में आकाश की संरचित विस्तृति या गुंबद-जैसे मंडल का बिंब बचाता है और केवल ‘आकाश’ कहकर उसे सपाट नहीं करता।
theological_decisions:
- issue: पृथ्वी और आकाश की प्राचीन ब्रह्मांडीय संरचना
  choice: पृथ्वी के कोनों के पत्थरों तथा पृथ्वी और आकाश-मंडल को थामने वाली पवनों के ठोस बिंब को बनाए रखा गया है।
  alternative: इसे आधुनिकीकृत करके ‘पृथ्वी की सीमाएँ’ और ‘संसार को नियंत्रित करने वाली शक्तियाँ’ कहा जा सकता था।
  rationale: मूल पाठ एक दर्शन में ब्रह्मांडीय वास्तुकला का चित्र प्रस्तुत करता है। इसे अमूर्त या आधुनिक वैज्ञानिक भाषा में बदलना पाठ की काव्यात्मक और अपोकैलिप्टिक तनावशीलता को मिटा देता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘पवन’, ‘पृथ्वी’ और ‘आकाश-मंडल’ सामान्य पाठक के लिए बोधगम्य रहते हुए दर्शनीय-ब्रह्मांडीय शैली को बनाए रखते हैं। अर्धविराम मूल के दो क्रमिक दर्शन-वाक्यों को स्पष्ट रूप से अलग करता है।
