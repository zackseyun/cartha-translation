- issue: इकट्ठा होने की क्रिया का कर्तृत्व
  choice: वे इकट्ठे होते हैं
  alternative: उन्हें इकट्ठा किया जाता है
  rationale: यह हिन्दी रूप सामूहिक एकत्रीकरण व्यक्त करता है, पर बाहरी कर्ता को अनावश्यक रूप से निश्चित नहीं करता।
