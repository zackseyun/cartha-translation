  yaml_path: translation/extra_canonical/1_enoch/018/005.yaml
  text: I saw the winds upon the earth[a], which bear the clouds; I saw the paths of the angels[d][c][b]; I saw at the end of the earth the firm support of the heaven above.
translation:
  language: hi
  text: मैंने पृथ्वी पर की हवाएँ देखीं[a], जो बादलों को थामे रहती हैं; मैंने स्वर्गदूतों के मार्ग देखे; मैंने पृथ्वी के छोर पर ऊपर के आकाश का दृढ़ सहारा देखा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या अधिक शाब्दिक रूप में: “पृथ्वी के ऊपर की हवाएँ, जो बादलों को थामे रहती हैं।”'
    reason: textual_variant
  - marker: b
    text: या “ऊपर के आकाश की नींव।” मूल शब्द दृढ़ता अथवा सहारा देने वाली शक्ति का भी बोध करा सकता है।
    reason: lexical_alternative
