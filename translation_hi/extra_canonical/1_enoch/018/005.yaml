- source_word: ዘይጸውር በደመናት
  choice: जो बादलों को उठाए रहती हैं
  rationale: यह अनुवाद वहन अथवा सहारा देने की ब्रह्मांडीय छवि बनाए रखता है और बादलों को क्रिया का कर्म मानता है।
- source_word: ፍናወ መላእክት
  choice: स्वर्गदूतों के मार्ग
  rationale: यह आकाशीय प्राणियों के आने-जाने के स्थानिक रास्तों की छवि को स्पष्ट और संक्षिप्त रूप में व्यक्त करता है।
- source_word: ውስተ ጽንፈ ምድር
  choice: पृथ्वी के छोर पर
  rationale: यह संसार की दूरस्थ सीमा अथवा किनारे की ब्रह्मांडीय कल्पना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ጽንዐ ዘሰማይ መልዕልተ
  choice: ऊपर के आकाश का दृढ़ सहारा
  rationale: मूल संज्ञा की दृढ़ता और सहारा देने—दोनों की अर्थछायाएँ बचती हैं, जबकि उसे अनिवार्य रूप से स्थापत्यगत ‘नींव’ नहीं माना गया है।
theological_decisions:
