  text: और मैंने एक जलती हुई आग देखी, जो सभी पहाड़ों के भीतर थी।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इथियोपिक पाठ में ‘और जो वहाँ/भीतर था’ के अनुरूप खंड कठिन है। यहाँ इसे ‘आग’ को विशेषित करने वाला संबंधवाचक उपवाक्य माना गया है, अर्थात आग पहाड़ों के भीतर थी।
    reason: textual_variant
  - marker: b
    text: 'या, पुराने अनुवाद के अनुसार: ‘और मैंने एक जलती हुई आग देखी, और वह भी जो सभी पहाड़ों के भीतर था।’'
    reason: previous_rendering
lexical_decisions:
- source_word: እሳተ
  choice: एक आग
  rationale: अनिश्चित एकवचन संज्ञा को सरल रूप में रखा गया है, ताकि दर्शन का बिंब स्रोत या उद्देश्य जोड़े बिना बना रहे।
- source_word: ዘይነድድ
  choice: जलती हुई
  rationale: यह आग की जारी अवस्था बताने वाला संबंधवाचक क्रियारूप है; ‘जलती हुई’ स्वाभाविक हिन्दी में उस गतिशील भाव को बनाए रखता है।
- source_word: ርኢኩ
  choice: मैंने ... देखी
  rationale: यह प्रथम-पुरुष दर्शन-वर्णन का सामान्य सूत्र है। ‘देखी’ सहज और स्पष्ट है तथा आग के स्त्रीलिंग के अनुरूप है।
- source_word: ወዘሀሎ
  choice: जो ... थी
  rationale: इसे እሳተ ‘आग’ को विशेषित करने वाले दूसरे संबंधवाचक उपवाक्य के रूप में समझा गया है। फिर भी पाठ कठिन है, इसलिए वैकल्पिक विश्लेषण पादटिप्पणी में दिया गया है।
- source_word: ውስተ ኵሉ አድባር
  choice: सभी पहाड़ों के भीतर
  rationale: ውስተ आंतरिक स्थान को सूचित करता है और ኵሉ बहुवचन संज्ञा के साथ समष्टिगत अर्थ देता है; यह अनुवाद आग को पहाड़ों की सतह पर रखने के बजाय उनके भीतर होने का ब्रह्मांडीय बिंब बचाता है।
theological_decisions:
- issue: पहाड़ों के भीतर आग के बिंब का स्वरूप
  choice: दर्शन में दिखी आग को पहाड़ों के भीतर स्थित प्रत्यक्ष प्रलयदर्शी बिंब के रूप में बनाए रखा गया है।
  alternative: इसे सामान्य ईश्वरीय न्याय का रूपक या ज्वालामुखीय/भूमिगत आग की प्राकृतिक व्याख्या मानना।
  rationale: निकटवर्ती संदर्भ दर्शन में दिखाई गई भू-दृश्यावली है। अनुवाद पाठ के बिंब को प्रस्तुत करता है, उसका धार्मिक या प्राकृतिक अर्थ निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण दर्शन-वर्णन। ‘पहाड़ों के भीतर’ स्रोत की आंतरिक-स्थान संबंधी छवि को स्पष्ट रखता है; कठिन वाक्य-विन्यास को मुख्य पाठ में स्वाभाविक किया गया और उसकी वास्तविक अनिश्चितता पादटिप्पणियों में सुरक्षित रखी गई है।
