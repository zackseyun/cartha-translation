base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/006.yaml
  text: And I went on toward the south[a], and I saw a place burning day and night[b], where there were seven mountains of precious stone—three toward the east and three toward the south.
translation:
  language: hi
  text: और मैं दक्षिण की ओर आगे बढ़ा और मैंने एक ऐसा स्थान देखा जो दिन-रात जलता रहता था। वहाँ बहुमूल्य पत्थर[b] के सात पहाड़ थे[a]—तीन पूर्व की ओर और तीन दक्षिण की ओर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राप्त गीइज़ पाठ में सात पहाड़ों का उल्लेख करने के बाद कहा गया है, “तीन पूर्व की ओर और तीन दक्षिण की ओर।” यहाँ सुरक्षित इस पद में सातवें पहाड़ की दिशा नहीं बताई गई है।
    reason: textual_variant
  - marker: b
    text: “बहुमूल्य पत्थर” का अनुवाद “कीमती पत्थर” या “वैभवशाली पत्थर” भी किया जा सकता है; गीइज़ शब्द पत्थर के असाधारण मूल्य या वैभव पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ሐለፍኩ
  choice: मैं ... आगे बढ़ा
  rationale: दर्शन-वृत्तांत में यात्रा के जारी रहने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
- source_word: መንገለ አዜብ
  choice: दक्षिण की ओर
  rationale: መንገለ दिशात्मक अर्थ रखता है और አዜብ यहाँ ‘दक्षिण’ को सूचित करता है।
- source_word: ወርኢኩ መካነ
  choice: और मैंने एक ऐसा स्थान देखा
  rationale: यह वाक्य दर्शन में एक नए स्थान का परिचय देता है; ‘एक ... स्थान’ अनावश्यक निश्चितता नहीं जोड़ता।
- source_word: ዘይነድድ
  choice: जो ... जलता रहता था
  rationale: सापेक्ष और निरंतर क्रिया का भाव रखता है तथा अग्निमय दृश्य को बिना विस्तार जोड़े स्पष्ट करता है।
- source_word: መዐልተ ወሌሊተ
  choice: दिन-रात
  rationale: लगातार जलते रहने का समयगत भाव संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: ኀበ ሰብዓቱ አድባር
  choice: वहाँ ... सात पहाड़ थे
  rationale: ኀበ स्थान-संबंध व्यक्त कर सकता है; संदर्भ में यह उस स्थान से पहाड़ों को जोड़ता है।
- source_word: ዘእምእብን ክቡር
  choice: बहुमूल्य पत्थर के
  rationale: እብን ‘पत्थर’ और ክቡር यहाँ असाधारण मूल्य या वैभव को व्यक्त करता है; ‘बहुमूल्य’ खनिज-संबंधी दर्शनात्मक बिंब के अनुकूल है।
- source_word: ፫መንገለ ጽባሕ
  choice: तीन पूर्व की ओर
  rationale: दिशाओं की सूची में ጽባሕ का ‘पूर्व’ अर्थ सबसे स्पष्ट है और መንገለ की दिशात्मकता भी बनी रहती है।
- source_word: ወ፫መንገለ አዜብ
  choice: और तीन दक्षिण की ओर
  rationale: मूल के समानांतर दिशात्मक विन्यास को सुरक्षित रखता है, यद्यपि इस पंक्ति में सातवें पहाड़ की दिशा नहीं बताई गई।
theological_decisions:
- issue: जलते हुए स्थान और रत्नमय पहाड़ों का ब्रह्मांडीय-भौगोलिक चित्रण
  choice: दर्शनात्मक भू-दृश्य को मुख्य पाठ में ठोस और शाब्दिक बिंब के रूप में रखा गया है।
  alternative: इसे सामान्य अग्निमय प्रदेश कहना या पहाड़ों की व्याख्या स्वर्गीय संरचनाओं के रूप में मुख्य पाठ में जोड़ना।
  rationale: पद दृश्य प्रस्तुत करता है, उसकी प्रतीकात्मक व्याख्या नहीं; इसलिए अनुवाद को अर्थ आरोपित किए बिना बिंब सुरक्षित रखना चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दर्शन-वृत्तांत के अनुकूल रखी गई है। फुटनोट चिह्नों को उन शब्दों पर लगाया गया है जिनसे वे वास्तव में संबंधित हैं; मूल अंग्रेज़ी परामर्श-पाठ में उनका स्थान उलटा प्रतीत होता है।
