base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/008.yaml
  text: And the middle one reached to heaven[a], like the throne of the Lord, which was of crystal stone[d][c][b], and the top of the throne was of sapphire stone.
translation:
  language: hi
  text: और बीच वाला स्वर्ग तक ऊपर उठता था, प्रभु के सिंहासन के समान, जो स्फटिक[a] का था; और सिंहासन का ऊपरी भाग[b] नीलम का था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल भाषा में इस पत्थर का नाम अनिश्चित है; ‘स्फटिक’ पारंपरिक अर्थ है, पर यह कोई अन्य चमकीला या बहुमूल्य पत्थर भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह पदबंध कठिन है; इसका अर्थ सिंहासन का ऊपरी भाग, अथवा सिंहासन से जुड़ी संरचना का शिखर, भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ማእከላይሰ
  choice: बीच वाला
  rationale: रूप किसी पहले से उल्लिखित समूह या संरचना के मध्यवर्ती सदस्य/भाग की ओर संकेत करता है। हिन्दी में ‘बीच वाला’ इस अस्पष्ट संदर्भ को बिना अनावश्यक रूप से निश्चित किए बनाए रखता है।
- source_word: ይጐድእ እስከ ሰማይ
  choice: स्वर्ग तक ऊपर उठा हुआ था
  rationale: क्रिया की ऊपर की ओर विस्तार या उठने की दिशा तथा እስከ द्वारा व्यक्त सीमा—‘स्वर्ग तक’—दोनों को स्वाभाविक हिन्दी में रखा गया है।
- source_word: ከመ መንበረ ለእግዚአብሔር
  choice: प्रभु के सिंहासन के समान
  rationale: ከመ तुलना व्यक्त करता है; इसलिए वस्तु को स्वयं दिव्य सिंहासन ठहराने के बजाय उपमा सुरक्षित रखी गई है।
- source_word: እምእብነ ፑክ
  choice: चमकीले रत्न का
  rationale: ፑክ का सटीक खनिजार्थ अनिश्चित है, पर यह उज्ज्वल या बहुमूल्य पत्थर का संकेत देता प्रतीत होता है। मुख्य पाठ में सहज वर्णन और पादटिप्पणी में पारंपरिक ‘स्फटिक’ विकल्प दिया गया है।
- source_word: ይማሑ ለመንበሩ
  choice: सिंहासन का ऊपरी भाग
  rationale: कठिन पदबंध को सामान्यतः सिंहासन के ऊपर के भाग से संबंधित समझा जाता है। ‘ऊपरी भाग’ ‘चोटी’ की अपेक्षा अधिक स्वाभाविक है और वास्तु-संबंधी अनिश्चितता बनाए रखता है।
- source_word: እምእብነ ሰንፔር
  choice: नीलम का
  rationale: रत्ननाम का प्रचलित समतुल्य ‘नीलम’ है। हिन्दी में ‘नीलम का पत्थर’ अनावश्यक पुनरुक्ति होती, इसलिए संक्षिप्त रूप अपनाया गया है।
theological_decisions:
- issue: እግዚአብሔር का अनुवाद
  choice: प्रभु
  alternative: परमेश्वर
  rationale: यहाँ पदवी को श्रद्धापूर्ण और व्यापक बाइबलीय सिंहासन-चित्रण के अनुरूप ‘प्रभु’ कहा गया है; पाठ में अनुपस्थित कोई अतिरिक्त पदवी नहीं जोड़ी गई।
- issue: दृश्य वस्तु और प्रभु के सिंहासन का संबंध
  choice: ‘के समान’ द्वारा उपमा
  alternative: इसे सीधे प्रभु का सिंहासन मानना
  rationale: स्रोत का ከመ समानता बताता है, पहचान नहीं; इसलिए धार्मिक अर्थ को अधिक निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। दृश्य की रहस्यमयता और कठिन गीइज़ पदों की वास्तविक अनिश्चितता पादटिप्पणियों में सुरक्षित रखी गई है; ‘नींव’ जैसी स्रोत में अनुपस्थित धारणा नहीं जोड़ी गई।
