base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/004.yaml
  text: And I saw the winds that turn the sky and cause the disk of the sun and all the stars to set[a][b].
translation:
  language: hi
  text: और मैंने उन हवाओं को देखा जो आकाश को घुमाती हैं और सूर्य-मंडल[a] तथा सारे तारों को अस्त कराती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सूर्य का चक्र” अथवा “सूर्य का गोला।”
    reason: ክበበ गोल मंडल, चक्र या गोले का बोध दे सकता है।
lexical_decisions:
- source_word: ወርኢኩ
  choice: और मैंने ... देखा
  rationale: यह प्रथम पुरुष में दर्शन-वर्णन का सामान्य सूत्र है; सरल और गरिमापूर्ण आधुनिक हिन्दी में इसे स्वाभाविक रूप से रखा गया है।
- source_word: ነፋሳተ
  choice: हवाओं
  rationale: तात्कालिक ब्रह्मांड-वर्णन में ठोस अर्थ ‘हवाएँ’ उपयुक्त है; ‘आत्माएँ’ कहने से ऐसी व्यक्तिगत सत्ता जुड़ जाएगी जो इस पद में स्पष्ट नहीं है।
- source_word: እለ ይመይጥዋ ለሰማይ
  choice: जो आकाश को घुमाती हैं
  rationale: क्रिया आकाश को मोड़ने, घुमाने अथवा गतिमान करने का बोध देती है; ‘घुमाती हैं’ ब्रह्मांडीय गति की छवि बनाए रखता है।
- source_word: ወእለ ያዐርቡ
  choice: और ... अस्त कराती हैं
  rationale: ያዐርቡ, ዐረበ (‘अस्त होना/नीचे जाना’) का कारक रूप है; इसलिए इसका अर्थ निकट लाना नहीं, बल्कि सूर्य और तारों को अस्त कराना है।
- source_word: ለክበበ ፀሐይ
  choice: सूर्य-मंडल
  rationale: ክበበ गोलाकार वस्तु, मंडल या चक्र को सूचित कर सकता है। ‘सूर्य-मंडल’ हिन्दी में दृश्य गोलाकार रूप को स्वाभाविक ढंग से व्यक्त करता है और अत्यधिक तकनीकी अर्थ आरोपित नहीं करता।
- source_word: ወኵሎ ከዋክብተ
  choice: तथा सारे तारों को
  rationale: मूल वाक्यांश सामूहिक है; ‘सारे तारे’ उसका सहज हिन्दी रूप है।
theological_decisions:
- issue: क्या ነፋሳተ को निर्जीव ब्रह्मांडीय हवाएँ माना जाए या व्यक्तिगत आत्मिक/स्वर्गदूतीय प्राणी
  choice: ब्रह्मांडीय हवाएँ
  alternative: आत्माएँ या वायु-आत्माएँ
  rationale: इस दर्शन के निकट संदर्भ में आकाश, सूर्य और तारों की गति नियंत्रित करने वाली ब्रह्मांडीय शक्तियों का वर्णन है। ‘हवाएँ’ मूल बिंब को बनाए रखता है और पद में अस्पष्ट व्यक्तिगत कर्तृत्व नहीं जोड़ता।
- issue: ያዐርቡ का अर्थ निकट लाना है या अस्त कराना
  choice: अस्त कराती हैं
  alternative: निकट लाती हैं
  rationale: यह रूप ዐረበ, अर्थात सूर्य या तारों के अस्त होने, से बना कारक रूप है। ‘निकट लाती हैं’ भिन्न मूल के साथ भ्रम पर आधारित पाठ होगा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण है। अपोकैलिप्टिक ब्रह्मांडीय चित्र को यथासंभव प्रत्यक्ष रखा गया है; ‘सूर्य-मंडल’ सामान्य पाठक के लिए स्वाभाविक है, जबकि उसकी शाब्दिक संभावनाएँ पादटिप्पणी में दी गई हैं।
