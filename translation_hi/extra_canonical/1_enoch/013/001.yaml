base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/013/001.yaml
  text: 'And Enoch went and said to Azazel[a], “You shall have no peace; a great sentence has gone out against you: you will be bound.”'
translation:
  language: hi
  text: 'और हनोक जाकर अज़ाज़ेल से बोला, “तुम्हें शांति नहीं मिलेगी; तुम्हारे विरुद्ध एक बड़ा दंडादेश[a] निकल चुका है: तुम बाँध दिए जाओगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्याय-निर्णय” अथवा “आदेश।” गीज़ का शब्द न्यायिक अर्थ रखता है और इसके बाद आने वाले दंड का परिचय देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ኃሊፎ
  choice: जाकर
  rationale: यह क्रिया हनोक के बोलने से पहले उसके जाने को दर्शाती है। ‘जाकर’ हिन्दी में घटनाक्रम को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ይቤሎ
  choice: से कहा
  rationale: यह सामान्य कथन-क्रिया है; ‘से कहा’ सम्बोधन की प्रत्यक्षता बनाए रखता है और कोई अतिरिक्त वक्तृत्व-बल नहीं जोड़ता।
- source_word: አዛዝኤል
  choice: अज़ाज़ेल
  rationale: व्यक्तिवाचक/अलौकिक नाम का अर्थानुवाद करने के बजाय देवनागरी में लिप्यन्तरण किया गया है।
- source_word: ኢይከውከ ሰላም
  choice: तुम्हें शान्ति नहीं मिलेगी
  rationale: यह सामान्य अभिवादन नहीं, बल्कि कल्याण और अनुकूल परिणाम से वंचित किए जाने की न्यायसूचक घोषणा है। यह रूप आधुनिक हिन्दी में स्वाभाविक रहते हुए उसकी गम्भीरता बनाए रखता है।
- source_word: ዓቢይ
  choice: बड़ा
  rationale: यह अगले न्यायिक पद की तीव्रता बढ़ाता है। ‘बड़ा’ मूल विशेषण का सीधा अनुवाद है और उसकी प्रकृति को अनावश्यक रूप से ‘कठोर’ कहकर निर्धारित नहीं करता।
- source_word: ኵነኔ
  choice: दण्डादेश
  rationale: सन्दर्भ में अज़ाज़ेल के विरुद्ध दण्डकारी न्यायिक निर्णय घोषित होता है। ‘दण्डादेश’ निर्णय और उसके दण्डात्मक परिणाम—बाँधे जाने—दोनों से मेल खाता है; व्यापक अर्थ वाला ‘न्याय-निर्णय’ भी सम्भव है।
- source_word: ወጽአ ላዕሌከ
  choice: तुम्हारे विरुद्ध ... निकल चुका है
  rationale: यह अभिव्यक्ति जारी होकर अज़ाज़ेल पर लागू हुए आदेश का चित्र बनाए रखती है। ‘निकल चुका है’ घोषणा के पहले ही जारी हो जाने का भाव देता है।
- source_word: ይእስርከ
  choice: वह तुम्हें बाँध देगा
  rationale: गीज़ में क्रिया तीसरे पुरुष एकवचन में है और उसका कर्म ‘तुम्हें’ है। ‘वह’ निकटवर्ती दण्डादेश की ओर लौटता है तथा मूल की सक्रिय व्याकरणिक रचना और बन्धन की दण्डात्मक छवि को बनाए रखता है।
theological_decisions:
- issue: न्याय-घोषणा में शान्ति-वाक्य का बल
  choice: तुम्हें शान्ति नहीं मिलेगी
  alternative: शान्ति तुम्हारी नहीं होगी / तुम्हारे लिए कोई शान्ति नहीं होगी
  rationale: यह साधारण विदाई नहीं, बल्कि दोषी ठहराए गए प्रहरी को कल्याण से वंचित करने वाली न्यायिक घोषणा है। चुना हुआ रूप बाद की किसी विशिष्ट पारिभाषिक भाषा को आरोपित किए बिना भविष्यसूचक और प्रलय-साहित्यिक गम्भीरता रखता है।
- issue: ኵነኔ का विधिक अर्थ
  choice: दण्डादेश
  alternative: न्याय-निर्णय / आदेश / दण्डाज्ञा
  rationale: इसके तुरन्त बाद अज़ाज़ेल को बाँधने का दण्ड आता है, इसलिए ‘दण्डादेश’ न्यायिक निर्णय और दण्डात्मक परिणाम दोनों को व्यक्त करता है। व्यापक विकल्पों को पादटिप्पणी में रखा गया है।
- issue: अन्तिम क्रिया का कर्ता
  choice: वह तुम्हें बाँध देगा
  alternative: तुम बाँध दिए जाओगे / ताकि तुम्हें बाँधा जाए
  rationale: मूल क्रिया सक्रिय तीसरे पुरुष एकवचन है। ‘वह’ को निकटवर्ती दण्डादेश से जोड़ना व्याकरणिक रूप को बचाता है, जबकि निष्क्रिय अनुवाद कर्ता को मिटा देता और उद्देश्यवाचक अनुवाद क्रिया-सम्बन्ध को अधिक निश्चित कर देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किन्तु गम्भीर रखी गई है। न्यायसूचक और प्रलय-साहित्यिक स्वर के लिए ‘शान्ति नहीं मिलेगी’, ‘दण्डादेश’ और ‘बाँध देगा’ चुने गए हैं। पादटिप्पणी-सूचक [a] उसी विवादित न्यायिक पद के बाद रखा गया है।
