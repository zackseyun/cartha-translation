  text: And they asked me to write for them a petition of remembrance[a], so that there might be forgiveness for them[c][b], and that I might bring it up
translation:
  language: hi
  text: और उन्होंने मुझसे विनती की कि मैं उनके लिए स्मरणार्थ एक विनती-पत्र[a] लिखूँ, जिससे उन्हें क्षमा मिल सके, और मैं उसे ऊपर ले जाऊँ…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्मरण के लिए एक याचिका’ अथवा ‘स्मरण की प्रार्थना’। गीज़ पदबंध में स्मरण और विनती—दोनों भाव जुड़े हैं।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्राप्त पाठ में अंतिम वाक्यांश अधूरा है और आगे की पंक्ति से जुड़ता है, जहाँ याचिका को ऊपर ले जाने या प्रस्तुत करने की बात आगे बढ़ती है।
    reason: textual_variant
lexical_decisions:
- source_word: ተስእሉኒ
  choice: उन्होंने मुझसे विनती की
  rationale: क्रिया माँगने या अनुरोध करने का भाव रखती है। प्रसंग में गंभीर निवेदन होने के कारण ‘विनती की’ स्वाभाविक और गरिमापूर्ण है।
- source_word: እጽሐፍ
  choice: मैं … लिखूँ
  rationale: अनुरोध के बाद प्रयुक्त आश्रित क्रिया का भाव हिन्दी में ‘कि मैं … लिखूँ’ से स्पष्ट रूप से व्यक्त होता है।
- source_word: ተዝካረ ስእለት
  choice: स्मरणार्थ एक विनती-पत्र
  rationale: पहला पद स्मरण या स्मारक का और दूसरा विनती/याचना का भाव देता है। ‘विनती-पत्र’ लिखित निवेदन को व्यक्त करता है, जबकि ‘स्मरणार्थ’ स्मरण वाले घटक को बनाए रखता है।
- source_word: ይኩኖሙ ኅድገተ
  choice: उन्हें क्षमा मिल सके
  rationale: ኅድገተ में छोड़ दिए जाने, रिहाई या क्षमा का अर्थ है। न्याय के इस प्रसंग में ‘क्षमा’ सहज है, और ‘मिल सके’ याचना की अनिश्चित अपेक्षा को सुरक्षित रखता है।
- source_word: አዕርግ
  choice: मैं उसे ऊपर चढ़ाऊँ
  rationale: यह कारणवाचक रूप किसी वस्तु को ऊपर ले जाने या चढ़ाने का संकेत देता है, न कि केवल स्वयं चढ़ने का। हिन्दी में निहित कर्म को ‘उसे’ से व्यक्त करने पर आशय स्वाभाविक रहता है।
theological_decisions:
- issue: प्रहरियों द्वारा माँगे गए लिखित निवेदन का स्वरूप
  choice: स्मरणार्थ एक विनती-पत्र
  alternative: स्मरण की प्रार्थना / विनती का लिखित अभिलेख
  rationale: यह पदबंध स्वर्गीय न्याय के समक्ष स्मरण और निवेदन—दोनों भावों को रखता है, पर किसी बाद की विशिष्ट धार्मिक-विधि को पाठ में नहीं जोड़ता।
- issue: अंतिम क्रिया में कर्ता की गति या याचिका की प्रस्तुति
  choice: मैं उसे ऊपर चढ़ाऊँ
  alternative: मैं ऊपर चढ़ूँ
  rationale: गीज़ का कारणवाचक क्रियारूप याचिका को ऊपर ले जाने का संकेत देता है। इसलिए इसे हनोक के केवल ऊपर चढ़ने के रूप में अनूदित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘विनती-पत्र’ साधारण पाठक के लिए लिखित याचिका का भाव स्पष्ट करता है; दीर्घविराम संप्रेषित पाठ के अधूरे अंत को दर्शाता है।
