base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/013/002.yaml
  text: And no mercy or petition will be granted to you[a], because of the violence that you have taught[c][b], and because of all the works of blasphemy and violence and sin that you have shown to humankind.
translation:
  language: hi
  text: और तुम्हें न दया मिलेगी, न तुम्हारे लिए कोई विनती स्वीकार की जाएगी[a], क्योंकि तुमने हिंसा सिखाई है, और क्योंकि तुमने मनुष्यों को ईशनिंदा[c], हिंसा और पाप के सभी कर्म दिखाए हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “न दया, न विनती तुम्हारे लिए होगी।” यह विनती तुम्हारे पक्ष में की जाने वाली विनती भी हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: “दिखाए” का अर्थ “प्रकट किए” या “ज्ञात कराए” भी हो सकता है; प्रसंग में यह मनुष्यों को निषिद्ध ज्ञान देने की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ प्रयुक्त शब्द का अर्थ व्यापक रूप से “निंदा,” “धृष्टता” या अपवित्र और अपमानजनक आचरण भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ሣህል (प्रतिलिपि में ሣሕት)
  choice: दया
  rationale: उपलब्ध प्रतिलिपि में पहला शब्द सम्भवतः OCR की त्रुटि है; संशोधित पाठ ሣህል का अर्थ ‘दया/कृपा/राहत’ है। इसलिए इसे दूसरी निकटार्थी ‘विनती’ मानने के बजाय ‘दया’ किया गया है।
- source_word: ስእለት
  choice: विनती
  rationale: यह गंभीर और नम्र याचना को व्यक्त करता है। आधुनिक हिन्दी में ‘विनती’ स्वाभाविक है और न्याय-संबंधी प्रसंग में भी उपयुक्त बैठती है।
- source_word: ኢይከውከ
  choice: स्वीकार की जाएगी
  rationale: ‘होना/बनना’ के नकारात्मक रूप और सम्प्रदानवाचक भाव को प्रसंगानुसार विनती के निष्फल रहने या न माने जाने के रूप में व्यक्त किया गया है।
- source_word: ዘመሀርከ
  choice: तुमने … सिखाई है
  rationale: यह सिखाने या शिक्षा देने का सीधा अर्थ रखता है और पहरेदारों द्वारा मनुष्यों तक निषिद्ध ज्ञान पहुँचाने के प्रसंग से मेल खाता है।
- source_word: ግፍዐ / ግፍዕ
  choice: हिंसा
  rationale: यह शब्द हिंसा, अत्याचार या अन्याय का अर्थ दे सकता है। यहाँ आरोप की सामाजिक और नैतिक तीव्रता बनाए रखने के लिए ‘हिंसा’ चुना गया है।
- source_word: ምግባረ
  choice: काम
  rationale: ‘काम’ आधुनिक हिन्दी में स्वाभाविक रहते हुए कर्मों या आचरणों के ठोस बहुवचन भाव को व्यक्त करता है।
- source_word: ጽርፈት
  choice: ईशनिन्दा
  rationale: यह निन्दापूर्ण, उद्दण्ड या अपवित्र वचन और व्यवहार का संकेत दे सकता है। धार्मिक-न्यायिक आरोप के इस प्रसंग में ‘ईशनिन्दा’ मुख्य पाठ में रखा गया है, जबकि व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ወሓጢአት
  choice: और पाप
  rationale: यह आरोपों की क्रमिक सूची के अन्त में व्यापक नैतिक दोष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ዘአርአይከ
  choice: तुमने … दिखाए हैं
  rationale: क्रिया का अर्थ दिखाना, प्रकट करना या ज्ञात कराना हो सकता है। मुख्य पाठ में अपेक्षाकृत तटस्थ ‘दिखाए’ रखा गया है और निषिद्ध ज्ञान प्रकट करने की सम्भावना पादटिप्पणी में दी गई है।
- source_word: ለሰብእ
  choice: मनुष्यों को
  rationale: यह सामान्य रूप से मानवजाति का बोध कराता है; ‘मनुष्यों को’ स्पष्ट और समावेशी आधुनिक हिन्दी है।
theological_decisions:
- issue: पहले पदबंध में दया और विनती का सम्बन्ध
  choice: पाठ को ‘न दया मिलेगी, न … विनती स्वीकार की जाएगी’ के रूप में दो समानान्तर निषेधों की तरह व्यक्त किया गया है।
  alternative: इसे अधिक शाब्दिक ढंग से ‘न दया, न विनती तुम्हारे लिए होगी’ कहा जा सकता है।
  rationale: मुख्य पाठ प्राकृतिक हिन्दी देता है, पर यह दावा नहीं करता कि विनती स्वयं दोषियों की है; प्रसंग में यह उनके पक्ष में की जाने वाली मध्यस्थता भी हो सकती है।
- issue: पहरेदारों के अपराध की प्रकृति
  choice: अन्तिम वाक्यांश को भ्रष्ट काम मनुष्यों को दिखाने या उनसे परिचित कराने के आरोप के रूप में रखा गया है।
  alternative: क्रिया को अधिक स्पष्ट रूप से ‘प्रकट किए’ कहकर निषिद्ध गुप्त ज्ञान के प्रकाशन पर बल दिया जा सकता है; अथवा इसे मनुष्यों के सामने किए गए कर्म समझा जा सकता है।
  rationale: निकट प्रसंग में निषिद्ध शिक्षा का विषय प्रमुख है और ‘सिखाई’ तथा ‘दिखाए’ एक-दूसरे को पुष्ट करते हैं; फिर भी मूल क्रिया स्वयं ‘दिखाने’ और ‘प्रकट करने’ दोनों अर्थों के लिए खुली है।
- issue: ጽርፈት का धार्मिक दायरा
  choice: मुख्य पाठ में ‘ईशनिन्दा’ रखा गया है।
  alternative: ‘निन्दा’, ‘धृष्टता’ या ‘अपमानजनक काम’ व्यापक अर्थ दे सकते हैं।
  rationale: धार्मिक-न्यायिक प्रसंग ‘ईशनिन्दा’ का समर्थन करता है, पर शब्द को केवल परमेश्वर-विरोधी वाणी तक सीमित करना अनिवार्य नहीं; इसलिए व्यापक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। एकवचन ‘तुम’ मूल के पुल्लिंग एकवचन प्रत्ययों को दर्शाता है। ‘न …, न …’ की रचना न्यायिक घोषणा की emphatic शक्ति बनाए रखती है।
