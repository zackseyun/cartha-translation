    reason: lexical_alternative
lexical_decisions:
- source_word: እሜሃ
  choice: तब
  rationale: यह कालक्रम सूचक पद कथा की अगली घटना आरंभ करता है; ‘तब’ समय को अनावश्यक रूप से विशिष्ट किए बिना प्रवाह बनाए रखता है।
- source_word: ሐዊርየ
  choice: मैं गया
  rationale: जाने या चलने की प्रथम-पुरुष क्रिया का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ነገርክዎሙ
  choice: उनसे बातें कीं
  rationale: बोलने या बताने की क्रिया है, जिसमें बहुवचन कर्म-प्रत्यय निहित है; प्रसंग में हनोक पहरेदारों को संबोधित करता है।
- source_word: ለኵሎሙ ኅቡረ
  choice: उन सब से एक साथ
  rationale: यह सभी को सामूहिक रूप से संबोधित किए जाने का भाव रखता है और ‘सब’ तथा ‘एक साथ’ दोनों तत्वों को सुरक्षित रखता है।
- source_word: ወእሙንቱ ኵሎሙ
  choice: वे सब
  rationale: मूल में समग्रता की पुनरावृत्ति है; उसे संक्षिप्त करके हटाया नहीं गया।
- source_word: ፈርሁ
  choice: डर गए
  rationale: सरल भय-सूचक क्रिया को परिणाम या भय के आरंभ के रूप में स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ፍርሃት
  choice: भय
  rationale: अगली शारीरिक प्रतिक्रिया के साथ जुड़ा अमूर्त भय-सूचक संज्ञा-पद; पूर्ववर्ती ‘डर गए’ के साथ मूल की पुनरुक्ति बनाए रखता है।
- source_word: ነሥአሙ
  choice: उन्हें आ घेरा
  rationale: मूल क्रिया किसी शक्ति के पकड़ लेने या आ पड़ने का बोध देती है; यह हिन्दी में उस प्रबल, बाहरी पकड़ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ወረዓድ
  choice: और कंपकंपी
  rationale: भय से होने वाले कांपने की शारीरिक अवस्था को स्पष्ट और सामान्य आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पहरेदारों की प्रतिक्रिया का स्वरूप
  choice: ‘वे सब डर गए, और भय और कंपकंपी ने उन्हें आ घेरा’ के रूप में तीव्र होती भय-प्रतिक्रिया
  alternative: ‘उन पर आतंक और थरथराहट छा गई’ अथवा केवल ‘वे बहुत डर गए’
  rationale: गीज़ में भय की क्रिया के बाद ‘भय’ और ‘कंपकंपी’ संज्ञाएँ भी आती हैं। इसलिए प्रलयदर्शी भय की क्रमिक तीव्रता को एक सामान्य वाक्य में समेटने के बजाय पुनरावृत्ति सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और कथात्मक है। ‘डर गए’ सामान्य बोधगम्यता देता है, जबकि ‘भय और कंपकंपी’ मूल की तीव्र पुनरावृत्ति और शारीरिक प्रतिक्रिया को बनाए रखता है।
