base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/059/001.yaml
  text: In those days my eyes saw the secrets of the lightnings and the lights[a], and their courses, and they flash forth for blessing and for curse[d][c][b], as the Lord of Spirits has willed.
translation:
  language: hi
  text: उन दिनों मेरी आँखों ने बिजलियों और ज्योतियों के रहस्य और उनके न्याय[a] देखे; और वे आशीष और शाप के लिए कौंधती हैं, जैसा आत्माओं के प्रभु ने चाहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मुद्रित गीइज़ पाठ के अनुसार ‘उनके न्याय’। उपलब्ध प्रतिलेखन में यहाँ अक्षर-पहचान की सम्भावित त्रुटि वाला रूप है, जिससे ‘उनका क्रम’ या ‘उनके मार्ग’ जैसा अर्थ निकाला गया है।
    reason: textual_and_lexical_uncertainty
lexical_decisions:
- source_word: በአማንቱ፡ መዋዕል
  choice: उन दिनों
  rationale: यह प्रलय-दर्शन साहित्य का प्रचलित काल-सूचक सूत्र है और गीइज़ बहुवचन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ርእያ፡ አዕይንትየ
  choice: मेरी आँखों ने ... देखे
  rationale: मूल में ‘मेरी आँखें’ स्पष्ट है; इसे बनाए रखने से दर्शन का प्रत्यक्ष और सजीव स्वर सुरक्षित रहता है।
- source_word: ኅቡኣተ
  choice: रहस्य
  rationale: इसका मूल अर्थ ‘गुप्त बातें/रहस्य’ है। इसे ‘भंडार’ कहना हनोक में प्रयुक्त भंडारों के अलग शब्द और बिंब से अनुचित रूप से मिला देता।
- source_word: መባርቅት፡ ወብርሃናት
  choice: बिजलियों और ज्योतियों
  rationale: दोनों बहुवचनों और उनके व्यापक आकाशीय अर्थ को सुरक्षित रखा गया है; ‘ज्योतियाँ’ मूल को केवल तारों तक सीमित नहीं करती।
- source_word: ወኵነኔሆሙ (मुद्रित पाठ; दिए गए प्रतिलेखन में ወአክኒሆሙ)
  choice: और उनके न्याय
  rationale: चार्ल्स 1906 के मुद्रित पाठ में न्याय करने वाले धातु-मूल से बना संज्ञा-रूप है। दिए गए प्रतिलेखन का रूप संभवतः अक्षर-पहचान की त्रुटि है; इसलिए ‘क्रम/मार्ग’ के बजाय ‘न्याय’ मुख्य पाठ में रखा गया है।
- source_word: ወይበርቁ
  choice: और वे ... कौंधती हैं
  rationale: क्रिया बिजली-जैसी चमक या कौंध व्यक्त करती है। ‘कौंधती हैं’ निकटवर्ती बिजलियों के बिंब और बहुवचन क्रिया को स्वाभाविक हिन्दी में रखता है।
- source_word: ለበረከት፡ ወለመረገም
  choice: आशीष और शाप के लिए
  rationale: मूल की समानांतर और तीखी द्विध्रुवता को बिना यह तय किए सुरक्षित रखा गया है कि ये केवल प्रभाव हैं या सौंपे गए दैवी कार्य।
- source_word: እግዚአ፡ መናፍስት
  choice: आत्माओं के प्रभु
  rationale: यह 1 हनोक की स्थिर ईश्वरीय उपाधि है; हिन्दी में उपाधि का अर्थ और गरिमा दोनों स्पष्ट रहते हैं।
theological_decisions:
- issue: आकाशीय घटनाओं का आशीष और शाप से संबंध
  choice: बिजलियाँ और ज्योतियाँ प्रभु की इच्छा के अनुसार आशीष और शाप के लिए कौंधती हैं।
  alternative: आशीष और शाप को केवल इन प्राकृतिक घटनाओं के परिणाम माना जा सकता है, न कि उन्हें सौंपे गए कार्य।
  rationale: मूल पाठ उनकी कौंध को आशीष और शाप से जोड़ता है और उसे आत्माओं के प्रभु की इच्छा के अधीन रखता है। हिन्दी अनुवाद इस दैवी शासन को बनाए रखता है, पर संबंध की कार्यविधि को अधिक स्पष्ट करके नहीं बताता।
- issue: ‘उनके न्याय’ का आशय
  choice: न्यायों को इन आकाशीय घटनाओं से संबद्ध दैवी न्यायकारी कार्यों के रूप में खुला रखा गया है।
  alternative: इसे ‘उनका क्रम’, ‘उनके मार्ग’ या प्राकृतिक व्यवस्था माना जा सकता है, यदि दिए गए प्रतिलेखित रूप को मूल माना जाए।
  rationale: मुद्रित पाठ ‘न्याय’ का समर्थन करता है, फिर भी वाक्य यह पूरी तरह स्पष्ट नहीं करता कि ये घटनाओं द्वारा किए गए न्याय हैं, उन पर हुए न्याय हैं, या उनसे संबद्ध न्यायादेश; अतः इस संबंध को अनुवाद में नहीं सुलझाया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है, पर दर्शनात्मक गरिमा के लिए ‘ज्योतियाँ’, ‘आशीष’ और स्थिर उपाधि ‘आत्माओं के प्रभु’ रखी गई हैं। वाक्य की संयोजक लय मूल के बार-बार आने वाले ‘और’ को यथासम्भव बनाए रखती है, जबकि हिन्दी की पठनीयता के लिए अर्धविराम लगाया गया है।
