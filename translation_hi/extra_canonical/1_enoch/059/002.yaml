base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/059/002.yaml
  text: And there I saw the hidden chambers of the thunder[a], and how, when it crashes in the height of heaven, its sound is heard; and he showed me the dwellings of the dry land, and the sound of the thunder, whether for peace and blessing or for a curse[c][b], according to the word of the Lord of Spirits.
translation:
  language: hi
  text: और वहाँ मैंने गर्जन के छिपे हुए कक्ष देखे। जब वह आकाश की ऊँचाई में कड़कता है, तो उसकी ध्वनि सुनाई देती है। उसने मुझे सूखी भूमि के निवास-स्थान[a] और गर्जन की ध्वनि[b] दिखाए—चाहे वह शांति और आशीष के लिए हो या शाप के लिए—आत्माओं के प्रभु के वचन के अनुसार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सूखी भूमि के निवास-स्थान’ वाला वाक्यांश पाठगत और शब्दार्थगत दृष्टि से कठिन है; इसका अधिक सामान्य अर्थ ‘पृथ्वी के बसे हुए स्थान’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: एक पाठ-साक्षी में यहाँ ‘और गर्जन की ध्वनि’ शब्द कोष्ठकों में दोहराए गए हैं। यह दोहराव मूल पाठ का भाग हो सकता है या किसी नकलनवीस द्वारा बढ़ाया गया अंश; अनुवाद में इसे रखा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ኅቡኣተ
  choice: छिपे हुए कक्ष
  rationale: बहुवचन रूप छिपी हुई वस्तुओं या स्थानों को सूचित कर सकता है। गर्जन के साथ इस प्रलय-दर्शी संदर्भ में स्थानवाचक ‘कक्ष’ उपयुक्त है और अमूर्त ‘रहस्य’ की अपेक्षा मूल बिंब को अधिक स्पष्ट रखता है।
- source_word: ነጐድጓድ
  choice: गर्जन
  rationale: शब्द सामान्यतः बादल की गर्जना या गर्जन को दर्शाता है; पद में उसकी ध्वनि पर विशेष बल है।
- source_word: ይደቅቅ
  choice: कड़कता है
  rationale: मूल क्रिया में प्रहार करने, तोड़ने या चूर करने का प्रबल भाव है। गर्जन के विषय में ‘कड़कता है’ आधुनिक हिन्दी में स्वाभाविक है और उसकी तीव्रता बनाए रखता है।
- source_word: መልዕልተ ሰማይ
  choice: आकाश की ऊँचाई में
  rationale: यह रचना आकाश के ऊपरी या ऊँचे भाग को दर्शाती है। ‘ऊँचाई’ विशिष्ट ब्रह्मांडीय बिंब को बनाए रखती है और अनावश्यक ‘से’ नहीं जोड़ती।
- source_word: ተመመንደርት የብስ
  choice: सूखी भूमि के निवास-स्थान
  rationale: वाक्यांश पाठगत और शब्दार्थगत दृष्टि से कठिन है, पर सूखी भूमि से जुड़े बसे हुए स्थानों की ओर संकेत करता प्रतीत होता है। यह अनुवाद कठिन मूल बिंब को सामान्यीकृत करके केवल ‘पृथ्वी’ नहीं बनाता।
- source_word: አስተአርአየኒ
  choice: उसने मुझे ... दिखाई
  rationale: कारक क्रिया का सीधा अर्थ ‘उसने मुझे दिखाया’ है। कर्ता को व्यक्तिगत रूप में बनाए रखना दर्शन-वृत्तांत की शैली के अनुरूप है।
- source_word: ለሰላም ወለበረከት
  choice: शांति और आशीष के लिए
  rationale: ‘शांति’ धार्मिक और ब्रह्मांडीय अर्थच्छाया को बनाए रखती है, जबकि ‘आशीष’ शाप के साथ मूल विरोध को स्पष्ट रखती है।
- source_word: ለረገም
  choice: शाप के लिए
  rationale: संज्ञा शाप या अभिशाप को सूचित करती है; ‘शाप’ संक्षिप्त, dignified और न्यायिक भाव के अनुकूल है।
- source_word: በቃለ እግዚአ መናፍስት
  choice: आत्माओं के प्रभु के वचन के अनुसार
  rationale: यह वाक्यांश परिणामों को प्रभु की वाणी या आदेश के अधीन बताता है। ‘वचन के अनुसार’ दिव्य वाणी और शासन, दोनों का भाव बनाए रखता है।
theological_decisions:
- issue: गर्जन की कल्याणकारी अथवा दंडात्मक भूमिका
  choice: गर्जन की ध्वनि शांति और आशीष अथवा शाप के लिए हो सकती है, और इसका स्वरूप दिव्य वचन के अधीन है।
  alternative: ध्वनि केवल शांति, आशीष या शाप की घोषणाओं के साथ आती है; अथवा अलग-अलग ध्वनियाँ अलग परिणामों का संकेत देती हैं।
  rationale: मूल वाक्य-विन्यास गर्जन की ध्वनि को इन परिणामों से जोड़ता है, पर संबंध का सटीक प्रकार पूरी तरह स्पष्ट नहीं करता। ‘चाहे ... हो’ इस ब्रह्मांडीय-न्यायिक अस्पष्टता को बनाए रखता है।
- issue: እግዚአ መናፍስት की उपाधि
  choice: आत्माओं का प्रभु; संबंधकारक प्रसंग में ‘आत्माओं के प्रभु’
  alternative: आत्माओं के प्रभु की जगह किसी विशेष व्याख्यात्मक ईश-उपाधि का प्रयोग
  rationale: यह 1 हनोक की स्थापित उपाधि है। शाब्दिक और स्वाभाविक हिन्दी रूप पाठ की उपाधिगत शक्ति को बिना सांप्रदायिक विस्तार के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सरल किंतु गरिमापूर्ण रखी गई है। ‘गर्जन’, ‘आकाश की ऊँचाई’, ‘आशीष’ और ‘आत्माओं के प्रभु’ जैसे पद प्रलय-दर्शी शैली और मूल ब्रह्मांडीय बिंब को बनाए रखते हैं। कठिन वाक्य-विन्यास को पठनीय बनाने के लिए तीन वाक्यों में बाँटा गया है, पर अर्थ-संबंध और वास्तविक अस्पष्टता सुरक्षित रखी गई है।
