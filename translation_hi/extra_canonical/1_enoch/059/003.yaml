base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/059/003.yaml
  text: And after this all the hidden things of the lights and of the lightnings were shown to me[c][b][a]; they flash for blessing and for abundance.
translation:
  language: hi
  text: इसके बाद ज्योतियों और बिजलियों की सारी छिपी बातें मुझे दिखाई गईं[a][b][c]; वे आशीष और प्रचुरता के लिए कौंधती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सारे रहस्य।” गीज़ पद का अधिक शाब्दिक अर्थ “सारी छिपी बातें” है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “ज्योतियाँ” विशेष रूप से आकाशीय प्रकाश-पिंडों की ओर संकेत कर सकती हैं।
    reason: cultural_note
  - marker: c
    text: उपलब्ध गीज़ लिप्यंतरण में क्रिया के पाठ को लेकर कुछ अनिश्चितता है। समीक्षित पठन का अर्थ “मुझे दिखाई गईं” है; एक वैकल्पिक सक्रिय पठन का अर्थ “मुझे दिखाया जाएगा” हो सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: ወእምድኅረዝ
  choice: इसके बाद
  rationale: यह दर्शनीय वृत्तांत में समय-क्रम बताने वाला स्वाभाविक संक्रमण है और आधुनिक हिन्दी में सहज है।
- source_word: ትርእየ ሊተ
  choice: मुझे दिखाई गईं
  rationale: समीक्षित पाठ में क्रिया को सम्भावित ተርእየ का निष्क्रिय रूप समझना प्रसंग और नवीनतम व्याकरणिक समीक्षा के अनुकूल है। दिए गए लिप्यंतरण से उत्पन्न वैकल्पिक पठन को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ኵሉ ኅቡኣቲሆሙ
  choice: सारी छिपी बातें
  rationale: यह ‘सारे रहस्य’ की अपेक्षा मूल के ‘छिपी हुई वस्तुएँ/बातें’ के अधिक निकट है और तकनीकी रहस्यवादी अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ለብርሃናት
  choice: ज्योतियों की
  rationale: ‘ज्योतियाँ’ मूल के व्यापक ‘प्रकाशों’ को बनाए रखता है, जबकि इस ब्रह्मांडीय संदर्भ में खगोलीय प्रकाश-पिंडों की सम्भावना पादटिप्पणी में दी गई है।
- source_word: ወለመባርቅት
  choice: और बिजलियों की
  rationale: बहुवचन रूप और तीव्र ब्रह्मांडीय बिंब, दोनों को बनाए रखने के लिए हिन्दी में बहुवचन रखा गया है।
- source_word: ወለበረከት
  choice: आशीष के लिए
  rationale: यहाँ उपसर्ग ለ को उद्देश्यसूचक मानकर अनुवाद किया गया है, न कि पिछले संज्ञा-समूह के समान सम्बन्धसूचक।
- source_word: ወለጽጋብ
  choice: और भरपूरी के लिए
  rationale: ‘भरपूरी’ बहुतायत या प्रचुरता का सहज, गरिमापूर्ण हिन्दी रूप है और आधुनिक आर्थिक ‘समृद्धि’ का अनावश्यक भाव नहीं जोड़ता।
- source_word: ይበርቁ
  choice: वे ... कौंधती हैं
  rationale: ‘कौंधना’ अचानक चमकने की शक्ति को व्यक्त करता है और ज्योतियों तथा बिजलियों के ब्रह्मांडीय बिंब के अनुकूल है।
theological_decisions:
- issue: क्या ‘छिपी बातें’ को तकनीकी प्रकाशन-साहित्यिक अर्थ में ‘रहस्य’ कहा जाए
  choice: सारी छिपी बातें
  alternative: सारे रहस्य
  rationale: गीज़ पद का शाब्दिक विस्तार अधिक व्यापक है; मुख्य पाठ उस व्यापकता को बनाए रखता है और ‘रहस्य’ को वैकल्पिक अर्थ के रूप में देता है।
- issue: आशीष और भरपूरी को छिपी बातों की सूची मानें या कौंधने का उद्देश्य
  choice: आशीष और भरपूरी के लिए कौंधती हैं
  alternative: आशीष और भरपूरी की छिपी बातें
  rationale: उपसर्ग ለ का उद्देश्यसूचक प्रयोग और 59:1 का समानांतर कथन इस पद-विन्यास का समर्थन करते हैं; इससे कोई विशेष समृद्धि-सिद्धांत नहीं निकाला गया है।
- issue: दर्शन की क्रिया निष्क्रिय है या द्वितीय पुरुष सक्रिय
  choice: मुझे दिखाई गईं
  alternative: तू मुझे दिखाएगा
  rationale: समीक्षित रूप ተርእየ निष्क्रिय अर्थ देता है, जबकि उपलब्ध लिप्यंतरण ትርእየ से दूसरा पठन सम्भव दिखता है। पाठ-साक्ष्य की मध्यम विश्वसनीयता के कारण विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सहज शैली रखी गई है। ‘ज्योतियाँ,’ ‘बिजलियाँ,’ ‘आशीष’ और ‘भरपूरी’ साधारण पाठक के लिए बोधगम्य हैं तथा दर्शनात्मक-ब्रह्मांडीय स्वर को बनाए रखते हैं। अर्धविराम से प्रकाशन और उसके बाद की क्रिया के बीच निकट सम्बन्ध दिखाया गया है, बिना यह पूर्णतः निश्चित किए कि ‘वे’ केवल ज्योतियों, केवल बिजलियों, या दोनों को सूचित करता है।
