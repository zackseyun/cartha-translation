base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/005.yaml
  text: And those seven holy ones brought me near and set me on the earth before the door of my house[a], and they said to me, “Make everything known to Methuselah your son, and show all your children that no flesh is righteous before the Lord[b], for he is the one who created them.”
translation:
  language: hi
  text: और उन सात पवित्र जनों ने मुझे निकट लाकर पृथ्वी पर मेरे घर के द्वार के सामने रख दिया[a]। उन्होंने मुझसे कहा, “अपने पुत्र मतूशेलह को सब कुछ बता दे, और अपनी सारी संतानों को दिखा दे कि प्रभु के सामने कोई भी देह धर्मी नहीं है[b], क्योंकि उसी ने उन्हें रचा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे घर के प्रवेश-स्थान के सामने।” गीज़ शब्द द्वार अथवा प्रवेश-क्षेत्र, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “कोई भी देह” मूल पाठ की ठोस अभिव्यक्ति को बनाए रखता है; इसका आशय नश्वर प्राणियों अथवा देहधारी मानवजाति से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: አቅረቡኒ
  choice: मुझे निकट लाकर
  rationale: कारक क्रिया में निकट लाने का दिशात्मक भाव है; यह केवल ‘ले आए’ से अधिक सटीक है।
- source_word: ፯ ቅዱሳን
  choice: सात पवित्र जनों
  rationale: यह हनोक-साहित्य के स्वर्गीय पवित्र प्राणियों का संकेत है। ‘पवित्र जन’ इस पारिभाषिक भाव को रखता है और बाद की कलीसियाई ‘संत’ शब्दावली नहीं थोपता।
- source_word: አንበሩኒ
  choice: उतारा
  rationale: क्रिया बैठाने या किसी स्थान पर रख देने का भाव देती है। स्वर्गीय यात्रा से पृथ्वी पर लौटाए जाने के प्रसंग में ‘उतारा’ स्वाभाविक हिन्दी है।
- source_word: በቅድመ ኆኅተ ቤትየ
  choice: मेरे घर के द्वार के सामने
  rationale: यह ठोस स्थान-सूचक वाक्यांश है; ‘द्वार’ और ‘के सामने’ मूल के संज्ञा तथा पूर्वसर्गीय भाव को सुरक्षित रखते हैं।
- source_word: አይድዕ ኵሎ
  choice: सब कुछ बता दे
  rationale: आज्ञार्थक क्रिया का कारक अर्थ ‘ज्ञात करा’ है। सहज आधुनिक हिन्दी में ‘सब कुछ बता दे’ उसी आदेशात्मक अर्थ को व्यक्त करता है।
- source_word: አርኢ ለኵሎሙ ውሉድከ
  choice: अपनी सारी संतानों को दिखा दे
  rationale: क्रिया का मूल अर्थ ‘दिखाना’ है। ‘संतानों’ से व्यापक वंशज-संबंध बना रहता है और इसे केवल पुत्रों तक सीमित नहीं किया जाता।
- source_word: ከመ ኢ ይጸድቅ ኵሉ ዘሥጋ
  choice: कि प्रभु के सामने कोई भी देह धर्मी नहीं है
  rationale: वाक्य सार्वभौमिक निषेध व्यक्त करता है। ‘कोई भी देह’ मूल की ठोस देह-संबंधी उपमा को बनाए रखता है, जबकि ‘धर्मी नहीं है’ बाद की औचित्य-घोषणा संबंधी शब्दावली नहीं थोपता।
- source_word: በቅድመ እግዚአ
  choice: प्रभु के सामने
  rationale: यह मूल स्थानात्मक वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: እስመ ውእቱ ፈጠሮሙ
  choice: क्योंकि उसी ने उन्हें सृजा है
  rationale: ‘उसी ने’ मूल सर्वनाम के बलाघात को सुरक्षित रखता है; ‘सृजा है’ सृष्टिकर्ता के वर्तमान संबंध को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: देह और धार्मिकता संबंधी घोषणा का अर्थ
  choice: प्रभु के सामने किसी भी देह के धर्मी न होने का सार्वभौमिक कथन
  alternative: केवल अनुष्ठानिक अशुद्धता या नश्वरता का कथन; अथवा बाद की पौलुसी शब्दावली में ‘धर्मी ठहराया जाना’
  rationale: गीज़ पाठ प्रत्यक्षतः कहता है कि कोई भी देह प्रभु के सामने धर्मी नहीं है। अनुवाद इस तनाव को बनाए रखता है और इसे किसी बाद के व्यवस्थित धर्मसिद्धान्त में नहीं बदलता।
- issue: सृष्टिकर्ता संबंधी अंतिम उपवाक्य का बल
  choice: ‘उसी ने उन्हें सृजा है’ द्वारा कर्ता पर बल
  alternative: साधारण ‘क्योंकि उसने उन्हें बनाया’
  rationale: मूल में व्यक्त सर्वनाम बलाघाती है; इसलिए हिन्दी में ‘उसी ने’ रखा गया है, बिना इस संबंध की अतिरिक्त धर्मवैज्ञानिक व्याख्या किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली अपनाई गई है। प्रत्यक्ष वचन में निकट संबोधन के अनुरूप ‘बता दे’ और ‘दिखा दे’ रखा गया है। ‘पवित्र जन’, ‘देह’ और ‘धर्मी’ जैसे शब्द अपोकैलिप्टिक तथा बाइबिलीय भाव बनाए रखते हैं, पर अनावश्यक संप्रदायगत शब्दावली से बचते हैं।
