  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पुत्र’ और ‘आज्ञा’ प्रसंग की गंभीरता बनाए रखते हैं। अंतिम दीर्घविराम स्रोत-पाठ के वास्तविक अधूरेपन को दर्शाता है।
