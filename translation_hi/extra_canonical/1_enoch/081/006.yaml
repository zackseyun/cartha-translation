    text: गीज़ पाठ में यहाँ ‘फिर/पुनः’ का संकेत है, जिसे हिंदी में ‘अगली आज्ञा’ से व्यक्त किया गया है। इसके बाद प्रयोजनसूचक ‘ताकि’ आता है, पर उपलब्ध पंक्ति वहीं अधूरी रह जाती है; इसलिए वाक्य पूरा करने के लिए ‘आज्ञा आए’ जैसी क्रिया नहीं जोड़ी गई है।
