- source_word: ዓመተ፡ አሐደ፡
  choice: एक वर्ष तक
  rationale: यह सीधा कालवाचक पद है। हिंदी में ‘एक वर्ष तक’ स्वाभाविक रूप से अवधि व्यक्त करता है।
- source_word: ነኅድገከ፡
  choice: हम तुम्हें … रहने देंगे
  rationale: क्रिया प्रथम पुरुष बहुवचन है, इसलिए ‘हम’ रखा गया है। मूल क्रिया में छोड़ने अथवा रहने देने का भाव है; इस प्रसंग में ‘रहने देंगे’ अनावश्यक परित्याग का भाव उत्पन्न किए बिना अर्थ स्पष्ट करता है।
- source_word: በኀበ፡ ወልድከ፡
  choice: तुम्हारे पुत्र के पास
  rationale: पूर्वसर्ग निकटता या संगति प्रकट करता है। ‘के पास’ आधुनिक हिंदी में स्वाभाविक है और ‘देखरेख में’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: እስከ፡ ካዕበ፡ ትእዛዝ፡
  choice: फिर अगली आज्ञा तक
  rationale: शब्दक्रम समय-सीमा और पुनरावृत्ति अथवा आगे आने वाली आज्ञा का संकेत देता है। ‘अगली आज्ञा तक’ हिंदी में संक्षिप्त है और किसी अनुल्लिखित क्रिया को नहीं गढ़ता।
- source_word: ከመ፡
  choice: ताकि…
  rationale: यह प्रयोजनसूचक संयोजक है, कोई ऐसी क्रिया नहीं जिसका अर्थ ‘आए’ हो। उपलब्ध पाठ इसके बाद कट जाता है, इसलिए दीर्घविराम से अधूरापन सुरक्षित रखा गया है।
theological_decisions:
- issue: अधिकारपूर्ण निर्देश का स्वरूप
  choice: आज्ञा
  alternative: आदेश; निर्देश
  rationale: प्रकाशनात्मक संदर्भ में यह बाध्यकारी निर्देश को व्यक्त करता है। ‘आज्ञा’ उसके अधिकारपूर्ण स्वर को बनाए रखती है, पर उसके स्रोत या बाद की किसी धर्मवैज्ञानिक धारणा को पाठ में नहीं जोड़ती।
- issue: वक्ता की संख्या
  choice: हम
  alternative: मैं
  rationale: गीज़ क्रिया प्रथम पुरुष बहुवचन है और संदर्भ में बहुवचन वक्ताओं से मेल खाती है; इसलिए एकवचन ‘मैं’ नहीं अपनाया गया।
