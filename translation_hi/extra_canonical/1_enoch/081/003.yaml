base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/003.yaml
  text: And at that time I blessed the Great Lord, the King of Glory forever, because he has made all the works of the world; and I praised the Lord for his patience, and I blessed him on account of the children of Adam.
translation:
  language: hi
  text: और उस समय मैंने महान प्रभु को—महिमा के उस राजा को, जो सदा-सर्वदा है—धन्य कहा, क्योंकि उसने संसार के सभी कार्य बनाए हैं; और मैंने प्रभु की सहनशीलता[a] के लिए उसकी स्तुति की, और आदम की संतानों[b] के विषय में उसे धन्य कहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धीरज” अथवा “सहनशील संयम”; गीइज़ शब्द में केवल निष्क्रिय प्रतीक्षा नहीं, बल्कि सहते हुए अपने को रोके रखने का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “आदम की संतानें”; यह मनुष्यों के लिए प्रयुक्त अभिव्यक्ति है और पाठ में आदम से उनका संबंध बनाए रखती है।
    reason: cultural_note
lexical_decisions:
- source_word: እምሶቤሃ
  choice: उस समय
  rationale: यह कालसूचक वाक्यांश कथात्मक और प्रकाशनात्मक शैली बनाए रखता है तथा केवल ‘तब’ से कुछ अधिक स्पष्ट है।
- source_word: ባረክዎ / ባረኩ
  choice: मैंने ... को धन्य कहा / उसे धन्य कहा
  rationale: मूल में प्रयुक्त आशीष देने के क्रियापद को सामान्य ‘स्तुति की’ में नहीं मिलाया गया, ताकि ሰባሕኩ से उसका भेद बना रहे।
- source_word: እግዚአ ዐቢይ
  choice: महान प्रभु
  rationale: यह पदवी का सीधा और गरिमापूर्ण अनुवाद है; ‘सामर्थी’ जैसी व्याख्यात्मक वृद्धि नहीं की गई।
- source_word: ንጉሠ ስብሐት
  choice: महिमा के राजा
  rationale: सम्बन्धवाचक संरचना को सुरक्षित रखते हुए उन्नत स्तुतिपरक शैली बनाए रखी गई है।
- source_word: ለዓለም
  choice: सदा के लिए
  rationale: स्तुतिपरक संदर्भ में दीर्घकालिक/अनन्त अवधि का स्वाभाविक हिन्दी रूप है।
- source_word: በከመ ገብረ ኵሎ ግብረ ዓለም
  choice: क्योंकि उसने संसार के सब कार्य बनाए हैं
  rationale: मूल के ‘कार्य/बनाना’ संबंध को यथासंभव रखा गया है और ዓለም का अनावश्यक विस्तार ‘ब्रह्मांड’ में नहीं किया गया।
- source_word: ሰባሕኩ
  choice: मैंने ... स्तुति की
  rationale: इसे ‘धन्य कहा’ से अलग रखा गया है, क्योंकि मूल में दो निकट लेकिन भिन्न क्रियाएँ हैं।
- source_word: ትዕግሥቱ
  choice: उसकी सहनशीलता
  rationale: यह धैर्य के साथ संयमपूर्वक सहते रहने का भाव व्यक्त करता है; व्यापक अर्थ-पहलू पादटिप्पणी में दिया गया है।
- source_word: ዲበ ውሉደ አዳም
  choice: आदम की संतानों के विषय में
  rationale: ዲበ की संदर्भगत लचक को कारण अथवा हितार्थ अर्थ में सीमित किए बिना ‘के विषय में’ से व्यक्त किया गया है; आदम से जुड़ी वंशगत अभिव्यक्ति सुरक्षित है।
theological_decisions:
- issue: ውሉደ አዳም का अनुवाद
  choice: आदम की संतानें
  alternative: मनुष्यजाति / आदम के पुत्र
  rationale: यह मूल की आदम-संबंधी मानव-वंश की प्रतिध्वनि बनाए रखता है, पर उसे केवल पुरुषों तक सीमित नहीं करता और न ही अमूर्त ‘मनुष्यजाति’ में समतल करता है।
- issue: ዲበ का संबंधगत अर्थ
  choice: के विषय में
  alternative: के कारण / के लिए / के ऊपर
  rationale: पूर्वसर्ग यहाँ अर्थ की दृष्टि से लचीला है। ‘के विषय में’ कारण, लाभ या प्रतिकूलता का ऐसा अर्थ आरोपित नहीं करता जिसे स्थानीय पाठ निश्चित रूप से नहीं बताता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘धन्य कहा’ और ‘स्तुति की’ को अलग रखकर मूल के दो क्रियापदों का अंतर सुरक्षित किया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
