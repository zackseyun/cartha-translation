base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/004.yaml
  text: 'And from it And from it I said: blessed is the man who dies righteous and good, upon whom no book of wrongdoing has been written, and for whom no day of judgment will be found.: blessed is the man who dies righteous and good, upon whom no book of wrongdoing has been written, and for whom no day of judgment will be found.'
translation:
  language: hi
  text: तब मैंने कहा, “धन्य है वह मनुष्य जो धर्मी और भला होकर मरता है; जिस पर अधर्म की कोई पुस्तक नहीं लिखी गई है, और जिसके लिए न्याय का कोई दिन नहीं पाया जाएगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शब्दशः: “और जिसके लिए न्याय का दिन नहीं पाया जाएगा।” ‘उसके लिए’ का संबंध अस्पष्ट है; इसे अनिवार्य रूप से ‘उसके विरुद्ध’ नहीं समझना चाहिए।'
    reason: गीज़ संबंधसूचक अभिव्यक्ति तथा ‘न्याय का दिन पाया जाएगा’ के असामान्य मुहावरे की अस्पष्टता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ወእምኔሁ፡ እቤ
  choice: तब मैंने कहा
  rationale: शब्दशः संरचना ‘और उससे/उसके विषय में मैंने कहा’ है, पर प्रसंगसूचक እምኔሁ को स्वाभाविक हिन्दी में ‘तब’ कहना वाक्य के प्रवाह को सुरक्षित रखता है।
- source_word: ብፁዕ፡ ብእሲ
  choice: धन्य है वह मनुष्य
  rationale: ብፁዕ आशीषपूर्ण या सौभाग्यशाली दशा बताता है; ‘धन्य’ आधुनिक बाइबिलीय हिन्दी में संक्षिप्त और प्रतिष्ठित समतुल्य है।
- source_word: ዘይመውት፡ ጻድቅ፡ ወኄር
  choice: जो धर्मी और भला होकर मरता है
  rationale: मूल में ‘जो मरता है—धर्मी और भला’ जैसी संक्षिप्त रचना है। ‘होकर’ मृत्यु के समय उसकी वर्णित दशा को व्यक्त करता है, बिना यह तय किए कि विशेषण उसके पूरे जीवन या केवल मृत्यु की रीति पर बल देते हैं।
- source_word: መጽሐፈ፡ ዐመፃ
  choice: अधर्म की ... पुस्तक
  rationale: መጽሐፍ का मूल अर्थ ‘पुस्तक/लिखित अभिलेख’ और ዐመፃ का अर्थ अधर्म, अपराध या विद्रोह हो सकता है। ‘अधर्म की पुस्तक’ न्यायिक अभिलेख की छवि को बनाए रखता है।
- source_word: ዕለተ፡ ኵነኔ
  choice: न्याय का ... दिन
  rationale: ኵነኔ न्याय करने के साथ दोषदंड/दोषसिद्धि का भाव भी रख सकता है। ‘न्याय’ अपेक्षाकृत व्यापक है और यह पूर्वनिर्णय नहीं करता कि परिणाम अनिवार्यतः दंड ही होगा।
theological_decisions:
- issue: ‘न्याय का दिन नहीं पाया जाएगा’ का आशय
  choice: असामान्य मूल मुहावरे को मुख्य पाठ में यथासंभव बनाए रखा गया
  alternative: ‘उसे न्याय के दिन दोषी नहीं ठहराया जाएगा’ या ‘उसके लिए न्याय का दिन नहीं होगा’
  rationale: मूल वाक्य व्यक्ति के विरुद्ध न्याय-दिवस ‘पाए जाने’ की बात करता है। इसे सीधे दोषमुक्ति या न्याय-दिवस की अनुपस्थिति में बदलना निहितार्थ को आवश्यकता से अधिक स्पष्ट कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और सामान्य पाठक के लिए स्पष्ट रखी गई है। न्यायिक ‘पुस्तक’ तथा ‘न्याय का दिन’ जैसी मूल छवियाँ सरल व्याख्या से प्रतिस्थापित नहीं की गईं।
