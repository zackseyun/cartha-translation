base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/001.yaml
  text: And he said to me[a], “Look, Enoch, at the tablets of heaven, and read what is written on them, and understand everything[c][b], one by one.”
translation:
  language: hi
  text: और उसने मुझसे कहा, “हे हनोक, स्वर्ग की पट्टिकाओं को देखो और उन पर जो लिखा है उसे पढ़ो, और सब कुछ एक-एक करके समझो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “स्वर्ग की पट्टिकाएँ” प्रलयदर्शी साहित्य में स्वर्ग में रखे लिखित अभिलेखों की छवि है; यह केवल अमूर्त ज्ञान का रूपक नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: ነጽር
  choice: देखो
  rationale: दृष्टि डालने की सीधी आज्ञा है; आधुनिक हिन्दी में ‘देखो’ स्वाभाविक है और अनावश्यक पुरातनता से बचता है।
- source_word: ዘፀፍፀፈ ሰማይ
  choice: आकाश की पटियाएँ
  rationale: यह अनुवाद स्वर्गीय लिखित अभिलेखों की ठोस प्रलयदर्शी छवि को बनाए रखता है; इसे केवल ‘पुस्तकें’ या अमूर्त ‘अभिलेख’ नहीं बनाया गया।
- source_word: አንብብ
  choice: पढ़ो
  rationale: यह पढ़ने की स्पष्ट आज्ञा है; प्रसंग में ‘ऊँचे स्वर से पढ़ो’ आवश्यक नहीं है।
- source_word: ዘጽሑፍ ዲቤሆሙ
  choice: उन पर जो लिखा है
  rationale: सम्बन्धवाचक वाक्यांश पटियाओं की ओर लौटता है और आधुनिक हिन्दी में सहज रूप से व्यक्त होता है।
- source_word: እእምር
  choice: समझो
  rationale: यह केवल जानने के बजाय पढ़ी हुई बात का अर्थ ग्रहण करने की संज्ञानात्मक शक्ति व्यक्त करता है।
- source_word: ኵሎ አሐደ አሐደ
  choice: सब कुछ एक-एक करके
  rationale: दोहराया गया ‘एक-एक’ वितरणात्मक बल रखता है और प्रत्येक बात को अलग-अलग समझने का भाव स्वाभाविक हिन्दी में सुरक्षित करता है।
theological_decisions:
- issue: स्वर्गीय अभिलेखों की प्रलयदर्शी छवि
  choice: आकाश की पटियाएँ
  alternative: स्वर्गीय पटियाएँ; आकाश की पुस्तकें
  rationale: मूल की ठोस पटिया-छवि को बनाए रखा गया है। ‘पुस्तकें’ कहना छवि को बदल देता, जबकि ‘आकाश की’ मूल सम्बन्धवाचक रचना को अधिक निकटता से दर्शाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘हे हनोक’ संबोधन को स्पष्ट और साहित्यिक रखा गया है। वितरणात्मक मूल वाक्यांश को ‘एक-एक करके’ से व्यक्त किया गया है।
