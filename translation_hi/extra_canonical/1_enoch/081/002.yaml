base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/002.yaml
  text: And I looked at the tablets of heaven[a], and I read all that was written, and I understood it all; and I read the book of all the deeds of humankind and of all the children of flesh upon the earth[d][c][b], to the generations of eternity.
translation:
  language: hi
  text: और मैंने स्वर्ग की पट्टिकाओं को देखा, और जो कुछ लिखा था वह सब पढ़ा और सब समझ लिया; फिर मैंने मनुष्यों के सभी कर्मों और पृथ्वी पर की देह की सभी संतानों की पुस्तक[a] पढ़ी—अनन्त काल की पीढ़ियों तक।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनुष्यों के सभी कर्मों और पृथ्वी पर की देह की सभी संतानों के विषय में पुस्तक।” गीज़ की संबंधकारक रचना को पुस्तक की विषयवस्तु बताने वाली रचना के रूप में भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “अनन्त पीढ़ियों तक” या “पीढ़ी-दर-पीढ़ी सदा तक” भी हो सकता है। यह पद व्यापक, मुहावरेदार काल-अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ነጸርኩ
  choice: मैंने ... देखा
  rationale: दर्शन-वर्णन में देखने की सीधी क्रिया को स्वाभाविक आधुनिक हिन्दी में रखता है; ‘निहारा’ अनावश्यक रूप से काव्यात्मक होता।
- source_word: በፀፍፀፈ ሰማይ
  choice: स्वर्ग की पट्टिकाओं को
  rationale: अपोकैलिप्टिक साहित्य की ठोस लिखित पट्टिकाओं की छवि सुरक्षित रहती है; इसे ‘पुस्तक’ या ‘अभिलेख’ कहकर समतल नहीं किया गया।
- source_word: አንበብኩ ኵሎ ዘጽሑፍ
  choice: जो कुछ लिखा था वह सब पढ़ा
  rationale: ኵሎ की समग्रता और लिखे हुए विषय के निष्क्रिय भाव—दोनों को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: አእመርኩ ኵሎ
  choice: सब समझ लिया
  rationale: यह केवल जान लेने के बजाय लिखे हुए का बोध प्राप्त करने का अर्थ संदर्भ में अधिक ठीक व्यक्त करता है।
- source_word: አንበብክዋ ለመጽሐፈ
  choice: पुस्तक ... पढ़ी
  rationale: सर्वनामिक रूप और स्पष्ट कर्म ‘पुस्तक’ को सहज हिन्दी वाक्य-विन्यास में प्रस्तुत करता है और पढ़ने की पुनरुक्ति बनाए रखता है।
- source_word: ኵሉ ምግባሮሙ ለሰብእ
  choice: मनुष्यों के सभी कर्मों
  rationale: ምግባር के कर्म/कार्य/आचरण के अर्थक्षेत्र में ‘कर्म’ संक्षिप्त और गरिमापूर्ण है; ሰብእ को सार्वभौमिक मानव-संदर्भ में ‘मनुष्यों’ कहा गया है।
- source_word: ውሉደ ሥጋ
  choice: देह की संतानों
  rationale: मूल की सामी-शैली वाली मानवशास्त्रीय छवि को ‘नश्वर मनुष्य’ में विलीन किए बिना हिन्दी में समझने योग्य रखता है।
- source_word: ዘዲበ ምድር
  choice: पृथ्वी पर के
  rationale: मूल का क्रियारहित संबंधवाचक भाव बचाता है और ‘हैं’ अथवा ‘होंगे’ जोड़कर कोई अप्रकट काल निर्धारित नहीं करता।
- source_word: እስከ ትውልደ ዓለም
  choice: अनन्त काल की पीढ़ियों तक
  rationale: अपोकैलिप्टिक विस्तार और पीढ़ियों की ठोस धारणा दोनों सुरक्षित रहते हैं; केवल ‘सदा तक’ कहना मूल छवि को समतल कर देता।
theological_decisions:
- issue: मानवशास्त्रीय पद ውሉደ ሥጋ
  choice: देह की संतानों
  alternative: सभी नश्वर मनुष्य
  rationale: शाब्दिक छवि पृथ्वी के देहधारी मनुष्यों और स्वर्गीय अभिलेखों के बीच का अपोकैलिप्टिक तनाव बनाए रखती है; अधिक मुहावरेदार विकल्प अर्थ स्पष्ट करता, पर स्रोत की बनावट खो देता।
- issue: पृथ्वी पर रहने वालों का काल
  choice: पृथ्वी पर के
  alternative: जो पृथ्वी पर होंगे
  rationale: गीज़ पदबंध क्रियारहित है। भविष्यकाल जोड़ने से अनन्त पीढ़ियों का भाव स्पष्ट हो सकता है, पर वह मूल में व्यक्त न किए गए काल को निश्चित कर देगा।
- issue: पुस्तक की विषयवस्तु का संबंध
  choice: मनुष्यों के सभी कर्मों ... की पुस्तक
  alternative: मनुष्यों के सभी कर्मों के विषय में पुस्तक
  rationale: संबंधकारक रचना की वास्तविक अस्पष्टता को मुख्य पाठ में संक्षिप्त रूप से रखा गया है; पादटिप्पणी व्याख्यात्मक विकल्प देती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘पट्टिकाएँ’, ‘देह की संतानें’ और ‘अनन्त काल की पीढ़ियाँ’ जैसे पद मूल की अपोकैलिप्टिक ठोसता बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
