base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/002.yaml
  text: And he lifted up his feet from there and went as far as the ends of the earth[a], and he cried out to his grandfather Enoch, and Noah said with a bitter voice, “Hear me, hear me[d][c][b], hear me,” three times.
translation:
  language: hi
  text: और वह वहाँ से अपने पैर उठाकर पृथ्वी के छोरों तक गया, और उसने अपने पूर्वज हनोक को पुकारा। नूह ने कड़वे स्वर में कहा, “मेरी सुनो, मेरी सुनो, मेरी सुनो”—तीन बार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አንሥአ፡ እገሪሁ
  choice: अपने पैर उठाकर
  rationale: शाब्दिक शारीरिक बिंब को बनाए रखता है; प्रसंग में यह वहाँ से चल पड़ने को व्यक्त करता है।
- source_word: እምህየ
  choice: वहाँ से
  rationale: दृष्टांत में पूर्व स्थान से प्रस्थान का स्वाभाविक आधुनिक हिन्दी संकेत।
- source_word: ሖረ
  choice: गया
  rationale: साधारण गतिवाचक क्रिया है; यात्रा के ढंग के बारे में अतिरिक्त अर्थ नहीं जोड़ती।
- source_word: እስከ፡ አጽናፈ፡ ምድር
  choice: पृथ्वी के छोरों तक
  rationale: महाप्रलय-संबंधी दर्शन के व्यापक भौगोलिक और ब्रह्मांडीय मुहावरे को सुरक्षित रखता है।
- source_word: ጸርኀ
  choice: पुकारा
  rationale: ऊँचे स्वर से पुकारने का भाव देता है और हिन्दी में सहज है।
- source_word: ለአምኄው፡ ሄኖክ
  choice: अपने परदादा हनोक को
  rationale: አምኄው का अर्थ उसके दादा/पूर्वज से संबंधित है; वंशावली में हनोक नूह के परदादा हैं, इसलिए संदर्भानुकूल सटीक संबंध चुना गया है।
- source_word: በቃል፡ መሪር
  choice: कड़वे स्वर में
  rationale: वाणी की तीखी, शोकपूर्ण भाव-गुणवत्ता को बिना सामान्यीकृत किए सुरक्षित रखता है।
- source_word: ስምዐኒ
  choice: मेरी सुनो
  rationale: आज्ञार्थक क्रिया और प्रथम पुरुष कर्म को स्वाभाविक, तात्कालिक हिन्दी में व्यक्त करता है।
- source_word: ሥልሰ
  choice: तीन बार
  rationale: तीनfold पुनरावृत्ति को आधुनिक पाठक के लिए स्पष्ट रूप से बताता है।
theological_decisions:
- issue: हनोक से नूह का वंश-संबंध
  choice: अपने परदादा हनोक
  alternative: अपने पूर्वज हनोक / अपने दादा हनोक
  rationale: गीज़ पद አምኄው को ‘उसका पुत्र’ समझना शब्दार्थ की दृष्टि से उचित नहीं है। यह दादा अथवा पूर्वज-संबंध बताता है; उत्पत्ति-परंपरा के अनुसार हनोक नूह के परदादा हैं।
- issue: ወይቤ፡ ኖኅ में वक्ता की पहचान
  choice: और नूह ने ... कहा
  alternative: और उसने कहा, ‘नूह...’
  rationale: गीज़ की सामान्य क्रिया–कर्ता शब्द-व्यवस्था में नूह ‘कहा’ का स्पष्ट कर्ता है, संबोधन या उद्धरण का भाग नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज कथात्मक शैली। ‘हनोक’ और ‘नूह’ प्रचलित हिन्दी बाइबलीय नाम-रूप हैं। मूल की तीन बार दोहराई गई पुकार को ज्यों का त्यों रखा गया है।
