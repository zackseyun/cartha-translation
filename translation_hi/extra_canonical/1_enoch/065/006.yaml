base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/006.yaml
  text: And a command went out from before the Lord against those who dwell on the dry land[a], that their end should come; for they knew all the hidden things of the angels, and all the violence of the satans[c][b], and all their secret powers.
translation:
  language: hi
  text: और प्रभु के सम्मुख से सूखी भूमि पर रहनेवालों के विरुद्ध एक आज्ञा निकली[a], कि उनका अंत आ जाए; क्योंकि वे स्वर्गदूतों की सब गुप्त बातें, शैतानों[b] की सारी हिंसा और उनकी सारी गुप्त शक्तियाँ[c] जान गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “प्रभु के मुख के सामने से।” यह गीज़ में किसी बात के परमेश्वर की उपस्थिति से निकलने का श्रद्धापूर्ण मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: मूल पाठ में “शैतान” बहुवचन में है; यहाँ बाद में प्रचलित एकवचन व्यक्तिवाचक नाम “शैतान” नहीं है।
    reason: lexical_alternative
  - marker: c
    text: इस गीज़ साक्ष्य के अंतिम शब्द कठिन हैं। अर्थ “उनकी सारी छिपी शक्तियाँ” हो सकता है; कुछ व्याख्याएँ इसे गुप्त कलाओं या जादू-टोने से जुड़े लोगों की ओर संकेत मानती हैं।
    reason: textual_variant
lexical_decisions:
- source_word: ትእዛዝ
  choice: आज्ञा
  rationale: यह शब्द अधिकारपूर्वक दिए गए आदेश को व्यक्त करता है; ‘आज्ञा’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसके दैवी अधिकार को बनाए रखता है।
- source_word: ወጽአ እምቅድመ ገጸ እግዚአ
  choice: प्रभु के सम्मुख से ... निकली
  rationale: यह सामी शैली का श्रद्धापूर्ण प्रयोग है, जिसमें आज्ञा को प्रभु की उपस्थिति से निकलते हुए दिखाया गया है।
- source_word: ዲበ እለ የሐድሩ የብስ
  choice: सूखी भूमि पर रहनेवालों के विरुद्ध
  rationale: የብስ का मूल अर्थ सूखी भूमि है। जलप्रलय के प्रसंग में यह चित्र ‘पृथ्वी’ जैसे व्यापक शब्द से अधिक स्पष्ट रूप से सुरक्षित रहता है।
- source_word: ከመ ውእቱ ይኩን ሕልቀትሙ
  choice: कि उनका अंत आ जाए
  rationale: ሕልቀት अंत, विनाश या नाश होने का भाव दे सकता है। यह अनुवाद अंतिमता को रखता है, पर विनाश की ठीक रीति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: አእመሩ
  choice: जान गए थे
  rationale: क्रिया यहाँ निषिद्ध या छिपे ज्ञान को प्राप्त कर लेने का भाव दे सकती है; ‘जान गए थे’ कारणसूचक वाक्य में स्वाभाविक है।
- source_word: ኵሎ ኅቡኣተ መላእክት
  choice: स्वर्गदूतों की सब गुप्त बातें
  rationale: यह छिपी या गुप्त वस्तुओं/बातों को सूचित करता है। ‘गुप्त बातें’ मूल की व्यापकता बनाए रखता है और किसी बाद की पारिभाषिक धारणा को नहीं जोड़ता।
- source_word: ግፍዐ ሰይጣናት
  choice: शैतानों की सारी हिंसा
  rationale: ግፍዐ में हिंसा, अत्याचार या अन्याय का अर्थ हो सकता है। ሰይጣናት बहुवचन है, इसलिए हिन्दी में भी बहुवचन रखा गया है।
- source_word: ኃይሎሙ ኅቡአ / ኅቡኣት
  choice: उनकी सारी गुप्त शक्तियाँ
  rationale: पंक्ति का अंत पाठगत रूप से कठिन है, पर शक्ति और गुप्तता का संबंध स्पष्ट है। बहुवचन ‘शक्तियाँ’ प्रसंग के सामूहिक भाव और उपलब्ध परामर्श-पाठ के अनुरूप है।
theological_decisions:
- issue: ሰይጣናት का बहुवचन
  choice: शैतानों
  alternative: शैतान; विरोधियों; दुष्टात्माओं
  rationale: गीज़ रूप स्पष्टतः बहुवचन है। इसे एकवचन व्यक्तिवाचक नाम बनाने से पाठ की अपनी दानव-विषयक बनावट बाद की धारणा के अनुसार बदल जाती।
- issue: सूखी भूमि पर रहनेवालों पर न्याय का क्षेत्र
  choice: जलप्रलय के न्याय के अधीन स्थलीय निवासी
  alternative: सामान्य रूप से पृथ्वी के सभी निवासी; पापियों का कोई विशिष्ट वर्ग
  rationale: नूह और आनेवाले जलप्रलय के प्रसंग में ‘सूखी भूमि’ का ठोस चित्र अर्थपूर्ण है। मुख्य पाठ उस चित्र को व्याख्यात्मक रूप से समतल नहीं करता।
- issue: अंतिम कठिन पदबंध का अर्थ
  choice: उनकी सारी गुप्त शक्तियाँ
  alternative: उनकी सारी छिपी सामर्थ्य; गुप्त कलाओं अथवा जादू-टोने के साधक
  rationale: उपलब्ध गीज़ साक्ष्य में अंतिम शब्द कठिन/दोहराया हुआ है। मुख्य पाठ निकटतम व्याकरणिक अर्थ रखता है और जादू-टोने के साधकों को स्पष्ट रूप से जोड़ने से बचता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर प्रकाशनयोग्य गरिमा और प्राचीन प्रकाशनात्मक शैली बनाए रखने के लिए ‘प्रभु के सम्मुख से’ तथा ‘आज्ञा निकली’ जैसे पद रखे गए हैं। वाक्य को सहज बनाने के लिए सामान्य हिन्दी क्रम अपनाया गया है; मूल की अस्पष्टताओं को पादटिप्पणियों में सुरक्षित रखा गया है।
