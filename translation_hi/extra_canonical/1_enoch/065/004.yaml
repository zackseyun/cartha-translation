base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/004.yaml
  text: And after that time there came a great upheaval upon the earth[a], and a voice was heard from heaven[b], and I fell on my face.
translation:
  language: hi
  text: और उस समय के बाद पृथ्वी पर बड़ी उथल-पुथल मची[a], और स्वर्ग से एक आवाज़ सुनाई दी; तब मैं मुँह के बल गिर पड़ा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उथल-पुथल’ के लिए प्रयुक्त शब्द का अर्थ ‘अशांति,’ ‘कोलाहल,’ ‘अव्यवस्था’ या ‘कम्पन’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'अंतिम खंड का उपलब्ध पाठ कठिन है: क्रिया का रूप बहुवचन-जैसा, ‘वे गिरे,’ प्रतीत होता है, पर ‘मेरे चेहरे पर’ में लगा प्रत्यय प्रथम पुरुष एकवचन की ओर संकेत करता है। निकटवर्ती प्रथम-पुरुष कथन के अनुसार अनुवाद में ‘मैं मुँह के बल गिर पड़ा’ रखा गया है।'
    reason: textual_variant
lexical_decisions:
- source_word: በድኅሬ ውእቱ ጊዜ
  choice: उस समय के बाद
  rationale: यह समय-क्रम और ውእቱ के संकेतवाचक भाव—‘उस’—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ሀውክ ዐቢይ
  choice: बड़ी उथल-पुथल
  rationale: ሀውክ अशांति, हलचल, अव्यवस्था या कम्पन का बोध करा सकता है। ‘उथल-पुथल’ व्यापक प्रलय-दर्शी प्रभाव को बनाए रखती है और इसे केवल भूकम्प या राजनीतिक अशांति तक सीमित नहीं करती।
- source_word: ዲበ ምድር
  choice: पृथ्वी पर
  rationale: प्रलय-दर्शी और विश्वव्यापी प्रसंग में ‘पृथ्वी’ स्थानीय ‘देश’ या ‘भूमि’ की अपेक्षा अधिक उपयुक्त है।
- source_word: ተሰምዐ ቃል እምሰማይ
  choice: स्वर्ग से एक आवाज़ सुनाई दी
  rationale: ቃል का अर्थ वचन, आवाज़ या ध्वनि हो सकता है। प्रकाशनात्मक प्रसंग में ‘आवाज़’ स्वर्गीय कथन का संकेत देती है, पर कथित शब्दों को अनावश्यक रूप से नहीं जोड़ती।
- source_word: ወወደቁ በገጽየ
  choice: तब मैं मुँह के बल गिर पड़ा
  rationale: उपलब्ध पाठ में क्रिया का रूप बहुवचन-जैसा है, जबकि በገጽየ में प्रथम पुरुष एकवचन ‘मेरे मुँह/मुख’ स्पष्ट है। निकटवर्ती प्रथम-पुरुष कथन के अनुरूप मुख्य पाठ में ‘मैं ... गिर पड़ा’ रखा गया है और पाठगत कठिनाई पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: ሀውክ से सूचित विक्षोभ का स्वरूप
  choice: व्यापक प्रलय-दर्शी उथल-पुथल
  alternative: बड़ी अशांति, भारी कोलाहल, या बड़ा कम्पन
  rationale: शब्द को केवल मनोवैज्ञानिक, राजनीतिक या भूकम्पीय घटना मानना मूल की अर्थ-सीमा को संकुचित कर देगा। ‘उथल-पुथल’ पृथ्वी और न्याय से जुड़े व्यापक प्रलय-दर्शी तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज शैली। ‘मुँह के बल गिर पड़ा’ सामान्य पाठक के लिए स्वाभाविक है और दण्डवत् होने का भाव किसी विशेष अनुष्ठानिक शब्दावली के बिना व्यक्त करता है।
