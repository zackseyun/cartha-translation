  text: In those days Noah saw that the earth had sunk down[a], and that its destruction was near.
translation:
  language: hi
  text: उन दिनों नूह ने देखा कि पृथ्वी धँस गई थी[a] और उसका विनाश निकट था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह गीज़ पद शब्दार्थ की दृष्टि से कठिन है। इसका संकेत यह भी हो सकता है कि पृथ्वी नीचे बैठ गई थी, ढह गई थी या प्रचंड रूप से हिल गई थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ፡ መዋዕል
  choice: उन दिनों
  rationale: यह प्रकाशनात्मक वर्णन में प्रयुक्त एक मानक कालसूचक पदबंध है और मूल की गरिमापूर्ण, आवर्ती शैली को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ርእየ
  choice: देखा
  rationale: मूल क्रिया का सीधा और स्वाभाविक अर्थ है; इससे अनावश्यक पुरातनता जोड़े बिना दर्शनात्मक वृत्तांत का भाव बना रहता है।
- source_word: ኖኅ
  choice: नूह
  rationale: नाम का प्रचलित आधुनिक हिन्दी बाइबलीय रूप अपनाया गया है।
- source_word: ምድረ
  choice: पृथ्वी
  rationale: इस प्रलय-संबंधी प्रकाशनात्मक प्रसंग में आशय केवल स्थानीय भूमि से नहीं, व्यापक पृथ्वी से है।
- source_word: ከመ፡ አጽነነት
  choice: कि पृथ्वी धँस गई थी
  rationale: गीज़ पद कठिन है और पृथ्वी के नीचे बैठने, ढहने या हिलकर अस्थिर होने का संकेत दे सकता है। ‘धँस गई थी’ दृश्य भौतिक बिंब को बनाए रखता है, पर कारण को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ወከመ፡ ቅሩብ፡ ሐጕላ
  choice: और उसका विनाश निकट था
  rationale: ቅሩብ निकटता व्यक्त करता है और ሐጕላ यहाँ विनाश या बरबादी के अर्थ में उपयुक्त है। ‘उसका’ विनाश को अभी उल्लिखित पृथ्वी से जोड़ता है।
theological_decisions:
- issue: पृथ्वी की दशा को नैतिक भ्रष्टता माना जाए या भौतिक अस्थिरता
  choice: भौतिक अस्थिरता—‘पृथ्वी धँस गई थी’
  alternative: ‘पृथ्वी भ्रष्ट हो गई थी’ या ‘पृथ्वी हिल गई थी’
  rationale: मूल में नूह द्वारा देखी गई पृथ्वी की दशा का दृश्य, प्रलयकारी बिंब अधिक स्वाभाविक है। अनुवाद इसे सामान्य नैतिक दुष्टता में बदलकर प्रकाशनात्मक तनाव को समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली। ‘धँस गई थी’ मूल की वास्तविक शब्दार्थगत अनिश्चितता को पाद-टिप्पणी सहित सुरक्षित रखता है।
