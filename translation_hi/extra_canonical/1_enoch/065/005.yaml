base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/005.yaml
  text: And my grandfather Enoch came and stood beside me[a], and he said to me[b], “Why have you cried out to me with a bitter cry and weeping?”
translation:
  language: hi
  text: और मेरे दादा हनोक आकर मेरे पास खड़े हो गए और मुझसे कहा, “तुमने कड़वे विलाप के साथ रोते हुए मुझे क्यों पुकारा?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መጽአ
  choice: आकर
  rationale: यह सामान्य गति-सूचक क्रिया है; कथात्मक क्रम में ‘आकर’ स्वाभाविक और सीधा है।
- source_word: እምሐው*የ
  choice: मेरे दादा
  rationale: प्राप्त पाठ में चिह्नित रूप OCR-विकृति प्रतीत होता है और प्रसंग तथा संशोधित पाठ-साक्ष्य के अनुसार इसका अर्थ प्रथम पुरुष संबंधसूचक प्रत्यय सहित ‘मेरे दादा’ है, न कि ‘मेरे निवास-स्थान से’।
- source_word: ቆመ ኀቤየ
  choice: मेरे पास खड़े हो गए
  rationale: क्रिया और निकटता-सूचक पद का यह स्वाभाविक हिन्दी रूप है, जो शारीरिक समीपता बनाए रखता है।
- source_word: በምንት
  choice: क्यों
  rationale: कारण पूछने वाले प्रश्न का सबसे स्पष्ट और सहज हिन्दी समतुल्य।
- source_word: ጸራሕከ ኀቤየ
  choice: मुझे क्यों पुकारा
  rationale: क्रिया ऊँची आवाज़ में पुकारने या चिल्लाने का बोध देती है; यहाँ संबोधित व्यक्ति की ओर पुकारने के अर्थ में ‘मुझे पुकारा’ स्वाभाविक है।
- source_word: ጽራኀ መሪረ
  choice: कड़वे विलाप के साथ
  rationale: यह पद गहरे दुःख से भरी तीव्र पुकार व्यक्त करता है; ‘कड़वा विलाप’ भावात्मक तीव्रता और संक्षिप्तता दोनों रखता है।
- source_word: ብካየ
  choice: रोते हुए
  rationale: यह रोने अथवा विलाप करने को दर्शाता है और पहले पद के साथ मिलकर दुःख की दोहरी अभिव्यक्ति सुरक्षित रखता है।
theological_decisions:
- issue: हनोक से वक्ता का संबंध
  choice: ‘मेरे दादा हनोक’
  alternative: ‘हनोक मेरे निवास-स्थान से आया’
  rationale: नवीन पाठ-समीक्षा के अनुसार संदिग्ध OCR रूप संबंधवाचक ‘मेरे दादा’ का विकृत पाठ है। यह चयन निकटतम स्रोत-पाठ और अध्याय के कथात्मक प्रसंग से समर्थित है; पूर्व स्थानवाचक अर्थ को बनाए रखना वास्तविक पाठगत भूल को संरक्षित करना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली रखी गई है। ‘कड़वे विलाप’ से मूल की भावात्मक तीव्रता और ‘रोते हुए’ से समानांतर शोक-अभिव्यक्ति सुरक्षित है। किसी अस्पष्टता की आवश्यकता न होने के कारण पादटिप्पणी नहीं दी गई।
