base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/003.yaml
  text: And I said to him[a], “Tell me, what is this that is being done upon the earth? For the earth has labored thus and has been shaken[c][b]; perhaps I will perish with it.”
translation:
  language: hi
  text: और मैंने उससे कहा, “मुझे बताओ, यह क्या है जो पृथ्वी पर हो रहा है? क्योंकि पृथ्वी ने इस प्रकार कष्ट उठाया है[a] और वह हिल उठी है[b]; कहीं मैं भी उसके साथ नष्ट न हो जाऊँ।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कठिन गीइज़ क्रिया का अनुवाद “इस प्रकार प्रसव-पीड़ा से तड़पी है” भी हो सकता है। यहाँ व्यापक “कष्ट उठाया है” रखा गया है, ताकि पृथ्वी की तीव्र व्यथा की छवि बनी रहे और प्रसव का अर्थ अनिवार्य न किया जाए।
    reason: lexical_alternative
  - marker: b
    text: या “काँप उठी है” अथवा “बुरी तरह झकझोरी गई है।”
    reason: lexical_alternative
  - marker: c
    text: अंतिम वाक्यांश का अनुवाद “शायद मैं भी उसके साथ नष्ट हो जाऊँ” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ንግረኒ
  choice: मुझे बताओ
  rationale: यह आज्ञार्थक क्रिया और प्रथम पुरुष कर्म-प्रत्यय का स्वाभाविक, सीधा हिन्दी रूप है।
- source_word: ምንት ውእቱ ዘይትገበር
  choice: यह क्या है जो ... हो रहा है
  rationale: रचना वर्तमान में घट रही क्रिया और संकेतवाचक ‘यह’—दोनों को बनाए रखती है।
- source_word: ዲበ ምድር
  choice: पृथ्वी पर
  rationale: यह स्थानवाचक पद का स्पष्ट और स्वाभाविक हिन्दी अनुवाद है।
- source_word: እስመ ከመዝ ሰርሐት ምድር
  choice: क्योंकि पृथ्वी ने इस प्रकार कष्ट उठाया है
  rationale: स्रोत की कठिन क्रिया श्रम, संताप या प्रसव-जैसी पीड़ा का बोध करा सकती है। ‘कष्ट उठाया’ पृथ्वी के मानवीकरण और संकट की तीव्रता को रखता है, पर प्रसव का अर्थ अनिवार्य नहीं बनाता।
- source_word: ወአንቀልቅለት
  choice: और वह हिल उठी है
  rationale: यह तीव्र हलचल या कंपकंपी को सहज हिन्दी में व्यक्त करता है और भूकंपीय तथा व्यापक ब्रह्मांडीय उथल-पुथल दोनों की संभावना खुली रखता है।
- source_word: ዮጊ አነ እትኃጐል ምስሌሃ
  choice: कहीं मैं भी उसके साथ नष्ट न हो जाऊँ
  rationale: ‘कहीं ... न’ वक्ता की आशंका को स्वाभाविक हिन्दी में प्रकट करता है और वाक्य को ऐसा उद्देश्यसूचक अर्थ देने से बचाता है मानो पृथ्वी का हिलना उसके विनाश को रोकने के लिए हुआ हो। ‘उसके’ का संबंध स्त्रीलिंग ‘पृथ्वी’ से है।
theological_decisions:
- issue: पृथ्वी के संकट का स्वरूप
  choice: पृथ्वी स्वयं कष्ट और तीव्र हलचल से प्रभावित दिखाई गई है।
  alternative: इसे केवल पृथ्वी पर मनुष्यों के नैतिक भ्रष्टाचार या केवल एक साधारण भूकंप का वर्णन मानना।
  rationale: कष्ट उठाने और हिलने की संयुक्त छवियाँ पृथ्वी के मानवीकृत, व्यापक संकट को दर्शाती हैं। अनुवाद न्याय-संबंधी अपोकैलिप्टिक तनाव को बनाए रखता है, पर घटना की प्रकृति को आवश्यकता से अधिक निश्चित नहीं करता।
- issue: अंतिम उपवाक्य का संबंध
  choice: इसे वक्ता की आशंका के रूप में स्वतंत्र भाव से प्रस्तुत किया गया है।
  alternative: ‘ऐसा न हो कि’ को पिछले उपवाक्य से इस प्रकार जोड़ना कि पृथ्वी के हिलने का उद्देश्य वक्ता का नष्ट न होना लगे।
  rationale: स्रोत का ዮጊ ‘शायद’ अथवा आशंकासूचक ‘कहीं ऐसा न हो’ का भाव दे सकता है। विरामचिह्न और हिन्दी मुहावरा आशंका को स्पष्ट रखते हुए मूल की अर्थ-सीमा सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। “पृथ्वी ने ... कष्ट उठाया” उसके मानवीकरण को सुरक्षित रखता है। संबोधन में “मुझे बताओ” सामान्य, सम्मानजनक और अत्यधिक पुरातनता से रहित है।
