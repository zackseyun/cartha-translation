  text: Who has allowed you to do hatred and evil? And condemnation will overtake you sinners[a][b].
translation:
  language: hi
  text: तुम्हें घृणा और बुराई करने की छूट किसने दी?[a] और दण्डादेश तुम पापियों को आ घेरेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “तुम्हें किसने दिया कि तुम घृणा और बुराई करो?”'
    reason: source_idiom
