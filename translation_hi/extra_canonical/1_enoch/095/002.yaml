    reason: lexical_range
lexical_decisions:
- source_word: መኑ
  choice: किसने
  rationale: प्रश्नवाचक शब्द को सीधे और तीखे आलंकारिक प्रश्न के रूप में रखा गया है।
- source_word: ወሀበክሙ ከመ ትግበሩ
  choice: तुम्हें … करने की छूट … दी
  rationale: शाब्दिक रूप से ‘तुम्हें दिया कि तुम करो’; प्रसंग में यह अधिकार अथवा अनुमति को चुनौती देता है। हिंदी में ‘छूट दी’ स्वाभाविक और ताड़नापूर्ण है।
- source_word: ጽልአ
  choice: बैर
  rationale: यह शब्द घृणा, शत्रुता या वैर का बोध कराता है। ‘बैर करना’ आधुनिक हिंदी में क्रियात्मक संदर्भ के अनुकूल है।
- source_word: ወእኩየ
  choice: और बुराई
  rationale: व्यापक नैतिक बुराई को बिना किसी संकीर्ण अर्थ के व्यक्त करता है।
- source_word: ይረከበክሙ
  choice: तुम … को आ घेरेगा
  rationale: क्रिया का अर्थ पाना, पहुँच जाना अथवा आ पकड़ना हो सकता है। न्याय के संदर्भ में ‘आ घेरेगा’ आसन्न और अनिवार्य परिणाम को व्यक्त करता है।
- source_word: ለኃጥኣን
  choice: तुम पापियों को
  rationale: यहाँ ለ- को क्रिया में पहले से आए द्वितीय-पुरुष बहुवचन कर्म के साथ समानाधिकरण में प्रयुक्त कर्म-चिह्न माना गया है; इसलिए अर्थ है ‘तुम पापियों को’, न कि ‘पापियों के लिए’।
- source_word: ኵነኔ
  choice: दण्डादेश
  rationale: यह प्रतिकूल न्यायिक निर्णय या दण्ड की घोषणा का शब्द है। ‘दण्डादेश’ केवल तटस्थ जाँच नहीं, बल्कि दोषी के विरुद्ध सुनाए गए निर्णय को व्यक्त करता है।
theological_decisions:
- issue: ኵነኔ को सामान्य ‘न्याय’ कहा जाए या प्रतिकूल ‘दण्डादेश’
  choice: दण्डादेश
  alternative: न्याय / दण्ड का निर्णय
  rationale: प्रसंग दुष्टों के विरुद्ध घोषणा का है; परिणाम तटस्थ न्यायिक विचार नहीं, बल्कि उनके विरुद्ध निर्णय है।
- issue: ለኃጥኣን का दूसरे पुरुष के साथ व्याकरणिक संबंध
  choice: तुम पापियों को
  alternative: पापियों के लिए
  rationale: यहाँ ለ- को समानाधिकरण वाले कर्म का चिह्न समझना गीइज़ वाक्यरचना और क्रिया के -ክሙ (‘तुम्हें’) प्रत्यय के साथ बेहतर बैठता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। ‘बैर करना’ सामान्य हिंदी में स्वाभाविक है, जबकि ‘दण्डादेश’ न्यायिक और प्रलय-संबंधी गंभीरता बनाए रखता है।
