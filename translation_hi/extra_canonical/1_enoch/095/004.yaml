base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/004.yaml
  text: Woe to you who pronounce curses that cannot be undone[c][b][a], and healing is far from you because of your sins.
translation:
  language: hi
  text: धिक्कार है तुम पर, जो ऐसे शाप देते हो जिन्हें खोला नहीं जा सकता[a]; तुम्हारे पापों के कारण चंगाई तुमसे दूर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात ऐसे बंधनकारी शाप जिन्हें वापस लेना या निष्प्रभावी करना संभव न हो। मूल में ‘बाँधने’ और ‘खोलने’ की रूपक-छवि है।
    reason: lexical_clarification
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: धिक्कार है तुम पर
  rationale: यह भविष्यद्वाणी-सदृश न्याय-घोषणा का सूत्र है। आधुनिक हिन्दी में ‘धिक्कार है तुम पर’ उसके गंभीर निंदा और न्याय के भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: እለ፡ ታወግዙ፡ ግዘታተ
  choice: जो ऐसी शाप-वाणियाँ सुनाते हो
  rationale: ታወግዙ और उसके सजातीय कर्म ግዘታተ शाप देने अथवा बंधनकारी अभिशाप घोषित करने की ओर संकेत करते हैं। ‘शाप-वाणियाँ सुनाते हो’ अर्थ को साधारण आधुनिक हिन्दी में रखता है और ‘अनात्मा’ जैसे अस्वाभाविक पारिभाषिक शब्द से बचता है।
- source_word: ከመ፡ እ ይትፈትሑ
  choice: जिन्हें खोला नहीं जा सकता
  rationale: पाठ में अलग लिखे እ को नकार ኢ का विकृत/त्रुटिपूर्ण रूप मानते हुए, ይትፈትሑ को ‘खोला/मुक्त किया जाना’ के निष्क्रिय अर्थ में लिया गया है। ‘खोला नहीं जा सकता’ बंधन और मुक्ति की मूल रूपक-छवि बनाए रखता है।
- source_word: ወፈውስ
  choice: चंगाई
  rationale: ፈውስ शारीरिक आरोग्य के साथ पुनर्स्थापन का व्यापक भाव भी रख सकता है। ‘चंगाई’ इस द्विअर्थी संभावना को संक्षिप्त और परिचित हिन्दी में सुरक्षित रखता है।
- source_word: ርኁቅ፡ እምኔክሙ
  choice: तुमसे दूर है
  rationale: यह मूल की स्थानिक रूपक-छवि का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: በእንተ፡ ኃጢአተ፡ ዚአክሙ
  choice: तुम्हारे पापों के कारण
  rationale: यह स्पष्ट कारणवाचक वाक्यांश है और बहुवचन ‘पापों’ को बनाए रखता है।
theological_decisions:
- issue: ግዘታተ को धन/चाँदी मानना या शाप/अभिशाप मानना
  choice: शाप-वाणियाँ
  alternative: चाँदी तौलते हो
  rationale: क्रिया ታወግዙ और सजातीय संज्ञा ግዘታተ का मेल अभिशाप या बंधनकारी शाप घोषित करने का अर्थ समर्थित करता है। इसलिए पुराने आर्थिक अर्थ को मुख्य पाठ में नहीं रखा गया।
- issue: ፈትሐ की रूपक-छवि को कैसे व्यक्त किया जाए
  choice: खोला नहीं जा सकता
  alternative: जिसे निष्प्रभावी नहीं किया जा सकता
  rationale: ‘खोलना’ मूल के बाँधने/खोलने के तनाव को बनाए रखता है; ‘निष्प्रभावी करना’ अधिक व्याख्यात्मक होता। पादटिप्पणी हिन्दी पाठक के लिए आशय स्पष्ट करती है।
- issue: चंगाई का आशय शारीरिक है या नैतिक-आध्यात्मिक
  choice: चंगाई
  alternative: उद्धार अथवा क्षमा
  rationale: मूल शब्द व्यापक है। उसे किसी एक धर्मवैज्ञानिक अर्थ तक सीमित न करके शारीरिक और पुनर्स्थापनात्मक दोनों संभावनाएँ खुली रखी गई हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। न्याय-घोषणा की तीव्रता के लिए ‘धिक्कार’ और व्यापक आरोग्य/पुनर्स्थापन के भाव के लिए ‘चंगाई’ चुना गया है।
