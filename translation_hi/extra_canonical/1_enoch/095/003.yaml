base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/003.yaml
  text: Do not fear the sinners[a], O righteous ones, for again the Lord will deliver them into your hands[c][b], so that you may execute judgment upon them according to your pleasure.
translation:
  language: hi
  text: हे धर्मियो, पापियों से मत डरो[a], क्योंकि प्रभु एक बार फिर उन्हें तुम्हारे हाथों में सौंप देगा[b], ताकि तुम अपनी इच्छा के अनुसार उन पर न्याय करो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘पापियों के कारण भयभीत मत हो’ भी किया जा सकता है। गीइज़ में እም स्रोत अथवा कारण का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘तुम्हारे हाथों में’ किसी को तुम्हारे अधिकार या नियंत्रण में सौंपे जाने का मुहावरा है।
    reason: cultural_note
  - marker: c
    text: या ‘जैसा तुम चाहो।’ यह वाक्य धर्मियों को पापियों पर न्याय करने का अधिकार मिलने का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትፍርሁ
  choice: मत डरो
  rationale: यह बहुवचन में नकारात्मक आज्ञा है। ‘मत डरो’ सीधे संबोधन की संक्षिप्तता और प्रोत्साहनात्मक बल बनाए रखता है।
- source_word: ጻድቃን
  choice: हे धर्मियो
  rationale: बहुवचन संबोधन को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है। ‘धर्मी’ न्यायपरायणता के अर्थ-क्षेत्र और इस समूह की विशिष्ट पहचान दोनों को व्यक्त करता है।
- source_word: እምኃጥኣን
  choice: पापियों से
  rationale: እም का स्रोत/कारणसूचक भाव हिन्दी के ‘से’ में स्वाभाविक रूप से आता है और इसे ‘पापियों के कारण’ भी समझा जा सकता है।
- source_word: ካዕበ
  choice: एक बार फिर
  rationale: यह पुनरावृत्ति या प्रत्यावर्तन का संकेत देता है; ‘एक बार फिर’ पद्य के न्यायपूर्ण उलटाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ያገብኦሙ
  choice: उन्हें ... सौंप देगा
  rationale: ‘हाथों में’ के साथ यह क्रिया किसी को दूसरे के अधिकार या नियंत्रण में देने का अर्थ रखती है। ‘सौंप देगा’ इस न्यायिक संदर्भ में स्वाभाविक है।
- source_word: ውስተ እዴክሙ
  choice: तुम्हारे हाथों में
  rationale: मूल का सजीव मुहावरा सुरक्षित रखा गया है; इसका आशय किसी के अधिकार या नियंत्रण में देना है।
- source_word: ከመ ትግበሩ
  choice: ताकि तुम ... करो
  rationale: यह उद्देश्यसूचक उपवाक्य है। हिन्दी में ‘न्याय करना’ स्वाभाविक है और धर्मियों की सक्रिय भूमिका को बनाए रखता है।
- source_word: ኵነኔ
  choice: न्याय
  rationale: यह न्यायिक अर्थ-क्षेत्र का शब्द है। ‘न्याय’ निर्णय और उसके कार्यान्वयन, दोनों की संभावनाओं को खुला रखता है।
- source_word: በከመ ፈቀድክሙ
  choice: अपनी इच्छा के अनुसार
  rationale: यह धर्मियों की इच्छा या अभिलाषा के अनुरूप कार्य करने का भाव व्यक्त करता है; चुना हुआ रूप गरिमापूर्ण और स्पष्ट है।
theological_decisions:
- issue: क्या धर्मी पापियों के न्याय में सक्रिय भाग लेते हैं या केवल परमेश्वर द्वारा किए गए न्याय को देखते हैं?
  choice: धर्मियों को उन पर न्याय करने वाले सक्रिय कर्ताओं के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल धर्मियों के निर्दोष ठहराए जाने या परमेश्वर के न्याय के साक्षी बनने के रूप में समझना।
  rationale: उद्देश्यसूचक वाक्यांश ‘ताकि तुम ... न्याय करो’ और ‘तुम्हारे हाथों में’ का मुहावरा मिलकर सक्रिय सहभागिता की ओर संकेत करते हैं। अनुवाद इस अपोकैलिप्टिक उलटाव और उससे उत्पन्न धर्मवैज्ञानिक तनाव को नरम नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘हे धर्मियो’ अपोकैलिप्टिक संबोधन का औपचारिक स्वर बनाए रखता है; ‘सौंप देगा’ और ‘न्याय करो’ न्यायिक संदर्भ को स्पष्ट रखते हुए मूल की संभावित अर्थ-व्याप्ति को अनावश्यक रूप से संकीर्ण नहीं करते।
