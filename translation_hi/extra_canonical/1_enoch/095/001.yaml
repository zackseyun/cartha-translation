base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/001.yaml
  text: Who will grant me that my eyes might become a cloud of water[a], so that I may weep over you and pour out my tears like a cloud of water[c][b], and find rest from the sorrow of my heart?
translation:
  language: hi
  text: कौन मुझे यह देगा कि मेरी आँखें पानी का बादल बन जाएँ[a], ताकि मैं तुम सब पर रोऊँ[b], अपने आँसू पानी के बादल के समान उँडेल दूँ, और अपने हृदय के शोक से विश्राम पाऊँ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वर्षा-मेघ’। गीइज़ में यही छवि आगे फिर आती है और सम्भवतः आँखों के आँसुओं का तूफ़ानी बादल बन जाने का भाव जगाती है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘तुम’ बहुवचन है; प्रसंग में सम्भवतः इसका संकेत उन पापियों या दुष्टों की ओर है जिन्हें आसपास के धिक्कार-वचनों में सम्बोधित किया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: መኑ፡ ይሁበኒ
  choice: कौन मुझे यह देगा
  rationale: प्रश्नवाचक आरम्भ में विलापपूर्ण अभिलाषा है। ‘मुझे’ से क्रिया में निहित प्रथम पुरुष कर्म-प्रत्यय स्पष्ट रहता है, जबकि ‘देगा’ मूल क्रिया ‘देना’ के निकट है।
- source_word: ለአዕይንትየ፡ ከመ፡ ይኩና፡ ደመና፡ ማይ
  choice: कि मेरी आँखें पानी का बादल बन जाएँ
  rationale: मूल की असामान्य काव्यात्मक छवि को ‘आँखें आँसुओं से भर जाएँ’ कहकर सपाट नहीं किया गया। ‘पानी का बादल’ ደመና ማይ की निकट और सामान्य पाठक के लिए बोधगम्य अभिव्यक्ति है।
- source_word: እብኪ፡ ዲቤክሙ
  choice: मैं तुम सब पर रोऊँ
  rationale: ‘तुम सब’ बहुवचन सम्बोधन को स्पष्ट करता है। ‘पर रोऊँ’ शोक की दिशा को व्यक्त करता है, पर दया और दोषारोपण में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: እክዐው፡ አንብዐየ
  choice: अपने आँसू ... उँडेल दूँ
  rationale: यह चयन आँसुओं के तीव्र बहाव और मूल क्रिया की सक्रिय उँडेलने वाली छवि को बनाए रखता है।
- source_word: ከመ፡ ደመና፡ ማይ
  choice: पानी के बादल के समान
  rationale: पहले प्रयुक्त छवि को जानबूझकर दोहराया गया है, जिससे मूल का काव्यात्मक बल सुरक्षित रहता है।
- source_word: ወአዕርፍ፡ እምሐዘነ፡ ልብየ
  choice: और अपने हृदय के शोक से विश्राम पाऊँ
  rationale: ‘विश्राम पाऊँ’ मूल के विश्राम/राहत दोनों भावों को खुला रखता है और इसे पिछली आश्रित क्रियाओं के समानान्तर जोड़ता है।
theological_decisions:
- issue: क्या ‘पानी का बादल’ वाली असामान्य छवि को सहज भावार्थ में बदल दिया जाए
  choice: मुख्य पाठ में मूल छवि और उसकी पुनरावृत्ति बनाए रखना
  alternative: ‘मेरी आँखें आँसुओं से भर जाएँ’ या ‘वर्षा-मेघ बन जाएँ’
  rationale: मूल पाठ की उग्र विलापात्मक कविता को साधारण गद्य में बदलना उचित नहीं। ‘वर्षा-मेघ’ सम्भव अर्थ है, पर वह ‘वर्षा’ को स्पष्ट करके मूल की वास्तविक अस्पष्टता कुछ घटाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्यतः बोधगम्य विलापात्मक काव्य-रजिस्टर अपनाया गया है। ‘पानी का बादल’ जानबूझकर कुछ असामान्य रखा गया है ताकि गीइज़ की छवि न मिटे; कठिन तत्सम शब्दावली से बचा गया है।
