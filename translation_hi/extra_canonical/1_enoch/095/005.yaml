base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/005.yaml
  text: Woe to you who repay evil to your neighbor, for you will be repaid according to your deeds.
translation:
  language: hi
  text: हाय तुम पर, जो अपने पड़ोसी को बुराई का प्रतिफल देते हो[a], क्योंकि तुम्हारे कर्मों के अनुसार तुम्हें प्रतिफल दिया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'दोनों उपवाक्यों में गीइज़ की एक ही क्रियामूल का प्रयोग हुआ है: जो बुराई का ‘प्रतिफल देते’ हैं, उन्हें स्वयं भी ‘प्रतिफल दिया जाएगा।’'
    reason: मूल की शब्दगत पुनरावृत्ति और प्रत्युपकार की विडंबना स्पष्ट करना।
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: हाय तुम पर
  rationale: यह न्याय की भविष्यवाणी करने वाला धिक्कार-सूचक सूत्र है; यह केवल दुःख व्यक्त करने के बजाय मूल के न्यायात्मक बल को बनाए रखता है।
- source_word: ትፈድዩ
  choice: प्रतिफल देते हो
  rationale: ‘प्रतिफल देना’ प्रत्युत्तर या बदला चुकाने का भाव व्यक्त करता है और अगले निष्क्रिय क्रियारूप के साथ मूल की शब्दगत पुनरावृत्ति बनाए रखता है।
- source_word: እኩየ
  choice: बुराई
  rationale: यह नैतिक दुष्टता और किसी को पहुँचाई गई हानि—दोनों को समेटने वाला व्यापक शब्द है।
- source_word: ለቢጽክሙ
  choice: अपने पड़ोसी को
  rationale: यह निकट सामाजिक संबंध वाले दूसरे व्यक्ति को सूचित करता है; ‘पड़ोसी’ स्वाभाविक बाइबलीय हिन्दी है और पारस्परिक नैतिक संदर्भ बनाए रखता है।
- source_word: እስመ
  choice: क्योंकि
  rationale: यह पहले कथन के आधार या कारण का स्पष्ट और स्वाभाविक परिचय देता है।
- source_word: ትትፈድዩ
  choice: तुम्हें प्रतिफल दिया जाएगा
  rationale: निष्क्रिय वाक्य-रचना मूल की तरह प्रतिफल देने वाले कर्ता को अनिर्दिष्ट रखती है और पहले प्रयुक्त धातु का प्रतिध्वनित अर्थ बचाती है।
- source_word: በከመ ምግባሪክሙ
  choice: तुम्हारे कर्मों के अनुसार
  rationale: यह प्रतिफल के मानदंड और कर्मानुपाती न्याय का भाव सीधे व्यक्त करता है।
theological_decisions:
- issue: प्रतिफल देने वाले का स्वरूप
  choice: 'निष्क्रिय रूप में कर्ता को अनिर्दिष्ट रखा गया है: ‘तुम्हें प्रतिफल दिया जाएगा।’'
  alternative: परमेश्वर तुम्हें तुम्हारे कर्मों का प्रतिफल देगा।
  rationale: संदर्भ में ईश्वरीय या न्यायिक प्रतिफल निहित हो सकता है, पर मूल पाठ कर्ता का नाम नहीं लेता। इसलिए अनुवाद उस धार्मिक तनाव को बिना स्पष्ट किए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और न्यायवाणी के अनुकूल शैली अपनाई गई है। ‘हाय तुम पर’ भविष्यद्वक्तीय धिक्कार का बल रखता है; ‘प्रतिफल’ दोनों क्रियारूपों की जानबूझकर की गई समानता को सुरक्षित रखता है।
