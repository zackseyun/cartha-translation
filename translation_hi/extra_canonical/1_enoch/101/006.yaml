base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/006.yaml
  text: Is not the whole sea[a], and all its waters, and all its movements[c][b], the work of the Most High? And he has measured all its works and bound its shores with sand.
translation:
  language: hi
  text: क्या समूचा समुद्र, उसका सारा जल और उसकी सारी हलचल[a] परमप्रधान की कृति नहीं है? और उसने उसके सभी कार्यों को नापा है और उसके तटों को रेत से बाँध दिया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस शब्द का अधिक विशिष्ट अर्थ समुद्र का उफान या उसकी लहरें भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम वाक्यांश का पाठ कठिन है। उपलब्ध गीज़ लिप्यंतरण को शाब्दिक रूप से ‘उसकी नींवों को रेत से बाँध दिया’ समझा जा सकता है; एक संशोधित पाठ समुद्र की सीमा या तट को रेत से बाँधने की बात कहता है।
    reason: textual_variant
lexical_decisions:
- source_word: አኮ
  choice: क्या ... नहीं है?
  rationale: यह अलंकारिक प्रश्न सहमति की अपेक्षा करता है। हिन्दी में ‘क्या ... नहीं है?’ उसके प्रश्नात्मक बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: ኵሉ ባሕር
  choice: समूचा समुद्र
  rationale: इसके बाद आने वाले स्त्रीलिंग एकवचन संबंधसूचक रूपों के अनुरूप इसे एक सामूहिक एकवचन के रूप में लिया गया है, न कि ‘हर समुद्र’ के रूप में।
- source_word: ማያቲሃ
  choice: उसका सारा जल
  rationale: गीज़ में रूप बहुवचन है, किंतु आधुनिक हिन्दी में समुद्र के संदर्भ में ‘सारा जल’ अधिक स्वाभाविक सामूहिक अभिव्यक्ति है।
- source_word: ሑሳታ
  choice: उसकी सारी हलचल
  rationale: शब्द समुद्र की गति, उफान या लहरों की ओर संकेत कर सकता है। ‘हलचल’ व्यापक अर्थ को बनाए रखती है और अनावश्यक रूप से केवल ‘लहरें’ निश्चित नहीं करती।
- source_word: ግብረ ልዑል
  choice: परमप्रधान की कृति
  rationale: यह समुद्र और उससे जुड़े तत्वों को परमेश्वर की बनाई हुई रचना बताता है। ‘कृति’ हिन्दी में स्वाभाविक है और ‘कार्य’ की अपेक्षा इस संदर्भ में सृजन का भाव अधिक स्पष्ट करती है।
- source_word: ዐቀመ
  choice: नापा है
  rationale: क्रिया मापने या विस्तार निर्धारित करने का भाव रखती है और सृष्टि की ईश्वरीय व्यवस्था का चित्र सुरक्षित रखती है।
- source_word: አሰረ
  choice: बाँध दिया है
  rationale: मूल क्रिया बाँधने, कसने या सीमित करने का सजीव चित्र देती है; ‘बाँध दिया’ उसी चित्र को बनाए रखता है।
- source_word: ግብረታ
  choice: उसके सभी कार्यों
  rationale: स्त्रीलिंग एकवचन प्रत्यय का संबंध समुद्र से लिया गया है। इससे अर्थ ‘उसके कार्यों’ है, ‘उसके [परमप्रधान के] कार्यों’ नहीं।
- source_word: እብንታሃ ቡኖባ / संभावित संशोधित पाठ
  choice: उसके तटों को रेत से
  rationale: प्राप्त लिप्यंतरण कठिन और संभवतः दूषित है; समीक्षित पाठ समुद्र की सीमा या तट को रेत से बाँधने का अर्थ देता है। मुख्य पाठ में संदर्भानुकूल ‘तटों’ रखा गया है और शाब्दिक कठिनाई पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: ईश्वरीय उपाधि ልዑል
  choice: परमप्रधान
  alternative: सर्वोच्च
  rationale: ‘परमप्रधान’ यहूदी प्रलय-साहित्य में प्रयुक्त इस ऊँची ईश्वरीय उपाधि का भार और पहचान बनाए रखता है, बिना किसी बाद की सांप्रदायिक शब्दावली को आरोपित किए।
- issue: समुद्र पर ईश्वरीय नियंत्रण का चित्र
  choice: तटों को रेत से बाँध दिया
  alternative: नींवों को रेत से बाँध दिया
  rationale: मुख्य पाठ समुद्र की निर्धारित सीमा का सुसंगत सृष्टि-विषयक चित्र देता है, जबकि कठिन लिप्यंतरण से संभव ‘नींवों’ वाला पाठ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। अलंकारिक प्रश्न, समुद्र के लिए एकवचन संदर्भ और कठिन अंतिम वाक्यांश की वास्तविक अनिश्चितता सुरक्षित रखी गई है।
