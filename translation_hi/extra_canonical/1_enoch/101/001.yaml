base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/001.yaml
  text: Observe heaven[a], you sons of heaven, and every work of the Most High; and fear him[b], and do not do evil before him.
translation:
  language: hi
  text: हे स्वर्ग के पुत्रों, स्वर्ग और परमप्रधान के हर कार्य पर ध्यान दो[a]; उसका भय मानो और उसके सामने बुराई न करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे स्वर्ग के पुत्रों, स्वर्ग से परमप्रधान के हर कार्य के विषय में पूछो।”
    reason: मूल क्रिया का अर्थ ‘ध्यान से देखना/विचार करना’ अथवा ‘पूछना’ लिया जा सकता है; साथ ही वाक्य-संबंध की दूसरी सम्भव समझ यहाँ दी गई है।
lexical_decisions:
- source_word: ጠይቅዋ
  choice: ध्यान दो
  rationale: संदर्भ में बहुवचन आज्ञार्थक क्रिया का अर्थ ‘देखना/ध्यानपूर्वक विचार करना’ उपयुक्त है; इससे उपदेशात्मक बल बना रहता है। ‘पूछो’ इसका सम्भव शाब्दिक अर्थ है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: ለሰማይ
  choice: स्वर्ग
  rationale: इस प्रलयदर्शी संदर्भ में ‘स्वर्ग’ ब्रह्मांडीय और धार्मिक भाव को ‘आकाश’ से बेहतर बनाए रखता है।
- source_word: ውሉደ፡ ሰማይ
  choice: हे स्वर्ग के पुत्रो
  rationale: मूल के विशिष्ट और रहस्यमय सम्बोधन को बिना यह तय किए अक्षुण्ण रखा गया है कि इससे मनुष्य अभिप्रेत हैं या स्वर्गीय प्राणी।
- source_word: ወኵሎ፡ ግብር፡ ለልዑል
  choice: और परमप्रधान के हर कार्य
  rationale: संयोजक ወ को ‘और’ के रूप में रखते हुए स्वर्ग तथा परमप्रधान के प्रत्येक कार्य—दोनों को ध्यान देने के विषय बनाया गया है। ‘कार्य’ अर्थ को किसी एक प्रकार के कर्म तक सीमित नहीं करता।
- source_word: ወፍርሁ፡ እምኔሁ
  choice: उसका भय मानो
  rationale: यह अभिव्यक्ति भय और श्रद्धामिश्रित विस्मय, दोनों की सम्भावना बनाए रखते हुए हिन्दी के बाइबलीय भाव में स्वाभाविक है।
- source_word: ወኢትግበሩ፡ እኩየ፡ በቅድሜሁ
  choice: और उसके सामने बुराई न करो
  rationale: नैतिक निषेध तथा परमेश्वर की उपस्थिति और दृष्टि सूचित करने वाले ‘उसके सामने’—दोनों को स्पष्ट रूप से सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘स्वर्ग के पुत्रों’ की पहचान
  choice: ‘हे स्वर्ग के पुत्रो’ के रूप में मूल सम्बोधन को ज्यों का त्यों रखा गया है।
  alternative: ‘हे स्वर्ग की सन्तानो’ या ‘हे स्वर्गीय प्राणियो’
  rationale: अनुवाद यह तय नहीं करता कि सम्बोधन मनुष्यों के लिए रूपक है या किसी उच्चतर स्वर्गीय वर्ग के लिए; मूल की धर्मवैचारिक अस्पष्टता बनी रहती है।
- issue: परमेश्वर का भय
  choice: ‘उसका भय मानो’
  alternative: ‘उसके प्रति श्रद्धामिश्रित विस्मय रखो’ या ‘उससे डरो’
  rationale: चुना हुआ रूप भय और श्रद्धा के बीच के तनाव को किसी एक अर्थ में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, उपदेशात्मक और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘परमप्रधान’, ‘स्वर्ग के पुत्रो’ और ‘उसका भय मानो’ मूल के प्रलयदर्शी-बाइबलीय स्वर तथा जानबूझकर बनी अस्पष्टताओं को सुरक्षित रखते हैं।
