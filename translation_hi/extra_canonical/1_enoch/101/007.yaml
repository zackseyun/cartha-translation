base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/007.yaml
  text: And at his rebuke it will be afraid and dry up[a], and all its fish will die, and everything that is in it[c][b]. But you sinners who are upon the earth do not fear him.
translation:
  language: hi
  text: और उसकी फटकार से वह डर जाएगी और सूख जाएगी,[a] और उसकी सारी मछलियाँ मर जाएँगी, और उसमें जो कुछ है, वह सब भी नष्ट हो जाएगा। परन्तु तुम पापी, जो पृथ्वी पर हो, उससे नहीं डरते।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “उसकी” परमेश्वर की ओर संकेत करता है, जबकि “वह” पिछले पद के समुद्र या जलराशि की ओर। गीज़ मूल में परमेश्वर के लिए पुल्लिंग और जलराशि के लिए स्त्रीलिंग रूप अलग-अलग हैं।
    reason: grammar_clarification
  - marker: b
    text: शाब्दिक अर्थ है, “तुम उससे नहीं डरते”; पुल्लिंग कर्मसूचक प्रत्यय के कारण “उससे” का संकेत परमेश्वर की ओर है, समुद्र की ओर नहीं।
    reason: referent_clarification
lexical_decisions:
- source_word: በተግሣጹ
  choice: उसकी फटकार से
  rationale: प्रत्यय -u पुल्लिंग एकवचन है और यहाँ परमेश्वर की ओर संकेत करता है; በ को प्रसंगानुसार कारण/माध्यम के अर्थ में ‘से’ व्यक्त किया गया है।
- source_word: ትፈርህ ወትየብስ
  choice: वह डर जाएगा और सूख जाएगा
  rationale: दोनों क्रियाएँ स्त्रीलिंग एकवचन कर्ता—पूर्ववर्ती समुद्र या जलराशि—से जुड़ी हैं। ‘डर जाएगा’ मूल के व्यक्तिकरण को बनाए रखता है और ‘सूख जाएगा’ जल के लिए स्वाभाविक हिन्दी है।
- source_word: ዓሣቲሃ
  choice: उसकी सारी मछलियाँ
  rationale: स्त्रीलिंग संबंधसूचक प्रत्यय जलराशि की मछलियों को सूचित करता है; ኵሉ के व्यापक अर्थ को ‘सारी’ से व्यक्त किया गया है।
- source_word: ይመውት
  choice: मर जाएँगी
  rationale: न्याय के भावी परिणाम को सीधी और ठोस आधुनिक हिन्दी में रखा गया है।
- source_word: ኵሉ ዘሀሎ ውስቴታ
  choice: वह सब भी जो उसमें है
  rationale: यह वाक्यांश मछलियों के बाद जलराशि में मौजूद अन्य सब कुछ समेटता है; ‘भी’ हिन्दी में इस विस्तार को स्पष्ट करता है।
- source_word: ኃጥኣን
  choice: पापी
  rationale: यह हनोक की नैतिक शब्दावली का प्रमुख संबोधन है; हिन्दी में बहुवचन संबोधन के रूप में ‘तुम पापी’ स्वाभाविक है।
- source_word: እለ ዲበ ምድር
  choice: जो पृथ्वी पर हो
  rationale: मूल के ‘पृथ्वी पर’ को बिना ‘रहते’ जैसी अतिरिक्त धारणा जोड़े संक्षिप्त और गरिमापूर्ण हिन्दी में रखा गया है।
- source_word: ኢትፈርህዎ
  choice: उससे नहीं डरते
  rationale: अंतिम -wo पुल्लिंग एकवचन कर्मसूचक प्रत्यय है, इसलिए इसका संदर्भ जलराशि नहीं बल्कि उसी पुल्लिंग सत्ता—परमेश्वर—से है जिसकी फटकार आरम्भ में कही गई है।
theological_decisions:
- issue: फटकार देने वाले और उससे न डरने के कर्म का संदर्भ
  choice: दोनों पुल्लिंग प्रत्ययों को परमेश्वर के लिए ‘उसकी/उससे’ रखा गया है।
  alternative: इन्हें समुद्र या जलराशि के लिए ‘उसकी/उससे’ समझना।
  rationale: गीज़ में በተግሣጹ का -u और ኢትፈርህዎ का -wo पुल्लिंग एकवचन हैं, जबकि समुद्र की क्रियाएँ और उसकी वस्तुओं के प्रत्यय स्त्रीलिंग हैं। यह व्याकरणिक भेद सृष्टि के परमेश्वर की फटकार से डरने और पापियों के उससे न डरने का विरोध स्थापित करता है।
- issue: जलराशि का व्यक्तिकरण
  choice: ‘वह डर जाएगा’ कहकर व्यक्तिकरण बनाए रखा गया है।
  alternative: ‘वह काँप उठेगा’ या व्यक्तिकरण हटाकर केवल ‘सूख जाएगा’ कहना।
  rationale: मूल क्रिया सामान्यतः भय का अर्थ देती है और अपोकैलिप्टिक चित्रण में सृष्टि को भयभीत दिखाने वाला तनाव अर्थपूर्ण है; इसे समतल नहीं किया गया।
- issue: परमेश्वर के लिए सर्वनाम की शैली
  choice: हिन्दी वाक्य में ‘उसकी/उससे’ का प्रयोग किया गया है, और संदर्भ को पादटिप्पणी में स्पष्ट किया गया है।
  alternative: मुख्य पाठ में ‘परमेश्वर की/परमेश्वर से’ कहकर संदर्भ को प्रत्यक्ष करना।
  rationale: मूल पाठ सर्वनाम का प्रयोग करता है। हिन्दी में उसे बनाए रखना मूल की शैली के अधिक निकट है, जबकि पादटिप्पणी संभावित संदिग्धता दूर करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-अनुकूल शैली अपनाई गई है। ‘फटकार’, ‘पापी’ और ‘पृथ्वी’ मूल के न्यायात्मक तथा अपोकैलिप्टिक स्वर को बनाए रखते हैं। हिन्दी में ‘समुद्र’ पुल्लिंग होने के कारण गीज़ के स्त्रीलिंग व्याकरण को प्रत्यक्ष रूप से दिखाना संभव नहीं; इसलिए संदर्भ-भेद पादटिप्पणी में स्पष्ट किया गया है।
