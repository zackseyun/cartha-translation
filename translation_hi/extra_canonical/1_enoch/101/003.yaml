base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/003.yaml
  text: And if he sends his wrath upon you for all your deeds[a], will you not entreat him? For you speak great and harsh words against his righteousness[d][c][b], and you have no peace.
translation:
  language: hi
  text: और यदि वह तुम्हारे सब कामों के कारण अपना प्रकोप तुम पर भेजे, तो क्या तुम उससे विनती न करोगे?[a] क्योंकि तुम उसकी धार्मिकता[b] के विरुद्ध बड़ी और कठोर बातें कहते हो, और तुम्हें शांति नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तो क्या तुम उससे अनुनय न करोगे?” मूल क्रिया विनती या गिड़गिड़ाकर प्रार्थना करने का भाव रखती है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसका न्याय।” यहाँ ‘धार्मिकता’ में न्याय का भाव भी शामिल हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ፈነወ
  choice: भेजे
  rationale: यह क्रिया किसी वस्तु को भेजने या आगे प्रवाहित करने का भाव रखती है; ‘भेजे’ मूल बिंब और शर्तसूचक वाक्य दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: መዐቶ
  choice: प्रकोप
  rationale: न्याय और दण्ड के इस प्रसंग में ‘प्रकोप’ दैवी रोष की गंभीर, न्यायिक और प्रलयकारी शक्ति को व्यक्त करता है।
- source_word: በኵሉ ምግባሪክሙ
  choice: तुम्हारे सब कामों के कारण
  rationale: यह पद श्रोताओं के समस्त आचरण को आने वाले प्रकोप का कारण बताता है; ‘कामों’ सामान्य पाठक के लिए स्वाभाविक और नैतिक रूप से पर्याप्त व्यापक है।
- source_word: ታስተበቍዕዎ
  choice: उससे विनती करोगे
  rationale: क्रिया गिड़गिड़ाकर प्रार्थना या अनुनय करने का भाव देती है। ‘विनती करना’ व्यक्तिगत संबोधन और संकट में सहायता की याचना दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ጽድቅ ዚአሁ
  choice: उसकी धार्मिकता
  rationale: ‘धार्मिकता’ परमेश्वर की नैतिक सत्यता और न्याय दोनों की व्यापकता बनाए रखती है; केवल ‘न्याय’ कहना अर्थ को न्यायिक पक्ष तक सीमित कर सकता है।
- source_word: ዐቢይተ ወጽኑዓተ
  choice: बड़ी-बड़ी और कठोर बातें
  rationale: यह मूल के ‘बड़ी और कठोर [बातें]’ वाले विशिष्ट हनोक-संबंधी मुहावरे को निकटता से सुरक्षित रखता है और उसे ‘घमण्डी’ जैसे व्याख्यात्मक गुणों से नहीं बदलता।
- source_word: አልብክሙ ሰላመ
  choice: तुम्हें शान्ति नहीं है
  rationale: यह मूल के संक्षिप्त न्याय-वचन को स्पष्ट, स्वाभाविक और गंभीर हिन्दी में बनाए रखता है।
theological_decisions:
- issue: क्या አኮ को साधारण निषेध मानें या सकारात्मक उत्तर की अपेक्षा रखने वाला प्रश्न
  choice: तो क्या तुम उससे विनती न करोगे?
  alternative: तुम उससे विनती नहीं कर सकते
  rationale: प्रसंग की प्रश्नमाला और कण का प्रश्नात्मक प्रयोग यह संकेत देते हैं कि न्याय आने पर पापी उससे विनती करेंगे। नकारात्मक कथन अर्थ को उलट देता।
- issue: ጽድቅ का अर्थ ‘धार्मिकता’ हो या ‘न्याय’
  choice: उसकी धार्मिकता
  alternative: उसका न्याय
  rationale: संदर्भ न्यायिक है, फिर भी पद परमेश्वर के केवल निर्णय नहीं बल्कि उसकी व्यापक नैतिक सत्यता को भी सूचित कर सकता है; ‘धार्मिकता’ इस व्यापकता को बचाती है।
- issue: प्रकोप भेजने वाले कर्ता की पहचान
  choice: वह अपना प्रकोप ... भेजे
  alternative: परमेश्वर अपना प्रकोप ... भेजे
  rationale: मूल में कर्ता सर्वनाम से व्यक्त है, किसी स्पष्ट ईश्वरीय नाम से नहीं। ‘वह’ संदर्भगत पहचान को बनाए रखते हुए अनावश्यक स्पष्टता नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-अनुकूल रूप अपनाया गया है। ‘बड़ी-बड़ी और कठोर बातें’ मूल के विशिष्ट मुहावरे को सुरक्षित रखता है। प्रश्नात्मक አኮ को अर्थ उलटे बिना स्वाभाविक आलंकारिक प्रश्न के रूप में प्रस्तुत किया गया है।
