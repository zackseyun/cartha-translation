base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/002.yaml
  text: If he shuts the windows of heaven[a], and withholds the rain and the dew so that it does not come down upon the earth because of you[c][b], what will you do?
translation:
  language: hi
  text: यदि वह आकाश की खिड़कियाँ[a] बंद कर दे और वर्षा और ओस को रोक ले, ताकि वे तुम्हारे कारण[b] पृथ्वी पर न उतरें, तो तुम क्या करोगे?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आकाश की खिड़कियाँ’ वर्षा के स्रोत के विषय में प्राचीन ब्रह्मांड-कल्पना का बिंब है; अनुवाद ने इसे आधुनिक मौसम-विज्ञान की अभिव्यक्ति से नहीं बदला है।
    reason: cultural_note
  - marker: b
    text: इसका अनुवाद ‘तुम्हारे निमित्त’ भी किया जा सकता है। यहाँ न्याय के प्रसंग के कारण ‘तुम्हारे कारण’ रखा गया है।
    reason: lexical_alternative
  - marker: c
    text: 'यह एक आलंकारिक प्रश्न है। अधिक शब्दशः भी इसका अर्थ है: ‘तुम क्या करोगे?’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ዐፀወ
  choice: बंद कर दे
  rationale: यह क्रिया बंद करने का सीधा अर्थ देती है और आकाश की खिड़कियों के ठोस बिंब को बनाए रखती है।
- source_word: መስኮተ ሰማይ
  choice: आकाश की खिड़कियाँ
  rationale: यह वर्षा के स्रोत के लिए प्रयुक्त प्राचीन ब्रह्मांड-संबंधी बिंब को आधुनिक मौसम-विज्ञान की भाषा में बदले बिना सुरक्षित रखता है।
- source_word: ከለአ ዝናመ
  choice: वर्षा ... को रोक ले
  rationale: क्रिया रोकने या थामे रखने का भाव देती है; हिंदी में यह दैवी नियंत्रण के प्रसंग में स्वाभाविक है।
- source_word: ወጠለ
  choice: और ... ओस
  rationale: वर्षा के साथ ओस का उल्लेख कृषि-आधारित जीवन के लिए दोनों प्रकार की नमी के रोके जाने को व्यक्त करता है।
- source_word: ከመ ኢይረድ ዲበ ምድር
  choice: ताकि वे ... पृथ्वी पर न उतरें
  rationale: वर्षा और ओस दोनों को ध्यान में रखकर हिंदी में बहुवचन रखा गया है; उतरना मूल के अवरोहण-बोध को सुरक्षित रखता है।
- source_word: በእንቲአክሙ
  choice: तुम्हारे कारण
  rationale: न्याय के इस प्रसंग में यह श्रोताओं के कारण आने वाले परिणाम का स्वाभाविक अर्थ देता है, यद्यपि पदबंध के अन्य अर्थ भी संभव हैं।
- source_word: ሚሀለወክሙ ትግበሩ
  choice: तो तुम क्या करोगे?
  rationale: यह मनुष्य की असहायता को सामने रखने वाले आलंकारिक प्रश्न को सहज आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: आकाश को बंद करने वाले की पहचान
  choice: कर्ता को केवल ‘वह’ कहा गया है।
  alternative: ‘परमेश्वर’ या ‘प्रभु’ को स्पष्ट कर्ता बनाना।
  rationale: गीज़ पाठ में कर्ता एकवचन है, पर इस पद में उसका नाम नहीं दिया गया। ‘वह’ रखने से संदर्भ में निहित दैवी कर्तृत्व बना रहता है और पाठ में अनुपस्थित उपाधि नहीं जोड़ी जाती।
- issue: सूखे का श्रोताओं से संबंध
  choice: ‘तुम्हारे कारण’ के रूप में कारणात्मक संबंध रखा गया है।
  alternative: ‘तुम्हारे लिए’ या ‘तुम्हारे निमित्त’।
  rationale: न्याय के प्रसंग में कारणात्मक अर्थ अधिक उपयुक्त है, पर पादटिप्पणी में संभावित वैकल्पिक अर्थ सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और प्रत्यक्ष शैली रखी गई है। प्राचीन ‘आकाश की खिड़कियाँ’ का बिंब सुरक्षित है। आरंभ में मूल እመ के अनुसार केवल ‘यदि’ है, ‘और यदि’ नहीं। ‘तो’ हिंदी की स्वाभाविक शर्त-वाक्य रचना के लिए प्रयुक्त हुआ है।
