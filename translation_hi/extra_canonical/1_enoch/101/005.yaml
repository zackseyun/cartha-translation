base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/005.yaml
  text: And because of this they fear[a], for all their good possessions go out into the sea with them, and they do not think good in their hearts[b], for the sea will swallow them and they will sink in it.
translation:
  language: hi
  text: और इसी कारण वे डरते हैं,[a] क्योंकि उनकी सारी बहुमूल्य संपत्ति उनके साथ समुद्र में चली जाती है; और वे अपने मन में कोई अच्छी बात नहीं सोचते,[b] क्योंकि समुद्र उन्हें निगल जाएगा और वे उसमें डूब जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'गीज़ क्रिया को भविष्यकाल में भी समझा जा सकता है: ‘वे डरेंगे।’ यहाँ इसे पिछले पद से चल रहे सामान्य वर्तमान वर्णन के रूप में लिया गया है।'
    reason: tense_ambiguity
  - marker: b
    text: शाब्दिक रूप से, ‘वे अपने मन में अच्छा नहीं सोचते।’ इसका अर्थ ‘वे मन में किसी भलाई की बात नहीं सोचते’ या ‘वे अपनी बहुमूल्य संपत्ति के विषय में नहीं सोचते’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ይፈርሁ
  choice: वे डरते हैं
  rationale: इथियोपिक अपूर्ण क्रिया यहाँ पिछले पद में वर्णित नाविकों की सामान्य वर्तमान दशा को आगे बढ़ाती है; इसलिए भविष्यकाल के बजाय वर्तमानकाल रखा गया है।
- source_word: ኵሉ ንዋዮሙ ሠናይ
  choice: उनकी सारी बहुमूल्य संपत्ति
  rationale: ንዋይ का अर्थ माल, संपत्ति या धन है; ሠናይ यहाँ उसके मूल्यवान अथवा उत्तम होने का बोध कराता है।
- source_word: ይወፅእ ውስተ ባሕር ምስሌሆሙ
  choice: उनके साथ समुद्र में चली जाती है
  rationale: मूल क्रिया का सामान्य अर्थ निकलना या जाना है। हिंदी में यह पद-विन्यास संपत्ति के उनके साथ समुद्र में जाने का अर्थ स्वाभाविक ढंग से रखता है, बिना ‘फेंकी जाती है’ जैसा कर्मवाच्य अर्थ जोड़े।
- source_word: ወሠናየ ኢይሐልዩ በልቦሙ
  choice: वे अपने मन में किसी अच्छी बात की आशा नहीं रखते
  rationale: शाब्दिक संरचना ‘वे अपने मन में अच्छा नहीं सोचते’ है। प्रसंग में आतंक और अनिष्ट की आशंका व्यक्त करने के लिए हिंदी का यह स्वाभाविक रूप चुना गया है; ‘अच्छी बात’ का संबंध संपत्ति से भी हो सकता है, इसलिए अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: ባሕር ይውኅጦሙ
  choice: समुद्र उन्हें निगल जाएगा
  rationale: ‘निगलना’ मूल के सजीव और प्रलयंकारी बिंब को सीधे बनाए रखता है।
- source_word: ወይትኀጐሉ ውስቴታ
  choice: वे उसमें डूब जाएँगे
  rationale: समुद्री प्रसंग में यह उनके भीतर समा जाने और नष्ट हो जाने की परिणति को संक्षेप और स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: भीतरी नैतिक भलाई और संपत्ति के बीच संभावित विरोध
  choice: मुख्य पाठ इसे आतंक के बीच किसी अच्छी परिणति की आशा न रहने के रूप में प्रस्तुत करता है।
  alternative: इसे ‘वे अपने मन में भलाई की बात नहीं सोचते’ अथवा ‘वे अपनी अच्छी संपत्ति के विषय में मन में नहीं सोचते’ भी समझा जा सकता है।
  rationale: ሠናየ नैतिक ‘भलाई’ या पहले उल्लिखित ‘बहुमूल्य संपत्ति’ की ओर संकेत कर सकता है। प्रसंग नाविकों के भय का है, इसलिए मुख्य पाठ मनोवैज्ञानिक अर्थ रखता है, जबकि पादटिप्पणी वास्तविक शब्दगत अस्पष्टता बचाती है।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। समुद्री संकट का वर्तमान वर्णन रखा गया है, जबकि उसके परिणाम के लिए हिंदी में स्वाभाविक भविष्यकाल प्रयुक्त है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
