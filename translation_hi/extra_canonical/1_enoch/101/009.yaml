base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/009.yaml
  text: Do not those kings of the sea fear the sea[b][a], while sinners do not fear the Most High?
translation:
  language: hi
  text: क्या समुद्र के वे राजा समुद्र से नहीं डरते, जबकि पापी परमप्रधान से नहीं डरते?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीइज़ पद ‘समुद्र के राजा’ है और इस अध्याय में पहले भी आता है। इसका अभिप्राय संभवतः समुद्र में यात्रा करने वालों से है; इसलिए ‘नाविक’ या ‘समुद्र-यात्री’ भी संभावित अनुवाद हैं।
    reason: textual_variant
lexical_decisions:
- source_word: አኮኑ
  choice: क्या ... नहीं
  rationale: यह सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न है; हिन्दी में ‘क्या ... नहीं’ उसका प्रश्नात्मक बल बनाए रखता है।
- source_word: ውእቶሙ
  choice: वे
  rationale: आगे आने वाले संज्ञापद के साथ इसका संकेतवाचक अर्थ स्वाभाविक आधुनिक हिन्दी में ‘वे’ से व्यक्त होता है।
- source_word: ተነገሥተ አሕማር
  choice: नाविक
  rationale: पद पाठगत और अर्थगत रूप से कठिन है तथा जहाज़ों या समुद्री यात्रा से जुड़े लोगों की ओर संकेत करता प्रतीत होता है। ‘नाविक’ सामान्य पाठक के लिए स्वाभाविक है; अधिक शाब्दिक संभावना पादटिप्पणी में रखी गई है।
- source_word: ይፈርህዋ ለባሕር
  choice: समुद्र से ... डरते
  rationale: सामान्य भयवाचक क्रिया को ठोस कर्म ‘समुद्र’ के साथ रखा गया है; दूसरे अर्धांश में भी ‘डरते’ दोहराकर मूल का आलंकारिक समानांतर सुरक्षित किया गया है।
- source_word: ወኃጥኣን
  choice: जबकि पापी
  rationale: यद्यपि संयोजक मूलतः ‘और’ हो सकता है, प्रसंग में स्पष्ट विरोध है; ‘जबकि’ इस विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ለልዑል
  choice: परमप्रधान
  rationale: यह परमेश्वर की उपाधि है। ‘परमप्रधान’ बाइबलीय गरिमा और ‘सबसे ऊँचे’ का अर्थ दोनों बनाए रखता है।
- source_word: ኢይፈርህዎ
  choice: नहीं डरते
  rationale: पहले अर्धांश वाली भयवाचक क्रिया को ही दोहराने से मूल का जानबूझकर रचा गया विरोध सुरक्षित रहता है।
theological_decisions:
- issue: ልዑል को ईश्वरीय उपाधि के रूप में प्रस्तुत करना
  choice: परमप्रधान
  alternative: परम ऊँचा / सर्वोच्च जन
  rationale: संदर्भ में यह परमेश्वर की उपाधि है। ‘परमप्रधान’ अर्थ और गरिमापूर्ण द्वितीय-मन्दिर यहूदी धार्मिक भाषा को सुरक्षित रखता है, बिना कोई बाद की सांप्रदायिक व्याख्या जोड़े।
- issue: समुद्र से भय और परमप्रधान से भय के बीच समानांतर
  choice: दोनों स्थानों पर ‘डरते’
  alternative: पहले ‘भयभीत होते’ और दूसरे ‘भय मानते’
  rationale: मूल में एक ही क्रिया की पुनरावृत्ति है; हिन्दी में भी एक ही क्रिया रखने से नैतिक और धार्मिक तनाव को बिना व्याख्यात्मक समाधान के उभारा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और आलंकारिक प्रश्नात्मक शैली अपनाई गई है। मुख्य पाठ में कठिन पद का सहज अर्थ ‘नाविक’ रखा गया है, जबकि उसकी वास्तविक पाठगत अनिश्चितता पादटिप्पणियों में स्पष्ट रूप से सुरक्षित है।
