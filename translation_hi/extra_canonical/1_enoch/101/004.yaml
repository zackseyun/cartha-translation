base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/004.yaml
  text: Have you not seen the captains of the ships[a], how they are tossed by the waves, and their ships are shaken by the winds[c][b], and they are distressed?
translation:
  language: hi
  text: क्या तुमने जहाज़ों के कप्तानों[a] को नहीं देखा कि कैसे वे लहरों से उछाले जाते हैं, उनके जहाज़ हवाओं से डगमगाते हैं[b], और वे व्याकुल हो उठते हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से पदबंध का अर्थ ‘जहाज़ों के राजा/शासक’ हो सकता है; समुद्री संदर्भ में आशय जहाज़ों के कप्तानों या प्रधान नाविकों से है।
    reason: lexical_alternative
  - marker: b
    text: उपलब्ध लिप्यंतरित पाठ में ‘लहरों’ वाला शब्द विकृत प्रतीत होता है। संदर्भ के आधार पर इसे ‘लहरों से’ पढ़ा गया है; अगला पद स्पष्ट रूप से ‘हवाओं से उनके जहाज़’ कहता है।
    reason: textual_note
lexical_decisions:
- source_word: ኢትሬእይዎሙኑ
  choice: क्या तुमने ... नहीं देखा
  rationale: नकारात्मक प्रश्नवाचक रूप एक अलंकारिक प्रश्न प्रस्तुत करता है। हिन्दी में पूर्ण भूतकाल का यह रूप सीधे संबोधन और चेतावनी के भाव को स्वाभाविक ढंग से रखता है।
- source_word: ለተነገሥተ፡ አሕማር
  choice: जहाज़ों के कप्तानों
  rationale: यद्यपि ተነገሥተ का शाब्दिक संबंध ‘राजा/शासक’ से है, पूरा पदबंध समुद्री संदर्भ में जहाज़ों का नेतृत्व करने वालों के लिए प्रयुक्त होता है; इसलिए ‘कप्तानों’ अधिक स्वाभाविक और संदर्भानुकूल है।
- source_word: ይትሀወኩ፡ እምገደ
  choice: लहरों से उछाले जाते हैं
  rationale: प्राप्त पाठ में እምገደ संभवतः እምሞገድ (‘लहरों से’) का लिप्यंतरण/OCR-दोष है। समुद्री प्रसंग और समानांतर वाक्यरचना इस पाठ-सुधार का समर्थन करते हैं। क्रिया प्रबल हिलने या अस्त-व्यस्त किए जाने का भाव देती है।
- source_word: ወያንቀለቅሉ፡ እምነፋሳት፡ አሕማሮሙ
  choice: उनके जहाज़ हवाओं से डगमगाते हैं
  rationale: ነፋሳት का अर्थ ‘हवाएँ’ और प्रत्यययुक्त አሕማሮሙ का अर्थ ‘उनके जहाज़’ है। क्रिया जहाज़ों के हिलने, झकझोरे जाने या डगमगाने को व्यक्त करती है।
- source_word: ወይትመነደቡ
  choice: और वे व्याकुल हो उठते हैं
  rationale: समापन क्रिया भीतरी परेशानी, घबराहट या संकट का भाव देती है। ‘व्याकुल हो उठते हैं’ भाव की तीव्रता रखता है, पर इसे अनिवार्य रूप से ‘आतंकित’ नहीं बनाता।
theological_decisions:
- issue: समुद्री संकट का शाब्दिक दृश्य या शक्तिशाली लोगों की अस्थिरता का रूपक
  choice: मुख्य पाठ में जहाज़ों, लहरों और हवाओं के ठोस समुद्री दृश्य को बनाए रखा गया है; व्यापक नैतिक या रूपकात्मक अर्थ को स्पष्ट व्याख्या बनाकर नहीं जोड़ा गया।
  alternative: इसे सीधे शक्तिशाली लोगों के न्याय के समय घबरा जाने के रूपक के रूप में अनूदित करना।
  rationale: गीज़ पाठ का समुद्री चित्र स्पष्ट है। संभावित रूपकात्मक प्रभाव पाठक के लिए खुला रखना मूल की काव्यात्मक और धर्मवैचारिक तनातनी को बेहतर ढंग से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘जहाज़’, ‘कप्तान’, ‘लहरें’, ‘हवाएँ’ और ‘व्याकुल’ सामान्य पाठक के लिए स्पष्ट हैं। वाक्य को एक अलंकारिक प्रश्न के रूप में रखा गया है और अस्पष्ट सामाजिक-रूपकात्मक अर्थ को मुख्य पाठ में नहीं थोपा गया।
