base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/008.yaml
  text: Was it not he who made heaven and earth and everything that is in them? Who gave instruction and wisdom to all who move upon the earth and to those at sea?[a][b][c]
translation:
  language: hi
  text: क्या उसी ने आकाश और पृथ्वी और जो कुछ उनमें है, सब नहीं बनाया? किसने पृथ्वी पर विचरनेवाले सभी और समुद्र में रहनेवालों को शिक्षा और बुद्धि दी?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कुछ उनके भीतर है, वह सब।”
    reason: lexical_alternative
  - marker: b
    text: “समुद्र में रहनेवाले” से समुद्री प्राणी, समुद्रयात्री, या व्यापक रूप से समुद्र से जुड़े लोग अभिप्रेत हो सकते हैं; गीज़ पद संक्षिप्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: አኮኑ ውእቱ ገብረ
  choice: क्या उसी ने ... नहीं बनाया?
  rationale: नकारात्मक प्रश्न सहमति की अपेक्षा करता है। ‘बनाया’ व्यापक ገብረ का स्वाभाविक हिंदी रूप है और ‘सृष्टि की’ जैसी अधिक पारिभाषिक व्याख्या से बचता है।
- source_word: ሰማየ ወምድረ
  choice: आकाश और पृथ्वी
  rationale: गीज़ के एकवचन रूपों और समस्त सृष्टि को सूचित करनेवाले युग्म को संक्षिप्त, प्रचलित हिंदी में रखता है।
- source_word: ወኵሎ ዘሀሎ ውስቴቶሙ
  choice: और जो कुछ उनमें है, सब
  rationale: समग्रता को स्पष्ट करता है और बहुवचन संकेत को आकाश और पृथ्वी से जोड़ता है।
- source_word: መኑ ወሀበ
  choice: किसने ... दी?
  rationale: መኑ को स्वतंत्र प्रश्न ‘किसने’ के रूप में रखा गया है; इससे मूल की आकस्मिक प्रश्नात्मकता बचती है और अनावश्यक ‘और’ नहीं जोड़ा जाता।
- source_word: ትምህርተ ወጥበበ
  choice: शिक्षा और बुद्धि
  rationale: ‘शिक्षा’ प्रदान किए गए उपदेश/निर्देशन और ‘बुद्धि’ ज्ञानपूर्ण क्षमता को स्वाभाविक हिंदी में व्यक्त करते हैं।
- source_word: ለኵሉ እለ ይትኀወሱ ዲበ ምድር
  choice: पृथ्वी पर विचरनेवाले सभी प्राणी
  rationale: क्रिया का गति या विचरण का भाव सुरक्षित है। ‘प्राणी’ मूल की व्यापकता को मानवों तक सीमित नहीं करता।
- source_word: ወለእለ ባሕር
  choice: और समुद्र में रहनेवाले
  rationale: संक्षिप्त गीज़ पद का निकट, सुबोध रूप; यह समुद्री जीवों अथवा समुद्र से संबद्ध जनों के बीच संभावित अस्पष्टता को पादटिप्पणी में बनाए रखता है।
theological_decisions:
- issue: सृष्टिकर्ता के कार्य के लिए तकनीकी ‘सृष्टि करना’ या व्यापक ‘बनाना’
  choice: बनाया
  alternative: सृष्टि की
  rationale: मूल क्रिया सामान्यतः बनाने/करने की है। ‘बनाया’ परमेश्वर को समस्त जगत का कर्ता दिखाता है, पर बाद की पारिभाषिक धार्मिक भाषा को मूल में नहीं डालता।
- issue: शिक्षा और बुद्धि पानेवालों का दायरा
  choice: पृथ्वी पर विचरनेवाले सभी प्राणी और समुद्र में रहनेवाले
  alternative: धरती और समुद्र के सभी मनुष्य
  rationale: मूल अभिव्यक्ति व्यापक है। ‘प्राणी’ उस व्यापकता को बनाए रखता है, जबकि पादटिप्पणी समुद्रवाले पद के वैकल्पिक मानवीय अर्थ को स्वीकार करती है।
- issue: दूसरे प्रश्न का पहले से संबंध
  choice: किसने
  alternative: और किसने
  rationale: መኑ से आरंभ होनेवाले दूसरे प्रश्न के पहले संयोजक नहीं है; इसलिए मूल की अचानक और जोरदार प्रश्नात्मक शैली रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। अलंकारिक प्रश्नों को स्पष्ट रखा गया है। ‘विचरनेवाले’ स्रोत के गतिशील अर्थ को बचाता है, और संभावित अर्थगत अस्पष्टता पादटिप्पणी में दी गई है।
