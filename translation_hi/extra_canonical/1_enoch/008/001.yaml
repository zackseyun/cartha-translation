base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/008/001.yaml
  text: 'And Azazel taught men to make swords[a], and knives, and shields, and breastplates; and he showed them what was behind them and their works: bracelets, and ornaments, and the painting of the eyes, and the beautifying of the eyelids, and every kind of costly stone[b], and all coloring tinctures.'
translation:
  language: hi
  text: 'और अज़ाज़ेल ने मनुष्यों को तलवारें, छुरियाँ, ढालें और कवच बनाना सिखाया; और उसने उन्हें वह दिखाया जो उनके पीछे था[a], और उनके कार्य: कंगन, आभूषण, आँखों में रंग लगाना, पलकों को सजाना, हर प्रकार के बहुमूल्य पत्थर और हर प्रकार के रंग-लेप।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जो उनके पीछे था” वाला गीइज़ पद (†ዘእምድኅሬሆሙ†) कठिन और संभवतः विकृत पाठ है। इसका संकेत इन कलाओं के बाद आने वाली बातों या उनके परिणामों की ओर भी हो सकता है; इसलिए अनुवाद ने इसकी अस्पष्टता को बनाए रखा है।
    reason: textual_variant
lexical_decisions:
- source_word: መሀሮሙ ለሰብእ
  choice: मनुष्यों को ... सिखाया
  rationale: क्रिया शिक्षण का सामान्य अर्थ देती है और ሰብእ यहाँ सामूहिक रूप से मनुष्यों को सूचित करता है; हिन्दी में यह स्वाभाविक और समावेशी है।
- source_word: ገቢረ አሰይፍት
  choice: तलवारें ... बनाना
  rationale: ገቢረ निर्माण या कारीगरी को व्यक्त करता है, इसलिए केवल हथियार रखने के बजाय उन्हें बनाने की विद्या अभिप्रेत है।
- source_word: መጣብኅት
  choice: छुरियाँ
  rationale: यह काटने वाले छोटे हथियार या औज़ार के लिए पर्याप्त व्यापक आधुनिक हिन्दी शब्द है; ‘कटारें’ कहना अनावश्यक रूप से विशिष्ट होता।
- source_word: ወወልታ ወድርዐ አንግድዓ
  choice: ढालें और कवच
  rationale: पद रक्षात्मक युद्ध-सामग्री और शरीर पर पहने जाने वाले कवच को सूचित करते हैं; ‘कवच’ आधुनिक पाठक के लिए ‘वक्षस्त्राण’ से अधिक सहज है।
- source_word: ወአርአዮሙ
  choice: उसने उन्हें ... दिखाया
  rationale: मूल क्रिया ज्ञान प्रकट करने या दिखाने का सीधा अर्थ रखती है; प्रसंग की निषिद्धता को अतिरिक्त नैतिक विशेषण जोड़े बिना कथा स्वयं व्यक्त करती है।
- source_word: ዘእምድኅሬሆሙ ወምግባሮሙ
  choice: जो उनके पीछे था, और उनके काम
  rationale: पहला पद पाठ की दृष्टि से कठिन और ओबेलस-चिह्नित है। शाब्दिक अस्पष्टता बनाए रखी गई है और ‘धातुएँ’ जैसा अनुमान मुख्य पाठ में नहीं जोड़ा गया।
- source_word: እውቃፋተ ወስርጐ
  choice: कंगन और आभूषण
  rationale: पहला शब्द बाँह या कलाई पर पहनी वस्तु और दूसरा व्यापक सजावटी वस्तुओं को व्यक्त करता है।
- source_word: ተጽሕሎተ ወአስንዮተ ቀርንብ
  choice: आँखों में रंग लगाना और पलकों को सँवारना
  rationale: ये ठोस सौंदर्य-प्रसाधन क्रियाएँ हैं; हिन्दी रूप उन्हें अमूर्त ‘सुंदरता’ में बदलने के बजाय व्यवहार के रूप में रखता है।
- source_word: እብነ እምኵሉ እብን
  choice: हर प्रकार के बहुमूल्य पत्थर
  rationale: रत्न या मूल्यवान पत्थरों के व्यापक वर्ग को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अज़ाज़ेल की शिक्षा को तटस्थ कारीगरी या भ्रष्ट करने वाले निषिद्ध ज्ञान के रूप में स्पष्ट करना
  choice: ‘सिखाया’ और ‘दिखाया’ जैसे मूल के सीधे शब्द रखे गए; कोई अतिरिक्त नैतिक विशेषण नहीं जोड़ा गया।
  alternative: ‘युद्ध के लिए’ या ‘लुभाने के लिए’ जैसे व्याख्यात्मक शब्द जोड़ना, अथवा इसे तटस्थ सांस्कृतिक प्रगति कहना।
  rationale: व्यापक प्रहरी-कथा इस ज्ञान को निषिद्ध ठहराती है, किंतु इस पद में स्वयं कोई स्पष्ट नैतिक विशेषण नहीं है। अनुवाद प्रसंग की नकारात्मक शक्ति बनाए रखता है, पर उसे पद के भीतर आरोपित नहीं करता।
- issue: कठिन पद ዘእምድኅሬሆሙ की व्याख्या
  choice: ‘जो उनके पीछे था’ के रूप में अस्पष्टता बनाए रखी गई।
  alternative: प्रसंग के आधार पर ‘उनकी धातुएँ’ या ‘इन कलाओं के परिणाम’ कहना।
  rationale: उपलब्ध गीइज़ साक्ष्य ओबेलस से चिह्नित और संदिग्ध है। मुख्य पाठ में अनुमान को निश्चित अर्थ बना देना पाठगत तनाव मिटा देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। हथियारों और आभूषणों की सूची में समानांतरता बनाए रखी गई, जबकि संदिग्ध गीइज़ पद को पादटिप्पणी सहित जानबूझकर अस्पष्ट रहने दिया गया है।
