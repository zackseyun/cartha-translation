  text: And Semyaza[c][b][a], to whom you gave authority to rule over those who are with him.
translation:
  language: hi
  text: और सेम्याज़ा, जिसे तूने उसके साथियों पर शासन करने का अधिकार दिया।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसके साथियों’ का शाब्दिक भाव ‘जो उसके साथ एकत्र हैं’ या ‘जो उसके साथ हैं’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस पंक्ति का गीइज़ पाठ कुछ कठिन है; यहाँ व्याकरण और प्रसंग के अनुसार अर्थ लिया गया है कि परमेश्वर ने सेम्याज़ा को उसके साथ जुड़े लोगों पर शासन करने का अधिकार दिया था।
    reason: textual_difficulty
lexical_decisions:
- source_word: ስምያዛ
  choice: शम्याज़ा
  rationale: व्यक्तिनाम का अनुवाद न करके गीइज़ रूप के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: ዘአንተ፡ ወሀብኮ
  choice: जिसे तूने ... दिया
  rationale: 'सापेक्ष पद और द्वितीय पुरुष एकवचन क्रिया के अनुसार परमेश्वर को संबोधित करते हुए अर्थ है: ‘जिसे तूने दिया’; इससे कर्ता और कर्म उलटते नहीं हैं।'
- source_word: ስልጣነ
  choice: अधिकार
  rationale: यह सौंपे गए शासनाधिकार को व्यक्त करता है; ‘शक्ति’ अधिक व्यापक और ‘प्रभुत्व’ अपेक्षाकृत अधिक निरपेक्ष होता।
- source_word: ይኵንን
  choice: शासन करने
  rationale: क्रिया के शासन/नियंत्रण के अर्थ को स्पष्ट रूप से रखा गया है, उसे केवल ‘पर’ में विलीन नहीं किया गया।
- source_word: እለ፡ ምስሌሁ፡ ኅቡረ
  choice: उसके साथियों पर
  rationale: वाक्यांश शम्याज़ा के साथ जुड़े या एकत्र लोगों को सूचित करता है; स्वाभाविक हिन्दी में ‘साथियों’ से सामूहिक संबंध सुरक्षित रहता है।
theological_decisions:
- issue: शम्याज़ा के अधिकार का स्वरूप
  choice: परमेश्वर द्वारा दिया गया शासनाधिकार
  alternative: शम्याज़ा का अपना स्वतंत्र प्रभुत्व, अथवा साथियों के बीच मात्र प्रतिष्ठा
  rationale: ‘तूने ... अधिकार दिया’ अधिकार को प्रत्यायोजित बताता है और परमेश्वर की संप्रभुता तथा शम्याज़ा की अधीनस्थ अगुआई के बीच भेद बनाए रखता है।
- issue: शासन के अधीन समूह की पहचान
  choice: शम्याज़ा के साथ जुड़े साथी
  alternative: विशेष रूप से केवल ‘पहरेदार स्वर्गदूत’ कहना
  rationale: संदर्भ विद्रोही पहरेदारों की ओर संकेत करता है, पर इस पद में समूह का नाम स्पष्ट नहीं है; इसलिए मुख्य पाठ स्रोत की व्यापकता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली रखी गई है। परमेश्वर को प्रत्यक्ष संबोधन होने के कारण ‘तूने’ प्रयुक्त है। ‘शासन करने का अधिकार’ मूल की संज्ञा और शासनवाचक क्रिया दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
