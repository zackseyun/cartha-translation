- from: और अब, हे स्वर्ग के पवित्र जनो, मनुष्यों की आत्माएँ तुमसे विनती करते हुए कहती हैं, “हमारा मुक़दमा परमप्रधान के सामने प्रस्तुत करो।”[a]
  to: और अब, हे स्वर्ग के पवित्र जनो, मनुष्यों की आत्माएँ तुमसे विनती करती हैं और कहती हैं, “हमारा मामला परमप्रधान के सामने प्रस्तुत करो।”[a]
