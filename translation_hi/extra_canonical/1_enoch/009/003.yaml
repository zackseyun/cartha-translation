base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/003.yaml
  text: And now[a], to you, the holy ones of heaven, the souls of men make their plea, saying[b], ‘Bring our case before the Most High.’
translation:
  language: hi
  text: और अब, हे स्वर्ग के पवित्र जनो, मनुष्यों की आत्माएँ तुमसे विनती करती हैं और कहती हैं, “हमारा मामला परमप्रधान के सामने प्रस्तुत करो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमप्रधान के सामने हमें न्याय दिलाओ,” अथवा “हमारा मामला परमप्रधान के सामने रखो।” गीइज़ शब्दावली न्यायिक है और उसमें मामला प्रस्तुत करने के साथ न्याय या अधिकार की पुष्टि पाने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: और अब
  rationale: कालगत और कथात्मक संक्रमण को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: ለክሙ ለቅዱሳነ ሰማይ
  choice: हे स्वर्ग के पवित्र जनो ... तुमसे
  rationale: सम्बोधन और दत्तिव सम्बन्ध दोनों को स्पष्ट करता है; ‘पवित्र जन’ स्वर्गीय प्राणियों की व्यापक अपोकैलिप्टिक संज्ञा को बनाए रखता है और उसे मानवीय संतों तक सीमित नहीं करता।
- source_word: ይስእዩ ነፍሳተ ሰብእ
  choice: मनुष्यों की आत्माएँ तुमसे विनती करते हुए
  rationale: आत्माओं को क्रिया का कर्ता बनाए रखता है और याचना के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: እንዘ ይብሉ
  choice: कहती हैं
  rationale: सहवर्ती वचन-परिचय का स्वाभाविक हिन्दी रूप।
- source_word: አብኡ ለነ ፍትሐ
  choice: हमारा मुक़दमा ... प्रस्तुत करो
  rationale: न्यायिक प्रसंग में किसी निर्णय के पहले से सुनाए जाने के बजाय विचारार्थ मामला पहुँचाने का अर्थ देता है; ፍትሐ में निहित न्याय और दोष-मुक्ति की सम्भावित छाया पादटिप्पणी में सुरक्षित है।
- source_word: ኀበ ልዑል
  choice: परमप्रधान के सामने
  rationale: दिव्य न्यायालय की ओर दिशा और उसकी उपस्थिति—दोनों का न्यायिक बिम्ब बनाए रखता है।
theological_decisions:
- issue: ‘स्वर्ग के पवित्र जन’ की पहचान
  choice: स्वर्गीय पवित्र प्राणियों के लिए व्यापक पद
  alternative: स्वर्ग में रहने वाले मानवीय संत
  rationale: निकटवर्ती प्रसंग स्वर्गीय मध्यस्थों से की गई अपील की ओर संकेत करता है, पर अनुवाद में ‘स्वर्गदूत’ जोड़कर स्रोत की व्यापक संज्ञा को संकीर्ण नहीं किया गया।
- issue: ፍትሐ का न्यायिक अर्थ
  choice: विचारार्थ प्रस्तुत किया जाने वाला मुक़दमा
  alternative: न्याय, न्याय-निर्णय, या दोष-मुक्ति
  rationale: यहाँ आत्माएँ अपने मामले को परमप्रधान के सामने पहुँचाने की विनती करती हैं; ‘मुक़दमा’ न्यायिक स्वर को रखता है, जबकि पादटिप्पणी न्याय/दोष-मुक्ति की अर्थछाया सुरक्षित करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। न्यायालय-संबंधी स्वर बनाए रखने के लिए ‘मुक़दमा’ और ‘प्रस्तुत करो’ चुने गए हैं। ‘पवित्र जन’ को जानबूझकर ‘स्वर्गदूत’ नहीं किया गया, ताकि मूल की व्यापकता बनी रहे।
