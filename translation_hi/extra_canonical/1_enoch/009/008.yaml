base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/008.yaml
  text: And they went to the daughters of men on the earth[a], and they lay with them, with those women[c][b], and they defiled themselves and revealed to them every sin.
translation:
  language: hi
  text: और वे पृथ्वी पर मनुष्यों की बेटियों के पास गए, और उनके साथ—उन स्त्रियों के साथ—सोए; उन्होंने स्वयं को अशुद्ध किया और उन्हें हर पाप प्रकट किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሖሩ
  choice: और वे ... के पास गए
  rationale: मूल क्रिया सामान्यतः जाने या पहुँचने का भाव देती है। यौन संबंध अगली क्रिया में स्पष्ट है, इसलिए यहाँ अलग से ‘भीतर गए’ जोड़ना अनावश्यक है।
- source_word: አዋልደ ሰብእ
  choice: मनुष्यों की बेटियों
  rationale: यह पारंपरिक अभिव्यक्ति स्वर्गीय प्राणियों के विपरीत मानव स्त्रियों को सूचित करती है और मूल के संबंधवाचक रूप को बनाए रखती है।
- source_word: በዲበ ምድር
  choice: पृथ्वी पर
  rationale: स्थानसूचक वाक्यांश का स्वाभाविक और सीधा हिन्दी रूप; यह स्वर्ग और पृथ्वी के कथात्मक विरोध को भी बनाए रखता है।
- source_word: ወስከቡ ምስሌሆን
  choice: और ... उनके साथ सोए
  rationale: यह यौन संसर्ग का स्पष्ट किंतु मर्यादित आधुनिक हिन्दी मुहावरा है।
- source_word: ምስለ እልኩ አንስት
  choice: उन स्त्रियों के साथ
  rationale: मूल में आया पुनरुक्त बल हिन्दी में सुरक्षित रखा गया है। ‘पत्नियाँ’ वैवाहिक अर्थ जोड़ता, जो मूल में आवश्यक नहीं है।
- source_word: ወረኵሱ
  choice: उन्होंने अपने आपको अशुद्ध किया
  rationale: प्रतिबिंबात्मक अर्थ को बनाए रखते हुए नैतिक और अनुष्ठानिक अशुद्धता—दोनों की गूँज सुरक्षित रहती है।
- source_word: ወአግሀዱ ሎን
  choice: और उन्हें ... प्रकट कर दिया
  rationale: क्रिया प्रकट करने या उद्घाटित करने का अर्थ रखती है और निषिद्ध ज्ञान के प्रकाशन की अपोकैलिप्टिक पृष्ठभूमि के अनुकूल है।
- source_word: ኵሎ ኃጢአተ
  choice: हर प्रकार का पाप
  rationale: मूल के व्यापक सामूहिक आरोप को स्वाभाविक हिन्दी में व्यक्त करता है; इसे किसी खास जादुई या तकनीकी विद्या तक सीमित नहीं करता।
theological_decisions:
- issue: पहरेदारों द्वारा लाई गई भ्रष्टता का स्वरूप
  choice: पद में अवैध यौन संबंध और पापमय ज्ञान का प्रकटीकरण—दोनों रखे गए हैं।
  alternative: अंतिम खंड को केवल जादुई या तकनीकी कलाओं की शिक्षा मानना, अथवा पूरी भ्रष्टता को केवल यौन पाप तक सीमित करना।
  rationale: गीज़ पाठ में स्त्रियों के साथ सोना, स्वयं अशुद्ध होना और उन्हें ‘हर पाप’ प्रकट करना अलग-अलग कथन हैं; अनुवाद इस व्यापकता और तनाव को संकुचित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और स्पष्ट रूप। यौन संदर्भ को शिष्ट मुहावरे में व्यक्त किया गया है; मूल पाठ में यहाँ किसी वास्तविक पाठांतर की आवश्यकता न होने के कारण पादटिप्पणी नहीं दी गई।
