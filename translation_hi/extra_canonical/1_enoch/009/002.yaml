  text: And they said among themselves[b][a], “The voice of their outcry has reached the gates of heaven.”
translation:
  language: hi
  text: और उन्होंने आपस में कहा, “उनकी दुहाई की आवाज़ ऊपर उठ गई है; धरती स्वर्ग के द्वारों तक पुकार उठी है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ अनुवाद इन दोनों खंडों को मिलाकर पढ़ते हैं: “उनकी दुहाई की आवाज़ स्वर्ग के द्वारों तक पहुँच गई है।” यहाँ गीज़ के क्रियारूप के अनुसार धरती के स्वयं पुकारने का अलग चित्र बनाए रखा गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ወይቤሉ
  choice: और उन्होंने कहा
  rationale: यह सामान्य कथात्मक क्रिया है, जो आगे आने वाले प्रत्यक्ष कथन का परिचय देती है।
- source_word: በበይናቲሆሙ
  choice: आपस में
  rationale: समूह के भीतर परस्पर बोलने का स्वाभाविक और आधुनिक हिन्दी रूप।
- source_word: ቃለ ጽራኃቲሆሙ
  choice: उनकी दुहाई की आवाज़
  rationale: ቃል श्रव्य आवाज़ को और ጽራኃት हिंसा से पीड़ित लोगों की तीव्र पुकार को व्यक्त करता है; ‘दुहाई’ सहायता और न्याय की अर्ज़ी का भाव बनाए रखती है।
- source_word: ዐረቀ
  choice: ऊपर उठ गई है
  rationale: पांडुलिपि-साक्ष्य के आधार पर इसे ዐርገ (‘ऊपर चढ़ी/उठी’) का लिप्यंतरण या OCR-दोष मानना व्याकरण और प्रसंग के अनुकूल है; कर्ता ‘आवाज़’ है।
- source_word: ጸርሐት ምድር
  choice: धरती ने … पुकार लगाई है
  rationale: ጸርሐት को संज्ञा नहीं, बल्कि स्त्रीलिंग एकवचन पूर्ण क्रिया मानते हुए ምድር (‘धरती’) को उसका कर्ता रखा गया है। इससे धरती का सजीव चित्रण सुरक्षित रहता है।
- source_word: እስከ አንቀጸ ሰማይ
  choice: स्वर्ग के द्वार तक
  rationale: मूल के ठोस ब्रह्मांडीय चित्र को सरल, गरिमापूर्ण हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: क्या केवल पीड़ित मनुष्यों की पुकार सुनाई देती है, या धरती भी स्वयं पुकारती है?
  choice: 'दो समानांतर कथन रखे गए हैं: पीड़ितों की दुहाई ऊपर उठती है और धरती स्वर्ग के द्वार तक पुकारती है।'
  alternative: दोनों को मिलाकर केवल ‘उनकी पुकार स्वर्ग के द्वार तक पहुँच गई’ कहना।
  rationale: गीज़ पाठ में ዐርገ और ጸርሐት दो अलग क्रियाएँ प्रतीत होती हैं; दूसरी क्रिया स्त्रीलिंग है और ‘धरती’ से मेल खाती है। दोनों खंड बनाए रखने से रक्तपात के कारण धरती के पुकारने का सजीव और धर्मवैचारिक तनाव नष्ट नहीं होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; ‘दुहाई’ तीव्र न्याय-पुकार को व्यक्त करती है, जबकि वाक्य की समानांतर रचना और धरती का मानवीकरण मूल की काव्यात्मक गंभीरता बनाए रखते हैं।
