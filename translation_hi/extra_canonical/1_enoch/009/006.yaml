base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/006.yaml
  text: You see what Azazel has done[a]—how he has taught all unrighteousness upon the earth and revealed the hidden things of the world that are done in the heavens[c][b], which men learned.
translation:
  language: hi
  text: तू देखता है कि अज़ाज़ेल ने क्या किया है[a]—उसने पृथ्वी पर हर प्रकार की अधार्मिकता सिखाई और संसार की वे गुप्त बातें प्रकट कर दीं[b], जो स्वर्गों में की जाती हैं और जिन्हें मनुष्यों ने सीख लिया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तूने देखा है कि अज़ाज़ेल ने क्या किया।”
    reason: क्रिया के काल और वाक्य की अपील-संबंधी सूक्ष्मता का वैकल्पिक अनुवाद।
  - marker: b
    text: “संसार की गुप्त बातें” का अनुवाद “युग के रहस्य” या “अनन्तता की गुप्त बातें” भी हो सकता है; गीइज़ शब्द के अर्थ-क्षेत्र में ये सभी भाव आ सकते हैं।
    reason: मूल शब्द ዓለም की वास्तविक अर्थगत अस्पष्टता सुरक्षित रखने के लिए।
  - marker: c
    text: अंतिम वाक्यांश कठिन है। इसका अर्थ “जिन्हें मनुष्यों ने जान लिया” भी हो सकता है। कुछ पाठ-परंपराएँ “जिन्हें मनुष्य सीखने का प्रयत्न कर रहे थे” के अनुरूप हैं, पर उपलब्ध गीइज़ पाठ में ‘प्रयत्न’ का भाव स्पष्ट नहीं है।
    reason: पाठगत कठिनाई और वैकल्पिक परंपरा को मुख्य पाठ बदले बिना दर्ज करने के लिए।
lexical_decisions:
- source_word: ርኢከ
  choice: तू देखता है
  rationale: द्वितीय पुरुष एकवचन रूप स्वर्गीय संबोधन में प्रत्यक्ष और तात्कालिक अपील व्यक्त करता है। आधुनिक हिन्दी में ईश्वर को संबोधित करते समय ‘तू’ निकटता और एकवचनता बनाए रखता है; इसे अनादरार्थ नहीं लिया गया है।
- source_word: ዘገብረ
  choice: क्या किया है
  rationale: सम्पन्न कार्य के वर्तमान परिणाम को हिन्दी का पूर्ण वर्तमान स्वाभाविक रूप से व्यक्त करता है।
- source_word: አዛዝኤል
  choice: अज़ाज़ेल
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: ዘመሀረ
  choice: उसने ... सिखाई
  rationale: क्रिया निषिद्ध ज्ञान या आचरण के सक्रिय शिक्षण को दर्शाती है। हिन्दी वाक्य-विन्यास में स्पष्टता हेतु कर्ता दोहराया गया है।
- source_word: ኵሎ ዓመፃ
  choice: हर प्रकार की अधार्मिकता
  rationale: यह व्यापक नैतिक बुराई का आरोप है; ‘हर प्रकार की’ सामूहिक व्यापकता को स्वाभाविक हिन्दी में व्यक्त करता है और ‘अधार्मिकता’ इसके नैतिक-धर्मवैचारिक विस्तार को बनाए रखती है।
- source_word: በዲበ ምድር
  choice: पृथ्वी पर
  rationale: भ्रष्ट शिक्षा के सांसारिक क्षेत्र को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ወአግሀደ
  choice: और ... प्रकट कर दीं
  rationale: छिपी हुई बातों के अनुचित उद्घाटन का भाव बनाए रखता है; ‘कर दीं’ पूर्णता और परिणाम पर बल देता है।
- source_word: ኅቡኣተ ዓለም
  choice: संसार की वे गुप्त बातें
  rationale: ዓለም का अर्थ संसार, युग या अनन्तता हो सकता है। मुख्य पाठ में ‘संसार’ प्रसंगानुकूल है, जबकि विकल्प पाद-टिप्पणी में सुरक्षित हैं।
- source_word: እለ ይትገበሩ በሰማያት
  choice: जो स्वर्गों में की जाती हैं
  rationale: निष्क्रिय/निरपेक्ष संरचना और बहुवचन स्वर्गीय क्षेत्र दोनों को बनाए रखा गया है, बिना उन गुप्त बातों का स्वरूप अधिक निश्चित किए।
- source_word: አመረ ሰብእ
  choice: जिन्हें मनुष्यों ने सीख लिया
  rationale: उपलब्ध गीइज़ पाठ में मनुष्यों के जानने या सीखने का भाव है, न कि प्रयास करने का। प्रसंग में अज़ाज़ेल द्वारा सिखाए जाने के परिणाम के रूप में ‘सीख लिया’ उपयुक्त है।
theological_decisions:
- issue: ዓመፃ का नैतिक विस्तार
  choice: हर प्रकार की अधार्मिकता
  alternative: सारा अन्याय; सारी दुष्टता; सारी व्यवस्था-विहीनता
  rationale: आरोप को केवल सामाजिक अन्याय या हिंसा तक सीमित नहीं किया गया; व्यापक नैतिक भ्रष्टता सुरक्षित रखी गई है।
- issue: स्वर्गीय गुप्त बातों का स्वरूप
  choice: संसार की वे गुप्त बातें ... जो स्वर्गों में की जाती हैं
  alternative: युग के रहस्य; अनन्तता की गुप्त बातें; स्वर्ग में घटने वाली गुप्त बातें
  rationale: पाठ की ब्रह्मांडीय और कालगत अस्पष्टता को स्वीकार किया गया है। अनधिकृत प्रकटीकरण का भाव रखा गया है, पर बाद की किसी विशिष्ट धर्मसैद्धांतिक श्रेणी को आरोपित नहीं किया गया।
- issue: अंतिम कठिन उपवाक्य
  choice: जिन्हें मनुष्यों ने सीख लिया
  alternative: जिन्हें मनुष्यों ने जान लिया; जिन्हें मनुष्य सीखने का प्रयत्न कर रहे थे
  rationale: वर्तमान गीइज़ साक्ष्य ‘जानने/सीखने’ का समर्थन करता है। ‘प्रयत्न कर रहे थे’ अन्य पाठ-परंपरा से जुड़ा विकल्प है और मुख्य पाठ में आयात नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण अपोकैलिप्टिक शैली रखी गई है। वाक्य सामान्य पाठक के लिए सुबोध है, फिर भी ‘स्वर्गों’ जैसे स्रोत-सापेक्ष बहुवचन और मूल की अस्पष्टताएँ सुरक्षित हैं। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में क्रम से उपस्थित हैं।
