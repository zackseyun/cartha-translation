base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/001.yaml
  text: And then Michael[a], Uriel, Raphael, and Gabriel looked down from heaven and saw much blood being poured out upon the earth[b], and all the lawlessness being done upon the earth.
translation:
  language: hi
  text: तब मीकाएल, ऊरीएल, रफ़ाएल और गब्रिएल ने स्वर्ग से नीचे दृष्टि डाली और देखा कि पृथ्वी पर बहुत-सा रक्त बहाया जा रहा था[a], और पृथ्वी पर समस्त अधर्म किया जा रहा था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे ‘उँडेला जा रहा था’ भी समझा जा सकता है। गीज़ की यह क्रिया कठिन है; कुछ व्याख्याकार इसे रक्त के पुकारने की धारणा से भी जोड़ते हैं।
    reason: lexical_alternative
  - marker: b
    text: ‘पृथ्वी पर’ वाक्यांश मूल में दो बार आता है। यह दोहराव पृथ्वी को हिंसा और अधर्म के स्थल के रूप में उभारता है।
    reason: literary_note
lexical_decisions:
- source_word: እሜሃ
  choice: तब
  rationale: यह अगले दृश्य को आरम्भ करने वाला काल-सूचक पद है; ‘तब’ क्रम को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: ሐወጹ ... እምሰማይ
  choice: स्वर्ग से नीचे दृष्टि की
  rationale: स्वर्गीय स्थान से पृथ्वी की ओर निर्देशित देखने की क्रिया को व्यक्त करता है और दर्शित ऊर्ध्वाधर परिप्रेक्ष्य बनाए रखता है।
- source_word: ወርእዩ
  choice: देखा
  rationale: सरल कथात्मक क्रिया का आधुनिक और स्वाभाविक हिन्दी रूप।
- source_word: ብዙሐ ደመ
  choice: बहुत-सा रक्त
  rationale: मूल की ठोस और तीखी रक्त-छवि को बनाए रखता है; ‘बहुत रक्तपात’ कहने से छवि अमूर्त हो जाती।
- source_word: ዘይትከዓው
  choice: बहाया जा रहा था
  rationale: रक्त और पृथ्वी के प्रसंग में यह स्वाभाविक निष्क्रिय अर्थ देता है। क्रिया कठिन है; ‘उँडेला जा रहा था’ अधिक शाब्दिक, पर हिंसा के प्रसंग में कम स्वाभाविक हिन्दी है।
- source_word: በዲበ ምድር
  choice: पृथ्वी पर
  rationale: मूल में दोहराए गए स्थान-सूचक पद को दोनों स्थानों पर बनाए रखा गया है।
- source_word: ኵሎ ዓመፃ
  choice: हर प्रकार का अधर्म
  rationale: यह व्यापक नैतिक अपराध और व्यवस्था-विरोध को व्यक्त करता है, केवल शारीरिक हिंसा तक अर्थ को सीमित नहीं करता।
- source_word: ዘይትገበር
  choice: किया जा रहा था
  rationale: गीज़ के जारी निष्क्रिय क्रियारूप का पारदर्शी हिन्दी रूप।
theological_decisions:
- issue: स्वर्गदूतों के नामों का रूप
  choice: मीकाएल, ऊरीएल, रफ़ाएल और गब्रिएल
  alternative: माइकल, यूरिएल, राफेल और गैब्रिएल
  rationale: नामों को गीज़ रूपों के निकट देवनागरी में लिप्यंतरित किया गया है, न कि उनके अंग्रेज़ी उच्चारणों के आधार पर।
- issue: रक्त की ठोस छवि बनाम व्याख्यात्मक संक्षेप
  choice: बहुत-सा रक्त बहाया जा रहा था
  alternative: बहुत रक्तपात हो रहा था / रक्त पुकार रहा था
  rationale: मुख्य पाठ मूल की ठोस दृश्यात्मक छवि बनाए रखता है। ‘रक्तपात’ उसे अमूर्त करता है, जबकि ‘रक्त पुकार रहा था’ एक सम्भव किंतु अनिश्चित व्याख्या है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण अपोकैलिप्टिक कथन। ‘नीचे दृष्टि की’ ऊँचे स्थान से देखने का भाव रखता है; ‘हर प्रकार का अधर्म’ व्यापक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
