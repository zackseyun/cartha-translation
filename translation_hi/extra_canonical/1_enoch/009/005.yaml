base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/005.yaml
  text: You have made all things[a], and authority over all is with you; and all things are uncovered and laid bare before you, and you see all things, and there is nothing that can hide itself from you.
translation:
  language: hi
  text: आपने सब कुछ बनाया है, और सब पर अधिकार आपके पास है। सब कुछ आपके सामने खुला और प्रकट है[a]। आप सब कुछ देखते हैं, और ऐसा कुछ भी नहीं है जो अपने को आपसे छिपा सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘खुला’ और ‘प्रकट’—मूल पाठ में आए ये दो समानांतर शब्द इस बात पर बल देते हैं कि परमेश्वर के सामने सब कुछ पूरी तरह उजागर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ገበርከ
  choice: आपने...बनाया है
  rationale: क्रिया का अर्थ ‘करना’ या ‘बनाना’ है। ‘सब कुछ’ के साथ ‘बनाया है’ सृष्टि में परमेश्वर की व्यापक कारीगरी व्यक्त करता है, पर मूल क्रिया से अधिक विशिष्ट दार्शनिक अर्थ नहीं जोड़ता।
- source_word: ስልጣነ
  choice: अधिकार
  rationale: यह शासन करने की सामर्थ्य, प्रभुत्व या अधिकार को सूचित करता है। ‘अधिकार’ आधुनिक हिन्दी में स्वाभाविक रहते हुए सार्वभौम शासन का भाव बनाए रखता है।
- source_word: ምስሌከ
  choice: आपके पास है
  rationale: मूलतः ‘आपके साथ’ है; इस प्रसंग में अधिकार के परमेश्वर के पास होने का भाव है। हिन्दी में ‘आपके पास है’ इस संबंध को सहज रूप में व्यक्त करता है।
- source_word: ክሡት
  choice: खुला
  rationale: शब्द किसी वस्तु के अनावृत या उजागर होने का ठोस चित्र देता है; इसे केवल ‘ज्ञात’ कहने से मूल बिंब खो जाता।
- source_word: ግሁድ
  choice: प्रकट
  rationale: पहले पद के साथ मिलकर यह परमेश्वर के सामने पूर्णतः उजागर होने का भाव तीव्र करता है।
- source_word: ትሬኢ
  choice: आप...देखते हैं
  rationale: देखने की सीधी क्रिया को सरल, वर्तमान मानक हिन्दी में सुरक्षित रखा गया है।
- source_word: ዘይትከሀል
  choice: '...सके'
  rationale: यह सामर्थ्य या संभावना बताता है। हिन्दी का संभावनार्थक ‘सके’ परमेश्वर से छिप पाने की असमर्थता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ይትኀባእ
  choice: अपने को...छिपा
  rationale: रूप में आत्मवाचक अथवा कर्मवाच्य छाया है। ‘अपने को छिपा सके’ आत्म-गोपन का भाव सुरक्षित रखता है।
theological_decisions:
- issue: क्या पद को सर्वशक्तिमत्ता और सर्वज्ञता जैसे अमूर्त धर्मवैज्ञानिक शब्दों में प्रस्तुत किया जाए
  choice: बनाने, अधिकार रखने, सबके खुले और प्रकट होने तथा देखने की मूल ठोस भाषा बनाए रखी गई।
  alternative: ‘आप सर्वशक्तिमान और सर्वज्ञ हैं’ अथवा ‘सब कुछ आपको ज्ञात है।’
  rationale: पद परमेश्वर की सार्वभौमिक सत्ता और पूर्ण ज्ञान का संकेत देता है, पर गीइज़ पाठ इन्हें ठोस क्रियाओं और चित्रों से व्यक्त करता है। अनुवाद उसी अभिव्यक्ति को सुरक्षित रखता है और बाद की धर्मवैज्ञानिक शब्दावली आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक ‘आप’ का प्रयोग किया गया है। वाक्य सरल और सार्वजनिक पाठ के योग्य रखे गए हैं, जबकि ‘खुला और प्रकट’ मूल के दोहरे, बलवर्धक चित्र को सुरक्षित रखता है।
