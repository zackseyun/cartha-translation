base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/004.yaml
  text: And they said to their Lord[a], the King, “For you are Lord of lords, God of gods, and King of kings, and the throne of your glory is through all the generations of eternity, and your name is holy and glorious through all eternity[d][c][b], and blessed.”
translation:
  language: hi
  text: और उन्होंने राजाओं के प्रभु से कहा,[a] “क्योंकि आप प्रभुओं के प्रभु, देवताओं के परमेश्वर और राजाओं के राजा हैं। आपकी महिमा का सिंहासन अनन्तकाल की सभी पीढ़ियों तक बना रहता है, और आपका नाम समस्त अनन्तकाल तक पवित्र और महिमामय तथा धन्य है।[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरम्भिक गीज़ वाक्यांश संक्षिप्त है। इसका एक अन्य सम्भव अनुवाद है, “उन्होंने अपने प्रभु, राजा से कहा।”
    reason: alternative_reading
  - marker: b
    text: कुछ पाठों में “धन्य” के बाद “और आदरणीय” या “और महिमामय” जोड़ा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ለእግዚኦሙ ለነገሥት
  choice: राजाओं के प्रभु से
  rationale: गीज़ की प्रत्याशात्मक संबंधवाचक रचना को ‘राजाओं के प्रभु’ के रूप में लिया गया है। इससे बहुवचन ነገሥት बना रहता है और आरम्भिक संबोधन अगले तीन सर्वोच्चता-सूचक पदों से स्वाभाविक रूप से जुड़ता है।
- source_word: እስመ
  choice: क्योंकि
  rationale: यह अव्यय स्वर्गदूतों के संबोधन के बाद उनकी स्तुति का आधार प्रस्तुत करता है; इसे छोड़ना अर्थ की एक स्पष्ट कड़ी खो देना होगा।
- source_word: እግዚኦሙ ለአጋእዝት
  choice: प्रभुओं के प्रभु
  rationale: सूत्रात्मक सर्वोच्चता-सूचक उपाधि और इसके समानांतर आने वाली दो उपाधियों को यथावत रखा गया है।
- source_word: አምላኮሙ ለአማልክት
  choice: देवताओं के परमेश्वर
  rationale: ‘परमेश्वर’ सर्वोच्च ईश्वर को और ‘देवताओं’ बहुवचन पद को स्पष्ट रखते हुए मूल की संबंधवाचक सर्वोच्चता व्यक्त करता है।
- source_word: ንጉሦሙ ለነገሥት
  choice: राजाओं के राजा
  rationale: त्रिपदीय स्तुतिपरक क्रम को औपचारिक और परिचित हिन्दी में सुरक्षित रखा गया है।
- source_word: መንበረ ስብሐቲከ
  choice: आपकी महिमा का सिंहासन
  rationale: सिंहासन की ठोस दर्शनात्मक छवि को विशेषण में समेटने के बजाय मूल संबंधवाचक संरचना बनाए रखी गई है।
- source_word: ውስተ ኵሉ ትውልደ ዓለም
  choice: अनन्तकाल की सभी पीढ़ियों तक
  rationale: इस स्तुतिपरक संदर्भ में ዓለም कालगत ‘युग/अनन्तकाल’ है, न कि स्थानगत ‘संसार’; ‘पीढ़ियों’ को भी स्पष्ट रखा गया है।
- source_word: ስምከ ቅዱስ ወስቡሕ ውስተ ኵሉ ዓለም ወቡሩክ
  choice: आपका नाम समस्त अनन्तकाल तक पवित्र और महिमामय तथा धन्य है
  rationale: मूल क्रम के अनुसार ‘पवित्र’ और ስቡሕ को कालगत वाक्यांश के साथ रखा गया है, फिर ‘धन्य’ आता है। ስቡሕ के स्तुतिपरक अर्थ-क्षेत्र को स्वाभाविक हिन्दी ‘महिमामय’ से व्यक्त किया गया है।
theological_decisions:
- issue: तीन बार दोहराई गई ईश्वरीय सर्वोच्चता-सूचक उपाधियों को कैसे प्रस्तुत किया जाए
  choice: ‘प्रभुओं के प्रभु, देवताओं के परमेश्वर और राजाओं के राजा’—तीनों को पूर्ण रूप में रखना
  alternative: इन्हें संक्षेप में ‘सबके सर्वोच्च प्रभु और परमेश्वर’ कहना
  rationale: दोहराव इस स्वर्गीय स्तुति की अलंकारिक और धर्मवैचारिक संरचना है; संक्षेप करने से परम प्रभुता का त्रिपदीय उद्घोष मिट जाएगा।
- issue: अन्त के कोष्ठकबद्ध ወከቡድ को मुख्य पाठ में शामिल करना
  choice: मुख्य पाठ से बाहर रखकर पाठांतर की पादटिप्पणी देना
  alternative: मुख्य पाठ में ‘और आदरणीय’ जोड़ना
  rationale: स्रोत में पद को कोष्ठकबद्ध कर उसकी पाठगत अनिश्चितता दिखाई गई है; मुख्य पाठ में निश्चित पाठ और पादटिप्पणी में संभावित वृद्धि रखना अधिक पारदर्शी है।
- issue: आरम्भिक संक्षिप्त गीज़ रचना का अर्थ
  choice: ‘राजाओं के प्रभु से’
  alternative: ‘अपने प्रभु, राजा से’
  rationale: प्रत्याशात्मक सर्वनाम-रचना और बहुवचन ለነገሥት ‘राजाओं के’ पहले अर्थ का समर्थन करते हैं, पर संक्षिप्त पाठ के कारण वैकल्पिक विभाजन पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर स्वर्गीय स्तुति की गरिमा बनाए रखने के लिए सूत्रात्मक उपाधियाँ और ‘महिमा का सिंहासन’ जैसी ठोस अपोकैलिप्टिक छवि सुरक्षित रखी गई हैं। ईश्वर के लिए आदरसूचक ‘आप’ का प्रयोग किया गया है।
