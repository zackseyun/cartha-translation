translation:
  language: hi
  text: और उन स्त्रियों ने विशालकायों को जन्म दिया, और इसके कारण सारी पृथ्वी रक्त से भर गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አንስትሰ
  choice: उन स्त्रियों ने
  rationale: बहुवचन संज्ञा स्त्रियों को दर्शाती है, और -ሰ का विषयसूचक बल पहले उल्लिखित स्त्रियों की ओर संकेत करता है; ‘उन’ इस संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ወለዳ
  choice: जन्म दिया
  rationale: यह क्रिया जन्म देने का सीधा अर्थ व्यक्त करती है; हिन्दी में परिणामसूचक कथन के लिए यह स्वाभाविक और स्पष्ट है।
- source_word: ረዓይተ
  choice: दैत्यों को
  rationale: पहरेदारों के प्रसंग में यह अवैध संबंधों से उत्पन्न विशालकाय संतानों का पारंपरिक संकेत है। ‘दैत्यों’ से पारंपरिक अर्थ बना रहता है, यद्यपि शब्द में नैतिक दुष्टता का अतिरिक्त भाव आ सकता है; इसलिए पादटिप्पणी दी गई है।
- source_word: በዘ
  choice: इसके कारण
  rationale: यह संक्षिप्त कारणात्मक अथवा परिणामसूचक संबंध व्यक्त करता है और मूल पाठ से अधिक व्याख्या नहीं जोड़ता।
- source_word: መልአት
  choice: भर गई
  rationale: क्रिया पूर्ण होकर विद्यमान परिणाम का भाव देती है; ‘भर गई’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ኵላ ምድር
  choice: सारी पृथ्वी
  rationale: प्रसंग का व्यापक, विश्वव्यापी विस्तार ‘पृथ्वी’ का समर्थन करता है; ‘देश’ या ‘भूमि’ अनावश्यक रूप से सीमित होगा।
- source_word: ደመ
  choice: लहू से
  rationale: मूल शब्द का ठोस अर्थ ‘रक्त/लहू’ है। ‘लहू’ इस विनाशकारी अपोकैलिप्टिक बिंब की तीव्रता को बनाए रखता है, जबकि ‘रक्तपात’ व्याख्यात्मक होता।
theological_decisions:
- issue: स्त्रियों और दैत्यों की पहचान को कितना स्पष्ट किया जाए
  choice: उन स्त्रियों ने दैत्यों को जन्म दिया
  alternative: स्त्रियों ने विशालकाय संतानों को जन्म दिया
  rationale: ‘उन’ पूर्व प्रसंग से संबंध बनाए रखता है, पर मुख्य पाठ में पहरेदारों के अवैध संबंधों की पूरी व्याख्या जोड़कर मूल की संक्षिप्तता नहीं तोड़ी गई। ‘दैत्यों’ की संभावित अर्थ-छाया पादटिप्पणी में स्पष्ट की गई है।
- issue: कारणात्मक संबंध की स्पष्टता
  choice: और इसके कारण सारी पृथ्वी लहू से भर गई
  alternative: और इस प्रकार सारी पृथ्वी लहू से भर गई
  rationale: गीज़ का በዘ कारण अथवा परिणाम का संक्षिप्त संबंध देता है। ‘इसके कारण’ इस संबंध को स्पष्ट करता है, पर यह नहीं बताता कि लहू किस विशेष प्रक्रिया से फैला।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘लहू’ ने मूल के तीखे बिंब को बनाए रखा है। मुख्य पाठ में सभी पादटिप्पणी-चिह्न सम्मिलित हैं।
