base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/001.yaml
  text: And after this I saw all the hidden things of the heavens[a], and how the kingdom is divided[c][b], and how the deeds of human beings are weighed in the balance.
translation:
  language: hi
  text: इसके बाद मैंने आकाशों की सब छिपी हुई बातें[a] देखीं—यह भी कि राज्य कैसे बाँटा जाता है[b], और मनुष्यों के काम तराज़ू पर कैसे तौले जाते हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आकाशों के सब रहस्य।” गीज़ शब्द उन बातों को सूचित कर सकता है जो सामान्य दृष्टि या ज्ञान से छिपी हैं।
    reason: lexical_alternative
  - marker: b
    text: “राज्य कैसे बाँटा जाता है” वाली पंक्ति कठिन है। इसका आशय स्वर्गीय क्षेत्र की व्यवस्था या उसके हिस्सों के नियोजन से हो सकता है।
    reason: alternative_reading
  - marker: c
    text: मूल पाठ मनुष्यों के कामों के लिए तराज़ू पर तौलने का बिंब प्रस्तुत करता है, जो न्याय या मूल्यांकन का संकेत देता है।
    reason: cultural_note
lexical_decisions:
- source_word: እምድኅረዝ
  choice: इसके बाद
  rationale: दर्शन-वृत्तांत के कालक्रम को स्वाभाविक आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: ርኢኩ
  choice: मैंने ... देखीं
  rationale: प्रथम-पुरुष दर्शन-वर्णन का सीधा और गरिमापूर्ण रूप।
- source_word: ኵሎ ኅቡኣቲሁ ለሰማያት
  choice: आकाशों की सब छिपी हुई बातें
  rationale: ኅቡኣት के ‘छिपी हुई/गुप्त बातें’ अर्थ को मूर्त बहुवचन में रखता है और ሰማያት के बहुवचन को ‘आकाशों’ से दर्शाता है।
- source_word: መንግሥተ
  choice: राज्य
  rationale: राज्य, शासन या प्रभुत्व की ब्रह्मांडीय-राजकीय अर्थ-छाया को संक्षेप में सुरक्षित रखता है।
- source_word: እፎ
  choice: कैसे
  rationale: आगे आने वाली दोनों क्रियात्मक बातों को दर्शन की विषयवस्तु के रूप में स्वाभाविक ढंग से जोड़ता है।
- source_word: ትትካፈል
  choice: बाँटा जाता है
  rationale: विभाजन अथवा हिस्सों में नियोजन की कर्मवाच्य/आत्मवाच्य अस्पष्टता को अनावश्यक व्याख्या किए बिना बनाए रखता है।
- source_word: ትገበረ ሰብእ
  choice: मनुष्यों के काम
  rationale: मनुष्य जो करते हैं, उस आशय को सहज हिन्दी में व्यक्त करता है और तौलने के बिंब के लिए स्पष्ट विषय देता है।
- source_word: በመዳልው
  choice: तराज़ू पर
  rationale: मापने-तौलने के ठोस उपकरण और न्यायपरक बिंब को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: ይደለው
  choice: तौले जाते हैं
  rationale: तराज़ू के साथ प्रयुक्त क्रिया के तौलने/मूल्यांकन करने के आशय को ठोस रूप में सुरक्षित रखता है।
theological_decisions:
- issue: राज्य को बाँटे जाने वाली कठिन और संक्षिप्त पंक्ति का अर्थ
  choice: ‘राज्य कैसे बाँटा जाता है’—ब्रह्मांडीय राज्य अथवा व्यवस्था के विभाजन/नियोजन को खुला रखा गया है।
  alternative: ‘स्वर्गीय राज्य विभिन्न श्रेणियों में कैसे बाँटा गया है’ या ‘प्रभुत्व के भाग कैसे अलग किए गए हैं।’
  rationale: गीज़ पाठ इस स्थान पर संक्षिप्त और अर्थ की दृष्टि से कठिन है। अधिक स्पष्ट ब्रह्मांड-विज्ञान आरोपित करने के बजाय मूल तनाव और अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और दर्शन-साहित्य के अनुरूप। ‘आकाशों’ से स्रोत का बहुवचन, ‘राज्य’ से राजनीतिक-ब्रह्मांडीय अर्थ, और ‘तराज़ू पर तौले’ से ठोस न्याय-बिंब सुरक्षित रखा गया है।
