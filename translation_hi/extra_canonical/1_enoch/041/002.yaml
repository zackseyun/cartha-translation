base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/002.yaml
  text: There I saw the dwelling places of the sinners and the dwelling places of the holy ones[a]; and there my eyes saw all the sinners being driven away from there—those who deny the name of the Lord of Spirits—and they were being dragged off[d][c][b], and they could not stand because of the punishment that goes out from the Lord of Spirits.
translation:
  language: hi
  text: वहाँ मैंने पापियों के निवास-स्थान और पवित्र जनों के निवास-स्थान[a][b] देखे। वहीं मेरी आँखों ने उन सभी पापियों को वहाँ से खदेड़े जाते देखा, जो आत्माओं के प्रभु के नाम का इनकार करते हैं। वे घसीटे जा रहे थे, और वे उस दंड के कारण खड़े न रह सके[c], जो आत्माओं के प्रभु की ओर से निकलता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल गीइज़ में दोनों समूहों के लिए वही संज्ञा दोहराई गई है; इसका अनुवाद ‘निवास’ या ‘रहने के स्थान’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘पवित्र जन’ से पवित्र किए गए मनुष्य, स्वर्गीय प्राणी, अथवा दोनों अभिप्रेत हो सकते हैं; यहाँ गीइज़ पाठ उनकी पहचान स्पष्ट नहीं करता।
    reason: alternative_reading
  - marker: c
    text: इस वाक्यांश का अर्थ ‘वे टिक न सके’, ‘वे वहाँ रह न सके’, या ‘उनके खड़े होने के लिए कोई स्थान न था’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: መኃድሪሆሙ
  choice: निवास-स्थान
  rationale: यह ठहरने या रहने के स्थान को सूचित करता है। गीइज़ की पुनरावृत्ति को दोनों समूहों के लिए बनाए रखने से दर्शन में उनके अलग-अलग निवासों का चित्र सुरक्षित रहता है।
- source_word: ኃጥኣን
  choice: पापी
  rationale: यह मानक नैतिक पद है और इस प्रसंग में पवित्र जनों के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: ቅዱሳን
  choice: पवित्र जन
  rationale: यह पद पवित्र मनुष्यों, स्वर्गीय प्राणियों अथवा दोनों को सूचित कर सकता है। यह चयन अर्थ को अनावश्यक रूप से केवल किसी एक वर्ग तक सीमित नहीं करता।
- source_word: ይሰደዱ
  choice: खदेड़े जाते
  rationale: क्रिया बलपूर्वक हटाए जाने या निकाल दिए जाने का भाव रखती है; यह रूप गति और न्यायात्मक निष्कासन दोनों को व्यक्त करता है।
- source_word: ይክሕድዎ ለስመ
  choice: नाम का इनकार करते हैं
  rationale: मूल पाठ में ‘नाम’ स्पष्ट रूप से उपस्थित है। इसे बनाए रखने से केवल सामान्य अविश्वास के बजाय दिव्य नाम और अधिकार के अस्वीकार का भाव सुरक्षित रहता है।
- source_word: እግዚአ መናፍስት
  choice: आत्माओं का प्रभु
  rationale: यह 1 हनोक में प्रयुक्त विशिष्ट ईश्वरीय उपाधि है; हिंदी में यह पारदर्शी और स्वाभाविक रूप से उस उपाधि को सुरक्षित रखती है।
- source_word: ይስሐቡ
  choice: घसीटकर ले जाया जा रहा था
  rationale: क्रिया खींचे या घसीटे जाने का सजीव और दंडात्मक भाव व्यक्त करती है।
- source_word: ቀዊመ አልቦሙ
  choice: वे खड़े न रह सके
  rationale: शाब्दिक रूप से ‘उनके लिए खड़ा होना नहीं था’ जैसा भाव है। आधुनिक हिंदी में यह चयन शारीरिक रूप से टिक न पाने और दंड के सामने स्थिर न रह पाने, दोनों संभावनाओं को खुला रखता है।
- source_word: መቅሠፍት
  choice: दंड
  rationale: शब्द प्रहार, विपत्ति, दंडात्मक पीड़ा या महामारी तक सूचित कर सकता है; न्याय के इस दृश्य में ‘दंड’ व्यापक न्यायात्मक अर्थ को बिना उसका रूप सीमित किए व्यक्त करता है।
- source_word: ትወጽእ እምእግዚአ መናፍስት
  choice: जो आत्माओं के प्रभु की ओर से निकलता है
  rationale: यह मूल क्रिया की गतिशील छवि और दंड के दिव्य स्रोत, दोनों को बनाए रखता है।
theological_decisions:
- issue: ‘पवित्र जनों’ की पहचान
  choice: पद को व्यापक रखा गया है; उसे केवल मनुष्य या केवल स्वर्गीय प्राणी नहीं बताया गया।
  alternative: संत; स्वर्गदूत; धर्मी पवित्र जन
  rationale: इस स्थान पर गीइज़ पाठ संदर्भ को निश्चित रूप से केवल मनुष्यों या केवल स्वर्गीय प्राणियों तक सीमित नहीं करता; अतः वास्तविक अस्पष्टता सुरक्षित रखी गई है।
- issue: ‘आत्माओं के प्रभु के नाम’ का इनकार
  choice: दिव्य नाम के इनकार को स्पष्ट रूप से बनाए रखा गया है।
  alternative: आत्माओं के प्रभु को अस्वीकार करना; उस पर विश्वास न करना
  rationale: मूल में ‘नाम’ उपस्थित है और वह दिव्य अधिकार तथा पहचान का भार रखता है; इसे सामान्य अविश्वास में बदलना पाठ को सपाट कर देता।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण अपोकैलिप्टिक वर्णन अपनाया गया है। वाक्यरचना को पठनीय रखा गया है, जबकि मूल की पुनरावृत्ति, बलपूर्वक निष्कासन, दिव्य उपाधि और अर्थगत अस्पष्टताओं को सुरक्षित रखा गया है।
