base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/003.yaml
  text: And there my eyes saw the hidden treasuries of the lightning and the thunder[a], and the hidden treasuries of the winds—how they are divided so that they may blow upon the earth—and the hidden treasuries of the clouds and the dew; and there I saw from where they come in that place[e][d][c][b], and from there they water the dust of the earth.
translation:
  language: hi
  text: वहाँ मेरी आँखों ने बिजली और गरज के गुप्त भंडार[a], और हवाओं के गुप्त भंडार देखे—कि उनके मुँह किस प्रकार विभाजित हैं, ताकि वे पृथ्वी पर बह सकें[b]—और बादलों तथा ओस के गुप्त भंडार भी। वहाँ मैंने देखा कि उस स्थान में वे कहाँ से आते हैं, और वहीं से पृथ्वी की धूल नमी से भर जाती है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “गुप्त भंडार” का अनुवाद “छिपे हुए स्थान,” “भंडारगृह,” या “गुप्त वस्तुएँ” भी हो सकता है। मूल शब्द छिपाकर या सुरक्षित रखी गई वस्तुओं अथवा स्थानों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उनके मुँह विभाजित हैं”; यह हवाओं के निकासों या खुलने वाले मार्गों की मानवीकृत छवि है।
    reason: lexical_alternative
  - marker: c
    text: अंतिम वाक्यांश का अर्थ “वहीं से पृथ्वी की धूल भर जाती है/तृप्त होती है” भी हो सकता है। वचन और वाक्य-रचना के आधार पर “वहीं से वे पृथ्वी की धूल को सींचते हैं” पढ़ना भी संभव है।
    reason: alternative_reading
lexical_decisions:
- source_word: ኅቡኣተ
  choice: गुप्त भंडार
  rationale: यह शब्द छिपी या सुरक्षित रखी वस्तुओं और स्थानों का बोध करा सकता है। इस ब्रह्मांडीय दर्शन में “गुप्त भंडार” प्राकृतिक शक्तियों के संचित रहने की सजीव छवि बनाए रखता है।
- source_word: መብረቅት ወነጐድጓድ
  choice: बिजली और गर्जन
  rationale: दोनों शब्द यहाँ मौसम संबंधी प्राकृतिक घटनाओं को सूचित करते हैं; हिन्दी में सामूहिक एकवचन सहज और स्पष्ट है।
- source_word: ነፋሳት
  choice: हवाएँ
  rationale: यद्यपि शब्द का अर्थ कुछ प्रसंगों में “आत्माएँ” भी हो सकता है, पृथ्वी पर बहने और अन्य मौसमी घटनाओं के साथ सूचीबद्ध होने के कारण यहाँ “हवाएँ” उपयुक्त है।
- source_word: አፎ ይትከፈሉ
  choice: उनके मुँह बाँटे गए हैं
  rationale: यह शाब्दिक, मानवीकृत छवि हवाओं के निकासों या मार्गों को दर्शाती है; उसे केवल “रास्ते” कहकर सपाट नहीं किया गया।
- source_word: ከመ ይንፍሑ ዲበ ምድር
  choice: ताकि वे पृथ्वी पर बहें
  rationale: उद्देश्यसूचक वाक्यांश और हवाओं की सक्रिय गति दोनों स्वाभाविक हिन्दी में सुरक्षित हैं।
- source_word: ደመናት ወጠል
  choice: बादलों तथा ओस
  rationale: ये सीधे मौसम संबंधी शब्द हैं और मूल की जोड़ी को बनाए रखते हैं।
- source_word: እምኀበ ይመጽእ በውእቱ መካን
  choice: उस स्थान में वे कहाँ से आते हैं
  rationale: मूल क्रिया सामान्यतः “आना” व्यक्त करती है। बहुवचन “वे” निकटवर्ती बादलों और ओस अथवा सूचीबद्ध घटनाओं की ओर संकेत करता है।
- source_word: እምህየ ይፀግቡ ጸበለ ምድር
  choice: वहीं से पृथ्वी की धूल तर हो जाती है
  rationale: अंतिम पद में भरने/तृप्त होने और सींचने की अर्थ-छाया तथा व्याकरणिक कठिनाई है। हिन्दी में अकर्मक “तर हो जाती है” नमी से भरने का भाव देता है, जबकि पादटिप्पणी सक्रिय वैकल्पिक पाठ को सुरक्षित रखती है।
theological_decisions:
- issue: ነፋሳት का अर्थ “हवाएँ” हो या “आत्माएँ”
  choice: हवाएँ
  alternative: आत्माएँ
  rationale: बिजली, गर्जन, बादल और ओस के बीच इसका स्थान तथा पृथ्वी पर बहने का कथन स्थानीय मौसम-विज्ञान संबंधी अर्थ का समर्थन करता है।
- issue: अंतिम उपवाक्य में पृथ्वी की धूल कर्ता है या कर्म
  choice: पृथ्वी की धूल तर हो जाती है
  alternative: वे पृथ्वी की धूल को सींचते हैं
  rationale: गीज़ क्रिया का अकर्मक रूप “भर जाना/तृप्त होना” समर्थित करता है, पर वचन-सामंजस्य और वाक्य-संरचना सक्रिय अर्थ की संभावना भी छोड़ते हैं; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है, पर दर्शनीय और ब्रह्मांडीय वर्णन की गरिमा बनाए रखती है। “मेरी आँखों ने देखा,” “गुप्त भंडार,” और हवाओं के “मुँह” जैसी मूल की ठोस छवियाँ सुरक्षित रखी गई हैं; कठिन अंतिम उपवाक्य को अत्यधिक निश्चित किए बिना सहज हिन्दी में प्रस्तुत किया गया है।
