base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/004.yaml
  text: And there I saw the storehouses of the lightning[a], and from them are apportioned the wind from the storehouse of hail, and the wind from the storehouse of mist[d][c][b], and the cloud and its cloud remain over the earth from before the world.
translation:
  language: hi
  text: वहाँ मैंने बिजलियों के भंडार देखे। उन्हीं में से ओलों के भंडार की हवा और कुहरे के भंडार की हवा[a] बाँटी जाती हैं; और बादल का वह तथा उसका बादल[b] संसार से पहले से[c] पृथ्वी के ऊपर ठहरे रहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘कुहरा’ अनिश्चित है; मूल शब्द का अर्थ ‘पाला’, ‘तुषार’ या इसी प्रकार की कोई मौसम-संबंधी घटना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'मूल वाक्यांश कठिन और कुछ असहज है: लगभग ‘बादल का वह तथा उसका बादल’। पहले ‘वह’ का संबंध निश्चित नहीं है; इसलिए इसे किसी निहित ‘हवा’ या अन्य संज्ञा से नहीं भरा गया है।'
    reason: textual_difficulty
  - marker: c
    text: या ‘युग से पहले से’। मूल पद ‘संसार’ और ‘युग’ दोनों अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: መዛግብተ
  choice: भंडार
  rationale: यह बहुवचन संचित वस्तुओं के कक्षों या भंडारों का बोध कराता है। ‘भंडार’ स्वाभाविक हिन्दी में ठोस अपोकैलिप्टिक चित्र बनाए रखता है।
- source_word: ፀዳዋነ
  choice: बिजलियाँ
  rationale: मौसम-संबंधी प्रसंग में इसका सबसे स्वाभाविक अर्थ आकाशीय बिजली है; हिन्दी बहुवचन स्रोत के रूप और अनेक भंडारों के चित्र के अनुकूल है।
- source_word: ይትከፈሉ
  choice: बाँटी जाती हैं
  rationale: निष्क्रिय/आत्मवाचक रूप व्यवस्थित वितरण का भाव देता है, केवल भौतिक विभाजन का नहीं।
- source_word: ነፋስ
  choice: हवा
  rationale: ओले, कुहरा और बादल के निकट होने से यहाँ मौसम-संबंधी अर्थ प्रमुख है; ‘आत्माएँ’ कहना अनावश्यक धार्मिक अर्थ जोड़ता।
- source_word: በረድ
  choice: ओले
  rationale: यह सामान्य मौसम-संबंधी अर्थ है और आधुनिक हिन्दी में स्पष्ट है।
- source_word: ጊሜ
  choice: कुहरा
  rationale: शब्द का सटीक मौसम-संबंधी संकेत अनिश्चित है; निकटवर्ती बादल-वर्णन के कारण ‘कुहरा’ उपयुक्त है, जबकि पाला या तुषार भी संभव हैं।
- source_word: ወዘደመና / ወደመና ዚአሁ
  choice: और बादल से जुड़ी वह [हवा] तथा उसका बादल
  rationale: मूल में संबंधवाचक/संकेतवाचक पद और फिर ‘उसका बादल’ आता है। ‘हवा’ को कोष्ठक में पूरित किया गया है ताकि पिछले समानांतर पद से संभावित संबंध दिखे, पर पाठ की कठिनता मिटाई न जाए।
- source_word: የኀድር
  choice: ठहरे रहते हैं
  rationale: क्रिया टिके रहने या निवास करने का भाव देती है; इस मौसम-संबंधी दृश्य में ‘ठहरे रहते हैं’ स्वाभाविक है।
- source_word: እምቅድመ ዓለም
  choice: संसार से पहले से
  rationale: यह आदिकालिक काल-सूचक बल को बनाए रखता है और यह तय नहीं करता कि आशय सृष्टि, युग या अनंतता की किसी बाद की धर्मवैज्ञानिक धारणा से है।
theological_decisions:
- issue: ब्रह्मांड-वर्णन में आदिकालिक काल-सूचक वाक्यांश
  choice: संसार से पहले से
  alternative: युग से पहले से; संसार के अस्तित्व में आने से पहले से
  rationale: संक्षिप्त और निकटस्थ अनुवाद मूल की आदिकालिक ब्रह्मांड-दृष्टि को रखता है, पर सृष्टि के स्वरूप या अनंतता के बारे में बाद की कोई धर्मसैद्धांतिक व्याख्या आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। अपोकैलिप्टिक ‘भंडार’ की ठोस छवि और कठिन बादल-वाक्यांश की वास्तविक अस्पष्टता सुरक्षित रखी गई है; किसी संप्रदायगत व्याख्या को नहीं जोड़ा गया।
