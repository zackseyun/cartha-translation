base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/005.yaml
  text: And I saw the storehouses of the sun and of the moon[a], where they come out and where they go in, and their glorious return; and one is more honored than the other. And their course is blessed, and they do not overstep their course, and they do not add to it, and they do not take away from their course[d][c][b]; and they keep faith with one another by an oath.
translation:
  language: hi
  text: और मैंने सूर्य और चन्द्रमा के भंडार देखे[a]—जहाँ से वे निकलते हैं और जहाँ वे प्रवेश करते हैं—और उनका महिमामय लौटना; और यह भी देखा कि उनमें से एक दूसरे से किस प्रकार अधिक प्रतिष्ठित है[b]। उनका मार्ग धन्य है; वे अपने मार्ग की सीमा नहीं लाँघते, न उसमें कुछ बढ़ाते हैं और न अपने मार्ग में से कुछ घटाते हैं। वे शपथ के द्वारा एक-दूसरे के प्रति निष्ठा निभाते हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खजाने’। यहाँ ऐसे स्वर्गीय कक्षों का चित्र है जिनसे सूर्य और चन्द्रमा निकलते हैं और जिनमें वे लौटते हैं।
    reason: lexical_alternative
  - marker: b
    text: यह वाक्यांश कठिन है। मूल में ‘किस प्रकार’ का प्रश्नवाचक तत्व है; इसका आशय सम्भवतः सूर्य और चन्द्रमा की सापेक्ष महिमा या पद से है। पाठ यह स्पष्ट नहीं करता कि दोनों में से कौन अधिक प्रतिष्ठित है।
    reason: alternative_reading
  - marker: c
    text: ‘शपथ के द्वारा एक-दूसरे के प्रति निष्ठा’ वाचा-सदृश भाषा है। यह केवल यांत्रिक नियमितता नहीं, बल्कि स्वर्गीय पिंडों की पारस्परिक विश्वासयोग्यता व्यक्त करती है।
    reason: cultural_note
lexical_decisions:
- source_word: መዛግብተ
  choice: भंडार
  rationale: यह शब्द खजानों या भंडारों का बोध करा सकता है। यहाँ ‘भंडार’ उस ठोस अपोकैलिप्टिक चित्र को बनाए रखता है जिसमें सूर्य और चन्द्रमा स्वर्गीय कक्षों से निकलते और उनमें लौटते हैं।
- source_word: ይወፅኡ / ይገብኡ
  choice: निकलते हैं / प्रवेश करते हैं
  rationale: मूल में सामान्य गमन-सूचक क्रियाएँ हैं। यह अनुवाद ‘उदय’ और ‘अस्त’ जैसी अधिक व्याख्यात्मक खगोलीय शब्दावली से बचता है।
- source_word: ግብኦቶሙ ስቡሕ
  choice: उनका लौटना कितना महिमामय है
  rationale: ‘लौटना’ चक्रीय पुनःप्रवेश का भाव रखता है, जबकि ‘महिमामय’ मूल के महिमा और वैभव-संबंधी अर्थ को व्यक्त करता है। ‘कितना’ अप्रत्यक्ष प्रश्न की संरचना को उभारता है।
- source_word: አፎ ይከብር አሐዱ ለካልኡ
  choice: कैसे उनमें से एक दूसरे से अधिक प्रतिष्ठित है
  rationale: वाक्यांश कठिन है। ‘कैसे’ मूल के प्रश्नवाचक तत्व को बनाए रखता है और ‘अधिक प्रतिष्ठित’ तुलनात्मक आदर या महिमा को बिना अनावश्यक रूप से रूप-रंग तक सीमित किए व्यक्त करता है।
- source_word: ምሕዋሮሙ
  choice: उनका मार्ग
  rationale: शब्द गति, पथ या परिपथ का बोध देता है। ‘मार्ग’ सहज, व्यापक और आधुनिक वैज्ञानिक ‘कक्षा’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: ብፁዕ
  choice: धन्य
  rationale: यह मूल के धार्मिक और ईश्वर-व्यवस्थित सृष्टि-संबंधी स्वर को बनाए रखता है; ‘नियमित’ जैसा तटस्थ शब्द उस स्वर को दबा देता।
- source_word: ኢየኃልፉ ምሕዋረ
  choice: अपने मार्ग की सीमा नहीं लाँघते
  rationale: मूल में नियत पथ से आगे निकलने या उसका अतिक्रमण करने का भाव है। ‘सीमा’ हिन्दी में इस आशय को स्वाभाविक रूप से स्पष्ट करती है।
- source_word: ኢይዌስኩ ወኢያኃጽጹ
  choice: न उसमें कुछ बढ़ाते हैं और न अपने मार्ग में से कुछ घटाते हैं
  rationale: जोड़ीदार क्रियाओं की वृद्धि और न्यूनता तथा मूल की पुनरावृत्त संरचना दोनों को सुरक्षित रखा गया है।
- source_word: ሃይማኖተ የዐቅቡ
  choice: निष्ठा बनाए रखते हैं
  rationale: यहाँ आशय सैद्धान्तिक विश्वास से अधिक विश्वसनीयता या पारस्परिक निष्ठा है। यह चयन वाचा-सदृश भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: በመሐላ
  choice: शपथ के द्वारा
  rationale: यह साधनवाचक अर्थ और कथन की गंभीर, वाचागत भाषा दोनों को बनाए रखता है।
theological_decisions:
- issue: ज्योतियों के आचरण को केवल खगोलीय नियमितता माना जाए या धार्मिक-वाचागत भाषा में रखा जाए
  choice: ‘धन्य’ और ‘शपथ के द्वारा...निष्ठा’ जैसी स्पष्ट धार्मिक भाषा बनाए रखी गई है।
  alternative: ‘नियमित’ और ‘अपने समझौते का पालन करते हैं’ जैसी तटस्थ भाषा
  rationale: गीज़ पाठ धार्मिक अर्थवाले शब्दों का प्रयोग करता है और सृष्टि को निर्धारित व्यवस्था के प्रति निष्ठावान दिखाता है। उसे केवल यांत्रिक नियमितता बनाना पाठ के धर्मवैचारिक तनाव को समतल कर देता।
- issue: सूर्य और चन्द्रमा में से एक की तुलनात्मक प्रतिष्ठा की पहचान
  choice: कौन अधिक प्रतिष्ठित है, यह अनिर्धारित रखा गया है।
  alternative: स्पष्ट रूप से सूर्य को चन्द्रमा से अधिक महिमामय बताना
  rationale: मूल केवल ‘एक’ और ‘दूसरे’ की तुलना करता है; पहचान जोड़ना पाठ से आगे जाना होता।
