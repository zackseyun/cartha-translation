  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘भंडार’, ‘धन्य’, ‘निष्ठा’ और ‘शपथ’ अपोकैलिप्टिक तथा धार्मिक बिंब सुरक्षित रखते हैं; ‘कक्षा’ जैसी आधुनिक तकनीकी शब्दावली से बचा गया है।
