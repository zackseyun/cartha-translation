base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/006.yaml
  text: 'For they belong to the reckoning of the year[a], and they are truly fixed forever: one in the first gate, one in the third gate, one in the fourth, and one in the sixth[b]; and the year is completed in three hundred and sixty-four days.'
translation:
  language: hi
  text: 'क्योंकि वे वर्ष की गणना में सम्मिलित हैं[a], और वे सचमुच सदा के लिए नियत हैं: एक पहले द्वार में, एक तीसरे द्वार में, एक चौथे द्वार में और एक छठे द्वार में[b]; और वर्ष तीन सौ चौंसठ दिनों में पूरा होता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: बार-बार आए ‘एक ... एक ... एक ... एक’ से हनोक की 364-दिवसीय पंचांग-व्यवस्था में सौर वर्ष के चार भागों के बीच बाँटे गए चार अतिरिक्त दिनों का संकेत है।
    reason: cultural_note
  - marker: b
    text: उपलब्ध मूल-पाठ की पंक्ति में ‘चौथे’ और ‘छठे’ के बाद ‘द्वार’ दोहराया नहीं गया है, पर समानांतर क्रम में वही संज्ञा समझी जाती है; स्पष्टता के लिए उसे हिन्दी में जोड़ा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: እስመ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ संयोजक का कारणसूचक बल बनाए रखता है।
- source_word: ሀለዉ፡ በሐሳበ፡ ዓመት
  choice: वे वर्ष की गणना में सम्मिलित हैं
  rationale: यहाँ केवल अस्तित्व नहीं, बल्कि वार्षिक गणना में इन दिनों का समावेश अभिप्रेत है; ‘गणना’ खगोलीय-पंचांगीय संदर्भ के अनुकूल है।
- source_word: ወአማን
  choice: और वे सचमुच
  rationale: यह पंचांगीय व्यवस्था की विश्वसनीयता पर दिए गए मूल पाठ के जोर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ልኩዓን
  choice: नियत
  rationale: शब्द में निर्धारित, सुव्यवस्थित और अपने माप या स्थान पर स्थिर किए जाने का भाव है; ‘नियत’ अनावश्यक रूप से धार्मिक ‘अभिषिक्त’ या ‘ठहराए हुए’ जैसी व्याख्या नहीं जोड़ता।
- source_word: እሙንቱ፡ ለዓለም
  choice: सदा के लिए
  rationale: यह व्यवस्था के स्थायी और चिरकालिक होने के दावे को स्पष्ट तथा स्वाभाविक ढंग से बनाए रखता है।
- source_word: አሐቲ
  choice: एक
  rationale: चारों स्थानों के लिए वितरक रूप से दोहराए गए ‘एक’ को बनाए रखने से पद की मापी हुई संरचना और चार अतिरिक्त दिनों का संकेत सुरक्षित रहता है।
- source_word: በቀዳሚት፡ ኆኅት / በሣልስት፡ ኆኅት
  choice: पहले द्वार में / तीसरे द्वार में
  rationale: सूची का जोर गति के बजाय नियत स्थान पर है, इसलिए ‘में’ उपयुक्त है; ‘द्वार’ इस खगोलीय पुस्तक की पारिभाषिक कल्पना को बनाए रखता है।
- source_word: በራብዕት / በሳድስት
  choice: चौथे द्वार में / छठे द्वार में
  rationale: इन दोनों पदबंधों में ‘द्वार’ पूर्ववर्ती समानांतर खंडों से अध्याहृत है; हिन्दी में स्पष्टता के लिए उसे दोहराया गया है और इस पूर्ति की सूचना पादटिप्पणी में दी गई है।
- source_word: ወይትፌጸም፡ ዓመተ፡ መዋዕል
  choice: और वर्ष ... पूरा होता है
  rationale: यह वार्षिक चक्र के पूर्ण होने का सीधा अर्थ देता है और मूल के कर्मवाच्य-सदृश भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ፫፻ወ፷ወረቡዕ
  choice: तीन सौ चौंसठ दिनों में
  rationale: गीज़ संख्या को आधुनिक हिन्दी शब्दों में ठीक रूप से व्यक्त किया गया है और समयावधि का संबंध वर्ष की पूर्णता से जोड़ा गया है।
theological_decisions:
- issue: ज्योतियों और पंचांग की व्यवस्था के स्थायित्व का स्वरूप
  choice: पद को सृष्टि में स्थापित एक स्थायी और सुव्यवस्थित पंचांगीय क्रम के दावे के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल अस्थायी प्रेक्षण का तटस्थ खगोलीय विवरण मानना।
  rationale: ‘सचमुच’, ‘सदा के लिए’ और वर्ष के पूर्ण होने की भाषा इस व्यवस्था को स्थिर और मान्य ब्रह्मांडीय क्रम के रूप में चित्रित करती है; अनुवाद इस बल को बनाए रखता है, पर उसके वैज्ञानिक या सिद्धान्तगत निहितार्थों को अतिरिक्त रूप से परिभाषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘गणना’, ‘नियत’ और ‘द्वार’ से खगोलीय-पंचांगीय संदर्भ सुरक्षित रहता है। वाक्य की चार बार दोहराई गई ‘एक’ वाली संरचना जानबूझकर बनाए रखी गई है।
