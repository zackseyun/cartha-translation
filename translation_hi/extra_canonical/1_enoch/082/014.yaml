base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/014.yaml
  text: And the names of those who lead them are Adnarel[a], Iyasusael, and Elomeel. These three follow after the leaders of the orders, and there are two that follow after the leaders of the orders, which follow after all the leaders of the fixed stations[c][b], who divide the four parts of the year.
translation:
  language: hi
  text: और जो उनका नेतृत्व करते हैं, उनके नाम अदनारएल, इयासुसाएल और एलोमेएल हैं। ये तीनों क्रमों के अगुवों के पीछे चलते हैं; और एक[a] है, जो क्रमों के तीन अगुवों के पीछे चलता है। वे उन सभी स्थिर स्थानों के अगुवों के पीछे चलते हैं, जो वर्ष को चार भागों[c] में बाँटते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध मुद्रित पाठ में यहाँ ‘एक’ और आगे ‘तीन’ है। स्रोत से बनी प्रतिलिपि में अंक क्रमशः ‘दो’ और ‘सत्तर’ पढ़े गए हैं, जो संभवतः अक्षर-पहचान की त्रुटियाँ हैं।
    reason: textual_variant
  - marker: b
    text: 'बीच के उपवाक्यों का संबंध कठिन है: मूल में ‘पीछे चलने’ की बात बार-बार आती है और अगुवों के कई समूहों का उल्लेख है। अनुवाद ने इस क्रम को किसी पूरी तरह निश्चित पदानुक्रम में बदलने के बजाय उसकी अस्पष्टता बनाए रखी है।'
    reason: textual_ambiguity
  - marker: c
    text: शाब्दिक रूप से, ‘वर्ष के चार भाग’; अर्थात वर्ष का कैलेंडरी विभाजन।
    reason: lexical_alternative
lexical_decisions:
- source_word: ይመርሃዎሙ
  choice: उनका नेतृत्व करते हैं
  rationale: मूल क्रिया नेतृत्व या मार्गदर्शन करने को व्यक्त करती है। खगोलीय क्रम के पदानुक्रम को बनाए रखने के लिए ‘नेतृत्व’ चुना गया है।
- source_word: ይተልዉ
  choice: पीछे चलते हैं
  rationale: बार-बार आने वाली इस क्रिया में क्रमबद्ध रूप से पीछे चलने या बाद में आने का भाव है; हिंदी में पुनरावृत्ति बनाए रखी गई है।
- source_word: መራሕያነ
  choice: अगुवे
  rationale: यह नेतृत्व करनेवालों के लिए प्रयुक्त पद है। ‘अगुवे’ सहज, गरिमापूर्ण और पदानुक्रम के अनुकूल है।
- source_word: ሥርዓታት
  choice: क्रमों
  rationale: यहाँ व्यवस्थित खगोलीय क्रम या विन्यास अभिप्रेत है। ‘क्रम’ इस संरचित भाव को बिना अनावश्यक धार्मिक अर्थ जोड़े व्यक्त करता है।
- source_word: ምቅዋማት
  choice: स्थिर स्थानों
  rationale: शब्द स्थापित खड़े होने के स्थानों या नियत स्थितियों की ओर संकेत करता है। खगोलीय संदर्भ में ‘स्थिर स्थान’ मूल बिंब को बनाए रखता है।
- source_word: ይፈልጡ
  choice: बाँटते हैं
  rationale: क्रिया विभाजन या पृथक्करण दर्शाती है और वर्ष के चार भागों के साथ स्वाभाविक हिंदी देती है।
- source_word: ክፍለ ለዓመት
  choice: वर्ष को चार भागों में
  rationale: मूल में वर्ष के चार भाग या विभाजन हैं। ‘भाग’ स्पष्ट है और आधुनिक ‘तिमाही’ जैसा बाहरी तकनीकी अर्थ नहीं जोड़ता।
- source_word: አድናርኤል፡ ኢያሱሰኤል፡ ኤሎሜኤል
  choice: अदनारएल, इयासुसाएल और एलोमेएल
  rationale: इनको वर्णनात्मक उपाधियों के बजाय व्यक्तिनाम मानकर देवनागरी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: नामित सत्ताओं का स्वरूप
  choice: उन्हें नामधारी खगोलीय अगुवों के रूप में लिप्यंतरित किया गया है
  alternative: नामों को अर्थपूर्ण उपाधियों के रूप में अनूदित करना या पाठ-संशोधन से बदलना
  rationale: इस खगोलीय प्रसंग में वे व्यक्तिगत नामों की तरह कार्य करते हैं; पाठ स्वयं उनके स्वरूप के विषय में इससे अधिक सिद्धांत निर्धारित नहीं करता।
- issue: मध्यवर्ती पदानुक्रम की अस्पष्टता
  choice: ‘पीछे चलते हैं’ की पुनरावृत्ति और संबंधवाचक क्रम को यथासंभव बनाए रखा गया है
  alternative: सभी समूहों का एक निश्चित, सुगम पदानुक्रम बनाकर वाक्य को पुनर्गठित करना
  rationale: मूल वाक्य में अनेक समूह और लगातार जुड़े संबंधवाचक उपवाक्य हैं; उन्हें निर्णायक रूप से सुलझाना पाठ से अधिक कहना होता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। खगोलीय प्रशासन के लिए ‘क्रम’, ‘अगुवे’ और ‘स्थिर स्थान’ चुने गए हैं। नामों का देवनागरी लिप्यंतरण किया गया है और जटिल मूल वाक्य की वास्तविक अस्पष्टता को टिप्पणी सहित सुरक्षित रखा गया है।
