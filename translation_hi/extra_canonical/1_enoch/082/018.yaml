base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/018.yaml
  text: The second leader after him is Helemmelek[c][b][a], whose name they call the Sun.
translation:
  language: hi
  text: उसके बाद दूसरा अगुआ हेलेम्मेलेक[a] है, जिसका नाम वे ‘सूर्य’ कहते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हेलेम्मेलेक’ गीइज़ व्यक्तिनाम का लिप्यंतरण है; इसके स्वरों का सटीक उच्चारण अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: मूल में नामकरण की अभिव्यक्ति शब्दशः ‘जिसका नाम वे सूर्य कहते हैं’ है; अधिक सहज हिन्दी में ‘जिसे वे सूर्य कहते हैं’ भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልእ
  choice: दूसरा
  rationale: यहाँ क्रमबद्ध सूची में अगले अगुए का परिचय है; इसलिए अनिश्चित ‘एक और’ की अपेक्षा क्रमसूचक ‘दूसरा’ अधिक उपयुक्त है।
- source_word: መራሒ
  choice: अगुआ
  rationale: यह शब्द खगोलीय क्रम का नेतृत्व करने वाले के लिए प्रयुक्त है। ‘अगुआ’ शासन या पद की अनावश्यक विशिष्टता जोड़े बिना नेतृत्व का भाव रखता है।
- source_word: ዘድኅሬሁ
  choice: उसके बाद
  rationale: यह पद सूची में उत्तराधिकार या क्रम को दर्शाता है; आधुनिक हिन्दी में ‘उसके बाद’ स्वाभाविक और स्पष्ट है।
- source_word: ሄልእምሜሌክ
  choice: हेलेम्मेलेक
  rationale: व्यक्तिनाम का अनुवाद न करके गीइज़ रूप के निकट देवनागरी लिप्यंतरण किया गया है। सटीक स्वर-विन्यास पूरी तरह निश्चित नहीं है।
- source_word: ዘይጼውዕዎ ስሞ
  choice: जिसका नाम वे … कहते हैं
  rationale: गीइज़ में ‘उसका नाम’ स्पष्ट रूप से उपस्थित है और क्रिया बहुवचन कर्ता के साथ सक्रिय है; यह रूप दोनों विशेषताओं को सुरक्षित रखता है।
- source_word: ፀሐየ
  choice: ‘सूर्य’
  rationale: यह व्यवस्थित ब्रह्मांडीय सूची में नामवत पदनाम है। हिन्दी में बड़े अक्षरों का भेद नहीं होता, इसलिए उद्धरण-चिह्न इसकी नामसूचक भूमिका स्पष्ट करते हैं।
theological_decisions:
- issue: अंतिम पद को सामान्य संज्ञा मानना या औपचारिक खगोलीय नाम
  choice: नामसूचक ‘सूर्य’
  alternative: सामान्य संज्ञा ‘सूर्य’ बिना नामसूचक संकेत के
  rationale: संदर्भ में ज्योतियों और उनके अगुओं की व्यवस्थित सूची है। उद्धरण-चिह्न औपचारिक पदनाम का संकेत देते हैं, पर किसी अतिरिक्त व्यक्तिकरण या बाद की धर्मवैज्ञानिक धारणा को नहीं जोड़ते।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। गीइज़ की सक्रिय बहुवचन क्रिया तथा ‘उसका नाम’ वाली औपचारिक अभिव्यक्ति को यथासंभव सुरक्षित रखा गया है।
