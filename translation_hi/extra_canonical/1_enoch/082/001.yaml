base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/001.yaml
  text: And now[a], my son Methuselah, I tell you all these things, and I write them down for you, and I have revealed them all to you, and I have given you their books concerning all these things. Keep, my son, the book from the hand of your father[c][b], so that you may give it to the generations of the world.
translation:
  language: hi
  text: और अब, मेरे पुत्र मतूशेलह, मैं तुम्हें ये सब बातें बताता हूँ और इन्हें तुम्हारे लिए लिखता हूँ। मैंने तुम्हें ये सब बातें प्रकट की हैं और इन सब बातों की पुस्तकें तुम्हें दी हैं। मेरे पुत्र, अपने पिता के हाथ की पुस्तक[a] सुरक्षित रखना, ताकि तुम इसे संसार की पीढ़ियों को सौंप सको।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारे पिता के हाथ की पुस्तक”; इसका अर्थ पिता द्वारा लिखी हुई या उसके हाथ से सीधे सौंपी गई पुस्तक हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “संसार की पीढ़ियों को” का अर्थ “सदा की सभी पीढ़ियों को” या “अनन्तकाल की पीढ़ियों को” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: और अब
  rationale: यह प्रसंग-परिवर्तन का सूत्र है; ‘और अब’ उसके सीधे और उपदेशात्मक स्वर को स्वाभाविक हिन्दी में रखता है।
- source_word: ወልድየ፡ ማቱሳላ
  choice: मेरे पुत्र मतूशेलह
  rationale: सम्बोधन और प्रथम पुरुष सम्बन्धसूचक प्रत्यय को बनाए रखते हुए नाम का प्रचलित हिन्दी बाइबलीय रूप लिया गया है।
- source_word: ኵሎሙ፡ እሉንተ
  choice: ये सब बातें
  rationale: यह पहले बताई गई समस्त बातों की ओर संकेत करता है; ‘बातें’ हिन्दी में वस्तु को सहज रूप से स्पष्ट करता है।
- source_word: ለከ፡ እነግር፡ ወእጽሕፍ፡ ለከ
  choice: मैं तुम्हें ये सब बातें बताता हूँ और इन्हें तुम्हारे लिए लिखता हूँ
  rationale: कहने और लिखने की समानान्तर क्रियाओं को स्पष्ट एवं स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: ወኵሎሙ፡ ከሠትኩ፡ ለከ
  choice: मैंने ये सब तुम पर प्रकट किया है
  rationale: क्रिया का अर्थ खोलने या प्रकट करने का है; ‘तुम पर प्रकट किया’ स्रोत की दत्तिवाचक संरचना और प्रकाशनात्मक सन्दर्भ दोनों को दर्शाता है।
- source_word: ወወሀብኩከ፡ መጻሕፍቲሆሙ፡ ለእሉ፡ ኵሎሙ
  choice: इन सब बातों से सम्बन्धित पुस्तकें तुम्हें दी हैं
  rationale: गीज़ वाक्यांश संक्षिप्त और कुछ अस्पष्ट है। यह रूप पुस्तकों और बताई गई बातों के सम्बन्ध को बिना अनावश्यक रूप से स्वामित्व निर्धारित किए व्यक्त करता है।
- source_word: ዕቀብ
  choice: सुरक्षित रखना
  rationale: आज्ञार्थक क्रिया में रखने, रक्षा करने और भावी पीढ़ियों के लिए सँभालने का भाव है; ‘सुरक्षित रखना’ इस सन्दर्भ में सहज है।
- source_word: መጽሐፈ፡ እዴሁ፡ ለአቡከ
  choice: अपने पिता के हाथ की यह पुस्तक
  rationale: शाब्दिक मुहावरे ‘तुम्हारे पिता के हाथ की पुस्तक’ को बनाए रखा गया है; हिन्दी में यह पिता द्वारा लिखी या सीधे सौंपी गई पुस्तक, दोनों सम्भावनाएँ खुली रखता है।
- source_word: ወከመ፡ ትሀብ
  choice: ताकि तुम इसे ... सौंप सको
  rationale: ከመ के साथ अधीन क्रियारूप उद्देश्य बताता है; इसलिए इसे दूसरी समानान्तर आज्ञा न बनाकर प्रयोजनवाचक उपवाक्य के रूप में अनूदित किया गया है।
- source_word: ለትውልደ፡ ዓለም
  choice: संसार की पीढ़ियों को
  rationale: यह ‘संसार/युग की पीढ़ियों’ का निकट रूप है और अनन्तकाल की सम्भावित धारणा को मुख्य पाठ में निर्णायक रूप से आरोपित नहीं करता।
theological_decisions:
- issue: ለትውልደ፡ ዓለም में हस्तान्तरण का कालिक और सार्वभौमिक विस्तार
  choice: संसार की पीढ़ियों को
  alternative: सदा की सभी पीढ़ियों को; अनन्तकाल की पीढ़ियों को
  rationale: गीज़ पदबंध संसार की पीढ़ियों अथवा समय भर बनी रहने वाली पीढ़ियों की ओर संकेत कर सकता है। मुख्य पाठ स्रोत के ‘संसार/युग’ सम्बन्धी शब्द को बनाए रखता है और वैकल्पिक कालिक अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पितृ-संबोधनयुक्त और सामान्य पाठक के लिए सुबोध शैली। वाक्य-विन्यास को हिन्दी की स्वाभाविक लय के लिए दो वाक्यों में बाँटा गया है। स्रोत की उद्देश्यवाचक व्याकरणिक संरचना तथा अंतिम पदबंध की वास्तविक अर्थगत अस्पष्टता सुरक्षित रखी गई है।
