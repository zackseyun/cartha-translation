  yaml_path: translation/extra_canonical/1_enoch/082/011.yaml
  text: And their four leaders enter first, those who divide the four parts of the year; and after them the twelve leaders of the orders, those who divide the months; and the three hundred and sixty-four heads of thousands, the ones who distinguish the days; and the four that are added with them, the leaders who distinguish the four divisions of the years.
translation:
  language: hi
  text: और उनके चार अगुए पहले प्रवेश करते हैं—वे जो वर्ष को चार भागों[a] में बाँटते हैं; और उनके बाद व्यवस्थाओं के बारह अगुए—वे जो महीनों को बाँटते हैं; और हज़ारों के तीन सौ चौंसठ प्रधान[b]—वे जो दिनों को चिह्नित करते हैं[c]; और वे चार जो उनके साथ जोड़े जाते हैं—वे अगुए जो वर्षों के चार विभाजनों को चिह्नित करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात “वर्ष के चार विभाजन”; इसे “वर्ष की चार तिमाहियाँ” भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: तीन सौ चौंसठ की संख्या खगोलीय पुस्तक में प्रयुक्त 364 दिनों वाले योजनाबद्ध पंचांग से संबंधित है। “हज़ारों के” पदबंध का पाठ-संबंध कठिन है।
    reason: textual_and_cultural_note
  - marker: c
    text: “चिह्नित करते हैं” का अनुवाद “अलग करते हैं” या “निर्धारित करते हैं” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: መራሕያኒሆሙ / መራሕያን
  choice: उनके अगुए / अगुए
  rationale: मूल शब्द नेतृत्व या मार्गदर्शन करनेवालों को दर्शाता है। इस खगोलीय-प्रशासनिक क्रम में “अगुए” सहज है और उन्हें स्पष्ट रूप से स्वर्गदूत मान लेने से बचता है।
- source_word: ይበውኡ ቀዳሚ
  choice: पहले प्रवेश करते हैं
  rationale: यह क्रम में सबसे पहले भीतर आने या उपस्थित होने का भाव बनाए रखता है।
- source_word: ይሌልዩ
  choice: बाँटते हैं
  rationale: वर्ष और महीनों के काल-विभाजन के संदर्भ में यह स्पष्ट और स्वाभाविक है।
- source_word: ክፍለ ዓመት
  choice: वर्ष के चार भाग
  rationale: मूल के “भाग/विभाजन” को सीधे रखता है; मुख्य पाठ में आधुनिक ऋतुओं या तिमाहियों की अवधारणा नहीं थोपी गई।
- source_word: ዘሥርዓታት
  choice: क्रमों के
  rationale: यह नियत व्यवस्था या अनुक्रम का भाव देता है और ब्रह्मांडीय-सांगठनिक संरचना को सुरक्षित रखता है।
- source_word: ፲፻ወ፷፬ አርእስት
  choice: तीन सौ चौंसठ प्रधान
  rationale: संख्या को अक्षरशः रखा गया है और “सिरों” के प्रशासनिक रूपक को स्वाभाविक हिन्दी में “प्रधान” से व्यक्त किया गया है। परंपरागत पाठ-साक्ष्य में “हज़ारों के” पदबंध के कारण उसे भी मुख्य पाठ में बनाए रखा गया है।
- source_word: ይፈልጥዎሙ ለመዋዕል
  choice: दिनों को अलग-अलग ठहराते हैं
  rationale: क्रिया में पहचानने, भेद करने, चिह्नित करने या निर्धारित करने की अर्थ-सीमा है। चुना हुआ वाक्यांश इस कैलेंडरीय कार्य को व्यक्त करते हुए अस्पष्टता बचाता है।
- source_word: ይትዌሰኩ ምስሌሆሙ
  choice: उनके साथ जोड़े जाते हैं
  rationale: यह पहले बताए गए पदाधिकारियों के साथ एक अतिरिक्त समूह के सम्मिलित होने का अर्थ सुरक्षित रखता है।
- source_word: ፬ መክፈልተ ዓመታት
  choice: वर्षों के चार विभाजन
  rationale: गीज़ के बहुवचन “वर्षों” और विभाजन-संबंधी शब्दावली, दोनों को बनाए रखा गया है।
theological_decisions:
- issue: इन खगोलीय व्यक्तियों का स्वरूप
  choice: उन्हें “अगुए” और “प्रधान” कहा गया है, पर स्वर्गदूत के रूप में स्पष्टतः पहचाना नहीं गया।
  alternative: उन्हें सीधे स्वर्गदूत कहना, या केवल अमूर्त कैलेंडरीय चिह्न मानना।
  rationale: इस पद में उनका कार्य और पदानुक्रम बताया गया है, पर उनका तत्त्वगत स्वरूप स्पष्ट नहीं किया गया; इसलिए पाठ की धार्मिक और अपोकैलिप्टिक अनिश्चितता सुरक्षित रखी गई है।
- issue: अंतिम उपवाक्य में “अगुए” का संबंध
  choice: चार जोड़े गए व्यक्तियों को ही ऐसे अगुए माना गया है जो चार विभाजनों को अलग-अलग ठहराते हैं।
  alternative: उन्हें उन अगुओं को निर्धारित करनेवाले मानना जो वर्ष के चार विभाजनों से संबंधित हैं।
  rationale: उपलब्ध पाठ और उसके समानांतर ढाँचे के आधार पर विशेषणात्मक संबंध अधिक स्वाभाविक है, यद्यपि गीज़ वाक्य-विन्यास कुछ असुविधाजनक है; इसलिए निर्णायक अतिरिक्त व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। दोहराए गए पदों और समानांतर वाक्य-संरचना को बनाए रखा गया है। “अगुए” प्रशासनिक-खगोलीय भूमिका बताता है, जबकि “क्रम,” “भाग” और “विभाजन” मूल की योजनाबद्ध कैलेंडरीय भाषा को सुरक्षित रखते हैं।
