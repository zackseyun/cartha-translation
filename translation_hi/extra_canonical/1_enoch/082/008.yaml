base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/008.yaml
  text: And they have authority by night and by day in heaven[a], so that they may give light upon humankind—the sun and the moon and the stars and all the powers of heaven[b], which return in their courses.
translation:
  language: hi
  text: और स्वर्ग में उसे रात और दिन अधिकार प्राप्त है[a], ताकि सूर्य, चन्द्रमा, तारे और स्वर्ग की सारी शक्तियाँ मनुष्यों पर प्रकाश डालें और ये सब अपने-अपने मार्गों पर लौटें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके पास/उसमें अधिकार है।” पुल्लिंग एकवचन सर्वनाम सम्भवतः पिछले प्रसंग के ऊरीएल की ओर संकेत करता है।
    reason: grammatical_and_contextual_clarification
  - marker: b
    text: “शक्तियाँ” का अनुवाद “सत्ताएँ” या “प्रभुत्व” भी किया जा सकता है; यहाँ यह स्पष्ट नहीं कि अभिप्राय व्यक्तिकृत स्वर्गीय प्राणियों से है या ब्रह्मांडीय शक्तियों से। “मार्गों” के लिए “चक्रों” या “पथों” का अनुवाद भी सम्भव है।
    reason: lexical_and_theological_ambiguity
lexical_decisions:
- source_word: ስልጣነ፡ ቦቱ
  choice: उसे … अधिकार प्राप्त है
  rationale: ቦቱ में तीसरे पुरुष पुल्लिंग एकवचन का प्रत्यय है; इसका शाब्दिक भाव ‘उसमें अधिकार है’ है, जिसे स्वाभाविक हिन्दी में ‘उसे अधिकार प्राप्त है’ कहा गया। इससे बहुवचन अर्थ थोपे बिना पूर्ववर्ती पुरुष-संदर्भ सुरक्षित रहता है।
- source_word: በሌሊት፡ ወበመዓልት
  choice: रात और दिन
  rationale: यह सीधा काल-सूचक युग्म है। हिन्दी में ‘रात और दिन’ स्रोत की लय और दोनों अवधियों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ውስተ፡ ሰማይ
  choice: स्वर्ग में
  rationale: प्रसंग खगोलीय और ब्रह्मांडीय व्यवस्था का है; ‘स्वर्ग’ इस ऊँचे ब्रह्मांडीय भाव को केवल मौसम-संबंधी ‘आकाश’ से बेहतर बनाए रखता है।
- source_word: ከመ፡ ያርኡ፡ ብርሃነ
  choice: ताकि … प्रकाश डालें
  rationale: ከመ उद्देश्य प्रकट करता है और क्रिया प्रकाश दिखाने या देने का भाव रखती है। ‘प्रकाश डालें’ हिन्दी में इस प्रयोजन को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: ዲበ፡ ሰብእ
  choice: मनुष्यों पर
  rationale: ሰብእ सामूहिक रूप से मानवजाति को सूचित करता है। ‘मनुष्यों पर’ वर्तमान हिन्दी में समावेशी और स्रोत के संबंधबोधक अर्थ के निकट है।
- source_word: ፀሐየ፡ ወወርኀ፡ ወከዋክብተ
  choice: सूर्य, चन्द्रमा, तारे
  rationale: तीनों नामित ज्योतियों का सीधा और प्रतिष्ठित हिन्दी रूप चुना गया है।
- source_word: ኵሎሙ፡ ስልጣናት፡ ሰማይ
  choice: स्वर्ग की सारी शक्तियाँ
  rationale: बहुवचन ስልጣናት अधिकारों, प्रभुत्वों या शक्तियों को सूचित कर सकता है। ‘शक्तियाँ’ खगोलीय सामर्थ्यों और संभावित व्यक्तिकृत स्वर्गीय सत्ताओं—दोनों अर्थों की गुंजाइश बनाए रखता है।
- source_word: እለ፡ ይትመየጡ፡ በዓስቢሆሙ
  choice: जो अपने-अपने मार्गों पर लौटती हैं
  rationale: क्रिया मुड़ने या लौटने का और अंतिम पद मार्ग, क्रम या चक्र का भाव देता है। यह अनुवाद आवर्ती गति को व्यक्त करता है, पर आधुनिक खगोलशास्त्रीय ‘कक्षा’ का अनावश्यक तकनीकी अर्थ नहीं थोपता।
theological_decisions:
- issue: ስልጣነ ቦቱ में अधिकार का धारक एकवचन पुरुष है या बाद में उल्लिखित ज्योतियाँ
  choice: तीसरे पुरुष एकवचन ‘उसे … अधिकार प्राप्त है’
  alternative: ‘उन्हें अधिकार प्राप्त है’ अथवा ‘उन पर अधिकार है’
  rationale: ቦቱ का प्रत्यय व्याकरणतः पुल्लिंग एकवचन है और पूर्ववर्ती प्रसंग में यह किसी पुरुष-संदर्भ, सम्भवतः ऊरीएल, की ओर संकेत कर सकता है। नाम को पद में जोड़ने के बजाय सर्वनाम रखा गया है, ताकि इस पद की वास्तविक संदर्भगत निर्भरता सुरक्षित रहे।
- issue: ‘स्वर्ग की शक्तियाँ’ व्यक्तिगत स्वर्गीय प्राणी हैं या अवैयक्तिक ब्रह्मांडीय सामर्थ्य
  choice: ‘स्वर्ग की सारी शक्तियाँ’
  alternative: ‘स्वर्ग के सारे अधिकारी’ या ‘स्वर्गीय सेनाएँ’
  rationale: इस खगोलीय प्रसंग में पद व्यवस्थित स्वर्गीय शक्तियों को सूचित करता है, पर उसका व्यक्तिकृत अर्थ भी असम्भव नहीं है। ‘शक्तियाँ’ किसी एक व्याख्या को निर्णायक नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध शैली रखी गई है। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए ज्योतियों की सूची को ‘प्रकाश डालें’ का स्पष्ट कर्ता बनाया गया है। ‘चन्द्रमा’ औपचारिक-मध्यम पंजी का रूप है; ‘अपने-अपने मार्गों पर लौटती हैं’ आवर्ती खगोलीय गति को बिना अत्यधिक वैज्ञानिक या सिद्धान्तगत विशिष्टता के व्यक्त करता है।
