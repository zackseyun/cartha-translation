base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/002.yaml
  text: Wisdom I have given to you[a], and to your children, and to those who shall be your children, so that they may give this wisdom, which is beyond their understanding[c][b], to their children throughout the generations.
translation:
  language: hi
  text: बुद्धि मैंने तुम्हें[a], तुम्हारी संतानों को, और उन्हें भी जो भविष्य में तुम्हारी संतान होंगे, दी है, ताकि वे पीढ़ी-दर-पीढ़ी अपनी संतानों को यह बुद्धि दें, जो उनकी समझ से परे है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘और उन्हें भी जो भविष्य में तुम्हारी संतान होंगे’ वाला वाक्यांश उपलब्ध गीज़ पाठ में कोष्ठकों में है; यह अधिक सामान्य रूप से भावी वंशजों की ओर संकेत कर सकता है।
    reason: textual_variant
  - marker: b
    text: या, अधिक शाब्दिक रूप में, ‘उनके विचार/समझ पर।’ गीज़ पदबंध का अर्थ ‘उनके मन में’ भी लिया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ጥበበ
  choice: बुद्धि
  rationale: यह संज्ञा बुद्धि, समझ या विवेक को दर्शाती है। यहाँ प्रकट किए गए ज्ञान को पीढ़ियों तक सौंपने के संदर्भ में ‘बुद्धि’ व्यापक अर्थ और गरिमापूर्ण शैली बनाए रखती है।
- source_word: ወሀብኩ
  choice: मैंने ... दी है
  rationale: गीज़ का पूर्णतासूचक रूप भूतकाल व्यक्त करता है; हिन्दी का पूर्ण वर्तमान इस दिए हुए वरदान की वर्तमान प्रासंगिकता भी स्वाभाविक ढंग से रखता है।
- source_word: ወለውሉድከ
  choice: तुम्हारी संतान को
  rationale: मूल शब्द संतान या वंशज के व्यापक अर्थ में है; ‘संतान’ लिंग-निरपेक्ष है और अगली पीढ़ियों के संदर्भ के अनुकूल है।
- source_word: '[ወለእለ፡ ይከውኑ፡ ለከ፡ ውሉደ፡]'
  choice: और जो आगे तुम्हारी संतान होंगे उन्हें
  rationale: कोष्ठकबद्ध वाक्यांश भावी संतान या वंशजों की ओर संकेत करता है। हिन्दी में इसे मूल के निकट और बोधगम्य रखा गया है; पाठगत अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: ከመ፡ የሀቡ፡
  choice: ताकि वे ... दें
  rationale: 'यह उद्देश्यसूचक रचना है: एक पीढ़ी को बुद्धि इसलिए दी जाती है कि वह उसे अगली पीढ़ी को दे।'
- source_word: ለትውልዳት
  choice: पीढ़ी-दर-पीढ़ी
  rationale: बहुवचन क्रमागत पीढ़ियों को सूचित करता है। ‘पीढ़ी-दर-पीढ़ी’ हिन्दी में निरंतर हस्तांतरण को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ዲበ፡ ሕሊናሆሙ
  choice: जो उनकी समझ से परे है
  rationale: ዲበ का अर्थ ऊपर/परे और ሕሊና का अर्थ विचार, मन या समझ हो सकता है। संदर्भ में ‘समझ से परे’ संभावित अर्थ को सहज हिन्दी में देता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: सौंपी जाने वाली बुद्धि का स्वरूप
  choice: पद में प्रयुक्त व्यापक शब्द ‘बुद्धि’ रखा गया है, जिसे मिला हुआ और वंशजों को सौंपा जाने वाला ज्ञान समझा जा सकता है।
  alternative: इसे केवल सामान्य व्यावहारिक ज्ञान या विशेष रूप से खगोलीय-पंचांगी शिक्षा कहना।
  rationale: प्रकाशमान पिंडों की पुस्तक के संदर्भ में इसमें खगोलीय या पंचांगी शिक्षा सम्मिलित हो सकती है, पर पद स्वयं व्यापक शब्द का प्रयोग करता है; अनुवाद संदर्भ से अधिक विशिष्ट अर्थ आरोपित नहीं करता।
- issue: ዲበ፡ ሕሊናሆሙ का संबंध और अर्थ
  choice: ‘यह बुद्धि ... उनकी समझ से परे है’ के रूप में बुद्धि की विशेषता।
  alternative: ‘उनके मनों में/उनकी समझ पर यह बुद्धि’ अथवा वाक्य के अंत में ढीला संबद्ध पदबंध।
  rationale: ‘ऊपर/परे’ और मानसिक क्षमता के अर्थ से यह व्याख्या संभव और प्रसंगानुकूल है, लेकिन गीज़ पदबंध कुछ असामान्य है; इसलिए शाब्दिक विकल्प पादटिप्पणी में रखा गया है और अस्पष्टता पूरी तरह छिपाई नहीं गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘संतान’ को लिंग-निरपेक्ष और पीढ़ीगत अर्थ के लिए चुना गया है। वाक्य विन्यास मूल के आरंभिक ‘बुद्धि’ पर हल्का बल बनाए रखता है; पाठगत और अर्थगत अनिश्चितताओं को पादटिप्पणियों में स्पष्ट किया गया है।
