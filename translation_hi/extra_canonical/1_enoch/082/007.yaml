base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/007.yaml
  text: And the matter is true[a], and the reckoning is exact; for Uriel showed me the luminaries, and the paths, and the appointed times, and the years, and the days, and breathed on me—Uriel[f][e][d][c][b], to whom the Lord of all creation of the world gave command concerning the host of heaven.
translation:
  language: hi
  text: और यह बात सत्य है, और उसका हिसाब ठीक और सटीक है[a]; क्योंकि ऊरीएल ने मुझे ज्योतियों, महीनों, नियत समयों[b], वर्षों[c] और दिनों को दिखाया, और मुझ पर फूँका[d]—वही ऊरीएल, जिसे संसार की समस्त सृष्टि के प्रभु ने आकाशीय सेना के विषय में आदेश दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “हिसाब” का अर्थ “गणना” या “विवरण” भी हो सकता है। मूल पद सावधानी और सटीकता पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: “नियत समयों” के लिए प्रयुक्त शब्द का अर्थ “पर्वों” या “उत्सवों” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ “वर्षों” के स्थान पर “ऋतुओं” या “वार्षिक कालों” का अर्थ भी संभव है।
    reason: textual_or_lexical_ambiguity
  - marker: d
    text: शाब्दिक रूप से “मुझ पर फूँका।” इस असामान्य क्रिया का आशय प्रेरणा या शिक्षा देना हो सकता है, पर मूल पाठ इसे स्पष्ट नहीं करता।
    reason: preserved_ambiguity
lexical_decisions:
- source_word: አማን ነገሩ
  choice: यह बात सत्य है
  rationale: አማን को उसके सामान्य विशेषणार्थ ‘सत्य’ में लिया गया है; इससे कथन की पुष्टि बनी रहती है और इसे संकेतवाचक सूत्र मात्र नहीं बनाया जाता।
- source_word: ጥንቁቅ ሐሳቡ ዘልኩዕ
  choice: उसकी निर्धारित गणना सटीक है
  rationale: ጥንቁቅ और ሐሳብ यहाँ सावधानी से की गई सटीक गणना का बोध देते हैं, जबकि ዘልኩዕ उसके नियत या निर्धारित होने की धारणा जोड़ता है।
- source_word: ብርሃናት
  choice: ज्योतियाँ
  rationale: यह खगोलीय प्रकाश-पिंडों के लिए गरिमापूर्ण और संदर्भानुकूल बहुवचन है।
- source_word: አውራኅ
  choice: महीने
  rationale: यह ወርኅ ‘महीना’ का बहुवचन रूप है; इस कैलेंडर-संबंधी सूची में ‘मार्ग’ की अपेक्षा ‘महीने’ स्रोत-साक्ष्य से अधिक पुष्ट है।
- source_word: በዓላት
  choice: नियत समय
  rationale: शब्द पर्वों या उत्सवों का भी द्योतक हो सकता है, पर इस कैलेंडर-संबंधी संदर्भ में व्यापक ‘नियत समय’ अर्थ को मुख्य पाठ में रखा गया है।
- source_word: ክረማት
  choice: वर्ष
  rationale: यह वर्ष या ऋतु जैसे बड़े काल-विभाग को सूचित कर सकता है; सूची के क्रम में ‘वर्ष’ स्वाभाविक है, और अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: መዋዕል
  choice: दिन
  rationale: यहाँ बड़े काल-विभागों के बाद आने के कारण सामान्य अर्थ ‘दिन’ उपयुक्त है।
- source_word: ነፍሐ ዲቤየ
  choice: मुझ पर फूँका
  rationale: मूल की ठोस और असामान्य प्रकाशनात्मक छवि को व्याख्यात्मक ‘मुझे शिक्षा दी’ में बदलने के बजाय सुरक्षित रखा गया है।
- source_word: ሐይለ ሰማይ
  choice: आकाश की सेना
  rationale: यह स्वर्गीय या खगोलीय सुव्यवस्थित समूह का शाब्दिक और पारंपरिक रूप है, बिना यह तय किए कि इसमें केवल तारे हैं या स्वर्गीय प्राणी भी।
theological_decisions:
- issue: እግዚእ को ईश्वरीय उपाधि के रूप में प्रस्तुत करना
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ दिव्य सार्वभौमिक अधिकार का गरिमापूर्ण और सामान्य हिन्दी रूप है तथा किसी विशिष्ट संप्रदायगत अर्थ को नहीं जोड़ता।
- issue: ऊरीएल के मुझ पर फूँकने की छवि
  choice: ठोस क्रिया को यथावत रखना
  alternative: ‘मुझे प्रेरित किया’ या ‘मुझे शिक्षा दी’
  rationale: व्याख्यात्मक विकल्प इस क्रिया को मानसिक या शिक्षात्मक बना देते; मूल पाठ की रहस्यदर्शी अस्पष्टता को बनाए रखना अधिक उचित है।
- issue: ‘आकाश की सेना’ की पहचान
  choice: पहचान को खुला रखना
  alternative: इसे स्पष्ट रूप से तारों या स्वर्गदूतों तक सीमित करना
  rationale: स्रोत का पद व्यापक है; अनावश्यक रूप से किसी एक धर्मवैज्ञानिक पहचान को थोपना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज रखी गई है। कैलेंडर-संबंधी तकनीकी क्रम को स्पष्ट रखा गया है; ‘ज्योतियाँ,’ ‘नियत समय,’ और ‘आकाश की सेना’ जैसे पद मूल के अपोकैलिप्टिक स्वर को बनाए रखते हैं। नाम Uriel को ‘ऊरीएल’ रूप में लिप्यंतरित किया गया है।
