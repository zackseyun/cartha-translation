base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/012.yaml
  text: 'And these are the heads of a thousand: between leader and leader[a], six are added after the station[e][d][c][b]; and their leaders make the distinction.'
translation:
  language: hi
  text: 'और ये हज़ार के प्रधान[a] हैं: एक अगुवे और दूसरे अगुवे के बीच[b], स्थिति के बाद छह जोड़े जाते हैं[c]; और उनके अगुवे भेद करते हैं[d]।[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘हज़ार के सिर’। इसका अर्थ ‘हज़ार के प्रधान’ या ‘हज़ार पर नियुक्त अगुवे’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: गीइज़ पदबंध का अर्थ ‘एक अगुवे और दूसरे अगुवे के बीच’ है; पुराने अनुवाद में इसे ‘अगुवों के मध्य, और अगुवा-दर-अगुवा’ भी समझा गया है।
    reason: previous_rendering
  - marker: c
    text: मूल पाठ यह नहीं बताता कि जोड़ी जाने वाली ये छह चीज़ें दिन हैं, खंड हैं या कोई अन्य इकाइयाँ।
    reason: textual_variant
  - marker: d
    text: या ‘अलग करते हैं’ अथवा ‘पहचानते हैं’। वाक्य में इसका कर्म स्पष्ट नहीं है।
    reason: lexical_alternative
  - marker: e
    text: इस पद का गीइज़ पाठ वाक्यरचना की दृष्टि से कठिन है। संभवतः यह ज्योतियों की व्यवस्था के तकनीकी विभाजनों का वर्णन करता है, पर इसे निश्चित रूप से खोलना संभव नहीं है।
    reason: textual_variant
lexical_decisions:
- source_word: እሙንቱ
  choice: ये
  rationale: बहुवचन संकेतवाचक पद है, जो सामने वर्णित समूहों का परिचय देता है।
- source_word: አርእስት፡ ፲፻
  choice: हज़ार के प्रधान
  rationale: शाब्दिक अर्थ ‘हज़ार के सिर/प्रधान’ है और यह एक तकनीकी प्रशासनिक या नेतृत्व-संबंधी पद भी हो सकता है; ‘प्रधान’ आधुनिक हिन्दी में अर्थपूर्ण रहते हुए उस पदगत भाव को बनाए रखता है।
- source_word: ማእከለ፡ መራኂ፡ ወመራኂ
  choice: एक अगुवे और दूसरे अगुवे के बीच
  rationale: दोहराए गए संज्ञापद के साथ यह गीइज़ मुहावरा ‘एक ... और दूसरे ... के बीच’ का अर्थ देता है।
- source_word: ይትዌሰኩ፡ ፮
  choice: छह जोड़े जाते हैं
  rationale: क्रिया का निष्क्रिय भाव सुरक्षित रखा गया है; पाठ यह स्पष्ट नहीं करता कि छह क्या हैं, इसलिए कोई इकाई नहीं जोड़ी गई।
- source_word: በድኅረ፡ ምቅዋም
  choice: स्थिति के बाद
  rationale: मूल संज्ञा खड़े होने, ठहरने या निर्धारित स्थान/स्थिति का बोध करा सकती है। ‘स्थिति’ तकनीकी संदर्भ में स्वाभाविक है और अनावश्यक व्याख्या नहीं जोड़ती।
- source_word: መራሕያኒሆሙ
  choice: उनके अगुवे
  rationale: पूर्ववर्ती नेतृत्व-संबंधी शब्दावली से संगति रखते हुए संबंधसूचक बहुवचन को स्पष्ट रूप से व्यक्त करता है।
- source_word: ይፈልጡ
  choice: भेद करते हैं
  rationale: क्रिया अलग करने, भेद करने या पहचानने का अर्थ दे सकती है। कर्म को अनिर्दिष्ट रखकर मूल की संक्षिप्तता और अस्पष्टता बचाई गई है।
theological_decisions:
- issue: क्या पद को अधिवर्षीय दिनों या वर्ष-विभाजन की स्पष्ट व्याख्या के रूप में सहज बनाया जाए
  choice: प्रधानों, अगुवों, छह के जोड़े जाने और भेद किए जाने की तकनीकी तथा कुछ हद तक अपारदर्शी भाषा बनाए रखी गई।
  alternative: इसे वर्ष में जोड़े जाने वाले अतिरिक्त दिनों या निश्चित खगोलीय खंडों की व्याख्या के रूप में परिभाषित करना।
  rationale: गीइज़ पाठ की वाक्यरचना कठिन है और वह जोड़ी जाने वाली इकाइयों को स्पष्ट नहीं करता। किसी विशिष्ट पंचांग-सिद्धांत को पाठ में डालना मूल की वास्तविक अस्पष्टता को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण लेकिन सहज रूप अपनाया गया है। ‘प्रधान’, ‘अगुवा’ और ‘स्थिति’ तकनीकी शब्दावली को समझने योग्य रखते हैं। मूल में अनिर्दिष्ट ‘छह’ और ‘भेद करते हैं’ के कर्म को स्पष्ट करने के लिए अनुमानित शब्द नहीं जोड़े गए हैं।
