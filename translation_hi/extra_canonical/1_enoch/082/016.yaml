  yaml_path: translation/extra_canonical/1_enoch/082/016.yaml
  text: 'And these are the signs of the days that appear on the earth in the days of his dominion: heat and warmth and calm[a]; and all the trees bear fruit, and leaves come forth on all the trees, and the harvest of wheat, and the blossom of the rose, and every flower that comes forth in the field[f][e][d][c][b]; but the trees of winter dry up.'
translation:
  language: hi
  text: 'और ये उन दिनों के चिह्न हैं जो उसके शासन के दिनों[b] में पृथ्वी पर दिखाई देते हैं[a]: पसीना, गरमी और शांत मौसम[c]; सभी वृक्ष फलते हैं, सभी वृक्षों पर पत्ते निकलते हैं, गेहूँ की कटनी होती है, गुलाब खिलता है[e], और मैदान[d] में हर फूल उगता है; पर शीतकाल के वृक्ष सूख जाते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पृथ्वी पर प्रकट किए जाते हैं’; गीइज़ क्रिया में दिखाए जाने और दिखाई देने, दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उसके शासन के दिनों’ से संभवतः आसपास के प्रसंग में वर्णित ज्योति-पिंड की शासन-अवधि अभिप्रेत है; इस पद में सर्वनाम का संदर्भ स्पष्ट नहीं किया गया है।
    reason: cross_reference
  - marker: c
    text: ‘शांत मौसम’ के लिए प्रयुक्त शब्द का अर्थ अनिश्चित है; इससे सुखद या कोमल जलवायु-दशा भी अभिप्रेत हो सकती है।
    reason: lexical_alternative
  - marker: d
    text: ‘मैदान’ के लिए प्रयुक्त शब्द का अर्थ अन्य स्थानों पर निर्जन प्रदेश या खुला देश भी हो सकता है; यहाँ वनस्पति का प्रसंग ‘मैदान’ के पक्ष में है।
    reason: lexical_alternative
  - marker: e
    text: ‘गुलाब’ पौधे की पारंपरिक पहचान है; मूल शब्द अधिक सामान्य रूप से किसी फूलदार पौधे को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ትእምርተ
  choice: चिह्न
  rationale: यह संज्ञा दिखाई देने वाले संकेतों को व्यक्त करती है; यहाँ ये ऋतु और दिनों की पहचान कराने वाली प्राकृतिक घटनाएँ हैं।
- source_word: መዋዕለ
  choice: दिन
  rationale: मूल अर्थ ‘दिन’ है, यद्यपि प्रसंग में समय-अवधि या ऋतु का भाव भी हो सकता है। ठोस कालगत भाषा बनाए रखने के लिए ‘दिन’ रखा गया है।
- source_word: ያስተርእዩ
  choice: दिखाई देते हैं
  rationale: क्रिया में दिखाने अथवा प्रकट होने का भाव है। हिंदी में ‘दिखाई देते हैं’ प्राकृतिक और प्रेक्षणात्मक अर्थ दोनों को बनाए रखता है।
- source_word: ስልጣኑ
  choice: उसके शासन
  rationale: शब्द अधिकार, प्रभुत्व या शासन को दर्शाता है। सर्वनाम का संदर्भ स्पष्ट किए बिना ‘उसके शासन’ मूल की अनिश्चितता को सुरक्षित रखता है।
- source_word: ሀፍ
  choice: पसीना
  rationale: यह शब्द मूलतः पसीने को सूचित कर सकता है और उससे गरमी का विस्तारित भाव निकलता है। अगले शब्द से भेद बनाए रखने और ऋतु के प्रत्यक्ष शारीरिक चिह्न को व्यक्त करने के लिए ‘पसीना’ चुना गया है।
- source_word: ሞቅ
  choice: गरमी
  rationale: यह गरमी या उष्णता को दर्शाता है। ‘पसीना’ के साथ यह गरम ऋतु के संबंधित किंतु अलग चिह्न को व्यक्त करता है।
- source_word: ዛሕን
  choice: शांत मौसम
  rationale: इस प्रसंग में शब्द का अर्थ अनिश्चित है; संभवतः यह सुखद, कोमल या शांत जलवायु-दशा बताता है। ‘शांत मौसम’ बिना अत्यधिक विशिष्टता के जलवायवीय भाव स्पष्ट करता है।
- source_word: ዕፀው
  choice: वृक्ष
  rationale: यह वृक्षों या काष्ठीय पौधों के लिए सामान्य शब्द है; इस कृषि-संबंधी वर्णन में ‘वृक्ष’ स्वाभाविक है।
- source_word: ይፈርዩ
  choice: फलते हैं
  rationale: क्रिया फल उत्पन्न करने को व्यक्त करती है। ‘फलते हैं’ संक्षिप्त, स्वाभाविक और ठोस हिंदी है।
- source_word: ቈጽል
  choice: पत्ते
  rationale: वनस्पति-वृद्धि के प्रसंग में यह पत्तों या पर्णसमूह को सूचित करता है; साधारण पाठक के लिए ‘पत्ते’ स्पष्ट है।
- source_word: ይወጽእ
  choice: निकलते हैं / निकलता है
  rationale: क्रिया बाहर आने, उगने या प्रकट होने को दर्शाती है। वृक्षों के पत्तों और मैदान के फूलों दोनों के साथ ‘निकलना’ मूल की पुनरावृत्ति को यथासंभव बनाए रखता है।
- source_word: ማእረረ ስርናይ
  choice: गेहूँ की कटनी
  rationale: पदबंध गेहूँ की उपज, पकने या कटनी की अवस्था को सूचित करता है। ऋतु-चिह्नों के प्रसंग में ‘गेहूँ की कटनी’ सबसे स्पष्ट कृषि-संबंधी अर्थ देता है।
- source_word: ጽጌ ረዳ
  choice: गुलाब खिलता है
  rationale: पौधे की पारंपरिक पहचान ‘गुलाब’ है, हालांकि मूल किसी व्यापक पुष्पीय पौधे को भी सूचित कर सकता है। क्रियात्मक हिंदी वाक्य के प्रवाह के लिए ‘खिलता है’ रखा गया है।
- source_word: ገዳም
  choice: मैदान
  rationale: शब्द निर्जन प्रदेश, खुला देश या मैदान दर्शा सकता है। यहाँ फूलों और वनस्पति के प्रसंग के कारण ‘मैदान’ उपयुक्त है।
- source_word: ዕፀወ ክረምት
  choice: शीतकाल के वृक्ष
  rationale: मूल पदबंध को निकटता से रखा गया है। इसका आशय शीत ऋतु से संबद्ध वृक्षों से है, पर उनकी ठीक पहचान नहीं जोड़ी गई।
theological_decisions:
- issue: ‘उसके शासन के दिनों’ में ‘उसके’ का संदर्भ
  choice: सर्वनाम को बनाए रखा गया और उसके संदर्भ की पहचान नहीं जोड़ी गई।
  alternative: ‘सूर्य के शासन के दिनों’ या ‘उस ज्योति-पिंड के शासन के दिनों’
