  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सरल शैली रखी गई है। मूल की सूची-जैसी लय और बार-बार आने वाली वनस्पति-छवियों को बनाए रखा गया है। ‘उसके’ का संदर्भ नहीं खोला गया, और अनिश्चित जलवायु तथा पौध-नामों को पादटिप्पणियों में स्पष्ट किया गया है।
