base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/017.yaml
  text: 'And these are the names of the leaders who are under them: Berkael[a], Zelbesael, and another who is added, the head of a thousand, whose name is Helyaseph[c][b]. And the days of the dominion of this one are completed.'
translation:
  language: hi
  text: 'और ये उन नेताओं के नाम हैं जो उनके अधीन हैं: बेरकाएल, ज़ेलबेसाएल, और एक अन्य जो जोड़ा गया है—हज़ार का प्रधान—जिसका नाम हेलयासेफ है।[a] और इस व्यक्ति के प्रभुत्व के दिन पूरे होते हैं।[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “और एक अन्य जो जोड़ा गया है—हज़ार का प्रधान” वाला वाक्यांश गीज़ में पाठ की दृष्टि से कुछ कठिन है; संभव है कि यह सूची में जोड़े गए एक अतिरिक्त पदाधिकारी को दर्शाता हो।
    reason: textual_variant
  - marker: b
    text: या, “इस व्यक्ति के अधिकार के दिन पूरे होते हैं।” गीज़ शब्द का अर्थ ‘अधिकार’, ‘प्रभुत्व’ या ‘प्रदत्त अधिकार’ हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'अन्य सम्भव विभाजन: “और एक अन्य, जो हज़ार के प्रधान के रूप में जोड़ा गया है, हेलयासेफ। और इस व्यक्ति के प्रभुत्व के दिन पूरे होते हैं।”'
    reason: previous_rendering
lexical_decisions:
- source_word: አስማቲሆሙ
  choice: उनके नाम
  rationale: बहुवचन संबंधसूचक रूप को स्वाभाविक हिन्दी नामावली-सूत्र में रखा गया है।
- source_word: መራሕያነ
  choice: अगुवे
  rationale: शब्द नेतृत्व या निर्देशन करने वालों को दर्शाता है; ‘अगुवे’ पदानुक्रम को बनाए रखता है, पर सैनिक या याजकीय पद नहीं थोपता।
- source_word: እለ መትሕቴሆሙ
  choice: जो उनके अधीन हैं
  rationale: यह संगठित क्रम में अधीनता को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ብርክኤል
  choice: बेरकाएल
  rationale: गीज़ व्यंजनात्मक रूप के निकट रहते हुए व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: ዜልብስኤል
  choice: ज़ेलबेसाएल
  rationale: अनिश्चित स्वर-विन्यास के कारण नाम का रूढ़िवादी देवनागरी लिप्यंतरण अपनाया गया है।
- source_word: ዘይትዌሰክ
  choice: जो जोड़ा जाता है
  rationale: रूप किसी अतिरिक्त व्यक्ति के सूची या पद में सम्मिलित किए जाने का संकेत देता है।
- source_word: ርእሰ ፲፻
  choice: हज़ार का प्रधान
  rationale: शाब्दिक अर्थ ‘हज़ार का सिर/प्रधान’ है; यह पदानुक्रम बनाए रखता है और अनावश्यक सैनिक अर्थ से बचता है।
- source_word: ሂሉያሴፍ
  choice: हेलयासेफ
  rationale: गीज़ पाठ के निकट व्यक्तिगत नाम का सावधान देवनागरी लिप्यंतरण है।
- source_word: ስሙ
  choice: जिसका नाम ... है
  rationale: स्रोत में उपस्थित ‘उसका नाम’ को स्पष्ट रूप से व्यक्त किया गया है, ताकि नाम केवल समानाधिकरण बनकर न रह जाए।
- source_word: ተፈጸመ መዋዕለ ስልጣኑ
  choice: प्रभुत्व के दिन पूरे होते हैं
  rationale: क्रिया पूर्ण होने का भाव और ስልጣን का शासन/अधिकार क्षेत्र सुरक्षित है; खगोलीय चक्र के संदर्भ में हिन्दी वर्तमानकाल आवर्ती पूर्णता को व्यक्त करता है।
- source_word: ለዝ
  choice: इस जन के
  rationale: संकेतवाचक बल को बनाए रखते हुए हिन्दी में स्वाभाविक संबंधसूचक रचना अपनाई गई है; संदर्भ संभवतः अंतिम नामित व्यक्ति है।
theological_decisions:
- issue: ज्योतियों के क्रम में पदानुक्रमिक उपाधियों का स्वरूप
  choice: ‘अगुवे’ और ‘हज़ार का प्रधान’ जैसी प्रशासनिक-पदानुक्रमिक भाषा
  alternative: उन्हें स्पष्ट रूप से स्वर्गदूतीय प्रधान या केवल खगोलीय अधिकारी कहना
  rationale: यह पद क्रमबद्ध ब्रह्मांडीय व्यवस्था के नामित अधिकारियों को दिखाता है, पर इसी वाक्य में उन्हें स्पष्टतः स्वर्गदूत नहीं कहता; अनुवाद उस प्रश्न को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। नामों का अनुवाद नहीं, देवनागरी लिप्यंतरण किया गया है। स्रोत की कठिन वाक्य-संरचना और ‘प्रभुत्व/अधिकार’ की अर्थ-व्याप्ति पादटिप्पणियों में सुरक्षित है।
