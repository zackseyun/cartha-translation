base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/013.yaml
  text: 'And these are the names of the leaders who divide the four parts of the year[a], who are appointed: Milkiel, Helemmelek, Meleyal[b], and Narel.'
translation:
  language: hi
  text: 'और उन नियुक्त अगुओं के नाम ये हैं, जो वर्ष के चार भागों[a] को बाँटते हैं: मिल्कीएल, हेलेम्मेलेक, मेलेयाल[b] और नारेल।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वर्ष के चार विभागों’; गीइज़ अभिव्यक्ति का शाब्दिक अर्थ ‘वर्ष के चार भाग’ है।
    reason: lexical_alternative
  - marker: b
    text: इस OCR साक्ष्य में दूसरे और तीसरे नामों का पाठ कठिन है; यहाँ अधिक परिचित वर्तनी का पुनर्निर्माण करने के बजाय गीइज़ रूपों का सावधान लिप्यंतरण किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: አስማቲሆሙ
  choice: उनके नाम
  rationale: बहुवचन संबंधसूचक रूप को हिंदी की स्वाभाविक परिचयात्मक अभिव्यक्ति ‘नाम ये हैं’ में रखा गया है।
- source_word: መራሕያያን
  choice: अगुए
  rationale: मूल शब्द नेतृत्व या मार्गदर्शन करने वालों को दर्शाता है। ‘अगुए’ अधिकार की भावना बनाए रखता है, पर उनका पद या स्वभाव अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ይፈልጡ
  choice: बाँटते हैं
  rationale: क्रिया अलग करने या विभाजित करने का अर्थ देती है; वर्ष के भागों के संदर्भ में ‘बाँटते हैं’ सहज और अर्थानुकूल है।
- source_word: ፬መክፈልተ ዓመት
  choice: वर्ष के चार भाग
  rationale: यह गीइज़ पदबंध का निकट और स्पष्ट अनुवाद है। ‘चार तिमाहियाँ’ अधिक व्याख्यात्मक होता।
- source_word: ሥሩዓን
  choice: नियुक्त
  rationale: यह व्यवस्थित, निर्धारित या नियुक्त किए जाने का भाव देता है। खगोलीय प्रशासन के संदर्भ में ‘नियुक्त’ उपयुक्त है।
- source_word: ሚልኪኤል
  choice: मिल्कीएल
  rationale: गीइज़ रूप का निकट देवनागरी लिप्यंतरण किया गया है; नाम का अनुवाद नहीं किया गया।
- source_word: ህልእምሜሌክ
  choice: हेलेम्मेलेक
  rationale: OCR साक्ष्य में नाम कठिन है; किसी अधिक परिचित रूप का अनुमान लगाने के बजाय उपलब्ध गीइज़ रूप का सावधान लिप्यंतरण रखा गया है।
- source_word: ሜሌአየል
  choice: मेलेयाल
  rationale: अनिश्चित मध्य स्वरक्रम के बावजूद उपलब्ध गीइज़ रूप के निकट और हिंदी में पठनीय लिप्यंतरण चुना गया है।
- source_word: ናሬል
  choice: नारेल
  rationale: गीइज़ नाम का सीधा देवनागरी लिप्यंतरण है।
theological_decisions:
- issue: नामित व्यक्तियों का स्वरूप
  choice: वर्ष के भागों पर नियुक्त अगुए
  alternative: ऋतुओं के स्वर्गदूतीय प्रधान या मानवीकृत खगोलीय चिह्न
  rationale: प्रकाशमान पिंडों की पुस्तक के प्रसंग में ये ब्रह्मांडीय पदाधिकारी प्रतीत होते हैं, किंतु मूल पद उन्हें स्पष्टतः ‘स्वर्गदूत’ नहीं कहता। इसलिए पाठ में व्यापक शब्द ‘अगुए’ रखकर अनावश्यक धर्मशास्त्रीय निर्धारण से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण शैली रखी गई है। ‘अगुए’ ब्रह्मांडीय अधिकारियों की नेतृत्वकारी भूमिका व्यक्त करता है, पर उन्हें स्पष्टतः स्वर्गदूत नहीं ठहराता। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
