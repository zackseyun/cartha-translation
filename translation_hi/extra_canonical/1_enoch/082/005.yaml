base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/005.yaml
  text: Because of them, people go astray and do not reckon them in the reckoning of all the world; for people err concerning them and do not know them exactly.
translation:
  language: hi
  text: उनके कारण लोग भटकते हैं और समस्त संसार की गणना में उन्हें नहीं गिनते[a]; क्योंकि लोग उनके विषय में भूल करते हैं[b] और उन्हें ठीक-ठीक नहीं जानते।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: बीच का गीइज़ वाक्यांश कठिन है। “समस्त संसार की गणना में” का अर्थ “समस्त संसार के विचार में” भी लिया जा सकता है; फिर भी इस खगोलीय प्रसंग में “गणना” अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या, “क्योंकि वे मनुष्यों को भटका देते हैं।” गीइज़ क्रिया का रूप प्रेरणार्थक अर्थ भी दे सकता है।
    reason: source_ambiguity
  - marker: c
    text: “ठीक-ठीक” का अर्थ “सावधानी से” या “सटीक रूप से” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: በእንቲአሆሙ
  choice: उनके कारण
  rationale: यह पदबंध कारण या अवसर व्यक्त करता है; साथ ही बहुवचन सर्वनाम के संदर्भ को मूल पाठ की तरह अनिर्दिष्ट रखता है।
- source_word: ይጌግዩ
  choice: भटक जाते हैं
  rationale: यह चयन भूल करने और मार्ग से भटकने—दोनों अर्थ-छायाओं को सहज हिन्दी में बनाए रखता है।
- source_word: ኢየኀስብዎሙ
  choice: उनकी गणना नहीं करते
  rationale: खगोलीय और पंचांगीय प्रसंग में गिनने अथवा हिसाब लगाने का अर्थ प्रमुख है, जबकि सर्वनाम का संदर्भ मूल के समान खुला रखा गया है।
- source_word: ተበሐሳቤ
  choice: गणना में
  rationale: इस खगोलीय खंड में ሐሳብ-वर्ग का शब्द पंचांगीय हिसाब अथवा गणना का तकनीकी भाव रखता है; कठिन रूप के कारण वैकल्पिक मानसिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ኵሉ ዓለም
  choice: समस्त संसार की
  rationale: यह व्यापक सामूहिक दायरे को औपचारिक परंतु बोधगम्य हिन्दी में व्यक्त करता है।
- source_word: ይጌግይዎሙ
  choice: उनके विषय में भूल करते हैं
  rationale: संदर्भ के अनुसार यह अर्थ पठनीय है, लेकिन रूप में संभावित कारक अर्थ भी है; उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ኢያእምርዎሙ
  choice: उन्हें ... नहीं जानते
  rationale: जानने के सामान्य अर्थ को रखा गया है और पहचानने अथवा समझने जैसे अधिक विशिष्ट अर्थ आरोपित नहीं किए गए।
- source_word: ጥንቁቀ
  choice: ठीक-ठीक
  rationale: यह सावधानी, शुद्धता और परिशुद्ध ज्ञान का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: बार-बार आने वाले बहुवचन सर्वनामों का संदर्भ
  choice: मूल की तरह केवल “उनके/उनकी/उन्हें” रखा गया है।
  alternative: इन्हें आकाशीय ज्योतियों, उनके निर्धारित समयों, व्यवस्थाओं या पंचांग के विभागों के रूप में स्पष्ट करना।
  rationale: आसपास का प्रसंग इन संभावित संदर्भों की ओर संकेत करता है, पर इस पद में संज्ञा स्पष्ट नहीं है; इसलिए किसी एक व्याख्या को पाठ में स्थापित नहीं किया गया।
- issue: दूसरे ይጌግይዎሙ का कर्तृवाचक अथवा कारक अर्थ
  choice: “मनुष्य उनके विषय में भूल करते हैं”
  alternative: “वे मनुष्यों को भटका देते हैं”
  rationale: वाक्य-संदर्भ प्रथम अर्थ का समर्थन करता है, पर गीइज़ रूप कारक अर्थ की संभावना भी रखता है; इस तनाव को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। खगोलीय-पंचांगीय प्रसंग के कारण “गणना” को तकनीकी अर्थ में रखा गया है। मूल पाठ के अस्पष्ट बहुवचन सर्वनाम स्पष्ट नहीं किए गए, और कठिन क्रियारूप की वैकल्पिक व्याख्या पादटिप्पणी में सुरक्षित है।
