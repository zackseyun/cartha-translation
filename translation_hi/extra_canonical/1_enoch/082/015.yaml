  terminology: ‘मल्कीयाल,’ ‘तमअदेएनी,’ ‘उदित होता,’ and ‘शासन करता है’ suitably preserve the astronomical and personified register. ‘सूर्य’ remains a designation in the naming clause, as required by the source-sensitive reading.
