base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/015.yaml
  text: At the beginning of the year[a], first rises and rules Melkiyal, whose name is called Tam'ade'eni and the sun; and all the days of his dominion, while he rules[c][b], are ninety-one days.
translation:
  language: hi
  text: वर्ष के आरम्भ में मल्कीयाल पहले उदित होता और शासन करता है, जिसे तमअदेएनी और सूर्य कहा जाता है।[a] उसके शासन के वे सभी दिन, जिनमें वह शासन करता है, इक्यानबे दिन हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तमअदेएनी और सूर्य” वाला नामकरण-वाक्यांश पाठ की दृष्टि से कठिन है। “तमअदेएनी” को अनिश्चित अर्थ देने के बजाय नाम या पारिभाषिक पद मानकर लिप्यंतरित किया गया है।
    reason: textual_variant
  - marker: b
    text: यह पद वर्ष के आरम्भिक खंड को मल्कीयाल के शासन के अधीन मानवीकृत अवधि के रूप में प्रस्तुत करता है; इसकी कुल अवधि इक्यानबे दिन है।
    reason: cultural_note
lexical_decisions:
- source_word: በቅድመ፡ ዓመት
  choice: वर्ष के आरम्भ में
  rationale: स्थानवाचक अर्थ ‘के सामने’ के बजाय यहाँ समयवाचक प्रयोग है; यह आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: ቀዳማዊ፡ ይሠርቅ
  choice: पहले उदित होता है
  rationale: ቀዳማዊ को क्रिया के साथ क्रियाविशेषणवत् लिया गया है; प्रकाशमान पिंड के प्रसंग में ‘उदित होना’ उपयुक्त है।
- source_word: ወይመልክ
  choice: और शासन करता है
  rationale: शासन के मूल को पद में आगे आए ‘शासन’ के साथ दोहराकर व्यक्त किया गया है, जिससे मानवीकृत ब्रह्मांडीय व्यवस्था बनी रहती है।
- source_word: ምልኪያል
  choice: मल्कीयाल
  rationale: व्यक्तिवाचक नाम का अर्थ लगाने के बजाय देवनागरी में लिप्यंतरण किया गया है।
- source_word: ዘይሠመይ፡ ስሞ
  choice: उसका नाम ... कहलाता है
  rationale: गीज़ की स्पष्ट नामकरण-संरचना को स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: ተመአደኒ
  choice: तमअदेएनी
  rationale: पाठ की दृष्टि से कठिन संभावित नाम या पारिभाषिक पद का अटकलबाज़ी से अनुवाद न करके लिप्यंतरण किया गया है।
- source_word: ወፀሐይ
  choice: और सूर्य
  rationale: नवीनतम पाठ-समीक्षा के अनुसार इसे नामकरण-वाक्यांश का अंग रखा गया है, न कि दिनों के साथ अगली उपवाक्य-रचना का कर्ता।
- source_word: ኵሎሙ፡ መዋዕለ
  choice: वे सभी दिन
  rationale: यह वाक्यांश संबंधित शासनावधि के दिनों की पूरी संख्या दर्शाता है।
- source_word: ዘበስልጣኑ፡ ዚአሁ
  choice: उसके शासन के
  rationale: ‘अधिकार/प्रभुत्व’ के अर्थ को उसी शासन-संबंधी शब्दावली में व्यक्त किया गया है जो पूरे पद को बाँधती है।
- source_word: እለ፡ ይመልክ
  choice: जिनमें वह शासन करता है
  rationale: सापेक्ष उपवाक्य को दिनों की अवधि से जोड़ा गया है और मूल की पुनरुक्ति सुरक्षित रखी गई है।
- source_word: ፺ወ፩ ዕለት
  choice: इक्यानबे दिन
  rationale: गीज़ अंक 91 का सीधा हिन्दी रूप।
theological_decisions:
- issue: कालक्रमिक व्यवस्था का मानवीकरण
  choice: मल्कीयाल के लिए ‘शासन करता है’ और ‘उसके शासन’ की भाषा बनाए रखी गई है।
  alternative: ‘अध्यक्षता करता है’, ‘इस अवधि को चिह्नित करता है’, या ‘ऋतु का संचालन करता है’।
  rationale: मूल पाठ नामित स्वर्गीय सत्ता द्वारा नियत ब्रह्मांडीय अवधि पर शासन का चित्र प्रस्तुत करता है। इसे तटस्थ पंचांग-सूचना में बदलना सर्वनाश-साहित्य की कल्पना को अनावश्यक रूप से सपाट कर देता।
- issue: ‘तमअदेएनी और सूर्य’ का संबंध
  choice: दोनों को मल्कीयाल के नाम अथवा पदनाम बताने वाले कठिन नामकरण-वाक्यांश में रखा गया है।
  alternative: ‘सूर्य’ को अगले वाक्यांश के साथ जोड़कर सूर्य और दिनों को संयुक्त कर्ता मानना।
  rationale: गीज़ शब्दक्रम और समानांतर सामग्री नामकरण-वाक्यांश का समर्थन करते हैं; फिर भी संरचना असामान्य होने के कारण पाठगत कठिनाई को टिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘उदित होता’ खगोलीय प्रसंग को तथा ‘शासन’ मूल की दोहराई हुई ब्रह्मांडीय-अधिकार भाषा को सुरक्षित रखता है। कठिन नामकरण-संरचना को सरल बनाकर उसका तनाव मिटाया नहीं गया।
