base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/009.yaml
  text: And this is the order of the stars[a], those that set in their places, and in their times, and in their festivals[b], and in their months.
translation:
  language: hi
  text: और यह उन तारों की व्यवस्था है जो अपने स्थानों[a] पर, अपने समयों में, अपने पर्वों[b] में और अपने महीनों में अस्त होते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘स्थानों’ के स्थान पर ‘नियत स्थितियों’ भी हो सकती हैं; गीज़ शब्द तारों की क्रमबद्ध गति में उन्हें दिए गए स्थानों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अपने पर्वों में’ का आशय यह नहीं कि तारे स्वयं पर्व मनाते हैं; यहाँ तारों की व्यवस्था को पवित्र पर्व-कालों की गणना से जोड़ा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: ሥርዓተ
  choice: व्यवस्था
  rationale: खगोलीय गतियों के क्रमबद्ध और नियमित विन्यास को व्यक्त करता है; ‘नियम’ की अपेक्षा यह कम विधिक और अधिक स्वाभाविक है।
- source_word: ከዋክብት
  choice: तारे
  rationale: गीज़ शब्द का सीधा अर्थ ‘तारे’ है; ‘आकाशीय पिंड’ मूल से अधिक व्यापक होता।
- source_word: የዐርቡ
  choice: अस्त होते हैं
  rationale: इस खगोलीय प्रसंग में क्रिया तारों के नीचे जाने या क्षितिज में प्रवेश करने, अर्थात अस्त होने, को सूचित करती है।
- source_word: በመካናቲሆሙ
  choice: अपने स्थानों पर
  rationale: बहुवचन रूप तारों के निर्धारित स्थानों अथवा स्थितियों का संकेत देता है; ‘स्थान’ सामान्य पाठक के लिए सहज है।
- source_word: በአዝማኒሆሙ
  choice: अपने समयों में
  rationale: मूल शब्द समयों अथवा नियत अवधियों को दर्शाता है; यह अनुवाद उसके कालगणनात्मक अर्थ को खुला रखता है।
- source_word: በበዓላቲሆሙ
  choice: अपने पर्वों में
  rationale: यह शब्द पर्वों या उत्सव-कालों के लिए प्रयुक्त होता है और पवित्र कालगणना की छाया को बनाए रखता है।
- source_word: በአውራኂሆሙ
  choice: अपने महीनों में
  rationale: मूल में स्पष्ट रूप से ‘महीने’ हैं; ‘चंद्र-महीने’ जोड़ना पाठ से आगे जाना होता।
theological_decisions:
- issue: कालगणना-संबंधी भाषा को केवल लौकिक समय के रूप में प्रस्तुत किया जाए या उसके पवित्र-पर्व संबंधी आयाम को बनाए रखा जाए
  choice: ‘समयों’, ‘पर्वों’ और ‘महीनों’—तीनों को अलग-अलग बनाए रखा गया है।
  alternative: सभी पदों को सामान्य रूप से ‘ऋतुओं’ या ‘अवधियों’ के रूप में अनूदित करना।
  rationale: यह पद ब्रह्मांडीय व्यवस्था और पवित्र कालगणना के संबंध को सामने रखता है; ‘पर्वों’ को बनाए रखने से मूल का धार्मिक-कालगणनात्मक तनाव समतल नहीं होता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। मूल की समानांतर संरचना और प्रत्येक काल-सूचक पद के साथ लगे संबंधसूचक भाव को यथासंभव सुरक्षित रखा गया है, भले ही ‘अपने पर्वों में’ हिन्दी में कुछ असामान्य लगे; उसकी व्याख्या पादटिप्पणी में दी गई है।
