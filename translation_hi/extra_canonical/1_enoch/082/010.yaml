base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/010.yaml
  text: 'And these are the names of those who lead them: those who keep watch and go in at their appointed times, those who lead them in their stations and in their orders and in their times and in their months and in their authorities and in their positions.'
translation:
  language: hi
  text: 'और ये उन लोगों के नाम हैं जो उनकी अगुवाई करते हैं: जो पहरा देते हैं और अपने नियत समयों पर प्रवेश करते हैं; जो उनके स्थानों, क्रमों, समयों, महीनों, अधिकारों और स्थितियों में उनकी अगुवाई करते हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመርኅዎሙ
  choice: उनकी अगुवाई करते हैं
  rationale: क्रिया का मूल अर्थ मार्ग दिखाना या नेतृत्व करना है; स्रोत में इसकी पुनरावृत्ति को हिन्दी में भी बनाए रखा गया है।
- source_word: የዐቅቡ
  choice: निगरानी रखते हैं
  rationale: यह पहरा देने, ध्यान रखने या निगरानी करने का भाव व्यक्त करता है; खगोलीय व्यवस्था के संदर्भ में तटस्थ और स्वाभाविक हिन्दी चुनी गई है।
- source_word: ይበውኡ
  choice: प्रवेश करते हैं
  rationale: शाब्दिक अर्थ ‘अंदर जाते/प्रवेश करते हैं’ है; अस्पष्ट खगोलीय संकेत को किसी विशेष व्याख्या से नहीं भरा गया।
- source_word: በአዝማነ፡ ዚአሆሙ
  choice: अपने नियत समयों पर
  rationale: ‘उनके समयों/ऋतुओं में’ का भाव है; ‘नियत’ नियमित खगोलीय व्यवस्था को स्पष्ट करता है, जबकि बहुवचन ‘समयों’ सुरक्षित रखा गया है।
- source_word: በሥርዓታቲሆሙ
  choice: क्रमों
  rationale: शब्द व्यवस्था, विधान या निर्धारित क्रम का अर्थ दे सकता है; यहाँ सूची के खगोलीय संदर्भ में ‘क्रमों’ संक्षिप्त और स्वाभाविक है।
- source_word: በስልጣናቲሆሙ
  choice: अधिकारों
  rationale: यह सत्ता, अधिकार या अधिकार-क्षेत्र का बोध कराता है; ‘अधिकारों’ स्रोत की व्यापकता और बहुवचन को बनाए रखता है।
- source_word: በምቅዋማቲሆሙ
  choice: स्थितियों
  rationale: यह खड़े होने के स्थान, पद या स्थिति को सूचित कर सकता है; पहले आए ‘स्थानों’ से भेद रखते हुए ‘स्थितियों’ चुना गया है।
theological_decisions:
- issue: नेतृत्व करने वालों की पहचान
  choice: ‘उन लोगों’ कहकर पहचान को अनिर्धारित रखा गया
  alternative: उन्हें स्वर्गदूत या खगोलीय अधिपति कहना
  rationale: इस पद में उनका स्पष्ट वर्गीकरण नहीं किया गया है; इसलिए निकटवर्ती संदर्भ से कोई विशिष्ट धार्मिक पहचान पाठ में नहीं जोड़ी गई।
- issue: ‘प्रवेश करते हैं’ का आशय
  choice: शाब्दिक खगोलीय भाषा बनाए रखी गई
  alternative: उदय होते हैं, द्वारों में प्रवेश करते हैं, या सेवा आरम्भ करते हैं
  rationale: मूल क्रिया केवल प्रवेश करने का भाव देती है; किसी एक संभावित व्याख्या को निर्णायक बनाना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय पर सहज शैली रखी गई है। स्रोत की समानांतर सूची और ‘अगुवाई करते हैं’ की पुनरावृत्ति को जानबूझकर सुरक्षित रखा गया है।
