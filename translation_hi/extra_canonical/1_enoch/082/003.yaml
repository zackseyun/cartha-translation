review_pass:
  verdict: revise
  source_fidelity: The draft correctly takes the difficult ear idiom as a positive act of eager listening, not as deafness or dullness, and correctly renders ትደልዎሙ as being pleasing rather than literally sweet. The food comparison is retained. Rendering ጥበብ as ‘ज्ञान’ in this context is a natural Hindi expression for wisdom/instruction that can be learned.
  naturalness: ‘जो समझ रखते हैं’ and especially ‘इस बुद्धि को सीखने’ are less idiomatic in modern standard Hindi. ‘जो समझदार हैं’ and ‘इस ज्ञान को सीखने’ read naturally. The final comparative wording needs slight recasting to avoid the dangling ‘उससे’ and to make the parallel with food clear.
  terminology: ‘ज्ञान’ appropriately conveys the wisdom/instruction denoted by ጥበብ here without suggesting merely an innate faculty, as ‘बुद्धि’ can in Hindi. ‘कान लगाकर सुनेंगे’ is an apt modern equivalent for the positive hearing idiom.
  issues:
  - severity: low
    issue: Idiomatic rendering of the discerning hearers and wisdom
    rationale: ‘जो समझ रखते हैं’ is understandable but less natural than ‘जो समझदार हैं’; ‘इस बुद्धि को सीखने’ can sound as though an intellectual faculty itself is being learned. ‘इस ज्ञान को सीखने’ preserves the referent in idiomatic Hindi.
  - severity: low
    issue: Comparative syntax in the final clause
    rationale: ‘उन्हें उससे भी अधिक भाएगी’ leaves ‘उससे’ without a clear antecedent until the following clause. Recasting makes the comparison between wisdom’s appeal and that of good food explicit while retaining the source’s parallel.
  revised_text: और जो समझदार हैं वे सोए नहीं रहेंगे, बल्कि इस ज्ञान को सीखने के लिए कान लगाकर सुनेंगे[a]; और यह उन्हें अच्छे भोजन से भी अधिक भाएगा, जितना अच्छा भोजन उसे खानेवालों को भाता है।
