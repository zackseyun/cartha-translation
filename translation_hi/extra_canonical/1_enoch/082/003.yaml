base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/003.yaml
  text: And those who understand shall not sleep[a], but shall listen with their ears so as to learn this wisdom[d][c][b]; and it will be sweeter to them than good food is to those who eat.
translation:
  language: hi
  text: और जो समझदार हैं वे सोए नहीं रहेंगे, बल्कि इस ज्ञान को सीखने के लिए कान लगाकर सुनेंगे[a]; और यह उन्हें अच्छे भोजन से भी अधिक भाएगा, जितना अच्छा भोजन उसे खानेवालों को भाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीइज़ में शाब्दिक बिंब ‘अपने कानों से प्यासे होना’ है—अर्थात् सुनने के लिए उत्कट और ग्रहणशील होना।
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢይነውሙ
  choice: सोए नहीं रहेंगे
  rationale: मूल क्रिया का सामान्य अर्थ ‘सोना’ है। प्रसंग में यह असावधानी का रूपक है, फिर भी मूल शारीरिक बिंब को बनाए रखा गया है।
- source_word: እለ ይሌብዉ
  choice: जो समझ रखते हैं
  rationale: यह समझदार अथवा विवेकी श्रोताओं को सूचित करता है; चुना हुआ रूप आधुनिक हिन्दी में सहज है और संज्ञानात्मक बल बनाए रखता है।
- source_word: ይጸምኡ በእዝናሆሙ
  choice: कान लगाकर सुनेंगे
  rationale: यह कठिन गीइज़ प्रयोग कानों से उत्कट ग्रहणशीलता या सुनने की लालसा व्यक्त करता है। इसे नकारात्मक ‘कानों से सुस्त होंगे’ न मानकर सकारात्मक, ध्यानपूर्वक सुनने की क्रिया के रूप में अनूदित किया गया है।
- source_word: ከመ ይትመሀርዋ
  choice: सीखने के लिए
  rationale: रचना सुनने के उद्देश्य को व्यक्त करती है; हिन्दी में यह संक्षिप्त और स्वाभाविक उद्देश्यवाचक रूप है।
- source_word: ለዛ ጥበብ
  choice: इस बुद्धि को
  rationale: संकेतवाचक शब्द अभी दी जा रही शिक्षा की ओर इंगित करता है; ‘इस’ उसका निकटवर्ती संकेत बनाए रखता है।
- source_word: ትደልዎሙ
  choice: उन्हें ... अधिक भाएगी
  rationale: ደለወ का अर्थ उपयुक्त, मनभावन या प्रिय लगना है, न कि शाब्दिक रूप से ‘मीठा होना’। ‘भाएगी’ भोजन से जुड़ी तुलना में भी स्वाभाविक है।
- source_word: እመበልዕት ሠናያት ለእለ ይበልዑ
  choice: उससे भी अधिक ... जितना अच्छा भोजन खानेवालों को भाता है
  rationale: मूल वाक्य बुद्धि से समझदारों को मिलनेवाली प्रसन्नता की तुलना अच्छे भोजन से खानेवालों को मिलनेवाली प्रसन्नता से करता है। यह रूप उस समानांतर वाक्य-संरचना और तुलनात्मक बल को स्पष्ट रखता है।
theological_decisions:
- issue: सोने और सुनने के शारीरिक बिंबों का रूपकात्मक बल
  choice: ‘सोए नहीं रहेंगे’ और ‘कान लगाकर सुनेंगे’ के बिंब बनाए रखे गए हैं।
  alternative: ‘समझदार लोग सजग रहकर ध्यान देंगे’ जैसा पूर्ण भावानुवाद।
  rationale: यह अंश प्रकट की गई बुद्धि को सजगता और ग्रहणशीलता से स्वीकार करने का आह्वान करता है। मूल बिंब बनाए रखने से अपोकैलिप्टिक-ज्ञान साहित्य की बनावट सुरक्षित रहती है और किसी विशिष्ट धर्मसैद्धांतिक व्याख्या को आरोपित नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘कान लगाकर सुनना’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी मूल के असामान्य ‘प्यास’ वाले बिंब को सुरक्षित रखती है। भोजन की तुलना में ‘भाना’ चुना गया है ताकि ደለወ को अनुचित रूप से ‘मीठा होना’ न बनाया जाए।
