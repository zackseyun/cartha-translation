    reason: lexical_alternative
  revision_rationale: The revision preserves the source’s metaphors of not sleeping and eager hearing, its purposive clause, and its comparison of wisdom’s appeal with that of good food. It makes only safe idiomatic Hindi and syntactic improvements; no doctrinal interpretation is introduced.
