base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/004.yaml
  text: Blessed are all the righteous who walk in the path of righteousness and have no sin like sinners[a], in the whole count of all their days, while the sun goes on its course in heaven, entering and going out through the gates for thirty days, together with the heads of the thousands of the order of the stars, and with the four that are added, which divide the four parts of the year[c][b], which lead them and enter with them on four days.
translation:
  language: hi
  text: धन्य हैं वे सभी धर्मी जो धार्मिकता के मार्ग पर चलते हैं और जिनमें पापियों जैसा पाप नहीं है—उनके सब दिनों की पूरी गिनती में—जब सूर्य आकाश में अपने मार्ग पर चलता है और फाटकों से तीस दिनों तक भीतर आता और बाहर जाता है, तारों की व्यवस्था में सहस्रों के प्रधानों[a] के साथ, और उन चार के साथ जो जोड़े जाते हैं[b] और वर्ष के चार भागों को बाँटते हैं; वे उनकी अगुवाई करते हैं और उनके साथ चार दिनों में प्रवेश करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस कठिन पदबंध का अनुवाद ‘तारों की व्यवस्था के सहस्रों के प्रधान’ भी हो सकता है। मूल में पदानुक्रम और ‘सहस्रों’ की संख्यात्मक छवि दोनों मौजूद हैं।
    reason: lexical_alternative
  - marker: b
    text: उपलब्ध गीइज़ पाठ में यहाँ अंक अस्पष्ट है और वह ‘दस’ जैसा पढ़ा जा सकता है; पर वर्ष के चार भागों और आगे आने वाले चार दिनों का संदर्भ परंपरागत पाठ ‘चार जोड़े गए’ का समर्थन करता है।
    reason: textual_variant
lexical_decisions:
- source_word: ብፁዓን፡ ጻድቃን
  choice: धन्य हैं वे सभी धर्मी
  rationale: ‘धन्य’ आशीर्वचन की ऊँची किंतु परिचित शैली रखता है, और ‘धर्मी’ बाइबलीय नैतिक पद ጻድቃን का स्वाभाविक हिन्दी रूप है।
- source_word: የሐውሩ፡ በፍኖተ፡ ጽድቅ
  choice: धार्मिकता के मार्ग पर चलते हैं
  rationale: नैतिक जीवन को मार्ग पर चलने के रूपक में ही रखा गया है; इसे केवल ‘सही जीवन जीते हैं’ कहकर सपाट नहीं किया गया।
- source_word: ወአልቦሙ፡ ኃጢአት፡ ከመ፡ ኃጥኣን
  choice: जिनमें पापियों जैसा पाप नहीं है
  rationale: मूल का प्रबल निषेध और तुलनात्मक ‘जैसा’ दोनों सुरक्षित हैं; इससे पूर्ण निष्पापता और पापियों जैसी जीवन-पद्धति के बीच की व्याख्यात्मक तनातनी को हल नहीं किया गया।
- source_word: በኍልቈ፡ ኵሉ፡ መዋዕሊሆሙ
  choice: उनके सब दिनों की पूरी गिनती में
  rationale: ‘गिनती’ खगोलीय पुस्तक की गणनात्मक और कालक्रम-संबंधी शब्दावली को बनाए रखती है।
- source_word: ለዘ፡ የኀውር፡ ፀሐይ፡ በሰማይ
  choice: जब सूर्य आकाश में अपने मार्ग पर चलता है
  rationale: सूर्य की गति को स्वाभाविक हिन्दी में व्यक्त करते हुए आरम्भ के ‘मार्ग पर चलते हैं’ से संरचनात्मक प्रतिध्वनि रखी गई है।
- source_word: በአናቅጽ፡ ይበውእ፡ ወይወጽእ፡ ሠላሳ፡ ዕለተ
  choice: फाटकों से तीस दिनों तक भीतर आता और बाहर जाता है
  rationale: ज्योतियों के फाटकों की केंद्रीय कल्पना और तीस दिनों की अवधि स्पष्ट रूप से सुरक्षित हैं।
- source_word: አርእስተ፡ ፲፻ዘሥርዓቶሙ፡ ለከዋክብት
  choice: तारों की व्यवस्था के सहस्रों के प्रधानों
  rationale: पदबंध की पदानुक्रमात्मक तथा संख्यात्मक भाषा को दृश्यमान रखा गया है; कठिन वाक्य-विन्यास को किसी अनिश्चित देवदूतीय पदनाम से नहीं बदला गया।
- source_word: ምስለ፲እለ፡ ይትዌሰኩ
  choice: उन चार के साथ भी जो जोड़े जाते हैं
  rationale: उपलब्ध पाठ में अंक कठिन है, पर अगले वाक्यांश के चार वार्षिक भाग और स्थापित पंचांग-संदर्भ चार अतिरिक्त इकाइयों का समर्थन करते हैं; अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: እለ፡ ይጼልዩ፡ ማእከለ፡ ፬ክፍለ፡ ዓመት
  choice: वर्ष के चार भागों को बाँटते हैं
  rationale: चार अतिरिक्त इकाइयों की पंचांगगत भूमिका को मूल के अनुसार स्पष्ट रखा गया है।
theological_decisions:
- issue: क्या ‘धर्मियों में पाप नहीं है’ पूर्ण निष्पापता का सिद्धान्त सिखाता है
  choice: ‘जिनमें पापियों जैसा पाप नहीं है’
  alternative: ‘जो पापियों की तरह पाप नहीं करते’ अथवा ‘जो पूरी तरह निष्पाप हैं’
  rationale: मूल का निषेध प्रबल है, पर तुलनात्मक पद ‘पापियों जैसा’ भी स्पष्ट है। अनुवाद न तो कथन को केवल जीवन-शैली तक कमजोर करता है, न इसे बाद की पूर्ण निष्पापता-संबंधी धर्मशास्त्रीय परिभाषा में बदलता है।
- issue: जोड़ी गई पंचांगगत इकाइयों की संख्या
  choice: चार जोड़ी गई इकाइयाँ
  alternative: पांडुलिपि/OCR में दिखाई देने वाले अंक के आधार पर दस इकाइयाँ
  rationale: वर्ष के चार भागों को बाँटने और आगे चार दिनों के उल्लेख वाला निकट संदर्भ चार अतिरिक्त दिनों या इकाइयों का प्रबल समर्थन करता है; फिर भी पाठगत कठिनाई को पादटिप्पणी में खुला रखा गया है।
- issue: ‘सहस्रों के प्रधान’ की पहचान
  choice: पदानुक्रमात्मक चित्र को बिना निश्चित पहचान दिए ज्यों का त्यों रखना
  alternative: उन्हें स्पष्ट रूप से स्वर्गदूत-सेनापति या तारामंडलों के अधिकारी कहना
  rationale: मूल पदानुक्रम और तारों की व्यवस्था का संबंध दिखाता है, लेकिन इन प्रधानों की सत्ता-श्रेणी को अधिक निश्चित नाम नहीं देता।
