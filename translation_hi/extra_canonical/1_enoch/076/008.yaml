  yaml_path: translation/extra_canonical/1_enoch/076/008.yaml
  text: And through the middle opening[a], which is beside it, there come out from it a pleasant fragrance, and dew, and rain, and peace[c][b], and life.
translation:
  language: hi
  text: और उस मध्यवर्ती द्वार[a] से, जो उसके पास है, सुखद सुगंध, ओस, वर्षा, शांति[b] और जीवन निकलते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खुला स्थान’। ‘मध्यवर्ती’ इसी द्वार को विशेषित करता है; यह पहले बताए गए द्वार के पास है।
    reason: lexical_and_syntactic_alternative
  - marker: b
    text: ‘शांति’ में कल्याण और सम्पूर्णता का भाव भी समाया हो सकता है, केवल संघर्ष का अभाव नहीं।
    reason: lexical_alternative
