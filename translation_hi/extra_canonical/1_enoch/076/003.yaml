base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/003.yaml
  text: And the first three are toward the east[a], and three toward the north, and three after these, on the left, toward the south[c][b], and three toward the west.
translation:
  language: hi
  text: और पहले तीन पूर्व की ओर हैं, और तीन उत्तर की ओर, और इनके बाद, बाईं ओर, तीन दक्षिण की ओर हैं,[a][b] और तीन पश्चिम की ओर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राचीन दिशाबोध में व्यक्ति को पूर्व की ओर मुख किए हुए माना जाता था; उस स्थिति में बाईं ओर उत्तर होता है। यहाँ पाठ ‘बाईं ओर’ के साथ ‘दक्षिण’ कहता है, इसलिए कथन में दिशात्मक तनाव बना रहता है।
    reason: cultural_note
  - marker: b
    text: ‘इनके बाद, बाईं ओर’ के अनुरूप गीइज़ शब्द उपलब्ध साक्ष्य में कोष्ठकों के भीतर हैं, जो इस अंश के पाठ के विषय में अनिश्चितता का संकेत देते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: ቀዳማያት
  choice: पहले
  rationale: यह बहुवचन विशेषण स्पष्ट रूप से ‘पहले’ को सूचित करता है; इसे केवल दिशासूचक मानकर छोड़ना स्रोत का एक तत्व मिटा देता।
- source_word: መንገለ
  choice: की ओर
  rationale: चारों दिशाओं के साथ दोहराया गया यह पद अभिमुखता बताता है; हिन्दी में ‘की ओर’ स्वाभाविक और स्पष्ट है।
- source_word: ጽባሕ
  choice: पूर्व
  rationale: शाब्दिक संबंध प्रभात या सूर्योदय से है, पर इस दिशात्मक सूची में आशय पूर्व दिशा है।
- source_word: መስዕ
  choice: उत्तर
  rationale: उपलब्ध संशोधित स्रोत-समीक्षा के अनुसार यहाँ पद उत्तर दिशा को सूचित करता है; इसे कथित संगति बनाने के लिए दक्षिण नहीं किया गया।
- source_word: በድኅረ እሉ
  choice: इनके बाद
  rationale: यह क्रमबद्ध गणना में अगले समूह की ओर संक्रमण दर्शाता है।
- source_word: በፀጋም
  choice: बाईं ओर
  rationale: स्रोत की सापेक्ष दिशात्मक भाषा को बनाए रखा गया है, भले ही अगले दिशानाम के साथ तनाव उत्पन्न हो।
- source_word: አዜብ
  choice: दक्षिण
  rationale: उपलब्ध संशोधित स्रोत-समीक्षा के अनुसार यह दक्षिण दिशा है; स्रोत के संभावित आंतरिक तनाव को चुपचाप ठीक नहीं किया गया।
- source_word: ዓረብ
  choice: पश्चिम
  rationale: यद्यपि इसका संबंध संध्या या सूर्यास्त से है, इस प्रसंग में यह पश्चिम दिशा को सूचित करता है।
theological_decisions:
- issue: ‘बाईं ओर’ और ‘दक्षिण’ के बीच दिशात्मक तनाव को कैसे प्रस्तुत किया जाए
  choice: दोनों को मुख्य पाठ में यथावत रखा गया
  alternative: ‘बाईं ओर’ को उत्तर के अनुरूप बनाना, हटाना, या दिशाओं की अदला-बदली करना
  rationale: प्राचीन पूर्वाभिमुख व्यवस्था में बाईं ओर सामान्यतः उत्तर होता, जबकि प्राप्त पाठ यहाँ दक्षिण कहता है। अनुवाद ने इस वास्तविक पाठगत तनाव को सुलझाने के बजाय सुरक्षित रखा है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और औपचारिक कथन। गणनात्मक लय तथा स्रोत में उपस्थित दिशात्मक असंगति दोनों सुरक्षित रखे गए हैं; फुटनोट चिह्न मुख्य पाठ में सम्मिलित हैं।
