  yaml_path: translation/extra_canonical/1_enoch/076/009.yaml
  text: And through the third opening[a], toward the west, there come out from it dew and rain[b], and frost and destruction.
translation:
  language: hi
  text: और पश्चिम की ओर वाले तीसरे द्वार से ओस, वर्षा, पाला और विनाश निकलते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሣልስት
  choice: तीसरे
  rationale: यह क्रमवाचक संख्या ኆኅት को विशेषित करती है; इसलिए स्वाभाविक हिन्दी में ‘तीसरे’ उपयुक्त है।
- source_word: ኆኅት
  choice: द्वार
  rationale: खगोलीय दर्शनों में यह उन आकाशीय मार्गों को दर्शाता है जिनसे प्राकृतिक शक्तियाँ निकलती हैं। हिन्दी में ‘द्वार’ इस ठोस बिंब को सहजता से बनाए रखता है।
- source_word: መንገለ ምዕራብ
  choice: पश्चिम की ओर वाले
  rationale: यह पद द्वार की पश्चिमी दिशा या स्थिति बताता है; यह रूप हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ይወፅእ እምኔሃ
  choice: से ... निकलते हैं
  rationale: गीज़ क्रिया रूपतः एकवचन है, पर उसके बाद कई वस्तुओं की सूची आती है; हिन्दी में संयुक्त कर्ता के अनुसार बहुवचन स्वाभाविक है।
- source_word: ጤለ
  choice: ओस
  rationale: इस प्रसंग और समीपवर्ती पदों में यह हल्की नमी, विशेषतः ओस, को सूचित करता है।
- source_word: ዝናም
  choice: वर्षा
  rationale: यह वर्षा के लिए सामान्य और स्पष्ट शब्द है।
- source_word: አናጽዕ
  choice: पाला
  rationale: प्राप्त स्रोत-साक्ष्य और इस सूची के मौसम-संबंधी संदर्भ के आधार पर ‘पाला’ चुना गया है; ‘टिड्डियाँ’ वाला अर्थ विवादित है।
- source_word: ደምሳሴ
  choice: विनाश
  rationale: यह शब्द नाश या उजाड़े जाने का अर्थ देता है; इसे हिमपात मानना स्रोत-शब्द से समर्थित नहीं है।
