base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/006.yaml
  text: And through the second middle gate abundance comes out[a], and from it come rain and fruit and peace and dew; and through the third gate, which is toward the south[c][b], frost comes out and dryness.
translation:
  language: hi
  text: और दूसरे मध्यवर्ती फाटक से प्रचुरता निकलती है[a], और उसी से वर्षा, फल, शान्ति और ओस निकलते हैं; और तीसरे फाटक से, जो दक्षिण की ओर है, पाला और शुष्कता[b] निकलते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ गीइज़ ርኅብ का अर्थ “प्रचुरता” लिया गया है। इसकी वर्तनी “अकाल/भूख” के निकटवर्ती रूप से आसानी से भ्रमित हो सकती है; “अकाल” पढ़ने पर आगे आने वाली वर्षा, फल, शान्ति और ओस की सूची असामान्य रूप से तीखा विरोध उत्पन्न करती है।
    reason: textual_variant
  - marker: b
    text: या, “सूखापन”।
    reason: lexical_alternative
lexical_decisions:
- source_word: ኆኅት
  choice: फाटक
  rationale: यह खगोलीय संरचना के उस द्वार को दर्शाता है जिससे मौसमी तत्त्व निकलते हैं; ‘फाटक’ मूल बिंब को स्पष्ट रूप से बनाए रखता है।
- source_word: ማእከላዊት
  choice: बीच वाला
  rationale: यह कई फाटकों में मध्यवर्ती फाटक का स्थान बताता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ርኅብ
  choice: बहुतायत
  rationale: प्रस्तुत गीइज़ पाठ की वर्तनी को ‘अकाल’ के निकटवर्ती रूप से अलग मानते हुए ‘विस्तार/प्रचुरता’ के अर्थ में लिया गया है; आगे वर्षा, फल, शान्ति और ओस की सकारात्मक सूची भी इस चयन के अनुकूल है।
- source_word: ዝናም
  choice: वर्षा
  rationale: मौसम-संबंधी सामान्य अर्थ को गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: ፍሬ
  choice: फल
  rationale: मूल का ठोस कृषि-संबंधी शब्द बनाए रखता है; संदर्भ में उपज का भाव भी समाहित है।
- source_word: ሠላም
  choice: शान्ति
  rationale: शब्द का सामान्य और व्यापक अर्थ सुरक्षित रखता है, यद्यपि इस प्रसंग में कुशल-क्षेम या समृद्धि का भाव भी हो सकता है।
- source_word: ጤለ
  choice: ओस
  rationale: वर्षा और फल के साथ कृषि-संबंधी सूची में यही सीधा अर्थ उपयुक्त है।
- source_word: መንገለ መስዕ
  choice: दक्षिण की ओर
  rationale: दिशासूचक पदबंध को सहज हिन्दी में रखा गया है; उपलब्ध परामर्श-सामग्री के अंतिम पाठ से भी यही दिशा समर्थित है।
- source_word: ቍር
  choice: पाला
  rationale: जलवायु-संबंधी इस सूची में सामान्य ‘ठंड’ की अपेक्षा यह अधिक विशिष्ट और प्रसंगानुकूल है।
- source_word: የብስ
  choice: सूखापन
  rationale: मूल के सामान्य अर्थ को सुरक्षित रखता है; ‘सूखा’ अधिक तीव्र और व्याख्यात्मक होता।
theological_decisions:
- issue: ब्रह्माण्डीय फाटकों का बिंब
  choice: ‘फाटक’ और बार-बार ‘निकलते हैं’ की भाषा बनाए रखी गई
  alternative: ‘द्वार/मार्ग’ कहकर वाक्य को ‘लाते हैं’ या ‘उत्पन्न करते हैं’ के रूप में सहज बनाना
  rationale: हनोक के खगोलीय दर्शन में मौसमी तत्त्व व्यवस्थित ब्रह्माण्डीय फाटकों से निकलते हैं। मूल बिंब को बनाए रखना उसके अपोकैलिप्टिक विश्व-दृष्टिकोण को सपाट मौसम-वर्णन में बदलने से बचाता है।
- issue: ሠላም का प्रसंगगत आशय
  choice: शान्ति
  alternative: कुशल-क्षेम या समृद्धि
  rationale: कृषि और मौसम की सूची में व्यापक कल्याण का अर्थ सम्भव है, फिर भी ‘शान्ति’ मूल शब्द की वास्तविक अर्थगत व्यापकता और तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘दूसरे, बीच वाले फाटक’ संरचना क्रम और स्थान दोनों स्पष्ट करती है। मूल की पुनरावृत्ति जानबूझकर बनाए रखी गई है, और पाठगत अनिश्चितता को मुख्य पाठ में चुपचाप सुलझाने के बजाय टिप्पणी में दर्ज किया गया है।
