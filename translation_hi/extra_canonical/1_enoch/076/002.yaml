base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/002.yaml
  text: Three of them are open at the face of heaven[a], and three in the west, and three at the right of heaven[c][b], and three at the left.
translation:
  language: hi
  text: उनमें से तीन आकाश के मुख पर[a] खुले हैं, तीन पश्चिम में, तीन आकाश की दाईं ओर[b], और तीन बाईं ओर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘आकाश के मुख पर’ है; आशय आकाश का सामने वाला भाग हो सकता है, जिसे प्राचीन दिशाभिमुखता के अनुसार पूर्व भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘दाईं ओर’ और ‘बाईं ओर’ को, आकाश के मुख की ओर उन्मुख होने के अनुसार, क्रमशः दक्षिण और उत्तर भी समझा जा सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: ፫እም ኔሆሙ
  choice: उनमें से तीन
  rationale: अंक के साथ आए संबंधसूचक और सर्वनामिक तत्व का अंशसूचक अर्थ है और यह पहले बताए गए द्वारों की ओर संकेत करता है।
- source_word: ርኅዋት
  choice: खुले हैं
  rationale: यह पद संदर्भ में द्वारों की खुली अवस्था बताता है, न कि अमूर्त ‘खुलाव’ या केवल ‘द्वारों के खुलने’ की क्रिया।
- source_word: በገጸ ሰማይ
  choice: आकाश के मुख पर
  rationale: ገጽ का मूल चित्र ‘मुख’ है। हिन्दी में यह असामान्य किंतु समझने योग्य ब्रह्मांडीय देह-चित्र को बनाए रखता है; ‘सामने’ कहना दिशा का अर्थ अधिक निश्चित कर देता।
- source_word: በምዕራብ
  choice: पश्चिम में
  rationale: यह स्पष्ट दिशासूचक पद है; संक्षिप्त और स्वाभाविक हिन्दी रूप चुना गया है।
- source_word: በየማነ ሰማይ
  choice: आकाश की दाईं ओर
  rationale: मूल के ‘दाएँ’ वाले स्थानिक रूपक को सुरक्षित रखा गया है; उसे सीधे ‘दक्षिण’ में नहीं बदला गया।
- source_word: በፀጋም
  choice: बाईं ओर
  rationale: यह पिछले ‘दाईं ओर’ के साथ संतुलित युग्म बनाता है। ‘उत्तर’ एक संभव दिशात्मक व्याख्या है, पर मूल का शाब्दिक स्थानिक चित्र नहीं।
theological_decisions:
- issue: ब्रह्मांड के देह-संबंधी दिशात्मक चित्र को मुख्य दिशाओं में सामान्यीकृत करना
  choice: मुख्य पाठ में ‘मुख’, ‘दाईं ओर’ और ‘बाईं ओर’ बनाए रखना
  alternative: इन्हें क्रमशः ‘पूर्व’, ‘दक्षिण’ और ‘उत्तर’ कहना
  rationale: मूल पाठ आकाश का वर्णन देह-संबंधी स्थानिक भाषा में करता है। दिशात्मक अर्थ संभव है, पर उसे मुख्य पाठ में रख देने से मूल की वास्तविक अस्पष्टता समाप्त हो जाती; इसलिए संभावित दिशा-व्याख्या टिप्पणियों में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वाक्य रखा गया है। ‘आकाश के मुख पर’ जानबूझकर कुछ चित्रात्मक और अपोकैलिप्टिक है; बाकी दिशात्मक सूची सहज हिन्दी में है।
