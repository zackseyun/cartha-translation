base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/010.yaml
  text: And after these[a], winds from the south—whose name is Sea[e][d][c][b], and which come out from the seventh opening that is toward the east—dew comes forth from it.
translation:
  language: hi
  text: और इनके बाद दक्षिण की हवाएँ—जिनका नाम “समुद्र” है[a] और जो पूर्व की ओर स्थित सातवें द्वार से निकलती हैं[b]—उस द्वार से ओस निकलती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जिनका नाम ‘समुद्र’ है” वाला अंश इथियोपिक पाठ-परंपरा में कठिन है और संभवतः किसी भिन्न पाठ या बाद की वृद्धि को दर्शाता है; फिर भी उपलब्ध साक्षी में होने के कारण इसे यहाँ रखा गया है।
    reason: textual_variant
  - marker: b
    text: एक अनिश्चित कोष्ठकबद्ध पाठ का अर्थ “पश्चिम की ओर” हो सकता है। उसकी स्थिति स्पष्ट न होने के कारण उसे मुख्य पाठ में नहीं रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: እምድኅረ እሉ
  choice: और इनके बाद
  rationale: यह क्रमसूचक वाक्यांश अगले वर्णन को पहले बताई गई हवाओं के बाद रखता है।
- source_word: ነፋሳት
  choice: हवाएँ
  rationale: दिशाओं और मौसमी घटनाओं के इस प्रसंग में इसका स्वाभाविक अर्थ ‘हवाएँ’ है, ‘आत्माएँ’ नहीं।
- source_word: ዘመንገለ መስዕ
  choice: दक्षिण की ओर से आनेवाली
  rationale: दिशासूचक वाक्यांश यहाँ हवाओं की उत्पत्ति अथवा दिशा बताता है; आधुनिक हिन्दी में यह रूप स्पष्ट और स्वाभाविक है।
- source_word: ዘስሙ ባሕር
  choice: जिसका नाम “समुद्र” है
  rationale: प्राचीन ब्रह्मांड-वर्णन के नामकरण-सूत्र को व्याख्यात्मक रूप देने के बजाय शाब्दिक रूप से सुरक्षित रखा गया है।
- source_word: እም፯ኆኅት
  choice: सातवें द्वार से
  rationale: चिह्न ፯ के साथ संज्ञा का रूप प्रसंग और उपलब्ध संशोधन के अनुसार एकवचन क्रमसूचक ‘सातवें द्वार’ समझा गया है; ‘द्वार’ ब्रह्मांडीय निकास का चित्र बनाए रखता है।
- source_word: እንተ መንገለ ምሥራቅ
  choice: जो पूर्व की ओर वाला है
  rationale: यह सापेक्ष वाक्य द्वार की दिशा बताता है और स्थानिक चित्र को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ይወፅእ እምኔሃ ጤለ
  choice: उससे ओस निकलती है
  rationale: स्त्रीलिंग एकवचन प्रत्यय ‘उससे’ द्वार को संदर्भित करता है, जबकि एकवचन क्रिया के साथ ‘ओस’ वाक्य का कर्ता है; मूल में ‘जैसे’ का सूचक शब्द नहीं है।
theological_decisions:
- issue: दक्षिणी हवा के लिए ब्रह्मांडीय नामकरण-सूत्र
  choice: “जिसका नाम ‘समुद्र’ है” को मुख्य पाठ में बनाए रखना
  alternative: इसे ‘समुद्री हवा’ कहकर अर्थ खोलना या पाठगत वृद्धि मानकर हटा देना
  rationale: शाब्दिक रूप प्राचीन अपोकैलिप्टिक ब्रह्मांड-विज्ञान की असामान्य शब्दावली और उसकी वास्तविक पाठगत कठिनाई दोनों को सुरक्षित रखता है; किसी विशेष धार्मिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली अपनाई गई है। ‘द्वार’, ‘हवाएँ’ और ‘ओस’ सामान्य पाठक के लिए स्पष्ट हैं। मूल की जटिल वाक्य-रचना को डैश के सहारे बनाए रखा गया है, और पाठगत अनिश्चितताओं को पादटिप्पणियों में सीमित किया गया है।
