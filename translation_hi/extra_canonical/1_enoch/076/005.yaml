base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/005.yaml
  text: And the first wind goes out from those gates[a], whose name is the east wind, through the first gate that is toward the east; and turning toward the south, from it come forth desolation, drought, death[c][b], and destruction.
translation:
  language: hi
  text: और उन फाटकों में से पहली हवा निकलती है, जिसका नाम पुरवाई है। वह पूर्व की ओर वाले पहले फाटक से निकलती है; और दक्षिण की ओर झुकती हुई[a], उससे उजाड़, सूखा, मृत्यु[b] और विनाश निकलते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस गीइज़ वाक्यांश का अर्थ कुछ कठिन है; इसका अनुवाद “दक्षिण की ओर मुड़ती हुई” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: गीइज़ पाठ में यहाँ स्पष्ट शब्द “मृत्यु” है। कुछ पुराने अनुवादों ने प्रसंग के आधार पर “गर्मी” या “झुलसाने वाली गर्मी” माना है।
    reason: translation_history
lexical_decisions:
- source_word: ወይወፅእ
  choice: निकलती है
  rationale: फाटक से बाहर आने की गति और इस खंड की आवर्ती शैली को सहज हिन्दी में बनाए रखता है।
- source_word: ቀዳማይ ነፋስ
  choice: पहली हवा
  rationale: हवाओं की क्रमबद्ध सूची को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: እምእልክቱ ኃዋሳው
  choice: उन फाटकों में से
  rationale: बहुवचन फाटकों और संकेतवाचक भाव दोनों को बनाए रखता है।
- source_word: ዘስሙ ጽባሓይ
  choice: जिसका नाम पुरवाई है
  rationale: नामकरण-सूत्र को सुरक्षित रखते हुए पूर्व से आने वाली हवा के लिए स्वाभाविक हिन्दी शब्द प्रयोग करता है।
- source_word: በቀዳሚት ኆኅት
  choice: पहले फाटक से
  rationale: दृश्य में फाटक की संगति और क्रमसूचक अर्थ को बनाए रखता है।
- source_word: እንተ መንገለ ጽባሕ
  choice: पूर्व की ओर वाले
  rationale: መንገለ का दिशासूचक अर्थ ‘की ओर’ है; अनावश्यक रूप से ‘मार्ग’ जोड़ने से बचता है।
- source_word: ታጸንኑ ለአዜብ
  choice: दक्षिण की ओर मुड़कर चलती हुई
  rationale: कठिन वाक्यांश की दक्षिणाभिमुख दिशा को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी वैकल्पिक सूक्ष्मता बचाती है।
- source_word: ድምሳሴ
  choice: उजाड़
  rationale: भूमि को उजाड़ देने वाली प्रलयकारी विपत्ति का कठोर भाव संक्षेप में व्यक्त करता है।
- source_word: ናብስት
  choice: सूखा
  rationale: हानिकारक हवा के संदर्भ में शुष्कता का ठोस और सामान्य हिन्दी रूप है।
- source_word: ሞት
  choice: मृत्यु
  rationale: प्राप्त गीइज़ पाठ में शब्द स्पष्टतः ‘मृत्यु’ है; मौसम-संबंधी संगति के लिए इसे ‘गर्मी’ करना स्रोत को बदल देगा।
- source_word: ሐጕል
  choice: विनाश
  rationale: अंतिम व्यापक विपत्ति के अशुभ और सर्वनाशकारी बल को सुरक्षित रखता है।
theological_decisions:
- issue: वर्णन को सामान्य मौसम तक सीमित करना या प्रलयकारी ब्रह्मांडीय व्यवस्था का स्वर बनाए रखना
  choice: उजाड़, सूखा, मृत्यु और विनाश की प्रलयकारी शृंखला को यथावत रखना
  alternative: इसे केवल साधारण मौसमी प्रभावों के रूप में प्रस्तुत करना
  rationale: पाठ हवाओं को व्यवस्थित ब्रह्मांडीय शक्तियों के रूप में दिखाता है जिनके गंभीर परिणाम होते हैं; ‘मृत्यु’ को हल्का करना पाठ के तनाव को मिटा देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘पुरवाई’ प्राकृतिक दिशात्मक नाम है। अंतिम उपवाक्य को शाब्दिक ‘उससे निकलते हैं’ के बजाय ‘वह अपने साथ…लाती है’ किया गया है, जिससे हिन्दी प्रवाह सहज रहता है और फाटक/हवा से उत्पन्न विपत्तियों का आशय सुरक्षित रहता है।
