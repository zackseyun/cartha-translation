base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/001.yaml
  text: And at the ends of the earth I saw twelve portals[a], and all of them were open for all the winds[b], from which the winds go out and blow upon the earth.
translation:
  language: hi
  text: और पृथ्वी के छोरों पर मैंने बारह द्वार[a] देखे; वे सभी सब हवाओं के लिए खुले थे। उन्हीं में से हवाएँ निकलती हैं और पृथ्वी पर बहती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल गीइज़ शब्द का अनुवाद ‘फाटक’ या ‘खुलने के स्थान’ भी किया जा सकता है। यहाँ दर्शन के संरचित ब्रह्मांडीय बिंब को बनाए रखने के लिए ‘द्वार’ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: አጽናፈ ምድር
  choice: पृथ्वी के छोरों पर
  rationale: यह पदबंध संसार की बाहरी सीमाओं को दर्शाता है। ‘पृथ्वी के छोर’ आधुनिक हिन्दी में स्वाभाविक है और दर्शन की ब्रह्मांडीय भौगोलिक कल्पना को बनाए रखता है।
- source_word: ርኢኩ
  choice: मैंने ... देखे
  rationale: यह प्रथम पुरुष में दर्शन-वर्णन का सीधा क्रियापद है; सरल आधुनिक हिन्दी में ‘मैंने देखा’ इसका स्वाभाविक रूप है।
- source_word: ፲፪ ኆኃተ
  choice: बारह द्वार
  rationale: यह शब्द संरचित ब्रह्मांडीय प्रवेश अथवा निकास-स्थानों को सूचित करता है। ‘द्वार’ गरिमापूर्ण, बोधगम्य और स्थापत्यात्मक बिंब के अनुकूल है।
- source_word: ወእልኩ ኆኃው ርኅዋተ
  choice: वे सभी ... खुले थे
  rationale: नवीन पाठ-समीक्षा के अनुसार प्रतिलिखित ኃዋላው को ኆኃው, अर्थात ‘द्वार’, समझना उचित है; इसलिए आशय ‘वे सभी द्वार खुले थे’ है, न कि ‘चारों ओर खुले’। हिन्दी में अनावश्यक पुनरावृत्ति से बचते हुए ‘वे सभी’ रखा गया है।
- source_word: ለኵሎሙ ነፋሳት
  choice: सब हवाओं के लिए
  rationale: तात्कालिक संदर्भ ब्रह्मांडीय मौसम-विज्ञान का है, इसलिए ነፋሳት का अर्थ यहाँ ‘हवाएँ’ है, ‘आत्माएँ’ नहीं।
- source_word: እለ እምኔሆሙ ይወፅኡ ነፋሳት
  choice: उन्हीं में से हवाएँ निकलती हैं
  rationale: यह संबंधवाचक उपवाक्य द्वारों को हवाओं के निकलने के स्थान बताता है। ‘उन्हीं में से’ पूर्ववर्ती बहुवचन द्वारों का स्पष्ट संकेत करता है।
- source_word: ወይነፍሱ ዲበ ምድር
  choice: और पृथ्वी पर बहती हैं
  rationale: यहाँ क्रिया हवाओं की भौतिक गति बताती है। हिन्दी में हवाओं के लिए ‘बहना’ स्वाभाविक है और मौसम-संबंधी अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: क्या ነፋሳት का अनुवाद ‘हवाएँ’ हो या ‘आत्माएँ’
  choice: हवाएँ
  alternative: आत्माएँ
  rationale: यद्यपि मूल शब्द के अर्थ-क्षेत्र में हवा, श्वास और आत्मा आ सकते हैं, इस पद का निकट संदर्भ पृथ्वी के छोरों पर स्थित वायु-द्वारों और उनसे निकलकर पृथ्वी पर बहने वाली हवाओं का है। इसलिए यहाँ भौतिक ‘हवाएँ’ अधिक संगत हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दर्शन-वर्णन के अनुकूल शैली अपनाई गई है। ‘द्वार’ साहित्यिक होते हुए भी सामान्य पाठकों के लिए सहज है। स्रोत-पाठ की संशोधित पहचान के अनुसार ‘चारों ओर’ का भाव शामिल नहीं किया गया।
