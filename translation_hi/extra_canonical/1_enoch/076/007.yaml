base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/007.yaml
  text: And after these winds[a], by the way of the south they go out through two gates; through the first gate, which inclines toward the east[c][b], there comes out a wind of death.
translation:
  language: hi
  text: इन हवाओं के बाद, वे दक्षिण की ओर से दो द्वारों से निकलती हैं। पहले द्वार से, जो पूर्व की ओर झुका हुआ है, मृत्यु की हवा निकलती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምድኅረ እሉ ነፋሳት
  choice: इन हवाओं के बाद
  rationale: यह पदबंध पहले वर्णित हवाओं के बाद आने वाले क्रम को बताता है; ‘इन हवाओं’ से निकट संदर्भ बना रहता है।
- source_word: መንገለ አዜብ
  choice: दक्षिण की दिशा में
  rationale: መንገለ मार्ग, ओर या दिशा सूचित कर सकता है। यहाँ खगोलीय भूगोल में स्वाभाविक हिंदी के लिए ‘दिशा में’ उपयुक्त है।
- source_word: በ፪ኆኅት
  choice: दो द्वारों से होकर
  rationale: ኆኅት किसी खुले मार्ग, झरोखे या द्वार का द्योतक है। नवीनतम व्याकरणिक समीक्षा और ब्रह्मांडीय स्थापत्य के संदर्भ में ‘द्वार’ चुना गया है।
- source_word: በቀዳሚት ኆኅት
  choice: पहले द्वार से
  rationale: स्त्रीलिंग क्रमवाचक पद ኆኅት से मेल खाता है और सीधे ‘पहले द्वार’ का अर्थ देता है।
- source_word: እንተ ታጸንኑ ለመንገለ ምሥራቅ
  choice: जो पूर्व की ओर झुका है
  rationale: एकवचन संबंधवाचक रूप ‘पहले द्वार’ को विशेषित करता है; क्रिया का स्थानिक भाव पूर्व की ओर झुकाव दर्शाता है।
- source_word: ነፋስ ሞት
  choice: मृत्यु की हवा
  rationale: शाब्दिक संबंधसूचक रचना को बनाए रखने से सर्वनाश-संबंधी ब्रह्मांडीय और अशुभ बिंब सुरक्षित रहता है; इसे केवल ‘घातक हवा’ बनाकर सपाट नहीं किया गया।
theological_decisions:
- issue: ነፋስ ሞት को सामान्य विशेषण के रूप में सरल करना या उसके ब्रह्मांडीय बिंब को बनाए रखना
  choice: मृत्यु की हवा
  alternative: घातक हवा
  rationale: पाठ हवाओं को उनके ब्रह्मांडीय कार्य के अनुसार वर्गीकृत करता है। ‘मृत्यु की हवा’ मूल की तीखी और अशुभ संबंधसूचक अभिव्यक्ति को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली। स्त्रीलिंग बहुवचन ‘हवाएँ’ के अनुसार ‘निकलती हैं’ रखा गया है। वाक्य-विन्यास स्रोत के क्रम को यथासंभव बचाते हुए हिंदी में स्वाभाविक बनाया गया है।
