base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/004.yaml
  text: Through four of them come forth winds of blessing and peace[a], and from those eight come forth winds of scourging; when they are sent out, they bring ruin upon all the earth and the water on it, and upon all who dwell on it[c][b], and upon everything that is in the water and on the dry land.
translation:
  language: hi
  text: उनमें से चार के द्वारा[a] आशीष और शांति की हवाएँ निकलती हैं, और उन आठ में से दंडकारी हवाएँ[b] निकलती हैं। जब वे भेजी जाती हैं, तब वे सारी पृथ्वी, उस पर के जल[c], उस पर निवास करने वाले सभी, और जल में तथा सूखी भूमि पर मौजूद हर वस्तु को नष्ट कर देती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध प्रतिलिपि में यहाँ ‘तीन’ (፫) छपा है; किंतु इसे ‘चार’ (፬) का OCR/प्रतिलिपि-दोष माना गया है। अध्याय की आगे की गणना चार हितकारी और आठ विनाशकारी द्वारों—कुल बारह—से मेल खाती है।
    reason: textual_variant
  - marker: b
    text: या ‘प्रहार करनेवाली हवाएँ,’ ‘दंड की हवाएँ,’ अथवा ‘विपत्ति की हवाएँ।’ गीइज़ शब्द विनाशकारी दंड या मार का भाव रखता है।
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक रूप के निकट: ‘और उस पर का जल।’ यह ब्रह्मांड-वर्णन में पृथ्वी से संबद्ध जल की ओर संकेत कर सकता है।'
    reason: cultural_note
lexical_decisions:
- source_word: በ፬እምኔሆሙ (प्रेषित प्रतिलिपि में በ፫እምኔሆሙ)
  choice: उनमें से चार के द्वारा
  rationale: अध्याय की बारह द्वारों वाली गणना चार हितकारी और आठ विनाशकारी मार्गों की ओर संकेत करती है। በ का साधन/मार्गसूचक बल ‘के द्वारा’ से रखा गया है, जबकि आगे के እም को ‘में से’ कहा गया है।
- source_word: ይወፅኡ
  choice: निकलती हैं
  rationale: यह ब्रह्मांडीय द्वारों से हवाओं के बाहर आने का सीधा और स्वाभाविक हिन्दी वर्णन है।
- source_word: ነፋሳት
  choice: हवाएँ
  rationale: इस खंड में शब्द मौसम और ब्रह्मांडीय दिशाओं से जुड़ी शक्तियों को दर्शाता है; ‘आत्माएँ’ कहना संदर्भ को अनावश्यक रूप से व्यक्तिकृत करेगा।
- source_word: በረከት ወሰላም
  choice: आशीष और शांति
  rationale: दोनों संज्ञाओं का धार्मिक और हितकारी स्वर बनाए रखते हुए उन्हें केवल भौतिक समृद्धि तक सीमित नहीं किया गया।
- source_word: እምእልኩ ሰማንቱ
  choice: उन आठ में से
  rationale: संकेतवाचक भाव और आठ की स्पष्ट गणना सुरक्षित रहती है; मूल में अनुपस्थित संज्ञा ‘द्वार’ मुख्य पाठ में नहीं जोड़ी गई।
- source_word: መቅሠፍት
  choice: दंडकारी
  rationale: शब्द विनाशकारी प्रहार या दंड का भाव रखता है। ‘दंडकारी’ न्यायसूचक तीव्रता बचाता है और आधुनिक हिन्दी में सहज है।
- source_word: ሶበ ይትፈነዉ
  choice: जब वे भेजी जाती हैं
  rationale: निष्क्रिय भाव और किसी निहित कर्ता द्वारा हवाओं को छोड़े या भेजे जाने का अर्थ बनाए रखा गया है।
- source_word: ይደመስስዋ
  choice: नष्ट कर देती हैं
  rationale: क्रिया के प्रबल, परिणामसूचक विनाशार्थ को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ለኵላ ምድር ወማይ ዘዲቤሃ
  choice: सारी पृथ्वी, उस पर के जल
  rationale: पृथ्वी और उससे संबद्ध जल की असामान्य ब्रह्मांडीय अभिव्यक्ति को समतल किए बिना निकटता से रखा गया है।
- source_word: ኵሉ እለ የኃድሩ ዲቤሃ
  choice: उस पर रहनेवाले सभी लोगों
  rationale: निवास करने के भाव और पृथ्वी की ओर लौटते सर्वनाम दोनों को स्पष्ट रखा गया है।
- source_word: ኵሉ ዘሀሎ ውስተ ማይ ወዲበ የብስ
  choice: जल में तथा सूखी भूमि पर मौजूद हर वस्तु
  rationale: जल और सूखी भूमि के व्यापक युग्म को बनाए रखता है और विनाश के सर्वव्यापी दायरे को व्यक्त करता है।
theological_decisions:
- issue: ነፋሳት को ‘हवाएँ’ या ‘आत्माएँ’ कहना
  choice: हवाएँ
  alternative: आत्माएँ
  rationale: निकटवर्ती प्रसंग ब्रह्मांडीय द्वारों और दिशाओं से निकलने वाली मौसम-संबंधी शक्तियों का है; ‘आत्माएँ’ मूल चित्र को बदल देगा।
- issue: መቅሠፍት की दंडसूचक तीव्रता
  choice: दंडकारी हवाएँ
  alternative: विपत्ति की हवाएँ; महामारी की हवाएँ; प्रहार करनेवाली हवाएँ
  rationale: यह चयन विनाश और दंड दोनों के तनाव को रखता है, पर किसी विशिष्ट बाद की धर्मसैद्धांतिक धारणा को आरोपित नहीं करता।
- issue: पहली संख्या तीन या चार
  choice: चार
  alternative: तीन
  rationale: उपलब्ध प्रेषित पाठ में ፫ दिखता है, किंतु संस्करणीय/OCR समीक्षा और अध्याय की 4+8 संरचना इसे ፬ का पाठन मानती है। अनिश्चितता को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। ‘के द्वारा’ और ‘में से’ का अंतर मूल के क्रमशः በ और እም को दर्शाता है। असामान्य ब्रह्मांडीय वाक्यांश ‘उस पर के जल’ को पूरी तरह सामान्य बनाकर उसका प्राचीन चित्र नष्ट नहीं किया गया।
