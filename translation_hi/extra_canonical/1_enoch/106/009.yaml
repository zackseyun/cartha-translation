base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/009.yaml
  text: And he answered me and said[a], “Because of a great trouble I have come to you[c][b], and because of a marvelous vision I have drawn near.”
translation:
  language: hi
  text: उसने मुझे उत्तर दिया और कहा, “बड़ी व्याकुलता के कारण मैं तुम्हारे पास आया हूँ[a], और एक अद्भुत दर्शन के कारण मैं निकट आया हूँ[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बड़ी व्याकुलता’ का अनुवाद ‘बड़े संकट’ या ‘बड़ी चिंता’ भी हो सकता है। यहाँ प्रयुक्त गीइज़ शब्द का अर्थ ‘धार्मिकता’ नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘मैं पास आया हूँ।’ यहाँ की क्रिया निकट आने या पास पहुँचने का भाव रखती है और पहले आए ‘तुम्हारे पास आया हूँ’ से अर्थ में कुछ हद तक मिलती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአኒ ወይቤ
  choice: उसने मुझे उत्तर दिया और कहा
  rationale: दोनों क्रियाओं—उत्तर देना और कहना—को बनाए रखता है तथा हिन्दी में संवाद का स्वाभाविक आरम्भ देता है।
- source_word: ጻህቅ ዐቢይ
  choice: बड़ी व्याकुलता
  rationale: यहाँ ጻህቅ को ‘धार्मिकता’ वाले भिन्न मूल ጽድቅ से अलग समझा गया है। इसका भाव व्याकुलता, संकट या तात्कालिक चिंता है; प्रसंग में ‘बड़ी व्याकुलता’ स्वाभाविक और सटीक है।
- source_word: መጻእኩ ኀቤከ
  choice: मैं तुम्हारे पास आया हूँ
  rationale: आने की क्रिया और ‘तुम्हारे पास’ की दिशा दोनों स्पष्ट रूप से व्यक्त होती हैं; पूर्ण वर्तमान वक्ता के वर्तमान आगमन-प्रसंग के अनुकूल है।
- source_word: ራእይ ዐፁብ
  choice: एक अद्भुत दर्शन
  rationale: ራእይ प्रकाशनात्मक दर्शन को सूचित करता है और ዐፁብ विस्मयकारी अथवा असाधारण होने का भाव देता है।
- source_word: ቀረብኩ
  choice: मैं निकट आया हूँ
  rationale: मूल की ‘निकट आने’ वाली दूसरी क्रिया को पहली क्रिया में मिला देने के बजाय अलग रखा गया है।
theological_decisions:
- issue: ጻህቅ की पहचान
  choice: व्याकुलता या संकट का भाव
  alternative: धार्मिकता का कोई बड़ा विषय; कोई महान धर्मी जन
  rationale: पांडुलिपि में ጻህቅ है, न कि ‘धार्मिकता’ के लिए प्रयुक्त ጽድቅ। इसलिए इसे धार्मिकता या किसी ‘धर्मी जन’ से जोड़ना मूलों के भ्रम पर निर्भर होगा और पाठ में अनावश्यक धर्मवैचारिक अर्थ जोड़ देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण संवादात्मक रूप रखा गया है। ‘दर्शन’ जैसे पारलौकिक साहित्य के परिचित शब्द को बनाए रखते हुए कठिन गीइज़ पद ጻህቅ को प्रसंगानुकूल ‘व्याकुलता’ कहा गया है।
