base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/013.yaml
  text: And I[a], Enoch, answered and said to him, “The Lord will do a new thing on the earth; and this I have already seen in a vision, and I have made it known to you[e][d][c][b], because in the generation of Jared my father they transgressed the word of my Lord from the heights of heaven.”
translation:
  language: hi
  text: और मैं, हनोक, ने उत्तर दिया और उससे कहा, “प्रभु पृथ्वी पर कुछ नया करेगा[a]। यह मैं दर्शन में पहले ही देख चुका हूँ, और मैंने तुझे यह बता दिया है, क्योंकि मेरे पिता यारेद की पीढ़ी में उन्होंने स्वर्ग की ऊँचाइयों से आए मेरे प्रभु के वचन का उल्लंघन किया।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘प्रभु नया करेगा’ या ‘प्रभु नया बना देगा’ भी हो सकता है; गीज़ की क्रिया और संज्ञा दोनों ‘नएपन’ का भाव रखती हैं।
    reason: lexical_alternative
  - marker: b
    text: अंतिम पदबंध का अर्थ यह भी हो सकता है कि ‘मेरे प्रभु’ स्वर्ग की ऊँचाइयों से संबद्ध हैं। गीज़ वाक्य-विन्यास कठिन है; ‘स्वर्ग की ऊँचाइयों से’ का संबंध ‘वचन’ या ‘मेरे प्रभु’—दोनों में से किसी से हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: አውሣእኩ … ወእቤሎ
  choice: मैंने … उत्तर दिया और उससे कहा
  rationale: गीज़ की दोहरी संवाद-भूमिका को औपचारिक किंतु स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ይኄድስ … ኀዳሳተ
  choice: कुछ नया करेगा
  rationale: क्रिया और संज्ञा दोनों में निहित ‘नयापन’ बनाए रखता है और अनिश्चित रूप से किसी निर्णायक नए कार्य की ओर संकेत करता है; केवल पृथ्वी के नवीकरण का अर्थ आरोपित नहीं करता।
- source_word: ዲበ ምድር
  choice: पृथ्वी पर
  rationale: स्थानवाचक पदबंध का सहज आधुनिक हिन्दी रूप।
- source_word: ወዳእኩ ርኢኩ በራእይ
  choice: यह मैं दर्शन में पहले ही देख चुका हूँ
  rationale: पूर्वदर्शन और वर्तमान कथन के लिए उसकी प्रासंगिकता दोनों व्यक्त करता है।
- source_word: ወአይዳዕኩከ
  choice: मैंने तुझे बता दिया है
  rationale: कारक अर्थ ‘ज्ञात कराया’ को साधारण पाठक के लिए स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: በትውልዱ ለአያሬድ አቡየ
  choice: मेरे पिता यारेद की पीढ़ी में
  rationale: वंशावली और कालगत संदर्भ को बनाए रखता है; አያሬድ का लिप्यंतरण ‘यारेद’ किया गया है।
- source_word: አኅለፉ
  choice: उल्लंघन किया
  rationale: शाब्दिक रूप से सीमा पार करने वाली क्रिया यहाँ ‘वचन’ के विरुद्ध अपराध या अतिक्रमण का भाव रखती है।
- source_word: ነገረ ለእግዚእየ
  choice: मेरे प्रभु के वचन
  rationale: ‘वचन’ स्रोत पद की व्यापकता बचाता है और इसे किसी एक विशिष्ट आज्ञा तक सीमित नहीं करता।
- source_word: እመልዕልተ ሰማይ
  choice: स्वर्ग की ऊँचाइयों से आए
  rationale: मुख्य पाठ में इस कठिन स्थानवाचक पदबंध को ‘वचन’ से जोड़ा गया है और ऊर्ध्व apocalyptic बिंब को स्वाभाविक हिन्दी में रखा गया है; दूसरी सम्भावना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: पृथ्वी पर प्रभु के भावी कार्य का स्वरूप
  choice: ‘प्रभु पृथ्वी पर कुछ नया करेगा’
  alternative: ‘प्रभु पृथ्वी को नया करेगा’ अथवा ‘प्रभु पृथ्वी पर नई वस्तुएँ बनाएगा’
  rationale: गीज़ पाठ नयापन या नवीकरण व्यक्त करता है, पर इस पद में पूर्ण ब्रह्मांडीय नवीकरण निश्चित नहीं करता; चुना गया रूप इस खुलेपन को बनाए रखता है।
- issue: यारेद की पीढ़ी के अपराध का अर्थ
  choice: ‘मेरे प्रभु के वचन का उल्लंघन किया’
  alternative: ‘मेरे प्रभु की आज्ञा का उल्लंघन किया’
  rationale: संदर्भ आदिम विद्रोह की ओर संकेत कर सकता है, पर पद स्वयं व्यापक ‘वचन’ कहता है; अनुवाद अपराध को स्रोत से अधिक विशिष्ट नहीं बनाता।
- issue: ‘स्वर्ग की ऊँचाइयों से’ का व्याकरणिक संबंध
  choice: इसे मुख्य पाठ में ‘वचन’ से जोड़ा गया है
  alternative: इसे ‘मेरे प्रभु’ से जोड़ना
  rationale: गीज़ वाक्य-विन्यास कठिन है और दोनों संबंध सम्भव हैं; मुख्य पाठ को पठनीय रखते हुए वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘तुझे’ प्राचीन संवाद की आत्मीय एकवचन संबोधन-शैली को बचाता है; शब्दावली सरल रखी गई है। सभी वास्तविक पाठगत विकल्प पादटिप्पणियों में दिए गए हैं।
