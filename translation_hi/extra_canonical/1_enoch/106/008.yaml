base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/008.yaml
  text: And when Methuselah heard the words of his son[a], he came to me at the ends of the earth, because he had heard that I was there. And he cried out, and I heard his voice, and I came to him and said to him, “Behold, I am here, my son. Why have you come to me?”
translation:
  language: hi
  text: जब मतूशेलह ने अपने पुत्र की बात सुनी, तब वह पृथ्वी के छोरों पर मेरे पास आया, क्योंकि उसने सुना था कि मैं वहाँ था। उसने पुकारा, और मैंने उसकी आवाज़ सुनी। तब मैं उसके पास आया और उससे कहा, “देख, मेरे पुत्र, मैं यहाँ हूँ। तू मेरे पास क्यों आया है?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीइज़ में अंतिम उपवाक्य का शाब्दिक रूप लगभग “क्योंकि/इसलिए कि तू मेरे पास आया है” है, जो यहाँ पाठगत रूप से असहज है। प्रसंग के आधार पर इसे आगमन का कारण पूछने वाला प्रश्न समझा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ነገረ ወልዱ
  choice: अपने पुत्र की बात
  rationale: ነገር का अर्थ ‘बात’, ‘वचन’ या ‘संदेश’ हो सकता है। एकवचन ‘बात’ यहाँ स्वाभाविक हिन्दी है और मूल की अर्थ-व्याप्ति को अनावश्यक रूप से सीमित नहीं करती।
- source_word: ውስተ አጽናፈ ምድር
  choice: पृथ्वी के छोरों पर
  rationale: यह रूप मूल के प्रलय-दर्शी, विश्व-भौगोलिक बिंब को बनाए रखता है; इसे केवल ‘बहुत दूर’ कहकर सपाट नहीं किया गया।
- source_word: እስመ ሰምዐ ከመ ህየ ሀለውኩ
  choice: क्योंकि उसने सुना था कि मैं वहाँ हूँ
  rationale: ህየ स्थानसूचक ‘वहाँ’ है और ሀለውኩ उपस्थिति व्यक्त करता है। ‘सुना था’ यात्रा से पहले मिली सूचना को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: ጸርኀ
  choice: पुकारा
  rationale: क्रिया ऊँची आवाज़ से पुकारने का भाव रखती है। ‘पुकारा’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ቃሎ
  choice: उसकी आवाज़
  rationale: पुकारने और सुनने के इस प्रसंग में ‘आवाज़’ सामान्य ‘वचन’ की अपेक्षा अधिक उपयुक्त अर्थ है।
- source_word: ናሁ ሀለውኩ
  choice: देख, ... मैं यहाँ हूँ
  rationale: ናሁ ध्यान आकर्षित करने वाला उद्गार है। ‘देख’ मूल के प्रत्यक्ष संबोधन को वर्तमान, बोधगम्य हिन्दी में बनाए रखता है।
- source_word: ወልድየ
  choice: मेरे पुत्र
  rationale: सीधे संबोधन में पारिवारिक संबंध और कथन की गरिमा दोनों सुरक्षित रहते हैं।
- source_word: እስመ መጻእከ ኀቤየ
  choice: तू मेरे पास क्यों आया है?
  rationale: प्राप्त गीइज़ पाठ में እስመ सामान्यतः ‘क्योंकि/इसलिए कि’ है, जिससे शाब्दिक वाक्य असहज बनता है। प्रसंग में इसे आगमन का कारण पूछने वाला प्रश्न समझना सर्वाधिक संगत है; पाठगत कठिनाई पादटिप्पणी में स्पष्ट की गई है।
theological_decisions:
- issue: हनोक का विश्व-सीमांत स्थान
  choice: पृथ्वी के छोरों पर
  alternative: किसी दूरस्थ स्थान में
  rationale: मूल का विश्वात्मक और प्रलय-दर्शी बिंब संरक्षित रखा गया है। स्थान को सामान्य दूरी में बदलने या किसी विशिष्ट धर्मवैज्ञानिक भूगोल से जोड़ने से बचा गया है।
- issue: अंतिम वाक्य की पाठगत कठिनाई
  choice: कारण पूछने वाला प्रश्न
  alternative: क्योंकि तू मेरे पास आया है
  rationale: कथोपकथन के प्रवाह में प्रश्न अर्थपूर्ण है, पर मूल की असहजता को छिपाया नहीं गया; पादटिप्पणी शाब्दिक विकल्प बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। पारिवारिक संबोधन में ‘तू’ निकटता और प्राचीन प्रत्यक्ष-वाणी के स्वर को रखता है; यह अपमानसूचक नहीं है। छोटे वाक्यों से घटनाक्रम स्पष्ट रखा गया है, जबकि ‘पृथ्वी के छोरों’ जैसे प्रलय-दर्शी बिंब को सुरक्षित रखा गया है।
