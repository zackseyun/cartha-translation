base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/001.yaml
  text: And after some days my son Methuselah took a wife for his son Lamech[a], and she conceived by him and bore a son.
translation:
  language: hi
  text: और कुछ समय बाद[a] मेरे पुत्र मतूशेलह ने अपने पुत्र लेमेक के लिए एक पत्नी ली। वह उससे गर्भवती हुई और उसने एक पुत्र को जन्म दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘कुछ दिनों बाद’; इस अभिव्यक्ति का अधिक व्यापक अर्थ ‘कुछ समय बाद’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረ መዋዕል
  choice: कुछ समय बाद
  rationale: यह सामान्य काल-सूचक अभिव्यक्ति बीते हुए अनिश्चित समय को दर्शाती है। शाब्दिक ‘कुछ दिनों बाद’ भी संभव है, पर ‘कुछ समय बाद’ आधुनिक हिन्दी में स्वाभाविक है और अवधि को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ነሥአ
  choice: ली
  rationale: विवाह-संबंधी इस रचना में क्रिया का अर्थ पत्नी लेना या विवाह की व्यवस्था करना है। वाक्य-विन्यास में मतूशेलह कर्ता और लेमेक वह पुत्र है जिसके लिए पत्नी ली गई।
- source_word: ብእሲተ
  choice: एक पत्नी
  rationale: संज्ञा का सामान्य अर्थ ‘स्त्री’ हो सकता है, किन्तु ‘अपने पुत्र के लिए ... ली’ की वैवाहिक रचना में ‘पत्नी’ स्वाभाविक अर्थ है।
- source_word: ወፀንሰት
  choice: वह ... गर्भवती हुई
  rationale: यह आधुनिक हिन्दी में स्पष्ट, सहज और गरिमापूर्ण है।
- source_word: እምኔሁ
  choice: उससे
  rationale: यह लेमेक को गर्भधारण का पिता बताता है और गीइज़ के संबंधसूचक पद का संक्षिप्त, स्वाभाविक हिन्दी रूप है।
- source_word: ወወለደት ወልደ
  choice: और उसने एक पुत्र को जन्म दिया
  rationale: यह मूल कथन का सीधा अर्थ है तथा आधुनिक हिन्दी में ‘पुत्र जना’ की अपेक्षा अधिक स्वाभाविक है।
theological_decisions:
- issue: आरंभिक वाक्य में वंशावली और विवाह की कर्तृता
  choice: मतूशेलह ने अपने पुत्र लेमेक के लिए एक पत्नी ली
  alternative: मतूशेलह के पुत्र लेमेक ने एक पत्नी ली; अथवा मतूशेलह ने लेमेक के लिए एक स्त्री प्राप्त की
  rationale: गीइज़ वाक्य-विन्यास में सबसे स्वाभाविक रूप से मतूशेलह कर्ता है और ‘अपने पुत्र लेमेक के लिए’ अप्रत्यक्ष संबंध बताता है। यह पारिवारिक विवाह-व्यवस्था के सामान्य अर्थ को सुरक्षित रखता है, बिना किसी बाद की व्याख्यात्मक परंपरा को पाठ में जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। संबंधों की स्पष्टता के लिए दो वाक्य किए गए हैं; मूल की अनिश्चित काल-अवधि को पाद-टिप्पणी सहित सुरक्षित रखा गया है।
