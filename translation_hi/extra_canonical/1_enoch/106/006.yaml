base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/006.yaml
  text: And it seems to me that he is not from me, but from the angels; and I fear that a wonder might be done in his days upon the earth.
translation:
  language: hi
  text: और मुझे लगता है कि वह मुझसे नहीं, बल्कि स्वर्गदूतों से है; और मुझे डर है कि उसके दिनों में पृथ्वी पर कोई विलक्षण घटना[a] घट जाए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कोई अद्भुत घटना” अथवा “कोई अचरज।” गीइज़ शब्द किसी असाधारण, विस्मयकारी या विचित्र घटना को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इसे भूतकाल में भी अनूदित किया गया है: “और मुझे लगा कि वह मुझसे नहीं, बल्कि स्वर्गदूतों से था; और मैं डर गया।” यहाँ वर्तमानकाल को प्रत्यक्ष भाषण और गीइज़ के क्रियारूपों के कारण अपनाया गया है।'
    reason: tense_alternative
lexical_decisions:
- source_word: ይመስለኒ
  choice: मुझे लगता है
  rationale: प्रत्यक्ष कथन में वर्तमान अनुभूति को व्यक्त करता है और लमेकी के अनुमान को निश्चित तथ्य नहीं बनाता।
- source_word: አኮኑ … እምኔየ
  choice: वह मुझसे नहीं … है
  rationale: नकारात्मक वर्तमान कथन और उत्पत्ति/पितृत्व के भाव को स्पष्ट तथा स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: እመላእክት
  choice: स्वर्गदूतों से
  rationale: मानवीय और स्वर्गदूतीय उत्पत्ति के बीच मूल पाठ के चौंकाने वाले विरोध को बिना नरम किए सुरक्षित रखता है।
- source_word: እፈረሀ
  choice: मुझे डर है
  rationale: प्रत्यक्ष भाषण में चल रहे वर्तमान भय को व्यक्त करता है; इसे बीती हुई प्रतिक्रिया नहीं बनाता।
- source_word: ኢይትገበር
  choice: घट जाए
  rationale: मूल के निषेधयुक्त आशंकासूचक भाव को स्वाभाविक हिन्दी में रखता है और घटना को निश्चित भविष्यवाणी नहीं बनाता।
- source_word: መንክር
  choice: विलक्षण घटना
  rationale: असाधारण और संभवतः विस्मयकारी या अनिष्टसूचक घटना का व्यापक अर्थ रखता है; ‘चमत्कार’ से जुड़ा अनिवार्य सकारात्मक या दैवी भाव आरोपित नहीं करता।
- source_word: በመዋዕሊሁ
  choice: उसके दिनों में
  rationale: बालक से जुड़े काल-संबंध को मूल की ऊँची शैली सहित बनाए रखता है।
- source_word: ዲበ ምድር
  choice: पृथ्वी पर
  rationale: इस विश्वव्यापी, अपोकैलिप्टिक प्रसंग में ‘देश में’ की अपेक्षा अधिक उपयुक्त है।
theological_decisions:
- issue: बालक की उत्पत्ति के विषय में लमेकी की आशंका
  choice: स्वर्गदूतीय उत्पत्ति को लमेकी की वर्तमान, भयभीत धारणा के रूप में प्रस्तुत किया गया है।
  alternative: इसे कथावाचक द्वारा प्रमाणित स्वर्गदूतीय जन्म या केवल अतिशयोक्तिपूर्ण प्रतिक्रिया माना जा सकता है।
  rationale: ‘मुझे लगता है’ कथन को व्यक्तिपरक रखता है; इस प्रकार पाठ का धर्मवैचारिक तनाव बना रहता है और लमेकी की आशंका को सिद्ध तथ्य नहीं बनाया जाता।
- issue: पृथ्वी पर होने वाली विलक्षण घटना की निश्चितता
  choice: ‘घट जाए’ द्वारा आशंका और अनिश्चितता बनाए रखी गई है।
  alternative: ‘घटेगी’ इसे निश्चित भविष्यवाणी के रूप में प्रस्तुत कर सकता है।
  rationale: भय व्यक्त करने वाले प्रसंग और मूल क्रियारूप के संभाव्य/आशंकासूचक बल को ध्यान में रखते हुए निश्चितता आरोपित नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘स्वर्गदूतों से’ मूल की असहज धर्मवैचारिक धार को सुरक्षित रखता है, जबकि ‘विलक्षण घटना’ असाधारणता व्यक्त करता है और ‘चमत्कार’ के संभावित संप्रदायगत या अनिवार्यतः सकारात्मक अर्थ से बचता है।
