base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/004.yaml
  text: And Lamech his father was afraid of him[b][a], and he fled and came to his father Methuselah.
translation:
  language: hi
  text: और लेमेक, उसका पिता, उससे डर गया[b][a] और भागकर अपने पिता मतूशेलह के पास आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसका’ और ‘उससे’ का संकेत पिछले प्रसंग में वर्णित नवजात बालक की ओर होना सबसे स्वाभाविक है।
    reason: सर्वनामों के संदर्भ को स्पष्ट करना, बिना मुख्य पाठ में स्रोत से अधिक विशिष्टता जोड़ने के।
  - marker: b
    text: या, ‘और लेमेक उससे डर गया।’
    reason: पूर्व अनुवाद का विकल्प; यह पहले ‘उसका पिता’ वाले अपपोज़िशन को छोड़ देने वाली संक्षिप्त प्रस्तुति को दर्शाता है।
lexical_decisions:
- source_word: ፈረሀ
  choice: डर गया
  rationale: क्रिया भयभीत होने की तत्काल प्रतिक्रिया व्यक्त करती है; ‘डर गया’ आधुनिक हिन्दी में स्वाभाविक है और कोई अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: እምኔሁ
  choice: उससे
  rationale: यह रूप भय के व्यक्तिगत कारण अथवा विषय को सूचित करता है। ‘उससे’ स्रोत के संक्षिप्त सर्वनाम को बनाए रखता है।
- source_word: ጐየ
  choice: भागकर
  rationale: क्रिया भय के कारण शीघ्र चले जाने का भाव देती है; ‘भागकर’ अगले आगमन-वाचक खंड से स्वाभाविक रूप से जुड़ती है।
- source_word: መጽአ ኀበ
  choice: के पास आया
  rationale: गति और दिशा के इस संयोजन का स्वाभाविक हिन्दी रूप ‘के पास आया’ है, जो मतूशेलह तक पहुँचने को व्यक्त करता है।
- source_word: አቡሁ
  choice: उसका पिता / अपने पिता
  rationale: 'स्रोत में यह संबंधसूचक पद दो बार है: पहली बार लेमेक को बालक का पिता बताता है और दूसरी बार मतूशेलह को लेमेक का पिता। हिन्दी में क्रमशः ‘उसका पिता’ और ‘अपने पिता’ इन दोनों संबंधों को स्पष्ट और स्वाभाविक रखते हैं।'
- source_word: ማቱሳላ
  choice: मतूशेलह
  rationale: यह नाम का प्रचलित हिन्दी बाइबलीय रूप है और गीइज़ नाम के अभिप्रेत व्यक्ति को सुरक्षित रखता है।
theological_decisions:
- issue: लेमेक के भय से जुड़े सर्वनाम का संदर्भ
  choice: मुख्य पाठ में ‘उससे’ रखकर सर्वनाम बनाए रखा गया; पादटिप्पणी में निकटवर्ती संदर्भ के आधार पर नवजात बालक को संभावित संदर्भ बताया गया है।
  alternative: मुख्य पाठ में सीधे ‘उस बालक से’ कहना।
  rationale: स्रोत केवल सर्वनाम देता है। निकटवर्ती प्रसंग नवजात बालक की ओर दृढ़ता से संकेत करता है, पर मुख्य पाठ में संज्ञा जोड़ना स्रोत की संक्षिप्तता और सीमित अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। दोनों ‘पिता’ संबंधों को सुरक्षित रखा गया है और वाक्य को अनावश्यक धार्मिक पारिभाषिकता से मुक्त रखा गया है।
