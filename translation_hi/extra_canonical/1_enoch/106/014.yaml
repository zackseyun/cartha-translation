base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/014.yaml
  text: And they will commit sin[a], and they will transgress the ordinance; and they will join themselves with women and commit sin with them, and they will take wives from among them[c][b], and they will beget children.
translation:
  language: hi
  text: और वे पाप करेंगे और ठहराई हुई व्यवस्था का उल्लंघन करेंगे; वे स्त्रियों से जुड़ जाएँगे[a] और उनके साथ पाप करेंगे, और उन्हीं में से स्त्रियों को अपनी पत्नियाँ बना लेंगे, और संतान उत्पन्न करेंगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जुड़ जाएँगे” का मूल शब्द सामान्यतः जुड़ने या एक होने को व्यक्त करता है। इस संदर्भ में यह अनुचित संबंध की ओर संकेत करता है, पर अपने-आप में स्पष्ट यौन क्रिया नहीं है।
    reason: lexical_alternative
  - marker: b
    text: प्रस्तुत गीइज़ प्रतिलिपि के अंतिम शब्द दोषपूर्ण प्रतीत होते हैं। Charles के 1906 मुद्रित पाठ के सत्यापित पठन में यहाँ “और संतान उत्पन्न करेंगे” है।
    reason: textual_variant
lexical_decisions:
- source_word: ይገብሩ፡ ኀጢአተ
  choice: पाप करेंगे
  rationale: क्रिया और ‘पाप’ के कर्म का यह स्वाभाविक हिन्दी मुहावरा है; दोनों आवृत्तियों में इसे समान रखा गया है।
- source_word: የኀልፉ፡ ሥርዐተ
  choice: ठहराई हुई व्यवस्था का उल्लंघन करेंगे
  rationale: यह कानूनी अथवा नैतिक रूप से स्थापित विधान या क्रम को तोड़ने का भाव देता है; ‘मूसा की व्यवस्था’ जैसा अनावश्यक विशिष्टीकरण नहीं जोड़ा गया।
- source_word: ተደመሩ
  choice: जुड़ जाएँगे
  rationale: मूल क्रिया जुड़ने या एक होने का व्यापक अर्थ रखती है। संदर्भ अनुचित संबंध का संकेत देता है, पर अनुवाद क्रिया को मूल से अधिक यौन-स्पष्ट नहीं बनाता।
- source_word: አንስት
  choice: स्त्रियों
  rationale: यह सामान्य सामूहिक संज्ञा है; पहली बार इसे ‘पत्नियाँ’ कहना मूल से अधिक वैवाहिक विशिष्टता जोड़ देता।
- source_word: አውሰቡ
  choice: अपनी पत्नियाँ बना लेंगे
  rationale: इस संदर्भ में क्रिया का अर्थ विवाह करना या पत्नी ग्रहण करना है; ‘अलग हो जाएँगे’ अर्थगत रूप से उचित नहीं है।
- source_word: ወይወልዱ፡ ውሉደ
  choice: और संतान उत्पन्न करेंगे
  rationale: Charles 1906 के वास्तविक पाठ की अंतिम पंक्ति का अर्थ संतान उत्पन्न करना है; ‘बच्चे जनेंगे’ की अपेक्षा यह हिन्दी में पुरुष कर्ता के साथ अधिक स्वाभाविक है।
theological_decisions:
- issue: स्त्रियों के साथ अपराधपूर्ण संबंध का स्वरूप
  choice: ‘स्त्रियों से जुड़ जाएँगे’ कहा गया और उसके पापपूर्ण स्वरूप को अगले वाक्यांश में रहने दिया गया।
  alternative: इसे सीधे ‘यौन-संबंध बनाएँगे’ या केवल ‘विवाह करेंगे’ कहना।
  rationale: मूल में जुड़ने की व्यापक क्रिया है, जबकि संदर्भ इस संबंध को पापपूर्ण बताता है। अनुवाद दोनों बातों को बनाए रखता है और अनावश्यक स्पष्टता नहीं जोड़ता।
- issue: अंतिम कठिन पाठ
  choice: मुद्रित Charles 1906 पाठ के सत्यापित पठन के अनुसार पत्नी ग्रहण करने और संतान उत्पन्न करने का अर्थ दिया गया।
  alternative: दी गई प्रतिलिपि के दृश्य-पहचान दोष को अक्षरशः लेकर ‘उनमें से और उनमें से’ कहना।
  rationale: नवीन स्रोत-जाँच के अनुसार प्रतिलिपि का अंतिम अंश OCR/लिप्यंतरण-दोष है। वास्तविक मुद्रित गीइज़ पाठ स्पष्ट रूप से पत्नी ग्रहण करने और संतान उत्पन्न करने की बात करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। ‘ठहराई हुई व्यवस्था’ से स्थापित विधान का भाव सुरक्षित रखा गया है, पर किसी विशिष्ट धार्मिक संहिता का नाम नहीं जोड़ा गया।
