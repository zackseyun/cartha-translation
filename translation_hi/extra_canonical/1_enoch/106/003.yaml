base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/003.yaml
  text: And at that time[a], he rose from the hands of the midwife[b], and he opened his mouth and spoke to the Lord of righteousness.
translation:
  language: hi
  text: और उसी समय वह दाई के हाथों से उठा[a]; उसने अपना मुँह खोला और धार्मिकता के प्रभु से बोला[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘उसके हाथों से’; प्रसंग उस स्त्री को प्रसव में सहायता करने वाली दाई के रूप में पहचानता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘न्याय के प्रभु से।’ गीइज़ संज्ञा नैतिक धार्मिकता और न्यायिक न्याय—दोनों का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሶቤሃ
  choice: और उसी समय
  rationale: यह कालसूचक कथात्मक संयोजक है। ‘उसी समय’ प्रसंग के प्रवाह और घटना की तात्कालिकता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ተንሥአ
  choice: उठा
  rationale: क्रिया उठने का बोध कराती है। ‘उठा’ नवजात के असाधारण कार्य की सजीवता बनाए रखता है, पर उसकी मुद्रा के विषय में अनावश्यक रूप से ‘खड़ा हुआ’ नहीं जोड़ता।
- source_word: እምእዴሃ ለመውለዲት
  choice: दाई के हाथों से
  rationale: እምእዴሃ का शाब्दिक अर्थ ‘उसके हाथों से’ है, और ለመውለዲት उस स्त्री को प्रसव में सहायता करने वाली दाई के रूप में पहचानता है। हिन्दी में संज्ञा स्पष्ट करना अधिक स्वाभाविक है।
- source_word: ወከሠተ አፉሁ
  choice: उसने अपना मुँह खोला
  rationale: मूल की सक्रिय क्रियाशृंखला और वाणी आरम्भ करने के सजीव वर्णन को सीधे ढंग से व्यक्त करता है।
- source_word: ተወተናገረ
  choice: बोला
  rationale: सरल वाणी-सूचक क्रिया के लिए ‘बोला’ सहज, सीधा और कथात्मक हिन्दी प्रयोग है।
- source_word: ለእግዚአ ጽድቅ
  choice: धार्मिकता के प्रभु से
  rationale: እግዚአ के धार्मिक संबोधन को ‘प्रभु’ और ጽድቅ के नैतिक-धर्मवैचारिक अर्थ को ‘धार्मिकता’ से व्यक्त किया गया है। ‘से’ बोलने के संबोधित पात्र को स्वाभाविक हिन्दी में दर्शाता है।
theological_decisions:
- issue: ईश्वरीय उपाधि में ጽድቅ का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: मूल शब्द में नैतिक धार्मिकता और न्यायिक न्याय—दोनों अर्थ संभव हैं। इस हनोक-संबंधी संदर्भ में ‘धार्मिकता’ व्यापक नैतिक-धर्मवैचारिक अर्थ को बनाए रखती है, जबकि ‘न्याय’ एक वैध वैकल्पिक अर्थ है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली रखी गई है। नवजात के उठने की असाधारण छवि को बिना व्याख्यात्मक विस्तार के ज्यों का त्यों बनाए रखा गया है; विवाद्य ጽድቅ का वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
