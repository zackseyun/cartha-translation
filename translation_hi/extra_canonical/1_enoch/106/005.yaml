base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/005.yaml
  text: And he said to him[a], “I have begotten a strange son, and he is not like a human being; rather, he is like the children of the angels of heaven. And his nature is different, and he is not like us; and his eyes are like the rays of the sun[c][b], and his face is glorious.”
translation:
  language: hi
  text: और उसने उससे कहा, “मेरे यहाँ एक विलक्षण पुत्र हुआ है[a]। वह मनुष्य के समान नहीं है, बल्कि स्वर्गीय दूतों की संतानों के समान है[b]। उसकी प्रकृति भिन्न है और वह हमारे समान नहीं है। उसकी आँखें सूर्य की किरणों के समान हैं[c], और उसका मुख तेजस्वी है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक अनोखा पुत्र।” मूल शब्द इस बात पर बल देता है कि बच्चा सामान्य से अत्यंत भिन्न है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “स्वर्गीय दूतों की संतानें।” यह लामेक की चौंकाने वाली तुलना को केवल “स्वर्गदूतों जैसा” कहकर हल्का नहीं करता।
    reason: lexical_alternative
  - marker: c
    text: यह वाक्य आँखों की तुलना सूर्य से निकलने वाले प्रकाश से करता है; “सूर्य-रश्मियों के समान” भी सम्भव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወለድኩ
  choice: मैंने … पुत्र उत्पन्न किया है
  rationale: प्रथम पुरुष की क्रिया लामेक के पितृत्व के दावे को बनाए रखती है। ‘जन्म दिया’ आधुनिक हिन्दी में प्रायः माता के लिए समझा जाता है, इसलिए यहाँ ‘उत्पन्न किया’ अधिक उपयुक्त है।
- source_word: ውሉጠ
  choice: विलक्षण
  rationale: यह शब्द बच्चे के सामान्य से markedly भिन्न होने का भाव रखता है। ‘विलक्षण’ विस्मय और असामान्यता दोनों को व्यक्त करता है, पर यह तय नहीं करता कि भिन्नता शुभ है या भयावह।
- source_word: አኮኑ ከመ ሰብእ
  choice: वह मनुष्य के समान नहीं है
  rationale: यहाँ तुलना सामान्य मानवता से है; ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक और व्यापक अर्थ देता है।
- source_word: ወይመ ስል
  choice: बल्कि
  rationale: यह पहले कथन के बाद आने वाली प्रबल विरोधात्मक तुलना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ደቂቀ መላእክተ ሰማይ
  choice: स्वर्ग के दूतों की संतानों
  rationale: मूल के पारिवारिक/वंशगत रूपक को केवल ‘स्वर्गदूतों जैसा’ कहकर हल्का नहीं किया गया है।
- source_word: ፍጥረቱ ካልእት
  choice: उसकी प्रकृति भिन्न है
  rationale: ‘प्रकृति’ बच्चे के रूप, गठन या अस्तित्वगत प्रकार की अर्थ-सीमा को खुला रखती है, और ‘भिन्न’ मूल के अन्यत्व को स्पष्ट करता है।
- source_word: አዕይንቲሁ ከመ አገሪሁ ለፀሐይ
  choice: उसकी आँखें सूर्य की किरणों के समान हैं
  rationale: यह सूर्य से निकलने वाले प्रकाश की प्रत्यक्ष तुलना और मूल की प्रलय-साहित्यिक छवि को बनाए रखता है।
- source_word: ገጹ ስቡሕ
  choice: उसका मुख महिमामय है
  rationale: ‘महिमामय’ दृश्य वैभव और गौरव—दोनों संभावनाओं को खुला रखते हुए ऊँची शैली बनाए रखता है।
theological_decisions:
- issue: क्या ‘स्वर्ग के दूतों की संतानों’ को केवल दूतों जैसी आकृति के अर्थ में सरल कर दिया जाए
  choice: मुख्य पाठ में पारिवारिक अभिव्यक्ति ‘स्वर्ग के दूतों की संतानों’ को बनाए रखा गया
  alternative: स्वर्गदूतों के समान
  rationale: गीज़ पाठ स्पष्टतः संतान-संबंधी पद का प्रयोग करता है। इसे केवल रूप-साम्य बना देने से लामेक की आशंका और कथा का धार्मिक तनाव कम हो जाता।
- issue: क्या ሰብእ का अनुवाद लिंग-विशेष सूचक रूप में किया जाए
  choice: मनुष्य
  alternative: पुरुष
  rationale: विरोध किसी पुरुष-विशेष से नहीं, बल्कि सामान्य मानवता से है; इसलिए ‘मनुष्य’ अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है, पर प्राचीन प्रलय-साहित्य के गरिमापूर्ण और विस्मयकारी स्वर को बनाए रखा गया है। वाक्यों को हिन्दी में सहज पठनीय बनाने के लिए विभाजित किया गया, जबकि मूल की क्रमिक तुलनाएँ और धार्मिक अस्पष्टता सुरक्षित रखी गई हैं।
