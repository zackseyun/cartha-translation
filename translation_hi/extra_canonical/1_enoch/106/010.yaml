base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/010.yaml
  text: 'And now[a], my father, hear me: a son has been born to Lamech my son, and his appearance and form are not like the form of a human being. His color is whiter than snow and redder than the blossom of a rose, and the hair of his head is whiter than white wool. And his eyes are like the rays of the sun[c][b]; and he opened his eyes and lit up the whole house.'
translation:
  language: hi
  text: 'और अब, मेरे पिता, मेरी बात सुनिए: मेरे पुत्र लामेक का एक पुत्र जन्मा है, और उसका रूप और बनावट मनुष्य के रूप और बनावट जैसे नहीं हैं।[c] उसका रंग बर्फ से अधिक सफेद और गुलाब के फूल से अधिक लाल है,[a] और उसके सिर के बाल सफेद ऊन से भी अधिक सफेद हैं। उसकी आँखें सूर्य की किरणों जैसी हैं;[b] और उसने अपनी आँखें खोलीं और पूरे घर को प्रकाश से भर दिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘गुलाब के फूल’ के लिए प्रयुक्त शब्द अधिक सामान्य रूप से किसी लाल फूल को भी सूचित कर सकता है; फूल की ठीक प्रजाति निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘सूर्य की किरणों जैसी’ अनुवादित गीज़ वाक्यांश कठिन है; इतना स्पष्ट है कि आशय सूर्य जैसी तेज चमक से है।
    reason: lexical_alternative
  - marker: c
    text: 'या: ‘और वह अपने रूप और अपनी बनावट में मनुष्य जैसा नहीं है।’'
    reason: previous_rendering
