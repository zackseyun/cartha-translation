  terminology: ‘रूप’, ‘बनावट’, ‘रंग’, ‘सफेद ऊन’, and ‘सूर्य की किरणें’ are suitable modern-Hindi renderings. The lexical uncertainty concerning the flower and the difficult solar phrase is appropriately retained in footnotes.
