  choice: पूरे घर को प्रकाश से भर दिया
  rationale: घर के प्रकाशित हो जाने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और शिशु की आँखों से निकली असाधारण चमक का प्रभाव बनाए रखता है।
theological_decisions:
- issue: बालक का साधारण मानवता से भिन्न होना कितनी दृढ़ता से कहा जाए
  choice: उसका रूप और उसकी बनावट मनुष्य की बनावट जैसी नहीं है
  alternative: वह अपने रूप और अपनी बनावट में मनुष्य जैसा नहीं है
  rationale: मूल पाठ नवजात नूह के रूप और गठन को विस्मयकारी रूप से भिन्न बताता है, पर यह दृश्य वर्णन है, उसके गैर-मानवीय तत्त्व की स्पष्ट तात्त्विक घोषणा नहीं। चुना हुआ पाठ इस तनाव को बनाए रखता है।
