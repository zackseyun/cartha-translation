  yaml_path: translation/extra_canonical/1_enoch/106/011.yaml
  text: And he rose up in the hands of the midwife[a], and he opened his mouth and blessed the Lord of heaven.
translation:
  language: hi
  text: और वह दाई[a] के हाथों में उठ खड़ा हुआ; उसने अपना मुँह खोला और स्वर्ग के प्रभु को धन्य कहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: जिस शब्द का अनुवाद यहाँ “दाई” किया गया है, उसका शाब्दिक अर्थ लगभग “जन्म कराने/जनने वाली स्त्री” है; इस जन्म-दृश्य में इससे सबसे स्वाभाविक रूप से वह सहायिका समझी जाती है जो बच्चे को अपने हाथों में थामे हुए थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: ተንሥአ
  choice: उठ खड़ा हुआ
  rationale: क्रिया उठने या खड़े होने का भाव देती है। नवजात नूह के प्रसंग में यह अनोखी और चमत्कारपूर्ण क्रिया को स्पष्ट तथा सजीव रखती है।
- source_word: ውስተ እዴሃ
  choice: के हाथों में
  rationale: मूल वाक्यांश का अर्थ ‘उसके हाथों के भीतर/में’ है; हिन्दी में ‘के हाथों में’ स्वाभाविक रूप से उसी शारीरिक स्थिति को व्यक्त करता है।
- source_word: መውላዲት
  choice: दाई
  rationale: जन्म-दृश्य में यह शब्द उस स्त्री के लिए सबसे स्वाभाविक है जो प्रसव के समय बच्चे को संभालती है; फिर भी इसकी शाब्दिक व्यापकता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ፈትሐ አፉሁ
  choice: अपना मुँह खोला
  rationale: मूल का सूत्रात्मक और सजीव कथन बनाए रखा गया है; केवल ‘बोला’ कहने से नवजात के तत्काल बोलने का आश्चर्य कुछ घट जाता।
- source_word: ባረኮ
  choice: धन्य कहा
  rationale: क्रिया का मूल भाव आशीष/धन्य कहना है। परमेश्वर के प्रति प्रयुक्त होने पर ‘धन्य कहा’ आधुनिक हिन्दी में अर्थपूर्ण है और ‘आशीर्वाद दिया’ से उत्पन्न संभावित भ्रम से बचाता है।
- source_word: እግዚአ ሰማይ
  choice: स्वर्ग के प्रभु
  rationale: यह सीधा संबंधवाचक अनुवाद है; ‘प्रभु’ दैवी सार्वभौम उपाधि को गरिमापूर्ण और प्रचलित हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दैवी उपाधि का अनुवाद
  choice: स्वर्ग के प्रभु
  alternative: स्वर्ग के स्वामी; स्वर्गों के प्रभु
  rationale: उपाधि का अनुवाद किया गया है, लिप्यंतरण नहीं। ‘प्रभु’ दैवी संदर्भ में मानक और गरिमापूर्ण है; एकवचन ‘स्वर्ग’ गीइज़ अभिव्यक्ति के अनुरूप रखा गया है।
- issue: परमेश्वर के प्रति ባረኮ का अर्थ
  choice: धन्य कहा
  alternative: स्तुति की; आशीष दी
  rationale: ‘धन्य कहा’ मूल क्रिया के आशीषात्मक भाव को बचाता है, जबकि ‘स्तुति की’ अर्थ को संकरा कर देता और ‘आशीष दी’ हिन्दी में मनुष्य द्वारा परमेश्वर को आशीर्वाद देने का अनपेक्षित भाव उत्पन्न कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘उठ खड़ा हुआ’ और ‘अपना मुँह खोला’ मूल की चमत्कारपूर्ण सजीवता रखते हैं; ‘धन्य कहा’ बाइबिलीय भाव को स्पष्ट रखते हुए आधुनिक पाठक के लिए समझने योग्य है।
