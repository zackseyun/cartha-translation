base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/007.yaml
  text: And now[a], my father, I am here asking you and petitioning you, that you should go to Henok our father and hear from him the truth[b], for his dwelling is with the angels.
translation:
  language: hi
  text: और अब, हे मेरे पिता, मैं यहाँ आपसे विनती और आग्रह करता हूँ कि आप हमारे पिता हेनोक[a] के पास जाएँ और उनसे सत्य सुनें, क्योंकि उनका निवास स्वर्गदूतों के साथ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ नाम ሄኖክ का लिप्यंतरण ‘हेनोक’ है; हिन्दी बाइबलों में यही नाम प्रायः ‘हनोक’ लिखा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: और अब
  rationale: यह समयसूचक वाक्यांश निवेदन के नए और तात्कालिक चरण का संकेत देता है।
- source_word: ሀለውኩ
  choice: मैं यहाँ
  rationale: स्रोत में वक्ता की वर्तमान उपस्थिति का स्पष्ट भाव है; ‘यहाँ’ उसे हिन्दी में स्वाभाविक ढंग से बनाए रखता है।
- source_word: አስተበቍዐከ ወእስእል
  choice: आपसे विनती और आग्रह करता हूँ
  rationale: दो निकटार्थी क्रियाओं की पुनरुक्ति निवेदन की गंभीरता और तीव्रता बढ़ाती है; दोनों को अलग शब्दों से रखा गया है।
- source_word: ከመ ትሖር ኀበ
  choice: कि आप ... के पास जाएँ
  rationale: यह निवेदन की विषयवस्तु व्यक्त करता है और किसी व्यक्ति के पास जाने का कथात्मक अर्थ स्वाभाविक रूप से देता है।
- source_word: ሄኖክ አቡነ
  choice: हमारे पिता हेनोक
  rationale: ሄኖክ का निकट लिप्यंतरण ‘हेनोक’ है; ‘हमारे पिता’ को पारिवारिक अथवा आदरसूचक पूर्वज-संबोधन की संभावित व्यापकता सहित बनाए रखा गया है।
- source_word: ትስማዕ እምኀቤሁ አማነ
  choice: उन्हीं से सत्य सुनें
  rationale: ‘सुनना’ स्रोत की प्रत्यक्ष श्रवण-छवि को रखता है; ‘उन्हीं से’ स्रोत-व्यक्ति पर बल और वाक्यांश के क्रम को सहज हिन्दी में व्यक्त करता है।
- source_word: እስመ
  choice: क्योंकि
  rationale: यह हेनोक के पास जाने का कारण प्रस्तुत करता है।
- source_word: ውእቱ ምስለ መላእክት ምኅዳሩ
  choice: उनका निवास स्वर्गदूतों के साथ है
  rationale: संज्ञात्मक रचना और हेनोक के स्थायी निवास की अपोकैलिप्टिक छवि को सरल क्रियात्मक रूप में बदलने के बजाय सुरक्षित रखता है।
theological_decisions:
- issue: स्वर्गदूतों के साथ हेनोक के संबंध को कैसे व्यक्त किया जाए
  choice: उनका निवास स्वर्गदूतों के साथ है
  alternative: वह स्वर्गदूतों के साथ रहते हैं
  rationale: गीज़ पाठ निवास/वासस्थान पर आधारित संज्ञात्मक अभिव्यक्ति का प्रयोग करता है। चुना हुआ रूप असाधारण स्वर्गीय निवास की छवि बनाए रखता है, पर उसकी प्रकृति के विषय में अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण, गंभीर और सहज शैली अपनाई गई है। पिता के लिए ‘आप’ तथा बहुवचन आदरसूचक क्रियाएँ प्रयुक्त हैं। दो अनुरोध-सूचक क्रियाओं और ‘निवास’ की संज्ञात्मक छवि को स्रोत के अनुरूप बनाए रखा गया है।
