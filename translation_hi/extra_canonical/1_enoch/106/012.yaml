base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/012.yaml
  text: And his father Lamech was afraid[a], and he fled to me, and he did not believe that he was from him, but that his likeness was like the angels of heaven. And behold[b], I have come to you so that you may make righteousness known to me.
translation:
  language: hi
  text: और उसका पिता लेमेक डर गया और भागकर मेरे पास आया। उसे विश्वास नहीं हुआ कि वह उसी से उत्पन्न हुआ है; बल्कि उसका रूप स्वर्ग के दूतों के समान था। और देख, मैं तेरे पास इसलिए आया हूँ कि तू मुझे सच्ची बात[a] बता दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धार्मिकता,” “न्याय” अथवा “जो सही है।” यहाँ लेमेक संभवतः बच्चे के विषय में सही स्पष्टीकरण माँग रहा है।
    reason: मूल गीइज़ शब्द ጽድቀ में नैतिक और न्यायिक अर्थ भी हैं, जबकि इस प्रसंग में ‘सच्ची बात’ स्वाभाविक है।
lexical_decisions:
- source_word: ፈርሀ
  choice: डर गया
  rationale: यह भय व्यक्त करने वाली सीधी क्रिया है; हिंदी में ‘डर गया’ प्रसंग की आकस्मिक प्रतिक्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ጐየ ኀቤየ
  choice: भागकर मेरे पास आया
  rationale: क्रिया में घबराहट के कारण तेज़ी से भागने का भाव है और ኀቤየ वक्ता की ओर गति बताता है।
- source_word: ከመ እምኔሁ ውእቱ
  choice: कि वह उसी से उत्पन्न हुआ है
  rationale: पूर्वसर्ग स्रोत या उत्पत्ति बताता है; प्रसंग में बात लेमेक के पितृत्व की है। ‘उसी’ सर्वनाम के संदर्भ को स्पष्ट रखते हुए किसी अतिरिक्त निष्कर्ष को नहीं जोड़ता।
- source_word: አምሳሉ እመላእክተ ሰማይ
  choice: उसका रूप स्वर्ग के दूतों के समान था
  rationale: አምሳሉ संज्ञा और प्रत्यय सहित ‘उसका रूप/सादृश्य’ है। यह अनुवाद दूतों से समानता व्यक्त करता है, दैवी पितृत्व या स्वयं दूत होने की बात नहीं जोड़ता।
- source_word: ናሁ
  choice: देख
  rationale: यह ध्यान आकर्षित करने वाला कथन-सूचक है; ‘देख’ आधुनिक किंतु गरिमापूर्ण हिंदी में उसका बल बनाए रखता है।
- source_word: መጻእኩ ኀቤከ
  choice: मैं तेरे पास ... आया हूँ
  rationale: पूर्ण होकर वर्तमान से जुड़ी गति को ‘आया हूँ’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ታይድዐኒ
  choice: तू मुझे ... बता दे
  rationale: मूल का कारक भाव ‘मुझे ज्ञात करा’ है; सामान्य आधुनिक हिंदी में ‘मुझे बता दे’ अधिक सहज और अर्थतः पर्याप्त है।
- source_word: ጽድቀ
  choice: सच्ची बात
  rationale: शब्द धार्मिकता, न्याय, सही बात या सत्य का अर्थ दे सकता है। यहाँ लेमेक बच्चे के विषय में सही स्पष्टीकरण चाहता है, इसलिए ‘सच्ची बात’ प्रसंगानुकूल है और पादटिप्पणी मूल की व्यापकता सुरक्षित रखती है।
theological_decisions:
- issue: क्या पद दूत-पितृत्व बताता है या केवल दूतों से समानता
  choice: मुख्य पाठ केवल यह कहता है कि बच्चे का रूप स्वर्ग के दूतों के समान था।
  alternative: वह लेमेक का पुत्र नहीं, बल्कि स्वर्गदूतों में से एक था; अथवा वह स्वर्गदूतों से उत्पन्न हुआ था।
  rationale: मूल में አምሳሉ ‘उसका रूप/सादृश्य’ है; वह सीधे दूत-पितृत्व नहीं कहता। इसलिए व्यापक कथा से निकाले जा सकने वाले निष्कर्ष को पद में नहीं जोड़ा गया।
- issue: አአምነ के साथ नकार का पाठगत प्रश्न
  choice: प्रसंग और समीक्षित पाठ-परंपरा के अनुसार ‘उसे विश्वास नहीं हुआ कि...’ रखा गया है।
  alternative: ‘उसने विश्वास किया कि वह उससे उत्पन्न नहीं हुआ था...’
  rationale: प्रेषित लिप्यंतरण में संभावित OCR त्रुटि है और पूर्व समीक्षा सही पाठ में नकार ወኢአምነ मानती है। दोनों विन्यास मूलतः लेमेक द्वारा अपने पितृत्व पर अविश्वास व्यक्त करते हैं; चुना हुआ रूप हिंदी में सहज है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। प्राचीन संबोधन का हल्का रंग बनाए रखने के लिए ‘तेरे/तू’ प्रयुक्त है, पर अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
