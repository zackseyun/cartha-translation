  yaml_path: translation/extra_canonical/1_enoch/106/002.yaml
  text: And his body was white like snow[a], and red like the blooming of a rose; and the hair of his head was like white wool, and his locks were beautiful. And his eyes were beautiful; and when he opened his eyes, he lit up the whole house like the sun[c][b], and the whole house became exceedingly bright.
translation:
  language: hi
  text: उसका शरीर बर्फ के समान उजला और गुलाब के फूल के समान लाल था।[a] उसके सिर के बाल सफेद ऊन के समान थे, और उसकी लटें सुंदर थीं; उसकी आँखें भी सुंदर थीं।[b] जब उसने अपनी आँखें खोलीं, तो उसने सूर्य के समान पूरे घर को प्रकाशित कर दिया, और सारा घर अत्यन्त उज्ज्वल हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से पुष्प-संबंधी यह उपमा ‘खिले हुए गुलाब के समान लाल’ या ‘गुलाब के फूल के समान लाल’ भी समझी जा सकती है।
    reason: lexical_alternative
  - marker: b
    text: 'इथियोपिक पाठ में लटों और आँखों के वर्णन का पद-विन्यास कठिन है। यहाँ दोनों वर्णन रखे गए हैं: उसकी लटें सुंदर थीं और उसकी आँखें सुंदर थीं। उपलब्ध यूनानी साक्ष्य ‘सुंदर’ को लटों से संबंध देने का समर्थन करता है।'
    reason: textual_difficulty
lexical_decisions:
- source_word: ሥጋሁ
  choice: उसका शरीर
  rationale: यहाँ बाहरी शारीरिक रूप का वर्णन है; इसलिए ‘मांस’ की अपेक्षा ‘शरीर’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: ጻዕዳ ከመ አስሐትያ
  choice: बर्फ के समान उजला
  rationale: मूल में बर्फ से श्वेतता की सीधी उपमा है। हिंदी में ‘उजला’ रंग और दीप्त रूप—दोनों को स्वाभाविक ढंग से व्यक्त करता है, बिना अर्थ को अनावश्यक रूप से बढ़ाए।
- source_word: ቀይሕ ከመ ጽጌ ረዳ
  choice: गुलाब के फूल के समान लाल
  rationale: मूल की लालिमा और पुष्प-उपमा को ठोस तथा सहज हिंदी में सुरक्षित रखा गया है; इसका अर्थ ‘खिले हुए गुलाब जैसा लाल’ भी हो सकता है।
- source_word: ጸጕረ ርእሱ ከመ ፀምር ጻዕዳ
  choice: उसके सिर के बाल सफेद ऊन के समान थे
  rationale: सिर के बाल और सफेद ऊन की सर्वनाशीय-दृश्यात्मक उपमा को पूर्ण रूप में रखा गया है।
- source_word: ተወድምድማሁ ሠናይ
  choice: उसकी लटें सुंदर थीं
  rationale: पद-रचना और उपलब्ध यूनानी साक्ष्य के अनुसार ‘सुंदर’ का संबंध लटों से मानना अधिक उपयुक्त है; इससे विशेष संज्ञा ‘लटें’ भी लुप्त नहीं होती।
- source_word: ከሠተ አዕይንቲሁ
  choice: उसने अपनी आँखें खोलीं
  rationale: प्रसंग में यह क्रिया आँखें खोलने का स्वाभाविक अर्थ देती है; ‘उघाड़ना’ आधुनिक हिंदी में अनावश्यक रूप से कठोर होता।
- source_word: አብርሀ ኵሎ ቤተ ከመ ፀሐይ
  choice: उसने सूर्य के समान पूरे घर को प्रकाशित कर दिया
  rationale: कारक प्रकाश-क्रिया, पूरे घर की व्यापकता और सूर्य की उपमा—तीनों को बनाए रखा गया है।
- source_word: ወፈድፋደ በርሀ ኵሉ ቤት
  choice: और सारा घर अत्यन्त उज्ज्वल हो गया
  rationale: मूल की तीव्रता और पूरे घर पर पड़े प्रकाश के प्रभाव को स्पष्ट, गरिमापूर्ण हिंदी में व्यक्त किया गया है।
theological_decisions:
- issue: असाधारण जन्म-वर्णन को वास्तविक दृश्यात्मक प्रकाश के रूप में रखना या सामान्य सौंदर्य का रूप देना
  choice: बर्फ, गुलाब, सफेद ऊन, सूर्य और घर को प्रकाशित करने की ठोस छवियाँ ज्यों की त्यों रखी गईं।
  alternative: इसे केवल असाधारण सौंदर्य या महिमा का सामान्य वर्णन बनाना।
  rationale: मूल का सर्वनाशीय और शकुनसूचक स्वर ठोस, चकित करने वाली शारीरिक तथा प्रकाशमय छवियों पर निर्भर है; उन्हें अमूर्त करना पाठ के तनाव को घटा देता।
- issue: ‘सुंदर’ विशेषण का संबंध आँखों से है या लटों से
  choice: 'इसे लटों से जोड़ा गया: ‘उसकी लटें सुंदर थीं।’'
  alternative: ‘उसकी आँखें सुंदर थीं।’
  rationale: इथियोपिक पद-विन्यास कठिन है, पर व्याकरणिक संकेत और उपलब्ध यूनानी अंश ‘सुंदर’ को लटों/केश-विन्यास से जोड़ने का समर्थन करते हैं। पाठ की कठिनाई को पादटिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और दृश्यात्मक शैली अपनाई गई है। ‘अत्यन्त’, ‘प्रकाशित’ और ‘उज्ज्वल’ जैसे शब्द अपोकैलिप्टिक गंभीरता बनाए रखते हैं, जबकि वाक्य-संरचना सामान्य पाठक के लिए स्पष्ट है।
