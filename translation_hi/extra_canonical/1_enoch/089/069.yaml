base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/069.yaml
  text: And beyond their prescribed measure they kept killing and destroying[d][c][b][a], and I was weeping and crying out because of those sheep.
translation:
  language: hi
  text: और वे उनकी निर्धारित सीमा से बढ़कर लगातार मारते और नाश करते रहे,[a] और मैं उन भेड़ों के कारण रोता और चिल्लाता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी ठहराई हुई व्यवस्था से बढ़कर” अथवा “उनकी निर्धारित संख्या से अधिक।” गीइज़ शब्द का अर्थ व्यवस्था, नियम या ठहराया हुआ माप हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ፈድፋደ እምሥርዓቶሙ
  choice: अपने लिए निर्धारित सीमा से बढ़कर
  rationale: ፈድፋደ እም का भाव किसी ठहराई हुई व्यवस्था या माप से अधिक होने का है। ሥርዓት में आदेश, व्यवस्था और निर्धारित माप के अर्थ हैं; इसलिए केवल ‘संख्या’ कहने के बजाय ‘निर्धारित सीमा’ उसके नियामक भाव को बनाए रखता है।
- source_word: ይቀትል
  choice: लगातार मारते ... रहे
  rationale: अपूर्ण क्रिया-रूप दर्शन-वृत्तांत में जारी या बार-बार होने वाली हिंसा व्यक्त करता है।
- source_word: ያሐጕል
  choice: नाश करते रहे
  rationale: पाठ का रूप कुछ कठिन है, पर क्रिया विनाश या बरबादी का भाव देती है। ‘नाश करना’ आवश्यक व्यापकता बनाए रखता है।
- source_word: እንዘ እብኪ ወአዐውዩ
  choice: रोता और पुकारता रहा
  rationale: यहाँ እንዘ अपूर्ण क्रियाओं के साथ समकालिक और जारी क्रिया बताता है; इसका अर्थ ‘सोते हुए’ नहीं है। हिन्दी में संयुक्त निरंतर रूप स्वाभाविक है।
- source_word: በእንተ ዝኩ አባግዕ
  choice: उन भेड़ों के कारण
  rationale: दर्शन की पशु-प्रतीकात्मक भाषा को व्याख्यात्मक रूप से ‘इस्राएल’ या ‘लोग’ में नहीं बदला गया है।
theological_decisions:
- issue: भेड़ों की प्रतीकात्मक पहचान मुख्य पाठ में स्पष्ट करना
  choice: दर्शन की छवि के अनुसार ‘भेड़ें’ बनाए रखना
  alternative: ‘इस्राएल’, ‘यहूदा’ या ‘वे लोग’
  rationale: अनुवाद को प्रतीकात्मक छवि सुरक्षित रखनी चाहिए; प्रतीक किसका द्योतक है, यह व्याख्या का विषय है।
- issue: चरवाहों की सीमा को केवल संख्यात्मक कोटा मानना
  choice: ‘निर्धारित सीमा’ द्वारा आदेश और माप—दोनों का भाव खुला रखना
  alternative: ‘निर्धारित संख्या’
  rationale: ሥርዓት का अर्थ केवल संख्या नहीं, बल्कि ठहराई गई व्यवस्था, नियम या माप भी हो सकता है; अतः धर्मवैचारिक तनाव को संकुचित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण अपोकैलिप्टिक वृत्तांत। ‘मारते और नाश करते रहे’ मूल की दो समानांतर हिंसक क्रियाओं को सुरक्षित रखता है। पांडुलिपीय/OCR रूप እንዝኩ को संदर्भ और व्याकरण के अनुसार እንዘ समझा गया है; पाठ में निद्रा का कोई शब्द नहीं जोड़ा गया।
