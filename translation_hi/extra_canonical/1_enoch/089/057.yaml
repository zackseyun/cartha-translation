base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/057.yaml
  text: And I began to cry out with all my strength[a], and I called to the Lord of the sheep and showed him concerning the sheep[b], that they were being devoured by all the wild beasts.
translation:
  language: hi
  text: तब मैं अपनी पूरी शक्ति से पुकारने लगा। मैंने भेड़ों के प्रभु को पुकारा और उन्हें भेड़ों की दशा दिखाई—कि उन्हें सभी जंगली पशु[a] खा रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘मैदान के पशु’ या ‘निर्जन प्रदेश के पशु’। यहाँ आशय झुंड पर टूट पड़ने वाले जंगली पशुओं से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: አኃዝኩ፡ እጽራሕ
  choice: मैं ... पुकारने लगा
  rationale: पहली क्रिया अगली क्रिया के साथ आरंभसूचक भाव देती है। ‘पुकारने लगा’ ऊँची आवाज़ और व्यथा, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: በኵሉ፡ ኃይልየ
  choice: अपनी पूरी शक्ति से
  rationale: मूल के समग्रता और तीव्रता के भाव को स्पष्ट, आधुनिक हिन्दी में बनाए रखता है।
- source_word: አጸውዖ
  choice: मैंने ... पुकारा
  rationale: यह पुकार को भेड़ों के प्रभु की ओर निर्देशित करता है; हिन्दी में पुनरावृत्ति मूल की क्रमिक क्रियाओं को सुरक्षित रखती है।
- source_word: ለእግዚአ፡ አባግዕ
  choice: भेड़ों के प्रभु को
  rationale: यह पशु-दर्शन में स्वामी और शासक के रूप में प्रयुक्त उपाधि का गरिमापूर्ण और स्वाभाविक अनुवाद है।
- source_word: ወአርእዮ፡ በእንተ፡ አባግዕት
  choice: और उन्हें भेड़ों की दशा दिखाई
  rationale: मूल क्रिया के ‘दिखाने’ के अर्थ को बनाए रखते हुए ‘दशा’ प्रसंग से निहित संकट को हिन्दी में स्पष्ट करती है।
- source_word: ተበልዑ
  choice: उन्हें खाए जा रहे थे
  rationale: अपूर्ण भूतकाल चल रहे हिंसक आक्रमण को व्यक्त करता है। सक्रिय हिन्दी संरचना मूल के कर्मवाच्य अर्थ को स्वाभाविक रूप से संप्रेषित करती है।
- source_word: እምኵሎሙ፡ አራዊተ፡ ገዳም
  choice: सभी जंगली पशु
  rationale: यह पालतू भेड़ों पर आक्रमण करने वाले हिंसक, गैर-पालतू पशुओं की छवि को स्पष्ट रखता है; ገዳም के ‘मैदान/निर्जन प्रदेश’ संबंधी भाव को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: पशु-दर्शन में ईश्वरीय उपाधि का अनुवाद
  choice: भेड़ों के प्रभु
  alternative: भेड़ों के स्वामी
  rationale: ‘प्रभु’ मूल उपाधि के अधिकार और ऊँचे साहित्यिक स्तर को बनाए रखता है, पर रूपक को किसी विशिष्ट सांप्रदायिक व्याख्या से नहीं बाँधता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण रूप अपनाया गया है। दृष्टांत की पशु-संबंधी भाषा को व्याख्यात्मक ऐतिहासिक पहचान दिए बिना ज्यों का त्यों रखा गया है।
