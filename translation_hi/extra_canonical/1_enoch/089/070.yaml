base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/070.yaml
  text: And thus in the vision I saw that the one who wrote wrote down every one that was destroyed by those shepherds[a], day by day, and he brought up and laid down and showed that whole book to the Lord of the sheep, all that they had done, and all that each one of them had made away with[d][c][b], and all that they had given over to destruction.
translation:
  language: hi
  text: और इस प्रकार दर्शन में मैंने उस लिखनेवाले को देखा कि वह उन चरवाहों के हाथों नष्ट हुए हर एक का लेखा दिन-प्रतिदिन लिखता था।[c] फिर वह उस पूरी पुस्तक को ऊपर ले गया, उसे रख दिया और भेड़ों के प्रभु को दिखाया—उन्होंने जो कुछ किया था, उनमें से हर एक ने जिसे हटा दिया था,[a] और जिसे उन्होंने विनाश के लिए सौंप दिया था, वह सब।[d][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ का इथियोपिक शब्द कठिन है; इसका अर्थ अधिक विशेष रूप से यह भी हो सकता है कि प्रत्येक चरवाहे ने झुंड में से जिसे निकाल दिया या गायब कर दिया था।
    reason: lexical_alternative
  - marker: b
    text: बार-बार लिखने और पुस्तक दिखाने की यह छवि चरवाहों के कामों के स्वर्गीय अभिलेख को दर्शाती है, जिसे दिव्य न्याय के सामने लाया जाता है।
    reason: cross_reference
  - marker: c
    text: 'वैकल्पिक पाठ-संबंध: “वह दिन-प्रतिदिन उन चरवाहों में से हर एक का लेखा लिखता था जो नष्ट हुआ।”'
    reason: previous_rendering
  - marker: d
    text: 'वैकल्पिक रूप: “फिर वह ऊपर गया, उसे पूरा भेड़ों के प्रभु के सामने रख दिया और उन्हें सब कुछ दिखाया”; किंतु इथियोपिक क्रिया का कारक रूप “ऊपर ले गया” का समर्थन करता है और ‘पुस्तक’ भी मूल में स्पष्ट है।'
    reason: textual_clarification
lexical_decisions:
- source_word: ርኢክዎ
  choice: मैंने ... को देखा
  rationale: यह दर्शन-वर्णन का सामान्य क्रियापद है; सरल भूतकाल मूल कथन की प्रत्यक्षता बनाए रखता है।
- source_word: ዘይጽሕፍ ... ይጽሕፍ
  choice: उस लिखनेवाले को ... लिखता था
  rationale: मूल में लेखन-धातु की पुनरावृत्ति है। हिन्दी में ‘लिखनेवाला ... लिखता था’ उस जोर को बनाए रखता है, बिना उसे स्पष्ट रूप से ‘स्वर्गीय लेखक’ या किसी विशेष पदनाम में बदलने के।
- source_word: ዘይትሐጐል
  choice: नष्ट हुए
  rationale: धातु का अर्थ नष्ट होना या नाश पाना है। कर्मवाच्य रूप को बनाए रखा गया है और विनाश की तीव्रता को अनावश्यक रूप से नहीं बढ़ाया गया।
- source_word: እምነ ዝኩ ኖላዊያን
  choice: उन चरवाहों के हाथों
  rationale: संदर्भ में चरवाहे विनाश के कर्ता हैं; यह हिन्दी प्रयोग एजेंसी को स्वाभाविक ढंग से व्यक्त करता है। पाठगत वैकल्पिक संबंध को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: በኵሉ ዕለት
  choice: दिन-प्रतिदिन
  rationale: यह निरंतर और क्रमवार लेखा रखने का भाव व्यक्त करता है।
- source_word: ያዓርግ
  choice: ऊपर ले गया
  rationale: यह कारक रूप है, इसलिए केवल ‘ऊपर गया’ के बजाय पुस्तक को ऊपर ले जाने का भाव दिया गया है।
- source_word: ያዓርፍ
  choice: उसे रख दिया
  rationale: मूल में रखने या नीचे रख देने की क्रिया है; ‘प्रस्तुत किया’ कहने से निहित न्याय-दरबार का अर्थ जरूरत से अधिक स्पष्ट हो जाता।
- source_word: ያርኢ ... መጽሐፈ
  choice: उस पूरी पुस्तक को ... दिखाया
  rationale: ‘पुस्तक’ मूल में स्पष्ट है और दिखाने की क्रिया उसके विषय को प्रभु के सामने प्रकट करती है।
- source_word: ለእግዚአ አባግዕ
  choice: भेड़ों के प्रभु को
  rationale: पशु-दृष्टांत की प्रमुख उपाधि का सीधा अनुवाद किया गया है; इसे केवल ‘परमेश्वर’ कहकर रूपक को समतल नहीं किया गया।
- source_word: ዘገብሩ
  choice: उन्होंने जो कुछ किया था
  rationale: पूर्व में किए गए कार्यों के लिखित विवरण का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ዘአእተተ
  choice: जिसे हटा दिया था
  rationale: यह शब्द कठिन है और हटाने, अलग करने या गायब कर देने का संकेत दे सकता है। ‘हटा दिया’ अपेक्षाकृत व्यापक है और हत्या या चोरी का विशिष्ट अर्थ आरोपित नहीं करता।
- source_word: ዘመጠዉ ለሐጕል
  choice: जिसे उन्होंने विनाश के लिए सौंप दिया था
  rationale: मूल का विनाश के हवाले करने का भाव और चरवाहों की उत्तरदायित्वपूर्ण भूमिका दोनों बने रहते हैं।
theological_decisions:
- issue: लिखनेवाले की पहचान
  choice: उसे केवल उसके कार्य के आधार पर ‘लिखनेवाला’ कहा गया है
  alternative: स्वर्गीय लेखक, स्वर्गदूत या हनोक के रूप में स्पष्ट पहचान
  rationale: पद एक अलग लेखन करनेवाली आकृति दिखाता है, पर उसकी सटीक पहचान नहीं बताता। अनुवाद न्यायिक अभिलेख की छवि रखता है, पर पाठ से आगे नहीं जाता।
- issue: ‘भेड़ों के प्रभु’ का संकेत
  choice: रूपकात्मक उपाधि को ज्यों का त्यों अर्थानुवादित किया गया है
  alternative: सीधे ‘परमेश्वर’ या केवल ‘स्वामी’
  rationale: पशु-दृष्टांत में यह दिव्य न्यायाधीश और झुंड के स्वामी की ओर संकेत करता है। प्रत्यक्ष उपाधि बनाए रखने से स्थानीय रूपक और उसका धर्मवैचारिक तनाव दोनों सुरक्षित रहते हैं।
- issue: स्वर्गीय लेखा और न्याय
  choice: लेखन, पुस्तक को ऊपर ले जाने, रखने और दिखाने की क्रमिक छवि सुरक्षित रखी गई है
  alternative: इसे संक्षेप में ‘उसने परमेश्वर को सबका हिसाब दिया’ कहना
  rationale: संक्षिप्त व्याख्यात्मक रूप दृश्य की ठोस पुस्तक और दरबार-सदृश क्रियाओं को मिटा देता।
