  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘लिखनेवाला’, ‘दिन-प्रतिदिन’, ‘ऊपर ले गया’ और ‘भेड़ों के प्रभु’ जैसे पद मूल की पुनरावृत्ति, गति और पशु-दृष्टांत की छवि बनाए रखते हैं। कठिन वाक्य-संबंध और संदिग्ध शब्दार्थ को मुख्य पाठ में जबरन निश्चित करने के बजाय पादटिप्पणियों में रखा गया है।
