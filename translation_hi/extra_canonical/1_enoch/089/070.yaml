  source_fidelity: The Hindi preserves the vision report, the distinct writing figure, the day-by-day record, the upward carrying and setting down of the explicit book, its disclosure to the Lord of the sheep, and the threefold accounting of the shepherds' conduct. “ऊपर ले गया” correctly follows the causative force identified for ያዓርግ, and “उस पूरी पुस्तक” does not omit መጽሐፈ. The difficult ዘአእተተ is rendered broadly as “जिसे हटा दिया था,” without importing a specific sense such as killing or stealing; the alternative is responsibly footnoted.
