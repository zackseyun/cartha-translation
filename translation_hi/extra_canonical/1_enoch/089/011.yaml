  yaml_path: translation/extra_canonical/1_enoch/089/011.yaml
  text: And they began to gore one another[a]; and that white bull which was born in their midst begot a wild ass and a white bull with it[c][b], and the wild asses multiplied.
translation:
  language: hi
  text: और वे एक-दूसरे को सींग मारने लगे[a]। और वह सफेद बैल, जो उनके बीच जन्मा था, उसने एक जंगली गधे और उसके साथ एक सफेद बैल को उत्पन्न किया; और जंगली गधों की संख्या बढ़ गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरंभिक वाक्यांश का पाठ कुछ कठिन है। क्रिया संभवतः पशुओं की आपसी हिंसक क्रिया बताती है; “एक-दूसरे को सींग मारने लगे” गोवंशीय चित्र को सुरक्षित रखता है।
    reason: textual_variant
lexical_decisions:
- source_word: ይትናሰኩ
  choice: एक-दूसरे को सींग मारने लगे
  rationale: पारस्परिक हिंसक क्रिया और पशु-दर्शन की ठोस छवि दोनों को बनाए रखता है; पाठगत कठिनाई को पादटिप्पणी में बताया गया है।
- source_word: ላህም ጸዓዳ
  choice: सफेद बैल
  rationale: गोवंश-सूचक संज्ञा और दर्शन में प्रतीकात्मक रूप से महत्त्वपूर्ण सफेद रंग को सीधे सुरक्षित रखता है।
- source_word: ዘተወልደ ማእከሎሙ
  choice: जो उनके बीच जन्मा था
  rationale: इसे मुख्य क्रिया नहीं, बल्कि पहले आए सफेद बैल को विशेषित करने वाले संबंधवाचक उपवाक्य के रूप में प्रस्तुत किया गया है।
- source_word: ወለደ
  choice: का पिता बना
  rationale: सक्रिय जननार्थक क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और वंशावली संबंध स्पष्ट रखता है।
- source_word: አድገ ገዳም
  choice: जंगली गधा
  rationale: एकवचन पशु-पद का सीधा अर्थ; पुराने ‘मैदान के बछड़े’ वाले पाठ को नहीं अपनाया गया।
- source_word: አእዱገ ገዳም
  choice: जंगली गधे
  rationale: संबंधित पद का बहुवचन रूप है और अगली वृद्धि-सूचक क्रिया का कर्ता है।
- source_word: በዝኁ
  choice: संख्या बढ़ गई
  rationale: वृद्धि/बहुलता का अर्थ सहज हिन्दी में देता है; अनावश्यक रूप से जन्म की क्रिया नहीं जोड़ता।
theological_decisions:
- issue: प्रतीकात्मक पशु-चित्रों की ऐतिहासिक पहचान
  choice: बैल और जंगली गधे जैसे ठोस पशु-पदों को मूल रूप में बनाए रखना
  alternative: पशुओं को सीधे अब्राहम, इश्माएल, इसहाक या किसी मानव समुदाय के नामों से बदल देना
  rationale: पशु-दर्शन की अपनी प्रतीकात्मक भाषा को अनुवाद में ऐतिहासिक व्याख्या से प्रतिस्थापित नहीं किया जाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। वंशावली-संबंधी वाक्यरचना स्पष्ट रखी गई है, जबकि दर्शन की ठोस पशु-प्रतीकात्मकता का अर्थ खोलकर नहीं बताया गया।
