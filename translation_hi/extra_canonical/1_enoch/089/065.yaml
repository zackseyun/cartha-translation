base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/065.yaml
  text: And I saw until those shepherds pastured in their season, and they began to kill and destroy much more than they had been commanded, and they abandoned those sheep into the hand of the lions.
translation:
  language: hi
  text: और मैंने देखा कि वे चरवाहे अपने नियत समय में भेड़ें चराते रहे, और वे मारने और नष्ट करने लगे—उन्हें जितना आदेश दिया गया था, उससे कहीं अधिक[a]—और उन्होंने उन भेड़ों को सिंहों के हाथ में छोड़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘उनके आदेश से बहुत अधिक’; अर्थात् उन्हें दी गई आज्ञा की सीमा से कहीं आगे।
    reason: lexical_alternative
lexical_decisions:
- source_word: ኖላዊያን
  choice: चरवाहे
  rationale: यह शब्द पशु-दर्शन में नियुक्त रखवालों को चरवाहों के रूपक में प्रस्तुत करता है; ‘चरवाहे’ उस चित्रात्मकता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ይርዐዩ
  choice: भेड़ें चराते रहे
  rationale: क्रिया चराने और झुंड की देखभाल करने के क्षेत्र की है। हिन्दी में ‘भेड़ें चराते रहे’ पशु-दर्शन के दृश्य और निरंतर क्रिया दोनों को स्पष्ट रखता है।
- source_word: በጊዜሁ
  choice: अपने नियत समय में
  rationale: वाक्यांश चरवाहों की गतिविधि के निर्धारित अथवा आवंटित काल का संकेत देता है। ‘नियत’ अर्थ को स्पष्ट करता है, बिना यह तय किए कि समय किस प्रकार निर्धारित हुआ।
- source_word: ወአኃዙ
  choice: तब वे … लगे
  rationale: यहाँ क्रिया अगली हिंसक कार्रवाइयों के आरम्भ को व्यक्त करती है; ‘लगे’ आधुनिक हिन्दी में स्वाभाविक आरम्भसूचक प्रयोग है।
- source_word: ይቅትሉ ወያሕጕሉ
  choice: मारने और नष्ट करने
  rationale: दोनों क्रियाओं को अलग रखकर मूल की बढ़ती हुई हिंसा और विनाश की तीव्रता सुरक्षित रहती है।
- source_word: ብዙኃ እምትእዛዞሙ
  choice: उन्हें जितना आदेश दिया गया था, उससे कहीं अधिक
  rationale: ብዙኃ के बाद እም वाला विन्यास तुलना की सीमा से अत्यधिक आगे जाने का भाव देता है। यह अनुवाद उसे अज्ञात संख्या में ‘बहुतों’ को मारने के बजाय आदेशित सीमा से अधिक हिंसा करने के रूप में प्रस्तुत करता है।
- source_word: ኃደጉ
  choice: छोड़ दिया
  rationale: क्रिया त्याग देने या दूसरे के अधिकार में पड़े रहने देने का भाव रखती है। ‘छोड़ दिया’ हिन्दी में स्वाभाविक है और संदर्भ में दोषपूर्ण परित्याग को व्यक्त करता है।
- source_word: አባግዐ
  choice: उन भेड़ों
  rationale: संकेतात्मक भाव पहले से उल्लिखित, उन्हीं भेड़ों की ओर लौटता है; ‘उन’ इसे सुरक्षित रखता है।
- source_word: ውስተ እደ አናብስት
  choice: सिंहों के हाथ में
  rationale: ‘हाथ में’ किसी की शक्ति या अधिकार में सौंपे जाने का मूल मुहावरा बनाए रखता है, जबकि ‘सिंहों’ से पशु-दर्शन का विशिष्ट प्रतीक सुरक्षित रहता है।
theological_decisions:
- issue: क्या चरवाहों की हिंसा दिए गए आदेश की सीमा के भीतर थी या उससे आगे बढ़ गई थी
  choice: चरवाहों ने आदेशित सीमा से कहीं अधिक मार-काट और विनाश किया।
  alternative: वे केवल दिए गए आदेश के अनुसार कार्य कर रहे थे; अथवा ‘बहुतों’ को आदेश से परे मार रहे थे।
  rationale: ብዙኃ እም… की तुलनात्मक रचना उनके कार्य की मात्रा को आदेशित सीमा से अधिक बताती है। इससे सौंपे गए अधिकार और उसके दुरुपयोग के बीच का मूल तनाव बना रहता है, बिना आदेश के स्रोत या उसकी नैतिक प्रकृति को अतिरिक्त रूप से परिभाषित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। पशु-दर्शन के ‘चरवाहे’, ‘भेड़ें’ और ‘सिंह’ जैसे प्रतीकों तथा ‘हाथ में’ मुहावरे को बनाए रखा गया है। तुलना को हिन्दी में स्पष्ट किया गया है, पर आदेश किसने दिया और उसका स्वरूप क्या था, यह पाठ से बाहर जाकर निश्चित नहीं किया गया।
