base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/022.yaml
  text: And the Lord of the sheep went with them as he led them[a], and all his sheep followed him[b]; and his face was glorious and splendid and terrible to behold.
translation:
  language: hi
  text: और भेड़ों का प्रभु उनके साथ चला, उनकी अगुवाई करते हुए; और उसकी सारी भेड़ें उसके पीछे चलीं। उसका मुख महिमामय, भव्य और देखने पर भय-विस्मय उत्पन्न करने वाला था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚኦሙ ለአባግዕ
  choice: भेड़ों का प्रभु
  rationale: यह पदबंध स्वामित्व और प्रभुता का संबंध बनाए रखता है तथा पशु-दर्शन की प्रतीकात्मक भेड़-छवि को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: ሖረ ምስሌሆሙ
  choice: उनके साथ चला
  rationale: सरल गति और साथ होने—दोनों अर्थों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; दिशा या स्थान का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: እንዘ ይመራሖሙ
  choice: और उनकी अगुवाई करता रहा
  rationale: እንዘ के समकालिक/जारी क्रिया-भाव को ‘करता रहा’ से व्यक्त किया गया है। ‘अगुवाई’ स्पष्ट है और ‘चरवाही’ जैसी अतिरिक्त व्याख्या से बचती है।
- source_word: ኵሎሙ አባግዒሁ
  choice: उसकी सभी भेड़ें
  rationale: मूल का स्पष्ट संबंधवाचक भाव और ठोस पशु-प्रतीक दोनों बने रहते हैं; ‘झुंड’ कहने से बार-बार आने वाली भेड़ की छवि सामान्यीकृत हो जाती।
- source_word: ተለውዎ
  choice: उसके पीछे चलीं
  rationale: नेतृत्व और दिशात्मक अनुसरण का भाव स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ገጹ
  choice: उसका मुख
  rationale: मूल की ठोस और सजीव मुख-छवि को बनाए रखता है; ‘स्वरूप’ कहना इसे अधिक अमूर्त बना देता।
- source_word: ስቡሕ
  choice: महिमामय
  rationale: वर्णन में दीप्ति, प्रशंसा और महिमा का ऊँचा भाव व्यक्त करता है तथा अगले विशेषण से भिन्नता बनाए रखता है।
- source_word: ክቡር
  choice: भव्य
  rationale: सम्मान, गौरव और प्रभावशाली वैभव का अर्थ देता है। ‘प्रतापी’ भी संभव है, इसलिए विकल्प को पादटिप्पणी में रखा गया है।
- source_word: ግሩም ለርእይ
  choice: देखने में भय-विस्मय से भर देने वाला
  rationale: यह केवल नैतिक रूप से ‘भयानक’ नहीं, बल्कि विस्मय और भय से युक्त अलौकिक प्रभाव दर्शाता है; आधुनिक हिन्दी में संयुक्त पद उस तनाव को सुरक्षित रखता है।
theological_decisions:
- issue: पशु-दर्शन में अगुवाई करने वाले पात्र की पहचान
  choice: ‘भेड़ों का प्रभु’ कहकर भेड़ की प्रतीकात्मक छवि को अक्षुण्ण रखना
  alternative: ‘उनका स्वामी’, ‘भेड़ों का मालिक’ या ‘चरवाहा’
  rationale: मूल पदबंध प्रभुता को व्यक्त करता है, जबकि दर्शन लगातार पशु-प्रतीकों में बात करता है। चुना हुआ रूप ईश्वरीय गरिमा और प्रतीकात्मक भाषा दोनों को बनाए रखता है, पर ‘चरवाहा’ जैसी ऐसी भूमिका नहीं जोड़ता जो इस पद में स्पष्ट रूप से कही नहीं गई।
- issue: ግሩም में भय और विस्मय का संबंध
  choice: ‘भय-विस्मय से भर देने वाला’
  alternative: ‘भयानक’, ‘विस्मयकारी’ या ‘अद्भुत’
  rationale: मूल विशेषण श्रद्धामिश्रित भय, विस्मय और प्रबल प्रभाव की अर्थ-छाया रख सकता है। केवल ‘भयानक’ नैतिक या दुष्ट अर्थ जगा सकता है, और केवल ‘विस्मयकारी’ भय की धार को कम कर देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु दर्शन-वृत्तांत के अनुरूप गरिमापूर्ण रखी गई है। ‘मुख’, ‘महिमामय’ और ‘प्रभु’ ऊँचे धार्मिक-वर्णनात्मक स्तर को बनाए रखते हैं; वहीं वाक्य-विन्यास सामान्य पाठक के लिए सहज है।
