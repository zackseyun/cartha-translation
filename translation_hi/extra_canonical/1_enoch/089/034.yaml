  yaml_path: translation/extra_canonical/1_enoch/089/034.yaml
  text: And when they saw him[a], they were afraid and trembled before his face[b], and they desired to return to their own folds.
translation:
  language: hi
  text: और जब उन्होंने उसे देखा, तो वे उसके सामने[a] डर गए और काँप उठे; और वे अपने ही बाड़ों[b] में लौट जाना चाहते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके चेहरे के सामने”; अर्थात उसकी उपस्थिति में।
    reason: lexical_alternative
  - marker: b
    text: इससे पशुओं के घेरे या भेड़-बाड़े अभिप्रेत हैं; “बाड़ों” से दर्शन की पशु-प्रतीकात्मकता बनी रहती है।
    reason: cultural_note
lexical_decisions:
- source_word: ርእይዎ
  choice: उन्होंने उसे देखा
  rationale: यह देखने की सामान्य क्रिया है और कर्मवाचक प्रत्यय ‘उसे’ को सूचित करता है। यह चयन आधुनिक हिन्दी में सहज है।
- source_word: ፈርሁ ወርዕዱ
  choice: डर गए और काँप उठे
  rationale: 'दोनों क्रियाओं को अलग रखा गया है: पहली भय को और दूसरी उसके कारण होने वाले तीव्र शारीरिक कम्पन को व्यक्त करती है।'
- source_word: እምቅድመ ገጹ
  choice: उसके सामने
  rationale: शाब्दिक भाव ‘उसके चेहरे के सामने से/उसके चेहरे के आगे’ है। मुख्य पाठ में स्वाभाविक हिन्दी ‘उसके सामने’ रखी गई है और सजीव मूल अभिव्यक्ति पादटिप्पणी में दी गई है।
- source_word: ወፈቀዱ
  choice: वे ... चाहते थे
  rationale: यह क्रिया इच्छा या अभिलाषा व्यक्त करती है। ‘चाहते थे’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और अर्थ को अनावश्यक रूप से ऊँचा नहीं बनाता।
- source_word: ከመ ይግብኡ
  choice: में लौट जाना
  rationale: क्रिया का मूल भाव प्रवेश करना है, पर प्रसंग में पहले के स्थान पर वापस जाने का आशय है; ‘में लौट जाना’ प्रवेश और वापसी दोनों को स्वाभाविक रूप से समेटता है।
- source_word: ለአዕጻዲ ዚአሆሙ
  choice: अपने ही बाड़ों
  rationale: यह पशुओं के घेरे या बाड़ों की ओर संकेत करता है। ‘बाड़ों’ दर्शन की निरंतर पशु-प्रतीकात्मकता बनाए रखता है, और ‘अपने ही’ संबंधवाचक बल को स्पष्ट करता है।
theological_decisions:
- issue: पशु-रूपक को सामान्य मानवीय निवास में बदलना या बनाए रखना
  choice: ‘अपने ही बाड़ों’ के द्वारा पशु-रूपक बनाए रखा गया
  alternative: अपने घरों / अपने स्थानों
  rationale: यह अंश निरंतर पशु-प्रतीकों में वर्णित दर्शन का भाग है। ‘घरों’ जैसे सामान्य शब्द से मूल साहित्यिक और प्रतीकात्मक तनाव मिट जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘काँप उठे’ भय की तीव्रता को व्यक्त करता है, जबकि ‘बाड़ों’ मूल दर्शन की पशु-छवि को बिना सामान्यीकृत किए सुरक्षित रखता है।
