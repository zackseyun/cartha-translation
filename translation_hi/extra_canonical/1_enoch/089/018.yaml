  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। पशु-दर्शन की प्रतीकात्मक शब्दावली को स्पष्ट रखा गया है। ‘जा पहुँचीं’ ने सभा के भीतर प्रवेश का स्वाभाविक हिन्दी भाव दिया है; स्त्रीलिंग क्रियाएँ ‘भेड़’ के हिन्दी व्याकरणिक लिंग के अनुरूप हैं।
