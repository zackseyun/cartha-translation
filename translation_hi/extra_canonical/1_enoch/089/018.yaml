  yaml_path: translation/extra_canonical/1_enoch/089/018.yaml
  text: And one sheep went to the wolves at the word of the Lord[a], and another sheep met him and went with him. And the two of them went together and entered into the assembly of those wolves, and they spoke to them and made them hear[d][c][b], that from then on they should not ravage the sheep.
translation:
  language: hi
  text: और प्रभु के वचन पर[a] एक भेड़ भेड़ियों के पास गई। दूसरी भेड़ उससे मिली और उसके साथ चली गई। फिर वे दोनों साथ-साथ उन भेड़ियों की सभा में जा पहुँचीं। उन्होंने उनसे बात की और उन्हें यह बात सुनाई[b] कि अब से वे भेड़ों को न नोचें-खसोटें[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु की आज्ञा से।” मूल अभिव्यक्ति प्रभु के कहने पर या उसकी आज्ञा के अनुसार की गई कार्रवाई बता सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप में, “उन्हें सुनाया” या “उनके विरुद्ध सुनाया।” प्रसंग में इसका आशय उन्हें गंभीरता से चेताना भी हो सकता है, पर मुख्य पाठ अधिक तटस्थ रखा गया है।
    reason: lexical_alternative
  - marker: c
    text: या, “भेड़ों को सताएँ।” यहाँ प्रयुक्त क्रिया हिंसक उत्पीड़न या आक्रमण का अर्थ दे सकती है; “नोचें-खसोटें” भेड़ियों और भेड़ों के बिंब को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ / አባግዕት
  choice: भेड़ / भेड़ों
  rationale: पशु-दर्शन की निरंतर प्रतीकात्मक भाषा को बनाए रखने के लिए सामान्य शब्द चुना गया है; ‘मेढ़ा’ या ‘मेमना’ लिंग अथवा आयु को अनावश्यक रूप से निश्चित कर देते।
- source_word: አዝእብት
  choice: भेड़िए
  rationale: यह मानक अर्थ है और दर्शन में हिंसक शिकारी का चित्र स्पष्ट रखता है।
- source_word: በቃለ እግዚእ
  choice: प्रभु के वचन पर
  rationale: यह अभिव्यक्ति प्रभु के कहने पर की गई आज्ञाकारी कार्रवाई और दिव्य अधिकार—दोनों को व्यक्त करती है, जबकि ‘आज्ञा से’ संभावित अर्थ के रूप में पादटिप्पणी में रखा गया है।
- source_word: ተረክቦ
  choice: उससे मिली
  rationale: संदर्भ में दूसरी भेड़ पहली से मिलती है और फिर उसके साथ जाती है; यह अनुवाद साथ हो लेने का अर्थ पहले से आरोपित नहीं करता।
- source_word: ኅቡረ
  choice: साथ-साथ
  rationale: दोनों भेड़ों की संयुक्त कार्रवाई को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ማኅበሮሙ
  choice: सभा
  rationale: संगठित जमाव या समूह का औपचारिक भाव सुरक्षित रहता है, बिना बाद की कलीसियाई शब्दावली आरोपित किए।
- source_word: ወተናገርዎሙ
  choice: उन्होंने उनसे बात की
  rationale: प्रत्यक्ष संबोधन की सरल कथात्मक गति बनाए रखी गई है।
- source_word: ወአስምዑ ዲቤሆሙ
  choice: उन्हें चेतावनी दी
  rationale: कारक क्रिया और ዲቤሆሙ के प्रतिकूल/विरुद्ध भाव को मिलाकर यह मुहावरा केवल ‘सुनाने’ से अधिक, उनके सामने गंभीर चेतावनी रखने का संकेत देता है। शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: ከመ እምይእዜ
  choice: कि अब से
  rationale: आगे के समय के लिए निषेध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ኢይግሥሥዎሙ ለአባግዕት
  choice: वे भेड़ों को न नोचें-खसोटें
  rationale: भेड़िया-भेड़ के शिकारी बिंब और हिंसक उत्पीड़न को बनाए रखता है; व्यापक अर्थ ‘सताएँ’ को पादटिप्पणी में स्वीकार किया गया है।
theological_decisions:
- issue: दर्शन के संदर्भ में እግዚእ का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ भेड़ के मिशन के पीछे दिव्य अधिकार अभिप्रेत है। ‘प्रभु’ उस धार्मिक भार को सुरक्षित रखता है और किसी विशिष्ट सम्प्रदायगत व्याख्या को नहीं जोड़ता।
- issue: በቃለ እግዚእ में दिव्य वचन और आज्ञा का संबंध
  choice: प्रभु के वचन पर
  alternative: प्रभु की आज्ञा से
  rationale: मुख्य पाठ मूल की ‘वचन’ शब्दावली को रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि प्रसंग में वह वचन आदेश के रूप में कार्य करता है।
