base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/044.yaml
  text: And that sheep[a], whose eyes had been opened, saw that ram in the midst of the sheep, which had abandoned its glory, and it began to gore those sheep and trample them[d][c][b], and it went about without restraint.
translation:
  language: hi
  text: और वह भेड़, जिसकी आँखें खोल दी गई थीं, ने भेड़ों के बीच उस मेढ़े को देखा जिसने अपनी महिमा[a] छोड़ दी थी। वह उन भेड़ों को सींगों से मारने और रौंदने लगा, और बिना मर्यादा[b] के इधर-उधर फिरता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गौरव” अथवा “शोभा”; दर्शन में इसका ठीक प्रतीकात्मक आशय स्पष्ट नहीं किया गया है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात अशोभनीय या गरिमाहीन ढंग से; मूल अभिव्यक्ति का अर्थ “बिना किसी के रोके” होना आवश्यक नहीं है।
    reason: textual_clarification
lexical_decisions:
- source_word: በግዕ
  choice: भेड़
  rationale: पशु-दर्शन में एक ही प्रतीकात्मक पशु के लिए सामान्य और स्वाभाविक हिन्दी शब्द; यहाँ ‘मेमना’ आयु का ऐसा संकेत देगा जो मूल में आवश्यक नहीं है।
- source_word: ዘተፈትሐ አዕይንቲሁ
  choice: जिसकी आँखें खोल दी गई थीं
  rationale: मूल की निष्क्रिय अभिव्यक्ति को बनाए रखता है और यह तय नहीं करता कि आँखें किसने खोलीं।
- source_word: ሐርጌ
  choice: मेढ़ा
  rationale: नर भेड़ के लिए सटीक हिन्दी शब्द और दर्शन की पशु-प्रतीकात्मकता को सुरक्षित रखता है।
- source_word: ዘማእከለ አባግዕ
  choice: भेड़ों के बीच
  rationale: झुंड के भीतर मेढ़े की स्थिति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ዘሐደገ ስብሐተ
  choice: जिसने अपनी महिमा छोड़ दी थी
  rationale: ስብሐት के व्यापक अर्थ—महिमा, गौरव या शोभा—को किसी एक प्रतीकात्मक व्याख्या में सीमित किए बिना रखता है।
- source_word: አሐዘ ይጉድኦሙ
  choice: सींग मारने लगा
  rationale: አሐዘ आरम्भ का भाव देता है; पशु-दर्शन के प्रसंग में हिंसक सींग मारना अमूर्त ‘हानि पहुँचाने’ से अधिक ठोस है।
- source_word: ወኬዶሙ
  choice: और रौंदने लगा
  rationale: भेड़ों के विरुद्ध जारी हिंसक क्रिया को दृश्य और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ዘእንበለ ተደላ
  choice: बिना मर्यादा के
  rationale: ተደላ का संबंध उचितता, शिष्टता या गरिमा से है; इसलिए इसे ‘बिना रोक-टोक’ कहना मूल के नैतिक-अनुचितता वाले भाव को बदल देगा।
theological_decisions:
- issue: मेढ़े की ‘महिमा’ का आशय
  choice: ‘महिमा’ को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: गौरव, शोभा, प्रतिष्ठा या राजकीय गरिमा
  rationale: दर्शन में इसका प्रतीकात्मक आशय खुला है; अनुवाद इसे किसी विशेष ऐतिहासिक या धर्मवैज्ञानिक पहचान तक सीमित नहीं करता।
- issue: अंतिम वाक्यांश का स्वरूप
  choice: ‘बिना मर्यादा के’
  alternative: बिना गरिमा के; अशोभनीय ढंग से
  rationale: मूल का भाव व्यवहार की अनुपयुक्तता या गरिमाहीनता है, बाहरी रोक या विरोध का अभाव नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली अपनाई गई है। पशु-दर्शन की ठोस छवियाँ—भेड़, मेढ़ा, सींग मारना और रौंदना—बनाए रखी गई हैं। ‘मर्यादा’ यहाँ नैतिक उचितता और गरिमा दोनों का स्वाभाविक हिन्दी संकेत देती है।
