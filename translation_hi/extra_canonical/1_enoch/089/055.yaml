  yaml_path: translation/extra_canonical/1_enoch/089/055.yaml
  text: And he gave them over into the hand of the lions and the leopards and the wolves and the hyenas[a], and into the hand of the foxes, and to all the wild beasts[e][d][c][b]; and those beasts of the field began to tear apart those sheep.
translation:
  language: hi
  text: और उसने उन्हें सिंहों, तेंदुओं, भेड़ियों और लकड़बग्घों[a] के हाथ में, और लोमड़ियों[b] के हाथ में तथा सब जंगली पशुओं के वश में सौंप दिया; और वे मैदान के पशु[c] उन भेड़ों को फाड़ने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त पशु-नाम का अर्थ अनिश्चित है; ‘सियार’ भी संभव है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सियारों’। प्राचीन पशु-नामों में लोमड़ी और सियार के अर्थ कभी-कभी एक-दूसरे से मिलते हैं।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘मैदान/निर्जन प्रदेश के वे पशु’।
    reason: source_idiom
lexical_decisions:
- source_word: ወሐደጎሙ
  choice: और उसने उन्हें…सौंप दिया
  rationale: क्रिया में छोड़ देने अथवा किसी के अधिकार में कर देने का भाव है। न्याय के इस प्रसंग में ‘सौंप दिया’ सक्रिय सुपुर्दगी को व्यक्त करता है, पर प्रतीक का अर्थ खोलकर नहीं बताता।
- source_word: ውስተ እደ
  choice: के हाथ में
  rationale: मूल का सजीव मुहावरा सुरक्षित रखा गया है; हिन्दी में भी यह किसी के अधिकार में दिए जाने का स्वाभाविक बोध कराता है।
- source_word: አናብስት
  choice: सिंहों
  rationale: यहाँ शिकारी पशुओं की सूची में विशिष्ट रूप से सिंह अभिप्रेत हैं।
- source_word: አንምርት
  choice: तेंदुओं
  rationale: गीज़ शब्द सामी भाषाओं के उस पशु-नाम से संबंधित है जिसका अर्थ तेंदुआ है; ‘बाघ’ ऐतिहासिक और प्राणिवैज्ञानिक दृष्टि से कम उपयुक्त होगा।
- source_word: አዝእብት
  choice: भेड़ियों
  rationale: शिकारी पशुओं की इस सूची में यह सीधा और स्थापित समतुल्य है।
- source_word: አጽዕብት
  choice: लकड़बग्घों
  rationale: पशु की पहचान पूर्णतः निश्चित नहीं है; मुख्य पाठ में प्रचलित पहचान रखी गई है और ‘सियार’ को पादटिप्पणी में दिया गया है।
- source_word: ቈናጽል
  choice: लोमड़ियों
  rationale: यह सामान्य शाब्दिक समतुल्य है, यद्यपि प्राचीन पशु-नामों में लोमड़ी और सियार के अर्थ-क्षेत्र एक-दूसरे से मिल सकते हैं।
- source_word: ኵሉ አራዊት
  choice: सब जंगली पशुओं
  rationale: नाम लेकर गिनाए गए शिकारियों से आगे बढ़कर सभी वन्य पशुओं की व्यापक श्रेणी को व्यक्त करता है।
- source_word: ዝኩ አራዊተ ገዳም
  choice: वे वन-पशु
  rationale: यह पहले आए ‘सब जंगली पशुओं’ से अलग मूल पदबंध है। ‘वन-पशु’ निर्जन प्रदेश या खुले वन-क्षेत्र में रहने वाले पशुओं का स्वाभाविक हिन्दी रूप है।
- source_word: አሐዙ … ይምሥጥዎሙ
  choice: फाड़ने लगे
  rationale: पहली क्रिया आरम्भ का भाव देती है और अगली क्रिया हिंसक रूप से चीरने-फाड़ने का; संयुक्त हिन्दी रूप दोनों को संक्षेप में सुरक्षित रखता है।
- source_word: እልኩ አባግዕ
  choice: उन भेड़ों
  rationale: पशु-दर्शन में स्थापित प्रतीक ‘भेड़ें’ है और संकेतवाचक तत्व ‘उन’ से सुरक्षित है।
theological_decisions:
- issue: न्याय के चित्रण में कर्ता की भूमिका
  choice: उसने उन्हें…सौंप दिया
  alternative: उसने उन्हें…के हाथ में छोड़ दिया
  rationale: मूल क्रिया छोड़ने और अधिकार में सौंपने—दोनों अर्थ दे सकती है। प्रसंग में सक्रिय न्यायिक सुपुर्दगी का भाव प्रबल है; फिर भी अनुवाद यह नहीं बताता कि प्रतीकात्मक शिकारी किन ऐतिहासिक शक्तियों को दर्शाते हैं।
- issue: पशु-प्रतीकों की व्याख्या
  choice: पशुओं और भेड़ों के रूपक को ज्यों का त्यों रखा गया
  alternative: पशुओं को सीधे शत्रु राष्ट्र या राजनीतिक शक्तियाँ कहना
  rationale: मूल सर्वनाश-दर्शन की अस्पष्टता और धर्मवैचारिक तनाव को बनाए रखने के लिए प्रतीकों की व्याख्यात्मक पहचान मुख्य पाठ में नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘के हाथ में’ मूल न्यायिक और सर्वनाश-संबंधी बिंब को बनाए रखता है, जबकि ‘के वश में’ तीसरी संबद्धता को हिन्दी में स्वाभाविक बनाता है। अर्धविराम सुपुर्दगी और उसके हिंसक परिणाम के बीच स्पष्ट संबंध दिखाता है।
