base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/032.yaml
  text: And that sheep that led them returned and went up upon that rock[a]; and the sheep, while their eyes were blinded, went astray from the path that he had shown them[b], but that sheep did not know it.
translation:
  language: hi
  text: और वह भेड़, जो उनकी अगुवाई करती थी, लौटी और उस चट्टान पर चढ़ गई[a]। भेड़ें, जिनकी आँखें अंधी थीं[b], उस मार्ग से भटक गईं जो उसने उन्हें दिखाया था; पर उस भेड़ को इसका पता नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस ऊँचाई/चट्टानी कगार पर”; गीज़ शब्द किसी एक पत्थर के बजाय चट्टानी ऊँचाई को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जिनकी आँखें अंधी हो रही थीं।”
    reason: aspectual_alternative
lexical_decisions:
- source_word: ገብአ
  choice: लौटकर
  rationale: क्रिया का मूल अर्थ ‘आना/प्रवेश करना’ हो सकता है, किंतु कथा के क्रम में अगुवाई करने वाली भेड़ के वापस जाने का भाव सबसे उपयुक्त है।
- source_word: በግዕ / አባግዕ
  choice: भेड़ / भेड़ें
  rationale: दृष्टांत में भेड़ों की छवि लगातार बनी रहती है; मूल पाठ यहाँ लिंग या आयु को अधिक विशिष्ट नहीं करता।
- source_word: ዘይመርሖሙ
  choice: जो उनकी अगुवाई करती थी
  rationale: यह संबंधवाचक खंड उस भेड़ की मार्गदर्शक भूमिका बताता है और चलने की ठोस छवि बनाए रखता है।
- source_word: ዐርገ
  choice: चढ़ गई
  rationale: क्रिया ऊपर की ओर जाने को व्यक्त करती है; चट्टान के संदर्भ में ‘चढ़ गई’ स्वाभाविक और सजीव है।
- source_word: ድማኅ
  choice: चट्टान
  rationale: शब्द किसी चट्टानी ऊँचाई या कगार को भी सूचित कर सकता है; मुख्य पाठ में ठोस और सहज अर्थ लिया गया है तथा व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ይጸልሉ አዕይንቲሆሙ
  choice: जिनकी आँखें अंधी थीं
  rationale: यह उनकी दृष्टि की बाधित अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है; क्रियात्मक/प्रगतिशील संभावना पादटिप्पणी में सुरक्षित है।
- source_word: ይስሕቱ እምፍኖት
  choice: उस मार्ग से भटक गईं
  rationale: यह दिखाए गए रास्ते से हटने की शाब्दिक और प्रतीकात्मक दोनों छवियों को बनाए रखता है।
- source_word: እንተ አርአዮሙ
  choice: जो उसने उन्हें दिखाया था
  rationale: एकवचन कर्ता स्वाभाविक रूप से अगुवाई करने वाली भेड़ की ओर संकेत करता है।
- source_word: ኢያእመረ
  choice: इसका पता नहीं था
  rationale: यह ज्ञान या जागरूकता के अभाव को सरल आधुनिक हिन्दी में व्यक्त करता है, बिना उसे लापरवाही का दोष दिए।
theological_decisions:
- issue: अगुवाई करने वाली भेड़ की अनभिज्ञता को केवल न जानने के रूप में रखना या उसे लापरवाही मानना
  choice: उस भेड़ को इसका पता नहीं था
  alternative: उस भेड़ ने इस पर ध्यान नहीं दिया
  rationale: गीज़ पाठ ज्ञान या बोध के अभाव को कहता है, जानबूझकर उपेक्षा को नहीं; इसलिए कथात्मक तनाव को बिना अतिरिक्त नैतिक दोष जोड़े सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दृष्टांत की पशु-छवि के अनुरूप भाषा रखी गई है। ‘भेड़’ व्याकरणतः स्त्रीलिंग है, इसलिए संबंधित क्रियाएँ स्त्रीलिंग में हैं। वाक्य को दो भागों में बाँटकर पठनीयता बढ़ाई गई है, जबकि मूल घटनाक्रम और विरोधसूचक तनाव सुरक्षित है।
