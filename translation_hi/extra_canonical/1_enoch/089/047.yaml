translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘मैं देखता रहा, यहाँ तक कि’ द्वारा दर्शन-वर्णन की निरंतरता और मूल की ‘जब तक’ संरचना सुरक्षित रखी गई है।
