base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/047.yaml
  text: And the first ram pursued that later ram[a], and that later ram rose up and fled from before his face[c][b]; and I saw until those dogs brought down the first ram.
translation:
  language: hi
  text: और पहले मेढ़े[a] ने उस बाद वाले मेढ़े[b] का पीछा किया; वह बाद वाला मेढ़ा उठ खड़ा हुआ और उसके सामने से भाग गया[c]; और मैंने देखा, यहाँ तक कि उन कुत्तों ने पहले मेढ़े को गिरा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल शब्द संदर्भानुसार ‘मेढ़ा’ या ‘जंगली सूअर’ के अर्थ में आ सकता है; इस दर्शन के आसपास के प्रसंग में यहाँ ‘मेढ़ा’ अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पीछे आने वाला’ अथवा ‘दूसरा’; मूल शब्द क्रम में पहले मेढ़े के बाद आने वाले मेढ़े को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘उसके मुख के सामने से’; यह किसी के सामने से पीछे हटने या भागने की सामी अभिव्यक्ति है।
    reason: idiom
lexical_decisions:
- source_word: ሐርጌ
  choice: मेढ़ा
  rationale: इस शब्द के अर्थ संदर्भानुसार अलग हो सकते हैं, पर पशु-दर्शन के इस प्रसंग में यह भेड़ों का नेतृत्व करने वाले नर पशु को दर्शाता है; इसलिए ‘मेढ़ा’ आसपास की प्रतीक-व्यवस्था के अनुरूप है।
- source_word: ቀዳማዊ
  choice: पहला
  rationale: यह दो मेढ़ों के क्रम में पहले को स्पष्ट रूप से चिह्नित करता है।
- source_word: ዳሓራዊ / ዳሕራዊ
  choice: बाद वाला
  rationale: यह ‘पहले’ के विपरीत क्रम में आने वाले मेढ़े को बताता है, पर अनावश्यक रूप से उसे अंतिम मानकर अर्थ सीमित नहीं करता।
- source_word: ሰደዶ
  choice: पीछा किया
  rationale: क्रिया सक्रिय रूप से पीछे पड़ने या खदेड़ने का भाव व्यक्त करती है; ‘पीछा किया’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ተንሥአ
  choice: उठा
  rationale: मूल क्रिया उठने या खड़े होने का बोध देती है और इसके बाद भागने की कथा-गतिशीलता को बनाए रखती है।
- source_word: ነፍጸ
  choice: भाग गया
  rationale: यह आक्रमणकारी के सामने से पलायन का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: እምቅድመ ገጹ
  choice: उसके सामने से
  rationale: शाब्दिक अर्थ ‘उसके मुख के सामने से’ है; ‘उसके सामने से’ सामी मुहावरे को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: አክላብ
  choice: कुत्ते
  rationale: बहुवचन संज्ञा का सीधा अर्थ कुत्ते है; पाठ विशेष रूप से शिकारी कुत्ते नहीं कहता।
- source_word: አውደቅዎ
  choice: गिरा दिया
  rationale: कारक क्रिया किसी को गिराने का भाव देती है; यह हिंसक पशु-दृश्य को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
theological_decisions:
- issue: राजनीतिक अर्थ वाले प्रलयदर्शी दृश्य में पशु-प्रतीकों को बनाए रखना
  choice: मुख्य पाठ में पात्रों को ‘मेढ़ा’ और ‘कुत्ते’ ही रखा गया है।
  alternative: मुख्य पाठ में पशुओं की जगह सीधे ऐतिहासिक राजाओं, लोगों या राष्ट्रों के नाम देना।
