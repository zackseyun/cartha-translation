  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली रखी गई है। आरंभ की ‘एक भेड़’ और बाद की बहुवचन ‘भेड़ों’ का व्याकरणिक भेद जानबूझकर सुरक्षित है। ‘जंगली गधे’ पशु-दर्शन की प्रतीकात्मक शब्दावली के रूप में बनाए गए हैं।
