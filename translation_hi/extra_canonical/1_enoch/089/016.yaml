  choice: जिसे भेड़ियों से बचाया गया था
  rationale: पूर्ण हो चुके छुटकारे और वास्तविक संकट—दोनों को व्यक्त करता है।
- source_word: ነፈፀ
  choice: भाग निकली
  rationale: खतरे से तत्काल पलायन का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: ኀለፈ ውስተ አእዱገ ገዳም
  choice: जंगल के जंगली गधों के बीच जा पहुँची
  rationale: दूसरे पशु-समूह में प्रवेश की कठिन अभिव्यक्ति को सुरक्षित रखता है; इसे केवल भौगोलिक विवरण में नहीं बदलता।
- source_word: የአወይዉ ወይጸርኁ
  choice: विलाप करते, पुकारते
  rationale: श्रव्य दुःख और सहायता के लिए ऊँची पुकार की क्रमिकता बनाए रखता है।
- source_word: ይስእልዎ ለእግዚኦሙ
  choice: अपने प्रभु से विनती करते
  rationale: साधारण माँग के बजाय संकट में की गई गंभीर प्रार्थना का अर्थ देता है।
- source_word: በኵሉ ኃይሎሙ
  choice: अपनी पूरी शक्ति से
  rationale: उनकी पुकार के पूर्ण प्रयत्न और तीव्रता को सहज हिन्दी में व्यक्त करता है।
- source_word: እግዚአ አባግዕ
  choice: भेड़ों का वह प्रभु
  rationale: दर्शन में प्रयुक्त विशिष्ट ईश्वरीय उपाधि और पशु-रूपक दोनों सुरक्षित रहते हैं।
- source_word: ወረደ
  choice: नीचे उतरा
  rationale: स्वर्गीय निवास से नीचे आने की दिशात्मक छवि को स्पष्ट रूप से बनाए रखता है।
- source_word: ኀበ ቃሎሙ ለአባግዕ
  choice: भेड़ों की आवाज़ सुनकर
  rationale: संक्षिप्त गीइज़ वाक्यांश को स्वाभाविक हिन्दी में ईश्वरीय प्रत्युत्तर के रूप में व्यक्त करता है, बिना पुकार की विषयवस्तु जोड़ने के।
- source_word: እምጽርኁ ልዑል
  choice: अपने ऊँचे निवास से
  rationale: ጽርሕ को ‘निवास/कक्ष/महल’ और ልዑል को ‘ऊँचा’ समझता है; इसे समान दिखने वाले ‘पुकार’ शब्द के रूप में नहीं पढ़ता।
- source_word: ወበጽኀ ኀቤሆሙ ወርእዮሙ
  choice: वह उनके पास आया और उसने उन्हें देखा
  rationale: आगमन और देखने की दो क्रमिक क्रियाओं को स्रोत के समान अलग रखता है।
theological_decisions:
- issue: दर्शन में ईश्वर के लिए पशुपालक-संबंधी उपाधि
  choice: भेड़ों का प्रभु
  alternative: भेड़ों का स्वामी
  rationale: ‘प्रभु’ ईश्वरीय संप्रभुता को व्यक्त करता है और दर्शन की बार-बार आने वाली प्रतीकात्मक उपाधि को बिना सांप्रदायिक विस्तार के सुरक्षित रखता है।
- issue: प्रभु का नीचे उतरना
  choice: अपने ऊँचे निवास से नीचे उतरा
  alternative: अपने ऊँचे महल से उतरा
  rationale: ऊर्ध्वाधर ईश्वरीय हस्तक्षेप की छवि को बनाए रखते हुए ‘निवास’ स्रोत शब्द की व्यापक अर्थ-सीमा को सुरक्षित रखता है।
