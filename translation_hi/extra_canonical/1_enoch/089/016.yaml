base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/016.yaml
  text: And a sheep that had been rescued from the wolves fled and passed into the wild asses of the wilderness[a], and I saw the sheep as they lamented and cried out and petitioned their Lord with all their strength, until that Lord of the sheep came down at the voice of the sheep from his lofty dwelling[d][c][b], and he came to them and saw them.
translation:
  language: hi
  text: और एक भेड़, जिसे भेड़ियों से बचाया गया था, भाग निकली और निर्जन प्रदेश के जंगली गधों के बीच जा पहुँची[a]। फिर मैंने भेड़ों को विलाप करते, पुकारते और अपनी सारी शक्ति से अपने प्रभु से विनती करते देखा, जब तक कि भेड़ों का वह प्रभु भेड़ों की आवाज़ सुनकर अपने ऊँचे निवास से नीचे उतरा[b]। वह उनके पास आया और उसने उन्हें देखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल वाक्यांश का शब्द-विन्यास कठिन है। इसका आशय संभवतः यह है कि वह भेड़ दर्शन में दिखाए गए एक दूसरे पशु-समूह—निर्जन प्रदेश के जंगली गधों—के बीच चली गई; इसे केवल किसी भूभाग का वर्णन नहीं समझना चाहिए।
    reason: textual_variant
  - marker: b
    text: ‘ऊँचे निवास’ का अनुवाद ‘ऊँचे कक्ष’ या ‘ऊँचे महल’ भी किया जा सकता है। यहाँ प्रयुक्त शब्द पुकार नहीं, बल्कि निवास-स्थान को सूचित करता है।
    reason: lexical_alternative
