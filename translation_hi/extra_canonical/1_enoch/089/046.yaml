base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/046.yaml
  text: And he went to it and spoke to it alone[a], and raised up that ram, and made it ruler and leader of the sheep; and through all this[c][b], the dogs were afflicting the sheep.
translation:
  language: hi
  text: तब वह उसके पास गया और उससे अकेले में बात की। उसने उस मेढ़े को उठाया[a] और उसे भेड़ों का शासक और अगुआ बनाया; और इस सबके दौरान कुत्ते भेड़ों को सताते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस मेढ़े को ऊँचा उठाया।” क्रिया शाब्दिक रूप से उठाने की छवि रखती है; अगले वाक्य में उसे शासक और अगुआ बनाया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሖረ፡ ኀቤሁ
  choice: तब वह उसके पास गया
  rationale: गति और लक्ष्य दोनों को स्वाभाविक हिन्दी में व्यक्त किया गया है। पशु-दर्शन के संदर्भ में सर्वनाम का पशु-पूर्वपद बनाए रखा गया है।
- source_word: ወተናገረ፡ ለባሕቲቱ
  choice: और उससे अकेले में बात की
  rationale: ለባሕቲቱ का अर्थ ‘उसी से अकेले’ अथवा ‘एकांत में’ है; इसे किसी नए कर्म, जैसे ‘उस मेढ़े से’, के रूप में नहीं लिया गया।
- source_word: ወአንሥአ፡ ለውእቱ፡ ሐርጌ
  choice: उस मेढ़े को ऊँचा उठाया
  rationale: यहाँ ሐርጌ का अर्थ ‘मेढ़ा’ है और ለ निश्चित कर्म को चिह्नित करता है। ‘ऊँचा उठाया’ मूल क्रिया और उसके अधिकारपूर्ण उत्कर्ष—दोनों की संभावना सुरक्षित रखता है।
- source_word: ወገብረ፡ መኰንነ፡ ወመራሔ፡ ለአባግዕ
  choice: और उसे भेड़ों का शासक और अगुआ बनाया
  rationale: दो अलग अधिकार-सूचक पदों को ‘शासक’ और ‘अगुआ’ के रूप में बनाए रखा गया है; ለአባግዕ को उसके शासन और अगुवाई के क्षेत्र के रूप में समझा गया है।
- source_word: ወበኵሉዝ
  choice: और इस सबके दौरान
  rationale: यह पद अगले संज्ञा ‘कुत्तों’ का परिमाण नहीं, बल्कि साथ-साथ चल रही परिस्थिति अथवा अवधि बताता है।
- source_word: አክላብ፡ ያጸህቅዎሙ፡ ለአባግዕ
  choice: कुत्ते भेड़ों को सताते रहे
  rationale: क्रिया लगातार दबाने, पीड़ित करने या सताने का भाव रखती है। ‘सताते रहे’ चलती हुई क्रिया और शत्रुतापूर्ण दबाव दोनों को सरल आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मेढ़े को ‘ऊँचा उठाने’ का राजनीतिक या धार्मिक अर्थ स्पष्ट कर देना
  choice: दर्शन की प्रतीकात्मक भाषा को ‘ऊँचा उठाया’ के रूप में बनाए रखना
  alternative: उसे अधिकार दिया / उसे पद पर नियुक्त किया
  rationale: अगला वाक्य उसके शासक और अगुआ बनाए जाने की बात स्पष्ट करता है। इसलिए पहले ही चरण में प्रतीक को व्याख्यात्मक राजनीतिक भाषा से बदलना अनावश्यक है।
