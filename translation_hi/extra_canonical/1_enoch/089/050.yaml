base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/050.yaml
  text: And that house became great and broad, and it was built for those sheep; and a lofty and great tower was built upon the house for the Lord of the sheep. And that house was low, but the tower was raised up and became lofty; and the Lord of the sheep stood upon that tower, and they set a full table before him.
translation:
  language: hi
  text: और वह भवन बड़ा और चौड़ा हो गया और उन भेड़ों के लिए बनाया गया; और भेड़ों के प्रभु के लिए उस भवन के ऊपर एक ऊँची और विशाल मीनार बनाई गई। वह भवन नीचा था, पर मीनार ऊपर उठाई गई और ऊँची हो गई; और भेड़ों का प्रभु उस मीनार पर खड़ा हुआ, और उन्होंने उसके सामने भोजन से भरी मेज़ रखी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቤት
  choice: भवन
  rationale: दृष्टांत में यह किसी सामान्य घर से अधिक एक सामुदायिक और उपासना-संबंधी संरचना है; ‘भवन’ हिंदी में स्वाभाविक रहते हुए इस व्यापक अर्थ को बनाए रखता है।
- source_word: ማኅፈድ
  choice: मीनार
  rationale: इस पद में संरचना भवन के ऊपर बनाई जाती, ऊपर उठती और प्रभु के खड़े होने का स्थान बनती है; इसलिए ‘मीनार’ प्रसंगानुकूल है।
- source_word: ነዋኅ
  choice: ऊँची
  rationale: यह ऊर्ध्व विस्तार को व्यक्त करता है; सरल आधुनिक हिंदी में ‘ऊँची’ स्वाभाविक है और किसी अतिरिक्त प्रतीकात्मक अर्थ को आरोपित नहीं करती।
- source_word: እግዚአ፡ አባግዕ
  choice: भेड़ों का प्रभु
  rationale: मूल रूपक और स्वामित्व-संबंध को सीधे सुरक्षित रखा गया है।
- source_word: ማእደ፡ ምልእተ
  choice: भोजन से भरी मेज़
  rationale: शाब्दिक ‘भरी हुई मेज़’ हिंदी में अधूरा लग सकता है; ‘भोजन से’ उस स्वाभाविक आशय को स्पष्ट करता है, बिना भोज या बलिदान का अनावश्यक विशिष्टीकरण किए।
theological_decisions:
- issue: भवन और मीनार की प्रतीकात्मक पहचान
  choice: अनुवाद में केवल दृश्य-रूपक रखा गया है
  alternative: भवन को मंदिर और मीनार को वेदी अथवा पवित्र स्थान के रूप में स्पष्ट करना
  rationale: पद स्वयं प्रतीकों की ऐतिहासिक या धार्मिक पहचान नहीं बताता; उन्हें अनुवाद में निश्चित करना मूल की खुली प्रतीकात्मकता को संकुचित करता।
- issue: प्रभु के लिए मीनार बनाए जाने का संबंध
  choice: ‘भेड़ों के प्रभु के लिए’
  alternative: ‘भेड़ों के प्रभु की मीनार’
  rationale: मूल में प्रयोजन/हित का संबंध है; स्वामित्व में बदलने के बजाय वही संबंध बनाए रखा गया है।
- issue: भरी मेज़ का आशय
  choice: ‘भोजन से भरी मेज़’
  alternative: ‘बलि की भेंटों से भरी मेज़’
  rationale: मूल केवल पूर्ण/भरी मेज़ कहता है; बलिदान-संबंधी व्याख्या संभव हो सकती है, पर उसे पाठ में जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सहज। रूपक के मुख्य पद—भेड़ें, भवन, मीनार, प्रभु और मेज़—अव्याख्यायित रखे गए हैं। समान मूल विशेषण की पुनरावृत्ति के अनुरूप ‘ऊँची’ को दोनों स्थानों पर रखा गया है।
