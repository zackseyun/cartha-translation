base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/006.yaml
  text: And that vessel floated upon the water[a], and all the bulls and elephants and camels and donkeys were swallowed up into the earth; and all the beasts—I could not see them—and they were not able to come out[e][d][c][b], but perished and sank into the depths.
translation:
  language: hi
  text: और वह मस्तूल पानी पर तैरता रहा[a]। सभी बैल, हाथी, ऊँट और गधे धरती में समा गए; और वे सभी पशु—मैं उन्हें देख नहीं सका—बाहर नहीं निकल सके। वे नष्ट हो गए और गहराइयों में डूब गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त गीइज़ शब्द का अर्थ ‘खड़ा काष्ठ’ भी हो सकता है। इस स्वप्न-दृश्य में वस्तु की ठीक पहचान पूरी तरह निश्चित नहीं है; एक वैकल्पिक पाठ-परंपरा में इसे पानी में नीचे जाते हुए समझा गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘गहरे जल में’ भी हो सकता है; अन्य सम्भव अनुवाद हैं ‘समुद्र में’ या ‘अथाह गर्त में’।
    reason: lexical_alternative
