  rationale: ‘गहराइयों’ प्रलय और न्याय के अशुभ बिंब को बनाए रखता है, पर बाद की किसी विशिष्ट धर्मवैज्ञानिक धारणा को पाठ पर आरोपित नहीं करता।
- issue: पशुओं के लुप्त होने वाले वाक्यांश का कर्ता
  choice: ‘मैं उन्हें देख नहीं सका’ को कथावाचक का अंतःक्षेप माना गया
  alternative: ‘मवेशियों और पक्षियों ने उन्हें देखा’
  rationale: संशोधित गीइज़ पठन सम्भावित OCR दोष के बाद प्रथम पुरुष ‘मैं नहीं कर सका’ और ‘उन्हें देखना’ का समर्थन करता है; इससे अनुप्रमाणित ‘पक्षियों’ को पाठ में जोड़ने से बचा गया है।
