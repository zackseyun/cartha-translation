  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। पशु-सूची और प्रलयकारी स्वप्न-बिंब को ठोस रखा गया है। स्रोत-पाठ की दो वास्तविक अनिश्चितताओं—प्रारम्भिक वस्तु/क्रिया और अंतिम गहराई—को मुख्य पाठ में जबरन हल करने के बजाय पाद-टिप्पणियों में स्पष्ट किया गया है।
