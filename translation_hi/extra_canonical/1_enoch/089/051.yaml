base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/051.yaml
  text: And again I saw those sheep[a], how they went astray and walked in many paths, and they abandoned that house of their Lord. And the Lord of the sheep called some from among the sheep and sent them to the sheep[c][b], but the sheep began to kill them.
translation:
  language: hi
  text: और मैंने फिर उन भेड़ों को देखा कि वे कैसे भटक गईं और बहुत-से मार्गों पर चलीं। उन्होंने अपने प्रभु का वह घर छोड़ दिया। तब भेड़ों के प्रभु[a] ने भेड़ों में से कुछ को बुलाकर उन्हें भेड़ों के पास भेजा, और भेड़ें उन्हें मारने लगीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भेड़ों के स्वामी।” गीइज़ शब्द का अर्थ ‘प्रभु’ या ‘स्वामी’ दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'अंतिम वाक्यांश का अर्थ अधिक ठोस रूप में यह भी हो सकता है: “और भेड़ों ने उन्हें मार डालने के लिए पकड़ लिया।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢክዎሙ ካዕበ ለዝኩ አባግዕ ካዕበ
  choice: और मैंने फिर उन भेड़ों को देखा
  rationale: दृष्टि-वर्णन के पुनरावर्ती सूत्र और संकेतवाचक बल को रखा गया है; गीइज़ में ‘फिर’ की पुनरुक्ति को स्वाभाविक हिन्दी में एक बार व्यक्त किया गया है।
- source_word: ከመ ስሕቱ
  choice: कि वे कैसे भटक गईं
  rationale: यह क्रिया भटकने या भूल करने का भाव रखती है; ‘भटक गईं’ भेड़ों के प्रत्यक्ष बिंब और नैतिक आशय दोनों को बनाए रखता है।
- source_word: ወሖሩ በብዙሕ ፍናዋት
  choice: और बहुत-से मार्गों पर चलने लगीं
  rationale: अनेक मार्गों के ठोस बिंब को किसी अमूर्त व्याख्या में बदले बिना सहज हिन्दी में प्रस्तुत किया गया है।
- source_word: ወሐደጉ ዝኩ ቤተ ዚአሆሙ
  choice: उन्होंने अपने स्वामी का वह भवन छोड़ दिया
  rationale: ‘छोड़ दिया’ यहाँ जानबूझकर परित्याग का भाव देता है और हिन्दी में स्वाभाविक है; संबंधसूचक पद को अगले वाक्य के स्वामी/प्रभु से जोड़ा गया है।
- source_word: ወእግዚኦሙ ለአባግዕ
  choice: अपने स्वामी / भेड़ों के प्रभु
  rationale: गीइज़ पद ‘स्वामी’ और ‘प्रभु’ दोनों अर्थ रखता है। भवन के संबंध में ‘स्वामी’ स्वाभाविक है, जबकि दैवी पात्र के स्पष्ट उल्लेख में ‘प्रभु’ उसके धार्मिक भार को बनाए रखता है।
- source_word: ጸውዐ እምውስተቶሙ ለአባግዕ
  choice: भेड़ों में से कुछ को बुलाकर
  rationale: समूह के भीतर से चुने जाने का अर्थ स्पष्ट करने के लिए ‘कुछ’ स्वाभाविक रूप से जोड़ा गया है।
- source_word: ወለአኮሙ ኀበ አባግዕ
  choice: भेड़ों के पास भेजा
  rationale: यह भेजे जाने या दायित्व देकर भेजने की क्रिया है; ‘भेजा’ सरल और अर्थनिष्ठ है।
- source_word: ወአባግዕ አኃዙ ይቅትልዎሙ
  choice: पर भेड़ें उन्हें मारने लगीं
  rationale: संक्षिप्त गीइज़ रचना आरंभिक क्रिया (‘मारने लगीं’) अथवा पकड़कर मारने के इरादे का संकेत दे सकती है; मुख्य पाठ में पहले अर्थ को रखा गया और दूसरा पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: भेड़ों के रूपक में እግዚእ का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस दर्शन में यह पात्र परमेश्वर का प्रतिनिधित्व करता है; ‘प्रभु’ धार्मिक महत्त्व बनाए रखता है, जबकि ‘स्वामी’ संभावित शाब्दिक विकल्प के रूप में पादटिप्पणी में सुरक्षित है।
- issue: बहुविध मार्गों का अर्थ
  choice: ठोस रूपक को ‘बहुत-से मार्गों’ के रूप में बनाए रखना
  alternative: इसे सीधे अवज्ञा या धर्मत्याग कहना
  rationale: मूल पाठ स्वयं प्रतीकात्मक बिंब देता है; किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को मुख्य पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। पशु-दर्शन के रूपकों—भेड़ें, मार्ग और भवन—को अक्षुण्ण रखा गया है। स्त्रीलिंग बहुवचन ‘भेड़ें’ के अनुरूप क्रिया-सामंजस्य रखा गया है; ‘प्रभु’ और ‘स्वामी’ के बीच मूल की अर्थगत व्यापकता पादटिप्पणी से सुरक्षित की गई है।
