base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/012.yaml
  text: And that bull which was born from him begot a black wild boar and a white sheep[a]; and that wild boar produced many boars[c][b], and that sheep produced twelve sheep.
translation:
  language: hi
  text: और उस बैल ने, जो उससे उत्पन्न हुआ था, एक काला जंगली सूअर और एक सफेद भेड़ उत्पन्न किए[a]। उस जंगली सूअर ने बहुत-से जंगली सूअर उत्पन्न किए[b], और उस सफेद भेड़ ने बारह भेड़ें उत्पन्न कीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पशु-वंशावली दर्शन में लोगों या वंशों की प्रतीकात्मक शृंखला को आगे बढ़ाती जान पड़ती है; अनुवाद संभावित ऐतिहासिक पहचानों के स्थान पर मूल पशु-बिंबों को बनाए रखता है।
    reason: cultural_note
  - marker: b
    text: गीज़ पाठ काले जंगली सूअर और सफेद भेड़ के बीच स्पष्ट भेद करता है; दर्शन में रंगों का यह विरोध अर्थपूर्ण हो सकता है, इसलिए उसे यथावत रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ላህም
  choice: बैल
  rationale: पुल्लिंग संकेतक ውእቱ और पुल्लिंग संबंधवाचक रूप ዘተወልደ के अनुरूप यहाँ नर गोवंश अभिप्रेत है; इसलिए ‘बछिया’ या ‘गाय’ नहीं, ‘बैल’ चुना गया।
- source_word: ሐራዊያ ገዳም ጸሊመ
  choice: काला जंगली सूअर
  rationale: पद जंगली शूकर को दर्शाता है और काला रंग स्पष्ट है; दर्शन में प्रजाति और रंग, दोनों का प्रतीकात्मक अंतर सुरक्षित रखा गया है।
- source_word: በግዐ ጸዐዳ
  choice: सफेद भेड़
  rationale: मूल में भेड़ का बिंब और सफेद रंग स्पष्ट हैं, जबकि लिंग को हिंदी में अधिक विशिष्ट करना आवश्यक नहीं।
- source_word: አሕርወ ብዙኃነ
  choice: बहुत-से जंगली सूअर
  rationale: पहले आए जंगली सूअर के साथ प्रतीकात्मक निरंतरता बनाए रखने के लिए बहुवचन को उसी पदावली से व्यक्त किया गया है।
- source_word: ዐሠርተ ወክልኤተ አባግዐ
  choice: बारह भेड़ें
  rationale: संख्या का शाब्दिक अर्थ ‘दस और दो’ है और संज्ञा भेड़ का बहुवचन है; आयु पर अनावश्यक बल न देने के लिए ‘मेमने’ नहीं चुना गया।
theological_decisions:
- issue: पशु-दर्शन में प्रतीकात्मक पहचानों का अनुवाद
  choice: मुख्य पाठ में पशु-बिंबों को ज्यों का त्यों रखना
  alternative: पशुओं के स्थान पर इसहाक, एसाव, याकूब या उनसे जुड़े वंशों के नाम देना
  rationale: यह खंड सतत प्रतीकात्मक पशु-दर्शन के रूप में बोलता है। ऐतिहासिक पहचान को मुख्य पाठ में डालना मूल की काव्यात्मक और रहस्यदर्शी अस्पष्टता को समय से पहले समाप्त कर देगा।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘का पिता बना’ से ወለደ की जननार्थक सक्रियता और बैल का पुल्लिंग स्पष्ट होता है; आगे पुनरावृत्ति से बचने और स्वाभाविक हिंदी के लिए ‘से ... उत्पन्न हुए’ प्रयोग किया गया है।
