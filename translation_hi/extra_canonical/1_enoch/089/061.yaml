base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/061.yaml
  text: And he called to another and said to him[a], “Take note and see all that the shepherds are doing to these sheep[c][b]; for they are destroying among them more than I commanded them.”
translation:
  language: hi
  text: और उसने किसी दूसरे को बुलाकर उससे कहा, “ध्यान दे[a] और देख कि ये चरवाहे इन भेड़ों के साथ क्या-क्या कर रहे हैं; क्योंकि वे इन भेड़ों में से जितनी भेड़ों को नष्ट करने का मैंने उन्हें आदेश दिया था, उससे कहीं अधिक भेड़ों को नष्ट कर रहे हैं[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सावधान हो”; मूल अभिव्यक्ति सावधानी से ध्यान देने के लिए मन या हृदय लगाने का भाव रखती है।
    reason: lexical_alternative
  - marker: b
    text: “इन भेड़ों में से” झुंड के भीतर से भेड़ों के नष्ट किए जाने का अंशसूचक भाव व्यक्त करता है। वाक्य यह भी बताता है कि चरवाहे उन्हें दिए गए आदेश की सीमा से आगे निकल गए।
    reason: source_clarification
lexical_decisions:
- source_word: ለካልእ
  choice: एक दूसरे को
  rationale: यहाँ ካልእ का अर्थ किसी अन्य या एक और पात्र से है; पहचान को अनावश्यक रूप से निश्चित किए बिना कथानक का क्रम सुरक्षित रहता है।
- source_word: ለቡ ወርኢ
  choice: ध्यान दे और देख
  rationale: पहला आदेश मन लगाकर सावधानी से ध्यान देने का भाव रखता है और दूसरा प्रत्यक्ष देखने का; हिन्दी में दोनों क्रियाएँ अलग रखी गई हैं।
- source_word: ኵሎ ዘይገብሩ
  choice: क्या-क्या कर रहे हैं
  rationale: यह स्वाभाविक हिन्दी में कार्यों की समग्रता व्यक्त करता है, जो मूल के ‘सब जो वे कर रहे हैं’ के अनुरूप है।
- source_word: ኖሎት
  choice: चरवाहे
  rationale: पशु-दर्शन के रूपक को बनाए रखता है और ‘पास्टर’ जैसे कलीसियाई अर्थ आरोपित नहीं करता।
- source_word: ዲበ እሉ አባግዕ
  choice: इन भेड़ों के साथ
  rationale: ዲበ मूलतः ‘पर/ऊपर’ हो सकता है, पर यहाँ चरवाहों के व्यवहार के लक्ष्य के लिए ‘के साथ’ स्वाभाविक है और ‘विरुद्ध’ कहकर शत्रुता को मूल से अधिक स्पष्ट नहीं करता।
- source_word: ያሐጕሉ
  choice: नष्ट कर रहे हैं
  rationale: यह विनाशकारी क्रिया का व्यापक अर्थ बनाए रखता है और इसे केवल प्रत्यक्ष वध तक सीमित नहीं करता।
- source_word: እምውስተቶሙ
  choice: उनके बीच से
  rationale: 'እም (‘से’) और ውስተ (‘भीतर/बीच’) के संयुक्त, अंशसूचक भाव को व्यक्त करता है: झुंड के बीच से भेड़ें नष्ट की जा रही हैं।'
- source_word: ፈድፋደ እምዘ አዘዝክዎሙ
  choice: जितना मैंने उन्हें आदेश दिया था, उससे कहीं अधिक
  rationale: तुलनात्मक अतिक्रमण और आदेश देने वाले के अधिकार—दोनों को स्पष्ट रखते हुए स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: चरवाहों के अपराध का स्वरूप
  choice: चरवाहे दिए गए सीमित आदेश से आगे बढ़कर अधिक विनाश करते हैं।
  alternative: चरवाहों ने केवल अपने कर्तव्य की उपेक्षा की, या यह केवल संख्या की तटस्थ तुलना है।
  rationale: विनाश-सूचक क्रिया और ‘आदेश से अधिक’ की तुलना दोषपूर्ण अतिक्रमण दिखाती है। फिर भी वाक्य में निहित यह तनाव सुरक्षित रखा गया है कि कुछ सीमा तक विनाश का आदेश वास्तव में दिया गया था।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली। पशु-दर्शन की रूपकात्मक शब्दावली बनाए रखी गई है। एकवचन संबोधन के कारण ‘ध्यान दे’ और ‘देख’ प्रयुक्त हैं; अस्पष्ट स्वर्गीय पात्र की पहचान नहीं जोड़ी गई।
