base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/036.yaml
  text: And I saw in the vision until that sheep became a man[a], and built a house for the Lord of the sheep[c][b], and he placed all the sheep in that house.
translation:
  language: hi
  text: और मैंने दर्शन में देखा कि वह भेड़ एक मनुष्य बन गई[a] और उसने भेड़ों के प्रभु के लिए एक भवन बनाया[b]; फिर उसने सब भेड़ों को उस भवन में रख दिया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: भेड़ का ‘एक मनुष्य’ बनना दर्शन के प्रतीकात्मक रूपांतरण का भाग है; यहाँ उस आकृति की पहचान नहीं बताई गई है।
    reason: cultural_note
  - marker: b
    text: मूल शब्द का सामान्य अर्थ ‘घर’ या ‘भवन’ है; इस प्रसंग में मंदिर या पवित्रस्थान का संकेत हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से इसका अनुवाद ‘उसने सब भेड़ों को उस भवन में खड़ा किया’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ
  choice: भेड़
  rationale: पशु-दर्शन की लगातार बनी प्रतीकात्मक छवि को सुरक्षित रखता है; प्रसंग यहाँ मेमने या मेढ़े जैसी आयु अथवा लिंग-विशिष्टता की माँग नहीं करता।
- source_word: ኮነ ብእሴ
  choice: एक मनुष्य बन गई
  rationale: क्रिया और संज्ञा का मेल दर्शन के भीतर रूपांतरण व्यक्त करता है। हिंदी में व्याकरणिक अन्विति ‘भेड़’ के स्त्रीलिंग के अनुसार रखी गई है, जबकि ‘मनुष्य’ रूपांतरित आकृति को स्पष्ट करता है।
- source_word: ሐነጸ ቤተ
  choice: एक भवन बनाया
  rationale: मूल में सामान्य अर्थ ‘घर/भवन’ है। ‘भवन’ गरिमापूर्ण और स्वाभाविक हिंदी है तथा मंदिर का अर्थ सीधे आरोपित किए बिना उपासना-स्थल की संभावित ध्वनि के लिए जगह छोड़ता है।
- source_word: ለእግዚአ አባግዕ
  choice: भेड़ों के प्रभु के लिए
  rationale: ‘प्रभु’ እግዚአ के स्वामी/प्रभु अर्थ और इस दर्शन के ऊँचे धार्मिक संदर्भ दोनों को व्यक्त करता है।
- source_word: አቀሞሙ
  choice: सब भेड़ों को ... ठहरा दिया
  rationale: कारक क्रिया में खड़ा करने, रखने या स्थापित करने का भाव है। ‘ठहरा दिया’ घर के भीतर नियत रूप से रखने का स्वाभाविक हिंदी रूप है, जबकि शाब्दिक ‘खड़ा किया’ की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: በውእቱ ቤት
  choice: उस भवन में
  rationale: संकेतवाचक ‘उस’ और पूर्वोक्त भवन का स्पष्ट संदर्भ दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: ቤተ को सामान्य ‘भवन/घर’ अथवा व्याख्यात्मक ‘मंदिर’ कहना
  choice: भवन
  alternative: मंदिर अथवा पवित्रस्थान
  rationale: गीज़ पाठ सामान्य शब्द ‘घर/भवन’ देता है। भेड़ों के प्रभु के लिए बनाए जाने के कारण मंदिर-संबंधी संकेत संभव है, पर उसे मुख्य पाठ में निश्चित करना अनावश्यक व्याख्या होगी।
- issue: मनुष्य बनने वाली भेड़ की पहचान
  choice: पहचान को अनिर्धारित रखा गया
  alternative: मूसा अथवा किसी धार्मिक नेतृत्वकर्ता के रूप में स्पष्ट पहचान
  rationale: पद स्वयं प्रतीकात्मक रूपांतरण बताता है, पर पात्र का नाम नहीं देता; इसलिए अनुवाद व्याख्यात्मक पहचान नहीं जोड़ता।
- issue: አቀሞሙ में खड़ा करने और स्थापित/रखने के बीच अर्थ-संतुलन
  choice: ठहरा दिया
  alternative: खड़ा किया
  rationale: यह हिंदी में दृश्य की स्थानगत क्रिया को सहज बनाता है, जबकि मूल की अधिक शाब्दिक कारक छवि पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण शैली रखी गई है। पशु-दर्शन की प्रतीकात्मक भाषा और उसका असामान्य रूपांतरण यथावत हैं। ‘भवन’ को मुख्य पाठ में रखकर ‘मंदिर’ की संभावित धार्मिक ध्वनि पादटिप्पणी में दी गई है।
