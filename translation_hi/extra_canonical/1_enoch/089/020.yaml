base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/020.yaml
  text: And the Lord of the sheep came to them[a], and while they were striking those wolves, and the wolves were crying out, the sheep became silent[c][b], and from that time they cried out no more.
translation:
  language: hi
  text: और भेड़ों का प्रभु उनके पास आया। जब वे उन भेड़ियों पर प्रहार कर रहे थे और भेड़िए चिल्ला रहे थे, तब भेड़ें चुप हो गईं, और तब से भेड़ों ने फिर पुकार नहीं की।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यदि अंतिम शब्द का प्रदत्त प्रतिलेखन አፀርኁ सही हो, तो उसका अर्थ लगभग ‘तब से वे चिल्लाए’ होता है, जो ‘भेड़ें चुप हो गईं’ के साथ कठिन तनाव उत्पन्न करता है। आलोचनात्मक पाठ में አጸርዑ (‘वे रुक गए’ या ‘उन्होंने बंद कर दिया’) पाठ मिलता है; उसी के अनुसार यहाँ ‘भेड़ों ने फिर पुकार नहीं की’ अनुवाद किया गया है। मूल क्रम में अंतिम क्रिया का कर्ता पूर्णतः स्पष्ट नहीं है।
    reason: textual_variant
lexical_decisions:
- source_word: እግዚኦሙ
  choice: भेड़ों का प्रभु
  rationale: पशु-दर्शन में यह पद भेड़ों पर परमेश्वर के प्रभुत्व को सूचित करता है। स्पष्ट संबंध रखने से प्रतीकात्मक रूपरेखा बनी रहती है।
- source_word: መጽአ ኀቤሆሙ
  choice: उनके पास आया
  rationale: गति और लक्ष्य को व्यक्त करने वाला सहज आधुनिक हिन्दी प्रयोग।
- source_word: አባግዕ
  choice: भेड़ें
  rationale: सामूहिक ‘झुंड’ की अपेक्षा पशु-दर्शन में लोगों की बार-बार आने वाली प्रतीकात्मक पहचान को बनाए रखता है।
- source_word: ይዝብጥዎሙ ለእልኩ አዝእብት
  choice: वे उन भेड़ियों को मार रहे थे
  rationale: यहाँ ለ प्रत्यक्ष कर्म को चिह्नित करता है; अतः भेड़िए मारने वाले नहीं, बल्कि मारे जाने वाले हैं। ‘मार रहे थे’ हिंसक प्रहार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: አዝእብት
  choice: भेड़िए
  rationale: दर्शन की विशिष्ट पशु-प्रतीकात्मकता को सुरक्षित रखता है।
- source_word: የአውይዉ
  choice: चिल्ला रहे थे
  rationale: यह विलाप, पुकार अथवा ऊँची आवाज़ के व्यापक अर्थ को रखता है; ‘हुआँ-हुआँ’ कहना मूल से अधिक पशुवत अर्थ जोड़ता।
- source_word: አርመሙ
  choice: चुप हो गईं
  rationale: कथा में आवाज़ से मौन की ओर हुए परिवर्तन को सहज और स्पष्ट ढंग से व्यक्त करता है।
- source_word: እምሶቤሃ አጸርዑ
  choice: उस समय से उन्होंने फिर कोई आवाज़ नहीं की
  rationale: आलोचनात्मक रूप से संभावित አጸርዑ (‘वे रुक गए/उन्होंने बंद कर दिया’) को पूर्ववर्ती मौन के संदर्भ में स्वाभाविक हिन्दी में स्पष्ट किया गया है। प्रदत्त प्रतिलेखन का አፀርኁ संभवतः OCR त्रुटि है।
theological_decisions:
- issue: पशु-दर्शन में प्रभु की पहचान
  choice: ‘भेड़ों का प्रभु’ को दर्शन के भीतर परमेश्वर-सूचक पद के रूप में रखना
  alternative: ‘उनका स्वामी’, जो पहचान को कम स्पष्ट रखता
  rationale: पशु-दर्शन में भेड़ों और उनके दिव्य अधिपति का संबंध बार-बार आता है। यह अनुवाद उसी प्रतीकात्मक संबंध को सुरक्षित रखता है और बाद की कोई विशिष्ट सांप्रदायिक व्याख्या नहीं जोड़ता।
- issue: अंतिम क्रिया के पाठ और कर्ता की कठिनाई
  choice: संभावित संशोधित पाठ ‘वे रुक गए’ को भेड़ों की आवाज़ बंद होने के रूप में प्रस्तुत करना
  alternative: प्रदत्त प्रतिलेखन के अनुसार ‘उस समय से वे चिल्लाए’, जो पूर्ववर्ती ‘भेड़ें चुप हो गईं’ से तनाव पैदा करता है
  rationale: चार्ल्स के आलोचनात्मक पाठ और प्रसंग से አጸርዑ (‘वे रुक गए’) की पुष्टि होती है; फिर भी पांडुलिपि/प्रतिलेखन की कठिनाई को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। पशु-दर्शन की संज्ञाएँ स्पष्ट रखी गई हैं। ‘प्रहार कर रहे थे’ की अपेक्षा ‘मार रहे थे’ अधिक सामान्य है, जबकि संदर्भ की हिंसा भी बनाए रखता है।
