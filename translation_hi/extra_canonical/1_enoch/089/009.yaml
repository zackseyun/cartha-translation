base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/009.yaml
  text: And that white bull[a], which had become a man, went out from that enclosure, and with him came three bulls. And one of those three bulls was white, resembling that white bull, and one of them was red like blood, and one was black[c][b]; and that white bull departed from among them.
translation:
  language: hi
  text: और वह सफेद बैल, जो मनुष्य बन गया था, उस जहाज़[a] से बाहर निकला; उसके साथ तीन बैल भी निकले। उन तीन बैलों में से एक सफेद था और उस बैल के समान दिखता था; एक लहू के समान लाल था, और एक काला था। फिर वह सफेद बैल उनके बीच से चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दिए गए गीइज़ प्रतिलेख में यहाँ का अंतिम शब्द पाठगत रूप से कठिन है। प्रसंग और एक संभावित पाठ के आधार पर अर्थ ‘जहाज़’ या ‘जलयान’ हो सकता है; कुछ पाठ-प्रस्तुतियाँ इसे अधिक सामान्य स्थान अथवा घेरे के रूप में समझती हैं।
    reason: textual_variant
lexical_decisions:
- source_word: ላህም
  choice: बैल
  rationale: पशु-दर्शन में यह शब्द नर गोवंश की प्रतीकात्मक आकृति के लिए बार-बार आता है; ‘बैल’ इस बिंब को सामान्य ‘पशु’ से अधिक स्पष्ट रूप में बनाए रखता है।
- source_word: ጸዐዳ
  choice: सफेद
  rationale: रंग इस दर्शन की प्रतीक-व्यवस्था में महत्त्वपूर्ण है; सीधा रंगवाचक अनुवाद सबसे उपयुक्त है।
- source_word: ዘኮነ ብእሴ
  choice: जो मनुष्य बन गया था
  rationale: यह रूपांतरण और कथा में उसके पहले घटित होने—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ወጽአ እምዝኩ መስቀር
  choice: उस जहाज़ से बाहर निकला
  rationale: दिए गए प्रतिलेख का अंतिम शब्द कठिन या दूषित प्रतीत होता है, पर पाठ-संदर्भ और संभावित पाठ መርከብ किसी जलयान/जहाज़ की ओर संकेत करते हैं। अनिश्चितता को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ፪አልህምት
  choice: तीन बैल
  rationale: अंक-चिह्न और बहुवचन गोवंश-संज्ञा तीन बैलों को सूचित करते हैं; यह पूरे दृश्य की प्रतीकात्मक निरंतरता बनाए रखता है।
- source_word: ጸዐዳ ይመስሎ ለዝኩ ላህም
  choice: एक सफेद था और उस बैल के समान दिखता था
  rationale: ‘सफेद’ पहले बैल का विधेय है, जबकि अगला पद उसकी उस पूर्ववर्ती बैल से समानता बताता है। इससे तीनों बैलों के सफेद, लाल और काले रंगों का क्रम सुरक्षित रहता है।
- source_word: ቀይሕ ከመ ደም
  choice: लहू के समान लाल
  rationale: मूल की स्पष्ट उपमा और प्रलय-दर्शी दृश्य की तीव्रता दोनों सुरक्षित रहती हैं।
- source_word: ጸሊም
  choice: काला
  rationale: यह मूल रंगवाचक शब्द का सीधा और स्वाभाविक हिन्दी अनुवाद है।
- source_word: ኀለፈ እምኔሆሙ
  choice: उनके बीच से चला गया
  rationale: क्रिया जाने, बीतने या प्रस्थान करने का भाव रख सकती है। यह अनुवाद मृत्यु को स्पष्ट रूप से आरोपित किए बिना मूल की संभावित अर्थ-व्याप्ति को बनाए रखता है।
theological_decisions:
- issue: मनुष्य बने सफेद बैल और तीन बैलों की पहचान
  choice: मुख्य पाठ में केवल दर्शन के पशु-रूपक को बनाए रखा गया है।
  alternative: इन आकृतियों को नूह और उसके पुत्रों अथवा अन्य कुलपिताओं के रूप में सीधे नामित करना।
  rationale: यह पद स्वयं प्रतीकात्मक आकृतियों के नाम नहीं बताता; किसी पहचान को मुख्य अनुवाद में जोड़ना व्याख्या को पाठ का अंग बना देता।
- issue: अंतिम प्रस्थान का आशय
  choice: ‘उनके बीच से चला गया’ द्वारा प्रस्थान और संभावित मृत्यु के बीच निहित अस्पष्टता रखी गई है।
  alternative: ‘मर गया’ या ‘उनसे अलग हो गया’।
  rationale: मूल क्रिया संदर्भ में मृत्यु का संकेत दे सकती है, पर उसे अनिवार्य रूप से स्पष्ट नहीं करती; अतः तनाव को अनसुलझा रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दृश्यात्मक शैली रखी गई है। ‘लहू’ ने उपमा की गंभीरता बनाए रखी है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सहज है।
