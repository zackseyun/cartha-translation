base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/062.yaml
  text: 'And all the excess and destruction that was done by the shepherds[a], the scribe wrote down: how many they destroyed by my command, and how many they destroyed of their own accord[e][d][c][b]; all the destruction of those seventy shepherds was recorded against them.'
translation:
  language: hi
  text: और चरवाहों द्वारा किए गए सारे अतिरेक और विनाश को लिख ले[a]—कि उन्होंने मेरी आज्ञा से कितनों का विनाश किया, और अपनी ही ज़िम्मेदारी पर कितनों का विनाश किया[b]; उन सत्तर चरवाहों के सारे विनाश को उनके विरुद्ध लिख ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पदबंध कठिन है। यहाँ “अतिरेक और विनाश” का आशय चरवाहों द्वारा निर्धारित सीमा से बढ़कर की गई बरबादी भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “अपने सिरों पर।” यह मुहावरा अपनी ज़िम्मेदारी पर किए गए काम या अपने ऊपर आने वाले दोष को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ጽጋበ ወሐጕለ
  choice: अतिरेक और विनाश
  rationale: दो समन्वित संज्ञाओं को अलग रखा गया है। पहली का अर्थ संदर्भ में सीमा से बढ़कर किया गया काम या ज्यादती है, जबकि दूसरी बार-बार आने वाली धातु हिंसक नाश या बरबादी सूचित करती है।
- source_word: በኖሎት
  choice: चरवाहों द्वारा
  rationale: ኖሎት, ኖላዊ ‘चरवाहा’ का बहुवचन है; पूर्वसर्ग በ यहाँ कर्तृवाचक ‘द्वारा’ का अर्थ देता है।
- source_word: ጻሐፍ
  choice: लेखक ने लिख लिया / दर्ज किया गया
  rationale: लेखन और हिसाब रखने की दृश्य-छवि को स्वाभाविक हिन्दी में सुरक्षित रखा गया है; अंतिम खंड में निष्क्रिय रूप अभिलेख के उनके विरुद्ध होने पर बल देता है।
- source_word: ሚመጠነ
  choice: कितनों
  rationale: दोहराया गया रूप संख्यात्मक लेखे को प्रस्तुत करता है; हिन्दी में ‘कितनों’ इस पुनरावृत्त गणना को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: በትእዛዝየ
  choice: मेरी आज्ञा से
  rationale: प्रथम पुरुष संबंधसूचक रूप को सुरक्षित रखा गया है और अधिकारपूर्ण आदेश का सीधा अर्थ दिया गया है।
- source_word: በርእሶሙ
  choice: अपनी ही ज़िम्मेदारी पर
  rationale: शाब्दिक अर्थ ‘अपने सिरों पर’ है। संदर्भ में यह उन पर ठहरने वाली जवाबदेही को सूचित कर सकता है; चुना हुआ रूप स्वेच्छा को आवश्यकता से अधिक स्पष्ट किए बिना दोष-उत्तरदायित्व बनाए रखता है।
- source_word: ፯፯ ኖላዊ
  choice: उन सत्तर चरवाहों
  rationale: दृष्टान्त के स्थापित सांकेतिक समूह और चरवाहों की बिंबावली को अक्षरशः सुरक्षित रखा गया है।
- source_word: ዲቤሆሙ
  choice: उनके विरुद्ध
  rationale: यह केवल उनके विषय में तटस्थ अभिलेख नहीं, बल्कि उनके उत्तरदायित्व के विरुद्ध दर्ज हिसाब सूचित करता है।
theological_decisions:
- issue: न्याय के अभिलेख में कर्तृत्व और उत्तरदायित्व
  choice: ‘मेरी आज्ञा से’ किए गए विनाश और चरवाहों की ‘अपनी ही ज़िम्मेदारी पर’ किए गए विनाश के बीच भेद रखा गया है।
  alternative: दोनों खंडों को ईश्वरीय आज्ञा के अधीन मानना, या दूसरे खंड को केवल ‘उनके सिरों पर’ आने वाले दंड के रूप में पढ़ना।
  rationale: በትእዛዝየ और በርእሶሙ का विरोध अलग-अलग उत्तरदायित्व का संकेत देता है। ‘अपनी ही ज़िम्मेदारी पर’ ईश्वरीय अधिकार और चरवाहों की दोषिता के बीच मौजूद तनाव को सुरक्षित रखता है, पर ‘अपनी इच्छा से’ कहकर आशय को अनावश्यक रूप से निर्णीत नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रूप अपनाया गया है। ‘चरवाहे’, ‘आज्ञा’, ‘लेखक’ और ‘दर्ज’ दृष्टान्त तथा स्वर्गीय लेखे की छवि बनाए रखते हैं। स्रोत में ‘हाथी’ नहीं है, इसलिए उस पूर्ववर्ती गलत पहचान को नहीं अपनाया गया।
