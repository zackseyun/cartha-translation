  yaml_path: translation/extra_canonical/1_enoch/089/049.yaml
  text: And those sheep grew and multiplied[a], and all those dogs and foxes and wild boars of the field feared and fled from them. And that ram gored and killed all the beasts, and those beasts were no longer able again to be in the midst of the sheep[e][d][c][b], and they did not seize anything from them.
translation:
  language: hi
  text: और वे भेड़ें बढ़ीं और बहुत हो गईं। और वे सब कुत्ते, लोमड़ियाँ[a] और वन्य सूअर[b] उनसे डरकर भाग गए। उस मेढ़े ने उन सभी जंगली पशुओं को सींग मारे[c] और मार डाला। फिर वे पशु कभी भेड़ों के बीच रह न सके, और उन्होंने उनसे कुछ भी नहीं छीना[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गीदड़”; मूल पशु-संज्ञा किसी लोमड़ी-जैसे शवभक्षी पशु को भी दर्शा सकती है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक भाव: “निर्जन प्रदेश के जंगली सूअर”; इसे व्यापक अर्थ में वन्य सूअर भी समझा जा सकता है।'
    reason: lexical_alternative
  - marker: c
    text: या, “प्रहार किया”; मेढ़े के संदर्भ में सींग मारना अभिप्रेत हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: अंतिम वाक्य इस बात पर बल देता है कि विरोधी पशुओं ने अब भेड़ों से कुछ भी छीनकर नहीं लिया।
    reason: clarification
lexical_decisions:
- source_word: ልህቁ / በዝኁ
  choice: बढ़ीं और बहुत हो गईं
  rationale: दोनों निकटार्थी क्रियाओं को बनाए रखकर वृद्धि की तीव्रता और मूल की पुनरुक्तिपूर्ण अपोकैलिप्टिक शैली सुरक्षित रखी गई है।
- source_word: አባግዕ
  choice: भेड़ें
  rationale: रूपक की ठोस पशु-छवि को बनाए रखने के लिए सामूहिक और अपेक्षाकृत अमूर्त 'झुंड' के स्थान पर 'भेड़ें' रखा गया है।
- source_word: አክላብ
  choice: कुत्ते
  rationale: यह सीधा पशु-संज्ञा है और दर्शन के रूपकात्मक स्वरूप को अक्षुण्ण रखती है।
- source_word: ቈናጽል
  choice: गीदड़
  rationale: यह शब्द लोमड़ी-जैसे शवभक्षी या सियार/गीदड़ के लिए हो सकता है। आधुनिक हिंदी के वन्य-पशु संदर्भ में 'गीदड़' स्वाभाविक है; अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: ሐራዊያ ገዳም
  choice: जंगल के जंगली सूअर
  rationale: पदबंध असंस्कृत या निर्जन प्रदेश के वन्य सूअरों को दर्शाता है। 'जंगल के जंगली सूअर' सामान्य हिंदी में स्पष्ट है और भूगोल को अनावश्यक रूप से विशिष्ट नहीं बनाता।
- source_word: ፈርሁ ወነፍጹ እምኔሁ
  choice: उनसे डरकर भाग गए
  rationale: भीतर के भय और बाहर की ओर पलायन—दोनों भाव स्वाभाविक हिंदी वाक्य में सुरक्षित हैं।
- source_word: ሐርጌ
  choice: मेढ़ा
  rationale: एकवचन नर भेड़ और नेतृत्वकारी पशु-छवि के लिए 'मेढ़ा' सटीक तथा सहज है।
- source_word: ጐድአ
  choice: सींग मारकर
  rationale: क्रिया का व्यापक अर्थ प्रहार करना है, पर मेढ़े के कर्ता होने पर सींग से टक्कर मारना प्रसंगानुकूल और ठोस अर्थ है; व्यापक विकल्प पादटिप्पणी में रखा गया है।
- source_word: አራዊተ / አራዊት
  choice: जंगली पशु / पशु
  rationale: पहले उल्लेख में विरोधी और वन्य स्वर स्पष्ट करने के लिए 'जंगली पशु' और पुनरुल्लेख में सहजता के लिए 'पशु' रखा गया है।
- source_word: አክህሉ ዳግመ
  choice: फिर ... समर्थ न रहे
  rationale: असमर्थता और उसके बाद की स्थिति दोनों को प्राकृतिक हिंदी में व्यक्त किया गया है; शब्दशः दोहरी काल-सूचना से उत्पन्न असहजता से बचा गया है।
- source_word: ማእከለ አባግዕ
  choice: भेड़ों के बीच रहने
  rationale: स्थानिक छवि को सुरक्षित रखते हुए हिंदी में आवश्यक क्रियात्मक पूरक 'रहने' जोड़ा गया है।
- source_word: ምንትኒ ገሙራ ኢመሠጡ እምኔሆሙ
  choice: उन्होंने भेड़ों में से कुछ भी नहीं झपटा
  rationale: समापन में हिंसक छीनने या उठा ले जाने की पूर्ण समाप्ति पर बल है। 'झपटा' पशु-आक्रमण के संदर्भ में तटस्थ 'लिया' से अधिक उपयुक्त है।
theological_decisions:
- issue: पशु-रूपक को ज्यों का त्यों रखना या उसके ऐतिहासिक पात्रों की पहचान मुख्य पाठ में देना
  choice: मुख्य पाठ में पशु-छवियों को सुरक्षित रखा गया है।
  alternative: पशुओं के स्थान पर कथित ऐतिहासिक राष्ट्रों या गुटों के नाम रखे जाएँ।
  rationale: स्वप्न-दर्शन का अर्थ उसकी सतत प्रतीकात्मक पशु-भाषा से व्यक्त होता है। मुख्य पाठ में उसकी व्याख्या आरोपित करना वास्तविक प्रतीकात्मक तनाव और संभावित बहुअर्थता को समाप्त कर देगा।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण कथात्मक स्तर रखा गया है। मूल की पशु-सूची, पुनरुक्त वृद्धि, भय-पलायन और हिंसक रूपक सुरक्षित हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित शब्द या वाक्यांश के तुरंत बाद दिए गए हैं।
