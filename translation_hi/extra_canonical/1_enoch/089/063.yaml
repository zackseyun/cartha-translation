base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/063.yaml
  text: And read out before me by number how many they destroy[a], and how many they hand over to destruction, so that this may be a testimony for me against them, that I may know all the deeds of the shepherds, and assess them, and see what they do—whether they abide by my command that I commanded them[c][b], or not.
translation:
  language: hi
  text: और मेरे सामने गिनती के अनुसार पढ़ सुनाओ कि वे कितनों को नष्ट करते हैं[a] और कितनों को विनाश के लिए सौंप देते हैं, ताकि यह मेरे लिए उनके विरुद्ध गवाही ठहरे[b], जिससे मैं चरवाहों के सभी काम जानूँ, उनका लेखा लूँ और देखूँ कि वे क्या करते हैं—क्या वे मेरी उस आज्ञा का पालन करते हैं जो मैंने उन्हें दी थी, या नहीं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरंभिक इथियोपियाई वाक्यरचना कठिन है। बार-बार आए गणना-संबंधी शब्द संभवतः इस बात का संख्यात्मक लेखा बताते हैं कि चरवाहे कितनों को नष्ट करते हैं और कितनों को विनाश के लिए सौंपते हैं।
    reason: textual_variant
  - marker: b
    text: शाब्दिक रूप से, ‘यह गवाही उन पर हो’; प्रसंग में इसका आशय उनके विरुद्ध ठहरने वाली गवाही से हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'इस कठिन अंश का एक वैकल्पिक अनुवाद है: ‘और मैंने उसके सामने उन चरवाहों का लेखा पढ़ सुनाया—उन्होंने कितनों को नष्ट किया था—ताकि यह गवाही उन पर रहे ...।’ किंतु ‘मेरे सामने’ और आज्ञार्थक ‘पढ़ सुनाओ’ को आगे के ‘मेरी आज्ञा’ वाले वक्ता-प्रसंग का अधिक अच्छा समर्थन मिलता है।'
    reason: previous_rendering
lexical_decisions:
- source_word: አንበብ፡ ቅድሜየ
  choice: मेरे सामने ... पढ़ सुनाओ
  rationale: क्रिया को आज्ञार्थक मानना और प्रथम पुरुष एकवचन प्रत्यय को ‘मेरे सामने’ समझना प्रसंग के वक्ता तथा आगे आए ‘मेरी आज्ञा’ से मेल खाता है। ‘पढ़ सुनाओ’ में सार्वजनिक रूप से पढ़ने/सुनाने का भाव आता है।
- source_word: ወበኍልቈ፡ ... ሚመጠነ
  choice: गिनकर ... कितनों को
  rationale: गणना और माप से जुड़े शब्दों की न्यायिक लेखा-परीक्षा वाली ध्वनि बनाए रखने के लिए ‘गिनकर’ और ‘कितनों को’ चुना गया है।
- source_word: የኃጕሉ
  choice: नष्ट करते हैं
  rationale: मूल क्रिया विनाशकारी हत्या या नाश को व्यक्त कर सकती है; ‘नष्ट करते हैं’ हिंसक अर्थ को बनाए रखता है, पर मृत्यु की विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ይሚጥዉ፡ ለኃጕል
  choice: विनाश के लिए सौंप देते हैं
  rationale: 'यह दूसरे, समानांतर कार्य को पहले विनाश से अलग रखता है: वे स्वयं नष्ट करते हैं और दूसरों को विनाश के हवाले भी करते हैं।'
- source_word: ስምዐ፡ ዲቤሆሙ
  choice: उनके विरुद्ध गवाही
  rationale: ‘गवाही’ प्रमाण और न्याय का भाव रखती है; प्रसंग में ‘उन पर’ का संबंध आरोपात्मक रूप से ‘उनके विरुद्ध’ समझा गया है।
- source_word: ግብሮሙ፡ ለኖላዊያን
  choice: चरवाहों के सभी काम
  rationale: ‘चरवाहे’ पशु-दर्शन की स्थिर प्रतीकात्मक छवि को सुरक्षित रखता है और ‘काम’ उनके आचरण की न्यायिक समीक्षा के अनुकूल है।
- source_word: እመጥኖሙ
  choice: उनका लेखा लूँ
  rationale: मूल में गिनने, मापने या परखने का भाव है। ‘लेखा लेना’ हिंदी में गणना और उत्तरदायित्व—दोनों अर्थों को स्वाभाविक ढंग से जोड़ता है।
- source_word: በትእዛዝየ፡ ዘአዘዝክዎሙ
  choice: मेरी आज्ञा में ... उस आज्ञा में जो मैंने उन्हें दी थी
  rationale: मूल की ‘आज्ञा’ संबंधी जानबूझकर की गई पुनरुक्ति को पूरी तरह हटाए बिना आधुनिक हिंदी में पठनीय रूप दिया गया है।
- source_word: እመ፡ አልቦ
  choice: या नहीं
  rationale: यह आज्ञापालन की द्विपक्षीय जाँच को संक्षेप और स्वाभाविक हिंदी में पूरा करता है।
theological_decisions:
- issue: चरवाहों के कामों के अभिलेख का न्यायिक कार्य
  choice: गिनती और गवाही को चरवाहों के विरुद्ध औपचारिक लेखे के रूप में प्रस्तुत किया गया है।
  alternative: इसे घटनाओं की केवल सामान्य सूचना या कथावाचक की निजी स्मृति माना जा सकता है।
  rationale: पढ़ सुनाने, गिनने, गवाही, कामों का लेखा लेने और आज्ञा की जाँच करने की संयुक्त शब्दावली उत्तरदायित्व तथा न्याय की ओर संकेत करती है।
- issue: आज्ञा में बने रहने का अर्थ
  choice: वाक्य को आज्ञापालन की जाँच के रूप में रखा गया है, पर किसी विशेष धार्मिक परंपरा की तकनीकी शब्दावली नहीं जोड़ी गई।
  alternative: इसे अधिक व्याख्यात्मक रूप से ‘मेरी इच्छा पूरी करना’ कहा जा सकता था।
  rationale: ‘आज्ञा’ मूल पाठ का स्पष्ट मानदंड है; ‘इच्छा’ कहना अर्थ को व्यापक करके मूल की विधिक धार को कम कर देता।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, किंतु सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। ‘चरवाहे’, ‘गवाही’, ‘लेखा’ और ‘आज्ञा’ से दर्शन की प्रतीकात्मक तथा न्यायिक भाषा सुरक्षित रहती है। कठिन आरंभिक वाक्य का प्रमुख अर्थ मुख्य पाठ में रखा गया है और वास्तविक पाठगत अनिश्चितता पादटिप्पणियों में स्पष्ट की गई है।
