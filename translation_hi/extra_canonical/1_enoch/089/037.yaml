base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/037.yaml
  text: And I watched until that sheep lay down—the one that had met that sheep which led them—and I watched until all the great and small sheep were stirred up in their place[d][c][b][a], and they entered into the pasture and came near the stream of water.
translation:
  language: hi
  text: और मैं देखता रहा, यहाँ तक कि वह भेड़ लेट गई[a]—वही भेड़ जो उस भेड़ से मिली थी, जो उनका नेतृत्व करती थी। फिर मैं देखता रहा, यहाँ तक कि सारी बड़ी भेड़ें नष्ट हो गईं और छोटी भेड़ें उनके स्थान पर उठ खड़ी हुईं। तब छोटी भेड़ें चरागाह में गईं और पानी की धारा के पास पहुँचीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘लेट गई’ यहाँ मृत्यु के लिए सांकेतिक कथन हो सकता है, पर मूल क्रिया स्वयं न तो हत्या को स्पष्ट करती है, न ही व्याकरणतः ‘लिटा दी गई’ कहती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰከበ
  choice: लेट गई
  rationale: क्रिया सक्रिय रूप में ‘लेटना’ या ‘सो जाना’ व्यक्त करती है। इसलिए निष्क्रिय ‘लिटा दी गई’ के बजाय सक्रिय अनुवाद किया गया है; प्रसंग में मृत्यु का संकेत संभव है, पर उसे मुख्य पाठ में स्पष्ट नहीं किया गया।
- source_word: በግዕ
  choice: भेड़
  rationale: पशु-दर्शन में यह व्यापक और प्रसंगानुकूल पद है; ‘मेढ़ा’ या ‘मेमना’ अनावश्यक रूप से लिंग अथवा आयु निश्चित कर देते।
- source_word: ዘተረክበ
  choice: जो ... से मिली थी
  rationale: सम्बन्धवाचक उपवाक्य में पूर्व भेंट का स्वाभाविक हिन्दी रूप है और ‘पहुँचना’ जैसे अधिक दिशात्मक अर्थ को नहीं थोपता।
- source_word: ዘመርሖሙ
  choice: उनका नेतृत्व करनेवाली
  rationale: मूल क्रिया नेतृत्व या मार्गदर्शन को व्यक्त करती है; यह चयन गति और अगुवाई दोनों को रखता है, बिना ‘चरवाही’ का अतिरिक्त रूपक जोड़े।
- source_word: ተኃጕሉ
  choice: नष्ट हो गईं
  rationale: यहाँ क्रिया का अर्थ ‘नष्ट होना/मिट जाना’ है। इसे अगले स्वतंत्र खंड की क्रिया ተንሥኡ के साथ मिलाकर ‘उत्तेजित की गईं’ या ‘हांकी गईं’ कहना वाक्य-संरचना और अर्थ दोनों को खो देता है।
- source_word: ተንሥኡ
  choice: उठ खड़ी नहीं हुईं
  rationale: यह स्वतंत्र बहुवचन क्रिया ‘उठना’ व्यक्त करती है और छोटी भेड़ों को अलग कर्ता के रूप में पहचानती है। ‘जब तक ... नहीं’ की हिन्दी रचना के कारण निषेध केवल रूपगत है, अर्थ सकारात्मक है।
- source_word: ህየንቴሆሙ
  choice: उनके स्थान पर
  rationale: बड़ी भेड़ों के नष्ट होने और छोटी भेड़ों के उठने की समानांतर रचना में प्रतिस्थापनसूचक अर्थ ‘उनके स्थान पर’ सर्वाधिक स्वाभाविक है।
- source_word: መርዔት
  choice: चरागाह
  rationale: यह चरने की जगह को दर्शाता है; ‘बाड़ा’ अनावश्यक रूप से घिरे हुए स्थान का अर्थ जोड़ता।
- source_word: ፈለገ ማይ
  choice: पानी की धारा
  rationale: शाब्दिक चित्र जल की धारा या जलमार्ग का है; यह अनुवाद उसके आकार को नदी या नाले के रूप में अधिक निश्चित नहीं करता।
theological_decisions:
- issue: पहली भेड़ के लेटने को स्पष्ट मृत्यु मानना
  choice: मुख्य पाठ में ‘लेट गई’ रखा गया
  alternative: ‘मर गई’ या ‘मार डाली गई’
  rationale: मूल सक्रिय क्रिया सामान्यतः लेटने या सोने को व्यक्त करती है और इस दर्शन में मृत्यु का संकेत दे सकती है। प्रत्यक्ष हिंसक मृत्यु लिखना मूल की सांकेतिक अस्पष्टता को समाप्त कर देता।
- issue: बड़ी और छोटी भेड़ों के बीच संबंध
  choice: बड़ी भेड़ों का नष्ट होना और छोटी भेड़ों का उनके स्थान पर उठना दो अलग खंडों में रखा गया
  alternative: बड़ी और छोटी सभी भेड़ों का एक साथ उत्तेजित या हांका जाना
  rationale: मूल में ዐቢያን के बाद ወንኡሳን और स्वतंत्र क्रिया ተንሥኡ आती है। इस समानांतरता को बनाए रखना ऐतिहासिक या प्रतीकात्मक पहचान तय किए बिना दर्शन की पीढ़ीगत अथवा प्रतिस्थापनात्मक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। बार-बार आनेवाले ‘मैं तब तक देखता रहा’ को दर्शन की लय और मूल की संरचना सुरक्षित रखने के लिए दोहराया गया है। स्त्रीलिंग ‘भेड़’ के अनुसार क्रियारूपों में हिन्दी का स्वाभाविक व्याकरण अपनाया गया है।
