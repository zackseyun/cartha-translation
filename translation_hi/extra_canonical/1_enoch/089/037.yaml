review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly reflects the active sense of ሰከበ (‘lay down’), preserves its possible death-euphemism without making death explicit, and correctly treats ተኃጕሉ ... ዐቢያን and ወንኡሳን ተንሥኡ ህየንቴሆሙ as separate clauses: the great sheep perished and the small sheep arose in their place.'
  naturalness: The repeated Hindi construction ‘जब तक ... नहीं’ is grammatically possible in restricted contexts but is awkward here and can superficially suggest that the narrated actions did not occur. ‘यहाँ तक कि’ gives the visionary progression naturally and unambiguously. Making the final subject explicit also avoids a vague ‘वे.’
  terminology: ‘भेड़,’ ‘चरागाह,’ and ‘पानी की धारा’ are suitable, natural equivalents. ‘उनके स्थान पर’ appropriately retains the substitutional relation without identifying the symbolism. ‘नेतृत्व करती थी’ is more idiomatic narrative Hindi than the compound participial phrase.
  issues:
  - severity: medium
    issue: The consecutive ‘जब तक ... नहीं’ clauses create avoidable ambiguity.
    rationale: In the present wording, ‘बड़ी भेड़ें नष्ट नहीं हो गईं’ and ‘छोटी भेड़ें ... उठ खड़ी नहीं हुईं’ may be read as negated events, although the source narrates completed events observed by the seer. Recast with ‘यहाँ तक कि’ to state the completed actions directly.
  - severity: low
    issue: The final pronoun ‘वे’ has an unclear antecedent.
    rationale: The immediately preceding subject is the small sheep, but explicitly naming them makes the sequence clearer in Hindi without adding interpretation.
