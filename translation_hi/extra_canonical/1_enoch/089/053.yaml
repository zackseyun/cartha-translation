  yaml_path: translation/extra_canonical/1_enoch/089/053.yaml
  text: And he sent many other sheep to those sheep[d][c][b][a], that they might hear and cry out over them.
translation:
  language: hi
  text: और उसने उन भेड़ों के पास बहुत-सी दूसरी भेड़ें भेजीं, ताकि वे सुनाएँ[a] और उनके विषय में पुकारें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक भाव ‘सुनने योग्य बनाएँ’ या ‘सुनाएँ’ है; प्रसंग में इसका अर्थ ‘घोषणा करें’, ‘प्रचार करें’ अथवा ‘गवाही दें’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘उनके लिए पुकारें’, ‘उन पर पुकारें’ या ‘उनके विरुद्ध पुकारें’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልኣነ አባግዕ ብዙኃነ
  choice: बहुत-सी दूसरी भेड़ें
  rationale: बहुवचन विशेषण और संज्ञा का स्वाभाविक हिन्दी क्रम रखते हुए पहले से उल्लिखित समूह से भिन्न एक बड़े समूह का बोध कराया गया है।
- source_word: ፈነወ
  choice: उसने ... भेजीं
  rationale: यह क्रिया तृतीय पुरुष पुल्लिंग एकवचन पूर्ण रूप है; इसलिए कर्ता ‘उसने’ है, ‘मैंने’ नहीं। ‘भेड़ें’ हिन्दी में स्त्रीलिंग बहुवचन होने के कारण क्रिया ‘भेजीं’ है।
- source_word: ኀቤሆሙ ለዝኩ አባግዕ
  choice: उन भेड़ों के पास
  rationale: दिशासूचक भाव और निर्दिष्ट प्राप्तकर्ता-समूह को सहज हिन्दी में स्पष्ट करता है।
- source_word: ያስምዑ
  choice: घोषणा करें
  rationale: यह ሰምዐ ‘सुनना’ का कारक रूप है, जिसका भाव ‘सुनाना/सुनने योग्य बनाना’, और प्रसंगानुसार ‘घोषणा करना’ है। केवल ‘सुनें’ कहने से कारक रूप लुप्त हो जाएगा।
- source_word: የአውይዉ
  choice: पुकार उठें
  rationale: यह ऊँची और तीव्र पुकार का भाव रखता है; अनुवाद ने उसे केवल विलाप या विरोध तक सीमित नहीं किया।
- source_word: ዲቤሆሙ
  choice: उनके विषय में
  rationale: यहाँ संबंधसूचक अर्थ स्वाभाविक है और मूल पूर्वसर्ग की संभावित अर्थ-सीमा को अनावश्यक रूप से ‘विरुद्ध’ तक सीमित नहीं करता।
theological_decisions:
- issue: दर्शनीय प्रतीक में ‘दूसरी भेड़ों’ की पहचान
  choice: मुख्य पाठ में उन्हें शाब्दिक रूप से ‘दूसरी भेड़ें’ ही रखा गया है।
  alternative: उन्हें सीधे ‘भविष्यद्वक्ता’, ‘विश्वासयोग्य अगुए’ या इस्राएल के किसी सुधारक समूह के रूप में पहचानना।
  rationale: पद स्वयं पशु-दर्शन की प्रतीकात्मक भाषा में बोलता है; ऐतिहासिक या धार्मिक पहचान जोड़ने से मूल की खुली प्रतीकात्मकता समय से पहले निश्चित हो जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘भेड़ें’ की पुनरावृत्ति जानबूझकर रखी गई है ताकि दर्शन का प्रतीक न मिटे। कारक क्रिया ያስምዑ को ‘सुनें’ न करके ‘घोषणा करें’ किया गया है, और दोनों वास्तविक पाठ-टिप्पणी चिह्न [a], [b] मुख्य पाठ में उपस्थित हैं।
