base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/067.yaml
  text: And I grieved greatly because of the tower[a], for that house of the sheep had been torn down[e][d][c][b]; and from among them I was not able to see whether those sheep entered that house.
translation:
  language: hi
  text: और उस बाड़े[a] के कारण मुझे बहुत गहरा दुःख हुआ, क्योंकि भेड़ों का वह घर ढहा दिया गया था[b]। और मैं उनमें से यह नहीं देख सका कि वे भेड़ें उस घर में गई थीं या नहीं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में पशुओं के लिए घेरे हुए स्थान का शब्द है। इसे ‘भेड़शाला’ भी कहा जा सकता है; आगे मूल पाठ अलग से ‘भेड़ों का घर’ कहता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘खोदकर गिरा दिया गया था’ अथवा सामान्य रूप से ‘नष्ट कर दिया गया था’।
    reason: lexical_alternative
  - marker: c
    text: अंतिम वाक्यांश कठिन है। इसका अर्थ यह भी हो सकता है कि द्रष्टा उन भेड़ों को बिल्कुल देख नहीं सका; मुख्य पाठ में अर्थ है कि वह यह नहीं देख सका कि वे उस घर में गई थीं या नहीं।
    reason: alternative_reading
lexical_decisions:
- source_word: ወሐዘንኩ፡ ብዙኃ፡ ጥቀ
  choice: मुझे बहुत गहरा दुःख हुआ
  rationale: क्रिया व्यक्तिगत शोक व्यक्त करती है और दोहरे तीव्रताबोधक पद दुःख की प्रबलता बढ़ाते हैं। यह हिन्दी में स्वाभाविक रहते हुए उस बल को बनाए रखता है।
- source_word: ማኅፈድ
  choice: बाड़ा
  rationale: यह पशुओं के लिए घेरे हुए स्थान का बोध कराता है। ‘बाड़ा’ साधारण आधुनिक हिन्दी में सहज है और आगे आए ‘भेड़ों का घर’ से भिन्न किंतु संबंधित बिंब को सुरक्षित रखता है।
- source_word: ተከርየ
  choice: ढहा दिया गया था
  rationale: भवन के संदर्भ में निष्क्रिय क्रिया खोदकर गिराने, ध्वस्त करने या ढहा देने का भाव देती है। ‘ढहा दिया गया था’ ठोस विनाश को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ቤት፡ ዘአባግዐ
  choice: भेड़ों का वह घर
  rationale: शाब्दिक स्थापत्य-बिंब को बनाए रखता है और इसे केवल ‘भेड़शाला’ में समेटकर प्रतीकात्मक भाषा को सपाट नहीं करता।
- source_word: ኢክህልኩ፡ ርእዮቶሙ፡ ለእልኩ፡ አባግዕ
  choice: मैं उनमें से उन भेड़ों को देख नहीं सका
  rationale: देखने में असमर्थता, निर्दिष्ट भेड़ों तथा ‘उनमें से’ के संबंध—तीनों को यथासंभव सुरक्षित रखा गया है।
- source_word: ለእመ፡ ይበውኡ፡ ኀበ፡ ዝኩ፡ ቤት
  choice: क्या वे उस घर में गई थीं या नहीं
  rationale: गति का लक्ष्य ‘उस घर में’ रखा गया है। प्रश्नात्मक रचना इस कठिन अंतिम उपवाक्य के उस अर्थ को व्यक्त करती है जिसमें द्रष्टा यह नहीं देख सका कि भेड़ें भीतर गईं या नहीं।
theological_decisions:
- issue: पशुओं की संरचना के लिए ‘बाड़ा’ और ‘भेड़ों का घर’—दोनों बिंब रखना
  choice: दोनों संबंधित बिंब अलग-अलग रखे गए हैं
  alternative: दोनों को ‘भेड़शाला’ कहना
  rationale: मूल में घेरे और घर की शब्दावली साथ आती है। दोनों को सुरक्षित रखने से प्रलयदर्शी प्रतीकवाद का तनाव बना रहता है और उसके ऐतिहासिक या धार्मिक संकेत की अनावश्यक व्याख्या नहीं की जाती।
- issue: भेड़ों के घर को हुई क्षति का स्वरूप
  choice: ढहा दिया गया था
  alternative: काटकर अलग कर दिया गया था; नष्ट कर दिया गया था; खोदकर गिरा दिया गया था
  rationale: भवन के साथ प्रयुक्त क्रिया ध्वंस या नींव खोदकर गिराने का ठोस भाव देती है। चुना हुआ रूप स्पष्ट और स्वाभाविक है, पर पादटिप्पणी में अधिक शाब्दिक संभावना सुरक्षित है।
- issue: अंतिम उपवाक्य का संबंध
  choice: द्रष्टा यह नहीं देख सका कि वे उस घर में गई थीं या नहीं
  alternative: द्रष्टा उन भेड़ों को बिल्कुल देख नहीं सका
  rationale: वाक्यरचना कठिन है और दोनों अर्थ संभव हैं। मुख्य पाठ में प्रसंगानुकूल प्रश्नात्मक संबंध लिया गया है, जबकि दूसरा अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण दर्शनीय-वृत्तांत। ‘बाड़ा’ और ‘भेड़ों का घर’ के ठोस बिंब बनाए गए हैं। अंतिम कठिन वाक्य को मुख्य पाठ में पठनीय बनाया गया है, पर उसकी वास्तविक अस्पष्टता पादटिप्पणी में स्पष्ट रखी गई है।
