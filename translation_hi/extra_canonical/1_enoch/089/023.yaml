  yaml_path: translation/extra_canonical/1_enoch/089/023.yaml
  text: And the wolves began to pursue those sheep until they overtook them at a spring of water[a][b].
translation:
  language: hi
  text: और भेड़ियों ने उन भेड़ों का पीछा करना शुरू किया, जब तक कि उन्होंने जल के एक सोते के पास उन्हें जा पकड़ा।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जल के एक कुंड के पास।” गीइज़ पद किसी जल-स्रोत या जलाशय का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: कुछ पुराने अनुवादों में, “उन्हें जल के एक कुंड में हांक दिया”; पर यहाँ की गीइज़ क्रिया का सामान्य अर्थ “पहुँचना” या “जा पकड़ना” है, और पूर्वसर्ग स्थान बताता है।
    reason: previous_rendering
lexical_decisions:
- source_word: አዝእብት
  choice: भेड़ियों
  rationale: पशु-दर्शन की ठोस प्रतीकात्मक छवि बनाए रखने के लिए इसे सामान्य हिंसक पशुओं के बजाय ‘भेड़ियों’ के रूप में अनूदित किया गया है।
- source_word: አሐዙ
  choice: शुरू किया
  rationale: अगली क्रिया के साथ यह रूप आरंभसूचक अर्थ देता है—‘पीछा करना शुरू किया।’
- source_word: ይትልውዎሙ
  choice: उन भेड़ों का पीछा करना
  rationale: संदर्भ में यह तटस्थ रूप से पीछे चलना नहीं, बल्कि शत्रुतापूर्ण पीछा करना है।
- source_word: ዝኩ አባግዕት
  choice: उन भेड़ों
  rationale: संकेतवाचक रूप पूर्वोक्त विशिष्ट भेड़ों की ओर संकेत करता है, इसलिए ‘उन’ सुरक्षित रखा गया है।
- source_word: እስክ ተረክብዎሙ
  choice: जब तक कि उन्होंने ... उन्हें जा पकड़ा
  rationale: ረከበ का अर्थ यहाँ पहुँच जाना अथवा पीछा करते हुए जा पकड़ना है; ‘हांककर ले गए’ जैसा कारक अर्थ स्रोत में नहीं है।
- source_word: በአሐቲ ዐይገ ማይ
  choice: जल के एक सोते के पास
  rationale: በ को स्थानसूचक ‘के पास’ और ዐይገ ማይ को ‘जल का सोता’ माना गया है; ‘एक’ से አሐቲ का संख्यात्मक संकेत भी बना रहता है।
theological_decisions:
- issue: स्वप्न-दर्शन में पशु-प्रतीक
  choice: मुख्य पाठ में पशुओं को पशुओं के रूप में ही रखा गया है।
  alternative: भेड़ियों और भेड़ों को सीधे ऐतिहासिक मानव-समूहों के नाम से प्रस्तुत करना।
  rationale: अनुवाद को दर्शन की प्रतीकात्मक संरचना सुरक्षित रखनी चाहिए और ऐतिहासिक पहचान को मुख्य पाठ में आरोपित नहीं करना चाहिए।
- issue: जल-स्थान पर पहुँचने की घटनात्मक क्रमबद्धता
  choice: भेड़ियों ने भेड़ों को जल के सोते के पास जा पकड़ा।
  alternative: भेड़ियों ने भेड़ों को जल में हांक दिया।
  rationale: क्रिया और पूर्वसर्ग यहाँ पकड़ लेने तथा स्थान को व्यक्त करते हैं, जल में जबरन प्रवेश कराने को नहीं; इससे कथानक का क्रम भी सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली अपनाई गई है। ‘जा पकड़ा’ पीछा करके पकड़ लेने का स्वाभाविक हिन्दी मुहावरा है। मुख्य पाठ में स्रोत की पशु-छवि और जल-स्थान संबंधी सीमित अस्पष्टता सुरक्षित रखी गई है।
