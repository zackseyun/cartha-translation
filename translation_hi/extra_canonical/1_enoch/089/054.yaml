base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/054.yaml
  text: And after that I saw when they abandoned the house of the Lord and his tower[a], and they all went astray, and their eyes were blinded. And I saw the Lord of the sheep bring about a great slaughter among them in their pasture[f][e][d][c][b], until those sheep cried out because of that slaughter and abandoned his place.
translation:
  language: hi
  text: इसके बाद मैंने देखा कि उन्होंने प्रभु का भवन और उसकी मीनार[a] छोड़ दिए; वे सब भटक गए और उनकी आँखें अंधी कर दी गईं। फिर मैंने देखा कि भेड़ों के प्रभु ने उनकी चरागाह में उनके बीच बड़ा संहार कराया, यहाँ तक कि उन भेड़ों ने उस संहार को बुलाया और उसके स्थान को विश्वासघात करके सौंप दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसकी मीनार’ का अर्थ ‘उसका बाड़ा’ या ‘उसका घेरा’ भी हो सकता है; दर्शन में यह सम्भवतः प्रतीकात्मक पवित्रस्थान-परिसर का भाग है।
    reason: lexical_alternative
  - marker: b
    text: यह अंतिम खंड पाठ और व्याकरण की दृष्टि से कठिन है। ‘उसके स्थान’ में ‘उसके’ का संकेत भेड़ों के प्रभु की ओर है। इसे ‘वे उस संहार के कारण चिल्ला उठीं और उसका स्थान छोड़ गईं’ भी समझा गया है; मुख्य पाठ कठिन गीज़ रूप के उस अर्थ को रखता है जिसमें भेड़ें संहार को बुलाती हैं और उसके स्थान को विश्वासघात से सौंप देती हैं।
    reason: textual_variant
lexical_decisions:
- source_word: ኃደጉ
  choice: छोड़ दी
  rationale: यह क्रिया दोषपूर्ण परित्याग का भाव रखती है; सहज हिन्दी में ‘छोड़ दी’ प्रसंग के अनुकूल है।
- source_word: ቤተ ለእግዚአ
  choice: प्रभु का भवन
  rationale: पशु-दर्शन में यह प्रतीकात्मक पवित्रस्थान/मन्दिर को सूचित करता है; ‘भवन’ प्रतीक को खुला रखता है।
- source_word: ማኅፈዶ
  choice: उसकी मीनार
  rationale: शब्द का अर्थ मीनार, बाड़ा या घेरा हो सकता है; मुख्य पाठ में ‘मीनार’ और पादटिप्पणी में विकल्प दिए गए हैं।
- source_word: ስሕቱ
  choice: भटक गए
  rationale: भेड़ों के रूपक में यह स्थानिक और नैतिक—दोनों प्रकार की भटकन व्यक्त करता है।
- source_word: ተጸለሉ አዕይንቲሆሙ
  choice: उनकी आँखें अंधी कर दी गईं
  rationale: निष्क्रिय रूप और दृष्टिहीनता के आरोप, दोनों को बनाए रखता है।
- source_word: እግዚአ አባግዕ
  choice: भेड़ों के प्रभु
  rationale: पशु-दर्शन में बार-बार आने वाली उपाधि का गरिमापूर्ण और संगत अनुवाद।
- source_word: ገብረ ቀትለ ብዙኃ
  choice: बड़ा संहार कराया
  rationale: कारणात्मक/क्रियाशील अर्थ और न्याय की तीव्रता को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: በመራዕይሆሙ
  choice: उनकी चरागाह में
  rationale: भेड़ों के रूपक में चरने के स्थान का एकवचन अर्थ सबसे स्वाभाविक है।
- source_word: ይጼውዕዎ ... ለዝኩ ቀትል
  choice: उस संहार को पुकार बुलाया
  rationale: क्रिया के 3ms कर्म-प्रत्यय और चिह्नित कर्म ‘उस संहार’ को ध्यान में रखकर संहार को पुकारने/बुलाने का कठिन अर्थ सुरक्षित रखा गया है।
- source_word: አግብኡ መካኖ
  choice: उसके स्थान को विश्वासघात करके सौंप दिया
  rationale: कारणात्मक क्रिया को ‘सौंप देना/धोखे से हवाले करना’ समझते हुए पूर्ववर्ती ‘स्थान छोड़ना’ से अलग, अधिक स्रोत-संगत अर्थ चुना गया है।
theological_decisions:
- issue: संहार में भेड़ों के प्रभु की भूमिका
  choice: भेड़ों के प्रभु ने ... बड़ा संहार कराया
  alternative: भेड़ों के प्रभु ने संहार होने दिया
  rationale: गीज़ पाठ प्रभु को सक्रिय कर्ता बनाता है; इसे केवल अनुमति में बदलकर धर्मवैचारिक तनाव को नरम नहीं किया गया।
- issue: भेड़ों की संहार के प्रति भूमिका
  choice: उन भेड़ों ने उस संहार को पुकार बुलाया
  alternative: वे उस संहार के कारण चिल्ला उठीं
  rationale: कर्म-प्रत्यय और ‘उस संहार’ पर लगे कर्म-चिह्न के कारण संहार को पुकारना अधिक व्याकरण-संगत है, यद्यपि वाक्य कठिन है; विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली रखी गई है। पशु-दर्शन के प्रतीक—भेड़ें, चरागाह, मीनार और स्थान—को व्याख्या में समतल नहीं किया गया। कठिन अंतिम उपवाक्य की वास्तविक अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
