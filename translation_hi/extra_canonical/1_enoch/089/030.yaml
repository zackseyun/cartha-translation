base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/030.yaml
  text: And among them I saw the Lord of the sheep[a], standing before them; and they saw that he was great and fearsome and mighty[b], and all those sheep saw him and were afraid before him.
translation:
  language: hi
  text: और उनके बीच मैंने भेड़ों के प्रभु[a] को देखा, जो उनके सामने खड़ा था। उसका रूप महान, भयावह और शक्तिशाली था; और उन सभी भेड़ों ने उसे देखा और उसकी उपस्थिति से डर गईं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भेड़ों के प्रभु’ का अनुवाद ‘भेड़ों के स्वामी’ या ‘भेड़ों के मालिक’ भी हो सकता है। इस दर्शन में यह पदवी परमेश्वर को भेड़ों के अधिकारी और पालनकर्ता के रूप में प्रस्तुत करती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘उसके मुख से डर गईं’; यहाँ ‘मुख’ उसकी प्रत्यक्ष उपस्थिति को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እግዚአ አባግዕ
  choice: भेड़ों के प्रभु
  rationale: እግዚአ अधिकार, स्वामित्व और प्रभुता सूचित करता है। पशु-दर्शन की प्रतीकात्मक भाषा बनाए रखते हुए ‘प्रभु’ इस पदवी का धार्मिक भार भी सुरक्षित रखता है।
- source_word: ዘቆመ ቅድሜሆሙ
  choice: जो उनके सामने खड़ा था
  rationale: यह सापेक्ष उपवाक्य और ቅድሜሆሙ का स्थान-संबंध सीधे तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ራእዩ
  choice: उसका रूप
  rationale: यहाँ शब्द देखे जाने वाले रूप या स्वरूप को सूचित करता है। ‘रूप’ साधारण पाठक के लिए स्वाभाविक है और दर्शन के दृश्य पक्ष को बनाए रखता है।
- source_word: ዐቢይ
  choice: महान
  rationale: मूल शब्द आकार और गरिमा—दोनों प्रकार की महानता व्यक्त कर सकता है; ‘महान’ इस द्विअर्थी संभावना को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ግሩም
  choice: भयावह
  rationale: यह विस्मय और भय उत्पन्न करने वाला गुण बताता है। ‘भयावह’ आधुनिक हिन्दी में स्पष्ट है और दृश्य की आतंककारी गरिमा को व्यक्त करता है।
- source_word: ኃያል
  choice: शक्तिशाली
  rationale: यह सामर्थ्य और बल का सामान्य, सुबोध अनुवाद है तथा ऊँची साहित्यिक शैली में भी स्वाभाविक लगता है।
- source_word: ኵሎሙ ዝኩ አባግዕ
  choice: उन सभी भेड़ों
  rationale: ‘उन’ संकेतवाचक तत्व को बनाए रखता है और पहले से दृष्टि में उपस्थित समूह की ओर संकेत करता है।
- source_word: ፈርሁ እምገጹ
  choice: उसकी उपस्थिति से डर गईं
  rationale: እም यहाँ भय के कारण या विषय को चिह्नित करता है, जबकि ገጽ का शाब्दिक अर्थ ‘मुख’ और मुहावरेदार अर्थ ‘उपस्थिति’ हो सकता है। मुख्य पाठ में स्वाभाविक हिन्दी मुहावरा रखा गया है और ठोस शाब्दिक चित्र पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: እግዚአ አባግዕ को सामान्य स्वामी-सूचक पदवी माना जाए या ईश्वरीय पदवी
  choice: भेड़ों के प्रभु
  alternative: भेड़ों के स्वामी / भेड़ों के मालिक
  rationale: पशु-दर्शन में यह आकृति परमेश्वर का प्रतिनिधित्व करती है। ‘प्रभु’ मूल पदवी के अधिकार और धार्मिक भार को बनाए रखता है, पर प्रतीकात्मक भेड़-भाषा की व्याख्या करके उसे पाठ में प्रतिस्थापित नहीं करता।
- issue: ፈርሁ እምገጹ में ‘मुख’ को शाब्दिक रखा जाए या उपस्थिति के अर्थ में व्यक्त किया जाए
  choice: उसकी उपस्थिति से डर गईं
  alternative: उसके मुख से डर गईं
  rationale: ‘मुख’ मूल बिंब है, पर इस प्रयोग में वह व्यक्ति की प्रत्यक्ष उपस्थिति को सूचित करता है। मुख्य पाठ में अर्थ स्पष्ट किया गया है और मूल बिंब पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सुबोध किंतु गरिमापूर्ण अपोकैलिप्टिक शैली रखी गई है। वाक्य-विन्यास मूल दर्शन की क्रमिक दृश्यात्मकता के निकट है; असामान्य विशेषण-श्रृंखला को सहज बनाने के लिए विरामचिह्नों का प्रयोग किया गया है।
