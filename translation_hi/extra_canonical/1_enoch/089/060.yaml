base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/060.yaml
  text: “And I will hand them over to you by number[a], and I will tell you which of them are to be destroyed[c][b], and those you shall destroy.” And he handed over to them those sheep.
translation:
  language: hi
  text: “और मैं उन्हें गिनती के अनुसार तुम्हारे हाथों में सौंप दूँगा, और तुम्हें बताऊँगा कि उनमें से किन्हें नष्ट किया जाना है; और उन्हीं को तुम नष्ट करना।” तब उसने वे भेड़ें उनके हाथों में सौंप दीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሜጥወክሙ
  choice: मैं उन्हें तुम्हारे हाथ सौंप दूँगा
  rationale: यह መጠወ से बना प्रथम पुरुष रूप है, जिसका अर्थ ‘सौंपना’ है; द्वितीय पुरुष बहुवचन प्रत्यय को ‘तुम्हारे हाथ’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: በኍልቍ
  choice: गिनती के अनुसार
  rationale: यहाँ पद का अर्थ सत्यता नहीं, बल्कि संख्या अथवा गिनती के आधार पर सौंपना है।
- source_word: እነግረክሙ
  choice: तुम्हें बताऊँगा
  rationale: प्रथम पुरुष वक्ता द्वारा बहुवचन श्रोताओं को सूचना देने का सीधा और स्वाभाविक रूप।
- source_word: ዘይትኃጐል
  choice: किन्हें नष्ट किया जाना है
  rationale: सम्बन्धवाचक भाव और विनाश के अर्थ को सुरक्षित रखता है; कर्ता को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: እምኔሆሙ
  choice: उनमें से
  rationale: समूह में से विनाश के लिए चुने जाने वालों को सूचित करने के लिए प्रसंगानुकूल अर्थ।
- source_word: ኪያሆሙ አኅጕሉ
  choice: उन्हीं को तुम नष्ट करना
  rationale: बलाघाती सर्वनाम और बहुवचन आज्ञार्थ को सुरक्षित रखते हुए आधुनिक हिन्दी का स्वाभाविक आज्ञासूचक रूप अपनाया गया है।
- source_word: ወመጠወ ሎሙ
  choice: तब उसने ... उनके हाथ सौंप दीं
  rationale: क्रिया सक्रिय तृतीय पुरुष एकवचन है, निष्क्रिय नहीं; दत्तिव ‘उनके हाथ’ से व्यक्त हुआ है।
- source_word: ዝኩ አባግዐ
  choice: वे भेड़ें
  rationale: यद्यपि रूप-विवरण में वचन संबंधी कठिनाई है, प्रसंग और सौंपे गए समूह के अनुसार सामूहिक/बहुवचन अर्थ रखा गया है।
theological_decisions:
- issue: किन्हें नष्ट किया जाना है—इस निष्क्रिय विधान का कर्ता
  choice: कर्ता को अनिर्दिष्ट रखा गया है
  alternative: जिन्हें तुम नष्ट करोगे
  rationale: स्रोत का निष्क्रिय भाव दैवी निर्णय और कार्यान्वयन के संबंध को खुला रखता है; हिन्दी में कर्ता जोड़ना इस तनाव को समय से पहले हल कर देता।
- issue: अंतिम सौंपने वाली क्रिया का बल
  choice: सक्रिय ‘उसने ... सौंप दीं’
  alternative: ‘वे ... सौंप दी गईं’
  rationale: गीज़ रूप सक्रिय तृतीय पुरुष एकवचन है; निष्क्रिय अनुवाद वक्ता/कर्ता को मिटा देता और पाठ के अर्थ को बदल देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सहज रखी गई है। प्रत्यक्ष कथन को उद्धरण-चिह्नों में रखा गया है क्योंकि यह पिछले पद से जारी वाणी है। ‘भेड़ें’ स्त्रीलिंग बहुवचन होने के कारण अंतिम क्रिया ‘सौंप दीं’ है।
