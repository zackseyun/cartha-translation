base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/059.yaml
  text: And he summoned seventy shepherds and gave over those sheep to them, that they might pasture them. And he said to the shepherds and to their companions, “From now on, each of you shall pasture the sheep, and do all that I command you.”
translation:
  language: hi
  text: और उसने सत्तर चरवाहों को बुलाया और उन भेड़ों को उनके हवाले कर दिया, ताकि वे उन्हें चराएँ। फिर उसने चरवाहों और उनके साथियों[a] से कहा, “अब से तुम सत्तर के सत्तर[b] भेड़ों को चराओ, और जो कुछ मैं तुम्हें आज्ञा दूँ, वह सब करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उनके साथियों” का मूल पद कुछ अनिश्चित है; संभवतः इसका अर्थ चरवाहों के साथ जुड़े हुए लोग है।
    reason: lexical_alternative
  - marker: b
    text: मूल गीज़ पाठ संबोधन में “सत्तर” संख्या को दोहराता है—शाब्दिक भाव, “तुम सब सत्तर।”
    reason: textual_or_lexical_clarification
lexical_decisions:
- source_word: ጸውዐ
  choice: बुलाया
  rationale: यहाँ पद सौंपने के लिए अधिकारपूर्वक बुलाने का भाव है; आधुनिक हिन्दी में ‘बुलाया’ स्वाभाविक है और प्रसंग उसकी औपचारिकता स्पष्ट करता है।
- source_word: ኖላዊያነ
  choice: चरवाहों
  rationale: दर्शन के पशु-रूपक को बिना व्याख्यात्मक रूप से शासकों या स्वर्गदूतों में बदलते हुए सुरक्षित रखता है।
- source_word: ገደፎሙ ሎሙ
  choice: उनके हवाले कर दिया
  rationale: देखभाल और उत्तरदायित्व सौंपने का भाव स्पष्ट करता है तथा मूल में निहित सुपुर्दगी को बनाए रखता है।
- source_word: አባግዕ
  choice: भेड़ों
  rationale: ‘झुंड’ की अपेक्षा मूल पशु-प्रतीक को ठोस रूप में बनाए रखता है।
- source_word: ከመ ይርዐይዎሙ
  choice: ताकि वे उन्हें चराएँ
  rationale: चरवाहों द्वारा भेड़ों की देखभाल और चराने की क्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ለጸማዶሙ
  choice: उनके साथियों
  rationale: चरवाहों से जुड़े या उनके साथ नियुक्त लोगों का संबंधसूचक अर्थ रखता है; शब्द का सटीक आशय अनिश्चित होने के कारण पादटिप्पणी दी गई है।
- source_word: ኵሉ ፯፯ እምኔክሙ
  choice: तुम सत्तर के सत्तर
  rationale: मूल पाठ में दोहराई गई संख्या सत्तर और समष्टिगत बल—‘तुम सब सत्तर’—दोनों को सुरक्षित रखता है; इसे केवल ‘तुममें से प्रत्येक’ बनाकर संख्या को हटाया नहीं गया।
- source_word: እምይእዜ
  choice: अब से
  rationale: नियुक्ति के आरम्भ-बिंदु को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ኵሎ ዘአአዝዘክሙ አነ ግበሩ
  choice: जो कुछ मैं तुम्हें आज्ञा दूँ, वह सब करो
  rationale: वक्ता के अधिकार और प्रत्यक्ष आज्ञार्थक बल को बनाए रखता है।
theological_decisions:
- issue: चरवाहों और भेड़ों के प्रतीक की व्याख्या
  choice: मुख्य पाठ में ‘चरवाहे’ और ‘भेड़ें’ ही रखा गया है।
  alternative: उन्हें व्याख्यात्मक रूप से शासक/स्वर्गदूत और लोग/इस्राएल कहना।
  rationale: पशु-दर्शन की सतत प्रतीकात्मक भाषा को उसके अनुमानित ऐतिहासिक या स्वर्गीय संदर्भों में बदलना अनावश्यक सिद्धान्तगत निर्णय होता।
- issue: सत्तर की पुनरावृत्ति
  choice: दूसरी बार भी ‘सत्तर के सत्तर’ के रूप में संख्या को बनाए रखा गया है।
  alternative: केवल ‘तुममें से प्रत्येक’ कहना।
  rationale: गीज़ पाठ संबोधन में संख्या को सचमुच दोहराता है। पुनरावृत्ति नियुक्त समूह की पूर्ण संख्या पर बल दे सकती है; अनुवाद इसे मौन रूप से नहीं हटाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उनके हवाले कर दिया’ सुपुर्दगी का भाव देता है, जबकि चरवाहे और भेड़ों की दर्शनात्मक छवि ज्यों की त्यों रहती है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
