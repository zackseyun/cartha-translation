base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/038.yaml
  text: And that sheep who was leading them[a], who had become a man, was separated from them and lay down[c][b]; and all the sheep sought him and cried out over him with a great cry.
translation:
  language: hi
  text: और वह भेड़, जो उनकी अगुवाई कर रही थी और मनुष्य बन गई थी,[a] उनसे अलग कर दी गई और लेट गई;[b] और सभी भेड़ों ने उसे ढूँढ़ा और उसके विषय में बड़े ऊँचे स्वर में पुकार उठीं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: भेड़ का ‘मनुष्य बन जाना’ इसी स्वप्न-दर्शन के भीतर हुआ प्रतीकात्मक रूपांतरण है; कथा यहाँ अपने रूपकात्मक ढाँचे से बाहर नहीं जाती।
    reason: cultural_note
  - marker: b
    text: ‘लेट गई’ संभवतः इस अगुवे की मृत्यु का संकेत है, पर मूल पाठ इसे दर्शन की इसी छवि के द्वारा व्यक्त करता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “उसके ऊपर/उसके विषय में बड़ी पुकार से पुकार उठीं”; यह अभिव्यक्ति उसके विषय में उठी तीव्र, संभवतः शोकपूर्ण पुकार को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝኩ
  choice: और वह
  rationale: यहाँ ዝኩ संकेतवाचक सर्वनाम है, जिसका अर्थ ‘वह’ है; इसे ‘और मैंने देखा’ मानना पाठ में ऐसा क्रियापद जोड़ देगा जो उपस्थित नहीं है।
- source_word: በግዕ
  choice: भेड़
  rationale: एकवचन भेड़ उस परिचित प्रतीकात्मक अगुवे को सूचित करती है जिसका आगे दो संबंधवाचक उपवाक्यों से वर्णन है।
- source_word: ዘይመርሖሙ
  choice: जो उनकी अगुवाई कर रही थी
  rationale: अपूर्ण पक्ष उसके चलते आ रहे नेतृत्वकारी कार्य को व्यक्त करता है; स्त्रीलिंग क्रिया हिंदी के व्याकरण में ‘भेड़’ के अनुरूप है।
- source_word: ዘኮነ ብእሴ
  choice: और मनुष्य बन गई थी
  rationale: यह स्वप्न-दर्शन के भीतर प्राप्त हुई अवस्था या रूपांतरण को व्यक्त करता है; पूर्णभूत रूप घटनाक्रम को स्वाभाविक हिंदी में रखता है।
- source_word: ተሌለየ እምኔሆሙ
  choice: उनसे अलग कर दी गई
  rationale: मूल का अलगावकारी निष्प्रयोज्य भाव सुरक्षित रहता है और अलग करने वाले कर्ता की पहचान नहीं की जाती।
- source_word: ወሰከበ
  choice: और लेट गई
  rationale: क्रिया का मूल अर्थ ‘लेटना’ है। प्रसंग में मृत्यु का संकेत हो सकता है, पर मुख्य पाठ स्वप्न की प्रतिमा को स्पष्ट व्याख्या में नहीं बदलता।
- source_word: ኃሠሥዎ
  choice: उसे ढूँढ़ा
  rationale: यह खोजने या तलाश करने की सीधी क्रिया है; ‘ढूँढ़ा’ आधुनिक और सहज हिंदी है।
- source_word: ወጸርኁ ዲቤሁ
  choice: उसके लिए ... पुकार उठीं
  rationale: पूर्वसर्ग उस व्यक्ति के ऊपर, उसके विषय में, या उसके लिए शोकपूर्ण पुकार का भाव दे सकता है; हिंदी में ‘उसके लिए’ अस्पष्टता को काफी हद तक बनाए रखते हुए स्वाभाविक है।
- source_word: ጽራኀ ዐቢየ
  choice: बड़े ऊँचे स्वर में
  rationale: यह ‘बड़ी/महान पुकार’ की तीव्रता को प्राकृतिक हिंदी में व्यक्त करता है, बिना उसे औपचारिक विलाप घोषित किए।
theological_decisions:
- issue: भेड़ के लेटने को स्पष्ट रूप से मृत्यु कहना या न कहना
  choice: मुख्य पाठ में ‘लेट गई’ रखकर स्वप्न-दर्शन की प्रतिमा को सुरक्षित रखना
  alternative: ‘मर गई’ या ‘सो गई’
  rationale: प्रसंग मृत्यु की ओर संकेत कर सकता है, लेकिन मूल क्रिया स्वयं ‘लेटने’ की छवि देती है। स्पष्ट ‘मर गई’ कहना निहित अर्थ को पाठ का प्रत्यक्ष कथन बना देगा।
- issue: भेड़ का मनुष्य बनना
  choice: इसे दर्शन के भीतर वास्तविक प्रतीकात्मक रूपांतरण के रूप में व्यक्त करना
  alternative: इसे केवल मनुष्य-सदृश होना या रूपक से बाहर आना बताना
  rationale: मूल का ‘मनुष्य बन गया’ वाला चौंकाने वाला कथन बनाए रखना पशु-दर्शन की प्रतीकात्मक संरचना और उसके तनाव का सम्मान करता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘अगुवाई’, ‘अलग कर दी गई’ और ‘पुकार उठीं’ सर्वसुलभ हैं, जबकि अनावश्यक रूप से संस्कृतनिष्ठ या सांप्रदायिक शब्दावली से बचा गया है। भेड़ के लिए हिंदी व्याकरणानुसार स्त्रीलिंग क्रियाएँ प्रयुक्त हुई हैं; प्रतीक जिस पुरुष अगुवे की ओर संकेत कर सकता है, उसकी पहचान पाठ में आरोपित नहीं की गई।
