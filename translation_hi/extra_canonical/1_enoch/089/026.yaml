  text: And when they saw the Lord of the sheep, And when they saw the Lord of the sheep, they turned back so as to flee from before his face; and that watercourse gathered together, and it became swift according to its nature, and it filled with water and rose up until it covered those wolves. so as to flee from before his face; and that watercourse gathered together, and it became swift according to its nature, and it filled with water and rose up until it covered those wolves.
translation:
  language: hi
  text: और जब उन्होंने भेड़ों के प्रभु को देखा, तो वे उसके सामने से भागने के लिए चले गए। उस जलमार्ग[a] में पानी इकट्ठा हुआ और वह अपने स्वभाव के अनुसार वेगवान हो गया; वह पानी से भर गया और इतना ऊपर उठा कि उसने उन भेड़ियों को ढक लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पानी की धारा” अथवा “बरसाती नाले का पाट”; मूल शब्द ऐसे प्रवाह-पथ का संकेत दे सकता है जो अचानक पानी से भरकर उमड़ पड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እግዚኦሙ ለአባግዕት
  choice: भेड़ों के प्रभु
  rationale: यह पदबंध भेड़ों के स्वामी और शासक को दर्शाता है। “प्रभु” पशु-दृष्टांत के भीतर उसके धार्मिक और साहित्यिक भार को बनाए रखता है।
- source_word: ገብኡ ከመ ይጕየዩ
  choice: वे पलटकर ... भागने लगे
  rationale: ገብአ प्रवेश करने या लौटने/पलटने का भाव दे सकता है। प्रसंग में प्रभु को देखकर उसके सामने से भागना अभिप्रेत है; इसलिए हिंदी में स्वाभाविक और संदर्भानुकूल रूप चुना गया है।
- source_word: እምቅድመ ገጹ
  choice: उसके मुख के सामने से
  rationale: यह सामी उपस्थिति-सूचक मुहावरा है। शाब्दिक चित्र को बनाए रखने से दर्शन में प्रभु की उपस्थिति और उससे उत्पन्न भय का बल सुरक्षित रहता है।
- source_word: ዝኩ ዐይገ ማይ
  choice: वह जलमार्ग
  rationale: पदबंध पानी की धारा के मार्ग, नाले या अचानक भर उठने वाले प्रवाह-पथ को सूचित करता है। “जलमार्ग” स्थलाकृति को अनावश्यक रूप से निश्चित किए बिना आगे के उफान के वर्णन से मेल खाता है।
- source_word: ተጋብአ
  choice: इकट्ठा हुआ
  rationale: यह पानी के एकत्र होने और फिर वेग पकड़ने का चित्र बनाए रखता है।
- source_word: ከመ ፍጥረቱ ፍጡነ
  choice: अपने स्वभाव के अनुसार वेगवान हो गया
  rationale: कठिन पदबंध को अधिक व्याख्यात्मक बनाए बिना जलमार्ग के स्वाभाविक वेग का भाव सुरक्षित रखा गया है।
- source_word: መልአ ማይ
  choice: पानी से भर गया
  rationale: बाढ़ के चित्र का सीधा और स्वाभाविक हिंदी रूप।
- source_word: ተላዐለ እስከ ከደኖሙ ለእልኩ አዝእብት
  choice: इतना ऊपर उठा कि उसने उन भेड़ियों को ढक लिया
  rationale: ከደኖሙ को ‘ढकना’ क्रिया और बहुवचन कर्म-प्रत्यय के साथ समझा गया है; अतः पानी ने स्वयं भेड़ियों को ढक लिया, न कि केवल उनके आश्रय तक पहुँचा।
theological_decisions:
- issue: पशु-दृष्टांत में ईश्वरीय पात्र की उपाधि
  choice: भेड़ों के प्रभु
  alternative: भेड़ों के स्वामी
  rationale: “प्रभु” आवर्ती रूपक और ईश्वरीय गरिमा दोनों को सुरक्षित रखता है, जबकि दृष्टांत को व्याख्यात्मक गद्य में नहीं बदलता।
- issue: न्याय के दृश्य में उपस्थिति-सूचक मुहावरा
  choice: उसके मुख के सामने से
  alternative: उसकी उपस्थिति से
  rationale: मुख का मूल दृश्यात्मक रूप बनाए रखने से प्रकाशनात्मक वर्णन की तीव्रता और सामी शैली सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और दृश्यात्मक शैली रखी गई है। सामी मुहावरे “उसके मुख के सामने से” को जानबूझकर सुरक्षित रखा गया है। मुख्य पाठ में केवल वास्तविक शब्दार्थ-संबंधी अनिश्चितता पर पादटिप्पणी दी गई है; अंतिम वाक्यांश को व्याकरणानुसार भेड़ियों के ढक जाने के रूप में स्पष्ट किया गया है।
