base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/040.yaml
  text: And I saw the sheep until they entered into a good place[a], and into a pleasant and glorious land; and I saw until the sheep were satisfied[c][b], and that house was in their midst in the pleasant land.
translation:
  language: hi
  text: और मैंने भेड़ों को तब तक देखा, जब तक वे एक अच्छे स्थान में और एक मनोहर तथा महिमामय देश में प्रवेश न कर गईं। और मैंने भेड़ों को तब तक देखा, जब तक वे तृप्त न हो गईं; और वह भवन[a] उस मनोहर देश[b] में उनके बीच था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भवन’ दर्शन की प्रतीकात्मक छवि में पवित्रस्थान या मन्दिर की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘मनोहर देश’ पद मूल गीइज़ में पद के अंत में दोबारा आता है और पुनःस्थापित, आशीषित परिवेश पर बल देता है।
    reason: repetition
lexical_decisions:
- source_word: አባግዕ
  choice: भेड़ें
  rationale: पशु-दर्शन की सतत प्रतीकात्मक छवि को अक्षुण्ण रखने के लिए शाब्दिक पशु-संज्ञा रखी गई है; इसे ‘लोग’ या ‘इस्राएल’ कहकर अर्थ नहीं खोला गया।
- source_word: መካን ሠናይ
  choice: एक अच्छा स्थान
  rationale: መካን स्थान और ሠናይ अच्छा/सुंदर दर्शाता है। ‘अच्छा स्थान’ मूल की सरलता और व्यापकता बनाए रखता है।
- source_word: ምድር ኃዋዝ
  choice: मनोहर देश
  rationale: ምድር का अर्थ देश/भूमि और ኃዋዝ का भाव मनोहर या सुखद है। विशेषणात्मक अनुवाद गीइज़ व्याकरण के अनुरूप है और हिन्दी में स्वाभाविक है।
- source_word: ስብሕት
  choice: महिमामय
  rationale: यहाँ स्त्रीलिंग विशेषण के रूप में ‘देश/भूमि’ का वर्णन है; ‘महिमामय’ गौरव और वैभव का ऊँचा भाव बनाए रखता है।
- source_word: ጸግቡ
  choice: तृप्त हो गईं
  rationale: क्रिया भर जाने या संतुष्ट हो जाने का भाव देती है। ‘तृप्त’ पूर्ण प्रबंध और संतोष दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ቤት
  choice: भवन
  rationale: मूल शब्द घर/भवन है। ‘मन्दिर’ सम्भावित प्रतीकात्मक संकेत हो सकता है, पर उसे मुख्य पाठ में निश्चित नहीं किया गया।
- source_word: ማእከሎሙ
  choice: उनके बीच
  rationale: यह भेड़ों के मध्य स्थित उपस्थिति को स्पष्ट और सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या ቤት को मुख्य पाठ में स्पष्ट रूप से ‘मन्दिर’ कहा जाए
  choice: मुख्य पाठ में ‘भवन’ रखा गया
  alternative: ‘मन्दिर’
  rationale: दर्शन में यह भवन सम्भवतः पवित्रस्थान या मन्दिर का प्रतीक है, किन्तु मूल शब्द स्वयं ‘घर/भवन’ है। प्रतीक और उसकी व्याख्या के बीच का तनाव बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, किंतु सामान्य पाठक के लिए सुबोध शैली। ‘और मैंने…देखा’ की दर्शनीय पुनरावृत्ति तथा ‘भेड़ें’, ‘देश’ और ‘भवन’ जैसी मूल प्रतीकात्मक छवियाँ सुरक्षित रखी गई हैं।
