base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/048.yaml
  text: And afterward that ram arose and led the sheep[a]; and that ram fathered many sheep and lay down. And a little sheep became a ram in its place[d][c][b], and it became ruler and leader of those sheep.
translation:
  language: hi
  text: और वह बाद वाला मेढ़ा उठा और भेड़ों की अगुवाई की; और वह मेढ़ा बहुत-सी भेड़ों का पिता बना और लेट गया।[a] तब एक छोटी भेड़[b] उसकी जगह मेढ़ा बन गई, और वह उन भेड़ों की शासक और अगुवा बन गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “लेट गया” संभवतः इस दर्शन में उस मेढ़े की मृत्यु का संकेत है; मुख्य पाठ मूल चित्र को ज्यों का त्यों रखता है।
    reason: lexical_alternative
  - marker: b
    text: “छोटी” का अर्थ “कम उम्र की” या “जवान” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ዳሓራዊ
  choice: बाद वाला
  rationale: यह विशेषण मेढ़े को विशेषित करता है और पहले तथा बाद वाले मेढ़े का भेद बनाए रखता है; इसे केवल कालसूचक क्रियाविशेषण ‘बाद में’ नहीं बनाया गया।
- source_word: ሐርጌ
  choice: मेढ़ा
  rationale: दर्शन में नर भेड़ के विशिष्ट नेतृत्वकारी रूप को ठोस पशु-चित्र के साथ सुरक्षित रखता है।
- source_word: ተንሥአ
  choice: उठा
  rationale: उठने की सीधी कथात्मक क्रिया का स्वाभाविक हिन्दी रूप।
- source_word: መርሖሙ
  choice: अगुवाई करने लगा
  rationale: भेड़ों को आगे ले जाने और नेतृत्व करने—दोनों अर्थछायाओं को सहज हिन्दी में बनाए रखता है।
- source_word: አባግዕ
  choice: भेड़ें
  rationale: प्रतीकात्मक दर्शन के ठोस पशु-चित्र को ‘झुंड’ जैसे सामूहिक शब्द में नहीं बदलता।
- source_word: ንኡስ
  choice: छोटी
  rationale: आकार और कम आयु की संभावित अर्थछायाओं में से किसी एक को पूरी तरह निश्चित नहीं करता; विकल्प पादटिप्पणी में दिया गया है।
- source_word: ወሊደ
  choice: उत्पन्न कीं
  rationale: जनन की क्रिया को स्पष्ट रखता है, किंतु हिन्दी में मेढ़े के लिए अस्वाभाविक या अत्यधिक तकनीकी अभिव्यक्ति से बचता है।
- source_word: ብዙኃነ
  choice: बहुत-सी
  rationale: बहुलता का सीधा और प्रचलित हिन्दी रूप।
- source_word: ሰከበ
  choice: लेट गया
  rationale: मूल दृश्य-चित्र को शाब्दिक रूप से रखता है; मृत्यु की संभावित संकेतार्थता पादटिप्पणी में है।
- source_word: ህየንቴሁ
  choice: उसकी जगह
  rationale: प्रतिस्थापन या उत्तराधिकार का संकेत देता है, बिना ऐतिहासिक पहचान को स्पष्ट रूप से आरोपित किए।
- source_word: መኰንነ
  choice: शासक
  rationale: अधिकार की व्यापक धारणा व्यक्त करता है और किसी विशिष्ट बाद की राजकीय उपाधि को आरोपित नहीं करता।
- source_word: መራሔ
  choice: अगुवा
  rationale: मार्गदर्शन और सामाजिक-राजनीतिक नेतृत्व की अर्थछाया रखता है तथा पहले प्रयुक्त क्रिया से संज्ञात्मक भेद बनाए रखता है।
theological_decisions:
- issue: उत्तराधिकार के सूत्र को प्रत्यक्ष ऐतिहासिक-राजनीतिक भाषा में प्रस्तुत करना या दर्शन के पशु-रूपक में बनाए रखना
  choice: एक छोटी भेड़ उसकी जगह मेढ़ा बन गई
  alternative: एक छोटी/जवान भेड़ उसके उत्तराधिकारी के रूप में मेढ़ा बन गई
  rationale: पाठ संभवतः नेतृत्व या राजवंशीय उत्तराधिकार की ओर संकेत करता है, पर स्वयं उसे पशु-रूपांतरण के दर्शन के रूप में कहता है; अनुवाद प्रतीक को ऐतिहासिक व्याख्या में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। आरंभ में ዳሓራዊ को विशेषण मानकर “बाद वाला मेढ़ा” किया गया है। पहले बहुवचन ‘भेड़ों’ के साथ आलोचनात्मक संस्करण में कोष्ठकित असंगत ንኡስ को मुख्य पाठ में नहीं लिया गया। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
