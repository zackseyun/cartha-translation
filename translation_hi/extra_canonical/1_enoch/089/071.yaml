base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/071.yaml
  text: And the book was read before the Lord of the sheep[a], and he took the book from his hand and read it, and sealed it[c][b], and set it down.
translation:
  language: hi
  text: और वह पुस्तक भेड़ों के प्रभु के सामने पढ़ी गई[a]। और उसने उस पुस्तक को उसके हाथ से लिया[b], पढ़ा, उस पर मुहर लगाई और उसे रख दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध प्रतिलिपि में क्रिया का रूप संक्षिप्त या अपूर्ण प्रतीत होता है। इसे सामान्यतः पूर्ण निष्क्रिय रूप ተነበበ के रूप में समझा जाता है, जिसका अर्थ ‘पढ़ी गई’ है।
    reason: textual_note
  - marker: b
    text: ‘उसके हाथ’ में ‘उसके’ का संकेत किस व्यक्ति की ओर है, यह इस पाठ में स्पष्ट नहीं किया गया है।
    reason: ambiguity
lexical_decisions:
- source_word: መጽሐፍ
  choice: पुस्तक
  rationale: यह लिखित पुस्तक या दस्तावेज़ के लिए सामान्य गीइज़ शब्द है। ‘पुस्तक’ सामग्री के रूप को अनावश्यक रूप से ‘पुस्तक-पट’ या ‘कुंडली’ तक सीमित नहीं करता।
- source_word: ተነበ
  choice: पढ़ी गई
  rationale: उपलब्ध पाठ में रूप अपूर्ण या संदिग्ध जान पड़ता है, पर इसे ተነበበ के संक्षिप्त/दोषपूर्ण साक्ष्य के रूप में समझने पर निष्क्रिय अर्थ ‘पढ़ी गई’ बनता है। आगे प्रभु द्वारा स्वयं पढ़े जाने के कारण क्रिया की पुनरावृत्ति कथानक में सार्थक है।
- source_word: በቅድመ
  choice: के सामने
  rationale: यह उपस्थिति को व्यक्त करने वाला स्वाभाविक हिंदी प्रयोग है और दर्शन के न्यायिक परिवेश को बनाए रखता है।
- source_word: እግዚአ አባግዕ
  choice: भेड़ों के प्रभु
  rationale: ‘प्रभु’ पद की गरिमा और अधिकार बनाए रखता है, जबकि ‘भेड़ों’ का पशु-दर्शन संबंधी रूपक स्पष्ट रहता है।
- source_word: ነሥአ
  choice: ली
  rationale: संदर्भ में पुस्तक को किसी के हाथ से अपने अधिकार में लेने की सीधी क्रिया है।
- source_word: እምእዱ
  choice: उसके हाथ से
  rationale: शाब्दिक ठोस बिंब को बनाए रखता है। गीइज़ पाठ सर्वनाम के पूर्वपद को दोबारा स्पष्ट नहीं करता, इसलिए हिंदी में भी अस्पष्टता सुरक्षित रखी गई है।
- source_word: አንበበ
  choice: पढ़ा
  rationale: लिखित अभिलेख के संदर्भ में सामान्य और सीधा अर्थ ‘पढ़ना’ है।
- source_word: ኀተማ
  choice: उस पर मुहर लगाई
  rationale: यह दस्तावेज़ को मुहरबंद करने की कानूनी अथवा न्यायिक छवि को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: አንበረ
  choice: उसे रख दिया
  rationale: क्रिया रखने या स्थापित करने को सूचित करती है; ‘रख दिया’ पढ़ने और मुहर लगाने के बाद की ठोस क्रिया को सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: पशु-दर्शन में እግዚአ አባግዕ का अनुवाद
  choice: भेड़ों के प्रभु
  alternative: भेड़ों के स्वामी
  rationale: यह पद दर्शन में परमेश्वर की ओर संकेत करता है। ‘प्रभु’ उसके अधिकार और प्रकाशन-साहित्य की गरिमा को बनाए रखता है, पर मूल रूपक को सीधे किसी व्याख्यात्मक नाम से नहीं बदलता।
- issue: दो बार पढ़े जाने की कथात्मक पुनरावृत्ति
  choice: पहले पुस्तक ‘पढ़ी गई’, फिर प्रभु ने उसे ‘पढ़ा’
  alternative: पहले पुस्तक ‘खोली गई’, फिर प्रभु ने उसे पढ़ा
  rationale: 'संभावित पूर्ण गीइज़ रूप ተነበበ निष्क्रिय ‘पढ़ी गई’ का समर्थन करता है। पुनरावृत्ति को कठिन मानकर हटाने के बजाय सुरक्षित रखा गया है: पहले पुस्तक प्रभु के सामने पढ़ी जाती है, फिर वह स्वयं उसे पढ़ता है।'
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण प्रकाशनात्मक शैली अपनाई गई है। वाक्य-विन्यास को स्वाभाविक बनाने के लिए दूसरे वाक्य में ‘तब’ जोड़ा गया है। पशु-दर्शन का रूपक और सर्वनाम की वास्तविक अस्पष्टता सुरक्षित रखी गई है; किसी सांप्रदायिक व्याख्या को पाठ में नहीं जोड़ा गया।
