base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/002.yaml
  text: And again I lifted up my eyes toward heaven[a], and I saw a lofty roof, and seven streams upon it[c][b]; and those streams flowed into an enclosure with much water.
translation:
  language: hi
  text: और फिर मैंने अपनी आँखें आकाश की ओर उठाईं और एक ऊँची छत[a] देखी, जिस पर सात धाराएँ थीं; और वे धाराएँ बहुत जल वाले एक अहाते[b] में बह रही थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल गीइज़ संज्ञा का अर्थ ‘छत’ के साथ-साथ ‘आवरण’ या कोई ऊपरी संरचना भी हो सकता है; दृश्य का ठीक वास्तु-रूप निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: ‘अहाता’ के लिए प्रयुक्त गीइज़ शब्द का अनुवाद ‘घेरा’, ‘परिबद्ध स्थान’ या ‘आँगन’ भी किया जा सकता है।
    reason: lexical_alternative
