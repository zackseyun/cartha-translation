- source_word: ካዕበ
  choice: और फिर
  rationale: यह नए सिरे से आरम्भ होने वाली दर्शनीय क्रिया को चिह्नित करता है और अपोकैलिप्टिक कथा की पुनरावृत्त शैली बनाए रखता है।
- source_word: አልዓልኩ አዕይንትየ
  choice: मैंने अपनी आँखें ... उठाईं
  rationale: साधारण ‘मैंने देखा’ के बजाय मूल की दृष्टि-संबंधी मुहावरेदार अभिव्यक्ति को सुरक्षित रखता है।
- source_word: መንገለ ሰማይ
  choice: आकाश की ओर
  rationale: መንገለ की दिशासूचक शक्ति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ናሕሰ ልዑለ
  choice: एक ऊँची छत
  rationale: ऊँचाई का स्पष्ट बोध बनाए रखते हुए ናሕሰ को छत के रूप में प्रस्तुत किया गया है; संज्ञा की व्यापक अर्थ-सम्भावना पादटिप्पणी में दी गई है।
- source_word: ወ፯አስራብ ዲቤሁ
  choice: जिस पर सात धाराएँ थीं
  rationale: जल-दृश्य में አስራብ को ‘धाराएँ’ कहना स्वाभाविक है और ‘जिस पर’ छत के साथ उसके स्थानिक सम्बन्ध को सुरक्षित रखता है।
- source_word: እልኩ አስራብ
  choice: वे धाराएँ
  rationale: निर्देशवाचक पद पहले बताई गई सात धाराओं की ओर लौटता है।
- source_word: ይውሕዙ
  choice: बह रही थीं
  rationale: जल की गतिशीलता और मूल क्रिया के अपूर्ण/प्रगतिशील भाव को बिना अतिरिक्त तीव्रता जोड़े व्यक्त करता है।
- source_word: ዐጸድ
  choice: अहाता
  rationale: यह सामान्य हिन्दी शब्द घिरे हुए स्थान का बोध देता है और अगले पदों में उसी स्थान के पुनः उल्लेख के लिए एक सुसंगत संज्ञा उपलब्ध कराता है।
- source_word: ማየ ብዙሐ
  choice: बहुत जल से भरे
  rationale: जल की प्रचुरता को ठोस और सहज भाषा में व्यक्त करता है; वाक्य-विन्यास इसे अहाते से सम्बद्ध दिखाता है, जैसा उपलब्ध पाठ में सम्भव है।
