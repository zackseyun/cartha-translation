base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/064.yaml
  text: And let them not know[a], and do not show them, and do not rebuke them; but write down all the destruction of the shepherds, each one in its time[c][b], and bring all of it up before me.
translation:
  language: hi
  text: और वे न जानें; तुम उन्हें न दिखाना और न उन्हें डाँटना। बल्कि चरवाहों से हुआ सारा विनाश—हर एक का उसके समय पर—लिख लेना,[a] और वह सब ऊपर मेरे पास ले आना।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में शाब्दिक रूप से संबंधसूचक वाक्यांश ‘चरवाहों का सारा विनाश’ है। प्रसंग इसे चरवाहों से हुए विनाश की ओर इंगित करता है। ‘हर एक का उसके समय पर’ वाला अंश भी पाठ की दृष्टि से कठिन है और क्रमशः, एक-एक करके लेखा रखने का भाव दे सकता है।
    reason: textual_variant
  - marker: b
    text: ‘ऊपर मेरे पास ले आना’ का अनुवाद ‘वह सब मेरे सामने प्रस्तुत करना’ भी हो सकता है; यहाँ मूल की ऊपर चढ़ाने वाली छवि रखी गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወኢያእምሩ
  choice: और वे न जानें
  rationale: तीसरे पुरुष बहुवचन के नकारात्मक इच्छार्थक रूप को निषेधात्मक अर्थ में रखा गया है; यह भूतकालीन कथन नहीं है।
- source_word: ወኢታርእዮሙ
  choice: तुम उन्हें न दिखाना
  rationale: क्रिया का उपसर्ग दूसरे पुरुष एकवचन को सूचित करता है; इसलिए इसे संबोधित व्यक्ति को दिए गए निषेध के रूप में अनूदित किया गया है।
- source_word: ወኢትዝለፎሙ
  choice: और न उन्हें डाँटना
  rationale: मूल क्रिया में फटकारने या दोष ठहराने का भाव है। साधारण पाठक के लिए स्वाभाविक रहते हुए ‘डाँटना’ न्यायिक कठोरता को पर्याप्त रूप से बनाए रखता है।
- source_word: አላ፡ ጸሐፍ
  choice: बल्कि … लिख लेना
  rationale: विरोधसूचक अव्यय और आज्ञार्थक क्रिया, हस्तक्षेप न करने से लेखा दर्ज करने की आज्ञा की ओर स्पष्ट मोड़ दिखाते हैं।
- source_word: ኵሎ፡ ሐጕለ፡ ኖላዊያን
  choice: चरवाहों से हुआ सारा विनाश
  rationale: ‘विनाश’ मूल संज्ञा की तीव्रता रखता है। संबंधसूचक पदबंध को प्रसंग में चरवाहों द्वारा कराए गए विनाश के रूप में व्यक्त किया गया है, जबकि टिप्पणी में उसकी व्याकरणिक संक्षिप्तता का संकेत दिया गया है।
- source_word: በጊዜሁ፡ ለለ፡ ፩፩
  choice: हर एक का उसके समय पर
  rationale: यह समय और वितरण—दोनों का भाव रखता है, पर अस्पष्ट रूप से यह तय नहीं करता कि ‘हर एक’ सीधे चरवाहे को सूचित करता है या विनाश की प्रत्येक घटना को।
- source_word: ወአዐርግ፡ ኵሎ፡ ኀቤየ
  choice: और वह सब ऊपर मेरे पास ले आना
  rationale: कारणवाचक ‘ऊपर चढ़ाना/ले आना’ की ऊर्ध्व दिशा को बनाए रखा गया है, जो स्वर्गीय लेखा प्रस्तुत किए जाने के दृश्य के अनुकूल है।
theological_decisions:
- issue: चरवाहों के प्रति तत्काल हस्तक्षेप न करना
  choice: वक्ता आदेश देता है कि वे न जानें, उन्हें न दिखाया जाए और न डाँटा जाए; इसके बदले विनाश का पूरा लेखा रखा जाए।
  alternative: इसे भूतकाल में ‘वे नहीं जानते थे, और मैंने उन्हें नहीं दिखाया’ समझा जा सकता था।
  rationale: क्रियारूप निषेधात्मक इच्छार्थक/आज्ञार्थक हैं, इसलिए तत्काल दंड या चेतावनी को टालकर भावी लेखे और न्याय की ओर रहने वाला तनाव बनाए रखा गया है।
- issue: ‘चरवाहों का विनाश’ का संबंध
  choice: प्रसंगानुसार चरवाहों से हुए विनाश को दर्ज करना।
  alternative: चरवाहों के अपने विनाश को दर्ज करना।
  rationale: पशु-दर्शन के प्रसंग में चरवाहे विनाश के कर्ता हैं; फिर भी मूल संबंधसूचक रचना संक्षिप्त है, इसलिए इसे पादटिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। निषेधात्मक रूपों में ‘न जानें’ और ‘न दिखाना’ से व्याकरणिक भेद स्पष्ट किया गया है। ‘ऊपर मेरे पास’ स्वर्गीय प्रस्तुति की दिशा को बनाए रखता है।
