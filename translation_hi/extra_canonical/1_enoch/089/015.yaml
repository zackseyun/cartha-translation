  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। पशु-रूपक को स्पष्ट रखा गया है और ‘बच्चे’ शब्द द्वारा पशु-संतान तथा मानवीय संकेत की द्विस्तरीयता सुरक्षित रखी गई है। सभी पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं।
