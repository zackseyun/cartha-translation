base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/015.yaml
  text: And the wolves began to terrify them and to oppress them[a], until they destroyed their little ones and cast their little ones into a stream of much water[c][b]. And those sheep began to cry out because of their little ones and to lament before their Lord.
translation:
  language: hi
  text: और भेड़िए उनसे डरने और उन पर अत्याचार करने लगे[a], यहाँ तक कि उन्होंने उनके बच्चों को नष्ट कर दिया और भेड़ियों ने उनके बच्चों को बहुत पानी की धारा में फेंक दिया[b]। तब वे भेड़ें अपने बच्चों के कारण पुकारने लगीं और अपने प्रभु[c] के सामने विलाप करने लगीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उन पर अत्याचार करने’ का अनुवाद ‘उन पर आक्रमण करने’ भी हो सकता है; गीइज़ क्रिया बलपूर्वक शत्रुतापूर्ण कार्रवाई का बोध करा सकती है।
    reason: lexical_alternative
  - marker: b
    text: ‘बहुत पानी की धारा’ का अनुवाद ‘बहुत पानी वाली नदी’ या ‘प्रचुर पानी का तेज बहाव’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘अपने प्रभु’ को पशु-रूपक के स्तर पर ‘अपने स्वामी’ भी समझा जा सकता है, पर इस दर्शन का संदर्भ परमेश्वर की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: አዝእብት
  choice: भेड़िए
  rationale: दर्शन के पशु-रूपक को ज्यों का त्यों रखते हुए बहुवचन पशु-संज्ञा का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ይፈርህዎሙ
  choice: उन्हें डराने
  rationale: 'यहाँ क्रिया का कारक भाव संदर्भ के अनुकूल है: भेड़िए स्वयं भयभीत नहीं होते, बल्कि भेड़ों को आतंकित करते हैं।'
- source_word: አጠቅዎሙ
  choice: उन पर अत्याचार करने
  rationale: क्रिया दबाने, सताने या आक्रमण करने जैसी बलपूर्ण शत्रुतापूर्ण कार्रवाई व्यक्त कर सकती है; ‘अत्याचार’ लगातार होने वाले उत्पीड़न को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: እስከ ያኅልቅ
  choice: यहाँ तक कि उन्होंने ... नष्ट कर दिया
  rationale: यह वाक्यांश हिंसा के परिणाम और उसकी चरम सीमा को व्यक्त करता है।
- source_word: ደቂቆሙ
  choice: उनके बच्चों
  rationale: ‘बच्चे’ भेड़ों की संतानों और रूपक के मानवीय संकेत—दोनों को बनाए रखता है; ‘शावक’ भेड़ों के लिए अनुपयुक्त और ‘मेमने’ स्रोत से अधिक विशिष्ट होता।
- source_word: ወገደፉ
  choice: फेंक दिया
  rationale: जलधारा में बलपूर्वक डालने की क्रिया को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: በውኂዘ ማይ ብዙኅ
  choice: बहुत जल वाली धारा में
  rationale: जल की प्रचुरता और जलमार्ग—दोनों को बनाए रखता है, बिना उसे निश्चित रूप से नदी या बाढ़ की धारा ठहराए।
- source_word: እልኩ አባግዕ
  choice: वे भेड़ें
  rationale: संकेतवाचक भाव पहले उल्लिखित उसी झुंड की ओर लौटने को दर्शाता है।
- source_word: ይጸርኁ
  choice: पुकारने लगीं
  rationale: शोक और सहायता की तीव्र पुकार को सरल, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: በእንተ ደቂቆሙ
  choice: अपने बच्चों के कारण
  rationale: 'पूर्वसर्ग को कारणवाचक रूप में लिया गया है: बच्चों के साथ हुई घटना ही उनकी पुकार का कारण है।'
- source_word: ይስክዩ
  choice: विलाप करने लगीं
  rationale: दुःख से भरी मुखर फरियाद का भाव रखता है और इसे केवल शिकायत तक सीमित नहीं करता।
- source_word: ኀበ እግዚኦሙ
  choice: अपने प्रभु के सामने
  rationale: दिशा और उपस्थिति का भाव रखते हुए दिव्य संबोधन को व्यक्त करता है; रूपक के स्तर पर ‘स्वामी’ भी संभव है।
theological_decisions:
- issue: እግዚኦሙ को ‘प्रभु’ या ‘स्वामी’ के रूप में प्रस्तुत करना
  choice: अपने प्रभु के सामने
  alternative: अपने स्वामी के सामने / अपने प्रभु के पास
  rationale: स्वप्न-दर्शन के व्यापक संदर्भ में भेड़ों की पुकार परमेश्वर की ओर है, इसलिए ‘प्रभु’ धार्मिक अर्थ को बनाए रखता है; पादटिप्पणी पशु-रूपक में संभव ‘स्वामी’ अर्थ को भी खुला रखती है।
