  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/039.yaml
  text: And I saw until they grew quiet from the outcry for that sheep[a], and they crossed that stream of water. And the other two sheep, which were leading them, stood in place of those who had lain down[e][d][c][b], and they led them.
translation:
  language: hi
  text: और मैं देखता रहा, जब तक वे उस भेड़ के लिए पुकारना बंद करके शांत न हो गईं। फिर वे उस जलधारा[b] को पार कर गईं। और वे अन्य दो भेड़ें, जो उनकी अगुवाई कर रही थीं, जो लेट चुकी थीं उनके स्थान पर खड़ी हो गईं[c] और उनकी अगुवाई की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘जलधारा’ का अनुवाद प्रसंग के अनुसार ‘बहता पानी’, ‘नाला’ या ‘नदी’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘जो लेट चुकी थीं, उनके स्थान पर खड़ी हो गईं।’ यह कठिन वाक्यांश संभवतः अगुवाई में स्थान लेने का संकेत देता है, पर ‘लेट चुकी थीं’ का अर्थ मुख्य पाठ में अधिक स्पष्ट नहीं किया गया है।
    reason: textual_difficulty
lexical_decisions:
- source_word: አርመሙ
  choice: शांत हो गईं
  rationale: क्रिया चुप या शांत होने की प्रक्रिया बताती है। ‘शांत हो गईं’ पूर्ववर्ती कोलाहल के थमने को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह जोड़े कि किसी ने उन्हें बलपूर्वक चुप कराया।
- source_word: እምጽራኁ
  choice: कोलाहल के बाद
  rationale: संज्ञा पुकार, चीत्कार या कोलाहल का बोध कराती है। ‘कोलाहल’ दृश्य की सामूहिक और व्याकुल ध्वनि बनाए रखता है; ‘के बाद’ हिन्दी में उस अवस्था से शांत होने का स्वाभाविक संबंध व्यक्त करता है।
- source_word: በግዕ
  choice: भेड़
  rationale: दर्शन के पशु-प्रतीक को ठोस रूप में बनाए रखने के लिए ‘भेड़’ रखा गया है; इसे ‘झुंड’ या किसी ऐतिहासिक समुदाय के नाम से नहीं बदला गया।
- source_word: ውሒዘ ማይ
  choice: जलधारा
  rationale: पदबंध बहते हुए जल को सूचित करता है। ‘जलधारा’ सुबोध है और ‘नदी’ की अपेक्षा उसके आकार को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ካልኤሆሙ
  choice: दूसरी भेड़ों में से वे दो
  rationale: यह भेड़ों के भीतर एक अलग जोड़ी की ओर संकेत करता है। इस रूप में भिन्नता और संख्या दोनों स्पष्ट रहती हैं।
- source_word: ይመርሕዎሙ
  choice: उनकी अगुवाई कर रही थीं
  rationale: मूल क्रिया नेतृत्व या मार्गदर्शन का सामान्य अर्थ देती है। अपूर्ण क्रिया-रूप उन दो भेड़ों की उस समय चल रही भूमिका को व्यक्त करता है।
- source_word: ተክሎሙ
  choice: के स्थान पर
  rationale: यहाँ रूप को ‘उनके स्थान पर/उनके बदले’ अर्थ वाले पूर्वसर्ग और बहुवचन प्रत्यय के रूप में लिया गया है, न कि ‘स्थापित किया’ अर्थ वाली क्रिया के रूप में।
- source_word: ለእለ ሰከቡ
  choice: लेट चुकी भेड़ों
  rationale: क्रिया का सामान्य अर्थ लेटना है। ‘गिर पड़ी’ या ‘मर गई’ जैसे अधिक व्याख्यात्मक अर्थ थोपे बिना पूर्वकालिकता बनाए रखी गई है; हिन्दी में संदर्भ की स्पष्टता के लिए ‘भेड़ों’ दोहराया गया है।
- source_word: መርሕዎሙ
  choice: उनकी अगुवाई की
  rationale: मूल की कथात्मक पुनरावृत्ति को बनाए रखने के लिए अंत में भी वही मुख्य अभिव्यक्ति दोहराई गई है।
theological_decisions:
- issue: पशु-प्रतीकों की ऐतिहासिक या धार्मिक पहचान
  choice: ‘भेड़’ और घटनाक्रम को दर्शन के ठोस चित्र के रूप में रखा गया है।
  alternative: ‘लोग’, ‘इस्राएली’ या किसी विशेष ऐतिहासिक अगुवे जैसे व्याख्यात्मक नाम मुख्य पाठ में रखना।
  rationale: पशु-दर्शन अपनी बात निरंतर प्रतीकात्मक चित्रों के द्वारा कहता है। अनुवाद को इन चित्रों को पहले से किसी एक ऐतिहासिक या सांप्रदायिक व्याख्या में नहीं बदलना चाहिए।
- issue: लेट चुकी भेड़ों के स्थान पर खड़े होने का आशय
  choice: मूल की स्थानापन्नता और ‘लेटने’ की भाषा दोनों सुरक्षित रखी गई हैं।
  alternative: इसे स्पष्ट रूप से मृत अगुवों का उत्तराधिकार बताना।
  rationale: संदर्भ में मृत्यु या नेतृत्व-परिवर्तन का संकेत संभव है, पर मुख्य पाठ में उसे स्पष्ट कथन बना देना मूल की रूपकात्मक अस्पष्टता को समाप्त कर देगा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और कथात्मक। स्त्रीलिंग क्रियाएँ ‘भेड़ों’ के साथ स्वाभाविक सामंजस्य रखती हैं। ‘मैं देखता रहा’ दर्शन की जारी अवलोकन-शैली को और ‘अगुवाई’ मूल की पुनरावृत्ति को सुरक्षित रखता है।
