base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/019.yaml
  text: And from it I saw the wolves[a], and they became exceedingly strong against the sheep with all their power[c][b], and the sheep cried out.
translation:
  language: hi
  text: और उससे मैंने भेड़ियों को देखा[a]; वे अपनी पूरी शक्ति से भेड़ों के विरुद्ध अत्यन्त शक्तिशाली हो गए, और भेड़ें पुकार उठीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसमें से” अथवा “वहाँ से”; मूल सर्वनाम का संकेत इस वाक्य को अकेले पढ़ने पर निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እምኔሁ
  choice: वहाँ से
  rationale: እም के साथ सर्वनाम-प्रत्यय का अर्थ संदर्भानुसार ‘उससे’, ‘उसमें से’ या ‘वहाँ से’ हो सकता है। दर्शन के दृश्य-क्रम में ‘वहाँ से’ स्वाभाविक है, जबकि पादटिप्पणी मूल की संदिग्धता सुरक्षित रखती है।
- source_word: ርኢክዎሙ
  choice: मैंने ... देखा
  rationale: यह प्रथम-पुरुष दर्शन-वर्णन का सामान्य क्रियापद है; सरल हिन्दी कथन-शैली को बनाए रखा गया है।
- source_word: አዝእብት
  choice: भेड़ियों
  rationale: यह ዝእብ (‘भेड़िया’) का बहुवचन है; ‘भेड़िए’ पशु-दर्शन की विशिष्ट प्रतीकात्मक छवि को सुरक्षित रखता है।
- source_word: አፎ
  choice: —
  rationale: यहाँ አፎ अगले कथन को जोड़ते हुए ‘कैसे/कि’ का भाव देता है। स्वाभाविक हिन्दी में अलग ‘कैसे’ जोड़ने के बजाय अर्धविराम के बाद सीधा कथन रखा गया है।
- source_word: ጸንዑ
  choice: शक्तिशाली हो गए
  rationale: क्रिया दृढ़ या प्रबल हो जाने का भाव देती है; भूतकालीन दर्शन-वर्णन में ‘हो गए’ उपयुक्त है।
- source_word: ፈድፋደ
  choice: अत्यन्त
  rationale: यह क्रिया-विशेषण शक्ति की तीव्रता बढ़ाता है, न कि अलग से संख्या-वृद्धि की क्रिया बताता है।
- source_word: ዲበ አባግዕ
  choice: भेड़ों के विरुद्ध
  rationale: ዲበ का मूल स्थानिक भाव ‘पर’ है, पर इस शत्रुतापूर्ण प्रसंग में ‘के विरुद्ध’ आशय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: በኵሉ ኃይሎሙ
  choice: अपनी पूरी शक्ति से
  rationale: यह वाक्यांश भेड़ियों की समूची सामर्थ्य पर बल देता है; हिन्दी में यह संक्षिप्त और मुहावरेदार है।
- source_word: ጸርኁ
  choice: पुकार उठीं
  rationale: क्रिया ऊँचे स्वर से पुकारने का संकेत देती है, पर यह तय नहीं करती कि पुकार विलाप, भय या सहायता की गुहार थी।
theological_decisions:
- issue: पशु-दर्शन की प्रतीकात्मक भाषा
  choice: ‘भेड़ियों’ और ‘भेड़ों’ जैसे ठोस पशु-संज्ञाओं को मुख्य पाठ में बनाए रखा गया है।
  alternative: उन्हें व्याख्यात्मक रूप से मानवीय राष्ट्रों, शासकों या इस्राएल के रूप में प्रस्तुत करना।
  rationale: पाठ पहले दर्शन में दिखाई देने वाली छवियों का वर्णन करता है। उनके ऐतिहासिक या धार्मिक संकेतार्थ को मुख्य अनुवाद में आरोपित करना मूल की सर्वनाश-संबंधी प्रतीकात्मकता को समय से पहले खोल देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण दर्शन-वर्णन। ‘अत्यन्त शक्तिशाली’ मूल के तीव्र बलाघात को रखता है; पशु-प्रतीकों की व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
