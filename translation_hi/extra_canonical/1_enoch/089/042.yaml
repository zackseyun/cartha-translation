base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/042.yaml
  text: And dogs and foxes and wild boars of the field began to devour those sheep[b][a], until the Lord of the sheep raised up from among them one ram to lead them.
translation:
  language: hi
  text: और कुत्ते, लोमड़ियाँ[a] और मैदान के जंगली सूअर उन भेड़ों को खा जाने लगे और उन्हें तब तक खाते रहे, जब तक भेड़ों के प्रभु ने उन्हीं में से एक मेढ़े[b] को उठाया कि वह उनकी अगुवाई करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पशु-संज्ञा ‘सियार’ जैसे व्यापक लोमड़ी-कुल के शिकारी अथवा मुर्दाखोर पशु को भी सूचित कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ उपलब्ध पाठ में ‘एक मेढ़े’ के आसपास कठिन अथवा पाठांतरयुक्त शब्द हैं; कुछ रूपों में ‘एक और भेड़’ जैसा पाठ दिखाई देता है। प्रसंग का मूल भाव स्पष्ट है कि झुंड में से एक नर भेड़ अगुवे के रूप में उठाया गया।
    reason: textual_variant
lexical_decisions:
- source_word: አኃዙ
  choice: लगे
  rationale: यहाँ क्रिया अगली क्रिया के आरम्भ को व्यक्त करती है; हिन्दी में ‘खा जाने लगे’ स्वाभाविक रूप से वही भाव देता है।
- source_word: አክላብ
  choice: कुत्ते
  rationale: स्रोत का सामान्य पशु-संज्ञक अर्थ यही है; ‘शिकारी कुत्ते’ कहना अनावश्यक विशिष्टता जोड़ता।
- source_word: ቈናጽል
  choice: लोमड़ियाँ
  rationale: लोमड़ी-जैसे शिकारी अथवा मुर्दाखोर पशु के लिए यह मानक अर्थ है, यद्यपि ‘सियार’ भी प्रसंगानुसार सम्भव है।
- source_word: ሐራዊያ ሐቅል
  choice: मैदान के जंगली सूअर
  rationale: यह अनुवाद जंगली शूकर और खुले मैदान—दोनों तत्वों को बनाए रखता है तथा दर्शन की पशु-प्रतीकात्मकता के अनुकूल है।
- source_word: ይብልዕዎሙ
  choice: उन भेड़ों को खा जाने
  rationale: ‘खा जाना’ हिंसक विनाश का भाव देता है और आधुनिक हिन्दी में ‘भक्षण करना’ से अधिक सहज है।
- source_word: ዝኩ አባግዕ
  choice: उन भेड़ों
  rationale: संकेतवाचक शब्द दर्शन में पहले से सामने मौजूद विशिष्ट झुंड की ओर संकेत करता है।
- source_word: እስከ አንሥአ
  choice: जब तक ... नहीं उठाया
  rationale: यह संरचना जारी हिंसा की सीमा और प्रभु के हस्तक्षेप—दोनों को स्वाभाविक हिन्दी में व्यक्त करती है; ‘नियुक्त किया’ मूल से अधिक व्याख्यात्मक होता।
- source_word: እግዚአ አባግዕ
  choice: भेड़ों के प्रभु
  rationale: यह पशु-दर्शन में बार-बार आने वाली महत्त्वपूर्ण उपाधि है; ‘प्रभु’ उसके अधिकार और धार्मिक भार को सुरक्षित रखता है।
- source_word: ፩እምኔሆሙ
  choice: उन्हीं में से एक
  rationale: यह स्पष्ट करता है कि अगुवा उसी झुंड के भीतर से उठाया गया था।
- source_word: ሐርጌ
  choice: मेढ़े
  rationale: शब्द नर भेड़ को दर्शाता है; ‘मेढ़ा’ झुंड की सामान्य भेड़ों से उसका प्रतीकात्मक भेद बनाए रखता है।
- source_word: ዘይመርሖሙ
  choice: कि वह उनकी अगुवाई करे
  rationale: यह नेतृत्व अथवा मार्गदर्शन का अर्थ सीधे व्यक्त करता है और मूल में निहित न होने वाली विस्तृत चरवाही की भाषा नहीं जोड़ता।
theological_decisions:
- issue: पशु-दृष्टान्त में ईश्वरीय उपाधि
  choice: भेड़ों के प्रभु
  alternative: भेड़ों के स्वामी
  rationale: ‘प्रभु’ केवल मालिकाना अधिकार से अधिक ऊँचा धार्मिक भाव बनाए रखता है और इस दर्शन में प्रयुक्त आवर्ती उपाधि के अनुकूल है।
- issue: मेढ़े का उठाया जाना
  choice: उठाया
  alternative: नियुक्त किया
  rationale: ‘उठाया’ स्रोत की अभिव्यक्ति और ईश्वरीय हस्तक्षेप को सुरक्षित रखता है, जबकि ‘नियुक्त किया’ औपचारिक पदस्थापन का अर्थ जोड़ सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप रखा गया है। ‘खा जाने लगे’ हिंसक दृश्य को सामान्य पाठक के लिए स्पष्ट करता है; ‘भेड़ों के प्रभु’ और ‘अगुवाई’ दर्शन की धार्मिक तथा प्रतीकात्मक भाषा बनाए रखते हैं।
