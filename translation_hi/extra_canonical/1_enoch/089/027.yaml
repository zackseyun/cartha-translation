translation:
  language: hi
  text: और मैं देखता रहा, जब तक कि उन भेड़ों के पीछे चलनेवाले सभी भेड़िए नष्ट होकर डूब नहीं गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወርኢኩ
  choice: और मैं देखता रहा
  rationale: दर्शन-वृत्तांत की प्रथम-पुरुष शैली को रखते हुए यह चलती हुई दृष्टि का स्वाभाविक हिन्दी रूप है।
- source_word: እስከ
  choice: जब तक
  rationale: यह दर्शन के जारी रहने को उसके परिणाम तक ले जाता है; हिन्दी में ‘देखता रहा, जब तक’ इस संरचना को स्पष्ट रखता है।
- source_word: ተሐጕሉ
  choice: नष्ट होकर
  rationale: पहली परिणामसूचक क्रिया विनाश या नाश को व्यक्त करती है और अगली क्रिया ‘डूब गए’ से अलग रखी गई है।
- source_word: ኵሎሙ አዝእብት
  choice: सभी भेड़िए
  rationale: አዝእብት का विशिष्ट अर्थ ‘भेड़िए’ है; पशु-दर्शन की प्रतीकात्मक भाषा को व्याख्यात्मक रूप से नहीं खोला गया।
- source_word: እለ ተለውዎሙ
  choice: उन भेड़ों के पीछे चले
  rationale: क्रिया का अर्थ उनके पीछे चलना या उनका पीछा करना है। ‘पीछे चले’ मूल की संभावित तटस्थता रखता है, जबकि प्रसंग में शत्रुतापूर्ण पीछा समझ में आता है।
- source_word: ለዝኩ አባግዕ
  choice: उन भेड़ों
  rationale: संकेतवाचक पद पहले से दृष्टि में उपस्थित भेड़ों की ओर लौटता है।
- source_word: ወተሠጥሙ
  choice: और डूब नहीं गए
  rationale: अंतिम क्रिया डूबने या जलमग्न होने को बताती है। ‘जब तक’ वाली हिन्दी रचना में ‘नहीं’ परिणाम की सीमा व्यक्त करने के लिए आवश्यक है, निषेध के अर्थ में नहीं।
theological_decisions:
- issue: प्रतीकात्मक पशुओं के ऐतिहासिक या सामूहिक अभिप्राय को मुख्य पाठ में स्पष्ट करना
  choice: ‘भेड़िए’ और ‘भेड़ें’ की मूल पशु-छवि बनाए रखना
  alternative: उन्हें मिस्री, राष्ट्र, अगुवे या इस्राएल जैसे व्याख्यात्मक नामों से प्रस्तुत करना
  rationale: पशु-दर्शन अपना अर्थ सतत प्रतीकात्मक चित्रों के द्वारा देता है। मुख्य पाठ में प्रतीकों को खोल देना अनुवाद के बजाय व्याख्या होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक। दो अलग परिणामसूचक क्रियाओं—नष्ट होना और डूबना—को अलग रखा गया है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, इसलिए मुख्य पाठ में पाद-टिप्पणी चिह्न नहीं हैं।
