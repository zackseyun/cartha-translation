base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/041.yaml
  text: And sometimes their eyes were opened[a], and sometimes they were blinded, until another sheep arose and led them and brought them all in[c][b], and their eyes were opened.
translation:
  language: hi
  text: कभी उनकी आँखें खुल जाती थीं[a], और कभी वे अंधे हो जाते थे, जब तक कि एक और भेड़ उठ खड़ी हुई और उसने उनकी अगुवाई की और उन सबको भीतर ले आई[b]; और उनकी आँखें खुल गईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस दर्शन में आँखों का खुलना सम्भवतः जागृति, पहचान या विवेक लौटने का प्रतीक है, पर पाठ इस छवि का अर्थ स्वयं स्पष्ट नहीं करता।
    reason: cultural_note
  - marker: b
    text: इस वाक्यांश का अनुवाद ‘उन सबको इकट्ठा करके ले आई’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ቦ ሰበ … ወቦ ሶበ
  choice: कभी … और कभी
  rationale: यह गीइज़ मुहावरा अलग-अलग समूहों के लिए ‘कुछ … कुछ’ नहीं, बल्कि समय के बदलते क्रम के लिए ‘कभी … कभी’ व्यक्त करता है।
- source_word: ይትከሠታ አዕይንቲሆሙ
  choice: उनकी आँखें खुल जाती थीं
  rationale: यह आँखों के खुलने या अनावृत होने की पुनरावर्ती प्रक्रिया को व्यक्त करता है और हिन्दी में ‘कभी’ के साथ स्वाभाविक है।
- source_word: ይጼልሙ
  choice: वे अंधे हो जाते थे
  rationale: दृष्टि के अंधकारमय हो जाने का अर्थ इस दर्शनीय पशु-रूपक में स्पष्ट रूप से व्यक्त होता है, जबकि इसे केवल शारीरिक या आत्मिक अर्थ तक सीमित नहीं किया गया।
- source_word: ተንሥአ ካልእ በግዕ
  choice: एक और भेड़ उठ खड़ी हुई
  rationale: ‘भेड़’ मूल पशु-छवि और अनिर्दिष्ट लिंग को बनाए रखती है; ‘उठ खड़ी हुई’ घटनाक्रम में उसके उभरकर सक्रिय होने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: መርሖሙ
  choice: उसने उनकी अगुवाई की
  rationale: यह नेतृत्व के सामान्य अर्थ को रखता है और मूल क्रिया में स्पष्ट न की गई चरवाही की अतिरिक्त व्यंजना नहीं जोड़ता।
- source_word: አግብኦሙ ለኵሎሙ
  choice: उन सबको भीतर ले आई
  rationale: यह पाठ में निहित भीतर लाने की दिशात्मकता को बनाए रखता है; साथ ही पादटिप्पणी में इकट्ठा करने की सम्भावित अर्थच्छाया दी गई है।
- source_word: ተከሥታ አዕይንቲሆሙ
  choice: उनकी आँखें खुल गईं
  rationale: आरम्भ की छवि की पुनरावृत्ति सुरक्षित रहती है और उसके प्रतीकात्मक अर्थ की व्याख्या अनावश्यक रूप से निश्चित नहीं की जाती।
theological_decisions:
- issue: पशु-दर्शन में आँखों के खुलने का अर्थ
  choice: आँखों के खुलने की शाब्दिक दर्शनीय छवि को बनाए रखना
  alternative: इसे स्पष्ट रूप से पश्चात्ताप, आत्मिक समझ या राजनीतिक पुनर्स्थापना कहना
  rationale: दृष्टान्त में यह छवि प्रतीकात्मक हो सकती है, पर पाठ स्वयं उसका केवल एक अर्थ निर्धारित नहीं करता; इसलिए अनुवाद उसकी धार्मिक और साहित्यिक बहुअर्थता सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किन्तु गरिमापूर्ण शैली रखी गई है। वाक्य की आवृत्तिमूलक संरचना और पशु-दर्शन की मूल छवियाँ सुरक्षित हैं; व्याख्यात्मक धार्मिक शब्दावली नहीं जोड़ी गई।
