base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/043.yaml
  text: And that ram began to gore on this side and on that side those dogs and foxes and wild boars[c][b][a], until he had destroyed them all.
translation:
  language: hi
  text: और वह मेढ़ा इस ओर और उस ओर[b] उन कुत्तों, लोमड़ियों[a] और जंगली सूअरों को सींग मारने लगा, जब तक कि उसने उन सबका नाश नहीं कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ अनूदित पशु-नाम का अर्थ अधिक व्यापक रूप से कोई जंगली कुत्ते-जैसा पशु, जैसे ‘सियार’, भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘इस ओर से और उस ओर से’; अर्थात दोनों ओर या चारों तरफ आक्रमण करते हुए।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝኩ
  choice: और वह
  rationale: गीज़ में यहाँ दर्शन-वर्णन का क्रियापद ‘मैंने देखा’ नहीं है; संयोजक और संकेतवाचक भाव को सीधे रखा गया है।
- source_word: ሐርጌ
  choice: मेढ़ा
  rationale: यह शब्द प्रसंग में मेढ़े को दर्शाता है, ‘सींग’ को नहीं; इससे पशु-रूपक और निकटवर्ती पदों की संगति बनी रहती है।
- source_word: አኃዘ ይወግእ
  choice: सींग मारने लगा
  rationale: क्रिया आक्रमण के आरंभ और मेढ़े द्वारा टक्कर/सींग मारने की विशिष्ट क्रिया व्यक्त करती है; सामान्य ‘युद्ध करने लगा’ पशु-रूपक को धुंधला कर देता।
- source_word: እምዝየ ወእምዝየ
  choice: इस ओर और उस ओर
  rationale: दोहराई हुई दिशात्मक अभिव्यक्ति को बनाए रखता है और दोनों ओर किए गए आक्रमण का भाव देता है।
- source_word: ዝኩ አክላብ
  choice: उन कुत्तों
  rationale: संकेतवाचक तत्व ‘उन’ के द्वारा व्यक्त किया गया है और पशु-प्रतीक का शाब्दिक रूप सुरक्षित रखा गया है।
- source_word: ቈናጽል
  choice: लोमड़ियों
  rationale: यह एक संभव और सहज पशु-पहचान है; व्यापक जंगली कुत्ते या सियार का अर्थ भी संभव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: ሐራዊያ ገዳም
  choice: जंगली सूअरों
  rationale: यह खुले या वन्य क्षेत्र के सूअरों का स्वाभाविक हिन्दी रूप है और दृश्य की ठोस पशु-छवि बनाए रखता है।
- source_word: እስከ ለኵሎሙ አኅጐሎሙ
  choice: जब तक कि उसने उन सबका नाश नहीं कर दिया
  rationale: वाक्यांश विरोधी पशुओं पर पूर्ण विजय और उनके समूल विनाश का परिणाम बताता है।
theological_decisions:
- issue: पशु-प्रतीकों की ऐतिहासिक पहचान मुख्य पाठ में दी जाए या नहीं
  choice: कुत्तों, लोमड़ियों और जंगली सूअरों की प्रत्यक्ष पशु-छवि को बनाए रखा गया
  alternative: पाठ में ही इन पशुओं को कथित ऐतिहासिक राष्ट्रों या समूहों के नामों से बदलना
  rationale: यह सर्वनाश-साहित्य का रूपकात्मक दर्शन है; अनुवाद को प्रतीकों का अर्थ किसी एक ऐतिहासिक व्याख्या तक सीमित नहीं करना चाहिए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मेढ़ा’ और ‘सींग मारने लगा’ दृश्य की विशिष्ट पशु-रूपकात्मक क्रिया को सुरक्षित रखते हैं। पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित शब्दों के तुरंत बाद दिए गए हैं।
