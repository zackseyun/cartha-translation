base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/068.yaml
  text: And the shepherds and their companions handed over those sheep to all the wild beasts of the desert[a], so that they might devour them; and all of them, each in its time, was delivered over by number—sixty from among them—while the record of the others was written down in the book[d][c][b], how many were destroyed from among them.
translation:
  language: hi
  text: और चरवाहों तथा उनके साथियों ने उन भेड़ों को निर्जन प्रदेश के सब जंगली पशुओं के हाथ सौंप दिया, ताकि वे उन्हें खा जाएँ। और वे सभी अपने-अपने समय पर गिनती के अनुसार सौंपे गए—उनमें से साठ[a]—और बाकियों का लेखा पुस्तक में लिखा गया[b] कि उनमें से कितने नष्ट हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस साक्ष्य में अंक और उसके आसपास की हिसाब-संबंधी भाषा कठिन है। उपलब्ध पाठ ‘साठ’ की ओर संकेत करता है, पर संभव है कि गणना का पाठ दूषित या अनिश्चित हो। मुख्य बात यह है कि भेड़ों को एक गिनी हुई और दर्ज की गई संख्या के अनुसार सौंपा गया।
    reason: textual_variant
  - marker: b
    text: 'शाब्दिक भाव: “पुस्तक में लिखा गया।” यह दर्शन में विनाश का लेखा दर्ज किए जाने की छवि को आगे बढ़ाता है।'
    reason: lexical_clarification
