  choice: चरवाहों
  rationale: यह पशु-दर्शन के रूपक को सीधे बनाए रखता है और इन पात्रों की पहचान को व्याख्या द्वारा स्वर्गदूतों या मानवीय शासकों तक सीमित नहीं करता।
- source_word: ጸማዶሙ
  choice: उनके साथियों
  rationale: यह उनसे जुड़े या उनके साथ रहनेवाले पात्रों का अर्थ देता है, पर उनकी भूमिका को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: መጠውዎሙ / ይትሜጠው
  choice: सौंप दिया / सौंपे गए
  rationale: दोनों रूप किसी दूसरे के अधिकार में दे दिए जाने का भाव रखते हैं; एक ही क्रिया-परिवार से अनुवाद करने पर पद की पुनरावृत्ति और न्याय-संबंधी गंभीरता बनी रहती है।
- source_word: እእኩ አባግዕ
  choice: उन भेड़ों
  rationale: दर्शन में प्रयुक्त पशु-रूपक का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: አራዊተ ገዳም
  choice: निर्जन प्रदेश के सब जंगली पशुओं
  rationale: ገዳም निर्जन या वन्य भूभाग को सूचित करता है; यह रूप 'रेगिस्तान' की अनावश्यक रूप से संकीर्ण भौगोलिक छवि से बचते हुए भयावह वन्य परिवेश को बनाए रखता है।
- source_word: ከመ ይብልዕዎሙ
  choice: ताकि वे उन्हें खा जाएँ
  rationale: यह प्रयोजनवाचक उपवाक्य और पशुओं द्वारा भक्षण की ठोस छवि दोनों को स्पष्ट रखता है।
- source_word: በጊዜሁ
  choice: अपने-अपने समय पर
  rationale: संदर्भ में क्रमशः या नियत अवसर पर होने का वितरणात्मक भाव है।
- source_word: በኍልቍ
  choice: गिनती के अनुसार
  rationale: शब्द संख्यात्मक गणना या लेखे को व्यक्त करता है; यह आधुनिक हिन्दी में स्पष्ट है और आगे के पुस्तक-संबंधी लेखे से मेल खाता है।
- source_word: ፷፻ እምኔሆሙ
  choice: उनमें से साठ
  rationale: उपलब्ध गीइज़ साक्ष्य में दिखाई देनेवाली गणना के अनुरूप 'साठ' रखा गया है, पर पाठ और अंक-संयोजन की अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: ለካልኡ በመጽሐፍ ይጸሐፍ
  choice: बाकियों का लेखा पुस्तक में लिखा गया
  rationale: यह वाक्य को स्वाभाविक हिन्दी बनाते हुए लिखित हिसाब-किताब के भाव को सुरक्षित रखता है।
- source_word: ሚመጠነ ያሐጕል እምኔሆሙ
  choice: कि उनमें से कितने नष्ट हुए
  rationale: यह नष्ट होनेवालों की संख्या दर्ज किए जाने का अर्थ व्यक्त करता है और हिंसक संदर्भ को नरम नहीं करता।
theological_decisions:
- issue: ‘चरवाहों’ की पहचान
  choice: मुख्य पाठ में उन्हें रूपक के चरवाहों के रूप में ही रखा गया है।
  alternative: उन्हें सीधे स्वर्गदूत निरीक्षक या विदेशी शासक कहना।
  rationale: पशु-दर्शन की प्रतीकात्मक भाषा को किसी एक ऐतिहासिक या धर्मवैज्ञानिक पहचान में बदलना मूल की अर्थगत गुंजाइश को समाप्त कर देता।
- issue: सौंपे जाने और लिखित लेखे का संबंध
  choice: घटना को गिनती और पुस्तक में दर्ज लेखे के साथ रखा गया है, पर इससे आगे कोई धर्मसिद्धान्त नहीं जोड़ा गया।
  alternative: इसे मुख्य पाठ में स्पष्ट रूप से ईश्वरीय अनुमति, पूर्वनियति या अंतिम न्याय कहना।
  rationale: मूल में नियंत्रित गणना और अभिलेखन की छवि है, किंतु उसका धर्मवैज्ञानिक कर्ता या सटीक तात्पर्य इस पद में स्पष्ट नहीं किया गया।
