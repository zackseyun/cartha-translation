base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/017.yaml
  text: And he called that sheep which had escaped from the wolves[a], and spoke with him about the wolves, so that he might hear concerning them[d][c][b], that they might not oppress the sheep.
translation:
  language: hi
  text: और उसने उस भेड़ को बुलाया जो भेड़ियों से बच निकली थी, और उससे भेड़ियों के विषय में बात की, ताकि वह उनके विषय में सुने[a] कि वे भेड़ों पर अत्याचार न करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह वाक्यांश मूल में कठिन है। इसका अनुवाद ‘ताकि वह उनके विरुद्ध सुने’ भी हो सकता है; संभव है कि आशय भेड़ियों के बारे में चेतावनी सुनना या उनके विरुद्ध कोई बात सुनना हो।
    reason: alternative_reading
lexical_decisions:
- source_word: ጸውዖ
  choice: बुलाया
  rationale: मूल क्रिया का सामान्य अर्थ बुलाना या अपने पास बुलाना है; यह कथात्मक सरलता बनाए रखता है।
- source_word: በግዕ
  choice: भेड़
  rationale: यहाँ शब्द एकवचन ‘भेड़’ को सूचित करता है। ‘मेढ़ा’ कहने से मूल में निहित न होने वाला नर-लिंग और अधिक विशिष्ट अर्थ जुड़ जाएगा।
- source_word: ዘተኃጥአ እምአዝእብት
  choice: जो भेड़ियों से बच निकली थी
  rationale: इस संदर्भ में क्रिया अलग होकर बच निकलने या छूट जाने का भाव देती है, और አዝእብት का अर्थ ‘भेड़िये’ है; अतः इसे पाप करने के रूप में नहीं लिया गया।
- source_word: ተናገሮ በእንተ አዝእብት
  choice: उससे भेड़ियों के विषय में बात की
  rationale: यह वाक्यांश संबोधित भेड़ से भेड़ियों के संबंध में बोलने को व्यक्त करता है।
- source_word: ከመ ይስምዕ ዲቤሆሙ
  choice: ताकि वह उनके विषय में सुने
  rationale: मूल वाक्यांश वाक्य-विन्यास की दृष्टि से कठिन है। ‘विषय में सुने’ संबंधसूचक अर्थ को रखता है, जबकि विरोधसूचक संभाव्यता को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: ኢይግስስዎሙ ለአባግዕ
  choice: वे भेड़ों पर अत्याचार न करें
  rationale: क्रिया हिंसक व्यवहार, उत्पीड़न या हानि पहुँचाने का भाव दे सकती है। ‘अत्याचार न करें’ बलपूर्वक हानि के अर्थ को रखता है, पर ‘नोच डालें’ जैसी अत्यधिक विशिष्ट व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: बुलाई गई भेड़ के बारे में नैतिक दोष का संकेत
  choice: जो भेड़ियों से बच निकली थी
  alternative: जो भेड़ों में से पाप कर चुकी थी
  rationale: शब्द-समूह और तत्काल पशु-रूपक भेड़ियों से बच निकलने का अर्थ समर्थित करते हैं। ‘पाप किया था’ कहने से इस पात्र पर ऐसा नैतिक दोष आरोपित होगा जो इस पाठ में आवश्यक नहीं है।
- issue: कठिन श्रवण-वाक्यांश का अर्थ
  choice: उनके विषय में सुने
  alternative: उनके विरुद्ध सुने
  rationale: संबंधसूचक और विरोधसूचक दोनों संभावनाएँ मौजूद हैं। मुख्य पाठ में अपेक्षाकृत तटस्थ रूप रखा गया है और विरोधसूचक विकल्प पादटिप्पणी में दिया गया है, ताकि अस्पष्टता दबाई न जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण कथात्मक शैली अपनाई गई है। पशु-दर्शन की बार-बार आने वाली शब्दावली को ‘भेड़’, ‘भेड़िये’ और ‘भेड़ें’ के रूप में एकसमान रखा गया है। कठिन मध्यवर्ती उपवाक्य को अत्यधिक सुगम बनाकर उसका अनिश्चित अर्थ तय नहीं किया गया।
