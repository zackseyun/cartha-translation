  terminology: “भेड़,” “भेड़िये,” and “भेड़ें” consistently preserve the animal imagery. “बुलाया” is suitable for the narrative verb. No unjustified gendered rendering such as “मेढ़ा,” nor an unsupported moral charge of sin, has been introduced.
