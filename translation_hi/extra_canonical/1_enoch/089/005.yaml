base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/005.yaml
  text: And all the cattle in that enclosure were gathered together[a], until I saw them sink, and be swallowed up[d][c][b], and be destroyed in that water.
translation:
  language: hi
  text: और उस बाड़े में जितने भी मवेशी थे, वे सब इकट्ठे हो गए[a], यहाँ तक कि मैंने उन्हें उस पानी में डूबते, निगल लिए जाते और नष्ट होते देखा[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बाड़ा’ के लिए ‘मैदान’ या ‘चरागाह’ भी संभव है; गीइज़ शब्द खेती या चराई से जुड़ी खुली अथवा घिरी भूमि को दर्शा सकता है। निकटवर्ती प्रसंग के स्थान को एक ही बनाए रखने के लिए यहाँ ‘बाड़ा’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक वाक्य-विन्यास में दृष्टा कहता है, ‘मैंने उन्हें डूबते, निगल लिए जाते और नष्ट होते देखा’; इससे दर्शन की प्रत्यक्षता बनी रहती है।
    reason: grammar_note
  - marker: c
    text: 'मूल में तीन अलग क्रियाएँ दृश्य को तीव्र बनाती हैं: वे डूबते हैं, निगल लिए जाते हैं और पानी में नष्ट होते हैं।'
    reason: literary_note
lexical_decisions:
- source_word: ኵሎሙ
  choice: जितने भी…वे सब
  rationale: यह प्रयोग समस्त समूह को समेटने वाले गीइज़ परिमाणवाचक का स्वाभाविक हिन्दी रूप है।
- source_word: አላህምት
  choice: मवेशी
  rationale: यह पालतू झुंड के सामूहिक पशु-चित्र को बनाए रखता है; इसे मनुष्यों के किसी समूह के रूप में व्याख्यायित नहीं करता।
- source_word: ዐጸድ
  choice: बाड़ा
  rationale: अध्याय के निकटवर्ती प्रसंग में यही स्थान पानी से भरता है; इसलिए ‘बाड़ा’ स्थानिक निरंतरता बनाए रखता है, जबकि शब्द के ‘मैदान/चरागाह’ अर्थ को पादटिप्पणी में रखा गया है।
- source_word: ተጋብኡ
  choice: इकट्ठे हो गए
  rationale: यह सामूहिक एकत्र होने के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है और कर्तृवाच्य अथवा कर्मवाच्य को अनावश्यक रूप से कठोर नहीं बनाता।
- source_word: እስክነ ርኢክዎሙ
  choice: यहाँ तक कि मैंने उन्हें…देखा
  rationale: क्रिया में उपस्थित बहुवचन कर्म-प्रत्यय को ‘उन्हें’ से स्पष्ट रखा गया है और आगे की क्रियाओं को दृश्य के प्रत्यक्ष कर्मपूरक रूप में जोड़ा गया है।
- source_word: ይሠጠሙ
  choice: डूबते
  rationale: जल में नीचे जाने या डूबने का प्रत्यक्ष और सजीव भाव देता है।
- source_word: ይትወንጡ
  choice: निगल लिए जाते
  rationale: मध्य/कर्मवाच्य विपत्ति-चित्र को बनाए रखता है और केवल ‘ढक जाने’ की अपेक्षा मूल की प्रबलता व्यक्त करता है।
- source_word: ይትኃጐሉ
  choice: नष्ट होते
  rationale: तीन क्रियाओं की चरम परिणति को व्यक्त करता है, बिना ‘सर्वथा मिटा दिए जाने’ जैसा अतिरिक्त अर्थ जोड़े।
- source_word: ማይ
  choice: पानी
  rationale: मूल में एकवचन संज्ञा है; बाढ़ का व्यापक संदर्भ आसपास के दर्शन से स्पष्ट होता है।
theological_decisions:
- issue: स्वप्न-दर्शन में पशु-प्रतीक
  choice: प्रतीक को ‘मवेशी’ के ठोस पशु-चित्र के रूप में रखा गया है।
  alternative: इसे सीधे ‘लोग’ या किसी विशिष्ट मानव-समूह के रूप में खोल देना।
  rationale: पाठ का दर्शन निरंतर पशु-प्रतीकों में बात करता है; अनुवाद को प्रतीक सुरक्षित रखना चाहिए, न कि मुख्य पाठ में उसका धर्मवैचारिक अर्थ निश्चित कर देना।
- issue: विनाश की तीन क्रमिक क्रियाएँ
  choice: ‘डूबते, निगल लिए जाते और नष्ट होते’—तीनों क्रियाएँ अलग रखी गई हैं।
  alternative: इन सबको केवल ‘डूबकर मरते’ में समेट देना।
  rationale: मूल की संचयी तीव्रता और न्याय-विनाश का तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक लहजा अपनाया गया है। ‘मवेशी’, ‘बाड़ा’ और ‘पानी’ सामान्य पाठक के लिए स्पष्ट हैं; साथ ही अपोकैलिप्टिक पशु-चित्र और मूल की तीन-क्रियात्मक तीव्रता अक्षुण्ण रखी गई है।
