- source_word: ኢተቀትለ
  choice: मारा नहीं गया
  rationale: नकारात्मक कर्मवाच्य का सीधा और स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: ቀነጸ
  choice: उछलकर उठा
  rationale: मूल में अचानक ऊपर की ओर होने वाली गति का संकेत है; यह पशु-दर्शन की सजीव छवि बनाए रखता है।
- source_word: ጸርኀ
  choice: पुकार उठा
  rationale: यह तीव्र स्वर में पुकारने को व्यक्त करता है, पर विलाप, चेतावनी या संबोधन में से किसी एक अर्थ को निश्चित नहीं करता।
- source_word: ዲበ አባግዕ
  choice: भेड़ों के ऊपर
  rationale: ዲበ का मूल स्थानिक/दिशात्मक भाव सुरक्षित रखा गया है; सम्भावित अर्थ ‘भेड़ों से’ या ‘भेड़ों के विषय में’ पादटिप्पणी में दिए गए हैं।
- source_word: ፈቀዱ ይቅትልዎ
  choice: वे उसे मार डालना चाहते थे
  rationale: यह रचना इच्छा या इरादा व्यक्त करती है; हिन्दी में यह सीधा और स्वाभाविक है।
- source_word: እግዚአ አባግዕ
  choice: भेड़ों के प्रभु
  rationale: पशु-दर्शन में यह परमेश्वर के लिए प्रयुक्त श्रद्धापूर्ण उपाधि है; ‘प्रभु’ उसके धार्मिक और राजकीय भार को बनाए रखता है।
- source_word: አድኃኖ
  choice: बचा लिया
  rationale: यहाँ कर्ता भेड़ों का प्रभु है, इसलिए सक्रिय उद्धार का स्पष्ट भाव व्यक्त किया गया है।
- source_word: እምኔሆሙ ለአባግዕት
  choice: भेड़ों के बीच से
  rationale: प्रत्यययुक्त ‘उनसे’ को बाद का संज्ञापद ‘भेड़ें’ स्पष्ट करता है; हिन्दी में ‘भेड़ों के बीच से’ अलग किए जाने और वहीं से बचाए जाने दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: አዕረጎ ኀቤየ
  choice: उसे ऊपर मेरे पास ले आए
  rationale: क्रिया में ऊपर की ओर गति निहित है और दर्शन में वक्ता की ओर लाए जाने का भाव है।
- source_word: አንበሮ
  choice: मेरे सामने रख दिया
  rationale: लाकर स्थापित या रख दिए जाने की ठोस क्रिया को प्रसंगानुकूल हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पशु-दर्शन में ईश्वरीय उपाधि का अनुवाद
  choice: भेड़ों के प्रभु
  alternative: भेड़ों के स्वामी
  rationale: यह उपाधि दर्शन में परमेश्वर का श्रद्धापूर्ण परोक्ष नाम है। ‘प्रभु’ केवल मालिकाना अर्थ तक सीमित न रहकर ईश्वरीय शासन और गरिमा को भी बनाए रखता है।
- issue: उद्धार पाने वाले पात्र का लिंग और स्वरूप
  choice: लिंग-निरपेक्ष ‘वह/उसे’
  alternative: संज्ञा जोड़कर पात्र की पहचान निश्चित करना
  rationale: मूल पद इस वाक्य में पात्र की प्रतीकात्मक पहचान को स्पष्ट संज्ञा से नहीं बताता; इसलिए अनुवाद उसे किसी ऐतिहासिक या धार्मिक व्यक्ति के रूप में नामित नहीं करता।
