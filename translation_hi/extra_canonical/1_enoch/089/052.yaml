  yaml_path: translation/extra_canonical/1_enoch/089/052.yaml
  text: And one of them escaped and was not killed[a]; and it cried out over the sheep, and they wanted to kill it, but the Lord of the sheep saved it from among the sheep[c][b], and brought it up to me and set it down.
translation:
  language: hi
  text: और उनमें से एक बच निकला और मारा नहीं गया। वह उछलकर उठा और भेड़ों के ऊपर चिल्ला उठा[a]। वे उसे मार डालना चाहते थे, पर भेड़ों के प्रभु ने उसे भेड़ों के बीच से बचा लिया[b], उसे ऊपर मेरे पास ले आया और रख दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘भेड़ों को पुकारा’ या ‘भेड़ों के विषय में चिल्लाया’ भी हो सकता है; यहाँ प्रयुक्त गीइज़ संबंधबोधक के एक से अधिक अर्थ सम्भव हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रचना ‘उसे उनसे—अर्थात् भेड़ों से—बचाया’ जैसी है।
    reason: grammatical_clarification
