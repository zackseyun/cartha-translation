  yaml_path: translation/extra_canonical/1_enoch/089/025.yaml
  text: And those wolves again showed themselves to the sheep[a], and they went into the midst of that stream of water[d][c][b]; and those wolves followed the sheep and ran after them into that stream of water.
translation:
  language: hi
  text: और वे भेड़िए फिर भेड़ों का पीछा करने लगे, और भेड़ें उस जलधारा के बीच में चली गईं। तब वे भेड़िए भेड़ों का पीछा करते हुए उनके पीछे दौड़े और उस जलधारा में जा पहुँचे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम गीइज़ वाक्य में ‘वे भेड़िए,’ ‘भेड़ें,’ और ‘उस जलधारा’ के संबंध में पीछा करने का भाव दोहराया गया है। अनुवाद इस पुनरावृत्ति को बनाए रखता है। उपलब्ध लिप्यंतरण के आरंभ में OCR-विकृति प्रतीत होती है; मुद्रित पाठ के अनुसार वहाँ अर्थ है, ‘वे भेड़िए फिर भेड़ों का पीछा करने लगे।’
    reason: textual_variant
lexical_decisions:
- source_word: ወጓዲሆሙ፡ ዝኩ፡ አዝእብት
  choice: और उन भेड़ियों ने फिर
  rationale: स्वप्न-दर्शन की पुनरावृत्त कथाशैली और भेड़ियों की ओर संकेत बनाए रखा गया है। आरंभिक शब्द का पाठ संदिग्ध है; प्रसंगानुकूल पुनरावृत्ति को ‘फिर’ से व्यक्त किया गया।
- source_word: አርእይዎሙ፡ ለአባግዕ
  choice: भेड़ों को अपने को दिखाया
  rationale: उपलब्ध गीइज़ पाठ में ‘देखना’ की कारक क्रिया दिखाई देती है। हिंदी में असामान्यता को पूरी तरह मिटाए बिना उसका संभावित अर्थ व्यक्त किया गया है; पाठ-संदेह को टिप्पणी में रखा गया है।
- source_word: ለአባግዕ
  choice: भेड़ों
  rationale: सर्वनामी या ऐतिहासिक व्याख्या देने के बजाय दर्शन की ठोस पशु-प्रतीकात्मकता सुरक्षित रखी गई है।
- source_word: ማእከለ፡ ዝኩ፡ ዐይገ፡ ማይ
  choice: उस जलधारा के बीच में
  rationale: स्थानसूचक ‘बीच’ और जल के प्रवाह/मार्ग की छवि दोनों को स्वाभाविक आधुनिक हिंदी में रखा गया है, बिना उसे विशेष रूप से नदी या प्रचंड धारा ठहराए।
- source_word: ተለውዎሙ፡ ለአባግዕ
  choice: भेड़ों के पीछे हो लिए
  rationale: ተለወ का मूल भाव पीछे चलना या पीछा करना है। अगले पद में दौड़ने का स्पष्ट उल्लेख होने से यहाँ ‘पीछे हो लिए’ क्रम और पुनरावृत्ति दोनों को बनाए रखता है।
- source_word: ወረጹ፡ ድኅሬሆሙ
  choice: उनके पीछे दौड़ते हुए
  rationale: गति-सूचक क्रिया और ‘पीछे’ को प्रत्यक्ष रूप से व्यक्त किया गया है, जिससे पीछा करने की जीवंतता बनी रहती है।
theological_decisions:
- issue: पशु-दर्शन की प्रतीकात्मकता
  choice: ‘भेड़िए’, ‘भेड़ें’ और ‘जलधारा’ को पाठ में ठोस रूप में बनाए रखना
  alternative: इनके स्थान पर मिस्रियों, इस्राएलियों और लाल समुद्र जैसे संभावित ऐतिहासिक संकेतार्थ रख देना
  rationale: अनुवाद को दर्शन की अपनी प्रतीकात्मक भाषा सुरक्षित रखनी चाहिए; ऐतिहासिक पहचान को मूल पाठ में मिला देना व्याख्यात्मक तनाव समाप्त कर देगा।
- issue: पहली क्रिया का संदिग्ध पाठ
  choice: दिए गए गीइज़ पाठ की ‘दिखाने’ वाली क्रिया का मुख्य पाठ में अनुवाद और पाठ-संदेह का पादटिप्पणी में उल्लेख
  alternative: संदिग्ध स्कैन-पाठ के आधार पर सीधे ‘पीछा किया’ लिखना
  rationale: उपलब्ध मूल-पाठ साक्ष्य और उसके संबंध में दर्ज पाठालोचनात्मक आपत्ति दोनों को सामने रखा गया है; किसी एक को बिना सूचना निर्णायक नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल किंतु गरिमापूर्ण दर्शनीय कथन। पशु-प्रतीकों को बिना व्याख्यात्मक प्रतिस्थापन के रखा गया है। ‘अपने को दिखाया’ जानबूझकर कुछ असामान्य है, क्योंकि स्रोत की कारक ‘देखना’ क्रिया और पाठगत कठिनाई को अत्यधिक सहज बनाकर छिपाया नहीं गया।
