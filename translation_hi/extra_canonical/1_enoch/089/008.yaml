base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/008.yaml
  text: And the water began to descend into them until the earth was laid bare[a]; and that vessel rested upon the earth, and darkness was removed[d][c][b], and light came to be.
translation:
  language: hi
  text: और जल उनमें उतरने लगा[a], यहाँ तक कि धरती उजागर हो गई; और वह जलयान[b] धरती पर टिक गया। अंधकार हटा दिया गया, और प्रकाश हो गया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध गीइज़ पाठ का रूप शाब्दिक रूप से ‘और जब जल उनमें उतर रहा था’ भी समझा जा सकता है। कुछ पाठ-समीक्षक यहाँ निकट वर्तनी वाले रूप को मानकर ‘जल उनमें उतरने लगा’ पढ़ते हैं।
    reason: textual_variant
  - marker: b
    text: यहाँ प्रयुक्त गीइज़ शब्द कठिन है। प्रसंग में इसे ‘जलयान’ समझा गया है; ‘पात्र’ या ‘नाव’ भी संभव अनुवाद हैं।
    reason: lexical_alternative
  - marker: c
    text: अंधकार से प्रकाश की ओर यह परिवर्तन सृष्टि या पुनर्स्थापन की छवि जगा सकता है, पर अनुवाद ने मूल के सामान्य शब्दों को किसी मानक उत्पत्ति-सूत्र के अनुरूप नहीं बदला है।
    reason: cross_reference
lexical_decisions:
- source_word: ወአንዘ፡ ማይ፡ ይረድ
  choice: और जल उनमें उतरने लगा
  rationale: संदर्भ में जल पहले खोली गई गहराइयों में नीचे जाने लगता है। उपलब्ध पाठ का ወአንዘ सामान्यतः ‘जबकि’ हो सकता है, पर इसे ወአኀዘ (‘आरम्भ किया’) का पाठ-दोष मानने पर अपूर्ण क्रिया ይረድ के साथ आरम्भसूचक अर्थ बनता है; इस पाठगत अनिश्चितता को पादटिप्पणी में रखा गया है।
- source_word: ውስቴቶሙ
  choice: उनमें
  rationale: बहुवचन सर्वनाम पिछले पद में उल्लिखित गहराइयों की ओर संकेत करता है। ‘उनके बीच’ कहने से जल के उन गहराइयों के भीतर उतरने का स्थानिक अर्थ धुँधला पड़ सकता था।
- source_word: ተከሥተ፡ ምድር
  choice: धरती उजागर हो गई
  rationale: क्रिया धरती के खुलने या दिखाई देने का भाव देती है। ‘उजागर’ आधुनिक हिन्दी में स्वाभाविक है और जल उतरने पर भूमि के प्रकट होने को व्यक्त करता है।
- source_word: መስቀር
  choice: जलयान
  rationale: बाढ़-दर्शन के प्रसंग और वाक्य में धरती पर टिकने वाली वस्तु के आधार पर इसे नाव अथवा पोत-जैसे पात्र के रूप में लिया गया है। शब्द कठिन है, इसलिए विकल्प पादटिप्पणी में दर्ज है।
- source_word: ተገኅሰት፡ ጽልመት
  choice: अंधकार हटा दिया गया
  rationale: मूल में निष्क्रिय रूप से अंधकार के हटाए जाने का भाव है। हिन्दी में यह अभिकर्ता को अनिर्दिष्ट रखते हुए मूल की संरचना और संभावित धार्मिक तनाव दोनों बनाए रखता है।
- source_word: ኮነ፡ ብርሃን
  choice: प्रकाश हो गया
  rationale: ኮነ का मूल अर्थ ‘हुआ/हो गया’ है। यह रचना-संबंधी प्रतिध्वनि को रहने देता है, पर किसी परिचित उत्पत्ति-वाक्य को अधिक स्पष्ट रूप से आरोपित नहीं करता।
theological_decisions:
- issue: अंतिम वाक्यांश को उत्पत्ति-वर्णन की निश्चित उद्धृति के रूप में प्रस्तुत करना
  choice: प्रकाश हो गया
  alternative: प्रकाश दिखाई दिया
  rationale: अंधकार से प्रकाश की ओर गति सृष्टि या पुनर्स्थापन की छवि जगा सकती है, किंतु मूल केवल सामान्य क्रिया ኮነ का प्रयोग करता है। इसलिए संभावित अंतर्पाठीय संकेत को रखा गया है, पर उसे स्पष्ट उद्धरण या सिद्धान्तगत पहचान नहीं बनाया गया।
- issue: अंधकार के हटने में कर्ता की पहचान
  choice: अंधकार हटा दिया गया
  alternative: अंधकार हट गया
  rationale: निष्क्रिय अभिव्यक्ति मूल रूप के अधिक निकट है और यह निश्चित नहीं करती कि क्रिया का प्रत्यक्ष कर्ता कौन है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु दर्शन-साहित्य के अनुरूप गरिमापूर्ण रखी गई है। ‘जलयान’ सामान्य पाठक के लिए बोधगम्य है और ‘पोत’ की अपेक्षा कम पुरातन लगता है। छोटे समन्वित वाक्य मूल की क्रमिक दृश्यात्मक गति बनाए रखते हैं। सभी पाठगत और अर्थगत अनिश्चितताओं को मुख्य पाठ में जबरन सुलझाने के बजाय पादटिप्पणियों में स्पष्ट किया गया है।
