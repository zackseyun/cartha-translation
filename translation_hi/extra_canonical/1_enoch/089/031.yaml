  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। पशु-दर्शन की प्रतीकात्मक भाषा को “मेढ़ा” द्वारा सुरक्षित रखा गया है। अनिश्चित उपवाक्य वर्ग कोष्ठकों में है और दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
