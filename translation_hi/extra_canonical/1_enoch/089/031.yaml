base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/031.yaml
  text: And all those feared and trembled before him[a], and they followed after that ram that was with them [that was in their midst][c][b], because it was not able to stand before our Lord and look at him.
translation:
  language: hi
  text: और वे सब उससे डर गए और काँपने लगे। उन्होंने अपने साथ के उस मेढ़े को—[जो उनके बीच में था][a]—उसके पीछे से पुकारकर कहा,[b] “हम अपने प्रभु के सामने खड़े होकर उनकी ओर देखने में समर्थ नहीं हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जो उनके बीच में था” स्रोत साक्ष्य में कोष्ठकों में है; संभव है कि यह बाद की या अनिश्चित पाठ-रीति हो।
    reason: textual_variant
  - marker: b
    text: यह गीज़ वाक्यांश कठिन है। इसका अर्थ उसके पीछे से पुकारना या बोलना हो सकता है; कुछ पाठक इसे उसके पीछे चलना, उससे विनती करना, अथवा मेढ़े के विषय में उसे पुकारना भी समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሎሙ እልኩ
  choice: वे सब
  rationale: यह पदबंध पहले बताए गए समूह की ओर सामूहिक रूप से संकेत करता है। कठिन रूप እልኩ को शब्दशः और अस्वाभाविक ढंग से बढ़ाने के बजाय उसका संकेतवाचक बल रखा गया है।
- source_word: ይፈርሁ ወይርዐዱ
  choice: डर गए और काँपने लगे
  rationale: दोनों क्रियाओं को अलग रखा गया है, ताकि भीतरी भय और उसकी शारीरिक प्रतिक्रिया दोनों व्यक्त हों।
- source_word: እምኔሁ
  choice: उससे
  rationale: पूर्वसर्ग का मूल भाव भय के स्रोत को दर्शाता है; आधुनिक हिन्दी में “उससे डर गए” स्वाभाविक है और “उसके सामने” वाली अगली अभिव्यक्ति से अनावश्यक पुनरावृत्ति भी नहीं होती।
- source_word: ወደርኁ ድኅሬሁ ለዝኩ በግዕ
  choice: उन्होंने ... उस मेढ़े को ... उसके पीछे से पुकारकर कहा
  rationale: यह कठिन वाक्यांश पुकारने/बोलने और ‘उसके पीछे’ की स्थानगत धारणा को जोड़ता प्रतीत होता है। इसे केवल शारीरिक रूप से “पीछे चले” मानने के बजाय संबोधन के रूप में रखा गया है, क्योंकि अगला प्रथम-पुरुष बहुवचन कथन उसी पुकार की विषयवस्तु बनता है। अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: ለዝኩ በግዕ
  choice: उस मेढ़े को
  rationale: पशु-दर्शन में प्रजाति और लिंगगत प्रतीकात्मकता महत्त्वपूर्ण है; इसलिए सामान्य “भेड़” के बजाय नर पशु “मेढ़ा” रखा गया है।
- source_word: ምስሌሆሙ
  choice: अपने साथ के
  rationale: यह मेढ़े का समूह के साथ होना बताता है; संक्षिप्त हिन्दी अभिव्यक्ति स्वाभाविक रहते हुए संबंध को स्पष्ट करती है।
- source_word: ዘሀሎ ማእከሎሙ
  choice: '[जो उनके बीच में था]'
  rationale: स्रोत साक्ष्य में यह उपवाक्य कोष्ठकित और अनिश्चित है, इसलिए उसे मुख्य पाठ में वर्ग कोष्ठकों सहित रखा गया है।
- source_word: እስመ ኢንክል
  choice: हम ... समर्थ नहीं हैं
  rationale: क्रियारूप प्रथम पुरुष बहुवचन का अर्थ देता है; अतः इसे मेढ़े के विषय में “वह समर्थ नहीं था” न बनाकर समूह की सीधी वाणी के रूप में प्रस्तुत किया गया है।
- source_word: ቀዊመ ቅድመ እግዚእነ
  choice: अपने प्रभु के सामने खड़े होकर
  rationale: “हमारे प्रभु” का संबंधवाचक भाव रखा गया है; हिन्दी में वक्ताओं की सीधी वाणी के भीतर “अपने प्रभु” स्वाभाविक और अर्थतः समतुल्य है।
- source_word: ወአነጽሮቶ
  choice: उनकी ओर देखने में
  rationale: क्रिया देखने या ध्यान से निहारने का बोध देती है। “उनकी ओर देखने” में दिव्य उपस्थिति की असहनीयता बनी रहती है, जबकि भाषा आधुनिक और सहज है।
theological_decisions:
- issue: “हमारे प्रभु” का अभिप्राय
  choice: अपने प्रभु
  alternative: परमेश्वर; भेड़ों का प्रभु; स्वर्गीय शासक
  rationale: गीज़ पाठ की उपाधि और संबंधवाचकता को बनाए रखा गया है, पर प्रतीकात्मक पात्र की पहचान को किसी अधिक विशिष्ट धर्मवैज्ञानिक पद से निश्चित नहीं किया गया।
- issue: अंतिम कथन का कर्ता
  choice: 'समूह की सीधी वाणी: “हम ... समर्थ नहीं हैं”'
  alternative: 'मेढ़े के बारे में कथन: “वह ... समर्थ नहीं था”'
  rationale: ኢንክል का प्रथम-पुरुष बहुवचन रूप समूह की वाणी का समर्थन करता है। इससे पशु-प्रतीक को किसी एक मानवीय पात्र के रूप में अनावश्यक रूप से नहीं खोला जाता।
- issue: दिव्य पात्र के लिए हिन्दी सर्वनाम
  choice: 'आदरार्थक बहुवचन: “उनकी”'
  alternative: 'एकवचन: “उसकी”'
  rationale: हिन्दी में “प्रभु” के संदर्भ में आदरार्थक रूप स्वाभाविक है; यह संख्या के बारे में कोई धर्मवैज्ञानिक दावा नहीं करता।
