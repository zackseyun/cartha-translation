base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/045.yaml
  text: And the Lord of the sheep sent a sheep to another sheep[a], and raised him up so that he might become a ram and might lead the sheep in place of that ram[c][b], which had abandoned his glory.
translation:
  language: hi
  text: और भेड़ों के प्रभु ने एक भेड़ को दूसरी भेड़ के पास भेजा और उसे ऊपर उठाया, ताकि वह एक मेढ़ा बने और उस मेढ़े के स्थान पर भेड़ों की अगुवाई करे, जिसने अपनी महिमा त्याग दी थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अपनी महिमा’ का अनुवाद ‘अपना सम्मान’ या ‘अपना वैभव’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እግዚኦሙ ለአባግዕ
  choice: भेड़ों के प्रभु
  rationale: संबंधवाचक अभिव्यक्ति और दर्शन के ऊँचे धार्मिक स्वर को बनाए रखता है।
- source_word: በግዕ ... ካልእ በግዕ
  choice: एक भेड़ ... दूसरी भेड़
  rationale: በግዕ का सामान्य अर्थ ‘भेड़’ है; इससे पूर्ववर्ती कथा की निरंतरता बनी रहती है और ‘मेमना’ कहकर आयु का अनावश्यक अर्थ नहीं जोड़ा जाता।
- source_word: አንሥአ
  choice: उसे ऊपर उठाया
  rationale: मूल क्रिया में उठाने और पदोन्नत करने दोनों की संभावना है; शाब्दिक बिंब को रखते हुए प्रतीकात्मक उन्नयन खुला छोड़ा गया है।
- source_word: ከመ ይኩን ሐርጌ
  choice: ताकि वह एक मेढ़ा बने
  rationale: भेड़ से मेढ़ा बनने की प्रतीकात्मक स्थिति-परिवर्तन को स्पष्ट रखता है।
- source_word: ይመርሖሙ ለአባግዕ
  choice: भेड़ों की अगुवाई करे
  rationale: नेतृत्व और मार्गदर्शन का अर्थ स्वाभाविक हिन्दी में व्यक्त होता है, बिना प्रतीक को सामान्य गद्य में बदलने के।
- source_word: ህየንተ ዝኩ ሐርጌ
  choice: उस मेढ़े के स्थान पर
  rationale: उत्तराधिकार अथवा प्रतिस्थापन का भाव सुरक्षित रहता है।
- source_word: ዘሐደገ ስብሐቲሁ
  choice: जिसने अपनी महिमा त्याग दी थी
  rationale: ስብሐት का महिमा-संबंधी गहन अर्थ बनाए रखा गया है; ‘त्याग दी’ मूल क्रिया के छोड़ने के भाव को व्यक्त करता है।
theological_decisions:
- issue: पदोन्नत पशु-आकृति की पहचान और भूमिका
  choice: ‘भेड़’ के ‘मेढ़ा’ बनने का ठोस पशु-बिंब बनाए रखा गया।
  alternative: इसे ‘मेमना’ या सीधे ‘अगुवा’ कहना।
  rationale: पशु-दर्शन की प्रतीक-व्यवस्था अनुवाद में बनी रहनी चाहिए। मूल शब्द आयु को स्पष्ट नहीं करता, इसलिए ‘मेमना’ से बचा गया है।
- issue: अंतिम पदबंध में ‘महिमा’ का आशय
  choice: मुख्य पाठ में ‘अपनी महिमा’ रखा गया।
  alternative: ‘अपना सम्मान’ या ‘अपना वैभव’।
  rationale: मूल पद सामाजिक प्रतिष्ठा, गरिमा या दीप्त वैभव का संकेत दे सकता है; ‘महिमा’ इस व्यापकता को सबसे अच्छी तरह सुरक्षित रखता है और विकल्प पादटिप्पणी में दिए गए हैं।
