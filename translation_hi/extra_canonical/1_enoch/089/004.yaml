base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/004.yaml
  text: And water[a], and darkness, and mist increased upon it; and I looked at the height of that water, and that water rose above that enclosure[d][c][b], and it poured over the enclosure and stood upon the earth.
translation:
  language: hi
  text: और उस पर पानी, अन्धकार और धुंध बढ़ते गए; और मैंने उस पानी की ऊँचाई देखी। वह पानी उस बाड़े[a] से ऊपर उठ गया, बाड़े के ऊपर उमड़ पड़ा और धरती पर ठहर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बाड़ा’ के लिए आया शब्द किसी घेरे, घिरे हुए आँगन या पशुओं के बाड़े को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: 'ወበዝን (पाठ-संशोधन: ወበዝኀ)'
  choice: बढ़ते गए
  rationale: प्राप्त पाठ में सम्भावित OCR त्रुटि है; በዝኀ का अर्थ ‘बढ़ना/बहुत होना’ है। संयुक्त कर्ताओं पानी, अन्धकार और धुंध के क्रमिक प्रबल होने को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ማይ
  choice: पानी
  rationale: मूल में एकवचन संज्ञा बार-बार आती है। ‘पानी’ हिन्दी में द्रव्यवाचक रूप से स्वाभाविक है और ‘बाढ़’ जोड़कर अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ጽልመት
  choice: अन्धकार
  rationale: यह सीधा समतुल्य है और दर्शन के भयावह वातावरण को बनाए रखता है।
- source_word: ጊሜ
  choice: धुंध
  rationale: पानी और अन्धकार के साथ यह वाष्पमय अस्पष्टता का बोध देता है; ‘कोहरा’ भी सम्भव है, पर ‘धुंध’ अधिक व्यापक और संयत है।
- source_word: ወአሬኢ
  choice: और मैंने ... देखी
  rationale: प्रथम पुरुष दर्शन-वर्णन और आगे आने वाले कर्म ‘पानी की ऊँचाई’ को सहज हिन्दी में रखता है।
- source_word: መልዕልተ
  choice: ऊँचाई / ऊपर
  rationale: शब्द की ऊर्ध्वता संबंधी छवि को पहले संज्ञा और फिर संबंधसूचक प्रयोग में सुरक्षित रखा गया है।
- source_word: ተላዐለ
  choice: ऊपर उठ गया
  rationale: आरोहण या ऊँचा होने की क्रिया को स्पष्ट रखता है और जल-प्लावन की छवि स्वाभाविक रूप से उभरने देता है।
- source_word: ዐጸድ
  choice: बाड़ा
  rationale: यह घिरे हुए स्थान का सामान्य और दृश्यात्मक हिन्दी शब्द है। पशु-दर्शन के प्रसंग से मेल खाता है, पर ‘भेड़शाला’ कहकर प्रतीक को जरूरत से अधिक विशिष्ट नहीं बनाता।
- source_word: ይከዑ
  choice: ऊपर उमड़ पड़ा
  rationale: जल के बलपूर्वक बाड़े के ऊपर बह आने का भाव व्यक्त करता है; केवल ‘बहा’ की अपेक्षा प्लावन की तीव्रता बेहतर रखता है।
- source_word: ቆመ
  choice: ठहर गया
  rationale: पानी के विषय में शाब्दिक ‘खड़ा हो गया’ अस्वाभाविक होता; ‘ठहर गया’ उसके धरती पर टिके या बने रहने का अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: क्या मुख्य पाठ में जलप्रलय को स्पष्ट नाम दिया जाए
  choice: बार-बार ‘पानी’ ही रखा गया है।
  alternative: ‘बाढ़ का पानी’ या ‘जलप्रलय’
  rationale: प्रसंग जलप्रलय की ओर संकेत करता है, किन्तु गीइज़ पाठ बार-बार ማይ, अर्थात् ‘पानी’, कहता है। अनुवाद पाठक को प्रतीक पहचानने देता है, उसे मुख्य पाठ में आरोपित नहीं करता।
- issue: ዐጸድ को कितना विशिष्ट बनाया जाए
  choice: बाड़ा
  alternative: भेड़ों का बाड़ा / आँगन / घेरा
  rationale: ‘बाड़ा’ पशु-प्रतीकात्मक प्रसंग के अनुकूल है और घिरे स्थान की छवि देता है, पर मूल से अधिक विशिष्ट पशु या संस्थागत अर्थ नहीं जोड़ता।
- issue: प्राप्त रूप ወበዝን का पाठगत मूल्यांकन
  choice: सम्भावित मूल ወበዝኀ के अनुसार ‘बढ़ते गए’
  alternative: ‘उस पर आ गए’ जैसा अर्थ लेकर पाठ को यथावत समझना
  rationale: प्राप्त रूप को OCR-जनित दृश्य त्रुटि मानने का मजबूत भाषिक आधार है; በዝኀ ‘बढ़ना/बहुत होना’ देता है और वाक्य में पानी, अन्धकार तथा धुंध के साथ सार्थक बैठता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सरल दर्शन-वर्णन। ‘उमड़ पड़ा’ जल की गति को सजीव बनाता है; ‘ठहर गया’ मूल की सामी शैली वाले ‘खड़ा रहा’ को स्वाभाविक हिन्दी में व्यक्त करता है। मुख्य पाठ में एकमात्र [a] चिह्न संबंधित शब्द के तुरंत बाद दिया गया है।
