base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/014.yaml
  text: And the Lord brought the twelve sheep so that they might dwell with it and graze with it among the wolves[c][b][a]; and they multiplied and became many flocks of sheep.
translation:
  language: hi
  text: और प्रभु उन बारह भेड़ों को ले आया, ताकि वे उसके साथ रहें और भेड़ियों के बीच उसके साथ चरें[a]; वे बढ़ती गईं और भेड़ों के बहुत-से झुंड बन गईं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल पाठ में दोनों बार ‘उसके साथ’ एकवचन रूप में है। इसका संकेत संभवतः पिछले पद में बताई गई एक भेड़ की ओर है, पर इसे प्रभु की ओर संकेत करने वाला भी समझा जा सकता है। पद के इस मध्य भाग का पाठ कुछ कठिन है।
    reason: textual_variant
  - marker: b
    text: अंतिम वाक्यांश का पाठ अनिश्चित है; उसका आशय बारह भेड़ों के बढ़कर भेड़ों के अनेक समूह या झुंड बन जाने से प्रतीत होता है।
    reason: alternative_reading
lexical_decisions:
- source_word: እግዚአ
  choice: प्रभु
  rationale: यह दर्शन के सर्वोच्च स्वामी के लिए प्रयुक्त पद है। ‘प्रभु’ उसके अधिकार और पाठ की गरिमा दोनों को बनाए रखता है, बिना रूपक को व्याख्यात्मक रूप से ‘परमेश्वर’ में बदलने के।
- source_word: አምጽኦሙ
  choice: ले आया
  rationale: क्रिया किसी को अपने क्षेत्र या उपस्थिति में लाने की सक्रियता व्यक्त करती है; आधुनिक हिन्दी में ‘ले आया’ स्वाभाविक है।
- source_word: ፲ወ፪ አባግዕ
  choice: उन बारह भेड़ों को
  rationale: संख्या स्पष्ट है और ‘भेड़ें’ पशु-दर्शन की प्रतीकात्मक छवि को बिना लिंग का अनावश्यक निर्धारण किए सुरक्षित रखता है।
- source_word: ከመ ይኅደሩ ምስሌሁ
  choice: ताकि वे उसके साथ रहें
  rationale: ከመ उद्देश्य का भाव देता है और ይኅደሩ रहने या बसे रहने को व्यक्त करता है। हिन्दी का ‘उसके’ मूल के एकवचन पुल्लिंग प्रत्यय का संदर्भ खुला रखता है।
- source_word: ይትረዐዩ ምስሌሁ
  choice: उसके साथ चरें
  rationale: क्रिया भेड़ों के खाने या चरने की पशुपालकीय छवि से जुड़ी है; ‘चरें’ हिन्दी में सीधा और स्वाभाविक समतुल्य है।
- source_word: ማእከለ አዝእብት
  choice: भेड़ियों के बीच
  rationale: स्थान और संकट दोनों का भाव संक्षेप में सुरक्षित रहता है।
- source_word: በዝኁ
  choice: वे बढ़ती गईं
  rationale: यह संख्या में वृद्धि को व्यक्त करता है। ‘बढ़ती गईं’ हिन्दी में सहज है और क्रमिक बहुलता का भाव देता है।
- source_word: ኮኑ መራዕየ ብዙኃተ ዘአባግዕ
  choice: भेड़ों के बहुत-से झुंड बन गईं
  rationale: पाठ का अंतिम भाग कठिन है, पर सामूहिक पशुपालकीय शब्दावली अनेक भेड़-समूहों या झुंडों की ओर संकेत करती है। यह अनुवाद उस छवि को बनाए रखता है।
theological_decisions:
- issue: पशु-दर्शन में እግዚአ की पहचान
  choice: प्रभु
  alternative: भेड़ों का स्वामी; परमेश्वर
  rationale: ‘प्रभु’ दैवी अधिकार को व्यक्त करता है, फिर भी दर्शन की प्रतीकात्मक परोक्षता को समाप्त नहीं करता।
- issue: ‘उसके साथ’ के एकवचन प्रत्यय का संदर्भ
  choice: हिन्दी में अस्पष्ट ‘उसके’ बनाए रखा गया
  alternative: उस भेड़ के साथ; प्रभु के साथ
  rationale: संदर्भ इसे पिछले पद की एक भेड़ से जोड़ सकता है, जबकि व्याकरणिक रूप अपने आप में पुरुषवाचक एकवचन है। मुख्य पाठ में किसी एक पहचान को अनिवार्य बनाना मूल की संभावित अस्पष्टता को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। पशु-दर्शन की ‘भेड़’, ‘चरना’, ‘भेड़िए’ और ‘झुंड’ वाली छवि को व्याख्यात्मक ऐतिहासिक नामों से नहीं बदला गया। सर्वनाम की वास्तविक संदर्भगत अस्पष्टता मुख्य पाठ और पादटिप्पणी दोनों में सुरक्षित रखी गई है।
