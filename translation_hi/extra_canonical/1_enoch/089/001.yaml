base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/001.yaml
  text: And one of those four went to that white bull and taught him a mystery[a], while he was not trembling; and that bull was born and became a man, and built for himself a great vessel and dwelt upon it. And three bulls were with him on that vessel[c][b], and they were covered over above them.
translation:
  language: hi
  text: और उन चार में से एक उस सफेद बैल के पास गया और उसे एक रहस्य की शिक्षा दी[a], जबकि वह काँप नहीं रहा था। फिर उस बैल का जन्म हुआ और वह मनुष्य बन गया। उसने अपने लिए एक बड़ा जलयान[b] बनाया और उस पर रहने लगा। उस जलयान पर उसके साथ तीन बैल भी थे[c], और वे ऊपर से ढक दिए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध गिअज़ पाठ में नकारात्मक अव्यय है, इसलिए अनुवाद ‘काँप नहीं रहा था’ है। पाठ के कठिन संप्रेषण या प्रतिलिप्यांकन के कारण कुछ पूर्व प्रस्तुतियों में ‘काँप रहा था’ भी मिलता है।
    reason: textual_variant
  - marker: b
    text: यह बड़ा जलयान सम्भवतः बाढ़ के जहाज़ की ओर संकेत करता है; फिर भी दर्शन स्वयं उसे अपनी प्रतीकात्मक भाषा में ही प्रस्तुत करता है।
    reason: cross_reference
  - marker: c
    text: मूल में गोवंशीय पशुओं का शब्द है। यहाँ पात्रों की पुरुष-सांकेतिक भूमिका के अनुसार इसका अनुवाद ‘बैल’ किया गया है; शाब्दिक रूप से अधिक सामान्य ‘गोवंशीय पशु’ भी सम्भव है।
    reason: translation_clarity
lexical_decisions:
- source_word: ላህም ጸዓዳ
  choice: सफेद बैल
  rationale: मूल शब्द गोवंशीय पशु को सूचित करता है। दर्शन में पुरुष पात्र के प्रतीक और आगे आए तीन नर गोवंशीय पशुओं के साथ संगति बनाए रखने के लिए ‘बैल’ चुना गया है।
- source_word: መሀሮ ምሥጢረ
  choice: उसे एक रहस्य सिखाया
  rationale: यह पदबंध शिक्षण और छिपे ज्ञान, दोनों भावों को समेटता है; ‘रहस्य सिखाया’ आधुनिक हिन्दी में स्वाभाविक रहते हुए दोनों को बनाए रखता है।
- source_word: እንዘ ኢይርዕድ
  choice: जबकि वह काँप नहीं रहा था
  rationale: उपलब्ध गीइज़ पाठ में नकारात्मक अव्यय ኢ उपस्थित है, इसलिए सकारात्मक ‘काँप रहा था’ के बजाय नकारात्मक अर्थ रखा गया है।
- source_word: ተወልደ ወኮነ ሰብአ
  choice: उस बैल का जन्म हुआ और वह मनुष्य बन गया
  rationale: दर्शन में पशु से मनुष्य बनने का असामान्य रूपांतरण स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: መስቀረ ዐቢየ
  choice: एक बड़ा जलयान
  rationale: संदर्भ बाढ़ में प्रयुक्त नौका-जैसे साधन का है। ‘जलयान’ उसके स्वरूप को व्यक्त करता है, पर अनुवाद में सीधे ‘नूह का जहाज़’ कहकर प्रतीक की व्याख्या नहीं कर देता।
- source_word: ነበረ ዲቤሃ
  choice: उस पर रहने लगा
  rationale: पूर्वसर्ग का ‘ऊपर/पर’ वाला स्थानिक अर्थ सुरक्षित रखा गया है।
- source_word: ፫አላህምት
  choice: तीन बैल
  rationale: गोवंशीय प्रतीक और पुरुष पात्रों की सांकेतिक पहचान बनाए रखने के लिए सामान्य स्त्रीलिंग ‘गायें’ के बजाय ‘बैल’ प्रयुक्त हुआ है।
- source_word: ተከድኑ ላዕሌሆሙ
  choice: वे ऊपर से ढक दिए गए
  rationale: मूल की कर्मवाच्य रचना और ऊपर मौजूद आवरण का भाव बनाए रखा गया है, बिना यह निश्चित किए कि आवरण वास्तव में क्या था।
theological_decisions:
- issue: क्या रूपांतरित बैल को अनुवाद में सीधे नूह कहा जाए
  choice: पशु से मनुष्य बनने और जलयान की प्रतीकात्मक भाषा को यथावत रखना
  alternative: नाम लेकर कहना कि नूह ने जहाज़ बनाया
  rationale: प्रसंग उत्पत्ति की बाढ़-कथा की ओर संकेत करता है, पर स्वयं पाठ स्वप्न-दर्शन की पशु-प्रतीकात्मक भाषा में बात करता है; प्रत्यक्ष पहचान जोड़ना अनुवाद से अधिक व्याख्या होगी।
- issue: क्या መስቀረ को धार्मिक रूप से परिचित ‘जहाज़/सन्दूक’ से स्पष्ट किया जाए
  choice: जलयान
  alternative: नूह का जहाज़ अथवा सन्दूक
  rationale: चुना गया शब्द बाढ़ की नौका का संकेत देता है, फिर भी मूल से अधिक विशिष्ट धर्मशास्त्रीय पहचान आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध और किंचित दर्शनात्मक शैली रखी गई है। असामान्य रूपांतरण और अंतिम आवरण-वाक्य को सहज बनाने के नाम पर व्याख्यात्मक रूप से नहीं बदला गया।
