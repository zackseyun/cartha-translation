base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/058.yaml
  text: And he kept still as he watched[a], and he rejoiced because they were devoured and swallowed up and carried off[c][b]; and he abandoned them into the hand of all the beasts for food.
translation:
  language: hi
  text: और वह देखते हुए चुप रहा, और वह इस कारण आनन्दित हुआ कि वे खा डाले गए, निगल लिए गए और छीनकर ले जाए गए; और उसने उन्हें भोजन के लिए सब पशुओं के हाथ में[a] छोड़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हाथ में’ का अर्थ यहाँ ‘अधिकार या वश में’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: አርመመ
  choice: चुप रहा
  rationale: क्रिया मौन या निश्चल रहने का भाव देती है; प्रसंग में ‘चुप रहा’ सहज और कथात्मक है।
- source_word: እንዘ ይሬኢ
  choice: देखते हुए
  rationale: यह समकालिक क्रिया को व्यक्त करता है और दर्शन-वर्णन में स्वाभाविक है।
- source_word: ተፈሥሐ
  choice: आनन्दित हुआ
  rationale: मूल में प्रसन्न होने का स्पष्ट भाव है; यह गरिमापूर्ण आधुनिक हिन्दी है।
- source_word: ተበልዑ
  choice: फाड़कर खा लिए गए
  rationale: सिर्फ ‘खा लिए गए’ की अपेक्षा यह हिंसक पशुओं द्वारा भक्षण की छवि को अधिक स्पष्ट रखता है।
- source_word: ተውሕጡ
  choice: निगल लिए गए
  rationale: यह पहले भक्षण के बाद आने वाली तीव्र, संचयी विनाश-छवि को बनाए रखता है।
- source_word: ተሀይዱ
  choice: उठा ले जाए गए
  rationale: क्रिया के बलपूर्वक छीनकर या पकड़कर ले जाने के अर्थ को सामान्य ‘नष्ट किए गए’ में समतल नहीं किया गया।
- source_word: ኃደጎሙ
  choice: उसने उन्हें ... छोड़ दिया
  rationale: यह उन्हें असुरक्षित दशा में त्याग देने की कठोरता व्यक्त करता है, बिना किसी बाद की विशिष्ट धर्मवैज्ञानिक शब्दावली को आरोपित किए।
- source_word: ውስተ እዴ
  choice: हाथ में
  rationale: मूल के सामी मुहावरे को रखा गया है; यहाँ ‘हाथ’ अधिकार या वश को दर्शाता है।
- source_word: ኵሎሙ አራዊት
  choice: सब हिंसक पशुओं
  rationale: पशु-दृष्टान्त के शिकारी संदर्भ में ‘हिंसक पशु’ आधुनिक पाठक के लिए अर्थ स्पष्ट करता है।
- source_word: ለመብልዕ
  choice: भोजन बनने के लिए
  rationale: उद्देश्य अथवा परिणाम को संक्षेप में व्यक्त करते हुए भक्षण की पशु-छवि बनाए रखता है।
theological_decisions:
- issue: त्याग को सक्रिय न्यायिक सुपुर्दगी माना जाए या पीछे हटकर छोड़ देना
  choice: उसने उन्हें ... हाथ में छोड़ दिया
  alternative: उसने उन्हें सब हिंसक पशुओं के हवाले कर दिया
  rationale: मूल उन्हें विनाश के सामने छोड़ देने की कठोर क्रिया का समर्थन करता है, पर ‘हवाले कर दिया’ से अधिक सक्रिय न्यायिक अर्थ निश्चित हो सकता है; ‘छोड़ दिया’ तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली। मूल की तीन क्रमिक निष्क्रिय क्रियाएँ अलग-अलग रखी गई हैं, ताकि भक्षण, निगले जाने और उठा ले जाए जाने की संचयी छवि बनी रहे।
