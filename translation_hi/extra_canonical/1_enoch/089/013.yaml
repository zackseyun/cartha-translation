base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/013.yaml
  text: And when those twelve sheep had grown, they handed over one of them to the donkeys, and those donkeys in turn handed over that sheep to the wolves, and that sheep grew up in the midst of the wolves.
translation:
  language: hi
  text: और जब वे बारह भेड़ें बड़ी हो गईं, तब उन्होंने उनमें से एक को गधों के हवाले कर दिया। फिर उन गधों ने उस भेड़ को भेड़ियों के हवाले कर दिया, और वह भेड़ भेड़ियों के बीच बड़ी हुई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልህቁ
  choice: बड़ी हो गईं / बड़ी हुई
  rationale: यह क्रिया बढ़ने या बड़ा होने का भाव देती है; भेड़ों के रूपक में स्वाभाविक हिन्दी के लिए यही प्रयोग रखा गया।
- source_word: መጦውዎ
  choice: के हवाले कर दिया
  rationale: क्रिया किसी को दूसरे पक्ष को सौंपने का अर्थ देती है; पुनरावृत्ति को दोनों स्थानों पर स्पष्ट रखा गया।
- source_word: አእዱግ
  choice: गधे
  rationale: स्रोत का सामान्य बहुवचन अर्थ सीधे व्यक्त किया गया।
- source_word: አዝእብት
  choice: भेड़िये
  rationale: स्रोत के बहुवचन पशु-संज्ञा का सीधा और रूपक-संगत अनुवाद।
- source_word: ማእከለ
  choice: के बीच
  rationale: ‘मध्य में/बीच’ का अर्थ सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पशु-दृष्टान्त की ऐतिहासिक पहचान
  choice: पाठ में केवल पशु-रूपक को अनूदित किया गया
  alternative: गधों, भेड़ियों और भेड़ की ऐतिहासिक पहचानों को मुख्य पाठ में स्पष्ट करना
  rationale: स्रोत स्वयं इन पहचानों को इस पद में नहीं खोलता; उन्हें जोड़ना व्याख्यात्मक और संभवतः संप्रदायगत होगा।
- issue: क्रमसूचक ካዕበ का अर्थ
  choice: फिर
  alternative: बदले में / फिर से
  rationale: यहाँ घटनाओं की अगली कड़ी स्पष्ट करना सबसे स्वाभाविक है; ‘फिर से’ गलत ढंग से उसी क्रिया की पुनरावृत्ति उसी कर्ता द्वारा होने का संकेत दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और कथात्मक है। स्रोत की पुनरुक्ति तथा पशु-रूपक बनाए रखे गए हैं। पद में कोई पादटिप्पणी आवश्यक नहीं समझी गई।
