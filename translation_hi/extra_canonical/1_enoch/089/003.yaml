  yaml_path: translation/extra_canonical/1_enoch/089/003.yaml
  text: And again I saw[a], and behold, springs were opened upon the earth in that great enclosure, and that water was bubbling up and rising over the earth, and that enclosure appeared[e][d][c][b], until all its land was covered with water.
translation:
  language: hi
  text: फिर मैंने देखा, और देखो, धरती पर, उस बड़े घेरे में सोते खुल गए[a]। जब वह पानी उमड़ रहा और धरती पर चढ़ रहा था, तब वह घेरा दिखाई दे रहा था[b], जब तक कि उसकी सारी भूमि पानी से ढक न गई[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जलस्रोत’ अथवा ‘फव्वारे’।
    reason: lexical_alternative
  - marker: b
    text: ‘वह घेरा दिखाई दे रहा था’ वाला वाक्यांश पाठ और वाक्यरचना की दृष्टि से कठिन है। इसका अर्थ यह भी हो सकता है कि पानी चढ़ते समय घिरा हुआ भूभाग दिखाई दिया, या अधिक व्यापक रूप से यह दृश्य प्रकट हुआ।
    reason: alternative_reading
  - marker: c
    text: ‘उसकी सारी भूमि’ का अनुवाद ‘सारी धरती’ भी किया जा सकता है; यह इस पर निर्भर है कि सर्वनामिक रूप को किससे जोड़ा जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: አንቅዕታት
  choice: सोते
  rationale: यह बहुवचन धरती से निकलने वाले प्राकृतिक जलस्रोतों को सूचित करता है। ‘सोते’ आधुनिक हिन्दी में इस बाढ़-दृश्य के लिए स्वाभाविक है और कृत्रिम फव्वारों का अर्थ नहीं देता।
- source_word: ተርሕዉ
  choice: खोल दिए गए
  rationale: मूल का कर्मवाच्य रूप सुरक्षित रखा गया है और जलस्रोतों के खुलने की बाढ़-संबंधी छवि स्पष्ट रहती है।
- source_word: ዐጸድ ዐቢይ
  choice: बड़ा घेरा
  rationale: यह किसी सीमाबद्ध भूभाग का बोध कराता है। ‘घेरा’ खेत, आँगन या बगीचे जैसे अधिक विशिष्ट अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ይፈልሕ ... ይትነሣእ
  choice: फूटकर ... ऊपर उठ रहा था
  rationale: दोनों क्रियाओं से पानी के धरती से निकलने और फिर चढ़ने की संयुक्त गति व्यक्त होती है; इससे वास्तविक उबाल का भ्रामक अर्थ भी नहीं आता।
- source_word: ተአርአየ ለውእቱ ዐጸድ
  choice: वह घेरा दिखाई देता रहा
  rationale: कठिन वाक्यांश के दृश्यात्मक अर्थ को बनाए रखते हुए इसे पूर्ववर्ती कालवाचक उपवाक्य और अगले ‘जब तक’ खंड से स्वाभाविक रूप से जोड़ा गया है।
- source_word: ኵሉ ምድሩ
  choice: उसकी सारी भूमि
  rationale: सर्वनामिक रूप को निकटतम संदर्भ, अर्थात घेरे के भूभाग, से जोड़ा गया है; सार्वभौमिक ‘सारी धरती’ की संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: दर्शन में बाढ़ का भौगोलिक विस्तार
  choice: मुख्य पाठ में घेरे की ‘सारी भूमि’ के डूबने का वर्णन
  alternative: समूची धरती के जलमग्न होने का वर्णन
  rationale: गीज़ पाठ में ‘धरती/भूमि’ और घेरे की ओर संकेत करने वाले सर्वनामिक रूप के कारण स्थानीय तथा सार्वभौमिक, दोनों समझ संभव हैं। मुख्य पाठ निकटतम व्याकरणिक संदर्भ चुनता है, पर दूसरी संभावना को पादटिप्पणी में बनाए रखता है।
- issue: पानी चढ़ते समय घेरे के दिखाई देने का कठिन वाक्य-संबंध
  choice: घेरा तब तक दिखाई देता रहा, जब तक उसकी भूमि ढक नहीं गई
  alternative: घेरा उस दृश्य में प्रकट हुआ या दिखाया गया
  rationale: ወአንዘ कालवाचक ‘जब/जबकि’ संबंध बनाता है और अगला እስከ ‘जब तक’ दृश्य की अवधि सूचित करता है। फिर भी मूल वाक्यांश कठिन है, इसलिए वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और दर्शनात्मक वर्णन के अनुकूल। ‘देखो’ से मूल का प्रत्यक्षदर्शी विस्मय बना रहता है; ‘सोते’ और ‘घेरा’ सामान्य पाठकों के लिए समझने योग्य हैं, जबकि कठिन पाठगत संभावनाएँ पादटिप्पणियों में सुरक्षित रखी गई हैं।
