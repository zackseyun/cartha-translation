base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/072.yaml
  text: And again I saw the shepherds pasturing for twelve hours, and behold, three of those sheep returned, and they arrived and entered, and they began to build up all that had fallen down of that house.
translation:
  language: hi
  text: फिर मैंने देखा कि चरवाहे बारह घंटे तक भेड़ों को चरा रहे थे। और देखो, उन भेड़ों में से तीन लौट आए; वे पहुँचे और भीतर गए, और उस घर का जो कुछ गिर गया था, वह सब फिर से बनाने लगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእምኔሁ
  choice: फिर
  rationale: प्रसंग में यह दर्शन की अगली घटना का संकेत देता है; इसलिए स्वाभाविक हिन्दी में ‘फिर’ उपयुक्त है।
- source_word: ይርዐዩ፡ ኖሎት፡ ፲ወ፪ሰዓተ
  choice: चरवाहे बारह घंटे तक भेड़ों को चरा रहे थे
  rationale: क्रिया और कर्ता को स्वाभाविक हिन्दी क्रम में रखा गया है तथा बारह घंटे की स्पष्ट समयावधि सुरक्षित रखी गई है।
- source_word: ገብኡ፡ ወመጽኡ፡ ወቦኡ
  choice: लौट आए; वे वहाँ पहुँचे और भीतर गए
  rationale: तीनों क्रमिक क्रियाओं—लौटना, पहुँचना और प्रवेश करना—को अलग रखते हुए पुनरावृत्ति-सदृश मूल शैली को पठनीय हिन्दी में व्यक्त किया गया है।
- source_word: ቤት (अंग्रेज़ी परामर्श-पाठ में house)
  choice: भवन
  rationale: रूपकात्मक दृश्य में किसी सामान्य घर की अपेक्षा निर्मित सामुदायिक/पवित्र संरचना का व्यापक अर्थ बनाए रखता है, बिना उसकी पहचान को स्पष्ट किए।
theological_decisions:
- issue: ‘बारह घंटे’ का प्रतीकात्मक अर्थ
  choice: शाब्दिक रूप ‘बारह घंटे’ बनाए रखा
  alternative: बारह अवधियाँ या एक पूरा समय
  rationale: मूल की समय-संबंधी प्रतीकात्मक अस्पष्टता को व्याख्या द्वारा हल नहीं किया गया।
- issue: भवन की पहचान
  choice: केवल ‘उस भवन’
  alternative: मन्दिर या यरूशलेम
  rationale: पाठ के रूपक को किसी विशिष्ट ऐतिहासिक या धार्मिक पहचान से अनावश्यक रूप से नहीं बाँधा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘और देखो’ से दर्शनात्मक मूल की आकस्मिकता तथा बल सुरक्षित रखा गया है।
