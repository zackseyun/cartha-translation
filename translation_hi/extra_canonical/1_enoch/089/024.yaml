base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/024.yaml
  text: And that pool of water was split[a], and the water stood on this side and on that side before their faces; and their Lord, while he was leading them[e][d][c][b], stood between them and the wolves.
translation:
  language: hi
  text: और वह जल-कुंड फटकर दो भाग हो गया[a], और पानी उनके सामने इस ओर और उस ओर खड़ा रहा; और उनका स्वामी, उनकी अगुवाई करते हुए, उनके और भेड़ियों के बीच खड़ा रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘चीरकर अलग कर दिया गया।’ मूल क्रिया में फटने और विभाजित होने, दोनों का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ዐይገ፡ ማይ
  choice: जल-कुंड
  rationale: संदर्भ और नवीनतम पाठ-समीक्षा इसे सीमाबद्ध जलराशि या कुंड के रूप में पहचानते हैं। ‘जल-कुंड’ दृश्य की ठोस छवि और निकटवर्ती प्रसंग की पुनरावृत्ति बनाए रखता है।
- source_word: ተሠጠ
  choice: फटकर दो भाग हो गया
  rationale: क्रिया जलराशि के चिरने या विभाजित होने का बोध देती है। यह हिन्दी में स्वाभाविक रहते हुए दृश्य की तीव्रता बनाए रखता है।
- source_word: ቆመ፡ ማይ
  choice: पानी ... खड़ा रहा
  rationale: मूल की ‘खड़ा होना’ क्रिया को जानबूझकर रखा गया है; इससे पानी के अलौकिक रूप से थमे रहने का दृश्य उभरता है।
- source_word: እምዝየ፡ ወእምዝየ
  choice: इधर और उधर
  rationale: यह द्विपक्षीय स्थान-सूचक अभिव्यक्ति पानी के दोनों ओर खड़े रहने को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: በቅድመ፡ ገጾሙ
  choice: उनके सामने
  rationale: शाब्दिक अर्थ ‘उनके मुखों के सामने’ है; ‘उनके सामने’ आधुनिक हिन्दी में उसी स्थानिक अर्थ को स्पष्टतः देता है।
- source_word: እግዚኦሙ
  choice: उनका स्वामी
  rationale: यह पशु-दृष्टान्त के भीतर झुंड पर अधिकार रखने वाले अगुवे को सूचित कर सकता है। ‘स्वामी’ अधिकार-संबंध बनाए रखता है और इसे स्वतः परमेश्वर का स्पष्ट उपाधि-रूप नहीं बनाता।
- source_word: እንዘ፡ ይመራሖሙ
  choice: जब ... उनकी अगुवाई कर रहा था
  rationale: निर्माण समकालिक और जारी क्रिया बताता है; यह हिन्दी रूप उसी अवधि को सहजता से व्यक्त करता है।
- source_word: ወቆመ፡ ማእከሎሙ፡ ወማእከለ፡ አዝእብት
  choice: तब वह उनके और भेड़ियों के बीच खड़ा रहा
  rationale: दूसरे ‘खड़ा रहा’ का कर्ता ‘उनका स्वामी’ है। यह अनुवाद मूल वाक्य-विन्यास के अनुसार स्वामी को झुंड और भेड़ियों के बीच खड़ा दिखाता है।
theological_decisions:
- issue: ‘उनका स्वामी’ का संकेतार्थ
  choice: दृष्टान्त के कथात्मक स्तर पर झुंड का अगुवा, बिना प्रत्यक्ष ईश्वरीय उपाधि निश्चित किए
  alternative: सीधे प्रभु परमेश्वर का उल्लेख, अथवा मानवीय अगुवे और ईश्वरीय मार्गदर्शन का जानबूझकर रखा गया अतिव्यापन
  rationale: निकटवर्ती वाक्य-विन्यास ‘उनकी अगुवाई कर रहा था’ और ‘उनके तथा भेड़ियों के बीच खड़ा रहा’ को उसी कर्ता से जोड़ता है। छोटे अक्षर का भेद हिन्दी में उपलब्ध नहीं है, इसलिए ‘स्वामी’ कथात्मक अधिकार को रखता और संकेतार्थ को अनावश्यक रूप से तय नहीं करता।
- issue: दूसरे ቆመ का कर्ता
  choice: उनका स्वामी
  alternative: पानी
  rationale: ወእግዚኦሙ कर्ता के रूप में दूसरे ወቆመ से जुड़ता है; अतः अंतिम खंड में स्वामी झुंड और भेड़ियों के बीच खड़ा है, पानी नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण कथात्मक शैली। मूल की असामान्य दृश्यात्मक अभिव्यक्ति ‘पानी ... खड़ा रहा’ को सुरक्षित रखा गया है। ‘उनके मुखों के सामने’ की अत्यधिक शाब्दिकता के स्थान पर स्वाभाविक ‘उनके सामने’ चुना गया है।
