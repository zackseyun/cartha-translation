base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/056.yaml
  text: And I saw that he abandoned that house of theirs and their tower and all their beloved ones into the hand of the lions[a], so that they might tear them apart, and into the hands of all the wild beasts[c][b], so that they might devour them.
translation:
  language: hi
  text: और मैंने देखा कि उसने उनका वह घर और उनका बुर्ज छोड़ दिया, और उन सबको सिंहों के हाथ में दे दिया[a], ताकि वे उन्हें फाड़ डालें, और सभी जंगली पशुओं के हाथों में, ताकि वे उन्हें खा जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हाथ में दे दिया’ का अर्थ है किसी के वश या अधिकार में सौंप देना।
    reason: lexical_alternative
lexical_decisions:
- source_word: ሐደጎ
  choice: छोड़ दिया
  rationale: क्रिया का अर्थ छोड़ना या त्याग देना है। यहाँ न्याय-संबंधी प्रसंग में ‘छोड़ दिया’ स्वाभाविक हिन्दी है और परित्याग का भाव भी बनाए रखता है।
- source_word: ቤተ
  choice: घर
  rationale: मूल शब्द का सामान्य अर्थ ‘घर’ है। दर्शन के प्रतीक को मुख्य पाठ में ‘मन्दिर’ आदि कहकर व्याख्यायित नहीं किया गया।
- source_word: ማኅፈዶሙ
  choice: उनका बुर्ज
  rationale: यह घर से जुड़ी रक्षात्मक निर्मित संरचना को सूचित करता है। ‘बुर्ज’ स्थापत्य बिम्ब को बनाए रखता है; ‘बाड़ा’ भी सम्भव है।
- source_word: ወደዮሙ
  choice: उन सबको ... दे दिया
  rationale: ‘हाथ में’ के साथ यह किसी को दूसरे के अधिकार में सौंप देने का सामी मुहावरा है।
- source_word: ዲበ እደ / ውስተ እደዊሆሙ
  choice: हाथ में / हाथों में
  rationale: मूल का शाब्दिक और बाइबिलीय मुहावरा सुरक्षित है; अर्थ है किसी के वश या अधिकार में दे देना।
- source_word: አናብስት
  choice: सिंहों
  rationale: शब्द सामान्यतः सिंहों को दर्शाता है; दर्शन की पशु-प्रतीकात्मकता को ज्यों का त्यों रखा गया है।
- source_word: ይምሥጥዎሙ
  choice: उन्हें फाड़ डालें
  rationale: ‘खा जाएँ’ के समानान्तर यह हिंसक शिकारी क्रिया का बोध कराता है। ‘फाड़ डालें’ आधुनिक हिन्दी में स्पष्ट और सशक्त है।
- source_word: ይብልዕዎሙ
  choice: उन्हें खा जाएँ
  rationale: क्रिया का मूल अर्थ खाना या निगल जाना है। ‘खा जाएँ’ साधारण पाठक के लिए स्वाभाविक है और हिंसक प्रसंग में तीव्रता रखता है।
- source_word: አራዊት
  choice: जंगली पशुओं
  rationale: यह जंगली पशुओं को सूचित करता है और दर्शन की पालतू भेड़ों से उनका भेद बनाए रखता है।
theological_decisions:
- issue: ‘घर’ और ‘बुर्ज’ के प्रतीकात्मक अर्थ को मुख्य पाठ में खोलना
  choice: दर्शन के ठोस बिम्ब ‘घर’ और ‘बुर्ज’ को बनाए रखा गया।
  alternative: ‘मन्दिर’, ‘समुदाय’, ‘बाड़ा’ या ‘गढ़’ जैसे व्याख्यात्मक शब्द देना।
  rationale: सर्वनाश-दर्शन की प्रतीकात्मक अस्पष्टता को अनुवाद में सुलझाना उचित नहीं; सम्भावित संकेतार्थ टिप्पणी का विषय है।
- issue: ‘हाथ में’ मुहावरे को आधुनिक बनाना
  choice: मूल के ‘हाथ में/हाथों में’ मुहावरे को रखा गया और पादटिप्पणी में उसका आशय बताया गया।
  alternative: ‘सिंहों के वश में’ या ‘सिंहों को सौंप दिया’।
  rationale: यह रूप मूल की सामी-बाइबिलीय बनावट और न्यायात्मक बल को सुरक्षित रखता है, जबकि हिन्दी में भी समझा जा सकता है।
- issue: सिंहों और सब जंगली पशुओं से जुड़े उद्देश्य-वाक्यों का संबंध
  choice: 'प्रत्येक समूह को उसके निकटवर्ती उद्देश्य-वाक्य से जोड़ा गया: सिंह फाड़ते हैं और जंगली पशु खाते हैं।'
  alternative: मूल की उलझी/सम्भवतः कियाज़्मिक क्रम-रचना को ज्यों का त्यों रखते हुए दोनों क्रियाएँ दोनों समूहों से जोड़ना।
  rationale: गीज़ वाक्य-विन्यास में संबंध कुछ अस्पष्ट है। चुनी हुई रचना पठनीय है, पर पादटिप्पणी में वैकल्पिक संयुक्त संबंध सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और बाइबिलीय लय वाला रूप। ‘घर’, ‘बुर्ज’, ‘सिंह’ और ‘जंगली पशु’ जैसे दर्शनात्मक बिम्बों को बिना सांप्रदायिक व्याख्या के सुरक्षित रखा गया है।
