  yaml_path: translation/extra_canonical/1_enoch/089/028.yaml
  text: But the sheep passed from that water and went out into a wilderness where there was no water or grass[a]; and they began to open their eyes and to see. And I saw the Lord of the sheep shepherding them and giving them water and grass[d][c][b], and that sheep going and leading them.
translation:
  language: hi
  text: पर वे भेड़ें उस पानी से आगे निकल गईं और एक ऐसे निर्जन प्रदेश में पहुँचीं जहाँ न पानी था, न घास। तब वे अपनी आँखें खोलने और देखने लगीं[a]। फिर मैंने भेड़ों के प्रभु को उनकी चरवाही करते और उन्हें पानी और घास[b] देते देखा, और उस भेड़[c] को चलते हुए उनकी अगुवाई करते देखा[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह वाक्य दर्शन में जागृति या नई समझ का संकेत दे सकता है; अनुवाद ने आँखें खोलने और देखने का मूल पशु-बिंब बनाए रखा है।
    reason: lexical_alternative
  - marker: b
    text: ‘घास’ का अनुवाद ‘चारा’ या ‘चरागाह की वनस्पति’ भी किया जा सकता है। गीज़ शब्द झुंड के खाने योग्य हरियाली को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: 'मूल पाठ में यहाँ एकवचन है: ‘उस भेड़’। कुछ पुराने अनुवादों में इसे बहुवचन, ‘वे भेड़ें’, समझा गया है।'
    reason: textual_or_translation_history
  - marker: d
    text: गीज़ की रचना जारी गतिविधि दिखाती है और इसे ‘मैंने ... देखा’ से जोड़ती है; भाव है कि द्रष्टा ने उस भेड़ को चलते और अगुवाई करते देखा।
    reason: grammar
lexical_decisions:
- source_word: አባግዕሰ
  choice: वे भेड़ें
  rationale: समूह की ओर संकेत करने वाले भाव को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति चुनी गई है।
- source_word: ኃለፉ እምዝኩ ማይ
  choice: उस पानी से आगे निकल गईं
  rationale: वाक्यांश पहले के जल-स्थान से आगे बढ़ने को बताता है; यह अनुवाद किसी निश्चित प्रकार के पारगमन को अनावश्यक रूप से नहीं जोड़ता।
- source_word: ውስተ በድው
  choice: एक ऐसे निर्जन प्रदेश में
  rationale: यह ‘जंगल’, ‘मरुभूमि’ या ‘उजाड़’ जैसे संभावित अर्थों के बीच ऐसा व्यापक शब्द है जो पानी और चारे से रहित स्थान का भाव स्वाभाविक ढंग से देता है।
- source_word: ኀበ አልቦ ማየ ወሣዕረ
  choice: जहाँ न पानी था, न घास
  rationale: अभाव पर दिए गए बल और भेड़ों से संबंधित प्रत्यक्ष दृश्य—पानी तथा चारा—दोनों को स्पष्ट रखता है।
- source_word: አኃዙ ይክሥቱ አዕይንቲሆሙ ወይሬእዩ
  choice: वे अपनी आँखें खोलने और देखने लगीं
  rationale: मूल के दृश्यात्मक पशु-बिंब को बनाए रखा गया है; इसे केवल ‘समझने लगीं’ कहकर प्रतीकात्मक अर्थ में सीमित नहीं किया गया।
- source_word: እግዚኦሙ ለአባግዕ
  choice: भेड़ों के प्रभु
  rationale: पशु-दर्शन में प्रयुक्त विशिष्ट उपाधि का अनुवाद किया गया है, बिना उसे व्याख्यात्मक रूप से ‘परमेश्वर’ या ‘मालिक’ में बदलने के।
- source_word: ይርዕዮሙ
  choice: उनकी चरवाही करते
  rationale: क्रिया में देखभाल, मार्गदर्शन और चराने का सक्रिय चरवाहा-बिंब है; ‘चरवाही करना’ इस व्यापकता को बनाए रखता है।
- source_word: ይሁቦሙ ማየ ወሣዕረ
  choice: उन्हें पानी और घास देते
  rationale: यह निर्जन प्रदेश के अभाव को सीधे उलटता है और मूल की सरल क्रिया ‘देना’ को सुरक्षित रखता है।
- source_word: ዝኩ በግዕ
  choice: उस भेड़
  rationale: संज्ञा और संकेतवाचक दोनों एकवचन हैं; इसलिए किसी पहले से पहचानी गई विशिष्ट भेड़ की ओर संकेत रखा गया है।
- source_word: እንዘ የሐውር ወይመራሖሙ
  choice: चलते हुए उनकी अगुवाई करते
  rationale: परिस्थितिवाचक रचना और अपूर्ण क्रियारूप निरंतर चल रही गतिविधि दिखाते हैं; हिन्दी में ‘चलते हुए’ इस दृश्यगत प्रवाह को स्वाभाविक बनाता है।
theological_decisions:
- issue: ‘भेड़ों के प्रभु’ की पहचान
  choice: दर्शन की उपाधि ‘भेड़ों के प्रभु’ को ज्यों का त्यों बनाए रखना
  alternative: ‘परमेश्वर, इस्राएल का चरवाहा’ या ‘भेड़ों का मालिक’
  rationale: संदर्भ में यह दिव्य पात्र की ओर संकेत करता है, पर मूल दर्शन स्वयं पशु-रूपक में बोलता है। अनुवाद प्रतीक की व्याख्या करके उसकी जगह कोई धार्मिक विस्तार नहीं रखता।
- issue: भेड़ों का आँखें खोलना और देखना
  choice: शाब्दिक-दृश्यात्मक भाषा को बनाए रखना
  alternative: ‘वे जागरूक हुईं’ या ‘उन्हें समझ मिली’
  rationale: इसमें जागृति या नई समझ का प्रतीकात्मक अर्थ हो सकता है, किंतु मूल पाठ उसे आँखें खोलने और देखने के बिंब में प्रस्तुत करता है। अनुवाद दोनों स्तरों के बीच का तनाव सुरक्षित रखता है।
- issue: अंतिम भेड़ की गतिविधि का वाक्यगत संबंध
  choice: दोनों कर्मों को ‘मैंने ... देखा’ के अधीन रखना
  alternative: 'इसे स्वतंत्र कथन बनाना: ‘और वह भेड़ चलती और उनकी अगुवाई करती थी’'
  rationale: गीज़ की परिस्थितिवाचक रचना दर्शाती है कि द्रष्टा प्रभु के कार्यों के साथ उस भेड़ को चलते और अगुवाई करते भी देखता है। हिन्दी में ‘देखा’ की पुनरावृत्ति इस संबंध को स्पष्ट और स्वाभाविक रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। पशु-दर्शन की शब्दावली—भेड़ें, चरवाही, पानी, घास और अगुवाई—को स्पष्ट रखा गया है। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाया गया है, पर दर्शन की प्रतीकात्मक अस्पष्टता की व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
