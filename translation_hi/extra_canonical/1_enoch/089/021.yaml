base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/021.yaml
  text: And I saw the sheep until they came out from the wolves[a]; and the eyes of the wolves were blinded[b], and those wolves went out following the sheep with all their power.
translation:
  language: hi
  text: और मैंने उन भेड़ों को तब तक देखा, जब तक वे भेड़ियों के बीच से निकल न आईं; और भेड़ियों की आँखें अंधी हो गईं, और वे भेड़िये अपनी पूरी शक्ति से भेड़ों के पीछे-पीछे निकल पड़े।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወርኢክዎሙ
  choice: और मैंने उन...को देखा
  rationale: दर्शन-वर्णन के प्रथम-पुरुष सूत्र को स्वाभाविक हिन्दी में बनाए रखता है; कर्मसूचक रूप का संकेत ‘उन’ से मिलता है।
- source_word: ለአባግዕ
  choice: उन भेड़ों को / भेड़ों के
  rationale: पशु-दृष्टान्त की स्थापित प्रतीकात्मक छवि ‘भेड़ें’ को ज्यों का त्यों रखता है; आरम्भ में संकेतवाचक भाव भी सुरक्षित है।
- source_word: እስከ ወፁኡ እምአዝእብት
  choice: जब तक वे भेड़ियों के बीच से निकल न आईं
  rationale: እስከ के कालबोध और እም के अलग होने/बाहर आने के भाव को सहज हिन्दी में व्यक्त करता है; ‘के बीच से’ दृश्य को अस्पष्ट किए बिना स्वाभाविक है।
- source_word: ተጸለሉ አዕይንቲሆሙ
  choice: उनकी आँखें अंधी हो गईं
  rationale: त्-स्टेम के अकर्मक/भाववाच्य अर्थ को सुरक्षित रखता है और गलत सक्रिय अर्थ ‘उन्होंने आँखें अंधी कर दीं’ से बचता है। निकटतम पूर्वपद के अनुसार सर्वनाम भेड़ियों को सूचित करता है।
- source_word: ወወፁኡ እንዘ ይትልውዎሙ
  choice: पीछे-पीछे निकल पड़े
  rationale: अनुगमन और साथ-साथ घटित गति—दोनों को व्यक्त करता है। ‘पीछा करने लगे’ की अपेक्षा कम व्याख्यात्मक है, पर प्रसंग की गतिशीलता बनाए रखता है।
- source_word: ዝኩ አዝእብት
  choice: वे भेड़िये
  rationale: स्पष्ट विषय और संकेतवाचक बल दोनों को बनाए रखता है।
- source_word: በኵሉ ኃይሎሙ
  choice: अपनी पूरी शक्ति से
  rationale: समग्र बल के मुहावरे को वर्तमान, गरिमापूर्ण और स्पष्ट हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: आँखों के अंधे होने की छवि को शाब्दिक दर्शनात्मक रूप में रखना या उसे छल/भ्रम के अर्थ में समझाकर लिखना
  choice: आँखें अंधी हो गईं
  alternative: वे धोखे में पड़ गए / वे भटक गए
  rationale: मूल की ठोस प्रलयदर्शी छवि को सुरक्षित रखा गया है; उसे किसी एक आध्यात्मिक या राजनीतिक व्याख्या में सीमित नहीं किया गया।
- issue: भेड़ियों के अनुगमन को स्पष्टतः शत्रुतापूर्ण ‘पीछा’ कहना या मूल की अपेक्षाकृत खुली क्रिया रखना
  choice: भेड़ों के पीछे-पीछे निकल पड़े
  alternative: भेड़ों का पीछा करते हुए निकल पड़े
  rationale: मूल क्रिया के ‘अनुगमन’ अर्थ को प्राथमिकता दी गई है। प्रसंग में शत्रुता संभव है, पर अनुवाद उसे क्रिया में आवश्यकता से अधिक नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। पशु-दृष्टान्त की पुनरावृत्ति को सर्वनामों से अत्यधिक संक्षिप्त नहीं किया गया, ताकि कर्ता स्पष्ट रहें। कोई पादटिप्पणी आवश्यक नहीं समझी गई, क्योंकि मुख्य पाठ Ge'ez की संशोधित व्याकरणिक समझ को स्पष्ट रूप से व्यक्त करता है।
