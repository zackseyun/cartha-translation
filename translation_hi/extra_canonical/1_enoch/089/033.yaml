base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/033.yaml
  text: And the Lord of the sheep was exceedingly angry with them[a], and that sheep knew it, and came down from the summit of the rock, and came to the sheep[c][b], and found the greater part of them with their eyes blinded, and those who had gone astray.
translation:
  language: hi
  text: और भेड़ों का प्रभु उन पर अत्यन्त क्रोधित हुआ। उस भेड़ ने यह जान लिया और चट्टान की चोटी से उतरकर भेड़ों के पास आई। उसने पाया कि उनमें से अधिकांश की आँखों की रोशनी धुँधली कर दी गई थी[a] और वे भटक गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी आँखों को अँधेरा कर दिया गया था।” मूल शब्द दृष्टि के धुँधला या अँधेरा कर दिए जाने का भाव दे सकता है; यह आवश्यक नहीं कि पूर्ण अंधापन ही अभिप्रेत हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: እግዚኦሙ ለአባግዕ
  choice: भेड़ों का प्रभु
  rationale: रचना का अर्थ ‘भेड़ों का प्रभु/स्वामी’ है। ‘प्रभु’ इस दर्शन के ऊँचे धार्मिक स्वर को बनाए रखता है, पर किसी बाद की विशिष्ट धार्मिक पहचान को पाठ में नहीं जोड़ता।
- source_word: ተምዐዐ ዲቤሆሙ መዐተ ዐቢየ
  choice: उन पर अत्यन्त क्रोधित हुआ
  rationale: मूल में क्रोध की संज्ञा और क्रोधित होने की क्रिया मिलकर तीव्रता व्यक्त करती हैं। आधुनिक हिन्दी में ‘अत्यन्त क्रोधित’ उसी बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ወአእመረ ዝኩ በግዕ
  choice: उस भेड़ ने यह जान लिया
  rationale: ዝኩ በግዕ (‘वह/उस भेड़’) क्रिया का कर्ता है। यह पिछले प्रसंग में उसी भेड़ के न जानने के विपरीत अब उसके जान लेने को बताता है; इसलिए इसे प्रभु द्वारा भेड़ को पहचानने के अर्थ में नहीं लिया गया।
- source_word: ወወረደ እምነ ድማኅ ለኵኵሕ
  choice: चट्टान की चोटी से उतरकर
  rationale: ድማኅ को ‘चोटी/शिखर’ और ኵኵሕ को ‘चट्टान’ समझते हुए ऊँचे चट्टानी स्थान से उतरने का ठोस चित्र सुरक्षित रखा गया है। निकटतम कर्ता वही भेड़ है।
- source_word: ዘመብዝኅቶሙ
  choice: उनमें से अधिकांश
  rationale: यह पद बड़े भाग या बहुसंख्या को दर्शाता है। ‘अधिकांश’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: ዘጽሉለ አዕይንቲሆሙ
  choice: जिनकी आँखें धुँधली कर दी गई थीं
  rationale: मूल अभिव्यक्ति आँखों के अँधेरा या अस्पष्ट कर दिए जाने का भाव रखती है। ‘धुँधली कर दी गई थीं’ प्रभावित दृष्टि और कर्मवाच्य बल दोनों को बनाए रखती है, बिना इसे अनिवार्य रूप से पूर्ण अंधापन बताने के।
- source_word: እለ ስሕቱ
  choice: वे भटक गए थे
  rationale: यह भेड़ों के रास्ते से भटकने और नैतिक भूल—दोनों अर्थों को साथ बनाए रखता है।
theological_decisions:
- issue: እግዚኦሙ का धार्मिक पदनाम
  choice: प्रभु
  alternative: स्वामी या मालिक
  rationale: पशु-दर्शन में यह पात्र दैवी शासक और न्यायी के रूप में कार्य करता है। ‘प्रभु’ उस संकेत और गरिमामय शैली को सुरक्षित रखता है, लेकिन आगे की कोई विशिष्ट मसीही पहचान नहीं जोड़ता।
- issue: जानने और उतरने वाली सत्ता की पहचान
  choice: वही विशिष्ट भेड़ दोनों क्रियाओं की कर्ता है
  alternative: प्रभु ने उस भेड़ को पहचाना और फिर प्रभु या कोई अन्य पात्र उतरा
  rationale: गीज़ में ‘उस भेड़’ अचिह्नित कर्ता के रूप में आता है और निकटतम कर्ता ही अगली क्रिया में भी स्वाभाविक रूप से जारी रहता है। यह पिछले पद के ‘न जानने’ से भी अर्थपूर्ण विरोध बनाता है।
- issue: आँखों की दशा
  choice: आँखें धुँधली कर दी गई थीं
  alternative: आँखें अँधेरी कर दी गई थीं या वे दृष्टिहीन थे
  rationale: मूल में दृष्टि के अवरुद्ध या अँधेरा किए जाने का बिंब है। अनुवाद पूर्ण और स्थायी अंधेपन का दावा किए बिना उस निष्क्रिय/प्रभावित अवस्था को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर दर्शन-कथा की गरिमा बनाए रखने के लिए ‘प्रभु’ और ‘अत्यन्त’ जैसे शब्द रखे गए हैं। भेड़ को हिन्दी व्याकरण के अनुसार स्त्रीलिंग माना गया है। छोटे वाक्यों से घटनाक्रम स्पष्ट किया गया है और पशु-प्रतीक को ‘लोग’ जैसे व्याख्यात्मक शब्दों से नहीं बदला गया।
