translation:
  language: hi
  text: और वह भेड़ उस ऊँची चट्टान की चोटी पर चढ़ गई, और भेड़ों के प्रभु ने उसे उनके पास भेजा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በግዕ
  choice: भेड़
  rationale: गीज़ शब्द का सामान्य अर्थ ‘भेड़’ है; पशु-दृष्टांत की प्रतीकात्मक भाषा को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
- source_word: ዲበ፡ ድማኃ፡ ለዝኩ፡ ኰኵሕ፡ ነዋሕ
  choice: उस ऊँची चट्टान की चोटी पर
  rationale: स्थानवाचक पदबंध में चट्टान के ऊपरी भाग/शिखर का भाव है; स्वाभाविक हिंदी के लिए ‘चोटी’ और ነዋሕ के लिए ‘ऊँची’ चुना गया।
- source_word: እግዚኦሙ፡ ለአባግዕ
  choice: भेड़ों के प्रभु
  rationale: शाब्दिक संबंध ‘भेड़ों का प्रभु’ है; ‘प्रभु’ धार्मिक और दृष्टांतात्मक गरिमा को सुरक्षित रखता है।
- source_word: ፈነዎ፡ ኀቤሆሙ
  choice: उसे उनके पास भेजा
  rationale: क्रिया और दिशासूचक पदबंध का सीधा अर्थ है; सर्वनामों की मूल अस्पष्टता को नहीं खोला गया।
theological_decisions:
- issue: भेड़ और भेड़ों के प्रभु की प्रतीकात्मक पहचान
  choice: प्रतीकों को पाठ में ‘भेड़’ और ‘भेड़ों के प्रभु’ ही रखा गया
  alternative: उनकी पहचान मूसा, इस्राएल या परमेश्वर के रूप में स्पष्ट कर देना
  rationale: मूल दृष्टांत पहचान को प्रत्यक्ष रूप से नहीं बताता; अनुवाद में व्याख्या जोड़ना उचित नहीं।
- issue: ‘उसे’ और ‘उनके’ के संदर्भ
  choice: सर्वनाम यथावत रखे गए
  alternative: संदर्भित पात्रों के नाम जोड़ना
  rationale: मूल में सर्वनाम हैं; संदर्भ स्पष्ट करना व्याख्यात्मक निर्णय होता और वास्तविक पाठगत अस्पष्टता घटाता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और दृष्टांतात्मक शैली। वाक्य-संरचना मूल के दो समन्वित खंडों को बनाए रखती है।
