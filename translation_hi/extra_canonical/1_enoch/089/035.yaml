base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/035.yaml
  text: And that ram took other sheep with him[a], and came upon those sheep that had gone astray; and he began to kill them. And the sheep were afraid before him, and that ram made those sheep that had gone astray return[b], and they went back into their folds.
translation:
  language: hi
  text: और उस मेढ़े ने अन्य भेड़ों को अपने साथ लिया और उन भेड़ों के पास पहुँचा जो भटक गई थीं; तब वह उन्हें मारने लगा।[a] भेड़ें उसके सामने डर गईं, और उस मेढ़े ने उन भटकी हुई भेड़ों को लौटा दिया; और वे अपने बाड़ों में लौट गईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अधिक शाब्दिक अर्थ यह भी हो सकता है: “उसने उन्हें मारने के लिए पकड़ लिया।” गीइज़ की रचना हिंसक कार्रवाई के आरंभ पर बल देती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ
  choice: मेढ़ा
  rationale: पशु-दर्शन में अगुवाई करने वाले नर पशु और सामान्य भेड़ों के बीच कथात्मक भेद बनाए रखने के लिए।
- source_word: ነሥአ ምስሌሁ ባዕደ አባግዐ
  choice: दूसरी भेड़ों को अपने साथ लिया
  rationale: አባግዐ बहुवचन है; इसलिए पुराने एकवचन पाठ ‘एक और भेड़’ के बजाय बहुवचन रखा गया है।
- source_word: ቦአ ዲበ
  choice: के पास पहुँचा
  rationale: यह समूह की ओर बढ़ने का भाव देता है; हिंदी में यह स्वाभाविक है और अनावश्यक रूप से सैनिक आक्रमण का अर्थ नहीं जोड़ता।
- source_word: እለ ስሕቱ
  choice: जो भटक गई थीं
  rationale: भेड़ों के वास्तविक भटकने और नैतिक रूप से पथभ्रष्ट होने—दोनों संकेतों को बनाए रखता है।
- source_word: አኀዘ ይቅትሎሙ
  choice: वह उन्हें मारने लगा
  rationale: आरंभ होती हिंसक कार्रवाई को सहज हिंदी में व्यक्त करता है; वैकल्पिक अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ፈርሁ እምገጹ
  choice: उसके सामने डर गईं
  rationale: मूल के ‘उसके मुख/उपस्थिति के सामने’ वाले भाव को संक्षिप्त और गरिमापूर्ण हिंदी में रखता है।
- source_word: አግብኦሙ
  choice: लौटा दिया
  rationale: 'क्रिया के प्रेरणार्थक भाव को बनाए रखता है: मेढ़े ने उनके लौटने का कारण बनाया।'
- source_word: አዕጻዲሆሙ
  choice: अपने बाड़ों
  rationale: भेड़ों के दर्शन की चरवाही संबंधी छवि के अनुरूप आधुनिक और स्पष्ट हिंदी शब्द।
theological_decisions:
- issue: भटकी हुई भेड़ों के विरुद्ध मेढ़े की हिंसा
  choice: ‘मारने’ की स्पष्ट भाषा बनाए रखी गई।
  alternative: ‘दंड देने’ या ‘प्रहार करने’ जैसे नरम शब्द
  rationale: मूल गीइज़ में हत्या की स्पष्ट क्रिया है; उसे नरम करने से न्याय की सर्वनाश-दर्शी छवि की तीव्रता घट जाती।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘मेढ़ा’, ‘भेड़ें’ और ‘बाड़े’ पशु-दर्शन की प्रत्यक्ष छवि को बनाए रखते हैं; किसी ऐतिहासिक या सांप्रदायिक पहचान को मुख्य पाठ में नहीं जोड़ा गया।
