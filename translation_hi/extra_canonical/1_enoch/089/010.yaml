base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/010.yaml
  text: 'And they began to bring forth the beasts of the field and the birds[a]; and from among them there came forth every kind of the nations: lions, leopards, wolves, dogs, hyenas, wild boars, foxes, swine, falcons, vultures, kites, eagles, and ravens[c][b]; and in their midst a white bull was born.'
translation:
  language: hi
  text: और वे मैदान के पशुओं और पक्षियों को जन्म देने लगे; और उनमें से हर प्रकार के राष्ट्र[a] प्रकट हुए—सिंह, तेंदुए, भेड़िए, कुत्ते, लकड़बग्घे, जंगली वराह, लोमड़ियाँ, खरहे, सूअर, बाज़, गिद्ध, चीलें, उकाब और कौए[b]। और उनके बीच एक सफेद बैल उत्पन्न हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह वाक्यांश कठिन है। इसका अर्थ अधिक सामान्य रूप से “हर प्रकार” या “हर वर्ग” भी समझा जा सकता है, पर गीज़ पाठ में “राष्ट्र/लोग” शब्द स्पष्ट रूप से मौजूद है।
    reason: lexical_alternative
  - marker: b
    text: इस सूची के कई पशु-पक्षियों की ठीक प्रजाति निश्चित नहीं है। “लकड़बग्घों” या “लोमड़ियों” के स्थान पर सियार, “बाज़” के स्थान पर शाहीन अथवा कोई अन्य शिकारी पक्षी, और “कौओं” के स्थान पर काले कौए समझे जा सकते हैं।
    reason: lexical_alternative
lexical_decisions:
