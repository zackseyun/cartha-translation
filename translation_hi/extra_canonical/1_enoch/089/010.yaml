  choice: जन्म देने लगे
  rationale: आरम्भसूचक क्रिया और उत्पन्न करने के भाव—दोनों को संक्षिप्त, स्वाभाविक हिन्दी में रखता है; प्रतीकात्मक पशुओं के संदर्भ में अनावश्यक जैविक विशिष्टता नहीं जोड़ता।
- source_word: አራዊተ ገዳም
  choice: मैदान के पशु
  rationale: मूल पद के ‘मैदान/वनप्रदेश के पशु’ वाले बाइबिलीय भाव को बनाए रखता है; केवल ‘जंगली जानवर’ कहकर पद को सपाट नहीं करता।
- source_word: ዘእምኵሉ ኅብር አሕዛብ
  choice: हर प्रकार के राष्ट्र
  rationale: कठिन वाक्यांश में प्रकार/वर्ग और राष्ट्र/लोग—दोनों घटकों को बनाए रखा गया है। हिन्दी में इसे जानबूझकर पूरी तरह प्रतीक-व्याख्या में नहीं बदला गया।
- source_word: አጽባዕት
  choice: लकड़बग्घे
  rationale: यह सम्भावित पारम्परिक प्रजाति-पहचान है; सियार का विकल्प पादटिप्पणी में रखा गया है।
- source_word: ሐራዊ ገዳም
  choice: जंगली वराह
  rationale: साधारण सूअर से भेद रखते हुए जंगली सूअर/वराह का ठोस अर्थ व्यक्त करता है।
- source_word: ገሐያት
  choice: खरहे
  rationale: शब्द का अर्थ खरहा अथवा जंगली खरगोश है; संशोधित स्रोत-साक्ष्य के अनुसार ‘गिलहरी’ नहीं।
- source_word: ላህም ጸዓዳ
  choice: एक सफेद बैल
  rationale: रंग और पशु की पहचान को सीधे बनाए रखता है और प्रतीक का अर्थ अनुवाद में नहीं खोलता।
theological_decisions:
- issue: पशु-सूची का राष्ट्रों/लोगों से प्रतीकात्मक सम्बन्ध
  choice: ‘हर प्रकार के राष्ट्र’ कहकर राष्ट्रवाचक शब्द स्पष्ट रखा गया
  alternative: ‘हर प्रकार के पशु’ अथवा केवल ‘हर प्रकार’
  rationale: गीज़ पाठ में አሕዛብ (‘राष्ट्र/लोग’) उपस्थित है। इसलिए दर्शन को केवल प्राणिविज्ञान-सूची बनाना उसके सामूहिक और राजनीतिक संकेत को मिटा देता; फिर भी प्रतीकों की अलग-अलग ऐतिहासिक पहचान अनुवाद में आरोपित नहीं की गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर दर्शनात्मक और बाइबिलीय गरिमा बनाए रखने के लिए ‘मैदान के पशु’, ‘उत्पन्न हुआ’ और ‘उकाब’ जैसे पद चुने गए हैं। सूची को सहज हिन्दी बहुवचन में रखा गया है। ‘खरहे’ को मूल-साक्ष्य और नवीन पाठ-समीक्षा के आधार पर पुनर्स्थापित किया गया है; ‘गिलहरी’ नहीं अपनाया गया।
