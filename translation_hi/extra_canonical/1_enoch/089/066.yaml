base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/066.yaml
  text: And the lions and the leopards devoured and swallowed up most of those sheep[a], and the wild boars of the desert ate with them[c][b], and they burned that tower and tore down that house.
translation:
  language: hi
  text: और सिंहों और तेंदुओं ने उन भेड़ों में से अधिकतर को खा डाला और निगल लिया; और मरुभूमि के जंगली सूअरों ने उनके साथ खाया। फिर उन्होंने उस मीनार को जला दिया और उस घर[b] को ढा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: दर्शन में ‘घर’ संभवतः पवित्रस्थान या मंदिर का प्रतीक है; मुख्य पाठ में मूल वास्तु-छवि सुरक्षित रखी गई है।
    reason: cultural_note
lexical_decisions:
- source_word: በልዑ
  choice: फाड़ खाया
  rationale: हिंसक शिकारी प्रसंग में यह सामान्य ‘खाया’ से अधिक प्रबल है और भक्षण की छवि बनाए रखता है। दूसरे በልዑ के लिए वाक्यगत भेद के अनुसार साधारण ‘खाया’ रखा गया है।
- source_word: ውሕጡ
  choice: निगल लिया
  rationale: पूर्ववर्ती भक्षण-क्रिया के साथ मिलकर पूर्ण विनाश का तीव्र भाव व्यक्त करता है।
- source_word: መብዝሕቶሙ
  choice: उन भेड़ों में से अधिकतर को
  rationale: यह भेड़ों की बहुसंख्या अथवा बड़े भाग को सूचित करता है; हिंदी में यही अर्थ स्पष्ट और स्वाभाविक है।
- source_word: አባግዐ
  choice: भेड़ें
  rationale: दर्शन की ठोस पशु-प्रतीकात्मकता को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: አናብስት
  choice: सिंह
  rationale: मूल शब्द का सामान्य और विशिष्ट पशु-अर्थ यही है।
- source_word: አነምርት
  choice: तेंदुए
  rationale: गीज़ शब्द बड़े चित्तीदार बिल्लीवंशी पशु को दर्शाता है; ‘तेंदुए’ आधुनिक हिंदी में सबसे स्वाभाविक है, यद्यपि ‘पैंथर’ संभव विकल्प है।
- source_word: ሐራዊያ ገዳም
  choice: जंगल के जंगली सूअर
  rationale: यह वन्य सूअरों और निर्जन/असभ्य भूभाग दोनों की छवि रखता है; ‘जंगल’ हिंदी पाठक के लिए ‘मरुभूमि’ की अपेक्षा संदर्भानुकूल व्यापक शब्द है।
- source_word: ምስሌሆሙ
  choice: उनके साथ
  rationale: संबंध को व्यापक और अस्पष्ट ही रखता है तथा यह अनावश्यक रूप से निर्धारित नहीं करता कि सर्वनाम किन हिंसक पशुओं की ओर संकेत करता है।
- source_word: አውዐይዎ
  choice: जला दिया
  rationale: संरचना के विरुद्ध की गई अग्निजनित विनाशकारी क्रिया को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ማኅፈድ
  choice: मीनार
  rationale: दर्शन की वास्तु-छवि को बनाए रखता है और इसे किला या किसी विशिष्ट धार्मिक भवन के रूप में अधिक व्याख्यायित नहीं करता।
- source_word: ከረይዎ
  choice: ढा दिया
  rationale: विध्वंस और नीचे गिरा देने की ठोस क्रिया को संक्षिप्त, प्रचलित हिंदी में व्यक्त करता है।
- source_word: ቤት
  choice: घर
  rationale: मूल का आधारभूत अर्थ रखता है और प्रतीक को सीधे ‘मंदिर’ या ‘पवित्रस्थान’ बनाकर उसकी परतदारता समाप्त नहीं करता।
theological_decisions:
- issue: ቤት को ‘घर’ कहा जाए या प्रतीक का अर्थ खोलकर ‘मंदिर/पवित्रस्थान’
  choice: घर
  alternative: मंदिर; पवित्रस्थान
  rationale: दर्शन वास्तु-प्रतीकों के माध्यम से बोलता है। मुख्य पाठ में मूल छवि रखी गई है और संभावित धार्मिक संकेत को पादटिप्पणी में बताया गया है, जिससे प्रतीकात्मक तनाव बना रहता है।
translation_notes:
  register: 'आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली। दो अलग क्रियात्मक खंड स्पष्ट रखे गए हैं: सिंह और तेंदुए ‘फाड़ खाते और निगलते’ हैं, जबकि जंगली सूअर ‘उनके साथ खाते’ हैं। केवल प्रयुक्त पादटिप्पणी [b] का चिह्न मुख्य पाठ में रखा गया है।'
