  yaml_path: translation/extra_canonical/1_enoch/089/007.yaml
  text: And again I saw in the vision, until all the streams withdrew from that lofty roof, and the fissures of the earth were leveled, and other abysses were opened.
translation:
  language: hi
  text: और मैंने फिर दर्शन में देखा कि उस ऊँची छत पर से सारी धाराएँ हट गईं, धरती की दरारें समतल कर दी गईं, और दूसरी अथाह गहराइयाँ खोल दी गईं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዕራብት
  choice: धाराएँ
  rationale: इस प्रसंग में जलप्रलय के बहते जलमार्ग या धाराएँ अभिप्रेत हैं; उपलब्ध पाठ-साक्ष्य और परामर्श-पाठ के अनुरूप स्वाभाविक हिन्दी।
- source_word: ናሕስ፡ ልዑል
  choice: ऊँची छत
  rationale: दृश्य के रूपक को बनाए रखते हुए ‘lofty roof’ का सीधा और बोधगम्य अनुवाद।
- source_word: ዐረዩ
  choice: समतल कर दी गईं
  rationale: धरती की दरारों के सम हो जाने का भाव व्यक्त करता है और निष्क्रिय क्रिया-रूप को सुरक्षित रखता है।
- source_word: መዓምቃት
  choice: अथाह गहराइयाँ
  rationale: ‘abysses’ के लिए ऐसा शब्द-समूह जो गहरी, अधोलोक-सदृश खाइयों का दृश्यात्मक अर्थ बनाए रखे।
theological_decisions:
- issue: दर्शन में प्रलय के जल के हटने और पृथ्वी की संरचना बदलने का चित्रण
  choice: रूपकात्मक भू-दृश्य को बिना व्याख्यात्मक विस्तार के ज्यों का त्यों रखना
  alternative: इसे सीधे ‘बाढ़ का पानी उतर गया’ कहकर सरल बनाना
  rationale: मूल की ‘छत’, ‘दरारें’ और ‘अथाह गहराइयाँ’ जैसी रहस्यदर्शी छवियों तथा उनकी संभावित ब्रह्मांड-संबंधी अस्पष्टता को सुरक्षित रखना उचित है।
