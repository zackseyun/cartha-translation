base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/104/001.yaml
  text: I swear to you that in heaven the angels remember you for good before the glory of the Great One[a][b][c].
translation:
  language: hi
  text: मैं तुमसे शपथ खाकर कहता हूँ कि स्वर्ग में स्वर्गदूत तुम्हें भलाई के लिए उस महान की महिमा के सामने स्मरण करते हैं[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तुम्हें भलाई के लिए’ का अर्थ ‘तुम्हारे विषय में अनुकूल रूप से’ या ‘तुम्हारे हित में’ भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: उपलब्ध गीइज़ प्रतिलिपि ‘के सामने’ पर टूट जाती है। ‘उस महान की महिमा’ निकटवर्ती पूर्ण पाठ-परंपरा के आधार पर पूरक है; इसलिए इस अंश की शब्दावली कुछ अनिश्चित है।
    reason: textual_variant
lexical_decisions:
- source_word: እምሕል፡ ለክሙ፡
  choice: मैं तुमसे शपथ खाकर कहता हूँ
  rationale: यह प्रथम पुरुष में शपथ का सूत्र है—‘मैं तुमसे शपथ खाता हूँ।’ हिन्दी में ‘शपथ खाकर कहता हूँ’ इसका स्वाभाविक और गरिमापूर्ण रूप है।
- source_word: በሰማይ፡
  choice: स्वर्ग में
  rationale: स्थानवाचक पद का सीधा अर्थ ‘स्वर्ग में’ है; इसे बाद के ‘महिमा के सामने’ वाक्यांश में मिलाकर इसका स्वतंत्र अर्थ दबाया नहीं गया।
- source_word: ይዜከሩ፡
  choice: स्मरण करते हैं
  rationale: क्रिया का मूल भाव याद करने या स्मरण रखने का है। ‘लिखा हुआ है’ जैसी अभिलेख-पुस्तक की छवि मूल पंक्ति में स्पष्ट नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: መላእክት፡
  choice: स्वर्गदूत
  rationale: शब्द स्पष्ट रूप से बहुवचन ‘स्वर्गदूत’ को सूचित करता है; इसे ‘स्मारक’ या किसी अमूर्त भाव के रूप में नहीं लिया गया।
- source_word: በእንቲአክሙ፡ ለሠናይ፡
  choice: तुम्हें भलाई के लिए
  rationale: 'यह जानबूझकर कुछ खुला रखा गया है: इसका आशय तुम्हारे विषय में अनुकूल स्मरण, तुम्हारे हित में स्मरण, अथवा तुम्हारे भले के लिए स्मरण हो सकता है।'
- source_word: በ*ቅድመ፡
  choice: के सामने
  rationale: दृश्य पाठ का अंतिम पद ‘सामने/सम्मुख’ का अर्थ देता है, लेकिन उसके बाद अपेक्षित संबंध-पद इस प्रतिलिपि में नहीं बचा; पूरक पद को पाठ-टिप्पणी के साथ रखा गया है।
theological_decisions:
- issue: स्वर्गीय स्मरण का स्वरूप
  choice: स्वर्गदूत धर्मियों को उनके भले के लिए परमेश्वर की महिमा के सामने स्मरण करते हैं।
  alternative: इसे स्वर्गीय न्यायालय में लिखे हुए अभिलेख या प्रार्थना सुने जाने का कथन माना जाए।
  rationale: दिए गए गीइज़ पाठ में स्वर्गदूतों और स्मरण की भाषा स्पष्ट है, पर लिखित अभिलेख या अनसुनी शिकायत का उल्लेख नहीं है। इसलिए न्यायिक पृष्ठभूमि की संभावना को पाठ में अतिरिक्त शब्द जोड़कर निश्चित नहीं किया गया।
- issue: ‘महान जन’ की पहचान
  choice: ‘महान जन’ पदवी को बनाए रखा गया है।
  alternative: इसे सीधे ‘परमेश्वर’ या ‘महान परमेश्वर’ कहा जाए।
  rationale: पदवी का सांकेतिक और अपोकैलिप्टिक स्वर बनाए रखने तथा मूल से अधिक स्पष्ट धार्मिक पहचान आरोपित न करने के लिए इसका शाब्दिक भाव रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक के लिए सुबोध शैली अपनाई गई है। ‘शपथ खाकर कहता हूँ,’ ‘स्वर्गदूत,’ और ‘स्मरण करते हैं’ स्रोत के स्पष्ट शब्दों को सामने रखते हैं। कठिन ‘भलाई के लिए’ को अधिक व्याख्यात्मक बनाकर अस्पष्टता समाप्त नहीं की गई; उसका वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
