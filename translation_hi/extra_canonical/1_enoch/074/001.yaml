base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/001.yaml
  text: 'And I saw for it another course and regulation: by that regulation it makes its course of the months[a][b][c].'
translation:
  language: hi
  text: 'और मैंने उसके लिए एक और गति-चक्र और विधान[a] देखा: उसी विधान के अनुसार वह महीनों का अपना गति-चक्र चलाता है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नियम” अथवा “आदेश”; गीइज़ शब्द किसी प्रामाणिक रूप से स्थापित व्यवस्था को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम पदबंध का अधिक सहज अनुवाद “अपना मासिक गति-चक्र” भी हो सकता है। मूल में शाब्दिक रूप से “महीनों का” है।
    reason: syntactic_alternative
lexical_decisions:
- source_word: ካልአ
  choice: एक और
  rationale: यह किसी अतिरिक्त गति-चक्र का परिचय देता है; आधुनिक हिन्दी में ‘एक और’ स्वाभाविक रहते हुए संख्यात्मक भाव को बनाए रखता है।
- source_word: ምሕዋረ / ምሕዋሮ
  choice: गति-चक्र
  rationale: यह खगोलीय पिंड की व्यवस्थित गति, परिपथ या चक्र को सूचित करता है। दोनों स्थानों पर एक ही पद रखकर मूल की पुनरावृत्ति सुरक्षित की गई है।
- source_word: ትእዛዘ / ትእዛዝ
  choice: विधान
  rationale: यहाँ आशय किसी बोले गए आदेश की अपेक्षा सृष्टि की गति को नियंत्रित करने वाली स्थापित व्यवस्था से है। ‘विधान’ उसके प्रामाणिक और नियामक दोनों भावों को व्यक्त करता है।
- source_word: ርኢኩ
  choice: मैंने ... देखा
  rationale: यह दर्शन-वर्णन का सामान्य सूत्र है और मूल के प्रथम पुरुष भूतकाल को सीधे व्यक्त करता है।
- source_word: ሎቱ
  choice: उसके लिए
  rationale: मूल के दत्तिवाचक सर्वनाम को सुरक्षित रखता है, यद्यपि उसका पूर्वसंदर्भ इस अकेले पद में स्पष्ट नहीं है।
- source_word: በውእቱ ትእዛዝ
  choice: उसी विधान के अनुसार
  rationale: यह उस नियामक व्यवस्था को दर्शाता है जिसके अनुरूप गति संपन्न होती है; हिन्दी में ‘के अनुसार’ साधन अथवा मानक के भाव को स्वाभाविक रूप देता है।
- source_word: ይገብር
  choice: पूरा करता है
  rationale: क्रिया में किसी निर्धारित गति-चक्र को संपन्न करने का सक्रिय भाव है; केवल ‘चलता है’ कहने से वह बल घट जाता।
- source_word: ምሕዋሮ ዘአውራኅ
  choice: महीनों का अपना गति-चक्र
  rationale: አውራኅ का अर्थ ‘महीने’ है, ‘हवाएँ’ नहीं। अनुवाद मूल के संबंधवाचक पदबंध और गति-चक्र की पुनरावृत्ति को यथासंभव बनाए रखता है।
theological_decisions:
- issue: ब्रह्मांडीय विधान का स्वरूप
  choice: इसे सृष्टिगत गति को नियंत्रित करने वाला स्थापित ‘विधान’ माना गया है।
  alternative: इसे उस खगोलीय पिंड को दिया गया सीधा ‘आदेश’ कहा जा सकता है।
  rationale: इस खगोलीय प्रसंग में शब्द नियमित गति की व्यवस्था बताता है। फिर भी ‘विधान’ उसके प्रामाणिक आदेशात्मक आयाम को पूरी तरह हटाता नहीं है।
- issue: सर्वनाम का पूर्वसंदर्भ
  choice: ‘वह’ और ‘उसके’ को बिना स्पष्ट संज्ञा जोड़े रखा गया है।
  alternative: प्रसंग के आधार पर ‘चन्द्रमा’ स्पष्ट रूप से जोड़ा जा सकता है।
  rationale: इस पद के मूल पाठ में संज्ञा नहीं दी गई; उसे जोड़ना वास्तविक संदर्भगत अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘गति-चक्र’ खगोलीय तकनीकी भाव को व्यक्त करता है, जबकि मूल की ‘विधान’ और ‘गति-चक्र’ संबंधी पुनरावृत्ति भी सुरक्षित रहती है।
