lexical_decisions:
- source_word: ካዕበ
  choice: फिर
  rationale: यह शब्द सूर्य की गतियों के क्रम में पुनरावृत्ति और आगे बढ़ते वर्णन को सूचित करता है।
- source_word: ይገብእ
  choice: वह ... लौटता है
  rationale: यहाँ क्रिया का अर्थ ‘लौटना’ या ‘वापस जाना’ है; निहित कर्ता प्रसंगानुसार सूर्य है।
- source_word: ሰቡዐ መዋዕለ
  choice: सात दिन तक
  rationale: यह अवधि को व्यक्त करता है और कालगणना की सटीकता बनाए रखता है।
- source_word: በራብዕት ኆኅት
  choice: चौथे द्वार की ओर
  rationale: पूर्वसर्ग द्वार से संबद्ध दिशा या गमन को दर्शा सकता है; ‘की ओर’ लौटने की गति के साथ स्वाभाविक है, जबकि ‘से होकर’ भी संभव है।
- source_word: እንተ እምኔሃ
  choice: जिससे
  rationale: यह संबंधवाचक पद ठीक पहले आए चौथे द्वार की ओर संकेत करता है।
- source_word: ይወፅእ ፀሐይ
  choice: सूर्य निकलता है
  rationale: यह द्वार से सूर्य के बाहर आने की ठोस छवि को सरल, स्वाभाविक हिन्दी में व्यक्त करता है।
