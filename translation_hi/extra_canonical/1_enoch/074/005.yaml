  text: For two months it sets with the sun in these two middle portals[c][b][a], in the third and in the fourth portal.
translation:
  language: hi
  text: दो महीने तक वह सूर्य के साथ इन दो मध्यवर्ती द्वारों से—अर्थात् तीसरे और चौथे द्वार से—अस्त होता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በክልኤ ወርኅ
  choice: दो महीने तक
  rationale: ክልኤ मूल संख्या ‘दो’ है, क्रमवाचक ‘दूसरा’ नहीं; በ यहाँ अवधि सूचित करता है।
- source_word: የዓርብ
  choice: वह ... अस्त होता है
  rationale: यह ዐረበ (‘अस्त होना’) का अपूर्ण/वर्तमानकालिक तृतीय पुरुष एकवचन रूप है; खगोलीय संदर्भ में कर्ता पूर्वप्रसंग से ग्रहण किया जाता है।
- source_word: ምስለ ፀሐይ
  choice: सूर्य के साथ
  rationale: ምስለ का सीधा अर्थ ‘के साथ’ है और यह दोनों खगोलीय पिंडों की संबद्ध गति को बनाए रखता है।
- source_word: በእሉ ክልኤ ኆዋኅው እለ ማእከል
  choice: इन दो बीच के द्वारों से
  rationale: ኆዋኅው, ኆኅት का बहुवचन, ‘द्वार/फाटक’ है; ማእከል स्थानगत मध्यता बताता है। गति के संदर्भ में हिन्दी ‘से’ स्वाभाविक है।
- source_word: በሣልስት ወበራብዕት ኆኅት
  choice: तीसरे और चौथे द्वार से
  rationale: क्रमवाचक संख्याएँ दो निर्दिष्ट द्वारों की पहचान करती हैं; पुनरुक्त ‘द्वार’ स्रोत की स्थापत्यात्मक आकाशीय छवि बनाए रखता है।
theological_decisions:
- issue: आकाशीय छिद्रों/मार्गों का स्वरूप
  choice: द्वार
  alternative: खिड़कियाँ या खुले मार्ग
  rationale: गीज़ ኆኅት का सामान्य अर्थ द्वार या फाटक है। ‘द्वार’ प्रकाशनात्मक-खगोलीय स्थापत्य-छवि को बिना आधुनिक वैज्ञानिक अर्थ आरोपित किए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य। डैश द्वारा ‘तीसरे और चौथे द्वार’ को पहले आए ‘दो बीच के द्वारों’ की व्याख्या के रूप में स्पष्ट किया गया है। कोई पादटिप्पणी आवश्यक नहीं, क्योंकि संशोधित गीज़ विश्लेषण मुख्य पाठ के अर्थ को पर्याप्त रूप से स्पष्ट करता है।
