  source_fidelity: संशोधन आवश्यक है। मसौदे में ‘और उनके अधिष्ठान भी’ को ऊरीएल के ‘दिखाने’ के तुरंत बाद जोड़ दिया गया है, जबकि गीइज़ में ‘उनकी स्थितियाँ’ अगले खंड में ‘मैंने लिख लिया’ का कर्म है। साथ ही አውራኂሆሙ का अर्थ यहाँ ‘उनके मार्ग/पथ’ है, ‘उनके महीने’ नहीं। ርእየ को संज्ञात्मक construct (‘प्रकट होने का रूप/दृश्य’) मानना उचित है, न कि ‘मैंने देखा’।
  naturalness: ‘अधिष्ठान’ की अपेक्षा ‘स्थितियाँ’ आधुनिक मानक हिन्दी में अधिक सहज है और खगोलीय क्रमबद्ध स्थान का अर्थ सुरक्षित रखती है। संशोधित वाक्य मूल की सूचीबद्ध संरचना को रखते हुए पठनीय हिन्दी में है।
  terminology: ऊरीएल, ‘पवित्र स्वर्गदूत’, ‘अगुआ’, ‘स्थितियाँ’, ‘मार्ग’, और ‘प्रकाश के प्रकट होने का रूप’ स्रोत के अर्थ और गरिमापूर्ण आधुनिक हिन्दी रजिस्टर के अनुकूल हैं।
  issues:
