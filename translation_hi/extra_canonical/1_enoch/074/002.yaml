    issue: ‘और उनके अधिष्ठान भी’ का गलत स्थान और अनावश्यक पुनरावृत्ति
    rationale: मूल पाठ में ऊरीएल ने ‘जो कुछ’ दिखाया, उसके बाद लेखक कहता है कि उसने ‘उनकी स्थितियाँ’ लिखीं। यह पद ‘दिखाया’ का अलग कर्म नहीं है; मसौदे में इसे जोड़ने से वाक्य-संरचना और अर्थ दोनों बिगड़ते हैं।
  - severity: high
    issue: አውራኂሆሙ का ‘उनके महीने’ अनुवाद
    rationale: इस संदर्भ में शब्द आकाशीय पिंडों के मार्गों/पथों को सूचित करता है। ‘महीने’ स्रोत-संगत नहीं है और संबंधित पादटिप्पणी का भाषिक दावा भी गलत है।
