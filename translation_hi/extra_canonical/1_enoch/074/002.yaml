  yaml_path: translation/extra_canonical/1_enoch/074/002.yaml
  text: And all that Uriel[a], the holy angel who is their leader, showed me—I wrote down their positions as he showed them to me, and I wrote down their paths as they are[e][d][c][b], and I saw their lights until fifteen days were completed.
translation:
  language: hi
  text: और जो कुछ पवित्र स्वर्गदूत ऊरीएल ने मुझे दिखाया—वह उन सबका अगुआ है—मैंने उनकी स्थितियों को वैसा ही लिख लिया जैसा उसने मुझे दिखाया था; और उनके मार्गों को जैसे वे हैं, वैसे ही, तथा पंद्रह दिन पूरे होने तक उनके प्रकाश के प्रकट होने के रूप को भी लिख लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሎዘ
  choice: इन सब बातों को
  rationale: यह संबंधवाचक संरचना आगे कही गई समस्त दिखाई गई बातों को समेटती है; हिन्दी में यह स्वाभाविक और व्यापक है।
- source_word: አርአየኒ
  choice: मुझे दिखाया
  rationale: मूल क्रिया का अर्थ दिखाना या देखने देना है; ‘प्रकट किया’ की अपेक्षा यह दृश्य-दर्शन के भाव को अधिक सीधे रखता है।
- source_word: መልአክ ቅዱስ
  choice: पवित्र स्वर्गदूत
  rationale: यह पदवी का सीधा और प्रचलित हिन्दी रूप है।
- source_word: መራሒሆሙ ለኵሎሙ
  choice: जो उन सबका अगुआ है
  rationale: मूल में नेतृत्व या मार्गदर्शन का भाव है; ‘अगुआ’ सामान्य पाठक के लिए सहज है और संदर्भित ‘उन सब’ को अस्पष्ट ही रहने देता है।
- source_word: ምንባሪሆሙ
  choice: उनके अधिष्ठान
  rationale: शाब्दिक क्षेत्र में निवास-स्थान, ठहरने का स्थान और नियत स्थिति आते हैं। खगोलीय संदर्भ में ‘अधिष्ठान’ नियत स्थान का गरिमापूर्ण भाव रखता है।
- source_word: አውራኂሆሙ
  choice: उनके महीने
  rationale: यह ወርኅ (‘महीना’) का बहुवचन रूप है; अतः परामर्शी अंग्रेज़ी की ‘paths’ के बजाय मूल भाषा के आधार पर ‘महीने’ चुना गया है।
- source_word: ርእየ ብርሃኖሙ
  choice: उनके प्रकाश के दिखाई देने का ढंग
  rationale: ርእየ को प्रथम पुरुष क्रिया ‘मैंने देखा’ नहीं, बल्कि construct रूप में ‘दिखाई देना/रूप’ समझा गया है; इससे यह ‘मैंने लिख लिया’ का एक और कर्म बनता है।
- source_word: እስከ ተፈጸመ ዐሡር ወኀሙስ መዋዕለ
  choice: पंद्रह दिन पूरे होने तक
  rationale: मूल में पंद्रह दिनों की अवधि के पूर्ण होने की सीमा व्यक्त होती है।
theological_decisions:
- issue: बार-बार आए ‘उनके/उन सब’ का संदर्भ
  choice: सर्वनामों को बिना स्पष्ट संज्ञा जोड़े रखा गया है
  alternative: उन्हें स्पष्ट रूप से ‘आकाशीय ज्योतियों’ से जोड़ना
  rationale: आस-पास का खगोलीय संदर्भ ज्योतियों की ओर संकेत करता है, पर पद स्वयं संज्ञा को दोहराता नहीं; सर्वनाम बनाए रखने से वास्तविक संदर्भगत खुलापन सुरक्षित रहता है।
- issue: ርእየ का व्याकरणिक अर्थ
  choice: 'संज्ञात्मक construct: ‘दिखाई देने का ढंग/रूप’'
  alternative: 'प्रथम पुरुष क्रिया: ‘मैंने उनके प्रकाश देखे’'
  rationale: यह रूप संज्ञा ርእይ का construct अधिक उपयुक्त है; प्रथम पुरुष पूर्ण क्रिया का अपेक्षित रूप भिन्न होता। इसलिए वाक्य में इसे लिखी गई बातों की सूची का भाग माना गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सुबोध शैली रखी गई है। ‘अधिष्ठान’ अपेक्षाकृत साहित्यिक है, इसलिए पादटिप्पणी में सरल विकल्प दिए गए हैं। मूल के सूची-जैसे, कुछ संकुचित वाक्य-विन्यास को पठनीय बनाने के लिए विरामचिह्न और ‘भी’ का प्रयोग किया गया, पर कोई संदर्भित संज्ञा जोड़कर सर्वनामों की अस्पष्टता दूर नहीं की गई।
