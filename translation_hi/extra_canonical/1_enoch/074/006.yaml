base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/006.yaml
  text: For seven days it goes out and turns about[a], and it returns again through the gate from which the sun goes out; and it completes all its light, and it withdraws from the sun[d][c][b], and it enters for eight days through the sixth gate from which the sun goes out.
translation:
  language: hi
  text: वह[a] सात दिन तक निकलता है और चक्कर लगाता है; फिर वह उसी द्वार से लौटता है जिससे सूर्य निकलता है। वह अपने समस्त प्रकाश को पूरा करता है,[b] सूर्य से दूर हटता है, और आठ दिन तक छठे द्वार से प्रवेश करता है जिससे सूर्य निकलता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद में कर्ता का नाम स्पष्ट रूप से नहीं दिया गया है। प्रसंग में सम्भवतः चन्द्रमा अभिप्रेत है, पर मुख्य पाठ में स्रोत की अस्पष्टता बनाए रखने के लिए ‘वह’ रखा गया है।
    reason: alternative_reading
  - marker: b
    text: ‘अपने समस्त प्रकाश को पूरा करता है’ कुछ तकनीकी अभिव्यक्ति है। इसका संकेत उस खगोलीय पिंड के अपने प्रकाश की पूरी मात्रा तक पहुँचने की ओर हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: ይወፅእ
  choice: निकलता है
  rationale: यह बाहर जाने या निकलने की सामान्य गति को व्यक्त करता है और पद में दोहराए गए खगोलीय गति-सूत्र को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: ሰብዓተ መዋዕለ
  choice: सात दिन तक
  rationale: यह अवधि सूचित करने वाला पदबंध है; आधुनिक हिन्दी में ‘सात दिन तक’ इसका स्वाभाविक रूप है।
- source_word: የአውድ
  choice: चक्कर लगाता है
  rationale: क्रिया घूमने, परिक्रमा करने या चारों ओर जाने का भाव रखती है; ‘चक्कर लगाता है’ स्पष्ट और सहज है, पर आधुनिक वैज्ञानिक अर्थ में कोई निश्चित कक्षा आरोपित नहीं करता।
- source_word: ይገብእ ካዕበ
  choice: फिर ... लौटता है
  rationale: ካዕበ पुनरावृत्ति का भाव देता है। बाहर निकलने और चक्कर लगाने के बाद की वापसी के क्रम को ‘फिर लौटता है’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: በኆኅት
  choice: द्वार से
  rationale: ኆኅት का अर्थ द्वार या प्रवेश-द्वार है। ‘द्वार’ हनोक की खगोलीय संरचना के चित्र को बनाए रखता है और इसे ‘खिड़की’ से नहीं मिलाता।
- source_word: ወይፌጽም ኵሎ ብርሃኖ
  choice: अपने समस्त प्रकाश को पूरा करता है
  rationale: स्रोत का कुछ तकनीकी और असामान्य कथन सुरक्षित रखा गया है; इसे व्याख्यात्मक रूप से केवल ‘पूर्णिमा हो जाती है’ नहीं बनाया गया।
- source_word: ወይፀንን እምፀሐይ
  choice: सूर्य से दूर हटता है
  rationale: क्रिया अलग होने या हटने का भाव देती है। यह अनुवाद संबंधपरक गति को रखता है, पर किसी विशिष्ट खगोलीय सिद्धांत को आरोपित नहीं करता।
- source_word: ስሙነ መዋዕለ
  choice: आठ दिन तक
  rationale: पहले आए अवधि-वाचक पदबंध की तरह इसे भी अवधि के रूप में प्रस्तुत किया गया है।
- source_word: በሳድስት ኆኅት
  choice: उस छठे द्वार से
  rationale: क्रमवाचक संख्या और द्वार के तकनीकी पद को स्पष्ट तथा पहले प्रयोग के अनुरूप रखा गया है। ‘उस’ संदर्भित खगोलीय द्वार को स्वाभाविक हिन्दी में चिह्नित करता है।
theological_decisions:
- issue: गतिशील खगोलीय पिंड की पहचान
  choice: मुख्य पाठ में ‘वह’ रखा गया है; ‘चन्द्रमा’ नहीं जोड़ा गया।
  alternative: संदर्भ के आधार पर हर क्रिया का कर्ता स्पष्ट रूप से ‘चन्द्रमा’ लिखना।
  rationale: आस-पास का प्रसंग सम्भवतः चन्द्रमा की गति का वर्णन करता है, पर इस पद में कर्ता संज्ञा के रूप में दोहराया नहीं गया है। सर्वनाम स्रोत की अंतर्निहित अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण खगोलीय वर्णन रखा गया है। वाक्य-क्रम स्रोत की क्रमिक गतियों—निकलना, चक्कर लगाना, लौटना, प्रकाश पूरा करना, सूर्य से हटना और प्रवेश करना—को सुरक्षित रखता है। ‘द्वार’ को पूरे पद में एकरूप रखा गया है।
