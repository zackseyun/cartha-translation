  yaml_path: translation/extra_canonical/1_enoch/074/004.yaml
  text: And in certain months it changes its settings[a], and in certain months it travels its course[d][c][b], one by one.
translation:
  language: hi
  text: और कुछ महीनों में वह अपने अस्त होने के स्थान बदलता है[a], और कुछ महीनों में वह अपना मार्ग एक-एक करके तय करता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘अपने अस्तों को बदलता है’; आशय संभवतः अलग-अलग महीनों में अस्त होने के स्थानों का बदलना है।
    reason: lexical_alternative
  - marker: b
    text: मूल में ‘एक, एक’ की पुनरुक्ति है, जिसका भाव ‘एक-एक करके’ या ‘हर एक अलग-अलग’ हो सकता है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: አውራኅ
  choice: महीनों
  rationale: यहाँ शब्द ወርኅ (‘महीना/चंद्र-मास’) का बहुवचन है; इसलिए इसे खगोलीय ‘मार्गों’ के बजाय ‘महीनों’ के रूप में लिया गया है।
- source_word: እመራት
  choice: कुछ
  rationale: वाक्यांश በአውራኅ እመራት का अर्थ ‘कुछ/विशेष महीनों में’ है। सहज आधुनिक हिन्दी के लिए ‘कुछ महीनों में’ चुना गया है।
- source_word: ይዌልጥ
  choice: बदलता है
  rationale: क्रिया का मूल अर्थ बदलना या परिवर्तित करना है; यह पश्चिम की ओर उतरने का संकेत नहीं देती।
- source_word: ምዕራባተ
  choice: अस्त होने के स्थान
  rationale: यह ‘अस्त होने’ से संबंधित बहुवचन संज्ञा है। ‘स्थान’ जोड़ने से हिन्दी में अलग-अलग पश्चिमी अस्त-बिंदुओं का खगोलीय आशय स्पष्ट होता है, जबकि केवल ‘अस्त’ कहना अस्पष्ट होता।
- source_word: የሐውር
  choice: तय करता है
  rationale: यह चलने या आगे बढ़ने की सामान्य क्रिया है; ‘मार्ग तय करता है’ हिन्दी में नियमित खगोलीय गति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ምሕዋሪሁ
  choice: अपना मार्ग
  rationale: संदर्भ में यह उसकी नियमित चाल, यात्रा या परिपथ को दर्शाता है। ‘मार्ग’ ठोस खगोलीय पथ की छवि बनाए रखता है।
- source_word: አሐዱ፡ አሐዱ
  choice: एक-एक करके
  rationale: मूल की पुनरुक्ति का वितरणात्मक या क्रमिक भाव है; हिन्दी में ‘एक-एक करके’ इसे स्वाभाविक रूप से सुरक्षित रखता है।
