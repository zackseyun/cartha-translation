base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/007.yaml
  text: And when the sun goes out from the fourth gate[a], it goes out for seven days, until it goes out from the fifth; and again it returns for seven days through the fourth gate, and completes all its light[c][b], and it withdraws and enters through the first gate for eight days.
translation:
  language: hi
  text: और जब सूर्य चौथे द्वार से निकलता है, तो वह सात दिनों तक निकलता है, जब तक कि वह पाँचवें से न निकले[a]। फिर वह चौथे द्वार से होकर सात दिनों तक लौटता है[c] और अपना सारा प्रकाश पूर्ण करता है[b]; फिर वह पीछे हटता है और आठ दिनों तक पहले द्वार से प्रवेश करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ में यहाँ ‘पाँचवें’ के बाद ‘द्वार’ शब्द फिर से नहीं आया है; आसपास के क्रम से आशय लगभग निश्चित रूप से ‘पाँचवाँ द्वार’ है।
    reason: lexical_alternative
  - marker: b
    text: ‘अपना सारा प्रकाश पूर्ण करता है’ गीज़ मुहावरे का निकट अनुवाद है। संभवतः इसका अर्थ है कि चक्र के इस चरण में सूर्य अपने प्रकाश की पूरी मात्रा तक पहुँचता है।
    reason: cultural_note
  - marker: c
    text: 'कुछ पूर्व अनुवादों में: ‘चौथे द्वार की ओर लौटता है’; पर गीज़ के በ का यहाँ अधिक सटीक अर्थ ‘चौथे द्वार से होकर’ है।'
    reason: previous_rendering
lexical_decisions:
- source_word: ፀሐይ
  choice: सूर्य
  rationale: ज्योतियों से संबंधित इस प्रसंग में यह सीधा खगोलीय संदर्भ है; आधुनिक मानक हिन्दी में ‘सूर्य’ गरिमापूर्ण और स्वाभाविक है।
- source_word: ይወፅእ
  choice: निकलता है
  rationale: गीज़ में बार-बार आने वाली गति-सूचक अभिव्यक्ति और द्वार से ज्योति के बाहर आने की छवि को बनाए रखता है।
- source_word: እምራብዕት ኆኅት
  choice: चौथे द्वार से
  rationale: ኆኅት के ठोस ‘द्वार’ रूपक को सुरक्षित रखते हुए እም की अपादान-संबंधी गति व्यक्त करता है।
- source_word: ሰቡዐ መዋዕለ
  choice: सात दिन तक
  rationale: यहाँ सौर गति की अवधि अभिप्रेत है; ‘तक’ हिन्दी में अवधि को स्पष्ट और सहज बनाता है।
- source_word: እስከ ይወፅእ እምነ ኃምስት
  choice: जब तक कि वह पाँचवें से न निकले
  rationale: प्रेषित गीज़ पाठ में ‘पाँचवें’ के बाद ‘द्वार’ दोहराया नहीं गया है; हिन्दी में भी उस लोप को रखा गया है और पादटिप्पणी में आशय स्पष्ट किया गया है।
- source_word: ካዕበ
  choice: फिर
  rationale: सौर क्रम में अगली, लौटती हुई गति को संक्षेप और स्वाभाविक ढंग से चिह्नित करता है।
- source_word: ይገብእ
  choice: लौटता है
  rationale: संदर्भ में पहले के द्वार की ओर उलटी दिशा में गति को व्यक्त करता है।
- source_word: በኆኅት ራብዕ
  choice: चौथे द्वार से होकर
  rationale: በ को मार्ग अथवा माध्यम के अर्थ में ‘से होकर’ दिया गया है; इससे द्वारों से होकर गुजरने की ब्रह्मांडीय छवि और संशोधित पाठ-साक्ष्य दोनों सुरक्षित रहते हैं।
- source_word: ይፌጽም ኵሎ ብርሃኖ
  choice: अपने सारे प्रकाश को पूरा करता है
  rationale: मूल की कुछ तकनीकी और योजनाबद्ध अभिव्यक्ति को ‘पूरी चमक पर पहुँचता है’ जैसे व्याख्यात्मक विस्तार के बिना निकटता से रखता है।
- source_word: ይደንን
  choice: पीछे हटता है
  rationale: प्रकाश पूरा करने और अगले द्वार में प्रवेश करने के बीच घटती या लौटती गति को दर्शाता है, बिना इसे केवल ‘छिपना’ मानकर निश्चित किए।
- source_word: ይበውእ በቀዳሚት ኆኅት
  choice: पहले द्वार से प्रवेश करता है
  rationale: पहले के ‘निकलता है’ के अनुरूप प्रवेश की विपरीत गति और द्वार की छवि को बनाए रखता है।
- source_word: ስሙነ መዋዕለ
  choice: आठ दिन तक
  rationale: चक्र के अंतिम उल्लिखित चरण की अवधि का सहज हिन्दी रूप है।
theological_decisions:
- issue: सूर्य की गति से जुड़ी ब्रह्मांडीय द्वार-छवि
  choice: सूर्य के निकलने, लौटने और प्रवेश करने के लिए ‘द्वार’ की भाषा अक्षरशः बनाए रखी गई है।
  alternative: इसे क्षितिज के बिंदुओं, मार्गों या खगोलीय अवस्थानों के रूप में आधुनिकीकृत करना।
  rationale: खगोलीय पुस्तक एक संरचित ब्रह्मांड का चित्र देती है जिसमें ज्योतियाँ द्वारों से होकर चलती हैं। इस छवि को आधुनिक खगोल-विज्ञान के अनुसार समतल करना स्रोत की अपोकैलिप्टिक कल्पना को बदल देता।
- issue: ‘अपने सारे प्रकाश को पूरा करता है’ का अर्थ
  choice: मूल के मुहावरे को निकट रूप में रखा गया है।
  alternative: ‘अपनी पूरी चमक पर पहुँचता है’ कहना।
  rationale: वैकल्पिक रूप संभावित आशय स्पष्ट करता है, पर मूल अभिव्यक्ति में निहित योजनाबद्धता और कुछ अस्पष्टता को अधिक निश्चित कर देता है।
