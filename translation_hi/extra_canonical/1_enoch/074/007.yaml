  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। मूल की पुनरावृत्ति, कालावधियाँ और ठोस ब्रह्मांडीय ‘द्वार’ रूपक सुरक्षित हैं। पादटिप्पणी-चिह्न मुख्य पाठ में संबद्ध पदों के तुरंत बाद दिए गए हैं।
