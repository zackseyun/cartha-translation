base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/012.yaml
  text: And the sun and the stars bring in all the years exactly[a]; according to their stations forever, they do not advance or fall behind by a single day, but they complete the year in righteousness, exactly[d][c][b], in three hundred and sixty-four days.
translation:
  language: hi
  text: और सूर्य तथा तारे सभी वर्षों को ठीक-ठीक[a] ले आते हैं; अपने-अपने नियत स्थानों के अनुसार वे सदा एक दिन भी न आगे बढ़ते हैं, न पीछे रहते हैं, बल्कि तीन सौ चौंसठ दिनों में ठीक-ठीक वर्ष को धार्मिकता से[b] पूरा करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पूरी सटीकता से”; मूल शब्द सावधानीपूर्वक और शुद्ध गणना पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: या “सही ढंग से।” मूल शब्द का अर्थ “धार्मिकता” भी है और वह यहाँ ब्रह्मांडीय व्यवस्था को नैतिक महत्व देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ያመጽእሙ
  choice: ले आते हैं
  rationale: कारक भाव और वर्ष के आगमन की ठोस पंचांगीय छवि को बनाए रखता है।
- source_word: ጥንቁቃት / ጥንቁቀ
  choice: ठीक-ठीक
  rationale: खगोलीय गणना में सावधानी, शुद्धता और सटीकता के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ከመ ምንባሪሆሙ ለዓለም
  choice: अपने-अपने नियत स्थानों के अनुसार वे सदा
  rationale: ከመ को ‘के अनुसार’, ምንባሪሆሙ को बहुवचन कर्ताओं के नियत स्थान, और ለዓለም को स्थायी कालगत भाव के रूप में स्पष्ट रखता है।
- source_word: ኢይበድሩ ወኢይጐንዱ አሐተ ዕለተ
  choice: एक दिन भी न आगे बढ़ते हैं, न पीछे रहते हैं
  rationale: निर्धारित पंचांग से शीघ्र या विलंबित न होने के संतुलित विरोध को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ይዌልጡ ዓመተ
  choice: वर्ष को ... पूरा करते हैं
  rationale: मूल क्रिया का शाब्दिक अर्थ बदलना/फेरना हो सकता है, पर इस वार्षिक चक्र के संदर्भ में वर्ष को उसके अंत तक पहुँचाने का भाव है; हिन्दी में ‘पूरा करते हैं’ सबसे स्वाभाविक है।
- source_word: በጽድቅ
  choice: धार्मिकता से
  rationale: सिर्फ तकनीकी ‘सही ढंग से’ कहने के बजाय मूल के नैतिक-धर्मवैज्ञानिक भार को बनाए रखता है।
- source_word: ፫፻ወ፷ወረቡዕ መዋዕለ
  choice: तीन सौ चौंसठ दिनों में
  rationale: हनोक के खगोलीय ग्रंथ के 364-दिवसीय वर्ष को पूर्ण और स्पष्ट रूप में प्रस्तुत करता है।
theological_decisions:
- issue: በጽድቅ को केवल पंचांगीय शुद्धता मानना या उसका नैतिक-धर्मवैज्ञानिक अर्थ बनाए रखना
  choice: धार्मिकता से
  alternative: सही ढंग से / उचित रीति से
  rationale: मूल शब्द ब्रह्मांडीय व्यवस्था और धार्मिकता के बीच संबंध बनाए रखता है; तकनीकी पर्याय उस तनाव को समतल कर देगा।
- issue: ይዌልጡ का शाब्दिक ‘बदलते हैं’ या संदर्भगत ‘पूरा करते हैं’
  choice: वर्ष को पूरा करते हैं
  alternative: वर्ष को बदलते/फेरते हैं
  rationale: क्रिया की शाब्दिक अनिश्चितता वास्तविक है, पर यहाँ 364 दिनों में वार्षिक चक्र के समाप्त या पलटने का संदर्भ है; मुख्य पाठ में स्वाभाविक संदर्भगत अर्थ चुना गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘अपने-अपने नियत स्थानों’ से मूल में उपस्थित स्थान/स्थिति-संज्ञा को छोड़ा नहीं गया। वाक्य की खगोलीय-पंचांगीय भाषा और ‘धार्मिकता’ का धर्मवैज्ञानिक भार दोनों सुरक्षित रखे गए हैं।
