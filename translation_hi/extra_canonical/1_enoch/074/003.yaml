base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/003.yaml
  text: In fifteen parts it completes all its light in the east[b][a], and in fifteen parts it completes all its darkness in the west.
translation:
  language: hi
  text: पंद्रह अंशों में वह पूर्व में अपने सारे प्रकाश को पूर्ण करता है[a], और पंद्रह अंशों में वह पश्चिम में अपने सारे अंधकार को पूर्ण करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध लिप्यंतरण में अंक-पद दोषपूर्ण और अनिश्चित है; खगोलीय प्रसंग तथा पाठ-समीक्षा के आधार पर यहाँ ‘पंद्रह अंश’ पढ़ा गया है। लिप्यंतरण के चिह्नों को यथावत् पढ़ने पर दूसरी संख्या निकल सकती है, पर वह इस प्रसंग की गणना से मेल नहीं खाती।
    reason: textual_variant
lexical_decisions:
- source_word: 'በ፲፭ እደ (प्रस्तुत लिप्यंतरण में दोषपूर्ण रूप: በ፭*፷፯ እደ)'
  choice: पंद्रह अंशों में
  rationale: खगोलीय प्रसंग, समानांतर दोनों उपवाक्यों और नवीन पाठ-समीक्षा के आधार पर अंक को ፲፭ (‘पंद्रह’) समझना उचित है। እደ का शाब्दिक अर्थ ‘हाथ’ है, पर यहाँ यह गणना की इकाइयों या भागों को सूचित करता है; इसलिए ‘अंश’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: ይፌጽም
  choice: पूर्ण करता है
  rationale: क्रिया को सक्रिय रूप में रखा गया है। इससे मूल की पुनरावृत्त, माप-संबंधी अभिव्यक्ति बनी रहती है और ‘पूरा उजाला हो जाता है’ जैसी व्याख्यात्मक भाषा से बचा जाता है।
- source_word: ኵሎ ብርሃኖ
  choice: अपने सारे प्रकाश को
  rationale: ኵሎ संपूर्णता और प्रत्यय संबंधवाचक अर्थ व्यक्त करता है। ‘सारा प्रकाश’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: በሠርቅ
  choice: पूर्व में
  rationale: यहाँ पूर्व दिशा या उदय-प्रदेश का स्थानवाचक अर्थ प्रसंगानुकूल है।
- source_word: ኵሎ ጽልመተ
  choice: अपने सारे अंधकार को
  rationale: ‘अंधकार’ प्रकाश के साथ मूल पाठ की संतुलित विरोधी छवि को बनाए रखता है; इसे केवल ‘प्रकाश की कमी’ कहकर व्याख्यायित नहीं किया गया।
- source_word: በምዕራብ
  choice: पश्चिम में
  rationale: ‘पूर्व में’ के समानांतर स्थानवाचक अनुवाद पूर्व-पश्चिम की संरचना सुरक्षित रखता है।
theological_decisions:
- issue: खगोलीय प्रक्रिया को व्याख्यात्मक भाषा में स्पष्ट करना या मूल की पूर्णता-सूचक अभिव्यक्ति बनाए रखना
  choice: प्रकाश और अंधकार दोनों के लिए ‘पूर्ण करता है’ रखा गया
  alternative: ‘पूरी चमक तक पहुँचता है … पूरी तरह अंधकारमय हो जाता है’
  rationale: अधिक व्याख्यात्मक विकल्प संभव खगोलीय आशय को स्पष्ट करता, पर गीइज़ पाठ की सूत्रात्मक समरूपता और वास्तविक अस्पष्टता घटा देता। सक्रिय, समानांतर अभिव्यक्ति मूल के अधिक निकट है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। ‘अंश’ खगोलीय गणना में ‘भाग’ से अधिक स्वाभाविक है, जबकि ‘पूर्ण करता है’ मूल की सक्रिय और सूत्रात्मक रचना को सुरक्षित रखता है। सर्वनाम ‘वह’ का संदर्भ पद में जैसा निहित है वैसा ही छोड़ा गया है; उसे स्पष्ट रूप से ‘चंद्रमा’ कहकर नहीं खोला गया।
