base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/014.yaml
  text: As for the moon alone[c][b][a], its days come to one thousand and sixty-two days for three years and for five years.
translation:
  language: hi
  text: केवल चन्द्रमा के लिए, उसके दिनों का कुल योग तीन वर्षों में एक हज़ार बासठ दिन होता है,[b][c] और पाँच वर्षों में…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राप्त गीइज़ पाठ में अंतिम वाक्यांश, “और पाँच वर्षों में,” अपूर्ण प्रतीत होता है; सम्भव है कि इस पंक्ति से कोई संख्या या आगे के शब्द लुप्त हों।
    reason: textual_variant
  - marker: b
    text: यह पद खगोलीय पुस्तक की कैलेंडरीय गणना का भाग है। “दिनों का कुल योग” का अर्थ है कि बताई गई अवधि में दिनों की कुल संख्या इतनी होती है।
    reason: cultural_note
  - marker: c
    text: ወርኅ का अर्थ “महीना” भी हो सकता है; अतः सम्भव अनुवाद है, “केवल महीने के लिए, उसके दिनों का कुल योग तीन वर्षों में एक हज़ार बासठ दिन होता है।” फिर भी 1,062 दिन तीन 354-दिवसीय चन्द्र-वर्षों के बराबर होने के कारण मुख्य पाठ में “चन्द्रमा” रखा गया है।
    reason: translation_alternative
