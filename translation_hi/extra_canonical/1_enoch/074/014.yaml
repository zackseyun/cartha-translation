- source_word: ለወርኅ
  choice: चन्द्रमा के
  rationale: ወርኅ का अर्थ ‘महीना’ या ‘चन्द्रमा’ हो सकता है। यहाँ 1,062 दिन तीन चन्द्र-वर्षों (354 × 3) के बराबर हैं, इसलिए खगोलीय संदर्भ में ‘चन्द्रमा’ अधिक उपयुक्त है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ለባሕቲቱ
  choice: केवल
  rationale: यह पद ‘अकेला’, ‘अपने आप’ या ‘केवल’ का भाव देता है और यहाँ चन्द्रमा की गणना को अलग से प्रस्तुत करता है।
- source_word: ይበጽሕ
  choice: कुल योग … होता है
  rationale: संख्यात्मक कथन में क्रिया का अर्थ ‘पहुँचना’ या ‘कुल मिलाकर इतना होना’ है। आधुनिक हिन्दी में ‘कुल योग … होता है’ तकनीकी आशय स्पष्ट करता है।
- source_word: መዋዕሊሁ
  choice: उसके दिनों का कुल योग
  rationale: बहुवचन संज्ञा ‘दिन’ के साथ लगा सर्वनाम चन्द्रमा की ओर संकेत करता है; सहज हिन्दी वाक्य-विन्यास में इसे ‘चन्द्रमा के दिनों का कुल योग’ किया गया है।
- source_word: ለ፫ዓም
  choice: तीन वर्षों में
  rationale: समयावधि के भीतर संचित गणना बताने के लिए हिन्दी में ‘तीन वर्षों में’ स्वाभाविक है और गीइज़ संबंधसूचक रचना का आशय सुरक्षित रखता है।
- source_word: ፲፻ ወ፷ወ፪ መዋዕለ
  choice: एक हज़ार बासठ दिन
  rationale: गीइज़ अंकक्रम का मान 1000 + 60 + 2 है और उसके बाद ‘दिन’ स्पष्ट रूप से उपस्थित है।
- source_word: ወለ፭ ዓም
  choice: और पाँच वर्षों में…
  rationale: प्राप्त पाठ में ‘और पाँच वर्षों के लिए/में’ तो है, पर उसके बाद अपेक्षित संख्या या कथन नहीं है। दीर्घविराम से अपूर्णता को बिना अनुमान लगाए दिखाया गया है।
theological_decisions:
- issue: खगोलीय/पंचांगीय कथन की अंतिम धारा अपूर्ण या पाठगत रूप से भ्रष्ट प्रतीत होती है
  choice: उपलब्ध गीइज़ शब्दों का रूढ़िवादी अनुवाद करके अंतिम वाक्यांश को खुला छोड़ा गया है।
  alternative: अन्य संस्करणों के आधार पर पाँच वर्षों का लुप्त कुल जोड़ देना या कथन को सामान्य पंचांगीय वाक्य में सुगम बना देना।
  rationale: उपलब्ध साक्ष्य अपेक्षित संख्या सुरक्षित नहीं रखता। अनुमानित पूर्ति के बजाय मुख्य पाठ में अनिश्चितता दिखाना और पादटिप्पणी में समझाना अधिक पारदर्शी है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी और गरिमापूर्ण किंतु सहज तकनीकी शैली अपनाई गई है। ‘कुल योग’ से संख्यात्मक क्रिया स्पष्ट होती है। अंतिम दीर्घविराम पाठ की वास्तविक अपूर्णता दर्शाता है, न कि भावात्मक विराम।
