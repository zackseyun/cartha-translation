base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/013.yaml
  text: For three years there are one thousand ninety-two days[a], and for five years, one thousand eight hundred twenty days and eight; thus for eight years there are two thousand nine hundred twelve days, and ten and two days.
translation:
  language: hi
  text: तीन वर्षों के लिए एक हज़ार बानवे दिन होते हैं[a], और पाँच वर्षों के लिए एक हज़ार आठ सौ बीस दिन और आठ; इस प्रकार आठ वर्षों के लिए दो हज़ार नौ सौ बारह दिन, और दस और दो दिन होते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'उपलब्ध गीज़ पाठ की इस पंक्ति में संख्याएँ पाठगत रूप से कठिन हैं। पद संभवतः तीन, पाँच और आठ वर्षों के दिनों का कुल जोड़ बताता है, पर अंतिम शब्दावली किसी विभाजित अथवा असामान्य क्रम में रखी संख्या को सुरक्षित रख सकती है। इसका सहज रूप हो सकता है: “तीन वर्षों के लिए 1,092 दिन; पाँच वर्षों के लिए 1,828 दिन; इस प्रकार आठ वर्षों के लिए 2,912 दिन।”'
    reason: textual_variant
lexical_decisions:
- source_word: ለ፫ዓም
  choice: तीन वर्षों के लिए
  rationale: कालावधि के अनुरूप दिनों का कुल जोड़ बताया जा रहा है; इसलिए ለ को गणनात्मक अर्थ में व्यक्त किया गया है।
- source_word: መዋዕለ
  choice: दिन
  rationale: इस खगोलीय-संवत्सरीय प्रसंग में यह गणना की सामान्य इकाई है।
- source_word: ፲፻ወ፺ወክልኤ
  choice: एक हज़ार बानवे
  rationale: गीज़ अंकक्रम को 1000 + 90 + 2 के रूप में पढ़ा गया है।
- source_word: ወለ፭ዓመት
  choice: और पाँच वर्षों के लिए
  rationale: पहले खंड के समान गणनात्मक संरचना को जारी रखता है।
- source_word: ፲ወ፰፻፳መዋዕለ፡ ወ፰
  choice: एक हज़ार आठ सौ बीस दिन और आठ
  rationale: प्राप्त पाठ में ‘दिन’ अंतिम आठ से पहले आता है; संदिग्ध शब्दक्रम को चुपचाप 1,828 दिन में सहज नहीं किया गया।
- source_word: ከመ፡ ይኩን
  choice: इस प्रकार ... होते हैं
  rationale: यहाँ पदबंध पूर्ववर्ती गणना का परिणाम प्रस्तुत करता है, उद्देश्य नहीं।
- source_word: ለ፰ዓመት
  choice: आठ वर्षों के लिए
  rationale: उसी क्रम में आठ वर्षों से संबंधित कुल संख्या बताई गई है।
- source_word: ፪ወ፱፻፲፪
  choice: दो हज़ार नौ सौ बारह
  rationale: गीज़ अंकक्रम को 2000 + 900 + 12 के रूप में पढ़ा गया है।
- source_word: ወዓሡር፡ ወስኑይ፡ መዋዕለ
  choice: और दस और दो दिन
  rationale: स्रोत की असहज किंतु स्पष्ट योगात्मक अभिव्यक्ति को पाठकीय पारदर्शिता के लिए सुरक्षित रखा गया है।
theological_decisions:
- issue: कठिन ओसीआर-आधारित गीज़ पंक्ति में पंचांग-संबंधी गणना
  choice: तीन, पाँच और आठ वर्षों के दिन-योगों का क्रम बनाए रखते हुए अंतिम असहज योगात्मक शब्दावली को सुरक्षित रखा गया।
  alternative: संख्याओं को सहज बनाकर ‘1,092 दिन; 1,828 दिन; अतः 2,912 दिन’ कर देना और अंतिम पदबंध हटाना।
  rationale: यह सिद्धांतगत निर्णायक पाठ नहीं, बल्कि पाठ-संबंधी पारदर्शिता का विषय है। स्रोत की वास्तविक कठिनाई को अनुमान से सुलझाने के बजाय अनुवाद और पादटिप्पणी में उजागर किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सुबोध शैली रखी गई है। संख्याएँ शब्दों में दी गई हैं और स्रोत की असहज योगात्मक रचना को जानबूझकर बनाए रखा गया है; उसकी व्याख्या पादटिप्पणी में है।
