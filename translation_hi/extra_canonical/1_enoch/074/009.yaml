translation:
  language: hi
  text: इस प्रकार मैंने उनकी गतिविधियाँ देखीं—कि उन दिनों चंद्रमा कैसे उदय होता है और सूर्य अस्त होता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ከመዝ
  choice: इस प्रकार
  rationale: यह पद पिछले वर्णन को समेटते हुए हनोक के अवलोकन को प्रस्तुत करता है; यह आधुनिक और गरिमापूर्ण हिन्दी है।
- source_word: ርኢኩ
  choice: मैंने … देखीं
  rationale: प्रथम पुरुष के दर्शन-संबंधी साधारण क्रिया-रूप को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ምግባሮሙ
  choice: उनकी गतिविधियाँ
  rationale: खगोलीय पिंडों के नैतिक ‘कामों’ के बजाय उनकी देखी जा सकने वाली क्रियाओं और गतियों का संकेत देता है।
- source_word: ይሠርቅ አውራኅ
  choice: चंद्रमा उदय होता
  rationale: यहाँ ሠረቀ प्रकाशमान पिंड के ‘उदय होने’ की क्रिया है, ‘चुरा ले जाने’ की नहीं; አውራኅ को प्रसंगानुसार चंद्रमा के रूप में व्यक्त किया गया है।
- source_word: ወየዓርብ ፀሐይ
  choice: और सूर्य अस्त होता है
  rationale: चंद्रमा के उदय के समानांतर सूर्य के नीचे जाने को प्रचलित खगोलीय हिन्दी में व्यक्त करता है।
- source_word: በእማንቱ መዋዕል
  choice: उन दिनों
  rationale: चर्चित खगोलीय अवधि को सूचित करने वाले कालवाचक पदबंध का सीधा और स्वाभाविक अनुवाद है।
