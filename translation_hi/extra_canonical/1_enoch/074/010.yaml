base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/010.yaml
  text: And five days are added[a], and for the sun it reaches thirty days; and all the days that accrue to it for one of those five years, when completed[c][b], amount to three hundred and sixty-four days.
translation:
  language: hi
  text: और पाँच दिन जोड़े जाते हैं[a], और सूर्य के लिए यह संख्या तीस दिन तक पहुँचती है; और उन पाँच वर्षों में से किसी एक वर्ष में उसके लिए जितने भी दिन जुड़ते हैं, वे उस वर्ष के पूरा होने पर तीन सौ चौंसठ दिन होते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राप्त गीइज़ पाठ में यहाँ शाब्दिक रूप से “पाँच वर्ष” है, जबकि कैलेंडरी संदर्भ “पाँच दिन” की ओर संकेत करता है। यह पंक्ति पाठगत रूप से कठिन है।
    reason: textual_variant
  - marker: b
    text: 'इस वाक्य के मध्य भाग में अंक-प्रतिलेखन भी अनिश्चित है: एक पठन “उन पाँच वर्षों में से एक” है। समूचे खगोलीय कैलेंडर में वर्ष का नियत योग 364 दिन है।'
    reason: textual_variant
lexical_decisions:
- source_word: ይትዌሰክ፡ ኃምስቱ፡ ዓመት
  choice: पाँच दिन जोड़े जाते हैं
  rationale: प्राप्त गीइज़ पाठ में शाब्दिक रूप से ‘पाँच वर्ष’ दिखाई देता है, पर यह पाठगत रूप से कठिन है। निकटवर्ती पंचवर्षीय गणना और 364 दिनों के वार्षिक योग के संदर्भ में संशोधित अंग्रेज़ी परामर्श-पाठ का ‘पाँच दिन’ अर्थ संगत है; कठिनाई को पादटिप्पणी में स्पष्ट रखा गया है।
- source_word: ለፀሐይ፡ ሠላሳ፡ መዋዕለ
  choice: सूर्य के लिए यह संख्या तीस दिन तक पहुँचती है
  rationale: ለፀሐይ को ‘सूर्य के लिए’ और पहुँचने वाले क्रियार्थ को स्वाभाविक हिन्दी में रखा गया है; ‘यह संख्या’ केवल वाक्य की स्पष्टता के लिए जोड़ा गया है।
- source_word: ወኵሎሙ፡ መዋዕለ፡ ይበጽሕዎ፡ ለዓመት
  choice: उसके लिए जितने भी दिन जुड़ते हैं
  rationale: क्रिया का मूल भाव ‘पहुँचना/योग में आना’ है। हिन्दी में ‘जुड़ते हैं’ वार्षिक कुल की संख्यात्मक प्रक्रिया को सहज रूप में व्यक्त करता है।
- source_word: ፭እምእሉኩ፡ ፭ዓመት፡ ተመሊኦሙ
  choice: उन पाँच वर्षों में से किसी एक वर्ष में ... उस वर्ष के पूरा होने पर
  rationale: पाठ में अंक-प्रतिलेखन की कठिनाई है; नवीन संशोधन के अनुसार पहला चिह्न ‘एक’ समझा जाता है। अनिश्चितता के बावजूद पंचवर्षीय क्रम के भीतर एक पूर्ण वर्ष का आशय संदर्भ से सबसे अधिक संगत है।
- source_word: ፻፷ወ፰ወረቡዐ፡ መዋዕለ
  choice: तीन सौ चौंसठ दिन
  rationale: यह अंक Astronomical Book की 364-दिवसीय वर्ष-गणना के अनुरूप स्पष्ट वार्षिक योग है।
theological_decisions:
- issue: आरम्भिक ‘पाँच’ का आशय
  choice: मुख्य पाठ में पाँच पूरक दिन
  alternative: प्राप्त गीइज़ को शाब्दिक रूप से ‘पाँच वर्ष’ पढ़ना
  rationale: गीइज़ प्रतिलिपि और कैलेंडरी संदर्भ में वास्तविक तनाव है। 364-दिवसीय वर्ष के संदर्भ में ‘पाँच दिन’ अर्थपूर्ण है, लेकिन ‘पाँच वर्ष’ पाठ-साक्ष्य को पादटिप्पणी में छिपाया नहीं गया।
- issue: पंचवर्षीय क्रम और एक वर्ष का संबंध
  choice: उन पाँच वर्षों में से किसी एक पूर्ण वर्ष का 364-दिवसीय योग
  alternative: पूरक पाँच दिनों के पूरा होने से वर्ष का योग 364 होना
  rationale: नवीन पाठ-समीक्षा मध्य खंड को पंचवर्षीय क्रम में ‘एक वर्ष’ से जोड़ती है। हिन्दी में इसे स्पष्ट किया गया है, पर पाठगत अनिश्चितता की सूचना दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सामान्य पाठक के लिए सुबोध किंतु गरिमापूर्ण। तकनीकी ‘एपागोमेनल’ शब्द से बचा गया है। गीइज़ पाठ की वास्तविक कठिनाइयों को मुख्य पाठ में अत्यधिक बोझिल किए बिना पादटिप्पणियों में सुरक्षित रखा गया है।
