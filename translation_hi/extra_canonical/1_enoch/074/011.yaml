base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/011.yaml
  text: And their excess for the sun and the stars comes to six days[a]; in five years, at six each, it amounts for them to thirty days[c][b], and the moon falls behind the sun and the stars by thirty days.
translation:
  language: hi
  text: और सूर्य तथा तारों के लिए अतिरिक्त अंतर छह दिन होता है; पाँच वर्षों में, हर वर्ष छह दिन के हिसाब से, यह तीस दिन हो जाता है[a]। इस प्रकार चाँद सूर्य और तारों से तीस दिन पीछे रह जाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल पाठ की गणना बहुत संक्षिप्त है। आशय यह प्रतीत होता है कि सूर्य और तारों के हिसाब में हर वर्ष छह अतिरिक्त दिन जुड़ते हैं, जो पाँच वर्षों में तीस दिन होते हैं।
    reason: cultural_note
  - marker: b
    text: यहाँ “चाँद” के लिए अनूदित गीइज़ शब्द का अर्थ “महीना” भी हो सकता है, विशेषकर पंचांग-संबंधी संदर्भ में।
    reason: lexical_alternative
lexical_decisions:
- source_word: ምብጻሒሆሙ
  choice: उनका बढ़ा हुआ भाग
  rationale: मूल धातु पहुँचने या पूरा होने का भाव देती है; यहाँ खगोलीय गणना में संदर्भ अतिरिक्त संचित दिनों का है, इसलिए यह प्रयोग अर्थ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ስሱ
  choice: छह
  rationale: यह गणना में प्रयुक्त मूल संख्या है।
- source_word: መዋዕለ
  choice: दिन
  rationale: बहुवचन शब्द यहाँ पंचांग-संबंधी दिनों की संख्या बताता है।
- source_word: በበስሱ
  choice: हर वर्ष छह दिन के अनुसार
  rationale: दोहरावयुक्त रूप का वितरणात्मक अर्थ है—पाँच वर्षों में प्रत्येक के लिए छह दिन। हिंदी में वर्ष को स्पष्ट करना गणितीय संबंध को सहज बनाता है।
- source_word: ይበጽሖሙ
  choice: यह कुल ... हो जाता है
  rationale: मूल में पहुँचने का भाव यहाँ निर्दिष्ट योग तक पहुँचने, अर्थात कुल होने, को दर्शाता है।
- source_word: የሐፀፁ
  choice: पीछे रह जाता है
  rationale: धातु का अर्थ कम पड़ना या पीछे रहना है; यह अनुवाद चाँद की गणना के तीस दिन कम होने का भाव रखता है।
- source_word: ወርኅ
  choice: चाँद
  rationale: इस शब्द का अर्थ चाँद या महीना दोनों हो सकता है; सूर्य और तारों के साथ तुलना होने के कारण मुख्य पाठ में चाँद अधिक संभावित है।
theological_decisions:
- issue: खगोलीय-पंचांगीय गणना की संक्षिप्त और कुछ कठिन वाक्यरचना
  choice: छह दिन प्रति वर्ष और पाँच वर्षों में तीस दिन का संबंध स्पष्ट रखते हुए मूल की गणनात्मक संरचना को बनाए रखा
  alternative: वाक्य को आधुनिक सौर और चंद्र वर्षों के अंतर की पूर्ण व्याख्या के रूप में प्रस्तुत करना
  rationale: अधिक व्याख्यात्मक रूप मूल पाठ की वास्तविक संक्षिप्तता और संभावित अस्पष्टता को मिटा देता; चुना हुआ पाठ साधारण पाठक के लिए गणना समझने योग्य बनाता है, पर उससे आगे कोई आधुनिक पंचांग-सिद्धांत आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सरल, गरिमापूर्ण और गणनात्मक है। तकनीकी अस्पष्टता को टिप्पणी में रखा गया है। मुख्य पाठ में 'चाँद' सामान्य पाठक के लिए 'चंद्रमा' से अधिक सहज है, फिर भी शैली अनौपचारिक नहीं है।
