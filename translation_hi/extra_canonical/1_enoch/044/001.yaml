base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/044/001.yaml
  text: 'And another thing I saw concerning the lightning: how some of the stars arise and become lightning[b][a], and they are not able to leave it.'
translation:
  language: hi
  text: 'और मैंने बिजली के विषय में एक और बात देखी: कैसे कुछ तारे उठते हैं और बिजली बन जाते हैं,[a] और वे उसे छोड़ नहीं सकते।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कैसे वे तारों में से उठते हैं और बिजली बन जाते हैं।” यहाँ मूल वाक्यांश को अंशवाचक (“कुछ तारे”) अथवा स्रोत/अलगाव सूचक (“तारों में से”) समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम वाक्यांश अनिश्चित है। इसका अर्थ “वे उसे छोड़ नहीं सकते” हो सकता है; “वे रुक नहीं सकते” या “वे अलग नहीं हो सकते” भी संभव है।
    reason: textual_uncertainty
lexical_decisions:
- source_word: ካልእተ
  choice: एक और बात
  rationale: यह एक नए दर्शनीय विषय का परिचय देता है और गीइज़ की पुनरारंभकारी शैली को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ርኢኩ
  choice: मैंने ... देखी
  rationale: प्रथम पुरुष में दर्शन के वर्णन का सीधा और आधुनिक हिन्दी रूप।
- source_word: በእንተ
  choice: के विषय में
  rationale: व्याख्यात्मक संबंध को बिना अतिरिक्त अर्थ जोड़े व्यक्त करता है।
- source_word: መብረቅ
  choice: बिजली
  rationale: इस प्रसंग में सामान्य अर्थ ‘बिजली’ है; पद में दोनों बार इसी बिंब को एकरूप रखा गया है।
- source_word: እፎ
  choice: कैसे
  rationale: जो देखा गया उसकी रीति या प्रक्रिया का परिचय देता है।
- source_word: ይቀውሙ
  choice: उठते हैं
  rationale: क्रिया के ‘खड़े होना/उठना’ अर्थों में से यहाँ गतिशील दृश्य के लिए ‘उठते हैं’ स्वाभाविक है; ‘अलग चमकना’ जैसा अर्थ नहीं थोपा गया।
- source_word: እምከዋክብተ
  choice: कुछ तारे
  rationale: እም को यहाँ अंशवाचक मानकर ‘तारों में से कुछ’ का संक्षिप्त, स्वाभाविक हिन्दी रूप दिया गया है।
- source_word: ወይከውኑ
  choice: और ... बन जाते हैं
  rationale: यह स्थिर अस्तित्व के बजाय परिवर्तन या परिणति व्यक्त करता है।
- source_word: ወኢይክሉ
  choice: और वे ... नहीं सकते
  rationale: मूल में व्यक्त असमर्थता को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ኃዲገ
  choice: उसे छोड़
  rationale: क्रिया का मूल अर्थ ‘छोड़ना/त्यागना’ है; ‘उसे’ का संदर्भ बिजली की अवस्था या रूप से है, यद्यपि अंतिम वाक्यांश संदिग्ध है।
theological_decisions:
- issue: तारों और बिजली के बिंब का स्वरूप
  choice: इसे दर्शनीय-ब्रह्मांडीय रूपांतरण के बिंब के रूप में रखा गया है; तारों को मुख्य पाठ में स्वर्गदूत या आत्माएँ नहीं कहा गया।
  alternative: तारों को स्वर्गदूतीय प्राणी मानना, अथवा कथन को केवल प्राकृतिक घटना का वर्णन मानना।
  rationale: इस पद में तारों की पहचान स्पष्ट नहीं की गई है। अतः अनुवाद रहस्योद्घाटनात्मक बिंब और उसकी व्याख्यात्मक खुलावट दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दर्शन-वर्णन के अनुकूल शैली अपनाई गई है। वाक्य की अपोकैलिप्टिक छवि को समझाकर सपाट नहीं किया गया, और मूल के अनिश्चित अंतिम वाक्यांश को पादटिप्पणी में खुला रखा गया है।
