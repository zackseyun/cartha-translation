base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/001.yaml
  text: And in those days[c][b][a], the prayer of the righteous and the blood of the righteous ascended from the earth before the Lord of Spirits.
translation:
  language: hi
  text: और उन दिनों धर्मियों की प्रार्थना और धर्मी का लहू[a] पृथ्वी से आत्माओं के प्रभु के सामने ऊपर उठा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से यहाँ ‘धर्मी का लहू’ है। समानांतर पद ‘धर्मियों की प्रार्थना’ के कारण इसका सामूहिक अर्थ ‘धर्मियों का लहू’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: መዋዕል
  choice: दिनों
  rationale: प्रकाशनात्मक समय-सूचक वाक्यांश በውእቱ መዋዕል के लिए ‘उन दिनों’ स्वाभाविक और परंपरागत हिन्दी है।
- source_word: ዐርገት
  choice: ऊपर उठा
  rationale: यह स्त्रीलिंग एकवचन पूर्ण रूप है और पहले कर्ता ‘प्रार्थना’ से मेल खाता है; इसलिए भूतकाल रखा गया है। संयुक्त कर्ता के साथ हिन्दी में पुल्लिंग एकवचन ‘उठा’ निकटतम कर्ता ‘लहू’ के अनुसार स्वाभाविक है।
- source_word: ጸሎተ ጻድቃን
  choice: धर्मियों की प्रार्थना
  rationale: बहुवचन ጻድቃን का सामूहिक अर्थ सुरक्षित रखते हुए सहज हिन्दी दी गई है।
- source_word: ደሙ ጻድቅ
  choice: धर्मी का लहू
  rationale: ጻድቅ रूपतः एकवचन है और ደሙ में प्रत्यय भी एकवचन की ओर संकेत करता है; मुख्य पाठ में इस वास्तविक व्याकरणिक तनाव को बहुवचन बनाकर नहीं मिटाया गया।
- source_word: እምነ ምድር
  choice: पृथ्वी से
  rationale: दृश्य का वैश्विक-प्रकाशनात्मक विस्तार ‘भूमि’ की अपेक्षा ‘पृथ्वी’ से बेहतर व्यक्त होता है।
- source_word: ቅድመ
  choice: के सामने
  rationale: यह ‘की उपस्थिति में/के सम्मुख’ का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: እግዚአ መናፍስት
  choice: आत्माओं के प्रभु
  rationale: हनोक साहित्य के इस विशिष्ट ईश्वरीय पदनाम को पारदर्शी और गरिमापूर्ण रूप में रखा गया है।
theological_decisions:
- issue: ‘लहू’ के बाद ጻድቅ को एकवचन माना जाए या सामूहिक अर्थ में बहुवचन
  choice: धर्मी का लहू
  alternative: धर्मियों का लहू
  rationale: स्रोत का रूप स्पष्टतः एकवचन है, जबकि पहले पद का समानांतर बहुवचन सामूहिक अर्थ की संभावना उत्पन्न करता है। मुख्य पाठ एकवचन सुरक्षित रखता है और पाद-टिप्पणी सामूहिक विकल्प बताती है, जिससे संभावित व्यक्तिगत या प्रतिनिधिक संकेत को दबाया नहीं जाता।
- issue: एक ही क्रिया का प्रार्थना और लहू दोनों से संबंध
  choice: दोनों को संयुक्त कर्ता बनाकर एक बार ‘ऊपर उठा’
  alternative: ‘प्रार्थना ऊपर उठी, और धर्मी का लहू...’ जैसी संकुचित संरचना
  rationale: गीज़ की VSO रचना में एक क्रिया के बाद संयुक्त कर्ता आता है। स्वाभाविक हिन्दी में दोनों संज्ञाओं को क्रिया से पहले रखना आशय को स्पष्ट करता है, बिना दूसरी क्रिया जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘धर्मी’ और ‘आत्माओं के प्रभु’ हनोक की प्रकाशनात्मक शब्दावली तथा धार्मिक गंभीरता को बनाए रखते हैं।
