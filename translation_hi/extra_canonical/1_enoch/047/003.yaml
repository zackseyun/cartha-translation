base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/003.yaml
  text: In those days I saw the Head of Days[a], as he sat on the throne of his glory, and the books of the living were opened before him; and all his host, which is in the heights of heaven[e][d][c][b], and his council stood before him.
translation:
  language: hi
  text: उन दिनों मैंने दिनों के प्रधान[a] को देखा। जब वह अपनी महिमा के सिंहासन पर बैठा था, तब जीवितों की पुस्तकें[b] उसके सामने खोली गईं; और उसकी सारी सेना, जो स्वर्ग की ऊँचाइयों में है, और उसकी सभा[c] उसके सामने खड़ी थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘दिनों का सिर’। इसे ‘अति प्राचीन’ भी समझा गया है, पर यहाँ गीइज़ की विशिष्ट उपाधि को निकटता से रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जीवन की पुस्तकें’। गीइज़ में ‘पुस्तकें’ बहुवचन है और अगला शब्द अधिक शाब्दिक रूप से ‘जीवितों की’ है।
    reason: lexical_alternative
  - marker: c
    text: मूल शब्द का आधारभूत अर्थ ‘घेरा’ या ‘चारों ओर का समूह’ हो सकता है; इस प्रसंग में ‘उसका दरबार’ या ‘उसकी परिषद्’ भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: उन दिनों
  rationale: यह प्रकाशन-साहित्य का स्वाभाविक कालसूचक सूत्र है और मूल के ‘दिनों’ को बनाए रखता है।
- source_word: ለርእሰ መዋዕል
  choice: दिनों के प्रधान
  rationale: यह गीइज़ पद के ‘सिर/प्रधान’ और ‘दिनों’ दोनों घटकों को निकटता से व्यक्त करता है तथा इसे दानिय्येल के परिचित पद ‘अति प्राचीन’ से अनावश्यक रूप से नहीं मिलाता।
- source_word: ሶበ ነበረ መንበረ ስብሐቲሁ
  choice: जब वह अपनी महिमा के सिंहासन पर बैठा था
  rationale: ነበረ सक्रिय क्रिया है और सिंहासन बैठने का स्थान है; इसलिए सिंहासन को निष्क्रिय रूप से ‘स्थापित किया गया’ कहना व्याकरणसम्मत नहीं होगा।
- source_word: መጻሕፍተ ሕያዋን
  choice: जीवितों की पुस्तकें
  rationale: मूल में ‘पुस्तकें’ बहुवचन और ‘जीवितों की’ संबंधसूचक पदबंध है; दोनों विशेषताएँ सुरक्षित रखी गई हैं।
- source_word: በቅድሜሁ ተከሥቱ
  choice: उसके सामने खोली गईं
  rationale: स्वर्गीय अभिलेखों के प्रसंग में ‘खोली गईं’ दृश्य को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ኵሉ ኃይሉ
  choice: उसकी सारी स्वर्गीय सेना
  rationale: यहाँ ኃይል को अमूर्त ‘सामर्थ्य’ के बजाय स्वर्गीय समूह के अर्थ में लेना सिंहासन-कक्ष के प्रसंग और आगे ‘खड़ी थी’ से मेल खाता है; ‘स्वर्गीय’ स्थानसूचक अगले उपवाक्य को सहज बनाता है।
- source_word: ዘመልዕልተ ሰማያት
  choice: जो स्वर्ग की ऊँचाइयों में है
  rationale: यह मूल की ऊर्ध्व स्थान-संबंधी छवि को बनाए रखता है और उसे केवल ‘सर्वोच्च स्वर्ग’ के रूप में सीमित नहीं करता।
- source_word: አውደ ዚአሁ
  choice: उसकी सभा
  rationale: पद का मूल बिंब घेरा या चारों ओर उपस्थित समूह है; ‘सभा’ सिंहासन के सामने उपस्थित स्वर्गीय समुदाय को स्वाभाविक हिन्दी में व्यक्त करती है, जबकि वैकल्पिक स्थानिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ይቀውሙ በቅድሜሁ
  choice: उसके सामने खड़ी थी
  rationale: यह दरबारी उपस्थिति की मुद्रा को बनाए रखता है। संयुक्त समूह को हिन्दी में एक समष्टि मानकर स्त्रीलिंग एकवचन क्रिया रखी गई है।
theological_decisions:
- issue: दैवी उपाधि ርእሰ መዋዕል का अनुवाद
  choice: दिनों के प्रधान
  alternative: अति प्राचीन; दिनों का सिर; दिनों का आदि
  rationale: मूल गीइज़ की विशिष्ट अभिव्यक्ति को बचाने और दानिय्येल की पारंपरिक उपाधि से चुपचाप सामंजस्य न बैठाने के लिए घटक-निकट रूप चुना गया है।
- issue: መጻሕፍተ ሕያዋን की संख्या और संबंध
  choice: जीवितों की पुस्तकें
  alternative: जीवन की पुस्तक; जीवन की पुस्तकें
  rationale: मूल में बहुवचन ‘पुस्तकें’ और ‘जीवितों’ का रूप स्पष्ट है; परिचित धार्मिक पद ‘जीवन की पुस्तक’ अपनाने से मूल की भिन्नता मिट जाती।
- issue: स्वर्गीय घेरे/समुदाय አውደ ዚአሁ की पहचान
  choice: उसकी सभा
  alternative: उसका दरबार; उसके चारों ओर का घेरा; उसकी परिषद्
  rationale: मूल का स्थानिक और सामुदायिक अर्थ खुला रखा गया है। ‘सभा’ किसी विशिष्ट प्रशासनिक परिषद् या नामित स्वर्गदूत-वर्ग का दावा नहीं करती।
