  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। वाक्य को पठनीयता के लिए दो भागों में बाँटा गया है। ‘दिनों के प्रधान’ जानबूझकर कुछ असामान्य रखा गया है, क्योंकि मूल उपाधि भी विशिष्ट है; पादटिप्पणी उसके अर्थ-विकल्प खोलती है।
