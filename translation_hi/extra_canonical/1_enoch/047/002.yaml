base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/002.yaml
  text: In those days the holy ones who dwell in the heights of heaven shall unite with one voice[a], and they shall plead and pray and praise and give thanks and bless the name of the Lord of Spirits, on account of the blood of the righteous that has been poured out, and that the prayer of the righteous may not be in vain before the Lord of Spirits, that judgment may be executed for them[d][c][b], and that patience may not be theirs forever.
translation:
  language: hi
  text: उन दिनों स्वर्ग की ऊँचाइयों में रहनेवाले पवित्र जन[a] एक स्वर होकर विनती और प्रार्थना करेंगे, स्तुति करेंगे, धन्यवाद देंगे और आत्माओं के प्रभु के नाम को धन्य कहेंगे—बहाए गए धर्मियों के रक्त के कारण—और यह कि धर्मियों की प्रार्थना आत्माओं के प्रभु के सामने व्यर्थ न जाए[b], उनके लिए न्याय किया जाए[c], और उन्हें सदा तक धीरज न धरना पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्र प्राणी’ अथवा ‘संत’। वे स्वर्ग की ऊँचाइयों में रहते हैं, इसलिए यह पद स्वर्गदूतों, स्वर्गीय धर्मियों या दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ गीज़ पाठ का क्रियारूप अनिश्चित है। प्रसंग में सम्भावित अर्थ यह है कि धर्मियों की प्रार्थना आत्माओं के प्रभु के सामने अनसुनी या निष्फल न रहे।
    reason: textual_variant
  - marker: c
    text: या ‘उन्हें न्याय मिले’। यहाँ प्रयुक्त संज्ञा न्यायिक निर्णय या धर्मियों के पक्ष में न्याय किए जाने—दोनों का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: የኃብሩ ... በ፩ቃል
  choice: एक स्वर होकर
  rationale: क्रिया के ‘एकत्र/एक होना’ और በ፩ቃል के ‘एक स्वर’—दोनों भावों को सहज हिन्दी में संयुक्त रूप से व्यक्त करता है।
- source_word: ቅዱሳን
  choice: पवित्र जन
  rationale: यह स्वर्गीय पवित्र प्राणियों के लिए व्यापक पद है; ‘स्वर्गदूत’ कहने से पहचान अनावश्यक रूप से निश्चित हो जाती और केवल ‘संत’ से बाद की कलीसियाई धारणा जुड़ सकती है।
- source_word: በመልዕልተ ሰማያት
  choice: स्वर्ग की ऊँचाइयों में
  rationale: मूल की ऊर्ध्व स्थान-संबंधी छवि को किसी निश्चित ब्रह्मांड-विन्यास में बदले बिना सुरक्षित रखता है।
- source_word: ያስተበቍዑ ወይጼልዩ
  choice: विनती और प्रार्थना करेंगे
  rationale: मूल में प्रयुक्त दो निकटार्थक क्रियाओं का क्रम और आग्रहपूर्ण भाव बनाए रखता है।
- source_word: ይሴብሑ ወየአኵቱ ወይባርኩ
  choice: स्तुति करेंगे, धन्यवाद देंगे और ... धन्य कहेंगे
  rationale: स्तुति, धन्यवाद और परमेश्वर के नाम को धन्य कहने की अलग-अलग उपासना-संबंधी क्रियाएँ बनाए रखी गई हैं।
- source_word: እግዚአ መናፍስት
  choice: आत्माओं के प्रभु
  rationale: 1 हनोक के इस खंड में बार-बार आनेवाली गंभीर ईश्वरीय उपाधि का निकट और स्वाभाविक हिन्दी रूप।
- source_word: ደመ ጻድቃን ዘተክዕወ
  choice: बहाए गए धर्मियों के रक्त
  rationale: मूल की रक्तपात और अन्याय की ठोस छवि को सुरक्षित रखता है।
- source_word: ኢትጸራዕ
  choice: व्यर्थ न जाए
  rationale: पाठ कठिन है; प्रसंग में आशय यह है कि धर्मियों की प्रार्थना निष्फल या अनसुनी न रहे। अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
- source_word: ኵነኔ
  choice: न्याय किया जाए
  rationale: यह रूप न्यायिक निर्णय तथा धर्मियों के पक्ष में न्याय के कार्यान्वयन—दोनों संभावनाओं को हिन्दी में खुला रखता है।
- source_word: ትዕግሥት ኢይኩን ሎሙ ለዓለም
  choice: उन्हें सदा तक धीरज न धरना पड़े
  rationale: शाब्दिक ‘धीरज उनका सदा के लिए न हो’ को स्वाभाविक हिन्दी में व्यक्त करते हुए अंतहीन प्रतीक्षा का भाव बनाए रखता है।
theological_decisions:
- issue: स्वर्ग में रहनेवाले ቅዱሳን की पहचान
  choice: पवित्र जन
  alternative: संत; स्वर्गदूत
  rationale: पाठ उन्हें स्वर्ग की ऊँचाइयों में रखता है, पर स्पष्टतः केवल स्वर्गदूत या केवल महिमाप्राप्त मनुष्य नहीं कहता; अतः व्यापक पहचान सुरक्षित रखी गई है।
- issue: धर्मियों की प्रार्थना से संबंधित कठिन क्रिया
  choice: व्यर्थ न जाए
  alternative: अनसुनी न रहे; निष्फल न हो; मौन न कर दी जाए
  rationale: प्रसंग न्याय और प्रतिशोध की प्रार्थना का है। चुना हुआ पाठ प्रार्थना के अप्रभावी न रहने का अर्थ देता है, जबकि पादटिप्पणी पाठगत अनिश्चितता बताती है।
- issue: ኵነኔ का न्यायिक आशय
  choice: न्याय किया जाए
  alternative: दण्डादेश दिया जाए; उन्हें न्याय मिले
  rationale: यह वाक्य धर्मियों के पक्ष में ईश्वरीय न्याय की माँग करता है। ‘न्याय किया जाए’ निर्णय और न्याय-कार्यान्वयन के बीच की अर्थगत व्यापकता बनाए रखता है।
- issue: लगातार ከመ उपवाक्यों का संबंध
  choice: तीन समानांतर अभिप्राय—प्रार्थना व्यर्थ न जाए, न्याय हो, और प्रतीक्षा अनंत न हो
  alternative: पहले उपवाक्य को विनती का कारण मानना
  rationale: गीज़ में ከመ के साथ आए संभावनार्थक/अधीन क्रियारूप यहाँ विनती की विषयवस्तु अथवा उद्देश्य बताते हैं; कारणार्थक अनुवाद समानांतर संरचना को धुंधला कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण अपोकैलिप्टिक शैली रखी गई है। ‘रहनेवाले’, ‘एक स्वर होकर’ और ‘धीरज न धरना पड़े’ सामान्य पाठकों के लिए स्वाभाविक हैं; साथ ही ‘आत्माओं के प्रभु’ जैसी विशिष्ट उपाधि और स्तुति-विनती की क्रमिक संरचना सुरक्षित है।
