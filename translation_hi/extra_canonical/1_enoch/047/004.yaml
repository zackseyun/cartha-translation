base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/004.yaml
  text: And the hearts of the holy ones shall be filled with joy[a], because the number of the righteous has drawn near, and the prayer of the righteous has been heard[c][b], and the blood of the righteous has been avenged before the Lord of Spirits.
translation:
  language: hi
  text: और पवित्र जनों के हृदय आनन्द से भर जाएँगे, क्योंकि धर्मियों की गिनती निकट आ पहुँची है[a], और धर्मियों की प्रार्थना सुनी गई है, और धर्मियों के लहू का हिसाब आत्माओं के प्रभु के सामने माँगा गया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धर्मियों का लेखा निकट आ पहुँचा है”; मूल शब्द का अर्थ संख्या या गिनती हो सकता है, पर यहाँ न्यायिक लेखे का भाव भी सम्भव है।
    reason: lexical_alternative
  - marker: b
    text: या, “धर्मियों के लहू का बदला लिया गया है।” अधिक शाब्दिक अर्थ है कि बहाए गए लहू के लिए हिसाब माँगा गया है; यह न्याय और जवाबदेही की माँग का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ልቦሙ ለቅዱሳን
  choice: पवित्र जनों के हृदय
  rationale: ‘हृदय’ भावना और विचार के भीतरी केंद्र की बाइबलीय छवि को बनाए रखता है; ‘पवित्र जन’ बाद की पारिभाषिक ध्वनियों से बचे रहते हुए समुदाय का स्वाभाविक हिन्दी रूप है।
- source_word: ትመልእ ፍሥሐ
  choice: आनन्द से भर जाएँगे
  rationale: भावी अवस्था और उल्लास—दोनों को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ቀርበ ኍልቈ ለጻድቅ
  choice: धर्मियों की गिनती निकट आ पहुँची है
  rationale: ኍልቈ का प्राथमिक अर्थ संख्या/गिनती है और ቀርበ आसन्नता दर्शाता है। ‘गिनती’ स्रोत की संभावित संख्यात्मक धारणा को बनाए रखती है, जबकि न्यायिक अर्थ को पादटिप्पणी में दर्ज किया गया है।
- source_word: ጸሎቶሙ ለጻድቃን ተሰምዐ
  choice: धर्मियों की प्रार्थना सुनी गई है
  rationale: स्रोत के एकवचन सामूहिक ‘प्रार्थना’ और बहुवचन समुदाय—दोनों को सुरक्षित रखता है।
- source_word: ደሙ ለጻድቅ
  choice: धर्मियों का लहू
  rationale: आसपास के सामूहिक संदर्भ के अनुरूप इसे धर्मी समुदाय का बहाया हुआ लहू समझा गया है; ‘लहू’ बलिदान और निर्दोष रक्तपात की बाइबलीय शैली को स्वाभाविक रूप से बनाए रखता है।
- source_word: ተፈቅደ
  choice: बदला लिया गया है
  rationale: इस पद में क्रिया बहाए गए लहू के लिए हिसाब माँगे जाने अथवा प्रतिशोधात्मक न्याय की ओर संकेत करती है। शाब्दिक ‘माँगा गया’ हिन्दी में अस्पष्ट होता; ‘बदला लिया गया’ संदर्भगत न्यायिक बल को स्पष्ट करता है।
- source_word: እግዚአ መናፍስት
  choice: आत्माओं के प्रभु
  rationale: हनोक ग्रन्थ की विशिष्ट ईश्वरीय उपाधि को उसके स्थापित और पारदर्शी रूप में सुरक्षित रखता है।
theological_decisions:
- issue: धर्मियों की गिनती के निकट आने का अर्थ
  choice: धर्मियों की निर्धारित संख्या या पूर्ण गिनती निकट आ पहुँची है।
  alternative: धर्मियों का लेखा अथवा न्याय निकट आ पहुँचा है।
  rationale: मूल संज्ञा सामान्यतः संख्या या गिनती बताती है, पर न्यायिक ‘लेखे’ की संभावना वास्तविक है; इसलिए मुख्य पाठ में प्राथमिक अर्थ और पादटिप्पणी में विकल्प रखा गया है।
- issue: धर्मियों के लहू के संबंध में ተፈቅደ का बल
  choice: धर्मियों के बहाए हुए लहू का प्रतिशोधात्मक न्याय किया गया है।
  alternative: धर्मियों के लहू का हिसाब माँगा गया है।
  rationale: क्रिया ‘खोजने/माँगने/आवश्यक ठहराने’ के अर्थक्षेत्र से आती है और बहाए गए लहू के संदर्भ में जवाबदेही तथा प्रतिशोध का मुहावरा बनती है। हिन्दी में ‘बदला लिया गया’ न्यायिक निष्कर्ष को स्वाभाविक बनाता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘पवित्र जन’, ‘धर्मी’, ‘लहू’ और ‘आत्माओं के प्रभु’ जैसे पद अपोकैलिप्टिक-बाइबलीय रंग बनाए रखते हैं। स्रोत की संख्यात्मक/न्यायिक और प्रतिशोधात्मक अस्पष्टताओं को मुख्य पाठ तथा पादटिप्पणियों के संयोजन से सुरक्षित रखा गया है।
