base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/010.yaml
  text: And all the hosts of the heavens shall cry out[a], and all the holy ones above, and the host of the Lord—the Keruben, the Seraphen, and the Ophannin—and all the angels of power, and all the angels of principalities, and the Chosen One[d][c][b], and the other powers that are on the dry land and over the water.
translation:
  language: hi
  text: और स्वर्गों की सारी सेनाएँ, ऊपर के सभी पवित्र जन, प्रभु की सेना—केरूबेन, सेराफेन और ओफान्नीन[b]—सामर्थ्य के सभी स्वर्गदूत, प्रधानताओं[c] के सभी स्वर्गदूत, चुना हुआ व्यक्ति[d], और सूखी भूमि पर तथा जल के ऊपर रहने वाली दूसरी शक्तियाँ—ये सब पुकार उठेंगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ऊँचे स्वर से पुकारेंगे’; गीइज़ क्रिया मुखर पुकार या चीत्कार का बोध कराती है।
    reason: lexical_alternative
  - marker: b
    text: ‘ओफान्नीन’ एक स्वर्गीय वर्ग का लिप्यंतरित नाम है; सिंहासन-दर्शन की प्रतीक-छवि के आधार पर कुछ लोग इसका अर्थ ‘पहिए’ बताते हैं।
    reason: lexical_alternative
  - marker: c
    text: ‘प्रधानताएँ’ शासकीय अधिकारों या पदों का सूचक है; इसका अनुवाद ‘अधिपतित्व’ भी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: ‘चुना हुआ व्यक्ति’ यहाँ एक उपाधि है; ‘निर्वाचित व्यक्ति’ भी संभव है। यह पाठ स्वयं उस व्यक्ति की पहचान को इससे अधिक स्पष्ट नहीं करता।
    reason: theological_ambiguity
lexical_decisions:
- source_word: ይጼውዑ
  choice: पुकार उठेंगे
  rationale: यह क्रिया मुखर पुकार या चीत्कार का बोध कराती है। ‘पुकार उठेंगे’ स्वाभाविक हिन्दी में उसकी तीव्रता रखता है और अगले पद में प्रयुक्त ‘आवाज़ उठाने’ की अलग अभिव्यक्ति से इसे नहीं मिलाता।
- source_word: ኵሉ ኃይለ ሰማያት
  choice: स्वर्गों की सारी सेनाएँ
  rationale: यहाँ ኃይል का अर्थ शक्ति, सेना या समुदाय हो सकता है; स्वर्गीय प्राणियों की सूची में ‘सेनाएँ’ सामूहिक अर्थ को सबसे अच्छी तरह व्यक्त करता है। बहुवचन ‘स्वर्गों’ मूल पाठ के बहुवचन को बनाए रखता है।
- source_word: ቅዱሳን በመልዕልተ
  choice: ऊपर के सभी पवित्र जन
  rationale: यह पद ऊर्ध्वलोक के पवित्र प्राणियों की ओर संकेत करता है। ‘पवित्र जन’ स्पष्ट है और किसी बाद की विशिष्ट स्वर्गदूतीय श्रेणी को आरोपित नहीं करता।
- source_word: ኃይለ እግዚአብሔር
  choice: प्रभु की सेना
  rationale: आसपास स्वर्गीय समुदायों की गणना होने के कारण इसे प्रभु की अमूर्त ‘सामर्थ्य’ के बजाय उनकी स्वर्गीय सेना के रूप में लिया गया है।
- source_word: ኪሩቤን / ሱራፌን / እፋኒን
  choice: केरूबेन, सेराफेन और ओफान्नीन
  rationale: इन स्वर्गीय वर्गों के नामों को गीइज़ रूपों के निकट लिप्यंतरित किया गया है, ताकि उन्हें बाद की अधिक परिचित नामावली या व्याख्यात्मक ‘पहिए’ में न बदला जाए।
- source_word: መላእክተ ኃይል
  choice: सामर्थ्य के सभी स्वर्गदूत
  rationale: औपचारिक संबंधसूचक रचना स्वर्गदूतों के एक व्यवस्थित वर्ग या पद का भाव बनाए रखती है।
- source_word: መላእክተ አጋእዝት
  choice: प्रधानताओं के सभी स्वर्गदूत
  rationale: मूल संज्ञा शासक अधिकारों या पदानुक्रमों का बोध कराती है। ‘प्रधानताएँ’ उस औपचारिक और कुछ हद तक रहस्यमय वर्गनाम को सुरक्षित रखता है।
- source_word: ኅሩይ
  choice: चुना हुआ जन
  rationale: हनोक के दृष्टान्तों में यह एक विशिष्ट अंतकालीन व्यक्ति की उपाधि के रूप में आता है। हिन्दी में ‘चुना हुआ जन’ उपाधिसूचक अर्थ रखता है, पर बाद की मसीही शब्दावली को मूल में नहीं जोड़ता।
- source_word: ካእአ ኃይል
  choice: दूसरी शक्तियाँ
  rationale: यह एक अतिरिक्त ब्रह्मांडीय समूह को सूचित करता है। ‘शक्तियाँ’ मूल शब्द की शक्ति/समुदाय संबंधी व्यापक और अस्पष्ट अर्थ-सीमा बनाए रखता है।
- source_word: እለ ውስተ የብስ ወዲበ ማይ
  choice: सूखी भूमि पर तथा जल के ऊपर रहने वाली
  rationale: የብስ विशेष रूप से जल के विपरीत सूखी भूमि को बताता है; इसलिए व्यापक ‘पृथ्वी’ के बजाय ‘सूखी भूमि’ रखा गया है।
theological_decisions:
- issue: क्या ኅሩይ को एक विशिष्ट अंतकालीन व्यक्ति की उपाधि माना जाए या सामान्य विशेषण
  choice: चुना हुआ जन
  alternative: एक चुना हुआ व्यक्ति / निर्वाचित जन
  rationale: इस रचना के दृष्टान्त-खंड में यह शब्द बार-बार न्याय और उद्धार से जुड़े विशिष्ट व्यक्तित्व की उपाधि के रूप में आता है। फिर भी अनुवाद उस व्यक्तित्व को किसी बाद की सिद्धान्तगत पहचान से स्पष्टतः नहीं जोड़ता।
- issue: स्वर्गीय वर्गों के नामों को परिचित धार्मिक रूपों में ढालना या गीइज़ साक्ष्य के निकट रखना
  choice: केरूबेन, सेराफेन और ओफान्नीन जैसे लिप्यंतरित नाम
  alternative: करूब, सराफ और पहिए
  rationale: लिप्यंतरण इस औपचारिक स्वर्गीय सूची की अपरिचित और रहस्योद्घाटनात्मक बनावट को बचाता है तथा ‘ओफान्नीन’ की व्याख्या को मुख्य पाठ में ‘पहिए’ कहकर निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल की लंबी सूची को हिन्दी में स्पष्ट करने के लिए अंत में ‘ये सब’ रखा गया है; इससे आरम्भिक गीइज़ क्रिया का संबंध सूची के सभी सदस्यों से स्पष्ट होता है। स्वर्गीय वर्गों के नाम अर्थानुवाद के बजाय देवनागरी में गीइज़-निकट लिप्यंतरित हैं।
