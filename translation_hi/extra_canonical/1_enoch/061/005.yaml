  text: And these measures shall reveal all the hidden things in the depth of the earth[a], and those who were destroyed in the wilderness, and those who were devoured by wild beasts, and those who were devoured by the fish of the sea, so that they may return and be supported on the day of the Chosen One; for none shall perish before the Lord of Spirits[d][c][b], and none can perish.
translation:
  language: hi
  text: और ये माप[a] पृथ्वी की गहराई में छिपी हुई सभी वस्तुओं को प्रकट करेंगे—उन लोगों को भी जो निर्जन प्रदेश में नष्ट हो गए, जिन्हें जंगली पशुओं ने खा लिया, और जिन्हें समुद्र की मछलियों ने खा लिया—ताकि वे लौट आएँ और चुने हुए के दिन सहारा पाएँ[b][c]; क्योंकि आत्माओं के प्रभु के सामने कोई नष्ट न होगा, और न कोई नष्ट हो सकता है।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ये माप’ पिछले पद में वर्णित मापों से जुड़ता है। वाक्य को कुछ लोग केवल ‘ये प्रकट करेंगे’ के रूप में भी समझते रहे हैं, पर उपलब्ध गीइज़ पाठ में ‘माप’ शब्द उपस्थित है।
    reason: textual_clarification
  - marker: b
    text: ‘सहारा पाएँ’ वाली क्रिया कठिन है; इसका अर्थ ‘संभाले जाएँ’, ‘स्थिर किए जाएँ’ या संभवतः ‘एकत्र किए जाएँ’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘चुना हुआ’ हनोक के दृष्टान्तों में न्याय और निर्दोष ठहराए जाने से जुड़े अन्तकालीन व्यक्तित्व की उपाधि है।
    reason: cross_reference
  - marker: d
    text: 'अंतिम वाक्य गीइज़ में संक्षिप्त और बलपूर्ण है: आत्माओं के प्रभु के सामने कोई नष्ट न होगा, और कोई नष्ट होने में समर्थ नहीं है।'
    reason: textual_clarification
lexical_decisions:
- source_word: እሉ፡ እምጣን
  choice: ये माप
  rationale: पाठ में संकेतवाचक के साथ እምጣን स्पष्ट रूप से उपस्थित है और पिछले पद के ‘मापों’ से संबंध बनाए रखता है। ‘माप’ असामान्य ब्रह्मांडीय बिंब को सरल करके मिटाता नहीं।
- source_word: ይከሥቱ
  choice: प्रकट करेंगे
  rationale: क्रिया छिपी हुई बातों को खोलने या उजागर करने का भाव देती है; भविष्यकाल दर्शन की क्रमिक घटनाओं के अनुकूल है।
- source_word: ኅቡኣተ፡ ለዕመቀ፡ ምድር
  choice: पृथ्वी की गहराई में छिपी हुई सभी वस्तुओं
  rationale: ‘छिपी हुई’ का व्याकरणिक रूप वस्तुओं अथवा जनों दोनों की ओर संकेत कर सकता है। मुख्य पाठ में अपेक्षाकृत औपचारिक ‘वस्तुओं’ को रखा गया है, जबकि आगे मृत लोगों की सूची उसका आशय स्पष्ट करती है।
- source_word: ተኃጕሉ፡ እምበድው
  choice: निर्जन प्रदेश में नष्ट हो गए
  rationale: በድው उजाड़, वन्य अथवा निर्जन स्थान का बोध कराता है। ‘निर्जन प्रदेश’ आधुनिक हिन्दी में स्वाभाविक है और केवल रेगिस्तान तक अर्थ सीमित नहीं करता।
- source_word: እምአራዊት
  choice: जंगली पशुओं ने
  rationale: यह पद वन्य पशुओं को सूचित करता है; सक्रिय हिन्दी वाक्य मूल के कर्मवाच्य अर्थ को स्पष्ट और सहज रूप देता है।
- source_word: እምዓሣ፡ ባሕር
  choice: समुद्र की मछलियों ने
  rationale: संचयी सूची और समुद्र में खोए मृतकों की ठोस छवि सुरक्षित रखी गई है।
- source_word: ከመ፡ ይግብኡ
  choice: ताकि वे लौट आएँ
  rationale: उद्देश्यसूचक रचना और वापसी/पुनर्स्थापन का भाव बनाए रखा गया है; इसे स्पष्ट रूप से ‘जी उठें’ कहकर व्याख्यात्मक निष्कर्ष नहीं जोड़ा गया।
- source_word: ይትመረጐዙ
  choice: संभाले जाएँ
  rationale: यह कठिन क्रिया सहारा दिए जाने, स्थिर रखे जाने या संभवतः एकत्र किए जाने का भाव दे सकती है। ‘संभाले जाएँ’ अस्पष्टता को यथासंभव बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: በዕለተ፡ ኅሩይ
  choice: चुने हुए के दिन
  rationale: एकवचन उपाधि का स्थानीय महत्त्व सुरक्षित है। ‘चुना हुआ’ सहज आधुनिक हिन्दी है और बाद की पारिभाषिक उपाधियाँ आरोपित नहीं करता।
- source_word: እግዚአ፡ መናፍስት
  choice: आत्माओं के प्रभु
  rationale: हनोक के दृष्टान्तों में आने वाली विशिष्ट उपाधि का सीधा और गरिमापूर्ण रूप रखा गया है।
- source_word: አልቦ፡ ዘይክል፡ ተኃጕሎተ
  choice: न कोई नष्ट हो सकता है
  rationale: मूल की सामर्थ्य-वाचक नकारात्मक समाप्ति और ‘नष्ट होने’ की पुनरावृत्ति सुरक्षित रखी गई है।
theological_decisions:
- issue: लौटने वालों की पहचान और पुनर्स्थापन का आशय
  choice: सूची में ऐसे मृत लोग समझे गए हैं जिनके शरीर पृथ्वी, निर्जन प्रदेश, पशुओं या समुद्र के कारण अप्राप्य हो गए, और जिनके लौटने की बात कही गई है।
  alternative: केवल छिपे हुए अवशेषों का न्याय के लिए प्रकट किया जाना; अथवा बचे हुए लोगों का एकत्र होना।
  rationale: अप्राप्य प्रकार से मरे लोगों की संचयी सूची, ‘लौट आएँ’ और आत्माओं के प्रभु के सामने किसी के नष्ट न होने का कथन पुनर्स्थापन/पुनरुत्थान की छवि को बल देता है। फिर भी मुख्य पाठ में ‘जी उठें’ नहीं जोड़ा गया, ताकि मूल की अभिव्यक्ति खुली रहे।
- issue: ‘चुने हुए’ की उपाधि
  choice: चुने हुए
  alternative: निर्वाचित जन; चुना हुआ व्यक्ति
  rationale: यह रूप एकवचन उपाधि की शक्ति बनाए रखता है, साधारण पाठक के लिए स्पष्ट है और किसी बाद की संप्रदायगत पहचान को पाठ में नहीं जोड़ता।
- issue: अंतिम नाश-असम्भवता का कथन
  choice: दोनों नकारात्मक वाक्यांशों को अलग और प्रबल रखा गया है।
  alternative: उन्हें मिलाकर ‘प्रभु के सामने कोई अंततः नष्ट नहीं हो सकता’ कहना।
  rationale: मूल की पुनरुक्ति और धार्मिक तनाव को बनाए रखना व्याख्यात्मक संक्षेप से अधिक उपयुक्त है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय और हल्का अपोकैलिप्टिक स्वर रखा गया है। ‘माप’, ‘चुना हुआ’ और ‘आत्माओं के प्रभु’ जैसे प्रमुख बिंब औपचारिक रूप से सुरक्षित हैं। लंबे गीइज़ वाक्य को डैश और अर्धविराम से व्यवस्थित किया गया है, पर उसकी संचयी सूची और पुनरुक्ति नहीं हटाई गई।
