base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/012.yaml
  text: All who do not sleep in the heights of heaven shall bless him[a]; all the holy ones who are in heaven shall bless him, and all the chosen ones who dwell in the garden of life; and every spirit of light that is able to bless and glorify and exalt and sanctify your blessed name[d][c][b]; and all flesh shall exceedingly and with power praise and bless your name forever and ever.
translation:
  language: hi
  text: स्वर्ग की ऊँचाइयों में जो नहीं सोते, वे उसे आशीष देंगे[a]; स्वर्ग में रहनेवाले सभी पवित्र जन उसे आशीष देंगे, और जीवन की वाटिका में वास करनेवाले सभी चुने हुए भी। प्रकाश की हर आत्मा, जो आपके धन्य नाम को आशीष देने, उसकी महिमा करने, उसे ऊँचा उठाने और पवित्र ठहराने में समर्थ है, ऐसा करेगी[b]; और समस्त देह अत्यन्त और सामर्थ्य के साथ आपके नाम की स्तुति करेगी और उसे युगानुयुग आशीष देगी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जो नहीं सोते” से सम्भवतः वे स्वर्गीय प्राणी अभिप्रेत हैं जो निरन्तर जागते हुए सेवा में उपस्थित रहते हैं; इसका संकेत केवल मानवीय सतर्कता की ओर नहीं है।
    reason: cultural_note
  - marker: b
    text: 'इस पद में सर्वनाम जानबूझकर एकरूप नहीं किए गए हैं: आरम्भ में “उसे” है, जबकि यहाँ “आपके धन्य नाम” कहा गया है। मूल गीइज़ पाठ में भी तीसरे पुरुष से दूसरे पुरुष की ओर यही परिवर्तन मिलता है।'
    reason: textual_note
  - marker: c
    text: “अत्यन्त और सामर्थ्य के साथ” वाला गीइज़ वाक्यांश पाठ और वाक्य-विन्यास की दृष्टि से कठिन है। यहाँ इसे आगे आनेवाली “स्तुति करेगी” और “आशीष देगी” क्रियाओं का विशेषक माना गया है; इसे “अत्यधिक सामर्थ्य से युक्त समस्त देह” भी समझा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ይባርክዎ / ትባርክ
  choice: उसे आशीष देंगे / आपके नाम को आशीष देंगे
  rationale: आशीष देना मूल की बार-बार आनेवाली उपासना-संबंधी क्रिया को सुरक्षित रखता है और उसे केवल ‘स्तुति करना’ में नहीं मिला देता। आरम्भ में तीसरे पुरुष ‘उसे’ और बाद में दूसरे पुरुष ‘आपके’ का परिवर्तन भी बनाए रखा गया है।
- source_word: እለ ኢይነውሙ
  choice: जो नहीं सोते
  rationale: यह स्वर्गीय प्राणियों के निरन्तर जागते रहने का सजीव चित्र सुरक्षित रखता है; ‘जो कभी नहीं सोते’ मूल से कुछ अधिक प्रबल होता।
- source_word: በመልዕልተ ሰማይ
  choice: स्वर्ग की ऊँचाइयों में
  rationale: स्थान-संबंधी बिंब को बनाए रखता है, पर इसे किसी निश्चित ब्रह्माण्डीय स्तर, जैसे ‘सर्वोच्च स्वर्ग’, के रूप में नहीं बाँधता।
- source_word: ቅዱሳን / ኅሩያን
  choice: पवित्र / चुने हुए
  rationale: दोनों समूहों को मूल के अनुसार अलग रखा गया है, पर यह तय नहीं किया गया कि वे स्वर्गदूत हैं, महिमान्वित मनुष्य हैं या दोनों प्रकार के प्राणी।
- source_word: ገነት ሕይወት
  choice: जीवन की वाटिका
  rationale: मूल के उद्यान-केंद्रित अदन-संबंधी बिंब को स्वाभाविक और गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: መንፈሰ ብርሃን
  choice: प्रकाश की आत्मा
  rationale: ब्रह्माण्डीय बिंब को सीधे रखता है और ‘ज्योतिर्मय प्राणी’ जैसे अधिक व्याख्यात्मक रूप से बचता है।
- source_word: ባርኮተ ወሰብሖተ ወአልዕሎተ ወቀድሶተ
  choice: आशीष देने, उसकी महिमा करने, उसे ऊँचा उठाने और पवित्र ठहराने
  rationale: मूल की चार क्रियाओं वाली स्तुतिपरक लय और उनके अर्थगत भेद सुरक्षित रखे गए हैं।
- source_word: ኵሉ ሥጋ
  choice: समस्त देहधारी
  rationale: ‘सब प्राणी’ की अपेक्षा यह मूल के ‘समस्त देह’ वाले बाइबिलीय भाव के अधिक निकट है, फिर भी आधुनिक हिन्दी में समझने योग्य है।
- source_word: ፈድፋደ እምኃይል
  choice: अत्यन्त और सामर्थ्य के साथ
  rationale: 'इन कठिन शब्दों को आगामी क्रियाओं के क्रियाविशेषणीय विशेषक माना गया है: स्तुति और आशीष अत्यधिक तथा सामर्थ्य के साथ की जाएँगी।'
- source_word: ለዓለመ ዓለም
  choice: युगानुयुग
  rationale: अनन्त काल की परम्परागत बाइबिलीय अभिव्यक्ति को संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘पवित्र’ और ‘चुने हुए’ की पहचान
  choice: दोनों पदों को स्वतंत्र समूह-संज्ञाओं के रूप में रखा गया है, बिना उनकी प्रकृति निश्चित किए।
  alternative: ‘पवित्र स्वर्गदूत’ और ‘चुने हुए धर्मी मनुष्य’
  rationale: दर्शनात्मक सूची स्वयं इन समूहों की सत्ता-संबंधी पहचान को स्पष्ट रूप से सीमित नहीं करती; अतः अनुवाद उस तनाव को खुला रखता है।
- issue: आरम्भ के तीसरे पुरुष और बाद के दूसरे पुरुष का परिवर्तन
  choice: ‘उसे’ से ‘आपके नाम’ की ओर मूल का पुरुष-परिवर्तन सुरक्षित रखा गया है।
  alternative: पूरे पद में केवल ‘आपको/आपके’ या केवल ‘उसे/उसके’ का प्रयोग
  rationale: एकरूपता के लिए सर्वनामों का सामंजस्य करना मूल पाठ के वास्तविक और सम्भवतः अर्थपूर्ण परिवर्तन को मिटा देता।
- issue: ገነት ሕይወት का बिंब
  choice: जीवन की वाटिका
  alternative: जीवन का स्वर्गलोक
  rationale: ‘वाटिका’ मूल के ठोस उद्यान-बिंब को बनाए रखती है और बाद की धार्मिक पारिभाषिकता अनावश्यक रूप से आरोपित नहीं करती।
