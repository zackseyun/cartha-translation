  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, उपासना-संबंधी शैली रखी गई है। ‘आशीष देना’, ‘युगानुयुग’ और ‘समस्त देहधारी’ बाइबिलीय गूँज बनाए रखते हैं, जबकि वाक्यरचना साधारण पाठकों के लिए स्पष्ट है। ‘पवित्र’ और ‘चुने हुए’ को संज्ञात्मक रूप में रखकर उनकी स्वर्गदूतीय या मानवीय पहचान अनिर्णीत छोड़ी गई है।
