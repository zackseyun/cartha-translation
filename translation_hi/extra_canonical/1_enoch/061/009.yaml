base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/009.yaml
  text: And when he lifts up his face to judge their hidden ways by the word of the name of the Lord of Spirits[a], and their conduct by the path of righteousness of the Lord of Spirits, then all of them will speak with one voice[d][c][b], and they will bless and praise and exalt and sanctify the name of the Lord of Spirits.
translation:
  language: hi
  text: और जब वह अपना मुख उठाएगा, ताकि आत्माओं के प्रभु के नाम के वचन के द्वारा[a] उनके छिपे हुए मार्गों का, और आत्माओं के प्रभु के धार्मिकता के मार्ग के अनुसार उनके पदचिह्नों का[b] न्याय करे, तब वे सब एक स्वर में बोलेंगे और आत्माओं के प्रभु के नाम को धन्य कहेंगे, उस नाम की स्तुति करेंगे, उस नाम को ऊँचा उठाएँगे और उसे पवित्र ठहराएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नाम के वचन’ वाला गीज़ पद कठिन है; इसका आशय आत्माओं के प्रभु के नाम से जुड़ी वाणी, आज्ञा या अधिकार हो सकता है।
    reason: alternative_reading
  - marker: b
    text: ‘पदचिह्नों’ से उनके कदमों, चाल या जीवन-चाल का संकेत है। यह पद न्याय की क्रिया का ‘छिपे हुए मार्गों’ के समानांतर कर्म है, न कि ‘वह उन्हें स्थापित करता है’ जैसी क्रिया।
    reason: textual_variant
lexical_decisions:
- source_word: ያሌዕል ገጾ
  choice: वह अपना मुख उठाएगा
  rationale: स्रोत की शारीरिक और अधिकारपूर्ण छवि को स्वाभाविक हिन्दी में बनाए रखता है; इसे केवल ‘वह प्रकट होगा’ जैसे सामान्य कथन में नहीं बदलता।
- source_word: ይኰንን
  choice: न्याय करे
  rationale: यहाँ छिपे मार्गों और आचरण के मूल्यांकन का न्यायिक भाव प्रमुख है; ‘दोषी ठहराए’ कहना अनावश्यक रूप से परिणाम निश्चित कर देता।
- source_word: ፍኖቶሙ እንተ ኅቡእ
  choice: उनके छिपे हुए मार्गों
  rationale: ‘मार्ग’ जीवन-चाल के नैतिक रूपक को सुरक्षित रखता है और ‘छिपे हुए’ उसके गुप्त या अप्रकट होने का भाव देता है।
- source_word: በነገረ ስሙ
  choice: नाम के वचन के द्वारा
  rationale: गीज़ की कठिन पद-रचना को पारदर्शी ढंग से रखता है और दिव्य नाम से जुड़ी वाणी या अधिकार को किसी एक संकीर्ण अर्थ में सीमित नहीं करता।
- source_word: ወአሰረ ዚአሆሙ
  choice: और उनके पदचिह्नों का
  rationale: यह पद क्रिया ‘वह उन्हें स्थापित करता है’ नहीं, बल्कि समानांतर कर्म के रूप में ‘उनके कदम/पदचिह्न’ है। ‘पदचिह्न’ मूल चित्र को बचाता है और जीवन-चाल का संकेत भी देता है।
- source_word: በፍኖተ ጽድቅ
  choice: धार्मिकता के मार्ग के अनुसार
  rationale: ‘धार्मिकता का मार्ग’ मूल नैतिक-यात्रा रूपक को बनाए रखता है; ‘के अनुसार’ इस वाक्य में न्याय के मानदंड का स्वाभाविक हिन्दी भाव देता है।
- source_word: በ፩ቃል
  choice: एक स्वर में
  rationale: शाब्दिक ‘एक वचन में’ की अपेक्षा यह एकमत सामूहिक उद्घोष का स्वाभाविक हिन्दी मुहावरा है।
- source_word: ይባርኩ ወይሴብሑ ወያሌዕሉ ወይቄድሱ
  choice: धन्य कहेंगे, उसकी स्तुति करेंगे, उसे ऊँचा उठाएँगे और पवित्र ठहराएँगे
  rationale: स्तुति की चारों क्रियाओं को बिना संक्षेप किए सुरक्षित रखा गया है; हिन्दी में प्रत्येक क्रिया का कर्म स्पष्ट किया गया है।
- source_word: እግዚአ መናፍስት
  choice: आत्माओं के प्रभु
  rationale: 1 हनोक की विशिष्ट ईश्वरीय उपाधि को सुसंगत और स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: एकवचन क्रियाओं ‘वह अपना मुख उठाएगा’ और ‘न्याय करे’ का कर्ता
  choice: मुख्य पाठ में केवल ‘वह’ रखा गया है और उसकी पहचान नहीं की गई।
  alternative: उसे आत्माओं का प्रभु अथवा चुना हुआ/मनुष्य-पुत्र स्पष्ट रूप से कहना।
  rationale: इस पद में कर्ता का नाम फिर से नहीं दिया गया; संदर्भगत पहचान संभव होने पर भी अनुवाद को उसे सिद्धान्ततः निश्चित नहीं करना चाहिए।
- issue: ‘आत्माओं के प्रभु के नाम के वचन’ का अर्थ
  choice: इसे दिव्य नाम से संबद्ध साधनात्मक पद के रूप में पारदर्शी ढंग से रखा गया है।
  alternative: ‘दिव्य नाम में दी गई आज्ञा’ या ‘दिव्य नाम के विषय में प्रकाशना’ कहना।
  rationale: गीज़ पद-विन्यास कठिन है और वचन, आदेश या नामाधारित अधिकार की ओर संकेत कर सकता है; किसी एक अर्थ को मुख्य पाठ में निर्णायक बनाना उचित नहीं।
- issue: ወአሰረ ዚአሆሙ की व्याकरणिक पहचान
  choice: इसे ‘उनके पदचिह्नों’ नाम-पद के रूप में, न्याय की क्रिया के समानांतर कर्म के रूप में लिया गया है।
  alternative: ‘और वह उन्हें धार्मिकता के मार्ग पर स्थापित करता है।’
  rationale: रूप አሰረ को यहाँ संज्ञा ‘कदम/चिह्न’ और ዚአሆሙ को उसका संबंधसूचक सर्वनाम मानना व्याकरण तथा समानांतर संरचना से बेहतर मेल खाता है।
