  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध स्तर रखा गया है। स्तुतिपरक चार-क्रियात्मक क्रम और ‘मुख उठाने,’ ‘मार्ग,’ तथा ‘पदचिह्न’ की मूल काव्यात्मक छवियाँ सुरक्षित हैं।
