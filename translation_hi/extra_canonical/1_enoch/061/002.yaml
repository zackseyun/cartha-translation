base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/002.yaml
  text: And I asked the angel[a], saying, “Why have they taken these cords and gone?” And he said to me[c][b], “They have gone so that they may measure.”
translation:
  language: hi
  text: और मैंने उस स्वर्गदूत से पूछा, “वे इन रस्सियों को लेकर क्यों चले गए?” उसने मुझसे कहा, “वे मापने के लिए गए हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተስአልክዎ
  choice: मैंने ... से पूछा
  rationale: प्रथम पुरुष के कथात्मक पूर्ण रूप और प्रत्यक्ष प्रश्न को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: መላእክ
  choice: उस स्वर्गदूत
  rationale: दर्शन में पहले से उपस्थित एकवचन स्वर्गीय संवाद-सहचर को निश्चित रूप में दर्शाता है।
- source_word: ነሡ
  choice: लेकर
  rationale: यह ነሥአ ‘लेना/उठाना’ का रूप है, न कि ‘उठ खड़े होना’; अगले गति-क्रिया पद के साथ हिन्दी में ‘लेकर ... चले गए’ स्वाभाविक है।
- source_word: እሎንቱ አኅበለ
  choice: इन रस्सियों को
  rationale: यह पिछले पद की लंबी रस्सियों की ओर संकेत करता है; इसे लोगों के ‘समूह’ समझना प्रसंग और गीइज़ रूप, दोनों के विपरीत होगा।
- source_word: ሖሩ
  choice: चले गए / गए हैं
  rationale: मूल में गति-सूचक क्रिया की पुनरावृत्ति है; हिन्दी संवाद में दोनों स्थानों पर उसका अर्थ बनाए रखा गया है।
- source_word: ከመ ይመጥኑ
  choice: इसलिए ... कि माप लें
  rationale: क्रिया सक्रिय बहुवचन है—‘वे मापें’; उद्देश्यवाचक रचना और मापने की ठोस छवि सुरक्षित रहती है।
theological_decisions:
- issue: अंतिम उद्देश्यवाचक उपवाक्य में मापने का कर्ता और आशय
  choice: कि माप लें
  alternative: कि बाँट दें / कि परिमाण निर्धारित करें
  rationale: गीइज़ क्रिया सक्रिय बहुवचन है, इसलिए रस्सियाँ लेने वाले ही मापने के कर्ता हैं। ‘माप लें’ यह नहीं बताता कि वे किसे या क्या मापेंगे, अतः पद की वास्तविक अस्पष्टता और प्रलयदर्शी तनाव बना रहता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘स्वर्गदूत’ सामान्य पाठक के लिए ‘दूत’ से अधिक स्पष्ट है। मूल के ‘कहते हुए’ को अलग से न दोहराकर प्रत्यक्ष प्रश्न में समाहित किया गया है, जिससे हिन्दी स्वाभाविक रहती है और कोई अर्थ नहीं छूटता।
