base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/003.yaml
  text: And the angel who went with me said to me[a], “These are the measures of the righteous and the cords of the righteous; they will come to the righteous[d][c][b], so that they may rely on the name of the Lord of Spirits forever and ever.”
translation:
  language: hi
  text: मेरे साथ चलने वाले स्वर्गदूत ने मुझसे कहा, “ये धर्मियों के माप और धर्मियों की रस्सियाँ हैं; ये धर्मियों के पास आएँगे[a], ताकि धर्मी युगानुयुग आत्माओं के प्रभु के नाम पर निर्भर रहें[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ये धर्मियों के पास आते हैं।” मूल क्रियारूप वर्तमान या भविष्य—दोनों भाव दे सकता है।
    reason: tense_aspect_ambiguity
  - marker: b
    text: या, “उस नाम पर टेक लगाएँ,” “उससे सहारा पाएँ,” अथवा “उस नाम पर भरोसा रखें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ዘምስሌየ የሐውር
  choice: जो ... मेरे साथ चल रहा था
  rationale: चलने/जाने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है और मार्गदर्शक स्वर्गदूत की छवि बनाए रखता है।
- source_word: እምጣነ ጻድቃን
  choice: धर्मियों के माप
  rationale: እምጣነ को ‘से/में से’ और किसी अन्य संज्ञा का संयोग मानने के बजाय ‘माप’ के बहुवचन संबंध-रूप के रूप में लिया गया है; यह निकटवर्ती प्रसंग की मापने वाली वस्तुओं से मेल खाता है।
- source_word: ማእሰረ ጻድቃን
  choice: धर्मियों की रस्सियाँ
  rationale: संज्ञा का अर्थ रस्सी, डोरी या बंधन है। प्रसंग में मापने की रस्सियों का संकेत होने के कारण ‘रस्सियाँ’ चुना गया है, न कि ‘भंडार’।
- source_word: ይመጽኡ ለጻድቃን
  choice: ये धर्मियों के पास आएँगे
  rationale: अपूर्ण/वर्तमान-भविष्य क्रियारूप और दत्तिवाचक दिशा को बनाए रखता है; इसे पूर्ण भूतकाल ‘आ चुके हैं’ नहीं बनाया गया।
- source_word: ከመ ይትመረጐዙ
  choice: ताकि वे ... आश्रित रहें
  rationale: क्रिया में टेक लेने, सहारा पाने या भरोसा रखने का अर्थक्षेत्र है। ‘आश्रित रहें’ निर्भरता और स्थिर सहारे दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ስሙ ለእግዚአ መናፍስት
  choice: आत्माओं के प्रभु के नाम
  rationale: हनोक की इस विशिष्ट उपाधि को संज्ञा-सम्बन्ध सहित अक्षुण्ण रखा गया है।
- source_word: ለዓለመ ዓለም
  choice: युगानुयुग
  rationale: स्थायी अनंतता की गंभीर सूत्रात्मक अभिव्यक्ति को संक्षिप्त और प्रतिष्ठित आधुनिक हिन्दी में रखता है।
theological_decisions:
- issue: मापों और रस्सियों का धर्मियों के पास आना
  choice: इन वस्तुओं को धर्मियों से संबद्ध और उनकी ओर आने वाली वास्तविकताओं के रूप में रखा गया है।
  alternative: इन्हें धर्मियों से निकलने वाले आध्यात्मिक भंडार या प्रचुरता के रूप में समझना।
  rationale: गीज़ संज्ञाओं की आकृति और अध्याय के निकटवर्ती मापने की रस्सियों वाले प्रसंग के कारण ‘माप’ और ‘रस्सियाँ’ अधिक मजबूत पाठ-साक्ष्य रखते हैं।
- issue: प्रभु के नाम के प्रति धर्मियों का संबंध
  choice: ‘नाम पर आश्रित रहें’
  alternative: ‘नाम पर टेक लगाएँ’, ‘नाम से सहारा पाएँ’ या ‘नाम पर भरोसा रखें’।
  rationale: मूल क्रिया सहारे, टेक और भरोसे के बीच अर्थगत तनाव रखती है; मुख्य पाठ किसी एक संकीर्ण धार्मिक सूत्र में इसे सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर दर्शन-साहित्य के अनुरूप गरिमापूर्ण रखी गई है। ‘माप’ और ‘रस्सियाँ’ को ठोस दृश्यात्मक शब्दों के रूप में बनाए रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
