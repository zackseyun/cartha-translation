base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/004.yaml
  text: And the chosen ones shall dwell with the chosen ones[a], and these are the measures that shall be given for faith[d][c][b], and they shall strengthen righteousness.
translation:
  language: hi
  text: और चुने हुए लोग चुने हुओं के साथ निवास करना आरम्भ करेंगे[a]; और ये माप हैं जो विश्वास[c] के लिए दिए जाएँगे, और ये माप धार्मिकता को सुदृढ़ करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “आरम्भ करेंगे और चुने हुओं के साथ निवास करेंगे।”'
    reason: lexical_alternative
  - marker: c
    text: या “विश्वस्तता,” “निष्ठा” अथवा “दृढ़ता” के लिए।
    reason: theological_ambiguity
lexical_decisions:
- source_word: ይዌጥኑ፡ ወየሐድሩ
  choice: निवास करने लगेंगे
  rationale: पहला क्रियापद ይዌጥኑ आरम्भ करने का और दूसरा የሐድሩ निवास करने का भाव देता है। हिन्दी में संयुक्त रूप ‘निवास करने लगेंगे’ दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ኅሩያን
  choice: चुने हुए लोग / चुने हुए
  rationale: यह सर्वनामी विशेषण अपोकैलिप्टिक समुदाय के लिए प्रयुक्त है। आधुनिक हिन्दी में ‘चुने हुए लोग’ स्पष्ट है; पुनरावृत्ति में ‘चुने हुओं’ स्वाभाविक है।
- source_word: እሉ
  choice: ये
  rationale: समीपवाची बहुवचन संकेतवाचक का सीधा अनुवाद ‘ये’ है; इसे ‘वे’ नहीं किया गया।
- source_word: እምጣናት
  choice: माप
  rationale: शब्द में नापी हुई मात्राओं, निर्धारित अंशों या मानकों का भाव हो सकता है। ‘माप’ मूल बिंब और अर्थगत अनिश्चितता दोनों बचाता है।
- source_word: ይትወሀቡ
  choice: दिए जाएँगे
  rationale: मूल के कर्मवाच्य और भविष्याभिमुख कथन को सीधा रखा गया है।
- source_word: ለሃይማኖት
  choice: विश्वास के लिए
  rationale: शब्द विश्वास, विश्वस्तता या निष्ठा का अर्थ दे सकता है। मुख्य पाठ में सामान्य और सीधा ‘विश्वास’ रखा गया है तथा विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: ያፀንዕዋ
  choice: दृढ़ करेंगे
  rationale: क्रिया किसी वस्तु को मजबूत, स्थिर या स्थापित करने का भाव देती है। ‘दृढ़ करेंगे’ हिन्दी में सक्रिय अर्थ को संक्षेप में बनाए रखता है।
- source_word: ለጽድቅ
  choice: धार्मिकता
  rationale: यह नैतिक सहीपन और न्यायपूर्ण आचरण के व्यापक भाव को रखता है; केवल ‘न्याय’ कहना अर्थ को संकुचित कर सकता है।
theological_decisions:
- issue: ሃይማኖት का अर्थ
  choice: विश्वास
  alternative: विश्वस्तता, निष्ठा या दृढ़ता
  rationale: शब्दार्थ व्यापक है और प्रसंग चुने हुओं की स्थिर निष्ठा की ओर भी संकेत कर सकता है। इसलिए मुख्य पाठ में एक अर्थ चुना गया है, पर वैकल्पिक धर्मवैचारिक संभावना को पादटिप्पणी में खुला रखा गया है।
- issue: आरम्भिक दो क्रियाओं का संबंध
  choice: निवास करने लगेंगे
  alternative: आरम्भ करेंगे और निवास करेंगे
  rationale: यह रूप ይዌጥኑ को छोड़े बिना दोनों क्रियाओं को स्वाभाविक हिन्दी में जोड़ता है। अधिक पृथक शब्दशः रूप पादटिप्पणी में सुरक्षित है।
- issue: ‘माप’ का अभिप्राय
  choice: माप
  alternative: निर्धारित अंश या मानक
  rationale: यह स्पष्ट नहीं है कि कथन परिमाण, आवंटन या आदर्श मानदंड की बात करता है। मुख्य पाठ इस तनाव को हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। ‘चुने हुए’ और ‘धार्मिकता’ जैसे प्रमुख अपोकैलिप्टिक-नैतिक पदों को स्थिर रखा गया है। आरम्भिक क्रियायुग्म को न तो छोड़ा गया है, न अस्वाभाविक रूप से दोहराया गया है; जहाँ मूल अर्थ अनिश्चित है वहाँ पादटिप्पणियाँ दी गई हैं।
