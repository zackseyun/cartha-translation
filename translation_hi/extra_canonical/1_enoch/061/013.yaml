base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/013.yaml
  text: For abundant is the mercy of the Lord of Spirits[a], and he is slow to anger[c][b]; and all his works and all the measure of what he has made he has revealed to the righteous and the chosen in the name of the Lord of Spirits.
translation:
  language: hi
  text: क्योंकि आत्माओं के प्रभु की दया प्रचुर है, और वह क्रोध करने में धीमा है[a]; उसने अपने सभी कार्य और अपने बनाए हुए का सारा परिमाण धर्मियों और चुने हुओं को आत्माओं के प्रभु के नाम में[c] प्रकट कर दिया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उसका क्रोध दूर है।” गीइज़ अभिव्यक्ति का यह अधिक शाब्दिक अनुवाद है; मुहावरे के रूप में इसका अर्थ “क्रोध करने में धीमा” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह गीइज़ पदबंध कठिन है। इसका अनुवाद “और उसने जो किया या बनाया है उसकी हर माप” भी हो सकता है; आशय परमेश्वर के कार्यों के निर्धारित माप, व्यवस्थित विस्तार या परिमाण से हो सकता है।
    reason: textual_uncertainty
  - marker: c
    text: “आत्माओं के प्रभु के नाम में” उस अधिकार, क्षेत्र या आह्वान को व्यक्त कर सकता है जिसके अंतर्गत यह प्रकटीकरण हुआ।
    reason: lexical_alternative
lexical_decisions:
- source_word: ብዙኅ ምሕረቱ
  choice: उसकी दया बहुत अधिक है
  rationale: यह दैवी करुणा और क्षमाशीलता की प्रचुरता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ለእግዚአ መናፍስት
  choice: आत्माओं के प्रभु
  rationale: यह 1 हनोक में प्रयुक्त विशिष्ट दैवी उपाधि को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: ወርሑቅ መዓት
  choice: और वह क्रोध करने में धीमा है
  rationale: शाब्दिक रूप से क्रोध के दूर होने का भाव रखने वाला यह पदसमूह बाइबलीय मुहावरे में परमेश्वर के क्रोध करने में धीरज रखने को व्यक्त करता है; अधिक शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ወኵሉ ግብሩ
  choice: अपने सभी कार्य
  rationale: ‘कार्य’ सृष्टि और दैवी क्रियाकलाप दोनों को समेट सकता है तथा ‘कामों’ की अपेक्षा इस प्रसंग में अधिक गरिमापूर्ण है।
- source_word: ወኵሉ እምጣነ ገብረ
  choice: जो कुछ उसने बनाया है उसका पूरा परिमाण
  rationale: कठिन गीइज़ पदबंध में माप, विस्तार या व्यवस्थित अनुपात का भाव संभव है; ‘परिमाण’ इस अस्पष्टता को अति-व्याख्या किए बिना बनाए रखता है।
- source_word: ከሠተ
  choice: प्रकट कर दिया है
  rationale: यह दर्शन-साहित्य में छिपी हुई बातों को ज्ञात कराने के अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ለጻድቃን ወለኅሩያን
  choice: धर्मियों और चुने हुओं के सामने
  rationale: दोनों समूह-संज्ञाओं को अलग रखते हुए प्रकटीकरण के प्राप्तकर्ताओं को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: በስሙ
  choice: के नाम में
  rationale: ‘नाम में’ मूल की औपचारिक अभिव्यक्ति और उसके अधिकार, क्षेत्र अथवा आह्वान संबंधी संभावित अर्थों को खुला रखता है।
theological_decisions:
- issue: क्रोध से संबंधित पदबंध का अर्थ
  choice: वह क्रोध करने में धीमा है
  alternative: उसका क्रोध दूर है
  rationale: दया की बहुतायत के साथ आया यह पदबंध प्रचलित बाइबलीय मुहावरे के अनुरूप परमेश्वर के धीरज को बताता है, पर अधिक शाब्दिक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: बनाई हुई वस्तुओं के ‘परिमाण’ का आशय
  choice: कठिन और कुछ रहस्यमय पदबंध को अपेक्षाकृत औपचारिक रूप में बनाए रखना
  alternative: उसकी सभी नियुक्त व्यवस्थाएँ; उसके प्राणियों की पूरी संख्या
  rationale: गीइज़ पाठ निश्चित रूप से नहीं बताता कि आशय विस्तार, संख्या, माप या व्यवस्थित क्रम से है; इसलिए किसी एक धर्मवैज्ञानिक अर्थ को आरोपित नहीं किया गया।
- issue: ‘नाम में’ का संबंध
  choice: वाक्य में इसे प्रकटीकरण के ढंग या अधिकार से जुड़ा रहने देना
  alternative: इसे केवल आह्वान या केवल दैवी अधिकार के अर्थ में स्पष्ट करना
  rationale: मूल वाक्यांश अधिकार, क्षेत्र या आह्वान का भाव दे सकता है; अनुवाद इस वास्तविक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘आत्माओं के प्रभु’ जैसी हनोकीय उपाधि और ‘नाम में’ जैसी औपचारिक अभिव्यक्ति को जानबूझकर सुरक्षित रखा गया है। कठिन ‘परिमाण’ पदबंध को सरल व्याख्या में बदलने के बजाय पादटिप्पणी सहित पारदर्शी रूप में प्रस्तुत किया गया है।
