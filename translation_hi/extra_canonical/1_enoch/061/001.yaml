base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/001.yaml
  text: And I saw in those days that long cords were given to those angels[a], and they took for themselves wings and flew[b], and they went toward the north.
translation:
  language: hi
  text: और मैंने उन दिनों देखा कि उन स्वर्गदूतों को लंबी रस्सियाँ[a] दी गईं; उन्होंने अपने लिए पंख लिए, उड़ गए और उत्तर दिशा की ओर गए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल गीइज़ पद का अर्थ “लंबी डोरियाँ” भी हो सकता है, और संभवतः “नापने की डोरियाँ”।
    reason: lexical_alternative
  - marker: b
    text: “उन स्वर्गदूतों” का अनुवाद “दूसरे स्वर्गदूतों” भी किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ወርኢኩ
  choice: और मैंने ... देखा
  rationale: प्रथम पुरुष के दर्शनीय-वृत्तांत की सीधी और स्वाभाविक अभिव्यक्ति; मूल के साक्षी-सूत्र को बनाए रखती है।
- source_word: በእማንቱ መዋዕል
  choice: उन दिनों
  rationale: सर्वनाश-साहित्य में प्रचलित काल-सूत्र का गरिमापूर्ण और सहज हिन्दी रूप।
- source_word: ተውህበ
  choice: दी गईं
  rationale: मूल का कर्मवाच्य सुरक्षित है और बहुवचन वस्तु ‘रस्सियाँ’ के अनुसार हिन्दी में स्वाभाविक सामंजस्य रखता है।
- source_word: ለአልእቱ መላእክት
  choice: उन स्वर्गदूतों को
  rationale: इस संदर्भ में መላእክት का अर्थ ‘स्वर्गदूत’ है; संकेतवाचक पद को बिना अतिरिक्त पहचान जोड़े ‘उन’ कहा गया है।
- source_word: አሕባል ነዋኃን
  choice: लंबी रस्सियाँ
  rationale: ठोस वस्तु और उसकी लंबाई दोनों स्पष्ट रहते हैं; ‘नापने की डोरियाँ’ कहकर संभावित कार्य को मुख्य पाठ में निश्चित नहीं किया गया।
- source_word: ወነሡአ ሎሙ ክንፈ
  choice: उन्होंने अपने लिए पंख लिए
  rationale: ሎሙ की आत्मवाचक छाया ‘अपने लिए’ द्वारा सुरक्षित रखी गई है।
- source_word: ወሰረሩ
  choice: और उड़ चले
  rationale: पंख लेने के बाद की गति को सहज हिन्दी में व्यक्त करता है और साधारण ‘उड़े’ की अपेक्षा आगे प्रस्थान का भाव भी देता है।
- source_word: ወሖሩ ሰመንገለ መስዕ
  choice: और उत्तर दिशा की ओर गए
  rationale: दिशात्मक गति को स्पष्ट रखता है, बिना यह निश्चित किए कि उत्तर ही अंतिम गंतव्य था।
theological_decisions:
- issue: स्वर्गदूतों की पहचान
  choice: मुख्य पाठ में केवल ‘उन स्वर्गदूतों’ कहा गया है।
  alternative: ‘दूसरे स्वर्गदूतों’ अथवा न्याय करने वाले किसी विशेष वर्ग के स्वर्गदूतों के रूप में पहचानना।
  rationale: यह पद स्वयं उनके वर्ग या कार्य को स्पष्ट नहीं करता; इसलिए आसपास की व्याख्या से कोई विशिष्ट पहचान आरोपित नहीं की गई।
- issue: रस्सियों का प्रयोजन
  choice: मुख्य पाठ में ‘लंबी रस्सियाँ’ रखा गया है।
  alternative: ‘नापने की लंबी डोरियाँ’।
  rationale: मूल पद लंबी रस्सियों या डोरियों को दर्शाता है, पर इस पद में उनका मापने के लिए होना स्पष्ट नहीं; संभावित अर्थ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण दर्शनीय-वृत्तांत। वाक्य में मूल की क्रमिक ‘और’ संरचना पर्याप्त रूप से रखी गई है। ‘रस्सियाँ’ सामान्य पाठक के लिए ठोस और स्पष्ट है; वैकल्पिक ‘डोरियाँ’ तथा मापन-संबंधी अर्थ पादटिप्पणी में सुरक्षित हैं।
