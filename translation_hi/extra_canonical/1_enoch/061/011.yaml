base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/011.yaml
  text: On that day they shall raise one voice[a], and they shall bless and praise and exalt in the spirit of faith, and in the spirit of wisdom, and in the spirit of patience, and in the spirit of mercy, and in the spirit of righteousness and peace, and in the spirit of goodness; and all of them shall say with one voice, ‘Blessed be he[e][d][c][b], and blessed be the name of the Lord of Spirits forever and ever.’
translation:
  language: hi
  text: उस दिन वे एक स्वर उठाएँगे और विश्वास[a] की आत्मा[b] में, बुद्धि की आत्मा में, धीरज की आत्मा में, दया की आत्मा में, धार्मिकता और शांति की आत्मा में, और भलाई[c] की आत्मा में धन्य कहेंगे, स्तुति करेंगे और महिमा करेंगे। और वे सब एक स्वर में कहेंगे, “धन्य है वह[d], और आत्माओं के प्रभु का नाम युगानुयुग धन्य हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘विश्वास’ के स्थान पर ‘विश्वासयोग्यता’ भी संभव है।
    reason: lexical_alternative
  - marker: b
    text: बार-बार आया ‘... की आत्मा में’ उपासना की मनोवृत्ति, परमेश्वर से मिले गुण, या अधिक व्यक्तित्वयुक्त स्वर्गीय सामर्थ्यों की ओर संकेत कर सकता है। मूल इस बात को स्पष्ट नहीं करता।
    reason: alternative_reading
  - marker: c
    text: ‘भलाई’ का अर्थ यहाँ ‘कृपालुता’, ‘दयालुता’ या ‘सद्भाव’ भी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: 'शाब्दिक व्याकरणिक बल: ‘धन्य है वह’; इसे आशीर्वादात्मक रूप में ‘धन्य हो वह’ भी समझा जा सकता है।'
    reason: grammar_and_alternative_reading
lexical_decisions:
- source_word: ይነሥኡ አሐደ ቃለ / በአሐዱ ቃል
  choice: एक स्वर उठाएँगे / एक स्वर में
  rationale: ቃል का मूल अर्थ ‘शब्द/वाणी/स्वर’ हो सकता है, पर सामूहिक जयघोष के प्रसंग में ‘एक स्वर’ स्वाभाविक है। पहली अभिव्यक्ति में ‘उठाना’ और दूसरी में एक साथ बोलने का भाव सुरक्षित रखा गया है।
- source_word: ወይባርኩ ወይሴብሑ ወያሌዕሉ
  choice: धन्य कहेंगे, स्तुति करेंगे और महिमा करेंगे
  rationale: तीनों संचयी क्रियाओं को अलग रखा गया है। ‘महिमा करेंगे’ अंतिम क्रिया के ऊँचा उठाने या महिमामंडित करने के भाव को सहज धार्मिक हिन्दी में व्यक्त करता है।
- source_word: በመንፈሰ ሃይማኖት
  choice: विश्वास की आत्मा में
  rationale: ሃይማኖት के लिए ‘विश्वास’ मुख्य अर्थ चुना गया है; ‘विश्वासयोग्यता’ भी संभव है और पादटिप्पणी में दी गई है।
- source_word: በመንፈሰ ጥበብ
  choice: बुद्धि की आत्मा में
  rationale: यह सीधा अनुवाद पुनरावृत्त संरचना और स्तुतिपरक लय बनाए रखता है।
- source_word: በመንፈሰ ትዕግሥት
  choice: धीरज की आत्मा में
  rationale: ‘धीरज’ में धैर्य और कठिनाई में टिके रहने, दोनों का भाव आता है; इसलिए यह आधुनिक हिन्दी में संक्षिप्त और व्यापक है।
- source_word: በመንፈሰ ምሕረት
  choice: दया की आत्मा में
  rationale: ‘दया’ सामान्य पाठक के लिए स्वाभाविक है और करुणा तथा कृपा के नैतिक भाव को बनाए रखती है।
- source_word: በመንፈሰ ጽድቅ ወሰላም
  choice: धार्मिकता और शांति की आत्मा में
  rationale: ጽድቅ के नैतिक-धार्मिक अर्थ के लिए ‘धार्मिकता’ चुना गया है और मूल के अनुसार ‘शांति’ उसी एक ‘आत्मा’ पदबंध से जुड़ी है।
- source_word: መንፈሰ ኂሩት
  choice: भलाई की आत्मा में
  rationale: ኂሩት का व्यापक अर्थ भलाई, कृपालुता या सद्भाव है। ‘भलाई’ अनावश्यक संकीर्णता के बिना मूल अर्थ को सुरक्षित रखती है।
- source_word: ቡሩክ ወይትባረክ
  choice: धन्य है वह, और ... नाम ... धन्य हो
  rationale: पहला रूप कृदंतात्मक कथन है और दूसरा आशीर्वादात्मक/विधिलिंग रूप। हिन्दी में ‘धन्य है’ और ‘धन्य हो’ इस व्याकरणिक अंतर को स्पष्ट रूप से बनाए रखते हैं।
- source_word: ስሙ ለእግዚአ መናፍስት
  choice: आत्माओं के प्रभु का नाम
  rationale: यह 1 हनोक में प्रयुक्त विशिष्ट उपाधि का सीधा और सुसंगत हिन्दी रूप है।
- source_word: ለዓለም ወእስከ ለዓለም
  choice: युगानुयुग
  rationale: यह हिन्दी का स्वाभाविक, गरिमापूर्ण स्तुतिपरक मुहावरा है, जो मूल की दोहराई हुई अनंतकालिक अभिव्यक्ति को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: बार-बार आए ‘... की आत्मा में’ का आशय
  choice: मूल की अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के ज्यों का त्यों पारदर्शी रखा गया है।
  alternative: इसे उपासकों की मनोवृत्ति, परमेश्वर से मिले गुण, या कुछ हद तक व्यक्तित्वयुक्त स्वर्गीय आत्माओं के रूप में समझा जा सकता है।
  rationale: गीज़ पदबंध इन संभावनाओं में से किसी एक को निर्णायक रूप से स्थापित नहीं करता; अतः अनुवाद धार्मिक-तत्त्वमीमांसक अस्पष्टता को नहीं मिटाता।
- issue: पहले ‘धन्य’ कथन का संदर्भ और बल
  choice: ‘धन्य है वह’ को आत्माओं के प्रभु के विषय में कथन माना गया है, जबकि उसके बाद उनके नाम के धन्य होने की कामना है।
  alternative: इसे ‘धन्य हो वह’ जैसी आशीर्वादात्मक कामना या केवल ‘धन्य!’ जैसा विस्मयादिबोधक भी समझा जा सकता है।
  rationale: पहला गीज़ रूप निष्क्रिय कृदंत है, जबकि अगला रूप विधिलिंग है। निकटवर्ती ‘उसका नाम’ पहले कथन के पुरुषवाचक संदर्भ का समर्थन करता है, पर विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर स्तुतिपरक गरिमा बनाए रखने के लिए ‘एक स्वर’, ‘आत्माओं के प्रभु’ और ‘युगानुयुग’ जैसे परिचित धार्मिक पद रखे गए हैं। सूची की पुनरावृत्ति जानबूझकर सुरक्षित है; हिन्दी वाक्य-विन्यास की स्वाभाविकता के लिए क्रियाएँ सूची के बाद रखी गई हैं।
