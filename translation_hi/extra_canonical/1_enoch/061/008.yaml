base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/008.yaml
  text: And the Lord of Spirits seated the Chosen One on the throne of glory[a], and he will judge all the works of the holy ones in the height of heaven[d][c][b], and he will weigh their deeds in the balance.
translation:
  language: hi
  text: और आत्माओं के प्रभु ने चुने हुए को महिमा के सिंहासन पर बैठाया[a]; और वह स्वर्ग की ऊँचाई में पवित्र जनों[b] के सब कामों का न्याय करेगा और उनके कर्मों को तराज़ू पर तौलेगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निर्वाचित जन।” गीइज़ शब्द ኅሩይ एक विशिष्ट उपाधि के रूप में प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: “पवित्र जन” धर्मी मनुष्यों, स्वर्गीय पवित्र प्राणियों, या दोनों के लिए हो सकता है; मूल भाषा इसे अधिक संकीर्ण नहीं करती।
    reason: alternative_reading
  - marker: c
    text: 'मूल में न्यायिक मूल्यांकन के लिए तराज़ू पर तौलने का बिंब है; क्रिया सक्रिय है: “वह तौलेगा।”'
    reason: cultural_and_grammar_note
lexical_decisions:
- source_word: እግዚአ መናፍስት
  choice: आत्माओं के प्रभु
  rationale: यह 1 हनोक में प्रयुक्त प्रतिष्ठित ईश्वरीय उपाधि को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: መንበረ ስብሐት
  choice: महिमा का सिंहासन
  rationale: मूल के ठोस राज्याभिषेक-बिंब और बाइबिलीय गरिमा, दोनों को सुरक्षित रखता है।
- source_word: አንበረ
  choice: बैठाया
  rationale: क्रिया के कारक अर्थ—किसी को बैठाना अथवा स्थापित करना—को सीधे व्यक्त करता है।
- source_word: ለኅሩይ
  choice: चुने हुए
  rationale: यह एक विशिष्ट उपाधि है; हिन्दी में 'चुना हुआ' आधुनिक और स्पष्ट है, जबकि सन्दर्भ इसकी निश्चित पहचान प्रकट करता है।
- source_word: ይኴንን
  choice: न्याय करेगा
  rationale: भावी न्यायिक क्रिया को संक्षिप्त और स्पष्ट रूप में व्यक्त करता है।
- source_word: ኵሎ ግብሮሙ
  choice: सब कामों
  rationale: पहले संज्ञा को 'काम' और बाद के ምግባሮሙ को 'कर्म' कहने से मूल में उपस्थित शब्दगत भेद कुछ हद तक बना रहता है।
- source_word: ለቅዱሳን
  choice: पवित्र जनों
  rationale: यह मनुष्य, स्वर्गीय पवित्र प्राणी, अथवा दोनों की सम्भावना को 'सन्तों' की अपेक्षा अधिक खुला रखता है।
- source_word: በመልዕልተ ሰማይ
  choice: स्वर्ग की ऊँचाई में
  rationale: मूल की ऊर्ध्व, स्वर्गीय स्थान-छवि को औपचारिक पर बोधगम्य हिन्दी में सुरक्षित रखता है।
- source_word: በመዳልው
  choice: तराज़ू पर
  rationale: न्यायिक मूल्यांकन के तौलने वाले मूर्त बिंब को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ይደሉ ምግባሮሙ
  choice: उनके कर्मों को ... तौलेगा
  rationale: ይደሉ सक्रिय, तीसरे पुरुष एकवचन भावी क्रिया है; इसलिए निष्क्रिय 'तौले जाएँगे' के बजाय सक्रिय रूप रखा गया है।
theological_decisions:
- issue: ለቅዱሳን की पहचान
  choice: '''पवित्र जनों'' कहकर पहचान को खुला रखा गया'
  alternative: '''सन्तों'', ''धर्मियों'' या ''पवित्र स्वर्गदूतों'''
  rationale: पद स्वयं यह निश्चित नहीं करता कि अभिप्राय धर्मी मनुष्य हैं, स्वर्गीय पवित्र प्राणी हैं, या दोनों।
- issue: ለኅሩይ की उपाधि
  choice: विशिष्ट उपाधि के रूप में 'चुने हुए'
  alternative: '''निर्वाचित जन'' या ''एक चुना हुआ'''
  rationale: राजसिंहासन और न्याय के प्रसंग में यह किसी विशिष्ट महान व्यक्तित्व की मान्य उपाधि है, न कि अनिश्चित वर्णन।
- issue: अन्तिम क्रिया का कर्ता
  choice: निकटतम एकवचन पुरुष 'चुना हुआ' से सम्बद्ध सक्रिय 'वह ... तौलेगा'
  alternative: कर्मों को निष्क्रिय रूप में 'तौला जाएगा' या कर्ता को स्पष्टतः 'आत्माओं का प्रभु' कहना
  rationale: मूल सक्रिय तीसरे पुरुष एकवचन रखता है, किन्तु सर्वनाम का नाम लेकर विस्तार नहीं करता; हिन्दी में 'वह' उसी तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण अपोकैलिप्टिक शैली, पर सामान्य पाठक के लिए स्पष्ट। मूल के सक्रिय न्यायिक क्रम और पवित्र जनों की पहचान से जुड़ी अस्पष्टता सुरक्षित रखी गई है।
