base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/007.yaml
  text: And to him belongs the first word[a]; they shall bless and exalt and praise with wisdom[c][b], and they shall be wise in speech and in the spirit of life.
translation:
  language: hi
  text: और पहला वचन उसी का है[a]; वे बुद्धि के साथ आशीष देंगे, महिमा करेंगे और स्तुति करेंगे; और वे वाणी में[b] तथा जीवन की आत्मा में[c] बुद्धिमान होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वाणी का आरम्भ उसी से है।” गीइज़ पदबंध का अर्थ “पहला वचन” या “वाणी का आरम्भ” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “बात में” अथवा “कथन में”; संबंधित गीइज़ शब्द का अर्थ वाणी, बात, विषय या प्रसंग हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'या, “जीवन के श्वास में।” अंतिम वाक्यांश कठिन है; इसका अनुवाद यह भी हो सकता है: “वे वाणी और जीवन के श्वास में बुद्धिमानी से काम करेंगे।”'
    reason: alternative_reading
lexical_decisions:
- source_word: ወለዉእቱ መቅድመ ቃለ
  choice: और पहला वचन उसी का है
  rationale: ወለዉእቱ का संबंधवाचक अर्थ ‘और उसी का/उसके लिए’ है, जबकि መቅድመ ቃለ को संयुक्त रूप में ‘पहला वचन’ समझा गया है। इससे इसे ‘उसके सामने वाणी से’ मानने वाली व्याकरणतः कमज़ोर व्याख्या से बचा जाता है।
- source_word: ይባርኩ
  choice: वे ... आशीष देंगे
  rationale: क्रिया के उपासना-संबंधी अर्थ और भविष्यसूचक रूप को सीधे रखा गया है; मूल में कर्म स्पष्ट नहीं है, इसलिए हिन्दी में भी कोई कर्म नहीं जोड़ा गया।
- source_word: ያሌዕሉ
  choice: ऊँचा उठाएँगे
  rationale: यह मूल क्रिया के ‘ऊँचा करना/महान ठहराना’ अर्थ को बनाए रखता है और किसी विशिष्ट धर्मवैधानिक व्याख्या को नहीं जोड़ता।
- source_word: ይሴብሑ
  choice: स्तुति करेंगे
  rationale: स्वर्गीय उपासना के प्रसंग में यह सहज, गरिमापूर्ण और सामान्य हिन्दी अभिव्यक्ति है।
- source_word: በጥበብ
  choice: बुद्धि के साथ
  rationale: संज्ञात्मक रूप ‘बुद्धि’ को बनाए रखते हुए साधन या रीति का भाव व्यक्त किया गया है।
- source_word: ይጠብቡ
  choice: बुद्धिमान होंगे
  rationale: यह ጥበብ (‘बुद्धि’) के साथ मूल के शब्द-संबंध को सुरक्षित रखता है; ‘बुद्धिमानी से काम करेंगे’ संभावित वैकल्पिक अर्थ है।
- source_word: በነገር
  choice: वाणी में
  rationale: ነገር के ‘बात, कथन, वाणी, विषय’ जैसे व्यापक अर्थों में यहाँ उपासना-संबंधी कथन का अर्थ स्वाभाविक है। ‘वाणी’ पहले आए ቃለ के लिए प्रयुक्त ‘वचन’ से दोनों मूल शब्दों का अंतर भी बनाए रखता है।
- source_word: መንፈሰ ሕይወት
  choice: जीवन की आत्मा
  rationale: यह धार्मिक और सर्वनाश-साहित्यिक स्वर को बनाए रखता है, पर पादटिप्पणी में ‘जीवन का श्वास’ देकर आत्मा और श्वास की वास्तविक अर्थगत अस्पष्टता भी सुरक्षित रखी गई है।
theological_decisions:
- issue: መንፈሰ ሕይወት का अर्थ ‘जीवन की आत्मा’ है या ‘जीवन का श्वास’
  choice: जीवन की आत्मा
  alternative: जीवन का श्वास
  rationale: स्वर्गीय स्तुति के प्रसंग में ‘आत्मा’ ऊँचे धार्मिक स्वर के अनुकूल है, लेकिन गीइज़ शब्द में ‘श्वास’ का ठोस अर्थ भी संभव है; इसलिए वैकल्पिक अर्थ को पादटिप्पणी में स्पष्ट रखा गया है।
- issue: पहले उपवाक्य का संबंध उपस्थिति (‘उसके सामने’) से है या स्वामित्व/संबंध (‘उसी का’) से
  choice: और पहला वचन उसी का है
  alternative: और वाणी का आरम्भ उसी से है
  rationale: ወለዉእቱ में ‘उसी का/उसके लिए’ का संबंधवाचक भाव और መቅድመ ቃለ में ‘पहला वचन/वाणी का आरम्भ’ की संयुक्त रचना अधिक दृढ़ व्याकरणिक आधार रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। मूल की स्तुतिपरक समानांतर क्रियाएँ क्रम से सुरक्षित हैं। जहाँ मूल ने आशीष, ऊँचा उठाने और स्तुति करने का कर्म स्पष्ट नहीं किया, वहाँ हिन्दी में भी उसे जोड़कर अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
