base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/006.yaml
  text: And all those in the height of heaven received a command[a], and power, and a voice[c][b], and light like fire.
translation:
  language: hi
  text: और स्वर्ग की ऊँचाई पर रहने वाले उन सभी ने[b] एक आज्ञा, सामर्थ्य, वाणी और आग के समान प्रकाश प्राप्त किया।[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस साक्षी में पद का उत्तरार्ध कठिन है। यहाँ ‘प्रकाश’ के स्थान पर ‘चमक’ या ‘दीप्ति’ भी समझा जा सकता है।
    reason: textual_variant
  - marker: b
    text: या, “वे सभी जो स्वर्ग की ऊँचाई पर थे।”
    reason: lexical_alternative
  - marker: c
    text: 'एक पुराना वैकल्पिक वाक्य-विन्यास है: “और उन्होंने आज्ञा पाई—वे सभी जो सर्वोच्च स्वर्ग में थे—और सामर्थ्य तथा प्रकाश की वाणी आग के समान थे।”'
    reason: previous_rendering
lexical_decisions:
- source_word: ወነሥኡ
  choice: और ... प्राप्त किया
  rationale: क्रिया का मूल अर्थ ‘लेना/पाना/प्राप्त करना’ है। आज्ञा तथा उसके साथ जुड़े अन्य कर्मों के संदर्भ में ‘प्राप्त किया’ स्वाभाविक है और सक्रिय वाक्य-विन्यास को बनाए रखता है।
- source_word: ትእዛዘ
  choice: एक आज्ञा
  rationale: यह शब्द अधिकारपूर्ण आदेश को सूचित करता है। ‘आज्ञा’ आधुनिक हिन्दी में गरिमापूर्ण और स्पष्ट है।
- source_word: እለ በመልዕልተ ሰማይ ኵሎሙ
  choice: स्वर्ग की ऊँचाई पर रहने वाले उन सभी ने
  rationale: यह अनुवाद स्थान-संबंधी बिंब को बनाए रखते हुए संदर्भित स्वर्गीय प्राणियों की पहचान को सामान्य ही रहने देता है; किसी विशेष स्वर्गदूत-वर्ग को नहीं जोड़ता।
- source_word: ኃይለ
  choice: सामर्थ्य
  rationale: इस संज्ञा का अर्थ शक्ति या बल है। ‘सामर्थ्य’ गरिमापूर्ण है और यह तय नहीं करता कि बात निजी बल की है या प्रदान की गई शक्ति की।
- source_word: ቃለ
  choice: वाणी
  rationale: दर्शनीय प्रसंग में यह शब्द वाणी, स्वर या कथन का अर्थ दे सकता है। ‘वाणी’ हिन्दी में सहज है और श्रव्य बिंब को बनाए रखता है।
- source_word: ብርሃነ
  choice: प्रकाश
  rationale: मूल शब्द प्रकाश, चमक या दीप्ति का अर्थ दे सकता है। ‘प्रकाश’ सबसे सीधा विकल्प है; पाठगत कठिनाई और अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: ከመ እሳት
  choice: आग के समान
  rationale: उपमा को बिना व्याख्यात्मक विस्तार के सीधे सुरक्षित रखा गया है।
theological_decisions:
- issue: स्वर्ग की ऊँचाई पर रहने वालों की पहचान
  choice: स्वर्गीय प्राणियों के लिए सामान्य संकेत
  alternative: विशिष्ट स्वर्गदूत-वर्ग या स्वर्ग की समस्त सेना
  rationale: पद किसी विशेष वर्ग का नाम नहीं देता; इसलिए बाद की धर्मवैचारिक श्रेणियाँ पाठ में नहीं जोड़ी गईं।
- issue: सामर्थ्य, वाणी और प्रकाश का वाक्यगत संबंध
  choice: इन सभी को ‘प्राप्त किया’ क्रिया के समन्वित कर्म माना गया
  alternative: 'इन्हें नया उपवाक्य मानना: ‘सामर्थ्य और प्रकाश की वाणी आग के समान थे’'
  rationale: प्रस्तुत गीइज़ रूपों की कारक-संरचना और बार-बार आए संयोजक इन्हें आज्ञा के साथ समन्वित कर्म मानने का समर्थन करते हैं, फिर भी पुराने वैकल्पिक विन्यास को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘स्वर्ग की ऊँचाई’ मूल के स्थानिक बिंब को बचाता है; ‘आज्ञा’, ‘सामर्थ्य’, ‘वाणी’ और ‘प्रकाश’ सामान्य पाठक के लिए बोधगम्य धार्मिक-दार्शनिक शब्द हैं। मुख्य पाठ नवीनतम व्याकरणिक समीक्षा के अनुसार सभी समन्वित संज्ञाओं को ‘प्राप्त किया’ के कर्म के रूप में पढ़ता है।
