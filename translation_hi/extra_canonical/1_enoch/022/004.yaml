base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/004.yaml
  text: And these places were made for them to dwell in until the day of their judgment[a], and until their appointed time, and that appointed time is long[c][b], until the time of the great judgment upon them.
translation:
  language: hi
  text: और ये स्थान उनके रहने के लिए बनाए गए थे[a]—उनके न्याय के दिन तक और उनके लिए ठहराई गई अवधि[b] तक; और वह अवधि लंबी है[c]—उन पर होने वाले महान न्याय के समय तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“बनाए गए थे” के पीछे का इथियोपिक शब्द (†ገብሩ†) पाठ की दृष्टि से अनिश्चित है। इस उपवाक्य का भाव यह भी हो सकता है: “और ये वे स्थान हैं जहाँ वे रहेंगे।”'
    reason: textual_variant
  - marker: b
    text: “अवधि” के लिए प्रयुक्त शब्द का अर्थ “आयु,” “जीवनकाल” या “नियत समय” भी हो सकता है। यहाँ संभवतः अंतिम न्याय से पहले उनके लिए ठहराए गए समय का उल्लेख है।
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक रूप से “वह अवधि बड़ी/महान है।” समय के संदर्भ में इसका अर्थ “लंबी” समझा गया है। पूरे अंश का एक अन्य संभव अनुवाद है: “और ये वे स्थान हैं जहाँ वे अपने न्याय के दिन और अपनी ठहराई हुई अवधि तक रहेंगे; और वह अवधि बड़ी है—उन पर होने वाले महान न्याय के समय तक।”'
    reason: translation_alternative
lexical_decisions:
- source_word: መካናት
  choice: स्थान
  rationale: यह शब्द स्थानों अथवा निवास-स्थानों को सूचित करता है। “स्थान” दर्शन में वर्णित भूगोल के अनुकूल, व्यापक और कम व्याख्यात्मक शब्द है।
- source_word: ይነብርዎሙ
  choice: उनके रहने के लिए
  rationale: मूल धातु रहने, बसे रहने या बने रहने का भाव देती है। यहाँ लगातार निवास का अर्थ प्रसंग के अनुकूल है।
- source_word: እስከ ዕለተ ኵነኔሆሙ
  choice: उनके न्याय के दिन तक
  rationale: ኵነኔ न्याय अथवा न्यायिक निर्णय को सूचित करता है। “न्याय” इसे केवल दंडाज्ञा या दोषसिद्धि तक सीमित नहीं करता।
- source_word: አመ ዕድሜሆሙ
  choice: उनके लिए ठहराई गई अवधि
  rationale: ዕድሜ का अर्थ आयु, जीवनकाल या अवधि हो सकता है। इस अंत-कालीन प्रसंग में एक निश्चित समयावधि अभिप्रेत प्रतीत होती है।
- source_word: ዘየዓቢ
  choice: लंबी है
  rationale: शब्द का मूल भाव “बड़ा/महान” है, किंतु समयावधि के साथ हिंदी में “लंबी” स्वाभाविक रूप से उसके दीर्घ होने का भाव व्यक्त करता है; अन्य संभावना पादटिप्पणी में रखी गई है।
- source_word: ኵነኔ ዐቢይ በላዕሌሆሙ
  choice: उन पर महान न्याय होगा
  rationale: वाक्यांश उनके विरुद्ध या उन पर होने वाले चरम अंत-कालीन न्याय को दर्शाता है। “होगा” हिंदी वाक्य को स्वाभाविक बनाता है, जबकि मूल का “उन पर महान न्याय” वाला बल बनाए रखता है।
- source_word: †ገብሩ†
  choice: बनाए गए थे
  rationale: चिह्नित पाठ कठिन और पाठालोचन की दृष्टि से अनिश्चित है, पर रूप को क्रिया मानने पर निष्क्रिय अर्थ “बनाए गए थे” प्रथम उपवाक्य के साथ अच्छी तरह बैठता है। अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
theological_decisions:
- issue: ኵነኔ का अर्थ “न्याय” रखा जाए या अधिक नकारात्मक “दोषदंड/दंडाज्ञा”
  choice: न्याय
  alternative: दोषदंड; दंडाज्ञा
  rationale: प्रसंग न्यायिक और अंत-कालीन है, पर शब्द अपने आप में परिणाम को केवल दोषसिद्धि तक सीमित नहीं करता। “न्याय” मूल की व्यापकता और धर्मवैचारिक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज और दर्शनात्मक शैली रखी गई है। “ठहराई गई अवधि” सामान्य पाठक के लिए स्पष्ट है और “न्याय” स्रोत की न्यायिक व्यापकता को बनाए रखता है।
