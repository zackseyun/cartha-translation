base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/011.yaml
  text: Here their souls are set apart in this great affliction until the great day of judgment and punishment and affliction for those who curse forever; and vengeance on their souls. There he will bind them forever.
translation:
  language: hi
  text: यहाँ उनकी आत्माएँ इस बड़े क्लेश में अलग रखी जाती हैं, उस महान दिन तक जो न्याय, दण्ड, सदा शाप देनेवालों[a] के लिए क्लेश, और उनकी आत्माओं पर प्रतिशोध का दिन है। वहाँ वह उन्हें सदा के लिए बाँध देगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “जो सदा के लिए शापित हैं।”
    reason: क्रिया को सक्रिय या कर्मवाच्य समझने की सम्भावना।
  - marker: b
    text: 'साक्ष्य में इसके बाद कोष्ठकों में एक अनिश्चित वाक्यांश है: “और यह संसार के पहले से था।” इसे मुख्य पाठ में शामिल नहीं किया गया है।'
    reason: अनिश्चित पाठांतर।
lexical_decisions:
- source_word: ይትፈለጠ
  choice: अलग रखी जाती हैं
  rationale: क्रिया का कर्मवाच्य/आत्मवाचक भाव अलग किए जाने या किसी पृथक स्थान अथवा दशा के लिए ठहराए जाने को व्यक्त करता है। यह चुनाव स्थानिक और न्यायिक दोनों संकेतों को बनाए रखता है।
- source_word: ነፍሳቲሆሙ
  choice: उनकी आत्माएँ
  rationale: मृतकों के न्याय की प्रतीक्षा करने के प्रसंग में ‘आत्माएँ’ सबसे स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: ዐቢይ ጻዕር
  choice: बड़ा क्लेश
  rationale: यह पद पीड़ा, संकट या यातना का अर्थ दे सकता है। ‘बड़ा क्लेश’ वास्तविक दुःख को व्यक्त करता है, पर उसकी प्रकृति को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: ኵነኔ
  choice: न्याय
  rationale: यह न्यायिक पद है; साथ में दण्ड का उल्लेख होने के कारण व्यापक और सहज हिन्दी ‘न्याय’ उपयुक्त है।
- source_word: መቅሠፍት
  choice: दण्ड
  rationale: शब्द प्रहार, विपत्ति या दण्ड का बोध करा सकता है; यहाँ न्याय-दिवस के दण्डात्मक परिणाम के लिए ‘दण्ड’ प्रसंगानुकूल है।
- source_word: ይረግሙ
  choice: शाप देनेवालों
  rationale: रूप को सक्रिय अर्थ में लिया गया है—‘जो शाप देते हैं’। न्याय-संदर्भ में कर्मवाच्य ‘जो शापित हैं’ भी सम्भव समझा गया है और उसे पादटिप्पणी में रखा गया है।
- source_word: በቀል ለነፍሶሙ
  choice: उनकी आत्माओं पर प्रतिशोध
  rationale: मूल में यह स्वतंत्र क्रियात्मक वाक्य नहीं, बल्कि पिछले न्यायिक संज्ञा-पदों से जुड़ा संज्ञा-पद है। इसलिए ‘वह प्रतिशोध लेगा’ जोड़ने के बजाय संज्ञात्मक रचना रखी गई है।
- source_word: ይእስሮሙ
  choice: वह उन्हें बाँध देगा
  rationale: एकवचन कर्ता को अनिर्दिष्ट ‘वह’ के रूप में सुरक्षित रखा गया है और बाँधने की ठोस प्रलयकालीन छवि कायम रखी गई है।
- source_word: እስከ ለዓለም
  choice: सदा के लिए
  rationale: यह स्थायी अथवा अनन्त अवधि बताने वाला सूत्र है; ‘सदा के लिए’ आधुनिक हिन्दी में स्वाभाविक और गंभीर है।
theological_decisions:
- issue: क्या आत्माएँ अंतिम न्याय से पहले केवल अलग रखी गई हैं या दण्डात्मक पीड़ा भी भोग रही हैं
  choice: ‘इस बड़े क्लेश में अलग रखी जाती हैं’ कहकर अलगाव और वर्तमान क्लेश दोनों को रखा गया है।
  alternative: इसे केवल तटस्थ प्रतीक्षा-स्थान या पूर्ण रूप से आरम्भ हो चुकी अंतिम यातना के रूप में समझना।
  rationale: मूल पाठ अलग किए जाने की भाषा को क्लेश के साथ जोड़ता है; अनुवाद इस तनाव को किसी एक व्यवस्थित धर्मवैज्ञानिक निष्कर्ष में नहीं बदलता।
- issue: बाँधनेवाला कौन है
  choice: मूल के अनिर्दिष्ट एकवचन कर्ता के अनुसार केवल ‘वह’ रखा गया है।
  alternative: ‘परमेश्वर’ को स्पष्ट रूप से जोड़ना या कर्मवाच्य ‘वे बाँधे जाएँगे’ करना।
  rationale: पद में कर्ता का नाम नहीं दिया गया है। ‘वह’ व्याकरण को सुरक्षित रखता है और कर्ता की पहचान पाठक पर अनावश्यक रूप से आरोपित नहीं करता।
- issue: ‘शाप देते हैं’ या ‘शापित हैं’
  choice: मुख्य पाठ में सक्रिय अर्थ ‘शाप देनेवाले’ रखा गया है।
  alternative: कर्मवाच्य अर्थ ‘जो सदा के लिए शापित हैं’।
  rationale: प्रस्तुत गीइज़ रूप सक्रिय पठन का समर्थन करता है, जबकि न्याय-संदर्भ के कारण कर्मवाच्य अर्थ की प्राचीन/अनुवादगत सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर पर सामान्य पाठक के लिए सुबोध रखी गई है। ‘क्लेश’, ‘न्याय’, ‘दण्ड’ और ‘प्रतिशोध’ जैसे परिचित धार्मिक-न्यायिक शब्द मूल की प्रलयकालीन गरिमा बनाए रखते हैं। डैश के बाद समानाधिकरण द्वारा ‘महान दिन’ की विषयवस्तु स्पष्ट की गई है, और मूल के संज्ञात्मक क्रम को यथासम्भव सुरक्षित रखा गया है।
