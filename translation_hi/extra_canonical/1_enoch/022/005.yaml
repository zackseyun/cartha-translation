  choice: आत्माओं
  rationale: यहाँ मृत मनुष्यों के अभौतिक अस्तित्व का बोध है; हिन्दी में ‘आत्माएँ’ सामान्य पाठक के लिए ‘प्रेतात्माएँ’ की अपेक्षा अधिक तटस्थ है।
- source_word: ውሉደ ሰብእ
  choice: मनुष्यों की सन्तानों
  rationale: मूल की सामी शैली और सामूहिक मानवीय सन्दर्भ को बनाए रखता है, बिना इसे किसी विशिष्ट उपाधि में बदलने के।
- source_word: እንዘ ሙታን ውእቶሙ
  choice: जो मर चुके थे
  rationale: मृत्यु की अवस्था को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ቃሎሙ
  choice: उनकी पुकार
  rationale: शाब्दिक अर्थ ‘उनकी आवाज़’ है, पर अगले क्रियापद और न्याय की माँग वाले प्रसंग में ‘पुकार’ अधिक स्वाभाविक है और भाव को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: ይበጽሕ እስከ ሰማይ
  choice: स्वर्ग तक पहुँची
  rationale: ऊपर स्वर्ग की ओर पहुँचने की मूल प्रलय-साहित्यिक छवि सुरक्षित रहती है।
- source_word: ወይስኪ
  choice: न्याय की दुहाई देने लगे
  rationale: कठिन अंतिम क्रिया में पुकार, विनती और शिकायत/अभियोग का भाव संभव है। यह हिन्दी पदबंध न्याय हेतु की गई तीव्र अपील को व्यक्त करता है, जबकि विधिक ‘अभियोग लगाया’ जितना संकीर्ण नहीं है।
theological_decisions:
- issue: मृतकों की स्वर्ग तक पहुँचने वाली वाणी का स्वरूप
  choice: मृत मनुष्यों की आत्माओं को न्याय के लिए स्वर्ग की ओर पुकारते हुए दिखाया गया है।
  alternative: इसे केवल उनकी आवाज़ के स्वर्ग तक पहुँचने, प्रार्थना करने, शिकायत करने या अभियोग लगाने के रूप में समझा जा सकता है।
  rationale: मूल में ‘आत्माएँ’, स्वर्ग तक पहुँचती उनकी वाणी और कठिन अंतिम क्रिया मिलकर न्याय की अपील का संकेत देते हैं। अनुवाद इस दृश्य को रखता है, पर मृत्यु के बाद की अवस्था के विषय में कोई व्यापक सिद्धान्त निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘मनुष्यों की सन्तानें’ मूल की उन्नत सामी अभिव्यक्ति को बनाए रखती है; ‘न्याय की दुहाई’ प्रसंग का न्यायिक भाव देती है, जबकि पादटिप्पणी वास्तविक शाब्दिक अनिश्चितता सुरक्षित रखती है।
