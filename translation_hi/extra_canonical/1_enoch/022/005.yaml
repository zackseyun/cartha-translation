translation:
  language: hi
  text: और मैंने मनुष्यों की उन सन्तानों की आत्माओं को देखा जो मर चुके थे, और उनकी आवाज़ स्वर्ग तक पहुँची और उन्होंने पुकार लगाई।[a]
  philosophy: optimal-equivalence
  footnotes:
