base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/009.yaml
  text: And he answered me and said to me[a], “These three have been made so that the spirits of the dead might be separated. And thus a division has been made for the spirits of the righteous, where there is a spring of water[e][d][c][b], with light above it.”
translation:
  language: hi
  text: उसने मुझे उत्तर दिया और मुझसे कहा, “ये तीन[a] इसलिए बनाए गए हैं कि मृतकों की आत्माएँ अलग की जा सकें। और इसी प्रकार धर्मियों की आत्माओं के लिए भी अलग किया गया है[b]—वहाँ पानी का एक सोता[c] है, जिसके ऊपर प्रकाश है[d]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ये तीन विभाग बनाए गए हैं।” पिछले प्रसंग में तीन खोखले स्थानों का वर्णन है, पर मूल में यहाँ केवल “ये तीन” कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: मूल में उसी ‘अलग करना’ क्रिया की पुनरावृत्ति है जो पिछले वाक्यांश में आई है। दूसरे प्रयोग में कर्ता व्यक्त नहीं है; अर्थ “धर्मियों की आत्माओं के लिए एक विभाग अलग किया गया है” भी हो सकता है।
    reason: alternative_reading
  - marker: c
    text: या “पानी का एक स्रोत” अथवा “पानी का एक चश्मा।”
    reason: lexical_alternative
  - marker: d
    text: 'मूल अत्यंत संक्षिप्त है: “उसके ऊपर प्रकाश।” प्रकाश सोते के ऊपर है या धर्मियों के पूरे विभाग के ऊपर, यह स्पष्ट नहीं है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ፫ትገብሩ
  choice: ये तीन बनाए गए हैं
  rationale: मूल में ‘तीन’ और ‘बनाए गए’ का निष्क्रिय भाव स्पष्ट है। पिछले प्रसंग से इनका आशय तीन खोखले स्थानों या विभागों से है, पर मुख्य पाठ में केवल ‘तीन’ रखकर मूल की संक्षिप्तता और संदर्भ-निर्भरता सुरक्षित रखी गई है।
- source_word: ይትፈለጠ / ተፈልጠ
  choice: अलग-अलग की जाएँ / इसे अलग किया गया है
  rationale: दोनों क्रियाओं में एक ही मूल धातु की पुनरावृत्ति है। हिन्दी में ‘अलग’ को दोनों बार रखकर इस जानबूझकर की गई पुनरावृत्ति को सुरक्षित रखा गया है।
- source_word: መንፈሶሙ
  choice: आत्माएँ
  rationale: यहाँ शब्द मृतकों के देह-विहीन अस्तित्व की ओर संकेत करता है। आधुनिक हिन्दी में ‘आत्माएँ’ स्वाभाविक और व्यापक रूप से समझ में आने वाला पद है; इससे किसी अधिक विशिष्ट पारिभाषिक मानव-विज्ञान को आरोपित नहीं किया जाता।
- source_word: ምዉታን
  choice: मृतकों
  rationale: सामूहिक अर्थ को सहज और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ጻድቃን
  choice: धर्मियों
  rationale: न्याय और नैतिक धार्मिकता के इस समूह के लिए यह मानक, प्रसंगानुकूल हिन्दी पद है।
- source_word: ነቅዐ ማይ
  choice: पानी का एक सोता
  rationale: यह पद पानी के प्राकृतिक स्रोत को दर्शाता है। ‘सोता’ ठोस दृश्य-बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: በላዕሌሁ ብርሃን
  choice: जिसके ऊपर प्रकाश है
  rationale: मूल वाक्यांश संक्षिप्त है—शाब्दिक रूप से ‘उसके ऊपर प्रकाश।’ हिन्दी रूप उसी स्थानिक बिंब को बनाए रखता है, जबकि उसके संदर्भ की संभावित अस्पष्टता पाद-टिप्पणी में दी गई है।
theological_decisions:
- issue: अधोलोक में मृतकों के लिए प्रयुक्त मानव-विज्ञान संबंधी पद
  choice: मृतकों की आत्माएँ
  alternative: मृतकों की रूहें / मृतकों के प्राण
  rationale: ‘आत्माएँ’ मूल के ‘spirits’ भाव का स्वाभाविक आधुनिक हिन्दी रूप है और पाठ से अधिक निश्चित दार्शनिक भेद स्थापित नहीं करता।
- issue: धर्मियों के लिए अलग किए गए स्थान का स्वरूप
  choice: धर्मियों की आत्माओं के लिए अलग किया गया स्थान, जहाँ पानी का सोता और ऊपर प्रकाश है
  alternative: धर्मी स्वयं तीसरा विभाग हैं; अथवा सोते और प्रकाश का वर्णन केवल धर्मियों का है, किसी स्थान का नहीं
  rationale: वाक्य-विन्यास सबसे सहज रूप से धर्मियों के लिए निर्धारित एक पृथक स्थान का संकेत देता है, लेकिन ‘इसे’ का सटीक पूर्ववर्ती और प्रकाश का संबंध पूरी तरह स्पष्ट नहीं है; इसलिए इन्हें पाद-टिप्पणियों में खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दर्शनात्मक दृश्य की संक्षिप्तता तथा ‘अलग’ धातु की पुनरावृत्ति सुरक्षित है। ‘ये तीन’ और ‘इसके’ जैसे संदर्भ-निर्भर रूपों की वास्तविक अस्पष्टता को मुख्य पाठ में मिटाने के बजाय पाद-टिप्पणियों में स्पष्ट किया गया है।
