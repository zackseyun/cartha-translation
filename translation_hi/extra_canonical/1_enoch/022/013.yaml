translation:
  language: hi
  text: और इस प्रकार यह उन मनुष्यों की आत्माओं के लिए ठहराया गया है जो धर्मी नहीं, बल्कि पापी हैं—जो अपराध से पूरी तरह भरे हैं और अपने जैसे अधर्मियों के साथ होंगे।[a] परन्तु उनकी आत्माओं के विषय में...
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल का यह कठिन वाक्यांश ‘वे अधर्मियों के साथ होंगे’, ‘वे उनके जैसे होंगे’, या दोनों अर्थ दे सकता है। आरम्भिक क्रिया का अनुवाद ‘बनाया गया’ या ‘तैयार किया गया’ भी हो सकता है।
    reason: lexical_and_alternative_reading
lexical_decisions:
- source_word: ተፈጥረ
  choice: ठहराया गया है
  rationale: मूल क्रिया का अर्थ ‘बनाया/तैयार किया/ठहराया’ हो सकता है। मृतकों के लिए निर्धारित स्थानों के प्रसंग में ‘ठहराया गया’ कार्यात्मक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ለነፍሶሙ ለሰብእ
  choice: उन मनुष्यों की आत्माओं के लिए
  rationale: दातृवाचक रचना बताती है कि कोई स्थान या भाग इन आत्माओं के लिए नियत है; ‘मनुष्यों’ सामान्य मानव-संदर्भ को सहज आधुनिक हिन्दी में रखता है।
- source_word: ኢኮኑ ጻድቃነ አላ ኃጥኣነ
  choice: जो धर्मी नहीं, बल्कि पापी हैं
  rationale: मूल का सीधा नैतिक विरोध—धर्मी और पापी—बिना नरम किए सुरक्षित रखा गया है।
- source_word: ፍጹማነ እበሳ
  choice: जो अपराध से पूरी तरह भरे हैं
  rationale: यह पद अपराध की परिपूर्णता या भरपूरी पर बल देता है; हिन्दी में यह अभिव्यक्ति तीव्रता को स्वाभाविक ढंग से बनाए रखती है।
- source_word: ወምስለ አባሲያን ይከውኑ ከማሆሙ
  choice: और अपने जैसे अधर्मियों के साथ होंगे
  rationale: संक्षिप्त और कठिन मूल में साथ होने तथा समान होने—दोनों भाव सम्भव हैं। यह रूप दोनों को एक साथ रखता है, पर विशिष्ट दण्ड-सिद्धान्त नहीं जोड़ता।
- source_word: ወነፍሶሙሰ
  choice: परन्तु उनकी आत्माओं के विषय में...
  rationale: अन्तिम -ሰ को विषय-परिवर्तक अथवा विरोधसूचक मानकर अगले वाक्य की ओर खुला संक्रमण रखा गया है।
theological_decisions:
- issue: क्या यह क्रिया आत्माओं की सृष्टि बताती है या उनके लिए मरणोत्तर स्थान/भाग का निर्धारण
  choice: उनकी आत्माओं के लिए किसी स्थान या भाग का ठहराया जाना
  alternative: आत्माओं का बनाया जाना
  rationale: अध्याय का निकट प्रसंग मृतकों के अलग-अलग निर्धारित स्थानों से सम्बन्धित है; फिर भी क्रिया की व्यापक अर्थ-सीमा को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: अन्तिम कठिन उपवाक्य में अधर्मियों से सम्बन्ध
  choice: ‘अपने जैसे अधर्मियों के साथ’ कहकर संगति और समानता दोनों बनाए रखना
  alternative: केवल ‘उनके साथ होंगे’ या केवल ‘उनके जैसे होंगे’
  rationale: मूल पाठ संक्षिप्त और अस्पष्ट है; अनुवाद दण्ड, विनाश या रूपान्तरण की कोई अतिरिक्त धारणा नहीं जोड़ता।
- issue: अन्तिम पद का पिछले वाक्य से सम्बन्ध
  choice: इसे अगले वाक्य का विषयात्मक आरम्भ मानना
  alternative: इसे पिछले वाक्य में ‘और उनकी आत्माएँ भी’ के रूप में जोड़ना
  rationale: प्रत्यय -ሰ का विषय-परिवर्तक/विरोधसूचक प्रयोग और अधूरा वाक्य आगे जारी होने का संकेत देते हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘धर्मी’, ‘पापी’ और ‘अधर्मी’ द्वारा मूल की न्याय-विषयक शब्दावली बनाए रखी गई है। पद का अधूरा अन्त दीर्घविराम से सुरक्षित है।
