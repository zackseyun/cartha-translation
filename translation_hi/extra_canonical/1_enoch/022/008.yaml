- source_word: በእንቲአሁ
  choice: उसके विषय में
  rationale: प्रत्यय तीसरे पुरुष पुल्लिंग एकवचन का है; इसलिए बहुवचन ‘उनके’ के बजाय एकवचन रखा गया है। पिछले प्रसंग में इसका संकेत हाबिल की आत्मा की ओर हो सकता है।
- source_word: ኵነኔ፡ ኵሉ
  choice: सभी के न्याय
  rationale: ኵነኔ का व्यापक न्यायिक अर्थ बनाए रखा गया है; इसे केवल दण्ड या दोषसिद्धि तक सीमित नहीं किया गया। ኵሉ इसके सार्वभौमिक विस्तार को व्यक्त करता है।
- source_word: ምንት
  choice: किस कारण
  rationale: यह अलग किए जाने का कारण पूछता है और साधारण ‘क्यों’ की तुलना में मूल की व्याख्यात्मक शक्ति को अधिक स्पष्ट रखता है।
- source_word: ተፈልጡ
  choice: अलग किए गए थे
  rationale: निष्क्रिय बहुवचन रूप को बनाए रखते हुए दृश्य में वर्णित अलग-अलग स्थानों या समूहों के विभाजन को व्यक्त करता है।
- source_word: ፩እምነ፡ ፩
  choice: एक-दूसरे से
  rationale: यह मूल के पारस्परिक वाक्यांश का स्वाभाविक हिन्दी समतुल्य है।
theological_decisions:
- issue: ‘सभी के न्याय’ का विस्तार
  choice: व्यापक न्यायिक अर्थ वाला ‘सभी के न्याय’
  alternative: ‘सभी के दण्ड’ या ‘सभी के दण्डादेश’
  rationale: गीज़ संज्ञा न्याय, निर्णय या दण्डादेश का अर्थ दे सकती है। व्यापक ‘न्याय’ अलग-अलग मरणोत्तर अवस्थाओं के आधार को व्यक्त करता है, पर उसे केवल दण्ड तक सीमित करके धर्मवैचारिक तनाव का समयपूर्व समाधान नहीं करता।
- issue: ‘उसके’ का संदर्भ
  choice: पुल्लिंग एकवचन ‘उसके’
  alternative: बहुवचन ‘उनके विषय में’
  rationale: प्राप्त गीज़ पाठ का प्रत्यय एकवचन है और पूर्ववर्ती संदर्भ में हाबिल की आत्मा संभावित पूर्वपद है; इसलिए संख्या को बहुवचन बनाना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर दर्शन-वर्णन के अनुरूप गरिमापूर्ण रखी गई है। ‘विषय में’ और ‘किस कारण’ औपचारिकता बनाए रखते हैं; वाक्य-संरचना फिर भी सामान्य पाठक के लिए स्पष्ट है।
