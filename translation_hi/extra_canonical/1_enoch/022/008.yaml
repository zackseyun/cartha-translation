  text: 'And at that time I asked concerning him and concerning the judgment of all: for what reason were they separated[c][b][a], one from another?'
translation:
  language: hi
  text: 'और उस समय मैंने उसके विषय में[a] और सभी के न्याय के विषय में पूछा[b]: “वे किस कारण एक-दूसरे से अलग किए गए थे?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसके’ मूल गीज़ के पुल्लिंग एकवचन रूप को दर्शाता है; संदर्भ संभवतः पिछले पद में उल्लिखित हाबिल की आत्मा का है।
    reason: cross_reference
  - marker: b
    text: ‘उसके विषय में और’ के अनुरूप गीज़ शब्द प्रतिलिखित पाठ में कोष्ठकों में हैं, जिससे इस वाक्यांश के पाठ-रूप पर कुछ अनिश्चितता सूचित होती है।
    reason: textual_variant
