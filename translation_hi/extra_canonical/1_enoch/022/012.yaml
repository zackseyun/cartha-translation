base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/012.yaml
  text: And thus a division has been made for the souls of those who make their complaint[d][c][b][a], who make known their destruction when they were slain in the days of the sinners.
translation:
  language: hi
  text: 'और इस प्रकार उन आत्माओं के लिए एक अलग भाग निर्धारित किया गया, जो फरियाद करती हैं[a] और अपने विनाश की बात प्रकट करती हैं[b][d], जब वे पापियों के दिनों में मार डाली गई थीं[c]।


    [a] या “पुकारती हैं” अथवा “आरोप लगाती हैं।” गीइज़ क्रिया में विलाप, शिकायत और न्याय की पुकार—इन सभी का भाव हो सकता है।


    [b] “अपने विनाश” से आशय सामान्य नाश के बजाय उनकी हिंसक मृत्यु से भी हो सकता है।


    [c] यह पद अधोलोक में मृतकों की आत्माओं के लिए अलग-अलग ठहराए गए स्थानों के वर्णन को आगे बढ़ाता है, जहाँ मारे गए लोग न्याय मिलने की प्रतीक्षा करते हैं।


    [d] या “जो अपने विनाश के विषय में प्रकट करती हैं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पुकारती हैं” अथवा “आरोप लगाती हैं।” गीइज़ क्रिया में विलाप, शिकायत और न्याय की पुकार—इन सभी का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “अपने विनाश” से आशय सामान्य नाश के बजाय उनकी हिंसक मृत्यु से भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यह पद अधोलोक में मृतकों की आत्माओं के लिए अलग-अलग ठहराए गए स्थानों के वर्णन को आगे बढ़ाता है, जहाँ मारे गए लोग न्याय मिलने की प्रतीक्षा करते हैं।
    reason: cross_reference
