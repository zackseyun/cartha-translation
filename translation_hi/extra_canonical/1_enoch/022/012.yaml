    reason: previous_rendering
lexical_decisions:
- source_word: ተፈልጠ
  choice: एक अलग भाग निर्धारित किया गया
  rationale: निष्क्रिय क्रिया अलग किए जाने या विभाजन का संकेत देती है। अध्याय के स्थानिक और न्यायिक संदर्भ में यह अनुवाद अर्थ को स्पष्ट करता है, पर विभाजन की सटीक प्रकृति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ለነፍሰ
  choice: उन आत्माओं के लिए
  rationale: पूर्वसर्गीय रूप यहाँ उन आत्माओं के लिए अलग भाग ठहराए जाने का भाव देता है; आगे के बहुवचन संबंधवाचक वाक्यांश के कारण बहुवचन उपयुक्त है।
- source_word: እለ ይስክዩ
  choice: जो फरियाद करती हैं
  rationale: क्रिया में विलाप करने, पुकारने, शिकायत करने या आरोप लगाने का अर्थ हो सकता है। “फरियाद” दुःख और न्याय की माँग, दोनों को खुला रखती है।
- source_word: እለ ያርእዩ
  choice: जो ... प्रकट करती हैं
  rationale: मूल क्रिया दिखाने या प्रकट करने का अर्थ रखती है। यह औपचारिक अदालती गवाही का अर्थ थोपे बिना प्रकटीकरण का भाव बनाए रखता है।
- source_word: በእንተ ሕጉለት
  choice: अपने विनाश की बात
  rationale: पदबंध विनाश, बरबादी या हिंसक अंत के विषय को व्यक्त करता है। मुख्य पाठ व्यापक अर्थ रखता है और पादटिप्पणी हिंसक मृत्यु की संभावना बताती है।
- source_word: አመ ተቀትሉ
  choice: जब वे ... मार डाली गई थीं
  rationale: निष्क्रिय क्रिया स्पष्ट रूप से हत्या किए जाने को दर्शाती है। “मार डाली गई थीं” आधुनिक और स्वाभाविक हिंदी में हिंसक अर्थ बनाए रखता है, पर “हत्या” जैसा अतिरिक्त कानूनी निष्कर्ष नहीं जोड़ता।
- source_word: በመዋዕለ ኃጥኣን
  choice: पापियों के दिनों में
  rationale: यह समयसूचक पद युग को पापियों की उपस्थिति से चिह्नित करता है और हनोक-साहित्य के नैतिक विरोध को बनाए रखता है।
theological_decisions:
- issue: क्या आत्माएँ सामान्य रूप से विलाप करती हैं या अन्यायपूर्ण रक्तपात के विरुद्ध आरोप लगाती हैं
  choice: मुख्य पाठ में “फरियाद करती हैं”
  alternative: “पुकारती हैं” या “आरोप लगाती हैं”
  rationale: अध्याय का संदर्भ मारे गए व्यक्ति के रक्त की पुकार, विशेषकर हाबिल से जुड़े भाव, की ओर संकेत करता है। “फरियाद” शोक और न्यायिक प्रतिवाद दोनों संभावनाओं को सुरक्षित रखती है।
- issue: विनाश का अर्थ सामान्य नाश है या हिंसक मृत्यु
  choice: मुख्य पाठ में व्यापक “अपने विनाश”
  alternative: “अपने हिंसक अंत”
  rationale: हत्या का अगला वाक्य हिंसक मृत्यु स्पष्ट करता है, पर संज्ञा का व्यापक अर्थ मुख्य पाठ में सुरक्षित रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। “फरियाद” शोक और न्याय की पुकार दोनों को समेटती है; “मार डाली गई थीं” ऊँचे लेकिन अप्रचलित “वध की गई थीं” की अपेक्षा सामान्य पाठक के लिए अधिक स्वाभाविक है।
