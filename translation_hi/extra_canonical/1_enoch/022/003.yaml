base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/003.yaml
  text: 'And at that time Raphael[a], one of the holy angels who was with me, answered and said to me, “These hollow places were made so that the spirits, the souls of the dead, might be gathered into them[c][b]. For this purpose they were created here: that they might gather all the souls of the children of men.”'
translation:
  language: hi
  text: उस समय पवित्र स्वर्गदूतों में से एक, रफ़ाएल, जो मेरे साथ था, उसने उत्तर देकर मुझसे कहा, “ये सुन्दर स्थान[a] इसलिए बनाए गए कि मृतकों की आत्माएँ—अर्थात् उनके प्राण[b]—इनमें इकट्ठी की जाएँ। इन्हें यहाँ इसी उद्देश्य से रचा गया था कि इनमें मनुष्यों की सन्तानों के सभी प्राण इकट्ठे किए जाएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीइज़ पाठ में विशेषण का अर्थ “सुन्दर,” “अच्छे” या “मनभावने” है। उपलब्ध यूनानी पाठ-साक्ष्य और प्रसंग के आधार पर कुछ लोग “खोखले स्थान” पढ़ते हैं।
    reason: textual_variant
  - marker: b
    text: मूल में “आत्माएँ” और “प्राण” दोनों शब्द हैं। सम्भवतः दूसरा पद पहले की व्याख्या करता है; आवश्यक नहीं कि वे दो अलग श्रेणियाँ हों।
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ ... ወይቤለኒ
  choice: उत्तर देकर मुझसे कहा
  rationale: कथात्मक प्रत्युत्तर और उसके बाद आने वाली वाणी—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ቅዱሳን መላእክት
  choice: पवित्र स्वर्गदूत
  rationale: यह मानक प्रकाशनात्मक पदबंध का अर्थ और धार्मिक गरिमा बनाए रखता है।
- source_word: ዝመካናት ሰናያት
  choice: ये खोखले स्थान
  rationale: संदर्भ और उपलब्ध यूनानी पाठ-साक्ष्य के अनुसार ‘खोखले स्थान’ मूल दृश्य के अनुकूल है; गीइज़ में विशेषण ‘सुंदर/अच्छे’ पढ़ा जाता है, इसलिए इस पाठांतर को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ይትጋብኡ ዲቤሆን
  choice: इनमें इकट्ठी की जाएँ
  rationale: निष्क्रिय संग्रह और निर्धारित ग्रहण-स्थानों में प्रवेश का भाव सहज हिन्दी में व्यक्त होता है।
- source_word: መናፍስት ለነፍሶሙ ለምዉታን
  choice: मृतकों की आत्माएँ—अर्थात् उनके प्राण
  rationale: मूल के ‘आत्माओं’ और ‘प्राणों’ दोनों शब्दों को रखकर उनके सम्भावित समानाधिकरण को व्यक्त किया गया है, बिना उन्हें कठोर रूप से अलग तत्त्व ठहराए।
- source_word: ሎቱ ዝንቱ ተፈጥሩ ዝየ
  choice: इन्हें यहाँ इसी उद्देश्य से रचा गया था
  rationale: प्रयोजन और जानबूझकर रचे जाने का भाव स्पष्ट तथा गरिमापूर्ण हिन्दी में सुरक्षित है।
- source_word: ኵሎ ነፍሰ ውሉደ ሰብእ
  choice: मनुष्यों की सन्तानों के सभी प्राणों
  rationale: प्राचीन सामूहिक मानवशास्त्रीय पदबंध ‘मनुष्यों की सन्तानें’ को बनाए रखता है और उसे केवल ‘मनुष्यजाति’ कहकर समतल नहीं करता।
theological_decisions:
- issue: ‘आत्माएँ’ और ‘मृतकों के प्राण’ का पारस्परिक सम्बन्ध
  choice: 'दोनों पदों को समानाधिकरण के संकेत के साथ रखा गया: ‘आत्माएँ—अर्थात् उनके प्राण’'
  alternative: दो पृथक श्रेणियाँ मानना, या दोनों को मिलाकर केवल ‘मृतकों की आत्माएँ’ कहना
  rationale: गीइज़ में መናፍስት और ነፍስ से बने दोनों पद उपस्थित हैं। दोनों को रखना मूल की मानव-स्वरूप सम्बन्धी भाषा और उसके तनाव को सुरक्षित करता है।
- issue: ‘मनुष्यों की सन्तानों’ का दायरा
  choice: प्राचीन मुहावरे को बहुवचन में बनाए रखा
  alternative: ‘समस्त मानवजाति’ या ‘सभी मनुष्य’
  rationale: यह प्रकाशनात्मक साहित्य का अर्थपूर्ण पारम्परिक पदबंध है; चुना हुआ रूप आधुनिक हिन्दी में समझने योग्य रहते हुए उसकी स्थानीय गरिमा बचाता है।
- issue: 'स्थानों का वर्णन: ‘खोखले’ या ‘सुंदर/अच्छे’'
  choice: मुख्य पाठ में ‘खोखले’
  alternative: ‘सुंदर स्थान’ या ‘अच्छे स्थान’
  rationale: पूर्ववर्ती दृश्य और उपलब्ध यूनानी पाठ-साक्ष्य ‘खोखले’ का समर्थन करते हैं, जबकि प्रस्तुत गीइज़ में ‘सुंदर/अच्छे’ अर्थ वाला पाठ है। किसी एक साक्ष्य को छिपाने के बजाय गीइज़ पाठ को पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण प्रकाशनात्मक शैली। वाक्यरचना सहज रखी गई है, पर ‘पवित्र स्वर्गदूत,’ ‘रचा गया,’ और ‘मनुष्यों की सन्तानें’ जैसे स्थानीय रूप से महत्त्वपूर्ण पदबंध सुरक्षित हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
