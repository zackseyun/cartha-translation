base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/001.yaml
  text: And from there I went to another place[a], and he showed me in the west a great and high mountain[b], and a hard rock.
translation:
  language: hi
  text: और वहाँ से मैं एक और स्थान पर गया, और उसने मुझे पश्चिम में एक विशाल और ऊँचा पर्वत[a] तथा एक कठोर चट्टान[b] दिखाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल पाठ पर्वत के लिए विशालता और ऊँचाई—दोनों गुण अलग-अलग बनाए रखता है; इसे ‘एक विशाल, ऊँचा पर्वत’ भी अनूदित किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम पदबंध का अनुवाद ‘एक ठोस चट्टान’ या ‘एक दृढ़ चट्टान’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እምህየ
  choice: वहाँ से
  rationale: यह पिछले दर्शनीय स्थान से आगे की गति को सूचित करता है; ‘वहाँ से’ आधुनिक हिन्दी में स्वाभाविक और स्थानिक अर्थ के प्रति निष्ठावान है।
- source_word: ሖርኩ
  choice: मैं ... गया
  rationale: प्रथम पुरुष में साधारण गमन-क्रिया को सीधे कथात्मक ढंग से व्यक्त करता है, बिना ‘यात्रा की’ जैसी अतिरिक्त छाया जोड़े।
- source_word: ካልአ መካነ
  choice: दूसरी जगह
  rationale: पहले स्थान से भिन्न एक और स्थान का अर्थ सुरक्षित रहता है; यह सामान्य पाठक के लिए सहज है।
- source_word: አርአየኒ
  choice: उसने मुझे ... दिखाई
  rationale: मूल में तृतीय पुरुष पुल्लिंग कर्ता निहित है, पर उसका पदनाम नहीं दिया गया; इसलिए केवल सर्वनाम रखा गया है।
- source_word: በምዕራብ
  choice: पश्चिम में
  rationale: स्थानवाचक दिशा को संक्षेप और स्पष्ट रूप में व्यक्त करता है।
- source_word: ደብረ ዐቢየ ወነዋኅ
  choice: एक विशाल और ऊँचा पर्वत
  rationale: ‘पर्वत’ के साथ महानता/विशालता और ऊँचाई—दोनों अलग गुणों को सुरक्षित रखा गया है।
- source_word: ኵኵሐ ጽኑዐ
  choice: एक कठोर चट्टान
  rationale: चट्टान की दृढ़ता, ठोसपन अथवा कठोरता का भौतिक बिंब बनाए रखता है; ‘कठोर’ मुख्य पाठ में सीधा और स्वाभाविक है।
theological_decisions:
- issue: मार्गदर्शक कर्ता को स्पष्ट रूप से स्वर्गदूत कहना या न कहना
  choice: केवल ‘उसने मुझे’ रखा गया है।
  alternative: ‘स्वर्गदूत ने मुझे’ अथवा ‘मेरे मार्गदर्शक ने मुझे’
  rationale: गीज़ क्रिया में केवल तृतीय पुरुष पुल्लिंग कर्ता निहित है। प्रसंग किसी स्वर्गदूतीय मार्गदर्शक की ओर संकेत कर सकता है, पर इस पद में उसका नाम या पद नहीं है; इसलिए उसे जोड़ना मूल से अधिक स्पष्टता थोपना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘पर्वत’ दर्शनीय साहित्य के अनुरूप औपचारिक है, जबकि वाक्य-विन्यास सामान्य पाठकों के लिए सहज रखा गया है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न अपने संबंधित पदबंधों के तुरंत बाद दिए गए हैं।
