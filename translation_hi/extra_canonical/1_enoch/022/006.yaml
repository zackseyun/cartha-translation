base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/006.yaml
  text: At that time I asked Raphael[a], the angel who was with me, and I said to him[c][b], “This spirit whose voice reaches thus and accuses—to whom does it belong?”
translation:
  language: hi
  text: उस समय मैंने अपने साथ मौजूद स्वर्गदूत रफ़ाएल से पूछा और उससे कहा, “यह आत्मा, जिसकी आवाज़ इस प्रकार पहुँचती है और जो आरोप लगाती है, किसकी है?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फरियाद करती है।” अंतिम क्रिया में शिकायत, आरोप या आग्रहपूर्ण निवेदन का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ውእቱ፡ ጊዜ
  choice: उस समय
  rationale: यह कथात्मक समय-सूचक पदबंध का सहज और गरिमापूर्ण हिन्दी रूप है।
- source_word: ተስእልክዎ
  choice: मैंने ... से पूछा
  rationale: क्रिया सीधे हनोक द्वारा व्याख्या करने वाले स्वर्गदूत से प्रश्न पूछने को व्यक्त करती है।
- source_word: ለሩፋኤል፡ መልአክ
  choice: स्वर्गदूत रफ़ाएल
  rationale: व्यक्तिवाचक नाम का लिप्यंतरण किया गया है और पदवी का अनुवाद; यह क्रम आधुनिक हिन्दी में स्वाभाविक है।
- source_word: እንዘ፡ ሀሎ፡ ምስሌየ
  choice: अपने साथ मौजूद
  rationale: यह रफ़ाएल को उस समय हनोक के साथ उपस्थित मार्गदर्शक के रूप में पहचानता है।
- source_word: ዝመንፈስ
  choice: यह आत्मा
  rationale: መንፈስ का मूल अर्थ ‘आत्मा/प्राण’ है; मृतकों के निवास के इस प्रसंग में ‘आत्मा’ सामान्य हिन्दी पाठक के लिए स्पष्ट है और अनावश्यक दार्शनिक विशिष्टता नहीं जोड़ता।
- source_word: ዘከመዝ፡ ቃሉ፡ ይበጽሕ
  choice: जिसकी आवाज़ इस प्रकार पहुँचती है
  rationale: ቃል यहाँ सुनाई देने वाली पुकार के अर्थ में ‘आवाज़’ है, और ይበጽሕ पहुँचने या आ जाने का भाव रखता है।
- source_word: ወይሰኪ
  choice: और आरोप लगाती है
  rationale: प्रसंग में हाबिल की आत्मा कैन के विरुद्ध न्यायिक शिकायत करती है; ‘आरोप लगाती है’ उस विधिक भाव और निकटवर्ती पदों में क्रिया की पुनरावृत्ति को सुरक्षित रखता है।
theological_decisions:
- issue: अधोलोक के दृश्य में መንፈስ का अनुवाद
  choice: आत्मा
  alternative: प्राण; रूह
  rationale: ‘आत्मा’ आधुनिक मानक हिन्दी में मृत व्यक्ति की देहरहित सत्ता के लिए स्वाभाविक है, पर पाठ से आगे बढ़कर बाद की किसी विशिष्ट मानवशास्त्रीय धारणा को निर्धारित नहीं करता।
- issue: आत्मा की पुकार बताने वाली अंतिम क्रिया का न्यायिक या विनयात्मक अर्थ
  choice: आरोप लगाती है
  alternative: फरियाद करती है; विनती करती है
  rationale: इस अध्याय में हाबिल की कैन के विरुद्ध पुकार और संबंधित पदों में इसी क्रिया की पुनरावृत्ति न्यायिक शिकायत का प्रबल संकेत देती है; पादटिप्पणी विनयात्मक अर्थ की शाब्दिक संभावना को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। मूल की कुछ पुनरुक्ति—‘पूछा और उससे कहा’—जानबूझकर सुरक्षित रखी गई है।
