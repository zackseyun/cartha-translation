base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/002.yaml
  text: And there were four hollow places in it[a], deep and wide and very smooth; three of them were dark, and one was bright, and water was springing up in its midst. And I said, “How smooth these hollow places are[c][b], and deep and dark to look at.”
translation:
  language: hi
  text: और उसमें चार खोखले स्थान थे—गहरे, चौड़े और बहुत चिकने[a]। उनमें से तीन अंधकारमय थे और एक उजला था; उसके बीच में पानी फूट रहा था[b]। तब मैंने कहा, “ये खोखले स्थान कितने चिकने[c], गहरे और देखने में अंधकारमय हैं!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद का गीइज़ पाठ कुछ स्थानों पर कठिन है, विशेषकर खोखले स्थानों को ‘चिकना’ कहने में। आशय यह भी हो सकता है कि उनकी सतह सीधी, खड़ी या घिसकर चमकीली दिखाई देती थी।
    reason: lexical_alternative
  - marker: b
    text: कुछ व्याख्याकार जल के इस वर्णन को उजले खोखले स्थान के बीच स्थित किसी सोते या जलधारा से जोड़ते हैं।
    reason: alternative_reading
  - marker: c
    text: या, “कितने गहरे और बहुत चिकने।”
    reason: previous_rendering
lexical_decisions:
- source_word: አርባዕቱ መካናት
  choice: चार खोखले स्थान
  rationale: መካናት का सामान्य अर्थ ‘स्थान’ है, पर पहाड़ अथवा चट्टान के भीतर के इस दृश्य में ‘खोखले स्थान’ आंतरिक गुहाओं का भाव स्पष्ट करता है, बिना उन्हें निश्चित रूप से कक्ष या गुफाएँ ठहराए।
- source_word: ዕሙቀ ወርኂበ ወልሙጸ ጥቀ
  choice: गहरे, चौड़े और बहुत चिकने
  rationale: 'विशेषणों की पूरी शृंखला को अलग-अलग सुरक्षित रखा गया है: ዕሙቀ ‘गहरे’, ርኂበ ‘चौड़े’, और ልሙጸ ጥቀ ‘बहुत चिकने’। इससे ‘चौड़े’ का स्वतंत्र भौतिक वर्णन छूटता नहीं है।'
- source_word: ጸልማት / ብርህት
  choice: अंधकारमय / उजला
  rationale: ये सहज हिन्दी विशेषण तीन स्थानों और एक स्थान के बीच प्रकाश-अंधकार का स्पष्ट विरोध बनाए रखते हैं।
- source_word: ነቅዐ ማይ
  choice: पानी फूट रहा था
  rationale: यह पद स्थिर जल की उपस्थिति से अधिक, जल के स्रोत से निकलने या उमड़ने का सक्रिय चित्र देता है।
- source_word: በማእከላ
  choice: उसके बीच में
  rationale: एकवचन सर्वनाम का संदर्भ जानबूझकर खुला रखा गया है; निकटतम उजले स्थान का संकेत संभव है, पर पाठ इसे पूरी तरह निर्विवाद नहीं बनाता।
- source_word: ለነጽሮ
  choice: देखने में
  rationale: यह दृष्टिगत प्रभाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और दर्शन-वृत्तांत का निरीक्षणात्मक स्वर बनाए रखता है।
theological_decisions:
- issue: वर्णन के बाद वक्ता का सूत्र
  choice: तब मैंने कहा
  alternative: तब मैंने देखा; अथवा बिना कथन-सूत्र के सीधा विस्मय-वाक्य
  rationale: प्रेषित गीइज़ पाठ का प्रथम-पुरुष कथन-सूत्र दृष्टा की प्रतिक्रिया को बनाए रखता है; इसे केवल दृश्य-वर्णन बना देना प्रकाशन-साहित्य की कथात्मक शैली को सपाट कर देता।
- issue: जल का स्थान
  choice: उसके बीच में पानी फूट रहा था
  alternative: उजले खोखले स्थान के बीच में पानी फूट रहा था
  rationale: निकटवर्ती एकवचन ‘उजला’ इस अर्थ का समर्थन करता है, लेकिन सर्वनाम के संदर्भ को मुख्य पाठ में स्पष्ट करके अनिश्चितता को समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और दर्शन-वृत्तांत के अनुकूल। ‘खोखले स्थान’ तकनीकी ‘कक्ष’ की अपेक्षा मूल की स्थानगत अस्पष्टता बचाता है। ‘चिकने’ की असामान्य छवि को सामान्य बनाकर हटाया नहीं गया; उसकी पाठगत कठिनाई पादटिप्पणी में दी गई है।
