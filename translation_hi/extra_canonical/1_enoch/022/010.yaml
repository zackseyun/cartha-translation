base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/010.yaml
  text: And so it was made for sinners[a], when they die and are buried in the earth[c][b], and judgment has not come upon them during their lifetime.
translation:
  language: hi
  text: और इसी प्रकार वह उन पापियों के लिए बनाया गया है जो मरते और धरती में दफनाए जाते हैं, और जिन पर उनके जीवनकाल में न्याय नहीं आया।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “वह” पिछले प्रसंग में मृतकों के लिए बताए गए अलग स्थान या प्रबंध की ओर संकेत करता जान पड़ता है। मूल क्रिया का अनुवाद “रचा गया” या “नियुक्त किया गया” भी हो सकता है।
    reason: cross_reference_and_lexical_alternative
  - marker: b
    text: 'वाक्य का संबंध इस प्रकार भी समझा जा सकता है: “यह पापियों के लिए बनाया गया—उनके लिए जो मरते और धरती में दफनाए जाते हैं, जबकि उनके जीवनकाल में उन पर न्याय नहीं आया।”'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: በከመ፡ ከማሁ
  choice: और इसी प्रकार
  rationale: दोनों तुलनात्मक अव्यय पिछले वर्णन से संबंध और उसके अनुरूप व्यवस्था का भाव देते हैं; यह अनुवाद उस संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ተፈጥረ
  choice: वह ... बनाया गया
  rationale: निष्क्रिय पूर्ण क्रिया किसी स्थापित या निर्मित व्यवस्था की ओर संकेत करती है। संदर्भ से प्राप्त कर्ता को ‘वह’ के रूप में खुला रखा गया है; ‘नियुक्त किया गया’ की अपेक्षा ‘बनाया गया’ कम व्याख्यात्मक है।
- source_word: ለኃጥኣን
  choice: पापियों के लिए
  rationale: दत्तिव पद उन लोगों को बताता है जिनके लिए यह व्यवस्था है; न्याय के प्रसंग में ‘पापियों’ सीधा और परिचित शब्द है।
- source_word: ሶበ፡ ይመውቱ፡ ወይትቀበሩ
  choice: जब वे मरते हैं और ... गाड़े जाते हैं
  rationale: यह कालवाचक उपवाक्य और दफनाए जाने का निष्क्रिय भाव दोनों सुरक्षित रखता है।
- source_word: ውስተ፡ ምድር
  choice: धरती में
  rationale: दफन के संदर्भ में यह मिट्टी/पृथ्वी की ठोस छवि बनाए रखता है और भौगोलिक ‘देश’ के अर्थ से बचता है।
- source_word: ወኵነኔ፡ ኢኮነ፡ በላዕሌሆሙ
  choice: और ... उन पर न्याय नहीं आया
  rationale: मूल पाठ न्याय के उनके ऊपर न आने की बात करता है; अनुवाद इसे ‘दण्डादेश’ जैसे अधिक संकुचित अर्थ में नहीं बाँधता।
- source_word: በሕይወቶሙ
  choice: उनके जीवनकाल में
  rationale: यह पृथ्वी पर जीवित अवस्था और मृत्यु के बाद की अवस्था के बीच कालगत विरोध को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: पापियों के लिए मृत्यु के बाद की व्यवस्था का स्वरूप
  choice: पद को ऐसी व्यवस्था के रूप में रखा गया है जो उन पापियों से संबंधित है जिन पर जीवित रहते न्याय नहीं आया।
  alternative: इसे अधिक निश्चित रूप से ‘यह स्थान पापियों के लिए रचा गया था’ कहा जा सकता है, अथवा केवल मृत्यु और दफन का उल्लेख माना जा सकता है।
  rationale: मूल में निष्क्रिय क्रिया का स्पष्ट कर्ता नहीं है और वह पिछले संदर्भ पर निर्भर है। इसलिए अनुवाद किसी विशिष्ट स्थान, विनाश या अंतिम दोषमुक्ति को पाठ में नहीं जोड़ता।
- issue: न्याय का कालगत अर्थ
  choice: ‘उनके जीवनकाल में उन पर न्याय नहीं आया’
  alternative: ‘उनके जीवित रहते उन्हें दण्ड नहीं मिला’
  rationale: ‘न्याय’ मूल के न्यायिक अर्थ और उसकी व्यापकता को सुरक्षित रखता है; ‘दण्ड’ परिणाम को पहले ही निश्चित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘पापी’, ‘न्याय’ और ‘धरती में गाड़े जाते हैं’ जैसे परिचित पद मूल की न्याय और दफन संबंधी छवियों को बनाए रखते हैं।
