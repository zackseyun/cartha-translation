base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/007.yaml
  text: And he answered me and said to me[a], “This is the spirit that came out from Abel, whom Qayin his brother killed; and it makes accusation against him until his seed is destroyed from before the face of the earth[d][c][b], and his seed is blotted out from among the seed of men.”
translation:
  language: hi
  text: उसने मुझे उत्तर दिया और मुझसे कहा[a], “यह वह आत्मा है जो आबेल से निकली थी, जिसे उसके भाई क़ायिन ने मार डाला था। वह उसके विरुद्ध अभियोग लगाती रहती है[b], जब तक कि उसका वंश पृथ्वी के मुख पर से नष्ट न हो जाए और मनुष्यों के वंश में से उसका वंश मिट न जाए[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राप्त पाठ में ‘और मुझसे कहा’ कोष्ठकों में है। मूल कथन-सूत्र को पूरा दिखाने के लिए मुख्य पाठ में ‘मुझे उत्तर दिया’ और ‘मुझसे कहा’ दोनों रखे गए हैं। इसे अधिक शाब्दिक रूप से ‘उसने मुझे उत्तर दिया और मुझसे कहा, यह कहते हुए’ भी अनूदित किया जा सकता है।
    reason: textual_variant
  - marker: b
    text: '‘अभियोग लगाती रहती है’ में न्यायिक भाव है: आबेल की आत्मा केवल अपना दुःख नहीं सुनाती, बल्कि न्याय के लिए अभियोगकर्ता की तरह पुकारती रहती है।'
    reason: lexical_alternative
  - marker: c
    text: जिस शब्द का अनुवाद ‘वंश’ किया गया है, उसका शाब्दिक अर्थ ‘बीज’ भी हो सकता है। मूल में यह शब्द बार-बार आता है और वंशावली पर पड़ने वाले न्याय को उभारता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአኒ / ወይቤለኒ
  choice: उसने मुझे उत्तर दिया और मुझसे कहा
  rationale: दोनों कथन-क्रियाओं और प्रथम पुरुष कर्म-सूचक प्रत्यय को रखा गया है। दूसरी क्रिया पांडुलिपि-साक्ष्य में कोष्ठकबद्ध है, इसलिए पाठांतर को पादटिप्पणी में बताया गया है।
- source_word: መንፈስ
  choice: आत्मा
  rationale: यहाँ अधोलोक-दर्शन में आबेल की मृत्यु के बाद विद्यमान व्यक्तिगत सत्ता अभिप्रेत है; आधुनिक हिन्दी में ‘आत्मा’ इस अर्थ को ‘श्वास’ या ‘वायु’ से अधिक स्पष्ट रूप से व्यक्त करती है।
- source_word: ዘወጽአ እምአቤል
  choice: जो आबेल से निकली थी
  rationale: ‘निकलना’ स्रोत की जीवंत गमन-छवि को बनाए रखता है और हिन्दी में सहज भी है।
- source_word: ዘቀተሎ ቃየን እኁሁ
  choice: जिसे उसके भाई क़ायिन ने मार डाला था
  rationale: वाक्य-संबंध स्पष्ट रखते हुए नामों को स्रोत-परंपरा के निकट ‘आबेल’ और ‘क़ायिन’ रूप में लिखा गया है।
- source_word: ይሰኪ ኪያሁ
  choice: वह उसके विरुद्ध अभियोग लगाती रहती है
  rationale: ‘अभियोग’ न्यायिक और न्याय की पुकार वाले भाव को सुरक्षित रखता है; ‘लगाती रहती है’ क्रिया की चलती हुई कार्रवाई को व्यक्त करता है। सर्वनाम को नाम से बदलकर स्रोत की संभावित संदर्भ-रचना को अनावश्यक रूप से नहीं सुलझाया गया।
- source_word: ይትኀጐል ዘርኡ / ይማስን ዘርኡ
  choice: उसका वंश ... नष्ट न हो जाए / उसका वंश मिटा न दिया जाए
  rationale: दोनों समानांतर न्याय-वाक्यों में एक ही वंश-सूचक शब्द दोहराया गया है, जबकि अलग क्रियाएँ विनाश और मिटाए जाने की तीव्रता को बनाए रखती हैं।
- source_word: እምቅድመ ገጸ ለምድር
  choice: पृथ्वी के मुख पर से
  rationale: यह प्रचलित सामी रूपक को गरिमापूर्ण और हिन्दी में समझ आने योग्य ढंग से सुरक्षित रखता है।
- source_word: እምዘርአ ሰብእ
  choice: मनुष्यों के वंश में से
  rationale: यह मानव-वंशावली में से हटा दिए जाने का अर्थ देता है और पहले आए ዘር (‘वंश/बीज’) से शब्दगत संबंध बनाए रखता है।
theological_decisions:
- issue: मृत आबेल की परलोकगत उपस्थिति को कैसे व्यक्त किया जाए
  choice: आत्मा
  alternative: प्राण, छाया या आवाज़
  rationale: स्रोत स्पष्ट रूप से መንፈስ कहता है। ‘आत्मा’ दर्शन की परलोकगत और व्यक्तिगत वास्तविकता को बिना नरम किए सुरक्षित रखती है।
- issue: क़ायिन के वंश पर न्याय की वंशावली-संबंधी भाषा
  choice: उसका वंश ... उसका वंश
  alternative: उसकी सन्तान / उसके वंशज
  rationale: स्रोत एक ही शब्द ዘር को दोहराता है। ‘वंश’ इस सामूहिक और वंशावली-संबंधी आयाम को आधुनिक हिन्दी में स्वाभाविक रूप से बनाए रखता है।
- issue: आबेल की आत्मा की न्यायिक भूमिका
  choice: उसके विरुद्ध अभियोग लगाती रहती है
  alternative: उस पर दोष लगाती है / उसकी शिकायत करती है
  rationale: यह पाठ आत्मा को न्याय की माँग करने वाले अभियोगकर्ता के रूप में प्रस्तुत करता है; अनुवाद उस तनाव को केवल व्यक्तिगत शिकायत में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर दर्शनात्मक और न्याय-संबंधी प्रसंग के अनुरूप गरिमापूर्ण रखी गई है। ‘पृथ्वी के मुख पर से’ जैसे सामी मुहावरे को जानबूझकर सुरक्षित रखा गया है। नाम स्रोत-परंपरा के निकट ‘आबेल’ और ‘क़ायिन’ लिखे गए हैं।
