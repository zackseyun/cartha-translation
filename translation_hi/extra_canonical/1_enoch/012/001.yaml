translation:
  language: hi
  text: 'इन सब बातों से पहले हनोक छिपा दिया गया था। मनुष्यों में से कोई नहीं जानता था कि वह कहाँ छिपाया गया था, कहाँ था और उसका क्या हुआ। उन दिनों उसके सारे कार्य पवित्र जनों और पहरेदारों[a] के साथ थे।


    मैं, हनोक, महान प्रभु और संसार के राजा की स्तुति कर रहा था। तभी पहरेदारों ने मुझे—हनोक नामक लेखक को—बुलाया और मुझसे कहा:


    “हे हनोक, धार्मिकता के लेखक, जाओ और स्वर्ग के उन पहरेदारों को बता दो जिन्होंने ऊँचे स्वर्ग और अनन्त पवित्र स्थान को छोड़ दिया, स्त्रियों के साथ अपने को अशुद्ध किया, मनुष्यों की सन्तानों के समान आचरण किया और अपने लिए पत्नियाँ ले लीं। उन्होंने पृथ्वी पर बहुत बड़ा भ्रष्टाचार किया है। पृथ्वी पर उन्हें न तो शान्ति मिलेगी, न पापों की क्षमा। वे अपनी सन्तानों से आनन्दित होते हैं, पर वे अपने प्रिय जनों का वध देखेंगे; वे अपनी सन्तानों के विनाश पर विलाप करेंगे और सदा विनती करेंगे, किन्तु उन्हें न दया मिलेगी, न शान्ति।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पहरेदार’ यहाँ स्वर्गीय प्राणियों के एक विशेष समूह का नाम है; आगे इसी समूह के कुछ सदस्य स्वर्ग छोड़ने वाले बताए गए हैं।
    reason: technical_term
lexical_decisions:
- source_word: ተከብተ
  choice: छिपा दिया गया था / छिपाया गया
  rationale: सन्दर्भ में यह रूप हनोक के अदृश्य या गुप्त कर दिए जाने का बोध देता है। हिन्दी में कर्मवाच्य मूल की अस्पष्ट कर्तृता को बनाए रखता है।
- source_word: ትጉሃን
  choice: पहरेदार
  rationale: यह 1 हनोक में स्वर्गीय ‘Watchers’ के लिए प्रयुक्त तकनीकी पद है। ‘पहरेदार’ सहज हिन्दी है और उनकी निगरानी-संबंधी भूमिका को व्यक्त करता है।
- source_word: ጸሓፊ / ጸሓፌ ጽድቅ
  choice: लेखक / धार्मिकता के लेखक
  rationale: मूल पद लिखने वाले व्यक्ति को सूचित करता है। ‘लेखक’ सामान्य पाठक के लिए स्पष्ट है; संबंधवाची पदबंध को बिना अतिरिक्त व्याख्या के रखा गया है।
- source_word: ማሰኑ / ሙስና
  choice: अशुद्ध किया / भ्रष्टाचार
  rationale: एक ही शब्द-परिवार आत्म-अपवित्रीकरण तथा पृथ्वी पर विनाशकारी भ्रष्टता दोनों को व्यक्त करता है। प्रसंग के अनुसार हिन्दी में अलग स्वाभाविक पद चुने गए हैं।
- source_word: ኅድገተ ኀጢአት
  choice: पापों की क्षमा
  rationale: शाब्दिक अर्थ पाप को छोड़ना या क्षमा करना है; ‘पापों की क्षमा’ आधुनिक धार्मिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: ይትፌሥሑ
  choice: आनन्दित होते हैं
  rationale: मूल में प्रसन्न होने या आनन्द मनाने का भाव है। आगामी दण्ड के साथ उपस्थित तनाव को बदले बिना रखा गया है।
- source_word: ቀትለ ፍቁራኒሆሙ
  choice: अपने प्रिय जनों का वध
  rationale: पदबंध का निकट अर्थ ‘उनके प्रिय जनों की हत्या/वध’ है। इसे केवल ‘सन्तानों की मृत्यु’ बनाकर निहित संबंध को अधिक निश्चित नहीं किया गया।
theological_decisions:
- issue: पहरेदारों की पहचान
  choice: स्वर्गीय प्राणियों के लिए ‘पहरेदार’ पद रखा गया
  alternative: उन्हें सीधे ‘स्वर्गदूत’ कहना
  rationale: मूल में विशिष्ट पद ትጉሃን है। ‘स्वर्गदूत’ कहने से उनकी श्रेणी को मूल की अपेक्षा अधिक निश्चित कर दिया जाता।
- issue: हनोक के छिपाए जाने की कर्तृता
  choice: कर्मवाच्य ‘छिपा दिया गया था’
  alternative: ‘परमेश्वर ने हनोक को छिपा दिया था’
  rationale: मूल वाक्य में छिपाने वाला स्पष्ट नहीं है; इसलिए किसी दिव्य कर्ता को पाठ में नहीं जोड़ा गया।
- issue: दोषी पहरेदारों के लिए क्षमा और शान्ति
  choice: घोषणा को मूल के पूर्ण निषेध के रूप में रखा गया
  alternative: पश्चात्ताप की सम्भावना या दण्ड की अवधि की व्याख्या जोड़ना
  rationale: स्रोत उनके लिए न शान्ति, न पाप-क्षमा, न दया घोषित करता है। अनकही धर्मवैज्ञानिक व्यवस्था पाठ में नहीं जोड़ी गई।
- issue: सन्तानों पर आनन्द और आगामी वध का तनाव
  choice: दोनों कथनों को साथ रखा गया
  alternative: पहले कथन को ‘यद्यपि वे अपनी सन्तानों से प्रेम करते हैं’ के रूप में व्याख्यायित करना
  rationale: मूल का आनन्द-सूचक क्रियापद और दण्डसूचक अगला वाक्य तनावपूर्ण हैं; अनुवाद ने उस तनाव को चुपचाप हल नहीं किया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक और सामान्य पाठकों के लिए स्पष्ट रखी गई है। स्रोत में उपलब्ध पूरा कथन अनूदित किया गया है, यद्यपि प्रचलित पद-विभाजन में इसकी सामग्री एक से अधिक पदों में मिल सकती है। प्रत्यक्ष वचन को हिन्दी में स्वाभाविक बनाने के लिए अनुच्छेदों में बाँटा गया है; मूल के अस्पष्ट कर्ता और दण्ड-विषयक कठोरता को यथावत रखा गया है।
