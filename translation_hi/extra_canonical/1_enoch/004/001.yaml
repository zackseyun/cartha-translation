base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/004/001.yaml
  text: And again[a], observe the days of summer—how the sun comes upon it at its beginning, and you seek shelter and shade because of the heat of the sun[c][b], and the earth is scorched with burning heat, and you cannot tread on the earth or upon a rock because of its heat.
translation:
  language: hi
  text: और फिर, ग्रीष्म के दिनों को ध्यान से देखो[c]—कि उसके आरम्भ में सूर्य उस पर कैसे पड़ता है[a]। सूर्य की तपिश के कारण तुम ओट और छाया[b] ढूँढ़ते हो; धरती प्रचंड ताप से झुलस जाती है, और उसकी गरमी के कारण तुम न धरती पर, न चट्टान पर पाँव रख सकते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कि उसके आरम्भ में सूर्य उस पर कैसे पड़ता है’ वाला उपवाक्य गीइज़ में कठिन है। इसका अधिक विशिष्ट आशय ग्रीष्म के आरम्भ में सूर्य के प्रबल होने से हो सकता है।
    reason: textual_variant
  - marker: b
    text: ‘ओट और छाया’ मूल के दो निकटार्थी पदों को सुरक्षित रखता है; उन्हें एक ही शब्द में नहीं समेटा गया है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘ग्रीष्म के दिनों के विषय में पूछो।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ዳግመ
  choice: और फिर
  rationale: यह पिछले उदाहरण के समान एक और उदाहरण आरम्भ करने वाला कथन-सूचक शब्द है; ‘और फिर’ उसकी पुनरावृत्तिपरक शैली बनाए रखता है।
- source_word: ጠየቁ
  choice: ध्यान दो
  rationale: यह बहुवचन आज्ञार्थक क्रिया है। मूल क्रिया में पूछने या जाँचने का भाव हो सकता है, पर प्राकृतिक घटनाओं को देखने के प्रसंग में ‘ध्यान दो’ सहज है; वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: መዋዕለ ሐጋይ
  choice: ग्रीष्म के दिन
  rationale: यह गरमी की ऋतु के दिनों को ठोस कालगत अभिव्यक्ति में प्रस्तुत करता है; ‘ग्रीष्म’ आधुनिक मानक हिन्दी में गरिमापूर्ण और स्पष्ट है।
- source_word: ከመ ኮነ ፀሓይ ላዕሌሃ በቅድሜሃ
  choice: कि उसके आरम्भ में सूर्य कैसे उस पर आ पड़ता है
  rationale: यह कठिन उपवाक्य आरम्भिक ग्रीष्म और सूर्य की क्रिया का सम्बन्ध दिखाता है। ‘आ पड़ता है’ मूल की दिशात्मक छवि को बनाए रखता है, जबकि अस्पष्टता पादटिप्पणी में स्वीकार की गई है।
- source_word: ተኀሥሡ
  choice: ढूँढ़ते हो
  rationale: क्रिया सुरक्षा या राहत की खोज व्यक्त करती है; अगले दो संज्ञापदों के साथ यह हिन्दी में स्वाभाविक है।
- source_word: ምጽላለ ወጽላሎተ
  choice: ओट और छाया
  rationale: दोनों निकटार्थी पदों को एक में समेटने के बजाय मूल का युग्म सुरक्षित रखा गया है। ‘ओट’ आश्रय या आड़ और ‘छाया’ धूप से राहत का भाव देती है।
- source_word: በእንተ ዋዕየ ፀሓይ
  choice: सूर्य की तपिश के कारण
  rationale: यह सूर्य की तीखी गरमी को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ወምድርኒ ትውዒ እሙቀተ ሐሩር
  choice: धरती भी प्रचंड गरमी से तप जाती है
  rationale: यह तीव्र ताप से धरती के तपने के परिणामात्मक और सजीव भाव को सुरक्षित रखता है।
- source_word: ኢትክሉ ከይዶታ ለምድር ወኢ ኰኵሐ በእንተ ዋዕያ
  choice: उसकी गरमी के कारण तुम न धरती पर चल सकते हो, न चट्टान पर
  rationale: सुधारित पूर्ण स्रोत में उपस्थित अंतिम उपवाक्य को शामिल किया गया है। ‘चल सकते हो’ तपती सतह पर पैर रखने या चलने का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: प्राकृतिक दृश्य का नैतिक-धार्मिक साक्ष्य
  choice: पद को सृष्टि की ऋतुगत व्यवस्था के प्रत्यक्ष वर्णन के रूप में रखा गया है।
  alternative: इसे प्रकृति में दैवी न्याय की स्पष्ट व्याख्या बनाकर प्रस्तुत करना।
  rationale: व्यापक प्रसंग सृष्टि की नियमितता से धार्मिक निष्कर्ष निकालता है, पर यह पद स्वयं अवलोकनात्मक है। अनुवाद उस निष्कर्ष को पद के भीतर नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और साधारण पाठकों के लिए सुबोध। ‘ग्रीष्म’, ‘तपिश’, ‘ओट’ और ‘चट्टान’ स्रोत की ठोस प्राकृतिक छवियों को बनाए रखते हैं। कठिन आरम्भिक उपवाक्य और ጠየቁ का वैकल्पिक अर्थ पादटिप्पणियों में सुरक्षित है; किसी संप्रदायगत व्याख्या को पाठ में नहीं जोड़ा गया।
