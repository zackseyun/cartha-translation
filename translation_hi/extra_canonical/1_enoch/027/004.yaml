base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/004.yaml
  text: In the days of their judgment they will bless him for the mercy[b][a], according as he has apportioned to them.
translation:
  language: hi
  text: उनके न्याय के दिनों में वे दया के लिए उसे धन्य कहेंगे[a], जैसा उसने उनके लिए बाँटा है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वे उसे आशीष देंगे”; यहाँ अर्थ है कि वे उसकी स्तुति करेंगे या उसे धन्य कहेंगे।
    reason: idiom
  - marker: b
    text: अंतिम खंड में “बाँटी” गई वस्तु मूल पाठ में स्पष्ट नहीं कही गई है; आशय दया, आशीष, या किसी नियत हिस्से से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: መዋዕለ
  choice: दिनों
  rationale: बहुवचन कालवाचक संज्ञा का सीधा अर्थ ‘दिन’ है; इससे प्रलयकालीन समय-संकेत बना रहता है।
- source_word: ኵነኔሆሙ
  choice: उनके न्याय
  rationale: यह न्यायिक निर्णय या न्याय को सूचित करता है। ‘न्याय’ दंड, दोषसिद्धि या अनुकूल निर्णय में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ይባርክዎ
  choice: वे ... उसे धन्य कहेंगे
  rationale: 'रूपविज्ञान के अनुसार क्रिया का कर्ता तृतीय पुरुष बहुवचन और कर्म तृतीय पुरुष पुल्लिंग एकवचन है: ‘वे उसे आशीष देंगे/धन्य कहेंगे’। हिंदी में परमेश्वर के प्रति मनुष्यों की क्रिया के लिए ‘उसे धन्य कहेंगे’ स्वाभाविक है।'
- source_word: በምሕረት
  choice: उस दया के लिए
  rationale: संदर्भ में वे उसे उसकी दया के कारण धन्य कहते हैं। संज्ञा ‘दया’ को स्पष्ट रखते हुए संबंध को हिंदी में स्वाभाविक बनाया गया है।
- source_word: በከመ
  choice: जितनी
  rationale: यह परिमाण या अनुरूपता का संबंध बताता है; यहाँ दया की मात्रा को अगले वितरणसूचक पद से जोड़ता है।
- source_word: ከፈሎሙ
  choice: उसने उनके लिए ठहराई है
  rationale: मूल क्रिया बाँटने, हिस्सा देने या नियत करने का भाव रखती है। निहित कर्म को ‘दया’ से जोड़ते हुए ‘ठहराई’ हिंदी में सहज है, पर पादटिप्पणी मूल की अस्पष्टता सुरक्षित रखती है।
theological_decisions:
- issue: न्याय दंडात्मक है या दया सहित व्यापक न्यायिक अवसर
  choice: व्यापक ‘न्याय’ रखा गया है, और आगे की दया उसके इस समूह के लिए अनुकूल परिणाम को व्यक्त करती है।
  alternative: ‘दोष-दंड’ या ‘सज़ा’
  rationale: गीज़ शब्द व्यापक न्यायिक अर्थ रखता है। संकीर्ण दंडात्मक अनुवाद पाठ में उपस्थित दया और स्तुति के साथ तनाव को अनावश्यक रूप से हल कर देगा।
- issue: कौन किसे धन्य कहता या आशीष देता है
  choice: वे उसे धन्य कहेंगे
  alternative: वह उन पर दया करके उन्हें आशीष देगा
  rationale: ይባርክዎ में बहुवचन कर्ता और पुल्लिंग एकवचन कर्म-प्रत्यय है; इसलिए धर्मी जन ‘उसे’ धन्य कहते हैं। वैकल्पिक पुराना पाठ रूपविज्ञान से मेल नहीं खाता।
translation_notes:
  register: आधुनिक मानक हिंदी; शैली गरिमापूर्ण पर सामान्य पाठक के लिए सहज है। ‘उसे’ मूल के पुल्लिंग एकवचन कर्म को बनाए रखता है और पाठ में स्पष्ट न किए गए नाम को नहीं जोड़ता।
