base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/003.yaml
  text: In the latter days this will become for them a spectacle of righteous judgment in the presence of the righteous forever[a]; all the days here the wise will bless the Lord of glory[d][c][b], the eternal King.
translation:
  language: hi
  text: अन्तिम दिनों में यह उनके लिए धर्ममय न्याय का एक प्रत्यक्ष दृश्य[b] बन जाएगा, जो धर्मियों के सामने सदा[a] रहेगा; यहाँ हर दिन बुद्धिमान महिमा के प्रभु, अनन्त राजा को धन्य कहेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सदा’ के लिए आया शब्द इस साक्षी में कोष्ठकों में है और पाठ की दृष्टि से अनिश्चित है। यह ‘धर्मियों के सामने’ के साथ जुड़ा हो सकता है अथवा किसी भिन्न पाठ का चिह्न हो सकता है।
    reason: textual_variant
  - marker: b
    text: ‘प्रत्यक्ष दृश्य’ के मूल शब्द का अर्थ ‘चिह्न,’ ‘रूप’ या ‘उदाहरण’ भी हो सकता है। यहाँ न्याय के दिखाई देने वाले सार्वजनिक प्रदर्शन का भाव सम्भव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: በዳኃሪ መዋዕል
  choice: अन्तिम दिनों में
  rationale: यह पदबंध भावी, युगान्त-संबंधी समय की ओर संकेत करता है; हिन्दी में यह स्वाभाविक रहते हुए उस अपोकैलिप्टिक स्वर को बनाए रखता है।
- source_word: አርአያ
  choice: एक प्रत्यक्ष दृश्य
  rationale: शब्द में दृश्य रूप, चिह्न और उदाहरण—तीनों की अर्थ-छायाएँ संभव हैं। न्याय के सार्वजनिक रूप से दिखाई देने पर बल देने के लिए यह चयन किया गया है।
- source_word: ኵነኔ ዘበ ጽድቅ
  choice: धर्ममय न्याय
  rationale: यह न्याय को धार्मिकता अथवा न्यायशीलता से युक्त बताता है और मूल की संक्षिप्त पद-रचना को बनाए रखता है।
- source_word: በቅድመ ጻድቃን
  choice: धर्मियों के सामने
  rationale: यह स्थानिक और सार्वजनिक उपस्थिति का सीधा, स्वाभाविक हिन्दी रूप है।
- source_word: ለዓለም
  choice: सदा
  rationale: ब्रैकेट में सुरक्षित पाठ का सामान्य अर्थ अनन्त अवधि है; उसकी पाठगत अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: ኵሎ መዋዕለ ዝየ
  choice: यहाँ हर दिन
  rationale: ዝየ का स्थानवाचक अर्थ ‘यहाँ’ है। हिन्दी में ‘यहाँ हर दिन’ मूल के ‘सारे दिन यहाँ’ को सहज रूप देता है और इसे ‘इस युग’ नहीं बनाता।
- source_word: ምሑራን
  choice: बुद्धिमान
  rationale: प्रसंग की ज्ञान-साहित्यिक भाषा और उपलब्ध परामर्श-पाठ के अनुसार ‘बुद्धिमान’ चुना गया है; स्रोत-रूप से जुड़ी दूसरी व्युत्पत्तिगत सम्भावना पादटिप्पणी में स्पष्ट की गई है।
- source_word: ለእግዚአ ስብሐት
  choice: महिमा के प्रभु
  rationale: यह उपाधि प्रभुता और महिमा दोनों को स्पष्ट रखती है, बिना किसी बाद की पारिभाषिक अभिव्यक्ति से सामंजस्य बैठाए।
- source_word: ንጉሥ ዘለዓለም
  choice: अनन्त राजा
  rationale: यह परमेश्वर की अनन्त राजसत्ता को संक्षिप्त और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ይባርክዎ
  choice: धन्य कहेंगे
  rationale: परमेश्वर को संबोधित क्रिया के लिए ‘धन्य कहेंगे’ उपासना और स्तुति का भाव रखती है तथा ‘आशीष देंगे’ की संभावित हिन्दी अस्पष्टता से बचती है।
theological_decisions:
- issue: ईश्वरीय उपाधियों का अनुवाद
  choice: महिमा के प्रभु, अनन्त राजा
  alternative: महिमामय प्रभु, सदा के राजा
  rationale: मूल में दोनों उपाधियाँ साथ-साथ रखी गई हैं। चुना हुआ रूप उन्हें अलग और स्पष्ट रखता है तथा किसी उत्तरवर्ती धर्मवैधानिक सूत्र को पाठ पर आरोपित नहीं करता।
- issue: न्याय के दृश्य की अवधि और साक्षी
  choice: जो धर्मियों के सामने सदा रहेगा
  alternative: धर्मियों के सामने सदा धर्ममय न्याय का एक दृश्य
  rationale: यह हिन्दी वाक्य सम्बन्ध को पठनीय बनाता है, पर ‘सदा’ की पाठगत स्थिति निश्चित नहीं मानता; अनिश्चितता पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘यहाँ’ से मूल का स्थानवाचक संकेत सुरक्षित है; ‘इस युग’ अर्थ ग्रहण नहीं किया गया। पाठगत और शब्दगत अनिश्चितताओं को मुख्य पाठ में मनमाने ढंग से हल करने के बजाय पादटिप्पणियों में रखा गया है।
