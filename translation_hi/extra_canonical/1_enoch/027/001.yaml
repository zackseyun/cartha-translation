base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/001.yaml
  text: At that time I said[a], “For what reason is this blessed land, all of it full of trees[b], and this accursed valley in their midst?”
translation:
  language: hi
  text: उस समय मैंने कहा, “इस धन्य भूमि के, जो पूरी-की-पूरी पेड़ों से भरी हुई[a] है, और उनके बीच में स्थित इस शापित घाटी के होने का क्या कारण है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ वनस्पति बताने वाला इथियोपिक पदसमूह उपलब्ध पाठ-साक्ष्य में कठिन है; भाव यह है कि भूमि पेड़ों या घनी वनस्पति से भरपूर है।
    reason: textual_variant
lexical_decisions:
- source_word: ውእቱ፡ ጊዜ
  choice: उस समय
  rationale: यह दर्शन-वर्णन में प्रयुक्त कालसूचक सूत्र का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: እቤ
  choice: मैंने कहा
  rationale: मूल में सामान्य कथन-सूत्र है; आगे प्रश्न होने पर भी ‘मैंने पूछा’ कहने के बजाय निकटतर अर्थ ‘मैंने कहा’ रखा गया है।
- source_word: በእንተ፡ ምንት
  choice: क्यों
  rationale: यह कारण अथवा प्रयोजन की पूछताछ व्यक्त करता है; आधुनिक हिन्दी में ‘किस कारण से’ की अपेक्षा ‘क्यों’ अधिक स्वाभाविक है।
- source_word: ዛቲ፡ ምድር፡ ቡርክት
  choice: यह भूमि … धन्य
  rationale: ምድር यहाँ दर्शन में दिखाई देने वाले स्थानीय भूभाग को सूचित करता है, और ቡርክት का नैतिक-पवित्र विरोध बनाए रखने के लिए ‘धन्य’ चुना गया है।
- source_word: ወኵለንታሃ፡ ምልእት
  choice: और पूरी-की-पूरी … भरी हुई
  rationale: ‘और’ मूल के संयोजक को बनाए रखता है तथा ‘पूरी-की-पूरी’ भूमि की समग्रता पर दिए गए बल को सहज हिन्दी में व्यक्त करता है।
- source_word: ዕፀወ፡ ወዛ፡ ቈላ
  choice: पेड़ों से
  rationale: पाठ-साक्ष्य में यह वनस्पति-संबंधी पदसमूह कठिन है। ‘पेड़ों से’ मुख्य दृश्य को अनावश्यक विशिष्टता के बिना व्यक्त करता है; कठिनाई पादटिप्पणी में बताई गई है।
- source_word: ርጉምት
  choice: शापित
  rationale: यह ‘धन्य’ के साथ जानबूझकर रखे गए धार्मिक-न्यायिक विरोध को सुरक्षित रखता है।
- source_word: ማእከሎሙ
  choice: उनके बीच में
  rationale: यह बहुवचन संबंध को बिना किसी निश्चित पूर्वपद से बाँधे सुरक्षित रखता है और मूल की संभावित संदर्भगत अस्पष्टता को नहीं मिटाता।
theological_decisions:
- issue: धन्य भूमि और शापित घाटी के बीच मूल्यगत विरोध
  choice: ‘धन्य’ / ‘शापित’
  alternative: ‘उपजाऊ’ / ‘बंजर’
  rationale: मूल शब्द केवल कृषि-दशा नहीं, बल्कि आशीष और न्याय से जुड़ा पवित्र-नैतिक विरोध व्यक्त करते हैं; इसलिए उस तनाव को भौतिक भू-दृश्य तक सीमित नहीं किया गया।
- issue: घाटी किसके बीच में है
  choice: ‘उनके बीच में’ कहकर बहुवचन संदर्भ को खुला रखा गया
  alternative: ‘पेड़ों के बीच में’ या ‘उस भूमि के बीच में’
  rationale: मूल का बहुवचन सर्वनाम इस एक पद में स्पष्ट रूप से किसी एक पूर्वपद को निर्धारित नहीं करता; अतः व्याख्यात्मक स्पष्टता थोपने से बचा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर दर्शन-साहित्य के अनुरूप गरिमापूर्ण रखी गई है। वाक्य की संयोजक संरचना को यथासंभव सुरक्षित रखते हुए हिन्दी में प्रश्न को स्वाभाविक बनाया गया है; ‘जबकि’ धन्य भूमि और शापित घाटी के तीखे विरोध को स्पष्ट करता है, बिना उस विरोध की धार्मिक व्याख्या को आगे बढ़ाए।
