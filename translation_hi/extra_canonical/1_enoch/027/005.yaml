base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/005.yaml
  text: At that time I blessed the Lord of glory[b][a], and I spoke and sang praise as is fitting for his majesty.
translation:
  language: hi
  text: उस समय मैंने महिमा के प्रभु को धन्य ठहराया और उसकी महिमा का वर्णन किया[a] और स्तुति-गीत गाया, जैसा उसकी महानता के अनुरूप है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दिए गए गीइज़ प्रतिलेखन में यहाँ पाठ कठिन है और इसका अर्थ ‘मैंने उसके विषय में कहा’ या ‘मैंने उससे कहा’ भी समझा जा सकता है। किन्तु चार्ल्स के मानक पाठ की एक समर्थित रीडिंग ‘उसकी महिमा’ है, जिसकी पुष्टि यूनानी साक्ष्य से भी होती है।
    reason: textual_variant
lexical_decisions:
- source_word: ውእቱ፡ ጊዜ
  choice: उस समय
  rationale: यह सामान्य काल-सूचक पद है; ‘उस समय’ कथात्मक प्रवाह को स्वाभाविक और स्पष्ट रखता है।
- source_word: ባረክዎ
  choice: मैंने ... को धन्य कहा
  rationale: मूल क्रिया का सीधा अर्थ ‘आशीष देना/धन्य कहना’ है। परमेश्वर के संदर्भ में ‘धन्य कहा’ आधुनिक हिन्दी में अर्थ को बिना ‘स्तुति’ वाली अगली क्रिया में मिलाए व्यक्त करता है।
- source_word: ለእግዚአ፡ ስብሐት
  choice: महिमा के प्रभु को
  rationale: यह ‘प्रभु’ और ‘महिमा’ के संबंध को औपचारिक रूप से सुरक्षित रखता है तथा ऊँची उपासना-शैली के अनुकूल है।
- source_word: ወ*ተሎቱ፡ ነገርኩ
  choice: और उसकी महिमा का वर्णन किया
  rationale: दिए गए प्रतिलेखन में यह पद संदिग्ध है, पर चार्ल्स के मानक पाठ की सूचित पाठ-पुनर्स्थापना ወስብሐቲሁ ነገርኩ (‘और मैंने उसकी महिमा घोषित/वर्णित की’) तथा यूनानी साक्ष्य इसी अर्थ का समर्थन करते हैं। पाठगत कठिनाई पादटिप्पणी में स्पष्ट की गई है।
- source_word: ወ*ዘመርኩ
  choice: और स्तुति-गीत गाया
  rationale: क्रिया गाने या भजन गाने को व्यक्त करती है; उपासना के प्रसंग में ‘स्तुति-गीत गाया’ स्वाभाविक और स्पष्ट है।
- source_word: በከመ፡ ይደሉ
  choice: जैसा ... के योग्य है
  rationale: यह औचित्य अथवा अनुरूपता बताने वाली अभिव्यक्ति है; हिन्दी में ‘जैसा ... के योग्य है’ गरिमापूर्ण और सहज है।
- source_word: ለዕበዩ
  choice: उसकी महानता
  rationale: संज्ञा महानता, बड़ाई या प्रताप का अर्थ देती है। ‘महानता’ मूल के व्यापक अर्थ को रखती है और पहले आए ‘महिमा’ की अनावश्यक पुनरावृत्ति से बचाती है।
theological_decisions:
- issue: ईश्वरीय उपाधि እግዚአ का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: परमेश्वर की स्तुति के प्रसंग में ‘प्रभु’ स्थापित, गरिमापूर्ण और सामान्य हिन्दी उपाधि है; ‘स्वामी’ संभव है, पर इस उपासना-वाक्य में अपेक्षाकृत कम उपयुक्त लगता है।
- issue: संदिग्ध पाठ में स्तुति की विषय-वस्तु
  choice: उसकी महिमा का वर्णन किया
  alternative: उसके विषय में कहा / उससे कहा
  rationale: पुनर्स्थापित गीइज़ पाठ और उपलब्ध यूनानी समानांतर ‘उसकी महिमा’ का समर्थन करते हैं। फिर भी दिए गए प्रतिलेखन की भिन्न रीडिंग को पादटिप्पणी में सुरक्षित रखा गया है, ताकि पाठगत तनाव छिपाया न जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण उपासना-शैली रखी गई है। वाक्य सामान्य पाठक के लिए सहज है, जबकि संदिग्ध गीइज़ पाठ को बिना चुपचाप सुलझाए पादटिप्पणी में दर्ज किया गया है।
