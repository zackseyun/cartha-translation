base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/002.yaml
  text: At that time Uriel[a], one of the holy angels who was with me, answered me and said to me, “This accursed valley is for those who are accursed forever. Here all those will be gathered who speak with their mouths improper words against the Lord, and who utter harsh things concerning his glory. Here they will be gathered[b], and here will be their place of judgment.”
translation:
  language: hi
  text: उस समय मेरे साथ रहने वाले पवित्र स्वर्गदूतों में से एक, ऊरीएल ने मुझे उत्तर दिया और कहा, “यह शापित घाटी उन लोगों के लिए है जो सदा के लिए शापित हैं। यहाँ वे सभी इकट्ठे किए जाएँगे जो अपने मुँह से प्रभु के विरुद्ध अनुचित बातें[a] कहते हैं और उसकी महिमा के विषय में कठोर बातें[b] बोलते हैं। यहीं उन्हें इकट्ठा करेंगे[c], और यहीं उनके न्याय का स्थान होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनुपयुक्त बातें” अथवा “ऐसी बातें जो उचित नहीं हैं।” मूल वाक्यांश ऐसी वाणी बताता है जो प्रभु के सामने उचित या शोभनीय नहीं है।
    reason: lexical_alternative
  - marker: b
    text: “कठोर बातें” का अर्थ चौंकाने वाली, धृष्ट, या अपमानजनक बातें भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'मूल में क्रिया का कारक रूप है: “वे उन्हें इकट्ठा करेंगे।” इकट्ठा करने वाले कर्ता की पहचान नहीं बताई गई है।'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: አውሥአኒ
  choice: मुझे उत्तर दिया
  rationale: क्रिया उत्तर देने या प्रत्युत्तर देने का भाव रखती है; दर्शन के संवादात्मक प्रसंग में यही स्वाभाविक है।
- source_word: ቅዱሳን መላእክት
  choice: पवित्र स्वर्गदूतों
  rationale: यह अपोकैलिप्टिक साहित्य में इन स्वर्गीय प्राणियों के लिए प्रचलित और स्पष्ट पद है।
- source_word: ዛቈላ
  choice: घाटी
  rationale: दर्शन में वर्णित भू-आकृति के लिए यह व्यापक और स्वाभाविक हिन्दी शब्द है; ‘खड्ड’ या ‘दर्रा’ अनावश्यक रूप से अधिक विशिष्ट होते।
- source_word: ርጉምት / ለርጉማን
  choice: शापित / शापित लोगों
  rationale: यह स्थान और उसके भावी निवासियों, दोनों पर शाप का न्यायिक भाव बनाए रखता है।
- source_word: እስከ ለዓለም
  choice: सदा के लिए
  rationale: यह वाक्यांश शाप की चिरस्थायी अवधि को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: በአፉሆሙ
  choice: अपने मुँह से
  rationale: मूल पाठ वाणी के शारीरिक साधन का स्पष्ट उल्लेख करता है; इसे बनाए रखने से ठोस चित्रात्मकता सुरक्षित रहती है।
- source_word: ላዕለ እግዚአብሔር
  choice: प्रभु के विरुद्ध
  rationale: निंदात्मक वाणी के संदर्भ में संबंधवाचक पद का विरोधात्मक बल है, केवल ‘प्रभु के विषय में’ का तटस्थ अर्थ नहीं।
- source_word: ቃለ ዘኢይደሉ
  choice: अनुचित बातें
  rationale: शब्दसमूह ऐसी वाणी बताता है जो उचित या शोभनीय नहीं है; यह अनुवाद अपराध को जरूरत से अधिक तकनीकी नहीं बनाता।
- source_word: ስብሐቲ ዚአሁ
  choice: उसकी महिमा
  rationale: यहाँ संज्ञा प्रभु की महिमा या प्रताप की ओर संकेत करती है; ‘महिमा’ पारदर्शी और प्रसंगानुकूल है।
- source_word: ይትናገሩ ዕፁብተ
  choice: घोर बातें बोलते हैं
  rationale: ‘घोर’ वाणी के चौंकाने वाले, गंभीर और धृष्ट स्वर को स्वाभाविक हिन्दी में व्यक्त करता है, पर उसे केवल किसी बाद की तकनीकी श्रेणी तक सीमित नहीं करता।
- source_word: ይትጋብኡ / ያስተጋብእዎሙ
  choice: इकट्ठे किए जाएँगे / उन्हें इकट्ठा किया जाएगा
  rationale: न्याय के लिए अपराधियों को एक स्थान पर लाए जाने का भाव स्पष्ट होता है। अंतिम क्रिया के कारक रूप की संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ምኵናኒሆሙ
  choice: उनके न्याय
  rationale: यह शब्द न्याय अथवा दंडादेश की न्यायिक धारणा रखता है; ‘न्याय’ मूल की व्यापकता को सुरक्षित रखता है।
theological_decisions:
- issue: दोषी ठहराने वाली वाणी का स्वरूप
  choice: प्रभु के विरुद्ध अनुचित और उसकी महिमा के विषय में घोर वाणी
  alternative: इसे केवल औपचारिक ‘ईशनिंदा’ कहना
  rationale: मूल पाठ विरोधी और अत्यंत आपत्तिजनक वाणी का वर्णन करता है, पर अपराध को किसी बाद की संकीर्ण धार्मिक-कानूनी श्रेणी में स्पष्ट रूप से परिभाषित नहीं करता।
- issue: अंतिम वाक्य में घाटी और न्याय का संबंध
  choice: घाटी वह स्थान है जहाँ शापित लोग इकट्ठे किए जाएँगे और जहाँ उनका न्याय होगा
  alternative: घाटी स्वयं ही उनका दंडादेश है
  rationale: दो बार प्रयुक्त ‘यहीं’ स्थान पर जोर देता है; इसलिए दृश्य की भौगोलिक और न्यायिक दोनों विशेषताएँ बनाए रखी गई हैं।
- issue: इकट्ठा करने वाली सत्ता की पहचान
  choice: कर्तृवाचक सत्ता को अनिर्दिष्ट रखते हुए कर्मवाच्य अनुवाद
  alternative: ‘वे उन्हें इकट्ठा करेंगे’ या किसी विशेष स्वर्गीय/दैवी कर्ता का नाम देना
  rationale: मूल क्रियारूप में कारक भाव संभव है, लेकिन कर्ता स्पष्ट नहीं है। कर्मवाच्य अनुवाद अनावश्यक पहचान थोपने से बचता है और पादटिप्पणी व्याकरणिक विकल्प बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘शापित घाटी’, ‘प्रभु’, ‘महिमा’ और ‘न्याय’ से दर्शन का गंभीर न्यायिक स्वर बना रहता है। अनावश्यक संस्कृतनिष्ठता तथा बाद की तकनीकी धर्मशास्त्रीय शब्दावली से बचा गया है।
