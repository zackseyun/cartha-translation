base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/007.yaml
  text: For before him we did not believe[a], and we did not praise the name of the Lord of Spirits[a][b], [and we did not praise our Lord,] and our hope was in the scepter of our kingdom and in our glory.
translation:
  language: hi
  text: क्योंकि उसके सामने हमने विश्वास नहीं किया[a], और आत्माओं के प्रभु के नाम की स्तुति नहीं की, [और हमने अपने प्रभु की स्तुति नहीं की][b], और हमारी आशा अपने राज्य के राजदंड पर और अपने वैभव पर टिकी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'दी गई प्रतिलिपि में क्रिया सकारात्मक दिखाई देती है, पर आलोचनात्मक पाठ में निषेधात्मक उपसर्ग है: ‘हमने विश्वास नहीं किया।’ प्रतिलिपि का रूप OCR-दोष माना गया है।'
    reason: textual_variant
  - marker: b
    text: कोष्ठकों में रखा गया यह खंड उपलब्ध साक्ष्य में अनिश्चित है और संभवतः पाठांतर या बाद का विस्तार है।
    reason: textual_variant
lexical_decisions:
- source_word: እስመ
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण या स्पष्टीकरण देता है; ‘क्योंकि’ उस संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: በቅድሜሁ
  choice: उसके सामने
  rationale: यह स्थान और उपस्थिति दोनों का भाव रखता है तथा न्याय-दृश्य के संदर्भ के अनुकूल है।
- source_word: ኢአመነ (आलोचनात्मक पाठ; दी गई प्रतिलिपि में አአመነ)
  choice: हमने विश्वास नहीं किया
  rationale: आलोचनात्मक रूप में निषेधात्मक उपसर्ग ኢ है; दी गई प्रतिलिपि का सकारात्मक रूप OCR/प्रतिलिपि-दोष माना गया है। अध्याय में राजाओं के अंगीकार का संदर्भ भी निषेधात्मक पाठ का समर्थन करता है।
- source_word: ወኢሰባሕነ ለስሙ (आलोचनात्मक पाठ)
  choice: और आत्माओं के प्रभु के नाम की स्तुति नहीं की
  rationale: क्रिया का सीधा अर्थ ‘स्तुति करना’ है और ‘नाम’ स्पष्ट कर्म है। निषेधात्मक पाठ को सुरक्षित रखा गया है।
- source_word: እግዚአ መናፈስት
  choice: आत्माओं का प्रभु
  rationale: यह 1 हनोक में बार-बार आने वाली विशिष्ट उपाधि है; इसे विस्तार या सांप्रदायिक व्याख्या के बिना यथावत रखा गया है। मुख्य वाक्य में संबंध-विभक्ति के कारण ‘आत्माओं के प्रभु’ आया है।
- source_word: ወኢሰባሕናሁ ለእግዚእነ (अनिश्चित खंड)
  choice: और हमने अपने प्रभु की स्तुति नहीं की
  rationale: खंड को उसकी पाठगत अनिश्चितता दिखाने के लिए कोष्ठकों में रखा गया है; आलोचनात्मक निषेधात्मक पाठ के अनुसार अर्थ दिया गया है।
- source_word: ወተስፋነ ኮነ ዲበ
  choice: हमारी आशा … पर टिकी थी
  rationale: यह आशा के आधार या आश्रय को व्यक्त करता है; ‘पर टिकी थी’ आधुनिक हिन्दी में स्वाभाविक रहते हुए स्थिर अवस्था का भाव देता है।
- source_word: በትረ መንግሥትነ
  choice: अपने राज्य का राजदंड
  rationale: በትር का अर्थ छड़ी, दंड या राजदंड हो सकता है; ‘राज्य’ के साथ राजकीय प्रतीक ‘राजदंड’ सबसे उपयुक्त है। मुख्य वाक्य में विभक्ति के कारण ‘राजदंड’ रूप प्रयुक्त है।
- source_word: ስብሐቲነ
  choice: अपना वैभव
  rationale: यहाँ शब्द राजाओं की प्रतिष्ठा, चमक और आत्म-महिमा को दर्शाता है; ‘वैभव’ इस राजकीय संदर्भ में स्वाभाविक है।
theological_decisions:
- issue: क्या वक्ताओं का कथन विश्वास करने का दावा है या विश्वास न करने का अंगीकार
  choice: हमने विश्वास नहीं किया
  alternative: हमने विश्वास किया
  rationale: आलोचनात्मक गीइज़ पाठ में निषेधात्मक उपसर्ग और अध्याय का न्याय-संदर्भ नकारात्मक अर्थ का समर्थन करते हैं। अनिश्चितता को छिपाने के बजाय पादटिप्पणी में प्रतिलिपि-संबंधी समस्या बताई गई है।
- issue: आशा के आधार को सामान्य ‘शक्ति’ कहना या राजकीय बिंब बनाए रखना
  choice: अपने राज्य के राजदंड और अपने वैभव पर
  alternative: अपनी सत्ता और प्रतिष्ठा पर
  rationale: मूर्त राजकीय बिंब पृथ्वी के शासकों द्वारा अपनी सत्ता और महिमा पर रखे गए भरोसे को बनाए रखता है; उसे अमूर्त कर देना मूल की सर्वनाश-दर्शी आलोचना को कमजोर करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘आत्माओं का प्रभु’ जैसी विशिष्ट हनोकी उपाधि और ‘राजदंड’ का राजकीय बिंब सुरक्षित रखे गए हैं। पाठगत अनिश्चितता को कोष्ठकों और पादटिप्पणियों से स्पष्ट किया गया है।
