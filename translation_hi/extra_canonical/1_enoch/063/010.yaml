base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/010.yaml
  text: Now they will say to them[a], ‘Our soul has had its fill of unjust gain[d][c][b], but it does not keep us from going down from the midst of it into the burden of Sheol.’
translation:
  language: hi
  text: अब वे उनसे कहेंगे[a], “हमारी आत्मा अन्याय से कमाए धन से तृप्त हो चुकी है[b], फिर भी वह धन हमें उसके बीच से शीओल के भार में उतरने से नहीं रोकता[c][d]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल क्रिया में “उनसे/उन्हें” का बहुवचन कर्म-प्रत्यय निहित है; अर्थात यह कथन किसी को संबोधित करके कहा गया है।
    reason: grammar
  - marker: b
    text: यह गीइज़ पदबंध पाठगत और शब्दार्थ की दृष्टि से कठिन है। इसका अर्थ अधिक व्यापक रूप से “अधर्म से प्राप्त संपत्ति” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक रूप के निकट: “उसके बीच से।” संकेत संभवतः अभी उल्लिखित धन की ओर है, पर संबंध पूर्णतः स्पष्ट नहीं है।'
    reason: textual_ambiguity
  - marker: d
    text: “शीओल के भार” का अनुवाद “शीओल के भारीपन” भी हो सकता है। “शीओल” प्राचीन यहूदी विचार में मृतकों का अधोलोक है; इसे यहाँ “नरक” नहीं किया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: ይእዜ
  choice: अब
  rationale: यह कालसूचक पद न्याय के दृश्य में वर्तमान नाटकीय मोड़ को प्रकट करता है।
- source_word: ይብልዎሙ
  choice: वे उनसे कहेंगे
  rationale: क्रिया का अपूर्ण/भविष्य रूप भविष्यसूचक कथन के अनुकूल है और उसमें लगा तृतीय पुरुष बहुवचन कर्म-प्रत्यय ‘उनसे/उन्हें’ भी अनुवाद में सुरक्षित है।
- source_word: ትጸግብ ነፍስነ
  choice: हमारी आत्मा ... तृप्त हो चुकी है
  rationale: मूल मुहावरा भर जाने या तृप्त हो जाने की दशा बताता है; एकवचन ‘आत्मा’ सामूहिक वक्ताओं के मूल एकवचन को बनाए रखता है।
- source_word: እምጥየየ ዐመፃ
  choice: अन्याय से कमाए धन से
  rationale: कठिन पदबंध में भौतिक संपत्ति और उसके अन्यायपूर्ण अर्जन, दोनों के संकेत हैं। यह रूप किसी विशेष प्रकार के अपराध को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ወኢትከልእ
  choice: फिर भी वह हमें ... नहीं रोकता
  rationale: मूल क्रिया बाधा देने या रोकने का अर्थ रखती है; विरोधसूचक ‘फिर भी’ संदर्भ में धन की निष्फलता स्पष्ट करता है।
- source_word: ወረደተነ
  choice: हमें ... उतरने से
  rationale: मूल में नीचे जाने या उतरने की सजीव गति है, जिसे संज्ञात्मक भाव में बदलने के बजाय क्रियात्मक रखा गया है।
- source_word: እምልባ
  choice: उसके बीच से
  rationale: कठिन पूर्वसर्गीय पदबंध को जानबूझकर पारदर्शी और कुछ हद तक अनिश्चित रखा गया है; इसका निकटतम संबंध पहले उल्लिखित धन से हो सकता है।
- source_word: ለክበደ ሲኦል
  choice: शीओल के भार में
  rationale: ‘भारीपन/भार’ की असामान्य ठोस छवि को सरल ‘शीओल में’ कहकर मिटाया नहीं गया है।
- source_word: ሲኦል
  choice: शीओल
  rationale: लिप्यंतरण प्राचीन यहूदी अधोलोक-संकल्पना को सुरक्षित रखता है और इसे केवल कब्र या बाद की ‘नरक’ संबंधी धारणा के समान नहीं बनाता।
theological_decisions:
- issue: अधोलोक-संबंधी पद का अनुवाद
  choice: शीओल
  alternative: कब्र; अधोलोक; नरक
  rationale: ‘शीओल’ स्थानीय यहूदी प्रलय-साहित्यिक भाषा और उसकी धर्मवैचारिक अस्पष्टता को बनाए रखता है; ‘नरक’ बाद की विशिष्ट धारणाएँ जोड़ सकता है और ‘कब्र’ अर्थ को अत्यधिक सीमित कर सकता है।
- issue: धन और दंड के संबंध का कथन
  choice: धन से तृप्ति के बावजूद वह उतरने से नहीं रोकता
  alternative: धन स्वयं उन्हें नीचे उतारता है
  rationale: मूल बाधा न दे पाने की बात कहता है; वह स्पष्ट रूप से धन को अवरोह का कारण नहीं ठहराता, इसलिए उस अतिरिक्त निष्कर्ष को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘आत्मा’, ‘तृप्त’, ‘भार’ और ‘उतरना’ मूल की ठोस छवियों को सुरक्षित रखते हैं। कठिन ‘उसके बीच से’ को सुचारु बनाने के नाम पर हटाया या निर्णायक ढंग से नहीं समझाया गया।
