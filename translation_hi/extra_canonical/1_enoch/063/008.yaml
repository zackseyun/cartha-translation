base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/008.yaml
  text: And on the day of our distress and our affliction[a], he will not save us, and we shall find no rest to believe that our Lord is faithful in all his works and in his judgments and his righteousness[c][b], and his judgments show no partiality.
translation:
  language: hi
  text: और हमारे संकट और क्लेश के दिन वह हमें नहीं बचाएगा, और हमें ऐसा कोई विश्राम नहीं मिलेगा कि हम विश्वास कर सकें कि हमारा प्रभु अपने सभी कार्यों, अपने न्यायों और अपनी धार्मिकता में विश्वासयोग्य है[a]; और उसके न्याय किसी का पक्ष नहीं लेते[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'गीज़ में यह वाक्यांश पाठ और वाक्य-विन्यास की दृष्टि से कठिन है। इसका अर्थ यह भी हो सकता है: “हमें ऐसा कोई विश्राम नहीं मिलेगा जिस पर हम भरोसा कर सकें,” “हमें आशा रखने के लिए कोई राहत नहीं मिलेगी,” अथवा “हमें कोई विश्राम नहीं मिलेगा, और हम विश्वास करेंगे कि हमारा प्रभु विश्वासयोग्य है।”'
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से अंतिम कथन में न्यायों के “मुख न उठाने” की बात है—यह किसी का पक्ष या लिहाज़ न करने का मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: 'वाक्य-विभाजन की एक अन्य सम्भावना है: “अपने सभी कार्यों और अपने न्यायों में; और उसकी धार्मिकता तथा उसके न्याय किसी का पक्ष नहीं लेते।” गीज़ पाठ की संरचना कुछ कठिन है।'
    reason: textual_syntax
lexical_decisions:
- source_word: በዕለተ ስራሕነ ወምንዳቤነ
  choice: हमारे संकट और क्लेश के दिन
  rationale: समय-सूचक और न्याय-संबंधी भाव बनाए रखते हुए दोनों पीड़ा-वाचक पदों को स्वाभाविक आधुनिक हिन्दी में अलग-अलग रखा गया है।
- source_word: ኢያድኅነነ
  choice: वह हमें नहीं बचाएगा
  rationale: यह उद्धार/छुटकारे की मानक क्रिया है; भविष्यकाल न्याय के प्रसंग के अनुकूल है।
- source_word: ኢንረክብ ዕረፍተ ንእመን
  choice: हमें विश्वास करने के लिए कोई विश्राम नहीं मिलेगा
  rationale: गीज़ वाक्यांश की वास्तविक वाक्यगत कठिनाई को मुख्य पाठ में कुछ हद तक बनाए रखा गया है; अधिक सहज संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: መሃይምን
  choice: विश्वासयोग्य
  rationale: प्रभु की भरोसेमंदी और निष्ठा—दोनों भावों को व्यक्त करने वाला प्रतिष्ठित, समझने योग्य शब्द।
- source_word: ምግባሩ
  choice: अपने सभी कार्यों
  rationale: ईश्वरीय कर्मों के व्यापक अर्थ को सुरक्षित रखता है।
- source_word: ኵነኔሁ
  choice: अपने न्यायों / उसके न्याय
  rationale: दोनों बार बहुवचन रखा गया है, क्योंकि अंतिम क्रिया भी बहुवचन है और संशोधित स्रोत-पाठ इसी का समर्थन करता है।
- source_word: ጽድቁ
  choice: अपनी धार्मिकता
  rationale: सूची के तीसरे स्वतंत्र पद को छोड़े बिना धार्मिकता/न्यायपरायणता का अर्थ सुरक्षित रखा गया है।
- source_word: ወገጹ ኵነኔሁ ኢይነሥኡ
  choice: उसके न्याय किसी का पक्ष नहीं करते
  rationale: शाब्दिक रूप से ‘मुख नहीं उठाते’ वाली न्यायिक कहावत को स्वाभाविक हिन्दी में निष्पक्षता के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: कठिन वाक्यांश ኢንረክብ ዕረፍተ ንእመን का अर्थ
  choice: हमें विश्वास करने के लिए कोई विश्राम नहीं मिलेगा
  alternative: हमें ऐसा कोई विश्राम नहीं मिलेगा जिस पर हम भरोसा कर सकें; अथवा आशा रखने के लिए कोई राहत नहीं मिलेगी
  rationale: पाठ की अनिश्चितता और धर्मवैचारिक तनाव को किसी एक सहज व्याख्या द्वारा चुपचाप समाप्त नहीं किया गया; विकल्प पादटिप्पणी में स्पष्ट हैं।
- issue: अंतिम न्याय-सूत्र का बल
  choice: उसके न्याय किसी का पक्ष नहीं करते
  alternative: उसके न्याय किसी का मुख नहीं उठाते
  rationale: मूल न्यायिक मुहावरे का आशय निष्पक्षता है; मुख्य पाठ में अर्थ दिया गया और शाब्दिक चित्र पादटिप्पणी में सुरक्षित रखा गया।
- issue: ጽድቁ को सूची में स्वतंत्र रूप से रखना
  choice: अपने सभी कार्यों, अपने न्यायों और अपनी धार्मिकता में
  alternative: अपने सभी कार्यों और न्यायों में; और उसका न्याय धर्मी है
  rationale: प्राप्त गीज़ पाठ में धार्मिकता का पद स्पष्ट तीसरे घटक के रूप में उपस्थित है; उसे छोड़ा या अंतिम वाक्य में विलीन नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए बोधगम्य। ‘विश्राम’ और ‘विश्वासयोग्य’ जैसे बाइबलीय शब्द बनाए गए हैं; कठिन मूल वाक्यांश को अत्यधिक सहज बनाकर उसकी अनिश्चितता नहीं मिटाई गई।
