base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/011.yaml
  text: And after this[a], their faces will be filled with darkness and shame before that Son of Man, and they will be driven away from before his face[c][b], and a sword will abide before his face in their midst.
translation:
  language: hi
  text: और इसके बाद उनके चेहरे उस मनुष्य-पुत्र[a] के सामने अंधकार और लज्जा से भर जाएँगे। वे उसके सामने से खदेड़ दिए जाएँगे, और एक तलवार उनके बीच बनी रहेगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मनुष्य-पुत्र’ हनोक के दृष्टान्तों में एक पहचाने हुए प्रलयकालीन व्यक्तित्व का पदनाम है; यहाँ इसे बाद के नए नियम की शब्दावली से पीछे की ओर गढ़कर नहीं रखा गया है।
    reason: cross_reference
  - marker: b
    text: 'दिए गए लिप्यंतरण में अंतिम वाक्यांश में ‘उसके मुख के सामने’ भी आता है। पर Charles 1906 के मूल मुद्रित पाठ तथा अन्य प्रमुख गीइज़ संस्करणों में इसे पिछले वाक्यांश की प्रतिलिपिगत पुनरावृत्ति माना जाता है; वहाँ पाठ है: ‘और एक तलवार उनके बीच बनी रहेगी।’'
    reason: textual_variant
lexical_decisions:
- source_word: ይመልእ
  choice: भर जाएँगे
  rationale: 'क्रिया का परिणामसूचक भाव यहाँ स्वाभाविक है: चेहरे अंधकार और लज्जा से भर जाते हैं।'
- source_word: ገጾሙ
  choice: उनके चेहरे
  rationale: यह ठोस और सजीव न्याय-दृश्य को बनाए रखता है तथा आधुनिक हिन्दी में सहज है।
- source_word: ጽልመተ ወኃፍረተ
  choice: अंधकार और लज्जा
  rationale: दोनों संज्ञाओं का सीधा अनुवाद किया गया है; अंधकार को शाब्दिक, भावात्मक या प्रतीकात्मक मानने का निर्णय पाठक पर छोड़ा गया है।
- source_word: በቅድመ / እምቅድመ ገጹ
  choice: के सामने / उसके सामने से
  rationale: पहले प्रयोग में न्यायाधीश की उपस्थिति और दूसरे में वहाँ से हटाए जाने की दिशा—दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ዝኩ ወልደ እጓለ እመሕያው
  choice: उस मनुष्य के पुत्र
  rationale: ‘उस’ विशिष्ट सर्वनामी संकेत को बनाए रखता है और हनोक के दृष्टान्तों में स्थापित प्रलयकालीन व्यक्तित्व की पहचान को सुरक्षित रखता है।
- source_word: ይሰደዱ
  choice: खदेड़ दिए जाएँगे
  rationale: निष्क्रिय और न्यायात्मक बल को बनाए रखते हुए निष्कासन की प्रबलता व्यक्त करता है।
- source_word: ሰይፍ
  choice: एक तलवार
  rationale: अनिश्चित रूप को सुरक्षित रखता है और किसी पूर्व-निर्दिष्ट तलवार की धारणा नहीं जोड़ता।
- source_word: የኃድር
  choice: बनी रहेगी
  rationale: क्षणिक वार के बजाय तलवार की निरन्तर, भयावह उपस्थिति का भाव देता है।
- source_word: ማእከሎሙ
  choice: उनके बीच
  rationale: स्थानिक चित्र को स्पष्ट रखता है और तलवार तथा दोषियों के सटीक सम्बन्ध को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: ‘मनुष्य का पुत्र’ सामान्य मानवीय अभिव्यक्ति है या एक विशिष्ट पदवी
  choice: उस मनुष्य के पुत्र
  alternative: उस मनुष्य-पुत्र / उस मानव-सन्तान
  rationale: इस खंड के प्रसंग में यह पहले से पहचाने गए विशिष्ट प्रलयकालीन व्यक्तित्व को सूचित करता है। फिर भी अनुवाद बाद की मसीही धर्मशास्त्रीय व्याख्याओं को इसमें नहीं जोड़ता।
- issue: अंतिम खंड में तलवार का स्थान
  choice: उनके बीच
  alternative: उसके सामने, उनके बीच
  rationale: उपलब्ध पाठालोचनात्मक सूचना के अनुसार अंतिम ‘उसके मुख के सामने’ प्रतिलिपि/OCR में पिछले खंड से हुई पुनरावृत्ति है; Charles 1906 के वास्तविक पाठ और अन्य प्रमुख गीइज़ संस्करणों में अंतिम खंड केवल तलवार के ‘उनके बीच’ बने रहने की बात कहता है। इस भिन्नता को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सामान्य पाठकों के लिए सुबोध रूप अपनाया गया है। ‘चेहरे’, ‘खदेड़ दिए जाएँगे’ और ‘बनी रहेगी’ जैसे सहज शब्द मूल के सजीव न्याय-दृश्य और उसकी कठोरता को बनाए रखते हैं।
