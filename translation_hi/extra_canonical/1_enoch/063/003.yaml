base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/003.yaml
  text: And your power is blessed in every hidden thing throughout all generations[a], and your glory forever and ever. Deep are all your hidden things, and they are without number[c][b]; and your righteousness is beyond reckoning.
translation:
  language: hi
  text: और तेरी सामर्थ्य हर छिपी हुई वस्तु में पीढ़ी-दर-पीढ़ी चमकती है, और तेरी महिमा सदा-सर्वदा बनी रहती है। तेरी सभी छिपी हुई बातें[a] गहरी हैं और उनकी कोई गिनती नहीं; और तेरी धार्मिकता[b] गणना से परे है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे सभी रहस्य।” गीइज़ में अधिक शाब्दिक रूप से “तेरी सभी छिपी हुई [वस्तुएँ/बातें]” है।
    reason: lexical_alternative
  - marker: b
    text: या, “तेरा न्याय।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ይበርህ
  choice: चमकती है
  rationale: यह क्रिया በርሀ (‘चमकना/प्रकाशित होना’) से समझी गई है; इसे ‘धन्य है’ कहना समान रूप वाले अन्य मूल से भ्रम उत्पन्न करेगा।
- source_word: በኵሉ ኅቡእ ኃይልክ
  choice: तेरी सामर्थ्य हर छिपी हुई वस्तु में
  rationale: वाक्य-विन्यास में ‘तेरी सामर्थ्य’ कर्ता है और ‘हर छिपी हुई वस्तु में’ पूर्वसर्गीय पद; इसलिए ‘तेरी छिपी हुई सामर्थ्य’ नहीं किया गया।
- source_word: ለትውልደ ትውልድ
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह निरंतरता बताने वाला स्वाभाविक हिन्दी मुहावरा है और मूल की पीढ़ी-संबंधी पुनरुक्ति बनाए रखता है।
- source_word: ስብሐቲከ
  choice: तेरी महिमा
  rationale: स्तुतिपरक संदर्भ में यह परमेश्वर की महिमा या वैभव को सूचित करता है।
- source_word: ለዓለመ ዓለም
  choice: सदा-सर्वदा बनी रहती है
  rationale: मूल का बलपूर्ण अनंतकालिक भाव स्वाभाविक हिन्दी में व्यक्त किया गया है; पहले उपवाक्य से क्रिया सीधे उधार लेने के बजाय निहित अस्तित्व को स्पष्ट किया गया है।
- source_word: ዕሙቅ ውእቱ ኵሉ ኅቡኣት ዚአከ
  choice: तेरी सभी छिपी हुई बातें गहरी हैं
  rationale: ‘गहरी’ मूल की अथाहता बनाए रखता है और ‘छिपी हुई बातें’ अस्पष्ट बहुवचन को बिना ‘रहस्य’ जैसे अधिक व्याख्यात्मक शब्द में बदलने के व्यक्त करता है।
- source_word: ኍልቈ አልቦሙ
  choice: उनकी कोई गिनती नहीं
  rationale: मूल के ‘उनकी संख्या नहीं है’ भाव का स्पष्ट और मुहावरेदार हिन्दी रूप।
- source_word: ጽድቅ ዚአከ
  choice: तेरी धार्मिकता
  rationale: स्तुतिपरक संदर्भ में चरित्रगत धार्मिकता उपयुक्त है; ‘न्याय’ भी संभव है और पादटिप्पणी में दिया गया है।
- source_word: ኃሳበ አልቦ
  choice: गणना से परे है
  rationale: यह हिसाब या गणना न हो सकने के मूल बिंब को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय गुप्तता को ‘छिपी हुई बातें’ या ‘रहस्य’ कहना
  choice: छिपी हुई बातें
  alternative: रहस्य
  rationale: मूल का ठोस किंतु खुला बहुवचन सुरक्षित रखा गया है; ‘रहस्य’ संभव है, पर अधिक व्याख्यात्मक है।
- issue: ጽድቅ को ‘धार्मिकता’ या ‘न्याय’ कहना
  choice: धार्मिकता
  alternative: न्याय
  rationale: यहाँ किसी विशिष्ट न्यायिक कार्य के बजाय परमेश्वर के गुण की स्तुति है; फिर भी दोनों अर्थ संभव होने से विकल्प नोट किया गया है।
- issue: आरंभिक क्रिया को ‘चमकती है’ या ‘धन्य है’ समझना
  choice: चमकती है
  alternative: धन्य है
  rationale: प्रस्तुत गीइज़ रूप ይበርህ को በርሀ, ‘चमकना’, से लेना भाषिक रूप से अधिक ठोस है; ‘धन्य’ वाला पाठ अलग धातु के साथ भ्रम पर निर्भर प्रतीत होता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण स्तुतिपरक स्तर रखा गया है। सर्वनाम ‘तेरी’ मूल के एकवचन संबोधन और हिन्दी धार्मिक-काव्यात्मक निकटता को बनाए रखता है। गीइज़ स्रोत की मध्यम विश्वसनीयता और पूर्व समीक्षा में आरंभिक क्रिया पर हुए विवाद को देखते हुए ‘चमकती है’ को प्रत्यक्ष रूप-साक्ष्य के आधार पर चुना गया है।
