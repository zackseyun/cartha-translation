base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/004.yaml
  text: Now we know that we ought to praise and bless the Lord of the kings[b][a], and the one who reigns over all the kings.
translation:
  language: hi
  text: अब हम जान गए हैं कि हमें राजाओं के प्रभु[b] और उन सब राजाओं पर राज्य करनेवाले की स्तुति करनी और उन्हें धन्य कहना चाहिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आओ, हम … की स्तुति करें और उन्हें धन्य कहें।” गीइज़ के क्रियारूप प्रेरणार्थक या सम्भावनार्थक भाव भी व्यक्त कर सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: यह उपाधि गीइज़ के अनुसार सीधे “राजाओं के प्रभु” अनूदित की गई है; इसे प्रचलित संक्षिप्त पद “राजाओं के राजा” नहीं बनाया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ይእዜ
  choice: अब
  rationale: यह कालवाचक क्रियाविशेषण वक्ताओं को अभी हुए बोध की ओर संकेत करता है और कथन के अलंकारिक मोड़ को बनाए रखता है।
- source_word: አእመርነ
  choice: हम जान गए हैं
  rationale: प्रथम पुरुष बहुवचन का यह रूप प्राप्त या साकार हुए बोध को व्यक्त करता है; ‘जान गए हैं’ केवल सामान्य वर्तमान ज्ञान की अपेक्षा इस नए एहसास को अधिक स्पष्ट करता है।
- source_word: ከመ
  choice: कि
  rationale: यह उस बात का परिचय देता है जिसे वक्ताओं ने अब जाना है; हिन्दी में ‘कि’ स्वाभाविक और वाक्य-विन्यास के अनुरूप है।
- source_word: ንሰብሖ ወንባርኮ
  choice: हमें … की स्तुति करनी और उन्हें धन्य कहना चाहिए
  rationale: 'दोनों क्रियाओं का भेद बनाए रखा गया है: पहली प्रशंसा/स्तुति और दूसरी आशीर्वादात्मक उद्घोषणा है। ‘चाहिए’ न्याय के प्रसंग में अब पहचाने गए नैतिक दायित्व को व्यक्त करता है, जबकि रूपों की सम्भावित प्रेरणार्थक व्याख्या पादटिप्पणी में सुरक्षित है।'
- source_word: ለእግዚኦሙ ለነገሥት
  choice: राजाओं के प्रभु
  rationale: यह गीइज़ पदबंध को एक प्रभुसत्तात्मक उपाधि के रूप में सीधे रखता है और इसे पारम्परिक किन्तु अधिक संक्षिप्त ‘राजाओं के राजा’ में नहीं बदलता।
- source_word: ወለዘ ይነግሥ ዲበ ኵሎሙ ነገሥት
  choice: और उन सब राजाओं पर राज्य करनेवाले
  rationale: सम्बन्धवाचक रचना और वर्तमानकालिक शासन का भाव सुरक्षित है। ‘उन सब राजाओं’ से प्रसंग में उल्लिखित सांसारिक राजाओं के निश्चित समूह का संकेत मिलता है।
theological_decisions:
- issue: राजकीय उपाधि को बाद की परिचित धार्मिक पदावली में समेटना या मूल की दो-खंडीय उद्घोषणा बनाए रखना
  choice: राजाओं के प्रभु और उन सब राजाओं पर राज्य करनेवाले
  alternative: राजाओं के राजा
  rationale: गीइज़ पहले ‘राजाओं के प्रभु’ कहता है और फिर सभी राजाओं पर राज्य करने का अलग सम्बन्धवाचक कथन जोड़ता है। दोनों अंश रखने से मूल की पुनरुक्तिपूर्ण प्रभुसत्ता और उसका तनाव सुरक्षित रहता है।
- issue: प्रथम पुरुष बहुवचन क्रियारूपों का भाव
  choice: हमें … चाहिए
  alternative: आओ, हम … करें
  rationale: न्याय के प्रसंग में वक्ता उस कर्तव्य को स्वीकार करते हैं जिसे उन्होंने देर से पहचाना है। फिर भी गीइज़ रूप प्रेरणार्थक या सम्भावनार्थक अर्थ दे सकते हैं, इसलिए वैकल्पिक पाठ पादटिप्पणी में दिया गया है।
- issue: ईश्वर को ‘bless’ करने की अभिव्यक्ति
  choice: उन्हें धन्य कहना
  alternative: उन्हें आशीष देना
  rationale: ‘धन्य कहना’ मनुष्यों द्वारा परमेश्वर के प्रति की गई आशीर्वादात्मक प्रशंसा को स्वाभाविक हिन्दी में व्यक्त करता है और ऐसा आभास नहीं देता कि मनुष्य परमेश्वर को कोई वरदान प्रदान कर रहे हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर ‘प्रभु’, ‘स्तुति’ और ‘धन्य कहना’ से गरिमापूर्ण धार्मिक स्वर बनाए रखा गया है। ‘जान गए हैं’ नए बोध को सहज रूप से व्यक्त करता है। हिन्दी में निश्चित उपपद न होने के कारण पहले पदबंध में ‘राजाओं के प्रभु’ स्वाभाविक है, जबकि ‘उन सब राजाओं’ से दूसरे पदबंध में प्रसंगगत निश्चित समूह स्पष्ट किया गया है।
