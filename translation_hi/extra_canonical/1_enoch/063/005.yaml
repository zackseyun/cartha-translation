base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/005.yaml
  text: And they said[a], “Who has given us rest[c][b], that we should praise and thank and believe before your glory?”
translation:
  language: hi
  text: और उन्होंने कहा, “किसने हमें विश्राम[a] दिया है कि हम आपकी महिमा के सम्मुख उसकी स्तुति करें, उसे धन्यवाद दें और विश्वास करें[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राहत” अथवा “मोहलत।” यह शब्द विश्राम या कुछ समय की राहत का अर्थ दे सकता है; प्रसंग में न्याय के अधीन किसी भी राहत का न मिलना प्रमुख है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ गीइज़ क्रिया का सबसे सीधा अर्थ “विश्वास करें” है। पाठ-परंपरा की कठिनाई के कारण “अंगीकार करें” या “स्वीकार करें” भी प्रस्तावित किए गए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: መኑ
  choice: किसने
  rationale: यह प्रश्नवाचक सर्वनाम है; हिन्दी वाक्य में क्रिया ‘दिया’ के साथ ‘किसने’ स्वाभाविक और सटीक है।
- source_word: ወሀበነ
  choice: हमें दिया है
  rationale: क्रिया का अर्थ ‘देना’ है और इसमें प्रथम पुरुष बहुवचन कर्म ‘हमें’ निहित है; पूर्णता का भाव ‘दिया है’ से व्यक्त होता है।
- source_word: ዕረፍተ
  choice: विश्राम
  rationale: संज्ञा विश्राम, राहत या मोहलत का बोध करा सकती है। मुख्य पाठ में ‘विश्राम’ न्याय के बीच विश्राम न मिलने के तीखे विरोध को बनाए रखता है।
- source_word: ከመ
  choice: कि
  rationale: यह उद्देश्य अथवा परिणाम का संबंध जोड़ता है; इस प्रश्न में हिन्दी ‘कि हम…’ दोनों संभावित बलों को अनावश्यक रूप से तय नहीं करता।
- source_word: ንሰብሖ
  choice: हम उसकी स्तुति करें
  rationale: क्रिया स्तुति या महिमा करने का अर्थ देती है। रूप के अंत का तृतीय पुरुष पुल्लिंग एकवचन कर्म-प्रत्यय हिन्दी में ‘उसकी’ द्वारा व्यक्त किया गया है।
- source_word: ወናአኵቶ
  choice: उसे धन्यवाद दें
  rationale: क्रिया धन्यवाद देने का अर्थ रखती है और तृतीय पुरुष पुल्लिंग एकवचन कर्म-प्रत्यय को ‘उसे’ से स्पष्ट किया गया है।
- source_word: ወንእመን
  choice: और … विश्वास करें
  rationale: यह አምነ के साधारण धातुरूप से है और अध्याय में दोहराए गए ‘विश्वास करना’ के भाव को बनाए रखता है। ‘अंगीकार करें’ पाठगत रूप से कम संभावित है, पर पादटिप्पणी में सुरक्षित है।
- source_word: ቅድመ
  choice: के सामने
  rationale: यह ‘सामने’ अथवा ‘उपस्थिति में’ का अर्थ देता है और यहाँ दिव्य महिमा के सम्मुख होने का गंभीर भाव रखता है।
- source_word: ስብሐቲከ
  choice: आपकी महिमा
  rationale: यह महिमा, तेज या वैभव के अर्थक्षेत्र का शब्द है; ‘आपकी महिमा’ दिव्य उपस्थिति और प्रकाशमान वैभव दोनों के लिए उपयुक्त है।
theological_decisions:
- issue: न्याय के अधीन वक्ताओं के प्रश्न का बल
  choice: 'इसे निराशापूर्ण आलंकारिक प्रश्न के रूप में रखा गया है: उन्हें ऐसा कोई विश्राम नहीं मिला जिससे वे स्तुति, धन्यवाद और विश्वास कर सकें।'
  alternative: इसे उपासना के लिए अवकाश देने वाले व्यक्ति के विषय में साधारण सूचना-प्रश्न समझना।
  rationale: अध्याय में दोषी राजाओं और सामर्थियों के न्याय का प्रसंग प्रश्न को विलापपूर्ण बनाता है; फिर भी अनुवाद स्वयं प्रश्नवाचक रूप बनाए रखता है और व्याख्या को मुख्य पाठ में नहीं जोड़ता।
- issue: ‘विश्वास’ बनाम ‘अंगीकार’
  choice: विश्वास करें
  alternative: अंगीकार करें या स्वीकार करें
  rationale: यहाँ प्रयुक्त साधारण धातुरूप का सामान्य अर्थ ‘विश्वास करना’ है और इससे अध्याय की विषयगत पुनरावृत्ति बनी रहती है। गीइज़-मात्र पाठ की कठिन परंपरा के कारण दूसरा अर्थ पादटिप्पणी में दिया गया है।
- issue: स्तुति और धन्यवाद की क्रियाओं में कर्म
  choice: पहली दो क्रियाओं के तृतीय पुरुष एकवचन कर्म को ‘उसकी/उसे’ के रूप में व्यक्त किया गया है।
  alternative: 'कर्म को हिन्दी में अनकहा छोड़ना: ‘स्तुति करें और धन्यवाद दें।’'
  rationale: गीइज़ रूपों ንሰብሖ और ወናአኵቶ के अंतिम -o को तृतीय पुरुष पुल्लिंग एकवचन कर्म-प्रत्यय मानना व्याकरणतः सबसे मजबूत पाठ है। ‘उसकी/उसे’ उसके संदर्भ को जबरन ‘आप’ में नहीं बदलता और मूल के ‘उसकी…आपकी’ तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज वाक्य-विन्यास रखा गया है। ‘आपकी महिमा के सामने’ मूल की न्यायालय-सदृश और दिव्य-उपस्थिति की भाषा को बनाए रखता है। पहली दो क्रियाओं में स्रोत के स्पष्ट तृतीय पुरुष कर्म को अनूदित किया गया है, जबकि अंतिम क्रिया को बिना जोड़े गए कर्म के रखा गया है।
