  text: 'Thus said the Lord of Spirits: "This is the ordinance and the judgment for the mighty."[a][b][c]'
translation:
  language: hi
  text: आत्माओं के प्रभु ने इस प्रकार कहा, “शक्तिशाली लोगों के लिए यही विधान और न्याय है।”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “शक्तिशाली लोगों के लिए” का अनुवाद “शक्तिशाली लोगों के विरुद्ध” भी हो सकता है, क्योंकि प्रसंग में गीज़ का पूर्वसर्ग प्रतिकूल दिशा का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'एक अन्य पाठ-समझ है: “क्योंकि यही आत्माओं के प्रभु का विधान और न्याय है।” प्राप्त गीज़ पाठ संक्षिप्त है, पर यहाँ ይቤ के सामान्य अर्थ “कहा” को मुख्य पाठ में रखा गया है।'
    reason: textual_variant
lexical_decisions:
- source_word: ከመዝ ይቤ
  choice: इस प्रकार कहा
  rationale: ከመዝ को रीति-सूचक ‘इस प्रकार’ और ይቤ को उसके सामान्य भूतकालिक अर्थ ‘कहा’ में लिया गया है; इससे संप्रेषित पाठ की आरंभिक कथन-सूत्र शैली बनी रहती है।
- source_word: እግዚአ መናፈስት
  choice: आत्माओं के प्रभु
  rationale: हनोक की इस विशिष्ट ईश्वरीय उपाधि को स्वाभाविक और पारदर्शी हिन्दी में स्थिर रूप से सुरक्षित रखा गया है।
- source_word: ዝውእቱ
  choice: यही ... है
  rationale: संकेतवाचक और योजक भाव को ‘यही ... है’ से व्यक्त किया गया है, जो पूर्वोक्त न्याय की ओर स्पष्ट संकेत करता है।
- source_word: ሥርዓቱ
  choice: विधान
  rationale: शब्द व्यवस्था, निर्धारित नियम या अध्यादेश का अर्थ दे सकता है; न्यायिक-प्रलयदर्शी प्रसंग में ‘विधान’ औपचारिकता और व्यापकता दोनों रखता है।
- source_word: ወኵነኔሁ
  choice: और न्याय
  rationale: दूसरे विधिक पद को व्यापक ‘न्याय’ से व्यक्त किया गया है; ‘दण्डादेश’ या ‘दोषदण्ड’ अनावश्यक रूप से अर्थ को संकीर्ण कर देते।
- source_word: ለዐዚዛን
  choice: सामर्थियों के लिए
  rationale: ዐዚዛን शक्तिशाली व्यक्तियों को सूचित करता है; ‘सामर्थियों’ से ऊँची शैली बनी रहती है। उपसर्ग ለ को मुख्य पाठ में ‘के लिए’ लिया गया है, जबकि न्यायिक संदर्भ में ‘के विरुद्ध’ भी संभव है।
theological_decisions:
- issue: हनोक की विशिष्ट ईश्वरीय उपाधि
  choice: आत्माओं के प्रभु
  alternative: आत्माओं का प्रभु
  rationale: सम्बन्धकारक बहुवचन को स्पष्ट रखते हुए पाठ की अपनी प्रलयदर्शी धर्मवैचारिक शब्दावली सुरक्षित की गई है; किसी परवर्ती मतगत सूत्र को आरोपित नहीं किया गया।
- issue: शक्तिशाली लोगों से न्याय का संबंध
  choice: सामर्थियों के लिए
  alternative: सामर्थियों के विरुद्ध
  rationale: गीज़ के ለ संबंध या दिशा दोनों व्यक्त कर सकता है। मुख्य पाठ अपेक्षाकृत खुला संबंध रखता है और प्रतिकूल न्यायिक अर्थ को पादटिप्पणी में सुरक्षित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रलयदर्शी और न्यायिक शैली रखी गई है। ‘सामर्थियों’ ऊँची किंतु बोधगम्य शब्दावली है; वाक्य को अनावश्यक संस्कृतनिष्ठ या किसी संप्रदाय-विशेष की भाषा नहीं बनाया गया।
