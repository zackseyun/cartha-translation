base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/009.yaml
  text: And we pass away from before his face because of our deeds[c][b][a], and all our sins are counted in righteousness.
translation:
  language: hi
  text: और हम अपने कर्मों के कारण उसके मुख के सामने से चले जाते हैं[a], और हमारे सारे पाप धार्मिकता के अनुसार गिने जाते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ‘उसकी उपस्थिति से।’ मूल गीइज़ में शाब्दिक रूप से ‘उसके मुख के सामने से’ है। ‘चले जाते हैं’ का अर्थ ‘हट जाते हैं’ या ‘गुज़र जाते हैं’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अर्थ ‘हमारे सारे पाप न्यायपूर्वक गिने जाते हैं’ या ‘हमारे सारे पापों का धार्मिकता के साथ हिसाब लिया जाता है’ भी हो सकता है। मूल में न्यायिक भाव है, पर ठीक-ठीक आशय पूर्णतः स्पष्ट नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: ወነኀልፍ
  choice: और हम ... चले जाते हैं
  rationale: क्रिया में बीतने, चले जाने या हट जाने का भाव है। ‘चले जाते हैं’ आधुनिक हिन्दी में स्वाभाविक है और इसे केवल शारीरिक मृत्यु के अर्थ तक सीमित नहीं करता।
- source_word: እምገጹ
  choice: उसके मुख के सामने से
  rationale: यह मूल अभिव्यक्ति के ठोस, सामी चित्र को बनाए रखता है; अधिक सहज विकल्प ‘उसकी उपस्थिति से’ है।
- source_word: በእንተ ምግባሪነ
  choice: अपने कर्मों के कारण
  rationale: सम्बन्धबोधक पद कारण प्रकट करता है, और ‘कर्म’ कार्यों तथा आचरण—दोनों का उपयुक्त, संक्षिप्त हिन्दी रूप है।
- source_word: ወኵሉ ኃጢአትነ
  choice: और हमारे सारे पाप
  rationale: यह ‘हमारे सब पापों’ की समग्रता को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: በጽድቅ
  choice: धार्मिकता में
  rationale: शाब्दिक संरचना बनाए रखने से यह खुला रहता है कि धार्मिकता गिनने की रीति है या उसका मानदण्ड।
- source_word: ትኈለቍ
  choice: गिने जाते हैं
  rationale: क्रिया का अर्थ गिनना, लेखा रखना या हिसाब में लेना हो सकता है। ‘गिने जाते हैं’ न्यायिक लेखे के रूपक को सरल हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय उपस्थिति के लिए ‘मुख’ की मानवरूपी अभिव्यक्ति
  choice: उसके मुख के सामने से
  alternative: उसकी उपस्थिति से
  rationale: मूल का सजीव न्याय-दृश्य सुरक्षित रखा गया है; इसे अमूर्त बनाकर नरम नहीं किया गया।
- issue: पापों और धार्मिकता वाले न्यायिक वाक्यांश का आशय
  choice: हमारे सारे पाप धार्मिकता में गिने जाते हैं
  alternative: हमारे सारे पाप न्यायपूर्वक गिने जाते हैं / धार्मिकता के अनुसार उनका हिसाब लिया जाता है
  rationale: मूल वाक्य यह पूरी तरह स्पष्ट नहीं करता कि ‘धार्मिकता’ रीति, मानदण्ड या न्यायिक क्षेत्र को सूचित करती है। मुख्य पाठ इस तनाव को बनाए रखता है और पादटिप्पणी सम्भावित अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किन्तु दर्शन और न्याय के गम्भीर प्रसंग के अनुरूप गरिमामय रखी गई है। ‘मुख के सामने’ और ‘धार्मिकता में’ जैसे अपेक्षाकृत औपचारिक पद मूल की ठोस छवि और वास्तविक अर्थगत अस्पष्टता को सुरक्षित रखते हैं।
