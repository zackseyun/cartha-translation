base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/001.yaml
  text: In those days the mighty ones and the kings who possess the dry land shall beg the angels of punishment[a], into whose hands they have been delivered, that they might give them a little respite, so that they may fall down and worship before the Lord of Spirits[c][b], and confess their sins before him.
translation:
  language: hi
  text: उन दिनों शक्तिशाली जन और वे राजा, जो सूखी भूमि को अपने अधिकार में रखते हैं,[a] दण्ड देनेवाले स्वर्गदूतों से—जिनके हाथों में वे सौंपे गए हैं[b]—विनती करेंगे कि वे उन्हें थोड़ी-सी राहत दें,[c] ताकि वे गिरकर आत्माओं के प्रभु के सामने दण्डवत् करें और उसके सामने अपने पाप स्वीकार करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो पृथ्वी/देश को थामे हुए हैं।” मूल गीइज़ में ठोस अभिव्यक्ति “सूखी भूमि” है, जिसका संकेत सम्भवतः सांसारिक प्रभुत्व की ओर है।
    reason: lexical_alternative
  - marker: b
    text: यह उपवाक्य इथियोपिक साक्ष्य में पाठगत रूप से कठिन है। सम्भावित अर्थ यह है कि दोषी ठहराए गए शासक इन स्वर्गदूतों की अभिरक्षा में सौंपे गए हैं।
    reason: textual_variant
  - marker: c
    text: “थोड़ी-सी राहत” का अर्थ दण्ड से छुटकारा नहीं, बल्कि संक्षिप्त और सीमित अवकाश है।
    reason: cultural_note
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: उन दिनों
  rationale: यह प्रलय-दर्शन साहित्य का प्रचलित कालसूचक वाक्यांश है और मूल के बहुवचन ‘दिनों’ को बनाए रखता है।
- source_word: ዓዚዛን ወነገሥት
  choice: शक्तिशाली जन और वे राजा
  rationale: पहले पद की व्यापक सामाजिक-राजनीतिक शक्ति और दूसरे पद की स्पष्ट राजकीय उपाधि, दोनों का भेद सुरक्षित रहता है।
- source_word: እለ ይእኅዝዋ ለየብስ
  choice: जो सूखी भूमि को अपने अधिकार में रखते हैं
  rationale: ‘सूखी भूमि’ मूल की ठोस छवि को बचाती है, जबकि ‘अपने अधिकार में रखते हैं’ उसके सम्भावित भू-राजनीतिक आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: እመላእክት መቅሠፍት
  choice: दण्ड देनेवाले स्वर्गदूतों से
  rationale: यह दण्ड के न्यायिक संदर्भ को स्पष्ट और सहज हिन्दी में व्यक्त करता है; ‘यातना’ की अपेक्षा यह कम व्याख्यात्मक है।
- source_word: በኀበ ሀለዉ ምጥዋነ
  choice: जिनके हाथों में वे सौंपे गए हैं
  rationale: दुर्बोध इथियोपिक वाक्यांश के सम्भावित अभिरक्षा-संबंध को व्यक्त करता है, पर पाठगत कठिनाई को पादटिप्पणी में खुला रखता है।
- source_word: ከመ የሀቦሙ ዕረፍተ ንስቲተ
  choice: कि वे उन्हें थोड़ी-सी राहत दें
  rationale: ‘राहत/विश्राम’ और उसकी अल्पता—दोनों तत्व सुरक्षित हैं; इससे दण्ड से स्थायी मुक्ति का दावा नहीं होता।
- source_word: ከመ ይደቁ ወይስግዱ
  choice: ताकि वे गिरकर ... दण्डवत् करें
  rationale: दोनों क्रियाओं में निहित शारीरिक अधीनता और आराधनापूर्ण झुकाव को बनाए रखता है।
- source_word: እግዚአ መናፍስት
  choice: आत्माओं के प्रभु
  rationale: यह हनोक की पुस्तक की विशिष्ट ईश्वरीय उपाधि का सीधा अनुवाद है और किसी बाद की सांप्रदायिक शब्दावली को आरोपित नहीं करता।
- source_word: ወይትአመኑ ኃጢአቶሙ
  choice: अपने पाप स्वीकार करें
  rationale: न्यायिक और पश्चात्ताप-सदृश प्रसंग में खुले रूप से पाप मानने का भाव देता है, बिना उनकी भीतरी मनःस्थिति तय किए।
theological_decisions:
- issue: क्या राजाओं की विनती सच्चा पश्चात्ताप है या दण्ड के अधीन विवश स्वीकारोक्ति
  choice: पाठ केवल थोड़ी राहत माँगने, दण्डवत् करने और पाप स्वीकार करने का उनका प्रस्ताव बताता है; उसकी सच्चाई या स्वीकृति निर्धारित नहीं करता।
  alternative: इसे या तो सच्चा पश्चात्ताप अथवा केवल विवश स्वीकारोक्ति मानना।
  rationale: मूल वचन उनके भीतर के परिवर्तन या परमेश्वर द्वारा उनकी स्वीकृति के विषय में कुछ नहीं कहता; अतः धार्मिक तनाव को अनिर्णीत रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘सूखी भूमि’, ‘गिरकर दण्डवत्’, और ‘आत्माओं के प्रभु’ जैसी मूल की विशिष्ट छवियों और उपाधियों को सुरक्षित रखा गया है। पादटिप्पणी-चिह्न संबंधित वाक्यांशों के तुरंत बाद लगाए गए हैं।
