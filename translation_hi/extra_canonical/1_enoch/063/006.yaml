base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/006.yaml
  text: Now we desire a little rest[a], but we do not find it; we are driven away, and we cannot seize it, and the light has passed away from before us[c][b], and darkness will be our dwelling forever and ever.
translation:
  language: hi
  text: अब हम थोड़ा-सा विश्राम चाहते हैं, पर वह हमें नहीं मिलता; हमें खदेड़ दिया जाता है, और हम उसे पकड़ नहीं पाते[a]। प्रकाश हमारे सामने से चला गया है, और अंधकार सदा-सर्वदा हमारा निवास-स्थान होगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसे पकड़ नहीं पाते” का वाक्यांश संक्षिप्त है। इसका अर्थ “उसे थाम नहीं पाते” या “उसे पा नहीं सकते” भी हो सकता है; “उसे” संभवतः मांगे गए विश्राम की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ जिस शब्द का अनुवाद “निवास-स्थान” किया गया है, वह कठिन है; “रहने का स्थान” भी संभव है। भाव यह है कि अंधकार उनका स्थायी भाग बन जाएगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: ይእዜኒ
  choice: अब
  rationale: वर्तमान दशा की ओर मोड़ने वाला कालसूचक पद; हिंदी में स्वाभाविक और संक्षिप्त।
- source_word: ንስቲተ፡ ዕረፍተ፡ ንትሜነይ
  choice: हम थोड़ा-सा विश्राम चाहते हैं
  rationale: नवीन स्रोत-समीक्षा के अनुसार ንስቲተ का अर्थ ‘थोड़ा-सा’ है और वह ‘विश्राम’ को विशेषित करता है; ንትሜነይ बहुवचन क्रिया ‘हम चाहते/लालसा करते हैं’ है।
- source_word: ወኢንረክብ
  choice: पर वह हमें नहीं मिलता
  rationale: विश्राम की अप्राप्ति को सहज हिंदी में व्यक्त करता है; ‘पर’ विलाप के विरोधभाव को स्पष्ट करता है।
- source_word: ንሰደድ
  choice: हमें खदेड़ दिया जाता है
  rationale: न्याय के प्रसंग में निष्कासन या दूर भगाए जाने का निष्क्रिय भाव बनाए रखता है।
- source_word: ወኢንእኅዝ
  choice: और हम उसे पकड़ नहीं पाते
  rationale: मूल क्रिया के पकड़ने/अधिकार में लेने के सजीव भाव को रखता है; ‘उसे’ संभवतः मांगे गए विश्राम की ओर संकेत करता है।
- source_word: ወብርሃን፡ እምቅድሜነ፡ ኀለፈ
  choice: प्रकाश हमारे सामने से जाता रहा है
  rationale: स्थानिक बिंब और प्रकाश की अपरिवर्तनीय हानि दोनों को गंभीर, स्वाभाविक हिंदी में रखता है।
- source_word: ወጽልመት፡ ምኅባሪነ
  choice: और अंधकार ... हमारा निवास होगा
  rationale: कठिन संज्ञा को प्रसंगानुसार ‘निवास’ समझा गया है, पर वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ለዓለመ፡ ዓለም
  choice: सदा-सर्वदा
  rationale: स्थायी और अंतहीन अवधि का पारंपरिक किंतु आधुनिक पाठकों के लिए स्पष्ट हिंदी रूप।
theological_decisions:
- issue: खोए हुए ‘प्रकाश’ और आने वाले ‘अंधकार’ का स्वरूप
  choice: न्याय के प्रलय-दर्शी बिंबों के रूप में यथावत रखा गया
  alternative: इसे केवल आंतरिक निराशा या केवल भौतिक अंधकार के रूप में स्पष्ट करना
  rationale: पद दोनों प्रकार के नैतिक और युगांतकारी संकेत दे सकता है; अनुवाद किसी एक अर्थ तक इसे सीमित नहीं करता।
- issue: ‘उसे पकड़ नहीं पाते’ में सर्वनाम का संदर्भ
  choice: संभावित रूप से ‘विश्राम’ की ओर संकेत करते हुए सर्वनाम रखा गया
  alternative: सर्वनाम हटाकर सामान्य असमर्थता व्यक्त करना
  rationale: मूल की संक्षिप्तता और संदर्भगत अस्पष्टता को बनाए रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिंदी; स्वर गंभीर और विलापपूर्ण है। सरल शब्दावली के साथ प्रलय-दर्शी प्रकाश-अंधकार बिंब तथा मूल की संक्षिप्त अस्पष्टता सुरक्षित रखी गई है।
