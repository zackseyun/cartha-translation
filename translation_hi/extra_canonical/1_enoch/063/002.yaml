base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/002.yaml
  text: And they will bless and praise the Lord of spirits, and they will say, “Blessed is the Lord of spirits, and the Lord of the kings, and the Lord of the mighty, and the Lord of the rich, and the Lord of glory, and the Lord of wisdom.”
translation:
  language: hi
  text: और वे आत्माओं के प्रभु को धन्य कहेंगे और उनकी स्तुति करेंगे, और कहेंगे, “आत्माओं का प्रभु धन्य है, और राजाओं का प्रभु, और शक्तिशालियों का प्रभु, और प्रतिष्ठितों का प्रभु,[a][b] और महिमा का प्रभु, और बुद्धि का प्रभु।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ प्रत्येक वर्ग और गुण के साथ “प्रभु” तथा “और” को दोहराता है; अनुवाद ने इस गंभीर, लयात्मक पुनरावृत्ति को बनाए रखा है।
    reason: cultural_note
  - marker: b
    text: “प्रतिष्ठितों” के लिए प्रयुक्त शब्द का अर्थ धनवानों, संपत्ति रखने वालों, या ऊँचे सामाजिक दर्जे वाले लोगों के रूप में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ይባርክዎ
  choice: धन्य कहेंगे
  rationale: गीज़ की क्रिया के भावी/दृष्टिपरक कथन और उसके पुरुषवाचक कर्म को स्वाभाविक हिन्दी में स्पष्ट करता है; ‘आशीष देंगे’ मनुष्यों द्वारा परमेश्वर को आशीष देने का भ्रामक अर्थ दे सकता था।
- source_word: ይሴብሕዎ
  choice: उनकी स्तुति करेंगे
  rationale: यह प्रशंसा की समानांतर क्रिया है; ‘उनकी’ मूल के कर्म-सूचक प्रत्यय को स्पष्ट रखता है।
- source_word: እግዚአ መንፈሳት / እግዚአ መናፍስት
  choice: आत्माओं का प्रभु
  rationale: 1 हनोक के स्थिर ईश्वरीय संबोधन को संक्षिप्त, गरिमापूर्ण और सुसंगत रूप में रखता है।
- source_word: ቡሩክ ውእቱ
  choice: धन्य है
  rationale: इसे कामना के बजाय घोषणात्मक जयघोष के रूप में प्रस्तुत करता है।
- source_word: እግዚኦሙ ለነገሥት
  choice: राजाओं का प्रभु
  rationale: राजाओं पर प्रभुता का भाव और बार-बार आने वाली शीर्षकीय संरचना दोनों सुरक्षित रहते हैं।
- source_word: ዐዚዛን
  choice: शक्तिशालियों
  rationale: यहाँ बल और सामाजिक-राजनीतिक सामर्थ्य रखने वाले व्यक्तियों का संकेत है; ‘शक्तिशाली’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: ብዑላን
  choice: धनवानों
  rationale: संदर्भ में संपत्ति रखने वाले अभिजात लोगों की ओर संकेत करता है; शब्द की कुछ व्यापकता को पादटिप्पणी में रखा गया है।
- source_word: እግዚአ ስብሐት
  choice: महिमा का प्रभु
  rationale: संज्ञा में स्तुति और वैभव की अर्थ-छाया होते हुए भी ‘महिमा’ प्रलयदर्शी गरिमा और शीर्षक की अमूर्त संरचना बनाए रखती है।
- source_word: እግዚአ ጥበብ
  choice: बुद्धि का प्रभु
  rationale: यह व्यापक wisdom का सहज और संक्षिप्त हिन्दी समतुल्य है; केवल बौद्धिक चतुराई तक सीमित नहीं करता।
theological_decisions:
- issue: बार-बार आने वाले ईश्वरीय संबोधन እግዚአ መንፈሳት का अनुवाद
  choice: आत्माओं का प्रभु
  alternative: आत्माओं के स्वामी
  rationale: ‘प्रभु’ 1 हनोक के इस विशिष्ट ईश्वरीय शीर्षक की गरिमा तथा ग्रंथ भर की पारिभाषिक स्थिरता बनाए रखता है।
- issue: ቡሩክ ውእቱ को आशीर्वचन या घोषणा मानना
  choice: धन्य है
  alternative: धन्य हो
  rationale: वाक्य-रचना बोले गए जयघोष या स्वीकारोक्ति को दर्शाती है; घोषणात्मक रूप मूल तनाव को बिना उसे प्रार्थनात्मक कामना बनाए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर प्रलयदर्शी जयघोष की गरिमा और गीज़ के बहुसंयोजक विन्यास को बनाए रखा गया है। ‘धन्य कहेंगे’ सामान्य पाठक के लिए स्पष्ट है और ईश्वर की स्तुति के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
