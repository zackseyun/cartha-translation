  yaml_path: translation/extra_canonical/1_enoch/039/010.yaml
  text: And my eyes saw in that place[a][him], and they blessed him.
translation:
  language: hi
  text: और उस स्थान पर मेरी आँखों ने बहुत कुछ[a] देखा, और मैंने उसे धन्य कहा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दिए गए गीइज़ प्रतिलेख का आरम्भिक शब्द दूषित है। आलोचनात्मक पाठ में यहाँ ‘और बहुत’ पढ़ा जाता है।
    reason: textual_variant
  - marker: b
    text: अंतिम क्रिया को ‘उन्होंने उसे धन्य कहा’ भी समझा जा सकता है; इस संक्षिप्त पंक्ति में कर्ता स्पष्ट रूप से व्यक्त नहीं है।
    reason: grammatical_alternative
lexical_decisions:
- source_word: ወ*ትንዳየ
  choice: बहुत कुछ
  rationale: दिया गया रूप तारक-चिह्न सहित दूषित पाठ प्रतीत होता है। उपलब्ध आलोचनात्मक साक्ष्य इसे ወብዙኀ (‘और बहुत/बहुत कुछ’) के रूप में पुनर्स्थापित करता है; ‘बहुत कुछ’ हिन्दी में सकर्मक ‘देखा’ के साथ स्वाभाविक है।
- source_word: ርእዩ አዕይንትየ
  choice: मेरी आँखों ने … देखा
  rationale: उत्तरवर्ती बहुवचन कर्ता ‘मेरी आँखें’ के साथ देखने की क्रिया को सीधी, स्वाभाविक हिन्दी में रखा गया है।
- source_word: በውእቱ መካን
  choice: उस स्थान पर
  rationale: पूर्वसर्ग, संकेतवाचक और ‘स्थान’ को संक्षिप्त तथा स्वाभाविक हिन्दी में व्यक्त करता है; अनावश्यक ‘वहाँ, उस स्थान पर’ दोहराव से बचता है।
- source_word: ወባረክዎ
  choice: और मैंने उसे धन्य कहा
  rationale: क्रियारूप को प्रथम पुरुष एकवचन कर्ता और तृतीय पुरुष पुल्लिंग कर्म के साथ समझा गया है। ‘धन्य कहा’ हिन्दी में किसी व्यक्ति की स्तुति/महिमा करते हुए उसे blessed कहने का सुबोध रूप है।
theological_decisions:
- issue: अंतिम क्रिया का कर्ता
  choice: मैंने उसे धन्य कहा
  alternative: उन्होंने उसे धन्य कहा
  rationale: रूप को प्रथम पुरुष एकवचन क्रिया तथा तृतीय पुरुष पुल्लिंग कर्म के रूप में लेना कथावाचक हनोक के बोलने से मेल खाता है। फिर भी उपलब्ध प्रतिलिपि और पूर्व विश्लेषण में बहुवचन पाठ की संभावना रही है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ‘उसे’ की पहचान
  choice: सर्वनाम को अनिर्दिष्ट रखा गया
  alternative: प्रभु को धन्य कहा
  rationale: इस छोटी स्रोत-पंक्ति में कर्म का नाम स्पष्ट नहीं है। संदर्भ के आधार पर उसका नाम जोड़ना संभावित अर्थ को निश्चित कर देता; इसलिए केवल ‘उसे’ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य सरल, गरिमापूर्ण और दर्शन-वृत्तांत के अनुरूप है। ‘धन्य कहा’ ने धार्मिक भाव बनाए रखा है, जबकि सर्वनाम के लक्ष्य को अनावश्यक रूप से निश्चित नहीं किया गया।
