base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/009.yaml
  text: In those days I praised and exalted the name of the Lord of Spirits with blessing and with praise[a], because he has strengthened me with blessing and with praise[b], according to the will of the Lord of Spirits.
translation:
  language: hi
  text: उन दिनों मैंने आशीष और स्तुति के साथ आत्माओं के प्रभु के नाम की स्तुति की और उस नाम को ऊँचा किया,[a] क्योंकि उसने आत्माओं के प्रभु की इच्छा के अनुसार मुझे आशीष और स्तुति के साथ दृढ़ किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “आशीष” का अर्थ मुख्यतः आशीष-वचन कहना, अर्थात प्रभु के नाम को धन्य कहना है; यह भौतिक वरदान पाने का उल्लेख नहीं है।
    reason: lexical_clarification
  - marker: b
    text: या “उसने मुझे आशीष और स्तुति के द्वारा मजबूत किया”; अथवा “आशीष और स्तुति में स्थापित किया।” मूल क्रिया में दृढ़, स्थिर, या स्थापित करने का भाव है। यहाँ का पूर्वसर्ग साधन, सहगामिता, या क्षेत्र—तीनों में से किसी का संकेत दे सकता है।
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: በውእቱን መዋዕል
  choice: उन दिनों
  rationale: यह प्रकाशित-दर्शन संबंधी प्रचलित काल-सूचक पदबंध है; हिन्दी में स्वाभाविक रहते हुए मूल की गरिमा बनाए रखता है।
- source_word: ሰባሕኩ ወአልዐልኩ ስሞ
  choice: मैंने ... नाम की स्तुति की और उसे ऊँचा किया
  rationale: दोनों क्रियाओं को अलग रखा गया है। ‘नाम को ऊँचा करना’ मूल की ठोस बाइबलीय अभिव्यक्ति को सामान्यीकृत किए बिना सुरक्षित रखता है।
- source_word: ለእግዚአ መናፍስት
  choice: आत्माओं के प्रभु
  rationale: 1 हनोक की विशिष्ट ईश्वरीय उपाधि को वर्णनात्मक सामान्य वाक्यांश में बदले बिना रखा गया है।
- source_word: በረከተ ወስብሐተ
  choice: आशीष और स्तुति के साथ
  rationale: यहाँ ‘आशीष’ भौतिक लाभ नहीं, आराधना में आशीष-वचन कहने का भाव रखती है; ‘के साथ’ उपासना की रीति को सहज हिन्दी में व्यक्त करता है।
- source_word: አጽንዐኒ
  choice: उसने मुझे ... दृढ़ किया
  rationale: कारक क्रिया का मूल भाव किसी को मजबूत, स्थिर या दृढ़ करना है। ‘दृढ़ किया’ इस अर्थ को सुरक्षित रखता है और निकटवर्ती पाठ में ‘स्थापित’ होने की संभावित शब्दगत कड़ी को पूरी तरह नहीं मिटाता।
- source_word: በበረከት ወስብሐት
  choice: आशीष और स्तुति में
  rationale: दूसरे पदबंध में በ को क्षेत्र या अवस्था के रूप में ‘में’ कहा गया है; साधनवाचक ‘के द्वारा’ भी संभव है, इसलिए अस्पष्टता पादटिप्पणी में दर्ज है।
- source_word: በከመ ፈቃዱ
  choice: की इच्छा के अनुसार
  rationale: यह ईश्वरीय इच्छा के अनुरूप होने का भाव सीधे और बिना अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़े व्यक्त करता है।
theological_decisions:
- issue: ‘आशीष और स्तुति’ के दोहराए गए पदबंध का अर्थ
  choice: पहला पदबंध उपासना की रीति और दूसरा वह क्षेत्र या अवस्था बताता है जिसमें हनोक को दृढ़ किया गया।
  alternative: दोनों पदबंध साधनवाचक हो सकते हैं—‘आशीष और स्तुति के साथ/द्वारा’; अथवा दूसरा परमेश्वर द्वारा हनोक को आशीष और स्तुति करने में समर्थ बनाने का संकेत दे सकता है।
  rationale: मूल की आराधनात्मक पुनरावृत्ति को रखा गया है और इसे भौतिक समृद्धि या पुरस्कार का कथन नहीं बनाया गया।
- issue: ईश्वरीय उपाधि እግዚአ መናፍስት
  choice: आत्माओं के प्रभु
  alternative: आत्माओं का प्रभु
  rationale: ‘के प्रभु’ उपाधि-सदृश रूप और मूल के संबंधसूचक विन्यास को बनाए रखता है; किसी बाद की प्रचलित उपाधि से इसका सामंजस्य नहीं किया गया।
- issue: አጽንዐኒ में दृढ़ करने और स्थापित करने का संबंध
  choice: दृढ़ किया
  alternative: स्थिर किया; स्थापित किया; मजबूत किया
  rationale: क्रिया का प्रमुख कारक अर्थ ‘दृढ़/स्थिर करना’ है। ‘स्थापित किया’ निकट संदर्भ की शब्दगत कड़ी को उभार सकता है, पर हिन्दी में व्यक्ति के साथ वह अधिक संस्थागत अर्थ दे सकता है; विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर दर्शन-साहित्य के अनुरूप गरिमापूर्ण रखी गई है। ‘आत्माओं के प्रभु’ को पूरे पद में एक समान विशिष्ट उपाधि के रूप में रखा गया है। पुनरावृत्ति को शैलीगत दोष मानकर हटाया नहीं गया, क्योंकि वह मूल की आराधनात्मक लय और अर्थगत तनाव का भाग है।
