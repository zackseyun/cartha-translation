base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/002.yaml
  text: And in those days Enoch received books of zeal and wrath[a], and books of tumult and confusion; and mercy shall not be upon them, says the Lord of Spirits.
translation:
  language: hi
  text: और उन दिनों हनोक ने उत्साह और कोप की पुस्तकें, तथा उपद्रव और अव्यवस्था की पुस्तकें[a] प्राप्त कीं; और उन पर दया नहीं होगी,” आत्माओं का प्रभु कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस साक्षी में पद के मध्य का गीइज़ पाठ कठिन है। जिन शब्दों का यहाँ ‘उपद्रव और अव्यवस्था’ अनुवाद किया गया है, उन्हें अधिक सामान्य रूप से ‘हलचल, पुकार या गड़बड़ी’ भी समझा जा सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: መዋዕል
  choice: दिनों
  rationale: यह मानक काल-सूचक शब्द है; ‘उन दिनों’ प्रलय-दर्शी काल-सूत्र को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ነሥአ
  choice: प्राप्त कीं
  rationale: पुस्तकों के संदर्भ में ‘प्राप्त कीं’ स्वाभाविक है और अधिक शाब्दिक ‘लीं’ से उत्पन्न आत्म-पहल के अनावश्यक संकेत से बचता है।
- source_word: መጻሕፍተ
  choice: पुस्तकें
  rationale: बहुवचन को सीधे रूप में रखता है; ‘पांडुलिपियाँ’ या ‘ग्रंथ-पट’ जैसी भौतिक विशिष्टता मूल में स्पष्ट नहीं है।
- source_word: ቅንአት
  choice: उत्साह
  rationale: शब्द में जलन, जोश या उत्साह का अर्थ हो सकता है; न्याय के प्रसंग में ‘उत्साह’ अर्थ को मानवीय ईर्ष्या तक सीमित नहीं करता।
- source_word: መዐት
  choice: कोप
  rationale: यह प्रलय-दर्शी न्याय की प्रबलता व्यक्त करता है और गरिमापूर्ण धार्मिक हिन्दी में स्वाभाविक है।
- source_word: ጐጕአ
  choice: उपद्रव
  rationale: पाठ कठिन है, पर अर्थ-क्षेत्र हलचल, कोलाहल या अशांति का संकेत देता है; ‘उपद्रव’ इस अनिश्चितता को पर्याप्त व्यापकता से रखता है।
- source_word: ሀውክ
  choice: अव्यवस्था
  rationale: यह गड़बड़ी और विघटन का भाव देता है तथा कठिन गीइज़ पाठ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: ምሕረት
  choice: दया
  rationale: ईश्वरीय mercy के लिए सरल, वर्तमान और व्यापक रूप से समझा जाने वाला हिन्दी शब्द है।
- source_word: ኢይከውን ላዕሌሆሙ
  choice: उन पर दया नहीं होगी
  rationale: मूल के ‘उन पर ... नहीं होगी’ निर्णय-सूत्र को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: እግዚአ መናፈስት
  choice: आत्माओं का प्रभु
  rationale: यह पुनरावर्ती ईश्वरीय उपाधि को उसके बहुवचन और गरिमापूर्ण स्वर सहित रखता है।
theological_decisions:
- issue: सूचीबद्ध ‘पुस्तकों’ का स्वरूप
  choice: हनोक को उत्साह और कोप, तथा उपद्रव और अव्यवस्था से संबद्ध अनेक प्रकाशनात्मक पुस्तकें प्राप्त होती हैं।
  alternative: इसे एक ही समूह की संयुक्त विशेषता माना जा सकता है; कठिन मध्यवर्ती शब्द विलाप या पुकार का संकेत भी दे सकते हैं।
  rationale: መጻሕፍተ की पुनरावृत्ति अनेक पुस्तकों/लेखों का समर्थन करती है। फिर भी कठिन पाठ के कारण उसके विषय को अत्यधिक निश्चित नहीं किया गया और पादटिप्पणी में अनिश्चितता स्पष्ट की गई है।
- issue: ‘उन’ का संदर्भ
  choice: ‘उन’ से आसपास के प्रसंग में न्याय के अधीन विरोधी लोग अभिप्रेत हैं।
  alternative: व्याकरणिक रूप से ढीली व्याख्या में इसे निकटवर्ती वस्तुओं से जोड़ा जा सकता है, पर प्रसंग में यह अस्वाभाविक होगा।
  rationale: ‘उन पर दया नहीं होगी’ एक न्याय-वचन है और स्वाभाविक रूप से दंडाधीन व्यक्तियों की ओर संकेत करता है, पुस्तकों की ओर नहीं।
- issue: वक्ता-सूत्र की प्रस्तुति
  choice: ‘आत्माओं का प्रभु कहता है’ को प्रत्यक्ष वचन से पहले रखा गया है।
  alternative: मूल क्रम के निकट इसे वाक्य के अंत में ‘आत्माओं का प्रभु कहता है’ रखा जा सकता है।
  rationale: गीइज़ में वक्ता-सूत्र अंत में है, पर हिन्दी में पहले रखना अर्थ और वक्ता को तुरंत स्पष्ट करता है; इससे कथ्य नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण प्रलय-दर्शी शैली। ‘कोप’ और ‘प्रभु’ ऊँचे धार्मिक स्वर को बनाए रखते हैं, जबकि वाक्य-विन्यास सामान्य पाठक के लिए स्पष्ट रखा गया है।
