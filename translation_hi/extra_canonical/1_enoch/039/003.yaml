- source_word: አንበረኒ
  choice: मुझे ... रख दिया
  rationale: दर्शन में एक निश्चित गंतव्य पर पहुँचा दिए जाने का भाव स्पष्ट करता है और मूल से अधिक विशिष्ट बैठने या बसने का अर्थ नहीं जोड़ता।
- source_word: ጽንፈ ሰማያት
  choice: आकाशों के छोर
  rationale: यह बाहरी किनारे अथवा अंतिम सीमा का स्थानिक अर्थ और बहुवचन ‘आकाशों’ को सुरक्षित रखता है।
