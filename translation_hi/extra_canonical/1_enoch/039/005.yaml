base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/005.yaml
  text: There my eyes saw their dwelling places with the angels of righteousness, and their resting places with the holy ones; and they were asking and pleading and praying on behalf of the children of men, and righteousness was flowing before them like water, and mercy like dew upon the earth. So it is among them forever and ever.
translation:
  language: hi
  text: वहाँ मेरी आँखों ने[a] उनके निवास-स्थानों को धार्मिकता के स्वर्गदूतों के साथ और उनके विश्राम-स्थानों[b] को पवित्र जनों[c] के साथ देखा। वे मनुष्यों की संतानों के लिए माँग रहे थे, विनती कर रहे थे और प्रार्थना कर रहे थे। उनके सामने धार्मिकता पानी के समान बह रही थी और दया पृथ्वी पर ओस के समान थी। ऐसा ही उनके बीच सदा-सर्वदा है।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक संरचना ‘मेरी आँखों ने देखा’ है; स्वाभाविक हिंदी में इसे ‘मैंने अपनी आँखों से देखा’ भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अर्थ ‘उनके शयन-स्थान’ या ‘उनकी शय्याएँ’ भी हो सकता है। मूल शब्द लेटने और विश्राम करने की जगह का बोध कराता है।
    reason: lexical_alternative
  - marker: c
    text: ‘पवित्र जन’ से स्वर्गीय पवित्र प्राणी, स्वर्गीय सभा में उपस्थित धर्मी, अथवा दोनों अभिप्रेत हो सकते हैं; गीज़ पद किसी एक पहचान को अनिवार्य नहीं करता।
    reason: alternative_reading
  - marker: d
    text: अंतिम वाक्य का अर्थ ‘ऐसा ही उनके बीच सदा-सर्वदा रहेगा’ भी लिया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: በህየ
  choice: वहाँ
  rationale: यह स्थानसूचक शब्द दर्शन के दृश्य का परिचय देता है; ‘वहाँ’ संक्षिप्त, स्वाभाविक और स्रोत के अनुरूप है।
- source_word: ርእያ አዕይንትየ
  choice: मेरी आँखों ने देखा
  rationale: गीज़ में ‘मेरी आँखें’ क्रिया का स्पष्ट कर्ता हैं। हिंदी में कुछ असामान्य लगने पर भी यह दर्शन-वर्णन की बलाघाती मूल संरचना को सुरक्षित रखता है।
- source_word: ማኅደሮሙ
  choice: उनके निवास-स्थान
  rationale: शब्द रहने अथवा बसेरे की जगहों को सूचित करता है; ‘निवास-स्थान’ स्वर्गीय प्रसंग के लिए गरिमापूर्ण और स्पष्ट है।
- source_word: መላእክተ ጽድቅ
  choice: धार्मिकता के स्वर्गदूत
  rationale: संबंधकारक संरचना को बनाए रखा गया है। ‘धार्मिकता’ इसी पद में आगे आने वाले ጽድቅ के साथ शब्दगत संगति भी रखती है।
- source_word: ምስካቢሆሙ
  choice: उनके विश्राम-स्थान
  rationale: यह शब्द लेटने, शयन करने या विश्राम की जगह का बोध करा सकता है। ‘विश्राम-स्थान’ फर्नीचर का अनावश्यक ठोस चित्र बनाए बिना अर्थ सुरक्षित रखता है।
- source_word: ቅዱሳን
  choice: पवित्र जन
  rationale: यह अभिव्यक्ति स्वर्गीय पवित्र प्राणियों, धर्मियों की पवित्र सभा, अथवा दोनों की ओर संकेत कर सकती है; ‘पवित्र जन’ इस अस्पष्टता को किसी बाद की पारिभाषिक श्रेणी में सीमित नहीं करता।
- source_word: ይስእሉ ወያስተበቍዑ ወይጼልዩ
  choice: माँग रहे थे, विनती कर रहे थे और प्रार्थना कर रहे थे
  rationale: तीनों क्रियाओं को अलग-अलग रखकर मध्यस्थ प्रार्थना की क्रमिक तीव्रता और स्रोत की अलंकारिक पुनरुक्ति सुरक्षित की गई है।
- source_word: በእንተ ውሉደ ሰብእ
  choice: मनुष्यों की संतानों के लिए
  rationale: यह औपचारिक किंतु समझने योग्य अभिव्यक्ति मूल मानवजाति-सूचक पदबंध को साधारण ‘लोगों’ में समतल नहीं करती।
- source_word: ጽድቅ ከመ ማይ ይውሕዝ ቅድሜሆሙ
  choice: उनके सामने धार्मिकता पानी के समान बह रही थी
  rationale: पानी की मूर्त और प्रचुर धारा वाली उपमा को बनाए रखते हुए ጽድቅ का अनुवाद ‘धार्मिकता’ किया गया है।
- source_word: ምሕረት ከመ ጠል ውስተ ምድር
  choice: दया पृथ्वी पर ओस के समान थी
  rationale: यह अनुवाद कोमल, जीवनदायी प्रचुरता की उपमा को सुरक्षित रखता है और स्रोत में न दी गई कोई विशिष्ट क्रिया नहीं जोड़ता।
- source_word: ከመዝ ውእቱ ማእከሎሙ ለዓለመ ዓለም
  choice: ऐसा ही उनके बीच सदा-सर्वदा रहता है
  rationale: वाक्य स्वर्गीय समुदाय की स्थायी दशा का सार प्रस्तुत करता है। ‘सदा-सर्वदा’ मूल की बलाघाती अनंतता को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: मध्यस्थ प्रार्थना करने वालों और स्वर्गीय समुदाय की पहचान
  choice: बहुवचन ‘वे’ को बिना अधिक स्पष्ट किए रखा गया है, ताकि वह स्वर्गदूतों, पवित्र जनों या संयुक्त स्वर्गीय समुदाय से संबंधित हो सके।
  alternative: इसे केवल स्वर्गदूतों या केवल दिवंगत धर्मियों की मध्यस्थ प्रार्थना के रूप में स्पष्ट करना।
  rationale: वाक्य-विन्यास निवास-स्थानों को धार्मिकता के स्वर्गदूतों से और विश्राम-स्थानों को पवित्र जनों से जोड़ता है, पर अगले बहुवचन कर्ता की ठीक पहचान निश्चित नहीं करता। अनुवाद किसी बाद की देवदूत-विज्ञान या संत-विषयक धारणा को आरोपित नहीं करता।
- issue: ጽድቅ का अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: यह शब्द स्वर्गदूतों की उपाधि और पानी की तरह बहने वाली वास्तविकता—दोनों में आता है। ‘धार्मिकता’ दृश्य के नैतिक और विश्वव्यापी आयाम को अधिक व्यापक रूप से सुरक्षित रखती है, जबकि ‘न्याय’ संभव अर्थछाया है।
- issue: अंतिम कथन का कालगत अर्थ
  choice: वर्तमान और स्थायी दशा—‘रहता है’
  alternative: भावी दशा—‘रहेगा’
  rationale: गीज़ कथन को वर्तमान सार की तरह पढ़ा जा सकता है, किंतु प्रसंग भावी अर्थछाया की अनुमति देता है; इसे पादटिप्पणी में खुला रखा गया है।
