  register: भाषा आधुनिक मानक हिंदी में गरिमापूर्ण और दर्शन-वर्णन के अनुकूल रखी गई है। स्रोत की बलाघाती ‘मेरी आँखों ने देखा’ संरचना जानबूझकर सुरक्षित है। ‘स्वर्गदूत’, ‘धार्मिकता’, ‘पवित्र जन’ और ‘सदा-सर्वदा’ साधारण पाठकों के लिए बोधगम्य रहते हुए ऊँचे अपोकैलिप्टिक रजिस्टर को बनाए रखते हैं।
