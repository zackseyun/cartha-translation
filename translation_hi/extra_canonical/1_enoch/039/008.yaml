base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/008.yaml
  text: There I desired to dwell[a], and my spirit longed for that dwelling place; there my portion was before[c][b], for thus it was established for me before the Lord of Spirits.
translation:
  language: hi
  text: वहाँ मैंने निवास करने की इच्छा की, और मेरी आत्मा उस निवास-स्थान के लिए लालायित हुई; वहाँ मेरा भाग पहले से था[a], क्योंकि इसी प्रकार वह मेरे लिए आत्माओं के प्रभु के सामने स्थिर किया गया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वहाँ मेरा भाग पहले था।” मूल गीइज़ में “भाग” और “पहले” वाली अभिव्यक्ति संक्षिप्त है; “पहले से” पूर्वस्थिति का भाव व्यक्त करता है, पर वाक्य को कुछ अधिक शाब्दिक रूप में भी पढ़ा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “आत्माओं के प्रभु” इस ग्रंथ के दृष्टान्तों में प्रयुक्त एक विशिष्ट ईश्वरीय उपाधि है; इसे इसी रचना की अपनी शब्दावली के अनुसार समझना चाहिए।
    reason: cross_reference
lexical_decisions:
- source_word: ህየ
  choice: वहाँ
  rationale: यह दर्शन में दिखाए गए स्थान की ओर संकेत करने वाला स्थानवाचक क्रियाविशेषण है।
- source_word: ፈቀድኩ አኅድር
  choice: मैंने निवास करने की इच्छा की
  rationale: यह अभिव्यक्ति अस्थायी रूप से ठहरने के बजाय वहाँ रहने की इच्छा व्यक्त करती है।
- source_word: ወፈተወት መንፈስየ
  choice: और मेरी आत्मा ... लालायित हुई
  rationale: यह भीतर की प्रबल अभिलाषा को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ለውእቱ ማኅደር
  choice: उस निवास-स्थान के लिए
  rationale: मूल शब्द किसी ठोस निवास अथवा रहने की जगह को दर्शाता है और पहले के 'निवास करने' से संबंध बनाए रखता है।
- source_word: በህየ ኮነ ክፍለየ ቅድመ
  choice: वहाँ मेरा भाग पहले से था
  rationale: ኮነ के सरल 'था/हुआ' अर्थ को बनाए रखा गया है; 'सौंपा गया था' जोड़कर निहित आवंटन को मूल से अधिक स्पष्ट नहीं किया गया। ቅድመ को यहाँ कालगत अर्थ में लिया गया है।
- source_word: እስመ ከመዝ ጸንዐ በእንቲአየ
  choice: क्योंकि इसी प्रकार वह मेरे लिए ... स्थिर किया गया था
  rationale: यह कारणसूचक संबंध और दृढ़ किए जाने के भाव को बनाए रखता है, जबकि 'वह' का संदर्भ पहले आए 'भाग' से है।
- source_word: በቅድመ እግዚአ መናፍስት
  choice: आत्माओं के प्रभु के सामने
  rationale: दूसरा ቅድመ स्थानगत/संबंधगत अर्थ में स्वाभाविक रूप से 'के सामने' है। यह इस खंड के विशिष्ट ईश्वरीय संबोधन को बिना किसी बाद की धर्मवैज्ञानिक शब्दावली में मिलाए सुरक्षित रखता है।
theological_decisions:
- issue: दर्शी के 'भाग' का स्वरूप
  choice: पाठ में स्वर्गीय निवास से जुड़ा उसका पहले से विद्यमान भाग कहा गया है, और अगली उपवाक्य में उसके लिए स्थिर किए जाने की बात आती है।
  alternative: इसे स्पष्ट रूप से 'पहले से आवंटित स्थान' कहना, अथवा केवल रूपकात्मक आत्मिक अभिलाषा मानना।
  rationale: निवास-स्थान, भाग और स्थिर किए जाने का मेल किसी निश्चित हिस्से या स्थान का संकेत देता है; फिर भी ኮነ में प्रत्यक्ष रूप से 'आवंटित किया गया' नहीं है, इसलिए मुख्य पाठ उस व्याख्या को नहीं जोड़ता।
- issue: '''आत्माओं के प्रभु'' उपाधि'
  choice: आत्माओं के प्रभु
  alternative: आत्माओं के स्वामी
  rationale: यह दृष्टान्तों के इस भाग की विशिष्ट ईश्वरीय उपाधि है; 'प्रभु' गरिमापूर्ण, बोधगम्य और आंतरिक पदावली के अनुरूप है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। 'निवास', 'आत्मा', 'भाग' और 'स्थिर किया गया' मूल की ठोस तथा धार्मिक छवियों को बनाए रखते हैं। दोनों बार आए ቅድመ का संदर्भानुसार क्रमशः 'पहले से' और 'के सामने' अनुवाद किया गया है।
