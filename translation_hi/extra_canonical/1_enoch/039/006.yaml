base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/006.yaml
  text: And in that place my eyes saw the Chosen One of righteousness and of faith[a], and righteousness shall be in his days[c][b]; and the righteous and the chosen will be without number before him forever and ever.
translation:
  language: hi
  text: और उस स्थान पर मेरी आँखों ने धार्मिकता और विश्वास[a] का चुना हुआ जन देखा; और उसके दिनों में धार्मिकता होगी[c]; और धर्मी तथा चुने हुए लोग उसके सामने युगानुयुग असंख्य होंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विश्वासयोग्यता’ अथवा ‘निष्ठा’। गीज़ शब्द इस संक्षिप्त उपाधि में विश्वास, विश्वसनीयता या दृढ़ निष्ठा का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘उसके सामने उनकी कोई गिनती नहीं होगी।’
    reason: lexical_alternative
  - marker: c
    text: या ‘धार्मिकता प्रबल होगी।’
    reason: previous_rendering
lexical_decisions:
- source_word: መካን
  choice: स्थान
  rationale: यह सामान्य स्थानवाचक शब्द है; ‘स्थान’ दर्शन के स्थानिक परिवेश को बिना अनावश्यक विशिष्टता दिए सुरक्षित रखता है।
- source_word: ኀሩየ
  choice: चुने हुए जन
  rationale: यहाँ यह विशेषण मात्र नहीं, एकवचन व्यक्तिवाचक उपाधि के रूप में प्रयुक्त है। ‘चुने हुए जन’ आधुनिक हिन्दी में सम्मानपूर्ण और सुबोध है तथा आगे बहुवचन ‘चुने हुए लोग’ से शब्दगत संबंध बनाए रखता है।
- source_word: ለጽድቅ
  choice: धार्मिकता के
  rationale: इस संक्षिप्त उपाधि में संबंधसूचक अर्थ सबसे उपयुक्त है और उस व्यक्ति को धार्मिकता से संबद्ध बताता है।
- source_word: ወዘሃይማኖት
  choice: और विश्वास के
  rationale: मूल संज्ञा ‘विश्वास’ अथवा ‘विश्वासयोग्यता/निष्ठा’ का बोध करा सकती है। मुख्य पाठ में निकट और पारदर्शी विकल्प ‘विश्वास’ रखा गया है तथा दूसरा अर्थ पादटिप्पणी में दिया गया है।
- source_word: ይከውን
  choice: होगी
  rationale: यह ኮነ (‘होना’) का रूप है। ‘होगी’ मूल के सरल कथन को बचाता है और ‘प्रबल होगी’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: በመዋዕሊሁ
  choice: उसके दिनों में
  rationale: यह मानक कालवाचक अभिव्यक्ति है; हिन्दी में भी संक्षिप्त और स्वाभाविक है।
- source_word: ኄራያን
  choice: चुने हुए लोग
  rationale: यह बहुवचन है और एकवचन उपाधि ኀሩየ के साथ शब्दगत निरंतरता बनाए रखता है।
- source_word: ኈልቈ አልቦሙ
  choice: असंख्य होंगे
  rationale: मूल मुहावरे का शाब्दिक भाव है कि उनकी कोई गिनती नहीं होगी। ‘असंख्य होंगे’ वही अर्थ स्वाभाविक हिन्दी में देता है।
- source_word: ቅድሜሁ
  choice: उसके सामने
  rationale: यह उपस्थिति अथवा सम्मुख होने का औपचारिक भाव बनाए रखता है, बिना ‘मुख के सामने’ जैसी अस्वाभाविक शाब्दिकता के।
- source_word: ለዓለመ ዓለም
  choice: युगानुयुग
  rationale: यह अनन्त अवधि का गंभीर और प्रचलित हिन्दी रूप है, जो मूल की आवृत्तिमूलक गरिमा को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: क्या ኀሩየ को उपाधि माना जाए या सामान्य वर्णन
  choice: इसे एक विशिष्ट व्यक्ति की उपाधि के रूप में ‘चुने हुए जन’ अनूदित किया गया है।
  alternative: ‘चुना हुआ व्यक्ति’ अथवा सामान्य विशेषण ‘चुना हुआ’
  rationale: दृष्टान्तों के इस खंड में यह एक विशिष्ट, प्रतिष्ठित व्यक्ति को सूचित करता है। हिन्दी रूप साहित्यिक कार्य को दर्शाता है, पर उस व्यक्ति को बाद की किसी धार्मिक पहचान से नहीं जोड़ता।
- issue: ሃይማኖት का अर्थ
  choice: मुख्य पाठ में ‘विश्वास’, पादटिप्पणी में ‘विश्वासयोग्यता’ अथवा ‘निष्ठा’।
  alternative: मुख्य पाठ में ‘विश्वासयोग्यता’ या ‘निष्ठा’
  rationale: गीज़ शब्द दोनों अर्थक्षेत्रों को समेट सकता है। संक्षिप्त और धर्मवैचारिक रूप से महत्त्वपूर्ण वाक्यांश की वास्तविक अस्पष्टता को पादटिप्पणी सहित सुरक्षित रखा गया है।
- issue: ይከውን के साथ धार्मिकता के कथन का बल
  choice: ‘धार्मिकता होगी’
  alternative: ‘धार्मिकता प्रबल होगी’
  rationale: क्रिया का मूल अर्थ ‘होना’ है। सरल रूप अपोकैलिप्टिक कथन की मूलभूत शैली को बनाए रखता है और विजय या प्रभुत्व का अनुलिखित भाव नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर दर्शनात्मक और गंभीर लहजा बनाए रखा गया है। ‘चुने हुए जन’ एकवचन उपाधि है; ‘चुने हुए लोग’ उसका बहुवचन समकक्ष। सभी वास्तविक शाब्दिक और धर्मवैचारिक अस्पष्टताएँ पादटिप्पणियों में स्पष्ट रखी गई हैं।
