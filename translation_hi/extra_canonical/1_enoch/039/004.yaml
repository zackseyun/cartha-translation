base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/004.yaml
  text: 'And there I saw another vision: the dwelling places of the holy ones[a], and the resting places of the righteous.'
translation:
  language: hi
  text: 'और वहाँ मैंने एक और दर्शन देखा: पवित्र जनों के निवास-स्थान और धर्मियों के विश्राम-स्थान[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ अनूदित “विश्राम-स्थान” का अधिक शाब्दिक अर्थ बिछौने, पलंग, या सोने के स्थान भी हो सकता है। दर्शन में धर्मियों के निवासों के वर्णन के कारण मुख्य पाठ में इसका व्यापक अर्थ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: በህየ
  choice: वहाँ
  rationale: यह स्थानवाचक क्रियाविशेषण दर्शन के दृश्य-स्थल को सूचित करता है; ‘वहाँ’ सहज और सीधा हिन्दी रूप है।
- source_word: ርኢኩ
  choice: मैंने ... देखा
  rationale: यह प्रथम पुरुष में दर्शन-वृत्तांत का सामान्य कथन है; सरल हिन्दी में इसकी प्रत्यक्षता बनी रहती है।
- source_word: ራእየ ካልአ
  choice: एक और दर्शन
  rationale: यह आगे मिले एक अन्य दर्शनीय प्रकाशन को बताता है। ‘दूसरा दर्शन’ की अपेक्षा ‘एक और दर्शन’ अनावश्यक क्रम-संख्या निश्चित नहीं करता।
- source_word: ማኅደሪሆሙ
  choice: निवास-स्थान
  rationale: शब्द निवास या बसेरे का अर्थ देता है और बहुवचन संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ለቅዱሳን
  choice: पवित्र जनों के
  rationale: यह संबद्धता/अधिकार को व्यक्त करता है। ‘पवित्र जन’ शब्द को मनुष्यों या स्वर्गीय प्राणियों तक सीमित किए बिना मूल की व्यापकता बनाए रखता है।
- source_word: ወምስካባቲሆሙ
  choice: और ... विश्राम-स्थान
  rationale: मूल संज्ञा लेटने, बिछौने या सोने के स्थान से जुड़ी है। मुख्य पाठ में ‘विश्राम-स्थान’ संदर्भानुकूल है, जबकि अधिक ठोस अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ለጻድቃን
  choice: धर्मियों के
  rationale: यह नैतिक और न्याय-संबंधी अर्थ वाले ‘righteous’ का प्रचलित, गरिमापूर्ण हिन्दी रूप है और पूर्ववर्ती संज्ञा से संबंध दर्शाता है।
theological_decisions:
- issue: ቅዱሳን से मनुष्य, स्वर्गीय प्राणी, या परमेश्वर के सिद्ध ठहराए गए लोग अभिप्रेत हैं या नहीं।
  choice: पवित्र जन
  alternative: संत; पवित्र लोग
  rationale: ‘पवित्र जन’ अपोकैलिप्टिक संदर्भ की संभावित व्यापकता और अस्पष्टता बनाए रखता है तथा बाद की किसी विशेष कलीसियाई धारणा को पाठ पर आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और दर्शन-साहित्य के अनुरूप शैली रखी गई है। ‘पवित्र जन’ मूल की पहचान-संबंधी अस्पष्टता को बचाता है; ‘निवास-स्थान’ और ‘विश्राम-स्थान’ समानांतर काव्यात्मक संरचना बनाए रखते हैं।
