base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/007.yaml
  text: And I saw the dwelling-place beneath the wings of the Lord of Spirits[a]; and all the righteous and the chosen shone before him like the light of fire, and their mouths were filled with blessing, and their lips praised the name of the Lord of Spirits. And righteousness does not fail before him[c][b], and uprightness does not fail before him.
translation:
  language: hi
  text: और मैंने आत्माओं के प्रभु के पंखों के नीचे निवास-स्थान देखा[c]; और सभी धर्मी और चुने हुए[a] उसके सामने आग के प्रकाश के समान चमक रहे थे। उनके मुँह आशीष से भरे थे, और उनके होंठ आत्माओं के प्रभु के नाम की स्तुति कर रहे थे। उसके सामने धार्मिकता समाप्त नहीं होती[b], और खराई समाप्त नहीं होती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्वाचित जन।”
    reason: lexical_alternative
  - marker: b
    text: “समाप्त नहीं होती” का अनुवाद “नष्ट नहीं होती,” “मिटती नहीं,” या “उसका अंत नहीं होता” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: “पंखों के नीचे” की छवि को शाब्दिक रखा गया है, ताकि आत्माओं के प्रभु की शरण और निकटता का दर्शनीय प्रतीक बना रहे।
    reason: cultural_note
lexical_decisions:
- source_word: ማኅደረ
  choice: निवास-स्थान
  rationale: यह ठोस दर्शनीय स्थान को व्यक्त करता है और आधुनिक हिन्दी में गरिमापूर्ण तथा स्पष्ट है।
- source_word: መትሕተ አክናፈ
  choice: पंखों के नीचे
  rationale: स्थान-संबंधी अर्थ और शरण व निकटता की दर्शनीय छवि को बिना व्याख्यात्मक विस्तार के अक्षुण्ण रखता है।
- source_word: እግዚአ መናፍስት
  choice: आत्माओं का प्रभु
  rationale: 1 हनोक में बार-बार आने वाली उपाधि का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ጻድቃን ወኄሩያን
  choice: धर्मी और चुने हुए
  rationale: दो समानांतर समुदायों को अलग बनाए रखता है; ‘चुने हुए’ बाद के संप्रदायगत अर्थों को अनावश्यक रूप से नहीं थोपता।
- source_word: ይትሰሐዩ
  choice: चमक रहे थे
  rationale: क्रिया की प्रकाशमान होने की दृश्यात्मकता को सहज हिन्दी में व्यक्त करता है।
- source_word: ከመ ብርሃነ እሳት
  choice: आग के प्रकाश के समान
  rationale: मूल की असामान्य उपमा को सामान्यीकृत किए बिना निकटता से सुरक्षित रखता है।
- source_word: አፉሆሙ ይመልእ በረከተ
  choice: उनके मुँह आशीष से भरे थे
  rationale: ‘आशीष’ के विशिष्ट अर्थ को ‘स्तुति’ में विलीन नहीं करता और अगले समानांतर वाक्यांश से भेद बनाए रखता है।
- source_word: ከናፍሪሆሙ ይሴብሑ
  choice: उनके होंठ ... स्तुति कर रहे थे
  rationale: मुँह और होंठ के काव्यात्मक समानांतर को बनाए रखते हुए प्रशंसा की क्रिया स्पष्ट करता है।
- source_word: ጽድቅ
  choice: धार्मिकता
  rationale: ईश्वर के सामने विद्यमान नैतिक गुण के लिए प्रचलित और प्रसंगानुकूल पद है।
- source_word: ወርትዕ
  choice: खराई
  rationale: नैतिक सीधेपन और निष्कपटता का स्वाभाविक हिन्दी बोध देता है तथा ‘धार्मिकता’ से अर्थगत समानांतर बनाए रखता है।
- source_word: ኢየኃልቅ
  choice: कभी समाप्त नहीं होती
  rationale: दोहराई गई क्रिया के स्थायित्व-बोध को व्यक्त करता है; नष्ट होने, चूकने या अंत होने की संभावनाएँ भी अर्थ-क्षेत्र में रहती हैं।
theological_decisions:
- issue: ኄሩያን का अपोकैलिप्टिक और संभावित रूप से सिद्धान्तगत अर्थ
  choice: चुने हुए
  alternative: निर्वाचित जन
  rationale: ‘चुने हुए’ स्थानीय श्रेणी को स्पष्ट रखता है और बाद की व्यवस्थित धर्मशास्त्रीय धारणाओं को आवश्यकता से अधिक नहीं लाता।
- issue: धार्मिकता और खराई के विषय में दोहराई गई अंतिम क्रिया
  choice: कभी समाप्त नहीं होती
  alternative: नष्ट नहीं होती / चूकती नहीं
  rationale: यह ईश्वर के सामने इनके स्थायी बने रहने को व्यक्त करता है, जबकि मूल क्रिया की व्यापक अर्थ-संभावना को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। दर्शनीय प्रतीक ‘पंखों के नीचे’ को शाब्दिक रखा गया है। दो समानांतर वर्ग—धर्मी और चुने हुए—तथा अंतिम दो नैतिक अमूर्त गुणों की समानांतर रचना सुरक्षित रखी गई है।
