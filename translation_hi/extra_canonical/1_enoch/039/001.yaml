base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/001.yaml
  text: And it will happen in those days that the chosen and holy ones will descend from the high heaven[d][c][b][a], and their offspring will become one with the children of men.
translation:
  language: hi
  text: और उन दिनों ऐसा होगा कि चुनी हुई और पवित्र संतान ऊँचे स्वर्ग से उतरेगी,[a][b] और उनका वंश मनुष्यों की संतान के साथ एक हो जाएगा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चुने हुए और पवित्र जन उतरेंगे।” गीइज़ पद ደቂቅ का सामान्य अर्थ “बच्चे” या “संतान” है और उसके बाद के शब्द “चुनी हुई” और “पवित्र” विशेषणों के रूप में समझे जा सकते हैं; फिर भी कुछ व्याख्याएँ इन विशेषणों को संज्ञा मानती हैं।
    reason: grammatical_alternative
  - marker: b
    text: “ऊँचे स्वर्ग से” उनके स्वर्गीय उद्गम की ओर संकेत करता है, पर यह पद अकेला यह निश्चित नहीं करता कि वे स्वर्गदूत हैं, धर्मी जन हैं, या कोई अन्य स्वर्गीय समुदाय।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से, “उनका बीज मनुष्यों की संतान के साथ एक हो जाएगा।” यहाँ किसी प्रकार के मेल या सम्मिश्रण का भाव है, पर उसकी ठीक प्रकृति इस पद में नहीं बताई गई।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይከውን፡ በዝኩ፡ መዋዕል
  choice: और उन दिनों ऐसा होगा
  rationale: आरम्भिक भविष्यसूचक सूत्र को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है; इससे मूल का ‘और ऐसा होगा’ तथा ‘उन दिनों’ दोनों सुरक्षित रहते हैं।
- source_word: ይወርዱ
  choice: उतरेंगे
  rationale: ऊँचे स्वर्ग से नीचे आने की दिशात्मक छवि को सीधे सुरक्षित रखता है।
- source_word: ደቂቅ፡ ኅሩያን፡ ወቅዱሳን
  choice: चुने हुए और पवित्र जन
  rationale: उपलब्ध पाठ और संशोधन-इतिहास में पदसम्बन्ध को लेकर तनाव है। मुख्य पाठ अंतिम परामर्श-पाठ के ‘chosen and holy ones’ का अनुसरण करता है, पर ‘जन’ उनकी ठीक पहचान या लिंग निर्धारित नहीं करता; वैकल्पिक व्याकरणिक सम्भावना पादटिप्पणी में दी गई है।
- source_word: እምልዑል፡ ሰማይ
  choice: ऊँचे स्वर्ग से
  rationale: एकवचन ‘स्वर्ग’ और उसकी ऊँची, दिव्य स्थिति दोनों को बिना किसी विस्तृत लोक-विज्ञान को आरोपित किए व्यक्त करता है।
- source_word: ዘርኦሙ
  choice: उनका वंश
  rationale: ‘बीज’ की शाब्दिक छवि के बजाय वंशगत अर्थ को वर्तमान हिन्दी में स्वाभाविक रूप से व्यक्त करता है, पर सन्तति/वंश की अस्पष्टता बनाए रखता है।
- source_word: አሐደ፡ ይከውን፡ ምስለ፡ ውሉደ፡ ሰብእ
  choice: मनुष्यों की सन्तान के साथ एक हो जाएगा
  rationale: मूल में व्यक्त एकत्व या मेल को सुरक्षित रखता है और उसे स्पष्ट रूप से विवाह, यौन सम्बन्ध या किसी अन्य विशेष प्रक्रिया में नहीं बदलता।
theological_decisions:
- issue: ‘चुने हुए और पवित्र जन’ की पहचान
  choice: उन्हें सामान्य उपाधि के रूप में प्रस्तुत किया गया है और स्वर्ग से उतरने वाला समूह माना गया है, पर उनकी श्रेणी निश्चित नहीं की गई।
  alternative: उन्हें स्वर्गदूत, धर्मी मनुष्य, या कोई प्रतीकात्मक स्वर्गीय समुदाय कहना।
  rationale: ऊँचे स्वर्ग से उतरना स्वर्गीय उत्पत्ति की ओर संकेत करता है, लेकिन यह पद अकेला उनकी ठीक पहचान सिद्ध नहीं करता।
- issue: ‘एक हो जाएगा’ का आशय
  choice: अनिर्दिष्ट एकत्व या सम्मिश्रण
  alternative: विवाह, यौन-संबंध, प्रजनन, या सामान्य सामाजिक सम्मिलन
  rationale: हनोक की व्यापक कथा अधिक विशिष्ट अर्थ सुझा सकती है, किन्तु इस गीइज़ वाक्य में प्रक्रिया स्पष्ट नहीं की गई है।
- issue: ደቂቅ का वाक्यगत सम्बन्ध
  choice: मुख्य पाठ में ‘चुने हुए और पवित्र जन’
  alternative: ‘चुने हुए और पवित्र बच्चे/सन्तान’
  rationale: प्रदत्त अंग्रेज़ी परामर्श-पाठ की अंतिम संशोधित प्रस्तुति पहले विकल्प को अपनाती है, जबकि पूर्व व्याकरणिक समीक्षा absolute-state रूप के आधार पर दूसरे विकल्प का समर्थन करती है। इस वास्तविक पाठगत-व्याकरणिक तनाव को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यसूचक शैली अपनाई गई है। ‘पवित्र जन’, ‘ऊँचा स्वर्ग’ और ‘मनुष्यों की सन्तान’ मूल के उन्नत स्वर को रखते हैं, जबकि वाक्य-संरचना सामान्य पाठक के लिए सहज है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
