base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/001.yaml
  text: And now[a], my son Methuselah, I will show you all my visions that I have seen before you; I will recount them.
translation:
  language: hi
  text: और अब, मेरे पुत्र मतूशेलह, मैं तुझे अपने वे सभी दर्शन दिखाऊँगा[a] जो मैंने देखे हैं; मैं तेरे सामने उनका वर्णन करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल पाठ में प्रकट करने की दो अलग क्रियाएँ हैं: पहले ‘दिखाऊँगा,’ फिर ‘वर्णन करूँगा।’ इस जोड़ी में दर्शन को सामने रखने और उसे शब्दों में सुनाने—दोनों पर बल है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: और अब
  rationale: यह पदबंध नए कथन की ओर संक्रमण कराता है। ‘और अब’ उसके संयोजक और काल-सूचक दोनों पक्षों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: አርእየከ፡
  choice: मैं तुझे … दिखाऊँगा
  rationale: कारक रूप वाले ‘दिखाना’ क्रिया-पद और द्वितीय पुरुष एकवचन कर्म-प्रत्यय को व्यक्त करता है। प्रसंग में हनोक आगे अपने दर्शन प्रकट करने वाला है, इसलिए भविष्यकाल उपयुक्त है।
- source_word: ወልድየ፡ ማቱሳላ፡
  choice: मेरे पुत्र मतूशेलह
  rationale: पुत्र को किया गया सीधा, आत्मीय संबोधन सुरक्षित रखा गया है; नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण लिया गया है।
- source_word: ኵሎ፡ ራእያትየ፡
  choice: अपने वे सभी दर्शन
  rationale: ‘दर्शन’ अलौकिक रूप से देखे गए दृश्यों का भाव रखता है और व्यापक ‘प्रकाशन’ की अपेक्षा मूल के दर्शन-संबंधी अर्थ के अधिक निकट है।
- source_word: እለ፡ ርኢኩ፡
  choice: जो मैंने देखे हैं
  rationale: यह संबंधवाचक उपवाक्य दर्शनों को विशिष्ट करता है। पूर्ण अनुभव का वर्तमान कथन से संबंध दिखाने के लिए हिन्दी पूर्णकाल स्वाभाविक है।
- source_word: በቅድሜከ፡ እነግር።
  choice: मैं तेरे सामने उनका वर्णन करूँगा
  rationale: ‘तेरे सामने’ मूल के उपस्थिति-सूचक पदबंध को और ‘वर्णन करूँगा’ कथन/वृत्तांत सुनाने वाली क्रिया को व्यक्त करता है। शब्दक्रम के आधार पर यहाँ पदबंध को अंतिम कथन-क्रिया से जोड़ा गया है।
theological_decisions:
- issue: ‘दिखाने’ और ‘वर्णन करने’ वाली दो क्रियाओं का संबंध
  choice: 'दोनों क्रियाओं को अलग रखा गया: ‘दिखाऊँगा’ और ‘वर्णन करूँगा’।'
  alternative: दोनों को ‘बताऊँगा’ या ‘प्रकट करूँगा’ जैसी एक ही क्रिया में मिला देना।
  rationale: गीज़ पाठ दर्शन को दिखाने और उसका वृत्तांत कहने के लिए अलग-अलग क्रियाएँ रखता है। दोनों को बनाए रखने से दृश्य अनुभव और मौखिक कथन का तनाव सुरक्षित रहता है।
- issue: በቅድሜከ፡ (‘तेरे सामने’) का वाक्य में संबंध
  choice: इसे निकटवर्ती अंतिम क्रिया ‘वर्णन करूँगा’ से जोड़ा गया है।
  alternative: इसे ‘जो मैंने तेरे सामने देखे हैं’ के रूप में ‘देखे हैं’ से जोड़ना।
  rationale: मूल शब्दक्रम में यह पदबंध संबंधवाचक खंड के बाद और ‘मैं वर्णन करूँगा’ से ठीक पहले आता है, इसलिए अंतिम क्रिया से इसका संबंध अधिक स्वाभाविक है। फिर भी वाक्य-विन्यास दूसरी संबद्धता की संभावना को पूरी तरह समाप्त नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। एक प्राचीन पिता-पुत्र संबोधन के अनुरूप ‘तू/तेरे’ रूप रखा गया है, पर भाषा को अत्यधिक पुरातन नहीं बनाया गया। अर्धविराम दोनों निकट-संबंधित प्रकटीकरण क्रियाओं को अलग पहचान देता है।
