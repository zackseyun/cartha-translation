base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/004.yaml
  text: And when it fell upon the earth[a], I saw the earth being swallowed into a great abyss, and mountains were suspended upon mountains, and hills sank down upon hills[d][c][b], and tall trees were cut off from their trunks and were thrown down and sank into the abyss.
translation:
  language: hi
  text: और जब वह पृथ्वी पर गिरा, तब मैंने देखा कि पृथ्वी एक विशाल अथाह गर्त में निगली जा रही थी[a]; पहाड़ पहाड़ों के ऊपर लटके हुए थे[b], और पहाड़ियाँ पहाड़ियों के ऊपर धँस गईं; ऊँचे पेड़ अपने तनों के निचले भाग से काट दिए गए[c], नीचे फेंक दिए गए और उस अथाह गर्त में डूब गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अथाह गर्त’ का अनुवाद ‘विशाल गहराई’ या ‘विशाल खाई’ भी हो सकता है। गीइज़ पद अत्यंत गहरे स्थान का बोध कराता है।
    reason: lexical_alternative
  - marker: b
    text: ‘पहाड़ पहाड़ों के ऊपर लटके हुए थे’ दर्शन का जानबूझकर असामान्य चित्र है; इसे ‘पहाड़ों का ढेर लग गया’ कहकर सरल नहीं किया गया है।
    reason: cultural_note
  - marker: c
    text: अर्थात पेड़ अपने निचले तने या आधार से काटकर अलग कर दिए गए; यहाँ ‘जड़ से उखाड़े गए’ कहना मूल क्रिया से अधिक अर्थ जोड़ता।
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወድቅ
  choice: गिरा
  rationale: दर्शन-वर्णन की कथात्मक शृंखला में अपूर्ण क्रिया को सहज हिन्दी भूतकाल में रखा गया है; कर्ता की पूर्वपद-संदर्भगत अस्पष्टता बनाए रखने के लिए ‘वह’ रखा गया है।
- source_word: ትትወሐጥ
  choice: निगली जा रही थी
  rationale: निष्क्रिय/आत्मवाचक भाव को सुरक्षित रखते हुए पृथ्वी के निगले जाने का सजीव प्रलयकारी बिंब व्यक्त करता है।
- source_word: ቀላይ ዐቢይ
  choice: एक विशाल अथाह गर्त
  rationale: ‘गर्त’ विशाल गहराई को और ‘अथाह’ उसके प्रलय-दर्शी प्रभाव को व्यक्त करता है; यही पद अंत में भी दोहराकर बिंबगत एकता रखी गई है।
- source_word: አድባር ዲበ አድባር ይስቀሉ
  choice: पहाड़ पहाड़ों के ऊपर लटके हुए थे
  rationale: असामान्य दर्शनीय चित्र को सामान्य ‘ढेर हो गए’ में समतल किए बिना लटकने के मूल भाव को बनाए रखता है।
- source_word: አውግር ዲበ አውግር ይሰጠሙ
  choice: पहाड़ियाँ पहाड़ियों के ऊपर धँस गईं
  rationale: क्रिया के धँसने अथवा डूबने के अर्थ को प्राकृतिक हिन्दी में रखते हुए विनाशकारी दृश्य सुरक्षित रखा गया है।
- source_word: ዕፀወ ነዋኃት
  choice: ऊँचे पेड़
  rationale: विशेषण ऊँचाई सूचित करता है; यह आधुनिक हिन्दी में स्पष्ट और दृश्यात्मक है।
- source_word: ይትገዘሙ እምጕንዶቲሆሙ
  choice: अपने तनों से काट दिए गए
  rationale: ገዘመ का अर्थ काटना या अलग करना है, उखाड़ना नहीं; ‘तनों से’ मूल के आधार/तने-संबंधी संकेत को संयमपूर्वक रखता है।
- source_word: ይትገደፉ
  choice: नीचे फेंक दिए गए
  rationale: निष्क्रिय रूप और बलपूर्वक फेंके जाने की विनाशकारी गति दोनों व्यक्त होते हैं।
- source_word: ይሰጠሙ ውስተ ቀላይ
  choice: उस अथाह गर्त में डूब गए
  rationale: डूबने का अर्थ स्पष्ट है और पहले प्रयुक्त ‘अथाह गर्त’ की पुनरावृत्ति मूल की शब्दगत तथा बिंबगत संगति बनाए रखती है।
theological_decisions:
- issue: ब्रह्मांडीय विनाश के दर्शन का स्वरूप
  choice: सृष्टि के ढहने के ठोस, विचित्र दर्शनीय बिंबों को ज्यों का त्यों प्रस्तुत किया गया है।
  alternative: पहाड़ों और पेड़ों को सीधे राजनीतिक प्रतीकों के रूप में अनूदित करना, अथवा पूरे दृश्य को केवल भूकंप या बाढ़ कहना।
  rationale: मूल पाठ स्वयं व्याख्या नहीं देता। इसलिए अनुवाद प्रतीकात्मक अर्थ निर्धारित किए बिना प्रलय-दर्शी तनाव और अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमामय और सामान्य पाठक के लिए सुबोध रखी गई है। विनाशकारी दर्शन की असामान्यता को सहज बनाने के लिए मिटाया नहीं गया। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
