base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/011.yaml
  text: And when I went out below and saw the heaven[a], and the sun rising in the east, and the moon setting in the west, and a few stars, and the whole earth, and everything as He had known it in the beginning, then I blessed the Lord of judgment and extolled Him, because He had brought forth the sun from the windows of the east, and it ascended and rose on the face of the heaven[c][b], and set out and followed the path which He showed it.
translation:
  language: hi
  text: और जब मैं नीचे निकला[a] और आकाश को देखा[b]—सूर्य को पूर्व में उदय होते, चाँद को पश्चिम में अस्त होते, कुछ तारों को, सारी पृथ्वी को, और हर वस्तु को उसी रूप में देखा, जिस रूप में उसने उसे आरम्भ में जाना था[c]—तब मैंने न्याय के प्रभु को धन्य ठहराया और उसकी महिमा की, क्योंकि उसने सूर्य को पूर्व की खिड़कियों से निकाला था। सूर्य ऊपर उठा और आकाश के मुख पर उदय हुआ, फिर चल पड़ा और उस मार्ग पर आगे बढ़ा जो उसने उसे दिखाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नीचे” का अनुवाद “नीचे की ओर” या “तले” भी हो सकता है; स्वप्न के व्यापक दृश्य के बिना ठीक स्थान निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: गीज़ में “देखा” के साथ लगा कर्म-सर्वनाम आगे आने वाले “आकाश” की पूर्वसूचना देता है; अधिक शाब्दिक रूप होगा, “और उसे—आकाश को—देखा।”
    reason: source_grammar
  - marker: c
    text: “उसने” और “उसे” के संदर्भ इस पद में फिर से नाम लेकर स्पष्ट नहीं किए गए हैं; अनुवाद ने सर्वनामगत अस्पष्टता बनाए रखी है।
    reason: ambiguity
lexical_decisions:
- source_word: ሶበ
  choice: जब
  rationale: यह कालवाचक संयोजक आगे आने वाली पूरी परिस्थिति को मुख्य वाक्य ‘तब मैंने…’ से जोड़ता है। हिन्दी में ‘जब…तब’ इसकी संरचना स्वाभाविक रूप से व्यक्त करती है।
- source_word: ወፃእኩ
  choice: मैं निकला
  rationale: प्रथम पुरुष एकवचन का पूर्ण क्रियारूप किसी स्थान से बाहर आने या निकलने को बताता है; ‘निकला’ दिशा को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ታሕተ
  choice: नीचे
  rationale: यह स्थान अथवा दिशा बताने वाला शब्द ‘नीचे’, ‘नीचे की ओर’ या ‘तले’ हो सकता है। ‘नीचे’ स्वप्न-दृश्य की स्थानिक अस्पष्टता बनाए रखता है।
- source_word: ወርኢክዎ
  choice: और आकाश को देखा
  rationale: क्रिया ‘देखना’ है और लगा हुआ पुल्लिंग एकवचन कर्म-सर्वनाम आगे आने वाले ‘आकाश’ की पूर्वसूचना देता है। हिन्दी में सर्वनाम की पुनरुक्ति के बजाय उसके स्पष्ट संज्ञात्मक कर्म ‘आकाश’ के साथ स्वाभाविक अनुवाद किया गया है।
- source_word: ለሰማይ
  choice: आकाश को
  rationale: प्रसंग में यह पूर्वसूचक कर्म-सर्वनाम का स्पष्ट संज्ञात्मक कर्म है। ‘आकाश’ आधुनिक हिन्दी में गरिमापूर्ण और सामान्यतः समझा जाने वाला शब्द है।
- source_word: face of the heaven (recovered continuation)
  choice: आकाश के मुख पर
  rationale: दृश्य की मूल स्थानिक और काव्यात्मक छवि को सुरक्षित रखने के लिए शाब्दिक रूप के निकट रखा गया है; इसे केवल ‘आकाश में’ करके समतल नहीं किया गया।
theological_decisions:
- issue: ‘उसने…उसे’ में कर्ता और कर्म की पहचान
  choice: मूल के सर्वनामों को बनाए रखा गया और उनकी पहचान मुख्य पाठ में स्पष्ट नहीं की गई।
  alternative: ‘परमेश्वर ने आरम्भ में हर वस्तु को जाना था’ अथवा किसी अन्य निश्चित कर्ता का नाम जोड़ना।
  rationale: इस पद की सर्वनाम-श्रृंखला स्वयं हर स्थान पर संज्ञा को दोहराती नहीं है। किसी निश्चित पहचान को जोड़ना मूल की सम्भावित अस्पष्टता और धार्मिक तनाव को समय से पहले सुलझा देता।
- issue: ‘न्याय के प्रभु’
  choice: न्याय के प्रभु
  alternative: न्यायाधीश प्रभु
  rationale: यह रूप प्रभु और न्याय के बीच मूल सम्बन्ध को बनाए रखता है, बिना इसे केवल पदनाम ‘न्यायाधीश’ में बदलने के।
- issue: सूर्य के लिए सर्वनाम
  choice: दूसरे वाक्य में ‘सूर्य’ दोहराया, फिर आगे सर्वनामगत अर्थ को क्रियाओं में स्वाभाविक रखा।
  alternative: हर स्थान पर ‘वह’ अथवा ‘उसे’ का यांत्रिक प्रयोग।
  rationale: हिन्दी में कर्ता का सीमित पुनर्निर्देशन अस्पष्टता घटाता है, पर सूर्य को व्यक्तित्वयुक्त या दैवी सत्ता ठहराने जैसा कोई अतिरिक्त अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘जब…तब’ से लम्बे गीज़ वाक्य की संरचना स्पष्ट की गई, जबकि स्वप्न-दृश्य की सूची और ‘आकाश के मुख’ जैसी अपोकैलिप्टिक छवि सुरक्षित रखी गई। उपलब्ध मूल-पाठ अंश अधूरा है; शेष पद के लिए प्रमाणित पुनर्प्राप्त पाठ-सूचना और समीक्षित अंग्रेज़ी परामर्श-पाठ का सावधानी से उपयोग किया गया है।
