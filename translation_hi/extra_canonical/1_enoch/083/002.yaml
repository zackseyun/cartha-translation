base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/002.yaml
  text: 'I saw two visions before I took a wife[a], and one of them was not like the other: the first when I was learning the book, and the second before I took your mother—I saw a mighty vision[d][c][b]; and concerning them I made supplication to the Lord.'
translation:
  language: hi
  text: मैंने विवाह करने से पहले दो दर्शन देखे थे, और उनमें से एक दूसरे के समान नहीं था। पहला तब था, जब मैं पुस्तक सीख रहा था[a]; और दूसरा तब, जब तुम्हारी माता से विवाह करने से पहले मैंने एक प्रबल दर्शन देखा था[b]। उन दर्शनों के विषय में मैंने प्रभु से विनती की[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब मुझे पुस्तक सिखाई जा रही थी।” गीइज़ क्रिया का अर्थ स्वयं सीखना अथवा किसी से शिक्षा पाना—दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “प्रबल दर्शन” का अनुवाद “तीव्र दर्शन” या “शक्तिशाली दर्शन” भी किया जा सकता है; शब्द दर्शन के प्रभाव या बल पर ज़ोर देता है।
    reason: lexical_alternative
  - marker: c
    text: “उन दर्शनों के विषय में” का अर्थ “उन दर्शनों के कारण” भी हो सकता है—अर्थात् उन्हीं दर्शनों ने हनोक को प्रार्थना करने के लिए प्रेरित किया।
    reason: lexical_alternative
lexical_decisions:
- source_word: ክልኤተ፡ ራእየ
  choice: दो दर्शन
  rationale: यह पद सीधे दो दर्शनों का उल्लेख करता है। ‘दर्शन’ अपोकैलिप्टिक संदर्भ के अनुकूल, स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: ርኢኩ
  choice: मैंने ... देखे थे / मैंने ... देखा
  rationale: सरल प्रथम-पुरुष दर्शन-वर्णन को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है; स्रोत में क्रिया की पुनरावृत्ति भी बनाए रखी गई है।
- source_word: እንበለ፡ እንሣእ፡ ብእሲተ
  choice: विवाह करने से पहले
  rationale: शाब्दिक वैवाहिक मुहावरा ‘पत्नी लेने से पहले’ हिन्दी में अनावश्यक रूप से कठोर और अप्राकृतिक लगता; ‘विवाह करने से पहले’ उसका आशय ठीक और सहज ढंग से देता है।
- source_word: ወአሐዱሂ፡ እምኔሆሙ፡ ኢይትማሰል፡ ምስለ፡ ካልኡ
  choice: उनमें से एक दूसरे के समान नहीं था
  rationale: दोनों दर्शनों के बीच असमानता को स्रोत की एकवचन संरचना के निकट रहते हुए स्पष्ट करता है।
- source_word: አመ፡ እትሜሀር፡ መጽሐፈ
  choice: उस समय ... जब मैं पुस्तक सीख रहा था
  rationale: क्रिया सीखने या सिखाए जाने—दोनों का संकेत दे सकती है। मुख्य पाठ में सहज सक्रिय अर्थ रखा गया और कर्मवाच्य संभावना पादटिप्पणी में सुरक्षित की गई है। निश्चित ‘पुस्तक’ को सामान्यीकृत नहीं किया गया।
- source_word: እንበለ፡ እንሥእ፡ ለእምከ
  choice: तुम्हारी माता से विवाह करने से पहले
  rationale: ‘तुम्हारी माता’ का सीधा पारिवारिक संबोधन बनाए रखते हुए वैवाहिक मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ራእየ፡ ጽኑዐ
  choice: एक प्रबल दर्शन
  rationale: ጽኑዐ शक्ति, दृढ़ता या तीव्रता का बोध करा सकता है। ‘प्रबल’ दर्शन की प्रभावशाली तीव्रता बताता है, पर उसे अनिवार्य रूप से भयावह नहीं ठहराता।
- source_word: ወበእንቲአሆሙ፡ አስተብቋዕክዎ፡ ለእግዚእ
  choice: उन दर्शनों के विषय में मैंने प्रभु से विनती की
  rationale: पूर्वसर्ग ‘के विषय में’ अथवा ‘उनके कारण’ हो सकता है, जबकि क्रिया गंभीर प्रार्थना या याचना व्यक्त करती है। मुख्य पाठ तटस्थ संबंध रखता है और कारणवाचक संभावना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: ለእግዚእ का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: प्रार्थना के प्रसंग में यह पद परमेश्वर के लिए प्रयुक्त है। ‘प्रभु’ धार्मिक गरिमा बनाए रखता है, पर किसी बाद की विशिष्ट सांप्रदायिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘पत्नी लेना’ जैसे स्रोत-मुहावरे को शाब्दिक रखने के बजाय ‘विवाह करना’ कहा गया है। स्रोत की कुछ असहज पुनरावृत्ति—पहले सामान्यतः विवाह से पहले और फिर विशेषतः ‘तुम्हारी माता’ से विवाह से पहले—हटाई नहीं गई, क्योंकि वह मूल पाठ में उपस्थित है। वाक्य-विभाजन से दो दर्शनों का क्रम और अंतिम विनती स्पष्ट की गई है।
