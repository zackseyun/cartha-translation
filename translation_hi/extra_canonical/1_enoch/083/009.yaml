base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/009.yaml
  text: My son[a], from heaven all this will come upon the earth[c][b], and upon the earth there will be a great destruction.
translation:
  language: hi
  text: हे मेरे पुत्र, स्वर्ग से यह सब पृथ्वी पर आएगा,[a] और पृथ्वी पर बड़ा विनाश होगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से इसका अर्थ ‘स्वर्ग से यह सब पृथ्वी पर होगा/विद्यमान होगा’ भी समझा जा सकता है; प्रसंग और दिशा-सूचक वाक्यरचना के कारण मुख्य पाठ में ‘आएगा’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: ‘पृथ्वी’ का अनुवाद कुछ प्रसंगों में ‘भूमि’ भी हो सकता है, पर यहाँ प्रलय-दर्शन का व्यापक संदर्भ ‘पृथ्वी’ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወልድየ
  choice: हे मेरे पुत्र
  rationale: प्रथम पुरुष संबंधसूचक प्रत्यय के साथ यह सीधा संबोधन है। ‘पुत्र’ मूल की विशिष्ट पारिवारिक अभिव्यक्ति को बनाए रखता है; ‘हे’ हिन्दी में संबोधन को स्पष्ट करता है।
- source_word: እምሰማይ
  choice: स्वर्ग से
  rationale: यह अपादान अर्थ को सीधे व्यक्त करता है और दर्शन के ऊपर से नीचे आने वाले बिंब को सुरक्षित रखता है।
- source_word: ይሄሉ
  choice: आएगा
  rationale: यह ሀለወ (‘होना/विद्यमान होना’) का रूप है, बोलने की क्रिया नहीं। ‘स्वर्ग से ... पृथ्वी पर’ के साथ स्वाभाविक हिन्दी में ‘आएगा’ उस होने/आ पड़ने की गति को व्यक्त करता है, बिना कथन या उद्धरण गढ़े।
- source_word: ኵሉዝ
  choice: यह सब
  rationale: समग्रता के साथ संभावित संकेतवाचक भाव को बनाए रखता है और निकटवर्ती दर्शन की ओर स्वाभाविक रूप से संकेत करता है।
- source_word: ዲበ ምድር
  choice: पृथ्वी पर
  rationale: दोनों आवृत्तियों में वही संबंध रखा गया है। प्रलय-दर्शन के व्यापक संदर्भ में ‘पृथ्वी’ स्थानीय ‘भूमि/देश’ से अधिक उपयुक्त है।
- source_word: ይከውን
  choice: होगा
  rationale: आगामी अस्तित्व या घटना को सरल, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ሐጕል
  choice: विनाश
  rationale: व्यापक नाश और तबाही के अर्थ को बिना उसे केवल युद्धजनित विध्वंस तक सीमित किए व्यक्त करता है।
- source_word: ዐቢይ
  choice: बड़ा
  rationale: विनाश की व्यापकता या तीव्रता का पारदर्शी आधुनिक हिन्दी विशेषण है।
theological_decisions:
- issue: ‘मेरे पुत्र’ की पहचान
  choice: इसे सीधे संबोधन ‘हे मेरे पुत्र’ के रूप में रखा गया है और इसकी पहचान की व्याख्या नहीं की गई।
  alternative: ‘मेरे बच्चे’ अथवा किसी प्रतीकात्मक/मसीही व्यक्तित्व के रूप में व्याख्यायित करना
  rationale: यह पद स्वयं संबोधित व्यक्ति की पहचान निश्चित नहीं करता; इसलिए अनुवाद बाद की धर्मवैचारिक पहचान नहीं जोड़ता।
- issue: ይሄሉ को वाणी की क्रिया मानना
  choice: इसे ‘आएगा’ द्वारा अस्तित्व/आगमन के अर्थ में प्रस्तुत किया गया है।
  alternative: ‘कहेगा’ मानकर सीधे कथन का उद्धरण बनाना
  rationale: यह रूप ‘होना/विद्यमान होना’ से संबंधित है, ‘कहना’ से नहीं; अतः उद्धरण जोड़ना मूल में अनुपस्थित अर्थ पैदा करेगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। संबोधन को स्पष्ट करने के लिए ‘हे’ जोड़ा गया है। मूल की दो बार आने वाली ‘पृथ्वी पर’ संरचना सुरक्षित रखी गई है; किसी उद्धरण या मसीही पहचान को नहीं जोड़ा गया।
