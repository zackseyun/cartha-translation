base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/006.yaml
  text: And Malyal my grandfather lifted me up while I was lying beside him[a], and he said to me, “Why do you cry out like this, my son[c][b], and why do you lament like this?”
translation:
  language: hi
  text: और मेरे दादा मलयाल[a] ने मुझे, जब मैं उनके पास लेटा हुआ था, उठाया और मुझसे कहा, “मेरे बेटे, तुम इस तरह चिल्ला क्यों रहे हो, और इस तरह विलाप क्यों कर रहे हो?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मलयाल’ संभवतः कुलपति महललेल के नाम का गीज़ रूप है; कुछ अनुवाद नाम को ‘महललेल’ कर देते हैं।
    reason: lexical_alternative
  - marker: b
    text: 'मूल पाठ दो संबंधित, किंतु अलग क्रियाएँ प्रयोग करता है: पहली ऊँची आवाज़ में चिल्लाने के लिए और दूसरी शोकपूर्वक विलाप करने के लिए।'
    reason: lexical_alternative
lexical_decisions:
- source_word: መላእያል
  choice: मलयाल
  rationale: गीज़ पाठ में आए नाम-रूप को हिन्दी लिपि में रखा गया है; इसे मुख्य पाठ में चुपचाप अधिक परिचित ‘महललेल’ से सामान्यीकृत नहीं किया गया।
- source_word: እምሔውየ
  choice: मेरे दादा
  rationale: नवीन पाठ-समीक्षा के अनुसार यह ‘जहाँ मैं था वहाँ से’ नहीं, बल्कि प्रथम पुरुष संबंधवाचक प्रत्यय सहित ‘मेरा दादा/पूर्वज’ है। संदर्भ में स्वाभाविक हिन्दी ‘मेरे दादा’ है।
- source_word: አንሥአኒ
  choice: मुझे ... उठाया
  rationale: क्रिया किसी को उठाने या ऊपर करने का बोध देती है; दृश्य की शारीरिक क्रिया को स्पष्ट रखा गया है।
- source_word: እንዘ እነ እስክብ
  choice: जब मैं ... लेटा हुआ था
  rationale: यह समकालिक अवस्था बताता है। पाठ में नींद का विचार अनिवार्य नहीं है, इसलिए ‘सो रहा था’ नहीं जोड़ा गया।
- source_word: ኀቤሁ
  choice: उनके पास
  rationale: यह निकटता दर्शाता है। आधुनिक हिन्दी में ‘उनके पास’ स्वाभाविक और पर्याप्त रूप से स्थान-सूचक है।
- source_word: ትጸርኅ
  choice: चिल्ला क्यों रहे हो
  rationale: पहली क्रिया ऊँची आवाज़ में पुकारने या चीखने का भाव रखती है। ‘चिल्लाना’ उसकी तीव्रता बनाए रखता है।
- source_word: ወልድየ
  choice: मेरे बेटे
  rationale: पारिवारिक स्नेह और वरिष्ठता से भरा सीधा संबोधन हिन्दी में स्वाभाविक रूप से प्रस्तुत किया गया है।
- source_word: ትአወዩ
  choice: विलाप क्यों कर रहे हो
  rationale: दूसरी क्रिया शोकपूर्ण रोने-विलाप करने को व्यक्त करती है और पहली क्रिया से उसका भेद बनाए रखती है।
theological_decisions:
- issue: መላእያል की पहचान
  choice: मुख्य पाठ में गीज़ नाम-रूप ‘मलयाल’ रखा गया
  alternative: इसे कुलपति के परिचित नाम ‘महललेल’ के रूप में सामान्यीकृत करना
  rationale: प्रस्तुत गीज़ साक्ष्य को प्राथमिकता देते हुए नाम का तत्काल पाठ-रूप सुरक्षित रखा गया है; संभावित बाइबलीय पहचान पादटिप्पणी में बताई गई है, ताकि अनिश्चितता को चुपचाप समाप्त न किया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्तर रखा गया है। दादा के लिए आदरसूचक बहुवचन ‘उनके’ और ‘उठाया’ के साथ निकटता का स्वाभाविक विन्यास अपनाया गया है। अनावश्यक रूप से ‘सोना’ नहीं जोड़ा गया और दोनों भावात्मक क्रियाओं का अंतर सुरक्षित रखा गया है।
