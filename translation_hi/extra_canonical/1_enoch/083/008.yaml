base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/008.yaml
  text: And now[a], my son, rise and make your petition to the Lord of glory, since you are faithful[b], that a remnant may remain upon the earth and that he may not wipe out the whole earth.
translation:
  language: hi
  text: और अब, मेरे पुत्र, उठ और महिमा के प्रभु से विनती कर, क्योंकि तू विश्वासयोग्य है,[a] ताकि पृथ्वी पर कोई अवशेष शेष रहे[b] और वह सारी पृथ्वी को मिटा न डाले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ के शब्द का अर्थ ‘विश्वासी’, ‘निष्ठावान’ या ‘भरोसेमंद’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'मूल गीइज़ में एक ही शब्द-मूल की बलपूर्ण पुनरुक्ति है, जिसका शाब्दिक भाव है: ‘एक अवशेष बचा रहे।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተንሥእ
  choice: उठ
  rationale: यह उठ खड़े होने की आज्ञा है। ‘उठ’ आधुनिक हिन्दी में स्वाभाविक है और दर्शनीय वाणी की तत्परता बनाए रखता है।
- source_word: አስተብቍዖ
  choice: विनती कर
  rationale: क्रिया गंभीर और आग्रहपूर्ण निवेदन का भाव रखती है। ‘विनती कर’ सामान्य ‘प्रार्थना कर’ की अपेक्षा याचना और मध्यस्थता के स्वर को अधिक स्पष्ट रखता है।
- source_word: ለእግዚአ ስብሐት
  choice: महिमा के प्रभु से
  rationale: मूल का शाब्दिक दैवी विशेषण ‘महिमा के प्रभु’ है। इसे ‘महिमामय प्रभु’ बनाकर विशेषण में बदलने के बजाय मूल संबंधवाचक संरचना सुरक्षित रखी गई है।
- source_word: መሃይምን
  choice: विश्वासयोग्य
  rationale: यह शब्द विश्वास रखने और भरोसेमंद अथवा निष्ठावान होने—दोनों अर्थछायाएँ रख सकता है। प्रसंग में हनोक की मध्यस्थता की योग्यता बताई गई है; ‘विश्वासयोग्य’ इस नैतिक-धार्मिक गुण को व्यक्त करता है, यद्यपि ‘विश्वासी’ भी संभव है।
- source_word: ይትረፍ ትራፍ
  choice: कुछ तो शेष बचा रहे
  rationale: मूल में एक ही धातु से बने शब्दों की पुनरुक्ति है, जिसका भाव ‘बचा हुआ अंश बचा रहे’ है। हिन्दी में ‘कुछ तो शेष बचा रहे’ उस बलाघात और न्याय के बीच बच जाने के भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ወኢይደምስሳ ለኵላ ምድር
  choice: और वह सारी पृथ्वी को मिटा न डाले
  rationale: क्रिया पूर्ण विनाश अथवा लोप का बोध कराती है। ‘मिटा न डाले’ विनाश की व्यापकता को स्पष्ट करता है और ‘सारी पृथ्वी’ मूल के सार्वभौमिक विस्तार को बनाए रखता है।
theological_decisions:
- issue: መሃይምን को आंतरिक विश्वास के रूप में प्रस्तुत किया जाए या निष्ठा और भरोसेमंदी के रूप में
  choice: विश्वासयोग्य
  alternative: विश्वासी; भरोसेमंद
  rationale: यह पद उस गुण को हनोक की विनती का आधार बनाता है। ‘विश्वासयोग्य’ निष्ठा और भरोसेमंदी को सामने रखता है, पर पादटिप्पणी द्वारा ‘विश्वासी’ अर्थ की वास्तविक संभावना भी सुरक्षित रखी गई है।
- issue: पृथ्वी पर बचने वाली वस्तु को स्पष्ट रूप से मनुष्य अथवा बचे हुए लोगों के रूप में पहचानना
  choice: कुछ तो शेष बचा रहे
  alternative: कुछ बचे हुए लोग जीवित रहें
  rationale: मूल केवल ‘शेष/अवशेष’ कहता है और उसे स्पष्ट रूप से मनुष्यों तक सीमित नहीं करता। इसलिए अनुवाद ने इस वास्तविक अस्पष्टता को बनाए रखा है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पुत्र को संबोधन में एकवचन आत्मीय ‘तू’ और उसी के अनुरूप आज्ञार्थक ‘उठ’ तथा ‘कर’ प्रयुक्त हुए हैं। दैवी उपाधि ‘महिमा के प्रभु’ औपचारिक रूप में सुरक्षित है। ‘कुछ तो शेष बचा रहे’ मूल की पुनरुक्ति का बल स्वाभाविक हिन्दी में रखता है और यह अनावश्यक रूप से निश्चित नहीं करता कि शेष बचने वाला केवल मानव समुदाय है।
