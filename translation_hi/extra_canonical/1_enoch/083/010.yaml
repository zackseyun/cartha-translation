base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/010.yaml
  text: And after this I arose and prayed and entreated and asked[a], and I wrote down my prayer for the generations of the world; and I showed you everything[b], my son Methuselah.
translation:
  language: hi
  text: इसके बाद मैं उठा, प्रार्थना की, विनती की और याचना की; और मैंने अपनी प्रार्थना संसार की पीढ़ियों के लिए लिखी[a]। फिर, हे मेरे पुत्र मतूशेलह, मैं तुम्हें सब कुछ दिखाऊँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सभी भावी पीढ़ियों के लिए” अथवा “सदा की पीढ़ियों के लिए।” गीइज़ वाक्यांश वर्तमान युग से आगे तक बनी रहने वाली पीढ़ियों का भाव भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'प्रदत्त OCR-पाठ का रूप “उसने तुम्हें सब कुछ दिखाया” जैसा पढ़ा जा सकता है। किंतु संदर्भ और आलोचनात्मक पाठ में प्रथम-पुरुष भावी/अपूर्ण रूप समर्थित है: “मैं तुम्हें सब कुछ दिखाऊँगा।”'
    reason: textual_variant
lexical_decisions:
- source_word: እምኔሁ
  choice: इसके बाद
  rationale: कथा में पिछले दर्शन के बाद की घटना का स्वाभाविक कालगत संक्रमण व्यक्त करता है।
- source_word: ተንሣእኩ
  choice: मैं उठा
  rationale: शारीरिक रूप से उठने की क्रिया को सरल, गरिमापूर्ण आधुनिक हिन्दी में रखता है।
- source_word: ጸለይኩ፡ ወአስተብቋዕኩ፡ ወሰአልኩ
  choice: मैंने प्रार्थना की, विनती की और याचना की
  rationale: मूल में प्रार्थना से जुड़े तीन क्रमिक और निकटार्थक क्रियापद हैं; हिन्दी में उनकी संचयी तीव्रता बनाए रखी गई है।
- source_word: ጸሎትየ፡ ጸሐፍኩ
  choice: मैंने अपनी प्रार्थना ... लिख दी
  rationale: प्रार्थना को लिखित रूप में दर्ज करने का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: ለትውልደ፡ ዓለም
  choice: संसार की पीढ़ियों के लिए
  rationale: ዓለም के ‘संसार/युग/अनंत काल’ संबंधी अर्थ-विस्तार को मुख्य पाठ में निर्णायक रूप से सीमित किए बिना अपेक्षाकृत शाब्दिक रूप रखा गया है।
- source_word: ኵሎ
  choice: सब कुछ
  rationale: समग्रता का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: አርአየከ
  choice: मैंने तुम्हें ... दिखाया
  rationale: दिए गए पाठ और भूतकालीन क्रियाओं की शृंखला के अनुरूप इसे पूर्ण भूतकाल में रखा गया है; ‘प्रकट किया’ कहने से अनावश्यक व्याख्यात्मक भार जुड़ता।
- source_word: ወልድየ፡ ማቱሳላ
  choice: हे मेरे पुत्र मतूशेलह
  rationale: सम्बोधन को स्पष्ट करते हुए नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
theological_decisions:
- issue: ለትውልደ ዓለም का कालगत दायरा
  choice: संसार की पीढ़ियों के लिए
  alternative: सभी भावी पीढ़ियों के लिए / सदा की पीढ़ियों के लिए
  rationale: वाक्यांश आगे आने वाली या निरंतर बनी रहने वाली पीढ़ियों का संकेत दे सकता है, पर ዓለም का ठीक आशय संसार, युग अथवा दीर्घ/अनंत काल हो सकता है। मुख्य पाठ इस अस्पष्टता को व्याख्या द्वारा समाप्त नहीं करता।
- issue: አርአየከ का काल और पाठरूप
  choice: मैंने तुम्हें सब कुछ दिखाया
  alternative: मैं तुम्हें सब कुछ दिखाऊँगा
  rationale: प्रदत्त गीइज़ पाठ और आसपास की पूर्ण भूतकालीन क्रियाओं के आधार पर भूतकाल अपनाया गया है। संभावित संशोधित पाठ से भविष्य/अपूर्ण रूप निकाला जा सकता है, पर वह प्रदत्त शब्दरूप में निश्चित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण लेकिन सहज शैली रखी गई है। निकटार्थक प्रार्थना-क्रियाओं की पुनरुक्ति मूल की आग्रहपूर्ण लय को बचाने के लिए जानबूझकर बनाए रखी गई है।
