base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/007.yaml
  text: 'And I told him all the vision that I had seen[a], and he said to me, “Severe is the sight you have seen, my son, and mighty is the vision of your dream: it reveals all the hidden sin of the earth[f][e][d][c][b], and it is about to sink into the abyss and be destroyed with a great destruction.”'
translation:
  language: hi
  text: और मैंने उसे वह पूरा दर्शन बताया जो मैंने देखा था। तब उसने मुझसे कहा, “मेरे पुत्र, जो दृश्य तूने देखा है वह भयावह है, और तेरे स्वप्न का दर्शन प्रबल है। वह पृथ्वी के सारे छिपे हुए पाप को प्रकट करता है[a]। और अथाह गहराई में डूबना और बड़े विनाश से नष्ट होना निकट है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पदबंध कठिन है। अधिक शाब्दिक रूप से इसे “पृथ्वी के सारे पाप का छिपा हुआ [पक्ष/रहस्य]” समझा जा सकता है; कुछ व्याख्याएँ इसे “उसने पृथ्वी का सारा पाप छिपा रखा है” भी समझती हैं।
    reason: lexical_alternative
  - marker: b
    text: “अथाह गहराई” के मूल शब्द का अर्थ गहरा जल, समुद्र या अगाध स्थान भी हो सकता है। अंतिम क्रियाओं का कर्ता संक्षिप्त वाक्य-रचना में स्पष्ट नहीं है; इसे पृथ्वी, दर्शन, पाप, या दर्शन में प्रकट न्याय से जोड़ा जा सकता है।
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: ነገርክዎ
  choice: मैंने उसे…बताया
  rationale: क्रिया का सीधा अर्थ किसी को वृत्तांत बताना है; आधुनिक हिन्दी में यह स्वाभाविक और मूल के निकट है।
- source_word: ራእየ
  choice: दर्शन
  rationale: प्रलय-साहित्य के प्रसंग में यह सामान्य दृश्य नहीं, दिव्य अथवा स्वप्नगत दर्शन को सूचित करता है।
- source_word: ጽኑዐ
  choice: भयावह
  rationale: शब्द में कठोर, गंभीर अथवा विकट होने का भाव है; विनाशकारी स्वप्न के संदर्भ में ‘भयावह’ उसके अशुभ प्रभाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ኃያለ
  choice: प्रबल
  rationale: यह दर्शन की अत्यधिक शक्ति और प्रभाव को व्यक्त करता है, न कि किसी नैतिक गुण को।
- source_word: ኅቡኣተ ኵሉ ኃጢአተ ምድር
  choice: पृथ्वी के सारे पाप की छिपी बातें
  rationale: पदबंध संक्षिप्त और कठिन है। ‘छिपी बातें’ छिपाने/गुप्त होने के मूल भाव को बनाए रखता है; वाक्य को समझने योग्य बनाने के लिए दर्शन को उन्हें प्रकट करने वाला कहा गया है।
- source_word: ትሰጠም
  choice: डूबने वाली है
  rationale: क्रिया डूबने अथवा जलमग्न होने का बिंब देती है और आसन्न न्याय का भाव रखती है।
- source_word: ቀላይት
  choice: अथाह गहराई
  rationale: शब्द गहरे जल, समुद्र अथवा अगाध स्थान को सूचित कर सकता है; ‘अथाह गहराई’ साधारण समुद्र से अधिक व्यापक प्रलयकारी बिंब को सुरक्षित रखती है।
- source_word: ተሐጕል ኅጕለ ዐቢየ
  choice: बड़े विनाश से नष्ट हो जाएगी
  rationale: यह नाश की धातु से बना बलवर्धक सजातीय पदबंध है; इसलिए इसे अंधकार या आवरण नहीं, प्रचंड विनाश के रूप में अनूदित किया गया है।
theological_decisions:
- issue: अंतिम क्रियाओं का कर्ता
  choice: ‘पृथ्वी’ को डूबने और नष्ट होने वाली बताया गया है।
  alternative: इन क्रियाओं को दर्शन, पाप अथवा दर्शन में प्रकट न्याय से संबंधित मानना।
  rationale: स्त्रीलिंग क्रियारूप और निकटवर्ती ‘पृथ्वी’ इस संबंध का समर्थन करते हैं, फिर भी संक्षिप्त इथियोपिक वाक्य-रचना के कारण दूसरी व्याख्याएँ पूर्णतः असंभव नहीं हैं।
- issue: दर्शन और छिपे पाप का संबंध
  choice: दर्शन पृथ्वी के पाप की छिपी बातें प्रकट करता है।
  alternative: ‘उसने पृथ्वी का सारा पाप छिपा रखा है’ अथवा ‘पृथ्वी के सारे पाप के रहस्य’ पढ़ना।
  rationale: पदबंध कठिन है। चुना हुआ पाठ प्रसंग में दर्शन के प्रकटीकरणकारी कार्य को स्पष्ट करता है, जबकि पादटिप्पणी मूल की शाब्दिक अनिश्चितता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘मेरे पुत्र’ और ‘दर्शन’ जैसे पद प्राचीन प्रलय-साहित्य की गंभीरता बनाए रखते हैं। मूल के संक्षिप्त तथा कठिन मध्य पदबंध को मुख्य पाठ में पठनीय बनाया गया है और उसकी वास्तविक अनिश्चितता पादटिप्पणी में रखी गई है।
