base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/003.yaml
  text: I was lying down in the house of my grandfather Mahalalel[a], and I saw in a vision that the heaven was being cleansed and swept away[c][b], and it fell upon the earth.
translation:
  language: hi
  text: मैं अपने दादा महललेल के घर में लेटा हुआ था और मैंने दर्शन में देखा कि आकाश[a] ढह रहा था और उठा ले जाया जा रहा था[b], और वह पृथ्वी पर गिर रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वर्ग।” गीज़ शब्द दृश्य आकाश और स्वर्गीय आकाश, दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: प्रतिलिपि में यहाँ पाठ कुछ अनिश्चित है। संभवतः अर्थ “ढह रहा था और उठा ले जाया जा रहा था” है; उपलब्ध रूप को दूसरे ढंग से पढ़ने पर “शुद्ध किया जा रहा था और बुहारकर हटाया जा रहा था” भी समझा गया है।
    reason: textual_and_lexical_uncertainty
lexical_decisions:
- source_word: ስኩበ፡ ኮንኩ
  choice: मैं ... लेटा हुआ था
  rationale: कृदन्त और सहायक क्रिया का यह परिधीय प्रयोग भूतकाल की जारी पृष्ठभूमि-दशा बताता है; इसलिए इसे बिंदुवत क्रिया ‘मैं लेट गया’ के बजाय ‘लेटा हुआ था’ कहा गया है।
- source_word: በቤት፡ መላሕእል፡ እምሑውየ
  choice: अपने दादा महललेल के घर में
  rationale: स्थान और संबंध दोनों स्पष्ट रखे गए हैं। वंशावली के संदर्भ में महललेल हनोक के दादा हैं; नाम का अनुवाद नहीं, लिप्यंतरण किया गया है।
- source_word: ርኢኩ፡ በራእይ
  choice: मैंने दर्शन में देखा
  rationale: यह अभिव्यक्ति देखने के प्रकाशनात्मक माध्यम को सहज और गरिमापूर्ण हिन्दी में सुरक्षित रखती है।
- source_word: ሰማይ
  choice: आकाश
  rationale: गीज़ शब्द स्वर्गीय आकाश अथवा दिखाई देने वाले आकाश, दोनों को सूचित कर सकता है। यहाँ ब्रह्मांडीय उथल-पुथल मुख्य है; ‘आकाश’ सामान्य पाठक के लिए स्वाभाविक है और ‘स्वर्ग’ से उत्पन्न संभावित धार्मिक अतिनिर्धारण से बचता है।
- source_word: ይትነጻጻ
  choice: ढह रहा था
  rationale: प्राप्त प्रतिलेखन संभवतः उस रूप का त्रुटिपूर्ण पाठ है जिसका अर्थ गिराया जाना या ढहना है। अगले खंड में पृथ्वी पर गिरने का वर्णन भी इसी विनाशकारी अर्थ का समर्थन करता है; इसे ‘शुद्ध किया जा रहा था’ कहना संभव OCR-व्युत्पत्ति पर निर्भर होगा और प्रसंग से कम संगत है।
- source_word: ወይትሀየድ
  choice: और बहाकर ले जाया जा रहा था
  rationale: क्रिया हिंसक रूप से हटा दिए जाने या उठा ले जाए जाने का भाव देती है। ‘बहाकर’ दृश्य की प्रचंडता व्यक्त करता है, जबकि ‘ले जाया जा रहा था’ निष्क्रिय गति को स्पष्ट रखता है।
- source_word: ወይወድቅ፡ ዲበ፡ ምድር
  choice: फिर वह पृथ्वी पर गिर पड़ा
  rationale: गिरने की क्रिया और उसकी दिशा स्पष्ट रखी गई है। ‘पृथ्वी’ ब्रह्मांडीय पैमाने को ‘ज़मीन’ से बेहतर सुरक्षित रखती है।
theological_decisions:
- issue: ሰማይ का ब्रह्मांडीय संदर्भ
  choice: आकाश
  alternative: स्वर्ग
  rationale: दर्शन में समूचे आकाश के ढहने और पृथ्वी पर गिरने की विनाशकारी छवि है। ‘आकाश’ इस ब्रह्मांडीय दृश्य को बनाए रखता है, पर यह दावा नहीं करता कि परमेश्वर का निवासस्थान ही नष्ट हो गया।
- issue: 'मध्य क्रियाओं का अर्थ: विनाश या शुद्धीकरण'
  choice: ढह रहा था और बहाकर ले जाया जा रहा था
  alternative: शुद्ध किया जा रहा था और बुहारकर हटाया जा रहा था
  rationale: प्रतिलिपि में संभावित OCR समस्या, संबंधित गीज़ धातु और तत्पश्चात पृथ्वी पर गिरने का प्रसंग विनाशकारी पतन का समर्थन करते हैं। पाठमूल की अनिश्चितता को टिप्पणी में खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दर्शनीय-विनाशकारी लहजा रखा गया है। निरंतर भूतकाल पृष्ठभूमि और दर्शन की चलती हुई घटना को व्यक्त करता है। अर्धविराम अंतिम पतन को पहले की दो समांतर प्रक्रियाओं से स्पष्ट रूप से जोड़ता है।
