base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/007.yaml
  text: And because of this I have not appointed wives for you[b][a], for the dwelling of the spiritual ones of heaven is in heaven.
translation:
  language: hi
  text: और इसी कारण मैंने तुम्हारे लिए पत्नियाँ नहीं ठहराईं, क्योंकि स्वर्ग के आत्मिक प्राणियों[a] का निवास स्वर्ग में है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्वर्ग की आत्माएँ’ अथवा ‘स्वर्गीय आत्मिक प्राणी’। गीइज़ पदबंध के ये निकट-संबंधी अर्थ संभव हैं।
    reason: lexical_alternative
  - marker: b
    text: '‘स्वर्ग’ की पुनरावृत्ति जानबूझकर की गई है: ये प्राणी स्वर्ग से संबंधित हैं और उनका निवास भी स्वर्ग में है।'
    reason: cultural_note
lexical_decisions:
- source_word: ወበእንተዝ
  choice: और इसी कारण
  rationale: यह पदबंध पिछले कथन से कारणात्मक संबंध जोड़ता है। ‘इसी कारण’ उस बल को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ኢረሰይኩ
  choice: मैंने ... नियुक्त नहीं कीं
  rationale: क्रिया का आशय केवल ‘बनाना’ नहीं, बल्कि किसी के लिए ठहराना, नियत करना या प्रदान करना है; ‘नियुक्त’ इस प्रसंग में उस व्यवस्था को व्यक्त करता है।
- source_word: ለክሙ
  choice: तुम्हारे लिए
  rationale: दत्तिव संबंध को हिन्दी में सहज रूप से व्यक्त करता है।
- source_word: አንስቲያ
  choice: पत्नियाँ
  rationale: प्रसंग वैवाहिक जोड़ी या नियत जीवन-साथियों का है; इसलिए ‘स्त्रियाँ’ की अपेक्षा ‘पत्नियाँ’ अधिक सटीक है।
- source_word: እስመ
  choice: क्योंकि
  rationale: यह अगले खंड को पहले कथन के कारण के रूप में प्रस्तुत करता है।
- source_word: መንፈሳውያነ ሰማይ
  choice: स्वर्ग के आत्मिक प्राणी
  rationale: यह रूप उन प्राणियों को उनके आत्मिक स्वरूप और स्वर्गीय क्षेत्र से संबद्ध करता है, पर उन्हें सीधे केवल ‘आत्माएँ’ कहकर अर्थ को सीमित नहीं करता।
- source_word: ውስተ ሰማይ
  choice: स्वर्ग ही में
  rationale: स्थानवाचक अर्थ स्पष्ट है। ‘ही’ उनके उचित निवास-क्षेत्र पर बल देता है और पद में ‘स्वर्ग’ की जानबूझकर की गई पुनरावृत्ति को सुनाई देता रखता है।
- source_word: መሓድሪሆሙ
  choice: उनका निवास
  rationale: संज्ञा स्थायी वास या निवास-स्थान को दर्शाती है; ‘निवास’ गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट है।
theological_decisions:
- issue: መንፈሳውያነ ሰማይ को ‘स्वर्ग की आत्माएँ’, ‘स्वर्गीय आत्मिक प्राणी’ या ‘स्वर्ग के आत्मिक प्राणी’ कहना
  choice: स्वर्ग के आत्मिक प्राणी
  alternative: स्वर्ग की आत्माएँ; स्वर्गीय आत्मिक प्राणी
  rationale: चुना हुआ रूप गीइज़ के विशेषण-संज्ञात्मक भाव और ‘स्वर्ग’ के संबंध—दोनों को बनाए रखता है। इससे प्राणियों की प्रकृति को बाद की किसी निश्चित स्वर्गदूत-वर्गीकरण प्रणाली में नहीं बाँधा जाता।
- issue: አንስቲያ का अर्थ सामान्य ‘स्त्रियाँ’ लिया जाए या वैवाहिक ‘पत्नियाँ’
  choice: पत्नियाँ
  alternative: स्त्रियाँ
  rationale: पद का तर्क यह है कि इन प्राणियों के लिए वैवाहिक साथी नियत नहीं किए गए थे; इसलिए ‘पत्नियाँ’ स्थानीय प्रसंग को अधिक ठीक ढंग से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। वाक्य की कारणात्मक संरचना और ‘स्वर्ग’ की पुनरावृत्ति सुरक्षित है। ‘आत्मिक प्राणी’ सामान्य पाठक के लिए स्पष्ट रहते हुए मूल की अर्थगत खुलावट बनाए रखता है।
