base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/003.yaml
  text: Why did you abandon the high[a], holy, eternal heaven, and lie with women, and defile yourselves with the daughters of men, and take wives for yourselves, and do as the children of the earth do[b], and beget giant sons?
translation:
  language: hi
  text: तुमने ऊँचे और पवित्र अनन्त स्वर्ग को क्यों छोड़ दिया, स्त्रियों के साथ सोए, मनुष्यों की बेटियों के साथ अपने आपको अशुद्ध किया, अपने लिए पत्नियाँ लीं, पृथ्वी की सन्तानों जैसा आचरण किया[a], और विशालकाय पुत्र उत्पन्न किए[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पृथ्वी की सन्तानें” नश्वर मनुष्यों को स्वर्गीय पहरेदारों के विपरीत रखती हैं; इसे केवल “लोग” कहने से यह विरोध मिट जाएगा।
    reason: cultural_note
  - marker: b
    text: अन्तिम पद इस सम्बन्ध से उत्पन्न असामान्य सन्तान को सूचित करता है। मुख्य पाठ में “विशालकाय पुत्र” है; “ऐसे पुत्र जो विशालकाय थे” भी सम्भव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ኃደግሙ
  choice: छोड़ दिया
  rationale: यह तीव्र त्याग का भाव रखता है और आरोपात्मक प्रश्न में स्वाभाविक हिन्दी भी है; केवल ‘चले आए’ कहना इसकी निन्दात्मक धार को घटा देता।
- source_word: ሰማየ ልዑለ ወቅዱሰ ዘለዓለም
  choice: ऊँचे और पवित्र अनन्त स्वर्ग
  rationale: विशेषणों के संचय और उनके महिमामय, रहस्योद्घाटनात्मक स्वर को बनाए रखते हुए मूल क्रम के निकट रहता है।
- source_word: ሰከብክሙ
  choice: स्त्रियों के साथ सोए
  rationale: यौन सम्बन्ध का सीधा किंतु अश्लील न लगने वाला मुहावरा है, जो औपचारिक फटकार के अनुकूल है।
- source_word: እዋለደ ሰብእ
  choice: मनुष्यों की बेटियाँ
  rationale: स्वर्गीय प्राणियों और मानव स्त्रियों के बीच मूल पाठ में निहित विरोध को बनाए रखता है।
- source_word: ረኩስክሙ
  choice: अपने आपको अशुद्ध किया
  rationale: मूल क्रिया के नैतिक और शुद्धता-अशुद्धता सम्बन्धी आरोप को स्पष्ट रखता है; इसे केवल मेल-जोल कहना अर्थ को हल्का कर देता।
- source_word: አንስተ
  choice: पत्नियाँ
  rationale: ‘अपने लिए लेना’ के साथ यह वैवाहिक ग्रहण का स्वाभाविक अर्थ देता है, जबकि केवल ‘स्त्रियाँ’ अधिक सामान्य होता।
- source_word: ከመ ውሉደ ምድር ገበርክሙ
  choice: पृथ्वी की सन्तानों जैसा आचरण किया
  rationale: स्वर्गीय पहरेदारों और पृथ्वी पर जन्मे मनुष्यों का विरोध सुरक्षित रहता है और हिन्दी में अर्थ स्पष्ट है।
- source_word: ውሉደ ረዓይተ
  choice: विशालकाय पुत्र
  rationale: असामान्य रूप से बड़े उत्पन्न वंश का ठोस चित्र प्रस्तुत करता है। ‘दैत्य पुत्र’ हिन्दी में अनावश्यक रूप से दानवी या पौराणिक पहचान जोड़ सकता है।
theological_decisions:
- issue: पहरेदारों और स्त्रियों के सम्बन्ध का नैतिक स्वरूप
  choice: सम्बन्ध को आत्म-अशुद्धि के रूप में व्यक्त करना
  alternative: इसे केवल स्त्रियों से मेल या विवाह के रूप में तटस्थ ढंग से कहना
  rationale: गीज़ पाठ स्पष्ट रूप से अशुद्ध होने की क्रिया का प्रयोग करता है; इसलिए अनुवाद को इस नैतिक और शुद्धता-सम्बन्धी निर्णय को नरम नहीं करना चाहिए।
- issue: अन्तिम सन्तान की प्रकृति
  choice: विशालकाय पुत्र
  alternative: दैत्य पुत्र; हिंसक सन्तान
  rationale: मुख्य पाठ असामान्य आकार का ठोस बोध बनाए रखता है, पर हिन्दी धार्मिक-पौराणिक परम्पराओं से ‘दैत्य’ की अतिरिक्त पहचान आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, आरोपात्मक स्वर रखा गया है। आरम्भ का ‘क्यों’ समन्वित सभी क्रियाओं पर लागू होता है, जिससे मूल के एक दीर्घ प्रश्न की संरचना बनी रहती है। ‘सन्तान’ की मानक वर्तनी और ‘अपने आपको’ का स्पष्ट आत्मवाचक रूप अपनाया गया है।
