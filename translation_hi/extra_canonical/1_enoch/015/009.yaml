base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/009.yaml
  text: And evil spirits came out from their flesh[a], because they were created from above; and from the holy Watchers was their beginning and first foundation[d][c][b]. They shall be evil spirits.
translation:
  language: hi
  text: और दुष्ट आत्माएँ उनके मांस से निकल आईं[a], क्योंकि वे ऊपर से रची गई थीं; और पवित्र पहरेदारों से उनका आरम्भ और प्रथम आधार था[b]। वे दुष्ट आत्माएँ होंगी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “उनके शरीरों से बाहर निकलीं।” गीइज़ पाठ में शाब्दिक रूप से “उनके मांस से” है।
    reason: lexical_alternative
  - marker: b
    text: “पवित्र पहरेदार” का अधिक शाब्दिक रूप “पवित्र जन, अर्थात् पहरेदार” भी हो सकता है। यहाँ संकेत स्वर्गदूतीय पहरेदारों की ओर है।
    reason: lexical_alternative
  - marker: c
    text: 'अन्तिम शब्दों को नामकरण के सूत्र के रूप में भी समझा जा सकता है: “वे ‘दुष्ट आत्माएँ’ कहलाएँगी।” गीइज़ पाठ का संक्षिप्त रूप केवल “दुष्ट आत्मा/आत्माएँ” जैसे संज्ञा-खंड के रूप में भी पढ़ा जा सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ነፍሳት እኩያን
  choice: दुष्ट आत्माएँ
  rationale: यहाँ እኩያን, ነፍሳት का विशेषण है; इसलिए अर्थ ‘दुष्ट आत्माएँ’ है, न कि ‘दुष्टों की आत्माएँ’। प्रसंग में ये पहरुओं की संतानों से निकली आत्माएँ हैं।
- source_word: ወጽኡ እምሥጋሆሙ
  choice: उनके मांस से निकल आईं
  rationale: ‘मांस’ मूल पाठ की ठोस शारीरिक छवि को बनाए रखता है; ‘निकल आईं’ शरीर से बाहर आने की गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: እመልዕልት ተፈጥሩ
  choice: वे ऊपर से सृजी गई थीं
  rationale: यह स्वर्गीय अथवा ऊपरी उद्गम का संकेत देता है, पर उन्हें पूर्णतः स्वर्गदूत ठहराकर मिश्रित उद्गम की अस्पष्टता को समाप्त नहीं करता।
- source_word: እምቅዱሳን ትጉሃን
  choice: पवित्र पहरुओं से
  rationale: यह हनोक-साहित्य के विशिष्ट स्वर्गदूतीय समूह की ओर संकेत करता है। ‘पहरुए’ तकनीकी पद को पहचानने योग्य और साधारण पाठक के लिए बोधगम्य रखता है।
- source_word: ቀዳሚቶሙ ወቀዳሚ መሰረት
  choice: उनका आरम्भ और पहला आधार
  rationale: मूल की दोहरी उद्गम-भाषा और उसके गंभीर अपोकैलिप्टिक लहजे को अनावश्यक रूप से समतल किए बिना हिन्दी में सुरक्षित रखा गया है।
- source_word: መንፈሰ እኩየ
  choice: “दुष्ट आत्माएँ” कहलाएँगी
  rationale: अन्तिम पद को प्रसंगानुसार नामकरण-वाक्य के रूप में व्यक्त किया गया है। उद्धरण-चिह्न इस पदनाम को स्पष्ट करते हैं, जबकि पादटिप्पणी इसकी व्याकरणिक अस्पष्टता बताती है।
theological_decisions:
- issue: मृत्यु के बाद वर्णित प्राणियों की पहचान
  choice: पद को पहरुओं और स्त्रियों की संतानों से निकली देह-विहीन आत्माओं के विषय में समझा गया है।
  alternative: इसे सामान्य रूप से दुष्ट मनुष्यों की आत्माओं के विषय में समझना।
  rationale: निकटवर्ती प्रसंग, ‘ऊपर से’ उद्गम और पवित्र पहरुओं से आरम्भ होने की भाषा इन प्राणियों को दानवाकार संतानों से जोड़ती है; फिर भी अनुवाद पद में ऐसी व्याख्यात्मक सामग्री नहीं जोड़ता जो मूल में स्पष्टतः नहीं कही गई।
- issue: ‘ऊपर से’ का धार्मिक आशय
  choice: इसे उनके उद्गम के स्वर्गीय अथवा ऊपरी पक्ष का संकेत माना गया है।
  alternative: इसे नैतिक स्वीकृति या पूर्ण स्वर्गदूतीय दर्जे का कथन मानना।
  rationale: पद की ब्रह्माण्ड-संबंधी दिशा बनी रहती है, पर ‘ऊपर से’ को नैतिक भलाई या शुद्ध स्वर्गदूतीय प्रकृति के बराबर नहीं ठहराया गया।
- issue: अन्तिम ‘दुष्ट आत्मा/आत्माएँ’ पद का वाक्यगत बल
  choice: 'इसे नामकरण-सूत्र के रूप में प्रस्तुत किया गया है: वे ‘दुष्ट आत्माएँ’ कहलाएँगी।'
  alternative: इसे केवल एक संज्ञा-खंड या वर्णनात्मक पद मानना।
  rationale: संदर्भ और परामर्श-पाठ नामकरण का समर्थन करते हैं, किन्तु प्रेषित गीइज़ पाठ का अन्त संक्षिप्त और पाठगत रूप से कठिन है; इसलिए विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किन्तु सहज रखी गई है। ‘पहरुए’ हनोक-साहित्य का विशिष्ट पद है; ‘मांस’ मूल की शारीरिक छवि बचाता है। वाक्य की कुछ भारयुक्त पुनरुक्ति जानबूझकर रखी गई है ताकि मूल का अपोकैलिप्टिक स्वर और उद्गम-संबंधी तनाव बना रहे।
