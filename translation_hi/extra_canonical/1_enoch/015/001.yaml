base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/001.yaml
  text: 'And he answered me and said to me[a], and I heard: “Do not fear, Enoch, righteous man and scribe of righteousness. Come near here and hear my word.”'
translation:
  language: hi
  text: और उसने मुझे उत्तर दिया और मुझसे कहा; तब मैंने सुना:[a] “मत डर, हनोक, धर्मी मनुष्य और धार्मिकता के लिपिक। यहाँ पास आ और मेरा वचन सुन।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीइज़ पाठ में ‘सुनना’ क्रिया की पुनरावृत्ति प्रतीत होती है—शाब्दिक रूप से, ‘और मैंने सुना, मैंने सुना।’ सहज हिन्दी के लिए मुख्य पाठ में इसे एक बार रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአኒ
  choice: उसने मुझे उत्तर दिया
  rationale: क्रिया का स्वाभाविक अर्थ उत्तर देना या प्रत्युत्तर देना है; यह संवादात्मक प्रसंग और औपचारिक शैली दोनों बनाए रखता है।
- source_word: ወይቤለኒ
  choice: और मुझसे कहा
  rationale: यह सामान्य कथन-सूत्र है। ‘उत्तर दिया’ के साथ इसे बनाए रखने से गीइज़ की पुनरुक्तिपूर्ण कथन-शैली सुरक्षित रहती है।
- source_word: ወሰምኩ፡ ሰማዕኩ
  choice: तब मैंने सुना
  rationale: पाठ में सुनने की क्रिया दोहराई हुई प्रतीत होती है। मुख्य पाठ में स्वाभाविक हिन्दी के लिए इसे संक्षिप्त किया गया है, जबकि पाठगत पुनरावृत्ति पाद-टिप्पणी में बताई गई है; ‘आवाज़’ स्रोत में स्पष्ट रूप से नहीं है, इसलिए नहीं जोड़ी गई।
- source_word: አትፍራህ
  choice: मत डर
  rationale: प्रत्यक्ष निषेध का सहज, गरिमापूर्ण और आधुनिक हिन्दी रूप।
- source_word: ብእሲ፡ ጻድቅ
  choice: धर्मी मनुष्य
  rationale: यह हनोक की नैतिक पहचान को स्पष्ट रखता है और धार्मिकता-संबंधी शब्दावली से संगति बनाए रखता है।
- source_word: ጻሓፊ፡ ጽድቅ
  choice: धार्मिकता के शास्त्री
  rationale: ‘शास्त्री’ लेखक/लिपिक की औपचारिक, प्रकाशनात्मक भूमिका को व्यक्त करता है; संबंधकारक संरचना और ‘धार्मिकता’ दोनों सुरक्षित हैं।
- source_word: ቅረብ፡ ዝየ
  choice: यहाँ निकट आ
  rationale: आज्ञार्थक क्रिया और स्थानसूचक अव्यय दोनों को बनाए रखते हुए निकट आने का भाव व्यक्त किया गया है।
- source_word: ወስማዕ፡ ቃልየ
  choice: और मेरा वचन सुन
  rationale: एकवचन ‘वचन’ स्रोत के अधिक निकट है और प्रकाशनात्मक कथन की गरिमा बनाए रखता है।
theological_decisions:
- issue: हनोक की नैतिक और लेखकीय उपाधियों का अनुवाद
  choice: धर्मी मनुष्य और धार्मिकता के शास्त्री
  alternative: न्यायी मनुष्य और न्याय का लेखक
  rationale: पद हनोक को नैतिक रूप से योग्य व्यक्ति और प्रकट सत्य के लिखने वाले—दोनों रूपों में प्रस्तुत करता है। दोनों उपाधियाँ बनाए रखने से न तो उसकी भूमिका केवल सामान्य भक्ति तक सीमित होती है, न केवल लेखन-कार्य तक।
- issue: ‘मेरा वचन’ में एकवचन बनाए रखना
  choice: मेरा वचन
  alternative: मेरी बातें
  rationale: गीइज़ पाठ में संज्ञा एकवचन है। इसे एकवचन रखने से अनावश्यक धर्मवैज्ञानिक विस्तार किए बिना भविष्यवाणी-सदृश कथन का रूप सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण रखी गई है। मूल की पुनरुक्तिपूर्ण कथन-शैली ‘उत्तर दिया और ... कहा’ में सुरक्षित है। ‘आवाज़’ जैसा कोई अप्रकट पद नहीं जोड़ा गया। संबोधन में एकवचन निकटता और मूल के सीधे आज्ञार्थक स्वर के अनुरूप ‘मत डर’, ‘आ’ और ‘सुन’ प्रयुक्त हैं।
