base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/008.yaml
  text: And now[a], the giants who were born from spirits and flesh will be called evil spirits upon the earth[b], and on the earth will be their dwelling.
translation:
  language: hi
  text: और अब, वे दैत्य[a], जो आत्माओं और शरीर से उत्पन्न हुए थे, पृथ्वी पर दुष्ट आत्माएँ कहलाएँगे; और पृथ्वी पर उनका निवास होगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरंभिक संज्ञा को प्रसंग के आधार पर पहरेदारों और मानवीय स्त्रियों से उत्पन्न दैत्यों के लिए समझा गया है; शब्द के स्तर पर अधिक सामान्य अनुवाद ‘संतानें’ भी संभव है।
    reason: lexical_alternative
  - marker: b
    text: मूल गीज़ पाठ में ‘पृथ्वी’ दो बार आया है। यह पुनरावृत्ति बनाए रखी गई है, क्योंकि पद इन आत्माओं के स्वर्गीय नहीं, बल्कि पृथ्वी से जुड़े क्षेत्र पर बल देता है।
    reason: cultural_note
lexical_decisions:
- source_word: ረዓይት
  choice: दैत्य
  rationale: निकटवर्ती प्रसंग में यह पहरेदारों और स्त्रियों से उत्पन्न विशालकाय संतानों को सूचित करता है। ‘दैत्य’ इस प्रसंगगत अर्थ और अपोकैलिप्टिक भयावहता को बनाए रखता है, जबकि मूल शब्द के अधिक सामान्य अर्थ की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: ተወልዱ
  choice: उत्पन्न हुए थे
  rationale: यह निष्क्रिय जन्म अथवा उत्पत्ति का भाव स्वाभाविक हिन्दी में व्यक्त करता है और मिश्रित उद्गम पर बल बनाए रखता है।
- source_word: እመናፍስት ወሥጋ
  choice: आत्माओं और शरीर से
  rationale: गीज़ पाठ आत्मा और शरीर को उनकी दोहरी उत्पत्ति के स्रोतों के रूप में साथ रखता है। ‘शरीर’ यहाँ देहधारी मानवीय पक्ष को व्यक्त करता है, बिना अतिरिक्त व्याख्या जोड़े।
- source_word: መንፈሳት እኩያን
  choice: दुष्ट आत्माएँ
  rationale: विशेषण का सीधा अर्थ दुष्ट या बुरा है। ‘अशुद्ध आत्माएँ’ कहने से बाद की पारिभाषिक भाषा अनावश्यक रूप से आ सकती थी।
- source_word: ይሰመዩ
  choice: कहलाएँगे
  rationale: यह निष्क्रिय नामकरण सूत्र को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: በዲበ ምድር
  choice: पृथ्वी पर
  rationale: यह स्थान अथवा कार्यक्षेत्र बताता है; ‘पृथ्वी पर’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: ወውስተ ምድር ይከውን መሓድሪሆሙ
  choice: और पृथ्वी पर ही उनका निवास होगा
  rationale: मूल में ‘पृथ्वी’ की पुनरावृत्ति को बनाए रखा गया है। ‘ही’ पृथ्वी को उनके निर्धारित निवास-क्षेत्र के रूप में स्वाभाविक हिन्दी में उभारता है, पर ‘पृथ्वी के भीतर’ जैसा अधिक विशिष्ट अर्थ नहीं थोपता।
theological_decisions:
- issue: दुष्ट आत्माएँ कहलाने वाले प्राणियों की पहचान
  choice: पद को पहरेदारों और मानवीय स्त्रियों की मिश्रित संतानों, अर्थात् दैत्यों, के विषय में समझा गया है।
  alternative: आरंभिक संज्ञा को अधिक सामान्य रूप से ‘संतानें’ अथवा ‘वंशज’ कहा जा सकता है।
  rationale: 15:8–12 का निकट प्रसंग इन मिश्रित संतानों और पृथ्वी पर उनकी आत्मिक दशा की व्याख्या करता है। ‘दैत्य’ संदर्भ को स्पष्ट करता है, पर पादटिप्पणी शाब्दिक स्तर की व्यापक संभावना को खुला रखती है और बाद की दानव-विद्या नहीं थोपती।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। वाक्य में मूल की ‘पृथ्वी’ वाली पुनरावृत्ति तथा आत्मा–शरीर का तनाव सुरक्षित रखा गया है; अर्धविराम दोनों निकटवर्ती कथनों को स्पष्ट रूप से जोड़ता है।
