base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/002.yaml
  text: 'And go[a], say to the watchers of heaven who have sent you to petition on their behalf: ''You ought to petition on behalf of men[b], and not men on your behalf.'''
translation:
  language: hi
  text: 'और जाओ और स्वर्ग के पहरेदारों से, जिन्होंने तुम्हें अपनी ओर से विनती करने को भेजा है, कहो: “तुम्हें मनुष्यों की ओर से विनती करनी चाहिए[a], न कि मनुष्यों को तुम्हारी ओर से विनती करनी चाहिए।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हें मनुष्यों की ओर से विनती करनी चाहिए थी।” मूल भाषा की रचना उचितता या दायित्व व्यक्त करती है। प्रसंग में यह पहले किए गए उलटे अनुरोध पर फटकार भी हो सकती है, इसलिए भूतकालिक अर्थ संभव है।
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ሑር
  choice: जाओ
  rationale: हनोक को संबोधित गति-सूचक आज्ञार्थक क्रिया का सहज और सीधा हिन्दी रूप।
- source_word: በሎሙ
  choice: उनसे ... कहो
  rationale: बहुवचन अप्रत्यक्ष कर्म सहित प्रत्यक्ष वचन की भूमिका को स्वाभाविक हिन्दी वाक्य-विन्यास में व्यक्त करता है।
- source_word: ለትጉሃነ ሰማይ
  choice: स्वर्ग के पहरेदारों
  rationale: यह पहरेदारों की पुस्तक में इन स्वर्गीय प्राणियों की विशिष्ट उपाधि है; केवल ‘स्वर्गदूतों’ कहने से साहित्यिक-अपोकैलिप्टिक पहचान धुंधली हो जाती।
- source_word: እለ ፈነዉከ
  choice: जिन्होंने तुम्हें ... भेजा है
  rationale: उन पहरेदारों की पहचान बताने वाला संबंधवाचक उपवाक्य; पूर्ण हुई किन्तु वर्तमान प्रसंग से जुड़ी क्रिया के लिए ‘भेजा है’ उपयुक्त है।
- source_word: ትስአል በእንቲአሆሙ
  choice: अपनी ओर से विनती करने
  rationale: मूल क्रिया सामान्यतः माँगने या अनुरोध करने की है; न्यायिक-स्वर्गीय प्रसंग में ‘विनती’ औपचारिक निवेदन का भाव देती है, बिना बाद की विशिष्ट धार्मिक शब्दावली थोपे।
- source_word: አንትሙ መፍትው ትስአሉ
  choice: तुम्हें ... विनती करनी चाहिए थी
  rationale: रचना उचितता अथवा दायित्व और उलटे हुए उचित क्रम पर फटकार व्यक्त करती है। पूर्व में होना चाहिए था—इस प्रसंगगत भाव को ‘करनी चाहिए थी’ स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: በእንተ ሰብእ
  choice: मनुष्यों की ओर से
  rationale: ሰብእ यहाँ सामूहिक मानवजाति को दर्शाता है; ‘मनुष्यों’ लिंग-समावेशी है और अगली धारा में शब्द की पुनरावृत्ति बनाए रखता है।
- source_word: ወአኮ ሰብእ በእንቲአክሙ
  choice: न कि मनुष्यों को तुम्हारी ओर से
  rationale: 'मूल की संक्षिप्त उलटबाँसी सुरक्षित रहती है: स्वर्गीय प्राणियों को मनुष्यों के लिए विनती करनी थी, मनुष्यों को उनके लिए नहीं।'
theological_decisions:
- issue: स्वर्गीय प्राणियों की उपाधि का अनुवाद
  choice: स्वर्ग के पहरेदारों
  alternative: स्वर्गदूतों / स्वर्गीय पहरेदारों
  rationale: तकनीकी उपाधि को बनाए रखने से इस आख्यान की विशिष्ट अपोकैलिप्टिक श्रेणी दिखाई देती है; ‘स्वर्गदूत’ इसे सामान्य बना देता।
- issue: विनती के उचित क्रम पर फटकार का बल
  choice: तुम्हें मनुष्यों की ओर से विनती करनी चाहिए थी, न कि मनुष्यों को तुम्हारी ओर से
  alternative: तुम्हें मनुष्यों के लिए माँगना चाहिए, न कि मनुष्यों को तुम्हारे लिए
  rationale: यह रूप स्वर्गीय प्राणियों और मनुष्यों के बीच अपेक्षित क्रम को व्यक्त करता है, पर उससे कोई विस्तृत दूत-विज्ञान निर्मित नहीं करता।
- issue: दायित्व के कालगत स्वरूप का निरूपण
  choice: करनी चाहिए थी
  alternative: करनी चाहिए
  rationale: प्रेषण पहले ही हो चुका है और उसकी अनुचितता पर फटकार है; हिन्दी में भूतकालिक अपेक्षा इस प्रसंग को सहज बनाती है, जबकि मूल की रचना सामान्य उचितता/दायित्व भी वहन कर सकती है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप। ‘पहरेदार’ को तकनीकी उपाधि के रूप में रखा गया है। ‘मनुष्य’ सामूहिक मानवजाति के अर्थ में लिंग-समावेशी है।
