base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/005.yaml
  text: Therefore I gave them women[a], so that they might beget children by them and offspring might be born to them[b], so that thus no work on the earth might be lacking to them.
translation:
  language: hi
  text: इसी कारण मैंने उन्हें स्त्रियाँ दीं, ताकि वे उनमें बीज बोएँ[a] और उनसे संतान उत्पन्न हो, ताकि इस प्रकार पृथ्वी पर उनके लिए किसी कार्य की कमी न रहे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उन पर बीज बोएँ।” गीइज़ पाठ प्रजनन के लिए बुआई का रूपक बनाए रखता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम उपवाक्य कठिन है। संभवतः आशय यह है कि प्रजनन के द्वारा पृथ्वी का जीवन और कार्य निर्धारित रीति से चलता रहे।
    reason: textual_variant
lexical_decisions:
- source_word: በእንተዝ
  choice: इसी कारण
  rationale: यह पिछले पदों में आत्मिक और पार्थिव प्राणियों के बीच किए गए भेद के आधार पर दैवी व्यवस्था का कारण बताता है।
- source_word: ወሀብክዎሙ አንስቲያ
  choice: मैंने उन्हें स्त्रियाँ दीं
  rationale: ‘स्त्रियाँ’ मूल संज्ञा के सामान्य अर्थ को रखता है; ‘पत्नियाँ’ कहना वैवाहिक स्थिति को मूल से अधिक निश्चित कर देता।
- source_word: ከመ ይዝርኡ ላዕሌሆን
  choice: ताकि वे उनमें बीज बोएँ
  rationale: मूल का कृषि-आधारित प्रजनन रूपक सुरक्षित रखा गया है; ‘उनमें’ प्रसंगानुकूल हिन्दी है।
- source_word: ወይትወለዱ ውሉደ በላዕሌሆን
  choice: और उनसे संतान उत्पन्न हो
  rationale: ‘संतान’ ውሉደ का व्यापक अर्थ व्यक्त करता है और मातृ-संबंध को स्वाभाविक हिन्दी में रखता है।
- source_word: ከመ ከማሁ
  choice: जिससे इस प्रकार
  rationale: दोहरे उद्देश्य/परिणाम-सूचक प्रयोग का बल सहज हिन्दी में सुरक्षित है।
- source_word: ኢይትኀጐ ግብር በላዕሌሆን በዲበ ምድር
  choice: पृथ्वी पर उनका कोई कार्य अधूरा न रहे
  rationale: ግብር के व्यापक ‘कार्य’ अर्थ को रखा गया है; कठिन अंतिम उपवाक्य को पूरी तरह स्पष्ट मानकर संकीर्ण नहीं किया गया।
theological_decisions:
- issue: पार्थिव प्राणियों को स्त्रियाँ दिए जाने का उद्देश्य
  choice: प्रजनन को पार्थिव प्राणियों के लिए ठहराई गई दैवी व्यवस्था के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल विवाह की स्थापना या पहरेदारों के पतन के बाद दी गई दंडात्मक छूट मानना।
  rationale: स्थानीय प्रसंग बीज और जन्म के द्वारा पृथ्वी पर जीवन और कार्य की निरंतरता पर बल देता है तथा पहरेदारों द्वारा सीमाओं के अनुचित उल्लंघन से इसका अंतर दिखाता है।
- issue: कठिन अंतिम उपवाक्य का आशय
  choice: ‘उनका कोई कार्य अधूरा न रहे’ के रूप में अपेक्षाकृत शाब्दिक और खुला अनुवाद।
  alternative: इसे स्पष्ट रूप से ‘मानव जीवन चलता रहे’ कहना।
  rationale: मूल में ግብር व्यापक है और वाक्य-विन्यास कठिन है; व्याख्यात्मक अर्थ को टिप्पणी में रखा गया है, मुख्य पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘बीज बोएँ’ मूल रूपक को बचाता है, जबकि पादटिप्पणी उसकी शाब्दिक संरचना बताती है। अंतिम कठिन खंड की अस्पष्टता मुख्य पाठ और टिप्पणी दोनों में सुरक्षित रखी गई है।
