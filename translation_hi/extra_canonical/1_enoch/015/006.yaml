  yaml_path: translation/extra_canonical/1_enoch/015/006.yaml
  text: But you, formerly, were spiritual beings, living an eternal life that does not die throughout all the generations of the world.
translation:
  language: hi
  text: पर तुम पहले आत्मिक प्राणी थे[a], और ऐसा अनन्त जीवन जीते थे जो संसार की सारी पीढ़ियों के दौरान कभी नहीं मरता[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आत्माएँ’। गीइज़ शब्द का यह अधिक संक्षिप्त अनुवाद भी सम्भव है।
    reason: lexical_alternative
  - marker: b
    text: ‘संसार’ का अर्थ यहाँ ‘युग’ भी हो सकता है; तब भाव होगा, ‘सभी पीढ़ियों के दौरान सदा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ቀዳሚ
  choice: पहले
  rationale: यह पहरेदारों की पूर्व अवस्था और उनकी वर्तमान भ्रष्ट दशा के बीच समयगत विरोध को स्वाभाविक हिन्दी में व्यक्त करता है, बिना सृष्टिक्रम को अनावश्यक रूप से निश्चित किए।
- source_word: ኮንክሙ
  choice: थे
  rationale: यहाँ क्रिया का संबंधसूचक अर्थ कर्ता की पूर्व अवस्था बताता है; इसलिए ‘थे’ उपयुक्त है, न कि ‘बन गए’।
- source_word: መንፈሳውያነ
  choice: आत्मिक प्राणी
  rationale: यह शब्द उन प्राणियों को आत्मा से विशेषित करता है। ‘आत्मिक प्राणी’ स्पष्ट है और इसे तुरंत किसी अधिक संकीर्ण पारिभाषिक श्रेणी में नहीं बाँधता।
- source_word: ሕያዋነ ሕይወት ዘለዓለም
  choice: ऐसा अनन्त जीवन जीते थे
  rationale: यह स्रोत की समान-मूलक रचना ‘जीवन जीना’ को हिन्दी में स्वाभाविक ढंग से बनाए रखता है और स्पष्ट संज्ञा ‘जीवन’ को सुरक्षित रखता है।
- source_word: ዘኢይመውት
  choice: जो ... कभी नहीं मरता
  rationale: सापेक्ष उपवाक्य पिछले ‘अनन्त जीवन’ को तीव्र करता है। ‘मरता’ स्रोत की ठोस और प्रबल भाषा को बनाए रखता है।
- source_word: ለኵሉ ትውልደ ዓለም
  choice: संसार की सभी पीढ़ियों तक
  rationale: यह पूरे संसार या युग की पीढ़ियों में बने रहने की अवधि व्यक्त करता है और ዓለም के ‘संसार/युग’ अर्थ की अस्पष्टता को टिप्पणी में सुरक्षित रखता है।
theological_decisions:
- issue: पहरेदारों की मूल अवस्था को ‘आत्माएँ’ कहा जाए या व्यापक वर्णन से व्यक्त किया जाए
  choice: आत्मिक प्राणी
  alternative: आत्माएँ; आत्मिक जन
  rationale: पद उनके स्त्रियाँ ग्रहण करने और सन्तान उत्पन्न करने से पहले की अवस्था पर बल देता है। ‘आत्मिक प्राणी’ सत्ता-संबंधी विरोध को रखता है, पर गीइज़ शब्दावली से आगे जाकर बाद की धर्मवैज्ञानिक सूक्ष्मता नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘ऐसा अनन्त जीवन जीते थे’ स्रोत की समान-मूलक रचना को स्वाभाविक हिन्दी में रखता है। वाक्य में जीवन के ‘न मरने’ का असामान्य मानवीकरण जानबूझकर सुरक्षित रखा गया है।
