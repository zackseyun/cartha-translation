  naturalness: ‘देह के रक्त’ और ‘मांस और रक्त’ स्रोत की जानबूझकर असामान्य, देहात्मक भाषा को बनाए रखते हुए आधुनिक मानक हिन्दी में समझने योग्य हैं। ‘मांस और रक्त वाले प्राणी’ अंतिम बहुवचन संबंधवाचक वाक्य को स्वाभाविक बनाता है; ‘प्राणी’ यहाँ सन्तान/मानवों का निहित संदर्भ स्पष्ट करता है, न कि कोई अतिरिक्त धार्मिक व्याख्या जोड़ता है।
  terminology: ‘पवित्र’, ‘आत्मिक प्राणी’, ‘अनन्त जीवन’, ‘अशुद्ध’, ‘देह’, ‘मांस और रक्त’, और ‘नाश’ उपयुक्त गरिमापूर्ण शब्दावली हैं। ‘स्त्रियों के रक्त से’ को मुख्य पाठ में रखा गया है, पर दूषित पाठ-स्थिति के कारण वैकल्पिक पाठ को टिप्पणी में स्पष्ट रखा गया है।
