    rationale: पाठ में चिह्नित/दूषित रूप के बावजूद संदर्भ, पाठ-परंपरा, और समानांतर रक्त-पुनरावृत्ति ‘स्त्रियों के रक्त से’ का समर्थन करते हैं। केवल ‘स्त्रियों के कारण’ लिखने से इस पद की रक्त-विषयक त्रि-पुनरावृत्ति और स्रोतगत बिंब कमजोर हो जाता है।
