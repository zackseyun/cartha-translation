base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/004.yaml
  text: But you were holy[a], spiritual beings, living eternal life. But you defiled yourselves with women, and by the blood of flesh you fathered children, and you desired the blood of men, and you did as they do[c][b], producing flesh and blood—those who die and perish.
translation:
  language: hi
  text: परन्तु तुम पवित्र, आत्मिक प्राणी थे और अनन्त जीवन जीते थे। फिर भी तुमने स्त्रियों के रक्त से अपने आप को अशुद्ध किया, और देह के रक्त से सन्तान उत्पन्न की; तुमने मनुष्यों के रक्त की लालसा की और जैसा वे करते हैं वैसा ही किया—मांस और रक्त वाले प्राणी उत्पन्न किए, जो मरते और नाश हो जाते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद में देह, मांस और “रक्त” की बार-बार आने वाली भाषा आत्मिक प्रहरियों के नश्वर, शारीरिक प्रजनन और मानवीय लालसा के क्षेत्र में प्रवेश पर बल देती है। पहले अशुद्धता-वाले वाक्यांश में गीइज़ पाठ दूषित है; उपलब्ध पाठ और संदर्भ के आधार पर उसका अर्थ “स्त्रियों के रक्त से अपने आप को अशुद्ध किया” लिया गया है, पर “स्त्रियों के कारण/साथ अशुद्ध हुए” भी सम्भव है। अंतिम क्रिया का अनुवाद “नष्ट किए जाते हैं” भी हो सकता है।
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: ቅዱሳን
  choice: पवित्र
  rationale: प्रहरियों की मूल अवस्था बताने वाला विधेयात्मक विशेषण; बाद की अशुद्धता के साथ विरोध स्पष्ट रहता है।
- source_word: መንፈሳውያን
  choice: आत्मिक प्राणी
  rationale: यह उनकी देहरहित प्रकृति के साथ-साथ उनके व्यक्तित्व को भी सहज हिन्दी में व्यक्त करता है।
- source_word: ሕያዋነ ሕይወት ዘለዓለም
  choice: अनन्त जीवन जीते थे
  rationale: जीवन/जीने की पुनरुक्ति का कुछ प्रभाव बचाते हुए मानव मृत्यु के साथ विरोध को स्पष्ट करता है।
- source_word: በደቡ አንስት ረኩስክሙ
  choice: स्त्रियों के कारण अशुद्ध हो गए
  rationale: पाठ में चिह्नित पहला शब्द दूषित या संदिग्ध है; उपलब्ध रूप को बिना अनिश्चित रूप से 'स्त्रियों के रक्त से' ठहराए अशुद्धता का मूल भाव सुरक्षित रखा गया है।
- source_word: በደመ ሥጋ አውለድክሙ
  choice: देह के रक्त से तुमने सन्तान उत्पन्न की
  rationale: रक्त और देह की असामान्य पर महत्वपूर्ण छवि को बनाए रखता है तथा क्रिया में निहित सन्तान का स्वाभाविक उल्लेख करता है।
- source_word: በደመ ሰብእ ፈተውክሙ
  choice: मनुष्यों के रक्त की लालसा की
  rationale: ሰብእ को स्पष्ट रखता है और इच्छा की तीव्रता को औपचारिक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ወገበርክሙ ከመ እሙንቱ ይገብሩ ሥጋ ወደመ
  choice: जैसा वे करते हैं वैसा ही किया—मांस और रक्त उत्पन्न किया
  rationale: दोहराई गई 'करना' क्रिया और उसके कर्म 'मांस और रक्त' दोनों को उनके स्रोतगत क्रम में सुरक्षित रखता है।
- source_word: እለ እሙንቱ ይመውቱ ወይትሐጐሉ
  choice: वे मनुष्य जो मरते और नाश हो जाते हैं
  rationale: मानव नश्वरता और विनाश की गंभीर ध्वनि को बनाए रखता है; सर्वनाम का संदर्भ हिन्दी में स्पष्ट किया गया है।
theological_decisions:
- issue: आत्मिक प्रहरियों और नश्वर मनुष्यों के अस्तित्वगत भेद को कितना स्पष्ट करना है
  choice: पवित्र और आत्मिक प्राणियों के देह, रक्त, प्रजनन और मृत्यु के मानवीय क्षेत्र में प्रवेश को स्रोत की ठोस छवियों द्वारा दिखाया गया है।
  alternative: इसे केवल 'अमर स्वर्गदूतों ने नश्वर मनुष्यों जैसा जीवन अपनाया' कहकर अधिक व्याख्यात्मक बनाया जा सकता था।
  rationale: स्रोत स्वयं 'अमर' या सुस्पष्ट सृष्टि-वर्गों की व्याख्या नहीं करता; रक्त और देह की पुनरावृत्ति ही धार्मिक तनाव को वहन करती है।
- issue: अन्तिम सम्बन्धवाचक वाक्यांश का संदर्भ
  choice: 'उसे नश्वर मनुष्यों से जोड़ा गया है: ''वे मनुष्य जो मरते और नाश हो जाते हैं।'''
  alternative: व्याकरणिक कठोरता बनाए रखते हुए केवल 'जो मरते और नाश हो जाते हैं' कहा जा सकता है।
  rationale: स्रोत में संदर्भ मनुष्यों की ओर है; हिन्दी में 'वे मनुष्य' जोड़ने से अर्थ स्पष्ट होता है, बिना मृत्यु को उत्पन्न मांस और रक्त का पृथक कर्ता बनाने के।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप। 'देह के रक्त' जैसी असामान्य अभिव्यक्ति स्रोत की जानबूझकर रखी गई रक्त-देह छवि के कारण सुरक्षित है; अधिक प्रचलित युग्म के लिए आगे 'मांस और रक्त' रखा गया है।
