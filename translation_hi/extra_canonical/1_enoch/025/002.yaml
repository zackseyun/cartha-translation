  yaml_path: translation/extra_canonical/1_enoch/025/002.yaml
  text: At that time I[a], Enoch, answered him, saying, “I desire to know about everything[b], but especially about this tree.”
translation:
  language: hi
  text: उस समय मैं, हनोक, ने उसे उत्तर दिया और कहा, “मैं सब कुछ जानना चाहता हूँ, पर इस वृक्ष के विषय में और भी अधिक जानना चाहता हूँ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'गीज़ वाक्य-विन्यास को इस प्रकार भी समझा गया है: “इन सब बातों के विषय में मैं जानना चाहता हूँ, और इस वृक्ष के विषय में तो और भी अधिक।” दोनों पाठों में इस वृक्ष के विषय में विशेष रूप से अधिक जानने की इच्छा व्यक्त होती है।'
    reason: textual_ambiguity
lexical_decisions:
- source_word: አውሣእክዎ
  choice: उसे उत्तर देते हुए
  rationale: क्रिया में तृतीय पुरुष एकवचन पुल्लिंग कर्म-प्रत्यय है; इसलिए ‘उसे’ को स्पष्ट रखा गया है। ‘उत्तर देते हुए कहा’ आगे के እንዘ፡ እብል के साथ स्वाभाविक हिन्दी बनाता है।
- source_word: በእንተ፡ ኵሉ
  choice: सब कुछ
  rationale: यह व्यापक रूप से उन सभी बातों की ओर संकेत करता है जिन्हें हनोक जानना चाहता है; इसे वृक्ष तक सीमित नहीं किया गया है।
- source_word: እፈቅድ፡ ኣእምር
  choice: जानना चाहता हूँ
  rationale: यह इच्छा और ज्ञान—दोनों भावों को सीधी, वर्तमान और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ወፈድፋደሰ
  choice: पर विशेष रूप से
  rationale: यह पद सामान्य इच्छा और इस वृक्ष के प्रति अधिक केंद्रित रुचि के बीच बलात्मक अंतर दिखाता है।
- source_word: በእንተዝ፡ ዕፅ
  choice: इस वृक्ष के विषय में
  rationale: ዕፅ का प्रसंगानुकूल अर्थ ‘वृक्ष’ है, और संकेतवाचक तत्व ‘इस’ के द्वारा सुरक्षित है।
theological_decisions:
- issue: हनोक की जिज्ञासा सामान्य ज्ञान की इच्छा है या इस वृक्ष के विषय में बढ़ी हुई प्रकाशनात्मक समझ की माँग
  choice: मैं सब कुछ जानना चाहता हूँ, पर विशेष रूप से इस वृक्ष के विषय में
  alternative: इन सब बातों के विषय में मैं जानना चाहता हूँ, और इस वृक्ष के विषय में तो और भी अधिक
  rationale: मुख्य पाठ ኵሉ और ‘इस वृक्ष’ के बीच व्यापक से विशिष्ट की ओर जाने वाला अंतर बनाए रखता है और हनोक की इच्छा को केवल साधारण जिज्ञासा बनाकर हल्का नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘हनोक’ नाम को प्रचलित हिन्दी रूप में रखा गया है। मूल के आरंभ में संयोजक न होने के कारण ‘और’ नहीं जोड़ा गया।
