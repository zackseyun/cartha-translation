base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/003.yaml
  text: And he answered me[a], saying, “This high mountain that you have seen, whose summit is like the throne of the Lord, is his throne, where the Holy and Great One, the Lord of Glory, the Eternal King[c][b], will dwell when he comes down to visit the earth with goodness.”
translation:
  language: hi
  text: और उसने मुझे उत्तर दिया, “यह ऊँचा पर्वत, जिसे तुमने देखा है और जिसकी चोटी प्रभु के सिंहासन के समान है, उसका सिंहासन है। जब पवित्र और महान परमेश्वर—महिमा का प्रभु, सनातन राजा—पृथ्वी की भलाई के लिए उसकी सुधि लेने उतरेगा, तब वह वहीं निवास करेगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम वाक्यांश का अनुवाद “पृथ्वी का भलाई के लिए निरीक्षण करने” या “भलाई में पृथ्वी की सुधि लेने” भी हो सकता है। भाव केवल स्वर्ग से पृथ्वी पर उतरने का नहीं, बल्कि कल्याणकारी दैवी आगमन का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ
  choice: उत्तर दिया
  rationale: दर्शनीय संवाद में प्रत्युत्तर देने की सामान्य क्रिया; गीइज़ के कथात्मक प्रयोग को स्वाभाविक हिन्दी में रखती है।
- source_word: ደብር ነዋኅ
  choice: ऊँचा पर्वत
  rationale: दर्शनीय भू-दृश्य और असाधारण ऊँचाई दोनों को स्पष्ट, साधारण हिन्दी में व्यक्त करता है।
- source_word: ዘርእሱ
  choice: जिसकी चोटी
  rationale: शाब्दिक अर्थ ‘उसका सिर/ऊपरी भाग’ है; पर्वत के संदर्भ में ‘चोटी’ सर्वाधिक स्वाभाविक है।
- source_word: መንበር
  choice: सिंहासन
  rationale: दैवी और राजकीय संदर्भ में सामान्य ‘आसन’ की अपेक्षा ‘सिंहासन’ उपयुक्त है तथा पद में इसकी पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: መንበሩ ውእቱ
  choice: उसका सिंहासन है
  rationale: मूल पाठ पर्वत को स्पष्ट रूप से ‘उसका सिंहासन’ कहता है; इसे केवल ‘स्थान’ बनाकर अर्थ को हल्का नहीं किया गया।
- source_word: ይነብር
  choice: निवास करेगा
  rationale: क्रिया का मूल भाव बैठने से अधिक रहने/निवास करने का है; भविष्यकालीन अवतरण के साथ इसका भाव स्वाभाविक रखा गया है।
- source_word: ቅዱስ ወዐቢይ
  choice: पवित्र और महान जन
  rationale: यह स्वतंत्र दैवी उपाधि के रूप में प्रयुक्त है, न कि केवल अगले ‘प्रभु’ के विशेषणों के रूप में। ‘जन’ हिन्दी में व्यक्तिवाचक उपाधि का भाव देता है।
- source_word: እግዚአ ስብሐት
  choice: महिमा का प्रभु
  rationale: दैवी राजकीय उपाधि और ‘महिमा’ की बाइबिलीय प्रतिध्वनि को सुरक्षित रखता है।
- source_word: ንጉሥ ዘለዓለም
  choice: सनातन राजा
  rationale: राजत्व और अनंत काल—दोनों अर्थों को संक्षिप्त, गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: የኀውጻ ለምድር በሠናይ
  choice: पृथ्वी पर भलाई के साथ उसकी सुधि लेने
  rationale: क्रिया में निरीक्षण/भेंट/देखभाल की अर्थ-छाया है और በሠናይ कल्याणकारी ढंग या उद्देश्य दर्शाता है; ‘सुधि लेने’ दयालु दैवी आगमन का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: पर्वत और दैवी सिंहासन का संबंध
  choice: पर्वत को स्पष्ट रूप से ‘उसका सिंहासन’ कहा गया है, जबकि उसकी चोटी प्रभु के सिंहासन के समान बताई गई है।
  alternative: केवल पर्वत की चोटी को सिंहासन मानना, या पर्वत को मात्र सिंहासन का स्थान कहना।
  rationale: 'मूल में तुलना और प्रत्यक्ष पहचान दोनों साथ हैं: चोटी सिंहासन के समान है, और पर्वत ‘उसका सिंहासन’ है। इस तनाव को हल किए बिना दोनों कथन रखे गए हैं।'
- issue: दैवी निवास का काल
  choice: भविष्यकालीन अवतरण से जुड़े निवास के रूप में प्रस्तुत किया गया है।
  alternative: इसे परमेश्वर का वर्तमान और स्थायी निवास बताना।
  rationale: मूल में निवास की क्रिया और ‘जब वह उतरेगा’ वाला भविष्यकालीन उपवाक्य साथ आते हैं; हिन्दी वाक्य-विन्यास इस भाव को स्पष्ट करता है, पर सिंहासन की वर्तमान पहचान को नहीं मिटाता।
- issue: पृथ्वी की दैवी सुधि लेने का स्वरूप
  choice: ‘भलाई के साथ उसकी सुधि लेने’ के रूप में कल्याणकारी आगमन।
  alternative: ‘पृथ्वी का निरीक्षण करने’ या केवल ‘पृथ्वी पर आने’ के रूप में तटस्थ अथवा न्यायिक आगमन।
  rationale: अंतिम በሠናይ आगमन को भलाई से जोड़ता है; फिर भी ‘सुधि लेने’ में देखने/भेंट करने की मूल अर्थ-छाया बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध। दैवी उपाधियों में सम्मान और राजकीय बिंब बनाए गए हैं। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए कालगत उपवाक्य आगे रखा गया है।
