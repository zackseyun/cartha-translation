translation:
  language: hi
  text: उसके फल से चुने हुओं को जीवन दिया जाएगा, और उसे उत्तर की ओर[a] ... पर[b] लगाया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उत्तर दिशा में।’
    reason: दिशा-बोधक पदबंध के निकटवर्ती हिन्दी विकल्प को दर्ज करना।
  - marker: b
    text: उपलब्ध गीज़ पंक्ति यहाँ ‘पर/ऊपर’ अर्थ वाले संबंधबोधक पद पर समाप्त हो जाती है और उसका अपेक्षित पूरक नहीं बचा है; इसलिए वाक्य की अपूर्णता को त्रिबिंदु से दिखाया गया है।
    reason: पाठ इस स्थान पर खंडित अथवा पद-विभाजन के कारण अधूरा है; अनुवाद में लुप्त पूरक की कल्पना नहीं की गई।
lexical_decisions:
- source_word: ፍሬ
  choice: फल
  rationale: वृक्ष के ठोस बिंब को बनाए रखने के लिए इसका सीधा और स्वाभाविक हिन्दी प्रतिशब्द चुना गया है।
- source_word: ይትወሀብ
  choice: दिया जाएगा
  rationale: गीज़ रूप का कर्मवाच्य और भावी अर्थ सुरक्षित रहता है तथा प्रतिज्ञा में अनावश्यक विस्तार नहीं जोड़ा जाता।
- source_word: ኅሩያን
  choice: चुने हुए
  rationale: यह हनोक-साहित्य का एक महत्त्वपूर्ण प्रलय-संबंधी समूह-सूचक पद है। यह रूप स्पष्ट आधुनिक हिन्दी है और बाद की तकनीकी धर्मवैज्ञानिक धारणाएँ आरोपित नहीं करता।
- source_word: ሐይወት
  choice: जीवन
  rationale: मूल में केवल ‘जीवन’ है; संदर्भ में उसका विशिष्ट या भावी अर्थ संभव होने पर भी अनुवाद में ‘अनन्त जीवन’ जैसा विस्तार नहीं किया गया।
- source_word: መንገለ መስዕ
  choice: उत्तर की ओर
  rationale: यह दिशा-बोधक पदबंध है; ‘उत्तर की ओर’ उसके गतिशील/दिशात्मक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ይተከል
  choice: लगाया जाएगा
  rationale: वृक्ष के संदर्भ में हिन्दी का स्वाभाविक कर्मवाच्य प्रयोग है; इसका अर्थ ‘रोपा जाएगा’ भी हो सकता है।
- source_word: ዲበ
  choice: '... पर'
  rationale: यह ‘पर/ऊपर’ अर्थ वाला संबंधबोधक पद है और इसे किसी आधार-वाचक पूरक की आवश्यकता है। उपलब्ध पंक्ति उसी पूरक से पहले कट गई है, इसलिए रिक्ति को त्रिबिंदु से स्पष्ट किया गया है।
theological_decisions:
- issue: ኅሩያን की पहचान
  choice: ‘चुने हुए’—हनोक-साहित्य में भावी जीवन के लिए अलग किए गए लोगों का स्थानीय समूह-सूचक पद
  alternative: बाद की धर्मवैज्ञानिक पारिभाषिकता वाला ‘निर्वाचित जन’, अथवा केवल ‘धर्मी लोग’
  rationale: मूल की चुने जाने की धारणा सुरक्षित रखी गई है, पर उसे किसी बाद की संप्रदायगत निर्वचन-प्रणाली से नहीं बाँधा गया।
- issue: प्रतिज्ञात जीवन का स्वरूप
  choice: मुख्य पाठ में केवल ‘जीवन’
  alternative: ‘अनन्त जीवन’, ‘चंगाई’ या ‘पुनर्स्थापना’
  rationale: संदर्भ जीवन को युगांत-संबंधी या महिमामय अर्थ दे सकता है, किंतु उपलब्ध गीज़ पाठ केवल ‘जीवन’ कहता है; अतः धर्मवैज्ञानिक तनाव को खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण रखी गई है। ‘चुने हुए’ और ‘जीवन’ जैसे प्रमुख पदों को बिना धर्मवैज्ञानिक विस्तार के रखा गया है। अंतिम खंड की व्याकरणिक अपूर्णता को सहज बनाने के लिए कोई अनुमानित स्थान नहीं जोड़ा गया।
