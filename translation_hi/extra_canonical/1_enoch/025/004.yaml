base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/004.yaml
  text: And this fragrant tree—no flesh has authority to touch it until the great judgment[a], when all will be avenged and brought to completion forever[d][c][b]; then it will be given to the righteous and the humble.
translation:
  language: hi
  text: और इस सुगंधित वृक्ष को छूने का अधिकार किसी नश्वर मनुष्य को नहीं है[a], उस महान न्याय तक, जब वह सब पर प्रतिशोध लेगा और सब कुछ सदा के लिए पूर्ण करेगा[b]। वही वृक्ष धर्मियों और विनम्र जनों को दिया जाएगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में शाब्दिक रूप से ‘मांस को अधिकार नहीं’ है; यहाँ ‘मांस’ से आशय नश्वर मनुष्यों से है, किसी पदार्थ के रूप में मांस से नहीं।
    reason: lexical_alternative
  - marker: b
    text: न्याय के बाद वाला वाक्यांश कठिन है। मूल में एकवचन कर्ता निहित है—‘वह सब पर प्रतिशोध लेगा और सब कुछ पूर्ण करेगा’; कर्ता का नाम स्पष्ट नहीं किया गया है, और ‘सब’ व्यक्ति या समस्त विषय दोनों को सूचित कर सकता है।
    reason: textual_ambiguity
  - marker: c
    text: ‘विनम्र जनों’ का अनुवाद ‘दीनों’ या ‘नम्र लोगों’ के रूप में भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ዕፀ መዓዛ
  choice: सुगंधित वृक्ष
  rationale: यह पदबंध सुगंध से पहचाने जाने वाले वृक्ष को दर्शाता है। ‘सुगंधित वृक्ष’ आधुनिक हिन्दी में स्वाभाविक है और ठोस बिंब बनाए रखता है।
- source_word: አልሐዱ
  choice: छूने
  rationale: संदर्भ में क्रिया वृक्ष के साथ शारीरिक संपर्क या उसके उपयोग को सूचित करती है। ‘छूना’ निषेध को सुरक्षित रखता है और खाने का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: ዘሥጋ
  choice: किसी नश्वर मनुष्य को
  rationale: शाब्दिक अर्थ ‘मांस/देह’ है, पर यहाँ यह नश्वर मानवता का द्योतक है। मुख्य पाठ में आशय स्पष्ट किया गया है और शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: ሥልጣነ
  choice: अधिकार
  rationale: यह केवल सामर्थ्य नहीं, बल्कि अधिकृत पहुँच या वैध अनुमति का भाव रखता है; इसलिए ‘अधिकार’ न्यायिक बल को बनाए रखता है।
- source_word: ኵነኔ
  choice: न्याय
  rationale: प्रलय-संबंधी संदर्भ में यह महान अंतिम न्याय को सूचित करता है। ‘न्याय’ व्यापक और प्रसंगानुकूल शब्द है।
- source_word: ይትቤቀል
  choice: वह सबका प्रतिशोध लेगा
  rationale: क्रिया प्रतिशोध लेने अथवा न्यायपूर्ण दंड देने का भाव रखती है। एकवचन कर्ता क्रिया में निहित है, पर उसका स्पष्ट नाम पाठ में नहीं है।
- source_word: ኵሎ
  choice: सबका / सब कुछ
  rationale: मूल शब्द का विस्तार व्यापक है और व्यक्ति अथवा वस्तु दोनों की ओर संकेत कर सकता है। हिन्दी में दोनों क्रियाओं के साथ स्वाभाविक प्रयोग करते हुए इस व्यापकता को रखा गया है।
- source_word: ይፌጽም
  choice: पूर्ण करेगा
  rationale: क्रिया किसी कार्य या समूचे विषय को उसकी पूर्णता तक पहुँचाने का अर्थ देती है। ‘पूर्ण करेगा’ अस्पष्ट कर्म को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ለዓለም
  choice: सदा के लिए
  rationale: यह स्थायी अथवा अनन्त अवधि का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: ጻድቃን
  choice: धर्मियों
  rationale: यह प्रलय-संबंधी साहित्य का प्रमुख पहचान-सूचक पद है; ‘धर्मी’ इसका प्रचलित और स्पष्ट हिन्दी रूप है।
- source_word: ትሑታን
  choice: विनम्र जनों
  rationale: मूल में नम्रता या दीनता का भाव है। ‘विनम्र जन’ आधुनिक पाठक के लिए स्पष्ट है और केवल आर्थिक निर्धनता का अर्थ नहीं देता।
- source_word: ይትወሀብ
  choice: दिया जाएगा
  rationale: भविष्यकालीन कर्मवाच्य मूल व्याकरण और वरदान के भाव दोनों को बनाए रखता है।
- source_word: ዝኩ
  choice: वही वृक्ष
  rationale: यह संकेतवाचक पद ‘वह/वही’ है और पीछे उल्लिखित वृक्ष की ओर लौटता है; ‘वही वृक्ष’ हिन्दी में संदर्भ स्पष्ट करता है, बिना समयसूचक ‘तब’ जोड़ने के।
theological_decisions:
- issue: वृक्ष को छूने पर ‘मांस’ का निषेध
  choice: इसे नश्वर मनुष्यों के लिए निषिद्ध पहुँच के रूप में प्रस्तुत किया गया है।
  alternative: किसी भी देहधारी प्राणी का उस पर अधिकार नहीं; अथवा कोई उससे खा नहीं सकता।
  rationale: मूल का शाब्दिक ‘मांस’ इस संदर्भ में नश्वर मानवता को दर्शाता है। ‘खाना’ पाठ में स्पष्ट नहीं है, इसलिए उसे मुख्य अनुवाद में नहीं जोड़ा गया।
- issue: प्रतिशोध और पूर्णता वाली उपवाक्य का कर्ता
  choice: मूल की एकवचन क्रिया के अनुरूप अनाम ‘वह’ रखा गया है।
  alternative: कर्मवाच्य रूप—‘सबका प्रतिशोध लिया जाएगा’; अथवा कर्ता को स्पष्ट रूप से ‘परमेश्वर’ कहना।
  rationale: क्रिया में एकवचन कर्ता निहित है, पर पद में उसका नाम नहीं दिया गया। ‘वह’ व्याकरणिक संकेत को बचाता है और कर्ता की पहचान पाठ से अधिक स्पष्ट नहीं करता।
- issue: अंतिम संकेतवाचक पद का संबंध
  choice: ‘वही वृक्ष’ को धर्मियों और विनम्र जनों को दिया जाएगा।
  alternative: इसे समयसूचक ‘तब वह’ मानना।
  rationale: ዝኩ संकेतवाचक है, समयसूचक क्रियाविशेषण नहीं। इसे वृक्ष से जोड़ना निकटतम और व्याकरणतः स्वाभाविक संबंध है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। प्रलय-संबंधी न्याय, प्रतिबंधित पवित्र वृक्ष और भावी वरदान के बिंबों को बिना सांप्रदायिक व्याख्या जोड़े सुरक्षित रखा गया है।
