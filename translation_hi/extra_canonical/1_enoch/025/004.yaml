review_pass:
  verdict: revise
  source_fidelity: The rendering accurately preserves the fragrant tree, the restriction on mortal humans, the great judgment, the implicit singular agent, the future gift, and the demonstrative reference back to the tree. However, ‘सबका प्रतिशोध लेगा’ normally means ‘will avenge everyone’ in Hindi, whereas the source/audit trail’s intended force is that the implicit agent takes vengeance upon all. ‘सब पर प्रतिशोध लेगा’ is required for this direction of action.
  naturalness: The Hindi is modern, dignified, and readily intelligible. ‘महान न्याय के दिन तक’ is natural, though ‘उस महान न्याय तक’ stays closer to the source, which names the judgment rather than explicitly calling it a day.
  terminology: ‘सुगंधित वृक्ष,’ ‘नश्वर मनुष्य,’ ‘अधिकार,’ ‘धर्मी,’ and ‘विनम्र जन’ are suitable. ‘वही वृक्ष’ correctly renders the final demonstrative as referring to the tree, rather than introducing an unsupported temporal ‘then.’
  issues:
  - severity: medium
    issue: ‘सबका प्रतिशोध लेगा’ reverses or at least seriously blurs the intended direction of the vengeance.
    rationale: In standard Hindi, ‘X का प्रतिशोध लेना’ commonly means avenging X. To express vengeance executed on all, use ‘सब पर प्रतिशोध लेना/करना.’ This is material to the judgment clause.
  - severity: low
    issue: ‘न्याय के दिन’ adds ‘day.’
    rationale: The source says ‘until the great judgment’; ‘दिन’ is a conventional eschatological expression but is not explicit. Omitting it preserves the wording more closely.
