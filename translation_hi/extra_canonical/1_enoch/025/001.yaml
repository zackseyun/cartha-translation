base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/001.yaml
  text: And he said to me[a], “Enoch, why do you ask about the fragrance of this tree, and inquire so that you may know?”
translation:
  language: hi
  text: और उसने मुझसे कहा, “हनोक, तुम इस पेड़ की सुगंध के विषय में क्यों पूछते हो और जानने के लिए छानबीन करते हो?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይቤለኒ
  choice: उसने मुझसे कहा
  rationale: गीज़ की सामान्य कथात्मक वाणी-भूमिका को सीधे और स्वाभाविक हिन्दी में रखा गया है।
- source_word: ሄኖክ
  choice: हनोक
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है।
- source_word: ምንተ ትስእል
  choice: क्यों पूछते
  rationale: रचना शाब्दिक रूप से ‘क्या’ पर आधारित हो सकती है, पर प्रसंग में यह पूछने के कारण को संबोधित करने वाला मुहावरा है; इसलिए ‘क्यों’ अधिक स्वाभाविक है।
- source_word: በእንተ መዓዛሁ ለዝ ዕፅ
  choice: इस पेड़ की सुगंध के विषय में
  rationale: መዓዛ गंध या सुगंध को सूचित करता है और ዕፅ यहाँ एक विशिष्ट अद्भुत पेड़ है; ‘सुगंध’ दृश्य के सकारात्मक, गरिमामय भाव के अनुकूल है।
- source_word: ወትጠየቅ
  choice: और ... छानबीन करते हो
  rationale: दूसरे प्रश्नवाचक क्रियापद को पहले ‘पूछते’ में विलीन न करके स्रोत की पुनरुक्ति बनाए रखी गई है; ‘छानबीन’ अधिक जानने के लिए पूछताछ का भाव देता है।
- source_word: ከመ ታእምር
  choice: जानने के लिए
  rationale: उद्देश्यवाचक खंड को सहज हिन्दी में व्यक्त करते हुए ज्ञान प्राप्त करने के मूल भाव को सुरक्षित रखा गया है।
theological_decisions:
- issue: स्वर्गदूतीय उत्तर का स्वर
  choice: हनोक की जिज्ञासा के उद्देश्य पर हल्का प्रश्न
  alternative: अनुचित जिज्ञासा के लिए कठोर फटकार, अथवा केवल स्पष्टीकरण माँगना
  rationale: दो प्रश्नवाचक क्रियाओं और उद्देश्यवाचक खंड से वक्ता हनोक की प्रेरणा को सामने लाता है; पाठ स्वयं निंदा या कठोर फटकार स्पष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमामय किंतु सामान्य पाठक के लिए सहज रखी गई है। स्रोत की दोहरी प्रश्न-क्रिया को ‘पूछते’ और ‘छानबीन करते’ द्वारा बचाया गया है।
