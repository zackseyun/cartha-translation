base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/053/003.yaml
  text: For I saw all the angels of punishment lodging there and preparing all the instruments of Satan[a][b][c].
translation:
  language: hi
  text: क्योंकि मैंने दण्ड के सभी स्वर्गदूतों को वहाँ ठहरे हुए[b] और शैतान के सारे उपकरण[a][c] तैयार करते देखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद की उपलब्ध गीइज़ OCR प्रतिलिपि ‘और तैयार…’ के बाद अधूरी है। परन्तु पूर्णतर गीइज़ पाठ में ‘शैतान के सारे उपकरण’ पढ़ा जाता है।
    reason: textual_variant
  - marker: b
    text: या ‘वहाँ रहते हुए’। मूल गीइज़ क्रिया किसी स्थान पर रहने, टिकने या ठहरने का भाव देती है।
    reason: lexical_alternative
  - marker: c
    text: 'एक पूर्ववर्ती संक्षिप्त अनुवाद: ‘शैतान के उपकरण तैयार करते’। पूर्णतर गीइज़ पाठ में ‘सारे’ भी है।'
    reason: previous_rendering
lexical_decisions:
- source_word: እስመ
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ इस संयोजक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: ርኢክዎሙ
  choice: मैंने … देखा
  rationale: दर्शन का प्रथम-पुरुष वर्णन है। कर्म को आगे आनेवाले पदबंध से स्पष्ट करके हिन्दी की स्वाभाविक वाक्य-रचना अपनाई गई है।
- source_word: ኵሎሙ
  choice: सभी
  rationale: स्वर्गदूतों की समग्रता को बनाए रखता है।
- source_word: መላእክተ መቅሠፍት
  choice: दण्ड के स्वर्गदूत
  rationale: 'सम्बन्धकारक पदबंध को यथासम्भव खुला रखा गया है: ये दण्ड से सम्बद्ध स्वर्गदूत हैं; अनुवाद उन्हें केवल ‘दण्ड देनेवाले’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।'
- source_word: እንዘ የኃድሩ
  choice: वहाँ ठहरे हुए
  rationale: क्रिया किसी स्थान पर रहने या टिके रहने को दर्शाती है। ‘ठहरे हुए’ अस्थायी अथवा स्थायी निवास का निर्णय किए बिना ठोस स्थानगत अर्थ देता है।
- source_word: ወያስተዴ(ልዉ)
  choice: तैयार करते
  rationale: उपलब्ध पंक्ति का अंतिम रूप अपूर्ण है, पर क्रिया तैयारी या व्यवस्थित करने का भाव देती है। ‘तैयार करते’ प्रसंग के अनुकूल और सामान्य पाठक के लिए स्पष्ट है।
- source_word: ኵሎ ንዋየ ሰይጣን
  choice: शैतान के सारे उपकरण
  rationale: समीक्षा में उद्धृत पूर्णतर गीइज़ पाठ के अनुसार ‘सारे’ परिमाण और ‘शैतान के उपकरण’ कर्म को सुरक्षित रखा गया है; उपलब्ध प्रतिलिखित पंक्ति में यह अंश दिखाई नहीं देता, इसलिए इसे टिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: स्वर्गदूतों द्वारा तैयार की जा रही वस्तु उपलब्ध गीइज़ प्रतिलिपि में अनुपस्थित है
  choice: मुख्य पाठ में ‘शैतान के सारे उपकरण’ रखना और पाठगत स्थिति को पादटिप्पणी में स्पष्ट करना
  alternative: वाक्य को केवल ‘और तैयार करते’ पर अधूरा छोड़ना
  rationale: दिए गए प्रतिलिपित स्रोत की पंक्ति क्रिया के बाद कटी हुई है, जबकि उपलब्ध समीक्षा-साक्ष्य पूर्णतर पाठ ኵሎ ንዋየ ሰይጣን (‘शैतान के सारे उपकरण’) उद्धृत करता है। पठनीय पाठ देने के साथ अनिश्चितता छिपाई नहीं गई है।
- issue: መላእክተ መቅሠፍት में स्वर्गदूतों और दण्ड का सम्बन्ध
  choice: ‘दण्ड के स्वर्गदूत’
  alternative: ‘दण्ड देनेवाले स्वर्गदूत’
  rationale: सम्बन्धकारक संरचना को बनाए रखने से यह अनावश्यक रूप से निश्चित नहीं किया जाता कि दण्ड उनका गुण, कार्य या क्षेत्र है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। ‘दण्ड’, ‘स्वर्गदूत’ और ‘शैतान’ जैसे परिचित धार्मिक शब्द प्रयुक्त हैं। वाक्य को हिन्दी की स्वाभाविक क्रम-रचना में रखा गया है, जबकि पाठगत अपूर्णता और सम्बन्धकारक पदबंध की वास्तविक अस्पष्टता पादटिप्पणी तथा शब्द-चयन में सुरक्षित है।
