base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/053/001.yaml
  text: There my eyes saw a valley whose mouths were open and deep; and all who dwell on the dry land and the sea and the islands will bring gifts and offerings and presents to it, yet that deep valley will not be filled.
translation:
  language: hi
  text: वहाँ मेरी आँखों ने एक ऐसी घाटी देखी, जिसके मुँह खुले और गहरे थे[a]; और जो लोग सूखी भूमि, समुद्र और द्वीपों पर रहते हैं, वे उसके पास भेंटें, चढ़ावे और उपहार लाएँगे[b]; फिर भी वह गहरी घाटी नहीं भरेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ वाक्यांश कठिन है। शाब्दिक छवि घाटी के ‘मुँहों’ की है, जिन्हें खुला और गहरा कहा गया है; इसका आशय उसके गहरे, खुले मुखों या प्रवेश-विवरों से हो सकता है।
    reason: textual_variant
  - marker: b
    text: ‘भेंटें, चढ़ावे और उपहार’ के लिए प्रयुक्त तीनों शब्द इस प्रसंग में निकटार्थक हैं और संसार के सब क्षेत्रों से लाई जाने वाली कर-सदृश भेंटों को सूचित कर सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: በህየ
  choice: वहाँ
  rationale: यह स्थानसूचक क्रियाविशेषण दर्शन के अगले दृश्य का परिचय देता है; ‘वहाँ’ उसके संकेतात्मक बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: ርእያ አዕይንትየ
  choice: मेरी आँखों ने ... देखी
  rationale: स्रोत में आँखों का स्पष्ट और कुछ बलाघातयुक्त उल्लेख है; इसे केवल ‘मैंने देखा’ कर देने के बजाय दर्शनीय शैली सुरक्षित रखी गई है।
- source_word: ቈላ
  choice: घाटी
  rationale: यह शब्द घाटी-जैसे गहरे स्थल या खड्ड को सूचित कर सकता है; ‘घाटी’ व्यापक और कम व्याख्यात्मक विकल्प है।
- source_word: ርኁወ ወዕሙቀ አፈዊሁ
  choice: जिसके मुँह खुले और गहरे थे
  rationale: ‘खुले’ और ‘गहरे’ स्रोत में समन्वित हैं, और ‘मुँह’ घाटी के मुखों या प्रवेश-विवरों की सजीव रूपक-छवि बनाए रखता है।
- source_word: ዲበ የብስ ወባሕር ወደሰያት
  choice: सूखी भूमि, समुद्र और द्वीपों पर
  rationale: यह भौगोलिक त्रयी सर्वव्यापकता व्यक्त करती है; ‘सूखी भूमि’ समुद्र के साथ मूल विरोध को स्पष्ट रखती है।
- source_word: አምኃ ወአስካዓ ወጋዳ
  choice: भेंटें, चढ़ावे और उपहार
  rationale: तीन निकटार्थक संज्ञाओं की संचयी शैली को तीन अलग लेकिन संबंधित हिन्दी शब्दों द्वारा सुरक्षित रखा गया है।
- source_word: ይመጽኡ ሎቱ
  choice: उसके पास ... लाएँगे
  rationale: मूल क्रिया का आधारभूत अर्थ ‘आना’ है, पर सूचीबद्ध वस्तुओं के साथ प्रसंगगत अर्थ ‘लेकर आना’ है; ‘उसके पास लाएँगे’ गति और वस्तुओं, दोनों को स्पष्ट करता है।
- source_word: ወዝኩስ ዕሙቅ ቈላ ኢይመልእ
  choice: फिर भी वह गहरी घाटी नहीं भरेगी
  rationale: यह घाटी के न भरने की अशुभ भावी छवि को सरल क्रियात्मक बल के साथ सुरक्षित रखता है।
theological_decisions:
- issue: भूमि, समुद्र और द्वीपों के निवासी घाटी के पास क्या लाते हैं
  choice: वे ठोस भेंटें, चढ़ावे और उपहार घाटी के पास लाते हैं
  alternative: वे केवल उसकी ओर आते हैं, अथवा ये वस्तुएँ रूपकात्मक श्रद्धांजलि हैं
  rationale: भौगोलिक त्रयी के बाद तीन वस्तुवाचक संज्ञाएँ और फिर गति की क्रिया आती है। न्याय-दर्शन की कठोर छवि को बिना रूपकात्मक बनाए वस्तुगत चढ़ावे के रूप में रखना स्रोत के अधिक निकट है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और दर्शनीय शैली रखी गई है। असामान्य ‘घाटी के मुँह’ रूपक को उसकी वास्तविक स्रोतगत अस्पष्टता सहित सुरक्षित रखा गया है; फुटनोट उसका संभावित अर्थ बताता है, पर मुख्य पाठ उसे सामान्यीकृत करके ‘प्रवेश-द्वार’ नहीं बनाता।
