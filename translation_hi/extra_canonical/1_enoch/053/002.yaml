base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/053/002.yaml
  text: And their hands commit lawless deeds[a], and all who support their lawless deeds the sinners devour. And the sinners shall be destroyed from before the Lord of Spirits, and from the face of his earth they shall be uprooted[d][c][b], and they shall not remain forever and ever.
translation:
  language: hi
  text: और उनके हाथ अधर्म के काम करते हैं[a], और पापी उन सबको निगल जाते हैं जिन्हें वे अन्याय से सताते हैं। तब पापी आत्माओं के प्रभु के सामने से नष्ट कर दिए जाएँगे, और उसकी धरती पर से जड़ समेत उखाड़ दिए जाएँगे[b]; वे युगानुयुग बने नहीं रहेंगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पंक्ति का गीइज़ पाठ कठिन है। इसे ‘और मेरी बेड़ियाँ उनके हाथों के लिए होंगी कि वे बंधन बनाएँ’ के समान भी समझा गया है; उस पाठ में आगे पापियों द्वारा उन बेड़ियों को ‘खाने’ का विचित्र बिंब आता है।
    reason: lexical_alternative
  - marker: b
    text: 'प्रेषित पाठ में यहाँ ऐसा रूप है जिसका शाब्दिक अर्थ संदर्भ से मेल नहीं खाता; संभवतः यह प्रतिलिपि या OCR की त्रुटि है। संभावित मूल क्रिया का अर्थ ‘उखाड़ दिए जाएँगे’ है। अन्य अनुवाद: ‘निकाल दिए जाएँगे’ या ‘निर्वासित कर दिए जाएँगे’।'
    reason: textual_variant
  - marker: c
    text: नकारात्मक अव्यय पांडुलिपि-प्रतिलेखन में अनिश्चित है। नकार सहित अधिक शाब्दिक अर्थ है, ‘वे युगानुयुग बने नहीं रहेंगे’; भावानुवाद हो सकता है, ‘वे सदा के लिए नष्ट हो जाएँगे’।
    reason: textual_variant
lexical_decisions:
- source_word: ጌጋየ፡ እደዊሆሙ፡ ይገብሩ
  choice: उनके हाथ अधर्म के काम करते हैं
  rationale: पाठ कठिन और संभवतः दूषित है। प्रसंग में ጌጋ को अपराध/अधर्म के अर्थ में लेकर वाक्य को स्वाभाविक हिन्दी में रखा गया है; ‘हाथ’ की ठोस छवि और ‘करना’ क्रिया दोनों सुरक्षित हैं।
- source_word: ወኵሎ፡ ዘይጻምዉ፡ ለጌጋይ፡ ኃጥኣን፡ ይበልዑ
  choice: और पापी उन सबको निगल जाते हैं जिन्हें वे अन्याय से सताते हैं
  rationale: खंड की गीइज़ वाक्यरचना और शब्द-पाठ अनिश्चित हैं। ‘निगल जाते हैं’ ይበልዑ के मूल ‘खाना’ अर्थ को बनाए रखते हुए हिंसक शोषण का स्वाभाविक हिन्दी बिंब देता है। वैकल्पिक समझ को पादटिप्पणी में रखा गया है।
- source_word: እምገጸ፡ ለእግዚአ፡ መነፈሳት
  choice: आत्माओं के प्रभु के सामने से
  rationale: यह 1 हनोक का विशिष्ट ईश्वरीय संबोधन और उपस्थिति से निष्कासन का सूत्र है। ‘के सामने से’ स्रोत के ‘मुख/उपस्थिति’ संबंधी बिंब को सहज हिन्दी में व्यक्त करता है।
- source_word: ይትሐጐሉ
  choice: नष्ट कर दिए जाएँगे
  rationale: क्रिया दंडस्वरूप हटाए या मिटाए जाने का भाव देती है। प्रसंग में ‘नष्ट’ उपयुक्त है, पर इसके द्वारा विनाश की दार्शनिक प्रकृति को परिभाषित नहीं किया गया।
- source_word: እምገጸ፡ ምድረ፡ ዚአሁ፡ ይትቀወሙ
  choice: उसकी धरती पर से जड़ समेत उखाड़ दिए जाएँगे
  rationale: प्रेषित पाठ का ይትቀወሙ संभवतः लिप्यंतरण/OCR-दोष है और अभिप्रेत पाठ ‘उखाड़े जाना’ है। ‘जड़ समेत’ हिन्दी में उखाड़े जाने की ठोस और अंतिम छवि को स्पष्ट करता है।
- source_word: ወ[ኢ]ያነልቁ፡ ለዓለመ፡ ዓለም
  choice: वे युगानुयुग बने नहीं रहेंगे
  rationale: कोष्ठक में दिया नकारात्मक अव्यय पाठगत अनिश्चितता दर्शाता है। मुख्य पाठ नकार सहित अधिक शाब्दिक अर्थ रखता है और इसे ‘सदा के लिए नष्ट हो जाएँगे’ कहकर तात्त्विक प्रश्न को समय से पहले हल नहीं करता।
theological_decisions:
- issue: अंतिम न्याय में पापियों की दशा
  choice: वे परमेश्वर की उपस्थिति और उसकी धरती से स्थायी रूप से हटा दिए जाएँगे तथा युगानुयुग बने नहीं रहेंगे।
  alternative: यह वाक्य पूर्ण विनाश के बजाय धरती से स्थायी निष्कासन पर बल दे सकता है।
  rationale: पाठ अंतिम और अपरिवर्तनीय न्याय बताता है, किंतु उस न्याय की तात्त्विक प्रकृति स्पष्ट नहीं करता। इसलिए अनन्त विनाश अथवा केवल निष्कासन में से किसी एक को निर्णायक रूप से नहीं थोपा गया।
- issue: ‘आत्माओं के प्रभु’ उपाधि
  choice: आत्माओं के प्रभु
  alternative: आत्मिक प्राणियों के प्रभु
  rationale: मूल उपाधि को संक्षिप्त और पारंपरिक रूप में रखा गया है; ‘आत्माओं’ का आशय केवल मनुष्यों या केवल स्वर्गदूतों तक सीमित नहीं किया गया।
