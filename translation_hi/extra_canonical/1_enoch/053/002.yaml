  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘निगल जाते हैं’, ‘जड़ समेत उखाड़ दिए जाएँगे’ और ‘युगानुयुग’ जैसे पद मूल के प्रलय-दर्शी, ठोस बिंबों को बनाए रखते हैं। कठिन आरंभिक पंक्ति को मुख्य पाठ में प्रसंगानुकूल अर्थ दिया गया है, जबकि बेड़ियों वाला वास्तविक पाठ-विकल्प पादटिप्पणी में स्पष्ट रूप से सुरक्षित है।
