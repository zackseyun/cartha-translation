  text: And from there I went toward the east to the ends of heaven[a], and I saw three open portals of heaven toward the east[b], and above them small portals.
translation:
  language: hi
  text: 'और वहाँ से मैं पृथ्वी के छोरों पर दक्षिण की ओर गया। वहाँ मैंने आकाश के तीन खुले द्वार देखे, और वहाँ से दक्षिणी हवा, ओस, वर्षा और पवन निकलते हैं। फिर वहाँ से मैं आकाश के छोरों पर पूरब[a] की ओर गया। वहाँ मैंने पूरब की ओर आकाश के तीन खुले द्वार देखे, और उनके ऊपर छोटे-छोटे द्वार थे। इन छोटे द्वारों में से हर एक से आकाश के तारे होकर गुजरते हैं और उस मार्ग से पश्चिम की ओर जाते हैं जो उन्हें दिखाया गया है।


    जब मैंने यह देखा, तो मैंने स्तुति की; और मैं हर समय महिमा के प्रभु को धन्य कहता हूँ, जिसने महान और महिमामय अद्भुत कार्य किए हैं, ताकि वह अपने स्वर्गदूतों और मनुष्यों की आत्माओं को अपने कार्य की महानता दिखाए, जिससे वे उसके कार्य और उसके सभी कामों की स्तुति करें, उसकी शक्ति के कार्यों को देखें, उसके हाथों के महान कार्य की प्रशंसा करें और उसे सदा-सर्वदा धन्य कहें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ मूल शब्द का शाब्दिक संबंध ‘भोर’ से है और दिशासूचक अर्थ ‘पूरब’ है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: አዜብ
  choice: दक्षिण / दक्षिणी हवा
  rationale: स्थान-सूचक प्रयोग में यह शब्द ‘दक्षिण’ बताता है, जबकि आगे निर्गत प्राकृतिक शक्तियों की सूची में इसका वायुगत अर्थ ‘दक्षिणी हवा’ उपयुक्त है। दोनों प्रयोगों को संदर्भानुसार अलग रूप दिया गया है।
- source_word: ጽባሕ
  choice: पूरब
  rationale: शब्द का मूल संबंध भोर से है, पर दिशासूचक प्रसंग में इसका अर्थ ‘पूरब’ है। आधुनिक हिन्दी में यही स्वाभाविक और स्पष्ट रूप है।
- source_word: ኀዋኅወ ሰማይ
  choice: आकाश के द्वार
  rationale: दर्शनीय ब्रह्मांडीय संरचना को बिना रूपक को समझाए सीधे ‘आकाश के द्वार’ कहा गया है।
- source_word: ነፋስ
  choice: पवन
  rationale: प्राकृतिक शक्तियों की सूची में गरिमापूर्ण किंतु सामान्य हिन्दी शब्द चुना गया है; इससे पहले आए አዜብ के विशिष्ट ‘दक्षिणी हवा’ अर्थ से भेद भी बना रहता है।
- source_word: እግዚአ ስብሐት
  choice: महिमा का प्रभु
  rationale: संबंधवाची संरचना का औपचारिक अर्थ बनाए रखा गया है और किसी विशिष्ट सांप्रदायिक उपाधि को नहीं जोड़ा गया।
- source_word: ነፍሳተ ሰብእ
  choice: मनुष्यों के प्राण
  rationale: ‘मनुष्यों की आत्माएँ’ भी संभव है, पर ‘प्राण’ मूल के व्यापक जीव/आत्म-संबंधी अर्थ को बनाए रखते हुए संदर्भ की अनिश्चितता को कम नहीं करता।
theological_decisions:
- issue: परमेश्वर के कार्य मनुष्यों और स्वर्गदूतों को दिखाने का उद्देश्य
  choice: ‘ताकि… दिखाए, जिससे वे… स्तुति करें’
  alternative: उद्देश्य और परिणाम को एक ही स्वतंत्र व्याख्यात्मक वाक्य में मिला देना
  rationale: मूल के उद्देश्यसूचक उपवाक्यों की शृंखला बनाए रखी गई है, ताकि प्रकाशन, दर्शन और स्तुति के बीच का संबंध व्याख्या द्वारा अधिक निश्चित न किया जाए।
- issue: ‘महिमा के प्रभु’ की पहचान
  choice: मूल उपाधि को यथावत रखना
  alternative: ‘परमेश्वर’ या किसी अधिक विशिष्ट ईश्वरीय नाम से बदलना
  rationale: मूल पाठ की उपाधि पर्याप्त स्पष्ट है; अधिक विशिष्ट नाम जोड़ना पाठ से परे धार्मिक निर्धारण होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय शैली रखी गई है। लंबे समापन वाक्य की मूल स्तुतिपरक गति सुरक्षित है, पर हिन्दी की स्पष्टता के लिए विराम-चिह्न लगाए गए हैं। उपलब्ध गीइज़ पाठ अंग्रेज़ी परामर्श-पाठ से कहीं अधिक विस्तृत है और आरंभ में पहले दक्षिण, फिर पूरब की यात्रा बताता है; अनुवाद पूर्ण गीइज़ साक्ष्य का अनुसरण करता है।
