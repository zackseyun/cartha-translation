base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/036/001.yaml
  text: And from there I went toward the south[a], to the ends of the earth; and there I saw three open portals of heaven, and from there come out the south wind, and dew, and rain[c][b], and wind.
translation:
  language: hi
  text: फिर मैं वहाँ से दक्षिण की ओर, पृथ्वी के छोरों तक गया। वहाँ मैंने आकाश के तीन खुले द्वार[a] देखे; उन्हीं से दक्षिणी हवा, ओस[b], वर्षा और हवा निकलती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह दर्शन में दिखाई देने वाले ब्रह्मांडीय भूगोल की छवि है: आकाश में ऐसे द्वार माने गए हैं जिनसे मौसम के तत्त्व निकलते हैं।'
    reason: cultural_note
  - marker: b
    text: या संभवतः ‘धुंध’; मूल शब्द का सामान्य और अधिक विशिष्ट अर्थ ‘ओस’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እምህየ
  choice: वहाँ से
  rationale: यह गीइज़ में सामान्य कथात्मक संक्रमण है और दर्शी की एक स्थान से दूसरे स्थान की गति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ሖርኩ
  choice: मैं ... गया
  rationale: प्रथम पुरुष के साधारण गतिवाचक क्रिया-रूप को बिना अनावश्यक विस्तार के सीधा रखा गया है।
- source_word: መንገለ አዜብ
  choice: दक्षिण की ओर
  rationale: वाक्यांश दिशा बताता है; यह अनुवाद भौगोलिक संकेत को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: በአጽናፈ ምድር
  choice: पृथ्वी के छोरों तक
  rationale: दर्शनीय और ब्रह्मांडीय भूगोल की छवि को समतल किए बिना आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ሠለስተ ኆዋኅወ ሰማይ ርኁዋተ
  choice: आकाश के तीन खुले द्वार
  rationale: मूल में आकाश के खुले हुए मार्गों या द्वारों की स्थापत्यात्मक छवि है। ‘द्वार’ साधारण पाठक के लिए स्पष्ट रहते हुए उस छवि को सुरक्षित रखता है।
- source_word: ወይወፅእ እምህየ
  choice: उन्हीं से ... निकलती हैं
  rationale: वर्तमानकालिक वर्णन इन प्राकृतिक तत्त्वों के नियमित रूप से उन द्वारों से निकलने का भाव देता है।
- source_word: አዜብ
  choice: दक्षिणी हवा
  rationale: यहाँ शब्द मौसम-संबंधी तत्त्वों की सूची में है, इसलिए दिशासूचक ‘दक्षिण’ के बजाय ‘दक्षिणी हवा’ प्रसंगानुकूल है।
- source_word: ጠል
  choice: ओस
  rationale: इस शब्द का विशिष्ट और सामान्य अर्थ ‘ओस’ है; ‘कुहरा’ संभव व्यापक विकल्प है, पर वह प्राचीन मौसम-वर्गीकरण को कम स्पष्ट कर सकता है।
- source_word: ዝናም
  choice: वर्षा
  rationale: मूल मौसम-संबंधी संज्ञा का सीधा और dignified आधुनिक हिन्दी समतुल्य है।
- source_word: ነፋስ
  choice: हवा
  rationale: इस मौसम-संबंधी सूची में भौतिक हवा अभिप्रेत है, ‘आत्मा’ नहीं। मूल में ‘दक्षिणी हवा’ से अलग अंत में आए सामान्य ‘हवा’ को भी बनाए रखा गया है।
theological_decisions:
- issue: आकाश के द्वारों की ब्रह्मांडीय छवि
  choice: आकाश के तीन खुले द्वार
  alternative: आकाश के तीन खुले मार्ग / झरोखे
  rationale: पद दर्शनीय ब्रह्मांड-रचना में मौसम के निकलने के लिए आकाश में संरचित द्वारों की कल्पना करता है। इसे केवल रूपक मानकर हल्का नहीं किया गया और न ही किसी बाद की धर्मशास्त्रीय व्यवस्था से समझाया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘दक्षिणी हवा ... और हवा’ की पुनरुक्ति शैलीगत रूप से असामान्य लग सकती है, पर मूल पाठ दोनों को अलग-अलग सूचीबद्ध करता है, इसलिए उस तनाव को सुरक्षित रखा गया है।
