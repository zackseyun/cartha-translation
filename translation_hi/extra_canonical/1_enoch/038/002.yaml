base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/038/002.yaml
  text: And when righteousness appears on the faces of the righteous[a], the chosen, whose deeds hang upon the Lord of Spirits, and light will appear to the righteous and to the chosen who dwell on the dry ground, where then is the dwelling of sinners[d][c][b], and where the resting place of those who denied the Lord of Spirits? It would have been better for them had they not been born.
translation:
  language: hi
  text: और जब धर्मियों और चुने हुओं के चेहरों पर धार्मिकता प्रकट होगी—जिनके कर्म आत्माओं के प्रभु पर लटके हुए हैं[a]—और सूखी भूमि[b] पर रहनेवाले धर्मियों और चुने हुओं के लिए प्रकाश प्रकट होगा, तब पापियों का निवास कहाँ होगा, और जिन्होंने आत्माओं के प्रभु का इनकार किया, उनका विश्राम-स्थान कहाँ होगा? उनके लिए अच्छा होता, यदि वे जन्मे ही न होते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह वाक्यांश कठिन है। इसका अर्थ यह भी हो सकता है कि उनके कर्म आत्माओं के प्रभु पर निर्भर हैं या उसके सामने थामे हुए हैं।
    reason: lexical_alternative
  - marker: b
    text: ‘सूखी भूमि’ मूल का ठोस रूप है; संभवतः इससे ब्रह्मांडीय जल के विपरीत मनुष्यों द्वारा बसी हुई धरती का आशय है।
    reason: cultural_note
lexical_decisions:
- source_word: ያስተርኢ
  choice: प्रकट होगी / प्रकट होगा
  rationale: 'दोनों स्थानों पर क्रिया को अकर्मक रूप में रखा गया है: धार्मिकता और प्रकाश उसके कर्ता हैं। इससे गीइज़ की पुनरावृत्ति और दर्शनात्मक भाव सुरक्षित रहता है।'
- source_word: ጽድቅ
  choice: धार्मिकता
  rationale: यहाँ शब्द नैतिक खराई और धर्मियों के प्रकट समर्थन—दोनों की ओर संकेत कर सकता है; ‘धार्मिकता’ इस प्रमुख हनोकिक पद को सुरक्षित रखता है।
- source_word: በገጾሙ
  choice: के चेहरों पर
  rationale: दृश्य और देहगत बिंब को अमूर्त किए बिना शाब्दिक अर्थ सुरक्षित रखा गया है।
- source_word: ጻድቃን
  choice: धर्मी जनों / धर्मियों
  rationale: आधुनिक हिन्दी में स्पष्ट और इस पद के धार्मिकता-संबंधी शब्द-समूह के अनुरूप।
- source_word: ኅሩያን
  choice: चुने हुए
  rationale: समूह-संज्ञा का सरल आधुनिक रूप; बाद की परंपराओं से जुड़ी अधिक तकनीकी शब्दावली से बचता है।
- source_word: ተግባሮሙ ስቁል በእግዚአ መናፍስት
  choice: जिनके काम आत्माओं के प्रभु पर टिके हुए हैं
  rationale: ‘लटके हुए’ के कठिन ठोस रूपक को हिन्दी में समझने योग्य ‘टिके हुए’ से व्यक्त किया गया है, पर निर्भरता अथवा प्रभु के सामने थामे जाने के बीच की अस्पष्टता पूर्णतः समाप्त नहीं की गई।
- source_word: ብርሃን
  choice: प्रकाश
  rationale: मूल अर्थ और दर्शनात्मक-धार्मिक अनुगूंज दोनों को सहज हिन्दी में रखता है।
- source_word: የኃድሩ ዲበ የብስ
  choice: सूखी भूमि पर रहनेवाले
  rationale: ‘पृथ्वी’ कहकर ब्रह्मांडीय बिंब को सपाट करने के बजाय सूखी भूमि का ठोस उल्लेख रखा गया है।
- source_word: መኃደሪ
  choice: निवास
  rationale: पापियों के रहने के स्थान से संबंधित प्रश्न का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ምዕራፎሙ
  choice: विश्राम का स्थान
  rationale: ‘निवास’ के समानांतर इसकी स्थानवाचक और विश्राम-संबंधी शक्ति सुरक्षित रहती है।
- source_word: ክሕድዎ
  choice: इनकार किया
  rationale: आत्माओं के प्रभु को प्रत्यक्ष कर्म के रूप में लेने वाली न्यायिक-धार्मिक गंभीरता सुरक्षित रखता है।
- source_word: እምኃየሶሙ ሶበ ኢተወልዱ
  choice: उनके लिए अच्छा होता यदि वे जन्मे ही न होते
  rationale: कठोर प्रतिकल्पित न्याय-वाक्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: चुने हुओं के कामों के विषय में कठिन वाक्यांश
  choice: ‘जिनके काम आत्माओं के प्रभु पर टिके हुए हैं’
  alternative: ‘जिनके काम आत्माओं के प्रभु पर निर्भर हैं’ अथवा ‘जिनके काम उसके सामने थामे हुए हैं’
  rationale: मूल का रूपक असामान्य है और उसका सटीक संबंध अनिश्चित है। मुख्य पाठ उसे सामान्य धार्मिक कथन में पूरी तरह नहीं बदलता; पादटिप्पणी विकल्प बताती है।
- issue: ‘सूखी भूमि’ का आशय
  choice: ठोस बिंब ‘सूखी भूमि’ बनाए रखा
  alternative: ‘पृथ्वी’ अथवा ‘देश’
  rationale: संभवतः इसका आशय जल के विपरीत बसी हुई दुनिया है, पर दर्शन की ब्रह्मांडीय बनावट को सपाट करने से बचना उचित है।
- issue: दूसरे ያስተርኢ में प्रकाश की व्याकरणिक भूमिका
  choice: ‘प्रकाश प्रकट होगा’
  alternative: ‘वह प्रकाश दिखाएगा’
  rationale: ብርሃን कर्ता के रूप में समझा गया है और क्रिया का अर्थ ‘प्रकट होना/दिखाई देना’ लिया गया है; इससे अनावश्यक दैवी कर्ता नहीं जोड़ा जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘आत्माओं का प्रभु’ उपाधि को स्थिर रखा गया है। लंबे मूल वाक्य को दृश्य-प्रवाह स्पष्ट करने के लिए दो वाक्यों में बाँटा गया, जबकि भविष्यकालीन न्याय-दृश्य और मूल की कठिन अस्पष्टताएँ सुरक्षित रखी गई हैं।
