  text: When the hidden things of the righteous are revealed, sinners will be judged, and the wicked will be driven away from the face of the righteous and the chosen.
translation:
  language: hi
  text: जब धर्मियों की छिपी हुई बातें प्रकट की जाएँगी[a], तब पापियों का न्याय किया जाएगा, और दुष्ट लोग धर्मियों और चुने हुओं के सामने से खदेड़ दिए जाएँगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धर्मियों के रहस्य।” गीज़ शब्द छिपी हुई वस्तुओं या बातों को सूचित कर सकता है, पर पद यह नहीं बताता कि वे कर्म, वास्तविक पहचान अथवा उनके निर्दोष ठहराए जाने के आधार हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “धर्मियों और चुने हुओं के मुख के सामने से”; न्याय-दृश्यों में यह उनकी उपस्थिति से बाहर कर दिए जाने का भाव देता है।
    reason: cultural_note
lexical_decisions:
- source_word: ሶበ
  choice: जब ... तब
  rationale: गीज़ का कालवाचक संयोजक शर्त-सदृश समय-वाक्य आरम्भ करता है; हिन्दी में ‘जब ... तब’ उसकी प्रस्तावना और परिणाम की संरचना स्पष्ट रखता है।
- source_word: ይትከሠት
  choice: प्रकट की जाएँगी
  rationale: कर्मवाच्य अर्थ और भावी न्याय-दृश्य सुरक्षित रहते हैं।
- source_word: ኅቡኣቲሆሙ ለጻድቃን
  choice: धर्मियों की छिपी हुई बातें
  rationale: बहुवचन और संबंधसूचक रचना को बनाए रखता है, पर यह तय नहीं करता कि वे बातें कर्म, रहस्य या उनके निर्दोष ठहराए जाने के आधार हैं।
- source_word: ይትኴነኑ ኃጥኣን
  choice: पापियों का न्याय किया जाएगा
  rationale: न्यायिक कर्मवाच्य को व्यक्त करता है और मुख्य पाठ में ‘दोषी ठहराए जाएँगे’ जैसा अधिक निर्णायक परिणाम नहीं जोड़ता।
- source_word: ይትሀወዙ ረስዓን
  choice: दुष्ट लोग ... खदेड़ दिए जाएँगे
  rationale: क्रिया में निहित बलपूर्वक हटाए जाने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: እምገጸ
  choice: के सामने से
  rationale: शाब्दिक ‘मुख के सामने से’ की स्थानिक और उपस्थिति-संबंधी छवि को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ጻድቃን ወኅሩያን
  choice: धर्मियों और चुने हुओं
  rationale: नैतिक विरोध और परमेश्वर द्वारा चुने गए समुदाय की श्रेणी को सरल, गरिमापूर्ण हिन्दी में रखता है।
theological_decisions:
- issue: धर्मियों से संबंधित छिपी वास्तविकता का आशय
  choice: धर्मियों की छिपी हुई बातें
  alternative: धर्मियों के रहस्य; धर्मियों में छिपे हुए लोग
  rationale: गीज़ बहुवचन किसी एक संकीर्ण अर्थ को अनिवार्य नहीं करता; चुना हुआ रूप कर्मों, वास्तविक पहचान या निर्दोष ठहराए जाने के आधार के बीच की अस्पष्टता बनाए रखता है।
- issue: अंतिम बहिष्कार-वाक्य का बल
  choice: धर्मियों और चुने हुओं के सामने से खदेड़ दिए जाएँगे
  alternative: धर्मियों और चुने हुओं की उपस्थिति से हटा दिए जाएँगे
  rationale: यह केवल लज्जित होने के बजाय न्याय के अंतर्गत बलपूर्वक उपस्थिति से दूर किए जाने की स्थानिक छवि सुरक्षित रखता है।
- issue: न्याय का परिणाम
  choice: न्याय किया जाएगा
  alternative: दोषी ठहराया जाएगा
  rationale: मूल क्रिया न्यायिक प्रक्रिया बताती है; मुख्य पाठ में उसके परिणाम को आवश्यकता से अधिक निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज किंतु गरिमापूर्ण है। ‘धर्मी’, ‘पापी’, ‘दुष्ट’ और ‘चुने हुए’ जैसे परिचित धार्मिक-नैतिक पद रखे गए हैं। ‘जब ... तब’ मूल कालवाचक संरचना को स्पष्ट करता है, और दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
