  verdict: approve
  source_fidelity: 'The Hindi accurately reflects the Ge''ez predicate construction: those who hold/possess the earth will no longer be mighty and exalted, rather than necessarily ceasing to exist. It preserves the concrete ‘face’ imagery, the inability to look upon the holy ones, and the Lord of Spirits’ light appearing on the faces of the holy, righteous, and chosen.'
  naturalness: The rendering is fluent, dignified modern standard Hindi. ‘जो पृथ्वी पर अधिकार रखते हैं’ and ‘शक्तिशाली और ऊँचे पदवाले न रहेंगे’ are natural and clearly convey the reversal of status. The singular ‘मुख’ is somewhat marked in Hindi but appropriately preserves the source’s idiomatic collective singular and is supported by the note.
  terminology: ‘आत्माओं के प्रभु’ is a faithful, suitably formal rendering of the fixed Enochic title. ‘पवित्र, धर्मी और चुने हुए जन’ retains the three distinct identity terms without unnecessary doctrinal expansion. ‘अपना प्रकाश प्रकट किया है’ adequately communicates the causative manifestation imagery.
