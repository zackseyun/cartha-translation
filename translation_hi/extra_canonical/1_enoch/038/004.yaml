base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/038/004.yaml
  text: And from now on the mighty and exalted who possess the earth shall not be so[a], nor shall they be able to look on the face of the holy ones, because the Lord of Spirits has caused his light to appear on the face of the holy, the righteous[d][c][b], and the chosen.
translation:
  language: hi
  text: और अब से जो पृथ्वी पर अधिकार रखते हैं, वे शक्तिशाली और ऊँचे पदवाले न रहेंगे[a]; और वे पवित्र जनों का मुख न देख सकेंगे[b], क्योंकि आत्माओं के प्रभु ने पवित्र, धर्मी और चुने हुए जनों के मुख पर अपना प्रकाश प्रकट किया है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, जो पृथ्वी पर अधिकार रखते हैं, वे अब शक्तिशाली और ऊँचे पदवाले नहीं रहेंगे। मूल व्याकरण उनकी स्थिति के अंत की ओर संकेत करता है, आवश्यक रूप से उनके अस्तित्व के अंत की ओर नहीं।
    reason: grammatical_clarification
  - marker: b
    text: “मुख देखना” प्रत्यक्ष दर्शन, भेंट या पहुँच का मुहावरा है।
    reason: cultural_note
  - marker: c
    text: यह वाक्य प्रभु के प्रकाश को पवित्र, धर्मी और चुने हुए जनों के मुख पर प्रकट होते हुए दिखाता है; यह उनके सम्मान और न्यायोचित ठहराए जाने की छवि हो सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: ዐዚዛነ ወእልዑላነ
  choice: शक्तिशाली और ऊँचे पदवाले
  rationale: ये शब्द सामर्थ्य और ऊँची सामाजिक स्थिति को व्यक्त करते हैं। गीइज़ में इनके रूप को विधेय मानते हुए हिन्दी वाक्य में इन्हें ‘जो पृथ्वी पर अधिकार रखते हैं’ के बारे में कहा गया है।
- source_word: እለ ይእኅዝዋ ለምድር
  choice: जो पृथ्वी पर अधिकार रखते हैं
  rationale: मूल क्रिया पकड़ने या थामे रखने का भाव देती है; प्रसंग में स्थायी प्रभुत्व या नियंत्रण अभिप्रेत है। ‘अधिकार रखते हैं’ स्वाभाविक हिन्दी में इस अर्थ को रखता है, बिना अनिश्चित रूप से ‘छीन लेना’ जोड़ने के।
- source_word: ገጸ ቅዱሳን
  choice: पवित्र जनों का मुख
  rationale: मूल के एकवचन ‘मुख’ और बहुवचन संबंधी पद को बनाए रखा गया है। यह प्रत्यक्ष दर्शन या पहुँच का सामी मुहावरा है।
- source_word: እግዚአ መናፍስት
  choice: आत्माओं के प्रभु
  rationale: यह 1 हनोक में प्रयुक्त विशिष्ट ईश्वरीय उपाधि है; हिन्दी में इसका सीधा और प्रतिष्ठित रूप रखा गया है।
- source_word: አርአየ ብርሃኖ
  choice: अपना प्रकाश प्रकट किया है
  rationale: कारक क्रिया प्रकाश को दिखाई देने देने या प्रकट करने का भाव देती है। हिन्दी में यह अभिव्यक्ति दृश्य प्रकटीकरण को सहज ढंग से सुरक्षित रखती है।
- source_word: በገጸ ቅዱሳን ጻድቃን ወኅሩያን
  choice: पवित्र, धर्मी और चुने हुए जनों के मुख पर
  rationale: तीनों पहचान-सूचक विशेषण अलग रखे गए हैं और ‘मुख पर’ की ठोस प्रकाश-छवि सुरक्षित रखी गई है।
theological_decisions:
- issue: पृथ्वी पर अधिकार रखने वालों के न्याय का स्वरूप
  choice: वे अपनी शक्तिशाली और ऊँची स्थिति खो देंगे
  alternative: शक्तिशाली और ऊँचे लोग अस्तित्व में ही नहीं रहेंगे
  rationale: गीइज़ में ‘शक्तिशाली’ और ‘ऊँचे’ को ‘होना’ क्रिया का विधेय समझना अधिक व्याकरणसम्मत है। इसलिए पद स्थिति के उलटाव को बताता है, अनिवार्य रूप से विनाश को नहीं।
- issue: पवित्र जनों के मुख पर प्रभु के प्रकाश का अर्थ
  choice: प्रभु का प्रकाश उनके मुख पर दृश्य रूप से प्रकट होता है
  alternative: प्रकाश उनके सामने प्रकट होता है या उनके मुख से परावर्तित होता है
  rationale: मूल शब्दांकन ‘मुख पर’ की दृश्य छवि का समर्थन करता है। अनुवाद इसे सम्मान और प्रतिपुष्टि की अमूर्त व्याख्या में नहीं बदलता।
- issue: ‘पवित्र जनों का मुख देखना’
  choice: मुहावरे को अक्षरशः बनाए रखते हुए प्रत्यक्ष दर्शन या पहुँच का संकेत
  alternative: ‘पवित्र जनों की उपस्थिति में आना’
  rationale: ठोस मूल छवि और उसकी गंभीरता बनाए रखी गई है; अर्थ-सहायता पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और सर्वसुलभ शैली अपनाई गई है। ‘शक्तिशाली और ऊँचे पदवाले न रहेंगे’ मूल गीइज़ की विधेय-रचना और स्थिति के उलटाव को स्पष्ट करता है। सामी मुहावरे तथा हनोकीय उपाधि को सुरक्षित रखा गया है।
