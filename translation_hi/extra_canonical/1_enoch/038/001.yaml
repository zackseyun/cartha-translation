base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/038/001.yaml
  text: The first parable[a]. When the assembly of the righteous appears, and sinners are judged for their sins, and are driven away from the face of the earth[b],
translation:
  language: hi
  text: पहला दृष्टान्त।[a] जब धर्मियों की सभा प्रकट होती है, और पापियों का उनके पापों के कारण न्याय किया जाता है, और उन्हें धरती पर से खदेड़ दिया जाता है,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात इस खंड का पहला दर्शनीय प्रवचन; मूल शब्द का अनुवाद ‘उपमा’ या ‘रूपक’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘सूखी भूमि के मुख पर से।’ इसका अर्थ ‘धरती पर से’ या ‘देश में से’ भी समझा जा सकता है। यह वाक्य अगले पद में पूरा होता है।
    reason: lexical_and_syntactic_note
lexical_decisions:
- source_word: ምሳሌ
  choice: दृष्टान्त
  rationale: यह शब्द इस खंड में एक दर्शनीय प्रवचन के शीर्षक के रूप में प्रयुक्त है। ‘दृष्टान्त’ आधुनिक हिन्दी में गरिमापूर्ण और प्रचलित है तथा उपमा या दर्शनीय कथन—दोनों की छाया बनाए रखता है।
- source_word: ቀዳማ፲
  choice: पहला
  rationale: यह इस खंड के प्रथम प्रवचन का क्रमसूचक शीर्षक है।
- source_word: ሶበ
  choice: जब
  rationale: यह अगले पद तक चलने वाली न्याय-दृश्य की कालवाचक उपवाक्य-रचना को स्वाभाविक रूप से प्रस्तुत करता है।
- source_word: ያስተርኢ
  choice: प्रकट होती है
  rationale: क्रिया का आशय दिखाई देने या सामने आने से है; ‘प्रकट होती है’ इसे ‘प्रकाशित की जाती है’ जैसे अधिक स्पष्ट निष्क्रिय प्रकाशन-अर्थ में नहीं बदलता।
- source_word: ማኅበረ ጻድቃን
  choice: धर्मियों की सभा
  rationale: ‘सभा’ सामूहिक एकत्रीकरण को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है; ‘धर्मी’ न्यायोचित व्यक्तियों की श्रेणी को बनाए रखता है।
- source_word: ወይትኴነኑ
  choice: न्याय किया जाता है
  rationale: मूल न्यायिक क्रिया को सुरक्षित रखा गया है; ‘दोषी ठहराया जाता है’ परिणाम को मूल से अधिक निश्चित कर देता।
- source_word: ኃጥኣን
  choice: पापियों
  rationale: यह अनिश्चित बहुवचन के रूप में पापियों को एक वर्ग बताता है; हिन्दी में अलग निश्चित उपपद की आवश्यकता नहीं है।
- source_word: በኃጢአቶሙ
  choice: उनके पापों के कारण
  rationale: पूर्वसर्ग यहाँ न्याय का आधार सूचित करता है। यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ወእምገጸ የብስ
  choice: धरती पर से
  rationale: शाब्दिक रूप ‘सूखी भूमि के मुख पर से’ है; प्रसंग में ‘धरती पर से’ उसी भाव का स्वाभाविक हिन्दी रूप है, जबकि ठोस शब्दचित्र पादटिप्पणी में दिया गया है।
- source_word: ይትሀወዙ
  choice: खदेड़ दिया जाता है
  rationale: यह दंडात्मक निष्कासन और निष्क्रिय क्रिया दोनों को ‘चले जाते हैं’ की अपेक्षा अधिक ठीक ढंग से व्यक्त करता है।
theological_decisions:
- issue: न्याय की क्रिया को तटस्थ ‘न्याय किया जाता है’ कहा जाए या परिणाम-सूचक ‘दोषी ठहराया जाता है’
  choice: न्याय किया जाता है
  alternative: दोषी ठहराया जाता है
  rationale: मूल पाठ न्यायिक कार्यवाही बताता है, जबकि दंडात्मक परिणाम अगले वाक्यांश में निष्कासन द्वारा सामने आता है। अतः मुख्य पाठ में परिणाम को आवश्यकता से अधिक स्पष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। शीर्षक को अलग वाक्य रखा गया है। ‘जब’ से आरम्भ उपवाक्य मूल की अपूर्ण वाक्य-रचना के अनुसार अल्पविराम पर समाप्त होता है और अगले पद में जारी रहता है।
