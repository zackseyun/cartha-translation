base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/002/001.yaml
  text: 'Consider all the works in heaven: how they do not alter their paths[a], and the lights in heaven, how all of them rise and set in order, each in its season[c][b], and do not transgress their appointed order.'
translation:
  language: hi
  text: आकाश में होने वाले सभी कार्यों पर ध्यान दो—वे अपने मार्ग कैसे नहीं बदलते हैं; और आकाश की ज्योतियों को देखो—वे सब कैसे क्रम से उदय और अस्त होती हैं, हर एक अपने समय पर, और अपनी निर्धारित व्यवस्था का उल्लंघन नहीं करतीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጠይቁ
  choice: ध्यान दो
  rationale: बहुवचन आज्ञार्थक रूप यहाँ दृश्य सृष्टि को गौर से देखकर उस पर विचार करने का आह्वान करता है।
- source_word: ግብረ
  choice: कार्य
  rationale: आकाशीय सृष्टि की गतिविधियों और दृश्यमान क्रियाओं, दोनों को समेटने वाला स्वाभाविक शब्द है।
- source_word: ኢይመይጡ ፍናዊሆሙ
  choice: वे अपने मार्ग नहीं बदलते
  rationale: स्थिर आकाशीय पथों की ठोस छवि और न बदलने के भाव को बनाए रखता है।
- source_word: ብርሃናት
  choice: ज्योतियाँ
  rationale: सूर्य, चंद्रमा और तारों जैसे आकाशीय प्रकाश-पिंडों के लिए गरिमापूर्ण और सुबोध सामूहिक पद है।
- source_word: ይሠርቅ ወየዐርብ
  choice: उदय और अस्त होती हैं
  rationale: आकाशीय ज्योतियों की नियमित गति का स्वाभाविक हिन्दी रूप।
- source_word: ሥሩዕ
  choice: व्यवस्थित रूप से
  rationale: निश्चित क्रम और नियमितता का भाव देता है, केवल घटनाओं के अनुक्रम का नहीं।
- source_word: በበዘመኑ
  choice: हर एक अपने समय पर
  rationale: मूल के वितरणात्मक और समय-संबंधी अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है; ‘ऋतु’ की अपेक्षा यहाँ अधिक व्यापक है।
- source_word: ኢይትኀደዉ እምሥርዓቶሙ
  choice: अपने लिए ठहराई हुई व्यवस्था का उल्लंघन नहीं करतीं
  rationale: नियत व्यवस्था से सीमा पार न करने का प्रबल, न्यायिक भाव सुरक्षित रखता है।
theological_decisions:
- issue: आकाशीय नियमितता को केवल प्राकृतिक नियम के रूप में कहना या आज्ञापालन-जैसे न्यायिक भाव को बनाए रखना
  choice: अपने लिए ठहराई हुई व्यवस्था का उल्लंघन नहीं करतीं
  alternative: अपनी व्यवस्था से नहीं हटतीं
  rationale: मूल में केवल परिवर्तन न होने से अधिक, निर्धारित सीमा या विधान न लाँघने का भाव है। यह सृष्टि की नियत व्यवस्था के प्रति निष्ठा का सर्वनाश-दर्शी साहित्य वाला तनाव सुरक्षित रखता है, पर किसी विशिष्ट धार्मिक विधि को स्पष्ट रूप से आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठक के लिए सुबोध, किंतु गरिमापूर्ण। ‘ज्योतियाँ’, ‘उदय और अस्त’ तथा ‘व्यवस्था का उल्लंघन’ मूल की ब्रह्मांडीय और न्यायिक छवियों को बनाए रखते हैं।
