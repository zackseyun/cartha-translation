base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/002/003.yaml
  text: Look at the summer and the winter[a], how the whole earth is filled with water[b], and clouds and dew and rain rest upon it.
translation:
  language: hi
  text: ग्रीष्म और शीत ऋतु को देखो[a]—कैसे सारी पृथ्वी जल से भर जाती है, और बादल, ओस[b] और वर्षा उस पर ठहरते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल गीज़ पाठ में ऋतुओं का युग्म सीधे ‘ग्रीष्म और शीत ऋतु’ है। इथियोपियाई परिवेश में ‘शीत ऋतु’ आधुनिक हिन्दी में समझी जाने वाली ठंडी ऋतु की अपेक्षा वर्षा-ऋतु का संकेत भी दे सकती है।
    reason: cultural_note
  - marker: b
    text: यहाँ ‘ओस’ के रूप में अनूदित शब्द का अर्थ अकेले में निश्चित करना कठिन हो सकता है; पर जल, बादल और वर्षा की इस सूची में ओस जैसे वायुमंडलीय जल का अर्थ सबसे अधिक संगत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ርእይዎ
  choice: देखो
  rationale: बहुवचन अथवा सामूहिक आज्ञार्थक आह्वान को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ለሐጋይ ወለክረምት
  choice: ग्रीष्म और शीत ऋतु
  rationale: गीज़ के ऋतु-युग्म को सीधे बनाए रखता है; पाठक के लिए दोनों पद स्पष्ट करने हेतु ‘ऋतु’ जोड़ा गया है।
- source_word: ከመ
  choice: कैसे
  rationale: यह केवल तथ्य नहीं, बल्कि सृष्टि में दिखाई देने वाली रीति पर ध्यान दिलाता है।
- source_word: ኵሉ ምድር
  choice: सारी पृथ्वी
  rationale: सृष्टि-अवलोकन के प्रसंग में व्यापक, वैश्विक अर्थ को बनाए रखता है।
- source_word: መልአት ማየ
  choice: जल से भर जाती है
  rationale: जल की प्रचुरता का ठोस चित्र स्वाभाविक हिन्दी में व्यक्त होता है; क्रिया का रूप ऋतुचक्र में देखी जाने वाली घटना का भाव देता है।
- source_word: ወደመና
  choice: और बादल
  rationale: मौसम-संबंधी सूची में सीधा और सामान्य हिन्दी समतुल्य।
- source_word: ወጠለ
  choice: ओस
  rationale: जल, बादल और वर्षा की मौसम-संबंधी सूची में ‘ओस’ सर्वाधिक संगत है, यद्यपि शब्द का अर्थ अकेले में कुछ संदिग्ध हो सकता है।
- source_word: ወዝናም
  choice: और वर्षा
  rationale: मूल के ठोस मौसम-संबंधी पद को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ያዓርፍ ላዕሌሃ
  choice: उस पर ठहरते हैं
  rationale: धरती पर आकर टिकने या विश्राम करने का भाव बचाता है और बादल, ओस तथा वर्षा के संयुक्त कर्ता के साथ स्वाभाविक है।
