base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/002/002.yaml
  text: Look at the earth and understand concerning the works that are done upon it from the beginning to their completion[a], that none of the works of God changes[d][c][b], as they appear.
translation:
  language: hi
  text: पृथ्वी को देखो और उन कार्यों पर विचार करो जो उस पर आरम्भ से लेकर अपनी पूर्णता तक किए जाते हैं[a], कि परमेश्वर का कोई भी कार्य नहीं बदलता[b], जैसा वह प्रकट होता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में ‘कार्य’ एकवचन-सामूहिक है; वाक्यांश का अर्थ ‘जो उस पर आरम्भ से उसके पूरा होने तक किया जाता है’ भी लिया जा सकता है।
    reason: collective_singular_and_pronominal_reference
  - marker: b
    text: मूल अभिव्यक्ति का अनुवाद ‘परमेश्वर के सभी कार्य नहीं बदलते’ भी किया जा सकता है; यहाँ उसे वितरणात्मक अर्थ में, अर्थात प्रत्येक कार्य के विषय में, समझा गया है।
    reason: lexical_and_scope_ambiguity
  - marker: c
    text: अंतिम पद का अर्थ ‘जब वह प्रकट होता है’ या, सामूहिक बहुवचन में, ‘जैसे वे प्रकट होते हैं’ भी हो सकता है। क्रियारूप का भाव ‘दिखाई देना/प्रकट होना’ है, न कि सक्रिय रूप से ‘दिखाना’।
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ርእይዋ፡ ለምድር
  choice: पृथ्वी को देखो
  rationale: आज्ञार्थक क्रिया प्रत्यक्ष निरीक्षण का आह्वान करती है; सृष्टि-संबंधी प्रसंग में ምድር का अर्थ स्थानीय ‘भूमि’ के बजाय ‘पृथ्वी’ है।
- source_word: ወለብዉ
  choice: ध्यान दो
  rationale: यह देखी हुई बात पर मन लगाकर विचार करने का भाव व्यक्त करता है। आधुनिक हिन्दी में ‘ध्यान दो’ स्वाभाविक है और केवल बौद्धिक निष्कर्ष की अपेक्षा निरीक्षण से उपजी समझ पर बल देता है।
- source_word: በእንተ፡ ምግባር፡ ዘይትገበር፡ ላዕሌሃ
  choice: उन कार्यों पर ... जो उस पर किए जाते हैं
  rationale: ምግባር को सृष्टि के क्रम में होनेवाले ‘कार्य’ के रूप में लिया गया है और निष्क्रिय रूप को बनाए रखा गया है।
- source_word: እምቀዳሚ፡ እስከ፡ ተፍጻሜቱ
  choice: आरम्भ से लेकर अपनी पूर्णता तक
  rationale: वाक्यांश पूरे क्रम को आरम्भ से परिणति तक समेटता है। ‘पूर्णता’ केवल रुक जाने की अपेक्षा संपन्न होने का भाव सुरक्षित रखती है; ‘अपनी’ हिन्दी में सामूहिक ‘कार्यों’ से स्वाभाविक संबंध बनाती है।
- source_word: ከመ፡ ኢይትመየጥ
  choice: कि ... कोई भी ... नहीं बदलता
  rationale: निषेध और परिवर्तन की क्रिया को सीधे रखा गया है; इससे परमेश्वर के कार्यों की देखी जानेवाली स्थिरता व्यक्त होती है।
- source_word: ኵሉ፡ ምግባረ፡ ለአምላክ
  choice: परमेश्वर का कोई भी कार्य
  rationale: ኵሉ के साथ एकवचन-सामूहिक संरचना को वितरणात्मक हिन्दी में व्यक्त किया गया है। ‘कोई भी ... नहीं’ यह स्पष्ट करता है कि आशय प्रत्येक कार्य के न बदलने से है, न कि केवल इतना कि सभी एक साथ नहीं बदलते।
- source_word: እንዘ፡ ያስተርኢ
  choice: जैसा वह दिखाई देता है
  rationale: Ast-रूप को अकर्मक/दृश्य होने के अर्थ में लिया गया है, सक्रिय ‘जैसा वह दिखाता है’ के अर्थ में नहीं। एकवचन ‘वह’ निकटवर्ती ‘कोई भी कार्य’ से मेल खाता है।
theological_decisions:
- issue: क्या कथन परमेश्वर की समस्त गतिविधि की निरपेक्ष अपरिवर्तनशीलता बताता है या सृष्टि में दिखाई देनेवाले उसके कार्यों की नियमितता?
  choice: कथन को पृथ्वी पर निरीक्षण किए जानेवाले परमेश्वर के कार्यों की स्थिरता के रूप में रखा गया है।
  alternative: इसे एक व्यापक तत्त्वमीमांसात्मक कथन माना जा सकता है कि परमेश्वर की कोई भी क्रिया कभी नहीं बदलती।
  rationale: निकटवर्ती प्रसंग पृथ्वी और उस पर होनेवाले कार्यों को देखने के लिए कहता है। अनुवाद इसी सृष्टिगत संदर्भ को रहने देता है, पर कथन की व्यापक ध्वनि को अतिरिक्त शब्दों से सीमित नहीं करता।
- issue: ኵሉ ምግባረ की सामूहिक अथवा वितरणात्मक व्याख्या
  choice: ‘परमेश्वर का कोई भी कार्य नहीं बदलता’
  alternative: ‘परमेश्वर के सभी कार्य नहीं बदलते’
  rationale: चुना हुआ रूप हिन्दी में निषेध का आशय स्पष्ट करता है, जबकि पाद-टिप्पणी मूल की सामूहिक अभिव्यक्ति की जानकारी देती है।
- issue: अंतिम क्रिया ያስተርኢ का वाच्य और आशय
  choice: ‘जैसा वह दिखाई देता है’
  alternative: ‘जब वे दिखाई देते हैं’ अथवा ‘जैसा प्रकट होता है’
  rationale: क्रियारूप ‘दिखाई देना/प्रकट होना’ का समर्थन करता है, न कि सक्रिय ‘दिखाना’ का। साथ ही संबंधवाचक उपवाक्य का सटीक कालगत या तुलनात्मक संबंध कुछ खुला रहता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज रखी गई है। ‘देखो’, ‘ध्यान दो’, ‘कार्य’ और ‘पूर्णता’ निरीक्षणात्मक तथा सृष्टि-संबंधी शैली को बनाए रखते हैं। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
