base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/012.yaml
  text: And when all their sons have slain one another[a], and when they have seen the destruction of their beloved ones, bind them for seventy generations beneath the hills of the earth, until the day of their judgment and of their consummation[c][b], until the judgment that is for all eternity is completed.
translation:
  language: hi
  text: और जब उनके सभी पुत्र एक-दूसरे को मार डालें, और जब वे अपने प्रिय जनों का विनाश देख लें, तब उन्हें पृथ्वी की पहाड़ियों के नीचे[a] सत्तर पीढ़ियों तक बाँधे रखना—उनके न्याय और उनकी परिणति[b] के दिन तक, जब तक युगानुयुग का न्याय[c] पूरा न हो जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पृथ्वी के पर्वतों के नीचे।’ गीइज़ शब्द का अर्थ ‘पहाड़ियाँ’ या ‘पर्वत’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘परिणति’ का अर्थ यहाँ ‘अंत’ या ‘पूर्णता’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: मूल में अनन्तता पर बल देने वाला पदबंध है, जिसका अधिक शाब्दिक रूप ‘अनन्त युग का न्याय’ या ‘युगों के युग का न्याय’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትራገዙ
  choice: एक-दूसरे को मार डालें
  rationale: बहुवचन/पारस्परिक क्रिया और अध्याय में दैत्यों के आपसी संहार के प्रसंग को व्यक्त करता है; केवल झगड़ने का अर्थ लेने से न्याय-दृश्य की तीव्रता घटती।
- source_word: ሐጕሎሙ ለፍቁራኒሆሙ
  choice: अपने प्रिय जनों का विनाश
  rationale: ‘विनाश’ मूल के विनाश/बरबादी के व्यापक अर्थ को रखता है और ‘प्रिय जन’ प्रेम-सूचक पद की भावात्मक गरिमा बनाए रखता है।
- source_word: እሰሮሙ
  choice: उन्हें ... बाँधे रखना
  rationale: आज्ञार्थक बल और पहरेदारों को भौतिक रूप से बाँधने की सर्वनाश-संबंधी छवि दोनों सुरक्षित रहते हैं।
- source_word: ለ፸ ትውልድ
  choice: सत्तर पीढ़ियों तक
  rationale: निर्धारित सर्वनाश-संबंधी कालावधि का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: በመትሕተ አውግርተ ምድር
  choice: पृथ्वी की पहाड़ियों के नीचे
  rationale: स्थान-सूचक वाक्यांश का निकट अनुवाद; संबंधित संज्ञा ‘पहाड़ियों’ अथवा ‘पर्वतों’ के रूप में समझी जा सकती है।
- source_word: ዕለተ ኵነኔሆሙ
  choice: उनके न्याय ... के दिन
  rationale: न्यायिक अर्थ बनाए रखता है और इसे केवल दंडादेश या दोषसिद्धि तक सीमित नहीं करता।
- source_word: ተፍጻሜቶሙ
  choice: उनकी परिणति
  rationale: पूर्णता, अंत और अंतिम निष्पत्ति के बीच मूल की अर्थगत व्यापकता तथा युगांतकारी तनाव को बनाए रखता है।
- source_word: ኵነኔ ዘለዓለመ ዓለም
  choice: युगानुयुग का न्याय
  rationale: दोहराए गए युग/अनन्तता-सूत्र की प्रबलता को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पुत्रों की पारस्परिक हिंसा का स्वरूप
  choice: वे एक-दूसरे को मार डालते हैं
  alternative: वे एक-दूसरे से लड़ते या संघर्ष करते हैं
  rationale: 1 हनोक 10 के निकट प्रसंग में पहरेदारों की संतान का न्याय आपसी संहार में परिणत होता है; इसलिए घातक पारस्परिक हिंसा प्रसंगानुकूल है।
- issue: ‘उनकी परिणति’ का आशय
  choice: ऐसा खुला पद जो अंत, पूर्णता या न्याय-प्रक्रिया की अंतिम निष्पत्ति को समेट सके
  alternative: उनका अंतिम दंड अथवा उनका विनाश
  rationale: मूल पद इन विकल्पों में से किसी एक को निर्णायक रूप से स्थापित नहीं करता; ‘परिणति’ अनावश्यक धर्मवैज्ञानिक निष्कर्ष थोपे बिना तनाव बनाए रखती है।
- issue: अनन्त न्याय की समापन-पंक्ति
  choice: युगानुयुग का न्याय पूरा होना
  alternative: अनन्त न्याय अथवा युगों के युग का न्याय
  rationale: यह मूल के प्रबल अनन्तता-सूत्र को सुरक्षित रखता है, पर उसे किसी विशिष्ट सम्प्रदायगत न्याय-क्रम में नहीं बाँधता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय सर्वनाश-संबंधी शैली रखी गई है। ‘बाँधे रखना’ आदेश की निरंतर अवधि स्पष्ट करता है; दीर्घ वाक्य और डैश मूल के क्रमिक न्याय-दृश्य को बनाए रखते हैं।
