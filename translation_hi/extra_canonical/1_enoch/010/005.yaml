base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/005.yaml
  text: And heap jagged and sharp stones upon him[a], and cover him with darkness; and there he shall remain forever[c][b]. And cover his face so that he may not see light.
translation:
  language: hi
  text: और उसके ऊपर खुरदरे और नुकीले पत्थरों का ढेर लगा दो[a], और उसे अंधकार से ढक दो; वहीं वह सदा रहेगा।[b] और उसका चेहरा ढक दो, ताकि वह प्रकाश न देख सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में ‘पत्थर’ के लिए दो साथ-साथ विशेषण हैं; इनका अनुवाद ‘खुरदरे और नुकीले’ या ‘दाँतेदार और पैने’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘सदा’ के लिए प्रयुक्त मूल पद दीर्घ अथवा अनिश्चित काल का भाव भी दे सकता है; यहाँ दंडात्मक बंदीकरण की निरंतरता प्रमुख है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: ደይ
  choice: ढेर लगा दो
  rationale: दंडात्मक बंदीकरण के प्रसंग में यह पत्थरों को उसके ऊपर जमा करने की आज्ञा व्यक्त करता है; केवल ‘रख दो’ की अपेक्षा अधिक सटीक और स्वाभाविक है।
- source_word: እብነ ጠያያተ ወበሊሓተ
  choice: ऊबड़-खाबड़ और नुकीले पत्थर
  rationale: एक ही संज्ञा ‘पत्थर’ के साथ आए दोनों विशेषण उनकी कठोर और चोट पहुँचाने वाली प्रकृति को तीव्र करते हैं; हिंदी में संज्ञा को दोहराए बिना यह संरचना स्पष्ट रहती है।
- source_word: ክድኖ
  choice: ढक दो
  rationale: दोनों आज्ञाओं में मूल क्रिया की पुनरावृत्ति बनाए रखी गई है—पहले अंधकार से ढकना और फिर चेहरा ढकना; ‘दफना दो’ अनावश्यक व्याख्या जोड़ता।
- source_word: ጽልመተ
  choice: अंधकार
  rationale: यह न्याय और पूर्ण बंदीकरण की ठोस अपोकैलिप्टिक छवि को गंभीर, प्रचलित हिंदी में बनाए रखता है।
- source_word: ይኅድር ለዓለም
  choice: सदा तक पड़ा रहेगा
  rationale: यहाँ क्रिया के रहने/ठहरे रहने के अर्थ को पत्थरों के नीचे बंदीकरण के प्रसंग से स्वाभाविक रूप से जोड़ा गया है; ‘निवास करेगा’ इस दंडात्मक संदर्भ में असंगत लगता।
- source_word: ለገጹ
  choice: उसका चेहरा
  rationale: इसे शाब्दिक प्रत्यक्ष कर्म के रूप में लेना अगले उपवाक्य—प्रकाश न देखने—से सीधे मेल खाता है।
- source_word: ከመ ኢይርአይ ብርሃነ
  choice: ताकि वह प्रकाश न देख सके
  rationale: उद्देश्य/परिणाम के संबंध तथा ‘प्रकाश देखना’ की मूल ठोस छवि दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: दंड की छवि का स्वरूप
  choice: पत्थरों, अंधकार, ढके चेहरे और प्रकाश से वंचित किए जाने की ठोस छवि बनाए रखी गई है।
  alternative: इसे केवल रूपकात्मक पीड़ा या सामान्य कारावास के रूप में व्यक्त करना।
  rationale: गीज़ पाठ लगातार ठोस आज्ञाएँ देता है; उन्हें अमूर्त ‘दंड’ में बदलना मूल अपोकैलिप्टिक तनाव और कठोरता को कम कर देता।
- issue: ይኅድር ለዓለም की अवधि
  choice: सदा तक
  alternative: एक युग तक / युग भर
  rationale: इस पद में ለዓለም स्थायी अथवा अनिश्चित दीर्घ अवधि का भाव रख सकता है। मुख्य पाठ में परंपरागत और संदर्भानुकूल ‘सदा तक’ रखा गया है, बिना बाद की किसी विशिष्ट दंड-सिद्धांत को विस्तार से आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिंदी में गंभीर किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। आज्ञार्थक क्रियाओं की पुनरावृत्ति और ठोस न्याय-छवि सुरक्षित है। ‘अपोकैलिप्टिक’, ‘अनंत दंड’ जैसे व्याख्यात्मक धर्मशास्त्रीय पद मुख्य पाठ में नहीं जोड़े गए।
