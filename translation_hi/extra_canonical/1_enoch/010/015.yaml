base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/015.yaml
  text: And destroy these spirits of the bastards and the children of the Watchers, because they have oppressed humankind.
translation:
  language: hi
  text: और इन अवैध संतानों की आत्माओं[a] और पहरेदारों की संतानों[b] को नष्ट कर दे, क्योंकि उन्होंने मानवजाति पर अत्याचार किया है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल शब्द कठोर है और इसका अनुवाद ‘नाजायज़ संतानें’ अथवा संदर्भानुसार ‘मिश्रित संयोग से उत्पन्न संतानें’ भी हो सकता है। यहाँ संकेत पहरेदारों से उत्पन्न अनुचित संतति की ओर है।
    reason: lexical_alternative
  - marker: b
    text: इन दोनों पदों का संबंध अस्पष्ट है। इसे ‘अवैध संतानों की आत्माओं, अर्थात् पहरेदारों की संतानों’ के रूप में भी समझा जा सकता है।
    reason: theological_ambiguity
  - marker: c
    text: या ‘मानवजाति के साथ हिंसा की है।’ मूल क्रिया साधारण बुराई से अधिक, उत्पीड़न या हिंसक दुर्व्यवहार का भाव रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: አኅጕሎሙ
  choice: नष्ट कर दे
  rationale: आज्ञार्थक/विधिलिंग बल और दैवी न्याय की कठोरता को बनाए रखता है, पर विनाश की विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: መናፍስተ
  choice: आत्माओं
  rationale: इस प्रलय-साहित्यिक संदर्भ में यह देह से अलग आध्यात्मिक अस्तित्वों की ओर संकेत करता है; सामान्य अर्थ वाले ‘प्राणों’ की अपेक्षा ‘आत्माओं’ अधिक स्पष्ट है।
- source_word: ተውኔት
  choice: अवैध संतानों
  rationale: यह कठोर शब्द अनुचित अथवा मिश्रित संयोग से उत्पन्न संतानों को सूचित करता है। ‘अवैध संतान’ अर्थ को स्पष्ट रखते हुए हिन्दी में केवल गाली जैसा प्रभाव पैदा करने से बचाता है।
- source_word: ውሉዶሙ
  choice: संतानों
  rationale: वंश या उत्पन्न संतान का व्यापक अर्थ सुरक्षित रहता है; ‘पुत्रों’ कहने से अनावश्यक रूप से केवल पुरुष संतान का अर्थ निकल सकता है।
- source_word: ትጉሃን
  choice: पहरेदारों
  rationale: यह इस खंड के जागरूक अथवा निरंतर जागनेवाले स्वर्गीय प्राणियों की स्थापित उपाधि को एक स्वाभाविक हिन्दी पद के रूप में व्यक्त करता है।
- source_word: ገፍዕዎሙ
  choice: अत्याचार किया है
  rationale: क्रिया में उत्पीड़न, दुर्व्यवहार और हिंसा का प्रबल भाव है। ‘अन्याय किया’ इसकी तीव्रता को कम कर देता।
- source_word: ሰብእ
  choice: मानवजाति
  rationale: गीज़ के सामूहिक और समावेशी अर्थ को व्यक्त करता है तथा केवल पुरुषों तक अर्थ सीमित नहीं करता।
theological_decisions:
- issue: 'न्याय के अधीन प्राणियों की पहचान: आत्माएँ और पहरेदारों की संतानें'
  choice: मुख्य पाठ में ‘अवैध संतानों की आत्माओं’ और ‘पहरेदारों की संतानों’—दोनों पदों को अलग-अलग बनाए रखा गया है।
  alternative: 'दूसरे पद को पहले की व्याख्या मानकर पढ़ा जा सकता है: ‘अवैध संतानों की आत्माओं, अर्थात् पहरेदारों की संतानों।’'
  rationale: गीज़ पाठ दोनों पद प्रस्तुत करता है, जबकि उनका पारस्परिक संबंध पूरी तरह स्पष्ट नहीं करता। उन्हें एक ही समूह में मिला देने के बजाय पाठ की वास्तविक धर्मवैचारिक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अवैध संतान’ स्रोत की कठोरता को पूरी तरह मिटाए बिना हिन्दी में अनावश्यक रूप से अपमानसूचक गाली से बचाता है। ‘पहरेदार’ को इस साहित्यिक खंड की विशिष्ट स्वर्गीय उपाधि के रूप में लगातार समझा जाना चाहिए।
