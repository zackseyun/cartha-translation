base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/007.yaml
  text: And heal the earth which the angels have corrupted[a], and make known the healing of the earth, so that they may heal the earth, and all the children of men may not perish through all the secrets that the Watchers have disclosed[f] and taught to their sons.
translation:
  language: hi
  text: और उस धरती को चंगा कर जिसे स्वर्गदूतों ने भ्रष्ट कर दिया है, और धरती की चंगाई प्रकट कर,[a] ताकि वे धरती को चंगा कर सकें और मनुष्यों के सभी बच्चे उन सभी गुप्त बातों के कारण नष्ट न हो जाएँ जिन्हें पहरेदारों ने प्रकट किया[b] और अपने पुत्रों को सिखाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह वाक्यांश पाठ और वाक्य-विन्यास की दृष्टि से कठिन है। गीइज़ शब्दों का अधिक शाब्दिक अर्थ “धरती का जीवन” या “धरती का पुनर्स्थापन” भी हो सकता है।
    reason: textual_variant
  - marker: b
    text: गीइज़ पाठ में यहाँ शाब्दिक रूप से “मार डाला” लिखा है। यह संभवतः यूनानी पाठ-संप्रेषण में “मारा” और “दिखाया/प्रकट किया” के बीच हुए पुराने पाठभ्रंश को दर्शाता है; प्रसंग में “प्रकट किया” अर्थ संगत है।
    reason: textual_variant
lexical_decisions:
- source_word: አሕይዋ
  choice: चंगा कर
  rationale: आज्ञार्थक पद धरती को फिर जीवन और स्वास्थ्य देने की बात करता है; ‘चंगा कर’ पुनर्स्थापन और उपचार दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: አማሰኑ
  choice: भ्रष्ट कर दिया है
  rationale: यह स्वर्गदूतों द्वारा धरती को पहुँचाई गई नैतिक और व्यापक विनाशकारी क्षति को व्यक्त करता है, बिना इसे केवल अनुष्ठानिक अशुद्धता तक सीमित किए।
- source_word: ሕይወታ ለምድር
  choice: धरती के चंगे होने का उपाय
  rationale: शाब्दिक रूप से यह ‘धरती का जीवन/पुनर्जीवन’ हो सकता है। संदर्भ में प्रकट की जाने वाली वस्तु उपचार या पुनर्स्थापन है; ‘उपाय’ हिन्दी वाक्य को स्पष्ट करता है, जबकि पादटिप्पणी मूल की कठिनाई सुरक्षित रखती है।
- source_word: አይድዕ
  choice: प्रकट कर
  rationale: कारक भाव में किसी बात को ज्ञात कराने की आज्ञा है; ‘प्रकट कर’ सहज और गरिमापूर्ण है।
- source_word: ይሕይዋ ለምድር
  choice: वे धरती को चंगा करें
  rationale: आधार गीइज़ पाठ में कर्म स्पष्टतः ‘धरती’ है; इसलिए यूनानी पाठांतर ‘महामारी/घाव’ को मुख्य पाठ में नहीं अपनाया गया। बहुवचन कर्ता की वास्तविक अस्पष्टता को ‘वे’ से बनाए रखा गया है।
- source_word: ኢይትሐጐሉ
  choice: नष्ट न हो जाए
  rationale: न्याय और विनाश के प्रसंग में यह सहज आधुनिक हिन्दी है और पूर्ण नाश की आशंका व्यक्त करती है।
- source_word: በምሥጢር ኵሉ
  choice: उन सब गुप्त बातों के कारण
  rationale: यह पहरेदारों द्वारा दी गई निषिद्ध गुप्त विद्या को सूचित करता है; इसे केवल जादू तक सीमित नहीं किया गया।
- source_word: ትጉሃን
  choice: पहरेदारों
  rationale: यह 1 हनोक में इन स्वर्गदूतीय प्राणियों की विशिष्ट उपाधि है; ‘पहरेदार’ अर्थ और कथात्मक पदावली दोनों बनाए रखता है।
- source_word: መሀሩ ለውሉዶሙ
  choice: अपने पुत्रों को सिखाया
  rationale: पारिवारिक पद का सीधा अनुवाद है; ‘संतान’ कहकर इसे अनावश्यक रूप से सामान्य नहीं बनाया गया।
theological_decisions:
- issue: धरती के पुनर्स्थापन का स्वरूप
  choice: धरती को वास्तविक रूप से चंगा और पुनर्स्थापित किया जाना
  alternative: इसे केवल मानव समाज के नैतिक सुधार के रूप में समझना
  rationale: धरती बार-बार प्रत्यक्ष कर्म के रूप में आती है; इसलिए विश्वगत पुनर्स्थापन की अपोकैलिप्टिक छवि को सामान्य नैतिक भाषा में नहीं बदला गया।
- issue: गुप्त बातों को प्रकट करने वाले
  choice: पहरेदार
  alternative: मनुष्यों में सामान्य रूप से फैला हुआ अज्ञात ज्ञान
  rationale: अंतिम उपवाक्य प्रकट करने और सिखाने का कार्य सीधे पहरेदारों से जोड़ता है।
- issue: दूषित गीइज़ पाठ ዘቀተሉ का अर्थ
  choice: प्रकट किया
  alternative: मार डाला
  rationale: ‘मार डाला’ मौजूदा वाक्य-संबंध में अर्थहीन है और इसे यूनानी संप्रेषण में ἐπάταξαν (‘मारा’) तथा ὑπέδειξαν (‘दिखाया/प्रकट किया’) के पाठभ्रंश का परिणाम माना जाता है। मुख्य पाठ में प्रसंगानुकूल अभिप्रेत अर्थ रखा गया और शाब्दिक साक्ष्य पादटिप्पणी में दिया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘धरती’ को ‘पृथ्वी’ पर वरीयता दी गई ताकि बार-बार आने वाला पद स्वाभाविक रहे। ‘पहरेदार’ को इस ग्रंथ की तकनीकी उपाधि के रूप में रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
