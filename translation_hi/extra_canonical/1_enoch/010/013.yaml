base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/013.yaml
  text: And in those days they will lead them down into the abyss of fire[a], and into torment and the prison-house[b]; and there they will be shut up forever.
translation:
  language: hi
  text: और उन दिनों वे उन्हें आग की अथाह गहराई[a] में, यातना में और बन्दीगृह[b] में ले जाएँगे; और वहाँ वे सदा के लिए बन्द कर दिए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: जिस पद का अनुवाद “आग की अथाह गहराई” किया गया है, उसका शाब्दिक भाव आग का कोई निचला या गहरा स्थान है; इसका अर्थ “आग की गहराई” या “अग्निमय अथाह स्थान” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “बन्दीगृह” का शाब्दिक भाव “बन्दी बनाए रखने का घर” है; यह न्याय के इस दृश्य में कारावास की ठोस छवि को बनाए रखता है।
    reason: cultural_note
lexical_decisions:
- source_word: መዋዕል
  choice: दिनों
  rationale: प्रकाशनात्मक काल-सूचक सूत्र ‘उन दिनों’ को स्वाभाविक और परिचित हिन्दी में बनाए रखता है।
- source_word: ይወስድዎሙ
  choice: वे उन्हें ... ले जाएँगे
  rationale: क्रिया के बहुवचन कर्ता को अनिर्दिष्ट रखते हुए न्याय के स्थान तक ले जाने का भाव व्यक्त करता है।
- source_word: መትሕተ እሳት
  choice: आग के अथाह गड्ढे
  rationale: मूल के आग से जुड़े निचले या गहरे स्थान की स्थानिक छवि को रखता है और ‘नरक’ जैसा बाद का धर्मशास्त्रीय पद नहीं जोड़ता।
- source_word: በጻዕር
  choice: यातना में
  rationale: दण्ड के प्रसंग में पीड़ादायक कष्ट का अर्थ स्पष्ट करता है।
- source_word: ቤት ሞቅሕ
  choice: बन्दीगृह
  rationale: ‘बन्दी बनाए रखने का घर’ की ठोस कारावास-छवि को संक्षिप्त, गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ይትዓፀዉ
  choice: बन्द कर दिए जाएँगे
  rationale: निष्क्रिय रूप और अन्तिम रूप से घेरकर बन्द किए जाने की सशक्त छवि दोनों सुरक्षित रहती हैं।
- source_word: ለዓለም
  choice: सदा के लिए
  rationale: इस दण्ड-सन्दर्भ में स्थायी अवधि को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अग्निमय स्थान को पारम्परिक धर्मशास्त्रीय पद ‘नरक’ से व्यक्त करना या मूल की स्थानिक छवि बनाए रखना
  choice: आग के अथाह गड्ढे
  alternative: नरक; आग की गहराई; आग का अधोलोक
  rationale: गीज़ पाठ किसी रूढ़ उत्तरकालीन धर्मशास्त्रीय नाम के बजाय आग से जुड़े नीचे या गहरे स्थान की छवि देता है; इसलिए अनुवाद उसी प्रकाशनात्मक बिम्ब को रखता है।
- issue: दण्ड की अवधि
  choice: सदा के लिए
  alternative: युग भर के लिए; अनन्तकाल के लिए
  rationale: ለዓለም इस न्याय-सन्दर्भ में स्थायी बन्दीकरण का सर्वाधिक स्वाभाविक अर्थ देता है; अनुवाद कथन की कठोरता को न घटाता है, न उससे अधिक व्याख्या जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और प्रकाशनात्मक शैली रखी गई है। ‘बन्दीगृह’ औपचारिक है, पर सामान्य पाठक के लिए बोधगम्य है; ‘नरक’ से बचकर मूल की अस्पष्ट स्थानिक छवि सुरक्षित रखी गई है।
