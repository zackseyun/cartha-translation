base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/016.yaml
  text: Destroy all violence from the face of the earth[a], and every evil deed shall come to an end; and the plant of righteousness and uprightness shall appear[b], and it shall become a blessing.
translation:
  language: hi
  text: पृथ्वी के मुख पर से सारी हिंसा नष्ट कर दे[a], और हर बुरे काम का अन्त हो जाएगा; और धार्मिकता और सत्यनिष्ठा का पौधा[b] प्रकट होगा, और वह आशीष बनेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे ‘और सारी हिंसा दूर हो जाएगी’ भी अनूदित किया गया है; परन्तु यहाँ गीज़ क्रिया आज्ञार्थक है: ‘नष्ट कर दे।’'
    reason: previous_rendering
  - marker: b
    text: या ‘धार्मिकता और सत्यनिष्ठा का रोपण।’ गीज़ संज्ञा रोपी हुई वस्तु अथवा रोपने की क्रिया या उसके परिणाम को सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: አሕጕል
  choice: नष्ट कर दे
  rationale: यह क्रिया द्वितीय पुरुष एकवचन की आज्ञा है और पहले से चले आ रहे सीधे आदेश को आगे बढ़ाती है; इसलिए इसे भविष्यकालीन कर्मवाच्य के बजाय स्पष्ट आज्ञार्थक रूप में रखा गया है।
- source_word: ኵሎ ግፍዓ
  choice: सारी हिंसा
  rationale: ግፍዓ में हिंसा, अत्याचार और अन्याय के अर्थ समाए हैं। इस न्याय और शुद्धीकरण के प्रसंग में ‘हिंसा’ उसका सामाजिक और नैतिक बल स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: እምገጸ ምድር
  choice: पृथ्वी के मुख पर से
  rationale: मूल मुहावरे में ‘मुख’ स्पष्ट रूप से उपस्थित है। इसे बनाए रखने से अपोकैलिप्टिक कथन की ऊँची शैली और सेमिटिक अभिव्यक्ति सुरक्षित रहती है।
- source_word: ኵሉ ምግባረ እኩይ
  choice: हर बुरा काम
  rationale: यह सामूहिक रूप से सभी दुष्कर्मों को समेटता है। ‘हर बुरा काम’ सामान्य आधुनिक हिन्दी में स्पष्ट और व्यापक है।
- source_word: ይኅልቅ
  choice: अन्त हो जाएगा
  rationale: क्रिया समाप्त होने या नष्ट हो जाने का बोध देती है। बुरे काम के विषय में ‘अन्त हो जाएगा’ स्वाभाविक रूप से उसके पूरी तरह रुक जाने को व्यक्त करता है।
- source_word: ያስተርኢ
  choice: प्रकट होगा
  rationale: क्रिया दिखाई देने या प्रकट किए जाने का अर्थ दे सकती है। ‘प्रकट होगा’ पौधे के उभरने की छवि और मूल की संभावित मध्य/कर्मवाच्य छाया दोनों के लिए उपयुक्त है।
- source_word: ተክለ
  choice: पौधा
  rationale: यह संज्ञा रोपी हुई वस्तु अथवा रोपने की क्रिया/परिणाम का संकेत दे सकती है। मुख्य पाठ में ‘पौधा’ रखने से कृषि-रूपक ठोस और समझने योग्य बना रहता है।
- source_word: ጽድቅ ወርትዕ
  choice: धार्मिकता और खराई
  rationale: ‘धार्मिकता’ ጽድቅ के न्यायपूर्ण और सही आचरण के अर्थ को तथा ‘खराई’ ርትዕ की सीधाई और नैतिक निष्कपटता को सहज हिन्दी में व्यक्त करती है।
- source_word: ይከውን ለበረከት
  choice: वह आशीष बनेगा
  rationale: मूल निर्माण का शाब्दिक भाव ‘आशीष के लिए होगा/बनेगा’ है। यह रूप परिणाम का भाव रखते हुए हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: आरम्भिक क्रिया का व्याकरणिक बल और सीधे सम्बोधन की निरन्तरता
  choice: इसे ‘नष्ट कर दे’ के रूप में एकवचन आज्ञा माना गया है।
  alternative: ‘सारी हिंसा दूर हो जाएगी’ जैसे भविष्यकालीन कर्मवाच्य के रूप में पढ़ना।
  rationale: गीज़ रूप और समानान्तर यूनानी साक्ष्य आज्ञार्थक अर्थ का समर्थन करते हैं; इससे परमेश्वर द्वारा दूत को दिया जा रहा सीधा आदेश सुरक्षित रहता है, बिना आदेश पाने वाले का नाम इस पद में जोड़ने के।
- issue: ‘धार्मिकता और खराई के पौधे’ की कृषि-छवि
  choice: ठोस अपोकैलिप्टिक रूपक ‘पौधा’ बनाए रखा गया है।
  alternative: इसे अमूर्त करके ‘धार्मिकता फले-फूलेगी’ कहना, अथवा ‘धार्मिकता और खराई का रोपण’ पढ़ना।
  rationale: मूल में कृषि-संबंधी संज्ञा है। ‘पौधा’ दृश्यात्मक तनाव को बनाए रखता है, जबकि वैकल्पिक ‘रोपण’ को पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर ‘पृथ्वी के मुख पर से’ और कृषि-रूपक को जानबूझकर बनाए रखा गया है ताकि मूल की गरिमामय, अपोकैलिप्टिक शैली नष्ट न हो। वाक्य में सरल भविष्यकाल और स्पष्ट आज्ञार्थक रूप सामान्य पाठक के लिए सुबोध हैं।
