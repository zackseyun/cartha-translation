base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/001.yaml
  text: 'Then the Most High[a], the Great and Holy One, spoke and sent Uriel to the son of Lamech[b], and said to him:'
translation:
  language: hi
  text: 'तब परमप्रधान, महान और पवित्र परमेश्वर ने कहा और ऊरीएल[a] को लामेक के पुत्र[b] के पास भेजा, और उससे कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस स्थान पर उपलब्ध इथियोपिक पाठ कुछ विकृत प्रतीत होता है; फिर भी निकट प्रसंग भेजे गए स्वर्गदूत का नाम ‘ऊरीएल’ होने का प्रबल समर्थन करता है।
    reason: textual_variant
  - marker: b
    text: इस पद में प्राप्तकर्ता को केवल ‘लामेक का पुत्र’ कहा गया है; व्यापक प्रसंग से स्पष्ट होता है कि वह नूह है।
    reason: cross_reference
lexical_decisions:
- source_word: አሜሃ
  choice: तब
  rationale: यह अगले दैवी कार्य को कथा के क्रम में जोड़ता है और समय का अनावश्यक विस्तार नहीं करता।
- source_word: ልዑል
  choice: परमप्रधान
  rationale: यह दैवी उपाधि का प्रचलित, गरिमापूर्ण और सहज हिन्दी रूप है।
- source_word: ዓቢይ፡ ወቅዱስ
  choice: महान और पवित्र जन
  rationale: दोनों विशेषणों की उपाधिसदृश शक्ति को बनाए रखते हुए हिन्दी में उन्हें संज्ञात्मक बनाया गया है; ‘जन’ किसी अतिरिक्त दैवी नाम को पाठ में नहीं जोड़ता।
- source_word: ተናገረ
  choice: कहा
  rationale: यह वाणी प्रकट करने वाली सामान्य क्रिया है; आगे आने वाले दूसरे कथन-सूत्र की पुनरावृत्ति स्रोत में भी है।
- source_word: ወፈነወ
  choice: भेजा
  rationale: दूत को कार्य पर भेजने का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: አሰርየ፡ ልዩር
  choice: ऊरीएल
  rationale: प्राप्त इथियोपिक पाठ इस स्थान पर कुछ विकृत प्रतीत होता है, पर निकट प्रसंग दूत का नाम ऊरीएल होने का प्रबल समर्थन करता है; नाम का अनुवाद नहीं, लिप्यंतरण किया गया है।
- source_word: ኀበ
  choice: के पास
  rationale: भेजे जाने की दिशा और व्यक्ति तक पहुँचने का स्वाभाविक हिन्दी संकेत।
- source_word: ወልደ፡ ላሜክ
  choice: लामेक के पुत्र
  rationale: स्रोत की वंश-सूचक अभिव्यक्ति को बनाए रखा गया है और मुख्य पाठ में उसका नाम नूह जोड़कर स्पष्ट नहीं किया गया।
- source_word: ወይቤሎ
  choice: और उससे कहा
  rationale: क्रिया के साथ लगे पुरुषवाचक प्रत्यय को ‘उससे’ द्वारा स्पष्ट रखा गया है।
theological_decisions:
- issue: दैवी उपाधियों के समूह का अनुवाद
  choice: परमप्रधान, महान और पवित्र जन
  alternative: परमप्रधान, महान और पवित्र परमेश्वर
  rationale: स्रोत कई दैवी विशेषणों को एक साथ उपाधियों की तरह रखता है। चुना हुआ रूप उनकी गरिमा और संज्ञात्मक बल को बचाता है, पर स्रोत में स्पष्ट रूप से न आया ‘परमेश्वर’ शब्द नहीं जोड़ता।
- issue: लामेक के पुत्र की पहचान
  choice: मुख्य पाठ में केवल ‘लामेक के पुत्र’
  alternative: ‘नूह’ नाम को मुख्य पाठ में रखना
  rationale: इस पद में व्यक्ति का नाम नहीं दिया गया; व्यापक प्रसंग उसे नूह के रूप में पहचानता है। इसलिए मूल की अंतर्निहितता को मुख्य पाठ में सुरक्षित रखकर पहचान को टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। स्रोत में ‘कहा/बोला’ और फिर ‘उससे कहा’ की पुनरावृत्ति होने के कारण उसे मिटाया नहीं गया। सभी टिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
