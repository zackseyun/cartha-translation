base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/014.yaml
  text: And when he burns and perishes[c][b][a], from now on they shall be bound together with them until the completion of the generations of generations.
translation:
  language: hi
  text: और जब वह जलेगा और नष्ट होगा,[a] तब से वे उनके साथ, एक साथ, पीढ़ियों की पीढ़ियों की पूर्णता तक बाँधे जाएंगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरम्भिक क्रियारूप उपलब्ध पाठ-साक्ष्य में कठिन और चिह्नित है। नवीन स्रोत-समीक्षा के अनुसार इसका अर्थ ‘वह जलता है/जलेगा’ है और अगले क्रियारूप का अर्थ ‘नष्ट होता है/होगा’। एक पूर्ववर्ती अनुवाद में इसे ‘वे और उनके पुत्र उठ खड़े हों’ समझा गया था।
    reason: textual_variant
  - marker: b
    text: ‘पीढ़ियों की पीढ़ियाँ’ मूल की पुनरुक्त अभिव्यक्ति है, जो पीढ़ियों के एक दीर्घ क्रम को सूचित करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሶበ
  choice: और जब
  rationale: यह कालसूचक संयोजक है, जो न्याय के अगले चरण को पिछले कथन से जोड़ता है।
- source_word: †ይውዒ፡† ወይማስን
  choice: वह जलकर नष्ट हो जाएगा
  rationale: नवीनतम स्रोत-समीक्षा के अनुसार पहले क्रियारूप का अर्थ ‘जलना’ और दूसरे का ‘नष्ट होना’ है। हिन्दी में संयुक्त क्रिया दोनों क्रियाओं का क्रम और एकवचन कर्ता बनाए रखती है; पाठगत कठिनाई पादटिप्पणी में बताई गई है।
- source_word: እምይእዜ
  choice: तब से
  rationale: इसका कालगत अर्थ ‘अब से/उस समय से आगे’ है। ‘तब से’ जब-वाक्य के साथ स्वाभाविक हिन्दी है।
- source_word: ምስሌሆሙ ኅቡረ
  choice: उनके साथ मिलकर
  rationale: सहभागिता और सामूहिकता—दोनों अर्थों को व्यक्त करता है।
- source_word: ይትአሰሩ
  choice: बाँधे रहेंगे
  rationale: यह बन्धन अथवा निरोध का न्याय-संबंधी क्रियारूप है। ‘बाँधे रहेंगे’ आगामी अवधि तक जारी दशा को व्यक्त करता है, बिना ‘कैद’ जैसी अधिक व्याख्यात्मक संज्ञा जोड़े।
- source_word: እስከ ተፍጻሜተ
  choice: पूरा होने तक
  rationale: समाप्ति-बिंदु तक चलने वाली अवधि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ትውልደ፡ ትውልድ
  choice: पीढ़ियों की पीढ़ियों
  rationale: मूल की पुनरुक्त, गंभीर काल-अभिव्यक्ति को सुरक्षित रखता है; इसे सीधे ‘अनन्तकाल’ नहीं बनाया गया।
theological_decisions:
- issue: दण्ड की अवधि और सीमा
  choice: ‘पीढ़ियों की पीढ़ियों के पूरा होने तक’—एक नियत, दीर्घ कालावधि
  alternative: सदा के लिए बन्धन; अथवा केवल अन्तिम न्याय तक बन्धन
  rationale: गीज़ पाठ में ‘तक’ तथा ‘पूरा होने’ का समाप्तिसूचक वाक्यांश है और उसके बाद पीढ़ियों की पुनरुक्ति है। अनुवाद इस कालगत तनाव को किसी बाद की सिद्धान्तगत श्रेणी में नहीं बदलता।
- issue: पहले उपवाक्य का कर्ता और क्रियाएँ
  choice: एकवचन ‘वह’ के साथ ‘जलकर नष्ट हो जाएगा’
  alternative: ‘वे और उनके पुत्र उठ खड़े हों’
  rationale: उपलब्ध नवीन स्रोत-समीक्षा ይውዒ को ‘वह जलता है’ और ወይማስን को ‘और नष्ट होता है’ मानती है। फिर भी चिह्नित पाठगत कठिनाई के कारण अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सुबोध शैली। ‘तब से’, ‘साथ मिलकर’ और ‘बाँधे रहेंगे’ स्वाभाविक हिन्दी देते हैं, जबकि ‘पीढ़ियों की पीढ़ियों’ मूल की असामान्य किंतु अर्थपूर्ण पुनरुक्ति को सुरक्षित रखता है।
