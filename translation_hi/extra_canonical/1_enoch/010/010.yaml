base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/010.yaml
  text: And these things that they ask of you shall not be granted to their fathers on their behalf[a]; for they hope to live an everlasting life[d][c][b], and each one of them will live five hundred years.
translation:
  language: hi
  text: और जो बातें वे तुमसे माँगते हैं, वे उनकी ओर से उनके पिताओं को नहीं दी जाएँगी[a]; क्योंकि वे आशा करते हैं कि वे अनन्त जीवन जिएँगे, और उनमें से हर एक पाँच सौ वर्ष[b] जीवित रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उनकी ओर से” में “उनकी” किस समूह की ओर संकेत करती है, यह गीज़ पाठ में संक्षिप्त और कुछ अस्पष्ट है; इसका संबंध पिताओं या उनकी सन्तानों से समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से “पाँच सौ शीतकाल”; यहाँ “शीतकाल” वर्षों की गणना का मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: ዘይስእሉከ
  choice: जो बातें वे तुमसे माँगते हैं
  rationale: सापेक्ष रूप और द्वितीय पुरुष प्रत्यय को ‘जो बातें वे तुमसे माँगते हैं’ के रूप में लिया गया है। इससे निवेदन की वस्तु स्पष्ट होती है और ‘तुम्हारे विषय में पूछते हैं’ वाला असमर्थित अर्थ नहीं आता।
- source_word: ኢይከውኑ ለአበዊሆሙ
  choice: उनके पिताओं को नहीं दी जाएँगी
  rationale: ‘होना’ क्रिया के साथ ‘के लिए/को’ सूचक पूर्वसर्ग यहाँ निवेदन के स्वीकार या प्रदान किए जाने का भाव देता है। हिन्दी में निष्क्रिय ‘दी जाएँगी’ इस मुहावरे को स्वाभाविक और संदर्भानुकूल ढंग से व्यक्त करता है।
- source_word: በእንቲአሆሙ
  choice: उनकी ओर से
  rationale: यह कारण, हित या प्रतिनिधित्व का संबंध व्यक्त कर सकता है। ‘उनकी ओर से’ निवेदन-संदर्भ में स्वाभाविक है, जबकि सर्वनाम का संदर्भ पादटिप्पणी में खुला रखा गया है।
- source_word: ይሴፈዉ
  choice: वे आशा करते हैं
  rationale: यह क्रिया ‘आशा करना/अपेक्षा रखना’ के अर्थ में है; इसे ‘काट डाले जाएँगे’ जैसे न्याय-संबंधी अर्थ में लेना मूल शब्द के अनुकूल नहीं है।
- source_word: ይኅየዉ ሕይወተ ዘለዓለም
  choice: वे अनन्त जीवन जिएँगे
  rationale: मूल का निकट अर्थ ‘अनन्त जीवन जीना’ है। यह हिन्दी में स्वाभाविक रहते हुए वाक्य की असामान्य और धर्मवैचारिक रूप से तनावपूर्ण आशा को सुरक्षित रखता है।
- source_word: አሐዱ አሐዱ እምኔሆሙ
  choice: उनमें से हर एक
  rationale: ‘एक-एक’ की पुनरुक्ति वितरणात्मक है; ‘उनमें से हर एक’ उसका स्पष्ट आधुनिक हिन्दी रूप है।
- source_word: ኃምስተ ምእተ ክረምተ
  choice: पाँच सौ वर्ष
  rationale: शाब्दिक संज्ञा ‘शीतकाल’ है, पर आयु गिनने में इसका मुहावरेदार अर्थ ‘वर्ष’ है। शाब्दिक बिंब पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: पिताओं की ओर से की गई माँग और दीर्घ जीवन की आशा के बीच संबंध
  choice: पाठ को निवेदनों के अस्वीकार और पिताओं की अनन्त तथा पाँच सौ वर्ष के जीवन की आशा के रूप में रखा गया है।
  alternative: इसे सन्तानों के अपने पिताओं जैसा न बनने और सन्तानों को दीर्घ जीवन मिलने की तुलना माना जा सकता था।
  rationale: ‘होना’ के साथ दत्तिवाचक पूर्वसर्ग यहाँ ‘किसी को प्रदान होना’ का भाव देता है, और ይሴፈዉ का अर्थ ‘आशा करना’ है। इसलिए मूल में उपस्थित असफल निवेदन और जीवन की आशा का तनाव बिना सामंजस्य बिठाए बनाए रखा गया है।
- issue: ‘उनकी’ सर्वनाम का संदर्भ
  choice: मुख्य पाठ में सर्वनाम को सामान्य रखा गया और उसकी संदर्भगत अस्पष्टता पादटिप्पणी में बताई गई।
  alternative: स्पष्ट रूप से ‘उनके बच्चों की ओर से’ या ‘पिताओं की ओर से’ कहा जा सकता था।
  rationale: गीज़ वाक्य रचना में संदर्भ संक्षिप्त है; किसी एक समूह को स्पष्टतः जोड़ना मूल की वास्तविक अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण लेकिन सहज वाक्य-विन्यास रखा गया है। ‘अनन्त जीवन जिएँगे’ मूल अभिव्यक्ति के निकट है, और ‘पाँच सौ वर्ष जीवित रहेगा’ सामान्य पाठक के लिए स्पष्ट है। सर्वनामों की वास्तविक अस्पष्टता को मुख्य पाठ में नहीं मिटाया गया।
