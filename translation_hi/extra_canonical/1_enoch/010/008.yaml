base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/008.yaml
  text: And the whole earth has been corrupted by the teaching of the works of Azazel[c][b][a]; and to him ascribe all sin.
translation:
  language: hi
  text: और अज़ाज़ेल के कामों की शिक्षा से सारी पृथ्वी भ्रष्ट हो गई है[a]; और उसके विरुद्ध सारे पाप लिख दे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अज़ाज़ेल के कामों के विषय में दी गई शिक्षा से।” मूल अभिव्यक्ति में शिक्षा और किए जाने वाले काम या प्रथाएँ—दोनों भाव जुड़े हैं।
    reason: lexical_alternative
  - marker: b
    text: अर्थात उसके नाम पर न्यायिक रूप से दोष दर्ज कर। इसे “सारे पाप उसी के खाते में डाल दे” भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ማሰነት
  choice: भ्रष्ट हो गई है
  rationale: यह क्रिया बिगाड़े या भ्रष्ट किए जाने का बोध देती है; यह रूप न्याय-संदर्भ में नैतिक और व्यापक प्रभाव को बनाए रखता है।
- source_word: ኵላ ምድር
  choice: सारी पृथ्वी
  rationale: इस प्रलयकारी संदर्भ में अभिव्यक्ति का आशय किसी स्थानीय देश के बजाय समूची पृथ्वी है।
- source_word: በትምህርተ ግብሩ ለአዛዝኤል
  choice: अज़ाज़ेल के कामों की शिक्षा से
  rationale: यह अनुवाद शिक्षा और ठोस कामों—दोनों तत्त्वों को बनाए रखता है तथा कामों का संबंध अज़ाज़ेल से स्पष्ट करता है।
- source_word: ወላዕሌሁ
  choice: और उसके विरुद्ध
  rationale: ወ संयोजक 'और' है, जबकि ላዕሌሁ यहाँ न्यायिक प्रसंग में 'उसके विरुद्ध' का बल रखता है।
- source_word: ጸሐፍ
  choice: लिख दे
  rationale: यह एकवचन आज्ञार्थक क्रिया है; 'लिख दे' दोष को न्यायिक अभिलेख में दर्ज करने की आज्ञा को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ኵሎ ኃጢአተ
  choice: सारे पाप
  rationale: यह व्यापक दोषारोपण को व्यक्त करता है; हिन्दी में 'सारे पाप' स्वाभाविक रहते हुए मूल की समग्रता बनाए रखता है।
theological_decisions:
- issue: अंतिम उपवाक्य में अज़ाज़ेल पर पाप लिखने या उसे पाप का दोषी ठहराने का अर्थ
  choice: उसके विरुद्ध सारे पाप लिख दे
  alternative: सारे पाप उसी के खाते में डाल दे
  rationale: मूल क्रिया लिखने की ठोस छवि और पूर्वसर्ग का 'विरुद्ध' अर्थ सुरक्षित रखना न्यायिक दोषारोपण को व्यक्त करता है, पर उसे केवल व्याख्यात्मक 'दोषी ठहरा' में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। 'कामों की शिक्षा' की हल्की असामान्यता जानबूझकर रखी गई है ताकि गीइज़ मूल में शिक्षा और कर्म के संयुक्त भाव को मिटाया न जाए।
