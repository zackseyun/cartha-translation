base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/002.yaml
  text: Go to Noah and say to him in my name[a], 'Hide yourself!' And reveal to him the end that is coming; for the whole earth will be destroyed, and a flood is about to come upon all the earth[c][b], and it will destroy whatever is in it.
translation:
  language: hi
  text: नूह के पास जा[a] और उससे मेरे नाम से कह, “अपने आप को छिपा ले!” फिर उसे आनेवाला अंत प्रकट कर[b]; क्योंकि सारी पृथ्वी नष्ट हो जाएगी। जलप्रलय का पानी सारी पृथ्वी पर आनेवाला है[c], और वह उसमें जो कुछ है, उसे नष्ट कर देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध गीज़ संस्करण में “नूह के पास जा और” शब्द कोष्ठकों में दिए गए हैं, जो उनकी पाठगत स्थिति के विषय में कुछ अनिश्चितता दर्शाते हैं।
    reason: textual_variant
  - marker: b
    text: “अंत” का अर्थ “समापन” भी हो सकता है; यहाँ प्रसंग पृथ्वी पर आनेवाले जलप्रलय के विनाश का है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “जलप्रलय का पानी”; मूल पाठ पानी और जलप्रलय दोनों शब्दों का प्रयोग करता है।
    reason: literal_wording
lexical_decisions:
- source_word: ሖር፡ ለኖኅ፡ ወ
  choice: नूह के पास जा और
  rationale: आरम्भिक आज्ञा और गन्तव्य दोनों को स्पष्ट रखा गया है। उपलब्ध संस्करण में ये शब्द कोष्ठकों में हैं, इसलिए उनकी पाठगत स्थिति पादटिप्पणी में बताई गई है।
- source_word: በሎ፡ በስመ፡ ዚአየ
  choice: उससे मेरे नाम से कह
  rationale: यह वाक्य दूत को नूह तक अधिकारपूर्वक सन्देश पहुँचाने की आज्ञा देता है; ‘मेरे नाम से’ स्रोत की प्राधिकार-सूचक अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है।
- source_word: ኅባእ፡ ርእሰከ
  choice: अपने आप को छिपा ले
  rationale: प्रत्यक्ष वचन में नूह को दी गई आत्मवाचक आज्ञा को सहज और तात्कालिक हिन्दी में व्यक्त किया गया है।
- source_word: ወአግህድ፡ ሎቱ
  choice: फिर उस पर … प्रकट कर
  rationale: यह आज्ञा दूत को दी गई है और ‘उस पर’ नूह को सूचित करता है। इसे नूह से कहलाए गए प्रत्यक्ष वचन के बाहर रखा गया है, जिससे मूल वाक्य की कर्ता-संरचना बनी रहती है।
- source_word: ፍጻሜ፡ ዘይመጽእ
  choice: आनेवाला अन्त
  rationale: ፍጻሜ में अन्त या पूर्णता दोनों का भाव हो सकता है। यहाँ निकटवर्ती जलप्रलय के विनाशकारी सन्दर्भ के कारण ‘अन्त’ उपयुक्त है, पर इसे तकनीकी अन्तकालीन पद नहीं बनाया गया।
- source_word: ይትኃጐል፡ ምድር፡ ኵሉ
  choice: सारी पृथ्वी नष्ट हो जाएगी
  rationale: निष्क्रिय विनाश और उसके व्यापक क्षेत्र को सीधे तथा गम्भीर रूप में व्यक्त करता है।
- source_word: ማየ፡ አይኅ
  choice: जलप्रलय का पानी
  rationale: स्रोत में ‘पानी’ और ‘जलप्रलय’ दोनों का स्पष्ट उल्लेख है। यह हिन्दी में असामान्य हुए बिना उस दोहरी जल-छवि को बचाता है।
- source_word: ሀሎ፡ ዲበ፡ ኵሉ፡ ምድር
  choice: सारी पृथ्वी पर आनेवाला है
  rationale: आसन्न आगमन और समस्त पृथ्वी पर उसके आने—दोनों को सुरक्षित रखा गया है।
- source_word: ወያኀጕል፡ ዘሀሎ፡ ውስቴታ
  choice: और वह उसमें जो कुछ है, उसे नष्ट कर देगा
  rationale: ‘जो कुछ है’ मूल की समावेशी व्यापकता रखता है और ऐसी श्रेणियाँ नहीं जोड़ता जो स्रोत में स्पष्ट नहीं हैं।
theological_decisions:
- issue: ‘आनेवाला अन्त’ का दायरा
  choice: इसे जलप्रलय से जुड़ा निकट आता विनाशकारी अन्त माना गया है।
  alternative: इसे सृष्टि का परम अन्त या तकनीकी अन्तकालीन ‘समापन’ कहना।
  rationale: तात्कालिक सन्दर्भ पृथ्वी पर आनेवाले जलप्रलय का है। अनुवाद उसकी प्रलयात्मक गम्भीरता रखता है, पर बाद की अन्तकालीन धर्मवैज्ञानिक अवधारणाएँ इसमें नहीं जोड़ता।
- issue: ‘प्रकट कर’ की आज्ञा का कर्ता और प्राप्तकर्ता
  choice: आज्ञा दूत को दी गई है कि वह नूह पर आनेवाला अन्त प्रकट करे।
  alternative: ‘प्रकट कर’ को नूह से कहे गए प्रत्यक्ष वचन के भीतर रखकर नूह को उसका कर्ता बनाना।
  rationale: गीज़ वाक्यक्रम में ‘उसे’ नूह की ओर संकेत करता है और आज्ञा का सम्बोधन दूत से जारी रहता है; प्रत्यक्ष वचन ‘अपने आप को छिपा ले’ के बाद समाप्त करना अर्थगत उलझन से बचाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमामय किन्तु सामान्य पाठक के लिए सहज रखी गई है। ‘तू’ के बजाय प्रत्यक्ष आज्ञा में स्वाभाविक आत्मवाचक रूप ‘अपने आप को छिपा ले’ अपनाया गया है। ‘जलप्रलय’ प्राचीन महाविनाशकारी बाढ़ के लिए परिचित और उपयुक्त पद है। विराम-चिह्नों द्वारा नूह से कहे गए छोटे प्रत्यक्ष वचन और दूत को दी गई अगली आज्ञा का भेद स्पष्ट किया गया है।
