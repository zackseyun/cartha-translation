    text: इस वाक्यांश का अनुवाद “सभी पीढ़ियों के लिए, सर्वदा” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: प्रस्तुत गीइज़ प्रतिलिपि में क्रिया का पाठ संदिग्ध है। व्याकरण और प्राचीन यूनानी समानांतर पाठ “उसका वंश बना रहे” का समर्थन करते हैं; प्रतिलिपि को ज्यों का त्यों पढ़ने पर अर्थ “करे/स्थापित करे” निकल सकता है।
