theological_decisions:
- issue: क्या पद किसी व्यक्ति द्वारा उसके वंश को सक्रिय रूप से बचाने की आज्ञा देता है, या उसके वंश के बने रहने की प्रतिज्ञा व्यक्त करता है
  choice: उसका वंश ... बना रहे
  alternative: वह अपने वंश को बचाए रखे
  rationale: गीइज़ संज्ञा का कर्ता-रूप और संशोधित क्रिया-पाठ वंश को उपवाक्य का कर्ता बताते हैं। यह आने वाले न्याय में वंश के निरंतर बने रहने का भाव रखता है, पर उसके जैविक अथवा आध्यात्मिक अर्थ को अतिरिक्त रूप से निर्धारित नहीं करता।
