base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/004.yaml
  text: And again the Lord said to Raphael[a], “Bind Azazel by his hands and his feet, and cast him into the darkness; and open the desert that is in Dudael[b], and cast him there.”
translation:
  language: hi
  text: और प्रभु ने फिर[a] रफ़ाएल से कहा, “अज़ाज़ेल के हाथ-पाँव बाँध दो और उसे अंधकार में फेंक दो। दूदाएल में जो मरुभूमि है, उसे चीरकर खोल दो[b] और उसे वहीं फेंक दो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘फिर’ के अनुरूप गीइज़ शब्द मूल साक्ष्य के इस पाठ में कोष्ठकों में दिया गया है; इससे उसके पाठगत दर्जे के बारे में कुछ अनिश्चितता सूचित होती है।
    reason: textual_variant
  - marker: b
    text: ‘मरुभूमि को चीरकर खोल दो’ वाला आदेश पाठ की दृष्टि से कठिन है। कुछ लोग इसे मरुभूमि में गड्ढे जैसा स्थान खोलने या तैयार करने का आदेश समझते हैं, पर गीइज़ साक्ष्य में ‘गड्ढा’ स्पष्ट रूप से नहीं कहा गया। दूदाएल को एक स्थान-नाम मानकर लिप्यंतरित किया गया है।
    reason: textual_and_cultural_note
lexical_decisions:
- source_word: ካዕበ
  choice: फिर
  rationale: यह पद क्रम में दोबारा कही गई बात को सूचित करता है। ‘फिर’ आधुनिक हिन्दी में स्वाभाविक है और कथात्मक पुनरावृत्ति बनाए रखता है।
- source_word: እግዚእ
  choice: प्रभु
  rationale: यहाँ यह परमेश्वर के लिए प्रयुक्त उपाधि है; ‘प्रभु’ प्रतिष्ठित और सर्वसुलभ हिन्दी रूप है।
- source_word: እሰሮ ለአዛዝኤል በእዴሁ ወእግሩ
  choice: अज़ाज़ेल के हाथ-पाँव बाँध दो
  rationale: मूल पाठ हाथ और पाँव दोनों को स्पष्ट रूप से कहता है। यह रूप शारीरिक बंधन की ठोस छवि को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ወድዮ
  choice: उसे ... फेंक दो
  rationale: दो बार आया आदेश बलपूर्वक हटाकर निर्दिष्ट स्थान में डालने का भाव रखता है; हिन्दी में इसकी पुनरावृत्ति भी बनाए रखी गई है।
- source_word: ውስተ ጽልመት
  choice: अंधकार में
  rationale: यह दंडात्मक अंधकार के स्थान अथवा दशा को व्यक्त करता है। हिन्दी में अनावश्यक व्याख्या जोड़े बिना दोनों संभावनाएँ बनी रहती हैं।
- source_word: ወአብቅዋ ለገዳም
  choice: मरुभूमि ... चीरकर खोल दो
  rationale: क्रिया खोलने या चीरने का तीखा चित्र देती है और संज्ञा निर्जन मरुभूमि को दर्शाती है। ‘गड्ढा खोदो’ जैसी ऐसी बात नहीं जोड़ी गई जो इस साक्ष्य में स्पष्ट नहीं है।
- source_word: እንተ ሀለወት በዱዳኤል
  choice: दूदाएल में जो मरुभूमि है
  rationale: सम्बन्धवाचक वाक्यांश मरुभूमि का स्थान बताता है। दूदाएल को स्थान-नाम मानकर लिप्यंतरित किया गया है।
- source_word: ህየ
  choice: वहीं
  rationale: यह पीछे उल्लिखित दूदाएल की मरुभूमि की ओर संकेत करता है; ‘वहीं’ हिन्दी में उस निश्चित गंतव्य को स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: अज़ाज़ेल के दंड का स्वरूप
  choice: हाथ-पाँव बाँधकर अंधकारमय मरुभूमि में बलपूर्वक डालने का ठोस दंड
  alternative: सामान्य कारावास या केवल प्रतीकात्मक आध्यात्मिक अंधकार
  rationale: मूल पाठ हाथ, पाँव, अंधकार, मरुभूमि और दोहराए गए ‘फेंक दो’ के द्वारा अत्यंत भौतिक दंड-चित्र प्रस्तुत करता है। अनुवाद उसे अमूर्त आध्यात्मिक भाषा में नहीं बदलता।
- issue: मरुभूमि को खोलने की कठिन अभिव्यक्ति
  choice: उसे ‘चीरकर खोल दो’ के रूप में ठोस किंतु व्याख्याहीन रखना
  alternative: ‘वहाँ एक गड्ढा खोदो’ या ‘कारागार तैयार करो’
  rationale: गड्ढे या कारागार का विचार प्रसंग से अनुमानित हो सकता है, पर उपलब्ध गीइज़ पाठ में वह स्पष्ट रूप से व्यक्त नहीं है; इसलिए वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और कथात्मक रूप अपनाया गया है। ‘हाथ-पाँव’, ‘अंधकार’ और दो बार आए ‘फेंक दो’ से मूल की ठोस प्रलय-दर्शी दंड-छवि बनी रहती है; कठिन वाक्यांश को व्याख्या से समतल नहीं किया गया।
