  yaml_path: translation/extra_canonical/1_enoch/010/009.yaml
  text: And to Gabriel the Lord said[a], “Go against the bastards and the reprobates, and against the children of fornication; destroy the children of fornication and the children of the Watchers from among humankind. Send them out against one another, and let them perish in battle[d][c][b]; for length of days shall not be theirs.”
translation:
  language: hi
  text: फिर प्रभु ने गब्रिएल से कहा, “जारजों[a], त्याज्यों और व्यभिचार से उत्पन्न संतानों के विरुद्ध जा। व्यभिचार से उत्पन्न संतानों और पहरेदारों की संतानों[b] को मनुष्यों के बीच से नष्ट कर दे। उन्हें एक-दूसरे के विरुद्ध भेज दे[c], और वे युद्ध में नष्ट हो जाएँ[d]; क्योंकि उन्हें दीर्घायु नहीं मिलेगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात “अवैध संबंध से उत्पन्न संतान।” गीइज़ का शब्द ऐसी संतान के लिए कठोर और अपमानसूचक नाम है।
    reason: lexical_alternative
  - marker: b
    text: “पहरेदारों की संतान” वाले वाक्यांश का पाठ कठिन है। उपलब्ध पाठ में ለውሉደ፡ ትጉሃን मिलता है; आस-पास के पहरेदार-वृत्तांत के आधार पर यह अर्थ लिया गया है, पर कुछ अनिश्चितता बनी हुई है।
    reason: textual_variant
  - marker: c
    text: एक कोष्ठकित पाठ में “और उन्हें भेज दे” भी आता है। ठीक क्रियात्मक क्रम अनिश्चित है, हालांकि उन्हें परस्पर संघर्ष में लगाने का भाव स्पष्ट है।
    reason: textual_variant
  - marker: d
    text: प्रसंग के अनुसार इसका अर्थ “वे युद्ध में एक-दूसरे का नाश कर डालें” भी समझा जा सकता है; मुख्य पाठ गीइज़ क्रिया के निष्क्रिय/अकर्मक भाव को बनाए रखता है।
    reason: previous_rendering
