- issue: नैतिक रूप से कठोर वंश-संबंधी भाषा
  choice: मुख्य पाठ में स्रोत का कठोर, कलंकसूचक स्वर बनाए रखा गया।
  alternative: हर स्थान पर केवल ‘अवैध संतान’ जैसा नरम और प्रशासनिक पद रखना।
  rationale: यह सर्वनाशकारी न्याय की घोषणा है। भाषा को पूरी तरह नरम करने से मूल की वाक्पटुता और नैतिक तीव्रता घट जाती।
- issue: युद्ध में विनाश की व्याकरणिक वाच्यता
  choice: ‘वे युद्ध में नष्ट हो जाएँ’
  alternative: ‘वे युद्ध में एक-दूसरे को नष्ट कर दें’
  rationale: प्रसंग परस्पर हिंसा दिखाता है, पर गीइज़ क्रिया निष्क्रिय/अकर्मक रूप में विनाश को व्यक्त करती है। मुख्य पाठ व्याकरणिक रूप को रखता है और सक्रिय पारस्परिक अर्थ को पादटिप्पणी में विकल्प के रूप में देता है।
