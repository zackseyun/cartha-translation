base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/011.yaml
  text: And to Michael the Lord said[a], “Go, bind Shemihazah and the others with him[c][b], who joined themselves with women so as to defile themselves with them in their uncleanness.”
translation:
  language: hi
  text: और प्रभु ने मीकाएल से कहा, “जाओ, शमीहज़ाह और उसके साथ के उन दूसरों को बाँध दो[a], जिन्होंने अपने को स्त्रियों के साथ जोड़ लिया, ताकि[b] वे उनके साथ उनकी अशुद्धता में अपने आपको अशुद्ध करें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शमीहज़ाह के नाम से पहले आया आज्ञार्थक शब्द उपलब्ध पाठ में कठिन है; अध्याय का संदर्भ और व्यापक पाठ-साक्ष्य यहाँ “बाँध दो” अर्थ का समर्थन करते हैं।
    reason: textual_variant
  - marker: b
    text: या “जिससे वे”; मूल अभिव्यक्ति को उद्देश्य अथवा परिणाम, दोनों अर्थों में समझा जा सकता है।
    reason: translation_ambiguity
lexical_decisions:
- source_word: ለሚካኤል
  choice: मीकाएल से
  rationale: व्यक्तिनाम को गीइज़ रूप के निकट देवनागरी में लिप्यंतरित किया गया है; ‘से’ हिन्दी में कहे जाने के प्राप्तकर्ता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ይቤ እግዚእ
  choice: प्रभु ने कहा
  rationale: गीइज़ पाठ में वचन-क्रिया के साथ स्पष्ट कर्ता ‘प्रभु’ है; हिन्दी में स्वाभाविक कर्ता–कर्म–क्रिया क्रम अपनाया गया है।
- source_word: ሑር
  choice: जाओ
  rationale: यह प्रस्थान का आज्ञार्थक रूप है; ‘जाओ’ संक्षिप्त, स्वाभाविक और आदेशात्मक बल को बनाए रखता है।
- source_word: አይድዕ
  choice: बाँध दो
  rationale: प्राप्त रूप पाठगत रूप से कठिन है, पर अध्याय का न्याय-संदर्भ और व्यापक पाठ-साक्ष्य शमीहज़ाह तथा उसके साथियों को बाँधने की आज्ञा का समर्थन करते हैं।
- source_word: ለስምያዛ
  choice: शमीहज़ाह
  rationale: प्रहरी-प्रधान के नाम का पहचानने योग्य, स्रोत-सन्निकट हिन्दी लिप्यंतरण चुना गया है।
- source_word: ወለካልኣን እለ ምስሌሁ
  choice: और उसके साथ के उन दूसरों को
  rationale: यह शमीहज़ाह के साथ वालों को सामूहिक रूप से बताता है, बिना उनके पद या संबंध को आवश्यकता से अधिक परिभाषित किए।
- source_word: እለ ሐብሩ ምስለ አንስት
  choice: जिन्होंने अपने को स्त्रियों के साथ जोड़ लिया
  rationale: यह जानबूझकर किए गए अनुचित मेल को व्यक्त करता है, पर मूल से अधिक स्पष्ट यौन शब्दावली नहीं जोड़ता।
- source_word: ከመ ይማስኑ
  choice: जिससे वे…स्वयं अशुद्ध हो गए
  rationale: ‘जिससे’ उद्देश्य और परिणाम के बीच मूल संबंध को पर्याप्त रूप से खुला रखता है; आत्मवाचक भाव ‘स्वयं’ से सुरक्षित है।
- source_word: በርኵሶ ዚአሆን
  choice: उन स्त्रियों की अशुद्धता में
  rationale: प्रत्यय स्त्रीलिंग बहुवचन की ओर संकेत करता है, इसलिए ‘उन स्त्रियों की’ से संबंध स्पष्ट किया गया; ‘अशुद्धता’ नैतिक और रीति-संबंधी दोनों अर्थछायाएँ बनाए रखता है।
theological_decisions:
- issue: स्त्रियों के साथ मेल से जुड़ी अशुद्धता का स्वरूप
  choice: पद की भाषा के अनुसार ‘जोड़ लिया’ और ‘अशुद्धता’ कहा गया है, पर पाप को किसी बाद की विशिष्ट धर्मवैज्ञानिक श्रेणी में सीमित नहीं किया गया।
  alternative: इसे केवल यौन भ्रष्टता, केवल रीति-संबंधी अशुद्धता, या सामान्य दुष्टता के रूप में स्पष्ट करना।
  rationale: मूल पाठ मेल और अशुद्धता को जोड़ता है, पर उनके धर्मवैज्ञानिक संबंध को पूरी तरह परिभाषित नहीं करता।
- issue: ከመ द्वारा व्यक्त उद्देश्य या परिणाम
  choice: मुख्य पाठ में ‘जिससे’ रखा गया है।
  alternative: ‘ताकि वे’ पढ़ना।
  rationale: गीइज़ संयोजक उद्देश्य अथवा परिणामी आशय दे सकता है; अनुवाद और पादटिप्पणी इस वास्तविक अस्पष्टता को सुरक्षित रखते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। नाम स्रोत के निकट देवनागरी में लिप्यंतरित हैं। वाक्य में मूल की न्यायात्मक और अशुद्धता-संबंधी शब्दावली सुरक्षित है, जबकि अनावश्यक सांप्रदायिक या व्याख्यात्मक विस्तार से बचा गया है।
