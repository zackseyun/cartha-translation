- issue: ኵነኔ को व्यापक न्याय या संकुचित दण्डादेश के रूप में प्रस्तुत करना
  choice: न्याय
  alternative: दण्डादेश
  rationale: ‘न्याय’ न्यायिक घटना और उसके परिणाम दोनों की सम्भावना खुली रखता है तथा मूल की अर्थ-व्याप्ति को समय से पहले संकुचित नहीं करता।
