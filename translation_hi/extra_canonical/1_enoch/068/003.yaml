base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/003.yaml
  text: And Mikael answered again and said to Rufael, "Who is he whose heart is not softened concerning it, and whose kidneys are not troubled by this word of severity and the sentence that has gone out against them because of those who brought them out thus?"
translation:
  language: hi
  text: और मीकाएल ने फिर उत्तर दिया और रूफाएल से कहा, “वह कौन है जिसका हृदय इस विषय के प्रति[a] कोमल नहीं होता और जिसकी गुर्दियाँ[b] इस कठोर वचन और उस दंडादेश से व्याकुल नहीं होतीं, जो उन पर उन लोगों के कारण निकला है जिन्होंने उन्हें इस प्रकार बाहर निकाला?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘इस विषय के प्रति’ जिस बात की ओर संकेत करता है, वह मूल पाठ में स्पष्ट नहीं है; इसका अर्थ ‘इसके कारण’ भी हो सकता है।
    reason: referential_ambiguity
  - marker: b
    text: शाब्दिक रूप से ‘गुर्दियाँ’। प्राचीन सेमीय भाषा में गुर्दे मनुष्य के भीतरी भावों या अंतरतम के लिए प्रयुक्त शारीरिक बिंब हैं; अर्थ ‘जिसका अंतरतम व्याकुल नहीं होता’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इथियोपिक पाठ का अंतिम उपवाक्य कठिन है, विशेषकर कोष्ठकित शब्द के कारण। इसका अधिक शाब्दिक रूप ‘उनमें से/उनसे, जिन्होंने उन्हें इस प्रकार बाहर निकाला’ समझा जा सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: አውሥአ ካዕበ
  choice: फिर उत्तर देकर
  rationale: ካዕበ पुनरावृत्ति का बोध कराता है। यह चयन गीइज़ की कथात्मक अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ሚካኤል ለሩፋኤል
  choice: मीकाएल ... रूफाएल से
  rationale: व्यक्तिनामों को गीइज़ रूपों के निकट देवनागरी में लिप्यंतरित किया गया है; उन्हें अधिक परिचित परंपरागत रूपों में सामान्यीकृत नहीं किया गया।
- source_word: ዘኢይረክሕ ልቡ
  choice: जिसका हृदय ... कोमल नहीं पड़ता
  rationale: क्रिया के नरम, कोमल अथवा द्रवित होने के मूर्त भाव को सुरक्षित रखा गया है; इसे केवल ‘प्रभावित नहीं होता’ जैसे अमूर्त कथन में नहीं बदला गया।
- source_word: ዲቤሃ
  choice: इस विषय में
  rationale: सर्वनाम का पूर्वपद संदिग्ध है। ‘इस विषय में’ जानबूझकर संयत है और संदर्भ को निश्चित नहीं करता।
- source_word: ኢይትሀወክ ኵልያቲሁ
  choice: जिसकी गुर्दियाँ ... व्याकुल नहीं होतीं
  rationale: ‘गुर्दियाँ’ प्राचीन शारीरिक रूपक को बनाए रखता है, जबकि ‘व्याकुल’ भीतर की हलचल या अशांति व्यक्त करता है।
- source_word: ቃለ ጽነኒ
  choice: कठोरता का यह वचन
  rationale: यह गंभीर और कठोर घोषणा का भाव देता है तथा न्यायिक-प्रलयदर्शी शैली को बनाए रखता है। मुख्य पाठ में कारक-संबंध के अनुसार ‘कठोरता के इस वचन’ आया है।
- source_word: ፅእት ዲቤሆሙ
  choice: वह दण्डादेश ... जो उन पर ... निकला है
  rationale: निकलने या जारी होने वाली न्यायिक घोषणा के भाव को हिन्दी के ‘दण्डादेश’ और ‘निकला है’ से व्यक्त किया गया है।
- source_word: '[እምኔሆሙ] ዘአውፅእዎሙ ከመ''ዝ'
  choice: उन लोगों के कारण ... जिन्होंने उन्हें इस प्रकार बाहर निकाला
  rationale: सापेक्ष उपवाक्य को छोड़ा नहीं गया। እም को कारणसूचक रूप में लिया गया है, पर पाठगत कठिनाई और कोष्ठकित शब्द के कारण अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
theological_decisions:
- issue: हृदय और गुर्दियों की मानवशास्त्रीय छवि
  choice: दोनों शारीरिक बिंबों को बनाए रखा गया
  alternative: ‘मन’ और ‘अंतरात्मा’ जैसे अमूर्त शब्द
  rationale: मूल पाठ नैतिक और भावनात्मक प्रतिक्रिया को देहगत भाषा में व्यक्त करता है। बिंबों को बनाए रखने से प्राचीन सेमीय अभिव्यक्ति और उसका धार्मिक तनाव सपाट नहीं होता।
- issue: अंतिम कठिन उपवाक्य का कारणसूचक संबंध
  choice: ‘उन लोगों के कारण, जिन्होंने...’
  alternative: ‘उनमें से’ अथवा ‘उनसे’
  rationale: यह पाठ में उपस्थित सापेक्ष उपवाक्य को सुरक्षित रखता है और दण्डादेश को उन्हीं लोगों द्वारा जारी किया गया बताने की संभावित गलतफहमी से बचाता है; फिर भी पाठगत अनिश्चितता को पादटिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर प्रलयदर्शी और न्यायिक गरिमा को बनाए रखा गया है। ‘हृदय’, ‘गुर्दियाँ’, ‘वचन’ और ‘दण्डादेश’ जैसे शब्द मूल की मूर्त तथा औपचारिक शैली को सुरक्षित रखते हैं। सर्वनाम-संबंध और कठिन अंतिम उपवाक्य को अत्यधिक स्पष्ट करके मूल की वास्तविक अस्पष्टता समाप्त नहीं की गई।
