- source_word: ቆመ፡
  choice: खड़ा हुआ
  rationale: मूल क्रिया के सीधे अर्थ और दर्शन में उपस्थित न्यायिक दृश्य, दोनों को सुरक्षित रखता है।
- source_word: በቅድመ፡ እግዚአ፡ መናፍስት፡
  choice: आत्माओं के प्रभु के सामने
  rationale: हनोक की पुस्तक में प्रयुक्त विशिष्ट ईश्वरीय उपाधि तथा उपस्थिति/न्यायसभा के स्थानिक भाव को बनाए रखता है।
- source_word: ወከመ'ዝ፡ ይቤሎ፡
  choice: तब ... ने ... से यह कहा
  rationale: मूल के ‘इस प्रकार/यह’ वाले उद्धरण-संकेत को सहज हिन्दी में व्यक्त करता है।
- source_word: ወኢይከውን፡ ሎሙ፡ በውስተ፡ ዓይነ፡ እግዚአ፡
  choice: वह प्रभु की आँखों के सामने उनका पक्ष नहीं लेगा
  rationale: ‘होना/किसी के लिए होना’ के मुहावरे का न्यायिक या समर्थन-संबंधी बल स्पष्ट करता है, पर एकवचन कर्ता की पहचान अनिर्धारित रखता है; ‘प्रभु की आँखों के सामने’ मूल की सजीव अभिव्यक्ति को सुरक्षित रखता है।
- source_word: ተምዕዖሙ፡
  choice: उन पर क्रोधित है
  rationale: ईश्वरीय क्रोध को स्पष्ट, गरिमापूर्ण और सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: እምሳለ፡ እግዚአ፡ ይገብሩ።
  choice: वे ऐसे काम करते हैं मानो वे ही प्रभु हों
  rationale: अपने लिए ईश्वरीय अधिकार ग्रहण करने के आरोप की गंभीरता को बनाए रखता है और ‘प्रभुओं जैसा’ वैकल्पिक अर्थ टिप्पणी में सुरक्षित करता है।
theological_decisions:
- issue: मीकाएल के कथन में एकवचन सर्वनाम का संदर्भ
  choice: ‘वह ... उनका पक्ष नहीं लेगा’ रखा गया है और कर्ता की पहचान नहीं बताई गई।
  alternative: ‘मैं उनका पक्ष नहीं लूँगा’ अथवा ‘वह उनके लिए मध्यस्थता नहीं करेगा।’
  rationale: प्रदत्त गीइज़ पाठ तृतीय पुरुष एकवचन का समर्थन करता है, पर इसी पद में उसका पूर्वपद स्पष्ट नहीं है। इसलिए अस्पष्टता को बनाए रखा गया और ‘मध्यस्थता’ जैसी अधिक विशिष्ट व्याख्या नहीं जोड़ी गई।
- issue: दोषी व्यक्तियों के विरुद्ध आरोप का आशय
  choice: ‘वे ऐसे काम करते हैं मानो वे ही प्रभु हों।’
  alternative: ‘वे प्रभुओं के समान आचरण करते हैं।’
  rationale: मुख्य पाठ ईश्वरीय अधिकार हड़पने के गंभीर आरोप को व्यक्त करता है, जबकि व्याकरणगत रूप से संभव ‘प्रभुओं जैसा’ अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली अपनाई गई है। ‘आत्माओं का प्रभु’ जैसी हनोकीय उपाधि को स्थिर रखा गया है। कठिन न्यायिक मुहावरे को मुख्य पाठ में अर्थपूर्ण बनाया गया है, पर सर्वनाम का अनिश्चित संदर्भ तथा अंतिम आरोप की वैकल्पिक व्याख्या पादटिप्पणियों में सुरक्षित हैं।
