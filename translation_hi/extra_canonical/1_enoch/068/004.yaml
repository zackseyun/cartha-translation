base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/004.yaml
  text: 'And it came to pass[a], when he stood before the Lord of Spirits, that Michael said this to Raphael: “He will not be for them before the eye of the Lord, for the Lord of Spirits is angry with them[c][b], because they act as if they were the Lord.”'
translation:
  language: hi
  text: 'और ऐसा हुआ कि जब वह आत्माओं के प्रभु के सामने खड़ा हुआ, तब मीकाएल ने रफाएल से यह कहा: “वह प्रभु की आँखों के सामने उनका पक्ष नहीं लेगा[a], क्योंकि आत्माओं का प्रभु उन पर क्रोधित है, इसलिए कि वे ऐसे काम करते हैं मानो वे ही प्रभु हों[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह वाक्य कठिन है। इसका अर्थ संभवतः यह है कि वह प्रभु की उपस्थिति में उनका साथ या समर्थन नहीं करेगा। यहाँ ‘वह’ किसके लिए कहा गया है, यह इस पद में स्पष्ट नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या, “वे प्रभुओं के समान आचरण करते हैं।” गीइज़ वाक्यांश संक्षिप्त है और संभवतः उन पर ऐसा ईश्वरीय या शासकीय अधिकार अपनाने का आरोप लगाता है जो उनका नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወኮነ፡ ሶበ፡
  choice: और ऐसा हुआ कि जब
