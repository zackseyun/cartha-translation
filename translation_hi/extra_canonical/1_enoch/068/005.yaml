  text: Because of this[b][a], everything hidden forever shall come upon them.
translation:
  language: hi
  text: इसी कारण, सदा से छिपा हुआ सब कुछ उन पर आ पड़ेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छिपा हुआ सब कुछ उन पर सदा के लिए आ पड़ेगा।” अंतिम शब्द का अर्थ “सदा,” “एक युग तक,” या “प्राचीन काल से” भी हो सकता है; उसका संबंध ‘छिपा हुआ’ अथवा ‘आ पड़ेगा’ से माना जा सकता है।
    reason: मूल के अंतिम कालवाचक पद के अर्थ और व्याकरणिक संबंध की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: በእንተ'ዝ
  choice: इसी कारण
  rationale: यह पदबंध पिछले प्रसंग से स्पष्ट कारणात्मक संबंध जोड़ता है; ‘इसी कारण’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उस बल को बनाए रखता है।
- source_word: ይመጽእ
  choice: आ पड़ेगा
  rationale: क्रिया के आने के भाव और न्यायसूचक प्रसंग, दोनों को व्यक्त करता है; ‘आ पड़ेगा’ केवल प्रकाशन नहीं, उन पर आने वाले परिणाम का संकेत देता है।
- source_word: ላዕሌሆሙ
  choice: उन पर
  rationale: मूल में गति अथवा आरोपण का भाव है; ‘उन पर’ बिना इसे अधिक व्याख्यायित किए सुरक्षित रखता है।
- source_word: ኵሉ ዘኅቡእ
  choice: छिपा हुआ सब कुछ
  rationale: सापेक्ष पदबंध की व्यापक अनिश्चित समग्रता को बनाए रखता है और छिपी वस्तु को कर्मों, रहस्यों या सुरक्षित रखे गए दण्ड में से किसी एक तक सीमित नहीं करता।
- source_word: ለዓለመ
  choice: सदा से
  rationale: अंतिम पद अनन्तता, एक युग या प्राचीन अवधि का बोध करा सकता है। मुख्य पाठ में ‘सदा से’ इसे छिपे रहने की अवधि से जोड़ता है, जबकि पादटिप्पणी दूसरे सम्भव संबंध को सुरक्षित रखती है।
theological_decisions:
- issue: क्या छिपी हुई बात प्रकट की जा रही है, या कोई छिपी हुई वास्तविकता अथवा दण्ड उन पर आ रहा है?
  choice: ‘छिपा हुआ सब कुछ उन पर आ पड़ेगा’
  alternative: ‘छिपा हुआ सब कुछ प्रकट होकर उनके विरुद्ध होगा’
  rationale: मूल पाठ स्पष्ट रूप से ‘उन पर आएगा’ कहता है, केवल ‘प्रकट होगा’ नहीं। इसलिए न्यायसूचक तनाव बनाए रखा गया है और ‘सब कुछ’ को किसी एक प्रकार की छिपी वस्तु तक सीमित नहीं किया गया।
- issue: ለዓለመ का संबंध ‘छिपा हुआ’ से है या ‘आ पड़ेगा’ से?
  choice: मुख्य पाठ में इसे ‘छिपा हुआ’ से जोड़कर ‘सदा से छिपा हुआ’ किया गया है।
  alternative: ‘छिपा हुआ सब कुछ उन पर सदा के लिए आ पड़ेगा।’
  rationale: संक्षिप्त गीइज़ वाक्य में संबंध पूर्णतः निर्विवाद नहीं है। मुख्य रूप प्राचीन काल से छिपे होने का सम्भावित अर्थ देता है; पादटिप्पणी क्रिया से संबंध और ‘युग’ वाले अर्थ को भी दर्ज करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सर्वसाधारण के लिए सुबोध रखी गई है। ‘आ पड़ेगा’ सर्वनाशकारी अथवा न्यायसूचक परिणाम का भाव देता है, पर मूल से आगे जाकर उसका स्वरूप निर्धारित नहीं करता।
