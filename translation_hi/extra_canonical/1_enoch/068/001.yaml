base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/001.yaml
  text: And after this my grandfather Hēnok gave me the sign of all the hidden things in a book[a], and the parables that had been given to him[c][b]; and they shall recount them to me in the account of the book of the Parable.
translation:
  language: hi
  text: और इसके बाद मेरे पूर्वज हनोक ने मुझे एक पुस्तक में सभी छिपी हुई बातों का चिह्न[a] और वे दृष्टान्त[b] दिए जो उसे दिए गए थे; और दृष्टान्त की पुस्तक के वृत्तान्त में वे मुझे उनका वर्णन करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ की इस पंक्ति का वाक्य-विन्यास कठिन है, विशेषकर अंतिम खंड में। यहाँ ‘चिह्न’ का अर्थ ‘निशान’ या ‘संकेत’ भी हो सकता है। अनुवाद ने कठिनाई को सहज बनाने के लिए इसे ‘व्याख्या’ नहीं किया है।
    reason: textual_variant
  - marker: b
    text: ‘दृष्टान्त’ का अनुवाद ‘उपमाएँ’ या ‘सादृश्य-कथाएँ’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ትእምርተ
  choice: चिह्न
  rationale: मूल संज्ञा का अर्थ ‘चिह्न’, ‘निशान’ या ‘संकेत’ हो सकता है। ‘चिह्न’ प्रकाशनात्मक भाव को बनाए रखता है और इसे अनावश्यक रूप से ‘व्याख्या’ नहीं बनाता।
- source_word: ኵሎሙ ኅቡኣት
  choice: सभी छिपी हुई बातें
  rationale: यह सहज हिन्दी में गुप्त या प्रकट न हुई बातों को व्यक्त करता है, बिना ‘रहस्य’ जैसा अधिक पारिभाषिक धार्मिक अर्थ जोड़े।
- source_word: በመጽሐፍ
  choice: एक पुस्तक में
  rationale: पूर्वसर्ग को स्थानसूचक मानते हुए पुस्तक को उन बातों के लिखित माध्यम/स्थान के रूप में रखा गया है; हिन्दी में अनिश्चित संदर्भ के लिए ‘एक पुस्तक’ स्वाभाविक है।
- source_word: እምሔውየ ሄኖክ
  choice: मेरे पूर्वज हनोक
  rationale: እምሔውየ एक संयुक्त रूप है जिसका अर्थ ‘मेरा दादा/पूर्वज’ है, न कि ‘हनोक के शब्दों से’। व्यापक वंशगत संदर्भ में ‘पूर्वज’ अधिक सुरक्षित और स्वाभाविक है।
- source_word: ምሳሌያተ
  choice: दृष्टान्त
  rationale: यह ‘parable/similitude’ दोनों के निकट है और आधुनिक हिन्दी के धार्मिक-साहित्यिक संदर्भ में समझने योग्य है।
- source_word: ተውህበ ሎቱ
  choice: उसे दिए गए थे
  rationale: निष्क्रिय क्रिया हनोक द्वारा इन दृष्टान्तों को प्राप्त किए जाने को व्यक्त करती है।
- source_word: ይመርሙ ሊተ
  choice: वे मुझे उनका वर्णन करेंगे
  rationale: क्रिया कठिन और अर्थ की दृष्टि से अनिश्चित है। ‘वर्णन करेंगे’ बहुवचन कर्ता को बनाए रखते हुए सुनाने/समझाने के बीच अत्यधिक निर्णय नहीं करता।
- source_word: ነገረ መጽሐፍ ዘምሳሌ
  choice: दृष्टान्त की पुस्तक के वृत्तान्त में
  rationale: ነገር का अर्थ बात, कथन या वृत्तान्त हो सकता है। ‘वृत्तान्त’ साहित्यिक संदर्भ में उपयुक्त है और मूल के एकवचन ‘दृष्टान्त’ को बनाए रखता है।
theological_decisions:
- issue: छिपी सामग्री के लिए सामान्य या पारिभाषिक धार्मिक शब्द का चयन
  choice: सभी छिपी हुई बातें
  alternative: सभी रहस्य
  rationale: मूल पाठ छिपी हुई बातों के प्रकाशन की ओर संकेत करता है, पर यहाँ कोई विशिष्ट उत्तरकालीन धर्मवैज्ञानिक पारिभाषिकता आवश्यक नहीं करता।
- issue: हनोक के संबंधसूचक पद का अनुवाद
  choice: मेरे पूर्वज हनोक
  alternative: मेरे दादा हनोक
  rationale: मूल पद दादा अथवा पूर्वज का अर्थ दे सकता है। ‘पूर्वज’ वंशगत संबंध को सुरक्षित रखता है और आधुनिक हिन्दी में अनावश्यक जैविक संकीर्णता से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली रखी गई है। पाठ की वास्तविक कठिनता को पूरी तरह समतल नहीं किया गया; विराम-चिह्नों से लंबी संरचना को पढ़ने योग्य बनाया गया है।
