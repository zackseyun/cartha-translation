base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/002.yaml
  text: And on that day Michael answered[a], saying to Raphael, “The power of the spirit seizes me and provokes me to anger because of the severity of the judgment concerning the hidden secrets. Who is there that can endure the severe judgment that has been executed[c][b], and before which they melt away?”
translation:
  language: hi
  text: उस दिन मीकाएल ने रफाएल को उत्तर दिया, “आत्मा की शक्ति मुझे जकड़ लेती है और मुझे क्रोधित कर देती है[c], क्योंकि इन छिपे हुए रहस्यों के विषय में कठोर न्याय की भयानकता है।[a] कौन उस कठोर न्याय को सह सकता है जो किया जा चुका है और जिसके सामने वे पिघल जाते हैं?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस स्थान का गीज़ पाठ कठिन है। इसका अधिक शाब्दिक अर्थ यह भी हो सकता है: ‘इन छिपी हुई बातों के विषय में, कानों के लिए यह बात भयानक है।’'
    reason: textual_variant
  - marker: b
    text: या, ‘कौन उस भयानक बात को सह सकता है जो की गई है?’ शब्दावली न्याय के कार्यान्वयन अथवा उसके प्रकट किए जाने—दोनों की ओर संकेत कर सकती है।
    reason: lexical_alternative
  - marker: c
    text: 'कुछ व्याख्याओं में: ‘मुझे आगे बढ़ाती है’ या ‘मुझे उकसाती है’; किन्तु गीज़ क्रिया विशेष रूप से क्रोध या रोष उत्पन्न करने का भाव भी रखती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ
  choice: उत्तर में कहा
  rationale: यह क्रिया उत्तर देने या प्रत्युत्तर में बोलने का बोध कराती है; ‘उत्तर में कहा’ संवादात्मक प्रसंग और इसके बाद आने वाले कथन, दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: ኀይሉ ለመንፈስ
  choice: आत्मा की शक्ति
  rationale: ኀይል सक्रिय शक्ति या सामर्थ्य को व्यक्त करता है और መንፈስ यहाँ ‘आत्मा’ के अर्थ में सबसे स्वाभाविक है। पाठ यह स्पष्ट नहीं करता कि इससे परमेश्वर का आत्मा अभिप्रेत है, इसलिए पहचान को अनिर्णीत रखा गया है।
- source_word: ይመሥጠኒ
  choice: मुझे पकड़ लेती है
  rationale: क्रिया बलपूर्वक पकड़ने या अपने वश में कर लेने का सजीव भाव रखती है; यह हिन्दी प्रयोग उस प्रबल आन्तरिक प्रभाव को व्यक्त करता है।
- source_word: ያምዕዐኒ
  choice: मुझे क्रोध से भर देती है
  rationale: यह መዐዐ (‘क्रोधित/रोषपूर्ण होना’) का कारक रूप है और क्रोध उत्पन्न करने का भाव देता है; इसलिए केवल ‘उकसाती है’ या ‘आगे बढ़ाती है’ से अधिक स्पष्ट अनुवाद चुना गया है।
- source_word: ዕፁቡ
  choice: अत्यन्त कठोर / कठोर
  rationale: यह शब्द भयानक, दारुण या कठोर बात का संकेत देता है। न्यायिक प्रसंग में ‘कठोर’ स्वाभाविक है, किन्तु पादटिप्पणी में पाठ की कठिनाई और व्यापक अर्थ-संभावना बचाई गई है।
- source_word: እንተ ኅቡኣት
  choice: इन छिपे हुए रहस्यों
  rationale: यह पद छिपी या गुप्त बातों को सूचित करता है। ‘छिपे हुए रहस्य’ प्रकाशनात्मक प्रसंग और शब्द की दोनों अर्थ-छटाओं को बनाए रखता है।
- source_word: ተዐግሦተ
  choice: सह सकता है
  rationale: क्रिया किसी असह्य वस्तु को झेलने या उसके नीचे टिके रहने की क्षमता बताती है; प्रश्नवाचक वाक्य में ‘सह सकता है’ सरल और सटीक है।
- source_word: ተገብረት
  choice: कार्यान्वित हो चुका है
  rationale: निष्पादित या किए जा चुके कार्य का भाव है। मुख्य पाठ में न्यायिक अर्थ रखा गया है, पर पादटिप्पणी बताती है कि शब्द अधिक सामान्य रूप से ‘जो किया गया है’ भी हो सकता है।
- source_word: ይትመሰዉ
  choice: वे पिघल जाते हैं
  rationale: क्रिया गलने, घुलने या क्षीण होकर मिटने की सजीव छवि देती है; ‘पिघल जाते हैं’ प्रलयदर्शी बिम्ब को सुरक्षित रखता है।
theological_decisions:
- issue: መንፈስ से किसी सामान्य आत्मिक शक्ति का बोध है या परमेश्वर के आत्मा का
  choice: आत्मा
  alternative: पवित्र आत्मा / परमेश्वर का आत्मा
  rationale: गीज़ पद स्वयं इसे स्पष्ट रूप से पवित्र आत्मा नहीं कहता। हिन्दी में ‘आत्मा’ रखकर उस सत्ता की सटीक पहचान को खुला छोड़ा गया है।
- issue: ዕፁቡ और कठिन, दोहराए गए ለእዝኒ पद न्याय को बताते हैं या कान से सुनी गई किसी भयानक बात को
  choice: इन छिपे हुए रहस्यों के विषय में न्याय अत्यन्त कठोर है
  alternative: इन छिपी बातों के विषय में कानों से सुनी गई बात भयानक है
  rationale: पाठ इस स्थान पर कठिन है। प्रसंग और बाद के वाक्य में सहने योग्य कठोर वस्तु के उल्लेख के आधार पर मुख्य पाठ में न्यायिक अर्थ लिया गया है, पर वैकल्पिक अधिक शाब्दिक समझ पादटिप्पणी में दी गई है।
- issue: ተገብረት न्याय के कार्यान्वयन को बताता है या किसी भयानक बात के किए जाने को
  choice: कठोर न्याय जो कार्यान्वित हो चुका है
  alternative: वह भयानक बात जो की गई है
  rationale: न्यायिक प्रवाह के कारण मुख्य पाठ में ‘न्याय’ ग्रहण किया गया है, लेकिन गीज़ क्रिया अपने आप में केवल ‘किया गया’ भी कही जा सकती है; इस अनिश्चितता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पर सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। स्वर्गदूतों के नाम हिन्दी के प्रचलित बाइबलीय रूप ‘मीकाएल’ और ‘रफाएल’ में दिए गए हैं। कठिन गीज़ वाक्य को मुख्य पाठ में सहज न्यायिक अर्थ के साथ रखा गया है, जबकि उसकी वास्तविक पाठगत और अर्थगत अनिश्चितता पादटिप्पणियों में स्पष्ट की गई है।
