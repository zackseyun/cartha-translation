  yaml_path: translation/extra_canonical/1_enoch/032/004.yaml
  text: And it looked like the carob tree[a], and its fruit was like clusters of good grapes, very beautiful[d][c][b]; and the fragrance of that tree spread far away.
translation:
  language: hi
  text: और वह खरोब के पेड़[a] जैसा दिखाई देता था। उसका फल अंगूर की बेल के बहुत सुंदर गुच्छों जैसा था, और उस पेड़ की सुगंध दूर तक फैलती थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: खरोब भूमध्यसागरीय क्षेत्र का एक फलदार पेड़ है, जिसे अंग्रेज़ी में “carob” कहते हैं।
    reason: reader_clarity
lexical_decisions:
- source_word: ይመስል
  choice: जैसा दिखाई देता था
  rationale: क्रिया दृश्य समानता प्रकट करती है; यह हिंदी में स्वाभाविक रहते हुए तुलनात्मक भाव बनाए रखती है।
- source_word: ሐመረ ጽራእ
  choice: खरोब का पेड़
  rationale: उपलब्ध यूनानी साक्ष्य κερατία और शब्दकोशीय पहचान Ceratonia siliqua की ओर संकेत करते हैं; इसलिए अनिश्चित 'इमली' के बजाय खरोब चुना गया है।
- source_word: ፍሬሁ
  choice: उसका फल
  rationale: पेड़ की उपज के लिए सीधा और प्रसंगानुकूल अनुवाद।
- source_word: ከመ እስካለ ወይን
  choice: अंगूर की बेल के ... गुच्छों जैसा
  rationale: शाब्दिक रूप से तुलना बेल के फल से है; 'गुच्छों' से हिंदी में दृश्य स्वाभाविक और स्पष्ट होता है।
- source_word: ሠናይ ጥቀ
  choice: बहुत सुंदर
  rationale: ጥቀ को तीव्रतासूचक 'बहुत' और ሠናይ को दृश्य प्रसंग तथा यूनानी καλοὶ λίαν के अनुरूप 'सुंदर' समझा गया है।
- source_word: ወጼናሁ
  choice: सुगंध ... फैलती थी
  rationale: यह सुगंध के बाहर निकलकर दूर तक जाने को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: ለውእቱ ዕፅ
  choice: उस पेड़ की
  rationale: वाक्यांश सुगंध के स्रोत को संकेतवाचक बल के साथ पहचानता है।
- source_word: የሐውር ነዋኃ
  choice: दूर तक
  rationale: दूरी में व्यापक विस्तार का भाव संक्षेप और स्वाभाविक ढंग से व्यक्त होता है।
