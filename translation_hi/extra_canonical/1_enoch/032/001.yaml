base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/001.yaml
  text: And after these[a], toward the south, as I looked over the mountains, I saw seven mountains full of choice nard and fragrant trees[c][b], and cinnamon and pepper.
translation:
  language: hi
  text: और इन बातों के बाद, दक्षिण की ओर, जब मैंने पहाड़ों के ऊपर से देखा, तो मुझे सात पहाड़ दिखाई दिए, जो उत्तम सुगंधित वनस्पति[a], सुगंधित वृक्षों[b], दालचीनी और काली मिर्च से भरे हुए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल अभिव्यक्ति की ठीक पहचान अनिश्चित है। इसका अर्थ संभवतः कोई बहुमूल्य सुगंधित पौधा या मसाला है; ‘उत्तम जटामांसी’ भी संभव है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ सुगंधित वनस्पतियों, वृक्षों और मसालों की सूची इस दर्शनीय प्रदेश की प्रचुरता और विलक्षणता पर बल देती है; इसे आधुनिक वनस्पति-विज्ञान की सटीक सूची न समझें।
    reason: cultural_note
lexical_decisions:
- source_word: እምድኅረ እሉ
  choice: इन बातों के बाद
  rationale: बहुवचन संकेतवाचक पद पिछले दर्शनीय दृश्यों की ओर संकेत करता है; हिंदी में यह स्वाभाविक संक्रमण है।
- source_word: አፈው ለመስዕ
  choice: दक्षिण की ओर
  rationale: उपलब्ध स्रोत-साक्ष्य और नवीनतम संशोधन के अनुसार यह दिशासूचक पद दक्षिण की ओर गति या दृष्टि व्यक्त करता है; አፈው को अलग से ‘मसाले’ मानना यहाँ संदिग्ध है।
- source_word: እንዘ እኔጽር
  choice: जब मैंने ... देखा
  rationale: यह चल रही दृष्टि को सूचित करने वाली रचना है; हिंदी में ‘जब मैंने देखा’ दर्शन-वृत्तांत की सहजता बनाए रखता है।
- source_word: መልዕልተ አድባር
  choice: पहाड़ों के ऊपर से
  rationale: पद में ऊपर/पार से देखने का स्थानिक भाव है, जिसे केवल ‘पहाड़’ कहने पर खो दिया जाता।
- source_word: ፯አድባረ
  choice: सात पहाड़
  rationale: स्पष्ट संख्या और विराट दर्शनीय भूगोल दोनों सुरक्षित रहते हैं।
- source_word: ምሉኣነ
  choice: से भरे हुए
  rationale: यह आगे दी गई सुगंधित वस्तुओं की प्रचुरता बताता है।
- source_word: ሰንብላተ ቅድዋተ
  choice: उत्तम सुगंधित वनस्पति
  rationale: वनस्पति की ठीक पहचान अनिश्चित है। ‘जटामांसी’ संभव है, पर व्यापक अनुवाद अनिश्चितता को सुरक्षित रखते हुए मूल्यवान सुगंधित पौधे का भाव देता है।
- source_word: ዕፀ መዓዛ
  choice: सुगंधित वृक्षों
  rationale: शाब्दिक भाव ‘सुगंध के वृक्ष/काष्ठ’ है; ‘सुगंधित वृक्ष’ स्पष्ट और चित्रात्मक है।
- source_word: ቀናንሞን
  choice: दालचीनी
  rationale: यह दालचीनी के लिए प्रयुक्त उधार लिया हुआ मसाला-नाम है।
- source_word: ፐፐሬ
  choice: काली मिर्च
  rationale: मसाले के सामान्य हिंदी नाम से आशय स्पष्ट होता है; केवल ‘मिर्च’ आधुनिक पाठक को लाल मिर्च का भ्रम दे सकती है।
