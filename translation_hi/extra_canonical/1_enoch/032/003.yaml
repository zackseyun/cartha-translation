base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/003.yaml
  text: And I came into the garden of righteousness[a], and I saw beyond those trees many large trees growing there, with good fragrance, great and very beautiful and glorious; and the tree of wisdom[c][b], from which those who eat know great wisdom.
translation:
  language: hi
  text: फिर मैं धार्मिकता की वाटिका में पहुँचा। वहाँ मैंने उन वृक्षों के पार[a] बहुत-से विशाल वृक्ष उगते देखे। उनकी सुगंध मनभावनी थी; वे बड़े, अत्यन्त सुन्दर और भव्य थे। वहाँ बुद्धि का वृक्ष भी था, जिसमें से जो खाते हैं, वे महान बुद्धि को जान लेते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ का स्थानवाचक गीइज़ पद कठिन है; ‘उन वृक्षों के पार’ के स्थान पर इसका अर्थ ‘उन वृक्षों के बीच’ या ‘उनके पास’ भी हो सकता है।
    reason: textual_variant
  - marker: b
    text: वृक्ष में से खाने और ‘महान बुद्धि’ जानने की बात आदि-वाटिका की छवि की ओर संकेत करती है, पर यहाँ उत्पत्ति ग्रन्थ की ठीक वही अभिव्यक्ति नहीं दोहराई गई है।
    reason: cross_reference
lexical_decisions:
- source_word: ገነት ጽድቅ
  choice: धार्मिकता की वाटिका
  rationale: ገነት के लिए ‘वाटिका’ प्राकृतिक और गरिमापूर्ण हिन्दी है तथा पवित्र उद्यान की छवि बनाए रखती है। ጽድቅ को नैतिक गुण के रूप में ‘धार्मिकता’ कहा गया है, न कि केवल न्यायिक अर्थ वाले ‘न्याय’ से।
- source_word: ከሐክቲሆሙ ለእልክቱ ዕፀው
  choice: उन वृक्षों के पार
  rationale: दुरूह स्थानवाचक पद को दर्शन में आगे की ओर बढ़ने के संभावित भाव के अनुसार अनूदित किया गया है; पाठ की अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: ዕፀወ ብዙኃነ ወዐቢይነ ይበቍሉ
  choice: बहुत-से विशाल वृक्ष उगते
  rationale: यह अनुवाद वृक्षों की बहुलता, उनके बड़े आकार और वृद्धि—तीनों तत्वों को संक्षिप्त, स्वाभाविक हिन्दी में रखता है।
- source_word: ጼናሆሙ ሠናይ
  choice: उनकी सुगंध मनभावनी थी
  rationale: ‘मनभावनी’ सुगंध के सकारात्मक और इन्द्रियग्राह्य वर्णन को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ዐቢያን ወሥናሙ ብዙኅ ወስቡሓን
  choice: वे बड़े, अत्यन्त सुन्दर और प्रतापमय थे
  rationale: स्रोत में आकार, प्रचुर सौन्दर्य और महिमा/भव्यता के अलग-अलग गुण हैं। ‘प्रतापमय’ अंतिम विशेषण को केवल ‘सुन्दर’ में विलीन किए बिना उसकी दृश्य भव्यता व्यक्त करता है।
- source_word: ዕፀ ጥበብ
  choice: बुद्धि का वृक्ष
  rationale: यह सीधा संबंधवाचक अनुवाद आदि-वाटिका की ओर संकेत बनाए रखता है, पर उत्पत्ति की अधिक विशिष्ट पदावली पाठ में नहीं जोड़ता।
- source_word: ዘእምኔሁ በሊዖሙ ይአምርዋ ለጥበብ ዐቢይ
  choice: जिसमें से जो खाते हैं, वे महान बुद्धि को जान लेते हैं
  rationale: ‘फल’ जैसे स्रोत में अनुपस्थित कर्म को जोड़े बिना वृक्ष से खाने और उसके परिणामस्वरूप महान बुद्धि जानने का संबंध रखा गया है। स्पष्ट कर्म ‘बुद्धि’ को ‘बुद्धिमान हो जाते हैं’ में बदलकर मिटाया नहीं गया।
theological_decisions:
- issue: बुद्धि के वृक्ष का आदि-वाटिका से संबंध
  choice: ‘बुद्धि का वृक्ष’
  alternative: ‘भले और बुरे के ज्ञान का वृक्ष’ अथवा ‘ज्ञान का वृक्ष’
  rationale: पद आदि-वाटिका की पवित्र वृक्ष-छवि जगाता है, पर गीइज़ पाठ स्पष्ट रूप से ‘बुद्धि’ कहता है। उत्पत्ति की पूरी अभिव्यक्ति जोड़ना अनावश्यक सामंजस्य बैठाना होता।
- issue: धार्मिकता और न्याय के बीच अर्थ
  choice: ‘धार्मिकता की वाटिका’
  alternative: ‘न्याय की वाटिका’
  rationale: दर्शन के इस नैतिक-पवित्र परिवेश में ‘धार्मिकता’ स्थान के गुण को अधिक स्वाभाविक रूप से व्यक्त करती है, यद्यपि मूल शब्द के अर्थ-क्षेत्र में न्याय भी सम्मिलित हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण वर्णन रखा गया है। छोटे वाक्य दृश्य की क्रमिक गति स्पष्ट करते हैं। ‘वाटिका’, ‘मनभावनी’ और ‘प्रतापमय’ साहित्यिक हैं, पर सामान्य पाठक के लिए बोधगम्य हैं; स्रोत की स्थानवाचक अनिश्चितता को मुख्य पाठ में कृत्रिम रूप से हल करने के बजाय पादटिप्पणी में बताया गया है।
