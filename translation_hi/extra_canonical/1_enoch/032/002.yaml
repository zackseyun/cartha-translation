base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/002.yaml
  text: And from there I went above the summits of those mountains[a], far to the east, and I crossed over the Erythraean Sea; and I went far from it[c][b], and passed above the angel Zutel.
translation:
  language: hi
  text: और वहाँ से मैं उन पहाड़ों की चोटियों के ऊपर से बहुत दूर पूर्व की ओर गया। मैंने एरिथ्राई सागर[a] पार किया और उससे बहुत दूर चला गया[b]; फिर मैं ज़ूतेल नामक स्वर्गदूत के ऊपर से होकर आगे बढ़ा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लाल सागर’। प्राचीन नाम ‘एरिथ्राई सागर’ आधुनिक लाल सागर से अधिक विस्तृत समुद्री क्षेत्र को भी सूचित कर सकता था।
    reason: lexical_alternative
  - marker: b
    text: इथियोपिक साक्ष्य में यह वाक्यांश कठिन है; आशय संभवतः समुद्र से दूर आगे की यात्रा जारी रखना है।
    reason: textual_variant
  - marker: c
    text: अन्य संस्करणों या अनुवादों में इस स्वर्गदूत के नाम का उच्चारण ‘ज़ुताएल’ जैसे भिन्न रूप में मिल सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: መልዕልተ ርእሶሙ ለእልኩ አድባር
  choice: उन पहाड़ों की चोटियों के ऊपर से
  rationale: ‘सिरों’ का शाब्दिक अर्थ पहाड़ों के संदर्भ में स्वाभाविक रूप से ‘चोटियों’ को सूचित करता है। ‘ऊपर से’ दर्शनीय यात्रा की ऊँचाई को बनाए रखता है, बिना यह तय किए कि यात्रा ठीक उनके ऊर्ध्व भाग में थी या उनके पार।
- source_word: እንዘ ርሑቅ ውእቱ ለጽባሕ
  choice: बहुत दूर पूर्व की ओर
  rationale: यहाँ ጽባሕ का संकेत प्रातःकाल के समय से अधिक सूर्योदय की दिशा, अर्थात पूर्व, की ओर है। अनुवाद दूरी और दिशा दोनों को सहज हिंदी में रखता है।
- source_word: ባሕረ ኤርትራ
  choice: एरिथ्राई सागर
  rationale: प्राचीन भौगोलिक नाम को लिप्यंतरित किया गया है, क्योंकि उसका विस्तार आधुनिक लाल सागर से अधिक व्यापक हो सकता था।
- source_word: ወእምኔሁ ርሑቀ ተከንኩ
  choice: और उससे बहुत दूर चला गया
  rationale: इथियोपिक पाठ में यह खंड कठिन है, पर समुद्र से दूर आगे की यात्रा इसका संभावित न्यूनतम अर्थ है। अनुवाद अनिश्चितता पर अनावश्यक विस्तार नहीं करता।
- source_word: መልአክ ዙጥኤል
  choice: ज़ूतेल नामक स्वर्गदूत
  rationale: व्यक्तिवाचक नाम का अनुवाद करने के बजाय हिंदी में लिप्यंतरण किया गया है। ‘नामक’ हिंदी वाक्य में संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: መልዕልተ ለመልአክ
  choice: स्वर्गदूत के ऊपर से होकर
  rationale: दूसरी बार आए उसी स्थान-सूचक पद का समान रूप से ‘ऊपर से’ अनुवाद किया गया है। दृश्य असामान्य होने पर भी मूल की कल्पना को सामान्य बनाकर नहीं बदला गया।
theological_decisions:
- issue: नामित समुद्र की पहचान
  choice: एरिथ्राई सागर
  alternative: लाल सागर
  rationale: प्राचीन दर्शनीय भूगोल को आधुनिक लाल सागर तक सीमित करना पाठ से अधिक निश्चितता थोप सकता है। पुराने नाम को मुख्य पाठ में रखकर संभावित आधुनिक पहचान पादटिप्पणी में दी गई है।
- issue: स्वर्गदूत के सापेक्ष यात्रा का असामान्य चित्र
  choice: स्वर्गदूत के ऊपर से होकर आगे बढ़ा
  alternative: स्वर्गदूत ज़ूतेल के पास से आगे बढ़ा
  rationale: मूल में प्रयुक्त स्थान-सूचक शब्द ‘ऊपर’ का अर्थ देता है। ‘पास से’ अधिक सहज होता, पर वह दर्शनीय दृश्य को चुपचाप बदल देता; इसलिए मूल की असामान्यता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, सरल किंतु गरिमापूर्ण रखी गई है। प्राचीन भौगोलिक नाम का लिप्यंतरण किया गया है और कठिन दर्शनीय स्थान-वर्णन को सहज बनाने के लिए बदला नहीं गया। सभी पादटिप्पणी-चिह्न मुख्य पाठ में क्रम से उपस्थित हैं।
