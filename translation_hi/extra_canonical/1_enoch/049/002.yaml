base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/049/002.yaml
  text: For he is mighty in all the hidden things of righteousness[a], and lawlessness will pass away like a shadow and have no permanence; for the Chosen One stands before the Lord of Spirits, and his glory is forever and ever[d][c][b], and his power from generation to generation.
translation:
  language: hi
  text: क्योंकि वह धार्मिकता की सब गुप्त बातों में सामर्थी है[a]; और अधर्म छाया के समान चला जाएगा और टिक न सकेगा[b]। क्योंकि चुना हुआ जन आत्माओं के प्रभु के सामने खड़ा है[c], और उसकी महिमा युगानुयुग और उसका सामर्थ्य पीढ़ी-दर-पीढ़ी बना रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धार्मिकता के सब गुप्त विषयों में।” मूल वाक्यांश धार्मिकता से संबंधित छिपी हुई बातों या उसके गूढ़ पक्षों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक भाव: “उसका कोई टिकना न होगा”; अर्थात अधर्म बना नहीं रहेगा।'
    reason: lexical_alternative
  - marker: c
    text: “चुना हुआ जन” दृष्टांतों में न्याय और प्रतिष्ठा से जुड़े महान व्यक्तित्व की बार-बार आने वाली उपाधि है। “खड़ा है” का अनुवाद “खड़ा हुआ है” भी किया जा सकता है।
    reason: cross_reference_and_grammar
