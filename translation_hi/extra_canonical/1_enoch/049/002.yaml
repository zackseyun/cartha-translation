- source_word: ኅቡአተ ጽድቅ
  choice: धार्मिकता की सब गुप्त बातें
  rationale: मूल के बहुवचन और छिपी हुई बातों के भाव को बनाए रखता है; ‘रहस्य’ जैसा अधिक तकनीकी अर्थ नहीं थोपता।
- source_word: ዓመፃ
  choice: अधर्म
  rationale: धार्मिकता के व्यापक नैतिक विरोध को स्वाभाविक हिन्दी में व्यक्त करता है; इसे केवल हिंसा या अन्याय तक सीमित नहीं करता।
- source_word: ጽላሎት
  choice: छाया
  rationale: मूल उपमा को सरल और ठोस रूप में सुरक्षित रखता है।
- source_word: የኃልፍ
  choice: मिट जाएगा
  rationale: न्याय के भावी संदर्भ में छाया के लुप्त हो जाने की छवि को स्वाभाविक हिन्दी में व्यक्त करता है, बिना पूर्ण विनाश की दार्शनिक धारणा थोपे।
- source_word: ምቅዋመ አልቦ
  choice: स्थिर न रहेगा
  rationale: शाब्दिक रूप से खड़े रहने या टिके रहने के निषेध को सहज हिन्दी में रखता है और स्थायित्व की कमी व्यक्त करता है।
- source_word: ኅሩይ
  choice: चुना हुआ जन
  rationale: इस खंड में बार-बार आने वाली विशिष्ट उपाधि का भाव रखता है; ‘जन’ इसे हिन्दी में शीर्षक-सदृश और स्पष्ट बनाता है।
- source_word: ቆመ
  choice: खड़ा है
  rationale: मुद्रा-सूचक पूर्ण क्रिया की वर्तमान, स्थायी अवस्था को व्यक्त करता है; ‘खड़ा हुआ है’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: እግዚአ መናፍስት
  choice: आत्माओं का प्रभु
  rationale: हनोक की दृष्टांत-परंपरा की विशिष्ट ईश्वरीय उपाधि को सीधे और गरिमापूर्ण ढंग से सुरक्षित रखता है।
- source_word: ስብሐቲሁ
  choice: उसकी महिमा
  rationale: बाइबलीय-प्रकाशनात्मक शैली और शाश्वतता के अगले वाक्यांश के अनुकूल है।
theological_decisions:
- issue: क्या ኅሩይ को उपाधि माना जाए या केवल वर्णनात्मक विशेषण
  choice: ‘चुना हुआ जन’ को विशिष्ट उपाधि के रूप में प्रस्तुत किया गया
  alternative: ‘चुना हुआ’ अथवा ‘निर्वाचित जन’
  rationale: दृष्टांतों में यह न्याय और उद्धार से जुड़े महान व्यक्तित्व की आवर्ती उपाधि है; फिर भी अनुवाद बाद की किसी विशिष्ट मसीही व्याख्या को पाठ में नहीं जोड़ता।
- issue: प्रभु के सामने ቆመ का काल और पक्ष
  choice: ‘खड़ा है’
  alternative: ‘खड़ा हुआ है’ अथवा ‘खड़ा था’
  rationale: मुद्रा-सूचक पूर्ण रूप यहाँ वर्तमान जारी अवस्था व्यक्त कर सकता है; ‘खड़ा है’ इस अर्थ को स्पष्ट और स्वाभाविक रूप से रखता है।
- issue: ዓመፃ का धार्मिकता से विरोध
  choice: ‘अधर्म’
  alternative: ‘व्यवस्थाहीनता’, ‘हिंसा’, ‘दुष्टता’ या ‘अन्याय’
  rationale: ‘अधर्म’ व्यापक नैतिक विरोध को बनाए रखता है और अर्थ को केवल कानूनी अवज्ञा, सामाजिक हिंसा या आंतरिक दुष्टता तक सीमित नहीं करता।
- issue: चुने हुए जन की अनन्त महिमा और पीढ़ी-दर-पीढ़ी सामर्थ्य
  choice: दोनों कथनों को उसी जन से संबद्ध रखा गया
  alternative: संदर्भ को ईश्वर से संबद्ध समझना
  rationale: निकटतम व्याकरणिक संदर्भ ‘चुना हुआ जन’ है; फिर भी अनुवाद कोई अतिरिक्त तात्त्विक निष्कर्ष नहीं जोड़ता।
