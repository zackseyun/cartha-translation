  - severity: low
    issue: “स्थिर न रहेगा” is less idiomatic and less precise for the denial of enduring standing.
    rationale: “टिक न सकेगा” naturally expresses that lawlessness has no continuance or permanence while preserving the source’s image of lacking standing.
  - severity: low
    issue: The note’s phrase “निर्दोष ठहराए जाने” is more interpretive than necessary.
    rationale: The English audit’s “vindication” need not be rendered with a narrowly forensic expression in a cross-reference note; “प्रतिष्ठा” is more neutral.
