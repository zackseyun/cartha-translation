base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/049/001.yaml
  text: For wisdom has been poured out like water[c][b][a], and glory will not fail before him forever and ever.
translation:
  language: hi
  text: क्योंकि बुद्धि जल के समान उंडेली गई है[a], और महिमा उसके[b] सामने युगानुयुग समाप्त न होगी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उंडेली जाती है।” पूर्ण क्रिया किसी पूर्ण कार्य के साथ स्थापित अवस्था का भाव भी दे सकती है।
    reason: aspectual_alternative
  - marker: b
    text: यहाँ “उसके” का संदर्भ मूल गीज़ में स्पष्ट नहीं किया गया है। व्यापक प्रसंग किसी पहले उल्लिखित महिमामय व्यक्ति की ओर संकेत कर सकता है, पर इस पद में उसका नाम नहीं है।
    reason: alternative_reading
  - marker: c
    text: या, “उसके सामने महिमा का अंत न होगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: क्योंकि
  rationale: यह पूर्ववर्ती प्रसंग का कारण या आधार प्रस्तुत करने वाला संयोजक है; ‘क्योंकि’ आधुनिक हिन्दी में इसका संबंध स्पष्ट और स्वाभाविक रखता है।
- source_word: ጥበብ
  choice: बुद्धि
  rationale: यह शब्द सामान्यतः wisdom का बोध कराता है; ‘बुद्धि’ यहाँ ज्ञानपरक और प्रकाशनात्मक भाव को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: ክዕወ
  choice: उंडेली गई है
  rationale: गीज़ का पूर्ण पक्ष किसी पूरे किए गए कार्य अथवा स्थापित अवस्था की ओर संकेत करता है। जल की उपमा के साथ ‘उंडेली गई है’ उस प्रचुर प्रवाह की छवि और पूर्ण पक्ष—दोनों को सुरक्षित रखता है।
- source_word: ከመ ማይ
  choice: जल के समान
  rationale: यह सीधी उपमा है; ‘जल के समान’ मूल बिंब को गरिमापूर्ण और सहज हिन्दी में बनाए रखता है।
- source_word: ወስብሐት
  choice: और महिमा
  rationale: इस संज्ञा में वैभव और स्तुति के अर्थ भी संभव हैं, पर इस स्वर्गीय, उत्कर्षपूर्ण प्रसंग में ‘महिमा’ सबसे उपयुक्त और तटस्थ विकल्प है।
- source_word: ኢትኃልቅ
  choice: समाप्त न होगी
  rationale: नकारयुक्त क्रिया न चुकने या अंत न होने का अर्थ देती है। ‘समाप्त न होगी’ भविष्यकालीन अपूर्ण क्रिया का भेद बनाए रखती है और स्वाभाविक हिन्दी है।
- source_word: ቅድሜሁ
  choice: उसके सामने
  rationale: यह मूल के ‘उसके आगे/उसकी उपस्थिति में’ स्थानिक-संबंधपरक अर्थ को बनाए रखता है और सर्वनाम के अनिर्दिष्ट संकेत को नहीं खोलता।
- source_word: ለዓለመ ዓለም
  choice: युगानुयुग
  rationale: यह अनंत अवधि पर बल देने वाली सूत्रात्मक अभिव्यक्ति है; ‘युगानुयुग’ संक्षिप्त, प्रतिष्ठित और हिन्दी धार्मिक-साहित्यिक शैली में सुबोध है।
theological_decisions:
- issue: ‘उसके सामने’ में सर्वनाम का संदर्भ
  choice: मुख्य पाठ में केवल ‘उसके’ रखा गया है; व्यक्ति का नाम नहीं जोड़ा गया।
  alternative: ‘आत्माओं के प्रभु के सामने’ अथवा ‘चुने हुए/मनुष्य के पुत्र के सामने’।
  rationale: इस गीज़ वाक्य में केवल पुरुषवाचक सर्वनाम है। निकटवर्ती प्रसंग के आधार पर एक से अधिक संदर्भ संभव हैं; किसी विशिष्ट दिव्य या मसीही व्यक्ति का नाम जोड़ना मूल की वास्तविक अस्पष्टता को अनुचित रूप से समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। ‘जल’, ‘महिमा’ और ‘युगानुयुग’ मूल की काव्यात्मक तथा प्रलयदर्शी ऊँचाई बनाए रखते हैं; वाक्य-संरचना अनावश्यक रूप से संस्कृतनिष्ठ नहीं की गई है।
