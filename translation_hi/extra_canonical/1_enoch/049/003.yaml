  terminology: ‘आत्मा,’ ‘बुद्धि,’ ‘शिक्षा,’ and ‘सामर्थ्य’ fit the elevated register. ‘धार्मिकता’ is retained for righteousness. The footnote’s ‘सर्वनाश-साहित्यिक’ is misleading in Hindi, where ‘सर्वनाश’ primarily means destruction; ‘प्रलयकालीन साहित्य’ accurately conveys the scholarly sense of apocalyptic literature.
