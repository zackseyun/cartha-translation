base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/049/003.yaml
  text: And in him dwells the spirit of wisdom[a], and the spirit that gives understanding, and the spirit of instruction and might[d][c][b], and the spirit of those who sleep in righteousness.
translation:
  language: hi
  text: और उसमें बुद्धि की आत्मा वास करती है[a], समझ देने वाली आत्मा[b], शिक्षा और सामर्थ्य की आत्मा, और धार्मिकता में सोने वालों की आत्मा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसमें ठहरती है।’ गीइज़ क्रिया निरंतर वास करने या ठहरने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘समझ की आत्मा।’ गीइज़ अभिव्यक्ति समझ से युक्त आत्मा अथवा समझ प्रदान करने वाली आत्मा—दोनों अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘धार्मिकता में सोने वाले’; संभवतः यह धार्मिक मृतकों के लिए प्रलयकालीन साहित्यिक संकेत है, यद्यपि ‘जो धार्मिकता में विश्राम करते हैं’ भी संभव है।
    reason: alternative_reading
lexical_decisions:
- source_word: የኃድር
  choice: वास करती है
  rationale: अपूर्ण क्रियारूप वर्तमान अथवा निरंतर स्थिति व्यक्त करता है; ቦቱ के साथ यह ‘उसमें वास करती है’ है, न कि भूतकालीन ‘उस पर ठहरी।’
- source_word: መንፈሰ
  choice: आत्मा
  rationale: यहाँ बुद्धि, समझ, शिक्षा और सामर्थ्य से संबंधित दिव्य/करिश्माई सामर्थ्य के लिए ‘आत्मा’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ጥበብ
  choice: बुद्धि
  rationale: शब्द नैतिक और बौद्धिक प्रज्ञा को सूचित करता है; आधुनिक हिन्दी में ‘बुद्धि’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: ዘያሌቡ
  choice: समझ देनेवाली
  rationale: रूप केवल ‘समझ की’ कहने के बजाय आत्मा के प्रभाव—समझ प्रदान करने—को व्यक्त करता प्रतीत होता है।
- source_word: ትምህርት
  choice: शिक्षा
  rationale: यह शिक्षण अथवा निर्देश का बोध कराता है; गुणों की इस सूची में ‘शिक्षा’ सहज है।
- source_word: ኃይል
  choice: सामर्थ्य
  rationale: उच्च शैली बनाए रखते हुए शक्ति या बल का व्यापक अर्थ व्यक्त करता है।
- source_word: እለ ኖሙ በጽድቅ
  choice: जो धार्मिकता में सोते हैं
  rationale: ‘सोना’ मूल सर्वनाश-संबंधी बिंब को सुरक्षित रखता है और इसे स्पष्ट रूप से केवल ‘मृत धर्मी’ कहकर अर्थ का समाधान नहीं करता।
theological_decisions:
- issue: अंतिम आत्मा-वाक्यांश का अर्थ
  choice: ‘उन लोगों की आत्मा जो धार्मिकता में सोते हैं’—संभवतः धार्मिक मृतकों का संकेत
  alternative: ‘उन लोगों की आत्मा जो धार्मिकता में विश्राम करते हैं’ अथवा ‘धर्मियों की आत्मा’
  rationale: ‘सोते हैं’ मृत्यु का सर्वनाश-साहित्यिक संकेत हो सकता है, पर मूल अभिव्यक्ति में ‘विश्राम’ की संभावना भी बनी रहती है; इसलिए बिंब और धर्मवैचारिक तनाव दोनों सुरक्षित रखे गए हैं।
- issue: आत्मा का स्थान और क्रिया-काल
  choice: ‘उसमें ... वास करती है’
  alternative: ‘उस पर ... ठहरी’
  rationale: ቦቱ ‘उसमें’ और अपूर्ण የኃድር वर्तमान/निरंतर वास को दर्शाते हैं; अतः इसे अतीत की एक घटना नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। समानांतर ‘आत्मा’ पदों को स्पष्ट रखा गया है और मृत्यु/विश्राम संबंधी अंतिम वाक्यांश की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
