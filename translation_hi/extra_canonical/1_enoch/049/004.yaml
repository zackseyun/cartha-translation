base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/049/004.yaml
  text: And he will judge the hidden things[a], and no one will be able to speak an empty word before him, for he is the Chosen One before the Lord of Spirits[c][b], according as he has willed.
translation:
  language: hi
  text: और वह छिपी हुई बातों का न्याय करेगा, और उसके सामने कोई भी खोखली बात नहीं कह सकेगा[a]; क्योंकि वह आत्माओं के प्रभु के सामने चुना हुआ जन है,[b] जैसा उसने चाहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस गीइज़ साक्षी में यह वाक्यांश पाठगत रूप से कठिन है। “खोखली बात” का अर्थ “व्यर्थ बात” या “झूठ” भी हो सकता है।
    reason: textual_variant
  - marker: b
    text: “आत्माओं के प्रभु” गीइज़ की स्थिर उपाधि का प्रत्यक्ष अनुवाद है। अंतिम शब्दों में “उसने” का संकेत संभवतः प्रभु की ओर है, पर स्रोत केवल सर्वनाम देता है।
    reason: translation_clarity
lexical_decisions:
- source_word: ይኴንን
  choice: न्याय करेगा
  rationale: क्रिया न्याय करने या निर्णय सुनाने की न्यायिक कार्रवाई व्यक्त करती है; भविष्यकाल प्रसंग के अनुकूल है।
- source_word: ዘኅቡአተ
  choice: छिपी हुई बातों
  rationale: यह छिपी या गुप्त वास्तविकताओं को दर्शाता है; यह रूप स्रोत की व्यापकता बनाए रखता है।
- source_word: በከ፡ አልቦ፡ ዘይክል፡ ብሂለ፡ በቅድሜሁ
  choice: उसके सामने कोई भी खोखली बात नहीं कह सकेगा
  rationale: पाठ कठिन है, पर वाक्यांश उसके सामने व्यर्थ, खोखली या झूठी बात कह पाने की असमर्थता व्यक्त करता है। 'खोखली बात' शाब्दिक बल और नैतिक संकेत दोनों बनाए रखता है।
- source_word: ኅሩይ
  choice: चुना हुआ जन
  rationale: यह इस खंड में अंतकालीन पात्र की उपाधि है। हिंदी में यह स्वाभाविक है और बाद की धर्मसैद्धांतिक पहचान को पाठ में नहीं जोड़ता।
- source_word: እግዚአ፡ መናፍስት
  choice: सेनाओं के प्रभु
  rationale: शाब्दिक अर्थ 'आत्माओं के प्रभु' है, पर 1 हनोक में यह एक स्थिर ईश्वरीय उपाधि है। हिंदी बाइबलीय प्रयोग में 'सेनाओं के प्रभु' समानांतर प्रतिष्ठित उपाधि है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: በከመ፡ ውእቱ፡ ፈቀደ
  choice: जैसा उसने चाहा है
  rationale: यह इच्छा के अनुसार होने का औपचारिक भाव सुरक्षित रखता है, यद्यपि सर्वनाम का संदर्भ स्रोत की तरह कुछ हद तक खुला रहता है।
theological_decisions:
- issue: ኅሩይ की उपाधि और पहचान
  choice: चुना हुआ जन
  alternative: चुना हुआ / निर्वाचित जन
  rationale: संज्ञात्मक उपाधि का भाव रखा गया है, पर इसे बाद की किसी विशिष्ट मसीही परिभाषा से नहीं जोड़ा गया।
- issue: እግዚአ፡ መናፍስት का अनुवाद
  choice: सेनाओं के प्रभु
  alternative: आत्माओं के प्रभु
  rationale: मुख्य पाठ में हिंदी बाइबलीय शैली की परिचित उपाधि रखी गई है, जबकि शाब्दिक रूप पादटिप्पणी में देकर स्रोत की विशेष पदावली को पारदर्शी बनाया गया है।
- issue: अंतिम सर्वनाम ውእቱ का संदर्भ
  choice: जैसा उसने चाहा है
  alternative: जैसा प्रभु ने चाहा है
  rationale: स्रोत सर्वनाम देता है, स्पष्ट संज्ञा नहीं; इसलिए संभावित संदर्भ को मुख्य पाठ में निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज और हल्की बाइबलीय शैली रखी गई है। वाक्य की न्यायिक और अंतकालीन गंभीरता सुरक्षित है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
