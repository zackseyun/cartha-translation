base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/070/001.yaml
  text: And it came to pass after this that his name was lifted up during his lifetime before that Son of Man and before the Lord of Spirits[b][a], away from those who dwell on the dry ground.
translation:
  language: hi
  text: और इसके बाद ऐसा हुआ कि उसका नाम उसके जीते-जी उस मनुष्य-पुत्र और आत्माओं के प्रभु के पास उठाया गया[a]—सूखी भूमि पर रहने वालों से दूर[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसका नाम उठाया गया।” यह अभिव्यक्ति हनोक के स्वयं जीवित रहते हुए मनुष्य-पुत्र और आत्माओं के प्रभु की उपस्थिति में उठाए जाने की ओर संकेत कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “पृथ्वी पर रहने वालों से।” गीइज़ में अधिक विशिष्ट रूप से “सूखी भूमि पर” कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ተለዓለ፡
  choice: उठा लिया गया
  rationale: यह क्रिया ऊपर उठाए जाने का बोध देती है। यह अनुवाद स्थानगत आरोहण की छवि बनाए रखता है, पर यह अंतिम रूप से तय नहीं करता कि आशय उठा लिए जाने, ऊँचा किए जाने या दोनों से है।
- source_word: ስሙ፡
  choice: उसका नाम
  rationale: मूल पाठ सीधे ‘उसका नाम’ कहता है। यह सामी/इथियोपिक मुहावरे में व्यक्ति या उसकी पहचान का द्योतक भी हो सकता है; इसलिए इसकी असामान्यता को मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: ሕያው፡
  choice: उसके जीते-जी
  rationale: यह स्वाभाविक आधुनिक हिन्दी में इस बात को स्पष्ट करता है कि घटना उसके जीवित रहते हुई, न कि मृत्यु के बाद।
- source_word: በኀቤሁ፡ ለውእቱ፡ ወልደ፡ እጓለ፡ እመሕያው፡
  choice: उस मनुष्य-पुत्र के पास
  rationale: पूर्वसर्ग निकटता, दिशा या उपस्थिति का संकेत दे सकता है। ‘के पास’ इस अर्थ-क्षेत्र को खुला रखता है और संकेतवाचक ‘उस’ को भी सुरक्षित रखता है।
- source_word: እግዚአ፡ መናፍስት፡
  choice: आत्माओं के प्रभु
  rationale: यह 1 हनोक में प्रयुक्त स्थापित, गंभीर उपाधि का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: እምእለ፡ የኃድሩ፡ ዲበ፡ የብስ።
  choice: सूखी भूमि पर रहनेवालों से दूर
  rationale: ‘सूखी भूमि’ የብስ की ठोस ब्रह्मांड-संबंधी छवि को सामान्य ‘पृथ्वी’ की तुलना में अधिक निकटता से सुरक्षित रखती है; ‘से दूर’ अलग किए जाने की गति को व्यक्त करता है।
theological_decisions:
- issue: क्या ‘उसका नाम उठा लिया गया’ को शाब्दिक मुहावरे के रूप में रखा जाए या सीधे हनोक के उठा लिए जाने के रूप में समझाया जाए
  choice: मुख्य पाठ में ‘उसका नाम ... उठा लिया गया’ रखा गया
  alternative: ‘वह जीते-जी उठा लिया गया’ अथवा ‘उसकी ख्याति ऊँची की गई’
  rationale: मूल गीइज़ पाठ ‘उसका नाम’ को स्पष्ट रूप से सामने रखता है। इसे केवल हनोक के उठा लिए जाने या उसकी प्रतिष्ठा बढ़ने में बदलना पाठ की वास्तविक अस्पष्टता और नाम तथा व्यक्ति के संभावित संबंध को समाप्त कर देता।
- issue: ወልደ እጓለ እመሕያው को कैसे प्रस्तुत किया जाए
  choice: उस मनुष्य-पुत्र
  alternative: उस मनुष्य अथवा उस मानव-पुत्र
  rationale: दृष्टान्तों के इस प्रसंग में पदबंध एक विशिष्ट प्रलयदर्शी उपाधि की तरह काम करता है। ‘मनुष्य-पुत्र’ स्थानीय भार को बनाए रखता है, जबकि ‘उस’ मूल के संकेतवाचक रूप को सुरक्षित रखता है; इससे बाद की किसी विशेष साम्प्रदायिक व्याख्या को अनावश्यक रूप से आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘उसका नाम’ जैसी मूल की जानबूझकर असामान्य अभिव्यक्ति को समतल नहीं किया गया; ‘उसके जीते-जी’ कालगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
