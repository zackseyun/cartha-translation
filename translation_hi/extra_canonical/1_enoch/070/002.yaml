  yaml_path: translation/extra_canonical/1_enoch/070/002.yaml
  text: And he was lifted up on the chariot of the spirit[b][a], and his name vanished from among them.
translation:
  language: hi
  text: और इसके बाद ऐसा हुआ कि जीवित रहते हुए उसका नाम पृथ्वी पर रहनेवालों में से उस मनुष्य-पुत्र और आत्माओं के प्रभु के पास ऊपर उठाया गया। और वह आत्मा के रथों पर ऊपर उठा लिया गया[a], और उसका नाम उनके बीच से निकल गया[b]। उस दिन से मैं उनके बीच नहीं खींचा गया; उसने मुझे दो वायुओं के बीच, उत्तर और पश्चिम के बीच, वहाँ ठहराया जहाँ स्वर्गदूत चुने हुओं और धर्मियों के लिए मेरे लिए स्थान मापने को डोरियाँ लेते हैं। वहाँ मैंने प्राचीन पितरों और उन धर्मियों को देखा जो अनादि काल से उसी स्थान में रहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आत्मा’ के लिए प्रयुक्त गीज़ शब्द का अर्थ ‘वायु’ या ‘पवन’ भी हो सकता है; इसलिए ‘वायु के रथों पर’ भी संभव है।
    reason: lexical_ambiguity
  - marker: b
    text: शाब्दिक रूप से, ‘उसका नाम उनके बीच से निकल गया/चला गया।’ क्रिया अपने आप में यह निश्चित नहीं करती कि उसका नाम ‘लुप्त’ हुआ, केवल वहाँ से निकल गया, या उसके संबंध में कोई अन्य प्रसंगगत परिवर्तन हुआ।
    reason: literal_rendering
lexical_decisions:
- source_word: ተለዐለ፡
  choice: ऊपर उठा लिया गया
  rationale: क्रिया ऊपर जाने या उठाए जाने का भाव रखती है। कर्मवाच्य हिंदी मूल के रूप को बनाए रखती है और यह तय नहीं करती कि घटना शारीरिक थी, दर्शन में हुई थी या सम्मानसूचक थी।
- source_word: በሠረገላተ፡ መንፈስ፡
  choice: आत्मा के रथों पर
  rationale: ሠረገላተ बहुवचन ‘रथों’ है और መንፈስ का अर्थ ‘आत्मा’, ‘श्वास’ या ‘वायु’ हो सकता है। इस दर्शनात्मक प्रसंग में ‘आत्मा’ स्वाभाविक है, जबकि पादटिप्पणी वैकल्पिक अर्थ सुरक्षित रखती है।
- source_word: ወወፅአ፡ ስም፡ በማእከሎሙ፡
  choice: और उसका नाम उनके बीच से लुप्त हो गया
  rationale: शाब्दिक संरचना ‘और नाम उनके बीच से निकल गया’ है। हिंदी में ‘लुप्त हो गया’ प्रसंगगत अर्थ को स्वाभाविक रूप से व्यक्त करता है, पर पादटिप्पणी मूल की अधिक शाब्दिक और अस्पष्ट छवि बताती है।
theological_decisions:
- issue: हनोक के ऊपर उठाए जाने की प्रकृति
  choice: ऊपर उठाए जाने की छवि को बनाए रखा गया, पर उसकी प्रकृति निश्चित नहीं की गई
  alternative: इसे केवल शारीरिक स्वर्गारोहण, केवल दर्शनात्मक स्थानांतरण, या केवल महिमा-प्राप्ति कहना
  rationale: गीज़ पाठ ऊपर उठाए जाने की बात करता है, लेकिन घटना की विधि या तात्त्विक स्वरूप स्पष्ट नहीं करता।
- issue: መንፈስ का अर्थ
  choice: मुख्य पाठ में ‘आत्मा’
  alternative: ‘वायु’ या ‘पवन’
  rationale: दोनों अर्थ भाषिक रूप से संभव हैं। रथों और दर्शनात्मक आरोहण के प्रसंग में ‘आत्मा’ उपयुक्त है, पर वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और दर्शनात्मक शैली रखी गई है। ‘ऊपर उठा लिया गया’ मूल के कर्मवाच्य और दिशात्मक भाव को सुरक्षित रखता है; पादटिप्पणियाँ दो वास्तविक शब्दार्थगत अस्पष्टताओं को स्पष्ट करती हैं।
