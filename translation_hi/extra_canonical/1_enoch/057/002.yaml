  text: And the sound of their chariots was heard[a]; and when this turmoil came to be, the holy ones in heaven took notice, and the pillars of the earth were shaken from their foundations[e][d][c][b], and it was heard from one end of heaven to the other in one day.
translation:
  language: hi
  text: और उनके रथों की ध्वनि[a] सुनाई दी। जब यह हलचल[b] हुई, तब स्वर्ग के पवित्र जनों[c] ने ध्यान दिया; पृथ्वी का स्तंभ अपने आधार[d] से हिल गया, और एक ही दिन में आकाश के एक छोर से दूसरे छोर तक[e] सुनाई दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में ध्वनि के लिए दो निकटार्थक शब्द साथ आए हैं; शाब्दिक रूप से, ‘उनके रथों की ध्वनि की आवाज़’ जैसा बल है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘विक्षोभ,’ ‘उथल-पुथल’ या ‘कोलाहल’ भी हो सकता है। इस केवल गीइज़ में उपलब्ध अंश में ठीक भाव अनिश्चित है।
    reason: lexical_alternative
  - marker: c
    text: ‘पवित्र जन’ यहाँ संभवतः स्वर्गीय प्राणी हैं, क्योंकि उनका संबंध स्वर्ग से बताया गया है; मूल उन्हें सीधे ‘स्वर्गदूत’ नहीं कहता।
    reason: cultural_note
  - marker: d
    text: ‘आधार’ के लिए प्रयुक्त शब्द का अर्थ ‘स्थान’ या ‘आसन’ भी हो सकता है।
    reason: lexical_alternative
  - marker: e
    text: शब्दशः, ‘आकाश के छोरों से उसके छोर तक’; यह पूरे आकाश में फैलने का मुहावरा है। अंतिम वाक्य में ठीक क्या सुनाई दिया, यह मूल में स्पष्ट नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ተሰምዐ / ተሰምዓ
  choice: सुनाई दी / सुनाई दिया
  rationale: निष्क्रिय श्रवण-वाक्य को बनाए रखा गया है, ताकि दर्शनीय वृत्तांत की शैली और अंतिम वाक्य का अनिश्चित कर्ता सुरक्षित रहे।
- source_word: ቃለ ድምፀ ሰረገላቲሆሙ
  choice: उनके रथों की गड़गड़ाहट
  rationale: मूल में ध्वनि के लिए दो निकटार्थक पद हैं। हिंदी में ‘गड़गड़ाहट’ रथों की प्रबल ध्वनि को स्वाभाविक ढंग से व्यक्त करती है; पदों की पुनरुक्ति को पादटिप्पणी में बताया गया है।
- source_word: ዝሀውክ
  choice: यह हलचल
  rationale: यह शब्द विक्षोभ, कोलाहल या उथल-पुथल का बोध करा सकता है। ‘हलचल’ अर्थ की व्यापकता बनाए रखते हुए सहज हिंदी है।
- source_word: ቅዱሳን እምሰማይ
  choice: स्वर्ग के पवित्र जन
  rationale: इससे उनका स्वर्ग से संबंध व्यक्त होता है, पर उन्हें मुख्य पाठ में स्पष्ट रूप से ‘स्वर्गदूत’ कहकर पहचान निश्चित नहीं की जाती।
- source_word: አእመሩ
  choice: जान लिया
  rationale: क्रिया जानने, पहचानने या अवगत होने का अर्थ देती है। ‘जान लिया’ घटना के प्रति उनकी जागरूकता को सीधे व्यक्त करता है।
- source_word: ዐምደ ምድር
  choice: पृथ्वी का खंभा
  rationale: प्रस्तुत गीइज़ पाठ में संज्ञा एकवचन है। प्राचीन ब्रह्मांडीय स्थापत्य की छवि को रूपक बनाकर हल्का नहीं किया गया।
- source_word: ተሐውሰ እመንበሩ
  choice: अपने स्थान से हिल गया
  rationale: מूल संज्ञा स्थान, आसन या आधार का अर्थ दे सकती है। ‘अपने स्थान से’ अनावश्यक संरचनात्मक व्याख्या किए बिना व्यापक अर्थ सुरक्षित रखता है।
- source_word: እምአጽናፈ ሰማይ እስከ አጽናፍ
  choice: आकाश के एक छोर से दूसरे छोर तक
  rationale: मूल की ‘छोरों से छोर तक’ अभिव्यक्ति का स्वाभाविक हिंदी मुहावरा चुना गया है।
- source_word: በአሐቲ ዕለት
  choice: एक ही दिन में
  rationale: एक दिन की सीमित अवधि पर मूल के बल को ‘ही’ से स्पष्ट किया गया है।
theological_decisions:
- issue: ‘पवित्र जनों’ की पहचान
  choice: मुख्य पाठ में ‘स्वर्ग के पवित्र जन’
  alternative: ‘स्वर्गदूत’ या ‘मानवीय संत’
  rationale: हनोक की दर्शनीय पृष्ठभूमि में ये संभवतः स्वर्गीय प्राणी हैं, किंतु मूल पद केवल ‘पवित्र जन’ कहता है। इसलिए संभावित पहचान पादटिप्पणी में दी गई है, मुख्य पाठ में निश्चित नहीं की गई।
- issue: पृथ्वी के खंभे की ब्रह्मांडीय छवि
  choice: छवि को अक्षरशः ‘पृथ्वी का खंभा’ रखा गया
  alternative: ‘पृथ्वी की नींव’ या सामान्यतः ‘पृथ्वी हिल गई’
  rationale: मूल की प्राचीन ब्रह्मांडीय भाषा को आधुनिक वैज्ञानिक या केवल रूपकात्मक कथन में नहीं बदला गया।
- issue: अंतिम ‘वह’ का संदर्भ
  choice: सर्वनामात्मक अस्पष्टता बनाए रखी गई
  alternative: स्पष्ट रूप से ‘रथों की आवाज़’ या ‘हलचल’ कहना
  rationale: गीइज़ में अंतिम निष्क्रिय क्रिया यह स्पष्ट नहीं करती कि ठीक क्या सुनाई दिया; मुख्य पाठ इस वास्तविक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘रथ,’ ‘पवित्र जन’ और ‘पृथ्वी का खंभा’ जैसी दर्शनीय-ब्रह्मांडीय शब्दावली सुरक्षित है। मूल की वास्तविक अस्पष्टताओं को मुख्य पाठ या पादटिप्पणियों में बनाए रखा गया है।
