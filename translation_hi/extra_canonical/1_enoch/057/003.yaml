  text: And all of them shall fall down and worship the Lord of Spirits[a]. And this is the end of the second parable.
translation:
  language: hi
  text: और वे सब गिर पड़ेंगे और आत्माओं के प्रभु की आराधना करेंगे। और यह दूसरे दृष्टान्त[a] का अन्त है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘किसी अन्य दृष्टान्त का अन्त’ अथवा ‘उस अन्य दृष्टान्त का अन्त’, यदि ካልእ को क्रमसूचक ‘दूसरा’ के बजाय गैर-क्रमसूचक अर्थ में समझा जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወድቁ
  choice: गिर पड़ेंगे
  rationale: यह क्रिया श्रद्धा के प्रसंग में नीचे गिरने की शारीरिक क्रिया बताती है; ‘गिर पड़ेंगे’ उसे स्पष्ट रखता है, बिना इसे केवल अनुष्ठानिक दण्डवत् के रूप में सीमित किए।
- source_word: ኵሎሙ
  choice: वे सब
  rationale: मूल में सर्वसमावेशी अर्थ और सर्वनामिक संदर्भ दोनों स्पष्ट हैं; ‘वे सब’ आधुनिक हिन्दी में स्वाभाविक रूप से दोनों को बनाए रखता है।
- source_word: ይሰግዱ
  choice: आराधना करेंगे
  rationale: आत्माओं के प्रभु के सामने गिर पड़ने के साथ यह क्रिया उपासना और श्रद्धा का धार्मिक भाव रखती है; शारीरिक मुद्रा पिछली क्रिया में पहले ही व्यक्त है।
- source_word: ለእግዚአ መናፍስት
  choice: आत्माओं के प्रभु
  rationale: यह 1 हनोक में प्रयुक्त विशिष्ट ईश्वरीय उपाधि है; इसे उपाधि के रूप में सुरक्षित रखा गया है।
- source_word: ዝንቱ ውእቱ
  choice: यह ... है
  rationale: यह सीधा पहचानसूचक वाक्य-विन्यास है, जिसे स्वाभाविक हिन्दी में संक्षेप से व्यक्त किया गया है।
- source_word: ተፍጻሜተ
  choice: अन्त
  rationale: यह खण्ड की समाप्ति या निष्कर्ष को सूचित करता है; ‘अन्त’ इस साहित्यिक समापन-सूत्र के लिए स्पष्ट और सहज है।
- source_word: ካልእ ምሳሌ
  choice: दूसरे दृष्टान्त
  rationale: इस खण्ड-समापन के प्रसंग में ካልእ का क्रमसूचक अर्थ ‘दूसरा’ अधिक सम्भावित है; फिर भी ‘एक अन्य/दूसरे’ अर्थ की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय उपाधि ለእግዚአ መናፍስት का अनुवाद
  choice: आत्माओं के प्रभु
  alternative: आत्माओं के स्वामी
  rationale: ‘प्रभु’ विशिष्ट उपाधि के रूप को बनाए रखता है और पाठ की अपनी ईश्वरीय शब्दावली को बाद की धर्मवैज्ञानिक पदावली से नहीं बदलता।
- issue: समापन-सूत्र में ካልእ का अर्थ
  choice: दूसरे दृष्टान्त
  alternative: एक अन्य दृष्टान्त / दूसरे दृष्टान्त (गैर-क्रमसूचक अर्थ में)
  rationale: दृष्टान्तों की पुस्तक के संरचनात्मक प्रसंग में क्रमसूचक अर्थ अधिक सम्भावित है, पर वैकल्पिक अर्थ को चुपचाप हटाने के बजाय पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण और सहज शैली। ‘दृष्टान्त’ को साहित्यिक इकाई के पारम्परिक किन्तु बोधगम्य नाम के रूप में रखा गया है; वाक्य-विन्यास मूल के दो समन्वित कथनों को बनाए रखता है।
