  source_fidelity: 'The Hindi retains the sequence and imagery of the Geʽez: a further collective of chariots, people riding in them, movement upon the winds, and the geographical extent from east and west to the south. “हवाओं पर” properly preserves the marked spatial expression rather than reducing it to travel merely ‘with’ the wind. “दक्षिण तक” accurately conveys the directional sense of ‘midday.’'
