base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/057/001.yaml
  text: And after that I saw another host of chariots, and men riding in them; and they were coming upon the winds from the east and from the west, as far as the south.
translation:
  language: hi
  text: इसके बाद मैंने रथों का एक और दल देखा। उन पर मनुष्य सवार थे; और वे पूर्व और पश्चिम से दक्षिण तक, हवाओं पर चले आ रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ካልእተ፡ ትዕይንተ፡ ሠረገላት
  choice: रथों का एक और दल
  rationale: यह पदबंध पाठगत रूप से कठिन है। उपलब्ध गीइज़ पाठ में ትዕይንተ सामान्यतः ‘दृश्य/दर्शन’ की ओर संकेत कर सकता है, पर परामर्श-पाठ इसे ‘host’ समझता है; प्रसंग में अनेक रथ और उन पर सवार मनुष्य होने के कारण ‘दल’ स्वाभाविक है, जबकि अनिश्चितता को निर्णय-टिप्पणी में सुरक्षित रखा गया है।
- source_word: ይጼዐኑ፡ ሰብእ፡ ውስቴቶሙ
  choice: उन पर मनुष्य सवार थे
  rationale: क्रिया का मूल भाव चढ़ाए जाने या सवार होने का है; हिन्दी में रथों के संदर्भ में ‘सवार थे’ स्पष्ट और सहज है।
- source_word: ዲበ፡ ነፋሳት
  choice: हवाओं पर
  rationale: पूर्वसर्ग ዲበ का स्थानिक अर्थ ‘पर/ऊपर’ है; असामान्य चित्र को सामान्य बनाकर ‘हवा के साथ’ नहीं किया गया।
- source_word: እምስራቅ፡ ወእምዕራብ፡ እስከ፡ መንፈቀ፡ ዕለት
  choice: पूर्व और पश्चिम से दक्षिण तक
  rationale: መንፈቀ ዕለት शाब्दिक रूप से ‘दिन का मध्य’ है और दिशा-सूचक प्रयोग में ‘दक्षिण’ को दर्शाता है।
theological_decisions:
- issue: रथों के पदबंध में ‘दर्शन’ या ‘दल’
  choice: दल
  alternative: रथों का एक और दर्शन
  rationale: मध्यम-विश्वसनीयता वाले पाठ और अंग्रेज़ी परामर्श-पाठ के आधार पर सामूहिक अर्थ चुना गया है। यह धर्मसैद्धांतिक निष्कर्ष नहीं, पाठगत निर्णय है; ‘दर्शन’ व्याकरणतः संभव विकल्प बना रहता है।
- issue: हवाओं से रथों का संबंध
  choice: हवाओं पर चले आ रहे थे
  alternative: हवाओं के साथ चले आ रहे थे
  rationale: मूल के ‘पर’ संबंध को बनाए रखा गया है ताकि अलौकिक या काव्यात्मक तनाव अनावश्यक रूप से न मिटे।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सरल कथात्मक शैली। ‘मनुष्य’ और ‘रथों का दल’ सामान्य पाठक के लिए सुबोध हैं। स्रोत-पाठ की असामान्य दिशात्मक और वायवीय छवि को स्पष्ट किए बिना यथासंभव सुरक्षित रखा गया है।
