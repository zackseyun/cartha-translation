base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/085/003.yaml
  text: Before I took your mother Edna[a], I saw in a vision on my bed, and behold, a bull came up from the earth; and that bull was white. And after it there came out one heifer, and with her came out two bulls[c][b], and one of them was black and one red.
translation:
  language: hi
  text: तुम्हारी माँ एडना से विवाह करने से पहले, मैंने अपने बिछौने पर एक स्वप्न-दर्शन देखा[a]। और देखो, पृथ्वी में से एक बैल निकला; वह बैल सफेद था। उसके बाद एक बछिया निकली, और उसके साथ दो बैल निकले[b]। उनमें से एक काला और दूसरा लाल था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैंने अपने बिछौने/नींद के दर्शन में देखा।”
    reason: lexical_alternative
  - marker: b
    text: इस स्वप्न-दर्शन में पशुओं का वर्णन प्रतीकात्मक है; मुख्य पाठ संभावित व्यक्तियों की पहचान बताए बिना दर्शन की अपनी छवियों को सुरक्षित रखता है।
    reason: cultural_note
lexical_decisions:
- source_word: እንበለ፡ እንሥአ፡ ለአምክ፡ ኤድና
  choice: तुम्हारी माँ एडना को ब्याहने से पहले
  rationale: यह आरंभिक कालवाचक उपवाक्य और एडना का नाम स्पष्ट रूप से सुरक्षित रखता है। ‘ब्याहने’ से पत्नी के रूप में ग्रहण करने का आशय स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
- source_word: ርኢኩ፡ በራእየ፡ ምስካብየ
  choice: मैंने अपने बिछौने पर एक दर्शन देखा
  rationale: ‘दर्शन’ मूल के प्रकाशनात्मक/स्वप्न-दर्शन संबंधी पद को बनाए रखता है और ‘बिछौने पर’ सोने की परिस्थिति को व्यक्त करता है। अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: ላህም
  choice: बैल
  rationale: नर गोवंश की छवि को स्पष्ट रखता है और आगे आने वाली बछिया से उसका भेद बनाए रखता है।
- source_word: ወፅአ፡ እምድር
  choice: पृथ्वी में से एक बैल निकला
  rationale: पृथ्वी के भीतर से बाहर आने की सजीव दृश्यात्मक गति को सीधे रूप में व्यक्त करता है।
- source_word: ጸዓዳ
  choice: सफेद
  rationale: रंग-सूचक शब्द का सरल और सटीक अनुवाद है; प्रतीकात्मक रंग-विरोध भी सुरक्षित रहता है।
- source_word: ጣዕዋ፡ እንስቲያት፡ አሐቲ
  choice: एक बछिया
  rationale: एक मादा गोवंश को संक्षिप्त, सहज और लिंग-स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: ወምስሌሃ፡ ወፅኡ፡ ክልኤቱ፡ ጣዕዋ
  choice: उसके साथ दो बैल निकले
  rationale: दोनों नर पशुओं के बछिया के साथ प्रकट होने और उनकी संख्या को स्पष्ट रखता है।
- source_word: ጸሊመ
  choice: काला
  rationale: रंग का सीधा अनुवाद है और दृश्य के प्रतीकात्मक विरोध को बनाए रखता है।
- source_word: ቀይሐ
  choice: लाल
  rationale: रंग का पारदर्शी और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: स्वप्न-दर्शनों में पशु-प्रतीक
  choice: मुख्य पाठ में पशुओं का वर्णन ज्यों का त्यों रखा गया है और व्यक्तियों के रूप में उनकी व्याख्यात्मक पहचान नहीं जोड़ी गई।
  alternative: मुख्य पाठ में बैल और बछिया के स्थान पर उनके संभावित मानवीय प्रतीकार्थ देना।
  rationale: यह खंड अपनी बात सतत पशु-प्रतीकों के द्वारा कहता है। अनुवाद को दर्शन की अपनी भाषा सुरक्षित रखनी चाहिए और संभावित पहचान को पाठ में आरोपित नहीं करना चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘और देखो’ प्रकाशनात्मक दृश्य के अचानक खुलने का भाव बनाए रखता है। पशुओं और रंगों के लिए सरल, सामान्य शब्द चुने गए हैं; व्याख्यात्मक पहचान मुख्य पाठ में नहीं जोड़ी गई।
