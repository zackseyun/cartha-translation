  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወዝኩ
  choice: और वह
  rationale: यह पद पिछले दर्शन-वर्णन को आगे बढ़ाते हुए उसी विशेष पशु की ओर संकेत करता है; इसमें ‘मैंने देखा’ जोड़ना मूल में उपस्थित नहीं है।
- source_word: ጸሊም
  choice: काली
  rationale: रंग-संबंधी प्रतीकात्मकता को सीधे और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: ጣዕዋ
  choice: बछिया
  rationale: यहाँ शब्द एक कम उम्र के गोवंशीय पशु को सूचित करता है। आगे की स्त्रीलिंग क्रिया के अनुरूप ‘बछिया’ चुना गया है।
- source_word: ላህቀ
  choice: बड़ी हुई
  rationale: यह क्रिया पशु के बढ़ने या बड़ा होने को व्यक्त करती है; इसे संकेतवाचक शब्द न मानकर क्रिया के रूप में अनूदित किया गया है।
- source_word: ወመጽአት
  choice: और वह आई
  rationale: मूल क्रिया स्त्रीलिंग एकवचन है और सामान्य अर्थ ‘आना’ है। हिन्दी में स्त्रीलिंग रूप मूल की व्याकरणिक सूचना बनाए रखता है।
theological_decisions:
- issue: पशु-दर्शन की प्रतीकात्मक छवि
  choice: ‘काली बछिया’ की ठोस पशु-छवि को अनुवाद में बनाए रखा गया है।
  alternative: किसी जाति, शासक या ऐतिहासिक व्यक्ति का अर्थ लगाकर व्याख्यात्मक अनुवाद करना।
  rationale: यह सर्वनाश-संबंधी प्रतीकात्मक दर्शन है; प्रतीक की ऐतिहासिक पहचान अनुवाद-पंक्ति में आरोपित करने के बजाय व्याख्या के लिए छोड़ी जानी चाहिए।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। मूल की संक्षिप्त, क्रमिक कथन-शैली को बनाए रखते हुए अनावश्यक कर्ता या व्याख्या नहीं जोड़ी गई।
