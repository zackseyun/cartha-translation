  yaml_path: translation/extra_canonical/1_enoch/085/004.yaml
  text: And that black calf struck the red calf and pursued it onto the earth[c][b][a], and after that I could no longer see that red calf.
translation:
  language: hi
  text: और उस काले बछड़े ने लाल बछड़े को मारा और धरती तक उसका पीछा किया[a][b]; इसके बाद मैं उस लाल बछड़े को फिर नहीं देख सका।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मारा’ का अनुवाद ‘सींग मारा’ भी किया जा सकता है, क्योंकि प्रसंग गोवंशीय पशुओं का है; पर मूल क्रिया केवल प्रहार या चोट पहुँचाने को भी व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: ‘धरती तक’ का अर्थ प्रसंग के अनुसार ‘भूमि पर’ या ‘धरती के भीतर’ भी समझा जा सकता है। मूल अभिव्यक्ति गति और धरती का संबंध बताती है, पर दिशा का सूक्ष्म अर्थ पूरी तरह निश्चित नहीं करती।
    reason: lexical_alternative
