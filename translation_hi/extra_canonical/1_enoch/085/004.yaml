- source_word: ለቀይሕ
  choice: लाल बछड़े को
  rationale: मूल में रंग द्वारा कर्म की पहचान होती है; हिन्दी में संदर्भ की स्पष्टता और स्रोत में पशु-संज्ञा की पुनरावृत्ति बनाए रखने के लिए ‘बछड़ा’ जोड़ा गया है।
- source_word: ተለዎ
  choice: उसका पीछा करते हुए
  rationale: पहले हुए हिंसक प्रहार के संदर्भ में यह तटस्थ ‘पीछे गया’ से अधिक उपयुक्त रूप से आक्रामक अनुगमन व्यक्त करता है।
- source_word: ውስተ ምድር
  choice: धरती तक
  rationale: यह गमन और धरती/भूमि का स्थानिक बोध बनाए रखता है, जबकि यह निश्चित नहीं करता कि बछड़ा धरती के भीतर गया या केवल भूमि पर गिरा।
- source_word: አክሀልኩ እምሶቤሃ ርእዮቶ
  choice: इसके बाद मैं ... फिर नहीं देख सका
  rationale: यह समय के उस बिंदु के बाद दृष्टि से ओझल हो जाने का स्वाभाविक हिन्दी रूप है।
