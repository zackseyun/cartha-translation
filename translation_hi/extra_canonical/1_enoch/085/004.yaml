translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और दृश्यात्मक शैली। ‘बछड़ा’ सामान्य पाठक के लिए स्वाभाविक है और यहाँ अनचाहा स्त्रीलिंग अर्थ नहीं लाता। विरामचिह्न द्वारा दोनों क्रमिक घटनाओं को स्पष्ट किया गया है।
