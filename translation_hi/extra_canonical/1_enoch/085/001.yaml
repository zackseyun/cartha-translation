  text: And after this I saw another dream[a], and I will show you the whole dream[b], my son.
translation:
  language: hi
  text: इसके बाद मैंने एक और स्वप्न देखा, और हे मेरे पुत्र, मैं तुम्हें वह पूरा स्वप्न[a] दिखाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हर स्वप्न।” गीइज़ पदबंध का अर्थ इस विशेष स्वप्न की संपूर्णता हो सकता है; इसे क्रम में आए प्रत्येक स्वप्न के अर्थ में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረዝ
  choice: इसके बाद
  rationale: यह अगले दर्शन की ओर ले जाने वाला कालवाचक संक्रमण है; आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल की कथात्मक गति बनाए रखता है।
- source_word: ካልአ ሕለመ
  choice: एक और स्वप्न
  rationale: यह पहले से भिन्न अगले स्वप्न को सूचित करता है; ‘दूसरा स्वप्न’ भी संभव है, पर ‘एक और स्वप्न’ अधिक स्वाभाविक है।
- source_word: ርኢኩ
  choice: मैंने ... देखा
  rationale: प्रथम पुरुष में दर्शन-वर्णन की सीधी और सामान्य अभिव्यक्ति।
- source_word: ኵሎ ሕልመ
  choice: वह पूरा स्वप्न
  rationale: एकवचन ‘स्वप्न’ और ठीक पहले आए ‘एक और स्वप्न’ के संदर्भ के कारण यह उसी विशिष्ट स्वप्न की संपूर्णता दर्शाता है।
- source_word: አርእየከ
  choice: मैं तुम्हें ... दिखाऊँगा
  rationale: मूल क्रिया का कारक भाव ‘दिखाना/देखने देना’ सुरक्षित रहता है; इसे केवल ‘सुनाऊँगा’ कहने से दृश्यात्मक बल घट जाता।
- source_word: ወልድየ
  choice: हे मेरे पुत्र
  rationale: सीधे आत्मीय संबोधन को गरिमापूर्ण और स्पष्ट हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ኵሎ ሕልመ का विस्तार
  choice: वह पूरा स्वप्न
  alternative: हर स्वप्न
  rationale: व्याकरणिक एकवचन और निकटतम पूर्वपद ‘एक और स्वप्न’ सामूहिक अर्थ—इस विशिष्ट स्वप्न की पूरी सामग्री—का समर्थन करते हैं। फिर भी वितरणात्मक अर्थ की वास्तविक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘दिखाऊँगा’ मूल के दृश्यात्मक/कारक अर्थ को बनाए रखता है, जबकि पादटिप्पणी वास्तविक अर्थगत अस्पष्टता को सुरक्षित रखती है।
