base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/085/002.yaml
  text: 'And Enoch lifted up his voice and said to his son Methuselah[a], “To you I speak, my son: hear my words, and incline your ear to the vision of your father’s dream.”'
translation:
  language: hi
  text: 'और हनोक ने स्वर उठाकर अपने पुत्र मतूशेलह से कहा, “मैं तुमसे कहता हूँ, मेरे पुत्र: मेरी बातें सुनो और अपने पिता के स्वप्न-दर्शन[a] पर ध्यान दो।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वप्न का दर्शन।” गीज़ पदबंध में दर्शन/देखने और स्वप्न, दोनों की भाषा जुड़ी हुई है।
    reason: मूल पदबंध के दो निकट संभावित रूपों और उसके संयुक्त अर्थगत स्वरूप को दिखाना।
lexical_decisions:
- source_word: አንሥአ
  choice: स्वर उठाकर
  rationale: मूल क्रिया ‘उठाने’ या ‘ऊँचा करने’ का भाव रखती है। कथन-सूत्र में निहित वाणी को स्पष्ट करके यह हिंदी में स्वाभाविक रहते हुए मूल की गंभीरता बनाए रखता है।
- source_word: ወይቤ
  choice: कहा
  rationale: यह कथावृत्त में प्रयुक्त सामान्य वचन-क्रिया का सीधा और स्वाभाविक हिंदी रूप है।
- source_word: ለወልዱ ማቱሳላ
  choice: अपने पुत्र मतूशेलह से
  rationale: सम्बोधित व्यक्ति और पिता-पुत्र का संबंध स्पष्ट रखा गया है; नाम को प्रचलित हिंदी बाइबलीय रूप में लिप्यंतरित किया गया है।
- source_word: ለከ እብለከ
  choice: मैं तुमसे कहता हूँ
  rationale: मूल में सम्बोधित व्यक्ति पर बल है। हिंदी में यह रूप सीधे सम्बोधन को स्पष्ट और स्वाभाविक रखता है।
- source_word: ወልድየ
  choice: मेरे पुत्र
  rationale: यह स्नेह और पैतृक अधिकार से भरे सम्बोधन को गरिमापूर्ण आधुनिक हिंदी में व्यक्त करता है।
- source_word: ስማዕ ነገርየ
  choice: मेरी बात सुनो
  rationale: आज्ञार्थक सुनने की क्रिया और वक्तव्य के अर्थ को सहज आधुनिक हिंदी में रखा गया है।
- source_word: አጽንን እዝነከ
  choice: कान लगाओ
  rationale: मूल की ठोस श्रवण-छवि और ध्यानपूर्वक सुनने के आग्रह को बनाए रखता है।
- source_word: ለርእየ ሕልመ
  choice: स्वप्न-दर्शन
  rationale: संयुक्त अभिव्यक्ति में देखने/दर्शन और स्वप्न, दोनों के भाव हैं; ‘स्वप्न-दर्शन’ दोनों को संक्षेप और स्वाभाविक रूप से सुरक्षित रखता है।
- source_word: አቡከ
  choice: अपने पिता के
  rationale: वक्ता हनोक को श्रोता के पिता के रूप में पहचानने वाला संबंध मूल के अनुसार स्पष्ट रखा गया है।
theological_decisions:
- issue: ርእየ ሕልመ में स्वप्न और दर्शन का संबंध
  choice: स्वप्न-दर्शन
  alternative: स्वप्न का दर्शन
  rationale: यह प्रलयदर्शी प्रसंग के दृश्य और स्वप्नगत, दोनों स्वरूपों को बनाए रखता है और इसे केवल साधारण स्वप्न मानकर अर्थ को सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पिता-पुत्र के सीधे सम्बोधन में ‘तुम’ का प्रयोग अत्यधिक पुरातन या अपमानसूचक प्रभाव से बचता है। ‘कान लगाओ’ मूल की असामान्य श्रवण-छवि को समतल किए बिना स्वाभाविक हिंदी देता है।
