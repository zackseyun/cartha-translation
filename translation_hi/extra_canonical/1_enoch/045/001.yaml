base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/001.yaml
  text: And this is the second parable concerning those who deny the name of the dwelling of the holy ones and of the Lord of Spirits[a][b][c].
translation:
  language: hi
  text: और यह उन लोगों के विषय में दूसरा दृष्टान्त है, जो पवित्र जनों के निवास और आत्माओं के प्रभु के नाम का इनकार करते हैं[a][b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नाम का इनकार’ के बाद की गीज़ रचना कठिन है। इसका अर्थ ‘पवित्र जनों के निवास और आत्माओं के प्रभु के नाम’ हो सकता है, पर वाक्य के अन्य अर्थ भी सम्भव हैं।
    reason: textual_variant
  - marker: b
    text: ‘पवित्र जन’ से स्वर्गीय पवित्र प्राणी, धर्मी लोग, या इस प्रकाशन-साहित्यिक प्रसंग में जानबूझकर दोनों को समेटने वाला भाव अभिप्रेत हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘एक और दृष्टान्त’ भी सम्भव है; किन्तु पुस्तक में दृष्टान्तों के क्रम के कारण यहाँ ‘दूसरा दृष्टान्त’ किया गया है।
    reason: previous_rendering
