- source_word: ዲበ
  choice: के विषय में
  rationale: यहाँ पूर्वसर्ग स्थान नहीं, बल्कि दृष्टान्त का विषय प्रस्तुत करता है।
- source_word: እለ ይክሕዱ
  choice: जो ... इनकार करते हैं
  rationale: सम्बन्धवाचक पद और अपूर्ण क्रिया के निरन्तर/विशेषतासूचक भाव को रखा गया है; ‘इनकार’ अस्वीकार के बल को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: ስሞ
  choice: नाम
  rationale: ठोस शब्द ‘नाम’ को ज्यों का त्यों रखा गया है; इसे ‘अधिकार’ या ‘महिमा’ बनाकर अर्थ नहीं खोला गया।
- source_word: ለማኅደረ ቅዱሳን
  choice: पवित्र जनों के निवास
  rationale: ማኅደር के निवास-स्थान संबंधी स्थानिक बिम्ब को ‘निवास’ सुरक्षित रखता है; कठिन सम्बन्धकारक रचना को अत्यधिक स्पष्ट नहीं किया गया।
- source_word: ቅዱሳን
  choice: पवित्र जनों
  rationale: यह अभिव्यक्ति स्वर्गीय पवित्र प्राणियों और धर्मी समुदाय—दोनों सम्भावित संकेतों को खुला रखती है; ‘सन्तों’ की अपेक्षा कम सम्प्रदाय-विशिष्ट है।
- source_word: ወእግዚአ መናፍስት
  choice: और आत्माओं के प्रभु
  rationale: हनोक के दृष्टान्तों में प्रयुक्त इस ईश्वरीय उपाधि का अर्थानुवाद किया गया है और स्रोत का बहुवचन बनाए रखा गया है।
theological_decisions:
- issue: ‘पवित्र जनों’ का अभिप्राय
  choice: ‘पवित्र जनों’ कहकर अस्पष्टता सुरक्षित रखी गई
  alternative: स्वर्गदूत अथवा धर्मी समुदाय के रूप में निश्चित करना
  rationale: निकटवर्ती वाक्यांश यह निश्चित नहीं करता कि संकेत स्वर्गीय पवित्र प्राणियों, चुने हुए धर्मियों, या दोनों की ओर है।
- issue: ‘नाम’ और ‘निवास’ के बीच कठिन सम्बन्ध
  choice: स्रोत के निकट रहते हुए ‘पवित्र जनों के निवास और आत्माओं के प्रभु के नाम’
  alternative: ‘पवित्र जनों और आत्माओं के प्रभु के निवास का नाम’; अथवा ‘उस नाम का इनकार करते हैं जिसके द्वारा पवित्र जन निवास करते हैं’
  rationale: गीज़ वाक्यरचना संकुचित और कठिन है तथा यहाँ यूनानी या क़ुमरान-पाठ का नियंत्रण उपलब्ध नहीं है; इसलिए अनिश्चितता को टिप्पणी सहित सुरक्षित रखना उचित है।
- issue: ካልእ का क्रमसूचक अर्थ
  choice: दूसरा
  alternative: एक और
  rationale: शब्द दोनों अर्थ दे सकता है, किन्तु प्रथम और तृतीय दृष्टान्तों से चिह्नित साहित्यिक क्रम यहाँ क्रमसूचक अर्थ का समर्थन करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य रूप। ‘दृष्टान्त’, ‘पवित्र जन’ और ‘आत्माओं के प्रभु’ प्रकाशन-साहित्य के औपचारिक स्वर को बनाए रखते हैं। कठिन गीज़ सम्बन्धकारक रचना को मुख्य पाठ में न्यूनतम रूप से सँवारा गया है और उसकी वास्तविक अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
