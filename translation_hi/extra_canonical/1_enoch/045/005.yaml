base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/005.yaml
  text: And I will transform the dry land and make it a blessing[a], and I will cause my chosen ones to dwell in it[c][b]; but those who commit sin and transgression shall not set foot in it.
translation:
  language: hi
  text: और मैं सूखी धरती को बदल दूँगा और उसे आशीष बना दूँगा[a]; और अपने चुने हुओं को उस पर बसाऊँगा। परन्तु जो पाप और अपराध करते हैं, वे उस पर पाँव न रखेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे आशीषमय बना दूँगा।” मूल रचना का अर्थ धरती को आशीष से परिपूर्ण करना अथवा उसे आशीष बना देना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वे उस पर न जाएँगे/चलेंगे।” प्रसंग में इसका आशय बदली हुई धरती में प्रवेश न पाने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እዌልጦ
  choice: बदल दूँगा
  rationale: क्रिया अवस्था-परिवर्तन बताती है। आधुनिक हिन्दी में ‘बदल दूँगा’ स्वाभाविक है और भावी युग के प्रबल उलटाव को बिना अतिव्याख्या के व्यक्त करती है।
- source_word: ለየብስ
  choice: सूखी धरती
  rationale: የብስ सूखी भूमि अथवा स्थल को सूचित करता है। पिछले पद के आकाशीय परिप्रेक्ष्य के साथ ‘धरती’ व्यापक पार्थिव अर्थ को बनाए रखती है, जबकि ‘सूखी’ मूल शब्द की ठोस छवि बचाती है।
- source_word: እገብራ በበረከት
  choice: उसे आशीष बना दूँगा
  rationale: 'यह परिणामसूचक रचना है: धरती आशीष से युक्त ही नहीं, ‘आशीष’ बनती है। इसलिए संज्ञात्मक अभिव्यक्ति को बनाए रखा गया है।'
- source_word: ሕሩያነ ዚአየ
  choice: अपने चुने हुओं
  rationale: यह परमेश्वर द्वारा चुने गए लोगों की स्थानीय अपोकैलिप्टिक श्रेणी को स्पष्ट रखता है और बाद की विशिष्ट कलीसियाई शब्दावली नहीं थोपता।
- source_word: አነብሮሙ ውስቴታ
  choice: उस पर बसाऊँगा
  rationale: 'कारक क्रिया का भाव सुरक्षित है: वक्ता स्वयं चुने हुओं को वहाँ स्थायी रूप से स्थापित करता है। भूमि के साथ हिन्दी में ‘उस पर बसाऊँगा’ स्वाभाविक है।'
- source_word: ኃጢአተ ወጌጋየ
  choice: पाप और अपराध
  rationale: दोनों नैतिक पदों को अलग रखा गया है ताकि मूल का द्विपदीय बल एक सामान्य शब्द में न सिमट जाए।
- source_word: ኢይከይዱ ውስቴታ
  choice: उस पर पाँव न रखेंगे
  rationale: मूल क्रिया जाने या चलने की है। यह मुहावरा भूमि में प्रवेश से वंचित किए जाने का प्रसंगगत अर्थ स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक आधार पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ‘चुने हुओं’ की पहचान और अर्थ-सीमा
  choice: ‘अपने चुने हुओं’ रखा गया, बिना उन्हें किसी बाद की विशिष्ट धार्मिक समुदाय-संज्ञा से पहचानने के।
  alternative: ‘अपने पवित्र लोगों’ या किसी उत्तरकालीन सिद्धान्तगत पद का प्रयोग।
  rationale: गीज़ पद चयन अथवा कृपाप्राप्ति बताता है। स्थानीय हनोक-साहित्यिक श्रेणी बनाए रखने से पाठ का धर्मवैज्ञानिक तनाव खुला रहता है।
- issue: धरती की प्रतिज्ञा का स्वरूप
  choice: ‘सूखी धरती’ के ठोस, व्यापक चित्र को रखा गया।
  alternative: इसे केवल ‘मरुभूमि’ जैसे स्थानीय भूभाग या केवल रूपक के रूप में प्रस्तुत करना।
  rationale: पाठ सूखी धरती के आशीष में बदलने और चुने हुओं के वहाँ बसने का युगान्तकारी उलटाव दिखाता है। ठोस अनुवाद प्रतीकात्मक अथवा विश्वव्यापी अर्थ की संभावना को बंद नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और घोषणात्मक भविष्यकाल अपनाया गया है। ‘परन्तु’ न्याय-विरोध को स्पष्ट करता है; शब्दावली को अनावश्यक संस्कृतनिष्ठता और सम्प्रदायगत पदों से बचाया गया है।
