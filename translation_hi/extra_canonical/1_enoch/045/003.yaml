base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/003.yaml
  text: On that day my Chosen One will sit on the throne of glory[a], and he will choose their works and their resting places without number[d][c][b]; and their souls will grow strong within them when they see my Chosen Ones and those who have called on my glorious name.
translation:
  language: hi
  text: उस दिन मेरा चुना हुआ जन महिमा के सिंहासन पर बैठेगा। वह उनके कामों और उनके अनगिनत विश्राम-स्थानों को चुनेगा[a]। जब वे मेरे चुने हुए जनों[b] को और उन लोगों को देखेंगे जिन्होंने मेरे महिमामय नाम में शरण ली है[c], तब उनकी आत्माएँ उनके भीतर दृढ़ हो जाएँगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह वाक्य कठिन है। क्रिया का अर्थ ‘चुनना’, ‘छाँटना’ या ‘निर्धारित करना’ हो सकता है; और वाक्य को इस प्रकार भी समझा जा सकता है: “वह उनके कामों को चुनेगा, और उनके विश्राम-स्थानों की कोई गिनती न होगी।” ‘विश्राम-स्थान’ का अनुवाद ‘निवास-स्थान’ या ‘ठहरने के स्थान’ भी हो सकता है।'
    reason: lexical_and_syntactic_ambiguity
  - marker: b
    text: यहाँ पाठ पहले के एकवचन “मेरा चुना हुआ जन” से बहुवचन “मेरे चुने हुए जनों” पर आ जाता है। यह सिंहासन पर बैठे व्यक्ति और उससे जुड़े समुदाय के बीच जानबूझकर किया गया भेद हो सकता है, यद्यपि पाठ कठिन है।
    reason: textual_difficulty
  - marker: c
    text: गीज़ क्रिया का मूल अर्थ ‘भागना’ या ‘शरण लेना’ है। इसलिए कुछ अनुवादों में पाए जाने वाले “मेरे महिमामय नाम को पुकारा है” के बजाय यहाँ “मेरे महिमामय नाम में शरण ली है” किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: उस दिन
  rationale: यह भविष्यसूचक और प्रलयदर्शी साहित्य का स्वाभाविक काल-सूचक वाक्यांश है।
- source_word: ይነብር ዲበ መንበረ ስብሐት
  choice: महिमा के सिंहासन पर बैठेगा
  rationale: सिंहासन के साथ क्रिया का अर्थ सामान्य निवास करने के बजाय बैठने अथवा सिंहासनारूढ़ होने का है; औपचारिक बिंब सुरक्षित रखा गया है।
- source_word: ኅሩየየ
  choice: मेरा चुना हुआ जन
  rationale: एकवचन और प्रथम पुरुष संबंध दोनों स्पष्ट रखे गए हैं; इसे ‘मसीह’ या किसी दूसरे समन्वित पद से नहीं बदला गया।
- source_word: የኀሪ
  choice: चुनेगा
  rationale: क्रिया का सीधा अर्थ चुनना है। कठिन संदर्भ के कारण इसे ‘न्याय करेगा’ या ‘जाँचेगा’ कहकर अर्थ को सीमित नहीं किया गया।
- source_word: ምግባሪሆሙ
  choice: उनके कामों
  rationale: यह कर्मों अथवा किए गए कार्यों का सामान्य न्याय-संबंधी पद है; ‘काम’ आधुनिक हिन्दी में सहज और पर्याप्त रूप से व्यापक है।
- source_word: ምዕራፎሙ ኍልቈ አልቦ
  choice: उनके अनगिनत विश्राम-स्थानों
  rationale: मुख्य पाठ में ‘गिनती न होना’ को निकटवर्ती संज्ञा से जोड़ा गया है, पर वाक्य-संबंध की कठिनाई पादटिप्पणी में खुली रखी गई है।
- source_word: ነፍሶሙ በማእከሎሙ ትጸንዕ
  choice: उनके प्राण उनके भीतर दृढ़ हो जाएँगे
  rationale: क्रिया दृढ़ या सबल होने का भाव देती है। हिन्दी में ‘उनके भीतर’ आंतरिक सुदृढ़ता के बिंब को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ለኅሩያነ ዚአየ
  choice: मेरे चुने हुए जनों
  rationale: स्रोत का बहुवचन और प्रथम पुरुष संबंध सुरक्षित है, ताकि पहले आए एकवचन पद से भेद मिटाया न जाए।
- source_word: እለ ሰከዩ ስምየ ስቡሐ
  choice: जिन्होंने मेरे महिमामय नाम में शरण ली है
  rationale: ሰከዩ का मूल बिंब भागकर शरण लेने का है; ‘नाम में शरण लेना’ इसे किसी सामान्य ‘पुकारने’ वाले मुहावरे में समाहित नहीं करता।
theological_decisions:
- issue: एकवचन ‘मेरा चुना हुआ जन’ की पहचान
  choice: स्थानीय पद को ज्यों का त्यों रखते हुए ‘मेरा चुना हुआ जन’
  alternative: ‘मसीह’, ‘मनुष्य का पुत्र’ या अन्य समन्वित उपाधि
  rationale: यह पद व्यापक पहचान के प्रश्न को स्वयं निर्णीत नहीं करता; इसलिए अनुवाद उस प्रश्न को चुपचाप हल नहीं करता।
- issue: एकवचन चुने हुए जन से बहुवचन चुने हुए जनों की ओर परिवर्तन
  choice: एकवचन और बहुवचन दोनों को स्पष्ट रूप से सुरक्षित रखना
  alternative: दोनों को एकवचन या दोनों को बहुवचन बनाकर समरूप करना
  rationale: गीज़ पाठ सिंहासनारूढ़ एक व्यक्ति और बाद में दिखाई देने वाले समूह के बीच व्याकरणिक भेद करता है; पाठ की कठिनाई के बावजूद इसे मिटाना उचित नहीं है।
- issue: महिमामय नाम के साथ प्रयुक्त क्रिया
  choice: नाम में शरण लेना
  alternative: नाम को पुकारना या नाम का आह्वान करना
  rationale: स्रोत क्रिया पलायन करके आश्रय लेने का बिंब देती है। यह धार्मिक अर्थ की सम्भावना बनाए रखते हुए विशिष्ट रूपक को सुरक्षित रखता है।
