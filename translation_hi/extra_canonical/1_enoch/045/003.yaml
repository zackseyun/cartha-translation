  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज रखी गई है। ‘मेरा चुना हुआ जन’ पदवी का भार बनाए रखता है, जबकि ‘काम’, ‘विश्राम-स्थान’ और ‘दृढ़ हो जाएँगे’ सामान्य पाठकों के लिए बोधगम्य हैं। स्रोत की कठिन वाक्यरचना और एकवचन-बहुवचन परिवर्तन को समतल नहीं किया गया।
