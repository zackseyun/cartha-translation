base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/004.yaml
  text: On that day I will cause my Chosen One to dwell among them[c][b][a], and I will transform heaven and make it a blessing and a light forever.
translation:
  language: hi
  text: उस दिन मैं अपने चुने हुए को उनके बीच[a][b] बसाऊँगा, और मैं स्वर्ग का रूप बदल दूँगा और उसे सदा के लिए आशीष और प्रकाश बना दूँगा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: ‘उनके मध्य’।'
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरे निर्वाचित को’।
    reason: lexical_alternative
  - marker: c
    text: 'इसे इस प्रकार भी कहा जा सकता है: ‘उसे अनन्त आशीष और प्रकाश बना दूँगा।’'
    reason: previous_rendering
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: उस दिन
  rationale: यह भविष्यसूचक और प्रलय-संबंधी काल-सूत्र का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: አነብር
  choice: बसाऊँगा
  rationale: यह सकर्मक प्रेरणार्थक अर्थ—किसी को निवास कराना या स्थापित करना—को संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ማእከሎሙ
  choice: उनके बीच
  rationale: मूल का अर्थ ‘उनके मध्य’ है; ‘उनके बीच’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: ለኅሩየ ዚአየ
  choice: अपने चुने हुए को
  rationale: यह पदवी का अनुवाद करता है और बाद की धर्मवैज्ञानिक उपाधियों को पाठ में आरोपित नहीं करता।
- source_word: ወእዌልጦ ለሰማይ
  choice: और मैं स्वर्ग का रूप बदल दूँगा
  rationale: क्रिया के परिवर्तनकारी बल और प्रलयकालीन ब्रह्मांडीय नवीनीकरण को स्पष्ट रखता है; ‘स्वर्ग’ यहाँ केवल दृश्य आकाश से अधिक उपयुक्त है।
- source_word: ወእገብራ
  choice: और उसे ... बना दूँगा
  rationale: सर्वनाम का पूर्वपद ‘स्वर्ग’ है; हिन्दी में इसे स्पष्ट करना स्वाभाविक है।
- source_word: በረከተ ወብርሃነ
  choice: आशीष और प्रकाश
  rationale: युग्मित संज्ञाओं और उनके कल्याणकारी तथा दीप्तिमय बिंब को बिना अमूर्त विस्तार के सुरक्षित रखता है।
- source_word: ለዓለም
  choice: सदा के लिए
  rationale: यह मूल के क्रियाविशेषणात्मक कालगत अर्थ ‘सदा/सर्वदा के लिए’ को विशेषण ‘अनन्त’ बनाने के बजाय ठीक रूप में व्यक्त करता है।
theological_decisions:
- issue: दृष्टान्तों में ኅሩየ ዚአየ की पहचान और पदवी
  choice: अपने चुने हुए को
  alternative: अपने निर्वाचित जन को
  rationale: ‘चुना हुआ’ स्थानीय पदवी का पारदर्शी और सामान्य हिन्दी रूप है; यह बाद की मसीही पदावली या किसी विशिष्ट साम्प्रदायिक व्याख्या को नहीं थोपता।
- issue: बदले हुए स्वर्ग में ब्रह्मांडीय नवीनीकरण का स्वरूप
  choice: स्वर्ग का रूप बदल दूँगा और उसे सदा के लिए आशीष और प्रकाश बना दूँगा
  alternative: स्वर्ग को बदलकर सदा की आशीष और प्रकाश बना दूँगा
  rationale: यह स्वर्ग के वास्तविक प्रलयकालीन रूपांतरण का बिंब बनाए रखता है और ለዓለም को मूल के अनुसार कालगत वाक्यांश मानता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। ‘बसाऊँगा’ प्रेरणार्थक अर्थ को स्वाभाविक रूप देता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं; [c] को पूरे अंतिम खंड के विकल्प पर रखा गया है।
