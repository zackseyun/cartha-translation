base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/002.yaml
  text: And they will not ascend to heaven, nor will they arrive on earth; thus it shall be the portion of the sinners who denied the name of the Lord of Spirits, who are thus kept for the day of affliction and tribulation.
translation:
  language: hi
  text: वे न तो स्वर्ग तक चढ़ेंगे, न पृथ्वी पर पहुँचेंगे।[a] ऐसा ही उन पापियों का भाग होगा जिन्होंने आत्माओं के प्रभु के नाम को नकारा है और जिन्हें क्लेश और संकट के दिन के लिए सुरक्षित रखा गया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ में आरंभिक कथन का व्याकरण यह संकेत करता है कि पापी न तो स्वर्ग तक चढ़ेंगे, न पृथ्वी पर पहुँचेंगे। फिर भी इसका सटीक आशय कठिन है; संभवतः यह बताता है कि उनके लिए सृष्टि में कोई आश्रय नहीं बचेगा।
    reason: textual_variant
  - marker: b
    text: ‘क्लेश और संकट’ का अनुवाद ‘उत्पीड़न और व्याकुलता’ भी किया जा सकता है। दोनों शब्द मिलकर आने वाले न्याय की तीव्रता बढ़ाते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: የዐርጉ
  choice: चढ़ेंगे
  rationale: यह क्रिया ऊपर जाने या चढ़ने का बोध देती है; बहुवचन कर्ता पापियों की ओर संकेत करता है।
- source_word: ሰማየ
  choice: स्वर्ग पर
  rationale: यहाँ संज्ञा दिशा सूचित करती है—‘स्वर्ग की ओर/स्वर्ग पर’—न कि वाक्य का कर्ता।
- source_word: ይበጽሑ
  choice: पहुँचेंगे
  rationale: क्रिया का सामान्य अर्थ ‘पहुँचना’ या ‘आ पहुँचना’ है; बहुवचन रूप को यथावत रखा गया है।
- source_word: ምድረ
  choice: पृथ्वी पर
  rationale: दिशा या गंतव्य का अर्थ सुरक्षित रखते हुए स्वाभाविक हिन्दी प्रयोग चुना गया है।
- source_word: ክፍለ
  choice: भाग
  rationale: न्याय के प्रसंग में किसी को मिलने वाले हिस्से या नियत परिणाम के लिए ‘भाग’ संक्षिप्त और बोधगम्य है।
- source_word: ኃጥኣን
  choice: पापियों
  rationale: न्याय के इस नैतिक वर्ग के लिए सीधा और प्रचलित हिन्दी रूप।
- source_word: ክሕዱ
  choice: इनकार किया
  rationale: यह दिव्य नाम को नकारने या अस्वीकार करने का भाव व्यक्त करता है, बिना किसी बाद की सांप्रदायिक शब्दावली को जोड़े।
- source_word: ስሞ ለእግዚአ መናፍስት
  choice: आत्माओं के प्रभु के नाम
  rationale: ग्रंथ में प्रयुक्त विशिष्ट ईश्वरीय उपाधि और ‘नाम’ के धार्मिक महत्व—दोनों को सुरक्षित रखा गया है।
- source_word: ይትዐቀቡ
  choice: सुरक्षित रखा गया है
  rationale: न्याय के दिन के लिए रोककर रखे जाने का निष्क्रिय भाव व्यक्त होता है और कर्ता स्रोत की तरह अनकहा रहता है।
- source_word: ዕለተ ስራሕ ወምንዳቤ
  choice: क्लेश और संकट के दिन
  rationale: दोनों संज्ञाओं के तीव्र न्यायात्मक भाव को अलग-अलग बनाए रखते हुए स्वाभाविक आधुनिक हिन्दी दी गई है।
theological_decisions:
- issue: स्वर्ग और पृथ्वी वाले आरंभिक उपवाक्य की व्याख्या
  choice: पापी स्वर्ग पर नहीं चढ़ेंगे और पृथ्वी पर नहीं पहुँचेंगे।
  alternative: स्वर्ग उन्हें ग्रहण नहीं करेगा और पृथ्वी उन तक नहीं पहुँचेगी।
  rationale: गीज़ में क्रियाएँ तृतीय पुरुष बहुवचन हैं और ‘स्वर्ग’ तथा ‘पृथ्वी’ दिशा सूचित करते हैं। फिर भी कथन का आशय असामान्य है, इसलिए उसे सहज धर्मवैज्ञानिक व्याख्या में बदलने के बजाय उसकी कठिनता पादटिप्पणी में स्पष्ट की गई है।
- issue: अंतिम युग्म का अर्थ
  choice: क्लेश और संकट
  alternative: उत्पीड़न और व्याकुलता
  rationale: दोहरा पद आने वाले न्याय की तीव्रता व्यक्त करता है; हिन्दी में दोनों शब्द अलग किन्तु परस्पर पूरक अर्थ रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। असामान्य ब्रह्मांडीय चित्र को समझाने के लिए मूल पाठ को समतल नहीं किया गया; उसकी वास्तविक कठिनता पादटिप्पणी में रखी गई है।
