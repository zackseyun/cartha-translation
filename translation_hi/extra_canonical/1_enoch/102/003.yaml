base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/003.yaml
  text: And all the angels will carry out their commands[a], and they will seek to hide themselves from before the Great Glory; and the children of the earth will tremble and be thrown into confusion. But you sinners are accursed forever[d][c][b], and there will be no peace for you.
translation:
  language: hi
  text: और सब स्वर्गदूत अपनी आज्ञा पूरी करेंगे[a] और महान महिमा की उपस्थिति से[b] अपने आपको छिपाना चाहेंगे। धरती की संतानें[c] काँप उठेंगी और घबरा जाएँगी। पर तुम पापी सदा के लिए शापित हो, और तुम्हारे लिए शान्ति नहीं होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में ‘उनकी/अपनी आज्ञा’ है; ‘आज्ञा’ एकवचन है, यद्यपि उसका सम्बन्ध सभी स्वर्गदूतों से है।
    reason: grammar_and_lexical_ambiguity
  - marker: b
    text: शाब्दिक रूप से ‘महान महिमा के सामने से’; इसका अर्थ उसकी उपस्थिति से दूर होना भी हो सकता है। ‘महान महिमा’ यहाँ ईश्वरीय उपस्थिति के लिए उपाधि-सदृश पद हो सकता है।
    reason: lexical_and_theological_ambiguity
  - marker: c
    text: ‘धरती की संतानें’ शाब्दिक अभिव्यक्ति है; इसका व्यापक अर्थ धरती के निवासी, विशेषकर न्याय के अधीन मनुष्य, हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: መላእክት
  choice: स्वर्गदूत
  rationale: इस प्रलयदर्शी प्रसंग में ये मानवीय संदेशवाहक नहीं, बल्कि स्वर्गीय प्राणी हैं।
- source_word: ይፌጽሙ
  choice: पूरी करेंगे
  rationale: क्रिया किसी आदेश को कार्यान्वित करने या पूर्ण करने का भाव रखती है; हिन्दी में ‘आज्ञा पूरी करना’ स्वाभाविक है।
- source_word: ትእዛዞሙ
  choice: अपनी आज्ञा
  rationale: गीज़ रूप में आज्ञा/आदेश का अधिकारपूर्ण भाव और बहुवचन स्वामित्व-सूचक प्रत्यय है; संज्ञा स्वयं एकवचन प्रतीत होती है। ‘अपनी आज्ञा’ उसके स्वर्गदूतों से सम्बन्ध को रखती है, बिना आज्ञा देने वाले को पाठ में जोड़ने के।
- source_word: ይፈቅዱ ... ይትኀብኡ
  choice: अपने आपको छिपाना चाहेंगे
  rationale: पहली क्रिया इच्छा या चाह व्यक्त करती है और अगली आत्मवाचक रूप में छिपने को; हिन्दी वाक्यांश दोनों को सहज रूप से व्यक्त करता है।
- source_word: እምቅድመ
  choice: के सामने से
  rationale: यह सामी शैली का पदबंध है जिसका शाब्दिक अर्थ ‘के सामने से’ है और जो किसी की उपस्थिति से हटने का संकेत दे सकता है।
- source_word: ዐቢይ ስብሐት
  choice: महान महिमा
  rationale: यह ईश्वरीय उपस्थिति या प्रताप के लिए आदरसूचक परोक्ष नाम की तरह काम कर सकता है; अनुवाद इसे सीधे ‘परमेश्वर’ बनाकर अर्थ को निश्चित नहीं करता।
- source_word: ይርዕዱ ... ይትሀወኩ
  choice: काँप उठेगी और घबरा जाएगी
  rationale: पहली क्रिया भय से शारीरिक कम्पन और दूसरी व्याकुलता, अशान्ति या भ्रम का भाव देती है।
- source_word: ደቂቀ ምድር
  choice: धरती की संतान
  rationale: शाब्दिक और विशिष्ट प्रलयदर्शी बिम्ब को रखा गया है; हिन्दी में एकवचन रूप सामूहिक अर्थ में प्रयुक्त है।
- source_word: ኃጥኣን
  choice: पापी
  rationale: न्याय के इस धार्मिक-नैतिक प्रसंग में यह सीधा और प्रचलित समतुल्य है।
- source_word: ርጉማን ለዓለም
  choice: सदा के लिए शापित
  rationale: यह स्थायी दण्ड की गंभीर घोषणा को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ወአልብክሙ ሰላመ
  choice: और तुम्हारे लिए शान्ति नहीं होगी
  rationale: निषेध और बहुवचन सम्बोधन को सुरक्षित रखते हुए हिन्दी में भावी न्याय की घोषणा स्वाभाविक बनाई गई है।
theological_decisions:
- issue: ‘महान महिमा’ का अभिप्राय
  choice: ईश्वरीय उपस्थिति या प्रताप का आदरसूचक परोक्ष नाम, पर अनुवाद में मूल पद ही रखा गया
  alternative: इसे सीधे ‘परमेश्वर’ या केवल अमूर्त ‘महान वैभव’ कहना
  rationale: हनोक के प्रलयदर्शी परिवेश में यह पद ईश्वर के लिए उपाधि-सदृश हो सकता है, किन्तु पंक्ति स्वयं ईश्वर का नाम नहीं लेती; इसलिए धार्मिक संकेत और पाठ की अस्पष्टता दोनों रखे गए हैं।
- issue: आज्ञा का स्वामी या दाता
  choice: ‘अपनी आज्ञा’ द्वारा स्रोत का स्वामित्व-सूचक सम्बन्ध रखा गया
  alternative: ‘उन्हें दी गई आज्ञा’ कहना
  rationale: ‘उन्हें दी गई’ आज्ञा देने वाले और आदेश सौंपे जाने की दिशा को अधिक स्पष्ट कर देता, जबकि मूल प्रत्यय केवल सम्बन्ध व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, प्रलयदर्शी लहजा रखा गया है। ‘स्वर्गदूत’, ‘आज्ञा’, ‘महिमा’, ‘शापित’ और ‘शान्ति’ सामान्य धार्मिक शब्दावली हैं। ‘धरती की संतान’ को सपाट ‘धरती के निवासी’ बनाने के बजाय मूल बिम्ब सुरक्षित रखा गया है।
