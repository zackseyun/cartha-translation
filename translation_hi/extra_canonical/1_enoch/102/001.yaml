base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/001.yaml
  text: In those days[a], if a fierce fire descends upon you, where will you flee, and where will you be delivered? And when he lifts up his voice against you[d][c][b], will you not be shaken and fear?
translation:
  language: hi
  text: उन दिनों, यदि एक प्रचण्ड आग तुम पर उतर आए, तो तुम कहाँ भागोगे और कहाँ तुम्हारा उद्धार होगा? और जब वह तुम्हारे विरुद्ध अपनी आवाज़ उठाएगा,[a] तो क्या तुम विचलित होकर डर नहीं जाओगे?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अपनी आवाज़ उठाएगा’ का अर्थ ‘अपनी आवाज़ निकालेगा’ या प्रसंगानुसार ‘तुम्हारे विरुद्ध अपना वचन सुनाएगा’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह आलंकारिक प्रश्न है; आशय है कि वे निश्चय ही विचलित होकर डर जाएँगे।
    reason: cultural_note
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: उन दिनों
  rationale: यह न्याय-संदर्भ में प्रयुक्त मानक कालसूचक और महाप्रलय-विषयक अभिव्यक्ति है; हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ዕፁብ እሳት
  choice: एक प्रचण्ड आग
  rationale: विशेषण असाधारण, विस्मयकारी अथवा भयानक होने का भाव दे सकता है। न्याय के प्रसंग में ‘प्रचण्ड’ विनाशकारी तीव्रता और भयकारी विस्मय—दोनों को व्यक्त करता है।
- source_word: ወረደ ዴቤክሙ
  choice: तुम पर उतर आए
  rationale: मूल क्रिया नीचे उतरने को और संबंधसूचक रूप बहुवचन ‘तुम पर’ को दर्शाता है। शर्तवाचक वाक्य में ‘उतर आए’ आधुनिक हिन्दी में सहज है।
- source_word: በአይቴ ትነፍፁ
  choice: तुम कहाँ भागोगे
  rationale: स्थानवाचक प्रश्न और भागने की क्रिया को सीधे रखते हुए आलंकारिक प्रश्न का बल बनाए रखता है।
- source_word: በአይቴ ትድኅኑ
  choice: कहाँ तुम्हारा उद्धार होगा
  rationale: क्रिया बचाए या छुड़ाए जाने के अर्थ-क्षेत्र में है। यह निष्क्रिय भाव सुरक्षित रखता है और यह तय नहीं करता कि उद्धार कौन करेगा।
- source_word: ይወዲ ቃሎ
  choice: वह अपनी आवाज़ उठाएगा
  rationale: यह सक्रिय मुहावरा है जिसमें तीसरे पुरुष एकवचन कर्ता और ‘उसकी आवाज़’ का भाव है। ‘अपनी आवाज़ उठाना’ हिन्दी में स्वाभाविक है और मूल की सक्रियता को सुरक्षित रखता है।
- source_word: ዴቤክሙ
  choice: तुम्हारे विरुद्ध
  rationale: आवाज़ उठाने के साथ न्यायपूर्ण प्रतिकूलता को प्रसंगानुकूल व्यक्त करता है।
- source_word: አኮ ትትመሀከዉ ወትፈርሁ
  choice: तो क्या तुम विचलित होकर डर नहीं जाओगे?
  rationale: नकारात्मक आलंकारिक प्रश्न अपेक्षित सकारात्मक उत्तर रखता है। ‘विचलित’ आंतरिक हिल जाने या घबरा उठने का भाव देता है और ‘डर’ के साथ स्वाभाविक हिन्दी बनाता है।
theological_decisions:
- issue: आवाज़ उठाने वाले की पहचान
  choice: सर्वनाम ‘वह’ को रखा गया, पर उसकी पहचान स्पष्ट करके नहीं जोड़ी गई
  alternative: ‘परमेश्वर’ अथवा ‘न्यायाधीश’ को स्पष्ट कर्ता बनाना
  rationale: मूल में तीसरे पुरुष का कर्ता व्याकरण से व्यक्त है, पर इस पद में उसका नाम नहीं दिया गया। संदर्भ दिव्य न्याय की ओर संकेत कर सकता है, फिर भी अनुवाद को उससे अधिक स्पष्ट नहीं होना चाहिए।
- issue: ‘आवाज़’ को न्यायिक ‘वचन/दण्डादेश’ के रूप में प्रस्तुत करना
  choice: मुख्य पाठ में ‘अपनी आवाज़ उठाएगा’
  alternative: ‘अपना दण्डादेश सुनाएगा’ या ‘अपना वचन तुम्हारे विरुद्ध भेजेगा’
  rationale: मूल मुहावरा आवाज़ निकालने या उठाने का सक्रिय भाव देता है। न्यायिक अर्थ प्रसंग में निहित रह सकता है, पर ‘दण्डादेश’ कहना अस्पष्टता को अनुचित रूप से समाप्त कर देगा।
- issue: उद्धार की भाषा
  choice: ‘तुम्हारा उद्धार होगा’
  alternative: ‘तुम बचाए जाओगे’ या ‘तुम्हें मुक्ति मिलेगी’
  rationale: यह न्याय से बचाए जाने का व्यापक अर्थ सुरक्षित रखता है और बाद की किसी विशिष्ट धार्मिक मुक्ति-पद्धति को पद में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष और चेतावनीपूर्ण शैली रखी गई है। बहुवचन ‘तुम’ मूल के संबोधन से मेल खाता है। ‘प्रचण्ड आग’, ‘उद्धार’ और ‘अपनी आवाज़ उठाएगा’ सामान्य पाठक के लिए बोधगम्य रहते हुए महाप्रलयात्मक न्याय की गंभीरता बनाए रखते हैं।
