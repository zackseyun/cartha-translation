  yaml_path: translation/extra_canonical/1_enoch/102/002.yaml
  text: And all the luminaries shall be shaken with great fear[b][a], and the whole earth shall be shaken and tremble and quake.
translation:
  language: hi
  text: और सभी ज्योति-पिंड[a] बड़े भय से हिल उठेंगे; और सारी पृथ्वी हिल उठेगी, थरथराएगी और काँप उठेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सभी ज्योतियाँ।” यहाँ संभवतः आकाशीय ज्योति-पिंड अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሎሙ ብርሃናት
  choice: सभी ज्योति-पिंड
  rationale: ብርሃናት का मूल अर्थ ‘ज्योतियाँ/प्रकाशमान वस्तुएँ’ है। इस विश्वव्यापी न्याय-दृश्य में ‘ज्योति-पिंड’ संभावित खगोलीय संकेत को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पाद-टिप्पणी व्यापक अर्थ सुरक्षित रखती है।
- source_word: ይትመሀከዉ / ትትመሀከው
  choice: हिल उठेंगे / हिल उठेगी
  rationale: दोनों स्थानों पर दोहराए गए क्रिया-रूप को समान हिन्दी अभिव्यक्ति देकर आकाशीय ज्योतियों और पृथ्वी के बीच समानांतरता बनाए रखी गई है। ‘हिल उठना’ तीव्र विक्षोभ और भय, दोनों के प्रसंग में स्वाभाविक है।
- source_word: በፍርሀት ዐቢይ
  choice: बड़े भय से
  rationale: यह कारण अथवा साथ रहने वाली दशा—दोनों का संकेत दे सकता है। ‘बड़े भय से’ संक्षिप्त, स्वाभाविक और मूल की भावात्मक तीव्रता के अनुरूप है।
- source_word: ኵላ ምድር
  choice: सारी पृथ्वी
  rationale: विश्वव्यापी प्रलयकारी प्रसंग में ምድር को स्थानीय ‘देश/भूमि’ के बजाय ‘पृथ्वी’ समझना अधिक उपयुक्त है।
- source_word: ትርዕድ
  choice: थरथराएगी
  rationale: पहले प्रयुक्त ‘हिल उठेगी’ से अलग क्रिया रखकर मूल की क्रमिक तीव्रता और कंपन का चित्र सुरक्षित रखा गया है।
- source_word: ወትኜጕድ (संभवतः दूषित प्रतिलेखन; पाठ ወትደነግፅ अपेक्षित)
  choice: और आतंकित हो जाएगी
  rationale: दिया गया रूप अर्थ की दृष्टि से संदिग्ध और संभवतः OCR-जनित विकृति है। संस्करण के संभावित वास्तविक पाठ ወትደነግፅ का अर्थ ‘भयभीत/आतंकित होना’ है; यह ज्योति-पिंडों के ‘बड़े भय’ के साथ पृथ्वी का मानवीकरण भी बनाए रखता है।
theological_decisions:
- issue: क्या ብርሃናት स्वर्गदूतों, सामान्य ज्योतियों या खगोलीय ज्योति-पिंडों को दर्शाता है
  choice: खगोलीय ज्योति-पिंड
  alternative: सभी ज्योतियाँ; प्रकाशमान प्राणी
  rationale: ‘सारी पृथ्वी’ के साथ इसकी समानांतरता और विश्वव्यापी उथल-पुथल का प्रसंग खगोलीय पिंडों की ओर संकेत करता है। फिर भी पाद-टिप्पणी मूल शब्द की व्यापकता को सुरक्षित रखती है।
- issue: अंतिम क्रिया भौतिक कंपन बताती है या आतंक
  choice: आतंकित हो जाएगी
  alternative: काँप उठेगी / डगमगा जाएगी
  rationale: उपलब्ध प्रतिलेखन में गंभीर OCR-विकृति की संभावना है; संभावित वास्तविक गीइज़ क्रिया भयभीत होने का अर्थ देती है। यह अनुवाद पृथ्वी के प्रलयकारी मानवीकरण को भौतिक कंपन में विलीन नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज प्रलय-वर्णन। दोहराव और क्रमिक तीव्रता को बनाए रखा गया है। ‘ज्योति-पिंड’ सामान्य पाठक के लिए स्पष्ट है, जबकि पाद-टिप्पणी मूल की अर्थगत व्यापकता बताती है।
