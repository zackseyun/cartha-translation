lexical_decisions:
- source_word: ወሶበ
  choice: और जब
  rationale: उपसर्गयुक्त कालवाचक संयोजक है; यह अगले प्रसंग की परिस्थिति बताता है, प्रबल विरोध नहीं।
- source_word: ትመውቱ
  choice: तुम मरोगे
  rationale: ‘मरना’ धातु का द्वितीय पुरुष बहुवचन रूप है। हिंदी में ‘जब’ के साथ भविष्यकाल स्वाभाविक है और बहुवचन संबोधन सुरक्षित रहता है।
- source_word: ይብሉ
  choice: कहेंगे
  rationale: मूल क्रिया का सामान्य अर्थ ‘कहना’ है और यहाँ यह आगे आने वाले कथन की भूमिका बनाती है।
- source_word: ላዕሌክሙ
  choice: तुम्हारे विषय में
  rationale: पूर्वसर्ग का मूल दायरा ‘ऊपर/के विषय में’ है; यहाँ कथन के विषय को व्यक्त करना शत्रुतापूर्ण अर्थ को अनावश्यक रूप से निश्चित करने से बेहतर है।
- source_word: ኃጥኣን
  choice: पापी
  rationale: यह सर्वनामिक/वर्गवाचक बहुवचन नैतिक श्रेणी को व्यक्त करता है; हिंदी में ‘पापी’ स्वाभाविक रूप से बहुवचन अर्थ दे सकता है।
theological_decisions:
- issue: पापियों के कथन का स्वरूप
  choice: पापी तुम्हारे विषय में कहेंगे
  alternative: पापी तुम्हारे विरुद्ध बोलेंगे
  rationale: गीज़ पूर्वसर्ग व्यापक है और प्रसंग वैरपूर्ण हो सकता है, पर क्रिया यहाँ आगे के प्रत्यक्ष कथन की भूमिका प्रतीत होती है। इसलिए विषयसूचक अनुवाद मूल की अस्पष्टता और वाक्य की निरंतरता को बेहतर सुरक्षित रखता है।
