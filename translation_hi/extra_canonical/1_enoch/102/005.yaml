base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/005.yaml
  text: And do not grieve if your soul has gone down into Sheol in sorrow[a], and your flesh did not fare according to your goodness during your life; but wait for the day of the judgment of sinners[c][b], and for the day of curse and punishment.
translation:
  language: hi
  text: और यदि तुम्हारी आत्मा शोक के साथ शिओल[a] में उतर गई हो, और तुम्हारे जीवनकाल में तुम्हारी देह को तुम्हारी भलाई के अनुरूप कुछ न मिला हो[b], तो शोक मत करो; बल्कि पापियों के न्याय के दिन और शाप तथा दंड के दिन की प्रतीक्षा करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘शिओल’ यहूदी अपोकैलिप्टिक विचार में मृतकों का लोक है; इसका अर्थ आवश्यक रूप से बाद की ईसाई धारणा वाला ‘नरक’ नहीं है।
    reason: cultural_note
  - marker: b
    text: मूल भाषा में ‘मिला’ या ‘प्राप्त किया’ का कर्म बताया नहीं गया है। आशय संभवतः यह है कि उन्हें अपने सांसारिक जीवन में अपनी भलाई के अनुरूप फल नहीं मिला।
    reason: lexical_alternative
lexical_decisions:
- source_word: አት ኅዘኑ
  choice: शोक मत करो
  rationale: यह श्रोताओं को संबोधित निषेधात्मक आज्ञा है। ‘शोक मत करो’ भावात्मक बल को स्वाभाविक और गरिमापूर्ण हिन्दी में रखता है।
- source_word: ወረደት ነፍስክሙ ውስተ ሲኦል
  choice: तुम्हारी आत्मा ... शिओल में उतर गई हो
  rationale: क्रिया नीचे उतरने का स्पष्ट बोध देती है। ‘शिओल’ को लिप्यंतरित रखने से यहूदी अपोकैलिप्टिक मृतलोक की छवि बनी रहती है और इसे ‘नरक’ कहकर बाद की धारणा आरोपित नहीं होती।
- source_word: በሐዘን
  choice: शोक में
  rationale: यह आत्मा के उतरने से जुड़ी दुःख की अवस्था को व्यक्त करता और आरंभिक ‘शोक मत करो’ से अर्थगत प्रतिध्वनि बनाता है।
- source_word: ኢረከበ ሥጋክሙ በሕይወትክሙ
  choice: तुम्हारे जीवनकाल में तुम्हारी देह को ... कुछ न मिला हो
  rationale: मूल क्रिया पाने या प्राप्त करने का अर्थ देती है, पर उसका कर्म व्यक्त नहीं है। हिन्दी में ‘कुछ’ अनिश्चित रखकर वाक्य स्वाभाविक बनाया गया है, बिना किसी निश्चित प्रतिफल को मूल में जोड़ने के।
- source_word: በከመ ኂሩትክሙ
  choice: तुम्हारी भलाई के अनुरूप
  rationale: यह पाठकों की भलाई और इस जीवन में उन्हें मिले परिणाम के बीच अनुरूपता का भाव रखता है, पर इसे संकीर्ण रूप से ‘पुण्य’ या ‘योग्यता’ नहीं बनाता।
- source_word: አላ ጽንሑ
  choice: बल्कि ... प्रतीक्षा करो
  rationale: विरोधसूचक मोड़ वर्तमान दुःख से भावी न्याय की ओर ले जाता है। आगामी ‘दिन’ के साथ ‘प्रतीक्षा करो’ स्वाभाविक है और धीरज बनाए रखने का आशय भी समेटता है।
- source_word: ለዕለተ እንተ ኵነኔ ኃጥኣን
  choice: पापियों के न्याय के दिन
  rationale: औपचारिक अपोकैलिप्टिक न्याय-वाक्यांश और ‘पापियों’ का स्पष्ट उल्लेख दोनों सुरक्षित रहते हैं।
- source_word: መርገም ወመቅሠፍት
  choice: शाप तथा दंड
  rationale: यह संक्षिप्त युग्म दुष्टों की भावी दशा को न्यायिक भाषा में व्यक्त करता है, किसी खास प्रकार की पीड़ा निर्धारित किए बिना।
theological_decisions:
- issue: ሲኦል का अनुवाद
  choice: शिओल
  alternative: कब्र, मृतलोक, नरक
  rationale: लिप्यंतरण दूसरे मंदिर काल की मृतलोक-संबंधी कल्पना को सुरक्षित रखता है और ‘नरक’ से जुड़ी बाद की ईसाई अवधारणाओं को मूल पाठ पर आरोपित नहीं करता।
- issue: देह को न मिलने वाले विषय का अर्थ
  choice: तुम्हारी देह को तुम्हारी भलाई के अनुरूप कुछ न मिला
  alternative: देह को जीवन वापस न मिला; इस जीवन में भलाई का प्रतिफल न मिला
  rationale: संदर्भ वर्तमान वंचना और पापियों के भावी न्याय में विरोध दिखाता है। फिर भी मूल में ‘पाने’ की क्रिया का कर्म अनकहा है, इसलिए मुख्य पाठ किसी निश्चित ‘प्रतिफल’ को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामूहिक संबोधन रखा गया है। ‘आत्मा’, ‘देह’, ‘न्याय’, ‘शाप’ और ‘दंड’ मूल की गंभीर अपोकैलिप्टिक शैली को बनाए रखते हैं। ‘शिओल’ को अनूदित करने के बजाय लिप्यंतरित कर पाद-टिप्पणी में समझाया गया है।
