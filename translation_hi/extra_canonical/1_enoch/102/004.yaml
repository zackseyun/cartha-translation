translation:
  language: hi
  text: हे धर्मियों की आत्माओं, मत डरो; और तुम जो धार्मिकता में मरे हो, आशा रखो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አትፍርሁ
  choice: मत डरो
  rationale: बहुवचन निषेधात्मक आज्ञा का सीधा और स्वाभाविक हिन्दी रूप; उपदेशात्मक बल बनाए रखता है।
- source_word: አንትሙ
  choice: तुम
  rationale: स्पष्ट द्वितीय पुरुष बहुवचन को सम्बोधन और क्रियाओं के बहुवचन रूप में सुरक्षित रखा गया है।
- source_word: ነፍሰ ጻድቃን
  choice: धर्मियों के प्राणो
  rationale: ነፍስ के प्राण/जीवन/स्व/आत्मा जैसे अर्थों में से यहाँ मृत्यु के बाद सम्बोधित धर्मियों के लिए ‘प्राण’ चुना गया है; सम्बोधन के कारण ‘प्राणो’ रूप स्वाभाविक है और ‘आत्मा’ की अपेक्षा तकनीकी भेद को कम आरोपित करता है।
- source_word: ወተስፈዉ
  choice: और ... आशा रखो
  rationale: आज्ञार्थक प्रोत्साहन को वर्तमान, सहज हिन्दी में व्यक्त करता है और पहले निषेधात्मक आदेश के साथ समानांतरता रखता है।
- source_word: እለ ሞትክሙ
  choice: तुम, जो ... मरे हो
  rationale: सम्बोधित समूह के साथ सम्बन्धवाचक रचना और द्वितीय पुरुष बहुवचन दोनों सुरक्षित हैं।
- source_word: በጽድቅ
  choice: धार्मिकता में
  rationale: संज्ञात्मक रूप को बनाए रखता है और इसे केवल ‘धर्मी होकर’ जैसे क्रियाविशेषण में नहीं बदलता।
theological_decisions:
- issue: मृत धर्मियों के लिए मानव-संबंधी पद
  choice: धर्मियों के प्राण
  alternative: धर्मियों की आत्माएँ
  rationale: गीज़ ነፍስ आत्मा, प्राण, जीवन या स्व को सूचित कर सकता है। ‘प्राण’ मृत्यु के बाद बनी पहचान को व्यक्त करता है, पर आत्मा और रूह के बीच कोई ऐसा तकनीकी धर्मवैज्ञानिक भेद निश्चित नहीं करता जो मूल में स्पष्ट नहीं है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा सम्बोधन। ‘हे’ से सम्बोधन स्पष्ट किया गया है; विरामचिह्न दोनों जुड़े हुए आदेशों और सम्बन्धवाचक पदबंध को पठनीय बनाते हैं।
