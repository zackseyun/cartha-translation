base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/005.yaml
  text: And in those days those who are pregnant will go out and cast away their children[a], and they will abandon them; and their offspring will slip from them. And while nursing, they will cast away their children and will not return to them[e][d][c][b], and they will have no mercy on their beloved ones.
translation:
  language: hi
  text: और उन दिनों गर्भवती स्त्रियाँ प्रसव करके अपने बच्चों को फेंक देंगी[a] और उन्हें त्याग देंगी; उनकी संतान उनसे छूट जाएगी[b]। दूध पिलाते समय भी वे अपने बच्चों को फेंक देंगी और उनके पास फिर नहीं लौटेंगी; वे अपने प्रियजनों पर दया नहीं करेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरम्भिक क्रियाक्रम का इथियोपिक पाठ कठिन है। ‘प्रसव करके’ के बाद की क्रिया का अर्थ ‘बाहर जाना,’ ‘बाहर निकालना,’ या बच्चों को बलपूर्वक ले जाना भी समझा गया है; यहाँ प्रसंग के परित्याग-वर्णन के अनुसार अर्थ दिया गया है।
    reason: textual_variant
  - marker: b
    text: यह पंक्ति पाठगत और अर्थगत रूप से कठिन है। ‘उनकी संतान उनसे छूट जाएगी’ के स्थान पर ‘वे अपने शिशुओं को कुचल डालेंगी’ जैसा अधिक हिंसक अर्थ भी सम्भव माना गया है।
    reason: textual_variant
lexical_decisions:
- source_word: በአማንቱ መዋዕል
  choice: उन दिनों
  rationale: यह सर्वनाश-साहित्य में प्रयुक्त मानक कालसूचक वाक्यांश है और भविष्यद्वाणी की गरिमा बनाए रखता है।
- source_word: ይጼንሱ ይወፅኡ
  choice: जन्म देकर बाहर निकालेंगी
  rationale: पहला क्रियापद गर्भधारण अथवा जन्म देने से और दूसरा बाहर आने/निकालने से जुड़ा है। प्रसंग में प्रसव अभिप्रेत है, पर कठिन पाठ के कारण क्रिया को अनावश्यक रूप से हिंसक अर्थ नहीं दिया गया।
- source_word: ይመሥጡ ደቂቆሙ
  choice: अपने बच्चों को ... फेंक देंगी
  rationale: वाक्यक्रम बच्चों के साथ कठोर व्यवहार का संकेत देता है; ‘फेंक देंगी’ परित्याग की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ይገድፍዎሙ
  choice: उन्हें त्याग देंगी / अपने बच्चों को फेंक देंगी
  rationale: दोहराई गई क्रिया परित्याग और दूर कर देने का अर्थ देती है। प्रसंगानुसार हिन्दी में दोनों निकटार्थी अभिव्यक्तियाँ प्रयोग की गई हैं।
- source_word: ይደህፁ ውሉዶሙ
  choice: उनकी संतान उनके हाथ से जाती रहेगी
  rationale: यह पंक्ति पाठगत और अर्थगत रूप से कठिन है। प्रस्तुत अनुवाद संतान के उनसे छूट जाने का भाव रखता है, जबकि हिंसक अर्थ की सम्भावना टिप्पणी में सुरक्षित है।
- source_word: እንዘ ይጠብዉ
  choice: दूध पिलाते समय
  rationale: ጠበወ का अर्थ चूसना, दूध पीना या दूध पिलाना है; इसलिए ‘देखते समय’ नहीं, स्तनपान का प्रसंग उचित है।
- source_word: ኢይገብኡ ኀቤሆሙ
  choice: उनके पास फिर नहीं लौटेंगी
  rationale: स्थानिक वापसी और टूटे पारिवारिक सम्बन्ध—दोनों भावों को सरल, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ኢይምሕርዎሙ ለፍቁራኒሆሙ
  choice: अपने प्रिय बच्चों पर दया नहीं करेंगी
  rationale: यह प्रियजनों के प्रति स्वाभाविक करुणा के लोप को व्यक्त करता है; प्रसंग में प्रियजन बच्चे हैं, इसलिए हिन्दी में संबंध स्पष्ट किया गया है।
theological_decisions:
- issue: क्या पद सामान्य सामाजिक हिंसा बताता है या न्याय के समय पारिवारिक ममता के विघटन को?
  choice: न्याय-संबंधी सर्वनाशकारी दृश्य में मातृ-ममता और पारिवारिक करुणा का विघटन प्रमुख रखा गया है।
  alternative: इसे केवल सामान्य अराजक हिंसा अथवा अकाल में शिशु-परित्याग का चित्र माना जा सकता है।
  rationale: बच्चों, संतान, दूध पिलाने, लौटने और प्रियजनों पर दया करने के बार-बार आए उल्लेख पारिवारिक बंधनों के टूटने पर बल देते हैं; फिर भी कारण को पाठ से आगे बढ़कर निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और गंभीर सर्वनाश-साहित्यिक शैली अपनाई गई है। कठिन इथियोपिक वाक्यांशों को मुख्य पाठ में अत्यधिक निश्चित नहीं बनाया गया; वास्तविक विकल्प टिप्पणियों में दिए गए हैं। सभी टिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
