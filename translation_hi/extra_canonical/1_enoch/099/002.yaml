base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/002.yaml
  text: Woe to those who pervert the word of righteousness and the eternal ordinance[a], and reckon themselves not to be sinners[c][b]; they shall be trampled upon the earth.
translation:
  language: hi
  text: धिक्कार है उन लोगों पर जो धार्मिकता के वचन और सदा बने रहने वाले विधान को विकृत करते हैं, और अपने को पापी नहीं मानते[a]; वे पृथ्वी पर रौंदे जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पापी’ शब्द उपलब्ध गीइज़ पाठ में कोष्ठकित और पाठगत रूप से अनिश्चित है। पुराने ढंग से इस अंश को ‘यद्यपि वे पृथ्वी पर पापी न थे’ भी समझा गया है; यहाँ आत्मवाचक मुहावरे के अनुसार अर्थ है कि वे अपने को पापी नहीं मानते।
    reason: textual_variant
lexical_decisions:
- source_word: አሌ
  choice: धिक्कार है
  rationale: यह भविष्यद्वाणी-सदृश न्याय-घोषणा का सूत्र है; ‘धिक्कार’ केवल दुःख नहीं, बल्कि आसन्न दण्ड का भाव भी रखता है।
- source_word: ይዌልጥዎሙ
  choice: विकृत करते हैं
  rationale: क्रिया किसी बात को उसके उचित रूप से मोड़ने या बदलने का भाव देती है; नैतिक संदर्भ में ‘विकृत’ स्वाभाविक और सटीक है।
- source_word: ለነገረ ርትዕ
  choice: धार्मिकता के वचन
  rationale: ነገር का अर्थ वचन, विषय या संदेश हो सकता है। यह चयन वाणी और उसकी विषयवस्तु—दोनों की गुंजाइश बनाए रखता है।
- source_word: ሥርዐተ እንተ ለዓለም የኃልዉ
  choice: सदा बने रहने वाले विधान
  rationale: ሥርዐት व्यवस्था, नियम या विधान को सूचित करता है; संबंधवाचक पद उसके निरंतर स्थायित्व को स्पष्ट करता है।
- source_word: ወይሬስዩ ርእሶሙ ዘአኮኑ [ኃጥኣነ]
  choice: और अपने को पापी नहीं मानते
  rationale: ረስየ ርእሶ का आत्मवाचक प्रयोग यहाँ ‘अपने को समझना/मानना’ है, न कि सिर घुमाने की शारीरिक क्रिया। यह अनुवाद दोषरहित होने के उनके आत्म-मूल्यांकन को व्यक्त करता है।
- source_word: ይትከየዱ
  choice: रौंदे जाएँगे
  rationale: निष्क्रिय रूप न्याय के रूप में पैरों तले रौंदे जाने की ठोस छवि देता है।
theological_decisions:
- issue: धार्मिकता के वचन और स्थायी विधान को बिगाड़ने वालों की निन्दा
  choice: इसे न्यायसूचक भविष्यद्वाणी के रूप में प्रस्तुत किया गया है
  alternative: इसे केवल दुःख-प्रकाश या सामान्य नैतिक चेतावनी मानना
  rationale: ‘धिक्कार’ और अन्तिम दण्ड की भाषा न्यायपरक, प्रलय-साहित्यिक प्रसंग को पुष्ट करती है।
- issue: अपने को पापी न मानने वाले वाक्यांश का अर्थ
  choice: यह उनके आत्म-मूल्यांकन या दावे को बताता है
  alternative: ‘यद्यपि वे पृथ्वी पर पापी न थे’ अथवा ‘वे अपने सिर फेरते हैं’
  rationale: आत्मवाचक गीइज़ मुहावरा ‘अपने को मानना’ अर्थ देता है। फिर भी कोष्ठक में प्राप्त ‘पापी’ शब्द की पाठगत अनिश्चितता पाठक को बताई गई है।
- issue: ‘पृथ्वी पर’ का संबंध
  choice: इसे रौंदे जाने के स्थान से जोड़ा गया है
  alternative: इसे ‘पापी नहीं’ पदबंध से जोड़ना
  rationale: शब्दक्रम और नवीन स्रोत-समीक्षा के आधार पर यह विभाजन अधिक सुसंगत है, यद्यपि प्राचीन पाठ का विराम-विन्यास स्वयं निर्णायक नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और न्यायसूचक शैली रखी गई है। ‘धार्मिकता’, ‘विधान’ और ‘धिक्कार’ जैसे शब्द धार्मिक-प्रलयात्मक स्वर बनाए रखते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए सहज है।
