base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/011.yaml
  text: Woe to you who spread evil to your neighbors[c][b][a], for by your neighbors you will be slain.
translation:
  language: hi
  text: हाय तुम पर, जो अपने पड़ोसियों में बुराई फैलाते हो[a]; क्योंकि अपने पड़ोसियों के ही हाथों तुम मारे जाओगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो अपने पड़ोसियों के विरुद्ध बुराई फैलाते हो”; अथवा, “जो अपने साथियों के साथ बुराई फैलाते हो।” गीइज़ पदबंध संबंध, क्षेत्र या साधन का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: दिए गए गीइज़ पाठ में यहाँ पड़ोसी/साथी-संबंधी शब्द प्रतीत होता है। किन्तु एक प्रस्तावित पाठ-सुधार इसे “अधोलोक में” पढ़ता है; तब वाक्य होगा, “क्योंकि अधोलोक में तुम मारे जाओगे।”
    reason: textual_variant
lexical_decisions:
- source_word: እሌ፡ ለክሙ
  choice: हाय तुम पर
  rationale: यह न्याय की घोषणा आरम्भ करने वाला धिक्कार-सूचक सूत्र है। ‘हाय तुम पर’ उसका भविष्यद्वक्तापूर्ण बल बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: እለ፡ ትሰፍሕዋ፡ ለእኩይ
  choice: जो ... बुराई फैलाते हो
  rationale: क्रिया में फैलाने, विस्तृत करने या बढ़ाने का भाव है। ‘बुराई फैलाते हो’ अर्थ और ठोस बिंब दोनों को सहज हिन्दी में रखता है।
- source_word: በቢጽክሙ
  choice: अपने पड़ोसियों में
  rationale: संज्ञा का अर्थ पड़ोसी, साथी या सहचर हो सकता है और उपसर्ग संबंध, क्षेत्र या साधन व्यक्त कर सकता है। प्रसंग में ‘पड़ोसियों में’ बुराई के फैलाव का लक्ष्य/क्षेत्र बताता है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: እስመ
  choice: क्योंकि
  rationale: यह धिक्कार का कारण बताने वाला स्पष्ट कारणवाचक संयोजक है।
- source_word: በቢጸል
  choice: अपने पड़ोसियों के ही हाथों
  rationale: दिए गए गीइज़ पाठ के अनुसार इसे पहले आए पड़ोसी/साथी-संबंधी शब्द की पुनरावृत्ति माना गया है। ‘के ही हाथों’ साधनवाचक अर्थ और प्रतिफलात्मक उलटाव को स्पष्ट करता है; सर्वनाम और ‘ही’ हिन्दी में निहित संबंध को स्वाभाविक बनाते हैं।
- source_word: ትትቀተሉ
  choice: तुम मारे जाओगे
  rationale: न्याय-संदर्भ में कर्मवाच्य भावी अर्थ है। यह गरिमापूर्ण, स्पष्ट और आधुनिक हिन्दी है।
theological_decisions:
- issue: प्रतिफल के अनुरूप न्याय
  choice: जो अपने पड़ोसियों के बीच बुराई फैलाते हैं, वे पड़ोसियों के ही हाथों मारे जाएँगे।
  alternative: यह केवल इतना कह सकता है कि कुकर्मी अपने साथियों के कारण मरेंगे; अथवा दोनों पदबंध साधनवाचक हो सकते हैं।
  rationale: दिए गए पाठ में निकट-संबंधी संज्ञा की पुनरावृत्ति प्रतिफलात्मक न्याय का संकेत देती है। अनुवाद इस संकेत को बनाए रखता है, पर वैकल्पिक व्याकरणिक अर्थ पादटिप्पणी में देता है।
- issue: दूसरे पदबंध का पाठ
  choice: प्रस्तुत गीइज़ पाठ በቢጸል के अनुसार ‘पड़ोसियों के ही हाथों’।
  alternative: कुछ संपादकीय पुनर्निर्माण इसे በሲኦል, ‘अधोलोक में’, पढ़ते हैं।
  rationale: मुख्य पाठ उपयोगकर्ता द्वारा दिए गए मूल-पाठ साक्ष्य का अनुसरण करता है। संभावित अक्षर-पठन/OCR समस्या वास्तविक पाठालोचनात्मक तनाव है, इसलिए उसे चुपचाप निर्णीत करने के बजाय पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण न्याय-वाणी। ‘हाय तुम पर’ अपोकैलिप्टिक धिक्कार का बल रखता है; ‘मारे जाओगे’ अनावश्यक पुरातनता के बिना कर्मवाच्य न्याय-घोषणा व्यक्त करता है।
