translation:
  language: hi
  text: उन दिनों राष्ट्रों में उथल-पुथल मच जाएगी, और राष्ट्रों के कुल-समूह[a] विनाश के दिन[b] उठ खड़े होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राष्ट्रों के वंश-समूह” अथवा “गोत्र।” गीइज़ शब्द नातेदारी पर आधारित समूहों या संबंधित लोगों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “संहार के दिन” अथवा “बरबादी के दिन।” अंतिम गीइज़ संज्ञा की तीव्रता के अनुसार ये अर्थ संभव हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: በአማንቱ መዋዕል
  choice: उन दिनों
  rationale: यह प्रलय-साहित्य का प्रचलित कालसूचक वाक्यांश है और መዋዕል के बहुवचन भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ይትሀወኩ
  choice: खलबली मच जाएगी
  rationale: क्रिया अव्यवस्था, व्याकुलता और उथल-पुथल का भाव देती है। यह हिन्दी प्रयोग उस निष्क्रिय/अकर्मक परिणाम को स्वाभाविक रूप से व्यक्त करता है, बिना केवल मानसिक भ्रम तक अर्थ सीमित किए।
- source_word: አሕዛብ
  choice: राष्ट्रों
  rationale: यहाँ सामूहिक राजनीतिक-जातीय इकाइयाँ अभिप्रेत हैं। ‘गैर-यहूदी’ कहना ऐसा धार्मिक विरोध आयात करेगा जो पद में स्पष्ट नहीं है।
- source_word: ወይትነሥኡ
  choice: उठ खड़े होंगे
  rationale: मूल क्रिया उठने या खड़े होने को व्यक्त करती है। यह अनुवाद विद्रोह, युद्ध या एकत्रीकरण में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: አዝማደ አሕዛብ
  choice: राष्ट्रों के कुल
  rationale: አዝማድ संबंधियों, वंश-समूहों या कुलों को सूचित कर सकता है। ‘कुल’ आधुनिक हिन्दी में संक्षिप्त और गरिमापूर्ण है तथा राष्ट्रों के भीतर के नातेदारी-आधारित समूहों का भाव रखता है।
- source_word: በዕለት እንተ ሐጕል
  choice: विनाश के दिन
  rationale: यह व्यापक विपत्ति और न्याय के चरम दिन का संकेत देता है। ‘विनाश’ अर्थ को केवल हत्या तक सीमित नहीं करता, जबकि ‘संहार’ भी संभव है।
theological_decisions:
- issue: प्रलयकारी न्याय में አሕዛብ का दायरा
  choice: ‘राष्ट्रों’ के रूप में सामूहिक राजनीतिक-जातीय अर्थ
  alternative: ‘जातियों’, ‘लोगों’ या ‘गैर-यहूदियों’
  rationale: संदर्भ अंतरराष्ट्रीय उथल-पुथल का है, न कि स्पष्ट यहूदी/गैर-यहूदी धार्मिक विभाजन का।
- issue: राष्ट्रों के कुलों के उठने का आशय
  choice: ‘उठ खड़े होंगे’ कहकर आशय खुला रखा गया
  alternative: ‘विद्रोह करेंगे’, ‘युद्ध के लिए उठेंगे’ या ‘इकट्ठे होंगे’
  rationale: मूल पाठ उठने की अशुभ गतिविधि बताता है, पर उसका ठीक सैन्य या राजनीतिक स्वरूप निर्धारित नहीं करता।
- issue: ሐጕል की विपत्ति की तीव्रता
  choice: मुख्य पाठ में ‘विनाश’
  alternative: ‘संहार’ या ‘बरबादी’
  rationale: ‘विनाश’ व्यापक आपदा को सुरक्षित रखता है; पादटिप्पणी अधिक तीव्र ‘संहार’ की संभावना दर्ज करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रलयकारी शैली रखी गई है। ‘खलबली मच जाएगी’ सामान्य पाठक के लिए सहज है और सामाजिक उथल-पुथल का भाव देता है; ‘उठ खड़े होंगे’ मूल की अस्पष्टता बनाए रखता है।
