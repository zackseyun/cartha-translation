base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/008.yaml
  text: And they will become senseless because of the madness of their heart[c][b][a], and their eyes will grow dark through the fear of their heart and through the visions of their dreams.
translation:
  language: hi
  text: और वे अपने हृदय के पागलपन के कारण सुध-बुध खो बैठेंगे[a], और उनके हृदय के भय तथा उनके स्वप्नों के दृश्यों[c] के कारण उनकी आँखें धुँधली पड़ जाएँगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विवेकहीन हो जाएँगे’ अथवा ‘अपना होश खो देंगे।’ यहाँ प्रयुक्त क्रिया भूलने से विकसित होकर मन या समझ खोने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उनकी आँखों पर अँधेरा छा जाएगा।’ यह बिंब धुँधली दृष्टि, भय से जड़ हुई निगाह या समझ की आलंकारिक अस्पष्टता का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘स्वप्नों के दृश्य’ में मूल पाठ की देखने और स्वप्न—दोनों की भाषा सुरक्षित रखी गई है; इसे केवल ‘स्वप्न’ भी कहा जा सकता है, पर उससे यह दोहरा बिंब खो जाएगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትረሰዑ
  choice: सुध-बुध खो बैठेंगे
  rationale: यह क्रिया ረሰዐ (‘भूलना’) के आत्मवाचक/कर्मवाच्य रूप से मन या विवेक खोने, चेतन-बोध से च्युत होने का भाव देती है। ‘सुध-बुध खो बैठेंगे’ आधुनिक हिन्दी में स्वाभाविक है और अगले पदबंध ‘हृदय के पागलपन’ के साथ अर्थगत समानांतरता रखता है; इसे ‘भयभीत होंगे’ कहना स्रोतार्थ से मेल नहीं खाता।
- source_word: እበደ
  choice: पागलपन
  rationale: यह शब्द गंभीर मानसिक अथवा नैतिक अव्यवस्था और विवेकहीनता का संकेत देता है। ‘मूर्खता’ इसकी तीव्रता घटाती, जबकि ‘पागलपन’ प्रसंग की कठोरता बनाए रखता है।
- source_word: ልቦሙ
  choice: उनके हृदय
  rationale: सामी प्रयोग में ‘हृदय’ विचार, इच्छा और भावना—सभी का केंद्र हो सकता है। स्रोत की मानवशास्त्रीय भाषा बनाए रखने के लिए इसे ‘मन’ में सीमित नहीं किया गया।
- source_word: ይጼለሉ
  choice: अँधेरी हो जाएँगी
  rationale: क्रिया अँधेरा पड़ने या धुँधला होने का चित्र प्रस्तुत करती है। यह अनिष्टसूचक बिंब को बनाए रखती है, पर पूर्ण शारीरिक अंधेपन का अनावश्यक दावा नहीं करती।
- source_word: አዕይንቲሆሙ
  choice: उनकी आँखें
  rationale: स्रोत के ठोस शारीरिक बिंब को ‘दृष्टि’ जैसे अमूर्त शब्द से नहीं बदला गया।
- source_word: በፍርሃተ ልቦሙ
  choice: उनके हृदय के भय के कारण
  rationale: पूर्वसर्ग कारण अथवा माध्यम व्यक्त कर सकता है। हिन्दी वाक्य में ‘के कारण’ सहज है और दोहराए गए ‘हृदय’ को सुरक्षित रखता है।
- source_word: በርእየ ሕልሞሙ
  choice: उनके स्वप्नों के दृश्यों के कारण
  rationale: यह पदबंध देखने/दृश्य और स्वप्न—दोनों की भाषा जोड़ता है। ‘स्वप्नों के दृश्य’ दोनों तत्वों को बनाए रखता है और केवल ‘स्वप्नों’ कहकर अर्थ को सपाट नहीं करता।
theological_decisions:
- issue: वर्णित विपत्ति का स्वरूप
  choice: पद आंतरिक विवेकहीनता, भय और अँधेरी होती आँखों को स्वप्न-दृश्यों से जुड़ी विपत्ति के रूप में प्रस्तुत करता है, पर उन स्वप्नों की उत्पत्ति निश्चित नहीं करता।
  alternative: स्वप्न सीधे परमेश्वर द्वारा भेजे गए दंड-दर्शन हैं; अथवा यह केवल दोषी अंतःकरण से उपजा मानसिक भय है।
  rationale: गीज़ पाठ प्रभावों का वर्णन करता है, पर यह स्पष्ट नहीं करता कि स्वप्न ईश्वरीय रूप से भेजे गए हैं, मनोवैज्ञानिक रूप से उत्पन्न हैं, या दोनों। इसलिए इस अस्पष्टता को अनसुलझा रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘सुध-बुध खो बैठेंगे’ सामान्य पाठक के लिए बोधगम्य है, जबकि ‘हृदय’, ‘पागलपन’, ‘आँखें’ और ‘स्वप्नों के दृश्य’ स्रोत की ठोस तथा सामी-अंतःकरण संबंधी भाषा को बनाए रखते हैं।
