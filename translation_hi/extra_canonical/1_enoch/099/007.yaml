base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/007.yaml
  text: And those who bow down to stone[a], and those who make images of gold and silver and wood and clay[d][c][b], and those who bow down to evil spirits and demons and to every idol without understanding—they will find no help at all from them.
translation:
  language: hi
  text: और जो पत्थर के आगे झुकते हैं,[a] और जो सोने, चाँदी, लकड़ी और मिट्टी की प्रतिमा बनाते हैं, और जो दुष्ट आत्माओं[b], दुष्टात्माओं और हर मूर्ति के आगे बिना समझे झुकते हैं—वे उनसे किसी भी प्रकार की सहायता नहीं पाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल पाठ का शाब्दिक अर्थ है “पत्थर के आगे झुकते हैं”; एकवचन “पत्थर” संभवतः पत्थर से बनी उपासना-वस्तुओं को सामान्य रूप में दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: “दुष्ट आत्माओं” का अधिक शाब्दिक अनुवाद “बुरी आत्माएँ” या “दुष्ट लोगों की आत्माएँ” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ይሰግዱ
  choice: के आगे झुकते हैं
  rationale: यह शारीरिक रूप से झुकने और उपासना-संबंधी श्रद्धा, दोनों का संकेत बनाए रखता है, पर हर स्थान पर केवल ‘पूजा करना’ अर्थ आरोपित नहीं करता।
- source_word: ለአብን
  choice: पत्थर के आगे
  rationale: मूल में सामग्री-सूचक एकवचन ‘पत्थर’ है; इसे सामान्य रूप में रखकर ‘पत्थर की मूर्ति’ जैसा स्पष्ट न किया गया शब्द नहीं जोड़ा गया।
- source_word: ይገብሩ ምስለ
  choice: प्रतिमा बनाते हैं
  rationale: ምስለ को यहाँ संज्ञा ‘प्रतिमा’ का कर्मकारक एकवचन मानते हुए शिल्पित उपासना-वस्तु का अर्थ व्यक्त किया गया है। हिंदी में सामग्री-सूची के साथ जातिवाचक एकवचन स्वाभाविक है।
- source_word: ዘወርቅ ወዘብሩር ወዘዕፅ ወዘልሕኵት
  choice: सोने, चाँदी, लकड़ी और मिट्टी की
  rationale: चारों सामग्रियों को क्रमपूर्वक रखा गया है। हिंदी में प्रत्येक के साथ ‘की’ दोहराने के बजाय अंत में एक बार कहना अधिक स्वाभाविक है।
- source_word: ነፍሳት እኩያት
  choice: दुष्ट आत्माओं
  rationale: शब्दशः ‘दुष्ट प्राण/आत्माएँ’ की अस्पष्टता को ‘आत्माएँ’ से बचाया गया है; प्रसंग में अलौकिक आत्माओं का अर्थ संभव है, पर पादटिप्पणी में दूसरा अर्थ भी दिया गया है।
- source_word: አጋንንት
  choice: दुष्टात्माओं
  rationale: अपोकैलिप्टिक प्रसंग में malevolent supernatural beings के लिए आधुनिक हिंदी का स्पष्ट और प्रचलित शब्द।
- source_word: ጣዖት
  choice: मूर्ति
  rationale: उपासना के लिए बनाई गई प्रतिमा के अर्थ में सरल और प्रचलित हिंदी; प्रसंग स्वयं इसकी निंदात्मक धार्मिक अर्थच्छाया स्पष्ट करता है।
- source_word: ኢበተምሃር
  choice: बिना समझे
  rationale: वाक्यांश की ज्ञान, शिक्षा या विवेक से वंचित होने की अर्थ-सीमा को सहज हिंदी में व्यक्त करता है और इसे किसी एक संकीर्ण अर्थ में बंद नहीं करता।
- source_word: ወኵሎ ረድኤተ ኢይረክቡ እምኔሆሙ
  choice: उन्हें उनसे किसी भी प्रकार की सहायता नहीं मिलेगी
  rationale: ኵሎ के पूर्ण निषेध-बल को ‘किसी भी प्रकार की’ से व्यक्त किया गया है। हिंदी में ‘सहायता नहीं पाएँगे’ की अपेक्षा ‘सहायता नहीं मिलेगी’ अधिक स्वाभाविक है, जबकि स्रोत का आशय—पूजी गई वस्तुओं/सत्ताओं से कोई सहायता न मिलना—अक्षुण्ण रहता है।
theological_decisions:
- issue: आरंभिक उपासना-वस्तु को केवल सामग्री कहना या स्पष्ट रूप से मूर्ति कहना
  choice: पत्थर
  alternative: पत्थर की मूर्ति
  rationale: गीज़ पाठ सीधे ‘पत्थर’ कहता है। केवल ‘पत्थर’ रखने से मूल की तीखी भौतिक अभिव्यक्ति बचती है और अनुल्लिखित ‘मूर्ति’ नहीं जोड़ी जाती।
- issue: ነፍሳት እኩያት का आशय
  choice: दुष्ट आत्माएँ
  alternative: दुष्ट लोगों की आत्माएँ / बुरी आत्माएँ
  rationale: दुष्टात्माओं और मूर्तियों के साथ इसका संयोजन अलौकिक अर्थ का समर्थन करता है, फिर भी ‘आत्माएँ’ शब्द और पादटिप्पणी मूल की संभावित व्यापकता को बनाए रखते हैं।
- issue: प्रतिमा का व्याकरणिक वचन
  choice: प्रतिमा (जातिवाचक एकवचन)
  alternative: प्रतिमाएँ
  rationale: ምስለ को संज्ञा का एकवचन रूप मानते हुए हिंदी में जातिवाचक एकवचन रखा गया है। सामग्रियों की बहुलता के कारण बहुवचन अर्थ संभव लग सकता है, पर उसे मूल पर आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज वाक्य-विन्यास रखा गया है। आवृत्त संयोजक संरचना को ‘और जो… और जो… और जो…’ द्वारा बनाए रखा गया है। ‘दुष्ट आत्माओं’ और ‘दुष्टात्माओं’ का भेद जानबूझकर रखा गया है, ताकि स्रोत के दो अलग पद एक ही हिंदी शब्द में विलीन न हों।
