base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/001.yaml
  text: 'Woe to you who do wickedness[a], and who praise and honor the word of falsehood: you will perish[b], and no good life will be yours.'
translation:
  language: hi
  text: धिक्कार है तुम पर, जो दुष्टता करते हो[a] और झूठी बात की प्रशंसा और सम्मान करते हो! तुम नष्ट हो जाओगे[b], और तुम्हें कोई उत्तम जीवन नहीं मिलेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद दुष्टता करने की बात कहता है; इसे ‘बुराई का आचरण करने’ के रूप में भी व्यक्त किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तुम मिट जाओगे’।
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: धिक्कार है तुम पर
  rationale: यह न्याय की भविष्यवाणी करने वाला धिक्कार-सूत्र है; ‘धिक्कार’ इसकी निंदा और न्याय की प्रबलता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: እለ፡ ትገብሩ፡ ርሰናናተ
  choice: जो दुष्टता करते हो
  rationale: क्रियापद बुराई के सक्रिय आचरण को व्यक्त करता है; यह चयन मूल की सीधी सामी अभिव्यक्ति के निकट रहते हुए सहज है।
- source_word: ወበነገረ፡ ሐሰት
  choice: झूठी बात
  rationale: ነገር एकवचन में ‘बात’, ‘वचन’ या ‘मामला’ हो सकता है। ‘झूठी बात’ एकवचन और अर्थगत व्यापकता दोनों को सुरक्षित रखता है।
- source_word: ትሴብሑ፡ ወታከብሩ
  choice: प्रशंसा और प्रतिष्ठा करते हो
  rationale: यह जोड़ी झूठ को सार्वजनिक स्वीकृति और सम्मान देने का भाव रखती है; ‘प्रशंसा’ और ‘प्रतिष्ठा’ समानांतर बल को बनाए रखते हैं।
- source_word: ተሐጕልክሙ
  choice: तुम नष्ट हो जाओगे
  rationale: रूप विनाश या सर्वनाश की धमकी देता है। यह न्यायसूचक बल को बनाए रखता है और केवल प्राकृतिक मृत्यु तक अर्थ को सीमित नहीं करता।
- source_word: ወአልብክሙ፡ ሕይወተ፡ ሠናይተ
  choice: तुम्हें कोई उत्तम जीवन नहीं मिलेगा
  rationale: मूल उत्तम जीवन के न होने या उसका अधिकार न मिलने की बात कहता है। यह हिन्दी में स्वाभाविक है और ‘जीवन’ को केवल समृद्धि या केवल परलोक तक सीमित नहीं करता।
theological_decisions:
- issue: ‘उत्तम जीवन’ से वंचित होने का आशय
  choice: नैतिक और प्रलयकालीन अर्थ से युक्त कल्याणमय जीवन का निषेध, पर अर्थ को खुला रखा गया है
  alternative: केवल वर्तमान जीवन की समृद्धि का खोना, अथवा जीवन का पूर्ण अंत
  rationale: धिक्कार-वचनों के प्रसंग में ‘जीवन’ नैतिक और भावी न्याय का भार रखता है, फिर भी मूल वाक्य इन विकल्पों में किसी एक को स्पष्ट रूप से निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्वर गरिमापूर्ण और भविष्यद्वक्तापरक है। वाक्य सामान्य पाठक के लिए सहज रखा गया है, जबकि ‘झूठी बात’ में मूल एकवचन ነገረ और उसकी ‘वचन/बात/मामला’ वाली अस्पष्टता यथासंभव सुरक्षित है।
