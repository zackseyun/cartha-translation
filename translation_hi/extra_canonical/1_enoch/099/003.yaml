base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/003.yaml
  text: In those days[a], you righteous, prepare yourselves to raise your prayers as a memorial, and place them as a testimony before the angels[c][b], that they may place the sin of sinners before the Most High as a memorial.
translation:
  language: hi
  text: उन दिनों, हे धर्मियो, अपने आप को तैयार करो कि अपनी प्रार्थनाएँ स्मरणार्थ[a] ऊपर उठाओ और उन्हें स्वर्गदूतों के सामने गवाही के रूप में रखो[b], ताकि वे पापियों के पाप को परमप्रधान के सामने स्मरणार्थ रखें[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘स्मरणार्थ’ का अर्थ ‘स्मरण के लिए’ या ‘स्मरण-चिह्न के रूप में’ भी हो सकता है; यहाँ स्वर्गीय न्यायसभा का भाव सम्भव है।
    reason: lexical_alternative
  - marker: b
    text: प्राप्त गीइज़ प्रतिलेखन में यहाँ की क्रिया के कुछ अक्षर क्षतिग्रस्त हैं। सम्भावित अर्थ ‘रखो’, ‘स्थापित करो’ या अधिक सामान्य रूप से ‘प्रस्तुत करो’ है।
    reason: textual_variant
  - marker: c
    text: अंतिम क्रिया भी पाठगत रूप से कठिन है। यहाँ ‘वे’ का सबसे सम्भावित संकेत स्वर्गदूतों की ओर है, और अर्थ ‘रखें’ या ‘सामने लाएँ’ हो सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: በአማንቱ፡ መዋዕል
  choice: उन दिनों
  rationale: यह प्रकाशन-साहित्य में प्रयुक्त समय-सूचक मुहावरे का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ተደለዉ፡ ጻድቃን
  choice: हे धर्मियो, अपने आप को तैयार करो
  rationale: क्रिया को द्वितीय पुरुष बहुवचन आज्ञार्थक और ‘धर्मियों’ को सम्बोधन मानता है; इससे स्रोत का व्याकरण और आह्वान दोनों सुरक्षित रहते हैं।
- source_word: ከመ፡ ትንሥኡ፡ ጸሎታቲከሙ
  choice: कि अपनी प्रार्थनाएँ ... ऊपर उठाओ
  rationale: क्रिया सक्रिय द्वितीय पुरुष बहुवचन है; धर्मी स्वयं प्रार्थनाएँ उठाते हैं। ‘ऊपर उठाओ’ प्रार्थना के आरोहण की छवि बनाए रखता है।
- source_word: በተዝካር
  choice: स्मरणार्थ
  rationale: संक्षिप्त हिन्दी रूप स्मरण के लिए परमप्रधान के सामने प्रस्तुत की जाने वाली वस्तु के उपासना-संबंधी और न्यायिक दोनों आयामों को खुला रखता है।
- source_word: ሰማዕተ
  choice: गवाही
  rationale: यहाँ यह शब्द ‘गवाही/साक्ष्य’ है; स्वर्गदूतों के लिए अलग और स्पष्ट शब्द መላእክት उपस्थित है।
- source_word: በቅድመ፡ መላእክት
  choice: स्वर्गदूतों के सामने
  rationale: वास्तविक गीइज़ संज्ञा መላእክት का स्पष्ट अनुवाद करता है और स्वर्गीय न्यायसभा की पृष्ठभूमि बनाए रखता है।
- source_word: አንብ...ሙ / ያንብ...ሙ
  choice: रखो / रखें
  rationale: प्राप्त पाठ में अक्षर क्षतिग्रस्त हैं, पर नवीन व्याकरणिक समीक्षा और समानांतर वाक्यरचना ‘रखना/स्थापित करना’ अर्थ का समर्थन करती है; अनिश्चितता पादटिप्पणियों में दी गई है।
- source_word: በቅድመ፡ ልዑል
  choice: परमप्रधान के सामने
  rationale: ईश्वर की उन्नत उपाधि और उपस्थिति/न्यायसभा का भाव बिना अतिरिक्त व्याख्या के सुरक्षित रहता है।
- source_word: ለኃጢአተ፡ ኃጥኣን
  choice: पापियों के पाप को
  rationale: स्रोत में ‘पाप’ एकवचन रूप में है, जो सामूहिक अर्थ रख सकता है; हिन्दी में यही रूप उस सामूहिकता को सुरक्षित रखता है।
theological_decisions:
- issue: स्वर्गीय न्यायसभा में धर्मियों की प्रार्थनाओं की भूमिका
  choice: प्रार्थनाएँ स्मरणार्थ उठाई जाती हैं और स्वर्गदूतों के सामने गवाही के रूप में रखी जाती हैं; फिर पापियों का पाप परमप्रधान के सामने स्मरणार्थ रखा जाता है।
  alternative: इसे केवल भक्तिपूर्ण स्मरण माना जाए, जिसमें न्यायिक या आरोपात्मक भाव न हो।
  rationale: ‘गवाही’, स्वर्गदूतों के सामने प्रस्तुति, और परमप्रधान के सामने पाप को स्मरणार्थ रखने की क्रमिक भाषा न्यायिक पृष्ठभूमि सुझाती है; फिर भी अनुवाद ‘विरुद्ध’ जोड़कर आरोपात्मक अर्थ को आवश्यकता से अधिक निश्चित नहीं करता।
- issue: क्रियाओं का कर्ता और सम्बोधन
  choice: धर्मियों को तैयार होकर अपनी प्रार्थनाएँ उठाने और गवाही रखने की आज्ञा है; अंतिम उपवाक्य में स्वर्गदूत संभावित कर्ता हैं।
  alternative: धर्मी स्वतः तैयार किए जाएँ, प्रार्थनाएँ स्वयं ऊपर उठें, और स्वर्गदूत उन्हें पढ़ें।
  rationale: आज्ञार्थक ተደለዉ, सम्बोधन ጻድቃን और सक्रिय द्वितीय पुरुष बहुवचन ትንሥኡ संशोधित पाठ का समर्थन करते हैं; अंतिम बहुवचन क्रिया का निकटतम सम्भावित कर्ता स्वर्गदूत हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और आज्ञात्मक शैली रखी गई है। ‘हे धर्मियो’ सम्बोधन को प्रत्यक्ष बनाता है; ‘परमप्रधान’ पारंपरिक दिव्य उपाधि को स्वाभाविक हिन्दी में सुरक्षित रखता है। पाठगत अनिश्चितताओं को मुख्य वाक्य में अस्वाभाविकता लाए बिना पादटिप्पणियों में स्पष्ट किया गया है।
