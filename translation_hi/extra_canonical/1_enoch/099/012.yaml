base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/012.yaml
  text: Woe to you who make the measure of sin and deceit[a], and who cause bitterness upon the earth[c][b], for by it they will be destroyed.
translation:
  language: hi
  text: धिक्कार है तुम पर, जो पाप और छल का माप बनाते हो,[a] और जो पृथ्वी पर कड़वाहट फैलाते हो;[b] क्योंकि उसी के द्वारा वे नष्ट किए जाएँगे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘पाप और छल का माप’ कठिन अभिव्यक्ति है। इसका संकेत बेईमान या झूठे बाट-माप की ओर भी हो सकता है; अनुवाद संभव है: ‘जो माप को पापपूर्ण और छलपूर्ण बनाते हो।’'
    reason: lexical_alternative
  - marker: b
    text: प्राचीन पाठ की इस क्रिया का अर्थ ‘कड़वाहट उत्पन्न करना’ या ‘कड़वा कर देना’ है; इसलिए अनुवाद ‘पृथ्वी को कड़वाहट से भरते हो’ भी संभव है।
    reason: textual_and_lexical_clarification
  - marker: c
    text: ‘उसी के द्वारा’ का अर्थ ‘उसी के कारण’ भी हो सकता है। ‘उसी’ किस निकटवर्ती बुराई की ओर संकेत करता है, यह पूरी तरह स्पष्ट नहीं है।
    reason: ambiguity
lexical_decisions:
- source_word: እሌ፡ ለክሙ
  choice: धिक्कार है तुम पर
  rationale: यह भविष्यद्वक्ताओं जैसी निंदा और आनेवाले न्याय की घोषणा है; आधुनिक हिन्दी में ‘धिक्कार है तुम पर’ इसकी गंभीरता बनाए रखता है।
- source_word: ትገብርዋ፡ ለመስፈርት፡ ኃጢአት፡ ወሐሱት
  choice: जो पाप और छल का माप बनाते हो
  rationale: सुधारे गए पाठ के अनुसार ‘माप’, ‘पाप’ और ‘छल/झूठ’ की ठोस तथा कठिन अभिव्यक्ति को बिना सामान्य नैतिक कथन में बदलकर सुरक्षित रखा गया है। संदर्भ बेईमान माप की ओर संकेत कर सकता है, पर व्याकरणिक अस्पष्टता के कारण उसे मुख्य पाठ में निर्णायक रूप से नहीं खोला गया।
- source_word: ታምርሩ፡ ዲበ፡ ምድር
  choice: जो पृथ्वी पर कड़वाहट फैलाते हो
  rationale: स्रोत-समीक्षा से प्राप्त सुधारा हुआ रूप ‘कड़वा करना/कड़वाहट उत्पन्न करना’ बताता है। ‘फैलाते हो’ पृथ्वी पर उसके व्यापक प्रभाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: እስመ፡ ቦቱ፡ ይትዌደኡ
  choice: क्योंकि उसी के द्वारा वे नष्ट किए जाएँगे
  rationale: ቦቱ का साधनवाचक या कारणवाचक संबंध और अंतिम क्रिया का विनाशकारी न्यायार्थ दोनों बनाए गए हैं; सर्वनाम का संदर्भ स्रोत की तरह खुला रखा गया है।
theological_decisions:
- issue: ‘माप’ की कठिन अभिव्यक्ति को बेईमान व्यापारिक बाट-माप के रूप में स्पष्ट करना या उसकी अस्पष्टता बनाए रखना
  choice: पाप और छल का माप
  alternative: झूठा और छलपूर्ण माप
  rationale: मूल में ‘माप’, ‘पाप’ और ‘झूठ/छल’ उपस्थित हैं। व्यावसायिक धोखे का अर्थ संभव है, पर मुख्य पाठ में उसे अकेला निश्चित अर्थ बनाने के बजाय ठोस रूपक और तनाव सुरक्षित रखा गया है।
- issue: अंतिम विनाश का साधन या कारण
  choice: उसी के द्वारा वे नष्ट किए जाएँगे
  alternative: उसी के कारण वे नष्ट हो जाएँगे
  rationale: मूल का पूर्वसर्ग साधन और कारण दोनों व्यक्त कर सकता है। चुना हुआ पाठ न्याय की कर्मवाच्य गंभीरता रखते हुए इस संबंध को यथासंभव निकटता से व्यक्त करता है।
- issue: अंतिम बहुवचन ‘वे’ का संदर्भ
  choice: वे
  alternative: तुम
  rationale: स्रोत में आरंभिक संबोधन द्वितीय पुरुष है, जबकि अंतिम क्रिया तृतीय पुरुष बहुवचन प्रतीत होती है। इस व्याकरणिक तनाव को चुपचाप समतल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु भविष्यद्वक्ताओं की धिक्कार-वाणी के अनुरूप गंभीर और गरिमापूर्ण रखी गई है। ‘माप’ की ठोस छवि, अंतिम सर्वनाम की अस्पष्टता और द्वितीय से तृतीय पुरुष में बदलाव को सुरक्षित रखा गया है। स्रोत-समीक्षा में पहचाने गए OCR-सुधार—विशेषकर ‘छल/झूठ’ और ‘कड़वाहट उत्पन्न करना’—को प्राथमिकता दी गई है।
