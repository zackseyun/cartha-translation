base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/009.yaml
  text: They will forget and be afraid[a], because they did all their works in falsehood, and they worshiped a stone[d][c][b], and they will perish in an instant.
translation:
  language: hi
  text: वे भूल जाएँगे और डरेंगे, क्योंकि उन्होंने अपने सारे काम झूठ से किए, और एक पत्थर की पूजा की,[a] और वे एकाएक नष्ट हो जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “एक पत्थर को दण्डवत किया।” यह संभवतः पत्थर की किसी मूर्ति या उपासना-वस्तु का ठोस उल्लेख है।'
    reason: cultural_note
lexical_decisions:
- source_word: ይረሰዑ
  choice: वे भूल जाएँगे
  rationale: क्रिया का सक्रिय बहुवचन भाव सबसे स्वाभाविक रूप से ‘वे भूल जाएँगे’ देता है; कर्मवाच्य ‘वे भुला दिए जाएँगे’ संभव तो है, पर प्रसंग में कम स्वाभाविक है।
- source_word: ይፈርሁ
  choice: और डरेंगे
  rationale: साधारण भय का भाव रखा गया है; ‘आतंकित होंगे’ मूल से अधिक तीव्र होता।
- source_word: ኵሎ፡ ገብሮሙ፡ በሐሰት
  choice: उन्होंने अपने सारे काम झूठ में किए
  rationale: यह उनके सभी कर्मों के झूठ और असत्य से संचालित होने का नैतिक भाव बनाए रखता है।
- source_word: ለአብን
  choice: एक पत्थर को
  rationale: मूल में वस्तु एकवचन ‘पत्थर’ है; उसे बहुवचन मूर्तियों या स्पष्टतः ‘पत्थर की मूर्ति’ में नहीं बदला गया।
- source_word: ይትሐጐሉ
  choice: नष्ट हो जाएँगे
  rationale: क्रिया विनाश या मिट जाने का बोध देती है; यह उसके परिणाम को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: በምዕር
  choice: एकाएक
  rationale: नवीन स्रोत-समीक्षा के अनुसार यहाँ समय-सूचक अर्थ ‘क्षण भर में/अचानक’ है, न कि ‘लज्जा में’। ‘एकाएक’ संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: पत्थर की एकवचन उपासना
  choice: ‘एक पत्थर को दण्डवत किया’
  alternative: ‘पत्थर की मूर्ति की पूजा की’
  rationale: एकवचन ठोस चित्र को बनाए रखा गया है और मूर्तिपूजा का आशय टिप्पणी में स्पष्ट किया गया है, मुख्य पाठ में अतिरिक्त व्याख्या नहीं जोड़ी गई।
- issue: अंतिम न्याय की अभिव्यक्ति
  choice: ‘एकाएक नष्ट हो जाएँगे’
  alternative: ‘लज्जा में भस्म हो जाएँगे’
  rationale: በምዕር को समय-सूचक ‘अचानक’ मानने वाली संशोधित शब्द-समीक्षा अपनाई गई है; विनाश के ढंग को अनावश्यक रूप से विशिष्ट नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दण्डवत किया’ उपासना की शारीरिक क्रिया को व्यक्त करता है, जबकि ‘एकाएक नष्ट हो जाएँगे’ अंतिम पदों के संशोधित पाठगत अर्थ को स्वाभाविक हिन्दी में रखता है।
