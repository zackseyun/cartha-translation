base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/006.yaml
  text: 'And again I swear to you[a], sinners: sin has been prepared for the day of blood that does not cease.'
translation:
  language: hi
  text: 'और फिर मैं तुमसे, हे पापियो, शपथपूर्वक कहता हूँ: न थमने वाले रक्तपात के दिन के लिए पाप[a] तैयार रखा गया है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न थमने वाले रक्तपात के दिन के लिए दंड या न्याय तैयार रखा गया है।” गीज़ पाठ में शाब्दिक रूप से “पाप” है, पर यहाँ यह शब्द संक्षेप में पाप के परिणाम को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወካዕበ
  choice: और फिर
  rationale: संयोजक और पुनरावृत्तिसूचक क्रियाविशेषण दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: እኔ እምሕል ለክሙ
  choice: मैं तुम ... से शपथपूर्वक कहता हूँ
  rationale: मूल की गंभीर शपथात्मक घोषणा को रखता है; केवल ‘कहता हूँ’ से अधिक प्रबल है और हिन्दी में स्वाभाविक है।
- source_word: ለኃጥኣን
  choice: पापियों
  rationale: प्रत्यक्ष संबोधन का भाव ‘तुम पापियों से’ में स्पष्ट रहता है।
- source_word: ለዕለተ ደም
  choice: उस दिन के लिए, जब रक्तपात ...
  rationale: शाब्दिक ‘रक्त के दिन’ को हिंसक रक्त बहाए जाने के अर्थ में सहज हिन्दी देता है, बिना न्याय या युद्ध को अनावश्यक रूप से निर्दिष्ट किए।
- source_word: ዘአየሀድአ
  choice: थमता नहीं
  rationale: सापेक्ष रूप की निरंतरता को ‘न रुकने वाला’ अर्थ में सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ተደለወት
  choice: तैयार रखा गया है
  rationale: पूर्ण निष्क्रिय भाव और पहले से तैयार होने का अर्थ सुरक्षित रहता है; कर्ता को मूल की तरह अनिर्दिष्ट रखा गया है।
- source_word: ኃጢአት
  choice: पाप
  rationale: गीज़ संज्ञा का सीधा अर्थ रखा गया है; दंड या न्याय के रूप में संभावित लाक्षणिक अर्थ को पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ኃጢአት को स्वयं पाप माना जाए या पाप के न्यायिक परिणाम के रूप में समझा जाए
  choice: मुख्य पाठ में ‘पाप’
  alternative: ‘दंड’ अथवा ‘न्याय’ तैयार रखा गया है
  rationale: मूल पाठ सीधे ‘पाप’ कहता है। कठिन, संक्षिप्त वाक्य में यह पाप के परिणाम का लाक्षणिक संकेत हो सकता है, पर मुख्य पाठ में उसे निश्चित कर देना वास्तविक तनाव को मिटा देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; गंभीर और भविष्यदर्शी स्वर। ‘रक्तपात’ सामान्य पाठक के लिए ‘रक्त’ की अपेक्षा आशय अधिक स्पष्ट करता है। वाक्य-विन्यास को स्वाभाविक बनाने के लिए सापेक्ष उपवाक्य ‘जब रक्तपात थमता नहीं’ रखा गया है, जबकि मूल की अस्पष्टता और निष्क्रियता सुरक्षित हैं।
