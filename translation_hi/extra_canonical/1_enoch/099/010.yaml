base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/010.yaml
  text: And in those days[a], blessed are all those who accept the word of wisdom, and understand it, and do it, and follow the way of the Most High, and walk in the way of his righteousness, and do not act wickedly with those who act wickedly[d][c][b]; for they shall be saved.
translation:
  language: hi
  text: और उन दिनों में वे सभी धन्य हैं जो बुद्धि के वचन को ग्रहण करते हैं, उसे समझते हैं और उस पर अमल करते हैं, परमप्रधान के मार्ग का अनुसरण करते हैं, उसकी धार्मिकता के मार्ग पर चलते हैं, और दुष्टता करने वालों के साथ दुष्टता नहीं करते[a]; क्योंकि वे बचाए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दुष्टता करने वालों के साथ भ्रष्ट नहीं होते/भटक नहीं जाते।’ इस दोहराई गई गीइज़ क्रिया का अर्थ संदर्भ के अनुसार दुष्टता करना, भ्रष्ट होना, नष्ट होना या भटक जाना भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ብፁዓን
  choice: धन्य
  rationale: यह ज्ञान-साहित्य और प्रलय-साहित्य के अनुरूप ईश्वरीय अनुग्रह का भाव रखता है, केवल भावनात्मक प्रसन्नता का नहीं।
- source_word: ይትሜጠዉ ነገረ ጥበብ
  choice: बुद्धि के वचन को ग्रहण करते हैं
  rationale: क्रिया स्वीकार करने या अपनाने का भाव देती है; ነገር के ‘वचन/संदेश/विषय’ अर्थों में ‘वचन’ मूल की संक्षिप्त और गरिमापूर्ण अभिव्यक्ति बनाए रखता है।
- source_word: ያእምርዎን ወይገብርዎን
  choice: उसे समझते और उसके अनुसार चलते हैं
  rationale: पहली क्रिया समझने और दूसरी करने/पालन में लाने को व्यक्त करती है। स्वाभाविक हिन्दी में ‘उसके अनुसार चलते हैं’ बुद्धि को व्यवहार में उतारने का अर्थ स्पष्ट करता है।
- source_word: ለፍኖተ ልዑል
  choice: परमप्रधान के मार्ग का अनुसरण करते हैं
  rationale: यहाँ ለ प्रत्यक्ष कर्म को चिह्नित करता है; इसलिए वाक्यांश को ‘मार्ग में’ नहीं, बल्कि मार्ग को मानने या उसका अनुसरण करने के रूप में प्रस्तुत किया गया है।
- source_word: የሐውሩ በፍኖተ ጽድቅ ዚአሁ
  choice: उसकी धार्मिकता के मार्ग पर चलते हैं
  rationale: चलने और मार्ग की नैतिक उपमा को बनाए रखते हुए ጽድቅ का धर्मवैचारिक भार ‘धार्मिकता’ से सुरक्षित रहता है।
- source_word: ኢይረሰዑ ምስለ እለ ይረሰዑ
  choice: दुष्टता करनेवालों के साथ दुष्टता नहीं करते
  rationale: ረሰዐ सक्रिय रूप से दुष्ट या अधर्मी आचरण करने का अर्थ देता है और हनोक में ‘दुष्ट’ के तकनीकी शब्द से निकट संबंध रखता है।
- source_word: ይድኅኑ
  choice: वे बचाए जाएँगे
  rationale: यह उद्धार, रक्षा या संकट से छुड़ाए जाने का भाव देता है; कर्मवाच्य भविष्यकाल मूल के अंतकालीन आशय को बनाए रखता है।
theological_decisions:
- issue: ረሰዐ के नैतिक और न्याय-संबंधी अर्थ का संबंध
  choice: दुष्टता करना
  alternative: भ्रष्ट होना, भटक जाना, अथवा नष्ट होना
  rationale: मूल क्रिया का प्रत्यक्ष नैतिक बल ‘दुष्टता करना’ है। इससे धार्मिकता के मार्ग और दुष्ट आचरण का विरोध स्पष्ट रहता है, जबकि नाश को स्वयं क्रिया का मुख्य अर्थ बनाकर अंतिम परिणाम को पहले से निर्धारित नहीं किया जाता।
- issue: ይድኅኑ में उद्धार का स्वरूप
  choice: बचाए जाएँगे
  alternative: छुड़ाए जाएँगे अथवा बच निकलेंगे
  rationale: पद यह नहीं बताता कि उद्धार ठीक किस साधन या सिद्धान्त से होगा। ‘बचाए जाएँगे’ अंतकालीन भार को रखता है और अनावश्यक सांप्रदायिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। ‘परमप्रधान’, ‘धार्मिकता’ और ‘धन्य’ जैसे स्थापित बाइबलीय शब्द रखे गए हैं। संयोजक शृंखला मूल की संचयी लय को बनाए रखती है, पर ‘करते हैं’ की अस्पष्ट पुनरावृत्ति को स्वाभाविक हिन्दी में ‘उसके अनुसार चलते हैं’ किया गया है।
