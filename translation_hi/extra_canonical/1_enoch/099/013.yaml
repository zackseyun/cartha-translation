translation:
  language: hi
  text: '**1 हनोक 99:13**


    हाय तुम पर, जो—[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध गीइज़ साक्ष्य यहाँ खंडित है। मूल पाठ का अर्थ शाब्दिक रूप से “हाय तुम पर, जो—” है; “जो” के बाद आने वाला उपवाक्य इस उपलब्ध अंश में सुरक्षित नहीं है।
    reason: textual_variant
lexical_decisions:
- source_word: እሌ
  choice: हाय
  rationale: इस प्रसंग में यह बहुवचन संकेतवाचक नहीं, बल्कि शोक/धिक्कार सूचक उद्गार है; 99:11–12 के निकटवर्ती ‘हाय’ कथनों की पुनरावृत्ति भी इसी अर्थ का समर्थन करती है।
- source_word: ለክሙ
  choice: तुम पर
  rationale: यह पूर्वसर्ग के साथ द्वितीय पुरुष बहुवचन सर्वनाम है। हिन्दी में धिक्कारसूचक ‘हाय’ के साथ ‘तुम पर’ स्वाभाविक रूप से संबोधन का भाव व्यक्त करता है।
- source_word: እለ
  choice: जो
  rationale: यह बहुवचन संबंधवाचक रूप है और आगे आने वाले, पर उपलब्ध अंश में लुप्त, उपवाक्य का आरम्भ करता है। इसे हटाने या पूरा करने के बजाय अधूरापन सुरक्षित रखा गया है।
theological_decisions:
- issue: खंडित गीइज़ पाठ को कैसे प्रस्तुत किया जाए
  choice: केवल उपलब्ध शब्दों का अनुवाद करके वाक्य को डैश पर अधूरा छोड़ना
  alternative: बाद की अनुवाद-परंपरा या अन्य संस्करणों के आधार पर शेष पद की पुनर्रचना करना
  rationale: दिए गए मूल-पाठ में धिक्कारसूचक वाक्य और संबंधवाचक ‘जो’ तो उपस्थित हैं, पर उसके बाद का कथन नहीं है। अप्रमाणित सामग्री जोड़ने के बजाय पाठ की वास्तविक अपूर्णता दिखाना अधिक पारदर्शी है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण भाषा रखी गई है। ‘हाय तुम पर’ बाइबलीय धिक्कार-वाक्य का स्वाभाविक हिन्दी रूप है; दीर्घ डैश पाठ के खंडित और अधूरे होने को स्पष्ट करता है।
