base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/005.yaml
  text: And the chariots by which it ascends are driven by the wind[a], and the sun goes down from the sky and returns through the north in order to reach the east[e][d][c][b]; and it is led so that it may enter the gate and shine on the face of heaven.
translation:
  language: hi
  text: और वे रथ, जिनके द्वारा सूर्य ऊपर चढ़ता है, हवा से चलाए जाते हैं[a]। सूर्य आकाश से नीचे उतरता है[b] और पूर्व की ओर जाने के लिए उत्तर से होकर लौटता है[c]। फिर उसका मार्गदर्शन किया जाता है, ताकि वह द्वार[d] में प्रवेश करे और आकाश के मुख पर चमके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पदबंध कठिन है; अधिक शाब्दिक अर्थ ‘ऊपर चढ़ने की हवा’ या ‘उठती हुई हवा’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘आकाश’ के लिए प्रयुक्त शब्द का अनुवाद ‘स्वर्ग’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘लौटता है’ के स्थान पर अधिक शाब्दिक रूप से ‘प्रवेश करता है’ या ‘अंदर आता है’ भी संभव है।
    reason: lexical_alternative
  - marker: d
    text: यह शब्द एकवचन है और इसका अर्थ ‘द्वार’ या ‘प्रवेश-द्वार’ है; इस पुस्तक में यह आकाशीय मार्ग के द्वार का बिंब है।
    reason: lexical_clarification
lexical_decisions:
- source_word: ሰረገላት
  choice: रथों
  rationale: बहुवचन संज्ञा आकाशीय वाहनों को सूचित करती है। ‘रथ’ इस खगोलीय-दर्शनात्मक बिंब को बनाए रखता है।
- source_word: የዓርግ ነፋስ ይነፍኅ
  choice: वे हवा से चलाए जाते हैं
  rationale: मूल पदबंध कठिन है और उसमें ‘ऊपर चढ़ने की हवा’ अथवा हवा के बहने का भाव हो सकता है। मुख्य पाठ में हवा द्वारा रथों की गति का स्वाभाविक अर्थ रखा गया है और अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: የዓርብ ፀሐይ
  choice: सूर्य ... नीचे उतरता है
  rationale: क्रिया सूर्य के उतरने या अस्त होने का बोध कराती है। ‘नीचे उतरता है’ दृश्य गति को स्पष्ट रखते हुए मूल बिंब के निकट है।
- source_word: እምሰማይ
  choice: आकाश से
  rationale: खगोलीय प्रसंग में ‘आकाश’ आधुनिक हिन्दी में दृश्य नभ का स्पष्ट अर्थ देता है; यही शब्द ‘स्वर्ग’ का अर्थ भी दे सकता है।
- source_word: ወይገብእ እንተ መስዕ
  choice: उत्तर से होकर लौटता है
  rationale: क्रम सूर्य की परिक्रमा का वर्णन करता है। क्रिया का मूल भाव ‘प्रवेश करना/अंदर आना’ भी हो सकता है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ወይትመራኅ
  choice: उसका मार्गदर्शन किया जाता है
  rationale: निष्क्रिय भाव सूर्य के मार्ग के निर्देशित या नियत होने को सुरक्षित रखता है, बिना निर्देशक की पहचान जोड़े।
- source_word: ኆኅተ
  choice: द्वार
  rationale: यह एकवचन कर्मकारक रूप है और खगोलीय पुस्तक में आकाशीय प्रवेश-द्वार के लिए प्रयुक्त तकनीकी बिंब के अनुकूल है।
- source_word: ያበርህ በገጸ ሰማይ
  choice: आकाश के मुख पर चमके
  rationale: ‘आकाश का मुख’ मूल मुहावरे और अपोकैलिप्टिक बिंब को बनाए रखता है; ‘चमके’ प्रकाश देने की क्रिया को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ሰማይ को ‘आकाश’ या ‘स्वर्ग’ कहना
  choice: मुख्य पाठ में दोनों स्थानों पर ‘आकाश’
  alternative: ‘स्वर्ग’ अथवा पहले ‘आकाश’ और अंत में ‘स्वर्ग’
  rationale: यह अंश सूर्य की दृश्य खगोलीय गति बताता है, इसलिए ‘आकाश’ अधिक स्पष्ट है। फिर भी गीइज़ शब्द में ‘स्वर्ग’ का अर्थ संभव है और उसे पादटिप्पणी में रखा गया है।
- issue: सूर्य का मार्ग निर्देशित होने का भाव
  choice: निष्क्रिय रूप ‘उसका मार्गदर्शन किया जाता है’
  alternative: ‘उसे दिशा दी जाती है’
  rationale: मूल पाठ मार्ग के किसी निर्देशक का नाम नहीं बताता। निष्क्रिय अनुवाद उस धार्मिक-खगोलीय संकेत को बनाए रखता है, पर उससे आगे कोई सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। लंबे मूल वाक्य को अर्थक्रम बनाए रखते हुए तीन वाक्यों में बाँटा गया है। ‘आकाश का मुख’ जैसे विशिष्ट प्राचीन बिंब को सरल करके हटाया नहीं गया, और कठिन गीइज़ पदबंधों की वास्तविक अनिश्चितता पादटिप्पणियों में सुरक्षित रखी गई है।
