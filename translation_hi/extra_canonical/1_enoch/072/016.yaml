base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/016.yaml
  text: And when thirty mornings are completed[a], the day decreases by exactly one part, and the day becomes eleven parts[c][b], and the night seven.
translation:
  language: hi
  text: और जब तीस भोरें पूरी हो जाती हैं[a], तब दिन ठीक एक भाग घट जाता है, और दिन के ग्यारह भाग तथा रात के सात भाग हो जाते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘तीस भोरें’ है। इस खंड में यह अभिव्यक्ति सौर पंचांग में गिनी गई अवधि के लिए प्रयुक्त होती है।
    reason: lexical_alternative
  - marker: b
    text: 'इस अध्याय में दिन और रात को बार-बार गिने हुए ‘भागों’ में मापा गया है। यहाँ दिन के उजाले के ग्यारह और रात के सात भाग बताए गए हैं। अधिक शाब्दिक रूप: ‘और दिन ग्यारह भाग हो जाता है, और रात सात।’'
    reason: cultural_note
lexical_decisions:
- source_word: ተፈጸመ
  choice: पूरी हो जाती हैं
  rationale: यह क्रिया गिनी हुई अवधि की पूर्णता बताती है; बहुवचन ‘तीस भोरें’ के साथ यह स्वाभाविक और अर्थनिष्ठ है।
- source_word: ሠላሳ ጽባሕ
  choice: तीस भोरें
  rationale: गीज़ पाठ में स्पष्टतः ‘भोरें’ हैं; सौर पंचांग में यह दिनों की गिनी हुई अवधि है, फिर भी मूल बिंब को मुख्य पाठ में रखा गया है।
- source_word: ተሐፅፅ ማዓልት
  choice: दिन ... घट जाता है
  rationale: यह दिन के उजाले की मात्रात्मक कमी दर्शाता है और अध्याय की गणनात्मक शैली बनाए रखता है।
- source_word: ክፍለ አሐደ ጥንቁቀ
  choice: ठीक एक भाग
  rationale: ‘ठीक’ ጥንቁቀ की सटीकता पर दी गई महत्त्वपूर्ण बलाघात को व्यक्त करता है।
- source_word: ወትከውን
  choice: हो जाते हैं
  rationale: यह घटने के बाद बनी परिणामी अवस्था को व्यक्त करता है; हिन्दी वाक्य में दिन और रात के भागों को संयुक्त रूप से कहना स्वाभाविक है।
- source_word: ዕለት ዓሠርተ ወአሐደ ክፍለ
  choice: दिन के ग्यारह भाग
  rationale: यह दिन के उजाले का नया मापा हुआ अनुपात स्पष्ट करता है और ‘भाग’ की तकनीकी शब्दावली बनाए रखता है।
- source_word: ወሌሊት ስብዓተ
  choice: रात के सात भाग
  rationale: मूल में ‘भाग’ दूसरी संख्या के साथ निहित है; हिन्दी में उसे दोहराने से अर्थ स्पष्ट रहता है।
