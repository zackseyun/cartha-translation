base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/017.yaml
  text: And the sun goes out from the west[a], from that sixth gate, and travels eastward, and rises in the fifth gate for thirty mornings[b], and sets again in the west in the fifth western gate.
translation:
  language: hi
  text: और सूर्य पश्चिम से, उस छठे द्वार से निकलता है और पूर्व की ओर जाता है; वह पाँचवें द्वार में तीस भोरों तक[a] उदय होता है, और फिर पश्चिम में, पश्चिम के पाँचवें द्वार में अस्त होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तीस भोर।” प्रसंग में यह दिनों की गणना का काम कर सकता है, पर मूल की अभिव्यक्ति यहाँ बनाए रखी गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይወፅእ፡ ፀሐይ
  choice: और सूर्य ... निकलता है
  rationale: क्रिया सूर्य के किसी द्वार से बाहर आने या निकलने को व्यक्त करती है। ‘निकलता है’ आधुनिक हिन्दी में स्वाभाविक है और मूल की द्वार-संबंधी कल्पना बनाए रखता है।
- source_word: እምነ፡ ምዕራብ፡ እምይእቲ፡ ሳድስት፡ ኆኅት
  choice: पश्चिम से, उस छठे द्वार से
  rationale: दोनों ‘से’ पदबंध मूल के स्थान और निर्दिष्ट द्वार को स्पष्ट रखते हैं। स्रोत में ‘वहाँ से’ के लिए कोई अलग शब्द नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: ወየሐውር፡ ምሥራቀ
  choice: और पूर्व की ओर जाता है
  rationale: यह साधारण दिशात्मक गति को व्यक्त करता है; यह अनुवाद न तो गति को अत्यधिक तकनीकी बनाता है, न उसका आधुनिकीकरण करता है।
- source_word: ወይሠርቅ፡ በኃምስት፡ ኆኅት
  choice: वह पाँचवें द्वार में ... उदय होता है
  rationale: सूर्य के संदर्भ में क्रिया का स्वाभाविक अर्थ ‘उदय होना’ है। ‘द्वार में’ मूल के स्थानवाचक ढाँचे को सुरक्षित रखता है।
- source_word: ሠላሳ፡ ጽባሐ
  choice: तीस भोरों तक
  rationale: मूल में अक्षरशः ‘तीस भोर’ हैं। ‘भोरों’ उस गणना को बनाए रखता है, जबकि ‘तक’ हिन्दी में अवधि को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ወየዓርብ፡ ... ኃምስተ፡ ኆኅተ፡ እንተ፡ ምዕራብ
  choice: और फिर पश्चिम में, पश्चिम के पाँचवें द्वार में अस्त होता है
  rationale: सूर्य और पश्चिमी द्वार के संदर्भ में क्रिया ‘अस्त होना’ है। दोहरा पश्चिम-संदर्भ मूल की संरचना और पूर्व-पश्चिम समरूपता को बनाए रखता है।
theological_decisions:
- issue: सूर्य की गति के लिए ब्रह्मांडीय द्वारों की कल्पना
  choice: ‘द्वार’ की भाषा को अक्षरशः बनाए रखा गया है।
  alternative: ‘मार्ग’, ‘क्षितिज’ या ‘खुला स्थान’ कहना
  rationale: यह अंश एक संरचित दर्शनीय ब्रह्मांड-वर्णन प्रस्तुत करता है। ‘द्वार’ को बनाए रखने से मूल की अपोकैलिप्टिक छवि सुरक्षित रहती है और उसे आधुनिक खगोल-विज्ञान के अनुसार समतल नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘द्वार’, ‘उदय’ और ‘अस्त’ अध्याय की बार-बार आने वाली ब्रह्मांडीय शब्दावली को संगत रखते हैं; स्रोत में अनुपस्थित ‘वहाँ से’ नहीं जोड़ा गया है।
