base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/028.yaml
  text: And on that day the night decreases from its length by a ninth part[a], that is, one part, and the night becomes eleven parts[b], and the day seven parts.
translation:
  language: hi
  text: और उस दिन रात अपनी लंबाई के नौवें भाग—अर्थात् एक भाग—से घट जाती है[a], और रात ग्यारह भाग की रह जाती है[b], और दिन सात भाग का हो जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इथियोपिक पाठ यहाँ कठिन है और ‘नौवें भाग’ वाले अंक-वाक्यांश में पाठगत अनिश्चितता है। सबसे उपयुक्त अर्थ यह है कि रात अपनी लंबाई के नौवें भाग, अर्थात् एक भाग, से घटती है और फलस्वरूप ग्यारह भाग की रह जाती है।
    reason: textual_variant
  - marker: b
    text: 'वैकल्पिक (पूर्ववर्ती) अनुवाद: ‘और उस दिन रात नौ भागों में से एक भाग घट जाती है, और रात ग्यारह भाग की रह जाती है, और दिन सात भाग का हो जाता है।’'
    reason: previous_rendering
lexical_decisions:
- source_word: ኀፀፀት
  choice: घट जाती है
  rationale: यह क्रिया कमी या छोटा होने को व्यक्त करती है; खगोलीय माप के संदर्भ में यह स्वाभाविक हिन्दी है।
- source_word: ሌሊት
  choice: रात
  rationale: मापी जा रही रात्रि-अवधि का सीधा और सामान्य हिन्दी रूप।
- source_word: እምኑኃ
  choice: अपनी लंबाई में से
  rationale: यहाँ ኑኅ ‘लंबाई’ के साथ स्त्रीलिंग एकवचन संबंधसूचक प्रत्यय रात की ओर संकेत करता है; इसलिए इसे ‘नौ में से’ नहीं समझा गया।
- source_word: ታስዕተ እደ
  choice: नौवाँ भाग
  rationale: पाठ का आशय रात की लंबाई के नौवें अंश से है, जिसे अगले वाक्यांश में एक भाग कहा गया है।
- source_word: ክፍለ አሐደ
  choice: एक भाग
  rationale: दिन और रात के योजनाबद्ध विभाजन की तकनीकी भाषा को सुरक्षित रखता है।
- source_word: ወኮነት
  choice: तब ... हो जाता है
  rationale: घटने के बाद उत्पन्न परिणामी अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ፲ወ፪ተ ወአሐደ ክፍለ
  choice: ग्यारह भाग
  rationale: संदर्भ में यह रात की परिणामी लंबाई ग्यारह भाग बताता है।
- source_word: መዓልት
  choice: दिन
  rationale: रात के समकक्ष दिन की अवधि का सामान्य हिन्दी रूप।
- source_word: ሰብዓተ ክፍለ
  choice: सात भाग
  rationale: मूल की संख्यात्मक विभाजन-प्रणाली को ज्यों का त्यों रखता है।
theological_decisions:
- issue: खगोलीय विभाजन की शब्दावली
  choice: ‘भाग’ की तकनीकी शब्दावली बनाए रखना
  alternative: इसे ‘घंटे’ या आधुनिक अनुपातों में बदलना
  rationale: यह अंश दिन और रात की अपनी योजनाबद्ध माप-प्रणाली प्रस्तुत करता है; ‘भाग’ मूल की प्राचीन खगोलीय भाषा को बिना आधुनिक समय-मापन आरोपित किए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण शैली। ‘भाग’ को पुस्तक की खगोलीय तकनीकी शब्दावली के रूप में रखा गया है और पाठगत कठिनाई को मुख्य पाठ में अनावश्यक रूप से नहीं फैलाया गया।
