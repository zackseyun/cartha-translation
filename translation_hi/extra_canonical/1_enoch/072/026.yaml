base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/026.yaml
  text: And on that day the night increases and becomes nine parts[a], and the night becomes twelve parts and two parts exactly[d][c][b], and the day six parts.
translation:
  language: hi
  text: और उस दिन रात घटती है[a] और दिन के नौ भाग हो जाती है; और रात ठीक बारह भाग और दो भाग हो जाती है[b], और दिन छह भाग।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद की संख्यात्मक भाषा गीइज़ पाठ में कठिन है। यहाँ दिन और रात को भागों में मापने की एक योजनाबद्ध पद्धति दिखाई देती है, पर वाक्य-विन्यास और गणना असहज हैं; कुछ व्याख्याकार आसपास के संदर्भ के अनुसार संख्याओं को सामान्य रूप दे सकते हैं।
    reason: textual_variant
  - marker: b
    text: शाब्दिक रूप से संख्या-क्रम ‘बारह भाग और दो भाग’ है। इसे जोड़कर ‘चौदह भाग’ कहना संभव है, पर मूल पाठ दोनों संख्याओं को अलग-अलग रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: उस दिन
  rationale: यह सामान्य कालवाचक पदबंध है; संकेतवाचक बल और खगोलीय विवरण की पुनरावृत्त शैली दोनों सुरक्षित रहते हैं।
- source_word: ትነሡኅ ሌሊት
  choice: रात घटती है
  rationale: क्रिया कमी या घटाव बताती है। ‘घटती है’ आधुनिक हिन्दी में स्वाभाविक है और माप के संदर्भ के अनुकूल है।
- source_word: ፵ዕበታ ለማዓልት
  choice: दिन के नौ भाग
  rationale: पाठ में संख्या-चिह्न की व्याख्या कठिन है, पर ለማዓልት को ‘दिन के/दिन की तुलना में’ के रूप में रखते हुए भागों की तकनीकी भाषा सुरक्षित की गई है।
- source_word: ፲ወ፪ተ ወ፪እቲ
  choice: बारह भाग और दो भाग
  rationale: स्रोत अलग-अलग संख्याएँ प्रस्तुत करता है; कठिन अंकगणित को चुपचाप ‘चौदह’ में समेटने के बजाय दोनों को अलग रखा गया है।
- source_word: ክፍለ ጥንቅቀ
  choice: ठीक … भाग
  rationale: ጥንቅቀ माप की यथार्थता बताने वाला क्रियाविशेषण है; ‘ठीक’ हिन्दी में ‘exactly/precisely’ का सहज समतुल्य है।
- source_word: ማዓልት ስድስተ ክፍለ
  choice: दिन छह भाग
  rationale: मूल उपवाक्य संक्षिप्त और संभवतः अध्याहृत क्रिया वाला है; हिन्दी में भी उसकी संक्षिप्त गणनात्मक शैली रखी गई है।
theological_decisions:
- issue: खगोलीय गणना को संदर्भ के अनुसार सामंजस्यपूर्ण बनाना या प्राप्त कठिन पाठ को बनाए रखना
  choice: प्राप्त गीइज़ पाठ की असहज संख्या-श्रृंखला को न्यूनतम भाषा-सुधार के साथ बनाए रखना
  alternative: संदर्भ के आधार पर संख्याओं को सामान्यीकृत कर चौदह-भाग की रात अथवा किसी अन्य संगत गणना के रूप में प्रस्तुत करना
  rationale: यह मुख्यतः पाठालोचनात्मक और व्याख्यात्मक प्रश्न है। स्रोत-पाठ की प्रधानता तथा वास्तविक अनिश्चितता बनाए रखने के लिए संख्याओं को मौन रूप से सुधारा नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। मूल की संक्षिप्त खगोलीय गणना और उसकी वास्तविक असहजता सुरक्षित रखी गई है; ‘ठीक’ को संबंधित संख्या-वाक्यांश के स्वाभाविक हिन्दी स्थान पर रखा गया है।
