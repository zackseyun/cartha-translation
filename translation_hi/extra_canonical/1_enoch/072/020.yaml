base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/020.yaml
  text: On that day the day becomes equal with the night[a], [and it becomes even], and the night becomes nine parts[c][b], and the day also nine parts.
translation:
  language: hi
  text: उस दिन दिन रात के बराबर हो जाता है, [और वह समान हो जाता है][a]; और रात नौ भाग की हो जाती है[b][c], और दिन भी नौ भाग का हो जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘और वह समान हो जाता है’ उपवाक्य स्रोत-साक्ष्य में कोष्ठकों में है और संभवतः बाद में जोड़ा गया पाठ या अनिश्चित पाठ हो सकता है; इसलिए इसे हटाने के बजाय कोष्ठकों में रखा गया है।
    reason: textual_variant
  - marker: b
    text: यहाँ ‘भाग’ खगोलीय पुस्तक में प्रयुक्त योजनाबद्ध समय-विभाजन हैं, आधुनिक घड़ी के घंटे नहीं।
    reason: cultural_note
  - marker: c
    text: 'इसका अनुवाद यह भी हो सकता है: ‘और रात नौ भाग की होती है, और दिन भी नौ भाग का।’'
    reason: translation_alternative
lexical_decisions:
- source_word: በይእቲ፡ ዕለት
  choice: उस दिन
  rationale: यह समयसूचक संकेतवाचक पद है। ‘उस दिन’ आधुनिक हिन्दी में स्वाभाविक है और पद के पंचांग-संबंधी प्रसंग को बनाए रखता है।
- source_word: ይትዓረይ
  choice: बराबर हो जाता है
  rationale: क्रिया समान होने या बराबरी में आने का भाव देती है। यह अनुवाद खगोलीय माप के आशय को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: መዓልት፡ ምስለ፡ ሌሊት
  choice: दिन रात के बराबर
  rationale: मूल में दिन और रात की सीधी तुलना है; हिन्दी में संबंध को स्पष्ट करने के लिए ‘के बराबर’ स्वाभाविक है।
- source_word: '[ወይከውን፡ ዕሩየ፡]'
  choice: '[और वह समान हो जाता है]'
  rationale: स्रोत में यह उपवाक्य कोष्ठकों में और पाठ की दृष्टि से अनिश्चित है। इसलिए समानता का अर्थ रखते हुए इसे कोष्ठकों और पादटिप्पणी सहित पारदर्शी रूप से प्रस्तुत किया गया है।
- source_word: ተስዓተ፡ ክፍለ
  choice: नौ भाग
  rationale: यह खगोलीय पुस्तक में दिन और रात को मापने वाली योजनाबद्ध इकाइयों की तकनीकी भाषा है। ‘भाग’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: ወትከውን፡ ሌሊት ... ወመዓልት*ኒ
  choice: और रात नौ भाग की हो जाती है ... और दिन भी नौ भाग का
  rationale: ‘हो जाती है’ मूल की सूत्रात्मक ‘होना/हो जाना’ क्रिया को बनाए रखता है; ‘भी’ दिन और रात के समान माप को व्यक्त करता है।
theological_decisions:
- issue: दिन और रात की समानता का खगोलीय वर्णन
  choice: इसे योजनाबद्ध ‘भागों’ में दिन और रात की बराबरी के तकनीकी, पंचांग-संबंधी वर्णन के रूप में प्रस्तुत किया गया है।
  alternative: इसे ब्रह्मांडीय सामंजस्य का प्रतीकात्मक या आध्यात्मिक चित्र माना जा सकता था।
  rationale: ज्योतियों की पुस्तक के निकटवर्ती प्रसंग में भाषा खगोलीय और गणनात्मक है। इसलिए अनुवाद इसे आध्यात्मिक रूपक नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘दिन’ और ‘रात’ के अनुपात का तकनीकी स्वर सुरक्षित है। स्रोत में कोष्ठकबद्ध पाठ की अनिश्चितता को मुख्य पाठ और पादटिप्पणी दोनों में दिखाया गया है।
