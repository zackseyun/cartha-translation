base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/003.yaml
  text: And I saw six portals from which the sun rises[a], and six portals where the sun sets, and the moon rises and sets in those portals. And the leaders of the stars, together with those whom they lead, are six in the east and six in the west; and all of them, one after another, in exact order[c][b], with many windows to the right and to the left of those portals.
translation:
  language: hi
  text: और मैंने छह द्वार देखे, जिनसे सूर्य उदय होता है[a], और छह द्वार, जहाँ सूर्य अस्त होता है; और चन्द्रमा उन्हीं द्वारों में उदय और अस्त होता है। तारों के अगुवे, और वे भी जिनकी वे अगुवाई करते हैं, पूर्व में छह और पश्चिम में छह हैं। वे सभी ठीक क्रम से एक-दूसरे के पीछे हैं[b], और उन द्वारों के दाएँ और बाएँ बहुत-सी खिड़कियाँ हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ छह मुख्य ब्रह्मांडीय मार्गों के लिए एक शब्द इस्तेमाल करता है, जिसका अनुवाद यहाँ ‘द्वार’ किया गया है। पद के अन्त में एक दूसरा, कठिन पद आता है, जो सम्भवतः इनके पास के छोटे खुलावों या खिड़कियों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: पद का अन्तिम भाग पाठ और वाक्य-विन्यास की दृष्टि से कठिन है। सम्भावित अर्थ यह है कि ये द्वार उचित क्रम में हैं और उनके दाएँ-बाएँ अनेक गौण खुलाव हैं।
    reason: textual_difficulty
