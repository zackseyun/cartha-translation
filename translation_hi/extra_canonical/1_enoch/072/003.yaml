  choice: वे सभी ठीक क्रम से एक-दूसरे के पीछे हैं
  rationale: क्रमिक अनुक्रम और नियमित व्यवस्था, दोनों अर्थों को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: መላክወ ብዙኃት
  choice: बहुत-सी खिड़कियाँ
  rationale: कठिन पद को मुख्य द्वारों से भिन्न गौण खुलावों के रूप में प्रस्तुत किया गया है; अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: እምየማኑ ወእምፀጋሙ
  choice: दाएँ और बाएँ
  rationale: दोनों पार्श्वों का सीधा स्थानिक अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: क्या ‘तारों के अगुवों’ को स्पष्टतः स्वर्गदूत कहा जाए
  choice: मुख्य पाठ में तटस्थ रूप से ‘तारों के अगुवे’
  alternative: ‘तारों की अगुवाई करने वाले स्वर्गदूत’
  rationale: यह प्रसंग स्वर्गदूतीय शासन का संकेत दे सकता है, पर इस पद में गीज़ पाठ इन अगुवों के लिए स्पष्टतः ‘स्वर्गदूत’ शब्द नहीं रखता; इसलिए पहचान को अनिर्णीत रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध रखी गई है। ‘सूर्य उदय होता है’ और ‘अस्त होता है’ जैसे प्रचलित खगोलीय पद चुने गए हैं। ‘अगुवे’ स्रोत की सजीव नेतृत्व-छवि बनाए रखता है, जबकि उनकी सत्ता की प्रकृति को अनावश्यक रूप से निश्चित नहीं करता।
