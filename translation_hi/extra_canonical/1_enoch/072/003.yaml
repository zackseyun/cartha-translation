- source_word: ወወርኅ በውእቶን ኃዋኅወ ይሠርቅ ወየዓርብ
  choice: और चन्द्रमा उन्हीं द्वारों में उदय और अस्त होता है
  rationale: गीज़ के पृथक चन्द्रमा-विषयक उपवाक्य को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: መራኄሆሙ ለከዋክብት
  choice: तारों के अगुवे
  rationale: मार्गदर्शक या नेतृत्व करने वाली सत्ताओं का भाव बनाए रखता है, पर उन्हें मुख्य पाठ में स्पष्टतः स्वर्गदूत नहीं कहता।
- source_word: ምስለ እለ ይመርኅዎሙ
