  rationale: अगुवों और उनके द्वारा संचालित सत्ताओं या पिंडों के बीच संबंध को स्रोत के अनुसार खुला रखता है।
- source_word: ፮በጽባሕ ወ፮በምዕራብ
  choice: पूर्व में छह और पश्चिम में छह
