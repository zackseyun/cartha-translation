base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/008.yaml
  text: And when the sun rises from the sky[a], it goes out through that fourth gate for thirty mornings[c][b], and through the fourth gate in the west of the sky it goes down exactly.
translation:
  language: hi
  text: और जब सूर्य आकाश से उदय होता है, तब वह उस चौथे द्वार से तीस प्रभातों[a] तक बाहर निकलता है; और आकाश के पश्चिमी भाग के चौथे द्वार से वह ठीक सीध में[b] नीचे उतरता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ‘तीस दिन’ भी समझा जा सकता है; मूल गीइज़ में शाब्दिक रूप से ‘तीस प्रभात’ है, जिसका प्रयोग इस खगोलीय क्रम में समय की इकाई के रूप में हुआ है।
    reason: lexical_alternative
  - marker: b
    text: मूल शब्द का अर्थ ‘सीधे’, ‘सटीक रूप से’ या ‘सीधे मार्ग में’ हो सकता है; यहाँ यह समय की तात्कालिकता नहीं, दिशा की सटीकता बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ይሠርቅ
  choice: उदय होता है
  rationale: सूर्य के विषय में यह क्रिया उसके उदय होने को दर्शाती है; आधुनिक हिन्दी में यही स्वाभाविक और प्रसंगानुकूल अभिव्यक्ति है।
- source_word: ይወፅእ
  choice: बाहर निकलता है
  rationale: द्वार से निकलने की ठोस गतिशील छवि को बनाए रखता है, जो इस खगोलीय वर्णन के लिए महत्त्वपूर्ण है।
- source_word: ኆኅት
  choice: द्वार
  rationale: आकाशीय संरचना की मूल छवि को बिना उसकी प्रतीकात्मक या प्राकृतिक व्याख्या किए सुरक्षित रखता है।
- source_word: ሠላሳ ጽባሐ
  choice: तीस प्रभातों तक
  rationale: मूल में समय की इकाई के रूप में स्पष्टतः ‘तीस प्रभात’ हैं; हिन्दी में ‘प्रभात’ गरिमापूर्ण और बोधगम्य है।
- source_word: ምዕራበ ሰማይ
  choice: आकाश के पश्चिम में
  rationale: मूल की स्थान-संबंधी ब्रह्मांडीय अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ርቱዐ
  choice: ठीक सीध में
  rationale: यहाँ भाव तात्कालिकता का नहीं, बल्कि सीधी अथवा यथार्थ दिशा का है; यह रूप स्थानिक सटीकता को व्यक्त करता है।
- source_word: ይወርድ
  choice: नीचे उतरता है
  rationale: शाब्दिक अवरोहण की छवि को बनाए रखता है; केवल ‘अस्त होता है’ कहने से मूल की गति-संबंधी भाषा मंद पड़ जाती।
theological_decisions:
- issue: आकाशीय द्वारों की ब्रह्मांडीय छवि
  choice: द्वारों और सूर्य के बाहर निकलने तथा नीचे उतरने की भाषा को प्रत्यक्ष रूप में रखा गया है।
  alternative: इसे सामान्य सूर्योदय और सूर्यास्त का केवल दृश्यात्मक वर्णन मानकर सहज बनाना।
  rationale: यह खंड एक सुव्यवस्थित दर्शनीय ब्रह्मांड का वर्णन करता है। अनुवाद उस छवि को सुरक्षित रखता है और उसे किसी विशेष आधुनिक या संप्रदायगत ब्रह्मांड-विज्ञान में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली रखी गई है। ‘प्रभात’, ‘द्वार’ और ‘नीचे उतरता है’ मूल की ठोस खगोलीय छवियों को बनाए रखते हैं; कठिन स्थानिक क्रियाविशेषण को मुख्य पाठ में ‘ठीक सीध में’ और पादटिप्पणी में उसके विकल्पों सहित स्पष्ट किया गया है।
