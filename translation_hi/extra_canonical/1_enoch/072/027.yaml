base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/027.yaml
  text: And the sun completes its courses[a], and again it travels upon those courses; and it enters through that gate for thirty mornings[e][d][c][b], and in the west it sets opposite it.
translation:
  language: hi
  text: और सूर्य अपने मार्गों को पूरा करता है[a], और फिर उन्हीं मार्गों पर चलता है; वह तीस भोरों तक[b] उस द्वार से प्रवेश करता है, और पश्चिम में उसके सामने अस्त होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल शब्द बहुवचन है और शाब्दिक रूप से ‘उसके सिरों’ से संबंधित है; यहाँ इसका अर्थ सूर्य के निर्धारित ‘मार्ग’ या ‘पड़ाव’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘तीस भोरों तक’; आशय संभवतः उसी द्वार से दिखाई देने की तीस दिन की अवधि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ፈጸመ
  choice: पूरा करता है
  rationale: गीज़ में क्रिया पूर्ण करने का भाव देती है। यहाँ आसपास की अपूर्णकालिक क्रियाओं और नियमित खगोलीय क्रम के अनुरूप हिन्दी वर्तमान काल रखा गया है।
- source_word: አርእስቲሁ
  choice: अपने मार्गों
  rationale: यह बहुवचन रूप शाब्दिक रूप से सूर्य के ‘सिरों’ से संबंधित है, पर इस खगोलीय प्रसंग में उसके निर्धारित मार्गों या पड़ावों का संकेत देता है। बहुवचन को बनाए रखते हुए ‘मार्गों’ स्वाभाविक हिन्दी है।
- source_word: ዳግመ
  choice: फिर
  rationale: यह सूर्य की चक्रीय गति की पुनरावृत्ति व्यक्त करता है।
- source_word: የሐውር
  choice: चलता है
  rationale: सूर्य के अपने निर्धारित मार्गों पर आगे बढ़ने के लिए सरल और स्वाभाविक गति-सूचक क्रिया।
- source_word: ይበውእ
  choice: प्रवेश करता है
  rationale: आकाशीय द्वार में प्रवेश करने की मूल दृश्यात्मक भाषा सुरक्षित रखी गई है।
- source_word: ኆኅት
  choice: द्वार
  rationale: हनोक के खगोलीय दर्शन में आकाश के खुले मार्गों को ठोस रूप से ‘द्वार’ कहा गया है; इसे आधुनिक वैज्ञानिक शब्दावली में नहीं बदला गया।
- source_word: ሠላሳ ጸባሐ
  choice: तीस भोरों तक
  rationale: ጸባሐ का शाब्दिक अर्थ ‘भोर’ या ‘सुबह’ है। यह संभवतः तीस दिनों की दैनिक उपस्थितियों की गणना है, पर स्रोत की छवि बनाए रखी गई है।
- source_word: በምዕራብኒ
  choice: पश्चिम में
  rationale: सूर्य के अस्त होने की दिशा और स्थान को सीधे व्यक्त करता है।
- source_word: በመንጸሩ
  choice: उसके सामने
  rationale: प्रामाणिक पाठ का अर्थ प्रवेश-द्वार के सम्मुख या विपरीत दिशा में अस्त होना है। सर्वनाम का मूल संदर्भ बनाए रखा गया है।
- source_word: የዓርብ
  choice: अस्त होता है
  rationale: सूर्य के पश्चिम में उतरने के लिए प्रसंगानुकूल खगोलीय अभिव्यक्ति।
theological_decisions:
- issue: सूर्य का द्वारों और निर्धारित मार्गों से होकर चलना
  choice: द्वार और मार्ग की ठोस दर्शनीय भाषा बनाए रखना
  alternative: इसे आधुनिक खगोल-विज्ञान की अमूर्त भाषा में ढालना
  rationale: यह अंश एक व्यवस्थित दर्शनीय ब्रह्मांड-वर्णन प्रस्तुत करता है। अनुवाद उसकी अपनी विश्व-छवि को सुरक्षित रखता है और उसे आधुनिक वैज्ञानिक मॉडल के अनुसार पुनर्व्याख्यायित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दृश्यात्मक शैली रखी गई है। वाक्य की पुनरावृत्त संरचना तथा ‘द्वार’, ‘भोर’ और ‘अस्त होना’ जैसी ब्रह्मांडीय छवियाँ सुरक्षित हैं; कठिन बहुवचन አርእስቲሁ की अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
