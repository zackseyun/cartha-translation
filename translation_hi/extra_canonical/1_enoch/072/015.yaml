base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/015.yaml
  text: And the sun rises so that the day grows shorter and the night lengthens[a], and the sun returns to the east and enters into the sixth gate[c][b], and rises from it and sets for thirty mornings.
translation:
  language: hi
  text: और सूर्य उदय होता है, जिससे दिन छोटा होता जाता है और रात लंबी होती जाती है। फिर सूर्य पूर्व की ओर[a] लौटता है और छठे द्वार[b] में प्रवेश करता है; वह वहीं से उदय होता है और तीस भोरों तक अस्त होता है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल अभिव्यक्ति का शाब्दिक भाव ‘प्रभात की ओर’ है; यहाँ वह सूर्योदय की दिशा, अर्थात पूर्व, को सूचित करती है।
    reason: translation_note
  - marker: b
    text: खगोलीय पुस्तक में ‘द्वार’ सूर्य के मार्ग की वास्तविक संरचनाओं के रूप में वर्णित हैं; यहाँ इस शब्द को केवल ऋतुओं का रूपक नहीं बनाया गया है।
    reason: cultural_note
  - marker: c
    text: अंतिम वाक्यांश का पाठ कठिन है। ‘तीस भोरों’ से संभवतः उस द्वार से होकर सूर्य की गति का तीस दिन का चरण अभिप्रेत है।
    reason: textual_variant
lexical_decisions:
- source_word: ይትነሣእ
  choice: उदय होता है
  rationale: यह क्रिया सूर्य के ऊपर आने या निकलने को दर्शाती है; ‘उदय होता है’ आधुनिक हिन्दी में स्वाभाविक है और खगोलीय आशय बनाए रखती है।
- source_word: ትሕጽር ዕለት
  choice: दिन छोटा होता जाता है
  rationale: यह ऋतु के क्रम में दिन के प्रकाशकाल के घटने को व्यक्त करता है; क्रमिक परिवर्तन दिखाने के लिए ‘होता जाता है’ चुना गया है।
- source_word: ትኑኅ ሌሊት
  choice: रात लंबी होती जाती है
  rationale: यह पिछले वाक्यांश के समानांतर रात की बढ़ती अवधि को स्पष्ट और संतुलित ढंग से व्यक्त करता है।
- source_word: ይገብእ
  choice: लौटता है
  rationale: यहाँ क्रिया का अर्थ ‘लौटना’ है, न कि ‘प्रवेश करना’; प्रवेश के लिए अगले ही खंड में अलग क्रिया ይበውእ आई है।
- source_word: በጽባሕ
  choice: पूर्व की ओर
  rationale: शाब्दिक रूप से यह ‘प्रभात की ओर’ हो सकता है, पर इस खगोलीय भूगोल में प्रभात/सूर्योदय की दिशा पूर्व है। स्थानगत गति को व्यक्त करने के लिए ‘पूर्व की ओर’ चुना गया है, और भाषिक रूपक को पादटिप्पणी में रखा गया है।
- source_word: ይበውእ
  choice: प्रवेश करता है
  rationale: यह द्वार के भीतर जाने की ठोस गति बताता है और पूर्ववर्ती ‘लौटता है’ से क्रियात्मक भेद बनाए रखता है।
- source_word: ሳድስት ኆኅት
  choice: छठा द्वार
  rationale: खगोलीय पुस्तक में सूर्य के मार्ग के लिए द्वारों की सुव्यवस्थित कल्पना है; ‘द्वार’ उस ठोस दृश्य को बिना रूपक में घटाए सुरक्षित रखता है।
- source_word: ይሠርቅ እምኔሃ
  choice: वह वहीं से उदय होता है
  rationale: यह सूर्य के उसी द्वार से निकलने या उदित होने को दर्शाता है; ‘वहीं से’ स्त्रीलिंग स्रोत-सर्वनाम का हिन्दी में स्वाभाविक संदर्भ देता है।
- source_word: የዓርብ ሠላሳ ጽባሐ
  choice: तीस भोरों तक अस्त होता है
  rationale: पाठ सूर्य के अस्त होने और ‘तीस भोर’ की गणना को जोड़ता है। हिन्दी में कुछ असामान्य लगने पर भी ‘भोरों’ स्रोत की गणना को ‘दिनों’ में चुपचाप नहीं बदलता; कठिनाई पादटिप्पणी में स्पष्ट की गई है।
theological_decisions:
- issue: खगोलीय द्वारों का स्वरूप
  choice: द्वारों को दर्शन-जगत की ठोस संरचना के रूप में बनाए रखा गया है
  alternative: इसे केवल ऋतुओं या सूर्य की स्थितियों का आधुनिक रूपक बनाना
  rationale: मूल पाठ सचमुच द्वार में प्रवेश करने और उससे उदय होने की भाषा इस्तेमाल करता है। इसे आधुनिक वैज्ञानिक व्याख्या में बदलना पाठ की प्राचीन ब्रह्मांड-कल्पना और उसके तनाव को मिटा देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर प्राचीन खगोलीय दर्शन की ठोस शब्दावली और पुनरुक्त गति को बनाए रखा गया है। ‘तीस भोरों’ जानबूझकर कुछ शाब्दिक रखा गया है, क्योंकि सहज ‘तीस दिनों’ से मूल की वास्तविक शब्दावली और पाठगत कठिनाई छिप जाती।
