base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/032.yaml
  text: On that day the night decreases and becomes nine parts[a], and the day becomes nine parts, and the night equals the day[b], and the year becomes exact.
translation:
  language: hi
  text: उस दिन रात घटती है और नौ भाग की हो जाती है[a], और दिन भी नौ भाग का हो जाता है। रात दिन के बराबर हो जाती है, और वर्ष का माप ठीक हो जाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘नौ भाग’ की पुनरावृत्ति ग्रंथ की उस खगोलीय व्यवस्था को दर्शाती है जिसमें दिन और रात को गिने हुए भागों में बाँटा गया है।
    reason: cultural_note
  - marker: b
    text: इसका अनुवाद ‘वर्ष सटीक हो जाता है’ या ‘वर्ष पूरा हो जाता है’ भी किया जा सकता है; मूल गीइज़ शब्द सटीकता और पूर्णता—दोनों का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: በይእቲ፡ ዕለት
  choice: उस दिन
  rationale: यह कालवाचक संकेत सूर्य-चक्र के एक निश्चित दिन की ओर इशारा करता है; ‘उस दिन’ आधुनिक हिन्दी में स्वाभाविक और स्रोत के निकट है।
- source_word: ትኃፅፅ፡ ሌሊት
  choice: रात घटकर
  rationale: क्रिया में घटने या कम होने का मापनीय भाव है; ‘घटकर’ खगोलीय संदर्भ में संक्षिप्त और स्पष्ट है।
- source_word: ትስዓተ፡ ክፍለ
  choice: नौ भाग
  rationale: इस ग्रंथ की खगोलीय व्यवस्था में दिन और रात को गिने हुए भागों में बाँटा गया है; ‘भाग’ इस तकनीकी योजना को सरलता से व्यक्त करता है।
- source_word: ይትዓረይ፡ ሌሊት፡ ምስለ፡ ማዓልት
  choice: रात दिन के बराबर हो जाती है
  rationale: यह वाक्यांश रात और दिन की समानता बताता है; चुना हुआ रूप उस संतुलन को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: ዓመት፡ ጥንቅቀ
  choice: वर्ष सटीक हो जाता है
  rationale: ጥንቅቀ में सटीकता, ठीक गणना या पूर्णता का अर्थ हो सकता है। मुख्य पाठ में ‘सटीक’ कैलेंडरी संदर्भ को रखता है, जबकि अर्थ की दूसरी संभावनाएँ पादटिप्पणी में दी गई हैं।
theological_decisions:
- issue: दिन और रात की बराबरी से जुड़ा कैलेंडरी कथन
  choice: इसे दिन और रात के माप तथा वर्ष की शुद्ध गणना से संबंधित खगोलीय कथन के रूप में प्रस्तुत किया गया है।
  alternative: इसे ब्रह्मांडीय सिद्धता या किसी धार्मिक अनुष्ठान का प्रतीक मानना।
  rationale: आस-पास का प्रसंग सूर्य की गतियों और दिन-रात के गिने हुए भागों का तकनीकी वर्णन करता है; इसलिए बाद की प्रतीकात्मक या सम्प्रदायगत व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और हल्का तकनीकी रूप अपनाया गया है। ‘नौ भाग’ जैसी ग्रंथ-विशिष्ट गणना को सरल नहीं किया गया, और अंतिम पद की वास्तविक शब्दार्थगत अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
