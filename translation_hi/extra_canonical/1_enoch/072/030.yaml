  yaml_path: translation/extra_canonical/1_enoch/072/030.yaml
  text: And on that day the night is shortened from its length[a], and the night becomes ten parts[b], and the day eight parts.
translation:
  language: hi
  text: और उस दिन रात अपनी अवधि से घट जाती है[a]; रात दस भाग की और दिन आठ भाग का हो जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ दिन और रात को गिने हुए ‘भागों’ में बाँटने की खगोलीय पुस्तक की सांकेतिक पद्धति प्रयुक्त हुई है। इससे घड़ी के घंटों के बजाय ऋतुओं के अनुसार दिन-रात की अवधि में होने वाला परिवर्तन बताया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: उस दिन
  rationale: यह कालवाचक संकेतवाचक पदबंध है; ‘उस दिन’ स्वाभाविक हिन्दी में उसके संकेतात्मक बल को बनाए रखता है।
- source_word: ተኃጽጸ ሌሊት
  choice: रात ... घट जाती है
  rationale: क्रिया घटाए जाने या कम होने का भाव देती है; ऋतु के अनुसार रात की अवधि बदलने के खगोलीय प्रसंग में ‘घट जाती है’ सहज है।
- source_word: እምኑኃ
  choice: अपनी अवधि से
  rationale: यह उस माप या विस्तार की ओर संकेत करता है जिसमें रात घटती है; कालगत प्रसंग में ‘अवधि’ स्पष्ट और स्वाभाविक है।
- source_word: ትከውን ሌሊት ፲ወ፪ተ ክፍለ
  choice: रात दस भाग की ... हो जाती है
  rationale: दिए हुए लिप्यंतरण में बारह का पाठ दिखता है, किंतु नवीन स्रोत-समीक्षा और अध्याय की अठारह-भाग वाली गणना दस का पाठ समर्थित करती है; दिन के आठ भाग के साथ कुल अठारह बनते हैं।
- source_word: ማዓልት ፰ ክፍለ
  choice: दिन आठ भाग का
  rationale: मूल में रात और दिन के मापों का संक्षिप्त विरोध है; हिन्दी में ‘आठ भाग का’ निहित अस्तित्ववाचक क्रिया के साथ इस शैली को बनाए रखता है।
