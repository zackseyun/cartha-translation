base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/013.yaml
  text: And it enters at dawn and goes out through the sixth[a], and it goes out and sets in the sixth gate for thirty-two mornings[d][c][b], according to its sign.
translation:
  language: hi
  text: और वह भोर में प्रवेश करता है और छठे (द्वार) में निकलता है[a]; फिर वह बत्तीस भोरों तक[b] छठे द्वार में निकलता और अस्त होता है—अपने चिह्न के कारण[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘छठा’ इस अध्याय में वर्णित क्रम का छठा द्वार या मुख होने का संकेत देता है। मूल पाठ संक्षिप्त है; इसका अनुवाद ‘छठे में’ या ‘छठे के भीतर’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘बत्तीस भोरें’। मूल अवधि को ‘दिनों’ के बजाय भोरों से गिनता है।
    reason: lexical_alternative
  - marker: c
    text: इसका अनुवाद ‘अपने चिह्न के विषय में’ या, अधिक व्याख्यात्मक रूप में, ‘अपने चिह्न के अनुसार’ भी किया जा सकता है। गीइज़ संबंधबोधक पद मुख्यतः कारण या संबंध का भाव दे सकता है।
    reason: source_ambiguity
lexical_decisions:
- source_word: ይገብእ
  choice: प्रवेश करता है
  rationale: क्रिया के ठोस गति-बोध को बनाए रखा गया है; इसे आधुनिक खगोलीय भाषा में सहज बनाकर मूल की द्वार-कल्पना को मिटाया नहीं गया।
- source_word: ጽባሐ
  choice: भोर के समय
  rationale: यह शब्द सुबह अथवा उषाकाल को सूचित करता है। ‘भोर के समय’ आधुनिक हिन्दी में स्वाभाविक रहते हुए समय-संबंधी बल को सुरक्षित रखता है।
- source_word: ይወፅእ
  choice: निकलता है
  rationale: मूल में यह क्रिया दो बार आती है। तकनीकी और पुनरुक्त शैली को बचाने के लिए दोनों occurrences का अनुवाद किया गया है।
- source_word: ውስተ ሳድስት
  choice: छठे से निकलता है
  rationale: ‘छठा’ यहाँ अध्याय के क्रम में छठे द्वार या मुख का लोपसूचक उल्लेख है। हिन्दी में गति की स्वाभाविक अभिव्यक्ति के लिए ‘से निकलता है’ रखा गया, जबकि संज्ञा की पूर्ति पादटिप्पणी में स्पष्ट की गई है।
- source_word: የዓርብ
  choice: अस्त होता है
  rationale: खगोलीय प्रसंग में उतरने की अपेक्षा सूर्य के अस्त होने का अर्थ अधिक उपयुक्त है।
- source_word: ኆኅት
  choice: द्वार
  rationale: प्रकाशमान पिंडों की इस अपोकैलिप्टिक ब्रह्मांड-रचना में ठोस ‘द्वार’ की छवि को आधुनिक खगोलीय क्षेत्र या स्थान में नहीं बदला गया।
- source_word: ሠላሳ ወ፪ ጽባሕ
  choice: बत्तीस भोरों तक
  rationale: मूल स्पष्ट रूप से ‘भोरों’ की गणना करता है। ‘दिन’ कहकर सामान्यीकृत करने के बजाय वही गणना-पद्धति रखी गई है।
- source_word: በእነተ ትእምርተ ዚአሃ
  choice: अपने चिह्न के अनुसार
  rationale: यह पाठ्यक्रम से जुड़े चिह्न या नियत संकेत की ओर इशारा कर सकता है। उपसर्गीय वाक्यांश में कारण अथवा विषय-संबंध का अर्थ भी संभव है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: आकाशीय द्वारों की अपोकैलिप्टिक छवि
  choice: ‘द्वार’ की ठोस ब्रह्मांडीय छवि बनाए रखी गई।
  alternative: इसे ‘क्षेत्र’, ‘स्थान’ या आधुनिक खगोलीय दिशा के रूप में समझाना।
  rationale: दृष्टिपरक ब्रह्मांड-वर्णन को आधुनिक वैज्ञानिक भाषा में बदलना मूल की साहित्यिक और धर्मवैचारिक तनावशीलता को समतल कर देता।
- issue: चिह्न और अवधि के बीच संबंध
  choice: मुख्य पाठ में ‘अपने चिह्न के अनुसार’ रखा गया।
  alternative: ‘अपने चिह्न के कारण’ अथवा ‘अपने चिह्न के विषय में’।
  rationale: በእነተ कारण या संबंध भी व्यक्त कर सकता है, जबकि प्रसंग में नियत क्रम के अनुरूपता का अर्थ संभव है। इस अनिश्चितता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए सुबोध रखी गई है। मूल की पुनरुक्त गति-क्रियाएँ तथा आकाशीय द्वारों की ठोस छवि जानबूझकर सुरक्षित रखी गई हैं; अस्पष्ट स्थान-संबंध और अंतिम संबंधबोधक वाक्यांश को पादटिप्पणियों में खुला रखा गया है।
