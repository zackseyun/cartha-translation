base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/002.yaml
  text: 'And this is the first law of the luminaries: the sun, a light, has its rising in the portals of heaven on the east, and its setting in the western portals of heaven.'
translation:
  language: hi
  text: 'और ज्योतियों की पहली व्यवस्था[a] यह है: सूर्य, जो एक ज्योति है, पूर्व दिशा में आकाश के द्वारों[b] से उदय[c] होता है और पश्चिम दिशा में आकाश के द्वारों में अस्त होता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नियम’ अथवा ‘विधान’। मूल शब्द आकाशीय ज्योतियों को नियंत्रित करने वाले निर्धारित क्रम को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: मूल में ‘भोर की दिशा में आकाश के द्वारों … पश्चिम के आकाश के द्वारों’ जैसा दिशात्मक वर्णन है।
    reason: lexical_alternative
  - marker: c
    text: प्रयुक्त प्रतिलिपि में इस स्थान का शब्द त्रुटिपूर्ण रूप में आया है; चार्ल्स के मुद्रित गीइज़ पाठ और समानांतर वाक्य-विन्यास के अनुसार अर्थ ‘उसका उदय’ है, न कि ‘प्रवेश करता है’।
    reason: textual_variant
lexical_decisions:
- source_word: ትእዛዝ
  choice: व्यवस्था
  rationale: यहाँ शब्द मनुष्यों को दी गई किसी आज्ञा के बजाय आकाशीय पिंडों के लिए निर्धारित स्थिर क्रम को बताता है। ‘व्यवस्था’ इस अर्थ को सहज हिन्दी में व्यक्त करती है और ‘नियम’ की तुलना में प्रसंग की गरिमा भी बनाए रखती है।
- source_word: ቀዳማዊ
  choice: पहली
  rationale: यह खगोलीय व्यवस्थाओं की क्रमबद्ध शृंखला की आरम्भिक व्यवस्था है।
- source_word: ብርሃናት
  choice: ज्योतियों
  rationale: यह बहुवचन आकाशीय प्रकाश-पिंडों को सूचित करता है; ‘ज्योतियाँ’ ऊँचे खगोलीय-अपोकैलिप्टिक भाव को बनाए रखते हुए आधुनिक हिन्दी में बोधगम्य है।
- source_word: ፀሐይ
  choice: सूर्य
  rationale: संदर्भित आकाशीय पिंड का सीधा और स्वाभाविक हिन्दी नाम।
- source_word: ብርሃን
  choice: एक ज्योति
  rationale: सूर्य के साथ समानाधिकरण में आए संज्ञात्मक कथन को सुरक्षित रखता है।
- source_word: ኃዋኅወ
  choice: द्वारों
  rationale: ये वे संरचित आकाशीय मार्ग हैं जिनसे सूर्य गुजरता है। ‘द्वार’ हिन्दी में इस ब्रह्मांडीय बिंब को स्वाभाविक रूप से बनाए रखता है।
- source_word: መንገለ ጽባሕ
  choice: पूर्व दिशा में
  rationale: शाब्दिक रूप से भोर की दिशा का संकेत है; ‘पूर्व दिशा में’ दिशात्मक अर्थ को स्पष्ट करता है।
- source_word: ወምዕራቢሁ
  choice: और … अस्त होता है
  rationale: समानांतर नामवाचक विन्यास सूर्य के पश्चिमी अस्त को दर्शाता है; इससे उदय और अस्त का खगोलीय क्रम सुरक्षित रहता है।
- source_word: ዘምዕራብ
  choice: पश्चिम दिशा में
  rationale: पूर्व दिशा के साथ स्पष्ट दिशात्मक समानांतरता बनाए रखता है।
theological_decisions:
- issue: ब्रह्मांडीय व्यवस्था की प्रकृति
  choice: ትእዛዝ का अनुवाद ‘व्यवस्था’
  alternative: ‘आज्ञा’, ‘नियम’ या ‘विधान’
  rationale: पद सृष्टि के स्थापित खगोलीय क्रम का वर्णन करता है, मनुष्यों को संबोधित नैतिक आदेश का नहीं। ‘व्यवस्था’ किसी विशेष सम्प्रदायगत अर्थ को जोड़े बिना इस तनाव और स्थानीय अर्थ को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘ज्योतियाँ’ और ‘आकाश के द्वार’ मूल के खगोलीय तथा दर्शनात्मक बिंब को बनाए रखते हैं; वाक्य में सूर्य के पूर्व में उदय और पश्चिम में अस्त होने की समानांतर संरचना सुरक्षित है।
