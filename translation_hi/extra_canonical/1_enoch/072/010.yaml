base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/010.yaml
  text: On that day the day becomes longer than the night by a ninth part[a], and the day becomes exactly ten parts[c][b], and the night becomes exactly eight parts.
translation:
  language: hi
  text: उस दिन, दिन रात से एक नौवें भाग अधिक लंबा हो जाता है[a]; दिन ठीक दस भाग का हो जाता है और रात ठीक आठ भाग की हो जाती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अधिक लंबा हो जाता है’ के बाद इथियोपिक पाठ में एक कठिन और संदिग्ध शब्द है, जिसका अर्थ संभवतः ‘फिर’ या ‘दूसरी बार’ हो सकता है। इसके बिना भी वाक्य का मुख्य आशय स्पष्ट है।
    reason: textual_variant
  - marker: b
    text: ये ‘भाग’ इस अध्याय में दिन और रात की सापेक्ष लंबाई मापने के पारंपरिक विभाजन हैं। दिन के दस और रात के आठ भाग मिलकर अठारह भाग होते हैं; उनका दो भाग का अंतर कुल का नौवाँ भाग है।
    reason: cultural_note
lexical_decisions:
- source_word: በውእቱ፡ ዕለት፡
  choice: उस दिन
  rationale: यह काल-सूचक पद सूर्य के वार्षिक चक्र के एक निश्चित दिन की ओर संकेत करता है; ‘उस दिन’ स्वाभाविक हिन्दी में इसके संकेतवाचक बल को बनाए रखता है।
- source_word: ትነኍኅ፡ … እምሌሊት፡
  choice: रात से … अधिक लंबा हो जाता है
  rationale: क्रिया लंबाई बढ़ने या अधिक लंबा होने को व्यक्त करती है और पूर्वसर्ग इस संदर्भ में तुलना दिखाता है।
- source_word: ታስዕተ፡ እደ፡
  choice: नौवें भाग के बराबर
  rationale: यहाँ अर्थ ‘नौ भाग’ नहीं, बल्कि ‘एक नौवाँ भाग’ है। अध्याय की अठारह-भाग वाली गणना में दस और आठ भाग का अंतर कुल का नौवाँ भाग है।
- source_word: ጥንቁቀ፡
  choice: ठीक
  rationale: यह पद सटीक गणना पर बल देता है और दिन तथा रात, दोनों के माप पर लागू होता है।
- source_word: ዓሠርተ፡ ክፍለ፡ / ስመንተ፡ ክፍለ፡
  choice: दस भाग / आठ भाग
  rationale: ክፍል विभाजन या भाग को दर्शाता है; एक ही तकनीकी शब्द के लिए ‘भाग’ सरल और सुसंगत है।
- source_word: '[ካዕበተ፡]'
  choice: मुख्य पाठ में अलग से अनूदित नहीं
  rationale: कोष्ठक में दिया गया पाठ संदिग्ध है और संभवतः ‘फिर’ या ‘दूसरी बार’ का भाव देता है; सुनिश्चित वाक्य-विन्यास के अर्थ के लिए यह आवश्यक नहीं है, इसलिए अनिश्चितता पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: संख्यात्मक भाषा का स्वरूप
  choice: संख्याओं को दिन और रात की तकनीकी खगोलीय गणना के रूप में प्रस्तुत किया गया है।
  alternative: इन्हें प्रतीकात्मक प्रलय-संबंधी अंक या ऋतु-परिवर्तन का ढीला मुहावरा मानना।
  rationale: अध्याय 72 के संदर्भ में सूर्य की गति और दिन-रात की बदलती लंबाई मापकर बताई जाती है; इसलिए पाठ की प्राचीन ब्रह्मांड-दृष्टि को सुधारे या प्रतीकात्मक बनाए बिना उसकी गणनात्मक भाषा सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और गणनात्मक शैली रखी गई है। ‘ठीक’ को दोनों संख्यात्मक कथनों पर स्पष्ट रूप से लागू किया गया है; संदिग्ध कोष्ठकीय पाठ को चुपचाप अर्थ देने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
