base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/004.yaml
  text: And first a great light comes forth[a], whose name is the sun, and its disk is like the disk of heaven[c][b], and it is wholly full of fire that gives light and heat.
translation:
  language: hi
  text: और सबसे पहले एक महान ज्योति निकलती है, जिसका नाम सूर्य है; उसका मंडल आकाश के मंडल के समान है[a], और वह पूरी तरह ऐसी आग से भरा है जो प्रकाश देती और गरम करती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसका गोला आकाश के गोले के समान है” अथवा “उसका चक्र आकाश के चक्र के समान है।” गीइज़ शब्द गोल रूप, घेरा, चक्र या परिधि का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम शब्द-युग्म का अनुवाद “जो चमकती और जलाती है” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ቀዳማዊ፡ ይወፅእ፡ ብርሃን፡ ዓቢይ
  choice: पहले एक महान ज्योति निकलती है
  rationale: ‘पहले’ को क्रमसूचक क्रियाविशेषण मानते हुए ‘एक महान ज्योति’ को क्रिया का कर्ता रखा गया है; इससे गीइज़ वाक्य-विन्यास और हाल की स्रोत-समीक्षा दोनों सुरक्षित रहते हैं।
- source_word: ዘስሙ፡ ፀሐይ
  choice: जिसका नाम सूर्य है
  rationale: नामकरण-सूत्र को सीधे रूप में रखता है और सूर्य को केवल आधुनिक वैज्ञानिक शब्दावली में सीमित नहीं करता।
- source_word: ክበቡ፡ ከመ፡ ክበበ፡ ሰማይ
  choice: उसका मंडल आकाश के मंडल के समान है
  rationale: दोनों स्थानों पर एक ही मूल से बने शब्द की पुनरावृत्ति को ‘मंडल’ द्वारा सुरक्षित रखा गया है। यह गोल आकार, चक्र या परिधि की वास्तविक अर्थ-संभावना को ‘चकती’ की अपेक्षा अधिक खुला छोड़ता है।
- source_word: ወኵሉ፡ ምሉእ
  choice: पूरी तरह ... से भरा है
  rationale: समग्रता पर दिए गए दोहरे बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: እሳት፡ ዘያበርህ፡ ወያውዒ
  choice: ऐसी आग ... जो प्रकाश देती और गरम करती है
  rationale: आग की मूल छवि बनाए रखते हुए दोनों क्रियाओं के प्रभाव—प्रकाश और ताप—को स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: सूर्य के वर्णन का स्वरूप
  choice: सूर्य को अग्निमय प्रकाश से युक्त सृष्टिगत महान ज्योति के रूप में वर्णित किया गया है।
  alternative: नामकरण की भाषा को अधिक प्रबल मानवीकरण के रूप में प्रस्तुत करना।
  rationale: दृष्टिपरक खगोलीय कल्पना और नामकरण सुरक्षित रखे गए हैं, पर पाठ में देवत्व न होने के कारण उसे देवता नहीं बनाया गया।
- issue: ‘आकाश के मंडल’ की छवि
  choice: असामान्य ब्रह्मांडीय उपमा को यथावत रखा गया है।
  alternative: इसे सरल करके ‘आकाश जैसा गोल’ कहना।
  rationale: सरलीकरण मूल के दोहराए हुए ‘मंडल’ और उसकी संभावित ब्रह्मांड-दृष्टि को मिटा देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ज्योति’ और ‘मंडल’ अपोकैलिप्टिक-खगोलीय शैली को बनाए रखते हैं; वाक्य को आधुनिक वैज्ञानिक विवरण में समतल नहीं किया गया।
