base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/025.yaml
  text: And on that day the sun comes out from that second gate[a], and sets in the west at the second gate, and returns to the east at the first gate for thirty-one mornings[d][c][b], and sets at the first gate in the west of heaven.
translation:
  language: hi
  text: और उस दिन सूर्य उस दूसरे द्वार से निकलता है और पश्चिम में दूसरे द्वार पर अस्त होता है। फिर वह पूर्व में पहले द्वार[b] पर इकतीस भोरों[a] तक लौटता है, और आकाश के पश्चिम में पहले द्वार पर अस्त होता है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘इकतीस भोर’; इस ज्योतिर्गणना में भोरों की गिनती दिनों की अवधि बताती है।
    reason: cultural_note
  - marker: b
    text: मूल शब्द का शाब्दिक रूप ‘एक द्वार’ भी हो सकता है, पर द्वारों के क्रम के कारण यहाँ ‘पहला द्वार’ समझना अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: c
    text: मूल गीइज़ वाक्य में अस्त होने और लौटने का क्रम इसी पुनरावृत्त ढंग से दिया गया है; यह संभवतः सूर्य की आकाशीय द्वारों के बीच चरणबद्ध गति को दर्शाता है।
    reason: textual_note
lexical_decisions:
- source_word: ይወፅእ
  choice: निकलता है
  rationale: सूर्य के द्वार से बाहर आने की ठोस गति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ኆኅት
  choice: द्वार
  rationale: खगोलीय व्यवस्था में आकाश के स्थिर खुले मार्गों की मूल कल्पना को सुरक्षित रखता है; ‘खिड़की’ या ‘मार्ग’ की अपेक्षा अधिक सटीक है।
- source_word: ያዓርብ
  choice: अस्त होता है
  rationale: सूर्य और पश्चिम के प्रसंग में क्रिया का स्वाभाविक खगोलीय अर्थ यही है।
- source_word: ይገብእ
  choice: लौटता है
  rationale: क्रिया का मूल अर्थ भीतर आना या प्रवेश करना हो सकता है, पर इस चक्रीय क्रम में सूर्य के फिर पूर्व में पहुँचने का भाव प्रमुख है।
- source_word: በአሐቲ ኆኅት
  choice: पहले द्वार पर
  rationale: द्वारों के क्रमिक वर्णन में स्त्रीलिंग ‘एक’ क्रमसूचक ‘पहला’ का कार्य करता है; सम्बन्धबोधक उपसर्ग को प्रसंगानुसार ‘पर’ से व्यक्त किया गया है।
- source_word: ሠላሳ ወ፩ ጸባሐ
  choice: इकतीस भोरों तक
  rationale: ጸባሐ का शाब्दिक चित्र ‘भोर’ है और यहाँ भोरों द्वारा दिनों की गणना होती है; ‘दिनों’ कहकर मूल बिंब को सामान्यीकृत नहीं किया गया।
- source_word: ምዕራበ ሰማይ
  choice: आकाश के पश्चिम में
  rationale: यह वाक्यांश खगोलीय आकाश और उसके द्वारों की दिशा बताता है; आधुनिक हिन्दी में ‘आकाश’ इस दृश्य को ‘स्वर्ग’ से अधिक स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: आकाशीय द्वारों की विश्व-रचना
  choice: द्वारों की ठोस खगोलीय छवि को ज्यों का त्यों रखा गया
  alternative: इसे केवल दिशाओं या क्षितिज के रूपक के रूप में समझाकर अनुवाद करना
  rationale: मूल पाठ स्वयं आकाशीय संरचना का चित्र प्रस्तुत करता है; अनुवाद को उसकी वास्तविकता या रूपकात्मकता पर कोई धार्मिक निर्णय नहीं थोपना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वर्तमानकालीन क्रियाएँ मूल के वर्णनात्मक खगोलीय क्रम को बनाए रखती हैं। ‘भोरों’ और ‘द्वार’ जैसे शब्द मूल की सांस्कृतिक तथा ब्रह्मांड-विषयक छवियों को सुरक्षित रखते हैं।
