base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/031.yaml
  text: And on that day the sun goes out from that gate and sets in the west[a], and returns to the east and rises through the third gate for thirty-one mornings[b], and sets in the west of heaven.
translation:
  language: hi
  text: और उस दिन सूर्य उस फाटक से निकलता है और पश्चिम में अस्त होता है; फिर वह पूर्व की ओर लौटता है[a] और तीसरे फाटक से इकतीस भोरों[b] तक उदय होता है, और आकाश के पश्चिम में अस्त होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ क्रिया का अर्थ ‘प्रवेश करता है’ या ‘लौटता है’ हो सकता है। यहाँ सूर्य की चक्रीय गति और अगले उदय के लिए पूर्व की ओर जाने के क्रम के कारण ‘लौटता है’ चुना गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘इकतीस भोर’। पाठ लगातार आने वाली भोरों के अनुसार इस अवधि की गणना करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወፅእ
  choice: निकलता है
  rationale: फाटक से सूर्य के बाहर आने की ठोस गतिशील छवि को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: ኆኅት
  choice: फाटक
  rationale: खगोलीय पुस्तक में यह आकाश के निश्चित द्वारों की स्थापत्यात्मक ब्रह्मांडीय छवि को सुरक्षित रखता है।
- source_word: የዓርብ
  choice: अस्त होता है
  rationale: सूर्य की दैनिक गति के प्रसंग में यह स्वाभाविक खगोलीय अर्थ है और पद में इसकी पुनरावृत्ति को स्पष्ट रखता है।
- source_word: ይገብእ
  choice: लौटता है
  rationale: क्रिया का मूल अर्थ ‘प्रवेश करता है’ भी हो सकता है, पर अस्त होने के बाद अगले उदय के लिए पूर्व की ओर चक्रीय गति के संदर्भ में ‘लौटता है’ अर्थ को सुबोध बनाता है; विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: በምስራቅ
  choice: पूर्व की ओर
  rationale: अस्त होने के बाद पूर्व दिशा की ओर गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ይሠርቅ
  choice: उदय होता है
  rationale: सूर्य के संदर्भ में यह मानक आधुनिक हिन्दी खगोलीय अभिव्यक्ति है।
- source_word: በሣልስት ኆኅት
  choice: तीसरे फाटक से
  rationale: सूर्योदय के लिए प्रयुक्त आकाशीय द्वार से होकर आने की धारणा को संक्षिप्त और स्वाभाविक रूप में व्यक्त करता है।
- source_word: ሠላሳ ወአሐደ ጸባሐ
  choice: इकतीस भोरों तक
  rationale: स्रोत के शाब्दिक ‘इकतीस भोर’ को बनाए रखता है और लगातार उषाकालों द्वारा अवधि गिनने की पद्धति को आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ምዕራብ ሰማይ
  choice: आकाश के पश्चिम में
  rationale: ‘आकाश का पश्चिमी भाग’ जैसा व्याख्यात्मक विस्तार किए बिना स्रोत की मूर्त ब्रह्मांडीय स्थान-भाषा को सुरक्षित रखता है।
theological_decisions:
- issue: आकाश की ब्रह्मांडीय संरचना
  choice: ‘फाटक’ और ‘आकाश के पश्चिम’ की दृष्टिपरक-खगोलीय छवि को यथावत रखना
  alternative: इन्हें आधुनिक पर्यवेक्षणात्मक भाषा में ‘क्षितिज’ या केवल ‘आकाश’ कहना
  rationale: यह खंड आकाश को निश्चित फाटकों वाली संरचित व्यवस्था के रूप में प्रस्तुत करता है। अनुवाद उस प्राचीन ब्रह्मांडीय चित्रण को आधुनिक वैज्ञानिक शब्दावली में समतल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘भोरों’ स्रोत की गणनात्मक अभिव्यक्ति को बचाता है, जबकि ‘फाटक’ और ‘आकाश के पश्चिम’ अपोकैलिप्टिक ब्रह्मांडीय चित्र को बिना आधुनिकीकृत किए प्रस्तुत करते हैं।
