base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/006.yaml
  text: Thus it comes out in the first month through the great gate[b][a], which is the fourth of those six gates that are toward the sunrise.
translation:
  language: hi
  text: इस प्रकार वह पहले महीने में बड़े द्वार से निकलता है, जो सूर्योदय की दिशा में स्थित उन छह द्वारों में चौथा है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम पदबंध—‘उन छह द्वारों में ... सूर्योदय की दिशा में स्थित’—प्रदत्त साक्षी में कोष्ठकों में है। यह व्याख्यात्मक विस्तार या पाठगत रूप से अनिश्चित पदबंध हो सकता है, यद्यपि यह इस अध्याय में पूर्वी द्वारों के बार-बार होने वाले वर्णन से मेल खाता है।
    reason: textual_variant
  - marker: b
    text: 'एक पूर्ववर्ती वैकल्पिक प्रस्तुति है: ‘जो चौथा है—वे छह द्वार जो सूर्योदय की दिशा में स्थित हैं।’ किंतु मुख्य पाठ में ‘उन छह द्वारों में चौथा’ अंशात्मक संबंध को अधिक स्पष्ट रूप से व्यक्त करता है।'
    reason: previous_rendering
lexical_decisions:
- source_word: ከመዝ
  choice: इस प्रकार
  rationale: यह सूर्य की गति के ढंग या क्रम को जोड़ता है और गीइज़ के औपचारिक संबंधसूचक भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: ይወፅእ
  choice: वह ... निकलता है
  rationale: क्रिया का मूल अर्थ बाहर निकलना है। प्रसंग में इसका कर्ता सूर्य है; ‘उगता है’ कहने से द्वार से निकलने का ठोस बिंब मंद पड़ जाता।
- source_word: በወርኅ ቀዳማዊ
  choice: पहले महीने में
  rationale: काल-सूचक पदबंध का सीधा और स्वाभाविक अनुवाद।
- source_word: በኆኅት ዓቢይ
  choice: उस बड़े द्वार से
  rationale: निकलने की क्रिया के साथ हिन्दी में ‘से’ मार्ग या खुलाव को स्वाभाविक रूप से व्यक्त करता है; ‘द्वार’ अध्याय की आवर्ती ब्रह्मांडीय छवि बनाए रखता है।
- source_word: እንተ ይእቲ ራብዕት
  choice: जो ... चौथा है
  rationale: संबंधवाचक उपवाक्य उस द्वार को क्रमांकित समूह के भीतर पहचानता है।
- source_word: እልኩ ኃዋኅወ ፮
  choice: उन छः द्वारों में
  rationale: पाठ में संकेतित छह द्वारों के समूह के भीतर चौथे द्वार का अंशात्मक संबंध स्पष्ट किया गया है।
- source_word: እለ መንገለ ምሥራቀ ፀሐይ
  choice: सूर्योदय की ओर वाले
  rationale: ምሥራቀ ፀሐይ सूर्य के उदय या सूर्योदय की दिशा को सूचित करता है; यह हिन्दी में ‘सूर्य के पूर्व’ जैसी भ्रामक शब्दशः अभिव्यक्ति से बचता है।
theological_decisions:
- issue: द्वारों से होकर सूर्य की गति का खगोलीय बिंब
  choice: सूर्य के बड़े, क्रमांकित द्वार से निकलने की ठोस ब्रह्मांडीय छवि बनाए रखी गई।
  alternative: इसे आधुनिक ढंग से आकाश के किसी क्षेत्र में सूर्य के उगने के रूप में कहना।
  rationale: यह खंड जानबूझकर प्रकाशमान पिंडों की गति को द्वारों की भाषा में चित्रित करता है; आधुनिक खगोलशास्त्रीय भाषा उस प्राचीन अपोकैलिप्टिक छवि को समतल कर देगी।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली। ‘वह’ का संकेत प्रसंगगत सूर्य की ओर है। ‘निकलता है’ से मूल द्वार-बिंब सुरक्षित रखा गया है, और पाठगत अनिश्चितता मुख्य वाक्य में सुलझाने के बजाय पादटिप्पणी में स्पष्ट की गई है।
