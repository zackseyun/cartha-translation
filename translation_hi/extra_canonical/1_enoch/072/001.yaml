base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/001.yaml
  text: The book of the courses of the luminaries of heaven[a], how they are, each according to their companies, and according to their dominion and their seasons, according to their names and their origins, and according to their paths, which Uriel, the holy angel who was with me, showed me—he who is their guide—and the whole record of them, as he showed me, and how it is with regard to every year of the world and forever[h][g][f][e][d][c][b], until a new work is accomplished which will endure forever.
translation:
  language: hi
  text: आकाश की ज्योतियों के गतिचक्रों का ग्रंथ—वे अपनी-अपनी मंडलियों[a], अपने-अपने प्रभुत्व और नियत कालों, अपने नामों और उद्गमों[b], तथा अपने मार्गों के अनुसार कैसी हैं। यह सब ऊरीएल ने, वह पवित्र स्वर्गदूत जो मेरे साथ था और उनका मार्गदर्शक है, मुझे दिखाया; उसने उनका पूरा लेखा भी दिखाया, जैसा उसने मुझे दिखाया था, और यह भी कि संसार के प्रत्येक वर्ष और सदा तक उनकी स्थिति कैसी है[c]—जब तक एक नया कार्य[d] पूरा न हो जाए, जो सदा तक बना रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“मंडलियों” का मूल शब्द शाब्दिक रूप से “लोगों/सभाओं” को दर्शाता है; यहाँ वह आकाशीय ज्योतियों के समूहों के लिए रूपकतः प्रयुक्त है। विकल्प: दल, समूह।'
    reason: lexical_alternative
  - marker: b
    text: “उद्गमों” के मूल शब्द का शाब्दिक अर्थ “जन्मों/उत्पत्तियों” भी हो सकता है; खगोलीय संदर्भ में यह उनके उदय या उदय-स्थलों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'यहाँ गीज़ की वाक्य-रचना संक्षिप्त है: शाब्दिक रूप में भाव “संसार के प्रत्येक वर्ष और सदा तक” है। आशय संभवतः संपूर्ण वार्षिक ब्रह्मांडीय चक्र से है, पर “व्यवस्थित” जैसा कोई क्रियापद मूल में स्पष्ट रूप से नहीं है।'
    reason: textual_ambiguity
  - marker: d
    text: “एक नया कार्य” का अनुवाद “एक नई सृष्टि” भी किया जा सकता है। मूल अभिव्यक्ति यह खुला छोड़ती है कि आशय नई सृष्टि से है या व्यवस्था को नया करनेवाले किसी स्थायी दिव्य कार्य से।
    reason: theological_ambiguity
lexical_decisions:
- source_word: መጽሐፈ ሚጠተ ብርሃናት ሰማይ
  choice: आकाश की ज्योतियों के गतिचक्रों का ग्रंथ
  rationale: ‘ग्रंथ’ መጽሐፈ का स्वाभाविक शीर्षकीय रूप है; ‘गतिचक्र’ ሚጠተ के व्यवस्थित खगोलीय क्रम और गति, दोनों को व्यक्त करता है; ‘ज्योतियाँ’ ብርሃናት की गरिमामय किंतु सुबोध अभिव्यक्ति है।
- source_word: በበሕዝቢሆሙ
  choice: अपनी-अपनी मंडलियों
  rationale: मूल शब्द का आधारभूत अर्थ लोग/सभा है और यहाँ वह आकाशीय ज्योतियों के समूहों के लिए रूपकतः प्रयुक्त है। ‘मंडलियाँ’ उस सामूहिक रूपक को बनाए रखता है।
- source_word: ሥልጣኖሙ
  choice: अपने-अपने प्रभुत्व
  rationale: यह शब्द अधिकार, शासन या प्रभुत्व सूचित करता है। ‘प्रभुत्व’ उन्नत ब्रह्मांडीय शैली और मूल की शक्ति-संबंधी अर्थछाया बनाए रखता है।
- source_word: ዘመኖሙ
  choice: नियत कालों
  rationale: खगोलीय संदर्भ में यह समय-विभागों अथवा निर्धारित अवधियों को दर्शाता है; ‘नियत काल’ केवल ऋतुओं तक अर्थ को सीमित नहीं करता।
- source_word: ሙላዳቲሆሙ
  choice: उद्गमों
  rationale: मूल अर्थ जन्म/उत्पत्ति है और खगोलीय संदर्भ में उदय-स्थल या उदय का संकेत भी हो सकता है। ‘उद्गम’ इस बहुअर्थकता को पर्याप्त रूप से खुला रखता है।
- source_word: አውራኂሆሙ
  choice: अपने मार्गों
  rationale: मूल का सामान्य अर्थ रास्ते/मार्ग है। ‘मार्ग’ आकाशीय पथों के लिए स्वाभाविक है और आधुनिक वैज्ञानिक ‘कक्षा’ को अनावश्यक रूप से नहीं आरोपित करता।
- source_word: መራኂሆሙ
  choice: उनका मार्गदर्शक
  rationale: यह रूप नेतृत्व अथवा मार्ग दिखानेवाले को सूचित करता है; ‘मार्गदर्शक’ ऊरीएल की भूमिका को बिना अतिरिक्त पदानुक्रम जोड़े व्यक्त करता है।
- source_word: ኵሎ መጽሐፎሙ
  choice: उनका पूरा लेखा
  rationale: संज्ञा एकवचन है और ኵሎ संपूर्णता बताता है। ‘पूरा लेखा’ खगोलीय विवरण/अभिलेख के अर्थ में सहज हिंदी है और गलत बहुवचन से बचता है।
theological_decisions:
- issue: ግብር ኃዲስ का आशय
  choice: एक नया कार्य
  alternative: नई सृष्टि
  rationale: शाब्दिक ‘नया कार्य’ भविष्य के निर्णायक और स्थायी कृत्य की ओर संकेत करता है, पर यह पूर्वनिर्धारित नहीं करता कि आशय संपूर्ण नई सृष्टि है या ब्रह्मांडीय व्यवस्था का नवीकरण। इससे मूल का धर्मवैचारिक तनाव सुरक्षित रहता है।
- issue: वार्षिक क्रम और अनंतता का संबंध
  choice: संसार के प्रत्येक वर्ष और सदा तक के विषय में दिखाया
  alternative: संसार का पूरा वार्षिक चक्र, सदा के लिए व्यवस्थित होने के रूप में दिखाया
  rationale: गीज़ वाक्य-संरचना संक्षिप्त और कुछ अस्पष्ट है। अनुवाद ‘व्यवस्थित’ जैसा अनुपस्थित क्रियापद नहीं जोड़ता और वार्षिक चक्र, अनंतता तथा नए कार्य के बीच संबंध को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में गरिमामय और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ज्योतियाँ’, ‘गतिचक्र’, ‘नियत काल’ और ‘मार्गदर्शक’ खगोलीय-प्रकाशनात्मक शैली बनाए रखते हैं, जबकि ‘कक्षाएँ’ जैसे आधुनिक वैज्ञानिक और ‘सेनाएँ’ जैसे अधिक धर्मपरंपरागत शब्दों से बचा गया है। ऊरीएल की वर्तनी हिंदी उच्चारण और मूल नाम, दोनों के निकट रखी गई है।
