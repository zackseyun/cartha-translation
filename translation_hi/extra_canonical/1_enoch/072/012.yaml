  rationale: यह अध्याय में दिन और रात की अवधि मापने वाला तकनीकी शब्द है।
- source_word: ዓሠርተ ወአሐደ
  choice: ग्यारह
  rationale: मूल की ‘दस और एक’ संख्या को मानक हिन्दी संख्या में व्यक्त किया गया है।
- source_word: ወተሐጽር ሌሊት
  choice: और रात घटकर
  rationale: क्रिया रात के छोटा होने को बताती है; ‘घटकर’ संक्षिप्त और स्वाभाविक है तथा परिणामस्वरूप सात भाग रहने से जुड़ती है।
- source_word: ሰብዓተ ክፍለ
  choice: सात भाग
  rationale: मूल पाठ की माप और दिन के ग्यारह भाग के साथ उसका संतुलन सुरक्षित रखा गया है।
