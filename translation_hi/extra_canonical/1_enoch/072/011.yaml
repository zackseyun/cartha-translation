base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/011.yaml
  text: And the sun comes out from that fourth gate[a], and sets in the fourth gate, and returns to the fifth gate of the east for thirty mornings[c][b]; then it comes out from it and sets in the fifth gate.
translation:
  language: hi
  text: और सूर्य उस चौथे द्वार से निकलता है और चौथे द्वार में अस्त होता है। फिर वह तीस प्रभातों तक पूर्व के पाँचवें द्वार में लौटता है[a]; तब वह उसी द्वार से निकलता है और पाँचवें द्वार में अस्त होता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल गीइज़ में शाब्दिक रूप से “तीस प्रभात” हैं; कुछ अनुवाद इसे “तीस दिन” कहते हैं। वाक्य का अर्थ यह भी लिया जा सकता है कि वह तीस प्रभातों तक पूर्व के पाँचवें द्वार में प्रवेश करता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम उपवाक्य पाँचवें द्वार का फिर उल्लेख करता है। गीइज़ का कथन संक्षिप्त है; संभव है कि यह किसी अलग अतिरिक्त गति का पूरा वर्णन करने के बजाय तीस प्रभातों के बाद सूर्य की आगे चलने वाली गति का सार दे रहा हो।
    reason: textual_ambiguity
lexical_decisions:
- source_word: ወይወፅእ ፀሐይ
  choice: और सूर्य ... निकलता है
  rationale: क्रिया का मूल अर्थ बाहर निकलना है; सूर्य के संदर्भ में यह उदय होने की गति व्यक्त करती है, पर मूल की द्वार-छवि बनाए रखने के लिए ‘निकलता है’ रखा गया है।
- source_word: እምዘክቱ ራብዕ ኆኅት
  choice: उस चौथे द्वार से
  rationale: संकेतवाचक पद पहले बताए गए द्वार की ओर लौटता है; ‘द्वार’ इस खगोलीय-दर्शनात्मक चित्र को स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: ወየዓርብ
  choice: और ... अस्त होता है
  rationale: सूर्य की दैनिक गति के संदर्भ में यह क्रिया उसके अस्त होने को दर्शाती है।
- source_word: ወይገብእ
  choice: फिर वह ... लौटता है
  rationale: यहाँ क्रिया को ‘लौटना’ समझना पश्चिम में अस्त होने के बाद सूर्य की पूर्व दिशा के द्वार की ओर वापसी को व्यक्त करता है; इसे मात्र ‘प्रवेश करता है’ कहना इस गति को अस्पष्ट कर देता।
- source_word: ውስተ ኃምስ ኆኅት እንተ ጽባሕ
  choice: पूर्व के पाँचवें द्वार पर
  rationale: እንተ ጽባሕ को पूर्व दिशा का विशेषण मानते हुए दिशात्मक सूचना स्पष्ट रखी गई है। ‘पर’ लौटने के लक्ष्य के साथ स्वाभाविक हिंदी है।
- source_word: ሠላሳ ጽባሐ
  choice: तीस प्रभातों तक
  rationale: मूल पाठ दिनों के सामान्य पद के बजाय प्रभातों की गणना करता है; ‘प्रभात’ गरिमापूर्ण और सुबोध रूप में उस विशिष्ट अभिव्यक्ति को बचाता है।
- source_word: እምኔሃ
  choice: उसी से
  rationale: स्त्रीलिंग सर्वनाम पहले उल्लिखित पाँचवें द्वार की ओर संकेत करता है; हिंदी में ‘उसी से’ उसका पुनर्संदर्भ स्वाभाविक ढंग से देता है।
- source_word: ኃምስት ኆኅት
  choice: पाँचवें द्वार
  rationale: अंतिम वाक्यांश में उसी तकनीकी द्वार-शब्द की पुनरावृत्ति को बनाए रखा गया है।
theological_decisions:
- issue: सूर्य के द्वारों वाली ब्रह्मांड-कल्पना को आधुनिक खगोलशास्त्रीय भाषा में बदलना या मूल प्रतीकात्मक चित्र बनाए रखना
  choice: ‘द्वार’ तथा सूर्य के निकलने, लौटने और अस्त होने की गतियों को बनाए रखा गया
  alternative: ‘क्षेत्र’, ‘स्थिति’ या आधुनिक खगोलीय व्याख्या से परिभाषित करना
  rationale: यह अंश प्रकाशनात्मक-ब्रह्मांडीय चित्र प्रस्तुत करता है। अनुवाद का काम उस चित्र को आधुनिक वैज्ञानिक प्रतिरूप में बदलना नहीं, बल्कि स्रोत की भाषा और तनाव को संप्रेषित करना है।
- issue: ወይገብእ को ‘प्रवेश करता है’ या ‘लौटता है’ कहना
  choice: ‘लौटता है’
  alternative: ‘प्रवेश करता है’
  rationale: पूर्व के द्वार की ओर सूर्य की पुनरागमन-गति इस प्रसंग में अधिक सुसंगत है; फिर भी अवधि और अंतिम पुनरुक्ति की संक्षिप्तता को टिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सरल शैली अपनाई गई है। ‘प्रभात’ मूल की विशिष्ट काल-गणना को बचाता है, और ‘द्वार’ प्रकाशनात्मक ब्रह्मांड-चित्र को आधुनिक वैज्ञानिक शब्दों में सपाट करने से रोकता है।
