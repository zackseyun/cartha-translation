base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/014.yaml
  text: On that day the day becomes longer than the night[a], and the day becomes twice the night, and the day becomes twelve parts[b], and the night grows shorter and becomes six parts.
translation:
  language: hi
  text: उस दिन, दिन रात से अधिक लंबा हो जाता है, और दिन रात से दुगुना हो जाता है; और दिन बारह भाग का हो जाता है[a], और रात छोटी होती जाती है और छह भाग की हो जाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ दिन और रात को ‘भागों’ में बाँटने की वही योजनाबद्ध गणना है जो इस अध्याय में प्रयुक्त हुई है। दिन के बारह और रात के छह भाग होने का अर्थ है कि दिन रात से दुगुना है।
    reason: cultural_note
lexical_decisions:
- source_word: በይእቲ፡ ዕለት
  choice: उस दिन
  rationale: कालसूचक सूत्र का स्वाभाविक और निकट हिन्दी रूप।
- source_word: ትነውኅ፡ ዕለት፡ እምሌሊት
  choice: दिन रात से अधिक लम्बा हो जाता है
  rationale: क्रिया में लम्बा होने की प्रक्रिया और እም के प्रसंगगत तुलनात्मक अर्थ—रात से अधिक—दोनों सुरक्षित रहते हैं।
- source_word: 'ዕፅበተ፡ ሌሊት (transcription: ፱ዕበተ፡ ሌሊት)'
  choice: रात से दुगुना हो जाता है
  rationale: प्राप्त लिप्यंतरण में ፱ सम्भवतः ፅ का दृश्य/OCR भ्रम है; बारह और छः भाग का अगला कथन भी दुगुने अनुपात की पुष्टि करता है।
- source_word: ክፍለ፡ ፲ወ፪
  choice: बारह भाग
  rationale: अध्याय में दिन और रात की योजनाबद्ध समय-विभाजन प्रणाली के लिए ‘भाग’ स्पष्ट और स्वाभाविक है।
- source_word: ትኃጽር
  choice: घटकर
  rationale: रात के छोटा होने की गतिशील प्रक्रिया को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ስድስተ፡ ክፍል
  choice: छः भाग
  rationale: मूल की संख्या और तकनीकी विभाजन-भाषा को सीधे बनाए रखता है।
theological_decisions:
- issue: खगोलीय अनुपात की पुनरावृत्त सूत्रात्मक भाषा को आधुनिक गद्य में समतल करना या बनाए रखना
  choice: दिन और रात के ‘भागों’ तथा उनके अनुपात को स्पष्ट रखते हुए सूत्रात्मक क्रम बनाए रखा गया है।
  alternative: केवल इतना कहना कि दिन रात से दुगुना लम्बा होता है।
  rationale: हनोक के ज्योतिर्गण-विवरण की योजनाबद्ध शैली और प्राचीन समय-मापन पद्धति पाठ का अभिन्न अंग हैं; उन्हें हटाना अर्थ को संकुचित कर देता।
- issue: लिप्यंतरण ፱ዕበተ को ‘नौ’ मानना या मूलाक्षर के OCR भ्रम के रूप में पढ़ना
  choice: ዕፅበተ के अर्थ में ‘दुगुना’
  alternative: ‘रात के नौ भाग’
  rationale: ፅ और ፱ की दृश्य समानता से प्रतिलिपि-त्रुटि सम्भव है, जबकि इसी पद में दिन के बारह और रात के छः भाग होने का कथन ठीक 2:1 अनुपात देता है। यह पाठ-संशोधन आन्तरिक गणितीय साक्ष्य से समर्थित है, न कि किसी धार्मिक सिद्धान्त से।
