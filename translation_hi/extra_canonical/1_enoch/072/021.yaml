base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/021.yaml
  text: And the sun comes out from that gate[a], and sets in the west, and returns to the east, and comes out from the third gate for thirty mornings[c][b], and sets in the west at the third gate.
translation:
  language: hi
  text: और सूर्य उस फाटक से निकलता है, पश्चिम में अस्त होता है, पूर्व की ओर लौटता है, और तीसरे फाटक से तीस भोरों तक निकलता है[a]; फिर वह पश्चिम में तीसरे फाटक पर अस्त होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तीस भोरों तक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይወፅእ
  choice: और ... निकलता है
  rationale: यह क्रिया बाहर आने या निकलने को व्यक्त करती है। सूर्य की ठोस खगोलीय गति और पद में इसकी पुनरावृत्ति बनाए रखने के लिए दोनों स्थानों पर ‘निकलता है’ रखा गया है।
- source_word: ፀሐይ
  choice: सूर्य
  rationale: यह स्पष्ट खगोलीय संदर्भ है; मूल से अधिक मानवीकरण नहीं किया गया।
- source_word: እምይእቲ ኆኅት
  choice: उस फाटक से
  rationale: ኆኅት का अर्थ द्वार या फाटक है। खगोलीय पुस्तक में सूर्य के लिए निर्धारित विशाल मार्गों की वास्तु-छवि के अनुरूप ‘फाटक’ चुना गया; निर्देशक शब्द पहले बताए गए फाटक की ओर संकेत करता है।
- source_word: ያዓርብ በምዕራብ
  choice: पश्चिम में अस्त होता है
  rationale: सूर्य की गति के संदर्भ में ‘अस्त होता है’ स्वाभाविक हिन्दी है और क्रिया का प्रसंगगत अर्थ ठीक रखती है।
- source_word: ወይገብእ በጽባሕ
  choice: पूर्व की ओर लौटता है
  rationale: ገብአ लौटने/वापस जाने का अर्थ दे सकता है, और ጽባሕ ‘भोर’ के साथ-साथ ‘पूर्व’ का स्थानवाचक अर्थ भी रखता है। पश्चिम के समानांतर स्थानिक विन्यास के कारण यहाँ ‘पूर्व की ओर’ चुना गया है।
- source_word: በሣልስት ኆኅት
  choice: तीसरे फाटक से / तीसरे फाटक पर
  rationale: एक ही पदबंध को संबद्ध क्रिया के अनुसार पहले निकलने के स्रोत के लिए ‘से’ और फिर अस्त होने के स्थान के लिए ‘पर’ दिया गया है।
- source_word: ሠላሳ ጸባሐ
  choice: तीस भोरों तक
  rationale: मूल में अक्षरशः ‘तीस भोर’ हैं। असामान्य किंतु अर्थपूर्ण खगोलीय गणना को ‘तीस दिन’ कहकर समतल नहीं किया गया।
theological_decisions:
- issue: खगोलीय पुस्तक में ኆኅት की ब्रह्मांडीय वास्तु-छवि
  choice: फाटक
  alternative: खिड़की
  rationale: गीज़ शब्द यहाँ ‘द्वार/फाटक’ को दर्शाता है और पुस्तक में छोटी खिड़कियों से अलग सूर्य के निर्धारित फाटकों की छवि बनाए रखता है।
- issue: በጽባሕ का कालवाचक अथवा स्थानवाचक अर्थ
  choice: पूर्व की ओर
  alternative: भोर में
  rationale: ‘पश्चिम में’ के साथ स्थानिक समानांतरता और सूर्य के चक्रीय मार्ग के कारण स्थानवाचक अर्थ अधिक उपयुक्त है, यद्यपि शब्द मूलतः भोर से संबंधित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और ठोस खगोलीय भाषा रखी गई है। ‘फाटक’ अपोकैलिप्टिक ब्रह्मांड-विन्यास को सुरक्षित रखता है; ‘तीस भोरों’ की असामान्य गणना को जानबूझकर नहीं समतल किया गया।
