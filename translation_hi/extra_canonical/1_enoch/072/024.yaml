lexical_decisions:
- source_word: ወበይእቲ፡ ዕለት
  choice: और उस दिन
  rationale: यह समय-सूचक पद ज्योतियों के क्रम में एक निश्चित दिन की ओर संकेत करता है; ‘उस दिन’ संकेतवाचक बल को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ትከውን
  choice: हो जाती है
  rationale: अपूर्ण क्रिया-रूप खगोलीय चक्र में अनुपात के बदलकर इस अवस्था तक पहुँचने का भाव दे सकता है; आसपास के सूत्रात्मक वर्णन से संगति रखते हुए ‘हो जाती है’ चुना गया है, जबकि साधारण भविष्य अर्थ भी संभव है।
- source_word: ሌሊት
  choice: रात
  rationale: यह दिन के विपरीत मापी गई रात्रि-अवधि को दर्शाता है; हिन्दी में बिना अनावश्यक निर्धारक के ‘रात’ स्वाभाविक है।
- source_word: ዓሠርተ፡ ወአሐደ፡ ክፍለ
  choice: ग्यारह भागों की
  rationale: मूल में शाब्दिक रूप से ‘दस और एक भाग’ है। ‘भाग’ खगोलीय पुस्तक की योजनाबद्ध समय-विभाजन पद्धति को स्पष्ट और सुसंगत रूप से व्यक्त करता है।
- source_word: ወዕለት፡ ሰብዓተ፡ ክፍለ
  choice: और दिन सात भागों का
  rationale: मूल की समानांतर रचना और रात-दिन के संख्यात्मक विभाजन को बनाए रखा गया है; हिन्दी में पहले खंड की क्रिया को दूसरे में दोहराए बिना अर्थ स्पष्ट रहता है।
