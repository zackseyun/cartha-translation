base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/009.yaml
  text: And in those days the day grows longer from day to day[a], and the night grows shorter from night to night[c][b], until thirty mornings.
translation:
  language: hi
  text: और उन दिनों में दिन प्रतिदिन लंबा होता जाता है[a], और रात दर रात छोटी होती जाती है, तीस प्रभातों तक[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल गीइज़ में शाब्दिक रूप से ‘दिन से दिन’ और आगे ‘रात से रात’ की पुनरावृत्त तुलनात्मक रचना है। आशय है कि हर अगला दिन लंबा और हर अगली रात छोटी होती जाती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तीस भोरों तक’। मूल शब्द का अर्थ ‘प्रभात’ या ‘भोर’ है और संभवतः ज्योतियों की इस गणना में एक गिने हुए चरण को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: उन दिनों में
  rationale: यह प्रचलित कालवाचक पदबंध मूल के गरिमापूर्ण, दर्शन-साहित्य संबंधी स्वर को बनाए रखता है।
- source_word: ትነኍኅ
  choice: लंबा होता जाता है
  rationale: क्रिया समयावधि में क्रमिक वृद्धि दर्शाती है; यह हिंदी प्रयोग उस प्रगतिशील खगोलीय परिवर्तन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ዕለት እምዕለት
  choice: दिन-प्रतिदिन
  rationale: मूल में ‘दिन’ की तुलनात्मक पुनरावृत्ति है। हिंदी का यह पदबंध प्रत्येक अगले दिन की बढ़ती अवधि को संक्षेप और स्वाभाविकता से व्यक्त करता है।
- source_word: ተኃጽር ሌሊት እምሌሊት
  choice: रात, रात-प्रतिरात छोटी होती जाती है
  rationale: यह पहले उपवाक्य की समानांतर रचना और रात की अवधि में क्रमिक कमी—दोनों को सुरक्षित रखता है।
- source_word: እስከ ሠላሳ ጽባሕ
  choice: तीस प्रभातों तक
  rationale: ጽባሕ का ठोस अर्थ ‘प्रभात/भोर’ है। ‘प्रभात’ गिनती पर आधारित इस खगोलीय विधान के गरिमापूर्ण स्वर को बनाए रखता है।
theological_decisions:
- issue: እም वाले पदबंधों को सीधे तुलनात्मक रूप में रखा जाए या क्रमिक परिवर्तन के रूप में व्यक्त किया जाए
  choice: ‘दिन-प्रतिदिन’ और ‘रात-प्रतिरात’ द्वारा क्रमिक तुलना व्यक्त की गई
  alternative: ‘एक दिन से दूसरे दिन अधिक लंबा’ और ‘एक रात से दूसरी रात अधिक छोटी’
  rationale: इस खगोलीय प्रसंग में आशय लगातार दिनों और रातों की अवधि की तुलना है। चुना हुआ रूप हिंदी में स्वाभाविक है, जबकि पादटिप्पणी मूल की असामान्य तुलनात्मक पुनरावृत्ति स्पष्ट करती है।
- issue: ጽባሕ को ‘प्रभात’ माना जाए या अमूर्त समय-अवधि के रूप में समझाया जाए
  choice: ठोस बहुवचन ‘प्रभातों’ रखा गया
  alternative: ‘तीस दिनों तक’ या ‘तीसवीं सुबह तक’
  rationale: मूल पाठ ‘प्रभात’ गिनता है; इसे ‘दिनों’ में बदलना या क्रमसूचक ‘तीसवीं’ करना पाठ से अधिक निश्चितता जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। समानांतर खगोलीय कथन को बनाए रखने के लिए ‘दिन-प्रतिदिन’ और अपेक्षाकृत साहित्यिक पर स्पष्ट ‘रात-प्रतिरात’ प्रयुक्त हैं। ‘प्रभात’ मूल के ठोस काल-सूचक शब्द और ग्रंथ के ऊँचे शैलीगत स्तर—दोनों को सुरक्षित रखता है।
