base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/029.yaml
  text: And the sun returns and enters the second gate[a], which is in the east; and it returns to that principal course for thirty mornings[c][b], rising and setting.
translation:
  language: hi
  text: और सूर्य लौटकर पूर्व में स्थित दूसरे द्वार[a] में प्रवेश करता है; और तीस प्रभात तक वह उसी प्रधान मार्ग[b] पर लौटता है, उदय होता और अस्त होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दूसरे द्वार’ का अनुवाद क्रमिक संदर्भ के अनुसार है; इस पद का अर्थ ‘अन्य द्वार’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उसी प्रधान मार्ग पर’ वाला मूल वाक्यांश कठिन है। इसका आशय सम्भवतः यह है कि सूर्य तीस प्रभात तक इसी द्वार से जुड़े अपने मुख्य मार्ग पर चलता रहता है।
    reason: textual_variant
lexical_decisions:
- source_word: ገብአ
  choice: लौटकर
  rationale: क्रिया का मूल अर्थ यहाँ ‘लौटना’ है; यह सूर्य के फिर पूर्व की ओर आने की गति को व्यक्त करती है, न कि स्वयं ‘उदय होने’ को।
- source_word: ቦአ ውስተ
  choice: में प्रवेश करता है
  rationale: द्वार के भीतर जाने की ठोस गति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ካልእ ኆኅት
  choice: दूसरे द्वार
  rationale: द्वारों के क्रमबद्ध वर्णन में ካልእ को ‘दूसरा’ समझना प्रसंगानुकूल है, यद्यपि उसका अर्थ ‘अन्य’ भी हो सकता है।
- source_word: እንተ በምሥራቅ
  choice: पूर्व में स्थित
  rationale: संबंधवाचक पद द्वार का स्थान बताता है; यह आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: ይገብእ ዲበ ዝኩ
  choice: वह उसी ... पर लौटता है
  rationale: पुनरावृत्त गति और संकेतवाचक ‘उसी’ को बनाए रखता है; पूर्वसर्गीय रचना को हिन्दी में स्वाभाविक ‘पर’ से व्यक्त किया गया है।
- source_word: አርእስቲሁ
  choice: प्रधान मार्ग
  rationale: यह कठिन पद किसी मुख्य या प्रधान पथ/क्रम की ओर संकेत करता प्रतीत होता है; अनिश्चितता को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ሠላሳ ጸባሐ
  choice: तीस प्रभात तक
  rationale: खगोलीय-कालगणनात्मक संदर्भ में तीस प्रातःकालों की अवधि को व्यक्त करता है; ‘प्रभात’ गरिमापूर्ण किंतु सुबोध है।
- source_word: ይሠርቅ ወየዓርብ
  choice: उदय होता और अस्त होता है
  rationale: दोनों खगोलीय क्रियाओं को समानांतर, सहज हिन्दी में प्रस्तुत करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में रखी गई है। ‘प्रभात’ और ‘प्रधान मार्ग’ खगोलीय वर्णन की गरिमा बनाए रखते हैं, जबकि वाक्य-संरचना सामान्य पाठक के लिए सरल है। मूल की कठिनता को मुख्य पाठ में अत्यधिक स्पष्ट किए बिना पादटिप्पणी में सुरक्षित रखा गया है।
