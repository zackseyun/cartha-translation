base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/019.yaml
  text: And the sun comes out from that fifth gate[a], and sets in the fifth gate in the west, and rises in the fourth gate according to its signs for thirty-one mornings[d][c][b], and sets in the west.
translation:
  language: hi
  text: और सूर्य उस पाँचवें फाटक से निकलता है और पश्चिम के पाँचवें फाटक में अस्त होता है। फिर वह अपने चिह्नों के अनुसार इकतीस प्रभातों तक चौथे फाटक में उदय होता है[a] और पश्चिम में अस्त होता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''अपने चिह्नों के अनुसार'' वाला वाक्यांश कठिन है। इसका अर्थ सूर्य के दिखाई देनेवाले संकेतों अथवा उसके लिए निर्धारित चिह्नों के अनुरूप भी हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: 'गीज़ का अंतिम वाक्य संक्षिप्त है: ''और पश्चिम में अस्त होता है।'' कुछ अनुवाद यहाँ ''उसी फाटक में'' जोड़ते हैं, पर उपलब्ध मूल पाठ में ''फाटक'' दोबारा स्पष्ट रूप से नहीं आया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ይወፅእ
  choice: निकलता है
  rationale: क्रिया का मूल भाव बाहर आने या निकलने का है; यह सूर्य की दृश्य गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ኆኅት
  choice: फाटक
  rationale: खगोलीय ग्रंथ की प्रतीकात्मक ब्रह्मांड-रचना में सूर्य जिन मार्गों से आता-जाता है, उन्हें ठोस 'फाटकों' के रूप में चित्रित किया गया है।
- source_word: የዓርብ / ያዓርብ
  choice: अस्त होता है
  rationale: सूर्य के दैनिक मार्ग के संदर्भ में यह केवल प्रवेश नहीं, सूर्यास्त को दर्शाता है।
- source_word: ምዕራብ
  choice: पश्चिम
  rationale: यह पश्चिमी दिशा अथवा प्रदेश को सूचित करता है; हिन्दी में 'पश्चिम' दोनों प्रसंगों में स्पष्ट और स्वाभाविक है।
- source_word: ይሠርቅ
  choice: उदय होता है
  rationale: खगोलीय संदर्भ में यह सूर्य के निकलने अथवा उगने को बताता है; 'उदय होता है' गरिमापूर्ण और प्रचलित पद है।
- source_word: በራብዕት ኆኅት
  choice: चौथे फाटक में
  rationale: वही በ-रचना इससे पहले पाँचवें फाटक में अस्त होने के लिए आई है; समान स्थानवाचक अनुवाद सूत्रबद्ध समानता को बनाए रखता है।
- source_word: በእንተ ትእምርታቲሃ
  choice: अपने चिह्नों के अनुसार
  rationale: በእንተ कारण, संबंध या अनुरूपता का भाव दे सकता है। यहाँ सूर्य के निर्धारित संकेतों के अनुरूप उसकी गति समझना प्रसंगानुकूल है, पर कठिन वाक्यांश को पादटिप्पणी में खुला रखा गया है।
- source_word: ሠላሳ ወአሐዱ ጽባሕ
  choice: इकतीस प्रभातों तक
  rationale: मूल पाठ सामान्य 'दिन' नहीं बल्कि 'प्रभात' कहता है। 'तक' इस अवधि के विस्तार को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: आकाशीय फाटकों की ब्रह्मांड-रचना
  choice: '''फाटक'' की मूर्त भाषा बनाए रखना'
  alternative: '''द्वार'', ''मार्ग'' या ''खुला स्थान'''
  rationale: यह ग्रंथ ब्रह्मांड को दर्शनात्मक और प्रतीकात्मक संरचना के रूप में प्रस्तुत करता है। आधुनिक खगोलीय शब्दावली थोपने के बजाय मूल चित्रात्मकता को बनाए रखा गया है।
- issue: सूर्य के 'चिह्नों' का अर्थ
  choice: अर्थ को 'अपने चिह्नों के अनुसार' के रूप में खुला रखना
  alternative: '''अपने नियत संकेतों के कारण'' या ''अपने चिह्नों के विषय में'''
  rationale: वाक्यांश का सटीक संबंध कठिन है। इसे किसी विशिष्ट ब्रह्मांडीय या धर्मवैज्ञानिक प्रणाली के रूप में निर्णायक ढंग से नहीं समझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण खगोलीय-वर्णनात्मक शैली अपनाई गई है। लंबे मूल वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है। 'प्रभातों' मूल की प्रेक्षणात्मक भाषा बचाता है, जबकि 'फाटक' दर्शनात्मक ब्रह्मांड-चित्र को समतल नहीं करता।
