  yaml_path: translation/extra_canonical/1_enoch/072/023.yaml
  text: And the sun comes out from that third gate[a], and sets in the third gate in the west, and returns to the east, and comes out from the second gate in the east for thirty mornings; and in this way it sets in the second gate in the west of heaven.
translation:
  language: hi
  text: और सूर्य उस तीसरे द्वार से निकलता है और पश्चिम में तीसरे द्वार में अस्त होता है। फिर वह पूर्व में लौटता है और तीस प्रातःकालों तक पूर्व में दूसरे द्वार से निकलता है; और इसी प्रकार वह आकाश के पश्चिम में दूसरे द्वार में अस्त होता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይወፅእ
  choice: निकलता है
  rationale: यह क्रिया बाहर आने या निकलने का बोध कराती है। सूर्य के द्वारों से होकर चलने के इस खगोलीय वर्णन में ‘निकलता है’ स्वाभाविक है और मूल की ठोस गति को बनाए रखता है।
- source_word: ፀሐይ
  choice: सूर्य
  rationale: यह स्पष्ट खगोलीय संदर्भ है; मूल से अधिक मानवीकरण या सामान्यीकरण आवश्यक नहीं है।
- source_word: ሣልስት ኆኅት
  choice: तीसरा द्वार
  rationale: ‘द्वार’ मूल की ठोस ब्रह्मांडीय छवि को सुरक्षित रखता है और अध्याय में वर्णित क्रमबद्ध आकाशीय द्वारों के अनुरूप है।
- source_word: ያዓርብ
  choice: अस्त होता है
  rationale: सूर्य की दैनिक गति के संदर्भ में यह पश्चिम जाने अथवा संध्या होने से जुड़ी क्रिया का सर्वाधिक स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: በዐረብ
  choice: पश्चिम में
  rationale: यहाँ पदबंध स्थानसूचक है और पूर्व-पश्चिम की समांतर ब्रह्मांडीय संरचना के अनुरूप है।
- source_word: ይገብእ
  choice: लौटता है
  rationale: क्रिया का अर्थ ‘प्रवेश करता है’ भी हो सकता है, पर क्रम सूर्य के अस्त होने के बाद पूर्व की ओर उसके चक्रीय लौटने का वर्णन करता है।
- source_word: ውስተ ምሥራቅ
  choice: पूर्व की ओर
  rationale: दिशात्मक गति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करते हुए मूल अभिमुखता सुरक्षित रखी गई है।
- source_word: ካልእ ኆኅት
  choice: दूसरा द्वार
  rationale: सूर्य के क्रमांकित द्वारों की इस श्रृंखला में ‘दूसरा द्वार’ अपेक्षित है; ‘एक अन्य द्वार’ क्रम को अस्पष्ट कर देता।
- source_word: ሠላሳ ጸባሐ
  choice: तीस दिनों तक
  rationale: मूलतः पद का शाब्दिक अर्थ ‘तीस प्रातः’ है। मुख्य पाठ में समय-अवधि का स्वाभाविक हिन्दी रूप दिया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: በምዕረበ ሰማይ
  choice: आकाश के पश्चिम में
  rationale: यह मूल की स्थानिक और ब्रह्मांडीय दिशा बनाए रखता है। आधुनिक हिन्दी में ‘आकाश’ इस दृश्य खगोलीय संदर्भ में स्वाभाविक है।
theological_decisions:
- issue: सूर्य के आकाशीय द्वारों की ब्रह्मांडीय छवि
  choice: द्वारों और दिशात्मक गति का ठोस वर्णन बनाए रखना
  alternative: इसे क्षितिज पर सूर्योदय और सूर्यास्त के बिंदुओं के रूप में आधुनिक बनाना
  rationale: पाठ एक सुव्यवस्थित आकाशीय संरचना प्रस्तुत करता है। ‘द्वार’ को रूपांतरित कर आधुनिक वैज्ञानिक भाषा देने से मूल की अपोकैलिप्टिक ब्रह्मांडीय छवि मिट जाएगी।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली अपनाई गई है। छोटे वाक्यों से जटिल खगोलीय क्रम स्पष्ट किया गया है। ‘द्वार’ की ठोस छवि को बनाए रखा गया है; ‘तीस दिनों’ के साथ शाब्दिक ‘तीस प्रातः’ पादटिप्पणी में दिया गया है।
