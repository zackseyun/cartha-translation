base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/007.yaml
  text: And in that fourth gate[a], from which the sun comes out in the first month, there are twelve open windows[c][b], from which a flame comes out when they are opened at their appointed times.
translation:
  language: hi
  text: और उस चौथे द्वार में, जिससे सूर्य पहले महीने में निकलता है, बारह खुली खिड़कियाँ[a] हैं; उनमें से ज्वाला निकलती है, जब वे अपने नियत समय पर खोली जाती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राप्त प्रतिलिपि में यहाँ एक OCR-दोष प्रतीत होता है। पुनर्निर्मित गीइज़ पाठ का अर्थ ‘बारह खुली खिड़कियाँ’ है, न कि ‘वायु के अधिकार’ या ‘वायुओं के स्वर्गदूतों’ से सम्बन्धित खिड़कियाँ।
    reason: textual_note
