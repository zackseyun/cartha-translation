- issue: दूषित OCR-पाठ को वायु के अधिकार या वायु के स्वर्गदूतों से जोड़ना
  choice: मुख्य पाठ में ‘बारह खुली खिड़कियाँ’
  alternative: ‘वायु के अधिकार की बारह खिड़कियाँ’ अथवा ‘वायुओं के स्वर्गदूतों की बारह खिड़कियाँ’
