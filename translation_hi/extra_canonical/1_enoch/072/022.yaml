base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/022.yaml
  text: And on that day the night exceeds the day[a], and the night increases from night to night, and the day grows shorter from day to day, until thirty mornings, and the night becomes exactly ten parts[e][d][c][b], and the day eight parts.
translation:
  language: hi
  text: और उस दिन रात दिन से लंबी हो जाती है, और रात-दर-रात बढ़ती जाती है, और दिन-दर-दिन छोटा होता जाता है—तीस भोरों तक[a]। तब रात ठीक दस भागों की और दिन आठ भागों का हो जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तीस भोरों” का शाब्दिक अर्थ तीस प्रभात हैं; यहाँ यह मौसमी क्रम में लगातार आने वाले दिनों अथवा भोरों की गिनती हो सकती है।
    reason: cultural_note
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: उस दिन
  rationale: यह स्वाभाविक हिन्दी कालवाचक अभिव्यक्ति है और खगोलीय क्रम को स्पष्ट रखती है।
- source_word: ትነሡኅ ሌሊት እምዕለት
  choice: रात दिन से बढ़ जाती है
  rationale: तुलनात्मक भाव को सहज हिन्दी में व्यक्त करता है; यहाँ अवधि की अधिकता प्रसंग से स्पष्ट है।
- source_word: ወሌሊት እምሌሊት ትነሡኅ
  choice: रात प्रति रात बढ़ती जाती है
  rationale: दोहराए गए संज्ञा-रूप और እም को क्रमिक वृद्धि के रूप में व्यक्त करता है।
- source_word: ወተሐጽር ዕለት እምዕለት
  choice: दिन प्रति दिन छोटा होता जाता है
  rationale: क्रमिक ह्रास को आधुनिक, स्पष्ट हिन्दी में रखता है।
- source_word: እስከ ሠላሳ ጸባሕ
  choice: तीस भोरों तक
  rationale: ጸባሕ के प्रत्यक्ष अर्थ ‘भोर’ को बनाए रखता है और उसे सामान्यीकृत करके ‘दिन’ नहीं करता।
- source_word: ዐሠርተ ክፍለ ጥንቁቀ
  choice: ठीक दस भाग
  rationale: तकनीकी माप ‘भाग’ को सुरक्षित रखते हुए ጥንቁቀ की सटीकता को ‘ठीक’ से व्यक्त करता है।
- source_word: ስመንተ ክፍለ
  choice: आठ भाग
  rationale: स्रोत की खगोलीय विभाजन-पद्धति को बिना आधुनिक घंटों में बदले ज्यों का त्यों रखता है।
theological_decisions:
- issue: दिन और रात की खगोलीय माप
  choice: ‘भाग’ की तकनीकी भाषा बनाए रखी गई है।
  alternative: इसे आधुनिक घंटों में बदलना या केवल रात लंबी और दिन छोटा कहना।
  rationale: स्रोत की ब्रह्मांड-विज्ञान संबंधी माप-पद्धति को सुरक्षित रखना उचित है; आधुनिक समय-मापन आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण शैली। ‘प्रति रात’ और ‘प्रति दिन’ स्रोत के क्रमिक भाव को स्पष्ट करते हैं। ‘भोर’ और ‘भाग’ से मूल की प्रेक्षणात्मक तथा तकनीकी भाषा सुरक्षित रहती है।
