- source_word: ተክልኤተ ክፍል
  choice: दो भाग
  rationale: यह दिन में होने वाली कमी की मात्रा बताता है, न कि दिन का केवल दो भागों में विभाजन।
- source_word: ወትከውን
  choice: हो जाते हैं
  rationale: घटने के बाद उत्पन्न परिणामी अवस्था व्यक्त करता है; संयुक्त हिन्दी वाक्य में दिन और रात के भागों के साथ बहुवचन स्वाभाविक है।
- source_word: ዕለት ዓሠርተ ክፍለ
  choice: दिन के दस भाग
  rationale: दिन को गिने हुए भागों में मापने वाली पुस्तक की तकनीकी योजना को सुरक्षित रखता है।
- source_word: ወሌሊት ስመንተ ክፍለ
  choice: रात के आठ भाग
  rationale: दिन के दस भागों के समानांतर रात की माप को स्पष्ट और संक्षिप्त रूप में रखता है।
