translation:
  language: hi
  text: उस दिन दिन दो भाग कम हो जाता है[a], और दिन दस भाग का हो जाता है तथा रात आठ भाग की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'खगोलीय पुस्तक में दिन के उजाले और रात के अँधेरे की अवधि को नियमित रूप से गिने हुए “भागों” में मापा गया है। यहाँ दिन के उजाले के मौसमी रूप से घटने का वर्णन है: दिन के दस भाग और रात के आठ भाग होते हैं।'
    reason: cultural_note
