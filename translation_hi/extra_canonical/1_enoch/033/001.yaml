  choice: वहाँ से
  rationale: यह स्थान से आगे बढ़ने का संकेत देता है और दर्शन-वृत्तांत की क्रमिक गति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ሖርኩ
  choice: मैं ... गया
  rationale: प्रथम पुरुष के साधारण गतिसूचक क्रिया-रूप को बिना अनावश्यक विस्तार के रखा गया है।
- source_word: አጽናፈ ምድር
  choice: पृथ्वी के छोरों
  rationale: यह प्रलयदर्शी विश्व-भूगोल का मुहावरा है; ‘छोरों’ से उसकी ब्रह्मांडीय छवि बनी रहती है।
- source_word: አራዊተ ዐበይተ
  choice: बड़े-बड़े जंगली पशु
  rationale: አራዊት का जंगली पशुओं वाला भाव स्पष्ट करते हुए ዐበይት की विशालता को ‘बड़े-बड़े’ से व्यक्त किया गया है।
- source_word: ይትዌለጥ
  choice: भिन्न थे / भिन्न-भिन्न थी / भिन्न थीं
  rationale: दोहराई गई क्रिया विभिन्न जीवों, दृश्य विशेषताओं और आवाज़ों के परस्पर अलग होने को व्यक्त करती है; हिन्दी व्याकरण के अनुसार रूप बदले गए हैं।
- source_word: ፩እምካልኡ
  choice: एक-दूसरे से
  rationale: पारस्परिक भिन्नता का सहज आधुनिक हिन्दी रूप।
- source_word: አዕዋፍሂ
  choice: पक्षियों ... भी
  rationale: परसर्गीय/संयोजी ‘भी’ बनाए रखता है कि वही निरीक्षण अब पक्षियों पर लागू होता है।
- source_word: ገጾሙ
  choice: उनका रूप
  rationale: शाब्दिक अर्थ ‘उनके चेहरे’ है, पर पक्षियों के दृश्य स्वरूप के संदर्भ में ‘रूप’ अधिक स्वाभाविक और अर्थानुकूल है।
- source_word: ስኖሙ
  choice: उनकी आकृति
  rationale: पाठ और अर्थ कुछ अनिश्चित हैं; ‘आकृति’ संभावित शारीरिक आकार या बनावट को संक्षेप में व्यक्त करती है, बिना ‘शरीर’ को पाठ में अनावश्यक रूप से जोड़ने के।
- source_word: ቃሎሙሂ
  choice: उनकी आवाज़ें भी
  rationale: ‘आवाज़ें’ मूल के वाचिक/श्रव्य अर्थ को रखता है और -ሂ के अतिरिक्त बल को ‘भी’ से व्यक्त करता है।
theological_decisions:
- issue: प्रलयदर्शी गंतव्य को मुहावरेदार या अत्यधिक शाब्दिक रूप में प्रस्तुत करना
  choice: पृथ्वी के छोरों तक
  alternative: पृथ्वी की सीमाओं तक
  rationale: ‘छोर’ विश्व की चरम सीमाओं की प्रलयदर्शी छवि को आधुनिक हिन्दी में स्वाभाविक ढंग से सुरक्षित रखता है।
- issue: ገጾሙ को शाब्दिक ‘चेहरे’ के रूप में रखना या व्यापक दृश्य अर्थ देना
  choice: उनका रूप
  alternative: उनके चेहरे
  rationale: विषय पक्षी हैं और वाक्य उनकी अलग-अलग दृश्य तथा श्रव्य विशेषताओं की सूची देता है; ‘रूप’ मूल शब्द से जुड़ा रहते हुए प्रसंग में अधिक स्वाभाविक है।
- issue: अनिश्चित ስኖሙ का विस्तार करना
  choice: उनकी आकृति
  alternative: उनके शरीरों की बनावट
  rationale: ‘आकृति’ संभावित शारीरिक रूप को व्यक्त करती है, पर अनिश्चित पाठ को व्याख्यात्मक विस्तार देकर निश्चित नहीं बनाती।
