base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/001.yaml
  text: And from there I went to the ends of the earth[a], and there I saw great beasts, and they differed from one another; and the birds also differed in their appearance and their forms[c][b], and their voices also differed one from another.
translation:
  language: hi
  text: और वहाँ से मैं पृथ्वी के छोरों तक गया। वहाँ मैंने बड़े-बड़े जंगली पशु देखे, जो एक-दूसरे से भिन्न थे। पक्षी भी अपने रूप और आकृति में भिन्न थे[a], और उनकी आवाज़ें भी एक-दूसरे से भिन्न थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘रूप’ का शाब्दिक अर्थ यहाँ ‘चेहरे’ है। ‘आकृति’ के लिए प्रयुक्त गीइज़ शब्द का पाठ और सटीक अर्थ कुछ अनिश्चित है; संभवतः इसका आशय शारीरिक आकार या बनावट से है।
    reason: lexical_alternative_and_textual_uncertainty
