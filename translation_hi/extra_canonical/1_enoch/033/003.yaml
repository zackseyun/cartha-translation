base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/003.yaml
  text: And I saw the portals from which the stars of heaven come out[a], and I wrote down all their outlets, each one by itself, according to their number and their names, by their order and their activity and their times and their months, as Uriel, the holy angel who was with me[c][b], showed me.
translation:
  language: hi
  text: और मैंने वे द्वार देखे जिनसे आकाश के तारे निकलते हैं[a]। मैंने उनके सभी निर्गम-स्थानों को—हर एक को अलग-अलग—उनकी संख्या, नाम, क्रम, कार्य, समय और महीनों के अनुसार लिख लिया, जैसा पवित्र स्वर्गदूत ऊरीएल ने, जो मेरे साथ था, मुझे दिखाया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरंभिक गीइज़ शब्द-विन्यास पाठगत और व्याख्यात्मक रूप से कठिन है। इसका आशय उन द्वारों या खुलने के स्थानों से है जिनसे आकाश के तारे बाहर निकलते हैं।
    reason: textual_variant
  - marker: b
    text: 'कुछ पाठ-व्याख्याओं में आरंभिक अंश का भाव है: “मैंने देखा कि आकाश के तारे कैसे निकलते हैं, और मैंने उन द्वारों को गिना जिनसे वे निकलते हैं।” उपलब्ध साक्ष्य के कारण मुख्य पाठ अधिक संक्षिप्त रखा गया है।'
    reason: textual_variant
lexical_decisions:
- source_word: አፎ፡ ይወጽኡ፡ ከዋክብተ፡ ሰማይ
  choice: वे द्वार ... जिनसे आकाश के तारे निकलते हैं
  rationale: संदर्भ हनोक की ठोस ब्रह्मांडीय द्वार-कल्पना का है। उपलब्ध पाठ-साक्ष्य में आरंभिक पद-विन्यास कठिन है; इसलिए हिन्दी में स्वाभाविक वाक्य बनाते हुए तारों के निकलने के द्वारों का दृश्य सुरक्षित रखा गया है।
- source_word: ሙፃኣቲሆሙ
  choice: उनके निकलने के सभी मार्ग
  rationale: शब्द का संबंध ‘बाहर निकलने’ से है और वह निकलने के स्थानों अथवा मार्गों की ओर संकेत कर सकता है। ‘मार्ग’ हिन्दी में पठनीय रहते हुए इस अर्थ-विस्तार को बनाए रखता है।
- source_word: ለለ፩፩
  choice: हर एक को अलग-अलग
  rationale: यह वितरणसूचक अभिव्यक्ति प्रत्येक मार्ग या निर्गमन के अलग लेखे पर बल देती है।
- source_word: በኍልቆሙ፡ ወእስማቲሆሙ
  choice: उनकी संख्या, नाम
  rationale: सीधी शब्दावली उस व्यवस्थित गणना और नामकरण को सुरक्षित रखती है जिसका वर्णन पद में है।
- source_word: በደርጎሙ
  choice: क्रम
  rationale: मूल शब्द क्रम, व्यवस्था या पद का बोध करा सकता है। ‘क्रम’ खगोलीय सूची के संदर्भ में स्वाभाविक है और अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: ወምገባሮሙ
  choice: कार्य
  rationale: यह तारों की गतिविधि, संचालन या भूमिका का संकेत देता है। ‘कार्य’ संक्षिप्त और व्यापक है।
- source_word: ወጊዜሆሙ፡ ወአውራኂሆሙ
  choice: समय और महीनों
  rationale: यह अनुवाद तारों से संबंधित कालगत व्यवस्था को बिना ‘नियत’ जैसे व्याख्यात्मक तत्व जोड़े व्यक्त करता है।
- source_word: ኡርኤል፡ መልአክ፡ ዘምስሌየ፡ ቅዱስ
  choice: मेरे साथ रहनेवाले पवित्र स्वर्गदूत ऊरीएल
  rationale: विशेषणों और संबंधवाचक उपवाक्य को स्वाभाविक हिन्दी क्रम में रखा गया है।
theological_decisions:
- issue: तारों के निकलने की ब्रह्मांडीय छवि
  choice: तारों के ठोस स्वर्गीय द्वारों से निकलने की छवि को बनाए रखा गया
  alternative: इसे केवल ‘तारों का उदय होना’ या आधुनिक खगोलीय प्रेक्षण के रूप में कहना
  rationale: पद का प्रकाशनात्मक विश्व-दर्शन ठोस स्वर्गीय संरचनाओं का वर्णन करता है। उसे आधुनिक खगोल-विज्ञान के अनुरूप समतल करना मूल की साहित्यिक और धर्मवैचारिक विशेषता खो देगा।
- issue: ऊरीएल की भूमिका
  choice: ऊरीएल को वह पवित्र स्वर्गदूत कहा गया है जो हनोक के साथ था और उसे यह व्यवस्था दिखाता है
  alternative: ऊरीएल को इस व्यवस्था का निर्माता या नियंत्रक बताना
  rationale: मूल में उसकी भूमिका दिखाने वाले मार्गदर्शक की है; उससे आगे कोई धर्मवैचारिक दावा नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘आकाश के तारे’, ‘द्वार’, ‘क्रम’, ‘कार्य’ और ‘स्वर्गदूत’ जैसे शब्द साधारण पाठक के लिए स्पष्ट हैं तथा मूल की प्रकाशनात्मक ब्रह्मांडीय छवि को बनाए रखते हैं।
