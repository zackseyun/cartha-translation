base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/002.yaml
  text: And to the east of these beasts I saw the ends of the earth[a], where the heaven rests[d][c][b], and the open gates of heaven.
translation:
  language: hi
  text: और उन पशुओं के पूर्व में मैंने पृथ्वी के छोर[a] देखे, जहाँ आकाश टिका हुआ है[b], और आकाश के खुले हुए द्वार[c] देखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पृथ्वी की सीमाएँ।’ गीज़ अभिव्यक्ति संसार के दूरस्थ छोरों या सीमांतों को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: यह चित्र उस प्राचीन ब्रह्मांड-धारणा पर आधारित है जिसमें संसार के छोर पर आकाश के टिकने या सहारा पाने की कल्पना की गई है।
    reason: cultural_note
  - marker: c
    text: ‘आकाश के द्वार’ का अनुवाद ‘आकाश के झरोखे’ या ‘आकाश के खुले स्थान’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ጽባሖሙ ለእሉ አርዌ
  choice: उन पशुओं के पूर्व में
  rationale: गीज़ पदबंध में पूर्व दिशा और पशुओं, दोनों का स्पष्ट उल्लेख है; इसलिए इसे सामान्य अर्थ वाले ‘इनसे परे’ के रूप में नहीं लिया गया।
- source_word: አጽናፈ ምድር
  choice: पृथ्वी के छोर
  rationale: यह विश्व की दूरस्थ सीमाओं का ब्रह्मांडीय चित्र प्रस्तुत करता है। ‘छोर’ स्वाभाविक हिन्दी में उस प्राचीन भाव को बनाए रखता है।
- source_word: በኀበ ሰማይ የዐርፍ
  choice: जहाँ आकाश टिका हुआ है
  rationale: मूल में विश्राम करने या टिकने का ठोस चित्र है। ‘टिका हुआ है’ प्राचीन ब्रह्मांड-वर्णन को आधुनिक रूपक में बदले बिना सहज हिन्दी देता है।
- source_word: ኀዋኅወ ሰማይ ርኁዋተ
  choice: आकाश के खुले हुए द्वार
  rationale: संज्ञा स्वर्गीय संरचना के द्वारों या खुलने के स्थानों को सूचित कर सकती है। ‘द्वार’ गरिमापूर्ण, स्पष्ट और प्रसंगानुकूल है; विशेषण को ‘खुले हुए’ से व्यक्त किया गया है।
theological_decisions:
- issue: पृथ्वी के छोर पर आकाश के टिके होने का प्राचीन ब्रह्मांडीय चित्र
  choice: 'ठोस चित्र को बनाए रखा: ‘जहाँ आकाश टिका हुआ है’'
  alternative: ‘जहाँ आकाश पृथ्वी से मिलता है’ या ‘आकाश के क्षितिज पर’
  rationale: यह दर्शनात्मक ब्रह्मांड-वर्णन है। आधुनिक वैज्ञानिक भाषा में ढालने के बजाय पाठ की प्राचीन कल्पना और उसका तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण दर्शनात्मक शैली रखी गई है। ‘आकाश’ को ‘स्वर्ग’ पर प्राथमिकता दी गई, क्योंकि प्रसंग ब्रह्मांडीय संरचना का है। मुख्य वाक्य में ‘देखे’ की पुनरावृत्ति हिन्दी में दोनों कर्मों—पृथ्वी के छोर और खुले द्वार—को स्पष्ट रूप से क्रिया से जोड़ती है।
