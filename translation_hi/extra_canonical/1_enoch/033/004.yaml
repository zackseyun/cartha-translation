  yaml_path: translation/extra_canonical/1_enoch/033/004.yaml
  text: He showed me everything[a], and wrote it down for me; and again he wrote down for me their names, and their commands[c][b], and their companies.
translation:
  language: hi
  text: उसने मुझे सब कुछ दिखाया और उसे मेरे लिए लिख दिया; फिर उसने उनके नाम, उनके आदेश[a] और उनके दल[b] भी मेरे लिए लिख दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनके नियम’, ‘उनकी विधियाँ’ अथवा ‘उनकी निर्धारित व्यवस्थाएँ’। गीज़ शब्द आधिकारिक आदेश के साथ-साथ निर्धारित नियम भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उनके समूह’ अथवा ‘उनकी मंडलियाँ’। संभवतः आशय दर्शन में दिखाई गई व्यवस्थित श्रेणियों या विभागों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሎ
  choice: सब कुछ
  rationale: यह व्यापक सर्वनाम दिखाई गई समस्त बातों को समेटता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: አርአየኒ
  choice: उसने मुझे ... दिखाया
  rationale: मूल क्रिया का दृश्य और प्रत्यक्ष भाव बनाए रखा गया है; ‘प्रकट किया’ अपेक्षाकृत अधिक व्याख्यात्मक होता।
- source_word: ጸሐፈ ሊተ
  choice: मेरे लिए लिख दिया
  rationale: यह लिखकर दर्ज करने की क्रिया को व्यक्त करता है, पर लेखन के माध्यम के बारे में अनावश्यक विवरण नहीं जोड़ता।
- source_word: ወዓዲ
  choice: फिर ... भी
  rationale: यह पहले कथन के बाद जोड़ी गई लेखन-सामग्री को सहज हिन्दी में व्यक्त करता है और पुनरुक्ति को क्रमबद्ध रखता है।
- source_word: አስማቲሆሙ
  choice: उनके नाम
  rationale: बहुवचन संज्ञा और उसके सर्वनामिक प्रत्यय का सीधा अनुवाद है।
- source_word: ትእዛዞሙ
  choice: उनके आदेश
  rationale: शब्द का मूल आधिकारिक भाव सुरक्षित रहता है। ब्रह्मांडीय संदर्भ में ‘नियम’ या ‘निर्धारित व्यवस्थाएँ’ भी संभव हैं, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: ማኅበራቲሆሙ
  choice: उनके दल
  rationale: यह व्यवस्थित समूहों या विभागों का संकेत देता है और ‘सेनाएँ’ जैसी अतिरिक्त सैन्य धारणा जोड़े बिना आकाशीय विन्यास के अनुकूल है।
theological_decisions:
- issue: क्या अंतिम पदों को स्वर्गीय पिंडों अथवा प्राणियों की निश्चित श्रेणियों के रूप में स्पष्ट किया जाए
  choice: सर्वनाम ‘उनके’ और व्यापक शब्द ‘दल’ बनाए रखे गए हैं।
  alternative: ‘तारों की श्रेणियाँ’ या ‘स्वर्गीय सेनाएँ’
  rationale: निकटवर्ती संदर्भ आकाशीय व्यवस्थाओं की ओर संकेत करता है, पर इस पद में संदर्भित इकाइयों को स्पष्ट नाम नहीं दिया गया। इसलिए अनुवाद उस निहितार्थ को सिद्ध कथन नहीं बनाता।
- issue: ትእዛዞሙ को मौखिक आदेश माना जाए या ब्रह्मांडीय नियम
  choice: मुख्य पाठ में ‘आदेश’
  alternative: ‘नियम’, ‘विधियाँ’ या ‘निर्धारित व्यवस्थाएँ’
  rationale: गीज़ शब्द दोनों अर्थक्षेत्रों को ग्रहण कर सकता है। मुख्य पाठ उसके अधिक प्रत्यक्ष आधिकारिक अर्थ को रखता है, जबकि पादटिप्पणी संदर्भानुकूल नियमन का अर्थ सुरक्षित करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य में मूल की दोहराई गई लेखन-क्रिया सुरक्षित है। ‘आदेश’ और ‘दल’ के संभावित अर्थों को मुख्य पाठ में अति-विशिष्ट किए बिना पादटिप्पणियों में स्पष्ट किया गया है।
