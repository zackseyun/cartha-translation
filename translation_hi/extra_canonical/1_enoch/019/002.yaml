  yaml_path: translation/extra_canonical/1_enoch/019/002.yaml
  text: And their wives[a], the angels who went astray[c][b], will become like peaceful ones.
translation:
  language: hi
  text: और भटके हुए स्वर्गदूतों की स्त्रियाँ भी[a] साइरनों के समान[b] हो जाएँगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पत्नियाँ’। गीइज़ शब्द का अर्थ सामान्यतः ‘स्त्रियाँ’ और विशेषतः ‘पत्नियाँ’ दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘साइरन’ यहाँ प्राचीन पौराणिक परंपरा के स्त्री-प्राणियों के लिए है, आधुनिक चेतावनी-यंत्र के लिए नहीं। गीइज़ पद का इस वचन में पारंपरिक अर्थ यही समझा गया है।
    reason: historical_lexical_clarification
lexical_decisions:
- source_word: አንስትያሆሙኒ
  choice: स्त्रियाँ
  rationale: मूल शब्द ‘स्त्रियाँ’ या ‘पत्नियाँ’ दोनों अर्थ दे सकता है। मुख्य पाठ में ‘स्त्रियाँ’ रखने से वैवाहिक संबंध को अनावश्यक रूप से निश्चित नहीं किया गया; संबंधवाचक प्रत्यय और निकटवर्ती पदसमूह को स्वाभाविक हिन्दी में ‘भटके हुए स्वर्गदूतों की स्त्रियाँ’ के रूप में व्यक्त किया गया है।
- source_word: ስሑታን
  choice: भटके हुए
  rationale: यह पद भूलने या सही मार्ग से हटने का भाव रखता है। ‘भटके हुए’ उस नैतिक और दिशात्मक अर्थ को बनाए रखता है, जबकि ‘पापी’ अधिक सामान्य और ‘पतित’ अधिक व्याख्यात्मक होता।
- source_word: መላእክት
  choice: स्वर्गदूतों
  rationale: इस दर्शनात्मक प्रसंग में इसका संकेत स्वर्गीय प्राणियों की ओर है; इसलिए सामान्य ‘दूतों’ की अपेक्षा ‘स्वर्गदूतों’ अधिक स्पष्ट और स्वाभाविक है।
- source_word: ተከመ
  choice: के समान
  rationale: यह तुलना सूचित करता है, समान सत्ता या पहचान नहीं। ‘के समान’ रूपांतरण को तुलनात्मक ही रखता है।
- source_word: ሰላማዊያት
  choice: शांत जनों
  rationale: यह ‘शांति’ से बना बहुवचन विशेषण है, जो संज्ञा की तरह प्रयुक्त हो सकता है। ‘शांत जनों’ उसके बहुवचन और वर्णनात्मक रूप को बचाता है, यद्यपि इसका अर्थ ‘शांति में रहनेवाले’ भी हो सकता है।
- source_word: ይከውና
  choice: हो जाएँगी
  rationale: क्रिया किसी अवस्था में आने या बन जाने का भाव देती है; स्त्रीलिंग बहुवचन कर्ता के अनुरूप ‘हो जाएँगी’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: स्त्रियों के परिवर्तन का स्वरूप
  choice: वे शांत जनों के समान हो जाएँगी
  alternative: वे स्वयं स्वर्गदूत बन जाएँगी; अथवा वे शांति की अवस्था में आ जाएँगी
  rationale: तुलनासूचक ተከመ समानता बताता है, सत्ता की पूर्ण पहचान नहीं। अतः पाठ को ऐसा नहीं बनाया गया कि स्त्रियाँ वस्तुतः स्वर्गदूत ही बन जाती हैं।
- issue: ‘भटके हुए स्वर्गदूतों’ का वाक्यगत संबंध
  choice: इसे स्त्रियों का संबंध बताने वाला पदसमूह माना गया
  alternative: ‘उनकी स्त्रियाँ—वे भटके हुए स्वर्गदूत—’ के रूप में समानाधिकरण; अथवा स्वर्गदूतों को तुलना का आधार मानना
  rationale: ለስሑታን መላእክት को एक संबंधवाचक पदसमूह मानना गीइज़ क्रम के अनुकूल और हिन्दी में सर्वाधिक सुबोध है। फिर भी पाठ की संक्षिप्त संरचना कठिन है, इसलिए टिप्पणी में वैकल्पिक समझ का संकेत दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। अपोक्रिफीय-दर्शनात्मक स्वर बनाए रखते हुए कठिन गीइज़ वाक्यरचना को मुख्य पाठ में स्वाभाविक किया गया और वास्तविक अनिश्चितताएँ पादटिप्पणियों में सुरक्षित रखी गईं।
