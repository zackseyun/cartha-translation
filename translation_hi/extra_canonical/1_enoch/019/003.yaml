base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/019/003.yaml
  text: And I[a], Enoch, alone saw the vision, the ends of all things[b]; and no human being will see as I have seen.
translation:
  language: hi
  text: और केवल मैं, हनोक[b], ने सब वस्तुओं के छोरों[a] का दर्शन देखा; और मनुष्यों में से कोई भी वैसा नहीं देखेगा, जैसा मैंने देखा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हर चीज़ की दूरस्थ सीमाएँ।’ गीज़ अभिव्यक्ति अंतिम सिरों अथवा सीमाओं को दर्शा सकती है और उसमें स्थानिक तथा ब्रह्मांडीय दोनों अर्थ-छायाएँ हो सकती हैं।
    reason: lexical_alternative
  - marker: b
    text: नाम का अधिक सीधा गीज़ लिप्यंतरण ‘हेनोक’ है; हिंदी बाइबिल परंपरा के अनुसार मुख्य पाठ में ‘हनोक’ रखा गया है।
    reason: name_rendering
lexical_decisions:
- source_word: አርአያ
  choice: दर्शन
  rationale: यहाँ यह शब्द केवल किसी दृश्य या रूप के लिए नहीं, बल्कि प्रकाशित किए गए रहस्यदर्शी अनुभव के लिए आया है; इसलिए ‘दर्शन’ सर्वाधिक स्वाभाविक और प्रसंगानुकूल है।
- source_word: ባሕቲትየ
  choice: केवल मैंने
  rationale: यह रूप हनोक के अकेले और विशिष्ट दर्शक होने पर बल देता है। हिंदी में ‘केवल मैंने’ उसी बल को स्पष्ट रखता है।
- source_word: አጽናፈ ኵሉ
  choice: सब वस्तुओं के छोर
  rationale: አጽናፍ सीमा, अंतिम सिरा या छोर को व्यक्त कर सकता है। ‘सब वस्तुओं के छोर’ स्थानिक और व्यापक ब्रह्मांडीय दोनों संकेतों को बनाए रखता है, बिना इसे केवल पृथ्वी की सीमाओं या सब कुछ के अंत के रूप में निश्चित किए।
- source_word: አልቦ ዘይሬኢ እምሰብእ
  choice: मनुष्यों में से कोई भी वैसा नहीं देखेगा
  rationale: यह पद अन्य किसी मनुष्य द्वारा हनोक के समान देखने का निषेध करता है। ‘मनुष्यों में से कोई भी’ स्रोत के सामूहिक मानवीय अर्थ को बिना अनावश्यक पुरुष-विशेष भाषा के व्यक्त करता है।
- source_word: ከመ አነ ርኢኩ
  choice: जैसा मैंने देखा है
  rationale: तुलनात्मक वाक्यांश हनोक के पूर्ण और निजी अनुभव को रेखांकित करता है। ‘देखा है’ हिंदी में वर्तमान कथन से जुड़े पूर्ण अनुभव को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: हनोक के अद्वितीय प्रकाशन का विस्तार
  choice: हनोक एक ऐसे ब्रह्मांडीय दर्शन का दावा करता है जो ‘सब वस्तुओं के छोर’ तक विस्तृत है।
  alternative: इसे केवल पृथ्वी की भौतिक सीमाओं या प्रत्येक वस्तु के अंतिम परिणाम के रूप में समझना।
  rationale: गीज़ पद व्यापक और ब्रह्मांडीय है। अनुवाद उसकी स्थानिक तथा अंतिम-सीमा संबंधी संभावनाओं को खुला रखता है और रहस्यदर्शी तनाव को सपाट नहीं करता।
- issue: किसी अन्य मनुष्य के देखने की कालगत छाया
  choice: मुख्य पाठ में भविष्यसूचक ‘नहीं देखेगा’ रखा गया है।
  alternative: ‘नहीं देखता’ या ‘कोई देखनेवाला नहीं है’।
  rationale: गीज़ का अपूर्ण क्रियारूप वर्तमान या भविष्य की छाया ले सकता है। प्रसंग और परामर्श-पाठ भविष्यसूचक रूप का समर्थन करते हैं, पर पादटिप्पणी में दूसरी संभावना सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय किंतु सहज शैली रखी गई है। ‘वह दर्शन’ और अर्धविराम से मूल कथन की दो संबद्ध धाराएँ स्पष्ट होती हैं; ‘सब वस्तुओं के छोर’ की असामान्य ब्रह्मांडीय छवि जानबूझकर सुरक्षित रखी गई है।
