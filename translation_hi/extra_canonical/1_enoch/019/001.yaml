base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/019/001.yaml
  text: And Uriel said to me[a], “Here shall stand the angels who joined themselves with women; and their spirits, having taken on many forms, defile humankind and lead them astray so that they sacrifice to demons as to gods, until the day of the great judgment[d][c][b], on which they will be judged until they are finished.”
translation:
  language: hi
  text: और ऊरीएल ने मुझसे कहा, “यहाँ वे स्वर्गदूत खड़े रहेंगे जिन्होंने स्त्रियों के साथ अपने को जोड़ लिया था। अनेक रूप धारण करके[a], उनकी आत्माएँ[b] मनुष्यों को अशुद्ध कर चुकी हैं और उन्हें भटकाती रहती हैं[c], ताकि वे दुष्टात्माओं को देवताओं के समान बलि चढ़ाएँ—महान न्याय के दिन तक, जिस दिन उनका न्याय किया जाएगा, जब तक उनका अन्त पूरा न हो जाए[d]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अनेक प्रकार से दिखाई देकर।” गीज़ पदावली कठिन है और इसका संकेत उन विभिन्न प्रकट रूपों की ओर हो सकता है जिनके द्वारा ये आत्माएँ मनुष्यों को भ्रष्ट करती हैं।
    reason: lexical_alternative
  - marker: b
    text: “उनकी आत्माएँ” मूल का अक्षरशः रूप है। यह स्पष्ट नहीं है कि इससे स्वयं पतित सत्ताओं की आत्माएँ अभिप्रेत हैं, उनसे उत्पन्न आत्माएँ, या उनकी सन्तान से जुड़ी दुष्ट आत्माएँ।
    reason: alternative_reading
  - marker: c
    text: या, “मनुष्यों को अशुद्ध किया और उन्हें ऐसा भटकाया कि उन्होंने बलियाँ चढ़ाईं।” गीज़ में पहले पूर्ण और फिर अपूर्ण क्रिया-रूप आता है; मुख्य पाठ इस अन्तर को जारी प्रभाव के रूप में व्यक्त करता है।
    reason: grammatical_alternative
  - marker: d
    text: या, “जब तक उनका अन्त पूर्ण न हो जाए।” वाक्य न्याय की पूरी परिणति पर बल देता है, पर उसका ठीक आशय अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ተደሚሮሙ
  choice: अपने को जोड़ लिया था
  rationale: यह चुनाव क्रिया के आत्मवाचक भाव और स्त्रियों के साथ निषिद्ध संबंध—दोनों को बनाए रखता है, पर मूल से अधिक स्पष्ट यौन भाषा नहीं जोड़ता।
- source_word: ይቀውሙ
  choice: खड़े रहेंगे
  rationale: दर्शन में दण्डित स्वर्गदूतों की स्थिति और स्थान को व्यक्त करता है तथा साधारण ‘होंगे’ की अपेक्षा मूल का दृश्यात्मक और गंभीर भाव रखता है।
- source_word: መናፍስቲሆሙ
  choice: उनकी आत्माएँ
  rationale: गीज़ के बहुवचन और संबंधसूचक रूप का सीधा अनुवाद है; यह कठिन संदर्भ को बिना व्याख्यात्मक निष्कर्ष थोपे सुरक्षित रखता है।
- source_word: ብዙኃ ራእየ ከዊኖሙ
  choice: अनेक रूप धारण करके
  rationale: ‘दिखाई देना/रूप’ और ‘हो जाना’ से जुड़ी कठिन पदावली को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि विभिन्न प्रकट रूपों की सम्भावना खुली रहती है।
- source_word: አርኰስዎሙ
  choice: मनुष्यों को अशुद्ध कर चुकी हैं
  rationale: क्रिया के पूर्ण पक्ष को बनाए रखते हुए नैतिक और धार्मिक अशुद्धता, दोनों की छाया व्यक्त करता है।
- source_word: ያስሕትዎሙ
  choice: उन्हें भटकाती रहती हैं
  rationale: कारक और अपूर्ण/निरन्तर क्रिया-भाव को व्यक्त करता है तथा आगे चलने वाली मूर्तिपूजक क्रिया से स्वाभाविक संबंध बनाता है।
- source_word: ይሡዑ
  choice: बलि चढ़ाएँ
  rationale: व्यापक ‘आराधना करें’ की अपेक्षा मूल में निहित बलिदान की विशिष्ट क्रिया को सुरक्षित रखता है।
- source_word: አጋንንት
  choice: दुष्टात्माओं
  rationale: दemonic beings के लिए आधुनिक बाइबलीय हिन्दी में स्पष्ट और सहज पद है।
- source_word: ከመ አማልክት
  choice: देवताओं के समान
  rationale: यह स्पष्ट करता है कि दुष्टात्माओं को बलि का सम्मान देवताओं की तरह दिया जाता है, बिना उन्हें वास्तव में देवता घोषित किए।
- source_word: ዕለተ ዐባይ ኵነኔ
  choice: महान न्याय के दिन
  rationale: गीज़ की गंभीर प्रलयकालीन अभिव्यक्ति को स्वाभाविक और प्रतिष्ठित आधुनिक हिन्दी में रखता है।
- source_word: ይትኴነኑ
  choice: उनका न्याय किया जाएगा
  rationale: निष्क्रिय न्यायिक भाव को रखता है और ‘दोषी ठहराया जाएगा’ कहकर परिणाम को अनावश्यक रूप से क्रिया में नहीं जोड़ता।
- source_word: እስከ ይትፈጸሙ
  choice: जब तक उनका अन्त पूरा न हो जाए
  rationale: पूर्णता अथवा परिणति का भाव रखता है, लेकिन दण्ड के ठीक स्वरूप या अवधि को सिद्धान्ततः निर्धारित नहीं करता।
theological_decisions:
- issue: ‘उनकी आत्माएँ’ किन सत्ताओं की ओर संकेत करती हैं
  choice: संबंधसूचक पद को अक्षरशः ‘उनकी आत्माएँ’ रखा गया है।
  alternative: ‘उनसे निकली आत्माएँ’ या ‘उनकी सन्तानों की आत्माएँ’
  rationale: पद स्वयं यह निश्चित नहीं करता कि आशय पतित स्वर्गदूतों की आत्माओं, उनकी सन्तान से जुड़ी आत्माओं, या उनके सक्रिय प्रकट रूपों से है; इसलिए अनिश्चितता सुरक्षित रखी गई है।
- issue: अन्तिम वाक्यांश में न्याय की पूर्णता
  choice: ‘जब तक उनका अन्त पूरा न हो जाए’
  alternative: ‘जब तक उनका दण्ड पूरा न हो जाए’ या ‘जब तक वे पूरी तरह समाप्त न हो जाएँ’
  rationale: मूल पूर्ण होने या परिणति तक पहुँचने का संकेत देता है, पर विनाश, दण्ड की अवधि अथवा किसी विशिष्ट अन्तकालीन सिद्धान्त को स्पष्ट रूप से निर्धारित नहीं करता।
- issue: भूतकालीन अशुद्धता और जारी भटकाव का संबंध
  choice: ‘अशुद्ध कर चुकी हैं और उन्हें भटकाती रहती हैं’
  alternative: ‘अशुद्ध किया और उन्हें भटकाया’
  rationale: गीज़ में पूर्ण क्रिया के बाद अपूर्ण/जारी क्रिया आती है; हिन्दी में यह भेद रखा गया है ताकि आरम्भिक अशुद्धता और न्याय के दिन तक चलते प्रभाव का तनाव बना रहे।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर दर्शन और न्याय के प्रसंग के अनुरूप गंभीर तथा गरिमापूर्ण रखी गई है। ‘स्वर्गदूत’, ‘दुष्टात्मा’, ‘बलि चढ़ाना’ और ‘महान न्याय’ साधारण हिन्दी पाठकों के लिए परिचित धार्मिक पद हैं। वाक्य-विन्यास को स्रोत के निकट रखते हुए अत्यधिक संस्कृतनिष्ठ या सम्प्रदायविशेष की शब्दावली से बचा गया है।
