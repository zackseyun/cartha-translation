base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/005.yaml
  text: And I saw seven rivers upon the earth[a], greater than all the rivers[b]; and one of them comes from the west and pours its waters into the Great Sea.
translation:
  language: hi
  text: और मैंने पृथ्वी पर सात नदियाँ देखीं, जो सब नदियों से बड़ी थीं; उनमें से एक पश्चिम से आती है और अपना जल महान सागर[a] में उँडेलती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘महान सागर’ संभवतः भूमध्य सागर का भौगोलिक नाम है; इसे सामान्य अर्थ में ‘बड़ा सागर’ भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ፯ አፍላገ
  choice: सात नदियाँ
  rationale: मूल पाठ के आरम्भ में अंक ፯ स्पष्ट रूप से ‘सात’ है और बहुवचन संज्ञा नदियों अथवा जलधाराओं को सूचित करती है। प्रसंग में ‘नदियाँ’ सबसे स्वाभाविक है।
- source_word: ዲበ ምድር
  choice: पृथ्वी पर
  rationale: यह सीधा स्थानवाचक पद है; आधुनिक हिन्दी में ‘पृथ्वी पर’ स्पष्ट और गरिमापूर्ण है।
- source_word: ርኢኩ
  choice: मैंने ... देखीं
  rationale: यह प्रथम पुरुष में दर्शन-वर्णन का सामान्य क्रियापद है। ‘देखीं’ सहज हिन्दी है और नदियों के स्त्रीलिंग बहुवचन से मेल खाता है।
- source_word: ዓበይተ እምኵሎሙ አፍላገ
  choice: जो सब नदियों से बड़ी थीं
  rationale: तुलनात्मक रचना आकार अथवा परिमाण में श्रेष्ठता बताती है। ‘बड़ी’ व्यापक अर्थ बनाए रखती है और जल-प्रवाह की शक्ति जैसी अतिरिक्त धारणा नहीं जोड़ती।
- source_word: አሐዱ እምኔሆሙ
  choice: उनमें से एक
  rationale: यह समूह में से एक नदी को चुनने वाला सामान्य अंशवाचक प्रयोग है।
- source_word: ይመጽእ እምዓረብ
  choice: पश्चिम से आती है
  rationale: क्रिया और संबंधसूचक पद नदी के उद्गम अथवा आने की दिशा बताते हैं। मूल के वर्तमानकालीन वर्णन को बनाए रखा गया है।
- source_word: ውስተ ባሕር ዐቢይ
  choice: महान सागर में
  rationale: शब्दशः भाव ‘बड़े/महान सागर में’ है। ‘महान सागर’ संभावित भौगोलिक पदनाम और सामान्य वर्णन—दोनों की गुंजाइश बनाए रखता है।
- source_word: ይከዑ ማዮ
  choice: अपना जल ... उँडेलती है
  rationale: यह अभिव्यक्ति नदी के जल के सागर में प्रवाहित होने का सजीव चित्र देती है। हिन्दी में ‘अपना जल उँडेलती है’ उस ठोस बिंब को स्वाभाविक रूप से रखता है।
theological_decisions:
- issue: ‘महान सागर’ को निश्चित भौगोलिक नाम मानें या किसी बड़े सागर का सामान्य वर्णन
  choice: मुख्य पाठ में ‘महान सागर’ और पादटिप्पणी में दोनों संभावनाएँ
  alternative: इसे सीधे ‘भूमध्य सागर’ या केवल ‘एक बड़े सागर’ के रूप में अनूदित करना
  rationale: प्राचीन यहूदी भौगोलिक प्रयोग में यह भूमध्य सागर का जाना-पहचाना संकेत हो सकता है, पर गीइज़ शब्द स्वयं केवल ‘महान/बड़ा सागर’ कहते हैं। इसलिए अनुवाद अस्पष्टता को समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रूप अपनाया गया है। दर्शन-वर्णन के भूतकाल और नदी के सामान्य प्रवाह के वर्तमानकाल के बीच मूल पाठ का काल-परिवर्तन सुरक्षित रखा गया है।
