theological_decisions:
- issue: खगोलीय पुस्तक की ब्रह्मांडीय-भौगोलिक भाषा
  choice: दिशात्मक गति और प्राचीन समुद्री नामों को मूल रूप में बनाए रखना
  alternative: उन्हें आधुनिक भौगोलिक नामों से बदलना या सामान्य ‘समुद्र’ कहना
  rationale: यह पद एक संरचित ब्रह्मांड-वर्णन का भाग है। इसके नाम और दिशाएँ सुरक्षित रखने से प्राचीन अपोकैलिप्टिक विश्वदृष्टि को आधुनिक भूगोल में चुपचाप नहीं ढाला जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण। ‘उत्तर की ओर से’ स्रोत की स्थानिक अनिश्चितता बनाए रखता है। समुद्री नामों को आधुनिक भूगोल से पूर्णतः समान नहीं माना गया। सभी टिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
