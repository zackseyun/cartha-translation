base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/007.yaml
  text: And the four remaining ones go out by the north side to their own sea—two of them to the Eritrean Sea[d][c][b][a], and two to the Great Sea.
translation:
  language: hi
  text: और शेष चार उत्तर की ओर से निकलकर अपने समुद्र तक जाते हैं[a]—उनमें से दो एरित्रियाई सागर तक[b][d], और दो महान सागर तक[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने समुद्र की ओर जाते हैं।” गीज़ का पूर्वसर्ग सीमा (“तक”) और गंतव्य (“की ओर”)—दोनों सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “एरित्रियाई सागर” इथियोपियाई पाठ में आए प्राचीन भौगोलिक नाम को दर्शाता है; इसका क्षेत्र उस समुद्री प्रदेश से आंशिक रूप से मिल सकता है जिसे आज लाल सागर कहा जाता है।
    reason: cultural_note
  - marker: c
    text: “महान सागर” प्राचीन पारंपरिक पद का अनुवाद है, जो सामान्यतः भूमध्य सागर को दर्शाता था।
    reason: cultural_note
  - marker: d
    text: मूल पांडुलिपि-साक्ष्य में “दो ... और दो” के आसपास शब्दों की पुनरावृत्ति है। यह नकल की गड़बड़ी या विभाजन पर बल देने का परिणाम हो सकती है; अनुवाद में वाक्य का प्रत्यक्ष आशय दिया गया है।
    reason: textual_variant
