- source_word: እስከ ባሕረ ዚአሆሙ
  choice: अपने समुद्र तक
  rationale: እስከ की सीमा अथवा गंतव्य-संबंधी अस्पष्टता को ‘तक’ स्वाभाविक रूप से बनाए रखता है, और ዚአሆሙ के संबंध/अधिकार को ‘अपने’ व्यक्त करता है।
- source_word: ባሕረ ኤርትራ
  choice: एरित्रिया सागर
  rationale: गीज़ में सुरक्षित प्राचीन भौगोलिक नाम का निकट लिप्यंतरण है; इसे सीधे आधुनिक ‘लाल सागर’ बनाकर अर्थ को अनावश्यक रूप से संकुचित नहीं किया गया।
- source_word: ባሕር ዓቢይ
  choice: महासागर
