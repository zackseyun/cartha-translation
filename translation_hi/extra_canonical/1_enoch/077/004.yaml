base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/004.yaml
  text: I saw seven high mountains[a], which are higher than all the mountains that are on the earth; and from them frost comes forth[d][c][b], and days and seasons and years pass.
translation:
  language: hi
  text: मैंने सात ऊँचे पर्वत देखे, जो पृथ्वी के सभी पर्वतों से ऊँचे हैं; उनसे पाला[a] निकलता है, और दिन, ऋतुएँ[b] और वर्ष बीतते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हिमकारी धुंध’। मूल गीइज़ शब्द पाले अथवा बर्फीले शीत-उत्सर्जन का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘समय’ अथवा ‘नियत काल’। यहाँ प्रयुक्त गीइज़ शब्द ऋतुओं से अधिक व्यापक कालखंडों को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰብዓተ አድባረ ነዋኃነ
  choice: सात ऊँचे पर्वत
  rationale: संख्या और पर्वतों की ऊँचाई के प्रत्यक्ष दर्शनीय बिंब को सरल, स्वाभाविक हिन्दी में रखा गया है।
- source_word: ርኢኩ
  choice: मैंने ... देखे
  rationale: यह प्रथम पुरुष का सामान्य दर्शन-वृत्तांत है; ‘देखे’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक पुरातनता से बचता है।
- source_word: እለ ይነውሑ እምኵሉ አድባር እለ ውስተ ምድር
  choice: जो पृथ्वी के सभी पर्वतों से ऊँचे हैं
  rationale: मूल के तुलनात्मक कथन और पृथ्वी-व्यापी दायरे को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: ወእምኔሆሙ ይወፅእ
  choice: उनसे ... निकलता है
  rationale: यह पद उन पर्वतों से किसी वस्तु के बाहर आने का भौतिक बिंब देता है; ‘निकलता है’ स्पष्ट और स्वाभाविक है।
- source_word: አሰሐትያ
  choice: पाला
  rationale: मौसम-संबंधी प्रसंग में यह हिमकारी जमाव अथवा शीत के बिंब को सबसे सहज हिन्दी में व्यक्त करता है; संभावित अर्थांतर पादटिप्पणी में दिया गया है।
- source_word: ወየኀልፍ
  choice: बीतते हैं
  rationale: समयवाचक संज्ञाओं के साथ क्रिया का आशय समय का गुजरना है, नष्ट होना नहीं; ‘बीतते हैं’ आधुनिक हिन्दी में यही अर्थ देता है।
- source_word: መዋዕለ ወዘመን ወዓመት
  choice: दिन, ऋतुएँ और वर्ष
  rationale: काल-विभागों की त्रयी को बनाए रखा गया है। ‘ऋतुएँ’ खगोलीय-पंचांगीय प्रसंग के अनुकूल है, जबकि व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: पर्वतों, पाले और कालचक्र का संबंध
  choice: दर्शन में इन तीनों को साथ रखा गया है, पर उनके बीच का संबंध समझाया नहीं गया।
  alternative: पर्वतों को केवल भौतिक भूगोल या समय को नियंत्रित करने वाले स्वर्गीय क्षेत्रों का प्रतीक मानना।
  rationale: मूल पाठ न तो कोई यांत्रिक ब्रह्मांड-विज्ञान स्पष्ट करता है, न प्रतीकात्मक व्याख्या निर्धारित करता है; इसलिए अनुवाद उस तनाव और अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और दर्शनीय शैली के अनुकूल। वाक्य का असामान्य ब्रह्मांडीय संयोजन जानबूझकर बनाए रखा गया है; उसे किसी विशिष्ट सांप्रदायिक या प्रतीकात्मक व्याख्या में नहीं बदला गया।
