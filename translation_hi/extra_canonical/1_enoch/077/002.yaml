base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/002.yaml
  text: And the wind from the west is named Hegulā[b][a], because there all the lights of heaven fade and go down.
translation:
  language: hi
  text: और पश्चिम से आनेवाली हवा का नाम हेगुला है, क्योंकि वहाँ आकाश की सारी ज्योतियाँ क्षीण होती और नीचे उतरती हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आकाश की सारी ज्योतियाँ मद्धिम पड़ती और नीचे उतरती हैं।” ‘नीचे उतरती हैं’ से पश्चिम में उनके अस्त होने का संकेत हो सकता है।
    reason: ‘क्षीण होती’ के लिए स्वाभाविक वैकल्पिक अभिव्यक्ति देना और ‘नीचे उतरती हैं’ के संभावित खगोलीय आशय को बिना उसे मूल का अनिवार्य तकनीकी अर्थ बनाए स्पष्ट करना।
lexical_decisions:
- source_word: ነፋስ፡ እምዕራብ
  choice: पश्चिम से आनेवाली हवा
  rationale: ነፋስ यहाँ दिशागत हवा है और እም स्रोत सूचित करता है; यह हिन्दी में स्वाभाविक रूप से ‘पश्चिम से आनेवाली हवा’ है।
- source_word: ስሙ፡ ኀጕላ
  choice: उसका नाम हेगुला है
  rationale: नामकरण की गीइज़ अभिव्यक्ति को सहज हिन्दी में रखा गया है और व्यक्तिवाचक नाम का अनुवाद न करके देवनागरी लिप्यंतरण किया गया है।
- source_word: በህየ
  choice: वहाँ
  rationale: यह पहले उल्लिखित पश्चिमी दिशा या क्षेत्र की ओर संकेत करता है।
- source_word: የሐፅፁ
  choice: क्षीण होती
  rationale: क्रिया का अर्थ घटना, कम होना या मद्धिम पड़ना है; ‘क्षीण होती’ उस अर्थ को बनाए रखता है और मिट जाने का अनुचित बोध नहीं देता।
- source_word: ኵሉ፡ ብርሃናት፡ ሰማይ
  choice: आकाश की सारी ज्योतियाँ
  rationale: यह खगोलीय प्रकाश-पिंडों की सामूहिक अभिव्यक्ति है; ‘ज्योतियाँ’ गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य है।
- source_word: ወይወርዱ
  choice: और नीचे उतरती हैं
  rationale: मूल क्रिया उतरने की ठोस गति व्यक्त करती है; इसे केवल तकनीकी ‘अस्त होती हैं’ बनाकर अर्थ को संकरा नहीं किया गया।
theological_decisions:
- issue: खगोलीय घटना को तकनीकी शब्दावली में कहना या अपोकैलिप्टिक दृश्यात्मकता बनाए रखना
  choice: क्षीण होती और नीचे उतरती हैं
  alternative: मद्धिम पड़ती और अस्त होती हैं
  rationale: मूल में घटना और उतरना दोनों अलग क्रियाएँ हैं। चुना गया पाठ उस दृश्यात्मक तनाव को बनाए रखता है, जबकि पादटिप्पणी संभावित खगोलीय आशय स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण शैली। ‘आकाश की ज्योतियाँ’ अपोकैलिप्टिक-खगोलीय संदर्भ को बनाए रखता है। पदचिह्न [a] मुख्य पाठ में उपस्थित है।
