base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/001.yaml
  text: And they call the first wind the eastern one, because it is the first; and they call the second the south, because the Most High descends there, and there especially the Blessed One descends forever.
translation:
  language: hi
  text: वे पहली हवा को पूर्वी हवा[b] कहते हैं, क्योंकि वह पहली है; और दूसरी को दक्षिणी हवा कहते हैं, क्योंकि परमप्रधान वहाँ उतरता है[a], और विशेषकर वहीं सदा धन्य रहने वाला उतरता है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पद का उत्तरार्ध कठिन है। गीज़ पाठ ऐसा कहता प्रतीत होता है कि दक्षिणी हवा का यह नाम इसलिए है कि ‘परमप्रधान वहाँ उतरता है’; इसके बाद एक बलसूचक वाक्यांश आता है और फिर ‘सदा धन्य’ दैवी उपाधि के साथ उतरने का कथन दोहराया जाता है।
    reason: textual_variant
  - marker: b
    text: ‘पूर्वी’ के लिए प्रयुक्त शब्द का शाब्दिक संबंध भोर या सुबह से है और यहाँ वह पूर्व दिशा को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: 'व्याकरण की एक अन्य सम्भव समझ: ‘वह उतरता है, जो सदा धन्य है’ या ‘वह उतरता है—सदा धन्य।’'
    reason: previous_rendering
lexical_decisions:
- source_word: ይጼውዕዎ
  choice: वे … कहते हैं
  rationale: क्रिया का मूल अर्थ किसी नाम से पुकारना या कहना है। सक्रिय बहुवचन स्रोत की अवैयक्तिक वर्णन-शैली को बनाए रखता है।
- source_word: ለነፋስ
  choice: हवा
  rationale: मूल अर्थ ‘हवा’ है। अध्याय में हवाएँ दिशात्मक ब्रह्मांडीय क्षेत्रों से जुड़ी हैं, फिर भी मुख्य पाठ में मूल बिंब सुरक्षित रखा गया है।
- source_word: ቀዳማዊ
  choice: पहली
  rationale: यह सीधा क्रमवाचक अर्थ है और व्याख्यात्मक उपवाक्य में इसकी पुनरावृत्ति भी बनाए रखी गई है।
- source_word: ለጽባሓዊ
  choice: पूर्वी हवा
  rationale: शब्द भोर या सुबह से संबंधित है और यहाँ पूर्व दिशा का सूचक है। हिंदी में ‘पूर्वी हवा’ दिशात्मक अर्थ और हवा के बिंब दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: እስመ
  choice: क्योंकि
  rationale: यह नामकरण का कारण बताने वाला कारणवाचक संयोजक है।
- source_word: ለካልእ
  choice: दूसरी
  rationale: गणनात्मक संदर्भ में इसका अर्थ केवल ‘अन्य’ नहीं, बल्कि क्रम में ‘दूसरी’ है।
- source_word: አዜብ
  choice: दक्षिणी हवा
  rationale: यह दक्षिण या दक्षिणी क्षेत्र का दिशात्मक शब्द है। ‘दक्षिणी हवा’ हिंदी में स्पष्ट है और पूर्ववर्ती हवा-संबंधी संरचना के समानांतर रहता है।
- source_word: ልዑል
  choice: परमप्रधान
  rationale: यह ईश्वर के लिए प्रयुक्त ‘सबसे ऊँचा’ या ‘परम उच्च’ अर्थ वाला सम्मानसूचक पद है। ‘परमप्रधान’ हिंदी धार्मिक साहित्य में स्वाभाविक और संप्रदाय-निरपेक्ष है।
- source_word: ህየ
  choice: वहाँ / वहीं
  rationale: यह दक्षिणी क्षेत्र की ओर संकेत करने वाला स्थानवाचक क्रियाविशेषण है। स्रोत की पुनरावृत्ति को हिंदी में ‘वहाँ’ और बलसूचक ‘वहीं’ से व्यक्त किया गया है।
- source_word: ይወርድ
  choice: उतरता है
  rationale: क्रिया वास्तविक नीचे उतरने की गति बताती है। प्रकाशनात्मक ब्रह्मांड-वर्णन को रूपक या मौसम-संबंधी कथन में बदलने के बजाय यह ऊर्ध्वाधर गति सुरक्षित रखी गई है।
- source_word: ወፈድፋደ
  choice: और विशेषकर वहीं
  rationale: रूप कठिन है, पर वह अगले कथन को जोड़ता और प्रबल करता प्रतीत होता है। ‘विशेषकर’ अनिश्चितता को किसी अत्यधिक विशिष्ट अर्थ में बाँधे बिना बल व्यक्त करता है।
- source_word: ቡሩክ፡ ለዓለም
  choice: सदा धन्य रहनेवाला
  rationale: वाक्य-संरचना में यह दूसरी ‘उतरता है’ क्रिया के कर्ता के रूप में एक दैवी उपाधि प्रतीत होता है। हिंदी चयन इसे केवल क्रियाविशेषण न बनाकर व्यक्तिवाचक सम्मानसूचक पद के रूप में रखता है।
theological_decisions:
- issue: परमप्रधान के उतरने को वास्तविक प्रकाशनात्मक अवतरण मानना या उसे आशीष/ताप भेजने के रूप में नरम करना
  choice: ‘परमप्रधान वहाँ उतरता है’
  alternative: ‘परमप्रधान वहाँ [आशीष/ताप] उतारता है’ या ‘वहाँ से परमप्रधान उतरता है’
  rationale: गीज़ पाठ में दैवी उपाधि के साथ ‘उतरता है’ क्रिया स्पष्ट है। कठिन ब्रह्मांड-वर्णन को तर्कसंगत मौसम-विवरण में बदलने के बजाय उसका धार्मिक तनाव बनाए रखा गया है।
- issue: ቡሩክ፡ ለዓለም को दूसरी क्रिया का कर्ता मानना या पहली क्रिया के कर्ता का विधेयात्मक वर्णन
  choice: इसे ‘सदा धन्य रहनेवाला’ दैवी उपाधि के रूप में दूसरी ‘उतरता है’ क्रिया का कर्ता रखा गया है
  alternative: ‘वह उतरता है, और सदा धन्य है’ या ‘वह सदा के लिए धन्य होकर उतरता है’
  rationale: उपलब्ध गीज़ संरचना में यह पद दूसरे ይወርድ के साथ समानांतर कर्ता की तरह पढ़ा जा सकता है, यद्यपि वाक्यांश कठिन है; इसलिए वैकल्पिक व्याकरणिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण शैली। ‘हवा’ को बनाए रखकर ब्रह्मांडीय बिंब सुरक्षित किया गया है; ‘परमप्रधान’ और ‘सदा धन्य रहनेवाला’ संप्रदाय-विशेष की भाषा से बचते हुए दैवी उपाधियों का ऊँचा स्वर बनाए रखते हैं। कठिन उत्तरार्ध को मुख्य पाठ में अनावश्यक रूप से स्पष्ट नहीं किया गया।
