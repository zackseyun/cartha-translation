base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/006.yaml
  text: And the two of them come from the west as far as the sea[d][c][b][a], and they pour out their waters into the Erythraean Sea in the east.
translation:
  language: hi
  text: और वे दोनों पश्चिम से समुद्र तक आते हैं[a], और अपना जल पूर्व में एरिथ्राई सागर में उंडेल देते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वे दोनों’ से आशय पिछले प्रसंग में उल्लिखित दो नदियों से है।
    reason: referent_clarification
  - marker: b
    text: ‘एरिथ्राई सागर’ प्राचीन भूगोल का नाम है। यह लाल सागर को, अथवा उससे अधिक विस्तृत समुद्री क्षेत्र को, सूचित कर सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: ክልኤቱ፡ ክልኤ፡
  choice: वे दोनों
  rationale: दोहराया हुआ रूप स्पष्ट रूप से एक जोड़ी पर बल देता है; ‘वे दोनों’ इसे स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ይመጽኡ፡
  choice: आते हैं
  rationale: यह गति सूचित करने वाला सामान्य क्रियापद है और यहाँ वर्णित प्रवाह या मार्ग के लिए सहज है।
- source_word: እመስዕ፡
  choice: पश्चिम से
  rationale: इस प्रसंग में यह पद पश्चिम दिशा को सूचित करता है; इसी कारण दिशासूचक अर्थ मुख्य पाठ में रखा गया है।
- source_word: እስከ፡ ባሕር፡
  choice: समुद्र तक
  rationale: पूर्वसर्ग सीमा अथवा गंतव्य तक पहुँचने का भाव देता है; ‘समुद्र तक’ संक्षिप्त और स्वाभाविक है।
- source_word: ወይከዕዉ፡ ማዮሙ፡
  choice: अपना जल ... उंडेल देते हैं
  rationale: मूल क्रिया जल को बहाने या उंडेलने की सजीव छवि देती है; ‘उंडेल देते हैं’ उस चित्रात्मकता को सुरक्षित रखता है।
- source_word: በባሕረ፡ ኤርትራ፡ እምሥራቅ።
  choice: पूर्व में एरिथ्राई सागर में
  rationale: मूल पाठ एरिथ्रा/एरिथ्राई सागर का स्पष्ट नाम लेने के साथ पूर्व दिशा भी बताता है; अनिश्चित प्राचीन भौगोलिक पहचान को आधुनिक ‘लाल सागर’ मानकर सीमित नहीं किया गया।
