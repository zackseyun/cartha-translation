base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/003.yaml
  text: 'And the fourth wind[a], whose name is the North, is divided into three parts: one part for a dwelling for humankind, and another is over the seas of water of water, and over the abysses, and over the forests, and over the rivers, and over darkness, and over mist[g][f][e][d][c][b]; and the third part is in the garden of righteousness.'
translation:
  language: hi
  text: 'और चौथी हवा, जिसका नाम मेस्अ[a] है, तीन भागों में बँटी हुई है: उनमें से एक भाग मनुष्यों का निवास-स्थान है; दूसरा जल के समुद्रों[b], घाटियों, निर्जन प्रदेशों, नदियों, अंधकार और धुंध[c] पर है; और तीसरा भाग धार्मिकता के उद्यान[d] में है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मेस्अ” गीज़ नाम का लिप्यंतरण है; इसका ठीक अर्थ अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “जल के समुद्रों”; इसका आशय केवल “समुद्रों” से भी हो सकता है, पर यहाँ गीज़ की पूर्ण अभिव्यक्ति रखी गई है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ अनूदित शब्द का अर्थ अनिश्चित है; इसका अर्थ “कुहरा,” “बादल” या ऐसी ही कोई वायुमंडलीय वाष्प भी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: “धार्मिकता का उद्यान” अदन या परादीस की ओर संकेत कर सकता है, लेकिन गीज़ पाठ स्वयं इसकी पहचान स्पष्ट नहीं करता।
    reason: cross_reference
