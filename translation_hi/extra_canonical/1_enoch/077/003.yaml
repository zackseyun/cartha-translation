theological_decisions:
- issue: ‘धार्मिकता की वाटिका’ की पहचान
  choice: मूल अभिव्यक्ति को ज्यों का त्यों अर्थानुसार रखा गया
  alternative: अदन की वाटिका या स्वर्गलोक
  rationale: गीज़ वाक्यांश किसी अधिक विशिष्ट पहचान को अनिवार्य नहीं करता; इसलिए संभावित अदनी या पारादीसी संकेत को खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। मूल की त्रिभागी संरचना, भौगोलिक-ब्रह्मांडीय सूची और जहाँ आवश्यक हो वहाँ उसकी असामान्य पुनरुक्ति सुरक्षित रखी गई है।
