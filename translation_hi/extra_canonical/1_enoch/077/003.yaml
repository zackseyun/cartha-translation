- source_word: ዘስሙ መስዕ
  choice: जिसका नाम मेस्अ है
  rationale: गीज़ पाठ में दिए नाम को अनिश्चित अर्थ के कारण अनूदित करने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: ይትከፈል ሠለስተ ክፍለ
  choice: तीन भागों में बँटी हुई है
  rationale: कर्मवाच्य और तीन हिस्सों में विभाजन का अर्थ सहज आधुनिक हिन्दी में सुरक्षित है।
- source_word: ማኅደር ለሰብእ
  choice: मनुष्यों के निवास के लिए
  rationale: ማኅደር के निवास-स्थान संबंधी अर्थ तथा ሰብእ के सामूहिक मानव-संदर्भ को व्यक्त करता है।
- source_word: አብሕርት ማይ
  choice: जल के समुद्रों
  rationale: कुछ असामान्य लगने पर भी गीज़ की पूर्ण और पुनरुक्तिपूर्ण अभिव्यक्ति को बनाए रखा गया है।
- source_word: ቀላያት
  choice: घाटियों
  rationale: यह शब्द निचले भूभाग या घाटियों को सूचित करता है; संदर्भ में 'घाटियाँ' स्पष्ट और स्वाभाविक है।
- source_word: ፆም
  choice: निर्जन प्रदेशों
  rationale: मरुस्थलीय या उजाड़ भूभाग के व्यापक अर्थ को बिना केवल रेगिस्तान तक सीमित किए व्यक्त करता है।
- source_word: አፍላግ
  choice: नदियों
  rationale: बहते जलमार्गों के लिए सामान्य और स्पष्ट हिन्दी शब्द।
- source_word: ጽልመት
  choice: अंधकार
  rationale: ब्रह्मांडीय और भौगोलिक सूची में मूल का व्यापक चित्र यथावत रखता है।
- source_word: ጊሜ
  choice: धुंध
  rationale: वायुमंडलीय वाष्प के अनिश्चित अर्थ के लिए सहज हिन्दी; बादल या कुहरा भी संभव हैं।
- source_word: ገነት ጽድቅ
  choice: धार्मिकता की वाटिका
