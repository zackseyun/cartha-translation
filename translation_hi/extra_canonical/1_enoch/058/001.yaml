  text: And I began to speak the third parable concerning the righteous and concerning the chosen[a].
translation:
  language: hi
  text: और मैं धर्मियों और चुने हुओं के विषय में तीसरा दृष्टान्त[a] कहने लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तीसरा उपमा-सदृश प्रवचन।’ गीइज़ शब्द दृष्टान्त, उपमा या ऐसे प्रवचन-शीर्षक को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: አኀዝኩ እበል
  choice: मैं ... कहने लगा
  rationale: क्रिया और उसके पूरक का संयुक्त अर्थ नए प्रवचन का आरम्भ करना है; आधुनिक हिन्दी में ‘कहने लगा’ सहज और सटीक है।
- source_word: ሣልሰ ምሳሌ
  choice: तीसरा दृष्टान्त
  rationale: ምሳሌ दृष्टान्त, उपमा या नीतिवचन-सदृश कथन को सूचित कर सकता है। यहाँ यह तीसरे बड़े प्रवचन-खंड का साहित्यिक नाम है; ‘दृष्टान्त’ अर्थ और गरिमा दोनों बनाए रखता है।
- source_word: በእንተ ጻድቃን
  choice: धर्मियों ... के विषय में
  rationale: በእንተ विषय-सूचक है, और ጻድቃን बहुवचन में उन लोगों का पदनाम है जो धर्मी हैं।
- source_word: ወበእንተ ኅሩያን
  choice: और चुने हुओं के विषय में
  rationale: ኅሩያን का मूल आशय चुने गए लोगों से है। ‘चुने हुए’ स्थानीय पहचान-सूचक अर्थ को रखता है और बाद की किसी विशिष्ट धर्मवैज्ञानिक प्रणाली को आरोपित नहीं करता।
theological_decisions:
- issue: ኅሩያን समूह-पद का अनुवाद
  choice: चुने हुए
  alternative: निर्वाचित जन
  rationale: ‘चुने हुए’ सामान्य आधुनिक हिन्दी में स्पष्ट है और पाठ की अपोकैलिप्टिक श्रेणी को सुरक्षित रखते हुए अनावश्यक पारिभाषिक या सम्प्रदायगत अर्थ से बचता है।
- issue: ምሳሌ का साहित्यिक नाम
  choice: दृष्टान्त
  alternative: उपमा; दृष्टान्त-सदृश प्रवचन
  rationale: यह शब्द यहाँ तीसरे प्रमुख प्रवचन-खंड को प्रस्तुत करता है। ‘दृष्टान्त’ पठनीय है, जबकि पाद-टिप्पणी मूल शब्द की व्यापक अर्थ-सीमा बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘धर्मी’ और ‘चुने हुए’ मूल पाठ के आवर्ती समूह-पदों को बिना सम्प्रदायगत विस्तार के सुरक्षित रखते हैं।
