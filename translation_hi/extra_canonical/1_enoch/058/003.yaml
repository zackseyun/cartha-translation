base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/058/003.yaml
  text: And the righteous shall be in the light of the sun[a], and the chosen in the light of eternal life; and there shall be no end to the days of their life[b], and the holy ones shall have days without number.
translation:
  language: hi
  text: और धर्मी सूर्य के प्रकाश में होंगे, और चुने हुए अनन्त जीवन के प्रकाश में। उनके जीवन के दिनों का कोई अन्त न होगा, और पवित्र जनों के दिन अनगिनत होंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पवित्र जनों के दिनों की कोई गिनती न होगी।” यह मुहावरा बहुत बड़ी संख्या मात्र नहीं, बल्कि असीम अवधि पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ጻድቃን
  choice: धर्मी
  rationale: यह बहुवचन संज्ञात्मक विशेषण उन लोगों को दर्शाता है जिनकी पहचान धार्मिकता से होती है; ‘धर्मी’ आधुनिक हिन्दी में स्वाभाविक और पारंपरिक दोनों है।
- source_word: በብርሃነ ፀሐይ
  choice: सूर्य के प्रकाश में
  rationale: यह अनुवाद मूल की प्रकाश-संबंधी विश्वात्मक छवि को बनाए रखता है और हिन्दी में स्पष्ट है।
- source_word: ኅሩያን
  choice: चुने हुए
  rationale: यह परमेश्वर द्वारा चुने गए समूह का बोध कराता है; ‘चुने हुए’ सुलभ है और किसी बाद की विशिष्ट धर्मवैज्ञानिक शब्दावली का अनावश्यक भार नहीं लाता।
- source_word: በብርሃነ ሕይወት ዘለዓለም
  choice: अनन्त जीवन के प्रकाश में
  rationale: मूल में जीवन और प्रकाश की संयुक्त दर्शनात्मक छवि को बनाए रखते हुए यह पदबंध सहज हिन्दी देता है।
- source_word: ማኅለቆተ አልቦቱ መዋዕለ ሕይወቶሙ
  choice: उनके जीवन के दिनों का कोई अन्त न होगा
  rationale: यह मूल के ‘दिन’ और ‘अन्त’ दोनों विचारों को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ቅዱሳን
  choice: पवित्र जनों
  rationale: ‘पवित्र जन’ मूल की व्यापक श्रेणी को व्यक्त करता है और ‘सन्त’ से जुड़ी बाद की संस्थागत धारणाओं से बचता है।
- source_word: ኍልቈ መዋዕለ አልቦሙ
  choice: दिन अनगिनत होंगे
  rationale: शाब्दिक मुहावरा ‘उनके दिनों की कोई गिनती नहीं’ असीम अवधि बताता है; ‘दिन अनगिनत होंगे’ उसका स्वाभाविक और अर्थनिष्ठ हिन्दी रूप है।
theological_decisions:
- issue: ኅሩያን को किसी पारंपरिक धर्मवैज्ञानिक पद से व्यक्त करना या सामान्य भाषा में
  choice: चुने हुए
  alternative: निर्वाचित जन
  rationale: ‘चुने हुए’ पाठ की समूह-संज्ञा को सुरक्षित रखते हुए आधुनिक पाठक के लिए स्पष्ट रहता है और बाद की सम्प्रदायगत अवधारणाएँ आरोपित नहीं करता।
- issue: पवित्र जनों के दिनों वाली अन्तिम उक्ति का रूप
  choice: पवित्र जनों के दिन अनगिनत होंगे
  alternative: पवित्र जनों के दिनों की कोई गिनती न होगी
  rationale: चुना हुआ रूप मूल मुहावरे की असीम अवधि को स्पष्ट करता है और ‘कोई दिन नहीं’ जैसा भ्रामक अर्थ उत्पन्न नहीं होने देता; पादटिप्पणी अधिक शाब्दिक रूप सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘प्रकाश’, ‘दिन’ और समानांतर समूह-संज्ञाओं को बनाए रखकर पद की दर्शनात्मक लय और संरचना सुरक्षित की गई है।
