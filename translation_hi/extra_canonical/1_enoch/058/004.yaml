  yaml_path: translation/extra_canonical/1_enoch/058/004.yaml
  text: And they will seek the light and find righteousness with the Lord of Spirits[c][b][a]. Peace be to the righteous in the name of the Lord of Eternity.
translation:
  language: hi
  text: और वे ज्योति की खोज करेंगे और आत्माओं के प्रभु के यहाँ धार्मिकता पाएँगे[a]। अनंतकाल के प्रभु[b] के नाम में धर्मियों को शांति मिले[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धार्मिकता प्राप्त करेंगे”; मूल क्रिया में ‘पाना’ और ‘प्राप्त करना’ दोनों अर्थ संभव हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “युग के प्रभु,” “सनातन प्रभु” अथवा “संसार के प्रभु”; मूल शब्द का अर्थ ‘युग,’ ‘अनंतता’ या ‘संसार’ हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “धर्मियों के लिए शांति है”; मूल वाक्यांश आशीर्वाद या उद्घोषणा, दोनों रूपों में समझा जा सकता है।
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: የኃሥሡ
  choice: खोज करेंगे
  rationale: बहुवचन क्रिया का अर्थ ‘खोजना’ है; दर्शनात्मक भावी प्रसंग के अनुरूप हिन्दी में भविष्यकाल रखा गया है।
- source_word: ለብርሃን
  choice: ज्योति
  rationale: मूल बिंब को बनाए रखते हुए इसे खोजी जाने वाली वस्तु के रूप में व्यक्त किया गया है; ‘ज्योति’ गरिमापूर्ण और सहज धार्मिक हिन्दी है।
- source_word: ይረክቡ
  choice: पाएँगे
  rationale: क्रिया में ‘पाना’ और ‘प्राप्त करना’ दोनों अर्थ संभव हैं। ‘खोज करेंगे…पाएँगे’ मूल समानांतरता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ጽድቀ
  choice: धार्मिकता
  rationale: यहाँ नैतिक-धार्मिक अर्थ अगले पदांश के ‘धर्मियों’ से जुड़ता है; ‘न्याय’ संभव होते हुए भी कम उपयुक्त है।
- source_word: በኀበ
  choice: के यहाँ
  rationale: यह निकटता, उपस्थिति अथवा किसी के पास उपलब्ध होने का भाव खुला रखता है; ‘के साथ’ की अपेक्षा हिन्दी में धार्मिकता पाने के संदर्भ में अधिक स्वाभाविक है।
- source_word: እግዚአ መናፍስት
  choice: आत्माओं के प्रभु
  rationale: हनोक का विशिष्ट ईश्वरीय संबोधन यथासंभव औपचारिक रूप में सुरक्षित रखा गया है।
- source_word: ሰላም ለጻድቃን
  choice: धर्मियों को शांति मिले
  rationale: वाक्यांश के आशीर्वादात्मक अथवा उद्घोषणात्मक बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: በስመ
  choice: के नाम में
  rationale: मूल सूत्रात्मक अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के पारदर्शी रूप से रखा गया है।
- source_word: እግዚአ ዓለም
  choice: युगों के प्रभु
  rationale: ዓለም में युग, अनंतता और संसार की अर्थ-छायाएँ हैं। हिन्दी बहुवचन ‘युगों’ कालातीत सार्वभौमिकता को व्यक्त करता है और ‘एक युग के प्रभु’ जैसी सीमित ध्वनि से बचता है।
theological_decisions:
- issue: ጽድቀ को पाने का स्थान या स्रोत
  choice: आत्माओं के प्रभु के यहाँ धार्मिकता पाएँगे
  alternative: आत्माओं के प्रभु की उपस्थिति में धार्मिकता पाएँगे / उनसे धार्मिकता प्राप्त करेंगे
  rationale: मूल संबंधसूचक पद निकटता, उपस्थिति या स्रोत का संकेत दे सकता है। ‘के यहाँ’ किसी एक अर्थ को अनावश्यक रूप से अंतिम नहीं बनाता।
- issue: अंतिम ईश्वरीय उपाधि እግዚአ ዓለም
  choice: युगों के प्रभु
  alternative: अनंतकाल के प्रभु / सनातन प्रभु / संसार के प्रभु
  rationale: यह रूप मूल शब्द के कालगत विस्तार और ईश्वर की सार्वकालिक प्रभुता को बनाए रखता है। वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं ताकि वास्तविक अस्पष्टता सुरक्षित रहे।
- issue: ሰላም वाक्य का प्रकार
  choice: धर्मियों को शांति मिले
  alternative: धर्मियों के लिए शांति है / धर्मियों को शांति
  rationale: मूल में स्पष्ट क्रिया नहीं है; हिन्दी का आशीर्वादात्मक रूप प्रसंग के अनुरूप है, पर उद्घोषणात्मक अर्थ भी संभव है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और पाठयोग्य शैली अपनाई गई है। ‘ज्योति,’ ‘धार्मिकता,’ ‘धर्मी’ और ‘प्रभु’ जैसे परिचित धार्मिक शब्द मूल के बिंब और पदावली को सुरक्षित रखते हैं।
