- source_word: ወእምድኅረዝ
  choice: और इसके बाद
  rationale: यह कालसूचक पद दर्शन के अगले चरण को पिछले प्रसंग से जोड़ता है; यह अनुवाद सहज आधुनिक हिन्दी में उस क्रम को बनाए रखता है।
- source_word: ይትበሀል
  choice: यह कहा जाएगा
