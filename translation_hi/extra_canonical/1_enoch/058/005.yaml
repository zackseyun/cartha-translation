  choice: पहचान को अनिर्धारित रखते हुए व्यापक पद 'पवित्र जन' रखा गया है।
  alternative: स्वर्गदूत; स्वर्ग में रहने वाले धर्मी; चुने हुए लोग
  rationale: हनोक साहित्य में यह पद स्वर्गीय प्राणियों अथवा पवित्र ठहराए गए मनुष्यों के लिए आ सकता है; यह छोटा उपवाक्य किसी एक पहचान को निश्चित नहीं करता।
