  choice: चुने हुए लोग
  alternative: निर्वाचित जन
  rationale: यह वाचायी और युगान्त-संबंधी अर्थ की संभावना बनाए रखता है, पर पद में बाद की व्यवस्थित धर्मवैज्ञानिक धारणाएँ नहीं जोड़ता।
