lexical_decisions:
- source_word: ብፁዓን
  choice: धन्य
  rationale: आशीर्वचन की ऊँची और धार्मिक शैली को बनाए रखता है; ‘सुखी’ यहाँ अपेक्षाकृत कमजोर पड़ता।
- source_word: አንትሙ
  choice: तुम ... हो
  rationale: मूल के प्रत्यक्ष द्वितीय-पुरुष बहुवचन संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ጻድቃን
  choice: धर्मी
  rationale: पुस्तक में धर्मियों और दुष्टों के बीच बार-बार आने वाले विरोध को स्पष्ट रखते हुए प्रचलित बाइबलीय अर्थ देता है।
- source_word: ወኅሩያን
  choice: चुने हुए लोग
  rationale: बहुवचन संज्ञात्मक अर्थ को बनाए रखता है और ‘निर्वाचित’ जैसे अधिक तकनीकी, बाद के धर्मवैज्ञानिक अर्थभार से बचता है।
- source_word: እስመ
  choice: क्योंकि
  rationale: आशीष का कारण प्रस्तुत करने वाले मूल संयोजक को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ስቡሕ
  choice: महिमामय
  rationale: भाग की महिमा और वैभव का भाव व्यक्त करता है; ‘प्रशंसित’ इस संदर्भ में कम स्वाभाविक है।
- source_word: ክፍልክሙ
  choice: तुम्हारा भाग
  rationale: नियत हिस्से अथवा विरासत-सदृश अंश की मूल छवि को संक्षिप्त बाइबलीय हिन्दी में सुरक्षित रखता है।
