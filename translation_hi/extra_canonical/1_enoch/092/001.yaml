base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/092/001.yaml
  text: The book written by Hanok—[Hanok indeed wrote every sign of wisdom[a], praised among all people and a judge of all the earth]—for all my children who will dwell on the dry land[d][c][b], and for the generations to come who practice righteousness and peace.
translation:
  language: hi
  text: हनोक द्वारा लिखी गई पुस्तक—[हनोक ने वास्तव में बुद्धि का हर चिह्न लिखा; वह सब लोगों के बीच प्रशंसित और सारी पृथ्वी का न्यायाधीश था][a]—मेरी उन सभी संतानों के लिए जो सूखी भूमि[b] पर निवास करेंगी, और आने वाली पीढ़ियों[c] के लिए, जो धार्मिकता और शांति का आचरण करेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोष्ठकों में रखा अंश उपलब्ध इथियोपिक साक्ष्य की इस पंक्ति में पाठगत रूप से अस्थिर प्रतीत होता है; इसलिए उसे हटाने के बजाय सावधानी से, अपेक्षाकृत शाब्दिक रूप में रखा गया है। “न्यायाधीश” का अनुवाद “शासक” भी हो सकता है।
    reason: textual_variant
  - marker: b
    text: “सूखी भूमि” इथियोपिक पद का शाब्दिक रूप है; अर्थ को सहज बनाने के लिए कुछ अनुवादों में यहाँ “पृथ्वी” या “संसार” कहा जाता है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ की पाठ-परंपरा और लिप्यंतरण कठिन हैं। मुख्य पाठ उस पठन का अनुसरण करता है जिसका अर्थ “आने वाली पीढ़ियाँ” है; एक अन्य पठन को “चुने हुए लोग” अथवा “चुनी हुई पीढ़ी” समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ዘተጽሕፈ፡ እምሄኖክ፡ መጽሐፍ
  choice: हनोक द्वारा लिखी गई पुस्तक
  rationale: निष्क्रिय संबंधवाचक रूप और ‘पुस्तक’ को शीर्षक-सदृश, स्वाभाविक हिन्दी में रखा गया है।
- source_word: ኵሉ፡ ትእምርተ፡ ጥበብ
  choice: बुद्धि का हर चिह्न
  rationale: ኵሉ को ‘हर’ और एकवचन ትእምርተ को ‘चिह्न’ अनूदित किया गया है; ‘चिह्न’ मूल की ऊँची, प्रकाशनात्मक शैली बनाए रखता है।
- source_word: እምኵሉ፡ ሰብእ፡ ስቡሕ
  choice: सब लोगों के बीच प्रशंसित
  rationale: यह रूप हनोक को लोगों के समुदाय में प्रशंसित बताता है और कारक-संबंध को अनावश्यक रूप से कठोर नहीं बनाता।
- source_word: መኰንነ፡ ኵሉ፡ ምድር
  choice: सारी पृथ्वी का न्यायी
  rationale: መኰንነ अधिकारयुक्त न्यायी अथवा शासक का बोध करा सकता है; यहाँ अंग्रेज़ी परामर्श-पाठ और प्रसंग के अनुरूप ‘न्यायी’ रखा गया है।
- source_word: ለኵሎሙ፡ ውሉድየ
  choice: मेरी उन सभी संतानों के लिए
  rationale: ‘संतानें’ पारिवारिक संबोधन को बनाए रखते हुए केवल पुरुष वंशजों तक अर्थ को सीमित नहीं करता।
- source_word: የኃድሩ፡ ዲበ፡ የብስ
  choice: जो सूखी भूमि पर निवास करेंगी
  rationale: संबंधवाचक वाक्य को निकटवर्ती ‘मेरी सभी संतानों’ से जोड़ा गया है और ठोस अभिव्यक्ति ‘सूखी भूमि’ को सामान्य ‘संसार’ बनाकर समतल नहीं किया गया।
- source_word: ለትውልድ፡ ይኃርያን
  choice: आने वाली पीढ़ियों के लिए
  rationale: पाठ-समीक्षा में अंतिम शब्द को भावी अथवा बाद की पीढ़ियों की ओर संकेत करने वाला माना गया है; इसलिए ‘चुने हुए’ की दोहरी व्याख्या को मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ይገብሩ፡ ርተዐ፡ ወሰላመ
  choice: जो धार्मिकता और शांति का आचरण करेंगी
  rationale: क्रिया को केवल गुणधर्म के बजाय सक्रिय आचरण के रूप में व्यक्त किया गया है; दोनों प्रमुख नैतिक संज्ञाएँ अक्षुण्ण रखी गई हैं।
theological_decisions:
- issue: अंतिम कठिन पद को ‘चुने हुए’ समझा जाए या ‘आने वाली’ पीढ़ियों का विशेषण
  choice: आने वाली पीढ़ियाँ
  alternative: चुने हुए लोग / चुनी हुई पीढ़ी
  rationale: उपलब्ध पाठ-समीक्षा इसे प्रतिलिपि अथवा OCR की समस्या मानते हुए ‘बाद की/भावी’ अर्थ वाली पठन-परंपरा का समर्थन करती है। वैकल्पिक धार्मिक अर्थ को मुख्य पाठ में आरोपित करने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
- issue: መኰንነ का पदगत अर्थ
  choice: न्यायी
  alternative: शासक
  rationale: शब्द न्यायिक और शासकीय अधिकार दोनों व्यक्त कर सकता है। ‘न्यायी’ परामर्श-पाठ के निकट है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। शीर्षक-जैसी आरंभिक संरचना और अपोकैलिप्टिक शब्दावली को बचाया गया है। पाठगत अनिश्चितता को कोष्ठक और पादटिप्पणियों में स्पष्ट किया गया है, मुख्य पाठ में किसी विशेष सांप्रदायिक अर्थ को निर्णायक नहीं बनाया गया।
