base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/092/002.yaml
  text: Do not let your spirit be grieved because of the times[a], for the Holy and Great One has appointed days for all.
translation:
  language: hi
  text: समयों के कारण अपनी आत्मा को दुःखी न होने दो, क्योंकि पवित्र और महान ने सबके लिए[a] दिन निर्धारित किए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सब वस्तुओं के लिए’ अथवा ‘हर व्यक्ति के लिए।’ गीइज़ का अंतिम पदबंध व्यापक है और सभी वस्तुओं या सभी लोगों—दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: አትሕዝኑ
  choice: दुःखी न होने दो
  rationale: निषेधात्मक आज्ञा शोक या दुःख को व्यक्त करती है। ‘अपनी आत्मा को दुःखी न होने दो’ मूल के आंतरिक भाव और उसके प्रत्यक्ष कर्म को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: መንፈስክሙ
  choice: अपनी आत्मा
  rationale: मूल शब्द आत्मा, श्वास या भीतरी अवस्था का बोध करा सकता है। यहाँ ‘आत्मा’ ऊँची शैली और व्यक्ति के भीतरी जीवन—दोनों को सुरक्षित रखता है।
- source_word: በአዝማን
  choice: समयों के कारण
  rationale: पूर्वसर्ग सहित बहुवचन संज्ञा को यहाँ दुःख के कारण के रूप में समझना प्रसंगानुकूल है; ‘समयों’ से संकटपूर्ण ऐतिहासिक कालों का व्यापक भाव भी बना रहता है।
- source_word: መዋዕለ
  choice: दिन
  rationale: शब्द का सीधा अर्थ ‘दिन’ है। यद्यपि प्रसंग में इसका आशय निर्धारित अवधियों से भी हो सकता है, ठोस मूल रूप को रखा गया है।
- source_word: ወሀበ
  choice: ठहरा दिए हैं
  rationale: क्रिया का मूल अर्थ ‘दिया’ है, पर दिनों के साथ यह निर्धारित या नियुक्त करने का भाव देती है। ‘ठहरा दिए हैं’ इस प्रसंग में स्वाभाविक है और दैवी काल-व्यवस्था का संकेत देता है।
- source_word: ቅዱስ ወዐቢይ
  choice: उस पवित्र और महान
  rationale: दोनों विशेषण मिलकर एक श्रद्धापूर्ण दैवी उपाधि बनाते हैं। हिन्दी में ‘उस पवित्र और महान’ संज्ञा जोड़े बिना मूल की उपाधिमूलक और कुछ हद तक गूढ़ शैली बनाए रखता है।
- source_word: ለኵሉ
  choice: सभी के लिए
  rationale: मूल पदबंध व्यापक है और ‘सब’, ‘सब लोगों’ या ‘सब वस्तुओं’ की ओर संकेत कर सकता है। ‘सभी के लिए’ मुख्य पाठ में इस व्यापकता को यथासंभव खुला रखता है; अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
theological_decisions:
- issue: ‘सभी के लिए’ में दैवी निर्धारण का दायरा
  choice: सभी के लिए
  alternative: सब वस्तुओं के लिए; हर व्यक्ति के लिए
  rationale: मूल यह स्पष्ट नहीं करता कि संकेत सभी लोगों की ओर है या समस्त वस्तुओं/घटनाओं की ओर। मुख्य पाठ व्यापक अभिव्यक्ति रखता है और पादटिप्पणी दोनों संभावनाएँ बताती है, ताकि इतिहास पर दैवी व्यवस्था के कथन को अनावश्यक रूप से सीमित न किया जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और उपदेशात्मक रखी गई है। ‘उस पवित्र और महान’ मूल की दैवी उपाधि को ‘परमेश्वर’ जैसा स्पष्ट संज्ञा-पद जोड़े बिना व्यक्त करता है। बहुवचन श्रोताओं के लिए ‘अपनी आत्मा’ सामूहिक/वितरणात्मक हिन्दी प्रयोग है।
