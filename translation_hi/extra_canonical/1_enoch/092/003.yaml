base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/092/003.yaml
  text: And the righteous one shall rise from sleep[a], and he shall arise and walk in the path of righteousness[d][c][b]; and all his path and his course shall be in goodness and in everlasting kindness.
translation:
  language: hi
  text: और धर्मी जन नींद से उठेगा[a], उठ खड़ा होगा और धार्मिकता के मार्ग पर चलेगा; और उसका पूरा मार्ग और उसकी गति भलाई और अनन्त दया में होंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नींद से” वास्तविक नींद की छवि भी हो सकती है और नए जीवन में जागने का रूपक भी; यह पद स्वयं किसी एक अर्थ को अनिवार्य नहीं करता।
    reason: lexical_alternative
  - marker: b
    text: “अनन्त दया” का अनुवाद “सदा की करुणा,” “चिरस्थायी कोमलता” या “नित्य अनुग्रह” भी किया जा सकता है; गीज़ शब्द का अर्थ-क्षेत्र इन भावों को समेटता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ጻድቅ
  choice: धर्मी जन
  rationale: एकवचन और व्यक्तिवाचक बल को बनाए रखता है, पर किसी विशेष मसीही या सामूहिक पहचान को आरोपित नहीं करता।
- source_word: እምንዋም
  choice: नींद से
  rationale: እም स्रोत या अलगाव को और ንዋም नींद को व्यक्त करता है। यह रूपक को खुला रखता है।
- source_word: ይትነሣእ … ይትነሣእ
  choice: उठेगा … उठ खड़ा होगा
  rationale: दोहराए गए क्रियापद का आलंकारिक बल रखा गया है। दूसरी क्रिया से पहले स्रोत में संयोजक न होने के कारण हिन्दी में भी वहाँ अलग से ‘और’ नहीं जोड़ा गया।
- source_word: የኃልፍ በፍኖተ ጽድቅ
  choice: धार्मिकता के मार्ग पर चलेगा
  rationale: क्रिया का मूल अर्थ आगे बढ़ना या पार जाना हो सकता है, किंतु मार्ग के साथ ‘चलेगा’ नैतिक मार्ग-रूपक को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ኵሉ ፍኖቱ
  choice: उसका पूरा मार्ग
  rationale: स्रोत के एकवचन ‘मार्ग’ और उसकी समग्रता, दोनों को बनाए रखा गया है।
- source_word: ምሕዋሩ
  choice: उसकी गति
  rationale: यह उसके आगे बढ़ने, जीवन-क्रम या चलने के ढंग का संकेत देता है; ‘गति’ इसे अत्यधिक नैतिक व्याख्या में सीमित नहीं करती।
- source_word: በኂሩት
  choice: भलाई में
  rationale: शब्द की व्यापक नैतिक और हितकारी गुणवत्ता को व्यक्त करता है, उसे केवल दयालुता तक सीमित नहीं करता।
- source_word: በሣህል ዘለዓለም
  choice: अनन्त कृपा में
  rationale: ሣህል में दया, कोमलता और कृपापूर्ण अनुग्रह का अर्थ-क्षेत्र है; ‘कृपा’ इस व्यापक हितकारी भाव को स्वाभाविक हिन्दी में रखती है और ዘለዓለም को ‘अनन्त’ व्यक्त करता है।
theological_decisions:
- issue: क्या ‘नींद से उठना’ स्पष्ट रूप से मृतकों के पुनरुत्थान को बताता है या रूपकात्मक जागरण को
  choice: मुख्य पाठ में केवल ‘नींद से उठेगा’ की छवि रखी गई है।
  alternative: इसे स्पष्ट शारीरिक पुनरुत्थान अथवा नैतिक-आत्मिक जागरण के रूप में खोलना।
  rationale: गीज़ पाठ नींद और उठने की भाषा तो प्रयोग करता है, पर इस पद में मृत्यु या पुनरुत्थान को स्पष्ट नहीं करता; इसलिए अर्थगत और धर्मवैज्ञानिक तनाव को अनिर्णीत रखा गया है।
- issue: ‘धर्मी जन’ की पहचान
  choice: एकवचन व्यक्ति के रूप में अनिर्दिष्ट रखा गया है।
  alternative: उसे स्पष्ट रूप से मसीही व्यक्तित्व या धर्मियों के सामूहिक वर्ग के रूप में पहचानना।
  rationale: स्रोत का एकवचन सुरक्षित रखना उचित है, पर पद स्वयं किसी विशिष्ट पहचान को निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और पाठयोग्य रूप अपनाया गया है। ‘उठेगा, उठ खड़ा होगा’ में स्रोत की पुनरुक्ति और दूसरे क्रियापद से पहले की संयोजक-विहीनता रखी गई है। मार्ग और गति की समानांतर छवियाँ भी संरक्षित हैं।
