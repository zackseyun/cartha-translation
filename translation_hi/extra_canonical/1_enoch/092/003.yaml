  - severity: low
    issue: Final benevolence term is better rendered as “दया”
    rationale: गीज़ ሣህል includes mercy, gentleness, and gracious favor. “दया” is natural in Hindi and avoids suggesting a more specifically theological notion through “कृपा”; the footnote preserves alternatives.
