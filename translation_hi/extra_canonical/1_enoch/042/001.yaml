  yaml_path: translation/extra_canonical/1_enoch/042/001.yaml
  text: Wisdom found no place where she might dwell[b][a], and her dwelling was in the heavens.
translation:
  language: hi
  text: बुद्धि को कोई ऐसा स्थान न मिला जहाँ वह निवास कर सके, और उसका निवास स्वर्गों में था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल गीज़ पाठ में ‘स्वर्ग’ बहुवचन में है; यह स्वर्गीय क्षेत्र के लिए दर्शन-साहित्य में प्रचलित अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ጥበብ
  choice: बुद्धि
  rationale: यहाँ बुद्धि को कार्य करने वाली स्त्रीलिंगी सजीव सत्ता के रूप में प्रस्तुत किया गया है; हिन्दी का स्त्रीलिंग संज्ञा-रूप इस मानवीकरण को स्वाभाविक रूप से बनाए रखता है।
- source_word: መካነ ኢረከበት
  choice: कोई ऐसा स्थान न मिला
  rationale: नकारात्मक क्रिया और उसके स्थानवाचक कर्म को सहज आधुनिक हिन्दी में जोड़ता है, जबकि खोजकर न पाने का अर्थ सुरक्षित रहता है।
- source_word: ኀበ ተኃድር
  choice: जहाँ वह निवास करे
  rationale: यह अपेक्षित निवास-स्थान बताने वाला उपवाक्य है; ‘निवास करे’ गरिमापूर्ण है और आवास की छवि बनाए रखता है।
- source_word: ወሀለወ
  choice: और ... था
  rationale: ወ का मूल संयोजक, समुच्चयात्मक बल सुरक्षित रखा गया है; अनावश्यक रूप से विरोधसूचक ‘परन्तु’ नहीं जोड़ा गया।
- source_word: ማኅደራ
  choice: उसका निवास
  rationale: स्त्रीलिंग बुद्धि के मानवीकरण तथा पहले आए ‘निवास करे’ से शब्दार्थगत संबंध को बनाए रखता है।
- source_word: ውስተ ሰማያት
  choice: स्वर्गों में
  rationale: गीज़ के बहुवचन रूप को बनाए रखता है और दर्शनात्मक-आकाशीय क्षेत्र की अभिव्यक्ति करता है।
theological_decisions:
- issue: बुद्धि को मानवीकृत पात्र के रूप में रखना या अमूर्त गुण बना देना
  choice: ‘बुद्धि’ को कर्ता बनाकर स्त्रीलिंगी सर्वनाम ‘वह’ के साथ मानवीकरण सुरक्षित रखा गया।
  alternative: ‘बुद्धि के निवास के लिए कोई स्थान न मिला’ जैसे अमूर्त रूप में प्रस्तुत करना।
  rationale: मूल पाठ बुद्धि को स्थान खोजने और निवास रखने वाली सत्ता के रूप में चित्रित करता है; इसे अमूर्त बनाने से ज्ञान-साहित्य की प्रमुख छवि मिट जाती।
- issue: ወ को समुच्चयात्मक या विरोधसूचक समझना
  choice: ‘और’
  alternative: ‘परन्तु’ अथवा ‘लेकिन’
  rationale: मूल संयोजक मुख्यतः समुच्चयात्मक है और प्रसंग में क्रम अथवा परिणाम भी व्यक्त कर सकता है; ‘और’ वास्तविक अस्पष्टता और मूल की पराटैक्टिक शैली को बेहतर सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘निवास’ आवास-संबंधी पुनरुक्ति को अर्थपूर्ण ढंग से बनाए रखता है, और ‘स्वर्गों’ का असामान्य बहुवचन मूल पाठ की ब्रह्मांडीय भाषा के कारण जानबूझकर सुरक्षित है।
