base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/002.yaml
  text: And his works are before him for every year that shall be[a], and all his works are subject to him and do not change; but as God has ordained[b], so everything is done.
translation:
  language: hi
  text: और प्रत्येक आनेवाले वर्ष में उसके कार्य उसके सामने हैं[a]; उसके सभी कार्य उसके अधीन हैं और बदलते नहीं, बल्कि जैसा परमेश्वर ने निर्धारित किया है[b], वैसा ही सब कुछ होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “होनेवाले प्रत्येक वर्ष में।” मूल गीइज़ वाक्यांश आगे आनेवाले वर्षों के निरंतर क्रम की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: “निर्धारित किया” का अनुवाद “ठहराया” या “व्यवस्थित किया” भी हो सकता है। यहाँ भाव परमेश्वर द्वारा स्थापित व्यवस्था का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ምግባሩ
  choice: उसके कार्य
  rationale: संज्ञा का अर्थ कार्य या किए हुए काम है। इसकी पुनरावृत्ति को बनाए रखना पद की संरचना और सृष्टि-व्यवस्था के संदर्भ के अनुकूल है।
- source_word: ቅድሜሁ
  choice: उसके सामने
  rationale: यह स्थान-संबंधी अभिव्यक्ति परमेश्वर की उपस्थिति में सृष्टि के खुले रूप से विद्यमान होने का चित्र बनाए रखती है।
- source_word: ለለ ዓመት ዘይከውን
  choice: आनेवाले हर वर्ष के लिए
  rationale: यह आगे आनेवाले वर्षों के निरंतर क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ይትቀነይ ሎቱ
  choice: उसके अधीन रहते हैं
  rationale: क्रिया में सेवा, आज्ञाकारिता अथवा निर्धारित व्यवस्था के अनुरूप रहने का भाव हो सकता है। यहाँ 'अधीन रहते हैं' सृष्टि की व्यवस्थित अनुरूपता को सहज हिन्दी में व्यक्त करता है, बिना केवल उपासना-संबंधी सेवा का अर्थ थोपे।
- source_word: ኢይትመየጥ
  choice: बदलते नहीं
  rationale: यह सृष्टि-क्रम की स्थिरता और विचलन न होने का सीधा एवं स्पष्ट अनुवाद है।
- source_word: ሠርዐ አምላክ
  choice: परमेश्वर ने निर्धारित किया है
  rationale: मूल क्रिया व्यवस्था ठहराने, नियुक्त करने या विधान करने का संकेत देती है; 'निर्धारित' इस ब्रह्मांडीय व्यवस्था के संदर्भ में स्वाभाविक और पर्याप्त व्यापक है।
- source_word: ይትገበር ኵሉ
  choice: सब कुछ होता है
  rationale: यह व्यापक कर्मवाच्य भाव को सहज हिन्दी में व्यक्त करता है और मूल से अधिक प्रबल दार्शनिक या विधि-संबंधी दावा नहीं जोड़ता।
theological_decisions:
- issue: बार-बार आए तृतीय पुरुष संबंधसूचक प्रत्यय का संदर्भ
  choice: '''उसके कार्य'' में ''उसके'' का संदर्भ परमेश्वर है।'
  alternative: व्याकरणतः इसका संदर्भ निकट प्रसंग की किसी सृजित सत्ता, जैसे आकाश, से माना जा सकता है।
  rationale: अंतिम उपवाक्य में परमेश्वर का स्पष्ट उल्लेख तथा वर्ष-चक्र और अपरिवर्तित व्यवस्था का विषय परमेश्वर को संदर्भ मानने के पक्ष में प्रबल हैं।
- issue: सृष्टि के परमेश्वर से संबंध में ይትቀነይ का भाव
  choice: उसके अधीन रहते हैं
  alternative: उसकी सेवा करते हैं; उसके लिए व्यवस्थित हैं; उसकी आज्ञा मानते हैं
  rationale: यह चयन सृष्टि की स्थिर, परमेश्वर-निर्धारित व्यवस्था को व्यक्त करता है और मूल में मौजूद सेवा तथा आज्ञाकारिता के अर्थ-क्षेत्र को अत्यधिक संकीर्ण नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। 'कार्य', 'अधीन' और 'निर्धारित' जैसे शब्द सामान्य पाठक के लिए बोधगम्य हैं तथा पद की ब्रह्मांडीय, विधिबद्ध छवि को बनाए रखते हैं।
