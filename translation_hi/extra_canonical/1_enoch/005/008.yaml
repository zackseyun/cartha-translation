  yaml_path: translation/extra_canonical/1_enoch/005/008.yaml
  text: And then wisdom will be given to the chosen[a], and all these will live and will not again sin, whether through ungodliness or through pride[b]; but those who possess wisdom will be humble.
translation:
  language: hi
  text: और तब चुने हुओं[a] को बुद्धि दी जाएगी। ये सभी जीवित रहेंगे और फिर पाप नहीं करेंगे—न अधर्म में, न घमण्ड में; बल्कि जिनमें बुद्धि है, वे विनम्र होंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निर्वाचित जनों’।
    reason: lexical_alternative
  - marker: b
    text: 'अंतिम वाक्यांश का अर्थ यह भी हो सकता है: ‘बल्कि वे विनम्र होंगे, क्योंकि बुद्धि उनकी है।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: እሜሃ
  choice: तब
  rationale: यह समय और क्रम को सूचित करता है तथा पिछले प्रसंग के बाद होने वाली घटना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ይትወሀቦሙ
  choice: दी जाएगी
  rationale: कर्मवाच्य भाव बनाए रखता है, जिससे बुद्धि को स्वयं अर्जित उपलब्धि नहीं, बल्कि प्राप्त होने वाले वरदान के रूप में दिखाया गया है।
- source_word: ለሕሩያን
  choice: चुने हुओं
  rationale: यह अपोकैलिप्टिक समूह-संज्ञा का सरल और आधुनिक हिन्दी रूप है; इससे बाद की किसी विशिष्ट धर्मवैज्ञानिक व्यवस्था का अनावश्यक अर्थ नहीं जुड़ता।
- source_word: ጥበብ
  choice: बुद्धि
  rationale: इस नैतिक संदर्भ में यह परमेश्वर से मिलने वाली विवेकपूर्ण बुद्धि को व्यक्त करता है, मात्र कौशल को नहीं।
- source_word: ኵሎሙ እሉንቱ
  choice: वे सब
  rationale: पहले उल्लिखित चुने हुओं की ओर संकेत करने वाले सामूहिक भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: የሐይዉ
  choice: जीवित रहेंगे
  rationale: मूल के सीधे भाव को बनाए रखता है और धन्य भावी व्यवस्था जैसे निहितार्थ को पाठ में अतिरिक्त रूप से नहीं जोड़ता।
- source_word: ወኢይደግሙ አብሶ
  choice: फिर पाप नहीं करेंगे
  rationale: नकार, पुनरावृत्ति और पाप करने के भाव—तीनों को स्पष्ट एवं सहज हिन्दी में सुरक्षित रखता है।
- source_word: እበረሲዕ
  choice: अधर्म के कारण
  rationale: धार्मिक और नैतिक दुष्टता का भाव व्यक्त करता है; ‘दुष्टता’ की अपेक्षा ‘अधर्म’ यहाँ अधिक सटीक है।
- source_word: እበኅዕቢት
  choice: घमण्ड के कारण
  rationale: अहंकारी मनोवृत्ति को व्यक्त करता है और आगे आने वाली दीनता के साथ स्पष्ट विरोध बनाता है।
- source_word: አላ
  choice: बल्कि
  rationale: पाप और घमण्ड से हटकर दीनता की ओर मजबूत विरोध और सुधारात्मक मोड़ दिखाता है।
- source_word: ይገንዩ
  choice: दीन होंगे
  rationale: नम्रता और नीचाई के नैतिक भाव को गरिमापूर्ण हिन्दी में व्यक्त करता है; ‘विनम्र’ भी संभव है।
- source_word: ዘቦሙ ጥበበ
  choice: जिनमें बुद्धि है
  rationale: सापेक्ष वाक्यांश को निकटता से सुरक्षित रखता है और बुद्धि तथा दीनता के संबंध को स्पष्ट करता है।
theological_decisions:
- issue: ሕሩያን का अनुवाद
  choice: चुने हुए
  alternative: निर्वाचित जन
  rationale: ‘चुने हुए’ सामान्य पाठक के लिए सहज है और मूल की स्थानीय अपोकैलिप्टिक श्रेणी को रखता है, बिना बाद के सिद्धान्तगत अर्थों को आरोपित किए।
- issue: बुद्धि मिलने के बाद नैतिक परिवर्तन
  choice: भविष्य की ऐसी अवस्था जिसमें चुने हुए फिर पाप नहीं करेंगे और दीन होंगे
  alternative: सामान्य धार्मिकता का अतिशयोक्तिपूर्ण वर्णन, अथवा केवल अधर्म और घमण्ड नामक पापों का त्याग
  rationale: मूल पहले व्यापक रूप से फिर पाप न करने की बात कहता है और फिर अधर्म तथा घमण्ड का उल्लेख करता है; अनुवाद दोनों स्तरों को बनाए रखता है।
- issue: अंतिम वाक्यांश का संबंध
  choice: जिनमें बुद्धि है, वे दीन होंगे
  alternative: वे दीन होंगे, क्योंकि बुद्धि उनकी है
  rationale: गीज़ की संक्षिप्त सापेक्ष रचना दोनों अर्थ-संबंधों की अनुमति दे सकती है। मुख्य पाठ व्यक्तियों की पहचान बुद्धि रखने वालों के रूप में करता है, जबकि कारणात्मक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी। शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘चुने हुए’, ‘अधर्म’, ‘घमण्ड’ और ‘दीन’ जैसे परिचित शब्द मूल के नैतिक-अपोकैलिप्टिक स्वर को बनाए रखते हैं।
