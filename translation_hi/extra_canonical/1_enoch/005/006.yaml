  yaml_path: translation/extra_canonical/1_enoch/005/006.yaml
  text: In those days you will give your names to an everlasting curse for all the righteous[a], and the sinners will curse you[d][c][b]; and for you there will be a joining together with sinners.
translation:
  language: hi
  text: उन दिनों तुम अपने नाम सभी धर्मियों के लिए सदा के शाप के लिए सौंप दोगे[a], और पापी तुम्हें शाप देंगे[b]। …[c] और पापियों के साथ तुम्हारा जुड़ाव होगा[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: भाव संभवतः यह है कि तुम्हारे नाम शाप देते समय बोले जाने वाले उदाहरण बन जाएँगे—अर्थात वे सार्वजनिक अपमान और न्याय के चिह्न होंगे।
    reason: lexical_alternative
  - marker: b
    text: कुछ पाठ-परंपराओं या पुनर्निर्माणों के आधार पर इसका अर्थ ‘पापी तुम्हारा नाम लेकर शाप देंगे’ भी समझा गया है; उपलब्ध गीइज़ में ‘तुम्हें’ प्रत्यक्ष कर्म के रूप में पढ़ना अधिक सीधा है।
    reason: alternative_reading
  - marker: c
    text: उपलब्ध गीइज़ पाठ में यहाँ शब्द लुप्त या अस्पष्ट हैं; इसलिए पाठगत रिक्ति को दीर्घविराम से दिखाया गया है।
    reason: textual_uncertainty
  - marker: d
    text: इसका अनुवाद ‘तुम पापियों में गिने जाओगे’ या ‘तुम्हारी संगति पापियों के साथ होगी’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: በውእቱ መዋዕል
  choice: उन दिनों
  rationale: यह प्रकाशन-साहित्य में प्रयुक्त कालसूचक पद है; बहुवचन और भविष्यसूचक गरिमा दोनों बने रहते हैं।
- source_word: ትሁቡ ስመ ዚአክሙ
  choice: तुम्हारे नाम … हवाले कर दिए जाएँगे
  rationale: निष्क्रिय भाव को सामने रखते हुए नामों के शाप के अधीन कर दिए जाने का न्याय-संबंधी आशय व्यक्त किया गया है।
- source_word: በርገመት ዘለዓለም
  choice: सदा के शाप के हवाले
  rationale: यह अनन्त काल तक बने रहने वाले शाप और बदनामी के परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ለኵሉ ጻድቃን
  choice: सभी धर्मियों के लिए
  rationale: ለ उपसर्ग का व्यापक ‘के लिए’ अर्थ बनाए रखा गया है, बिना यह निश्चित किए कि धर्मी स्वयं शाप बोलते हैं या इन नामों को शाप के उदाहरण के रूप में जानते हैं।
- source_word: ወኪያክሙ ይረግሙ ኃጥኣን
  choice: और पापी तुम्हें शाप देंगे
  rationale: ኪያክሙ को द्वितीय पुरुष बहुवचन के प्रत्यक्ष कर्म के रूप में लिया गया है; यह उपलब्ध गीइज़ व्याकरण के सर्वाधिक सीधे पाठ का अनुसरण करता है।
- source_word: ተኅቡረ ምስለ ኃጥኣን
  choice: तुम्हारा मेल पापियों के साथ होगा
  rationale: मेल संबंध, गिने जाने या साझा परिणति—इन संभावित अर्थों को खुला रखता है और केवल सामाजिक संगति तक सीमित नहीं करता।
theological_decisions:
- issue: दोषियों के नामों का सदा के शाप से संबंध
  choice: नाम शाप के हवाले होकर सार्वजनिक अपमान और न्याय के चिह्न बनते हैं।
  alternative: धर्मी सीधे उन व्यक्तियों पर शाप सुनाते हैं।
  rationale: ‘तुम्हारे नाम’ पर बल यह संकेत देता है कि वे शाप देते समय प्रयुक्त उदाहरण या कहावत बन सकते हैं; अनुवाद इस संकेत को रखता है, पर उसे निर्विवाद व्याख्या नहीं बनाता।
- issue: पापियों के साथ अंतिम संबंध
  choice: ‘मेल’ द्वारा उनके साथ जोड़े जाने या समान परिणति में रखे जाने का व्यापक अर्थ रखा गया है।
  alternative: ‘तुम पापियों में गिने जाओगे’ अथवा ‘तुम पापियों की संगति करोगे।’
  rationale: न्याय के प्रसंग में साझा परिणति संभावित है, किंतु मूल संज्ञात्मक अभिव्यक्ति संबंध का सटीक प्रकार निश्चित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, भविष्यसूचक और न्याय-संबंधी लहजा रखा गया है। ‘धर्मी’, ‘पापी’ और ‘शाप’ सामान्य पाठक के लिए परिचित धार्मिक शब्द हैं। मूल पाठ की रिक्ति तथा मुख्य व्याकरणिक और अर्थगत अनिश्चितताओं को मुख्य वाक्य में दबाने के बजाय पादटिप्पणियों में स्पष्ट किया गया है।
