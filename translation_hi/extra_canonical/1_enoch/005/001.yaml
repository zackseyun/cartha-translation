base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/001.yaml
  text: Observe how the trees are covered with green leaves and bear fruit[c][b][a], and understand concerning everything that the Ever-Living One has made all these things.
translation:
  language: hi
  text: देखो कि पेड़ कैसे हरे पत्तों से ढक जाते हैं और फल देते हैं; और इन सब बातों पर ध्यान देकर समझो कि जो सदा जीवित है, उसी ने ये सब बनाया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस वाक्य के अंतिम भाग का प्राप्त गीइज़ पाठ कठिन है। सम्भव है कि मूल अर्थ था, “जो सदा जीवित है, उसने ये सब तुम्हारे लिए बनाया है।”
    reason: textual_variant
lexical_decisions:
- source_word: ጠይቁ እፎ
  choice: देखो कि… कैसे
  rationale: बहुवचन आज्ञार्थक संबोधन और ‘कैसे’ के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; सृष्टि का निरीक्षण करने का आह्वान सुरक्षित रहता है।
- source_word: ዕፀው
  choice: पेड़
  rationale: सामान्य और सहज हिन्दी शब्द, जो यहाँ वृक्षों के पूरे वर्ग को सूचित करता है।
- source_word: በሐመልማለ አቍጽል ይትከደኑ
  choice: हरे पत्तों से ढक जाते हैं
  rationale: हरे पत्तों से आच्छादित होने के दृश्य को स्पष्ट और स्वाभाविक रूप में रखता है।
- source_word: ወይፈሪዩ
  choice: और फल देते हैं
  rationale: पेड़ों के फल उत्पन्न करने के लिए सामान्य आधुनिक हिन्दी अभिव्यक्ति।
- source_word: ወለበዉ በእንተ ኵሉ ወአእምሩ
  choice: और इन सब बातों पर ध्यान देकर समझो
  rationale: पाठक को संबोधित बहुवचन आज्ञार्थक क्रियाओं को एक सहज हिन्दी अनुक्रम में व्यक्त करता है, बिना उन्हें पेड़ों की क्रियाएँ बनाए।
- source_word: ዘሕያው ለዓለም
  choice: जो सदा जीवित है
  rationale: वाक्यांश को परमेश्वर के लिए प्रयुक्त वर्णनात्मक उपाधि के रूप में अनूदित करता है और किसी विशिष्ट संप्रदायगत पदावली को आरोपित नहीं करता।
- source_word: ገበርክሙ ለአሉንቱ ኵሎሙ
  choice: उसी ने ये सब बनाया है
  rationale: प्रेषित गीइज़ रूप कठिन है, पर प्रसंग और उपलब्ध प्राचीन साक्ष्य सृष्टिकर्ता को कर्ता मानने का समर्थन करते हैं; अनिश्चितता पाद-टिप्पणी में बताई गई है।
theological_decisions:
- issue: क्या अंतिम पदबंध सदा जीवित रहनेवाले परमेश्वर को सूचित करता है या सदा जीवित प्राणियों को
  choice: जो सदा जीवित है
  alternative: सदा जीवित रहनेवालों के लिए
  rationale: वाक्य-संरचना और नवीन पाठ-समीक्षा इसे सृष्टि करनेवाले के लिए प्रयुक्त एकवचन वर्णन मानने का अधिक बल देती है। फिर भी अनुवाद इसे औपचारिक ईश्वरीय नाम बनाने के बजाय वर्णनात्मक वाक्यांश के रूप में रखता है।
- issue: कठिन क्रियारूप में कर्ता और सम्भावित ‘तुम्हारे लिए’ का संबंध
  choice: उसी ने ये सब बनाया है
  alternative: उसने ये सब तुम्हारे लिए बनाया है
  rationale: प्रेषित गीइज़ रूप असामान्य या विकृत प्रतीत होता है। मुख्य पाठ में सर्वाधिक सम्भावित अर्थ रखा गया है, जबकि सम्भावित प्राप्तकर्ता को पाद-टिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और निरीक्षण के आज्ञार्थक स्वर के अनुरूप है। ‘जो सदा जीवित है’ जानबूझकर वर्णनात्मक रखा गया है, ताकि पाठ में उपस्थित धार्मिक संकेत सुरक्षित रहे पर कोई अतिरिक्त संप्रदायगत उपाधि न जोड़ी जाए।
