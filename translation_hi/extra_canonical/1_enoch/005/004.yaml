base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/004.yaml
  text: But you have not endured[a], and you have not done the command of the Lord; rather, you have transgressed and spoken proud and harsh words with your unclean mouths against his greatness. Because of the hardness of your heart[d][c][b], you will have no peace.
translation:
  language: hi
  text: परन्तु तुमने धीरज नहीं रखा और प्रभु की आज्ञा का पालन नहीं किया; बल्कि तुम उससे फिर गए और अपने अशुद्ध मुँहों से उसकी महानता[a] के विरुद्ध घमण्ड भरी और कठोर बातें कहीं। अपने हृदय की कठोरता के कारण तुम्हें शान्ति नहीं मिलेगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके प्रताप’। मूल पद परमेश्वर की उच्च और महान स्थिति की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘शान्ति’ केवल मन के चैन तक सीमित नहीं, बल्कि कुशलता और अनुकूल परिणाम को भी समेट सकती है।
    reason: cultural_note
lexical_decisions:
- source_word: አተዓገሥክሙ
  choice: तुमने धीरज नहीं रखा
  rationale: यह क्रिया सहने, धीरज रखने और दृढ़ बने रहने का भाव देती है। ‘धीरज नहीं रखा’ आधुनिक हिन्दी में स्वाभाविक रहते हुए नैतिक दृढ़ता की कमी व्यक्त करता है।
- source_word: ትእዛዘ እግዚእ
  choice: प्रभु की आज्ञा
  rationale: मूल में ‘आज्ञा’ एकवचन है। ‘प्रभु’ इस प्रसंग में ईश्वरीय उपाधि का स्वाभाविक और गरिमापूर्ण अनुवाद है।
- source_word: ተዓደውክሙ
  choice: तुम उससे फिर गए
  rationale: क्रिया केवल किसी नियम को तोड़ने से अधिक नैतिक विचलन या विमुख होने का संकेत देती है। प्रसंग के कारण ‘उससे’ प्रभु की ओर संकेत करता है।
- source_word: ሐመይክሙ
  choice: बातें कहीं
  rationale: क्रिया में बुरा कहने या निन्दात्मक ढंग से बोलने की छाया हो सकती है; यहाँ ‘उसकी महानता के विरुद्ध’ तथा ‘घमण्ड भरी और कठोर’ उस विरोधी बल को स्पष्ट करते हैं, इसलिए हिन्दी में अनावश्यक दोहराव से बचते हुए सामान्य कथन-क्रिया रखी गई है।
- source_word: ዓበይተ ወድሩካተ ቃላተ
  choice: घमण्ड भरी और कठोर बातें
  rationale: शाब्दिक ‘बड़े और कठोर शब्द’ हिन्दी में अस्पष्ट होता। विरोधी ईश-निन्दात्मक प्रसंग में पहला विशेषण दम्भ या घमण्ड का और दूसरा कटुता या कठोरता का भाव रखता है।
- source_word: ርኵሳት
  choice: अशुद्ध
  rationale: यह शब्द नैतिक और धार्मिक अशुद्धता दोनों की प्रतिध्वनि बनाए रखता है।
- source_word: ዕበዩ ዚአሁ
  choice: उसकी महानता
  rationale: यह मूल पद का सीधा अनुवाद है और परमेश्वर की उच्चता का भाव रखता है; ‘महिमा’ कहने से अर्थ अधिक विशिष्ट हो जाता।
- source_word: ይቡሳነ ልብ
  choice: हे कठोर हृदयवालो
  rationale: मूल संबोधन कठोर या सूखे हृदय की स्थायी हठधर्मिता दर्शाता है। हिन्दी में यह भविष्यद्वाणी-सदृश फटकार को स्वाभाविक रूप से बनाए रखता है।
- source_word: ኢትከውኑክሙ ሰላም
  choice: तुम्हें शान्ति नहीं मिलेगी
  rationale: यह न्याय की घोषणा है। ‘शान्ति’ को बनाए रखने से आन्तरिक चैन के साथ कुशलता और अनुकूल परिणाम की व्यापक बाइबलीय अर्थ-सीमा भी खुली रहती है।
theological_decisions:
- issue: अन्तिम वाक्य में ‘शान्ति’ का अर्थ केवल मन की शान्ति माना जाए या समग्र कुशलता भी
  choice: तुम्हें शान्ति नहीं मिलेगी
  alternative: तुम्हारा कल्याण नहीं होगा
  rationale: मूल पद न्याय-सूत्र में आन्तरिक चैन से अधिक व्यापक कुशलता और अनुकूल दशा को समेट सकता है। ‘शान्ति’ इस अर्थ-विस्तार और धार्मिक तनाव दोनों को सुरक्षित रखता है।
- issue: ዕበዩ ዚአሁ को ‘महानता’, ‘महिमा’ या ‘प्रताप’ कहा जाए
  choice: उसकी महानता
  alternative: उसके प्रताप के विरुद्ध
  rationale: ‘महानता’ मूल के सर्वाधिक निकट है और परमेश्वर की उच्चता को किसी अधिक संकीर्ण धर्मवैज्ञानिक पद में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है, पर भविष्यद्वाणी-सदृश फटकार की गरिमा बनाए रखी गई है। ‘हे कठोर हृदयवालो’ संबोधन मूल की तीव्रता को सुरक्षित रखता है; वाक्य-विन्यास सामान्य पाठक के लिए स्पष्ट और मौखिक पठन के अनुकूल रखा गया है।
