lexical_decisions:
- source_word: ርእዩ
  choice: देखो
  rationale: यह बहुवचन आज्ञार्थक रूप है; ‘देखो’ सृष्टि का प्रत्यक्ष अवलोकन करने के आह्वान को स्वाभाविक हिन्दी में रखता है।
- source_word: እፎ
  choice: किस प्रकार
  rationale: यहाँ यह देखने योग्य रीति या ढंग प्रस्तुत करता है; ‘किस प्रकार’ पद की अवलोकनात्मक भूमिका को स्पष्ट रखता है।
- source_word: አብሕርት
  choice: समुद्र
  rationale: यह ባሕር (‘समुद्र’) का बहुवचन है; इसलिए वनस्पतिशास्त्रीय अर्थ के बजाय जलराशियों का अर्थ उचित है। हिन्दी में समष्टिवाचक ‘समुद्र’ बहुवचनार्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ወአፍላግ
  choice: और नदियाँ
  rationale: አፍላግ, ፈልግ (‘नदी’) का बहुवचन है और समुद्रों के साथ जल-संबंधी युग्म बनाता है।
- source_word: ኅቡረ
  choice: मिलकर
  rationale: यह संयुक्त या सामूहिक क्रिया का क्रियाविशेषणीय भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ይፌጽሙ
  choice: पूरा करते हैं
  rationale: यह अपने नियत कार्य को सिद्ध या पूर्ण करने का भाव रखता है; ‘पूरा करते हैं’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: ግብሮሙ
  choice: अपना काम
  rationale: यह उनके अपने कार्य या गतिविधि को सूचित करता है; हिन्दी में कर्ता के अनुरूप ‘अपना काम’ अधिक स्वाभाविक है।
