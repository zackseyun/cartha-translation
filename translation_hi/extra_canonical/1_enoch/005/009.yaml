base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/009.yaml
  text: And they shall not again sin[c][b][a], and they shall not be condemned all the days of their life.
translation:
  language: hi
  text: और वे फिर पाप नहीं करेंगे[a], और अपने जीवन के सारे दिनों में दोषी नहीं ठहराए जाएँगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे अब और पाप नहीं करेंगे।” गीइज़ अभिव्यक्ति में दोहराव अथवा जारी रहने का भाव निहित है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने पूरे जीवन भर।” स्रोत में बहुवचन संबंध के साथ ‘जीवन’ एकवचन में प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወኢይደግሙ፡ አብሶ
  choice: और वे फिर पाप नहीं करेंगे
  rationale: नकारात्मक बहुवचन क्रिया में दोहराव अथवा निरंतरता रुकने का भाव है। ‘फिर’ उस पुनरावृत्तिमूलक बल को स्वाभाविक हिन्दी में बनाए रखता है; ‘पाप नहीं करेंगे’ इसी गीइज़ वाक्यांश के निकटवर्ती प्रयोग के साथ भी संगति रखता है।
- source_word: ወኢይትኴነኑ
  choice: और ... दोषी नहीं ठहराए जाएँगे
  rationale: यह निष्क्रिय न्यायिक अर्थ को व्यक्त करता है। ‘दोषी नहीं ठहराए जाएँगे’ निर्णय के भाव को सुरक्षित रखता है और इसे केवल दण्ड भोगने तक सीमित नहीं करता।
- source_word: ኵሎ፡ መዋዕለ፡ ሕይወቶሙ
  choice: अपने जीवन के सारे दिनों में
  rationale: यह सामी शैली की काल-सूचक अभिव्यक्ति का निकट और समझने योग्य हिन्दी रूप है। बहुवचन कर्ता के साथ स्रोत में ‘जीवन’ एकवचन है; हिन्दी में ‘अपने जीवन’ distributive अर्थ स्वाभाविक रूप से देता है।
theological_decisions:
- issue: क्या यह पंक्ति नैतिक परिवर्तन का वादा करती है या केवल दण्ड योग्य कर्मों की समाप्ति का
  choice: पहला उपवाक्य भविष्य में फिर पाप न करने का वादा बताता है और दूसरा न्यायिक रूप से दोषी न ठहराए जाने की बात कहता है।
  alternative: पहले उपवाक्य को ‘वे फिर बुराई नहीं करेंगे’ और दूसरे को ‘उन्हें दण्ड नहीं दिया जाएगा’ भी समझा जा सकता है।
  rationale: गीइज़ पाठ आचरण और न्यायिक निर्णय के लिए अलग अभिव्यक्तियाँ रखता है। दोनों को अलग बनाए रखने से नैतिक और न्यायिक तनाव किसी एक व्याख्या में विलीन नहीं होता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘फिर पाप नहीं करेंगे’ नैतिक कथन को और ‘दोषी नहीं ठहराए जाएँगे’ न्यायिक कथन को स्पष्ट रूप से अलग रखता है।
