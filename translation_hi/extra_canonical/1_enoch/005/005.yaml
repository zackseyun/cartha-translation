base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/005.yaml
  text: And because of this[a], you will curse your days, and you will shorten the years of your life; and the years of your destruction will increase in an eternal curse[b], and there will be no mercy for you.
translation:
  language: hi
  text: और इसी कारण[a] तुम अपने दिनों को कोसोगे और अपने जीवन के वर्षों को कम कर दोगे; और तुम्हारे विनाश के वर्ष अनन्त शाप में बढ़ेंगे[b], और तुम्हारे लिए कोई दया न होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘इसलिए।’
    reason: lexical_alternative
  - marker: b
    text: 'यह वाक्यांश पाठ और अर्थ की दृष्टि से कठिन है। ‘तुम्हारे विनाश के वर्ष’ का अनुवाद ‘तुम्हारी बरबादी के वर्ष’ या ‘तुम्हारे नाश होने के वर्ष’ भी हो सकता है। वैकल्पिक पाठ या प्रतिपादन में: ‘तुम्हारे जीवन के वर्ष नष्ट हो जाएँगे।’'
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: ወበእንተዝ
  choice: और इसी कारण
  rationale: यह पद पिछले अभियोग के परिणाम को बताता है। ‘इसी कारण’ मूल के स्पष्ट कारणसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: መዋዕሊክሙ
  choice: अपने दिनों को
  rationale: बहुवचन संज्ञा और सर्वनामिक प्रत्यय का सीधा रूपान्तरण है; ‘दिनों’ से न्याय-विलाप की मुहावरेदार शैली बनी रहती है।
- source_word: ትረግሙ
  choice: तुम ... कोसोगे
  rationale: 'इसे द्वितीय पुरुष बहुवचन सक्रिय अपूर्ण/भविष्य माना गया है: न्याय के अधीन संबोधित लोग अपने ही दिनों को कोसेंगे।'
- source_word: ዓመታት ሕይወትክሙ
  choice: अपने जीवन के वर्षों को
  rationale: मूल सम्बन्धवाचक रचना को स्वाभाविक और गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: ትኃጕሉ
  choice: घटा दोगे
  rationale: क्रिया द्वितीय पुरुष बहुवचन सक्रिय है, जिसकी पुष्टि यूनानी ἀπολεῖτε से भी होती है। ‘घटा दोगे’ जीवन-वर्षों के नष्ट या कम कर देने का भाव देता है और वर्षों को क्रिया का कर्ता नहीं बनाता।
- source_word: ዓመታት ኀጕልክሙ
  choice: तुम्हारे विनाश के वर्ष
  rationale: संज्ञा पिछली क्रिया की सजातीय प्रतीत होती है और विनाश, बरबादी या नाश होने का अर्थ दे सकती है। मुख्य पाठ में ‘विनाश’ न्याय-सन्दर्भ की कठोरता को बनाए रखता है।
- source_word: ይበዝኅ
  choice: बढ़ेंगे
  rationale: मूल क्रिया ‘बहुत होना/बढ़ना’ दर्शाती है। यह शापित विनाश के वर्षों के बढ़ने वाली कठिन, विरोधाभासी छवि को ज्यों का त्यों रहने देती है।
- source_word: በርገመት ዘለዓለም
  choice: अनन्त शाप के अधीन
  rationale: पूर्वसर्गीय सम्बन्ध तथा शाप की दीर्घस्थायी निर्णायकता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ወኢይከውነክሙ ሣህል
  choice: और तुम्हारे लिए कोई दया न होगी
  rationale: 'अस्तित्वसूचक निषेध को स्पष्ट और गम्भीर हिन्दी में रखता है: उनके लिए दया उपलब्ध नहीं होगी।'
theological_decisions:
- issue: क्या संबोधित लोग स्वयं अपने दिनों को कोसेंगे या दूसरे उन्हें कोसेंगे
  choice: न्याय के अधीन विलाप करते हुए वे स्वयं अपने दिनों को कोसेंगे
  alternative: दूसरे उन्हें कोसेंगे, अथवा उन पर सामान्य रूप से शाप पड़ेगा
  rationale: गीज़ क्रिया का सर्वोत्तम व्याकरणिक विश्लेषण द्वितीय पुरुष बहुवचन सक्रिय है; इसलिए आत्म-विलाप का भाव सुरक्षित रखा गया है।
- issue: ዘለዓለም का कालगत बल
  choice: अनन्त शाप
  alternative: युग-भर का शाप अथवा सदा बना रहने वाला शाप
  rationale: इस प्रलय-साहित्यिक न्याय-सन्दर्भ में पद स्थायी निर्णायकता व्यक्त करता है। ‘अनन्त’ उसका भार बनाए रखता है, बिना बाद की किसी विशिष्ट सिद्धान्त-व्यवस्था को आरोपित किए।
- issue: जीवन के वर्षों के सम्बन्ध में ትኃጕሉ का कर्ता
  choice: संबोधित लोग सक्रिय रूप से अपने जीवन के वर्ष घटा देंगे
  alternative: उनके जीवन के वर्ष स्वयं नष्ट हो जाएँगे
  rationale: गीज़ रूप द्वितीय पुरुष बहुवचन सक्रिय है और यूनानी साक्ष्य भी सक्रिय अर्थ की पुष्टि करता है। हिन्दी में कर्तृवाच्य रखकर व्याकरणिक उत्तरदायित्व सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गम्भीर, न्यायसूचक और गरिमापूर्ण शैली अपनाई गई है। ‘तुम’ मूल के बहुवचन प्रत्यक्ष सम्बोधन को सहज रूप से व्यक्त करता है। कठिन वाक्यांश को मुख्य पाठ में सरल बनाकर हल नहीं किया गया; उसकी वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
