base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/007.yaml
  text: And for the chosen there shall be light and joy and peace[a], and they shall inherit the earth. But for you, the wicked[b], there shall be a curse.
translation:
  language: hi
  text: और चुने हुए लोगों के लिए प्रकाश, आनंद और शांति होगी, और वे धरती[a] के वारिस होंगे। परन्तु तुम दुष्टों के लिए शाप होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भूमि’। गीइज़ शब्द का अर्थ ‘धरती’ और ‘भूमि’ दोनों हो सकता है; यहाँ व्यापक प्रलय-संबंधी संदर्भ के कारण ‘धरती’ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ሕሩያን
  choice: चुने हुए लोग
  rationale: यह बहुवचन उन लोगों को सूचित करता है जिन्हें चुना गया है। यह अनुवाद बाद की किसी विशिष्ट धर्मवैज्ञानिक शब्दावली को आरोपित किए बिना समूह-संज्ञा को स्पष्ट और स्वाभाविक रखता है।
- source_word: ብርሃን
  choice: प्रकाश
  rationale: मूल शब्द का सीधा अर्थ ‘प्रकाश’ है; यह आशीष की इस त्रयी में स्वाभाविक है और बिंब को बनाए रखता है।
- source_word: ፍሥሐ
  choice: आनन्द
  rationale: यह हर्ष और प्रसन्नता का भाव व्यक्त करता है। ‘आनन्द’ आधुनिक, गरिमापूर्ण और इस आशीष-वाक्य के अनुकूल है।
- source_word: ሰላም
  choice: शान्ति
  rationale: शब्द शान्ति और कुशल-क्षेम की व्यापक धारणा रख सकता है; यहाँ ‘शान्ति’ सबसे पारदर्शी और स्वाभाविक विकल्प है।
- source_word: ይወርስዋ ለምድር
  choice: वे धरती के वारिस होंगे
  rationale: क्रिया विरासत पाने अथवा अधिकार में लेने का भाव रखती है, जबकि ምድር का अर्थ ‘धरती’ या ‘भूमि’ हो सकता है। यह रूप विरासत की धारणा और व्यापक प्रलयदर्शी परिप्रेक्ष्य दोनों को सुरक्षित रखता है।
- source_word: ረሲዓን
  choice: दुष्ट
  rationale: यह चुने हुए लोगों के विपरीत खड़े नैतिक समूह का न्याय-संबंधी पद है। ‘दुष्ट’ इसका संक्षिप्त और मानक हिन्दी रूप है।
- source_word: ርገመት
  choice: शाप
  rationale: संज्ञा अभिशाप अथवा शाप को सूचित करती है। न्याय की इस घोषणा में ‘शाप’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ምድር का दायरा
  choice: धरती
  alternative: भूमि
  rationale: शब्द दोनों अर्थ ग्रहण कर सकता है, पर पुस्तक के व्यापक प्रलयदर्शी और न्याय-संबंधी संदर्भ में ‘धरती’ अधिक उपयुक्त है। वैकल्पिक अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: ሕሩያን का समूह-संज्ञात्मक अर्थ
  choice: चुने हुए लोग
  alternative: निर्वाचित लोग
  rationale: यह रूप मूल के चुने जाने के भाव को स्पष्ट रखता है, पर ऐसी पारिभाषिक धर्मवैज्ञानिक भाषा से बचता है जो बाद की परम्पराओं का अतिरिक्त अर्थ ला सकती है।
- issue: दोनों खंडों का विरोधात्मक संबंध
  choice: पहले खंड में ‘और’, दूसरे में ‘परन्तु’
  alternative: दोनों खंडों में ‘परन्तु’
  rationale: मूल पाठ पहले खंड को साधारण संयोजक ወ से जोड़ता है और दुष्टों की ओर लौटते समय -ሰ के द्वारा स्पष्ट विरोध प्रकट करता है। हिन्दी में यही संरचना लेखक के बलाघात को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किन्तु गरिमापूर्ण रखी गई है। ‘प्रकाश, आनन्द और शान्ति’ की त्रयी तथा चुने हुओं और दुष्टों के बीच मूल विरोध को यथासंभव प्रत्यक्ष रखा गया है।
