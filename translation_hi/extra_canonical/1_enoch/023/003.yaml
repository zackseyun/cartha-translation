translation:
  language: hi
  text: और मैंने पूछा, “यह[a] क्या है, जिसे विश्राम नहीं है[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यह वस्तु’; गीइज़ का संकेतवाचक शब्द उस घटना की ओर संकेत करता है जिसे हनोक ने अभी देखा था।
    reason: lexical_alternative
  - marker: b
    text: ‘विश्राम नहीं है’ का अनुवाद ‘विश्राम से रहित है’ या ‘जिसे विराम नहीं है’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወተስእልኩ
  choice: और मैंने पूछा
  rationale: संयोजक ወ को ‘और’ तथा प्रथम पुरुष एकवचन पूर्ण क्रिया को ‘मैंने पूछा’ से व्यक्त किया गया है; यह दर्शन-वृत्तांत की सीधी शैली बनाए रखता है।
- source_word: እንዘ እብል
  choice: प्रत्यक्ष कथन द्वारा व्यक्त
  rationale: यह गीइज़ का कथन-परिचायक पदबंध है, जिसका शाब्दिक रूप ‘कहते हुए’ हो सकता है। हिन्दी में ‘मैंने पूछा, …’ स्वयं आगामी प्रत्यक्ष कथन का स्वाभाविक परिचय देता है; ‘कहते हुए पूछा’ अनावश्यक रूप से बोझिल होता।
- source_word: ዝንቱ
  choice: यह
  rationale: निकटवर्ती संकेतवाचक सर्वनाम उस दृश्य घटना की ओर संकेत करता है जिसे हनोक ने अभी देखा था। ‘यह’ हिन्दी में संदर्भ को अनावश्यक रूप से ‘वस्तु’ ठहराए बिना मूल की संकेतात्मकता बचाता है।
- source_word: ምንት ውእቱ
  choice: क्या है
  rationale: प्रश्नवाचक शब्द और योजक क्रिया का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: ዘአልቦ ዕረፍተ
  choice: जिसे विश्राम नहीं है
  rationale: संबंधवाचक रचना, निषेध और विश्राम/विराम-सूचक संज्ञा को निकटता से सुरक्षित रखा गया है। यह ‘शान्ति’ या ‘समाप्ति’ जैसी अधिक व्याख्यात्मक धारणाएँ नहीं जोड़ता।
theological_decisions:
- issue: ዕረፍተ को ‘विश्राम’, ‘शान्ति’ या ‘समाप्ति’ में से कैसे व्यक्त किया जाए
  choice: विश्राम
  alternative: विराम; चैन; समाप्ति
  rationale: मूल शब्द का निकटतम सामान्य अर्थ विश्राम या विराम है। ‘विश्राम’ उस देखी गई घटना की निरंतरता और रहस्य को बनाए रखता है, जबकि ‘शान्ति’ या ‘समाप्ति’ संदर्भ में निहित न किए गए धार्मिक या कालगत अर्थ जोड़ सकते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी की सरल, गरिमापूर्ण दर्शन-वृत्तांत शैली अपनाई गई है। मूल का ‘कहते हुए’ हिन्दी में अलग से नहीं रखा गया, क्योंकि ‘मैंने पूछा’ के बाद प्रत्यक्ष कथन अधिक स्वाभाविक है। संकेतवाचक ‘यह’ और ‘विश्राम नहीं’ की अस्पष्टता जानबूझकर सुरक्षित रखी गई है।
