lexical_decisions:
- source_word: እምህየ
  choice: वहाँ से
  rationale: यह पूर्ववर्ती स्थान से आगे की गति बताने वाला सहज संकेतवाचक पद है।
- source_word: ሖርኩ
  choice: मैं गया
  rationale: गति के साधारण भूतकालीन कथन को बिना अनावश्यक साहित्यिक विस्तार के व्यक्त करता है।
- source_word: ካልአ መካነ
  choice: एक दूसरे स्थान की ओर
  rationale: पहले वर्णित स्थान से भिन्न स्थान का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: መንገለ ዓረብ
  choice: पश्चिम दिशा में
  rationale: መንገለ दिशा सूचित करता है और ዓረብ सूर्यास्त से संबद्ध ‘पश्चिम’ को दर्शाता है; नवीनतम स्रोत-समीक्षा भी इसी अर्थ की पुष्टि करती है।
- source_word: እስከ አጽናፈ ምድር
  choice: पृथ्वी के छोरों तक
  rationale: मूल के बहुवचनात्मक, व्यापक प्रलयदर्शी भूगोल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: दर्शन में ब्रह्मांडीय भूगोल
  choice: पृथ्वी के छोरों तक
  alternative: देश की दूर की सीमा तक
  rationale: यहाँ व्यापक प्रलयदर्शी संसार-चित्र को स्थानीय यात्रा में सीमित किए बिना बनाए रखना उचित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। अंग्रेज़ी परामर्श-पाठ की परस्पर-विरोधी टिप्पणियों के बजाय गीइज़ ዓረብ और नवीनतम पाठ-समीक्षा के आधार पर ‘पश्चिम’ चुना गया है। कोई पादटिप्पणी आवश्यक नहीं, क्योंकि यहाँ ‘पूर्व’ वास्तविक स्रोतगत विकल्प नहीं बल्कि पूर्व अनुवाद की त्रुटि है।
