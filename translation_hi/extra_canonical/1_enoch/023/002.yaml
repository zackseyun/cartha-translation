  verdict: revise
  source_fidelity: The draft correctly represents the fire as both burning and moving, and preserves the non-cessation by day and night. ‘बहती थी’ is a defensible contextual rendering of the Geʽez verb, whose basic sense can be ‘run’; footnote a appropriately records that alternative. The phrase ‘अपने प्रवाह से न ... रुकती थी’ is syntactically and idiomatically unclear in Hindi, however, and does not clearly communicate cessation of the fire’s onward movement.
  naturalness: The opening and the temporal expression ‘दिन हो या रात’ are natural modern Hindi. Revising the middle clause to ‘अपने प्रवाह को रोकती थी’ makes the parallel ‘न तो ... न ...’ clear and idiomatic. Removing ‘निरन्तर’ from the final clause avoids a slightly redundant intensification while retaining the difficult concluding phrase’s sense of continuation.
  terminology: ‘आग,’ ‘विश्राम,’ ‘प्रवाह,’ and ‘चलती रहती थी’ are suitable for a modern, dignified Hindi visionary register. No theological terminology is at issue.
  issues:
