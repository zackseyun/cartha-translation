    issue: The expression ‘अपने प्रवाह से न तो विश्राम करती थी, न रुकती थी’ is awkward and semantically imprecise.
    rationale: Hindi does not naturally say that something ‘rests or stops from its flow.’ The source indicates that the fire neither rests nor ceases in/from its onward course. ‘अपने प्रवाह को रोकती थी’ clearly conveys the second member without adding meaning.
  - severity: low
    issue: ‘निरन्तर चलती रहती थी’ somewhat duplicates the ongoing sense already expressed by ‘चलती रहती थी.’
    rationale: The difficult final Geʽez phrase can be rendered as continuation ‘in the same way’; the footnote preserves the more elliptical alternative. ‘उसी प्रकार चलती रहती थी’ is sufficient and more restrained.
