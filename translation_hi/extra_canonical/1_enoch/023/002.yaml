  yaml_path: translation/extra_canonical/1_enoch/023/002.yaml
  text: And I saw a fire that burned and flowed[a], and it did not rest or cease from its course by day or by night[c][b], but continued in the same way.
translation:
  language: hi
  text: और मैंने एक आग देखी, जो जलती और बहती थी[a]। वह दिन हो या रात, न तो विश्राम करती थी और न अपने प्रवाह को रोकती थी[b], बल्कि उसी प्रकार चलती रहती थी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बहती थी’ का शाब्दिक भाव ‘दौड़ती थी’ भी हो सकता है। यह क्रिया आग की तीव्र, लगातार गति को दिखाती है; केवल ‘धधकती थी’ कहना गति के इस भाव को छिपा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अपने प्रवाह’ का अनुवाद ‘अपनी दौड़’, ‘अपने मार्ग’ या ‘अपनी गति’ भी किया जा सकता है। स्रोत का शब्द आग की न रुकने वाली आगे की गति पर बल देता है।
    reason: lexical_alternative
  - marker: c
    text: अन्तिम वाक्यांश कठिन है। इसका अर्थ उसी क्रिया के लगातार चलते रहने से हो सकता है; वैकल्पिक रूप से इसे अधिक संक्षेप में ‘पर वह ऐसी ही थी’ समझा जा सकता है।
    reason: textual_ambiguity
