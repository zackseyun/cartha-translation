base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/023/004.yaml
  text: And at that time Raguel[a], one of the holy angels who was with me, answered me and said to me, “This course of fire which you saw toward the west[c][b], it is the fire that drives all the lights of heaven.”
translation:
  language: hi
  text: उस समय मेरे साथ रहनेवाले पवित्र स्वर्गदूतों में से एक, रगूएल ने मुझे उत्तर दिया और कहा, “आग का यह प्रवाह[a], जिसे तुमने पश्चिम की ओर देखा, वही आग है जो आकाश की सभी ज्योतियों को चलाती है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल पाठ की इस पंक्ति की प्रतिलिपि कुछ स्थानों पर अस्पष्ट है। यहाँ अर्थ है ‘आग का यह प्रवाह/क्रम, जिसे तुमने पश्चिम की ओर देखा।’
    reason: textual_uncertainty
lexical_decisions:
- source_word: አውሥአኒ
  choice: मुझे उत्तर दिया
  rationale: क्रिया का स्वाभाविक अर्थ ‘उत्तर देना’ है और यह स्वर्गदूत द्वारा दर्शन की व्याख्या करने के संवादात्मक प्रसंग के अनुकूल है।
- source_word: ቅዱሳን መላእክት
  choice: पवित्र स्वर्गदूतों
  rationale: यह सर्वनाश-दर्शन संबंधी साहित्य में प्रयुक्त पद का स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: ዘርኢከ
  choice: जिसे तुमने ... देखा
  rationale: यह ዘ और ‘देखना’ क्रिया के द्वितीय पुरुष एकवचन रूप से बना संबंधवाचक वाक्यांश है; इसे ‘आत्मा’ समझना भाषिक रूप से उचित नहीं है।
- source_word: ሩጸተ
  choice: प्रवाह
  rationale: शब्द दौड़ने, गति या क्रमबद्ध चलने के भाव को व्यक्त करता है। ‘प्रवाह’ आग की गतिशील दिशा को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘मार्ग’ बाहरी रास्ते का अर्थ दे सकता है।
- source_word: መንገለ ዐረብ
  choice: पश्चिम की ओर
  rationale: दिशासूचक पद को दर्शन की भौगोलिक दिशा के रूप में सरल और स्वाभाविक ढंग से प्रस्तुत किया गया है।
- source_word: ይሰድድ
  choice: चलाती है
  rationale: मूल क्रिया बलपूर्वक आगे बढ़ाने या हाँकने का भाव रखती है। आकाशीय ज्योतियों के संदर्भ में ‘चलाती है’ स्पष्ट है और उनकी गति कराने का भाव बनाए रखता है।
- source_word: ብርሃናተ ሰማይ
  choice: आकाश की सभी ज्योतियों
  rationale: यह आकाशीय प्रकाश-पिंडों के लिए प्रयुक्त अभिव्यक्ति है; ‘ज्योतियाँ’ गरिमापूर्ण होने के साथ सामान्य पाठक के लिए बोधगम्य है।
theological_decisions:
- issue: दिखाई गई अग्नि की प्रकृति
  choice: इसे ‘आग का ... प्रवाह’ और फिर ‘वही आग’ कहा गया है
  alternative: इसे कोई व्यक्तिगत ‘आत्मा’ या दुष्ट शक्ति मानना
  rationale: स्रोत के स्पष्ट शब्द ‘जिसे तुमने देखा’ और ‘प्रवाह/गति’ हैं। इसलिए पाठ में ऐसी आत्मिक सत्ता नहीं जोड़ी गई जिसका मूल में उल्लेख नहीं है।
- issue: आकाश की ज्योतियों पर आग की क्रिया
  choice: ‘चलाती है’
  alternative: ‘खदेड़ती है’ या ‘तितर-बितर करती है’
  rationale: मूल क्रिया का बलपूर्ण भाव स्वीकार करते हुए भी प्रसंग आकाशीय ज्योतियों की नियमित गति का हो सकता है; ‘चलाती है’ इस संभावना को खुला रखता है और अनावश्यक विनाशकारी अर्थ नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण दर्शनात्मक शैली रखी गई है। ‘रगूएल’, ‘पवित्र स्वर्गदूत’ और ‘आकाश की ज्योतियाँ’ जैसे पद पारंपरिक गंभीरता बनाए रखते हैं, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सरल है।
