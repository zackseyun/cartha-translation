base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/001.yaml
  text: And I lifted up my hands in righteousness[a], and I blessed the Holy and Great One; and I spoke with the spirit of my mouth and with the tongue of flesh, which God has made for the children of the flesh of men, so that they might speak with it; and he gave them spirit and tongue and mouth[b], so that they might speak by them.
translation:
  language: hi
  text: और मैंने धार्मिकता में अपने हाथ उठाए और पवित्र और महान परमेश्वर को धन्य कहा। मैं अपने मुँह की श्वास[a] और देह की जीभ से बोला। यह जीभ परमेश्वर ने मनुष्यों की देह की संतानों[b] के लिए बनाई है, ताकि वे उससे बोलें। और उसने उन्हें श्वास, जीभ और मुँह दिए, ताकि वे उनके द्वारा बोलें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीइज़ शब्द का अर्थ “श्वास,” “आत्मा,” या “वायु” हो सकता है। यहाँ वाणी की मानवीय क्षमताओं और अंगों की सूची के कारण “श्वास” अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अभिव्यक्ति जानबूझकर देह पर बल देती है: “मनुष्यों की देह की संतानें।” यह केवल सामान्य रूप से “मनुष्य” कहने के बजाय उनकी सृजित, शारीरिक दशा को उभारती है।'
    reason: cultural_note
lexical_decisions:
- source_word: አልዐልኩ እደዋየ
  choice: मैंने अपने हाथ उठाए
  rationale: यह प्रार्थना में हाथ उठाने की शारीरिक मुद्रा को व्यक्त करता है; बहुवचन ‘हाथ’ मूल के भाव के अनुरूप है।
- source_word: በጽድቅ
  choice: धार्मिकता में
  rationale: पूर्वसर्गीय रचना को बनाए रखकर प्रार्थना के कार्य से जुड़ी नैतिक गुणवत्ता और गंभीर शैली सुरक्षित रहती है।
- source_word: ባረክዎ ለቅዱስ ወለዓቢይ
  choice: उस पवित्र और महान जन को धन्य कहा
  rationale: दोनों विशेषण एक ही दिव्य उपाधि के रूप में रखे गए हैं। ‘धन्य कहा’ यहाँ मनुष्य द्वारा परमेश्वर की स्तुति करने का स्वाभाविक हिन्दी रूप है।
- source_word: ነገርኩ በመንፈስ አፉየ
  choice: मैंने अपने मुँह की श्वास से वचन कहे
  rationale: भाषण-अंगों की इस सूची में መንፈስ का ‘श्वास’ अर्थ सबसे स्वाभाविक है; ‘वचन कहे’ क्रिया के बोलने/उच्चारण करने के अर्थ को गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: በልስነ ሥጋ
  choice: देह की जीभ से
  rationale: मूल की ठोस, शारीरिक छवि को बनाए रखा गया है; इसे केवल ‘मानवीय जीभ’ कहकर सामान्य नहीं बनाया गया।
- source_word: ውሉደ ሥጋ ሰብእ
  choice: मनुष्यों की देह की संतानों
  rationale: मूल की जानबूझकर सघन और देह-केंद्रित अभिव्यक्ति को यथासंभव सुरक्षित रखा गया है, यद्यपि हिन्दी में यह असामान्य सुनाई देती है।
- source_word: ከመ ይትናገሩ ባቲ
  choice: ताकि वे उससे बोलें
  rationale: स्त्रीलिंग एकवचन सर्वनाम का सबसे निकट और स्वाभाविक पूर्वपद ‘जीभ’ है।
- source_word: ወወሀቦሙ መንፈሰ ወልሳነ ወአፈ
  choice: उसने उन्हें श्वास, जीभ और मुँह दिए
  rationale: भाषण की दी हुई क्षमताओं और अंगों की त्रयी को स्पष्ट रखा गया है; प्रसंग के कारण መንፈስ के लिए फिर ‘श्वास’ चुना गया है।
- source_word: ከመ ይትናገሩ ቦቱ
  choice: ताकि वे उनके द्वारा बोलें
  rationale: बहुवचन साधनवाचक भाव तत्काल पूर्ववर्ती ‘श्वास, जीभ और मुँह’ तीनों की ओर संकेत करता है।
theological_decisions:
- issue: መንፈስ का अर्थ ‘आत्मा’ हो या ‘श्वास’
  choice: श्वास
  alternative: आत्मा; आत्मा/पवित्र आत्मा
  rationale: निकट प्रसंग में मुँह, जीभ और बोलने की मानवीय क्षमता की चर्चा है, इसलिए ‘श्वास’ सृष्ट मानवीय वाणी के भाव को बेहतर व्यक्त करता है। पादटिप्पणी ‘आत्मा’ की वास्तविक lexical संभावना को खुला रखती है।
- issue: पद की देह-केंद्रित मानव-छवि को कितना स्पष्ट रखा जाए
  choice: ‘देह की जीभ’ और ‘मनुष्यों की देह की संतानों’ को मुख्य पाठ में बनाए रखना
  alternative: ‘मानवीय जीभ’ और ‘मनुष्य’ जैसे अधिक सहज सामान्य रूप
  rationale: मूल पाठ शरीर और देह पर जानबूझकर बल देता है। उसे सरल बनाकर मिटाना पद की आलंकारिक और सृष्टि-संबंधी तीव्रता को कम कर देता।
- issue: ቅዱስ ወዓቢይ को कैसे व्यक्त किया जाए
  choice: उस पवित्र और महान जन
  alternative: पवित्र और महान परमेश्वर; पवित्र जन और महान जन
  rationale: मूल में दोनों विशेषण एक ही दिव्य सत्ता की उपाधियाँ हैं। ‘परमेश्वर’ जोड़ने से आशय स्पष्ट होता, पर वह इस पदबंध में प्रत्यक्ष संज्ञा नहीं है; इसलिए अधिक औपचारिक और स्रोत-सन्निकट रूप चुना गया।
