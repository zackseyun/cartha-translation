  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली अपनाई गई है। वाक्यों को पठनीय रखने के लिए लंबे गीइज़ वाक्य को छोटे हिन्दी वाक्यों में बाँटा गया, पर उसके क्रम और समानांतर रचना को सुरक्षित रखा गया। असामान्य देह-संबंधी भाषा को जानबूझकर अधिक सहज सामान्य शब्दों में नहीं बदला गया।
