base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/002.yaml
  text: Blessed are you[a], O Lord, great King and mighty in your greatness, Lord of all the creation of heaven, King of kings and God of all the world. And your kingship and your kingdom and your greatness endure forever and ever, and your authority is for all generations of generations. And all the heavens are your throne forever[d][c][b], and the whole earth is the footstool of your feet forever and ever.
translation:
  language: hi
  text: हे प्रभु, आप धन्य हैं! आप महान राजा हैं और अपनी महानता में सामर्थी हैं; आप स्वर्ग की सारी सृष्टि के प्रभु, राजाओं के राजा और सारे संसार के परमेश्वर हैं। आपका राजत्व[a], आपका राज्य और आपकी महानता सदा-सर्वदा बनी रहती है, और आपका अधिकार पीढ़ी-दर-पीढ़ी बना रहता है। सारे आकाश सदा-सर्वदा आपका सिंहासन हैं[b], और सारी पृथ्वी सदा-सर्वदा आपके चरणों की चौकी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘राजत्व’ के लिए मूल गीज़ पद पाठगत रूप से कठिन है; इसका अर्थ ‘प्रभुता,’ ‘महिमा,’ या ‘वैभव’ भी हो सकता है।
    reason: textual_variant
  - marker: b
    text: तुलना करें यशायाह 66:1। यहाँ आकाश को सिंहासन और पृथ्वी को चरणों की चौकी बताने वाली व्यापक राजकीय छवि मिलती है, यद्यपि शब्दशः समानता आवश्यक नहीं है।
    reason: cross_reference
lexical_decisions:
- source_word: ቡሩክ
  choice: आप धन्य हैं
  rationale: प्रत्यक्ष ईश-संबोधन में प्रयुक्त आशीर्वाद/स्तुति-सूत्र को स्वाभाविक और गरिमामय हिन्दी में रखता है।
- source_word: ንጉሥ ዐቢይ ወኃያል በዕበየ ዚአከ
  choice: आप महान राजा हैं और अपनी महानता में सामर्थी हैं
  rationale: राजकीय उपाधि, सामर्थ्य और महानता—तीनों को बिना मिलाए सुरक्षित रखता है।
- source_word: ኵሉ ፍጥረት ሰማይ
  choice: स्वर्ग की सारी सृष्टि
  rationale: गीज़ के चिह्नित संबंध ‘सारी सृष्टि—स्वर्ग’ को निकटता से व्यक्त करता है; इसका अर्थ समस्त स्वर्गीय सृष्टि भी समझा जा सकता है।
- source_word: ንጉሠ ነገሥት
  choice: राजाओं के राजा
  rationale: मूल राजकीय परमोत्कर्ष-सूचक पदवी का हिन्दी में स्थापित और सीधा रूप।
- source_word: አምላከ ኵሉ ዓለም
  choice: सारे संसार के परमेश्वर
  rationale: इस विश्वव्यापी राजत्व के प्रसंग में ዓለም को ‘संसार’ समझना सर्वाधिक उपयुक्त है।
- source_word: መላኵትከ
  choice: आपका राजत्व
  rationale: पाठ/रूप कुछ कठिन है; निकटवर्ती ‘राज्य’ के साथ राजकीय प्रभुता का पक्ष बनाए रखते हुए संभावित ‘महिमा’ से भेद करता है।
- source_word: መንግሥትከ
  choice: आपका राज्य
  rationale: ठोस राज्य और शासन, दोनों की अर्थ-छाया बनाए रखता है।
- source_word: ይነብር
  choice: बनी रहती है
  rationale: राजत्व, राज्य और महानता की स्थायी निरंतरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ስልጣንከ
  choice: आपका अधिकार
  rationale: मूल में उपस्थित अलग संज्ञा को स्पष्टतः रखता है और उसे पिछली उपवाक्य-श्रृंखला में विलीन नहीं करता।
- source_word: ለዓለም ወለዓለመ ዓለም
  choice: सदा-सर्वदा
  rationale: अनंतता के बलाघाती गीज़ सूत्र का प्रचलित, गरिमामय हिन्दी समतुल्य।
- source_word: መካይደ እገሪከ
  choice: आपके चरणों की चौकी
  rationale: सिंहासन और पादपीठ की ठोस ब्रह्मांडीय राजकीय छवि को सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर के विश्वव्यापी राजत्व और सिंहासन-पादपीठ की छवि
  choice: आकाश को सिंहासन और पृथ्वी को चरणों की चौकी कहने वाली प्रत्यक्ष ब्रह्मांडीय राजकीय छवि बनाए रखी गई
  alternative: इसे सामान्य स्तुति या केवल मंदिर-संबंधी रूपक में बदलना
  rationale: मूल पाठ का अपोकैलिप्टिक वैभव और सार्वभौम शासन इसी ठोस छवि में व्यक्त होता है; इसे अमूर्त करने से अर्थ घटेगा।
- issue: መላኵትከ का कठिन पाठ
  choice: राजत्व
  alternative: महिमा, प्रभुता या वैभव
  rationale: ‘राज्य’ और ‘महानता’ के साथ इसकी राजकीय अर्थ-छाया संगत है, पर पाठगत कठिनाई को टिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थनापूर्ण, गरिमामय, पर सामान्य पाठक के लिए सुबोध। ‘हे प्रभु’ और ‘आप’ से आदरसूचक प्रत्यक्ष संबोधन रखा गया है। मूल की पुनरुक्ति और ब्रह्मांडीय राजकीय भाषा को अनावश्यक रूप से सरल नहीं किया गया।
