base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/005.yaml
  text: And now, O God and Lord and great King, I beseech and ask that you establish my prayer for me.
translation:
  language: hi
  text: और अब, हे परमेश्वर, प्रभु और महान राजा, मैं तुझसे विनती करता और माँगता हूँ कि तू मेरी प्रार्थना को मेरे पक्ष में स्थिर कर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላክ
  choice: परमेश्वर
  rationale: ईश्वर के लिए सामान्य और गरिमापूर्ण हिन्दी संबोधन; यहाँ कोई विशिष्ट नाम नहीं है।
- source_word: እግዚእ
  choice: प्रभु
  rationale: स्वामी अथवा प्रभु के अर्थ को स्वाभाविक धार्मिक हिन्दी में व्यक्त करता है।
- source_word: ንጉሥ፡ ዐቢይ
  choice: महान राजा
  rationale: स्रोत के विशेषण और संज्ञा के क्रम तथा अर्थ को सीधे बनाए रखता है।
- source_word: አስተበቍዕ፡ ወእስእል
  choice: विनती करता और माँगता हूँ
  rationale: दो समन्वित क्रियाओं की पुनरुक्तिपूर्ण तीव्रता को मिटाए बिना सहज हिन्दी देता है।
- source_word: ታቅም፡ ሊተ፡ ስእለተየ
  choice: मेरे लिए मेरी प्रार्थना को दृढ़ कर
  rationale: ‘स्थापित/दृढ़ करना’, ‘मेरे लिए’, और ‘मेरी प्रार्थना’—तीनों स्रोत-तत्त्वों को सुरक्षित रखता है; ‘दृढ़ कर’ हिन्दी में प्रार्थना को प्रभावी अथवा स्थिर करने की याचना के रूप में समझने योग्य है।
theological_decisions:
- issue: प्रार्थना को ‘स्थापित’ करने का आशय
  choice: मेरी प्रार्थना को दृढ़ कर
  alternative: मेरी प्रार्थना को स्वीकार कर
  rationale: ‘स्वीकार कर’ अर्थ को धर्मवैचारिक रूप से स्पष्ट कर देता, पर स्रोत की असामान्य और संभावित रूप से व्यापक अभिव्यक्ति को संकुचित करता। ‘दृढ़ कर’ मूल रूपक और उसकी अस्पष्टता बचाता है।
- issue: द्वितीय पुरुष का संबोधन
  choice: तू/तुझसे
  alternative: आप/आपसे
  rationale: परमेश्वर को संबोधित पारंपरिक प्रार्थनात्मक निकटता और एकवचन क्रियारूप को बनाए रखते हुए आधुनिक पाठक के लिए स्पष्ट रहता है; इसका उद्देश्य अनादर व्यक्त करना नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थनात्मक शैली। संबोधनों की श्रृंखला और दोहरी याचना को स्रोत के अनुरूप रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
