base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/003.yaml
  text: For you have made all things[a], and over all things you rule; and no deed is too hard for you, and not even a single wisdom passes beyond the throne of your dwelling, nor turns away from before your face. And you know all things, and see, and hear, and there is nothing hidden from you[d][c][b], for you see all things.
translation:
  language: hi
  text: क्योंकि सब कुछ आपने ही बनाया है, और सब पर आप ही राज्य करते हैं; कोई भी काम आपके लिए अत्यन्त कठिन नहीं है[a]। एक भी बुद्धि आपके निवास के सिंहासन से परे नहीं जाती[b], और न आपके मुख के सामने से हटती है। आप सब कुछ जानते, देखते और सुनते हैं; आपसे कुछ भी छिपा नहीं है, क्योंकि आप सब कुछ देखते हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कोई भी काम आपका सामना नहीं कर सकता।” गीइज़ अभिव्यक्ति का अर्थ किसी काम का किसी के लिए अत्यन्त कठिन होना है; उसे विरोध या सामना करने के अर्थ में भी समझा गया है।
    reason: lexical_alternative
  - marker: b
    text: “एक भी बुद्धि” वाला वाक्यांश गीइज़ में कठिन है। आशय कोई बुद्धिमान योजना, विचार या विषय हो सकता है जो परमेश्वर के राजकीय निवास से परे नहीं है।
    reason: lexical_alternative
  - marker: c
    text: अन्तिम पंक्ति “क्योंकि आप सब कुछ देखते हैं” सम्पूर्ण दिव्य ज्ञान के विषय को दोहराती है; कुछ पाठ-साक्ष्य इसे स्पष्ट समापन-पंक्ति के रूप में सुरक्षित रखते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: ገበርከ ... ለኵሉ
  choice: सब कुछ आपने ही बनाया है, और सब पर आप ही राज्य करते हैं
  rationale: पहली क्रिया का मूल अर्थ ‘करना/बनाना’ है और अगला पद सार्वभौमिक ‘सब’ तथा राजकीय शासन व्यक्त करता है। हिन्दी में स्वाभाविक, समग्र अर्थ देने के लिए ‘सब कुछ’ पहले उपवाक्य में स्पष्ट किया गया और दूसरे में ‘सब पर’ रखा गया।
- source_word: ትመልክ
  choice: आप ही राज्य करते हैं
  rationale: क्रिया राजकीय शासन का बोध कराती है; ‘राज्य करते हैं’ गरिमापूर्ण और सामान्य हिन्दी में स्पष्ट है।
- source_word: ኢይጸንዐከ ግብር
  choice: कोई भी काम आपके लिए अत्यन्त कठिन नहीं है
  rationale: यह निर्माण किसी काम के किसी व्यक्ति के लिए अत्यन्त कठिन या असाध्य होने का परिचित गीइज़ मुहावरा है; इसे केवल ‘विरोध करने’ के अर्थ में लेना कम सटीक होगा।
- source_word: ወአሐቲ ጥበብ
  choice: एक भी बुद्धि
  rationale: असामान्य मूल अभिव्यक्ति ‘एक बुद्धि’ को जानबूझकर निकट रखा गया है; इसे निश्चित रूप से ‘योजना’, ‘विचार’ या ‘बुद्धिमानी की बात’ नहीं बनाया गया।
- source_word: ኢትሐልፍ እምንባራተ ምንባሪከ
  choice: आपके निवास के सिंहासन से परे नहीं जाती
  rationale: ‘पार जाना’ तथा सिंहासन/निवास की दोहरी स्थानिक-राजकीय छवि को सुरक्षित रखा गया है।
- source_word: ኢትትመየጥ ኢእምገጽከ
  choice: न आपके मुख के सामने से हटती है
  rationale: ‘मुख के सामने’ मूल की सजीव उपस्थितिपरक भाषा को बचाता है; ‘उपस्थिति’ अधिक सहज विकल्प है, पर कम मूर्त।
- source_word: ታአምር ... ትሬኢ ... ትሰምዕ
  choice: आप सब कुछ जानते, देखते और सुनते हैं
  rationale: तीनों समन्वित क्रियाओं और व्यापक दिव्य ज्ञान के बल को संक्षिप्त, स्वाभाविक हिन्दी में रखा गया है।
- source_word: ዘይትኀባእ
  choice: छिपा
  rationale: यह मूल के ‘गुप्त/छिपे होने’ का सीधा और प्रचलित हिन्दी रूप है।
theological_decisions:
- issue: ईश्वर की सार्वभौमिक प्रभुता और सर्वज्ञता
  choice: पद को इस दृढ़ कथन के रूप में रखा गया कि ईश्वर सबका कर्ता और शासक है तथा उससे कुछ भी छिपा नहीं।
  alternative: इसे केवल सामान्य स्तुतिपरक अतिशयोक्ति मानकर सार्वभौमिक भाषा को हल्का करना।
  rationale: ‘सब’ की पुनरावृत्ति तथा जानने, देखने, सुनने और कुछ भी न छिपे होने की संयुक्त भाषा प्रबल सार्वभौमिक अर्थ का समर्थन करती है।
- issue: ‘एक भी बुद्धि’ और सिंहासन वाला कठिन वाक्यांश
  choice: असामान्य शब्दावली और स्थानिक चित्र को मुख्य पाठ में अपेक्षाकृत औपचारिक रूप से सुरक्षित रखा गया।
  alternative: ‘कोई बुद्धिमान योजना आपके ज्ञान से बाहर नहीं’ जैसे अर्थ-स्पष्ट करने वाले रूप में अनुवाद करना।
  rationale: मूल वाक्यांश का आशय अनिश्चित है; किसी एक व्याख्या को मुख्य पाठ में निर्णायक बनाना उचित नहीं।
- issue: किसी काम का ईश्वर के लिए कठिन न होना
  choice: मुहावरे को ‘अत्यन्त कठिन नहीं’ के रूप में समझा गया।
  alternative: ‘कोई काम आपका विरोध नहीं करता।’
  rationale: गीइज़ क्रिया का व्यक्ति-सूचक प्रत्यय के साथ प्रयोग ‘किसी के लिए कठिन/असाध्य होना’ व्यक्त कर सकता है और इस संदर्भ में दिव्य सामर्थ्य के कथन से मेल खाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। ईश्वर के लिए आदरसूचक ‘आप’ प्रयुक्त है। कठिन मध्यवर्ती वाक्य को सहज बनाने के नाम पर उसकी वास्तविक अस्पष्टता दूर नहीं की गई; स्पष्टीकरण पादटिप्पणी में दिया गया है।
