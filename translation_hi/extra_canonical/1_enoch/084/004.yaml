base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/004.yaml
  text: And now the angels of your heavens have transgressed[c][b][a], and your wrath is upon the flesh of men until the great day of judgment.
translation:
  language: hi
  text: और अब आपके स्वर्गों के दूतों ने अपराध किया है,[a] और आपका प्रकोप मनुष्य की देह पर न्याय के महान दिन तक बना हुआ है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध गीइज़ OCR-पाठ में यहाँ ऐसा रूप है जिसे ‘विनती करें’ पढ़ा जा सकता है, पर यह संभवतः अक्षर-पहचान की त्रुटि है; संशोधित पठन का अर्थ ‘उन्होंने पाप किया’ या ‘उन्होंने अपराध किया’ है।
    reason: textual_variant
  - marker: b
    text: ‘मनुष्य की देह’ स्रोत की एकवचन अभिव्यक्ति को सुरक्षित रखता है; प्रसंग में इसका संकेत नश्वर मानवजाति की ओर सामूहिक रूप से है। उपलब्ध OCR-पाठ का अंतिम शब्द भी दोषपूर्ण जान पड़ता है; संशोधित पठन ‘न्याय’ का समर्थन करता है।
    reason: textual_variant
lexical_decisions:
- source_word: መላእክተ ሰማያቲከ
  choice: आपके स्वर्गों के दूत
  rationale: ‘दूत’ इस स्वर्गीय और प्रलय-संबंधी प्रसंग में अलौकिक प्राणियों को दर्शाता है। स्रोत का बहुवचन ‘स्वर्गों’ और परमेश्वर को संबोधित संबंधसूचक रूप ‘आपके’ दोनों सुरक्षित रखे गए हैं।
- source_word: ይጌግዩ (प्राप्त प्रतिलिपि में ይጼብቡ)
  choice: अपराध किया है
  rationale: पांडुलिपीय पाठ के संशोधित पठन का अर्थ पाप या सीमा-उल्लंघन करना है। ‘अपराध किया है’ घटना की पूर्णता और नैतिक उल्लंघन दोनों व्यक्त करता है; इसे ‘विनती करें’ पढ़ना उपलब्ध प्रतिलिपि की अक्षर-पहचान संबंधी त्रुटि पर आधारित होगा।
- source_word: ትከውን መዐትከ
  choice: आपका प्रकोप ... बना हुआ है
  rationale: यहाँ कथन को संकेतार्थक रूप में लिया गया है, न कि परमेश्वर से की गई आज्ञार्थक प्रार्थना के रूप में। ‘प्रकोप’ न्याय के प्रसंग की तीव्रता को बनाए रखता है।
- source_word: ዲበ ሥጋ ሰብእ
  choice: मनुष्य की देह पर
  rationale: यह स्रोत की ठोस ‘देह’ वाली छवि और एकवचन सामूहिक मुहावरे को बचाता है। केवल ‘मानवजाति पर’ कहने से मूल का नश्वर देह संबंधी स्वर मिट जाता।
- source_word: እስከ ዕለት ዐባይ ... ኵነኔ (प्राप्त प्रतिलिपि का अंतिम शब्द ጽጌ)
  choice: न्याय के महान दिन तक
  rationale: संशोधित पठन ‘न्याय’ है और यह प्रलय-संबंधी कालवाचक अभिव्यक्ति को स्पष्ट तथा संक्षिप्त रूप में प्रस्तुत करता है।
theological_decisions:
- issue: ‘मनुष्य की देह’ पर प्रकोप का दायरा
  choice: स्रोत के एकवचन मुहावरे को रखते हुए इसे सामूहिक मानवता के अर्थ में खुला रखा गया है।
  alternative: ‘सारी मानवजाति पर’ या ‘मनुष्यों के शरीरों पर’
  rationale: संदर्भ सामूहिक न्याय की ओर संकेत करता है, किंतु अनुवाद में ‘देह’ और व्याकरणिक एकवचन बनाए रखने से मूल की मानवशास्त्रीय छवि और संभावित तनाव सुरक्षित रहता है।
- issue: दूतों के कार्य का स्वरूप
  choice: इसे पूर्ण नैतिक उल्लंघन के कथन के रूप में अनूदित किया गया है।
  alternative: दूतों द्वारा विनती किए जाने की प्रार्थना
  rationale: संशोधित गीइज़ पठन ‘वे पाप करते हैं/अपराधी हैं’ का समर्थन करता है। इस कारण वाक्य को विनती या मध्यस्थता के रूप में प्रस्तुत करना अर्थ को उलट देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘स्वर्गों,’ ‘प्रकोप,’ ‘देह’ और ‘महान दिन’ जैसे शब्द प्रलय-साहित्य की ऊँची शैली तथा स्रोत की प्रमुख छवियों को बनाए रखते हैं।
