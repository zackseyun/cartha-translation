base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/003/001.yaml
  text: Observe and see all the trees[a], how they appear withered, and all their leaves stripped off—except fourteen trees, which do not lose their leaves, but remain from the old until the new comes[c][b], through two and three winters.
translation:
  language: hi
  text: ध्यान से देखो कि सभी पेड़ कैसे सूखे हुए दिखाई देते हैं और उनके सारे पत्ते झड़ चुके हैं—चौदह पेड़ों को छोड़कर, जिनके पत्ते नहीं झड़ते, बल्कि वे पुराने से लेकर नए के आने तक[a], दो और तीन शीत ऋतुओं तक[b], बने रहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पुराने से लेकर नए के आने तक” संक्षिप्त और अस्पष्ट अभिव्यक्ति है। सम्भवतः इसका संकेत पुरानी ऋतु या वर्ष के बीतने और नई ऋतु या वर्ष के आने की ओर है।
    reason: cultural_note
  - marker: b
    text: “दो और तीन शीत ऋतुओं तक” मूल में कठिन अभिव्यक्ति है। इसका अर्थ “दो या तीन शीत ऋतुओं तक” भी हो सकता है, अथवा नवीकरण से पहले बार-बार आने वाली शीत ऋतुओं की ओर संकेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ጠይቁ፡ ወርእዩ
  choice: ध्यान से देखो
  rationale: दोनों बहुवचन आज्ञार्थक क्रियाएँ मिलकर सावधानीपूर्वक निरीक्षण का आह्वान करती हैं। यहाँ ጠይቁ का अर्थ प्रसंग और संभावित यूनानी पृष्ठभूमि के अनुसार ‘पूछो’ से अधिक ‘ध्यान दो/निरीक्षण करो’ है; संक्षिप्त हिन्दी पदबंध अनावश्यक पुनरुक्ति से बचता है।
- source_word: ኵሎ፡ ዕፀወ
  choice: सभी पेड़
  rationale: समूहवाचक बहुवचन का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: እፎ፡ ያስተርእዩ፡ ከመ፡ ይቡስ
  choice: कैसे सूखे हुए दिखाई देते हैं
  rationale: እፎ को ‘कैसे’ और दृश्य-प्रतीति वाली क्रिया को ‘दिखाई देते हैं’ से व्यक्त किया गया है; ‘क्या’ कहकर प्रश्नवाचक अनिश्चितता नहीं जोड़ी गई।
- source_word: ወኵሉ፡ አቍጽሊሆሙ፡ ንጉፍ
  choice: और उनके सारे पत्ते झड़ चुके हैं
  rationale: पत्तों से रहित होने की स्पष्ट वनस्पतिक छवि को सहज हिन्दी में रखा गया है। ‘नोच लिए गए’ कारण या कर्ता को जरूरत से अधिक स्पष्ट करता।
- source_word: ዘእንበለ፡ ፲ወ፬ ዕፀወ
  choice: चौदह पेड़ों को छोड़कर
  rationale: अपवादसूचक वाक्यांश और स्पष्ट संख्या को सीधे सुरक्षित रखता है।
- source_word: ዘኢይትነገፉ
  choice: जिनके पत्ते नहीं झड़ते
  rationale: पहले आए पत्तों के झड़ने से समानांतर विरोध बनाए रखने के लिए वही ठोस शब्दावली रखी गई है।
- source_word: እላ፡ ይጸንሑ
  choice: बल्कि वे ... बने रहते हैं
  rationale: अपवाद में आए पेड़ों की निरंतर दशा और विरोधसूचक संबंध दोनों व्यक्त होते हैं।
- source_word: እምብሉይ፡ እስከ፡ ይመጽእ፡ ኃዲስ
  choice: पुराने से लेकर नए के आने तक
  rationale: मूल में ‘पुराना’ और ‘नया’ के संज्ञार्थ अस्पष्ट हैं। मुख्य पाठ में ऋतु या वर्ष जोड़कर अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया; स्पष्टीकरण पादटिप्पणी में है।
- source_word: እምክልኤ፡ ወእም፡ ፫ ክረምት
  choice: दो और तीन शीत ऋतुओं तक
  rationale: कठिन और असामान्य संख्यात्मक अभिव्यक्ति को निकट रूप में रखा गया है। ‘दो या तीन’ सम्भव अर्थ है, पर संयोजक को मुख्य पाठ में विकल्पसूचक बनाना निश्चित नहीं है।
theological_decisions:
- issue: पेड़ों और ऋतु-चक्र की छवि को मुख्य पाठ में प्रतीकात्मक बनाना या प्रत्यक्ष वर्णन रहने देना
  choice: प्रत्यक्ष वनस्पतिक और ऋतु-संबंधी वर्णन बनाए रखना
  alternative: पेड़ों को मनुष्यों, आध्यात्मिक वर्गों या ब्रह्मांडीय व्यवस्थाओं का प्रतीक बताना
  rationale: गीज़ पाठ स्वयं पेड़ों, पत्तों और शीत ऋतुओं का वर्णन करता है। सृष्टि के निरीक्षण से आगे का धार्मिक अर्थ पाठक के लिए खुला रखा गया है; अनुवाद में कोई सांप्रदायिक या निजी रूपक नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, बहुवचन आज्ञार्थक संबोधन और गरिमापूर्ण किंतु सरल शब्दावली। मूल की दो प्रमुख अस्पष्टताएँ—‘पुराना/नया’ और ‘दो और तीन शीत ऋतुएँ’—मुख्य पाठ में सुरक्षित रखी गई हैं तथा पादटिप्पणियों में सम्भावित अर्थ दिए गए हैं।
