  text: And through its valleys come rivers of fire, where those angels shall be judged who led astray those who dwell upon the dry land.
translation:
  language: hi
  text: और उसकी घाटियों से होकर आग की नदियाँ बहती हैं,[a] जहाँ उन स्वर्गदूतों का न्याय होगा जिन्होंने सूखी भूमि पर रहनेवालों[b] को भटका दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आग की नदियाँ आती/निकलती हैं।”
    reason: lexical_alternative
  - marker: b
    text: “सूखी भूमि पर रहनेवाले” से आशय संभवतः पृथ्वी के मानव निवासियों से है; मूल की ठोस अभिव्यक्ति यहाँ बनाए रखी गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወእነተ፡ ቈላት፡ ዚአሃ
  choice: और उसकी घाटियों से होकर
  rationale: नवीन पाठ-समीक्षा और निकटवर्ती संदर्भ के अनुसार ቈላት को बहुवचन ‘घाटियाँ’ और ዚአሃ को संबंधसूचक ‘उसकी’ माना गया है। इससे पिछले पदों की भू-दृश्यात्मक छवि बनी रहती है।
- source_word: አፍላገ፡ እሳት
  choice: आग की नदियाँ
  rationale: यह बहुवचन पद बहती हुई अग्निमय धाराओं का सजीव अपोकैलिप्टिक चित्र प्रस्तुत करता है; ‘नदियाँ’ उसके विस्तार और तीव्रता को बनाए रखता है।
- source_word: ይመጽኡ
  choice: बहती हैं
  rationale: अपूर्ण क्रिया को दर्शन के वर्तमान वर्णन के रूप में लिया गया है। नदियों के साथ ‘बहती हैं’ स्वाभाविक हिन्दी है, यद्यपि शाब्दिक अर्थ ‘आती/निकलती हैं’ हो सकता है।
- source_word: ይትኴነኑ
  choice: न्याय होगा
  rationale: न्यायिक निष्क्रिय अर्थ को सुरक्षित रखा गया है; ‘दण्डित किए जाएँगे’ कहने से परिणाम को अनावश्यक रूप से पहले ही निश्चित कर दिया जाता।
- source_word: እልኩቱ፡ መላእክት
  choice: उन स्वर्गदूतों
  rationale: 1 हनोक के संदर्भ में መላእክት अलौकिक स्वर्गदूतों को सूचित करता है; संकेतवाचक भाव भी ‘उन’ से रखा गया है।
- source_word: አስሐትዎሙ
  choice: भटका दिया
  rationale: कारक भाव स्पष्ट करता है कि स्वर्गदूतों ने दूसरों को गलत राह पर लगाया; ‘भटका दिया’ आधुनिक और नैतिक रूप से सार्थक हिन्दी है।
- source_word: ለእለ፡ የኃድሩ፡ ዲበ፡ የብስ
  choice: सूखी भूमि पर रहनेवालों
  rationale: मूल की ठोस ब्रह्मांडीय अभिव्यक्ति ‘सूखी भूमि’ को सामान्य ‘पृथ्वी’ में समतल नहीं किया गया है।
theological_decisions:
- issue: न्याय पाएँगे स्वर्गदूतों की विशिष्ट पहचान
  choice: पाठ केवल उन स्वर्गदूतों की बात करता है जिन्होंने सूखी भूमि के निवासियों को भटकाया।
  alternative: इन्हें उत्पत्ति 6 की परंपरा के ‘पहरेदार’ स्वर्गदूतों के रूप में स्पष्टतः पहचानना।
  rationale: स्थानीय गीइज़ पाठ ऐसी विशिष्ट उपाधि नहीं देता; इसलिए अनुवाद व्यापक पहचान बनाए रखता है और बाहरी परंपरा को मुख्य पाठ में नहीं जोड़ता।
- issue: न्याय का परिणाम
  choice: ‘न्याय होगा’
  alternative: ‘दण्डित किए जाएँगे’
  rationale: मूल न्यायिक प्रक्रिया व्यक्त करता है; संभावित दोषसिद्धि को अनुवाद में स्पष्ट परिणाम बनाना धर्मवैज्ञानिक तनाव को समय से पहले सुलझा देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और दृश्यात्मक शैली रखी गई है। ‘आग की नदियाँ’, ‘न्याय होगा’ और ‘सूखी भूमि’ जैसे पद मूल की अपोकैलिप्टिक छवि तथा न्यायिक अनिश्चितता को सुरक्षित रखते हैं।
