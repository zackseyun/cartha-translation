  text: And in those days the word of the Lord came to me[a], and he said to me, “Noah, your portion has come up before me—a portion without blame[b], a portion of love and uprightness.”
translation:
  language: hi
  text: और उन दिनों प्रभु का वचन मेरे पास आया, और उसने मुझसे कहा, “नूह, तुम्हारा भाग मेरे पास चढ़ आया है[a]—दोष से रहित भाग, प्रेम और सत्यनिष्ठा का भाग।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारा भाग मेरे सामने ऊपर उठा है।” गीइज़ पाठ परमेश्वर की उपस्थिति की ओर ऊपर जाने की छवि बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወበእማንቱ መዋዕል
  choice: और उन दिनों
  rationale: यह प्रकाशन-साहित्य में प्रयुक्त समय-सूचक सूत्र है; ‘उन दिनों’ मूल की ऊँची, दर्शनीय शैली को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ቃለ እግዚአብሔር
  choice: प्रभु का वचन
  rationale: यह भविष्यद्वाणी-संबंधी प्रकाशन का सूत्र है। ‘वचन’ औपचारिक अर्थ को बनाए रखता है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: ኀቤየ
  choice: मेरे पास / मुझसे
  rationale: ‘आया’ के साथ ‘मेरे पास’ और ‘कहा’ के साथ ‘मुझसे’ आधुनिक हिन्दी में स्वाभाविक हैं।
- source_word: ክፍልከ
  choice: तुम्हारा भाग
  rationale: ‘भाग’ आवंटित हिस्से, विरासत या किसी के ठहराए हुए स्थान—इन संभावित अर्थों को खुला रखता है।
- source_word: ዐርገ ኀቤየ
  choice: मेरे सामने ऊपर आया है
  rationale: यह अनुवाद दिव्य उपस्थिति की ओर ऊपर उठने की मूल स्थानगत छवि को बनाए रखता है और हिन्दी में समझने योग्य है।
- source_word: ዘአልቦቱ ሒስ
  choice: जिस पर कोई दोष नहीं
  rationale: यह न्यायिक या आरोप-संबंधी भाव को व्यक्त करता है, पर इसे निरपेक्ष पापहीनता का कथन नहीं बनाता।
- source_word: ፍቅር
  choice: प्रेम
  rationale: संज्ञा-रूप बनाए रखने से मूल का वर्णनात्मक ढाँचा सुरक्षित रहता है।
- source_word: ወርትዕ
  choice: और खराई
  rationale: ‘खराई’ नैतिक सीधेपन और सही आचरण का भाव देती है, जबकि बाद की विशिष्ट धर्मवैज्ञानिक शब्दावली को आरोपित नहीं करती।
theological_decisions:
- issue: नूह के ‘भाग’ को प्रकाशन और न्याय के प्रसंग में कैसे व्यक्त किया जाए
  choice: तुम्हारा भाग मेरे सामने ऊपर आया है
  alternative: तुम्हारा चिट्ठी में ठहराया हुआ हिस्सा मेरे पास चढ़ आया है
  rationale: ‘भाग’ विरासत, आवंटित स्थान और परमेश्वर के सामने नूह की स्थिति के बीच मूल की अस्पष्टता को बनाए रखता है; ‘ऊपर आया’ स्वर्गीय उपस्थिति की छवि सुरक्षित रखता है।
- issue: क्या ዘአልቦቱ ሒስ को निरपेक्ष नैतिक सिद्धता के रूप में प्रस्तुत किया जाए
  choice: जिस पर कोई दोष नहीं
  alternative: निर्दोष भाग
  rationale: चुना गया रूप प्रबल प्रशंसा और दोषारोपण से मुक्ति का भाव रखता है, लेकिन इसे अनिवार्य रूप से पूर्ण पापहीनता नहीं बनाता।
