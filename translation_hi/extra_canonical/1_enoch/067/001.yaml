  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। मूल की पुनरावृत्ति (‘भाग … भाग’) तथा ‘ऊपर आया’ की स्थानगत छवि जानबूझकर रखी गई है। ‘खराई’ को नैतिक सीधेपन के लिए चुना गया है, बिना किसी संप्रदायगत अर्थ को आरोपित किए।
