base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/003.yaml
  text: And I will establish your offspring before me forever and ever[a], and I will make those who dwell with you fruitful. It shall not be barren upon the face of the dry ground[c][b], but it shall be blessed and multiplied on the dry ground in the name of the Lord.
translation:
  language: hi
  text: और मैं तेरे वंश को अपने सामने युगानुयुग स्थिर रखूँगा, और जो तेरे साथ रहते हैं उन्हें फलवंत करूँगा[a]। वह वंश सूखी भूमि की सतह पर बाँझ न रहेगा[b][c], बल्कि प्रभु के नाम में सूखी भूमि पर आशीष पाएगा और बहुत बढ़ेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘फलवंत करूँगा’ वाली क्रिया का अर्थ ‘बोऊँगा’, ‘फैलाऊँगा’ या ‘बढ़ाऊँगा’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: प्राप्त गीइज़ पाठ में यहाँ ओबेलस से चिह्नित एक संदिग्ध रूप है, जिसका शाब्दिक अर्थ ‘वह परामर्श न करेगा’ प्रतीत होता है। ‘बाँझ न रहेगा’ निकट वर्तनी वाले प्रस्तावित पाठ और आगे के ‘आशीष’ तथा ‘वृद्धि’ के संदर्भ पर आधारित है।
    reason: textual_variant
  - marker: c
    text: ‘सूखी भूमि’ मूल की ठोस अभिव्यक्ति है; यहाँ इसका सामान्य अर्थ ‘भूमि’ या ‘पृथ्वी’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: አጸንዖ
  choice: स्थिर रखूँगा
  rationale: मूल क्रिया किसी को दृढ़ या स्थापित करने का भाव देती है। वंश और अनन्त अवधि के संदर्भ में यह स्वाभाविक हिन्दी है और मूल में निहित स्थायित्व को बनाए रखती है।
- source_word: ዘርእከ
  choice: तेरे वंश को
  rationale: यह सामूहिक एकवचन ‘बीज/सन्तति’ का वंशगत अर्थ व्यक्त करता है और आगे आने वाली एकवचन क्रियाओं के साथ संगत है।
- source_word: በቅድሜየ
  choice: अपने सामने
  rationale: यह ‘मेरे सम्मुख/मेरी उपस्थिति में’ का सीधा संबंधपरक अर्थ सुरक्षित रखता है।
- source_word: ለዓለመ ዓለም
  choice: युगानुयुग
  rationale: यह अनन्त अवधि बताने वाली बलवती पुनरुक्ति का संक्षिप्त, प्रतिष्ठित और प्रचलित हिन्दी रूप है।
- source_word: አዘርኦሙ
  choice: उन्हें फलवंत करूँगा
  rationale: क्रिया में बोने, फैलाने या बढ़ाने का भाव हो सकता है। बाँझपन, आशीष और वृद्धि के निकट संदर्भ में ‘फलवंत करूँगा’ अर्थ-संबंध को स्वाभाविक बनाता है, जबकि विकल्प को पादटिप्पणी में रखा गया है।
- source_word: እለ ያኃድሩ ምስሌከ
  choice: जो तेरे साथ रहते हैं
  rationale: यह साथ निवास करने के अर्थ को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: †ኢይመክር
  choice: बाँझ न रहेगा
  rationale: प्राप्त पाठ में ओबेलस से चिह्नित रूप शाब्दिक रूप से ‘परामर्श न करेगा’ जैसा है, पर संदर्भ और निकट वर्तनी वाले प्रस्तावित पाठ से ‘बाँझ न रहेगा’ अर्थ निकलता है। अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
- source_word: ገጸ የብስ
  choice: सूखी भूमि की सतह पर
  rationale: यह ‘सूखी भूमि के मुख पर’ की ठोस छवि को हिन्दी में बोधगम्य रखते हुए सामान्य ‘पृथ्वी’ में विलीन नहीं करता।
- source_word: ይትባረክ
  choice: आशीष पाएगा
  rationale: मध्य/कर्मवाच्य रूप को स्वाभाविक हिन्दी कर्मवाच्य अर्थ में रखा गया है; आत्म-आशीष का अनिश्चित अर्थ नहीं थोपा गया।
- source_word: ይትባዛሕ
  choice: बहुत बढ़ेगा
  rationale: यह बहुगुणित होने या संख्या में बढ़ने का भाव सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: በስሙ ለእግዚአ
  choice: प्रभु के नाम में
  rationale: ‘नाम में’ मूल संबंध को निकटता से सुरक्षित रखता है और उसे अनावश्यक रूप से केवल साधनवाचक ‘नाम के द्वारा’ नहीं बनाता।
theological_decisions:
- issue: प्रतिज्ञा को स्पष्ट रूप से वाचा-संबंधी भाषा में व्यक्त करना
  choice: ‘तेरे वंश को अपने सामने युगानुयुग स्थिर रखूँगा’ कहा गया
  alternative: ‘तेरे वंश के साथ सदा की वाचा बाँधूँगा’
  rationale: मूल में प्रतिज्ञा, वंश और स्थायित्व का गहरा धार्मिक भाव है, पर ‘वाचा’ शब्द स्पष्ट रूप से नहीं है; इसलिए उसे जोड़ा नहीं गया।
- issue: दूषित नकारात्मक खंड का अर्थ
  choice: संदर्भ-संगत पाठ-संशोधन के आधार पर ‘बाँझ न रहेगा’ मुख्य पाठ में रखा गया और प्राप्त पाठ पादटिप्पणी में बताया गया
  alternative: ‘वह सूखी भूमि की सतह पर परामर्श न करेगा’
  rationale: प्राप्त गीइज़ रूप संदर्भ में अत्यंत कठिन है और ओबेलस से संदिग्ध चिह्नित है। निकट वर्तनी वाला ‘बाँझ होना’ आगे के आशीष और वृद्धि के विपरीतार्थक क्रम से मेल खाता है, पर वास्तविक पाठगत तनाव छिपाया नहीं गया।
- issue: एकवचन क्रियाओं का कर्ता
  choice: ‘वह वंश’ को कर्ता बनाया गया
  alternative: ‘वे’, अर्थात तेरे साथ रहने वाले लोग
  rationale: आशीष पाने और बढ़ने वाली क्रियाएँ पुल्लिंग एकवचन हैं और स्वाभाविक रूप से पहले आए सामूहिक एकवचन ‘वंश’ की ओर लौटती हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘तेरे’ का प्रयोग प्रत्यक्ष दिव्य संबोधन की प्राचीन गंभीरता और एकवचनता बनाए रखता है। पाठगत संशोधन को मुख्य पाठ में संदर्भानुकूल रूप दिया गया है, पर पादटिप्पणी में प्राप्त कठिन पाठ को स्पष्ट रूप से सुरक्षित रखा गया है।
