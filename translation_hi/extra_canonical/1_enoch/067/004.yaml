base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/004.yaml
  text: And they bound those angels who had shown lawlessness in that burning valley which my grandfather Enoch had previously shown me in the west[d][c][b][a], by the mountains of gold and silver and iron and soft metal and lead.
translation:
  language: hi
  text: और वे उन स्वर्गदूतों को, जिन्होंने अधर्म को प्रकट किया था, उस जलती हुई घाटी में बन्द कर देंगे, जो मेरे दादा हनोक ने मुझे पहले पश्चिम में[a], सोने, चाँदी, लोहे, कोमल धातु[b] और सीसे के पहाड़ों के पास दिखाई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पश्चिम की ओर’। इस शब्द का अर्थ ‘साँझ को’ भी हो सकता है, पर आसपास के स्थान-संकेत पश्चिमी दिशा या स्थान के अर्थ को अधिक सम्भावित बनाते हैं।
    reason: lexical_alternative
  - marker: b
    text: यहाँ लोहे के बाद उल्लिखित धातु की पहचान अनिश्चित है; सम्भावनाओं में राँगा, इलेक्ट्रम या कोई दूसरी परिष्कृत अथवा कोमल धातु शामिल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: የዐጽዎሙ
  choice: बन्द कर देंगे
  rationale: यह अपूर्ण क्रियारूप भावी न्याय के प्रसंग में रोककर रखने या बन्द करने की क्रिया व्यक्त करता है। हिन्दी में भविष्यकाल मूल रूप और प्रसंग, दोनों को स्पष्ट रखता है।
- source_word: እሙንቱ መላእክት
  choice: उन स्वर्गदूतों को
  rationale: इस प्रकाशनात्मक न्याय-दृश्य में आशय दण्ड के अधीन स्वर्गिक प्राणियों से है, मानवीय दूतों से नहीं।
- source_word: እለ አርአይዋ ለዓመፃ
  choice: जिन्होंने अधर्म प्रकट किया था
  rationale: मूल वाक्यांश अधर्म को दिखाने या प्रकट करने पर बल देता है। इसे केवल ‘अधर्म किया’ या अधिक व्याख्यात्मक ‘अधर्म सिखाया’ नहीं बनाया गया।
- source_word: ቈላ እንተ ትነድድ
  choice: जलती हुई घाटी
  rationale: यह निरन्तर जलने का सजीव स्थल-वर्णन है; ‘जलती हुई घाटी’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उस चित्र को बनाए रखता है।
- source_word: እምሔውየ ሄኖክ
  choice: मेरे दादा हनोक
  rationale: मूल में हनोक वक्ता के दादा हैं; उन्हें वक्ता या दर्शन पाने वाला मानना व्याकरण और नूह-सम्बन्धी प्रसंग, दोनों के विपरीत होगा।
- source_word: በዓረብ
  choice: पश्चिम में
  rationale: आगे आने वाले भौगोलिक संकेतों के कारण समयसूचक ‘साँझ को’ की अपेक्षा पश्चिमी स्थान का अर्थ अधिक सम्भावित है।
- source_word: አድባረ ወርቅ ወብሩር ወሐፂን
  choice: सोने, चाँदी और लोहे के पहाड़
  rationale: बहुवचन समास दर्शन में विभिन्न धातुओं के पहाड़ों की सूची देता है; ‘पहाड़’ दृश्य की विराटता को बनाए रखता है।
- source_word: ነጠብጣብ
  choice: कोमल धातु
  rationale: इस साक्षी में धातु की ठीक पहचान अनिश्चित है। सामान्य अनुवाद झूठी निश्चितता से बचता है और सम्भावनाएँ पादटिप्पणी में देता है।
- source_word: ናእስ
  choice: सीसा
  rationale: धातुओं की इस सूची में यह शब्द सामान्यतः सीसे के अर्थ में समझा जाता है।
theological_decisions:
- issue: स्वर्गदूतों के अपराध का स्वरूप
  choice: उन्होंने अधर्म प्रकट किया था
  alternative: उन्होंने अधर्म किया था; उन्होंने अधर्म सिखाया था
  rationale: गीज़ पाठ की क्रिया ‘दिखाने/प्रकट करने’ का भाव रखती है। अनुवाद न तो इसे केवल उनके अपने कुकर्म तक सीमित करता है, न स्पष्ट आधार के बिना शिक्षा देने की व्याख्या जोड़ता है।
- issue: न्याय की क्रिया का समय और स्वरूप
  choice: वे ... बन्द कर देंगे
  alternative: उन्होंने ... बाँध दिया
  rationale: क्रिया का अपूर्ण रूप और भावी न्याय का प्रसंग भविष्यकाल तथा बन्द करके रखने के अर्थ का समर्थन करते हैं; भूतकाल पाठ की कालगत दिशा को बदल देगा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर प्रकाशनात्मक न्याय-दृश्य के अनुरूप गरिमापूर्ण रखी गई है। लम्बे मूल वाक्य को एक ही वाक्य में रखते हुए विराम-चिह्न से सम्बन्ध स्पष्ट किया गया है। ‘दादा हनोक’ सामान्य पाठक के लिए सहज है और मूल के पारिवारिक सम्बन्ध को स्पष्ट रूप से सुरक्षित रखता है।
