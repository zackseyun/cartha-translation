base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/009.yaml
  text: And as the burning of their bodies is very great[a], so a change comes upon them in spirit forever and ever[c][b], because before the Lord of Spirits there is none who speaks a vain word.
translation:
  language: hi
  text: और जैसे उनके शरीरों की जलन अत्यन्त प्रचण्ड है, वैसे ही उनमें आत्मा के संबंध में युगानुयुग परिवर्तन होता है[a], क्योंकि आत्माओं के प्रभु के सामने कोई भी व्यर्थ बात नहीं कहता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'गीज़ की यह पंक्ति कठिन है। इसका अधिक शाब्दिक अर्थ यह भी हो सकता है: “वैसे ही उनके लिए आत्मा के संबंध में युगानुयुग परिवर्तन है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: ውዕየ
  choice: जलना
  rationale: यह शब्द जलने या अग्नि की तीव्र गर्मी को दर्शाता है; ‘जलना’ न्याय के मूर्त शारीरिक चित्र को बनाए रखता है।
- source_word: ሥጋሆሙ
  choice: उनके शरीरों
  rationale: शाब्दिक अर्थ ‘उनका मांस’ है, पर इस प्रसंग में ‘शरीर’ आधुनिक हिन्दी में शारीरिक आशय को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ተውላጠ
  choice: परिवर्तन होता है
  rationale: यह बदलाव या परिवर्तित अवस्था का संकेत देता है; यह अनावश्यक रूप से पूर्ण ‘रूपान्तरण’ का दावा नहीं करता।
- source_word: ለመንፈስ
  choice: उनकी आत्मा में
  rationale: पूर्वसर्गीय पद परिवर्तन के क्षेत्र या पक्ष को सूचित करता है और शरीर के जलने के साथ निहित विरोध को बनाए रखता है। मूल में स्वामित्व स्पष्ट नहीं है, पर हिन्दी वाक्य में प्रसंगगत बहुवचन को स्वाभाविक बनाने के लिए ‘उनकी’ जोड़ा गया है।
- source_word: ለዓለመ ዓለም
  choice: युगानुयुग
  rationale: यह अनन्त अवधि का बलयुक्त मुहावरा है; ‘युगानुयुग’ उसकी गंभीरता और पुनरुक्त कालबोध को संक्षेप में सुरक्षित रखता है।
- source_word: እግዚአ መንፈሳት
  choice: आत्माओं के प्रभु
  rationale: यह 1 हनोक में प्रयुक्त विशिष्ट ईश्वरीय उपाधि है; इसका उपाधि-स्वरूप बनाए रखा गया है।
- source_word: ዘይነግር ነገረ በከ
  choice: जो व्यर्थ बात कहता है
  rationale: በከ का अर्थ यहाँ ‘व्यर्थ/निष्फल’ है; अतः इसे विरोध या अभियोग के अर्थ में नहीं लिया गया। संज्ञा और क्रिया की पुनरुक्ति हिन्दी में स्वाभाविक ‘बात कहता है’ से व्यक्त हुई है।
theological_decisions:
- issue: आत्मिक परिवर्तन का स्वरूप
  choice: ‘आत्मा में ... परिवर्तन होता है’ कहकर परिवर्तन का क्षेत्र बताया गया, उसका सटीक धर्मवैज्ञानिक स्वरूप निर्धारित नहीं किया गया।
  alternative: ‘उनकी आत्मा बदल जाती है’ या ‘उनका आत्मिक रूपान्तरण होता है’।
  rationale: गीज़ पंक्ति कठिन है और परिवर्तन की प्रकृति स्पष्ट नहीं करती; इसलिए अनन्त दण्ड, उद्धार या सत्ता-परिवर्तन जैसी कोई विशिष्ट व्याख्या नहीं थोपी गई।
- issue: अन्तिम वाक्यांश በከ का अर्थ
  choice: व्यर्थ बात
  alternative: उनके विरुद्ध बात
  rationale: हाल की स्रोत-समीक्षा के अनुसार በከ का अर्थ ‘व्यर्थ’ या ‘खाली’ है, न कि बहुवचन ‘उनके विरुद्ध’; इसलिए न्यायिक-विरोधी अर्थ नहीं अपनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘प्रचण्ड’, ‘युगानुयुग’ और ‘आत्माओं के प्रभु’ अपोकैलिप्टिक प्रसंग की गंभीरता बनाए रखते हैं।
