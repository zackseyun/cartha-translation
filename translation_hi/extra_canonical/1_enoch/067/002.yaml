base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/002.yaml
  text: And now the angels are making a wooden structure[a]; and when the angels have finished that, I will place my hand upon it and guard it, and from it there will come the seed of life, and a transformation will occur[e][d][c][b], so that the dry ground may not remain barren.
translation:
  language: hi
  text: और अब स्वर्गदूत लकड़ी का एक ढाँचा बना रहे हैं[a]। जब वे उसे पूरा कर लेंगे, तब मैं उस पर अपने हाथ रखूँगा और उसकी रक्षा करूँगा[b]। उससे जीवन का बीज निकलेगा[c] और एक परिवर्तन आएगा[d], ताकि सूखी भूमि बंजर न रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ शब्द का शाब्दिक संबंध ‘लकड़ी’, ‘पेड़’ या ‘लकड़ी के टुकड़ों’ से है। इसका अनुवाद ‘लकड़ी का काम’, ‘लकड़ी की वस्तुएँ’ या ‘पेड़’ भी किया जा सकता है। संदर्भ और आगे के एकवचन सर्वनामों के कारण मुख्य पाठ में एक ढाँचा माना गया है।
    reason: lexical_alternative
  - marker: b
    text: 'यह वाक्यांश पाठ और वाक्य-विन्यास की दृष्टि से कठिन है। संभव अनुवाद: ‘स्वर्गदूत मेरे हाथ उस पर रखेंगे और उसकी रखवाली करेंगे।’'
    reason: textual_variant
  - marker: c
    text: ‘जीवन का बीज’ शाब्दिक अनुवाद है। इसका संकेत जीवनदायी संतान, उत्पन्न करने की शक्ति या फिर से आई उर्वरता की ओर हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: या ‘एक बदलाव प्रकट होगा।’ परिवर्तन किस प्रकार का है, यह मूल कथन स्पष्ट नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: ይገብሩ
  choice: बना रहे हैं
  rationale: अपूर्ण क्रिया को दर्शन-वर्णन में चल रही अथवा निकटवर्ती क्रिया के रूप में लिया गया है; इससे दृश्य की तात्कालिकता बनी रहती है।
- source_word: መላእክት
  choice: स्वर्गदूत
  rationale: 1 हनोक के इस दर्शनीय संदर्भ में मनुष्य-दूत नहीं, स्वर्गीय प्राणी अभिप्रेत हैं।
- source_word: ዕፀወ
  choice: लकड़ी का एक ढाँचा
  rationale: शब्द लकड़ी, पेड़ या लकड़ी की वस्तुओं से जुड़ा है। निकट संदर्भ और आगे आने वाले स्त्रीलिंग एकवचन सर्वनाम एक निर्मित वस्तु की ओर संकेत करते हैं; फिर भी शब्दगत अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: ወድኡ
  choice: पूरा कर लेंगे
  rationale: यह निर्माण के समाप्त या पूर्ण होने को दर्शाता है और घटनाओं का क्रम स्वाभाविक रखता है।
- source_word: እወዲ እዴየ ዲቤሃ
  choice: मैं उस पर अपना हाथ रखूँगा
  rationale: वाक्यांश कठिन है, पर उसमें ‘मेरा हाथ/मेरे हाथ’ और ‘उस पर’ स्पष्ट हैं। मुख्य पाठ प्रथम पुरुष की संभावित क्रिया को अपनाता है और वैकल्पिक वाक्य-संबंध पादटिप्पणी में देता है।
- source_word: እዐቅባ
  choice: उसकी रक्षा करूँगा
  rationale: क्रिया में पहरा देने, सुरक्षित रखने या रक्षा करने का भाव है; ‘रक्षा’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ዘርአ ሕይወት
  choice: जीवन का बीज
  rationale: रूपक को शाब्दिक रूप में रखा गया है, ताकि संतान, जीवनदायी शक्ति और नई उर्वरता जैसे संभावित अर्थ खुले रहें।
- source_word: ተወላጥ ይባእ
  choice: एक परिवर्तन आएगा
  rationale: कठिन पदबंध किसी बदलाव के आने या प्रकट होने को सूचित करता है। यह अनुवाद उसके स्वरूप को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: የብስ ዕራቆ
  choice: सूखी भूमि बंजर न रहे
  rationale: दोनों पद सूखेपन और निष्फलता का चित्र देते हैं; यह हिन्दी अभिव्यक्ति उर्वरता से संबंधित ठोस बिंब बनाए रखती है।
theological_decisions:
- issue: क्या पद को साधारण कृषि-पुनरुत्थान, जलप्रलय के बाद जीवन की पुनर्स्थापना, या प्रतीकात्मक नए सृजन के रूप में स्पष्ट किया जाए
  choice: लकड़ी का ढाँचा, जीवन का बीज और सूखी भूमि—इन ठोस बिंबों को बिना किसी एक व्याख्या में सीमित किए रखा गया है।
  alternative: इसे पूरी तरह खेती और सिंचाई का वर्णन बनाना, अथवा पूरी तरह पुनरुत्थान/नए सृजन का प्रतीकात्मक कथन बनाना।
  rationale: गीज़ पाठ स्तरित दर्शनीय भाषा का उपयोग करता है और किसी एक धर्मवैज्ञानिक व्याख्या को निर्णायक रूप से नहीं थोपता; इसलिए मूल तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और दर्शनीय शैली के अनुकूल रूप अपनाया गया है। लंबे गीज़ वाक्य को पठनीयता के लिए तीन हिन्दी वाक्यों में बाँटा गया है। अनिश्चित स्थानों को मुख्य पाठ में अत्यधिक अस्पष्ट बनाए बिना पादटिप्पणियों में सुरक्षित रखा गया है।
