base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/012.yaml
  text: And I heard Michael answering and saying[a], “This judgment by which the angels are judged is a testimony against the kings and the mighty[b], those who possess the dry land.”
translation:
  language: hi
  text: और मैंने मीकाएल को उत्तर देते हुए और कहते हुए सुना, “यह न्याय, जिसके द्वारा स्वर्गदूतों का न्याय किया जाता है, राजाओं और शक्तिशाली लोगों के विरुद्ध एक गवाही[a] है—उन लोगों के विरुद्ध जो सूखी भूमि[b] पर अधिकार रखते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक साक्षी।” गीइज़ संज्ञा न्यायिक सन्दर्भ में “गवाही” और “साक्षी”—दोनों अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “सूखी भूमि” है। यह पद सम्पूर्ण ब्रह्माण्डीय पृथ्वी के बजाय मानव शासन के अधीन बसी हुई भूमि को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሰማዕክዎ፡ ለሚካኤል
  choice: और मैंने मीकाएल को ... सुना
  rationale: प्रथम पुरुष के पूर्ण क्रियारूप और कर्म-प्रत्यय को स्वाभाविक हिन्दी वाक्य-विन्यास में रखा गया है; इसके बाद आया नाम मीकाएल उस व्यक्ति की पहचान करता है जिसे वक्ता ने सुना।
- source_word: ያውሥእ፡ ወይብል
  choice: उत्तर देते और कहते
  rationale: दोनों वाणी-सूचक क्रियाओं को बनाए रखने से मूल की युग्मित अभिव्यक्ति और गम्भीर प्रकाशनात्मक शैली सुरक्षित रहती है।
- source_word: ኵነኔ፡ ዛቲ
  choice: यह न्याय
  rationale: ‘न्याय’ न्यायिक कार्य और उसके दण्डात्मक परिणाम—दोनों की सम्भावना खुली रखता है; ‘यह’ पहले वर्णित विशिष्ट न्याय की ओर संकेत करता है।
- source_word: እንተ፡ ይትኴነኑ፡ መላእክት
  choice: जिसके द्वारा स्वर्गदूतों का न्याय किया जाता है
  rationale: सम्बन्धवाचक रचना और कर्मवाच्य को सुरक्षित रखा गया है; ‘दोषी ठहराया जाता है’ कहने से मूल की अपेक्षा अधिक कठोर अर्थ निश्चित हो जाता।
- source_word: ሰማዕተ
  choice: एक गवाही
  rationale: यह संज्ञा न्यायिक अर्थ में ‘गवाही’ अथवा ‘साक्षी’ बता सकती है। मुख्य पाठ में ‘गवाही’ निर्णय को राजाओं के विरुद्ध प्रमाण के रूप में प्रस्तुत करता है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: ለነገሥት፡ ወለዐዚዛን
  choice: राजाओं और शक्तिशाली लोगों के विरुद्ध
  rationale: लामेद-युक्त पदों का न्यायिक सन्दर्भ में विरोधी सम्बन्ध स्वाभाविक है। ‘शक्तिशाली लोग’ सामाजिक और राजनीतिक प्रभुत्व रखने वाले वर्ग का अर्थ स्पष्ट करता है।
- source_word: እለ፡ ይእኅዝዋ፡ ለየብስ
  choice: जो सूखी भूमि पर अधिकार रखते हैं
  rationale: क्रिया के ‘थामे रखने/अधिकार रखने’ के अर्थ और የብስ के ठोस ‘सूखी भूमि’ अर्थ को बनाए रखा गया है; ‘संसार’ कहकर इसके क्षेत्र को अनावश्यक रूप से व्यापक नहीं किया गया।
theological_decisions:
- issue: गवाही/साक्षी वाले उपवाक्य का सम्बन्ध
  choice: स्वर्गदूतों का न्याय पृथ्वी के राजाओं और शक्तिशाली लोगों के विरुद्ध गवाही का काम करता है।
  alternative: स्वर्गदूत स्वयं राजाओं और शक्तिशाली लोगों के विरुद्ध साक्षी हैं; अथवा यह पद केवल ‘राजाओं और शक्तिशाली लोगों के लिए गवाही’ है।
  rationale: वाक्य-विन्यास में ‘गवाही’ का सबसे स्वाभाविक सम्बन्ध अभी बताए गए न्याय से है, और उसके बाद के लामेद-युक्त पद उन लोगों को सूचित करते हैं जिनके विरुद्ध वह गवाही ठहरती है। फिर भी ‘गवाही/साक्षी’ की वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गम्भीर लेकिन सहज प्रकाशनात्मक शैली रखी गई है। ‘मीकाएल’, ‘स्वर्गदूत’, ‘न्याय’ और ‘गवाही’ सामान्य पाठकों के लिए परिचित धार्मिक-न्यायिक शब्द हैं। मूल की पुनरुक्त वाणी-रचना ‘उत्तर देते और कहते’ जानबूझकर सुरक्षित रखी गई है।
