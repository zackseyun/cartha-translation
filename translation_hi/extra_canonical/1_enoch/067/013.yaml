base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/013.yaml
  text: For these waters of judgment are for the healing of the flesh of the kings and for the lust of their flesh[b][a]; and because of this they do not see and do not believe that those waters will change and become a fire that burns forever and ever.
translation:
  language: hi
  text: क्योंकि न्याय के ये जल राजाओं के शरीर को चंगा करने और उनके शरीर की अभिलाषा के लिए हैं[a][b]; इसी कारण वे न तो देखते हैं, न विश्वास करते हैं कि वे जल परिवर्तित होकर ऐसी आग बन जाएँगे जो युगानुयुग जलती रहेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके शरीर की वासना के लिए।”
    reason: lexical_alternative
  - marker: b
    text: 'यहाँ उपलब्ध गीइज़ अंश में आरम्भिक शब्द ही सुरक्षित हैं; पद का शेष भाग पृष्ठ-सीमा के पार उपलब्ध पाठ-साक्ष्य के आधार पर दिया गया है। केवल उपलब्ध अंश का अनुवाद यह है: “क्योंकि ये न्याय के जल हैं।”'
    reason: textual_source_note
lexical_decisions:
- source_word: እስመ
  choice: क्योंकि
  rationale: यह पद एक व्याख्यात्मक या आधार बताने वाला वाक्य आरम्भ करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक और स्पष्ट रखता है।
- source_word: እሉ
  choice: ये
  rationale: बहुवचन संकेतवाचक शब्द निकटवर्ती दर्शन में उल्लिखित जलों की ओर संकेत करता है।
- source_word: ማየ
  choice: जल
  rationale: हिन्दी में ‘जल’ रूप स्वयं एकवचन और सामूहिक/बहुवचन दोनों अर्थों में आ सकता है; ‘ये जल’ दृश्य में अनेक जलस्रोतों की छवि बनाए रखता है।
- source_word: ኵነኔ
  choice: न्याय
  rationale: यह न्यायिक शब्द दण्डादेश, दोषारोपण या दण्डात्मक परिणाम में से किसी एक अर्थ को अनावश्यक रूप से निश्चित किए बिना व्यापक ईश्वरीय न्याय का भाव रखता है।
- source_word: ለፈውሰ ሥጋሆሙ
  choice: उनके शरीर को चंगा करने के लिए
  rationale: ‘चंगा करना’ शारीरिक उपचार का सीधा अर्थ देता है और विडंबनापूर्ण संदर्भ—अंततः आग बन जाने वाले जल—को बनाए रखता है।
- source_word: ለፍትወተ ሥጋሆሙ
  choice: उनके शरीर की अभिलाषा के लिए
  rationale: ‘अभिलाषा’ इच्छा और कामना की व्यापकता बनाए रखती है; ‘वासना’ चुनने से अर्थ अनावश्यक रूप से केवल यौन इच्छा तक सीमित हो सकता था।
- source_word: ለዓለመ ዓለም
  choice: युगानुयुग
  rationale: यह पारंपरिक किंतु बोधगम्य हिन्दी पद अनवरत काल की मूल सेमिटिक अभिव्यक्ति को संक्षेप और गरिमा के साथ व्यक्त करता है।
theological_decisions:
- issue: ኵነኔ को दण्डात्मक परिणाम या व्यापक न्यायिक कार्य के रूप में प्रस्तुत करना
  choice: न्याय
  alternative: दण्ड / दोषारोपण
  rationale: ‘न्याय’ सर्वनाशकारी दण्ड और ईश्वरीय न्यायिक क्रिया के बीच मूल पाठ की अर्थगत व्यापकता को सुरक्षित रखता है।
- issue: शरीर की इच्छा का स्वरूप
  choice: अभिलाषा
  alternative: वासना
  rationale: मूल शब्द इच्छा, लालसा या सुख-कामना का व्यापक अर्थ रख सकता है; ‘अभिलाषा’ संभावित देहासक्ति को मिटाए बिना केवल यौन अर्थ थोपने से बचता है।
- issue: जल के उपचारकारी उद्देश्य और उसके आग बन जाने के बीच तनाव
  choice: दोनों कथनों को बिना सामंजस्य बैठाए ज्यों का त्यों रखना
  alternative: उपचार को व्यंग्यात्मक या केवल दिखावटी बताना
  rationale: पाठ स्वयं पहले उपचार और अभिलाषा का उद्देश्य बताता है, फिर जल के अनन्त आग बन जाने की बात करता है; अनुवाद इस अपोकैलिप्टिक तनाव की व्याख्या करके उसे समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘राजाओं के शरीर’, ‘न्याय के जल’ और ‘आग बन जाएँगे’ जैसी ठोस अपोकैलिप्टिक छवियों को अमूर्त नहीं किया गया। अर्धविराम पद के कारणात्मक और परिणामात्मक खंडों को स्पष्ट करता है।
