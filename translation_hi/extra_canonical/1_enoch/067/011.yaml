base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/011.yaml
  text: And the waters themselves will be changed in those days[a], for when those angels are judged in those waters, these springs of water will change, and when the angels ascend[c][b], that water of the springs will change and grow cold.
translation:
  language: hi
  text: और उन दिनों वे जल स्वयं बदल जाएँगे, क्योंकि जब उन स्वर्गदूतों का उन जलों में न्याय किया जाएगा, तब उनके सोते—वे जल-स्रोत—बदल जाएँगे[a]; और जब वे स्वर्गदूत ऊपर चढ़ेंगे[b], तब सोतों का वह जल बदल जाएगा और ठंडा हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इथियोपिक में यहाँ शाब्दिक रूप से “उनके सोते—वे जल-स्रोत” जैसा कठिन पद है। “सोते” के लिए प्रयुक्त शब्द का अर्थ “आँखें” भी हो सकता है, पर जल का प्रसंग “सोते” अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “जब स्वर्गदूत ऊपर चढ़ेंगे।” वे कहाँ से या किस ओर चढ़ते हैं, यह इथियोपिक पाठ में स्पष्ट नहीं है।
    reason: ambiguity
lexical_decisions:
- source_word: ኪያሁ፡ ማያት
  choice: वे जल स्वयं
  rationale: बलसूचक पद ኪያሁ को ‘स्वयं’ से व्यक्त किया गया है और ማያት के बहुवचन को बनाए रखा गया है।
- source_word: ተውላጠ
  choice: बदल जाएँगे
  rationale: यह परिवर्तन की अवस्था में प्रवेश करने का भाव देता है; ‘बदल जाएँगे’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस भाव को सुरक्षित रखता है।
- source_word: ይትኴነኑ
  choice: न्याय किया जाएगा
  rationale: क्रिया न्यायिक है। ‘दोषी ठहराया जाएगा’ या ‘दण्ड दिया जाएगा’ कहने से निर्णय का परिणाम मूल से अधिक निश्चित हो जाता।
- source_word: በውእቱ፡ ማያት
  choice: उन जलों में
  rationale: स्थानसूचक पद को स्पष्ट रूप से रखा गया है; स्वर्गदूतों का न्याय उन्हीं जलों में होने की बात कही गई है।
- source_word: ዐያኖሙ፡ እልኩ፡ አንቅዐተ፡ ማያት
  choice: उनके सोते—वे जल-स्रोत
  rationale: ዐያን का अर्थ ‘आँखें’ या ‘सोते’ हो सकता है; जल के प्रसंग और साथ आए አንቅዐተ ማያት के कारण ‘सोते/जल-स्रोत’ उपयुक्त है। संबंधसूचक प्रत्यय को ‘उनके’ से सुरक्षित रखा गया है और व्याख्यात्मक पुनरुक्ति को डैश से दिखाया गया है।
- source_word: የዐርጉ
  choice: ऊपर चढ़ेंगे
  rationale: मूल ऊपर की ओर गति बताता है। ‘ऊपर चढ़ेंगे’ चित्र को बनाए रखता है, पर यह तय नहीं करता कि स्वर्गदूत जल से बाहर आते हैं या किसी अन्य दिशा में आरोहण करते हैं।
- source_word: ይቈርሩ
  choice: ठंडा हो जाएगा
  rationale: अंतिम क्रिया जल के ठंडा होने का परिणाम बताती है। हिन्दी में एकवचन ‘जल’ के अनुरूप ‘ठंडा हो जाएगा’ रखा गया है।
theological_decisions:
- issue: स्वर्गदूतों के न्याय का स्वरूप
  choice: उनका न्याय किया जाएगा
  alternative: उन्हें दोषी ठहराया जाएगा / दण्ड दिया जाएगा
  rationale: प्रसंग दण्डात्मक न्याय का संकेत दे सकता है, पर मूल क्रिया केवल न्याय किए जाने को स्पष्ट करती है; इसलिए निर्णय का परिणाम अनिर्णीत रखा गया है।
- issue: स्वर्गदूतों के ऊपर चढ़ने और जल के बदलने का संबंध
  choice: दोनों घटनाओं को क्रम से जोड़ा गया है, बिना तंत्र समझाए
  alternative: जल को दण्ड का साधन या केवल प्रतीकात्मक प्रतिक्रिया बताना
  rationale: पद स्वर्गदूतों के ऊपर चढ़ने और जल के बदलकर ठंडा होने को जोड़ता है, पर कारण या प्रक्रिया स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप अपनाया गया है। ‘जल’, ‘स्वर्गदूत’, ‘न्याय’ और ‘जल-स्रोत’ जैसे परिचित धार्मिक-साहित्यिक शब्द रखे गए हैं। मूल की पुनरुक्ति और रहस्यमय दृश्य को अनावश्यक व्याख्या से नहीं सुलझाया गया।
