base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/006.yaml
  text: And when all this happened[a], from that fiery stream and their convulsion in that place, a smell of sulfur was produced and joined with those waters[c][b]; and that valley of the angels who led astray burns beneath that land.
translation:
  language: hi
  text: और जब यह सब हुआ, तब उस अग्निमय धारा और उस स्थान में उनकी उथल-पुथल से गंधक की गंध उत्पन्न हुई[a] और उन जलों के साथ मिल गई[b][c]; और भटकाने वाले स्वर्गदूतों की वह घाटी उस भूमि के नीचे जलती रहती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘गंधक’ के लिए पारंपरिक अंग्रेज़ी बाइबिलीय शब्द ‘ब्रिमस्टोन’ भी प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: गीज़ पाठ यहाँ कठिन है; ‘उन जलों के साथ मिल गई’ का अर्थ ‘उन जलों से जुड़ गई’ भी हो सकता है।
    reason: alternative_reading
  - marker: c
    text: 'इस वाक्य-विन्यास का एक अन्य संभव अनुवाद है: ‘और यह सब उस अग्निमय धारा से हुआ, और उस स्थान में गंधक की गंध उत्पन्न हुई।’'
    reason: previous_rendering
lexical_decisions:
- source_word: ነጠብጣብ እሳት
  choice: अग्निमय धारा
  rationale: यह पदबंध टपकती या बहती आग की छवि देता है। ‘अग्निमय धारा’ उस दृश्य को स्वाभाविक हिन्दी में बनाए रखता है, बिना उसे केवल बूंदों तक सीमित किए।
- source_word: ሀውኮሙ
  choice: उनकी उथल-पुथल
  rationale: यहाँ संशोधित स्रोत-पाठ के अनुसार आंदोलन, विक्षोभ या मरोड़-जैसी हलचल का भाव है। ‘उथल-पुथल’ स्वाभाविक है और ‘ऐंठन’ की अपेक्षा कम संकीर्ण अर्थ देता है।
- source_word: መካን
  choice: स्थान
  rationale: यह व्यापक स्थानवाचक शब्द है; ‘स्थान’ दर्शनात्मक वर्णन में स्पष्ट और तटस्थ है।
- source_word: ተወልደ
  choice: उत्पन्न हुई
  rationale: शाब्दिक अर्थ ‘जन्मी’ हो सकता है, पर गंध के प्रकट होने के लिए आधुनिक हिन्दी में ‘उत्पन्न हुई’ अधिक स्वाभाविक है।
- source_word: ጼና ተይ
  choice: गंधक की गंध
  rationale: पदबंध गंधक की तीखी गंध की ओर संकेत करता है। यह आधुनिक पाठक के लिए स्पष्ट है और पारंपरिक विकल्प को पादटिप्पणी में रखा गया है।
- source_word: ተኃብረ ምስለ እልኩ ማያት
  choice: उन जलधाराओं के साथ मिल गई
  rationale: क्रिया जुड़ने या मिश्रित होने दोनों का संकेत दे सकती है। मुख्य पाठ में सहज हिन्दी ‘मिल गई’ है; ‘जुड़ गई’ को वैकल्पिक अर्थ के रूप में पादटिप्पणी में रखा गया है।
- source_word: ቈላ
  choice: घाटी
  rationale: हनोक की स्थलाकृति में यह घाटी-जैसे निचले भूभाग को सूचित करता है; ‘घाटी’ सबसे स्पष्ट सामान्य हिन्दी है।
- source_word: እንተ መላእክት እለ አስሐቱ
  choice: भटकाने वाले स्वर्गदूतों की
  rationale: सक्रिय संबंधवाचक क्रिया स्वर्गदूतों को दूसरों को भटकाने वाले कर्ताओं के रूप में प्रस्तुत करती है। यह कर्म के अनुल्लिखित होने को भी बनाए रखता है।
- source_word: ትነድድ መትሕተ ይእቲ ምድር
  choice: उस भूमि के नीचे जलती रहती है
  rationale: यह जारी भूमिगत दहन को व्यक्त करता है। ‘भूमि’ स्थानीय भूभाग का अर्थ देता है, पूरे संसार का नहीं।
theological_decisions:
- issue: दंडित स्वर्गदूतों की पहचान
  choice: भटकाने वाले स्वर्गदूत
  alternative: वे स्वर्गदूत जो भटक गए थे; छल के स्वर्गदूत
  rationale: गीज़ की सक्रिय क्रिया उन्हें भटकाने वाले कर्ताओं के रूप में प्रस्तुत करती है। स्थानीय हनोकीय कथन को रखा गया है और बाद की दानव-विद्या से सामंजस्य नहीं बैठाया गया।
- issue: गंधक की गंध का जल से संबंध
  choice: गंध उन जलधाराओं के साथ मिल गई
  alternative: गंध उन जलधाराओं से जुड़ गई
  rationale: स्रोत क्रिया भौतिक मिश्रण और निकट संयोजन दोनों की गुंजाइश देती है। मुख्य पाठ स्वाभाविक हिन्दी चुनता है, जबकि पादटिप्पणी अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली रखी गई है। दर्शनात्मक स्थल-वर्णन को स्पष्ट रखा गया है; स्रोत की कठिन वाक्य-रचना और संयोजन संबंधी अस्पष्टता पादटिप्पणियों में सुरक्षित है।
