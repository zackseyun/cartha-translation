  choice: ताकि उनके शरीर का न्याय हो
  rationale: प्रयोजनसूचक और कर्मवाच्य न्याय-क्रिया को रखा गया है; ‘दोषी ठहराया जाए’ मूल से अधिक निश्चित होता।
- source_word: እስመ፡ ክሕድዎ፡ ለእግዚአ፡ መንፈሳት
  choice: क्योंकि उन्होंने आत्माओं के प्रभु का इनकार किया है
  rationale: पुस्तक के विशिष्ट उपाधि-रूप ‘आत्माओं के प्रभु’ और इनकार की प्रबल क्रिया को सीधे अनूदित किया गया है।
- source_word: ወይሬእዩ፡ ኵነኔሆሙ፡ እንተ፡ ኵሉ፡ ዕለት
  choice: वे प्रतिदिन अपना न्याय देखते हैं
  rationale: न्याय/दण्डादेश की न्यायिक व्यापकता को रखते हुए काल-वाक्यांश को स्वाभाविक हिन्दी ‘प्रतिदिन’ में दिया गया है।
- source_word: ወኢየአምኑ፡ በስሙ
  choice: फिर भी उसके नाम पर विश्वास नहीं करते
  rationale: विरोधी संबंध हिन्दी में स्पष्ट करने के लिए ‘फिर भी’ प्रयुक्त है; नाम पर विश्वास करने की मूल धार्मिक अभिव्यक्ति सुरक्षित है।
theological_decisions:
- issue: जल का कार्य लाभकारी है, दण्डात्मक है, या दोनों
  choice: शरीर के चंगे होने और आत्मा के दण्ड—दोनों कथनों को साथ रखा गया है।
  alternative: चंगाई को व्यंग्यात्मक विनाश मानना, अथवा पूरे वाक्य को केवल यातना के रूप में अनूदित करना।
  rationale: मूल में उपचार और दण्ड का तनाव उपस्थित है; अनुवाद उसे किसी एक व्यवस्थित अर्थ में नहीं समेटता।
- issue: कठिन पद ትውኔተ का अर्थ
  choice: ‘सुख’
  alternative: आनन्द, मिठास, भोग-विलास, अथवा पाठ को भ्रष्ट/अनिश्चित मानना।
  rationale: सकारात्मक कोशगत अर्थ को मुख्य पाठ में रखा गया है और न्याय-संदर्भ से उत्पन्न कठिनाई को पादटिप्पणी में स्पष्ट किया गया है।
- issue: शरीर और आत्मा का संबंध
  choice: दोनों को अलग संज्ञाओं के रूप में बनाए रखा गया है।
  alternative: दोनों को मनुष्य की संपूर्ण दशा का एक संयुक्त रूपक मानकर मिला देना।
  rationale: पद स्वयं शरीर की चंगाई और आत्मा के दण्ड को अलग-अलग कहता है; अनुवाद इस भेद पर कोई अतिरिक्त मानवशास्त्रीय सिद्धान्त आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप। भविष्यसूचक लय बनाए रखने के लिए आरम्भ में ‘और उन दिनों’ रखा गया है। कठिन सकारात्मक पद ‘सुख’ को संदर्भ के अनुसार बदलने के बजाय पादटिप्पणी सहित सुरक्षित रखा गया है।
