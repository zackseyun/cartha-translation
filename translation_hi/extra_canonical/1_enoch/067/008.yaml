  terminology: ‘आत्माओं के प्रभु,’ ‘शरीर,’ ‘आत्मा,’ ‘दण्ड,’ and ‘न्याय’ are appropriate and consistent. ‘का इनकार किया’ is understandable, but ‘का इन्कार किया’ is the more conventional spelling in modern standard Hindi; no theological nuance is changed.
  issues:
