base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/008.yaml
  text: And in those days those waters will be for the kings and the mighty and the exalted[a], and for those who dwell on the dry ground, for the healing of the body and for the punishment of the spirit; and their spirit will be full of pleasure, so that their bodies may be judged, because they have denied the Lord of Spirits, and they see their judgment every day[d][c][b], yet they do not believe in his name.
translation:
  language: hi
  text: और उन दिनों वे जल राजाओं, शक्तिशाली लोगों और ऊँचे पदवालों के लिए, और सूखी भूमि पर रहनेवालों के लिए होंगे—शरीर की चंगाई और आत्मा के दण्ड के लिए; और उनकी आत्मा सुख से भर जाएगी,[a] ताकि उनके शरीर का न्याय हो, क्योंकि उन्होंने आत्माओं के प्रभु का इन्कार किया है और वे प्रतिदिन अपना न्याय देखते हैं, फिर भी उसके नाम पर विश्वास नहीं करते।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उनकी आत्मा सुख से भर जाएगी” वाला वाक्यांश पाठ और संदर्भ की दृष्टि से कठिन है। गीइज़ शब्द का अर्थ “सुख” या “आनन्द” हो सकता है, यद्यपि आसपास का प्रसंग न्याय और दण्ड का है।
    reason: textual_variant
  - marker: b
    text: यहाँ “शरीर” और “आत्मा” को अलग शब्दों के रूप में रखा गया है, क्योंकि पद शरीर की चंगाई और आत्मा के दण्ड का अलग-अलग उल्लेख करता है।
    reason: lexical_alternative
