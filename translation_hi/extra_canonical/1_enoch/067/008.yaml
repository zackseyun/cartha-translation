- source_word: ወይከውኑ፡ እልኩ፡ ማያት፡ በአማንቱ፡ መዋዕል
  choice: और उन दिनों वे जल ... होंगे
  rationale: भविष्यसूचक अस्तित्ववाचक क्रिया और बहुवचन ‘जल’ को बनाए रखते हुए स्वाभाविक हिन्दी क्रम अपनाया गया है।
- source_word: ለነገሥት፡ ወለዐዚዛን፡ ወለልዑላን
  choice: राजाओं, शक्तिशाली लोगों और ऊँचे पदवालों के लिए
  rationale: तीन अलग सामाजिक श्रेणियों को एक में मिलाए बिना आधुनिक और सुबोध हिन्दी में रखा गया है।
- source_word: ወለእለ፡ የኃድሩ፡ ዲበ፡ የብስ
  choice: और सूखी भूमि पर रहनेवालों के लिए
  rationale: ‘सूखी भूमि’ का ठोस अर्थ बनाए रखा गया है, जिससे जल के साथ निहित विरोध स्पष्ट रहता है।
- source_word: ለፈውሰ፡ ሥጋ
  choice: शरीर के चंगे होने के लिए
  rationale: यहाँ शारीरिक उपचार अभिप्रेत है; ‘शरीर’ नैतिक अर्थ से युक्त ‘देह/मांस’ की अपेक्षा अधिक स्पष्ट है।
- source_word: ወለአዝነ፡ መንፈስ
  choice: आत्मा के दण्ड के लिए
  rationale: አዝነ के दण्ड अथवा यातना-संबंधी बल को बनाए रखा गया है; ‘सुधार’ न्याय के संदर्भ को अनावश्यक रूप से नरम कर सकता है।
- source_word: ወትውኔተ፡ ይመልእ፡ መንፈሶሙ
  choice: और उनकी आत्मा सुख से भर जाएगी
  rationale: संदर्भगत कठिनाई के बावजूद गीइज़ के संभावित सकारात्मक अर्थ ‘सुख/आनन्द’ को अनुमानित नकारात्मक अर्थ में नहीं बदला गया; अनिश्चितता पादटिप्पणी में बताई गई है।
