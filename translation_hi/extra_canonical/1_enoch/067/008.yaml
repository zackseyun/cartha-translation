    issue: The final clause is split into a new sentence.
    rationale: The Ge'ez continues the causal sequence through ‘they see their judgment every day’ and then the concessive ‘yet.’ Keeping it in one sentence more closely reflects the relation of the clauses.
  - severity: low
    issue: ‘शरीर के चंगे होने’ is less idiomatic in the otherwise formal modern Hindi register.
    rationale: ‘शरीर की चंगाई’ directly and naturally expresses ‘healing of the body’ without changing its meaning.
