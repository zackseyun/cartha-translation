  register: आधुनिक मानक हिन्दी की सहज किंतु गरिमापूर्ण शैली अपनाई गई है। स्रोत की शब्द-पुनरावृत्ति और ‘waters’ के बहुवचन को बनाए रखा गया है; अस्पष्ट प्रलयकारी बिंब को किसी निश्चित प्राकृतिक घटना में नहीं बदला गया।
