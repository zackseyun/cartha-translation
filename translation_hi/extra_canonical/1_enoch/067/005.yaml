  text: And I saw that valley in which there was a great convulsion and a convulsion of waters[a].
translation:
  language: hi
  text: और मैंने उस घाटी को देखा, जिसमें बड़ी उथल-पुथल और जलराशियों की उथल-पुथल थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसमें बड़ा विक्षोभ और जलराशियों का विक्षोभ था।” गीइज़ में एक ही शब्द दोनों स्थानों पर दोहराया गया है; उसका अर्थ उग्र हलचल, विक्षोभ या उलट-पुलट तक हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢክዋ
  choice: और मैंने ... को देखा
  rationale: दृष्टांत-वर्णन की क्रमिक शैली बनाए रखने के लिए आरंभिक संयोजक को ‘और’ रखा गया है; क्रिया का सीधा अर्थ ‘देखना’ है।
- source_word: ለይእቲ ቈላ
  choice: उस घाटी को
  rationale: ቈላ किसी नीची भूमि, घाटी या अवसाद को दर्शाता है; प्रसंग में ‘घाटी’ स्वाभाविक और स्पष्ट है।
- source_word: እንተ ሀውከ ዓቢይ ባቲ
  choice: जिसमें बड़ी उथल-पुथल थी
  rationale: ሀውከ हिंसक हलचल, विक्षोभ या उलट-पुलट का भाव रखता है। ‘उथल-पुथल’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसके व्यापक और प्रलयकारी बल को बचाती है; ዓቢይ को ‘बड़ी’ से व्यक्त किया गया है।
- source_word: ወሀውከ ማያት
  choice: और जलराशियों में भी उथल-पुथल थी
  rationale: स्रोत में ሀውከ की पुनरावृत्ति को हिन्दी में भी दोहराया गया है। बहुवचन ማያት के लिए ‘जलराशियों’ से अनेक अथवा विशाल जल-समूहों का भाव सुरक्षित रहता है। ‘भी’ हिन्दी में दोनों संबद्ध हलचलों का संबंध स्पष्ट करता है।
theological_decisions:
- issue: घाटी में विक्षोभ का स्वरूप
  choice: ‘उथल-पुथल’ द्वारा ठोस, प्रलयकारी हलचल का चित्र बनाए रखा गया है।
  alternative: ‘भारी विक्षोभ’ अथवा ‘भयंकर उलट-पुलट’
  rationale: पाठ सृष्टिगत या भौतिक हलचल का संकेत दे सकता है, पर स्पष्ट रूप से भूकंप नहीं कहता। इसलिए अनावश्यक विशिष्टता से बचते हुए प्रलयदर्शी तनाव सुरक्षित रखा गया है।
