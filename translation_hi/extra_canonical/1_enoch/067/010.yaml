base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/010.yaml
  text: For judgment will come upon them[a], because they trust in the indulgence of their flesh and deny the Spirit of the Lord.
translation:
  language: hi
  text: क्योंकि उन पर न्याय आएगा, क्योंकि वे अपनी देह के भोग-विलास[a] पर भरोसा रखते हैं और प्रभु की आत्मा का इनकार करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘भोग-विलास’ अनिश्चित अर्थ वाले गीइज़ शब्द का अनुवाद है। इसका आशय सुख, उच्छृंखल भोग या संभवतः उनकी देह से जुड़ा छल भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: क्योंकि / क्योंकि
  rationale: दोनों प्रयोग कारणसूचक हैं। पहला पिछले प्रसंग से संबंध जोड़ता है और दूसरा न्याय का स्पष्ट कारण बताता है; हिन्दी में दोनों स्थानों पर ‘क्योंकि’ मूल की पुनरावृत्ति सुरक्षित रखता है।
- source_word: ትመጽእ
  choice: आ पड़ेगा
  rationale: भविष्य में आने वाले न्याय की घोषणा व्यक्त करता है; ‘आ पड़ेगा’ हिन्दी में ዲቤሆሙ के ‘उन पर’ के साथ स्वाभाविक और गंभीर है।
- source_word: ኵነኔ
  choice: न्याय
  rationale: यह न्यायिक और अन्तकालिक अर्थ की व्यापकता बनाए रखता है, उसे केवल दण्डादेश या दोषसिद्धि तक सीमित नहीं करता।
- source_word: ዲቤሆሙ
  choice: उन पर
  rationale: न्याय के किसी पर आने की घोषणात्मक अभिव्यक्ति में यह पूर्वसर्ग का सीधा और स्वाभाविक रूप है।
- source_word: የአምኑ
  choice: भरोसा रखते हैं
  rationale: क्रिया विश्वास करने या भरोसा रखने का अर्थ दे सकती है; यहाँ इसके अनुचित आधार को देखते हुए ‘भरोसा रखते हैं’ अधिक उपयुक्त है।
- source_word: በተውኔተ
  choice: भोग-विलास
  rationale: शब्द का अर्थ अनिश्चित है। देह के साथ प्रयुक्त होने पर आत्मतुष्टिकारक सुख या उच्छृंखल भोग का अर्थ संभावित है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: ሥጋሆሙ
  choice: अपनी देह
  rationale: ‘देह’ ठोस मानवशास्त्रीय शब्द और प्रसंगगत नैतिक बल को बनाए रखता है; इसे केवल ‘शरीर’ या अमूर्त ‘दैहिक स्वभाव’ नहीं बनाया गया।
- source_word: ወመንፈሰ እግዚአ
  choice: और प्रभु के आत्मा
  rationale: ‘आत्मा/श्वास’ अर्थ वाले शब्द को प्रभु-संबंधी संबंधकारक के साथ ‘प्रभु के आत्मा’ किया गया है, बिना बाद की धर्मसैद्धान्तिक भाषा आरोपित किए।
- source_word: ይክሕዱ
  choice: इनकार करते हैं
  rationale: यह अस्वीकार या परित्याग की प्रबलता को धार्मिक प्रसंग में स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘प्रभु के आत्मा’ का अभिप्राय
  choice: प्रभु के आत्मा की ओर संकेत, जिसका वे देह पर भरोसे के विपरीत इनकार करते हैं
  alternative: उनका अपना परमेश्वर-प्रदत्त आत्मा, अथवा प्रभु से संबंधित आत्मिक मार्ग
  rationale: संबंधकारक रचना सबसे स्वाभाविक रूप से प्रभु के आत्मा की ओर संकेत करती है। फिर भी पाठ को बाद की व्यवस्थित त्रित्ववादी शब्दावली में नहीं ढाला गया और अंतर्निहित तनाव खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली। मूल की दोहरी कारणसूचक रचना तथा ‘देह’ और ‘प्रभु के आत्मा’ के बीच तनाव सुरक्षित रखा गया है।
