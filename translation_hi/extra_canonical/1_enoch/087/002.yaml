base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/002.yaml
  text: And again I lifted up my eyes to heaven[a], and I saw in a vision—and behold, there came out from heaven beings in the likeness of white men; and four came out from that place[d][c][b], and three with them.
translation:
  language: hi
  text: फिर मैंने अपनी आँखें स्वर्ग की ओर उठाईं और एक दर्शन में देखा—और देखो, स्वर्ग से श्वेत मनुष्यों के सदृश रूप वाले प्राणी निकले[a]। उस स्थान से चार निकले, और उनके साथ तीन[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक भाव: ‘श्वेत मनुष्यों की समानता/सदृश्यता में।’ मूल पाठ उनके रूप की तुलना करता है; उन्हें सीधे मनुष्य या स्वर्गदूत नहीं कहता।'
    reason: lexical_alternative
  - marker: b
    text: 'मूल इथियोपिक में गणना इसी प्रकार संक्षिप्त है: ‘उस स्थान से चार निकले, और उनके साथ तीन।’ इसका आशय कुल सात स्वर्गीय आकृतियाँ हो सकता है, पर पाठ की आकस्मिक रचना को यहाँ सरल बनाकर नहीं लिखा गया है।'
    reason: textual_ambiguity
lexical_decisions:
- source_word: አንሣእኩ አዕይንትየ ካዕበ ውስተ ሰማየ
  choice: फिर मैंने अपनी आँखें आकाश की ओर उठाईं
  rationale: आँखें उठाने की मूल बाइबलीय-दर्शनात्मक अभिव्यक्ति, पुनरावृत्ति और आकाश की ओर दिशा—तीनों को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: ወርኢኩ በራእይ
  choice: और एक दर्शन में देखा
  rationale: ራእይ को अनिश्चित ‘एक दर्शन’ के रूप में प्रस्तुत करता है और देखने की दर्शनात्मक परिस्थिति को स्पष्ट रखता है।
- source_word: ወነዋ
  choice: और देखो
  rationale: दृश्य की आकस्मिकता और प्रत्यक्षता बताने वाले विस्मयादिबोधक को गरिमापूर्ण, परिचित शैली में बनाए रखता है।
- source_word: ወፁኡ እምሰማይ
  choice: आकाश से कुछ प्राणी निकले
  rationale: बहुवचन गति और आकाश से बाहर आने की दिशा को रखता है। ‘कुछ प्राणी’ हिन्दी में कर्ता को स्वाभाविक बनाता है, पर उनकी जाति निश्चित नहीं करता।
- source_word: ከመ እምሳለ ሰብእ ጸዓዳ
  choice: जिनका रूप श्वेत मनुष्यों के स्वरूप जैसा था
  rationale: तुलना और ‘स्वरूप/सदृश्यता’ दोनों को व्यक्त करता है; उन्हें सीधे मनुष्य या स्वर्गदूत घोषित नहीं करता।
- source_word: ፬ ወፁኡ እምውእቱ መካን
  choice: उस स्थान से चार निकले
  rationale: स्पष्ट संख्या, पुनरावृत्त गति और संकेतित स्थान को यथावत रखता है।
- source_word: ወ፫ ምስሌሆሙ
  choice: और उनके साथ तीन
  rationale: मूल की संक्षिप्त और कुछ असामान्य गणना को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
theological_decisions:
- issue: श्वेत मानव-सदृश प्राणियों की पहचान
  choice: उनका वर्णन ‘प्राणी’ और उनके मानव-सदृश स्वरूप से किया गया है; उन्हें मुख्य पाठ में स्वर्गदूत नहीं कहा गया।
  alternative: उन्हें ‘स्वर्गदूत’ या सीधे ‘श्वेत मनुष्य’ कहना।
  rationale: पद उनके स्वर्गीय उद्गम और रूप का वर्णन करता है, पर उनकी श्रेणी स्पष्ट रूप से नहीं बताता; इसलिए पहचान को अनिर्णीत रखा गया है।
- issue: चार और तीन की गणना
  choice: मूल की आकस्मिक संरचना ‘चार ... और उनके साथ तीन’ बनाए रखी गई है।
  alternative: इसे स्पष्ट करके ‘कुल सात’ कहना।
  rationale: सात का कुल योग संभव है, पर पाठ स्वयं ‘सात’ नहीं कहता; स्पष्ट करके लिखना मूल की वाक्यगत अस्पष्टता को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण दर्शनात्मक शैली अपनाई गई है। ‘और देखो’ से प्राचीन अपोकैलिप्टिक लय रखी गई है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सहज रखा गया है। ‘श्वेत’ रंग-सूचक मूल शब्द को सुरक्षित रखता है; ‘गोरे’ से जुड़ी आधुनिक जातीय ध्वनि से बचता है।
