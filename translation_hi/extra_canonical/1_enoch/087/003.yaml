base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/003.yaml
  text: And those three who came out afterward seized me by my hand[a], and they lifted me up from the offspring of the earth and brought me up onto a high place, and showed me a lofty tower above the earth[d][c][b], and all the hills became low.
translation:
  language: hi
  text: और वे तीनों, जो बाद में निकले थे, मेरा हाथ पकड़कर[a] मुझे पृथ्वी की संतति में से ऊपर उठाया और एक ऊँचे स्थान पर ले गए। उन्होंने मुझे पृथ्वी के ऊपर एक ऊँची मीनार[b] दिखाई, और सारी पहाड़ियाँ नीची हो गईं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल पाठ में एकवचन है: “मेरा हाथ।”'
    reason: textual_clarification
  - marker: b
    text: “मीनार” के लिए प्रयुक्त मूल संज्ञा कठिन है; इसका अर्थ अधिक सामान्य रूप से “ऊँची संरचना” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “सारे पहाड़ नीचे कर दिए गए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ፫እለ ወጽኡ ድኅረ
  choice: वे तीनों, जो बाद में निकले थे
  rationale: संख्या के संकेतात्मक बल और उसके बाद आने वाले संबंधवाचक उपवाक्य को सुरक्षित रखता है; ‘बाद में’ कालक्रम बताता है, पर उनकी प्रकृति को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: አሐዙኒ በእዴየ
  choice: मेरा हाथ पकड़कर
  rationale: क्रिया का अर्थ पकड़ना/थामना है और संज्ञा एकवचन ‘मेरा हाथ’ है; हिन्दी में यह स्वाभाविक और दृश्यात्मक है।
- source_word: አንሥኡኒ እምትውልደ ምድር
  choice: मुझे पृथ्वी की संतान में से उठा ले गए
  rationale: ऊपर उठाए जाने की गति तथा ‘जन्म/संतान’ की मूल गीइज़ अभिव्यक्ति दोनों को बनाए रखता है।
- source_word: አልዐሉኒ ዲበ መካን ነዋኅ
  choice: मुझे एक ऊँचे स्थान पर चढ़ा दिया
  rationale: आरोहण की छवि और स्थान की ऊँचाई को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ማኅፈደ ነዋኅ
  choice: एक ऊँची मीनार
  rationale: दुर्बोध संज्ञा संभवतः किसी ऊँची निर्मित संरचना का संकेत करती है; ‘मीनार’ संभावित दृश्य को व्यक्त करती है, जबकि पादटिप्पणी व्यापक विकल्प सुरक्षित रखती है।
- source_word: ሕፁፀ ኵሉ አውግር
  choice: सारी पहाड़ियाँ नीची हो गईं
  rationale: दृश्य में भूभाग के भौतिक रूप से नीचा होने को व्यक्त करता है; नैतिक ‘दीन किए जाने’ का अर्थ आरोपित नहीं करता।
theological_decisions:
- issue: ‘पृथ्वी की संतान’ से हनोक को अलग किए जाने का स्वरूप
  choice: ‘पृथ्वी की संतान में से’ कहकर जन्म/वंश की मूल छवि बनाए रखी गई।
  alternative: ‘पृथ्वी से’ अथवा ‘पृथ्वी के निवासियों में से’
  rationale: मूल पाठ की मानवशास्त्रीय और रहस्यदर्शी अस्पष्टता को सामान्य स्थानसूचक अर्थ में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य को पठनीयता हेतु दो वाक्यों में बाँटा गया है। ‘पृथ्वी की संतान’ जैसी अपोकैलिप्टिक छवि जानबूझकर सुरक्षित रखी गई है।
