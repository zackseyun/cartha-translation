  terminology: ‘मीनार’ is a reasonable provisional rendering for the difficult term ማኅፈደ, with the lexical uncertainty properly retained in the footnote. ‘सारी पहाड़ियाँ नीची हो गईं’ naturally conveys the topographical lowering without importing moral interpretation.
