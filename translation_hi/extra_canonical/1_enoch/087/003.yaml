  - severity: low
    issue: ‘पृथ्वी की संतान’ is a somewhat awkward collective phrase in Hindi.
    rationale: ‘पृथ्वी की संतति’ is a more natural literary Hindi collective while retaining the source’s birth/generation imagery and its ambiguity.
