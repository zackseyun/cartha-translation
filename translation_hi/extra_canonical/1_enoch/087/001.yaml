  yaml_path: translation/extra_canonical/1_enoch/087/001.yaml
  text: And again I saw them[a], and behold, they were butting one another and devouring one another[c][b], and the earth began to cry out.
translation:
  language: hi
  text: फिर मैंने उन्हें देखा। वे एक-दूसरे को सींगों से मारने[a] और ग्रसने[b] लगे, और पृथ्वी पुकार उठी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अर्थ अधिक सामान्य रूप से “घायल करना” या “प्रहार करना” भी हो सकता है। यहाँ दर्शन की पशु-संबंधी प्रतीकात्मक भाषा के कारण “सींगों से मारना” रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “एक-दूसरे को निगलने।” मूल क्रिया निगलने, ग्रसने या पूरी तरह खा जाने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወካዕበ፡ ርኢክዎሙ
  choice: फिर मैंने उन्हें देखा
  rationale: यह दर्शन के क्रम में दृश्य के दोबारा दिखाई देने का स्वाभाविक वर्णन है; सरल आधुनिक हिन्दी में प्रथम-पुरुष दृष्टिवृत्त बनाए रखा गया है।
- source_word: ወአኃዙ፡ እንዘ፡ ይወግኡ፡ ለካልኡ
  choice: वे एक-दूसरे को सींग मारने लगे
  rationale: प्राप्त लिप्यंतरण का ወአንዘ सम्भवतः OCR-त्रुटि है और मूल पाठ ወአኃዙ (‘वे आरम्भ हुए’) था; इसके बाद እንዘ और अपूर्ण क्रिया मिलकर आरम्भिक क्रिया व्यक्त करते हैं। पशु-प्रतीक वाले प्रसंग में ‘सींग मारना’ हिंसक पशु-संघर्ष की छवि बनाए रखता है।
- source_word: ወይውሑጦ፡ ለካልኡ
  choice: और निगल जाने
  rationale: क्रिया का मूल अर्थ निगलना या ग्रस लेना है। ‘निगल जाने’ से पारस्परिक हिंसा और पशु-दृश्य दोनों स्वाभाविक हिन्दी में बने रहते हैं।
- source_word: ወምድር፡ አኃዘት፡ ትጽራኅ
  choice: और पृथ्वी पुकार उठी
  rationale: लिप्यंतरण का አንዘት सम्भवतः አኃዘት (‘वह आरम्भ हुई’) की OCR-त्रुटि है। ‘पुकार उठी’ क्रिया के आरम्भ और पृथ्वी के सजीव मानवीकरण, दोनों को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: हिंसा के प्रत्युत्तर में पृथ्वी का मानवीकरण
  choice: पृथ्वी को सक्रिय कर्ता रखते हुए ‘पृथ्वी पुकार उठी’
  alternative: ‘पृथ्वी से पुकार सुनाई दी’ या ‘देश में हाहाकार मच गया’
  rationale: गीज़ पाठ पृथ्वी को स्वयं पुकारने वाली बताता है। इस ब्रह्मांडीय और प्रकाशनात्मक छवि को निर्जीव या केवल सामान्य उपद्रव में बदलना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पशु-संघर्ष और पुकारती हुई पृथ्वी की प्रकाशनात्मक छवियाँ यथावत हैं। उपलब्ध लिप्यंतरण की संभावित OCR-त्रुटियों को समीक्षित गीज़ रूपों ወአኃዙ और አኃዘት के आधार पर समझा गया है; अनावश्यक ‘देखो’ नहीं जोड़ा गया, क्योंकि वह प्राप्त गीज़ पाठ में स्वतंत्र पद के रूप में प्रमाणित नहीं है।
