base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/004.yaml
  text: And they said to me[a], “Remain here until you see everything that will come upon those elephants and camels and donkeys, and upon the stars and upon the cattle[c][b], and all of them.”
translation:
  language: hi
  text: और उन्होंने मुझसे कहा, “यहाँ तब तक ठहरे रहो, जब तक तुम वह सब न देख लो जो उन हाथियों, ऊँटों और गधों पर, और तारों तथा मवेशियों पर—उन सब पर—आने वाला है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में बार-बार आया “पर” यह स्पष्ट नहीं करता कि इन सब पर वास्तव में क्या आने वाला है। दर्शन का प्रसंग न्याय का संकेत दे सकता है, पर इस वाक्य में यह सीधे नहीं कहा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ይቤሉኒ
  choice: उन्होंने मुझसे कहा
  rationale: सामान्य कथात्मक वचन-सूत्र है; प्रत्यय में निहित ‘मुझसे/मुझको’ को स्पष्ट रखा गया है।
- source_word: ንበር ዝየ
  choice: यहाँ ... ठहरे रहो
  rationale: आज्ञार्थक क्रिया में ठहरने या बने रहने का भाव है; ‘यहाँ’ स्थानसूचक पद ዝየ को व्यक्त करता है।
- source_word: እስከ ትሬኢ ኵሎ ዘይመጽእ
  choice: जब तक तुम वह सब न देख लो ... आने वाला है
  rationale: यह निर्देश की अवधि और भावी दर्शन की व्यापकता दोनों व्यक्त करता है।
- source_word: ዲበ
  choice: पर
  rationale: बार-बार आए संबंधसूचक पद को यथासंभव बनाए रखते हुए यह खुला छोड़ा गया है कि आने वाली बात न्याय, विपत्ति या कोई अन्य घटना है।
- source_word: እልኩ ነጌያት
  choice: उन हाथियों
  rationale: दर्शन में पहले से उपस्थित पशुओं की ओर संकेत करने वाले भाव को ‘उन’ से रखा गया है।
- source_word: አግማል
  choice: ऊँटों
  rationale: पशु-संबंधी प्रत्यक्ष अर्थ को ज्यों का त्यों रखा गया है।
- source_word: አእዱግ
  choice: गधों
  rationale: आधुनिक मानक हिन्दी का स्पष्ट और स्वाभाविक पशु-नाम।
- source_word: ከዋክብት
  choice: तारों
  rationale: दर्शनात्मक प्रतीक का अर्थ खोलकर ‘स्वर्गदूत’ आदि नहीं किया गया; मूल बिंब सुरक्षित है।
- source_word: አልህምታት
  choice: मवेशियों
  rationale: यह पद गाय-बैल वर्ग के पशुओं/मवेशियों के लिए है, भेड़ों के लिए नहीं; इसलिए पशु-संकेत की विशिष्टता बचाई गई है।
- source_word: ወኵሎሙ
  choice: उन सब पर
  rationale: अंतिम समाहार को छोड़ा नहीं गया; हिन्दी में पुनरुक्त ‘पर’ के साथ इससे सभी सूचीबद्ध समूहों पर बल पड़ता है।
theological_decisions:
- issue: आने वाली घटना को स्पष्ट रूप से दंड या न्याय कहना
  choice: आने वाला है
  alternative: उन पर न्याय आने वाला है
  rationale: गीज़ पाठ घटना को दंड या न्याय नाम नहीं देता। प्रसंग ऐसा संकेत दे सकता है, पर अनुवाद उस अर्थ को मुख्य पाठ में आरोपित नहीं करता।
- issue: दर्शन के पशु और ब्रह्मांडीय प्रतीकों की व्याख्या करना
  choice: हाथी, ऊँट, गधे, तारे और मवेशी को अक्षरशः बनाए रखना
  alternative: उन्हें ऐतिहासिक समुदायों या तारों को स्वर्गदूतों के रूप में प्रस्तुत करना
  rationale: इस पंक्ति में प्रतीक दिए गए हैं, उनका अर्थ नहीं खोला गया; इसलिए दर्शनात्मक तनाव और बिंब सुरक्षित रखे गए हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। दर्शनात्मक लय बनाए रखने के लिए सूची और अंतिम समाहार सुरक्षित रखे गए हैं; ‘ठहरे रहो’ बोलचाल के ‘रुको’ से कुछ अधिक गंभीर है, पर अप्रचलित नहीं।
