base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/003.yaml
  text: And in every month its going out and its returning vary[a], and its days are like the days of the sun; and when its light is full[c][b], it is a seventh part of the light of the sun.
translation:
  language: hi
  text: और हर महीने उसका निकलना और लौटना बदलते हैं[a], और उसके दिन सूर्य के दिनों के समान हैं; और जब उसका प्रकाश पूर्ण होता है[b], तब उसका प्रकाश सूर्य के प्रकाश का सातवाँ भाग होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘निकलना’ और ‘लौटना’ किसी ज्योति-पिंड की चक्रीय गति के लिए प्रयुक्त खगोलीय भाषा है। इनके अर्थ क्रमशः ‘उदय होना’ और ‘अस्त होना’ भी हो सकते हैं, पर गीइज़ पाठ स्वयं इतना विशिष्ट नहीं है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात जब चंद्रमा का प्रकाश पूर्ण या उज्ज्वल अवस्था में होता है। यह पद उसकी ज्योति के उज्ज्वल या पूर्ण होने का संकेत देता है।
    reason: cultural_note
lexical_decisions:
- source_word: ሙፃኢሁ
  choice: उसका निकलना
  rationale: मूल संज्ञा का अर्थ बाहर निकलना या प्रकट होना है। खगोलीय संदर्भ में ‘उदय’ संभव है, पर वह मूल की अपेक्षा अधिक विशिष्ट होगा।
- source_word: ምብዋኢሁ
  choice: उसका लौटना
  rationale: यह ‘निकलना’ के समानांतर प्रवेश या वापसी को व्यक्त करता है। ‘अस्त होना’ संभव है, किंतु ‘लौटना’ मूल की औपचारिक समानांतरता बनाए रखता है।
- source_word: ይትዌለጥ
  choice: बदलता रहता है
  rationale: क्रिया परिवर्तन या भिन्नता का बोध कराती है; यह रूप मासिक चक्र की निरंतर भिन्नता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: መዋዕሊሁ
  choice: उसके दिन
  rationale: सरल अर्थ ‘उसके दिन’ है। संदर्भ में इससे उसके चक्र के गिने हुए दिन अभिप्रेत हो सकते हैं, पर मुख्य पाठ में अतिरिक्त व्याख्या नहीं जोड़ी गई।
- source_word: ከመ፡ መዋዕለ፡ ፀሐይ
  choice: सूर्य के दिनों के समान
  rationale: तुलनासूचक ከመ को ‘के समान’ कहना मूल की तुलना को सुरक्षित रखता है और अनावश्यक रूप से पूर्ण समानता निर्धारित नहीं करता।
- source_word: ይፄሪ
  choice: उसका प्रकाश पूरा होता है
  rationale: यहाँ क्रिया चंद्रमा के प्रकाश के निर्मल, उज्ज्वल या पूर्ण होने का बोध कराती है। खगोलीय संदर्भ में ‘प्रकाश पूरा होता है’ पूर्ण प्रकाशित अवस्था को सहज रूप से व्यक्त करता है; इसे अँधेरा होना समझना अर्थ को उलट देगा।
- source_word: ሳብዓደ፡ እደ
  choice: सातवाँ भाग
  rationale: वाक्यांश एक सातवें अंश या माप को व्यक्त करता है; ‘सातवाँ भाग’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: እምብርሃነ፡ ፀሐይ
  choice: सूर्य के प्रकाश का
  rationale: पूर्वसर्ग यहाँ स्रोत अथवा अंश-संबंध दिखाता है; ‘सूर्य के प्रकाश का सातवाँ भाग’ हिन्दी में मात्रात्मक संबंध को स्पष्ट रखता है।
