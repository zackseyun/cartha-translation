base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/005.yaml
  text: And its distant half is one seventh part[a], and all its disk is empty, without light[c][b], except for a seventh part of it—a fourteenth part of its light.
translation:
  language: hi
  text: और उसका दूरस्थ आधा भाग एक सातवाँ अंश है[a], और उसका सारा चक्र रिक्त है, प्रकाशहीन है—सिवाय उसके एक सातवें अंश के, अर्थात उसके प्रकाश का एक चौदहवाँ अंश[c][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ की संख्यात्मक अभिव्यक्ति कठिन है। यहाँ ‘अंश’ किया गया शब्द मूलतः ‘हाथ’ है, पर इस संदर्भ में वह ज्योति-पिंड के मापे हुए चक्र की इकाई या भाग के अर्थ में प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: यह पद चंद्रमा के प्रकाशित और अप्रकाशित भागों को खगोलीय पुस्तक की योजनाबद्ध शैली में बताता है; इसे आधुनिक वैज्ञानिक विवरण नहीं समझना चाहिए।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से इस कठिन गीज़ पदबंध को ‘सात भाग’ और ‘चौदह भाग’ भी समझा जा सकता है। किंतु गीज़ की भिन्नात्मक रचना और अध्याय का प्रसंग यहाँ ‘एक सातवाँ अंश’ तथा ‘एक चौदहवाँ अंश’ अर्थ का समर्थन करते हैं।
    reason: textual_or_translation_ambiguity
lexical_decisions:
- source_word: መንፈቀ
  choice: आधा भाग
  rationale: यह संज्ञा आधे या विभाजित भाग को दर्शाती है; चंद्रमा के परिमाणात्मक वर्णन में ‘आधा भाग’ स्वाभाविक और सटीक है।
- source_word: ርኁቅ
  choice: दूर वाला
  rationale: यह स्थानिक अर्थ ‘दूर’ या ‘दूरस्थ’ रखता है; ‘दूर वाला’ सामान्य पाठक के लिए सहज रहते हुए ब्रह्मांडीय संदर्भ को बनाए रखता है।
- source_word: ሳብዐተ እደ አሐደ
  choice: सातवाँ अंश
  rationale: यहाँ እድ (‘हाथ’) माप के अंश के अर्थ में है और क्रमसूचक संख्या के साथ भिन्न सूचित करता है; प्रसंग के चंद्र-गणित के अनुसार इसे ‘सातवाँ अंश’ रखा गया है।
- source_word: ኵሉ ክበበ ዚአሁ
  choice: उसका पूरा चक्र
  rationale: ክበብ का मूल अर्थ वृत्त या गोलाकार रूप है। ‘चक्र’ दृश्य गोलाकार पिंड को दर्शाता है और अनावश्यक आधुनिक वैज्ञानिक शब्दावली से बचता है।
- source_word: ባክ ዘአልቦ ብርሃነ
  choice: खाली, प्रकाशहीन
  rationale: दोनों अभिव्यक्तियाँ अभाव और प्रकाश के न होने पर बल देती हैं; हिंदी में यह संयोजन मूल की पुनरुक्ति और दृश्य प्रभाव बचाता है।
- source_word: ዘእንበለ
  choice: सिवाय
  rationale: यह स्पष्ट अपवादसूचक अव्यय है; ‘सिवाय’ आधुनिक हिंदी में सहज है।
- source_word: ሳብዐተ እዴሁ
  choice: उसके सातवें अंश
  rationale: चंद्रमा के प्रकाश को चौदह अंशों में बाँटने वाले प्रसंग में यह उसके आधे भाग का सातवाँ अंश सूचित करता है।
- source_word: ዐሠርተ ራብዐተ እደ ብርሃኑ
  choice: उसके प्रकाश का चौदहवाँ अंश
  rationale: गीज़ की भिन्नात्मक रचना और अध्याय के चंद्र-गणित के अनुसार यह कुल प्रकाश का चौदहवाँ अंश है, न कि चौदह पृथक अंश।
theological_decisions:
- issue: ज्योति-पिंड के वर्णन की प्रकृति
  choice: पद को तकनीकी-प्रकाशनात्मक खगोलीय माप के रूप में रखा गया है।
  alternative: इसे केवल चंद्रमा के बढ़ने या घटने का सामान्य वर्णन बनाना, अथवा आधुनिक वैज्ञानिक व्याख्या में बदलना।
  rationale: खगोलीय पुस्तक आकाशीय चक्रों का वर्णन गिने हुए अंशों की शैली में करती है। भिन्नात्मक भाषा बनाए रखने से पाठ की अपनी ब्रह्मांड-वर्णन शैली सुरक्षित रहती है।
- issue: कठिन भिन्नात्मक वाक्य-विन्यास
  choice: मुख्य पाठ में ‘सातवाँ अंश’ और ‘चौदहवाँ अंश’ रखा गया है, पर कठिनाई को पादटिप्पणी में स्वीकार किया गया है।
  alternative: शाब्दिक रूप से ‘सात हाथ/भाग’ और ‘चौदह हाथ/भाग’ लिखना।
  rationale: प्रसंग और गीज़ की क्रमसूचक-भिन्नात्मक रचना भिन्न का समर्थन करती है, किंतु पाठ-साक्ष्य की कठिनाई छिपाई नहीं जानी चाहिए।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। मूल की माप-संबंधी पुनरावृत्ति और कठिन खगोलीय शैली को अत्यधिक सरल नहीं किया गया है।
