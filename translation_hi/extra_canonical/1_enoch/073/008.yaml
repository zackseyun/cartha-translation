  text: And on that day it rises with exactly seven parts[b][a], and it comes out.
translation:
  language: hi
  text: और उस दिन वह ठीक सात भागों[a] के साथ उदय होता है और बाहर निकल आता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सात भागों’ के स्थान पर ‘सात अंशों’ भी अनुवाद किया जा सकता है। यहाँ चन्द्रमा के मापे हुए भागों का संकेत है, पर इस पंक्ति में ‘प्रकाश’ शब्द स्पष्ट रूप से नहीं आया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ይሠርቅ
  choice: उदय होता है
  rationale: खगोलीय पिंड के संदर्भ में यह क्रिया ‘उदय होना’ व्यक्त करती है; इससे चन्द्रमा की क्षितिज पर प्रकट होने की गति स्वाभाविक हिन्दी में आती है।
- source_word: በይእቲ ዕለት
  choice: उस दिन
  rationale: पूर्वसर्ग, संकेतवाचक और ‘दिन’ का यह संयोजन स्पष्ट कालसूचक वाक्यांश है।
- source_word: ሳብዐተ እደ
  choice: सात अंशों
  rationale: यहाँ ሳብዐተ ‘सात’ और እደ ‘भागों/हिस्सों’ को सूचित करता है। खगोलीय परिमाण के लिए ‘अंश’ संक्षिप्त और स्वाभाविक है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: ጥንቁቀ
  choice: ठीक
  rationale: यह शब्द संख्या की यथार्थता या सटीकता पर बल देता है; आधुनिक हिन्दी में ‘ठीक’ सहज और स्पष्ट है।
- source_word: ይወፅእ
  choice: बाहर निकल आता है
  rationale: यह बाहर आने या प्रकट होने की गति बताने वाली सामान्य क्रिया है; ‘निकल आता है’ उदय के वर्णन में स्वाभाविक है और मूल की दूसरी गति-क्रिया को भी बनाए रखता है।
theological_decisions:
- issue: पुल्लिंग एकवचन क्रियाओं का संदर्भ
  choice: कर्ता को ‘वह’ रखकर पुल्लिंग क्रियाएँ ‘होता है’ और ‘आता है’ प्रयोग की गई हैं।
  alternative: आधुनिक निर्जीव खगोलीय वस्तु की तरह लिंग-निरपेक्ष या कर्तारहित वाक्य बनाया जा सकता था।
  rationale: गीज़ की क्रियाएँ पुल्लिंग एकवचन हैं और प्रसंग में वर्णित ज्योति-पिंड, अर्थात चन्द्रमा, उनका स्वाभाविक संदर्भ है। यह रूप मूल की व्यक्तिमूलक प्रलय-साहित्यिक शैली को समतल नहीं करता।
- issue: ‘सात अंशों’ का आशय
  choice: मुख्य पाठ में केवल परिमाण बताया गया है; ‘प्रकाश’ या ‘प्रकाशित भाग’ नहीं जोड़ा गया।
  alternative: प्रसंग के आधार पर ‘प्रकाश के ठीक सात अंशों के साथ’ कहा जा सकता था।
  rationale: चन्द्रमा के बढ़ते प्रकाश का आशय प्रसंग से संभव है, पर इस पंक्ति में ‘प्रकाश’ का स्पष्ट शब्द नहीं है; इसलिए उसे मुख्य पाठ में जोड़ना मूल की संक्षिप्तता और संभावित अस्पष्टता को घटाता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘उदय होता है’ तथा ‘बाहर निकल आता है’ मूल की दो क्रमिक गति-क्रियाओं को अलग बनाए रखते हैं। स्रोत-पाठ का विश्वास-स्तर मध्यम होने के कारण कठिन पद को पादटिप्पणी में अधिक शाब्दिक रूप से स्पष्ट किया गया है।
