base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/002.yaml
  text: And its circuit is like the circuit of heaven[a], and its chariots, by which it goes out, are driven by the wind[c][b]; and light is given to it by measure.
translation:
  language: hi
  text: और उसका घेरा आकाश के घेरे के समान है; और उसके रथ, जिनके द्वारा वह बाहर निकलता है, हवा से चलाए जाते हैं[a]; और उसे नाप के अनुसार प्रकाश दिया जाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इथियोपिक पाठ में हवा से संबंधित यह उपवाक्य कठिन है। अर्थ यह भी हो सकता है कि उसके रथ वहाँ जाते हैं जहाँ हवा चलती है, या वे हवाओं के द्वारा आगे बढ़ाए जाते हैं।
    reason: textual_variant
  - marker: b
    text: या ‘नाप से’ अथवा ‘निर्धारित नाप के अनुसार।’ यह पद प्रकाश के नियमित और व्यवस्थित रूप से दिए जाने पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ክበቡ
  choice: उसका घेरा
  rationale: यह शब्द घेरने से बने वृत्ताकार विस्तार या चक्र को व्यक्त करता है। ‘घेरा’ स्थान और गति—दोनों की संभावना बनाए रखता है और आधुनिक खगोलीय ‘कक्षा’ को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: ከመ ክበበ ሰማይ
  choice: आकाश के घेरे के समान
  rationale: मूल में स्पष्ट उपमा है। ‘आकाश’ आधुनिक हिन्दी में स्वाभाविक होते हुए भी इस दर्शनात्मक ब्रह्मांडीय प्रसंग की गरिमा बनाए रखता है।
- source_word: ሰረገላተ ዚአሁ
  choice: उसके रथ
  rationale: बहुवचन रूप को बनाए रखते हुए ‘रथ’ प्रलयदर्शी-ब्रह्मांडीय बिंब को सुरक्षित रखता है; ‘वाहन’ इस बिंब को अनावश्यक रूप से सपाट कर देता।
- source_word: በኀበ ይጼዓን ነፋስ ትነፍስ
  choice: जिनके द्वारा वह बाहर निकलता है, हवा से चलाए जाते हैं
  rationale: यह कठिन वाक्यांश बाहर निकलने और हवा के चलने/चलाने—दोनों तत्वों को रखता है। मुख्य पाठ नवीनतम स्रोत-समीक्षा के अनुरूप रथों को बाहर निकलने का माध्यम मानता है, जबकि पादटिप्पणी दूसरी संभव व्याख्याएँ बताती है।
- source_word: በመስፈርት
  choice: नाप के अनुसार
  rationale: यह पद नाप, नियम या निर्धारित अनुपात का भाव देता है। ‘नाप के अनुसार’ प्रकाश के नियमित और व्यवस्थित वितरण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ይትወሀብ ሎቱ ብርሃን
  choice: उसे ... प्रकाश दिया जाता है
  rationale: मूल के कर्मवाच्य को सुरक्षित रखा गया है; इससे प्रकाश के दिए जाने का भाव रहता है, न कि उसके स्वयं प्रकाश उत्पन्न करने का दावा।
theological_decisions:
- issue: ज्योति-पिंड की गति को आधुनिक यांत्रिक शब्दावली में व्यक्त करना या दर्शनात्मक ब्रह्मांडीय बिंब बनाए रखना
  choice: ‘घेरा’ और ‘रथ’ के ब्रह्मांडीय बिंब बनाए रखे गए हैं।
  alternative: ‘कक्षा’ और ‘वाहन’ अथवा केवल ‘मार्ग’ और ‘गतियाँ’
  rationale: यह खंड आकाशीय गति को दर्शनात्मक और प्रलयदर्शी भाषा में प्रस्तुत करता है। आधुनिक वैज्ञानिक श्रेणियाँ जोड़ने के बजाय मूल विधा और उसकी वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। वाक्य की प्रलयदर्शी-ब्रह्मांडीय छवि के लिए ‘रथ’ और ‘घेरा’ को बनाए रखा गया है। कठिन इथियोपिक उपवाक्य को मुख्य पाठ में पठनीय बनाया गया है और उसकी वास्तविक अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
