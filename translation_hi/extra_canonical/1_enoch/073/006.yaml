  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/006.yaml
  text: And on the day it takes up a seventh part of half of its light[c][b][a], and its light becomes one and a half seventh parts.
translation:
  language: hi
  text: और उस दिन वह अपने प्रकाश के आधे भाग का सातवाँ अंश लेता है,[a] और उसका प्रकाश सातवें अंश का डेढ़ गुना हो जाता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल अभिव्यक्ति शाब्दिक रूप से ‘सात हाथ’ है, जो इस खगोलीय संदर्भ में माप के अंशों या इकाइयों का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम संख्या मूल भाषा में संक्षिप्त और कठिन है—शाब्दिक रूप से लगभग ‘एक और आधा’ सातवाँ अंश। यहाँ इसे सातवें अंश की डेढ़ इकाइयों के रूप में व्यक्त किया गया है; ‘एक सातवाँ अंश और आधा’ भी संभव पाठानुवाद है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: በዕለተ
  choice: उस दिन
  rationale: यह ठोस काल-सूचक पद है; खगोलीय क्रम के संदर्भ में ‘उस दिन’ स्वाभाविक और सटीक है।
- source_word: ትነሥእ
  choice: ग्रहण करता है
  rationale: यहाँ क्रिया का एक ही प्रयोग है और संदर्भ में अर्थ ‘लेता/ग्रहण करता है’ है; इसे ‘उदय होता है’ के साथ दोहरा कर नहीं अनूदित किया गया। हिंदी में ‘चंद्रमा’ पुल्लिंग होने के कारण पुल्लिंग क्रिया रखी गई है।
- source_word: ሳብዐተ እደ
  choice: सातवाँ अंश
  rationale: ‘हाथ’ वाले माप-संबंधी मुहावरे को इस खगोलीय गणना में अंश के रूप में व्यक्त किया गया है; संख्या को ‘सात अंश’ न बनाकर क्रमवाचक ‘सातवाँ अंश’ रखा गया है।
- source_word: መንፈቀ ብርሃኑ
  choice: अपने प्रकाश के आधे भाग का
  rationale: ‘आधा’ और ‘प्रकाश’ दोनों को स्पष्ट रखते हुए संबंध को स्वाभाविक हिंदी में व्यक्त किया गया है।
- source_word: ይከውን
  choice: हो जाता है
  rationale: क्रिया परिणामी अवस्था बताती है; ‘हो जाता है’ इस परिवर्तन को सहज हिंदी में सुरक्षित रखता है।
- source_word: አሐተ ወመንፈቃ
  choice: डेढ़
  rationale: शाब्दिक ‘एक और आधा’ को उसी माप-इकाई से जोड़कर हिंदी की स्वाभाविक संख्यात्मक अभिव्यक्ति ‘डेढ़’ दी गई है।
theological_decisions:
- issue: ज्योति-पिंड का व्याकरणिक और साहित्यिक निरूपण
  choice: चंद्रमा के लिए पुल्लिंग ‘वह/उसका’ और पुल्लिंग क्रिया का प्रयोग
  alternative: स्त्रीलिंग मानवीकरण ‘वह/उसकी ... करती है’
  rationale: स्रोत में प्रकाश के साथ लगा सर्वनाम-प्रत्यय पुल्लिंग है, और आधुनिक हिंदी में ‘चंद्रमा’ भी पुल्लिंग है। इससे अनावश्यक स्त्रीलिंग मानवीकरण आरोपित नहीं होता, जबकि ज्योति-पिंड को सक्रिय कर्ता बताने वाली अपोकैलिप्टिक शैली बनी रहती है।
- issue: कठिन खगोलीय संख्या का अर्थ
  choice: ‘डेढ़ सातवाँ अंश’ के रूप में इकाई-संबंध सुरक्षित रखना
  alternative: ‘एक सातवाँ अंश और आधा’ या ‘सात अंश और आधा’
  rationale: पाठ की संख्यात्मक कठिनाई को किसी आधुनिक खगोलीय योजना से चुपचाप हल नहीं किया गया। चुना हुआ रूप डेढ़ को सातवें अंश की इकाई से जोड़ता है और गलत रूप से सात पूरे अंश नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। तकनीकी खगोलीय माप को सरल किया गया है, पर स्रोत की वास्तविक संख्यात्मक अस्पष्टता पादटिप्पणी में सुरक्षित है।
