base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/004.yaml
  text: And in this way it rises[a], and its front, which is toward the east, comes out on the thirtieth morning, and on that day it becomes visible, and it shall be for you the head of the month, on the thirtieth day with the sun[e][d][c][b], in the gate from which the sun comes out.
translation:
  language: hi
  text: और इस प्रकार वह छिप जाता है[a]; और उसका अग्रभाग[b], जो पूर्व की ओर है, तीसवीं सुबह निकलता है। उस दिन वह दिखाई देता है और तुम्हारे लिए महीने का आरम्भ[c] होता है—सूर्य के साथ तीसवें दिन[d], उस द्वार[e] में जिससे सूर्य निकलता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “उदय होता है।” कुछ अनुवादों में यह अर्थ दिया गया है; पर यहाँ क्रिया का अधिक स्वाभाविक अर्थ “छिप जाता है” है।'
    reason: textual_ambiguity
  - marker: b
    text: 'शाब्दिक रूप से: “उसका सिर।”'
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक रूप से: “महीने का सिर,” अर्थात महीने का आरम्भ।'
    reason: lexical_alternative
  - marker: d
    text: 'या: “तीस दिन।” यहाँ पंचांग-संबंधी प्रसंग में इसे तिथि, अर्थात “तीसवें दिन,” समझा गया है।'
    reason: textual_ambiguity
  - marker: e
    text: “द्वार” इस खगोलीय पुस्तक में आकाश के उन व्यवस्थित मार्गों की बार-बार आने वाली छवि है जिनसे आकाशीय पिंड निकलते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: ይሠርቅ
  choice: उदय होता है
  rationale: यह क्रिया यहाँ आकाशीय पिंड के प्रकट होने या उदय होने का बोध कराती है और पूर्व दिशा के अगले उल्लेख से मेल खाती है। पुराने अनुवाद में मिले ‘छिप जाता है’ को पाठ-टिप्पणी में सुरक्षित रखा गया है।
- source_word: ርእሱ
  choice: उसका अग्रभाग
  rationale: शाब्दिक अर्थ ‘उसका सिर’ है; दिशा और गति के इस वर्णन में ‘अग्रभाग’ स्वाभाविक हिन्दी है और मूल की स्थानिक छवि को बनाए रखता है।
- source_word: ዘመንገለ ጽባሕ
  choice: जो पूर्व की ओर है
  rationale: ‘भोर/प्रातः की दिशा’ का आशय पूर्व है; हिन्दी में ‘पूर्व की ओर’ स्पष्ट और स्वाभाविक है।
- source_word: በሠላሳ ጽባሕ
  choice: तीसवीं सुबह
  rationale: यह चक्र की तीसवीं भोर पर घटने वाली घटना को सूचित करता है।
- source_word: ያስተርኢ
  choice: वह दिखाई देता है
  rationale: कारक रूप का भाव ‘दिखाना/दृश्य करना’ है; इस चन्द्र-वर्णन में परिणामसूचक ‘दिखाई देता है’ सहज है।
- source_word: ርእሰ ወርኅ
  choice: महीने का आरम्भ
  rationale: मूल मुहावरा शाब्दिक रूप से ‘महीने का सिर’ है। साधारण आधुनिक हिन्दी में उसका काल-संबंधी अर्थ ‘महीने का आरम्भ’ अधिक स्पष्ट है, जबकि शाब्दिक छवि पादटिप्पणी में दी गई है।
- source_word: ሠላሳ ዕለት
  choice: तीसवें दिन
  rationale: यद्यपि शब्दशः ‘तीस दिन’ संभव है, इस पंचांग-संबंधी प्रसंग और पहले आए ‘तीसवीं सुबह’ के समानांतर प्रयोग में यह क्रमवाचक तिथि है।
- source_word: ምስለ ፀሐይ
  choice: सूर्य के साथ
  rationale: मूल पूर्वसर्ग संगति या साथ होने का अर्थ देता है; यह अनुवाद उस संबंध को बिना अतिरिक्त व्याख्या के रखता है।
- source_word: በኆኅት
  choice: उस द्वार में
  rationale: ‘द्वार’ खगोलीय पुस्तक की ठोस ब्रह्मांडीय छवि है; इसे आधुनिक ‘क्षितिज’ में नहीं बदला गया।
- source_word: እንተ ይወፅእ ፀሐይ
  choice: जिससे सूर्य निकलता है
  rationale: संबंधवाचक उपवाक्य उस विशेष द्वार की पहचान सूर्य के निकलने के स्थान के रूप में करता है।
theological_decisions:
- issue: प्राचीन ब्रह्मांडीय भाषा को आधुनिक खगोल-विज्ञान की शब्दावली में सामान्यीकृत करना
  choice: ‘द्वार’ और सूर्य के ‘निकलने’ जैसी मूल ठोस छवियाँ बनाए रखी गईं।
  alternative: ‘पूर्वी क्षितिज’, ‘सूर्योदय-बिंदु’ या ‘अमावस्या/नवचन्द्र’ जैसी आधुनिक व्याख्यात्मक शब्दावली अपनाना।
  rationale: मूल पाठ अपनी प्रकटित ब्रह्मांड-व्यवस्था को विशिष्ट चित्रात्मक भाषा में प्रस्तुत करता है। आधुनिक शब्दावली उस साहित्यिक और धर्मवैचारिक तनाव को अनावश्यक रूप से समतल कर देती।
- issue: ርእሰ ወርኅ के ठोस मुहावरे का हिन्दी रूप
  choice: मुख्य पाठ में ‘महीने का आरम्भ’, और पादटिप्पणी में शाब्दिक ‘महीने का सिर’।
  alternative: मुख्य पाठ में ही ‘महीने का सिर’।
  rationale: यहाँ मुहावरे का पंचांग-संबंधी अर्थ साधारण पाठक के लिए स्पष्ट करना उचित है, पर मूल की ठोस छवि को पादटिप्पणी में संरक्षित किया गया है; इससे किसी सिद्धान्तगत अर्थ को आरोपित नहीं किया जाता।
