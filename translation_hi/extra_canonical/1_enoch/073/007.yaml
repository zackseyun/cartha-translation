base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/007.yaml
  text: And it sets with the sun[a]; and when the sun rises, the moon rises with it and takes half a portion of light. And on that night, at the beginning of its morning, before the day[c][b], the moon sets with the sun and is dark through that night—seven parts and a half.
translation:
  language: hi
  text: और चन्द्रमा सूर्य के साथ अस्त होता है; और जब सूर्य उदय होता है, तब चन्द्रमा उसके साथ उदय होता है और प्रकाश के एक भाग का आधा प्राप्त करता है। उस रात की भोर के आरम्भ में, दिन होने से पहले[a], चन्द्रमा सूर्य के साथ अस्त होता है और उस रात साढ़े सात भाग तक अँधकारमय रहता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद के मध्य की गीइज़ वाक्य-रचना कठिन है, विशेषकर ‘उस रात की भोर के आरम्भ में, दिन होने से पहले।’ अनुवाद आधुनिक खगोलीय व्याख्या देने के बजाय मूल समयक्रम को यथासम्भव बनाए रखता है।
    reason: textual_variant
  - marker: b
    text: इस अध्याय में चन्द्रमा के प्रकाश को बार-बार गिने हुए ‘भागों’ में मापा गया है। यहाँ ‘साढ़े सात भाग’ उसी मापन-पद्धति का संकेत है।
    reason: cultural_note
lexical_decisions:
- source_word: የዓርብ
  choice: अस्त होता है
  rationale: खगोलीय संदर्भ में यह किसी ज्योति-पिंड के नीचे जाने या अस्त होने को बताता है; आधुनिक मानक हिन्दी में ‘अस्त होता है’ स्वाभाविक और सटीक है।
- source_word: ይሠርቅ
  choice: उदय होता है
  rationale: यह सूर्य और चन्द्रमा दोनों के लिए प्रयुक्त है और अस्त होने के विपरीत खगोलीय गति को व्यक्त करता है।
- source_word: ምስሌሁ
  choice: उसके साथ
  rationale: सर्वनाम का संदर्भ सूर्य है; हिन्दी में व्याकरणिक लिंग के अनुसार ‘उसके साथ’ स्वाभाविक है, पर इससे सूर्य का मानवीकरण नहीं किया गया।
- source_word: ይነሥእ
  choice: प्राप्त करता है
  rationale: यहाँ चन्द्रमा द्वारा प्रकाश की एक मापी हुई मात्रा ग्रहण करने का भाव है; ‘प्राप्त करता है’ क्रिया को स्पष्ट रखता है, बिना आधुनिक वैज्ञानिक व्याख्या जोड़े।
- source_word: መንፈቀ እደ ብርሃን
  choice: प्रकाश के एक भाग का आधा
  rationale: वाक्यांश में ‘आधा’, ‘भाग/माप’ और ‘प्रकाश’ सम्मिलित हैं। यह अनुवाद अध्याय की अंशों में प्रकाश मापने की पद्धति को बनाए रखता है।
- source_word: በርእሰ ጽባሐ ዚአሁ
  choice: उसकी भोर के आरम्भ में
  rationale: शाब्दिक चित्र ‘उसकी भोर के सिर/आरम्भ पर’ है; ‘आरम्भ में’ हिन्दी में पठनीय रहते हुए काल-संबंधी अर्थ सुरक्षित रखता है।
- source_word: በቅድመ ዕለቱ
  choice: दिन होने से पहले
  rationale: यह भोर और दिन के बीच का काल-संबंध बताता है। स्रोत की वाक्य-रचना कठिन है, इसलिए सहज हिन्दी में समयक्रम रखा गया है, पर अर्थ को आधुनिक खगोल-विज्ञान से नहीं समझाया गया।
- source_word: ይጸልም
  choice: अँधेरा रहता है
  rationale: क्रिया अन्धकार या प्रकाशहीन अवस्था बताती है; ‘अँधेरा रहता है’ उस अवस्था को व्यक्त करता है और ग्रहण जैसी विशिष्ट व्याख्या नहीं जोड़ता।
- source_word: ፯ሳብዓተ እደ ወንፍቃ
  choice: साढ़े सात भाग
  rationale: यह अध्याय में प्रयुक्त प्रकाश-मापन की गिनी हुई इकाइयों को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: प्राचीन दर्शनीय खगोलीय वर्णन को आधुनिक विज्ञान के अनुरूप समझाना या मूल बिम्ब में रखना
  choice: उदय, अस्त और प्रकाश के मापे हुए ‘भागों’ की ठोस भाषा बनाए रखी गई
  alternative: इसे चन्द्रमा की कलाओं, युति या ग्रहण की आधुनिक व्याख्या के रूप में प्रस्तुत करना
  rationale: खगोलीय पुस्तक आकाशीय व्यवस्था को अपने प्राचीन दर्शनीय मुहावरे में बताती है। अनुवाद उस मुहावरे और उसके तनाव को सुरक्षित रखता है, न कि उसे आधुनिक वैज्ञानिक शब्दावली में बदलता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली। ‘चन्द्रमा’, ‘सूर्य’, ‘उदय’ और ‘अस्त’ जैसे परिचित खगोलीय शब्द रखे गए हैं। कठिन मध्यांश को अत्यधिक सहज बनाकर उसकी वास्तविक अस्पष्टता मिटाई नहीं गई; उसे पादटिप्पणी में स्पष्ट किया गया है।
