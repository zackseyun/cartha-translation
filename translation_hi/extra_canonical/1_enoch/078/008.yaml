  yaml_path: translation/extra_canonical/1_enoch/078/008.yaml
  text: And in its waning[a], on the first day it diminishes to fourteen parts of its light, and on the second it diminishes to thirteen parts of light, and on the third it diminishes to twelve, and on the fourth to eleven parts, and on the fifth it diminishes to ten parts, and on the sixth it diminishes to nine parts, and on the seventh it diminishes to eight parts, and on the eighth it diminishes to seven, and on the ninth it diminishes to six, and on the tenth it diminishes to five, and on the eleventh it diminishes to four, and on the twelfth it diminishes to three, and on the thirteenth it diminishes to two, and on the fourteenth it diminishes to half of a seventh part of all its light[d][c][b]; and on the fifteenth day that which remains from the whole is consumed.
translation:
  language: hi
  text: और उसके क्षीण होने के दौरान, पहले दिन उसका प्रकाश घटकर चौदह भागों तक रह जाता है; दूसरे दिन उसका प्रकाश घटकर तेरह भागों तक रह जाता है; तीसरे दिन उसका प्रकाश घटकर बारह भागों तक रह जाता है; चौथे दिन उसका प्रकाश घटकर ग्यारह भागों तक रह जाता है; पाँचवें दिन उसका प्रकाश घटकर दस भागों तक रह जाता है; छठे दिन उसका प्रकाश घटकर नौ भागों तक रह जाता है; सातवें दिन उसका प्रकाश घटकर आठ भागों तक रह जाता है; आठवें दिन उसका प्रकाश घटकर सात भागों तक रह जाता है; नौवें दिन उसका प्रकाश घटकर छह भागों तक रह जाता है; दसवें दिन उसका प्रकाश घटकर पाँच भागों तक रह जाता है; ग्यारहवें दिन उसका प्रकाश घटकर चार भागों तक रह जाता है; बारहवें दिन उसका प्रकाश घटकर तीन भागों तक रह जाता है; तेरहवें दिन उसका प्रकाश घटकर दो भागों तक रह जाता है; और चौदहवें दिन उसका प्रकाश घटकर उसके समूचे प्रकाश के सातवें भाग का आधा रह जाता है[a][b]। फिर पंद्रहवें दिन, समूचे प्रकाश में से जो शेष रहता है, वह समाप्त हो जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ संख्याएँ हर दिन घटाई गई मात्रा नहीं, बल्कि घटने के बाद बचे हुए प्रकाश के भाग बताती हैं।
    reason: व्याकरणिक और गणितीय स्पष्टता
  - marker: b
    text: ‘सातवें भाग का आधा’ मूल गीइज़ की शाब्दिक, यद्यपि गणितीय रूप से असहज, भिन्नात्मक अभिव्यक्ति है।
    reason: शाब्दिक वैकल्पिक अभिव्यक्ति
lexical_decisions:
- source_word: ሕጸጸ / የኀጽጽ
  choice: घटना / घटकर … रह जाना
  rationale: यह शब्द-समूह चंद्रमा के प्रकाश के क्रमिक क्षय को बताता है। संख्याएँ घटाई गई मात्रा नहीं, बल्कि प्रत्येक दिन बची हुई मात्रा दर्शाती हैं; इसलिए ‘घटकर … रह जाता है’ अर्थ को स्पष्ट और गणितीय क्रम को सही रखता है।
- source_word: እደ / ክፍለ
  choice: भाग
  rationale: दोनों पद यहाँ प्रकाश की मापी हुई इकाइयों या हिस्सों के लिए प्रयुक्त हैं। ‘भाग’ सामान्य पाठक के लिए सहज है और गणनात्मक शैली बनाए रखता है।
- source_word: ብርሃኑ / ብርሃን
  choice: उसका प्रकाश / प्रकाश
  rationale: मूल में आकाशीय पिंड के मापे जाने योग्य प्रकाश का सीधा उल्लेख है; ‘प्रकाश’ अनावश्यक काव्यात्मक विस्तार के बिना इसे व्यक्त करता है।
- source_word: መንፈቀ፡ ሳብዐቱ
  choice: सातवें भाग का आधा
  rationale: मूल की गणितीय दृष्टि से असहज भिन्नात्मक अभिव्यक्ति को सहज बनाकर बदलने के बजाय निकटता से सुरक्षित रखा गया है।
- source_word: ይትዌዳእ
  choice: पूरी तरह समाप्त हो जाता है
  rationale: यह ወደአ (‘समाप्त करना, पूरा करना, खपा देना’) से बना रूप है और यहाँ शेष प्रकाश के समाप्त हो जाने को बताता है, न कि उसके दिखाई देने को।
- source_word: ዘተረፈ፡ እምኵሉ
  choice: समूचे प्रकाश में से जो बचा रहता है
  rationale: यह गिनी हुई क्रमिक कमी के बाद बचे अवशेष को सूचित करता है। संदर्भ के कारण ‘प्रकाश’ स्पष्ट रूप से जोड़ा गया है।
theological_decisions:
- issue: संख्यात्मक वर्णन का स्वरूप
  choice: इसे चंद्रमा के घटते प्रकाश का प्रेक्षणात्मक और खगोलीय क्रम माना गया है।
  alternative: संख्याओं को प्रतीकात्मक मानना या पूरे क्रम को केवल ‘प्रकाश घटता जाता है’ कहकर संक्षिप्त करना।
  rationale: मूल पाठ प्रत्येक दिन और शेष भागों की संख्या को सूत्रबद्ध ढंग से दोहराता है। अनुवाद उस प्रत्यक्ष अर्थ और ब्रह्मांड-वर्णन की मापात्मक शैली को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। मूल की दिन-प्रतिदिन दोहराई गई संरचना और संख्यात्मक सटीकता को बनाए रखने के लिए ‘वह घटकर … रह जाता है’ सूत्र को जानबूझकर दोहराया गया है।
