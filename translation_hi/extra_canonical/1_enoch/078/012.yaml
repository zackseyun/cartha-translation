base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/012.yaml
  text: On the first day she is called the new moon[d][c][b][a], because on that day light rises upon her.
translation:
  language: hi
  text: पहले दिन उसे “नवचंद्र”[a] कहा जाता है, क्योंकि उसी दिन उस पर प्रकाश उदित होता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उदयमान चंद्रमा” अथवा “बढ़ता चाँद।” यहाँ चंद्र-मास के आरंभ में चंद्रमा की बढ़ती हुई अवस्था का उल्लेख है।
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: या “क्योंकि उसी दिन उस पर प्रकाश दिखाई देने लगता है।” मूल अभिव्यक्ति चंद्रमा पर प्रकाश के उदित होने की छवि प्रस्तुत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: በቀዳሚት፡ ዕለት
  choice: पहले दिन
  rationale: यह चंद्र-मास के क्रम में निश्चित प्रथम दिन बताने वाला कालवाचक पद है; ‘पहले दिन’ स्वाभाविक और सटीक हिन्दी है।
- source_word: ሠርቀ
  choice: नवचंद्र
  rationale: चंद्र-संबंधी इस पारिभाषिक प्रसंग में शब्द चंद्रमा के आरंभिक उदय अथवा नई अवस्था को सूचित करता है। ‘नवचंद्र’ नामकरण की शैली और पंचांग-संबंधी अर्थ दोनों को संक्षेप में बनाए रखता है; ‘बढ़ता चाँद’ अर्थ का केवल एक पक्ष स्पष्ट करता है।
- source_word: ትሠመይ
  choice: उसे … कहा जाता है
  rationale: मूल में स्त्रीलिंग रूप है, जिसका संदर्भ चंद्रमा से है। हिन्दी में ‘चंद्रमा/चाँद’ पुल्लिंग हैं, इसलिए कर्मवाच्य रचना मूल के नामकरण को सुरक्षित रखते हुए अस्वाभाविक व्याकरणिक टकराव से बचती है।
- source_word: እስመ
  choice: क्योंकि
  rationale: यह पहले कथन में दिए गए नाम का कारण प्रस्तुत करता है।
- source_word: ይትነሣእ፡ ላዕሌሃ፡ ብርሃን
  choice: उस पर प्रकाश उदित होता है
  rationale: यह चंद्रमा पर प्रकाश के ऊपर आने अथवा दिखाई देने की गतिशील छवि को बनाए रखता है। ‘उस पर’ चंद्र-पृष्ठ पर प्रकाश प्रकट होने के प्रसंग में स्वाभाविक है, और मूल में ‘प्रकाश’ अनिश्चित है।
theological_decisions:
- issue: चंद्रमा के लिए मूल का स्त्रीलिंग संकेत
  choice: ‘उसे’ और ‘उस पर’ वाली लिंग-निरपेक्ष हिन्दी संरचना
  alternative: चंद्रमा के लिए स्त्रीलिंग क्रिया या सर्वनाम का प्रयोग
  rationale: गीज़ में क्रिया और सर्वनाम स्त्रीलिंग हैं, पर मानक हिन्दी में ‘चंद्रमा’ और ‘चाँद’ पुल्लिंग हैं। स्त्रीलिंग हिन्दी प्रयोग कृत्रिम होता और संभवतः अनावश्यक मानवीकरण जोड़ता; लिंग-निरपेक्ष संरचना संदर्भ तथा मूल की सजीव चित्रात्मकता को बिना doctrinal विस्तार के सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण खगोलीय-पंचांग संबंधी रूप। ‘अमावस्या’ से परहेज़ किया गया है, क्योंकि वह हिन्दी पाठक के लिए पूर्ण अंधकार वाले दिन का अधिक विशिष्ट बोध करा सकती है, जबकि मूल पद नामकरण और आरंभिक उदय/वृद्धि—दोनों अर्थ-संकेत रखता है।
