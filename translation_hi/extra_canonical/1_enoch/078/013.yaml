base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/013.yaml
  text: 'It is completed with exactness: by day the sun goes down in the west[a], and from the east the moon rises by night and gives light all night, until the sun rises before it[c][b], and the moon is seen before the sun.'
translation:
  language: hi
  text: 'यह क्रम पूरी सटीकता से पूरा होता है: दिन में सूर्य पश्चिम में उतरता है[a], और रात में चंद्रमा पूर्व से ऊपर उठता है और सारी रात प्रकाश देता है, जब तक सूर्य उसके आगे उदय न हो जाए[c][b]; और चंद्रमा सूर्य के आगे दिखाई देता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पूर्व से ... रात में ऊपर उठता है’ वाला वाक्यांश प्रसंग में कठिन है। गीज़ की भाषा का अनुवाद अपेक्षित खगोलीय ढंग के अनुसार सामंजस्य बिठाए बिना, यथासंभव सीधे किया गया है।
    reason: textual_variant
  - marker: b
    text: ‘उदय हो जाए’ के लिए प्रयुक्त क्रिया का रूप पाठ की दृष्टि से अनिश्चित है और संभवतः कठिन पाठ-परंपरा को दर्शाता है। प्रसंग में इसका आशय सूर्य के प्रकट होने या उदय होने से जान पड़ता है।
    reason: lexical_alternative
  - marker: c
    text: 'या: ‘दिन में सूर्य पश्चिम में उतरता है, और रात में वह पूर्व से ऊपर उठता है; और चंद्रमा प्रकाश देता है।’'
    reason: previous_rendering
lexical_decisions:
- source_word: ይትፌጸም
  choice: संपन्न होता है
  rationale: यह निष्क्रिय/आत्मवाचक रूप किसी प्रक्रिया के पूरा होने को दर्शाता है। ‘संपन्न होता है’ खगोलीय क्रम के संदर्भ में स्वाभाविक है और अनावश्यक भविष्यवाणी-संबंधी अर्थ नहीं जोड़ता।
- source_word: ጥንቀቀ
  choice: पूरी सटीकता से
  rationale: यह सावधानी और यथार्थता का क्रियाविशेषणीय भाव देता है; प्रकाशमान पिंडों के व्यवस्थित क्रम में ‘सटीकता’ तकनीकी और पंचांगीय स्वर बनाए रखती है।
- source_word: ይወርድ
  choice: उतरता है
  rationale: मूल अर्थ ‘नीचे उतरना’ है। यह ‘अस्त होता है’ की अपेक्षा स्रोत की स्थानगत छवि को अधिक सीधे सुरक्षित रखता है।
- source_word: ዐረብ
  choice: पश्चिम
  rationale: यहाँ ‘पूर्व’ के साथ दिशात्मक युग्म होने के कारण पश्चिम दिशा का अर्थ उपयुक्त है।
- source_word: ምሥራቅ
  choice: पूर्व
  rationale: यह सूर्य अथवा चंद्रमा के उदय की दिशा को सूचित करने वाला दिशात्मक पद है।
- source_word: የዐርግ
  choice: ऊपर उठता है
  rationale: क्रिया का मूल भाव चढ़ना या ऊपर उठना है। यह आकाशीय गति की ऊर्ध्व छवि को बनाए रखता है; वाक्य में विलंब से आया ‘चंद्रमा’ इसका कर्ता समझा गया है।
- source_word: ያበርህ
  choice: प्रकाश देता है
  rationale: कारक भाव चमकाने या प्रकाश देने की ओर संकेत करता है; ‘प्रकाश देता है’ आधुनिक हिन्दी में स्पष्ट और ठोस है।
- source_word: በኵሉ ሌሊት
  choice: सारी रात
  rationale: यह पूरी रात की अवधि को सहज और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: ይሠርቅ
  choice: उदय हो जाए
  rationale: रूप पाठ की दृष्टि से कठिन है, पर सूर्य के संदर्भ में प्रसंगगत अर्थ उसके प्रकट होने अथवा उदय होने का है। कठिनाई को पादटिप्पणी में दर्ज किया गया है।
- source_word: በቅድሜሁ / በቅድመ
  choice: उसके आगे / सूर्य के आगे
  rationale: ‘आगे’ स्थान और क्रम—दोनों की संभावित अस्पष्टता बनाए रखता है; ‘पहले’ केवल कालगत अर्थ को अनावश्यक रूप से निश्चित कर देता।
- source_word: ይትረአይ
  choice: दिखाई देता है
  rationale: निष्क्रिय/आत्मवाचक दृश्यता की क्रिया का पारदर्शी और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: खगोलीय क्रम की असामान्य या तनावपूर्ण भाषा को सामान्य आधुनिक खगोल-वर्णन में बदलना या स्रोत के अनुसार बनाए रखना
  choice: ‘सूर्य उसके आगे’ और ‘चंद्रमा सूर्य के आगे’ जैसी अभिव्यक्तियों को बिना सामंजस्य बिठाए बनाए रखा गया है।
  alternative: पूरे वाक्य को सूर्यास्त, चांदनी और सूर्योदय के सामान्य क्रम के रूप में स्वतंत्र भावानुवाद करना।
  rationale: स्रोत में स्थानगत और कालगत संबंध पूरी तरह स्पष्ट नहीं हैं। अनुवाद को इस वास्तविक अस्पष्टता को सुरक्षित रखना चाहिए, न कि किसी खगोलीय या व्याख्यात्मक प्रणाली के अनुसार उसे चुपचाप सुलझाना चाहिए।
- issue: የዐርግ का कर्ता
  choice: विलंब से आए ‘चंद्रमा’ को ‘ऊपर उठता है’ और ‘प्रकाश देता है’ दोनों का कर्ता माना गया है।
  alternative: ‘सूर्य’ को ‘रात में पूर्व से ऊपर उठता है’ का कर्ता मानना।
  rationale: गीज़ में कर्ता क्रियाओं की शृंखला के बाद आ सकता है। इस वाक्यरचना तथा दिन/रात के समांतर क्रम के आधार पर ‘चंद्रमा’ बेहतर कर्ता है, यद्यपि पुराने वैकल्पिक पाठ को पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी। शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। खगोलीय वर्णन में स्रोत की पुनरुक्ति और स्थानगत/कालगत अस्पष्टता को अत्यधिक सरल नहीं किया गया। ‘चंद्रमा’ को बोलचाल के ‘चाँद’ पर इसलिए चुना गया है कि पुस्तक के तकनीकी खगोलीय संदर्भ में औपचारिकता और शब्द-संगति बनी रहे।
