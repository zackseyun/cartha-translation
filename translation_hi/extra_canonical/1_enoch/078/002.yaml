theological_decisions:
- issue: ወርኅ का अर्थ ‘चन्द्रमा’ लिया जाए या ‘महीना’
  choice: चन्द्रमा
  alternative: महीना
  rationale: प्रकाशमान खगोलीय पिंडों से संबंधित इस प्रसंग में चार व्यक्तिवाचक नाम उसी पिंड के हैं। फिर भी मूल शब्द की कैलेंडर-संबंधी अर्थ-सीमा को पाद-टिप्पणी में सुरक्षित रखा गया है।
