base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/002.yaml
  text: 'And the moon has four names: the first is Asonya[a], the second Abla, the third Benase[b], and the fourth Erae.'
translation:
  language: hi
  text: 'और चन्द्रमा[a] के चार नाम हैं: पहला असोन्या, दूसरा अब्ला, तीसरा बेनासे[b], और चौथा एराए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ शब्द ወርኅ का अर्थ ‘चन्द्रमा’ या ‘महीना’ हो सकता है। यहाँ ‘चन्द्रमा’ को प्राथमिकता दी गई है, क्योंकि इस पद में उस ज्योति-पिंड के चार नाम बताए गए हैं।
    reason: lexical_alternative
  - marker: b
    text: ये चारों नाम इथियोपिक रूपों के लिप्यंतरण हैं। इनके पीछे के अधिक प्राचीन रूप, यदि कोई थे, अनिश्चित हैं।
    reason: cultural_note
