  choice: पश्चिम के
  rationale: द्वारों की पश्चिमी स्थिति को स्वाभाविक हिन्दी संबंध-वाक्यांश में व्यक्त करता है।
- source_word: የአውዱ
  choice: चक्कर लगाते हुए
  rationale: मूल क्रिया के घूमने या परिक्रामी मार्ग से जाने के भाव को बिना ‘परिक्रमा पूरी करने’ का अतिरिक्त अर्थ जोड़े व्यक्त करता है।
- source_word: እንተ መስዕ
  choice: उत्तर की ओर से
  rationale: यह संक्षिप्त गीइज़ वाक्यांश की मार्ग अथवा उत्तरी ओर से गति की अस्पष्टता को काफी हद तक बनाए रखता है।
- source_word: እንተ ኆዋኅወ ምሥራቅ
  choice: पूर्व के द्वारों से
  rationale: पश्चिमी द्वारों के समानांतर दिशा-संरचना रखता है और अगले निकलने के क्रियापद के साथ स्वाभाविक हिन्दी देता है।
- source_word: ይወፅኡ
  choice: निकलते हैं
  rationale: यह ‘प्रवेश करते हैं’ का स्वाभाविक प्रतिरूप है और द्वारों से बाहर आने की गति स्पष्ट करता है।
- source_word: ዲበ ገጸ ሰማይ
  choice: आकाश के मुख पर
  rationale: मूल की सजीव ब्रह्मांडीय अभिव्यक्ति को ‘आकाश में’ कहकर सपाट करने के बजाय उसकी ठोस छवि सुरक्षित रखी गई है।
