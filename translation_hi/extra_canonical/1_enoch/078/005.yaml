base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/005.yaml
  text: And they set[a], and they enter the western portals, and make their circuit by the north[b], and by the eastern portals they come out upon the face of the sky.
translation:
  language: hi
  text: और वे अस्त होते हैं[a], और पश्चिम के द्वारों में प्रवेश करते हैं; और उत्तर की ओर से चक्कर लगाते हैं[b], और पूर्व के द्वारों से आकाश के फलक पर निकलते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: द्वारों की बार-बार आने वाली यह छवि खगोलीय पुस्तक में आकाश को एक सुव्यवस्थित संरचना के रूप में दर्शाती है, जिसमें निश्चित द्वार हैं और उन्हीं से होकर ज्योतियाँ चलती हैं।
    reason: cultural_note
  - marker: b
    text: जिस वाक्यांश का अनुवाद ‘उत्तर की ओर से चक्कर लगाते हैं’ किया गया है, वह गीइज़ में संक्षिप्त है; उसका अर्थ उत्तरी ओर के चारों तरफ या उसके साथ-साथ चलना भी हो सकता है।
    reason: lexical_alternative
