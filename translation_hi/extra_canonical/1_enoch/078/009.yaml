- source_word: ወቦ፡ አመ
  choice: और एक बार
  rationale: यह पदांश एक अपवाद अथवा किसी एक अवसर को सूचित करता है; ‘और एक बार’ उस संक्षिप्तता को बनाए रखता है।
- source_word: ፭ወሳሙን
  choice: अट्ठाईस दिन
  rationale: प्राप्त पाठ में यह OCR की त्रुटिपूर्ण पहचान मानी गई है; समीक्षित पठन ፳ወ፰ (‘अट्ठाईस’) है और प्रसंग चंद्र-मास की दिनों की संख्या का है।
