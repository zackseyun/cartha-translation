lexical_decisions:
- source_word: አስማቲሁ ለፀሐይ
  choice: सूर्य के नाम
  rationale: बहुवचन ‘नाम’ और सूर्य-संबंधी पदबंध को स्वाभाविक हिन्दी में संबंधकारक के साथ व्यक्त किया गया है।
- source_word: ከመዝ
  choice: ये हैं
  rationale: यह आगे आने वाली सूची का परिचय देने वाला सूत्र है; ‘ये हैं’ स्रोत की संकेतात्मक और गणनात्मक शैली बनाए रखता है।
- source_word: ፩
  choice: एक
  rationale: स्रोत में प्रयुक्त अंक का सीधा अनुवाद है; अगले पद में ‘दूसरा’ आने से क्रम स्पष्ट रहता है।
- source_word: አርያሬስ
  choice: अरयारेस
  rationale: सूर्य का विशिष्ट नाम समझकर इसका अनुवाद नहीं, देवनागरी लिप्यंतरण किया गया है।
- source_word: ካልእ
  choice: दूसरा
  rationale: दो नामों की क्रमबद्ध सूची में यह अनिश्चित ‘अन्य’ नहीं, दूसरे नाम को सूचित करता है।
- source_word: ቶማስ
  choice: तोमास
  rationale: गीज़ रूप का देवनागरी लिप्यंतरण किया गया है; परिचित ‘थोमा’ जैसे रूप से बाद की असंबद्ध पहचान आरोपित नहीं की गई।
theological_decisions:
- issue: सूर्य के रहस्यमय नामों को परिचित अथवा अर्थानुवादित रूप देना
  choice: दोनों नामों को लिप्यंतरित विशिष्ट नामों के रूप में रखना
  alternative: नामों का अनुमानित व्युत्पत्तिपरक अनुवाद करना अथवा तोमास को किसी परिचित बाइबलीय नाम के रूप में सामान्यीकृत करना
  rationale: यह पद अपोकैलिप्टिक ब्रह्मांड-विज्ञान में सूर्य के गूढ़ नाम देता है। लिप्यंतरण पाठ की विशिष्टता और अनिश्चितता सुरक्षित रखता है तथा बाद की धार्मिक संबद्धताएँ आरोपित नहीं करता।
