base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/003.yaml
  text: These are the two great luminaries[a]; their disks are like the disk of heaven[b], and the size of the disks of the two of them is equal.
translation:
  language: hi
  text: ये ही वे दो महान ज्योतियाँ हैं; उनके मंडल आकाश के मंडल के समान हैं[b], और उन दोनों के मंडलों का माप समान है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम वाक्यांश कठिन है। गीइज़ पाठ का आशय संभवतः यह है कि दोनों ज्योतियों के मंडलों का मापा हुआ विस्तार ‘समान’ या ‘एक-सा’ है। अधिक शाब्दिक अनुवाद हो सकता है: ‘और उनके मंडल का माप, उन दोनों के लिए, एक-सा है।’'
    reason: lexical_alternative
  - marker: b
    text: या, ‘उनके घेरे आकाश के घेरे के समान हैं।’ मूल शब्द का अर्थ ‘मंडल,’ ‘घेरा,’ ‘परिधि’ या संदर्भानुसार ‘चकती’ हो सकता है।
    reason: previous_rendering
lexical_decisions:
- source_word: ብርሃናት
  choice: ज्योतियाँ
  rationale: यह शब्द खगोलीय प्रकाश देने वाले पिंडों को सूचित करता है। ‘ज्योतियाँ’ आधुनिक हिन्दी में स्वाभाविक होने के साथ पाठ की गरिमा और ब्रह्मांड-विषयक भाव बनाए रखता है।
- source_word: ዐበይት
  choice: महान
  rationale: दोनों खगोलीय ज्योतियों के लिए यह आकार और महत्त्व का ऊँचा वर्णन देता है, पर ‘शक्तिशाली’ जैसा अनावश्यक अर्थ नहीं जोड़ता।
- source_word: ክበቦሙ
  choice: उनके मंडल
  rationale: मूल शब्द गोल आकार, घेरा या परिधि का बोध करा सकता है। ‘मंडल’ दृश्य खगोलीय चक्र का अर्थ देता है और आधुनिक वैज्ञानिक ‘कक्षा’ थोपने से बचता है।
- source_word: ከመ ክበበ ሰማይ
  choice: आकाश के मंडल के समान
  rationale: ከመ को तुलना के रूप में लिया गया है। दोहराए गए गोलाकार बिंब को ‘मंडल’ की पुनरावृत्ति से सुरक्षित रखा गया है।
- source_word: ወእምጣነ
  choice: और … का माप
  rationale: यह पद नाप या विस्तार को सूचित करता है। ‘माप’ मूल की मापन-संबंधी धारणा को ‘आकार’ की अपेक्षा अधिक प्रत्यक्ष रूप से रखता है।
- source_word: ለክልኤሆሙ ዕሩይ
  choice: उन दोनों … समान है
  rationale: समापन को दोनों ज्योतियों के माप की समानता के रूप में प्रस्तुत किया गया है, जबकि इसकी शाब्दिक कठिनाई पादटिप्पणी में स्पष्ट की गई है।
