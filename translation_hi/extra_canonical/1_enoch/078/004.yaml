base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/004.yaml
  text: In the disk of the sun there are seven portions of light which are added to it beyond the moon[e][d][c][b][a], and in measure they are added until the seventh portion of the sun is completed.
translation:
  language: hi
  text: सूर्य के मंडल में प्रकाश के सात भाग हैं, जो उसमें चन्द्रमा से अधिक जोड़े जाते हैं[a]; और वे माप के अनुसार जोड़े जाते हैं, जब तक सूर्य का सातवाँ भाग पूरा न हो जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीइज़ वाक्य-विन्यास कठिन है। सम्भवतः आशय यह है कि सूर्य का प्रकाश चन्द्रमा से सात मापे हुए भाग अधिक है। आरम्भिक शब्दों का अनुवाद ‘सूर्य के चक्र में’ भी हो सकता है; और अंतिम वाक्यांश का अर्थ ‘जब तक सूर्य का सातवाँ भाग पार न हो जाए’ भी सम्भव है।
    reason: textual_variant
lexical_decisions:
- source_word: በክበበ፡ ፀሐይ
  choice: सूर्य के मंडल में
  rationale: ክበብ वृत्त, गोलाकार मंडल या चक्र को सूचित कर सकता है। इस प्रसंग में प्रकाश के भाग सूर्य में होने की बात है, इसलिए आधुनिक कक्षीय अर्थ से बचते हुए भौतिक गोलाकार पिंड का संकेत देने वाला ‘मंडल’ चुना गया।
- source_word: ሰብዓቱ፡ ክፍለ፡ ብርሃን
  choice: प्रकाश के सात भाग
  rationale: शाब्दिक, पर स्वाभाविक हिन्दी; यह ग्रंथ की मापात्मक और योजनाबद्ध खगोलीय भाषा बनाए रखता है।
- source_word: ዘይትዌሰክ፡ ቦቱ
  choice: उसमें अधिक जोड़े जाते हैं
  rationale: क्रिया का बढ़ने अथवा जोड़े जाने का भाव सुरक्षित रखा गया है; सर्वनाम को सूर्य से सम्बद्ध माना गया है। ‘अधिक’ अगले तुलनात्मक पद के साथ स्वाभाविक हिन्दी बनाता है।
- source_word: እምወርኅ
  choice: चन्द्रमा की अपेक्षा
  rationale: እም स्रोत अथवा तुलना दोनों व्यक्त कर सकता है। प्रसंग में सूर्य और चन्द्रमा के प्रकाश की तुलना सम्भावित है; अतः ‘की अपेक्षा’ तुलनात्मक अर्थ देता है, जबकि कठिन वाक्य-विन्यास को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ወመስፈርት፡ ትትወደይ
  choice: और वे माप के अनुसार तब तक बढ़ते जाते हैं
  rationale: መስፈርት का नियत माप का भाव और क्रिया का क्रमिक वृद्धि-सूचक अर्थ सहज हिन्दी में रखा गया है।
- source_word: እስከ፡ የሐልፍ፡ ሳብዕ፡ ክፍለ፡ ፀሐይ
  choice: जब तक सूर्य का सातवाँ भाग पूरा न हो जाता
  rationale: ሳብዕ को भिन्न ‘एक-सातवाँ’ नहीं, बल्कि क्रमवाचक ‘सातवाँ’ माना गया है। የሐልፍ मूलतः पार होने या आगे निकलने का भाव भी दे सकता है, पर प्रसंग में सातवें चरण तक पहुँचने के लिए ‘पूरा’ पठनीय है; विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: पद के ब्रह्माण्ड-वर्णन का स्वरूप
  choice: इसे प्रकाशमान पिंडों और उनके माप का प्राचीन, योजनाबद्ध खगोलीय वर्णन रहने दिया गया है।
  alternative: इसे प्रतीकात्मक शिक्षा मानना या आधुनिक खगोल-विज्ञान की शब्दावली में बदल देना।
  rationale: हनोक का खगोलीय खंड माप और क्रम के द्वारा आकाशीय घटनाओं का वर्णन करता है। अनुवाद न इसे रूपक घोषित करता है, न आधुनिक वैज्ञानिक प्रतिरूप में ढालता है।
- issue: कठिन तुलनात्मक वाक्य-विन्यास
  choice: मुख्य पाठ में सूर्य का प्रकाश चन्द्रमा से अधिक होने का सम्भावित अर्थ रखा गया है और अनिश्चितता पादटिप्पणी में बताई गई है।
  alternative: प्रकाश को चन्द्रमा से सूर्य में आने वाला बताना, या तुलना को निश्चित गणितीय अनुपात के रूप में प्रस्तुत करना।
  rationale: እም स्रोत और तुलना दोनों का बोध करा सकता है; उपलब्ध गीइज़ वाक्य-विन्यास निर्णायक नहीं है, इसलिए सम्भावित अर्थ को बिना अति-निश्चय के प्रस्तुत किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और वर्णनात्मक रूप अपनाया गया है। ‘मंडल’, ‘प्रकाश के सात भाग’ और ‘माप के अनुसार’ जैसे पद प्राचीन खगोलीय कल्पना को बनाए रखते हैं, पर अनावश्यक संस्कृतनिष्ठता और आधुनिक वैज्ञानिक शब्दावली से बचते हैं।
