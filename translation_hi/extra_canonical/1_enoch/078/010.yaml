base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/010.yaml
  text: 'And Uriel showed me another law: when light is transferred into the moon[c][b][a], and from where it is transferred from the sun.'
translation:
  language: hi
  text: और ऊरीएल ने मुझे एक और नियम[a] दिखाया—जब प्रकाश चन्द्रमा में पहुँचाया जाता है[b], और सूर्य की किस ओर से पहुँचाया जाता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एक और व्यवस्था’ अथवा ‘एक और विधान’। मूल शब्द ब्रह्माण्ड के निश्चित क्रम या स्थापित नियम को भी व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल वाक्य संक्षिप्त और कुछ असहज है। आशय उस नियम से है जिसके अनुसार चन्द्रमा सूर्य से प्रकाश प्राप्त करता है।
    reason: alternative_reading
  - marker: c
    text: ‘किस ओर से’ का अर्थ स्थान या दिशा के संबंध में है। मूल शब्द ‘कहाँ से’ का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልእት
  choice: एक और
  rationale: यह क्रम में बताई जा रही एक अतिरिक्त खगोलीय व्यवस्था को सूचित करता है; आधुनिक हिन्दी में ‘एक और’ स्वाभाविक है।
- source_word: ሥርዓተ
  choice: नियम
  rationale: यह शब्द ब्रह्माण्ड में स्थापित क्रम, विधान या निश्चित व्यवस्था का बोध करा सकता है। ‘नियम’ उसकी विधिसंगत और खगोलीय दोनों छटाएँ सँभालता है।
- source_word: አርአየኒ
  choice: मुझे ... दिखाया
  rationale: दर्शन-वृत्तान्त के सीधे अर्थ को रखता है और अनावश्यक रूप से ‘प्रकट किया’ जैसी धार्मिक व्याख्या नहीं जोड़ता।
- source_word: ይትወደይ
  choice: पहुँचाया जाता है
  rationale: निष्क्रिय रूप में एक ज्योति-पिंड से दूसरे तक प्रकाश के पहुँचने या स्थानांतरित होने का भाव है। यह हिन्दी में ‘स्थानांतरित किया जाता है’ से अधिक सहज है, जबकि निष्क्रियता बनाए रखता है।
- source_word: ብርሃን
  choice: प्रकाश
  rationale: यह ज्योति का सामान्य और प्रसंगानुकूल हिन्दी शब्द है।
- source_word: ውስተ፡ ወርኅ
  choice: चन्द्रमा में
  rationale: पूर्वसर्ग गति की दिशा को चन्द्रमा के भीतर या उसकी ओर बताता है; क्रिया के साथ ‘चन्द्रमा में पहुँचाया जाता है’ यह दिशा व्यक्त करती है।
- source_word: እምኀበ
  choice: कहाँ से
  rationale: मूल पद स्रोत-स्थान को दर्शाता है और प्रसंग में ‘किस ओर से’ का स्थानिक भाव भी संभव है। मुख्य पाठ में कम व्याख्यात्मक ‘कहाँ से’ रखा गया है।
- source_word: እምፀሐይ
  choice: सूर्य से
  rationale: यह सूर्य को उस स्रोत के रूप में पहचानता है जहाँ से चन्द्रमा का प्रकाश पहुँचता है।
theological_decisions:
- issue: चन्द्रमा के प्रकाश की प्रकृति
  choice: पद चन्द्रमा के प्रकाश को सूर्य से उस तक पहुँचाया गया प्रकाश बताता है।
  alternative: पद सूर्य और चन्द्रमा के प्रकाश के बीच केवल संबंध बता सकता है, या इसके पीछे कोई अधिक तकनीकी प्राचीन खगोलीय अर्थ हो सकता है।
  rationale: ‘प्रकाश’, ‘चन्द्रमा में’, ‘सूर्य से’ और दोहराई गई निष्क्रिय क्रिया मिलकर व्युत्पन्न चन्द्रप्रकाश का संकेत देते हैं। इसे बाद की धार्मिक प्रतीकात्मकता से नहीं जोड़ा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। मूल की संक्षिप्त और दोहरावयुक्त रचना को पूरी तरह सुचारु बनाकर उसकी वास्तविक अस्पष्टता मिटाई नहीं गई; आवश्यक विकल्प पादटिप्पणियों में दिए गए हैं।
