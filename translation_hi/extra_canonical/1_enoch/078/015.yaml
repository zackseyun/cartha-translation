base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/015.yaml
  text: And it makes three months of thirty days[a], and in its season[d][c][b], when its waning occurs.
translation:
  language: hi
  text: और वह तीस-तीस दिनों वाले तीन महीने बनाता है; और अपने नियत समय में[a], जब वह घटता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने समयों में” अथवा “अपनी ऋतुओं में।” गीइज़ शब्द समय, नियत काल या ऋतु का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम उपवाक्य कठिन है। इसे “जब वह क्षीण होता है” भी अनुवाद किया जा सकता है। कुछ व्याख्याओं में इसका संबंध उसकी व्यवस्था या गणना के पूर्ण होने से जोड़ा जाता है।
    reason: textual_difficulty
lexical_decisions:
- source_word: ሠለስተ፡ ወርኀ
  choice: तीन महीनों को
  rationale: संख्या के साथ ወርኀ का अर्थ ‘तीन महीने’ है। इसे कर्म के रूप में रखा गया है, क्योंकि एकवचन क्रिया का कर्ता प्रसंग में उल्लिखित ज्योति-पिंड या चक्र है।
- source_word: ይገብር
  choice: वह ... बनाता है
  rationale: यह तीसरे पुरुष की पुल्लिंग एकवचन क्रिया है और मूलतः ‘करना/बनाना’ व्यक्त करती है। हिंदी में एकवचन कर्ता को स्पष्ट रखने के लिए ‘वह’ जोड़ा गया है।
- source_word: ፴መዋዕለ
  choice: तीस-तीस दिन का
  rationale: शाब्दिक अर्थ ‘तीस दिन’ है; तीन महीनों में प्रत्येक की अवधि समझाने के लिए हिंदी में वितरणार्थक ‘तीस-तीस’ स्वाभाविक और सुस्पष्ट है।
- source_word: በአዝማነ፡ ዚአሁ
  choice: अपने नियत समय में
  rationale: አዝማን समय, अवसर या ऋतु/नियत काल को सूचित कर सकता है। ‘नियत समय’ खगोलीय-पंचांगीय संदर्भ को बनाए रखता है, जबकि विकल्प पादटिप्पणी में दिया गया है।
- source_word: ሶበ
  choice: जब
  rationale: यह कालवाचक संयोजक है और अगले कठिन उपवाक्य को प्रस्तुत करता है।
- source_word: ታኀጻጺተ፡ ዚአሁ
  choice: जब उसकी गणना पूरी होती है
  rationale: दुर्बोध रूप को खगोलीय गणना या लेखे के पूर्ण होने के तकनीकी अर्थ में लिया गया है। अनिश्चितता को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: दुर्बोध अंतिम पंचांगीय उपवाक्य
  choice: इसे ‘जब उसकी गणना पूरी होती है’ के रूप में तकनीकी पंचांगीय कथन रखा गया है।
  alternative: ‘जब उसकी व्यवस्था पूरी होती है’ या ‘जब उसका घटना पूरा होता है।’
  rationale: हनोक के खगोलीय खंड में गणना और काल-व्यवस्था प्रमुख हैं। फिर भी गीइज़ रूप कठिन है, इसलिए मुख्य पाठ में एक संभावित तकनीकी अर्थ और पादटिप्पणी में अन्य संभावनाएँ दी गई हैं; किसी धार्मिक मत के अनुसार अर्थ निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। एकवचन क्रिया के कारण अप्रकट कर्ता को ‘वह’ से स्पष्ट किया गया है। ‘तीस-तीस’ वितरणार्थक है और हर महीने की तीस दिन की अवधि को स्वाभाविक हिंदी में व्यक्त करता है। स्रोत की अंतिम पंक्ति की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
