  yaml_path: translation/extra_canonical/1_enoch/078/006.yaml
  text: And when the moon rises[a], it appears in the sky as half of a seventh part[c][b], [and all the light is in it,] and it completes its light as fourteen parts.
translation:
  language: hi
  text: और जब चन्द्रमा उदय होता है, तब वह आकाश में सातवें भाग के आधे जितना दिखाई देता है; [और समस्त प्रकाश उसमें है][a], और वह अपने प्रकाश को चौदह भागों की मात्रा तक पूर्ण करता है[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: साक्ष्य में यह उपवाक्य कोष्ठकों में है और इसकी गीइज़ वाक्य-रचना कुछ कठिन है; इसका आशय प्रतीत होता है कि इस गणना में समस्त प्रकाश चन्द्रमा में विद्यमान है।
    reason: textual_variant
  - marker: b
    text: खगोलीय पुस्तक में चन्द्रमा के प्रकाश को नियमित रूप से गिने हुए ‘भागों’ में मापा गया है। ‘चौदह भाग’ को इसी योजनाबद्ध प्रणाली के भीतर समझना चाहिए, आधुनिक वैज्ञानिक वर्णन के रूप में नहीं।
    reason: cultural_note
  - marker: c
    text: या, “और उसका समस्त प्रकाश चौदह भागों की मात्रा तक पूर्ण होता है।”
    reason: previous_rendering
lexical_decisions:
- source_word: ይትነሣእ
  choice: उदय होता है
  rationale: ज्योति-पिंड के ऊपर आने या प्रकट होने के लिए आधुनिक हिन्दी में यह स्वाभाविक खगोलीय अभिव्यक्ति है।
- source_word: ወርኅ
  choice: चन्द्रमा
  rationale: दृश्य रूप और प्रकाश के इस प्रसंग में शब्द का अर्थ ‘महीना’ नहीं, चन्द्रमा है।
- source_word: ያስተርኢ በሰማይ
  choice: आकाश में ... दिखाई देता है
  rationale: यह गीइज़ के दृश्य और प्रेक्षणात्मक भाव को सहज हिन्दी में बनाए रखता है।
- source_word: መንፈቀ ሳብዕተ እደ
  choice: सातवें भाग के आधे जितना
  rationale: यह खगोलीय पुस्तक की संख्यात्मक योजना को सुरक्षित रखते हुए हिन्दी में तुलना को स्वाभाविक बनाता है; इसे आधुनिक वैज्ञानिक भिन्न में नहीं बदला गया।
- source_word: ብርሃን
  choice: प्रकाश
  rationale: यह चन्द्रमा की दिखाई देने वाली ज्योति के लिए सरल, ठोस और प्रसंगानुकूल शब्द है।
- source_word: ኵሉ
  choice: समस्त
  rationale: यह मूल में व्यक्त सम्पूर्णता को बनाए रखता है और वाक्य के गरिमापूर्ण स्तर के अनुकूल है।
- source_word: ከመ ዐሡር ወረቡዕ
  choice: चौदह भागों तक
  rationale: मूल में दी गई चौदह की संख्या को सुरक्षित रखते हुए निहित माप-इकाई ‘भाग’ को प्रसंग से स्पष्ट किया गया है।
- source_word: ይፈጽም ብርሃኖ
  choice: अपने प्रकाश को ... पूर्ण करता है
  rationale: यह क्रिया के पूर्णता तक पहुँचाने वाले प्रक्रियात्मक भाव को बनाए रखता है, बिना इसे केवल ‘पूर्णिमा’ कहकर व्याख्यायित किए।
theological_decisions:
- issue: सामान्य चन्द्र-कला की भाषा अपनाई जाए या खगोलीय पुस्तक की संख्यात्मक प्रकाश-गणना सुरक्षित रखी जाए
  choice: ‘सातवें भाग के आधे’ और ‘चौदह भागों’ वाली संख्यात्मक गणना सुरक्षित रखी गई।
  alternative: इसे ‘आधा प्रकाशित’ या ‘पूर्ण प्रकाश’ जैसी सामान्य चन्द्र-कला की भाषा में रूपान्तरित करना।
  rationale: यह अंश ज्योति-पिंडों की गति और प्रकाश का योजनाबद्ध, संख्यात्मक वर्णन करता है। मूल की ब्रह्माण्ड-विषयक रूपरेखा को आधुनिक खगोल-विज्ञान या किसी धार्मिक व्याख्या के अनुसार सरल नहीं किया गया।
- issue: कोष्ठकबद्ध पाठ को अंतिम वाक्य में मिला दिया जाए या अलग उपवाक्य के रूप में रखा जाए
  choice: ‘[और उसमें समस्त प्रकाश होता है]’ को अलग उपवाक्य के रूप में रखा गया।
  alternative: इसे अगले उपवाक्य में मिलाकर केवल ‘उसका समस्त प्रकाश पूर्ण होता है’ कहना।
  rationale: साक्ष्य में कोष्ठकबद्ध वाक्यांश और प्रकाश पूरा करने वाला अंतिम उपवाक्य अलग हैं; उन्हें मिलाने से मूल का एक कथन लुप्त हो जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किन्तु गरिमापूर्ण शैली रखी गई है। तकनीकी-संख्यात्मक विचित्रता को सहज बनाने के नाम पर हटाया नहीं गया। ‘चन्द्रमा’ और ‘प्रकाश’ सामान्य पाठकों के लिए स्पष्ट हैं; मूल साक्ष्य के कोष्ठक भी बनाए रखे गए हैं।
