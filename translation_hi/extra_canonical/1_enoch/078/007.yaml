  yaml_path: translation/extra_canonical/1_enoch/078/007.yaml
  text: And fifteen parts of light are added within it until the fifteenth day[a]; and its light is completed as a sign of the year, and it becomes fifteen parts[c][b], and the moon comes into being by half of a seventh part.
translation:
  language: hi
  text: और उसमें प्रकाश के पंद्रह भाग पंद्रहवें दिन तक जुड़ते जाते हैं[a]; तब वर्ष के चिह्न के रूप में उसका प्रकाश पूरा हो जाता है, और वह पंद्रह भाग हो जाता है[b]; और चंद्रमा सातवें भाग के आधे से बनता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इथियोपिक में केवल ‘पंद्रह तक’ है; प्रसंग के आधार पर ‘दिन’ स्पष्ट किया गया है।
    reason: textual_variant
  - marker: b
    text: दोहराया गया ‘पंद्रह’ संभवतः चंद्रमा के प्रकाश के पंद्रह भागों की तकनीकी गणना को दर्शाता है, केवल तिथि को नहीं।
    reason: cultural_note
  - marker: c
    text: अर्थात सातवें भाग का आधा, या 1/14 भाग—चंद्रमा के प्रकाश की प्रतिदिन की वृद्धि की मात्रा। इथियोपिक वाक्यांश कठिन है; पुराने अनुवाद इसे ‘सातवें भाग में अपने आधे तक पहुँचता है’ भी समझते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: ፲ትኅምስት
  choice: पंद्रह भाग
  rationale: मूल में संख्या ‘पंद्रह’ है; चंद्र-प्रकाश की गणना के संदर्भ में ‘भाग’ निहित है और इसे स्पष्ट करना स्वाभाविक है।
- source_word: ብርሃን
  choice: प्रकाश
  rationale: यहाँ शब्द चंद्रमा के दिखाई देने वाले प्रकाश को दर्शाता है, न कि स्वयं ज्योति-पिंड को।
- source_word: ይትወደደ
  choice: जुड़ते जाते हैं
  rationale: यह चंद्र-प्रकाश में क्रमिक वृद्धि का भाव व्यक्त करता है और गिने हुए भागों की तकनीकी छवि बनाए रखता है।
- source_word: ውስቴታ
  choice: उसमें
  rationale: स्त्रीलिंग प्रत्यय संदर्भ में चंद्रमा/चंद्र-चक्र की ओर संकेत करता है; हिन्दी में ‘उसमें’ सहज और पर्याप्त रूप से शाब्दिक है।
- source_word: እስከ ዐሡር ወኃሙስ
  choice: पंद्रहवें दिन तक
  rationale: शाब्दिक संख्या ‘दस और पाँच’ है; बढ़ते चंद्र-प्रकाश के प्रसंग में यह पंद्रहवें दिन तक पहुँचने का समयगत संकेत है।
- source_word: ይትፈጸም
  choice: पूरा हो जाता है
  rationale: क्रिया पूर्ण मात्रा तक पहुँचने को व्यक्त करती है; खगोलीय संदर्भ में यह स्वाभाविक हिन्दी है।
- source_word: ብርሃነ ዚአሁ
  choice: उसका प्रकाश
  rationale: सर्वनाम उसी चंद्रमा के प्रकाश की ओर लौटता है जिसकी वृद्धि का वर्णन हो रहा है।
- source_word: ለትእምርተ ዓመት
  choice: वर्ष के चिह्न के रूप में
  rationale: यह वाक्यांश चंद्र-प्रकाश की पूर्णता के पंचांगीय कार्य को दर्शाता है; ‘चिह्न’ मूल की व्यापकता को बनाए रखता है।
- source_word: ወይከውን ለ፲፲ትኅምስት
  choice: और वह पंद्रह भाग हो जाता है
  rationale: कठिन वाक्य-विन्यास पूर्ण गिनी हुई मात्रा को दोहराता प्रतीत होता है; ‘भाग’ निकटवर्ती तकनीकी संदर्भ से पूरित है।
- source_word: ወርኅ
  choice: चंद्रमा
  rationale: इस चरण-वर्णन में शब्द का आशय मास की अपेक्षा उस चंद्रमा से है जिसका प्रकाश प्रतिदिन बढ़ता है।
- source_word: በመንፈቀ ሳብዕ እደ
  choice: सातवें भाग के आधे के अनुसार
  rationale: वाक्यांश दैनिक वृद्धि की मात्रा, अर्थात सातवें भाग के आधे (1/14), को सूचित करता है। ‘के अनुसार’ करण/मात्रा के अर्थ को हिन्दी में स्पष्ट करता है, जबकि कठिन मूल को अनावश्यक रूप से नहीं सुलझाता।
theological_decisions:
- issue: पूर्ण चंद्र-प्रकाश का पंचांगीय कार्य
  choice: वर्ष के चिह्न के रूप में
  alternative: वर्ष के शकुन के रूप में
  rationale: खगोलीय पुस्तक में ज्योतियों का वर्णन मुख्यतः समय और वर्ष की व्यवस्था के संदर्भ में है। ‘चिह्न’ पंचांगीय अर्थ को रखता है और अनावश्यक शकुनवादी या रूपकात्मक अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध खगोलीय भाषा रखी गई है। ‘प्रकाश’, ‘भाग’ और ‘चिह्न’ जैसे सामान्य शब्द तकनीकी गणना को स्पष्ट रखते हैं; कठिन अंतिम खंड की वास्तविक अनिश्चितता पादटिप्पणी में सुरक्षित है।
