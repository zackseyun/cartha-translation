base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/011.yaml
  text: And throughout the time when the moon is waning[a], it diminishes its light before the sun until fourteen days [its light is completed]; and when it is extinguished[d][c][b], all its light is completed in the sky.
translation:
  language: hi
  text: और चंद्रमा के घटने के पूरे समय में वह चौदह दिनों तक सूर्य के सामने अपना प्रकाश रखता है[a]—[उसका प्रकाश पूर्ण होता है][b]; और जब वह बुझ जाता है[c], तब उसका सारा प्रकाश आकाश में समाप्त हो जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल क्रिया का अर्थ यहाँ “रखना” या “स्थापित करना” है। कुछ अनुवाद संदर्भ के आधार पर “अपना प्रकाश घटाता है” या “प्रकाश सौंपता है” कहते हैं। “सूर्य के सामने” का अर्थ “सूर्य की उपस्थिति में” या “सूर्य के सापेक्ष” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: वर्ग कोष्ठकों के शब्द पाठ में अनिश्चित हैं। मूल में “उसका प्रकाश” ही “पूर्ण होता है”; यह क्रिया “चौदह दिनों” पर लागू नहीं होती।
    reason: textual_variant
  - marker: c
    text: इस क्रिया का पाठ और अर्थ कठिन है। उपलब्ध पाठ और संदर्भ में इसका अर्थ चंद्रमा के बुझने या निष्प्रभ होने से समझा जाता है; कुछ अनुवाद इसे “अंधकारमय हो जाता है” कहते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሎ፡ ዘመነ፡
  choice: पूरे समय में
  rationale: यह पदबंध किसी एक क्षण के बजाय समूची अवधि को सूचित करता है।
- source_word: ዘተነሡር፡ ወርኅ፡
  choice: चंद्रमा के घटने
  rationale: उपलब्ध पद-विभाजन इसे चंद्रमा की घटती अवस्था से जोड़ता है; फिर भी निकटवर्ती खगोलीय वर्णन के कारण पाठगत कठिनाई बनी रहती है।
- source_word: ብርሃነ፡ ዚአሃ፡ ትወዲ፡
  choice: अपना प्रकाश रखता है
  rationale: ትወዲ को ‘रखना/स्थापित करना’ के अर्थ में लिया गया है। इससे मूल की क्रिया सुरक्षित रहती है और उसे बिना पर्याप्त आधार ‘घटाता है’ नहीं बनाया जाता।
- source_word: በቅድመ፡ ፀሐይ፡
  choice: सूर्य के सामने
  rationale: शाब्दिक स्थान-संबंध को रखा गया है; इसका अर्थ सूर्य की उपस्थिति में या उसके सापेक्ष भी हो सकता है।
- source_word: እስከ፡ ፲ወ፬መዋዕል፡
  choice: चौदह दिनों तक
  rationale: यह चंद्र-प्रक्रिया की अवधि बताता है।
- source_word: '[ይትፌጸም፡ ብርሃና፡]'
  choice: '[उसका प्रकाश पूर्ण होता है]'
  rationale: कोष्ठकित इथियोपिक शब्दों का कर्ता ‘उसका प्रकाश’ है, ‘चौदह दिन’ नहीं; वर्ग कोष्ठक पाठ की अनिश्चित स्थिति दिखाते हैं।
- source_word: ወሶበ፡ ይውዒ፡
  choice: और जब वह पूरी तरह प्रकाशित होता है
  rationale: संदर्भ में यह चंद्रमा के पूर्ण प्रकाशित होने की अवस्था बताता प्रतीत होता है; मुख्य पाठ में सहज हिन्दी दी गई और वैकल्पिक पाठ टिप्पणी में रखा गया है।
- source_word: ኵሉ፡ ይትፌጸም፡ ብርሃኑ፡ ውስተ፡ ሰማይ።
  choice: तब उसका प्रकाश आकाश में पूर्ण हो जाता है
  rationale: ‘पूर्ण होना’ की योजनाबद्ध खगोलीय भाषा और दृश्य आकाश का संदर्भ दोनों सुरक्षित रखे गए हैं।
theological_decisions:
- issue: चंद्रमा के प्रकाश की क्रिया को आधुनिक खगोलीय व्याख्या में बदलना या प्राचीन ब्रह्मांडीय चित्रण बनाए रखना
  choice: अपना प्रकाश रखता है
  alternative: अपना प्रकाश घटाता है / अपना प्रकाश सूर्य को सौंपता है
  rationale: मूल क्रिया ‘रखने/स्थापित करने’ की दिशा में है। यह चयन प्राचीन ब्रह्मांडीय भाषा को आधुनिक वैज्ञानिक कथन में बदलने या प्रकाश के हस्तांतरण की दिशा निश्चित करने से बचता है।
- issue: अंतिम अवस्था को ‘बुझना’ या ‘प्रकाशित होना’ मानना
  choice: पूरी तरह प्रकाशित होता है
  alternative: बुझ जाता है / अंधकारमय हो जाता है
  rationale: वाक्य के अगले भाग में प्रकाश के पूर्ण होने का उल्लेख है, इसलिए प्रकाशित होने का अर्थ संदर्भ से अधिक सुसंगत है; पाठगत विकल्प टिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। प्राचीन खगोलीय वर्णन को आधुनिक वैज्ञानिक शब्दावली में नहीं बदला गया। चंद्रमा के लिए हिन्दी व्याकरणानुसार पुल्लिंग सर्वनाम रखा गया है। सभी पाठगत और शब्दार्थगत अनिश्चितताओं को टिप्पणियों में स्पष्ट किया गया है।
