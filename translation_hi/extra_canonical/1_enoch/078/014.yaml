base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/014.yaml
  text: From where the light comes to the moon, from there again it wanes until all the light is finished, and the days of the month pass, and its disk remains empty, without light.
translation:
  language: hi
  text: जहाँ से चाँद को प्रकाश मिलता है, वहीं से वह फिर घटता है, जब तक कि सारा प्रकाश समाप्त नहीं हो जाता; और महीने के दिन बीतते हैं, और उसका मंडल प्रकाश से रहित और खाली रह जाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “मंडल” का अनुवाद “वृत्त” या “गोलाकार रूप” भी किया जा सकता है; आशय चाँद की अँधेरी रह गई गोल दृश्य आकृति से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እምኀበ ... እምህየ
  choice: जहाँ से ... वहीं से
  rationale: स्रोत के संबंधवाचक–संकेतवाचक विन्यास को सुरक्षित रखता है और बताता है कि जिस ओर से चाँद को प्रकाश मिलता है, उसी ओर से उसका घटना आरम्भ होता है।
- source_word: ይመጽእ ብርሃን ለወርኅ
  choice: चाँद को प्रकाश मिलता है
  rationale: शाब्दिक गति-वाचक अर्थ ‘प्रकाश चाँद के पास आता है’ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना प्रकाश की वैज्ञानिक क्रिया को आधुनिक शब्दों में समझाए।
- source_word: ካዕበ የሐፅፅ
  choice: वह फिर घटने लगता है
  rationale: चंद्रकलाओं के संदर्भ में የሐፅፅ का स्वाभाविक हिन्दी समतुल्य ‘घटना’ है; ‘फिर’ चक्र के अगले चरण को बनाए रखता है।
- source_word: እስከ ይትዌዳእ ኵሉ ብርሃን
  choice: जब तक कि सारा प्रकाश समाप्त न हो जाए
  rationale: घटने की प्रक्रिया की पूर्णता को औपचारिक परंतु सहज हिन्दी में व्यक्त करता है।
- source_word: ወየኀልፍ መዋዕለ ወርኅ
  choice: और महीने के दिन बीत न जाएँ
  rationale: ወርኅ के ‘महीना/चाँद’ अर्थों में यहाँ कालगत ‘महीना’ मासिक चक्र के वर्णन में सर्वाधिक उपयुक्त है।
- source_word: ወይነብር ክበቡ ባክ ዘእንበለ ብርሃን
  choice: तब उसका मंडल प्रकाश से रहित, खाली रह जाता है
  rationale: ክበቡ की गोल दृश्य आकृति को ‘मंडल’ और ባክ की रिक्तता को ‘खाली’ से व्यक्त करता है; ‘प्रकाश से रहित’ स्रोत की स्पष्ट पुनरुक्ति सुरक्षित रखता है।
theological_decisions:
- issue: चंद्रमा के प्रकाश के वर्णन का स्वरूप
  choice: इसे चाँद के प्रकाश पाने और खोने का प्रेक्षणात्मक खगोलीय वर्णन रखा गया है।
  alternative: इसे प्रतीकात्मक या स्वर्गदूतीय शक्ति मानना, अथवा आधुनिक विज्ञान के अनुसार परावर्तित सूर्यप्रकाश कहकर समझाना।
  rationale: पाठ स्वयं ब्रह्मांडीय प्रक्रिया का दर्शनात्मक-वर्णन देता है; अनुवाद न तो उसका रूपकीकरण करता है, न उसमें आधुनिक वैज्ञानिक तंत्र जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सुबोध खगोलीय वर्णन। ‘चाँद’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘मंडल’ दृश्य गोल आकृति की औपचारिकता बनाए रखता है।
