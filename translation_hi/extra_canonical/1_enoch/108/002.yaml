base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/002.yaml
  text: You who have done good[a], wait for those days until those who do evil are brought to an end[c][b], and the power of the sinners comes to an end.
translation:
  language: hi
  text: तुम जिन्होंने भलाई की है, उन दिनों की प्रतीक्षा करो[a], जब तक बुराई करनेवालों का अंत न कर दिया जाए[b], और पापियों की शक्ति समाप्त न हो जाए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘दृढ़ बने रहो,’ ‘धीरज धरो’ या ‘सहते रहो’ भी हो सकता है। आशय बुराई करनेवालों के अंत तक धैर्यपूर्वक टिके रहने का है।
    reason: lexical_alternative
  - marker: b
    text: मूल क्रिया का शाब्दिक भाव ‘समाप्त कर दिए जाएँ’ या ‘अपने अंत तक पहुँचा दिए जाएँ’ है।
    reason: lexical_alternative
  - marker: c
    text: 'मूल में यहाँ वही ‘समाप्त होने’ वाली क्रिया फिर आती है: बुराई करनेवालों और उनकी शक्ति—दोनों का अंत होता है।'
    reason: cross_reference
lexical_decisions:
- source_word: እለ ገበርክሙ ሠናየ
  choice: तुम जिन्होंने भलाई की है
  rationale: संबंधवाचक पद और पूर्ण क्रिया संबोधित लोगों को भलाई करनेवालों के रूप में प्रस्तुत करते हैं। यह आगे के ‘बुराई करनेवालों’ के साथ नैतिक विरोध भी बनाए रखता है।
- source_word: ትጸንሑ
  choice: प्रतीक्षा करो
  rationale: क्रिया में ठहरे रहने, धीरज धरने या सहते रहने का भाव हो सकता है। यहाँ दिनों और ‘जब तक’ वाले कालसूचक वाक्यांश के कारण ‘प्रतीक्षा करो’ स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ለእሉ መዋዕል
  choice: उन दिनों की
  rationale: መዋዕል का अर्थ दिन अथवा समय है। ‘उन दिनों की प्रतीक्षा’ आगामी न्याय के समय की ओर संकेत करती है और गीइज़ पूर्वसर्ग की लचीली भूमिका के अनुरूप है।
- source_word: እስከ ይትፌጸሙ እለ ይገብሩ እኩየ
  choice: जब तक बुराई करनेवालों का अंत न कर दिया जाए
  rationale: निष्क्रिय/आत्मवाचक क्रियारूप समाप्ति या अंत तक पहुँचाए जाने को व्यक्त करता है। यह अनुवाद ऐसा भ्रम नहीं होने देता कि बुराई करनेवाले केवल अपना काम पूरा कर रहे हैं।
- source_word: ወይትፌጸም ኃይሎሙ ለመአብሳን
  choice: और पापियों की शक्ति समाप्त न हो जाए
  rationale: ኃይል शक्ति या सामर्थ्य है और መአብሳን पापियों को सूचित करता है। ‘समाप्त न हो जाए’ उसी मूल क्रिया की पुनरावृत्ति और उनकी प्रभावी शक्ति के अंत—दोनों को व्यक्त करता है।
theological_decisions:
- issue: መአብሳን को ‘पापियों’ या ‘दुष्टों’ के रूप में प्रस्तुत करना
  choice: पापियों
  alternative: दुष्टों / बुराई करनेवालों
  rationale: यह संज्ञा पाप या दोष से चिह्नित लोगों को दर्शाती है और हनोक के न्याय-संबंधी धार्मिक-नैतिक स्वर को बनाए रखती है। पहले आए क्रियात्मक पद का अनुवाद ‘बुराई करनेवाले’ किया गया है, इसलिए दोनों अभिव्यक्तियों का अंतर भी सुरक्षित रहता है।
- issue: बुराई करनेवालों के अंत को विनाश के रूप में स्पष्ट करना या मूल की समाप्ति-भाषा बनाए रखना
  choice: उनका अंत न कर दिया जाए
  alternative: उनका विनाश न कर दिया जाए
  rationale: मूल क्रिया अंत या समाप्ति तक पहुँचाए जाने का बोध देती है। ‘विनाश’ संभव अर्थ है, पर वह मूल की अपेक्षा अधिक निश्चित व्याख्या करता; इसलिए न्याय की तीव्रता बनाए रखते हुए ‘अंत’ चुना गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और न्याय-संबंधी भाव के अनुरूप भाषा रखी गई है। ‘करनेवालों’ का संयुक्त रूप सामान्य आधुनिक वर्तनी के अनुसार चुना गया है। वाक्य की समानांतर अंत-रचना मूल की पुनरावृत्ति को सुनाई देती रहने देती है।
