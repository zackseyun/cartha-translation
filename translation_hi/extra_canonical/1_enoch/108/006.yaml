base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/006.yaml
  text: 'And he said to me, “This is the place that you see: here the spirits of sinners and blasphemers and those who do evil will be cast, and those who twist everything that the Lord has spoken by the mouth of the prophets—all the things that are to be done.”'
translation:
  language: hi
  text: और उसने मुझसे कहा, “यह वह स्थान है जिसे तुम देख रहे हो। यहाँ पापियों, निन्दकों और बुराई करने वालों की आत्माएँ डाल दी जाएँगी, और उनकी भी जो उन सब बातों को तोड़-मरोड़ देते हैं जिन्हें प्रभु ने भविष्यद्वक्ताओं के मुख से कहा है और जो पूरी होने वाली हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መናፍስተ፡ ኃጥኣን
  choice: पापियों की आत्माएँ
  rationale: गीज़ पदबंध का सीधा और स्वाभाविक हिन्दी रूप; दण्ड के पात्रों को देहधारी व्यक्तियों के बजाय उनकी आत्माओं के रूप में प्रस्तुत करता है।
- source_word: ጽኁፋን
  choice: निन्दकों
  rationale: इस शब्द का पाठ और अर्थ कुछ कठिन है; उपलब्ध अंग्रेज़ी परामर्श-पाठ के ‘blasphemers’ तथा प्रसंगानुकूल धार्मिक निन्दा के अर्थ को ध्यान में रखकर यह रूप चुना गया है।
- source_word: ይትወደዩ
  choice: डाल दी जाएँगी
  rationale: स्थान में फेंके या डाले जाने का भाव रखता है और हिन्दी में भावी निष्क्रिय क्रिया स्वाभाविक है।
- source_word: ይመይጡ
  choice: तोड़-मरोड़ देते हैं
  rationale: कही गई बातों को विकृत करने का सक्रिय भाव स्पष्ट करता है, बिना यह तय किए कि विकृति व्याख्या, पाठ या आचरण में है।
- source_word: በኣፈ፡ ነቢያት
  choice: भविष्यद्वक्ताओं के मुख से
  rationale: मूल की शारीरिक उपमा और ईश्वरीय वाणी के माध्यम का औपचारिक ढंग सुरक्षित रखता है।
- source_word: ኵሉ፡ ይትገበር
  choice: वे सब बातें जो पूरी होनी हैं
  rationale: शाब्दिक ‘सब किया जाएगा’ की अस्वाभाविकता से बचते हुए भविष्य में घटित या सम्पन्न होने का भाव देता है; वाक्यगत सम्बन्ध की कुछ अस्पष्टता बनी रहती है।
theological_decisions:
- issue: प्रभु की भविष्यद्वक्ताओं के माध्यम से कही गई बातों का स्वरूप
  choice: ‘जिन्हें प्रभु ने भविष्यद्वक्ताओं के मुख से कहा है’
  alternative: ‘जिनकी घोषणा प्रभु ने भविष्यद्वक्ताओं द्वारा की है’
  rationale: मूल का ‘मुख से’ वाक्यांश बनाए रखा गया है और किसी विशिष्ट प्रेरणा-सिद्धान्त को अतिरिक्त रूप से नहीं जोड़ा गया।
- issue: अन्तिम उपवाक्य का सम्बन्ध
  choice: ‘अर्थात वे सब बातें जो पूरी होनी हैं’ को प्रभु द्वारा कही गई बातों के स्पष्टीकरण के रूप में रखा
  alternative: 'इसे स्वतंत्र कथन बनाना: ‘यह सब पूरा होगा’'
  rationale: गीज़ वाक्य-विन्यास एकाधिक सम्बन्धों की अनुमति देता है। उपलब्ध पाठ-साक्ष्य और अंग्रेज़ी परामर्श-पाठ के आधार पर इसे पूर्ववर्ती ‘सभी बातों’ से जोड़ा गया, पर ‘पूरी होनी हैं’ भविष्यगत तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट शैली। ‘निन्दकों’, ‘भविष्यद्वक्ताओं’ और ‘मुख से’ जैसे शब्द धार्मिक-अपोकैलिप्टिक वातावरण बनाए रखते हैं; ‘तोड़-मरोड़ देते हैं’ सहज और अर्थपूर्ण आधुनिक मुहावरा है।
