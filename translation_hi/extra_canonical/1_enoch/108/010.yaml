base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/010.yaml
  text: And I have spoken of all their blessings in the books, and he has rewarded them themselves, because these are found to love heaven more than their life in the world; and while they are trodden down by evil men, they hear from them abuse and reviling and are put to shame while blessing me.
translation:
  language: hi
  text: और मैंने उनकी सारी आशीषों का वर्णन पुस्तकों में किया है, और उन्हें उनके प्रधानों के लिए ठहराया है[a], क्योंकि ये ऐसे पाए गए हैं जो संसार में अपने जीवन[b] से बढ़कर स्वर्ग से प्रेम करते हैं। और जब दुष्ट लोग उन्हें कुचलते हैं, तब वे उनसे अपमान और निन्दा सुनते और लज्जित किए जाते हैं, फिर भी मुझे आशीष देते रहते हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ गीज़ वाक्यांश कठिन है। ‘प्रधानों’ का शाब्दिक अर्थ ‘सिरों’ भी हो सकता है; सम्भव अर्थ है, ‘मैंने उन्हें उनके प्रधानों के लिए ठहराया/निर्धारित किया है।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘संसार में अपनी श्वास से’; यहाँ ‘श्वास’ जीवन का बोध कराती है।
    reason: lexical_alternative
  - marker: c
    text: मूल पाठ में ‘मुझे आशीष देते’ है। प्रथम पुरुष को ज्यों का त्यों रखा गया है, यद्यपि यह पाठ कठिन है और कुछ विद्वान यहाँ पाठ-दोष की सम्भावना मानते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: ኵሎ በረከቶሙ
  choice: उनकी सारी आशीषों
  rationale: बहुवचन በረከት को ठोस प्रतिज्ञात वरदानों के अर्थ में ‘आशीषों’ रखा गया है; इससे अपोकैलिप्टिक संदर्भ बना रहता है।
- source_word: ነገርኩ በመጻሕፍት
  choice: मैंने ... का वर्णन पुस्तकों में किया है
  rationale: प्रथम पुरुष और बहुवचन ‘पुस्तकों’ को सुरक्षित रखते हुए हिन्दी में स्वाभाविक साहित्यिक आत्म-संदर्भ दिया गया है।
- source_word: ዐሰዮሙ ለአርእስቲሆሙ
  choice: उन्हें उनके प्रधानों के लिए ठहराया है
  rationale: वाक्यांश कठिन है। አርእስት का शाब्दिक अर्थ ‘सिर’ और विस्तारित अर्थ ‘प्रधान’ है; ‘ठहराया’ व्यवस्था या नियुक्ति के संभावित भाव को बिना अत्यधिक निश्चित किए व्यक्त करता है।
- source_word: ያፈቅርዎ ለሰማይ
  choice: स्वर्ग से प्रेम करते हैं
  rationale: मूल के सीधे कर्म ‘स्वर्ग’ को बनाए रखा गया है और उसे सामान्यीकृत आध्यात्मिकता में नहीं बदला गया।
- source_word: እምእስትንፋሶሙ ዘበዓለም
  choice: संसार में अपने जीवन से बढ़कर
  rationale: ‘श्वास’ यहाँ जीवन का लाक्षणिक बोध कराता है; मुख्य पाठ में अर्थ स्पष्ट किया गया और शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: ይትከየዱ
  choice: कुचलते हैं
  rationale: क्रिया के रौंदने या दमन करने के सजीव बिंब को हिन्दी में ‘कुचलते हैं’ से सुरक्षित रखा गया है।
- source_word: ትዕይርተ ወጽርፈተ
  choice: अपमान और निन्दा
  rationale: शत्रुतापूर्ण वाणी के दोहरे पद को बनाए रखा गया है; ‘निन्दा’ को यहाँ मनुष्यों के विरुद्ध भर्त्सना के सामान्य अर्थ में लिया गया है।
- source_word: ኀሥሡ
  choice: लज्जित किए जाते हैं
  rationale: समीक्षित पाठ के अनुसार इसे सहने के बजाय लज्जित या अपमानित किए जाने के अर्थ में प्रस्तुत किया गया है।
- source_word: እንዘ ይባርኩኒ
  choice: फिर भी मुझे आशीष देते रहते हैं
  rationale: असामान्य प्रथम-पुरुष कर्म ‘मुझे’ को मूल के अनुसार बनाए रखा गया है; ‘फिर भी’ प्रसंगगत विरोध को सहज हिन्दी में दिखाता है।
theological_decisions:
- issue: ‘मुझे आशीष देते’ में प्रथम पुरुष का संदर्भ
  choice: मूल व्याकरण के अनुसार ‘मुझे’ को बनाए रखा गया है, जिसका निकटतम वक्ता हनोक है।
  alternative: ‘मुझे’ को परमेश्वर का अप्रत्यक्ष संदर्भ मानना या पाठ को दूषित समझकर ‘परमेश्वर को’ करना।
  rationale: वाक्य की वास्तविक कठिनाई और धर्मवैचारिक तनाव को मिटाने के बजाय मुख्य पाठ में प्रथम पुरुष रखा और पादटिप्पणी में समस्या स्पष्ट की गई है।
- issue: ዐሰዮሙ ለአርእስቲሆሙ का अर्थ
  choice: ‘उन्हें उनके प्रधानों के लिए ठहराया है’
  alternative: ‘उसने उन्हें स्वयं प्रतिफल दिया है’ अथवा ‘मैंने उन्हें उनके सिरों के लिए लिख रखा है।’
  rationale: गीज़ पद कठिन और संभवतः पाठगत रूप से अस्थिर है। चुना गया रूप उपलब्ध रूपविज्ञान में प्रथम पुरुष और ‘सिर/प्रधान’ दोनों को यथासंभव सुरक्षित रखता है, पर पादटिप्पणी अनिश्चितता बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। ‘आशीष’, ‘स्वर्ग’ और ‘दुष्ट’ जैसे परिचित धार्मिक शब्द रखे गए हैं; कठिन गीज़ वाक्यांशों को अत्यधिक सिद्धान्तगत व्याख्या के बिना पादटिप्पणियों में खोला गया है।
