base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/003.yaml
  text: But you[a], wait until sin passes away; for their names will be blotted out from the book of life and from the books of the holy ones, and their offspring will be destroyed forever. And their spirits will be slain, and they will cry out and lament in a desolate place that is unseen, and in burning fire[d][c][b]; for there is no earth there.
translation:
  language: hi
  text: परन्तु तुम तब तक प्रतीक्षा करो, जब तक पाप समाप्त न हो जाए; क्योंकि उनके नाम जीवन की पुस्तक और पवित्र जनों की पुस्तकों में से मिटा दिए जाएँगे, और उनकी सन्तान सदा के लिए नष्ट हो जाएगी। उनकी आत्माएँ मार डाली जाएँगी; वे उस उजाड़ स्थान में, जो दिखाई नहीं देता[a], और धधकती आग में पुकारेंगे और विलाप करेंगे; क्योंकि वहाँ कोई धरती नहीं है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जो अप्रकट है’।
    reason: lexical_alternative
  - marker: b
    text: ‘वहाँ कोई धरती नहीं है’ मूल का शाब्दिक और असामान्य कथन है; सम्भवतः यह दर्शन में दिखाए गए दण्ड-स्थान का वर्णन है।
    reason: cultural_note
lexical_decisions:
- source_word: ጽንሑ
  choice: प्रतीक्षा करो
  rationale: यह बहुवचन आज्ञार्थक रूप ጸንሐ, ‘प्रतीक्षा करना’, से है। इससे पिछले पद की शब्दावली और लेखक की पुनरावृत्ति भी बनी रहती है।
- source_word: ተሐልፍ ኃጢአት
  choice: पाप मिट न जाए
  rationale: क्रिया पाप के बीत जाने या समाप्त हो जाने का भाव देती है। सहज हिन्दी में ‘मिट न जाए’ पाप के अन्त की भावी आशा व्यक्त करता है, न कि केवल किसी व्यक्ति की क्षमा।
- source_word: ይደመስስ
  choice: मिटा दिए जाएँगे
  rationale: विषय ‘नाम’ और प्रसंग स्वर्गीय अभिलेखों का है; इसलिए यह चुनाव लिखे हुए नामों के मिटाए जाने की छवि बनाए रखता है।
- source_word: እመጽሐፈ ሕይወት
  choice: जीवन की पुस्तक में से
  rationale: यह स्वर्गीय अभिलेख की पारदर्शी अपोकैलिप्टिक छवि है।
- source_word: እመጻሕፍተ ቅዱሳን
  choice: पवित्र जनों की पुस्तकों में से
  rationale: मूल का बहुवचन ‘पुस्तकों’ सुरक्षित रखा गया है। ‘पवित्र जन’ ऐसा तटस्थ पद है जो बाद की विशिष्ट कलीसियाई धारणाएँ आरोपित नहीं करता।
- source_word: ዘርኦሙ ይትሐጐል ለዓለም
  choice: उनकी सन्तान सदा के लिए नष्ट हो जाएगी
  rationale: ‘सन्तान’ वंश का अर्थ स्पष्ट करती है और न्याय-वचन की तीव्रता को बनाए रखती है।
- source_word: መንፈሳቲሆሙ ይትቀተሉ
  choice: उनकी आत्माएँ मार डाली जाएँगी
  rationale: मूल में बहुवचन ‘आत्माएँ/आत्मिक सत्ताएँ’ है। ‘मार डाली जाएँगी’ हिंसक न्याय की असामान्य छवि को नरम नहीं करता।
- source_word: ይጸርኁ ወየአውይዉ
  choice: पुकारेंगे और विलाप करेंगे
  rationale: यह युग्म पीड़ित चीत्कार और शोक दोनों को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: በመካነ ባድው
  choice: उजाड़ स्थान में
  rationale: यह निर्जन और रिक्त दण्ड-स्थान की छवि को संक्षेप में व्यक्त करता है।
- source_word: ዘኢያስተርኢ
  choice: जो दिखाई नहीं देता
  rationale: क्रिया का अर्थ प्रकट होना या दिखाई देना है; अतः यह रूप ‘जिसे दिखाया नहीं जा सकता’ की अपेक्षा गीइज़ रूपविज्ञान के अधिक निकट है।
- source_word: በእሳተ ነዱ
  choice: धधकती आग में
  rationale: यह आग की तीव्रता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ኢሀሎ ህየ ምድር
  choice: वहाँ कोई धरती नहीं है
  rationale: मूल की विचित्र ब्रह्माण्डीय छवि को संकीर्ण करके केवल ‘भूमि’ या ‘ज़मीन’ नहीं किया गया।
theological_decisions:
- issue: वे स्वर्गीय अभिलेख जिनमें से नाम मिटाए जाते हैं
  choice: ‘जीवन की पुस्तक’ और ‘पवित्र जनों की पुस्तकों’ को अलग-अलग अभिलेखों के रूप में ज्यों का त्यों रखा गया है।
  alternative: बहुवचन पुस्तकों को पवित्र जनों के स्वामित्व वाले अभिलेख या सामान्य पवित्र लेख माना जा सकता है।
  rationale: प्रसंग नामों के लिखे और मिटाए जाने के न्यायिक चित्र का है। दोनों पदों को बनाए रखना इस बहुस्तरीय छवि को एक ही बाद की धारणा में नहीं समेटता।
- issue: ‘आत्माओं’ के दण्ड का स्वरूप
  choice: वध, पुकार, विलाप, उजाड़ स्थान और आग—सभी परस्पर तनावपूर्ण अपोकैलिप्टिक चित्र सुरक्षित रखे गए हैं।
  alternative: इसे पूर्ण विनाश का रूपक या सचेत मरणोत्तर दण्ड का विकसित वर्णन समझा जा सकता है।
  rationale: अनुवाद पद को किसी बाद की व्यवस्थित परलोक-सिद्धान्त में नहीं ढालता और मूल के तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘पवित्र जन’, ‘आत्माएँ’ और ‘धरती’ जैसे पद मूल की धार्मिक तथा ब्रह्माण्डीय खुली अर्थ-सीमा को बनाए रखते हैं।
