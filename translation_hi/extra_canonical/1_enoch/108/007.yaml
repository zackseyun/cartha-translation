base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/007.yaml
  text: For there are writings and records concerning them in heaven above[a], so that the angels may read them and know what will come upon the sinners, and upon the humble in spirit, and upon those who afflicted their bodies and received recompense from God[d][c][b], and those who were put to shame by evil men.
translation:
  language: hi
  text: क्योंकि उनके विषय में ऊपर स्वर्ग में लिखे हुए लेख और अभिलेख हैं[a], ताकि स्वर्गदूत उन्हें पढ़ें और जानें कि पापियों, दीन आत्माओं[b], उन लोगों पर जिन्होंने अपने शरीर को कष्ट दिया और परमेश्वर की ओर से प्रतिफल पाया, तथा उन पर क्या बीतेगा जिन्हें दुष्ट मनुष्यों ने अपमानित किया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘लिखे हुए लेख और अभिलेख’ के रूप में अनूदित युग्म कठिन है। दूसरे शब्द का अर्थ ‘बुरी बातें’ भी हो सकता है; यहाँ स्वर्गीय अभिलेख का अर्थ इसलिए लिया गया है क्योंकि अगला वाक्य कहता है कि स्वर्गदूत उन्हें पढ़ते हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘दीन आत्माएँ’ या ‘दीन प्राण’।
    reason: lexical_alternative
  - marker: c
    text: 'यह भी अनुवाद हो सकता है: ‘जिनकी दुष्ट मनुष्यों ने निन्दा की’ या ‘जिन्हें दुष्ट मनुष्यों ने तुच्छ जाना।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका स्वाभाविक संयोजक है।
- source_word: ጽሑፋን ወእኩያን
  choice: लिखित दस्तावेज़ और अभिलेख
  rationale: पहला पद लिखी हुई वस्तुओं को सूचित करता है; दूसरे पद का अर्थ कठिन है, पर स्वर्गदूतों द्वारा उन्हें पढ़े जाने का अगला कथन स्वर्गीय लिखित अभिलेखों की ओर संकेत करता है।
- source_word: ላዕለ በሰማይ
  choice: ऊपर स्वर्ग में
  rationale: मूल की स्थानवाचक और ऊर्ध्वगत भाषा को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ከመ ይንብብዎሙ መላእክት
  choice: ताकि स्वर्गदूत उन्हें पढ़ें
  rationale: उद्देश्यवाचक उपवाक्य और बहुवचन कर्म दोनों स्पष्ट रखे गए हैं।
- source_word: ዘሀሎ ይብጽሖሙ
  choice: क्या बीतेगा
  rationale: यह उन समूहों पर भविष्य में घटित होने या उनके भाग में आने वाली बात को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ለመናፍስት ትኁታን
  choice: दीन आत्माओं
  rationale: मूल में बहुवचन संज्ञा ‘आत्माएँ/प्राण’ के साथ बहुवचन विशेषण ‘दीन’ है; इसलिए इसे केवल मनोवृत्ति ‘मन में दीन’ बनाकर नहीं प्रस्तुत किया गया।
- source_word: እለ አሕመሙ ሥጋሆሙ
  choice: जिन्होंने अपने शरीर को कष्ट दिया
  rationale: शारीरिक दुःख या कठोर आत्म-संयम की तीव्रता बचती है, जबकि किसी विशिष्ट तपस्वी प्रथा को निश्चित नहीं किया जाता।
- source_word: ወተፈድዩ በኀበ አምላክ
  choice: और परमेश्वर से प्रतिफल पाया
  rationale: प्रतिदान या बदले की न्यायिक छाया को बनाए रखते हुए स्थानीय संदर्भ में सकारात्मक ईश्वरीय प्रत्युत्तर व्यक्त करता है।
- source_word: እለ ኀሥሡ እምእኩያን ሰብእ
  choice: जिन्हें दुष्ट मनुष्यों ने अपमानित किया
  rationale: अंतिम वाक्यांश में दुष्ट मनुष्यों की ओर से निन्दा, तिरस्कार या लज्जित किए जाने का भाव है; ‘अपमानित किया’ व्यापक और सहज हिन्दी है।
theological_decisions:
- issue: स्वर्ग में लिखी हुई वस्तुओं का आशय
  choice: इन्हें स्वर्गीय दस्तावेज़ और अभिलेख माना गया है जिन्हें स्वर्गदूत पढ़ते हैं।
  alternative: दूसरा पद ‘बुरी बातें/बुराइयाँ’ भी समझा जा सकता है, अथवा इन्हें विशेष रूप से न्याय की पुस्तकें कहा जा सकता है।
  rationale: अगले उपवाक्य में स्वर्गदूतों का उन्हें पढ़ना और लोगों के भावी भाग्य को जानना दस्तावेज़ी अर्थ का प्रबल समर्थन करता है, पर कठिन शब्द की अनिश्चितता पादटिप्पणी में रखी गई है।
- issue: መናፍስት ትኁታን की पहचान
  choice: दीन आत्माएँ
  alternative: दीन मनवाले लोग / आत्मा में दीन
  rationale: गीज़ व्याकरण में ‘आत्माएँ’ संज्ञा है और ‘दीन’ उसका विशेषण; यह पाठ की परलोक-संबंधी या आत्मिक श्रेणी को केवल मानवीय स्वभाव में नहीं बदलता।
- issue: शरीर को कष्ट देने वालों को परमेश्वर का प्रतिफल
  choice: संदर्भतः सकारात्मक प्रतिफल या न्यायोचित प्रत्युत्तर
  alternative: मूल्य-निरपेक्ष प्रतिदान, अथवा किसी विशिष्ट तपस्वी आत्म-दमन का फल
  rationale: पापियों के बाद उल्लिखित दीन और पीड़ित समूहों का संदर्भ ईश्वरीय समर्थन की ओर झुकता है, फिर भी अनुवाद ‘प्रतिफल’ रखकर पुरस्कार की प्रकृति को अधिक नहीं खोलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल की लंबी सूची को एक ही वाक्य में रखा गया है, पर हिन्दी विराम और समानांतर पदबंधों द्वारा स्पष्ट किया गया है। ‘दीन आत्माएँ’ मूल व्याकरण को प्राथमिकता देता है और बाद की अधिक मुहावरेदार किंतु व्याकरणतः कम सटीक व्याख्या से बचता है।
