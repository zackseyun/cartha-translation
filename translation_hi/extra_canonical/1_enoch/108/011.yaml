base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/011.yaml
  text: And now I will summon the spirits of the good ones from the generation of light, and I will transform those who were born in darkness[c][b][a], who in their flesh were not repaid with honor as their faith deserved.
translation:
  language: hi
  text: और अब मैं ज्योति की पीढ़ी के भले लोगों की आत्माओं को बुलाऊँगा और उन लोगों को रूपान्तरित करूँगा[b] जो अन्धकार में जन्मे थे और जिन्हें अपने देहधारी जीवन में उनकी आस्था के अनुरूप सम्मान नहीं मिला था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी निष्ठा के अनुरूप।” गीइज़ शब्द विश्वास के साथ-साथ दृढ़ निष्ठा का अर्थ भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: “रूपान्तरित करूँगा” वाली क्रिया कठिन है; सम्भव है कि यहाँ अधिक चित्रात्मक अर्थ “ज्योतिर्मय करूँगा” या “प्रकाशित करूँगा” हो।
    reason: textual_variant
lexical_decisions:
- source_word: እጼውዕ
  choice: बुलाऊँगा
  rationale: क्रिया बुलाने या उपस्थित होने के लिए पुकारने का भाव रखती है। भविष्यकाल अगली क्रिया के साथ एक समान अन्तकालीन परिप्रेक्ष्य बनाए रखता है।
- source_word: መናፍስቲሆሙ ለኄራን
  choice: भले लोगों की आत्माओं
  rationale: प्रत्यय और la-युक्त सम्बन्धसूचक रचना का अर्थ ‘भले लोगों की आत्माएँ’ है, न कि ‘उनकी आत्माएँ—अर्थात भले लोग’। ‘आत्माएँ’ यहाँ मनुष्य के अभौतिक अस्तित्व के लिए स्वाभाविक हिन्दी है, बिना आत्मा और प्राण का कठोर पारिभाषिक भेद आरोपित किए।
- source_word: እምትውልድ እንተ ብርሃን
  choice: ज्योति की पीढ़ी के
  rationale: यह चयन प्रकाश से सम्बद्ध वंश या समुदाय की अपोकैलिप्टिक छवि को बनाए रखता है।
- source_word: እዊልጥ
  choice: रूपान्तरित करूँगा
  rationale: कठिन क्रियारूप प्रसंग में परिवर्तन का संकेत देता है। मुख्य पाठ में व्यापक अर्थ रखा गया है; प्रकाशित या ज्योतिर्मय करने की सम्भावना पादटिप्पणी में दी गई है।
- source_word: ተወልዱ በጽልመት
  choice: अन्धकार में जन्मे थे
  rationale: यह ज्योति की पीढ़ी के साथ मूल पाठ का स्पष्ट प्रतीकात्मक विरोध बनाए रखता है।
- source_word: በሥጋሆሙ
  choice: शरीर में रहते हुए
  rationale: शाब्दिक ‘अपने शरीर में’ की अपेक्षा यह आधुनिक हिन्दी में उनके देहधारी जीवनकाल का अर्थ अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: ኢተፈደዩ ክብር
  choice: सम्मान नहीं मिला था
  rationale: मूल में प्रतिफल या देय सम्मान का भाव है। हिन्दी वाक्य में अगला ‘योग्य’ पद इस प्रतिदानात्मक अर्थ को सँभालता है।
- source_word: ከመ ይደሉ ለሃይማኖቶሙ
  choice: उनकी आस्था के योग्य
  rationale: वाक्यांश आस्था के अनुरूप देय सम्मान व्यक्त करता है। ‘आस्था’ आधुनिक हिन्दी में विश्वास का स्वाभाविक रूप है; निष्ठा की सम्भावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ሃይማኖት का विश्वास अथवा निष्ठा के अर्थ में अनुवाद
  choice: आस्था
  alternative: निष्ठा / विश्वासयोग्यता
  rationale: मुख्य पाठ विश्वास का व्यापक अर्थ बनाए रखता है, जबकि नैतिक दृढ़ता का सम्भव अर्थ पादटिप्पणी में दिया गया है।
- issue: अन्धकार में जन्मे लोगों की पहचान
  choice: व्याकरणतः इन्हें रूपान्तरण पाने वाला निकटवर्ती समूह रहने दिया गया है
  alternative: इन्हें भले लोगों से पूर्णतः अलग, दोषी समूह मानना
  rationale: मूल वाक्य की निकटता प्रतिकूल दशा से महिमामय परिवर्तन की छवि सम्भव बनाती है, पर पद अकेला दोनों समूहों की पहचान को पूरी तरह स्पष्ट नहीं करता; अनुवाद कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ज्योति’, ‘अन्धकार’ और ‘आत्माओं’ जैसे पद अपोकैलिप्टिक बिम्बों को बनाए रखते हैं। मुख्य पाठ में केवल [a] और [b] पादटिप्पणियाँ रखी गई हैं; पूर्व अंग्रेज़ी [c] वाला वैकल्पिक पाठ नवीन व्याकरणिक निर्णय के विपरीत होने के कारण शामिल नहीं किया गया।
