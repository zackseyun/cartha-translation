base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/001.yaml
  text: Another book that Enoch wrote for his son Methuselah[a], and for those who will come after him and keep the ordinance in the latter days.
translation:
  language: hi
  text: एक और पुस्तक, जो हनोक ने अपने पुत्र मतूशेलह के लिए और उन लोगों के लिए लिखी जो उसके बाद आएँगे और अन्तिम दिनों में निर्धारित व्यवस्था[a] का पालन करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नियम,’ ‘विधान,’ अथवा ‘निर्धारित रीति।’ गीइज़ शब्द किसी स्थापित मानक, क्रम या पालन की जाने वाली पद्धति को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልእ፡ መጽሐፍ
  choice: एक और पुस्तक
  rationale: यह पद पहले के लेख से अलग एक अतिरिक्त पुस्तक का परिचय देता है; ‘एक और पुस्तक’ आधुनिक हिन्दी में स्वाभाविक है और क्रम को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ዘጸሐፈ፡ ሄኖክ
  choice: जो हनोक ने ... लिखी
  rationale: मूल की संबंधवाचक रचना और ‘लिखना’ क्रिया के सीधे अर्थ को सुरक्षित रखता है।
- source_word: ለወልዱ፡ ማቱሳላ
  choice: अपने पुत्र मतूशेलह के लिए
  rationale: समर्पण अथवा अभिप्रेत पाठक के भाव को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ለእለ፡ ይመጽኡ፡ እምድኅሬሁ
  choice: उन लोगों के लिए ... जो उसके बाद आएँगे
  rationale: मूल के भावी संकेत और व्यक्ति-संदर्भ दोनों को बनाए रखता है, बिना इसे केवल ‘पीढ़ियों’ तक सीमित किए।
- source_word: የዓቅቡ
  choice: पालन करेंगे
  rationale: व्यवस्था या निर्धारित नियम के संदर्भ में यह ‘रखना/मानना/पालन करना’ के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ሥርዐተ
  choice: निर्धारित व्यवस्था
  rationale: इस शब्द में व्यवस्था, नियम, विधान और स्थापित आचार-पद्धति की अर्थ-सीमा है। ‘निर्धारित व्यवस्था’ उसके मानक और पालनयोग्य स्वरूप को दर्शाती है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: በደኃሪ፡ መዋዕል
  choice: अन्तिम दिनों में
  rationale: हनोक साहित्य के प्रलय-विषयक संदर्भ में वाक्यांश की अन्त-कालीन अनुगूँज को बचाता है, पर किसी बाद की विशिष्ट सिद्धान्त-व्यवस्था को आरोपित नहीं करता।
theological_decisions:
- issue: कालवाचक पदबंध को सामान्य ‘बाद के समय’ के रूप में लें या अन्त-कालीन अर्थ सहित
  choice: अन्तिम दिनों में
  alternative: बाद के समय में; दिनों के अन्त में
  rationale: मूल पदबंध और 1 हनोक के प्रलय-विषयक परिवेश में अन्त-कालीन अर्थ स्वाभाविक है। यह अनुवाद उस तनाव को सुरक्षित रखता है, बिना उसका सिद्धान्तगत विस्तार किए।
- issue: ሥርዐተ को एक संकीर्ण कानूनी आदेश मानें या व्यापक स्थापित मानक
  choice: निर्धारित व्यवस्था
  alternative: नियम; विधान; निर्धारित रीति
  rationale: मूल शब्द की अर्थ-व्याप्ति व्यापक है। चुना हुआ रूप पालनयोग्य स्थापित क्रम का भाव देता है और किसी खास धार्मिक विधि को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध रखी गई है। पद को पुस्तक के शीर्षकीय परिचय की तरह संक्षिप्त रखा गया है। ‘अन्तिम दिनों’ से प्रलय-विषयक स्वर सुरक्षित रहता है और ‘निर्धारित व्यवस्था’ मूल की वास्तविक शब्दार्थगत व्यापकता को पादटिप्पणी सहित बनाए रखती है।
