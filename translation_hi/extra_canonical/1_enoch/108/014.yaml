  text: And they will see those who were born in darkness cast into darkness[e][d][c][b][a], while the righteous shine.
translation:
  language: hi
  text: और वे उन लोगों को, जो अंधकार में जन्मे थे, अंधकार में फेंके जाते देखेंगे, जबकि धर्मी चमकेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जबकि धर्मी उज्ज्वल किए जाएँगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይሬ እይዎሙ
  choice: और वे ... देखेंगे
  rationale: दृष्टि-संबंधी क्रिया को भविष्यकाल में रखा गया है; प्रसंग में यही मुख्य क्रिया है और इसके साथ आने वाला कर्मवाच्य वाक्यांश स्वाभाविक हिन्दी में ‘देखेंगे’ से जुड़ता है।
- source_word: ለእለ ተወልዱ በጽልመት
  choice: उन लोगों को, जो अंधकार में जन्मे थे
  rationale: सम्बन्धवाचक रचना और जन्म के कर्मवाच्य भाव को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: ይትወደዩ በጽልመት
  choice: अंधकार में फेंके जाते
  rationale: ይትወደዩ को गीइज़ ወደየ (‘रखना, फेंकना’) के कर्मवाच्य रूप के रूप में लिया गया है, न कि प्रेम-संबंधी क्रिया के रूप में। यहाँ በ को गंतव्यसूचक ‘में’ अनूदित किया गया है।
- source_word: እንዘ ይትወሐውሑ
  choice: जबकि ... चमकेंगे
  rationale: እንዘ विरोधी समकालिक परिस्थिति प्रस्तुत करता है। अपूर्ण क्रियारूप का समय मुख्य भविष्यकालीन क्रिया से निर्धारित होता है, इसलिए हिन्दी में भविष्यकाल रखा गया है।
- source_word: ጻድቃን
  choice: धर्मी
  rationale: यह हनोक-साहित्य का प्रमुख नैतिक पद है; ‘धर्मी’ आधुनिक हिन्दी में संक्षिप्त, प्रतिष्ठित और व्यापक रूप से समझा जाने वाला समतुल्य है।
theological_decisions:
- issue: अंधकार में जन्मे लोगों के साथ होने वाली क्रिया का अर्थ
  choice: अंधकार में फेंके जाते
  alternative: अंधकार में प्रेम किए जाते
  rationale: गीइज़ क्रिया ይትወደዩ यहाँ ወደየ (‘फेंकना/रखना’) का कर्मवाच्य रूप है। इसे प्रेम-संबंधी अर्थ देना गीइज़ और आधुनिक अम्हारिक मूलों के भ्रम पर आधारित होगा और न्याय के दृश्य को विकृत करेगा।
- issue: धर्मियों की चमक का क्रियाभाव
  choice: धर्मी चमकेंगे
  alternative: धर्मी उज्ज्वल किए जाएँगे
  rationale: क्रिया चमकने अथवा उज्ज्वल होने/किए जाने का भाव दे सकती है। मुख्य पाठ में सरल अकर्मक रूप रखा गया है; सम्भावित कर्मवाच्य अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘अंधकार’ और ‘धर्मी’ जैसे प्रतिष्ठित धार्मिक-साहित्यिक शब्द गरिमा बनाए रखते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए सीधी और स्वाभाविक है। स्रोत की ‘अंधकार’ वाली पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है।
