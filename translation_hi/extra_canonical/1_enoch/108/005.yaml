base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/005.yaml
  text: And I asked the two holy angels who were with me[a], and I said to him, “What is this glorious thing? For it is not heaven, but only a burning flame of fire[c][b], and the sound of weeping and crying out and lamentation and grievous pain.”
translation:
  language: hi
  text: और मैंने उन दो पवित्र स्वर्गदूतों से, जो मेरे साथ थे, पूछा और उससे कहा[a], “यह महिमामय वस्तु क्या है[b]? क्योंकि यह स्वर्ग नहीं, बल्कि केवल आग की जलती हुई ज्वाला, और रोने, चिल्लाने और विलाप की आवाज़ तथा घोर पीड़ा है[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ में पहले ‘दो पवित्र स्वर्गदूतों’ का उल्लेख है, पर आगे शाब्दिक रूप से ‘उससे कहा’ आता है। संभव है कि हनोक ने उनमें से एक को प्रवक्ता मानकर संबोधित किया हो, या यह पाठ की कोई अनियमितता हो।
    reason: textual_variant
  - marker: b
    text: ‘महिमामय वस्तु’ का अनुवाद ‘महिमामय स्थान’ या ‘वैभव’ भी किया जा सकता है। पद स्वयं अभी इसका स्पष्ट नाम नहीं बताता, इसलिए मुख्य पाठ व्यापक अर्थ रखता है।
    reason: lexical_alternative
  - marker: c
    text: 'अधिक सहज भावानुवाद: ‘केवल धधकती आग’। मुख्य पाठ ‘आग की ... ज्वाला’ और उसके जलते होने—दोनों मूल भावों को सुरक्षित रखता है।'
    reason: previous_rendering
lexical_decisions:
- source_word: ተስእልክዎ
  choice: मैंने ... पूछा
  rationale: यह क्रिया हनोक द्वारा स्वर्गदूतीय मार्गदर्शकों से प्रश्न करने को व्यक्त करती है; ‘पूछा’ सहज और सीधा आधुनिक हिन्दी रूप है।
- source_word: ፪አመላእክት ቅዱሳን
  choice: उन दो पवित्र स्वर्गदूतों
  rationale: मूल में संख्या दो स्पष्ट है और ቅዱሳን के लिए ‘पवित्र’ सर्वाधिक स्वाभाविक तथा पारंपरिक विशेषण है।
- source_word: እለ ምስሌየ
  choice: जो मेरे साथ थे
  rationale: यह संबंधवाचक पद स्वर्गदूतों को हनोक के साथ उपस्थित मार्गदर्शकों के रूप में पहचानता है।
- source_word: እቤሎ
  choice: उससे कहा
  rationale: गीज़ का रूप एकवचन है; दो स्वर्गदूतों के पिछले उल्लेख के बावजूद अनुवाद इस व्याकरणिक असंगति को सुरक्षित रखता है।
- source_word: ምንት ውእቱ ዝስቡሕ
  choice: यह महिमामय वस्तु क्या है?
  rationale: ዝስቡሕ महिमा या वैभव का भाव रखता है। ‘वस्तु’ संदर्भ को समय से पहले किसी स्थान के रूप में निश्चित नहीं करता।
- source_word: አኮኑ ሰማየ
  choice: यह स्वर्ग नहीं
  rationale: दर्शन में दिखाई दे रही वस्तु और स्वर्ग के बीच स्पष्ट निषेधात्मक भेद रखा गया है।
- source_word: ላህበ እሳት ... ዘይነድድ
  choice: आग की जलती हुई ज्वाला
  rationale: यह रूप ‘आग की ज्वाला’ और उसके जलने—दोनों मूल घटकों को बनाए रखता है तथा गीज़ की संचयी प्रलयदर्शी छवि को संक्षिप्त नहीं करता।
- source_word: ባሕቲቱ
  choice: केवल
  rationale: यह स्वर्ग नहीं, बल्कि यही अग्निमय दृश्य है—इस अपवर्जक विरोध को ‘केवल’ व्यक्त करता है।
- source_word: ቃለ ብካይ
  choice: रोने ... की आवाज़
  rationale: ቃለ का अर्थ स्वर या आवाज़ हो सकता है; श्रव्य घटनाओं की सूची में ‘आवाज़’ स्वाभाविक है।
- source_word: ጽራሕ
  choice: चिल्लाने
  rationale: यह रोने की तुलना में तीव्र पुकार को अलग रखते हुए पद की क्रियात्मक शक्ति को व्यक्त करता है।
- source_word: አውያት
  choice: विलाप करने
  rationale: यह पूर्ववर्ती रोने और चिल्लाने से भिन्न शोकपूर्ण ध्वनि को बनाए रखता है।
- source_word: ሕማም ኀያል
  choice: घोर पीड़ा
  rationale: यह गंभीर और अत्यंत तीव्र दुःख को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दृश्य को दुःख या दण्ड के सामान्य सारांश में बदलना
  choice: आग, रोना, चिल्लाना, विलाप और पीड़ा की ठोस प्रलयदर्शी छवियाँ बनाए रखना
  alternative: इसे सामान्य रूप से ‘यातना’ या ‘दण्ड’ कहना
  rationale: मूल की शक्ति इन्द्रियग्राह्य बिंबों के संचय में है; सामान्यीकृत धार्मिक शब्द मूल से अधिक व्याख्या जोड़ देते।
- issue: दो स्वर्गदूतों के बाद एकवचन संबोधन
  choice: ‘उससे कहा’ रखकर मूल के एकवचन को सुरक्षित रखना
  alternative: व्याकरणिक सामंजस्य के लिए ‘उनसे कहा’ करना
  rationale: एकवचन संभवतः दोनों में से एक प्रवक्ता स्वर्गदूत को संबोधित करता है, पर पाठगत अनियमितता भी हो सकती है; अनुवाद इस अनिश्चितता का निर्णय नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रलयदर्शी शैली रखी गई है। वाक्य का संचयी प्रवाह और ध्वनियों की क्रमिक सूची मूल के अनुरूप सुरक्षित है; कठिन संस्कृतनिष्ठता और अनावश्यक सांप्रदायिक शब्दावली से बचा गया है।
