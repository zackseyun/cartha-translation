base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/009.yaml
  text: those who[a], from the time they came to be, did not desire the food that is on the earth, but regarded their souls as a passing breath, and kept this, and the Lord tested them greatly, and their spirits were found pure[c][b], so that they might bless his name.
translation:
  language: hi
  text: वे, जो जब से अस्तित्व में आए, पृथ्वी का भोजन नहीं चाहते थे, बल्कि अपने प्राणों को क्षणभंगुर साँस के समान समझते थे[a], और इसे बनाए रखते थे; प्रभु ने उनकी बहुत परीक्षा ली, और उनकी आत्माएँ शुद्ध पाई गईं[b], ताकि वे उसके नाम को धन्य ठहराएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने प्राणों को गुजर जानेवाली आत्मा के समान” अथवा “गुजर जानेवाली हवा के समान”; मूल शब्द का अर्थ आत्मा, हवा या साँस हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “प्राण” और “आत्माएँ” के लिए मूल पाठ में दो अलग, पर अर्थ में एक-दूसरे से जुड़े शब्द आए हैं; पहले शब्द का अर्थ “जीवन” भी हो सकता है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: እምአመ ኮኑ
  choice: अपने अस्तित्व में आने के समय से ही
  rationale: यह समय-सूचक वाक्यांश को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है; इसे किसी विशिष्ट जन्म-सिद्धांत से नहीं जोड़ता।
- source_word: ኢፈተዉ
  choice: नहीं चाहते थे
  rationale: क्रिया इच्छा या अनुराग का भाव व्यक्त करती है, केवल भोजन से इनकार करने का नहीं।
- source_word: መብልዕተ ዘውስተ ምድር
  choice: पृथ्वी पर का भोजन
  rationale: मूल के ठोस भोजन और स्थान-संबंधी चित्र को सुरक्षित रखता है; इसे सामान्यीकृत करके ‘सांसारिक सुख’ नहीं बनाया गया।
- source_word: ረሰዩ ነፍሳቶሙ ከመ መንፈስ እንተ ተሐልፍ
  choice: अपने प्राणों को मिट जानेवाली साँस के समान समझते थे
  rationale: ረሰዩ को ‘समझना/मानना’ लिया गया है, न कि ‘त्याग देना’। ነፍስ के लिए ‘प्राण’ जीवन और आत्म के बीच की अर्थगत गुंजाइश रखता है, जबकि ‘मिट जानेवाली साँस’ क्षणभंगुरता का बिंब व्यक्त करती है।
- source_word: ዐቀቡ ወዘንተ
  choice: इसी पर बने रहे
  rationale: रखने, पालन करने या थामे रहने का भाव स्वाभाविक हिन्दी में देता है और यह तय नहीं करता कि संकेत किसी आज्ञा, तपस्या या जीवन-पद्धति की ओर है।
- source_word: ብዙኃ አመከሮሙ እግዚእ
  choice: प्रभु ने उनकी बहुत परीक्षा ली
  rationale: यहाँ क्रिया को जाँचने या परखने के अर्थ में लिया गया है; ‘बहुत’ परीक्षा की तीव्रता को दर्शाता है।
- source_word: ተረክቡ መንፈሳቲሆሙ ንጹሕተ
  choice: उनकी आत्माएँ शुद्ध पाई गईं
  rationale: परीक्षा के बाद प्राप्त निष्कर्ष का निष्क्रिय भाव सुरक्षित रहता है। बहुवचन को हिन्दी में स्वाभाविक ‘आत्माएँ’ से व्यक्त किया गया है।
- source_word: ከመ ይባርክዎ ለስሙ
  choice: ताकि वे उसके नाम को धन्य कहें
  rationale: ከመ और अपूर्ण क्रिया के प्रयोजन अथवा परिणाम-सूचक भाव को बनाए रखता है और ‘नाम को धन्य कहना’ बाइबिलीय अभिव्यक्ति को स्पष्ट हिन्दी में देता है।
theological_decisions:
- issue: पृथ्वी के भोजन का न चाहना और प्राणों को क्षणभंगुर मानना
  choice: ठोस भोजन और कठोर आत्म-संयम के चित्र को ज्यों का त्यों रखा गया है।
  alternative: इसे सामान्य रूप से सांसारिक सुखों का त्याग, संस्थागत संन्यास, या मृत्यु तक उपवास मानना।
  rationale: मूल पाठ पृथ्वी के भोजन और प्राणों की क्षणभंगुरता का उल्लेख करता है, पर किसी बाद की तपस्वी संस्था या निश्चित शहादत-संदर्भ को स्पष्ट नहीं करता।
- issue: उपमा में መንፈስ का अर्थ
  choice: साँस
  alternative: आत्मा या हवा
  rationale: यहाँ गुजर जाने या मिट जाने का गुण प्रमुख है। ‘साँस’ जीवन की नश्वरता का बिंब स्वाभाविक रूप से देता है, जबकि पादटिप्पणी अन्य वास्तविक अर्थों को सुरक्षित रखती है।
- issue: ነፍስ और बाद के መንፈስ के बीच संबंध
  choice: पहले पद के लिए ‘प्राण’ और बाद के लिए ‘आत्माएँ’
  alternative: दोनों के लिए ‘आत्मा’, अथवा पहले के लिए ‘जीवन’
  rationale: यह भेद मूल के दो अलग शब्दों को दर्शाता है और ‘प्राण’ में जीवन तथा आत्म—दोनों की संभावित छाया बनाए रखता है, बिना कठोर मानव-विज्ञान आरोपित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। लंबी मूल वाक्य-श्रृंखला को अर्धविराम से व्यवस्थित किया गया है, पर घटनाक्रम और संयोजन सुरक्षित हैं। ‘पृथ्वी पर का भोजन’, ‘परीक्षा ली’ और ‘नाम को धन्य कहें’ जैसे पद बाइबिलीय रंग बनाए रखते हैं, फिर भी अनावश्यक रूप से पुरातन नहीं हैं।
