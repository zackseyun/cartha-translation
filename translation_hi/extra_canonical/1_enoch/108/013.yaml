base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/013.yaml
  text: And they will shine in times without number[a], for the righteousness belongs to God[f][e][d][c][b]; for he will give faith to the faithful in the dwelling of the paths of uprightness.
translation:
  language: hi
  text: और वे अनगिनत कालों तक चमकते रहेंगे,[a] क्योंकि परमेश्वर का न्याय धर्ममय है;[b] क्योंकि वह विश्वासियों को विश्वास[c] देगा—धर्म के मार्गों वाले निवास में।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक भाव है, ‘ऐसे कालों में जिनकी गिनती नहीं’; अर्थात ‘अनगिनत युगों तक।’
    reason: lexical_alternative
  - marker: b
    text: उपलब्ध प्रतिलिपि में यहाँ አነኒሁ है, जो सम्भवतः ኵነኔሁ, ‘उसका न्याय,’ का पाठ-दोष है। प्रतिलिपि के वर्तमान पाठ को ज्यों का त्यों मानने पर अर्थ हो सकता है, ‘धार्मिकता परमेश्वर की है।’
    reason: textual_variant
  - marker: c
    text: ‘विश्वास’ के लिए प्रयुक्त शब्द का अर्थ ‘विश्वासयोग्यता,’ ‘निष्ठा’ या ‘दृढ़ता’ भी हो सकता है। मूल में ‘विश्वासियों’ और ‘विश्वास’ के बीच समधातुक शब्द-संबंध है।
    reason: lexical_alternative
  - marker: d
    text: '‘धर्म के मार्गों वाले निवास’ मूल पाठ की ठोस छवि को बनाए रखता है: ऐसा स्थान जिसकी पहचान सीधे और उचित मार्गों से है।'
    reason: cultural_note
lexical_decisions:
- source_word: ይትወሐውሑ
  choice: चमकते रहेंगे
  rationale: क्रिया को यहाँ प्रकाशमान होने के अर्थ में लिया गया है, जो इस अपोकैलिप्टिक प्रसंग और उपलब्ध परामर्श-पाठ के मुख्य पाठ के अनुकूल है। ‘आनन्द मनाएँगे’ एक पुराना वैकल्पिक निर्वचन है, पर मुख्य पाठ में ‘चमकेंगे’ अधिक उपयुक्त है।
- source_word: በእዝማን ዘአልቦ ኍልቈ
  choice: अनगिनत कालों तक
  rationale: शाब्दिक भाव ‘ऐसे समय/काल जिनकी गिनती नहीं’ है। यह अनिश्चित, अपरिमित अवधि को व्यक्त करता है, बिना उसे किसी निश्चित तकनीकी अर्थ वाले ‘युगों’ तक सीमित किए।
- source_word: ጽድቅ ኵነኔሁ ለአምላክ
  choice: परमेश्वर का न्याय धर्ममय है
  rationale: प्रमाणित पाठ-संशोधन አነኒሁ को ኵነኔሁ (‘उसका न्याय’) मानता है। अतः वाक्य परमेश्वर के न्याय को धर्ममय बताता है, न कि केवल यह कि धार्मिकता परमेश्वर की है।
- source_word: ለመሃይምናን
  choice: विश्वासियों को
  rationale: यह शब्द विश्वास करने या विश्वासी होने के अर्थ-क्षेत्र से है और अगले संज्ञा-पद ሃይማኖተ के साथ जानबूझकर समधातुक संबंध बनाता है; इसका अर्थ ‘बुद्धिमानों को’ नहीं है।
- source_word: ሃይማኖተ
  choice: विश्वास
  rationale: मूल संज्ञा विश्वास, निष्ठा या विश्वासयोग्यता का अर्थ दे सकती है। मुख्य पाठ में सीधा अर्थ ‘विश्वास’ रखा गया है और नैतिक दृढ़ता की संभावित छाया पादटिप्पणी में सुरक्षित है।
- source_word: በማኅደረ ፍናዋተ ርትዕ
  choice: नेकी के मार्गों के निवास में
  rationale: यह रूपक किसी ऐसे निवास या धाम की ठोस छवि रखता है जिसकी पहचान सीधे और उचित मार्गों से होती है। ‘नेकी’ आधुनिक हिन्दी में सहज है और ርትዕ के नैतिक सीधेपन को व्यक्त करती है।
theological_decisions:
- issue: परमेश्वर के विषय में मध्य खंड का अर्थ
  choice: परमेश्वर का न्याय धर्ममय है
  alternative: धार्मिकता परमेश्वर की है
  rationale: 'उपलब्ध प्रतिलिपि में पाठ-दोष होने के प्रबल प्रमाण हैं: አነኒሁ को ኵነኔሁ (‘उसका न्याय’) पढ़ने पर व्याकरण और अर्थ दोनों स्पष्ट होते हैं। पाठ-संबंधी पारदर्शिता के लिए विकल्प पादटिप्पणी में दिया गया है।'
- issue: परमेश्वर द्वारा विश्वासियों को दिया जाने वाला वरदान
  choice: विश्वास
  alternative: विश्वासयोग्यता या दृढ़ निष्ठा
  rationale: गीज़ संज्ञा दोनों अर्थों को समेट सकती है। मुख्य पाठ धार्मिक विश्वास का सीधा अर्थ रखता है, जबकि विश्वास में टिके रहने की नैतिक छाया को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और अपोकैलिप्टिक काव्यात्मकता के अनुरूप रखी गई है। ‘धर्ममय’ परमेश्वर के न्याय की नैतिक शुद्धता व्यक्त करता है; ‘नेकी’ सामान्य पाठक के लिए सहज रहते हुए मार्गों के नैतिक सीधेपन को बनाए रखती है।
