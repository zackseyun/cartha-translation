base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/015.yaml
  text: And the sinners will cry out and see them while they shine[a], and they themselves will go to where the days and the times have been written down for them[e][d][c][b]. The vision of the hidden things of Enoch.
translation:
  language: hi
  text: और पापी चिल्ला उठेंगे और उन्हें चमकते हुए देखेंगे[a]; और वे स्वयं उस स्थान की ओर जाएँगे जहाँ उनके लिए दिन और समय लिखे गए हैं[b]। हनोक की छिपी हुई बातों का दर्शन[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मुख्य पाठ में ‘उन्हें चमकते हुए’ लिया गया है। यहाँ का गीज़ क्रियारूप कठिन है; इसका अर्थ ‘जब वे भटक रहे होंगे’, ‘जब वे व्याकुल होंगे’ या ‘जब वे उथल-पुथल में होंगे’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उनके लिए ... लिखे गए हैं’ आने वाले समयों के पहले से दर्ज होने की उस दर्शन-साहित्यिक छवि को व्यक्त करता है जिसमें न्याय के समय स्वर्गीय लेखों में अंकित माने जाते हैं।
    reason: cultural_note
  - marker: c
    text: 'यह अंतिम संज्ञा-वाक्यांश संभवतः एक अलग उपसंहार या शीर्षक है: ‘हनोक की छिपी हुई बातों का दर्शन।’'
    reason: textual_note
lexical_decisions:
- source_word: ወይጸርኁ
  choice: और ... चिल्ला उठेंगे
  rationale: यह क्रिया ऊँचे स्वर से पुकारने, विलाप करने या चिल्लाने का भाव रखती है। ‘चिल्ला उठेंगे’ दृश्य की तीव्रता बनाए रखता है, पर शोक का अर्थ अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ወይሬእይዎሙ
  choice: और उन्हें देखेंगे
  rationale: क्रिया ‘देखना’ और उसके कर्मवाचक प्रत्यय का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: ኃጥኣን
  choice: पापी
  rationale: अपोकैलिप्टिक प्रसंग में दुष्ट जनों के वर्ग के लिए सामान्य और स्पष्ट पद।
- source_word: እንዘ ይትወሐውሑ
  choice: जब वे चमक रहे होंगे
  rationale: प्राप्त पंक्ति का यह पद कठिन है और सामान्यतः बेचैनी, भटकने या हलचल का संकेत दे सकता है; फिर भी दिए गए परामर्श-पाठ की ‘shine’ समझ को मुख्य पाठ में रखा गया है और अनिश्चितता को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ወየሐውሩ
  choice: और ... जाएँगे
  rationale: गमन की सामान्य क्रिया के लिए सहज हिन्दी; आगे आने वाला वाक्यांश गंतव्य बताता है।
- source_word: እሙንቱሂ
  choice: और वे स्वयं
  rationale: सर्वनाम के बलाघात को ‘स्वयं’ से सुरक्षित रखा गया है।
- source_word: በኀበ
  choice: उस स्थान की ओर जहाँ
  rationale: दिशा और गंतव्य दोनों को व्यक्त करता है तथा हिन्दी में ‘जहाँ’ की तुलना में स्रोत के दिशात्मक भाव को अधिक स्पष्ट रखता है।
- source_word: ተጽሕፉ ሎሙ መዋዕለ ወእዝማን
  choice: जहाँ उनके लिए दिन और समय लिखे गए हैं
  rationale: निष्क्रिय क्रिया और हितार्थक रूप को बनाए रखते हुए पूर्वलिखित न्याय-काल तथा स्वर्गीय अभिलेख की छवि सुरक्षित रहती है।
- source_word: ራእየ ኅቡኣት
  choice: छिपी हुई बातों का दर्शन
  rationale: दर्शन में प्रकट किए गए गुप्त या अदृश्य विषयों का गरिमापूर्ण और बोधगम्य हिन्दी रूप।
- source_word: ዘሄኖክ
  choice: हनोक की
  rationale: गीज़ पद में न तो ‘में’ का पूर्वसर्ग है और न ‘देखा’ क्रिया; इसलिए इसे स्वामित्वसूचक पद के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: अंतिम पद को पिछले वाक्य में मिलाया जाए या स्वतंत्र उपसंहार/शीर्षक माना जाए
  choice: 'स्वतंत्र उपसंहार: ‘हनोक की छिपी हुई बातों का दर्शन।’'
  alternative: ‘हनोक ने जो छिपी हुई बातें दर्शन में देखीं’ अथवा इसे पिछले गमन-वाक्य से जोड़ना
  rationale: गीज़ में यह स्वतंत्र संज्ञा-पद है; ‘में’ या ‘देखा’ जैसी क्रिया उपस्थित नहीं है। अतः इसे अलग रखना स्रोत-संरचना के अधिक निकट है, जबकि इसका उपसंहार या शीर्षक होना पादटिप्पणी में खुला रखा गया है।
- issue: पापियों के लिए लिखे गए ‘दिन और समय’ का आशय
  choice: अर्थ को बिना विस्तार दिए ‘दिन और समय लिखे गए हैं’
  alternative: ‘न्याय के ठहराए हुए दिन और समय’
  rationale: प्रसंग न्याय की ओर संकेत कर सकता है, पर स्रोत-पद में ‘न्याय’ या ‘ठहराए हुए’ स्पष्ट रूप से नहीं है; इसलिए व्याख्यात्मक विस्तार से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य शैली अपनाई गई है। वाक्य में स्रोत का बलाघात (‘वे स्वयं’), दिशात्मकता और अभिलेखित समयों की छवि रखी गई है। कठिन क्रियारूप को छिपाने के बजाय पादटिप्पणी में वास्तविक शब्दार्थगत अनिश्चितता दी गई है।
