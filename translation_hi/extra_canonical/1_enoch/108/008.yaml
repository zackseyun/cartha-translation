  text: those who love God[a], and did not love gold or silver or any of the good things that are in the world[b], but gave their bodies to affliction.
translation:
  language: hi
  text: वे हैं जो परमेश्वर से प्रेम करते हैं और जिन्होंने न सोने या चाँदी से, न संसार में पाई जाने वाली किसी अच्छी वस्तु से प्रेम किया[b], बल्कि अपने शरीरों[a] को कष्ट के लिए दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ शब्द ሥጋ का अनुवाद ‘मांस’, ‘देह’ या ‘शरीर’ किया जा सकता है। यहाँ ‘शरीरों’ चुना गया है, पर मूल अभिव्यक्ति शारीरिक रूप से कष्ट सहने पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: ‘संसार में पाई जाने वाली किसी अच्छी वस्तु’ के रूप में अनूदित वाक्यांश उपलब्ध पाठ में कुछ असहज है; संभवतः इसका संकेत संसार की वांछनीय वस्तुओं की ओर व्यापक रूप से है।
    reason: textual_variant
lexical_decisions:
- source_word: እለ
  choice: वे जो
  rationale: यह बहुवचन संबंधवाचक सूचक है; ‘वे जो’ मूल संरचना को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: ያፈቅርዎ ለአምላክ
  choice: परमेश्वर से प्रेम करते हैं
  rationale: क्रिया परमेश्वर के प्रति प्रेम और भक्ति व्यक्त करती है; सामान्य चरित्र-वर्णन के लिए वर्तमान काल उपयुक्त है।
- source_word: ወኢወርቀ ወኢብሩረ አፍቀሩ
  choice: जिन्होंने सोने या चाँदी से ... प्रेम नहीं किया
  rationale: ‘प्रेम’ को दोहराने से परमेश्वर के प्रति उचित प्रेम और धन के प्रति अस्वीकार किए गए प्रेम का मूल विरोध सुरक्षित रहता है।
- source_word: ወኢኵሎ ሠናየ ዘውስተ ዓለም
  choice: न ही संसार में पाई जानेवाली किसी अच्छी वस्तु से प्रेम किया
  rationale: पाठ कुछ असहज है, इसलिए यह अनुवाद संसार की वांछनीय वस्तुओं के व्यापक अर्थ को रखता है और किसी अनिश्चित पुनर्निर्माण पर निर्भर नहीं होता।
- source_word: አላ
  choice: बल्कि
  rationale: यह सांसारिक वस्तुओं से प्रेम न करने और कष्ट के लिए आत्मसमर्पण करने के बीच प्रबल विरोध दिखाता है।
- source_word: ወሀቡ ሥጋሆሙ
  choice: अपने शरीरों को ... दे दिया
  rationale: ሥጋ का अर्थ ‘देह/शरीर’ या ‘मांस’ हो सकता है; यहाँ ‘शरीरों’ से शारीरिक दुःख-सहन स्पष्ट और स्वाभाविक ढंग से व्यक्त होता है।
- source_word: ለጻዕር
  choice: कष्ट के लिए
  rationale: यह शब्द दुःख, कठिनाई या क्लेश का बोध करा सकता है; ‘कष्ट’ अर्थ को केवल परिश्रम तक सीमित किए बिना व्यापक रखता है।
theological_decisions:
- issue: क्या यह पद केवल निर्धनता बताता है या परमेश्वर के प्रति भक्ति के कारण सांसारिक संपत्ति के जानबूझकर त्याग को?
  choice: परमेश्वर के प्रति भक्ति से जुड़ा सांसारिक वस्तुओं के प्रेम का सचेत त्याग
  alternative: यह केवल निर्धन लोगों का वर्णन है, अथवा सामान्य रूप से लोभ की निंदा है
  rationale: ‘प्रेम’ की पुनरावृत्ति परमेश्वर से प्रेम और सोने, चाँदी तथा सांसारिक वस्तुओं से प्रेम न करने को सीधे आमने-सामने रखती है। शरीरों को कष्ट के लिए देने का अंतिम कथन स्वेच्छापूर्ण सहनशीलता या विश्वासयोग्य दुःख-सहन की ओर संकेत करता है, पर अनुवाद उसके सटीक ऐतिहासिक रूप को निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘प्रेम’ की पुनरावृत्ति जानबूझकर बनाए रखी गई है ताकि मूल का नैतिक और धार्मिक विरोध स्पष्ट रहे। पादटिप्पणी-चिह्न अर्थानुसार संबंधित शब्दों के बाद लगाए गए हैं।
