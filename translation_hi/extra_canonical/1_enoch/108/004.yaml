base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/004.yaml
  text: And there I saw something like an invisible cloud[a], for because of its depth I was unable to look upon it; and I saw a flame of fire burning gloriously[d][c][b], and something like glorious mountains was circling and moving this way and that way.
translation:
  language: hi
  text: और वहाँ मैंने बादल जैसी एक ऐसी वस्तु देखी जो दिखाई नहीं देती थी[a]; उसकी गहराई के कारण मैं उसे देख नहीं सका[c]। और मैंने आग की एक ज्वाला देखी, जो देदीप्यमान रूप से जल रही थी; तथा महिमामय पर्वतों जैसी आकृतियाँ घूम रही थीं और इधर-उधर डोल रही थीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह दर्शन का विरोधाभास है: हनोक बादल जैसी किसी वस्तु को देखता है, फिर भी उसे ऐसी बताता है जो दिखाई नहीं देती।'
    reason: textual_clarification
  - marker: b
    text: या, “आगे-पीछे डोल रही थीं।” मूल क्रिया बार-बार विपरीत दिशाओं में होने वाली गति का संकेत दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: 'इस स्थान का गीइज़ पाठ कठिन है, विशेषकर “उसकी सीमा/दृश्य रूप से ऊपर” संबंधी शब्द। एक वैकल्पिक समझ है: “क्योंकि उसकी गहराई में से मैं उसकी सीमा से ऊपर देख सका।”'
    reason: textual_variant
lexical_decisions:
- source_word: ርኢኩ በህየ
  choice: वहाँ मैंने ... देखी
  rationale: दर्शन-वृत्तांत के प्रथम पुरुष और स्थानसूचक क्रियाविशेषण को सहज आधुनिक हिन्दी में रखा गया है।
- source_word: ከመ ደመና ዘኢይትረአይ
  choice: बादल जैसी कोई चीज़ ... जो दिखाई नहीं देती थी
  rationale: ከመ की तुलनात्मक और अनिश्चित प्रकृति तथा दिखाई देने पर भी अदृश्य कही गई वस्तु के जानबूझकर रखे गए विरोधाभास—दोनों को बनाए रखता है।
- source_word: እምዕሙቁ
  choice: उसकी गहराई के कारण
  rationale: गहरे स्थान या गहराई का अर्थ संदर्भानुसार बादल-सदृश दृश्य से जोड़ा गया है।
- source_word: አክሀልኩ †ላዕለ ነጽሮ†
  choice: मैं उसे देख नहीं सका
  rationale: पाठ इस स्थान पर कठिन और संभवतः विकृत है। वाक्य-संदर्भ में असमर्थता का अर्थ लिया गया है, पर वैकल्पिक सकारात्मक पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ላህበ እሳት
  choice: आग की एक ज्वाला
  rationale: मूल की सामी बलाघाती अभिव्यक्ति को केवल ‘आग’ बनाकर संक्षिप्त नहीं किया गया।
- source_word: እንዘ ይነድድ ስቡሕ
  choice: महिमा के साथ जलते
  rationale: निरंतर जलने की क्रिया और ስቡሕ के महिमा/वैभव संबंधी अर्थ को सुरक्षित रखता है; ‘चमकते हुए’ अर्थ को अनावश्यक रूप से सीमित करता।
- source_word: ይትከበቡ ... ወይትሀወኩ
  choice: चारों ओर घूम रही थीं और इधर-उधर हिल रही थीं
  rationale: दोनों क्रियाओं के बहुवचन को पर्वत-सदृश आकृतियों से जोड़ा गया है और बार-बार, दिशाबदल वाले संचलन को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ከመ አድባር ስቡሓን
  choice: महिमामय पर्वतों जैसी आकृतियाँ
  rationale: तुलनात्मक दर्शन-भाषा को बनाए रखने के लिए ‘आकृतियाँ’ जोड़ा गया है; इससे उन्हें वास्तविक पर्वत घोषित नहीं किया जाता।
theological_decisions:
- issue: देखी गई वस्तु को अदृश्य बताने वाला दर्शनीय विरोधाभास
  choice: बादल जैसी कोई चीज़ ... जो दिखाई नहीं देती थी
  alternative: एक अनदेखा बादल-जैसा कुहरा
  rationale: मूल की रहस्यपूर्ण तनावपूर्ण भाषा को स्पष्ट करने के नाम पर समाप्त नहीं किया गया।
- issue: ज्वाला और पर्वत-सदृश आकृतियों का व्याकरणिक संबंध
  choice: बहुवचन क्रियाओं को पर्वत-सदृश आकृतियों से जोड़ना
  alternative: ज्वाला महिमामय पर्वतों की तरह घिरी हुई थी और इधर-उधर हिलती थी
  rationale: प्राप्त गीइज़ पाठ में अंतिम क्रियाएँ बहुवचन हैं; अतः उन्हें ज्वाला के एकवचन कर्ता से जोड़ना व्याकरणिक संख्या को दबा देगा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध रखी गई है। ‘महिमामय’ और ‘आग की ज्वाला’ दर्शन-साहित्य का ऊँचा स्वर बनाए रखते हैं। कठिन गीइज़ पाठ को मुख्य अनुवाद में जबरन निश्चित न बनाकर पादटिप्पणी में वास्तविक विकल्प दिया गया है।
