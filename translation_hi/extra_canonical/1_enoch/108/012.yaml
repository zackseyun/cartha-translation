base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/012.yaml
  text: And I will bring out into bright light those who loved my holy name[c][b][a], and I will seat each one on the throne of his glory.
translation:
  language: hi
  text: और जिन्होंने मेरे पवित्र नाम से प्रेम किया, उन्हें मैं उज्ज्वल प्रकाश में निकाल लाऊँगा[a], और हर एक को उसकी महिमा के सिंहासन पर बैठाऊँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक अन्य सम्भव, पर व्याकरण की दृष्टि से कम सम्भावित अर्थ है: ‘मैं उन्हें उज्ज्वल प्रकाश में उन लोगों के लिए निकाल लाऊँगा जिन्होंने मेरे पवित्र नाम से प्रेम किया।’'
    reason: lexical_alternative
  - marker: b
    text: '‘उसकी’ का सबसे निकट सन्दर्भ ‘हर एक’ है। इसे परमेश्वर/प्रभु की महिमा से सम्बद्ध भी समझा गया है; एक अधिक सामान्य अनुवाद होगा: ‘महिमामय सिंहासन पर।’'
    reason: alternative_reading
lexical_decisions:
- source_word: እወፅኦሙ
  choice: उन्हें मैं ... निकाल लाऊँगा
  rationale: क्रिया किसी समूह को बाहर ले आने या प्रकट दशा में लाने का भाव देती है। ‘निकाल लाऊँगा’ गति और कर्तृवाचक कारण—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: በብሩህ ብርሃን
  choice: उज्ज्वल प्रकाश में
  rationale: विशेषण और संज्ञा में दोहराया गया प्रकाश-बिंब तीव्र चमक व्यक्त करता है। गति-सूचक क्रिया के साथ ‘प्रकाश में’ लक्ष्य की दशा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ለእለ አፍቀርዎ ለስምየ ቅዱስ
  choice: जिन्होंने मेरे पवित्र नाम से प्रेम किया, उन्हें
  rationale: यहाँ ለ- को क्रिया पर लगे पूर्वसूचक बहुवचन कर्म-प्रत्यय के अनुरूप प्रत्यक्ष कर्म-चिह्न मानना अधिक उचित है। हिन्दी में सम्बन्धवाचक संरचना उन लोगों को स्पष्ट रूप से कर्म बनाती है।
- source_word: አነብር
  choice: बैठाऊँगा
  rationale: सिंहासन के प्रसंग में यह क्रिया केवल बसाने के बजाय किसी को आसन पर बैठाने का अर्थ देती है।
- source_word: አሐደ አሐደ
  choice: हर एक को
  rationale: दोहराव वितरणात्मक है और प्रत्येक व्यक्ति को अलग-अलग प्रतिष्ठित किए जाने पर बल देता है।
- source_word: መንበረ ክብር ዚአሁ
  choice: उसकी महिमा के सिंहासन
  rationale: መንበር को राजकीय-अंतकालिक प्रसंग में ‘सिंहासन’ और सम्बन्धकारक रचना को ‘महिमा के सिंहासन’ के रूप में रखा गया है। एकवचन ‘उसकी’ निकटस्थ ‘हर एक’ की ओर स्वाभाविक रूप से लौटता है, पर वैकल्पिक सन्दर्भ सम्भव है।
theological_decisions:
- issue: अन्तिम ‘उसकी’ का सन्दर्भ
  choice: मुख्य पाठ में ‘उसकी’ को निकटस्थ ‘हर एक’ से सम्बद्ध रखा गया है—अर्थात प्रत्येक व्यक्ति उसकी अपनी महिमा से जुड़े सिंहासन पर बैठाया जाता है।
  alternative: सर्वनाम को परमेश्वर/प्रभु या प्रसंग के किसी अन्य महिमामय व्यक्ति की ओर संकेत करने वाला समझा जा सकता है; अथवा पदबंध का अर्थ सामान्य रूप से ‘महिमामय सिंहासन’ लिया जा सकता है।
  rationale: गीज़ का तृतीय-पुरुष एकवचन सर्वनाम निकटस्थ वितरणात्मक ‘हर एक’ से व्याकरणतः मेल खाता है। फिर भी सर्वनाम का अन्तिम सन्दर्भ पूरी तरह निर्विवाद नहीं है, इसलिए वैकल्पिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण लेकिन सहज शैली रखी गई है। ‘उज्ज्वल प्रकाश’, ‘पवित्र नाम’ और ‘महिमा का सिंहासन’ जैसे मूल अपोकैलिप्टिक बिंबों को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
