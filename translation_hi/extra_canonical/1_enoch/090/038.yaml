base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/038.yaml
  text: And I saw until all their kinds were transformed[a], and they all became white cattle; and the first among them became a wild ox, and that wild ox became a great beast[d][c][b], and it had great black horns on its head.
translation:
  language: hi
  text: और मैं देखता रहा, जब तक उनके सभी प्रकार रूप बदलकर श्वेत गौवंशीय पशु नहीं हो गए। उनमें का पहला एक जंगली बैल बन गया[a]; और वह जंगली बैल एक बड़ा पशु बन गया, जिसके सिर पर बड़े काले सींग थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीइज़ पाठ में यहाँ दो बार ነገር है, जिसका सामान्य अर्थ ‘वचन’, ‘बात’ या ‘वस्तु’ हो सकता है; पहली आवृत्ति को संदिग्ध पाठ के रूप में चिह्नित किया गया है। पशु-रूपकों के इस प्रसंग में ‘जंगली बैल’ सम्भवतः मूल आशय को सुरक्षित रखता है, पर यह पाठ-सुधार निश्चित नहीं है।
    reason: textual_variant
  - marker: b
    text: आधार के रूप में दिए गए प्रतिलेख में पद यहाँ अधूरा रह गया था। चार्ल्स के प्रकाशित गीइज़ पाठ में आगे ‘उसके सिर पर बड़े काले सींग’ आता है, जिसे मुख्य पाठ में पुनः स्थापित किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ተወለጠ
  choice: बदल नहीं गईं
  rationale: दर्शन में प्राणियों की अवस्था और रूप बदलने का भाव है। ‘बदल गईं’ स्वाभाविक हिन्दी है और रूपांतरण के आशय को सुरक्षित रखता है।
- source_word: ኵሉ አዝማዲሆሙ
  choice: उनकी सारी जातियाँ
  rationale: यह पशु-प्रतीकात्मक संदर्भ में उनके सभी प्रकारों या वर्गों को दर्शाता है; ‘जातियाँ’ यहाँ प्राणियों की किस्मों के अर्थ में है।
- source_word: አልህምተ ጻዕዳ
  choice: सफेद गाय-बैल
  rationale: मूल में सामूहिक गौवंशीय चित्र है। ‘गाय-बैल’ लिंग को अनावश्यक रूप से सीमित किए बिना साधारण पाठक के लिए स्पष्ट है।
- source_word: ቀዳማዊ ኮነ ማእከሎሙ
  choice: उनमें जो पहला था
  rationale: यह समूह के भीतर प्रथम या प्रमुख प्राणी की पहचान करता है और मूल का स्थान-संबंध भी बनाए रखता है।
- source_word: †ነገር … ነገር
  choice: जंगली बैल … वह जंगली बैल
  rationale: प्राप्त गीइज़ पाठ में ነገር (‘वचन/बात/वस्तु’) है और पहली आवृत्ति पर भ्रष्ट पाठ का संकेत भी है। पशु-दर्शन की निरंतरता तथा संभावित प्राचीन पाठगत भ्रम के आधार पर ‘जंगली बैल’ सबसे संभावित मूल आशय है; अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
- source_word: አርዌ ዐቢየ
  choice: एक विशाल पशु
  rationale: यह बड़े और शक्तिशाली पशु का चित्र देता है। ‘विशाल पशु’ आधुनिक हिन्दी में स्वाभाविक रहते हुए दर्शन की गरिमा बनाए रखता है।
- source_word: አቅርንት ጸሊም ዐቢይ ዲበ ርእሱ
  choice: जिसके सिर पर बड़े-बड़े काले सींग थे
  rationale: यह चार्ल्स के गीइज़ पाठ में आगे आने वाले पूर्ण वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: दृष्टान्त के बीच दो बार आए कठिन ነገር का अर्थ
  choice: मुख्य पाठ में ‘जंगली बैल’
  alternative: ‘वचन’, ‘बात’ या ‘वस्तु’
  rationale: गीइज़ का शाब्दिक पाठ अर्थ की दृष्टि से असंगत है और संपादित पाठ स्वयं इसे संदिग्ध चिह्नित करता है। पशु-रूपकों की अखंड शृंखला ‘जंगली बैल’ का समर्थन करती है। फिर भी पादटिप्पणी गीइज़ साक्ष्य और अनुमानित सुधार दोनों बताती है, ताकि कठिनाई छिपे नहीं और कोई बाद की धार्मिक व्याख्या आरोपित न हो।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुलभ रखी गई है। ‘सफेद गाय-बैल’ सामूहिक गौवंशीय बिंब को स्पष्ट करता है; कठिन पाठ को चुपचाप सहज बनाने के बजाय पाठगत अनिश्चितता पादटिप्पणी में दर्ज है।
