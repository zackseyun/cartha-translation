base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/006.yaml
  text: And behold[a], lambs were born from those white sheep, and their eyes began to be opened, and they saw[b], and they cried out to the sheep.
translation:
  language: hi
  text: और देखो, उन सफेद भेड़ों[a] से मेमने जन्मे; और वे अपनी आँखें खोलने, देखने और भेड़ों को पुकारने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन सफेद भेड़ों से।” संकेतवाचक शब्द को निकटवर्ती अर्थ में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ነዋ
  choice: देखो
  rationale: दर्शन-वर्णन में प्रयुक्त संकेतसूचक विस्मयादिबोधक का स्वाभाविक और गरिमापूर्ण हिन्दी रूप; इससे अचानक दिखाई देने वाले दृश्य का भाव बना रहता है।
- source_word: መንስኣት
  choice: मेमने
  rationale: पूरे पशु-दर्शन में भेड़ों की ठोस प्रतीकात्मक छवि बनाए रखता है; सामान्य ‘बच्चे’ या ‘सन्तान’ उस छवि को धुँधला कर देते।
- source_word: ተወልዱ
  choice: जन्मे
  rationale: जन्म लेने की सामान्य और सीधी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: እምዝኩ አባግዕት ጻዓዳ
  choice: उन सफेद भेड़ों से
  rationale: पूर्वोक्त समूह की ओर संकेत और प्रतीकात्मक रूप से महत्त्वपूर्ण सफेद रंग—दोनों सुरक्षित रहते हैं।
- source_word: አኃዙ
  choice: लगे
  rationale: यह आरम्भसूचक क्रिया है और इसके बाद आने वाली समानान्तर क्रियाओं—आँखें खोलना, देखना और पुकारना—को हिन्दी में स्वाभाविक ढंग से अपने अधीन रखती है।
- source_word: አዕይንቲሆሙ ይከሠቱ
  choice: अपनी आँखें खोलने
  rationale: दृष्टि प्राप्त होने की छवि को बनाए रखते हुए आरम्भसूचक रचना के साथ सहज हिन्दी देता है।
- source_word: ወይርእዩ
  choice: देखने
  rationale: समानान्तर अपूर्ण क्रिया को आरम्भसूचक ‘लगे’ के अधीन रखता है और केवल शारीरिक देखने से आगे के अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ወይጸርኁ
  choice: पुकारने
  rationale: स्वर उठाकर बुलाने या पुकारने का अर्थ देता है, पर पशु-ध्वनि को ‘मिमियाना’ कहकर जरूरत से अधिक विशिष्ट नहीं बनाता।
- source_word: ኀበ አባግዕ
  choice: भेड़ों को
  rationale: दिशा अथवा सम्बोधन का सबसे स्वाभाविक प्रसंगगत हिन्दी रूप है।
theological_decisions:
- issue: प्रतीकात्मक पशु-छवि को बनाए रखना
  choice: मेमने … सफेद भेड़ें … भेड़ें
  alternative: बच्चे … सफेद जन … झुंड
  rationale: यह पशु-दर्शन अपनी बात सतत पशु-प्रतीकों के द्वारा कहता है। अनुवाद प्रतीकों की व्याख्या करके उनके स्थान पर मानवीय या अमूर्त संज्ञाएँ नहीं रखता।
- issue: आरम्भसूचक क्रिया का विस्तार
  choice: आँखें खोलने, देखने और पुकारने लगे
  alternative: उनकी आँखें खुलने लगीं, और उन्होंने देखा और पुकारा
  rationale: गीज़ की तीन समानान्तर अपूर्ण क्रियाओं को አኃዙ (‘आरम्भ किया’) के अधीन रखना व्याकरणिक समानान्तरता और क्रमिक जागृति को सुरक्षित रखता है; फिर भी स्वतंत्र पूर्ण क्रियाओं की सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण दर्शन-वर्णन। ‘देखो’ से अपोकैलिप्टिक कथन-शैली और ‘मेमने/भेड़ें’ से मूल पशु-प्रतीक सुरक्षित हैं। क्रियाओं की समानान्तर रचना स्रोत की वाक्य-संरचना को हिन्दी की स्वाभाविकता के साथ प्रस्तुत करती है।
