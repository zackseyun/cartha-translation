  text: And those sheep all became white, and their hair became thick and pure.
translation:
  language: hi
  text: और वे सभी भेड़ें सफेद हो गईं, और उनके बाल घने और शुद्ध हो गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አባግዕ
  choice: भेड़ें
  rationale: गीज़ बहुवचन संज्ञा का सीधा और इस पशु-दर्शन के संदर्भ में स्वाभाविक हिन्दी रूप।
- source_word: ጻዕዳ
  choice: सफेद
  rationale: रंग-सूचक शब्द का सामान्य आधुनिक हिन्दी अनुवाद; प्रतीकात्मक अर्थ को व्याख्या द्वारा नहीं जोड़ा गया।
- source_word: ጸጕረ ዚአሆሙ
  choice: उनके बाल
  rationale: शाब्दिक अर्थ ‘उनके बाल’ है। भेड़ों के संदर्भ में ‘ऊन’ स्वाभाविक हो सकता है, पर स्रोत के सामान्य शब्द को बनाए रखने और उपलब्ध पाठ-साक्ष्य से अधिक विशिष्ट न होने के लिए ‘बाल’ चुना गया।
- source_word: ዐቢየ
  choice: घने
  rationale: मूल का अर्थ बड़ा/विकसित/प्रचुर हो सकता है; बालों के लिए सहज हिन्दी में ‘घने’ उस वृद्धि या प्रचुरता को व्यक्त करता है।
- source_word: ንጹሐ
  choice: शुद्ध
  rationale: मूल विशेषण की शुद्धता/स्वच्छता की अर्थ-सीमा को ‘शुद्ध’ बनाए रखता है और धार्मिक संकेत को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: सफेदी और शुद्धता का प्रतीकात्मक अर्थ
  choice: पाठ में केवल दृश्य-वर्णन रखा गया
  alternative: इसे स्पष्टतः धार्मिक या नैतिक शुद्धता के रूप में खोलकर कहना
  rationale: दर्शन का प्रतीकात्मक आशय संभव है, किंतु पद स्वयं उसकी व्याख्या नहीं करता; अतः वास्तविक धार्मिक तनाव और खुलापन सुरक्षित रखा गया।
- issue: बाल बनाम ऊन
  choice: बाल
  alternative: ऊन
  rationale: स्रोत में सामान्यतः ‘बाल’ का शब्द है; ‘ऊन’ पशु-संदर्भ में सहज होते हुए भी अर्थ को अधिक विशिष्ट कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दृश्यात्मक वाक्य। स्रोत की पुनरुक्त संरचना को दो जुड़े हुए उपवाक्यों में बनाए रखा गया है।
