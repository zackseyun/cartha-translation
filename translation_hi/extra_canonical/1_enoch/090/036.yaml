  text: And I saw that that house became great and broad and exceedingly full[a][b][c].
translation:
  language: hi
  text: और मैंने देखा कि वह घर बड़ा, चौड़ा और अत्यन्त भरा हुआ हो गया।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पशु-दर्शन के इस प्रतीकात्मक प्रसंग में ‘घर’ से पवित्रस्थान या मन्दिर अभिप्रेत हो सकता है, पर गीइज़ पाठ में यहाँ केवल सामान्य शब्द ‘घर’ है।
    reason: cross_reference
  - marker: b
    text: 'शाब्दिक भाव: ‘अत्यन्त पूर्ण/भरा हुआ हो गया।’ किससे भरा था, यह इस पद में नहीं कहा गया; निकटवर्ती प्रसंग में भेड़ों का उल्लेख है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: और मैंने देखा
  rationale: दर्शन-वर्णन में बार-बार आने वाली प्रथम-पुरुष शैली को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: ከመ ኮነ
  choice: हो गया
  rationale: यह स्थिर अवस्था के बजाय अवस्था-परिवर्तन व्यक्त करता है।
- source_word: ውእቱ ቤት
  choice: वह भवन
  rationale: संकेतवाचक भाव सुरक्षित रखा गया है। ‘भवन’ मूल के सामान्य अर्थ को रखता है और मुख्य पाठ में ‘मन्दिर’ जैसा अधिक विशिष्ट अर्थ आरोपित नहीं करता।
- source_word: ዐቢየ
  choice: विशाल
  rationale: यह यहाँ आकार की महानता को सहज हिन्दी में व्यक्त करता है, साथ ही दर्शनीय गरिमा भी बनाए रखता है।
- source_word: ወርኂበ
  choice: और चौड़ा
  rationale: मूल में व्यक्त विस्तार या चौड़ाई को सीधे और समानान्तर ढंग से प्रस्तुत करता है।
- source_word: ወምሉአ ፈድፋደ
  choice: और अत्यन्त भर गया था
  rationale: ፈድፋደ को क्रियाविशेषण ‘अत्यन्त’ मानकर ምሉአ के पूर्णता-भाव को तीव्र करता है; इसे ‘बहुतायत’ नामक किसी वस्तु से भरना नहीं बनाया गया।
theological_decisions:
- issue: क्या ቤት का अनुवाद प्रसंगानुसार ‘मन्दिर’ किया जाए
  choice: भवन
  alternative: मन्दिर / पवित्रस्थान
  rationale: पशु-दर्शन के व्यापक प्रतीकात्मक प्रसंग में मन्दिर अभिप्रेत हो सकता है, पर गीइज़ पाठ स्वयं सामान्य शब्द ‘घर/भवन’ प्रयोग करता है। अतः विशिष्ट धार्मिक पहचान को पादटिप्पणी में रखा गया है।
- issue: भवन किससे भरा था
  choice: वस्तु को अनुक्त छोड़ना
  alternative: भेड़ों से भर गया था
  rationale: निकटवर्ती प्रसंग से भेड़ें समझी जा सकती हैं, किन्तु इस पद में भरने की वस्तु स्पष्टतः नहीं कही गई; इसलिए मूल की संक्षिप्तता और निहित अस्पष्टता सुरक्षित रखी गई है।
