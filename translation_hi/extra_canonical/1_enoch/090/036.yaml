  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सरल दर्शन-वर्णन। ‘विशाल और चौड़ा’ दृश्यात्मक समानान्तरता रखता है। ‘अत्यन्त भर गया था’ कुछ असामान्य किन्तु बोधगम्य है और मूल की परिणामी अवस्था तथा अनुक्त पूरक—दोनों को सुरक्षित रखता है।
