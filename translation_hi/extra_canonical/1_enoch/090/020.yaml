base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/020.yaml
  text: And I saw until a throne was set up in the pleasant land[a], and the Lord of the sheep sat upon it[b]; and he took all the sealed books and opened those books before the Lord of the sheep.
translation:
  language: hi
  text: और मैं तब तक देखता रहा, जब तक मनोरम देश में[a] एक सिंहासन स्थापित किया गया। भेड़ों का प्रभु उस पर बैठा[b]; और उसने सभी मुहरबंद पुस्तकें लीं और उन पुस्तकों को भेड़ों के प्रभु के सामने खोला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: जिस गीज़ शब्द का अनुवाद यहाँ ‘मनोरम देश’ किया गया है, उसका अर्थ इस पाठ-साक्षी में अनिश्चित है। संभव है कि वह सामान्य पृथ्वी के बजाय किसी विशेष रूप से प्रिय या उत्तम देश को सूचित करता हो।
    reason: lexical_alternative
  - marker: b
    text: इस पद में ‘भेड़ों का प्रभु’ दो बार आता है—वही सिंहासन पर बैठता है और उसी के सामने पुस्तकें खोली जाती हैं। अनुवाद ने इस पुनरुक्ति को सरल बनाकर हटाने के बजाय सुरक्षित रखा है।
    reason: textual_tension
lexical_decisions:
- source_word: መንበር
  choice: सिंहासन
  rationale: न्याय के इस दर्शन में यह राजकीय और न्यायिक आसन है; ‘सिंहासन’ इस बिंब को स्पष्ट रूप से बनाए रखता है।
- source_word: ተሐንጸ
  choice: स्थापित नहीं किया गया
  rationale: कर्मवाच्य रूप सिंहासन के तैयार या खड़ा किए जाने को व्यक्त करता है। ‘स्थापित किया गया’ स्वाभाविक है और निर्माण की प्रक्रिया को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ሐዋዝ
  choice: मनोरम देश
  rationale: यह शब्द इस पाठ-साक्षी में कठिन और अनिश्चित है। संदर्भ में इसे सामान्य पृथ्वी के बजाय विशेष रूप से प्रिय, उत्तम या सुंदर देश समझना संभव है; ‘मनोरम देश’ इस भौगोलिक और गुणात्मक अर्थ को सुरक्षित रखता है।
- source_word: እግዚአ አባግዕ
  choice: भेड़ों का प्रभु
  rationale: पशु-दर्शन में प्रयुक्त इस उपाधि को दोनों स्थानों पर एक-समान रखा गया है; ‘प्रभु’ अधिकार और ऊँचे अपोकैलिप्टिक भाव को व्यक्त करता है।
- source_word: መጻሕፍተ ኅትማተ
  choice: मुहरबंद पुस्तकें
  rationale: यह वाक्यांश मुहर लगी पुस्तकों, संभवतः स्वर्गीय अभिलेखों, को सूचित करता है। ‘मुहरबंद पुस्तकें’ मूल संरचना का सीधा और बोधगम्य रूप है।
- source_word: ፈትሖን
  choice: खोला
  rationale: क्रिया का सामान्य अर्थ ‘खोलना’ है। पहले आए ‘मुहरबंद’ से मुहर खोलने का भाव स्वयं स्पष्ट रहता है, इसलिए अधिक विशिष्ट अर्थ आरोपित नहीं किया गया।
theological_decisions:
- issue: सिंहासन पर बैठे व्यक्ति और जिसके सामने पुस्तकें खोली गईं उसकी पहचान
  choice: 'गीज़ पाठ की पुनरुक्ति ज्यों की त्यों रखी गई है: भेड़ों का प्रभु सिंहासन पर बैठता है और पुस्तकें भेड़ों के प्रभु के सामने खोली जाती हैं।'
  alternative: किसी एक उल्लेख में पाठ-संशोधन करके सिंहासन पर किसी अन्य स्वर्गीय व्यक्ति को बैठाना, या पुस्तकों को किसी दूसरे पात्र के सामने खुलवाना।
  rationale: प्राप्त पाठ में पुनरुक्ति कुछ असहज अवश्य है, पर वह अनुवाद योग्य और संगत है। बिना स्पष्ट पाठ-साक्ष्य के उसे समतल करना या धर्मवैज्ञानिक रूप से अलग पात्र मान लेना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज रखी गई है। ‘भेड़ों का प्रभु’, ‘सिंहासन’ और ‘मुहरबंद पुस्तकें’ पशु-दर्शन की न्याय-संबंधी प्रतीकात्मकता को बनाए रखते हैं; कठिन स्थल ሐዋዝ की अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
