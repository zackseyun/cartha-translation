theological_decisions:
- issue: पुस्तक लिखने वाले व्यक्ति की पहचान
  choice: मुख्य पाठ में केवल ‘वह व्यक्ति’
  alternative: वह स्वर्गदूत / वह लेखक-स्वर्गदूत
  rationale: मूल गीज़ ‘व्यक्ति/मनुष्य’ कहता है। दर्शन में उसका स्वर्गीय पात्र होना संभव है, पर उसकी पहचान को अधिक विशिष्ट करना व्याख्यात्मक अतिक्रमण होगा।
- issue: बारह चरवाहों द्वारा किए गए विनाश का तुलनात्मक अर्थ
  choice: उन्होंने अपने पूर्ववर्तियों से कहीं अधिक विनाश किया
  alternative: उन्होंने अपने लिए निर्धारित सीमा से अधिक विनाश किया
  rationale: गीज़ እምቅድሜሆሙ व्याकरणतः ‘उनसे जो उनसे पहले थे’ की ओर संकेत करता है। सीमा या आज्ञा का विचार व्यापक प्रसंग से निकाला जा सकता है, पर इस पद के मुख्य पाठ में उसे जोड़ना उचित नहीं।
- issue: ‘भेड़ों के प्रभु’ की उपाधि
  choice: पशु-दर्शन की उपाधि को ज्यों का त्यों बनाए रखना
  alternative: प्रभु / परमेश्वर
  rationale: मूल उपाधि दर्शन की प्रतीकात्मक संरचना का अभिन्न भाग है और परमेश्वर की पहचान को छिपाए बिना साहित्यिक तनाव बनाए रखती है।
