base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/017.yaml
  text: And I saw until that man[a], who was writing a book by the word of the Lord, opened that book of destruction which those twelve shepherds had wrought[e][d][c][b], and he showed before the Lord of the sheep that they had destroyed much more than those before them.
translation:
  language: hi
  text: और मैं देखता रहा, जब तक कि वह व्यक्ति[a], जो प्रभु के वचन के अनुसार एक पुस्तक लिख रहा था, विनाश की उस पुस्तक को खोली जिसमें उन बारह चरवाहों के किए विनाश का लेखा था[b]। उसने भेड़ों के प्रभु[c] के सामने दिखाया कि उन्होंने अपने से पहले वालों की अपेक्षा कहीं अधिक विनाश किया था[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में ‘मनुष्य’ या ‘व्यक्ति’ है। दर्शन का यह पात्र स्वर्गीय लेखक प्रतीत होता है, पर मूल उसे यहाँ स्पष्ट रूप से ‘स्वर्गदूत’ नहीं कहता।
    reason: cultural_note
  - marker: b
    text: 'शाब्दिक रूप के निकट: ‘विनाश की वह पुस्तक, जिसे उन बारह चरवाहों ने नष्ट किया था।’ प्रसंग के अनुसार पुस्तक में उनके किए विनाश का लेखा होना अधिक संभावित है।'
    reason: textual_variant
  - marker: c
    text: ‘भेड़ों का प्रभु’ इस पशु-दर्शन में परमेश्वर के लिए प्रयुक्त उपाधि है।
    reason: cultural_note
  - marker: d
    text: अर्थात उनसे पहले के चरवाहों की अपेक्षा। एक अन्य व्याख्या इसे उन्हें सौंपी गई सीमा से अधिक विनाश करने के अर्थ में लेती है, पर गीज़ का सीधा तुलनात्मक वाक्यांश ‘अपने से पहले वालों की अपेक्षा’ है।
    reason: textual_variant
