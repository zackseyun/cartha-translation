  choice: जिसमें उन बारह चरवाहों के किए विनाश का लेखा था
  rationale: गीज़ संबंधवाचक वाक्य का शाब्दिक रूप हिन्दी में पुस्तक को ही नष्ट किया गया समझा सकता है। यह रूप पुस्तक को बारह चरवाहों के विनाशकारी कामों का अभिलेख बताता है और संदर्भगत अर्थ सुरक्षित रखता है।
