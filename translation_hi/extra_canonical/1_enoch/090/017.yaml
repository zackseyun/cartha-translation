- source_word: መጽሐፈ ሐጕል
  choice: विनाश की ... पुस्तक
  rationale: ሐጕል विनाश या बरबादी का बोध देता है। ‘विनाश की पुस्तक’ न्याय और अभिलेख के प्रसंग को बनाए रखता है।
