  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। दर्शन-वर्णन का सूत्र ‘मैं देखता रहा, जब तक कि’ बनाए रखा गया है। प्रतीकात्मक पद ‘भेड़ों के प्रभु’ का सामान्यीकरण नहीं किया गया, और कठिन गीज़ संबंधवाचक वाक्य को मुख्य पाठ में अर्थ-स्पष्ट रूप देकर उसके अधिक शाब्दिक विकल्प को पाद-टिप्पणी में सुरक्षित रखा गया है।
