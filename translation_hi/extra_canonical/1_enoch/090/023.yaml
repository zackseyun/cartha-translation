  yaml_path: translation/extra_canonical/1_enoch/090/023.yaml
  text: And behold[a], I saw all the prisoners, and they all stood before him.
translation:
  language: hi
  text: और देखो, मैंने उन सभी बंदियों[a] को देखा, और वे सब उसके सामने खड़े थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बंधे हुओं’ अथवा ‘कैदियों’। गीज़ शब्द उन लोगों की दशा पर बल देता है जिन्हें बाँधकर या रोककर रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወናሁ
  choice: और देखो
  rationale: दर्शन-वर्णन के संकेतसूचक और प्रलयदर्शी भाव को बनाए रखता है; इसे केवल सामान्य कथात्मक संयोजक नहीं बनाता।
- source_word: ኵሎሙ
  choice: सभी / सब
  rationale: मूल पद में दोहराए गए समग्रता के बल को स्वाभाविक हिन्दी में दोनों स्थानों पर सुरक्षित रखता है।
- source_word: እሱራነ
  choice: बंदियों
  rationale: यह शब्द बंधे हुए अथवा हिरासत में रखे लोगों को सूचित करता है। ‘बंदी’ आधुनिक हिन्दी में स्वाभाविक है और उनकी पहचान को संदर्भ से आगे बढ़कर निर्धारित नहीं करता।
- source_word: ርኢኩ
  choice: मैंने ... देखा
  rationale: प्रथम पुरुष में दर्शन के सीधे वृत्तांत का स्वाभाविक हिन्दी रूप।
- source_word: ወቆሙ
  choice: और वे सब ... खड़े थे
  rationale: न्यायिक दृश्य में किसी अधिकारी के सामने उपस्थित खड़े होने का भाव देता है; ‘उठ खड़े हुए’ जैसी अतिरिक्त गतिशीलता नहीं जोड़ता।
- source_word: ቅድሜሁ
  choice: उसके सामने
  rationale: मूल के संबंधसूचक अर्थ को सीधे रखता है और पहले से संदर्भित पुरुष की पहचान स्पष्ट किए बिना न्यायालय-सदृश मुद्रा बनाए रखता है।
theological_decisions:
- issue: हिरासत में रखे समूह की पहचान और पद का आशय
  choice: मुख्य पाठ में እሱራነ का अनुवाद ‘बंदियों’ किया गया है, बिना यह निर्धारित किए कि वे तारे, चरवाहे या स्वर्गदूतीय अपराधी हैं।
  alternative: ‘बंधे हुए लोग’ या ‘कैदी’
  rationale: गीज़ पद उन्हें उनकी बंधी अथवा निरुद्ध दशा से पहचानता है; विशिष्ट प्रतीकात्मक पहचान व्यापक संदर्भ से आती है। इसलिए मुख्य पाठ मूल की अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और दर्शन-साहित्य के अनुरूप शैली। ‘और देखो’ प्रलयदर्शी सूत्र को सुरक्षित रखता है; ‘बंदी’ सामान्य पाठक के लिए स्पष्ट रहते हुए मूल की संदर्भगत अस्पष्टता बनाए रखता है।
