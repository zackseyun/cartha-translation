base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/019.yaml
  text: And I saw until a great sword was given to the sheep[a], and the sheep went out against all the beasts of the field to kill them; and all the beasts and the birds of heaven fled from before their face.
translation:
  language: hi
  text: और मैं देखता रहा, यहाँ तक कि भेड़ों को एक बड़ी तलवार दी गई। तब भेड़ें मैदान के सब पशुओं को मार डालने के लिए उनके विरुद्ध निकल पड़ीं; और सब पशु और आकाश के पक्षी उनके सामने से भाग गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में शाब्दिक मुहावरा है, “उनके चेहरों के सामने से”; इसका अर्थ है, “उनके सामने से।”
    reason: मूल सेमिटिक शैली और स्वाभाविक हिन्दी के बीच के अन्तर को स्पष्ट करना।
lexical_decisions:
- source_word: ርኢኩ
  choice: मैं देखता रहा
  rationale: यह प्रथम पुरुष में दर्शन-वर्णन है। अपूर्ण पक्ष अगले निर्णायक दृश्य तक लगातार देखते रहने का भाव व्यक्त करता है।
- source_word: እስከ ተውህበ
  choice: जब तक ... नहीं दी गई
  rationale: यह गीइज़ पाठ की कालगत प्रगति को स्वाभाविक हिन्दी में बनाए रखता है और घटना को केवल सामान्य भूतकाल में नहीं बदलता।
- source_word: ለአባግዕ
  choice: भेड़ों को
  rationale: सम्प्रदान कारक का सीधा अर्थ है; पशु-दर्शन के प्रतीक को व्याख्यात्मक रूप से किसी ऐतिहासिक समुदाय के नाम से नहीं बदला गया।
- source_word: ሰይፍ ዐቢይ
  choice: एक बड़ी तलवार
  rationale: यह तलवार के आकार अथवा सामर्थ्य—दोनों की सम्भावित छाया को पूरी तरह सीमित किए बिना प्रतीक की भव्यता बनाए रखता है।
- source_word: ወወፅኡ አባግዕ
  choice: तब भेड़ें ... निकल पड़ीं
  rationale: यह आगे बढ़कर कार्रवाई करने की गति को आधुनिक, स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ዲበ ኵሉ አራዊተ ገዳም
  choice: मैदान के सब वन-पशुओं ... के विरुद्ध
  rationale: यह विरोध का अर्थ और पशु-दर्शन की मूल छवि दोनों बनाए रखता है; इसे केवल ‘शत्रुओं’ में नहीं बदला गया।
- source_word: ከመ ይቅትልዎሙ
  choice: मार डालने के लिए
  rationale: उद्देश्य का भाव साफ और वर्तमान हिन्दी में व्यक्त होता है तथा दृश्य की हिंसा को नरम नहीं करता।
- source_word: አዕዋፈ ሰማይ
  choice: आकाश के पक्षी
  rationale: मूल की ऊँची, दर्शनीय अभिव्यक्ति को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ነፍጹ እምቅድመ ገጾሙ
  choice: उनके सामने से भाग गए
  rationale: सेमिटिक मुहावरे का अर्थ स्वाभाविक हिन्दी में दिया गया है; उसके अधिक शाब्दिक रूप को पादटिप्पणी में दर्ज किया गया है।
theological_decisions:
- issue: पशु-प्रतीकों की पहचान मुख्य पाठ में खोलना या न खोलना
  choice: ‘भेड़ें’, ‘वन-पशु’ और ‘पक्षी’ को दर्शन के प्रतीकों के रूप में ज्यों का त्यों रखा गया
  alternative: इन्हें व्याख्यात्मक रूप से इस्राएल, शत्रु राष्ट्रों या सहयोगी शक्तियों के नाम से प्रस्तुत करना
  rationale: यह पशु-दर्शन अपनी बात लगातार प्रतीकात्मक छवियों के माध्यम से कहता है। अनुवाद का काम इन छवियों को सुरक्षित रखना है, किसी एक ऐतिहासिक या साम्प्रदायिक व्याख्या को मुख्य पाठ में आरोपित करना नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। अपोकैलिप्टिक पशु-छवियों और युद्ध-संबंधी तीव्रता को बिना व्याख्यात्मक विस्तार या धार्मिक विशिष्टता जोड़े सुरक्षित रखा गया है।
