base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/025.yaml
  text: And those shepherds were judged and were found to be sinners[c][b][a], and they were cast into that abyss of fire.
translation:
  language: hi
  text: और उन चरवाहों[a] का न्याय किया गया और वे पापी पाए गए,[b] और उन्हें अग्नि के उस गर्त में डाल दिया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध प्रतिलिपि में इस शब्द का रूप कुछ बिगड़ा हुआ है, पर गीज़ शब्द और प्रसंग ‘चरवाहों’ की ओर संकेत करते हैं—अर्थात पहले उल्लिखित वे चरवाहे जिनका न्याय हुआ।
    reason: textual_variant
  - marker: b
    text: शाब्दिक रूप से ‘पापी हो गए’; इस न्यायिक प्रसंग में इसका अर्थ ‘पापी ठहरे’ या ‘दोषी पाए गए’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝኩ
  choice: और उन
  rationale: यहाँ ዝኩ संकेतवाचक रूप है—‘उन/वे’—न कि ‘मैंने देखा’ का क्रियापद। संयोजन सहित ‘और उन’ कथानक की निरंतरता बनाए रखता है।
- source_word: ኖላዊያን (प्रतिलिपि में ሮ*ኖላዊያን)
  choice: चरवाहों
  rationale: नोला-वियान का अर्थ ‘चरवाहे’ है और संदर्भ पिछले न्याय किए गए चरवाहों का है। पशु-दर्शन के इसी प्रसंग में इसे ‘हाथी’ मानना भ्रष्ट प्रतिलिपि पर आधारित होगा।
- source_word: ተኰነኑ
  choice: का न्याय किया गया
  rationale: न्यायिक कर्मवाच्य को सुरक्षित रखता है और ‘दोषी ठहराए गए’ की अपेक्षा निर्णय तथा दंडादेश के बीच की अस्पष्टता खुली छोड़ता है।
- source_word: ወኮኑ ኃጥኣነ
  choice: और वे पापी पाए गए
  rationale: शाब्दिक ‘पापी हुए’ न्यायिक प्रसंग में दोष की पहचान या घोषणा व्यक्त कर सकता है। ‘पापी पाए गए’ नैतिक शब्दावली और न्यायिक अर्थच्छाया दोनों बनाए रखता है।
- source_word: ወተወድዩ እሙንቱ
  choice: और उन्हें ... डाल दिया गया
  rationale: कर्मवाच्य रूप बलपूर्वक फेंके या डाले जाने को व्यक्त करता है; हिंदी में यह सहज और गंभीर है।
- source_word: ውስተ'ዛ ማዕምቀ እሳት
  choice: आग के उस अथाह कुंड में
  rationale: ‘अथाह कुंड’ गर्त या abyss की छवि को स्वाभाविक हिंदी में रखता है; ‘आग’ दंडात्मक दृश्य को बिना ‘नरक’ जैसी व्याख्यात्मक संज्ञा जोड़े सुरक्षित रखती है।
theological_decisions:
- issue: न्याय पाने वाले समूह की पहचान
  choice: प्रतीकात्मक पात्रों को ‘चरवाहे’ ही रखा गया
  alternative: ‘हाथी’ या किसी ऐतिहासिक समूह का नाम
  rationale: गीज़ शब्द और निकटवर्ती संदर्भ चरवाहों की ओर संकेत करते हैं। उन्हें किसी ऐतिहासिक सत्ता के रूप में खोलना दर्शन की प्रतीकात्मक भाषा की व्याख्या कर देना होता।
- issue: ኃጥኣነ का नैतिक बनाम न्यायिक अर्थ
  choice: ‘पापी पाए गए’
  alternative: ‘पापी हो गए’ या ‘दोषी पाए गए’
  rationale: यह चुनाव ‘पापी’ की नैतिक-धार्मिक शक्ति बनाए रखते हुए न्याय-दृश्य में दोष घोषित किए जाने की अर्थच्छाया भी व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गंभीर किंतु सहज कथात्मक स्तर रखा गया है। ‘अथाह कुंड’ प्रलय-दर्शी गर्त की सजीव छवि देता है, जबकि ‘पापी पाए गए’ मूल की नैतिक और न्यायिक अर्थच्छायाओं को साथ रखता है।
