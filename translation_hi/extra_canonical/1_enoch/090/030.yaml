base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/030.yaml
  text: And I saw all the sheep that were left[a], and every beast that was upon the earth, and all the birds of heaven, falling down and bowing to those sheep, and making petition to them[b], and obeying them in every word.
translation:
  language: hi
  text: फिर मैंने बची हुई सब भेड़ों को देखा। पृथ्वी पर के सभी पशु और आकाश के सभी पक्षी उन भेड़ों के सामने गिरकर झुकते थे, उनसे विनती करते थे और उनकी हर बात मानते थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनकी हर बात सुनते थे”; यहाँ सुनने का अर्थ ध्यान देना या आज्ञा मानना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢክዎሙ
  choice: फिर मैंने ... देखा
  rationale: यह दर्शन-वर्णन को स्वाभाविक आधुनिक हिन्दी में आगे बढ़ाता है; क्रिया का प्रथम पुरुष और दृश्यात्मक भाव सुरक्षित रहता है।
- source_word: ኵሎሙ አባግዕ እለ ተርፉ
  choice: बची हुई सब भेड़ों को
  rationale: यह न्याय के बाद शेष रह गई भेड़ों का भाव रखता है, पर उनके बचने के स्वरूप को अनावश्यक रूप से निश्चित नहीं करता। ‘को’ से भेड़ें ‘मैंने देखा’ की कर्म हैं।
- source_word: ኵሉ እንስሳ ዘዲበ ምድር
  choice: पृथ्वी पर के सभी पशु
  rationale: ‘पशु’ दर्शन के प्रतीकात्मक प्राणी-जगत के लिए गरिमापूर्ण और सहज शब्द है; स्थान-संबंधी वाक्यांश भी स्पष्ट रहता है।
- source_word: ኵሉ አዕዋፈ ሰማይ
  choice: आकाश के सभी पक्षी
  rationale: यह बाइबलीय अभिव्यक्ति को स्वाभाविक हिन्दी में व्यक्त करता है और ‘स्वर्ग’ कहकर स्थान को धर्मवैज्ञानिक अर्थ नहीं देता।
- source_word: ይወድቁ ወይሰግዱ
  choice: सामने गिरकर झुकते थे
  rationale: दोनों शारीरिक क्रियाओं और अधीनता के भाव को रखा गया है, लेकिन इसे स्पष्ट रूप से ‘आराधना’ नहीं कहा गया।
- source_word: ለእልኩ አባግዕ
  choice: उन भेड़ों के सामने
  rationale: संकेतवाचक पद पहले बताई गई बची हुई भेड़ों की ओर लौटता है; ‘के सामने’ झुकने की मुद्रा के साथ स्वाभाविक है।
- source_word: ያስተበቍዕዎሙ
  choice: उनसे विनती करते थे
  rationale: यह आग्रहपूर्ण याचना और अधीन मुद्रा को सरल, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ይሰምዕዎሙ በኵሉ ቃል
  choice: उनकी हर बात मानते थे
  rationale: क्रिया का मूल अर्थ ‘सुनना’ है, पर इस अधीनता के संदर्भ में ‘बात मानना’ अभिप्रेत अर्थ को स्वाभाविक हिन्दी में देता है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: पशुओं और पक्षियों का भेड़ों के सामने झुकना आराधना है या अधीनता
  choice: इसे ‘गिरकर झुकते थे ... विनती करते थे ... बात मानते थे’ के रूप में व्यापक अधीनता बताया गया है।
  alternative: ‘उन भेड़ों की आराधना करते थे’
  rationale: क्रियाओं का क्रम अत्यंत गहरी अधीनता दिखाता है, किंतु पाठ स्वयं इसे परमेश्वर के लिए प्रयुक्त विशिष्ट आराधना के रूप में स्पष्ट नहीं करता। इसलिए धर्मवैज्ञानिक निष्कर्ष थोपे बिना दृश्य का तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण दर्शन-वर्णन। गीइज़ वाक्यरचना के अनुसार भेड़ों को ‘देखा’ क्रिया का कर्म और पशुओं व पक्षियों को झुकने, विनती करने तथा मानने वाली क्रियाओं का कर्ता स्पष्ट किया गया है।
