base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/024.yaml
  text: And judgment took place first upon the stars[a], and they were judged and were found to be sinners, and they went to the place of judgment; and they cast them into an abyss, full of fire and flaming[c][b], and full of pillars of fire.
translation:
  language: hi
  text: और सबसे पहले तारों का न्याय हुआ[a]। उनका न्याय किया गया और वे पापी पाए गए। फिर वे न्याय के स्थान पर गए[b], और उन्होंने उन्हें आग और धधकती लपटों से भरी अथाह गहराई[c] में डाल दिया, जो आग के खंभों से भी भरी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस वाक्यांश का अर्थ ‘तारों के सामने’ या ‘तारों की उपस्थिति में’ भी समझा जा सकता है। यहाँ मुख्य पाठ इसे दर्शन के क्रम के अनुसार लेता है: तारों से दर्शाए गए स्वर्गीय प्राणियों का न्याय सबसे पहले हुआ।'
    reason: lexical_alternative
  - marker: b
    text: मूल में ‘न्याय’, ‘न्याय किया गया’ और ‘न्याय का स्थान’—एक ही न्याय-संबंधी शब्दमूल बार-बार आता है; हिन्दी में भी यह पुनरावृत्ति जानबूझकर रखी गई है।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से ‘एक गहराई में’; यहाँ प्रसंगानुसार ‘अथाह गहराई’ अनूदित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵነኔ
  choice: न्याय
  rationale: यह शब्द औपचारिक न्यायिक कार्यवाही को व्यक्त करता है। ‘न्याय’ निर्णय की प्रक्रिया को बनाए रखता है और समय से पहले उसे केवल ‘दंडादेश’ या ‘दोषसिद्धि’ नहीं बना देता।
- source_word: ቅድመ እምከዋክብት
  choice: सबसे पहले तारों का
  rationale: दर्शन के क्रम में तारों के रूप में दिखाए गए प्राणी पहले न्याय के अधीन आते हैं। यह अनुवाद ቅድመ को क्रमसूचक ‘सबसे पहले’ और तारों को न्याय के विषय के रूप में समझता है; स्थानवाचक सम्भावना पादटिप्पणी में रखी गई है।
- source_word: ተኰነኑ
  choice: उनका न्याय किया गया
  rationale: मूल में ‘न्याय’ की धातु की पुनरावृत्ति है। यह निष्क्रिय न्यायिक अभिव्यक्ति उस पुनरावृत्ति और प्रक्रिया को सुरक्षित रखती है।
- source_word: ኃጥኣነ
  choice: पापी
  rationale: यह शब्द नैतिक और धार्मिक दोष को व्यक्त करता है; ‘पापी’ आधुनिक हिन्दी में सीधा और स्पष्ट है।
- source_word: ሖሩ መካነ ኵነኔ
  choice: न्याय के स्थान पर गए
  rationale: दर्शन में गति और दंड के ठोस स्थान—दोनों को बनाए रखते हुए न्याय-संबंधी शब्द की पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: ወደይዎሙ
  choice: उन्होंने उन्हें ... डाल दिया
  rationale: क्रिया बलपूर्वक दंड के स्थान में डाल दिए जाने को व्यक्त करती है। कर्ता और कर्म के बहुवचन सर्वनामों को मूल की तरह स्पष्ट नाम दिए बिना रखा गया है।
- source_word: ውስተ ዕሙቅ
  choice: अथाह गड्ढे में
  rationale: यह गहरी दंडात्मक खाई की दृश्यात्मक छवि देता है। ‘अथाह गड्ढा’ सामान्य पाठक के लिए स्वाभाविक है और किसी बाद की पारिभाषिक धार्मिक संज्ञा को आरोपित नहीं करता।
- source_word: ምሉእ እሳት ወይላህብ
  choice: आग और धधकती लपटों से भरे
  rationale: मूल की संचित अग्नि-छवि को सहज हिन्दी में तीव्रता सहित व्यक्त किया गया है।
- source_word: አዕማደ እሳት
  choice: आग के खंभे
  rationale: यह सीधी, सजीव और स्वाभाविक हिन्दी है तथा दर्शन की खड़ी अग्निमय संरचनाओं की छवि बनाए रखती है।
theological_decisions:
- issue: न्यायिक भाषा को प्रक्रिया के रूप में रखा जाए या परिणाम के रूप में
  choice: ‘न्याय हुआ’, ‘न्याय किया गया’, और फिर ‘पापी पाए गए’—इस क्रम को बनाए रखा गया है।
  alternative: हर स्थान पर ‘दोषी ठहराए गए’ या ‘दंडित किए गए’ कहना।
  rationale: मूल पहले न्यायिक कार्यवाही और फिर पापी पाए जाने की बात अलग-अलग कहता है। उन्हें एक ही दंडात्मक परिणाम में मिला देना मूल के नाटकीय और धर्मवैचारिक तनाव को घटा देता।
- issue: दंड के अंतिम स्थान का वर्णन
  choice: अथाह गड्ढे, आग, लपटों और आग के खंभों की मूर्त छवियाँ रखी गई हैं।
  alternative: ‘नरक’ या ‘नरकाग्नि’ जैसे बाद के धर्मवैज्ञानिक शब्दों का प्रयोग।
  rationale: मूल किसी पारिभाषिक उत्तरकालीन नाम के बजाय प्रत्यक्ष प्रलयदर्शी चित्र प्रस्तुत करता है; इसलिए उसी चित्रात्मक भाषा को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण किन्तु सहज शैली अपनाई गई है। प्रलयदर्शी दृश्य की तीव्रता बनाए रखने के लिए ‘धधकती लपटें’ और ‘आग के खंभे’ जैसे ठोस पद रखे गए हैं। न्याय-संबंधी पुनरावृत्ति को शैलीगत असहजता मानकर हटाया नहीं गया।
