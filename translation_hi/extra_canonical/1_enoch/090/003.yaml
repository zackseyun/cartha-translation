base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/003.yaml
  text: And the sheep cried out because their flesh was being devoured by the birds[b][a], and I looked and lamented in my sleep over that shepherd who was shepherding the sheep.
translation:
  language: hi
  text: और भेड़ें चिल्ला उठीं, क्योंकि पक्षी उनका मांस नोचकर खा रहे थे।[a] तब मैंने देखा और अपनी नींद में उस चरवाहे के विषय में विलाप किया, जो भेड़ों को चरा रहा था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में केवल ‘पक्षी’ है; भक्षण का दृश्य बताता है कि वे हिंसक पक्षी हैं, पर ‘शिकारी पक्षी’ स्पष्ट रूप से नहीं कहा गया।
    reason: lexical_alternative
  - marker: b
    text: ‘विलाप किया’ का अर्थ ‘रो पड़ा’ या ‘दुःख से पुकार उठा’ भी हो सकता है। ‘अपनी नींद में’ के स्थान पर ‘अपने स्वप्न में’ भी अनुवाद संभव है। ‘उस चरवाहे के विषय में’ का संबंध ‘उस चरवाहे पर’ भी समझा जा सकता है।
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: አባግዕ
  choice: भेड़ें
  rationale: बहुवचन ‘भेड़ें’ मूल दर्शनात्मक पशु-प्रतीक को स्पष्ट रूप से बनाए रखता है; इसे ‘लोग’ जैसे ऐतिहासिक अर्थ में नहीं बदला गया।
- source_word: ጸርኁ
  choice: चिल्ला उठीं
  rationale: यह संकट में निकली सुनाई देने वाली पुकार को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ይትበልዑ ሥጋሆሙ
  choice: उनका मांस नोचकर खा रहे थे
  rationale: अपूर्ण/निरंतर भक्षण और हिंसक दृश्य दोनों को व्यक्त करता है; ‘मांस’ मूल की देहात्मक तीव्रता बनाए रखता है।
- source_word: እምነ አዕዋፍ
  choice: पक्षी
  rationale: मूल केवल ‘पक्षी’ कहता है; भक्षण से शिकारी स्वभाव स्पष्ट है, पर मुख्य पाठ में ‘शिकारी पक्षी’ जोड़ना अधिक विशिष्ट होता।
- source_word: ነጸርኩ
  choice: मैंने देखा
  rationale: दर्शी की अवलोकन-क्रिया का सरल और निकट अनुवाद।
- source_word: አውየውኩ
  choice: विलाप किया
  rationale: गहरे और संभवतः मुखर शोक को गरिमापूर्ण ढंग से व्यक्त करता है तथा भेड़ों की पहले की पुकार से अलग रखता है।
- source_word: በንዋምየ
  choice: अपनी नींद में
  rationale: शाब्दिक ‘मेरी नींद में’ को स्वाभाविक हिन्दी में सुरक्षित रखता है; ‘स्वप्न में’ संदर्भानुकूल विकल्प है।
- source_word: ኖላዊ ዘይርዕዮሙ ለአባግዕ
  choice: चरवाहे ... जो भेड़ों को चरा रहा था
  rationale: चरवाहे और उसके कार्य—दोनों को रखकर पशुपालन की दर्शनात्मक छवि सुरक्षित की गई है।
theological_decisions:
- issue: पशु-प्रतीकों को सीधे उनके संभावित ऐतिहासिक संकेतों के रूप में अनूदित करना
  choice: भेड़ें, पक्षी और चरवाहा—मूल दर्शनात्मक प्रतीक ज्यों के त्यों रखना
  alternative: उन्हें लोग, शत्रु और शासक जैसे व्याख्यात्मक पदों से बदलना
  rationale: अपोकैलिप्टिक दर्शन की बहुअर्थी प्रतीकात्मकता को मुख्य पाठ में व्याख्या बनाकर सीमित नहीं करना चाहिए।
- issue: विलाप का संबंध
  choice: ‘उस चरवाहे के कारण विलाप किया’
  alternative: ‘उस चरवाहे पर/उसके विषय में विलाप किया’ या केवल ‘देखा और विलाप किया’
  rationale: गीज़ का ዲበ संबंधसूचक है और ‘के कारण/ऊपर/विषय में’ जैसी छटा दे सकता है; हिन्दी में ‘के कारण’ प्रसंगगत उत्तरदायित्व की संभावना रखता है, जबकि टिप्पणी विकल्पों को दर्ज करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण दर्शनात्मक गद्य। ‘नोचकर खा रहे थे’ हिंसक भक्षण को स्वाभाविक हिन्दी में व्यक्त करता है। प्रतीकात्मक पशु-छवियों को बिना ऐतिहासिक व्याख्या जोड़े सुरक्षित रखा गया है।
