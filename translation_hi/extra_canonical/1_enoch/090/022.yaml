- source_word: ብእሲ
  choice: पुरुष
  rationale: यह शब्द सामान्यतः पुरुष व्यक्ति को सूचित करता है। ‘पुरुष’ दर्शन में दिखाई देने वाले मानवीय रूप को बनाए रखता है।
- source_word: ዘይጽሕፍ በቅድሜሁ
  choice: जो उसके सामने लिख रहा था
  rationale: सापेक्ष क्रियारूप चल रही लेखन-क्रिया बताता है और በቅድሜሁ का स्थानगत अर्थ ‘उसके सामने’ है।
- source_word: ፯እምነ ዝኩ ፯ጻዕዳው
  choice: उन सात श्वेत जनों में से एक
  rationale: यह अनुवाद संख्या और श्वेत रंग की दर्शनीय प्रतीकात्मकता बनाए रखता है, बिना इन प्राणियों की पहचान का अतिरिक्त निर्धारण किए।
- source_word: ንሥኦሙ
  choice: उन ... को ले आओ
  rationale: आज्ञार्थक क्रिया लेने अथवा पकड़कर लाने का व्यापक अर्थ रखती है। न्याय के प्रसंग में ‘ले आओ’ स्वाभाविक है और हिरासत की सटीक रीति को अनिर्धारित छोड़ता है।
- source_word: ፸ኖሎት
  choice: सत्तर चरवाहे
  rationale: ‘चरवाहे’ पशु-दर्शन के केंद्रीय रूपक को सुरक्षित रखता है; इसे ‘स्वर्गदूत’ या ‘शासक’ कहना व्याख्यात्मक विस्तार होता।
- source_word: መጠውክዎሙ አባግዐተ
  choice: जिन्हें मैंने भेड़ें सौंपी थीं
  rationale: क्रिया किसी को उत्तरदायित्व में सौंपने का भाव रखती है और ‘भेड़ें’ मूल के आवर्ती प्रतीक को स्पष्ट रूप से बनाए रखता है।
- source_word: ነሢኦሙ ቀተሉ
  choice: उन्होंने उन्हें अपने अधिकार में लेकर ... मार डाला
  rationale: कृदन्त और मुख्य क्रिया की क्रमिक संरचना सुरक्षित है। ‘अपने अधिकार में लेकर’ हिंदी में क्रिया-शृंखला को स्वाभाविक बनाता है, जबकि सर्वनाम की पुनरावृत्ति मूल के निकट रहती है।
- source_word: ብዙኃነ እምዘ አዘዝክዎሙ
  choice: मेरी आज्ञा से कहीं अधिक को
  rationale: यह वाक्यांश दी गई सीमा से संख्यात्मक अतिक्रमण बताता है। ‘कहीं अधिक’ दोषपूर्ण अतिरेक को व्यक्त करता है, पर यह नहीं कहता कि कोई आज्ञा दी ही नहीं गई थी।
theological_decisions:
- issue: ‘सत्तर चरवाहों’ की पहचान
  choice: मुख्य पाठ में प्रतीकात्मक पद ‘सत्तर चरवाहे’ बनाए रखा गया है।
  alternative: सत्तर स्वर्गदूत; सत्तर शासक
  rationale: दर्शन जानबूझकर पशुपालन-संबंधी प्रतीकों में बात करता है। पहचान खोल देना रहस्योद्घाटनात्मक बिंब को समतल कर देता।
- issue: चरवाहों की हिंसा और दी गई आज्ञा
  choice: चरवाहों ने वास्तविक आज्ञा की निर्धारित सीमा से अधिक हत्या की।
  alternative: उन्होंने बिना किसी आज्ञा के हत्या की; उन्होंने केवल पहले से ठहराई हुई संख्या से अधिक हत्या की
  rationale: गीज़ वाक्यरचना सबसे स्वाभाविक रूप से उन्हें दी गई आज्ञा से अतिक्रमण व्यक्त करती है। इससे सौंपे गए न्याय और प्रतिनिधियों द्वारा उसके दुरुपयोग के बीच का धार्मिक तनाव बना रहता है।
- issue: कथन-क्रिया की पुनरावृत्ति
  choice: ‘उसने ... कहा ... और उससे कहा’ दोनों कथन-क्रियाएँ रखी गई हैं।
  alternative: दूसरी ‘कहा’ को हटाकर वाक्य को सुगम बनाना
  rationale: मूल में व्यवधानकारी परिचय के बाद कथन का पुनरारंभ स्पष्ट रूप से दोहराया गया है; इसे शैलीगत असुविधा मानकर हटाना स्रोत की कथात्मक बनावट को बदल देता।
