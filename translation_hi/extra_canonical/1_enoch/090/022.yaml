  text: And he said to that man who was writing before him[a], who was one of those seven white ones, and he said to him, “Take those seventy shepherds to whom I delivered the sheep; and they, taking them[c][b], killed many more than I commanded them.”
translation:
  language: hi
  text: और उसने उस पुरुष से कहा जो उसके सामने लिख रहा था—वह उन सात श्वेत जनों में से एक था—और उससे कहा, “उन सत्तर चरवाहों को ले आओ, जिन्हें मैंने भेड़ें सौंपी थीं[a]; और उन्होंने उन्हें[b] लेकर, जितनों को मारने की मैंने उन्हें आज्ञा दी थी, उनसे कहीं अधिक को मार डाला[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सौंपी थीं’ का अनुवाद ‘हवाले की थीं’ भी हो सकता है; मूल क्रिया किसी वस्तु को दूसरे की देखरेख या अधिकार में देने पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘उन्हें’ का निकटतम प्रसंगगत संकेत भेड़ों की ओर है; मूल में सर्वनाम ही प्रयुक्त है।
    reason: referent_clarification
  - marker: c
    text: अर्थ यह है कि चरवाहों ने जितनों को मारने की आज्ञा उन्हें दी गई थी, उससे अधिक को मार डाला; यह नहीं कि उन्हें कोई आज्ञा दी ही नहीं गई थी।
    reason: ambiguity_preservation
