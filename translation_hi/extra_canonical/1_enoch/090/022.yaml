  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली अपनाई गई है। ‘श्वेत जन’ और ‘चरवाहे’ जैसे शब्द दर्शनीय प्रतीकवाद बनाए रखते हैं। मूल की पुनरुक्त कथन-रचना को जानबूझकर सुरक्षित रखा गया है, और अत्यधिक संस्कृतनिष्ठ न्यायिक शब्दावली से बचा गया है।
