base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/010.yaml
  text: And it looked at them[a], [and their eyes were opened,] and it cried out to the sheep and said to them[c][b], “Look!” and they all ran to it.
translation:
  language: hi
  text: और उसने उनकी ओर देखा[a], [और उनकी आँखें खोल दी गईं,] और उसने भेड़ों को पुकारा और उनसे कहा, “उसे देखो!” और वे सब उसके पास दौड़े[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसके बाद का वाक्यांश—‘और उनकी आँखें खोल दी गईं’—उपलब्ध इथियोपिक पाठ में कोष्ठकों में है, जो पाठ की अनिश्चितता का संकेत देता है।
    reason: textual_variant
  - marker: b
    text: ‘उसके पास’ का संकेत दर्शन की एकवचन आकृति की ओर है; मूल पाठ उस आकृति की वास्तविक पहचान स्पष्ट नहीं करता।
    reason: referential_ambiguity
lexical_decisions:
- source_word: ወርእየ፡ ቦሙ
  choice: और उसने उनकी ओर देखा
  rationale: क्रिया को तृतीय पुरुष एकवचन मानकर अनुवाद किया गया है; ቦሙ को इस संदर्भ में दृष्टि की दिशा, ‘उनकी ओर’, के रूप में लिया गया है। इससे इसे प्रथम पुरुष दर्शनीय सूत्र ‘मैंने देखा’ मानने की समस्या से बचा जाता है।
- source_word: ወተፈትሐ፡ አዕይንቲሆሙ
  choice: '[और उनकी आँखें खोल दी गईं।]'
  rationale: वाक्यांश को मूल साक्ष्य के कोष्ठकों सहित रखा गया है, क्योंकि उसका पाठ अनिश्चित है। कर्मवाच्य अभिव्यक्ति मूल की संरचना को बनाए रखती है और यह नहीं बताती कि आँखें किसने खोलीं।
- source_word: ወጸርኀ፡ ሎሙ፡ ለአባግዕ
  choice: तब उसने भेड़ों को पुकारकर
  rationale: ጸርኀ प्रबल स्वर में पुकारने या चिल्लाने का भाव देता है। ‘पुकारकर’ आधुनिक हिन्दी में स्वाभाविक है और भेड़ों को संबोधित किए जाने को स्पष्ट रखता है।
- source_word: ወይቤላት፡ ርእይዎ
  choice: उनसे कहा, “उसे देखो!”
  rationale: 'ርእይዎ को बहुवचन आज्ञार्थक रूप और एकवचन कर्म-प्रत्यय के साथ समझा गया है: ‘उसे देखो’। संबोधन का सर्वनाम रूप भेड़ों के सामूहिक उल्लेख के अनुसार स्वाभाविक हिन्दी में बहुवचन रखा गया है।'
- source_word: ወሮጹ፡ ኵሎሙ፡ ኀቤሁ
  choice: और वे सब उसके पास दौड़े
  rationale: क्रिया का सीधा अर्थ ‘दौड़े’ है और ኀቤሁ गंतव्य की ओर जाने को व्यक्त करता है। हिन्दी का ‘उसके पास’ मूल के एकवचन संदर्भ को बनाए रखता है, बिना उस प्रतीकात्मक आकृति की पहचान तय किए।
theological_decisions:
- issue: एकवचन प्रतीकात्मक आकृति को मनुष्य के रूप में पहले से पहचान देना
  choice: सर्वनाम ‘उसे/उसके’ का प्रयोग कर पहचान को अनिर्धारित रखा गया
  alternative: किसी विशिष्ट मानवीय उपाधि या नाम का प्रयोग
  rationale: पशु-दर्शन की प्रतीकात्मक सतह को बनाए रखना उचित है। हिन्दी का सर्वनाम लिंग और सजीवता के बारे में अंग्रेज़ी ‘it/him’ जैसा कठोर भेद नहीं करता, इसलिए वह मूल की संदर्भगत अस्पष्टता को स्वाभाविक रूप से सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पशु-दर्शन की शब्दावली (‘भेड़ें’) तथा सर्वनामगत अस्पष्टता को बनाए रखा गया है। कोष्ठक पाठ-संदेह दिखाते हैं; सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
