base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/016.yaml
  text: And all the eagles and the vultures and the ravens and the kites gathered together and came with them, with all the wild sheep; and they all came together and helped one another so as to break the horn of that ram.
translation:
  language: hi
  text: और सब उकाब, गिद्ध, कौए और चीलें इकट्ठे हुए और सब जंगली भेड़ों के साथ आए। वे सब एक साथ आए और उस मेढ़े का सींग तोड़ने के लिए एक-दूसरे की सहायता की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አንስርት
  choice: उकाब
  rationale: यह बहुवचन पक्षी-संज्ञा सामान्यतः eagle के अर्थ में ली जाती है; आधुनिक हिन्दी में ‘उकाब’ सटीक और बोधगम्य है।
- source_word: ዓውስት
  choice: गिद्ध
  rationale: पक्षियों की इस प्रतीकात्मक सूची में प्रचलित अर्थ vulture को स्वाभाविक हिन्दी ‘गिद्ध’ से व्यक्त किया गया है।
- source_word: ቋዓት
  choice: कौए
  rationale: मूल के बहुवचन ravens/crows के लिए साधारण आधुनिक हिन्दी रूप चुना गया है।
- source_word: ሀባይ
  choice: चीलें
  rationale: यहाँ kite नामक शिकारी पक्षी अभिप्रेत है; हिन्दी ‘चील’ अंग्रेज़ी-आधारित ‘काइट’ से अधिक स्वाभाविक है।
- source_word: አባግዕ፡ ገዳም
  choice: जंगली भेड़ें
  rationale: शाब्दिक संरचना ‘वन/जंगल की भेड़ें’ है; पशु-दृष्टान्त की शब्दावली बनाए रखते हुए ‘जंगली भेड़ें’ रखा गया है।
- source_word: ይቀትቅጥዎ
  choice: तोड़ डालें
  rationale: क्रिया का आशय प्रहार करके तोड़ने या चकनाचूर करने का है; ‘तोड़ डालें’ बल को बनाए रखते हुए सहज हिन्दी है।
- source_word: ቀርነ፡ ... ይቤላ
  choice: उस मेढ़े के सींग
  rationale: मूल में ‘उस ram का horn’ एकवचन है; दृष्टान्त की विशिष्टता बनाए रखने के लिए ‘उस मेढ़े के सींग’ रखा गया है।
theological_decisions:
- issue: पशु-दृष्टान्त की प्रतीकात्मक पहचान
  choice: पाठ में पशुओं और पक्षियों के नाम यथावत रखे गए हैं।
  alternative: उन्हें सीधे ऐतिहासिक राष्ट्रों या समूहों के नामों से बदलना।
  rationale: मूल इस पद में प्रतीकों की व्याख्या नहीं करता; किसी विशिष्ट ऐतिहासिक या सांप्रदायिक पहचान को अनुवाद में आरोपित नहीं किया गया।
- issue: ‘सींग तोड़ने’ की तीव्रता
  choice: ‘सींग को तोड़ डालें’
  alternative: ‘सींग को नष्ट कर दें’ या ‘चकनाचूर कर दें’
  rationale: यह मूल की हिंसक क्रिया को बनाए रखता है, पर अर्थ को पूर्ण विनाश की किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या तक नहीं बढ़ाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। पशु-दृष्टान्त की पुनरावृत्ति और सामूहिक कार्रवाई स्पष्ट रखी गई है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
