base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/018.yaml
  text: And I saw until the Lord of the sheep came to them, and he took in his hand the staff of wrath and struck the earth; and the earth split open, and all the beasts and all the birds of heaven fell away from among those sheep and sank into the earth, and it covered over them.
translation:
  language: hi
  text: और मैं देखता रहा, जब तक कि भेड़ों का प्रभु उनके पास आया। उसने अपने हाथ में क्रोध की लाठी ली और धरती पर प्रहार किया; तब धरती फट गई[a], और सारे जंगली पशु तथा आकाश के सारे पक्षी[b] उन भेड़ों के बीच से गिरकर धरती में धँस गए, और धरती ने उन्हें ढक लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धरती चीर दी गई।” गीइज़ वाक्यांश कठिन है, पर आगे पशुओं और पक्षियों के धरती में धँसने तथा धरती के उन्हें ढक लेने से भूमि के खुलने का अर्थ सूचित होता है।
    reason: lexical_alternative
  - marker: b
    text: “जंगली पशु” और “आकाश के पक्षी” इस पशु-दृष्टांत की प्रतीकात्मक भाषा को आगे बढ़ाते हैं; वे केवल साधारण जीवों के बजाय विरोधी शक्तियों को दर्शाते प्रतीत होते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: እግዚአ አባግዕ
  choice: भेड़ों का प्रभु
  rationale: ‘प्रभु’ मूल के स्वामी/अधिपति के अर्थ और इस प्रतीकात्मक दर्शन के धर्मवैचारिक भार, दोनों को बनाए रखता है; ‘भेड़ों’ से पशु-दृष्टांत की छवि सुरक्षित रहती है।
- source_word: በትር መዓተ
  choice: क्रोध की लाठी
  rationale: ‘लाठी’ चरवाहे और भेड़ों की छवि के अनुकूल है, जबकि ‘क्रोध’ न्यायकारी तीव्रता व्यक्त करता है। मूल में ‘उसके’ का सर्वनाम-प्रत्यय नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: ዘበጣ ለምድር
  choice: धरती पर प्रहार किया
  rationale: यह निर्णायक और शक्तिशाली आघात को आधुनिक, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ተሰጠተ ምድር
  choice: धरती फट गई
  rationale: रूप की कठिनाई के बावजूद अगले वाक्य में प्राणियों का धरती में धँसना और उसका उन्हें ढक लेना भूमि के खुलने या फटने का संकेत देता है। वैकल्पिक निष्क्रिय अर्थ पादटिप्पणी में रखा गया है।
- source_word: ወድቁ እምዝኩ አባግዕ
  choice: उन भेड़ों के बीच से गिरकर
  rationale: यह नीचे गिरने के साथ भेड़ों के बीच से अलग हो जाने की स्थानिक और संबंधपरक सूक्ष्मता को बनाए रखता है।
- source_word: ተሰጥሙ በምድር
  choice: धरती में धँस गए
  rationale: अगली क्रिया—धरती द्वारा ढक लिए जाने—के साथ यह क्रम स्वाभाविक बैठता है और निगले जाने अथवा स्वयं धँसने के बीच अनावश्यक निर्णय नहीं करता।
- source_word: ከደነት ዲቤሆሙ
  choice: धरती ने उन्हें ढक लिया
  rationale: स्त्रीलिंग एकवचन क्रिया का कर्ता स्वाभाविक रूप से धरती है; यह दफन और न्याय की सजीव छवि को सुरक्षित रखता है।
theological_decisions:
- issue: पशु-दृष्टांत में ईश्वरीय उपाधि
  choice: भेड़ों का प्रभु
  alternative: भेड़ों का स्वामी
  rationale: ‘प्रभु’ परमेश्वर की सार्वभौमिक सत्ता और दृष्टांत की भाषा दोनों को बनाए रखता है, पर किसी बाद की विशिष्ट मसीही पहचान को पाठ में नहीं जोड़ता।
- issue: न्याय का साधन
  choice: क्रोध की लाठी
  alternative: उसके क्रोध की लाठी
  rationale: मूल በትር መዓተ में तीसरे पुरुष का स्वामित्वसूचक प्रत्यय नहीं है। इसलिए ‘उसके’ जोड़ने के बजाय शाब्दिक अस्पष्टता और न्यायकारी छवि को सुरक्षित रखा गया है।
- issue: पशुओं और पक्षियों का प्रतीकात्मक स्वरूप
  choice: मुख्य पाठ में प्रतीक को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: मुख्य पाठ में उन्हें सीधे शत्रु शक्तियाँ कहना
  rationale: दर्शन की पशु-प्रतीकात्मक भाषा को अनूदित करना उचित है; उसकी संभावित व्याख्या पादटिप्पणी में दी गई है ताकि पाठ स्वयं अधिक निश्चित न बनाया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। वाक्य की दर्शनात्मक क्रमबद्धता बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ या पुरातन शब्दावली से बचा गया है। ‘और मैं देखता रहा’ निरंतर दर्शन की अनुभूति देता है; अर्धविराम न्यायकारी प्रहार और उसके परिणाम के बीच स्पष्ट संबंध रखता है।
