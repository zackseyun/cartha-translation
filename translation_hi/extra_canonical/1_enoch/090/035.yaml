base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/035.yaml
  text: And the eyes of them all were opened[a], and they saw well[b], and there was not one among them that did not see.
translation:
  language: hi
  text: और उन सबकी आँखें खुल गईं[a], और वे अच्छी तरह देखने लगे[b]; उनमें कोई भी ऐसा नहीं था जो न देखता हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: निष्क्रिय/परिणामी रूप यह नहीं बताता कि उनकी आँखें किसने खोलीं।
    reason: grammatical_clarity
  - marker: b
    text: या संभवतः, “जो अच्छा था उसे देखा” अथवा “अच्छी वस्तुएँ देखीं।” गीइज़ शब्द को यहाँ क्रियाविशेषण, “अच्छी तरह,” समझना प्रसंग के अधिक अनुकूल है।
    reason: lexical_alternative
