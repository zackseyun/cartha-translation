  rationale: यह निष्क्रिय रूप को बनाए रखता है और दृष्टि के पुनःस्थापन का प्रलय-साहित्यिक बिंब स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ሠናየ
  choice: अच्छी तरह
  rationale: यहाँ कर्मकारक रूप क्रियाविशेषण के रूप में ‘भली-भाँति/अच्छी तरह’ अर्थ दे सकता है; पूर्ववर्ती अंधेपन के संदर्भ में यह पुनःस्थापित स्पष्ट दृष्टि को दर्शाता है, बिना किसी देखी गई वस्तु को अनावश्यक रूप से निर्दिष्ट किए।
- source_word: ዘኢይሬኢ አልቦ
  choice: एक भी ऐसा न था जो देख न सकता हो
  rationale: यह मूल की बलात्मक नकारात्मक रचना को पठनीय हिन्दी में बनाए रखता है और ‘अंधा’ जोड़कर मुहावरे की अति-व्याख्या नहीं करता।
- source_word: በማእከሎሙ
  choice: उनके बीच
  rationale: यह मूल के ‘उनके मध्य’ अर्थ का स्वाभाविक आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: दर्शन में पुनःस्थापित देखने की प्रकृति
  choice: दृष्टि के शाब्दिक-दर्शनात्मक पुनःस्थापन का बिंब बनाए रखा गया है।
  alternative: इसे स्पष्ट रूप से आत्मिक समझ मिलने या रूपकात्मक अंधापन दूर होने के रूप में कहना।
  rationale: स्वप्न-दर्शनों में खुली आँखें प्रतीकात्मक कथा-जगत का अंग हैं। अनुवाद उस बिंब को सुरक्षित रखता है और उसके धर्मवैचारिक अर्थ का निर्णय पाठक पर छोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और दृश्यात्मक शैली। ‘देखने लगे’ परिणामस्वरूप प्राप्त क्षमता को स्वाभाविक रूप से व्यक्त करता है, जबकि अंतिम उपवाक्य मूल की बलात्मक नकारात्मकता बनाए रखता है।
