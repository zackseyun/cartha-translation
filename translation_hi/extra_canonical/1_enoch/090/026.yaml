  text: And I saw at that time that a similar deep abyss was opened in the middle of the earth[a], full of fire; and they brought those blinded sheep, and all of them were judged and were found to be sinners, and they were cast into that deep abyss of fire, and they burned[f][e][d][c][b]. And this abyss came to be at the right side of that house.
translation:
  language: hi
  text: और मैंने उस समय देखा कि पृथ्वी के बीचोंबीच वैसी ही एक गहरी खाई[a], आग से भरी हुई, खोली गई। तब वे उन अंधी कर दी गई भेड़ों[b] को ले आए। उन सबका न्याय किया गया और वे पापी पाई गईं[c]; फिर उन्हें आग की उस गहरी खाई में डाल दिया गया, और वे जल गईं। यह खाई उस भवन के दाहिनी ओर हो गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गहरा गर्त’। गीइज़ शब्द बहुत अधिक गहराई का बोध कराता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अंधी कर दी गई भेड़ें’ इस दर्शन की पशु-प्रतीकात्मक भाषा का भाग हैं; यहाँ भेड़ें वास्तविक पशुओं के बजाय दर्शन में लोगों का प्रतिनिधित्व करती हैं।
    reason: cultural_note
  - marker: c
    text: अधिक शाब्दिक रूप में, ‘उनका न्याय किया गया और वे पापी हुईं।’ न्यायिक प्रसंग में इसका अर्थ यह हो सकता है कि न्याय ने उन्हें पापी पाया, न कि वे उसी समय पाप करने लगीं।
    reason: alternative_reading
lexical_decisions:
- source_word: ተርኅወ
  choice: खोली गई
  rationale: कर्मवाच्य रूप मूल पाठ के अचानक खुलने वाले दर्शनात्मक दृश्य को बिना उसके साधन या कर्ता की व्याख्या किए सुरक्षित रखता है।
- source_word: ማዕምቅ
  choice: गहरी खाई
  rationale: यह शब्द अत्यधिक गहराई का बोध कराता है। सामान्य हिन्दी में ‘गहरी खाई’ सहज है और प्रलयदर्शी दृश्य की गंभीरता भी बनाए रखती है।
- source_word: ምሉዕ እሳተ
  choice: आग से भरी हुई
  rationale: यह मूल बिंब का सीधा और स्वाभाविक हिन्दी रूप है; ‘आग’ मूल के एकवचन/सामूहिक भाव को सुरक्षित रखती है।
- source_word: አምጽእዎሙ
  choice: ले आए
  rationale: क्रिया किसी को वहाँ लाने का भाव देती है और मूल की तरह कर्ताओं को अनिर्दिष्ट छोड़ती है।
- source_word: እልኩ አባግዕ ጽዑላነ
  choice: उन अंधी कर दी गई भेड़ों
  rationale: यह रूप केवल स्थायी शारीरिक दशा बताने के बजाय पहले उत्पन्न की गई दशा की संभावित कृदंतीय बारीकी को सुरक्षित रखता है।
- source_word: ተኰነኑ
  choice: न्याय किया गया
  rationale: न्यायिक अर्थ को बनाए रखते हुए यह अगले वाक्यांश से पहले ही ‘दोषी ठहराया गया’ जैसा निश्चित परिणाम नहीं जोड़ता।
- source_word: ወኮኑ ኃጥኣነ
  choice: वे पापी पाई गईं
  rationale: न्यायिक प्रसंग में यह निर्णय द्वारा उनकी पापी स्थिति प्रकट होने का भाव देता है और ऐसा संकेत नहीं करता कि न्याय ने उन्हें पापी बना दिया।
- source_word: ተወድዩ
  choice: डाल दिया गया
  rationale: यह कर्मवाच्य और गंभीर न्यायिक क्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ውዕዩ
  choice: वे जल गईं
  rationale: संक्षिप्त और सजीव रूप मूल क्रिया की तीव्रता बनाए रखता है; इसका अर्थ ‘भस्म हो गईं’ कहकर अधिक निश्चित नहीं किया गया।
- source_word: በየማኑ ለዝኩ ቤት
  choice: उस भवन के दाहिनी ओर
  rationale: स्थान-सूचक अर्थ और दूरवाची ‘उस’ दोनों सुरक्षित हैं; ‘भवन’ दर्शन में पहले उल्लिखित संरचना को गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: भेड़ों का अंधापन केवल शारीरिक है या दर्शन के भीतर नैतिक/न्यायिक प्रतीक भी है
  choice: अंधी कर दी गई भेड़ें
  alternative: अंधी भेड़ें
  rationale: कृदंतीय रूप पूर्व में उत्पन्न की गई दशा की संभावना बचाता है, पर उसके प्रतीकात्मक अर्थ को मुख्य पाठ में समझाकर निश्चित नहीं करता।
- issue: ‘उनका न्याय हुआ और वे पापी हुईं’ के न्यायिक क्रम का अर्थ
  choice: 'दोनों खंड अलग रखे गए: ‘न्याय किया गया और वे पापी पाई गईं’'
  alternative: ‘उन्हें पापी ठहराकर दोषी घोषित किया गया’ अथवा अधिक शाब्दिक ‘वे पापी हो गईं’
  rationale: अलग क्रम मूल की पुनरुक्त न्यायिक संरचना सुरक्षित रखता है। ‘पाई गईं’ प्रसंगगत घोषणात्मक अर्थ देता है, जबकि पाप की शुरुआत न्याय के बाद हुई ऐसा भ्रामक संकेत टालता है।
- issue: निकटवाची खाई और दूरवाची भवन का भेद
  choice: ‘यह खाई’ और ‘उस भवन’
  alternative: दोनों के लिए ‘वह/उस’
  rationale: मूल में ዝንቱ (‘यह’) और ዝኩ (‘वह/उस’) का स्पष्ट अंतर है, इसलिए दोनों संकेतवाचकों का भेद रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और दर्शनात्मक लहजा रखा गया है। लंबे गीइज़ वाक्य को पठनीयता के लिए छोटे वाक्यों में बाँटा गया है, पर घटनाओं का क्रम, कर्मवाच्य न्यायिक भाषा, निकट/दूर संकेतवाचक भेद और मूल की संभावित अर्थगत तनातनी सुरक्षित रखी गई है।
