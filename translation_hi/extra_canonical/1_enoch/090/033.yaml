base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/033.yaml
  text: And all those that had been scattered and dispersed[a], and all the beasts of the field and all the birds of heaven, were gathered into that house; and the Lord of the sheep rejoiced with great joy[c][b], because they had all become good and had entered into his house.
translation:
  language: hi
  text: और वे सभी जो नष्ट हो गए थे और तितर-बितर हो गए थे[a], और वन के सब जंगली पशु और आकाश के सब पक्षी, उस भवन में इकट्ठे किए गए। तब भेड़ों का प्रभु बहुत आनंदित हुआ, क्योंकि वे सब अच्छे हो गए थे और उसके भवन में प्रवेश कर चुके थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नष्ट हो गए थे’ का अनुवाद ‘खो गए थे’ या ‘नाश हो गए थे’ भी किया जा सकता है। इसके बाद का अलग क्रियापद उनके तितर-बितर होने का भाव व्यक्त करता है; दोनों क्रियाएँ साथ मिलकर विनाश और बिखराव की छवि रखती हैं।
    reason: lexical_alternative
  - marker: b
    text: ‘उस भवन’ और ‘उसके भवन’ दर्शन में पुनर्स्थापित निवास या मंदिर की छवि की ओर संकेत करते हैं, केवल किसी साधारण इमारत की ओर नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: ተሐጕሉ
  choice: नष्ट हो गए थे
  rationale: ሐጕለ का अर्थ नष्ट होना, मिट जाना या खो जाना हो सकता है। अगले पृथक क्रियापद ተዘርዘሩ से इसे अलग रखते हुए यहाँ विनाश का प्रबल अर्थ सुरक्षित रखा गया है; इससे दर्शन में पूर्व विनाश और पुनर्स्थापन की तनावपूर्ण छवि बनी रहती है।
- source_word: ተዘርዘሩ
  choice: तितर-बितर हो गए थे
  rationale: यह बिखराव या फैलाव व्यक्त करता है और पहले क्रियापद से भिन्न पुनर्संग्रह की छवि को स्पष्ट रखता है।
- source_word: አራዊተ ገዳም
  choice: मैदान के सब जंगली पशु
  rationale: አራዊት जंगली पशुओं और ገዳም खुले, निर्जन या वन्य क्षेत्र का बोध देता है। यह हिंदी में स्वाभाविक रहते हुए पशुओं के वन्य चरित्र को बनाए रखता है।
- source_word: አዕዋፈ ሰማይ
  choice: आकाश के सब पक्षी
  rationale: मूल की उन्नत, बाइबलीय अभिव्यक्ति का निकट और स्वाभाविक हिंदी रूप।
- source_word: ተጋብኡ
  choice: इकट्ठे किए गए
  rationale: निष्क्रिय रूप रखा गया है, जिससे संग्राहक की पहचान मूल की तरह अव्यक्त रहती है।
- source_word: በውእቱ ቤት
  choice: उस भवन में
  rationale: गति-सूचक क्रिया के साथ लक्ष्य का भाव है। 'भवन' साधारण मकान की अपेक्षा दर्शन के पुनर्स्थापित पवित्र निवास की गरिमा को बेहतर रखता है, पर अर्थ को स्पष्टतः मंदिर तक सीमित नहीं करता।
- source_word: እግዚኦሙ ለአባግዕ
  choice: भेड़ों का प्रभु
  rationale: पशु-दर्शन में प्रयुक्त प्रतीकात्मक ईश्वरीय उपाधि को बिना सामान्यीकृत किए सुरक्षित रखा गया है।
- source_word: ተፈሥሐ ዐቢየ ፍሥሐ
  choice: बड़े आनंद से आनंदित हुआ
  rationale: मूल की सजातीय संज्ञा-क्रिया रचना और उसके बलाघात को हिंदी में जानबूझकर बनाए रखा गया है।
- source_word: ኄራነ
  choice: अच्छे
  rationale: शब्द की व्यापक नैतिक और पुनर्स्थापनात्मक अर्थ-सीमा रखी गई है; 'धर्मी' कहकर इसे किसी अधिक तकनीकी धर्मवैज्ञानिक अर्थ तक सीमित नहीं किया गया।
- source_word: ገብኡ ውስተ ቤቱ
  choice: उसके भवन में प्रवेश कर चुके थे
  rationale: पूर्ण हुई प्रवेश-क्रिया को व्यक्त करता है और 'उसके' को निकटवर्ती 'भेड़ों का प्रभु' से जोड़ता है।
theological_decisions:
- issue: ተሐጕሉ का अर्थ और संभावित पुनर्जीवन-संकेत
  choice: '''नष्ट हो गए थे'' रखा गया'
  alternative: '''बिखर गए थे'' या ''खो गए थे'''
  rationale: शब्दकोशीय सीमा में विनाश/नाश का अर्थ गंभीरता से उपस्थित है और अगले 'तितर-बितर' से अलग अर्थ देता है। फिर भी अनुवाद स्पष्ट रूप से 'मरे हुओं में से जी उठे' नहीं कहता, क्योंकि वह निष्कर्ष मूल वाक्य में प्रत्यक्ष नहीं है।
- issue: '''भेड़ों का प्रभु'' का संकेत'
  choice: प्रतीकात्मक ईश्वरीय उपाधि को यथावत रखा गया
  alternative: '''उनका स्वामी'' या ''भेड़ों का मालिक'''
  rationale: पशु-दर्शन की केंद्रीय प्रतीकात्मक भाषा और ऊँचे धार्मिक रजिस्टर को सुरक्षित रखने के लिए।
- issue: ኄራነ में नैतिक पुनर्स्थापन
  choice: '''अच्छे हो गए थे'''
  alternative: '''धर्मी हो गए थे'' या ''सीधे हो गए थे'''
  rationale: '''अच्छे'' मूल की व्यापकता और नैतिक परिवर्तन दोनों रखता है, बिना किसी विशिष्ट धर्मवैज्ञानिक श्रेणी को आरोपित किए।'
- issue: भवन की पहचान
  choice: मुख्य पाठ में 'भवन', पादटिप्पणी में पुनर्स्थापित निवास/मंदिर की संभावित छवि
  alternative: मुख्य पाठ में सीधे 'मंदिर'
  rationale: दर्शन का संदर्भ पवित्र और पुनर्स्थापित निवास की ओर संकेत करता है, पर मूल संज्ञा सामान्यतः घर/भवन है; इसलिए प्रतीक को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सहज और दर्शन-संगत रजिस्टर रखा गया है। सजातीय अभिव्यक्ति 'बड़े आनंद से आनंदित हुआ' मूल की विशेष बलवत्ता सुरक्षित रखने के लिए जानबूझकर रखी गई है।
