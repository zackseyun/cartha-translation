base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/012.yaml
  text: And those ravens fought and battled with him[a], and they wanted to remove his horn[c][b], but they did not prevail against him.
translation:
  language: hi
  text: और वे कौए उससे[a] लड़े और भिड़े। वे उसका सींग[b] हटा देना[c] चाहते थे, पर वे उस पर प्रबल न हो सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके साथ”; यहाँ प्रसंग शत्रुतापूर्ण संघर्ष का है।
    reason: lexical_alternative
  - marker: b
    text: “सींग” दर्शन की प्रतीकात्मक छवि है; इसे “शक्ति” या “सामर्थ्य” कहकर व्याख्यायित नहीं किया गया है।
    reason: cultural_note
  - marker: c
    text: या, “दूर कर देना”; कुछ पुराने अनुवादों में “गिरा देना”।
    reason: translation_alternative
lexical_decisions:
- source_word: እልኩ
  choice: वे कौए
  rationale: पशु-दर्शन की ठोस प्रतीकात्मक छवि बनाए रखने के लिए पक्षी को सामान्यीकृत न करके ‘कौए’ कहा गया है।
- source_word: ቋዓት፡ ይትጋደሉ፡ ወይትባአሱ
  choice: लड़े और भिड़े
  rationale: मूल में संघर्षसूचक क्रियाओं की पुनरुक्ति तीव्रता पैदा करती है; हिन्दी में दो स्वाभाविक क्रियाओं द्वारा इसे बनाए रखा गया है।
- source_word: ምስሌሁ
  choice: उससे
  rationale: पूर्वसर्ग का शाब्दिक अर्थ ‘उसके साथ’ है, पर शत्रुतापूर्ण संघर्ष के प्रसंग में आधुनिक हिन्दी का ‘उससे लड़ना’ स्वाभाविक और अर्थानुकूल है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: ፈቀዱ
  choice: चाहते थे
  rationale: यह इच्छा या अभिप्राय व्यक्त करता है और मूल से अधिक निश्चित योजना का भाव नहीं जोड़ता।
- source_word: ያእትቱ
  choice: हटा देना
  rationale: क्रिया का प्रमुख अर्थ हटाना, दूर करना या ले लेना है; यह पुराने मुहावरेदार अनुवाद ‘गिरा देना’ की अपेक्षा अधिक सटीक है।
- source_word: ቀርኖ
  choice: उसका सींग
  rationale: दर्शन की प्रतीकात्मक छवि को व्याख्यात्मक रूप से ‘शक्ति’ या ‘सामर्थ्य’ में बदलने के बजाय शाब्दिक संज्ञा रखी गई है।
- source_word: አእህሉዎ
  choice: वे उस पर प्रबल न हो सके
  rationale: यह उनके प्रयत्न की असफलता और उस व्यक्ति पर विजय न पा सकने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘सींग’ के प्रतीक की मुख्य पाठ में व्याख्या करना या न करना
  choice: ‘सींग’ को शाब्दिक रूप में बनाए रखना
  alternative: उसकी शक्ति / उसका शासन / उसका सामर्थ्य
  rationale: पशु-दर्शन अपनी बात प्रतीकों के माध्यम से कहता है। अनुवाद में ही प्रतीक का अर्थ तय कर देना मूल की बहुअर्थी दर्शनात्मक छवि को सीमित कर देगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संघर्षसूचक दो क्रियाओं की मूल पुनरुक्ति को ‘लड़े और भिड़े’ से सुरक्षित रखा गया है। वाक्य-विभाजन हिन्दी की पठनीयता के लिए किया गया है, बिना घटनाक्रम या आशय बदले।
