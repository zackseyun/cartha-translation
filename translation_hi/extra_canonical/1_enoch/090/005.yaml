- source_word: እስከ ዘመን
  choice: उस समय तक
  rationale: दृष्टि की समय-सीमा को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: ይሬዐዩ
  choice: चरवाहे चरा रहे थे
  rationale: यह रूप ርዕየ, ‘चराना/चरवाही करना,’ से है; इसमें ዐ है और इसे ‘देखना’ वाले ርእየ से अलग रखना आवश्यक है। पशु-दर्शन में संदर्भ चरवाहों का है।
- source_word: ፳ወ፫
  choice: तेईस
  rationale: गीज़ अंक का सीधा रूपांतरण।
- source_word: ወፈጸሙ
  choice: पूरे किए
  rationale: किसी गिनी हुई मात्रा को पूर्ण करने का अर्थ स्वाभाविक रूप से देता है।
- source_word: በበጊዜሆሙ
  choice: अपने-अपने समय में
  rationale: दोहराए गए በበ- की वितरणात्मक शक्ति को सुरक्षित रखता है।
- source_word: ፶ወ፰ጊዜያተ
  choice: अट्ठावन काल
  rationale: ጊዜያተ गिने हुए समयों या अवधियों को सूचित कर सकता है; हिन्दी में ‘काल’ मूल की अस्पष्टता को ‘बार’ की अपेक्षा बेहतर बनाए रखता है।
