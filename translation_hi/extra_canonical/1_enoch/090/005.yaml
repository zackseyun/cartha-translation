translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण पर सामान्य पाठक के लिए सहज रखी गई है। ‘चरवाहे चरा रहे थे’ से मूल क्रिया और पशु-दर्शन का संदर्भ दोनों सामने आते हैं। ‘कुल’ हिन्दी वाक्य में पूर्ण की गई संख्या को स्पष्ट करता है, पर कोई अतिरिक्त कालक्रम-व्याख्या नहीं जोड़ता।
