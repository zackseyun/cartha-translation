base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/005.yaml
  text: And I saw until the time when twenty-three were shepherding[a], and they completed, in their respective times[c][b], fifty-eight times.
translation:
  language: hi
  text: और मैंने उस समय तक देखा जब तेईस चरवाहे चरवाही कर रहे थे,[a] और उन्होंने अपने-अपने समय में अट्ठावन अवधियाँ पूरी कीं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ क्रिया का अर्थ यहाँ ‘चराना’ या ‘चरवाही करना’ है। यह ‘देखना’ के लिए प्रयुक्त मिलती-जुलती क्रिया से भिन्न है; प्रसंग में ये गिने गए चरवाहे हैं।
    reason: lexical_clarification
  - marker: b
    text: शाब्दिक रूप से ‘अट्ठावन समय’; इससे गिनी हुई अवधियाँ या नियत काल अभिप्रेत हो सकते हैं। उनकी ठीक अवधि या ऐतिहासिक पहचान यहाँ स्पष्ट नहीं की गई है।
    reason: lexical_alternative
