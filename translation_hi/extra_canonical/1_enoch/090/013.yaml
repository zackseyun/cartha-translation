base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/013.yaml
  text: And I saw until the shepherds and the eagles and the vultures and the kites came[a], and they cried out to the ravens to break the horn of that ram; and they fought and battled with him, and he fought with them[c][b], and cried out that his help might come.
translation:
  language: hi
  text: '**1 हनोक 90:13**


    और मैं देखता रहा, जब तक चरवाहे, उकाब, वे गिद्ध और चीलें आ नहीं गए।[a] उन्होंने कौवों को पुकारकर कहा कि वे उस मेढ़े का सींग तोड़ डालें।[b] वे उससे लड़े और उससे युद्ध किया; वह भी उनसे लड़ा और पुकारा कि उसकी सहायता आ जाए।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इन शिकारी पक्षियों की ठीक प्रजातियाँ निश्चित नहीं हैं; इनके लिए ‘बाज़’ या मिलते-जुलते नाम भी दिए जाते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “उस नर बकरे का सींग।”
    reason: lexical_alternative
  - marker: c
    text: या, “उसका सहायक आ जाए।” मूल संज्ञा का अर्थ ‘सहायता’ या ‘सहायक’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ኖላዊያን
  choice: चरवाहे
  rationale: यह शब्द सामान्यतः चरवाहों या रखवालों को दर्शाता है। पशु-दर्शन में इसकी स्थापित प्रतीकात्मक छवि बनाए रखने के लिए व्याख्यात्मक पदवी के बजाय ‘चरवाहे’ रखा गया है।
- source_word: አንስርት … አውስት … ሀባይ
  choice: उकाब … गिद्ध … चीलें
  rationale: पाठ में शिकारी पक्षियों की अलग-अलग श्रेणियाँ दी गई हैं। हिंदी में ‘उकाब’, ‘गिद्ध’ और ‘चील’ इस भेद को यथासंभव बनाए रखते हैं, यद्यपि प्रजातियों की ठीक पहचान अनिश्चित है।
- source_word: ዝኩ
  choice: वे
  rationale: गिद्धों के साथ आया संकेतवाचक रूप मुख्य पाठ में रखा गया है, भले ही हिंदी में उसका संदर्भ कुछ असामान्य लगे।
- source_word: ቋዓት
  choice: कौवों
  rationale: नवीन पाठ-समीक्षा के अनुसार यह शब्द पुकारे जाने वाले पक्षियों का द्योतक है, न कि उस नर पशु का जिसका सींग तोड़ा जाना है। ‘कौवे’ इस कॉर्विड पक्षी-छवि का सहज हिंदी रूप है।
- source_word: ይቀትቅጥዎ
  choice: तोड़ डालें
  rationale: क्रिया में हिंसक ढंग से तोड़ने या कुचलने का भाव है। ‘तोड़ डालें’ आधुनिक हिंदी में उस बल को स्पष्ट करता है, पर ‘चकनाचूर कर दें’ जितना विशेष अर्थ आरोपित नहीं करता।
- source_word: ቀርኖ ለዝኩ ይቤላ
  choice: उस मेढ़े का सींग
  rationale: वाक्यांश एक निश्चित नर, सींगवाले पशु के सींग की ओर संकेत करता है। संदर्भ और संशोधित पाठ-समीक्षा के अनुसार ‘मेढ़ा’ मुख्य पाठ के लिए उपयुक्त है; ‘नर बकरा’ संभावित विकल्प के रूप में पादटिप्पणी में दिया गया है।
- source_word: ረዳኢቱ
  choice: उसकी सहायता
  rationale: इस संज्ञा का अर्थ अमूर्त ‘सहायता’ या व्यक्ति-वाचक ‘सहायक’ हो सकता है। मुख्य पाठ में सहज ‘सहायता’ रखा गया है और दूसरी संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: पशु-दर्शन में आक्रमणकारी पात्रों की पहचान
  choice: चरवाहों और विभिन्न पशु-पक्षियों की शाब्दिक प्रतीकात्मक छवियाँ बनाए रखी गई हैं।
  alternative: मुख्य पाठ में उन्हें किसी विशेष ऐतिहासिक शासक, सेना या जाति के रूप में पहचानना।
  rationale: मूल दर्शन जानबूझकर प्रतीकात्मक भाषा में है; ऐतिहासिक पहचान जोड़ने से पाठ की वास्तविक अस्पष्टता समय से पहले समाप्त हो जाएगी।
- issue: मेढ़े की पुकार का लक्ष्य
  choice: ‘उसकी सहायता आ पहुँचे’
  alternative: ‘उसका सहायक आ पहुँचे’
  rationale: गीज़ संज्ञा सहायता और सहायक—दोनों अर्थ दे सकती है। मुख्य पाठ अमूर्त अर्थ रखता है, जबकि व्यक्ति-वाचक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिंदी में रखी गई है। दर्शन की पुनरुक्त युद्ध-भाषा (‘भिड़े’, ‘युद्ध करने लगे’, ‘लड़ता रहा’) तथा पशु-प्रतीकों को संक्षिप्त व्याख्या में बदलने के बजाय सुरक्षित रखा गया है।
