base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/037.yaml
  text: And I saw that a white bull was born[a], and its horns were great[c][b]; and all the beasts of the field and all the birds of heaven feared it and entreated it at all times.
translation:
  language: hi
  text: और मैंने देखा कि एक सफेद बैल[a] पैदा हुआ और उसके सींग बड़े थे। जंगल के सभी पशु और आकाश के सभी पक्षी उससे डरते थे और हर समय उससे विनती करते थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पशु-प्रतीकों वाले इस दर्शन में सफेद बैल एक प्रतीकात्मक पात्र है; मुख्य पाठ उसकी पहचान किसी विशेष व्यक्ति के रूप में तय नहीं करता।
    reason: cultural_note
  - marker: b
    text: इस क्रिया का अर्थ ‘उससे याचना करते थे’ या अधिक प्रबल रूप में ‘उसके सामने गिड़गिड़ाते थे’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ተወልደ
  choice: जन्मा
  rationale: निष्क्रिय जन्म-संबंधी मूल भाव को स्वाभाविक हिन्दी में व्यक्त करता है और दर्शन के वृत्तांत में कोई व्याख्यात्मक विस्तार नहीं जोड़ता।
- source_word: ላህም
  choice: बैल
  rationale: यह नर गोवंश का स्पष्ट बोध कराता है और आगे आए बड़े सींगों के उल्लेख तथा पशु-दर्शन की प्रतीकात्मक छवि से मेल खाता है।
- source_word: ጻዕዳ
  choice: सफेद
  rationale: रंग को शाब्दिक रखा गया है, क्योंकि इस दर्शन में रंग प्रतीकात्मक महत्त्व रखता है।
- source_word: አቅርንቲሁ ዐበይት
  choice: उसके सींग बड़े थे
  rationale: ठोस सींग-छवि और आकार अथवा महत्ता की सम्भावित व्यापकता को बनाए रखता है, बिना उसे सीधे सैन्य शक्ति के रूप में समझाए।
- source_word: አራዊተ ገዳም
  choice: जंगल के सभी पशु
  rationale: यह वन्य पशुओं का स्वाभाविक आधुनिक हिन्दी रूप है और दर्शन में पशुओं की श्रेणी को सुरक्षित रखता है।
- source_word: አዕዋፈ ሰማይ
  choice: आकाश के सभी पक्षी
  rationale: मूल की ऊँची, दर्शनात्मक शैली को सहज हिन्दी में बनाए रखता है।
- source_word: ይፈርህዎ
  choice: उससे डरते थे
  rationale: नए जन्मे बैल के प्रति समस्त प्राणियों के भय को सीधे और स्पष्ट रूप से व्यक्त करता है।
- source_word: ያስተበቍዕዎ
  choice: उससे विनती करते थे
  rationale: क्रिया में निहित आग्रह, याचना और दीन निवेदन की प्रबलता को ‘कृपा चाहते थे’ जैसे हल्के परोक्ष रूप की अपेक्षा बेहतर सुरक्षित रखता है।
- source_word: በኵሉ ጊዜ
  choice: हर समय
  rationale: मूल पदबंध के निरन्तर और सर्वव्यापी काल-बोध को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: सफेद बैल की पहचान को अनुवाद में स्पष्ट करना या न करना
  choice: मुख्य पाठ में उसे केवल प्रतीकात्मक पशु-रूप ‘सफेद बैल’ के रूप में रखा गया है।
  alternative: उसे किसी मानव शासक या मसीही व्यक्तित्व के रूप में स्पष्ट कर देना।
  rationale: पशु-दर्शन स्वयं प्रतीकात्मक छवियों के माध्यम से बोलता है। अनुवाद को प्रतीक की सम्भावित पहचान तय करने के बजाय मूल दर्शन की अस्पष्टता और धार्मिक तनाव सुरक्षित रखना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दर्शनात्मक शैली रखी गई है। वाक्यरचना सहज है, जबकि ‘सफेद बैल’, ‘आकाश के पक्षी’ और ‘विनती’ जैसे पद मूल की प्रतीकात्मक तथा ऊँची भाषा को सुरक्षित रखते हैं।
