base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/031.yaml
  text: And after that[a], those three clothed in white who had taken me by the hand, who had brought me up before, and the hand of that ram holding me[c][b], brought me up and set me down in the midst of those sheep before the judgment took place.
translation:
  language: hi
  text: और इसके बाद,[a] वे तीनों, जो श्वेत वस्त्र पहने हुए थे और जिन्होंने मेरा हाथ थामा था—जिन्होंने पहले मुझे ऊपर पहुँचाया था—और उस मेढ़े का हाथ, जो मुझे थामे हुए था, मुझे ऊपर ले गए और उन भेड़ों[b] के बीच बिठा दिया, न्याय होने से पहले।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘इसके बाद’ वाला गीइज़ पदबंध कालसूचक है; इसका अर्थ यहाँ ‘उनमें से’ नहीं है।
    reason: textual_variant
  - marker: b
    text: ‘भेड़ें’ पशु-दर्शन की प्रतीकात्मक भाषा का भाग हैं, जिसमें मानव-समूह पशुओं के रूप में दिखाए जाते हैं।
    reason: cultural_note
  - marker: c
    text: इस पद का पाठ और वाक्य-विन्यास कठिन है। विशेषतः उपलब्ध प्रतिलिपि में ‘मेढ़ा’ पढ़ा जाने वाला शब्द विकृत रूप में है, और ‘पहले मुझे ऊपर पहुँचाया था’ वाला उपवाक्य भी पाठगत अनिश्चितता रखता है।
    reason: textual_variant
lexical_decisions:
- source_word: ወእምኔሁ
  choice: और इसके बाद
  rationale: यह पदबंध यहाँ कालसूचक है; इसे ‘उनमें से’ न मानकर घटनाक्रम में ‘इसके बाद’ के रूप में प्रस्तुत किया गया है।
- source_word: እልኩ ፫እለ ይለብሱ ጸዓዳወ
  choice: वे तीनों, जो श्वेत वस्त्र पहने हुए थे
  rationale: पाठ तीन आकृतियों की जाति स्पष्ट नहीं करता। ‘तीनों’ उनकी पहचान खुली रखता है, जबकि ‘श्वेत वस्त्र’ दर्शनात्मक छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: አኃዙኒ በእዴየ
  choice: जिन्होंने मेरा हाथ थामा था
  rationale: यह मार्गदर्शन और सहारा देने की क्रिया है; ‘पकड़ लिया’ की अपेक्षा ‘हाथ थामा’ संदर्भानुकूल और स्वाभाविक है।
- source_word: እለ ቀደሙ አዕረጉኒ
  choice: वे मुझे पहले भी ऊपर ले आए थे
  rationale: ቀደሙ को पूर्वकालिक ‘पहले’ और አዕረጉኒ को ऊपर ले आने की क्रिया माना गया है; कठिन उपवाक्य को अलग रखते हुए उसका संभावित अर्थ सुरक्षित रखा गया है।
- source_word: እዴሁ ለውእቱ ዴቤላ እንዘ ትእኅዘኒ
  choice: उस मेढ़े का हाथ मुझे थामे हुए था
  rationale: प्राप्त OCR के ይቤላ को संदर्भ और पाठालोचन के आधार पर ዴቤላ, ‘मेढ़ा’, माना गया है। हाथ का असामान्य बिंब मूल प्रतीकात्मक कथन के अनुरूप ज्यों का त्यों रखा गया है।
- source_word: አዕረጉኒ ወአንበሩኒ ማእከሎሙ ለዝኩ አባግዕት
  choice: वे मुझे ऊपर ले गए और उन भेड़ों के बीच बैठा दिया
  rationale: दोनों मुख्य क्रियाओं—ऊपर ले जाना और बीच में स्थापित/बैठाना—को स्पष्ट रखा गया है तथा पशु-दर्शन की ‘भेड़ों’ वाली प्रतीकात्मक भाषा नहीं समझाई गई।
- source_word: እንበለ ትኩን ኵነኔ
  choice: इससे पहले कि न्याय होता
  rationale: अंतिम पदबंध को आगामी न्याय से पहले की समयावधि के रूप में प्रस्तुत किया गया है, बिना किसी बाद की धर्मवैज्ञानिक धारणा को जोड़े।
theological_decisions:
- issue: श्वेत वस्त्र पहने तीन आकृतियों की पहचान
  choice: उन्हें केवल ‘वे तीनों’ कहा गया है।
  alternative: तीन स्वर्गदूत; तीन पुरुष
  rationale: दिए गए गीइज़ पाठ में उनकी श्रेणी स्पष्ट रूप से नामित नहीं है; अतः पहचान को अनिर्णीत रखा गया है।
- issue: मेढ़े के मानवीय ‘हाथ’ का बिंब
  choice: ‘उस मेढ़े का हाथ’ अक्षुण्ण रखा गया है।
  alternative: मेढ़े ने मुझे थामा; उस अगुए ने मेरा हाथ थामा
  rationale: पशु-दर्शन की प्रतीकात्मक और कुछ हद तक असामान्य भाषा को सामान्य बनाकर उसकी धर्मवैज्ञानिक या साहित्यिक तनावशीलता नहीं मिटाई गई।
- issue: अंतिम न्याय-वाक्य का कालगत अर्थ
  choice: ‘इससे पहले कि न्याय होता’
  alternative: जब तक न्याय न आया; न्याय से पहले
  rationale: यह आगामी न्याय की कथा-सापेक्ष प्रत्याशा को व्यक्त करता है, पर न्याय के स्वरूप पर अतिरिक्त सिद्धान्त नहीं आरोपित करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक और सर्वसुलभ शैली अपनाई गई है। ‘स्वर्गदूत’ जैसी अनुल्लिखित पहचान नहीं जोड़ी गई; पशु-दर्शन की प्रतीकात्मक शब्दावली और मूल पाठ की कठिनता को मुख्य पाठ तथा टिप्पणियों में सुरक्षित रखा गया है।
