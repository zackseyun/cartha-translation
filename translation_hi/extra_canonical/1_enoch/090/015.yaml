base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/015.yaml
  text: And I watched until the Lord of the sheep came to them in wrath[a], and all who saw him fled[c][b], and they all fell into the shadow before his face.
translation:
  language: hi
  text: और मैं देखता रहा, जब तक भेड़ों का प्रभु क्रोध में उनके पास न आया; और जितनों ने उसे देखा, वे सब भाग गए, और वे सब उसके सामने से छाया में गिर पड़े।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके मुख के सामने से छाया में।” “उसके सामने से” में मूल का अपादानार्थक भाव बना रहता है; “छाया” का ठीक आशय अनिश्चित है।
    reason: मूल की अपादानार्थक रचना तथा ‘छाया’ के अस्पष्ट बिंब को स्पष्ट करना।
lexical_decisions:
- source_word: ርኢኩ
  choice: मैं देखता रहा
  rationale: दर्शन-वर्णन में क्रिया निरंतर अवलोकन का भाव देती है; यह केवल एक क्षण के ‘देखने’ की अपेक्षा अधिक उपयुक्त है।
- source_word: እስከ መጽአ
  choice: जब तक ... न आया
  rationale: यह रचना दर्शन के जारी रहने को निर्णायक आगमन तक व्यक्त करती है और हिन्दी में स्वाभाविक है।
- source_word: እግዚአ አባግዕ
  choice: भेड़ों का प्रभु
  rationale: पशु-दर्शन की रूपकात्मक भाषा और इस उपाधि का ईश्वरीय तथा अधिकारपूर्ण भार दोनों सुरक्षित रहते हैं।
- source_word: በመዓት
  choice: क्रोध में
  rationale: आगमन की रीति और न्याय संबंधी गंभीरता व्यक्त होती है; ‘क्रोधित होकर’ की अपेक्षा मूल की पूर्वसर्गीय संरचना के अधिक निकट है।
- source_word: እለ ርእይዎ ኵሎሙ
  choice: जितनों ने उसे देखा ... वे सब
  rationale: सामूहिक संबंधवाचक रचना और ‘सब’ का समग्र बल स्वाभाविक हिन्दी में बना रहता है।
- source_word: ነፍጹ
  choice: भाग गए
  rationale: यह भय से आकस्मिक पलायन को स्पष्ट, वर्तमान और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ወወድቁ ኵሎሙ
  choice: जा गिरे
  rationale: गति के प्रसंग में गिर पड़ने का परिणाम व्यक्त होता है; पूर्ववर्ती ‘वे सब’ मूल में दोहराए गए समग्र भाव को वाक्य में वहन करता है।
- source_word: ውስተ ጽላሎት
  choice: छाया में
  rationale: मूल का शाब्दिक बिंब सुरक्षित रखा गया है; इसे ‘अंधकार’, अधोलोक या किसी विशिष्ट दंड-स्थान के रूप में अनावश्यक रूप से नहीं समझाया गया।
- source_word: እምቅድመ ገጹ
  choice: उसके मुख के सामने से
  rationale: እም का अपादानार्थक ‘से’ तथा ‘मुख के सामने’ का सजीव उपस्थिति-बिंब दोनों सुरक्षित हैं; हिन्दी क्रम इसे गिरने की गति से जोड़ता है।
theological_decisions:
- issue: ‘भेड़ों का प्रभु’ की पहचान
  choice: पशु-दर्शन में भेड़ों पर सार्वभौम अधिकार रखने वाले परमेश्वर की उपाधि
  alternative: रूपक के भीतर केवल ‘भेड़ों का स्वामी’
  rationale: व्यापक साहित्यिक प्रसंग में यह न्याय करने वाले पारलौकिक शासक की स्थिर उपाधि है। ‘प्रभु’ उसका धार्मिक भार रखता है, पर बाद की किसी विशिष्ट मसीही पहचान को पाठ में नहीं जोड़ता।
- issue: ‘छाया’ का आशय
  choice: अस्पष्ट और अशुभ स्थान-बिंब को यथावत रखना
  alternative: इसे स्पष्टतः ‘अंधकार’, ‘अधोलोक’ या दंड-स्थान कहना
  rationale: मूल शब्द छाया/छाँह को सूचित करता है; संदर्भ में इसका स्वर अशुभ है, किंतु अधिक निश्चित व्याख्या पाठ से आगे जाएगी।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण दर्शन-वर्णन। ‘मैं देखता रहा’, ‘प्रभु’ और ‘क्रोध में’ ऊँचे किंतु सुबोध स्तर को बनाए रखते हैं। विरामचिह्न लंबे गीइज़ समन्वित वाक्य को स्पष्ट करते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
