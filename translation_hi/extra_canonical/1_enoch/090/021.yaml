base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/021.yaml
  text: And the Lord of the sheep called those seven first white ones and commanded that they bring before him[a], beginning with the first star that went before those stars whose private parts were like those of horses, that first one which went out before them[e][d][c][b]; and they brought them before him.
translation:
  language: hi
  text: और भेड़ों के प्रभु ने उन पहले सात श्वेत पुरुषों को बुलाया और उन्हें आज्ञा दी कि वे उन तारों को उसके सामने लाएँ—आरम्भ उस पहले तारे से करें जो उन तारों के आगे चला था जिनके गुप्तांग घोड़ों के गुप्तांगों जैसे थे[b][c]—और उस पहले तारे से, जो उनके आगे निकल गया था[a]; और वे उन्हें उसके सामने ले आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोष्ठकों में सुरक्षित यह उपवाक्य गीज़ पाठ में कठिन है। संभवतः यह किसी अलग पात्र का उल्लेख नहीं, बल्कि आगे चलने वाले उसी पहले तारे की फिर से पहचान कराता है।
    reason: textual_variant
  - marker: b
    text: इस दर्शन में ‘तारे’ स्वर्गीय प्राणियों के प्रतीक हैं; मुख्य पाठ ने व्याख्या के स्थान पर मूल छवि को बनाए रखा है।
    reason: cross_reference
  - marker: c
    text: घोड़ों से की गई यह तुलना जानबूझकर लज्जाजनक यौन छवि है और संभवतः विद्रोही स्वर्गीय प्राणियों के अपराध की ओर संकेत करती है।
    reason: cultural_note
lexical_decisions:
- source_word: እግዚአ ሰብኡ
  choice: भेड़ों के प्रभु
  rationale: दर्शन की पशु-प्रतीकात्मक भाषा में यह उपाधि परमेश्वर के लिए है। ‘प्रभु’ अधिकार और गरिमापूर्ण शैली को बनाए रखता है।
- source_word: ሰብአ ፯ጸዓድወ ቀዳማዊያን
  choice: पहले सात श्वेत पुरुषों
  rationale: ሰብአ स्पष्ट रूप से ‘पुरुषों’ को सूचित करता है; ፯, ጸዓድወ और ቀዳማዊያን क्रमशः सात, श्वेत और पहले का बोध देते हैं। इससे इस दर्शन का प्रतीकात्मक भेद भी बना रहता है, जिसमें स्वर्गीय प्राणी पुरुषों के रूप में दिखाई देते हैं।
- source_word: ያምጽኡ ቅድሜሁ
  choice: उसके सामने लाएँ
  rationale: यह न्यायिक प्रस्तुति का स्वाभाविक हिन्दी पदबंध है और मूल की प्रक्रिया-संबंधी शक्ति बनाए रखता है।
- source_word: እምክቡበ ቀዳማዊ ዘይቀድም እምነ ዝኩ ከዋክብት
  choice: आरम्भ उस पहले तारे से करें जो उन तारों के आगे चला था
  rationale: እም को यहाँ आरम्भ-बिंदु बताने वाला मानना न्याय के क्रम को स्पष्ट करता है; ‘आगे चला था’ अग्रता और क्रम दोनों को सुरक्षित रखता है।
- source_word: ከዋክብት
  choice: तारे
  rationale: मूल का दृश्य-प्रतीक सुरक्षित रखा गया है; इसे मुख्य पाठ में ‘स्वर्गदूत’ कहकर व्याख्यात्मक रूप से सपाट नहीं किया गया।
- source_word: ኃፍረቶሙ ከመ ኃፍረተ አፍራስ
  choice: जिनके गुप्तांग घोड़ों के गुप्तांगों जैसे थे
  rationale: यह स्पष्ट किन्तु गरिमापूर्ण हिन्दी है और मूल की जानबूझकर लज्जाजनक यौन छवि को छिपाती नहीं।
- source_word: '[ወሰነኩበ፡ ቀዳማዊ፡ ዘወፅአ፡ ቅድመ፡]'
  choice: अर्थात उस पहले तारे से, जो उनके आगे निकल गया था
  rationale: कोष्ठकित पाठ कठिन है; उपलब्ध समीक्षा के अनुसार विकृत रूप में ‘तारा’ निहित हो सकता है। अनुवाद इसे पहले तारे की पुनः पहचान मानता है, किसी अलग पात्र का परिचय नहीं।
- source_word: ወአምጽእዎሙ ለእሎሙ ቅድሜሁ
  choice: और वे उन्हें उसके सामने ले आए
  rationale: बहुवचन कर्म पूर्वोक्त तारों की ओर संकेत करता है; मूल की प्रक्रियात्मक पुनरावृत्ति बनाए रखी गई है।
theological_decisions:
- issue: क्या ‘तारों’ की व्याख्या मुख्य पाठ में सीधे स्वर्गीय प्राणियों के रूप में की जाए
  choice: मुख्य पाठ में ‘तारे’ रखा गया
  alternative: ‘स्वर्गदूत’ या ‘स्वर्गीय प्राणी’
  rationale: यह दर्शन प्रतीकों के माध्यम से बोलता है; छवि को बनाए रखना पाठ की साहित्यिक और धर्मवैचारिक जटिलता का सम्मान करता है।
- issue: सात श्वेत पात्रों के लिए संज्ञा
  choice: ‘पुरुषों’
  alternative: ‘जनों’ या केवल ‘श्वेतों’
  rationale: गीज़ ሰብአ में पुरुषों की संज्ञा स्पष्ट है। इसे हटाने से दर्शन की प्रतीकात्मक संरचना का एक अर्थपूर्ण भेद लुप्त हो सकता है।
- issue: यौन अंगों के वर्णन की स्पष्टता
  choice: ‘गुप्तांग घोड़ों के गुप्तांगों जैसे थे’
  alternative: अधिक सांकेतिक ‘लज्जा के अंग’ अथवा अधिक चिकित्सकीय शब्दावली
  rationale: यह चयन मूल की लज्जाजनक और पशुवत यौन-विकृति की छवि को स्पष्ट रखता है, पर अनावश्यक रूप से चिकित्सकीय नहीं बनता।
- issue: कठिन कोष्ठकित उपवाक्य की पहचान
  choice: इसे उसी पहले तारे की पुनः पहचान के रूप में प्रस्तुत किया गया
  alternative: इसे किसी अलग ‘पहले जन’ का परिचय मानना
  rationale: पाठगत कठिनाई के कारण निर्णायक समरसता उचित नहीं; मुख्य पाठ में सहज संभावित अर्थ दिया गया और पादटिप्पणी में अनिश्चितता स्पष्ट की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध। अपोकैलिप्टिक प्रतीकों को ज्यों का त्यों रखा गया है। वाक्य की जटिलता घटाने के लिए डैश और ‘अर्थात’ का प्रयोग किया गया, पर मूल की पुनरावृत्ति और पाठगत तनाव सुरक्षित हैं।
