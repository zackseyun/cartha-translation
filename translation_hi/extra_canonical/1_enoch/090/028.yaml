base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/028.yaml
  text: And I stood watching until that old house was folded up[a]; and they carried out all the pillars, and all the beams and ornaments of that house were folded up with it[c][b], and they carried it out and set it down in one place in the south of the land.
translation:
  language: hi
  text: और मैं खड़ा रहा और देखता रहा, जब तक वह पुराना भवन समेट लिया गया[a]। उन्होंने सारे खंभे बाहर निकाल दिए; और उस भवन के सारे पौधे[b] और शहतीर भी उसके साथ समेट दिए गए। फिर वे उसे बाहर ले गए और देश के दक्षिण में[c] एक स्थान पर रख दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह क्रिया ‘लपेट दिया गया’ या ‘खोलकर हटा दिया गया’ भी कही जा सकती है। चित्र केवल भवन के नष्ट होने का नहीं, बल्कि उसे इकट्ठा करके हटा दिए जाने का है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सारे रोपे हुए पौधे’। स्रोत में सामान्य अर्थ ‘पौधे/रोपण’ है; कुछ अनुवाद इसे भवन की ‘सजावट’ समझते हैं।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक अर्थ ‘देश की दाहिनी ओर’ है। पूर्व की ओर मुख करके दिशा बताने की बाइबिलीय शैली में दाहिनी ओर सामान्यतः दक्षिण होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ቆምኩ፡ አርእይ
  choice: मैं खड़ा देखता रहा
  rationale: दर्शन-वृत्तांत में दोनों क्रियाओं का संयुक्त प्रयोग लगातार खड़े होकर देखते रहने का भाव देता है।
- source_word: ተጠወም / ተጠውሙ
  choice: समेट दिया गया / समेट दी गईं
  rationale: दोहराई गई क्रिया भवन और उसके अंगों को लपेटकर या इकट्ठा करके हटा दिए जाने का सजीव चित्र रखती है; केवल ‘ढा दिया गया’ कहना अर्थ को अनावश्यक रूप से सीमित करता।
- source_word: ቤት ብሉይ
  choice: पुराना भवन
  rationale: ‘भवन’ स्रोत के ‘घर/भवन’ को बनाए रखता है और मंदिर-संबंधी प्रतीक को सीधे अनुवाद में आरोपित नहीं करता।
- source_word: አውፅእዎሙ
  choice: बाहर निकाल दिए
  rationale: कारक क्रिया का अर्थ बाहर लाना या निकालना है; खंभों के भौतिक रूप से हटाए जाने के प्रसंग में यह स्वाभाविक है।
- source_word: አዕማድ
  choice: खंभे
  rationale: यह स्पष्ट वास्तुशिल्पीय शब्द है और सामान्य हिन्दी में सहज है।
- source_word: አትክልት
  choice: पौधे
  rationale: शब्द का सामान्य अर्थ पौधे या रोपण है। इसे ‘सजावट’ कहना स्रोत की ठोस वनस्पतिक छवि को खो देगा।
- source_word: ሤስ
  choice: कड़ियाँ
  rationale: यह भवन की लकड़ी की संरचनात्मक शहतीरों या कड़ियों की ओर संकेत करता है; ‘कड़ियाँ’ सामान्य हिन्दी में वास्तु-संदर्भ के अनुकूल है।
- source_word: ምስሌሁ
  choice: उसके साथ
  rationale: यह बताता है कि पौधे और कड़ियाँ भवन के साथ ही समेटी गईं।
- source_word: ወወደይዎ
  choice: रख दिया
  rationale: बाहर ले जाने के बाद वस्तु को किसी स्थान पर रखे जाने की भौतिक क्रिया को व्यक्त करता है।
- source_word: በ፪መካን
  choice: एक स्थान पर
  rationale: पाठ एक निश्चित, एकल स्थान का संकेत करता है।
- source_word: በየማነ ምድር
  choice: देश के दक्षिण में
  rationale: शाब्दिक ‘देश की दाहिनी ओर’ पूर्वाभिमुख दिशाबोध में दक्षिण को सूचित कर सकता है; मुख्य पाठ में स्वाभाविक दिशात्मक अर्थ रखा गया है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: क्या ‘पुराना भवन’ को सीधे ‘पुराना मंदिर’ कहा जाए
  choice: पुराना भवन
  alternative: पुराना मंदिर
  rationale: दर्शन में भवन की छवि मंदिर-संबंधी प्रतीक रख सकती है, पर स्रोत इसी पद में सामान्य ‘भवन/घर’ शब्द का प्रयोग करता है। इसलिए प्रतीकात्मक पहचान पाठक और व्यापक प्रसंग के लिए खुली रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण किंतु सहज रखी गई है। वाक्य-रचना दर्शन-वृत्तांत की क्रमिक गति बनाए रखती है। ‘समेटना’ जानबूझकर चुना गया है ताकि असामान्य प्रलयदर्शी चित्र और मूल क्रिया की अर्थगत अनिश्चितता बनी रहे।
