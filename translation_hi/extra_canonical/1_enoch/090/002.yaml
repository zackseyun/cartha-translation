base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/002.yaml
  text: And after that I saw in my vision all the birds of heaven coming—eagles[a], vultures, kites, and ravens—and the eagles led all the birds. And they began to devour those sheep[c][b], and to peck out their eyes and devour their flesh.
translation:
  language: hi
  text: इसके बाद मैंने अपने दर्शन में आकाश के सभी पक्षियों को आते देखा—उकाब, गिद्ध, चीलें और कौए[a]—और उकाब सभी पक्षियों की अगुवाई कर रहे थे।[c] तब वे उन भेड़ों को खाने लगे[b], उनकी आँखें चोंच से निकालने और उनका मांस खाने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इन पक्षियों के सटीक पक्षिवैज्ञानिक नाम निश्चित नहीं हैं। गीज़ शब्द शिकारी पक्षियों और कौआ-कुल के पक्षियों को दर्शाते हैं; कुछ नामों का अनुवाद दूसरे ढंग से भी किया जा सकता है, जैसे ‘चील’ के स्थान पर ‘बाज़’ या ‘कौए’ के स्थान पर ‘काले कौए’।
    reason: lexical_alternative
  - marker: b
    text: इस क्रिया-क्रम का अर्थ ‘उन्होंने उन्हें पकड़ लिया और खाने लगे’ भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'एक वैकल्पिक वाक्य-विभाजन है: ‘उकाब, गिद्ध, चीलें, कौए और उकाब—और वे सभी पक्षियों की अगुवाई कर रहे थे।’ पर गीज़ वाक्य-विन्यास में दूसरा ‘उकाब’ अगली क्रिया का कर्ता होना अधिक स्वाभाविक है।'
    reason: previous_rendering
lexical_decisions:
- source_word: ርኢኩ በራእየየ
  choice: मैंने अपने दर्शन में ... देखा
  rationale: प्रथम पुरुष में दर्शन के वृत्तांत और मूल के संबंधसूचक भाव, दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ኵሉ አዕዋፈ ሰማይ
  choice: आकाश के सभी पक्षी
  rationale: ‘आकाश’ ऊँची अपोकैलिप्टिक शैली को बनाए रखता है और आधुनिक पाठक के लिए सहज है।
- source_word: አንስርት
  choice: उकाब
  rationale: इथियोपिक बाइबिलीय प्रयोग में यह सामान्यतः बड़े शिकारी पक्षी, विशेषकर eagle, को दर्शाता है; ‘उकाब’ हिन्दी में अपेक्षाकृत विशिष्ट और गरिमापूर्ण नाम है।
- source_word: አውስት
  choice: गिद्ध
  rationale: शिकारी और मृतभक्षी पक्षियों की इस सूची में यह सबसे उपयुक्त सामान्य हिन्दी समतुल्य है।
- source_word: ሆባይ
  choice: चीलें
  rationale: यह छोटे शिकारी पक्षी के अर्थ को सहज हिन्दी में व्यक्त करता है, यद्यपि सटीक पक्षिवैज्ञानिक पहचान अनिश्चित है।
- source_word: ቋዓት
  choice: कौए
  rationale: यह कौआ-कुल के पक्षी को साधारण आधुनिक हिन्दी में स्पष्ट करता है; ‘काले कौए’ या अन्य अति-विशिष्ट रूप अनावश्यक हैं।
- source_word: ይመረሕዎሙ ለኵሎሙ አዕዋፍ
  choice: सभी पक्षियों की अगुवाई कर रहे थे
  rationale: क्रिया के नेतृत्व या मार्गदर्शन के भाव को स्पष्ट रखता है और दूसरे አንስርት को क्रिया का कर्ता मानता है।
- source_word: አኃዙ ይብልዕዎሙ
  choice: उन्हें खाने लगे
  rationale: आरंभसूचक क्रिया-क्रम को स्वाभाविक हिन्दी में व्यक्त करता है; वैकल्पिक ‘पकड़कर खाने लगे’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ዝኩ አባግዕ
  choice: उन भेड़ों
  rationale: दर्शन में पहले से उपस्थित भेड़ों की ओर संकेत करने वाले मूल के निदर्शक भाव को बनाए रखता है।
- source_word: ይክረዩ አዕይንቲሆሙ
  choice: चोंच मारकर उनकी आँखें निकालने लगे
  rationale: हमलावर पक्षियों की ठोस छवि को बनाए रखते हुए क्रूर क्रिया को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ይበልዕዎሙ ለሥጋሆሙ
  choice: उनका मांस खाने लगे
  rationale: मूल में खाने की पुनरावृत्ति और हिंसक शारीरिक बिंब को बिना अलंकरण के सुरक्षित रखता है।
theological_decisions:
- issue: पशु-दर्शन का प्रतीकवाद
  choice: पक्षियों और भेड़ों की दृश्यात्मक भाषा को मुख्य पाठ में ज्यों का त्यों रखा गया है।
  alternative: इन पशुओं को मुख्य पाठ में ही राष्ट्रों, शासकों या ऐतिहासिक समूहों के रूप में पहचानना।
  rationale: यह अंश रूपकात्मक दर्शन है, पर अनुवाद को उसके प्रतीकों का अर्थ किसी एक ऐतिहासिक या सांप्रदायिक व्याख्या से निश्चित नहीं करना चाहिए।
- issue: दूसरे አንስርት का वाक्यगत कार्य
  choice: दूसरी बार आए ‘उकाब’ को ‘अगुवाई कर रहे थे’ का स्पष्ट कर्ता माना गया है।
  alternative: 'इसे पक्षियों की सूची की पाँचवीं, दोहराई हुई मद मानना: ‘उकाब, गिद्ध, चीलें, कौए और उकाब—और वे...’।'
  rationale: गीज़ वाक्य-विन्यास में दूसरा አንስርት नेतृत्व करने वाली क्रिया का कर्ता अधिक स्वाभाविक रूप से है; फिर भी पुराने वैकल्पिक पाठ को पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु दर्शन की गरिमा और हिंसक दृश्यात्मकता को बनाए रखा गया है। ‘उकाब’ और ‘अगुवाई’ जैसे शब्द सामान्य पाठक के लिए समझने योग्य रहते हुए ऊँचे कथात्मक स्वर के अनुकूल हैं।
