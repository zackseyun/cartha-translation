base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/011.yaml
  text: And with that[a], all those eagles and vultures and ravens and kites kept snatching away the sheep even until now, and swooping down upon them and devouring them; but the sheep remained silent[e][d][c][b], and the rams lamented and cried out.
translation:
  language: hi
  text: और तब वे सब उकाब, गिद्ध, कौए और चीलें[a] अब तक भेड़ों को झपटकर ले जाते रहे, उन पर झपटते रहे और उन्हें निगलते रहे; पर भेड़ें मौन रहीं, और मेढ़े विलाप करते और पुकारते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इन चार पक्षी-नामों को दर्शन की ठोस पशु-पक्षी छवि बनाए रखने के लिए अलग-अलग जातियों के रूप में अनूदित किया गया है; कुछ नामों की सटीक प्रजातिगत पहचान अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: አንስርት
  choice: उकाब
  rationale: सूची में अगला शब्द गिद्ध के लिए है, इसलिए इस विशिष्ट शिकारी पक्षी को उकाब कहना अलग-अलग पक्षियों की ठोस छवि बनाए रखता है।
- source_word: አውስት
  choice: गिद्ध
  rationale: इसे አንስርት से अलग मृतभक्षी पक्षी के रूप में रखा गया है।
- source_word: ቋዓት
  choice: कौए
  rationale: नवीन स्रोत-समीक्षा के अनुसार यह पद कौओं को सूचित करता है और मूल सूची का क्रम बनाए रखा गया है।
- source_word: ሆባይ
  choice: चीलें
  rationale: नवीन स्रोत-समीक्षा इसे kite से पहचानती है; आधुनिक हिन्दी में इस पक्षी-समूह के लिए सहज शब्द 'चील' है।
- source_word: ይመስጥዎሙ
  choice: झपटकर ले जाती रहीं
  rationale: क्रिया हिंसक रीति से पकड़ने अथवा उठा ले जाने और प्रसंग में जारी क्रिया का भाव देती है।
- source_word: ይሰርሩ ዲቤሆሙ
  choice: उन पर झपटती
  rationale: ሰረረ का पक्षियों के प्रसंग में उड़कर या झपटकर ऊपर आने का भाव है; इससे आक्रमण की दृश्यात्मकता सुरक्षित रहती है।
- source_word: ይበልዕዎሙ
  choice: उन्हें निगलती रहीं
  rationale: यह भक्षण की हिंसक और सजीव छवि व्यक्त करता है।
- source_word: ያረምሙ
  choice: चुप रहीं
  rationale: क्रिया मौन रहने का सीधा भाव देती है; इसके बाद रोने वाले अलग कर्ता, मेढ़े, हैं।
- source_word: ይቤላት
  choice: मेढ़े
  rationale: यह क्रियाविशेष या रुदन की क्रिया नहीं, बल्कि मेढ़ों का बहुवचन संज्ञा-रूप है।
- source_word: የአወይዉ ወይጸርኁ
  choice: विलाप करते और पुकारते रहे
  rationale: दोनों क्रियाएँ शोक और ऊँची पुकार को व्यक्त करती हैं तथा उनका कर्ता मेढ़े हैं।
theological_decisions:
- issue: भेड़ों के मौन रहने और विलाप-पुकार के बीच कथित विरोध
  choice: विलाप और पुकार का कर्ता 'मेढ़े' रखा गया है
  alternative: विलाप और पुकार को भेड़ों से जोड़कर विरोध मानना
  rationale: गीज़ पाठ में ይቤላት 'मेढ़े' संज्ञा है; अतः यहाँ कोई वास्तविक विरोध नहीं है और कृत्रिम धर्मवैचारिक तनाव उत्पन्न नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली। निरंतर चलती हिंसक क्रियाओं के लिए 'जाती रहीं/झपटती/निगलती रहीं' रखा गया है। 'उकाब' बाइबिलीय पाठकों के लिए परिचित विशिष्ट पक्षी-नाम है, जबकि 'चील' आधुनिक हिन्दी में kite के लिए अधिक स्वाभाविक है।
