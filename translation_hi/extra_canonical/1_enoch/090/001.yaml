base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/001.yaml
  text: And I saw until the time when thirty-seven shepherds were pasturing in this way[a], and they all completed their periods, each in its time, like the former ones; and others received them into their hands, to pasture them in their times[c][b], each shepherd in its time.
translation:
  language: hi
  text: और मैंने उस समय को देखा, जब सैंतीस चरवाहे इस प्रकार झुंड चरा रहे थे। उन सबने पहले वालों की तरह अपने-अपने समय में अपनी अवधि पूरी की; फिर दूसरों ने उन्हें अपने हाथों में ले लिया[a], ताकि वे अपने-अपने समय में उन्हें चराएँ[b]—हर चरवाहा अपने समय में।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ में अधिकार सौंपे जाने वाला यह वाक्य संक्षिप्त है। आशय यह है कि एक दल अपनी अवधि पूरी करता है और दूसरा दल क्रम से झुंड की जिम्मेदारी अपने हाथ में लेता है।
    reason: textual_variant
  - marker: b
    text: यहाँ ‘उन्हें’ से आशय उस झुंड से है जिसे चरवाहे चराते हैं; मूल पाठ में सर्वनाम का संकेत संक्षिप्त है।
    reason: translation_clarity
  - marker: c
    text: ‘समय’ की पुनरावृत्ति बताती है कि हर चरवाहे की देखरेख एक अलग, सीमित अवधि में होती है, न कि अनिश्चित काल तक।
    reason: cultural_note
lexical_decisions:
- source_word: ወርኢኩ
  choice: और मैं ... देखता रहा
  rationale: दर्शन-वर्णन के मानक सूत्र ‘मैंने देखा’ को रखते हुए እስከ के साथ चलती हुई दृष्टि का स्वाभाविक हिन्दी रूप देता है।
- source_word: እስከ ዘመን ዘከመዝ
  choice: उस समय तक ... इस प्रकार
  rationale: እስከ ዘመን का कालगत अर्थ और ከመዝ का ‘इस प्रकार/ऐसे’ demonstrative बल, दोनों सुरक्षित रखे गए हैं।
- source_word: ይርዕዩ
  choice: झुंड चराते रहे
  rationale: चरवाहे और पशु-झुंड के रूपक को ठोस बनाए रखता है; ‘देखरेख करते रहे’ जैसा व्याख्यात्मक अमूर्तन नहीं करता। हिन्दी में सकर्मक प्रयोग स्पष्ट करने के लिए ‘झुंड’ निहित कर्म के रूप में जोड़ा गया है।
- source_word: ፴ወ፯ ኖላዊያን
  choice: सैंतीस चरवाहे
  rationale: संख्या को साहित्यिक पठनीयता के लिए शब्दों में लिखा गया है और प्रतीकात्मक पहचान की व्याख्या किए बिना ‘चरवाहे’ का रूपक रखा गया है।
- source_word: ፈጸሙ ኵሎሙ በበጊዜሆሙ
  choice: उन सबने अपने-अपने समय में अपनी अवधि पूरी की
  rationale: ፈጸሙ के पूर्ण करने के भाव और बाँटी हुई कालावधियों को सहज हिन्दी में व्यक्त करता है; ‘नियुक्त’ जोड़कर अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: ከመ ቀዳማዊያን
  choice: पहले वालों की तरह
  rationale: पूर्वोक्त चरवाहों की ओर संकेत को संक्षिप्त और स्वाभाविक ढंग से बनाए रखता है।
- source_word: በዐዳን ተመጠውዎሙ ውስተ እደዊሆሙ
  choice: दूसरों ने उन्हें अपने हाथों में ले लिया
  rationale: स्रोत की संक्षिप्त और कुछ अस्पष्ट कर्ता-कर्म रचना के साथ ‘हाथों में’ सौंपे जाने का बिंब सुरक्षित रहता है।
- source_word: ከመ ይርዐይዎሙ በበጊዜሆሙ
  choice: ताकि वे अपने-अपने समय में उन्हें चराएँ
  rationale: उद्देश्यवाचक उपवाक्य तथा चराने का पशु-रूपक दोनों रखता है।
- source_word: ኵሉ ኖላዊ በጊዜሁ
  choice: हर चरवाहा अपने समय में
  rationale: क्रमशः मिलने वाली अलग-अलग अवधियों पर स्रोत के समापनात्मक बल को सुरक्षित रखता है।
theological_decisions:
- issue: ‘चरवाहों’ की प्रतीकात्मक पहचान
  choice: मुख्य पाठ में केवल ‘चरवाहे’
  alternative: स्वर्गदूत, शासक या निरीक्षक
  rationale: यह पद प्रतीकात्मक पात्रों को चरवाहों के रूप में प्रस्तुत करता है; उनकी पहचान तय कर देना अनुवाद के बजाय व्याख्या होगी।
- issue: समय-अवधियों का स्वरूप
  choice: ‘अपने-अपने समय में अपनी अवधि’
  alternative: ‘अपने नियुक्त समय में’
  rationale: दोहराए गए ጊዜ के सीमित और क्रमिक कालखंडों को दर्शाया गया है, पर ‘नियुक्त’ जोड़कर उनके नियंता या धर्मवैज्ञानिक व्यवस्था को पाठ से अधिक स्पष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। पशु-दर्शन का ‘चरवाहे/चराना/झुंड’ रूपक ज्यों का त्यों रखा गया है। ‘अपने-अपने’ से वितरक भाव स्वाभाविक हिन्दी में व्यक्त होता है; सर्वनामों और हस्तांतरण-वाक्य की वास्तविक अस्पष्टता को पादटिप्पणी में स्वीकार किया गया है।
