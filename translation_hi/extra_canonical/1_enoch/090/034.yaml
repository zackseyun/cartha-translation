base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/034.yaml
  text: And I saw until they laid aside that sword which had been given to the sheep[a], and they brought it into the house and sealed it before the face of the Lord; and all the sheep were summoned into that house[e][d][c][b], and it did not contain them.
translation:
  language: hi
  text: और मैं देखता रहा, जब तक उन्होंने उस तलवार को, जो भेड़ों को दी गई थी, एक ओर रख दिया। फिर वे उसे घर में ले गए और प्रभु के सामने[a] मुहरबंद कर दिया। सभी भेड़ों को उस घर[b] में बुलाया गया, और वह घर उन सबको समाहित नहीं कर सका।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “प्रभु के मुख के सामने”; अर्थात “प्रभु की उपस्थिति में।”
    reason: lexical_alternative
  - marker: b
    text: मूल शब्द का सामान्य अर्थ “घर” है। दर्शन की प्रतीकात्मक भाषा में यह मंदिर या परमेश्वर के लोगों के भावी निवास का संकेत हो सकता है, पर पाठ स्वयं केवल “घर” कहता है।
    reason: cultural_note
  - marker: c
    text: अर्थात वह घर सभी भेड़ों को अपने भीतर समाहित नहीं कर सका।
    reason: lexical_alternative
lexical_decisions:
- source_word: አሰከብዎ
  choice: रख नहीं दिया
  rationale: मूल क्रिया किसी वस्तु को लिटाने या नीचे रख देने का भाव देती है। तलवार के प्रसंग में ‘रख दिया’ स्वाभाविक है और हथियार त्यागने के भाव को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
- source_word: ሰይፍ
  choice: तलवार
  rationale: यह हथियार का सीधा और प्रचलित हिन्दी पर्याय है तथा दर्शन के ठोस प्रतीक को बनाए रखता है।
- source_word: ተውህበ ለአባግዕ
  choice: भेड़ों को दी गई थी
  rationale: निष्क्रिय पूर्ण क्रिया पूर्व में तलवार दिए जाने की ओर संकेत करती है। ‘भेड़ों’ से पशु-दर्शन का प्रतीक और शब्दगत निरंतरता सुरक्षित रहती है।
- source_word: አግብእዎ ውስተ ቤት
  choice: उसे भवन में ले गए
  rationale: सर्वनाम का निकटतम संदर्भ तलवार है। ‘ले गए’ वस्तु को भीतर पहुँचाने का सीधा और स्वाभाविक अनुवाद है।
- source_word: ኀተማ እምቅድመ ገጹ ለእግዚእ
  choice: प्रभु के सामने उस पर मुहर लगा दी
  rationale: ‘प्रभु के सामने’ सामी उपस्थिति-सूचक मुहावरे का स्वाभाविक हिन्दी रूप है। ‘उस पर मुहर लगा दी’ तलवार को सुरक्षित रूप से बंद या जमा किए जाने की छवि को बनाए रखता है।
- source_word: ተጸውዑ
  choice: बुलाई गईं
  rationale: निष्क्रिय रूप सुरक्षित है और औपचारिक रूप से एकत्र किए जाने का भाव देता है।
- source_word: ወኢያገምሮሙ
  choice: पर वह उन सबको अपने में समा नहीं सका
  rationale: क्रिया का सीधा अर्थ समाहित या अंतर्विष्ट कर सकना है। ‘वह’ निकटवर्ती भवन को संदर्भित करता है, और ‘उन सबको’ भेड़ों की बहुलता स्पष्ट करता है।
theological_decisions:
- issue: እግዚእ शीर्षक का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ इस गंभीर दर्शनीय प्रसंग में स्वाभाविक धार्मिक उपाधि है, पर इसे किसी बाद की विशिष्ट मसीही पहचान से नहीं जोड़ा गया है।
- issue: ቤት की प्रतीकात्मक पहचान
  choice: भवन
  alternative: मन्दिर
  rationale: मूल पाठ केवल ‘घर/भवन’ कहता है। मुख्य पाठ में ‘मन्दिर’ करने से दर्शन की सम्भावित व्याख्या को पाठ में ही निश्चित कर दिया जाता; इसलिए प्रतीकात्मक तनाव सुरक्षित रखा गया है।
- issue: अंतिम वाक्य में कर्ता का संदर्भ
  choice: भवन उन सबको अपने में समा नहीं सका
  alternative: वह उनके लिए पर्याप्त नहीं था
  rationale: मूल क्रिया ‘समाहित करना’ का अधिक सीधा भाव देती है और निकटतम एकवचन पूर्वपद भवन है; फिर भी पादटिप्पणी में अर्थ-संबंध स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। दर्शन की पशु-प्रतीकात्मक भाषा को ज्यों का त्यों रखा गया है। लंबे मूल वाक्य को पठनीयता के लिए तीन वाक्यों में बाँटा गया, जबकि घटनाओं का क्रम और परस्पर संबंध सुरक्षित है।
