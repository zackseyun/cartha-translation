base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/008.yaml
  text: And I saw in the vision that ravens flew down upon those lambs[b][a], and they seized one of those lambs and dashed the sheep to pieces and devoured them.
translation:
  language: hi
  text: और मैंने उस दर्शन में देखा कि कौवे उन मेमनों पर उड़ते हुए झपट पड़े[b][a]। उन्होंने उन मेमनों में से एक को पकड़ लिया, भेड़ों को टुकड़े-टुकड़े कर डाला और उन्हें खा गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इथियोपिक पाठ आक्रमण झेल रहे झुंड के सदस्यों के लिए दो ऐसे शब्द प्रयोग करता है जिनके अर्थ ‘मेमने’ और ‘भेड़ें’ के बीच कुछ हद तक एक-दूसरे से मिल सकते हैं। शब्दावली में आए परिवर्तन को दिखाने के लिए यहाँ पहले ‘मेमने’ और बाद में ‘भेड़ें’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: ‘उड़ते हुए झपट पड़े’ अनूदित क्रिया को अधिक सामान्य अर्थ में ‘टूट पड़े’ या ‘आ पड़े’ भी समझा जा सकता है; पर कौवों के बिंब के कारण यहाँ पक्षियों की गति को स्पष्ट रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ፡ በራእይ
  choice: और मैंने उस दर्शन में देखा
  rationale: यह चल रहे दर्शन-वृत्तांत की प्रथम-पुरुष शैली को सहज और गरिमापूर्ण आधुनिक हिन्दी में बनाए रखता है।
- source_word: ቋዓተ
  choice: कौवे
  rationale: पशु-दर्शन में पक्षी की विशिष्ट पहचान और उसका प्रतीकात्मक दृश्य बनाए रखने के लिए सामान्य ‘काले पक्षी’ के बजाय ‘कौवे’ चुना गया।
- source_word: ከመ፡ ሰረሩ፡ ዲበ
  choice: उड़कर उतरे
  rationale: क्रिया के व्यापक अर्थ ‘टूट पड़े/आ पड़े’ की संभावना रहते हुए भी पक्षियों के संदर्भ में ऊपर से आक्रमण करने की गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: እልክቱ፡ መዓስእ
  choice: उन मेमनों
  rationale: यहाँ झुंड के छोटे या युवा सदस्यों का संकेत है और आगे प्रयुक्त ‘भेड़ों’ से शब्दगत भेद सुरक्षित रहता है।
- source_word: ወአኀዝዎ፡ ለአሐዱ፡ እምዝኩ፡ መዓስእ
  choice: उन्होंने उन मेमनों में से एक को पकड़ लिया
  rationale: मूल संरचना झुंड में से एक सदस्य को अलग करके हिंसापूर्वक पकड़ने का स्पष्ट संकेत देती है।
- source_word: ወቀጥቀጥዎሙ፡ ለአባግዕ
  choice: भेड़ों को टुकड़े-टुकड़े कर डाला
  rationale: पुनरुक्त, तीव्र क्रिया की हिंसक शक्ति को बनाए रखता है और बाद की बहुवचन सर्वनाम-संगति से मेल खाता है।
- source_word: ወበልዕዎሙ
  choice: और उन्हें खा गए
  rationale: यह सीधा, सजीव और आधुनिक हिन्दी प्रयोग है; हिंसक भक्षण का दृश्य बिना अनावश्यक साहित्यिक भारीपन के स्पष्ट रहता है।
theological_decisions:
- issue: पशु-प्रतीकों को अनुवाद में ही ऐतिहासिक या धार्मिक पात्रों के रूप में खोलना
  choice: कौवे, मेमने और भेड़ें—दर्शन के ठोस पशु-बिंब यथावत रखे गए
  alternative: कौवों को शत्रु राष्ट्रों या शासकों और भेड़ों को इस्राएल के रूप में व्याख्यात्मक ढंग से प्रस्तुत करना
  rationale: पशु-दर्शन अपनी बात सतत प्रतीकात्मक कथा द्वारा कहता है। अनुवाद को दृश्य के प्रत्यक्ष बिंब सुरक्षित रखने चाहिए, न कि किसी एक व्याख्या को मूल पाठ में मिला देना चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। हिंसक दृश्य की तीव्रता बनी रहती है, जबकि पशु-प्रतीकों की व्याख्या मुख्य पाठ में नहीं जोड़ी गई। मुख्य पाठ में दोनों पाद-टिप्पणी चिह्न अंग्रेज़ी परामर्श-पाठ के क्रम [b][a] में संबद्ध पद के बाद रखे गए हैं।
