base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/029.yaml
  text: And I saw until the Lord of the sheep brought a new house[a], greater and loftier than the first, and set it up in the place of the first, which had been folded up; and all its pillars were new, and its ornaments were new and greater than those of the first old one that he had taken away[b], and all the sheep were within it.
translation:
  language: hi
  text: और मैं देखता रहा, जब तक कि भेड़ों का प्रभु एक नया घर—पहले घर से बड़ा और ऊँचा—ले नहीं आया और उसे पहले घर के स्थान पर स्थापित नहीं कर दिया, जो समेट दिया गया था[a]। उसके सभी खंभे नए थे, और उसकी सजावट भी नई थी और उस पहले, पुराने घर की सजावट से अधिक बड़ी थी, जिसे उसने हटा दिया था[b]। और सभी भेड़ें उसके भीतर थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लपेट दिया गया था” अथवा “मोड़कर समेट दिया गया था”; गीइज़ क्रिया कठिन है और शायद पुराने घर को हटाए जाने से पहले समेटे जाने का वर्णन करती है।
    reason: lexical_alternative
  - marker: b
    text: यह “घर” संभवतः पुनःस्थापित या युगांतकालीन पवित्रस्थान का प्रतीक है, पर अनुवाद में दर्शन की अपनी प्रतीकात्मक छवि बनाए रखी गई है।
    reason: cultural_note
lexical_decisions:
- source_word: እግዚአ አባግዕ
  choice: भेड़ों का प्रभु
  rationale: ‘प्रभु’ मूल के स्वामी/अधिपति के अर्थ और दर्शन की गरिमापूर्ण भाषा को बनाए रखता है।
- source_word: ቤት ኀዲስ
  choice: एक नया घर
  rationale: मूल शब्द ‘घर’ है। संदर्भ में मंदिर या पवित्रस्थान का संकेत संभव है, पर मुख्य पाठ में प्रतीकात्मक छवि को बिना खोले रखा गया है।
- source_word: ዓቢይ ... ልዑል
  choice: बड़ा और ऊँचा
  rationale: यह सहज आधुनिक हिन्दी में आकार और ऊँचाई—दोनों तुलनात्मक पहलुओं को व्यक्त करता है।
- source_word: አቀሞ ውስተ መካነ ቀዳማዊት
  choice: उसे पहले घर के स्थान पर खड़ा कर दिया
  rationale: यह स्थापित करने और उसी स्थान पर पुराने ढाँचे का स्थान लेने, दोनों अर्थों को स्पष्ट रखता है।
- source_word: እንተ ትጠብለለት
  choice: जो समेट दिया गया था
  rationale: क्रिया की मोड़े, लपेटे या समेटे जाने की ठोस किंतु कठिन छवि को ‘ढहा दिया’ जैसे व्याख्यात्मक शब्द में नहीं बदला गया।
- source_word: አዕማዲ
  choice: खंभे
  rationale: यह सामान्य और स्वाभाविक हिन्दी स्थापत्य शब्द है।
- source_word: ስና
  choice: सजावट
  rationale: शब्द घर की अलंकृत विशेषताओं को सूचित करता है; ‘सजावट’ आधुनिक पाठक के लिए सहज है और अर्थ को अत्यधिक संकीर्ण नहीं करता।
- source_word: አውፅአ
  choice: हटा दिया था
  rationale: नए घर द्वारा पुराने के प्रतिस्थापन के संदर्भ में यह निकालने या दूर करने का स्वाभाविक अर्थ देता है।
- source_word: ማእከላ
  choice: उसके भीतर
  rationale: यह सभी भेड़ों के नए घर के अंदर होने की घेराव वाली छवि को स्पष्ट रखता है।
theological_decisions:
- issue: ቤት को ‘घर’ कहा जाए या अर्थ खोलकर ‘मंदिर’
  choice: घर
  alternative: मंदिर / पवित्रस्थान
  rationale: पशु-दर्शन की अपनी प्रतीकात्मक भाषा को बनाए रखने और संभावित युगांत-संबंधी संकेत को मुख्य पाठ में निश्चित व्याख्या न बनाने के लिए ‘घर’ रखा गया है।
- issue: पहले घर के साथ हुई क्रिया को कैसे व्यक्त किया जाए
  choice: समेट दिया गया था
  alternative: लपेट दिया गया था / मोड़ दिया गया था / ढहा दिया गया था
  rationale: मूल क्रिया कठिन है और मोड़ने, लपेटने या समेटने की छवि देती है। ‘ढहा दिया’ अनिश्चितता को समय से पहले समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण अपोकैलिप्टिक शैली। लंबे मूल वाक्य को पठनीयता के लिए तीन वाक्यों में बाँटा गया है, जबकि घटनाक्रम और प्रतीकात्मक तनाव सुरक्षित रखे गए हैं।
