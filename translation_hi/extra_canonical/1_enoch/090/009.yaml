base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/009.yaml
  text: And I saw until horns came out for those lambs[a], and the ravens cast down their horns. And I saw until one great horn sprouted on one of those sheep[c][b], and their eyes were opened.
translation:
  language: hi
  text: फिर मैं देखता रहा, जब तक उन मेमनों के सींग नहीं निकल आए[a], और कौवों ने उनके सींग गिरा दिए। फिर मैं देखता रहा, जब तक उन भेड़ों में से एक पर एक बड़ा सींग नहीं उग आया[b], और उनकी आँखें खुल गईं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में शाब्दिक रूप से ‘सींग’ है। इस दर्शन में सींग प्राणिवैज्ञानिक यथार्थ से अधिक सामर्थ्य या शासन के प्रतीक हैं।
    reason: lexical_alternative
  - marker: b
    text: ‘उग आया’ का मूल शब्द अंकुर फूटने या निकल आने की सजीव छवि देता है। पद इस बड़े सींग की ऐतिहासिक पहचान स्वयं नहीं बताता।
    reason: symbolic_ambiguity
  - marker: c
    text: शाब्दिक अर्थ है, ‘उनकी आँखें खुल गईं।’ इससे दर्शन के भीतर दृष्टि, समझ या चेतना की बहाली सूचित हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: አቅርንት / ቀርን
  choice: सींग
  rationale: गीज़ शब्द का सीधा अर्थ ‘सींग’ है। यह पशु-दर्शन में सामर्थ्य या शासन का प्रतीक भी है, इसलिए प्राणिवैज्ञानिक शब्दावली से इसे बदलना उचित नहीं।
- source_word: መኃስእ
  choice: मेमने
  rationale: इस प्रसंग में यह भेड़ों की संतान, अर्थात मेमनों या छोटे पशुओं, को सूचित करता है। इससे पशु-दर्शन की आंतरिक प्रतीक-व्यवस्था भी बनी रहती है।
- source_word: ቋንት
  choice: कौवे
  rationale: शब्द कौवे-कुल के पक्षियों के लिए प्रयुक्त हो सकता है। आधुनिक हिन्दी में ‘कौवे’ सहज और स्पष्ट है तथा दर्शन में शत्रु पक्षियों की छवि बनाए रखता है।
- source_word: ያወድቅዎሙ
  choice: गिरा दिए
  rationale: क्रिया का कारक भाव ‘गिरा देना’ है। यह घटना की तीव्रता को बनाए रखता है, पर गिराने की रीति के बारे में अनावश्यक विवरण नहीं जोड़ता।
- source_word: በቈለ
  choice: उग आया
  rationale: क्रिया अंकुरित होने या फूट निकलने का भाव रखती है। ‘उग आया’ सींग के सजीव ढंग से प्रकट होने की दर्शनीय छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ፩ ቀርን ዓቢይ
  choice: एक बड़ा सींग
  rationale: मूल में संख्या ‘एक’ स्पष्ट है और विशेषण उसके असाधारण आकार या महत्त्व को दर्शाता है।
- source_word: አባግዕ
  choice: भेड़ें
  rationale: यहाँ भेड़ों का सीधा उल्लेख है; ‘झुंड’ कहने से अलग-अलग पशुओं वाली प्रतीकात्मक छवि धुँधली पड़ जाती।
- source_word: ተከሥተ አዕይንቲሆሙ
  choice: उनकी आँखें खुल गईं
  rationale: यह मूल की निष्क्रिय अभिव्यक्ति का निकट, स्वाभाविक हिन्दी रूप है और दृष्टि या बोध की पुनःप्राप्ति का संभावित संकेत खुला रखता है।
theological_decisions:
- issue: मेमनों के सींगों की प्रतीकात्मक छवि
  choice: ‘मेमनों के सींग’ को ज्यों का त्यों रखा गया
  alternative: प्राणिवैज्ञानिक सहजता के लिए छवि को बदलना
  rationale: यह प्रतीकात्मक दर्शन है, प्राकृतिक इतिहास का वर्णन नहीं। सींग सामर्थ्य या नेतृत्व की आवर्ती छवि हैं; उन्हें बदलने से पाठ की प्रतीक-व्यवस्था प्रभावित होती।
- issue: एक बड़े सींग की ऐतिहासिक पहचान
  choice: मुख्य पाठ में केवल दर्शनीय छवि का वर्णन
  alternative: सींग को किसी विशिष्ट ऐतिहासिक नेता के रूप में स्पष्ट करना
  rationale: पद स्वयं उस व्यक्ति की पहचान नहीं बताता। अनुवाद में ऐतिहासिक व्याख्या जोड़ने के बजाय मूल की प्रतीकात्मक अनिश्चितता सुरक्षित रखी गई है।
- issue: आँखें खुलने का आशय
  choice: शाब्दिक छवि ‘उनकी आँखें खुल गईं’ रखी गई
  alternative: इसे स्पष्टतः आत्मिक ज्ञान, राजनीतिक चेतना या दृष्टि की बहाली कहना
  rationale: मूल इन अर्थों में से किसी एक को स्पष्ट नहीं करता; अतः उसके संभावित बोधात्मक और दर्शनीय दोनों अर्थ सुरक्षित रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण दर्शनीय शैली रखी गई है। ‘फिर मैं देखता रहा, जब तक…’ की पुनरावृत्ति मूल की क्रमिक दृष्टि-रचना को सुरक्षित रखती है।
