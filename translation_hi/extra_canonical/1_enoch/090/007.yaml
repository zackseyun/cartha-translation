  yaml_path: translation/extra_canonical/1_enoch/090/007.yaml
  text: And they cried out to them[a], but they did not heed their words; rather, they were exceedingly deaf[c][b], and their eyes were exceedingly blinded.
translation:
  language: hi
  text: और उन्होंने उन्हें ज़ोर से पुकारा, पर उन्होंने उनकी बातों पर ध्यान नहीं दिया; बल्कि वे अत्यन्त बहरे थे[a], और उनकी आँखें अत्यन्त अंधी कर दी गई थीं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इथियोपिक में ‘अत्यन्त’ के अर्थ वाला शब्द बहरेपन और आँखों के अंधे किए जाने—दोनों के साथ दोहराया गया है, जिससे वर्णन की तीव्रता पर जोर पड़ता है।
    reason: lexical_alternative
  - marker: b
    text: इस दर्शन में बहरापन और अंधी आँखें नैतिक-आत्मिक संवेदनहीनता का संकेत दे सकती हैं; अनुवाद ने फिर भी मूल की ठोस इंद्रियगत छवि को बनाए रखा है।
    reason: cultural_note
lexical_decisions:
- source_word: አስርኅዎሙ
  choice: उन्होंने उन्हें ज़ोर से पुकारा
  rationale: क्रिया ऊँचे स्वर से पुकारने या चिल्लाकर आवाज़ देने का भाव रखती है। क्रिया का कर्ता और कर्म—दोनों तीसरे पुरुष बहुवचन हैं; इसलिए ‘उन्होंने उन्हें’ रखा गया है।
- source_word: ኢያጽምኡ ነገሮሙ
  choice: उन्होंने उनकी बातों पर ध्यान नहीं दिया
  rationale: मूल में सुनने की क्रिया नकार के साथ है और ‘उनकी बातें’ तीसरे पुरुष बहुवचन को सूचित करता है। ‘ध्यान नहीं दिया’ दोषपूर्ण उपेक्षा का भाव व्यक्त करता है, पर इसे अधिक व्याख्यात्मक ‘आज्ञा नहीं मानी’ नहीं बनाता।
- source_word: ፈድፋደ
  choice: अत्यन्त
  rationale: यह तीव्रताबोधक क्रियाविशेषण दोनों कथनों के साथ दोहराया गया है। हिन्दी में भी ‘अत्यन्त’ की पुनरावृत्ति मूल के जोर को बनाए रखती है।
- source_word: ተጸመሙ
  choice: बहरे हो गए
  rationale: रूप बहरापन या सुनने की क्षमता बंद हो जाने को दर्शाता है। ‘हो गए’ रूप में निहित परिणामी अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ተጸለሉ አዕይንቲሆሙ
  choice: उनकी आँखें अत्यन्त अंधी हो गईं
  rationale: मूल में ‘उनकी आँखें’ के साथ अंधा या दृष्टिहीन किए जाने की प्रबल मूर्त छवि है। अनुवाद इसी इंद्रियगत भाषा को बनाए रखता है।
- source_word: ተወንየሉ
  choice: बल्कि
  rationale: न सुनने के कथन के बाद आने वाली विपरीत अथवा तीव्रतर प्रगति को हिन्दी में ‘बल्कि’ स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: क्या बहरापन और अंधापन केवल शारीरिक अक्षमता हैं या नैतिक-आत्मिक संवेदनहीनता के प्रतीक
  choice: मुख्य पाठ में ठोस इंद्रियगत भाषा—‘बहरे’ और ‘आँखें अंधी’—बनाए रखी गई है।
  alternative: ‘वे आत्मिक रूप से कठोर हो गए’ अथवा ‘उन्होंने आज्ञा मानने से इनकार किया।’
  rationale: दर्शन के पशु-रूपक में यह भाषा नैतिक और आत्मिक अर्थ धारण कर सकती है, पर मूल उस अर्थ को अमूर्त व्याख्या में नहीं बदलता। इसलिए अनुवाद पाठक को इस तनाव को स्वयं समझने देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘ज़ोर से पुकारा’ सामान्य पाठक के लिए स्वाभाविक है; ‘अत्यन्त’ की पुनरावृत्ति अपोकैलिप्टिक कथन के जोर को सुरक्षित रखती है।
