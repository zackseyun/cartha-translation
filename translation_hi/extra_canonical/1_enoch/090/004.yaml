  verdict: revise
  source_fidelity: 'The draft preserves the sequence and imagery of the Geʽez well: dogs, eagles, and a distinct bird of prey consume the sheep; no bodily substance remains; the bones stand and then fall; the sheep become few. The emphatic totality of ግሙራ is appropriately represented by “तनिक भी.” A small correction is needed because the present negated list lacks an explicit Hindi negation and “नस” can denote a vein or nerve rather than the sinew/tendon sense of ሥርወ.'
