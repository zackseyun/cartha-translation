base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/004.yaml
  text: And I saw until those sheep were devoured by the dogs and by the eagles and by the kites[a], and they left them no flesh at all, nor skin, nor sinew, until only their bones stood there; and even their bones fell upon the earth[e][d][c][b], and the sheep became few.
translation:
  language: hi
  text: और मैं देखता रहा कि उन भेड़ों को कुत्तों, उकाबों और चीलों[a] ने खा डाला। उन्होंने उनका तनिक भी मांस, खाल या स्नायु नहीं छोड़ा, यहाँ तक कि केवल उनकी हड्डियाँ ही खड़ी रह गईं; फिर उनकी हड्डियाँ भी धरती पर गिर पड़ीं, और भेड़ों की संख्या घटकर बहुत कम रह गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त पक्षी-संज्ञा को अधिक व्यापक रूप से किसी प्रकार का बाज़ या अन्य शिकारी पक्षी भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ተበልዑ
  choice: खा डाला
  rationale: कर्मवाच्य स्रोत का स्वाभाविक हिन्दी रूप रखते हुए हिंसक भक्षण का भाव व्यक्त करता है; कर्ताओं को बाद में स्पष्ट किया गया है।
- source_word: አክልብት
  choice: कुत्तों
  rationale: साधारण पशु-संज्ञा को बिना प्रतीकात्मक व्याख्या जोड़े सीधे रखा गया है।
- source_word: አንስርት
  choice: उकाबों
  rationale: यह बड़े शिकारी पक्षी के पारंपरिक समतुल्य को व्यक्त करता है और अगले पक्षी-पद से भेद बनाए रखता है।
- source_word: ሆባይ
  choice: चीलों
  rationale: हिन्दी में kite के लिए स्वाभाविक और परिचित शब्द; प्रजाति की अनिश्चितता पाद-टिप्पणी में सुरक्षित है।
- source_word: ሥጋ ግሙራ
  choice: तनिक भी मांस
  rationale: 'नकार के साथ ግሙራ की पूर्णता को स्वाभाविक हिन्दी में व्यक्त करता है: मांस बिल्कुल नहीं बचा।'
- source_word: ማእሰ
  choice: खाल
  rationale: भेड़ों के वध-सदृश दृश्य में 'खाल' अधिक ठोस और स्वाभाविक है।
- source_word: ሥርወ
  choice: नस
  rationale: सामान्य पाठक के लिए सहज शब्द, जो यहाँ शरीर की पेशीय रज्जु या sinew का भाव पर्याप्त रूप से देता है।
- source_word: ቆሙ ባሕቲቶ አዕፅምቲሆሙ
  choice: केवल उनकी हड्डियाँ ही खड़ी रह गईं
  rationale: स्रोत की विचित्र और तीखी दृश्यात्मकता को 'पड़ी रह गईं' कहकर समतल किए बिना सुरक्षित रखता है।
- source_word: ወአዕፅምቲሆሙሰ ወደቁ ዲበ ምድር
  choice: फिर उनकी हड्डियाँ भी धरती पर गिर पड़ीं
  rationale: क्रमिक विनाश और हड्डियों पर बल दोनों को स्पष्ट करता है, जबकि -ሰ की सूक्ष्म शक्ति को अत्यधिक निश्चित नहीं बनाता।
- source_word: ወንእሱ አባግዕ
  choice: भेड़ों की संख्या घटकर बहुत कम रह गई
  rationale: संख्या में भारी कमी को मुहावरेदार आधुनिक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: पशु-रूपक का प्रतीकात्मक अर्थ
  choice: मुख्य पाठ में पशुओं और पक्षियों को दृश्य के अनुसार शाब्दिक रूप में रखा गया है।
  alternative: उन्हें राष्ट्रों, शासकों या सेनाओं के रूप में व्याख्यात्मक ढंग से अनूदित करना।
  rationale: यह दर्शन अपना अर्थ सतत पशु-प्रतीकों द्वारा व्यक्त करता है; अनुवाद को प्रतीक का अर्थ पाठ के भीतर तय नहीं करना चाहिए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। 'खा डाला', 'तनिक भी' और 'गिर पड़ीं' दृश्य की क्रूरता और तीव्रता रखते हैं; 'हड्डियाँ ही खड़ी रह गईं' स्रोत की असामान्य किन्तु जानबूझकर रखी गई दृश्यात्मक भाषा को सुरक्षित करता है।
