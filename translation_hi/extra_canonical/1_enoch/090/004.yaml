  terminology: “उकाबों” and “चीलों” appropriately maintain the source’s distinction, with the lexical uncertainty of the latter retained in the footnote. “स्नायु” better reflects ‘sinew’ than “नस.” The animal imagery remains untranslated as symbolism, as required.
  issues:
  - severity: medium
    issue: The clause “उन्होंने उनका तनिक भी मांस, न खाल, न नस छोड़ी” has no explicit negator governing “तनिक भी” and the list.
    rationale: In modern Hindi, “तनिक भी” in this sense requires “नहीं,” or a fully parallel negative construction. The current wording is grammatically defective and can obscure the intended absolute negation.
  - severity: low
    issue: “नस” is not the most precise equivalent for the source term meaning sinew/tendon.
    rationale: “नस” normally evokes a vein or nerve in modern Hindi. “स्नायु” preserves the anatomical sinew sense and suits the passage’s elevated register.
