base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/014.yaml
  text: And I saw until that man came[a], the one who had written down the names of the shepherds, and he brought them up before the Lord of the sheep; and he helped him and rescued him[c][b], and he showed him everything concerning the downfall of his helper.
translation:
  language: hi
  text: और मैं देखता रहा, जब तक वह पुरुष नहीं आया जिसने चरवाहों के नाम लिखे थे। वह उन नामों को भेड़ों के प्रभु के सामने ले गया। फिर उसने उस मेढ़े की सहायता की और उसे बचाया, और उस मेढ़े को उसके सहायक के नीचे उतरने की सारी बात दिखाई।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम पदबंध इथियोपियाई पाठ में कठिन है। इसे उस मेढ़े को उसके सहायक के नीचे उतरने के विषय में सब कुछ दिखाने के अर्थ में समझा जाता है; ‘सहायक’ के हस्तक्षेप के संबंध का सटीक आशय पूरी तरह स्पष्ट नहीं है।
    reason: textual_variant
lexical_decisions:
- source_word: ብእሲ
  choice: पुरुष
  rationale: मूल शब्द सामान्यतः किसी पुरुष को दर्शाता है। दर्शन में उसका स्वरूप स्वर्गीय जान पड़ता है, फिर भी अनुवाद उसे ‘स्वर्गदूत’ कहकर उसकी पहचान निश्चित नहीं करता।
- source_word: ዘጸሐፈ አስማቲሆሙ ለኖሎት
  choice: जिसने चरवाहों के नाम लिखे थे
  rationale: सम्बन्धवाचक वाक्य उस पुरुष की पहचान उसके पहले किए गए लेखा-अंकन से कराता है; ‘लिखे थे’ न्यायिक अभिलेख का भाव बनाए रखता है।
- source_word: ያዐርግ ቅድሜሁ ለእግዚአ አባግዕ
  choice: वह उन नामों को भेड़ों के प्रभु के सामने ले गया
  rationale: क्रिया में ऊपर ले जाने का मूल भाव है, पर प्रसंग में नामों को दिव्य न्यायाधीश के सामने प्रस्तुत करना अभिप्रेत है। हिंदी में ‘सामने ले गया’ गति और प्रस्तुति दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ለእግዚአ አባግዕ
  choice: भेड़ों के प्रभु
  rationale: यह पशु-दर्शन में परमेश्वर के लिए बार-बार आने वाली उपाधि है। ‘प्रभु’ इसकी गरिमा और शासन-संबंधी अर्थ बनाए रखता है।
- source_word: ረዳኦ ወአድኃኖ
  choice: सहायता की और उसे बचाया
  rationale: 'दोनों क्रियाओं को अलग रखा गया है: पहली सहायता और दूसरी संकट से छुड़ाने या बचाने का भाव देती है।'
- source_word: ለዝኩ ይቤላ
  choice: उस मेढ़े को
  rationale: ይቤላ का अर्थ ‘मेढ़ा’ है और यह दिखाए जाने वाले पात्र की पहचान स्पष्ट करता है; इसे सामान्य ‘भेड़’ या प्रयोजन-सूचक पद नहीं बनाया गया।
- source_word: ኵሎ መራደ ለረዳኢቱ
  choice: उसके सहायक के उतरने की पूरी घटना
  rationale: መራደ को उतरने या अवतरण से संबंधित संज्ञा माना गया है। ‘पूरी घटना’ ኵሎ के समग्रता-भाव को स्वाभाविक हिंदी में रखती है, जबकि कठिन वाक्यांश की सम्भावित वैकल्पिक समझ पाद-टिप्पणी में दी गई है।
theological_decisions:
- issue: ‘उस पुरुष’ की पहचान और स्थिति
  choice: मुख्य पाठ में केवल ‘वह पुरुष’
  alternative: वह स्वर्गदूत; वह स्वर्गीय लेखक
  rationale: मूल पाठ ‘पुरुष’ कहता है। व्यापक दर्शन स्वर्गीय पात्र की ओर संकेत करता है, पर स्थानीय शब्दावली उसकी सत्ता-श्रेणी को स्पष्ट नहीं करती।
- issue: भेड़ों के स्वामी के लिए दिव्य उपाधि
  choice: भेड़ों के प्रभु
  alternative: भेड़ों के स्वामी
  rationale: ‘प्रभु’ रूपक के भीतर दिव्य अधिकार और गरिमापूर्ण शैली दोनों बनाए रखता है।
- issue: अंतिम वाक्यांश में सहायक का उतरना
  choice: सहायक के उतरने की पूरी घटना
  alternative: सहायक का पूरा अवतरण; सहायक के पतन से संबंधित सब कुछ
  rationale: मूल संज्ञा उतरने/नीचे आने का अर्थ दे सकती है, जबकि प्रेषित पाठ कठिन है। मुख्य पाठ में स्थानिक और हस्तक्षेप-संबंधी अर्थ रखा गया है तथा ‘पतन’ जैसे अधिक निर्णायक अर्थ को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी की गरिमापूर्ण किंतु सहज शैली अपनाई गई है। रूपक के प्रमुख पद—पुरुष, चरवाहे, मेढ़ा और भेड़ों का प्रभु—ठोस रूप में रखे गए हैं। संदिग्ध अंतिम वाक्यांश को अत्यधिक धर्मवैज्ञानिक व्याख्या से बचाते हुए अनूदित किया गया है।
