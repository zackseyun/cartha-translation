  text: And after this he showed me the angels of punishment[c][b][a], who are prepared to come and release all the power of the waters.
translation:
  language: hi
  text: इसके बाद उसने मुझे दंड के स्वर्गदूत दिखाए, जो आने और जल की सारी शक्ति को मुक्त कर देने[b] के लिए तैयार हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त गीइज़ रूप कठिन है; इसका अनुवाद “तत्पर हैं” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “जल की सारी शक्ति को खोल देने” भी संभव है; आशय संभवतः जल के पूरे बल को खुला छोड़ना या मुक्त कर देना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረ ዝ
  choice: इसके बाद
  rationale: दर्शन-वर्णन में समय और क्रम बताने वाले इस सूत्र का यह सहज और सटीक हिन्दी रूप है।
- source_word: አርአየኒ
  choice: उसने मुझे ... दिखाए
  rationale: यह रूप क्रिया के प्रत्यक्ष दृश्यात्मक अर्थ को बनाए रखता है और अनावश्यक रूप से 'प्रकट किया' जैसा धार्मिक अर्थ नहीं जोड़ता।
- source_word: መላእክተ መቅሠፍት
  choice: दंड के स्वर्गदूत
  rationale: मूल की संबंधवाचक रचना और न्याय-संबंधी प्रलयदर्शी स्वर को बनाए रखता है; 'ताड़ना' की अपेक्षा 'दंड' आधुनिक पाठक के लिए अधिक स्पष्ट है।
- source_word: እለ ይልዋን
  choice: जो ... तैयार हैं
  rationale: कठिन गीइज़ रूप को तत्परता अथवा तैयारी की अवस्था के रूप में प्रस्तुत करता है और उसकी संभावित अस्पष्टता टिप्पणी में सुरक्षित रखता है।
- source_word: ከመ ይምጽኡ
  choice: आने ... के लिए
  rationale: तैयारी के उद्देश्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ወይፍትሑ
  choice: और ... मुक्त कर देने
  rationale: मूल क्रिया में 'खोलना', 'ढीला करना' और 'मुक्त करना' का अर्थक्षेत्र है। 'शक्ति' के साथ हिन्दी में 'मुक्त कर देना' स्वाभाविक है और जल-बल को खुला छोड़ने का भाव व्यक्त करता है।
- source_word: ኵሎ ኀይለ ማይ
  choice: जल की सारी शक्ति
  rationale: मूल की तत्त्व-संबंधी प्रलयदर्शी छवि को बनाए रखता है। हिन्दी में एकवचन भाववाचक 'जल' सामूहिक अर्थ भी सहज रूप से देता है।
theological_decisions:
- issue: दंड के स्वर्गदूतों का स्वरूप
  choice: दंड से संबद्ध अलौकिक स्वर्गदूत, जो जल की शक्ति मुक्त करने के लिए तैयार हैं
  alternative: मानवीय दूत; अथवा केवल सुधारात्मक ताड़ना से जुड़े स्वर्गदूत
  rationale: निकटवर्ती प्रलयदर्शी प्रसंग में स्वर्गदूत ब्रह्मांडीय न्याय को क्रियान्वित करते हैं। फिर भी 'दंड के' कहकर मूल संबंधवाचक अभिव्यक्ति रखी गई है और उनके कार्य का इससे अधिक सिद्धान्तगत विवरण नहीं जोड़ा गया।
- issue: जल की शक्ति को खोलना या मुक्त करना
  choice: मुक्त कर देना
  alternative: खोल देना
  rationale: मूल क्रिया दोनों अर्थ दे सकती है। 'शक्ति को खोलना' हिन्दी में अस्वाभाविक है, जबकि 'मुक्त कर देना' प्रसंगानुकूल अर्थ देता है; वैकल्पिक अधिक शाब्दिक रूप टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली अपनाई गई है। 'दंड के स्वर्गदूत' मूल की संबंधवाचक बनावट को बचाता है, और 'जल की सारी शक्ति' प्रलयदर्शी बिंब को बिना अतिरिक्त व्याख्या के प्रस्तुत करता है।
