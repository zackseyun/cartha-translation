base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/009.yaml
  text: And I went in until I drew near to a wall built of stones of hail[a], and a tongue of fire surrounded it[e][d][c][b], and it began to make me afraid.
translation:
  language: hi
  text: और मैं भीतर गया, यहाँ तक कि ओलों के पत्थरों[b] से बनी एक दीवार[a] के पास पहुँचा। अग्नि की एक जीभ उसे चारों ओर से घेरे हुए थी, और वह मुझे डराने लगी।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीइज़ शब्द का अर्थ इस संदर्भ में ‘दीवार’ लिया गया है; अकेले इस साक्षी के आधार पर ‘निर्मित संरचना’ या ‘भवन’ भी संभव समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘ओलों के पत्थर’ है। इसका आशय ‘ओले’ हो सकता है, पर अधिक शाब्दिक रूप दर्शन की विलक्षण छवि को सुरक्षित रखता है।
    reason: lexical_alternative
  - marker: c
    text: उपलब्ध पाठ-साक्षी में अंतिम खंड कठिन है। यहाँ यह भाव लिया गया है कि अग्नि की उस जीभ ने एनोख को डराना शुरू कर दिया।
    reason: textual_variant
lexical_decisions:
- source_word: ወቦእኩ
  choice: और मैं भीतर गया
  rationale: क्रिया प्रवेश करने या भीतर जाने का बोध देती है; यह सरल आधुनिक हिन्दी में दृश्य के भीतर एनोख की गति को बनाए रखता है।
- source_word: እስከ እቀርብ
  choice: यहाँ तक कि ... के पास पहुँचा
  rationale: यह पदबंध निकट पहुँचने तक जारी गति व्यक्त करता है।
- source_word: ጥቅም
  choice: दीवार
  rationale: तत्काल स्थापत्य-संदर्भ तथा उपलब्ध यूनानी और अरामी समानांतर साक्ष्य ‘दीवार’ का समर्थन करते हैं, यद्यपि गीइज़ साक्षी को अकेले पढ़ने पर अधिक सामान्य अर्थ भी संभव है।
- source_word: ዘሕንጽት
  choice: से बनी
  rationale: सम्बन्धवाचक क्रियारूप उस दीवार को निर्मित वस्तु के रूप में विशेषित करता है; हिन्दी में ‘से बनी’ स्वाभाविक और संक्षिप्त है।
- source_word: በእእባነ በረድ
  choice: ओलों के पत्थरों से
  rationale: शाब्दिक और विलक्षण दृश्यात्मकता ‘ओलों के पत्थर’ को सुरक्षित रखती है; इसे केवल ‘ओलों’ कहकर सपाट नहीं किया गया।
- source_word: ልሳነ እሳት
  choice: अग्नि की एक जीभ
  rationale: संज्ञा एकवचन है; इसलिए ‘जीभें’ नहीं, ‘एक जीभ’ रखा गया है। असामान्य प्रलय-दर्शी बिंब भी ज्यों का त्यों रहता है।
- source_word: የዓውዳ
  choice: ने उसे चारों ओर से घेर रखा था
  rationale: क्रिया घेरने या चारों ओर होने का स्थानिक अर्थ देती है; एकवचन क्रिया ‘अग्नि की एक जीभ’ के अनुरूप है।
- source_word: ወጠነ ያፍርሀኒ
  choice: यह मुझे डराने लगा
  rationale: पाठ के कठिन अंतिम खंड में आरम्भ और भय उत्पन्न करने का भाव सावधानी से व्यक्त किया गया है; ‘यह’ कारण को अत्यधिक निश्चित नहीं करता।
theological_decisions:
- issue: स्वर्गीय दर्शन की असामान्य स्थापत्य और अग्नि-संबंधी छवि
  choice: ओलों के पत्थरों से बनी एक दीवार ... अग्नि की एक जीभ
  alternative: ओलों से बना एक भवन ... आग की लपटें
  rationale: मूल की विचित्र, ठोस प्रलय-दर्शी छवि को सामान्य स्थापत्य या साधारण लपटों में बदलना उचित नहीं है। एकवचन ‘जीभ’ अगली दृश्यात्मक कड़ी और मूल व्याकरण दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘अग्नि की एक जीभ’ और ‘ओलों के पत्थर’ जैसे जानबूझकर असामान्य पद मूल दर्शन की रहस्यमय बनावट को सुरक्षित रखते हैं।
