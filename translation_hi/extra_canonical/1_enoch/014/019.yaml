  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और दर्शनात्मक शैली रखी गई है। स्रोत के वस्तु-विहीन वाक्य की असामान्य खुली संरचना जानबूझकर सुरक्षित है।
