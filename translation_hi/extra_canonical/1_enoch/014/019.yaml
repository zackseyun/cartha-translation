lexical_decisions:
- source_word: እምታሕተ
  choice: के नीचे से
  rationale: यह रूप अपादान अर्थ (‘से’) और स्थानगत अर्थ (‘नीचे’) दोनों को व्यक्त करता है और स्रोत की स्थानिक छवि बनाए रखता है।
- source_word: መንበሩ
  choice: सिंहासन
  rationale: स्वर्गीय दर्शन के संदर्भ में መንበር का स्वाभाविक अर्थ ‘सिंहासन’ है। यहाँ प्रत्यय पूर्वोक्त सिंहासन को निश्चित बनाता समझा गया है, इसलिए ‘उसका सिंहासन’ न कहकर ‘सिंहासन’ रखा गया।
- source_word: ይወፅእ
  choice: निकला
  rationale: क्रिया का अर्थ बाहर निकलना या प्रकट होकर आना है। ‘निकला’ संक्षिप्त है और किसी अनकहे कर्ता या वस्तु को जोड़े बिना अधूरेपन को सुरक्षित रखता है।
theological_decisions:
- issue: መንበሩ के प्रत्यय का अर्थ
  choice: पूर्वोक्त निश्चित सिंहासन के रूप में ‘सिंहासन’
  alternative: ‘उसके सिंहासन’
  rationale: गीज़ में तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय पहले उल्लिखित संज्ञा को निश्चित करने का काम कर सकता है। पद 18 के पूर्वोक्त सिंहासन को ध्यान में रखते हुए मुख्य पाठ में स्वामित्व या उसके स्वामी की पहचान को समय से पहले स्पष्ट नहीं किया गया।
- issue: क्या निकला, इसका अनकहा रहना
  choice: वाक्य को ‘निकला’ पर खुला छोड़ना
  alternative: अगली पंक्ति की छवि को यहाँ जोड़ देना
  rationale: मूल पद एक छोटा खंड है जिसमें निकलने वाली वस्तु या सत्ता व्यक्त नहीं की गई। अनुवाद उस वास्तविक अस्पष्टता और साहित्यिक तनाव को बनाए रखता है।
