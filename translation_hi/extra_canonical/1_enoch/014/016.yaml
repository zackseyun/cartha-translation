base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/016.yaml
  text: And in every respect it excelled in splendor and glory and greatness[d][c][b][a], so that I am unable to tell you about its splendor and about its greatness.
translation:
  language: hi
  text: और वह हर दृष्टि से वैभव, महिमा और महानता में बढ़कर था[a], यहाँ तक कि मैं तुम्हें उसके[b] वैभव और उसकी महानता के विषय में बता नहीं सकता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वैभव, महिमा और महानता से उमड़ रहा था” अथवा “भरपूर था।” क्रिया में उत्कर्ष के साथ प्रचुरता या अतिरेक का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “उसके” का निकटतम संदर्भ दर्शन में दिखाई देने वाली स्वर्गीय संरचना है; फिर भी यह दिव्य उपस्थिति के वैभव की ओर भी संकेत कर सकता है, और पाठ दोनों को स्पष्ट रूप से अलग नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: በኵሉ፡ ይፈደፍድ
  choice: हर दृष्टि से ... बढ़कर था
  rationale: በኵሉ समग्रता, अर्थात् ‘हर दृष्टि से’, व्यक्त करता है; ይፈደፍድ यहाँ साधारण परिपूर्णता से अधिक उत्कर्ष या अतिरेक का भाव देता है। यह अनुवाद उपलब्ध यूनानी साक्ष्य के ‘बढ़कर होने’ के अर्थ के अनुरूप भी है, जबकि वैकल्पिक ‘उमड़ रहा था/भरपूर था’ का भाव पाद-टिप्पणी में सुरक्षित है।
- source_word: በስብሐት
  choice: वैभव
  rationale: दर्शन के प्रसंग में यह शब्द मौखिक स्तुति नहीं, प्रकट दीप्ति और भव्यता को सूचित करता है। ‘वैभव’ अगले शब्द ክብር के लिए चुनी गई ‘महिमा’ से अर्थगत भेद भी बनाए रखता है।
- source_word: በክብር
  choice: महिमा
  rationale: यह दृश्य और राजसी गौरव या प्रतिष्ठित भव्यता को व्यक्त करता है तथा हिन्दी धार्मिक-साहित्यिक प्रयोग में स्वाभाविक है।
- source_word: በዕበይ
  choice: महानता
  rationale: यह आकार, उत्कर्ष और उच्च महानता का मूल भाव सुरक्षित रखता है तथा पद के अंत में इसी संज्ञा की पुनरावृत्ति को संभव बनाता है।
- source_word: እስከ፡ ኢይክል፡ ዜንዎተክሙ
  choice: यहाँ तक कि मैं तुम्हें ... बता नहीं सकता
  rationale: वाक्यांश परिणाम या चरम सीमा बताता है। उपलब्ध पाठ-साक्ष्य में वक्ता की असमर्थता श्रोताओं को बताने की है; इसे ‘तुम्हारी आँखें देख नहीं सकीं’ समझना रूपगत और प्रसंगगत रूप से कमज़ोर है।
- source_word: በእንተ፡ ስብሐቲሁ፡ ወበእንተ፡ ዕበዩ
  choice: उसके वैभव और उसकी महानता के विषय में
  rationale: दोनों कारण/विषय-वाचक पदों और तीसरे पुरुष के प्रत्ययों को स्पष्ट संज्ञा जोड़े बिना दोहराया गया है, जिससे मूल की पुनरुक्ति और संदर्भगत अस्पष्टता बनी रहती है।
theological_decisions:
- issue: ‘उसके वैभव ... उसकी महानता’ में तीसरे पुरुष के प्रत्यय का संदर्भ
  choice: मुख्य पाठ में केवल ‘उसके/उसकी’ रखा गया है, किसी स्पष्ट कर्ता का नाम नहीं जोड़ा गया।
  alternative: इसे सीधे स्वर्गीय भवन का वैभव कहना, परमेश्वर की उपस्थिति का वैभव कहना, या दोनों को संयुक्त रूप से समझना।
  rationale: गीज़ पाठ संदर्भ को दोबारा स्पष्ट नहीं करता। निकट प्रसंग स्वर्गीय संरचना की ओर संकेत करता है, पर दर्शन में स्थान और दिव्य उपस्थिति का वैभव परस्पर घुला हुआ हो सकता है; इसलिए अनुवाद इस धर्मवैचारिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘वैभव, महिमा और महानता’ तीनों स्रोत-संज्ञाओं का भेद और अंतिम पुनरावृत्ति सुरक्षित रखते हैं। ‘तुम्हें’ बहुवचन/सामूहिक संबोधन के लिए स्वाभाविक आधुनिक रूप है।
