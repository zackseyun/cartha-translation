translation:
  language: hi
  text: और जब मैं व्याकुल होकर काँप रहा था[a], तब मैं मुँह के बल गिर पड़ा और मैंने दर्शन में देखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घबराया हुआ थरथरा रहा था।” दोनों क्रियाएँ निकट अर्थ वाली हैं और मिलकर तीव्र भय या व्याकुलता व्यक्त करती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: እንዘ
  choice: जब … रहा था
  rationale: यह समकालिक परिस्थिति प्रकट करता है और व्याकुल होने तथा काँपने को गिरने की क्रिया से जोड़ता है। हिंदी में ‘जब … रहा था, तब’ इसका स्वाभाविक रूप है।
- source_word: እትሀወክ
  choice: मैं व्याकुल … रहा था
  rationale: क्रिया भीतरी अशांति, घबराहट या विचलन व्यक्त कर सकती है। ‘व्याकुल’ इस अर्थ को बनाए रखता है और अगली शारीरिक प्रतिक्रिया से इसे अलग पहचान देता है।
- source_word: እርዕድ
  choice: काँप रहा था
  rationale: यह भय या विस्मय की देहगत प्रतिक्रिया को सीधे और वर्तमान हिंदी में व्यक्त करता है।
- source_word: ወድቁ
  choice: मैं … गिर पड़ा
  rationale: मूल गति-क्रिया को सरल रखा गया है; ‘मुँह के बल’ स्वयं दंडवत जैसी मुद्रा स्पष्ट कर देता है, इसलिए जानबूझकर झुकने का भाव नहीं जोड़ा गया।
- source_word: በገጽየ
  choice: मुँह के बल
  rationale: हिंदी में यह चेहरे के बल भूमि पर गिरने की मुद्रा का स्वाभाविक और स्पष्ट मुहावरा है।
- source_word: እሬኢ
  choice: मैंने … देखा
  rationale: साधारण दर्शन-क्रिया को बिना पुरातन या अलंकृत भाषा के सीधे रूप में रखा गया है।
- source_word: በራእይ
  choice: दर्शन में
  rationale: यह प्रकाशनात्मक दृश्य के तकनीकी अर्थ को संक्षेप और स्वाभाविक ढंग से रखता है; यहाँ अनिश्चित ‘एक दर्शन’ थोपने की आवश्यकता नहीं है।
theological_decisions:
- issue: दोनों भय-संबंधी क्रियाओं को केवल आंतरिक भय मानना या मन और शरीर की संयुक्त प्रतिक्रिया के रूप में रखना
  choice: ‘व्याकुल होकर काँप रहा था’—भीतरी अशांति और देहगत प्रतिक्रिया दोनों
  alternative: ‘डर रहा था’ अथवा ‘घबरा गया था’
  rationale: दो अलग क्रियाओं की तीव्रता बनाए रखने से हनोक की दर्शन के सामने हुई समग्र प्रतिक्रिया सुरक्षित रहती है; इसे केवल सामान्य भय में समेटना मूल की छवि को सपाट कर देता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘मुँह के बल गिर पड़ा’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘दर्शन में’ अपोकैलिप्टिक संदर्भ को बनाए रखता है।
