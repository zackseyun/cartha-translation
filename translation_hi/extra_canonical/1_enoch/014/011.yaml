base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/011.yaml
  text: Its ceiling was like the path of the stars and the lightnings[a], and among them were fiery cherubim[c][b], and their heaven was water.
translation:
  language: hi
  text: उसकी छत तारों के मार्ग और बिजलियों के समान थी[a], और उनके बीच आग के करूब थे; और उनका आकाश जल था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तारों के मार्ग’ का अनुवाद ‘तारों की गति’ या अधिक शाब्दिक रूप से ‘तारों का दौड़ना’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उनका आकाश जल था’ एक कठिन वाक्यांश है। इसका संकेत आग के करूबों से जुड़े जलीय आकाश की ओर या दर्शन में दिखाई गई रचना के ऊपरी क्षेत्र की ओर हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ጠፈሩ
  choice: उसकी छत
  rationale: दर्शन में दिखाई गई इमारत के ऊपरी आवरण के लिए ‘छत’ स्वाभाविक है और अनावश्यक रूप से ब्रह्मांडीय अर्थ नहीं जोड़ता।
- source_word: ሩጸተ ከዋክብት
  choice: तारों का मार्ग
  rationale: यह पद तारों की गति, चाल या नियत पथ को सूचित करता है। ‘मार्ग’ दृश्य बिंब और मूल की अर्थ-व्याप्ति दोनों को बनाए रखता है।
- source_word: መበርቅት
  choice: बिजलियाँ
  rationale: बहुवचन-सदृश रूप को रखते हुए यह बार-बार चमकती बिजली का सजीव और संक्षिप्त वर्णन देता है।
- source_word: ማእከሎሙ
  choice: उनके बीच
  rationale: यह करूबों को पहले बताए गए तारों के मार्ग और बिजलियों के मध्य स्थित दिखाता है, बिना संदर्भ को अधिक स्पष्ट करके सीमित किए।
- source_word: ኪሩቤን ዘእሳት
  choice: आग के करूब
  rationale: संबंधवाचक रचना को निकटता से रखते हुए करूबों का आग से संबंध व्यक्त होता है; ‘आग के’ यह तय नहीं करता कि वे आग से बने थे या अग्निमय दिखाई देते थे।
- source_word: ሰማዮሙ
  choice: उनका आकाश
  rationale: मूल के बहुवचन स्वामित्वसूचक रूप को सुरक्षित रखा गया है। ‘आकाश’ हिन्दी में इस दृश्य-स्थान के लिए ‘स्वर्ग’ से अधिक सहज है, जबकि विचित्र संबंध बना रहता है।
- source_word: ማይ
  choice: जल
  rationale: मूल के सरल एकवचन द्रव्यवाचक अर्थ को गरिमापूर्ण और सीधी हिन्दी में रखा गया है।
theological_decisions:
- issue: ሰማዮሙ ማይ की असामान्य और संदिग्ध छवि
  choice: उनका आकाश जल था
  alternative: उनके ऊपर का आकाश जल था / उनका आकाश जल के समान था
  rationale: मूल में स्वामित्वसूचक रूप है, पर ‘ऊपर’ या ‘समान’ स्पष्ट रूप से नहीं है। इसलिए विचित्र अपोकैलिप्टिक कथन को समझाकर सामान्य बनाने के बजाय ज्यों का त्यों रखा गया है।
- issue: आग और करूबों के संबंध की प्रकृति
  choice: आग के करूब
  alternative: अग्निमय करूब / आग से बने करूब
  rationale: मूल संबंधवाचक पद आग से संबंध बताता है, पर उसकी सटीक प्रकृति नहीं। चुना हुआ रूप इस अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, दृश्यात्मक और सहज शैली रखी गई है। मूल की पुनरुक्ति, असामान्य स्वामित्वसूचक रूप और अपोकैलिप्टिक तनाव को सरल करके हटाया नहीं गया।
