base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/005.yaml
  text: And from now on you shall not ascend into heaven for all eternity[b][a], and on the earth it has been declared that you shall be bound for all the days of eternity.
translation:
  language: hi
  text: और अब से तुम अनंतकाल तक स्वर्ग में नहीं चढ़ोगे,[a] और पृथ्वी पर यह घोषित किया गया है[b] कि तुम अनंतकाल के सभी दिनों तक बँधे रहोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इथियोपिक पाठ इस पद में अवधि बताने वाले दो मिलते-जुलते सूत्रों का प्रयोग करता है—एक स्वर्ग में चढ़ने की मनाही के बाद और दूसरा बाँधे जाने के दण्ड के बाद। अनुवाद ने दोनों को केवल एक ही ‘सदा’ में नहीं मिला दिया है।
    reason: lexical_alternative
  - marker: b
    text: ‘यह घोषित किया गया है’ में घोषणा करने वाला कर्ता मूल पाठ की तरह अप्रकट है; प्रसंग किसी स्वर्गीय न्यायादेश की ओर संकेत करता है।
    reason: cultural_note
lexical_decisions:
- source_word: እምይእዜ
  choice: अब से
  rationale: यह न्यायादेश से आरम्भ होने वाली नई स्थिति का काल-सूचक है; ‘अब से’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ኢትዓርጉ
  choice: तुम ... नहीं चढ़ोगे
  rationale: नकारात्मक क्रियारूप को आदेश मात्र न बनाकर गंभीर भविष्यसूचक न्याय-घोषणा के रूप में रखा गया है।
- source_word: ውስተ ሰማይ
  choice: स्वर्ग में
  rationale: इस अपोकैलिप्टिक प्रसंग में पृथ्वी के विपरीत दिव्य लोक अभिप्रेत है, केवल आकाश नहीं।
- source_word: እስከ ኵሉ ዓለም
  choice: अनंतकाल तक
  rationale: यह अवधि की पूर्णता व्यक्त करने वाला सूत्र है; हिन्दी में ‘अनंतकाल तक’ उसका गंभीर और सहज रूप है।
- source_word: ወውስተ ምድር ተነግረ
  choice: और पृथ्वी पर यह घोषित किया गया है
  rationale: निष्क्रिय वाक्य-रचना को बनाए रखकर घोषणा करने वाले अधिकारी को स्रोत की तरह अप्रकट छोड़ा गया है।
- source_word: ይእስርክሙ
  choice: तुम ... बँधे रहोगे
  rationale: ‘बँधे’ विद्रोही स्वर्गीय प्राणियों के दण्ड की ठोस छवि को सुरक्षित रखता है; ‘कैद’ अधिक व्याख्यात्मक होता।
- source_word: በኵሉ መዋዕለ ዓለም
  choice: अनंतकाल के सभी दिनों तक
  rationale: दूसरे अवधि-सूत्र में ‘दिनों’ को स्पष्ट रखकर मूल की पुनरुक्ति और न्यायिक लय को संरक्षित किया गया है।
theological_decisions:
- issue: दण्ड को सामान्य कारावास के रूप में कहना या बन्धन की ठोस अपोकैलिप्टिक छवि बनाए रखना
  choice: तुम अनंतकाल के सभी दिनों तक बँधे रहोगे
  alternative: तुम सदा कैद में रहोगे
  rationale: मूल का बन्धन-संबंधी शब्द प्रहरी-दूतों के न्याय की मूर्त छवि रखता है; ‘कैद’ उस छवि को सामान्य और अधिक व्याख्यात्मक बना देता।
- issue: घोषणा करने वाले को स्पष्ट रूप से परमेश्वर बताना या निष्क्रियता की अस्पष्टता सुरक्षित रखना
  choice: यह घोषित किया गया है
  alternative: परमेश्वर ने घोषित किया है
  rationale: मूल में घोषणा का कर्ता व्यक्त नहीं है। प्रसंग स्वर्गीय न्यायादेश की ओर संकेत करता है, पर अनुवाद में कर्ता जोड़ना स्रोत की वास्तविक अस्पष्टता को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर, न्यायिक और अपोकैलिप्टिक स्वर रखा गया है। वाक्य सामान्य पाठक के लिए सहज है, जबकि अवधि-सूत्रों की पुनरुक्ति, बन्धन की मूर्त छवि और निष्क्रिय घोषणा की अस्पष्टता सुरक्षित हैं।
