base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/007.yaml
  text: And your petition on their behalf will not be granted; nor on your own behalf; and you yourselves, while you weep and make supplication, will not speak a single word from the book that I wrote.
translation:
  language: hi
  text: और उनकी ओर से की गई तुम्हारी विनती स्वीकार नहीं होगी[a], न तुम्हारी अपनी ओर से की गई विनती; और तुम स्वयं रोते और विनती करते हुए उस पुस्तक में से, जो मैंने लिखी है, एक भी शब्द नहीं बोलोगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘नहीं होगी’; विनती के संदर्भ में इसका अर्थ ‘स्वीकार नहीं होगी’ या ‘पूरी नहीं होगी’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम वाक्यांश कठिन है। इसका अर्थ यह हो सकता है कि वे लिखी हुई विनती में से कोई बात प्रस्तुत या दोहरा नहीं सकेंगे; निषेध, असमर्थता, या निष्फलता का ठीक आशय पाठ स्पष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: ስእለትክሙ
  choice: तुम्हारी विनती
  rationale: यह संज्ञा अनुरोध या अनुनय का बोध कराती है। ‘विनती’ आधुनिक हिन्दी में सहज है और मध्यस्थता के औपचारिक प्रार्थनात्मक संदर्भ को बनाए रखती है।
- source_word: በእንቲአሆሙ
  choice: उनकी ओर से की गई
  rationale: यह पदबंध प्रतिनिधित्व अथवा मध्यस्थता सूचित करता है; हिन्दी में यह रूप उसी संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ኢይከውን
  choice: स्वीकार नहीं होगी
  rationale: शाब्दिक अर्थ ‘नहीं होगी’ है, पर विनती के संदर्भ में उसका स्वाभाविक आशय उसका स्वीकार या पूरा न होना है। ‘स्वीकार नहीं होगी’ सीमित संदर्भगत विस्तार है।
- source_word: በእንቲአክሙ
  choice: तुम्हारी अपनी ओर से की गई विनती
  rationale: यह पिछले पदबंध के समानांतर है। हिन्दी में संज्ञा ‘विनती’ दोहराने से अपूर्ण वाक्यांश का आशय स्पष्ट होता है और दोनों पक्षों के लिए अस्वीकृति बनी रहती है।
- source_word: አንትሙሂ
  choice: तुम स्वयं
  rationale: यह सर्वनाम बलाघात देता है; ‘तुम स्वयं’ इस बात पर जोर रखता है कि संबोधित जन खुद यह करेंगे।
- source_word: እንዘ ትበክዩ ወታስተበቍዑ
  choice: रोते और गिड़गिड़ाते हुए
  rationale: እንዘ परिस्थितिसूचक संबंध बनाता है। ‘हुए’ मुख्य क्रिया के साथ-साथ चल रही क्रियाओं को दिखाता है; ‘गिड़गिड़ाना’ तीव्र अनुनय को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ኢትተናገሩ
  choice: नहीं बोलोगे
  rationale: नकारात्मक वचन-क्रिया का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ኢምንተ ቃለ
  choice: एक भी शब्द
  rationale: नकार के साथ ‘एक भी शब्द’ मूल की बलात्मक अभिव्यक्ति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: እምውስተ መጽሐፍ ዘጻሐፍኩ
  choice: उस पुस्तक में से, जिसे मैंने लिखा है
  rationale: መጽሐፍ को ‘पुस्तक’ और संबंधवाचक उपवाक्य को स्पष्ट रखा गया है; ‘में से’ लिखित सामग्री से शब्द बोलने का संबंध व्यक्त करता है।
theological_decisions:
- issue: अंतिम उपवाक्य का आशय—क्या पहरेदार हनोक की लिखित विनती बोल नहीं सकते, उन्हें अनुमति नहीं है, या उससे उन्हें कोई उत्तर नहीं मिलेगा
  choice: 'सतही व्याकरण के अनुसार उनकी वाणी का निषेध रखा गया है: वे पुस्तक में से एक भी शब्द नहीं बोलेंगे।'
  alternative: ‘उन्हें पुस्तक में से एक भी शब्द बोलने नहीं दिया जाएगा’ अथवा ‘पुस्तक के माध्यम से उन्हें कोई उत्तर नहीं मिलेगा।’
  rationale: गीज़ पाठ सीधे उनके बोलने को नकारता है, अनुमति या परमेश्वर के उत्तर को स्पष्ट रूप से नहीं। इसलिए निषेध, असमर्थता और निष्फलता के बीच का तनाव अनिर्णीत रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘विनती’, ‘स्वीकार’ और ‘पुस्तक’ औपचारिक संदर्भ बनाए रखते हैं, जबकि ‘गिड़गिड़ाते हुए’ तीव्र अनुनय को बिना अतिशय पुरातनता के व्यक्त करता है।
