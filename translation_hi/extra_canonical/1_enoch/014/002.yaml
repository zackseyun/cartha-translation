base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/002.yaml
  text: I saw in my sleep what I now speak with a tongue of flesh and with my spirit[a], which the Great One has given to men as a mouth[c][b], so that they might speak with it and understand in the heart.
translation:
  language: hi
  text: मैंने अपनी नींद में वह देखा जिसके बारे में अब मैं मांस की जीभ और अपनी साँस[a] से बोलता हूँ—वह साँस जिसे महान ने मनुष्यों को मुख के रूप में दिया है[b]—ताकि वे उससे बोलें और हृदय में समझें[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी आत्मा से।” गीइज़ शब्द का अर्थ “साँस” या “आत्मा” हो सकता है; जीभ, मुख और बोलने का निकट संदर्भ “साँस” के पक्ष में है।
    reason: lexical_alternative
  - marker: b
    text: 'मूल पाठ का वाक्य-विन्यास असामान्य है, पर उसमें “मुख” शब्द स्पष्ट रूप से मौजूद है। संबंधवाचक खंड का निकटतम संबंध “साँस/आत्मा” से समझा गया है: “जिसे महान ने मनुष्यों को मुख के रूप में दिया है।”'
    reason: textual_syntax_note
  - marker: c
    text: यहाँ “हृदय” केवल भावनाओं का नहीं, बल्कि मनुष्य के भीतरी विचार और समझ का केंद्र है।
    reason: cultural_note
lexical_decisions:
- source_word: ርኢኩ
  choice: मैंने ... देखा
  rationale: साधारण भूतकाल दृष्टि-वृत्तांत को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: በንዋምየ
  choice: अपनी नींद में
  rationale: मूल शब्द नींद अथवा स्वप्नावस्था का बोध करा सकता है; यह चयन किसी विशिष्ट स्वप्न-वस्तु की अपेक्षा दर्शन की अवस्था को सामने रखता है।
- source_word: ይእዜ እነግር
  choice: अब मैं ... कहता हूँ
  rationale: वर्तमान कथन को पहले देखे गए दर्शन से जोड़ता है और बोलने से संबंधित आगे के शब्दों के अनुकूल है।
- source_word: በልሳን ዘሥጋ
  choice: मांस की जीभ
  rationale: मूल की सजीव देहगत अभिव्यक्ति और उसका प्रलयदर्शी स्वर बनाए रखा गया है।
- source_word: ወበመንፈስየ
  choice: और अपनी साँस से
  rationale: መንፈስ का अर्थ साँस या आत्मा दोनों हो सकता है। जीभ, मुख और बोलने के निकट संदर्भ में 'साँस' अधिक स्वाभाविक है; दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ዓቢይ
  choice: महान
  rationale: ईश्वरीय विशेषण को किसी अधिक सामान्य नाम से बदलने के बजाय मूल का ऊँचा और संक्षिप्त संबोधन रखा गया है।
- source_word: አፈ ለሰብእ
  choice: मनुष्यों को मुख के रूप में
  rationale: मूल में उपस्थित 'मुख' को छोड़े बिना ለሰብእ को 'मनुष्यों को' समझा गया है। असामान्य वाक्य-संबंध जानबूझकर पूरी तरह समतल नहीं किया गया।
- source_word: ወይለብዉ በልብ
  choice: और हृदय में समझें
  rationale: प्राचीन मानव-विज्ञान में हृदय आंतरिक बोध का स्थान है; इसे केवल भावना तक सीमित नहीं किया गया।
theological_decisions:
- issue: मानवीय वाणी के इस कथन में መንፈስ का अर्थ
  choice: साँस
  alternative: आत्मा
  rationale: मांस की जीभ, मुख और बोलने की निकटवर्ती भाषा देहगत वाणी की साँस की ओर संकेत करती है, पर आत्मा का अर्थ भी वास्तविक संभावना है और पादटिप्पणी में दिया गया है।
- issue: ዓቢይ का ईश्वरीय संबोधन
  choice: महान
  alternative: परमेश्वर
  rationale: मूल के विशिष्ट विशेषण को सुरक्षित रखा गया है और ऐसा स्पष्ट संज्ञा-पद नहीं जोड़ा गया जो पाठ में नहीं है।
- issue: ‘मुख’ और संबंधवाचक उपवाक्य का असामान्य विन्यास
  choice: महान ने इसे मनुष्यों को मुख के रूप में दिया है
  alternative: महान ने इसे मनुष्यों को दिया है
  rationale: वैकल्पिक रूप अधिक सहज है, पर वह मूल में स्पष्ट አፈ (‘मुख’) को हटा देता है। कठिन पाठ को अर्थगत तनाव सहित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली अपनाई गई है। ‘मांस की जीभ’ और ‘हृदय में’ जैसी मूल की प्राचीन मानव-विज्ञान संबंधी छवियाँ सुरक्षित रखी गई हैं। ‘महान’ को ईश्वरीय उपाधि के रूप में बिना किसी सांप्रदायिक विस्तार के रखा गया है।
