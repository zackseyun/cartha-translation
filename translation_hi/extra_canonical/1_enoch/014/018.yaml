base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/018.yaml
  text: And I looked and saw within it a lofty throne[a]; and its appearance was like crystal, and its wheels like the shining sun[d][c][b], and the voice of the cherubim.
translation:
  language: hi
  text: मैंने दृष्टि डाली और देखा कि उसके भीतर एक ऊँचा सिंहासन था। उसका रूप स्फटिक[a] के समान था, उसके पहिए[b] चमकते सूर्य के समान थे, और करूबों का स्वर था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त शब्द का अर्थ हिम, पाला या कोई चमकीला स्फटिक-जैसा पदार्थ भी हो सकता है; चित्र अत्यंत उज्ज्वल और पारदर्शी रूप का है।
    reason: lexical_alternative
  - marker: b
    text: मूल शब्द का अर्थ “घेरा” या “परिधि” भी हो सकता है; प्राचीन यूनानी और अरामी पाठ-साक्ष्य यहाँ सिंहासन के “पहियों” का समर्थन करते हैं।
    reason: textual_and_lexical_alternative
  - marker: c
    text: गीइज़ में अंतिम पद बहुत संक्षिप्त है—शाब्दिक रूप से, “और करूबों का स्वर।” यह संभवतः सिंहासन-दर्शन की एक श्रव्य विशेषता जोड़ता है।
    reason: source_syntax
lexical_decisions:
- source_word: ነጸርኩ፡ ወርኢኩ
  choice: मैंने दृष्टि डाली और देखा
  rationale: दोनों दृष्टि-संबंधी क्रियाओं को बनाए रखा गया है, ताकि दर्शन-वर्णन की बलाघाती शैली न मिटे और हिंदी स्वाभाविक भी रहे।
- source_word: ውስቴቱ
  choice: उसके भीतर
  rationale: पूर्ववर्ती भवन अथवा संरचना के अंदर दिखाई देने वाली वस्तु का सीधा स्थान-सूचक अनुवाद।
- source_word: መንበረ፡ ልዑለ
  choice: एक ऊँचा सिंहासन
  rationale: यह दृश्य ऊँचाई और राजसी गरिमा दोनों व्यक्त करता है, बिना इसे किसी विशिष्ट धर्मवैज्ञानिक उपाधि में बदलने के।
- source_word: ራእዩ
  choice: उसका रूप
  rationale: सिंहासन के दिखाई देने वाले स्वरूप के लिए सहज आधुनिक हिंदी अभिव्यक्ति।
- source_word: አስሐትያ
  choice: स्फटिक
  rationale: चमकीले, पारदर्शी अथवा हिम-सदृश पदार्थ की दर्शनीय छवि को संक्षेप और गरिमा से व्यक्त करता है; शब्द की अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: ክበቡ
  choice: उसके पहिए
  rationale: शब्द का मूल अर्थ घेरा, परिधि या पहिया हो सकता है; सिंहासन-दर्शन के संदर्भ तथा प्राचीन यूनानी और अरामी साक्ष्यों के आधार पर यहाँ पहिए अभिप्रेत हैं।
- source_word: ፀሐይ፡ ዘያበርህ
  choice: चमकते सूर्य
  rationale: सूर्य के प्रकाश देने अथवा दीप्त होने वाली मूल संबंधवाचक अभिव्यक्ति को स्वाभाविक हिंदी में रखता है।
- source_word: ቃለ፡ ኪሩቤን
  choice: करूबों का स्वर
  rationale: ቃል आवाज़, स्वर या ध्वनि बता सकता है। 'स्वर' संक्षिप्त मूल वाक्यांश की श्रव्य विशेषता को बनाए रखता है; पारंपरिक नाम 'करूब' का बहुवचन हिंदी रूप में दिया गया है।
theological_decisions:
- issue: सिंहासन के विशेषण का अर्थ
  choice: ऊँचा सिंहासन
  alternative: महिमामय/अति महान सिंहासन
  rationale: मूल पद ऊँचाई और उत्कर्ष दोनों का संकेत दे सकता है। 'ऊँचा' दृश्य अर्थ को प्राथमिक रखता है और कोई अतिरिक्त धर्मवैज्ञानिक उपाधि आरोपित नहीं करता।
- issue: घेरे अथवा पहियों की पहचान
  choice: पहिए
  alternative: परिधि या चारों ओर का घेरा
  rationale: स्थानीय शब्दार्थ अस्पष्ट है, पर सिंहासन-दर्शन का संदर्भ और यूनानी व अरामी पाठ-साक्ष्य पहियों का समर्थन करते हैं। वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- issue: करूबों के स्वर वाले अंतिम वाक्यांश की अपूर्णता
  choice: और करूबों का स्वर था
  alternative: और करूबों का स्वर सुनाई दे रहा था
  rationale: मूल गीइज़ वाक्यांश अत्यंत संक्षिप्त है और पूर्ण क्रिया नहीं देता। हिंदी में केवल आवश्यक संयोजक क्रिया जोड़कर उसकी संक्षिप्तता और व्याख्यात्मक खुलापन बचाया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल किंतु गरिमापूर्ण दर्शन-वर्णन। 'स्फटिक' और 'करूब' जैसे पारंपरिक शब्द प्रसंग की गंभीरता बनाए रखते हैं; कठिन अथवा संदिग्ध अर्थों को मुख्य पाठ में विस्तार देने के बजाय पादटिप्पणियों में स्पष्ट किया गया है।
