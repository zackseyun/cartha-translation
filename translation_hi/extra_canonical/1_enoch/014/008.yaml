base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/008.yaml
  text: 'And a vision showed me thus: behold[a], in the vision the clouds were calling me, and the mist was calling me; and the course of the stars and the lightnings were driving me and urging me on, and in the vision the winds were making me fly, and carrying me off[c][b], and lifting me upward into heaven.'
translation:
  language: hi
  text: 'और मुझे एक दर्शन में यह दिखाया गया: देखो, उस दर्शन में बादल मुझे पुकार रहे थे और धुंध मुझे पुकार रही थी; तारों की गति[a] और बिजलियाँ मुझे आगे धकेल रही थीं और तेजी से आगे बढ़ा रही थीं; और उस दर्शन में हवाएँ[b] मुझे उड़ा रही थीं, मुझे बहाए लिए जा रही थीं और ऊपर स्वर्ग में उठा रही थीं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तारों का वेग” अथवा “तारों के मार्ग”; गीइज़ अभिव्यक्ति स्थिर तारों की अपेक्षा उनकी गति का बोध कराती है।
    reason: lexical_alternative
  - marker: b
    text: “हवाएँ” का अनुवाद “आत्माएँ” भी हो सकता है, पर निकटवर्ती संदर्भ में हनोक को ऊपर ले जाने वाली वायुमंडलीय शक्तियाँ अधिक संभावित हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ራእይ
  choice: दर्शन
  rationale: प्रकाशनात्मक दृश्य के लिए मानक और स्वाभाविक हिन्दी शब्द; पद में इसकी पुनरावृत्ति भी बनाए रखी गई है।
- source_word: አስተአርአየኒ
  choice: मुझे ... दिखाया
  rationale: कारक रूप का दृश्यात्मक अर्थ सुरक्षित रखता है और इसे केवल अमूर्त 'प्रकट किया' नहीं बनाता।
- source_word: ደመናት
  choice: बादल
  rationale: मूल बहुवचन और सामान्य मौसम-संबंधी अर्थ को सीधे व्यक्त करता है।
- source_word: ይጼውዑኒ / ይጼውዐኒ
  choice: मुझे पुकार रहे थे / मुझे पुकार रही थी
  rationale: दोनों खंडों में मूल क्रिया की पुनरावृत्ति तथा बादल और धुंध के सक्रिय आह्वान को बनाए रखता है।
- source_word: ጊሜ
  choice: धुंध
  rationale: एकवचन वाष्पमय वातावरण को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ሩጸተ ከዋክብት
  choice: तारों की दौड़
  rationale: ሩጸተ के गतिशील 'दौड़ने' के भाव को 'मार्ग' जैसे स्थिर अर्थ की अपेक्षा अधिक स्पष्टता से सुरक्षित रखता है।
- source_word: መበርቅት
  choice: बिजलियाँ
  rationale: बहुवचन विद्युत्-चमकों को पद के ऊर्जस्वी प्राकृतिक चित्रण में सहज हिन्दी से व्यक्त करता है।
- source_word: ይንጐዑኒ
  choice: मुझे आगे धकेल रही थीं
  rationale: बलपूर्वक गति कराने का अर्थ सुरक्षित रखता है।
- source_word: ወተያድህቁኒ
  choice: मुझे शीघ्रता से आगे बढ़ा रही थीं
  rationale: साथ लगी क्रिया के त्वरण और आगे ले जाने के अर्थ को पहली क्रिया से अलग रखते हुए व्यक्त करता है।
- source_word: ነፋሳት
  choice: हवाएँ
  rationale: बादल, धुंध और बिजलियों के तात्कालिक संदर्भ में मौसम-संबंधी अर्थ सर्वाधिक उपयुक्त है; 'आत्माएँ' की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: ያበርሩኒ
  choice: मुझे उड़ा रही थीं
  rationale: उड़ने की स्पष्ट कारक क्रिया को सामान्य 'ले जा रही थीं' में समतल नहीं करता।
- source_word: ያንጉጹኒ
  choice: मुझे बहाए लिए जा रही थीं
  rationale: हवाओं द्वारा बलपूर्वक दूर ले जाए जाने की सजीव अनुभूति देता है।
- source_word: ላዕለ ውስተ ሰማይ
  choice: ऊपर स्वर्ग के भीतर
  rationale: ऊर्ध्व दिशा और स्वर्ग में प्रवेश—दोनों संकेतों को बनाए रखता है।
theological_decisions:
- issue: ነፋሳት का अर्थ 'हवाएँ' हो या 'आत्माएँ'
  choice: हवाएँ
  alternative: आत्माएँ
  rationale: पद में मौसमीय और ब्रह्मांडीय शक्तियों की शृंखला है, इसलिए स्थानीय संदर्भ 'हवाएँ' का समर्थन करता है; फिर भी स्रोत की संभावित आध्यात्मिक अर्थच्छाया पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। मूल की बार-बार जुड़ती क्रियाओं और तीव्र आरोहण-गति को सुरक्षित रखा गया है। मुख्य पाठ में सभी पादटिप्पणी चिह्न उपस्थित हैं।
