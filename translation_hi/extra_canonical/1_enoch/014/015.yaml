base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/015.yaml
  text: And behold[a], another house, greater than that one, and every doorway stood open before me[c][b]; and it was built with tongues of fire.
translation:
  language: hi
  text: और देखो, एक और भवन था, जो उस भवन से बड़ा था[a]; और हर द्वार मेरे सामने खुला था[b], और वह आग की जिह्वाओं से बनाया गया था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उस भवन से विशाल’ भी सम्भव है। यहाँ ‘बड़ा’ आकार के साथ महत्ता का भाव भी व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सब द्वार मेरे सामने खुले थे।’ मूल अभिव्यक्ति को वितरणात्मक रूप में ‘हर द्वार’ और सामूहिक रूप में ‘सब द्वार’—दोनों तरह समझा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘आग की जिह्वाएँ’ मूल की ठोस छवि को बनाए रखता है; इसे ‘आग की लपटें’ भी कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ናሁ
  choice: देखो
  rationale: यह दर्शनीय अनुभव में अचानक ध्यान खींचने वाले संकेत का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: ካልእ ቤት
  choice: एक और भवन
  rationale: ‘भवन’ मूल के ‘घर’ अथवा वास्तु-संरचना के अर्थ को रखता है और प्रसंग को अनावश्यक रूप से ‘मन्दिर’ या ‘महल’ नहीं बनाता।
- source_word: ዘየዓቢ እምዝክቱ
  choice: उस भवन से बड़ा
  rationale: दूरवाची ዝክቱ का अर्थ ‘उस’ है; ‘बड़ा’ आकार और महत्ता, दोनों की सम्भावना खुली रखता है।
- source_word: ኵሉ ኆኅተ
  choice: हर द्वार
  rationale: यह परिमाणवाचक शब्द के वितरणात्मक बल को सुरक्षित रखता है; सामूहिक अनुवाद ‘सब द्वार’ भी सम्भव है।
- source_word: ርኁት በቅድሜየ
  choice: मेरे सामने खुला था
  rationale: यह द्वार की खुली हुई अवस्था और दृष्टा के स्थानिक दृष्टिकोण, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ሕኑጽ
  choice: बनाया गया था
  rationale: यह वास्तु-निर्माण का सीधा अर्थ देता है और किसी विशेष निर्माण-विधि की कल्पना नहीं जोड़ता।
- source_word: በልሳናተ እሳት
  choice: आग की जिह्वाओं से
  rationale: यह मूल की मूर्त और असाधारण दर्शनीय छवि को ‘लपटें’ कहकर सपाट किए बिना सुरक्षित रखता है।
theological_decisions:
- issue: दर्शन में दिखाई गई वास्तु-संरचना की प्रकृति
  choice: भवन
  alternative: महल या मन्दिर
  rationale: मूल शब्द सामान्यतः ‘घर/भवन’ है। व्यापक प्रसंग किसी स्वर्गीय महल या मन्दिर का संकेत दे सकता है, पर मुख्य पाठ उस पहचान को निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण दर्शनीय-वर्णन। वाक्य की पुनरुक्त संयोजक शैली मूल के प्रवाह को कुछ हद तक बनाए रखती है। ‘भवन’ सामान्य पाठक के लिए स्पष्ट है और ‘मन्दिर’ या ‘महल’ जैसी व्याख्यात्मक विशिष्टता से बचता है।
