translation:
  language: hi
  text: और दीवारों के चारों ओर आग जल रही थी, और उनके नीचे आग धधक रही थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रस्तुत गीइज़ पाठ का अर्थ ‘उनके नीचे’ है। कुछ पाठ-संशोधनों में, यूनानी साक्ष्य के आधार पर, ‘और उसके द्वार आग से जल रहे थे’ पढ़ा जाता है।
    reason: textual_variant
lexical_decisions:
- source_word: እሳት
  choice: आग
  rationale: मूल पद में यह सामान्य संज्ञा दो बार आती है; हिन्दी में भी ‘आग’ रखकर दर्शन का प्रखर बिंब सुरक्षित किया गया है।
- source_word: ዘይነድድ
  choice: जल रही थी
  rationale: यह आग की चल रही क्रिया या अवस्था बताता है; वर्णनात्मक दर्शन के संदर्भ में यह सहज हिन्दी है।
- source_word: በአውደ
  choice: चारों ओर
  rationale: यह चारों तरफ घिरे होने का स्थानिक भाव स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: አረፍት
  choice: दीवारों
  rationale: यहाँ शब्द को ‘दीवार’ के बहुवचन के रूप में लिया गया है; निकटवर्ती स्थापत्य-संदर्भ भी इसी अर्थ का समर्थन करता है।
- source_word: ጥሕቱ
  choice: उनके नीचे
  rationale: प्रस्तुत गीइज़ पाठ का सीधा स्थानिक अर्थ ‘नीचे’ है; हिन्दी में बहुवचन ‘दीवारों’ के अनुसार ‘उनके’ रखा गया है।
- source_word: ይውዒ በእሳት
  choice: आग धधक रही थी
  rationale: यह अभिव्यक्ति आग के सक्रिय रूप से प्रज्वलित या धधकने का भाव देती है; अनावश्यक पुनरुक्ति से बचते हुए अग्नि-बिंब बनाए रखा गया है।
theological_decisions:
- issue: आग से घिरी वस्तु को अस्पष्ट सर्वनाम मानना या दीवारें कहना
  choice: मुख्य पाठ में ‘दीवारों’
  alternative: ‘उसके चारों ओर’
  rationale: አረፍት को दीवारों का बहुवचन समझना भाषिक और निकटवर्ती स्थापत्य-संदर्भ के अनुरूप है; इसलिए अस्पष्ट सर्वनाम से अर्थ को अनावश्यक रूप से धुंधला नहीं किया गया।
- issue: ወጥሕቱ को प्रस्तुत पाठ के अनुसार पढ़ना या पाठ-संशोधन से ‘उसके द्वार’ मानना
  choice: प्रस्तुत गीइज़ पाठ के अनुसार ‘उनके नीचे’
  alternative: ‘उसके द्वार आग से जल रहे थे’
  rationale: दिए गए गीइज़ साक्ष्य में ወጥሕቱ का स्थानिक अर्थ है। द्वारों वाला पाठ यूनानी समानांतर और प्रस्तावित गीइज़ पाठ-संशोधन से समर्थित है, पर उसे बिना संकेत मुख्य पाठ में अपनाना प्रस्तुत साक्ष्य को बदल देना होता; इसलिए भिन्न पाठ को पादटिप्पणी में पारदर्शी रूप से बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दर्शनात्मक शैली रखी गई है। ‘धधक रही थी’ सक्रिय अग्नि का बिंब देता है, जबकि पाठगत अनिश्चितता को मुख्य पाठ में चुपचाप सुलझाने के बजाय पादटिप्पणी में दर्ज किया गया है।
