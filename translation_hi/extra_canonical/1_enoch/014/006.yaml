base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/006.yaml
  text: And before this[a], you will have seen the destruction of your beloved sons, and you will not have them for yourselves[c][b], but they will fall before you by the sword.
translation:
  language: hi
  text: और इससे पहले तुम अपने प्यारे पुत्रों का विनाश देख चुके होगे,[a] और तुम उन्हें अपने लिए न रख सकोगे;[b] बल्कि वे तुम्हारे सामने तलवार से गिर पड़ेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम अपने प्यारे पुत्रों का विनाश देखोगे।” क्रिया को भविष्य पूर्ण के बजाय सरल भविष्य भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह वाक्यांश गीज़ पाठ में कठिन है। उपलब्ध ग्रीक पाठ का अर्थ है, “उनसे तुम्हें कोई सुख (या लाभ) न मिलेगा”; कठिन गीज़ रूप को “उनकी संपत्ति तुम्हारे पास न रहेगी” भी समझा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: እምቅድመ ዝንቱ
  choice: इससे पहले
  rationale: यह पद पिछले कथन से पहले घटनेवाली घटना बताता है; संक्षिप्त और स्वाभाविक हिन्दी में कालक्रम सुरक्षित रहता है।
- source_word: ርኢክሙ
  choice: देख चुके होगे
  rationale: द्वितीय पुरुष बहुवचन के पूर्ण रूप को भविष्यसूचक संदर्भ में भविष्य पूर्ण के रूप में व्यक्त किया गया है; सरल भविष्य की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: ሐጕለ
  choice: विनाश
  rationale: यह शब्द घोर हानि या बरबादी का अर्थ देता है और तलवार से होनेवाली मृत्यु के संदर्भ में उपयुक्त है, बिना अनावश्यक विस्तार जोड़े।
- source_word: ውሉድክሙ ፍቁራን
  choice: अपने प्यारे पुत्रों
  rationale: ውሉድ संतान को सूचित कर सकता है, पर पुरुषवाचक बहुवचन विशेषण और पहरेदारों की संतानों के स्थानीय संदर्भ के कारण ‘पुत्रों’ चुना गया है।
- source_word: አልብክሙ †ጥራያኒሆሙ†
  choice: वे तुम्हारे लिए न रहेंगे
  rationale: गीज़ पाठ का अंतिम शब्द पाठ-संदिग्ध और ओबेलस-चिह्नित है। मुख्य पाठ में वंचित हो जाने का व्यापक अर्थ रखा गया है; ग्रीक साक्ष्य और गीज़ के सम्भावित शाब्दिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: ይወድቁ ቅድሜክሙ በሰይፍ
  choice: वे तुम्हारे सामने तलवार से गिर पड़ेंगे
  rationale: यह न्याय-वर्णन की सजीव छवि, प्रत्यक्ष उपस्थिति और हिंसक साधन—तीनों को सुरक्षित रखता है।
theological_decisions:
- issue: ‘तुम्हारे प्यारे पुत्रों’ का संकेत
  choice: यह पहरेदारों से उनकी दैत्याकार संतानों के विषय में कहा गया है।
  alternative: इसे सामान्य रूप से मानव पिताओं की संतानों या व्यापक अर्थ में वंशजों पर लागू समझना।
  rationale: आस-पास का न्याय-वचन पहरेदारों और निषिद्ध संबंधों से उत्पन्न उनकी संतानों को संबोधित करता है; मुख्य पाठ में ‘दैत्य’ जोड़कर अस्पष्टता को अनावश्यक रूप से सीमित नहीं किया गया।
- issue: पाठ-संदिग्ध वाक्यांश का अर्थ
  choice: ‘वे तुम्हारे लिए न रहेंगे’—संतानों से वंचित होने का व्यापक कथन।
  alternative: ग्रीक साक्ष्य के अनुसार ‘उनसे तुम्हें कोई सुख/लाभ न मिलेगा,’ अथवा कठिन गीज़ रूप के आधार पर ‘उनकी संपत्ति तुम्हारे पास न रहेगी।’
  rationale: गीज़ शब्द भ्रष्ट या कठिन माना गया है। व्यापक मुख्य-पाठ पाठन कथानक के अर्थ को बनाए रखता है, जबकि पादटिप्पणी प्रमुख प्राचीन वैकल्पिक साक्ष्यों को स्पष्ट करती है और तनाव को नहीं मिटाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, भविष्यसूचक और गरिमापूर्ण शैली रखी गई है। ‘तुम’ बहुवचन संबोधन है। वाक्य को सामान्य पाठक के लिए सहज रखा गया है, जबकि कालगत और पाठगत अनिश्चितताएँ पादटिप्पणियों में स्पष्ट की गई हैं।
