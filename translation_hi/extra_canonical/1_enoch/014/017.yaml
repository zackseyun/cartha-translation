base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/017.yaml
  text: And its floor was of fire[a], and above it were lightnings and the path of the stars[b], and its ceiling was blazing fire.
translation:
  language: hi
  text: और उसका फर्श आग का था; उसके ऊपर बिजलियाँ और तारों का मार्ग[a] थे, और उसकी छत[b] धधकती हुई आग की थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तारों का मार्ग’ का अनुवाद ‘तारों का गति-पथ’ या ‘तारों का क्रमित पथ’ भी हो सकता है; इससे आकाश में उनकी व्यवस्थित गति का संकेत मिलता है।
    reason: lexical_alternative
  - marker: b
    text: ‘छत’ के लिए प्रयुक्त शब्द का अनुवाद ‘ऊपरी आवरण’ या, कम संभावना से, ‘आकाशमंडल’ भी किया जा सकता है—यह इस पर निर्भर है कि दृश्य को मुख्यतः स्थापत्य माना जाए या ब्रह्मांडीय।
    reason: lexical_alternative
