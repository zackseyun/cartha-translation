- source_word: ዘእሳት
  choice: आग का
  rationale: संबंधसूचक रचना को सीधे रूप में रखा गया है, जिससे दर्शन का तीखा अग्निमय बिंब बना रहता है।
- source_word: መልዕልቴሁ
  choice: उसके ऊपर
  rationale: यह स्थान-संबंधी अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है और दृश्य के क्रम को बनाए रखता है।
- source_word: መበርቅት
  choice: बिजलियाँ
  rationale: बहुवचन रूप दर्शन में बार-बार या अनेक बिजली की चमकों का बोध कराता है; ‘बिजलियाँ’ संक्षिप्त और स्वाभाविक है।
- source_word: ምርዋፀ
  choice: मार्ग
  rationale: शब्द मार्ग, पथ अथवा नियत गति-पथ का अर्थ दे सकता है। ‘मार्ग’ पठनीय रहते हुए तारों की व्यवस्थित गति की संभावना खुली रखता है।
- source_word: ከዋክብት
  choice: तारों का
  rationale: बहुवचन संज्ञा का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ጠፈሩኒ
  choice: उसकी छत
  rationale: यह शब्द ऊपरी आवरण या छत को सूचित करता है। आंतरिक भवन-संदर्भ में ‘छत’ उपयुक्त है, जबकि ‘आकाशमंडल’ दृश्य को आवश्यकता से अधिक ब्रह्मांडीय बना देता।
- source_word: እሳት ዘይነድድ
  choice: धधकती आग
  rationale: शाब्दिक भाव ‘जलती हुई आग’ है। ‘धधकती आग’ पुनरुक्ति को स्वाभाविक हिन्दी में तीव्रता सहित व्यक्त करती है।
theological_decisions:
- issue: स्वर्गीय संरचना में स्थापत्य और ब्रह्मांडीय बिंबों का संबंध
  choice: ‘फर्श’ और ‘छत’ जैसे भवन-संबंधी शब्दों के साथ ‘बिजलियाँ’ और ‘तारों का मार्ग’ जैसे ब्रह्मांडीय बिंबों को साथ रखा गया है।
  alternative: ‘छत’ के स्थान पर ‘आकाशमंडल’ या ‘मेहराबदार आकाश’ कहकर पूरे दृश्य को अधिक ब्रह्मांडीय बनाना।
  rationale: मूल दर्शन स्वर्गीय भवन और ब्रह्मांडीय घटनाओं को जानबूझकर मिलाता है। अनुवाद इस तनाव को बनाए रखता है और दृश्य को न केवल भौतिक भवन, न केवल अमूर्त आकाश के रूप में सीमित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। अर्धविराम से दर्शन के परस्पर जुड़े बिंबों को स्पष्ट किया गया है। पादटिप्पणी-चिह्न उनके वास्तविक विषय—‘तारों का मार्ग’ और ‘छत’—के बाद लगाए गए हैं।
