base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/010.yaml
  text: And I went into the tongue of fire[a], and I drew near to a great house built of hailstones; and the roof of that house was like a mosaic of hailstones[c][b], and its floor was hail.
translation:
  language: hi
  text: और मैं आग की जिह्वा के भीतर गया और ओलों से बने एक विशाल भवन के पास पहुँचा। उस भवन की छत ओलों की पच्चीकारी के समान थी[a], और उसका फर्श ओलों का था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘छत’ के लिए आया गीइज़ शब्द पाठगत रूप से कठिन है; इसका अर्थ भवन की दीवारों अथवा किसी अन्य संरचनात्मक सतह से भी हो सकता है। ‘पच्चीकारी’ से आशय जड़े हुए या नमूनेदार पत्थर के काम से है।
    reason: textual_variant
lexical_decisions:
- source_word: ልሳነ እሳት
  choice: आग की जिह्वा
  rationale: शाब्दिक और सजीव दर्शनीय बिंब को बनाए रखता है; इसे केवल ‘ज्वाला’ कहना मूल रूपक को सामान्य बना देता।
- source_word: ቤት ዓቢይ
  choice: एक विशाल भवन
  rationale: ቤት का सामान्य वास्तु-संबंधी अर्थ सुरक्षित रखते हुए ‘भवन’ हिन्दी में इस असाधारण संरचना के लिए ‘घर’ से अधिक स्वाभाविक है; ‘मन्दिर’ या ‘महल’ जैसी व्याख्यात्मक पहचान नहीं जोड़ी गई।
- source_word: ዘኅኑጽ በእእባነ በረድ
  choice: ओलों के पत्थरों से बने
  rationale: निर्माण और विचित्र पदार्थ—‘ओलों के पत्थर’—दोनों को स्पष्ट रूप से बनाए रखता है।
- source_word: አረፍተ ውእቱ ቤት
  choice: उस भवन की छत
  rationale: दिए गए पाठ-साक्ष्य और नवीनतम पुनरीक्षण के अनुसार इसे भवन के ऊपरी आवरण के रूप में लिया गया है, पर पाठगत कठिनाई को पादटिप्पणी में स्वीकार किया गया है।
- source_word: ከመ ጸፍጸፈ ሳሌዳት በእእባን ዘእምበረድ
  choice: ओलों के पत्थरों की पच्चीकारी के समान
  rationale: नक्शेदार अथवा जड़ी हुई पत्थर-सज्जा का बिंब देता है और छत को अनावश्यक रूप से ‘फर्श’ नहीं कहता।
- source_word: ምድረ በረድ
  choice: उसका फर्श ओला था
  rationale: भवन के भीतर ምድር के लिए ‘फर्श’ प्रसंगानुकूल है; एकवचन पदार्थवाचक ‘ओला’ मूल की तीखी, अलौकिक छवि को बचाता है।
theological_decisions:
- issue: दर्शनीय भवन को मन्दिर या महल के रूप में सामान्यीकृत करना
  choice: ‘विशाल भवन’ और ओलों से बनी उसकी विचित्र रचना को यथावत रखना
  alternative: व्यापक प्रसंग के आधार पर ‘मन्दिर’ या ‘महल’ कहना
  rationale: इस पद में संरचना की ऐसी स्पष्ट धार्मिक या राजकीय पहचान नहीं दी गई; तटस्थ पद मूल की दर्शनीय रहस्यमयता और धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली। अपोकैलिप्टिक बिंबों को सामान्य वास्तु-भाषा में समतल नहीं किया गया। ‘ओलों के पत्थर’ जानबूझकर रखा गया है ताकि मूल की असामान्य सामग्री स्पष्ट रहे।
