base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/013.yaml
  text: And I went into that house[a], and it was hot like fire and cold like ice, and there was no delight of life within it; fear covered me, and trembling seized me.
translation:
  language: hi
  text: और मैं उस भवन में गया। वह आग के समान तप्त और बर्फ के समान ठंडा था, और उसके भीतर जीवन का कोई आनंद न था।[a] भय ने मुझे ढक लिया, और कंपकंपी ने मुझे जकड़ लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘जीवन का कोई आनंद’ वाला गीइज़ वाक्यांश कठिन है। इसका अर्थ यह हो सकता है कि उस भवन के भीतर जीवन देने वाली कोई सुखदता नहीं थी, या अधिक व्यापक रूप से वहाँ जीवित प्राणी के लिए कोई सांत्वना या सुख नहीं था।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወቦእኩ
  choice: और मैं ... में गया
  rationale: यह प्रथम पुरुष एकवचन में भीतर प्रवेश करने की क्रिया है। ‘में गया’ आधुनिक हिन्दी में सहज है और दर्शन में आगे बढ़ने की गति को बनाए रखता है।
- source_word: ውእቱ ቤት
  choice: उस भवन
  rationale: संकेतवाचक पद पहले वर्णित संरचना की ओर लौटता है। दर्शन और सिंहासन-कक्ष के प्रसंग में ‘भवन’ स्वाभाविक है, जबकि ‘उस’ संकेतार्थ को सुरक्षित रखता है।
- source_word: ምውቅ
  choice: तप्त
  rationale: आग के साथ तुलना तीव्र उष्णता दिखाती है। ‘तप्त’ गरिमापूर्ण और स्पष्ट है तथा ‘आग के समान जलता हुआ’ जैसी अनावश्यक पुनरुक्ति से बचता है।
- source_word: ቈሪር
  choice: ठंडा
  rationale: यह मूल विशेषण के सीधे अर्थ को देता है और आग तथा बर्फ के विरोधाभासी दृश्य को बनाए रखता है।
- source_word: በረድ
  choice: बर्फ
  rationale: शब्द का अर्थ ओला, पाला या बर्फ हो सकता है; यहाँ उष्णता और शीत की समांतर तुलना में ‘बर्फ’ सबसे उपयुक्त है।
- source_word: ወኢምንተ ፍግዐ ሕይወት አልቦቱ ውስቴቱ
  choice: और उसके भीतर जीवन का कोई आनंद न था
  rationale: कठिन गीइज़ वाक्यांश को जानबूझकर कुछ असामान्य रखा गया है। यह केवल जैविक जीवन के अभाव के बजाय जीवनदायी सुख या सजीव सांत्वना के अभाव की ओर संकेत कर सकता है।
- source_word: ፍርሃት ከደነኒ
  choice: भय ने मुझे ढक लिया
  rationale: क्रिया का मूर्त अर्थ ढकना या आच्छादित करना है। यह अनुवाद उस जीवंत शारीरिक बिंब को सुरक्षित रखता है।
- source_word: ወረዓድ አኃዘኒ
  choice: और कंपकंपी ने मुझे जकड़ लिया
  rationale: संज्ञा कांपने को और क्रिया पकड़ लेने को व्यक्त करती है। ‘जकड़ लिया’ अनुभव की शारीरिक तीव्रता बनाए रखता है।
theological_decisions:
- issue: भवन के भीतर अनुपस्थित वस्तु बताने वाले कठिन वाक्यांश का अर्थ
  choice: उसके भीतर जीवन का कोई आनंद न था
  alternative: उसके भीतर कोई जीवित प्राणी न था
  rationale: मूल पाठ संभवतः जीवनदायी सुख, सजीव प्रसन्नता या जीवन की सांत्वना के अभाव को नकारता है, मात्र जैविक जीवन को नहीं। असामान्य अभिव्यक्ति रखने से दर्शन का रहस्य और धर्मवैचारिक तनाव बिना अनावश्यक समाधान के सुरक्षित रहता है।
