base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/001.yaml
  text: This is the book of the words of righteousness and of the reproof of the vigilant ones who are from eternity[c][b][a], just as the Holy and Great One commanded in that vision.
translation:
  language: hi
  text: यह धार्मिकता के वचनों और उन जागते रहने वालों[a] की भर्त्सना की पुस्तक है, जो अनादिकाल से हैं[b], जैसा कि पवित्र और महान ने उस दर्शन में आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पहरेदार’; गीज़ शब्द का शाब्दिक अर्थ ‘जागे हुए’ या ‘सतर्क रहने वाले’ होता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अनादिकाल से’ का अर्थ ‘अत्यंत प्राचीन काल से’ भी हो सकता है; यह आवश्यक नहीं कि यहाँ पूर्ण सनातनता का दावा किया गया हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: መጽሐፈ
  choice: पुस्तक
  rationale: यह संज्ञा लिखित ग्रंथ या दस्तावेज़ को दर्शाती है; शीर्षक-जैसे इस वाक्य में ‘पुस्तक’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ቃለ
  choice: वचनों
  rationale: एकवचन रूप यहाँ सामूहिक अर्थ रख सकता है और पुस्तक की विषय-वस्तु बताता है; ‘वचनों’ से उसका औपचारिक तथा सामूहिक भाव बना रहता है।
- source_word: ጽድቅ
  choice: धार्मिकता
  rationale: यह नैतिक और धर्मवैचारिक अर्थ-भार को सुरक्षित रखता है; इस प्रसंग में केवल न्याय या सदाचार की अपेक्षा अधिक व्यापक है।
- source_word: ዘለፋ
  choice: भर्त्सना
  rationale: शब्द में निंदा, फटकार और दोषारोपण का भाव है; ‘भर्त्सना’ इस अपोकैलिप्टिक प्रस्तावना के औपचारिक स्वर के अनुकूल है।
- source_word: ትጉሃን
  choice: जागते रहनेवाले
  rationale: गीज़ शब्द मूलतः जागे हुए या सतर्क रहनेवालों को दर्शाता है। यह अनुवाद मूल बिंब को पारदर्शी रखता है; पारंपरिक तकनीकी नाम ‘पहरेदार’ पादटिप्पणी में दिया गया है।
- source_word: እለ እምዓለም
  choice: जो अनादिकाल से हैं
  rationale: वाक्यांश का अर्थ अनंतता या अत्यंत प्राचीन काल से उत्पत्ति हो सकता है। ‘अनादिकाल से’ ऊँची शैली और कालगत अस्पष्टता दोनों को काफी हद तक बनाए रखता है।
- source_word: አዘዘ
  choice: आज्ञा दी थी
  rationale: यह अधिकारपूर्ण आदेश को सीधे व्यक्त करता है और भूतकालीन दर्शन के संदर्भ में स्वाभाविक हिन्दी है।
- source_word: ቅዱስ ወዓቢይ
  choice: पवित्र और महान जन
  rationale: दोनों विशेषण संयुक्त ईश्वरीय उपाधि के रूप में प्रयुक्त हैं। ‘जन’ हिन्दी में व्यक्तिवाचक शीर्षक को पूरा करता है, बिना दो अलग सत्ताएँ सुझाए।
- source_word: በይእቲ ራእይ
  choice: उस दर्शन में
  rationale: पूर्वसर्ग स्थानवाचक या करणवाचक हो सकता है। ‘उस दर्शन में’ न्यूनतम व्याख्यात्मक है और प्रकाशन के कथात्मक ढाँचे में स्वाभाविक बैठता है।
- source_word: በከመ
  choice: ठीक वैसे ही जैसे
  rationale: यह ‘जिस प्रकार/जैसे’ का तुलनात्मक भाव व्यक्त करता है और आधुनिक हिन्दी में सहज है।
theological_decisions:
- issue: ትጉሃን की पहचान
  choice: ‘जागते रहनेवाले’ के रूप में अनुवाद किया गया है, जो इस प्रसंग में स्वर्गीय Watchers की ओर संकेत करता है।
  alternative: ‘पहरेदार’ या ‘सतर्क जन’
  rationale: हनोक की पुस्तक के इस भाग में प्रसंग विशिष्ट स्वर्गीय प्राणियों के पक्ष में है। चुना हुआ रूप गीज़ शब्द के जागने-सतर्क रहने के बिंब को बनाए रखता है, जबकि पारंपरिक नाम पादटिप्पणी में सुरक्षित है।
- issue: እለ እምዓለም का कालगत बल
  choice: ‘जो अनादिकाल से हैं’—इसे उन प्राचीन/आदिम स्वर्गीय प्राणियों का वर्णन माना गया है।
  alternative: ‘जो प्राचीन काल से हैं’ या ‘जो सनातन हैं’
  rationale: मूल वाक्यांश दूरस्थ प्राचीनता और पूर्ण अनंतता के बीच कुछ अस्पष्ट है। अनुवाद उनके अस्तित्व के स्वरूप को सिद्धांतगत रूप से अंतिम रूप दिए बिना उस तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, शीर्षक-जैसी शैली रखी गई है। ‘वचन’, ‘धार्मिकता’, ‘भर्त्सना’ और ‘दर्शन’ औपचारिक हैं, पर सामान्य पाठक के लिए बोधगम्य हैं। मुख्य पाठ में मूल की कालगत तथा स्वर्गीय पहचान-संबंधी अस्पष्टता को पादटिप्पणियों सहित सुरक्षित रखा गया है।
