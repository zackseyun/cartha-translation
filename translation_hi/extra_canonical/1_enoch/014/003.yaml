base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/003.yaml
  text: As he created and gave to humankind to understand the word of knowledge[a], so also he created me and gave me reproof for the Watchers[c][b], the sons of heaven.
translation:
  language: hi
  text: जिस प्रकार उसने मनुष्यों को बनाया और उन्हें ज्ञान का वचन समझने की शक्ति दी, उसी प्रकार उसने मुझे भी बनाया और मुझे उन्हें—पहरेदारों, अर्थात् स्वर्ग के पुत्रों को—फटकारने का दायित्व दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीइज़ पाठ के इस भाग की प्रतिलिपि और व्याकरण कठिन हैं। एक संभावित संशोधित पठन का अर्थ है, “मुझे भी बनाया और दिया कि मैं उन्हें फटकारूँ।” दूसरा संभावित अर्थ है, “मुझे पहरेदारों के लिए फटकार दी।”
    reason: textual_variant
lexical_decisions:
- source_word: ቃለ አእምሮ
  choice: ज्ञान का वचन
  rationale: यह पदबंध शाब्दिक रूप से ‘ज्ञान/समझ का वचन’ है। ‘वचन’ को बनाए रखने से गीइज़ की ठोस अभिव्यक्ति सुरक्षित रहती है; ‘समझने की शक्ति’ के साथ पूरा वाक्य आधुनिक हिन्दी में स्वाभाविक बनता है।
- source_word: ሰብእ
  choice: मनुष्यों
  rationale: यहाँ शब्द सामूहिक रूप से मानवजाति के लिए प्रयुक्त है; ‘मनुष्यों’ सहज, समावेशी और वर्तमान हिन्दी में स्पष्ट है।
- source_word: ወለቲኒ / संभावित ወሊተኒ
  choice: मुझे भी
  rationale: उपलब्ध पाठ में रूप कठिन है, पर संशोधित पठन इसे प्रथम पुरुष ‘और मुझे’ समझता है और हनोक की व्यक्तिगत नियुक्ति को व्यक्त करता है। पाठगत अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: እዝልፎሙ
  choice: उन्हें … फटकारने का दायित्व दिया
  rationale: रूप को प्रथम पुरुष क्रियात्मक अर्थ ‘कि मैं उन्हें फटकारूँ’ में समझा गया है। हिन्दी में ‘दायित्व दिया’ सृष्टि और नियुक्ति के प्रसंग को स्वाभाविक ढंग से व्यक्त करता है, जबकि फटकार का नैतिक-न्यायिक भाव बना रहता है।
- source_word: ትጉሃን
  choice: पहरुओं
  rationale: मूल शब्द जागते रहने या सतर्कता से जुड़ा है और 1 हनोक में स्वर्गीय Watchers का तकनीकी संकेत है। ‘पहरूए’ उसका संक्षिप्त, अर्थपूर्ण हिन्दी रूप है।
- source_word: ውሉደ ሰማይ
  choice: स्वर्ग के पुत्रों
  rationale: औपचारिक अनुवाद मूल की पारिवारिक और स्वर्गीय छवि को सुरक्षित रखता है तथा इन्हीं प्राणियों की पहचान स्पष्ट करता है।
theological_decisions:
- issue: ትጉሃን ውሉደ ሰማይ की पहचान
  choice: पहरुओं, अर्थात् स्वर्ग के पुत्रों
  alternative: जागते रहनेवाले स्वर्गीय जन
  rationale: कथा-संदर्भ में ये वही स्वर्गीय प्राणी हैं जिन्हें परंपरागत रूप से Watchers कहा जाता है। मुख्य पाठ तकनीकी पहचान और मूल के वर्णनात्मक अर्थ—दोनों को बनाए रखता है।
- issue: हनोक की प्रथम-पुरुष नियुक्ति
  choice: परमेश्वर ने हनोक को पहरुओं को फटकारने का दायित्व दिया
  alternative: हनोक को पहरुओं के विषय में फटकार दी गई
  rationale: व्याकरण-समीक्षा के अनुसार कठिन रूपों में प्रथम पुरुष कर्म और क्रिया निहित हैं। फिर भी उपलब्ध प्रतिलिपि की कठिनाई के कारण वैकल्पिक संज्ञात्मक समझ को पादटिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल किंतु गरिमापूर्ण रखी गई है। ‘पहरूए’ को तकनीकी नाम के रूप में लिया गया है और साथ ही ‘स्वर्ग के पुत्र’ कहकर उसकी पहचान स्पष्ट की गई है।
