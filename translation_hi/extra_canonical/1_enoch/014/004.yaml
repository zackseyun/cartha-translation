base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/004.yaml
  text: 'I wrote down your petition[a], and in my vision it was shown thus: that your petition will not be granted to you for all the days of eternity, and the sentence against you has been completed[c][b], and it will not be granted to you.'
translation:
  language: hi
  text: मैंने तुम्हारी विनती[a] लिख ली, और मेरे दर्शन में मुझे इस प्रकार दिखाया गया कि तुम्हारी विनती अनन्त काल तक[b] स्वीकार नहीं की जाएगी; तुम्हारे विरुद्ध निर्णय अंतिम हो चुका है[c], और वह भी स्वीकार नहीं की जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विनती’ का अर्थ यहाँ औपचारिक याचना या प्रार्थना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल गीइज़ पद का शाब्दिक अर्थ ‘युग/अनन्तता के समस्त दिनों तक’ है; यह अनन्त अवधि पर बल देने वाला सूत्र है।
    reason: lexical_alternative
  - marker: c
    text: ‘निर्णय’ को ‘न्याय’ या ‘दण्डादेश’ भी अनूदित किया जा सकता है। आशय यह है कि तुम्हारे विरुद्ध न्यायिक निर्णय निश्चित और अंतिम हो चुका है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ስእለትክሙ
  choice: तुम्हारी विनती
  rationale: यह संज्ञा किसी उच्च अधिकारी के सामने की गई प्रार्थना, याचना या अनुरोध को व्यक्त करती है। ‘विनती’ आधुनिक हिन्दी में स्वाभाविक है और पहरेदारों की औपचारिक याचना का भाव बनाए रखती है।
- source_word: ጻሐፍኩ
  choice: मैंने ... लिख ली
  rationale: क्रिया का मूल अर्थ ‘मैंने लिखा’ है। ‘लिख ली’ विनती को अभिलिखित करने की क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: በራእየየ
  choice: मेरे दर्शन में
  rationale: यह प्रकाशनात्मक देखने या दर्शन को सूचित करता है; ‘मेरे दर्शन में’ सर्वनाश-साहित्य की शैली और प्रथम पुरुष संबंध दोनों को सुरक्षित रखता है।
- source_word: ያስተርኢ
  choice: मुझे ... दिखाया गया
  rationale: निष्क्रिय वाक्य-विन्यास प्रकाशन के कर्ता को अनावश्यक रूप से निश्चित किए बिना दर्शाता है कि बात दर्शन में प्रकट की गई।
- source_word: እስመ
  choice: कि
  rationale: यहाँ यह दर्शन में दिखाई गई बात की विषय-वस्तु का परिचय देता है। ‘कि’ हिन्दी में उस संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ኢትከውነክሙ
  choice: तुम्हारे लिए स्वीकार नहीं की जाएगी
  rationale: शाब्दिक अर्थ ‘तुम्हारे लिए नहीं होगी’ के निकट है, पर संदर्भ में कर्ता विनती है। ‘स्वीकार नहीं की जाएगी’ याचना के न्यायिक अस्वीकार को स्पष्ट करता है, बिना ‘सुनी नहीं जाएगी’ जैसी धार्मिक रूढ़ि जोड़े।
- source_word: መዋዕለ ዓለም
  choice: युग के समस्त दिनों तक
  rationale: यह ‘युग/अनन्तता के सभी दिनों’ का जोरदार काल-सूचक सूत्र है। हिन्दी रूप मूल बिंब और अनन्त अवधि की गंभीर लय को बनाए रखता है।
- source_word: ፍጽምት
  choice: पूरा हो चुका है
  rationale: शब्द पूर्णता, अंतिमता या निश्चित हो जाने का भाव रखता है। यह रूप निर्णय की अपरिवर्तनीय अंतिमता को व्यक्त करता है, पर उसे केवल ‘अंत’ नहीं बनाता।
- source_word: ወኵነኔ … ላዕሌክሙ
  choice: तुम्हारे विरुद्ध दण्डादेश
  rationale: प्रमाणित पाठ और समानांतर प्राचीन साक्ष्य न्यायिक निर्णय की ओर संकेत करते हैं। ‘दण्डादेश’ प्रतिकूल और निश्चित न्यायिक निर्णय को संक्षेप में व्यक्त करता है; ‘तुम्हारे विरुद्ध’ ላዕሌክሙ की संदर्भगत शक्ति दर्शाता है।
- source_word: ወኢይከውነ ክሙ
  choice: और वह तुम्हारे लिए स्वीकार नहीं की जाएगी
  rationale: अंतिम उपवाक्य पहले किए गए निषेध को दोहराता है। स्त्रीलिंग ‘वह’ का संकेत ‘विनती’ की ओर है और मूल की पुनरुक्ति सुरक्षित रहती है।
theological_decisions:
- issue: पहरेदारों की विनती के निषेध का स्वरूप
  choice: विनती का न्यायिक और अपरिवर्तनीय अस्वीकार
  alternative: अधिक शाब्दिक ‘विनती तुम्हारे लिए नहीं होगी’ अथवा भक्तिपरक ‘तुम्हारी प्रार्थना नहीं सुनी जाएगी’
  rationale: तात्कालिक संदर्भ पतित पहरेदारों के लिए हनोक की मध्यस्थता और उसके प्रत्युत्तर में घोषित अंतिम न्याय का है। ‘स्वीकार नहीं की जाएगी’ न्यायिक बल रखता है और बाद की पारिभाषिक भाषा आरोपित नहीं करता।
- issue: निर्णय-संबंधी पाठ और ፍጽምት का अर्थ
  choice: तुम्हारे विरुद्ध दण्डादेश पूरा हो चुका है
  alternative: ‘न्याय पूरा हो चुका है’, ‘निर्णय अंतिम हो चुका है’ या अधिक अमूर्त ‘पूर्णता तुम्हारे ऊपर है’
  rationale: दिए गए प्रतिलेख में संभावित OCR-पाठ के स्थान पर प्रमाणित पाठ-साक्ष्य न्याय/दण्डादेश का समर्थन करता है। फिर भी ‘पूरा हो चुका है’ मूल के पूर्णता-वाचक तनाव को बनाए रखता है और यह नहीं बताता कि दण्ड का कार्यान्वयन पहले ही पूर्ण हो गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर दर्शन और न्याय की गंभीर अपोकैलिप्टिक शैली बनाए रखी गई है। ‘विनती’, ‘दर्शन’ और ‘दण्डादेश’ औपचारिक हैं, फिर भी सामान्य पाठक के लिए बोधगम्य हैं। मूल की पुनरुक्ति और निर्णय की पूर्णता से जुड़ा धार्मिक तनाव जानबूझकर सुरक्षित रखा गया है।
