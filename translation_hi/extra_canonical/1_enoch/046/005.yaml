base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/005.yaml
  text: And he will cast down the kings from their thrones and from their kingdoms[a], because they do not exalt him, and do not praise him[c][b], and do not acknowledge from where the kingdom was given to them.
translation:
  language: hi
  text: और वह राजाओं को उनके सिंहासनों और उनके राज्यों से नीचे गिरा देगा, क्योंकि वे उसे महिमान्वित नहीं करते, उसकी स्तुति नहीं करते, और यह स्वीकार नहीं करते कि उन्हें राजसत्ता कहाँ से दी गई थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “कहाँ से” का अनुवाद “किससे” भी हो सकता है। मूल वाक्यांश सत्ता के स्रोत को सामान्य रूप से या किसी व्यक्तिगत दाता के रूप में इंगित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ይገፈትኦሙ
  choice: नीचे गिरा देगा
  rationale: यह क्रिया बलपूर्वक पदच्युत करने या गिराने का भाव रखती है। ‘नीचे गिरा देगा’ न्याय-दृश्य और राजकीय बिंब दोनों को बनाए रखता है।
- source_word: ነገሥት
  choice: राजाओं
  rationale: मूल शब्द का सामान्य और विशिष्ट अर्थ ‘राजा’ है; सिंहासनों और राज्यों के संदर्भ में इसे व्यापक ‘शासक’ नहीं किया गया।
- source_word: መናብርቲሆሙ
  choice: उनके सिंहासनों
  rationale: राजकीय न्याय के प्रसंग में ‘सिंहासन’ सत्ता के आसन और उसके प्रतीकात्मक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: መንገሥቲሆሙ
  choice: उनके राज्यों
  rationale: बहुवचन संबंधवाचक रूप के लिए ‘उनके राज्यों’ निकट और स्वाभाविक अनुवाद है; इसमें उनके शासन-क्षेत्र का भाव बना रहता है।
- source_word: ኢያሌዕልዎ
  choice: वे उसे ऊँचा नहीं करते
  rationale: क्रिया में ऊँचा उठाने या महिमामंडित करने का प्रबल भाव है। ‘ऊँचा नहीं करते’ इसे सामान्य ‘आदर नहीं करते’ की अपेक्षा अधिक निकटता से रखता है।
- source_word: ኢይሴብሕዎ
  choice: उसकी स्तुति नहीं करते
  rationale: यह प्रशंसा या महिमा करने का भाव व्यक्त करता है; धार्मिक संदर्भ में ‘स्तुति’ स्पष्ट, प्रतिष्ठित और प्रचलित हिन्दी है।
- source_word: ኢይገንዩ
  choice: स्वीकार नहीं करते
  rationale: प्रसंग में राजाओं द्वारा अपनी सत्ता के स्रोत को मानने या स्वीकार करने से इनकार अभिप्रेत है। ‘स्वीकार’ संज्ञान और अधीनतापूर्ण मान्यता दोनों की गुंजाइश रखता है, बिना ‘नम्रतापूर्वक’ जैसा अतिरिक्त क्रियाविशेषण जोड़े।
- source_word: እምአይቴ
  choice: कहाँ से
  rationale: यह स्रोत के विषय में पूछने वाला निकट अर्थ है। संदर्भ में व्यक्तिगत दाता की संभावना होने के कारण ‘किससे’ भी संभव है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ተውህበት ሎሙ መንግሥት
  choice: उन्हें राजसत्ता ... दी गई थी
  rationale: कर्मवाच्य रचना को बनाए रखा गया है। यहाँ एक भू-प्रदेश मात्र की अपेक्षा राजा होने का अधिकार अभिप्रेत हो सकता है, इसलिए ‘राजसत्ता’ चुना गया।
theological_decisions:
- issue: ‘उसे’ का संदर्भ और राजसत्ता का स्रोत
  choice: मूल की तरह केवल ‘उसे’ रखा गया और किसी दैवी उपाधि को स्पष्ट रूप से नहीं जोड़ा गया।
  alternative: इसे परमप्रधान/प्रभु या निकट प्रसंग के अनुसार चुने हुए जन का स्पष्ट संदर्भ मानना।
  rationale: पद राजसत्ता के दाता की ओर संकेत करता है, पर सर्वनाम के संदर्भ को इसी पद में नाम से निश्चित नहीं करता। अनुवाद इस धर्मवैचारिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली। समानांतर नकारात्मक क्रियाओं को स्वाभाविक हिन्दी क्रम में रखा गया है। ‘राजसत्ता’ अंतिम एकवचन መንግሥት के अधिकार/राजत्व वाले अर्थ को व्यक्त करती है, जबकि पहले आया बहुवचन रूप ‘राज्यों’ के रूप में रखा गया है।
