base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/003.yaml
  text: And he answered me and said to me[a], “This is the Son of Man, to whom righteousness belongs, and righteousness dwells with him; and he will reveal all the treasuries of what is hidden, because the Lord of Spirits has chosen him[c][b], and his lot has prevailed before the Lord of Spirits forever in uprightness.”
translation:
  language: hi
  text: उसने मुझे उत्तर दिया और मुझसे कहा, “यह मनुष्य-पुत्र है, जिसके पास धार्मिकता है और जिसके साथ धार्मिकता वास करती है। वह छिपी हुई वस्तुओं के सभी भंडारों को प्रकट करेगा[a], क्योंकि आत्माओं के प्रभु ने उसे चुन लिया है; और उसका भाग आत्माओं के प्रभु के सामने सदा के लिए धार्मिकता में प्रबल हुआ है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “छिपी हुई वस्तुओं के सभी कोषागारों को।” यहाँ केवल अमूर्त “रहस्यों” की नहीं, बल्कि छिपी वास्तविकताओं के संचित भंडारों की छवि है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम खंड का गीइज़ पाठ कठिन है। “उसका भाग प्रबल हुआ है” का अर्थ “उसका हिस्सा विजयी हुआ है” भी हो सकता है; कम संभावना से यह उसके साथ जुड़े लोगों के भाग की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ወልደ ሰብእ
  choice: मनुष्य-पुत्र
  rationale: यह गीइज़ का स्थापित पद है। दर्शन के इस प्रसंग में यह पहचाने जा रहे विशिष्ट पात्र की उपाधि के समान प्रयुक्त है; इसलिए हिन्दी में प्रचलित और स्वाभाविक ‘मनुष्य-पुत्र’ रखा गया है।
- source_word: ዘሎቱ ኮነ ጽድቅ
  choice: जिसका धार्मिकता पर अधिकार है
  rationale: रचना स्वामित्व अथवा विशिष्ट संबंध व्यक्त करती है। ‘अधिकार है’ इस संबंध को स्वाभाविक हिन्दी में रखता है, बिना इसे केवल ‘धर्मी’ विशेषण में समेटे।
- source_word: ወጽድቅ ምስሌሁ ኃደረ
  choice: जिसके साथ धार्मिकता वास करती है
  rationale: क्रिया निवास करने या बने रहने का भाव देती है। ‘वास करती है’ धार्मिकता के व्यक्तिरूप और काव्यात्मक चित्र को सुरक्षित रखता है।
- source_word: መዛግብተ ዘኅቡእ
  choice: छिपी हुई वस्तुओं के सब भंडार
  rationale: መዛግብት भंडार अथवा कोषागार को सूचित करता है। ‘भंडार’ उस चित्र को बनाए रखता है जिसमें छिपी वास्तविकताएँ मानो स्वर्गीय संचय में रखी हों।
- source_word: ይከሥት
  choice: प्रकट करेगा
  rationale: यह छिपी वस्तुओं को उजागर करने की भावी भूमिका व्यक्त करता है; ‘प्रकट करेगा’ स्पष्ट और प्रसंगानुकूल है।
- source_word: እግዚአ መንፈሳት
  choice: आत्माओं के प्रभु
  rationale: यह 1 हनोक में बार-बार आने वाली विशिष्ट ईश्वरीय उपाधि है। हिन्दी में ‘आत्माओं के प्रभु’ उसके घटकों और पुस्तक की विशिष्ट शब्दावली दोनों को सुरक्षित रखता है।
- source_word: ኀረዮ ኃርየ
  choice: उसे चुन लिया है
  rationale: सजातीय पुनरुक्ति चुनाव की क्रिया पर बल देती है। हिन्दी में उसे कृत्रिम रूप से दुहराने के बजाय ‘चुन लिया है’ से पूर्ण और बलयुक्त चयन व्यक्त किया गया है।
- source_word: ዘክፍሉ ሞአ
  choice: उसका भाग ... प्रबल हुआ है
  rationale: कठिन पाठ में आवंटित भाग या हिस्से के विजयी अथवा प्रभावी होने का भाव है। ‘भाग’ प्राचीन बँटवारे की छवि रखता है और ‘प्रबल हुआ है’ क्रिया का गतिशील अर्थ देता है।
- source_word: በርቱዕ ለዓለም
  choice: सदा के लिए खराई में
  rationale: अंतिम पद कठिन है। ‘खराई’ नैतिक सीधेपन का भाव देता है और इसी वाक्य में ‘धार्मिकता’ की अनावश्यक तीसरी पुनरावृत्ति से बचता है; ‘सदा के लिए’ कालगत अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: ወልደ ሰብእ को उपाधि माना जाए या सामान्य मानव-वर्णन
  choice: उपाधिसदृश ‘मनुष्य-पुत्र’
  alternative: ‘मनुष्य का पुत्र’ या ‘वह मनुष्य’
  rationale: दर्शन में एक विशिष्ट पात्र की पहचान और भूमिका बताई जा रही है। फिर भी अनुवाद में बाद की धर्मवैज्ञानिक धारणाएँ जोड़ने के बजाय स्थानीय पाठ तक सीमित रहा गया है।
- issue: मनुष्य-पुत्र के संबंध में धार्मिकता की पुनरुक्ति
  choice: स्वामित्व और साथ वास करने—दोनों कथन रखे गए
  alternative: दोनों को मिलाकर केवल ‘धर्मी जन’ कहना
  rationale: मूल पाठ जानबूझकर धार्मिकता के साथ इस पात्र के संबंध को दो रूपों में प्रबल करता है; संक्षेप करने से यह बल और काव्यात्मक तनाव मिट जाता।
- issue: अंतिम खंड में उसके भाग का अर्थ
  choice: ‘उसका भाग ... प्रबल हुआ है’
  alternative: ‘उसका भाग सुरक्षित है’ अथवा ‘उससे संबंधित लोगों का भाग प्रबल हुआ है’
  rationale: गीइज़ पाठ कठिन है और बाहरी पाठ-साक्ष्य सीमित है। मुख्य अनुवाद संभावित व्याकरण के निकट है, जबकि अनिश्चितता को पादटिप्पणी में स्पष्ट किया गया है।
- issue: ወዘክፍሉ में संबंधवाचक ዘ का हिन्दी रूप
  choice: 'स्वाभाविक हिन्दी में नया समन्वित खंड: ‘और उसका भाग...’'
  alternative: ‘और जिसका भाग...’ के रूप में संबंधवाचक शृंखला बनाए रखना
  rationale: स्रोत की संबंधवाचक शृंखला को पहचाना गया है, पर ‘क्योंकि ... ने उसे चुन लिया है, और जिसका भाग’ आधुनिक हिन्दी में व्याकरणतः असहज और संदिग्ध होगा। स्वतंत्र समन्वित खंड वही आशय स्पष्ट रूप से देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘धार्मिकता’, ‘वास’, ‘आत्माओं के प्रभु’ और ‘मनुष्य-पुत्र’ जैसे पद अपोकैलिप्टिक तथा धार्मिक स्वर बनाए रखते हैं। स्रोत की पुनरुक्ति और कठिन अंतिम वाक्य को अत्यधिक सरल बनाकर उसका धर्मवैज्ञानिक तनाव नहीं मिटाया गया।
