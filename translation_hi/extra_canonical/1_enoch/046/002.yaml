  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण वर्णनात्मक रूप अपनाया गया है। ‘चल रहा था/दिखा रहा था’ से दर्शन की जारी क्रिया और ‘चलता है’ से मूल में गति-सूचक क्रिया की पुनरावृत्ति बनी रहती है। पारम्परिक धर्मवैज्ञानिक पदावली से अनावश्यक सामंजस्य नहीं किया गया।
