base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/002.yaml
  text: And I asked one of the angels who was going with me[a], and who was showing me all the hidden things, concerning that Son of Man—who he was, and from where he came[c][b], and why he was going with the Head of Days.
translation:
  language: hi
  text: और मैंने स्वर्गदूतों में से एक से, जो मेरे साथ चल रहा था और मुझे सारी छिपी हुई बातें[a] दिखा रहा था, उस मनुष्य-पुत्र[b] के विषय में पूछा—वह कौन है, कहाँ से है, और वह दिनों के प्रधान[c] के साथ क्यों चल रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सारे रहस्य।’ यहाँ प्रयुक्त गीइज़ शब्द उन छिपी हुई बातों को सूचित करता है जो दर्शन में प्रकट की जाती हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘मनुष्य का पुत्र।’ यहाँ यह एक विशिष्ट दर्शनीय व्यक्ति के पदनाम के समान प्रयुक्त हुआ है।
    reason: literary_designation
  - marker: c
    text: ‘दिनों का प्रधान’ गीइज़ पद का सीधा अनुवाद है। दानिय्येल से प्रभावित पारम्परिक अनुवाद में इसके स्थान पर ‘अति प्राचीन’ जैसा पद मिल सकता है।
    reason: cross_reference
lexical_decisions:
- source_word: ተስእልክዎ
  choice: मैंने ... से पूछा
  rationale: क्रिया सीधे प्रश्न करने या पूछने को व्यक्त करती है; यह आधुनिक हिन्दी में स्वाभाविक और स्रोत के अनुरूप है।
- source_word: ፩እመላእክት
  choice: उन स्वर्गदूतों में से एक
  rationale: यह अंश-वाचक पदबंध है—स्वर्गदूतों के समूह में से एक। स्रोत में ‘पवित्र’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: ዘየሐውር ምስሌየ
  choice: जो मेरे साथ चल रहा था
  rationale: चलने की जारी क्रिया और दर्शी के साथ उस स्वर्गदूत की संगति दोनों सुरक्षित रहती हैं।
- source_word: ኵሎ ኅቡኣተ
  choice: सारी छिपी हुई बातें
  rationale: यह दर्शन में प्रकट की जा रही गुप्त या छिपी स्वर्गीय वास्तविकताओं को सहज हिन्दी में व्यक्त करता है; ‘सारे रहस्य’ भी सम्भव है।
- source_word: ዘያርእየኒ
  choice: मुझे ... दिखा रहा था
  rationale: क्रिया का दृश्य और प्रकटकारी भाव बना रहता है तथा दर्शन के प्रसंग में यह स्वाभाविक है।
- source_word: ወልደ ሰብእ
  choice: मनुष्य-पुत्र
  rationale: संयुक्त रूप इस विशिष्ट दर्शनीय व्यक्ति के पदनाम-सदृश प्रयोग को दिखाता है, फिर भी बाद की धर्मवैज्ञानिक पहचान को पाठ पर आरोपित नहीं करता।
- source_word: እምአይቴ ይከውን
  choice: कहाँ से है
  rationale: पदबंध उस व्यक्ति के मूल या उद्गम के बारे में पूछता है। हिन्दी का वर्तमानकालीन रूप स्रोत की अस्तित्ववाचक अस्पष्टता को ‘आया’ कहकर अनावश्यक रूप से घटना में नहीं बदलता।
- source_word: ርእሰ መዋዕል
  choice: दिनों का प्रधान
  rationale: यह इथियोपिक पद के ‘दिनों’ और ‘प्रधान/सिर’ दोनों घटकों को प्रत्यक्ष रूप से रखता है और दानिय्येल के पारम्परिक पदनाम से मौन सामंजस्य नहीं करता।
- source_word: ምስለ ... የሐውር
  choice: के साथ ... चलता है
  rationale: दोहराई गई गति-सूचक क्रिया को बनाए रखकर मनुष्य-पुत्र और दिनों के प्रधान की संगति की प्रभावशाली छवि सुरक्षित रखी गई है।
theological_decisions:
- issue: ወልደ ሰብእ को पदनाम मानें या सामान्य मानवीय अभिव्यक्ति
  choice: ‘उस मनुष्य-पुत्र’ के रूप में विशिष्ट दर्शनीय व्यक्ति
  alternative: ‘उस मनुष्य के पुत्र’ या ‘उस मानव’
  rationale: संकेतवाचक शब्द और प्रसंग एक पहले से पहचाने जा रहे विशिष्ट व्यक्ति की ओर संकेत करते हैं। संयुक्त हिन्दी रूप उसकी साहित्यिक विशिष्टता दर्शाता है, पर बाद की मसीही पहचान को स्पष्ट रूप से नहीं जोड़ता।
- issue: ርእሰ መዋዕል का दानिय्येल के पारम्परिक पदनाम से सामंजस्य
  choice: दिनों का प्रधान
  alternative: अति प्राचीन / दिनों का प्राचीन
  rationale: मूल गीइज़ पद शाब्दिक रूप से ‘दिनों का प्रधान/सिर’ है। मुख्य पाठ उसी को सुरक्षित रखता है और अधिक परिचित दानिय्येली अभिव्यक्ति को पादटिप्पणी में बताता है।
- issue: እምአይቴ ይከውን को आगमन या उद्गम के रूप में व्यक्त करना
  choice: कहाँ से है
  alternative: कहाँ से आया है
  rationale: ‘कहाँ से है’ उद्गम पूछता है, लेकिन स्रोत से अधिक स्पष्ट आगमन की घटना नहीं बनाता; इस प्रकार वास्तविक अस्पष्टता बनी रहती है।
