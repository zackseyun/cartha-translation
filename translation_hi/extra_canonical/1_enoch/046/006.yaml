base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/006.yaml
  text: And he will cast down the face of the strong ones[a], and he will fill them with shame; and darkness shall become their dwelling, and worms their bed. And they shall have no hope of rising from their beds[c][b], because they do not exalt the name of the Lord of Spirits.
translation:
  language: hi
  text: और वह बलवानों का मुख नीचा कर देगा और उन्हें लज्जा से भर देगा। अन्धकार उनका निवास होगा और कीड़े[a] उनका बिछौना होंगे। उन्हें अपने बिछौनों से उठने की कोई आशा न होगी[b], क्योंकि वे आत्माओं के प्रभु के नाम को ऊँचा नहीं करते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘कीड़े’ के लिए पाया गया गीज़ पाठ-रूप कुछ अनिश्चित है; फिर भी इस प्रसंग में यह अर्थ कब्र-सदृश क्षय और न्याय के बिम्ब के अनुकूल है।
    reason: textual_variant
  - marker: b
    text: ‘बिछौनों से उठने’ का अर्थ सामान्य रूप से उठना हो सकता है; इस प्रसंग में यह न्याय के बाद फिर उठने या पुनर्स्थापित होने से वंचित रहने का संकेत भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ገጸ፡ ጽኑዓን፡ ይገፈትእ
  choice: वह बलवानों का मुख नीचा कर देगा
  rationale: क्रिया तृतीय पुरुष पुल्लिंग एकवचन सक्रिय है; इसलिए कर्ता ‘वह’ बनाए रखा गया है। ‘मुख नीचा करना’ मूल के ठोस ‘मुख’ और न्याय में अपमान/पतन—दोनों भावों को स्वाभाविक हिन्दी में रखता है।
- source_word: ይመልኦሙ፡ ኃፍረተ
  choice: उन्हें लज्जा से भर देगा
  rationale: ‘लज्जा’ क्रिया का दूसरा कर्म है; सक्रिय कर्ता ‘वह’ पिछले खण्ड से जारी रहता है।
- source_word: ጽልመት፡ ይከውኖሙ፡ መንደሪሆሙ
  choice: अन्धकार उनका निवास होगा
  rationale: न्याय के प्रलयदर्शी बिम्ब को सीधे और गरिमापूर्ण ढंग से सुरक्षित रखा गया है।
- source_word: ዕፀያት፡ ይከውኖሙ፡ ምስካቦሙ
  choice: कीड़े उनका बिछौना होंगे
  rationale: ‘कीड़े’ कब्र-सदृश क्षय के बिम्ब के अनुकूल है, जबकि ‘बिछौना’ मूल के bed/couch अर्थ को किसी स्पष्ट व्याख्या में बदले बिना रखता है। पाठ-रूप की अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: ወኢይሴፈዉ፡ ከመ፡ ይትነሥኡ፡ እምስካቦቲሆሙ
  choice: उन्हें अपने बिछौनों से उठने की कोई आशा न होगी
  rationale: यह स्वाभाविक हिन्दी है और ‘उठने’ में सामान्यतः उठ खड़े होने तथा न्याय के बाद फिर उठने—दोनों सम्भावनाएँ खुली रहती हैं।
- source_word: ኢያሌዕሉ፡ ስሞ
  choice: नाम को ऊँचा नहीं करते
  rationale: मूल क्रिया के ‘ऊँचा करना/महान ठहराना’ भाव को सुरक्षित रखा गया है; इसे केवल सामान्य सम्मान या स्तुति तक सीमित नहीं किया गया।
- source_word: እግዚአ፡ መናፍስት
  choice: आत्माओं के प्रभु
  rationale: 1 हनोक में बार-बार आने वाली विशिष्ट ईश्वरीय उपाधि का सीधा और संगत अनुवाद है।
theological_decisions:
- issue: क्या ይትነሥኡ पुनरुत्थान को स्पष्ट रूप से सूचित करता है या केवल बिछौने से उठने को
  choice: ‘अपने बिछौनों से उठने’ रखा गया है
  alternative: ‘पुनर्जीवित किए जाने’ अथवा केवल ‘उठ खड़े होने’ का स्पष्ट अर्थ
  rationale: मृत्यु, अन्धकार और कीड़ों का प्रसंग पुनरुत्थान या पुनर्स्थापना की ओर संकेत कर सकता है, पर क्रिया अपने आप में केवल ‘उठना’ भी कह सकती है; इसलिए तनाव को अनिर्णीत रखा गया है।
- issue: ጽኑዓን की पहचान
  choice: ‘बलवानों’
  alternative: ‘शक्तिशाली शासकों’ या ‘पराक्रमियों’
  rationale: मूल शब्द शक्ति रखने वालों को बताता है, पर इस पंक्ति में उन्हें विशेष रूप से राजा या शासक नहीं कहता। व्यापक पद पहचान को अनावश्यक रूप से संकीर्ण नहीं करता।
- issue: आरम्भिक क्रियाओं का कर्ता और वाच्य
  choice: दोनों को सक्रिय रूप में ‘वह ... कर देगा’ अनूदित किया गया है
  alternative: ‘बलवानों का मुख गिरा दिया जाएगा और लज्जा उन्हें भर देगी’
  rationale: गीज़ क्रियाएँ तृतीय पुरुष पुल्लिंग एकवचन सक्रिय हैं और पिछले प्रसंग के कर्ता को जारी रखती हैं; ኃፍረተ ‘लज्जा’ कर्म है, कर्ता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध और प्रलयदर्शी शैली रखी गई है। ‘मुख नीचा कर देगा’ शाब्दिक मुख-बिम्ब और सार्वजनिक अपमान दोनों को स्वाभाविक हिन्दी में व्यक्त करता है। ‘अन्धकार’, ‘निवास’, ‘बिछौना’ और ‘आत्माओं के प्रभु’ जैसे पद मूल की ऊँची शैली बनाए रखते हैं, पर अनावश्यक पुरातनता से बचते हैं।
