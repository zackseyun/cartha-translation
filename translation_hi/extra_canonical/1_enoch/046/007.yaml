- source_word: ከዋክብተ ሰማይ
  choice: आकाश के तारों
  rationale: मूल संबंधसूचक पदबंध को स्पष्ट, गरिमापूर्ण और आधुनिक हिन्दी में व्यक्त करता है तथा ब्रह्मांडीय बिंब को बनाए रखता है।
theological_decisions:
- issue: क्या क्रिया को न्याय के बजाय ब्रह्मांडीय शासन के अर्थ में नरम किया जाए
  choice: आकाश के तारों का न्याय करते हैं
  alternative: आकाश के तारों पर शासन करते हैं
  rationale: गीज़ क्रिया का केंद्रीय अर्थ ‘न्याय करना’ है। प्रकाशनात्मक साहित्य में तारे खगोलीय पिंड अथवा स्वर्गीय प्राणियों के प्रतीक हो सकते हैं; इसलिए न्यायिक भाषा पाठ के तनाव और अस्पष्टता को सुरक्षित रखती है।
- issue: ‘तारों’ की पहचान
  choice: मुख्य पाठ में केवल ‘तारों’ को रखा गया
  alternative: ‘स्वर्गीय प्राणियों’ के रूप में स्पष्ट करना
  rationale: पाठ स्वयं यह निश्चित नहीं करता कि तारे वास्तविक खगोलीय पिंड हैं या स्वर्गीय प्राणियों के प्रतीक; अतः किसी एक अर्थ को मुख्य पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण प्रकाशनात्मक शैली। ‘आकाश’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘तारों का न्याय’ मूल की असामान्य और अर्थपूर्ण ब्रह्मांडीय-न्यायिक छवि को जानबूझकर बनाए रखता है।
