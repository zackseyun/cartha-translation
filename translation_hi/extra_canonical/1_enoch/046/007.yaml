- source_word: ኮኑ
  choice: हैं
  rationale: यहाँ क्रिया पहचान बताने वाले वाक्य में है; वर्तमानकालीन ‘हैं’ दर्शन के वर्णन में स्वाभाविक है।
- source_word: እለ
  choice: वे ... जो
