base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/001.yaml
  text: And there I saw one who had a head of days[a], and his head was like white wool; and with him was another, whose face was like the appearance of a man, and his face was full of grace[c][b], like one of the holy angels.
translation:
  language: hi
  text: और वहाँ मैंने एक को देखा, जिसके पास दिनों का सिर था[a], और उसका सिर सफेद ऊन के समान था। उसके साथ एक और था, जिसका चेहरा मनुष्य के रूप जैसा था[c], और उसका चेहरा अनुग्रह से भरा था[b], पवित्र स्वर्गदूतों में से एक के समान।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अति प्राचीन।” गीज़ में अधिक शाब्दिक अभिव्यक्ति “दिनों का सिर” है, जिसे मुख्य पाठ में सुरक्षित रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: “अनुग्रह से भरा” गीज़ का सीधा अनुवाद है; इसे बाद के नए नियम की शब्दावली से लिया हुआ न समझा जाए।
    reason: cross_reference
  - marker: c
    text: अधिक सहज रूप में, “जिसका चेहरा मनुष्य जैसा दिखाई देता था।” मूल में तुलना के लिए स्पष्टतः “समान” प्रयुक्त है।
    reason: previous_rendering
lexical_decisions:
- source_word: በህየ፡ ርኢኩ
  choice: वहाँ मैंने ... देखा
  rationale: दर्शन-वृत्तांत की सीधी स्थानसूचक और दृष्टिसूचक अभिव्यक्ति को सहज आधुनिक हिन्दी में रखा गया है।
- source_word: ዘሎቱ፡ ርእሰ፡ መዋዕል
  choice: एक ऐसे व्यक्ति ... जिसका सिर दिनों का सिर था
  rationale: गीज़ की असामान्य और संभवतः उपाधिसूचक अभिव्यक्ति ‘दिनों का सिर’ को दानिय्येल की पारंपरिक उपाधि से चुपचाप बदलने के बजाय मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: ወርእሱ፡ ከመ፡ ፀምር፡ ጻዕዳ
  choice: उसका सिर सफेद ऊन के समान था
  rationale: मूल में स्पष्टतः ‘सिर’ है, ‘बाल’ नहीं; ከመ के तुलनात्मक अर्थ को ‘के समान’ से व्यक्त किया गया है।
- source_word: ወምስሌሁ፡ ካልእ
  choice: उसके साथ एक और था
  rationale: दूसरी आकृति को बिना समयपूर्व पहचान या उपाधि दिए सरलता से प्रस्तुत करता है।
- source_word: ዘገጹ፡ ከመ፡ ርእየተ፡ ሰብእ
  choice: जिसका चेहरा मनुष्य के रूप के समान था
  rationale: ከመ की स्पष्ट तुलना को बनाए रखा गया है और ‘मनुष्य’ को किसी बाद की धर्मवैज्ञानिक उपाधि में नहीं बदला गया।
- source_word: ወምሉእ፡ ጸጋ፡ ገጹ
  choice: उसका चेहरा अनुग्रह से भरा था
  rationale: ጸጋ के ‘अनुग्रह/कृपा’ अर्थ को सीधे व्यक्त करता है; ‘अनुग्रह’ गरिमामय और स्रोत-संगत है।
- source_word: ከመ፡ ፩እመላእክት፡ ቅዱሳን
  choice: पवित्र स्वर्गदूतों में से एक के समान
  rationale: संख्या और अंशवाची संरचना दोनों सुरक्षित हैं; तुलना उस आकृति की पवित्र स्वर्गदूतों में से एक से है।
theological_decisions:
- issue: ርእሰ መዋዕል को पारंपरिक ‘अति प्राचीन’ उपाधि के रूप में अनूदित करना या गीज़ मुहावरे को बनाए रखना
  choice: दिनों का सिर
  alternative: अति प्राचीन / दिनों का प्रधान
  rationale: यहाँ उपलब्ध मूल साक्ष्य गीज़ का है और उसकी विशिष्ट शब्दावली को बनाए रखना पारंपरिक दानिय्येली सामंजस्य थोपने से अधिक पारदर्शी है; विकल्प पादटिप्पणी में दिया गया है।
- issue: दूसरी आकृति को इसी पद में ‘मनुष्य का पुत्र’ कहना या वर्णनात्मक रूप बनाए रखना
  choice: एक और, जिसका चेहरा मनुष्य के रूप के समान था
  alternative: मनुष्य का पुत्र / मनुष्य-जैसी आकृति
  rationale: यह पद आकृति का वर्णन करता है, उसे वह उपाधि नहीं देता; इसलिए पहचान संबंधी धर्मवैज्ञानिक तनाव को अनसुलझा रखा गया है।
- issue: ጸጋ को बाद के नए नियम की विशिष्ट शब्दावली समझना
  choice: अनुग्रह
  alternative: कृपा / मनोहरता
  rationale: यह चयन स्वयं गीज़ शब्द के अर्थ से आता है; बाद के ग्रंथों से शब्दावली उधार मानना आवश्यक नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमामय किंतु सामान्य पाठक के लिए बोधगम्य रूप अपनाया गया है। ‘दिनों का सिर’ जानबूझकर असामान्य रखा गया है क्योंकि मूल की विशिष्ट और धर्मवैज्ञानिक रूप से महत्त्वपूर्ण अभिव्यक्ति को सहज बनाने से उसका संकेत खो सकता था। सभी तीन तुलनात्मक ከመ-वाक्यांशों को ‘के समान’ से समानांतर रूप में प्रस्तुत किया गया है।
