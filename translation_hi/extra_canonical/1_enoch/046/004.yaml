base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/004.yaml
  text: And this Son of Man whom you have seen will raise up kings and the mighty from their couches, and the strong from their thrones; and he will loosen the loins of the strong, and crush the teeth of sinners.
translation:
  language: hi
  text: और यह मनुष्य-पुत्र, जिसे तुमने देखा है, राजाओं और शक्तिशालियों को उनकी शय्याओं[a] से, और बलवानों को उनके सिंहासनों से उठा देगा; वह बलवानों की कमर के बंधन ढीले कर देगा[b] और पापियों के दाँत चूर कर देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनके पलंगों’। यहाँ शासकों को आराम या सुरक्षा के स्थानों से उठाए जाने का चित्र है।
    reason: lexical_alternative
  - marker: b
    text: इस स्थान का गीइज़ पाठ अनिश्चित और सम्भवतः विकृत है। सम्भावित पाठ-सुधार ‘कमर’ की ओर संकेत करता है और कमर का बंधन ढीला करना शक्ति तथा प्रतिरोध छीन लेने का बिंब है; अन्य व्याख्याओं में ‘लगाम’ या ‘पट्टे’ जैसे अर्थ प्रस्तावित किए गए हैं।
    reason: textual_and_lexical_uncertainty
lexical_decisions:
- source_word: ወልደ ሰብእ
  choice: मनुष्य-पुत्र
  rationale: यह शाब्दिक सामी रूप को बनाए रखता है और इस दर्शन में पहले से पहचाने गए विशिष्ट व्यक्ति की ओर संकेत करता है; इसे अधिक व्याख्यात्मक मसीही पदवी में नहीं बदला गया।
- source_word: ዘርኢከ
  choice: जिसे तुमने देखा है
  rationale: सम्बन्धवाचक रूप इस व्यक्ति को हनोक के पहले दर्शन से जोड़ता है; हिन्दी में पूर्ण क्रिया वर्तमान सन्दर्भ से उसका सम्बन्ध स्वाभाविक रूप से व्यक्त करती है।
- source_word: ያነሥኦሙ
  choice: उठा देगा
  rationale: मूल क्रिया किसी को उठाने या उठ खड़ा करने का बिंब देती है। ‘पलंगों से’ और ‘सिंहासनों से’ के साथ यह न्याय के प्रसंग में उन्हें उनके स्थानों से हटाए जाने का भाव देता है, पर क्रिया को सीधे ‘पदच्युत करेगा’ कहकर अमूर्त नहीं बनाता।
- source_word: እምስካበቲሆሙ
  choice: उनके विश्राम-पलंगों से
  rationale: संज्ञा पलंग, शय्या या आराम की चौकी को सूचित करती है। ‘विश्राम-पलंग’ शासकों की सुविधा और सुरक्षा का दृश्य स्पष्ट करता है, जबकि ‘पलंग’ का ठोस बिंब बनाए रखता है।
- source_word: ጽኑዓን
  choice: बलवानों
  rationale: यह जमे हुए सामर्थ्यवान लोगों को दर्शाता है। ‘बलवान’ ठोस बल का भाव रखता है और पद के भीतर इसकी पुनरावृत्ति सम्भव बनाता है।
- source_word: መናብርቲሆሙ
  choice: उनके सिंहासनों से
  rationale: राजकीय और न्यायिक प्रसंग में ‘सिंहासन’ सामान्य ‘आसन’ से अधिक उपयुक्त है और राजनीतिक अधिकार का बिंब सुरक्षित रखता है।
- source_word: ይፈትሕ
  choice: बंधनों को ढीला कर देगा
  rationale: क्रिया का मूल अर्थ खोलना, ढीला करना या मुक्त करना है। यहाँ इसे कमर के बंधन के साथ जोड़कर मूल की सजीव न्याय-छवि रखी गई है।
- source_word: ኃማተ
  choice: कमर के बंधन
  rationale: इस स्थान का गीइज़ पाठ कठिन है। सम्भावित पाठ-सुधार और यशायाह 45:1 से मिलते-जुलते मुहावरे के आधार पर ‘कमर’ उपयुक्त है; ‘बंधन’ जोड़ने से ‘ढीला करना’ हिन्दी में स्पष्ट रहता है, जबकि अनिश्चितता पाद-टिप्पणी में बताई गई है।
- source_word: ይደቅቅ
  choice: चूर कर देगा
  rationale: यह प्रबल विनाशकारी क्रिया है। ‘चूर करना’ सर्वनाशकारी न्याय की तीव्रता और दाँतों के ठोस बिंब दोनों को बनाए रखता है।
- source_word: አስናነ ኃጥኣን
  choice: पापियों के दाँत
  rationale: ठोस चित्र को बिना आध्यात्मिक या रूपकात्मक व्याख्या जोड़े ज्यों का त्यों रखा गया है।
theological_decisions:
- issue: ወልደ ሰብእ को पदवी मानना या सामान्य मनुष्य-सूचक वाक्यांश
  choice: विशिष्ट दर्शनीय व्यक्ति के लिए पदवी-सदृश ‘मनुष्य-पुत्र’
  alternative: ‘मनुष्य का एक पुत्र’ अथवा व्याख्यात्मक ‘मानव-स्वरूप व्यक्ति’
  rationale: दृष्टान्तों के स्थानीय प्रसंग में यह व्यक्ति पहले से विशिष्ट किया गया है और न्याय से जुड़ा है। अनुवाद मूल रूप रखता है, पर बाद की धर्मवैज्ञानिक धारणाएँ इसमें स्पष्ट रूप से नहीं जोड़ता।
- issue: राजाओं और बलवानों पर न्याय की क्रिया को कितना स्पष्ट करना
  choice: ‘पलंगों से उठा देगा’ और ‘सिंहासनों से’ जैसे ठोस बिंब बनाए रखना
  alternative: ‘पदच्युत करेगा’ या ‘दीन कर देगा’
  rationale: अमूर्त व्याख्या मूल के प्रलय-दर्शी चित्रों और क्रिया की सम्भावित व्यापकता को सीमित कर देती।
- issue: कमर ढीली करने के कठिन पाठ का अर्थ
  choice: शक्ति और प्रतिरोध छीनने वाली ‘कमर के बंधन ढीले’ करने की छवि
  alternative: ‘बलवानों की लगाम ढीली करेगा’ अथवा सामान्यीकृत ‘उनकी शक्ति छीन लेगा’
  rationale: आधुनिक भाषाओं में ‘लगाम ढीली करना’ नियंत्रण कम करने और अधिक स्वतंत्रता देने का उलटा भाव दे सकता है। ‘कमर’ सम्भावित पाठ-सुधार और निकट बाइबिलीय मुहावरे से मेल खाती है, पर पाठगत अनिश्चितता स्पष्ट रूप से नोट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। ‘मनुष्य-पुत्र’, ‘सिंहासन’ और ‘पापी’ जैसे परिचित धार्मिक-साहित्यिक शब्द बनाए गए हैं; कठिन मध्यवर्ती छवि को सरल व्याख्या से बदलने के बजाय पाद-टिप्पणी में उसकी अनिश्चितता दी गई है।
