base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/037/001.yaml
  text: The second vision of wisdom that Enoch son of Jared[a], son of Mahalalel, son of Cainan, son of Enos, son of Seth, son of Adam[c][b], saw.
translation:
  language: hi
  text: दूसरा[a] दर्शन, जो उसने देखा—बुद्धि का वह दर्शन, जिसे हनोक ने देखा[b]; हनोक येरेद का पुत्र था, येरेद महललेल का पुत्र, महललेल कैनान का पुत्र, कैनान एनोस का पुत्र, एनोस शेत का पुत्र और शेत आदम का पुत्र था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक और दर्शन।” गीइज़ शब्द का अर्थ “दूसरा,” “अन्य” या “एक और” हो सकता है; यहाँ शीर्षक में संभावित क्रम के कारण “दूसरा” रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: 'मूल में “दर्शन” और “देखा” दोनों दो बार आते हैं: “दूसरा दर्शन, जो उसने देखा—बुद्धि का वह दर्शन, जिसे हनोक ने देखा।” इस पुनरुक्त रचना को जानबूझकर बनाए रखा गया है।'
    reason: source_structure
lexical_decisions:
- source_word: ራእይ / ራእየ
  choice: दर्शन
  rationale: प्रकाशनात्मक संदर्भ में यह किसी अलौकिक रूप से देखी हुई बात को सूचित करता है। ‘दर्शन’ आधुनिक हिन्दी में स्वाभाविक है और मूल में आए दोनों प्रयोगों की पुनरावृत्ति बनाए रखता है।
- source_word: ካልእ
  choice: दूसरा
  rationale: इस शीर्षक में यह नए क्रमिक दर्शन की ओर संकेत कर सकता है; फिर भी ‘एक और’ अर्थ संभव होने के कारण उसे पादटिप्पणी में रखा गया है।
- source_word: ጥበብ
  choice: बुद्धि
  rationale: यह मूल शब्द के सामान्य अर्थ ‘wisdom’ को सीधे व्यक्त करता है और दर्शन के विशिष्ट स्वरूप को बनाए रखता है।
- source_word: ዘርእየ
  choice: जो उसने देखा / जिसे हनोक ने देखा
  rationale: मूल में यह संबंधवाचक क्रिया दो बार आती है। हिन्दी में दोनों प्रयोग रखे गए हैं ताकि शीर्षक की जानबूझकर की गई पुनरुक्ति न मिटे।
- source_word: ወልደ
  choice: का पुत्र
  rationale: वंशावली के प्रत्येक संबंध को ‘वंशज’ जैसे व्यापक शब्द में बदलने के बजाय स्पष्ट पुत्र-संबंध के रूप में रखा गया है।
- source_word: ሄኖክ; ያሬድ; መላልኤል; ቃይናን; ሄኖስ; ሴት; አዳም
  choice: हनोक; येरेद; महललेल; कैनान; एनोस; शेत; आदम
  rationale: नामों को गीइज़ साक्ष्य के अनुरूप, हिन्दी पाठकों के लिए स्पष्ट देवनागरी रूपों में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ካልእ का क्रमसूचक या अनिश्चित अर्थ
  choice: मुख्य पाठ में ‘दूसरा’
  alternative: ‘एक और’ अथवा ‘अन्य’
  rationale: नए दर्शनीय खंड के शीर्षक में क्रमसूचक अर्थ संभावित है, पर मूल की वास्तविक शब्दार्थगत अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: शीर्षक में ‘दर्शन’ और ‘देखा’ की पुनरावृत्ति
  choice: दोनों समानांतर वाक्यांशों को मुख्य पाठ में बनाए रखना
  alternative: उन्हें मिलाकर केवल ‘दूसरा बुद्धि का दर्शन जिसे हनोक ने देखा’ कहना
  rationale: मूल में ራእይ/ራእየ और ዘርእየ की दोहरी रचना स्पष्ट है। उसे समतल कर देना मूल की अनुप्रयुक्त, पुनरुक्त शैली को हटा देता।
- issue: आदम तक पूरी वंशावली
  choice: सभी पिता-पुत्र संबंध स्पष्ट रखना
  alternative: वंशावली को संक्षिप्त करना या केवल ‘आदम का वंशज’ कहना
  rationale: पूरी वंशावली हनोक को आदिकालीन इतिहास में स्थापित करने वाले शीर्षक का अभिन्न अंग है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। शीर्षक की प्राचीन, अनुप्रयुक्त पुनरावृत्ति को स्वाभाविक हिन्दी विराम-चिह्नों के सहारे सुरक्षित किया गया है; वंशावली को समझने योग्य बनाने के लिए प्रत्येक पिता-पुत्र संबंध स्पष्ट किया गया है।
