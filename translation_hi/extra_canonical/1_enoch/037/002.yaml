base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/037/002.yaml
  text: 'And this is the beginning of the word of wisdom that I lifted up to speak and say to those who dwell on the dry land: Hear[a], you former ones, and see, you latter ones[d][c][b], the holy words that I speak before the Lord of Spirits.'
translation:
  language: hi
  text: 'और यह बुद्धि के उस वचन का आरम्भ है, जिसे मैंने सूखी भूमि पर रहनेवालों[a] को सुनाने के लिए उठाया[b] है: हे पहले के लोगो, सुनो; और हे बाद के लोगो, उन पवित्र वचनों को देखो[c], जिन्हें मैं आत्माओं के प्रभु के सामने[d] कहता हूँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ‘पृथ्वी पर रहनेवाले।’ गीज़ में अधिक शाब्दिक रूप से ‘सूखी भूमि पर’ है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘जिसे मैंने बोलने [और कहने] के लिए उठाया।’ कोष्ठकित शब्द का पाठ अनिश्चित है।
    reason: textual_and_lexical_note
  - marker: c
    text: ‘पहले के लोग’ और ‘बाद के लोग’ सम्भवतः पहले और बाद की पीढ़ियों को संबोधित करते हैं।
    reason: cultural_note
  - marker: d
    text: या ‘आत्माओं के प्रभु की उपस्थिति में।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ርእሱ፡ ለነገረ፡ ጥበብ
  choice: बुद्धि के उस वचन का आरम्भ
  rationale: ርእስ का मूल अर्थ ‘सिर’ है, पर यहाँ यह प्रवचन के आरम्भ को सूचित करता है। ነገረ ጥበብ की एकवचन और गरिमापूर्ण संरचना को ‘बुद्धि का वचन’ से रखा गया है।
- source_word: ዘአንሣእኩ
  choice: जिसे मैंने ... उठाया है
  rationale: क्रिया में उठाने या ऊँचा करने का ठोस भाव है। असामान्य किंतु घोषणात्मक बिंब को केवल ‘कहा’ बनाकर सपाट नहीं किया गया।
- source_word: እትናገር፡ [እብል፡]
  choice: कहने के लिए
  rationale: दोनों रूप वाणी या घोषणा को व्यक्त करते हैं, किंतु दूसरा शब्द पाठ में कोष्ठकित और अनिश्चित है। सहज हिन्दी में अर्थ को एक क्रिया से व्यक्त किया गया और पाठगत बात पादटिप्पणी में रखी गई।
- source_word: ለእለ፡ ይነድሩ፡ ውስተ፡ የብስ
  choice: सूखी भूमि पर रहनेवालों
  rationale: የብስ का ठोस अर्थ ‘सूखी भूमि’ है। इसे मुख्य पाठ में बनाए रखा गया, जबकि ‘पृथ्वी’ का व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ስምዑ፡ ቀደምት፡ ወርእዩ፡ ደኃርያን
  choice: हे पहले के लोगो, सुनो; और हे बाद के लोगो, देखो
  rationale: दो आज्ञार्थक क्रियाओं और पहले/बाद के लोगों की समानांतर रचना सुरक्षित रखी गई है। ‘बाद में आनेवाले’ भी सम्भव है, पर समानांतरता के लिए ‘पहले के’ और ‘बाद के’ चुने गए।
- source_word: ነገረ፡ ቅዱሰ፡ እለ
  choice: वे पवित्र वचन, जिन्हें
  rationale: ቅዱሰ यहाँ ነገረ से सहमत विशेषण है, इसलिए अर्थ ‘पवित्र वचन’ है, ‘पवित्र जन का वचन’ नहीं। बहुवचन संबंधवाचक እለ के कारण हिन्दी में ‘वचन’ को बहुवचन अर्थ में लिया गया है।
- source_word: ቅድመ፡ እግዚአ፡ መንፈሳት
  choice: आत्माओं के प्रभु के सामने
  rationale: यह 1 हनोक में प्रयुक्त प्रमुख ईश्वरीय उपाधि है। ቅድመ का स्थानिक और संबंधात्मक भाव ‘के सामने’ से सीधे व्यक्त होता है।
theological_decisions:
- issue: ነገረ ቅዱሰ का अर्थ
  choice: पवित्र वचन
  alternative: पवित्र जन का वचन
  rationale: गीज़ में ቅዱሰ विशेषण के रूप में ነገረ से व्याकरणिक सहमति रखता है, और उसके बाद का बहुवचन संबंधवाचक रूप भी ‘वचनों’ का समर्थन करता है। इसलिए यहाँ किसी देवदूत या परमेश्वर के लिए ‘पवित्र जन’ उपाधि मानना उचित नहीं।
- issue: ‘सूखी भूमि पर रहनेवालों’ का दायरा
  choice: ठोस मूल बिंब को रखते हुए मानव पृथ्वीवासियों के व्यापक संबोधन के रूप में समझना
  alternative: मुख्य पाठ में केवल ‘पृथ्वी पर रहनेवालों’ कहना
  rationale: संदर्भ व्यापक मानव समुदाय को संबोधित करता है, फिर भी स्रोत का ‘सूखी भूमि’ वाला बिंब अनुवाद में सुरक्षित रहना चाहिए।
- issue: ‘आत्माओं के प्रभु’ उपाधि
  choice: उपाधि का सीधा अनुवाद
  alternative: परमेश्वर या सर्वशक्तिमान कहकर अर्थ-विस्तार
  rationale: स्रोत की विशिष्ट हनोकीय उपाधि को संप्रदायगत या व्याख्यात्मक पर्याय से बदलना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और घोषणात्मक रखी गई है। ‘उठाया’ का असामान्य बिंब स्रोत के अपोकैलिप्टिक स्वर को बचाता है; आज्ञार्थक समानांतरता को स्पष्ट संबोधन के साथ रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में क्रम से उपस्थित हैं।
