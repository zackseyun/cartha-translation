  yaml_path: translation/extra_canonical/1_enoch/037/004.yaml
  text: Until now[a], it had not been given to me before the Lord of Spirits[b], what I have received.
translation:
  language: hi
  text: अब तक[a], जो मैंने प्राप्त किया है[b], वह आत्माओं के प्रभु की उपस्थिति से मुझे नहीं दिया गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् इस समय तक।
    reason: temporal_clarification
  - marker: b
    text: अंतिम वाक्यांश कठिन है। इसका अनुवाद ‘जिसे मैंने ग्रहण किया है’ या अधिक शाब्दिक रूप से ‘जिसे मैंने उठाया है’ भी हो सकता है। प्रसंग में इसका संकेत किसी कथन या प्रवचन को आरम्भ करने की ओर हो सकता है, पर गीइज़ पाठ उसका कर्म स्पष्ट नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: እስከ፡ ይእዜ
  choice: अब तक
  rationale: यह स्वाभाविक आधुनिक हिन्दी में उस वर्तमान बिंदु तक की अवधि व्यक्त करता है जिसके पहले यह प्रदान नहीं किया गया था।
- source_word: ኢተውህበኒ
  choice: मुझे नहीं दिया गया था
  rationale: कर्मवाच्य रूप और प्रथम पुरुष कर्म-प्रत्यय को सुरक्षित रखता है; पूर्वकालिक संदर्भ के कारण ‘गया था’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: እምቅድመ
  choice: के सम्मुख से
  rationale: उद्गमसूचक ‘से’ तथा दरबारी/उपस्थिति-संबंधी ‘सम्मुख’—दोनों भाव बचते हैं; केवल ‘के सामने’ कहने से उद्गम का संकेत खो सकता है।
- source_word: እግዚአ፡ መንፈሳት
  choice: आत्माओं के प्रभु
  rationale: 1 हनोक में बार-बार आने वाली विशिष्ट ईश्वरीय उपाधि का सीधा और गरिमापूर्ण हिन्दी रूप।
- source_word: ዘነሣእኩ
  choice: जो मैंने पाया है
  rationale: यहाँ ነሣእ का अर्थ ‘पाना/ग्रहण करना’ लिया गया है, जो ‘दिया जाना’ के साथ स्वाभाविक अर्थ-युग्म बनाता है; फिर भी क्रिया के ‘उठाना/ग्रहण करना’ वाले व्यापक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: अंतिम क्रिया ዘነሣእኩ का संदर्भगत अर्थ
  choice: जो मैंने पाया है
  alternative: जिसे मैंने ग्रहण किया है; जिसे मैंने उठाया है; जो मैंने कहना आरम्भ किया है
  rationale: ‘पाया है’ देने और पाने के स्वाभाविक संबंध को व्यक्त करता है और हिन्दी में वाक्य को बोधगम्य बनाता है। चूँकि गीइज़ में कथन, दृष्टान्त या प्रवचन जैसा कोई कर्म स्पष्ट नहीं है, मुख्य पाठ में ऐसा कर्म नहीं जोड़ा गया।
- issue: እምቅድመ में उद्गम और उपस्थिति का संबंध
  choice: आत्माओं के प्रभु के सम्मुख से
  alternative: आत्माओं के प्रभु के सामने; आत्माओं के प्रभु की ओर से
  rationale: ‘सम्मुख से’ मूल के उद्गमसूचक उपसर्ग और प्रभु की उपस्थिति—दोनों को बनाए रखता है, बिना इसे केवल स्थान या केवल प्रतिनिधिक अभिकरण तक सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण अपोकैलिप्टिक शैली रखी गई है। ‘आत्माओं के प्रभु’ विशिष्ट उपाधि के रूप में सुरक्षित है। वाक्यक्रम हिन्दी की स्वाभाविकता के लिए बदला गया है, जबकि मूल के सभी प्रमुख अर्थतत्त्व और अंतिम क्रिया की अनिश्चितता बनाए रखी गई है।
