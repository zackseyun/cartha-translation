  choice: पहले वालों
  rationale: यह पद पहले के लोगों और बाद के लोगों के बीच भेद करता प्रतीत होता है; ‘पहले वालों’ से वही संबंधपरक अस्पष्टता बनी रहती है।
- source_word: ይኄይስ
  choice: उत्तम है
  rationale: यह ኀየሰ से निकला रूप है और ‘अच्छा/बेहतर है’ का भाव देता है; इसे साहित्यिक विधा ‘दृष्टान्त’ मानना उचित नहीं।
- source_word: ብሂል
  choice: बोलना
  rationale: यह ‘कहना/बोलना’ का क्रियारूप है, न कि ‘आरम्भ’ का संज्ञारूप।
- source_word: ወደኃርያንሂ
  choice: पर बाद वालों से भी
  rationale: ደኃርያን ‘बाद के लोग’ और -ሂ ‘भी’ का भाव देता है; हिन्दी में विरोध को स्वाभाविक बनाने के लिए ‘पर’ रखा गया है।
- source_word: ኢንከልእ
  choice: हम ... नहीं रोकेंगे
  rationale: यह ከልአ ‘रोकना/वंचित रखना’ का प्रथम पुरुष बहुवचन नकारात्मक रूप समझा गया है।
- source_word: ርእሳ
  choice: आरम्भ
  rationale: शाब्दिक अर्थ ‘सिर’ है, पर यहाँ ‘आरम्भ’ सम्भावित मुहावरेदार अर्थ है; कठिन पाठ के कारण टिप्पणी दी गई है।
- source_word: ለጥበብ
  choice: बुद्धि का
  rationale: ‘बुद्धि/ज्ञान’ के संबंध को सहज हिन्दी में संबंधकारक से व्यक्त किया गया है।
theological_decisions:
- issue: अन्तिम पदबंध का अर्थ
  choice: बुद्धि का आरम्भ नहीं रोकेंगे
  alternative: बुद्धि की मुख्य बात से वंचित नहीं रखेंगे
  rationale: प्रेषित गीइज़ पाठ कठिन है। ‘आरम्भ’ ርእስ (‘सिर/मुख्य भाग/आरम्भ’) के सम्भव अर्थ को निकटता से रखता है और अस्पष्टता को टिप्पणी में स्पष्ट करता है।
- issue: पहले और बाद वालों का संदर्भ
  choice: पहले वालों ... बाद वालों
  alternative: पहली बातों ... बाद की बातों
  rationale: व्याकरण और पिछले पद के संबोधन के आधार पर लोगों का संकेत अधिक सम्भावित है, पर पाठ स्वयं उनकी पहचान स्पष्ट नहीं करता।
