base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/037/003.yaml
  text: It is better to speak to the former ones[b][a], but even from the latter ones we will not withhold the beginning of wisdom.
translation:
  language: hi
  text: पहले वालों से बोलना बेहतर है; पर बाद वालों को भी हम बुद्धि के आरम्भ से वंचित नहीं रखेंगे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीइज़ में अन्तिम पदबंध कठिन है। ‘बुद्धि का आरम्भ’ का शाब्दिक आधार ‘बुद्धि का सिर’ है; इसका अर्थ ‘बुद्धि की मुख्य बात’ भी हो सकता है।
    reason: textual_uncertainty
  - marker: b
    text: 'एक पुराना पाठ-विभाजन इसका अर्थ इस प्रकार करता था: ‘यह पहले दृष्टान्त का आरम्भ है, और इसके बाद बुद्धि का कोई दूसरा आरम्भ न होगा।’ पर यहाँ प्रयुक्त शब्दों का अधिक सम्भावित अर्थ ‘बेहतर है,’ ‘बोलना,’ और ‘हम वंचित नहीं रखेंगे’ है।'
    reason: previous_rendering
lexical_decisions:
