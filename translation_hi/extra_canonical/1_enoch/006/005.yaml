lexical_decisions:
- source_word: አሜሃ
  choice: तब
  rationale: यह कथा में अगली घटना को क्रम से प्रस्तुत करता है।
- source_word: መሐሉ
  choice: शपथ खाई
  rationale: गीज़ क्रिया መሐለ का अर्थ शपथ खाना है; इसे केवल ‘कहा’ या ‘बोले’ करना अशुद्ध होगा।
- source_word: ኵሎሙ ኅቡረ
  choice: उन सबने मिलकर
  rationale: दोनों पद समस्त समूह की एकमत और संयुक्त कार्रवाई पर बल देते हैं।
- source_word: ወአውገዙ
  choice: और ... शाप से बाँध लिया
  rationale: यह कारक रूप शाप अथवा अभिशाप के अधीन बाँधने का अर्थ रखता है और पारस्परिक शपथ की दंडात्मक गंभीरता व्यक्त करता है।
- source_word: በበይናቲሆሙ
  choice: एक-दूसरे को
  rationale: यह पारस्परिक संबंध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ቦቱ
  choice: इस विषय में
  rationale: यह तत्काल पूर्ववर्ती प्रस्ताव की ओर संकेत करता है, पर उसके विषय को मूल से अधिक विशिष्ट नहीं बनाता।
theological_decisions:
- issue: प्रतिज्ञा को केवल पारस्परिक बंधन कहना या शापयुक्त शपथ के रूप में स्पष्ट करना
  choice: शपथ खाई और ... शाप से बाँध लिया
  alternative: शपथ खाई और एक-दूसरे के प्रति बँध गए
  rationale: मूल में शपथ खाने और शाप से बाँधने की दो अलग क्रियाएँ हैं। दोनों को बनाए रखने से इस पारस्परिक प्रतिज्ञा का आत्म-अभिशापात्मक बल सुरक्षित रहता है, बिना किसी सांप्रदायिक व्याख्या के।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘शाप से बाँध लिया’ कुछ औपचारिक है, पर मूल क्रिया की विशिष्ट गंभीरता और पारस्परिकता को स्वाभाविक रूप से बनाए रखता है।
