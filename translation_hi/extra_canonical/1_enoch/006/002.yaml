base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/002.yaml
  text: And the angels[a], the sons of heaven, saw them and desired them. And they said among themselves, “Come, let us choose for ourselves wives from the children of men[d][c][b], and let us beget children for ourselves.”
translation:
  language: hi
  text: और स्वर्गदूतों ने, स्वर्ग के पुत्रों ने, उन्हें देखा और उनकी कामना की।[a] उन्होंने आपस में कहा, “आओ, हम मनुष्यों की संतानों में से अपने लिए पत्नियाँ चुनें और अपने लिए संतान उत्पन्न करें।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उन्हें” पिछली आयत में उल्लिखित स्त्रियों की ओर संकेत करता है; गीज़ पाठ यहाँ “स्त्रियाँ” शब्द को दोबारा स्पष्ट रूप से नहीं कहता।
    reason: cross_reference
  - marker: b
    text: “मनुष्यों की संतानों” एक शाब्दिक, ऊँचा पद है, जो इन स्वर्गीय प्राणियों के विपरीत मानव वंश को सूचित करता है; इसका अनुवाद “मानव-संतानों में से” भी किया जा सकता है। अंतिम वाक्यांश का शाब्दिक भाव अपने लिए संतान उत्पन्न करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርእዩ ኪያሆን
  choice: उन्होंने उन्हें देखा
  rationale: क्रिया और स्त्रीलिंग बहुवचन कर्म-सर्वनाम को सीधे रखा गया है; ‘उन्हें’ पिछली आयत की स्त्रियों की ओर संकेत करता है।
- source_word: መላእክት ውሉደ ሰማያት
  choice: स्वर्ग के पुत्र, उन स्वर्गदूतों ने
  rationale: दोनों पदनामों और उनके समानाधिकरण संबंध को सुरक्षित रखा गया है। हिंदी में कर्ता को स्पष्ट करने तथा ‘उन्हें’ को स्वर्गदूतों का विशेषण समझे जाने से रोकने के लिए स्वाभाविक कर्ता-क्रम अपनाया गया है।
- source_word: ወፈተውዎን
  choice: उनकी अभिलाषा की
  rationale: यह प्रबल इच्छा व्यक्त करता है, पर मूल से अधिक स्पष्ट यौन अर्थ जोड़ने वाले ‘वासना की’ से बचता है।
- source_word: በበይናቲሆሙ
  choice: आपस में
  rationale: समूह के भीतर पारस्परिक बातचीत का स्वाभाविक आधुनिक हिंदी रूप।
- source_word: ንዑ
  choice: आओ
  rationale: परामर्शात्मक आह्वान का सीधा और सहज रूप।
- source_word: ንሕረይ ለነ አንስተ
  choice: हम अपने लिए पत्नियाँ चुनें
  rationale: चुनने के अर्थ और अपने लाभ के भाव दोनों को बनाए रखता है; प्रसंग में ‘पत्नियाँ’ सामान्य ‘स्त्रियों’ से अधिक उपयुक्त है।
- source_word: እምውሉደ ሰብእ
  choice: मनुष्यों की संतानों में से
  rationale: स्वर्गीय प्राणियों और मानव वंश के बीच मूल का ऊँचा, अपोकैलिप्टिक विरोध बनाए रखता है और आधुनिक हिंदी में समझने योग्य है।
- source_word: ወንለድ ለነ ውሉደ
  choice: अपने लिए संतान उत्पन्न करें
  rationale: जन्म देने/उत्पन्न करने के भाव को औपचारिक किंतु सहज आधुनिक हिंदी में व्यक्त करता है; ‘अपने लिए’ मूल के हितसूचक भाव को रखता है।
theological_decisions:
- issue: इन प्राणियों की पहचान स्वर्गदूत और स्वर्ग के पुत्र—दोनों रूपों में
  choice: दोनों पदनाम समानाधिकरण में सुरक्षित रखे गए
  alternative: केवल ‘स्वर्गदूत’ कहना अथवा दोनों को मिलाकर ‘स्वर्गीय स्वर्गदूत’ कहना
  rationale: गीज़ पाठ में दोनों पद स्पष्ट हैं; किसी एक को हटाने से पाठ की अलौकिक पहचान और उसका तनाव समतल हो जाएगा।
- issue: इच्छा व्यक्त करने वाली क्रिया की यौन स्पष्टता
  choice: ‘उनकी अभिलाषा की’
  alternative: ‘उन पर वासना की’ या ‘उनसे प्रेम करने लगे’
  rationale: प्रसंग अवैध यौन-संबंध की ओर जाता है, किंतु मूल क्रिया इच्छा बताती है; चुना हुआ रूप न अर्थ को अधिक कठोर बनाता है, न उसे भावुक प्रेम में नरम करता है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘स्वर्ग के पुत्र’ और ‘मनुष्यों की संतान’ जैसे ऊँचे पदों को जानबूझकर रखा गया है। मुख्य पाठ में सर्वनाम-संदर्भ और समानाधिकरण स्पष्ट करने के लिए स्वाभाविक हिंदी वाक्य-क्रम अपनाया गया है।
