  yaml_path: translation/extra_canonical/1_enoch/006/006.yaml
  text: And all of them were two hundred[a], and they came down onto Ardis[b], which is the summit of Mount Hermon.
translation:
  language: hi
  text: वे सब कुल दो सौ थे, और वे अरदीस[a] पर उतर आए[b], जो हर्मोन पर्वत की चोटी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अरदीस’ स्थान-नाम का लिप्यंतरण है; इसके ठीक उच्चारण को लेकर अनिश्चितता है। गीइज़ पाठ इसे हर्मोन पर्वत की चोटी के रूप में पहचानता है।
    reason: lexical_alternative
  - marker: b
    text: इस क्रिया का अधिक शब्दशः अनुवाद ‘नीचे उतरे’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሎሙ
  choice: वे सब
  rationale: सर्वनामयुक्त रूप पहले बताए गए पूरे समूह को स्पष्ट करता है; ‘वे सब’ उसके सामूहिक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ክልኤ ምእት
  choice: कुल दो सौ
  rationale: यह सीधी संख्या-सूचक अभिव्यक्ति है। ‘कुल’ समूह की पूर्ण संख्या को सहज ढंग से स्पष्ट करता है।
- source_word: ወወረዱ
  choice: उतर आए
  rationale: क्रिया नीचे की ओर गति बताती है। ‘उतर आए’ आधुनिक हिन्दी में स्वाभाविक है और प्रहरी-दूतों के ऊपर से नीचे आने की कथात्मक तथा ब्रह्मांडीय दिशा को सुरक्षित रखता है।
- source_word: ውስተ
  choice: पर
  rationale: यहाँ पर्वतीय स्थान के साथ इसका अर्थ किसी स्थल या ऊँचाई पर पहुँचने का है; इसलिए ‘पर’ हिन्दी में ‘के भीतर’ से अधिक उपयुक्त है।
- source_word: አርዲስ
  choice: अरदीस
  rationale: यह स्थान-नाम है, इसलिए इसका अनुवाद करने के बजाय गीइज़ रूप के निकट देवनागरी लिप्यंतरण किया गया है। इसके ठीक उच्चारण को लेकर अनिश्चितता बनी हुई है।
- source_word: ዝውእቱ ድማኁ ለደብረ አርሞን
  choice: यह हर्मोन पर्वत की चोटी है
  rationale: सम्बन्धवाचक कथन अरदीस की पहचान हर्मोन पर्वत के ऊपरी शिखर से कराता है। ‘चोटी’ सामान्य पाठक के लिए स्पष्ट और भौगोलिक रूप से सटीक है।
theological_decisions:
- issue: प्रहरी-दूतों के नीचे आने का वर्णन
  choice: उतर आए
  alternative: नीचे उतरे
  rationale: यह पाठ स्वर्ग से पृथ्वी की ओर उनके उल्लंघनकारी गमन को चित्रित करता है। ‘उतर आए’ दृश्यात्मक गति को बनाए रखता है, पर बाद की किसी विशिष्ट धर्मवैज्ञानिक शब्दावली को आरोपित नहीं करता।
