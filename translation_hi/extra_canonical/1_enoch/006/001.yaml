base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/001.yaml
  text: And it came to pass[a], when the children of men had multiplied in those days, daughters were born to them, beautiful and comely.
translation:
  language: hi
  text: और ऐसा हुआ कि उन दिनों जब मनुष्यों की सन्तान बहुत बढ़ गई, तब उनके यहाँ सुन्दर और मनोहर बेटियाँ पैदा हुईं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኮነ
  choice: और ऐसा हुआ कि
  rationale: यह नए प्रसंग का आरम्भ करने वाला कथात्मक सूत्र है; यह गीइज़ की गरिमा बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: እምዘ በዝኁ
  choice: जब ... बहुत बढ़ गई
  rationale: यह रचना उस परिस्थिति और समय को व्यक्त करती है जिसमें आगे की घटना घटी; ‘बहुत बढ़ गई’ संख्या-वृद्धि को स्पष्ट करती है।
- source_word: ውሉደ ሰብእ
  choice: मनुष्यों की सन्तान
  rationale: यह पारम्परिक मानव-सूचक अभिव्यक्ति के निकट है और अगले पदों में पहरेदारों के साथ आने वाले विरोध को बनाए रखती है; इसे केवल पुरुषों तक सीमित नहीं करती।
- source_word: በእማንቱ መዋዕል
  choice: उन दिनों
  rationale: यह अपोकैलिप्टिक कथन में प्रयुक्त मानक काल-सूचक पदबंध का स्वाभाविक हिन्दी रूप है।
- source_word: ተወልዳ ሎሙ አዋልድ
  choice: उनके यहाँ ... बेटियाँ पैदा हुईं
  rationale: यह जन्म की घटना और सम्बद्धता दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ሠናያት
  choice: सुन्दर
  rationale: यह रूप-आकर्षण या देखने में भले होने का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ወላሕያት
  choice: मनोहर
  rationale: दूसरे विशेषण को अलग रखकर मूल की दोहरी प्रशंसा और ऊँचा साहित्यिक स्वर सुरक्षित रहता है।
theological_decisions:
- issue: आगे स्वर्गीय पहरेदारों से विरोध में प्रयुक्त मानव-सूचक पदबंध
  choice: मनुष्यों की सन्तान
  alternative: मनुष्यों के पुत्र; मानवजाति
  rationale: यह मूल पदबंध की पारम्परिक बनावट और प्रसंगगत विरोध को बनाए रखता है, पर उसे केवल पुरुष सन्तान के अर्थ में नहीं बाँधता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली। ‘और ऐसा हुआ कि’ मूल के प्रसंगारम्भ सूत्र को रखता है; ‘सुन्दर और मनोहर’ दोनों गीइज़ विशेषणों को अलग-अलग व्यक्त करता है।
