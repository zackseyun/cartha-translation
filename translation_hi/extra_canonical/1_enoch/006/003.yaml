base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/003.yaml
  text: And Semyaza[a], who was their leader, said to them, “I fear that you may not be willing to do this deed[b], and I alone will become liable for a great sin.”
translation:
  language: hi
  text: और उनके अगुआ सेमयाज़ा[a] ने उनसे कहा, “मुझे डर है कि कहीं तुम इस काम को करने के लिए तैयार न हो, और इस बड़े पाप के लिए मुझे अकेले ही उत्तरदायी ठहरना पड़े।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अगुआ” के पीछे का गीइज़ पद शाब्दिक रूप से “उनके दूत” या “उनके स्वर्गदूत” के निकट है; यहाँ प्रसंग में वह सेमयाज़ा को समूह का प्रधान बताता है।
    reason: lexical_alternative
  - marker: b
    text: “उत्तरदायी ठहरना” का अनुवाद “दण्ड चुकाना” या “दण्ड भुगतना” भी किया जा सकता है; मूल पद में कानूनी और नैतिक उत्तरदायित्व का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ስምያዛ
  choice: शमयाज़ा
  rationale: व्यक्तिनाम का अनुवाद नहीं, बल्कि गीइज़ रूप के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: መልአኮሙ
  choice: उनके अगुआ
  rationale: शाब्दिक अर्थ ‘उनका दूत/स्वर्गदूत’ के निकट है, पर प्रसंग में यह समूह के प्रधान की भूमिका बताता है; ‘अगुआ’ स्वाभाविक हिन्दी में उस कार्यगत अर्थ को रखता है।
- source_word: እፈርህ
  choice: मुझे डर है
  rationale: प्रथम पुरुष में व्यक्त आशंका को सीधी और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ኢትፍቅዱ
  choice: कहीं तुम ... करने के लिए तैयार न हो
  rationale: क्रिया सहमति या इच्छा का बोध कराती है, केवल सामर्थ्य का नहीं; यह रचना ‘मुझे डर है’ के बाद आशंकासूचक भाव भी बनाए रखती है।
- source_word: ይትገበር ... ዝንቱ ግብር
  choice: यह काम करने
  rationale: ‘इस कार्य/कर्म को पूरा करने’ के मूल भाव को सामान्य, स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: ባሕቲትየ
  choice: मुझे अकेले ही
  rationale: यदि दूसरे पीछे हटें तो केवल शमयाज़ा के उत्तरदायी रहने पर मूल का बल बनाए रखता है।
- source_word: ፈዳዪ
  choice: दण्ड ... भुगतना पड़े
  rationale: शब्द में दण्ड चुकाने अथवा उत्तरदायी ठहरने का न्यायिक-नैतिक भाव है; हिन्दी में यह उस परिणाम को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: ለኃጢአት ዐባይ
  choice: इस बड़े पाप का
  rationale: गंभीर अपराध के नैतिक भार को सीधे रूप में सुरक्षित रखता है।
theological_decisions:
- issue: अन्य पहरेदारों के संबंध में शमयाज़ा की भूमिका
  choice: उनके अगुआ
  alternative: उनका स्वर्गदूत / उनका प्रधान
  rationale: मूल पद दूत/स्वर्गदूत से संबंधित है, किन्तु इस प्रसंग में शमयाज़ा को समूह के मुखिया के रूप में पहचानता है। ‘अगुआ’ कथानक की भूमिका स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- issue: महान पाप के संबंध में शमयाज़ा की परिणति
  choice: दण्ड मुझे अकेले ही भुगतना पड़े
  alternative: मैं अकेला ही उत्तरदायी ठहरूँ / मुझे अकेले ही प्रायश्चित करना पड़े
  rationale: मूल में उत्तरदायित्व और दण्ड-वहन दोनों की गुंजाइश है। मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई है और पादटिप्पणी में वैकल्पिक न्यायिक अर्थ दिया गया है; ‘प्रायश्चित’ से बचा गया है क्योंकि वह अतिरिक्त धार्मिक अर्थ जोड़ सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘अगुआ’ कार्यगत नेतृत्व को व्यक्त करता है; ‘तैयार न हो’ इच्छा/सहमति का भाव रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
