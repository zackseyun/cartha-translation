base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/004.yaml
  text: And they all answered him and said[a], "Let us all swear an oath, and let us all bind one another with a curse, so that we do not turn back from this plan[b], but carry out this deed."
translation:
  language: hi
  text: और उन सबने उसे उत्तर दिया और कहा[a], “हम सब शपथ खाएँ और शाप के द्वारा एक-दूसरे को बाँधें, ताकि हम इस योजना से पीछे न हटें[b], बल्कि इस कार्य को पूरा करें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ में ‘शपथ खाना’ और ‘शाप के द्वारा बाँधना’ दोनों आते हैं। यह दोहरा प्रयोग उनकी गंभीर पारस्परिक प्रतिज्ञा पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: साक्ष्य-पाठ के अंतिम भाग में ‘यह योजना ... यह कार्य’ जैसी पुनरुक्ति है; अनुवाद योजना से उसके क्रियान्वयन की ओर बढ़ने का भाव बनाए रखता है।
    reason: textual_variant
