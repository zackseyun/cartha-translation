theological_decisions:
- issue: पहरेदारों की पारस्परिक शपथ का स्वरूप
  choice: पारस्परिक शाप से दृढ़ की गई आत्म-बाध्यकारी संधि
  alternative: साधारण प्रतिज्ञा या बिना बाध्यकारी अर्थ का सामान्य शाप
  rationale: शपथ और शाप का संयुक्त प्रयोग साधारण सहमति से अधिक गंभीर, स्वयं को बाध्य करने वाला षड्यंत्र दर्शाता है; इस न्यायिक और नैतिक गंभीरता को स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘पीछे न हटें’ से स्रोत का दिशात्मक और इच्छापरक भाव बचाया गया है; ‘शाप के द्वारा ... बाँधें’ पारस्परिक आत्म-बाध्यता को संप्रदायगत व्याख्या के बिना व्यक्त करता है।
