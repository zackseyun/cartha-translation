base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/003.yaml
  text: And as for your cry[a], cry out, and he will make it appear to you[e][d][c][b]; for all your affliction will be sought out from the angels and from all those who helped those who plundered you.
translation:
  language: hi
  text: और तुम्हारी पुकार के लिए, पुकारो; और वह तुम्हें यह प्रकट करेगा[a]। क्योंकि तुम्हारे सारे क्लेश का हिसाब स्वर्गदूतों[b] से और उन सब से माँगा जाएगा जिन्होंने तुम्हें लूटने वालों की सहायता की[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ का यह अंश कठिन है। इसका अनुवाद ‘वह तुम्हें दिखाएगा’ या ‘वह तुम्हें प्रकट करेगा’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘दूतों से’; इस शब्द का प्रयोग कुछ संदर्भों में अधिकारियों या शासकों के लिए भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात उन लोगों से भी हिसाब माँगा जाएगा जिन्होंने तुम्हें लूटने वालों का साथ दिया।
    reason: clarification
lexical_decisions:
- source_word: ወጽራኅ … ጽርኁ
  choice: जहाँ तक तुम्हारी पुकार का प्रश्न है, पुकारो
  rationale: पुकारने की पुनरावृत्ति और आदेशात्मक बल को बनाए रखते हुए वाक्य को स्वाभाविक हिन्दी रूप दिया गया है; स्रोत में ‘न्याय के लिए’ जैसा कोई अतिरिक्त वाक्यांश नहीं जोड़ा गया।
- source_word: ወያስተርኢ ለክሙ
  choice: और वह उसे तुम्हारे सामने प्रकट करेगा
  rationale: कारक रूप में दिखाने या प्रकट करने का भाव है। अस्पष्ट कर्ता और पूर्वगामी को स्रोत की तरह खुला रखा गया है।
- source_word: ኵሉ ምንዳቤክሙ
  choice: तुम्हारे सारे क्लेश
  rationale: ‘क्लेश’ दुःख, कठिनाई और उत्पीड़न की व्यापकता को समेटता है, बिना अर्थ को केवल बाहरी सताव तक सीमित किए।
- source_word: ይትኃሠሥ
  choice: छानबीन की जाएगी
  rationale: खोजने, जाँचने या पूछताछ करने के निष्क्रिय भाव को न्यायिक और प्रकाशनात्मक संदर्भ में स्वाभाविक हिन्दी दी गई है।
- source_word: መላእክት
  choice: स्वर्गदूतों
  rationale: 1 हनोक के प्रकाशनात्मक और न्याय-संबंधी संदर्भ में यह सामान्यतः स्वर्गीय प्राणियों को दर्शाता है; अन्य शाब्दिक संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: እለ አርደእዎሙ
  choice: जिन्होंने … सहायता की
  rationale: क्रिया ረድአ से सहायता करने का अर्थ लिया गया है, न कि उत्पीड़न करने का।
- source_word: ለእለ የሀይዱክሙ
  choice: तुम्हें लूटनेवालों की
  rationale: ሀየደ का अर्थ लूटना, छीनना या डाका डालना है; इसे ‘मार्ग से भटकाना’ नहीं समझा गया।
theological_decisions:
- issue: መላእክት का आशय स्वर्गदूत है या मानवीय दूत/अधिकारी
  choice: मुख्य पाठ में ‘स्वर्गदूत’
  alternative: ‘दूत’ या प्रसंगानुसार ‘अधिकारी’
  rationale: हनोक साहित्य के ब्रह्मांडीय न्याय-संदर्भ में ‘स्वर्गदूत’ प्राथमिक अर्थ है, पर शब्द की व्यापक अर्थ-सीमा को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: प्रकट करनेवाले का कर्ता और प्रकट की जानेवाली वस्तु
  choice: ‘वह उसे तुम्हारे सामने प्रकट करेगा’ कहकर अस्पष्टता बनाए रखी गई
  alternative: ‘वह तुम्हें दिखाएगा’ या ‘वह तुम्हारे सामने प्रकट होगा’
  rationale: गीज़ पाठ का यह अंश कठिन है और निकट संदर्भ में कर्ता स्पष्ट रूप से नामित नहीं है; इसलिए किसी विशिष्ट ईशशास्त्रीय पहचान को पाठ में नहीं जोड़ा गया।
- issue: अंतिम खंड में सहायता और लूट का संबंध
  choice: लूटनेवालों की सहायता करनेवाले लोग
  alternative: वाक्य-संबंध को अधिक सामान्य बनाकर लूट में सहभागी लोग
  rationale: दोनों क्रियाओं के संशोधित और स्रोत-संगत अर्थों को बनाए रखते हुए उनके व्याकरणिक संबंध को यथासंभव सीधा रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘छानबीन की जाएगी’ स्रोत के निष्क्रिय जाँच-संबंधी भाव को स्वाभाविक हिन्दी में व्यक्त करता है। कठिन गीज़ खंडों को संप्रदायगत व्याख्या से नहीं भरा गया, बल्कि पादटिप्पणियों में वास्तविक विकल्प सुरक्षित रखे गए हैं।
