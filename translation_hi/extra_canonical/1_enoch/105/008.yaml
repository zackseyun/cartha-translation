base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/008.yaml
  text: And now[a], I show you that light and darkness, day and night[b], see all your sins.
translation:
  language: hi
  text: और अब मैं तुम्हें यह दिखाता हूँ कि[b] प्रकाश और अन्धकार, दिन और रात,[a] तुम्हारे सारे पाप देखते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पंक्ति प्रकाश और अन्धकार, दिन और रात को ऐसे साक्षियों के रूप में चित्रित करती है जो हर पाप देखते हैं। इसमें ‘खुले और छिपे रूप में, हर समय’ का भाव भी निहित हो सकता है।
    reason: cultural_note
  - marker: b
    text: या, “मैं तुम्हें यह दिखाता हूँ, क्योंकि प्रकाश और अन्धकार…”
    reason: translation_alternative
lexical_decisions:
- source_word: ወይ እዜኒ
  choice: और अब
  rationale: यह वर्तमान घोषणा की ओर ले जाने वाला कालसूचक और प्रसंगसूचक पद है; ‘और अब’ आधुनिक हिन्दी में स्वाभाविक रूप से इस संक्रमण को बनाए रखता है।
- source_word: አነ አርእየክሙ
  choice: मैं तुम्हें यह दिखाता हूँ
  rationale: मूल क्रिया का अर्थ किसी को देखने योग्य बनाना या दिखाना है। ‘दिखाता हूँ’ दर्शनीय और प्रकाशनात्मक भाव को बनाए रखता है; ‘यह’ हिन्दी वाक्य में आगे आने वाले उपवाक्य को स्वाभाविक ढंग से जोड़ता है।
- source_word: እስመ
  choice: कि
  rationale: दिखाने की क्रिया के बाद यह पद कथनात्मक पूरक उपवाक्य आरम्भ करता है। इसलिए ‘कि’ सबसे स्वाभाविक है, यद्यपि कारणसूचक ‘क्योंकि’ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: ብርሃን ወጽልመት
  choice: प्रकाश और अन्धकार
  rationale: विलोम युग्म को सीधे रखा गया है ताकि सृष्टिगत साक्षी की सर्वव्यापक छवि बनी रहे।
- source_word: ዕለት ወሌሊት
  choice: दिन और रात
  rationale: यह दूसरा समग्रतासूचक युग्म निरन्तरता और हर समय की धारणा व्यक्त करता है।
- source_word: ይሬእዩ
  choice: देखते हैं
  rationale: बहुवचन कर्ताओं के अनुरूप साधारण वर्तमान काल मूल के निरन्तर या सामान्य सत्य वाले भाव और मानवीकृत साक्षी-छवि को बनाए रखता है।
- source_word: ኵሎ ኃጢአትክሙ
  choice: तुम्हारे सारे पाप
  rationale: यह बहुवचन अपराधों तथा ኵሎ की समग्रता—दोनों को स्पष्ट और सहज हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: क्या प्रकाश, अन्धकार, दिन और रात केवल समय या परिस्थितियों के संकेत हैं, अथवा सक्रिय साक्षी हैं?
  choice: वाक्य में प्रकाश, अन्धकार, दिन और रात को श्रोताओं के सभी पाप देखते हुए प्रस्तुत किया गया है।
  alternative: इसे ‘खुले और छिपे रूप में, हर समय किए गए पाप’ का मुहावरेदार संकेत माना जा सकता है।
  rationale: गीज़ में ‘देखते हैं’ का सबसे स्वाभाविक कर्ता इससे पहले आए चारों संज्ञापद हैं। इसलिए अपोकैलिप्टिक सृष्टि-साक्षी की छवि को किसी सामान्य मुहावरे में बदलने के बजाय ज्यों का त्यों रखा गया है।
- issue: እስመ का कथनात्मक या कारणसूचक सम्बन्ध
  choice: 'इसे ‘कि’ के रूप में लिया गया है: वक्ता बताता है कि प्रकाश आदि पाप देखते हैं।'
  alternative: ‘मैं तुम्हें दिखाता हूँ, क्योंकि प्रकाश और अन्धकार… देखते हैं।’
  rationale: दिखाने या बोध कराने की क्रिया के बाद እስመ कथनात्मक पूरक सूचक हो सकता है और यहाँ वाक्य-संरचना उसी अर्थ में अधिक सहज है; वास्तविक वैकल्पिक सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर अपोकैलिप्टिक सृष्टि-साक्षी की गरिमापूर्ण और असामान्य छवि को सरल व्याख्या में नहीं बदला गया। ‘तुम्हें’ बहुवचन श्रोताओं को स्वाभाविक हिन्दी में सम्बोधित करता है।
