  yaml_path: translation/extra_canonical/1_enoch/105/001.yaml
  text: The glory of the Great One[b][a], and your names shall be written before the glory of the Great One.
translation:
  language: hi
  text: महान जन की महिमा[a], और तुम्हारे नाम महान जन की महिमा के सामने लिखे जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीइज़ पाठ में “महान जन की महिमा … महान जन की महिमा के सामने” पद दोहराया गया है। यह पुनरावृत्ति अनुवाद में भी रखी गई है। एक पुराना वैकल्पिक पाठन आरंभ को “उसकी महिमा महान है” समझता है, पर गीइज़ की रचना अधिक स्वाभाविक रूप से “महान जन की महिमा” अर्थ देती है।
