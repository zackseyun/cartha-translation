lexical_decisions:
- source_word: ስብሐቲሁ
  choice: उसकी महिमा / महिमा
  rationale: यह शब्द ‘महिमा’, ‘स्तुति’ या ‘तेज’ का अर्थ दे सकता है। नामों के उसके सामने लिखे जाने की स्वर्गीय छवि के कारण ‘महिमा’ सबसे उपयुक्त है और पद में इसकी पुनरावृत्ति भी सुरक्षित रहती है।
- source_word: ለዐቢይ
  choice: उस महान की
  rationale: यहाँ विशेषण संज्ञा की तरह एक आदरपूर्ण उपाधि के रूप में प्रयुक्त है। ‘उस महान की’ हिन्दी में इस दिव्य उपाधि को बनाए रखता है, बिना ‘प्रभु’ जैसा कोई ऐसा पद जोड़ने के जो मूल में नहीं है।
- source_word: ወእስማቲከሙ
  choice: और तुम्हारे नाम
  rationale: मूल रूप में ‘नाम’ और संबोधित व्यक्ति—दोनों बहुवचन हैं; इसलिए बहुवचन रखा गया है।
- source_word: ይጸሐፍ
  choice: लिखे जाएँगे
  rationale: क्रिया का मूल अर्थ ‘लिखना’ है। प्रसंग में यह आश्वासन या प्रतिज्ञा व्यक्त करती है, इसलिए हिन्दी का भविष्यकालीन कर्मवाच्य स्वाभाविक है।
- source_word: በቅድመ
  choice: के सामने
  rationale: इसका अर्थ ‘के आगे’ अथवा ‘की उपस्थिति में’ है। ‘के सामने’ सहज हिन्दी में स्थान और उपस्थिति—दोनों भावों को बनाए रखता है।
theological_decisions:
- issue: ስብሐቲሁ को ‘महिमा’ या ‘स्तुति/तेज’ के रूप में प्रस्तुत करना
  choice: महिमा
  alternative: स्तुति; तेज
  rationale: नामों का इस वास्तविकता के सामने लिखा जाना स्वर्गीय उपस्थिति और प्रताप की ओर संकेत करता है। ‘महिमा’ प्रलयदर्शी बिंब को बनाए रखता है और इसे केवल स्तुति के कार्य तक सीमित नहीं करता।
- issue: आरंभिक वाक्यांश की व्याकरणिक व्याख्या
  choice: ‘उस महान की महिमा’—संबंधसूचक वाक्यांश
  alternative: ‘उसकी महिमा महान है’—विधेयात्मक वाक्य
  rationale: ስብሐቲሁ ለዐቢይ गीइज़ की पूर्वसूचक सर्वनामयुक्त संबंधसूचक रचना है; अतः आरंभ और अंत में एक ही वाक्यांश ‘उस महान की महिमा’ रखा गया है। फिर भी पुराने/वैकल्पिक पाठन को टिप्पणी में दर्ज किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। ‘उस महान’ को दिव्य उपाधि की तरह रखा गया है; मूल में न होने के कारण ‘प्रभु’ या कोई संप्रदाय-विशिष्ट पद नहीं जोड़ा गया। आरंभ का अपूर्ण-सा, गंभीर वाक्यांश मूल की संरचना और उसकी वास्तविक अस्पष्टता को सुरक्षित रखता है।
