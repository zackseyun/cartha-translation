base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/011.yaml
  text: And when they write all the words truthfully in their languages[a], and neither alter nor omit anything from my words[d][c][b], but write down everything truthfully—all the former things—
translation:
  language: hi
  text: और जब वे सभी वचनों को अपनी-अपनी भाषाओं में ठीक-ठीक लिखें[a], और मेरे वचनों में न तो कोई बदलाव करें, न उनमें से कुछ भी हटाएँ, बल्कि सब कुछ ठीक-ठीक लिखें—पहले की सभी बातें[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनकी जीभों पर/में”; लिखने के इस प्रसंग में इसका अर्थ “उनकी भाषाओं में” है।
    reason: lexical_alternative
  - marker: b
    text: यह गीइज़ पदबंध संक्षिप्त है। इसका अनुवाद “सभी पहले की बातें” या, प्रसंग के अनुसार, “वह सब जो पहले लिखा गया था” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ወሶበሰ፡
  choice: और जब
  rationale: यह पद को पिछले प्रसंग से जोड़ते हुए कालवाचक उपवाक्य आरम्भ करता है; गीइज़ की अपूर्ण वाक्य-संरचना भी बनी रहती है।
- source_word: ኵሎ፡ ነገራተ፡
  choice: सभी वचनों को
  rationale: ነገራተ कर्मकारक बहुवचन है और यहाँ लिखित कथनों को सूचित करता है; इसमें इस स्थान पर प्रथम पुरुष प्रत्यय नहीं है, इसलिए 'मेरे' नहीं जोड़ा गया।
- source_word: ይጽሐፉ፡
  choice: वे ... लिखें
  rationale: क्रिया सक्रिय बहुवचन है और आगे की सक्रिय क्रियाओं के समान कर्ता को बनाए रखती है।
- source_word: በርትዕ፡
  choice: सच्चाई से
  rationale: यह शुद्धता, ठीकपन और सत्यनिष्ठा का भाव रखता है; प्रसंग में पाठ के विश्वासयोग्य संप्रेषण को व्यक्त करता है।
- source_word: ዲበ፡ ልሳናቲሆሙ፡
  choice: अपनी-अपनी भाषाओं में
  rationale: शाब्दिक अर्थ 'उनकी जीभों पर/में' है, पर लिखने के प्रसंग में आशय उनकी विभिन्न भाषाएँ हैं। 'अपनी-अपनी' बहुभाषी वितरण को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ወኢይዌልጡ፡
  choice: न तो कोई बदलाव करें
  rationale: क्रिया बदलने या विकृत करने को सूचित करती है; यह चयन पाठ में परिवर्तन न करने की बात स्वाभाविक हिन्दी में कहता है।
- source_word: ወኢየሐጽጹ፡
  choice: न उनमें से कुछ घटाएँ
  rationale: मूल क्रिया घटाने या निकालने का भाव देती है; यह बदलाव के साथ संतुलित निषेध बनाती है।
- source_word: እምነገራቲየ፡
  choice: मेरे वचनों में ... उनमें से
  rationale: यहाँ प्रथम पुरुष प्रत्यय स्पष्ट है। हिन्दी वाक्य-विन्यास में 'मेरे वचनों में बदलाव' और 'उनमें से घटाएँ' स्रोत के संबंध को सहजता से व्यक्त करते हैं।
- source_word: አላ፡
  choice: बल्कि
  rationale: दो निषेधों के विपरीत विश्वासयोग्य लेखन का सकारात्मक विकल्प प्रस्तुत करता है।
- source_word: ኵሎ፡ በርትዕ፡ ይጽሐፉ፡
  choice: सब कुछ सच्चाई से लिखें
  rationale: मूल की पुनरुक्ति को बनाए रखते हुए लेखन की संपूर्णता और सत्यनिष्ठा पर बल देता है।
- source_word: ኵሎ፡ ዘቀዳሚ፡
  choice: वे सभी बातें जो पहले की हैं
  rationale: संक्षिप्त गीइज़ पदबंध का निकट अर्थ 'सभी पूर्व की बातें' है; इसमें 'लिखी गई' जोड़ना प्रसंगगत होगा, पर मूल से अधिक स्पष्टता थोपेगा।
theological_decisions:
- issue: हनोक के वचनों की विश्वासयोग्य बहुभाषी संप्रेषणा
  choice: पद को लिखित वचनों को विभिन्न भाषाओं में बिना परिवर्तन या घटाव के पहुँचाने के निर्देश के रूप में प्रस्तुत किया गया है।
  alternative: इसे सामान्य नैतिक सत्यवादिता या जीभ से मौखिक घोषणा के विषय में समझा जा सकता है।
  rationale: बार-बार प्रयुक्त 'लिखें', साथ में बदलने और घटाने के निषेध, लिखित पाठ की विश्वासयोग्य संप्रेषणा की ओर संकेत करते हैं; फिर भी 'जीभों' का शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- issue: अंतिम पदबंध की संक्षिप्तता
  choice: '''वे सभी बातें जो पहले की हैं'' रखकर मूल की अस्पष्टता बनाए रखी गई है।'
  alternative: '''वह सब जो पहले लिखा गया था'' प्रसंग के आधार पर सम्भव है।'
  rationale: गीइज़ में अंतिम पदबंध के भीतर 'लिखा गया' क्रिया स्पष्ट रूप से नहीं है; इसलिए उसे मुख्य पाठ में जोड़ना अनावश्यक व्याख्यात्मक विस्तार होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। सक्रिय बहुवचन क्रियाओं और स्रोत के अधूरे, अगले प्रसंग की ओर बढ़ते वाक्य को सुरक्षित रखने के लिए अंत में दीर्घ डैश रखा गया है। 'वचन' साहित्यिक-धार्मिक प्रसंग में स्वाभाविक है, पर इसे किसी विशेष सम्प्रदायगत तकनीकी अर्थ में नहीं लिया गया।
