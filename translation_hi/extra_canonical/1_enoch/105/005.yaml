base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/005.yaml
  text: What will you have to do? You will not have to hide on the day of the great judgment[a], and you will not be found as sinners[c][b]; and everlasting judgment will be upon you for all the generations of the world.
translation:
  language: hi
  text: तुम्हें क्या करना होगा? महान न्याय के दिन तुम्हें छिपना नहीं पड़ेगा[c], और तुम पापियों के रूप में नहीं पाए जाओगे[a]; और अनन्त न्याय संसार की सारी पीढ़ियों के लिए तुमसे दूर रहेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तुम पापियों के रूप में नहीं पाए जाओगे’ वाला उपवाक्य पाठ और वाक्य-विन्यास की दृष्टि से कठिन है। कुछ व्याख्याकार प्रसंग के आधार पर इसका अर्थ ‘तुम पापी पाए जाओगे’ या इसी प्रकार लेते हैं; यहाँ उपलब्ध गीइज़ पाठ का नकार सुरक्षित रखा गया है।
    reason: textual_variant
  - marker: b
    text: ‘तुमसे दूर रहेगा’ के पीछे का गीइज़ पद अधिक शाब्दिक रूप से ‘तुमसे होगा/रहेगा’ है। इस पद का सटीक संबंध विवादित है; निकट के सांत्वनात्मक प्रसंग के कारण यहाँ अलगाव या दूरी का अर्थ अपनाया गया है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘महान न्याय के दिन तुम छिपाए नहीं जाओगे।’ गीइज़ क्रियारूप आत्मवाचक (‘छिपना’) या कर्मवाच्य (‘छिपाया जाना’) अर्थ दे सकता है।
    reason: translation_alternative
lexical_decisions:
- source_word: ምንተ፡ ሀለወክሙ፡ ትግበሩ
  choice: तुम्हें क्या करना होगा?
  rationale: शाब्दिक संरचना ‘तुम्हारे लिए क्या है कि तुम करो?’ जैसी संक्षिप्त और अलंकारिक है। आधुनिक हिन्दी में यह प्रश्न उपलब्ध उपाय या किए जाने वाले काम के बारे में स्वाभाविक ढंग से व्यक्त होता है।
- source_word: አኮ፡ ትትኀብኡ
  choice: तुम्हें छिपना नहीं पड़ेगा
  rationale: क्रिया का रूप कर्मवाच्य अथवा आत्मवाचक अर्थ दे सकता है। प्रसंग में ‘छिपने की आवश्यकता नहीं होगी’ सहज है, पर वैकल्पिक ‘तुम छिपाए नहीं जाओगे’ को टिप्पणी में सुरक्षित रखा गया है।
- source_word: በዕለተ፡ ኵነኔ፡ ዐቢይ
  choice: महान न्याय के दिन
  rationale: यह प्रलयकालीन न्याय के निश्चित दिन को सूचित करने वाली पदावली है; ‘महान न्याय’ उसकी गंभीरता बनाए रखता है।
- source_word: ወኢትትረከቡ፡ ከመ፡ ኃጥኣን
  choice: और तुम पापियों के रूप में नहीं पाए जाओगे
  rationale: नकार, ‘पाया जाना’ और तुलनात्मक पद ‘पापियों के रूप में’ को बिना पाठ-संशोधन के निकटता से रखा गया है, यद्यपि अगले वाक्य के साथ इसका संबंध कठिन है।
- source_word: ኵነኔ፡ እንተ፡ ለዓለም
  choice: सदा का न्याय
  rationale: मूलतः ‘वह न्याय जो सदा के लिए है’; ‘सदा का न्याय’ अवधि को व्यक्त करता है और ‘दंडाज्ञा’ जैसा अधिक व्याख्यात्मक शब्द नहीं जोड़ता।
- source_word: ትከዉን፡ እምኔክሙ
  choice: तुम पर रहेगा
  rationale: पूर्वसर्ग का प्रत्यक्ष अर्थ ‘तुमसे/तुम्हारी ओर से’ हो सकता है, किंतु दंडात्मक न्याय के वाक्य में ‘तुम पर’ एक संभावित प्रसंगगत अर्थ है। वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
- source_word: ለእሉ፡ ትዉልደ፡ ዓለም
  choice: संसार की सभी पीढ़ियों तक
  rationale: यह संसार अथवा युग की पीढ़ियों में फैली दीर्घ अवधि का संकेत देता है। हिन्दी में ‘सभी’ निहित व्यापकता को स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: ‘तुम पापियों के रूप में नहीं पाए जाओगे’ में नकार
  choice: प्राप्त गीइज़ पाठ का नकार बनाए रखा गया
  alternative: ‘तुम पापी पाए जाओगे’ अथवा ‘तुम पापियों के सिवा और कुछ न पाए जाओगे’
  rationale: नकार आसपास के न्याय-वचन के साथ तनाव उत्पन्न करता है, पर उसे चुपचाप हटाना पाठ-संशोधन होगा। मुख्य पाठ मूल साक्ष्य के निकट है और कठिनाई पादटिप्पणी में बताई गई है।
- issue: እምኔክሙ के कारण न्याय का संबंध
  choice: ‘तुम पर रहेगा’
  alternative: ‘तुमसे दूर रहेगा’ या अधिक शाब्दिक ‘तुमसे होगा’
  rationale: रूपतः ‘से’ का अर्थ स्पष्ट है, जबकि वाक्य में उसका संबंध विवादास्पद है। न्याय की प्रतिकूल प्रयुक्ति के अनुसार मुख्य पाठ चुना गया है, लेकिन सांत्वनात्मक प्रसंग पर आधारित विपरीत समझ को पादटिप्पणी में खुलकर रखा गया है।
- issue: छिपने वाली क्रिया की वाच्यता
  choice: आवश्यकता-सूचक आत्मवाचक अर्थ—‘तुम्हें छिपना नहीं पड़ेगा’
  alternative: कर्मवाच्य—‘तुम छिपाए नहीं जाओगे’
  rationale: त-रूप आत्मवाचक और कर्मवाच्य दोनों दिशा दे सकता है। आधुनिक हिन्दी में आत्मवाचक अर्थ प्रसंगानुकूल और स्वाभाविक है, जबकि विकल्प को छिपाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण रखी गई है। ‘न्याय’, ‘पापी’ और ‘पीढ़ियाँ’ जैसे प्रचलित धार्मिक शब्द प्रयुक्त हैं। मूल पाठ की दो प्रमुख कठिनाइयों—नकारयुक्त ‘पापियों के रूप में नहीं’ और እምኔክሙ का संबंध—को किसी एक धर्मवैचारिक निष्कर्ष से दबाने के बजाय पादटिप्पणियों में पारदर्शी रखा गया है।
