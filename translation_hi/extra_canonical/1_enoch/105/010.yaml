base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/010.yaml
  text: 'And now I know this mystery: that many sinners will alter the word of righteousness and pervert it[a], and speak evil words and lie, and they will devise great fabrications[d][c][b], and they will write books concerning their own words.'
translation:
  language: hi
  text: 'और अब मैं यह रहस्य जानता हूँ: बहुत-से पापी धार्मिकता के वचन को बदल देंगे और भटक जाएँगे[a]; वे बुरी बातें कहेंगे और झूठ बोलेंगे, बड़ी-बड़ी मनगढ़ंत रचनाएँ गढ़ेंगे[b], और अपनी ही बातों के बारे में पुस्तकें लिखेंगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ दूसरी गीज़ क्रिया का पाठ और अर्थ कठिन है। इसका अर्थ ‘वे मुड़ जाएँगे’ भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या ‘बड़ी-बड़ी कल्पित बातें/रचनाएँ बनाएँगे।’ मूल अभिव्यक्ति बनाई या रची हुई चीज़ों को सूचित कर सकती है; झूठ के प्रसंग में ‘मनगढ़ंत रचनाएँ’ चुना गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: አአምር
  choice: मैं ... जानता हूँ
  rationale: यह क्रिया जानने या समझने का बोध कराती है। ‘अब’ के साथ वर्तमान काल भविष्यसूचक घोषणा के स्वाभाविक आरंभ को बनाए रखता है।
- source_word: ምሥጢር
  choice: रहस्य
  rationale: प्रकाशनात्मक साहित्य के संदर्भ में यह छिपे हुए, अब प्रकट किए गए ज्ञान का भाव व्यक्त करता है।
- source_word: ነገረ ርትዕ
  choice: धार्मिकता का वचन
  rationale: यह स्रोत के संक्षिप्त संबंधवाचक पदबंध को बनाए रखता है और इसे केवल ‘सच्ची शिक्षा’ कहकर अर्थ को सीमित नहीं करता।
- source_word: ይመይጡ
  choice: बदल देंगे
  rationale: क्रिया बहुवचन कर्तृवाच्य है; इसका कर्ता ‘बहुत-से पापी’ और कर्म ‘धार्मिकता का वचन’ है। इसलिए निष्क्रिय अर्थ ‘उपेक्षित होगा’ नहीं अपनाया गया।
- source_word: የዐልዉ
  choice: उसे विकृत कर देंगे
  rationale: संदर्भ इसे पहले कर्म, ‘धार्मिकता के वचन’, के साथ जोड़ने की अनुमति देता है; किंतु पाठ कठिन होने के कारण वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ነገራተ እኩያተ
  choice: बुरी बातें
  rationale: इसके बाद झूठ बोलने और पुस्तकें लिखने का उल्लेख है, इसलिए वाचिक सामग्री पर बल देने वाला सहज हिन्दी पद चुना गया।
- source_word: ይሐስዉ
  choice: झूठ बोलेंगे
  rationale: यह आरोप की सीधी और स्पष्ट शक्ति बनाए रखता है।
- source_word: ይፈጥሩ ፍጥረተ ዐቢየተ
  choice: बड़ी-बड़ी मनगढ़ंत रचनाएँ गढ़ेंगे
  rationale: मूल में बनाने या रचने की पुनरुक्ति है। झूठ और दुष्ट वाणी के संदर्भ में ‘मनगढ़ंत’ नकारात्मक आशय व्यक्त करता है, जबकि ‘रचनाएँ’ साहित्यिक संदर्भ से मेल खाता है।
- source_word: መጻሕፍተ ይጽሐፉ ዲበ ነገራቲሆሙ
  choice: अपनी ही बातों के विषय में पुस्तकें लिखेंगे
  rationale: यह पुस्तकों को पापियों की अपनी पूर्वोक्त बातों से स्पष्ट रूप से जोड़ता है और पुस्तक-लेखन की अपने-आप में निंदा करने का अर्थ नहीं देता।
theological_decisions:
- issue: धार्मिकता के वचन के साथ होने वाली क्रिया
  choice: पापी उसे बदलेंगे और विकृत करेंगे
  alternative: धार्मिकता का वचन उपेक्षित होगा और बहुत-से पापी भटक जाएँगे
  rationale: गीज़ वाक्य-विन्यास में बहुवचन सक्रिय क्रिया का कर्ता ‘बहुत-से पापी’ और कर्म ‘धार्मिकता का वचन’ है। फिर भी दूसरी कठिन क्रिया की अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: पुस्तकें लिखने की निंदा का दायरा
  choice: निंदा उन पुस्तकों की है जो पापियों की अपनी झूठी बातों पर आधारित हैं
  alternative: यह सभी अतिरिक्त पुस्तकों के लेखन की सामान्य निंदा है
  rationale: अंतिम उपवाक्य व्याकरण और प्रसंग दोनों में पहले आए झूठ, बुरी बातों और मनगढ़ंत रचनाओं से जुड़ा है; इसलिए लेखन को अपने-आप में दोषी नहीं ठहराया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। ‘धार्मिकता का वचन’ प्रकाशनात्मक पदावली और मूल संबंध को सुरक्षित रखता है; बाकी वाक्य में अत्यधिक संस्कृतनिष्ठ शब्दों से बचा गया है।
