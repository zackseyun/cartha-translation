base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/004.yaml
  text: Hope[a], and do not abandon your hope, for great joy will be yours[b], like the angels of heaven.
translation:
  language: hi
  text: आशा रखो और अपनी आशा मत छोड़ो, क्योंकि तुम्हें बड़ा आनन्द मिलेगा, स्वर्ग के दूतों के समान।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘स्वर्ग के दूतों के समान’: तुलना स्पष्ट है, पर यह ठीक-ठीक नहीं बताया गया कि तुलना उनके आनन्द, उनकी धन्य दशा, या उनके स्वर्गीय प्रतिफल से है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተስፈዉ
  choice: आशा रखो
  rationale: यह आशा या भरोसा रखने की सीधी आज्ञा है। हिन्दी में ‘आशा रखो’ स्वाभाविक है और ऐसा कोई कर्म नहीं जोड़ता जो मूल में नहीं है।
- source_word: ወኢትኅድጉ ተስፋክሙ
  choice: और अपनी आशा मत छोड़ो
  rationale: निषेधात्मक आज्ञा तथा मूल में ‘आशा’ की पुनरावृत्ति दोनों सुरक्षित रखी गई हैं। ‘मत छोड़ो’ त्याग देने का भाव स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: እስመ
  choice: क्योंकि
  rationale: यह पहले दिए गए उपदेश का आधार बताने वाला कारणसूचक संयोजक है।
- source_word: ትከዉኑ ለክሙ
  choice: तुम्हें ... मिलेगा
  rationale: भविष्यकालीन क्रिया और सम्प्रदानवाचक सर्वनाम को स्वाभाविक हिन्दी में लाभ अथवा प्राप्ति के रूप में व्यक्त किया गया है।
- source_word: ፍሥሓ ዐቢይ
  choice: महान आनन्द
  rationale: संज्ञा और विशेषण का सीधा अनुवाद है; यह प्रतिज्ञा के गरिमापूर्ण स्वर को बनाए रखता है।
- source_word: ከመ መላእክተ ሰማይ
  choice: स्वर्ग के दूतों के समान
  rationale: मूल की स्पष्ट तुलना को बनाए रखा गया है और यह नहीं जोड़ा गया कि मनुष्य स्वर्गदूत बन जाएंगे।
theological_decisions:
- issue: स्वर्ग के दूतों से तुलना का आशय
  choice: पाठकों को मिलने वाले आनन्द या उनकी भावी धन्य दशा की तुलना स्वर्ग के दूतों से की गई है, पर तुलना का सटीक बिंदु अनिर्धारित रखा गया है।
  alternative: धर्मी स्वर्गदूत बन जाएंगे, अथवा केवल उनके साथ मिलकर आनन्द करेंगे।
  rationale: गीज़ पाठ में साधारण तुलनात्मक पदबंध है; वह न तो स्वर्गदूतों में रूपान्तरण कहता है, न स्पष्ट रूप से साथ आनन्द करने की बात। इसलिए अनुवाद तुलना को सुरक्षित रखता है, पर उसकी तात्त्विक व्याख्या निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘आशा’ की मूल पुनरावृत्ति जानबूझकर सुरक्षित है। ‘स्वर्ग के दूत’ सामान्य पाठक के लिए स्पष्ट है और किसी विशिष्ट सांप्रदायिक शब्दावली को नहीं थोपता।
