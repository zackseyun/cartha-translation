base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/002.yaml
  text: Hope[a], for formerly you were put to shame by evil and by affliction; but now you will shine like the light of heaven, you will shine and be seen[c][b], and the portals of heaven will be opened for you.
translation:
  language: hi
  text: आशा रखो, क्योंकि पहले बुराई और क्लेश के कारण[a] तुम्हारा अपमान हुआ था; पर अब तुम आकाश के प्रकाश के समान चमकोगे; तुम चमकोगे और दिखाई दोगे[b], और आकाश के द्वार[c] तुम्हारे लिए खोल दिए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘बुराई और दुःख के द्वारा’ अथवा ‘दुष्टता और पीड़ा के कारण’ भी हो सकता है। गीज़ पाठ यह स्पष्ट नहीं करता कि बुराई व्यक्तिगत थी, सामाजिक थी या परिस्थितिजन्य।
    reason: lexical_alternative
  - marker: b
    text: या ‘प्रकट होगे’। मूल रूप का अर्थ ‘दिखाई देना’ अथवा ‘प्रकट होना’ हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यह 1 हनोक के विश्व-वर्णन में आकाश के खुलने का बिंब है। पाठ यह नहीं बताता कि इन द्वारों से क्या आता है अथवा सम्बोधित लोग इनमें प्रवेश करते हैं या नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: ተስፈዉ
  choice: आशा रखो
  rationale: बहुवचन आज्ञार्थक प्रोत्साहन को सहज और गरिमापूर्ण आधुनिक हिन्दी में सीधे व्यक्त करता है।
- source_word: ኃሠርክሙ
  choice: तुम्हें लज्जित होना पड़ा था
  rationale: निष्क्रिय भाव तथा सामाजिक अपमान—दोनों को सुरक्षित रखता है; यह केवल आंतरिक शर्म का संकेत नहीं देता।
- source_word: በእኩይ ወበምራኅ
  choice: बुराई और क्लेश के कारण
  rationale: दोनों संक्षिप्त पदों को समानांतर रखा गया है। ‘के कारण’ प्रसंगगत सम्बन्ध बताता है, जबकि पादटिप्पणी कारक अथवा परिस्थितिजन्य अर्थ की अनिश्चितता सुरक्षित रखती है।
- source_word: ትበርሁ
  choice: चमकोगे
  rationale: मूल में क्रिया की पुनरावृत्ति है, इसलिए हिन्दी में भी ‘चमकोगे’ दोहराया गया है।
- source_word: ብርሃነ ሰማይ
  choice: आकाश का प्रकाश
  rationale: सम्बन्धवाचक संरचना और विश्वात्मक बिंब को ठोस रूप में बनाए रखता है।
- source_word: ትትረአዩ
  choice: दिखाई दोगे
  rationale: संभावित निष्क्रिय/आत्मवाचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे अनिवार्यतः ‘प्रकट किए जाओगे’ बनाने के।
- source_word: ኆኅተ ሰማይ
  choice: आकाश के द्वार
  rationale: ኆኅት का मूल अर्थ द्वार या प्रवेश-द्वार है और यह 1 हनोक के आकाशीय ब्रह्मांड-वर्णन के अनुकूल है; ‘झरोखे’ कहना स्रोत में निहित न होने वाला अलग बिंब जोड़ता।
- source_word: ይትረኀዉ ለክሙ
  choice: तुम्हारे लिए खोल दिए जाएँगे
  rationale: निष्क्रिय रूप और सम्बोधित धर्मियों के लिए प्राप्त आकाशीय पहुँच—दोनों पर ध्यान बनाए रखता है, कर्ता को अनावश्यक रूप से निर्दिष्ट नहीं करता।
theological_decisions:
- issue: आकाश के द्वार खुलने का आशय
  choice: आकाशीय द्वार धर्मियों के लिए खोले जाने के बिंब को ज्यों का त्यों रखा गया है।
  alternative: इसे स्वर्गीय आशीषों के बरसने या धर्मियों के स्वर्ग में प्रवेश करने की स्पष्ट प्रतिज्ञा मानना।
  rationale: गीज़ पाठ केवल इतना कहता है कि आकाश के द्वार उनके लिए खोले जाएँगे; वह न तो स्पष्ट रूप से बताता है कि उनमें से कुछ उतरेगा, न यह कि सम्बोधित लोग उनमें प्रवेश करेंगे।
- issue: बुराई और क्लेश से लज्जित होने का सम्बन्ध
  choice: मुख्य पाठ में ‘के कारण’ रखा गया है और पादटिप्पणी में वैकल्पिक कारक अर्थ दिया गया है।
  alternative: इसे केवल दुष्ट व्यक्तियों द्वारा सताव या केवल अपने पाप के कारण हुई लज्जा मानना।
  rationale: मूल पूर्वसर्ग दोनों सम्भावनाओं को समेट सकता है; अनुवाद किसी एक नैतिक या सामाजिक कारण को अंतिम नहीं ठहराता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, प्रत्यक्ष और गरिमापूर्ण रखी गई है। ‘आकाश’ से विश्वात्मक बिंब सुरक्षित रहता है; ‘द्वार’ स्रोत-पद और हनोक-साहित्य की ब्रह्मांडीय कल्पना के अधिक निकट है। समानांतर भविष्यकालीन क्रियाओं और ‘चमकोगे’ की पुनरावृत्ति को जानबूझकर बनाए रखा गया है।
