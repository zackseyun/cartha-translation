review_pass:
  verdict: revise
  source_fidelity: The repeated future verb for shining, the passive/reflexive sense of being seen, and the passive opening of heaven's portals are retained well. ‘आकाश के द्वार’ accurately represents the Ge'ez term for doors/gates/portals and appropriately preserves the Enochic cosmological image. However, ‘तुम्हें लज्जित होना पड़ा था’ can imply that the addressees themselves were obliged to feel shame, rather than that they underwent public disgrace. The source verb is better represented by ‘तुम्हारा अपमान हुआ था’ (or an explicitly passive equivalent).
  naturalness: The Hindi is modern, clear, and appropriately elevated. Replacing ‘तुम्हें लज्जित होना पड़ा था’ with ‘तुम्हारा अपमान हुआ था’ is more idiomatic and avoids the unintended nuance of compelled self-shame.
  terminology: ‘क्लेश,’ ‘प्रकाश,’ and ‘आकाश के द्वार’ suit the register. ‘आकाश’ is acceptable here for the cosmic sense of ሰማይ; the note correctly avoids claiming that the addressees necessarily enter through the opened portals.
  issues:
  - severity: medium
    issue: ‘तुम्हें लज्जित होना पड़ा था’ can mean ‘you had to be ashamed.’
    rationale: The Ge'ez verb conveys being shamed/disgraced. Hindi ‘लज्जित होना पड़ा’ risks locating the shame primarily in the subjects’ internal response rather than in disgrace inflicted or suffered.
  revised_text: आशा रखो, क्योंकि पहले बुराई और क्लेश के कारण[a] तुम्हारा अपमान हुआ था; पर अब तुम आकाश के प्रकाश के समान चमकोगे; तुम चमकोगे और दिखाई दोगे[b], और आकाश के द्वार[c] तुम्हारे लिए खोल दिए जाएँगे।
