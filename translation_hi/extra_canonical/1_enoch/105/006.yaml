base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/006.yaml
  text: And now[a], righteous ones, do not fear when you see sinners growing strong and prospering in their ways. Do not become their companions, but keep far from their violence[b]; for you shall be companions of the good ones of heaven.
translation:
  language: hi
  text: और अब, हे धर्मी जनो, जब तुम पापियों को बलवान होते और अपने मार्गों में सफल होते देखो, तो मत डरो। उनके साथी मत बनो, बल्कि उनके अत्याचार से दूर रहो; क्योंकि तुम स्वर्ग के भले जनों के साथी होगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢትፍርሁ
  choice: मत डरो
  rationale: निषेधात्मक आज्ञा के सीधे और प्रोत्साहनपूर्ण स्वर को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ጻድቃን
  choice: हे धर्मियो
  rationale: सम्बोधन और विशिष्ट नैतिक समुदाय-संज्ञा दोनों को बनाए रखता है; ‘धर्मी जनो’ की अपेक्षा अधिक सहज है।
- source_word: ይጸንዑ
  choice: बलवान होते
  rationale: मूल में निहित दृढ़ या शक्तिशाली होने के भाव को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: ይደልዉ ፍኖቶሙ
  choice: अपने मार्गों में सफल होते
  rationale: दृश्य सफलता और जीवन-आचरण के ‘मार्ग’ रूपक दोनों को सुरक्षित रखता है।
- source_word: ሱቱፋነ
  choice: सहभागी
  rationale: पापियों के साथ निषिद्ध और स्वर्ग के भले जनों के साथ प्रतिज्ञात संबंध के समानांतर प्रयोग को दोनों स्थानों पर एक ही शब्द से बनाए रखता है।
- source_word: ግፍዐ
  choice: अत्याचार
  rationale: यह पद हिंसक अन्याय, उत्पीड़न या अत्याचार का अर्थ दे सकता है; प्रसंग में ‘अत्याचार’ व्यापक और स्वाभाविक हिन्दी विकल्प है।
- source_word: ኄራነ ሰማይ
  choice: स्वर्ग के भले जनों
  rationale: ኄራነ को ኄር (‘भला/अच्छा’) के बहुवचन संबंध-रूप के रूप में ग्रहण करता है; इसे ‘स्वर्गीय सेना’ कहना स्रोत की नैतिक समानता को खो देगा।
theological_decisions:
- issue: अंतिम प्रतिज्ञा में स्वर्गीय समूह की पहचान
  choice: स्वर्ग के भले जन
  alternative: स्वर्गदूत; स्वर्ग की सेना
  rationale: गीज़ पद समूह को ‘भले जन’ कहता है, पर उनकी पहचान को केवल स्वर्गदूतों तक सीमित नहीं करता। यह अनुवाद नैतिक विरोध और संदर्भगत अस्पष्टता दोनों बनाए रखता है।
- issue: अंतिम क्रिया का काल और आशय
  choice: सहभागी होगे
  alternative: सहभागी बने रहोगे; सहभागी हो
  rationale: ትኩኑ का प्रसंगगत भाव प्रतिज्ञात्मक है; भविष्यकाल हिन्दी में चेतावनी और आश्वासन के संबंध को स्पष्ट रखता है, बिना सहभागिता का स्वरूप निर्धारित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘धर्मी’, ‘पापी’, ‘मार्ग’ और ‘सहभागी’ जैसे शब्द मूल के नैतिक तथा अपोकैलिप्टिक विरोध को बनाए रखते हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि संशोधित स्रोत-पाठ के अनुसार ‘स्वर्ग के भले जन’ स्पष्टतः अधिक उचित है; अंग्रेज़ी परत की पादटिप्पणियाँ इस पद से असंगत प्रतीत होती हैं।
