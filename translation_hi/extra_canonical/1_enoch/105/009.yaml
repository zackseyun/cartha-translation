base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/009.yaml
  text: Do not be wicked in your hearts[a], and do not lie, and do not alter the word of uprightness, and do not declare false the word of the Great Holy One, and do not account your idols as anything; for all your falsehood and all your uncleanness are not for righteousness[f][e][d][c][b], but for great sin.
translation:
  language: hi
  text: अपने हृदयों में भटको मत[a], झूठ मत बोलो, और सत्यनिष्ठा के वचन को मत बदलो[b]। महान पवित्र वचन को झूठा मत ठहराओ[c], और अपनी मूर्तियों को कुछ मत समझो[d]; क्योंकि तुम्हारा सारा झूठ और तुम्हारी सारी अशुद्धता धार्मिकता के लिए नहीं, बल्कि बड़े पाप के लिए है[e]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भटको मत’ का अनुवाद ‘कुमार्ग पर मत जाओ’, ‘भूल मत करो’ या ‘पाप मत करो’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘सत्यनिष्ठा के वचन को मत बदलो’ का अर्थ ‘धार्मिकता के वचन को विकृत मत करो’ भी हो सकता है; यहाँ ‘वचन’ के लिए ‘बात’ भी संभव है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक पदक्रम ‘पवित्र महान वचन’ है। ‘वचन’ के लिए ‘बात’ या ‘मामला’ भी संभव है।
    reason: lexical_alternative
  - marker: d
    text: शाब्दिक भाव ‘अपनी मूर्तियों को मत गिनो/मत मानो’ है; आशय ‘उन्हें कुछ मत समझो’ या ‘उनका आदर मत करो’ हो सकता है।
    reason: lexical_alternative
  - marker: e
    text: अंतिम वाक्य का संबंध कुछ अस्पष्ट है। इसका अर्थ ‘धार्मिकता की ओर नहीं, बल्कि बड़े पाप की ओर ले जाते हैं’ या ‘धार्मिकता से नहीं, बल्कि बड़े पाप से संबंधित हैं’ भी समझा जा सकता है।
    reason: source_ambiguity
