- issue: ቅዱስ ዐቢይ को किसी सत्ता की उपाधि मानना या ‘वचन’ के विशेषण मानना
  choice: महान पवित्र जन के वचन
  alternative: महान पवित्र वचन / पवित्र महान वचन
  rationale: प्राप्त पाठ और परामर्श-परंपरा में इसे वचन के स्वामी की उपाधि के रूप में पढ़ना प्रसंगानुकूल है, पर गीज़ पदक्रम से विशेषणों को ‘वचन’ के साथ जोड़ने की वास्तविक संभावना बनी रहती है; इसलिए उसे पादटिप्पणी में दर्ज किया गया है।
- issue: अंतिम नैतिक विरोध को परिणामसूचक बनाना या मूल संबंधसूचक भाषा रखना
  choice: धार्मिकता के लिए नहीं, बल्कि बड़े पाप के लिए है
  alternative: धार्मिकता की ओर नहीं, बल्कि बड़े पाप की ओर ले जाते हैं
  rationale: मुख्य पाठ मूल की अस्पष्ट संबंधसूचक रचना के निकट रहता है और यह तय नहीं करता कि बात संबंध, उद्देश्य, स्वभाव या परिणाम की है।
