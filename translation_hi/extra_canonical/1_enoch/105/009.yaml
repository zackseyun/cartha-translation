  choice: झूठ न बोलो
  rationale: मूल क्रिया के साधारण ‘झूठ बोलना’ अर्थ का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: አትሚጥዋ ለነገረ ርትዕ
  choice: सत्यनिष्ठा के वचन को न बदलो
  rationale: ‘बदलना’ मूल क्रिया के परिवर्तन-विकृति अर्थ को समेटता है, जबकि ‘सत्यनिष्ठा’ नैतिक खरेपन को व्यक्त करती और अंतिम ‘धार्मिकता’ से शब्दगत भेद बनाए रखती है।
- source_word: ታሐስውዋ ለነገረ ቅዱስ ዐቢይ
  choice: महान पवित्र जन के वचन को झूठा न ठहराओ
  rationale: कारक/भाववाचक क्रिया को ‘झूठा ठहराना’ दिया गया है, जिससे पहले प्रयुक्त साधारण ‘झूठ बोलना’ से उसका अर्थपूर्ण भेद बना रहता है। विशेषण-समूह को मुख्य पाठ में एक महान पवित्र सत्ता के रूप में समझा गया है, पर वैकल्पिक पद-विभाजन पादटिप्पणी में सुरक्षित है।
- source_word: ትሕስብዋ ለጣዖትክሙ
  choice: अपनी मूर्तियों को कुछ न समझो
  rationale: ‘गिनना/मानना/समझना’ के संज्ञानात्मक अर्थ और प्रसंग में निहित मूर्तियों की निरर्थकता—दोनों को सहज हिन्दी में रखा गया है; ‘भरोसा मत रखो’ मूल से अधिक धर्मवैचारिक विस्तार होता।
- source_word: አኮነት ኵሉ ሐሰትክሙ ወኵሉ ርኩስነክሙ ለጽድቅ አላ ለኃጢአት ዐቢይ
  choice: तुम्हारा सारा झूठ और तुम्हारी सारी अशुद्धता धार्मिकता के लिए नहीं, बल्कि बड़े पाप के लिए है
  rationale: मूल के ‘धार्मिकता के लिए नहीं ... बड़े पाप के लिए’ विरोध को उसके कुछ असामान्य संबंधसूचक रूप सहित बनाए रखा गया है; ‘ले जाते हैं’ कहने से परिणाम या दिशा का अर्थ अधिक स्पष्ट, पर अधिक व्याख्यात्मक हो जाता।
