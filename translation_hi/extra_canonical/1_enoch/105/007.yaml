base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/007.yaml
  text: And because you sinners say[a], ‘We are not sought out[d][c][b], and all our sins are not written down’—all your sins are being written down every day.
translation:
  language: hi
  text: क्योंकि तुम पापी कहते हो, “तुम खोज-खबर नहीं लेते[a], और हमारे सारे पाप लिखे नहीं जाते,” पर वे हर दिन तुम्हारे सारे पाप लिख रहे हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल इथियोपिक में यहाँ क्रिया द्वितीय पुरुष बहुवचन है: “तुम खोजते/जाँच करते नहीं।” उसी उद्धरण में आगे “हमारे पाप” आता है, इसलिए संप्रेषित वाक्य-विन्यास असहज है। इसे “हमारी जाँच-पड़ताल नहीं होती” भी समझा गया है।'
    reason: textual_variant
  - marker: b
    text: अंतिम वाक्यांश का अक्षरशः अर्थ “वे तुम्हारे सारे पाप लिख रहे हैं” है। कर्ता की पहचान नहीं बताई गई है; इसे “तुम्हारे सारे पाप लिखे जा रहे हैं” भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: क्योंकि
  rationale: यह अगले कथन का कारण प्रस्तुत करता है और प्रसंग के तर्कपूर्ण प्रवाह को बनाए रखता है।
- source_word: ትብሉ፡ አንትሙ፡ ኃጥኣን
  choice: तुम पापी कहते हो
  rationale: क्रिया और सर्वनाम दोनों द्वितीय पुरुष बहुवचन हैं; इसलिए ‘पापी’ कहने वालों के लिए संबोधन/समानाधिकरण है।
- source_word: ኢትኅሥሡ
  choice: हमारी जाँच-पड़ताल नहीं होती
  rationale: क्रिया खोजने या न्यायिक ढंग से जाँच करने का भाव रखती है। उद्धृत दावे और उसके बाद के ‘हमारे पाप’ के साथ स्वाभाविक हिन्दी के लिए प्रथम पुरुष अर्थ दिया गया है, जबकि रूपगत कठिनाई को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ይጽሐፉ
  choice: लिखे नहीं जाते / लिख रहे हैं
  rationale: दोनों स्थानों पर लिखकर दर्ज करने की छवि बनाए रखी गई है; अंतिम प्रयोग सहायक क्रिया के साथ जारी वर्तमान क्रिया को व्यक्त करता है।
- source_word: ይጽሐፉ፡ ሀለዉ
  choice: वे ... लिख रहे हैं
  rationale: ሀለዉ यहाँ ‘देखो’ नहीं, बल्कि बहुवचन सहायक क्रिया है; इसलिए यह जारी क्रिया का भाव देता है।
- source_word: በኵሉ፡ ዕለት
  choice: हर दिन
  rationale: वितरणात्मक वाक्यांश का सहज हिन्दी रूप, जो लगातार दर्ज किए जाने का भाव रखता है।
theological_decisions:
- issue: पापों के लिखित अभिलेख का स्वरूप
  choice: पापों को प्रतिदिन लिखे जाने की प्रलय-साहित्यिक न्यायिक छवि को यथावत रखा गया है।
  alternative: इसे केवल इस सामान्य कथन में बदल देना कि परमेश्वर सब पाप जानता है।
  rationale: बार-बार प्रयुक्त ‘लिखना’ और न्याय का प्रसंग वास्तविक अभिलेख की साहित्यिक छवि पर बल देते हैं; फिर भी लिखने वालों की पहचान पाठ से अधिक स्पष्ट नहीं की गई।
- issue: अंतिम बहुवचन कर्ता की पहचान
  choice: अनिर्दिष्ट ‘वे’ रखा गया है।
  alternative: ‘स्वर्गदूत’ या ‘परमेश्वर के दूत’ जोड़ना।
  rationale: मूल में कर्ता बहुवचन है, पर उसकी स्पष्ट पहचान नहीं दी गई; किसी विशिष्ट स्वर्गीय पात्र को जोड़ना पाठ से आगे जाना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘जाँच-पड़ताल’ न्यायिक खोज का भाव स्पष्ट करती है; ‘दर्ज’ की जगह ‘लिखना’ रखकर मूल की दोहराई हुई अभिलेख-छवि बचाई गई है।
