base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/031/001.yaml
  text: And I saw other mountains[a], in which there were trees, and from them there came out something like nectar[c][b], whose name was serera and galbanum.
translation:
  language: hi
  text: और मैंने अन्य पहाड़ देखे, जिनमें पेड़ थे। वहाँ से मकरंद-जैसा एक पदार्थ निकलता था[a], जिसे सरेरा[b] और गलबानुम[c] कहा जाता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीइज़ में ‘निकलता था’ के साथ ‘उससे’ जैसा एकवचन प्रत्यय है, जबकि पहले ‘पहाड़’ और ‘उनमें’ बहुवचन हैं। इसका संदर्भ किसी एक पहाड़, किसी पेड़, अथवा सामूहिक रूप से उन पहाड़ों से हो सकता है। ‘मकरंद-जैसा पदार्थ’ का अर्थ ‘मधुर रस’ या ‘सुगंधित गोंद/राल जैसा पदार्थ’ भी हो सकता है।
    reason: grammatical_and_lexical_ambiguity
  - marker: b
    text: ‘सरेरा’ की ठीक वनस्पति पहचान निश्चित नहीं है; गीइज़ पाठ संभवतः किसी सुगंधित पदार्थ का नाम सुरक्षित रखता है।
    reason: lexical_alternative
  - marker: c
    text: गलबानुम प्राचीन धूप और सुगंध-परंपराओं में प्रयुक्त एक सुगंधित राल है। मूल गीइज़ नाम को ‘केलबेने’ भी लिखा जा सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: ወርኢኩ
  choice: और मैंने ... देखे
  rationale: दर्शन-वृत्तांत के प्रथम पुरुष सूत्र को सरल और स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: ካልአነ አደባረ
  choice: दूसरे पहाड़
  rationale: दोनों शब्द बहुवचन हैं; आगे का बहुवचन प्रत्यय भी इसकी पुष्टि करता है। इसलिए एकवचन ‘एक और पहाड़’ नहीं लिया गया।
- source_word: ዘቦ ውስቴቶሙ ዕፀወ
  choice: जिनमें पेड़ थे
  rationale: पेड़ों को उन पहाड़ों के भीतर अथवा उनके क्षेत्र में स्थित बताने वाली उक्ति का स्वाभाविक हिन्दी रूप।
- source_word: ወይወፅእ እምኔሁ
  choice: उनमें से ... निकलता था
  rationale: निकलने या प्रवाहित होने की ठोस छवि सुरक्षित रखी गई है। गीइज़ में प्रत्यय रूपतः एकवचन है, पर व्यापक बहुवचन संदर्भ के कारण हिन्दी में ‘उनमें से’ चुना गया; इस व्याकरणिक तनाव को पादटिप्पणी में बताया गया है।
- source_word: ከመ ኔቄጥር
  choice: रस-जैसा कोई पदार्थ
  rationale: तुलनासूचक ከመ को ‘जैसा’ से स्पष्ट किया गया है। पदार्थ की सटीक पहचान अनिश्चित होने के कारण ‘अमृत’, ‘गोंद’ या ‘सुगंधित राल’ जैसे अधिक निश्चित शब्दों से बचा गया।
- source_word: ሰረራ
  choice: सरेरा
  rationale: वनस्पति या सुगंधित पदार्थ की पहचान अनिश्चित है, इसलिए नाम का लिप्यंतरण किया गया है।
- source_word: ከልበኔ
  choice: गलबानुम
  rationale: प्राचीन सुगंधित राल के प्रचलित नाम को अपनाया गया है; मूल नाम ‘केलबेने’ भी संभव है।
theological_decisions:
- issue: दर्शन के सुगंधित पदार्थ को केवल ‘सुगंध’ या ‘इत्र’ के रूप में सामान्यीकृत करना
  choice: ‘रस-जैसा कोई पदार्थ निकलता था’ के रूप में ठोस पदार्थ और उसके निकलने की छवि बनाए रखना
  alternative: ‘वहाँ से सुगंध आती थी’ अथवा ‘वे इत्र उत्पन्न करते थे’
  rationale: मूल पाठ किसी वस्तु के बाहर आने की मूर्त प्राकृतिक-दर्शनात्मक छवि देता है। उसे केवल गंध में बदलना पाठ की अस्पष्टता और अपोकैलिप्टिक प्राकृतिक चित्रण को अनावश्यक रूप से समतल कर देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। वाक्य को पठनीयता के लिए दो भागों में बाँटा गया है। दुर्लभ पदार्थों की अनिश्चित पहचान को मुख्य पाठ में सहज रूप से तथा पादटिप्पणियों में स्पष्ट रूप से सुरक्षित रखा गया है।
