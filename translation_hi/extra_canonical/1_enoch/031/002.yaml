  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दर्शन-वर्णन के अनुकूल शैली। वाक्य-संरचना स्रोत के दो दृश्य-खंडों को बनाए रखती है। ‘भरे-पूरे और दृढ़’ स्वाभाविक हिन्दी देता है, जबकि तुलना और विशेषणों के सटीक परस्पर संबंध की हल्की अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
