  text: And upon that mountain I saw another mountain[a], and within it were trees; and those trees were full and strong[c][b], like almond trees.
translation:
  language: hi
  text: और उस पहाड़ पर मैंने एक और पहाड़ देखा,[a] और उसके भीतर पेड़ थे; वे पेड़ बादाम के पेड़ों के समान भरे-पूरे और दृढ़ थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल गीइज़ में पहाड़ के ‘भीतर’ पेड़ होने की असामान्य छवि है; इसे ‘उस पर’ कहकर सरल नहीं किया गया है।
    reason: source_ambiguity
  - marker: b
    text: ‘बादाम’ के लिए प्रयुक्त गीइज़ शब्द का वानस्पतिक अर्थ पूरी तरह निश्चित नहीं है; पुराने अनुवादों में इसे ‘कैरब’ भी समझा गया है। ‘भरे-पूरे’ का आशय फल, घनी वृद्धि या सामान्य परिपूर्णता हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ዲበ
  choice: पर
  rationale: यह स्थान-सूचक पूर्वसर्ग है; ‘उस पहाड़ पर’ आधुनिक हिन्दी में स्वाभाविक रहते हुए ऊँचे स्थान का बोध बनाए रखता है।
- source_word: ደብር
  choice: पहाड़
  rationale: यहाँ दर्शनीय भू-दृश्य में पर्वतीय ऊँचाई अभिप्रेत है; सामान्य पाठक के लिए ‘पहाड़’ सहज है।
- source_word: ካልአ
  choice: एक और
  rationale: दृष्टान्त के क्रम में पहले से भिन्न दूसरे पहाड़ का संकेत करता है।
- source_word: ውስቴቱ
  choice: उसके भीतर
  rationale: सर्वनाम पहाड़ की ओर लौटता है; अनोखी भौगोलिक छवि को ‘उस पर’ करके सरल नहीं किया गया।
- source_word: ዕፀወ / ዕፀው
  choice: पेड़
  rationale: दोनों रूप यहाँ वृक्षों अथवा काष्ठीय वनस्पति का संकेत देते हैं; एकरूप अनुवाद स्रोत की पुनरावृत्ति बचाता है।
- source_word: እልኩ
  choice: वे
  rationale: इसे बहुवचन संकेतवाचक मानकर पहले उल्लिखित पेड़ों की ओर संकेत किया गया है; ‘मैंने सुगंधित पौधे अनुभव किए’ वाला पाठ नहीं अपनाया गया।
- source_word: ምሉኣን
  choice: भरे-पूरे
  rationale: शाब्दिक ‘भरे हुए’ हिन्दी में अस्पष्ट होता; ‘भरे-पूरे’ पूर्णता, भराव या समृद्ध वृद्धि का खुला भाव रखता है।
- source_word: ዘከመ ከርካዕ
  choice: बादाम के पेड़ों के समान
  rationale: नवीनतम स्रोत-समीक्षा के अनुसार botanical comparison को बादाम माना गया है; वृक्षों से तुलना हिन्दी में स्पष्ट की गई है।
- source_word: ጽኑዕተ
  choice: दृढ़
  rationale: यह मजबूती, कठोरता या सुदृढ़ता व्यक्त करता है; ‘दृढ़’ गरिमापूर्ण और अर्थतः खुला है।
