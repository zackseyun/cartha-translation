base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/001.yaml
  text: And in those days[a], in one place, fathers together with their sons will be struck down[d][c][b], and brothers together with their companions will fall in death until a stream flows from their blood.
translation:
  language: hi
  text: और उन दिनों[a], एक स्थान पर पिता अपने पुत्रों सहित मार डाले जाएँगे, और भाई अपने साथियों सहित मृत्यु में गिर पड़ेंगे, यहाँ तक कि उनके लहू से एक धारा बह निकलेगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘एक स्थान पर’ के लिए इथियोपिक पाठ का यह अंश कठिन है; यहाँ सावधानी से स्थानवाचक अर्थ लिया गया है।
    reason: textual_variant
  - marker: b
    text: 'अंतिम चित्र अत्यधिक रक्तपात को दर्शाता है: उनके लहू से धारा बह निकलने की छवि।'
    reason: cultural_note
lexical_decisions:
- source_word: በአማንቱ መዋዕል
  choice: उन दिनों
  rationale: यह एक प्रचलित अपोकैलिप्टिक कालसूचक पद है; हिन्दी में यह स्वाभाविक और गरिमापूर्ण है।
- source_word: በ፻መካን
  choice: एक स्थान पर
  rationale: पाठ कठिन है, पर उपलब्ध साक्ष्य एकवचन स्थानवाचक अर्थ का समर्थन करता है; अनिश्चितता को पादटिप्पणी में रखा गया है।
- source_word: አበው ምስለ ውሉዶሙ
  choice: पिता अपने पुत्रों सहित
  rationale: पारिवारिक युग्म और पुल्लिंग बहुवचन को सीधे बनाए रखता है।
- source_word: 'ይትጐድኡ (OCR: ይትኃድኡ)'
  choice: मार डाले जाएँगे
  rationale: समीक्षित पाठ-साक्ष्य इसे ‘मारना’ क्रिया का कर्मवाच्य रूप मानता है, न कि परस्पर लड़ने का अर्थ।
- source_word: አኀው ምስለ ቢጾሙ
  choice: भाई अपने साथियों सहित
  rationale: ‘साथी’ मित्र, सहचर या सहयोगी के व्यापक संबंधपरक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ይወድቁ በሞት
  choice: मृत्यु में गिर पड़ेंगे
  rationale: मूल की गंभीर, अपोकैलिप्टिक छवि को सामान्य हिन्दी में यथासंभव बनाए रखता है।
- source_word: እስከ ይውኅዝ ትክዚ እምደመ ዚአሆሙ
  choice: यहाँ तक कि उनके लहू से एक धारा बह निकलेगी
  rationale: मूल के अतिशयोक्तिपूर्ण रक्तपात-चित्र को उपमा में बदले बिना सुरक्षित रखता है।
theological_decisions:
- issue: हिंसा के चित्र का स्वरूप
  choice: सामाजिक विघटन का ठोस चित्र, जिसे अपोकैलिप्टिक अतिशयोक्ति में व्यक्त किया गया है
  alternative: इसे केवल रूपकात्मक कलह या केवल शाब्दिक युद्ध-विवरण मानना
  rationale: अनुवाद पारिवारिक और सामाजिक रक्तपात को ठोस रूप में रखता है, पर उसकी ऊँची अपोकैलिप्टिक भाषा को किसी एक संकीर्ण व्याख्या में सीमित नहीं करता।
- issue: पहली क्रिया का वाच्य और हिंसा में पक्षों की भूमिका
  choice: कर्मवाच्य—‘मार डाले जाएँगे’
  alternative: परस्परवाच्य—‘एक-दूसरे को मारेंगे/लड़ेंगे’
  rationale: नवीन पाठ-समीक्षा OCR रूप के पीछे कर्मवाच्य ይትጐድኡ को पहचानती है; इसलिए अनुवाद हमलावरों की पहचान नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण अपोकैलिप्टिक स्वर। ‘लहू’ ने रक्तपात की बाइबिलीय और सजीव छवि को बनाए रखा है। वाक्य-विन्यास दो समानांतर समूहों—पिता-पुत्र और भाई-साथी—को स्पष्ट करता है।
