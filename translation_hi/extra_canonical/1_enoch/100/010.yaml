base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/010.yaml
  text: And now[a], know that your deeds will be investigated by the angels in heaven, and by the sun and the moon and the stars, concerning your sins[b], because upon the earth you execute judgment upon the righteous.
translation:
  language: hi
  text: और अब[a] जान लो कि तुम्हारे पापों के विषय में तुम्हारे कर्मों की जाँच स्वर्ग के स्वर्गदूतों द्वारा, और सूर्य, चन्द्रमा और तारों द्वारा की जाएगी, क्योंकि पृथ्वी पर तुम धर्मियों का न्याय करते हो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध कराई गई गीज़ पंक्ति केवल “और अब, जान लो…” तक है; यहाँ शेष वाक्य चार्ल्स के इसी पद के पूर्ण पाठ से पुनर्स्थापित किया गया है। संक्षिप्त पंक्ति का शाब्दिक अनुवाद “और अब, जान लो…” भी हो सकता है।
    reason: textual_variant
  - marker: b
    text: “धर्मियों का न्याय करते हो” का अर्थ प्रसंग में “धर्मियों को दोषी ठहराते हो” या “धर्मियों के विरुद्ध दण्डादेश देते हो” भी हो सकता है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ወይእዜኒ
  choice: और अब
  rationale: संयोजक और कालवाचक पद से बना यह सूत्र कथन में परिवर्तन लाता है। ‘और अब’ इसे स्वाभाविक और संक्षिप्त रूप में बनाए रखता है।
- source_word: አእምሩ
  choice: जान लो
  rationale: यह जानने/समझने की क्रिया का बहुवचन आज्ञार्थक रूप है। आधुनिक हिन्दी में ‘जान लो’ चेतावनी और उपदेश—दोनों का बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: ይትኀሠሥ
  choice: जाँच ... की जाएगी
  rationale: इस क्रिया में खोजने, छानबीन करने या जाँचने का भाव है। कर्मवाच्य रचना मूल पाठ में कामों पर होने वाली जाँच को प्रमुख रखती है।
- source_word: ምግባሪክሙ
  choice: तुम्हारे कामों
  rationale: यह कर्मों, आचरण या किए हुए कामों को सूचित करता है। ‘कामों’ साधारण आधुनिक हिन्दी में स्पष्ट है और नैतिक आचरण का आशय खुला रखता है।
- source_word: ኵነኔ
  choice: न्याय
  rationale: शब्द न्याय, निर्णय या दण्डादेश का अर्थ दे सकता है। ‘न्याय’ मूल की न्यायिक भाषा को बनाए रखता है; सम्भावित प्रतिकूल अर्थ फुटनोट में बताया गया है।
- source_word: ጻድቃን
  choice: धर्मियों
  rationale: यह धार्मिक/न्यायी जनों के लिए बहुवचन संज्ञा है। ‘धर्मी’ हिन्दी बाइबलीय भाषा में परिचित, संक्षिप्त और गरिमापूर्ण है।
theological_decisions:
- issue: धर्मियों पर किए जाने वाले ‘न्याय’ का आशय
  choice: तुम धर्मियों का न्याय करते हो
  alternative: तुम धर्मियों को दोषी ठहराते हो / धर्मियों के विरुद्ध दण्डादेश देते हो
  rationale: मूल की न्यायिक अभिव्यक्ति को बिना उसका नैतिक परिणाम अत्यधिक स्पष्ट किए मुख्य पाठ में रखा गया है। प्रसंग प्रतिकूल या अन्यायी निर्णय का संकेत दे सकता है, इसलिए वैकल्पिक अर्थ फुटनोट में दिया गया है।
- issue: स्वर्गदूतों, सूर्य, चन्द्रमा और तारों की भूमिका
  choice: के द्वारा
  alternative: के सामने / उनसे
  rationale: गीज़ के पूर्वसर्गीय क्रम को अंग्रेज़ी परामर्श-पाठ ने जाँच करने वाले साक्षी अथवा कर्ता के रूप में समझा है। ‘के द्वारा’ इस वाक्य में सर्वाधिक स्पष्ट है, पर काव्यात्मक साक्षीभाव की सम्भावना पूर्णतः समाप्त नहीं होती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, चेतावनीपूर्ण भविष्यवाणी-शैली रखी गई है। ‘चन्द्रमा’ और ‘धर्मी’ जैसे परिचित बाइबलीय शब्दों का प्रयोग किया गया है, जबकि वाक्यरचना को सामान्य पाठक के लिए सीधा रखा गया है।
