base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/008.yaml
  text: 'Woe to you[a], hard of heart, who stay awake to devise evil: fear will come upon you[c][b], and there will be no one to help you.'
translation:
  language: hi
  text: हे कठोर हृदयवालो, तुम पर हाय[a], जो बुराई की योजना बनाने के लिए जागते रहते हो[b]! भय तुम पर आ पड़ेगा[c], और तुम्हारी सहायता करने वाला कोई न होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हाय’ यहाँ केवल दुःख प्रकट नहीं करता, बल्कि आने वाले न्याय की धिक्कार-घोषणा भी है।
    reason: discourse_formula
  - marker: b
    text: मूल क्रिया का अर्थ ‘जागे रहना’, ‘सतर्क रहना’ या किसी काम में तत्पर रहना हो सकता है; यहाँ यह बुराई की योजना बनाने में जानबूझकर लगे रहने को दर्शाती है।
    reason: lexical_alternative
  - marker: c
    text: या ‘भय तुम्हें आ पकड़ेगा’ अथवा ‘भय तुम तक पहुँच जाएगा।’ मूल क्रिया के अर्थों में पाना, पहुँच जाना और आ पकड़ना सम्मिलित हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ
  choice: हाय
  rationale: यह न्याय की भविष्यद्वाणी का उद्घोष है; ‘हाय’ आधुनिक हिन्दी में विलाप और दण्ड-घोषणा दोनों का गंभीर स्वर बनाए रखता है।
- source_word: ግዙፋነ ልብ
  choice: कठोर हृदयवालो
  rationale: यह पद आन्तरिक हठ और नैतिक असंवेदनशीलता बताता है; ‘कठोर हृदय’ इसका स्वाभाविक और परिचित हिन्दी रूप है।
- source_word: ትተግሁ
  choice: जागते रहते हो
  rationale: मूल क्रिया जागे रहने अथवा सतर्क रहने का भाव रखती है। प्रसंग में यह बुराई के लिए जानबूझकर सक्रिय रहने को दर्शाती है, न कि पहरेदारी को।
- source_word: ከመ ትሰብውዎ ለእኩይ
  choice: बुराई की योजना बनाने के लिए
  rationale: ከመ के साथ आने वाली रचना उद्देश्य प्रकट करती है; ‘योजना बनाने’ से बुराई के बारे में केवल सोचने के बजाय सुनियोजित दुष्टता का भाव स्पष्ट होता है।
- source_word: ፍርሀት
  choice: भय
  rationale: संज्ञा भय या आतंक दोनों व्यक्त कर सकती है। ‘भय’ मूल की व्यापकता बनाए रखता है और न्याय के प्रसंग से उसकी तीव्रता प्रकट होती है।
- source_word: ይረክብክሙ
  choice: तुम्हें आ घेरेगा
  rationale: क्रिया का अर्थ पाना, पहुँच जाना या आ पकड़ना हो सकता है। ‘आ घेरेगा’ स्वाभाविक हिन्दी में आसन्न और बच न सकने वाले भय का भाव देता है, जबकि विकल्प पादटिप्पणी में रखा गया है।
- source_word: ወአልቦ ዘይረድአክሙ
  choice: तुम्हारी सहायता करने वाला कोई न होगा
  rationale: यह वाक्य उद्धार या सहायता के पूर्ण अभाव को स्पष्ट, आधुनिक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: धिक्कार-वचन का स्वरूप
  choice: नैतिक रूप से हठी और योजनाबद्ध रीति से बुराई करने वालों के विरुद्ध भविष्यद्वाणी-सदृश धिक्कार, जिन पर अपरिहार्य न्याय आएगा
  alternative: पापियों की दशा पर सामान्य विलाप अथवा चिंता के विषय में केवल मनोवैज्ञानिक चेतावनी
  rationale: आरम्भिक ‘हाय’, संबोधित लोगों का नैतिक वर्णन, भय का उन्हें आ घेरना और किसी सहायक का न होना—ये सब मिलकर न्याय-घोषणा बनाते हैं। पाठ यह नहीं बताता कि भय स्वयं दण्ड है या आने वाले दण्ड की प्रतिक्रिया; इस तनाव को अनिर्णीत रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रत्यक्ष बहुवचन संबोधन और गरिमापूर्ण भविष्यद्वाणी-संबंधी लहजा अपनाया गया है। ‘जागते रहते हो’ मूल के जागरण/सतर्कता-भाव को बचाता है, जबकि ‘योजना बनाने’ से उद्देश्यपूर्ण दुष्टता स्पष्ट होती है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
