base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/006.yaml
  text: And wise men will see[a], and all the children of the earth will understand every matter of this book[c][b], and they will know that their wealth cannot save them from the destruction of their sins.
translation:
  language: hi
  text: और बुद्धिमान लोग देखेंगे,[a] और पृथ्वी के सभी लोग इस पुस्तक की हर बात समझेंगे; और वे जानेंगे कि उनका धन उन्हें उनके पापों से होने वाले विनाश से नहीं बचा सकता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरंभिक शब्द कठिन है। इसका अर्थ “सचमुच बुद्धिमान लोग देखेंगे” या संभवतः “बुद्धिमान लोग सत्य को देखेंगे” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እሙነ፡ ይሬእዩ፡ ሰብአ፡ ጠቢባን
  choice: बुद्धिमान लोग देखेंगे
  rationale: እሙነ का रूप और वाक्यगत कार्य अनिश्चित है; यह ‘सचमुच’ या ‘सत्य’ से संबंधित हो सकता है। उपलब्ध संशोधन-साक्ष्य के अनुसार मुख्य पाठ में असिद्ध कर्म ‘सत्य’ नहीं जोड़ा गया, और कठिनाई पादटिप्पणी में रखी गई है।
- source_word: ውሉደ፡ ምድር
  choice: पृथ्वी की सारी संतान
  rationale: शाब्दिक ‘पृथ्वी की संतान’ हनोक की विशिष्ट प्रलय-साहित्यिक अभिव्यक्ति को बनाए रखता है; ኵሎ के कारण ‘सारी’ जोड़ा गया है।
- source_word: ኵሎ፡ ነገረ፡ ዛቲ፡ መጽሐፍ
  choice: इस पुस्तक की हर बात
  rationale: ነገር का अर्थ बात, विषय, वस्तु या वचन हो सकता है। ‘हर बात’ इस व्यापकता को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: ብዕሎሙ
  choice: उनका धन
  rationale: यह संज्ञा ‘उनकी संपत्ति/धन’ है और अगले निषेधात्मक कथन का कर्ता है; इसे आत्मवाचक ‘अपने आपको’ समझना उचित नहीं।
- source_word: ኢይክል፡ ብዕሎሙ፡ አድኅኖቶሙ
  choice: उनका धन उन्हें ... नहीं बचा सकता
  rationale: वाक्य धन की उद्धार करने में असमर्थता बताता है। हिन्दी में कर्ता और कर्म को स्पष्ट रखकर मूल संबंध सुरक्षित किया गया है।
- source_word: በመዳቀ፡ ኃጢአቶሙ
  choice: उनके पापों से होनेवाले विनाश से
  rationale: መዳቀ को पतन, कुचले जाने या विनाश के अर्थ में लिया गया है। हिन्दी में ‘पापों से होनेवाला विनाश’ संबंध को स्वाभाविक बनाता है, पर वैकल्पिक संबंध पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: क्या मनुष्य अपने पापों को नकारकर स्वयं को बचाने की कोशिश करते हैं, या उनका धन पापजनित विनाश से नहीं बचा सकता?
  choice: उनका धन उन्हें उनके पापों से होनेवाले विनाश से नहीं बचा सकता।
  alternative: वे अपने पापों को नकारकर अपने आपको नहीं बचा सकते।
  rationale: ብዕሎሙ का अर्थ ‘उनका धन’ है और መዳቀ विनाश/पतन से संबंधित है। इसलिए पाठ धन की निष्फलता पर बल देता है; आत्म-उद्धार या पापों के इनकार की व्याख्या मूल शब्दों से कम समर्थित है।
- issue: पापों और विनाश का संबंध
  choice: पापों से होनेवाला विनाश
  alternative: उनके पापों के विनाश में
  rationale: स्रोत की संबंध-सूचक रचना संक्षिप्त है और कारण, संबद्धता अथवा परिस्थिति का संकेत दे सकती है। मुख्य पाठ में सुबोध कारणात्मक संबंध रखा गया है, जबकि अधिक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘पृथ्वी की संतान’ से प्रलय-साहित्यिक शैली बचाई गई है। मुख्य पाठ में प्रत्येक प्रयुक्त पादटिप्पणी-चिह्न उपस्थित होना चाहिए; इसलिए अंतिम प्रकाशित पाठ में [b] को संबंधित अंतिम खंड के बाद जोड़ा जाए।
