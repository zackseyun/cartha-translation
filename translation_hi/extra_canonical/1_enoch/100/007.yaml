base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/007.yaml
  text: Woe to you[a], sinners, when you oppress the righteous on the day of fierce distress, and burn them with fire[b]; then you will be repaid according to your deeds.
translation:
  language: hi
  text: हाय तुम पर, पापियो! जब तुम भारी संकट के दिन[a] धर्मियों पर अत्याचार करोगे[b] और उन्हें आग में जलाओगे, तब तुम्हें तुम्हारे कर्मों के अनुसार प्रतिफल मिलेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भारी संकट के दिन’ का अधिक शाब्दिक अर्थ तीव्र या प्रबल दुःख से चिह्नित दिन है; ‘घोर क्लेश के दिन’ भी सम्भव है।
    reason: lexical_alternative
  - marker: b
    text: ‘अत्याचार करोगे’ के लिए प्रयुक्त क्रिया का अर्थ ‘सताओगे’ या ‘दुःख दोगे’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: हाय तुम पर
  rationale: यह न्याय की भविष्यवाणी करने वाला सीधा विस्मयादिबोधक सूत्र है। ‘हाय तुम पर’ उसकी चेतावनी और निंदा की शक्ति बनाए रखता है।
- source_word: ኃጥኣን
  choice: पापियो
  rationale: संबोधन रूप मूल पाठ के सीधे नैतिक-धार्मिक आरोप को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ታመኒድብዎሙ
  choice: अत्याचार करोगे
  rationale: क्रिया कठोर उत्पीड़न या दुःख पहुँचाने का भाव देती है। ‘अत्याचार करना’ लगातार और हिंसक दुर्व्यवहार को व्यक्त करता है, पर उसके स्वरूप को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ጻድቃን
  choice: धर्मियों
  rationale: यह हनोक-साहित्य की प्रमुख नैतिक श्रेणी है; ‘धर्मी’ आधुनिक बाइबलीय हिन्दी में स्पष्ट और परिचित है।
- source_word: በዕለተ፡ ጻዕብ፡ ኃያል
  choice: भारी संकट के दिन
  rationale: यह पद दिन को तीव्र कष्ट और प्रबलता से जोड़ता है। यह अनुवाद उसकी गंभीरता बनाए रखता है और बाद की किसी तकनीकी पारिभाषिक धारणा को आरोपित नहीं करता।
- source_word: ታነድድዎሙ፡ በእሳት
  choice: उन्हें आग में जलाओगे
  rationale: मूल की ठोस और हिंसक अग्नि-छवि को बिना नरम किए स्वाभाविक हिन्दी में रखा गया है।
- source_word: ወትትፈደዩ
  choice: तुम्हें ... प्रतिफल मिलेगा
  rationale: यह प्रतिदान या बदले में फल पाने का भाव स्पष्ट करता है, जबकि प्रतिफल देने वाले कर्ता को मूल की तरह अनकहा रहने देता है।
- source_word: ከመ፡ ምግባራቲክሙ
  choice: तुम्हारे कर्मों के अनुसार
  rationale: यह कर्म और न्यायिक परिणाम के बीच अनुरूपता बताने वाले मूल सूत्र का सीधा और स्वाभाविक रूप है।
theological_decisions:
- issue: अंतिम प्रतिफल-वाक्य में कर्ता और प्राप्तकर्ता
  choice: पापियों को उनके अपने कर्मों के अनुसार प्रतिफल मिलेगा; प्रतिफल देने वाला कर्ता अनकहा है।
  alternative: इसे सामान्य, निर्वैयक्तिक प्रतिदान-वचन माना जा सकता है, या उस दिन की विपत्ति को ही प्रतिफल का माध्यम समझा जा सकता है।
  rationale: पूरे पद में द्वितीय पुरुष में पापियों को संबोधित किया गया है, इसलिए अंतिम क्रिया भी उन्हीं पर लागू होती है। फिर भी मूल पाठ प्रतिफल देने वाले को स्पष्ट नहीं करता, अतः हिन्दी में भी उस कर्ता को नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। सीधे संबोधन और भावी न्याय की तीव्रता सुरक्षित है। ‘प्रतिफल मिलेगा’ प्रतिदान को व्यक्त करता है, पर उसके दैवी कर्ता को पाठ से आगे बढ़कर स्पष्ट नहीं करता।
