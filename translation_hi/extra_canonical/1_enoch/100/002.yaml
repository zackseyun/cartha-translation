base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/002.yaml
  text: For a man will not withhold his hand from his sons[a], nor from the sons of his sons, to kill them; and the sinner will not withhold his hand from his honored brother[b]. From dawn until the sun sets they will slaughter one another.
translation:
  language: hi
  text: क्योंकि मनुष्य अपने बेटों[a] पर—और अपने बेटों के बेटों पर भी—उन्हें मार डालने के लिए हाथ उठाने से नहीं रुकेगा; और पापी अपने आदरणीय भाई[b] पर हाथ उठाने से नहीं रुकेगा। भोर से लेकर सूर्यास्त तक वे एक-दूसरे का वध करते रहेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी संतान”; गीइज़ शब्द कुछ संदर्भों में केवल पुरुष संतानों से अधिक व्यापक अर्थ रख सकता है।
    reason: lexical_alternative
  - marker: b
    text: “आदरणीय भाई” का अनुवाद “प्रतिष्ठित भाई” भी हो सकता है; मूल शब्द व्यक्तिगत सम्मान अथवा सामाजिक प्रतिष्ठा पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢይከልእ እዴሁ
  choice: अपना हाथ नहीं रोकेगा
  rationale: मूल के ठोस हिंसक मुहावरे, अर्थात हाथ को पीछे न रोकना, को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: እምውሉዱ
  choice: अपने बेटों से
  rationale: मूल रूप का निकट और पारिवारिक अनुवाद है; पदसंदर्भ में व्यापक अर्थ ‘संतान’ भी संभव है, इसलिए पादटिप्पणी दी गई है।
- source_word: ውሉደ ውሉዱ
  choice: अपने बेटों के बेटों से
  rationale: ‘पोते’ की अपेक्षा मूल की पुनरुक्त पारिवारिक संरचना और लय को सुरक्षित रखता है।
- source_word: ከመ ይቅትሎ
  choice: उन्हें मार डालने के लिए
  rationale: उद्देश्यसूचक बल को स्पष्ट, संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ኃጥእ
  choice: पापी
  rationale: हनोक-साहित्य की नैतिक और न्याय-संबंधी श्रेणी को प्रतिनिधिक एकवचन में बनाए रखता है।
- source_word: እኍሁ ክቡር
  choice: अपने आदरणीय भाई
  rationale: ክቡር में निहित सम्मान और गरिमा को व्यक्त करता है, पर सामाजिक पद को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: እምጎሕ እስከ ትዐርብ ፀሐይ
  choice: भोर से लेकर सूर्यास्त तक
  rationale: पूरे दिन की अवधि और सूर्यास्त की दृश्यात्मकता को संक्षिप्त, गरिमापूर्ण हिन्दी में रखता है।
- source_word: ይትቃተሉ
  choice: वे एक-दूसरे का संहार करते रहेंगे
  rationale: पारस्परिक हिंसक वध की तीव्रता को ‘लड़ेंगे’ से अधिक ठीक व्यक्त करता है; निरंतरता पूरे दिन चलने वाली हिंसा से मेल खाती है।
theological_decisions:
- issue: वर्णित हिंसा का दायरा
  choice: यह पद सामाजिक विघटन को इतना गहरा दिखाता है कि संतान, वंश और सम्मानित भ्रातृत्व के बंधन भी हत्या को नहीं रोकते।
  alternative: इसे केवल युद्धभूमि की हिंसा या वास्तविक पारिवारिक संकेत से रहित अतिशयोक्तिपूर्ण कहावत माना जा सकता है।
  rationale: ‘बेटे,’ ‘बेटों के बेटे’ और ‘भाई’ की पुनरावृत्ति पारिवारिक संबंधों को जानबूझकर प्रमुख बनाती है; न्यायकाल की भयावहता इन्हीं स्वाभाविक बंधनों के टूटने से चित्रित होती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण अपोकैलिप्टिक शैली रखी गई है। पारिवारिक पदों की पुनरावृत्ति मूल के अनुरूप जानबूझकर सुरक्षित है। ‘अपना हाथ नहीं रोकेगा’ ठोस मूल मुहावरे को बनाए रखता है, जबकि ‘संहार’ पारस्परिक वध की तीव्रता व्यक्त करता है।
