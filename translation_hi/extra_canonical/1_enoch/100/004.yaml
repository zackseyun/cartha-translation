base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/004.yaml
  text: In those days the angels will descend into the hidden places and gather together into one place all those who led others into sin[c][b][a]; and the Most High will arise on that day of judgment to execute great judgment in the midst of the sinners.
translation:
  language: hi
  text: उन दिनों स्वर्गदूत छिपे हुए स्थानों[a] में उतरेंगे और उन सबको, जिन्होंने पाप का साथ दिया,[b] एक ही स्थान में इकट्ठा करेंगे; और परमप्रधान न्याय के उस दिन उठ खड़ा होगा, ताकि पापियों के बीच बड़ा न्याय करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “छिपे हुए स्थानों” का अनुवाद “गुप्त स्थानों” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: पांडुलिपि-पाठ का अर्थ शाब्दिक रूप से “जिन्होंने पाप की सहायता की” या “जिन्होंने पाप का साथ दिया” है। दिए गए प्रतिलेखन में एक भिन्न क्रियारूप है, जिससे “जिन्होंने पाप को नीचे उतारा” जैसा अर्थ निकल सकता है; पर वह संभवतः प्रतिलिपि/OCR की त्रुटि है।
    reason: textual_variant
