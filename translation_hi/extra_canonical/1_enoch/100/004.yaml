- source_word: ይወርዱ
  choice: उतरेंगे
  rationale: स्वर्गीय प्राणियों के नीचे आने की दिशात्मक छवि को सुरक्षित रखता है।
- source_word: ውስተ ምኅባእት
  choice: छिपे हुए स्थानों में
  rationale: बहुवचन स्थानवाचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना स्थानों का स्वरूप अनावश्यक रूप से निश्चित किए।
- source_word: ወይገብእዎሙ በአሐዱ መካን
  choice: एक ही स्थान में इकट्ठा करेंगे
  rationale: क्रिया में लोगों को एक स्थान पर लाने और एकत्र करने, दोनों का भाव है; यह न्याय-दृश्य में स्वाभाविक है।
- source_word: ለእሉ እለ ይረድእዋ ለኃጢአት (manuscript reading; supplied transcription has ይወርደዋ)
  choice: उन सबको, जिन्होंने पाप का साथ दिया
  rationale: प्रमाणित पांडुलिपि-पाठ ይረድእዋ ‘सहायता/साथ देना’ का अर्थ देता है। यह कठिन अभिव्यक्ति को ‘सभी पापी’ या ‘दूसरों को पाप में डाला’ कहकर अधिक स्पष्ट नहीं बनाता। दिए हुए प्रतिलेखन का ይወርደዋ भिन्न और संभवतः OCR-जनित पाठ है, इसलिए पाठांतर टिप्पणी में रखा गया है।
- source_word: ወይትነሣእ ልዑል
  choice: और परमप्रधान ... उठ खड़ा होगा
  rationale: क्रिया को न्याय के लिए सक्रिय रूप से उठने के अर्थ में लिया गया है; ‘परमप्रधान’ स्थापित और संक्षिप्त ईश्वरीय उपाधि है।
- source_word: በይእቲ ዕለት ኵነኔ
  choice: न्याय के उस दिन
  rationale: मूल की गंभीर न्याय-दिवस अभिव्यक्ति तथा ‘न्याय’ संज्ञा को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ከመ ይግበር ኵነኔ ዐቢየ
  choice: ताकि ... बड़ा न्याय करे
  rationale: मूल में ‘करना’ और ‘न्याय’ की पुनरावृत्ति है; हिन्दी में यह वाक्यांश औपचारिक किंतु बोधगम्य है।
- source_word: እማእከሎሙ ለኃጥኣን
  choice: पापियों के बीच
  rationale: न्याय के पापियों के मध्य होने की दृश्यात्मकता को सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: स्वर्गदूतों द्वारा इकट्ठे किए जाने वालों की पहचान
  choice: वे लोग ‘जिन्होंने पाप का साथ दिया’
  alternative: वे जिन्होंने दूसरों को पाप में डाला; वे जिनके द्वारा पाप नीचे आया; सामान्य रूप से सभी पापी
  rationale: पांडुलिपि-पाठ इन लोगों को पाप की सहायता करने या उसका साथ देने से जोड़ता है। अनिश्चित वाक्यांश को केवल सामान्य पापियों अथवा दूसरों को बहकाने वालों के रूप में निश्चित करना मूल से अधिक व्याख्यात्मक होगा।
- issue: ልዑል की ईश्वरीय उपाधि
  choice: परमप्रधान
  alternative: सर्वोच्च; परम ऊँचा
  rationale: ‘परमप्रधान’ आधुनिक हिन्दी धार्मिक भाषा में समझ में आने वाली उपाधि है और किसी अतिरिक्त संप्रदायगत पहचान को आरोपित नहीं करती।
- issue: परमप्रधान का ‘उठना’
  choice: उठ खड़ा होगा
  alternative: महिमान्वित होगा; ऊँचा किया जाएगा
  rationale: न्याय करने की आगामी क्रिया के संदर्भ में सक्रिय रूप से उठ खड़े होने का अर्थ सबसे स्वाभाविक है, पर इसे अवतरण या किसी विशिष्ट धर्मसिद्धांत के रूप में नहीं समझाया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गंभीर और सार्वजनिक पाठ के योग्य रखी गई है। वाक्य की प्रलय-विषयक गरिमा के लिए ‘परमप्रधान’ और ‘न्याय के उस दिन’ बनाए गए हैं, जबकि कठिन खंड को सहज बनाने के नाम पर उसकी वास्तविक पाठगत अनिश्चितता नहीं मिटाई गई।
