base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/009.yaml
  text: 'Woe to you[a], sinners, because of the words of your mouth and because of the deeds of your hands[b], which your wickedness has done: in the heat of a flame more burning than fire you shall burn.'
translation:
  language: hi
  text: हे पापियो, तुम पर हाय! तुम्हारे मुँह की बातों और तुम्हारे हाथों के कामों के कारण—जिन्हें तुम्हारे अधर्म ने उत्पन्न किया है[a]—तुम आग से भी अधिक दहकती ज्वाला की तपन में जलोगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘जिन्हें तुम्हारे अधर्म ने उत्पन्न किया है’ का संबंध स्रोत में व्याकरण की दृष्टि से कठिन है। सम्भवतः यह मुँह की बातों और हाथों के कामों—दोनों को एक साथ लेकर उन्हें पापियों के अधर्म की उपज बताता है।
    reason: lexical_alternative
  - marker: b
    text: उपलब्ध प्रतिलिपि में अंतिम क्रिया का रूप भिन्न दिखाई देता है, पर चार्ल्स के आलोचनात्मक पाठ में ‘तुम जलोगे’ पढ़ा जाता है। अग्नि-वाक्यांश में ‘आग से भी अधिक’ तुलनात्मक अर्थ को बनाए रखता है; कुछ पूर्ववर्ती अनुवाद इसे सरल करके ‘आग की दहकती ज्वालाओं में’ कहते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: አሌ፡ ለክሙ፡ ኃጥኣን
  choice: हे पापियो, तुम पर हाय!
  rationale: यह न्याय की घोषणा का सूत्र है। ‘हाय’ उसकी निंदा और आने वाले संकट—दोनों को बनाए रखता है; ‘पापियो’ संबोधन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ዲበ፡ ነገረ፡ አፉክሙ፡ ወዲበ፡ ተግባረ፡ እዴክሙ
  choice: तुम्हारे मुँह की बातों और तुम्हारे हाथों के कामों के कारण
  rationale: ‘मुँह’ और ‘हाथों’ की समानांतर शारीरिक छवि को सुरक्षित रखा गया है और ዲበ का कारणसूचक बल ‘के कारण’ से स्पष्ट किया गया है।
- source_word: ርስዓኒክሙ
  choice: तुम्हारा अधर्म
  rationale: ‘अधर्म’ केवल बुरे व्यवहार नहीं, बल्कि ईश्वर-विरोधी दुष्टता का धार्मिक और नैतिक आयाम भी व्यक्त करता है, जबकि किसी बाद की सांप्रदायिक धारणा को नहीं जोड़ता।
- source_word: በዋዕየ፡ ላህብ፡ እምእሳት
  choice: आग से भी अधिक दहकती ज्वाला की तपन में
  rationale: ‘तपन’, ‘ज्वाला’ और ‘आग’ की सघन अग्नि-छवि को बनाए रखते हुए እም की तुलनात्मक शक्ति को ‘से भी अधिक’ से व्यक्त किया गया है।
- source_word: ትውዕዩ (critical reading; supplied transcription ይውዒ)
  choice: तुम ... जलोगे
  rationale: चार्ल्स के आलोचनात्मक पाठ में प्रमाणित द्वितीय पुरुष बहुवचन भविष्य को अपनाया गया है, जो पापियों को दिए गए सीधे संबोधन के अनुरूप है; उपलब्ध प्रतिलिपि का अंतिम रूप भिन्न है।
theological_decisions:
- issue: ርስዓኒክሙ को सामान्य नैतिक दुष्टता या धार्मिक-नैतिक अधर्म के रूप में व्यक्त करना
  choice: तुम्हारा अधर्म
  alternative: तुम्हारी दुष्टता
  rationale: स्रोत शब्द में अपवित्रता/ईश्वर-विरोध का भाव है। ‘अधर्म’ इस आयाम को बनाए रखता है, पर उसे किसी विशिष्ट धर्मसैद्धांतिक व्यवस्था से नहीं बाँधता।
- issue: कठिन सम्बन्धवाचक उपवाक्य को स्पष्ट बनाना या उसकी असहजता बनाए रखना
  choice: जिन्हें तुम्हारे अधर्म ने किया है
  alternative: जो तुम्हारे अधर्म की उपज हैं
  rationale: मुख्य पाठ स्रोत की असामान्य वाक्य-रचना और वास्तविक अस्पष्टता को पूरी तरह समतल नहीं करता; टिप्पणी सम्भावित सामूहिक अर्थ बताती है।
- issue: अग्नि-वाक्यांश में तुलना को बनाए रखना
  choice: आग से भी अधिक दहकती ज्वाला
  alternative: आग की दहकती ज्वालाएँ
  rationale: उपलब्ध संशोधित स्रोत-समीक्षा እምእሳት में तुलनात्मक अर्थ पहचानती है; इसलिए उसे सामान्य अग्नि-वर्णन में विलीन नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर ‘हाय’, ‘अधर्म’ और समानांतर ‘मुँह/हाथ’ संरचना से प्रलय-साहित्य की गरिमा और तीव्रता बनी रहती है। कठिन सम्बन्धवाचक उपवाक्य को जानबूझकर पूरी तरह सरल नहीं किया गया, ताकि स्रोत की अस्पष्टता सुरक्षित रहे।
