base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/003.yaml
  text: And a horse will walk up to its chest in the blood of sinners[d][c][b][a], and chariots will sink up to their tops.
translation:
  language: hi
  text: और एक घोड़ा पापियों के लहू में अपनी छाती तक चलता जाएगा[a][b], और रथ अपने ऊपरी भागों तक धँस जाएँगे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘चलता जाएगा’ का गीज़ रूप सामान्यतः ‘चलेगा/जाएगा’ समझा जाता है। इसकी वर्तनी या रूप-व्याख्या को लेकर कुछ अनिश्चितता रही है; एक पुराना मत इसे ‘श्वेत’ से जोड़ता है, पर अगले खंड में रथों के धँसने के समानांतर गति-सूचक अर्थ अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: मूल शब्द का अर्थ ‘उसकी छाती’ या ‘उसका वक्ष’ है। कुछ पुराने अनुवादों में ‘उसकी लगाम तक’ मिलता है, संभवतः प्रकाशितवाक्य 14:20 के समान दृश्य के प्रभाव से; पर ‘लगाम’ के लिए गीज़ में दूसरा शब्द प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: c
    text: तुलना करें प्रकाशितवाक्य 14:20, जहाँ रक्त घोड़ों की लगामों तक पहुँचने का चित्र है। दोनों में न्याय की अतिशयोक्तिपूर्ण छवि समान है, पर इस पद का अनुवाद उसके अपने गीज़ शब्दों के अनुसार किया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: ወየሐውር
  choice: और … चलता जाएगा
  rationale: क्रिया ሐወረ से बना रूप गति—‘चलना/जाना’—व्यक्त करता है। ‘चलता जाएगा’ लहू के भीतर आगे बढ़ते घोड़े का दृश्य स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ፈረስ
  choice: एक घोड़ा
  rationale: गीज़ में संज्ञा एकवचन है। यहाँ एकवचन बनाए रखना नवीनतम स्रोत-समीक्षा के अनुरूप है; यह प्रतिनिधिक या सामान्य एकवचन भी हो सकता है।
- source_word: እስከ እንግድዓሁ
  choice: अपनी छाती तक
  rationale: እስከ सीमा या ऊँचाई (‘तक’) बताता है और प्रत्यययुक्त እንግድዓሁ का अर्थ ‘उसकी/अपनी छाती’ है। ‘लगाम’ पाठ-सामंजस्य पर आधारित पुराना विकल्प है, पर इस गीज़ शब्द का सीधा अर्थ नहीं।
- source_word: ውስተ ደመ ኃጥኣን
  choice: पापियों के लहू में
  rationale: स्थानवाचक ውስተ को ‘में’, ደመ को ‘लहू’, और नैतिक श्रेणी ኃጥኣን को ‘पापियों’ के रूप में सीधा और गरिमापूर्ण ढंग से प्रस्तुत किया गया है।
- source_word: ሰረገላት
  choice: रथ
  rationale: यह ‘रथ’ का बहुवचन है; हिन्दी में ‘रथ’ का रूप एकवचन और बहुवचन दोनों में समान रह सकता है, जबकि बहुवचन क्रिया संख्या स्पष्ट करती है।
- source_word: እስከ መልዕልታ
  choice: अपने ऊपरी भागों तक
  rationale: መልዕልታ का मूल भाव ‘ऊँचाई/ऊपरी भाग’ है। ‘ऊपरी भागों तक’ रथों के लगभग पूरी तरह डूबने की सीमा स्पष्ट रखता है और किसी विशिष्ट संरचनात्मक ‘छत’ का अनावश्यक अनुमान नहीं लगाता।
- source_word: ትሰጠም
  choice: धँस जाएँगे
  rationale: तरल के संदर्भ में यह दबने, रुकने या डूबने का दृश्य देता है। ‘धँस जाएँगे’ रक्त में रथों के नीचे जाने की छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ኃጥኣን की नैतिक श्रेणी
  choice: पापियों
  alternative: दोषियों / अपराधियों
  rationale: खंड न्याय के संदर्भ में नैतिक बुराई का वर्णन करता है। ‘पापियों’ मूल शब्द की धार्मिक-नैतिक शक्ति बनाए रखता है, बिना किसी बाद की विशिष्ट संप्रदायगत धारणा को जोड़ने के।
- issue: प्रकाशितवाक्य 14:20 से संभावित साम्य
  choice: मुख्य पाठ में ‘छाती’ रखकर गीज़ पाठ को स्वतंत्र रूप से अनूदित करना
  alternative: ‘लगाम’ करके प्रकाशितवाक्य के शब्दचित्र से सामंजस्य बैठाना
  rationale: समान अतिशयोक्तिपूर्ण न्याय-चित्र होने पर भी इस पद का गीज़ शब्द शारीरिक ‘छाती’ को सूचित करता है। समानांतर धर्मग्रंथ के आधार पर मूल शब्द बदलना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘लहू’ ने दृश्य की काव्यात्मक और प्रलयदर्शी तीव्रता बनाए रखी है। ‘चलता जाएगा’ और ‘धँस जाएँगे’ गतिशील समानांतरता देते हैं। पाठ में स्रोत का एकवचन ‘एक घोड़ा’ सुरक्षित है, जबकि ‘रथ’ के साथ बहुवचन क्रिया मूल संख्या स्पष्ट करती है।
