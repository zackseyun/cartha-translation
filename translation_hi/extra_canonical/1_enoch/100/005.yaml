base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/005.yaml
  text: And he will appoint guardians from among the holy angels over all the righteous and holy ones[a], and they will guard them like the pupil of an eye, until every evil and every sin comes to an end. And even if the righteous sleep a long sleep[c][b], they have nothing to fear.
translation:
  language: hi
  text: और वह सभी धर्मी और पवित्र लोगों की रखवाली के लिए पवित्र स्वर्गदूतों में से रखवाले नियुक्त करेगा। वे आँख की पुतली की तरह उनकी रक्षा करेंगे[a], जब तक हर बुराई और हर पाप का अंत न हो जाए। और यदि धर्मी लंबी नींद भी सोएँ[b], तो उन्हें डरने की कोई बात नहीं होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आँख की पुतली की तरह’ एक मुहावरा है, जिसका अर्थ है अत्यंत सावधानी से रक्षा करना।
    reason: मुहावरे का अर्थ स्पष्ट करना
  - marker: b
    text: ‘लंबी नींद’ संभवतः मृत्यु या मृत अवस्था की ओर संकेत करती है, पर मूल पाठ स्वयं ‘नींद’ की सौम्य उपमा बनाए रखता है।
    reason: अर्थगत अस्पष्टता और संभावित मृत्यु-संदर्भ सुरक्षित रखना
lexical_decisions:
- source_word: ዐቀብተ
  choice: रखवाले
  rationale: यह शब्द रक्षा या रखवाली करने वाले व्यक्तियों को सूचित करता है। ‘पहरेदार’ की अपेक्षा ‘रखवाले’ यहाँ संरक्षण के भाव को अधिक स्वाभाविक रूप से व्यक्त करता है और हनोक-साहित्य के तकनीकी ‘Watchers’ से अनावश्यक भ्रम भी नहीं पैदा करता।
- source_word: ይሁብ
  choice: नियुक्त करेगा
  rationale: मूल अर्थ ‘देगा’ है, पर रखवालों को लोगों पर ठहराने के इस प्रयोग में ‘नियुक्त करेगा’ स्वाभाविक और संदर्भानुकूल है।
- source_word: ጻድቃን ወቅዱሳን
  choice: धर्मी और पवित्र लोग
  rationale: दोनों विशेषण संरक्षित समुदाय का समानांतर वर्णन करते हैं। ‘संत’ जैसे बाद के संस्थागत या सांप्रदायिक अर्थों से बचने के लिए ‘पवित्र लोग’ चुना गया है।
- source_word: እመላእክት ቅዱሳን
  choice: पवित्र स्वर्गदूतों में से
  rationale: 'पूर्वसर्ग रखवालों के स्रोत या समूह को दिखाता है: वे पवित्र स्वर्गदूतों में से नियुक्त किए जाते हैं। वाक्य-विन्यास ऐसा रखा गया है कि मनुष्य रूपी धर्मी-पवित्र लोगों और स्वर्गदूत रूपी रखवालों में भेद स्पष्ट रहे।'
- source_word: የዐቅብዎሙ
  choice: वे ... उनकी रक्षा करेंगे
  rationale: यह उसी रक्षा-संबंधी मूल धातु को दोहराता है और स्वर्गदूतीय संरक्षण को स्पष्ट रखता है।
- source_word: ከመ ብንተ ዐይን
  choice: आँख की पुतली के समान
  rationale: ठीक स्रोत-चित्र को बनाए रखते हुए अत्यंत सावधानी से रक्षा करने का भाव व्यक्त होता है। हिन्दी का परिचित मुहावरा ‘आँख का तारा’ प्रियता पर अधिक बल देता, इसलिए उसे नहीं चुना गया।
- source_word: እስከ ይዌድእ ኵሉ እኩየ ወኵሉ ኃጢአተ
  choice: जब तक हर बुराई और हर पाप का अंत न हो जाए
  rationale: यह समाप्त होने या अंत तक पहुँचने का परिणाम बताता है। मूल में कर्ता को स्पष्ट किए बिना हिन्दी में भी निरपेक्ष रचना रखी गई है।
- source_word: እመኒ
  choice: और यदि ... भी
  rationale: 'यह रियायती या concessive अर्थ देता है: लंबी नींद की स्थिति में भी रक्षा और निर्भयता की प्रतिज्ञा बनी रहती है।'
- source_word: ይነውሙ ... ንዋመ ነዋኅ
  choice: लंबी नींद भी सोएँ
  rationale: मूल की नींद-वाली उपमा और उसकी मृत्यु-संबंधी संभावित अर्थच्छाया दोनों को बिना निर्णायक व्याख्या थोपे सुरक्षित रखा गया है।
- source_word: አልቦ ዘይፈረሁ
  choice: उन्हें डरने की कोई बात नहीं होगी
  rationale: यह भय के किसी कारण या विषय के अभाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या स्वर्गदूतीय संरक्षण को केवल ईश्वरीय देखभाल का रूपक बना दिया जाए
  choice: पवित्र स्वर्गदूतों में से नियुक्त वास्तविक रखवालों की भाषा बनाए रखी गई
  alternative: स्वर्गदूतीय चित्र के माध्यम से सामान्य ईश्वरीय संरक्षण
  rationale: पाठ स्पष्ट रूप से पवित्र स्वर्गदूतों में से रखवालों की नियुक्ति कहता है; इसलिए उसके अपोकैलिप्टिक विश्वदृष्टिकोण को सपाट या अरूपकृत नहीं किया गया।
- issue: क्या ‘लंबी नींद’ का अनुवाद सीधे ‘मृत्यु’ किया जाए
  choice: मुख्य पाठ में ‘लंबी नींद’ रखा गया
  alternative: मर जाएँ; मृत्यु की नींद सोएँ
  rationale: मूल पाठ नींद की सौम्य और संभवतः मृत्यु-सूचक भाषा रखता है। अनुवाद उसी अर्थगत तनाव को सुरक्षित रखता है, जबकि संभावित मृत्यु-संदर्भ पादटिप्पणी में बताया गया है।
- issue: बुराई और पाप के अंत का कर्ता
  choice: कर्ता को अस्पष्ट रखते हुए ‘अंत न हो जाए’
  alternative: जब तक वह हर बुराई और हर पाप का अंत न कर दे
  rationale: उपलब्ध गीइज़ वाक्य में इस खंड का स्पष्ट कर्ता नहीं दिया गया; इसलिए अनुवाद किसी कर्ता को जोड़कर धार्मिक व्याख्या निश्चित नहीं करता।
