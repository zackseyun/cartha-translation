  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘रखवाले’, ‘रक्षा’, ‘धर्मी’ और ‘पवित्र लोग’ सामान्य पाठक के लिए स्पष्ट हैं। वाक्य-विन्यास स्वर्गदूत रखवालों और संरक्षित मनुष्यों के बीच भेद साफ रखता है; मृत्यु तथा अंतिम न्याय से जुड़ी अस्पष्टताओं को बिना सांप्रदायिक विस्तार के सुरक्षित रखा गया है।
