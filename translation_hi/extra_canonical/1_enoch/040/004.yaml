- source_word: ለእግዚአ መናፍስት
  choice: आत्माओं के प्रभु को
  rationale: यह 1 हनोक में प्रयुक्त विशिष्ट ईश्वरीय उपाधि है। यह अनुवाद उसकी गरिमा और ब्रह्मांडीय व्यापकता बनाए रखता है।
- source_word: ለዓለመ ዓለም
  choice: युगानुयुग
  rationale: यह अनंत अवधि बताने वाली बलात्मक गीइज़ अभिव्यक्ति का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
