- issue: ቀዳማዊ के निहित संदर्भ की अभिव्यक्ति
  choice: पहले जन
  alternative: पहले की वाणी
  rationale: स्रोत की संबंधसूचक व्याकरण ‘पहले की वाणी’ है, न कि ‘पहली वाणी’। ‘जन’ प्रसंग में पहले उल्लिखित स्वर्गीय उपस्थित व्यक्ति की ओर संकेत स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक अनिश्चितता सुरक्षित रखती है।
