base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/040/002.yaml
  text: And on the four sides of the Lord of Spirits I saw four other faces[a], different from those who do not sleep. And I learned their names[c][b], for the angel who came with me made their names known to me and showed me all the hidden things.
translation:
  language: hi
  text: और आत्माओं के प्रभु के चारों ओर मैंने चार अन्य मुख[a] देखे, जो उन लोगों से अलग थे जो सोते नहीं। मैंने उनके नाम जाने, क्योंकि जो स्वर्गदूत मेरे साथ आया था उसने उनके नाम मुझे बताए और मुझे सारी छिपी हुई बातें[b] दिखाईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चार अन्य चेहरे।” मूल शब्द प्रत्यक्ष रूप से मुख या चेहरा दर्शाता है; यहाँ इसे किसी अमूर्त ‘उपस्थिति’ से नहीं बदला गया है।
    reason: lexical_alternative
  - marker: b
    text: “छिपी हुई बातें” का अनुवाद “गुप्त बातें” या “रहस्य” भी किया जा सकता है; दर्शन-साहित्य में यह प्रकट किए गए स्वर्गीय रहस्यों के लिए सामान्य अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: በአርባዕቱ ክነፊሁ
  choice: चारों ओर
  rationale: ክነፍ का मूल अर्थ ‘पंख’ है, पर स्थानसूचक प्रयोग में ‘किनारा/ओर’ भी हो सकता है। यहाँ ‘चारों ओर’ दृश्य की स्थानिकता बचाता है और आत्माओं के प्रभु को पंखयुक्त बताने का अनावश्यक अर्थ नहीं देता।
- source_word: ለእግዚአ መናፍስት
  choice: आत्माओं के प्रभु
  rationale: यह 1 हनोक में प्रयुक्त मानक ईश्वरीय उपाधि है; इसे नाम की तरह लिप्यंतरित करने के बजाय स्वाभाविक हिन्दी में अनूदित किया गया है।
- source_word: አርባዕተ ገጸ ካልአ
  choice: चार और मुख
  rationale: ገጽ का प्रत्यक्ष अर्थ ‘मुख/चेहरा’ है। ‘मुख’ दर्शन की ठोस दृश्यात्मकता और पाठ की संभावित रहस्यमयता दोनों बनाए रखता है।
- source_word: እምነ እለ ኢይነውሙ
  choice: जो उन लोगों से अलग थे जो सोते नहीं
  rationale: यह वाक्यांश इन चार मुखों को पहले उल्लिखित जागते रहने वालों से अलग करता है; सम्बन्धवाचक संरचना को स्पष्ट रखा गया है।
- source_word: አእመርኩ
  choice: मैंने ... जान लिए
  rationale: क्रिया किसी बात को जानने या सीखने तक पहुँचने को व्यक्त करती है; प्रसंग में नाम बताए जाने के परिणाम को यह स्वाभाविक हिन्दी में दर्शाता है।
- source_word: ዘአይድዐኒ አስማቲሆሙ
  choice: उनके नाम मुझे बता दिए
  rationale: मूल की कारक धारणा ‘मुझे ज्ञात कराया’ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ኅቡኣተ
  choice: छिपी हुई बातें
  rationale: यह स्वर्गीय रूप से छिपे विषयों या रहस्यों की ओर संकेत करता है; ‘छिपी हुई बातें’ पारदर्शी है और तकनीकी धार्मिक अर्थ थोपता नहीं।
theological_decisions:
- issue: ईश्वरीय उपाधि እግዚአ መናፍስት का अनुवाद
  choice: आत्माओं के प्रभु
  alternative: समस्त आत्माओं के प्रभु
  rationale: मूल में ‘समस्त’ स्पष्ट नहीं है। चुना हुआ रूप पारंपरिक हनोकिक उपाधि को बनाए रखते हुए यह निर्धारित नहीं करता कि अभिप्राय सभी आत्माएँ हैं या कोई विशिष्ट स्वर्गीय समुदाय।
- issue: चार मुखों और न सोने वालों का सम्बन्ध
  choice: चार मुख उन न सोने वालों से अलग हैं
  alternative: चार मुख ही न सोने वाले हैं
  rationale: मूल की እምነ እለ संरचना स्वाभाविक रूप से ‘उनसे अलग जो नहीं सोते’ पढ़ी जाती है। अनुवाद इसी वाक्यगत सम्बन्ध को रखता है, जबकि व्यक्तियों की ठीक पहचान तय नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली अपनाई गई है। दर्शन की ठोस छवि के लिए ‘मुख’ रखा गया है; ‘चारों ओर’ स्थानसूचक अर्थ देता है और ईश्वरीय आकृति के विषय में अनावश्यक निष्कर्ष से बचता है।
