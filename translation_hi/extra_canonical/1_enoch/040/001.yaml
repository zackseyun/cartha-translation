base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/040/001.yaml
  text: And after that I saw thousands of thousands and ten thousands of ten thousands[a], whose number and count were without end[e][d][c][b], standing before the Lord of Spirits.
translation:
  language: hi
  text: और इसके बाद मैंने हज़ारों के हज़ार और दस हज़ारों के दस हज़ार देखे;[a] जिनकी न तो संख्या थी, न गिनती। वे आत्माओं के प्रभु के सामने खड़े थे।[b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध इथियोपिक प्रतिलिपि में इस संख्यात्मक समूह के बाद का एक पद (“*ኍልቈ”) पाठगत रूप से अनिश्चित है। उसके बाद का पाठ ‘संख्या और गिनती नहीं थी’ का भाव देता है।
    reason: textual_variant
  - marker: b
    text: ऐसी ही स्वर्गीय राजसभा के दर्शन के लिए दानिय्येल 7:10 की तुलना करें।
    reason: cross_reference
  - marker: c
    text: 'वैकल्पिक अनुवाद: “जिनकी कोई गिनती न थी।”'
    reason: lexical_alternative
  - marker: d
    text: 'अधिक शाब्दिक रूप: “उनकी संख्या और गिनती नहीं थी।”'
    reason: previous_rendering
  - marker: e
    text: इसे “आत्माओं का स्वामी” भी अनूदित किया जा सकता है। गीज़ में निश्चित उपपद न होने के कारण ‘आत्माओं’ की निश्चितता केवल व्याकरण से तय नहीं होती; इस खंड में यह पद एक स्थिर ईश्वरीय उपाधि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ፡ እምድኅረዝ
  choice: इसके बाद मैंने ... देखे
  rationale: संयोजक सहित पूर्ण क्रिया और कालसूचक पद को स्वाभाविक आधुनिक हिन्दी में रखा गया है; इससे दर्शन-वर्णन की क्रमिक शैली बनी रहती है।
- source_word: አእላፈ፡ አእላፍ
  choice: हज़ारों के हज़ार
  rationale: दोहराए गए सामी संख्यात्मक विन्यास को बनाए रखकर अत्यन्त विशाल समूह का भाव व्यक्त किया गया है।
- source_word: ትእልፊተ፡ ትእልፊት
  choice: दस हज़ारों के दस हज़ार
  rationale: गीज़ पद का मूल अर्थ ‘दस हज़ार’ है; ‘असंख्य’ कहकर ठोस चित्र को मिटाने के बजाय दोहरे विन्यास को सुरक्षित रखा गया है।
- source_word: ኍልቈ፡ ወኃሳበ፡ አልቦሙ
  choice: जिनकी संख्या और गिनती का कोई अंत न था
  rationale: उपलब्ध पाठ में ‘संख्या’ और ‘गिनती/हिसाब’ दोनों पद दिखते हैं। हिन्दी में नकारात्मक अस्तित्व-वाक्य को सहज रूप देकर असंख्यता का आशय रखा गया है, जबकि संदिग्ध पाठ की सूचना पादटिप्पणी में दी गई है।
- source_word: ይቀውሙ፡ ቅድመ
  choice: के सामने खड़े थे
  rationale: दरबारी अथवा स्वर्गीय सभा की औपचारिक मुद्रा को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: እግዚአ፡ መናፍስት
  choice: आत्माओं का प्रभु
  rationale: हनोक की दृष्टान्त-पुस्तिका में बार-बार आने वाली औपचारिक ईश्वरीय उपाधि को बिना किसी अतिरिक्त सांप्रदायिक अर्थ के बनाए रखा गया है। वाक्य में परसर्ग के कारण रूप ‘आत्माओं के प्रभु’ हुआ है।
theological_decisions:
- issue: ‘आत्माओं का प्रभु’ उपाधि का अभिप्राय
  choice: परमेश्वर के लिए प्रयुक्त औपचारिक उपाधि के रूप में ‘आत्माओं का प्रभु’
  alternative: सामान्य अर्थ में ‘आत्माओं का कोई स्वामी’ अथवा आत्माओं पर नियुक्त कोई प्रधान स्वर्गदूत
  rationale: दृष्टान्तों के व्यापक प्रसंग में स्वर्गीय समुदाय इसी प्रभु के सामने खड़ा है और यह पद परमप्रधान की स्थिर उपाधि के रूप में आता है। अनुवाद उपाधि को सुरक्षित रखता है, पर बाद की धर्मवैज्ञानिक शब्दावली नहीं जोड़ता।
- issue: विशाल समूह की गणना
  choice: संख्यात्मक दोहराव और ‘संख्या और गिनती का कोई अंत न था’ दोनों को बनाए रखना
  alternative: केवल ‘असंख्य जन’
  rationale: मूल की अतिशयोक्तिपूर्ण संख्यात्मक छवि और उसके बाद आने वाले अगणनीयता के कथन, दोनों इस दर्शन की व्यापकता और स्वर्गीय सभा की भव्यता का हिस्सा हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, दर्शनात्मक शैली रखी गई है। ‘हज़ारों के हज़ार’ जैसे मूल-सन्निकट विन्यास को जानबूझकर सुरक्षित रखा गया है, जबकि नकारात्मक गणना-वाक्य को सामान्य पाठक के लिए स्वाभाविक बनाया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में अपने संबंधित पद के साथ दिए गए हैं।
