base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/004.yaml
  text: And the God of eternity[a], from there, will tread upon Mount Sinai; he will appear with his host[d][c][b], and he will appear in the strength of his might from heaven.
translation:
  language: hi
  text: और अनन्तकाल का परमेश्वर[a] वहाँ से आकर सीनै पर्वत पर पग धरेगा[b]; वह अपनी सेना के साथ[c] प्रकट होगा, और स्वर्ग से अपने प्रबल सामर्थ्य में प्रकट होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अनन्तकाल का परमेश्वर” के लिए मूल पद का अर्थ “संसार का परमेश्वर” या “युग का परमेश्वर” भी हो सकता है। यहाँ कालगत अर्थ को प्राथमिकता दी गई है।
    reason: lexical_alternative
  - marker: b
    text: “पग धरेगा” का अनुवाद “जाएगा,” “आगे बढ़ेगा” या “निकल पड़ेगा” भी किया जा सकता है। वर्तमान रूप ईश-दर्शन के गंभीर आगमन की छवि बनाए रखता है।
    reason: lexical_alternative
  - marker: c
    text: मूल शब्द का अर्थ “छावनी,” “सैन्य-दल” या “सेना” है। कुछ पुराने अनुवादों में इसे “अपने प्रकटन में” समझा गया था, पर गीज़ शब्द और यूनानी साक्ष्य “सेना/छावनी” का समर्थन करते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: አምላክ ዓለም
  choice: अनन्तकाल का परमेश्वर
  rationale: ዓለም का अर्थ ‘युग/संसार’ भी हो सकता है, पर इस ईश-दर्शन के प्रसंग में यह परमेश्वर की अनन्तता बताने वाली उपाधि के रूप में स्वाभाविक है। सम्बन्धवाचक संरचना को बनाए रखने से मूल की सम्भावित अर्थ-व्याप्ति भी पूरी तरह लुप्त नहीं होती।
- source_word: እምህየ
  choice: वहाँ से आकर
  rationale: यह पिछले प्रसंग में बताए गए स्थान की ओर संकेत करता है। हिन्दी में ‘वहाँ से आकर’ अगले पदबंध ‘सीनै पर्वत पर’ के साथ गति की दिशा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ይከይድ ዲበ
  choice: पर पग धरेगा
  rationale: क्रिया सामान्यतः जाने या आगे बढ़ने का अर्थ दे सकती है; ‘पग धरेगा’ पर्वत पर परमेश्वर के गंभीर आगमन की छवि को बनाए रखता है, पर इसे युद्धात्मक ‘कुचलने’ में नहीं बदलता।
- source_word: ሲና ደብር
  choice: सीनै पर्वत
  rationale: स्थान-नाम और ‘पर्वत’ का आधुनिक मानक हिन्दी रूप।
- source_word: ያስተርኢ
  choice: प्रकट होगा
  rationale: क्रिया का भाव ‘दिखाई देना/अपने को दिखाना’ है। दोनों बार आए समान क्रियारूप को समान हिन्दी अभिव्यक्ति से रखा गया है।
- source_word: በትዕይንቱ
  choice: अपनी सेना के साथ
  rationale: ትዕይንት यहाँ ‘छावनी, सैन्य-दल, सेना’ का अर्थ देता है; उपसर्ग በ को प्रसंगानुसार सहचर्यसूचक ‘के साथ’ कहा गया है।
- source_word: በኃይለ ጽንዑ
  choice: अपने प्रबल सामर्थ्य में
  rationale: मूल की शक्ति और दृढ़ पराक्रम को बताने वाली गहन अभिव्यक्ति को सहज, गरिमापूर्ण हिन्दी में रखा गया है।
- source_word: እምሰማይ
  choice: स्वर्ग से
  rationale: आकाशीय उद्गम को सीधे और स्वाभाविक रूप में व्यक्त करता है।
theological_decisions:
- issue: አምላክ ዓለም में परमेश्वर की उपाधि
  choice: अनन्तकाल का परमेश्वर
  alternative: संसार का परमेश्वर / युग का परमेश्वर
  rationale: प्रसंग ईश-दर्शन का है और पारम्परिक सामी अर्थ-क्षेत्र में ‘युग/अनन्तकाल’ कालगत उपाधि बन सकता है। फिर भी अन्य सम्भावनाओं को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: በትዕይንቱ की ईश-दर्शन सम्बन्धी छवि
  choice: अपनी सेना के साथ
  alternative: अपनी छावनी में; अपने प्रकट होने में
  rationale: गीज़ शब्द का साक्ष्य ‘छावनी/सेना’ का समर्थन करता है और उपलब्ध यूनानी παρεμβολή से भी मेल खाता है। ‘प्रकटन’ वाला अर्थ निकट दिखने वाले किन्तु भिन्न शब्द-परिवार से उत्पन्न समझ प्रतीत होता है; इसलिए उसे मुख्य पाठ में नहीं अपनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। मूल में दो बार आई ‘प्रकट होगा’ की पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है। ‘सेना’ में ‘स्वर्गीय’ शब्द नहीं जोड़ा गया, क्योंकि वह प्रसंग से सम्भव होते हुए भी इस पद में प्रत्यक्ष नहीं है।
