  yaml_path: translation/extra_canonical/1_enoch/001/007.yaml
  text: And the earth shall be rent asunder[a], and everything that is in the earth shall be destroyed[c][b], and judgment shall come upon all.
translation:
  language: hi
  text: और पृथ्वी फट जाएगी, और जो कुछ पृथ्वी के भीतर है, वह सब नष्ट हो जाएगा, और सब पर न्याय आएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘न्याय’ के लिए प्रयुक्त शब्द का अर्थ ‘न्यायशीलता’ या ‘धार्मिकता’ भी हो सकता है; यहाँ वाक्य-विन्यास सब पर आने वाले न्यायिक निर्णय की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ትሠጠጥ
  choice: फट जाएगी
  rationale: यह पाठ पृथ्वी के चिरने या फटने की प्रलयकारी छवि व्यक्त करता है; ‘फट जाएगी’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उस विशिष्ट चित्र को सुरक्षित रखता है।
- source_word: ምድር
  choice: पृथ्वी
  rationale: सार्वभौमिक न्याय के इस प्रसंग में स्थानीय ‘भूमि’ की अपेक्षा ‘पृथ्वी’ अधिक उपयुक्त है।
- source_word: ኵሉ ዘውስተ ምድር
  choice: जो कुछ पृथ्वी के भीतर है, वह सब
  rationale: गीज़ पदबंध का शाब्दिक अर्थ ‘पृथ्वी के भीतर जो कुछ है’ है। असामान्य ‘भीतर’ को बनाए रखने से मूल पाठ की व्यापक और तीखी प्रलयकारी भाषा सुरक्षित रहती है।
- source_word: ይትሐጐል
  choice: नष्ट हो जाएगा
  rationale: क्रिया विनाश या सर्वनाश का बोध कराती है; यह हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: ፍትሕ
  choice: न्याय
  rationale: शब्द ‘न्याय’, ‘धार्मिकता’ अथवा न्यायोचित व्यवस्था का बोध करा सकता है, पर ‘सब पर आएगा’ वाली रचना यहाँ न्यायिक घटना की ओर संकेत करती है।
- source_word: ላዕለ ኵሉ
  choice: सब पर
  rationale: यह मूल के ‘upon/over all’ को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ፍትሕ को नैतिक गुण के रूप में समझा जाए या आने वाली न्यायिक घटना के रूप में।
  choice: न्याय
  alternative: न्यायशीलता या धार्मिकता
  rationale: ‘सब पर आएगा’ का क्रियात्मक ढाँचा आने वाले न्याय का संकेत देता है; फिर भी शब्द की अर्थ-व्याप्ति को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रलय-साहित्य के अनुरूप रखी गई है। ‘पृथ्वी के भीतर’ को जानबूझकर सहजतर ‘पृथ्वी पर’ में नहीं बदला गया, ताकि गीज़ पाठ की वास्तविक असामान्यता बनी रहे।
