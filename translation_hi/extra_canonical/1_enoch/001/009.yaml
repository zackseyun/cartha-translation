base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/009.yaml
  text: And behold[a], he comes with myriads of holy ones, to execute judgment upon them, and to destroy the wicked[c][b], and to rebuke all flesh for everything that the sinful and wicked have done and spoken against him.
translation:
  language: hi
  text: और देखो, वह पवित्र जनों की असंख्य टोलियों[a] के साथ आता है, ताकि उन पर न्याय करे, दुष्टों को नष्ट करे,[c] और समस्त मनुष्यों[b] को उन सभी कामों और बातों के विषय में दोषी ठहराए जो पापियों और दुष्टों ने उसके विरुद्ध किए और कही हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दस-दस हजार पवित्र जनों के साथ।” गीज़ पदबंध एक अत्यन्त विशाल समूह को दर्शाता है और सम्भवतः पारंपरिक संख्यात्मक अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: मूल में शाब्दिक रूप से “सारा मांस” है—यह समस्त मानवजाति के लिए प्रयुक्त पारंपरिक मुहावरा है।
    reason: cultural_note
  - marker: c
    text: इस पद की प्रतिध्वनि यहूदा 14–15 में मिलती है; यहाँ अनुवाद सीधे गीज़ पाठ से किया गया है, न कि नए नियम की बाद की शब्दावली के अनुरूप ढालकर।
    reason: cross_reference
lexical_decisions:
- source_word: ወናሁ
  choice: और देखो
  rationale: दर्शनात्मक और महाप्रलय-संबंधी उद्घोष की प्रत्यक्षता बनाए रखता है।
- source_word: መጽአ
  choice: वह ... आता है
  rationale: गीज़ के रूप की भविष्यसूचक जीवंतता को वर्तमान काल में रखता है और काल को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: በትእልፊተ ቅዱሳን
  choice: अपने पवित्र जनों की असंख्य सेनाओं के साथ
  rationale: विशाल पवित्र समुदाय का भाव स्वाभाविक हिन्दी में देता है; 'पवित्र जन' उनके मनुष्य या स्वर्गदूत होने का निर्णय नहीं करता। 'सेनाओं' विशाल साथ आने वाले समूह का भाव स्पष्ट करता है।
- source_word: ይግበር ፍትሐ
  choice: न्याय करे
  rationale: न्यायिक कार्यवाही का सक्रिय अर्थ संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: ላዕሌሆሙ
  choice: उन पर
  rationale: स्रोत के व्यापक पूर्वसर्गीय संबंध को बनाए रखता है।
- source_word: ይሕጕሎሙ ለረሲዓን
  choice: दुष्टों को नष्ट करे
  rationale: क्रिया के प्रबल दंडात्मक अर्थ को केवल डाँटने या दोष सिद्ध करने तक सीमित नहीं करता।
- source_word: ይዘልፍ ኵሎ ዘሥጋ
  choice: सभी प्राणियों को ... दोषी ठहराए
  rationale: क्रिया का न्यायिक और सार्वजनिक भर्त्सना-संबंधी बल व्यक्त करता है; 'सभी प्राणी' शाब्दिक 'सारा मांस' के पारंपरिक मानव-संदर्भ को पठनीय हिन्दी में देता है।
- source_word: ኵሉ ዘገብሩ ወረሰዩ
  choice: उन सब कामों और बातों के लिए ... किए और कहे हैं
  rationale: प्राप्त पाठ और संशोधन-साक्ष्य के अनुसार कर्म और वचन—दोनों प्रकार के अपराध को स्पष्ट रखता है।
- source_word: ኃጥኣን ወረሲዓን
  choice: पापियों और दुष्टों
  rationale: नैतिक अभियोग के दोनों अलग पदों और उनके जोर को बनाए रखता है।
- source_word: ላዕሌሁ
  choice: उसके विरुद्ध
  rationale: एकवचन सर्वनाम को आने वाले न्यायी से संबद्ध रखता है, पर उसकी पहचान में कोई अतिरिक्त उपाधि नहीं जोड़ता।
theological_decisions:
- issue: आने वाले व्यक्ति की पहचान
  choice: मुख्य पाठ में केवल 'वह'
  alternative: '''प्रभु'' या ''परमेश्वर'''
  rationale: प्रस्तुत गीज़ पाठ में कर्ता अंतर्निहित तृतीय पुरुष है; संदर्भ से दिव्य पहचान समझी जा सकती है, पर स्रोत में अनुपस्थित उपाधि जोड़ना उचित नहीं।
- issue: '''पवित्र जनों'' की पहचान'
  choice: '''पवित्र जन'''
  alternative: '''स्वर्गदूत'' या ''संत'''
  rationale: महाप्रलय-संबंधी संदर्भ में स्वर्गीय अनुचर सम्भावित हैं, फिर भी स्रोत उन्हें स्पष्ट रूप से केवल पवित्र जन कहता है; इसलिए अस्पष्टता सुरक्षित रखी गई है।
- issue: '''सभी प्राणी'' का दायरा'
  choice: संपूर्ण मानवजाति के पारंपरिक अर्थ को टिप्पणी में स्पष्ट करना
  alternative: मुख्य पाठ में सीधे 'सभी मनुष्यों'
  rationale: स्रोत का ठोस सामी मुहावरा मानवजाति को सूचित करता है; पठनीय हिन्दी के साथ उसकी पृष्ठभूमि पादटिप्पणी में संरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। दर्शनात्मक 'और देखो' तथा न्याय-संबंधी गंभीरता रखी गई है। कर्ता और 'पवित्र जनों' की पहचान में स्रोत की अस्पष्टता सुरक्षित है।
