base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/003.yaml
  text: 'Concerning the Chosen Ones I said, and I uttered a parable concerning them: The Holy and Great One will go forth from his dwelling.'
translation:
  language: hi
  text: 'चुने हुओं के विषय में मैंने कहा, और उनके विषय में एक दृष्टान्त सुनाया: पवित्र और महान जन अपने निवास से निकलेंगे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅሩያን
  choice: चुने हुए
  rationale: बहुवचन रूप का सीधा और स्वाभाविक हिन्दी अनुवाद; किसी विशिष्ट साम्प्रदायिक पदावली को नहीं जोड़ता।
- source_word: እቤ
  choice: मैंने कहा
  rationale: प्रथम पुरुष एकवचन भूतकाल को सरलता से व्यक्त करता है और उपलब्ध अंग्रेज़ी परामर्श-पाठ से भी मेल खाता है।
- source_word: አውሣእኩ
  choice: सुनाया
  rationale: दृष्टान्त के साथ प्रयुक्त क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है; केवल ‘उत्तर दिया’ कहना इस संदर्भ में असंगत होगा।
- source_word: ምስለ
  choice: दृष्टान्त
  rationale: कथन या उपमा-प्रधान वाणी के अर्थ को प्रतिष्ठित, सामान्य हिन्दी बाइबलीय शब्दावली में व्यक्त करता है।
- source_word: ቅዱስ ወዐቢይ
  choice: पवित्र और महान जन
  rationale: दोनों उपाधियों को बनाए रखते हुए उन्हें किसी ऐसे निश्चित ईश-नाम में नहीं बदलता जो स्रोत में स्पष्ट नहीं है।
- source_word: ማኅደሩ
  choice: अपने निवास
  rationale: एकवचन संबंधसूचक रूप और रहने के स्थान के सामान्य अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: ‘पवित्र और महान’ की पहचान
  choice: इसे ‘पवित्र और महान जन’ उपाधि के रूप में रखा गया है।
  alternative: ‘परमेश्वर’ या किसी विशिष्ट ईश-नाम का प्रयोग।
  rationale: इस पंक्ति में व्यक्तित्व का नाम स्पष्ट नहीं किया गया; इसलिए अनुवाद स्रोत की उपाधि और उसकी संभावित व्याख्यात्मक खुलावट को बनाए रखता है।
- issue: सम्मानसूचक क्रिया-सामंजस्य
  choice: ‘निकलेंगे’
  alternative: ‘निकलेगा’
  rationale: हिन्दी में दिव्य अथवा अत्यंत सम्मानित एकवचन व्यक्ति के लिए बहुवचन क्रिया स्वाभाविक और गरिमापूर्ण है; इससे स्रोत का संख्यात्मक अर्थ नहीं बदला जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और पाठयोग्य रखी गई है। वाक्य की भविष्यकालीन घोषणा तथा स्रोत में निहित उपाधि-संबंधी अस्पष्टता सुरक्षित है।
