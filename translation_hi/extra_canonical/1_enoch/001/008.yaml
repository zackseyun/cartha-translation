base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/008.yaml
  text: And he will make peace for the righteous[a], and he will guard the chosen ones; and favor will be upon them, and they will all be God's, and they will prosper and be blessed[c][b], and the light of God will shine upon them.
translation:
  language: hi
  text: और वह धर्मियों को शांति प्रदान करेगा[a] और चुने हुओं की रक्षा करेगा। उन पर कृपा बनी रहेगी; वे सब परमेश्वर के होंगे, फलेंगे-फूलेंगे[b] और आशीष पाएँगे; और परमेश्वर का प्रकाश उन पर चमकेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरंभिक शब्द उपलब्ध पाठ-साक्ष्य में कुछ असंगत हैं; संभव अर्थ यह भी है, “वह धर्मियों के लिए शांति स्थापित करेगा।”
    reason: textual_variant
  - marker: b
    text: या “भलाई करेंगे,” “उन्नति करेंगे,” अथवा “समृद्ध होंगे।” मूल क्रिया का सटीक आशय अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰላመ ይገብር
  choice: शांति प्रदान करेगा
  rationale: गीज़ पदबंध का अर्थ धर्मियों के लिए शांति करना या स्थापित करना है। हिंदी में ‘शांति प्रदान करेगा’ स्वाभाविक है और ‘मेल करना’ से उत्पन्न पूर्व-विरोध का अनचाहा भाव नहीं लाता।
- source_word: የዓቅቦሙ
  choice: रक्षा करेगा
  rationale: यह क्रिया न्याय के बीच चुने हुओं को सुरक्षित रखने का भाव देती है; ‘रक्षा करेगा’ आधुनिक हिंदी में स्पष्ट और गरिमापूर्ण है।
- source_word: ሕሩያን
  choice: चुने हुए
  rationale: यह पद धर्मियों के समानांतर एक अलग उपाधि है। ‘चुने हुए’ मूल अर्थ को पारदर्शी रखता है और बाद की किसी विशिष्ट धर्मसैद्धांतिक शब्दावली को नहीं थोपता।
- source_word: ሣህል
  choice: कृपा
  rationale: यहाँ आशय उन पर बनी रहने वाली परमेश्वर की अनुकूल दृष्टि से है। ‘कृपा’ हिंदी में इस व्यापक भाव को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ዘአምላክ
  choice: परमेश्वर के होंगे
  rationale: संबंधसूचक पद परमेश्वर से संबंधित होने या उसके अधिकार में होने का भाव देता है; यह अनुवाद ‘धर्मी स्वभाव के होंगे’ जैसा नैतिक अर्थ जोड़ने से बचता है।
- source_word: ይሴርሑ
  choice: फलेंगे-फूलेंगे
  rationale: क्रिया भलाई, उन्नति या समृद्ध दशा का संकेत देती है। ‘फलेंगे-फूलेंगे’ केवल भौतिक धन तक अर्थ को सीमित किए बिना समग्र कल्याण व्यक्त करता है; अनिश्चितता पाद-टिप्पणी में रखी गई है।
- source_word: ይትባረኩ
  choice: आशीष पाएँगे
  rationale: यह निष्क्रिय आशीष-वाचक रूप को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: ይበርህ ሎሙ ብርሃነ አምላክ
  choice: परमेश्वर का प्रकाश उन पर चमकेगा
  rationale: यह मूल के प्रकाश और दिव्य आलोक की प्रलयदर्शी छवि तथा ‘उन पर’ के संबंध को बनाए रखता है।
theological_decisions:
- issue: धर्मियों और चुने हुओं की पहचान
  choice: ‘धर्मी’ और ‘चुने हुए’ को दो समानांतर, पर अलग-अलग पदों के रूप में बनाए रखना
  alternative: दोनों को मिलाकर एक ही समूह-संज्ञा बना देना
  rationale: पद में दोनों उपाधियाँ क्रम से आती हैं। उन्हें अलग रखना पाठ की धर्मवैचारिक परतों को सुरक्षित रखता है और उनके संबंध को अनावश्यक रूप से तय नहीं करता।
- issue: ዘአምላክ का संबंधसूचक अर्थ
  choice: वे सब परमेश्वर के होंगे
  alternative: वे सब भक्त/ईश्वरीय होंगे; अथवा वे सब परमेश्वर की प्रजा होंगे
  rationale: मूल पद सबसे स्वाभाविक रूप से संबंध या अधिकार व्यक्त करता है। ‘भक्त’ इसे नैतिक गुण में बदल देता, जबकि ‘प्रजा’ मूल में निहित न होने वाली संज्ञा जोड़ता।
- issue: धर्मियों को दी जाने वाली शांति
  choice: वह धर्मियों को शांति प्रदान करेगा
  alternative: वह धर्मियों के लिए शांति स्थापित करेगा
  rationale: दोनों पाठ के दातृ/हितार्थ भाव के अनुकूल हैं। मुख्य पाठ में स्वाभाविक हिंदी चुनी गई है, पर इसे परमेश्वर और धर्मियों के बीच पहले के वैर के बाद ‘मेल-मिलाप’ के अर्थ में नहीं लिया गया।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और हल्का काव्यात्मक-पवित्रशास्त्रीय स्वर रखा गया है। वाक्य-रचना सामान्य पाठक के लिए स्पष्ट है। ‘धर्मी,’ ‘चुने हुए,’ ‘कृपा’ और ‘परमेश्वर का प्रकाश’ जैसे प्रमुख पदों को अलग और पहचाने योग्य रखा गया है।
