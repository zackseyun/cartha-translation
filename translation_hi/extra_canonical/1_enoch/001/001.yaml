base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/001.yaml
  text: The words of the blessing of Henok[a], with which he blessed the chosen and the righteous who will be present on the day of affliction[c][b], for the removal of all the wicked and godless.
translation:
  language: hi
  text: हनोक की आशीष के वचन, जिनसे उसने उन चुने हुओं और धर्मियों को आशीष दी जो क्लेश के दिन[a] उपस्थित होंगे, सभी दुष्टों और भक्तिहीनों[b] को हटाने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘क्लेश के दिन’ का अनुवाद ‘संकट के दिन’ या ‘पीड़ा के दिन’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: अन्तिम पदावली में ‘दुष्ट’ और ‘भक्तिहीन’ दो अलग शब्द हैं; ‘भक्तिहीन’ को ‘ईश्वर-विमुख’ या ‘अधार्मिक’ भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ቃለ ፡ በረከት
  choice: आशीष के वचन
  rationale: एकवचन ቃለ शीर्षकीय अर्थ में कथन या वचन को सूचित करता है; स्वाभाविक हिन्दी में ‘आशीष के वचन’ पूरे आशीर्वचन की विषयवस्तु को व्यक्त करता है और आरम्भिक सूत्र की गरिमा बनाए रखता है।
- source_word: ዘሄኖክ
  choice: हनोक की
  rationale: ‘हनोक’ गीइज़ नाम-रूप के निकट है और हिन्दी पाठकों के लिए भी परिचित रूप है। सम्बन्धवाचक रचना को स्वाभाविक हिन्दी में ‘हनोक की’ कहा गया है।
- source_word: በከመ ፡ ባረከ
  choice: जिनसे उसने ... आशीष दी
  rationale: यह रचना पहले उल्लिखित आशीष के वचनों को उस माध्यम अथवा विषयवस्तु के रूप में प्रस्तुत करती है जिनसे हनोक ने आशीष दी।
- source_word: ኅሩያነ ፡ ወጻድቃነ
  choice: चुने हुओं और धर्मियों
  rationale: दोनों समन्वित पदों को अलग रखा गया है। ‘चुने हुए’ सामान्य और धर्मसिद्धान्त की दृष्टि से अनावश्यक रूप से तकनीकी नहीं है; ‘धर्मी’ धार्मिक और नैतिक दोनों अर्थों को बनाए रखता है।
- source_word: እለ ፡ ሀለዉ ፡ ይኩኑ
  choice: जो ... उपस्थित होंगे
  rationale: भावी समय में उस परिस्थिति में मौजूद रहने का आशय ‘उपस्थित होंगे’ से स्पष्ट और स्वाभाविक रूप में आता है।
- source_word: በዕለተ ፡ ምንዳቤ
  choice: क्लेश के दिन
  rationale: पद घोर संकट या पीड़ा के समय को सूचित करता है। ‘क्लेश’ संक्षिप्त, गंभीर और हिन्दी धार्मिक साहित्य में बोधगम्य है, पर इसे अपने-आप ‘न्याय का दिन’ नहीं बनाया गया।
- source_word: ለአሰስሎ
  choice: ताकि ... हटा दिया जाए
  rationale: उद्देश्यसूचक रूप को हिन्दी में ‘ताकि’ से व्यक्त किया गया है। कर्मवाच्य मूल पाठ के हटाए जाने के भाव को रखता है और हटाने वाले कर्ता को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: ኵሎ ፡ እኩያነ ፡ ወረሲዓነ
  choice: सभी दुष्टों और भक्तिहीनों
  rationale: ‘सभी’ समष्टिगत बल को रखता है। ‘दुष्ट’ और ‘भक्तिहीन’ दो अलग श्रेणियों या विशेषताओं को बनाए रखते हैं; दूसरे पद को केवल ‘पापी’ कहने से यह भेद धुँधला पड़ता।
theological_decisions:
- issue: आशीष पाने वाले समूह का स्वरूप
  choice: चुने हुओं और धर्मियों
  alternative: चुने हुए धर्मियों
  rationale: गीइज़ पाठ दोनों पदों को ‘और’ से जोड़ता है। उन्हें एक संयुक्त विशेषण में समेटने के बजाय अलग रखना पाठ की सम्भावित श्रेणियों अथवा दोहरे वर्णन की अस्पष्टता को सुरक्षित रखता है।
- issue: በዕለተ ምንዳቤ का युगान्तविषयक अर्थ
  choice: क्लेश के दिन
  alternative: न्याय के दिन
  rationale: सन्दर्भ में न्याय निहित हो सकता है, पर संज्ञा का प्रत्यक्ष अर्थ संकट या क्लेश है। ‘न्याय’ कहने से पाठ की अपेक्षा अधिक अर्थ निर्धारित हो जाता।
- issue: ለአሰስሎ का सम्बन्ध
  choice: ताकि सभी दुष्टों और भक्तिहीनों को हटा दिया जाए
  alternative: जब सभी दुष्ट और भक्तिहीन हटा दिए जाएँगे
  rationale: मूल में उद्देश्यसूचक रूप है, केवल कालसूचक उपवाक्य नहीं। हिन्दी वाक्य उद्देश्य-संबंध को बनाए रखता है, यद्यपि यह सम्बन्ध आशीष, क्लेश के दिन, या व्यापक घटना से कैसे जुड़ता है, इसे अतिरिक्त व्याख्या द्वारा सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर शीर्षकीय और प्रकाशनात्मक गरिमा बनाए रखती है। ‘आशीष’, ‘धर्मी’ और ‘क्लेश’ जैसे परिचित धार्मिक शब्द रखे गए हैं; वाक्य को अनावश्यक रूप से किसी विशिष्ट सम्प्रदाय की न्याय-दिवस या चुने हुओं सम्बन्धी शब्दावली में नहीं ढाला गया है।
