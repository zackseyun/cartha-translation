base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/002.yaml
  text: 'And Enoch answered and said: "A righteous man[a], whose eyes were opened by God, saw a holy vision in the heavens, which the angels showed me; and from them I heard everything, and I understood what I saw—but not for this generation[d][c][b], but for a distant one that is to come."'
translation:
  language: hi
  text: और हनोक ने उत्तर देकर कहा, “एक धर्मी मनुष्य[d]—जिसकी आँखें परमेश्वर ने खोल दी थीं[a]—ने स्वर्गों[b] में एक पवित्र दर्शन देखा, जिसे स्वर्गदूतों ने मुझे दिखाया। उनसे मैंने सब कुछ सुना, और जो मैंने देखा उसे समझा—पर यह इस पीढ़ी के लिए नहीं, बल्कि एक ऐसी दूर की पीढ़ी के लिए है जो आनेवाली है[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस खंड का गीज़ पाठ और वाक्य-विन्यास कुछ कठिन है; आशय यह है कि हनोक की दर्शन-शक्ति परमेश्वर ने खोल दी थी।
    reason: textual_variant
  - marker: b
    text: मूल में ‘स्वर्ग’ बहुवचन में है। ऐसा प्रयोग सामी और प्रकाशनात्मक साहित्य में सामान्य है।
    reason: cultural_note
  - marker: c
    text: 'इसका अनुवाद यह भी हो सकता है: ‘बल्कि उस दूर की पीढ़ी के लिए जो आनेवाली है।’ अंतिम पद एक सामूहिक भाव वाली भावी पीढ़ी की ओर संकेत कर सकता है।'
    reason: lexical_alternative
  - marker: d
    text: 'आरंभ का वाक्य-विन्यास कठिन है। एक वैकल्पिक संयोजन है: ‘और धर्मी मनुष्य हनोक ने उत्तर देकर कहा—जब परमेश्वर ने उसकी आँखें खोल दी थीं—“मैंने देखा ...”’ किंतु मूल में ‘उसने देखा’ तीसरे पुरुष में है।'
    reason: previous_rendering
lexical_decisions:
- source_word: አውሥአ ወይቤ
  choice: उत्तर देकर कहा
  rationale: यह सामी शैली का प्रचलित कथन-सूत्र है। तत्काल कोई प्रश्न न होने पर भी ‘उत्तर देकर कहा’ मूल की कथात्मक बनावट को सुरक्षित रखता है।
- source_word: ብእሲ ጻድቅ
  choice: एक धर्मी मनुष्य
  rationale: ‘धर्मी’ नैतिक और धर्मवैचारिक बल को बनाए रखता है; अनिश्चित रूप के लिए ‘एक’ स्वाभाविक है।
- source_word: ዘእምኀበ እግዚአብሔር [እንዘ] አዕይንቲሁ ክሡታት
  choice: जिसकी आँखें परमेश्वर ने खोल दी थीं
  rationale: यह दिव्य रूप से प्रदान की गई दर्शन-क्षमता को सहज हिन्दी में व्यक्त करता है और ‘खुली/उघाड़ी हुई’ के मूल बिंब को बनाए रखता है।
- source_word: ወይሬኢ
  choice: उसने ... देखा
  rationale: क्रिया तीसरे पुरुष एकवचन में है। आगे ‘मुझे’ और ‘मैंने’ के प्रथम पुरुष से होने वाले असामान्य बदलाव को मूल के अनुसार जानबूझकर सुरक्षित रखा गया है।
- source_word: ራእየ ቅዱሰ
  choice: एक पवित्र दर्शन
  rationale: व्याकरण की दृष्टि से ‘पवित्र’ का ‘दर्शन’ को विशेषित करना अधिक स्वाभाविक है; ‘पवित्र जन का दर्शन’ अनावश्यक धर्मवैचारिक विशिष्टता जोड़ देगा।
- source_word: ዘበሰማያት
  choice: स्वर्गों में
  rationale: बहुवचन सामी और प्रकाशनात्मक विश्व-दृष्टि की अभिव्यक्ति है, इसलिए उसे एकवचन में समतल नहीं किया गया।
- source_word: ዘአርአዩኒ መላእክት
  choice: जिसे स्वर्गदूतों ने मुझे दिखाया
  rationale: दृश्य प्रकाशन और स्वर्गदूतों की मध्यस्थ भूमिका दोनों स्पष्ट रहती हैं।
- source_word: ወሰማዕኩ እምኀቤሆሙ ኵሎ
  choice: उनसे मैंने सब कुछ सुना
  rationale: ‘सब कुछ’ मूल के समग्रता-सूचक पद का बल बनाए रखता है।
- source_word: ወአእመርኩ አነ ዘእሬኢ
  choice: जो मैंने देखा उसे समझा
  rationale: क्रिया केवल देखने के बजाय जानने या समझने का भाव देती है, जो प्रकाशनात्मक संदर्भ में महत्त्वपूर्ण है।
- source_word: ወአኮ ለዛ ትውልድ አላ ለዘ ይመጽእ ርኁቃት
  choice: पर यह इस पीढ़ी के लिए नहीं, बल्कि आनेवाली एक दूर की पीढ़ी के लिए है
  rationale: ‘पीढ़ी’ और दूरी—दोनों भाव सुरक्षित हैं। हिन्दी में ‘आनेवाली एक दूर की पीढ़ी’ मूल के भविष्याभिमुख विरोध को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: क्या ራእየ ቅዱሰ का अर्थ ‘पवित्र दर्शन’ है या ‘पवित्र जन का दर्शन’
  choice: एक पवित्र दर्शन
  alternative: पवित्र जन का दर्शन
  rationale: गीज़ वाक्य-विन्यास में विशेषण का ‘दर्शन’ को विशेषित करना अधिक स्वाभाविक है। वैकल्पिक अनुवाद मूल से अधिक विशिष्ट धर्मवैचारिक दावा करेगा।
- issue: प्रकाशन के कालगत लक्ष्य को कैसे व्यक्त किया जाए
  choice: इस पीढ़ी के लिए नहीं, बल्कि आनेवाली एक दूर की पीढ़ी के लिए
  alternative: इस पीढ़ी के लिए नहीं, बल्कि दूर भविष्य के लोगों के लिए
  rationale: चुना हुआ रूप एकवचन ‘पीढ़ी’ और दूरी के मूल भाव दोनों को बचाता है तथा उसे सामान्य भविष्यवाणी में नहीं बदलता।
- issue: तीसरे पुरुष से प्रथम पुरुष में अचानक बदलाव
  choice: ‘उसने ... देखा’ के बाद ‘मुझे/मैंने’ को बनाए रखा
  alternative: पूरे कथन को प्रथम पुरुष ‘मैंने देखा’ में समतल करना
  rationale: गीज़ में ‘देखा’ तीसरे पुरुष एकवचन है, जबकि आगे कथन प्रथम पुरुष में जाता है। इस तनाव को संपादकीय रूप से मिटाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर ‘धर्मी’, ‘दर्शन’, ‘स्वर्गदूत’ और ‘पीढ़ी’ जैसे गरिमापूर्ण एवं व्यापक रूप से समझे जाने वाले पद रखे गए हैं। मूल के सामी शैली वाले ‘उत्तर देकर कहा’ तथा तीसरे से प्रथम पुरुष में असामान्य बदलाव को जानबूझकर सुरक्षित रखा गया है। विराम-चिह्न लंबे वाक्य को सामान्य पाठक के लिए स्पष्ट बनाते हैं।
