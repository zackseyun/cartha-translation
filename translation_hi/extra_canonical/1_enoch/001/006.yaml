  text: And the lofty mountains will quake, and the high hills will be brought low; they will melt like wax before the blaze.
translation:
  language: hi
  text: और ऊँचे पर्वत काँप उठेंगे[a], और ऊँची पहाड़ियाँ नीची कर दी जाएँगी[b]; वे ज्वाला के सामने मोम के समान पिघल जाएँगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: हिल उठेंगे; थरथराएँगे।'
    reason: lexical_alternative
  - marker: b
    text: 'या: नीचे किए जाएँगे; दीन किए जाएँगे।'
    reason: lexical_alternative
  - marker: c
    text: 'या: ज्वाला या आग के सामने मोम के समान।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይደነግፁ (yǝdänägǝṣu)
  choice: काँप उठेंगे
  rationale: यहाँ क्रिया बहुवचन कर्ता के साथ अकर्मक अर्थ देती है। ‘काँप उठेंगे’ प्रलय-दर्शन की तीव्रता और अकर्मकता दोनों बनाए रखता है।
- source_word: አድባር (ʾadbar)
  choice: पर्वत
  rationale: यह पर्वतीय ऊँचाइयों के लिए सामान्य बहुवचन संज्ञा है और समानांतर ‘पहाड़ियों’ के साथ स्वाभाविक बैठती है।
- source_word: ነዋኀን / ነዋኃት (newaḥn / newaḥat)
  choice: ऊँचे / ऊँची
  rationale: स्रोत में यही विशेषण क्रमशः पर्वतों और पहाड़ियों की ऊँचाई बताता है; हिंदी में लिंगानुसार रूप रखे गए हैं।
- source_word: ይቴሐቱ (yǝtēḥatu)
  choice: नीची कर दी जाएँगी
  rationale: कर्मवाच्य में नीचे किए जाने का भाव सुरक्षित रहता है और ऊँचाई के उलट जाने की छवि स्पष्ट होती है।
- source_word: አውግር (ʾawgr)
  choice: पहाड़ियाँ
  rationale: यह ‘पर्वत’ के साथ स्थलाकृतिक समानांतरता बनाए रखने वाला स्वाभाविक हिंदी शब्द है।
- source_word: ይትመሰዉ (yǝtmäsäw)
  choice: पिघल जाएँगी
  rationale: मूल क्रिया का सीधा अर्थ पिघलना है; यह भौतिक और सजीव बिंब को बनाए रखता है।
- source_word: መዓረ (mäʿärä)
  choice: मोम
  rationale: मूल शब्द मोम को सूचित करता है; ‘मधुमोम’ कहना अनावश्यक रूप से अधिक विशिष्ट होता।
- source_word: ግራ (gǝra)
  choice: के सामने
  rationale: यह ‘के सम्मुख/उपस्थिति में’ का संक्षिप्त और स्वाभाविक हिंदी रूप है।
- source_word: እም ላህብ (ʾǝm lāhb)
  choice: ज्वाला के सामने
  rationale: lāhb के ‘ज्वाला/लपट’ अर्थ को ‘ज्वाला’ निकटता से व्यक्त करता है; पूर्वसर्गीय संबंध ‘के सामने’ से दिया गया है।
