  text: And the moon will alter its order[c][b][a], and it will not appear in its season.
translation:
  language: hi
  text: और चन्द्रमा[a] अपनी व्यवस्था बदल देगा, और अपने समय[b] पर दिखाई नहीं देगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ शब्द ወርኅ का अर्थ ‘चन्द्रमा’ या ‘महीना’ हो सकता है; यहाँ ज्योति-पिंड संबंधी प्रसंग ‘चन्द्रमा’ के पक्ष में है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘अपने ही समय में’; इसका अनुवाद ‘अपने मौसम में’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘देखा नहीं जाएगा।’ मूल अभिव्यक्ति उचित समय पर उसके दृश्य होने पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኅ
  choice: चन्द्रमा
  rationale: इस ज्योति-पिंड संबंधी प्रसंग में शब्द का अर्थ ‘महीना’ नहीं, बल्कि ‘चन्द्रमा’ होना अधिक स्वाभाविक है; आगे दृश्य आकाशीय व्यवहार का वर्णन है।
- source_word: ይዌልጥ
  choice: बदल देगा
  rationale: क्रिया परिवर्तन या भिन्न हो जाने को व्यक्त करती है। यह अनुवाद स्थापित क्रम से विचलन का भाव रखता है, पर उसके कारण की व्याख्या नहीं जोड़ता।
- source_word: ሥርዓቶ
  choice: अपनी व्यवस्था
  rationale: यह शब्द व्यवस्थित विन्यास, निर्धारित रीति या क्रम को सूचित करता है। ‘व्यवस्था’ आकाशीय नियमितता का भाव रखते हुए सामान्य हिन्दी में स्वाभाविक है।
- source_word: ወኢይትረአይ
  choice: दिखाई नहीं देगा
  rationale: मूल क्रिया का आशय देखे जाने या दृश्य होने से है। किसी आकाशीय पिंड के लिए ‘दिखाई नहीं देगा’ सहज और ठोस अनुवाद है।
- source_word: በዘመኑ ዚአሁ
  choice: अपने समय पर
  rationale: वाक्यांश का निकट अर्थ ‘उसके अपने समय में’ है। यह पाठ की पुनरुक्ति और प्राकृतिक चक्र के समय से विचलन को सुरक्षित रखता है तथा मूल में निहित न होने पर भी ‘नियत’ जैसा अतिरिक्त शब्द नहीं जोड़ता।
theological_decisions:
- issue: क्या पद को केवल एक खगोलीय अनियमितता मानकर अनूदित किया जाए या स्थापित ब्रह्माण्डीय व्यवस्था के विघटन के रूप में?
  choice: ‘अपनी व्यवस्था बदल देगा’ और ‘अपने समय पर दिखाई नहीं देगा’—दोनों पक्षों को खुला रखा गया है।
  alternative: इसे केवल चन्द्रमा की कला बदलने या महीने की गणना बदलने के रूप में स्पष्ट कर देना।
  rationale: मूल पाठ व्यवस्थित आकाशीय गति और उचित समय—दोनों की भाषा इस्तेमाल करता है, पर यहाँ उनके धार्मिक आशय को स्पष्ट रूप से नहीं समझाता। इसलिए अनुवाद तनाव को बनाए रखता है और अतिरिक्त सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण गद्य। ‘व्यवस्था’ से ሥርዓት का निर्धारित क्रम व्यक्त किया गया है, जबकि ‘अपने समय पर’ मूल की पुनरुक्ति और अस्पष्टता को बनाए रखता है।
