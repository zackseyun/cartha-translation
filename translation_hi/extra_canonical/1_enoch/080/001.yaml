base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/080/001.yaml
  text: And in those days Uriel the angel answered me and said to me[a], “Behold, I have shown you everything, Enoch, and I have revealed everything to you, that you may look upon this sun and this moon and those who lead the stars of heaven[c][b], and all those who turn them—their works and their times and their risings.”
translation:
  language: hi
  text: और उन दिनों स्वर्गदूत ऊरीएल ने मुझे उत्तर दिया[a] और मुझसे कहा, “देखो, हनोक, मैंने तुम्हें सब कुछ दिखाया है और तुम्हारे सामने सब कुछ प्रकट किया है, ताकि तुम इस सूर्य और इस चंद्रमा को, आकाश के तारों की अगुवाई करने वालों[c] को, और उन सबको जो उन्हें घुमाते हैं, देख सको—उनके कार्य, उनके समय और उनके अस्त होने[b] को।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उत्तर दिया’ का अनुवाद ‘प्रत्युत्तर दिया’ भी हो सकता है; इस पद में उससे पहले का कोई प्रश्न नहीं दिया गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘उनके प्रवेश’। इस पुस्तक की खगोलीय कल्पना में ज्योतियों का पश्चिमी द्वारों में प्रवेश करना उनके अस्त होने को दर्शाता है।
    reason: source_cultural_context
  - marker: c
    text: या ‘मार्गदर्शन करने वालों’। मूल पाठ तारों को चलानेवाले व्यक्तिवाचक कर्ताओं की भाषा का प्रयोग करता है, पर उनकी पहचान को और स्पष्ट नहीं करता।
    reason: lexical_and_theological_ambiguity
lexical_decisions:
- source_word: አውሥአኒ
  choice: मुझे उत्तर दिया
  rationale: मूल क्रिया का सामान्य अर्थ ‘उत्तर देना/प्रत्युत्तर देना’ है। इसी को रखा गया है, यद्यपि इस पद में पहले का प्रश्न स्पष्ट नहीं है।
- source_word: ነዋ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है। ‘देखो’ आधुनिक, सहज और गरिमापूर्ण हिन्दी है।
- source_word: አርአይኩከ
  choice: मैंने तुम्हें ... दिखाया है
  rationale: कारक-दृश्य क्रिया का अर्थ किसी को दिखाना है; पूर्ण कार्य की वर्तमान प्रासंगिकता व्यक्त की गई है।
- source_word: ከሠትኩ ለከ
  choice: तुम्हारे सामने ... प्रकट किया है
  rationale: मूल में खोलने या प्रकट करने का भाव है; यह प्रकाशन-साहित्य की भाषा को बनाए रखता है।
- source_word: ትርአዮ
  choice: ताकि तुम ... देखो
  rationale: उद्देश्यसूचक रूप को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ይመርኅዎሙ
  choice: अगुवाई करनेवालों
  rationale: क्रिया का अर्थ अगुवाई या मार्गदर्शन करना है। व्यक्तिवाचक संबंधवाचक रचना को बनाए रखा गया है।
- source_word: ከዋክብተ ሰማይ
  choice: आकाश के तारे
  rationale: यह मूल संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ይመይጥዎሙ
  choice: उन्हें घुमाते हैं
  rationale: मूल में घुमाने या मोड़ने की गति का भाव है; आधुनिक खगोलीय यांत्रिकी को पाठ में आरोपित नहीं किया गया।
- source_word: ግብሮሙ
  choice: उनके कार्य
  rationale: शब्द का व्यापक अर्थ कार्य या क्रियाएँ है। खगोलीय संदर्भ में ‘संचालन’ संभव है, पर वह अधिक व्याख्यात्मक होता।
- source_word: አዝማኖሙ
  choice: उनके समय
  rationale: मूल शब्द समयों या ऋतुओं को सूचित कर सकता है; ‘समय’ उसकी व्यापकता सुरक्षित रखता है।
- source_word: ሙባኢሆሙ
  choice: उनके अस्त होने
  rationale: यह शब्द ‘प्रवेश करना’ मूल से बना है। 1 हनोक की खगोलीय व्यवस्था में पश्चिमी द्वारों में प्रवेश सूर्य या अन्य ज्योतियों के अस्त होने को सूचित करता है; इसलिए ‘उदय’ नहीं चुना गया।
theological_decisions:
- issue: आकाशीय पिंडों से जुड़े अगुवों की पहचान
  choice: ‘अगुवाई करनेवालों’ और ‘जो उन्हें घुमाते हैं’ जैसी व्यक्तिवाचक भाषा रखी गई।
  alternative: इन्हें निर्जीव प्राकृतिक नियमों या केवल तारों की गतियों के रूप में प्रस्तुत करना।
  rationale: गीज़ पाठ में ‘जो ... करते हैं’ वाली व्यक्तिवाचक संबंधवाचक रचनाएँ हैं। अनुवाद उस प्रकाशनात्मक विश्व-दृष्टि को सुरक्षित रखता है, पर इन प्राणियों की प्रकृति को मूल से अधिक निश्चित नहीं करता।
- issue: अंतिम खगोलीय पद का अर्थ
  choice: अस्त होना
  alternative: उदय होना; प्रस्थान; मार्ग
  rationale: ሙባኢሆሙ ‘प्रवेश’ से संबंधित है और इस ग्रंथ की द्वार-संबंधी खगोलीय कल्पना में पश्चिम में प्रवेश, अर्थात अस्त होना, सबसे उपयुक्त अर्थ है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण प्रकाशनात्मक शैली अपनाई गई है। ‘ऊरीएल’ और ‘हनोक’ नाम-रूप रखे गए हैं। वाक्य की दीर्घ सूची और ‘उनके’ की संभावित संदर्भ-अस्पष्टता को मूल के निकट रहने के लिए पूरी तरह नहीं सुलझाया गया है।
