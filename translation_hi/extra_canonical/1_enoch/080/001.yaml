    issue: Purpose clause uses ‘ताकि तुम ... देखो’
    rationale: In Hindi this may be heard as imperative, especially immediately after the speech-opening imperative ‘देखो.’ The Ge’ez purpose form is more naturally and precisely represented by ‘ताकि तुम ... देख सको.’
