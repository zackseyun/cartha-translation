  choice: दिनों
  rationale: बहुवचन काल-सूचक पद है। हिन्दी के अपोकैलिप्टिक वर्णन में ‘उन दिनों में’ स्वाभाविक है और व्यापक भावी काल को व्यक्त करता है।
- source_word: ፍሬ፡ ምድር
  choice: धरती की उपज
  rationale: शाब्दिक ‘धरती का फल’ सम्भव है, पर कृषि-संदर्भ में ‘धरती की उपज’ साधारण हिन्दी में अधिक स्पष्ट है और ठोस कृषि-चित्र बनाए रखता है।
- source_word: ደሓራዊ፡ ይከውን
  choice: देर से आएगी
  rationale: मूल में नियत समय की अपेक्षा पीछे या देर होने का भाव है। यह अनिवार्य रूप से किसी बाहरी कर्ता द्वारा किए गए विलंब को नहीं मानता।
- source_word: ወኢይበቍል
  choice: अंकुरित नहीं होगी
  rationale: क्रिया अंकुर फूटने या उगने को सूचित करती है; ‘अंकुरित होना’ कृषि-संदर्भ में सटीक और सुबोध है।
- source_word: በዘመኑ
  choice: अपने समय पर
  rationale: एकवचन प्रत्यय निकटवर्ती सामूहिक ‘उपज’ से मेल खाता है। ‘अपने समय पर’ नियत कृषि-समय का भाव रखता है।
- source_word: ፍሬ፡ ዕፅ
  choice: पेड़ों का फल
  rationale: इस कृषि-संदर्भ में ዕፅ का अर्थ ‘पेड़’ सबसे स्पष्ट है।
- source_word: ይትከላእ
  choice: रोक दिया जाएगा
  rationale: मूल निष्क्रिय रूप में रोके, बाधित या थामे जाने का भाव देता है। हिन्दी में यह उस फल के नियत समय पर न आने को स्पष्ट करता है।
- source_word: በዘመኑ፡ ዚአሁ
  choice: अपने ही समय पर
  rationale: एकवचन अधिकार-सूचक और बलात्मक ዚአሁ को ‘अपने ही’ द्वारा सुरक्षित रखा गया है, जिससे फल के विशिष्ट नियत समय पर जोर बना रहता है।
theological_decisions:
- issue: न्याय के चिह्न का स्वरूप
  choice: सामान्य कृषि-क्रम और ऋतु-समय का वास्तविक विघटन
  alternative: केवल खराब फसल का प्राकृतिक वर्णन, या कृषि से अलग कोई सामान्य नैतिक रूपक
  rationale: खगोलीय पुस्तक के प्रसंग में ऋतुओं और सृष्टि-व्यवस्था का बिगड़ना अपोकैलिप्टिक चिह्न है। इसलिए कृषि-भाषा को ठोस रखा गया है, पर पद में स्पष्ट न किए गए कारण या कर्ता को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण लेकिन सामान्य पाठक के लिए सहज। ‘अपने ही समय’ में मूल के बलात्मक अधिकार-सूचक को रखा गया है। अर्धविराम पद की दो समानांतर कृषि-सूचनाओं को अलग करता है।
