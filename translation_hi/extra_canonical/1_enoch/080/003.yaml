  yaml_path: translation/extra_canonical/1_enoch/080/003.yaml
  text: And in those times the fruit of the earth will be delayed[a], and it will not sprout in its season[d][c][b]; and the fruit of the trees will be withheld in its season.
translation:
  language: hi
  text: और उन दिनों में धरती की उपज देर से आएगी[a] और अपने समय पर अंकुरित नहीं होगी[b]; और पेड़ों का फल अपने ही समय पर रोक दिया जाएगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धरती की उपज विलंबित होगी।” मूल शब्द नियत समय की अपेक्षा देर होने पर जोर देता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपनी ऋतु में।” यहाँ ‘समय’ से आशय उपज के नियत कृषि-समय से है।
    reason: lexical_alternative
  - marker: c
    text: या, “पेड़ों का फल अपने ही समय पर बाधित होगा।” मूल में फल के रोके या बाधित किए जाने का भाव है।
    reason: lexical_alternative
