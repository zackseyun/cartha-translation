base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/080/002.yaml
  text: And in the days of the sinners the years shall be shortened, and their seed shall be late upon their land and in their fields; and all the works that are on the earth shall change and shall not appear in their times, and the rain shall be withheld, and heaven shall hold back.
translation:
  language: hi
  text: और पापियों के दिनों में वर्ष छोटे कर दिए जाएँगे, और उनकी भूमि और उनके खेतों में उनका बीज देर से आएगा[a]; पृथ्वी पर के सारे कार्य बदल जाएँगे और अपने-अपने समय पर प्रकट नहीं होंगे[b]; वर्षा रोक ली जाएगी, और आकाश थम जाएगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उनका बीज’ का अर्थ ‘उनकी संतान’ भी हो सकता है; इस कृषि-संबंधी प्रसंग में यह बोए हुए बीज या उपज की ओर भी संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात पृथ्वी की गतिविधियाँ या उपज अपने नियत समयों में दिखाई नहीं देंगी; पंक्ति ऋतुओं और कृषि-व्यवस्था के बिगड़ने का चित्र प्रस्तुत करती है।
    reason: cultural_note
  - marker: c
    text: इसे ‘और आकाश रोक रखेगा’ भी समझा जा सकता है, जिसमें वर्षा का रोका जाना निहित है।
    reason: textual_or_lexical_alternative
lexical_decisions:
- source_word: መዋዕለ፡ ኃጥኣን
  choice: पापियों के दिनों में
  rationale: यह सर्वनाश-संबंधी कालसूचक सूत्र को स्वाभाविक हिन्दी में रखते हुए ‘दिनों’ और नैतिक न्यायसूचक ‘पापियों’—दोनों को सुरक्षित रखता है।
- source_word: ክረማት፡ የኀጽሩ
  choice: वर्ष छोटे कर दिए जाएँगे
  rationale: यह घटाए या संक्षिप्त किए गए समय की कर्मवाच्य छवि को बनाए रखता है; प्रसंग में ክረማት वार्षिक चक्र को सूचित करता है।
- source_word: ዘርአ፡ ዚአሆሙ
  choice: उनका बीज
  rationale: ‘बीज’ कृषि-बीज या उपज तथा वंशज—दोनों संभावनाओं को खुला रखता है।
- source_word: ዳኃራዊ
  choice: देर से आएगा
  rationale: हिन्दी में वाक्य को सहज रखते हुए देर या विलंब का अर्थ व्यक्त करता है और यह निश्चित नहीं करता कि बीज बोया जाएगा, उगेगा या संतान के रूप में आएगा।
- source_word: ምድረሙ፡ ወበወፍሮሙ
  choice: उनकी भूमि और उनके खेतों में
  rationale: भूमि और जोती हुई कृषि-भूमि के समानांतर उल्लेख को स्पष्ट, सामान्य हिन्दी में सुरक्षित रखता है।
- source_word: ኵሉ፡ ግብር፡ ዘዲበ፡ ምድር
  choice: पृथ्वी पर के सारे कार्य
  rationale: ‘कार्य’ को व्यापक रखा गया है ताकि यह केवल मनुष्यों के कर्मों तक सीमित न हो, बल्कि पृथ्वी की गतिविधियों या उपज को भी समेट सके।
- source_word: ይትመየጥ፡ ወኢያስተርኢ፡ ለአዝማኖሙ
  choice: बदल जाएँगे और अपने-अपने समय पर प्रकट नहीं होंगे
  rationale: परिवर्तन तथा नियत समय पर न दिखाई देने—दोनों बातों को रखता है और गीइज़ के बहुवचन ‘उनके समयों’ को स्वाभाविक हिन्दी ‘अपने-अपने समय’ से दर्शाता है।
- source_word: ዝናም፡ ይትከላእ
  choice: वर्षा रोक ली जाएगी
  rationale: मूल के कर्मवाच्य भाव को बिना कर्ता जोड़े स्पष्ट रूप से व्यक्त करता है।
- source_word: ወሰማይ፡ ታቀውም
  choice: और आकाश थम जाएगा
  rationale: अंतिम कर्तारहित नहीं बल्कि ‘आकाश’ को कर्ता बनानेवाली संक्षिप्त पंक्ति को ब्रह्मांडीय अव्यवस्था की छवि के रूप में रखता है; क्रिया के ठहरने/रुकने के भाव को हिन्दी में स्वाभाविक बनाता है।
theological_decisions:
- issue: ‘उनका बीज’ का आशय
  choice: मुख्य पाठ में ‘उनका बीज’ रखा गया है।
  alternative: ‘उनकी संतान’ अथवा ‘उनकी उपज’
  rationale: भूमि, खेत, ऋतु और वर्षा कृषि-संबंधी अर्थ का समर्थन करते हैं, पर शब्द वंशजों को भी सूचित कर सकता है; इसलिए किसी एक अर्थ को निर्णायक नहीं बनाया गया।
- issue: पृथ्वी के ‘कार्यों’ का विस्तार
  choice: व्यापक ‘सारे कार्य’
  alternative: ‘सारे मानवीय कर्म’ अथवा ‘सारी उपज’
  rationale: मूल पद व्यापक है। इसे केवल नैतिक कर्मों या केवल कृषि-उपज तक सीमित करना मूल की अर्थगत गुंजाइश घटा देता।
- issue: आकाश की अंतिम क्रिया
  choice: ‘आकाश थम जाएगा’
  alternative: ‘आकाश रोक रखेगा’
  rationale: मूल की संक्षिप्त और ब्रह्मांडीय छवि को बिना अनुल्लिखित कर्म स्पष्ट किए रखा गया है; वैकल्पिक पाठ वर्षा को निहित कर्म मान सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। भविष्यसूचक कर्मवाच्य शैली और सर्वनाश-संबंधी लय को बनाए रखा गया है। ‘अपने-अपने समय’ बहुवचन काल-संदर्भ को स्वाभाविक हिन्दी में सुरक्षित करता है; ‘बीज’ और ‘कार्य’ को जानबूझकर अर्थगत रूप से व्यापक रखा गया है।
