  source_fidelity: 'Hindi rendering closely follows the Ge''ez sequence and preserves its broad, apocalyptic imagery: shortened years, delayed seed, altered earthly works failing at their proper times, withheld rain, and the final image of heaven''s cessation/restraint. ‘बीज’ appropriately retains the ambiguity between descendants and agricultural seed/produce. ‘अपने-अपने समय’ naturally represents the plural temporal expression.'
  naturalness: The text is clear, idiomatic modern standard Hindi with a suitably elevated prophetic register. ‘देर से आएगा’ is a natural way to express the delayed occurrence of ‘seed’ without specifying sowing, germination, or harvest. ‘आकाश थम जाएगा’ is concise and preserves the source’s terse cosmic image.
  terminology: ‘पापियों,’ ‘बीज,’ ‘भूमि,’ ‘खेत,’ ‘कार्य,’ ‘वर्षा,’ and ‘आकाश’ are consistent and appropriately broad. No doctrinally restrictive interpretation has been introduced.
