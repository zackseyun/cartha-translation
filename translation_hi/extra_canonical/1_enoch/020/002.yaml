- source_word: ወዘተረዓድ
  choice: और तारतरस
  rationale: पाठ कठिन है, पर सूची के संदर्भ में यह विद्रोही आत्मिक प्राणियों से जुड़े अधोलोक के कारागार ‘तारतरस’ की ओर संकेत करता जान पड़ता है। अनिश्चितता पादटिप्पणी में खुलकर दी गई है।
