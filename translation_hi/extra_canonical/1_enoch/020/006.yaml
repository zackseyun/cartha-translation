base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/006.yaml
  text: Saraqael[a], one of the holy angels[b], who is over the spirits of the children of men who sin.
translation:
  language: hi
  text: सराकाएल[a], पवित्र स्वर्गदूतों में से एक, जो मनुष्यों की उन संतानों की आत्माओं का प्रभारी है जो पाप करती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस नाम का रूप ‘सरिएल’ भी मिलता है। उपलब्ध गीज़ पाठ का मध्य अंश OCR के कारण विकृत है; उसे सामान्यतः ‘मनुष्यों की संतानें’ समझा जाता है। अंतिम संबंधवाचक वाक्यांश का संबंध वैकल्पिक रूप से ‘पाप करने वालों की आत्माओं’ से भी जोड़ा जा सकता है।
    reason: textual_variant
