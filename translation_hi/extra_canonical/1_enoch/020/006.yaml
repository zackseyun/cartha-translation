theological_decisions:
- issue: सरकाएल के अधिकार में आनेवाली आत्माओं की पहचान
  choice: पाप करनेवाले मनुष्यों की संतानों की आत्माएँ
  alternative: आत्मा में पाप करनेवालों की आत्माएँ
  rationale: पाठ में ‘मनुष्यों की संतानें’ वाला मुहावरा OCR-विकृति के पीछे पहचाना जा सकता है, और अंतिम क्रिया सामान्यतः ‘पाप करते हैं’ कहती है। इसलिए ‘आत्मा में’ जोड़ना उचित नहीं; फिर भी वाक्य-संबंध की कठिनाई पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘मनुष्यों की संतानें’ प्राचीन सामी अभिव्यक्ति का स्वर बनाए रखता है; ‘पर नियुक्त है’ स्वर्गदूत के पर्यवेक्षी दायित्व को स्वाभाविक रूप से व्यक्त करता है।
