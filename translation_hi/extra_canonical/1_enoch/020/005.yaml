base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/005.yaml
  text: Mikael[a], one of the holy angels[b], who is set over the good of mankind and over the people.
translation:
  language: hi
  text: मीकाएल, पवित्र स्वर्गदूतों में से एक, जो मानवजाति की भलाई और लोगों के ऊपर नियुक्त है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस वाक्यांश की प्राचीन पाठ-रचना कठिन है। अधिक शाब्दिक रूप में, “जो मानवजाति की भलाई के ऊपर और लोगों के ऊपर नियुक्त है।” इसे “लोगों में भले लोगों के ऊपर” या “लोगों की अच्छी व्यवस्था के ऊपर” भी समझा गया है। उपलब्ध गीइज़ प्रतिलेखन में इस स्थान का एक शब्द संभवतः पाठ-पहचान की त्रुटि से प्रभावित है।
    reason: पाठगत कठिनाई और वैकल्पिक पाठार्थ
lexical_decisions:
- source_word: ሚካኤል
  choice: मीकाएल
  rationale: व्यक्तिवाचक नाम को गीइज़ रूप के निकट रखते हुए देवनागरी में लिप्यंतरित किया गया है; यह हिन्दी बाइबलीय परंपरा में भी पहचाना जा सकने वाला रूप है।
- source_word: ፩እምነ መላእክት ቅዱሳን
  choice: पवित्र स्वर्गदूतों में से एक
  rationale: यह पद समूह में सदस्यता बताता है। इस प्रसंग में መላእክት अलौकिक दूतों के लिए है, इसलिए स्वाभाविक हिन्दी में ‘स्वर्गदूत’ चुना गया।
- source_word: ሠናይቱ ለሰብእ
  choice: मानवजाति की भलाई
  rationale: ሠናይቱ को ‘भलाई’ और ለሰብእ को समस्त मनुष्यों से संबंधित मानकर अनूदित किया गया है; इससे पाठ की हितकारी धारणा बनी रहती है।
- source_word: ዲበ ሕዝብ
  choice: लोगों की देखरेख
  rationale: ዲበ यहाँ किसी क्षेत्र या समुदाय के ऊपर नियुक्त अधिकार/उत्तरदायित्व दर्शाता है। ‘देखरेख’ आधुनिक हिन्दी में इस भूमिका को स्वाभाविक रूप से व्यक्त करता है, जबकि टिप्पणी में अधिक शाब्दिक विकल्प सुरक्षित रखा गया है।
- source_word: ተሰይመ (संशोधित पाठ-साक्ष्य; प्रदत्त प्रतिलेखन में ትእዛዚ)
  choice: सौंपी गई है
  rationale: नवीन पाठ-समीक्षा के अनुसार प्रदत्त प्रतिलेखन का ትእዛዚ (‘आज्ञा’) OCR की त्रुटि है और मूल क्रिया नियुक्त किए जाने का भाव देती है। निष्क्रिय हिन्दी रचना उसी सौंपे गए दायित्व को व्यक्त करती है।
theological_decisions:
- issue: मीकाएल के नियुक्त कार्यक्षेत्र का स्वरूप
  choice: उसे मानवजाति की भलाई का दायित्व और लोगों की देखरेख सौंपी गई है
  alternative: वह मनुष्यों में भले लोगों के ऊपर नियुक्त है; अथवा वह लोगों की अच्छी व्यवस्था के ऊपर नियुक्त है
  rationale: उपलब्ध गीइज़ प्रतिलेखन इस स्थान पर दूषित है, पर संशोधित पाठ-साक्ष्य और प्राचीन यूनानी समानांतर ‘मनुष्यों की भलाई’ तथा ‘लोगों के ऊपर’ दो संबंधित कार्यक्षेत्रों की ओर संकेत करते हैं। मुख्य पाठ इसे सहज हिन्दी में रखता है और टिप्पणी वास्तविक वैकल्पिक समझों को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दायित्व’ और ‘देखरेख’ से शाब्दिक ‘ऊपर’ की अस्वाभाविक पुनरावृत्ति टाली गई है, पर उसका अधिकार-क्षेत्र वाला भाव और पाठगत अनिश्चितता टिप्पणी में स्पष्ट रूप से सुरक्षित हैं।
