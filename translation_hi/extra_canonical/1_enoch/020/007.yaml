base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/007.yaml
  text: Gabriʾel[a], one of the holy angels, who is over Paradise and the serpents and the cherubim.
translation:
  language: hi
  text: गब्रिएल, पवित्र स्वर्गदूतों में से एक, जो परादीस, सर्पों[a] और करूबों पर अधिकारी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: जिस इथियोपिक शब्द का अनुवाद “सर्पों” किया गया है, उसका अर्थ निश्चित नहीं है; फिर भी इस पद की पारंपरिक समझ सर्पाकार प्राणियों की ओर संकेत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ገብርኤል
  choice: गब्रिएल
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है; इसका अनुवाद नहीं किया गया।
- source_word: ፩እምነ
  choice: में से एक
  rationale: यह पदबंध किसी समूह की सदस्यता को सीधे व्यक्त करता है।
- source_word: መላእክት ቅዱሳን
  choice: पवित्र स्वर्गदूतों
  rationale: यह हनोक-साहित्य में इन स्वर्गीय प्राणियों के लिए प्रयुक्त मानक पदवी का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: ዘዲበ
  choice: जो … पर अधिकारी है
  rationale: रचना किसी क्षेत्र या प्राणियों पर अधिकार अथवा देखरेख का भाव देती है; हिन्दी में यह रूप स्पष्ट है और किसी अनकहे नियुक्तिकर्ता को नहीं जोड़ता।
- source_word: ገነት
  choice: परादीस
  rationale: यहाँ शब्द साधारण बगीचे के बजाय ब्रह्मांडीय परादीसी क्षेत्र को सूचित करता है; 'परादीस' उस विशिष्ट अर्थ को बनाए रखता है।
- source_word: አክይስት
  choice: सर्पों
  rationale: इथियोपिक पाठ-परंपरा में यह शब्द कठिन है, पर इस पद की पारंपरिक समझ सर्पाकार प्राणियों की ओर संकेत करती है; 'सर्प' गरिमापूर्ण शैली भी बनाए रखता है।
- source_word: ኪሩቤን
  choice: करूबों
  rationale: स्वर्गीय प्राणियों के इस पारंपरिक नाम का हिन्दी बाइबलीय रूप रखा गया है और बहुवचन को हिन्दी वाक्य-रचना के अनुरूप बनाया गया है।
theological_decisions:
- issue: ገነት को सामान्य बगीचा माना जाए या ब्रह्मांडीय-धार्मिक स्थान
  choice: परादीस
  alternative: बगीचा / अदन
  rationale: प्रधान स्वर्गदूतों और उनके अधिकार-क्षेत्रों की सूची में यह किसी साधारण बगीचे की अपेक्षा परादीसी क्षेत्र को अधिक स्वाभाविक रूप से दर्शाता है; यह चुनाव बाद की धर्मसैद्धांतिक धारणाएँ जोड़े बिना पाठ की प्रलय-साहित्यिक छवि बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और प्रलय-साहित्य के अनुकूल शैली रखी गई है। कठिन शब्द አክይስት की अनिश्चितता को पादटिप्पणी में स्पष्ट किया गया है; उसे मुख्य पाठ में किसी अधिक विशिष्ट प्रकार के प्राणी के रूप में तय नहीं किया गया।
