translation:
  language: hi
  text: और ये उन पवित्र स्वर्गदूतों के नाम हैं जो चौकसी करते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “चौकसी करते हैं” का अनुवाद “सतर्क रहते हैं” या “निगरानी करते हैं” भी हो सकता है। 1 हनोक के व्यापक संदर्भ में यह भाषा स्वर्गीय पहरेदारों की धारणा से मेल खाती है, पर इस पद में यह स्वर्गदूतों का वर्णन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝንቱ
  choice: और ये ... हैं
  rationale: संयोजक और संकेतवाचक पद यहाँ आगे आने वाली सूची का परिचय देते हैं। ‘नाम’ बहुवचन होने के कारण हिन्दी में बहुवचन रचना स्वाभाविक है।
- source_word: አስማቲሆሙ
  choice: नाम
  rationale: मूल रूप का शाब्दिक अर्थ ‘उनके नाम’ है; हिन्दी में ‘उन ... के नाम’ वाली रचना संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करती है।
- source_word: ለእለ
  choice: उन ... के
  rationale: यह संबंधवाचक पद ‘नाम’ को आगे दिए गए वर्णन से जोड़ता है; हिन्दी में ‘उन ... के नाम ... जो’ इसकी सहज अभिव्यक्ति है।
- source_word: ይተግሁ
  choice: चौकसी करते हैं
  rationale: क्रिया जागते रहने, सतर्क रहने या निगरानी करने का भाव देती है। ‘चौकसी करते हैं’ सक्रिय सतर्कता को बनाए रखता है, पर इसे पारिभाषिक उपाधि नहीं बनाता।
- source_word: ቅዱሳን
  choice: पवित्र
  rationale: यह पवित्रता दर्शाने वाला सामान्य और गरिमापूर्ण हिन्दी विशेषण है।
- source_word: መላእክት
  choice: स्वर्गदूतों
  rationale: इस अपोकैलिप्टिक संदर्भ में आशय स्वर्गीय प्राणियों से है; इसलिए सामान्य ‘दूतों’ की अपेक्षा ‘स्वर्गदूतों’ अधिक स्पष्ट है।
theological_decisions:
- issue: क्या सतर्क रहने वाले स्वर्गदूतों के लिए पारिभाषिक उपाधि ‘पहरेदार’ प्रयोग की जाए
  choice: चौकसी करते हैं
  alternative: पहरेदार; जागते रहने वाले
  rationale: गीज़ पाठ में यहाँ क्रियात्मक वर्णन है, अनिवार्य रूप से कोई स्थिर उपाधि नहीं। इसलिए अनुवाद देखने-जागने का भाव रखता है, पर ‘पहरेदार’ को पारिभाषिक वर्ग के रूप में आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सूची-परिचय के अनुकूल वाक्य। ‘चौकसी करते हैं’ मूल की क्रियात्मक अस्पष्टता को बनाए रखता है और अनावश्यक पारिभाषिकता से बचता है।
