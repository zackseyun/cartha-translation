  text: Raphael[a], one of the holy angels, who is over the spirits of men.
translation:
  language: hi
  text: रफ़ाएल[a], पवित्र स्वर्गदूतों में से एक, जो मनुष्यों की आत्माओं पर नियुक्त है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: नाम का गीज़ रूप ‘रूफ़ाएल’ के निकट है; यहाँ प्रचलित हिन्दी बाइबलीय रूप ‘रफ़ाएल’ रखा गया है।
    reason: नाम के लिप्यंतरण का विकल्प
lexical_decisions:
- source_word: ሩፋኤል
  choice: रफ़ाएल
  rationale: व्यक्तिनाम का अनुवाद न करके हिन्दी में प्रचलित बाइबलीय रूप के निकट लिप्यंतरण किया गया है।
- source_word: ፩እምነ
  choice: में से एक
  rationale: संख्या और अंशसूचक संबंध को स्वाभाविक हिन्दी में ठीक प्रकार व्यक्त करता है।
- source_word: ቅዱሳን፡ መላእክት
  choice: पवित्र स्वर्गदूतों
  rationale: यह अभिषिक्त अथवा पवित्र स्वर्गीय प्राणियों के लिए मानक और गरिमापूर्ण हिन्दी अभिव्यक्ति है।
- source_word: መናፍስተ
  choice: आत्माओं
  rationale: मूल बहुवचन का सीधा अर्थ आत्माएँ/आत्मिक प्राण है; इस संदर्भ में 'आत्माओं' सहज है और 'मृतकों की आत्माएँ' जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: ሰብእ
  choice: मनुष्यों
  rationale: यहाँ शब्द सामूहिक मानवजाति को सूचित करता है, केवल पुरुषों को नहीं; 'मनुष्यों' से वह व्यापक अर्थ बना रहता है।
- source_word: ዘመናፍስተ፡ ሰብእ
  choice: जो मनुष्यों की आत्माओं पर नियुक्त है
  rationale: संबंधवाचक रचना रफ़ाएल के अधिकार अथवा दायित्व-क्षेत्र को बताती है। 'पर नियुक्त है' स्वाभाविक हिन्दी में यह भाव देता है, बिना उसके कार्य की प्रकृति को अधिक निश्चित किए।
theological_decisions:
- issue: रफ़ाएल के दायित्व का दायरा
  choice: उसे मानव आत्माओं पर नियुक्त बताया गया है।
  alternative: वह मृतकों की आत्माओं पर है; अथवा मानवता के उपचार या आंतरिक जीवन का अधिकारी है।
  rationale: गीज़ पाठ केवल 'मनुष्यों की आत्माओं' कहता है। वह न मृतकों को निर्दिष्ट करता है, न इस पद में उपचार का कार्य जोड़ता है; इसलिए व्यापक और अनिर्णीत कथन सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; सूची-जैसी संक्षिप्त अपोकैलिप्टिक शैली बनाए रखी गई है। सामूहिक ሰብእ को लिंग-विशिष्ट 'पुरुषों' के बजाय 'मनुष्यों' से व्यक्त किया गया है।
