base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/004.yaml
  text: Raguel[a], one of the holy angels[b], who takes vengeance on the world and on the luminaries.
translation:
  language: hi
  text: रगूएल, पवित्र स्वर्गदूतों में से एक, जो संसार और आकाशीय ज्योतियों से प्रतिशोध लेता है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जो संसार और आकाशीय ज्योतियों का बदला लेता है।’ यहाँ क्रिया में न्यायिक प्रतिकार का भाव है।
    reason: lexical_alternative
  - marker: b
    text: ‘आकाशीय ज्योतियाँ’ से आशय सूर्य, चन्द्रमा और तारों जैसे आकाश के प्रकाशमान पिंडों से है।
    reason: cultural_note
lexical_decisions:
- source_word: ራጉኤል
  choice: रगूएल
  rationale: स्वर्गदूत के नाम का अनुवाद नहीं, प्रचलित ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: ፩እምነ
  choice: में से एक
  rationale: यह समूह के भीतर सदस्यता बताने वाले अंशात्मक अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: መላእክት ቅዱሳን
  choice: पवित्र स्वर्गदूतों
  rationale: यह हनोक साहित्य में प्रयुक्त मानक स्वर्गदूतीय पदवी का सीधा और गरिमापूर्ण हिन्दी रूप है।
- source_word: ዘይትቤቀሎ
  choice: जो ... से बदला लेता है
  rationale: क्रिया के न्यायिक और प्रतिकारात्मक बल को बनाए रखता है; केवल ‘दण्ड देता है’ की अपेक्षा अधिक विशिष्ट है।
- source_word: ለዓለም
  choice: संसार
  rationale: यहाँ न्याय का क्षेत्र व्यापक विश्व-व्यवस्था है; ‘पृथ्वी’ सम्भव है, पर ‘संसार’ प्रसंग के ब्रह्मांडीय विस्तार को बेहतर व्यक्त करता है।
- source_word: ለብርሃናት
  choice: आकाशीय ज्योतियों
  rationale: सर्वनाश-दर्शी प्रसंग में यह सूर्य, चन्द्रमा और तारों जैसी खगोलीय ज्योतियों की ओर संकेत करता है; हिन्दी में ‘ज्योतियाँ’ ‘प्रकाशों’ से अधिक स्वाभाविक है।
theological_decisions:
- issue: रगूएल की दण्डात्मक भूमिका का विस्तार
  choice: रगूएल को संसार और आकाशीय ज्योतियों—दोनों से बदला लेने वाला बताया गया है।
  alternative: वह संसार और ज्योतियों से सम्बन्धित व्यवस्था की सामान्य निगरानी करता है, अथवा ज्योतियों के सम्बन्ध में किए गए अपराधों का दण्ड देता है।
  rationale: गीज़ वाक्य-विन्यास में दोनों पद एक ही प्रतिकारात्मक क्रिया के समन्वित कर्म सबसे स्वाभाविक रूप से समझे जाते हैं। सूची के न्यायिक और सर्वनाश-दर्शी तनाव को नरम नहीं किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘बदला लेता है’ मूल क्रिया के न्यायिक-प्रतिकारात्मक बल को बनाए रखता है। मुख्य पाठ में फुटनोट चिह्न [a] उपस्थित है।
