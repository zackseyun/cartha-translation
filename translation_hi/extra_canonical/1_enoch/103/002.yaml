base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/002.yaml
  text: For I know the mystery[a], and I have read the tablets of heaven, and I have seen the holy writings[c][b], and I found written in them and understood concerning them.
translation:
  language: hi
  text: क्योंकि मैं रहस्य[a] जानता हूँ; मैंने स्वर्ग की पट्टिकाएँ[b] पढ़ी हैं और पवित्र लेख[c] देखा है। मैंने उनमें लिखा हुआ पाया और उनके विषय में समझ प्राप्त की है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गुप्त बात’। यहाँ ऐसे छिपे ज्ञान का भाव है जो प्रकट किया गया हो।
    reason: lexical_alternative
  - marker: b
    text: ‘स्वर्ग की पट्टिकाएँ’ स्वर्गीय अभिलेखों या आदेशों की प्रलयदर्शी छवि है; इसका आशय अनिवार्य रूप से भौतिक पट्टिकाएँ नहीं है।
    reason: cultural_note
  - marker: c
    text: गीज़ में यहाँ एकवचन ‘पवित्र लेख’ है। इसे ‘पवित्र जनों का लेख’ समझना व्याकरणतः कम संभावित है।
    reason: textual_grammar_note
lexical_decisions:
- source_word: ምሥጢረ
  choice: रहस्य
  rationale: यह शब्द गुप्त या छिपे हुए ज्ञान को सूचित करता है। ‘रहस्य’ प्रकाशनात्मक और प्रलयदर्शी प्रसंग की गरिमा बनाए रखता है।
- source_word: አንበብኩ
  choice: मैंने ... पढ़ी हैं
  rationale: पूर्ण क्रिया वक्ता द्वारा पहले ही प्राप्त किए गए ज्ञान का दावा करती है; हिन्दी में पूर्ण पक्ष प्रसंग के अनुकूल है।
- source_word: ፀፍፀፈ ሰማይ
  choice: स्वर्ग की पट्टिकाएँ
  rationale: यह अभिव्यक्ति स्वर्गीय अभिलेखों या निर्णयों की प्राचीन ठोस छवि देती है; ‘पुस्तकें’ कहने से वह छवि धुंधली पड़ती।
- source_word: ጽሕፈተ ቅድስተ
  choice: पवित्र लेख
  rationale: गीज़ में संज्ञा और विशेषण दोनों स्त्रीलिंग एकवचन रूप में हैं; अतः इसे ‘पवित्र जनों का लेख’ नहीं, बल्कि एकवचन ‘पवित्र लेख’ समझना व्याकरणतः उचित है। उपलब्ध यूनानी साक्ष्य भी एकवचन ‘पवित्र लेख’ का समर्थन करता है।
- source_word: ውስቴቶሙ
  choice: उनमें
  rationale: बहुवचन सर्वनाम का सबसे स्वाभाविक पूर्वपद ‘स्वर्ग की पट्टिकाएँ’ है।
- source_word: አኩዐ
  choice: समझ प्राप्त की
  rationale: क्रिया पढ़ी या पाई हुई बात के अर्थ को ग्रहण करने का भाव देती है; यह हिन्दी में स्वाभाविक रहते हुए बोध की प्रक्रिया व्यक्त करती है।
- source_word: በእንቲአሆሙ
  choice: उनके विषय में
  rationale: यह संबंधसूचक पद ‘उनके बारे में/उनके विषय में’ का अर्थ देता है; सर्वनाम की मूल अस्पष्टता को बनाए रखा गया है।
theological_decisions:
- issue: ‘पवित्र’ के साथ जुड़े पद की पहचान
  choice: पवित्र लेख
  alternative: पवित्र जनों का लेख
  rationale: गीज़ का रूप स्त्रीलिंग एकवचन विशेषण के साथ ‘लेख’ को विशेषित करता है; यहाँ ‘पवित्र जनों’ के लिए अपेक्षित बहुवचन संज्ञा नहीं है। इसलिए स्वर्गदूतों या संतों की पहचान पाठ में आरोपित नहीं की गई।
- issue: अंतिम बहुवचन सर्वनामों का संदर्भ
  choice: ‘उनमें/उनके’ को बिना अतिरिक्त व्याख्या के रखा गया
  alternative: उन्हें स्पष्ट रूप से ‘पट्टिकाओं’ से बदल देना
  rationale: व्याकरण और निकटतम बहुवचन पूर्वपद ‘पट्टिकाओं’ की ओर संकेत करते हैं, फिर भी मूल पाठ सर्वनाम ही रखता है। हिन्दी में सर्वनाम रखने से मूल की संदर्भगत गुंजाइश बनी रहती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘पट्टिकाएँ’, ‘रहस्य’ और ‘पवित्र लेख’ प्राचीन प्रलयदर्शी वातावरण को बनाए रखते हैं। अंतिम सर्वनामों को अतिव्याख्यायित नहीं किया गया है।
