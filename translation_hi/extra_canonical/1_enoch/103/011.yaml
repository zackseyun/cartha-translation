- source_word: ለኃጥኣን ወለዓማፅያን
  choice: पापियों और व्यवस्था-विरोधियों
  rationale: दोनों नैतिक पदों का भेद रखा गया है; दूसरा शब्द विद्रोही या विधि-विरुद्ध आचरण का तीखा भाव देता है।
- source_word: አክበዱ ላዕሌነ አርዑተ ዚአሆሙ
  choice: उन्होंने अपना जुआ हम पर भारी कर दिया
