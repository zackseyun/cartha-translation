base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/011.yaml
  text: We hoped to become the head[a], and we became the tail; we toiled, but we did not gain mastery over our labor; and we became food for sinners and for the lawless[c][b], and they laid their yoke heavily upon us.
translation:
  language: hi
  text: हमने आशा की थी कि हम सिर बनेंगे, पर हम पूँछ बन गए; हमने कठिन परिश्रम किया, फिर भी अपने परिश्रम पर हमारा अधिकार न हुआ[a]; हम पापियों और व्यवस्था-विरोधियों का भोजन बन गए[b], और उन्होंने अपना जुआ हम पर भारी कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने परिश्रम की उपज पर हमारा अधिकार न हुआ,” अथवा “अपनी संपत्ति पर हमारा वश न चला।” इथियोपिक में अंतिम संज्ञा का अर्थ कठिन है।
    reason: lexical_alternative
  - marker: b
    text: “भोजन” एक ठोस रूपक है; आशय यह है कि वे पापियों और व्यवस्था-विरोधियों का शिकार बन गए।
    reason: lexical_alternative
