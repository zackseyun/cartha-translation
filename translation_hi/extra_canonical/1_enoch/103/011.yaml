  register: आधुनिक मानक हिन्दी में गरिमापूर्ण सामुदायिक विलाप। वाक्य को सहज रखने के लिए निकटार्थक श्रम-पदों को समेटा गया है, जबकि कठिन पाठगत अर्थ को पादटिप्पणी में खुला रखा गया है।
