theological_decisions:
- issue: सिर और पूँछ के उलटाव को सामाजिक पदों के रूप में खोलना या मूल बिंब बनाए रखना
  choice: सिर … पूँछ
  alternative: प्रधान … सबसे छोटे; शासक … अधीनस्थ
  rationale: ठोस बिंब अपमान और भाग्य-विपर्यय की काव्यात्मक शक्ति को बनाए रखता है और अनावश्यक सामाजिक व्याख्या से बचता है।
- issue: अंतिम दमन-बिंब का अनुवाद
  choice: उन्होंने अपना जुआ हम पर भारी कर दिया
  alternative: उन्होंने हम पर बहुत अत्याचार किया
  rationale: जुए का बिंब यहूदी दमन-विलाप की भाषिक और धर्मवैचारिक प्रतिध्वनि बनाए रखता है।
