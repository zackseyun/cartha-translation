base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/008.yaml
  text: And into darkness and into a snare and into a blazing fire your spirits shall enter[a], into the great judgment; and the great judgment shall be for all the generations of eternity. Woe to you[e][d][c][b], for you have no peace.
translation:
  language: hi
  text: और तुम्हारी आत्मा अन्धकार में, एक जाल में[a] और धधकती आग में—महान न्याय की ओर[b]—प्रवेश करेगी; और वह महान न्याय अनन्तकाल की सभी पीढ़ियों के लिए होगा[c]। तुम पर हाय! क्योंकि तुम्हारे लिए शान्ति नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एक फन्दे में’। मूल शब्द फँसाने वाले जाल की छवि देता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘महान न्याय की ओर’। मूल पूर्वसर्ग दिशासूचक है; इसे ‘महान न्याय के लिए’ समझना भी संभव माना गया है, पर वह दिशात्मक बल को कम कर देता है।
    reason: alternative_reading
  - marker: c
    text: ‘अनन्तकाल की सभी पीढ़ियाँ’ एक कठिन अभिव्यक्ति है; सम्भवतः यह इस न्याय के स्थायी और पीढ़ी-दर-पीढ़ी बने रहने वाले प्रभाव पर बल देती है।
    reason: cultural_note
lexical_decisions:
- source_word: በጽልመት
  choice: अन्धकार में
  rationale: यहाँ በ क्रिया ‘प्रवेश करेगी’ के साथ गन्तव्य का भाव देता है। हिन्दी में ‘अन्धकार में प्रवेश’ स्वाभाविक रूप से ‘into darkness’ का अर्थ व्यक्त करता है।
- source_word: በመርበብት
  choice: एक जाल में
  rationale: संज्ञा एकवचन है और फँसाने वाले जाल की ठोस न्याय-छवि बनाए रखती है; ‘फन्दा’ सम्भव विकल्प है।
- source_word: በላህብ ዘይነድድ
  choice: धधकती आग में
  rationale: शाब्दिक भाव ‘जलने वाली ज्वाला/आग’ है। ‘धधकती आग’ तीव्र अग्नि की छवि को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ኀበ ኵነኔ ዐባይ
  choice: महान न्याय में
  rationale: ኀበ का दिशात्मक बल ‘की ओर/में’ है। ‘प्रवेश’ के साथ ‘में’ उस दिशा और पूर्ववर्ती गन्तव्यों की समानान्तर रचना दोनों को व्यक्त करता है।
- source_word: ትበውእ መንፈስክሙ
  choice: तुम्हारी आत्मा प्रवेश करेगी
  rationale: मूल में ‘आत्मा’ और उससे सहमत क्रिया एकवचन हैं, जबकि सम्बोधित लोग बहुवचन हैं। हिन्दी में इस असामान्य संख्या-तनाव को बहुवचन बनाकर मिटाया नहीं गया।
- source_word: ኵነኔ ዐባይ
  choice: महान न्याय
  rationale: ‘न्याय’ शब्द निर्णय, दण्डादेश और न्यायिक प्रक्रिया की व्यापकता बनाए रखता है; ‘दण्ड’ या ‘दोषसिद्धि’ अर्थ को अनावश्यक रूप से संकीर्ण करते।
- source_word: ለኵሉ ትውልደ ዓለም
  choice: अनन्तकाल की सारी पीढ़ियों के लिए
  rationale: यह कठिन, व्यापक काल-सूचक अभिव्यक्ति है। अनुवाद उसकी पीढ़ीगत और स्थायी दोनों ध्वनियाँ बनाए रखता है।
- source_word: ኴሌ ለክሙ
  choice: तुम पर हाय!
  rationale: यह भविष्यद्वक्ताओं और अपोकैलिप्टिक साहित्य में प्रयुक्त कठोर धिक्कार-वाक्य है; ‘हाय’ उसकी चेतावनी और विनाश की ध्वनि को सुरक्षित रखता है।
- source_word: እስመ አልብክሙ ሰላመ
  choice: क्योंकि तुम्हारे लिए शान्ति नहीं है
  rationale: यह अभाव को सीधे व्यक्त करता है और अन्तिम घोषणा की कठोरता बनाए रखता है।
theological_decisions:
- issue: न्याय के प्रसंग में ‘तुम्हारी आत्मा’ का आशय
  choice: मूल की एकवचन अभिव्यक्ति ‘तुम्हारी आत्मा’ को बनाए रखा गया।
  alternative: तुम्हारी आत्माएँ; तुम स्वयं
  rationale: पद शरीर-आत्मा या मृत्यु के बाद की दशा का पूरा सिद्धान्त नहीं देता। इसलिए मूल शब्द को रखा गया और उससे अधिक धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा गया।
- issue: ኵነኔ का न्यायिक बल
  choice: ‘न्याय’
  alternative: दोषसिद्धि; दण्डादेश
  rationale: प्रसंग दण्डात्मक है, फिर भी मूल शब्द का दायरा केवल दोषसिद्धि या दण्ड तक सीमित नहीं है।
- issue: महान न्याय की ओर गति
  choice: ‘महान न्याय में’
  alternative: महान न्याय के लिए
  rationale: दिशासूचक ኀበ को प्रयोजनसूचक बनाना उचित नहीं; अनुवाद न्याय की ओर प्रवेश की स्थानिक-अपोकैलिप्टिक छवि बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गम्भीर, भविष्यद्वक्तामूलक और अपोकैलिप्टिक शैली रखी गई है। ‘अन्धकार’, ‘महान न्याय’, ‘अनन्तकाल’ और ‘तुम पर हाय’ जैसे पद गरिमापूर्ण हैं, फिर भी सामान्य पाठक के लिए समझने योग्य हैं।
