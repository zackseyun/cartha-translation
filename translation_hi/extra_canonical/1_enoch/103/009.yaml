base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/009.yaml
  text: Do not say[a], you righteous and good who are in life, “In the days of our affliction we toiled hard, and we saw every trouble, and we encountered many evils, and we were oppressed and made few[d][c][b], and our spirit became small.”
translation:
  language: hi
  text: 'उन धर्मी और भले लोगों के विषय में, जो जीवित हैं, यह मत कहो[a]: “अपने दुःख के दिनों में हमने कठिन परिश्रम किया; हमने हर प्रकार का कष्ट देखा और अनेक बुराइयों का सामना किया। हम पर अत्याचार हुआ[b], हमारी संख्या बहुत घटा दी गई[c], और हमारी आत्मा छोटी हो गई[d]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन धर्मी और भले लोगों से, जो जीवित हैं, यह मत कहो।” गीइज़ वाक्यरचना में ‘उनके विषय में’ और ‘उनसे’—दोनों अर्थ सम्भव हैं।
    reason: textual_variant
  - marker: b
    text: इस क्रिया का अर्थ अन्याय या हिंसा सहना, अर्थात उत्पीड़ित होना है; इसे ‘बरबाद कर दिए गए’ कहना सम्भवतः अर्थ को अधिक तीव्र कर देगा।
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक भाव: “हम थोड़े कर दिए गए।” यह संख्या में कमी के साथ-साथ घटा या दुर्बल कर दिए जाने का अर्थ भी दे सकता है।'
    reason: lexical_alternative
  - marker: d
    text: शाब्दिक रूप में, “हमारी आत्मा छोटी हो गई।” यह रूपक हतोत्साह, निर्बलता या साहस घट जाने का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትበልዎሙ፡ ለጻድቃን፡ ወኄራን
  choice: उन धर्मी और भले लोगों के विषय में ... यह मत कहो
  rationale: निषेधात्मक क्रिया और उसके साथ आए सर्वनाम/सम्बन्धसूचक पद का आशय सम्भवतः धर्मियों के विषय में ऐसा कहना मना करना है। गीइज़ की रचना ‘उनसे मत कहो’ भी सम्भव बनाती है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: እለ፡ ሀለዉ፡ ውስተ፡ ሕይወት
  choice: जो जीवित हैं
  rationale: शाब्दिक ‘जो जीवन में हैं’ आधुनिक हिन्दी में अस्वाभाविक है। ‘जो जीवित हैं’ वर्तमान सांसारिक जीवन का सीधा अर्थ देता है, पर भावी या आध्यात्मिक जीवन का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: በመዋዕለ፡ ሥራሕነ፡ ዳማ፡ ጻመውነ
  choice: अपने दुःख के दिनों में हमने कठिन परिश्रम किया
  rationale: इस पाठांश का रूप कठिन है, पर प्रसंग दुःख और श्रम की शिकायत का है। ‘कठिन परिश्रम’ तीव्र श्रम का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ወኵሎ፡ ሥራኀ፡ ርኢነ
  choice: हमने हर प्रकार का कष्ट देखा
  rationale: ‘देखा’ मूल अनुभवसूचक रूपक को बनाए रखता है; ‘हर प्रकार का कष्ट’ हिन्दी में समग्र विपत्ति का स्वाभाविक बोध देता है।
- source_word: ወእኩያተ፡ ብዙኃተ፡ ረከብነ
  choice: अनेक बुराइयों का सामना किया
  rationale: ‘पाना/मिलना’ यहाँ प्रतिकूल घटनाओं से मुठभेड़ का बोध देता है। ‘बुराइयाँ’ नैतिक और विपत्तिपरक दोनों सम्भावनाओं को खुला रखता है।
- source_word: ወተወጻዕነ
  choice: हम पर अत्याचार हुआ
  rationale: निष्क्रिय रूप अन्याय, उत्पीड़न या हिंसक दुर्व्यवहार सहने का संकेत देता है। ‘अत्याचार हुआ’ विनाश का अर्थ बढ़ाए बिना इस पारस्परिक अन्याय को व्यक्त करता है।
- source_word: ወውኅድነ
  choice: हमारी संख्या घटाकर बहुत थोड़ी कर दी गई
  rationale: क्रिया घटाए जाने या थोड़े कर दिए जाने का ठोस बोध देती है। संख्या का उल्लेख हिन्दी में अर्थ स्पष्ट करता है, जबकि व्यापक ‘दुर्बल/तुच्छ कर दिए गए’ सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: ወንእስት፡ መንፈስነ
  choice: हमारी आत्मा छोटी पड़ गई
  rationale: मूल का ‘आत्मा छोटी हुई’ रूपक जानबूझकर बचाया गया है। ‘छोटी पड़ गई’ हिन्दी में कुछ स्वाभाविक होते हुए भी हतोत्साह, निर्बलता और साहस-हानि के बीच की अस्पष्टता बनाए रखता है।
theological_decisions:
- issue: ‘जो जीवन में हैं’ में धर्मियों की अवस्था
  choice: इसे ‘जो जीवित हैं’ कहा गया है, अर्थात वर्तमान जीवन में दुःख सह रहे धर्मी और भले लोग।
  alternative: इसे भावी जीवन या किसी विशिष्ट आध्यात्मिक ‘सच्चे जीवन’ में स्थित लोगों के रूप में समझना।
  rationale: विलाप वर्तमान श्रम, कष्ट और अत्याचार का वर्णन करता है। अनुवाद स्थानीय प्रसंग के अनुसार वर्तमान जीवित अवस्था बताता है और भावी युग की शिक्षा इसमें नहीं जोड़ता।
- issue: ‘आत्मा छोटी पड़ गई’ का धर्मवैचारिक/मानवीय आशय
  choice: रूपक को बनाए रखा गया है और उसे केवल ‘विश्वास खो गया’ या ‘आत्मिक पतन हुआ’ नहीं कहा गया।
  alternative: इसे केवल हतोत्साह, शारीरिक निर्बलता, साहस की हानि या आध्यात्मिक पतन के निश्चित अर्थ में प्रस्तुत करना।
  rationale: मूल अभिव्यक्ति भीतर से घट जाने का व्यापक रूपक है। निश्चित मनोवैज्ञानिक या धर्मवैचारिक अर्थ थोपना पाठ की वास्तविक बहुअर्थता मिटा देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। विलाप की प्रथम-पुरुष बहुवचन शैली, ‘कष्ट देखा’ का प्राचीन अनुभवसूचक मुहावरा और अंतिम ‘आत्मा छोटी पड़ गई’ का असामान्य पर अर्थपूर्ण रूपक सुरक्षित रखा गया है। विराम-चिह्नों से लम्बे मूल वाक्य को पठनीय बनाया गया है, बिना कथनक्रम बदले।
