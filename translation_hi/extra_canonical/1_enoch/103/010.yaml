base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/010.yaml
  text: And we were destroyed, and there was no one to help us with a word; and we found nothing. We were tormented and destroyed, and we had no hope of seeing life from day to day.
translation:
  language: hi
  text: और हम नाश हो गए[a], और हमारी सहायता के लिए एक शब्द भी कहने वाला कोई न था[b]; और हमें कुछ भी न मिला[c]। हमें सताया गया और हम नाश हो गए, और हमें दिन-प्रतिदिन जीवन देखने की कोई आशा न थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम मिट गए” अथवा “हम बरबाद हो गए।” यही क्रिया इस पद में दो बार आई है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “एक शब्द से।” आशय यह हो सकता है कि बोलकर, विनती करके या हमारा पक्ष लेकर सहायता करने वाला भी कोई न था; “किसी बात में” भी संभव है।
    reason: cultural_note
  - marker: c
    text: यह उपवाक्य पाठ और वाक्य-विन्यास की दृष्टि से कठिन है। अनुवाद “और हमने कुछ भी प्राप्त नहीं किया” या “और हमें किसी प्रकार राहत न मिली” भी हो सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: ተሐጕልነ
  choice: हम नाश हो गए
  rationale: क्रिया विनाश या बरबादी की प्रबल धारणा व्यक्त करती है। दोनों occurrences में एक ही अनुवाद रखकर मूल की गंभीरता और पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: አልቦ ዘይረድአነ
  choice: कोई न था जो ... हमारी सहायता करता
  rationale: यहाँ अभाव किसी सहायक व्यक्ति का है; इसलिए निर्वैयक्तिक ‘कुछ न था’ के बजाय ‘कोई न था’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: በነገር
  choice: एक शब्द से भी
  rationale: ነገር का मूल अर्थ ‘वचन/बात’ हो सकता है। ‘भी’ जोड़ने से हिंदी में यह भाव स्वाभाविक बनता है कि बोलकर, विनती करके अथवा पक्ष लेकर सहायता करने वाला तक कोई नहीं था, पर संभावित व्यापक अर्थ को पादटिप्पणी में खुला रखा गया है।
- source_word: ወኢበምንትኒ ኢረከብነ
  choice: और हमें कुछ भी न मिला
  rationale: वाक्यांश कठिन है। यह अनुवाद प्राप्ति के पूर्ण अभाव को संक्षेप में व्यक्त करता है और ‘राहत’ जैसी अनुल्लिखित वस्तु जोड़ने से बचता है।
- source_word: ተጸዐርነ
  choice: हमें सताया गया
  rationale: क्रिया दुःख देने, पीड़ित करने या दबाने का भाव रखती है। ‘सताया गया’ आधुनिक हिंदी में सहज है और व्यापक अर्थ को अत्यधिक विशिष्ट नहीं बनाता।
- source_word: ኢተስፈውነ
  choice: हमें ... कोई आशा न थी
  rationale: नकारात्मक रूप केवल आशा न करने की क्रिया नहीं, बल्कि आशा के अभाव को व्यक्त करता है।
- source_word: ከመ ንርአይ ሕይወተ ዕለት እምዕለት
  choice: दिन-प्रतिदिन जीवन देखने की
  rationale: यह मूल के ‘जीवन देखने’ वाले बिंब तथा अगले दिनों तक जीवित रहने की अनिश्चितता, दोनों को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
theological_decisions:
- issue: विलाप की तीव्रता और विनाश-सूचक क्रिया की पुनरावृत्ति
  choice: ‘हम नाश हो गए’ को दोनों स्थानों पर बनाए रखा गया
  alternative: पुनरावृत्ति हटाकर पूरे कथन को सामान्य दुःख या दरिद्रता के रूप में संक्षिप्त करना
  rationale: मूल में दोहराव विलाप को तीव्र करता है। उसे बनाए रखने से न्याय-विलाप की कठोरता सुरक्षित रहती है और पाठ को सामान्य कठिनाई के कथन में नहीं बदला जाता।
- issue: ‘जीवन देखने’ का आशय
  choice: मूल बिंब ‘जीवन देखने’ को रखा गया
  alternative: इसे स्पष्ट रूप से ‘अगले दिन तक जीवित रहने’ के रूप में व्याख्यायित करना
  rationale: मुहावरा निरंतर जीवित रहने का संकेत दे सकता है, किंतु शाब्दिक बिंब भी सार्थक है; अनुवाद दोनों संभावनाओं के बीच की वास्तविक अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज विलाप-शैली अपनाई गई है। मूल की समानांतर संरचना, विनाश-सूचक पुनरावृत्ति और स्पष्ट निराशा को सुरक्षित रखा गया है। कठिन वाक्यांशों को मुख्य पाठ में अति-व्याख्यायित करने के बजाय पादटिप्पणियों में विकल्प दिए गए हैं।
