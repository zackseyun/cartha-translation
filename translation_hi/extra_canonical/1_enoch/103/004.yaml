base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/004.yaml
  text: And your spirits will live[a], you who died in righteousness, and they will rejoice and be glad, and their spirits will not perish, and their remembrance will be before the face of the Great One for all the generations of eternity. And now[e][d][c][b], do not fear their humiliation.
translation:
  language: hi
  text: और तुम, जो धार्मिकता में मरे हो, तुम्हारी आत्माएँ जीवित रहेंगी, आनन्दित और प्रसन्न होंगी[a]। उनकी आत्माएँ नाश न होंगी, और उनका स्मरण अनन्तकाल की सारी पीढ़ियों तक महान के सम्मुख रहेगा[b]। और अब उनके अपमान से मत डरो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'आरम्भिक मूल-वाक्य की रचना में संख्या और संबोधन का तनाव है। इसे अधिक शाब्दिक ढंग से इस प्रकार भी समझा जा सकता है: “तुम्हारी आत्मा जीवित रहेगी—तुममें से वे जिनकी मृत्यु धार्मिकता में हुई।” आगे मूल में “उनकी आत्माएँ” बहुवचन है।'
    reason: व्याकरणिक अस्पष्टता और वैकल्पिक अनुवाद
  - marker: b
    text: “महान के सम्मुख” का शाब्दिक रूप “महान के मुख के सामने” है। “अनन्तकाल” के लिए प्रयुक्त शब्द का अनुवाद “युग” या “संसार” भी हो सकता है, पर यहाँ उसका कालगत अर्थ अधिक उपयुक्त है।
    reason: मूल मुहावरे और कालगत शब्दार्थ की व्याख्या
  - marker: c
    text: “अपमान” का अनुवाद “तिरस्कार,” “लज्जा” या “दुर्दशा” भी हो सकता है।
    reason: शब्दार्थ का विकल्प
lexical_decisions:
- source_word: የሐይዉ መንፈስክሙ
  choice: तुम्हारी आत्माएँ जीवित रहेंगी
  rationale: መንፈስ को मृत्यु के बाद के अस्तित्व के संदर्भ में ‘आत्मा’ कहा गया है। हिन्दी में बहुवचन संबोधन के साथ बहुवचन स्वाभाविक है, जबकि स्रोत की व्याकरणिक असंगति/अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ለእለ ሞትክሙ በጽድቅ
  choice: तुम जो धार्मिकता में मरे हो
  rationale: ‘धार्मिकता में’ संज्ञात्मक और धर्मवैचारिक बल को बनाए रखता है; इसे केवल ‘निर्दोष होकर’ या ‘न्यायपूर्वक’ कहकर सीमित नहीं किया गया।
- source_word: ይትፌሥሑ ወይትሐሠዩ
  choice: आनन्दित और प्रसन्न होंगी
  rationale: आनन्द व्यक्त करने वाली दोनों समानांतर क्रियाओं को अलग-अलग शब्द देकर मूल की पुनरुक्तिपूर्ण काव्यात्मकता रखी गई है।
- source_word: ኢይትሐጐሉ መንፈሳቲሆሙ
  choice: उनकी आत्माएँ नाश न होंगी
  rationale: नकारात्मक भविष्य और प्रलय-संबंधी गंभीरता को सीधे ढंग से व्यक्त करता है।
- source_word: ዝካሮሙ
  choice: उनका स्मरण
  rationale: यह केवल मनोवैज्ञानिक ‘याद’ नहीं, बल्कि महान के समक्ष बने रहने वाले स्मरण का भाव देता है।
- source_word: እምቅድመ ገጸ ለዐቢይ
  choice: महान की उपस्थिति में
  rationale: ‘मुख के सामने’ उपस्थिति-सूचक मुहावरा है; स्वाभाविक हिन्दी में उसका अर्थ दिया गया, जबकि ‘महान’ दिव्य उपाधि को बिना ‘परमेश्वर’ जोड़कर सुरक्षित रखा गया।
- source_word: ለኵሉ ትውልደ ዓለም
  choice: अनन्तकाल की सारी पीढ़ियों तक
  rationale: यहाँ ዓለም का कालगत अर्थ उपयुक्त है और उपलब्ध यूनानी साक्ष्य के αἰῶνος से मेल खाता है; वाक्य स्मरण की स्थायी अवधि बताता है।
- source_word: ኢትፍርህዎ ለኀሣሮሙ
  choice: उनके अपमान से मत डरो
  rationale: ኀሣር के अपमान, तिरस्कार और लज्जाजनक दुर्दशा जैसे अर्थों में से ‘अपमान’ संक्षिप्त और संदर्भानुकूल है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: मृत्यु के बाद के अस्तित्व के लिए मानव-स्वरूप संबंधी शब्द
  choice: आत्मा
  alternative: प्राण / श्वास
  rationale: यहाँ आत्माओं के जीवित रहने, आनन्दित होने और नाश न होने की बात है। ‘आत्मा’ आधुनिक हिन्दी में መንፈስ का सबसे सुबोध समतुल्य है, पर इससे बाद की किसी विशिष्ट दार्शनिक या सांप्रदायिक आत्मा-सिद्धि को परिभाषित नहीं किया गया।
- issue: दिव्य उपाधि ለዐቢይ
  choice: महान
  alternative: महान परमेश्वर / परमेश्वर
  rationale: मूल में एक उपाधि है, स्पष्ट सामान्य संज्ञा ‘परमेश्वर’ नहीं। ‘महान’ रखने से हनोक-साहित्य की विशिष्ट, महिमामय भाषा बनी रहती है।
- issue: धर्मी मृतकों को संबोधन की व्याकरणिक रचना
  choice: तुम जो धार्मिकता में मरे हो, तुम्हारी आत्माएँ जीवित रहेंगी
  alternative: तुम्हारी आत्मा जीवित रहेगी—तुममें से जिनकी मृत्यु धार्मिकता में हुई
  rationale: मुख्य पाठ को स्वाभाविक हिन्दी बनाया गया है, पर स्रोत के एकवचन ‘तुम्हारी आत्मा’ और बाद के बहुवचन ‘उनकी आत्माएँ’ के तनाव को पादटिप्पणी में स्पष्ट करके मिटाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘महान’ जैसी हनोक-साहित्य की विशिष्ट उपाधि और ‘धार्मिकता’ जैसे प्रमुख धर्मवैचारिक शब्द सुरक्षित हैं। समानार्थी आनन्द-क्रियाओं की जोड़ी मूल की लय और बल को बनाए रखती है।
