base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/007.yaml
  text: Know that they will bring your souls down to Sheol[e][d][c][b][a], and their recompense will be evil and great.
translation:
  language: hi
  text: जान लो कि वे तुम्हारी आत्माओं[a] को शिओल[b][c] में उतार देंगे; वे बुरी दशा में होंगी, और उनका क्लेश बहुत बड़ा होगा।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारी रूहों को।’ मूल शब्द ‘आत्माओं’ या ‘रूहों’—दोनों अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शिओल यहूदी परंपरा में मृतकों का लोक है; यहाँ इसे केवल ‘कब्र’ नहीं कहा गया है।
    reason: cultural_note
  - marker: c
    text: या ‘वह तुम्हारी आत्माओं को शिओल में उतार देगा।’ क्रिया के कर्ता को अलग ढंग से समझना संभव है।
    reason: textual_ambiguity
  - marker: d
    text: 'शाब्दिक रूप के अधिक निकट: ‘वे बुरी दशा में होंगी; उनका क्लेश बड़ा होगा।’'
    reason: translation_note
lexical_decisions:
- source_word: ታእምርዎሙ፡ እስመ
  choice: जान लो कि
  rationale: जानने की क्रिया के साथ लगा बहुवचन कर्म-प्रत्यय आगामी उपवाक्य का पूर्वसूचक है; इसलिए शाब्दिक ‘उन्हें जान लो, क्योंकि’ के बजाय स्वाभाविक हिन्दी में विषयवाचक ‘जान लो कि’ रखा गया है।
- source_word: ለሲኦል
  choice: शिओल में
  rationale: यह मृतकों के लोक का पारंपरिक यहूदी नाम है। ‘कब्र’ या सामान्य ‘अधोलोक’ कहने से मूल का सांस्कृतिक और प्रलय-साहित्यिक स्वर संकुचित हो जाता।
- source_word: ያወርዶዎሙ
  choice: उतार देंगे
  rationale: कारक क्रिया नीचे ले जाने या उतारने का भाव देती है। ‘फेंक देंगे’ अनावश्यक हिंसात्मक तीव्रता जोड़ता। कर्ता की पाठगत अनिश्चितता पाद-टिप्पणी में रखी गई है।
- source_word: ለመናፍስቲክሙ
  choice: तुम्हारी आत्माओं
  rationale: यह शब्द आत्माओं या प्राणों/आत्मिक सत्ताओं का बोध करा सकता है। मृत्यु के बाद शिओल में उतरने के संदर्भ में ‘आत्माओं’ स्वाभाविक है; ‘आत्मिक अस्तित्वों’ जैसी कृत्रिम अभिव्यक्ति से बचा गया है।
- source_word: እኩያተ ይከውና
  choice: वे दुर्दशा में होंगी
  rationale: स्त्रीलिंग बहुवचन क्रिया पूर्ववर्ती ‘आत्माओं’ से मेल खाती है और उनके बुरे या दयनीय हाल में होने को व्यक्त करती है। ‘उनका प्रतिफल बुरा होगा’ इस वाक्य-विन्यास को बदल देता है।
- source_word: ምንዳቤሆሙ ዐቢየ
  choice: उनका क्लेश बहुत बड़ा होगा
  rationale: ምንዳቤ का अर्थ यहाँ क्लेश, संकट या पीड़ा है, प्रतिफल नहीं। अंतिम विशेषण उसकी गंभीरता पर बल देता है, जिसे ‘बहुत बड़ा’ से व्यक्त किया गया है।
theological_decisions:
- issue: ሲኦል को सामान्य स्थानवाचक संज्ञा बनाना या पारंपरिक नाम बनाए रखना
  choice: शिओल
  alternative: अधोलोक / कब्र
  rationale: पारंपरिक नाम मूल यहूदी परलोक-कल्पना को सुरक्षित रखता है और उसे केवल भौतिक कब्र तक सीमित नहीं करता।
- issue: መናፍስት का अनुवाद
  choice: आत्माएँ
  alternative: आत्मिक प्राण / रूहें
  rationale: ‘आत्माएँ’ आधुनिक मानक हिन्दी में स्पष्ट और गरिमापूर्ण है, जबकि मूल की व्यापक अर्थ-संभावना पाद-टिप्पणी में बताई गई है।
- issue: अंतिम खंड को प्रतिफल या क्लेश के रूप में समझना
  choice: दुर्दशा और बड़ा क्लेश
  alternative: बुरा और बड़ा प्रतिफल
  rationale: ምንዳቤ का शाब्दिक क्षेत्र क्लेश/संकट है, और ይከውና व्याकरणतः ‘आत्माओं’ से जुड़ता है; इसलिए इसे प्रतिफल-वाक्य में बदलना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी, साधारण पाठक के लिए स्पष्ट किंतु गरिमापूर्ण। ‘शिओल’ जैसी स्रोत-सांस्कृतिक संज्ञा को बनाए रखते हुए उसका संक्षिप्त स्पष्टीकरण दिया गया है। वाक्य की चेतावनीपूर्ण, न्याय-संबंधी गंभीरता सुरक्षित रखी गई है; विवादित व्याकरण और शब्दार्थ को मुख्य पाठ में कृत्रिम रूप से निर्णीत करने के बजाय पाद-टिप्पणियों में दर्शाया गया है।
