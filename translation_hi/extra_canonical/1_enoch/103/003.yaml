base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/003.yaml
  text: For every good thing and joy and glory have been prepared and written down for the spirits of those who died in righteousness[a]; and much good will be given to you as the fruit of your labor[c][b], and your portion will abound beyond the portion of the living.
translation:
  language: hi
  text: क्योंकि हर भली वस्तु, आनन्द और महिमा उन लोगों की आत्माओं के लिए तैयार की गई हैं और लिखी गई हैं जो धार्मिकता में मर गए[a]; और तुम्हें तुम्हारे परिश्रम के फल के रूप में बहुत भलाई दी जाएगी[b], और तुम्हारा भाग जीवितों के भाग से कहीं बढ़कर होगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘लिखी गई’ का अनुवाद ‘दर्ज की गई’ भी हो सकता है। यह भाषा धर्मी मृतकों के लिए रखे गए किसी स्वर्गीय अभिलेख की ओर संकेत कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘तुम्हारे परिश्रम का फल।’ यह रूपक परिश्रम से निकलने वाली भावी उपज की छवि बनाए रखता है।
    reason: lexical_alternative
  - marker: c
    text: 'इसका अनुवाद यह भी हो सकता है: ‘तुम्हारा हिस्सा जीवितों के हिस्से से अधिक होगा।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: क्योंकि
  rationale: यह पिछले प्रोत्साहन का आधार बताने वाला संयोजक है; ‘क्योंकि’ उसके कारणसूचक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ኵሉ ሠናይ
  choice: हर भली वस्तु
  rationale: यह समस्त भलाई को समेटने वाली व्यापक अभिव्यक्ति है; ‘हर भली वस्तु’ इसे केवल ‘आशीष’ जैसे अधिक व्याख्यात्मक शब्द तक सीमित नहीं करती।
- source_word: ፍሥሓ
  choice: आनन्द
  rationale: यह वर्तमान मानक हिन्दी में स्वाभाविक और गरिमापूर्ण है तथा भलाई और महिमा के साथ त्रिक में ठीक बैठता है।
- source_word: ክብር
  choice: महिमा
  rationale: अंतकालीन प्रतिफल के संदर्भ में ‘महिमा’ शब्द के गौरव और दीप्ति दोनों को बनाए रखती है।
- source_word: ተደለወ ወተጽሕፈ
  choice: तैयार की गई और लिखी गई है
  rationale: दोनों कर्मवाच्य क्रियाओं को स्पष्ट रखा गया है; ‘लिखी गई’ स्वर्गीय अभिलेख की सम्भावित छवि को बिना विस्तार दिए बचाती है।
- source_word: ለመንፈሳቲሆሙ
  choice: उन लोगों की आत्माओं के लिए
  rationale: यहाँ መንፈስ मृतकों के देहरहित आत्मिक अस्तित्व की ओर संकेत करता है। आधुनिक हिन्दी में ‘आत्मा’ इसका सबसे सहज शब्द है, यद्यपि इसका आशय ‘प्राण’ नहीं है।
- source_word: ለእለ ሞቱ በጽድቅ
  choice: जो धार्मिकता में मर गए
  rationale: ‘धार्मिकता में’ संज्ञात्मक नैतिक क्षेत्र को बनाए रखता है और इसे केवल ‘धर्मी ढंग से’ मरने की रीति में नहीं बदलता।
- source_word: ይትወሀብ ለክሙ
  choice: तुम्हें ... दी जाएगी
  rationale: भविष्यत् कर्मवाच्य प्रतिज्ञा को सीधी और पठनीय हिन्दी में रखा गया है।
- source_word: ተክለ ጻማክሙ
  choice: तुम्हारे परिश्रम के फल के रूप में
  rationale: ‘फल’ श्रम से उपजने वाली भावी फसल की रूपकात्मक छवि को बनाए रखता है और इसे सीधे अमूर्त ‘प्रतिफल’ में नहीं बदलता।
- source_word: ክፍልክሙ
  choice: तुम्हारा भाग
  rationale: ‘भाग’ आवंटित हिस्से या विरासत के अर्थ को सहज, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ፈድፋደ እምክፍለ ሕያዋን
  choice: जीवितों के भाग से कहीं बढ़कर होगा
  rationale: यह तुलनात्मक अधिकता को स्पष्ट रखता है; ‘कहीं बढ़कर’ प्रचुरता का भाव देता है, पर स्रोत से आगे नहीं जाता।
theological_decisions:
- issue: मृतकों के लिए प्रयुक्त मानव-स्वरूप संबंधी शब्द
  choice: आत्माएँ
  alternative: प्राण; रूहें
  rationale: गीज़ መንፈስ का मूल अर्थ ‘spirit’ है। मानक हिन्दी में ‘आत्मा’ सबसे स्वाभाविक समकक्ष है; अनुवाद शरीर से अलग अस्तित्व के स्वरूप पर कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
- issue: लिखे हुए अभिलेख का अर्थ
  choice: लिखी गई है
  alternative: स्वर्ग में दर्ज की गई है; स्वर्गीय पुस्तकों में अंकित है
  rationale: पाठ सम्भवतः स्वर्गीय अभिलेख की ओर संकेत करता है, पर इस पद में केवल लिखे जाने की बात है; इसलिए स्थान या पुस्तकों का उल्लेख नहीं जोड़ा गया।
- issue: धार्मिकता और प्रतिफल का संबंध
  choice: परिश्रम के फल के रूप में बहुत भलाई दी जाएगी
  alternative: तुम्हारे परिश्रम का प्रतिफल दिया जाएगा
  rationale: स्रोत की कृषि-संबंधी ‘फल’ की छवि को बनाए रखा गया है और अनुग्रह बनाम अर्जित प्रतिफल के प्रश्न को पाठ से अधिक निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, शास्त्रीय किंतु सहज शैली अपनाई गई है। ‘धार्मिकता’, ‘महिमा’ और ‘भाग’ जैसे शब्द मूल की अंतकालीन तथा नैतिक गंभीरता रखते हैं; वाक्य-विन्यास को सामान्य पाठक के लिए स्पष्ट रखा गया है।
