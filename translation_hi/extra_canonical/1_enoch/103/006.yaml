review_pass:
  verdict: revise
  source_fidelity: The translation correctly follows the contextual/source-supported reading that they did not see distress and slaughter during their lifetime. It retains both occurrences of the lifetime limitation and renders the final clause as a judicial action not carried out upon them. ‘सम्मान’ accurately conveys the social-honor sense of ስብሐት.
  naturalness: The verse is generally clear and appropriately elevated. However, ‘उनके विरुद्ध न्याय लागू नहीं किया गया’ is bureaucratic and less idiomatic in Hindi for judgment being executed. ‘उन पर न्याय कार्यान्वित नहीं हुआ’ is more natural and preserves the passive judicial force.
  terminology: ‘सुख-समृद्धि,’ ‘धन-दौलत,’ ‘संकट,’ ‘संहार,’ and ‘सम्मान’ are suitable modern-Hindi renderings in context. ‘न्याय कार्यान्वित नहीं हुआ’ better expresses ኢትገብረ ሎሙ than ‘न्याय लागू नहीं किया गया.’
  issues:
