base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/006.yaml
  text: And now they have died in prosperity and in wealth and they did not see distress and slaughter in their lifetime[a]; and they died in honor[c][b], and judgment was not executed against them in their lifetime.
translation:
  language: hi
  text: और अब वे सुख-समृद्धि[a] और धन-दौलत में मरे; अपने जीवनकाल में उन्होंने न संकट देखा, न संहार[b]। वे सम्मान के साथ मरे, और उनके जीवनकाल में उन पर न्याय कार्यान्वित नहीं हुआ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भलाई’ अथवा ‘कुशलता’। गीइज़ शब्द अधिक व्यापक रूप से अच्छी या अनुकूल दशा भी जता सकता है।
    reason: lexical_alternative
  - marker: b
    text: उपलब्ध प्रतिलेख में यहाँ ऐसा रूप है जिसे अक्षरशः पढ़ने पर अर्थ हो सकता है, ‘और संकट में, और उन्होंने संहार देखा।’ किंतु प्रसंग और संभावित प्रतिलेखन-दोष के आधार पर पाठ को ‘उन्होंने संकट और संहार नहीं देखा’ समझा गया है।
    reason: textual_variant
  - marker: c
    text: इस पंक्ति का आशय यह है कि उनके जीवनकाल में उन पर न्याय कार्यान्वित नहीं हुआ; यह अपने-आप में अंतिम न्याय का निषेध नहीं करता।
    reason: theological_clarification
lexical_decisions:
- source_word: ሠናይ
  choice: सुख-समृद्धि
  rationale: यह शब्द सामान्यतः भलाई या अनुकूल दशा भी जता सकता है; धन के साथ प्रयुक्त होने के कारण यहाँ सुखपूर्ण और समृद्ध परिस्थिति अभिप्रेत है।
- source_word: ብዕል
  choice: धन-दौलत
  rationale: यहाँ भौतिक संपन्नता का सहज, आधुनिक हिन्दी रूप है।
- source_word: ምንዳቤ
  choice: संकट
  rationale: यह कष्ट, विपत्ति या क्लेश को व्यक्त करता है; ‘संकट’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: ቀትለ
  choice: संहार
  rationale: साधारण मृत्यु की अपेक्षा हिंसक वध का प्रबल अर्थ बनाए रखता है।
- source_word: ስብሐት
  choice: सम्मान
  rationale: इस प्रसंग में ईश्वरीय महिमा से अधिक प्रतिष्ठित दशा में मरना अभिप्रेत प्रतीत होता है।
- source_word: ኵነኔ
  choice: न्याय
  rationale: यह दंडादेश या दंड का अर्थ भी दे सकता है; ‘न्याय’ व्यापक न्यायिक भाव को सुरक्षित रखता है।
- source_word: ኢትገብረ ሎሙ
  choice: उनके विरुद्ध ... लागू नहीं किया गया
  rationale: निष्क्रिय क्रिया का न्यायिक भाव व्यक्त होता है कि उनके सांसारिक जीवन में उन पर न्याय कार्यान्वित नहीं हुआ।
theological_decisions:
- issue: क्या दुष्ट लोग हर प्रकार के न्याय से बच गए, या केवल अपने सांसारिक जीवन में न्याय से बचे रहे?
  choice: कथन को स्पष्ट समय-सीमा ‘उनके जीवनकाल में’ तक रखा गया है।
  alternative: उन्हें कभी भी किसी न्याय का सामना नहीं करना पड़ा।
  rationale: मूल में ‘उनके जीवन में’ की पुनरावृत्ति कथन को उनकी पृथ्वी की वर्तमान दशा तक सीमित करती है; इससे अंतिम न्याय के विषय में न तो निषेध जोड़ा जाता है, न उसे इस पद में प्रत्यक्ष रूप से घोषित किया जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘धन-दौलत’ और ‘अपने जीवनकाल में’ सामान्य पाठक के लिए स्वाभाविक हैं; अपोकैलिप्टिक तथा न्यायिक गंभीरता बनाए रखने के लिए ‘संहार’ और ‘न्याय लागू नहीं किया गया’ चुने गए हैं।
