base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/005.yaml
  text: Woe to you[a], dead sinners, when you die in the wealth of your sins, and those like you say about you, ‘Blessed are these sinners[d][c][b]; they have seen all their days.’
translation:
  language: hi
  text: हाय, तुम पर, हे मरे हुए पापियो! जब तुम अपने पापों की समृद्धि में मरते हो,[a] तब तुम्हारे जैसे लोग तुम्हारे विषय में कहते हैं, “ये पापी धन्य हैं; इन्होंने अपने सारे दिन देखे हैं।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इथियोपिक पाठ में यह वाक्यांश कठिन है। संभवतः इसका अर्थ ‘अपने पापों की समृद्धि में’ या ‘अपने पापों के धन में’ है; इसे ‘अपने पापों में’ भी समझा जा सकता है।
    reason: textual_variant
  - marker: b
    text: अर्थात्, ‘वे अपने जीवन के सारे दिन देखने तक जीवित रहे’; उनके जैसे लोग पूर्ण आयु और दिखाई देने वाली समृद्धि को धन्यता मानते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: हाय तुम पर
  rationale: यह भविष्यद्वाणी की न्यायसूचक धिक्कार-वाणी है; ‘हाय’ आधुनिक हिन्दी में इसके विलाप और न्याय, दोनों स्वरों को बनाए रखता है।
- source_word: ምውታን፡ ኃጥኣን
  choice: हे मरे हुए पापियो
  rationale: ምውታን को हटाए बिना संबोधन की जानबूझकर की गई पुनरुक्ति सुरक्षित रखी गई है। ‘मरे हुए’ औपचारिक ‘मृत’ की अपेक्षा अगले ‘मरते हो’ के साथ मूल की पुनरुक्ति को अधिक स्पष्ट करता है।
- source_word: ሶበ፡ ትመውቱ
  choice: जब तुम ... मरते हो
  rationale: ሶበ का कालवाचक अर्थ और चेतावनी की सीधी तात्कालिकता सुरक्षित है।
- source_word: በብዕሲ፡ ኃጢአትክሙ
  choice: अपने पापों की समृद्धि में
  rationale: प्राप्त पाठ कठिन है, पर संशोधित पठन በብዕለ ‘समृद्धि/धन में’ आर्थिक आशय देता है और अगले पद के समृद्धि-विषय से मेल खाता है। ‘समृद्धि’ धन-संपन्नता तथा पापों की फलती-बढ़ती अवस्था—दोनों की संभावित प्रतिध्वनि रखता है।
- source_word: ወይብሉ፡ ዲቤክሙ
  choice: तुम्हारे विषय में कहते हैं
  rationale: डीबे- के संबंधवाचक अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: እለ፡ ከማክሙ
  choice: तुम्हारे जैसे लोग
  rationale: तुलनात्मक अर्थ और उसी नैतिक वर्ग के लोगों का संकेत दोनों सुरक्षित हैं।
- source_word: ብፁዓን፡ እሙንቱ፡ ኃጥኣን
  choice: ये पापी धन्य हैं
  rationale: ‘धन्य’ मूल की आशीर्वचन-जैसी, किंतु प्रसंग में विडंबनापूर्ण, घोषणा को बनाए रखता है।
- source_word: ኵሎ፡ መዋዕሎሙ፡ ርእዩ
  choice: इन्होंने अपने सारे दिन देखे हैं
  rationale: मूल मुहावरे को जानबूझकर शाब्दिक रखा गया है; इसका संभावित अर्थ पूर्ण आयु तक जीवित रहना है, जिसे पादटिप्पणी स्पष्ट करती है।
theological_decisions:
- issue: मरे हुए पापियों के विषय में उनके समान लोगों की घोषणा
  choice: 'विडंबनापूर्ण आशीर्वचन: ‘ये पापी धन्य हैं’'
  alternative: इसे केवल लंबी आयु या समृद्ध जीवन की सीधी प्रशंसा के रूप में प्रस्तुत करना
  rationale: पद में ईश्वरीय ‘हाय’ और मनुष्यों के ‘धन्य’ कहने का तनाव है। अनुवाद इस उलट मूल्यांकन को समझाकर समाप्त नहीं करता, बल्कि पाठ में रहने देता है।
- issue: ‘पापों की समृद्धि’ का अर्थ
  choice: कठिन आर्थिक रूपक को मुख्य पाठ में बनाए रखना
  alternative: सामान्यीकृत ‘अपने पापों में’
  rationale: संभावित በብዕለ पठन और निकट प्रसंग धन तथा समृद्धि की आलोचना की ओर संकेत करते हैं; फिर भी पाठगत कठिनाई पादटिप्पणी में खुली रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधी, गरिमापूर्ण अपोकैलिप्टिक धिक्कार-वाणी। मूल की असामान्य पुनरुक्ति (‘मरे हुए...मरते हो’), कठिन आर्थिक रूपक और विडंबनापूर्ण ‘धन्य’ को सहज बनाकर मिटाया नहीं गया है।
