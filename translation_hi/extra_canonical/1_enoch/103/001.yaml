base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/001.yaml
  text: And now I know this mystery for you[a], O righteous ones, by the glory of the Great and Honored and Mighty One in dominion[c][b], and by his greatness I know it for you.
translation:
  language: hi
  text: और अब, हे धर्मियो, मैं महान, आदरणीय और राज्य में सामर्थी जन की महिमा की शपथ खाकर तुमसे कहता हूँ; उसकी महानता की शपथ खाकर मैं तुमसे कहता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይእዜኒ
  choice: और अब
  rationale: संयोजक और तात्कालिक काल-संकेत, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: እምሕል
  choice: शपथ खाकर ... कहता हूँ
  rationale: गीज़ क्रिया መሐለ से यह रूप शपथ खाने की घोषणा व्यक्त करता है। हिन्दी में केवल ‘शपथ खाता हूँ’ की अपेक्षा ‘शपथ खाकर तुमसे कहता हूँ’ संबोधन के साथ अधिक स्वाभाविक है; पद में इसकी पुनरावृत्ति भी रखी गई है।
- source_word: ለክሙ
  choice: तुमसे
  rationale: शपथपूर्ण कथन के संबोधित व्यक्तियों को दर्शाता है और आधुनिक हिन्दी मुहावरे के अनुरूप है।
- source_word: ጻድቃን
  choice: धर्मियो
  rationale: बहुवचन समूह-संबोधन को संक्षिप्त, प्रतिष्ठित और बोधगम्य हिन्दी में व्यक्त करता है।
- source_word: በስብሐቱ
  choice: उसकी महिमा की ... शपथ
  rationale: बा- उपसर्ग को यहाँ शपथ के आधार के रूप में समझा गया है; ‘उसकी’ से महिमावान व्यक्ति के साथ संबंध स्पष्ट रहता है।
- source_word: ለዐቢይ ወለክቡር
  choice: महान और आदरणीय जन
  rationale: दोनों समन्वित विशेषण एक ही महिमामय व्यक्ति के लिए हैं। ‘जन’ जोड़ने से हिन्दी वाक्य व्याकरणसम्मत बनता है, बिना उसे मुख्य पाठ में स्पष्टतः ‘परमेश्वर’ कहे।
- source_word: ወዕዙዘ መንግሥት
  choice: जो अपने राज्य में सामर्थी है
  rationale: इसे उसी महान और आदरणीय व्यक्ति का तीसरा वर्णन माना गया है, न कि अलग ‘सामर्थी राज्य’। संबंधवाचक उपवाक्य संकुचित गीज़ रचना को स्वाभाविक हिन्दी में खोलता है।
- source_word: ወበዕበዩ
  choice: उसकी महानता की शपथ खाकर
  rationale: सर्वनामिक प्रत्यय और शपथ-सूचक instrumental संबंध दोनों को स्पष्ट करता है तथा समानांतर शपथ-वाक्य को बनाए रखता है।
theological_decisions:
- issue: क्या እምሕል साधारण या रहस्योद्घाटित ज्ञान बताता है, अथवा शपथ खाना
  choice: 'इसे शपथसूचक क्रिया माना गया है: ‘शपथ खाकर ... कहता हूँ।’'
  alternative: ‘मैं तुम्हारे लिए यह रहस्य जानता हूँ’ या केवल ‘मैं जानता हूँ।’
  rationale: गीज़ መሐለ का सामान्य अर्थ ‘शपथ खाना’ है और ‘महिमा की’ तथा ‘महानता की’ जैसे साधनवाचक पद शपथ-सूत्र से स्वाभाविक रूप से जुड़ते हैं। ‘रहस्य’ मूल पद में स्पष्ट संज्ञा के रूप में नहीं है, इसलिए उसे मुख्य पाठ में जोड़ना उचित नहीं।
- issue: ‘महान और आदरणीय’ का संदर्भ
  choice: इसे एक महिमामय, संभवतः दिव्य व्यक्ति की उपाधि के रूप में रखा गया है, पर मुख्य पाठ में ‘परमेश्वर’ नहीं जोड़ा गया।
  alternative: संदर्भ को स्पष्ट करते हुए सीधे ‘परमेश्वर’ कहना, अथवा विशेषणों को ‘राज्य’ से जोड़ना।
  rationale: संदर्भ दिव्य अभिप्राय की ओर संकेत करता है, किंतु मूल में नाम के स्थान पर उपाधियाँ हैं। अनुवाद उसी निहितार्थ और अस्पष्टता को सुरक्षित रखता है।
- issue: መንግሥት का संबंध
  choice: ‘राज्य में सामर्थी’ को महान और आदरणीय जन का वर्णन माना गया है।
  alternative: ‘आदरणीय और सामर्थी राज्य’ को एक अलग पद मानना।
  rationale: समन्वित विशेषणों की व्याकरणिक शृंखला एक ही व्यक्ति का वर्णन करती है; इससे किसी अलग महिमामय राज्य को शपथ का विषय बनाने की अनावश्यक व्याख्या से बचा जाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है, किंतु शपथ-सूत्र की गंभीरता और अपोकैलिप्टिक गरिमा बनाए रखने के लिए ‘हे धर्मियो’, ‘महिमा’ और ‘महानता’ जैसे प्रतिष्ठित शब्द चुने गए हैं। मूल की दोहराई हुई शपथ को मिटाया नहीं गया; हिन्दी प्रवाह के लिए दूसरी बार ‘फिर’ जोड़ा गया है।
