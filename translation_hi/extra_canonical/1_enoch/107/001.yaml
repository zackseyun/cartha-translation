base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/107/001.yaml
  text: And I saw written upon them that generation after generation will transgress[a], until a generation of righteousness arises, and iniquity is destroyed, and sin passes away from the earth[b], and every good thing comes upon it.
translation:
  language: hi
  text: 'और मैंने उन पर यह लिखा हुआ देखा: पीढ़ी-दर-पीढ़ी अपराध करती रहेगी, जब तक धार्मिकता की एक पीढ़ी उठ खड़ी न हो; तब अधर्म नष्ट हो जाएगा, पाप पृथ्वी पर से मिट जाएगा और हर प्रकार की भलाई उस पर आएगी।


    “और अब, मेरे पुत्र, जाओ और अपने पुत्र लेमेक को बता दो कि यह जो पुत्र उत्पन्न हुआ है, वह सचमुच उसी का पुत्र है; यह बात झूठी नहीं है।”[a]


    जब मतूशेलह ने अपने पिता हनोक की बात सुनी—क्योंकि हनोक ने उसे सब कुछ गुप्त रूप से दिखाया था—तो वह उसके पास लौट गया और उसे वह सब बताया। उसने उस बालक का नाम नूह रखा, क्योंकि वह पृथ्वी को उसके सारे विनाश से राहत देगा।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “वह वास्तव में उसका पुत्र है और यह झूठ नहीं है।”'
    reason: मूल की असामान्य और जोरदार पितृत्व-पुष्टि को स्पष्ट करना।
  - marker: b
    text: “राहत देगा” का अनुवाद “आनन्दित करेगा” या “सांत्वना देगा” भी हो सकता है।
    reason: गीज़ क्रिया के अर्थ-क्षेत्र और नूह के नाम से जुड़े संकेत की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: ወርኢኩ፡ ጽሑፈ፡ በላዕሌሆሙ
  choice: और मैंने उन पर यह लिखा हुआ देखा
  rationale: प्रत्यक्ष दर्शन-वृत्तांत और ‘उन पर लिखा हुआ’—दोनों को रखा गया है; ‘उन’ का पूर्वसंदर्भ जानबूझकर स्पष्ट नहीं किया गया।
- source_word: ትውልድ፡ እምትውልድ፡ ትኤብስ
  choice: पीढ़ी-दर-पीढ़ी अपराध करती रहेगी
  rationale: पुनरावृत्त पीढ़ियों और लगातार उल्लंघन के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ትውለደ፡ ጽድቅ
  choice: धार्मिकता की एक पीढ़ी
  rationale: ‘धार्मिकता’ अमूर्त संज्ञा के रूप में मूल की बनावट और युगान्तकारी विरोध को बनाए रखती है।
- source_word: አበሳ ... ኀጢአት
  choice: अधर्म ... पाप
  rationale: दो निकटार्थक नैतिक शब्दों के बीच मूल का भेद बनाए रखने के लिए अलग हिन्दी पद चुने गए हैं।
- source_word: ሠናይ
  choice: हर प्रकार की भलाई
  rationale: संज्ञात्मक ‘सारी अच्छी वस्तु/भलाई’ को स्वाभाविक और व्यापक हिन्दी में व्यक्त किया गया है।
- source_word: አማን፡ ወኢኮነ፡ ሐሰተ
  choice: सचमुच उसी का पुत्र है; यह बात झूठी नहीं है
  rationale: ‘सत्य’ और ‘झूठ’ के स्पष्ट विरोध को बिना वंश-संबंधी अटकल जोड़े सुरक्षित रखा गया है।
- source_word: ኖኅ
  choice: नूह
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप अपनाया गया है।
- source_word: ያስተፌሥሓ፡ ለምድር
  choice: पृथ्वी को ... राहत देगा
  rationale: क्रिया में प्रसन्न करने/सांत्वना देने का भाव है; विनाश के संदर्भ में ‘राहत देगा’ स्वाभाविक हिन्दी है, जबकि शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: धार्मिक पीढ़ी और पाप के अन्त का युगान्तकारी कथन
  choice: जब तक धार्मिकता की एक पीढ़ी उठ खड़ी न हो; तब अधर्म नष्ट हो जाएगा
  alternative: जब तक धर्मी लोगों की पीढ़ी न उठे
  rationale: मूल का ‘धार्मिकता की पीढ़ी’ वाला अमूर्त और तनावपूर्ण रूप रखा गया है; इसे किसी विशेष समुदाय या सिद्धान्त से नहीं जोड़ा गया।
- issue: नूह के पितृत्व की पुष्टि
  choice: वह सचमुच उसी का पुत्र है; यह बात झूठी नहीं है
  alternative: वह निश्चय ही लेमेक का पुत्र है और कोई छल नहीं है
  rationale: मूल की असामान्य दोहरी पुष्टि को बनाए रखते हुए उसके पीछे कोई अतिरिक्त अलौकिक या जैविक व्याख्या नहीं जोड़ी गई।
- issue: नूह के नाम से जुड़ा कार्य
  choice: वह पृथ्वी को उसके सारे विनाश से राहत देगा
  alternative: वह पृथ्वी को उसके सारे विनाश के बाद आनन्दित करेगा
  rationale: मूल क्रिया के प्रसन्नता/सांत्वना क्षेत्र और प्रसंग के विनाश—दोनों को ध्यान में रखा गया; नाम-व्युत्पत्ति को हिन्दी में कृत्रिम शब्द-क्रीड़ा बनाकर नहीं थोपा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल पर गरिमापूर्ण शैली। दर्शन-वृत्तांत में भविष्यवाणी का स्वर रखा गया है। ‘लेमेक’, ‘मतूशेलह’, ‘हनोक’ और ‘नूह’ के परिचित हिन्दी रूप प्रयुक्त हैं। मूल स्रोत की पूर्ण सामग्री का अनुवाद किया गया है; पुरानी संक्षिप्त अंग्रेज़ी परत से आए निराधार पाठ-भेद वाले पादटिप्पणी-विचार को नहीं अपनाया गया।
