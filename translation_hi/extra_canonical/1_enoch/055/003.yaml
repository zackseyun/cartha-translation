base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/055/003.yaml
  text: When I desired to deliver them into the hand of the angels on the day of tribulation and pain[a], I will cause my punishment and my wrath to abide upon them, says God[d][c][b], the Lord of spirits.
translation:
  language: hi
  text: जब मैंने चाहा कि क्लेश और पीड़ा के दिन उन्हें स्वर्गदूतों के हाथ में सौंप दूँ,[a][b][c] तब मैं अपना दंड और अपना प्रकोप उन पर ठहराए रखूँगा—ऐसा परमेश्वर, आत्माओं का प्रभु, कहता है।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मेरा दंड और मेरा प्रकोप’ से पहले गीइज़ वाक्य का संक्रमण कठिन है। भाव संभवतः स्वर्गदूतों के हाथ में सौंपे जाने से उन पर दैवी न्याय के ठहरने की ओर बढ़ता है।
    reason: textual_variant
  - marker: b
    text: शाब्दिक रूप से, ‘स्वर्गदूतों के हाथ में’; यह किसी को उनके अधिकार में दिए जाने का न्यायिक मुहावरा है।
    reason: cultural_note
  - marker: c
    text: 'अन्य सम्भव अनुवाद: ‘क्लेश और पीड़ा के दिन उन्हें स्वर्गदूतों के हाथ में सौंप देने के लिए, तब…’।'
    reason: previous_rendering
  - marker: d
    text: 'शीर्षक का अर्थ है: ‘परमेश्वर, आत्माओं का प्रभु’। गीइज़ में ‘परमेश्वर’ और ‘प्रभु’ के लिए यहाँ दो भिन्न पद हैं।'
    reason: textual_note
lexical_decisions:
- source_word: ፈቀድኩ
  choice: मैंने चाहा
  rationale: क्रिया इच्छा या संकल्प व्यक्त करती है; यह अनावश्यक रूप से औपचारिक आदेश का भाव जोड़े बिना प्रथम पुरुष के दैवी निश्चय को बनाए रखती है।
- source_word: አጽንዖሙ
  choice: उन्हें ... सौंप दूँ
  rationale: ‘हाथ में’ के साथ इसका प्रसंगगत अर्थ किसी को दूसरे के अधिकार में देना है; ‘सौंप दूँ’ आधुनिक हिन्दी में स्वाभाविक है और न्यायिक भाव भी रखता है।
- source_word: በእደ መላእክት
  choice: स्वर्गदूतों के हाथ में
  rationale: स्रोत का महत्वपूर्ण बाइबिलीय और न्यायिक मुहावरा सुरक्षित रखा गया है; इसका आशय उनके अधिकार में दिया जाना है।
- source_word: በዕለተ ምንዳቤ ወሕማም
  choice: क्लेश और पीड़ा के दिन
  rationale: दोनों संज्ञाओं की जोड़ी गंभीर संकट और अनुभूत वेदना व्यक्त करती है; यह चयन प्रकाशनात्मक गरिमा के साथ सहज हिन्दी देता है।
- source_word: መቅሠፍተየ
  choice: मेरा दंड
  rationale: शब्द प्रहार, कोड़े जैसी मार या दंडात्मक विपत्ति का अर्थ दे सकता है; ‘दंड’ न्यायिक प्रसंग के अनुकूल रहते हुए किसी एक भौतिक रूप को निश्चित नहीं करता।
- source_word: መዐትየ
  choice: मेरा प्रकोप
  rationale: दैवी न्याय के प्रसंग में यह तीव्र क्रोध का गरिमापूर्ण और स्वाभाविक हिन्दी रूप है।
- source_word: አኃድር ዲቤሆሙ
  choice: उन पर ठहराए रखूँगा
  rationale: कारक क्रिया और संबंधसूचक पद दंड और प्रकोप को उन पर ठहराने या बसाए रखने की छवि देते हैं; यह केवल ‘लाऊँगा’ से अधिक मूल चित्र को बचाता है।
- source_word: እግዚአብሔር እግዚአ መናፈስት
  choice: परमेश्वर, आत्माओं का प्रभु
  rationale: पहला पद गीइज़ में परमेश्वर का सामान्य नाम है और दूसरा ‘आत्माओं का प्रभु’; दोनों अलग-अलग अर्थों को हिन्दी में स्पष्ट रखा गया है।
theological_decisions:
- issue: स्वर्गदूतों द्वारा मध्यस्थित दैवी न्याय
  choice: परमेश्वर न्याय के अधीन लोगों को स्वर्गदूतों के हाथ में सौंपता है, फिर अपना दंड और प्रकोप उन पर ठहराता है।
  alternative: स्वर्गदूत स्वयं दंड हैं, या क्लेश और पीड़ा केवल पीड़ितों का अनुभव है और दैवी प्रकोप से पृथक है।
  rationale: वाक्य-विन्यास स्वर्गदूतों की मध्यस्थ भूमिका और परमेश्वर की प्रत्यक्ष दंडात्मक क्रिया दोनों को अलग रखते हुए साथ प्रस्तुत करता है; अनुवाद इस तनाव को सुलझाने के बजाय सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रकाशनात्मक शैली रखी गई है। ‘स्वर्गदूतों के हाथ में’ मूल न्यायिक रूपक को बचाता है, जबकि ‘सौंप दूँ’ और ‘ठहराए रखूँगा’ सामान्य पाठक के लिए स्वाभाविक हैं। स्रोत की कठिन वाक्य-संधि को मुख्य पाठ में सहज बनाया गया है, पर उसकी अनिश्चितता पादटिप्पणी में स्पष्ट रखी गई है।
