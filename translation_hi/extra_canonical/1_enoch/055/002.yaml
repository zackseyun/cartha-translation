base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/055/002.yaml
  text: And he swore by his great name that from this time onward he would not do thus to all who dwell upon the dry land[a]; and I will set a sign in the heavens, and it will be a pledge of faithfulness between me and them forever, for as long as the days of heaven are upon the earth[c][b]; and this is by my command.
translation:
  language: hi
  text: और उसने अपने महान नाम की शपथ खाई कि अब से वह सूखी भूमि पर रहनेवाले सभी लोगों के साथ फिर ऐसा नहीं करेगा। और मैं आकाश में एक चिन्ह ठहराऊँगा[a], और वह मेरे और उनके बीच सदा के लिए निष्ठा की प्रतिज्ञा[b] होगी—जब तक आकाश के दिन पृथ्वी पर बने रहें। और यह मेरी आज्ञा के अनुसार है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आकाश का यह ‘चिन्ह’ संभवतः जलप्रलय के बाद दिए गए चिन्ह की परंपरा की ओर संकेत करता है, लेकिन यह पद स्वयं उस चिन्ह का नाम नहीं बताता।
    reason: cross_reference
  - marker: b
    text: ‘निष्ठा की प्रतिज्ञा’ के लिए प्रयुक्त संज्ञा का व्यापक अर्थ केवल ‘निष्ठा’ या ‘विश्वास’ भी हो सकता है; संदर्भ के आधार पर इसमें वाचा-सदृश प्रतिज्ञा का भाव समझा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: इस अंतिम वाक्यांश का अनुवाद ‘यह मेरे विधान के अनुसार है’ या ‘यह मेरा निर्णय है’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: መሐለ
  choice: शपथ खाई
  rationale: यह क्रिया विधिवत शपथ लेने को व्यक्त करती है; यह चयन गंभीरता बनाए रखते हुए स्वाभाविक आधुनिक हिन्दी देता है।
- source_word: በስሙ ዐቢይ
  choice: अपने महान नाम की
  rationale: मूल के श्रद्धापूर्ण शपथ-सूत्र को बिना विस्तार के सीधा व्यक्त करता है।
- source_word: እምይእዜ
  choice: अब से
  rationale: कालगत अर्थ को संक्षिप्त और वर्तमान हिन्दी में स्पष्ट करता है।
- source_word: ኢይገብር ከመዝ
  choice: फिर ऐसा नहीं करेगा
  rationale: किस कार्य की ओर संकेत है, इसे संदर्भ पर छोड़ता है और मूल की अनिर्दिष्टता सुरक्षित रखता है; ‘फिर’ पूर्व घटना की पुनरावृत्ति न होने का स्वाभाविक भाव देता है।
- source_word: ለኵሎሙ እለ ይነብሩ ዲበ የብስ
  choice: सूखी भूमि पर रहनेवाले सभी लोगों के साथ
  rationale: የብስ के विशिष्ट ‘सूखी भूमि’ अर्थ को बनाए रखता है और इसे सामान्य ‘पृथ्वी’ में नहीं मिलाता।
- source_word: ትእምርተ
  choice: एक चिन्ह
  rationale: दृश्य संकेत के लिए सहज शब्द है और चिन्ह की पहचान मूल की तरह अनिर्दिष्ट रखता है।
- source_word: እወዲ በሰማያት
  choice: मैं आकाश में ... ठहराऊँगा
  rationale: चिन्ह को आकाश में स्थापित करने का भाव तथा प्रथम पुरुष का अचानक परिवर्तन, दोनों सुरक्षित रखे गए हैं।
- source_word: ማእከሌየ ወማእከሌሆሙ
  choice: मेरे और उनके बीच
  rationale: संबंधसूचक वाचा-सदृश वाक्यांश का स्वाभाविक हिन्दी रूप है।
- source_word: ሃይማኖተ
  choice: निष्ठा की प्रतिज्ञा
  rationale: विश्वास, विश्वसनीयता और निष्ठा के अर्थक्षेत्र को रखता है तथा मूल में स्पष्ट रूप से न आए ‘वाचा’ शब्द को मुख्य पाठ में नहीं जोड़ता।
- source_word: እስከ ለዓለም መጠነ መዋዕለ ሰማይ ዲበ ምድር
  choice: सदा के लिए ... जब तक आकाश के दिन पृथ्वी पर बने रहें
  rationale: मूल के काव्यात्मक कालावधि-सूत्र को केवल ‘सदा’ कहकर संक्षिप्त नहीं करता।
- source_word: ዝ በትእዛዝየ ውእቱ
  choice: यह मेरी आज्ञा के अनुसार है
  rationale: समापन में व्यक्त ईश्वरीय अधिकार को सीधे रखता है, जबकि ‘विधान’ और ‘निर्णय’ जैसे संभावित अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: क्या आकाशीय चिन्ह को मुख्य पाठ में इंद्रधनुष कहा जाए
  choice: चिन्ह को अनाम रखा गया है।
  alternative: इंद्रधनुष अथवा बादलों में धनुष
  rationale: जलप्रलय की परंपरा की प्रतिध्वनि संभव है, पर उपलब्ध गीइज़ पाठ केवल ‘एक चिन्ह’ कहता है। स्पष्ट पहचान जोड़ना मूल से आगे जाना होता।
- issue: क्या ሃይማኖተ का अनुवाद सीधे ‘वाचा’ किया जाए
  choice: निष्ठा की प्रतिज्ञा
  alternative: वाचा; निष्ठा; विश्वास
  rationale: यह संज्ञा विश्वास, विश्वसनीयता या निष्ठा का अर्थ दे सकती है। शपथ और चिन्ह के संदर्भ में प्रतिज्ञात्मक भाव उचित है, पर ‘वाचा’ को मुख्य पाठ में रखने से मूल से अधिक निश्चित धर्मवैचारिक अर्थ आ सकता है।
- issue: तृतीय पुरुष से प्रथम पुरुष में बदलाव
  choice: ‘उसने ... वह’ के बाद ‘मैं ... मेरे’ का बदलाव सुरक्षित रखा गया है।
  alternative: पूरे पद में एक ही पुरुष रखकर वाक्य को समरूप बनाना
  rationale: यह बदलाव उपलब्ध पाठ में वास्तविक है। उसे चुपचाप समतल करने के बजाय पाठ की शैलीगत और कथनगत तनाव को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘सूखी भूमि’, ‘आकाश के दिन’ और कथन में ‘वह’ से ‘मैं’ का परिवर्तन जैसे असामान्य किंतु स्रोत-आधारित तत्व सुरक्षित हैं। पादटिप्पणी-चिह्न उन्हीं पदांशों के तुरंत बाद रखे गए हैं जिनकी वे व्याख्या करते हैं।
