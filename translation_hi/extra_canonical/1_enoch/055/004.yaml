    reason: previous_rendering
lexical_decisions:
- source_word: ነገሥት
  choice: राजाओ
  rationale: गीज़ का बहुवचन संज्ञा-रूप यहाँ अगले द्वितीय-पुरुष बहुवचन क्रिया-रूप के साथ संबोधन के रूप में समझना सबसे स्वाभाविक है।
- source_word: ኃያላን
  choice: सामर्थी लोगो
  rationale: यह शब्द न्याय-संबंधी अपोकैलिप्टिक प्रसंग में केवल शारीरिक बल नहीं, बल्कि सामर्थ्यवान या प्रभावशाली व्यक्तियों को सूचित करता है; ‘सामर्थी लोग’ इस व्यापक अर्थ को बनाए रखता है।
- source_word: እለ
  choice: जो
  rationale: यह संबंधवाचक चिह्न आगे आने वाले क्रियात्मक उपवाक्य को आरंभ करता है।
- source_word: ትኃድሩ
  choice: निवास करते हो
  rationale: यह स्पष्टतः द्वितीय-पुरुष बहुवचन क्रिया-रूप है। मूल क्रिया निवास करने, टिकने, डेरा डालने या ठहरने का अर्थ दे सकती है; स्थान अनुपस्थित होने पर ‘निवास करते हो’ सबसे कम विशिष्ट स्वाभाविक विकल्प है।
theological_decisions:
- issue: उपलब्ध गीज़ पाठ का अपूर्ण अथवा अध्याहारयुक्त होना
  choice: केवल उपलब्ध संबोधनात्मक उपवाक्य का अनुवाद किया गया है और संभावित लुप्त स्थान-सूचना को मुख्य पाठ में नहीं जोड़ा गया।
  alternative: ‘हे राजाओ और सामर्थी लोगो, जो वहाँ निवास करते हो’ अथवा ‘जो डेरा डाले हुए हो।’
  rationale: दिया गया गीज़ अंश पूर्ण वाक्य नहीं जान पड़ता। अनिश्चित स्थान या आगे का न्याय-वचन जोड़ना पाठ से अधिक कहना होता; इसलिए अपूर्णता और अर्थगत तनाव को पादटिप्पणी में स्पष्ट किया गया है।
- issue: द्वितीय-पुरुष संबोधन बनाम तृतीय-पुरुष वर्णन
  choice: ‘हे … जो … करते हो’ के रूप में सीधा संबोधन।
  alternative: ‘वे राजा और सामर्थी लोग जो निवास करते हैं।’
  rationale: ትኃድሩ द्वितीय-पुरुष बहुवचन है, और संज्ञाओं का रूप भी संबोधन के अनुकूल है; अतः तृतीय-पुरुष वर्णन व्याकरणिक भेद को मिटा देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज संबोधन रखा गया है। ‘हे’ से गीज़ के प्रत्यक्ष संबोधन और द्वितीय-पुरुष बहुवचन को स्पष्ट किया गया है। वाक्य की स्रोतगत अपूर्णता को अस्वाभाविक रूप से पूरा नहीं किया गया।
