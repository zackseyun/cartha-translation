  text: हे राजाओ और सामर्थी लोगो, जो निवास करते हो[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ उपलब्ध इथियोपियाई पाठ अपूर्ण अथवा अध्याहारयुक्त प्रतीत होता है। क्रिया का अनुवाद ‘डेरा डालते हो,’ ‘ठहरते हो’ या ‘बने रहते हो’ भी हो सकता है; व्यापक प्रसंग में कोई अनकहा स्थान निहित हो सकता है।
