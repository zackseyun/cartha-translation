base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/055/001.yaml
  text: And after this the Head of Days relented and said[a], “In vain I have destroyed all those who dwell on the dry land.”
translation:
  language: hi
  text: इसके बाद दिनों के प्रधान ने पश्चात्ताप किया और कहा[a], “मैंने सूखी भूमि पर रहनेवाले उन सब लोगों को व्यर्थ ही नष्ट किया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पछताया” अथवा “अपना मन बदल लिया।” गीइज़ क्रिया पश्चात्ताप, खेद, या निर्णय में बदलाव व्यक्त कर सकती है; जब कर्ता स्वयं ईश्वर हों, तब इसका भाव हिन्दी के “पश्चात्ताप” से जुड़े नैतिक अर्थ से कुछ कम भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረዝ
  choice: इसके बाद
  rationale: यह समय-सूचक संक्रमण-वाक्यांश दर्शनात्मक कथा के क्रम को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ነሥሐ
  choice: पश्चात्ताप किया
  rationale: गीइज़ क्रिया पश्चात्ताप, खेद या निर्णय-परिवर्तन व्यक्त कर सकती है। मुख्य पाठ में अधिक सीधा अर्थ रखा गया है ताकि ईश्वरीय कर्ता के साथ उपस्थित मूल पाठ का धर्मवैचारिक तनाव बना रहे; नरम विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: ርእሰ መዋዕል
  choice: दिनों के प्रधान
  rationale: शाब्दिक घटक ‘दिनों का सिर’ हिन्दी में अस्वाभाविक और भ्रामक होता। ‘प्रधान’ शीर्षता का भाव सुरक्षित रखते हुए इस विशिष्ट दर्शनात्मक उपाधि को ‘अति प्राचीन’ जैसे किसी दूसरे बाइबिलीय शीर्षक में नहीं मिलाता।
- source_word: ሕኵፖልክዎሙ
  choice: नष्ट किया
  rationale: यह बहुवचन कर्म पर की गई विनाशकारी कार्रवाई को स्पष्ट, सशक्त और बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: ለኵሎሙ ለእለ ይነብሩ
  choice: रहनेवाले उन सब लोगों को
  rationale: यह मूल की समग्रता और लगातार निवास करने के भाव, दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ውስተ የብስ
  choice: सूखी भूमि पर
  rationale: የብስ सामान्य ‘पृथ्वी’ की अपेक्षा विशेष रूप से ‘सूखी भूमि’ को दर्शाता है और संभव बाढ़-न्याय की प्रतिध्वनि बनाए रखता है।
theological_decisions:
- issue: दिनों के प्रधान के लिए प्रयुक्त ነሥሐ को धर्मवैचारिक रूप से नरम करना या न करना
  choice: पश्चात्ताप किया
  alternative: नरम पड़ा; अपना मन बदल लिया; पछताया
  rationale: मूल पाठ एक तीखा मानव-सदृश ईश्वरीय भाव प्रस्तुत करता है। मुख्य पाठ में उसे सुरक्षित रखा गया है, न कि किसी सुरक्षित धर्मसैद्धांतिक व्याख्या से बदल दिया गया; अर्थ-सीमा पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप। ‘रहनेवाले’ को संयुक्त रूप में रखा गया है। विशिष्ट उपाधि को किसी अधिक परिचित धर्मवैचारिक शीर्षक से नहीं बदला गया है।
