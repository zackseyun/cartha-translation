translation:
  language: hi
  text: और उन घाटियों के किनारों[a] पर मैंने सुगंधित दालचीनी देखी; फिर उनके पार[b] मैं पूरब की ओर गया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल शब्द का अर्थ यहाँ घाटियों के ‘किनारे’ या ‘सीमाएँ’ है।
    reason: lexical_alternative
  - marker: b
    text: इसका अर्थ ‘उनसे आगे’ या ‘उनके उस पार की दिशा में’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: मूल क्रिया का अधिक शाब्दिक अनुवाद ‘मैं पूरब की ओर निकट आया’ या ‘आगे बढ़ा’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: መንገለ
  choice: पर / पार होकर / की ओर
  rationale: 'यह संबंधसूचक पद पद्य में तीन बार अलग-अलग स्थानिक अर्थों में आता है: निकटता, किसी सीमा के उस पार जाना, और दिशा। हिन्दी में हर स्थान पर प्रसंगानुकूल रूप रखने से दृश्य स्पष्ट और स्वाभाविक रहता है।'
- source_word: ክንፈሩ
  choice: किनारों
  rationale: यहाँ शब्द घाटियों की भौगोलिक सीमा या किनारे को दर्शाता है; ‘पहलू’ या ‘पंख’ की अपेक्षा ‘किनारे’ अधिक सटीक है।
- source_word: ቈላት
  choice: घाटियों
  rationale: यह भू-आकृति का बहुवचन शब्द है। ‘घाटियाँ’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ርኢኩ
  choice: मैंने ... देखी
  rationale: दर्शन-वर्णन की सीधी प्रथम-पुरुष अभिव्यक्ति को बनाए रखता है।
- source_word: ቀናንሞስ
  choice: दालचीनी
  rationale: यह उधार लिया हुआ पौधा-नाम दालचीनी या उससे मिलते सुगंधित मसाले को सूचित करता है; सामान्य पाठक के लिए ‘दालचीनी’ सबसे स्पष्ट ठोस नाम है।
- source_word: ዘመዓዛ
  choice: सुगंधित
  rationale: यह दालचीनी की सुगंध का गुण बताता है और दर्शन के संवेदनात्मक चित्र को बनाए रखता है।
- source_word: ቀረብኩ
  choice: मैं ... गया
  rationale: मूल क्रिया में निकट आने या आगे बढ़ने का भाव है। दिशा-सूचक वाक्यांश के साथ ‘गया’ सहज हिन्दी है; अधिक शाब्दिक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ጽባሕ
  choice: पूरब
  rationale: भौगोलिक प्रसंग में यह सूर्योदय की दिशा, अर्थात् पूरब, को दर्शाता है।
theological_decisions:
- issue: दर्शनात्मक भू-दृश्य में सुगंधित पौधे की पहचान
  choice: दालचीनी
  alternative: कासिया अथवा कोई सुगंधित मसाला-पौधा
  rationale: गीज़ का उधार लिया हुआ शब्द किसी पहचाने जाने वाले सुगंधित मसाले की ओर संकेत करता है। ठोस दृश्यात्मक विवरण को अस्पष्ट सामान्य शब्द में बदलने के बजाय ‘दालचीनी’ रखा गया है।
