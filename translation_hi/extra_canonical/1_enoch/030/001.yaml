base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/030/001.yaml
  text: And above them[a], above those mountains of the east, not far away, I saw another place, a valley of waters[c][b], as though it were inexhaustible.
translation:
  language: hi
  text: 'और उनके ऊपर—पूर्व के उन पहाड़ों के ऊपर[a]—दूर नहीं, मैंने एक और स्थान देखा: जलों की एक घाटी[b], मानो वह कभी समाप्त न होती हो।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस स्थान का इथियोपिक पाठ कुछ अनिश्चित है। ‘पूर्व के उन पहाड़ों’ के बदले ‘उनके पहाड़ों’ या केवल ‘वे पहाड़’ भी संभव माना गया है।
    reason: textual_variant
  - marker: b
    text: 'वाक्य-विन्यास का एक अन्य संभव रूप है: ‘पूर्व के उन पहाड़ों के ऊपर मैंने एक और स्थान—जलों की एक घाटी—देखा, जो दूर नहीं था।’'
    reason: syntactical_alternative
  - marker: c
    text: अंतिम इथियोपिक वाक्यांश कठिन है। इसका अर्थ ‘मानो उसे खाली न किया जा सकता हो’, ‘मानो वह समाप्त न होता हो’, या अधिक शाब्दिक रूप में ‘मानो वह बाहर न निकलता हो’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ላዕሌሁ / ላዕለ
  choice: उनके ऊपर—…के ऊपर
  rationale: दोहराए गए संबंधबोधक शब्द से दर्शन में स्थान की ऊँचाई और परतदार भूगोल प्रकट होता है; हिन्दी में पुनरावृत्ति बनाए रखी गई है।
- source_word: እሙንቱ
  choice: उन
  rationale: यह सर्वनाम पहले वर्णित दृश्यों की ओर संकेत करता है; ‘उन’ संदर्भ को खुला रखता है।
- source_word: ተደብረ … ጽባሕ
  choice: पूर्व के उन पहाड़ों
  rationale: नवीन पाठ-समीक्षा के अनुसार अस्पष्ट रूप के पीछे ‘पहाड़ों’ का बहुवचन संबंध-रूप है और ጽባሕ यहाँ ‘पूर्व’ है; इसलिए पूर्व की दिशा को मुख्य पाठ में स्पष्ट रखा गया है।
- source_word: አኮ ርሑቀ
  choice: कुछ ही दूरी पर
  rationale: यह सापेक्ष निकटता व्यक्त करता है। यह आधुनिक हिन्दी में ‘दूर नहीं’ का स्वाभाविक और अर्थ-संगत रूप है।
- source_word: ርኢኩ
  choice: मैंने … देखा
  rationale: यह द्रष्टा के प्रत्यक्ष अनुभव का सामान्य कथन है; ‘मैंने देखा’ इसे स्पष्ट और गरिमापूर्ण हिन्दी में रखता है।
- source_word: መካነ ካልአ
  choice: एक और स्थान
  rationale: መካነ स्थान को और ካልአ दूसरे अथवा अन्य को सूचित करता है; ‘एक और स्थान’ दृश्य की क्रमिक यात्रा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ቈላ
  choice: घाटी
  rationale: यह नीची भूमि अथवा भू-अवनति का बोध कराता है; ‘घाटी’ सबसे व्यापक और कम व्याख्यात्मक विकल्प है।
- source_word: ማያት
  choice: जलों
  rationale: स्रोत का बहुवचन सुरक्षित रखा गया है और इससे दर्शनीय वर्णन की विशिष्ट शैली भी बनी रहती है।
- source_word: ከመ ዘኢይትዌጸእ
  choice: मानो उसका जल कभी चुकता न हो
  rationale: कठिन अंतिम वाक्यांश में न समाप्त होने अथवा न निकाले जा सकने का भाव संभव है। मुख्य पाठ में उसका प्रभाव स्वाभाविक हिन्दी में रखा गया है, जबकि अधिक शाब्दिक संभावनाएँ पादटिप्पणी में दी गई हैं।
theological_decisions:
- issue: दर्शनीय भूगोल को ठोस रखना, प्रतीकात्मक अर्थ आरोपित न करना
  choice: ‘एक और स्थान…जलों की एक घाटी’ के रूप में प्रत्यक्ष देखे गए भू-दृश्य का वर्णन
  alternative: घाटी को मुख्य पाठ में किसी आध्यात्मिक या प्रतीकात्मक अर्थ से समझाना
  rationale: पाठ स्वयं ठोस ब्रह्मांडीय भूगोल के रूप में दर्शन सुनाता है। अनुवाद उसकी रहस्योद्घाटनात्मक छवि को बनाए रखता है और कोई संप्रदायगत अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दर्शनीय शैली अपनाई गई है। ‘जलों’ जैसे हल्के ऊँचे काव्यात्मक रूप को स्रोत के बहुवचन और अपोकैलिप्टिक वातावरण के कारण बनाए रखा गया है; शेष वाक्य सामान्य पाठक के लिए सहज रखा गया है।
