base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/007.yaml
  text: And in those days they will not be saved by gold or by silver[b][a], nor will they be able to flee.
translation:
  language: hi
  text: और उन दिनों वे सोने या चाँदी के सहारे बच नहीं पाएँगे[a], और न ही वे भाग सकेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे सोने या चाँदी से सुरक्षित नहीं रहेंगे” अथवा “उन्हें सोने या चाँदी से छुटकारा नहीं मिलेगा।” मूल गीइज़ क्रिया का अर्थ ‘बचना,’ ‘सुरक्षित रहना’ या ‘छुटकारा पाना’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይከውን፡ በእማንቱ፡ መዋዕል
  choice: और उन दिनों
  rationale: यह प्रलय-साहित्य का प्रचलित कालसूचक सूत्र है। हिन्दी में अलग से ‘और ऐसा होगा’ जोड़ने के बजाय इसे सहज रूप से कालवाचक पद में समाहित किया गया है।
- source_word: ኢይድኅኑ
  choice: वे ... बच नहीं पाएँगे
  rationale: मूल क्रिया का साधारण G-रूप अकर्मक अर्थ—‘सुरक्षित रहना, बचना, छुटकारा पाना’—देता है; इसलिए सक्रिय ‘अपने आपको बचाएँगे’ से परहेज़ किया गया है। ‘बच नहीं पाएँगे’ न्याय से सुरक्षा या छुटकारा न मिलने का स्थानीय अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: እበወርቅ፡ ወእበብሩር
  choice: सोने या चाँदी के सहारे
  rationale: पूर्वसर्ग साधन या माध्यम बताता है। निषेधात्मक युग्म में गीइज़ के ‘और’ को हिन्दी के स्वाभाविक ‘या’ से व्यक्त किया गया है; ‘के सहारे’ धन पर निर्भरता और उसके निष्फल होने को स्पष्ट करता है।
- source_word: ወኢይክሉ
  choice: और न ही वे ... सकेंगे
  rationale: यह नकारात्मक सामर्थ्य-सूचक रचना है। यह चयन समानांतरता और भावी न्याय के स्वर को बनाए रखता है।
- source_word: ጐይየ
  choice: भाग
  rationale: क्रिया का ठोस अर्थ भाग जाना या पलायन करना है। ‘बचना’ की पुनरावृत्ति से बचते हुए ‘भागना’ मूल दृश्यात्मकता को सुरक्षित रखता है।
theological_decisions:
- issue: धन के द्वारा विफल छुटकारे का स्वरूप
  choice: न्याय के समय सोना-चाँदी उन्हें बचा नहीं सकेगा।
  alternative: वे सोने या चाँदी से अपना उद्धार नहीं कर सकेंगे।
  rationale: संदर्भ में बहुमूल्य धातुएँ आने वाले न्याय से सुरक्षा या छुटकारे का साधन बनने में विफल हैं। ‘उद्धार’ के संभावित उत्तरकालीन धर्मवैज्ञानिक अर्थ को मुख्य पाठ में आरोपित नहीं किया गया।
- issue: क्रिया का वाच्य और अर्थ
  choice: 'अकर्मक भाव: ‘बच नहीं पाएँगे’।'
  alternative: 'सक्रिय-आत्मवाचक भाव: ‘अपने आपको नहीं बचाएँगे’; अथवा कर्मवाच्य: ‘बचाए नहीं जाएँगे’।'
  rationale: प्राप्त गीइज़ रूप मूल G-स्टेम है, जो ‘बचना/सुरक्षित रहना/छुटकारा पाना’ का अकर्मक अर्थ देता है। हिन्दी का चयन इस तथ्य को रखते हुए कर्मवाच्य के अनकहे कर्ता और सक्रिय आत्मवाचक अर्थ—दोनों को अनावश्यक रूप से आरोपित करने से बचता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर ‘उन दिनों’ जैसे प्रलय-साहित्य के गरिमापूर्ण सूत्र को बनाए रखा गया है। ‘के सहारे’ सामान्य पाठक के लिए साधनवाचक संबंध को सहज बनाता है। मुख्य पाठ अकर्मक अर्थ को प्राथमिकता देता है और पादटिप्पणी वास्तविक अर्थ-सीमा को सुरक्षित रखती है।
