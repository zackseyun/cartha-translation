base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/005.yaml
  text: And that angel of peace answered[a], saying to me, 'Wait a little[c][b], and every hidden thing that the Lord of Spirits has enclosed will be revealed to you.'
translation:
  language: hi
  text: 'शांति के उस स्वर्गदूत ने मुझे उत्तर दिया: “थोड़ी देर ठहरो[a], और हर छिपी हुई बात तुम्हें प्रकट की जाएगी, जिसे आत्माओं के प्रभु ने बंद कर रखा है[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “थोड़ी देर प्रतीक्षा करो” या “कुछ समय धीरज रखो” भी हो सकता है; गीइज़ की आज्ञार्थक क्रिया में ठहरने और प्रतीक्षा करने, दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “बंद कर रखा है” का अनुवाद “घेरे में रखा है” या “छिपाकर रखा है” भी हो सकता है। क्रिया उन रहस्यों के आत्माओं के प्रभु के अधिकार में रहने पर बल दे सकती है, जब तक वे प्रकट न किए जाएँ।
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ
  choice: उत्तर दिया
  rationale: यह गीइज़ का सामान्य संवादात्मक क्रिया-रूप है; ‘उत्तर दिया’ प्रसंग के संवादात्मक स्वर को स्पष्ट रखता है।
- source_word: እንዘ ይብለኒ
  choice: मुझे उत्तर देते हुए कहा
  rationale: मुख्य क्रिया के साथ यह समकालिक वचन की सामी शैली व्यक्त करता है; हिंदी में ‘उत्तर देते हुए कहा’ स्वाभाविक है और वाक्य का क्रम सुरक्षित रखता है।
- source_word: መልአከ ሰላም
  choice: शांति का स्वर्गदूत
  rationale: सम्बन्धकारक पदबंध को बिना व्याख्यात्मक विस्तार के रखा गया है और हनोक-साहित्य की विशिष्ट उपाधि सुरक्षित रहती है।
- source_word: ጽናሕ ንስቲተ
  choice: थोड़ी देर ठहरो
  rationale: आज्ञार्थक क्रिया में ठहरने या प्रतीक्षा करने का भाव है; ‘थोड़ी देर ठहरो’ दोनों शब्दों के संयुक्त कालगत अर्थ को सहज हिंदी में व्यक्त करता है।
- source_word: ይትከሠት
  choice: प्रकट की जाएगी
  rationale: यह रहस्योद्घाटन या उद्घाटन का भाव रखता है; कर्मवाच्य रूप मूल की भावी निष्पत्ति को बनाए रखता है।
- source_word: ኵሉ ዘኅቡእ
  choice: हर वह छिपी हुई बात
  rationale: व्यापक और अनिश्चित अभिव्यक्ति को स्वाभाविक हिंदी में रखा गया है, बिना उसे केवल अमूर्त ‘सब कुछ’ में बदलने के।
- source_word: ዘከለለ
  choice: घेरे में रखा है
  rationale: क्रिया के घेरने, बंद रखने या भीतर सुरक्षित रखने के बिंब को बनाए रखता है और केवल ‘छिपाया’ कहकर इसके अर्थ को संकुचित नहीं करता।
- source_word: እግዚአ መናፈስት
  choice: आत्माओं के प्रभु
  rationale: हनोक-साहित्य की सूत्रबद्ध ईश्वरीय उपाधि का सीधा और संगत हिंदी रूप है।
theological_decisions:
- issue: ईश्वरीय उपाधि እግዚአ መናፈስት
  choice: आत्माओं के प्रभु
  alternative: आत्माओं का प्रभु
  rationale: बहुवचन सम्बन्धकारक को स्पष्ट रखते हुए हनोक की विशिष्ट उपाधि सुरक्षित की गई है; इसे किसी अधिक परिचित संप्रदायगत उपाधि से सामान्यीकृत नहीं किया गया।
- issue: छिपी बातों पर प्रभु का नियंत्रण
  choice: जिसे आत्माओं के प्रभु ने घेरे में रखा है
  alternative: जिसे आत्माओं के प्रभु ने छिपाकर रखा है
  rationale: ‘घेरे में रखा’ मूल क्रिया के बंद या परिरक्षित रखने के बिंब को बचाता है तथा यह अनावश्यक रूप से तय नहीं करता कि प्रभु ही उनके छिपे होने के प्रत्यक्ष कर्ता हैं या उन्हें अपने अधिकार में सुरक्षित रखते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘स्वर्गदूत’, ‘प्रकट’ और ‘आत्माओं के प्रभु’ जैसे पद अपोकैलिप्टिक साहित्य की गंभीर शैली बनाए रखते हैं। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न [a] और [b] सम्मिलित हैं।
