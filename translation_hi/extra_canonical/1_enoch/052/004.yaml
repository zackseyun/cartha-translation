base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/004.yaml
  text: And he said to me[a], “All these that you have seen will belong to the dominion of his Anointed One[c][b], so that he may command and be mighty upon the earth.”
translation:
  language: hi
  text: और उसने मुझसे कहा, “ये सब, जिन्हें तुमने देखा है, उसके अभिषिक्त के प्रभुत्व के अधीन होंगे[a], ताकि वह पृथ्वी पर आज्ञा दे और प्रबल हो[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप के अधिक निकट: “उसके अभिषिक्त के प्रभुत्व के लिए होंगे।” यहाँ अभिप्राय उसके अधिकार या शासन के अधीन होने से भी हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: “प्रबल हो” का अर्थ “सामर्थ्य दिखाए” या “विजयी हो” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይቤለኒ
  choice: और उसने मुझसे कहा
  rationale: गीज़ की सामान्य कथात्मक और प्रकाशनात्मक उक्ति-भूमिका को सीधे तथा स्वाभाविक हिन्दी में रखा गया है।
- source_word: እሉ ኵሎሙ ዘርኢከ
  choice: ये सब, जिन्हें तुमने देखा है
  rationale: संकेतवाचक और समष्टिवाचक बल के साथ दर्शन में पहले दिखाई गई वस्तुओं का संदर्भ सुरक्षित रहता है।
- source_word: ለስልጣነ
  choice: प्रभुत्व के अधीन
  rationale: ስልጣን अधिकार, सत्ता या प्रभुत्व को व्यक्त करता है। 'प्रभुत्व के अधीन' भावी अधीनता या शासन-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, बिना भौतिक स्वामित्व का अर्थ थोपे।
- source_word: መሲሑ
  choice: उसके अभिषिक्त जन
  rationale: शब्द के तृतीय पुरुष एकवचन संबंधसूचक प्रत्यय को 'उसके' से सुरक्षित रखा गया है और उपाधि का लिप्यंतरण करने के बजाय उसका अर्थ अनूदित किया गया है। 'जन' जोड़ने से हिन्दी में व्यक्ति-सूचक उपाधि स्पष्ट और स्वाभाविक बनती है।
- source_word: እሙንቱ ይከውኑ
  choice: हो जाएँगे
  rationale: मूल की 'वे होंगे/हो जाएँगे' रचना को पूर्वसर्गीय प्रभुत्व-संबंध के साथ जोड़ा गया है; इससे संबंध स्पष्ट होता है पर उसे पूर्ण स्वामित्व नहीं बनाया गया।
- source_word: ከመ ይእዝዝ
  choice: ताकि वह ... आज्ञा दे
  rationale: उद्देश्यसूचक ከመ और आदेश देने वाले क्रियार्थ को सीधे बनाए रखता है; व्यापक 'शासन करे' कहकर अर्थ को अनावश्यक रूप से नहीं फैलाया गया।
- source_word: ወይትኃየል
  choice: और प्रबल हो
  rationale: शक्ति, सामर्थ्य और प्रभावी विजय के अर्थ-क्षेत्र को संक्षिप्त हिन्दी में रखा गया है; वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: ዲበ ምድር
  choice: पृथ्वी पर
  rationale: स्थानवाचक अर्थ को आधुनिक, गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: መሲሑ में संबंधसूचक प्रत्यय और उपाधि का अनुवाद
  choice: उसके अभिषिक्त जन
  alternative: उसका मसीह
  rationale: मूल का '-u' प्रत्यय 'उसके' के रूप में सुरक्षित है। 'अभिषिक्त जन' उपाधि का अर्थ अनूदित करता है, जबकि 'मसीह' उसका प्रचलित लिप्यंतरण है; संदर्भ में 'उसके' का पूर्वगामी इस पद में स्पष्ट नहीं किया गया, इसलिए उसे अनिर्दिष्ट ही रहने दिया गया है।
- issue: दृष्ट वस्तुओं और अभिषिक्त जन के प्रभुत्व का संबंध
  choice: प्रभुत्व के अधीन हो जाएँगे
  alternative: प्रभुत्व के लिए होंगे
  rationale: गीज़ में पूर्वसर्गीय संबंध अधीनता, संबद्धता या प्रयोजन की कुछ गुंजाइश रखता है। मुख्य पाठ शासनाधीन होने का स्वाभाविक अर्थ देता है, जबकि वैकल्पिक अधिक औपचारिक रचना पादटिप्पणी में सुरक्षित है।
- issue: अंतिम क्रिया में शक्ति का स्वरूप
  choice: प्रबल हो
  alternative: सामर्थ्य दिखाए / विजय पाए
  rationale: मूल क्रिया शक्ति या प्रभावशीलता बताती है, पर यह निश्चित नहीं करती कि बल का आशय केवल स्थिति, शक्ति-प्रयोग या विजय है। 'प्रबल हो' इस तनाव को अपेक्षाकृत खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। 'अभिषिक्त जन' धार्मिक उपाधि का अर्थ स्पष्ट करता है; 'उसके' को जानबूझकर बनाए रखा गया है ताकि मूल का संबंधसूचक प्रत्यय और उसकी संदर्भगत अस्पष्टता न मिटे।
