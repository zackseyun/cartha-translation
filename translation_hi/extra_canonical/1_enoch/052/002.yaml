base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/002.yaml
  text: 'There my eyes saw all the hidden things of heaven that are to come: a mountain of iron[a], and a mountain of copper, and a mountain of silver, and a mountain of gold, and a mountain of soft metal[b], and a mountain of lead.'
translation:
  language: hi
  text: 'वहाँ मेरी आँखों ने स्वर्ग की उन सब छिपी हुई वस्तुओं को देखा जो आनेवाली हैं[a]: लोहे का एक पर्वत, ताँबे का एक पर्वत, चाँदी का एक पर्वत, सोने का एक पर्वत, नरम धातु का एक पर्वत[b] और सीसे का एक पर्वत।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘जो आनेवाली हैं’ के रूप में अनूदित पद कठिन है। इसका अधिक स्थिर अर्थ ‘जो वहाँ थीं’ या ‘जो स्वर्ग में विद्यमान हैं’ भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: पाँचवीं धातु के लिए प्रयुक्त शब्द का ठीक अर्थ अनिश्चित है। यह किसी नरम या मिश्रित धातु को सूचित कर सकता है; कुछ व्याख्याकार इसे विशेष रूप से राँगा या सोना-चाँदी की मिश्रधातु मानते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: በህየ
  choice: वहाँ
  rationale: यह स्थानवाचक क्रियाविशेषण दर्शन के दृश्य का परिचय देता है; ‘वहाँ’ संक्षिप्त और स्वाभाविक है।
- source_word: ርእዩ አዕይንትየ
  choice: मेरी आँखों ने ... देखा
  rationale: गीज़ पाठ में ‘मेरी आँखें’ स्पष्ट रूप से है; इसे बनाए रखने से दर्शन की सजीवता बनी रहती है।
- source_word: ኵሎ ኅቡኣተ ሰማይ
  choice: स्वर्ग की उन सब छिपी हुई वस्तुओं
  rationale: ኅቡኣተ छिपी या गुप्त वस्तुओं को दर्शाता है; ‘छिपी हुई वस्तुएँ’ सामान्य पाठक के लिए स्पष्ट है और अनावश्यक तकनीकी अर्थ नहीं जोड़ता।
- source_word: ዘይኩን ሀሎ
  choice: जो आनेवाली हैं
  rationale: दर्शनात्मक संदर्भ में यह भावी वास्तविकताओं की ओर संकेत कर सकता है। मूल पद कठिन है, इसलिए स्थिर या वर्तमान अर्थ को पादटिप्पणी में रखा गया है।
- source_word: ደብረ
  choice: एक पर्वत
  rationale: हर धातु से पहले दोहराया गया है; हिन्दी में भी पुनरावृत्ति रखकर सूची की गंभीर, दर्शनात्मक शैली सुरक्षित की गई है।
- source_word: ኃጺን
  choice: लोहा
  rationale: इस धातु का मानक अर्थ।
- source_word: ጸሪቅ
  choice: ताँबा
  rationale: शब्द ताँबे अथवा ताँबे की मिश्रधातु को सूचित कर सकता है; मूलभूत धातु के रूप में ‘ताँबा’ चुना गया है।
- source_word: ብሩር
  choice: चाँदी
  rationale: इस धातु का मानक अर्थ।
- source_word: ወርቅ
  choice: सोना
  rationale: इस धातु का मानक अर्थ।
- source_word: ነጠብጣብ
  choice: नरम धातु
  rationale: इस धातु की ठीक पहचान अनिश्चित है; ‘नरम धातु’ अनिश्चितता को बनाए रखता है, जबकि अधिक विशिष्ट संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: ዐረር
  choice: सीसा
  rationale: इस धातु का मानक अर्थ और सूची के संदर्भ में उपयुक्त।
theological_decisions:
- issue: क्या स्वर्ग की छिपी हुई वस्तुओं वाला वाक्यांश भावी वास्तविकताओं को बताता है या वहाँ विद्यमान वस्तुओं को
  choice: 'भावी अर्थ: ‘जो आनेवाली हैं’'
  alternative: ‘जो वहाँ थीं’ अथवा ‘जो स्वर्ग में विद्यमान हैं’
  rationale: निकटवर्ती संदर्भ प्रतीकात्मक पर्वतों और आगे आनेवाले न्याय से संबंधित दर्शन है, इसलिए भावी अर्थ उपयुक्त है; फिर भी गीज़ अभिव्यक्ति कठिन होने के कारण दूसरा अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। धातुओं की सूची में ‘एक पर्वत’ की पुनरावृत्ति मूल की गंभीर लय को सुरक्षित रखती है। वास्तविक पाठगत और शब्दार्थगत अनिश्चितताएँ मुख्य पाठ में किसी एक संप्रदायगत अर्थ से नहीं सुलझाई गईं, बल्कि पादटिप्पणियों में स्पष्ट की गई हैं।
