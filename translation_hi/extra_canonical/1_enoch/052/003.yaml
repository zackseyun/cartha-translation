- source_word: እንዘ እብል
  choice: पूछा
  rationale: गीज़ का वाक्-परिचायक ‘कहते हुए’ हिन्दी में अलग रखने पर कृत्रिम लगता है; प्रश्नवाचक कथन को ‘पूछा’ में स्वाभाविक रूप से समाहित किया गया है।
- source_word: ምንት ውእቱ ... እሙንቱ እሉ እለ
  choice: ये क्या हैं
  rationale: रूप-विन्यास में कुछ एकवचन-सदृशता होने पर भी आगे के संकेतवाचक रूप अनेक वस्तुओं की ओर इंगित करते हैं; संक्षिप्त हिन्दी प्रश्न उसी बहुवचन संकेत को रखता है।
- source_word: በኅቡእ
  choice: छिपे में
  rationale: यह अभिव्यक्ति छिपेपन या गोपनीयता को बताती है, पर यह निश्चित नहीं कि वह स्थान, देखने की रीति, या देखी गई वस्तुओं की गुप्त प्रकृति का विशेषण है। ‘छिपे में’ इस अस्पष्टता को कुछ हद तक बनाए रखता है।
- source_word: ርኢኩ
  choice: मैंने ... देखा है
  rationale: दर्शन अभी पूछे जा रहे प्रश्न से प्रत्यक्ष रूप से जुड़ा है; हिन्दी का पूर्ण वर्तमान उस वर्तमान प्रासंगिकता को सहजता से व्यक्त करता है।
theological_decisions:
- issue: सर्वनाश-दर्शन के प्रसंग में በኅቡእ का आशय
  choice: छिपे में
  alternative: गुप्त रूप से; किसी छिपे हुए स्थान में; छिपी हुई वस्तुएँ
  rationale: पद छिपे या गुप्त होने का भाव रखता है, लेकिन उसका व्याकरणिक संबंध पूर्णतः निश्चित नहीं है। अनुवाद और पादटिप्पणी इस प्रकाशन-संबंधी तनाव को किसी एक अर्थ में सीमित नहीं करते।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठक के लिए सहज, किंतु दर्शनीय आख्यान के अनुरूप गरिमापूर्ण। ‘छिपे में’ जानबूझकर कुछ असामान्य रखा गया है ताकि मूल की वास्तविक अस्पष्टता बनी रहे; पादटिप्पणी संभावित अर्थ स्पष्ट करती है।
