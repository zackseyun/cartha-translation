  text: And I asked the angel who went with me[a], saying, “What are these things that I have seen in secret?”
translation:
  language: hi
  text: और मैंने अपने साथ चलने वाले स्वर्गदूत से पूछा, “ये क्या हैं, जिन्हें मैंने गुप्त रूप से[a] देखा है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “किसी छिपे हुए स्थान में” अथवा “छिपी हुई वस्तुएँ।” गीज़ अभिव्यक्ति छिपेपन का भाव देती है, पर यह पूरी तरह निश्चित नहीं कि वह स्थान, देखने की रीति, या देखी गई वस्तुओं की छिपी प्रकृति को बताती है।
    reason: lexical_alternative
