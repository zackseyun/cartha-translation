lexical_decisions:
- source_word: ወኢይከውን
  choice: और ... काम न आएगा
  rationale: संयोजक ወ तथा निषेधात्मक अपूर्ण क्रिया ኢይከውን भविष्यसूचक निषेध व्यक्त करते हैं। हिंदी में “काम न आएगा” अगले प्रयोजनसूचक पद के साथ स्वाभाविक रहते हुए संक्षिप्त भविष्यवाणी का स्वर बनाए रखता है।
- source_word: ኃጺን
  choice: लोहा
  rationale: यह संज्ञा सीधे लोहे को सूचित करती है; यहाँ व्यापक रूपक मानने की आवश्यकता नहीं है।
- source_word: ለፀብእ
  choice: युद्ध के काम
  rationale: उपसर्ग ለ प्रयोजन अथवा उपयोग बताता है। “युद्ध के काम” यह अर्थ देता है कि लोहे का युद्ध में उपयोग नहीं होगा, और हिंदी में वाक्य को स्वाभाविक रखता है।
theological_decisions:
- issue: संक्षिप्त गीइज़ वाक्य में निषेध का दायरा
  choice: लोहा युद्ध के काम न आएगा।
  alternative: लोहा नहीं रहेगा।
  rationale: 'लोहे की संज्ञा के बाद ለ और युद्ध-सूचक शब्द आने के कारण कार्यगत अर्थ अधिक स्वाभाविक है: लोहे का अस्तित्व समाप्त होना नहीं, बल्कि उसका युद्ध के लिए न होना। फिर भी पादटिप्पणी मूल की अत्यंत संक्षिप्त अभिव्यक्ति को स्पष्ट करती है।'
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और सहज भविष्यसूचक शैली। “युद्ध के काम न आएगा” शाब्दिक संरचना को अत्यधिक अस्वाभाविक बनाए बिना उसके कार्यगत आशय को व्यक्त करता है।
