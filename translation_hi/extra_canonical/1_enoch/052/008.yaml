translation:
  language: hi
  text: और लोहा युद्ध के काम न आएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीइज़ मूल बहुत संक्षिप्त है; शाब्दिक अर्थ है, “और लोहा युद्ध के लिए न होगा।” आशय संभवतः यह है कि लोहे का उपयोग अब युद्ध के लिए नहीं होगा।
