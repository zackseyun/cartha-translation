theological_decisions:
- issue: दृष्टान्तों में ለኅሩይ का अनुवाद
  choice: चुने हुए जन
  alternative: निर्वाचित जन
  rationale: मूल में यह एक प्रमुख उपाधि है। चुना हुआ जन आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है तथा बाद की धर्मवैज्ञानिक शब्दावली को अनावश्यक रूप से आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और चित्रात्मक शैली। धातुओं की आवृत्तिपूर्ण सूची और दोनों उपमाएँ बनाए रखी गई हैं; अनिश्चित पाँचवीं धातु को निश्चित रूप से राँगा नहीं कहा गया।
