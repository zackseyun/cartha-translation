base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/006.yaml
  text: And those mountains that your eyes saw—the mountain of iron, and the mountain of copper, and the mountain of silver, and the mountain of gold, and the mountain of soft metal, and the mountain of lead—all these will be before the Chosen One like wax before the fire, and like water that runs down from above upon those mountains; and they will become weak before his feet.
translation:
  language: hi
  text: और वे पहाड़ जिन्हें तुम्हारी आँखों ने देखा था—लोहे का पहाड़, ताँबे का पहाड़, चाँदी का पहाड़, सोने का पहाड़, नरम धातु का पहाड़[a] और सीसे का पहाड़—ये सब चुने हुए जन[b] के सामने ऐसे हो जाएँगे जैसे आग के सामने मोम, और उस पानी के समान जो ऊपर से उन पहाड़ों पर बहता हुआ नीचे उतरता है; और वे उसके चरणों के सामने निर्बल हो जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस इथियोपिक पंक्ति में पाँचवीं धातु की ठीक-ठीक पहचान अनिश्चित है; विद्वानों ने राँगा या किसी अन्य नरम धातु का सुझाव दिया है।
    reason: lexical_alternative
  - marker: b
    text: या “निर्वाचित जन।” यह दृष्टान्तों में एक प्रमुख उपाधि है।
    reason: lexical_alternative
