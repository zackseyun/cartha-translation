base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/001.yaml
  text: And after those days[a], in that place where I had seen all the visions of what is hidden, for I had been snatched up by a whirlwind[c][b], and it had carried me westward—
translation:
  language: hi
  text: और उन दिनों के बाद, उस स्थान पर जहाँ मैंने जो कुछ गुप्त है उसके सभी दर्शन देखे थे[a], क्योंकि एक प्रचण्ड बवंडर मुझे उठा ले गया था और मुझे पश्चिम की ओर ले गया था—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सभी गुप्त दर्शन।” गीइज़ वाक्यांश का अर्थ “जो कुछ गुप्त है उसके दर्शन” अथवा “गुप्त दर्शन”—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረ እማንቱ መዋዕል
  choice: उन दिनों के बाद
  rationale: कालक्रमसूचक वाक्यांश और दूरवाची संकेत को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: በውእቱ መካን
  choice: उस स्थान पर
  rationale: दर्शन के ठोस स्थान-संदर्भ को बनाए रखता है।
- source_word: ርኢኩ ኵሎ ራእያተ ዘበኅቡእ
  choice: जहाँ मैंने गुप्त बातों के सभी दर्शन देखे थे
  rationale: सम्बन्धवाचक पद की सम्भावित व्याख्या ‘जो छिपा है उसके दर्शन’ के रूप में प्रस्तुत करता है, जबकि दूसरी सम्भावना पादटिप्पणी में रखी गई है।
- source_word: እስመ
  choice: क्योंकि
  rationale: मूल के कारणसूचक संयोजक को स्पष्ट रूप से सुरक्षित रखता है और इस खंड को अगले पद की मुख्य क्रिया की भूमिका के रूप में बनाए रखता है।
- source_word: ተመሠጥኩ
  choice: मुझे ... उठा ले गया था
  rationale: अचानक और बलपूर्वक स्थानांतरण का भाव देता है, पर यह निर्धारित नहीं करता कि अनुभव शारीरिक था या दर्शनात्मक।
- source_word: በአውሎጋኒ ነፋስ
  choice: प्रचण्ड बवंडर
  rationale: मूल की तीव्र, वायुगत छवि को स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक दुहराव पादटिप्पणी में दिया गया है।
- source_word: ወወሰደኒ ዓረበ
  choice: और वह मुझे पश्चिम की ओर ले गया था
  rationale: दिशात्मक अर्थ और वायु द्वारा ले जाए जाने की निरंतर गति दोनों को बनाए रखता है।
theological_decisions:
- issue: दर्शन में स्थानांतरण का स्वरूप
  choice: मुझे प्रचण्ड बवंडर उठा ले गया था
  alternative: मुझे आँधी की आत्मा उठा ले गई थी / तूफानी हवा ने मुझे पकड़ लिया था
  rationale: मूल पाठ बलपूर्वक वायुजनित स्थानांतरण को सामने रखता है। अनुवाद यह तय नहीं करता कि यह शारीरिक रूप से हुआ था या दर्शनावस्था में।
- issue: गुप्त दर्शन सम्बन्धी व्याकरणिक अस्पष्टता
  choice: गुप्त बातों के सभी दर्शन
  alternative: सभी गुप्त दर्शन
  rationale: सम्बन्धवाचक वाक्यांश का अर्थ दोनों प्रकार से लिया जा सकता है; मुख्य पाठ एक अर्थ देता है और पादटिप्पणी दूसरे को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। आरम्भिक ‘और’ तथा अंत का दीर्घ विराम इस पद की अगले पद से जुड़ी, अपूर्ण दृश्य-भूमिका को सुरक्षित रखते हैं।
