  text: And there my eyes saw their instruments[d][c][b][a], as they were making iron chains without measure.
translation:
  language: hi
  text: और वहाँ मेरी आँखों ने उनके उपकरण[a] देखे, जब वे उन्हें बना रहे थे—लोहे की ऐसी बेड़ियाँ[b], जिनका कोई माप न था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उपकरण’ का अर्थ यहाँ ‘औज़ार’ या ‘काम में आने वाले साधन’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘लोहे की जंजीरें’; मूल शब्द बाँधने वाली वस्तुओं को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘बिना माप के’। संदर्भ के अनुसार इसका अर्थ ‘असीम’, ‘बेहिसाब’ या ‘जिसकी कोई सीमा न हो’ भी हो सकता है।
    reason: textual_lexical_ambiguity
lexical_decisions:
- source_word: ርእያ አዕይንትየ
  choice: मेरी आँखों ने ... देखे
  rationale: दर्शन-वर्णन की सजीव मूल अभिव्यक्ति में ‘मेरी आँखें’ स्पष्ट है; इसे केवल ‘मैंने देखा’ बनाकर संक्षिप्त नहीं किया गया।
- source_word: ዘመባዕዕቲሆሙ
  choice: उनके उपकरण
  rationale: संज्ञा पर तृतीय पुरुष बहुवचन संबंधसूचक प्रत्यय को ‘उनके’ से सुरक्षित रखा गया। ‘उपकरण’ काम में प्रयुक्त ठोस औज़ारों का व्यापक और स्वाभाविक हिन्दी शब्द है।
- source_word: እንዘ ይገብርዎሙ
  choice: जब वे उन्हें बना रहे थे
  rationale: ‘बना रहे थे’ जारी क्रिया को और ‘उन्हें’ क्रिया के तृतीय पुरुष बहुवचन कर्म-प्रत्यय को व्यक्त करता है।
- source_word: መአስርተ ሐጺን
  choice: लोहे की ... बेड़ियाँ
  rationale: संदर्भ में बाँधने के लिए बनाई जा रही ठोस वस्तुएँ अभिप्रेत हैं। ‘बेड़ियाँ’ हिन्दी में इस प्रयोजन को ‘जंजीरों’ से अधिक स्पष्ट करती हैं, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ዘአልቦ መደለውተ
  choice: जिनका भार मापा नहीं जा सकता था
  rationale: መደለውተ को तौल/भार के अर्थ-क्षेत्र से जोड़ते हुए वाक्यांश की असीमता को स्वाभाविक हिन्दी में व्यक्त किया गया है; पाठगत अनिश्चितता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: दर्शन में तैयार की जा रही वस्तुओं का स्वरूप
  choice: न्याय के लिए बनाई जा रही ठोस लोहे की बेड़ियाँ
  alternative: दंड के सामान्य उपकरण अथवा रूपकात्मक बंधन
  rationale: मूल में बनाना, लोहा और बाँधने की वस्तुएँ—ये सभी ठोस चित्र प्रस्तुत करते हैं। फिर भी पद स्वयं उनके प्रयोजन की व्याख्या नहीं करता, इसलिए अनुवाद ने न्याय-दृश्य का अतिरिक्त सिद्धान्तात्मक विवरण नहीं जोड़ा।
- issue: ‘उन्हें’ का व्याकरणिक संदर्भ
  choice: बहुवचन कर्म-सर्वनाम को स्पष्ट रूप से बनाए रखा
  alternative: सर्वनाम हटाकर केवल ‘जब वे लोहे की बेड़ियाँ बना रहे थे’
  rationale: क्रिया पर उपस्थित बहुवचन कर्म-प्रत्यय अनुवाद में दिखना चाहिए, भले ही उपकरणों और बेड़ियों के बीच का सटीक संबंध कुछ असामान्य बना रहे। इससे मूल की संरचनात्मक अस्पष्टता पूरी तरह समतल नहीं होती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सजीव किंतु गरिमापूर्ण दर्शन-वर्णन रखा गया है। ‘उपकरण’ और ‘बेड़ियाँ’ सामान्य पाठक के लिए स्पष्ट हैं। डैश मूल वाक्य की व्याकरणिक कसावट और ‘उन्हें’ तथा ‘लोहे की बेड़ियाँ’ के बीच व्याख्यात्मक संबंध को दिखाता है, बिना उस संबंध को पूरी तरह निश्चित किए।
