  text: And they shall bring the kings and the mighty[a], and cast them into that deep valley.
translation:
  language: hi
  text: और वे राजाओं और शक्तिशाली लोगों[a] को लाएँगे और उस गहरी घाटी में फेंक देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद में कर्ता का नाम नहीं दिया गया है। बहुवचन ‘वे’ सम्भवतः दर्शन में पहले उल्लिखित जनों की ओर संकेत करता है, जो शायद स्वर्गदूतीय परिचर हों।
    reason: alternative_reading
lexical_decisions:
- source_word: እምጽእዎሙ
  choice: उन्हें लाकर
  rationale: क्रिया का बहुवचन रूप ‘लाना’ या ‘ले आना’ व्यक्त करता है। हिन्दी में अगली क्रिया के साथ ‘उन्हें लाकर’ स्वाभाविक है और कर्म को स्पष्ट रखता है।
- source_word: ለነገሥት
  choice: राजाओं
  rationale: यह गीइज़ का सामान्य शब्द है जिसका अर्थ राजा या शासक है; न्याय के इस प्रसंग में निश्चित समूह का संकेत बना रहता है।
- source_word: ወለኃያላን
  choice: और शक्तिशाली लोगों
  rationale: यह पद सामर्थ्यवान या प्रभावशाली व्यक्तियों को दर्शाता है। ‘शक्तिशाली लोगों’ से सामाजिक-राजनीतिक बल और गरिमामय शैली दोनों सहज हिन्दी में बने रहते हैं।
- source_word: ይውድ ይዎሙ
  choice: फेंक देंगे
  rationale: यह पद न्याय के स्थान में बलपूर्वक डालने का भाव देता है। ‘फेंक देंगे’ स्पष्ट, स्वाभाविक और पर्याप्त रूप से प्रबल है।
- source_word: ውስተ
  choice: में
  rationale: हिन्दी में ‘घाटी में फेंकना’ गति और गंतव्य दोनों को स्वाभाविक रूप से व्यक्त करता है; अतः यहाँ ‘में’ अंग्रेज़ी ‘into’ के अर्थ को पूरा करता है।
- source_word: ዝኩ
  choice: उस
  rationale: संकेतवाचक शब्द दर्शन में पहले दिखाए गए स्थान की ओर इंगित करता है; ‘उस’ इसकी दूरी और पूर्व-संदर्भ को सुरक्षित रखता है।
- source_word: ዕሙቅ
  choice: गहरी
  rationale: यह विशेषण स्थान की गहराई बताता है। ‘गहरी’ सरल और चित्रात्मक है तथा अनावश्यक पौराणिक अर्थ नहीं जोड़ता।
- source_word: ቈላ
  choice: घाटी
  rationale: यह घाटी-सदृश नीची भूमि को दर्शाता है। ‘घाटी’ आधुनिक हिन्दी में सबसे स्वाभाविक समतुल्य है और दृश्य न्याय-स्थल की छवि बनाए रखता है।
theological_decisions:
- issue: कार्य करने वाले अनाम बहुवचन कर्ता की पहचान
  choice: केवल ‘वे’ रखा गया है; उन्हें स्वर्गदूत नहीं कहा गया
  alternative: ‘स्वर्गदूत राजाओं को लाएँगे’ अथवा ‘सेवक उन्हें लाएँगे’
  rationale: गीइज़ पाठ में इस पद का कर्ता स्पष्ट संज्ञा के रूप में नहीं दिया गया है। निकटवर्ती प्रसंग स्वर्गदूतीय कर्ताओं की ओर संकेत कर सकता है, पर पद स्वयं उनकी पहचान नहीं करता; इसलिए अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमामय और प्रकाशन-योग्य शैली रखी गई है। ‘वे’ द्वारा मूल का अनाम बहुवचन कर्ता सुरक्षित है; पदक्रम हिन्दी की स्वाभाविकता के अनुसार रखा गया है।
