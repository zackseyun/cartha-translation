base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/006.yaml
  text: And Michael and Gabriel and Raphael and Phanuel—they will seize them on that great day and cast them into the burning furnace on that day[a], so that the Lord of Spirits may take vengeance on them for their lawlessness[c][b], because they became servants of Satan and led astray those who dwell upon the dry land.
translation:
  language: hi
  text: और मीकाएल, गब्रिएल, रफाएल और फनूएल—वे उस महान दिन उन्हें पकड़ लेंगे[a] और उसी दिन उन्हें धधकती भट्ठी में डाल देंगे, ताकि आत्माओं का प्रभु उनके अधर्म के कारण उनसे बदला ले, क्योंकि वे शैतान के सेवक बन गए थे[b] और उन्होंने सूखी भूमि पर रहने वालों को भटका दिया था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उन्हें अपने अधिकार में ले लेंगे।’ गीज़ क्रिया बलपूर्वक पकड़ने का संकेत देती है, पर केवल गीज़ में सुरक्षित इस अंश में उसका सटीक भाव निश्चित करना कठिन है।
    reason: lexical_alternative
  - marker: b
    text: ‘शैतान के सेवक’ वाला पदबंध पाठ और शब्दार्थ—दोनों की दृष्टि से कठिन है। ‘शैतान के दास’ या, कम संभावना से, ‘शैतान के दूत’ भी संभव हैं।
    reason: textual_variant
  - marker: c
    text: शाब्दिक अर्थ ‘सूखी भूमि पर।’ इसका आशय सामान्यतः पृथ्वी के निवासी हो सकता है, फिर भी यहाँ पाठ की ठोस अभिव्यक्ति बनाए रखी गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ያፀንዕዎሙ
  choice: उन्हें पकड़ लेंगे
  rationale: क्रिया बलपूर्वक अधिकार में लेने का भाव देती है। ‘पकड़ लेंगे’ न्याय और दंड की तीव्रता बनाए रखता है, पर ‘बाँध देंगे’ जैसी अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: ዕለት ዐባይ
  choice: उस महान दिन
  rationale: यह सीधा अनुवाद प्रलय-दर्शन संबंधी प्रचलित सूत्र को बनाए रखता है और ‘न्याय का दिन’ जैसी व्याख्यात्मक वृद्धि से बचता है।
- source_word: እቶን ዘይነድድ
  choice: धधकती भट्ठी
  rationale: यह स्वाभाविक आधुनिक हिन्दी में जलती हुई भट्ठी की सजीव और दंडात्मक छवि को सुरक्षित रखता है।
- source_word: ይወድይዎሙ
  choice: उन्हें ... डाल देंगे
  rationale: संदर्भ में दोषियों को भट्ठी में फेंकने का दंडात्मक कार्य है। ‘डाल देंगे’ हिन्दी में स्वाभाविक है और क्रिया की कठोरता संदर्भ से स्पष्ट रहती है।
- source_word: ይትበቀል
  choice: बदला ... ले
  rationale: क्रिया प्रतिशोधात्मक न्याय व्यक्त करती है। ‘बदला ले’ इस तनाव को ‘दंड दे’ जैसे सामान्यीकृत अनुवाद से अधिक स्पष्ट रूप से बनाए रखता है।
- source_word: በዓመፃሆሙ
  choice: उनके अधर्म का
  rationale: ‘अधर्म’ नैतिक उल्लंघन, दुष्टता और न्यायिक दोष का गंभीर भाव संक्षेप में व्यक्त करता है।
- source_word: ላእከ ሰሰይጣን
  choice: शैतान के सेवक
  rationale: पदबंध का सबसे संभावित अर्थ शैतान की सेवा या अधीनता है। ‘सेवक’ नैतिक निष्ठा का भाव रखता है, जबकि ‘दास’ संपत्ति-संबंध को अधिक उभार सकता है और ‘दूत’ इस संदर्भ में कम संभावित है।
- source_word: አስኀትዎሙ
  choice: भटका दिया था
  rationale: क्रिया दूसरों को गलत मार्ग पर ले जाने का कारणात्मक भाव देती है। ‘भटका दिया’ नैतिक और दिशात्मक दोनों बिंब बनाए रखता है।
- source_word: እለ የኀድሩ ዲበ የብስ
  choice: सूखी भूमि पर रहनेवालों
  rationale: शाब्दिक और ठोस ‘सूखी भूमि’ को बनाए रखने से पाठ की ब्रह्मांड-संबंधी छवि सुरक्षित रहती है; इसे केवल ‘पृथ्वी के निवासी’ कहने से वह विशेषता मिट जाती।
theological_decisions:
- issue: दंड की भाषा को नरम किया जाए या नहीं
  choice: बदला और धधकती भट्ठी की स्पष्ट भाषा बनाए रखी गई
  alternative: इसे सामान्य ‘न्याय’ या ‘दंड’ के रूप में प्रस्तुत करना
  rationale: पद प्रलय-दर्शन संबंधी न्याय का कठोर चित्र प्रस्तुत करता है। अनुवाद उस धार्मिक तनाव और दृश्यात्मकता को बिना नरम किए सुरक्षित रखता है।
- issue: शैतान के साथ उनके संबंध को कैसे व्यक्त किया जाए
  choice: वे शैतान के सेवक बन गए थे
  alternative: वे शैतान के दास अथवा दूत बन गए थे
  rationale: गीज़ पदबंध सबसे स्वाभाविक रूप से शैतान की सेवा और अधीनता दर्शाता है। ‘सेवक’ नैतिक पक्षधरता बनाए रखता है, पर किसी अधिक संकीर्ण सत्ता-संबंधी या दूत-वर्ग संबंधी व्याख्या को अनिवार्य नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। नामों के लिए बाइबिलीय ध्वन्यंतरण अपनाया गया है। वाक्य की प्रलय-दर्शन संबंधी कठोरता, ‘आत्माओं का प्रभु’ उपाधि और मूल की ठोस ‘सूखी भूमि’ वाली छवि को सुरक्षित रखा गया है।
