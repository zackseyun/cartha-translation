base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/007.yaml
  text: And in those days the punishment from the Lord of Spirits will come[b][a], and all the storehouses of the waters that are above the heavens [and the fountains that are beneath the heavens] and those beneath the earth will be opened.
translation:
  language: hi
  text: और उन दिनों आत्माओं के प्रभु की ओर से दंड आएगा, और स्वर्गों के ऊपर के जल के सभी भंडार[b], [और स्वर्गों के नीचे के सोते][a], तथा पृथ्वी के नीचे के सोते खोल दिए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोष्ठकों में रखा वाक्यांश उपलब्ध पाठ में है। ‘स्वर्गों के नीचे’ का यह उल्लेख वाक्य के क्रम को असामान्य बनाता है और संभवतः पाठ-विकार या नकल के दौरान हुई पुनरावृत्ति को दर्शाता है; इसलिए इसे कोष्ठकों में रखा गया है।
    reason: textual_variant
  - marker: b
    text: ‘जल के भंडार’ प्राचीन ब्रह्मांड-कल्पना की छवि है, जिसमें स्वर्ग के ऊपर का जल प्रभु के न्याय में उपयोग के लिए संचित माना जाता था।
    reason: cultural_note
lexical_decisions:
- source_word: መዋዕል
  choice: दिनों
  rationale: በውእቱ के साथ यह प्रलयदर्शी सूत्र ‘उन दिनों’ बनाता है; इसे स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: መቅሠፍቱ
  choice: दंड
  rationale: यह दंडात्मक विपत्ति या ताड़ना का व्यापक शब्द है। ‘दंड’ न्याय का भाव बनाए रखता है, पर उसके रूप को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: እግዚአ መናፍስት
  choice: आत्माओं का प्रभु
  rationale: यह दृष्टांतों में प्रयुक्त विशिष्ट उपाधि है; हिन्दी रूप मूल की संबंध-संरचना और प्रलयदर्शी स्वर को बनाए रखता है।
- source_word: ታርሑ
  choice: खोल दिए जाएँगे
  rationale: भंडारों और सोतों के संदर्भ में कर्मवाच्य ‘खोल दिए जाएँगे’ स्वाभाविक है और जल के मुक्त किए जाने की ब्रह्मांडीय छवि को सुरक्षित रखता है।
- source_word: መዛግብተ
  choice: भंडार
  rationale: यह प्राचीन कल्पना को व्यक्त करता है जिसमें आकाशीय जल दैवी उपयोग के लिए भंडारों में रखा हुआ माना जाता है।
- source_word: ማያት
  choice: जल
  rationale: हिन्दी में ‘जल’ सामूहिक अर्थ में स्वाभाविक है और गीइज़ बहुवचन की व्यापक ब्रह्मांडीय धारणा को व्यक्त करता है।
- source_word: ዘመልዕልተ ሰማያት
  choice: स्वर्गों के ऊपर के
  rationale: ‘स्वर्गों’ का बहुवचन और ‘ऊपर’ की स्थान-सूचना मूल की परतदार ब्रह्मांड-कल्पना को बनाए रखते हैं।
- source_word: አንቅዕተ
  choice: सोते
  rationale: यह भूमिगत जल-स्रोतों के लिए सरल, सजीव और वर्तमान हिन्दी का शब्द है; ‘फव्वारे’ की आधुनिक कृत्रिम छाया से बचता है।
- source_word: መትሕተ ምድር
  choice: पृथ्वी के नीचे
  rationale: यह मूल स्थान-संबंध का सीधा और स्पष्ट अनुवाद है।
theological_decisions:
- issue: आने वाले दंड का स्वरूप
  choice: आकाशीय भंडारों और अधोलोकिक सोतों के खुलने से जुड़ा ठोस ब्रह्मांडीय न्याय
  alternative: सामान्य दंड या केवल रूपकात्मक चित्रण
  rationale: पद स्पष्ट रूप से ऊपर के जल-भंडारों और नीचे के सोतों का उल्लेख करता है। इसलिए प्रलयदर्शी जल-न्याय की छवि को सामान्यीकृत या केवल रूपक घोषित नहीं किया गया।
- issue: ‘आत्माओं के प्रभु’ उपाधि
  choice: उपाधि को यथावत संबंधवाचक रूप में रखना
  alternative: ‘आत्मिक प्रभु’ या किसी अधिक व्याख्यात्मक ईश-नाम से बदलना
  rationale: मूल की विशिष्ट उपाधि को बनाए रखना धार्मिक पहचान के बारे में अतिरिक्त सांप्रदायिक निष्कर्ष थोपने से बचाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘स्वर्गों’ का बहुवचन मूल की ब्रह्मांडीय परतों को सुरक्षित रखता है। संदिग्ध वाक्यांश को हटाने के बजाय कोष्ठकों और पाठालोचनात्मक टिप्पणी सहित प्रस्तुत किया गया है।
