  yaml_path: translation/extra_canonical/1_enoch/054/004.yaml
  text: And I asked the angel of peace who went with me[a], saying[b], “These chains of the instruments—for whom are they being prepared?”
translation:
  language: hi
  text: और मैंने अपने साथ चलने वाले शांति के दूत से पूछा, “उपकरणों की ये बेड़ियाँ[a] किसके लिए तैयार की जा रही हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल पाठ-साक्षी में ‘उपकरणों’ के लिए प्रयुक्त पद और उसका ‘बेड़ियों’ के साथ संबंध अनिश्चित है; इसका आशय दंड से संबद्ध उपकरणों या साधनों से हो सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: ተስእእክዎ
  choice: मैंने … से पूछा
  rationale: यह क्रिया साथ चलनेवाले दूत से किए गए सीधे प्रश्न का परिचय देती है; आधुनिक हिन्दी में ‘पूछा’ स्वाभाविक और अर्थ की दृष्टि से पर्याप्त है।
- source_word: መልአከ ሰላም
  choice: शान्ति का दूत
