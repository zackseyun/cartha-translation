- source_word: ዘየሐውር ምስሌየ
  choice: मेरे साथ चलनेवाला
  rationale: यह संबंधवाचक उपवाक्य दूत को हनोक के दर्शनीय यात्रा-सहचर के रूप में पहचानता है और मूल के गतिशील भाव को बनाए रखता है।
- source_word: እሉ እስረተ
  choice: ये … बेड़ियाँ
  rationale: दृश्य में दिखाई देनेवाली ठोस बन्धन-वस्तुओं के लिए ‘बेड़ियाँ’ दण्ड-संबंधी चित्र को स्पष्ट रखता है; ‘बन्धन’ भी सम्भव है।
- source_word: መበልዕት
  choice: उपकरणोंवाली
  rationale: इस साक्षी में पाठ और संज्ञा का सटीक आशय अनिश्चित है। ऐसा व्यापक शब्द चुना गया है जो दण्ड से जुड़े औजारों या साधनों का संकेत दे, पर अनिश्चितता को पादटिप्पणी में खुला रखे।
- source_word: ለመኑ ይዴለዉ
  choice: किसके लिए तैयार की जा रही हैं
  rationale: यह अनुवाद भावी प्राप्तकर्ताओं के विषय में प्रश्न और तैयारी की कर्मवाच्य, प्रत्याशात्मक शक्ति दोनों बनाए रखता है।
theological_decisions:
- issue: दर्शन में दण्ड देनेवाली वस्तुओं का स्वरूप
  choice: बेड़ियों और उपकरणों की ठोस दृश्यात्मक भाषा को बनाए रखा गया है।
  alternative: इसे सामान्य बनाकर ‘दण्ड’ या ‘न्याय के बन्धन’ कहना।
  rationale: मूल पाठ दृश्य में उपस्थित वस्तुओं की ओर संकेत करता है और पूछता है कि वे किसके लिए तैयार हो रही हैं। ठोस प्रलय-साहित्यिक बिम्ब को अमूर्त धार्मिक भाषा में बदलना अनुचित होगा।
