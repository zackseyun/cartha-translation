theological_decisions:
- issue: अज़ाज़एल से जुड़े समूह की पहचान
  choice: अज़ाज़एल के अधीन या उससे संबद्ध सामूहिक दल
  alternative: अज़ाज़एल का काम/कर्म; अज़ाज़एल के अनुयायी
  rationale: मूल पाठ इस बिंदु पर कठिन है। आसपास के बहुवचन रूप सामूहिक अर्थ का समर्थन करते हैं, पर वैकल्पिक अमूर्त पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ደይን का स्थानिक या अमूर्त अर्थ
  choice: न्याय अथवा दंड का स्थान
  alternative: हर न्याय के नीचे; समस्त न्याय के अधीन
  rationale: መትሕተ के अवरोही स्थानिक अर्थ और एनोखीय ब्रह्मांड-वर्णन के कारण स्थानिक पाठ चुना गया है; फिर भी पुराने अधिक शाब्दिक विकल्प को पादटिप्पणी में रखा गया है।
- issue: ‘उनके स्वर्गदूत’ बनाम ‘उनके जबड़े’
  choice: उनके जबड़े
  alternative: उनके स्वर्गदूत/दूत
  rationale: समीक्षित पांडुलिपिगत निर्णय इसे OCR की दृश्यगत भूल मानता है। ‘जबड़े’ क्रिया-विन्यास, पत्थरों के करण-प्रयोग और समानांतर दंड-चित्र से अधिक सुसंगत है, जबकि मुद्रित इनपुट का पाठ पादटिप्पणी में पारदर्शी रूप से दर्ज है।
