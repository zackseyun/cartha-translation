- source_word: መትሕተ ኵሉ ደይን
  choice: न्याय-स्थान के सबसे निचले भाग में
  rationale: नवीन पाठालोचन के अनुसार पदबंध स्थानिक अवरोह और दंड अथवा न्याय के स्थान को सूचित करता है। ‘नरक’ जैसे बाद के धर्मवैचारिक पद से बचते हुए एनोखीय स्थल-विन्यास सुरक्षित रखा गया है।
