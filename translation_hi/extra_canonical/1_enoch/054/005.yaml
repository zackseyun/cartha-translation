  yaml_path: translation/extra_canonical/1_enoch/054/005.yaml
  text: And he said to me[a], “These are being prepared for the host of Azazʾel, so that they may take them and cast them into the lowest part of the place of judgment; and they will cover their jaws with rough stones[e][d][c][b], just as the Lord of Spirits commanded.”
translation:
  language: hi
  text: और उसने मुझसे कहा, “ये अज़ाज़एल के दल के लिए तैयार किए जा रहे हैं[a], ताकि वे उन्हें पकड़ लें और न्याय-स्थल के सबसे निचले भाग में फेंक दें[b]; और वे उनके जबड़ों को खुरदरे पत्थरों से ढक देंगे[c], ठीक वैसे ही जैसे आत्माओं के प्रभु ने आज्ञा दी थी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ यहाँ कठिन है। इसका अर्थ “अज़ाज़एल के काम के लिए” या “अज़ाज़एल से संबंधित लोगों के लिए” भी लिया जा सकता है।
    reason: textual_variant
  - marker: b
    text: 'अधिक शाब्दिक रूप में: “हर न्याय के नीचे” या “समस्त न्याय के अधीन।” पदबंध अस्पष्ट है, पर इस प्रसंग में न्याय अथवा दंड के सबसे निचले स्थान का अर्थ अधिक संभावित है।'
    reason: lexical_alternative
  - marker: c
    text: प्रदत्त गीज़ प्रतिलिपि में यहाँ “उनके स्वर्गदूत” पढ़ा जाता है, किंतु इसे संभवतः “उनके जबड़े/गाल” वाले पाठ की OCR-जनित गलत पहचान माना गया है। वाक्य की व्याकरणिक रचना के अनुसार पत्थर ढकने की सामग्री हैं।
    reason: textual_variant
