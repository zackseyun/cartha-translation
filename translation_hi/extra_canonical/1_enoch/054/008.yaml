lexical_decisions:
- source_word: ወ
  choice: और
  rationale: उपसर्ग रूप में आया यह सामान्य संयोजक है; संक्षिप्त उपलब्ध पाठ में इसे अधिक प्रबल क्रमसूचक अर्थ देना उचित नहीं।
- source_word: ይዴመሩ
  choice: वे आपस में मिल जाएँगे
  rationale: यह रूप ‘जोड़ना, मिलाना, एक करना’ अर्थ-क्षेत्र वाले धातु से भविष्याभिमुख अपूर्ण, कर्मवाच्य/आत्मवाच्य बहुवचन भाव व्यक्त करता है। ‘आपस में मिल जाएँगे’ आधुनिक हिन्दी में स्वाभाविक ढंग से संयुक्त होने का अर्थ रखता है और ‘नापे गए’ वाले पुराने विश्लेषण से बचता है।
theological_decisions:
- issue: अत्यंत संक्षिप्त और पृथक गीइज़ उपवाक्य का अर्थ कितनी निश्चितता से व्यक्त किया जाए
  choice: और वे आपस में मिल जाएँगे।
  alternative: और वे एक कर दिए जाएँगे।
  rationale: क्रिया का रूप संयुक्त होने का भाव देता है, पर कर्मवाच्य और आत्मवाच्य के बीच सूक्ष्म अस्पष्टता बनी रहती है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और वैकल्पिक रूप पादटिप्पणी में दिया गया है।
- issue: वाक्य में ‘वे’ किन वस्तुओं की ओर संकेत करता है
  choice: सर्वनाम को बिना व्याख्यात्मक संज्ञा जोड़े बनाए रखना
  alternative: ऊपर और नीचे के जल आपस में मिल जाएँगे।
  rationale: उपलब्ध मूल अंश में केवल सर्वनाम है। निकटवर्ती संदर्भ संभावित संकेत दे सकता है, किंतु उसे सीधे इस छोटे पाठ में जोड़ना स्रोत से अधिक स्पष्टता आरोपित करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य। ‘आपस में’ से बहुवचन वस्तुओं के संयुक्त होने का भाव स्वाभाविक रूप से व्यक्त होता है; संदर्भ से अनुमानित ‘जल’ को मुख्य पाठ में नहीं जोड़ा गया।
