  yaml_path: translation/extra_canonical/1_enoch/091/010.yaml
  text: And the righteous one shall arise from their sleep[b][a], and wisdom shall arise and be given to them.
translation:
  language: hi
  text: और धर्मी जन[a] उनकी नींद से उठेगा[b], और बुद्धि उठ खड़ी होगी और उन्हें दी जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘धर्मी जन’ मूल पाठ में एकवचन है। यह किसी विशिष्ट व्यक्ति, समुदाय के प्रतिनिधि, या एक आदर्श धर्मी व्यक्ति की ओर संकेत कर सकता है; पाठ स्वयं इसे स्पष्ट नहीं करता।
    reason: lexical_alternative
  - marker: b
    text: मूल में शाब्दिक रूप से ‘उनकी नींद से’ है, यद्यपि कर्ता ‘धर्मी जन’ एकवचन है। अर्थ की इस संख्या-संबंधी कठिनाई को बनाए रखा गया है; सहज हिन्दी में इसे ‘अपनी नींद से’ भी कहा जा सकता है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: ይትነሣእ
  choice: उठेगा / उठ खड़ी होगी
  rationale: क्रिया में उठने, जागने या प्रकट होकर खड़े होने का भाव है। दोनों खंडों में एक ही मूल क्रिया की पुनरावृत्ति को हिन्दी में यथासंभव बनाए रखा गया है।
- source_word: ጻድቅ
  choice: धर्मी जन
  rationale: स्रोत का रूप एकवचन है। ‘धर्मी जन’ स्वाभाविक और गरिमापूर्ण हिन्दी में एकवचन को बनाए रखता है, पर यह तय नहीं करता कि यह कोई विशिष्ट व्यक्ति है या समुदाय का प्रतिनिधि।
- source_word: እምነዋሙ
  choice: उनकी नींद से
  rationale: रूप को ‘नींद से’ और बहुवचन संबंधसूचक प्रत्यय के साथ समझा गया है। इससे स्रोत में एकवचन ‘धर्मी जन’ और बहुवचन ‘उनकी’ के बीच की असामान्य संख्या-संगति भी सुरक्षित रहती है।
- source_word: ጥበብ
  choice: बुद्धि
  rationale: यहाँ शब्द नैतिक और प्रकाशन-संबंधी बुद्धि का बोध कराता है; ‘बुद्धि’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ይትወሀብ ሎሙ
  choice: उन्हें दी जाएगी
  rationale: कर्मवाच्य क्रिया और बहुवचन अप्रत्यक्ष कर्म को सीधे रूप में व्यक्त किया गया है, बिना दाता की पहचान पाठ में जोड़े।
theological_decisions:
- issue: क्या ጻድቅ को सामूहिक बहुवचन माना जाए या एकवचन व्यक्ति के रूप में रखा जाए
  choice: एकवचन ‘धर्मी जन’
  alternative: ‘धर्मी लोग’ अथवा ‘एक धर्मी व्यक्ति’
  rationale: गीज़ पाठ में संज्ञा एकवचन है। एकवचन रखने से किसी विशिष्ट, प्रतिनिधि या समुदाय से उभरने वाले व्यक्ति की संभावनाएँ खुली रहती हैं और किसी एक धार्मिक व्याख्या को अनिवार्य नहीं किया जाता।
- issue: एकवचन कर्ता के साथ बहुवचन संबंधसूचक रूप की संख्या-संगति
  choice: ‘उनकी नींद से’ के रूप में तनाव को बनाए रखना
  alternative: व्याकरण को समतल करके ‘अपनी नींद से’
  rationale: स्रोत में दिखाई देने वाली एकवचन और बहुवचन की खिंचावपूर्ण संगति को चुपचाप ठीक करना अर्थगत संभावना को सीमित कर सकता है; इसलिए मुख्य पाठ में दोनों रूप सुरक्षित रखे गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सर्वसाधारण के लिए बोधगम्य रखी गई है। ‘उठेगा’ और ‘उठ खड़ी होगी’ से मूल की समान क्रिया का समानांतर प्रयोग सुनाई देता है।
