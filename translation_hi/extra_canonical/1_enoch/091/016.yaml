base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/016.yaml
  text: And the first heaven shall depart and pass away[a], and a new heaven shall appear[b], and all the powers of the heavens shall shine sevenfold forever.
translation:
  language: hi
  text: और पहला आकाश चला जाएगा और बीत जाएगा, और एक नया आकाश दिखाई देगा; और आकाशों की सारी शक्तियाँ[a] सात गुना चमकेंगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आकाशों की सारी सेनाएँ/सारे गण’। गीज़ शब्द का अर्थ शक्तियाँ, सेनाएँ या स्वर्गीय गण हो सकता है; इसमें आकाशीय पिंड और स्वर्गीय प्राणी दोनों सम्मिलित हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: अंतिम वाक्यांश कठिन है। इसका सम्भावित अर्थ ‘सात गुना’ या ‘सात गुना अधिक उज्ज्वल होकर’ है; उपलब्ध इथियोपिक पाठ के शब्दरूप के कारण कुछ अनिश्चितता बनी रहती है।
    reason: textual_variant
lexical_decisions:
- source_word: ሰማይ፡ ቀዳማይ፡
  choice: पहला आकाश
  rationale: ቀዳማይ क्रम में ‘पहला’ या ‘पहले का’ सूचित कर सकता है। ‘पहला आकाश’ आगे आने वाले ‘नए आकाश’ के साथ प्रत्यक्ष विरोध बनाए रखता है।
- source_word: ይወፅእ፡ ወየኃልፍ፡
  choice: चला जाएगा और बीत जाएगा
  rationale: दोनों क्रियाओं के क्रमशः निकल जाने और बीत जाने के भाव को सुरक्षित रखा गया है; इससे विनाश या नवीनीकरण में से किसी एक व्याख्या को अनावश्यक रूप से निश्चित नहीं किया जाता।
- source_word: ሰማይ፡ ሐዲስ፡
  choice: एक नया आकाश
  rationale: ሐዲስ का सीधा अर्थ ‘नया’ है। ‘नवीकृत’ कहना मूल से अधिक व्याख्यात्मक होता।
- source_word: ይትረአይ፡
  choice: दिखाई देगा
  rationale: क्रिया का भाव ‘देखा जाएगा/प्रकट होगा’ है। ‘दिखाई देगा’ सहज हिन्दी में दृश्य प्रकटता को व्यक्त करता है।
- source_word: ኵሉ፡ ኃይለ፡ ሰማያት፡
  choice: आकाशों की सारी शक्तियाँ
  rationale: ኃይለ में शक्ति, सेना या समूह के अर्थ संभव हैं। ‘शक्तियाँ’ खगोलीय पिंडों और स्वर्गीय प्राणियों के बीच की मूल अस्पष्टता को बनाए रखता है।
- source_word: ያበርህ፡
  choice: चमकेंगी
  rationale: यह क्रिया चमकने या प्रकाश देने का अर्थ रखती है; ‘चमकेंगी’ संक्षिप्त और चित्रात्मक है।
- source_word: ሰብዓተ፡ ምእዕቢተ።
  choice: सात गुना
  rationale: ሰብዓተ स्पष्टतः सात का संकेत देता है और कठिन अंतिम पद वृद्धि या तीव्रता का भाव देता प्रतीत होता है। ‘सात गुना’ सम्भावित अर्थ को स्वाभाविक हिन्दी में रखता है, जबकि शेष अनिश्चितता पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: क्या पुराना आकाश पूर्णतः बदला जाएगा या उसका रूपान्तरण होगा
  choice: 'दर्शनात्मक क्रम को यथावत रखा गया है: पहला आकाश चला और बीत जाता है तथा नया आकाश दिखाई देता है।'
  alternative: इसे पुराने ब्रह्माण्ड का पूर्ण प्रतिस्थापन या उसी ब्रह्माण्ड का नवीनीकरण मानना।
  rationale: गीज़ पाठ दृश्य और विरोध प्रस्तुत करता है, पर व्यवस्थित ब्रह्माण्ड-विज्ञान नहीं देता; इसलिए अनुवाद किसी एक निष्कर्ष को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दर्शनात्मक शैली रखी गई है। ‘चला जाएगा और बीत जाएगा’ मूल की दोहरी क्रिया को बचाता है। उपलब्ध गीज़ पंक्ति में अनन्तकाल का स्पष्ट पद न होने के कारण मुख्य पाठ में ‘सदा’ नहीं जोड़ा गया।
