  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रलयदर्शी शैली रखी गई है। ‘काट दिए जाएँगे’, ‘तलवार के हवाले’ और ‘वध के लिए सौंपे’ जैसे पद मूल के कठोर न्याय-बिंब को बनाए रखते हैं। कठिन गीइज़ वाक्य-विन्यास को मुख्य पाठ में पठनीय बनाया गया है और वास्तविक पाठगत/वाक्यगत अनिश्चितता पादटिप्पणियों में सुरक्षित रखी गई है।
