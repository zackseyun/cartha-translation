base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/011.yaml
  text: And from it shall be cut off the roots of oppression[a], and sinners shall be delivered up to the sword. From the blasphemers they shall be cut off in every place[d][c][b], and those who devise violence and those who commit blasphemy shall be destroyed by the sword.
translation:
  language: hi
  text: और उसमें से अत्याचार की जड़ें काट दी जाएँगी,[a] और पापी तलवार के हवाले कर दिए जाएँगे। ईशनिन्दक हर स्थान में काट दिए जाएँगे,[b] और जो हिंसा की योजनाएँ बनाते हैं और ईशनिन्दा करते हैं, वे वध द्वारा नष्ट किए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद का इथियोपिक पाठ कठिन है। यहाँ प्राप्त गीइज़ पाठ-क्रम के अनुसार ‘अत्याचार की जड़ें’ अनुवाद किया गया है; इसे ‘अत्याचार के दस सप्ताह’ भी समझा गया है।
    reason: textual_variant
  - marker: b
    text: ‘ईशनिन्दक’ और ‘ईशनिन्दा’ गीइज़ के परस्पर संबंधित शब्दों का अनुवाद हैं। इस खंड की वाक्य-रचना कठिन है; ‘ईशनिन्दकों में से’ के संबंध और आगे के उपवाक्य के क्रम को निश्चित रूप से निर्धारित करना कठिन है।
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: አሥራወ ዓመፃ
  choice: अत्याचार की जड़ें
  rationale: यहाँ አሥራወ को ‘जड़ें’ समझना वाक्य के ‘काट दिए जाने’ वाले बिंब और प्राप्त पाठ-क्रम के अनुकूल है। ዓመፃ में अन्याय, हिंसा और उत्पीड़न का भाव है; ‘अत्याचार’ इन अर्थों को स्वाभाविक हिन्दी में समेटता है।
- source_word: ይትገዘሙ
  choice: काट दी जाएँगी / काट दिए जाएँगे
  rationale: कर्मवाच्य रूप अलग किए जाने या काट डाले जाने का संकेत देता है। ‘काट देना’ न्याय और उन्मूलन के प्रलयदर्शी बिंब को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: ኃጥኣን
  choice: पापी
  rationale: हनोक के न्याय-संदर्भ में यह प्रचलित नैतिक-धार्मिक पद है; ‘पापी’ इसकी धार्मिक गंभीरता बनाए रखता है।
- source_word: ይትሐጐሉ
  choice: हवाले कर दिए जाएँगे / सौंप दिए जाएँगे
  rationale: रूप में किसी दंड या परिणाम के अधीन सौंपे जाने का कर्मवाच्य भाव है। हिन्दी में प्रसंग के अनुसार ‘हवाले’ और ‘सौंपे’ स्वाभाविक हैं तथा सीधे ‘मार डाले जाएँगे’ कहकर निहित न्यायिक तनाव को समाप्त नहीं करते।
- source_word: በሰይፍ
  choice: तलवार के हवाले
  rationale: यह न्याय का स्पष्ट हिंसक बिंब है। ‘तलवार के हवाले’ स्वाभाविक हिन्दी में साधन और दंड दोनों का भाव देता है।
- source_word: ጽሩፋን
  choice: निन्दक
  rationale: पद अपमान या ईशनिन्दा करनेवालों को सूचित करता है। ‘निन्दक’ संज्ञात्मक रूप में संक्षिप्त है और आगे आनेवाले संबंधित ጽርፈት के साथ अर्थगत संबंध रखता है।
- source_word: በኵሉ መካን
  choice: हर स्थान से
  rationale: शाब्दिक अर्थ ‘हर स्थान में/पर’ है। ‘हर स्थान से काट दिए जाएँगे’ हिन्दी में हटाए जाने के भाव के साथ अधिक स्वाभाविक है, जबकि न्याय की सार्वभौमिक व्यापकता बनी रहती है।
- source_word: ይሔልይዋ ለግፍዕ
  choice: हिंसा की योजनाएँ बनाते
  rationale: क्रिया सोचने, युक्ति करने या योजना बनाने का भाव देती है और ግፍዕ हिंसा/उत्पीड़न को सूचित करता है। यह अनुवाद जानबूझकर रचे गए हिंसक कृत्य का भाव सुरक्षित रखता है।
- source_word: ይገብርዋ ለጽርፈት
  choice: ईशनिन्दा करते
  rationale: ‘करना’ और निन्दा/धर्मनिन्दा के पद का संयोजन है। धार्मिक न्याय-संदर्भ में ‘ईशनिन्दा करना’ सहज और गंभीर हिन्दी है।
- source_word: በመጥባሕት
  choice: वध के लिए
  rationale: यह पद वध, काटे जाने या संहार से संबंधित है और पहले प्रयुक्त सामान्य ‘तलवार’ वाले पद से भिन्न है। ‘वध के लिए’ अंतिम दंड को स्पष्ट करता है, पर हथियार को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: ዓመፃ का नैतिक-सामाजिक बल
  choice: अत्याचार
  alternative: अन्याय / उत्पीड़न / हिंसा
  rationale: ‘अत्याचार’ नैतिक बुराई और हिंसक उत्पीड़न दोनों को समेटता है तथा न्याय-वाणी की तीव्रता बनाए रखता है।
- issue: बार-बार आए ይትሐጐሉ का अर्थ
  choice: हवाले/सौंपे जाना
  alternative: मार डाला जाना / नष्ट किया जाना
  rationale: सौंपे जाने का कर्मवाच्य न्यायिक भाव और उसके घातक परिणाम के बीच का तनाव मूल में बना रहता है; अनुवाद उसे एक ही स्पष्ट क्रिया में समेटकर समाप्त नहीं करता।
- issue: ጽሩፋን और ጽርፈት के धार्मिक आशय
  choice: निन्दक / ईशनिन्दा करते हैं
  alternative: गाली देनेवाले / अपमान करते हैं
  rationale: संदर्भ धार्मिक-अंतिम न्याय का है, इसलिए दूसरे पद में ‘ईशनिन्दा’ उचित है; पहले में ‘निन्दक’ रखने से हिन्दी सहज रहती है और पादटिप्पणी द्वारा मूल का शब्द-संबंध बताया जाता है।
