base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/015.yaml
  text: And after this[a], in the tenth week, in the seventh part, there shall be the eternal judgment [and it shall be executed by the watchers of the eternal heaven][b], a great judgment that will be exacted in the midst of the angels.
translation:
  language: hi
  text: और इसके बाद[a], दसवें सप्ताह के सातवें भाग में, अनन्त न्याय होगा [और अनन्त स्वर्ग के प्रहरी इसे कार्यान्वित करेंगे][b]—एक महान न्याय, जो स्वर्गदूतों के बीच कार्यान्वित किया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पुराने अनुवादों में यहाँ सातवें सप्ताह और धर्मत्यागी पीढ़ी से संबंधित एक बिल्कुल अलग पाठ दिया गया था; वह 1 हनोक 93:9–10 की सामग्री है। उपलब्ध गीज़ पाठ यहाँ स्पष्ट रूप से दसवें सप्ताह के सातवें भाग और अनन्त न्याय की बात करता है।
    reason: textual_variant
  - marker: b
    text: कोष्ठकों में दिया गया वाक्य पाठगत रूप से अनिश्चित है। ‘प्रहरी’ यहाँ अनन्त स्वर्ग के watchers के लिए प्रयुक्त है; वाक्य का अभिप्राय यह भी हो सकता है कि वही इस न्याय को संपन्न करेंगे।
    reason: textual_uncertainty
lexical_decisions:
- source_word: ወእምድኅረ ዝ
  choice: और इसके बाद
  rationale: यह अगले कालखंड की ओर ले जाने वाला स्वाभाविक कालसूचक संक्रमण है।
