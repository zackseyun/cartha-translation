  choice: दसवें सप्ताह के सातवें भाग में
  rationale: गीज़ पाठ स्पष्ट रूप से दसवें सप्ताह और उसके सातवें भाग का उल्लेख करता है; प्रतीकात्मक सप्ताह की भाषा सुरक्षित रखी गई है।
- source_word: ኵነኔ እንተ ለዓለም
  choice: अनन्त न्याय
  rationale: ኵነኔ का मूल अर्थ न्याय/दण्डादेश है और እንተ ለዓለም उसे स्थायी या अनन्त गुण देता है।
- source_word: ወትትገበር እምትጉሃነ ሰማይ ዘለዓለም
  choice: और उसे अनन्त स्वर्ग के पहरेदार पूरा करेंगे
  rationale: कोष्ठकित पाठ को पाठगत रूप से चिह्नित रखते हुए पहरेदारों द्वारा न्याय के निष्पादन का अर्थ स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ዐቢይ
  choice: महान
  rationale: यह सीधे न्याय की विशालता या महत्ता बताने वाला विशेषण है।
- source_word: ዘይትቤቀል እማእከሎሙ ለመላእክት
  choice: जो स्वर्गदूतों के बीच कार्यान्वित किया जाएगा
  rationale: नवीनतम पाठ-समीक्षा के अनुसार क्रिया का निष्क्रिय भाव रखा गया है और 'बीच' से እማእከሎሙ का स्थानगत अर्थ सुरक्षित है; 'प्रतिशोध' जैसी अतिरिक्त व्याख्या नहीं जोड़ी गई।
theological_decisions:
- issue: अनन्त न्याय का स्वरूप और उसके कर्ता
  choice: पाठ जितना कहता है उतना ही—अनन्त न्याय और कोष्ठकित पंक्ति में स्वर्गीय पहरेदारों द्वारा उसका निष्पादन
  alternative: न्याय को सीधे परमेश्वर का प्रतिशोध कहना या पहरेदारों की पहचान किसी विशिष्ट स्वर्गदूतीय वर्ग से निश्चित करना
  rationale: पाठ की न्याय-संबंधी भाषा और उसके कोष्ठकित पाठगत तनाव को सुरक्षित रखा गया है; कर्तृत्व या दण्ड की प्रकृति पर अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं थोपा गया।
- issue: स्वर्गदूतों के बीच होने वाले महान न्याय का अर्थ
  choice: वाक्य को निष्क्रिय और स्थानगत रखा गया है
  alternative: स्वर्गदूतों द्वारा दूसरों पर प्रतिशोध या स्वर्गदूतों के विरुद्ध दण्ड के रूप में स्पष्ट करना
  rationale: गीज़ पंक्ति की व्याकरणिक और अर्थगत अनिश्चितता को किसी एक धर्मवैज्ञानिक दिशा में निर्णायक रूप से नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘पहरेदार’ गीज़ के स्वर्गीय watchers का सहज रूप है। वर्ग कोष्ठक स्रोत में कोष्ठकित और पाठगत रूप से संदिग्ध वाक्यांश को सुरक्षित रखते हैं; सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
