base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/006.yaml
  text: And lawlessness will again increase[a], and it will be brought to completion upon the earth[c][b]; and every work of lawlessness and violence and sin will again take hold.
translation:
  language: hi
  text: और अधर्म फिर से दोहराया जाएगा[a], और वह पृथ्वी पर अपनी पराकाष्ठा तक पहुँच जाएगा[b]; और अधर्म, हिंसा और पाप का हर कार्य फिर से पकड़ बना लेगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “फिर दोहराया जाएगा।” आशय अधर्म के दोबारा प्रकट होने से है; मूल शब्द अपने आप में “बढ़ने” को स्पष्ट रूप से नहीं कहता।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “पूर्ण किया जाएगा,” “पूरा हो जाएगा,” या “अपनी पूरी सीमा तक पहुँच जाएगा” भी हो सकता है। यहाँ भाव अशुभ है—अधर्म अपनी पराकाष्ठा तक पहुँचता है।
    reason: lexical_alternative
  - marker: c
    text: मूल क्रिया का शाब्दिक चित्र “पकड़ लेने” या “अधिकार जमाने” का है—अर्थात बुरे कार्य फिर से अपना प्रभाव जमा लेंगे।
    reason: lexical_alternative
lexical_decisions:
- source_word: ትደገም ካዕበ
  choice: फिर से होने लगेगा
  rationale: मूल क्रिया और ካዕበ पुनरावृत्ति पर बल देते हैं। शाब्दिक ‘फिर दोहराया जाएगा’ हिन्दी में असहज है; यह चयन किसी नई वृद्धि का अर्थ जोड़े बिना अधर्म के पुनः प्रकट होने को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ዓመፃ
  choice: अधर्म
  rationale: यहाँ ऐसा नैतिक विद्रोह अथवा व्यवस्था-विरोध अभिप्रेत है जिसे बाद के अलग शब्दों ‘हिंसा’ और ‘पाप’ में विलीन नहीं करना चाहिए। ‘अधर्म’ सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण है।
- source_word: ትትፈጸም
  choice: अपनी पराकाष्ठा तक पहुँच जाएगा
  rationale: मूल में पूर्ण या समाप्त किए जाने का भाव है। हिन्दी में यह वाक्यांश उस अशुभ अर्थ को स्वाभाविक रूप से व्यक्त करता है कि अधर्म अपनी पूरी सीमा तक पहुँचता है, पर किसी कर्ता को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: ዲበ ምድር
  choice: पृथ्वी पर
  rationale: संदर्भ का व्यापक, प्रलयदर्शी क्षेत्र बनाए रखता है; ‘देश में’ अर्थ को अनावश्यक रूप से स्थानीय बना देता।
- source_word: ኵሉ ግብረ
  choice: हर काम
  rationale: वितरणात्मक ኵሉ और कर्म/कार्य सूचक ግብር को संक्षिप्त, सहज हिन्दी में बनाए रखता है।
- source_word: ግፍዕ
  choice: हिंसा
  rationale: शब्द में अत्याचार और उत्पीड़न के अर्थ भी संभव हैं, पर ‘हिंसा’ त्रिक के सामाजिक और कठोर आयाम को स्पष्ट रखते हुए दूसरे पदों से भेद बनाए रखती है।
- source_word: አበሳ
  choice: पाप
  rationale: यह व्यापक नैतिक-धार्मिक दोष का स्पष्ट और प्रचलित हिन्दी समतुल्य है।
- source_word: ትትአኀዝ ... ካዕበተ
  choice: फिर से पकड़ बना लेगा
  rationale: मूल क्रिया पकड़ने या अधिकार जमाने का चित्र देती है। यह हिन्दी अभिव्यक्ति बुरे कामों के पुनः प्रभावी होने की छवि को बनाए रखती है।
theological_decisions:
- issue: तीन समन्वित बुराइयों को एक व्यापक शब्द में समेटना या उनका भेद बनाए रखना
  choice: ‘अधर्म, हिंसा और पाप’ का पृथक त्रिक
  alternative: ‘दुष्टता, अत्याचार और अपराध’ अथवा सभी को सामूहिक रूप से ‘बुराई’ कहना
  rationale: गीज़ पाठ तीन अलग पदों का संचय करता है। उनका भेद बनाए रखने से कथन की प्रलयदर्शी तीव्रता और नैतिक विस्तार सुरक्षित रहता है।
- issue: पूर्णता वाली निष्क्रिय क्रिया में किसी कर्ता को स्पष्ट करना
  choice: कर्ता को अनिर्दिष्ट रखते हुए ‘अपनी पराकाष्ठा तक पहुँच जाएगा’
  alternative: ‘परमेश्वर उसे पूरा होने देगा’ या ‘उसे पूर्ण किया जाएगा’
  rationale: मूल पाठ कर्ता का नाम नहीं बताता। किसी दैवी कर्ता को जोड़ना धर्मवैज्ञानिक तनाव को समय से पहले सुलझा देता, जबकि अत्यधिक शाब्दिक निष्क्रिय हिन्दी अस्वाभाविक होती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज प्रलयदर्शी लहजा रखा गया है। ‘फिर से होने लगेगा’ शाब्दिक पुनरुक्ति की असहजता से बचता है, जबकि पादटिप्पणी मूल की पुनरावृत्ति स्पष्ट करती है। अर्धविराम पद के दो संबंधित कथनों को अलग रखता है और मूल के संचयी प्रभाव को बनाए रखता है।
