base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/013.yaml
  text: And at its completion[a], houses shall be chosen because of their righteousness[c][b], and the house of the great King shall be built in glory forever.
translation:
  language: hi
  text: और उसकी पूर्णता पर[a], उनके धर्मीपन के कारण घर[b] चुने जाएँगे, और महान राजा का भवन[c] महिमा में सदा के लिए बनाया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘उसकी पूर्णता/समाप्ति पर’; ‘उसकी’ का संकेत पूर्ववर्ती कालखंड या क्रम की ओर है।
    reason: referential_ambiguity
  - marker: b
    text: मूल में ‘घर’ बहुवचन है; इसका अर्थ निवास या घराने भी हो सकता है। दिए गए गीइज़ पाठ की क्रिया का अर्थ ‘चुने जाएँगे’ है; ‘वे घर प्राप्त करेंगे’ एक प्रस्तावित पाठ-संशोधन पर निर्भर है।
    reason: lexical_and_textual_alternative
  - marker: c
    text: शाब्दिक रूप से ‘महान राजा का घर’; यहाँ ‘महान राजा’ संभवतः परमेश्वर के लिए प्रयुक्त उपाधि है, और ‘घर’ में राजभवन या पवित्र भवन—दोनों की छाया हो सकती है।
    reason: theological_and_lexical_ambiguity
