  choice: घर
  rationale: मूल में ‘घर’ का बहुवचन है। यह वास्तविक निवासों या प्रतीकात्मक घरानों—दोनों की ओर संकेत कर सकता है; ठोस स्थापत्य बिंब को बनाए रखने के लिए ‘घर’ रखा गया है।
- source_word: እምጽድቅ ዚአሆሙ
  choice: अपने धर्मीपन के कारण
  rationale: यह पद उनके धर्मीपन को चयन का आधार बताता हुआ समझा गया है। ‘अपने’ उन लोगों/समुदायों से संबंध दिखाता है जिनसे ये घर जुड़े हैं, यद्यपि वाक्य की व्याकरणिक संरचना संक्षिप्त और कुछ कठिन है।
- source_word: ወይትሐነጽ
  choice: बनाया जाएगा
