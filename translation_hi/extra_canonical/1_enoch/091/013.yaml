- source_word: ይመረዩ
  choice: चुने जाएँगे
  rationale: दिए गए गीइज़ पाठ का रूप निष्क्रिय चयन का अर्थ देता है; इसलिए ‘चुने जाएँगे’ रखा गया है, न कि पाठ-संशोधन पर आधारित ‘वे प्राप्त करेंगे’।
