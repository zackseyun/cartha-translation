- source_word: ቤት ንጉሥ ዐቢይ
  choice: महान राजा का भवन
  rationale: शाब्दिक अर्थ ‘महान राजा का घर’ है। ‘भवन’ हिन्दी में राजकीय निवास और पवित्र भवन, दोनों की संभावित प्रतिध्वनि को खुला रखता है।
- source_word: በስብሐት
  choice: महिमा में
  rationale: मूल पूर्वसर्ग सहित ‘महिमा/वैभव में’ का भाव देता है। ‘महिमा में’ दर्शनात्मक और धार्मिक शैली के अनुरूप रहते हुए अर्थ को अनावश्यक रूप से नहीं खोलता।
- source_word: እስከ ለዓለም
  choice: सदा के लिए
  rationale: यह अनंत स्थायित्व का प्रचलित गीइज़ मुहावरा है; ‘सदा के लिए’ स्वाभाविक आधुनिक हिन्दी है।
