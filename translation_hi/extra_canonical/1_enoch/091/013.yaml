- issue: घरों का चयन और धर्मीपन का संबंध
  choice: ‘घर अपने धर्मीपन के कारण चुने जाएँगे’
  alternative: ‘वे अपने धर्मीपन के कारण घर प्राप्त करेंगे’ अथवा ‘उनके लिए धार्मिकता में घर चुने जाएँगे’।
  rationale: दिए गए पाठ में चयन-सूचक क्रिया को बनाए रखा गया है और possessive तत्व को ‘अपने धर्मीपन’ में व्यक्त किया गया है। इससे घरों के ठोस बिंब को लोगों के अमूर्त चयन में नहीं बदला जाता।
- issue: राजा के ‘घर’ का स्वरूप
  choice: ‘भवन’ द्वारा राजमहल और पवित्र भवन की संभावित दोहरी प्रतिध्वनि खुली रखी गई है।
  alternative: स्पष्ट रूप से ‘महल’ या ‘मन्दिर’ कहना।
  rationale: मूल ‘घर’ किसी एक संस्थागत अर्थ को निश्चित नहीं करता; ‘भवन’ हिन्दी में गरिमापूर्ण है और अतिव्याख्या से बचता है।
