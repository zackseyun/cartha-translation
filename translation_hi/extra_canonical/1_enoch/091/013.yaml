  register: भाषा आधुनिक मानक हिन्दी की, सरल किंतु गरिमापूर्ण रखी गई है। ‘धर्मीपन’, ‘महिमा’ और ‘महान राजा’ दर्शनात्मक शैली को बनाए रखते हैं। पाठ की कठिन व्याकरणिक संरचना और राजा के भवन की धार्मिक पहचान को मुख्य पाठ में निर्णायक रूप से नहीं खोला गया है।
