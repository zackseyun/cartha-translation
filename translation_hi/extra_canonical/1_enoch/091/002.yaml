  text: And after this[a], Methuselah went and called all his brothers to him[b], and gathered his kindred.
translation:
  language: hi
  text: और इसके बाद[a] मतूशेलह गया और उसने अपने सब भाइयों को अपने पास बुलाया, और अपने कुटुम्बियों को इकट्ठा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तब”; मूल अभिव्यक्ति कथा में आगे बढ़ने का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እምኔሁ
  choice: इसके बाद
  rationale: मूल रूप में ‘उससे/वहाँ से’ जैसा भाव है, पर कथा-क्रम में यह समयसूचक संक्रमण है; ‘इसके बाद’ स्वाभाविक और सटीक है।
- source_word: ሖረ
  choice: गया
  rationale: यह सामान्य गति-सूचक क्रिया है; ‘गया’ कथन की सादगी बनाए रखता है।
- source_word: ማቱሳላ
  choice: मतूशेलह
  rationale: नाम का प्रचलित हिन्दी बाइबिलीय रूप चुना गया है।
- source_word: ጸውዖሙ
  choice: बुलाया
  rationale: क्रिया बुलाने या एकत्र होने के लिए पुकारने का अर्थ देती है; ‘बुलाया’ अनावश्यक औपचारिकता जोड़े बिना व्यापक अर्थ सुरक्षित रखता है।
- source_word: ለኵሎሙ አኃዊሁ
  choice: अपने सब भाइयों को
  rationale: मूल पदबंध स्पष्ट पारिवारिक संबंध बताता है; आधुनिक हिन्दी में यही सहज रूप है।
- source_word: ኀቤሁ
  choice: अपने पास
  rationale: यह उसकी ओर अथवा उसकी उपस्थिति में आने का भाव देता है; ‘अपने पास’ हिन्दी में स्वाभाविक है।
- source_word: አስተጋብኦሙ
  choice: इकट्ठा किया
  rationale: कारक भाव लोगों को एक साथ लाने का संकेत देता है; ‘इकट्ठा किया’ सरल और अर्थानुकूल है।
- source_word: ለአዝማዲ ዚአሁ
  choice: अपने कुटुम्बियों को
  rationale: पदबंध रक्त अथवा कुल-संबंधियों को सूचित करता है। ‘कुटुम्बियों’ से ‘भाइयों’ से व्यापक नातेदारी का भाव बना रहता है और ‘परिवार’ की संभावित संकीर्णता से बचा जाता है।
theological_decisions:
- issue: नातेदारी-सूचक शब्दों का दायरा
  choice: ‘भाइयों’ और ‘कुटुम्बियों’ को वास्तविक पारिवारिक संबंधों के रूप में प्रस्तुत किया गया है।
  alternative: ‘भाइयों’ को केवल कुल-सदस्य, व्यापक साथी या आध्यात्मिक समुदाय मानना।
  rationale: स्थानीय शब्दावली और वसीयतनुमा पारिवारिक प्रसंग रूपक या साम्प्रदायिक अर्थ की माँग नहीं करते।
- issue: दूसरे उपवाक्य में दिशा का भाव
  choice: ‘अपने कुटुम्बियों को इकट्ठा किया’
  alternative: ‘अपने कुटुम्बियों को अपने पास इकट्ठा किया’
  rationale: ‘अपने पास’ का स्रोत-पद ኀቤሁ पहले उपवाक्य से जुड़ा है; दूसरे उपवाक्य में इसे दोहराने से मूल में निहित न होने वाला दिशा-सूचक भाव जुड़ जाएगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘कुटुम्बियों’ को ‘रिश्तेदारों’ की तुलना में थोड़ा अधिक साहित्यिक किंतु अब भी सुबोध मानकर चुना गया है।
