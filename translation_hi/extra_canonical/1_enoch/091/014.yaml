base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/014.yaml
  text: And after this[a], in the ninth week, the righteous judgment will be revealed to the whole world, and all the deeds of the wicked will depart from all the earth; and the world will be written down for destruction[d][c][b], and all people will look to the path of uprightness.
translation:
  language: hi
  text: और इसके बाद, नौवें सप्ताह में[a], धर्मपूर्ण न्याय सारे संसार के सामने प्रकट होगा। दुष्टों के सारे काम पूरी पृथ्वी पर से दूर हो जाएँगे; और संसार विनाश के लिए लिख दिया जाएगा[b], और सब लोग सत्यनिष्ठा के मार्ग की ओर देखेंगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘सप्ताह’ सात दिनों का साधारण सप्ताह नहीं, बल्कि पवित्र इतिहास का एक प्रतीकात्मक युग है।
    reason: cultural_note
  - marker: b
    text: यह वाक्य गीज़ में कठिन है। प्राचीन अरामी साक्ष्य के अनुसार इसका अर्थ है कि संसार को विनाश के लिए लिखित रूप में दर्ज किया जाएगा। अन्य संभव अर्थ है, ‘युग के विनाश के लिए लिखा जाएगा।’
    reason: textual_variant
  - marker: c
    text: मूल क्रिया का अर्थ ‘देखना’, ‘ध्यान देना’ या ‘निगाह रखना’ भी हो सकता है; इसलिए यह वाक्य सत्यनिष्ठा के मार्ग की ओर उन्मुख होने का संकेत देता है, पर स्पष्ट रूप से ‘उस पर चलना’ नहीं कहता।
    reason: translation_note
lexical_decisions:
- source_word: በሰንበት ታስዕ
  choice: नौवें सप्ताह में
  rationale: ‘सप्ताहों के दर्शन’ के संदर्भ में ሰንበት सात दिनों का साधारण सप्ताह नहीं, बल्कि पवित्र इतिहास का प्रतीकात्मक कालखंड है; क्रमसूचक ታስዕ इसे नौवाँ बताता है।
- source_word: ኵነኔ ጽድቅ
  choice: धर्ममय न्याय
  rationale: यह पदबंध न्याय और धार्मिकता—दोनों भावों को जोड़ता है। ‘धर्ममय न्याय’ न्यायिक तथा नैतिक बल बनाए रखता है।
- source_word: ትትከሠት
  choice: प्रकट होगा
  rationale: क्रिया के निष्क्रिय/आत्मवाचक भाव को सहज हिन्दी में व्यक्त करता है और प्रकाशनात्मक संदर्भ के अनुकूल है।
- source_word: ለኵሉ ዓለም
  choice: सारे संसार पर
  rationale: यहाँ ዓለም उस समूचे संसार को सूचित करता है जिसके सामने अथवा जिस पर न्याय प्रकट होगा। ‘पर’ न्याय के सार्वभौमिक रूप से प्रकट होने का स्वाभाविक हिन्दी प्रयोग है।
- source_word: ተግባረ ረሲዓን
  choice: दुष्टों के सारे काम
  rationale: यह अनुवाद अमूर्त ‘दुष्टता’ के बजाय मूल के ठोस कर्मों पर बल बनाए रखता है।
- source_word: ይወፅእ እምዲበ ኵሉ ምድር
  choice: पूरी पृथ्वी पर से दूर हो जाएँगे
  rationale: मूल क्रिया का आधारभूत अर्थ निकलना या चले जाना है। ‘दूर हो जाएँगे’ निष्कासन का भाव देता है, पर पूर्ण विनाश को अनावश्यक रूप से नहीं जोड़ता।
- source_word: ይጽሐፍ ለሐጕለ ዓለም
  choice: संसार विनाश के लिए लिख दिया जाएगा
  rationale: प्राचीन अरामी साक्ष्य में ‘संसार’ निष्क्रिय क्रिया का कर्ता है और ‘विनाश के लिए’ उद्देश्यसूचक पदबंध। यह असामान्य प्रकाशनात्मक बिंब—संसार का विनाश के लिए अभिलिखित होना—जानबूझकर सुरक्षित रखा गया है।
- source_word: ይኔጽሩ ለፍኖተ ርትዕ
  choice: खराई के मार्ग की ओर देखेंगे
  rationale: ፍኖተ एकवचन ‘मार्ग’ है। क्रिया देखने, ध्यान देने या निगाह रखने का भाव दे सकती है; ‘की ओर देखेंगे’ आज्ञापालन को मूल से अधिक स्पष्ट किए बिना नैतिक अभिमुखता व्यक्त करता है। ‘खराई’ पहले आए ጽድቅ से शब्दगत भेद भी बनाए रखती है।
theological_decisions:
- issue: ይጽሐፍ ለሐጕለ ዓለም में ‘संसार’ की वाक्यगत भूमिका और विनाश का आशय
  choice: संसार विनाश के लिए लिख दिया जाएगा
  alternative: युग के विनाश के लिए लिखा जाएगा / संसार अनन्त विनाश के लिए दर्ज किया जाएगा
  rationale: गीज़ रूप कठिन है, पर अरामी 4Q212 ‘संसार’ को निष्क्रिय क्रिया का कर्ता मानने का प्रबल प्राचीन साक्ष्य देता है। ‘विनाश’ को ‘अनन्त विनाश’ बनाना मूल से अधिक निश्चित होता; इसलिए असामान्य लेखन-बिंब और आशय की गंभीरता दोनों सुरक्षित रखी गई हैं।
- issue: मनुष्यों का खराई के मार्ग से संबंध
  choice: मार्ग की ओर देखेंगे
  alternative: मार्ग पर चलेंगे / मार्ग का पालन करेंगे
  rationale: मूल क्रिया देखने या ध्यान देने का भाव रखती है। इसे सीधे आज्ञापालन या मार्ग पर चलने के रूप में अनूदित करना कथन को अनावश्यक रूप से अधिक निश्चित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रकाशनात्मक शैली रखी गई है। वाक्य सामान्य पाठक के लिए सुबोध है, जबकि ‘संसार विनाश के लिए लिख दिया जाएगा’ जैसे मूल के कठिन बिंब को सरल व्याख्या से प्रतिस्थापित नहीं किया गया। ‘खराई’ नैतिक सीधेपन का स्वाभाविक हिन्दी शब्द है और ‘धर्ममय न्याय’ से आवश्यक शब्दगत भेद बनाए रखता है।
