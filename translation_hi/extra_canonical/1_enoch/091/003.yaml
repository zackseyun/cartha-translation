base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/003.yaml
  text: 'And he spoke to them all[a], to all the children of righteousness, and said, “Hear, children of Enoch, every word of your father, and listen to the upright words of my mouth; for I speak to you and tell you[c][b], beloved ones: love righteousness and walk in it.”'
translation:
  language: hi
  text: और उसने उन सभी से, अर्थात् धार्मिकता की सभी संतानों से, कहा, “हे हनोक की संतानों, अपने पिता की हर बात सुनो और मेरे मुँह के सीधे वचन सुनो[a]; क्योंकि मैं तुम्हें सुनाता और बताता हूँ[b]। हे प्रिय जनो, धार्मिकता से प्रेम करो और धार्मिकता के मार्ग पर चलो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कठिन गीइज़ पदबंध का अनुवाद यह भी हो सकता है: “मेरे मुँह की वाणी ठीक रीति से सुनो” या “मेरे मुँह के सीधे वचनों को सुनो।”'
    reason: lexical_alternative
  - marker: b
    text: पहली क्रिया का अर्थ “तुम्हें सुनाता हूँ,” “तुम्हारे सामने साक्षी देता हूँ,” या प्रसंगानुसार “तुम्हें समझाता हूँ” भी हो सकता है; उपलब्ध पाठ में कुछ अनिश्चितता है।
    reason: textual_and_lexical_uncertainty
lexical_decisions:
- source_word: ውሉደ ጽድቅ
  choice: धार्मिकता की संतानें
  rationale: यह पदबंध केवल ‘धर्मी बच्चे’ नहीं, बल्कि धार्मिकता से पहचाने जाने वाले समुदाय का पारिवारिक रूपक है; इसलिए मूल की संबंधवाचक संरचना सुरक्षित रखी गई है।
- source_word: ደቂቀ ሄኖክ
  choice: हनोक की संतानें
  rationale: ደቂቀ का अर्थ ‘संतानें/पुत्र’ हो सकता है। ‘संतानें’ लिंग-समावेशी, सहज और मूल के पारिवारिक संबोधन के निकट है; नाम का प्रचलित हिन्दी रूप ‘हनोक’ रखा गया है।
- source_word: ኵሎ ነገረ አቡክሙ
  choice: अपने पिता की हर बात
  rationale: ነገር का अर्थ ‘वचन, बात, कथन’ हो सकता है। ‘हर बात’ आधुनिक हिन्दी में स्वाभाविक है और सम्पूर्ण कथन सुनने की आज्ञा व्यक्त करता है।
- source_word: አጽምኡ ርርትዐ ቃለ አፉየ
  choice: मेरे मुँह की खरी बातों पर ध्यान दो
  rationale: 'यह गीइज़ पदबंध कठिन है: धार्मिकता/सीधाई से जुड़ा शब्द वाणी का विशेषण भी हो सकता है और सुनने की रीति का क्रियाविशेषण भी। मुख्य पाठ में स्वाभाविक हिन्दी दी गई है और दूसरी सम्भावना पादटिप्पणी में सुरक्षित है।'
- source_word: አሰምዕ ... ወእነግረክሙ
  choice: मैं तुम्हें सुनाता और बताता हूँ
  rationale: पहली क्रिया का मूल भाव ‘सुनाना/सुनने देना’ है और दूसरी ‘बताना’ है। दोहरी अभिव्यक्ति मूल के जोर को बनाए रखती है, यद्यपि पाठ-रूप में कुछ अनिश्चितता है।
- source_word: ፍቁራን
  choice: हे प्रियो
  rationale: यह स्नेहपूर्ण सम्बोधन है। ‘हे प्रियो’ गरिमापूर्ण, संक्षिप्त और वर्तमान हिन्दी में बोधगम्य है।
- source_word: ርትዕ ... ባቲ ሑሩ
  choice: धार्मिकता से प्रेम करो और उसी पर चलो
  rationale: ‘चलना’ नैतिक जीवन-पथ का रूपक सुरक्षित रखता है। हिन्दी में ‘उसी पर चलो’ धार्मिकता को मार्ग के रूप में सहजता से व्यक्त करता है।
theological_decisions:
- issue: ጽድቅ/ርትዕ का अनुवाद ‘धार्मिकता’, ‘न्याय’ या ‘खराई’
  choice: धार्मिकता
  alternative: न्याय; खराई; सीधाई
  rationale: यहाँ शब्द मुख्यतः जीवन की नैतिक दशा और मार्ग को सूचित करता है, न कि केवल न्यायिक न्याय को। ‘धार्मिकता’ हनोक-साहित्य की प्रमुख नैतिक पहचान और आचरण—दोनों को बनाए रखती है; कठिन वाणी-संबंधी प्रयोग में ‘खरी’ अधिक स्वाभाविक हिन्दी के लिए चुना गया है।
- issue: ‘उसमें चलो’ के रूपक को कैसे व्यक्त किया जाए
  choice: उसी पर चलो
  alternative: उसी में चलते रहो; उसके अनुसार जीवन बिताओ
  rationale: ‘उसी पर चलो’ मार्ग के मूल रूपक को सुरक्षित रखता है और इसे किसी विशिष्ट सम्प्रदायगत धर्मशास्त्रीय अर्थ में नहीं बाँधता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर संबोधन और नैतिक उपदेश की गरिमा बनाए रखने के लिए ‘हे प्रियो’ तथा ‘उसी पर चलो’ जैसे बाइबिलीय रूपक रखे गए हैं। ‘धार्मिकता की संतानें’ जानबूझकर कुछ औपचारिक रखा गया है, क्योंकि यह हनोक-साहित्य में सामुदायिक पहचान का पदबंध है।
