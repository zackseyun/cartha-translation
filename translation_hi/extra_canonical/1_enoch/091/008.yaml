base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/008.yaml
  text: In those days[a], violence shall be cut off from its roots[d][c][b], and iniquity together with deceit from under heaven.
translation:
  language: hi
  text: उन दिनों[a] हिंसा को उसकी जड़ों से, और अधर्म को छल-कपट समेत आकाश के नीचे से काट डाला जाएगा[b][c][d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उन दिनों’ आसपास के दर्शन में बताए गए कालखंड की ओर संकेत करता है।
    reason: cross_reference
  - marker: b
    text: ‘काट डाला जाएगा’ का अनुवाद ‘अंत कर दिया जाएगा’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘छल-कपट’ वाले गीइज़ शब्द का अर्थ ‘छल,’ ‘धूर्तता’ या संभवतः ‘भ्रष्टता’ हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: मूल में एक ही क्रिया है, जो हिंसा और अधर्म दोनों पर लागू होती है; हिन्दी में इसी कारण दोनों कर्मों को क्रिया से पहले रखा गया है।
    reason: translation_clarity
lexical_decisions:
- source_word: በአማንቱ፡ መዋዕል
  choice: उन दिनों
  rationale: यह पूरा पदबंध गीइज़ में समय-सूचक प्रचलित अभिव्यक्ति है। इससे आसपास के युगदर्शी कालखंड का संकेत बना रहता है और ‘दिन’ को क्रिया का कर्ता मानने वाली गलत व्याख्या से बचा जाता है।
- source_word: ትትገዘም
  choice: काट डाला जाएगा
  rationale: क्रिया में काटने, काटकर अलग करने या अंत कर देने का भाव है। यह चयन जड़ से उन्मूलन की सजीव न्याय-संबंधी छवि बनाए रखता है।
- source_word: ግፍዕ
  choice: हिंसा
  rationale: यहाँ शब्द अन्याय, अत्याचार या हिंसक दुष्टता का बोध करा सकता है। समीक्षित वाक्य-विन्यास और अगले अलग नैतिक संज्ञापद के कारण ‘हिंसा’ उपयुक्त है।
- source_word: እምነ፡ ሥረዊሃ
  choice: उसकी जड़ों से
  rationale: बहुवचन ‘जड़ों’ को बनाए रखकर बुराई के मूलोच्छेद की रूपकात्मक छवि सुरक्षित रखी गई है।
- source_word: ወዓመፃ
  choice: और अधर्म को
  rationale: यह ግፍዕ से अलग दूसरा नैतिक संज्ञापद है; इसे मिलाकर एक ही बुराई नहीं बनाया गया। ‘अधर्म’ व्यापक नैतिक विकृति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ምስለ፡ ጕሕሉት
  choice: छल-कपट समेत
  rationale: ምስለ का साथ या सम्मिलन का भाव ‘समेत’ से व्यक्त होता है। अंतिम संज्ञा का अर्थ छल, कपट या धूर्तता के क्षेत्र में है; युग्मित हिन्दी पद अर्थ को सहज बनाता है।
- source_word: እምታሕተ፡ ሰማይ
  choice: आकाश के नीचे से
  rationale: मूल की ब्रह्मांडीय स्थान-सूचक अभिव्यक्ति को सीधे रखा गया है; यह केवल किसी एक स्थानीय भूभाग तक कथन को सीमित नहीं करती।
theological_decisions:
- issue: बुराई के हटाए जाने का दायरा
  choice: पद को आकाश के नीचे के जगत से हिंसा, अधर्म और छल-कपट के उन्मूलन की युगांतकारी छवि के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल किसी स्थानीय समाज-सुधार या मनुष्य के दिनों के घटाए जाने के रूप में पढ़ना।
  rationale: ‘आकाश के नीचे से’ का व्यापक दायरा और ‘जड़ों से काटने’ की छवि विश्वव्यापी न्याय की ओर संकेत करती है; फिर भी अनुवाद व्याख्यात्मक धर्मसिद्धान्त नहीं जोड़ता।
- issue: एक क्रिया का दोनों उपवाक्यों पर शासन
  choice: हिन्दी में एक ही क्रिया ‘काट डाला जाएगा’ को हिंसा और अधर्म—दोनों पर लागू रखा गया है।
  alternative: दूसरे उपवाक्य में ‘मिटा दिया जाएगा’ जैसी अतिरिक्त क्रिया जोड़ना।
  rationale: मूल पाठ में एक ही व्यक्त क्रिया है। हिन्दी पदक्रम को पुनर्व्यवस्थित करके उस संरचना को स्वाभाविक ढंग से सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर युगदर्शी और न्याय-संबंधी गरिमा बनाए रखती है। ‘जड़ों से काट डाला जाएगा’ और ‘आकाश के नीचे से’ जैसी ठोस छवियाँ मूल के रूपक और ब्रह्मांडीय विस्तार को सुरक्षित रखती हैं।
