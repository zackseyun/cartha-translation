base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/012.yaml
  text: And after this there shall be another week[a], the eighth, of righteousness; and a sword shall be given to it, so that righteous judgment may be carried out against the oppressors[b], and sinners shall be delivered into the hands of the righteous.
translation:
  language: hi
  text: और इसके बाद धार्मिकता का एक और, अर्थात् आठवाँ, सप्ताह होगा[a]; और उसे एक तलवार दी जाएगी, ताकि अत्याचारियों के विरुद्ध धार्मिक न्याय किया जाए, और पापी धर्मियों के हाथों में सौंप दिए जाएँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आठवाँ सप्ताह।” यहाँ ‘सप्ताह’ साधारण पंचांग के सप्ताह नहीं, बल्कि इतिहास के प्रतीकात्मक कालखंड हैं।
    reason: lexical_alternative
  - marker: b
    text: “हाथों में सौंप दिए जाएँ” का अर्थ किसी के अधिकार या नियंत्रण में दे दिया जाना है।
    reason: cultural_note
lexical_decisions:
- source_word: ካልእት
  choice: एक और
  rationale: यह शब्द प्रतीकात्मक सप्ताहों के क्रम में अगले चरण को सूचित करता है; ‘एक और’ स्वाभाविक हिन्दी है और इसे शाब्दिक दूसरा सप्ताह नहीं बनाता।
- source_word: ሳምንት ሰንበት
  choice: सप्ताह होगा—आठवाँ
  rationale: मूल में ‘सप्ताह’ और ‘आठवाँ’ दोनों हैं। हिन्दी में यह क्रम प्रतीकात्मक कालखंड को स्पष्ट रखते हुए स्वाभाविक वाक्य देता है।
- source_word: እንተ ጽድቅ
  choice: धार्मिकता का
  rationale: यह संबंधवाचक पद सप्ताह की विशेषता बताता है। ‘धार्मिकता’ उसी मूल से जुड़े आगामी ‘धर्ममय न्याय’ के साथ अर्थगत संबंध बनाए रखती है।
- source_word: ይትወሀብ ላቲ ሰይፍ
  choice: उसे एक तलवार दी जाएगी
  rationale: स्त्रीलिंगी सर्वनाम का संकेत ‘सप्ताह’ की ओर है। तलवार की प्रलय-दर्शी छवि को बिना रूपकात्मक अर्थ थोपे ज्यों का त्यों रखा गया है।
- source_word: ከመ ይትገበር ኵነኔ ጽድቅ
  choice: ताकि ... धर्ममय न्याय किया जाए
  rationale: ‘ताकि’ उद्देश्य प्रकट करता है और कर्मवाच्य संरचना न्याय के कार्यान्वयन का मूल भाव बचाती है। ‘धर्ममय न्याय’ नैतिक तथा न्यायिक दोनों बल रखता है।
- source_word: እምእለ ይገፍዑ
  choice: अत्याचारियों के विरुद्ध
  rationale: क्रिया हिंसक अन्याय अथवा उत्पीड़न का भाव देती है। न्यायिक संदर्भ में ‘अत्याचारियों’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: ይትሜጠዉ ኃጥኣን በእደዊሆሙ ለጻድቃን
  choice: पापी धर्मियों के हाथों में सौंप दिए जाएँ
  rationale: वाक्यांश धर्मियों के अधिकार या नियंत्रण में दिए जाने का संकेत करता है। ‘हाथों में सौंपना’ मूल की ठोस बाइबलीय छवि बनाए रखता है।
theological_decisions:
- issue: ጽድቅ और ኵነኔ ጽድቅ को धार्मिकता-संबंधी भाषा में रखा जाए या केवल न्याय कहा जाए
  choice: ‘धार्मिकता का’ और ‘धर्ममय न्याय’
  alternative: ‘न्याय का सप्ताह’ और ‘न्यायपूर्ण निर्णय’
  rationale: मूल एक ही अर्थ-क्षेत्र से सप्ताह और उसके भीतर होने वाले न्याय दोनों को जोड़ता है। चुने हुए पद इस विषयगत संबंध को रखते हैं और इसे केवल नागरिक न्याय तक सीमित नहीं करते।
- issue: तलवार की छवि का स्वरूप
  choice: ‘एक तलवार दी जाएगी’ को प्रत्यक्ष प्रलय-दर्शी न्याय-छवि के रूप में रखना
  alternative: ‘न्याय करने का अधिकार दिया जाएगा’ अथवा ‘विजय दी जाएगी’
  rationale: मूल स्पष्टतः ‘तलवार’ कहता है। उसका अर्थ पहले से तय करके छवि को अमूर्त अधिकार या विजय में नहीं बदला गया।
- issue: धर्मियों के हाथों में सौंपे जाने का आशय
  choice: अधिकार में दिए जाने की ठोस मुहावरेदार छवि बनाए रखना
  alternative: ‘धर्मियों के अधीन कर दिए जाएँ’
  rationale: मूल के ‘हाथों में’ को रखने से न्याय और सत्ता की तनावपूर्ण छवि बनी रहती है; अनुवाद यह निर्धारित नहीं करता कि आगे की कार्रवाई का सटीक स्वरूप क्या है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध और हल्की बाइबलीय शैली रखी गई है। ‘धार्मिकता’, ‘धर्मी’ और ‘धर्ममय न्याय’ से मूल की साझा नैतिक शब्दावली का संबंध बचता है। विराम-चिह्न आठवें प्रतीकात्मक सप्ताह की पहचान स्पष्ट करते हैं।
