  yaml_path: translation/extra_canonical/1_enoch/091/004.yaml
  text: And do not draw near to righteousness with a double heart[a], nor join yourselves with those who are of a double heart; but walk in righteousness, my children, and it will lead you on a good path[d][c][b], and righteousness will be your companion.
translation:
  language: hi
  text: और दोहरे हृदय से खराई की ओर न बढ़ो[b], और दोहरे हृदयवालों के साथ न जुड़ो[a]; बल्कि, मेरे बच्चो, धार्मिकता में चलो। वह तुम्हें अच्छे मार्ग पर ले चलेगी[d], और धार्मिकता तुम्हारी साथी होगी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘और दोहरे हृदयवालों के साथ न जुड़ो’ वाला उपवाक्य उपलब्ध इथियोपिक पाठ में कोष्ठकों के भीतर है। यह पाठांतर या बाद का विस्तार हो सकता है, पर पद की समानांतर चेतावनी के अनुकूल होने के कारण यहाँ रखा गया है।
    reason: textual_variant
  - marker: b
    text: ‘दोहरे हृदय’ का शाब्दिक मुहावरा विभाजित निष्ठा या भीतरी कपट को दर्शाता है।
    reason: cultural_note
  - marker: c
    text: या, ‘धार्मिकता तुम्हारे साथ जुड़ी रहेगी’ अथवा ‘तुम्हारी सहभागी होगी’; मूल शब्द संगति, सहभागिता या साथ का भाव दे सकता है।
    reason: lexical_alternative
  - marker: d
    text: शाब्दिक रूप से ‘एक अच्छे मार्ग पर’; यहाँ ‘मार्ग’ एकवचन है। इसके बाद आने वाली ‘धार्मिकता’ अगले वाक्यांश का कर्ता है।
    reason: textual_clarification
lexical_decisions:
- source_word: ርትዕ
  choice: खराई
  rationale: यहाँ शब्द नैतिक सीधेपन और निष्कपटता को व्यक्त करता है। ‘खराई’ बाद में आए ጽድቅ (‘धार्मिकता’) से इसका शब्दगत भेद भी बनाए रखती है।
- source_word: በክልኤ ልብ
  choice: दोहरे हृदय से
  rationale: शाब्दिक बिंब को सुरक्षित रखते हुए यह विभाजित निष्ठा और भीतरी कपट का भाव व्यक्त करता है; अर्थ को केवल आधुनिक मनोवैज्ञानिक भाषा में सीमित नहीं करता।
- source_word: ኢትኅበሩ ምስለ እለ በክልኤ ልብ
  choice: दोहरे हृदयवालों के साथ न जुड़ो
  rationale: यह वाक्यांश ऐसे लोगों से संगति या संबंध जोड़ने की मनाही करता है और मूल के सामाजिक भाव को सहज हिन्दी में रखता है।
- source_word: ሑሩ በጽድቅ
  choice: धार्मिकता में चलो
  rationale: नैतिक आचरण के लिए प्रयुक्त ‘चलने’ का मार्ग-बिंब आगे आने वाले अच्छे मार्ग से स्वाभाविक रूप से जुड़ता है।
- source_word: ደቂቅየ
  choice: मेरे बच्चो
  rationale: यह आत्मीय, पारिवारिक और शिक्षाप्रद संबोधन है; आधुनिक हिन्दी में स्वाभाविक और समावेशी है।
- source_word: ትመርሐክሙ በፍኖት ኄርት
  choice: वह तुम्हें अच्छे मार्ग पर ले चलेगी
  rationale: एकवचन ፍኖት को ‘मार्ग’ और ኄርት को ‘अच्छे’ के रूप में लिया गया है। स्त्रीलिंग ‘वह’ निकटवर्ती ‘धार्मिकता’ की ओर संकेत करती है।
- source_word: ወጽድቅ ይከውን ለክሙ ሱታፌ
  choice: और धार्मिकता तुम्हारी संगिनी होगी
  rationale: ሱታፌ में सहभागिता, साथ और संगति का भाव है। ‘संगिनी’ मूल की साथ चलने वाली नैतिक शक्ति की सजीव छवि को स्वाभाविक हिन्दी में बनाए रखती है।
theological_decisions:
- issue: विभाजित निष्ठा के मुहावरे का अनुवाद
  choice: दोहरे हृदय से / दोहरे हृदयवाले
  alternative: दुविधाग्रस्त मन से / दो मनवाले
  rationale: ‘हृदय’ को बनाए रखने से मूल का नैतिक और मानवीय बिंब सुरक्षित रहता है तथा विभाजित निष्ठा और कपट दोनों की संभावनाएँ खुली रहती हैं।
- issue: कोष्ठकबद्ध उपवाक्य को मुख्य पाठ में रखना या हटाना
  choice: मुख्य पाठ में रखा गया और पादटिप्पणी में उसकी पाठगत स्थिति बताई गई
  alternative: इसे बाद का विस्तार मानकर मुख्य पाठ से हटाना
  rationale: दिया गया इथियोपिक साक्ष्य इस उपवाक्य को कोष्ठकों में प्रस्तुत करता है। यह समानांतर चेतावनी के अनुकूल है, पर इसकी अनिश्चित स्थिति को छिपाना उचित नहीं।
- issue: मार्ग और धार्मिकता के बीच वाक्य-विभाजन
  choice: ‘अच्छे मार्ग’ पर वाक्य समाप्त करके ‘धार्मिकता’ को अगले खंड का कर्ता माना गया
  alternative: ‘अच्छे और धार्मिक मार्गों’ के रूप में संयुक्त पद
  rationale: ፍኖት ኄርት एकवचन ‘अच्छा मार्ग’ है; इसके बाद का ወጽድቅ अगले खंड में ‘धार्मिकता’ के रूप में कर्ता बनता है। इससे शब्द की पुनरावृत्ति और संगिनी का बिंब दोनों सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु उपदेशात्मक गरिमा और मूल के मार्ग, हृदय तथा संगिनी जैसे बिंब सुरक्षित रखे गए हैं। ‘खराई’ और ‘धार्मिकता’ अलग मूल शब्दों का भेद बनाए रखते हैं; वाक्य-विन्यास साधारण पाठक के लिए स्पष्ट रखा गया है।
