base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/007.yaml
  text: And when sin and transgression and blasphemy and violence increase in every deed, and lawlessness and wrongdoing and uncleanness increase, a great punishment will come from heaven upon them all, and the Holy Lord will come forth in wrath and in punishment, to execute judgment upon the earth.
translation:
  language: hi
  text: और जब[b] हर काम में पाप, विद्रोह, परमेश्वर की निन्दा और हिंसा बढ़ेगी, और अधर्म, दुष्कर्म और अशुद्धता बढ़ेंगे, तब उन सब पर स्वर्ग से एक बड़ा दण्ड[a] आएगा; और पवित्र प्रभु क्रोध और दण्ड के साथ पृथ्वी पर न्याय करने के लिए निकलेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक बड़ी विपत्ति” अथवा “एक बड़ी महामारी”; गीइज़ शब्द दण्ड के साथ-साथ दण्डकारी कष्ट को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: आरम्भिक गीइज़ पद का अनुवाद “और यदि ... तो” भी किया जा सकता है।
    reason: grammatical_alternative
lexical_decisions:
- source_word: ወእመኒ
  choice: और जब
  rationale: आरम्भिक अधीनतासूचक पद को बनाए रखता है और बढ़ती बुराई तथा आने वाले दण्ड के बीच कालगत-परिणामात्मक सम्बन्ध व्यक्त करता है।
- source_word: ትልህቅ / ትለህቅ
  choice: बढ़ेगी / बढ़ेंगे
  rationale: दोहराई गई क्रिया बुराइयों की वृद्धि दिखाती है; हिन्दी में वचन के अनुसार रूप बदला गया है।
- source_word: ኃጢአት
  choice: पाप
  rationale: नैतिक और धार्मिक दोष के लिए मानक तथा स्वाभाविक हिन्दी शब्द।
- source_word: ዓመፃ
  choice: विद्रोह
  rationale: यह व्यवस्था और उचित शासन के विरुद्ध उठने का भाव रखता है तथा सूची के अन्य नैतिक शब्दों से भेद बनाए रखता है।
- source_word: ጽርፈት
  choice: परमेश्वर की निन्दा
  rationale: सामान्य अपमान की अपेक्षा ईश्वर-विरोधी निन्दात्मक वाणी का आशय स्पष्ट करता है।
- source_word: ግፍዕ
  choice: हिंसा
  rationale: क्रूर अन्याय और उत्पीड़क आचरण की सशक्त, संक्षिप्त अभिव्यक्ति।
- source_word: በኵሉ ተግባር
  choice: हर काम में
  rationale: बुराई के समस्त आचरण में व्याप्त होने का वितरणात्मक अर्थ सहज आधुनिक हिन्दी में रखता है।
- source_word: ዕልወት
  choice: अधर्म
  rationale: व्यवस्था-विरोधी और धार्मिक-नैतिक भ्रष्टता दोनों के लिए उपयुक्त व्यापक शब्द।
- source_word: አበሳ
  choice: दुष्कर्म
  rationale: पाप और विद्रोह से अलग, व्यापक गलत आचरण का भाव बनाए रखता है।
- source_word: ርኵስ
  choice: अशुद्धता
  rationale: नैतिक तथा सम्भावित धार्मिक/अनुष्ठानिक अपवित्रता, दोनों अर्थों के लिए खुला रहता है।
- source_word: መቅሠፍት ዐቢይ
  choice: एक बड़ा दण्ड
  rationale: न्याय के निकट सन्दर्भ में दण्डात्मक अर्थ प्रमुख है; महामारी या विपत्ति की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: ይከውን እምሰማይ ዲበ እሉ ኵሎሙ
  choice: उन सब पर स्वर्ग से ... आएगा
  rationale: स्वर्गीय उद्गम और सभी दोषियों पर आने वाले परिणाम, दोनों को स्वाभाविक हिन्दी क्रम में व्यक्त करता है।
- source_word: እግዚእ ቅዱስ
  choice: पवित्र प्रभु
  rationale: पवित्रता और प्रभुता दोनों को संक्षिप्त ईश्वरीय उपाधि के रूप में रखता है।
- source_word: በመዓት ወበመቅሠፍት
  choice: क्रोध और दण्ड के साथ
  rationale: दोनों समानान्तर संज्ञाओं को अलग रखते हुए दैवी आगमन के न्यायकारी स्वरूप को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ይግበር ኵነኔ ዲበ ምድር
  choice: पृथ्वी पर न्याय करने के लिए
  rationale: पृथ्वी पर न्याय लागू करने के उद्देश्य को स्पष्ट और स्रोत-संगत रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय उपाधि እግዚእ ቅዱስ
  choice: पवित्र प्रभु
  alternative: प्रभु, वह पवित्र जन
  rationale: इसे संक्षिप्त उपाधि मानना गीइज़ पदक्रम को निकटता से रखता है और किसी बाद की निश्चित धार्मिक पदावली को आरोपित नहीं करता।
- issue: መቅሠፍት का अर्थ
  choice: दण्ड
  alternative: महामारी; विपत्ति; कोड़ा
  rationale: स्पष्ट न्याय-सन्दर्भ के कारण दण्ड प्राथमिक है, पर दण्डकारी विपत्ति या महामारी का अर्थ पादटिप्पणी में खुला रखा गया है।
- issue: आरम्भिक ወእመኒ का सम्बन्ध
  choice: और जब ... तब
  alternative: और यदि ... तो
  rationale: वचन बढ़ती बुराई को आने वाले दैवी दण्ड की परिस्थिति के रूप में प्रस्तुत करता है; कालगत अर्थ यहाँ अधिक स्वाभाविक है, जबकि शर्तात्मक सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण अपोकैलिप्टिक शैली रखी गई है। नैतिक दोषों की सूची में सम्भव सीमा तक अलग-अलग अर्थ बनाए गए हैं। “निकलेंगे” के आदरसूचक बहुवचन से ईश्वरीय कर्ता के लिए स्वाभाविक हिन्दी सम्मान व्यक्त होता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
