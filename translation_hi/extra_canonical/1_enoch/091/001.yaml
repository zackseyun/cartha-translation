base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/001.yaml
  text: And now[a], my son Methuselah, call all your brothers to me, and gather to me all the children of your mother; for a word calls me, and a spirit of uprightness is poured out upon me[d][c][b], so that I may show you everything that will come upon you forever.
translation:
  language: hi
  text: और अब, मेरे पुत्र मतूशेलह, अपने सब भाइयों को मेरे पास बुला और अपनी माता की सब सन्तानों को मेरे पास इकट्ठा कर; क्योंकि एक वचन मुझे बुला रहा है, और एक आत्मा मुझ पर उँडेली गई है[a], ताकि मैं तुम्हें वह सब दिखाऊँ जो सदा तक तुम पर आने वाला है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आत्मा’ को यहाँ किसी विशिष्ट दिव्य आत्मा के रूप में भी समझा जा सकता है; मूल पाठ यह निश्चित नहीं करता कि आशय ‘एक आत्मा’ है या ‘वह आत्मा’।
    reason: theological_ambiguity
  - marker: b
    text: अन्तिम पद का अनुवाद ‘अनन्तकाल तक’, ‘सब युगों तक’ या ‘आने वाली पीढ़ियों के लिए’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: और अब
  rationale: यह हनोक के कथन का सीधा संक्रमण है और मूल की तात्कालिकता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ወልድየ ማቱሳላ
  choice: मेरे पुत्र मतूशेलह
  rationale: पितृसुलभ सम्बोधन को गरिमापूर्ण आधुनिक हिन्दी में रखा गया है और नाम का प्रचलित देवनागरी लिप्यन्तरण अपनाया गया है।
- source_word: ጸውዕ ሊተ ... ወአስተጋብእ ሊተ
  choice: मेरे पास बुला ... मेरे पास इकट्ठा कर
  rationale: 'दोनों आदेशों का अन्तर सुरक्षित है: पहला बुलाने और दूसरा सबको हनोक की उपस्थिति में एकत्र करने को कहता है।'
- source_word: ኵሎ ደቂቀ እምከ
  choice: अपनी माता की सब सन्तानों
  rationale: ደቂቀ का अर्थ ‘सन्तान/बच्चे’ है; इसे केवल ‘पुत्र’ कहना अनावश्यक रूप से अर्थ को सीमित करता।
- source_word: እስመ ቃል ይጼውዐኒ
  choice: क्योंकि एक वचन मुझे बुला रहा है
  rationale: मूल में वचन का स्रोत स्पष्ट नहीं है। ‘एक वचन’ उस प्रकाशनात्मक किंतु अनिर्दिष्ट भाव को बनाए रखता है।
- source_word: መንፈስ ትክዕወት ላዕሌየ
  choice: एक आत्मा मुझ पर उँडेली गई है
  rationale: ትክዕወት को ‘उँडेली गई है’ अर्थ वाले क्रियारूप के रूप में लिया गया है, न कि ‘सीधाई/धार्मिकता’ अर्थ वाले संज्ञापद के रूप में। यह मूल की प्रेरणात्मक छवि को सुरक्षित रखता है।
- source_word: ኵሎ ዘይበጽሐክሙ እስከ ለዓለም
  choice: वह सब ... जो सदा तक तुम पर आने वाला है
  rationale: ይበጽሐክሙ में पहुँचने या आ पड़ने का भाव है; ‘तुम पर आने वाला है’ भविष्यवाणी की गम्भीरता बनाए रखता है। अन्तिम कालवाचक पद को मुख्य पाठ में संक्षेपतः ‘सदा तक’ कहा गया है।
theological_decisions:
- issue: क्या መንፈስ किसी निश्चित और व्यक्तिवाची दिव्य आत्मा को दर्शाता है
  choice: एक आत्मा
  alternative: आत्मा / वह आत्मा
  rationale: गीज़ पद स्वयं यहाँ निश्चितता या व्यक्तित्व को निर्विवाद रूप से स्थापित नहीं करता। इसलिए मुख्य पाठ अनिश्चित रूप रखता है और अधिक व्यक्तिवाची सम्भावना को टिप्पणी में स्वीकार करता है।
- issue: क्या ትክዕወት का अर्थ नैतिक ‘सीधाई’ है या ‘उँडेली गई’ क्रिया
  choice: उँडेली गई है
  alternative: सीधाई की आत्मा
  rationale: रूप और वाक्यरचना इसे स्त्रीलिंग एकवचन पूर्ण क्रिया के रूप में समर्थित करते हैं, जो መንፈስ के साथ जुड़कर आत्मा के उँडेले जाने को व्यक्त करती है; ‘सीधाई’ अर्थ यहाँ स्रोत-सम्मत नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पारिवारिक शब्दावली को ठोस रूप में बनाए रखा गया है। ‘वचन’ और ‘आत्मा’ की प्रकाशनात्मक गम्भीरता सुरक्षित है, पर मूल से अधिक निश्चित धार्मिक पहचान आरोपित नहीं की गई।
