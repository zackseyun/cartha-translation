theological_decisions:
- issue: क्या बुराई केवल बनी रहती है, या न्याय से पहले अपनी पूरी सीमा तक पहुँचती है?
  choice: हिंसक अन्याय के बने रहने, अधर्मता के अपनी पूरी सीमा तक पहुँचने और फिर जड़ से काटे जाने—तीनों चरणों को रखा गया है।
  alternative: बुराई को किसी अंतराल के बिना तत्काल नष्ट होते हुए प्रस्तुत करना।
  rationale: गीज़ क्रियाओं का क्रम निरंतरता, पूर्णता और फिर उन्मूलन का तनाव रखता है; अनुवाद इसे किसी एक व्यवस्थित धार्मिक निष्कर्ष में नहीं समेटता।
