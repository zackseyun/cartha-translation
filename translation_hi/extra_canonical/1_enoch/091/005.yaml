  register: आधुनिक मानक हिन्दी में गंभीर, भविष्यवाणी-संबंधी लहजा रखा गया है। वाक्य सहज है, पर मूल का क्रम और उसकी धार्मिक अस्पष्टता सुरक्षित हैं। फुटनोट-चिह्न उन्हीं शब्दों के बाद रखे गए हैं जिनकी वे व्याख्या करते हैं।
