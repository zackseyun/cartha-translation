base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/005.yaml
  text: For I know that violence will endure upon the earth[a], and a great scourge will be carried out upon the earth; and all lawlessness will be brought to completion and be cut off from its roots[c][b], and every structure will pass away.
translation:
  language: hi
  text: क्योंकि मैं जानता हूँ कि पृथ्वी पर हिंसक अन्याय बना रहेगा, और पृथ्वी पर एक बड़ा दंडात्मक प्रकोप[a] बरपाया जाएगा; सारी अधर्मता अपनी पूरी सीमा तक पहुँचेगी[b] और अपनी जड़ों से काट दी जाएगी, और हर संरचना[c] मिट जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसके अनुवाद ‘एक बड़ी महामारी’, ‘एक बड़ी विपत्ति’ या ‘एक बड़ा दंड’ भी हो सकते हैं; गीज़ शब्द दंडस्वरूप आने वाले व्यापक कष्ट या प्रकोप को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अपनी पूरी सीमा तक पहुँचेगी’ का अर्थ यह हो सकता है कि न्याय आने से पहले अधर्मता अपना पूरा माप भर लेगी; इसका आशय अधर्मता की स्वीकृति या स्थापना नहीं है।
    reason: alternative_reading
  - marker: c
    text: ‘हर संरचना’ का अधिक ठोस अनुवाद ‘हर भवन’ भी हो सकता है; व्यापक शब्दावली सभी मानवीय निर्माणों या स्थापित व्यवस्थाओं को भी समेट सकती है।
    reason: lexical_alternative
