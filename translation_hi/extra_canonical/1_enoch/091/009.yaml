  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। ‘कोप’, ‘प्रबल न्याय’ और ‘अग्नि के न्याय’ जैसे पद प्रलयकारी शैली की गंभीरता बनाए रखते हैं। उपलब्ध लिप्यंतरण में पहचानी गई गंभीर OCR-पाठ-विकृतियों को नवीन पाठ-समीक्षात्मक सूचना के आधार पर सुधारा गया है और जहाँ आवश्यक है वहाँ पादटिप्पणियों में पारदर्शी बनाया गया है।
