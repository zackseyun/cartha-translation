base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/009.yaml
  text: And all will be given over with the nations[a], and the towers will be burned with fire; and they will be removed from all the earth, and they will be cast into the judgment of fire[d][c][b], and they will perish in wrath and in mighty judgment forever.
translation:
  language: hi
  text: सारी मूर्तियाँ जातियों के साथ फेंक दी जाएँगी[a], और मंदिर[b] आग से जला दिए जाएँगे; उन्हें सारी पृथ्वी से निकाल दिया जाएगा और अग्नि के न्याय में डाल दिया जाएगा। वे कोप और प्रबल न्याय में सदा के लिए नष्ट हो जाएँगे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जातियों के साथ” का अर्थ प्रसंग के अनुसार “जातियों के बीच” भी हो सकता है। उपलब्ध प्रतिलिपि में इस खंड के कुछ अक्षर विकृत हैं; मानक पाठ में यहाँ “सारी मूर्तियाँ फेंक दी जाएँगी” पढ़ा जाता है।
    reason: textual_and_lexical_alternative
  - marker: b
    text: “मंदिर” के लिए प्रयुक्त गीज़ शब्द का अनुवाद “मीनारें” भी किया जा सकता है। उपलब्ध प्रतिलिपि का रूप पाठ-विकृति प्रतीत होता है।
    reason: textual_and_lexical_alternative
  - marker: c
    text: “सदा के लिए” यहाँ युगांतकारी न्याय की स्थायी अंतिमता बताता है। यह पद अपने आप दंड की दशा के विषय में किसी बाद की अधिक विशिष्ट धर्मवैज्ञानिक व्यवस्था को परिभाषित नहीं करता।
    reason: theological_tension
lexical_decisions:
- source_word: ጣዖት፡ ይትገደፍ
  choice: मूर्तियाँ ... फेंक दी जाएँगी
  rationale: चार्ल्स के मानक पाठ और उपलब्ध पाठ-समीक्षात्मक संशोधन में लुप्त/विकृत पद का अर्थ ‘मूर्तियाँ फेंक दी जाएँगी’ है। न्यायसूचक निष्क्रिय क्रिया को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: ምስለ፡ አሕዛብ
  choice: जातियों के साथ
  rationale: ምስለ का सामान्य अर्थ ‘के साथ’ है। ‘जातियाँ’ इस न्याय-दृश्य में जातीय अथवा बाद की ईसाई शब्दावली का अनावश्यक रंग नहीं जोड़ता।
- source_word: ማኅፈድ
  choice: मंदिर
  rationale: पाठ-समीक्षात्मक रूप ማኅፈድ को उपासना-स्थल के अर्थ में लिया गया है; प्रसंग में मूर्तियों के साथ इसका संबंध स्वाभाविक है। ‘मीनारें’ भी संभव शब्दार्थ है, इसलिए इसे पादटिप्पणी में रखा गया है।
- source_word: በእሳት፡ ትነድድ
  choice: आग से जला दिए जाएँगे
  rationale: अग्निमय विनाश की छवि और निष्क्रिय भाव दोनों को सहज हिन्दी में सुरक्षित रखा गया है।
- source_word: ይወፅእዎሙ፡ እምኵሉ፡ ምድር
  choice: उन्हें सारी पृथ्वी से निकाल दिया जाएगा
  rationale: क्रिया के निष्कासनकारी अर्थ और सर्वव्यापी ‘सारी पृथ्वी’ को बनाए रखा गया है। सर्वनाम का संदर्भ मूल की तरह पूरी तरह निर्धारित नहीं किया गया।
- source_word: በኵነኔ፡ እሳት
  choice: अग्नि के न्याय में
  rationale: संबंधवाची न्यायसूचक संरचना को ‘अग्निमय न्याय’ बनाकर अत्यधिक सरल नहीं किया गया।
- source_word: ይትሐጐሉ፡ በመዓት፡ ወበኵነኔ፡ ኃያል
  choice: कोप और प्रबल न्याय में ... नष्ट हो जाएँगे
  rationale: विनाश, कोप और सामर्थ्यवान न्याय की क्रमिक प्रलयकारी भाषा को सुरक्षित रखा गया है।
- source_word: እንተ፡ ለዓለም
  choice: सदा के लिए
  rationale: यह स्वाभाविक हिन्दी में स्थायी युगांतकारी अंतिमता व्यक्त करता है, पर दंड की प्रकृति के विषय में बाद की कोई विशिष्ट धर्मवैज्ञानिक प्रणाली आरोपित नहीं करता।
theological_decisions:
- issue: दोषी समूह और अंतिम न्याय की अवधि
  choice: पद को मूर्तियों, जातियों और उनसे जुड़े उपासना-स्थलों पर आने वाले स्थायी युगांतकारी न्याय के रूप में प्रस्तुत किया गया है।
  alternative: भाषा को अतिशयोक्तिपूर्ण विनाश-चित्र अथवा ‘युग भर’ रहने वाली अंतिमता के रूप में समझा जा सकता है, बिना अनंत सचेत यातना की किसी बाद की व्यवस्थित धारणा को निश्चित किए।
  rationale: मूल में निष्कासन, अग्नि, कोप, प्रबल न्याय और ‘सदा के लिए’ की अभिव्यक्तियाँ एकत्र हैं। अनुवाद उनकी पूरी शक्ति रखता है, पर उनसे अधिक सिद्धांत निर्धारित नहीं करता।
- issue: बहुवचन सर्वनाम का संदर्भ
  choice: ‘उन्हें/वे’ रखकर संदर्भ की संभावित व्यापकता सुरक्षित रखी गई है।
  alternative: सर्वनाम को केवल जातियों, केवल मूर्तियों अथवा मंदिरों सहित पूरे पूर्ववर्ती समूह पर लागू किया जा सकता है।
  rationale: गीज़ वाक्यक्रम संदर्भ को पूरी तरह स्पष्ट नहीं करता; किसी एक समूह का नाम दोहराने से मूल की वास्तविक अस्पष्टता मिट जाती।
