  yaml_path: translation/extra_canonical/1_enoch/051/001.yaml
  text: And in those days the earth will give back from its womb[c][b][a], and Sheol will give back what it has received, .
translation:
  language: hi
  text: और उन दिनों पृथ्वी अपने भीतर रखा हुआ लौटा देगी[a], और अधोलोक[b] जो उसे सौंपा गया है वह लौटा देगा, और विनाश अपना बकाया चुकाएगा। वह उनमें से धर्मियों और पवित्र लोगों को चुन लेगा, क्योंकि वह दिन निकट आ गया है जब उनका उद्धार होगा। उन दिनों चुना हुआ जन अपने सिंहासन पर बैठेगा[c], और उसके मुख के विचार से बुद्धि के सभी रहस्य प्रकट होंगे; क्योंकि आत्माओं के प्रभु ने उसे ये दिए हैं और उसे महिमा दी है। उन दिनों पर्वत मेढ़ों के समान उछलेंगे, और पहाड़ियाँ दूध से तृप्त मेमनों के समान कूदेंगी; और वे सब स्वर्ग में स्वर्गदूत बनेंगे। उनके चेहरे आनंद से चमक उठेंगे, क्योंकि उन दिनों चुना हुआ जन उठ खड़ा हुआ है। पृथ्वी आनंदित होगी; धर्मी उस पर निवास करेंगे, और चुने हुए उसमें चलेंगे और विचरेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अपने भीतर रखा हुआ’ के पीछे का गीइज़ शब्द विवादित है। इसका अर्थ ‘कोख/भीतरी भंडार’ अथवा ‘उसके पास जमा या उसे सौंपी हुई वस्तु’ समझा जा सकता है। अनुवाद दोनों संभावनाओं को खुला रखता है।
    reason: lexical_ambiguity
  - marker: b
    text: ‘अधोलोक’ प्राचीन यहूदी धारणा में मृतकों का लोक है; यहाँ इसका अर्थ अनिवार्य रूप से बाद की ‘नरक’ की धारणा नहीं है।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से ‘उसके सिंहासन पर’। कुछ अनुवाद-परंपराओं में ‘मेरे सिंहासन पर’ मिलता है, पर प्रस्तुत गीइज़ पाठ ‘उसका/अपना’ पढ़ता है।
    reason: textual_tradition
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: उन दिनों
  rationale: यह सर्वनाश-साहित्य की मानक कालसूचक अभिव्यक्ति है; ‘दिनों’ से मूल की दोहराई हुई लय बनी रहती है।
- source_word: ማሕፀንታ
  choice: अपनी कोख में रखा हुआ / उसे सौंपा गया धन
  rationale: रूप की व्याख्या ‘कोख/भीतरी भंडार’ और ‘जमा या सौंपी हुई वस्तु’—दोनों दिशाओं में हुई है। समानांतर वाक्यों के निक्षेप-वापसी भाव को रखते हुए पृथ्वी के लिए सजीव ‘कोख’ और अधोलोक के लिए ‘सौंपा गया धन’ चुना गया है; अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: ሲኦል
  choice: अधोलोक
  rationale: आधुनिक हिन्दी पाठक के लिए यह मृतकों के प्राचीन लोक का अर्थ स्पष्ट करता है और इसे बाद की ‘नरक’ संबंधी धारणा से नहीं मिलाता।
- source_word: ሀጕል
  choice: विनाश
  rationale: मूल में पृथ्वी और अधोलोक के साथ एक तीसरी सत्ता है जो अपना बकाया लौटाती है; ‘विनाश’ उसके अमूर्त और काव्यात्मक स्वरूप को बनाए रखता है।
- source_word: ኅሩይ
  choice: चुना हुआ जन
  rationale: यह एक विशिष्ट चुने हुए व्यक्ति के लिए प्रयुक्त पद है; ‘जन’ स्वाभाविक हिन्दी देता है, पर उसकी पहचान को किसी बाद की निश्चित उपाधि से नहीं बाँधता।
- source_word: እግዚአ መናፍስት
  choice: आत्माओं के प्रभु
  rationale: यह पुस्तक की विशिष्ट ईश्वरीय उपाधि का सीधा और प्रतिष्ठित हिन्दी रूप है।
- source_word: ያንሶስዉ
  choice: विचरेंगे
  rationale: अंतिम क्रिया चलने-फिरने या घूमने का भाव देती है; निकटवर्ती ‘चलेंगे’ के साथ ‘विचरेंगे’ उसके विस्तार को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ሲኦል का अर्थ
  choice: अधोलोक
  alternative: शीओल / कब्र / नरक
  rationale: यहाँ मृतकों को अपने भीतर रखने और फिर लौटा देने वाला लोक अभिप्रेत है। ‘अधोलोक’ इस प्राचीन अवधारणा को संप्रेषित करता है, जबकि ‘नरक’ दंडस्थान का बाद का अर्थ अनावश्यक रूप से जोड़ सकता है।
- issue: चुने हुए जन के सिंहासन का संबंध
  choice: अपने सिंहासन पर
  alternative: उसके सिंहासन पर / मेरे सिंहासन पर
  rationale: प्रस्तुत गीइज़ पाठ መንበሩ (‘उसका/अपना सिंहासन’) पढ़ता है; इसलिए उपलब्ध मूल-पाठ के व्याकरण को रखा गया है और ‘मेरे सिंहासन’ वाली अनुवाद-परंपरा नहीं अपनाई गई।
- issue: मृतकों की वापसी की छवि
  choice: पृथ्वी, अधोलोक और विनाश अपने पास रखा हुआ लौटाते हैं
  alternative: स्पष्ट रूप से ‘मृतकों का पुनरुत्थान’ कहना
  rationale: संदर्भ पुनरुत्थान की ओर संकेत करता है, पर मूल इसे भंडारों द्वारा अपना निक्षेप लौटाने की काव्यात्मक छवि में कहता है। अनुवाद ने उस संकेत को स्पष्ट सिद्धांत-वाक्य में नहीं बदला।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। स्रोत में दिए पूरे भविष्यवाणी-वचन का अनुवाद किया गया है, क्योंकि उपलब्ध गीइज़ पाठ केवल आरंभिक खंड नहीं बल्कि आगे की पंक्तियाँ भी समाहित करता है। मूल की समानांतर रचना, बार-बार आने वाला ‘उन दिनों’, और सर्वनाश-साहित्य की सजीव उपमाएँ बनाए रखी गई हैं।
