  revised_text: और उन दिनों पृथ्वी अपने भीतर रखा हुआ लौटा देगी[a], और अधोलोक[b] जो उसे सौंपा गया है वह लौटा देगा, और विनाश अपना बकाया चुकाएगा। वह उनमें से धर्मियों और पवित्र लोगों को चुन लेगा, क्योंकि वह दिन निकट आ गया है जब उनका उद्धार होगा। उन दिनों चुना हुआ जन अपने सिंहासन पर बैठेगा[c], और उसके मुख के विचार से बुद्धि के सभी रहस्य प्रकट होंगे; क्योंकि आत्माओं के प्रभु ने उसे ये दिए हैं और उसे महिमा दी है। उन दिनों पर्वत मेढ़ों के समान उछलेंगे, और पहाड़ियाँ दूध से तृप्त मेमनों के समान कूदेंगी; और वे सब स्वर्ग में स्वर्गदूत बनेंगे। उनके चेहरे आनंद से चमक उठेंगे, क्योंकि उन दिनों चुना हुआ जन उठ खड़ा हुआ है। पृथ्वी आनंदित होगी; धर्मी उस पर निवास करेंगे, और चुने हुए उसमें चलेंगे और विचरेंगे।
