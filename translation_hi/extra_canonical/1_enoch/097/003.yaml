base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/003.yaml
  text: What will you do[a], you sinners, and where will you flee on that day of judgment[b], when you hear the voice of the prayer of the righteous?
translation:
  language: hi
  text: हे पापियो, तुम क्या करोगे और न्याय के उस दिन[a] कहाँ भागोगे, जब तुम धर्मियों की प्रार्थना की आवाज़[b] सुनोगे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘संकट के उस दिन’ अथवा ‘दंड के उस दिन’। मूल शब्द न्याय से जुड़े दंडात्मक संकट का अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘धर्मियों की प्रार्थना की वाणी’। गीइज़ शब्द का अर्थ ‘आवाज़’, ‘वाणी’ या ‘शब्द’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ምንተ፡ ትገብሩ
  choice: तुम क्या करोगे
  rationale: प्रश्नवाचक पद और बहुवचन अपूर्ण क्रिया इस न्याय-संदर्भ में भविष्य की चुनौती व्यक्त करते हैं।
- source_word: ኃጥኣን
  choice: हे पापियो
  rationale: प्रत्यक्ष संबोधन को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: አይቴ፡ ትጐይዩ
  choice: कहाँ भागोगे
  rationale: क्रिया शीघ्र गति या पलायन का बोध देती है; आसन्न न्याय के संदर्भ में ‘भागोगे’ स्वाभाविक है।
- source_word: በይእቲ፡ ዕለት
  choice: उस दिन
  rationale: मूल का संकेतवाचक और कालगत प्रयोग ज्यों का त्यों रखा गया है।
- source_word: እንተ፡ ጽነፄ
  choice: न्याय के
  rationale: यहाँ शब्द दंडात्मक संकट या न्यायिक प्रतिफल की ओर संकेत करता है; मुख्य पाठ में ‘न्याय’ सर्वाधिक उपयुक्त है, जबकि व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ሶበ፡ ትሰምዑ
  choice: जब तुम ... सुनोगे
  rationale: कालवाचक उपवाक्य और उसका भविष्य-बोध आधुनिक हिन्दी में सहज रूप से व्यक्त किया गया है।
- source_word: ቃለ፡ ጸሎቶሙ፡ ለጻድቃን
  choice: धर्मियों की प्रार्थना की आवाज़
  rationale: ቃል का अर्थ ‘आवाज़’, ‘वाणी’ या ‘शब्द’ हो सकता है। प्रार्थना के साथ ‘आवाज़’ स्वाभाविक है और उसे केवल निराकार ध्वनि बनाने से बचाती है; मूल की शाब्दिक अनिश्चितता पादटिप्पणी में दी गई है।
theological_decisions:
- issue: न्याय के दृश्य में धर्मियों की प्रार्थना का आशय
  choice: पापी धर्मियों की प्रार्थना की आवाज़ सुनते हैं; यह न्याय के समय होने वाले उलटाव का अंग है।
  alternative: इसे धर्मियों की पुकार, आरोप या गवाही के व्यापक संकेत के रूप में समझा जा सकता है।
  rationale: मूल पाठ स्पष्ट रूप से ‘प्रार्थना’ कहता है। इसलिए स्वर्गीय न्याय के लिए धर्मियों की विनती को बनाए रखा गया है, पर किसी बाद की धर्मवैज्ञानिक रूपरेखा को इसमें नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भविष्यवाणी-संबंधी चेतावनी का गंभीर किंतु सामान्य पाठकों के लिए सहज स्वर। ‘हे पापियो’ प्रत्यक्ष संबोधन को और ‘धर्मी’ नैतिक-न्यायिक श्रेणी को बनाए रखता है।
