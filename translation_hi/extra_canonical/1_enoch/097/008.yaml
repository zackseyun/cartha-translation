base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/008.yaml
  text: Woe to you who acquire silver and gold not by righteousness[a], and say, ‘We have become rich with wealth, and we have acquired possessions[c][b], and we have acquired everything we desired.’
translation:
  language: hi
  text: हाय तुम पर, जो चाँदी और सोना धार्मिकता से नहीं[a] अर्जित करते और कहते हो, ‘हम धन से धनी हो गए हैं, और संपत्ति भी हमारी हो गई है, और हमने वह सब अर्जित कर लिया है जिसकी हमने इच्छा की थी।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘धार्मिकता में नहीं।’ यह वाक्यांश धन अर्जित करने के तरीके को, या अधिक व्यापक रूप से उस कमाई के नैतिक चरित्र को, व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ
  choice: हाय तुम पर
  rationale: यह भविष्यवाणी-सदृश न्याय-घोषणा का सूत्र है; ‘हाय तुम पर’ उसके चेतावनी और दंडसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ታጠርዩ / አጥረይነ
  choice: अर्जित करते / अर्जित कर लिया है
  rationale: एक ही मूल से आए दोनों क्रियारूपों के लिए ‘अर्जित’ रखकर मूल की जानबूझकर की गई पुनरावृत्ति सुरक्षित की गई है; इसका अर्थ प्राप्त या इकट्ठा करना है।
- source_word: ብሩረ ወወርቀ
  choice: चाँदी और सोना
  rationale: बहुमूल्य धातुओं की मूल जोड़ी को सामान्यीकृत करके केवल ‘धन’ नहीं किया गया।
- source_word: ዘአኮ በጽድቅ
  choice: धार्मिकता से नहीं
  rationale: यह निकट और स्वाभाविक रूप से उस नैतिक ढंग को व्यक्त करता है जिसमें धन अर्जित नहीं किया गया; ‘धार्मिकता’ मूल की नैतिक-धार्मिक श्रेणी को बनाए रखती है।
- source_word: ብዕልነ፡ ብዕለ
  choice: हम धन से धनी हो गए हैं
  rationale: मूल की बलाघाती पुनरावृत्ति और समृद्ध हो जाने के परिणामी भाव को बनाए रखा गया है।
- source_word: ወኮነ ለነ ንዋይ
  choice: संपत्ति हमारी हो गई है
  rationale: इस स्वतंत्र कथन को छोड़ा नहीं गया; यह शाब्दिक अर्थ ‘संपत्ति हमारे लिए/हमारी हो गई’ को सहज हिन्दी में व्यक्त करता है।
- source_word: ኵሎ ዘፈቀድነ
  choice: वह सब ... जिसकी हमने इच्छा की थी
  rationale: यह उनकी डींग के सर्वसमावेशी भाव और इच्छा की भाषा—दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: धन अर्जित करने के संदर्भ में በጽድቅ का अनुवाद
  choice: धार्मिकता
  alternative: न्यायपूर्वक / सही रीति से
  rationale: ‘धार्मिकता’ मूल की व्यापक नैतिक-धार्मिक धारणा को बनाए रखती है और केवल कानूनी न्याय या सामान्य उचित व्यवहार तक अर्थ को सीमित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, स्पष्ट और मौखिक रूप से सहज स्तर रखा गया है। ‘धन से धनी’ की पुनरुक्ति सामान्य हिन्दी में कुछ बलाघाती सुनाई देती है, पर यह मूल के जानबूझकर दोहराए गए धन-संबंधी शब्दों को सुरक्षित रखती है।
