base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/006.yaml
  text: And all the words of your lawlessness shall be read out before the Great Holy One[a], and your faces shall be put to shame[c][b], and every deed that is founded in lawlessness shall be rejected.
translation:
  language: hi
  text: और तुम्हारे अधर्म की सारी बातें महान् पवित्र परमेश्वर के सामने पढ़कर सुनाई जाएँगी[a], तुम्हारे मुख लज्जित किए जाएँगे[b], और अधर्म पर टिका हुआ हर काम ठुकरा दिया जाएगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे अधर्म के सारे मामले”; ነገር का अर्थ केवल “बातें” ही नहीं, बल्कि “मामले” या “विषय” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल पाठ में “मुख” लज्जा के दिखाई देने वाले चिह्न को व्यक्त करता है।
    reason: idiom_clarification
  - marker: c
    text: या, “अधर्म में किया गया हर काम दूर फेंक दिया जाएगा।” मूल क्रिया में स्थापित या दृढ़ होने का भाव है, पर इस पदबंध की ठीक छाया अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትነበብ
  choice: पढ़कर सुनाई जाएँगी
  rationale: क्रिया का कर्मवाच्य भाव न्याय के प्रसंग में सार्वजनिक रूप से पढ़े या सुनाए जाने का संकेत देता है। यह चुनाव केवल ‘पढ़ी जाएँगी’ की अपेक्षा उस सार्वजनिक उद्घोषणा को अधिक स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ኵሉ ነገረ
  choice: सारी बातें
  rationale: ነገር का अर्थ ‘वचन’, ‘बात’, ‘मामला’ या ‘विषय’ हो सकता है। ‘सारी बातें’ मूल की व्यापकता बनाए रखता है और पढ़कर सुनाए जाने के प्रसंग में स्वाभाविक है।
- source_word: ዓመፃክሙ
  choice: तुम्हारे अधर्म
  rationale: यह शब्द विद्रोही दुष्टता, अन्याय और अनैतिकता का भाव रख सकता है। ‘अधर्म’ आधुनिक हिन्दी में संक्षिप्त और समझने योग्य है तथा इसे केवल शारीरिक हिंसा तक सीमित नहीं करता।
- source_word: ቅድመ ዐቢይ ቅዱስ
  choice: महान पवित्र जन के सामने
  rationale: मूल शब्दक्रम में कोई संयोजक नहीं है और यह न्याय-दृश्य में परमेश्वर की उपाधि के रूप में प्रयुक्त है। ‘महान पवित्र जन’ उस उपाधि को निकटता से और सम्मानपूर्ण हिन्दी में रखता है।
- source_word: ይትኀፈር ገጽክሙ
  choice: तुम्हारे मुख लज्जित होंगे
  rationale: मूल में मुख को दिखाई देने वाली लज्जा का वाहक बनाया गया है। यह अनुवाद उस चित्र को बनाए रखता है और स्रोत में न पाए जाने वाले ‘लज्जा से ढकने’ के रूपक को नहीं जोड़ता।
- source_word: ይገደፍ
  choice: ठुकरा दिया जाएगा
  rationale: क्रिया में छोड़ देने, दूर फेंकने या अस्वीकार करने का भाव है। न्यायिक प्रसंग में ‘ठुकरा दिया जाएगा’ स्पष्ट है, पर विनाश का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: ተግባረ ዘጸንዐ በዓመፃ
  choice: अधर्म पर टिका हुआ हर काम
  rationale: ጸንዐ में दृढ़, स्थापित या टिका होने का भाव है। ‘अधर्म पर टिका हुआ’ इस प्रबल अर्थ को बनाए रखता है, जबकि ‘अधर्म में किया गया’ संभव किंतु अधिक सामान्य अनुवाद है।
theological_decisions:
- issue: दैवी उपाधि ዐቢይ ቅዱስ का अनुवाद
  choice: महान पवित्र जन
  alternative: महान और पवित्र जन
  rationale: मूल में ‘और’ नहीं है। चुना हुआ रूप गीइज़ शब्दक्रम और उपाधि के सम्मानपूर्ण स्वर को बनाए रखता है, जबकि वैकल्पिक रूप हिन्दी में अधिक व्याख्यात्मक है।
- issue: ዓመፃ के नैतिक-न्यायिक भाव का अनुवाद
  choice: अधर्म
  alternative: अन्याय / दुष्टता / विद्रोह
  rationale: संदर्भ दोषों के सार्वजनिक उद्घाटन और न्याय का है। ‘अधर्म’ इसके व्यापक नैतिक और न्यायिक बल को रखता है, किसी एक प्रकार के अपराध तक अर्थ को सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। न्याय-दृश्य की सार्वजनिकता, ‘मुख’ की मूर्त छवि और अंतिम पदबंध की वास्तविक अनिश्चितता को सुरक्षित रखा गया है। किसी सांप्रदायिक शब्दावली या स्रोत से परे व्याख्या को नहीं जोड़ा गया।
