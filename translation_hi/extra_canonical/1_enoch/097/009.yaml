base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/009.yaml
  text: And now let us do what we planned[a], for we have gathered silver, and we have filled our storehouses like water[d][c][b], and many are the laborers of our houses.
translation:
  language: hi
  text: और अब हम वह काम करें जिसकी हमने योजना बनाई थी[a], क्योंकि हमने चाँदी बटोर ली है और अपने भंडार-घरों को पानी के समान भर लिया है[b]; और हमारे घरानों के खेतिहर मज़दूर बहुत हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जो हमने सोचा था’ अथवा ‘जो हमने ठाना था।’ मूल क्रिया सोचने और योजना बनाने, दोनों अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: ‘पानी के समान’ मूल की शाब्दिक उपमा है। सम्भवतः यह बहुतायत या लबालब भरे होने का भाव व्यक्त करती है।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से ‘हमारे घरों के खेतिहर काम करने वाले।’ यहाँ ‘घर’ का अर्थ घराना या जागीर भी हो सकता है, और काम करने वालों के लिए प्रयुक्त शब्द किसानों, हलवाहों या अन्य खेतिहर मज़दूरों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ንግበር
  choice: हम ... करें
  rationale: प्रथम पुरुष बहुवचन का यह रूप यहाँ आत्म-प्रेरक भाव व्यक्त करता है—धनी वक्ता अपनी बनाई योजना पर चलने के लिए स्वयं को उकसा रहे हैं।
- source_word: ዘኀለይነ
  choice: जिसकी हमने योजना बनाई थी
  rationale: मूल क्रिया सोचने और योजना बनाने, दोनों का अर्थ दे सकती है; प्रसंग में सोची-समझी मंशा प्रमुख है, पर विकल्प पादटिप्पणी में रखा गया है।
- source_word: ብሩረ
  choice: चाँदी
  rationale: मूल का ठोस धातुवाचक अर्थ सुरक्षित रखा गया है; इसे सामान्यीकृत करके केवल ‘धन’ नहीं किया गया।
- source_word: አስተጋባእነ
  choice: बटोर ली है
  rationale: यह इकट्ठा करने का भाव स्वाभाविक हिन्दी में व्यक्त करता है और धन-संचय के गर्वपूर्ण स्वर को बिना अतिरिक्त नैतिक टिप्पणी के बनाए रखता है।
- source_word: መዛግብቲነ
  choice: अपने भंडार-घरों
  rationale: शब्द संग्रह अथवा निधि रखने के स्थानों को दर्शाता है; ‘भंडार-घर’ भौतिक रूप से भरे जाने की छवि बनाए रखता है।
- source_word: ከመ ማይ
  choice: पानी के समान
  rationale: मूल की कुछ असामान्य उपमा को सरल व्याख्या में बदलने के बजाय ज्यों का त्यों सुरक्षित रखा गया है।
- source_word: ሐራስተ
  choice: खेतिहर मज़दूर
  rationale: शब्द कृषि का काम करने वालों को सूचित करता है; ‘खेतिहर मज़दूर’ आधुनिक पाठक के लिए स्पष्ट है और ‘किसान’ की अपेक्षा आश्रित श्रमिकों की सम्भावना को बेहतर बनाए रखता है।
- source_word: አብያቲነ
  choice: हमारे घरानों में
  rationale: शाब्दिक अर्थ ‘हमारे घर’ है, पर यहाँ संपन्न परिवारों के घराने अथवा उनसे जुड़ी संपदा अभिप्रेत हो सकती है; मुख्य पाठ में स्वाभाविक हिन्दी और पादटिप्पणी में अस्पष्टता रखी गई है।
theological_decisions:
- issue: धनी वक्ताओं के कथन का स्वर
  choice: इसे गर्वपूर्ण आत्म-प्रेरणा के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल भविष्य की निष्पक्ष योजना के कथन के रूप में पढ़ना।
  rationale: न्याय और धिक्कार के व्यापक प्रसंग में प्रथम पुरुष बहुवचन वक्ताओं की संपत्ति पर आत्मविश्वासी डींग को व्यक्त करता है; अनुवाद उस स्वर को बनाए रखता है, पर कोई अतिरिक्त निंदा-सूचक शब्द नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किन्तु गरिमापूर्ण रखी गई है। वक्ताओं की डींग का स्वर वाक्य-संरचना और संचित संपत्ति की छवियों से उभरता है; मूल की ‘पानी के समान’ वाली असामान्य उपमा तथा अंतिम पदबंध की वास्तविक अर्थगत अनिश्चितता सुरक्षित रखी गई है।
