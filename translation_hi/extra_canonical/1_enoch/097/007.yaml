base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/007.yaml
  text: Woe to you[a], sinners, who are in the midst of the sea and upon the dry land[b], whose memory is evil against you.
translation:
  language: hi
  text: तुम पर हाय, हे पापियो, जो समुद्र के बीच और सूखी भूमि पर हो[b], तुम्हारा स्मरण[a] तुम्हारे विरुद्ध बुरा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम उपवाक्य कठिन है। इसका अर्थ ‘तुम्हारी याद बुरी है,’ ‘तुम्हारा स्मारक बुरा है,’ या ‘बुरा स्मरण तुमसे चिपका हुआ है’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘समुद्र के बीच और सूखी भूमि पर’ का युग्म सम्भवतः सब स्थानों को समेटने वाली छवि है—जहाँ कहीं लोग रहते या यात्रा करते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: तुम पर हाय
  rationale: यह भविष्यद्वाणी-संबंधी न्याय की गंभीर घोषणा है; ‘हाय’ उसके निंदा और चेतावनी के स्वर को बनाए रखता है।
- source_word: ኃጥኣን
  choice: पापियो
  rationale: सम्बोधन के रूप में यह स्रोत के नैतिक वर्ग और वचन के सीधे, गंभीर स्वर को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ማእከለ፡ ባሕር
  choice: समुद्र के बीच
  rationale: स्थान-सूचक चित्र को सामान्यीकृत किए बिना स्रोत के निकट और सहज हिन्दी में व्यक्त करता है।
- source_word: ወዲበ፡ የብስ
  choice: और सूखी भूमि पर
  rationale: समुद्र के साथ स्रोत में उपस्थित स्पष्ट विरोध को बनाए रखता है; केवल ‘भूमि’ कहने से यह विरोध कुछ मंद पड़ता।
- source_word: ዝክርሙ
  choice: तुम्हारा स्मरण
  rationale: ‘स्मरण’ याद, उल्लेख और स्मारकीय प्रतिष्ठा के बीच स्रोत की वास्तविक अस्पष्टता को ‘याद’ की अपेक्षा बेहतर सुरक्षित रखता है।
- source_word: እኩይ፡ ዴቤክሙ
  choice: तुम्हारे विरुद्ध बुरा है
  rationale: पाठ और रूप कठिन हैं। यह अनुवाद न्यायिक प्रतिकूलता का सम्भावित अर्थ देता है, पर पादटिप्पणी में अन्य अर्थ खुले रखता है।
theological_decisions:
- issue: अंतिम उपवाक्य में स्मरण का अर्थ
  choice: तुम्हारा स्मरण तुम्हारे विरुद्ध बुरा है
  alternative: तुम्हारी याद बुरी है; तुम्हारा स्मारक तुम्हारे विषय में बुरा है; बुरा स्मरण तुमसे चिपका है
  rationale: गीज़ का अंतिम वाक्यांश पाठगत और शब्दार्थगत रूप से कठिन है। मुख्य पाठ प्रतिकूल, न्याय-संबंधी भाव को बनाए रखता है, जबकि पादटिप्पणी अनिश्चितता को स्पष्ट करती है और किसी एक धर्मवैज्ञानिक निष्कर्ष को निश्चित नहीं बनाती।
- issue: समुद्र और सूखी भूमि का विस्तार
  choice: दोनों भौगोलिक चित्रों को स्पष्ट रूप से बनाए रखना
  alternative: तुम जहाँ कहीं भी हो
  rationale: व्यापक अर्थ सम्भव है, पर स्रोत की सजीव द्वयी छवि को परिभाषात्मक भावार्थ में बदल देना अनावश्यक होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, भविष्यद्वाणी-संबंधी शैली रखी गई है। ‘हे पापियो’ स्वाभाविक प्रत्यक्ष सम्बोधन देता है; ‘स्मरण’ थोड़ा औपचारिक है, पर मूल की स्मृति/उल्लेख/स्मारक वाली अस्पष्टता बचाने के लिए जानबूझकर चुना गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
