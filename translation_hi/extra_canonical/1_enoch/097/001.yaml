  yaml_path: translation/extra_canonical/1_enoch/097/001.yaml
  text: Trust[a], you righteous, for sinners will become a disgrace[b], and they will perish on the day of iniquity.
translation:
  language: hi
  text: हे धर्मियो, भरोसा रखो[a], क्योंकि पापी अपमानित होंगे[b] और अधर्म के दिन नाश हो जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विश्वास रखो” अथवा “ढाढ़स बाँधो।” मूल पाठ यह स्पष्ट नहीं करता कि भरोसा किस पर रखा जाए।
    reason: lexical_ambiguity
  - marker: b
    text: शाब्दिक रूप से, “अपमान के लिए हो जाएँगे”; अर्थ तिरस्कार, लज्जा या अपमान की दशा को प्राप्त होना भी हो सकता है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ተአመኑ
  choice: भरोसा रखो
  rationale: बहुवचन आज्ञार्थक क्रिया विश्वास या भरोसा रखने का भाव देती है। मूल में भरोसे का विषय स्पष्ट नहीं है, इसलिए अनुवाद में भी उसे जोड़ा नहीं गया।
- source_word: ጻድቃን
  choice: हे धर्मियो
  rationale: यह बहुवचन संबोधन है। ‘हे धर्मियो’ उसके संबोधन-भाव को स्पष्ट और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: ለጽእለት ይከውኑ
  choice: अपमान का पात्र बनेंगे
  rationale: यह पदबंध पापियों के लज्जा, तिरस्कार या अपमान की दशा में पहुँचने को व्यक्त करता है। हिन्दी में ‘अपमान का पात्र बनेंगे’ परिणाम और न्याय—दोनों भाव स्वाभाविक रूप से देता है।
- source_word: ኃጥኣን
  choice: पापी
  rationale: न्याय के संदर्भ में यह धर्मियों के विपरीत नैतिक-धार्मिक वर्ग को सूचित करने वाला सामान्य शब्द है।
- source_word: ወይትሐጕሉ
  choice: और नाश हो जाएँगे
  rationale: क्रिया ሐጕለ मूल से है और नष्ट होने या विनाश को प्राप्त होने का अर्थ देती है; इसलिए इसे ‘सौंप दिए जाएँगे’ नहीं किया गया।
- source_word: በዕለተ ዓመፃ
  choice: अधर्म के दिन
  rationale: ዓመፃ यहाँ अधर्म, दुष्टता या नियम-विरोध का भाव देता है। ‘अधर्म’ हिन्दी के न्याय-संबंधी और महाप्रलयकारी संदर्भ के अनुकूल है, बिना इसे केवल शारीरिक हिंसा तक सीमित किए।
theological_decisions:
- issue: आरंभिक आज्ञा सामान्य आत्मविश्वास है या परमेश्वर में धार्मिक विश्वास
  choice: भरोसा रखो
  alternative: विश्वास करो; ढाढ़स बाँधो
  rationale: मूल पाठ भरोसे का विषय व्यक्त नहीं करता। ‘भरोसा रखो’ विश्वास और आश्वस्त साहस—दोनों संभावनाएँ खुली रखता है तथा परमेश्वर को स्पष्ट कर्मपूरक के रूप में जोड़कर पाठ की अस्पष्टता को समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘हे धर्मियो’ संबोधन की शक्ति बनाए रखता है; ‘अधर्म के दिन’ न्याय-संबंधी प्रलयकारी स्वर को सुरक्षित रखता है।
