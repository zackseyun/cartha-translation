base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/004.yaml
  text: 'And you will become like them[d][c][b][a], against whom this word will be a witness: ‘You have become companions of sinners.’'
translation:
  language: hi
  text: 'और तुम उन्हीं के समान हो जाओगे, जिनके विरुद्ध यह वचन[a] गवाही देगा: “तुम पापियों के साथी[b] हो गए हो।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यह वचन’ का अनुवाद ‘यह कथन’ या ‘यह बात’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘पापियों के साथी’ का अर्थ ‘पापियों के सहभागी’ या ‘पापियों के संगी’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ትከውኑ
  choice: हो जाओगे
  rationale: भविष्यकालीन बहुवचन रूप है; यह किसी अवस्था में आ जाने की चेतावनी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ከማሆሙ
  choice: उन्हीं के समान
  rationale: तुलनात्मक अर्थ को स्पष्ट और सहज रूप में रखता है तथा पूर्वोक्त लोगों की ओर संकेत बनाए रखता है।
- source_word: ሰማዕተ ይከውን ዴቤሆሙ ዝንቱ ነገር
  choice: जिनके विरुद्ध यह वचन गवाही देगा
  rationale: ሰማዕተ को ‘गवाह/गवाही’ मानते हुए वाक्यांश की न्यायिक शक्ति सुरक्षित रखी गई है; ዴቤሆሙ यहाँ ‘उनके विरुद्ध’ के अर्थ में लिया गया है।
- source_word: ዝንቱ ነገር
  choice: यह वचन
  rationale: ነገር के ‘वचन/कथन/बात’ अर्थों में ‘वचन’ प्रसंग की गवाही-संबंधी भाषा के अनुकूल है, जबकि अन्य संभावनाएँ पाद-टिप्पणी में दी गई हैं।
- source_word: ሱቱፋነ
  choice: साथी
  rationale: यह सहभागिता और संगति दोनों का भाव देता है, बिना किसी तकनीकी धर्मवैज्ञानिक अर्थ को आरोपित किए।
- source_word: ኮንክሙ
  choice: हो गए हो
  rationale: पूर्ण क्रिया से उत्पन्न वर्तमान दशा का भाव व्यक्त होता है और पहले खंड के ‘हो जाओगे’ से अर्थपूर्ण प्रतिध्वनि बनती है।
- source_word: ለኃጥኣን
  choice: पापियों के
  rationale: ‘साथी’ के साथ यह सहज हिन्दी संबंधसूचक रचना है; मूल में निहित संगति का भाव बना रहता है।
theological_decisions:
- issue: चेतावनी का स्वरूप
  choice: पापियों का साथ देने के कारण श्रोताओं का उन्हीं के समान हो जाना और वचन का उनके विरुद्ध गवाही देना
  alternative: इसे केवल यह कथन मानना कि श्रोता पहले से ही पापी हैं, या संगति पर बल दिए बिना केवल न्यायिक घोषणा मानना
  rationale: पद में ‘उनके समान हो जाओगे’, ‘गवाही देगा’ और ‘पापियों के साथी’—तीनों भाव उपस्थित हैं। अनुवाद नैतिक संगति और न्यायिक गवाही दोनों को बनाए रखता है, पर पद से आगे कोई विस्तृत सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और चेतावनीपूर्ण स्वर रखा गया है। न्यायिक अर्थ स्पष्ट करने के लिए ‘विरुद्ध’ और ‘गवाही देगा’ का प्रयोग किया गया है। पुराने श्रवण-आधारित पाठांतर को मुख्य पाठ या पाद-टिप्पणी में नहीं रखा गया, क्योंकि ሰማዕተ यहाँ ‘गवाह/गवाही’ है, ‘सुना जाना’ नहीं।
