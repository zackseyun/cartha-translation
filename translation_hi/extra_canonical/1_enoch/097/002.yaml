  yaml_path: translation/extra_canonical/1_enoch/097/002.yaml
  text: Know that the Most High remembers your destruction[c][b][a], and the angels of heaven rejoice over your destruction.
translation:
  language: hi
  text: तुम जान लो कि परमप्रधान तुम्हारे विनाश को स्मरण रखता है और स्वर्गदूत तुम्हारे विनाश पर आनंद मनाते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विनाश’ के दोनों स्थानों पर ‘बरबादी’ या ‘पतन’ भी सम्भव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እሙረ፡ ይከውን፡ ለክሙ፡ እስመ
  choice: तुम जान लो कि
  rationale: यह पूरा गीइज़ वाक्यांश ‘यह तुम्हें ज्ञात हो कि’ के अर्थ में एक मुहावरेदार सूचना-सूत्र है। ‘तुम जान लो कि’ आधुनिक हिन्दी में स्वाभाविक और सीधा है तथा እስመ को यहाँ पूरक-सूचक ‘कि’ मानता है, कारण-सूचक ‘क्योंकि’ नहीं।
- source_word: ልዑል
  choice: परमप्रधान
  rationale: यह अपोकैलिप्टिक साहित्य में प्रयुक्त ईश्वरीय उपाधि है; ‘परमप्रधान’ हिन्दी बाइबलीय शैली में प्रतिष्ठित, संक्षिप्त और गरिमापूर्ण है।
- source_word: ይዜከር
  choice: स्मरण रखता है
  rationale: रूप वर्तमान या भविष्यगत अर्थ दे सकता है। वर्तमान काल न्याय की निश्चितता को सजीव रखता है; ‘स्मरण रखता है’ केवल क्षणिक याद आने की अपेक्षा न्यायार्थक संदर्भ को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ሐጕልክሙ / ሐጕለ ዚአክሙ
  choice: तुम्हारे विनाश
  rationale: दोनों स्थानों पर एक ही संज्ञा की पुनरावृत्ति सुरक्षित रखी गई है। ‘विनाश’ विपत्ति या बरबादी की तीव्रता बताता है, पर उसके तरीके को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ይትፌሥሑ
  choice: आनन्द मनाते हैं
  rationale: मूल क्रिया प्रबल हर्ष व्यक्त करती है। यह हिन्दी में स्वाभाविक है और कठोर अपोकैलिप्टिक चित्र को नरम नहीं करती।
- source_word: መላእክተ፡ ሰማይ
  choice: स्वर्ग के दूत
  rationale: मूल की संबंधवाचक रचना को सुरक्षित रखते हुए यह सामान्य आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: क्या स्वर्गीय दूत संबोधित लोगों के विनाश पर आनन्द मनाते हैं
  choice: स्पष्ट अर्थ को यथावत रखा गया है कि स्वर्ग के दूत उनके विनाश पर आनन्द मनाते हैं।
  alternative: इसे ‘दूत विनाश को देखते हैं’ या ‘ईश्वरीय न्याय पर आनन्द मनाते हैं’ कहकर नरम किया जा सकता था।
  rationale: गीइज़ पाठ में आनन्द की क्रिया और विनाश पर उसका संबंध स्पष्ट है। अपोकैलिप्टिक कथन की जानबूझकर रखी गई कठोरता और धर्मवैज्ञानिक तनाव को बिना व्याख्यात्मक विस्तार के सुरक्षित रखना उचित है।
- issue: ይዜከር का कालगत अर्थ
  choice: वर्तमान ‘स्मरण रखता है’
  alternative: भविष्यगत ‘स्मरण रखेगा’
  rationale: मूल रूप संदर्भ में वर्तमान अथवा भविष्यगत अर्थ ग्रहण कर सकता है। वर्तमान न्याय की निश्चितता को व्यक्त करता है, जबकि फुटनोट अनावश्यक किए बिना वास्तविक कालगत लचीलेपन को हिन्दी में स्वाभाविक रूप देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण और चेतावनीपूर्ण अपोकैलिप्टिक स्वर रखा गया है। आरम्भिक गीइज़ मुहावरे को शाब्दिक ‘यह तुम्हें ज्ञात हो’ के बजाय स्वाभाविक ‘तुम जान लो’ से व्यक्त किया गया है। सर्वनाम ‘तुम’ बहुवचन संबोधन है।
