base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/005.yaml
  text: And in those days the prayers of the holy ones will reach the Lord[b][a], and the days of your judgment will come upon you.
translation:
  language: hi
  text: और उन दिनों पवित्र जनों[a] की प्रार्थनाएँ प्रभु तक पहुँचेंगी, और तुम्हारे न्याय के दिन तुम पर आ पहुँचेंगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्र लोगों की।’ गीइज़ शब्द का शाब्दिक अर्थ ‘पवित्र जन’ है; यहाँ यह धर्मियों के लिए हो सकता है, पर इसकी पहचान पूरी तरह निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: इस साक्षी में अंतिम वाक्यांश पाठगत रूप से कठिन है। सम्भवतः इसका आशय संबोधित दुष्टों पर हिसाब, दंड या न्याय के दिन आने से है।
    reason: textual_variant
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: उन दिनों
  rationale: यह सर्वनाश-साहित्य की प्रचलित कालसूचक अभिव्यक्ति है। ‘दिनों’ को बनाए रखने से मूल की पुनरावृत्ति और लय सुरक्षित रहती है।
- source_word: ትበጽኅ ጸሎቶሙ
  choice: प्रार्थनाएँ ... पहुँचेंगी
  rationale: क्रिया किसी गंतव्य तक आने या पहुँचने का भाव देती है; यह अनुवाद प्रार्थनाओं के प्रभु तक पहुँचने की मूल छवि को बनाए रखता है।
- source_word: ለቅዱሳን
  choice: पवित्र जनों
  rationale: यह ‘पवित्र लोगों/जनों’ का सीधा और स्वाभाविक हिन्दी रूप है तथा बाद की किसी विशिष्ट कलीसियाई पदवी को आरोपित नहीं करता।
- source_word: ኀበ እግዚእ
  choice: प्रभु तक
  rationale: पूर्वसर्ग प्रभु की ओर दिशा और गंतव्य का संकेत करता है; ‘तक’ हिन्दी में पहुँचने की क्रिया के साथ स्वाभाविक है।
- source_word: ይበጽሕ መዋዕለ ኵነክሙ
  choice: तुम्हारे न्याय के दिन तुम पर आ पहुँचेंगे
  rationale: पाठ का अंतिम पद कठिन है, पर प्रसंग संबोधित दुष्टों पर आने वाले प्रतिकूल लेखे या दंड की ओर संकेत करता है। ‘न्याय’ न्यायिक-सर्वनाशकारी भाव रखता है, जबकि ‘तुम पर आ पहुँचेंगे’ उसके प्रतिकूल आगमन को व्यक्त करता है।
theological_decisions:
- issue: इस प्रसंग में ቅዱሳን की पहचान
  choice: ‘पवित्र जन’ कहकर पहचान को खुला रखा गया है; निकट प्रसंग में यह सम्भवतः सताए गए धर्मी और विश्वासयोग्य लोगों की ओर संकेत करता है।
  alternative: स्वर्गदूत, अथवा स्वर्गीय और पृथ्वी के सभी पवित्र जनों को समेटने वाला व्यापक वर्ग
  rationale: दुष्ट उत्पीड़कों और उन धर्मी लोगों के बीच विरोध है जिनकी प्रार्थनाएँ परमेश्वर तक पहुँचती हैं। फिर भी मूल पद स्वयं पूर्ण पहचान निश्चित नहीं करता, इसलिए अनुवाद उस अस्पष्टता को बनाए रखता है।
- issue: अंतिम वाक्यांश में आने वाले परिणाम का स्वरूप
  choice: न्याय
  alternative: विनाश या दंड
  rationale: साक्ष्य में पद पाठगत रूप से कठिन है। ‘न्याय’ आने वाले हिसाब और प्रतिकूल निर्णय का भाव देता है, पर उसे केवल शारीरिक विनाश के रूप में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सर्वनाश-साहित्य के अनुकूल शैली रखी गई है। ‘पवित्र जन’ मूल की सम्भावित व्यापकता बनाए रखता है, और ‘न्याय के दिन’ कठिन अंतिम पद को आवश्यकता से अधिक निश्चित नहीं बनाता।
