  text: And they took me to a place of whirlwind[b][a], and to a mountain whose summit reached to heaven.
translation:
  language: hi
  text: और वे मुझे बवंडर वाले एक स्थान[a] तक और एक ऐसे पर्वत तक ले गए, जिसकी चोटी स्वर्ग तक पहुँचती थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आँधी वाला स्थान’ अथवा ‘तूफ़ान वाला स्थान’। गीइज़ शब्द उग्र वायुमंडलीय हलचल का भाव देता है।
    reason: lexical_alternative
  - marker: b
    text: 'गीइज़ में प्रयुक्त गति-सूचक संबंधबोधक का अर्थ ‘तक/की ओर’ या, प्रसंगानुसार, ‘में/के भीतर’ हो सकता है। अधिक शाब्दिक रूप: ‘बवंडर वाले एक स्थान में और एक पर्वत में।’ यहाँ ‘तक’ चुना गया है, क्योंकि ‘पर्वत में’ से उसके भीतर प्रवेश का अनावश्यक अर्थ निकल सकता है।'
    reason: source_ambiguity
lexical_decisions:
- source_word: ወወሰዱኒ
  choice: और वे मुझे ले गए
  rationale: क्रिया किसी को साथ ले जाने या किसी स्थान तक पहुँचाने का सामान्य अर्थ देती है; यह अनुवाद मार्ग दिखाने या उठाकर ले जाने में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: መካን
  choice: स्थान
  rationale: यह व्यापक स्थानवाचक शब्द है; ‘स्थान’ सरल, स्वाभाविक और व्याख्यात्मक भार से मुक्त है।
- source_word: ዘዐውሎ
  choice: बवंडर का
  rationale: यह शब्द उग्र वायुमंडलीय हलचल का बिंब देता है। ‘बवंडर’ उस सजीव प्रलयदर्शी छवि को ‘आँधी’ या ‘तूफ़ान’ की अपेक्षा अधिक स्पष्ट रखता है।
- source_word: ደብር
  choice: पर्वत
  rationale: दर्शनात्मक और बाइबिलीय भू-दृश्य में यह सबसे स्पष्ट तथा गरिमापूर्ण आधुनिक हिन्दी रूप है।
- source_word: ዘክተማ ርእሱ
  choice: जिसकी चोटी
  rationale: शाब्दिक भाव पर्वत के ‘सिर/ऊपरी भाग’ का है; ‘चोटी’ हिन्दी में स्वाभाविक रहते हुए ऊँचाई का बिंब सुरक्षित रखती है।
- source_word: ይበጽሕ እስከ ሰማይ
  choice: स्वर्ग तक पहुँचती थी
  rationale: वाक्यांश ऊपर स्वर्ग तक विस्तार को व्यक्त करता है। यह रूप संक्षिप्त है और ब्रह्मांडीय ऊर्ध्व छवि को बनाए रखता है।
- source_word: ውስተ
  choice: तक / के पास
  rationale: गति-सूचक प्रसंग में इसका अर्थ ‘में/के भीतर’ अथवा ‘तक/की ओर’ हो सकता है। पर्वत के ‘भीतर’ जाने का अनचाहा अर्थ टालते हुए हिन्दी में स्वाभाविक गंतव्य-सूचक रूप चुना गया है।
theological_decisions:
- issue: प्रलयदर्शी आरोहण के प्रसंग में ሰማይ का अनुवाद
  choice: स्वर्ग
  alternative: आकाश
  rationale: शब्द ‘आकाश’ भी दर्शा सकता है, पर यहाँ दृश्य ब्रह्मांडीय आरोहण और स्वर्गीय क्षेत्र की सीमा पर केंद्रित है। ‘स्वर्ग’ बाद की किसी विशिष्ट धर्मवैज्ञानिक धारणा को जोड़े बिना प्रलयदर्शी शैली को अधिक अच्छी तरह बनाए रखता है।
