  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दर्शनात्मक शैली रखी गई है। ‘बवंडर’, ‘पर्वत’, ‘चोटी’ और ‘स्वर्ग’ मूल की ऊर्ध्व तथा ब्रह्मांडीय छवि को सुरक्षित रखते हैं; गति-सूचक संबंधबोधक की वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
