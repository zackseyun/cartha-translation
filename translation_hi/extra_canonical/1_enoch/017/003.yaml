base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/003.yaml
  text: And I saw the places of the lights and of the thunder[a], in the extremities, in the depth, where there was a bow of fire, and arrows and their quiver, and a sword of fire[d][c][b], and all the lightnings.
translation:
  language: hi
  text: और मैंने छोरों पर, गहराई में, ज्योतियों और गर्जन के स्थान[a] देखे; वहाँ आग का एक धनुष, तीर और उनका तरकश, आग की एक तलवार, और सारी बिजलियाँ थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “स्थान” को “भंडार” या “भंडारगृह” भी समझा जा सकता है। मूल पाठ छोरों और गहराई को दो अलग स्थान-सूचक पदबंधों में रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: መካናተ
  choice: स्थान
  rationale: मूल शब्द सामान्यतः स्थानों या निवास-स्थानों को दर्शाता है। इस पद में 'भंडार' का ब्रह्मांडीय अर्थ संभव है, पर मूल की अनिश्चितता बचाने के लिए मुख्य पाठ में अधिक सीधा 'स्थान' रखा गया है।
- source_word: ብርሃናት
  choice: ज्योतियाँ
  rationale: बहुवचन प्रकाशमान पिंडों या घटनाओं को समेट सकता है। पद के अंत में बिजली का अलग उल्लेख होने से इसे 'बिजलियाँ' कहना उचित नहीं।
- source_word: ነጐድጓድ
  choice: गर्जन
  rationale: यह शब्द मेघ-गर्जन को दर्शाता है; हिन्दी में 'गर्जन' गरिमापूर्ण और स्वाभाविक है।
- source_word: ውስተ አጽናፍ
  choice: छोरों पर
  rationale: यह पृथक स्थानवाचक पदबंध सीमाओं अथवा अंतिम छोरों को सूचित करता है; इसे अगले 'गहराई में' के साथ मिलाया नहीं गया।
- source_word: ኀበ ዕመቃ
  choice: गहराई में
  rationale: यह पहले स्थानवाचक पदबंध से अलग है और किसी गहरे स्थान की ओर या उसमें होने का बोध देता है। हिन्दी में 'गहराई में' अर्थ और प्रवाह दोनों रखता है।
- source_word: ቀሥተ እሳት
  choice: आग का एक धनुष
  rationale: शाब्दिक संरचना और शस्त्र-रूपक दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ሐጾ
  choice: तीर
  rationale: धनुष और तरकश के साथ यह अर्थ सबसे संगत है।
- source_word: ምጕንጻቲሆሙ
  choice: उनका तरकश
  rationale: प्रत्यययुक्त रूप को रखते हुए धनुष-तीर के प्रसंग में 'तरकश' स्वाभाविक समतुल्य है।
- source_word: ሰይፈ እሳት
  choice: आग की एक तलवार
  rationale: मूल की तीखी प्रलयदर्शी छवि को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: መበርቅት ኵሉ
  choice: सारी बिजलियाँ
  rationale: बहुवचन और समग्रता-सूचक पद दोनों को बनाए रखता है; यहाँ आकाशीय बिजली अभिप्रेत है।
theological_decisions:
- issue: ब्रह्मांडीय स्थानों का स्वरूप
  choice: मुख्य पाठ में 'स्थान'
  alternative: '''भंडार'' या ''भंडारगृह'''
  rationale: दृश्य में प्राकृतिक और अग्निमय शक्तियाँ मानो दूरस्थ ब्रह्मांडीय क्षेत्रों में रखी हुई हैं, इसलिए 'भंडार' संभव है; फिर भी मूल संज्ञा अपने आप में अधिक व्यापक है। मुख्य पाठ अनिश्चितता बनाए रखता है और पादटिप्पणी वैकल्पिक प्रलयदर्शी अर्थ बताती है।
- issue: शस्त्र-संबंधी दृश्य का अर्थ
  choice: धनुष, तीर, तरकश और तलवार को प्रत्यक्ष रूपक के रूप में बनाए रखा
  alternative: इन्हें तूफान या बिजली का सामान्य वर्णन बनाना
  rationale: मूल एक क्रमबद्ध शस्त्र-सूची देता है। इसे सामान्य मौसम-वर्णन में बदलना प्रलयदर्शी तनाव और ठोस बिंब को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। 'ज्योतियाँ' ब्रह्मांडीय प्रकाशों की व्यापकता रखता है, जबकि 'बिजलियाँ' अंतिम पद के विशिष्ट बहुवचन को व्यक्त करता है। वाक्य-विन्यास में मूल की सूचीबद्ध, दर्शनात्मक गति सुरक्षित रखी गई है।
