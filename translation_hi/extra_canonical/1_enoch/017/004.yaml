base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/004.yaml
  text: And they took me as far as the living waters[a], and as far as the fire of the west[c][b], which receives every setting of the sun.
translation:
  language: hi
  text: और वे मुझे जीवन्त जलों[a] तक और पश्चिम की आग तक ले गए, जो सूर्य के प्रत्येक अस्त होने को ग्रहण करती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसके बाद इथियोपियाई पाठ में एक अनिश्चित, कोष्ठकित शब्द है, जिसका अर्थ संभवतः “जो बोलते हैं” हो सकता है; पाठ संदिग्ध होने के कारण उसे मुख्य पाठ में नहीं रखा गया है। “जीवन्त जलों” का अनुवाद “जीवन देने वाले जलों” भी किया जा सकता है।
    reason: textual_variant_and_lexical_alternative
lexical_decisions:
- source_word: ወነሥኡኒ
  choice: और वे मुझे ... ले गए
  rationale: ነሥአ का अर्थ लेना, ले जाना या उठा ले जाना हो सकता है। दर्शनीय यात्रा के प्रसंग में ‘ले गए’ मार्गदर्शित गति को सहज हिन्दी में व्यक्त करता है, बिना यह तय किए कि हनोक को सचमुच उठाकर ले जाया गया था।
- source_word: እስከ
  choice: तक
  rationale: दो बार आया እስከ गंतव्य अथवा सीमा बताता है; हिन्दी में ‘तक’ इसकी पुनरावृत्ति और गति की सीमा दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: ማያት ሕያዋን
  choice: जीवित जलों
  rationale: यह संज्ञा-विशेषण पदबंध शाब्दिक रूप से ‘जीवित जल’ है, न कि व्याकरणिक रूप से ‘जीवन के जल’। बहुवचन ‘जलों’ मूल के बहुवचन रूप और अलौकिक दृश्य की गरिमा को सुरक्षित रखता है।
- source_word: '[ዘይትናገር]'
  choice: मुख्य पाठ में नहीं रखा
  rationale: कोष्ठकित पाठ इस साक्ष्य में अनिश्चित है और प्रसंग में कठिन है। इसे जबरन अर्थ देने के बजाय पाठांतर-संबंधी पादटिप्पणी में बताया गया है।
- source_word: እሳት ዐረብ
  choice: पश्चिम की आग
  rationale: ዐረብ को यहाँ पश्चिम अथवा अस्त की दिशा के अर्थ में लेना अगले सूर्यास्त-वाक्यांश से मेल खाता है और दर्शन की ठोस ब्रह्मांडीय भूगोल को बनाए रखता है।
- source_word: ዘውእቱ ይነሥእ ኵሎ ዕርተ ፀሐይ
  choice: जो सूर्य के हर अस्त को अपने भीतर ले लेती है
  rationale: सापेक्ष उपवाक्य पश्चिमी आग को सूर्य के प्रत्येक अस्त को ग्रहण करने वाली बताता है। ‘अपने भीतर ले लेती है’ मूल की ग्रहण करने की सजीव छवि को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: हनोक की दर्शनीय यात्रा की ब्रह्मांडीय छवि
  choice: ‘जीवित जलों’ और ‘पश्चिम की आग’ को वास्तविक दर्शनीय स्थानों जैसी ठोस भाषा में बनाए रखा गया है।
  alternative: इन अभिव्यक्तियों को मुख्य पाठ में प्रतीकों के रूप में समझाना या सामान्य प्राकृतिक घटनाओं में बदल देना।
  rationale: मूल पाठ इन दृश्यों की प्रतीकात्मक व्याख्या नहीं देता। अनुवाद को उनकी विचित्रता और धर्मवैचारिक तनाव सुरक्षित रखने चाहिए, न कि पहले ही उनका अर्थ निर्धारित कर देना चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, किंतु गरिमापूर्ण दर्शनीय शैली में रखी गई है। ‘जलों’ सामान्य बोलचाल से अधिक साहित्यिक है, पर मूल के बहुवचन और अनेक अलौकिक जलधाराओं की छवि को सुरक्षित करता है।
