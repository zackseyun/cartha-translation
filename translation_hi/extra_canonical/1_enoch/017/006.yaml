    text: मूल में शाब्दिक अभिव्यक्ति “समस्त देह” है। यह मनुष्यों को अथवा अधिक व्यापक रूप से सभी देहधारी प्राणियों को सूचित कर सकती है। उपलब्ध गीइज़ प्रतिलिपि में अंतिम क्रिया का आरंभ संदिग्ध है, पर यूनानी पाठ-साक्ष्य “नहीं चलता” पाठ की पुष्टि करता है।
    reason: textual_variant_and_lexical_alternative
