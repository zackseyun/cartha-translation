base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/001.yaml
  text: And they took me into a place where those who were there were like burning fire[a], and whenever they wished, they appeared like men.
translation:
  language: hi
  text: और वे मुझे एक स्थान में ले गए। वहाँ जो थे, वे धधकती हुई आग के समान थे, और जब भी वे चाहते, मनुष्यों के समान दिखाई देते थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने आपको मनुष्यों के समान दिखाते थे।” मूल क्रिया में स्वयं को मानवीय रूप में दृश्य करने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወነሥኡኒ
  choice: और वे मुझे ... ले गए
  rationale: मूल क्रिया लेने या ले जाने का अर्थ देती है। ‘ले गए’ दर्शनीय यात्रा को स्वाभाविक हिन्दी में व्यक्त करती है, बिना यह तय किए कि उसे उठाकर ले जाया गया या मार्ग दिखाकर।
- source_word: ውስተ አሐዱ መካን
  choice: एक स्थान में
  rationale: वाक्यांश शाब्दिक रूप से ‘एक स्थान में’ है। यह हिन्दी में स्वाभाविक रहते हुए मूल की किंचित विशिष्ट दर्शनीय शैली को बनाए रखता है।
- source_word: ኀበ እለ ሀለዉ ህየ
  choice: जहाँ रहनेवाले
  rationale: यह उस स्थान में उपस्थित प्राणियों की ओर संकेत करता है। संक्षिप्त हिन्दी मूल के स्थानीय अर्थ को स्पष्ट रखती है।
- source_word: ከመ እሳት ዘይነድድ
  choice: धधकती हुई आग के समान
  rationale: मूल में स्पष्ट उपमा और जलती आग की तीव्र छवि है; ‘धधकती हुई आग’ उसे सजीव और स्वाभाविक हिन्दी में सुरक्षित रखती है।
- source_word: ወሶበ ይፈቅዱ
  choice: और जब भी वे चाहते
  rationale: यह इच्छा तथा बार-बार संभव होनेवाली परिस्थिति दोनों को व्यक्त करता है।
- source_word: ያስተርእዩ
  choice: दिखाई देते थे
  rationale: क्रिया में स्वयं को दृश्य करने या प्रकट होने का भाव हो सकता है। ‘दिखाई देते थे’ सहज हिन्दी है, जबकि अधिक सकर्मक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ከመ ሰብእ
  choice: मनुष्यों के समान
  rationale: यह उनकी मानवीय आकृति से तुलना करता है। ‘मनुष्य’ आधुनिक मानक हिन्दी में समावेशी और मूल के व्यापक मानव-संदर्भ के अनुकूल है।
theological_decisions:
- issue: अग्नि-समान प्राणियों की पहचान
  choice: उन्हें केवल ‘जहाँ रहनेवाले’ कहकर वर्णित किया गया है।
  alternative: स्वर्गदूत, आत्माएँ, या पहरुए
  rationale: इस पद में उनके स्वरूप का वर्णन है, पर उनके वर्ग का स्पष्ट नाम नहीं दिया गया। इसलिए संदर्भ से कोई विशिष्ट पहचान आरोपित नहीं की गई।
- issue: मानवीय रूप में प्रकट होने की क्रिया
  choice: ‘मनुष्यों के समान दिखाई देते थे’
  alternative: ‘अपने आपको मनुष्यों के समान दिखाते थे’
  rationale: मूल क्रिया प्रकट होने और स्वयं को दृश्य बनाने—दोनों भावों की अनुमति देती है। मुख्य पाठ में स्वाभाविक, अपेक्षाकृत तटस्थ रूप रखा गया है और सकर्मक छाया पादटिप्पणी में संरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘एक स्थान’ मूल की अभिव्यक्ति को बनाए रखता है; ‘धधकती हुई आग’ दृश्य की तीव्रता रखती है। प्राणियों की पहचान को अनिर्णीत छोड़ा गया है।
