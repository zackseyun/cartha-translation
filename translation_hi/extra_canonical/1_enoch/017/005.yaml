base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/005.yaml
  text: And I came to a river of fire[a], whose fire flowed like water, and it emptied into the great sea toward the west.
translation:
  language: hi
  text: और मैं आग की एक नदी के पास पहुँचा, जिसकी आग पानी के समान बहती थी, और वह पश्चिम की ओर बड़े समुद्र में जा मिलती थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम वाक्यांश का शाब्दिक अर्थ लगभग ‘अरब की दिशा में’ है। यहाँ इसका अनुवाद ‘पश्चिम की ओर’ किया गया है, क्योंकि यह अभिव्यक्ति पश्चिमी दिशा को भी सूचित कर सकती है; फिर भी कुछ लोग इसे अरब नामक भौगोलिक क्षेत्र का उल्लेख समझ सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: መጻእኩ
  choice: मैं ... पहुँचा
  rationale: दर्शन-यात्रा के क्रम में प्रथम पुरुष के आगमन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना दिशा को अनावश्यक रूप से निश्चित किए।
- source_word: ፈለገ እሳት
  choice: आग की एक नदी
  rationale: असंभव किंतु ठोस प्रलय-दर्शी दृश्य को रूपक बनाकर नरम किए बिना सुरक्षित रखता है।
- source_word: ዘይውሕዝ እሳቱ ከመ ማይ
  choice: जिसकी आग पानी के समान बहती थी
  rationale: सम्बन्धवाचक रचना, स्वामित्व और आग के पानी की तरह बहने की विचित्र उपमा—तीनों को स्पष्ट रूप से बनाए रखता है।
- source_word: ይትከዐው
  choice: जा मिलती थी
  rationale: किसी बड़ी जलराशि में उँडेल दिए जाने अथवा प्रवाहित होकर मिलने का भाव सहज हिन्दी में देता है।
- source_word: ባሕር ዐቢይ
  choice: महासागर
  rationale: शाब्दिक अर्थ ‘बड़ा समुद्र’ है; यहाँ विशाल जलराशि के संदर्भ में ‘महासागर’ आधुनिक हिन्दी में स्वाभाविक और अर्थानुकूल है।
- source_word: መንገለ ዐረብ
  choice: पश्चिम की ओर
  rationale: यह अभिव्यक्ति पश्चिमी दिशा का संकेत दे सकती है; भौगोलिक ‘अरब की ओर’ की सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: आग की नदी को प्रतीकात्मक न्याय के रूप में समझाया जाए या दर्शन में देखे गए भू-दृश्य के रूप में रहने दिया जाए
  choice: 'इसे दर्शन में प्रत्यक्ष दिखाई देने वाले दृश्य की तरह अनूदित किया गया है: ‘आग की एक नदी, जिसकी आग पानी के समान बहती थी।’'
  alternative: इसे न्याय अथवा दण्ड का रूपक मानकर व्याख्यात्मक भाषा में अनूदित करना।
  rationale: मूल पाठ इस दृश्य का अर्थ नहीं समझाता, बल्कि उसे देखी हुई वास्तविकता की तरह प्रस्तुत करता है; इसलिए अनुवाद को उसकी प्रलय-दर्शी विचित्रता और धार्मिक तनाव बनाए रखना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘महासागर’ विशाल ‘बड़े समुद्र’ का स्वाभाविक हिन्दी रूप है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में सम्बद्ध अंतिम दिशा-वाक्यांश के बाद रखा गया है।
