translation:
  language: hi
  text: और वहाँ से मैं पूर्व की ओर, मरुभूमि के पर्वतों के बीच गया। मैंने एक निर्जन और एकांत उजाड़ प्रदेश देखा, जो पेड़-पौधों से भरा था। इस बीज[a] के ऊपर से पानी फूट निकल रहा था, और उसके ऊपर बहुत-सी जलधाराएँ दिखाई देती थीं, जो प्रचुर प्रवाह की तरह उत्तर-पश्चिम[b] की ओर बह रही थीं; और हर ओर से पानी और ओस ऊपर उठ रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस बीज से/के”; संदर्भ में यह बोई हुई या उगी हुई वनस्पति की ओर भी संकेत कर सकता है।
    reason: lexical_ambiguity
  - marker: b
    text: शाब्दिक रूप से, “उत्तर की ओर, पश्चिम की ओर।”
    reason: directional_syntax
lexical_decisions:
- source_word: መንገለ ጽባሕ
  choice: पूर्व की ओर
  rationale: መንገለ दिशासूचक संबंधबोधक है और ጽባሕ यहाँ पूर्व दिशा को सूचित करता है; इसलिए इसे किसी ‘मार्ग’ या ‘यात्रा’ के रूप में नहीं लिया गया।
- source_word: ደብረ መድበራ
  choice: निर्जन प्रदेश की पर्वतमाला
  rationale: ደብር पर्वत अथवा पर्वतीय क्षेत्र और መድበር निर्जन/मरु प्रदेश को दर्शाता है। ‘पर्वतमाला’ प्रसंग के भू-दृश्य को सहज हिन्दी में व्यक्त करता है।
- source_word: ገዳመ ባሕቲቶ ወባሕቱ
  choice: एक सुनसान और एकांत मरुभूमि
  rationale: मूल में निर्जनता और अकेलेपन पर निकटार्थी शब्दों द्वारा बल दिया गया है; हिन्दी में दोनों भाव बनाए रखे गए हैं।
- source_word: ዕፀወ
  choice: पेड़-पौधे
  rationale: यह सामूहिक रूप से वृक्षों अथवा वनस्पति को सूचित कर सकता है। ‘पेड़-पौधे’ सामान्य पाठक के लिए इस व्यापक अर्थ को स्वाभाविक ढंग से रखता है।
- source_word: ዘርዕ
  choice: रोपण
  rationale: शब्द का मूल अर्थ ‘बीज’ है, पर यहाँ आसपास की वनस्पति या लगाए/उगे हुए पौधों का सामूहिक संकेत संभव है। ‘रोपण’ प्रसंग में समझने योग्य है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: ይፈለፍል
  choice: फूट रहा था
  rationale: क्रिया पानी के फूट निकलने या उमड़ने का बिंब देती है; हिन्दी में ‘पानी फूट रहा था’ स्वाभाविक और सजीव है।
- source_word: አስራብ
  choice: जलधाराएँ
  rationale: संदर्भ में बहते पानी की धाराएँ या प्रवाह अभिप्रेत हैं। बहुवचन को हिन्दी में बनाए रखा गया है।
- source_word: መንገለ መስዕ መንገለ ዐረብ
  choice: उत्तर-पश्चिम की ओर
  rationale: मूल क्रमशः उत्तर और पश्चिम की दिशा बताता है; संयुक्त दिशा को आधुनिक हिन्दी में ‘उत्तर-पश्चिम’ कहना स्वाभाविक है।
- source_word: ማይ ወጠል
  choice: पानी और ओस
  rationale: दोनों संज्ञाओं को उनके सामान्य प्रत्यक्ष अर्थ में रखा गया है; उन्हें ‘बादल’ या ‘कुहरा’ बनाकर अर्थ का विस्तार नहीं किया गया।
