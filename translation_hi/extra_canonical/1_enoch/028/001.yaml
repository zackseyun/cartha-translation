  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। स्रोत के पूर्ण पाठ का अनुवाद किया गया है; अंग्रेज़ी परामर्श-पाठ की त्रुटिपूर्ण संक्षिप्तता का अनुसरण नहीं किया गया। असामान्य ‘बीज/रोपण’ और दिशासूचक वाक्य-विन्यास को पादटिप्पणियों में स्पष्ट करते हुए मूल की अनिश्चितता सुरक्षित रखी गई है।
