- source_word: ወከዋክብተ ሰማይ
  choice: और आकाश के तारे
  rationale: ऊँची किंतु स्वाभाविक हिन्दी में सामान्य खगोलीय अभिव्यक्ति।
- source_word: ከመ ይጼውዖሙ
  choice: कि वह ... पुकारता है
  rationale: देखी गई क्रिया को प्रस्तुत करता है; वर्तमानकाल स्रोत के दृश्यात्मक प्रभाव को रखता है।
- source_word: ለኵሎሙ
  choice: उन सबको
