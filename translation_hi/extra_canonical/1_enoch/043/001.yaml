  choice: 'व्यक्तिपरक चित्रण बनाए रखा गया: वह उन्हें नाम से पुकारता है और वे उसकी सुनते हैं।'
  alternative: वह उन्हें नाम लेकर बुलाता है और वे उसकी आज्ञा मानते हैं।
  rationale: पाठ की प्रलयदर्शी व्यक्तिपरकता को न तो मात्र रूपक में घटाया गया है, न स्पष्ट देवदूत-विज्ञान में बदला गया है।
