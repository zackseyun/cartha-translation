base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/043/001.yaml
  text: And I saw other lightnings and the stars of heaven[a], and I saw how he calls them all by their respective names[d][c][b], and they hear him.
translation:
  language: hi
  text: और मैंने बिजली की अन्य चमकें और आकाश के तारे देखे, और मैंने देखा कि वह उन सबको उनके अलग-अलग नामों से पुकारता है, और वे उसे सुनते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘वे उसे सुनते हैं’; प्रसंग में इससे उसके प्रति प्रत्युत्तर या आज्ञापालन भी सूचित हो सकता है।
    reason: lexical_alternative
