  choice: उनके अपने-अपने नाम से
  rationale: दोहराए हुए पूर्वसर्ग का वितरणात्मक भाव ‘अपने-अपने’ से स्पष्ट और स्वाभाविक रूप में व्यक्त होता है।
- source_word: ወይሰምዕዎ
  choice: और वे उसकी सुनते हैं
  rationale: मूल क्रिया का आधारभूत अर्थ ‘सुनना’ सुरक्षित रहता है, जबकि हिन्दी मुहावरा प्रसंग में प्रत्युत्तर और आज्ञापालन की संभावित छाया भी वहन करता है।
theological_decisions:
