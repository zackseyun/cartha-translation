base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/043/004.yaml
  text: 'And he said to me[d][c][b][a], “The Lord of Spirits has shown you their names: these are the names of the holy ones who dwell upon the dry ground and believe in the name of the Lord of Spirits forever and ever.”'
translation:
  language: hi
  text: और उसने मुझसे कहा, “आत्माओं के प्रभु ने तुम्हें उनका प्रतिरूप[a] दिखाया है। ये उन पवित्र जनों के नाम हैं जो सूखी धरती[b] पर रहते हैं और आत्माओं के प्रभु के नाम पर विश्वास करते हैं[c], युगानुयुग।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इथियोपिक पाठ के इस पदबंध का अर्थ सम्भवतः “उनका प्रतिरूप” है। लिखित रूप को “उनके साथ” या अधिक ढीले अर्थ में “उनके विषय में” भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक अर्थ “सूखी भूमि” है; यह दर्शन में पृथ्वी पर रहने वालों और स्वर्गीय प्राणियों के बीच भेद को उभार सकता है।
    reason: lexical_alternative
  - marker: c
    text: अथवा “आत्माओं के प्रभु के नाम पर भरोसा करते हैं।” इथियोपिक क्रिया विश्वास और भरोसा—दोनों अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይቤለኒ
  choice: और उसने मुझसे कहा
  rationale: यह सामान्य कथात्मक वचन-सूत्र है और दर्शन के प्रत्यक्ष वर्णन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ምስለ ዘዚአሆሙ
  choice: उनका प्रतिरूप
  rationale: यहाँ ምስለ को ምስል (‘रूप, समानता, प्रतिरूप’) की संबंधसूचक अवस्था मानना वाक्य और दर्शन के संदर्भ में सबसे संगत है; फिर भी लिखित रूप को पूर्वसर्ग ‘साथ’ के रूप में पढ़ने की संभावना टिप्पणी में सुरक्षित रखी गई है।
- source_word: እግዚአ መንፈሳት
  choice: प्रभु, जो आत्माओं का स्वामी है / आत्माओं का प्रभु
  rationale: यह 1 हनोक में प्रयुक्त विशिष्ट ईश्वरीय उपाधि है। पहले प्रयोग में व्याख्यात्मक हिन्दी से अर्थ स्पष्ट किया गया है और अगले प्रयोग में संक्षिप्त उपाधि रखी गई है।
- source_word: አርአየከ
  choice: तुम्हें दिखा चुका है
  rationale: क्रिया का पूर्णतासूचक और प्रकाशनात्मक बल सुरक्षित रहता है तथा हिन्दी में पूर्व दर्शन की ओर संकेत स्वाभाविक बनता है।
- source_word: እሉ እሙንቱ አስማቲሆሙ ለቅዱሳን
  choice: ये उन पवित्र जनों के नाम हैं
  rationale: प्रत्याशित सर्वनाम-प्रत्यय और ለ-युक्त संबंध को हिन्दी में स्वाभाविक संबंधकारक वाक्यांश के रूप में व्यक्त किया गया है।
- source_word: እለ የኃድሩ ዲበ የብስ
  choice: जो सूखी धरती पर रहते हैं
  rationale: የብስ का ठोस अर्थ ‘सूखी भूमि/धरती’ रखा गया है, जिससे स्वर्गीय दृश्य और पृथ्वी पर रहने वालों के बीच संभावित विरोध बना रहता है।
- source_word: ወየአምኑ በስሙ
  choice: और ... के नाम पर विश्वास रखते हैं
  rationale: क्रिया में विश्वास और भरोसे दोनों की अर्थ-छाया है; ‘विश्वास रखते हैं’ धार्मिक मुहावरे को स्वाभाविक हिन्दी में बिना अतिरिक्त सिद्धान्त जोड़े व्यक्त करता है।
- source_word: ለዓለመ ዓለም
  choice: युगानुयुग
  rationale: अनन्त अवधि के बलाघाती सूत्र को संक्षिप्त, प्रतिष्ठित और समझने योग्य हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: सूखी धरती पर रहने वाले ‘पवित्र जनों’ की पहचान
  choice: वाक्य को पृथ्वी पर रहने वाले विश्वासी पवित्र जनों की ओर संकेत करने दिया गया है
  alternative: स्वर्गदूत पवित्र जन, अथवा पृथ्वी और स्वर्ग दोनों के पवित्र जनों को जोड़ता हुआ संदर्भ
  rationale: ‘सूखी धरती पर रहते हैं’ और ‘नाम पर विश्वास रखते हैं’ मनुष्यों की ओर सबसे स्वाभाविक संकेत करते हैं, पर अनुवाद ने पहचान को व्याख्यात्मक शब्द जोड़कर सीमित नहीं किया।
- issue: 'दिखाई गई वस्तु: प्रतिरूप या साथ उपस्थित वस्तुएँ'
  choice: उनका प्रतिरूप
  alternative: उनके साथ / उनके विषय में
  rationale: ምስለ को ‘प्रतिरूप’ अर्थ वाले संज्ञा-रूप के रूप में पढ़ने पर वाक्य का व्याकरण और दृष्टान्तात्मक संदर्भ अधिक सुसंगत है; पाठरूप की वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु अपोकैलिप्टिक गरिमा बनाए रखती है। ‘पवित्र जन’, ‘सूखी धरती’ और ‘युगानुयुग’ जैसे पद सामान्य पाठक के लिए बोधगम्य रहते हुए मूल की छवि और लय सुरक्षित रखते हैं। ईश्वरीय उपाधि के पहले प्रयोग को अर्थ-स्पष्टता हेतु थोड़ा खोला गया है।
