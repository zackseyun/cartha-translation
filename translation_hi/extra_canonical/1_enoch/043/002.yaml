base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/043/002.yaml
  text: And I saw the balances of righteousness[a], how they are weighed according to their lights, the width of their places, and the day of their appearing; and their revolution brings forth lightning, and their revolution is according to the number of the angels[e][d][c][b], and they keep faith with one another.
translation:
  language: hi
  text: और मैंने धार्मिकता के तराज़ू देखे[a]—वे अपने प्रकाशों के अनुसार कैसे तौले जाते हैं, उनके स्थानों का विस्तार कितना है, और उनके प्रकट होने का दिन क्या है; उनका परिभ्रमण बिजली उत्पन्न करता है, और उनका परिभ्रमण स्वर्गदूतों की संख्या के अनुसार होता है[b]; और वे एक-दूसरे के प्रति निष्ठावान बने रहते हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरंभिक वाक्यांश कठिन है। उपलब्ध गीइज़ पाठ और उसके संशोधित पाठ-पठन में यहाँ ‘धार्मिकता के तराज़ू’ और ‘तौले जाते हैं’ आता है; पुराने अनुवाद इसे धार्मिकता की ज्योतियों के सुव्यवस्थित विभाजन के रूप में समझते थे।
    reason: textual_variant
  - marker: b
    text: ‘परिभ्रमण’ का अर्थ उनका मुड़ना, चक्कर या नियमित खगोलीय चक्र भी हो सकता है। ‘स्वर्गदूतों की संख्या के अनुसार’ वाक्यांश में मूल पाठ कोई अलग ‘गिने गए’ क्रिया नहीं देता।
    reason: lexical_alternative
  - marker: c
    text: 'अंतिम कथन का विषय अस्पष्ट है: इसका आशय यह हो सकता है कि स्वर्गीय पिंड एक-दूसरे के प्रति विश्वसनीय रहते हैं, या यह कि स्वर्गदूतों की गणना के अनुसार उनका क्रम विश्वसनीय रूप से बना रहता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: መዳልወ ጽድቅ
  choice: धार्मिकता के तराज़ू
  rationale: መዳልወ को ‘तराज़ू’ और ጽድቅ को संबंधकारक ‘धार्मिकता के’ के रूप में रखा गया है; इससे संशोधित स्रोत-पाठ का ठोस चित्र और उसकी असामान्य अभिव्यक्ति सुरक्षित रहती है।
- source_word: ይደለው
  choice: तौले जाते हैं
  rationale: क्रिया का तौलने से संबंधित निष्क्रिय अर्थ सीधे व्यक्त किया गया है।
- source_word: በብርሃናቲሆሙ
  choice: अपने प्रकाशों के अनुसार
  rationale: बहुवचन ‘प्रकाशों’ को बनाए रखा गया है और በ को संदर्भानुसार ‘के अनुसार’ कहा गया है।
- source_word: 'ርሐበ መካናቲሆሙ (transcription: ሰረኃበ መካናቲሆሙ)'
  choice: उनके स्थानों का विस्तार
  rationale: उपलब्ध संशोधन-साक्ष्य प्रतिलिपि/OCR में आए ሰረኃበ के पीछे ‘चौड़ाई/विस्तार’ पढ़ता है; स्वाभाविक हिन्दी के लिए ‘विस्तार’ चुना गया है।
- source_word: ዕለተ ክነቶሙ
  choice: उनके प्रकट होने का दिन
  rationale: ዕለተ का एकवचन ‘दिन’ और ክነቶሙ का संदर्भगत अर्थ ‘प्रकट होना’ रखा गया है।
- source_word: ሚጠቶሙ
  choice: उनका परिभ्रमण
  rationale: यह आवर्ती मोड़ या revolution को बताता है; ‘परिभ्रमण’ खगोलीय संदर्भ में स्पष्ट है और ‘ऋतु’ कहकर दूसरे काल-संबंधी पद में नहीं मिलाता।
- source_word: መብረቅ ይወልድ
  choice: बिजली उत्पन्न करता है
  rationale: शाब्दिक ‘बिजली को जन्म देता है’ के चित्र को सहज, गरिमापूर्ण हिन्दी में व्यक्त किया गया है।
- source_word: በኍልቈ መላእክት
  choice: स्वर्गदूतों की संख्या के अनुसार
  rationale: पूर्वसर्गीय वाक्यांश में कोई अतिरिक्त ‘गिना गया’ क्रिया नहीं जोड़ी गई; መላእክት के लिए इस स्वर्गीय संदर्भ में ‘स्वर्गदूत’ उपयुक्त है।
- source_word: ሃይማኖቶሙ የዓቅቡ በበይናቲሆሙ
  choice: वे एक-दूसरे के प्रति निष्ठा बनाए रखते हैं
  rationale: परस्पर विश्वसनीयता और नियमितता दोनों का भाव सुरक्षित रहता है, जबकि विषय की पहचान को अनावश्यक रूप से निश्चित नहीं किया गया।
theological_decisions:
- issue: ‘धार्मिकता के तराज़ू’ की पहचान
  choice: असामान्य ब्रह्मांडीय पदबंध को ज्यों का त्यों रखा गया है।
  alternative: इसे ‘धर्मी ज्योतियाँ’ अथवा ‘धार्मिकता की ज्योतियाँ’ मानना।
  rationale: उपलब्ध संशोधित स्रोत-साक्ष्य መዳልወ को ‘तराज़ू’ और अगली क्रिया को ‘तौले जाते हैं’ समर्थन देता है; इसे परिचित खगोलीय संज्ञा में बदलना पाठ की कठिनता को मिटा देगा।
- issue: अंतिम वाक्यांश में ‘वे’ का संकेत
  choice: सर्वनाम को खुला रखा गया है और परस्पर निष्ठा के रूप में अनुवाद किया गया है।
  alternative: ‘स्वर्गदूत निष्ठावान रहते हैं’ या ‘खगोलीय पिंड परस्पर सामंजस्य रखते हैं।’
  rationale: व्याकरणिक संदर्भ स्वर्गदूतों और परिभ्रमण/स्वर्गीय इकाइयों के बीच कुछ अस्पष्टता छोड़ता है; अनुवाद किसी एक पहचान को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण अपोकैलिप्टिक शैली रखी गई है। ‘तराज़ू,’ ‘प्रकाश,’ ‘परिभ्रमण,’ और ‘निष्ठा’ जैसे शब्द मूल के ठोस तथा ब्रह्मांडीय बिंबों को बनाए रखते हैं। स्रोत की वास्तविक अस्पष्टताओं को मुख्य पाठ और संक्षिप्त टिप्पणियों में सुरक्षित रखा गया है।
