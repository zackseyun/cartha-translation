    reason: lexical_alternative
lexical_decisions:
- source_word: ተስእልክዎ
  choice: मैंने … से पूछा
  rationale: ሰአለ से बना यह क्रियारूप पूछने या जानने के लिए प्रश्न करने का अर्थ देता है। प्रत्यक्ष प्रश्न के संदर्भ में यह सहज और सटीक हिन्दी है।
- source_word: መልአክ
  choice: स्वर्गदूत
