- source_word: ዘየሐውር ምስሌየ
  choice: अपने साथ चलने वाले
  rationale: यह संबंधवाचक वाक्यांश हनोक के साथ यात्रा करने वाले स्वर्गदूत की पहचान कराता है और दर्शन में जारी गति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ዘአርአየኒ
  choice: जिसने मुझे … दिखाई थीं
  rationale: क्रिया का अर्थ ‘दिखाना’ या ‘देखने देना’ है। हिन्दी में पूर्ण पक्ष पूर्व में किए गए प्रकाशन को सहज ढंग से व्यक्त करता है।
- source_word: ኅቡእ
  choice: छिपी हुई बातें
  rationale: यह शब्द छिपी या गुप्त वास्तविकताओं की ओर संकेत करता है। बहुवचन हिन्दी में दर्शन में प्रकट की गई बातों के लिए स्वाभाविक है, जबकि पाठ की अर्थगत व्यापकता को सीमित नहीं करता।
- source_word: ምንት እሙንቱ እሉ
  choice: ये क्या हैं?
  rationale: संकेतवाचक पद दर्शन में अभी देखी गई वस्तुओं या घटनाओं की ओर सबसे स्वाभाविक रूप से संकेत करता है। ‘कौन’ की अपेक्षा ‘क्या’ पाठ के अवैयक्तिक संदर्भ के अनुकूल है।
theological_decisions:
- issue: दर्शन में प्रकट की गई छिपी वास्तविकताओं का वर्णन
  choice: छिपी हुई बातें
  alternative: गुप्त बातें / जो छिपा हुआ था
  rationale: ‘छिपी हुई बातें’ प्रकाशन से पहले ओझल रही स्वर्गीय वास्तविकताओं के भाव को बनाए रखता है, पर उन्हें किसी विशिष्ट गूढ़ सिद्धांत के रूप में परिभाषित नहीं करता।
