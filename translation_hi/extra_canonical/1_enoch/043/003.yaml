  text: And I asked the angel who went with me[a], who showed me what was hidden, “What are these?”
translation:
  language: hi
  text: और मैंने अपने साथ चलने वाले उस स्वर्गदूत से, जिसने मुझे छिपी हुई बातें[a] दिखाई थीं, पूछा, “ये क्या हैं?”
