base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/004.yaml
  text: 'And I looked at them and saw: behold[a], they all let out their private parts like horses, and they began to mount the cows; and they all conceived and gave birth to elephants, camels[c][b], and donkeys.'
translation:
  language: hi
  text: और मैंने उनकी ओर देखा और देखा—देखो, उन सबने घोड़ों के समान अपने जननांग बाहर निकाले[a] और गायों पर चढ़ने लगे। तब वे सब गर्भवती हुईं और उन्होंने हाथियों, ऊँटों और गधों को जन्म दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल गीइज़ अभिव्यक्ति यौन दृष्टि से स्पष्ट है और नर पशुओं द्वारा अपने जननांग बाहर निकालने की ओर संकेत करती है।
    reason: lexical_alternative
  - marker: b
    text: इस दर्शन में हाथी, ऊँट और गधे असामान्य संकर संतति के रूप में प्रकट होते हैं। यह पशु-दर्शन की प्रतीकात्मक छवि है, साधारण प्राणी-विज्ञान का वर्णन नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: ወነጸርክዎሙ
  choice: और मैंने उनकी ओर देखा
  rationale: दर्शन-वर्णन की प्रत्यक्ष दृश्यात्मकता बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति।
- source_word: ወርኢኩ ወነዋ
  choice: और मुझे दिखाई दिया—देखो
  rationale: मूल के दोहरे दर्शन-सूत्र को स्पष्ट रखा गया है; ‘देखो’ अकस्मात प्रकट दृश्य पर ध्यान खींचता है।
- source_word: አውፁኡ ንፍረታቲሆሙ
  choice: अपने जननांग बाहर निकाले
  rationale: कारक और दिशात्मक क्रिया के साथ मूल की स्पष्ट यौन छवि सुरक्षित रहती है; ‘जननांग’ शालीन किंतु अर्थतः स्पष्ट है।
- source_word: ከመ አፍራስ
  choice: घोड़ों के समान
  rationale: दर्शन की महत्त्वपूर्ण पशु-उपमा को अक्षरशः और गरिमापूर्ण ढंग से रखा गया है।
- source_word: ወአሐዙ ይዐረጉ
  choice: चढ़ने लगे
  rationale: शाब्दिक ‘ऊपर चढ़ना’ यहाँ पशु-संभोग का संकेत देता है; हिन्दी में यह मूल की छवि और संदर्भ दोनों सुरक्षित रखता है।
- source_word: ዲበ አንስት አልህምት
  choice: गायों पर
  rationale: አልህምት का अर्थ मादा गोवंश/गायें है, हाथिनियाँ नहीं; इससे पशु-दर्शन का क्रम सुरक्षित रहता है।
- source_word: ወጸንሳ
  choice: तब वे सब गर्भवती हुईं
  rationale: स्त्रीलिंग कर्ता को स्पष्ट करते हुए प्रजनन-क्रिया का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: ወወለዳ
  choice: और उन्होंने ... को जन्म दिया
  rationale: जन्म देने की क्रिया का स्पष्ट और सामान्य आधुनिक हिन्दी अनुवाद।
- source_word: ነጌያተ ወአገማሰ ወአእዳገ
  choice: हाथियों, ऊँटों और गधों
  rationale: मूल में नामित तीन संतति-प्रजातियों को बिना व्याख्यात्मक विस्तार के सीधे प्रस्तुत किया गया है।
theological_decisions:
- issue: पशु-दर्शन की यौन छवि कितनी स्पष्ट रखी जाए
  choice: ‘जननांग बाहर निकाले ... गायों पर चढ़ने लगे’ के रूप में स्पष्ट चित्रण
  alternative: सामान्य ‘संभोग करने लगे’ कहना या शरीर-अंग को अस्पष्ट करना
  rationale: मूल का अतिक्रमणकारी और चौंकाने वाला प्रतीकात्मक दृश्य अनुवाद में दबना नहीं चाहिए; फिर भी भाषा अश्लील न होकर गरिमापूर्ण रखी गई है।
- issue: दर्शन में उत्पन्न असामान्य संतति की व्याख्या
  choice: पाठ में केवल हाथी, ऊँट और गधे कहना; प्रतीकात्मक स्वरूप फुटनोट में बताना
  alternative: मुख्य पाठ में इन पशुओं को दैत्यों अथवा किसी निश्चित प्रतीक से पहचानना
  rationale: मुख्य पाठ मूल की पशु-छवि को बनाए रखता है और किसी संप्रदायगत या निजी व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। दर्शन-सूत्र और यौन प्रतीक की तीव्रता संरक्षित है; अनावश्यक अंग्रेज़ी-आधारित तीसरा फुटनोट हटाया गया क्योंकि संशोधित स्रोत-पाठ में አልህምት का अर्थ ‘गायें’ स्पष्ट है, ‘हाथिनियाँ’ नहीं।
