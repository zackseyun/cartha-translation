base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/005.yaml
  text: And all the cattle feared them and were terrified by them[b][a], and they began to bite with their teeth and to devour and to gore with their horns.
translation:
  language: hi
  text: और सारे मवेशी उनसे डर गए और उनके सामने आतंकित हो गए,[a][b] और वे अपने दाँतों से काटने, निगल जाने और अपने सींगों से बेधने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'गीज़ पाठ पशु-छवि को स्पष्ट रूप से बनाए रखता है: मवेशी डरते हैं और फिर दाँतों तथा सींगों से आक्रमण का वर्णन आता है। पद स्वयं इन पशुओं के प्रतीकात्मक संकेतार्थ नहीं बताता।'
    reason: cultural_note
  - marker: b
    text: या, “और सारे मवेशी उनसे डर गए और उनके कारण आतंकित हो गए, और वे अपने दाँतों से काटने, निगल जाने और अपने सींगों से बेधने लगे।”
    reason: translation_alternative
lexical_decisions:
- source_word: ኵሎሙ አልህምት
  choice: सारे मवेशी
  rationale: यह पूरे समूह को सूचित करता है और गोवंश/पशुधन की प्रत्यक्ष पशु-छवि बनाए रखता है; ‘मवेशी’ आधुनिक हिन्दी में स्वाभाविक और लिंग की दृष्टि से अनिर्दिष्ट है।
- source_word: ፈርህዎሙ
  choice: उनसे डर गए
  rationale: भय की सीधी क्रिया और बहुवचन कर्म-सर्वनाम को सहज हिन्दी में व्यक्त करता है।
- source_word: ወደንገፁ እምኔሆሙ
  choice: उनके सामने आतंकित हो गए
  rationale: दूसरी, अधिक तीव्र भय-क्रिया तथा እምኔሆሙ के ‘उनके सामने/उनकी उपस्थिति में’ स्थानिक भाव को सुरक्षित रखता है।
- source_word: ወአሐዙ
  choice: वे … लगे
  rationale: यह आरम्भसूचक रचना है; हिन्दी में ‘लगे’ आगामी क्रियाओं के आरम्भ को स्वाभाविक रूप से व्यक्त करता है। ‘वे’ स्रोत की बहुवचन कर्ता-सूचना को रखता है और इस पद में कर्ता की पहचान को व्याख्यात्मक रूप से नहीं भरता।
- source_word: ይኔክሱ በስኒሆሙ
  choice: अपने दाँतों से काटने
  rationale: काटने की ठोस पशु-क्रिया और दाँतों के साधनवाचक प्रयोग को बनाए रखता है।
- source_word: ይውሕጡ
  choice: निगल जाने
  rationale: मूल क्रिया के निगलने/भक्षण करने के हिंसक अर्थ को संक्षिप्त और चित्रात्मक हिन्दी में व्यक्त करता है।
- source_word: ይወግኡ በአቅርንቲሆሙ
  choice: अपने सींगों से बेधने
  rationale: सींगों द्वारा प्रहार और घायल करने की विशिष्ट छवि को सामान्य ‘मारने’ से अधिक सटीक ढंग से व्यक्त करता है।
theological_decisions:
- issue: प्रतीकात्मक पशु-छवि को रखना या उसके मानवीय संकेतार्थों को सीधे लिखना
  choice: मुख्य पाठ में ‘मवेशी’, ‘दाँत’ और ‘सींग’ की पशु-छवि को यथावत रखना
  alternative: पशुओं के स्थान पर उनसे संकेतित माने जाने वाले मानव-समूहों के नाम देना
  rationale: यह दर्शन निरन्तर पशु-प्रतीकों के माध्यम से बात करता है; पद स्वयं उनके संकेतार्थ स्पष्ट नहीं करता। व्याख्यात्मक पहचान जोड़ने से मूल का रहस्य और प्रतीकात्मक तनाव मिट जाएगा।
- issue: ‘वे … लगे’ के कर्ता की पहचान
  choice: स्रोत की तरह बहुवचन सर्वनाम रखना
  alternative: स्पष्ट रूप से ‘वे नए उत्पन्न पशु’ या ‘मवेशी’ लिखना
  rationale: क्रिया में बहुवचन कर्ता निहित है, पर इस पद में संज्ञा दोबारा नहीं दी गई। निकटवर्ती सन्दर्भ आक्रमणकारियों की ओर संकेत कर सकता है, फिर भी मुख्य पाठ में पहचान जोड़ना मूल से अधिक स्पष्टता लाता; इसलिए संदर्भगत अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण पर सामान्य पाठक के लिए सहज रखी गई है। ‘मवेशी’ पशु-प्रतीक को बिना अनावश्यक जैविक विशिष्टता के व्यक्त करता है। वाक्य की आवृत्तिमूलक लय और हिंसक पशु-क्रियाएँ सुरक्षित हैं; सर्वनाम का संभावित संदर्भ जानबूझकर व्याख्यात्मक रूप से निश्चित नहीं किया गया।
