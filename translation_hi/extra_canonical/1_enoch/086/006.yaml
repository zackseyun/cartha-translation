  text: And they began again to devour those cattle[a], and behold[c][b], all the children of the earth began [to tremble and flee].
translation:
  language: hi
  text: और वे फिर उन मवेशियों[a] को निगलने लगे। और देखो, पृथ्वी की सारी संतानें[b] [काँपने और भागने लगीं]।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल गीइज़ शब्द का अर्थ ‘मवेशी’ या विशेष रूप से ‘गोवंश’ हो सकता है; यहाँ इसका अर्थ ‘हाथी’ नहीं है।
    reason: lexical_alternative
  - marker: b
    text: ‘पृथ्वी की संतानें’ प्रलयदर्शी शैली की मूल अभिव्यक्ति है; इसका आशय ‘पृथ्वी के निवासी’ भी समझा जा सकता है।
    reason: cultural_note
  - marker: c
    text: प्रदत्त गीइज़ पद-पाठ आरम्भसूचक क्रिया (‘आरम्भ किया/लगे’) पर समाप्त होता है। वर्ग कोष्ठकों के शब्द प्रमाणित विस्तृत पाठ के आधार पर वाक्य को पूरा करते हैं।
    reason: textual_note
