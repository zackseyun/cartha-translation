  choice: पृथ्वी की सारी संतानें
  rationale: मूल के प्रलयदर्शी मुहावरे को अक्षरशः निकट रखते हुए इसे केवल ‘पृथ्वी के निवासी’ बनाकर व्याख्यायित नहीं किया गया।
- source_word: '[ይርዐዱ ወይርወጹ]'
  choice: '[काँपने और भागने लगीं]'
  rationale: प्रदत्त पद-पाठ ‘आरम्भ किया’ पर अधूरा समाप्त होता है। कोष्ठकों में दिया गया पूरक उपलब्ध संशोधित पाठ-साक्ष्य के अनुसार वाक्य पूरा करता है और पाठक को इसकी पुनर्स्थापित स्थिति स्पष्ट दिखाता है।
