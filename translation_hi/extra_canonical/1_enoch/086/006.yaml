  rationale: शाब्दिक अभिव्यक्ति प्रलयदर्शी भाषा की व्यापकता और संभावित प्रतीकात्मक तनाव को बचाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण कथन रखा गया है। ‘और देखो’ से दर्शनात्मक आकस्मिकता तथा ‘निगलने’ से हिंसक पशु-चित्र सुरक्षित रहता है। स्त्रीलिंग बहुवचन ‘लगीं’ का संबंध ‘संतानें’ से है। वर्ग कोष्ठक पाठीय पुनर्स्थापन को पारदर्शी बनाते हैं।
