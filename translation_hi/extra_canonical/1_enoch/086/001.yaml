  choice: मैंने … अपनी आँखों से देखा। मैंने … देखा
  rationale: मूल में देखने की क्रिया दोहराई गई है; दोनों को रखकर दर्शन-वर्णन की लय सुरक्षित रखी गई है।
- source_word: እንዘ እነውም
  choice: सोते समय
  rationale: यह स्पष्ट करता है कि दर्शन नींद में देखा गया था, बिना उसे अतिरिक्त व्याख्यात्मक शब्दावली देने के।
- source_word: ሰማየ መልዕልተ
  choice: ऊपर आकाश
  rationale: स्थानसूचक ऊँचाई को सरल, वर्तमान हिन्दी में व्यक्त करता है और किसी विस्तृत ब्रह्मांड-विज्ञान को आरोपित नहीं करता।
- source_word: ነዋ
  choice: देखो
  rationale: अचानक सामने आए विलक्षण दृश्य की ओर ध्यान खींचने वाले उद्गार का स्वाभाविक हिन्दी रूप।
- source_word: ኮከብ አሐዱ
  choice: एक तारा
  rationale: संख्या और दृश्य-प्रतीक दोनों को ठीक उसी रूप में रखता है; इसे मुख्य पाठ में स्वर्गदूत कहकर नहीं समझाया गया।
- source_word: ወድቀ እምሰማይ
  choice: आकाश से गिरा
  rationale: नीचे आने की मूल, सजीव गति को बनाए रखता है; ‘उतरा’ की तुलना में ‘गिरा’ स्रोत के अधिक निकट है।
- source_word: ወይትሌዐል
  choice: वह उठा
  rationale: गिरने के बाद उठने की क्रमिक क्रिया को रखता है और यह तय नहीं करता कि वह स्वयं उठा या उठाया गया।
- source_word: ወይበልዕ ወይትረዐይ
  choice: खाया और चरा
  rationale: दो अलग क्रियाओं को अलग रखा गया है, जिससे पशु-दर्शन की असामान्य किन्तु अर्थपूर्ण छवि सुरक्षित रहती है।
- source_word: ማእከለ እልከቱ አልህምት
  choice: उन मवेशियों के बीच
  rationale: አልህምት सामान्यतः गोवंशीय पशुओं के बहुवचन को दर्शाता है; ‘मवेशी’ लिंग या आयु को अनावश्यक रूप से निश्चित किए बिना हिन्दी में स्वाभाविक सामूहिक पद है।
theological_decisions:
- issue: क्या ‘तारे’ को मुख्य पाठ में स्वर्गदूत या स्वर्गीय प्राणी के रूप में स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘एक तारा’ रखा गया है।
  alternative: ‘एक स्वर्गदूत’ या ‘एक स्वर्गीय प्राणी’
  rationale: हनोक के पशु-दर्शन में तारे स्वर्गीय प्राणियों के प्रतीक हो सकते हैं, पर इस पद का प्रत्यक्ष दृश्य ‘तारा’ ही कहता है। प्रतीक को अनूदित करने के बजाय उसकी व्याख्या पाठक और व्यापक संदर्भ के लिए खुली रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर ‘और देखो’ तथा दोहराए गए ‘देखा’ द्वारा अपोकैलिप्टिक दर्शन की गरिमामय और क्रमिक शैली बनाए रखी गई है। असामान्य दृश्य—तारे का उठना, खाना और चरना—को सहज बनाने के लिए प्रतीकात्मक अर्थ में नहीं बदला गया।
