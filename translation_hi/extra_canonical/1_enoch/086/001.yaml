base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/001.yaml
  text: And again I looked with my eyes while I was sleeping[a], and I saw heaven above, and behold, one star fell from heaven[c][b], and it arose and ate and grazed in the midst of those cattle.
translation:
  language: hi
  text: फिर, जब मैं सो रहा था, मैंने अपनी आँखों से देखा, और मैंने ऊपर का आकाश देखा; और देखो, एक तारा आकाश से गिरा[a]। वह उठा और उन मवेशियों[c] के बीच खाने और चरने लगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पशु-रूपक दर्शन में तारे प्रायः स्वर्गीय प्राणियों के प्रतीक होते हैं, पर इस पद में प्रत्यक्ष शब्द ‘तारा’ ही है।
    reason: cross_reference
  - marker: b
    text: 'मूल में दो अलग क्रियाएँ हैं: ‘खाना’ और ‘चरना।’ अनुवाद पशु-संबंधी दृश्य को एक ही क्रिया में नहीं समेटता।'
    reason: lexical_alternative
  - marker: c
    text: अर्थात गोवंशीय पशु; यहाँ शब्द का अर्थ ‘बछड़े’ तक सीमित नहीं है।
    reason: lexical_clarification
lexical_decisions:
