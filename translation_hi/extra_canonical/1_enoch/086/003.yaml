base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/003.yaml
  text: And again I saw in the vision[a], and I looked up to heaven; and behold, I saw many stars. They came down and were cast from heaven to that first star, and among those calves they became bulls[d][c][b], and they pastured with them.
translation:
  language: hi
  text: और फिर मैंने दर्शन में देखा और स्वर्ग की ओर दृष्टि की। और देखो, मैंने बहुत-से तारे देखे। वे नीचे उतरे और स्वर्ग से उस पहले तारे के पास फेंक दिए गए। उन बछियों के बीच वे साँड़ बन गए और उनके साथ चरने लगे।[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उस पहले तारे” से सम्भवतः दर्शन में पहले बताए गए तारे की ओर संकेत है।
    reason: cross_reference
  - marker: b
    text: दर्शन में “तारे” स्वर्गीय प्राणियों के प्रतीक हो सकते हैं, पर मुख्य पाठ मूल दृश्य-रूप को ही बनाए रखता है।
    reason: lexical_alternative
  - marker: c
    text: अंतिम क्रिया का अर्थ यहाँ “उनके साथ चरने लगे” लिया गया है। समान वर्तनी के कारण इसे कभी-कभी “उनके बीच दिखाई दिए” भी समझा गया है।
    reason: textual_difficulty
lexical_decisions:
- source_word: ወካዕበ፡ ርኢኩ፡ በራእይ
  choice: और फिर मैंने दर्शन में देखा
  rationale: दृश्य के नए चरण को आरम्भ करने वाली पुनरावर्ती कथन-शैली और दर्शन का स्पष्ट संकेत दोनों सुरक्षित रखे गए हैं।
- source_word: ነጸርክዎ፡ ለሰማይ
  choice: स्वर्ग की ओर दृष्टि की
  rationale: दिशा की ओर ध्यानपूर्वक देखने का भाव सहज और गरिमापूर्ण हिन्दी में व्यक्त होता है।
- source_word: ነዋ
  choice: और देखो
  rationale: दर्शनीय घटना की आकस्मिकता और अपोकैलिप्टिक सजीवता बनाए रखता है।
- source_word: ከዋክብተ፡ ብዙኃነ
  choice: बहुत-से तारे
  rationale: मूल बहुवचन का सीधा, स्वाभाविक अनुवाद है; प्रतीक का अर्थ मुख्य पाठ में नहीं खोला गया।
- source_word: ወረዱ፡ ወተገደፉ፡ እምሰማይ
  choice: वे नीचे उतरे और स्वर्ग से ... फेंक दिए गए
  rationale: पहली क्रिया अवरोह और दूसरी कर्मवाच्य बलपूर्वक निष्कासन सूचित करती है; दोनों अलग-अलग रखी गई हैं।
- source_word: በኀበ፡ ዝኩ፡ ኮከብ፡ ቀዳማዊ
  choice: उस पहले तारे के पास
  rationale: संकेतवाचक और क्रमवाचक रूप को सुरक्षित रखते हुए पहले उल्लेखित तारे की ओर संकेत रहने दिया गया है।
- source_word: ማእከለ፡ እልኩ፡ ጣዕዋ
  choice: उन बछियों के बीच
  rationale: ጣዕዋ को बछियाँ/कम उम्र की मादा गौएँ समझना पशु-दर्शन के प्रसंग और रूपान्तरण के अगले कथन के अनुकूल है।
- source_word: አልህምት፡ ኮኑ
  choice: वे साँड़ बन गए
  rationale: यहाँ गौवंशीय नर पशुओं में रूपान्तरण अभिप्रेत है; ‘घोड़े’ शब्द मूल से समर्थित नहीं है।
- source_word: ወምስሌሆሙ፡ ይትረዓዩ
  choice: और उनके साथ चरने लगे
  rationale: क्रिया को चरने/चरागाह में रहने से संबंधित धातु से लिया गया है, न कि ‘दिखाई देना’ अर्थ वाली समान रूपवाली धातु से।
theological_decisions:
- issue: तारों की पहचान
  choice: मुख्य पाठ में ‘तारे’ ही रखा गया है।
  alternative: स्वर्गदूत या स्वर्गीय प्राणी
  rationale: दर्शन में प्रयुक्त प्रतीक को सीधे किसी विशिष्ट सत्ता के रूप में व्याख्यायित करना मूल की अर्थगत खुलावट को समाप्त कर देता।
- issue: स्वर्ग से उतरने का स्वरूप
  choice: ‘नीचे उतरे’ और ‘फेंक दिए गए’ दोनों क्रियाएँ रखी गई हैं।
  alternative: केवल ‘गिर पड़े’
  rationale: मूल में अवरोह के साथ कर्मवाच्य, बलपूर्ण निष्कासन भी व्यक्त है; केवल ‘गिरे’ कहना इस तनाव को कम कर देता।
- issue: पशुओं का लिंग और प्रतीकात्मक रूपान्तरण
  choice: ‘बछियों’ और ‘साँड़’ के रूप में अनुवाद किया गया है।
  alternative: लिंग-निरपेक्ष ‘बछड़े’ और व्यापक ‘मवेशी’
  rationale: पशु-दर्शन के प्रसंग में यह भेद अर्थपूर्ण है, किंतु इससे प्रतीकात्मक पात्रों की धार्मिक पहचान मुख्य पाठ में निर्धारित नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण कथन-शैली अपनाई गई है। ‘देखो’ से दर्शन की सजीवता और ‘स्वर्ग’ से पारंपरिक धार्मिक पदावली बनी रहती है। पशु-संबंधी शब्द ठोस रखे गए हैं और प्रतीकों की पहचान अनुवाद में नहीं थोपी गई।
