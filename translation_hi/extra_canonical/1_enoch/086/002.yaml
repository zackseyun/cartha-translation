base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/002.yaml
  text: And after that I saw large and black cattle[a], and behold, all of them changed their stalls and their pastures and their calves[c][b], and they began to live with one another.
translation:
  language: hi
  text: इसके बाद मैंने बड़े काले मवेशी देखे; और देखो, उन सबने अपने बाड़े, चरागाह और बछड़े बदल दिए[a], और वे एक-दूसरे के साथ रहने लगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अपने बाड़े, चरागाह और बछड़े ‘बदल देने’ वाला यह वाक्यांश मूल पाठ में पाठ्य और अर्थ की दृष्टि से कठिन है। गीइज़ पाठ में स्थानों और संतानों को परिवर्तन या बदलाव सूचित करने वाली एक ही क्रिया के साथ रखा गया है। व्यापक अर्थ यह भी हो सकता है: ‘उन्होंने अपने निवास-स्थानों, चरने के स्थानों और बच्चों को बदल दिया।’'
    reason: textual_variant
  - marker: b
    text: या, ‘वे साथ-साथ रहने लगे’ अथवा ‘वे एक-दूसरे के साथ बस गए।’
    reason: lexical_alternative
lexical_decisions:
- source_word: አልህምተ
  choice: मवेशी
  rationale: पशु-दर्शन में गोवंशीय सामूहिक बिंब को बनाए रखता है और लिंग को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ዐቢያነ
  choice: बड़े-बड़े
  rationale: दृष्टि में पशुओं के आकार और प्रभाव को ठोस, सहज हिन्दी में व्यक्त करता है।
- source_word: ጸሊማነ
  choice: काले
  rationale: यह रंग-सूचक शब्द यहाँ अन्य रंगों के प्रतीकात्मक विरोध से जुड़ा है; इसलिए अस्पष्ट ‘गहरे रंग के’ के बजाय स्पष्ट ‘काले’ उपयुक्त है।
- source_word: ወለጡ
  choice: बदल लिए
  rationale: क्रिया परिवर्तन या अदला-बदली का संकेत देती है; कठिन संयुक्त कर्मों के साथ इसकी व्यापकता को सुरक्षित रखा गया है।
- source_word: ምዕያኖሙ
  choice: अपने बाड़े
  rationale: पशुपालक बिंब के भीतर पशुओं के रहने या रखे जाने के स्थान का स्वाभाविक हिन्दी रूप।
- source_word: ምርጓዮሙ
  choice: अपने चरागाह
  rationale: चरने या भोजन पाने के स्थान का स्पष्ट और परिचित पशुपालक शब्द।
- source_word: አጥዐጥሆሙ
  choice: अपने बछड़े
  rationale: गोवंशीय संदर्भ में संतान के लिए विशिष्ट शब्द रखा गया है, यद्यपि व्यापक अर्थ ‘बच्चे’ संभव है।
- source_word: አሐዙ ተየሐይዉ ፩ ለካልኡ
  choice: वे एक-दूसरे के साथ रहने लगे
  rationale: आरंभसूचक बल और परस्पर सहवास, दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: पशुओं के प्रतीकात्मक मानवीय अभिप्राय को अनुवाद में स्पष्ट करना या न करना
  choice: मुख्य पाठ में पशु-बिंब को ज्यों का त्यों रखा गया
  alternative: मानवीय समुदायों की ओर संकेत करते हुए व्याख्यात्मक अनुवाद करना
  rationale: यह स्वप्न-दर्शन प्रतीकात्मक पशु-चित्रों के द्वारा बात करता है; उनके अभिप्राय को मुख्य पाठ में जोड़ना अनुवाद के बजाय व्याख्या होगा।
- issue: ጸሊማነ के रंग-सूचक बल को सामान्य बनाना या स्पष्ट रखना
  choice: ‘काले’
  alternative: ‘गहरे रंग के’ या ‘साँवले’
  rationale: इस दर्शन में रंगों का योजनाबद्ध प्रतीकात्मक विरोध है; स्पष्ट रंग को बनाए रखना पाठ की साहित्यिक और धर्मवैचारिक तन्यता सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘देखो’ से दर्शन की आकस्मिकता और बल बना रहता है। पशुपालक शब्दावली को जानबूझकर सुरक्षित रखा गया है, और कठिन गीइज़ वाक्य-संरचना को पादटिप्पणी में स्पष्ट किया गया है।
