base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/029/002.yaml
  text: And there I saw trees of incense[a], with the fragrance of frankincense and myrrh, and trees also[c][b],
translation:
  language: hi
  text: और वहाँ मैंने धूप देनेवाले वृक्ष देखे, जिनसे लोबान और गन्धरस की सुगन्ध आती थी[a]; और वृक्ष भी—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पद के बीच का पाठ, विशेषकर कोष्ठक में दिया गया शब्द, अनिश्चित है। भाव यह है कि वृक्षों से मनोहर या प्रबल सुगन्ध निकलती थी; इसे ‘बहुत सुहावनी’ अथवा ‘मसालेदार सुगन्ध’ भी समझा जा सकता है।
    reason: textual_variant
  - marker: b
    text: इस साक्षी में अन्तिम शब्द कठिन और वाक्य अधूरा है। सम्भव है कि यहाँ अन्य वृक्षों का भी उल्लेख आरम्भ होता हो; इसलिए अनुवाद ने आगे का विवरण नहीं जोड़ा है।
    reason: alternative_reading
lexical_decisions:
- source_word: ወበህየ፡ ርኢኩ
  choice: और वहाँ मैंने ... देखे
  rationale: दर्शन-वर्णन के सामान्य स्थानवाचक और प्रथम-पुरुष सूत्र को सहज आधुनिक हिन्दी में रखा गया है।
- source_word: ዕፀወ፡ ተኵነኔ
  choice: धूप देनेवाले वृक्ष
  rationale: सन्दर्भ सुगन्धित राल अथवा धूप से जुड़े वृक्षों का है। यह प्रयोग किसी निश्चित वनस्पति-जाति को अनावश्यक रूप से तय किए बिना अर्थ स्पष्ट करता है।
- source_word: ተፈድፋደ፡ [ቈስቍስ፡] መዓዛ
  choice: जिनसे ... सुगन्ध आती थी
  rationale: पाठ का यह भाग सुगन्ध की प्रबल या मनोहर गुणवत्ता बताता प्रतीत होता है, पर कोष्ठकबद्ध शब्द संदिग्ध है। स्वाभाविक हिन्दी में मूल संवेदनात्मक चित्र रखा गया है, जबकि अनिश्चित विशेषण को मुख्य पाठ में निर्णायक नहीं बनाया गया।
- source_word: ስኂን
  choice: लोबान
  rationale: यहाँ विशिष्ट सुगन्धित राल frankincense अभिप्रेत है; हिन्दी में उसका प्रचलित नाम 'लोबान' है।
- source_word: ወከርቤ
  choice: और गन्धरस
  rationale: ከርቤ का अर्थ myrrh है; 'गन्धरस' dignified और बोधगम्य हिन्दी बाइबलीय पद है। संयोजक ወ को 'और' से रखा गया है।
- source_word: ወዕፀወሂ
  choice: और वृक्ष भी—
  rationale: अन्तिम पद वृक्षों का योगसूचक उल्लेख करता है, पर उपलब्ध पंक्ति में कथन अधूरा या कठिन है। डैश इस टूटे हुए समापन को अतिरिक्त सूचना गढ़े बिना सुरक्षित रखता है।
theological_decisions:
- issue: सुगन्धित वृक्षों को पवित्र या मन्दिर-संबंधी प्रतीक मानना
  choice: केवल धूप, लोबान और गन्धरस से जुड़ा दृश्यात्मक वर्णन
  alternative: पवित्र धूप के वृक्ष अथवा मन्दिर के वृक्ष
  rationale: गीज़ पाठ वृक्षों का धार्मिक अर्थ स्पष्ट नहीं करता; इसलिए कोई सांप्रदायिक या प्रतीकात्मक व्याख्या नहीं जोड़ी गई।
- issue: ተኵነኔ को 'न्याय' मानने की सम्भावना
  choice: सन्दर्भानुसार 'धूप देनेवाले'
  alternative: न्याय के वृक्ष
  rationale: शब्दरूप को लेकर पाठ-इतिहास में कठिनाई हो सकती है, पर इस पंक्ति में लोबान और गन्धरस की सुगन्ध के स्पष्ट उल्लेख तथा उपलब्ध संशोधित पाठ-साक्ष्य के आधार पर सुगन्धित/धूप-संबंधी अर्थ मुख्य पाठ में अधिक संगत है; 'न्याय' को आरोपित कर दृश्य का धर्मवैचारिक अर्थ नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘धूप देनेवाले’ वस्तु और वृक्ष के सम्बन्ध को स्पष्ट करता है; ‘लोबान’ तथा ‘गन्धरस’ विशिष्ट सुगन्धित रालों को अलग-अलग बनाए रखते हैं। स्रोत के आकस्मिक, कठिन समापन को सुचारु वाक्य बनाकर छिपाया नहीं गया।
