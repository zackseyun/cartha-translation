lexical_decisions:
- source_word: ወእምህየኒ
  choice: और वहाँ से
  rationale: यह पिछले दृश्य-स्थान से आगे की कथा-गतिशीलता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ሖርኩ
  choice: मैं ... गया
  rationale: सरल गमन-क्रिया को बिना अनावश्यक अर्थ जोड़े सुरक्षित रखता है।
- source_word: ውስተ መካን ካልእ
  choice: एक दूसरे स्थान में
  rationale: स्थान के भीतर जाने की दिशा और अनिर्दिष्ट भौगोलिक स्वरूप दोनों को बनाए रखता है।
- source_word: እምነ መደባራ
  choice: उजाड़ प्रदेश से निकलकर
  rationale: गमन के आरंभ-बिंदु को स्पष्ट करता है; 'उजाड़ प्रदेश' वन, मरुभूमि या निर्जन भूभाग के बीच स्रोत की व्यापकता को सुरक्षित रखता है।
- source_word: ወመንገለ ጽባሕ
  choice: पूर्वी भाग
  rationale: ጽባሕ का मूल संबंध प्रभात अथवा सूर्योदय की दिशा से है; सन्दर्भ में इसका स्वाभाविक दिशात्मक अर्थ 'पूर्व' है।
- source_word: ለደብር ዝንቱ ቀረብኩ
  choice: इस पहाड़ के ... निकट पहुँचा
  rationale: ለ को यहाँ संबंधसूचक मानकर पूर्वी भाग को 'इस पहाड़' से जोड़ता है और ቀረብኩ की निकट आने की क्रिया को सुरक्षित रखता है।
