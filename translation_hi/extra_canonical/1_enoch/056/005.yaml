base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/005.yaml
  text: And in those days the angels will return and turn their heads toward the east[a], toward the people of Parthia and Media. They will stir up the kings, and a spirit of turmoil will come upon them; it will unsettle them from their thrones, and they will go out like lions from their lairs[c][b], and like hungry wolves in the midst of their pasture.
translation:
  language: hi
  text: और उन दिनों स्वर्गदूत लौटेंगे और अपने सिर पूर्व की ओर, पार्थिया और मादै के लोगों की ओर फेरेंगे। वे राजाओं को अशांत कर देंगे[a], और अशांति की एक आत्मा[b] उन पर आ पड़ेगी; वह उन्हें उनके सिंहासनों से हिला देगी, और वे अपनी माँदों से निकलने वाले सिंहों के समान और अपनी चरागाह के बीच भूखे भेड़ियों के समान निकल पड़ेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ जिस शब्द को ‘राजाओं’ के रूप में समझा गया है, वह उपलब्ध पाठ में कठिन है। अगले वाक्य में ‘उनके सिंहासनों’ का उल्लेख होने के कारण यह अर्थ सम्भावित है।
    reason: textual_variant
  - marker: b
    text: या ‘भ्रम की एक आत्मा’। गीइज़ अभिव्यक्ति अव्यवस्था उत्पन्न करने वाली शक्ति या दशा का संकेत दे सकती है; यह आवश्यक नहीं कि किसी व्यक्तिगत आत्मिक प्राणी का ही उल्लेख हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: ይገብኡ መላእክት
  choice: स्वर्गदूत लौटेंगे
  rationale: प्रदत्त गीइज़ पाठ में ይገብኡ, ገብአ ‘लौटना’ का रूप है; इसलिए पांडुलिपीय विकल्प ‘इकट्ठे होंगे’ के बजाय मूल पाठ का अर्थ रखा गया है।
- source_word: ይወድዩ አርእስቲሆሙ
  choice: अपने सिर ... फेरेंगे
  rationale: ‘सिर’ की ठोस शारीरिक छवि बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक दिशा-सूचक अभिव्यक्ति अपनाई गई है।
- source_word: ለኀበ ሰብአ ጳርቴ ወሙዴ
  choice: पार्थिया और मादै के लोगों की ओर
  rationale: मूल में आए ‘लोगों’ और दोनों ऐतिहासिक-भौगोलिक नामों को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: የሐውክዎሙ
  choice: अशांत कर देंगे
  rationale: धातु के व्याकुल करने, गड़बड़ी मचाने या उद्वेलित करने वाले कारक भाव को संक्षिप्त और सहज हिन्दी में व्यक्त करता है।
- source_word: መንፈሰ ሀውክ
  choice: अशांति की एक आत्मा
  rationale: ‘आत्मा’ और ‘अशांति’ दोनों अर्थ-घटकों को बनाए रखता है और इसे निश्चित रूप से कोई व्यक्तिगत दुष्ट सत्ता या केवल मानसिक अवस्था नहीं ठहराता।
- source_word: እመንበረሆሙ
  choice: उनके सिंहासनों से
  rationale: राजाओं के प्रसंग में ‘आसन’ की अपेक्षा ‘सिंहासन’ राजनीतिक और राजकीय बिंब को ठीक व्यक्त करता है।
- source_word: ከመ አናብስት እምስካባቲሆሙ
  choice: अपनी माँदों से निकलते सिंहों के समान
  rationale: शिकारी पशु और उसके निवास का सजीव बिंब स्वाभाविक हिन्दी में सुरक्षित है।
- source_word: ከመ አዝእብት ርኁባን
  choice: भूखे भेड़ियों के समान
  rationale: भेड़ियों और उनकी भूख का सीधा, प्रभावशाली रूपान्तरण है; ‘रक्तपिपासु’ जैसी अतिरिक्त धारणा नहीं जोड़ी गई।
- source_word: ማእከለ መርዔት ዚአሆሙ
  choice: अपनी चरागाह के बीच
  rationale: मूल के चरने के स्थान वाले व्यापक बिंब को रखा गया है और अनुल्लिखित ‘झुंड’ नहीं जोड़ा गया।
theological_decisions:
- issue: क्या መንፈሰ ሀውክ व्यक्तिगत आत्मिक सत्ता है या अव्यक्तिगत अव्यवस्था की दशा
  choice: अशांति की एक आत्मा
  alternative: भ्रम की एक आत्मा; अशांति की दशा
  rationale: अनिश्चित ‘एक’ तथा सामान्य संज्ञा ‘आत्मा’ मूल की सजीव शक्ति और अवस्था—दोनों संभावनाएँ खुली रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक और सर्वसुलभ स्तर रखा गया है। ऐतिहासिक नामों के लिए ‘पार्थिया’ और बाइबलीय हिन्दी में परिचित ‘मादै’ चुना गया है। वाक्य की पुनरावृत्त गति और पशु-उपमाएँ संरक्षित हैं; कठिन पाठ और आत्मा/अवस्था की वास्तविक अस्पष्टता पादटिप्पणियों में दी गई है।
