base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/002.yaml
  text: And I asked the angel of peace who went with me, saying, “To whom are they going, these who hold the scourges?”
translation:
  language: hi
  text: और मैंने शांति के उस दूत से, जो मेरे साथ चल रहा था, पूछा, “ये, जो कोड़े थामे हुए हैं, किसके पास जा रहे हैं?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ये, जो दण्ड के साधन थामे हुए हैं, किसके लिए जा रहे हैं?” मूल शब्द ‘कोड़े’, ‘दण्ड के साधन’ अथवा स्वयं ‘दण्ड’ का बोध करा सकता है; प्रश्न गन्तव्य या लक्ष्य/हितग्राही की ओर भी संकेत कर सकता है।
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ተስእልክዎ
  choice: मैंने ... से पूछा
  rationale: क्रिया सीधे प्रश्न करने को व्यक्त करती है; यह स्वाभाविक आधुनिक हिन्दी है।
- source_word: መልአክ ሰላም
  choice: शान्ति का दूत
  rationale: सम्बन्धसूचक संरचना और हनोक-साहित्य की विशिष्ट उपाधि को सुरक्षित रखता है।
- source_word: ዘየሐውር ምስሌየ
  choice: अपने साथ चलनेवाले
  rationale: दृष्टा के साथ दूत की गतिशील संगति को व्यक्त करता है, केवल सामान्य साथ होने को नहीं।
- source_word: እንዘ እብል
  choice: पूछा
  rationale: गीज़ का ‘कहते हुए’ सूत्र हिन्दी में सीधे उद्धृत प्रश्न के साथ अलग से दोहराने पर बोझिल होगा; ‘पूछा’ उसी भाषिक कार्य को स्वाभाविक रूप से निभाता है।
- source_word: ለመኑ የሐውሩ
  choice: किसके पास जा रहे हैं
  rationale: ለመኑ को ‘किसके पास/किसके लिए’ और የሐውሩ को ‘जा रहे हैं’ मानते हुए गन्तव्य अथवा लक्ष्य का प्रश्न सुरक्षित रखा गया है।
- source_word: እሉ እለ
  choice: ये ... लोग
  rationale: दृष्टि में सामने उपस्थित व्यक्तियों की ओर संकेत करनेवाले निकटवाची भाव को ‘ये’ से रखा गया है।
- source_word: ይአኅዙ
  choice: थामे हुए
  rationale: हाथ में रखने के ठोस भाव को रखता है, पर यह तय नहीं करता कि वे केवल लिए चल रहे हैं या प्रयोग के लिए तैयार हैं।
- source_word: መቅሠፍተ
  choice: कोड़े
  rationale: सन्दर्भ में वस्तु को थामा गया है, इसलिए ठोस दण्ड-साधन का अर्थ उपयुक्त है; फिर भी व्यापक अर्थ की सम्भावना पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: መቅሠፍተ का अमूर्त दण्ड या ठोस दण्ड-साधन होना
  choice: 'ठोस अर्थ: ‘कोड़े’'
  alternative: ‘दण्ड के साधन’ या अमूर्त ‘दण्ड’
  rationale: ‘थामे हुए’ वाली निकटवर्ती क्रिया ठोस वस्तु का समर्थन करती है, पर मूल शब्द का अर्थक्षेत्र अधिक व्यापक हो सकता है; इसलिए विकल्प पादटिप्पणी में दिया गया है।
- issue: प्रश्न व्यक्तियों की पहचान का है या उनके गन्तव्य/लक्ष्य का
  choice: 'गन्तव्य/लक्ष्य: ‘किसके पास ... जा रहे हैं?’'
  alternative: ‘ये कौन हैं?’
  rationale: የሐውሩ ‘वे जाते हैं’ को अनूदित करना आवश्यक है, और ለመኑ यहाँ ‘किसके पास/किसके लिए’ है; पहचानवाला अनुवाद क्रिया को छोड़ देता है।
