  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज कथन। ‘शान्ति का दूत’ विशिष्ट पदवी के रूप में रखा गया है। उद्धरण को हिन्दी में स्वाभाविक बनाने के लिए ‘कहते हुए’ को अलग से नहीं जोड़ा गया।
