base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/003.yaml
  text: And he said to me[a], 'To their chosen ones and to their beloved ones[c][b], so that they may be cast into the chasm of the abyss of the valley.'
translation:
  language: hi
  text: और उसने मुझसे कहा[a], “उनके चुने हुओं और उनके प्रिय जनों के पास[c], ताकि वे घाटी के अथाह गर्त की दरार में फेंक दिए जाएँ[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस वाक्य की रचना कठिन है। ‘उनके चुने हुओं’ और ‘उनके प्रिय जनों’ से ठीक किन लोगों का संकेत है, यह इस पद से अकेले स्पष्ट नहीं होता।
    reason: alternative_reading
  - marker: b
    text: या, “घाटी के अथाह गर्त के विवर में।” मूल शब्द दरार, विवर या फटी हुई गहरी जगह का बोध करा सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘के पास’ का अनुवाद पिछले पद में पूछे गए गति-संबंधी प्रश्न के अनुसार है; व्याकरणतः ‘के लिए’ भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይቤለኒ
  choice: और उसने मुझसे कहा
  rationale: दर्शनीय आख्यान में प्रयुक्त सामान्य कथन-सूत्र को सीधा और स्वाभाविक रखा गया है।
- source_word: ለሕሩያነ፡ ዚአሆሙ
  choice: उनके चुने हुओं के पास
  rationale: ለ को पिछले पद के गति-संबंधी प्रश्न के अनुरूप ‘के पास’ और ዚአሆሙ को तृतीय पुरुष बहुवचन संबंधसूचक ‘उनके’ माना गया है; इसे ‘ये हैं’ नहीं बनाया गया।
- source_word: ወለፍቁራኒሆሙ
  choice: और उनके प्रिय जनों के पास
  rationale: प्रेम या स्नेह से जुड़े लोगों का अर्थ रखते हुए संबंधसूचक बहुवचन ‘उनके’ सुरक्षित रखा गया है।
- source_word: ከመ፡ ይትወደዩ
  choice: ताकि वे … फेंक दिए जाएँ
  rationale: उद्देश्यसूचक और कर्मवाच्य भाव को बनाए रखा गया है; ‘वे’ का संदर्भ मूल की तरह स्पष्ट नहीं किया गया।
- source_word: ውስተ፡ ንቅዐተ
  choice: दरार में
  rationale: यह शब्द फटने से बने विवर, दरार या खड्ड को सूचित कर सकता है; दृश्य की स्थलाकृतिक भाषा को अनावश्यक विस्तार दिए बिना रखा गया है।
- source_word: ማዕምቅ
  choice: अथाह गर्त
  rationale: गहरी, अगाध जगह और प्रलय-दर्शन के भयावह भाव दोनों को व्यक्त करता है।
- source_word: ዘቈላ
  choice: घाटी के
  rationale: मूल के संबंधसूचक स्थलवाचक पद को सामान्य आधुनिक हिन्दी ‘घाटी’ से व्यक्त किया गया है।
theological_decisions:
- issue: ‘उनके चुने हुओं’ और ‘उनके प्रिय जनों’ का संदर्भ
  choice: समूहों की पहचान को अनिर्णीत रखा गया है।
  alternative: इन्हें शासकों के विशेष सहयोगी, दंड के लिए चुने गए लोग, या किसी अन्य पूर्वोक्त समूह के रूप में स्पष्ट करना।
  rationale: इस पद में संदर्भ स्वयं स्पष्ट नहीं है; किसी विशिष्ट धर्मवैज्ञानिक पहचान को आरोपित करना उचित नहीं होगा।
- issue: ‘वे’ किसके लिए प्रयुक्त है
  choice: बहुवचन सर्वनाम की संदर्भगत अस्पष्टता बनाए रखी गई है।
  alternative: स्पष्ट रूप से कहना कि चुने और प्रिय जन फेंके जाएँगे, अथवा उनके पास जाने वाले फेंके जाएँगे।
  rationale: मूल वाक्य की कठिन संरचना इस संबंध को निर्णायक रूप से स्पष्ट नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध और किंचित प्रलय-दर्शी शैली रखी गई है। मूल की खंडित वाक्य-रचना तथा सर्वनाम-संबंधी अस्पष्टता को पूरी तरह समतल नहीं किया गया।
