base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/001.yaml
  text: And there I saw the angels of punishment going about[c][b][a], and they were holding scourges and chains of iron and bronze.
translation:
  language: hi
  text: और वहाँ मैंने दर्शन में[a] दण्ड देनेवाले स्वर्गदूतों को इधर-उधर जाते देखा, और उनके हाथों में लोहे और काँसे के कोड़े और जंजीरें थीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ में ‘दर्शन में’ का भाव स्पष्ट है; हिन्दी में इसे छोड़ा भी जा सकता था, पर यहाँ मूल के दर्शनात्मक वर्णन को बनाए रखने के लिए रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: दण्ड के उपकरणों के लिए प्रयुक्त गीज़ शब्दों का सटीक अर्थ पूरी तरह निश्चित नहीं है। ‘कोड़े और जंजीरें’ सम्भावित अर्थ है; ‘बेड़ियाँ’ अथवा कोई अन्य दण्ड-उपकरण भी अभिप्रेत हो सकता है। वाक्य-विन्यास से यह भी पूरी तरह स्पष्ट नहीं कि ‘लोहे और काँसे के’ दोनों उपकरणों का वर्णन करता है या विशेष रूप से जंजीरों का।
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: ወርኢኩ፡ በህየ
  choice: और वहाँ मैंने … देखे
  rationale: यह दर्शनीय वृत्तांत का सामान्य प्रथम-पुरुष सूत्र और स्थानसूचक क्रियाविशेषण है; हिन्दी में यह रूप स्पष्ट और स्वाभाविक है।
- source_word: ትዕይንታተ፡ መላእክት፡ መቅሠፍት
  choice: दण्ड देनेवाले स्वर्गदूतों के दल
  rationale: ትዕይንታተ को यहाँ स्वर्गदूतों के संगठित समूहों/पंक्तियों के अर्थ में लिया गया है। መላእክት፡ መቅሠፍት न्याय-दण्ड से संबद्ध स्वर्गदूतों को दर्शाता है, न कि किसी बाद की दानव-श्रेणी को।
- source_word: እንዘ፡ የሐውሩ
  choice: जो इधर-उधर जा रहे थे
  rationale: यह दृश्य के भीतर जारी गतिशीलता को व्यक्त करता है; ‘इधर-उधर जा रहे थे’ गति को दिखाता है, पर उसकी रीति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ወይአሕዙ
  choice: उनके हाथों में … थीं
  rationale: शाब्दिक अर्थ ‘वे पकड़े हुए थे’ है। हिन्दी का यह मुहावरा उसी निरंतर अवस्था को सहज ढंग से व्यक्त करता है।
- source_word: መቅሠፍተ፡ ወመማግረ
  choice: कोड़े और जंजीरें
  rationale: पहला पद दण्ड देने या मारने के उपकरण और दूसरा बन्धन के उपकरण को सूचित करता है। वस्तुओं का स्रोत-क्रम सुरक्षित रखा गया है।
- source_word: ሐጺን፡ ውብርት
  choice: लोहे और काँसे के
  rationale: दोनों धातु-पदों को उनके सामान्य अर्थ में रखा गया है। हिन्दी वाक्य जानबूझकर इस सम्भावना को खुला रखता है कि धातुओं का सम्बन्ध दोनों प्रकार के उपकरणों से हो।
theological_decisions:
- issue: स्वर्गदूतों की भूमिका
  choice: दण्ड देनेवाले स्वर्गदूत
  alternative: विनाश के स्वर्गदूत / पीड़ा पहुँचानेवाले स्वर्गदूत
  rationale: मूल पद न्यायात्मक दण्ड से जुड़े स्वर्गीय प्रतिनिधियों को दर्शाता है। यह अनुवाद प्रलयदर्शी न्याय-चित्र को बनाए रखता है और उन्हें दुष्टात्माएँ मानने जैसी बाहरी धर्मवैचारिक धारणा नहीं जोड़ता।
- issue: स्वर्गदूतों के समूह का वर्णन
  choice: दल
  alternative: पंक्तियाँ / सेनाएँ / केवल ‘स्वर्गदूत’
  rationale: ትዕይንታተ को पाठ में व्यक्त सामूहिक गठन के रूप में दर्शाया गया है; ‘दल’ आधुनिक हिन्दी में बोधगम्य है और ‘सेनाएँ’ की अपेक्षा कम अतिनिर्धारित है। पाठगत-शाब्दिक अनिश्चितता पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर प्रलयदर्शी दृश्य के अनुरूप गरिमामय रखी गई है। ‘दण्ड देनेवाले’ सामान्य पाठक के लिए ‘दण्ड के स्वर्गदूत’ से अधिक सहज है। वस्तुओं का क्रम मूल के अनुसार ‘कोड़े और जंजीरें’ रखा गया है; वास्तविक शाब्दिक और वाक्यगत अनिश्चितताएँ पादटिप्पणियों में सुरक्षित हैं।
