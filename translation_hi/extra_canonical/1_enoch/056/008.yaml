base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/008.yaml
  text: And in those days Sheol will open its mouth[a], and they will sink down into it; and destruction will pursue them[c][b]; Sheol will swallow up the sinners from before the face of the chosen ones.
translation:
  language: hi
  text: और उन दिनों शिओल अपना मुँह खोलेगा[a], और वे उसमें धँस जाएँगे; विनाश उनका पीछा करेगा। शिओल चुने हुओं के सामने से[b] पापियों को निगल जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘शिओल’ मृतकों के लोक का प्राचीन नाम है; यहाँ उसे मुँह खोलकर निगलने वाले लोक के रूप में मानवीकृत किया गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘चुने हुओं के मुख के सामने से’; आशय है कि पापी उनकी उपस्थिति से हटा दिए जाएँगे।
    reason: lexical_alternative
lexical_decisions:
- source_word: በአማንቱ መዋዕል
  choice: उन दिनों
  rationale: यह हनोक-साहित्य का प्रचलित प्रलयदर्शी काल-सूत्र है और मूल की गरिमामय, दर्शनात्मक शैली बनाए रखता है।
- source_word: ሲኦል አፉሃ
  choice: शिओल अपना मुँह
  rationale: ‘शिओल’ को ‘नरक’ या ‘कब्र’ बनाकर बाद की धर्मवैज्ञानिक धारणाएँ आरोपित नहीं की गईं; ‘अपना मुँह’ मूल के सजीव मानवीकरण को सुरक्षित रखता है।
- source_word: ወይስጠሙ ውስቴታ
  choice: और वे उसमें धँस जाएँगे
  rationale: क्रिया नीचे धँसने या डूब जाने का विनाशकारी दृश्य व्यक्त करती है; यह अनुवाद उस भौतिक बिंब को स्वाभाविक हिन्दी में रखता है।
- source_word: ወትትሎሙ ኀጕሎን
  choice: विनाश उनका पीछा करेगा
  rationale: गीज़ पाठ में ‘पीछा करना/पीछे लगना’ क्रिया स्पष्ट है और ‘विनाश’ उसका कर्ता है; अतः इसे केवल ‘उनका विनाश’ जैसे संज्ञात्मक वाक्यांश में नहीं बदला गया।
- source_word: ሲኦል ይውሕጦሙ
  choice: शिओल ... निगल जाएगा
  rationale: यह चयन मूल के प्रबल भक्षण-बिंब और शिओल के मानवीकरण को बनाए रखता है।
- source_word: ለኃጥኣን
  choice: पापियों को
  rationale: मूल संज्ञा सीधे पाप करने वालों को दर्शाती है; ‘दुष्टों’ की अपेक्षा ‘पापियों’ अधिक निकट है।
- source_word: እምቅድመ ገጸ ኅሩያን
  choice: चुने हुओं के सामने से
  rationale: यह मूल के ‘मुख के सामने से’ वाले सामी मुहावरे का अर्थ स्वाभाविक हिन्दी में देता है और ‘चुने हुओं’ को बाद की पारिभाषिक शब्दावली से नहीं मिलाता।
theological_decisions:
- issue: ሲኦል का अनुवाद
  choice: शिओल
  alternative: नरक; कब्र; अधोलोक
  rationale: यहाँ एक मानवीकृत ब्रह्मांडीय लोक अपना मुँह खोलकर पापियों को निगलता है। ‘शिओल’ प्राचीन अवधारणा को सुरक्षित रखता है और ‘नरक’ से जुड़ी बाद की विशिष्ट धारणाएँ नहीं जोड़ता।
- issue: ኅሩያን का अनुवाद
  choice: चुने हुए
  alternative: निर्वाचित; चुनाव पाए हुए
  rationale: ‘चुने हुए’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है तथा हनोक के स्थानीय संदर्भ को बाद की धर्मवैज्ञानिक पारिभाषिकता में नहीं ढालता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमामय रखी गई है। प्रलयदर्शी दृश्य की तीव्रता के लिए ‘मुँह खोलेगा’, ‘धँस जाएँगे’, ‘पीछा करेगा’ और ‘निगल जाएगा’ जैसे ठोस क्रियापद रखे गए हैं। ‘शिओल’ को लिप्यंतरित करके उसके अर्थ की संक्षिप्त व्याख्या पादटिप्पणी में दी गई है।
