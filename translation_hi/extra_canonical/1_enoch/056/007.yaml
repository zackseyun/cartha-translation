base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/007.yaml
  text: And the city of my righteous ones shall be a hindrance to their horses[a]; and they will stir up slaughter among themselves, and their right hand will be strong against them. And a man will not know his brother, nor a son his father or his mother, until the number of the corpses from their death is complete[d][c][b], and their punishment will not be in vain.
translation:
  language: hi
  text: और मेरे धर्मियों का नगर उनके घोड़ों के लिए रुकावट होगा[a]; वे आपस में संहार मचा देंगे[d], और उनका दाहिना हाथ उन्हीं के विरुद्ध प्रबल होगा। कोई मनुष्य अपने भाई को नहीं पहचानेगा[b], और न पुत्र अपने पिता या अपनी माता को, जब तक उनकी मृत्यु से पड़ी लाशों की संख्या पूरी न हो जाए[c]; और उनका दंड निष्फल न होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘रुकावट’ के स्थान पर ‘बाधा’ या ‘फंदा’ भी संभव है; गीइज़ शब्द रोकने या फँसाने वाली किसी चीज़ का संकेत देता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘अपने भाई को नहीं जानेगा’; यहाँ ‘जानना’ का अर्थ ‘पहचानना’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘लाशों की संख्या’ वाला यह खंड इथियोपिक पाठ में कठिन है; अनुवाद ने इसे अर्थ की दृष्टि से अधिक सुगम बनाने के बजाय मूल तत्वों को खुला रखा है।
    reason: textual_difficulty
  - marker: d
    text: क्रिया को सकर्मक मानकर ‘संहार मचा देंगे’ अनुवाद किया गया है; एक वैकल्पिक समझ में इसे आत्मवाचक रूप से, ‘वे अपने आपको संहार के लिए उकसाएँगे’, पढ़ा जाता है।
    reason: grammatical_alternative
lexical_decisions:
- source_word: ሀገረ፡ ጻድቃነ፡ ዚአየ
  choice: मेरे धर्मियों का नगर
  rationale: ሀገር यहाँ ठोस स्थान के रूप में ‘नगर’ को सूचित करता है, और ዚአየ के प्रथम-पुरुष संबंध को ‘मेरे’ से सुरक्षित रखा गया है।
- source_word: ማዕቀፈ
  choice: रुकावट
  rationale: यह शब्द रोकने, बाधित करने या फँसाने वाली वस्तु का अर्थ दे सकता है। ‘रुकावट’ व्यापक अर्थ बनाए रखता है और किसी खास प्रकार के फंदे का अनुमान नहीं लगाता।
- source_word: አፍራሲሆሙ
  choice: उनके घोड़े
  rationale: मूल शब्द सीधे घोड़ों को दर्शाता है; ‘घुड़सवार सेना’ कहना अनावश्यक व्याख्या होती।
- source_word: ያነሥኡ፡ በበ፡ ቢይናቲሆሙ፡ ቀትለ
  choice: वे आपस में संहार मचा देंगे
  rationale: क्रिया सकर्मक है और ‘संहार’ उसका कर्म है; पारस्परिक पदबंध आंतरिक हिंसा को व्यक्त करता है। इसलिए इसे आत्मवाचक ‘अपने आपको उकसाएँगे’ नहीं बनाया गया।
- source_word: ትጸንዕ፡ የማኖሙ፡ ዲቤሆሙ
  choice: उनका दाहिना हाथ उन्हीं के विरुद्ध प्रबल होगा
  rationale: ‘दाहिना हाथ’ शक्ति का सामरिक बिंब है। ‘प्रबल होगा’ मूल की शक्ति और पारस्परिक संघर्ष दोनों को बनाए रखता है।
- source_word: ኢያእምር፡ ብእሲ፡ ለአኁሁ
  choice: कोई मनुष्य अपने भाई को नहीं पहचानेगा
  rationale: क्रिया ‘जानना’ अथवा ‘पहचानना’ दोनों अर्थ दे सकती है। इस अराजक युद्ध-दृश्य में स्वाभाविक हिन्दी के लिए ‘पहचानेगा’ चुना गया, जबकि शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: ኢወልድ፡ ለአቡሁ፡ ወለእሙ
  choice: और न पुत्र अपने पिता या अपनी माता को
  rationale: मूल की संक्षिप्त रचना में पिछली क्रिया निहित है; हिन्दी में उसी क्रिया को इस समांतर खंड पर लागू रहने दिया गया है।
- source_word: ኍልቈ፡ አብድነት፡ እሞቶሙ
  choice: उनकी मृत्यु से हुई लाशों की संख्या पूरी न हो जाए
  rationale: इथियोपिक पदबंध पाठगत और वाक्यगत रूप से कठिन है। अनुवाद ने संख्या, लाशों और उनकी मृत्यु—तीनों तत्वों को बिना सहज बनाने के नाम पर हटाए सुरक्षित रखा है।
- source_word: መቅሰፍቶሙ፡ ኢትኩን፡ በከ
  choice: उनका दंड निष्फल न होगा
  rationale: संज्ञा दंड, ताड़ना या प्रहार का अर्थ दे सकती है। ‘निष्फल न होगा’ समापन के इस कथन को व्यक्त करता है कि न्याय-दंड व्यर्थ नहीं जाएगा।
theological_decisions:
- issue: धर्मियों के नगर के साथ प्रथम-पुरुष संबंध
  choice: ‘मेरे धर्मियों का नगर’
  alternative: ‘धर्मियों का नगर’ अथवा ‘उसके धर्मियों का नगर’
  rationale: प्रस्तुत गीइज़ पाठ प्रथम-पुरुष संबंध का संकेत देता है। उसे बनाए रखने से ईश्वरीय स्वामित्व और संरक्षण का बिंब सुरक्षित रहता है, बिना बाद की किसी सिद्धांतगत भाषा को जोड़े।
- issue: संघर्ष का स्वरूप
  choice: दुष्ट शक्तियों के बीच पारस्परिक संहार
  alternative: बाहरी सेना द्वारा संहार अथवा केवल सामान्य अव्यवस्था
  rationale: ‘आपस में’ का पारस्परिक पदबंध, ‘उन्हीं के विरुद्ध’ दाहिने हाथ का प्रबल होना, और पारिवारिक पहचान के टूटने वाले अगले खंड आंतरिक आत्म-विनाश के दृश्य का समर्थन करते हैं।
- issue: लाशों की संख्या पूरी होने का कठिन कथन
  choice: कठिन और तनावपूर्ण वाक्यरचना को यथासंभव पारदर्शी रखना
  alternative: इसे सरल करके केवल ‘जब तक सभी मारे न जाएँ’ कहना
  rationale: सरल विकल्प संख्या, लाशों और मृत्यु के मूल बिंबों को मिटा देता तथा न्याय की सीमा या पूर्णता को व्याख्यात्मक रूप से तय कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सर्वसुलभ और प्रलय-दर्शन के अनुकूल सघन रजिस्टर अपनाया गया है। ‘धर्मी’, ‘संहार’, ‘प्रबल’ और ‘दंड’ जैसे परिचित धार्मिक-साहित्यिक शब्द रखे गए हैं, पर अत्यधिक संस्कृतनिष्ठ वाक्यरचना से बचा गया है। कठिन इथियोपिक खंड को जानबूझकर पूरी तरह समतल नहीं किया गया।
