base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/004.yaml
  text: And in those days that valley will be filled with the chosen and with their beloved ones[a], and the days of their lives will be ended[f][e][d][c][b], and the days of their wandering will no longer be counted from then on.
translation:
  language: hi
  text: और उन दिनों वह घाटी[a] चुने हुओं और उनके प्रियजनों[b] से भर जाएगी; उनके जीवन के दिन पूरे हो जाएंगे, और तब से उनके भटकाव के दिन[c] फिर गिने नहीं जाएंगे[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘घाटी’ के लिए आया गीइज़ शब्द किसी निचले भूभाग के अर्थ में भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उनके प्रियजन’ का पद कठिन है। संभवतः इससे चुने हुओं के निकट या उनसे जुड़े लोग अभिप्रेत हैं, पर ठीक संबंध स्पष्ट नहीं है।
    reason: lexical_alternative
  - marker: c
    text: ‘भटकाव’ का अनुवाद ‘भूल’, ‘पथभ्रष्टता’ या ‘भटकना’ भी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: ‘गिने नहीं जाएंगे’ को ‘लेखे में नहीं आएंगे’ भी समझा जा सकता है। इस अंतिम पंक्ति का सटीक भाव कुछ अनिश्चित है।
    reason: alternative_reading
lexical_decisions:
- source_word: እሜሃ
  choice: उन दिनों
  rationale: यह प्रकाशन-साहित्य में प्रयुक्त समय-सूचक पद है; हिन्दी में ‘उन दिनों’ उसके बहुवचन और दर्शनीय शैली को बनाए रखता है।
- source_word: ውእቱ ቈላ
  choice: वह घाटी
  rationale: ቈላ का यहाँ स्थलाकृतिक अर्थ ‘घाटी’ है और यह निकटवर्ती प्रसंग की स्थल-छवि को बनाए रखता है।
- source_word: ሕሩያን
  choice: चुने हुए
  rationale: यह समूहवाचक, उपाधि-सदृश पद है। ‘चुने हुए’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक सांप्रदायिक शब्दावली से बचता है।
- source_word: ፍቁራነ ዚአሆሙ
  choice: उनके प्रियजन
  rationale: यह संबंधसूचक अर्थ को सहज हिन्दी में व्यक्त करता है; किन व्यक्तियों की ओर संकेत है, इसे निश्चित नहीं करता।
- source_word: ይትዌዳእ
  choice: पूरे हो जाएंगे
  rationale: यह ወድአ से बना क्रियारूप है, जिसका अर्थ समाप्त या पूर्ण होना है। इसे अगले ‘गिने नहीं जाएंगे’ वाले क्रियारूप में मिलाया नहीं गया है।
- source_word: ዕለተ ሕይወቶሙ
  choice: उनके जीवन के दिन
  rationale: स्रोत की पदावली और अगले समानांतर वाक्यांश की लय सुरक्षित रहती है।
- source_word: ዕለተ ስሕተቶሙ
  choice: उनके भटकाव के दिन
  rationale: ስሕተት में भटकने, चूकने या भूल में पड़ने का अर्थ हो सकता है। ‘भटकाव’ नैतिक-आध्यात्मिक संकेत रखता है, पर इसे सीधे ‘पाप’ नहीं बनाता।
- source_word: እምይእዜ ኢትትኌለቍ
  choice: तब से ... फिर गिने नहीं जाएंगे
  rationale: यह भविष्य में गणना या लेखे के रुक जाने का अर्थ देता है। ‘तब से’ काल-सूचक बल को और ‘गिने’ मूल क्रिया के अर्थ को बनाए रखता है।
theological_decisions:
- issue: ሕሩያን का समूहवाचक धार्मिक अर्थ
  choice: चुने हुए
  alternative: निर्वाचित जन
  rationale: ‘चुने हुए’ पद की गंभीरता बनाए रखते हुए सामान्य पाठक के लिए स्पष्ट है और बाद की किसी विशिष्ट धर्मवैज्ञानिक व्यवस्था को पाठ पर आरोपित नहीं करता।
- issue: ስሕተት का नैतिक अर्थ
  choice: भटकाव
  alternative: भूल या पथभ्रष्टता
  rationale: स्रोत में भूल और भटकने दोनों की अर्थ-छाया संभव है। मुख्य पाठ किसी एक अधिक कठोर व्याख्या को अंतिम नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर पदों ‘जीवन के दिन’ और ‘भटकाव के दिन’ को सुरक्षित रखा गया है, जबकि अर्धविराम दो अलग क्रियात्मक खंडों को स्पष्ट करता है।
