base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/006.yaml
  text: And they shall go up and tread upon the land of his chosen ones[b][a], and the land of his chosen ones shall become before them a trampled place and a beaten path.
translation:
  language: hi
  text: और वे चढ़कर उसके चुने हुओं की भूमि को रौंदेंगे[a], और उसके चुने हुओं की भूमि उनके सामने रौंदी हुई जगह और रौंदा हुआ पथ बन जाएगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे चढ़कर उसके चुने हुओं की भूमि पर कूच करेंगे।” ये क्रियाएँ शाब्दिक रूप से चढ़ने और चलने के साथ-साथ सैनिक अग्रगमन का भी संकेत दे सकती हैं।
    reason: lexical_alternative
  - marker: b
    text: 'गीज़ में अंतिम शब्द-युग्म कठिन है। संभवतः वह छवि को तीव्र करता है: भूमि पैरों से रौंदी हुई जगह, अर्थात् रौंदे हुए पथ जैसी बन जाती है।'
    reason: textual_variant
lexical_decisions:
- source_word: የዓርግዋ
  choice: वे चढ़कर
  rationale: क्रिया ऊपर जाने या चढ़ने का बोध देती है; सैन्य प्रसंग में यह आगे बढ़ने का संकेत भी दे सकती है, पर मुख्य पाठ में ठोस गति को बनाए रखा गया है।
- source_word: ይከይድዋ
  choice: भूमि पर चलेंगे
  rationale: मूल धातु चलने, जाने या रौंदते हुए पार करने से जुड़ी है। 'पर चलेंगे' स्वाभाविक हिन्दी है और अगले खंड की रौंदे जाने वाली छवि से संबंध बनाए रखती है।
- source_word: ምድረ
  choice: भूमि
  rationale: यहाँ पूरे संसार के बजाय चुने हुओं के भूभाग का संकेत है; 'भूमि' स्वाभाविक और प्रसंगानुकूल है।
- source_word: ኅሩያነ
  choice: चुने हुए
  rationale: हनोक साहित्य की महत्त्वपूर्ण सामूहिक उपाधि को सरल, पारदर्शी हिन्दी में सुरक्षित रखा गया है, बिना बाद की सांप्रदायिक शब्दावली जोड़े।
- source_word: ዚአሁ
  choice: उसके
  rationale: गीज़ में केवल संबंधवाचक सर्वनाम है। 'उसके' उसके अनिर्दिष्ट पूर्वपद को सुरक्षित रखता है।
- source_word: በቅድሜሆሙ
  choice: उनके सामने
  rationale: स्थानिक और दृश्यात्मक अर्थ को सीधी, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ምካይደ
  choice: रौंदी हुई जगह
  rationale: यह संज्ञा पूर्ववर्ती चलने/रौंदने वाली क्रिया से शब्दगत संबंध रखती प्रतीत होती है; अनुवाद उस पुनरुक्त और विध्वंसकारी छवि को बनाए रखता है।
- source_word: አሰረ
  choice: पिटा हुआ मार्ग
  rationale: शब्द पथ या लीक का बोध देता है। 'पिटा हुआ मार्ग' बार-बार पैरों से दबे रास्ते की ठोस छवि रखता है।
theological_decisions:
- issue: '''उसके चुने हुओं'' में ''उसके'' का संदर्भ'
  choice: सर्वनाम को 'उसके' ही रखा गया, किसी व्यक्ति की स्पष्ट पहचान नहीं जोड़ी गई।
  alternative: '''परमेश्वर के चुने हुओं'' या ''प्रभु के चुने हुओं'''
  rationale: मूल गीज़ पाठ केवल सर्वनाम देता है और इस पद में उसका पूर्वपद स्पष्ट नहीं करता। नाम जोड़ना स्रोत से आगे जाना और वास्तविक संदिग्धता को मिटाना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। 'चुने हुए' को प्रमुख हनोकीय उपाधि के रूप में रखा गया है। सैन्य और शाब्दिक गति के बीच की अस्पष्टता को मुख्य पाठ तथा पादटिप्पणी में सुरक्षित रखा गया है।
