base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/088/002.yaml
  text: And one of them drew a sword and gave it to those elephants and camels and donkeys[a], and they began to strike one another.
translation:
  language: hi
  text: और उनमें से एक ने तलवार खींची और उसे उन हाथियों, ऊँटों और गधों को दे दी; तब वे एक-दूसरे पर वार करने लगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इथियोपिक पाठ के अंतिम शब्द कठिन हैं। भाव यह प्रतीत होता है कि तलवार मिलने के बाद ये पशु आपस में हिंसा करने लगे; इसलिए “एक-दूसरे पर वार करने लगे” सावधानी से किया गया अनुवाद है।
    reason: textual_variant
lexical_decisions:
- source_word: መላሕ ሰይፈ
  choice: तलवार खींची
  rationale: तलवार के साथ प्रयुक्त क्रिया हथियार को खींचने या निकालने का भाव देती है; यह दृश्य की ठोस युद्ध-संबंधी भाषा को बनाए रखती है।
- source_word: ወወሀቦሙ
  choice: उसे ... दे दिया
  rationale: मूल की सरल हस्तांतरण-क्रिया को स्वाभाविक हिन्दी में रखा गया है; ‘उसे’ का संकेत तलवार की ओर है।
- source_word: ለእልኩ ነጌያት ወአገማል ወአእዱግ
  choice: उन हाथियों, ऊँटों और गधों को
  rationale: दर्शन में आए पशु-प्रतीकों को उनकी शाब्दिक पहचान के साथ रखा गया है और आधुनिक प्रचलित हिन्दी नाम चुने गए हैं।
- source_word: አንዘ እንዘ ይትደአ
  choice: तब वे एक-दूसरे पर वार करने लगे
  rationale: अंतिम इथियोपिक पदबंध कठिन है। यह अनुवाद हिंसा के आरम्भ और पारस्परिक क्रिया—दोनों को सावधानी से व्यक्त करता है, बिना अस्पष्ट पाठ को जरूरत से अधिक निश्चित किए।
theological_decisions:
- issue: दर्शन में पशुओं की प्रतीकात्मक प्रकृति
  choice: मुख्य पाठ में हाथी, ऊँट और गधे जैसे शाब्दिक पशु-नाम बनाए रखना
  alternative: मुख्य पाठ में ही उन्हें राष्ट्रों या सेनाओं के रूप में पहचान देना
  rationale: यह पशु-दर्शन अपनी बात प्रतीकात्मक पशु-चित्रों के द्वारा कहता है। अनुवाद को प्रतीक को व्याख्या में बदलने के बजाय मूल दृश्यात्मक तनाव बनाए रखना चाहिए।
- issue: तलवार मिलने के बाद हिंसा की दिशा
  choice: ‘एक-दूसरे पर वार करने लगे’ के द्वारा पारस्परिक हिंसा व्यक्त करना
  alternative: केवल ‘वे लड़ने लगे’ कहना या किसी बाहरी लक्ष्य पर आक्रमण मानना
  rationale: कठिन अंतिम पदबंध के संदर्भ में पारस्परिक हिंसा सम्भावित अर्थ है; फिर भी इसकी पाठगत कठिनाई को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘वार करना’ शारीरिक हिंसा को स्पष्ट रखता है और ‘प्रहार करना’ की अपेक्षा सामान्य पाठक के लिए अधिक स्वाभाविक है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में संबंधित कठिन वाक्यांश के बाद रखा गया है।
