base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/088/001.yaml
  text: And I saw one of those four who had come out first, and he seized that first star which had fallen from heaven, and bound its hands and its feet, and threw it into the abyss. And that abyss was narrow and deep and dreadful and dark.
translation:
  language: hi
  text: और मैंने उन चारों में से एक को देखा, जो पहले निकलकर आए थे; उसने उस पहले तारे को, जो आकाश से गिरा था, पकड़ लिया, उसके हाथ-पाँव[a] बाँधे और उसे अथाह गर्त[b] में फेंक दिया। वह गर्त सँकरा, गहरा, भयानक और अंधकारमय था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: तारे के हाथ और पाँव बताए गए हैं; इससे संकेत मिलता है कि दर्शन का यह प्रतीक न्यायाधीन किसी व्यक्तिगत स्वर्गीय प्राणी को दर्शाता है।
    reason: cultural_note
  - marker: b
    text: या “अथाह गहराई।” गीज़ शब्द बहुत गहरी जगह का बोध कराता है; यहाँ “अथाह गर्त” दंड और बंदीकरण के दर्शनात्मक बिंब को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: और मैंने ... देखा
  rationale: दर्शन-वर्णन की सामान्य क्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: አሐደ፡ እምእልኩ፡ ፬እለ
  choice: उन चारों में से एक
  rationale: पहले उल्लिखित चार प्राणियों में से एक के चयन और संकेतवाचक बल को बनाए रखता है।
- source_word: ወፅኡ፡ እምቅዳሚ
  choice: जो पहले निकलकर आए थे
  rationale: እምቅዳሚ को क्रियाविशेषणात्मक ‘पहले’ माना गया है; स्रोत में अनुपस्थित किसी सर्वनाम को नहीं जोड़ा गया।
- source_word: አሐዘ
  choice: पकड़ लिया
  rationale: गिरफ्तार करने और बाँधने के प्रसंग में बलपूर्ण, किंतु स्वाभाविक हिन्दी है।
- source_word: ለዝኩ፡ ኮከብ፡ ቀዳማይ
  choice: उस पहले तारे को
  rationale: विशिष्ट, पहले देखे गए तारे और ‘पहले’ की शाब्दिक प्रतिध्वनि को सुरक्षित रखता है।
- source_word: ዘወድቀ፡ እምሰማየ
  choice: जो आकाश से गिरा था
  rationale: तारे के पहले घट चुके पतन को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ወአሰረ፡ እደዊሁ፡ ወእገሪሁ
  choice: उसके हाथ-पाँव बाँधकर
  rationale: मूल में हाथ और पाँव दोनों स्पष्ट हैं; हिन्दी का संयुक्त पद प्रवाहपूर्ण है और प्रतीक के व्यक्तिपरक स्वरूप को उभरने देता है।
- source_word: ወወደዮ፡ ውስተ፡ ማዕምቅ
  choice: उसे अथाह गड्ढे में फेंक दिया
  rationale: दंडात्मक बल और बंदीकरण की गहन जगह—दोनों को व्यक्त करता है।
- source_word: ማዕምቅ
  choice: अथाह गड्ढा
  rationale: गहरी अधोलोक-सदृश कैद का बिंब देता है और सामान्य पाठक के लिए ‘अथाह कुंड’ की तुलना में अधिक सहज है।
- source_word: ጸቢብ፡ ወዕሙቅ፡ ወዕጹብ፡ ወጽልመት
  choice: सँकरा, गहरा, भयावह और अंधकारमय
  rationale: कारागार-सदृश स्थान के संचित विशेषणों को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है; अंतिम संयोजक संचयी शैली बनाए रखता है।
theological_decisions:
- issue: क्या गिरे हुए ‘तारे’ को मुख्य पाठ में सीधे स्वर्गदूत कहा जाए
  choice: मुख्य पाठ में ‘तारा’ बनाए रखा गया और उसके लिए ‘उसके’ का प्रयोग किया गया।
  alternative: ‘स्वर्गदूत’ लिखना या पूरे वर्णन को स्पष्ट रूप से पुरुषवाचक बनाना।
  rationale: गीज़ पाठ स्पष्ट रूप से ‘तारा’ कहता है, जबकि हाथ-पाँव व्यक्तिगत स्वर्गीय प्राणी की ओर संकेत करते हैं। अनुवाद प्रतीक को व्याख्या से नहीं बदलता।
- issue: ዕጹብ के भय-संबंधी गुण का अनुवाद
  choice: भयावह
  alternative: भयंकर; अद्भुत; विचित्र
  rationale: न्याय और अंधकारमय कैद के संदर्भ में भय उत्पन्न करने वाला अर्थ सर्वाधिक उपयुक्त है, पर किसी विशिष्ट दार्शनिक या पंथगत अर्थ को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। स्रोत की पुनरुक्त ‘पहले’ और दर्शनात्मक प्रतीक ‘तारा’ को बनाए रखा गया है। मुख्य पाठ में सभी पादटिप्पणी-चिह्न [a], [b] उपस्थित हैं।
