base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/015.yaml
  text: And this is the power of this oath, for it is mighty and firm; and he placed this oath, Aka'e, into the hand of Mika'el.
translation:
  language: hi
  text: और यह इस शपथ की सामर्थ्य है, क्योंकि यह प्रबल और अटल है; और उसने इस शपथ—अकाए—को मीकाएल के हाथ में[a] रख दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मीकाएल के हाथ में।” यह उक्ति किसी वस्तु को उसकी देखरेख या अधिकार में सौंपने का भाव दे सकती है।
    reason: मूल के ठोस ‘हाथ में’ वाले प्रयोग को मुख्य पाठ में बनाए रखते हुए उसके संभावित मुहावरेदार निहितार्थ को स्पष्ट करता है।
lexical_decisions:
- source_word: ኃይሉ
  choice: सामर्थ्य
  rationale: यह शब्द शक्ति या प्रभावी सामर्थ्य को व्यक्त करता है। शपथ की गंभीर और प्रभावकारी शक्ति के लिए ‘सामर्थ्य’ स्वाभाविक तथा गरिमापूर्ण है।
- source_word: ማሐላ
  choice: शपथ
  rationale: संदर्भ में बार-बार उसी शपथ का उल्लेख है; ‘शपथ’ सीधे अर्थ को रखता है और ‘अभिशाप-शपथ’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: ኃያል
  choice: प्रबल
  rationale: यह विशेषण शपथ की प्रभावी शक्ति बताता है। ‘प्रबल’ आधुनिक हिन्दी में स्वाभाविक है और ऊँचे साहित्यिक भाव को बनाए रखता है।
- source_word: ፅኑዕ
  choice: अटल
  rationale: यह दृढ़ता, स्थिरता और निश्चलता का भाव देता है। शपथ के लिए ‘अटल’ उसके स्थिर और अभंग होने को स्पष्ट करता है।
- source_word: አንበሮ
  choice: उसने … सौंप दिया
  rationale: मूल क्रिया का आधारभूत अर्थ ‘रखना/स्थापित करना’ है, पर ‘हाथ में’ वाली उक्ति के साथ यहाँ किसी के अधिकार या देखरेख में सौंपने का भाव स्वाभाविक है।
- source_word: አካእ
  choice: अकाए
  rationale: मूल पाठ में उपस्थित इस नाम को छोड़ा नहीं गया है; देवनागरी में इसका निकट और पठनीय लिप्यंतरण ‘अकाए’ है।
- source_word: በእዴሁ ለሚካኤል
  choice: मीकाएल के हाथ में
  rationale: मूल की ठोस ‘हाथ’ वाली छवि सुरक्षित रखी गई है; हिन्दी में यह किसी को सौंपने या उसके अधिकार में देने का स्वाभाविक मुहावरा भी है।
- source_word: ለሚካኤል
  choice: मीकाएल
  rationale: नाम का रूप मूल गीइज़ उच्चारण के निकट रखते हुए देवनागरी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ‘हाथ में’ की उक्ति को शब्दचित्र के रूप में रखना या केवल अधिकार के अर्थ में खोलना
  choice: मीकाएल के हाथ में सौंप दिया
  alternative: मीकाएल के अधिकार में कर दिया
  rationale: मूल पाठ की ठोस और सर्वनाश-दर्शी छवि को रखते हुए हिन्दी क्रिया ‘सौंप दिया’ से निहित भरोसे और अधिकार का भाव भी स्पष्ट हो जाता है; किसी विशेष धर्मसिद्धान्त को आरोपित नहीं किया गया।
- issue: አካእ की व्याकरणिक भूमिका
  choice: 'शपथ के साथ नामसूचक समानाधिकरण: ‘इस शपथ—अकाए—को’'
  alternative: ‘अकाए’ को किसी अलग कर्ता या कर्म के रूप में समझना
  rationale: शब्दक्रम और उपलब्ध पाठ-साक्ष्य इसे शपथ की पहचान या नाम के रूप में पढ़ने का समर्थन करते हैं, यद्यपि विराम-चिह्न संपादकीय हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज पंजीकरण रखा गया है। ‘सामर्थ्य’, ‘प्रबल’ और ‘अटल’ सर्वनाश-दर्शी प्रसंग की गंभीरता रखते हैं, जबकि वाक्य सामान्य पाठक के लिए स्पष्ट बना रहता है। नामों को देवनागरी में मूल रूप के निकट लिप्यंतरित किया गया है।
