base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/009.yaml
  text: And he taught humankind writing with ink and paper[a], and because of this many have gone astray from eternity to eternity[c][b], even to this day.
translation:
  language: hi
  text: और उसने मनुष्यों को स्याही और कागज़ से लिखना सिखाया[a]; और इसी कारण बहुत-से लोग युग से युग तक[b], आज के दिन तक भी, भटकते आए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रस्तुत गीइज़ लिप्यंतरण इस स्थान पर भ्रष्ट प्रतीत होता है। समीक्षित पाठ का अर्थ है, “उसने उन्हें स्याही और कागज़ से लिखना सिखाया”; भ्रष्ट लिप्यंतरण के आधार पर इसे हानिकारक लेखों या “कड़वाहट और छल की लिखित पट्टिकाओं” से भी जोड़ा गया है।
    reason: textual_variant
  - marker: b
    text: या, “अनन्तकाल से अनन्तकाल तक।” गीइज़ शब्द का अर्थ “युग” अथवा “अनन्तकाल” हो सकता है।
    reason: lexical_alternative
