  choice: स्याही और कागज़ से लिखना
  rationale: समीक्षित पाठ स्याही और कागज़/लेखन-सामग्री द्वारा लेखन सिखाने की ओर संकेत करता है। हिन्दी में ‘लिखना’ स्वाभाविक रूप से कौशल को व्यक्त करता है।
- source_word: ብዙኃን
  choice: बहुत-से लोग
  rationale: यह बहुवचन मानवीय समूह को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: እለ ይስሕቱ
  choice: भटकते रहे हैं
  rationale: क्रिया नैतिक और बौद्धिक रूप से मार्ग से चूकने—दोनों अर्थों को खुला रखती है; ‘आज के दिन तक’ के साथ यह पक्ष स्वाभाविक है।
- source_word: እምዓለም ወእስከ ለዓለም
  choice: युग से युग तक
  rationale: ዓለም की पुनरावृत्ति और अपोकैलिप्टिक लय को बचाते हुए ‘अनन्तकाल से अनन्तकाल तक’ की अस्वाभाविकता से बचा गया है।
- source_word: ወእስከ ዛቲ ዕለት
  choice: आज के दिन तक
  rationale: मूल की मानक काल-सूचक अभिव्यक्ति का गरिमापूर्ण और स्पष्ट हिन्दी रूप।
theological_decisions:
- issue: मनुष्यों को दी गई शिक्षा का स्वरूप
  choice: स्याही और कागज़ से लिखने की कला
  alternative: कड़वाहट और छल की लिखित पट्टिकाएँ/हानिकारक लेखन
  rationale: उपलब्ध समीक्षात्मक प्रमाण प्रस्तुत लिप्यंतरण में गंभीर OCR भ्रष्टता बताता है और መሀሮሙ तथा በቀለም ወበክርታስ को अधिक संभावित मानता है। फिर भी पांडुलिपीय आधार की सीमितता फुटनोट में स्पष्ट की गई है।
- issue: ዓለም की कालगत व्याख्या
  choice: युग से युग तक
  alternative: अनन्तकाल से अनन्तकाल तक
  rationale: शब्द ‘युग’ और ‘अनन्तता’ दोनों अर्थ-क्षेत्र रख सकता है। सन्दर्भ में आज तक जारी भटकाव के साथ ‘युग से युग तक’ अधिक सुसंगत है और पुनरावृत्ति भी बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सहज। ‘मनुष्य’ सामूहिक और समावेशी अर्थ में है। वाक्य की प्रलय-साहित्यिक लय बचाने के लिए ‘युग से युग तक’ तथा अंतिम बलाघात ‘आज के दिन तक’ रखा गया है।
