base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/018.yaml
  text: And by that oath the sea was created[a], and as its foundation for the time of wrath he set sand for it[c][b], and it does not pass beyond it from the creation of the world and forever.
translation:
  language: hi
  text: और उसी शपथ के द्वारा समुद्र की सृष्टि हुई; और क्रोध के समय के लिए[a] उसने उसकी नींव के रूप में बालू ठहरा दी[b][c], और संसार की सृष्टि से लेकर सदा तक वह उससे आगे नहीं बढ़ता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह कठिन गीज़ वाक्यांश अधिक सामान्य अर्थ में ‘न्याय के समय के लिए’ भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उसकी नींव’ से संभवतः समुद्र का स्थिर आधार या उसकी निर्धारित सीमा अभिप्रेत है; चित्र यह है कि बालू वह सीमा है जिसे समुद्र पार नहीं कर सकता।
    reason: lexical_alternative
  - marker: c
    text: या, ‘उसने उसके लिए बालू ठहरा दी।’
    reason: previous_rendering
lexical_decisions:
- source_word: ማሐላ
  choice: शपथ
  rationale: यहाँ यह शब्द उन शपथों के क्रम में आता है जिनके द्वारा सृष्टि के तत्त्व स्थापित होते हैं; इसलिए ‘शाप’ की अपेक्षा ‘शपथ’ प्रसंग के अधिक अनुकूल है।
- source_word: ተፈጥረት
  choice: सृष्टि हुई
  rationale: निष्क्रिय सृष्टि-वाचक रूप को बनाए रखते हुए यह आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ባሕር
  choice: समुद्र
  rationale: यहाँ सृष्टि के एक विश्वव्यापी तत्त्व का उल्लेख है; ‘समुद्र’ उसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: መሠረታ
  choice: उसकी नींव
  rationale: शब्द का सामान्य अर्थ ‘नींव’ या ‘आधार’ है। प्रसंग में यह समुद्र को स्थिर रखने वाली सीमा का बोध भी करा सकता है, पर मुख्य पाठ में ठोस मूल बिंब बनाए रखा गया है।
- source_word: ለጊዜ መዓት
  choice: क्रोध के समय के लिए
  rationale: कठिन वाक्यांश के काल-संबंधी और प्रलय-विषयक दोनों पक्ष सुरक्षित रहते हैं; ‘न्याय के समय’ भी संभव है।
- source_word: አንበረ ላቲ ኆፃ
  choice: उसने बालू को ... ठहरा दिया
  rationale: क्रिया रखने, स्थापित करने या नियुक्त करने का भाव देती है और बालू समुद्र के लिए नियत सीमा अथवा आधार का ठोस चित्र प्रस्तुत करती है।
- source_word: ወኢትኅልፍ
  choice: वह उससे आगे नहीं बढ़ता
  rationale: यह सीमा को पार न करने का भाव स्पष्ट करता है और ‘उससे’ के संदर्भ को जानबूझकर पूर्णतः नहीं खोलता।
- source_word: እምፍጥረተ ዓለም ወእስከ ለዓለም
  choice: संसार की सृष्टि के समय से लेकर सदा तक
  rationale: यह सृष्टि से आरम्भ होकर अनंत भविष्य तक की अवधि को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: समुद्र की बालू को केवल प्राकृतिक तट मानना या ईश्वर द्वारा ठहराई गई विश्वव्यापी सीमा के रूप में प्रस्तुत करना
  choice: बालू को समुद्र की ‘नींव’ ठहराने का ठोस बिंब और ‘क्रोध के समय’ का प्रलय-विषयक संकेत दोनों बनाए रखे गए हैं।
  alternative: इसे अधिक व्याख्यात्मक रूप में ‘उसने समुद्र की सीमा बाँध दी’ कहा जा सकता था।
  rationale: गीज़ पाठ भौतिक बिंब और क्रोध/न्याय की कालगत भाषा को साथ रखता है; किसी एक पक्ष में अर्थ सीमित करना मूल तनाव को मिटा देता।
- issue: सीमा ठहराने वाले कर्ता की पहचान
  choice: मूल में निहित एकवचन कर्ता के अनुरूप ‘उसने’ रखा गया है।
  alternative: स्पष्टता के लिए ‘परमेश्वर ने’ जोड़ा जा सकता था।
  rationale: इस पद में कर्ता का नाम प्रत्यक्ष रूप से नहीं है; इसलिए धर्मवैचारिक स्पष्टता के नाम पर उसे मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली अपनाई गई है। ‘शपथ’, ‘सृष्टि’, ‘क्रोध’ और ‘नींव’ मूल की विश्व-सृष्टि तथा प्रलय-विषयक शब्दावली को बनाए रखते हैं। सर्वनामों और कठिन वाक्यांश की वास्तविक अस्पष्टता को अनावश्यक व्याख्या से नहीं हटाया गया है।
