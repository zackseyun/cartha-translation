base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/005.yaml
  text: And the second[a], whose name was Asbe'el—this one taught the evil counsel to the holy sons of God[c][b], and led them astray so that they defiled their bodies with the daughters of men.
translation:
  language: hi
  text: और दूसरे[a] का नाम अस्बाएल था। इसी ने पवित्र स्वर्गदूतों के पुत्रों[b] को दुष्ट सलाह सिखाई और उन्हें भटका दिया, ताकि वे मनुष्यों की पुत्रियों के साथ अपने शरीरों को अशुद्ध करें[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक और का नाम अस्बाएल था।” गीइज़ शब्द का अर्थ “दूसरा” और “एक और,” दोनों हो सकता है; आसपास की क्रमबद्ध सूची “दूसरे” का समर्थन करती है।
    reason: alternative_reading
  - marker: b
    text: या, “स्वर्गदूतों के पवित्र पुत्रों।” गीइज़ पदबंध की वाक्य-रचना कठिन है, और यहाँ उसके शब्द-विन्यास की पुष्टि के लिए कोई समानांतर ग्रीक या कुमरान पाठ उपलब्ध नहीं है।
    reason: textual_syntax_uncertainty
  - marker: c
    text: शाब्दिक रूप से, “मांस।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልእ
  choice: दूसरे
  rationale: इस अध्याय की क्रमबद्ध सूची में पहले, तीसरे और चौथे का उल्लेख आता है; इसलिए यहाँ ‘दूसरे’ अर्थ अधिक उपयुक्त है, यद्यपि शब्द का अर्थ ‘एक और’ भी हो सकता है।
- source_word: አስብኤል
  choice: अस्बाएल
  rationale: व्यक्तिनाम का अनुवाद करने के बजाय गीइज़ उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: ዝንቱ
  choice: इसी ने
  rationale: यह रूप नामित व्यक्ति पर दिए गए संकेतात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: አመርሙ
  choice: सिखाई
  rationale: संदर्भ में किसी बुरी सम्मति को दूसरों तक पहुँचाने या उसका निर्देश देने का भाव है; ‘सिखाई’ इसे सहज हिन्दी में व्यक्त करता है।
- source_word: ምክረ እኩየ
  choice: दुष्ट सलाह
  rationale: ‘सलाह’ सम्मति या परामर्श का ठोस भाव रखती है और ‘दुष्ट’ उसके नैतिक चरित्र को स्पष्ट करता है।
- source_word: ለደቂቀ መላእክት ቅዱሳን
  choice: पवित्र स्वर्गदूतों के पुत्रों को
  rationale: यह अनिश्चित गीइज़ पदबंध ‘पुत्रों’, ‘स्वर्गदूतों’ और ‘पवित्र’—तीनों घटकों को बनाए रखता है। विशेषण का सटीक संबंध संदिग्ध होने के कारण विकल्प पादटिप्पणी में दिया गया है।
- source_word: አስሐቶሙ
  choice: उन्हें भटका दिया
  rationale: इसमें छल और नैतिक मार्ग से विचलित करने, दोनों का भाव स्वाभाविक रूप से आता है।
- source_word: ከመ ያማስኑ
  choice: ताकि वे … अशुद्ध करें
  rationale: गीइज़ के प्रयोजन अथवा परिणाम के संभावित भाव को बिना किसी एक को अत्यधिक निश्चित किए व्यक्त करता है।
- source_word: ሥጋሆሙ
  choice: अपने शरीर
  rationale: शाब्दिक ‘मांस’ की अपेक्षा यौन अशुद्धता के इस प्रसंग में ‘शरीर’ आधुनिक हिन्दी में अधिक स्पष्ट है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: በአዋልደ ሰብእ
  choice: मनुष्यों की पुत्रियों के साथ
  rationale: यह मानव स्त्रियों का पारंपरिक और पारदर्शी संकेत है; ‘के साथ’ प्रसंग में निहित यौन संबंध को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ለደቂቀ መላእክት ቅዱሳን में ‘पवित्र’ विशेषण का संबंध
  choice: पवित्र स्वर्गदूतों के पुत्रों को
  alternative: स्वर्गदूतों के पवित्र पुत्रों को
  rationale: इस स्थल पर ग्रीक या कुमरान पाठ का नियंत्रण उपलब्ध नहीं है और गीइज़ वाक्यांश व्याकरण की दृष्टि से कठिन है। मुख्य पाठ सतही शब्द-क्रम के अनुकूल है, जबकि वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है; ‘परमेश्वर के पुत्र’ जैसा अधिक परिचित पद पाठ में आयात नहीं किया गया।
- issue: ሥጋ का अनुवाद
  choice: शरीर
  alternative: मांस
  rationale: तात्कालिक प्रसंग शारीरिक और यौन अशुद्धता का है, इसलिए ‘शरीर’ सामान्य पाठक के लिए स्पष्ट है; अधिक शाब्दिक ‘मांस’ को पादटिप्पणी में दर्ज किया गया है।
- issue: ካልእ का क्रमसूचक या अनिर्दिष्ट अर्थ
  choice: दूसरे
  alternative: एक और
  rationale: आसपास की क्रमबद्ध गणना ‘दूसरे’ का समर्थन करती है, पर शब्द की वास्तविक वैकल्पिक संभावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘पुत्रियाँ’, ‘दुष्ट सलाह’ और ‘अशुद्ध’ जैसे शब्द सामान्य पाठकों के लिए बोधगम्य रहते हुए प्राचीन अपोकैलिप्टिक प्रसंग की गंभीरता बनाए रखते हैं।
