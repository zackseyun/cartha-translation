base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/021.yaml
  text: And by that oath the stars complete their courses[a], and their names are called[c][b], and they answer from age to age and forever.
translation:
  language: hi
  text: और उस शपथ के द्वारा तारे अपने परिक्रमण पूरे करते हैं, और उनके नाम पुकारे जाते हैं, और वे युग से युग तक उत्तर देते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ संक्षिप्त है। अंतिम क्रिया का अनुवाद ‘वे उसे उत्तर देते हैं’ भी हो सकता है; ‘उसे’ संभवतः नाम पुकारने वाले या प्रभु की ओर संकेत करता है। इसी प्रकार ‘उनके नाम पुकारे जाते हैं’ को अधिक शाब्दिक ढंग से ‘वे उनके नाम पुकारते हैं’ भी समझा जा सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: ማሐላ
  choice: शपथ
  rationale: इस अध्याय के प्रसंग और በውእቱ के साथ वाक्यांश का अर्थ ‘उस शपथ के द्वारा’ है; इसे तारों की ‘चाल’ मानना उचित नहीं।
- source_word: ከዋክብት
  choice: तारे
  rationale: मूल का सामान्य और सजीव ब्रह्मांडीय बिंब सीधे बनाए रखा गया है।
- source_word: ይፌጽሙ ምሕዋሪሆሙ
  choice: अपने परिक्रमण पूरे करते हैं
  rationale: क्रिया पूर्ण करने को और संज्ञा गति/चक्कर को व्यक्त करती है; ‘परिक्रमण’ तारों की नियमित चक्रीय गति के लिए स्वाभाविक है।
- source_word: አስማቲሆሙ ይጼውዑ
  choice: उनके नाम पुकारे जाते हैं
  rationale: गीज़ का बहुवचन क्रियारूप शाब्दिक रूप से सक्रिय समझा जा सकता है, पर इस संक्षिप्त रचना में कर्मवाच्य अर्थ स्वाभाविक है और तारों के नाम पुकारे जाने का क्रम स्पष्ट रखता है।
- source_word: ያወሥእዎ
  choice: वे … उत्तर देते हैं
  rationale: क्रिया उत्तर देने/प्रत्युत्तर देने को व्यक्त करती है। रूप में पुल्लिंग एकवचन कर्म-प्रत्यय की संभावना है, पर उपलब्ध पाठ और वाक्य-संपीड़न में उसका संदर्भ अनिश्चित होने के कारण मुख्य पाठ में अनिर्दिष्ट रखा गया है।
- source_word: እምዓለም ወእስከ ለዓለም
  choice: युगानुयुग सदा
  rationale: यह स्थायी निरंतरता का पारंपरिक मुहावरा है; ‘युगानुयुग सदा’ उसकी गंभीर पुनरुक्ति को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: क्या उत्तर देने वाले निर्जीव तारे हैं या तारों से संबद्ध स्वर्गीय प्राणी
  choice: तारों को नाम सुनकर उत्तर देने वाली सजीव, आज्ञाकारी ब्रह्मांडीय व्यवस्था के रूप में चित्रित होने दिया गया है।
  alternative: उत्तर देने वालों को स्पष्ट रूप से तारा-संबद्ध स्वर्गदूत मानना, अथवा कथन को केवल खगोलीय यांत्रिकी बना देना।
  rationale: अपोकैलिप्टिक भाषा तारों और स्वर्गीय प्राणियों के बीच जानबूझकर तनाव बनाए रख सकती है; मूल इस पहचान को स्पष्ट नहीं करता।
- issue: उत्तर किसे दिया जाता है
  choice: मुख्य पाठ में उत्तर के कर्म को अनिर्दिष्ट रखा गया है।
  alternative: ‘वे उसे उत्तर देते हैं,’ जहाँ ‘उसे’ प्रभु अथवा पुकारने वाले की ओर संकेत करे।
  rationale: ያወሥእዎ में पुल्लिंग एकवचन कर्म-प्रत्यय पढ़ा जा सकता है, किंतु तत्काल पद में उसका स्पष्ट पूर्वपद नहीं है; इसलिए इसे पादटिप्पणी में सुरक्षित रखना बेहतर है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज शैली। ‘परिक्रमण’ ब्रह्मांडीय गति को स्पष्ट करता है, जबकि ‘युगानुयुग सदा’ मूल के स्थायी निरंतरता वाले मुहावरे को बनाए रखता है।
