base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/006.yaml
  text: And the third was named Gadreel[a]; this is the one who showed all the blows of death to the children of men, and he led Eve astray[c][b], and he showed the weapons of death to the sons of men—the shield and the breastplate and the sword for slaughter—and all the weapons of death to the children of men.
translation:
  language: hi
  text: और तीसरे का नाम गाद्रेल था। वही था जिसने मनुष्यों की सन्तान को मृत्यु के सभी प्रहार[a] दिखाए, और उसी ने हव्वा को भटका दिया। उसने मनुष्यों के पुत्रों को मृत्यु के हथियार[b]—ढाल, कवच और वध के लिए तलवार—दिखाए, और मनुष्यों की सन्तान को मृत्यु के सभी हथियार दिखाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मृत्यु पहुँचाने वाले सभी प्रहार।” मूल अभिव्यक्ति हथियारों तक सीमित न होकर घातक प्रहारों, आक्रमणों या घावों के व्यापक अर्थ में भी समझी जा सकती है।
    reason: lexical_alternative
  - marker: b
    text: इस गीइज़ साक्षी में “मृत्यु के हथियार” वाला अंश पाठ की दृष्टि से कठिन है। सूची के बाद उसका सार फिर दोहराया गया है; अनुवाद ने सूची और दोहराए गए समापन, दोनों को बनाए रखा है।
    reason: textual_variant
lexical_decisions:
- source_word: ሣልስ፡ ስሙ፡ ጋድርኤል
  choice: तीसरे का नाम गाद्रेल था
  rationale: क्रमसूचक और नामकरण-सूत्र को स्वाभाविक हिन्दी में रखा गया है; व्यक्ति के नाम को गीइज़ रूप के निकट लिप्यन्तरित किया गया है।
- source_word: ኵሎ፡ ዝብጠተ፡ ሞት
  choice: मृत्यु के सभी प्रहार
  rationale: ሞት को विशेषण बनाकर हल्का करने के बजाय संज्ञा ‘मृत्यु’ के रूप में रखा गया है, जिससे पद में ‘मृत्यु’ की जानबूझकर की गई पुनरावृत्ति बनी रहती है।
- source_word: ለውሉደ፡ ሰብእ / ለደቂቀ፡ ሰብእ
  choice: मनुष्यों की सन्तान / मनुष्यों के पुत्रों
  rationale: दो निकटार्थक गीइज़ अभिव्यक्तियों के बीच का हल्का शब्दगत अन्तर हिन्दी में भी रखा गया है, बिना उनके सामूहिक मानव-सन्दर्भ को बदले।
- source_word: አስሐታ፡ ለሔዋን
  choice: हव्वा को भटका दिया
  rationale: यह सक्रिय रूप से भूल या विपथन में ले जाने का अर्थ देता है और स्रोत में गाद्रेल को दिए गए कर्तृत्व को स्पष्ट रखता है।
- source_word: ንዋየ፡ ሞት
  choice: मृत्यु के हथियार
  rationale: आगे दी गई युद्ध-सामग्री की सूची के कारण ‘हथियार’ प्रसंगानुकूल है; ‘मृत्यु’ को संज्ञा के रूप में रखकर मूल की आवृत्ति भी बचाई गई है।
- source_word: ወለታ፡ ወድርዐ፡ ወሰይፈ፡ ለቀተል
  choice: ढाल, कवच और वध करने की तलवार
  rationale: तीनों युद्ध-साधनों को साधारण आधुनिक हिन्दी में अलग-अलग रखा गया है; अन्तिम पद का उद्देश्यसूचक और हिंसक बल नरम नहीं किया गया।
theological_decisions:
- issue: हव्वा के भटकाए जाने को गाद्रेल से सीधे जोड़ना
  choice: और उसी ने हव्वा को भटका दिया
  alternative: और उसी ने हव्वा को धोखा दिया
  rationale: गीइज़ पाठ यह कार्य सीधे गाद्रेल को सौंपता है। अनुवाद इस तनाव को किसी अन्य परम्परा से मिलाने या समझाकर हटाने के बजाय ज्यों का त्यों रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मृत्यु’ की तीनfold मूल पुनरावृत्ति हिन्दी में सुरक्षित है। ‘सन्तान’ और ‘पुत्रों’ का हल्का वैविध्य स्रोत की दो निकटार्थक मानव-सामूहिक अभिव्यक्तियों को दर्शाता है।
