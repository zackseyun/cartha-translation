base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/022.yaml
  text: And likewise heaven[a], the spirits of the winds, and all the spirits[d][c][b], and their paths from all the gatherings of spirits.
translation:
  language: hi
  text: और इसी प्रकार आकाश[a], पवनों की आत्माएँ, और सभी आत्माएँ, तथा आत्माओं के सब समूहों से उनके मार्ग[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पंक्ति का गीज़ वाक्य-विन्यास कठिन है। मूल में क्रिया नहीं है और यह संभवतः ब्रह्मांडीय तत्वों की सूची का अंश है।
    reason: textual_difficulty
  - marker: b
    text: ‘मार्ग’ का अर्थ ‘पथ’, ‘गतियाँ’ या ‘परिक्रमा-पथ’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘समूहों’ का अनुवाद ‘मंडलियों’, ‘जमावों’ या ‘समुदायों’ के रूप में भी किया जा सकता है। अंतिम वाक्यांश का पिछले शब्दों से व्याकरणिक संबंध निश्चित नहीं है।
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: ሰማይ
  choice: आकाश
  rationale: यहाँ प्रसंग ब्रह्मांडीय तत्वों का है; इसलिए ‘आकाश’ आधुनिक हिन्दी में स्वाभाविक है और ‘स्वर्ग’ से जुड़ी अनावश्यक परलोक-संबंधी धारणा से बचाता है।
- source_word: ነፋሳቲሆሙ ለነፋሳት
  choice: पवनों की आत्माएँ
  rationale: वाक्यांश को संबंधसूचक रचना के रूप में लिया गया है। पहला पद श्वास/प्राण/आत्मा और दूसरा यहाँ ब्रह्मांडीय ‘पवनों’ का बोध कराता है; अतः दोनों शब्दों का भेद बनाए रखा गया है और कोई अस्रोत क्रिया नहीं जोड़ी गई।
- source_word: መንፈሳት
  choice: आत्माएँ
  rationale: दोहराया गया पद ‘आत्माओं’ के अर्थ में लिया गया है। इससे मूल का आत्मिक-ब्रह्मांडीय स्वर बना रहता है और ‘प्राण’ या ‘हवाएँ’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं किया जाता।
- source_word: ወፍናዋቲሆሙ
  choice: उनके मार्ग
  rationale: अस्पष्ट पद गति के मार्ग, पथ या क्रम को सूचित कर सकता है। ‘मार्ग’ इस व्यापकता को बनाए रखता है।
- source_word: እምኵሉ ኅብራት መንፈሳት
  choice: आत्माओं के सब समूहों से
  rationale: ‘समूह’ मूल के संगठित जमाव, मंडली या समुदाय जैसे संभावित अर्थों को किसी एक तकनीकी ब्रह्मांडीय वर्ग में सीमित नहीं करता।
theological_decisions:
- issue: क्या መንፈሳት को ‘आत्माएँ’, ‘प्राण’ या ‘आत्मिक प्राणी’ कहा जाए
  choice: आत्माएँ
  alternative: प्राण; आत्मिक प्राणी
  rationale: ‘आत्माएँ’ मूल की व्यापकता और रहस्योद्घाटनात्मक भाषा को सुरक्षित रखता है। ‘आत्मिक प्राणी’ अस्तित्वगत पहचान को अधिक स्पष्ट कर देता, जबकि ‘प्राण’ मानवशास्त्रीय अर्थ की ओर झुका सकता है।
- issue: क्या पद में ‘प्राप्त किया’ जैसी क्रिया जोड़ी जाए
  choice: मूल की क्रियारहित सूची-संरचना बनाए रखी गई
  alternative: ‘आकाश ने ... ग्रहण किया’ जैसी पूर्ण क्रिया जोड़ना
  rationale: गीज़ पाठ में ग्रहण करने की कोई स्पष्ट क्रिया नहीं है। क्रिया जोड़ने से पाठ में ऐसी घटना और धर्मवैचारिक अर्थ आ जाता जो स्रोत में व्यक्त नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। स्रोत की क्रियारहित, सूची-जैसी और कुछ असहज संरचना को पूरी तरह समतल नहीं किया गया, ताकि वास्तविक पाठगत अस्पष्टता बनी रहे।
