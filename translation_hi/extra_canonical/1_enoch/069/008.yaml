base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/008.yaml
  text: And the fourth—his name was Penemue—this one showed the children of men the bitter and the sweet[b][a], and he showed them all the secrets of their wisdom.
translation:
  language: hi
  text: और चौथे का नाम पेनेमुए था। इसी ने मनुष्यों की सन्तानों को कड़वा और मीठा[a] दिखाया, और उसने उन्हें उनकी बुद्धि के सारे रहस्य दिखाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कड़वाहट और मिठास।” मूल गीइज़ अभिव्यक्ति संक्षिप्त है; यह शाब्दिक स्वादों का विरोध भी हो सकती है और मिले-जुले या नैतिक अर्थ वाले ज्ञान का रूपक भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: ራብዕ፡ ስሙ፡ ፔኔሙኤ
  choice: चौथे का नाम पेनेमुए था
  rationale: सूची में आए क्रमवाचक और नामकरण-सूत्र को स्वाभाविक हिन्दी में रखा गया है; व्यक्ति के नाम का अनुवाद न करके लिप्यंतरण किया गया है।
- source_word: ዝንቱ
  choice: इसी ने
  rationale: संकेतवाचक शब्द का हल्का बल सुरक्षित रखते हुए पहले बताए गए पेनेमुए की ओर स्पष्ट संकेत किया गया है।
- source_word: አርአየ / ወአርአዮሙ
  choice: दिखाया / दिखाए
  rationale: एक ही मूल क्रिया की पुनरावृत्ति सुरक्षित रखी गई है; ‘सिखाया’ या ‘प्रकट किया’ की अपेक्षा ‘दिखाया’ मूल अर्थ को कम व्याख्यात्मक ढंग से व्यक्त करता है।
- source_word: ለውሉደ፡ ሰብእ
  choice: मनुष्यों की सन्तानों को
  rationale: हनोक-साहित्य की ऊँची मानव-संबंधी अभिव्यक्ति को बनाए रखा गया है, पर हिन्दी में इसे समझने योग्य रखा गया है।
- source_word: መሪረ፡ ወመዓርፂረ
  choice: कड़वा और मीठा
  rationale: विशेषणों के संज्ञावत् प्रयोग को अमूर्त ‘कड़वाहट और मिठास’ में बदलने के बजाय सीधे विशेषणात्मक रूप में रखा गया है।
- source_word: ኵሎ፡ ኅቡኣተ፡ ጥበቦሙ
  choice: उनकी बुद्धि के सारे रहस्य
  rationale: ‘सारे’, ‘रहस्य’ और संबंधसूचक प्रत्यय ‘उनकी’—तीनों को सुरक्षित रखा गया है; ‘बुद्धि’ ज्ञान या कौशल की तुलना में मूल की धार्मिक-साहित्यिक अनुगूँज बेहतर बनाए रखती है।
theological_decisions:
- issue: ‘कड़वा और मीठा’ का आशय
  choice: कड़वा और मीठा
  alternative: कड़वाहट और मिठास; बुरा और भला
  rationale: मूल पाठ विपरीतार्थक जोड़े को स्पष्ट रूप से नैतिक नहीं बनाता। इसलिए सम्भावित रूपक या नैतिक अर्थ थोपे बिना उसकी संक्षिप्तता और अस्पष्टता सुरक्षित रखी गई है।
- issue: ኅቡኣተ ጥበቦሙ में संबंधसूचक प्रत्यय
  choice: उनकी बुद्धि के सारे रहस्य
  alternative: बुद्धि के सारे रहस्य; बुद्धि की सारी गुप्त बातें
  rationale: मूल में उपस्थित ‘उनकी’ को बनाए रखने से ये रहस्य मनुष्यों से जुड़े रहते हैं और वाक्य को सामान्य अमूर्त कथन में नहीं बदला जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और हल्का साहित्यिक रूप अपनाया गया है। ‘मनुष्यों की सन्तानें’, ‘बुद्धि’ और ‘रहस्य’ हनोक-साहित्य की अपोकैलिप्टिक शैली बनाए रखते हैं।
