base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/017.yaml
  text: And the earth was founded upon the waters[a], and from the hidden places of the mountains living waters come forth[e][d][c][b], from the creation of the world and forever.
translation:
  language: hi
  text: और पृथ्वी जल के ऊपर स्थापित की गई, और पहाड़ों के छिपे हुए स्थानों से जीवित जल[a] संसार की सृष्टि से लेकर सदा तक निकलते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राप्त गीज़ पाठ में प्रयुक्त विशेषण असामान्य है। यहाँ उसका शाब्दिक अनुवाद ‘जीवित’ किया गया है; सम्भव पाठ के अनुसार ‘उत्तम’ या ‘सुंदर’ भी हो सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: ተሳረረት
  choice: स्थापित की गई
  rationale: यह क्रिया यहाँ ‘नींव डालना/स्थापित करना’ व्यक्त करती है। इससे जल के ऊपर स्थापित पृथ्वी का ठोस ब्रह्मांडीय चित्र सुरक्षित रहता है।
- source_word: ዲበ ማይ
  choice: जल के ऊपर
  rationale: पूर्वसर्ग और संज्ञा का निकट अर्थ ‘जल के ऊपर/पर’ है; हिन्दी में ‘जल के ऊपर’ दृश्य को स्पष्ट और स्वाभाविक रखता है।
- source_word: ኅቡኣተ አድባር
  choice: पहाड़ों के छिपे हुए स्थानों से
  rationale: यह पहाड़ों के भीतर या उनसे जुड़े गुप्त, अदृश्य स्रोतों का बिंब बनाए रखता है।
- source_word: ኅሑያን ማያት
  choice: जीवनदायी जलधाराएँ
  rationale: प्राप्त पाठ का पहला शब्द असामान्य और पाठगत रूप से संदिग्ध है। ‘जीवनदायी जलधाराएँ’ ‘जीवित जल’ की सम्भावना को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि वैकल्पिक पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ይመፅኡ
  choice: निकलती आ रही हैं और सदा निकलती रहेंगी
  rationale: गीज़ का अपूर्णकाल निरंतर क्रिया का भाव देता है। आरम्भ और अनंत भविष्य को बताने वाले अगले पदांश के साथ हिन्दी में निरंतरता स्पष्ट करने के लिए विस्तृत क्रियापद चुना गया है।
- source_word: እምፍጥረተ ዓለም ወእስከ ለዓለም
  choice: संसार की सृष्टि के समय से … और सदा
  rationale: यह आरम्भ से अनिश्चित भविष्य तक की समयावधि व्यक्त करता है। हिन्दी वाक्य में क्रिया के दोनों रूपों के साथ रखने से यह व्यापक कालगत अर्थ स्वाभाविक बनता है।
theological_decisions:
- issue: पृथ्वी और जल का ब्रह्मांडीय/प्रलयदर्शी चित्र
  choice: पृथ्वी को जल के ऊपर स्थापित किए जाने के ठोस चित्र को बनाए रखा गया है।
  alternative: इसे रूपक मानकर ‘पृथ्वी सुरक्षित की गई’ या ‘भूमि जल से अलग की गई’ कहना।
  rationale: मूल पाठ ठोस ब्रह्मांडीय भाषा का प्रयोग करता है; उसे रूपक या आधुनिक वैज्ञानिक विवरण में बदलना पाठ से आगे जाना होगा।
- issue: जल के विशेषण की पाठगत अनिश्चितता
  choice: मुख्य पाठ में ‘जीवनदायी’ रखा गया और ‘उत्तम/सुंदर’ को पादटिप्पणी में दिया गया।
  alternative: मुख्य पाठ में ‘उत्तम जलधाराएँ’ या ‘सुंदर जलधाराएँ’ रखना।
  rationale: प्रेषित रूप ኅሑያን असामान्य है और उपलब्ध समीक्षा-साक्ष्य दो सम्भव पाठों की ओर संकेत करते हैं; इसलिए एक सम्भावना को बिना सूचना अंतिम नहीं माना गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘जल’, ‘सृष्टि’ और ‘जीवनदायी’ जैसे परिचित साहित्यिक शब्द दर्शनात्मक स्वर बनाए रखते हैं; क्रियापद को विस्तृत करके मूल अपूर्णकाल और आरम्भ-से-अनंत तक की अवधि को स्वाभाविक हिन्दी में व्यक्त किया गया है।
