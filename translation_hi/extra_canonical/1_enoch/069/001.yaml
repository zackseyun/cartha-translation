base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/001.yaml
  text: And after this judgment[a], they will terrify them and oppress them[d][c][b], because they showed this to those who dwell upon the dry land.
translation:
  language: hi
  text: और इस न्याय के बाद वे उन्हें भयभीत करेंगे और उन पर अत्याचार करेंगे,[a] क्योंकि उन्होंने यह[b] उन लोगों को दिखाया जो सूखी भूमि पर रहते हैं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद में “वे” और “उन्हें” किनके लिए हैं, यह स्पष्ट नहीं किया गया है; उनका संकेत पिछले प्रसंग से समझना होगा।
    reason: referential_ambiguity
  - marker: b
    text: “यह” किस बात की ओर संकेत करता है, पद स्वयं नहीं बताता; संभवतः आशय पहले बताई गई बात से है।
    reason: alternative_reading
  - marker: c
    text: शाब्दिक अर्थ “सूखी भूमि” है; इसे केवल सामान्य अर्थ में “पृथ्वी” भी समझा जा सकता है, पर मूल में जल के विपरीत स्थलभूमि का संकेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረ ዝ ኵነኔ
  choice: इस न्याय के बाद
  rationale: यह पदबंध ‘इस न्याय के बाद’ का कालवाचक अर्थ देता है और ‘न्याय’ को अगले क्रियापदों का कर्ता बनाने से बचाता है।
- source_word: ያደነገፅዎሙ
  choice: उन्हें भयभीत करेंगे
  rationale: प्रेरणार्थक भय या आतंक का भाव व्यक्त करता है; बहुवचन कर्ता और बहुवचन कर्म दोनों को हिन्दी में स्पष्ट रखा गया है।
- source_word: ያምዕፅዎሙ
  choice: उन पर अत्याचार करेंगे
  rationale: मूल क्रिया दमन, हिंसा या अन्याय करने का भाव रखती है; इसलिए ‘अत्याचार करेंगे’ ‘दूर भगा देंगे’ से अधिक स्रोत-संगत है।
- source_word: እስመ
  choice: क्योंकि
  rationale: अगले उपवाक्य को पूर्ववर्ती कार्रवाई का कारण बताने वाले स्पष्ट कारणसूचक संयोजक के रूप में प्रस्तुत करता है।
- source_word: ዘንተ አርአዩ
  choice: उन्होंने यह ... दिखाया
  rationale: ‘यह’ के अस्पष्ट संकेत को स्रोत के समान अनिर्दिष्ट रखते हुए दिखाने या प्रकट करने का सीधा अर्थ सुरक्षित रखा गया है।
- source_word: ለእለ የኀድሩ
  choice: उन लोगों को ... जो रहते हैं
  rationale: निवासियों के लिए प्रयुक्त सहभागी अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में प्रस्तुत करता है।
- source_word: ዲበ የብስ
  choice: सूखी भूमि पर
  rationale: समुद्र या जल के विपरीत स्थलभूमि की ठोस ब्रह्मांड-संबंधी छवि को ‘पृथ्वी’ जैसे सामान्यीकरण के बजाय सुरक्षित रखता है।
theological_decisions:
- issue: ኵነኔ का प्रलयदर्शी न्यायिक अर्थ
  choice: इस न्याय
  alternative: इस दण्डादेश / इस दण्ड
  rationale: ‘न्याय’ किसी विशिष्ट न्यायिक घटना को व्यक्त करता है, पर यह अनावश्यक रूप से तय नहीं करता कि आशय निर्णय, दण्डादेश या दोषदण्ड में से ठीक कौन-सा है।
- issue: दोनों बहुवचन सर्वनामों के पूर्वपद
  choice: वे उन्हें
  alternative: संदर्भानुसार व्यक्तियों या समूहों के नाम स्पष्ट कर देना
  rationale: इस पद में कर्ता और कर्म के पूर्वपद व्यक्त नहीं किए गए हैं; उन्हें जोड़ना स्रोत की वास्तविक अस्पष्टता को अनुचित रूप से समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अत्याचार करेंगे’ स्रोत की हिंसा और अन्याय संबंधी क्रिया को स्पष्ट करता है। सर्वनामों और ‘यह’ के संदर्भ को जानबूझकर अनिर्णीत रखा गया है।
