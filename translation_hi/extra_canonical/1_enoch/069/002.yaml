base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/002.yaml
  text: 'And these are the names of those angels[a], and these are their names: the first of them was Semyaza, the second Artaqifa, the third Armen, the fourth Kokabel, the fifth Turiel, the sixth Rumyal, the seventh Daniyal, the eighth Neqael, the ninth Baraqel, the tenth Azazel, the eleventh Armaros, the twelfth Batariel, the thirteenth Basasael, the fourteenth Hananel, the fifteenth Turiel, the sixteenth Simipesiel, the seventeenth Yeterel, the eighteenth Tumael, the nineteenth Turiel, the twentieth Teremael[d][c][b], and the twenty-first Te''azazel.'
translation:
  language: hi
  text: 'और देखो[a], उन स्वर्गदूतों[b] के नाम—और उनके नाम ये हैं: उनमें पहला सेम्याज़ा था, दूसरा अर्ताक़ीफ़ा, तीसरा अर्मेन, चौथा कोकाबेल, पाँचवाँ तूरीएल, छठा रूम्याल, सातवाँ दानियाल, आठवाँ नेक़ाएल, नौवाँ बराक़ेल, दसवाँ अज़ाज़ेल, ग्यारहवाँ अर्मारोस, बारहवाँ बतारीएल, तेरहवाँ बसासाएल, चौदहवाँ हनानेल, पंद्रहवाँ तूरीएल, सोलहवाँ सिमीपेसीएल, सत्रहवाँ येतेरेल, अठारहवाँ तुमाएल, उन्नीसवाँ तूरीएल[c], बीसवाँ तेरेमाएल, और इक्कीसवाँ तेअज़ाज़ेल[d]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ में यहाँ ध्यान आकर्षित करने वाला पद है, जिसका अर्थ “और देखो” है।
    reason: source_clarity
  - marker: b
    text: इस पद के कई नाम कठिन हैं, क्योंकि दृष्टांतों का यह भाग इस कार्यप्रवाह में प्रभावी रूप से केवल गीज़ में सुरक्षित है और उपलब्ध पाठ-साक्ष्य पूर्णतः स्पष्ट नहीं है। नामों को अधिक परिचित रूपों से मिलाने के बजाय दृश्य गीज़ रूपों के निकट रखा गया है।
    reason: textual_variant
  - marker: c
    text: “तूरीएल” नाम गीज़ सूची में थोड़े वर्तनी-भेद के साथ एक से अधिक बार आता है। इस पुनरावृत्ति को बिना सुधार किए सुरक्षित रखा गया है।
    reason: textual_variant
  - marker: d
    text: अन्य संस्करणों और अनुवादों में इनमें से कुछ नाम अलग ढंग से लिखे मिलते हैं; यह प्रायः गीज़ नाम-रूपों की अनिश्चितता के कारण है।
    reason: alternative_reading
