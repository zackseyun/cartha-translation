- source_word: ወነዋ
  choice: और देखो
  rationale: गीज़ पद के आरंभिक विस्मयबोधक को बनाए रखता है; इसे केवल ‘और ये हैं’ कहने से मूल का ध्यान आकर्षित करने वाला भाव लुप्त हो जाता।
