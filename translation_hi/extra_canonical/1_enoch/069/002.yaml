  choice: उन स्वर्गदूतों के नाम
  rationale: संबंधसूचक अर्थ और पीछे संकेत करने वाले बहुवचन demonstrative को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ወዝንቱ፡ ውእቱ፡ አስማቲሆሙ
  choice: और उनके नाम ये हैं
  rationale: सूची आरंभ करने वाले दूसरे, पुनरुक्त उपवाक्य को शैलीगत सुविधा के लिए हटाया नहीं गया है।
- source_word: ቀዳማዊ፡ ዚአሆሙ
  choice: उनमें पहला
  rationale: क्रमवाचक और अंशसूचक दोनों अर्थों को स्पष्ट तथा स्वाभाविक हिन्दी में रखता है।
- source_word: ስምያዛ
  choice: सेम्याज़ा
  rationale: नाम को गीज़ रूप के निकट लिप्यंतरित किया गया है, किसी अधिक परिचित परंपरागत रूप से समरूप नहीं बनाया गया।
- source_word: ጡሩኤል / ጡርኤል
  choice: तूरीएल
  rationale: गीज़ पाठ में थोड़े वर्तनी-भेद के साथ बार-बार आने वाले नाम के लिए एक सुसंगत हिन्दी लिप्यंतरण चुना गया है; पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: ሩምያል
  choice: रूम्याल
  rationale: इसे किसी परिचित ‘रामीएल’ रूप से मिलाने के बजाय उपलब्ध गीज़ स्वरूप के निकट रखा गया है।
theological_decisions:
- issue: स्वर्गदूतों के नामों को अन्य हनोक-साहित्य या बाद की परंपराओं के अधिक परिचित रूपों से मिलाना
  choice: गीज़ साक्ष्य के निकट लिप्यंतरण रखना
  alternative: दानियाल को दानिएल, रूम्याल को रामीएल, या कोकाबेल को कोकाबीएल जैसे मानकीकृत रूप देना
  rationale: यह अंश मुख्यतः गीज़ में सुरक्षित है और कई नाम पाठगत रूप से अनिश्चित हैं; परंपरागत सामंजस्य मूल साक्ष्य की अनिश्चितता छिपा सकता है।
- issue: सूची में तूरीएल नाम की पुनरावृत्ति
  choice: तीनों उपस्थितियों को बनाए रखना
  alternative: उन्हें प्रतिलिपिकार की भूल मानकर किसी नाम को बदलना या हटाना
  rationale: मजबूत पाठालोचनात्मक आधार के बिना प्रेषित सूची को मौन रूप से सुधारना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली अपनाई गई है। मूल की दोहरी सूची-भूमिका और सभी क्रमवाचक संख्याएँ सुरक्षित हैं। विदेशी व्यक्तिनामों में नुक़्ते का सीमित प्रयोग ध्वन्यात्मक भेद दिखाने के लिए किया गया है।
