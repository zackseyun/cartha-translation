base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/016.yaml
  text: And these are the hidden things of this oath [a]. . . and it is made firm by his oath, and heaven was suspended before the world was created[d][c][b], and by it forever.
translation:
  language: hi
  text: और ये इस शपथ की छिपी हुई बातें हैं[a][b] . . . और वह उसकी शपथ से दृढ़ है; और संसार की सृष्टि होने से पहले स्वर्ग लटकाया गया था, और सदा उसी के द्वारा [लटका रहता है][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इथियोपिक पाठ में यहाँ शब्द लुप्त या अनिश्चित हैं; बिंदु उसी क्षतिग्रस्त पाठ को दिखाते हैं।
    reason: textual_variant
  - marker: b
    text: इसका अनुवाद ‘इस शपथ के रहस्य’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: अंतिम शब्दशः वाक्यांश है, ‘और सदा उसी के द्वारा।’ कोष्ठक में ‘लटका रहता है’ पिछली क्रिया से पूरा किया गया है। ‘उसी’ संभवतः शपथ की ओर संकेत करता है, पर मूल पाठ उसका नाम दोबारा नहीं लेता।
    reason: alternative_reading
lexical_decisions:
- source_word: እሉንቱ እሙንቱ
  choice: ये ... हैं
  rationale: बहुवचन संकेतवाचक और संबंधसूचक क्रिया को स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: ኅቡኣቲሁ ለዝ ማሐላ
  choice: इस शपथ की छिपी हुई बातें
  rationale: मूल में छिपी या गुप्त वस्तुओं का बोध है। ‘छिपी हुई बातें’ रहस्यात्मक और प्रलयदर्शी भाव को बनाए रखता है, पर अर्थ को केवल गुप्त शब्दों तक सीमित नहीं करता।
- source_word: ፅኑዕ በመሐላሁ
  choice: उसकी शपथ के द्वारा दृढ़ की गई है
  rationale: दृढ़ता और साधन—दोनों अर्थ सुरक्षित हैं; तीसरे पुरुष के संकेत ‘उसकी’ को किसी नामित पात्र से जोड़कर अस्पष्टता दूर नहीं की गई।
- source_word: ሰማይ ተሰቅለ
  choice: आकाश लटकाया गया था
  rationale: क्रिया के लटकाने या टाँगने वाले सजीव ब्रह्मांडीय बिंब को ‘स्थापित’ जैसे सामान्य शब्द से सपाट नहीं किया गया।
- source_word: ዘእንበለ ይትፈጠር ዓለም
  choice: संसार की सृष्टि होने से पहले
  rationale: यहाँ ዓለም का ब्रह्मांड-संबंधी अर्थ ‘संसार’ स्वाभाविक है और उपवाक्य की कालगत प्राथमिकता स्पष्ट रहती है।
- source_word: ወእስከ ለዓለም ቦቱ
  choice: और वह सदा उसी के द्वारा लटका हुआ है
  rationale: ቦቱ में ‘के द्वारा/में’ का भाव है, ‘उस पर’ का नहीं। हिन्दी में पहले की क्रिया ‘लटकाया गया’ को दोहराकर संक्षिप्त मूल वाक्य का संबंध पठनीय बनाया गया है; ‘उसी’ का संकेत जानबूझकर स्पष्ट नाम से नहीं बदला गया।
theological_decisions:
- issue: शपथ से जुड़ी छिपी हुई बातों का स्वरूप
  choice: ‘छिपी हुई बातें’ के रूप में ठोस किंतु व्यापक प्रलयदर्शी भाषा
  alternative: ‘इस शपथ के रहस्य’ अथवा ‘शपथ के गुप्त शब्द’
  rationale: संदर्भ में शपथ, ब्रह्मांडीय शक्तियाँ और सृष्टि की व्यवस्था जुड़ी हैं; अनुवाद इन्हें केवल शिक्षा या सूत्र मानकर सीमित नहीं करता।
- issue: आकाश का ब्रह्मांडीय बिंब
  choice: आकाश ‘लटकाया गया’ और अब ‘लटका हुआ है’
  alternative: आकाश ‘स्थापित’ या ‘स्थिर किया गया’
  rationale: मूल क्रिया के दृश्य और प्रलयदर्शी बिंब को सुरक्षित रखा गया है।
- issue: अंतिम सर्वनाम का संकेत
  choice: ‘उसी के द्वारा’ कहकर सर्वनाम को बनाए रखना
  alternative: ‘उस शपथ के द्वारा’ कहकर संकेत को स्पष्ट कर देना
  rationale: संदर्भ शपथ की ओर संकेत करता है, पर मूल में संज्ञा दोहराई नहीं गई; इसलिए वास्तविक भाषिक अस्पष्टता को समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर और प्रलयदर्शी शैली के अनुरूप रखी गई है। अंश के क्षतिग्रस्त स्थान को हटाया या अनुमान से पूरा नहीं किया गया। ‘आकाश’ सामान्य पाठक के लिए स्वाभाविक है और यहाँ ब्रह्मांडीय अर्थ भी वहन करता है।
