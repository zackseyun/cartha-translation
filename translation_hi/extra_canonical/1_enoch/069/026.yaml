    issue: The phrase ‘उन पर प्रकट किया गया था’ misstates the direction of revelation in natural Hindi.
    rationale: The source clause has a dative sense, ‘revealed to them.’ In Hindi, ‘उन पर’ ordinarily denotes something occurring upon them, not disclosure to them. ‘उनके सामने प्रकट हुआ था’ communicates the intended sense naturally.
  - severity: low
    issue: ‘महिमा की’ is less precise for the final verb of the threefold acclamation.
    rationale: The source and audit trail distinguish blessing, praising, and exalting. ‘महिमामंडित किया’ better preserves the final act as glorification/exaltation while retaining the sequence.
