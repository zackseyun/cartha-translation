base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/026.yaml
  text: And there was great joy among them[a], and they blessed and praised and exalted because the name of that Son of Man had been revealed to them.
translation:
  language: hi
  text: और उनमें बड़ा आनन्द हुआ, और उन्होंने आशीष दी, स्तुति की और महिमामंडित किया, क्योंकि उस मनुष्य-पुत्र[a] का नाम उनके सामने प्रकट हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘मनुष्य-पुत्र’ के रूप में अनूदित गीइज़ उपाधि का शाब्दिक रूप कठिन है। अधिक शाब्दिक अनुवाद ‘मानव-पुत्र’ या, कम सम्भावना से, ‘जीवित जन का पुत्र’ हो सकता है; पर दृष्टान्तों में यह एक पहचानी हुई महिमामय उपाधि के रूप में प्रयुक्त होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወኮኖሙ
  choice: उनके बीच ... छा गया
  rationale: रूप किसी परिणामी अवस्था के उत्पन्न होने को व्यक्त करता है। हिन्दी में ‘उनके बीच ... छा गया’ इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ፍሥሐ ዓቢይ
  choice: बड़ा आनन्द
  rationale: यह पदबंध तीव्र उत्सवपूर्ण हर्ष दर्शाता है; ‘बड़ा आनन्द’ संक्षिप्त, सहज और गरिमापूर्ण है।
- source_word: ባረኩ ወሰብሑ ወአልዐሉ
  choice: आशीष दी, स्तुति की और महिमा की
  rationale: तीनों क्रियाओं को अलग और मूल क्रम में रखा गया है, ताकि स्तुतिपरक पुनरुक्ति बनी रहे। अंतिम क्रिया का भाव ऊँचा उठाने या महिमामंडित करने का है, जिसे यहाँ स्वाभाविक हिन्दी में ‘महिमा की’ कहा गया है।
- source_word: በእንተ ዘተከሥተ ሎሙ
  choice: क्योंकि ... उन पर प्रकट किया गया था
  rationale: यह खंड आनन्द और स्तुति का कारण बताता है। ‘उन पर प्रकट किया गया था’ निष्क्रिय प्रकाशन और उनके लिए हुए उद्घाटन—दोनों भावों को बनाए रखता है।
- source_word: ስሙ
  choice: नाम
  rationale: अगला संबंधसूचक पद इसे निश्चित करता है। ‘नाम’ यहाँ केवल संबोधन नहीं, प्रकट पहचान और अधिकार का संकेत भी रखता है।
- source_word: ለውእቱ ወልደ እጓለ እመሕያው
  choice: उस मनुष्य-पुत्र
  rationale: इस औपचारिक रूप से कठिन गीइज़ पदबंध को दृष्टान्तों के स्थानीय संदर्भ में प्रतिष्ठित महिमामय उपाधि के रूप में रखा गया है। ‘उस’ मूल संकेतवाचक को सुरक्षित रखता है।
theological_decisions:
- issue: ወልደ እጓለ እመሕያው उपाधि का अनुवाद
  choice: उस मनुष्य-पुत्र
  alternative: उस मानव-पुत्र; उस जीवित जन के पुत्र
  rationale: गीइज़ अभिव्यक्ति औपचारिक रूप से असामान्य है, पर हनोक के दृष्टान्तों में यह पहचानी हुई महिमामय उपाधि की तरह कार्य करती है। ‘मनुष्य-पुत्र’ स्थानीय अपोकैलिप्टिक प्रयोग को बनाए रखता है, जबकि पादटिप्पणी वास्तविक शाब्दिक कठिनाई को खुला रखती है और बाद की धर्मशास्त्रीय व्याख्या आरोपित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। मूल की क्रमिक स्तुतिपरक क्रियाएँ सुरक्षित रखी गई हैं और कठिन उपाधि की अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
