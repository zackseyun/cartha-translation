lexical_decisions:
- source_word: ነበረ
  choice: बैठा
  rationale: क्रिया का व्यापक अर्थ ‘था’ या ‘बना रहा’ हो सकता है, पर ዲበ (‘पर’) और መንበረ (‘सिंहासन/आसन’) के साथ यहाँ सिंहासन पर बैठे होने का भाव संदर्भानुकूल है।
- source_word: ዲበ
  choice: पर
  rationale: यह स्थानसूचक पूर्वसर्ग ‘पर/ऊपर’ का अर्थ देता है; आधुनिक मानक हिन्दी में ‘सिंहासन पर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: መንበረ
  choice: सिंहासन
  rationale: शब्द का अर्थ सामान्यतः ‘आसन’ भी हो सकता है, किन्तु इस राजकीय और न्यायिक दर्शन में ‘सिंहासन’ अधिक उपयुक्त है।
- source_word: ስብሐቲሁ
  choice: अपनी महिमा
  rationale: यह ‘महिमा/तेज/वैभव’ के अर्थ वाले शब्द के साथ तृतीय पुरुष एकवचन संबंधसूचक प्रत्यय है। हिन्दी में कर्ता की ही महिमा का सिंहासन होने के कारण ‘अपनी महिमा’ स्वाभाविक रूप से संबंध स्पष्ट करता है।
theological_decisions:
- issue: क्रिया को केवल स्थिति (‘था’) के रूप में अनूदित किया जाए या सिंहासनारूढ़ मुद्रा (‘बैठा’) के रूप में
  choice: और वह अपनी महिमा के सिंहासन पर बैठा।
  alternative: और वह अपनी महिमा के सिंहासन पर था। / और वह अपनी महिमा के सिंहासन पर बना रहा।
  rationale: मूल क्रिया अपने आप में व्यापक है, पर सिंहासन के साथ वाक्य-विन्यास बैठने का भाव सहज रूप से देता है। फिर भी वास्तविक शब्दार्थगत व्यापकता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘अपनी महिमा का सिंहासन’ मूल संबंधवाचक संरचना को स्वाभाविक हिन्दी में व्यक्त करता है।
