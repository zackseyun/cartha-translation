base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/014.yaml
  text: This one asked Mikael to show him the hidden name[a], so that they might remember it in the oath, and so that they might tremble before that name and oath[d][c][b], those who revealed to the children of men all that is hidden.
translation:
  language: hi
  text: इसने मीकाएल से कहा कि वह उसे छिपा हुआ नाम[a][d] दिखाए, ताकि वे शपथ में उस नाम को स्मरण करें[b] और उस नाम और शपथ से काँपें—वे जिन्होंने मनुष्यों की संतान को वह सब प्रकट कर दिया जो छिपा हुआ है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गुप्त नाम’। गीइज़ विशेषण का अर्थ ‘छिपा हुआ’ या ‘ढका हुआ’ है; यहाँ किसी बाद के रहस्यवादी तकनीकी अर्थ को मानना आवश्यक नहीं।
    reason: lexical_alternative
  - marker: b
    text: ‘शपथ में स्मरण करें’ का आशय गंभीर शपथ लेते समय उस नाम का उल्लेख या आह्वान करना भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'अंतिम उपवाक्य संभवतः बताता है कि काँपने वाले कौन हैं: वे जिन्होंने छिपी हुई बातें मनुष्यों को प्रकट कीं। मूल वाक्य-विन्यास संक्षिप्त है, इसलिए व्यापक संदर्भ भी संभव है।'
    reason: alternative_reading
  - marker: d
    text: 'अधिक शाब्दिक रूप: ‘इसने मीकाएल से कहा कि वह उसे … दिखाए।’ इसे प्रत्यक्ष आज्ञा ‘उसे दिखा’ के रूप में पढ़ना कम संभावित है, क्योंकि गीइज़ क्रिया तीसरे पुरुष का जुस्सिव/संभावनार्थक रूप है।'
    reason: grammar
lexical_decisions:
- source_word: ዝንቱ
  choice: इसने
  rationale: आरंभिक संकेतवाचक सर्वनाम पिछले प्रसंग में बताए गए व्यक्ति की ओर बलपूर्वक संकेत करता है; केवल ‘उसने’ की अपेक्षा ‘इसने’ उस संकेतात्मकता को बेहतर बनाए रखता है।
- source_word: ይቤሎ ለሚካኤል ያርእዮ
  choice: मीकाएल से कहा कि वह उसे … दिखाए
  rationale: ይቤሎ सामान्यतः ‘उसने उससे कहा’ है, जबकि ያርእዮ तीसरे पुरुष का जुस्सिव/संभावनार्थक रूप और कर्म-प्रत्यय लिए हुए है। इसलिए अप्रत्यक्ष कथन हिंदी में मूल व्याकरण के निकट और स्वाभाविक है।
- source_word: ስመ ኅቡአ
  choice: छिपा हुआ नाम
  rationale: ኅቡአ का मूल अर्थ छिपा या गुप्त रखा हुआ है। ‘छिपा हुआ’ रहस्यवादी तकनीकी अर्थ आरोपित किए बिना प्रकाशन-साहित्य की गोपनीयता बनाए रखता है।
- source_word: ከመ ይዝክርዎ በመሐላ
  choice: ताकि वे शपथ में उस नाम को स्मरण करें
  rationale: क्रिया स्मरण करने या उल्लेख करने से संबंधित है। संदर्भ में नाम का शपथ के भीतर आह्वान भी अभिप्रेत हो सकता है, पर मुख्य पाठ व्यापक अर्थ को सुरक्षित रखता है।
- source_word: መሐላ
  choice: शपथ
  rationale: इस शब्द का प्राथमिक अर्थ शपथ है। प्रसंग में उससे भय जुड़ा है, फिर भी ‘अभिशाप’ जैसा अधिक तीव्र अर्थ मुख्य पाठ में थोपना उचित नहीं।
- source_word: ከመ ይርዓዱ እምውእቱ ስም ወማሐላ
  choice: उस नाम तथा शपथ के सामने काँपें
  rationale: क्रिया भय से काँपने का सजीव भाव व्यक्त करती है। ‘के सामने काँपें’ नाम और शपथ दोनों को भय के कारण या उपस्थिति के रूप में खुला रखता है।
- source_word: እለ አርአዩ ለውሉደ ሰብእ ኵሎ ዘበኅቡእ
  choice: वे जिन्होंने मनुष्यों की संतान को वह सब प्रकट कर दिया जो छिपा हुआ है
  rationale: सापेक्ष उपवाक्य निषिद्ध रहस्य प्रकट करने वालों की पहचान करता है। ‘मनुष्यों की संतान’ मूल मानववंशीय मुहावरे को बनाए रखता है और किसी बाद की धर्मवैज्ञानिक विशिष्टता को नहीं जोड़ता।
theological_decisions:
- issue: ‘वे स्मरण करें’ और ‘वे काँपें’ के बहुवचन कर्ता की पहचान
  choice: अंतिम सापेक्ष उपवाक्य को इन्हीं क्रियाओं के कर्ताओं—मनुष्यों को छिपी बातें बताने वालों—की पहचान के रूप में प्रस्तुत किया गया है।
  alternative: बहुवचन सामान्य रूप से शपथ सुनने वाले सभी लोगों की ओर संकेत कर सकता है, या संक्षिप्त वाक्य-विन्यास में कर्ता बदल सकता है।
  rationale: तत्काल प्रसंग में स्वर्गीय प्राणियों और अनुचित रहस्यों के प्रकाशन की चर्चा के कारण अंतिम उपवाक्य अपराधी प्रकट करने वालों की पहचान सबसे स्वाभाविक ढंग से करता है; फिर भी मूल की संक्षिप्त वाक्य-रचना के कारण विकल्प को टिप्पणी में सुरक्षित रखा गया है।
- issue: छिपे नाम का स्वरूप
  choice: ‘छिपा हुआ नाम’ कहा गया है, बिना उसे किसी बाद की रहस्यवादी प्रणाली का तकनीकी पद माने।
  alternative: ‘गुप्त नाम’ या किसी विशिष्ट रहस्यवादी नाम की संज्ञा।
  rationale: मूल विशेषण केवल छिपे या ढके होने का अर्थ आवश्यक करता है; इससे अधिक धर्मवैज्ञानिक अर्थ पाठ स्वयं निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘मीकाएल’ गीइज़ नाम-रूप के निकट लिप्यंतरण है। लंबी और संक्षिप्त मूल संरचना को डैश से स्पष्ट किया गया है, पर कर्ता-संबंध की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
