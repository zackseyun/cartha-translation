base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/024.yaml
  text: All these will believe and give thanks before the Lord of Spirits[a], and they will bless with all their power, and their food will be in all thanksgiving[c][b]; and they will give thanks and bless and exalt the name of the Lord of Spirits forever and ever.
translation:
  language: hi
  text: ये सभी आत्माओं के प्रभु के सामने विश्वास करेंगे और धन्यवाद देंगे, और वे अपनी पूरी शक्ति से स्तुति करेंगे; और उनका भोजन समस्त धन्यवाद में होगा[a]। वे धन्यवाद देंगे, स्तुति करेंगे और आत्माओं के प्रभु के नाम को युगानुयुग ऊँचा करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप के निकट: “और उनका भोजन समस्त धन्यवाद में होगा।” गीज़ वाक्यांश संक्षिप्त है और “समस्त धन्यवाद के साथ” भी समझा जा सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ያአምኑ
  choice: विश्वास करेंगे
  rationale: क्रिया विश्वास या भरोसा करने का बोध देती है। यहाँ ‘विश्वास करेंगे’ सीधा और स्वाभाविक है तथा बाद की विशिष्ट धर्मसैद्धांतिक शब्दावली नहीं जोड़ता।
- source_word: የአኵቱ / ወየአኵቱ
  choice: धन्यवाद देंगे
  rationale: निकटवर्ती संज्ञा አኰቴት के कारण यहाँ धन्यवाद का भाव प्रबल है; पुनरावृत्ति भी मूल पाठ की कृतज्ञता-प्रधान भाषा को बनाए रखती है।
- source_word: በቅድመ
  choice: के सामने
  rationale: यह उपस्थिति में या सम्मुख होने का स्थानिक-उपासना संबंधी भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: እግዚአ መንፈሳት / እግዚአ መናፍስት
  choice: आत्माओं के प्रभु
  rationale: 1 हनोक के दृष्टान्तों में यह बार-बार आने वाली ईश्वरीय उपाधि है; अनुवाद इसके उपाधि-सदृश और प्रकाशनात्मक स्वर को सुरक्षित रखता है।
- source_word: ይሴብሑ / ወይሴብሑ
  choice: स्तुति करेंगे
  rationale: क्रिया आशीष देने या प्रशंसा करने का अर्थ रख सकती है। हिन्दी में परमेश्वर के प्रति ‘स्तुति करना’ स्वाभाविक है और धन्यवाद तथा ऊँचा करने से क्रियाओं का भेद बनाए रखता है।
- source_word: በኵሉ ኃይሎሙ
  choice: अपनी पूरी शक्ति से
  rationale: यह उनकी समस्त सामर्थ्य या बल की व्यापकता को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ሲሳዮሙ
  choice: उनका भोजन
  rationale: ሲሳይ का अर्थ भोजन या पोषण है, न कि धन-संपत्ति। यह चयन उस चित्र को सुरक्षित रखता है कि धन्यवाद ही उनका पोषण है।
- source_word: በኵሉ አኰቴት
  choice: हर प्रकार का धन्यवाद
  rationale: गीज़ वाक्यांश संक्षिप्त है और ‘समस्त धन्यवाद में/के साथ’ भी समझा जा सकता है। मुख्य पाठ में यह रूप सुबोध है, जबकि पाद-टिप्पणी संरचनात्मक अस्पष्टता सुरक्षित रखती है।
- source_word: ወያሌዕሉ
  choice: ऊँचा करेंगे
  rationale: क्रिया उठाने या महिमान्वित करने का भाव देती है। ‘नाम को ऊँचा करेंगे’ हिन्दी में स्वाभाविक रहते हुए मूल की ऊर्ध्व छवि बनाए रखता है।
- source_word: ለዓለመ ዓለም
  choice: युगानुयुग
  rationale: यह अनन्त अवधि के गीज़ सूत्र का संक्षिप्त, गरिमापूर्ण और प्रचलित हिन्दी समतुल्य है।
theological_decisions:
- issue: क्या ያአምኑ को स्पष्ट रूप से उत्तरकालीन मसीही धर्मसैद्धांतिक भाषा में व्यक्त किया जाए
  choice: विश्वास करेंगे
  alternative: भरोसा रखेंगे / आस्था रखेंगे
  rationale: यह चयन मूल क्रिया का सामान्य अर्थ बनाए रखता है और उद्धारकारी विश्वास की कोई बाद की विशिष्ट संकल्पना पाठ में नहीं जोड़ता।
- issue: ईश्वरीय उपाधि እግዚአ መንፈሳት का रूप
  choice: आत्माओं के प्रभु
  alternative: आत्माओं का प्रभु
  rationale: सम्बन्धकारक बहुवचन वाला रूप हिन्दी में स्वाभाविक है और 1 हनोक में इस आवर्ती उपाधि की विशिष्टता बनाए रखता है।
- issue: ሲሳዮሙ और स्त्रीलिंग कोपुला ይእቲ से बने वाक्य का अर्थ
  choice: और उनका भोजन हर प्रकार का धन्यवाद होगा
  alternative: और उनका भोजन समस्त धन्यवाद में होगा
  rationale: संज्ञा का अर्थ ‘भोजन/पोषण’ है और कोपुला इसे स्वतंत्र नाममात्र वाक्य बनाती है। मुख्य पाठ अर्थपूर्ण अपोकैलिप्टिक चित्र को सामने रखता है; पाद-टिप्पणी पूर्वसर्गीय बनावट की सम्भावना बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, उपासना-संबंधी और प्रकाशनात्मक लहजा रखा गया है। ‘स्तुति करेंगे,’ ‘नाम को ऊँचा करेंगे’ और ‘युगानुयुग’ सामान्य पाठक के लिए सुबोध हैं। मूल में ‘भोजन’ की छवि तथा संक्षिप्त वाक्यांश की अस्पष्टता को बिना धन-संपत्ति का अर्थ आरोपित किए सुरक्षित रखा गया है।
