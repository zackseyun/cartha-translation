base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/003.yaml
  text: And these are the chiefs of their angels[a], and their names, and the commanders of their hundreds, and the commanders of their fifties[c][b], and the commanders of their tens.
translation:
  language: hi
  text: और ये उनके स्वर्गदूतों के प्रधान, उनके नाम, और उनके सैकड़ों के सेनापति, उनके पचासों के सेनापति और उनके दहाइयों के सेनापति हैं।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ में सैकड़ों, पचासों और दहाइयों की संख्यात्मक इकाइयों के अनुसार एक पदक्रम दिया गया है। सम्भवतः ये केवल कुल संख्याएँ नहीं, बल्कि व्यवस्थित दल या टुकड़ियाँ हैं।
    reason: cultural_note
  - marker: b
    text: मूल में ‘उनके’ का संबंधसूचक भाव बार-बार आता है। ‘उनके’ किसके लिए है, यह आसपास के प्रसंग से निर्धारित होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እሉ
  choice: ये
  rationale: निकटवाची बहुवचन इस परिचयात्मक सूची के लिए स्वाभाविक है।
- source_word: አርእስተ
  choice: प्रधान
  rationale: शाब्दिक अर्थ ‘सिर’ है; पद और नेतृत्व व्यक्त करने के लिए ‘प्रधान’ सहज और गरिमापूर्ण है।
- source_word: መላእክቲሆሙ
  choice: उनके स्वर्गदूतों
  rationale: हनोक के प्रसंग में यह शब्द अलौकिक दूतों के लिए है; संबंधसूचक प्रत्यय को बनाए रखा गया है।
- source_word: አስማቲሆሙ
  choice: उनके नाम
  rationale: बहुवचन और संबंधसूचक रूप को सीधे सुरक्षित रखता है।
- source_word: መኰንነ
  choice: सेनापति
  rationale: क्रमबद्ध सैन्य-प्रशासनिक पद को ‘शासक’ की अपेक्षा अधिक स्पष्ट रूप से व्यक्त करता है।
- source_word: ምእት / ኀምሳ / ዐሠርተ
  choice: सौ-सौ / पचास-पचास / दस-दस के दल
  rationale: वितरणात्मक इकाइयों और क्रमिक पदानुक्रम को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ዚአሆሙ
  choice: उनके
  rationale: मूल में दोहराए गए संबंधसूचक रूप को हिन्दी वाक्य में बनाए रखा गया है; उसका सटीक पूर्वपद प्रसंग पर निर्भर है।
theological_decisions:
- issue: पदक्रम को स्पष्ट सैन्य भाषा में व्यक्त करना
  choice: सौ-सौ, पचास-पचास और दस-दस के दलों के सेनापति
  alternative: सौ, पचास और दस के अधिकारियों/प्रधानों
  rationale: यह चयन संगठित स्वर्गदूतीय पदक्रम की अपोकैलिप्टिक छवि को सुरक्षित रखता है, पर बाद की कलीसियाई पदावली नहीं जोड़ता।
- issue: ‘उनके’ के संदर्भ की अस्पष्टता
  choice: संबंधसूचक ‘उनके’ को पाठ में बनाए रखना
  alternative: किसी विशिष्ट समूह का नाम जोड़ देना
  rationale: गीज़ पाठ स्वयं इस पद में संदर्भ को स्पष्ट नहीं करता; उसे आसपास के प्रसंग पर छोड़ना मूल की वास्तविक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। वितरणात्मक संख्या दिखाने के लिए ‘सौ-सौ’, ‘पचास-पचास’ और ‘दस-दस के दल’ रखा गया है।
