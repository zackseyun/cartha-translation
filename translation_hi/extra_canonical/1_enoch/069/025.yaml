base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/025.yaml
  text: And over them this oath became strong[a], and they are kept by it; and their paths are kept[c][b], and their courses do not perish.
translation:
  language: hi
  text: और उन पर यह शपथ दृढ़ हुई[a], और वे उसके द्वारा रखे जाते हैं; उनके मार्ग भी रखे जाते हैं[b], और उनके परिभ्रमण नष्ट नहीं होते[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उन पर यह शपथ प्रबल हुई।” यहाँ ‘दृढ़ हुई’ शपथ के स्थापित और प्रभावी होने का भाव व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: इथियोपियाई पाठ की यह पंक्ति पाठगत रूप से कठिन है। कर्मवाच्य क्रिया की पुनरावृत्ति इस बात का संकेत हो सकती है कि शपथ के द्वारा वे स्वयं भी रखे जाते हैं और उनके मार्ग भी रखे जाते हैं। ‘रखे जाते हैं’ में संरक्षण और नियंत्रण, दोनों का भाव संभव है।
    reason: textual_variant
  - marker: c
    text: या, “उनकी गतियाँ विफल नहीं होतीं।” ‘परिभ्रमण’ के लिए मूल शब्द सामान्य गतियों, नियत मार्गों या चक्करों का बोध करा सकता है; अंतिम क्रिया का अर्थ “नष्ट नहीं होते” अथवा “विफल नहीं होते” हो सकता है।
    reason: lexical_alternative
