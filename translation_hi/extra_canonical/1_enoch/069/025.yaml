theological_decisions:
- issue: क्या शपथ नैतिक आज्ञाकारिता, अधिकारपूर्ण बंधन या ब्रह्मांडीय व्यवस्था का वर्णन करती है
  choice: अनुवाद में शपथ को उनके ऊपर दृढ़ और उन्हें सुरक्षित रखने वाली बताया गया है, जबकि मार्गों और परिभ्रमणों की स्थिरता भी बनी रहती है।
  alternative: इसे केवल स्वर्गदूतों को आज्ञाकारिता में बाँधने वाली शपथ, केवल ब्रह्मांडीय गतियों को स्थिर रखने वाली शक्ति, अथवा दोनों के संयुक्त वर्णन के रूप में समझा जा सकता है।
  rationale: ‘रखे जाते हैं’ में संरक्षण और नियंत्रण दोनों की संभावना है, और ‘मार्ग’ तथा ‘परिभ्रमण’ सुव्यवस्थित गति की ओर संकेत करते हैं। इसलिए पाठ किसी एक धर्मवैज्ञानिक व्याख्या को निर्णायक नहीं बनाता।
