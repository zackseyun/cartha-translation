  choice: पाँचवें का नाम कासदेया था
  rationale: सूची में पाँचवें पात्र का परिचय देने वाली नामकरण-संरचना को स्वाभाविक हिन्दी में रखा गया है; नाम का अनुवाद नहीं, लिप्यंतरण किया गया है।
- source_word: ዘአርአዩ፡ ለውሉደ፡ ሰብእ
  choice: जिसने मनुष्यों की संतानों को ... दिखाए
  rationale: क्रिया का मूल भाव ‘दिखाना/ज्ञात कराना’ है; ‘सिखाया’ कहने से औपचारिक शिक्षा का अनावश्यक अर्थ जुड़ सकता है। पारंपरिक अपोकैलिप्टिक पदबंध को सहज हिन्दी रूप दिया गया है।
- source_word: ኵሎ፡ ዝብጠታተ፡ እኩየ
  choice: सभी बुरे प्रहार
  rationale: बार-बार आने वाला शब्द मारने, चोट पहुँचाने या पीड़ित करने का बिंब रखता है। ‘प्रहार’ उस ठोस बिंब और पद की पुनरावृत्ति दोनों को सुरक्षित रखता है।
- source_word: ዘነፍሳት፡ ወዘአጋንንት
  choice: आत्माओं और दुष्टात्माओं के
  rationale: दो अलग आध्यात्मिक श्रेणियों को एक में मिलाए बिना भेद बनाए रखा गया है।
- source_word: ዘብጠታተ፡ ባእባአ፡ ማሕፀን፡ ከመ፡ ይደቅ
  choice: गर्भ में होने वाले प्रहार—जिससे गर्भस्थ शिशु गिर जाता है
  rationale: दुरूह पदबंध का आशय गर्भावस्था में ऐसी हानि है जिसका परिणाम गर्भपात होता है। ‘गिर जाता है’ मूल क्रिया की ठोसता रखता है, जबकि ‘गर्भस्थ शिशु’ हिन्दी में संदर्भ स्पष्ट करता है।
- source_word: '[ዝብጠተ፡ ነፍስ፡]'
  choice: प्राण पर होने वाला प्रहार
  rationale: यहाँ एकवचन ‘प्रहार’ सुरक्षित रखा गया है। ‘प्राण’ जीवन/आत्मा की संभावित अर्थ-सीमा को पूरी तरह संकीर्ण नहीं करता; पाठगत अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: ንስክተ፡ አርዌ
  choice: साँप का डसना
  rationale: सर्प द्वारा पहुँचाई गई ठोस हानि के लिए आधुनिक हिन्दी में ‘डसना’ सबसे स्वाभाविक है।
- source_word: ዘይከውን፡ በቀትር
  choice: जो दोपहर में होता है
  rationale: समय-सूचक विचित्र और संभवतः अशुभ बिंब को सामान्यीकृत किए बिना शाब्दिक रूप से सुरक्षित रखा गया है।
- source_word: ወልዳ፡ ለአርዌ፡ ዘስሙ፡ ተባዕት
  choice: साँप का पुत्र, जिसका नाम तबाएत है
  rationale: अंतिम संक्षिप्त वाक्यांश को पूर्ववर्ती दोपहर के प्रहार से डैश द्वारा जोड़ा गया है, पर उसका व्याकरणिक संबंध निश्चित मानकर नहीं समझाया गया; अनिश्चितता पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: कासदेया द्वारा दिखाए गए प्रहारों का स्वरूप
  choice: आत्माओं, दुष्टात्माओं, गर्भ, प्राण और साँप से जुड़े अलौकिक या हानिकारक प्रहारों की सूची
  alternative: सामान्य हथियारों या केवल शारीरिक चोटों का ज्ञान; अथवा जादुई मंत्रों की सूची
  rationale: आत्माओं, दुष्टात्माओं, गर्भ, प्राण और साँप के संयुक्त संदर्भ के कारण अपोकैलिप्टिक तथा अलौकिक भाषा को साधारण तकनीकी ज्ञान में समतल नहीं किया गया है।
- issue: ‘साँप का पुत्र, जिसका नाम तबाएत है’ का संबंध
  choice: डैश के द्वारा इसे दोपहर में होने वाले प्रहार की संभावित पहचान या व्याख्या के रूप में प्रस्तुत किया गया है
  alternative: कासदेया द्वारा दिखाया गया एक अलग दानव; अथवा स्वयं साँप की पहचान बताने वाली परवर्ती टिप्पणी
  rationale: मूल वाक्य-विन्यास संक्षिप्त और संदिग्ध है। मुख्य पाठ संभावित संबंध दिखाता है, जबकि पादटिप्पणी वैकल्पिक समझ को खुला रखती है।
- issue: ‘प्राण/आत्मा पर प्रहार’ की पाठगत स्थिति
  choice: कोष्ठकित पाठ को अनुवाद में रखा और अनिश्चितता पादटिप्पणी में बताई
  alternative: संदिग्ध होने के कारण वाक्यांश को छोड़ देना
  rationale: उपलब्ध साक्ष्य संभावित पाठ देता है; उसे मौन रूप से हटाने के बजाय पारदर्शी ढंग से प्रस्तुत करना उचित है।
