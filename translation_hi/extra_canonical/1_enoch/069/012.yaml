base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/012.yaml
  text: 'And the fifth was named Kasdeya[a]. This is the one who showed the children of men all the evil blows of spirits and of demons, and the blows in the womb, so that the embryo miscarries, and the blow upon the soul: the bite of the serpent[f][e][d][c][b], and the blow that comes at noon—the son of the serpent whose name is Taba''et.'
translation:
  language: hi
  text: 'और पाँचवें का नाम कासदेया था। यही वह था जिसने मनुष्यों की संतानों को ये सब दिखाए: आत्माओं और दुष्टात्माओं के सभी बुरे प्रहार, गर्भ में भ्रूण को लगने वाले प्रहार, जिससे भ्रूण गिर जाए[a], और प्राण पर होने वाला प्रहार[b]: साँप का डसना, और वह प्रहार जो दोपहर में होता है—साँप का पुत्र, जिसका नाम तबाएत है[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गर्भ और भ्रूण से जुड़ा यह पदबंध कठिन है। आशय संभवतः गर्भावस्था में भ्रूण को पहुँचाई गई ऐसी हानि है जिससे गर्भपात हो जाता है।
    reason: textual_variant
  - marker: b
    text: ‘प्राण पर होने वाला प्रहार’ वाला पदबंध इस साक्षी में पाठगत रूप से अनिश्चित है; इसका अर्थ ‘आत्मा पर प्रहार’ या ‘जीवन पर प्रहार’ भी हो सकता है।
    reason: textual_variant
  - marker: c
    text: अंतिम वाक्यांश का संबंध अनिश्चित है। संभव है कि वह दोपहर में होने वाले प्रहार को ‘साँप का पुत्र’ नामक तबाएत से पहचाने; इसे किसी अलग दुष्टात्मा या स्वयं साँप की पहचान के रूप में भी समझा जा सकता है।
    reason: alternative_reading
