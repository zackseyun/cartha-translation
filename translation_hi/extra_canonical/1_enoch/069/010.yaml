base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/010.yaml
  text: 'For men were not born for this: to strengthen their faith with pen and ink[a][b][c].'
translation:
  language: hi
  text: क्योंकि मनुष्य इस उद्देश्य से जन्मे नहीं थे कि वे कलम और स्याही से[a] अपने विश्वास को दृढ़ करें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में, ‘कलम से और पित्त के पानी से।’ इस असामान्य पद का सटीक आशय अनिश्चित है; यहाँ इसे संदर्भानुसार ‘कलम और स्याही’ के रूप में प्रस्तुत किया गया है।
    reason: cultural_note
  - marker: b
    text: ‘विश्वास’ का अर्थ यहाँ ‘भरोसा,’ ‘निष्ठा’ या किसी लिखित प्रतिज्ञा में दिखाई गई ‘विश्वसनीयता’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ इसके संयोजक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ኢተወልዱ ሰብእ
  choice: मनुष्य ... जन्मे नहीं थे
  rationale: निषेधात्मक कर्मवाच्य जन्म या उत्पत्ति को दर्शाता है। ‘मनुष्य’ सामूहिक मानवता को व्यक्त करता है, केवल पुरुषों को नहीं।
- source_word: በዘ ከመዝ
  choice: इस उद्देश्य से
  rationale: यह पदबंध अभिप्रेत प्रयोजन की ओर संकेत करता है; हिन्दी में इसे स्पष्ट किंतु संयत रूप से व्यक्त किया गया है।
- source_word: በቀለም ወበማየ ሐመት
  choice: कलम और स्याही से
  rationale: संदर्भ में दोनों पद साथ मिलकर लेखन-सामग्री, अर्थात सरकंडे की कलम और लौह-पित्त वाली स्याही, का संकेत देते हैं। फिर भी शाब्दिक असामान्यता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ያጽንዑ
  choice: दृढ़ करें
  rationale: क्रिया का अर्थ किसी वस्तु को पक्का, स्थिर या मजबूत करना है; ‘दृढ़ करें’ विश्वास तथा प्रतिज्ञाबद्ध निष्ठा—दोनों संभावनाओं के साथ स्वाभाविक है।
- source_word: ሃይማኖቶሙ
  choice: अपने विश्वास को
  rationale: शब्द विश्वास, भरोसा, निष्ठा या धार्मिक आस्था का अर्थ दे सकता है। ‘विश्वास’ इस अर्थ-व्याप्ति को अपेक्षाकृत खुला रखता है और अनावश्यक रूप से संस्थागत धर्म का संकेत नहीं देता।
theological_decisions:
- issue: कलम और स्याही द्वारा विश्वास दृढ़ करने का आशय
  choice: मूल ठोस बिंब को रखते हुए इसे लेखन के माध्यम से विश्वास या निष्ठा को पक्का करने के कथन के रूप में प्रस्तुत किया गया है।
  alternative: इसे विशेष रूप से लिखित अनुबंधों अथवा शपथों द्वारा अपनी विश्वसनीयता प्रमाणित करने के अर्थ में लिया जा सकता है।
  rationale: पद का निकट संदर्भ लिखित प्रतिज्ञाओं से जुड़ सकता है, पर उपलब्ध गीइज़ पाठ अपने आप किसी एक धार्मिक या विधिक व्याख्या को निर्णायक नहीं बनाता। इसलिए मुख्य पाठ में अस्पष्टता को नहीं सुलझाया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सहज, गरिमापूर्ण और सर्वसाधारण के लिए बोधगम्य। ‘मनुष्य’ को समावेशी सामूहिक अर्थ में चुना गया है। मुख्य पाठ में सुबोध मुहावरे ‘कलम और स्याही’ का प्रयोग है, जबकि गीइज़ की शाब्दिक और सांस्कृतिक विशेषता पादटिप्पणी में दी गई है।
