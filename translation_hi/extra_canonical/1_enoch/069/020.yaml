base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/020.yaml
  text: And by that oath the sun and the moon complete their courses[d][c][b][a], and they do not transgress their command forever.
translation:
  language: hi
  text: और उसी शपथ के द्वारा सूर्य और चंद्रमा अपने-अपने मार्ग पूरे करते हैं, और वे अपने लिए ठहराई गई आज्ञा से कभी नहीं हटते।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በውእቱ፡ ማሐላ
  choice: उसी शपथ के द्वारा
  rationale: पूर्वप्रसंग की निश्चित शपथ और साधनसूचक በ को व्यक्त करता है; इससे शपथ का विधिक और प्रलय-साहित्यिक बल बना रहता है।
- source_word: ፀሐይ፡ ወወርኅ
  choice: सूर्य और चंद्रमा
  rationale: दोनों निश्चित खगोलीय पिंडों का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: ይፌጽሙ፡ ምሕዋሮሙ
  choice: अपने-अपने मार्ग पूरे करते हैं
  rationale: क्रिया गति को पूर्ण करने और संज्ञा नियमित खगोलीय गमन को दर्शाती है। 'अपने-अपने' बहुवचन संबंधसूचक भाव को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ወኢየሐልፉ፡ እምትእዛዞሙ
  choice: अपने लिए ठहराई गई आज्ञा से ... नहीं हटते
  rationale: ሐለፈ के साथ እም सीमा अथवा निर्धारित आदेश से हटने का भाव देता है। 'ठहराई गई' यह स्पष्ट करता है कि आज्ञा सूर्य और चंद्रमा द्वारा दी गई नहीं, बल्कि उन पर लागू है।
- source_word: እምዓለም
  choice: कभी नहीं
  rationale: नकारात्मक क्रिया के साथ यह गीइज़ मुहावरा कालगत पूर्ण निषेध, अर्थात 'कभी नहीं', व्यक्त कर सकता है; हिन्दी में यही सर्वाधिक स्वाभाविक है।
theological_decisions:
- issue: खगोलीय नियमितता को केवल प्राकृतिक गति के रूप में या शपथ और आज्ञापालन के विधिक बिंब में प्रस्तुत करना
  choice: शपथ और आज्ञा की भाषा बनाए रखी गई
  alternative: वे अपने चक्रों पर चलते और निर्धारित क्रम से विचलित नहीं होते
  rationale: मूल में ማሐላ 'शपथ' और ትእዛዝ 'आज्ञा/आदेश' स्पष्ट हैं। इन्हें बनाए रखना सृष्टि की नियमितता को एक बाध्यकारी व्यवस्था के अधीन दिखाता है, बिना किसी बाद की सांप्रदायिक व्याख्या को जोड़े।
- issue: अंतिम कालगत पदबंध का अर्थ
  choice: नकारात्मक क्रिया के साथ 'कभी नहीं'
  alternative: '''सदा'' अथवा ''अनादिकाल से'''
  rationale: እምዓለም व्यापक कालगत अर्थ रख सकता है, पर यहाँ नकार के साथ मुहावरेदार पूर्ण निषेध अधिक स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। 'चंद्रमा' को 'चन्द्रमा' की अपेक्षा वर्तमान मानक वर्तनी में रखा गया है। स्रोतगत अर्थ को मुख्य पाठ में स्वाभाविक रूप से व्यक्त करने के कारण पादटिप्पणी आवश्यक नहीं समझी गई।
