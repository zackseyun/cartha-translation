base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/019.yaml
  text: And by that oath the depths were made firm[c][b][a], and they stand and do not move from their place from eternity to eternity.
translation:
  language: hi
  text: और उस शपथ के द्वारा गहराइयाँ दृढ़ की गईं[a]; वे स्थिर रहती हैं और अनादि से अनंतकाल तक अपने स्थान[b] से नहीं हटतीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्थापित की गईं’ अथवा ‘बलवती की गईं।’ मूल क्रिया दृढ़ या स्थिर किए जाने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपने नियत स्थान से।’ यहाँ ‘स्थान’ ब्रह्मांड में निर्धारित स्थिति का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ማሐላ
  choice: शपथ
  rationale: संदर्भ में यह उस बंधनकारी शपथ को सूचित करता है जिसका उल्लेख आस-पास के पदों में है; ‘शपथ’ न्यायिक और प्रकाशनात्मक बल बनाए रखता है।
- source_word: ቀላይ
  choice: गहराइयाँ
  rationale: यहाँ ቀላይ को संज्ञा ‘गहराई/अथाह गहराई’ माना गया है, न कि करणवाचक ‘उसके द्वारा’; आगे के बहुवचन क्रियापदों और सर्वनाम के अनुरूप हिन्दी में बहुवचन रखा गया है।
- source_word: ፀንዐት
  choice: दृढ़ की गईं
  rationale: क्रिया स्थापित या दृढ़ किए जाने का परिणामसूचक भाव देती है और स्त्रीलिंग एकवचन रूप सामूहिक संज्ञा से मेल खा सकता है; हिन्दी में बहुवचन विषय के अनुसार रूप रखा गया है।
- source_word: ወቆሙ
  choice: वे स्थिर रहती हैं
  rationale: शाब्दिक अर्थ ‘वे खड़ी हैं’ है, पर ब्रह्मांडीय स्थितियों के संदर्भ में ‘स्थिर रहती हैं’ स्वाभाविक हिन्दी में निरंतर दृढ़ता व्यक्त करता है।
- source_word: ወኢይትሐወሱ
  choice: नहीं हटतीं
  rationale: अपूर्ण क्रिया वर्तमान और जारी अवस्था बताती है; ‘नहीं हटतीं’ अपने नियत स्थान से न चलने या न खिसकने का अर्थ देता है।
- source_word: እመካኖሙ
  choice: अपने-अपने स्थानों से
  rationale: बहुवचन संबंधसूचक रूप उनके नियत स्थानों की ओर संकेत करता है; ‘अपने-अपने’ प्रत्येक गहराई की निर्धारित स्थिति को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: እምዓለም ወእስከ ለዓለም
  choice: अनादि से अनंतकाल तक
  rationale: ‘एक युग/अनंतता से दूसरे तक’ की द्विपक्षीय काल-अभिव्यक्ति को बनाए रखते हुए हिन्दी में आरंभहीनता से अंतहीनता तक की स्थायित्वपूर्ण ध्वनि व्यक्त की गई है।
theological_decisions:
- issue: क्या पद का विषय शपथ स्वयं है या शपथ द्वारा स्थिर की गई ब्रह्मांडीय गहराइयाँ
  choice: शपथ द्वारा दृढ़ की गई ‘गहराइयाँ’ पद का विषय हैं।
  alternative: शपथ स्वयं दृढ़ है और स्थिर रहती है; अथवा शपथ के द्वारा अमूर्त रूप से स्थिरता आई।
  rationale: ቀላይ को विषयवाचक संज्ञा मानना तथा उसके बाद के बहुवचन क्रियापद और ‘उनके स्थान’ वाला सर्वनाम ब्रह्मांडीय वास्तविकताओं की ओर संकेत करते हैं। इससे स्थानीय प्रकाशनात्मक चित्र सुरक्षित रहता है।
- issue: कालगत वाक्यांश की व्याख्या
  choice: ‘अनादि से अनंतकाल तक’ द्वारा स्रोत की ‘से...तक’ संरचना बनाए रखी गई है।
  alternative: ‘सदा-सर्वदा’ या ‘युगानुयुग’।
  rationale: वैकल्पिक रूप अधिक मुहावरेदार हैं, किंतु स्रोत में आरंभ-बिंदु और अंतिम सीमा दोनों को व्यक्त करने वाली संरचना है; चुना हुआ रूप उसे अधिक निकटता से दर्शाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘गहराइयाँ’ स्रोत के विषयवाचक ቀላይ और आगे के बहुवचन रूपों को दर्शाता है। वर्तमानकालीन ‘रहती हैं’ और ‘नहीं हटतीं’ जारी ब्रह्मांडीय स्थिरता व्यक्त करते हैं।
