base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/023.yaml
  text: And there are kept the sound of the thunder and the light of the lightning[a], and there are kept the storehouses of the hail and the storehouses of the hoarfrost, and the storehouses of the mist[b], and the storehouses of the rain and the dew.
translation:
  language: hi
  text: और वहीं गर्जन की ध्वनि और बिजली का प्रकाश सुरक्षित रखे जाते हैं; और वहीं ओलों के भंडार, पाले के भंडार, कुहरे के भंडार[a], और वर्षा तथा ओस के भंडार सुरक्षित रखे जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धुंध” अथवा “बादल”; गीइज़ शब्द का अर्थ कुहरे या बादल-सदृश वायुमंडलीय अवस्था भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: በህየ
  choice: वहीं
  rationale: यह स्थानवाचक क्रियाविशेषण दर्शाए गए स्वर्गीय स्थान पर बल देता है; इसकी पुनरावृत्ति भी बनाए रखी गई है।
- source_word: ይትዓቀቡ / ይትዓቀብ
  choice: सुरक्षित रखे जाते हैं
  rationale: यह निष्क्रिय अर्थ रखने, संचित करने और पहरे में रखने—तीनों भावों को बिना अनावश्यक विशेषीकरण के व्यक्त करता है।
- source_word: ቃሉ ለነጐድጓድ
  choice: गर्जन की ध्वनि
  rationale: ቃል का अर्थ वचन, आवाज़ या ध्वनि हो सकता है; मौसम-संबंधी प्रसंग में ‘ध्वनि’ स्वाभाविक है और मूल बिंब को बनाए रखता है।
- source_word: ብርሃኑ ለመብረቅ
  choice: बिजली का प्रकाश
  rationale: यह ‘गर्जन की ध्वनि’ के समानांतर ठोस और काव्यात्मक अभिव्यक्ति को सुरक्षित रखता है।
- source_word: መዛግብተ
  choice: भंडार
  rationale: यह प्राकृतिक शक्तियों के स्वर्गीय संचय-स्थानों की प्रकाशनात्मक छवि को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: በረድ
  choice: ओले
  rationale: यह इस सामान्य मौसम-संबंधी शब्द का सीधा हिन्दी समतुल्य है।
- source_word: አስሐትያ
  choice: पाला
  rationale: शब्द का आशय जमे हुए तुषार या होरफ्रॉस्ट से है; ‘पाला’ सामान्य हिन्दी में इसका सबसे सुबोध रूप है।
- source_word: ጊሜ
  choice: कुहरा
  rationale: यह शब्द कुहरे, धुंध या बादल-सदृश वायुमंडलीय अवस्था का संकेत दे सकता है; सूची के प्रसंग में ‘कुहरा’ उपयुक्त है और विकल्प पादटिप्पणी में रखा गया है।
- source_word: ዝናም
  choice: वर्षा
  rationale: मूल शब्द का मानक और गरिमापूर्ण हिन्दी समतुल्य।
- source_word: ጠል
  choice: ओस
  rationale: मूल शब्द का सीधा हिन्दी समतुल्य, जिससे सूची पूर्ण रहती है।
theological_decisions:
- issue: प्राकृतिक घटनाओं के स्वर्गीय भंडारों की प्रकाशनात्मक छवि को आधुनिक मौसम-विज्ञान की भाषा में बदलना या बनाए रखना
  choice: ‘भंडार’, ‘गर्जन की ध्वनि’ और ‘बिजली का प्रकाश’ जैसी ठोस ब्रह्मांडीय छवि बनाए रखी गई है।
  alternative: इसे सपाट आधुनिक भाषा में ‘वहीं गर्जन और बिजली उत्पन्न होते हैं’ कहना।
  rationale: पद का उद्देश्य सामान्य मौसम-विवरण देना नहीं, बल्कि दर्शनात्मक और प्रकाशनात्मक ढंग से सृष्टि की शक्तियों के सुरक्षित भंडार दिखाना है; अनुवाद इस तनाव और चित्रात्मकता को नहीं मिटाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली अपनाई गई है। मूल की पुनरावृत्ति और प्रकाशनात्मक ब्रह्मांडीय बिंब को यथासंभव सुरक्षित रखा गया है; ‘वर्षा तथा ओस के भंडार’ में एक ही भंडार-संज्ञा दोनों पदार्थों पर लागू होती है, जैसा गीइज़ वाक्यरचना में है।
