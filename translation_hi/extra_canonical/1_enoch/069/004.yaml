  rationale: በ को यहाँ साधन या माध्यम के रूप में लिया गया है, ताकि बेटियाँ भटकाने वाली कर्ता न समझी जाएँ।
theological_decisions:
- issue: ‘स्वर्गदूतों की संतान’ की पहचान
  choice: मुख्य पाठ में शाब्दिक पारिवारिक अभिव्यक्ति बनाए रखी गई।
  alternative: स्वर्गदूत; स्वर्गदूतीय समुदाय
  rationale: गीइज़ का वाक्यांश असामान्य है और उसकी व्याख्यात्मक अनिश्चितता को किसी एक पहचान में समेटना उचित नहीं।
- issue: भटकाने वाली क्रिया की पुनरावृत्ति
  choice: ‘भटका दिया’ दोनों बार रखा गया।
  alternative: धोखा दिया; बहकाया; दूसरी बार ‘लुभाया’
  rationale: स्रोत में एक ही क्रियात्मक विचार दोहराया गया है; अलग-अलग हिन्दी क्रियाएँ अतिरिक्त अर्थभेद पैदा कर सकती थीं।
- issue: मनुष्यों की बेटियों की भूमिका
  choice: उन्हें यक़ोन द्वारा प्रयुक्त माध्यम के रूप में व्यक्त किया गया।
  alternative: मनुष्यों की बेटियों द्वारा
  rationale: गीइज़ በ का साधनार्थक प्रयोग यक़ोन को वाक्य का कर्ता बनाए रखता है और बेटियों को भटकाने वाली स्वतंत्र कर्ता नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘संतान’ असामान्य स्रोत-वाक्यांश की अस्पष्टता बचाता है; ‘के माध्यम से’ साधनार्थ स्पष्ट करता है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में क्रम से उपस्थित हैं।
