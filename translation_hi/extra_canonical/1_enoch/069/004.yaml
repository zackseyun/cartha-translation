base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/004.yaml
  text: And the name of the first was Yeqon[a]; this is the one who led all the children of the angels astray, and brought them down upon the dry land[d][c][b], and led them astray through the daughters of men.
translation:
  language: hi
  text: और पहले व्यक्ति का नाम येक़ोन[a] था; वही था जिसने स्वर्गदूतों की सारी संतान[b] को भटका दिया, उन्हें नीचे सूखी भूमि पर[c] उतार दिया, और मनुष्यों की बेटियों के माध्यम से[d] उन्हें भटका दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘येक़ोन’ गीइज़ नाम ይቁን का लिप्यंतरण है; इसे ‘येक़ून’ भी लिखा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘स्वर्गदूतों की संतान’ है। कुछ लोग इसे व्यापक अर्थ में स्वर्गदूतीय समुदाय समझते हैं।
    reason: lexical_alternative
  - marker: c
    text: ‘सूखी भूमि पर’ का अनुवाद ‘पृथ्वी पर’ या ‘भूमि पर’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: d
    text: अर्थात बेटियाँ माध्यम थीं; भटकाने वाला कर्ता येक़ोन था।
    reason: ambiguity_clarification
