base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/013.yaml
  text: This is the secret of Kasbeel[a], the chief of the oath which he showed to the holy ones when he dwelt in glory on high[d][c][b], and its name is Biqa.
translation:
  language: hi
  text: यह कासबेल का रहस्य है, जो उस शपथ का प्रधान है जिसे उसने पवित्र जनों[a] को उस समय दिखाया, जब वह ऊँचे स्थान पर महिमा में निवास करता था; और उसका नाम बीका है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस दर्शनात्मक प्रसंग में ‘पवित्र जन’ सम्भवतः स्वर्गीय प्राणी हैं, यद्यपि मूल पद इसे स्पष्ट नहीं करता।
    reason: cultural_note
  - marker: b
    text: ‘उसका’ प्रकट किए गए नाम या शपथ-सूत्र की ओर संकेत कर सकता है; कम सम्भावना से यह कासबेल की ओर भी संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ጐልቁ
  choice: रहस्य
  rationale: उपलब्ध पाठ-समीक्षा इसे इस प्रसंग में ‘रहस्य’ समझती है। फिर भी शब्द की व्युत्पत्तिगत कठिनाई और पूर्व प्रस्तावित ‘संख्या’ को देखते हुए इसे पूर्णतः निर्विवाद नहीं माना गया है।
- source_word: ካስብኤል
  choice: कासबेल
  rationale: व्यक्तिवाचक नाम का गीइज़ रूप के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: ርእሰ ማሐላ
  choice: शपथ का प्रधान
  rationale: ርእሰ का मूल भाव ‘सिर/प्रधान’ और ማሐላ का सामान्य अर्थ ‘शपथ’ है; दोनों को निकटतः सुरक्षित रखा गया है।
- source_word: ዘአርአዩ
  choice: जिसे उसने ... दिखाया
  rationale: कारक क्रिया के प्रत्यक्ष अर्थ ‘दिखाना’ को रखा गया है; संदर्भ में ‘प्रकट करना’ भी निहित हो सकता है।
- source_word: ለቅዱሳን
  choice: पवित्र जनों
  rationale: यह पद स्वर्गीय पवित्र प्राणियों की ओर संकेत कर सकता है, पर मुख्य पाठ में पहचान को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: ሶበ ኆደሩ
  choice: उस समय ... जब वह ... निवास करता था
  rationale: कालवाचक उपवाक्य और ठहरने/निवास करने का भाव स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: በልዑል በስብሐት
  choice: ऊँचाई पर महिमा में
  rationale: पदबंध में ऊँचे स्थान और महिमा, दोनों भावों को अलग-अलग बनाए रखा गया है।
- source_word: ወስሙ ቢቃ
  choice: और उसका नाम बीका है
  rationale: सर्वनाम का संदर्भ नाम/सूत्र अथवा कासबेल—दोनों में से हो सकता है; हिन्दी ‘उसका’ उसी अस्पष्टता को कुछ सीमा तक बनाए रखता है।
theological_decisions:
- issue: ‘पवित्र जनों’ की पहचान
  choice: मुख्य पाठ में शाब्दिक और खुला पद
  alternative: स्वर्गदूतों अथवा स्वर्गीय प्राणियों के रूप में स्पष्ट करना
  rationale: दर्शनात्मक स्वर्गीय प्रसंग स्वर्गीय प्राणियों की ओर संकेत करता है, किंतु स्रोत पद स्वयं पहचान को स्पष्ट नहीं करता।
- issue: प्रकट किए गए ‘शपथ’ का स्वरूप
  choice: शपथ
  alternative: अभिमंत्रण अथवा किसी गुप्त नाम से बँधा हुआ शपथ-सूत्र
  rationale: गीइज़ पद का सामान्य अर्थ ‘शपथ’ है; अधिक रहस्यवादी विस्तार स्रोत से आगे चला जाता।
- issue: अंतिम सर्वनाम का संदर्भ
  choice: ‘उसका’ द्वारा अस्पष्टता बनाए रखना
  alternative: ‘उस शपथ/सूत्र का नाम’ या ‘कासबेल का नाम’ स्पष्ट करना
  rationale: व्याकरणिक संदर्भ पूर्णतः निश्चित नहीं है, इसलिए मुख्य पाठ में उसे निर्णीत नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय शैली रखी गई है। स्रोत की असामान्य वाक्य-रचना को स्पष्ट करने के लिए डैश और उपवाक्य प्रयुक्त हुए हैं। ‘रहस्य’ का चयन नवीनतम समीक्षा के अनुरूप है, किन्तु ጐልቁ की पाठगत/शब्दार्थगत कठिनाई को निर्णय-विवरण में स्वीकार किया गया है।
