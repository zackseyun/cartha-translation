  yaml_path: translation/extra_canonical/1_enoch/069/007.yaml
  text: And from his hand they went out against those who dwell upon the dry ground[b][a], from that day and unto the age of ages.
translation:
  language: hi
  text: और उसके हाथ से वे सूखी भूमि पर रहने वालों के विरुद्ध निकल गए[a], उस दिन से युगों के युग तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में मूल क्रिया एकवचन है, ‘वह निकल गया’; यहाँ ‘वे’ पिछले पद में आए ‘मृत्यु के हथियारों’ को सूचित करता है। ‘सूखी भूमि पर रहने वालों’ का अनुवाद ‘पृथ्वी पर रहने वालों’ भी हो सकता है।
    reason: व्याकरणिक और शब्दार्थगत वैकल्पिक पाठ
lexical_decisions:
- source_word: እምነ እዴሁ
  choice: उसके हाथ से
  rationale: गीज़ पदबंध स्रोत और हाथ की ठोस छवि रखता है। संदर्भ में हाथ सामर्थ्य या माध्यम का संकेत दे सकता है, पर अनुवाद में छवि को अमूर्त नहीं किया गया।
- source_word: ወፅአ
  choice: वे निकलकर ... गए
  rationale: मूल क्रिया व्याकरणतः एकवचन है, पर पिछले पद के ‘मृत्यु के हथियार’ इसके आशयगत पूर्वपद हैं; इसलिए हिन्दी में स्वाभाविक बहुवचन रखा गया। ‘निकलकर गए’ प्रस्थान की गति को स्पष्ट करता है।
- source_word: ዲቤሆሙ
  choice: के विरुद्ध
  rationale: इस न्यायात्मक या शत्रुतापूर्ण संदर्भ में निर्देशित प्रतिकूल कार्रवाई व्यक्त होती है; इसलिए केवल स्थानसूचक ‘पर’ के बजाय ‘के विरुद्ध’ चुना गया।
- source_word: ለእለ የኃድሩ ዲበ የብስ
  choice: सूखी भूमि पर रहनेवालों
  rationale: यह अभिव्यक्ति निवास करनेवालों और सूखी भूमि की ठोस ब्रह्मांडीय छवि को सुरक्षित रखती है; इसे सामान्यीकृत करके केवल ‘पृथ्वी’ नहीं किया गया।
- source_word: እምይእቲ ዕለት
  choice: उस दिन से
  rationale: यह किसी निरंतर अवस्था या क्रिया के आरम्भ-बिंदु को बताने वाला निकट और स्वाभाविक हिन्दी रूप है।
- source_word: እስከ ለዓለመ ዓለም
  choice: युगों के युग तक
  rationale: दोहराए गए ‘युग’ के सूत्र और उसके प्रलयदर्शी स्वर को बनाए रखते हुए अनंत अवधि व्यक्त की गई है।
theological_decisions:
- issue: የብስ को सामान्य ‘पृथ्वी’ कहा जाए या ठोस ‘सूखी भूमि’ रखा जाए
  choice: सूखी भूमि
  alternative: पृथ्वी / स्थल
  rationale: पाठ की ठोस स्थानिक और संभवतः ब्रह्मांडीय छवि को सुरक्षित रखना अधिक संयत है; ‘पृथ्वी’ अर्थ को अनावश्यक रूप से सामान्य बना सकता है।
- issue: एकवचन क्रिया ወፅአ को हिन्दी में एकवचन या बहुवचन बनाया जाए
  choice: बहुवचन ‘वे ... गए’
  alternative: एकवचन ‘वह निकल गया’
  rationale: पिछले पद में उल्लिखित ‘मृत्यु के हथियार’ आशयगत पूर्वपद हैं। गीज़ में सामूहिक या निर्जीव बहुवचन के साथ एकवचन क्रिया संभव है, जबकि हिन्दी में बहुवचन संदर्भ-संबंध को स्पष्ट रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। प्रलयदर्शी ठोस बिंब ‘सूखी भूमि’ तथा ‘युगों के युग’ सुरक्षित रखे गए हैं। ‘रहनेवालों’ को मानक संयुक्त वर्तनी में लिखा गया है।
