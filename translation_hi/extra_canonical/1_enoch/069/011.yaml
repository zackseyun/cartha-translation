base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/011.yaml
  text: For human beings were not created except to be like the angels[a], so that they might remain pure and righteous; and death, which destroys everything, would not have touched them. But through this knowledge they are being destroyed[d][c][b], and through this power it is consuming me.
translation:
  language: hi
  text: क्योंकि मनुष्य केवल इसीलिए रचे गए थे कि वे स्वर्गदूतों के समान हों[a] और शुद्ध तथा धर्मी बने रहें; और वह मृत्यु, जो सब कुछ नष्ट करती है, उन्हें छू भी न पाती। परन्तु इसी ज्ञान के कारण वे नष्ट हो रहे हैं[b][c], और इसी शक्ति के द्वारा मैं निगला जा रहा हूँ[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल में ‘मनुष्य’ सामूहिक अर्थ में है। वाक्य का अनुवाद यह भी हो सकता है: “किसी मनुष्य की रचना इसके सिवा किसी और उद्देश्य से नहीं हुई कि वह स्वर्गदूतों के समान हो।”'
    reason: lexical_alternative
  - marker: b
    text: “ज्ञान” के लिए प्रयुक्त गीइज़ शब्द का अर्थ “समझ” या “बोध” भी हो सकता है; अतः यह वाक्य “इसी समझ के कारण वे नाश होते हैं” भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: हनोक की दृष्टान्त-पुस्तक के इस अंश के लिए प्रभावी यूनानी या क़ुमरानी तुलनात्मक पाठ उपलब्ध नहीं है; इसलिए कठिन वाक्य को जानबूझकर संयम के साथ अनूदित किया गया है।
    reason: textual_variant
  - marker: d
    text: 'अंतिम क्रिया का शाब्दिक और सजीव भाव है: “वह मुझे खा रही है” या “वह मुझे निगल रही है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢተፈጥረ ሰብእ
  choice: मनुष्य ... रचे गए थे
  rationale: निष्क्रिय सृष्टि-भाषा को बनाए रखा गया है। ሰብእ का यहाँ सामूहिक अर्थ है, इसलिए हिन्दी में स्वाभाविक बहुवचन क्रिया रखी गई है।
- source_word: ዘእንበለ
  choice: केवल इसीलिए
  rationale: यह प्रतिबंधात्मक भाव व्यक्त करता है और हिन्दी में उद्देश्यवाचक अगले खंड से स्वाभाविक रूप से जुड़ता है।
- source_word: ከመ መላእክት
  choice: स्वर्गदूतों के समान
  rationale: तुलना को स्पष्ट रखा गया है; मनुष्यों और स्वर्गदूतों की पहचान एक नहीं की गई।
- source_word: ይንበሩ ንጹሓነ ወጻድቃነ
  choice: शुद्ध तथा धर्मी बने रहें
  rationale: क्रिया यहाँ स्थान पर रहने के बजाय किसी दशा में बने रहने का अर्थ देती है; नैतिक-धार्मिक विशेषणों की गरिमा सुरक्षित रखी गई है।
- source_word: ሞት ዘኵሉ ያማሥን
  choice: वह मृत्यु, जो सब कुछ नष्ट करती है
  rationale: मृत्यु के सर्वनाशकारी मानवीकरण और व्यापक प्रलयकारी बल को बनाए रखा गया है।
- source_word: ኢገሰሶሙ
  choice: उन्हें छूती भी नहीं
  rationale: मूल के ‘छूने’ के चित्र को सुरक्षित रखते हुए अभीष्ट अवस्था के विपरीत परिणाम का भाव व्यक्त किया गया है।
- source_word: አእምሮቶሙ
  choice: ज्ञान
  rationale: शब्द ‘समझ’ या ‘बोध’ भी सूचित कर सकता है; प्रसंग में ‘ज्ञान’ उपयुक्त है, पर अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ይትሐጐሉ
  choice: वे नष्ट हो रहे हैं
  rationale: नाश या विनाश के निष्क्रिय/आत्मवाचक भाव को गंभीर और सीधी हिन्दी में व्यक्त किया गया है।
- source_word: ኃይል
  choice: शक्ति
  rationale: व्यापक अर्थ और प्रलयकारी भार को बनाए रखा गया है; शक्ति किसकी है, यह निर्धारित नहीं किया गया।
- source_word: ይበልዓኒ
  choice: मुझे निगल लिया है
  rationale: मूल की अत्यंत सजीव ‘खा जाने/निगलने’ वाली छवि को मंद किए बिना स्वाभाविक हिन्दी दी गई है।
theological_decisions:
- issue: मनुष्य की अभीष्ट अवस्था और स्वर्गदूतों से समानता
  choice: मनुष्य स्वर्गदूतों के समान होने के लिए रचे गए थे।
  alternative: मनुष्य स्वयं स्वर्गदूतों के रूप में रचे गए थे।
  rationale: तुलनात्मक रचना समानता बताती है, पूर्ण पहचान नहीं; इस प्रकार पाठ की ऊँची मानव-दृष्टि सुरक्षित रहती है और मानव-स्वर्गदूत भेद भी नहीं मिटता।
- issue: ज्ञान से होने वाले विनाश का अर्थ
  choice: ‘इसी ज्ञान के कारण वे नष्ट हो रहे हैं’ को मुख्य पाठ में रखा गया है।
  alternative: ‘इसी समझ के कारण वे नाश होते हैं’ या ‘इसी बोध से वे भटकते हैं।’
  rationale: यहाँ प्रभावी यूनानी या क़ुमरानी समानांतर साक्ष्य उपलब्ध नहीं है। इसलिए ज्ञान की प्रकृति या उसके नैतिक मूल्य को अतिरिक्त रूप से परिभाषित किए बिना गीइज़ की अस्पष्टता रहने दी गई है।
- issue: अंतिम वाक्य में वक्ता पर शक्ति का प्रभाव
  choice: शक्ति को वक्ता को ‘निगलने’ वाली शक्ति के रूप में सजीव रखा गया है।
  alternative: ‘यह शक्ति मुझे दुर्बल करती है।’
  rationale: मूल क्रिया की तीखी भक्षण-संबंधी छवि धर्मवैज्ञानिक तनाव का हिस्सा है; उसे सामान्य प्रभाव में बदलना अनुचित होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रलय-साहित्य के अनुकूल गंभीर शैली अपनाई गई है। ‘स्वर्गदूत’, ‘शुद्ध’, ‘धर्मी’, ‘ज्ञान’ और ‘शक्ति’ जैसे परिचित धार्मिक शब्द रखे गए हैं, पर किसी विशिष्ट सम्प्रदाय की व्याख्या नहीं जोड़ी गई।
