  yaml_path: translation/extra_canonical/1_enoch/034/001.yaml
  text: And from there I went toward the north[a], to the ends of the earth[c][b], and there I saw a great wonder.
translation:
  language: hi
  text: और वहाँ से मैं उत्तर की ओर, पृथ्वी के छोरों तक गया, और वहाँ मैंने एक बड़ा आश्चर्य देखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምህየ
  choice: वहाँ से
  rationale: यह पिछले दर्शनीय स्थान से आगे की गति को जोड़ने वाला स्वाभाविक संकेत है।
- source_word: ሖርኩ
  choice: मैं ... गया
  rationale: साधारण गति-सूचक क्रिया का सीधा और सहज हिन्दी रूप।
- source_word: መንገለ መስዕ
  choice: उत्तर की ओर
  rationale: መስዕ का अर्थ ‘उत्तर’ है; መንገለ दिशा को व्यक्त करता है। इससे पुराने ‘दक्षिण’ वाले गलत पाठ से बचा गया है।
- source_word: በአጽናፈ ምድር
  choice: पृथ्वी के छोरों तक
  rationale: यह प्रलय-दर्शी ब्रह्मांडीय भूगोल की छवि को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ርኢኩ
  choice: मैंने ... देखा
  rationale: दर्शन-वृत्तांत की सामान्य क्रिया का स्पष्ट, अनार्काइक अनुवाद।
- source_word: 'ምሕረ ዐቢየ [पाठ-सुधार: መንክረ ዐቢየ]'
  choice: एक बड़ा आश्चर्य
  rationale: प्राप्त लिप्यंतरण का ምሕረ OCR-दोष है; आलोचनात्मक पाठ में መንክረ ‘आश्चर्य/अद्भुत वस्तु’ है। इसलिए ‘विश्राम-स्थान’ का कोई शब्दगत आधार नहीं है।
theological_decisions:
- issue: देखी गई वस्तु या घटना की प्रकृति
  choice: एक बड़ा आश्चर्य
  alternative: एक महान अद्भुत दृश्य
  rationale: मूल शब्द आश्चर्य को व्यक्त करता है, पर यह नहीं बताता कि वह कोई स्थान, वस्तु या घटना थी। अनुवाद इस अस्पष्टता को बनाए रखता है और कोई विशिष्ट परलोक-संबंधी अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण दर्शनीय-वृत्तांत। ‘पृथ्वी के छोर’ मूल की ब्रह्मांडीय छवि को सुरक्षित रखता है। किसी पादटिप्पणी की आवश्यकता नहीं है, क्योंकि उत्तर दिशा और ‘आश्चर्य’ दोनों पाठ-समीक्षा से पर्याप्त रूप से स्थापित हैं।
