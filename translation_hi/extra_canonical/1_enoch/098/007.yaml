base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/007.yaml
  text: And do not imagine in your spirit[a], and do not say in your heart[c][b], that you do not know and do not see that every sin is written in heaven every day before the Most High.
translation:
  language: hi
  text: और अपने मन में ऐसा न समझो, और अपने हृदय में यह न कहो कि तुम नहीं जानते और नहीं देखते कि हर पाप प्रतिदिन परमप्रधान के सामने स्वर्ग में लिखा जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢታምስሉ በመንፈስክሙ
  choice: अपने मन में ऐसा न समझो
  rationale: क्रिया भीतर की धारणा या मान्यता को रोकती है। መንፈስ का शाब्दिक अर्थ ‘आत्मा’ हो सकता है, पर इस मानसिक क्रिया के साथ हिन्दी में ‘मन’ स्वाभाविक है और आंतरिक विचार का आशय स्पष्ट रखता है।
- source_word: ወኢትበሉ በልብክሙ
  choice: और अपने हृदय में यह न कहो
  rationale: ‘हृदय’ मूल की बाइबिलीय आंतरिक-अंग भाषा को बनाए रखता है; ‘यह’ आगे आने वाले कथन को स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: እስመ ኢታእምሩ ወኢትሬእዩ
  choice: कि तुम नहीं जानते और नहीं देखते
  rationale: दोनों क्रियाएँ द्वितीय पुरुष बहुवचन हैं; इसलिए पूर्ववर्ती अंग्रेज़ी प्रथम-पुरुष उद्धरण के बजाय मूल का अप्रत्यक्ष, द्वितीय-पुरुष कथन रखा गया है। ‘देखते’ प्रत्यक्ष बिंब को सुरक्षित रखता है।
- source_word: ኵሉ ኃጢአት
  choice: हर पाप
  rationale: एकवचन सामूहिक पद का वितरणात्मक अर्थ है—प्रत्येक पाप—जिसे सहज हिन्दी में ‘हर पाप’ व्यक्त करता है।
- source_word: በሰማይ ይጸሐፍ
  choice: स्वर्ग में लिखा जाता है
  rationale: लेखन की ठोस प्रलय-साहित्यिक अभिलेख-छवि को बनाए रखा गया है; इसे केवल ‘परमेश्वर जानता है’ जैसे सामान्य कथन में नहीं बदला गया।
- source_word: ሀሎ በኵሉ ዕለት
  choice: प्रतिदिन
  rationale: पद निरंतर, दिन-प्रतिदिन बनी रहने वाली स्थिति या क्रिया दर्शाता है; ‘प्रतिदिन’ संक्षिप्त और स्वाभाविक है।
- source_word: በቅድሜሁ ለልዑል
  choice: परमप्रधान के सामने
  rationale: यह दिव्य उपाधि तथा उसकी उपस्थिति में स्थित स्वर्गीय अभिलेख—दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: पापों का स्वर्गीय अभिलेख
  choice: हर पाप स्वर्ग में परमप्रधान के सामने लिखा जाता है।
  alternative: इसे केवल इस सामान्य अर्थ में लेना कि परमेश्वर सभी पापों को जानता है।
  rationale: मूल में ‘लिखना’, ‘स्वर्ग में’ और ‘परमप्रधान के सामने’ का स्पष्ट अभिलेखात्मक बिंब है; इसे अमूर्त सर्वज्ञता में बदलना मूल की न्याय-संबंधी प्रलय-साहित्यिक छवि को कम कर देगा।
- issue: मानवीय आंतरिकता की दोहरी भाषा
  choice: ‘मन’ और ‘हृदय’ के भेद को बनाए रखा गया।
  alternative: दोनों को ‘मन’ या ‘अपने भीतर’ कहना।
  rationale: मूल क्रमशः መንፈስ और ልብ का प्रयोग करता है। हिन्दी की स्वाभाविकता के लिए पहले को ‘मन’ कहा गया, पर दूसरे को ‘हृदय’ रखकर मूल का समानांतर तनाव पूरी तरह समतल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन ‘तुम’। शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। वाक्य की पुनरुक्त निषेधात्मक संरचना और स्वर्गीय लेखे का ठोस बिंब सुरक्षित रखा गया है।
