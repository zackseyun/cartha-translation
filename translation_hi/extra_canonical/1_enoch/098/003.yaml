base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/003.yaml
  text: Therefore they have no instruction or wisdom[a]; and because of this they will perish together with their possessions, and with all their glory and their honor. And in shame, and in slaughter, and in great destitution[c][b], their spirits will be cast into the furnace of fire.
translation:
  language: hi
  text: इसलिए उनमें न तो शिक्षा है, न बुद्धि[a]; और इसी कारण वे अपनी संपत्ति के साथ, और अपनी सारी महिमा और प्रतिष्ठा के साथ नष्ट हो जाएँगे। और लज्जा, वध और बड़ी दुर्दशा[b] में उनकी आत्माएँ आग की भट्ठी में डाल दी जाएँगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘शिक्षा’ का अनुवाद ‘उपदेश’ भी हो सकता है। ‘शिक्षा और बुद्धि’ संभवतः दो पूर्णतः अलग बातों के बजाय ज्ञान-परंपरा की संयुक्त अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: ‘बड़ी दुर्दशा’ वाला मूल वाक्यांश कठिन है; इसका अर्थ ‘बड़े अभाव’, ‘बड़े क्लेश’ या ‘बड़ी विपत्ति’ में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ትምህርት
  choice: शिक्षा
  rationale: यहाँ अर्थ प्राप्त शिक्षा या उपदेश का है। ‘शिक्षा’ आधुनिक हिन्दी में सहज है और ‘बुद्धि’ के साथ ज्ञान-परंपरा की युग्म-अभिव्यक्ति बनाती है।
- source_word: ጥበብ
  choice: बुद्धि
  rationale: नैतिक और व्यावहारिक विवेक अभिप्रेत है; ‘बुद्धि’ इस न्याय-संदर्भ में स्वाभाविक और व्यापक है।
- source_word: ይትሐጐሉ
  choice: नष्ट हो जाएँगे
  rationale: भविष्य के न्याय का प्रबल अर्थ बनाए रखता है, पर विनाश की रीति या अंतिम स्वरूप को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ኅቡረ ምስለ
  choice: के साथ
  rationale: मनुष्यों और उनकी संपत्ति की साझा नियति को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: ንዋያቲሆሙ
  choice: अपनी संपत्ति
  rationale: भौतिक वस्तुओं और धन-संपदा दोनों को समेटने वाला व्यापक शब्द है।
- source_word: ስብሐቶሙ
  choice: अपनी सारी महिमा
  rationale: मूल की ऊँची शैली और सांसारिक वैभव के न्याय में ढहने की विडंबना सुरक्षित रहती है।
- source_word: ክብሮሙ
  choice: प्रतिष्ठा
  rationale: ‘महिमा’ से भिन्न सामाजिक मान-सम्मान या दर्जे को स्पष्ट करता है।
- source_word: በጽእለት
  choice: लज्जा में
  rationale: न्याय की अपमानजनक और सार्वजनिक दशा को संक्षेप में व्यक्त करता है।
- source_word: በቅትል
  choice: वध में
  rationale: हिंसक विनाश की कठोर संज्ञा को बनाए रखता है और कर्ता के विषय में अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: በንዴት ዐቢይ
  choice: बड़ी दुर्दशा में
  rationale: वाक्यांश का अर्थ कठिन है; ‘दुर्दशा’ अभाव, क्लेश और दयनीय दशा की संभावित अर्थ-सीमा को बिना अत्यधिक संकीर्ण किए समेटता है।
- source_word: ትትወደይ መንፈሶሙ
  choice: उनकी आत्माएँ ... डाल दी जाएँगी
  rationale: मूल के बहुवचन ‘उनके प्राण/आत्माएँ’ और बलपूर्वक सौंपे जाने वाले कर्मवाच्य भाव को सुरक्षित रखता है।
- source_word: እቶነ እሳት
  choice: आग की भट्ठी
  rationale: मूल की संबंधसूचक संरचना और प्रलयकारी न्याय के सजीव बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: अंतिम न्याय-वाक्य विनाश, मृत्योत्तर दंड, या दोनों में से किस ओर संकेत करता है
  choice: उनकी आत्माएँ आग की भट्ठी में डाल दी जाएँगी
  alternative: वे स्वयं आग में नष्ट कर दिए जाएँगे
  rationale: मूल में स्पष्ट कर्म ‘उनकी आत्माएँ/प्राण’ है। इसलिए अनुवाद मृत्योत्तर या प्रलयकारी न्याय के बिंब को रखता है और उसे केवल शारीरिक मृत्यु अथवा पूर्ण अस्तित्व-लोप में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली रखी गई है। वर्तमान अभाव (‘उनमें ... है’) और भविष्य के न्याय (‘नष्ट हो जाएँगे’) का कारण-परिणाम संबंध सुरक्षित है। मूल की संचयी न्याय-सूची को बनाए रखते हुए अत्यधिक कृत्रिम पुनरुक्ति से बचा गया है।
