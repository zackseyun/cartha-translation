base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/004.yaml
  text: 'I swear to you[a], sinners: as a mountain has not become a servant, and a hill does not become a maidservant of a woman, so sin was not sent upon the earth; rather, men created it from themselves[c][b], and those who do it will come under a great curse.'
translation:
  language: hi
  text: 'हे पापियो, मैं तुमसे शपथपूर्वक कहता हूँ: जैसे कोई पहाड़ दास नहीं बनता और कोई पहाड़ी किसी स्त्री की दासी नहीं बनती,[a] वैसे ही पाप पृथ्वी पर भेजा नहीं गया; बल्कि मनुष्यों ने उसे अपने ही से रचा।[b] और जो लोग पाप करते हैं, वे बड़े शाप के अधीन होंगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ में यह आरंभिक उपमा पाठगत और व्याकरणिक रूप से कठिन है। इसका आशय संभवतः यह है कि जैसे पहाड़ या पहाड़ी दास-दासी नहीं बनते, वैसे ही पाप सृष्टि पर बाहर से थोपा गया नहीं था।
    reason: textual_variant
  - marker: b
    text: ‘अपने ही से’ के पीछे का गीज़ मुहावरा शाब्दिक रूप से ‘अपने आप से’ है; प्रत्यययुक्त ‘सिर’ वहाँ सामान्य आत्मवाचक रूप में प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: መሐልኩ
  choice: मैं ... शपथ खाकर कहता हूँ
  rationale: यह क्रिया पापियों को संबोधित एक गंभीर शपथपूर्ण घोषणा का बोध कराती है। हिंदी में यह प्रयोग उसके शपथ-संबंधी बल और कथन की स्वाभाविकता दोनों को बनाए रखता है।
- source_word: ኃጥኣን
  choice: पापियों
  rationale: यह प्रसंग में नैतिक और न्यायिक अर्थ वाला सीधा संबोधन है; ‘पापी’ आधुनिक धार्मिक हिंदी में स्पष्ट और सहज है।
- source_word: ደብር
  choice: पहाड़
  rationale: मूल के ठोस स्थलाकृतिक बिंब को बिना अमूर्त किए सुरक्षित रखता है।
- source_word: ገብረ
  choice: दास बना है
  rationale: कठिन उपमा में यह शब्द अधीन दास बन जाने का बोध देता प्रतीत होता है। ‘दास’ उसके प्रबल सामाजिक अर्थ को ‘सेवक’ की अपेक्षा बेहतर सुरक्षित रखता है।
- source_word: እማገር ለብእሲት
  choice: कोई पहाड़ी किसी स्त्री की दासी
  rationale: वाक्यांश पाठगत रूप से कठिन है, फिर भी यह पहले पद के समानांतर स्त्रीलिंग दासता का चित्र प्रस्तुत करता है। अनुवाद उस असामान्य चित्र को मिटाता नहीं है।
- source_word: ኃጢአትኒ ኢተፈነወት ዲበ ምድር
  choice: पाप पृथ्वी पर भेजा नहीं गया
  rationale: मूल का निष्क्रिय ‘भेजा गया’ सुरक्षित रखा गया है, जिससे पाप के बाहर से आरोपित या प्रेषित होने का निषेध प्रकट होता है।
- source_word: አላ ሰብእ እምርእሶሙ ፈጠርዋ
  choice: बल्कि मनुष्यों ने उसे स्वयं उत्पन्न किया
  rationale: प्रत्यययुक्त ርእስ यहाँ सामान्य आत्मवाचक प्रयोग है; इसलिए ‘अपने सिरों से’ के बजाय ‘स्वयं’ सही मुहावरेदार अर्थ देता है। ‘उत्पन्न किया’ ፈጠርዋ के सृजनात्मक बल को व्यक्त करता है।
- source_word: ለመርገም ዐቢይ ይከውኑ
  choice: बड़े शाप के अधीन होंगे
  rationale: यह पाप करने वालों के भावी न्याय को स्वाभाविक हिंदी में व्यक्त करते हुए मूल के ‘महान/बड़े शाप’ को बनाए रखता है।
theological_decisions:
- issue: इस पद में पाप की उत्पत्ति
  choice: पाप को पृथ्वी पर भेजी गई वस्तु नहीं, बल्कि मनुष्यों द्वारा स्वयं उत्पन्न किया हुआ बताया गया है।
  alternative: इसे केवल इतना कहने के रूप में समझा जा सकता है कि पाप सृष्टि की स्वाभाविक विशेषता नहीं है, बिना दैवी कारण के विषय में व्यापक निष्कर्ष निकाले।
  rationale: ‘भेजा नहीं गया’ और ‘मनुष्यों ने ... उत्पन्न किया’ का स्पष्ट विरोध मानव अभिकरण पर बल देता है। अनुवाद इसी विरोध को रखता है, पर उससे बुराई की उत्पत्ति का कोई विस्तृत सिद्धांत नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में गंभीर, घोषणात्मक और सर्वसाधारण के लिए बोधगम्य रखी गई है। कठिन पर्वत-दास उपमा को सरल बनाकर हटाया नहीं गया; उसकी अनिश्चितता पादटिप्पणी में बताई गई है। ‘दास/दासी’ सामाजिक बिंब की तीव्रता बनाए रखते हैं, जबकि ‘स्वयं’ गीज़ आत्मवाचक मुहावरे का स्वाभाविक हिंदी रूप है।
