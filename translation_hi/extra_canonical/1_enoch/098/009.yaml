base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/009.yaml
  text: Woe to you[a], fools, for you will perish in your folly, and you oppress the wise[c][b], and good will not come upon you.
translation:
  language: hi
  text: हाय तुम पर, हे मूर्खो! क्योंकि तुम अपनी मूर्खता में नाश हो जाओगे; तुम बुद्धिमानों को भूल जाते हो[a], और भलाई तुम्हें नहीं मिलेगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम बुद्धिमानों की उपेक्षा करते हो।’ मूल क्रिया का सामान्य अर्थ ‘भूलना’ है, पर यहाँ जानबूझकर अनदेखा करने का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘भलाई तुम तक नहीं पहुँचेगी।’ यहाँ ‘भलाई’ में कल्याण, शुभ दशा या समृद्धि का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ
  choice: हाय तुम पर
  rationale: यह न्याय की घोषणा करने वाला भविष्यद्वक्ताई उद्गार है; ‘हाय’ उसके गंभीर चेतावनीपूर्ण बल को बनाए रखता है।
- source_word: አብዳን
  choice: मूर्खो
  rationale: यह केवल बौद्धिक कमी नहीं, बल्कि नैतिक और आत्मिक मूर्खता का संबोधन है।
- source_word: ትትሐጐሉ
  choice: नाश हो जाओगे
  rationale: क्रिया का अर्थ नष्ट या विनष्ट होना है; इसे धन पर भरोसा करने के अर्थ में लेना इस पद के गीइज़ पाठ से समर्थित नहीं है।
- source_word: በአቢድክሙ
  choice: अपनी मूर्खता में
  rationale: यह पद मूर्खता या उन्मत्तता से संबंधित है, धन-संपत्ति से नहीं; वाक्यांश नाश के कारण अथवा उसके परिवेश को व्यक्त करता है।
- source_word: ለጠበብን
  choice: बुद्धिमानों को
  rationale: संदर्भ और अगले क्रियापद के बहुवचन कर्म-प्रत्यय के आधार पर इसे अमूर्त ‘बुद्धि’ के बजाय बुद्धिमान व्यक्तियों के रूप में प्रस्तुत किया गया है।
- source_word: ትረሰዕዎሙ
  choice: भुला देते हो
  rationale: मूल क्रिया भूलने को व्यक्त करती है; प्रसंग में इसका आशय जानबूझकर अनदेखा या उपेक्षित करना भी हो सकता है, पर ‘अत्याचार करना’ अर्थ को आवश्यकता से अधिक संकीर्ण करता है।
- source_word: ሠናይት
  choice: भलाई
  rationale: शब्द का अर्थ व्यापक है और भलाई, कल्याण या शुभ दशा को समेट सकता है; ‘भलाई’ इस व्यापकता को बनाए रखता है।
- source_word: ኢይረክበክሙ
  choice: तुम्हें नहीं मिलेगी
  rationale: क्रिया मिलने, पहुँचने या पा लेने के अर्थ देती है; ‘भलाई तुम्हें नहीं मिलेगी’ आधुनिक हिन्दी में स्वाभाविक है और मूल भाव को सुरक्षित रखता है।
theological_decisions:
- issue: मूर्खों के विरुद्ध धिक्कार का आधार
  choice: उनका अपनी मूर्खता में नाश होना और बुद्धिमानों को भुलाना या उपेक्षित करना
  alternative: उन्हें धन पर भरोसा करने और बुद्धिमानों पर अत्याचार करने के कारण दोषी ठहराना
  rationale: इस पद का उपलब्ध गीइज़ पाठ मूर्खता, नाश और भूलने की भाषा रखता है; धन का उल्लेख यहाँ नहीं है। इसलिए निकटवर्ती पदों की धन-संबंधी विषयवस्तु को इस पद में नहीं लाया गया।
- issue: अंतिम ‘भलाई’ का दायरा
  choice: सामान्य भलाई या कल्याण
  alternative: विशेष रूप से समृद्धि या आशीष
  rationale: मूल शब्द व्यापक है। अनुवाद इसे किसी एक प्रकार के सांसारिक या धार्मिक प्रतिफल तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, भविष्यद्वक्ताई और ज्ञान-साहित्य-संगत शैली रखी गई है। संबोधन स्पष्ट करने के लिए ‘हे मूर्खो’ और न्यायसूचक उद्गार के लिए ‘हाय तुम पर’ प्रयोग हुआ है। पाठ में धन-संपत्ति का विचार नहीं जोड़ा गया, क्योंकि वह उपलब्ध गीइज़ पद में उपस्थित नहीं है।
