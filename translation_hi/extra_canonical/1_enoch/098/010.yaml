base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/010.yaml
  text: And now know that you are prepared for the day of destruction[a], and do not hope that you sinners will live; rather, you will depart and die, for you do not know any ransom[d][c][b], because you have been made ready for it.
translation:
  language: hi
  text: और अब जान लो कि तुम विनाश के दिन[a] के लिए तैयार हो। तुम पापी यह आशा मत रखो कि जीवित रहोगे; बल्कि तुम प्रस्थान करोगे और मरोगे, क्योंकि तुम किसी छुड़ौती को नहीं जानते[b], क्योंकि तुम्हें उसी के लिए तैयार किया गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वध के दिन।” गीइज़ शब्द न्याय के प्रसंग में विनाशकारी बरबादी को दर्शा सकता है और इसमें अधिक तीखा अर्थ, “वध,” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “छुड़ौती” से आशय मुक्त किए जाने के मूल्य या साधन से हो सकता है। कठिन मूल वाक्य का भाव संभवतः यह है कि आने वाले न्याय से बच निकलने का कोई उपाय शेष नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: ወይእዜኒ
  choice: और अब
  rationale: यह कालसूचक कथन न्याय की गंभीर चेतावनी आरम्भ करता है; ‘और अब’ मूल के प्रवाह को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: አእምሩ
  choice: जान लो
  rationale: बहुवचन आज्ञार्थक को सीधी और प्रभावशाली हिन्दी में व्यक्त करता है।
- source_word: ድልዋን
  choice: तैयार हो
  rationale: न्याय के दिन के लिए तैयार अथवा नियत किए जाने का भाव रखता है, पर यह तय नहीं करता कि तैयारी किस प्रकार हुई।
- source_word: ለዕለተ ሐጕል
  choice: विनाश के दिन
  rationale: न्याय से जुड़े सर्वनाशकारी भाव को व्यक्त करता है; अधिक विशिष्ट ‘वध के दिन’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ወኢትስፈዉ
  choice: यह आशा मत रखो
  rationale: नकारात्मक आज्ञा में झूठी आशा अथवा अपेक्षा का निषेध है।
- source_word: ከመ ትሕየዉ ኃጥኣን
  choice: तुम पापी ... जीवित रहोगे
  rationale: ትሕየዉ द्वितीय पुरुष बहुवचन है; इसलिए ‘पापी’ संबोधित लोगों का विशेषण अथवा समानाधिकरण है, तीसरे पुरुष का कर्ता नहीं।
- source_word: አላ ትሐውሩ ወትመውቱ
  choice: बल्कि तुम प्रस्थान करोगे और मरोगे
  rationale: मूल में जाने और मरने की दो क्रमबद्ध क्रियाएँ हैं; ‘प्रस्थान’ गंभीर शैली को बनाए रखता है।
- source_word: ቤዛ
  choice: छुड़ौती
  rationale: मुक्ति के मूल्य अथवा साधन की ठोस धारणा को सुरक्षित रखता है और इसे केवल ‘छुटकारा’ कहकर अर्थ को पहले से हल नहीं करता।
- source_word: ኢታእምሩ ቤዛ
  choice: तुम किसी छुड़ौती को नहीं जानते
  rationale: मूल वाक्य-विन्यास असामान्य है। निकट अनुवाद उस अस्पष्टता को बनाए रखता है कि आशय छुड़ौती के ज्ञान का अभाव है या उपलब्ध बचाव के किसी साधन का न होना।
- source_word: ተደለውክሙ
  choice: तुम्हें उसी के लिए तैयार किया गया है
  rationale: निष्क्रिय रूप और पहले बताए गए न्याय के दिन की ओर संकेत दोनों को व्यक्त करता है; ‘उसी’ निहित संदर्भ को स्पष्ट करता है।
theological_decisions:
- issue: न्याय की घोषणा में ቤዛ का अर्थ
  choice: छुड़ौती
  alternative: छुटकारा; मुक्ति का मूल्य
  rationale: ‘छुड़ौती’ मूल के मूल्य देकर मुक्त करने वाले रूपक को बनाए रखती है। पादटिप्पणी संभावित व्यावहारिक अर्थ—आने वाले न्याय से बच निकलने का साधन—बताती है, पर इसे किसी बाद की प्रायश्चित-संबंधी धर्मशास्त्रीय प्रणाली में नहीं बाँधती।
- issue: पापियों को संबोधन
  choice: तुम पापी ... जीवित रहोगे
  alternative: पापी जीवित रहेंगे
  rationale: क्रिया द्वितीय पुरुष बहुवचन है, इसलिए चेतावनी सीधे संबोधित पापियों से है; इसे तीसरे पुरुष का सामान्य कथन बनाना व्याकरण को बदल देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, भविष्यद्वाणी-सदृश स्वर रखा गया है। वाक्य सामान्य पाठक के लिए सुबोध है, पर ‘छुड़ौती’ और ‘प्रस्थान’ जैसे शब्द मूल की ठोस धारणा और गंभीरता को सुरक्षित रखते हैं। द्वितीय पुरुष बहुवचन को स्पष्ट रखा गया है और कठिन छुड़ौती-वाक्य की वास्तविक अस्पष्टता पादटिप्पणी में बताई गई है।
