base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/002.yaml
  text: For you men love adornment on yourselves more than women[a], and companionship more than a virgin; in kingship and in greatness and in authority and in silver and gold and purple[d][c][b], and in splendor and in food they will be poured out like water.
translation:
  language: hi
  text: क्योंकि तुम पुरुष स्त्रियों से भी अधिक अपने ऊपर सजावट को पसंद करते हो, और कुँवारी से भी अधिक रंगीन वस्त्रों को पसंद करते हो। राजसत्ता, बड़प्पन, अधिकार, चाँदी, सोना, बैंजनी वस्त्र, वैभव और भोजन—ये सब पानी के समान बहा दिए जाएँगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: अंतिम चित्र का अर्थ यह हो सकता है कि ये विलास-वस्तुएँ पानी की तरह नष्ट होकर बह जाएँगी; इसमें उन्हें पानी की तरह बेहिसाब लुटाने का संकेत भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ሥነ፡ ትወድዩ፡ ላዕሌክሙ
  choice: अपने को सजाना पसंद करते हो
  rationale: ሥነ को सौंदर्य या सजावट और ትወድዩ को ‘तुम पसंद करते हो’ समझते हुए, ላዕሌክሙ के आत्म-संबंधी भाव को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: አንትሙ፡ ዕደው
  choice: तुम पुरुष
  rationale: यह संबोधन पुरुषों को सूचित करता है; ዕደው को ‘काम/कर्म’ मानने के बजाय ‘पुरुष’ के अर्थ में लिया गया है।
- source_word: ፈድፋደ፡ እም
  choice: से भी अधिक
  rationale: यहाँ यह रचना तुलना सूचित करती है, न कि ‘से प्राप्त अतिरेक’।
- source_word: ኅብረ
  choice: रंग-बिरंगे वस्त्र
  rationale: सजावट और विलासिता के प्रसंग में ‘रंग/रंगीली वेशभूषा’ का अर्थ उपयुक्त है; शब्द का ‘संगति’ संबंधी अर्थ संभव होने के कारण उसे पादटिप्पणी में रखा गया है।
- source_word: መንንግሥት
  choice: राजसत्ता
  rationale: राजकीय शासन, पद और हैसियत के भाव को संक्षेप में व्यक्त करता है।
- source_word: ዕበይ
  choice: बड़प्पन
  rationale: महानता, ऊँचे पद या भव्यता के व्यापक अर्थ को खुला रखता है।
- source_word: ሥልጣን
  choice: अधिकार
  rationale: शासन करने की शक्ति अथवा प्राधिकार का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: ሜላት
  choice: बैंजनी वस्त्र
  rationale: विलासिता की सूची में यह महँगे बैंजनी रंगे कपड़े को सूचित करता है, केवल अमूर्त रंग को नहीं।
- source_word: ክብር
  choice: वैभव
  rationale: इस भौतिक विलासिता-सूची में दृश्य ऐश्वर्य या शोभा का भाव ‘सम्मान’ की अपेक्षा अधिक उपयुक्त है।
- source_word: ከመ፡ ማይ፡ ይትከዐዉ
  choice: पानी के समान बहा दिए जाएँगे
  rationale: निष्क्रिय क्रिया-भाव और पानी की उपमा को सुरक्षित रखा गया है; इससे अपव्यय और नष्ट हो जाने, दोनों संभावित संकेत खुले रहते हैं।
theological_decisions:
- issue: क्या आरंभिक निंदा यौन अनैतिकता की है या पुरुषों की विलासी सजावट की
  choice: मुख्य पाठ में पुरुषों की अत्यधिक सजावट और रंगीन वेशभूषा की निंदा
  alternative: स्त्रियों और कुँवारियों के साथ भोग-विलासी संगति की निंदा
  rationale: तुलनात्मक ፈድፋደ፡ እም, ‘सौंदर्य/सजावट’ और आगे आने वाली धन-विलास की सूची पहले अर्थ का अधिक समर्थन करती है; फिर भी ኅብረ की अर्थ-संभावना पादटिप्पणी में सुरक्षित है।
- issue: पानी की तरह बहाए जाने का आशय
  choice: विलास की सूची की वस्तुएँ बहा दी जाएँगी
  alternative: लोग इन वस्तुओं को पानी की तरह अपव्यय में बहाएँगे
  rationale: गीज़ का निष्क्रिय रूप विनाश या क्षय की ओर संकेत करता है, पर उपमा में अपव्यय का संकेत भी संभव है; पादटिप्पणी दोनों को बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। तुलना को स्पष्ट रखने के लिए “से भी अधिक” दोहराया गया है। विलासिता की सूची में ठोस संज्ञाएँ रखी गई हैं और अंतिम निष्क्रिय वाक्य को जानबूझकर खुला रखा गया है।
