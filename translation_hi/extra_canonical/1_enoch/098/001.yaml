  text: And now I swear to you[a], to the wise and to the foolish[b], that you will see much upon the earth.
translation:
  language: hi
  text: हे बुद्धिमानो और मूर्खो, मैं तुमसे शपथपूर्वक कहता हूँ कि तुम पृथ्वी पर बहुत कुछ देखोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይእዜኒ
  choice: और अब
  rationale: संयोजक और कालवाचक क्रियाविशेषण मिलकर उपदेश के एक नए कथन का आरम्भ करते हैं; यह सहज और गरिमापूर्ण हिन्दी है।
- source_word: እምሕል
  choice: शपथ खाकर कहता हूँ
  rationale: क्रिया का मूल अर्थ शपथ खाना है। हिन्दी में ‘तुमसे शपथ खाकर कहता हूँ कि…’ शपथ की गंभीरता और उसके बाद आने वाले कथन, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ለጠቢባን ወለአብዳን
  choice: बुद्धिमानों और मूर्खों से
  rationale: यह मूल पाठ के संतुलित नैतिक-विवेक संबंधी विरोध को बनाए रखता है और किसी एक समूह तक संबोधन को सीमित नहीं करता।
- source_word: እስመ
  choice: कि
  rationale: यहाँ शपथ की विषयवस्तु प्रस्तुत करने वाला पूरक संबंध प्रसंग में स्वाभाविक है; ‘क्योंकि’ भी शब्द का संभावित अर्थ हो सकता है, पर इस वाक्य-विन्यास में कम सहज है।
- source_word: ብዙኅ
  choice: बहुत कुछ
  rationale: यह अनिर्दिष्ट बहुतायत को व्यक्त करता है और मूल की व्यापकता को किसी विशेष प्रकार की घटनाओं तक सीमित नहीं करता।
- source_word: ትሬእዩ
  choice: तुम … देखोगे
  rationale: भविष्यसूचक चेतावनी को आधुनिक हिन्दी में स्पष्टता से व्यक्त करता है।
- source_word: ዲበ ምድር
  choice: पृथ्वी पर
  rationale: व्यापक स्थानगत अर्थ को बनाए रखता है; ‘देश में’ कहने से आशय अनावश्यक रूप से संकुचित हो जाता।
theological_decisions:
- issue: ‘बुद्धिमानों और मूर्खों’ संबोधन का दायरा
  choice: दोनों प्रकार के श्रोताओं को सीधे संबोधित करने वाला व्यापक नैतिक कथन
  alternative: इस्राएल के भीतर के दो विशिष्ट वर्ग, अथवा मुख्यतः दुष्टों के लिए व्यंग्यात्मक संबोधन
  rationale: पद स्वयं दोनों वर्गों को बिना किसी अतिरिक्त सीमा के साथ रखता है। सीधा अनुवाद इस तनाव को सुरक्षित रखता है और आगे के प्रसंग को उनका दायरा स्पष्ट करने देता है।
- issue: शपथ और आगामी कथन का संबंध
  choice: आगामी दर्शन को शपथ की विषयवस्तु मानकर ‘कि’ से जोड़ा गया
  alternative: इसे कारणवाचक मानकर ‘क्योंकि तुम…देखोगे’ कहना
  rationale: እስመ में कारणवाचक अर्थ संभव है, पर शपथ-सूत्र के बाद पूरक कथन के रूप में पढ़ना वाक्य को अधिक स्वाभाविक बनाता है; विकल्प को टिप्पणी में अनावश्यक रूप से निर्णायक सिद्ध नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, किंतु सामान्य पाठक के लिए सहज रूप अपनाया गया है। ‘शपथ खाकर कहता हूँ’ मूल की गंभीर शपथ-भाषा को बचाता है; ‘बुद्धिमानों और मूर्खों’ का समानांतर विन्यास मूल विरोध को स्पष्ट रखता है।
