base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/006.yaml
  text: I have sworn to you[a], sinners, by the Great Holy One, that all your evil deeds are revealed in the heavens[b], and none of your deeds of violence are covered or hidden.
translation:
  language: hi
  text: हे पापियो, मैं महान पवित्र परमेश्वर की शपथ खाकर तुमसे कहता हूँ कि तुम्हारे सारे बुरे काम स्वर्गों में प्रकट हैं, और तुम्हारे हिंसा के कामों में से कोई भी ढका या छिपा हुआ नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሐልኩ
  choice: मैं ... शपथ खाकर कहता हूँ
  rationale: गीज़ का प्रथम पुरुष पूर्ण क्रियारूप शपथ लेने का भाव रखता है। हिन्दी में यह प्रयोग उस शपथ की वर्तमान, गंभीर घोषणा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ኃጥኣን
  choice: पापियों
  rationale: न्याय-संबंधी संबोधन में यह सीधा और प्रचलित हिन्दी समतुल्य है।
- source_word: በቅዱስ ዐቢይ
  choice: महान पवित्र जन की शपथ खाकर
  rationale: यह शपथ का साधन बताने वाला ईश्वरीय विशेषण है। ‘महान’ और ‘पवित्र’ दोनों तत्व सुरक्षित रखे गए हैं; ‘जन’ इसे किसी उत्तरकालीन रूढ़ उपाधि में बदले बिना व्यक्तित्वसूचक बनाता है।
- source_word: ኵሉ ግብርክሙ እኩይ
  choice: तुम्हारे सारे बुरे काम
  rationale: ‘काम’ सामान्य आधुनिक हिन्दी में कर्मों की नैतिक ठोसता बनाए रखता है, और ኵሉ की समग्रता ‘सारे’ से व्यक्त होती है।
- source_word: ክሡት ውእቱ በሰማያት
  choice: स्वर्गों में प्रकट हैं
  rationale: ‘प्रकट’ मूल के खुले या अनावृत होने के भाव को व्यक्त करता है। बहुवचन ‘स्वर्गों’ गीज़ रूप और अपोकैलिप्टिक विश्व-चित्र को सुरक्षित रखता है।
- source_word: ግብረ ግፍዕ
  choice: हिंसा का काम
  rationale: ግፍዕ में हिंसा, अत्याचार और अन्याय का अर्थक्षेत्र है। ‘हिंसा का काम’ इस पद का ठोस, निंदात्मक बल बनाए रखता है।
- source_word: ወአልብክሙ ... ክዱነ ወእኁቡአ
  choice: तुम्हारा कोई भी ... ढका या छिपा हुआ नहीं है
  rationale: नकारात्मक अस्तित्वसूचक पद को स्पष्ट रूप से रखा गया है और अंतिम दोनों विशेषणों को ‘ढका’ तथा ‘छिपा’ के रूप में अनूदित किया गया है; इन्हें लिखे या दर्ज किए जाने के अर्थ में नहीं लिया गया।
theological_decisions:
- issue: ईश्वरीय शपथ और उपाधि
  choice: महान पवित्र जन की शपथ खाकर
  alternative: महान पवित्र की शपथ खाकर
  rationale: यह वाक्यांश परमेश्वर के लिए गंभीर उपाधि की तरह काम करता है। ‘जन’ हिन्दी में व्यक्तित्वसूचकता स्पष्ट करता है, पर किसी बाद की संप्रदायगत शब्दावली को आरोपित नहीं करता।
- issue: स्वर्गीय प्रकटीकरण और छिपाव का निषेध
  choice: बुरे काम स्वर्गों में प्रकट हैं ... कोई भी हिंसा का काम ढका या छिपा हुआ नहीं है
  alternative: हिंसा के काम लिखे और दर्ज किए गए हैं
  rationale: मूल पाठ खुलेपन और न छिपे होने के बीच सीधा विरोध स्थापित करता है। नकारात्मक अस्तित्वसूचक रचना को बनाए रखना स्वर्गीय अभिलेखन की ऐसी छवि जोड़ने से अधिक स्रोत-संगत है जो इस पद में स्पष्ट नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘स्वर्गों’ का बहुवचन मूल की अपोकैलिप्टिक अभिव्यक्ति के कारण जानबूझकर रखा गया है।
