base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/008.yaml
  text: From now on[b][a], know that all your violence that you commit is being written down every day until the day of your judgment.
translation:
  language: hi
  text: अब से[b] जान लो कि तुम्हारे सारे अत्याचार, जो तुम करते हो, तुम्हारे न्याय के दिन तक प्रतिदिन लिखे जा रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: यह कथन उस प्रलयकालीन धारणा की ओर संकेत करता है जिसमें न्याय के दिन के लिए मनुष्यों के कर्मों का लेखा लिखा जाता है।
    reason: cross_reference
lexical_decisions:
- source_word: እምይእዜ
  choice: अब से
  rationale: यह समय-सूचक पद आगे से लागू होने वाली गंभीर चेतावनी को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ታእምሩ
  choice: जान लो
  rationale: बहुवचन आज्ञार्थक संबोधन की तीक्ष्णता बनाए रखता है; ‘समझ लो’ की अपेक्षा मूल के ‘जानना’ भाव के अधिक निकट है।
- source_word: ግፍዕክሙ
  choice: तुम्हारा सारा अत्याचार
  rationale: यह संज्ञा हिंसक अन्याय और दमनकारी आचरण दोनों को समेट सकती है। ‘अत्याचार’ हिन्दी में इन दोनों अर्थ-छायाओं को अपेक्षाकृत स्वाभाविक ढंग से बनाए रखता है।
- source_word: ዘትገፍዑ
  choice: जो तुम करते हो
  rationale: सजातीय धातु से बने संबंधवाचक पद को अनावश्यक और अस्वाभाविक पुनरुक्ति के बिना व्यक्त करता है, जबकि निरंतर किए जा रहे अत्याचार का संदर्भ स्पष्ट रहता है।
- source_word: ይጸሐፍ
  choice: लिखा जा रहा है
  rationale: निष्क्रिय और अपूर्ण/निरंतर क्रिया का भाव सुरक्षित रहता है तथा कर्मों के लेखे की सर्वनाश-संबंधी छवि बनी रहती है।
- source_word: በኵሉ ዕለት
  choice: प्रतिदिन
  rationale: मूल के ‘हर दिन’ वाले कालगत अर्थ का संक्षिप्त, स्पष्ट और गरिमापूर्ण हिन्दी रूप है।
- source_word: እስከ ዕለተ ኵነኔክሙ
  choice: तुम्हारे न्याय के दिन तक
  rationale: नियत न्याय-दिवस का संकेत देता है, पर ‘दण्डादेश’ या ‘दोषसिद्धि’ कहकर परिणाम को मूल से अधिक निश्चित नहीं करता।
theological_decisions:
- issue: कर्मों का स्वर्गीय लेखा
  choice: हिंसक-अन्यायी कर्मों के न्याय के दिन तक लगातार लिखे जाने की छवि को यथावत रखा गया है।
  alternative: इसे केवल ‘तुम्हारे कर्म याद रखे जा रहे हैं’ जैसे रूपक के रूप में व्यक्त करना।
  rationale: मूल का निष्क्रिय ‘लिखा जा रहा है’ और न्याय-दिवस तक की अवधि सर्वनाश-साहित्य में कर्मों के अभिलेख की छवि से मेल खाते हैं। मुख्य पाठ इसे ‘स्वर्गीय पुस्तक’ कहकर विस्तार नहीं देता, इसलिए छवि सुरक्षित रहते हुए अतिव्याख्या से बचती है।
- issue: न्याय बनाम दोषदण्ड
  choice: न्याय
  alternative: दोषदण्ड अथवा दण्डादेश
  rationale: मूल पद न्यायिक निर्णय को सूचित करता है; दोषदण्ड कहना परिणाम को पहले ही तय कर देता और वास्तविक अर्थगत तनाव घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गंभीर और चेतावनीपूर्ण संबोधन रखा गया है। ‘अत्याचार’ सामान्य पाठक के लिए बोधगम्य है और हिंसा तथा उत्पीड़न दोनों की अर्थ-सीमा को बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
