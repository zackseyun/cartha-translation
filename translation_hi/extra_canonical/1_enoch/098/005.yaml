  text: And barrenness was not given to a woman[a]; rather[c][b], because of the work of her hands she dies childless.
translation:
  language: hi
  text: और बाँझपन किसी स्त्री को नहीं दिया गया[a]; बल्कि[c] उसके हाथों के कामों के कारण वह निःसंतान मरती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘बाँझपन किसी स्त्री के भाग में नहीं रखा गया।’ गीज़ पाठ बाँझपन का विरोध वास्तविक दंड—निःसंतान मृत्यु—से करता है।
    reason: lexical_alternative
  - marker: b
    text: ‘हाथों के काम’ उसके कर्मों या कार्यों के लिए एक मुहावरा है।
    reason: cultural_note
  - marker: c
    text: या, ‘किसी स्त्री को नहीं दिया गया; बल्कि उसके हाथों के कामों के कारण वह निःसंतान मरती है।’
    reason: previous_rendering
