- source_word: ምክነት
  choice: बाँझपन
  rationale: यह संज्ञा प्रजनन-असमर्थता या संतानहीनता को दर्शाती है। ‘बाँझपन’ अंतिम पद ‘निःसंतान’ के साथ मूल का ठोस विरोध बनाए रखता है।
- source_word: ለብእሲት
  choice: किसी स्त्री को
  rationale: गीज़ संज्ञा निश्चितता के लिए चिह्नित नहीं है और कथन सामान्य सिद्धांत के रूप में है; इसलिए ‘किसी स्त्री को’ स्वाभाविक है।
- source_word: ኢተውህበት
  choice: नहीं दिया गया
  rationale: यह ‘देना’ क्रिया का कर्मवाच्य रूप है; यह अनुवाद सरल और व्याख्यात्मक भार से मुक्त है।
- source_word: አላ
  choice: बल्कि
  rationale: यह बाँझपन और आगे वर्णित मृत्यु के बीच प्रबल विरोध व्यक्त करता है।
- source_word: በእንተ
  choice: के कारण
  rationale: यह कारण या आधार बताने वाला संबंधसूचक पद है।
- source_word: ግብረ እዴሃ
  choice: अपने हाथों के कामों
  rationale: शाब्दिक बिंब को रखते हुए यह उसके कर्मों या कार्यों का मुहावरेदार संकेत देता है। बहुवचन ‘कामों’ हिंदी में कर्मों के सामान्य अर्थ को स्वाभाविक बनाता है।
- source_word: ትመውት
  choice: मरती है
  rationale: अपूर्ण रूप संदर्भ में सामान्य, सूक्तिपरक कथन व्यक्त कर सकता है; हिंदी का सामान्य वर्तमान इस बल को बनाए रखता है।
- source_word: ዘእንበለ ውሉድ
  choice: निःसंतान
  rationale: इस पद का अर्थ ‘संतान के बिना’ है; ‘निःसंतान’ संक्षिप्त, dignified और आधुनिक मानक हिंदी में स्पष्ट है।
theological_decisions:
- issue: स्त्री पर न्याय का स्वरूप
  choice: वचन बाँझपन को दी हुई नियति बताने के बजाय उसके अपने कर्मों के कारण निःसंतान मृत्यु से उसका विरोध करता है।
  alternative: इसे अधिक सामान्य रूप में भी पढ़ा जा सकता है कि संतानहीनता उसका ठहराया हुआ भाग्य नहीं, बल्कि मृत्यु है।
  rationale: मूल में ‘नहीं दिया गया’ के बाद प्रबल विरोधसूचक पद और कारणसूचक वाक्यांश आता है। अनुवाद कर्म और परिणाम का संबंध रखता है, पर कर्मों का स्वरूप मूल से अधिक विशिष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज और सूक्तिपरक शैली अपनाई गई है। मूल का ‘हाथों के काम’ वाला ठोस मुहावरा तथा बाँझपन और निःसंतान मृत्यु के बीच तनाव सुरक्षित रखा गया है।
