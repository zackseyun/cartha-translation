translation:
  language: hi
  text: वहाँ मैंने एक पवित्र पर्वत देखा; उसके नीचे पूर्व से पानी था, और उसका बहाव उत्तर की ओर था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደብረ
  choice: पर्वत
  rationale: यह गीइज़ संज्ञा सामान्यतः पर्वत या ऊँचे भूभाग को दर्शाती है। ‘पर्वत’ दर्शनीय भूगोल के लिए स्वाभाविक और गरिमापूर्ण है।
- source_word: ቅዱሰ
  choice: पवित्र
  rationale: यह शब्द अलग ठहराए गए या पवित्र होने का भाव रखता है; ‘पवित्र’ इसके धर्मवैचारिक बल को बनाए रखता है।
- source_word: መትሕተ ደብር
  choice: पर्वत के नीचे
  rationale: यह मूल स्थान-संबंधी अभिव्यक्ति का सीधा और आधुनिक हिन्दी रूप है।
- source_word: ማይ
  choice: पानी
  rationale: मूल शब्द सामान्य रूप से ‘पानी’ कहता है। उसे ‘नदी’ या ‘धारा’ बनाना संदर्भ से अधिक विशिष्ट होगा।
- source_word: እመንገለ ጽባሕ
  choice: पूर्व दिशा की ओर से
  rationale: यह पूर्व अथवा सूर्योदय की दिशा से आने का संकेत देता है। यह रूप दिशात्मक अर्थ को स्पष्ट रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: ውሕዘቱ
  choice: उसका बहाव
  rationale: यह पानी की बहने की गति अथवा प्रवाह-पथ की ओर संकेत करता है; ‘बहाव’ अलग नदी की कल्पना जोड़े बिना मूल चित्र बनाए रखता है।
- source_word: መንገለ ሰሜን
  choice: उत्तर की ओर
  rationale: यह उत्तर दिशा की ओर गति या अभिमुखता दर्शाता है और ‘बहाव’ के साथ स्वाभाविक बैठता है।
theological_decisions:
- issue: ቅዱሰ को स्पष्ट धर्मवैचारिक शब्द से अनूदित करना
  choice: पवित्र पर्वत
  alternative: पावन पर्वत
  rationale: हनोक के दर्शनीय भूगोल में पर्वत की पवित्रता दृश्य के अर्थ का अभिन्न भाग है। ‘पवित्र’ उस बल को सामान्य पाठक के लिए स्पष्ट रूप से बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण रूप अपनाया गया है। मूल के ‘पानी’ को ‘नदी’ या ‘धारा’ बनाकर अधिक विशिष्ट नहीं किया गया। हिन्दी की स्वाभाविक वाक्य-रचना के लिए ‘था’ का प्रयोग किया गया है, जबकि दिशा और बहाव संबंधी मूल अर्थ यथावत रखा गया है।
