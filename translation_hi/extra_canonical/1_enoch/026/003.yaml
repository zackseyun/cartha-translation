base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/026/003.yaml
  text: And I saw another mountain toward the east[a], higher than this one; and between them was a deep ravine, but not wide[d][c][b], and water was flowing in it toward the mountain.
translation:
  language: hi
  text: और मैंने पूर्व की ओर[a] एक और पहाड़ देखा, जो इससे ऊँचा[b] था। उन दोनों के बीच एक गहरी घाटी थी, पर वह चौड़ी नहीं थी; और उसमें पानी पहाड़ की ओर बह रहा था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक पदबंध का संबंध ‘भोर’ या ‘प्रातः’ से भी है; दिशासूचक अर्थ में ‘पूर्व की ओर’ अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: इस शब्द का अर्थ ‘इससे लंबा’, ‘इससे अधिक विस्तृत’ या ‘इससे बड़ा’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: अंतिम वाक्यांश कठिन है। गीइज़ पाठ सबसे सीधे रूप में कहता है कि घाटी में पानी था और वह ‘पहाड़ की ओर’ जा रहा था।
    reason: textual_difficulty
lexical_decisions:
- source_word: መንገለ ጽባሕ
  choice: पूर्व की ओर
  rationale: ጽባሕ का मूल संबंध भोर, प्रातः और पूर्व दिशा से है। यहाँ दिशासूचक अर्थ में ‘पूर्व की ओर’ सटीक और स्वाभाविक है; ‘उत्तर-पूर्व’ कहना स्रोत से अधिक विशिष्ट होगा।
- source_word: ካልአ ደብረ
  choice: एक और पहाड़
  rationale: यह पद पहले वर्णित पहाड़ के बाद दूसरे पहाड़ को प्रस्तुत करता है; ‘एक और पहाड़’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ዘይነውኅ እምዝ
  choice: जो इससे ऊँचा था
  rationale: क्रिया लंबाई, विस्तार या महानता का भाव दे सकती है, किंतु पहाड़ों की इस स्थलाकृतिक तुलना में ऊँचाई सबसे संभावित अर्थ है। अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ማእከሎሙ
  choice: उन दोनों के बीच
  rationale: बहुवचन सर्वनाम दोनों पहाड़ों के मध्य के स्थान की ओर संकेत करता है।
- source_word: ቈላ ዕሙቀ
  choice: एक गहरी घाटी
  rationale: यह शब्द-समूह गहरे धँसे भूभाग को दर्शाता है। ‘घाटी’ सामान्य हिन्दी पाठक के लिए स्पष्ट है और दृश्य की ठोस स्थलाकृति बनाए रखता है।
- source_word: አልቦ ርሐበ
  choice: पर अधिक चौड़ी नहीं
  rationale: शाब्दिक भाव ‘चौड़ाई नहीं थी’ है। ‘अधिक चौड़ी नहीं’ हिन्दी में सहज है और घाटी के गहरी किंतु संकरी होने का विरोध बनाए रखता है।
- source_word: ቦቱኒ ማይ
  choice: उसमें पानी
  rationale: यह पदबंध पानी को घाटी के भीतर स्थित बताता है।
- source_word: የሐውር መንገለ ደብር
  choice: पहाड़ की ओर बह रहा था
  rationale: क्रिया का सामान्य अर्थ चलना या जाना है; पानी के साथ ‘बहना’ स्वाभाविक समतुल्य है। कठिन दिशात्मक वाक्यांश ‘पहाड़ की ओर’ को बिना व्याख्यात्मक सुधार के बनाए रखा गया है।
theological_decisions:
- issue: दर्शन की स्थलाकृति को ठोस रखना
  choice: पहाड़, घाटी और बहते पानी को दर्शन के ठोस भूदृश्य के रूप में रखा गया है।
  alternative: अनुवाद में ही इन दृश्यों को प्रतीकों के रूप में समझाकर प्रस्तुत करना।
  rationale: मूल पाठ दृश्यात्मक, ठोस भाषा का प्रयोग करता है। प्रतीकात्मक अर्थ संभव हो सकता है, पर उसे अनुवाद में आरोपित नहीं किया जाना चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दृश्यात्मक रखी गई है। ‘पूर्व’ और ‘पहाड़’ जैसे सामान्य शब्द चुने गए हैं; स्रोत की वास्तविक शब्दार्थगत तथा वाक्यगत अस्पष्टताएँ पादटिप्पणियों में सुरक्षित हैं।
