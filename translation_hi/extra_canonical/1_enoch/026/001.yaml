base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/026/001.yaml
  text: And from there I went to the middle of the earth[a], and I saw a blessed place, shaded[c][b], in which there were trees with abiding and sprouting branches from a tree that had been cut down.
translation:
  language: hi
  text: और वहाँ से मैं पृथ्वी के मध्य भाग में गया[a], और मैंने एक धन्य, छायादार स्थान देखा। वहाँ ऐसे पेड़ थे जिनमें एक काटे गए पेड़ से निकली टिकी रहने वाली और फूट निकलने वाली शाखाएँ थीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पृथ्वी के मध्य भाग’ का अनुवाद ‘धरती के बीचोंबीच’ या ‘देश के मध्य भाग’ भी हो सकता है। दर्शनीय प्रसंग के कारण यहाँ ‘पृथ्वी’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: इस वनस्पति-वर्णन का इथियोपिक पाठ कठिन है। अंतिम वाक्यांश संभवतः काटे गए पेड़ से नई शाखाओं या कोपलों के निकलने का वर्णन करता है, पर पेड़ों, शाखाओं और उस कटे पेड़ का ठीक पारस्परिक संबंध अनिश्चित है।
    reason: textual_variant
lexical_decisions:
- source_word: ማእከለ ምድር
  choice: पृथ्वी के मध्य भाग में
  rationale: यह रूप दर्शन के विश्व-भौगोलिक भाव को बनाए रखता है; केवल किसी स्थानीय भूभाग का अर्थ निर्धारित नहीं करता।
- source_word: መካነ ቡሩከ
  choice: एक आशीषित ... स्थान
  rationale: स्थान पर आशीष होने का विशेषणात्मक भाव संक्षिप्त और स्वाभाविक रूप में सुरक्षित रहता है।
- source_word: ጥሉለ
  choice: छायादार
  rationale: कोष्ठक में सुरक्षित कठिन पाठ को उपजाऊ, छाया से युक्त स्थान के ठोस चित्र के रूप में प्रस्तुत करता है।
- source_word: ዕፀወ / አዕፁቀ
  choice: पेड़ ... डालियाँ
  rationale: दोनों वनस्पति-संबंधी पदों को अलग-अलग व्यक्त किया गया है, ताकि मूल में स्पष्ट पेड़ों का उल्लेख न छूटे और दूसरे पद का शाखाओं से संबंध भी बना रहे।
- source_word: ዘይነብር ወይሠርፅ
  choice: बनी रहती और फूटती थीं
  rationale: पहली क्रिया स्थायित्व और दूसरी नई कोंपलों अथवा शाखाओं के निकलने का भाव देती है।
- source_word: እምዕፅ ዘተመተረ
  choice: एक काटे गए पेड़ से
  rationale: यह कट चुके पेड़ से निकलती जीवित बढ़वार का चित्र रखता है, पर कठिन वाक्य-संबंध को अत्यधिक स्पष्ट करके तय नहीं करता।
theological_decisions:
- issue: क्या इस दृश्य को सामान्य भू-दृश्य माना जाए या प्रतीकात्मक पवित्र भूगोल
  choice: ‘पृथ्वी के मध्य भाग’, ‘आशीषित’ स्थान और जीवित बढ़वार जैसे ठोस दर्शनीय संकेत बनाए रखना, पर स्थान को नाम न देना
  alternative: इसे मुख्य पाठ में अदन, स्वर्गलोक या मात्र उपजाऊ प्रदेश कहना
  rationale: पद में पवित्र भूगोल की ध्वनि है, पर वह स्थान की स्पष्ट पहचान नहीं करता; इसलिए प्रतीकात्मक अर्थ को खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। ‘आशीषित’ पवित्र भाव को बनाए रखता है, जबकि ‘छायादार’, ‘डालियाँ’ और ‘फूटती’ दृश्य को साधारण पाठक के लिए ठोस और बोधगम्य बनाते हैं।
