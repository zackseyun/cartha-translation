lexical_decisions:
- source_word: መንገለ
  choice: में
  rationale: यहाँ መንገለ संज्ञा ‘मार्ग’ नहीं, बल्कि दिशासूचक संबंधबोधक प्रयोग है; ‘इसके पश्चिम में’ निकटवर्ती स्थान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ዐረቡ
  choice: पश्चिम
  rationale: यह शब्द पश्चिमी दिशा को सूचित करता है, जिसे दृश्य के स्थल-वर्णन में स्पष्ट रखा गया है।
- source_word: ለዝ
  choice: इसके
  rationale: संबंधबोधक प्रत्यय और संकेतवाचक का संयुक्त भाव यहाँ ‘इसका/इसके’ है; हिन्दी स्थानवाचक रचना में ‘इसके पश्चिम में’ उपयुक्त है।
- source_word: ካልእ
  choice: एक और
  rationale: शब्द का अर्थ ‘दूसरा/एक और’ है। मूल अंश में संबंधित संज्ञा नहीं दी गई, इसलिए ‘एक और’ कहकर उसके संज्ञावत और अनिश्चित प्रयोग को सुरक्षित रखा गया है।
theological_decisions:
- issue: दर्शन-वर्णन में ካልእ का लुप्त संदर्भ
  choice: ‘एक और’ कहकर संज्ञा को अनिर्दिष्ट रखा गया।
  alternative: ‘एक और पर्वत’ अथवा ‘दूसरा स्थान’
  rationale: प्राप्त गीइज़ पाठ में संबंधित संज्ञा स्पष्ट रूप से उपस्थित नहीं है। संदर्भ से उसे भर देने पर मूल की संक्षिप्तता और वास्तविक अस्पष्टता मिट जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सहज स्थल-वर्णन। ‘था’ पुल्लिंग का प्रयोग अनिर्दिष्ट संज्ञावत ‘एक और’ के लिए किया गया है, बिना ‘पर्वत’ जैसी कोई संज्ञा जोड़कर संदर्भ को निश्चित किए।
