base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/007.yaml
  text: 'And from there I went to another place[a], more terrible than this, and I saw a fearful work: a great fire was there, burning and blazing, and the place had a cleft reaching to the abyss, full of great pillars of fire descending; neither its measure nor its size was I able to see[c][b], and I was not able to look at it.'
translation:
  language: hi
  text: 'और वहाँ से मैं एक दूसरे स्थान पर गया, जो इससे भी अधिक भयानक था, और मैंने एक भयावह कृति देखी: वहाँ एक बड़ी आग थी, जो जल रही और धधक रही थी; और उस स्थान में अथाह गहराई तक पहुँचती हुई एक दरार थी[a], जो नीचे उतरते हुए आग के बड़े-बड़े स्तंभों से भरी थी[c]। न तो उसका माप और न उसका आकार मैं देख सका[b], और मैं उसकी ओर देख भी न सका।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: स्थान के नीचे की ओर फटे होने से संबंधित गीइज़ वाक्यांश कठिन है। यहाँ इसका सावधान अर्थ ऐसी दरार या खाई है जो अत्यंत गहराई तक जाती है।
    reason: textual_variant
  - marker: b
    text: या, “मैं उसके माप या उसकी विशालता को समझ न सका।” आशय यह है कि हनोक उस दृश्य के आयामों को ग्रहण नहीं कर सका।
    reason: lexical_alternative
  - marker: c
    text: या, “जिसमें आग के बड़े-बड़े स्तंभ नीचे उतर रहे थे।”
    reason: previous_rendering
