theological_decisions:
- issue: दृश्य के स्थान की प्रकृति
  choice: इसे अग्नि, गहराई और भय से युक्त एक दर्शनात्मक स्थान के रूप में वर्णित किया गया है, पर मुख्य पाठ में उसका नाम नहीं रखा गया।
  alternative: इसे नरक, अधोलोक या ब्रह्मांडीय कारागार कहना।
  rationale: इस पद में स्थान का कोई स्पष्ट धर्मशास्त्रीय नाम नहीं है; इसलिए बाद की व्याख्याओं को आरोपित किए बिना मूल बिंब और तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘अथाह गहराई’ अपार गहराई का बिंब देती है, पर किसी विशिष्ट धर्मशास्त्रीय लोक का नाम नहीं बनती। ‘भयावह कार्य’ जानबूझकर मूल के ठोस ‘कार्य/कृति’ पद को सुरक्षित रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
