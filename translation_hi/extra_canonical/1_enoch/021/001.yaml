translation:
  language: hi
  text: और मैं आगे बढ़ता गया, जब तक कि मैं एक ऐसे स्थान पर न पहुँचा जहाँ कुछ भी बनाया नहीं जाता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पंक्ति का अर्थ यह भी हो सकता है: “एक ऐसा स्थान जहाँ कुछ भी बनाया नहीं गया था” या “जहाँ कुछ भी अस्तित्व में नहीं था।” गीज़ पाठ संक्षिप्त है और उस स्थान में बनाई या गढ़ी हुई वस्तुओं के पूर्ण अभाव पर बल देता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: አድኩ
  choice: मैं आगे बढ़ता गया
  rationale: यह क्रिया हनोक की दर्शनीय यात्रा में निरंतर आगे बढ़ने को व्यक्त करती है; यह हिन्दी में स्वाभाविक रूप से कथानक की प्रगति बनाए रखती है।
- source_word: እስከነ
  choice: जब तक कि मैं ... न पहुँचा
  rationale: यह गंतव्य तक गति और आगमन की सीमा बताता है। हिन्दी में यह रचना आगमन को स्पष्ट और सहज बनाती है।
- source_word: ኀበ
  choice: एक ऐसे स्थान पर
  rationale: यह किसी स्थान की ओर गति को सूचित करता है। प्रसंग के अनुसार ‘स्थान’ जोड़ना उचित है और अगले संबंधवाचक उपवाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: አልቦቱ
  choice: जहाँ कुछ भी ... नहीं
  rationale: मूल का नकारात्मक अस्तित्व-सूचक रूप उस स्थान में बनी या आकार पाई वस्तुओं के पूर्ण अभाव पर बल देता है।
- source_word: ዘይትገበር
  choice: बनाया नहीं जाता था
  rationale: ‘करना/बनाना’ धातु का निष्क्रिय रूप है। ‘बनाया’ व्यापक अर्थ बनाए रखता है; ‘सृजा’ कहना मूल से अधिक स्पष्ट ब्रह्माण्ड-विज्ञान आरोपित कर सकता है। अपूर्ण पक्ष को हिन्दी के भूतकालीन वर्णन में ‘जाता था’ से व्यक्त किया गया है।
theological_decisions:
- issue: हनोक के दर्शन में उस गंतव्य का स्वरूप
  choice: एक ऐसा स्थान जहाँ कुछ भी बनाया नहीं जाता था
  alternative: एक ऐसा स्थान जहाँ कुछ भी बना हुआ नहीं था / जहाँ कुछ भी अस्तित्व में नहीं था
  rationale: गीज़ पाठ बनी या आकार पाई वस्तुओं के अभाव पर बल देता है, पर पूर्ण तत्त्वमीमांसक अनस्तित्व को स्पष्ट रूप से नहीं कहता। मुख्य पाठ क्रिया की निष्क्रिय और अपूर्ण प्रकृति को बनाए रखता है, जबकि पादटिप्पणी वास्तविक कालगत और अर्थगत अस्पष्टता बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘आगे बढ़ता गया’ दर्शनीय यात्रा की निरंतरता दिखाता है। ‘बनाया’ को ‘सृजा’ पर प्राथमिकता दी गई है ताकि मूल से अधिक विशिष्ट सृष्टि-विषयक अर्थ न जोड़ा जाए।
