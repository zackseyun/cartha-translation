  yaml_path: translation/extra_canonical/1_enoch/021/002.yaml
  text: 'And there I saw a fearful work: I saw neither the heavens above nor the firmly founded earth, but a place unformed and terrible.'
translation:
  language: hi
  text: 'और वहाँ मैंने एक भयावह रचना देखी: मैंने न तो ऊपर का आकाश देखा, न दृढ़ता से स्थापित पृथ्वी, बल्कि एक अनगढ़ और भयानक स्थान देखा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ግብረ (gəbr)
  choice: रचना
  rationale: यह शब्द ‘कार्य/कृति/बनावट’ का भाव दे सकता है। संदर्भ में दिखाई देने वाले भयावह दृश्य या संरचना के लिए ‘रचना’ स्वाभाविक है और ‘काम’ की संभावित अस्पष्टता से बचता है।
- source_word: ግሩመ / ግሩምም (gəruma / gərumm)
  choice: भयावह / भयानक
  rationale: दोनों स्थानों पर विस्मय और आतंक जगाने वाला भाव है; हिन्दी में पुनरुक्ति को कठोर बनाए बिना समान अर्थ-क्षेत्र रखा गया है।
- source_word: ሱርርተ (surərta)
  choice: दृढ़ता से स्थापित
  rationale: पृथ्वी के जमे, स्थिर या दृढ़ आधार पर स्थापित होने का अर्थ स्पष्ट करता है।
- source_word: ዘአኮ ድልወ (za-ʾako dəlwa)
  choice: बेडौल
  rationale: शाब्दिक रूप से ‘जो व्यवस्थित/तैयार नहीं था’; ‘बेडौल’ उस स्थान की अरचित, अव्यवस्थित अवस्था को सहज हिन्दी में व्यक्त करता है, बिना उसे दार्शनिक ‘अराजकता’ बना देने के।
theological_decisions:
- issue: दृश्य में आकाश और पृथ्वी का अभाव
  choice: ‘न तो ... न ... बल्कि’ के रूप में प्रत्यक्ष विरोध बनाए रखा
  alternative: इसे सृष्टि-पूर्व शून्य अथवा किसी विशिष्ट नरक-लोक के रूप में स्पष्ट करना
  rationale: पद केवल दृश्य का वर्णन करता है; उसकी ब्रह्माण्डीय या सिद्धान्तगत पहचान निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण लेकिन सामान्य पाठक के लिए सहज। मूल के दोहराव और भयपूर्ण लय को यथासंभव बनाए रखा गया है।
