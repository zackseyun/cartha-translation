  text: And there I saw seven stars of heaven[a], bound together in it, like great mountains[c][b], and burning with fire.
translation:
  language: hi
  text: और वहाँ मैंने आकाश के सात तारे देखे,[a] जो उसमें एक साथ बँधे हुए थे, बड़े-बड़े पहाड़ों जैसे थे और आग से जल रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ बँधे हुए तारे संभवतः न्याय के अधीन स्वर्गीय प्राणियों के प्रतीक हैं; फिर भी मूल पाठ उन्हें ‘तारे’ ही कहता है।
    reason: cross_reference
lexical_decisions:
- source_word: ርኢኩ
  choice: मैंने ... देखे
  rationale: दर्शनीय वृत्तांत के प्रथम-पुरुष सूत्र को सहज और आधुनिक हिन्दी में बनाए रखता है।
- source_word: ሰብዐተ ከዋክብተ ሰማይ
  choice: आकाश के सात तारे
  rationale: मूल के तारों वाले ब्रह्मांडीय बिंब को सुरक्षित रखता है और उन्हें मुख्य पाठ में स्वर्गदूत नहीं बनाता।
- source_word: እሱራነ ... ኅቡረ
  choice: एक साथ बँधे हुए
  rationale: ኅቡረ को ‘एक साथ’ अर्थ देने वाले क्रियाविशेषण के रूप में እሱራነ के साथ जोड़ता है; इससे अनावश्यक अलग क्रिया ‘इकट्ठे किए गए’ नहीं जुड़ती।
- source_word: በላዕሌሁ
  choice: उसमें
  rationale: संदर्भगत स्थान के भीतर बँधे होने का अर्थ देता है और ऊपर मँडराने का भ्रामक स्थानिक चित्र टालता है; ‘उस पर’ भी संभव है।
- source_word: ከመ አድባር ዐበይት
  choice: बड़े-बड़े पहाड़ों के समान
  rationale: मूल की विस्मयकारी प्रलयदर्शी उपमा और बहुवचन को स्वाभाविक, गरिमापूर्ण हिन्दी में रखता है।
- source_word: ወበእሳት እንዘ ይነዱ
  choice: और आग से जल रहे थे
  rationale: आग के स्पष्ट बिंब तथा जारी क्रिया की सजीवता को बनाए रखता है।
theological_decisions:
- issue: क्या ‘सात तारों’ को न्यायाधीन स्वर्गदूतों के रूप में स्पष्ट कर दिया जाए
  choice: मुख्य पाठ में ‘आकाश के सात तारे’ बनाए रखना
  alternative: ‘स्वर्ग के सात दूत’ या ‘सात स्वर्गीय प्राणी’
  rationale: हनोक-साहित्य में तारे स्वर्गीय प्राणियों के प्रतीक हो सकते हैं, पर यहाँ गीइज़ पाठ स्वयं ‘तारे’ कहता है। प्रतीकात्मक पहचान को मुख्य पाठ में थोपने के बजाय टिप्पणी में संकेतित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सहज किंतु गरिमापूर्ण है। ‘बड़े-बड़े पहाड़’ सामान्य पाठक के लिए स्वाभाविक है और मूल की तीव्र उपमा बनाए रखता है। सभी टिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
