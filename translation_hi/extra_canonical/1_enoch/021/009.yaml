  yaml_path: translation/extra_canonical/1_enoch/021/009.yaml
  text: And at that time Uriel—one of the holy angels[a], who was with me—answered me and said to me, “Enoch,”
translation:
  language: hi
  text: और उस समय ऊरीएल—जो पवित्र स्वर्गदूतों में से एक था और मेरे साथ था—ने मुझे उत्तर दिया और मुझसे कहा, “हनोक,”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद ऊरीएल के सीधे संबोधन, “हनोक,” पर समाप्त होता है; उसका कथन अगले पद में जारी रहता है।
    reason: cross_reference
lexical_decisions:
- source_word: ውእተ፡ ጊዜ
  choice: उस समय
  rationale: यह गीइज़ कथानक का प्रचलित काल-सूचक पदबंध है; ‘उस समय’ उसके गरिमापूर्ण आख्यानात्मक स्वर को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: አውሥአኒ
  choice: मुझे उत्तर दिया
  rationale: क्रिया का मूल भाव उत्तर देने या प्रत्युत्तर देने का है; निकटवर्ती प्रश्न इस पद में न होने पर भी स्रोत की संवादात्मक कड़ी को सुरक्षित रखा गया है।
- source_word: ኡርኤል
  choice: ऊरीएल
  rationale: व्यक्तिनाम का अनुवाद नहीं, देवनागरी में लिप्यंतरण किया गया है।
- source_word: ፩እምቅዱሳን፡ መላእክት
  choice: पवित्र स्वर्गदूतों में से एक
  rationale: यह पदबंध ऊरीएल को पवित्र स्वर्गदूतों के समूह का एक सदस्य बताता है; हिन्दी में यह रूप स्पष्ट और स्वाभाविक है।
- source_word: እንዘ፡ ምስሌየ፡ ሀሎ
  choice: मेरे साथ मौजूद
  rationale: यह ऊरीएल का वर्णन करने वाला गौण पदबंध है; ‘मेरे साथ मौजूद’ स्रोत के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ወይቤለኒ
  choice: और मुझसे कहा
  rationale: यह सामान्य वचन-परिचायक सूत्र है; स्रोत की पुनरुक्तिपूर्ण आख्यान-शैली को बनाए रखा गया है।
- source_word: ሄኖክ
  choice: हनोक
  rationale: व्यक्तिनाम को प्रचलित हिन्दी बाइबिलीय रूप में रखा गया है; संबोधन का भाव उद्धरण और विराम-चिह्नों से प्रकट होता है।
theological_decisions:
- issue: ቅዱሳን፡ መላእክት का निरूपण
  choice: पवित्र स्वर्गदूत
  alternative: पवित्रता के स्वर्गदूत; पावन स्वर्गदूत
  rationale: यह पदबंध हनोक-साहित्य में स्वर्गीय प्राणियों के एक विशिष्ट समूह को दर्शाता है। ‘पवित्र स्वर्गदूत’ पाठ के ब्रह्मांड-विषयक भेद को सुरक्षित रखता है और बाद की किसी विशिष्ट धर्मसैद्धांतिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और कथात्मक रखी गई है। ‘उत्तर दिया’ तथा ‘कहा’ की पुनरुक्ति स्रोत की शैली के अनुरूप जानबूझकर सुरक्षित रखी गई है।
