base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/005.yaml
  text: And Uriel[a], one of the holy angels who was with me and was guiding me, said to me, “Enoch, about whom are you asking[b], and about whom are you inquiring and searching?”
translation:
  language: hi
  text: तब ऊरीएल ने, जो पवित्र स्वर्गदूतों में से एक था, मेरे साथ था और मेरा मार्गदर्शन कर रहा था, मुझसे कहा, “हनोक, तुम किसके विषय में पूछ रहे हो, और किसके विषय में पूछताछ कर रहे हो और खोजबीन कर रहे हो?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम क्रिया का ठीक भाव अनिश्चित है; इसका अर्थ ‘जानने को उत्सुक हो’ या ‘व्याकुल हो’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ኡርኤል
  choice: ऊरीएल
  rationale: व्यक्तिगत नाम का अनुवाद करने के बजाय गीइज़ रूप के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: ፩እምቅዱሳን መላእክት
  choice: पवित्र स्वर्गदूतों में से एक
  rationale: यह वाक्यांश ऊरीएल को पवित्र स्वर्गदूतों के समूह में से एक बताता है; ‘पवित्र’ इस विशेषण का धार्मिक भार बनाए रखता है।
- source_word: ዘምስሌየ
  choice: मेरे साथ रहनेवाले
  rationale: सापेक्ष वाक्यांश हनोक के साथ ऊरीएल की उपस्थिति बताता है; हिन्दी में यह सहज और स्रोत के निकट है।
- source_word: ዘይመርሐኒ
  choice: मेरा मार्गदर्शन करनेवाले
  rationale: क्रिया लगातार साथ ले चलने या मार्ग दिखाने का भाव रखती है; कृदन्तीय रूप मुख्य वाक्य में स्वाभाविक बैठता है।
- source_word: በእንተ መኑ ትስእል
  choice: तुम किसके विषय में पूछ रहे हो
  rationale: በእንተ विषय या संबंध सूचित करता है और क्रिया सीधे पूछने को व्यक्त करती है।
- source_word: ወበእንተ መኑ ትጠይቅ
  choice: और किसके विषय में जानने का प्रयत्न
  rationale: दूसरी निकटार्थक क्रिया को अलग हिन्दी अभिव्यक्ति देकर मूल की जानबूझकर की गई पुनरुक्ति सुरक्षित रखी गई है।
- source_word: ወትጽህቅ
  choice: और खोज कर रहे हो
  rationale: अंतिम क्रिया का सूक्ष्म अर्थ अनिश्चित है और उसमें उत्सुकता, तत्पर खोज या व्याकुलता का भाव हो सकता है; ‘खोज’ अनावश्यक भावात्मक निष्कर्ष से बचते हुए अनुसंधान का भाव रखती है।
theological_decisions:
- issue: ‘पवित्र स्वर्गदूतों’ का पद
  choice: पवित्र स्वर्गदूत
  alternative: पावन स्वर्गदूत
  rationale: हनोक-साहित्य में यह अर्थपूर्ण स्वर्गीय श्रेणी है; ‘पवित्र’ हिन्दी धार्मिक प्रयोग में स्पष्ट और सुसंगत है।
- issue: अंतिम क्रिया के भाव की अनिश्चितता
  choice: खोज कर रहे हो
  alternative: उत्सुक हो / व्याकुल हो
  rationale: पाठ में तीव्र जिज्ञासा अथवा चिंता दोनों की छाया संभव है। मुख्य पाठ में अपेक्षाकृत तटस्थ रूप रखा गया और विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। निकटार्थक प्रश्नवाचक क्रियाओं की पुनरुक्ति को पूरी तरह हटाया नहीं गया, और अंतिम क्रिया की वास्तविक अर्थगत अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
