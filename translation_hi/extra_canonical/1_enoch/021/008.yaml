translation:
  language: hi
  text: और उस समय मैंने कहा, “यह स्थान कितना भयानक है और इसे देखना कितना पीड़ादायक है!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम पदबंध का अनुवाद ‘और इसे देखना कितना कष्टदायक है’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ውእተ፡ ጊዜ
  choice: उस समय
  rationale: यह कथानक में समय और क्रम को जोड़ने वाला मानक पदबंध है; ‘उस समय’ उसके गंभीर आख्यानात्मक स्वर को बनाए रखता है।
- source_word: እቤ
  choice: मैंने कहा
  rationale: यह रूप प्रत्यक्ष कथन का परिचय देता है; आधुनिक हिन्दी में ‘मैंने कहा’ स्वाभाविक और अर्थ की दृष्टि से पर्याप्त है।
- source_word: አፎ
  choice: कितना
  rationale: नवीन स्रोत-समीक्षा के अनुसार यहाँ यह ‘मुख’ नहीं, बल्कि विस्मयबोधक पद है, जो अगले विशेषण की तीव्रता व्यक्त करता है। इसलिए ‘कितना भयानक’ चुना गया है।
- source_word: ግሩም
  choice: भयानक
  rationale: न्याय-दर्शन के इस प्रसंग में शब्द भय उत्पन्न करने वाली विकरालता व्यक्त करता है; ‘भयानक’ आधुनिक हिन्दी में स्पष्ट है और सकारात्मक अर्थ वाले ‘विस्मयकारी’ से बचता है।
- source_word: ዝንቱ፡ መካን
  choice: यह स्थान
  rationale: यह निकट-संकेत वाला सीधा स्थानवाचक पदबंध है और दर्शन में वर्णित भू-दृश्य के अनुकूल है।
- source_word: ወሕሙም
  choice: और ... कष्टदायक
  rationale: यह पीड़ा, दुःख या व्यथा का भाव देता है; ‘कष्टदायक’ गंभीर भाव को रखते हुए साधारण पाठक के लिए सहज है।
- source_word: ለነጽሮ
  choice: देखने में
  rationale: यह दृष्टा के लिए उस स्थान को देखने का अनुभव बताने वाली क्रियारूप रचना है; ‘देखने में’ स्वाभाविक हिन्दी में वही संबंध व्यक्त करता है।
theological_decisions:
- issue: አፎ को शारीरिक अभिव्यक्ति ‘मेरा मुख’ मानें या विस्मयबोधक ‘कितना’
  choice: विस्मयबोधक ‘कितना’
  alternative: ‘मेरे मुख ने कहा’ अथवा केवल ‘मैंने कहा’ के बाद साधारण कथन
  rationale: उपलब्ध संशोधित भाषिक समीक्षा इसे विस्मयबोधक पद मानती है; यह पाठ की सरल वाक्यरचना और भयपूर्ण प्रतिक्रिया दोनों को सुरक्षित रखता है।
- issue: ግሩም का भाव न्याय-संबंधी दर्शन में
  choice: भयानक
  alternative: भयावह; विस्मयकारी
  rationale: प्रसंग आतंक और दंड के स्थान का है। ‘भयानक’ उस नकारात्मक, भयजनक बल को बनाए रखता है, जबकि ‘विस्मयकारी’ आधुनिक हिन्दी में सकारात्मक भी समझा जा सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और दर्शन-साहित्य के अनुकूल रखी गई है। विस्मय व्यक्त करने के लिए स्वाभाविक हिन्दी वाक्यक्रम और विस्मयादिबोधक चिह्न अपनाया गया है; अनावश्यक रूप से प्राचीन या सांप्रदायिक शब्दावली से बचा गया है।
