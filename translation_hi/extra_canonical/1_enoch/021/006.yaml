base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/006.yaml
  text: These are among the stars that transgressed the command of the Lord[a], and they are bound here until ten thousand years are completed[e][d][c][b], the number of the days of their sins.
translation:
  language: hi
  text: ये उन तारों में से हैं[a] जिन्होंने प्रभु की आज्ञा का उल्लंघन किया, और वे यहाँ तब तक बँधे हैं, जब तक दस हज़ार वर्ष पूरे न हो जाएँ[b]—उनके पापों के दिनों की गिनती।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तारों से’। गीज़ का पूर्वसर्ग किसी वर्ग में सम्मिलित होने के साथ-साथ स्रोत का अर्थ भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘दस हज़ार वर्ष’ दंड की एक विशाल, नियत अवधि का संकेत हो सकता है; मुख्य पाठ में गीज़ की संख्या को ज्यों का त्यों रखा गया है।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से, ‘उनके पापों के दिनों की गिनती’। यह वाक्यांश दंड की अवधि को उनके अपराधों के अनुसार मापे जाने की छवि सुरक्षित रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እሉ ውእቶሙ
  choice: ये ... हैं
  rationale: संकेतवाचक सर्वनाम और अस्तित्वसूचक क्रिया को सहज आधुनिक हिन्दी में रखा गया है।
- source_word: እምነ ከዋክብት
  choice: उन तारों में से
  rationale: እምነ के अंशसूचक अर्थ को मुख्य पाठ में व्यक्त करता है, जिससे केवल स्थान का अर्थ न निकले; इसके स्रोतसूचक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: እለ ኃለፉ ትእዛዘ እግዚአብሔር
  choice: जिन्होंने प्रभु की आज्ञा का उल्लंघन किया
  rationale: ኃለፉ का मूल भाव सीमा पार करने का है, पर न्यायिक-नैतिक प्रसंग में ‘उल्लंघन किया’ स्वाभाविक और सटीक है। ‘आज्ञा’ ትእዛዘ का अधिकारपूर्ण स्वर बनाए रखती है।
- source_word: ወተአስሩ በዝየ
  choice: और वे यहाँ ... बँधे हैं
  rationale: बंधन की दंडात्मक और दृश्यात्मक छवि को ‘कैद हैं’ जैसे अधिक व्याख्यात्मक विकल्प के बजाय यथावत रखा गया है।
- source_word: እስከ ሶበ ይትፌጸም ትእልፊተ ዓም
  choice: जब तक दस हज़ार वर्ष पूरे न हो जाएँ
  rationale: समयावधि की समाप्ति अथवा पूर्ति का भाव स्पष्ट है। संख्या को बिना निश्चिततासूचक जोड़ के रखा गया है।
- source_word: ኈልቈ መዋዕለ ኃጢአቶሙ
  choice: उनके पापों के दिनों की गिनती
  rationale: ‘दिनों’ और ‘गिनती’ की प्रलयदर्शी लेखा-छवि को सामान्यीकृत किए बिना सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘तारों’ की पहचान
  choice: मुख्य पाठ में ‘तारों’ की दर्शनात्मक छवि बनाए रखी गई है।
  alternative: इसे सीधे ‘स्वर्गदूतों’ या ‘पहरेदारों’ के रूप में खोलना।
  rationale: प्रसंग में तारे स्वर्गीय प्राणियों का संकेत दे सकते हैं, पर अनुवाद प्रतीक को उसकी व्याख्या से प्रतिस्थापित नहीं करता।
- issue: दस हज़ार वर्षों का आशय
  choice: निर्दिष्ट संख्या ‘दस हज़ार वर्ष’ को शाब्दिक रूप से रखा गया है।
  alternative: इसे केवल ‘एक बहुत लंबी अवधि’ कहना।
  rationale: गीज़ साक्ष्य स्पष्ट संख्यात्मक अवधि देता है; यह विशाल नियत काल का संकेत भी हो सकता है, जिसकी सूचना पादटिप्पणी में दी गई है।
- issue: अंतिम वाक्यांश का संबंध
  choice: ‘उनके पापों के दिनों की गिनती’ को समयावधि के बाद व्याख्यात्मक समानाधिकरण के रूप में रखा गया है।
  alternative: इसे स्पष्ट कारणात्मक कथन बनाना, जैसे ‘उनके पापों के अनुसार ठहराई गई अवधि’।
  rationale: मूल की संक्षिप्तता और यह अस्पष्टता सुरक्षित रहती है कि वाक्यांश समयावधि की पहचान करता है या उसके माप का आधार बताता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध रखी गई है। ‘प्रभु’, ‘आज्ञा का उल्लंघन’ और ‘बँधे हैं’ न्याय और दंड के स्वर को बनाए रखते हैं; दृष्टि-साहित्य की प्रतीकात्मकता को व्याख्यात्मक संप्रदायगत शब्दावली से नहीं बदला गया है।
