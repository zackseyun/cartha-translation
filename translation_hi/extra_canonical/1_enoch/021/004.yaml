base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/004.yaml
  text: At that time I said[a], “For what sin have they been bound[c][b], and for what reason have they been cast here?”
translation:
  language: hi
  text: उस समय मैंने कहा[a], “किस पाप के कारण इन्हें बाँधा गया है, और किस कारण इन्हें यहाँ डाल दिया गया है[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैंने पूछा”; इसके बाद आने वाला सीधा प्रश्न पूछने का भाव प्रकट कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: अन्तिम क्रिया का अर्थ “यहाँ छोड़ दिया गया है” या “यहाँ त्याग दिया गया है” भी हो सकता है; दण्ड के इस प्रसंग में “यहाँ डाल दिया गया है” लिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ውእተ ጊዜ
  choice: उस समय
  rationale: यह गीइज़ का सामान्य कालसूचक पद है। ‘उस समय’ मूल की गरिमापूर्ण कथात्मक शैली को बनाए रखता है और स्रोत में न होने वाला संयोजक नहीं जोड़ता।
- source_word: እቤ
  choice: मैंने कहा
  rationale: यह रूप मुख्यतः वाणी का परिचय देता है। आगे सीधा प्रश्न होने से ‘मैंने पूछा’ स्वाभाविक विकल्प है, पर ‘मैंने कहा’ स्रोत के अधिक निकट है।
- source_word: በእንተ አይ ኃጢአት
  choice: किस पाप के कारण
  rationale: यह पद बन्धन के आधार अथवा कारण को पूछता है। यह हिन्दी में सहज रहते हुए मूल की कारणवाचक शक्ति को स्पष्ट रखता है।
- source_word: ተአስሩ
  choice: इन्हें बाँधा गया है
  rationale: निष्क्रिय क्रिया बाँधे या जकड़े जाने का ठोस अर्थ देती है। ‘बन्दी बनाया’ की अपेक्षा ‘बाँधा’ न्याय-दण्ड की दृश्यात्मकता को अधिक निकटता से सुरक्षित रखता है।
- source_word: ወበእነተ ምንት
  choice: और किस कारण
  rationale: यह दूसरी प्रश्नात्मक कारणवाचक रचना है। ‘और किस कारण’ पहले खण्ड के साथ मूल की समानान्तरता बनाए रखता है।
- source_word: ዝየ
  choice: यहाँ
  rationale: यह उस स्थान की ओर संकेत करने वाला क्रियाविशेषण है जिसे हनोक देख रहा है। ‘यहाँ’ दर्शन की तात्कालिकता बनाए रखता है।
- source_word: ተገደፉ
  choice: इन्हें यहाँ डाल दिया गया है
  rationale: क्रिया में डाल दिए जाने, फेंके जाने अथवा छोड़ दिए जाने का अर्थ हो सकता है। दण्ड के प्रसंग में ‘डाल दिया गया’ स्वाभाविक हिन्दी में बलपूर्वक स्थानान्तरण का भाव रखता है, जबकि विकल्प को पादटिप्पणी में सुरक्षित किया गया है।
theological_decisions:
- issue: वर्णित दण्ड का स्वरूप
  choice: बाँधे जाने और इस स्थान में डाल दिए जाने के ठोस दण्डात्मक चित्र को सुरक्षित रखा गया है।
  alternative: इन्हें बन्दी बनाकर यहाँ छोड़ दिया गया है।
  rationale: दर्शन का प्रसंग प्रत्यक्ष न्याय-दण्ड को चित्रित करता है। अनुवाद इस बिंब को सामान्य अथवा अमूर्त धार्मिक भाषा में नहीं बदलता, और अन्तिम क्रिया की सम्भावित अर्थ-व्याप्ति को पादटिप्पणी में बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और दृश्यात्मक शैली रखी गई है। मूल में आरम्भिक संयोजक न होने के कारण ‘और उस समय’ नहीं जोड़ा गया। सभी वास्तविक शाब्दिक अनिश्चितताएँ पादटिप्पणियों में स्पष्ट की गई हैं।
