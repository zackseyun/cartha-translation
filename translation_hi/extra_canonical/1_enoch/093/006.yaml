base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/006.yaml
  text: And after this[a], in the fourth week, at its completion, visions of the holy and righteous shall be seen[c][b], and a law for generation after generation and an enclosure shall be made for them.
translation:
  language: hi
  text: और इसके बाद, चौथे सप्ताह में, उसके पूरा होने पर, पवित्र और धर्मी लोगों के दर्शन[a] दिखाई देंगे; और पीढ़ी-दर-पीढ़ी के लिए एक व्यवस्था[c] और एक घेरा[b] उनके लिए बनाया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्र जनों और धर्मियों के दर्शन।” सर्वनाश-साहित्य के इस प्रसंग में गीज़ पदबंध संज्ञा के रूप में पढ़ा जा सकता है, और यह पूरी तरह स्पष्ट नहीं है कि इसका संकेत मनुष्यों की ओर है या स्वर्गीय पवित्र जनों की ओर।
    reason: lexical_alternative
  - marker: b
    text: अंतिम संज्ञा का अर्थ कठिन है। वह किसी रोपी हुई, घेरी हुई या उनके लिए तैयार की गई वस्तु का संकेत दे सकती है; इसलिए “बगीचा” या “रोपण” भी संभव अर्थ हैं।
    reason: lexical_alternative
  - marker: c
    text: “व्यवस्था” के लिए “क्रम,” “नियम” या “विधान” भी संभव है। गीज़ में अंत की एक ही क्रिया ‘व्यवस्था’ और ‘घेरा’ दोनों से जुड़ी हुई समझी जा सकती है।
    reason: translation_structure
lexical_decisions:
- source_word: እምድኅረዝ
  choice: इसके बाद
  rationale: यह अगले कालखंड को आरम्भ करने वाला समय-सूचक वाक्यांश है और घटनाक्रम का क्रम बनाए रखता है।
- source_word: ራብዕት ሰንበት
  choice: चौथा सप्ताह
  rationale: ‘सप्ताहों के प्रकाशन’ की क्रमांकित काल-योजना में यह साधारण सब्त-दिन नहीं, बल्कि प्रतीकात्मक सप्ताह अथवा सात का कालखंड है।
- source_word: በተፍጻሜታ
  choice: उसके पूरा होने पर
  rationale: प्रत्यय का संकेत चौथे सप्ताह की ओर है; यह अनुवाद उसकी समाप्ति अथवा पूर्णता, दोनों भावों को स्वाभाविक हिन्दी में रखता है।
- source_word: ራእያተ
  choice: दर्शन
  rationale: सर्वनाश-साहित्य के प्रसंग में यह शब्द दर्शनीय अथवा प्रकाशनात्मक दृश्यों को व्यक्त करता है।
- source_word: ቅዱሳን ወጻድቃን
  choice: पवित्र और धर्मी लोग
  rationale: दोनों विशेषण संज्ञा के रूप में बहुवचन हैं। ‘लोगों’ से हिन्दी वाक्य स्वाभाविक बनता है, जबकि स्वर्गीय प्राणियों की पहचान को अनिवार्य नहीं बनाया गया।
- source_word: ይትረአይ
  choice: दिखाई देंगे
  rationale: गीज़ रूप का निष्क्रिय/आत्मवाचक भाव बना रहता है और यह खुला रहता है कि दर्शन दिए गए हैं या प्रकट हुए हैं।
- source_word: ሥርዐት
  choice: व्यवस्था
  rationale: यह शब्द नियम, विधान या सुव्यवस्थित व्यवस्था सूचित कर सकता है। चौथे सप्ताह और समानांतर प्रसंग में विधिक भाव प्रबल है, पर ‘व्यवस्था’ हिन्दी में उसकी कुछ व्यापकता भी बचाती है।
- source_word: ለትውልደ ትውልድ
  choice: पीढ़ी-दर-पीढ़ी के लिए
  rationale: दोहराया गया शब्द लगातार आने वाली पीढ़ियों का भाव देता है।
- source_word: ዐጸድ
  choice: घेरा
  rationale: यह कठिन संज्ञा किसी घेरी हुई, रोपी हुई या तैयार की गई वस्तु का संकेत दे सकती है। ‘घेरा’ ठोस बिंब को रखता है और ‘बगीचा’ जैसे अधिक निश्चित अर्थ को मुख्य पाठ में नहीं थोपता।
- source_word: ይትገበር ሎሙ
  choice: उनके लिए बनाया जाएगा
  rationale: अंत में आया एकवचन निष्क्रिय क्रिया-रूप समन्वित ‘व्यवस्था’ और ‘घेरा’ दोनों पर शासन करता है; इसलिए क्रिया को दोहराया नहीं गया।
theological_decisions:
- issue: ‘पवित्र और धर्मी’ की पहचान
  choice: मुख्य पाठ में इन्हें पवित्र और धर्मी लोगों के रूप में रखा गया है, बिना उनकी पहचान को किसी विशिष्ट समुदाय तक सीमित किए।
  alternative: इसे स्वर्गीय पवित्र जनों, या स्वर्गीय और मानवीय दोनों समूहों, के रूप में समझा जा सकता है।
  rationale: ऐतिहासिक सप्ताहों का प्रसंग और ‘धर्मी’ का नैतिक पद मानवीय संदर्भ का समर्थन करते हैं, पर सर्वनाश-साहित्य की व्यापकता के कारण पादटिप्पणी में अन्य संभावना खुली रखी गई है।
- issue: ሥርዐት का अर्थ
  choice: व्यवस्था
  alternative: क्रम, नियम या विधान
  rationale: सिनै-संबंधी चौथे सप्ताह और पास के समानांतर प्रयोग से विधिक अर्थ उचित है; फिर भी ‘व्यवस्था’ शब्द इसे केवल किसी संकीर्ण कानूनी संहिता तक सीमित नहीं करता।
- issue: अंतिम क्रिया का संबंध
  choice: एक ही निष्क्रिय क्रिया को ‘व्यवस्था’ और ‘घेरा’ दोनों के साथ जोड़ा गया है।
  alternative: वाक्य को अर्थ की दृष्टि से दो खंडों में पढ़कर प्रत्येक वस्तु के लिए ‘बनाया जाएगा’ समझा जा सकता है।
  rationale: गीज़ पाठ में अंत में केवल एक क्रिया है, इसलिए मुख्य पाठ उसकी साझा व्याकरणिक भूमिका को दर्शाता है।
