base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/003.yaml
  text: And now Enoch began to speak from the books[a], and he said, “I was born the seventh in the first week[d][c][b], while righteousness and justice still endured.”
translation:
  language: hi
  text: और अब हनोक पुस्तकों से[a] बोलने लगा और उसने कहा, “मेरा जन्म पहले सप्ताह[b] में सातवें[c] के रूप में हुआ, जब न्याय[d] और धार्मिकता अभी भी कायम थे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पुस्तकों से” का अर्थ संभवतः यह है कि हनोक लिखित पुस्तकों या अभिलेखों के आधार पर बोल रहा था, न कि केवल तत्काल बोल रहा था।
    reason: cultural_note
  - marker: b
    text: “पहला सप्ताह” यहाँ सात दिनों का साधारण सप्ताह नहीं, बल्कि इस दर्शन में इतिहास का पहला प्रतीकात्मक काल है।
    reason: cross_reference
  - marker: c
    text: “सातवाँ” संभवतः आदम से हनोक तक उसके क्रम की ओर संकेत करता है; मूल में “पीढ़ी” शब्द स्पष्ट रूप से नहीं है।
    reason: clarification
  - marker: d
    text: लिप्यंतरित पाठ में यहाँ का शब्द विकृत दिखाई देता है। मान्य पाठ “न्याय” का समर्थन करता है; “सच्चाई,” “खरापन” या मिलते-जुलते नैतिक अर्थ पुराने विकृत रूप के आधार पर सुझाए गए हैं।
    reason: textual_variant
lexical_decisions:
- source_word: አኀዘ፡ እንከ፡ ይትናገር
  choice: और अब … बोलने लगा
  rationale: आरंभसूचक क्रिया और संक्रमणसूचक अव्यय को स्वाभाविक हिन्दी कथन में रखते हुए मूल की कथा-गति सुरक्षित की गई है।
- source_word: እመጻሕፍት
  choice: पुस्तकों से
  rationale: पूर्वसर्ग सहित बहुवचन संज्ञा कथन के लिखित स्रोत को दर्शाती है; इसे ‘पवित्रशास्त्र’ या ‘अभिलेख’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: ሳብዕ፡ ተወለድኩ
  choice: मैं … सातवाँ जन्मा
  rationale: मूल के क्रमवाचक अंक और जन्म-संबंधी क्रिया को संक्षिप्त रूप में रखा गया है। ‘पीढ़ी’ अर्थ में निहित हो सकती है, पर मूल में स्पष्ट संज्ञा न होने के कारण उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: በቀዳሚት፡ ሰንበት
  choice: पहले सप्ताह में
  rationale: इस खंड की इतिहास-विभाजक प्रतीकात्मक ‘सप्ताह’ संरचना के अनुसार अनुवाद किया गया है; यहाँ शाब्दिक सब्त-दिन अभिप्रेत नहीं है।
- source_word: እስከ፡ አመ
  choice: जब … अब भी
  rationale: ऐतिहासिक संदर्भ में यह पदबंध उस अवधि के दौरान जारी अवस्था को व्यक्त करता है। हिन्दी में ‘जब … अब भी’ भूतकालीन निरंतरता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: 'ኵነኔ (transcription/OCR: ጽጌነ)'
  choice: न्याय
  rationale: प्राप्त लिप्यंतरण का ጽጌነ रूप संभवतः OCR-दोष है; चार्ल्स के पाठ की मान्य रीडिंग ኵነኔ ‘न्याय/न्याय-निर्णय’ है। संदर्भ में ‘न्याय’ सकारात्मक नैतिक गुण के रूप में स्वाभाविक है।
- source_word: ጽድቅ
  choice: धार्मिकता
  rationale: यह इस प्रमुख नैतिक पद का सामान्य और संदर्भानुकूल हिन्दी प्रतिशब्द है; इससे न्याय के साथ मूल का निकटवर्ती नैतिक युग्म बना रहता है।
- source_word: ትዓገሠ
  choice: बनी हुई थी
  rationale: पहले सप्ताह के ऐतिहासिक वर्णन में क्रिया जारी भूतकालीन अवस्था बताती है, भविष्य की नहीं। हिन्दी स्त्रीलिंग एकवचन क्रिया संयुक्त अमूर्त युग्म को समष्टि के रूप में ग्रहण करती है।
theological_decisions:
- issue: ‘पहले सप्ताह’ का आशय
  choice: इतिहास का प्रतीकात्मक सात-खंडीय काल
  alternative: शाब्दिक सात दिन या पहला सब्त-दिन
  rationale: ‘सप्ताहों के प्रकाशन’ की साहित्यिक संरचना ऐतिहासिक कालों को सप्ताह कहती है। मुख्य पाठ मूल रूपक को बनाए रखता है और पादटिप्पणी उसका संकेत देती है।
- issue: अंतिम नैतिक युग्म की पाठगत पहचान
  choice: न्याय और धार्मिकता
  alternative: सच्चाई/खरापन और धार्मिकता; धार्मिकता और न्याय
  rationale: दिए गए लिप्यंतरण में पहला शब्द संदिग्ध है, पर संशोधित स्रोत-साक्ष्य ኵነኔ ‘न्याय’ का समर्थन करता है। स्रोत-क्रम को ‘न्याय और धार्मिकता’ के रूप में रखा गया है और अनिश्चितता पादटिप्पणी में बताई गई है।
- issue: क्रिया का काल
  choice: भूतकाल में जारी अवस्था—‘अब भी बनी हुई थी’
  alternative: भविष्यकाल—‘बनी रहेगी’
  rationale: हनोक अपने जन्म और पहले सप्ताह का पिछला इतिहास सुना रहा है; इसलिए प्रसंगगत काल भूतकालीन निरंतरता का समर्थन करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी और गरिमापूर्ण किंतु सहज कथात्मक शैली अपनाई गई है। ‘हनोक,’ ‘धार्मिकता’ और ‘प्रतीकात्मक सप्ताह’ जैसे पद धार्मिक-साहित्यिक संदर्भ के लिए परिचित हैं। वाक्य को अत्यधिक संस्कृतनिष्ठ नहीं बनाया गया, और पाठगत अनिश्चितता को मुख्य वाक्य में कृत्रिम रूप से सुलझाने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
