base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/008.yaml
  text: And after this[a], in the sixth week, all who are in it will be blind, and the hearts of all of them will forget wisdom. And in it a man will ascend, and at its completion the house of the kingdom will be burned with fire[d][c][b], and in it the whole stock of the chosen root will be scattered.
translation:
  language: hi
  text: और इसके बाद, छठे सप्ताह में, उसमें रहनेवाले सभी अंधे हो जाएँगे[a], और उन सबके हृदय बुद्धि को भूल जाएँगे। उसी सप्ताह में एक मनुष्य ऊपर चढ़ेगा[b], और उसके अंत में राज्य का घर[c] आग से जला दिया जाएगा; और उसी में चुनी हुई जड़ का समूचा वंश[d] तितर-बितर कर दिया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसमें रहनेवाले सभी अंधकारमय हो जाएँगे।” यहाँ अंधापन संभवतः छठे सप्ताह के लोगों की आत्मिक या नैतिक दशा का बिंब है।
    reason: lexical_alternative
  - marker: b
    text: या, “एक मनुष्य उठ खड़ा होगा।” मूल क्रिया ऊपर चढ़ने या उठने—दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: “राज्य का घर” केवल किसी भौतिक भवन को ही नहीं, बल्कि राजकीय व्यवस्था या राजवंश को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: d
    text: “चुनी हुई जड़” में वंश और पौधे के बिंब एक साथ हैं; इसका आशय चुना हुआ वंश या शेष समुदाय हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ሳድስት ሰንበት
  choice: छठा सप्ताह
  rationale: ‘सप्ताहों के प्रकाशन’ के संदर्भ में यह एक प्रतीकात्मक कालखंड है, केवल शाब्दिक सब्त-दिन नहीं। ‘सप्ताह’ इस संरचना को सामान्य हिन्दी में स्पष्ट रखता है।
- source_word: ውስቴታ ጽሉላነ ኵሎሙ
  choice: उसमें रहनेवाले सभी अंधे हो जाएँगे
  rationale: यह वाक्य छठे सप्ताह के लोगों की अंधी अवस्था बताता है। ‘अंधे’ मूल बिंब को बनाए रखता है और उसे केवल ‘अज्ञानी’ कहकर आध्यात्मिक-नैतिक संकेत को संकुचित नहीं करता।
- source_word: ይትረሣዕ ልቦሙ ለኵሎሙ እምጥበብ
  choice: उन सबके हृदय बुद्धि को भूल जाएँगे
  rationale: ‘हृदय’ और ‘बुद्धि को भूलना’ दोनों मूल के ज्ञान-साहित्य संबंधी बिंब को सीधे बनाए रखते हैं।
- source_word: ባቲ የዓርግ ብእሲ
  choice: उसी सप्ताह में एक मनुष्य ऊपर चढ़ेगा
  rationale: क्रिया में ऊपर जाने या चढ़ने का भाव है। ‘ऊपर चढ़ेगा’ इस अस्पष्टता को सुरक्षित रखता है और उसे केवल राजनीतिक उदय या किसी विशिष्ट धार्मिक पहचान तक सीमित नहीं करता।
- source_word: ቤተ መንግሥት
  choice: राज्य का घर
  rationale: यह निकटवर्ती और जानबूझकर खुला अनुवाद है; वाक्यांश राजवंश, राजकीय व्यवस्था या उससे जुड़ी किसी इमारत की ओर संकेत कर सकता है।
- source_word: ይውዒ ... በእሳት
  choice: आग से जला दिया जाएगा
  rationale: यह मूल के अग्नि-दंड के बिंब और कर्मवाच्य अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ኵሉ ዘመደ ሥርወ ኀሩይ
  choice: चुनी हुई जड़ का समूचा वंश
  rationale: ‘वंश’ रिश्तेदारी और कुल की धारणा को, जबकि ‘जड़’ वनस्पतिक रूपक को बनाए रखता है; इस प्रकार मूल की मिश्रित वंशावली-वृक्ष छवि सुरक्षित रहती है।
theological_decisions:
- issue: ऊपर चढ़ने वाले मनुष्य की पहचान
  choice: उसे केवल ‘एक मनुष्य’ कहा गया है और उसकी पहचान नहीं बताई गई
  alternative: कोई ऐतिहासिक शासक, याजकीय व्यक्ति या मसीही/महिमान्वित व्यक्ति
  rationale: गीज़ पाठ इस व्यक्ति का नाम या पद नहीं देता। इसलिए अनुवाद किसी बाद की धार्मिक पहचान को इसमें आरोपित नहीं करता।
- issue: ‘राज्य का घर’ का आशय
  choice: अस्पष्ट पदबंध ‘राज्य का घर’ बनाए रखा गया
  alternative: राजवंश, राजमहल अथवा राज्य से संबद्ध मंदिर
  rationale: मूल पदबंध संस्था, राजकीय कुल या भवन—एक से अधिक अर्थ दे सकता है; किसी एक अर्थ को मुख्य पाठ में निश्चित करना अति-व्याख्या होगा।
- issue: ‘चुनी हुई जड़’ का संदर्भ
  choice: चुनाव और वंश का रूपक बिना किसी विशिष्ट बाद के संदर्भ के सुरक्षित रखा गया
  alternative: चुना हुआ शेष समुदाय, चुना हुआ पौधा/वंश या कोई मसीही जड़
  rationale: पद में चुनाव और वंश दोनों के संकेत हैं, पर यह पद स्वयं किसी एक व्यक्ति या बाद की धर्मवैज्ञानिक पूर्ति की पहचान नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध रूप अपनाया गया है। प्रतीकात्मक ‘सप्ताह’, ‘अंधे’, ‘राज्य का घर’ और ‘चुनी हुई जड़’ जैसे मूल बिंबों को सरल व्याख्यात्मक प्रतिस्थापन से नहीं बदला गया।
