base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/012.yaml
  text: And who is there that can behold heaven? And who is there that can understand the works of heaven? Or see a soul—or[a], if not[e][d][c][b], a spirit—and tell of it? Or else ascend and see all their ends?
translation:
  language: hi
  text: और कौन है जो आकाश को देख सकता है? और कौन है जो आकाश के कार्यों को समझ सकता है, और यह बता सकता है कि प्राण—या, यदि नहीं, तो आत्मा—को कैसे देखा जा सकता है? या फिर ऊपर चढ़कर उनके सभी छोरों[b] को देख सकता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘छोरों’ का अनुवाद अनिश्चित है। मूल शब्द का अधिक शाब्दिक अर्थ ‘पंख’ भी हो सकता है; संदर्भ में ‘सीमाएँ’ या ‘अंतिम छोर’ समझना संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ምነት ውእቱ ዘይክል
  choice: कौन है जो ... सकता है
  rationale: यह किसी मनुष्य की सामर्थ्य को चुनौती देने वाला आलंकारिक प्रश्न है; आधुनिक हिन्दी में यह रूप स्वाभाविक और स्पष्ट है।
- source_word: ነጽሮተ ሰማይ
  choice: आकाश को देख
  rationale: ነጽሮተ को ነጸረ (‘देखना/निहारना’) के क्रियारूप के रूप में लिया गया है। स्रोत में ‘भंडार’ या ‘कोष’ का कोई शब्द नहीं है।
- source_word: አእምሮ ግብረ ሰማይ
  choice: आकाश के कार्यों को समझ
  rationale: ‘समझना’ ज्ञान और बोध का भाव देता है, जबकि ‘आकाश के कार्य’ मूल के ब्रह्मांडीय और कुछ हद तक अस्पष्ट संबंध को बनाए रखता है।
- source_word: ከመ ይርአይ ነፍሰ
  choice: देख सकता है कि प्राण ... कैसा दिखाई देता है
  rationale: ከመ (‘कैसे/किस प्रकार’) और दिखाई देने की क्रिया दोनों को व्यक्त किया गया है; कठिन कथन को किसी व्याख्यात्मक मानवशास्त्रीय निष्कर्ष में नहीं बदला गया।
- source_word: መንፈሰ
  choice: आत्मा
  rationale: यहाँ ነፍሰ से भिन्न शब्द बनाए रखने के लिए ‘प्राण’ और ‘आत्मा’ का युग्म चुना गया है; ‘श्वास’ भी शब्दार्थ की दृष्टि से संभव है।
- source_word: ይክል ነጊረ
  choice: उसके विषय में बता सकता है
  rationale: देखी या समझी गई वस्तु का वर्णन अथवा वृत्तांत देने का अर्थ सहज हिन्दी में व्यक्त होता है।
- source_word: ወእመ አኮ ዐሪገ
  choice: या फिर ऊपर चढ़कर
  rationale: ወእመ አኮ को यहाँ स्थिर मुहावरे ‘या फिर’ के रूप में और ዐሪገ को आरोहण के रूप में समझा गया है; इसे ‘यदि वह ऊपर नहीं चढ़ा’ नहीं बनाया गया।
- source_word: ኵሎ አክናፊሆሙ
  choice: उनके सभी छोरों
  rationale: संदर्भ में समग्र विस्तार की सीमाओं या छोरों को देखने का भाव संभव है। मूल शब्द का अधिक शाब्दिक अर्थ ‘पंख’ भी हो सकता है, इसलिए अनिश्चितता पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: ነፍሰ और መንፈሰ का पारस्परिक संबंध
  choice: दोनों को अलग रखते हुए क्रमशः ‘प्राण’ और ‘आत्मा’ कहा गया है।
  alternative: ‘जीवन’ और ‘श्वास’ कहना, या दोनों को एक ही धारणा मानकर वाक्य को सरल कर देना।
  rationale: मूल दो संबंधित किंतु भिन्न शब्दों को साथ रखता है। अनुवाद इस तनाव को बनाए रखता है और आत्मा-प्राण के संबंध पर कोई संप्रदायगत निष्कर्ष नहीं थोपता।
- issue: कठिन वाक्यांश ‘या, यदि नहीं’
  choice: मुख्य पाठ में इसकी असामान्य शब्दावली को बनाए रखा गया है।
  alternative: इसे केवल ‘या आत्मा’ कहकर सरल कर देना।
  rationale: इस स्थान का गीइज़ वाक्य पाठगत और अर्थगत रूप से कठिन है; स्पष्टता के नाम पर अनिश्चितता हटाना उचित नहीं होगा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। आलंकारिक प्रश्नों की पुनरावृत्ति और दर्शन-संबंधी ब्रह्मांडीय स्वर सुरक्षित हैं। कठिन मध्यवर्ती वाक्य को जानबूझकर पूरी तरह समतल नहीं किया गया है।
