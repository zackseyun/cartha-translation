  yaml_path: translation/extra_canonical/1_enoch/093/005.yaml
  text: And after this[a], in the third week, at its completion, a man shall be chosen as the plant of righteous judgment[c][b], and after him there shall come forth the plant of righteousness forever and ever.
translation:
  language: hi
  text: और इसके बाद, तीसरे सप्ताह[a] की समाप्ति पर, एक मनुष्य[b] धार्मिकता-पूर्ण न्याय के पौधे[c] के रूप में चुना जाएगा; और उसके बाद धार्मिकता का पौधा युगानुयुग उभर आएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह ‘तीसरा सप्ताह’, ‘सप्ताहों के दर्शन’ में आने वाले प्रतीकात्मक कालखंडों के क्रम का भाग है; इसका अर्थ सात दिनों का साधारण सप्ताह नहीं है।
    reason: cultural_note
  - marker: b
    text: पाठ इस चुने हुए ‘मनुष्य’ की पहचान नहीं बताता। व्याख्याकारों ने उसे किसी प्रमुख धर्मी पूर्वज या अगुवे से जोड़ा है, पर इस पद में उसका नाम नहीं दिया गया।
    reason: alternative_reading
  - marker: c
    text: बार-बार आने वाला ‘पौधा’ रूपक किसी धर्मी वंश, वृद्धि या स्थायी समुदाय की ओर संकेत कर सकता है; फिर भी अनुवाद में मूल कृषि-रूपक को बनाए रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ሣልስት ሰንበት
  choice: तीसरा सप्ताह
  rationale: ‘सप्ताहों के दर्शन’ के संदर्भ में यह सात दिनों का साधारण सप्ताह नहीं, बल्कि सात पर आधारित एक प्रतीकात्मक कालखंड है। ‘सप्ताह’ इस साहित्यिक क्रम को बनाए रखता है।
- source_word: በተፍጻሜታ
  choice: के पूरा होने पर
  rationale: प्रत्यय पिछले ‘सप्ताह’ की ओर संकेत करता है। यह सहज हिन्दी में उस प्रतीकात्मक कालखंड की समाप्ति व्यक्त करता है।
- source_word: ይትኃረይ
  choice: चुना जाएगा
  rationale: क्रिया का निष्क्रिय भाव सुरक्षित रहता है और किसी पद पर नियुक्ति का अनावश्यक अर्थ नहीं जुड़ता।
- source_word: ብእሲ
  choice: एक मनुष्य
  rationale: मूल पाठ एक अनाम, एकवचन मानवीय व्यक्ति का संकेत देता है। ‘मनुष्य’ उसकी पहचान के विषय में तटस्थ रहता है।
- source_word: ለተክለ
  choice: पौधे के रूप में
  rationale: रचना कठिन है, पर वनस्पति-संबंधी रूपक स्पष्ट है। ‘पौधा’ इसे वंश, अंकुर या समुदाय जैसे किसी एक अर्थ तक सीमित नहीं करता।
- source_word: ኵነኔ ጽድቅ
  choice: धर्ममय न्याय
  rationale: यह पद न्यायिक निर्णय और नैतिक खराई—दोनों को जोड़ता है। ‘धर्ममय न्याय’ ऊँचे भविष्यदर्शी स्वर में दोनों पहलुओं को बनाए रखता है।
- source_word: ይወፅእ
  choice: निकल आएगा
  rationale: मूल क्रिया का अर्थ ‘बाहर आना/निकलना’ है। पौधे के रूपक के साथ ‘निकल आएगा’ स्वाभाविक है और ‘उगना’ जैसी अतिरिक्त व्याख्या से बचता है।
- source_word: ለተክለ ጽድቅ
  choice: धार्मिकता का पौधा
  rationale: संबंधकारक रचना और ठोस वनस्पति-रूपक दोनों सुरक्षित रहते हैं; इसे वंश, संतान या समुदाय के रूप में व्याख्यायित नहीं किया गया।
- source_word: ለዓለመ ዓለም
  choice: युगानुयुग
  rationale: दोहराया हुआ ‘युग’ अनंत स्थायित्व का मुहावरा है। ‘युगानुयुग’ संक्षिप्त, प्रतिष्ठित और स्वाभाविक हिन्दी समतुल्य है।
theological_decisions:
- issue: तीसरे सप्ताह के अंत में चुने जाने वाले एकवचन ‘मनुष्य’ की पहचान
  choice: मुख्य पाठ में उसे अनाम ‘एक मनुष्य’ रखा गया है।
  alternative: हनोक, नूह, अब्राहम, अथवा किसी धर्मी अगुवे का प्रतिनिधि
  rationale: पद स्वयं उस व्यक्ति का नाम नहीं बताता। किसी विशेष पहचान को अनुवाद में जोड़ना मूल की वास्तविक अस्पष्टता को मिटा देता।
- issue: पौधे के रूपक का आशय
  choice: दोनों वाक्यांशों में वनस्पति-संबंधी ‘पौधा’ रूपक बनाए रखा गया है।
  alternative: वंश, जड़, संतान, अथवा समुदाय
  rationale: गीज़ पाठ स्पष्ट रूप से वनस्पति की छवि इस्तेमाल करता है। अधिक अमूर्त शब्द यह समयपूर्व निर्धारित कर देते कि संकेत किसी व्यक्ति, वंश या स्थायी समुदाय की ओर है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यदर्शी शैली रखी गई है। वाक्य को सामान्य पाठक के लिए सहज बनाया गया है, जबकि ‘सप्ताह’, ‘चुना जाएगा’, ‘पौधा’ और ‘युगानुयुग’ जैसे मूल बिंब और काल-संकेत सुरक्षित हैं। ‘धर्ममय न्याय’ तथा ‘धार्मिकता’ में भेद रखकर पहले पद के न्यायिक-नैतिक संयोग और दूसरे पद के व्यापक गुणात्मक अर्थ को व्यक्त किया गया है।
