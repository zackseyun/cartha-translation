base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/002.yaml
  text: And Enoch said[a], “Concerning the children of righteousness, and concerning the chosen of the world, and concerning the plant of uprightness, I will speak to you and make known to you, my children—I, Enoch—what was shown to me from a vision of heaven, and what I learned from the words of the holy angels[e][d][c][b], and understood from the tablets of heaven.”
translation:
  language: hi
  text: और हनोक ने कहा, “धार्मिकता की संतानों के विषय में, संसार के चुने हुओं[a] के विषय में और सत्यनिष्ठा के पौधे के विषय में मैं तुमसे कहूँगा और तुम्हें बताऊँगा, हे मेरे बच्चो—मैं, हनोक—वह जो मुझे स्वर्ग के एक दर्शन से दिखाया गया, जो मैंने पवित्र स्वर्गदूतों के वचन से जाना[c], और जो स्वर्ग की पट्टियों से समझा[d]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “युग के चुने हुए”; ዓለም का अर्थ ‘संसार’ के साथ-साथ ‘युग’ या ‘विश्व-व्यवस्था’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “वचन” के स्थान पर “वाणी” भी सम्भव है; मूल शब्द यहाँ एकवचन में है।
    reason: lexical_alternative
  - marker: d
    text: “स्वर्ग की पट्टियाँ” स्वर्गीय अभिलेखों का हनोक-साहित्य में प्रचलित बिंब है; पदबंध का व्यापक अर्थ “स्वर्ग का लेख” या “स्वर्ग की पुस्तकें” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ውሉደ፡ ጽድቅ
  choice: धार्मिकता की संतान
  rationale: समूह को केवल ‘धर्मी लोग’ कह देने के बजाय मूल के संतान-संबंधी रूपक और संबंधकारक संरचना को बनाए रखता है। ‘संतान’ लिंग-समावेशी और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ኅሩያነ፡ ዓለም
  choice: संसार के चुने हुए
  rationale: ‘चुने हुए’ सामान्य पाठक के लिए स्पष्ट है और ዓለም के प्राथमिक ‘संसार’ अर्थ को मुख्य पाठ में सुरक्षित रखता है; ‘युग’ की सम्भावना पादटिप्पणी में दी गई है।
- source_word: ተክለ፡ ርትዕ
  choice: खराई का पौधा
  rationale: वनस्पति-सम्बन्धी सर्वनाशात्मक बिंब को सुरक्षित रखता है। ‘खराई’ सीधेपन, निष्कपटता और सही आचरण की अर्थ-छाया देता है, बिना इसे पहले पद की ‘धार्मिकता’ में मिला देने के।
- source_word: እሎንተ፡ እብለክሙ፡ ወአየድዐክሙ
  choice: मैं तुमसे कहूँगा और तुम्हें इन बातों से अवगत कराऊँगा
  rationale: दोनों क्रियाओं—कहने और ज्ञान कराने—को अलग रखता है तथा प्रकाशनात्मक आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ደቂቅየ
  choice: हे मेरे बच्चो
  rationale: प्रत्यक्ष सम्बोधन और पारिवारिक भाषा दोनों को बनाए रखता है; आधुनिक हिन्दी में ‘मेरे पुत्रो’ से अधिक समावेशी है।
- source_word: በዘ፡ አስተርአየኒ፡ እምራእየ፡ ሰማይ
  choice: उसके अनुसार जो स्वर्ग के एक दर्शन से मुझे दिखाया गया
  rationale: በዘ को आधार/अनुरूपता के रूप में और እም को ‘से’ के रूप में व्यक्त करता है। इस प्रकार प्रकाशन दर्शन ‘में’ नहीं, दर्शन ‘से’ प्राप्त होता है।
- source_word: እምቃለ፡ ቅዱሳን፡ መላእክት፡ አእመርኩ
  choice: जो मैंने पवित्र स्वर्गदूतों के वचन से जाना
  rationale: ቃለ के एकवचन रूप को ‘वचन’ से सुरक्षित रखा गया है; ‘वाणी’ भी सम्भव है।
- source_word: እምነ፡ ጸፍጸፈ፡ ሰማይ፡ ለበውኩ
  choice: स्वर्ग की पट्टियों से समझा
  rationale: हनोक-साहित्य में स्वर्गीय अभिलेखों के ठोस बिंब को बनाए रखता है; इसे सामान्यीकृत करके केवल ‘पुस्तकें’ नहीं किया गया।
theological_decisions:
- issue: पद में नामित समूहों की पहचान
  choice: ‘धार्मिकता की संतान,’ ‘संसार के चुने हुए’ और ‘खराई का पौधा’ को अलग-अलग पदबंधों के रूप में रखा गया है।
  alternative: इन तीनों को एक ही धर्मी समुदाय के काव्यात्मक पर्याय मानकर एकीकृत करना।
  rationale: मूल पाठ इन पदबंधों को साथ रखता है, पर यह स्पष्ट नहीं करता कि वे पूर्णतः एक ही समूह हैं या परस्पर सम्बद्ध अलग अभिधान। अनुवाद इस तनाव को खुला रखता है।
- issue: ኅሩያነ፡ ዓለም में ዓለም का आशय
  choice: संसार के चुने हुए
  alternative: युग के चुने हुए
  rationale: मुख्य पाठ में सामान्य और सीधा अर्थ रखा गया है, जबकि समय-विशेष या विश्व-व्यवस्था की सम्भावित अर्थ-छाया पादटिप्पणी में सुरक्षित है।
- issue: स्वर्गदूतों से प्राप्त प्रकाशन का रूप
  choice: पवित्र स्वर्गदूतों के ‘वचन’ से जाना
  alternative: पवित्र स्वर्गदूतों की ‘वाणी’ से जाना
  rationale: मूल का एकवचन बनाए रखते हुए यह निर्धारित नहीं किया गया कि आशय किसी एक संदेश, सामूहिक कथन या सुनाई गई वाणी से है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, पठनीय रूप अपनाया गया है। ‘धार्मिकता,’ ‘दर्शन,’ ‘पवित्र स्वर्गदूत’ और ‘स्वर्ग की पट्टियाँ’ जैसे शब्द सर्वनाशात्मक साहित्य की ऊँची शैली बनाए रखते हैं, जबकि वाक्य-संरचना सामान्य पाठक के लिए स्पष्ट रखी गई है।
