base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/009.yaml
  text: And after this[a], in the seventh week, an apostate generation will arise, and many will be its deeds[b], and all its deeds will be apostasy.
translation:
  language: hi
  text: और इसके बाद, सातवें सप्ताह[a] में, एक धर्मत्यागी पीढ़ी उठ खड़ी होगी। उसके बहुत-से काम होंगे, और उसके सभी काम धर्मत्याग ही होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘सातवाँ सब्त/सप्ताह।’ इस खंड में यह शब्द ऐतिहासिक दर्शन के प्रतीकात्मक सप्ताह-काल को दर्शाता है, किसी एक दिन को नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: ሳብዕት ሰንበት
  choice: सातवाँ सप्ताह
  rationale: इस ‘सप्ताहों के दर्शन’ में यह पद विश्व-इतिहास के प्रतीकात्मक सात-खंडीय काल को सूचित करता है, किसी एक शाब्दिक सब्त-दिन को नहीं।
- source_word: ትትነሣእ
  choice: उठ खड़ी होगी
  rationale: क्रिया के प्रकट होने या उठने के भाव को रखते हुए यह पीढ़ी के साथ स्वाभाविक हिन्दी है।
- source_word: ትውልድ
  choice: पीढ़ी
  rationale: यहाँ शब्द ऐतिहासिक क्रम के भीतर एक युग के लोगों के समूह को दर्शाता है; ‘पीढ़ी’ इसका स्पष्ट और स्वाभाविक रूप है।
- source_word: ዕሉት
  choice: धर्मत्यागी
  rationale: शब्द सही मार्ग से भटकने, विमुख होने या विद्रोह करने का भाव रखता है। ‘धर्मत्यागी’ उसके धार्मिक-नैतिक बल को सुरक्षित रखता है।
- source_word: ብዙኅ
  choice: बहुत होंगे
  rationale: यह आगे आने वाले ‘कामों’ की बहुलता बताता है; विधेयात्मक हिन्दी रूप मूल बल को सहजता से व्यक्त करता है।
- source_word: ምግባራቲሃ
  choice: उसके काम
  rationale: शब्द कार्यों या आचरणों को सूचित करता है। ‘काम’ सामान्य पाठक के लिए सहज है और न्याय-संबंधी नैतिक संदर्भ भी बनाए रखता है।
- source_word: ዕልወት
  choice: धर्मत्याग
  rationale: यह भाववाचक संज्ञा ዕሉት के साथ शब्दगत संबंध रखती है। ‘धर्मत्यागी’ और ‘धर्मत्याग’ का युग्म उस संबंध तथा धार्मिक विमुखता के अर्थ को बनाए रखता है।
theological_decisions:
- issue: पीढ़ी के चरित्र को सामान्य नैतिक बुराई के रूप में व्यक्त किया जाए या धार्मिक विमुखता के रूप में
  choice: धर्मत्यागी पीढ़ी … उसके सारे काम धर्मत्याग होंगे
  alternative: भ्रष्ट पीढ़ी … उसके सारे काम भ्रष्टता होंगे; विद्रोही पीढ़ी … उसके सारे काम विद्रोह होंगे
  rationale: ዕሉት और ዕልወት का युग्म केवल सामान्य दुष्टता से अधिक, सही धार्मिक मार्ग से विचलन या विमुखता की ओर संकेत करता है। चुना हुआ रूप इस तीखे अर्थ और दोनों शब्दों के आपसी संबंध को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप रखा गया है। वाक्य-विभाजन से लंबी समन्वित रचना स्पष्ट होती है। ‘पीढ़ी,’ ‘काम’ और ‘उठ खड़ी होगी’ सामान्य पाठकों के लिए स्वाभाविक हैं; ‘धर्मत्यागी/धर्मत्याग’ मूल के धार्मिक-नैतिक तनाव और शब्दगत पुनरावृत्ति को सुरक्षित रखते हैं।
