  yaml_path: translation/extra_canonical/1_enoch/093/010.yaml
  text: And at its completion the chosen righteous ones will be selected from the eternal plant of righteousness[c][b][a], and to them will be given the sevenfold instruction concerning all his creation.
translation:
  language: hi
  text: और उसके पूरा होने पर धार्मिकता के अनन्त पौधे में से चुने हुए धर्मी जन चुन लिए जाएँगे, और उन्हें उसकी सारी सृष्टि के विषय में सातगुनी शिक्षा[a] दी जाएगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सात शिक्षाएँ,” अथवा “सात प्रकार की शिक्षा।” गीज़ का यह पदबंध कठिन है; संख्या शिक्षा के सात प्रकारों/भागों या उसकी सातगुनी पूर्णता को बता सकती है।
    reason: lexical_alternative
  - marker: b
    text: “धार्मिकता का पौधा” मूल की कृषि-संबंधी छवि को बनाए रखता है। पदबंध का अनुवाद “अनन्त धार्मिकता का पौधा” भी हो सकता है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: በተፍጻሜታ
  choice: उसके पूरा होने पर
  rationale: यह पदबंध पिछले कालखंड या ‘सप्ताह’ की समाप्ति बताता है; सर्वनाम का पूर्वपद खुला रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: ይትኃረዩ
  choice: चुन लिए जाएँगे
  rationale: निष्क्रिय भाव ‘चुने/अलग किए जाने’ का है। पास के ኅሩያን को ‘चुने हुए’ रखने से मूल की चुनाव-संबंधी पुनरुक्ति हिन्दी में भी दिखाई देती है।
- source_word: ኅሩያን ጻድቃን
  choice: चुने हुए धर्मी जन
  rationale: दोनों विशेषण सुरक्षित रखे गए हैं, ताकि चुनाव और धार्मिकता के अलग किंतु जुड़े हुए भाव बने रहें।
- source_word: እምተክለ ጽድቅ ዘለዓለም
  choice: अनन्तकाल के धार्मिकता के पौधे में से
  rationale: ‘पौधा’ मूल की कृषि-संबंधी सर्वनाश-दर्शी छवि को बनाए रखता है। संबंधवाचक संरचना में कुछ अस्पष्टता है; मुख्य पाठ ‘अनन्त पौधा’ के अर्थ को प्राथमिकता देता है।
- source_word: ይትወሀብ ሎሙ
  choice: उन्हें ... दी जाएगी
  rationale: गीज़ की निष्क्रिय भविष्यकालीन रचना और प्राप्तकर्ताओं पर बल को स्वाभाविक हिन्दी में रखा गया है।
- source_word: ሰብዓቱ መክዕቢተ ትምህርት
  choice: सात प्रकार की शिक्षा
  rationale: कठिन पदबंध में सात भागों/प्रकारों वाली शिक्षा का संभावित अर्थ स्पष्ट होता है; अन्य सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: በኵሉ ፍጥረት ዚአሁ
  choice: उसकी सारी सृष्टि के विषय में
  rationale: यह शिक्षा के विषय या विस्तार को बताता है; सामूहिक अर्थ के लिए ‘सृष्टि’ उपयुक्त है।
theological_decisions:
- issue: न्याय और पुनर्स्थापना के प्रसंग में चुनाव की भाषा
  choice: चुने हुए धर्मी जन ... चुन लिए जाएँगे
  alternative: धर्मी चुने हुए जन ... अलग किए जाएँगे
  rationale: मूल में विशेषण और क्रिया दोनों चुनाव का भाव रखते हैं। पुनरुक्ति को पूरी तरह हटाने के बजाय सुरक्षित रखा गया है, बिना बाद के पूर्वनियति-विवादों को आरोपित किए।
- issue: धर्मी समुदाय के स्रोत की कृषि-छवि
  choice: धार्मिकता का पौधा
  alternative: धार्मिकता का रोपण
  rationale: ठोस कृषि-रूपक को ‘समुदाय’ या ‘नींव’ जैसी अमूर्त व्याख्या में नहीं बदला गया।
- issue: सात और शिक्षा के बीच कठिन संबंध
  choice: सात प्रकार की शिक्षा
  alternative: सात गुनी शिक्षा
  rationale: मुख्य पाठ एक सम्भव व्याकरणिक अर्थ देता है, पर पाठ की अनिश्चितता पादटिप्पणी में स्पष्ट रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, सर्वनाश-दर्शी शैली रखी गई है। ‘धर्मी जन,’ ‘सृष्टि,’ और ‘धार्मिकता का पौधा’ जैसे पद साधारण पाठक के लिए समझने योग्य रहते हुए मूल की धार्मिक तथा रूपकात्मक भाषा बचाते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
