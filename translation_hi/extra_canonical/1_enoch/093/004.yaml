  choice: उठ खड़ी होगी
  rationale: मूल क्रिया का अर्थ ‘खड़ा होना’ या ‘उठना’ है; ऐतिहासिक कालखंड में बुराई के प्रकट होने को व्यक्त करने के लिए यह स्वाभाविक और सजीव हिन्दी है।
- source_word: በካልእት ሰንበት
  choice: दूसरे सप्ताह में
  rationale: ‘सप्ताह’ की प्रतीकात्मक संरचना को यथावत रखा गया है; इसे सामान्य सात दिनों की अवधि बनाकर नहीं समझाया गया।
- source_word: ዐቢይ እኩይ
  choice: बड़ी बुराई
  rationale: मूल के तीखे नैतिक और प्रलयदर्शी स्वर को सीधे रूप में बनाए रखता है।
- source_word: ትሕሱት
  choice: छल
  rationale: यह शब्द झूठ, धोखे और कपट के व्यापक भाव को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: በቀለት
  choice: अंकुरित होगा
  rationale: मूल क्रिया में उगने या फूट निकलने का जैविक रूपक है, जिसे ‘अंकुरित होगा’ सुरक्षित रखता है।
- source_word: ቀዳሚት ፍጻሜ
  choice: पहला अंत
  rationale: प्रलयदर्शी काल-विभाजन के अस्पष्ट किन्तु महत्त्वपूर्ण पड़ाव को व्याख्यात्मक विस्तार दिए बिना औपचारिक रूप से सुरक्षित रखा गया है।
- source_word: ይድኅን ብእሲ
  choice: एक मनुष्य बचाया जाएगा
  rationale: एकवचन ‘मनुष्य’ को सुरक्षित रखते हुए उद्धार या संकट से रक्षा का निष्क्रिय भाव व्यक्त किया गया है।
- source_word: ትእህቱ ዓመፃ
  choice: अधर्म बढ़ेगा
  rationale: पाठगत कठिनाई के बीच यह व्यापक नैतिक अव्यवस्था के बढ़ने का अर्थ देता है और इसे केवल हिंसा या विद्रोह तक सीमित नहीं करता।
- source_word: ሥርዐት
  choice: एक व्यवस्था
  rationale: मूल संज्ञा व्यवस्था, नियम या विधान का अर्थ दे सकती है। ‘व्यवस्था’ इस अर्थ-सीमा को ‘कानून’ की अपेक्षा अधिक खुला रखती है।
- source_word: ይትገበር ለኃጥኣን
  choice: पापियों के लिए एक व्यवस्था बनाई जाएगी
  rationale: निष्क्रिय भाव और ‘पापियों के लिए’ के संबंध को निकटता से सुरक्षित रखा गया है; दंडात्मक अर्थ को मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं किया गया।
theological_decisions:
- issue: बचाए जाने वाले एकवचन व्यक्ति की पहचान
  choice: मुख्य पाठ में ‘एक मनुष्य’ रखा गया और उसका नाम नहीं बताया गया।
  alternative: इसे नूह के स्पष्ट उल्लेख के रूप में अनूदित करना, या एकवचन को सामूहिक ‘मानवजाति’ बनाना।
  rationale: वृहत्तर प्रसंग नूह की ओर संकेत कर सकता है, पर इस पद में नाम नहीं है। अतः मूल का एकवचन और उसका संयम दोनों सुरक्षित रखे गए हैं।
- issue: पापियों के लिए बनाई जाने वाली व्यवस्था का आशय
  choice: ‘पापियों के लिए एक व्यवस्था बनाई जाएगी’ के रूप में संबंध को खुला रखा गया।
  alternative: ‘पापियों के विरुद्ध विधान बनाया जाएगा’ या ‘पापियों के लिए दंड ठहराया जाएगा।’
  rationale: मूल वाक्यांश पापियों के लिए, उनके विषय में, या संभवतः उनके विरुद्ध व्यवस्था का संकेत दे सकता है। मुख्य पाठ इसे दंड-विधान में बदलकर तनाव का समाधान नहीं करता।
- issue: ‘पहला अंत’ का स्वरूप
  choice: अस्पष्ट प्रलयदर्शी अभिव्यक्ति ‘पहला अंत’ को ज्यों का त्यों रखा गया।
  alternative: ‘पहली पूर्णता’ या ‘पहला महासमापन।’
  rationale: मूल किसी कालखंडीय समाप्ति या पूर्णता की ओर संकेत करता है, पर उसका सटीक धर्मवैचारिक स्वरूप इस पद में स्पष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। प्रलयदर्शी शब्दावली—‘दूसरा सप्ताह’ और ‘पहला अंत’—को सरल व्याख्या से बदलने के बजाय सुरक्षित रखा गया है। वाक्य-संरचना स्रोत के क्रम का अनुसरण करती है, पर हिन्दी प्रवाह के लिए अनावश्यक पुनरावृत्ति सीमित की गई है।
