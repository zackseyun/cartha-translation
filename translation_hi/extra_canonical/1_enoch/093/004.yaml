base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/004.yaml
  text: And after me[a], in the second week, great evil shall arise, and deceit shall spring up in it. And in it there shall be the first end, and in it a man shall be saved; and after it has been completed, unrighteousness shall grow[d][c][b], and a law shall be made for the sinners.
translation:
  language: hi
  text: और मेरे बाद, दूसरे सप्ताह[a] में, बड़ी बुराई उठ खड़ी होगी, और उसमें छल पनपेगा। उसी में पहला अंत होगा, और उसी में एक मनुष्य बचाया जाएगा[b]। और उस सप्ताह के पूरा हो जाने के बाद अधर्म बढ़ेगा, और पापियों के लिए एक विधान बनाया जाएगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह ‘दूसरा सप्ताह’ हनोक के इतिहास-वर्णन में प्रयुक्त प्रतीकात्मक सप्ताह-क्रम का भाग है; इसका अर्थ अनिवार्य रूप से सात दिनों का सामान्य सप्ताह नहीं है।
    reason: cultural_note
  - marker: b
    text: मूल पाठ में ‘एक मनुष्य’ एकवचन में है। बहुत-से पाठक इसे नूह की ओर संकेत मानते हैं, पर इस पद में उसका नाम नहीं दिया गया।
    reason: cross_reference
  - marker: c
    text: इसका अनुवाद ‘पापियों के विषय में एक विधान बनाया जाएगा’ या ‘पापियों के विरुद्ध एक नियम ठहराया जाएगा’ भी हो सकता है। मूल वाक्यांश संबंध की दिशा को पूरी तरह स्पष्ट नहीं करता।
    reason: lexical_alternative
