base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/011.yaml
  text: For who among all the children of men is able to hear the voice of the Holy One and not be shaken? And who is able to comprehend his thoughts? And who is able to look upon all the works of heaven?[a][b][c]
translation:
  language: hi
  text: क्योंकि मनुष्यों की सब संतानों में कौन है जो पवित्र प्रभु की वाणी[a] सुन सके और विचलित न हो? और कौन उसके विचारों को समझ सके?[b] और कौन आकाश के सारे कार्यों को देख सके?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्र प्रभु का वचन” अथवा “उसका कथन”; गीइज़ शब्द का अर्थ वाणी, वचन या उच्चरित कथन हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'अधिक शब्दशः: “उसके विचारों को सोच सके।”'
    reason: lexical_alternative
  - marker: c
    text: “आकाश के कार्य” से आकाश की गतिविधियाँ, संरचनाएँ और सुव्यवस्थित घटनाएँ व्यापक रूप से अभिप्रेत हो सकती हैं, न कि केवल दिखाई देने वाली वस्तुएँ।
    reason: cultural_note
lexical_decisions:
- source_word: እስመ
  choice: क्योंकि
  rationale: यह पद पिछले कथन का आधार प्रस्तुत करता है; ‘क्योंकि’ उसके व्याख्यात्मक संबंध और आलंकारिक बल को बनाए रखता है।
- source_word: ውሉደ ሰብእ
  choice: मनुष्यों की सारी संतानें
  rationale: मूल के सामी मुहावरे ‘मनुष्यों की संतानें’ को बनाए रखते हुए यह समस्त मानवजाति की ओर संकेत करता है। पद में विभक्ति के अनुसार इसे ‘मनुष्यों की सारी संतानों में’ किया गया है।
- source_word: ሰሚዐ ቃሉ ለቅዱስ
  choice: पवित्र जन की वाणी सुनना
  rationale: ቃል का अर्थ वाणी, वचन या कथन हो सकता है; ‘सुनना’ के साथ ‘वाणी’ स्वाभाविक है। ‘पवित्र जन’ को दिव्य उपाधि के रूप में रखा गया है, बिना किसी बाद की धर्मसैद्धांतिक पहचान को आरोपित किए।
- source_word: ወኢይትሀወክ
  choice: और विचलित न हो
  rationale: यह भीतर से हिल जाने, व्याकुल होने या अस्थिर हो जाने का भाव देता है; ‘विचलित’ आधुनिक और गरिमापूर्ण हिन्दी में इस व्यापकता को बनाए रखता है।
- source_word: ከመ የሐሊ ኅሊናሁ
  choice: उसके विचारों को समझ सके
  rationale: क्रिया और संज्ञा विचार/मनन के एक ही अर्थ-क्षेत्र से हैं। मुख्य पाठ इसे पवित्र जन के विचारों को ग्रहण या समझ पाने की मानवीय क्षमता के प्रश्न के रूप में प्रस्तुत करता है; व्याकरणगत वैकल्पिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ነጽሮተ
  choice: देख सके
  rationale: यह ध्यान से देखने या निहारने का अर्थ दे सकता है; ‘देख सके’ आज की हिन्दी में सहज है और क्षमता पर बल देने वाली आवृत्ति को बनाए रखता है।
- source_word: ምግባረ ሰማይ
  choice: आकाश के सारे कार्य
  rationale: ምግባር कार्य, कृत्य, व्यवस्था या कार्यकलाप को व्यक्त कर सकता है। ‘कार्य’ मूल की व्यापकता को बनाए रखता है और इसे केवल दृश्य पिंडों तक सीमित नहीं करता।
theological_decisions:
- issue: ለቅዱስ को दिव्य उपाधि के रूप में प्रस्तुत करना
  choice: पवित्र जन
  alternative: पवित्र परमेश्वर; वह पवित्र
  rationale: संदर्भ में वह पारलौकिक वक्ता है जिसकी वाणी मनुष्य को विचलित करती है। ‘पवित्र जन’ उपाधि का भाव रखता है, पर मूल में न आए ‘परमेश्वर’ शब्द को सीधे पाठ में नहीं जोड़ता।
- issue: ኅሊናሁ में तृतीय पुरुष प्रत्यय का संदर्भ
  choice: उसके विचारों—अर्थात पवित्र जन के विचारों—को समझना
  alternative: अपने मन में विचार कर पाना; उसके विचारों को सोचना
  rationale: प्रत्यय को पिछले खंड के ‘पवित्र जन’ से जोड़ने पर वाणी, विचार और आकाशीय कार्यों की समानांतर रचना उभरती है। फिर भी वाक्यांश की संरचना और अर्थ-व्याप्ति दूसरी समझ की गुंजाइश देती है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, आलंकारिक और सामान्य पाठक के लिए सुबोध शैली रखी गई है। तीन बार आने वाले ‘कौन ... सके’ से मूल की प्रश्नात्मक समानांतरता सुरक्षित है। ‘पवित्र जन’ और ‘मनुष्यों की संतानें’ जैसे पदबंध अपोकैलिप्टिक ऊँचाई बनाए रखते हैं, पर भाषा को अत्यधिक संस्कृतनिष्ठ नहीं बनाते।
