base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/007.yaml
  text: And after this[a], in the fifth week, at its completion[b], the house of glory and kingship shall be built forever.
translation:
  language: hi
  text: इसके बाद, पाँचवें सप्ताह[a] के पूरा होने पर, महिमा और राजसत्ता का भवन[b] सदा के लिए बनाया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सप्ताहों के दर्शन’ में ‘सप्ताह’ इतिहास के एक प्रतीकात्मक कालखंड को दर्शाता है; यह आवश्यक नहीं कि सात दिनों का वास्तविक सप्ताह हो।
    reason: cultural_note
  - marker: b
    text: 'इसे इस प्रकार भी समझा जा सकता है: ‘महिमा का भवन और राज्य सदा के लिए बनाए जाएँगे,’ यदि መንግሥት (‘राज्य’) को भवन का वर्णन करने वाले दूसरे संबंधकारक के बजाय एक अलग समन्वित तत्व माना जाए।'
    reason: alternative_reading
lexical_decisions:
- source_word: እምድኅረዝ
  choice: इसके बाद
  rationale: यह कालक्रम में अगले चरण का परिचय देने वाला स्वाभाविक आधुनिक हिन्दी संक्रमण है।
- source_word: ኃምስ ሰንበት
  choice: पाँचवाँ सप्ताह
  rationale: ‘सप्ताहों के दर्शन’ में यह एक प्रतीकात्मक सातक-काल है; ‘सप्ताह’ रचना की मूल योजना को स्पष्ट और सहज रूप में बनाए रखता है।
- source_word: በተፍጻሜታ
  choice: के पूरा होने पर
  rationale: स्त्रीलिंगी प्रत्यय पूर्ववर्ती ‘सप्ताह’ की ओर संकेत करता है और उसके अंत अथवा पूर्णता तक पहुँचने का भाव देता है।
- source_word: ቤተ ስብሐት
  choice: महिमा का भवन
  rationale: ቤት का ठोस अर्थ ‘भवन/घर’ और ስብሐት का अर्थ यहाँ पवित्र ‘महिमा’ है; ‘भवन’ मंदिर-सदृश चित्र को बिना स्पष्टतः ‘मंदिर’ जोड़ने के सुरक्षित रखता है।
- source_word: መንግሥት
  choice: राजसत्ता
  rationale: यह शब्द राज्य, राजत्व या प्रभुत्व का अर्थ दे सकता है। ‘राजसत्ता’ भवन से जुड़ी राजकीय प्रभुता को व्यक्त करता है और अनिवार्यतः किसी भू-राज्य का अर्थ नहीं थोपता।
- source_word: ይትሐነጽ
  choice: बनाया जाएगा
  rationale: भवन के साथ क्रिया का निष्क्रिय निर्माणार्थ सबसे स्वाभाविक है और मूल के ठोस स्थापत्य-बिंब को बनाए रखता है।
- source_word: እስከ ለዓለም
  choice: सदा के लिए
  rationale: यह स्थायी, अनंत काल तक बने रहने का प्रचलित मुहावरा है; हिन्दी में ‘सदा के लिए’ स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: क्या पद एक ऐसे भवन की बात करता है जो महिमा और राजसत्ता दोनों से संबद्ध है, या ‘महिमा का भवन’ और ‘राज्य’ दो समन्वित तत्व हैं?
  choice: महिमा और राजसत्ता का एक भवन
  alternative: महिमा का भवन और राज्य—दोनों—सदा के लिए बनाए जाएँगे
  rationale: गीज़ वाक्य-विन्यास में ቤተ के बाद ስብሐት और መንግሥት को समन्वित संबंधकारक संज्ञाओं के रूप में लेना अधिक स्वाभाविक है। फिर भी दूसरी संरचना व्याकरणतः संभव होने के कारण उसे पादटिप्पणी में सुरक्षित रखा गया है। इससे भवन का पवित्र और राजकीय दोनों आयाम बने रहते हैं, पर उसे स्पष्टतः केवल मंदिर या केवल राजनीतिक राज्य नहीं कहा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सर्वसुलभ रूप अपनाया गया है। ‘भवन’ मूल स्थापत्य-बिंब को बनाए रखता है, जबकि ‘राजसत्ता’ राजकीय अर्थ को व्यक्त करते हुए किसी विशिष्ट राजनीतिक या सांप्रदायिक व्याख्या को नहीं थोपता। पादटिप्पणी-चिह्न अर्थ से संबद्ध पदों पर लगाए गए हैं।
