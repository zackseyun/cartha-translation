  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘देह गल गई’ और ‘सामर्थ्य की आत्मा में’ जैसे रूप प्रलयदर्शी काव्यात्मकता तथा मूल की वास्तविक अस्पष्टता को सुरक्षित रखते हैं। पाठगत अंतराल का चिह्न मुख्य पाठ में रखा गया है और सभी पादटिप्पणी-चिह्न संबंधित शब्दों या अंतराल के तुरंत बाद दिए गए हैं।
