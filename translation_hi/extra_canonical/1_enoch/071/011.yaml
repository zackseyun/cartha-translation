  yaml_path: translation/extra_canonical/1_enoch/071/011.yaml
  text: And I fell on my face[a], and all my flesh melted away, and my spirit was transformed; and I cried out with a loud voice ... in the spirit of power[e][d][c][b], and I blessed and praised and exalted him.
translation:
  language: hi
  text: तब मैं मुँह के बल गिर पड़ा, और मेरी सारी देह गल गई; मेरी आत्मा बदल गई[b]। मैंने ऊँची आवाज़ में पुकारा ...[a] सामर्थ्य की आत्मा में[c], और मैंने उसे धन्य कहा, उसकी स्तुति की और उसे महान ठहराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मैंने ऊँची आवाज़ में पुकारा’ के बाद उपलब्ध पाठ कठिन और संभवतः अपूर्ण या विकृत है; तीन बिंदु उसी पाठगत अंतराल को दर्शाते हैं।
    reason: textual_variant
  - marker: b
    text: या, ‘मेरी आत्मा रूपांतरित हो गई।’ यहाँ प्रयुक्त गीइज़ क्रिया कठिन है और परिवर्तन का ठीक स्वरूप अनिश्चित है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘सामर्थ्य की आत्मा के द्वारा’ अथवा ‘आत्मिक सामर्थ्य से।’ यह वाक्यांश हनोक की भीतरी दशा या उसे सामर्थ्य देने वाले माध्यम—दोनों में से किसी का संकेत हो सकता है।
    reason: lexical_alternative
