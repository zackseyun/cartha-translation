  choice: सामर्थ्य की आत्मा में
  rationale: यह जानबूझकर कुछ अपारदर्शी रूप मूल की उस अस्पष्टता को सुरक्षित रखता है कि वाक्यांश हनोक की भीतरी दशा बताता है या उसे सामर्थ्य देने वाली आत्मिक शक्ति।
