theological_decisions:
- issue: दर्शन के समय ‘देह’ के गलने का मानवशास्त्रीय बल
  choice: ‘मेरी सारी देह गल गई’ को बनाए रखना
  alternative: ‘मेरा पूरा शरीर जवाब दे गया’
  rationale: मूल का ठोस शारीरिक शब्द और प्रलयदर्शी छवि किसी सामान्य भावनात्मक प्रतिक्रिया की तुलना में अधिक प्रबल है; ‘देह’ इसे बिना किसी विशेष धार्मिक सिद्धान्त को आरोपित किए सुरक्षित रखती है।
- issue: आत्मा का वर्णन करने वाली कठिन क्रिया
  choice: ‘मेरी आत्मा बदल गई’
  alternative: ‘मेरी आत्मा रूपांतरित हो गई’ या ‘मेरी आत्मा निकल गई’
  rationale: ‘बदल गई’ वास्तविक आंतरिक परिवर्तन को व्यक्त करती है, पर यह न तो किसी विशिष्ट महिमामय रूपांतरण को सिद्ध मानती है और न मृत्यु अथवा आत्मा के निकल जाने का अर्थ थोपती है।
- issue: ‘सामर्थ्य की आत्मा’ का संबंध
  choice: मूल की अस्पष्ट रचना को मुख्य पाठ में बनाए रखना
  alternative: ‘सामर्थ्य देने वाली आत्मा के द्वारा’ या ‘आत्मिक सामर्थ्य से’
  rationale: गीइज़ का पूर्वसर्ग साधन, माध्यम या अवस्था का बोध करा सकता है। किसी एक अर्थ को चुनने से हनोक की आंतरिक दशा और बाहरी सामर्थ्यकारी माध्यम के बीच की वास्तविक अस्पष्टता मिट जाती।
