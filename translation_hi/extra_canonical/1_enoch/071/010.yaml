base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/010.yaml
  text: And with them was the Head of Days[a], and his head was like white and pure wool[c][b], and his garment cannot be described.
translation:
  language: hi
  text: और उनके साथ दिनों का प्रधान[a] था। उसका सिर सफेद और शुद्ध ऊन के समान था, और उसके वस्त्र का वर्णन नहीं किया जा सकता था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘दिनों का सिर’। इसे पारंपरिक रूप से ‘अति प्राचीन’ भी कहा गया है, संभवतः दानिय्येल 7 की पदवी की प्रतिध्वनि के कारण।
    reason: lexical_alternative
  - marker: b
    text: अंतिम वाक्यांश का अर्थ ‘समझाया या व्याख्यायित नहीं किया जा सकता था’ भी हो सकता है; यहाँ भाव यह है कि वह वस्त्र साधारण वर्णन से परे था।
    reason: lexical_alternative
lexical_decisions:
- source_word: ምስሌሆሙ
  choice: उनके साथ
  rationale: गीज़ पूर्वसर्ग ምስለ का सामान्य अर्थ ‘साथ’ है; इसलिए ‘उनके बीच’ की अपेक्षा यह स्रोत की संबंधात्मक अभिव्यक्ति को अधिक ठीक से रखता है।
- source_word: ርእሰ መዋዕል
  choice: दिनों का प्रधान
  rationale: यह स्थानीय गीज़ पदवी का निकट और स्वाभाविक हिन्दी रूप है। ‘अति प्राचीन’ जैसी दानिय्येल-प्रभावित पारंपरिक पदवी को मुख्य पाठ में लाने के बजाय ‘सिर/प्रधान’ और ‘दिनों’ के घटकों को सुरक्षित रखा गया है।
- source_word: ፀምር
  choice: ऊन
  rationale: ከመ (‘समान’) द्वारा प्रस्तुत तुलना का ठोस आधार ऊन है; इसे ‘बाल’ करने से तुलना का रूप बदल जाता।
- source_word: ጻዕዳ ወንጹሕ
  choice: उजले और शुद्ध
  rationale: 'दोनों विशेषण अलग रखे गए हैं: पहला सफेदी/उज्ज्वलता और दूसरा निर्मलता या शुद्धता व्यक्त करता है।'
- source_word: ልብሱ
  choice: उसके वस्त्र
  rationale: ‘वस्त्र’ व्यापक मूल संज्ञा का गरिमापूर्ण, स्वाभाविक हिन्दी रूप है और अनावश्यक रूप से किसी खास प्रकार के चोगे का संकेत नहीं देता।
- source_word: ዘኢይትረጐም
  choice: वर्णन नहीं किया जा सकता था
  rationale: क्रिया समझाने, अर्थ बताने या व्याख्या करने से संबंधित हो सकती है; दर्शनीय संदर्भ में अवर्णनीयता स्वाभाविक है। भूतकाल कथात्मक प्रवाह से मेल खाता है।
theological_decisions:
- issue: ርእሰ መዋዕል को दानिय्येल से परिचित पारंपरिक पदवी द्वारा प्रस्तुत करना या स्थानीय शब्दरचना को सुरक्षित रखना
  choice: दिनों का प्रधान
  alternative: अति प्राचीन / दिनों का प्राचीन
  rationale: मुख्य पाठ गीज़ साक्ष्य की शब्दरचना पर आधारित है। संभावित दानिय्येली प्रतिध्वनि को नकारे बिना पारंपरिक समानता को पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सरल दर्शनीय-वर्णनात्मक रूप अपनाया गया है। ‘दिनों का प्रधान’ थोड़ा असामान्य जानबूझकर रखा गया है, ताकि स्रोत की विशिष्ट पदवी और उसकी अस्पष्टता बनी रहे।
