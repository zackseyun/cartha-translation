base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/013.yaml
  text: And that Head of Days came with Michael and Raphael and Gabriel and Phanuel[c][b][a], and thousands and ten thousands of angels who have no number.
translation:
  language: hi
  text: और वह दिनों का प्रधान[a] मीकाएल, रफाएल, गब्रिएल और फनूएल[b] के साथ आया; और हज़ारों और दसियों हज़ार स्वर्गदूत, जिनकी कोई गिनती नहीं थी, उसके साथ आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दिनों का सिर।” इस पदवी का अनुवाद प्रायः दानिय्येल की परिचित अभिव्यक्ति के अनुसार “अति प्राचीन” किया जाता है; यहाँ गीइज़ शब्दों के विशिष्ट रूप को बनाए रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: इन नामों को यहाँ गीइज़ पाठ के रूपों के निकट देवनागरी में लिप्यंतरित किया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: ርእሰ መዋዕል
  choice: दिनों का प्रधान
  rationale: यह पदवी के रूप में प्रयुक्त गीइज़ अभिव्यक्ति के ‘दिनों के सिर/प्रधान’ अर्थ को स्वाभाविक हिन्दी में बनाए रखता है और दानिय्येल की पारंपरिक पदवी को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: መጽአ
  choice: आया
  rationale: सामान्य आगमन-सूचक क्रिया का सीधा और स्वाभाविक अनुवाद।
- source_word: ምስለ
  choice: के साथ
  rationale: यह साथ होने या संग आने का भाव सीधे व्यक्त करता है।
- source_word: ሚካኤል ወሩፋኤል ወገብርኤል ወፋኑኤል
  choice: मीकाएल, रफाएल, गब्रिएल और फनूएल
  rationale: नामों को गीइज़ रूपों के निकट देवनागरी में लिप्यंतरित किया गया है, साथ ही हिन्दी पाठक के लिए उच्चारण सहज रखा गया है।
- source_word: አእላፍ ወትእልፊተ
  choice: हज़ारों और दसियों हज़ार
  rationale: दोनों संख्यात्मक पदों को अलग रखते हुए प्रकाशनात्मक गणना-शैली को सुरक्षित रखा गया है; ‘असंख्य’ कहकर उन्हें मिला नहीं दिया गया।
- source_word: መላእክት
  choice: स्वर्गदूत
  rationale: इस स्वर्गीय दर्शन के प्रसंग में ‘स्वर्गदूत’ हिन्दी का स्वाभाविक और सुस्पष्ट शब्द है।
- source_word: እለ አልቦሙ ኍልቈ
  choice: जिनकी कोई गिनती नहीं थी
  rationale: यह मूल की ‘उनकी कोई संख्या नहीं’ वाली तीखी अतिशयोक्तिपूर्ण अभिव्यक्ति को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय पदवी ርእሰ መዋዕል का अनुवाद
  choice: दिनों का प्रधान
  alternative: अति प्राचीन / दिनों का सिर
  rationale: ‘दिनों का प्रधान’ मूल रूपक और पदवी-सदृश बल को सुरक्षित रखता है। ‘अति प्राचीन’ दानिय्येल की परिचित शब्दावली से अत्यधिक सामंजस्य बैठा सकता है, जबकि ‘दिनों का सिर’ आधुनिक हिन्दी में अस्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण किंतु सहज शैली अपनाई गई है। वाक्य में बार-बार ‘और’ आने की मूल प्रकाशनात्मक लय को कुछ हद तक रखा गया है, पर स्पष्टता के लिए ‘उसके साथ’ जोड़ा गया है; इससे साथ आए असंख्य स्वर्गदूतों का संबंध साफ होता है।
