- source_word: አልባሶሙ ጻዓዳ
  choice: उनके वस्त्र सफेद थे
  rationale: ‘वस्त्र’ व्यापक, स्वाभाविक और मूल से अधिक विशिष्ट नहीं है।
- source_word: ብሩሃን ገጾሙ ከመ በረድ
