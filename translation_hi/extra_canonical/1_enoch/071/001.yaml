base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/001.yaml
  text: 'And after this it happened: my spirit was taken up[a], and it ascended into the heavens; and I saw the sons of the holy angels walking upon a flame of fire, and their garments were white[d][c][b], and their faces shone like snow.'
translation:
  language: hi
  text: 'और इसके बाद ऐसा हुआ: मेरी आत्मा ऊपर उठा ली गई[a] और वह स्वर्गों में चढ़ गई। तब मैंने पवित्र स्वर्गदूतों के पुत्रों[b] को आग की ज्वाला पर चलते देखा। उनके वस्त्र सफेद थे[c], और उनके मुख बर्फ के समान चमक रहे थे[d]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह वाक्यांश दर्शन में ऊपर उठा लिए जाने का संकेत देता है; इसका अनुवाद ‘मेरी आत्मा ऊपर उठाई गई’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल में शाब्दिक रूप से ‘पवित्र स्वर्गदूतों के पुत्र’ है। यह असामान्य अभिव्यक्ति व्यापक अर्थ में पवित्र स्वर्गदूतों से जुड़े स्वर्गदूतीय प्राणियों के लिए भी प्रयुक्त हो सकती है।
    reason: lexical_alternative
  - marker: c
    text: मूल की इस जगह एक कोष्ठकबद्ध और पाठ की दृष्टि से अनिश्चित पद है, जिसका अर्थ संभवतः ‘और उनके चोगे’ है। मुख्य पाठ में उसे शामिल नहीं किया गया, क्योंकि वाक्य में उसका संबंध स्पष्ट नहीं है।
    reason: textual_variant
  - marker: d
    text: यहाँ अनूदित शब्द का सामान्य अर्थ ‘ओला’ या ‘बर्फ’ हो सकता है; इस प्रसंग में तुलना चकाचौंध करने वाली सफेदी और चमक को व्यक्त करती है।
    reason: lexical_alternative
