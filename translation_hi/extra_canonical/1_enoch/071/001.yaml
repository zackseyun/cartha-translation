  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण दर्शनीय-वृत्तांत शैली-रजिस्टर अपनाया गया है। ‘स्वर्गों’ जैसा असामान्य बहुवचन और ‘स्वर्गदूतों के पुत्र’ जैसी कठिन अभिव्यक्ति मूल की संरचना तथा तनाव बनाए रखने के लिए सुरक्षित रखी गई है।
