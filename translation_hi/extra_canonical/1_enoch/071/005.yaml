base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/005.yaml
  text: And my spirit was covered in the heaven of heavens[a], and I saw there, in the midst of that light, something built of stones of hail[c][b], and in the midst of those stones were tongues of living fire.
translation:
  language: hi
  text: और मेरी आत्मा स्वर्गों के स्वर्ग में आच्छादित हो गई[a]। वहाँ मैंने उस ज्योति के बीच ओलों के पत्थरों से बनी कोई संरचना[b][c] देखी, और उन पत्थरों के बीच जीवित अग्नि की जिह्वाएँ थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छिपा दी गई।” इस क्रिया का पाठ और अर्थ कठिन है; इसे “ऊपर उठा ली गई” भी समझा गया है।
    reason: textual_variant
  - marker: b
    text: इस पंक्ति का गीइज़ वाक्य-विन्यास कठिन है। आशय संभवतः उस ज्योति के भीतर किसी बनी हुई वस्तु या भवन-सदृश रचना से है।
    reason: textual_variant
  - marker: c
    text: शाब्दिक रूप से “ओलों के पत्थर”; इसे “ओले” या संभवतः “बर्फीले पत्थर” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ከበቶ
  choice: आच्छादित हो गई
  rationale: प्रस्तुत गीइज़ रूप और नवीन पाठ-समीक्षा के आधार पर क्रिया के ढकने/छिपाने के भाव को रखा गया है। इससे इसे केवल सामान्य स्वर्गारोहण मानकर अर्थ सीमित नहीं किया जाता।
- source_word: መንፈስየ
  choice: मेरी आत्मा
  rationale: दर्शनात्मक संदर्भ में यह व्यक्ति की आत्मा/प्राण-तत्त्व को सूचित करता है; इसे केवल ‘मन’ नहीं बनाया गया।
- source_word: ውስተ ሰማየ ሰማያት
  choice: स्वर्गों के स्वर्ग में
  rationale: मूल की सामी शैली वाली उत्कृष्टता-सूचक अभिव्यक्ति को बनाए रखा गया है, न कि उसे केवल ‘सर्वोच्च स्वर्ग’ में समतल किया गया।
- source_word: ርኢኩ በህየ
  choice: वहाँ मैंने ... देखा
  rationale: दर्शन-वृत्तांत की सीधी और स्वाभाविक अभिव्यक्ति।
- source_word: ማእከለ ዝኩ ብርሃን
  choice: उस ज्योति के बीच
  rationale: संकेतवाचकता और स्वर्गीय प्रकाश के भीतर की स्थिति दोनों सुरक्षित रहती हैं।
- source_word: ከመ ቦቱ ዘይትነደቅ
  choice: कोई संरचना
  rationale: कठिन वाक्य-विन्यास किसी निर्मित वस्तु या भवन-सदृश रचना की ओर संकेत करता है; ‘कोई’ पाठ की अनिश्चितता बनाए रखता है।
- source_word: እምእብነ አስሐትያ
  choice: ओलों के पत्थरों से बनी
  rationale: मूल की ठोस और विचित्र प्रलयदर्शी छवि को सामान्य ‘बर्फ’ या बहुमूल्य पदार्थ में नहीं बदला गया।
- source_word: ልሳናተ እሳት ሕያው
  choice: जीवित अग्नि की जिह्वाएँ
  rationale: ‘जिह्वाएँ’ ज्वाला के आकार की मूल उपमा और ‘जीवित अग्नि’ उसके सजीव गुण को सुरक्षित रखता है।
theological_decisions:
- issue: हनोक के अनुभव का स्वरूप
  choice: मेरी आत्मा ... आच्छादित हो गई
  alternative: मैं शरीर सहित ऊपर उठा लिया गया / मेरा मन दर्शन में ऊपर उठ गया
  rationale: मूल पाठ स्पष्ट रूप से ‘मेरी आत्मा’ कहता है। अनुवाद यह निश्चित नहीं करता कि अनुभव शारीरिक था, केवल आंतरिक था, या स्वर्गीय रूपांतरण का कोई अन्य प्रकार।
- issue: स्वर्गीय निर्मित वस्तु की पहचान
  choice: कोई संरचना
  alternative: एक भवन / एक महल
  rationale: कठिन पाठ किसी निर्मित वस्तु का संकेत देता है, पर उसकी निश्चित पहचान नहीं बताता; इसलिए उसे महल या मंदिर नहीं कहा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली रखी गई है। ‘स्वर्गों का स्वर्ग’, ‘ज्योति’, ‘अग्नि’ और ‘जिह्वाएँ’ जैसे पद मूल की ऊँची तथा प्रलयदर्शी छवि को बनाए रखते हैं; कठिन पाठ को पादटिप्पणियों में खुला छोड़ा गया है।
