base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/003.yaml
  text: And the angel Mika'el[a], one of the chief angels, took hold of my right hand and raised me up, and brought me out to all the hidden things; and he showed me all the hidden things of mercy[c][b], and he showed me all the hidden things of righteousness.
translation:
  language: hi
  text: और स्वर्गदूत मीकाएल, जो प्रधान स्वर्गदूतों[a] में से एक था, ने मेरा दाहिना हाथ पकड़ा और मुझे ऊपर उठाया। वह मुझे बाहर निकालकर सभी छिपी हुई बातों[b] तक ले गया; और उसने मुझे दया की सभी छिपी हुई बातें दिखाईं, और धार्मिकता[c] की सभी छिपी हुई बातें दिखाईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, ‘स्वर्गदूतों के प्रधानों में से एक’; ‘महादूतों में से एक’ भी सम्भव है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सभी गुप्त बातों तक।’ मूल में छिपी या गुप्त बातों के लिए एक ही शब्द बार-बार आया है; मुख्य पाठ में उसकी पुनरावृत्ति रखी गई है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ ‘धार्मिकता’ का अनुवाद ‘न्याय’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: መልአከ ሚካኤል
  choice: स्वर्गदूत मीकाएल
  rationale: መልአከ यहाँ एक स्वर्गीय दूत को सूचित करता है। नाम ሚካኤል को उसके गीइज़ रूप के निकट रखते हुए ‘मीकाएल’ लिखा गया है।
- source_word: ፩እምአርእስተ መላእክት
  choice: प्रधान स्वर्गदूतों में से एक
  rationale: मूल पदबंध का शाब्दिक भाव ‘स्वर्गदूतों के प्रधानों/मुखियों में से एक’ है। चुना हुआ रूप पद या वरिष्ठता का भाव रखता है, पर बाद की अधिक तकनीकी पदवी को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: አኃዘኒ እዴየ ዘየማን
  choice: मेरा दाहिना हाथ पकड़ा
  rationale: क्रिया पकड़ने या थामने का ठोस भाव देती है और ዘየማን दाहिने हाथ को निर्दिष्ट करता है।
- source_word: አንሥአኒ
  choice: मुझे ऊपर उठाया
  rationale: यह क्रिया उठाने या ऊपर करने को व्यक्त करती है; दृश्य में होने वाली गति को स्पष्ट बनाए रखा गया है।
- source_word: አውፅአኒ
  choice: मुझे बाहर निकालकर
  rationale: यह बाहर जाने की कारक क्रिया है—मीकाएल हनोक को बाहर ले आता है। हिंदी वाक्यक्रम में अगली मंज़िल से स्वाभाविक रूप से जोड़ने के लिए ‘बाहर निकालकर’ रखा गया है।
- source_word: ኀበ ኵሉ ኅቡአት
  choice: सभी छिपी हुई बातों तक
  rationale: ኅቡአት छिपी या गुप्त वस्तुओं/विषयों को दर्शाता है। ‘छिपी हुई बातें’ सहज हिंदी है और इसी शब्द की पद में होने वाली पुनरावृत्ति को बनाए रखती है।
- source_word: ኅቡአተ ምሕረት
  choice: दया की सभी छिपी हुई बातें
  rationale: सम्बन्धसूचक रचना छिपी बातों को विशेष रूप से ምሕረት, अर्थात दया/करुणा, से जोड़ती है। ‘दया’ इसका सीधा और संक्षिप्त रूप है।
- source_word: ኅቡአተ ጽድቅ
  choice: धार्मिकता की सभी छिपी हुई बातें
  rationale: ጽድቅ में धार्मिकता और न्याय—दोनों से जुड़ा अर्थक्षेत्र है। यहाँ दया के साथ समानांतर प्रयोग और हनोक-साहित्य की नैतिक भाषा को देखते हुए ‘धार्मिकता’ चुना गया है; पुनरावृत्ति भी सुरक्षित रखी गई है।
theological_decisions:
- issue: स्वर्गदूत की श्रेणी को तकनीकी पदवी के रूप में व्यक्त करना या उसके अर्थ के अनुसार
  choice: प्रधान स्वर्गदूतों में से एक
  alternative: महादूतों में से एक; स्वर्गदूतों के प्रधानों में से एक
  rationale: गीइज़ पदबंध प्रधानता या मुखियापन बताता है। ‘महादूत’ सम्भव है, किंतु वह बाद की एक निश्चित तकनीकी श्रेणी का अधिक प्रबल संकेत दे सकता है; इसलिए अर्थपरक और कम निर्णायक रूप चुना गया है।
- issue: ጽድቅ का अनुवाद धार्मिकता या न्याय करना
  choice: धार्मिकता
  alternative: न्याय
  rationale: दोनों अर्थ सम्भव हैं। दया के साथ इसका समानांतर प्रयोग नैतिक धार्मिकता के पक्ष में है, फिर भी ‘न्याय’ की सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘छिपी हुई बातें’ की तीनfold पुनरावृत्ति मूल के जानबूझकर किए गए समानांतर विन्यास को सुरक्षित रखती है। संयुक्त क्रियाओं को छोटे वाक्यों में बाँटकर दृश्य की क्रमिक गति स्पष्ट की गई है।
