base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/007.yaml
  text: And around it were the seraphim and the cherubim and the ophannim[b][a], and these are those who do not sleep and who keep watch over the throne of his glory.
translation:
  language: hi
  text: और उसके चारों ओर[b] सराफीम, करूबीम और ओफ़न्नीम[a] थे। ये वे हैं जो सोते नहीं और उसकी महिमा के सिंहासन की रखवाली करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ओफ़न्नीम’ स्वर्गीय प्राणियों के एक वर्ग का लिप्यंतरित नाम है; इसके मूल अर्थ का संबंध ‘पहियों’ से है।
    reason: lexical_alternative
  - marker: b
    text: ‘उसके’ का संकेत पिछले पद में वर्णित भवन की ओर है।
    reason: pronoun_antecedent
lexical_decisions:
- source_word: አውዶ
  choice: उसके चारों ओर थे
  rationale: इस रूप में तीसरे पुरुष एकवचन का प्रत्यय निहित है, इसलिए ‘उसके’ को व्यक्त किया गया है; यह पिछले पद में वर्णित स्थान या भवन की ओर संकेत करता है।
- source_word: ሱራፌን
  choice: सराफीम
  rationale: स्वर्गीय प्राणियों के विशिष्ट वर्ग का पारंपरिक लिप्यंतरण रखा गया है; ‘अग्निमय प्राणी’ जैसा अर्थानुवाद दर्शन की वर्ग-सूची को अधिक व्याख्यात्मक बना देता।
- source_word: ኪሩቤን
  choice: करूबीम
  rationale: इसे स्वर्गीय प्राणियों के विशिष्ट वर्ग के नाम के रूप में लिप्यंतरित किया गया है और इसके बहुवचन रूप को बनाए रखा गया है।
- source_word: አፋኒን
  choice: ओफ़न्नीम
  rationale: यहाँ समानांतर रूप से स्वर्गीय वर्गों की सूची है, इसलिए ‘पहिए’ के बजाय वर्ग-नाम का लिप्यंतरण किया गया है; मूल अर्थ की जानकारी पादटिप्पणी में दी गई है।
- source_word: እሙንቱ
  choice: ये वे हैं
  rationale: यह बलयुक्त पहचान सूचीबद्ध प्राणियों को आगे आने वाले वर्णन से जोड़ती है।
- source_word: እለ ኢይነውሙ
  choice: जो सोते नहीं
  rationale: मूल के साधारण निषेध को सीधे और स्वाभाविक आधुनिक हिन्दी में रखा गया है; ‘कभी नहीं सोते’ जैसी तीव्रता नहीं जोड़ी गई।
- source_word: የዐቅቡ
  choice: रखवाली करते हैं
  rationale: क्रिया में जागरूक निगरानी और रक्षा, दोनों का भाव है; सिंहासन के प्रसंग में ‘रखवाली’ इसे सहज रूप से व्यक्त करता है।
- source_word: መንበረ ስብሐተ ዚአሁ
  choice: उसकी महिमा का सिंहासन
  rationale: संज्ञा और संबंधसूचक रचना को बनाए रखा गया है; इसे केवल ‘महिमामय सिंहासन’ करने से ‘उसकी महिमा’ का संबंध धुँधला पड़ सकता था।
theological_decisions:
- issue: सिंहासन-दर्शन में नामित स्वर्गीय प्राणियों का अनुवाद
  choice: सराफीम, करूबीम और ओफ़न्नीम—तीनों को विशिष्ट वर्ग-नामों के रूप में लिप्यंतरित करना
  alternative: ओफ़न्नीम को ‘पहिए’ कहना, या तीनों को सामान्य रूप से ‘स्वर्गदूत’ कहना
  rationale: पद अलग-अलग स्वर्गीय वर्गों की सूची देता है। लिप्यंतरण इस प्रलयदर्शी जगत-चित्र की विशिष्टता बनाए रखता है और पाठ को किसी सामान्य स्वर्गदूत-वर्ग में नहीं मिला देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। स्वर्गीय वर्गों के नाम पारंपरिक ध्वन्यात्मक रूप में हैं, जबकि शेष वाक्य सहज हिन्दी गद्य में है।
