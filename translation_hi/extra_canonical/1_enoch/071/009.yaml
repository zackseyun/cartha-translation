base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/009.yaml
  text: And there came out from that house Mikael and Rufael and Gabr'el and Fanuel, and many holy angels without number.
translation:
  language: hi
  text: और उस भवन में से मीकाएल, रूफ़ाएल, गब्रएल और फ़ानूएल[a], तथा बहुत-से पवित्र स्वर्गदूत निकले, जिनकी गिनती नहीं थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इन नामों को गीइज़ रूपों के आधार पर लिप्यंतरित किया गया है; इसलिए ये कुछ अधिक परिचित हिन्दी वर्तनियों से भिन्न हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወወፅኡ
  choice: और ... निकले
  rationale: बहुवचन क्रिया बाहर निकलने को व्यक्त करती है; हिन्दी में कर्ताओं के बाद ‘निकले’ रखना स्वाभाविक है।
- source_word: እምኔ ውእቱ ቤት
  choice: उस भवन में से
  rationale: እምኔ स्रोत या अलगाव, ውእቱ पहले बताए गए निश्चित स्थान, और ቤት घर/भवन को सूचित करता है। प्रसंग की गरिमा के अनुरूप ‘भवन’ चुना गया है।
- source_word: ሚካኤል
  choice: मीकाएल
  rationale: नाम को गीइज़ रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: ሩፋኤል
  choice: रूफ़ाएल
  rationale: गीइज़ के ‘रूफ़ा-’ स्वरूप को बनाए रखा गया है, न कि अधिक परिचित रूप से प्रतिस्थापित किया गया।
- source_word: ገብርኤል
  choice: गब्रएल
  rationale: गीइज़ नाम की gabr- व्यंजन-संरचना को हिन्दी में यथासंभव स्पष्ट और संक्षिप्त रूप से रखा गया है।
- source_word: ፋኑኤል
  choice: फ़ानूएल
  rationale: नाम का सीधा गीइज़-आधारित लिप्यंतरण किया गया है।
- source_word: ብዙኃን ቅዱሳን መላእክት
  choice: असंख्य पवित्र स्वर्गदूत
  rationale: ‘पवित्र’ सीधे स्वर्गदूतों को विशेषित करता है। अंतिम संबंधवाचक वाक्यांश के साथ मिलाकर ‘असंख्य’ सहज हिन्दी देता है।
- source_word: እለ አልቦሙ ኍልቈ
  choice: असंख्य
  rationale: शाब्दिक भाव है कि उनकी कोई संख्या न थी; ‘असंख्य’ इस मुहावरे को संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: स्वर्गीय प्राणियों के संदर्भ में ቅዱሳን का अर्थ
  choice: पवित्र स्वर्गदूत
  alternative: पवित्र जन, अर्थात स्वर्गदूत
  rationale: यहाँ ቅዱሳን सीधे መላእክት को विशेषित करता है। ‘पवित्र स्वर्गदूत’ स्थानीय व्याकरणिक अर्थ को स्पष्ट रखता है और बाद की कलीसियाई ‘संत’ शब्दावली आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण कथात्मक शैली अपनाई गई है। नाम स्रोत-उन्मुख हैं और ‘भवन’, ‘पवित्र स्वर्गदूत’ तथा ‘असंख्य’ अपोकैलिप्टिक प्रसंग की ऊँची शैली बनाए रखते हैं।
