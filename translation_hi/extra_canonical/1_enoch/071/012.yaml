base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/012.yaml
  text: And those blessings that went out from my mouth became acceptable before that Head of Days[a][b][c].
translation:
  language: hi
  text: और वे आशीषें, जो मेरे मुँह से निकलीं, उस “दिनों के प्रधान” के सामने स्वीकार्य ठहरीं।[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस दिनों के प्रधान के सामने प्रिय ठहरीं।” यहाँ अनूदित गीइज़ शब्द का अर्थ प्रसन्न करने वाली या अनुकूल रूप से स्वीकार की गई भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल गीइज़ में यहाँ उपाधि का रूप “दिनों के प्रधान” है। इसे दानिय्येल की अधिक परिचित उपाधि “अति प्राचीन” से चुपचाप मिलाने से बचने के लिए अलग रखा गया है।
    reason: cross_reference
  - marker: c
    text: कुछ पुराने अनुवादों में एकवचन “वह आशीष जो निकली” है; पर गीइज़ में संकेतवाचक, संबंधवाचक और क्रियाएँ बहुवचन हैं।
    reason: previous_rendering
lexical_decisions:
- source_word: በረከት
  choice: आशीषें
  rationale: मूल संज्ञा का अर्थ आशीष या आशीर्वचन है। वाक्य के बहुवचन-सूचकों के अनुरूप हिन्दी में बहुवचन रखा गया है; ‘मेरे मुँह से निकलीं’ उसके वाचिक स्वरूप को स्पष्ट करता है।
- source_word: ወፅኣ እምነ አፉየ
  choice: मेरे मुँह से निकलीं
  rationale: यह मूल के सजीव और ठोस बिंब को बनाए रखता है और इसे केवल ‘मैंने कहा’ में सीमित नहीं करता। स्त्रीलिंग बहुवचन क्रिया ‘आशीषें’ और गीइज़ व्याकरण दोनों के अनुरूप है।
- source_word: ሥሙረተ
  choice: ग्रहणयोग्य ठहरीं
  rationale: यह अनुकूल स्वीकृति या प्रसन्नता का भाव व्यक्त करता है और विधेयात्मक बल बनाए रखता है। ‘ठहरीं’ प्रसंग में स्वाभाविक हिन्दी है तथा केवल भावनात्मक प्रसन्नता का अर्थ थोपने से बचाती है।
- source_word: ቅድመ
  choice: के सामने
  rationale: यह उपस्थिति और दरबारी/दर्शनात्मक परिवेश दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ዝኩ ርእሰ መዋዕል
  choice: उस युगों के प्रधान
  rationale: ‘उस’ संकेतवाचक को सुरक्षित रखता है। ‘युगों के प्रधान’ स्थानीय हनोकिक उपाधि की विशिष्टता बनाए रखते हुए हिन्दी में बोधगम्य है और इसे दानिय्येल की परिचित उपाधि से चुपचाप नहीं मिलाता।
theological_decisions:
- issue: दैवी उपाधि ርእሰ መዋዕል का अनुवाद
  choice: युगों के प्रधान
  alternative: अति प्राचीन; दिनों का प्रधान
  rationale: मूल में ‘प्रधान/सिर’ और ‘दिनों/युगों’ की विशिष्ट संरचना है। ‘युगों के प्रधान’ उस हनोकिक अभिव्यक्ति को बनाए रखता है और दानिय्येल की पारंपरिक उपाधि ‘अति प्राचीन’ से अनावश्यक सामंजस्य नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप। दर्शनात्मक शैली बनाए रखने हेतु ‘मेरे मुँह से निकलीं’ रखा गया है। ‘युगों के प्रधान’ विशिष्ट उपाधि को सुरक्षित रखता है; इसकी असामान्यता को पादटिप्पणी स्पष्ट करती है।
