base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/002.yaml
  text: And I saw two rivers of fire[a], and the light of that fire shone like hyacinth[b], and I fell on my face before the Lord of Spirits.
translation:
  language: hi
  text: और मैंने आग की दो नदियाँ देखीं, और उस आग का प्रकाश[a] याकिन्त रत्न के समान चमक रहा था[b]; और मैं आत्माओं के प्रभु के सामने मुँह के बल गिर पड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीइज़ में ‘उस आग का प्रकाश’ पदबंध संक्षिप्त है; इसका अर्थ अधिक स्वतंत्र रूप से ‘उसकी अग्निमय आभा’ भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: ‘याकिन्त’ किसी रत्न का प्राचीन नाम है, पर उसकी ठीक पहचान अनिश्चित है; इसे कभी-कभी ‘जैसिन्थ’ भी कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ክልኤተ አፍላገ እሳት
  choice: आग की दो नदियाँ
  rationale: संख्या और प्रलय-दर्शन के सशक्त बिंब—दो बहती हुई अग्नि-धाराओं—को सीधे सुरक्षित रखा गया है; ‘नदियाँ’ सामान्य हिन्दी में ‘धाराओं’ से अधिक प्रभावशाली और मूल संज्ञा के अनुकूल है।
- source_word: ብርሃነ ዝኩ እሳት
  choice: उस आग का प्रकाश
  rationale: संक्षिप्त गीइज़ पदबंध में संकेतवाचक बल को ‘उस’ से और प्रकाश के आग से संबंध को संबंधकारक रचना से व्यक्त किया गया है।
- source_word: ያክንት
  choice: याकिन्त रत्न
  rationale: प्राचीन रत्न की सटीक पहचान अनिश्चित है। मूल नाम का लिप्यंतरण और ‘रत्न’ जोड़ने से तुलना समझ में आती है, पर इसे किसी आधुनिक खनिज के साथ अनुचित रूप से निश्चित नहीं किया जाता।
- source_word: ያበርህ
  choice: चमक रहा था
  rationale: क्रिया के प्रकाश देने या चमकने के दृश्य अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ወወደቁ በገጽየ
  choice: मैं ... मुँह के बल गिर पड़ा
  rationale: मूल की शारीरिक दण्डवत् मुद्रा को किसी व्याख्यात्मक धार्मिक शब्द से बदलने के बजाय उसके सजीव मुहावरे को सुरक्षित रखा गया है।
- source_word: እግዚአ መንፈሳት
  choice: आत्माओं के प्रभु
  rationale: 1 हनोक के दृष्टान्त-खंड में बार-बार आने वाली उपाधि को पदानुकूल, गरिमापूर्ण और संगत रूप में रखा गया है।
theological_decisions:
- issue: ईश्वरीय उपाधि እግዚአ መንፈሳት का अनुवाद
  choice: आत्माओं के प्रभु
  alternative: आत्माओं का स्वामी
  rationale: ‘प्रभु’ उपाधि के सूत्रबद्ध और आराधनात्मक स्वर को बनाए रखता है, जबकि बहुवचन ‘आत्माओं’ को स्पष्ट रूप से सुरक्षित रखता है।
- issue: रत्न-संबंधी तुलना का अर्थ
  choice: याकिन्त रत्न के समान
  alternative: किसी बहुमूल्य रत्न के समान
  rationale: सामान्यीकृत अनुवाद मूल के विशिष्ट नाम को मिटा देता। लिप्यंतरण और पाद-टिप्पणी प्राचीन रत्न की अनिश्चित पहचान को ईमानदारी से सुरक्षित रखते हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दर्शन के असाधारण बिंबों को सरल करके नहीं मिटाया गया। अर्धविराम दृश्य के वर्णन और उसके प्रति वक्ता की प्रतिक्रिया के बीच स्वाभाविक विभाजन बनाता है।
