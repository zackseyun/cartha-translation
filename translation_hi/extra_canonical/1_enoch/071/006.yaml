base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/006.yaml
  text: And my spirit saw the enclosure that surrounded that house of fire[a], and from its four sides were rivers full of living fire[d][c][b], and they surrounded that house.
translation:
  language: hi
  text: और मेरी आत्मा ने उस घेरे को देखा जो आग के उस भवन को घेरे हुए था[a], और उसके चारों छोरों से जीवित आग से भरी नदियों को देखा[c][b]; वे उस भवन को चारों ओर से घेरती थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल गीइज़ में ‘घेरा/घेरना’ से जुड़े शब्द बार-बार आते हैं; यहाँ उस पुनरावृत्ति को यथासंभव बनाए रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: ‘जीवित आग’ असामान्य पदबंध का शाब्दिक अनुवाद है। इसका आशय सजीव, सक्रिय या अत्यंत प्रबल आग हो सकता है, केवल साधारण ज्वाला नहीं।
    reason: lexical_alternative
  - marker: c
    text: ‘छोरों’ के लिए आया शब्द सीमाएँ, दिशाएँ या किनारे भी दर्शा सकता है; ‘चारों कोनों’ का अनुवाद भी संभव है, पर अधिक विशिष्ट है।
    reason: alternative_reading
lexical_decisions:
- source_word: መንፈስየ
  choice: मेरी आत्मा
  rationale: दर्शन-संबंधी प्रसंग में यह द्रष्टा की आत्मा को देखने वाले कर्ता के रूप में प्रस्तुत करता है; ‘मेरी आत्मा ने देखा’ गीइज़ की व्याकरणिक रचना को बनाए रखता है।
- source_word: አውዶ / ዘየአውዶ
  choice: उस घेरे को ... चारों ओर से घेरे हुए था
  rationale: मूल में एक ही धातु की संज्ञात्मक और क्रियात्मक पुनरावृत्ति है। ‘घेरा/घेरे’ उसे स्वाभाविक हिन्दी में सुरक्षित रखता है और स्रोत में न होने वाली ‘दीवार’ नहीं जोड़ता।
- source_word: ቤተ እሳት
  choice: आग का भवन
  rationale: संबंधकारक संरचना और दर्शन की सशक्त छवि को सीधे बनाए रखता है; ‘अग्निमय भवन’ अपेक्षाकृत अधिक व्याख्यात्मक होता।
- source_word: እምአርባዕቱ አጽናፊሁ
  choice: उसके चारों छोरों से
  rationale: አጽናፍ का अर्थ छोर, सीमा या दिशा हो सकता है। ‘छोर’ इस व्यापकता को ‘कोनों’ की अपेक्षा बेहतर बनाए रखता है।
- source_word: አፍላገ
  choice: नदियाँ
  rationale: बहुवचन में बड़े प्रवाहों की भव्य दर्शनीय छवि के लिए ‘नदियाँ’ उपयुक्त है।
- source_word: ምሉኣነ እሳተ ሕያው
  choice: जीवित आग से भरी
  rationale: असामान्य ‘जीवित आग’ को सामान्य ‘धधकती आग’ बनाकर सपाट नहीं किया गया; यह आग की सक्रिय अथवा सजीव गुणवत्ता की अस्पष्टता बचाता है।
- source_word: የአውድዎ
  choice: वे ... चारों ओर से घेरे हुए थीं
  rationale: अंत में फिर आने वाली घेरने की छवि को आरंभिक शब्दावली से जोड़ता है; स्त्रीलिंग बहुवचन ‘नदियाँ’ के अनुरूप है।
theological_decisions:
- issue: दर्शनीय अनुभूति का स्वरूप
  choice: मेरी आत्मा ने ... देखा
  alternative: मैंने आत्मा में देखा / मेरे प्राण ने देखा
  rationale: मूल पाठ आत्मा को प्रत्यक्षतः देखने वाला कर्ता बनाता है। इसी तनाव को बनाए रखने से अनुभव को साधारण शारीरिक दृष्टि में नहीं बदला जाता।
- issue: नदियों का वाक्यगत संबंध
  choice: 'नदियों को दृश्य के भीतर वर्णित किया गया: ‘निकलती थीं’'
  alternative: ‘मेरी आत्मा ने ... नदियों को देखा’
  rationale: रूपात्मक संकेत नदियों को ‘देखा’ का दूसरा कर्म मानने की अनुमति देते हैं, जबकि प्राप्त पाठ-परंपरा स्वतंत्र वर्णन भी सुझाती है। स्वाभाविक हिन्दी के लिए प्रवाह का भाव व्यक्त किया गया, पर इसका पाठगत विकल्प पादटिप्पणी [d] में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दर्शनात्मक पुनरावृत्ति को ‘घेरा/घेरे’ से बचाया गया है। ‘आत्मा’, ‘आग का भवन’ और ‘जीवित आग’ मूल की असामान्य अपोकैलिप्टिक छवियों को बिना सांप्रदायिक व्याख्या के बनाए रखते हैं।
