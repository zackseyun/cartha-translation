  choice: दस हज़ार गुना दस हज़ार
  rationale: मूल के विशाल-संख्या सूत्र को पारदर्शी ढंग से रखता है और किसी अधिक परिचित बाइबिलीय सूत्र को आयात नहीं करता।
- source_word: የአውድዎ ለውእቱ ቤት
  choice: जो उस भवन को घेरे हुए थे
  rationale: क्रिया चारों ओर उपस्थित होकर घेरने का दृश्य व्यक्त करती है।
- source_word: ቤት
