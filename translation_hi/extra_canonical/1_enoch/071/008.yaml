base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/008.yaml
  text: And I saw angels beyond number[a], thousands of thousands and ten thousand times ten thousand, surrounding that house; and Mikael and Rufael and Gabrʾel and Fanʾuel[b], and the holy angels who are above the heavens, were going in and coming out of that house.
translation:
  language: hi
  text: और मैंने ऐसे स्वर्गदूत देखे जिनकी गिनती नहीं हो सकती थी[a]—हज़ारों के हज़ार और दस हज़ार गुना दस हज़ार—जो उस भवन को घेरे हुए थे। मीकाएल, रूफाएल, गब्राएल और फानूएल[b], और वे पवित्र स्वर्गदूत जो आकाशों के ऊपर हैं, उस भवन में भीतर जाते और बाहर निकलते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह विशाल संख्या-सूत्र प्रलयदर्शी साहित्य में स्वर्गीय समूह की अगणनीय विशालता दिखाने का पारम्परिक ढंग है। अनुवाद ने इसे किसी अधिक परिचित बाइबिलीय सूत्र से बदलने के बजाय गीइज़ पाठ के निकट रखा है।
    reason: cultural_note
  - marker: b
    text: 'यहाँ नाम गीइज़ रूपों के अनुसार लिप्यंतरित हैं: मीकाएल, रूफाएल, गब्राएल और फानूएल। इनके अधिक परिचित रूप क्रमशः माइकल, रफाएल, गब्रिएल और फनूएल भी मिलते हैं।'
    reason: lexical_alternative
