  rationale: ‘भवन’ आधुनिक गरिमामय हिन्दी में घर/इमारत का व्यापक अर्थ देता है, पर इसे ‘मन्दिर’ या ‘महल’ बनाकर दृश्य की व्याख्या नहीं करता।
- source_word: ሚካኤል ወሩፋኤል ወገብርኤል ወፋኑኤል
  choice: मीकाएल, रूफाएल, गब्राएल और फानूएल
  rationale: नामों को गीइज़ रूपों के निकट देवनागरी में लिप्यंतरित किया गया है, परिचित परवर्ती रूपों में चुपचाप सामान्यीकृत नहीं किया गया।
- source_word: መላእክተ ቅዱሳን
  choice: पवित्र स्वर्गदूत
  rationale: यह विशेषणात्मक पद का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: እለ መልዕልተ ሰማያት
