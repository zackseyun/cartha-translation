  rationale: स्थानगत और उत्कर्षसूचक कल्पना सुरक्षित रहती है; इसे किसी निश्चित बहु-स्तरीय स्वर्ग-व्यवस्था के रूप में नहीं समझाया गया।
- source_word: ይበውኡ ወይወፅኡ
  choice: में आ-जा रहे थे
  rationale: युग्म क्रियाएँ भीतर जाने और बाहर आने की निरन्तर गतिविधि दिखाती हैं; हिन्दी का ‘आ-जा रहे थे’ इसे संक्षेप और स्वाभाविकता से व्यक्त करता है।
theological_decisions:
- issue: विशाल-संख्या सूत्र को परिचित धर्मग्रन्थीय अभिव्यक्ति में सामान्यीकृत करना या मूल के निकट रखना
  choice: हज़ारों के हज़ार और दस हज़ार गुना दस हज़ार
  alternative: लाखों-करोड़ों अथवा असंख्य असंख्य
  rationale: मूल के प्रलयदर्शी संख्यात्मक सूत्र की विशिष्टता सुरक्षित रखी गई है; दानिय्येल, प्रकाशितवाक्य या प्रचलित हिन्दी बाइबिल की भाषा पीछे से आरोपित नहीं की गई।
- issue: ቤት की स्वर्गीय पहचान को मन्दिर या महल के रूप में निश्चित करना
  choice: भवन
  alternative: मन्दिर; महल; निवासस्थान
  rationale: प्रसंग दिव्य निवास का संकेत देता है, किन्तु मूल केवल ‘घर/भवन’ कहता है। ‘भवन’ उस संकेत को खुला रखता है और धर्मवैचारिक पहचान निश्चित नहीं करता।
- issue: आकाशों के ऊपर होने वाले सम्बन्धवाचक उपवाक्य का सम्बन्ध
  choice: पवित्र स्वर्गदूत जो आकाशों के ऊपर हैं
  alternative: आकाशों के ऊपर स्थित भवन में आने-जाने वाले पवित्र स्वर्गदूत
  rationale: मूल शब्दक्रम में यह पद ‘पवित्र स्वर्गदूतों’ का विशेषण करता है; इसे भवन की स्थिति बताने वाला बनाना अनावश्यक पुनर्व्याख्या होगी।
