  register: भाषा आधुनिक मानक हिन्दी, गरिमामय और सामान्य पाठक के लिए स्पष्ट रखी गई है। संख्यात्मक पुनरुक्ति जानबूझकर सुरक्षित है। नामों में स्रोत-आधारित लिप्यंतरण और वाक्य में हिन्दी की स्वाभाविक लय के बीच संतुलन रखा गया है।
