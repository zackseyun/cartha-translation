base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/004.yaml
  text: And he showed me all the hidden things of the ends of heaven[a], and all the storehouses of the stars and the lights[c][b], from where they all come forth before the face of the holy ones.
translation:
  language: hi
  text: और उसने मुझे आकाश के छोरों की सब छिपी हुई वस्तुएँ और तारों तथा ज्योतियों[a] के सभी भंडार दिखाए, जहाँ से वे सभी पवित्र जनों के सम्मुख[b] निकलते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तारों तथा प्रकाशमान पिंडों।” गीइज़ पाठ तारों को स्वर्गीय ज्योतियों की एक अधिक व्यापक श्रेणी से अलग करता है।
    reason: lexical_alternative
  - marker: b
    text: “पवित्र जनों के सम्मुख” का मूल गीइज़ पद शाब्दिक रूप से “पवित्र जनों के मुख के सामने” है; यह सेमिटिक शैली की अभिव्यक्ति “पवित्र जनों की उपस्थिति में” का अर्थ देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: አርአየኒ
  choice: उसने मुझे ... दिखाए
  rationale: कारक क्रिया का सीधा और स्वाभाविक हिन्दी रूप; दर्शन-वृत्तांत की संरचना बनाए रखता है।
- source_word: ኵሎ ኅቡኣተ
  choice: सब छिपी हुई वस्तुएँ
  rationale: यह अदृश्य या गुप्त वास्तविकताओं को व्यक्त करता है और केवल गूढ़ 'रहस्यों' तक अर्थ को सीमित नहीं करता।
- source_word: አጽናፈ ሰማይ
  choice: आकाश के छोरों
  rationale: ब्रह्मांडीय स्थान की मूल कल्पना को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: መዛግብተ
  choice: भंडार
  rationale: स्वर्गीय कक्षों या संग्रह-स्थानों की प्रलयदर्शी छवि के लिए स्वाभाविक हिन्दी शब्द।
- source_word: ከዋክብት ወብርሃናት
  choice: तारों तथा ज्योतियों
  rationale: दो अलग पदों का भेद बनाए रखता है; 'ज्योतियाँ' तारों से व्यापक खगोलीय प्रकाशों को सूचित कर सकती हैं।
- source_word: ኵሎሙ
  choice: वे सभी
  rationale: मूल पाठ के स्पष्ट सर्वसमावेशी बल को बनाए रखता है।
- source_word: እምኀበ ወፅኡ
  choice: जहाँ से ... निकलते हैं
  rationale: उद्गम और बाहर आने की गति दोनों को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ለገጸ ቅዱሳን
  choice: पवित्र जनों के मुख के सामने
  rationale: सेमिटिक शैली के शाब्दिक चित्र को सुरक्षित रखता है; आशय उपस्थिति में होना है, जिसे पादटिप्पणी स्पष्ट करती है।
theological_decisions:
- issue: '''पवित्र जनों'' की पहचान'
  choice: पवित्र जनों
  alternative: संत; स्वर्गदूत; पवित्र प्राणी
  rationale: इस स्वर्गीय संदर्भ में इनका संकेत स्वर्गीय पवित्र प्राणियों की ओर हो सकता है, पर मूल पाठ उनकी पहचान को संकीर्ण रूप से निर्धारित नहीं करता; अतः व्यापक अभिव्यक्ति रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रलयदर्शी शैली रखी गई है। वाक्य को पठनीय बनाने के साथ मूल की ब्रह्मांडीय छवियाँ, 'वे सभी' का बल, और 'पवित्र जनों' की संदिग्ध पहचान सुरक्षित रखी गई है।
