base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/035/001.yaml
  text: And from there I went toward the west[a], to the ends of the earth, and there I saw three open portals of heaven, like what I had seen in the east[d][c][b], corresponding to their portals and corresponding to their outlets.
translation:
  language: hi
  text: और वहाँ से मैं पृथ्वी के छोरों तक पश्चिम की ओर गया। वहाँ मैंने आकाश के तीन खुले हुए द्वार[a] देखे, वैसे ही जैसे मैंने पूर्व में देखे थे—द्वारों की माप के अनुसार और उनके निकासों की माप के अनुसार।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आकाश के प्रवेश-द्वार’ अथवा ‘आकाश की खिड़कियाँ’; गीइज़ शब्द आकाश में खुलने के स्थानों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: ‘माप के अनुसार’ का अर्थ समान माप, अनुपात या विन्यास के अनुसार भी हो सकता है। अंतिम पद में निकासों का उल्लेख है, पर इस अनुरूपता का ठीक स्वरूप स्पष्ट नहीं है।
    reason: genuine_ambiguity
lexical_decisions:
- source_word: ወእምህየ፡ ሖርኩ
  choice: और वहाँ से मैं ... गया
  rationale: यह दर्शन-यात्रा के क्रम को बताने वाला स्वाभाविक कथात्मक सूत्र है और गीइज़ की सरल गतिसूचक क्रिया को बिना अतिरिक्त अर्थ जोड़े व्यक्त करता है।
- source_word: መንገለ፡ ዐረብ
  choice: पश्चिम की ओर
  rationale: ዐረብ यहाँ सूर्यास्त से संबद्ध पश्चिम दिशा को दर्शाता है। अध्याय 33–36 की चार दिशाओं वाली संरचना भी इस अर्थ की पुष्टि करती है; ‘दक्षिण’ का गीइज़ शब्द अलग है।
- source_word: በአጽናፈ፡ ምድር
  choice: पृथ्वी के छोरों तक
  rationale: यह अनुवाद दर्शनीय ब्रह्मांड-भूगोल की चरम सीमाओं वाली छवि को बनाए रखता है और आधुनिक भौगोलिक भाषा से उसे सामान्य नहीं बनाता।
- source_word: ሠለስተ፡ ኆዋኅወ፡ ሰማይ፡ ርኁዋተ
  choice: आकाश के तीन खुले हुए द्वार
  rationale: ኆዋኅ heavenly openings/portals को सूचित करता है। ‘द्वार’ सरल, गरिमापूर्ण और वास्तु-संबंधी ब्रह्मांडीय चित्र के अनुकूल है; ርኁዋተ उनकी खुली अवस्था बताता है।
- source_word: በከመ፡ ርኢኩ፡ በምሥራቅ
  choice: वैसे ही जैसे मैंने पूर्व में देखे थे
  rationale: यह पहले देखे गए पूर्वी द्वारों से स्पष्ट तुलना बनाए रखता है और हिन्दी में पूर्वकालिक संदर्भ स्वाभाविक रूप से व्यक्त करता है।
- source_word: በአምጣነ፡ ኆዋኅው፡ ወበአምጣነ፡ ሞፃእቱ
  choice: द्वारों की माप के अनुरूप और उनके निकासों की माप के अनुरूप
  rationale: በአምጣነ में माप, अनुपात या अनुरूपता का भाव है। शब्दशः माप-संबंधी भाषा रखते हुए वाक्य को ऐसा बनाया गया है कि वह समान विन्यास या अनुपात—दोनों संभावनाओं को खुला रखे। ሞፃእት के निकलने/निकास के भाव को ‘निकासों’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: दर्शनीय ब्रह्मांड-भूगोल और आकाशीय वास्तु
  choice: ‘पृथ्वी के छोर’ और ‘आकाश के ... द्वार’ की मूर्त दर्शनीय भाषा को बनाए रखा गया है।
  alternative: इसे ‘बहुत दूर पश्चिम’ और ‘आकाश में खुली जगहें’ जैसी सामान्य आधुनिक भाषा में व्यक्त करना।
  rationale: पाठ एक व्यवस्थित ब्रह्मांड और उसके वास्तविक दर्शनीय स्थलों का चित्र प्रस्तुत करता है। अनुवाद को इस अपोकैलिप्टिक तनाव और वास्तु-छवि को आधुनिक प्राकृतिक विवरण में समतल नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली रखी गई है। ‘पृथ्वी के छोर’, ‘आकाश के द्वार’ और ‘निकास’ जैसे पद मूल की ब्रह्मांडीय छवि सुरक्षित रखते हैं। वाक्य को दो वाक्यों में बाँटकर पठनीय बनाया गया है, जबकि मूल का क्रम और तुलनात्मक संबंध अक्षुण्ण है।
