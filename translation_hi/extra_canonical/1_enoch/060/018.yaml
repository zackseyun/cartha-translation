base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/018.yaml
  text: And the spirit of the hail departed by the force of his might[a], and its spirit is by itself; and what goes up from it is like smoke[f][e][d][c][b], and its name is Frost.
translation:
  language: hi
  text: और ओलों की आत्मा उसकी सामर्थ्य के बल से निकल गई[a]; और उसके भीतर की आत्मा अपने-आप में अकेली है। उससे जो ऊपर उठता है, वह धुएँ के समान है, और उसका नाम पाला है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पंक्ति कठिन है। “उसकी सामर्थ्य” का सर्वनाम किसी व्यक्त सत्ता की ओर संकेत कर सकता है; इसे “उसकी शक्ति के कारण” या “उसके बल के द्वारा” भी समझा जा सकता है।
    reason: textual_and_grammatical_ambiguity
  - marker: b
    text: अंतिम वाक्यांश को ऊपर उठने वाली वस्तु का नाम मानकर अनूदित किया गया है। “उसका” का संदर्भ किसी व्यक्त सत्ता या किसी घटना से हो सकता है। एक वैकल्पिक पठन में यहाँ नाम “ओस” समझा जाता है।
    reason: lexical_and_referential_alternative
lexical_decisions:
- source_word: መንፈሰ
  choice: आत्मा
  rationale: यहाँ शब्द किसी मौसम-संबंधी ब्रह्मांडीय शक्ति या सक्रिय सत्ता को व्यक्त करता है। ‘आत्मा’ सर्वनाश-दर्शी मानवीकरण को बनाए रखता है; ‘हवा’ या ‘साँस’ अर्थ को अनावश्यक रूप से प्राकृतिक प्रक्रिया तक सीमित कर देते।
- source_word: ሐመዳ
  choice: ओले
  rationale: प्रसंग मौसम-संबंधी शक्तियों का वर्णन करता है। ‘ओले’ विनाशकारी जमे हुए वर्षण का स्पष्ट और स्वाभाविक हिन्दी रूप है; ‘पाला’ अगले नामकरण से भी अलग रहता है।
- source_word: ሐደገ
  choice: निकल गई
  rationale: क्रिया बाहर जाने या निकलने की गति दर्शाती है। यह अनिश्चितता बनाए रखती है कि आत्मा केवल बाहर आई या किसी स्थान से चली गई।
- source_word: በእንተ ኃይለ ዚአሁ
  choice: उसकी सामर्थ्य के बल से
  rationale: यह रूप प्रभावकारी शक्ति या कारण को व्यक्त करता है और मूल के दोहरे बल-संबंधी भाव को गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: ቦቱ ባሕቲቱ
  choice: उसके भीतर की आत्मा अपने आप में अकेली है
  rationale: ‘भीतर’ निकटतम मौसम-संबंधी घटना से आंतरिक संबंध दिखाता है, जबकि ‘अपने आप में अकेली’ ባሕቲቱ के ‘अकेली/अपने आप’ वाले अर्थ को ‘विशिष्ट’ जैसे आधुनिक विश्लेषणात्मक शब्द में बदलने से बचाता है।
- source_word: ዘየዐርግ እምኔሁ
  choice: उससे जो ऊपर उठता है
  rationale: सापेक्ष वाक्यांश किसी निकलती या उठती हुई वस्तु को इंगित करता है। यह उसके सटीक स्वरूप को निर्धारित किए बिना ऊर्ध्व गति बनाए रखता है।
- source_word: ከመ ጢስ
  choice: धुएँ के समान
  rationale: मूल की स्पष्ट दृश्य उपमा को सीधे बनाए रखा गया है; ‘वाष्प’ कहना चित्र को नरम और अधिक व्याख्यात्मक बना देता।
- source_word: ስሙ ደይክ
  choice: उसका नाम पाला है
  rationale: नामकरण-सूत्र ऊपर उठने वाली मानवीकृत मौसम-संबंधी सत्ता या घटना का नाम बताता है। उपलब्ध परामर्श-पाठ में अंतिम नाम ‘Frost’ है, इसलिए ‘पाला’ चुना गया; सर्वनाम की संदर्भगत अनिश्चितता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: मौसम-संबंधी ‘आत्माओं’ को केवल प्राकृतिक प्रक्रियाओं के रूप में प्रस्तुत करना या सर्वनाश-दर्शी मानवीकरण बनाए रखना
  choice: ‘आत्मा’ और नामकरण की मानवीकृत भाषा बनाए रखी गई
  alternative: इसे ‘ओलों की हवा/धारा’ और साधारण मौसम-विज्ञान की भाषा में व्यक्त करना
  rationale: पाठ ब्रह्मांडीय और मौसम-संबंधी वास्तविकताओं को व्यवस्थित सक्रिय शक्तियों के रूप में चित्रित करता है। आधुनिक प्राकृतिक व्याख्या थोपे बिना उसी कल्पना-जगत को बनाए रखना उचित है।
- issue: सर्वनाम का संदर्भ
  choice: मुख्य पाठ में शाब्दिक ‘उसकी/उसका’ रखा गया
  alternative: सर्वनाम को स्पष्ट करके परमेश्वर, ओलों या उठने वाली घटना से निश्चित रूप से जोड़ना
  rationale: गीज़ पाठ का पुल्लिंग सर्वनाम संदर्भ में एक से अधिक प्रकार से समझा जा सकता है। किसी एक धर्मवैज्ञानिक अभिकर्ता को निश्चित करना मूल की अस्पष्टता मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। वाक्य की असामान्य ब्रह्मांडीय छवि और मूल की संदर्भगत कठिनाई को सहज बनाने के नाम पर हटाया नहीं गया।
