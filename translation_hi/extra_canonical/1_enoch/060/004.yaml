base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/004.yaml
  text: And Michael sent another angel from among the holy ones[a], and he lifted me up. And when he lifted me up, my spirit entered in[c][b], for I was not able to endure the sight of that power and its shaking and the quaking of heaven.
translation:
  language: hi
  text: और मीकाएल ने पवित्र जनों में से एक और स्वर्गदूत को भेजा, और उसने मुझे उठा लिया। जब उसने मुझे उठाया, तब मेरी आत्मा भीतर आई[a], क्योंकि मैं उस सामर्थ्य के दर्शन, उसकी हलचल और आकाश के काँपने को सह नहीं सका।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘मेरी आत्मा भीतर आई।’ गीज़ अभिव्यक्ति कठिन है; इसका अर्थ यह भी हो सकता है कि मेरी आत्मा लौट आई, या मैं एक नई दर्शनीय अवस्था में आया।
    reason: lexical_alternative
  - marker: b
    text: 'गीज़ वाक्यरचना संकुचित है। इसका अनुवाद यह भी हो सकता है: ‘क्योंकि मैं उस सामर्थ्य के दर्शन, उसकी हलचल और आकाश का काँपना सह नहीं सका।’'
    reason: alternative_reading
lexical_decisions:
- source_word: ፈነወ
  choice: भेजा
  rationale: यह क्रिया किसी को भेजने या रवाना करने का सामान्य अर्थ देती है; ‘भेजा’ सहज और सटीक है।
- source_word: ካልአ መልአከ
  choice: एक और स्वर्गदूत
  rationale: वाक्यांश मीकाएल से भिन्न एक अतिरिक्त स्वर्गदूत को सूचित करता है; ‘एक और’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: እምቅዱሳን
  choice: पवित्र जनों में से
  rationale: पूर्वसर्ग किसी समूह में से चुने जाने का भाव देता है। प्रसंग में ये स्वर्गीय पवित्र प्राणी हैं, पर मुख्य पाठ मूल की संक्षिप्त अभिव्यक्ति बनाए रखता है।
- source_word: አንሥአኒ
  choice: मुझे उठा लिया
  rationale: क्रिया ऊपर उठाने का बोध देती है; यह दर्शनीय वृत्तांत की स्थानिक छवि को बनाए रखती है।
- source_word: መንፈስየ ገብአት
  choice: मेरी आत्मा लौट आई
  rationale: ገብአ का मूल अर्थ ‘लौटना/वापस आना’ है। पिछले पद में अचेत होकर गिरने के प्रसंग में यह होश या प्राण लौटने का स्वाभाविक मुहावरा है।
- source_word: ኢክህልኩ ተዓግሦ
  choice: मैं ... सह नहीं सका
  rationale: यह संयोजन किसी भारी अनुभव को सह पाने में असमर्थता व्यक्त करता है; हिन्दी में यह सीधा और स्वाभाविक है।
- source_word: ራእየ ዝኩ ኃይል
  choice: उस सामर्थ्य के दर्शन
  rationale: ራእየ देखी गई वस्तु या दृश्य को और ኃይል शक्ति अथवा सामर्थ्य को सूचित करता है। ‘दर्शन’ अलौकिक दृश्य के प्रसंग में उपयुक्त है, बिना उसके संदर्भ को निश्चित किए।
- source_word: ሀውከ
  choice: हलचल
  rationale: शब्द विक्षोभ, कोलाहल या उथल-पुथल का भाव दे सकता है। ‘हलचल’ इस व्यापकता को रखता है और अगले आकाशीय कंपन से अनावश्यक पुनरुक्ति से बचाता है।
- source_word: አንቀልቅለ ሰማይ
  choice: आकाश के काँपने
  rationale: यह वाक्यांश ब्रह्मांडीय कंपन की प्रलयदर्शी छवि प्रस्तुत करता है; ‘आकाश के काँपने’ का रूप स्पष्ट और सजीव है।
theological_decisions:
- issue: ‘पवित्र जनों’ की पहचान
  choice: मुख्य पाठ में ‘पवित्र जनों’ रखा गया, जिसका स्थानीय प्रसंग स्वर्गीय पवित्र प्राणियों की ओर संकेत करता है।
  alternative: ‘पवित्र स्वर्गदूतों’ या मानवीय ‘संतों’ के रूप में स्पष्ट करना।
  rationale: मीकाएल द्वारा उन्हीं में से एक और स्वर्गदूत भेजे जाने के कारण स्वर्गीय समुदाय सबसे स्वाभाविक अर्थ है; फिर भी मूल पाठ जितना कहता है, उससे अधिक पहचान मुख्य पाठ में नहीं जोड़ी गई।
- issue: ‘मेरी आत्मा लौट आई’ का अर्थ
  choice: इसे प्राण अथवा चेतना लौटने की कथात्मक अभिव्यक्ति के रूप में रखा गया।
  alternative: ‘मेरी आत्मा भीतर आई’ या ‘मैं आत्मा में एक नई दर्शनीय अवस्था में पहुँचा।’
  rationale: ገብአ ‘लौटना’ दर्शाता है, और पिछले पद में गिरने के बाद उठाए जाने का प्रसंग इस अर्थ का समर्थन करता है। इससे किसी विशिष्ट आत्मा-विज्ञान को आरोपित नहीं किया गया।
- issue: सामर्थ्य, हलचल और आकाश के काँपने का संबंध
  choice: ‘उस सामर्थ्य के दर्शन, उससे उत्पन्न हलचल और आकाश के काँपने’ के रूप में संबंध व्यक्त किया गया।
  alternative: 'तीनों को स्वतंत्र समांतर पद मानना: ‘उस सामर्थ्य का दर्शन, उसकी हलचल और आकाश का काँपना।’'
  rationale: गीज़ वाक्यरचना संकुचित है और संबंध पूरी तरह स्पष्ट नहीं। ‘से उत्पन्न’ एक स्वाभाविक पाठ है, जबकि पादटिप्पणी अन्य संभव संरचना सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘मीकाएल’, ‘स्वर्गदूत’, ‘आत्मा’, ‘सामर्थ्य’ और ‘दर्शन’ प्रलयदर्शी साहित्य के ऊँचे किंतु परिचित शब्द हैं।
