base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/011.yaml
  text: And another angel[a], who went with me and showed me what is hidden, told me what is first and what is last in heaven, in the height, and beneath the earth in the depth, and at the ends of heaven[c][b], and at the foundations of heaven.
translation:
  language: hi
  text: और एक अन्य स्वर्गदूत ने, जो मेरे साथ गया था और जिसने मुझे छिपी हुई बातें दिखाईं, मुझे बताया कि स्वर्ग में, ऊँचाई पर, और पृथ्वी के नीचे गहराई में, और स्वर्ग के छोरों पर तथा स्वर्ग की नींव पर क्या प्रथम है और क्या अंतिम है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “क्या प्रथम है और क्या अंतिम है” का अनुवाद “प्रथम और अंतिम” भी हो सकता है; यहाँ इसे उपाधि के बजाय प्रकट की गई बातों के वर्णन के रूप में समझा गया है।
    reason: lexical_alternative
  - marker: b
    text: प्रस्तुत गीइज़ प्रतिलेखन में इस पद के कुछ शब्द संभवतः लिप्यंतरण या OCR की त्रुटियों से बिगड़े हैं। पाठ-संशोधन के आधार पर यहाँ “छिपी हुई बातें” और “पृथ्वी के नीचे” अनुवाद किया गया है; “गहराई” स्थानसूचक अर्थ रखता है और उसे अधिक विशिष्ट “अथाह कुंड” नहीं बनाता।
    reason: textual_variant
lexical_decisions:
- source_word: ወይቤለኒ
  choice: मुझे बताया
  rationale: यह मुख्य कथन-क्रिया है और आगे आने वाली विषय-वस्तु—क्या प्रथम है और क्या अंतिम—को नियंत्रित करती है। हिंदी में ‘मुझे बताया’ इस संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: መልአክ ካልእ
  choice: एक अन्य स्वर्गदूत
  rationale: ካልእ किसी अतिरिक्त या दूसरे पात्र को सूचित करता है; यहाँ अनिवार्य रूप से क्रमवाचक ‘दूसरा’ कहना आवश्यक नहीं।
- source_word: ዘምስሌየ የሐውር
  choice: जो मेरे साथ चलता था
  rationale: यह संबंधवाचक उपवाक्य स्वर्गदूत को हनोक के साथ चलने वाले सहचर के रूप में पहचानता है और मूल की गतिशीलता बनाए रखता है।
- source_word: ወዘኅቡእ ያርእየኒ (पांडुलिपि-पाठ का पुनर्निर्माण)
  choice: और मुझे छिपी हुई बातें दिखाता था
  rationale: प्रस्तुत प्रतिलेखन का ወዘበኀቤኡ संभवतः OCR-विकृति है; संशोधित पाठ में ‘जो छिपा हुआ है’ और ‘मुझे दिखाता था’ का अर्थ निकलता है।
- source_word: ቀዳሜ ወድኃሬ
  choice: क्या प्रथम है और क्या अंतिम
  rationale: यह ब्रह्मांडीय सीमाओं के वर्णन में प्रयुक्त वर्णनात्मक युग्म है। इस रूप में अनुवाद करने से इसे अनुचित रूप से किसी ईश्वरीय उपाधि में नहीं बदला जाता।
- source_word: በሰማየ በውስተ ላዕሉ
  choice: स्वर्ग में, ऊँचाई पर
  rationale: दोनों स्थानसूचक अभिव्यक्तियों को अलग किंतु संबद्ध रखा गया है, जिससे मूल की ब्रह्मांडीय सूची और उसका ऊर्ध्व आयाम सुरक्षित रहता है।
- source_word: ወበታሕተ ምድር በመዓምቅ (पाठ-संशोधन)
  choice: और पृथ्वी के नीचे गहराई में
  rationale: प्रतिलिखित ደብለ को ምድር की दृश्य/OCR-विकृति मानने पर वाक्य का स्थानिक समानांतर स्पष्ट होता है। ‘गहराई’ अनिश्चित पाठ को अत्यधिक विशिष्ट ‘अथाह कुंड’ में नहीं बदलती।
- source_word: በአጽናፈ ሰማይ
  choice: स्वर्ग के छोरों पर
  rationale: አጽናፍ किनारों या चरम सीमाओं को सूचित करता है; ‘छोर’ आधुनिक हिंदी में सहज रहते हुए ब्रह्मांडीय बिंब बनाए रखता है।
- source_word: በመሠረተ ሰማይ
  choice: स्वर्ग की नींवों पर
  rationale: यह प्रकाशन-साहित्य की ब्रह्मांडीय स्थापत्य-छवि को सीधे बनाए रखता है। बहुवचन ‘नींवों’ मूल अभिव्यक्ति के वास्तु-बिंब के अनुकूल है।
theological_decisions:
- issue: क्या ቀዳሜ ወድኃሬ को उपाधि के रूप में ‘प्रथम और अंतिम’ कहना चाहिए
  choice: क्या प्रथम है और क्या अंतिम
  alternative: प्रथम और अंतिम
  rationale: संदर्भ में स्वर्गदूत ब्रह्मांडीय प्रदेशों और उनकी चरम सीमाओं का प्रकाशन करता है; यहाँ स्पष्ट ईश्वरीय आत्म-परिचय नहीं है। वर्णनात्मक रूप वास्तविक अस्पष्टता को रखते हुए बाद की उपाधि-संबंधी धर्मवैज्ञानिक अर्थछाया आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध शैली अपनाई गई है। लंबी ब्रह्मांडीय सूची को अल्पविरामों और ‘और/तथा’ से व्यवस्थित किया गया है। ‘स्वर्ग’, ‘पृथ्वी’, ‘छोर’ और ‘नींव’ जैसे सीधे शब्द मूल के प्रकाशनात्मक बिंब को सुरक्षित रखते हैं।
