- issue: ርእሰ መዋዕል पदवी का दानिय्येल की परंपरा से संबंध
  choice: दिनों का प्रधान
  alternative: अति प्राचीन
  rationale: मुख्य पाठ में गीज़ की विशिष्ट अभिव्यक्ति को अधिक निकटता से रखा गया है, ताकि परिचित दानिय्येली पदवी को चुपचाप आरोपित न किया जाए। प्रचलित धर्मग्रंथीय विकल्प पादटिप्पणी में दिया गया है।
