  yaml_path: translation/extra_canonical/1_enoch/060/002.yaml
  text: And the Head of Days was sitting on the throne of his glory[a], and the angels and the righteous were standing around him.
translation:
  language: hi
  text: और दिनों का प्रधान अपनी महिमा के सिंहासन पर बैठा हुआ था,[a] और स्वर्गदूत तथा धर्मी जन उसके चारों ओर खड़े थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अति प्राचीन।” यहाँ गीज़ पदवी का अधिक शाब्दिक अनुवाद “दिनों का प्रधान” किया गया है, ताकि इस अंश की अपनी शब्दावली बनी रहे और दानिय्येल की परिचित अभिव्यक्ति अनायास इसमें न लाई जाए।
    reason: lexical_alternative
