base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/012.yaml
  text: And the treasuries of the spirits[a], and how the spirits are divided, and how they are weighed out, and the portals of the spirits are reckoned, each according to the power of the spirit, and their powers for the light of the moon, and according to the power of righteousness[c][b], and the divisions of the stars by their names—every division shall be apportioned.
translation:
  language: hi
  text: और आत्माओं[a] के भंडार, और आत्माएँ कैसे बाँटी जाती हैं, और उन्हें कैसे मापा जाता है, और आत्माओं के द्वार कैसे गिने जाते हैं—प्रत्येक के लिए, आत्मा की सामर्थ्य के अनुसार—और चाँद के प्रकाश के लिए उनकी सामर्थ्य, और धार्मिकता की सामर्थ्य के अनुसार, और तारों के विभाग उनके नामों के अनुसार—हर विभाग बाँटा जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आत्माओं’ का अनुवाद ‘हवाओं’ भी हो सकता है। इस पद की कुछ क्रियाएँ और वाक्य-संबंध कठिन हैं; ‘मापा जाता है’ का अर्थ ‘तौला जाता है’ या ‘नियत मात्रा में बाँटा जाता है’ भी हो सकता है।
    reason: lexical_and_textual_ambiguity
lexical_decisions:
- source_word: መዛግብተ
  choice: भंडार
  rationale: यह शब्द संचित वस्तुओं के भंडार या कोष को दर्शाता है; ‘भंडार’ आधुनिक हिन्दी में स्वाभाविक रहते हुए ब्रह्मांडीय संचय का भाव बनाए रखता है।
- source_word: መንፈሳት
  choice: आत्माएँ
  rationale: गीज़ शब्द का अर्थ आत्माएँ, हवाएँ या श्वास हो सकता है। ‘आत्माएँ’ मूल की व्यक्तिकृत ब्रह्मांडीय अस्पष्टता बनाए रखता है; विकल्प पादटिप्पणी में दिया गया है।
- source_word: ወአፎ
  choice: और … कैसे
  rationale: यहाँ አፎ प्रश्नवाचक ‘कैसे’ है, ‘बादल’ नहीं; इससे परोक्ष प्रश्नों की क्रमिक रचना सुरक्षित रहती है।
- source_word: ይትካፈሉ
  choice: बाँटी जाती हैं
  rationale: क्रिया व्यवस्थित विभाजन या वितरण को सूचित करती है; कर्मवाच्य रूप मूल संरचना के अनुरूप है।
- source_word: ይደሉ
  choice: नापकर दिया जाता है
  rationale: कठिन क्रिया में मापने, तौलने या नियत मात्रा देने का भाव संभव है। यह चयन सटीक ब्रह्मांडीय वितरण का बिंब रखता है और अनिश्चितता पादटिप्पणी में बताता है।
- source_word: ይኄለቁ
  choice: गिने जाते हैं
  rationale: यह गणना या हिसाब किए जाने का सीधा और सहज हिन्दी रूप है।
- source_word: አናቅፅ
  choice: द्वार
  rationale: यह አንቀጽ का बहुवचन है और द्वारों/फाटकों को सूचित करता है; हनोक की ब्रह्मांडीय भाषा में ‘द्वार’ उपयुक्त है।
- source_word: በበኀይለ መንፈስ
  choice: हर एक आत्मा की सामर्थ्य के अनुसार
  rationale: दोहराया በበ वितरणात्मक अर्थ ‘हर एक के अनुसार’ देता है। ‘सामर्थ्य’ ऊँचे किंतु बोधगम्य रजिस्टर में ኀይል का अर्थ रखता है।
- source_word: ለብርሃነ ወርኅ
  choice: चाँद के प्रकाश के लिए
  rationale: यह संबंधसूचक पदबंध का सीधा, स्वाभाविक अनुवाद है।
- source_word: ኀይለ ጽድቅ
  choice: धार्मिकता की सामर्थ्य
  rationale: ‘धार्मिकता’ नैतिक-सही व्यवस्था और धर्ममयता दोनों का धर्मवैज्ञानिक विस्तार बनाए रखती है; केवल न्यायिक अर्थ तक सीमित नहीं करती।
- source_word: ክፍላተ ከዋክብት
  choice: तारों के विभाग
  rationale: यह तारों के व्यवस्थित विभाजनों या निर्धारित समूहों का भाव देता है और पद में बार-बार आने वाले बाँटने के विषय से मेल खाता है।
- source_word: በበ ስሞሙ
  choice: उनके नामों के अनुसार
  rationale: वितरणात्मक पद नामों के आधार पर वर्गीकरण या व्यवस्था दर्शाता है।
- source_word: ኵሉ ክፍለ ይትከፈል
  choice: हर विभाग बाँटा जाएगा
  rationale: अंतिम सार्वत्रिक कथन और कर्मवाच्य भविष्यकाल को निकटता से सुरक्षित रखता है।
theological_decisions:
- issue: መንፈሳት को ‘आत्माएँ’ या ‘हवाएँ’ कहना
  choice: आत्माएँ
  alternative: हवाएँ; श्वासें
  rationale: संदर्भ में प्राकृतिक शक्तियों और सजीव स्वर्गीय शक्तियों के बीच जानबूझकर अस्पष्टता हो सकती है। मुख्य पाठ में ‘आत्माएँ’ और पादटिप्पणी में ‘हवाएँ’ इस तनाव को सुरक्षित रखते हैं।
- issue: ጽድቅ को ‘धार्मिकता’ या ‘न्याय’ कहना
  choice: धार्मिकता
  alternative: न्याय
  rationale: यह प्रसंग विशेषतः न्यायालयीय न होकर ब्रह्मांडीय व्यवस्था का है। ‘धार्मिकता’ व्यापक धर्मवैज्ञानिक अर्थ रखती है, जबकि ‘न्याय’ संभावित वैकल्पिक अर्थ है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण अपोकैलिप्टिक शैली रखी गई है। लंबी समन्वित वाक्य-रचना मूल के क्रम को दर्शाती है, जबकि डैश से वितरणात्मक उपवाक्य स्पष्ट किया गया है। ‘चाँद’ सामान्य पाठक के लिए ‘चन्द्रमा’ से अधिक सहज है; ‘सामर्थ्य’, ‘धार्मिकता’ और ‘विभाग’ ऊँचे किंतु समझने योग्य शब्द हैं।
