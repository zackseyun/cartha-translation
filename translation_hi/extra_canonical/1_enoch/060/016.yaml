base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/016.yaml
  text: And the spirit of the sea is male and strong[a], and according to the might of its strength he holds it back with a rein[c][b], and thus it is driven out and scattered among all the mountains of the earth.
translation:
  language: hi
  text: और समुद्र की आत्मा नर और बलवान है[a]। समुद्र की अपनी प्रबल शक्ति के अनुसार वह लगाम से उसे पीछे खींचता है[c][b]; और इस प्रकार उसे बाहर निकाला जाता और पृथ्वी के सभी पहाड़ों पर बिखेरा जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समुद्र की वायु।” गीज़ शब्द का अर्थ “आत्मा,” “वायु” या “श्वास” हो सकता है; यहाँ मानवीकरण के कारण मुख्य पाठ में “आत्मा” रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: यह चित्र संभवतः समुद्र की शक्ति को लगाम से रोकने और फिर उसे पृथ्वी के पहाड़ों पर फैलाने का है—शायद कुहरे, फुहार या तूफ़ानी बादलों के रूप में। केवल उपलब्ध गीज़ पाठ से इसकी ठीक प्रक्रिया स्पष्ट नहीं है।
    reason: cultural_note
  - marker: c
    text: 'एक अन्य समझ: “उसकी शक्ति के पराक्रम के अनुसार,” जिसमें “उसकी” को समुद्र की आत्मा से जोड़ा जाता है; पर गीज़ का स्त्रीलिंग प्रत्यय अधिक स्वाभाविक रूप से समुद्र की ओर संकेत करता है।'
    reason: previous_rendering
lexical_decisions:
- source_word: መንፈሰ ባሕር
  choice: समुद्र की आत्मा
  rationale: መንፈስ का अर्थ आत्मा, वायु या श्वास हो सकता है। यहाँ ब्रह्मांडीय शक्ति के मानवीकरण के कारण “आत्मा” मुख्य पाठ में उपयुक्त है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ተባዕታይ
  choice: नर
  rationale: यह शब्द स्पष्ट रूप से पुरुष लिंग बताता है। “नर” इस असामान्य किंतु जानबूझकर किए गए मानवीकरण को सीधे बनाए रखता है।
- source_word: ዕኑፅ
  choice: बलवान
  rationale: यह बल और दृढ़ता का भाव देता है; “बलवान” निकटवर्ती शक्ति-संबंधी भाषा से मेल खाता है और अनावश्यक तीव्रता नहीं जोड़ता।
- source_word: ኃይለ ጽንዐታ
  choice: समुद्र की अपनी प्रबल शक्ति
  rationale: स्त्रीलिंग प्रत्यय समुद्र की शक्ति की ओर संकेत करता है, आत्मा की नहीं। संज्ञाओं के बलवर्धक युग्म को सहज हिन्दी में “प्रबल शक्ति” से व्यक्त किया गया है।
- source_word: በአንቍ ይገብእ
  choice: वह लगाम से उसे पीछे खींचता है
  rationale: አንቍ लगाम या बागडोर की छवि देता है और क्रिया भीतर लाने, रोकने या पीछे खींचने का भाव रखती है। यह अनुवाद शक्तिशाली वस्तु को लगाम से नियंत्रित करने की सजीव छवि बचाता है।
- source_word: ትትነጻእ
  choice: वह बाहर निकाला जाता है
  rationale: रूप बाहर की ओर गति अथवा निष्कासन का भाव देता है। हिन्दी में कर्मवाच्य मूल की अस्पष्ट प्रक्रिया को बनाए रखता है।
- source_word: ትዘራእ
  choice: बिखेरा जाता है
  rationale: क्रिया का शाब्दिक अर्थ “बोया जाता है” हो सकता है, पर यहाँ फैलाव के संदर्भ में “बिखेरा जाता है” स्वाभाविक और अर्थानुकूल है।
- source_word: በአሉ አድባረ ምድር
  choice: पृथ्वी के सभी पहाड़ों के बीच
  rationale: यह पृथ्वी के पहाड़ों में व्यापक फैलाव को व्यक्त करता है और ब्रह्मांडीय संदर्भ को बनाए रखता है।
theological_decisions:
- issue: ब्रह्मांडीय शक्तियों का मानवीकरण
  choice: समुद्र की आत्मा को नर और बलवान कर्ता के रूप में बनाए रखना
  alternative: इसे निर्जीव “समुद्री वायु” मानना अथवा लिंग-सूचना हटा देना
  rationale: गीज़ पाठ आत्मा को स्पष्टतः पुरुष रूप में प्रस्तुत करता है। मानवीकरण को बनाए रखना दर्शनात्मक भाषा और उसकी धार्मिक अस्पष्टता के प्रति अधिक निष्ठावान है।
- issue: “उसकी शक्ति” का संदर्भ
  choice: शक्ति को समुद्र की अपनी शक्ति मानना
  alternative: शक्ति को पुरुष आत्मा की शक्ति मानना
  rationale: ጽንዐታ का स्त्रीलिंग प्रत्यय समुद्र की ओर संकेत करता है, जबकि आत्मा पुरुष रूप में चिह्नित है। इसलिए मुख्य पाठ व्याकरणिक भेद को स्पष्ट करता है, और परंपरागत वैकल्पिक समझ पादटिप्पणी में दी गई है।
- issue: बाहर निकाले और बिखेरे जाने वाली वस्तु
  choice: हिन्दी सर्वनाम “वह” द्वारा संदर्भ को पूरी तरह निश्चित न करना
  alternative: स्पष्ट रूप से समुद्र, जल, कुहरा या बादल कहना
  rationale: गीज़-केवल साक्ष्य क्रिया-विधि और दृश्य वस्तु को पूरी तरह स्पष्ट नहीं करता; इसलिए पाठ में वास्तविक अस्पष्टता बनाए रखी गई है।
