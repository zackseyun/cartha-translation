base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/009.yaml
  text: And I asked another angel that he should show me the power of those monsters[a], how they were separated on one day and were cast[d][c][b], one into the depths of the sea and one onto the dry land of the wilderness.
translation:
  language: hi
  text: 'और मैंने एक अन्य स्वर्गदूत से पूछा कि वह मुझे उन विकराल प्राणियों[a] की सामर्थ्य[b] दिखाए—कि वे एक दिन कैसे अलग किए गए और फेंक दिए गए: एक समुद्र की गहराई में और दूसरा निर्जन प्रदेश की सूखी भूमि पर।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आसपास के प्रसंग में इन दोनों ब्रह्मांडीय प्राणियों की पहचान अधिक स्पष्ट है, पर इस पद में उनके नाम नहीं दिए गए हैं।
    reason: cross_reference
  - marker: b
    text: या “बल”; यहाँ प्रयुक्त गीइज़ शब्द मुख्यतः शक्ति या सामर्थ्य को दर्शाता है, यद्यपि संदर्भ में यह इन प्राणियों की प्रभावशाली प्रकृति का संकेत भी दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'अंतिम वाक्यांश कठिन है। गीइज़ पाठ समुद्र के विपरीत एक सूखे, निर्जन क्षेत्र को रखता है; इसका अधिक शाब्दिक अनुवाद हो सकता है: “सूखी भूमि पर, निर्जन प्रदेश में।”'
    reason: textual_difficulty
lexical_decisions:
- source_word: ተስእእክዎ
  choice: मैंने ... से पूछा
  rationale: दर्शी द्वारा स्वर्गदूत से किए गए सीधे प्रश्न/निवेदन को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ካልእ መልአክ
  choice: एक दूसरे स्वर्गदूत
  rationale: कथा में पिछले स्वर्गदूतीय मार्गदर्शक से भिन्न स्वर्गदूत की ओर संकेत सुरक्षित रहता है।
- source_word: ያርእየኒ
  choice: वह मुझे ... दिखाए
  rationale: पूछने के बाद आने वाले आश्रित निवेदन का भाव स्वाभाविक हिन्दी में रखता है।
- source_word: ኃይሎሙ
  choice: सामर्थ्य
  rationale: मूल शब्द के शक्ति या बल संबंधी केंद्रीय अर्थ को गरिमापूर्ण और बोधगम्य हिन्दी में रखता है; संदर्भगत व्यापकता पादटिप्पणी में सुरक्षित है।
- source_word: እሉክ ዐናብርት
  choice: उन विकराल प्राणियों
  rationale: दूरवाची बहुवचन का अर्थ ‘उन’ से और इन असाधारण ब्रह्मांडीय जीवों का भयावह स्वरूप ‘विकराल प्राणियों’ से व्यक्त होता है, बिना इस पद में उनके नाम जोड़ने के।
- source_word: ተሌለዩ
  choice: अलग किए गए
  rationale: 'मूल का कर्मवाच्य सुरक्षित है: वे स्वयं अलग नहीं हुए, बल्कि अलग किए गए।'
- source_word: በአሐቲ ዕለት
  choice: एक ही दिन
  rationale: एक दिन में/एक ही दिन की समय-सूचना को बिना अधिक व्याख्या के स्पष्ट करता है।
- source_word: ተወድዩ
  choice: फेंक दिए गए
  rationale: बहुवचन कर्मवाच्य दोनों प्राणियों पर लागू होता है और बलपूर्वक रखे जाने का भाव बनाए रखता है।
- source_word: በልጕተ ባሕር
  choice: समुद्र की गहराई में
  rationale: सिर्फ समुद्र नहीं, उसके गहरे भाग का स्थानगत अर्थ व्यक्त करता है।
- source_word: በየብስ በድው
  choice: निर्जन प्रदेश की सूखी भूमि पर
  rationale: सूखी भूमि और निर्जन/मरुस्थलीय क्षेत्र, दोनों तत्वों को रखते हुए समुद्र के साथ विरोध स्पष्ट करता है।
theological_decisions:
- issue: दो प्राणियों की पहचान
  choice: मुख्य पाठ में सामान्य पद ‘विकराल प्राणियों’ रखा गया है।
  alternative: आसपास के संदर्भ के आधार पर उन्हें लेव्यातान और बेहेमोत नाम देना।
  rationale: इस पद का गीइज़ पाठ उनके विशिष्ट नाम नहीं देता; अतः निकटवर्ती संदर्भ की पहचान को मुख्य पाठ में आरोपित नहीं किया गया।
- issue: दोनों प्राणियों को फेंके जाने का व्याकरणिक संबंध
  choice: बहुवचन कर्मवाच्य ‘फेंक दिए गए’ को दोनों प्राणियों पर लागू किया गया है।
  alternative: क्रिया को केवल पहले प्राणी के लिए एकवचन ‘फेंक दिया गया’ समझना।
  rationale: गीइज़ क्रिया बहुवचन है और उसके बाद ‘एक... और दूसरा...’ दोनों के अलग-अलग स्थान बताए गए हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘विकराल प्राणी’ अपोकैलिप्टिक दृश्य की असाधारणता बनाए रखता है, जबकि ‘राक्षस’ जैसे अधिक सांस्कृतिक या धार्मिक अर्थभार वाले शब्द से बचता है।
