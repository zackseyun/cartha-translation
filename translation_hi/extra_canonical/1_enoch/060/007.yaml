base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/007.yaml
  text: 'And on that day the two monsters were separated[a]: a female monster whose name is Lewyatan, to dwell in the abyss of the sea[d][c][b], above the springs of the waters.'
translation:
  language: hi
  text: 'और उस दिन वे दोनों विकराल प्राणी अलग किए गए: एक मादा विकराल प्राणी, जिसका नाम लेवायातान है[a], समुद्र के अथाह गह्वर में[b], जल-स्रोतों के ऊपर[c], निवास करने के लिए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लेवायातान वही प्रसिद्ध समुद्री प्राणी है जिसका नाम प्रायः “लिव्यातान” या “लेविथान” लिखा जाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “समुद्र की गहराई में”; गीज़ शब्द किसी गहरे अथवा गर्त-सदृश क्षेत्र को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: यह कथन उसके निवास-स्थान को “जल-स्रोतों” के संबंध में रखता है। यहाँ आधुनिक भूगोल नहीं, बल्कि प्राचीन ब्रह्मांड-वर्णन की छवि सुरक्षित रखी गई है।
    reason: cultural_note
lexical_decisions:
- source_word: ተካፈሉ
  choice: अलग किए गए
  rationale: गीज़ का पूर्ण भूतकाल, तृतीय पुरुष बहुवचन, एक घटित पृथक्करण बताता है; कर्मवाच्य रूप स्रोत के ‘बाँटने/अलग करने’ के भाव को सुरक्षित रखता है।
- source_word: በይእቲ ዕለት
  choice: उस दिन
  rationale: यह काल-सूचक सर्वनामीय पद का स्वाभाविक आधुनिक हिन्दी रूप है और दर्शनीय-वर्णन की गंभीरता बनाए रखता है।
- source_word: ክልኤቱ ዐናብርት
  choice: वे दोनों विकराल प्राणी
  rationale: ‘विकराल प्राणी’ इन असाधारण पौराणिक-सृष्टिगत जीवों का आशय देता है, पर ‘दानव’ जैसे संभावित नैतिक या दुष्टतासूचक अर्थ को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: ዐንበሪ አንስትያዊት
  choice: एक मादा विकराल प्राणी
  rationale: मूल में प्राणी-संज्ञा और स्त्रीलिंग विशेषण दोनों हैं; हिन्दी में संज्ञा दोहराने से संदर्भ स्पष्ट रहता है।
- source_word: ዘስማ ሌዋያታን
  choice: जिसका नाम लेवायातान था
  rationale: नाम को गीज़ रूप के निकट देवनागरी में लिप्यंतरित किया गया है। हिन्दी में भूतकालीन कथन के भीतर ‘था’ स्वाभाविक है; इससे नाम के अस्तित्व की अवधि पर कोई धार्मिक दावा नहीं किया जाता।
- source_word: ከመ ትኅድር
  choice: निवास करने के लिए
  rationale: यह प्रयोजनसूचक आशय को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: በልጕተ ባሕር
  choice: समुद्र के अथाह गह्वर में
  rationale: ‘गह्वर’ गहरे अथवा गर्त-सदृश स्थान को दर्शाता है और प्राचीन ब्रह्मांड-वर्णन की प्रबल छवि बचाता है; ‘अथाह’ आधुनिक पाठक के लिए अर्थ स्पष्ट करता है।
- source_word: መልዕልተ አነቅዕተ ማያት
  choice: जल-स्रोतों के ऊपर
  rationale: यह स्थान-संबंध और आदिम जल-स्रोतों की प्राचीन ब्रह्मांडीय छवि दोनों को यथासंभव सीधे रूप में रखता है।
theological_decisions:
- issue: प्रलयदर्शी ब्रह्मांड-वर्णन के असाधारण जीवों का नामकरण
  choice: विकराल प्राणी
  alternative: दैत्य; पशु; प्राणी
  rationale: ‘विकराल प्राणी’ मूल की असाधारणता और विशालता बनाए रखता है, लेकिन ‘दैत्य’ से जुड़ी दुष्टता अथवा किसी विशिष्ट धार्मिक वर्गीकरण को पाठ में नहीं जोड़ता।
- issue: पृथक्करण का काल
  choice: अलग किए गए
  alternative: अलग किए जाएँगे
  rationale: गीज़ का क्रियारूप पूर्ण भूतकाल है और यहाँ पृथक्करण को घटित घटना के रूप में प्रस्तुत करता है; भविष्यकाल पाठ के काल-संबंध को बदल देता।
- issue: लेवायातान नाम का रूप
  choice: लेवायातान
  alternative: लिव्यातान; लेविथान
  rationale: मुख्य पाठ में गीज़ साक्ष्य से निकट लिप्यंतरण रखा गया है; अधिक परिचित नामरूप को टिप्पणी में बताना पाठ और परंपरागत पहचान दोनों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु प्रलयदर्शी अंश के अनुरूप गरिमापूर्ण और चित्रात्मक रखी गई है। ‘विकराल प्राणी’ साधारण पशु से अधिक असाधारण सत्ता का बोध कराता है, पर अनावश्यक नैतिक अर्थ नहीं जोड़ता। मुख्य वाक्य में भूतकाल मूल गीज़ क्रिया के पूर्ण रूप के अनुसार रखा गया है।
