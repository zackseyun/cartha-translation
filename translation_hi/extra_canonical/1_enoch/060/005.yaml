base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/005.yaml
  text: And Michael said to me[a], “Why are you troubled by such a vision? Until today the day of his mercy has lasted[c][b], and he has been merciful and slow to wrath toward those who dwell upon the dry land.”
translation:
  language: hi
  text: और मीकाएल ने मुझसे कहा, “ऐसे दर्शन से तुम क्यों व्याकुल हो?[a] आज तक उसकी दया का दिन बना हुआ है, और वह सूखी भूमि[b] पर रहने वालों के प्रति दयालु और क्रोध करने में धीमा रहा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऐसे दर्शन को लेकर तुम क्यों व्याकुल हो?” गीज़ में प्रश्न का वाक्य-विन्यास कठिन है, पर यहाँ ‘दर्शन’ संज्ञा है, ‘तुमने देखा’ क्रिया नहीं।
    reason: lexical_alternative
  - marker: b
    text: ‘सूखी भूमि’ आसपास के प्रसंग में समुद्र के विपरीत भूमि पर रहने वाले प्राणियों की ओर विशेष संकेत कर सकती है।
    reason: cultural_note
lexical_decisions:
- source_word: ወይቤለኒ፡ ሚካኤል
  choice: और मीकाएल ने मुझसे कहा
  rationale: सामान्य कथात्मक आरंभ को सहज हिन्दी में रखा गया है और नाम का लिप्यंतरण किया गया है।
- source_word: ምንተ፡ ርእየ፡ ዘከመዝ፡ ተሀውከ
  choice: ऐसे दर्शन से तुम क्यों व्याकुल हो?
  rationale: यहाँ ርእየ को क्रिया ‘तुमने देखा’ नहीं, बल्कि ‘दर्शन’ संज्ञा का रूप माना गया है। कठिन गीइज़ वाक्य-विन्यास का स्वाभाविक अर्थ दर्शन के कारण हुई व्याकुलता के विषय में प्रश्न है।
- source_word: እስከ፡ ዮም
  choice: आज तक
  rationale: मूल की समय-संबंधी सीमा और प्रकाशनात्मक स्वर दोनों सुरक्षित रहते हैं।
- source_word: ሀለወት፡ ዕለተ፡ ምሕረቱ
  choice: उसकी दया का दिन चला आ रहा है
  rationale: ‘दिन’ को बनाए रखकर संभावित युगांत-संबंधी अर्थ सुरक्षित रखा गया है; ‘चला आ रहा है’ वर्तमान तक जारी अवधि व्यक्त करता है।
- source_word: ወሀሎ፡ መሓሪ
  choice: और वह ... दयालु ... रहा है
  rationale: पूर्ववर्ती समय-सूचक कथन के साथ निरंतर दयालुता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ወርኁቀ፡ መዓት
  choice: और क्रोध करने में धीमा रहा है
  rationale: मूलतः ‘क्रोध से दूर’ का भाव है; चुना हुआ वाक्यांश दिव्य सहनशीलता को स्पष्ट करता है, बिना न्याय के भाव को मिटाए।
- source_word: ላዕለ፡ እለ፡ የኃድሩ፡ ዲበ፡ የብስ
  choice: सूखी भूमि पर रहने वालों के प्रति
  rationale: የብስ का विशिष्ट अर्थ ‘सूखी भूमि’ है; आसपास के समुद्री संदर्भों के साथ संभावित विरोध बनाए रखा गया है।
theological_decisions:
- issue: ‘उसकी दया’ में सर्वनाम का संदर्भ
  choice: ‘उसकी’ को बनाए रखा गया है; संदर्भ परमेश्वर की ओर संकेत करता है, यद्यपि इस पद में उसका नाम नहीं आता।
  alternative: इसे निरपेक्ष रूप में ‘दया का दिन’ कहा जा सकता था।
  rationale: मूल का संबंधसूचक सर्वनाम सुरक्षित रखना उचित है और इससे दया तथा आने वाले न्याय के बीच का तनाव बना रहता है।
- issue: दया और क्रोध के बीच संबंध
  choice: दया की वर्तमान अवधि और क्रोध में विलंब—दोनों को साथ रखा गया है।
  alternative: वाक्य को केवल परमेश्वर की स्थायी दयालुता के कथन के रूप में सरल किया जा सकता था।
  rationale: मूल पाठ दया को एक जारी ‘दिन’ और क्रोध से दूरी के रूप में प्रस्तुत करता है; इसे स्थायी धर्मसिद्धान्त में बदलना पाठ की युगांत-संबंधी तनावशीलता को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘दया का दिन’ जैसे मूल के विशिष्ट रूपक को बनाए रखा गया है, जबकि कठिन आरंभिक प्रश्न को अर्थ-स्पष्ट हिन्दी में प्रस्तुत किया गया है।
