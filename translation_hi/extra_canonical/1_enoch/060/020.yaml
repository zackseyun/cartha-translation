base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/020.yaml
  text: And the spirit of the dew has its dwelling at the ends of heaven[a], and it is joined with the storehouses of the rain; and its course is in winter and in summer, and its clouds and the clouds of the mist are joined together[d][c][b], and one gives to another.
translation:
  language: hi
  text: और ओस की आत्मा का निवास स्वर्ग के छोरों पर है[a], और वह वर्षा के भंडारों से जुड़ी हुई है। उसकी गति जाड़े और गरमी, दोनों ऋतुओं में होती है[b]; उसके बादल और कुहरे के बादल आपस में जुड़े हुए हैं[c], और एक दूसरे को देता है[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘निवास’ के लिए प्रयुक्त शब्द का अर्थ ‘रहने का स्थान’ भी हो सकता है; यह आगे वर्षा के ‘भंडारों’ के लिए प्रयुक्त शब्द से भिन्न है।
    reason: lexical_distinction
  - marker: b
    text: ‘गति’ का अनुवाद ‘परिपथ,’ ‘मार्ग’ या ‘पथ’ भी हो सकता है; इस मौसमी ब्रह्मांड-वर्णन में ठीक आशय अनिश्चित है।
    reason: lexical_alternative
  - marker: c
    text: ‘कुहरा’ के स्थान पर ‘धुंध’ या ‘धूमिल धुंध’ भी संभव है।
    reason: lexical_alternative
  - marker: d
    text: अंतिम वाक्य ओस, वर्षा और बादलों के बीच किसी प्रकार के आदान-प्रदान का संकेत दे सकता है। इसका अनुवाद ‘एक दूसरे को देता है’ या ‘हर एक दूसरे को देता है’ भी हो सकता है।
    reason: ambiguity
lexical_decisions:
- source_word: መንፈሰ ጠል
  choice: ओस की आत्मा
  rationale: መንፈስ का अर्थ आत्मा, वायु या श्वास हो सकता है। यहाँ प्रलयदर्शी ब्रह्मांड-वर्णन में प्राकृतिक शक्ति के मानवीकरण को बनाए रखने के लिए ‘आत्मा’ चुना गया है।
- source_word: ማኅደሩ
  choice: उसका निवास
  rationale: यह शब्द निवास या रहने के स्थान को दर्शाता है और इसी पद में वर्षा के लिए प्रयुक्त መዛግብት (‘भंडार’) से भिन्न है; इसलिए दोनों को एक ही शब्द से नहीं अनूदित किया गया।
- source_word: በአጽናፈ ሰማይ
  choice: स्वर्ग के छोरों पर
  rationale: यह प्राचीन ब्रह्मांड-विज्ञान के अंतिम सिरों या सीमाओं का चित्र सुरक्षित रखता है और आधुनिक स्थान-विवरण आरोपित नहीं करता।
- source_word: መዛግብተ ዝናም
  choice: वर्षा के भंडारों
  rationale: बहुवचन रूप और प्राकृतिक शक्तियों के स्वर्गीय भंडारों की प्रलयदर्शी छवि दोनों सुरक्षित रखे गए हैं।
- source_word: ምሕዋረ
  choice: मार्ग
  rationale: शब्द गति, परिपथ या पथ को सूचित कर सकता है। ‘मार्ग’ स्वाभाविक हिन्दी है और अनिश्चितता को पादटिप्पणी में रखा गया है।
- source_word: በክረምት ወበሐጋይ
  choice: जाड़े और गरमी दोनों ऋतुओं में
  rationale: मूल के ऋतु-युग्म को सामान्य, सहज हिन्दी में रखा गया है; इसे विशेष रूप से वर्षा और शुष्क ऋतु मानकर सीमित नहीं किया गया।
- source_word: ደመና ጊሜ
  choice: कुहरे के बादल
  rationale: ጊሜ का ठीक आशय अनिश्चित है; ‘कुहरा’ बादल के साथ उपयुक्त वायुमंडलीय चित्र देता है, जबकि धुंध भी संभव है।
- source_word: አሐዱ ለአሐዱ ይሁብ
  choice: एक दूसरे को देता है
  rationale: एकवचन क्रिया और शाब्दिक पारस्परिक/क्रमिक देने की छवि को बनाए रखा गया है, बिना यह निश्चित किए कि वास्तव में कौन-सी प्राकृतिक सत्ता क्या देती है।
theological_decisions:
- issue: መንፈሰ को निर्जीव मौसमी ‘वायु’ माना जाए या मानवीकृत ब्रह्मांडीय ‘आत्मा’
  choice: मानवीकृत ‘ओस की आत्मा’
  alternative: ओस की वायु / ओस की श्वास
  rationale: आसपास का प्रसंग स्वर्गीय भंडारों और ब्रह्मांडीय शक्तियों का प्रलयदर्शी वर्णन करता है। ‘आत्मा’ इस मानवीकरण को बचाती है, पर इसे किसी बाद की विशिष्ट धर्मसैद्धांतिक धारणा से नहीं जोड़ती।
- issue: अंतिम वाक्य में देने की क्रिया को स्पष्ट पारस्परिक विनिमय माना जाए या अस्पष्ट रखा जाए
  choice: ‘एक दूसरे को देता है’ द्वारा मूल की अस्पष्टता बनाए रखना
  alternative: ‘हर एक दूसरे को देता है’ कहकर पूर्ण पारस्परिकता स्पष्ट करना
  rationale: मूल वाक्य यह पूरी तरह स्पष्ट नहीं करता कि देने वाली सत्ताएँ कौन हैं या विनिमय पूर्णतः पारस्परिक है; इसलिए अनुवाद अतिरिक्त व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, किंतु प्रलयदर्शी साहित्य के अनुरूप गरिमापूर्ण रखी गई है। ‘स्वर्ग के छोर’, ‘आत्मा’ और ‘भंडार’ जैसे चित्रों को आधुनिक मौसम-विज्ञान में बदलने के बजाय मूल ब्रह्मांडीय कल्पना सुरक्षित रखी गई है। ‘जाड़ा’ और ‘गरमी’ सामान्य पाठक के लिए सहज हैं; वाक्य-रचना मूल के संबंधों को स्पष्ट रखते हुए अत्यधिक संस्कृतनिष्ठ नहीं बनाई गई।
