base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/019.yaml
  text: And the spirit of the mist is not joined with them in their storehouses[a], but its own storehouse is by itself; for its course is glorious in it, both in light and in darkness, and in winter and in summer[c][b], and its storehouse is an angel.
translation:
  language: hi
  text: और कुहरे की आत्मा[a] उनके साथ उनके भंडारों में संयुक्त नहीं होती, बल्कि उसका अपना भंडार अपने आप में अलग है; क्योंकि उसकी गति में महिमा है—प्रकाश और अंधकार में, शीतकाल और ग्रीष्मकाल में[b]—और उसका भंडार एक स्वर्गदूत है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आत्मा’ के मूल शब्द का अर्थ ‘वायु’ या ‘श्वास’ भी हो सकता है; यहाँ कुहरे को व्यक्तित्वयुक्त ब्रह्मांडीय शक्ति के रूप में प्रस्तुत किया गया जान पड़ता है।
    reason: lexical_alternative
  - marker: b
    text: उपलब्ध प्रतिलिपि में यहाँ का अंतिम ऋतु-सूचक शब्द त्रुटिपूर्ण प्रतीत होता है। संभवतः मूल पाठ ‘ग्रीष्मकाल’ था, जो ‘शीतकाल’ के साथ स्वाभाविक युग्म बनाता है।
    reason: textual_variant
  - marker: c
    text: अंतिम वाक्य कठिन है। गीइज़ पाठ का सीधा अर्थ है, ‘उसका भंडार एक स्वर्गदूत है।’ संभव है कि आशय किसी स्वर्गदूतीय प्राणी के भंडार के साथ अभिन्न संबंध, अथवा उसके लिए नियुक्त होने का हो, पर मूल इस संबंध को स्पष्ट नहीं करता।
    reason: textual_difficulty
lexical_decisions:
- source_word: መንፈሰ ጊሜ
  choice: कुहरे की आत्मा
  rationale: ጊሜ का अर्थ यहाँ ‘कुहरा/धुंध’ है, ‘समुद्र’ नहीं। መንፈስ में ‘आत्मा’, ‘वायु’ और ‘श्वास’ का अर्थ-क्षेत्र है; सर्वनिष्ठ ब्रह्मांडीय चित्रण के कारण ‘आत्मा’ रखा गया है।
- source_word: ኢይትኃበር ምስሌሆሙ ውስተ መዛግብቲሆሙ
  choice: उनके साथ उनके भंडारों में नहीं मिलती
  rationale: यह अनुवाद ‘उनके साथ’ और ‘उनके भंडारों में’ दोनों संबंधों को स्पष्ट रूप से बनाए रखता है और क्रिया के जुड़ने/मिलने के भाव को व्यक्त करता है।
- source_word: መዝገበ ቦቱ ባሕቲቱ
  choice: उसका अपना भंडार अलग है
  rationale: ባሕቲቱ अलगाव और निजता पर बल देता है; ‘अपना’ और ‘अलग’ मिलकर इस बल को स्वाभाविक हिन्दी में रखते हैं।
- source_word: ምሕዋረ ዚአሁ ስብሐት ቦ
  choice: उसमें उसकी गति महिमामय है
  rationale: ‘गति’ ब्रह्मांडीय चाल, मार्ग या परिभ्रमण को अनावश्यक रूप से सीमित किए बिना व्यक्त करती है; ‘उसमें’ मूल के स्थानवाचक ቦ को सुरक्षित रखता है।
- source_word: በብርሃን ... በጽልመት ... በክረምት ... በሐጋይ
  choice: प्रकाश और अंधकार में, शीतकाल और ग्रीष्मकाल में
  rationale: दोनों समांतर युग्मों को समान हिन्दी संरचना में रखा गया है। अंतिम शब्द को प्रतिलिपि के ንጋይ के बजाय संभावित मूल ሐጋይ ‘ग्रीष्मकाल’ माना गया है, जो ክረምት ‘शीत/वर्षाकाल’ के साथ पारंपरिक युग्म बनाता है।
- source_word: መዝገበ ዚአሃ መልአክ ውእቱ
  choice: उसका भंडार एक स्वर्गदूत है
  rationale: वाक्य की असामान्य किंतु सीधी पहचान को ज्यों का त्यों रखा गया है; ‘स्वर्गदूत उसके भंडार पर नियुक्त है’ जैसा अर्थ मूल में स्पष्ट रूप से नहीं लिखा है।
theological_decisions:
- issue: कुहरे की ‘आत्मा’ को व्यक्तित्वयुक्त ब्रह्मांडीय सत्ता मानना या केवल प्राकृतिक वायु कहना
  choice: ‘कुहरे की आत्मा’ द्वारा व्यक्तित्वयुक्त सर्वनिष्ठ चित्रण बनाए रखा गया
  alternative: ‘कुहरे की वायु’ या ‘कुहरे की शक्ति’
  rationale: पाठ में ब्रह्मांडीय भंडारों और स्वर्गदूतीय व्यवस्था की भाषा है। ‘आत्मा’ इस चित्रण को आधुनिक प्राकृतिक व्याख्या में सीमित नहीं करती।
- issue: भंडार और स्वर्गदूत की अंतिम पहचान
  choice: 'मुख्य पाठ में सीधा कथन रखा गया: ‘उसका भंडार एक स्वर्गदूत है’'
  alternative: ‘उसके भंडार पर एक स्वर्गदूत नियुक्त है’
  rationale: वैकल्पिक पाठ अधिक सहज है, पर वह संबंध को व्याख्यात्मक ढंग से बदल देता है। कठिनाई को टिप्पणी में बताना मूल की तनावपूर्ण भाषा को चुपचाप सुधारने से बेहतर है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘भंडार’, ‘गति’, ‘महिमामय’, ‘शीतकाल’ और ‘ग्रीष्मकाल’ सर्वनिष्ठ ब्रह्मांडीय चित्रण को स्पष्ट रखते हैं। असामान्य अंतिम कथन को सरल बनाकर उसका अर्थ नहीं बदला गया।
