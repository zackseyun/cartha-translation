base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/006.yaml
  text: And when the day and the power and the punishment and the judgment come, which the Lord of Spirits has prepared for those who do not bow down to the righteous law, and for those who deny the righteous judgment, and for those who take his name in vain—that day has been prepared for the chosen as a covenant, and for sinners as an inquiry.
translation:
  language: hi
  text: और जब वह दिन, सामर्थ्य, दंड और न्याय आएँगे, जिन्हें आत्माओं के प्रभु ने उन लोगों के लिए तैयार किया है जो धार्मिकता के प्रभु को दण्डवत नहीं करते, जो धार्मिकता के प्रभु का इन्कार करते हैं, और जो उसका नाम व्यर्थ लेते हैं—वह दिन चुने हुओं के लिए वाचा के रूप में और पापियों के लिए जाँच के रूप में तैयार किया गया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዕለት፡ ወኃይል፡ ወመቅሠፍት፡ ወኵነኔ
  choice: वह दिन, सामर्थ्य, दंड और न्याय
  rationale: चार समन्वित संज्ञाओं की स्रोत-संरचना बनाए रखते हुए आधुनिक और गरिमापूर्ण हिन्दी प्रयोग किया गया है। መቅሠፍት में विपत्ति/दंड दोनों का भाव हो सकता है; न्याय के प्रसंग में ‘दंड’ उपयुक्त है।
- source_word: እግዚአ፡ መንፈሳት
  choice: आत्माओं के प्रभु
  rationale: पुस्तक की विशिष्ट उपाधि का औपचारिक और पारदर्शी अनुवाद।
- source_word: ኢይሰግዱ
  choice: आगे नहीं झुकते
  rationale: मूल क्रिया में झुकने अथवा दंडवत करने का भाव है; व्यवस्था के संदर्भ में ‘आगे नहीं झुकते’ स्वाभाविक हिन्दी है और अधीनता का अर्थ बचाता है।
- source_word: ይነሥኡ፡ ስሞ፡ በከ
  choice: उसका नाम व्यर्थ लेते हैं
  rationale: नाम को अनुचित या खोखले ढंग से लेने की पारंपरिक अर्थछाया को सहज हिन्दी में व्यक्त करता है।
- source_word: መሐላ
  choice: वाचा
  rationale: शब्द में शपथ/प्रतिज्ञा/वाचा का क्षेत्र है; चुने हुओं के लिए तैयार दिन के संदर्भ में ‘वाचा’ अंग्रेज़ी परामर्श-पाठ और धार्मिक प्रसंग दोनों से संगत है।
- source_word: ሐተታ
  choice: जाँच
  rationale: पूछताछ, छानबीन या लेखा-जाँच का भाव रखता है; ‘न्यायिक जाँच’ का आशय बिना अनावश्यक कठोर विस्तार के व्यक्त होता है।
theological_decisions:
- issue: ለእግዚ፡ ጽድቅ की दो समान संरचनाओं का अर्थ
  choice: पहली को ‘धर्ममय व्यवस्था’ और दूसरी को ‘धर्ममय न्याय’
  alternative: दोनों स्थानों पर ‘धार्मिकता के प्रभु’ अथवा ‘धर्मी प्रभु’
  rationale: स्रोत-पाठ की संक्षिप्त संरचना व्याकरणतः कठिन/बहुअर्थी है। निकट संदर्भ और परीक्षित अंग्रेज़ी परामर्श-पाठ क्रमशः law और judgment का समर्थन करते हैं, पर वैकल्पिक पाठ को पादटिप्पणियों में सुरक्षित रखा गया है।
- issue: चुने हुओं और पापियों के लिए दिन की भिन्न भूमिका
  choice: ‘वाचा’ और ‘जाँच’ का समानांतर विरोध बनाए रखा
  alternative: ‘उद्धार’ और ‘दोष-दंड’ जैसे व्याख्यात्मक शब्द जोड़ना
  rationale: मूल की धर्मवैचारिक तनावपूर्ण संक्षिप्तता को बिना विस्तार या संप्रदायगत व्याख्या के सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध। वाक्य की भविष्यकालीन न्याय-दिवस संरचना रखी गई है; अंतिम खंड को स्वाभाविक हिन्दी के लिए ‘...का दिन होगा’ के रूप में ढाला गया है।
