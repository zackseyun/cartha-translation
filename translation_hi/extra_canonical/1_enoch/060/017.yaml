base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/017.yaml
  text: And the spirit of the hoarfrost is its own angel[c][b][a], and the spirit of the hail is a good angel.
translation:
  language: hi
  text: और पाले की आत्मा ही उसका स्वर्गदूत है[a], और ओलों की आत्मा एक अच्छा स्वर्गदूत है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “वह उसका स्वर्गदूत है।” यहाँ कथन पाले की आत्मा और उससे संबद्ध स्वर्गदूत की पहचान करता है।'
    reason: literal_rendering
lexical_decisions:
- source_word: መንፈሰ
  choice: की आत्मा
  rationale: यह पद दोनों प्राकृतिक शक्तियों को व्यक्तित्वयुक्त ब्रह्मांडीय सत्ता के रूप में प्रस्तुत करता है; इसलिए केवल मौसम-संबंधी ‘हवा’ के बजाय ‘आत्मा’ मूल की सर्वनामी और अपोकैलिप्टिक छवि को बनाए रखता है।
- source_word: አስሐትያ
  choice: पाला
  rationale: यहाँ यह किसी स्वर्गदूत का नाम नहीं, बल्कि पाले अथवा तुषार के लिए प्रयुक्त मौसम-संबंधी संज्ञा है। आधुनिक हिन्दी में ‘पाला’ सहज और सटीक है।
- source_word: መልአክ
  choice: स्वर्गदूत
  rationale: इस अपोकैलिप्टिक संदर्भ में अलौकिक दूत अभिप्रेत है; ‘स्वर्गदूत’ साधारण मानवीय संदेशवाहक से भेद स्पष्ट करता है।
- source_word: ዚአሁ ውእቱ
  choice: स्वयं उसका ... है
  rationale: मूल का स्वामित्व-सूचक और योजक वाक्य-विन्यास बताता है कि पाले की आत्मा ही उससे संबद्ध स्वर्गदूत है; इसे किसी स्वर्गदूत के नामकरण के रूप में नहीं लिया गया।
- source_word: በረድ
  choice: ओले
  rationale: इस मौसम-संबंधी सूची में इसका सामान्य अर्थ ‘ओले’ है। हिन्दी में संबंधकारक बहुवचन रूप ‘ओलों की’ स्वाभाविक है।
- source_word: ኄር
  choice: भला
  rationale: यह सामान्य विशेषण ‘अच्छा/भला’ है, कोई व्यक्तिवाचक नाम नहीं। ‘भला’ गरिमापूर्ण और सुबोध रूप से नैतिक गुण व्यक्त करता है।
theological_decisions:
- issue: क्या አስሐትያ और ኄር को स्वर्गदूतों के व्यक्तिवाचक नाम माना जाए
  choice: उन्हें क्रमशः ‘पाला’ और ‘भला’ के रूप में सामान्य शब्द माना गया
  alternative: उन्हें ‘असहतिया’ और ‘हेर’ नामों के रूप में लिप्यंतरित करना
  rationale: शब्दार्थ और वाक्य-संरचना पहला पद मौसम की घटना तथा दूसरा पद स्वर्गदूत का गुण बताते हैं। नाम मानने से मूल में निहित संबंध बदल जाता और ऐसे नाम पाठ में जोड़ दिए जाते जो वहाँ नहीं हैं।
- issue: पहले खंड में आत्मा और स्वर्गदूत का संबंध
  choice: पाले की आत्मा स्वयं उसका स्वर्गदूत है
  alternative: पाले की आत्मा का स्वर्गदूत अलग सत्ता है अथवा उसका कोई नाम दिया गया है
  rationale: መልአክ ዚአሁ ውእቱ का निकट अर्थ ‘वह उसका स्वर्गदूत है’ है। हिन्दी में ‘स्वयं’ मूल के पहचान-संबंध को स्पष्ट करता है, बिना अपोकैलिप्टिक कथन को तर्कसंगत बनाकर बदलने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण अपोकैलिप्टिक शैली रखी गई है। ‘आत्मा’ और ‘स्वर्गदूत’ पारंपरिक धार्मिक शब्दावली हैं, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सीधा रखा गया है।
