base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/008.yaml
  text: And the name of the male was Behemoth[a], who occupies with his breast an unseen wilderness named Dundayin, east of the garden, where the chosen and the righteous dwell, where my great-grandfather was taken up, the seventh from Adam[e][d][c][b], the first of men whom the Lord of Spirits made.
translation:
  language: hi
  text: और दूसरे का नाम बेहेमोथ था[a]। वह अपनी छाती से दुन्दायिन नामक एक अनदेखे निर्जन प्रदेश[b] को घेरे रहता है। यह वाटिका के पूर्व में है[c], जहाँ चुने हुए और धर्मी निवास करते हैं, और जहाँ मेरे दादा उठा लिए गए थे—आदम से सातवें, अर्थात् वह पहला मनुष्य जिसे आत्माओं के प्रभु ने बनाया था[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् पहले उल्लिखित दो प्राणियों में दूसरा।
    reason: lexical_alternative
  - marker: b
    text: मूल पदबंध का अर्थ पूरी तरह निश्चित नहीं है। इसका भाव ऐसा निर्जन प्रदेश हो सकता है जो दिखाई न देता हो, छिपा हो, या पहुँच से बाहर हो।
    reason: textual_variant
  - marker: c
    text: मूल में केवल ‘वाटिका’ है; यहाँ ‘अदन’ नाम स्पष्ट रूप से नहीं आया है।
    reason: lexical_alternative
  - marker: d
    text: ‘आदम से सातवें’ हनोक हैं। इस अध्याय के कथात्मक संदर्भ में वक्ता नूह है; इसलिए हनोक को उसके दादा कहा गया है।
    reason: cross_reference
lexical_decisions:
- source_word: ባዕታይ
  choice: नर
  rationale: प्रसंग में यह पहले उल्लिखित मादा प्राणी के विपरीत नर प्राणी को सूचित करता है। ‘नर’ प्राणी-संदर्भ में स्वाभाविक और संक्षिप्त है; ‘दूसरा’ एक संभावित वैकल्पिक पाठ/समझ है, जिसे पादटिप्पणी में रखा गया है।
- source_word: ብሔሞት
  choice: बेहेमोथ
  rationale: यह प्राणी का व्यक्तिवाचक नाम है, इसलिए इसका अनुवाद करने के बजाय देवनागरी में लिप्यंतरण किया गया है।
- source_word: ዘይአኅዝ
  choice: घेरे हुए है
  rationale: क्रिया किसी स्थान को थामने, अपने अधिकार/विस्तार में रखने या घेरने का स्थानिक भाव देती है। यह चयन अगले ‘अपनी छाती से’ के साथ हिन्दी में बोधगम्य रहते हुए मूल की विचित्र दृश्यात्मकता बचाता है।
- source_word: በእንግ ድዓሁ
  choice: अपनी छाती से
  rationale: कठिन पदबंध का पारंपरिक शाब्दिक अर्थ छाती/वक्ष की ओर संकेत करता है। इसे ‘शरीर से’ कहकर सामान्यीकृत नहीं किया गया, ताकि अपोकैलिप्टिक चित्र की ठोस विचित्रता बनी रहे।
- source_word: በበድው ዘኢያስተርኢ
  choice: एक अनदेखे निर्जन प्रदेश
  rationale: በድው वीरान/निर्जन भूभाग है और नकारात्मक संबंधवाचक पद ዘኢያስተርኢ का सीधा भाव ‘जो दिखाई नहीं देता’ है। ‘अनदेखा’ मूल के अदृश्य/अप्रकट भाव को रखता है, जबकि ‘निर्जन प्रदेश’ हिन्दी में wilderness का सहज रूप है।
- source_word: ዱንዳይን
  choice: दुन्दायिन
  rationale: स्थान-नाम को अर्थानुवाद के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: በምሥራቀ ገነት
  choice: उस वाटिका के पूर्व में
  rationale: ገነት का मूल अर्थ बगीचा/वाटिका है। पाठ स्पष्ट रूप से ‘अदन’ नहीं कहता, इसलिए ‘अदन की वाटिका’ जोड़ना टाला गया है।
- source_word: ኅሩያን ወጻድቃን
  choice: चुने हुए और धर्मी
  rationale: दोनों प्रमुख अपोकैलिप्टिक पदों का सीधा, आधुनिक और गैर-सांप्रदायिक हिन्दी रूप रखा गया है।
- source_word: ተመጠወ
  choice: उठा लिए गए थे
  rationale: यहाँ क्रिया किसी व्यक्ति के उठा लिए जाने अथवा स्थानांतरित किए जाने को सूचित करती है। ‘उठा लिए गए’ ऊर्ध्वगामी दृश्यात्मक भाव बचाता है, पर किसी बाद की तकनीकी धर्मशास्त्रीय संज्ञा को आरोपित नहीं करता।
- source_word: እምኄውየ
  choice: मेरे परदादा
  rationale: वक्ता के साथ वंशावली-संबंध और ‘आदम से सातवें’ पहचान के आधार पर यह स्वाभाविक हिन्दी संबंधसूचक रूप है; मूल संबंध-संज्ञा को अधिक व्यापक रूप से ‘पूर्वज’ भी समझा जा सकता है।
- source_word: ሳብዕ እምአዳም
  choice: आदम से सातवें
  rationale: स्थिर वंशावलीय अभिव्यक्ति को सीधे और स्पष्ट ढंग से प्रस्तुत किया गया है।
- source_word: እግዚአ መናፍስት
  choice: आत्माओं के प्रभु
  rationale: इस पुस्तक की विशिष्ट ईश्वरीय उपाधि का औपचारिक और पारदर्शी हिन्दी अनुवाद है।
theological_decisions:
- issue: उठा लिए गए पूर्वज की पहचान
  choice: ‘मेरे परदादा’ को आदम से सातवें व्यक्ति के रूप में रखा गया है, पर मुख्य पाठ में उनका नाम नहीं जोड़ा गया।
  alternative: उन्हें स्पष्ट रूप से ‘हनोक’ कहना, अथवा संबंध को केवल ‘मेरे पूर्वज’ कहना।
  rationale: वंशावली-सूचना हनोक की ओर संकेत करती है, पर इस पद में नाम प्रत्यक्ष नहीं है। अनुवाद पाठ की सूचना तक सीमित रहता है और पहचान पादटिप्पणी में बताता है।
- issue: अंतिम वाक्यांश ‘मनुष्यों में पहला’ का संबंध
  choice: हिन्दी विराम-चिह्न द्वारा इसे निकटतम स्पष्ट वंशावली-संदर्भ ‘आदम’ से जोड़ा गया है।
  alternative: 'इसे उठा लिए गए परदादा का विशेषण मानना: ‘आदम से सातवें, उन मनुष्यों में पहले जिन्हें आत्माओं के प्रभु ने बनाया।’'
  rationale: मूल की संक्षिप्त शृंखला व्याकरणिक तनाव उत्पन्न करती है। सृष्टि-वर्णन और ‘आदम’ की निकटता के कारण मुख्य पाठ में पहला मनुष्य आदम समझा गया है, लेकिन वैकल्पिक संयोजन पादटिप्पणी में सुरक्षित है।
- issue: अनदेखे निर्जन प्रदेश का स्वरूप
  choice: ‘अनदेखा’ मुख्य पाठ में रखा गया है।
  alternative: ‘अदृश्य’, ‘अगम्य’ या केवल ‘उजाड़/निर्जन’।
  rationale: नकारात्मक क्रियारूप का प्रत्यक्ष भाव दिखाई न देने का है। स्थान को केवल उजाड़ कहना इस विशिष्ट भाव को मिटा देता; संभावित अगम्यता पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली अपनाई गई है। ‘वाटिका’, ‘धर्मी’ और ‘आत्माओं के प्रभु’ जैसे पद औपचारिक धार्मिक स्वर बनाए रखते हैं, जबकि वाक्य-विन्यास को अत्यधिक संस्कृतनिष्ठ नहीं बनाया गया। मूल की असामान्य देहात्मक छवि और अंतिम वंशावलीय वाक्य का तनाव पादटिप्पणियों सहित सुरक्षित रखा गया है।
