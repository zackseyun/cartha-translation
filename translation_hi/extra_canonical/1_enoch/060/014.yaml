base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/014.yaml
  text: For resting places have been given to the thunder with patience for the sound of its voice[a]; and the thunder and the lightning are not separated, and though they are not one[d][c][b], by the Spirit the two of them go together and are not separated.
translation:
  language: hi
  text: क्योंकि गर्जन को विश्राम-स्थान दिए गए हैं, और उसकी वाणी की ध्वनि के लिए धीरज दिया गया है[a]; और गर्जन और बिजली अलग नहीं होते। यद्यपि वे एक नहीं हैं[b], फिर भी आत्मा[c] के द्वारा वे दोनों साथ-साथ चलते हैं और अलग नहीं होते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सहनशीलता’ अथवा ‘संयम’। इस संदर्भ में वाक्यांश कठिन है; संभव है कि यह गर्जन की ध्वनि पर लगाए गए व्यवस्थित नियंत्रण का वर्णन करता हो।
    reason: lexical_alternative
  - marker: b
    text: ‘वे एक नहीं हैं’ वाला पाठ कठिन है। भाव संभवतः यह है कि गर्जन और बिजली अलग-अलग हैं, फिर भी साथ चलते हैं और अलग नहीं होते।
    reason: textual_variant
  - marker: c
    text: यहाँ ‘आत्मा’ के लिए प्रयुक्त गीइज़ शब्द का अर्थ ‘आत्मा’, ‘श्वास’ या ‘वायु’ भी हो सकता है। कथन दैवी संचालन या उस प्रेरक शक्ति की ओर संकेत कर सकता है जो गर्जन और बिजली को साथ चलाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इसका संयोजक बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: ለነጐድጓድ ምዕረፋተ
  choice: गर्जन के लिए विश्राम-स्थान
  rationale: दत्तिवाचक रचना और ምዕረፋተ के बहुवचन को बनाए रखते हुए ब्रह्मांडीय स्थानों की ठोस छवि व्यक्त की गई है।
- source_word: በትዕግሥት
  choice: धीरज
  rationale: शब्द में धैर्य, सहनशीलता या संयम का भाव हो सकता है। संदर्भ कठिन होने के कारण मुख्य पाठ निकट रखा गया और विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: ለቃለ ዚአሁ
  choice: उसकी वाणी की ध्वनि के लिए
  rationale: गर्जन के मानवीकरण को सुरक्षित रखते हुए ቃል के ‘वाणी/ध्वनि’ दोनों आयामों को व्यक्त करता है।
- source_word: ወኢይትሌለዩ
  choice: अलग नहीं होते
  rationale: पद में दो बार आए कथन के लिए एक ही अनुवाद रखकर उसकी आलंकारिक पुनरावृत्ति सुरक्षित की गई है।
- source_word: ወእም፪ኒ
  choice: यद्यपि वे एक नहीं हैं
  rationale: पाठ कठिन है, पर आगे ‘वे दोनों’ के साथ यह पठन उनकी भिन्नता और अविभाज्यता के बीच विरोध को सुरक्षित रखता है।
- source_word: በመንፈስ
  choice: आत्मा के द्वारा
  rationale: መንፈስ का अर्थ आत्मा, सांस या वायु हो सकता है। हिन्दी में बिना अतिरिक्त विशिष्टता थोपे ‘आत्मा’ रखा गया है और अर्थ-विस्तार पादटिप्पणी में दिया गया है।
- source_word: ክልኤሆሙ የሐውሩ
  choice: वे दोनों साथ-साथ चलते हैं
  rationale: स्पष्ट द्वैत और समन्वित गति दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ब्रह्मांडीय वर्णन में በመንፈስ का आशय
  choice: आत्मा के द्वारा
  alternative: सांस के द्वारा; वायु के द्वारा; किसी प्रेरक आत्मिक शक्ति के द्वारा
  rationale: मूल शब्द किसी दैवी कर्ता को सूचित कर सकता है, पर केवल उसी अर्थ तक सीमित नहीं है। इसलिए मुख्य पाठ में ‘आत्मा’ रखा गया और दैवी पहचान या प्राकृतिक वायु को निर्णायक रूप से स्थापित नहीं किया गया।
- issue: गर्जन और बिजली की एकता तथा भिन्नता
  choice: यद्यपि वे एक नहीं हैं, फिर भी वे साथ-साथ चलते और अलग नहीं होते
  alternative: यद्यपि वे दो हैं; अथवा कठिन पाठ का कोई अन्य पुनर्निर्माण
  rationale: यह रूप मूल पाठ में निहित तनाव—दोनों की विशिष्टता और अविभाज्य सहगति—को बिना दार्शनिक या doctrinal व्याख्या जोड़े बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सुबोध रूप रखा गया है। ‘गर्जन’, ‘बिजली’, ‘विश्राम-स्थान’ और ‘वाणी की ध्वनि’ मूल की ब्रह्मांडीय तथा मानवीकृत छवि को बनाए रखते हैं। कठिन वाक्यविन्यास को सीमित रूप से सहज किया गया है, पर पाठगत और धर्मवैचारिक अस्पष्टताएँ पादटिप्पणियों में सुरक्षित हैं।
