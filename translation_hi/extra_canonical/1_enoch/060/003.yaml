base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/003.yaml
  text: And as for me[a], a great trembling seized me, and fear took hold of me; and my loins were broken, and my kidneys were loosened[d][c][b], and I fell on my face.
translation:
  language: hi
  text: मुझे भयंकर कंपकंपी ने पकड़ लिया, और भय ने मुझे जकड़ लिया; मेरी कमर टूट गई[b], मेरे गुर्दे ढीले पड़ गए[c], और मैं मुँह के बल गिर पड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: शाब्दिक रूप से कमर या कटि-प्रदेश के टूटने का बिंब है; इसे ‘मेरे कूल्हे जवाब दे गए’ भी अनूदित किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘मेरे गुर्दे ढीले हो गए/खुल गए’। प्राचीन सामी-शैली की देहात्मक भाषा में गुर्दे मनुष्य के अंतरतम और गहरी भावनाओं का संकेत दे सकते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: ረዓድ ዐቢይ
  choice: बड़े कंपकंपाने
  rationale: यह पद तीव्र शारीरिक थरथराहट को व्यक्त करता है। ‘कंपकंपाना’ दृश्य के शारीरिक प्रभाव को बनाए रखता है, जबकि ‘बड़ा’ मूल के बलाघात को व्यक्त करता है।
- source_word: ነሥአኒ
  choice: मुझे आ पकड़ा
  rationale: कंपकंपाने को कर्ता मानकर यह क्रिया यहाँ किसी के अचानक वश में आ जाने का भाव देती है; केवल ‘मुझे उठा लिया’ इस प्रसंग में अनुपयुक्त होगा।
- source_word: ፍርሃት አሐዘኒ
  choice: भय ने मुझे जकड़ लिया
  rationale: यह अनुवाद भय द्वारा वक्ता को पकड़ लेने की सजीव देहात्मक छवि को सुरक्षित रखता है।
- source_word: ሐቌየ ተቀጽዐ
  choice: मेरी कमर टूट गई
  rationale: संज्ञा कमर/कटि-प्रदेश को और निष्क्रिय क्रिया टूटने या चूर होने को सूचित करती है। ‘कमर टूट गई’ आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल की तीव्रता बनाए रखता है।
- source_word: ኵልያትየ ተፈትሑ
  choice: मेरे गुर्दे ढीले पड़ गए
  rationale: संज्ञा का ठोस अर्थ ‘गुर्दे’ है और क्रिया खुलने या ढीला हो जाने का भाव रखती है। यह चयन प्राचीन देहात्मक बिंब को किसी आधुनिक भाववाचक शब्द से बदलने के बजाय सुरक्षित रखता है।
- source_word: ወወደቁ በገጽየ
  choice: और मैं मुँह के बल गिर पड़ा
  rationale: पूरे वाक्य के प्रथम-पुरुष क्रम और भूमि पर औंधे गिरने/दंडवत होने की परिचित मुद्रा के अनुसार यह सर्वाधिक संगत अर्थ है।
theological_decisions:
- issue: क्या ‘गुर्दे’ के प्राचीन देहात्मक बिंब को मुख्य पाठ में रखा जाए या उसे ‘हृदय’ अथवा ‘अंतरात्मा’ से बदल दिया जाए
  choice: मुख्य पाठ में ‘गुर्दे’ रखा गया
  alternative: ‘मेरा अंतरतम पिघल गया’ या ‘मेरा हृदय बैठ गया’
  rationale: मूल पाठ शरीर के भीतर के अंगों द्वारा गहरे भय और आंतरिक विघटन का चित्र खींचता है। आधुनिक धार्मिक मुहावरे से इसे बदलना स्रोत की विशिष्टता और संभावित अर्थ-विस्तार को अनावश्यक रूप से सीमित कर देता।
- issue: कमर से संबंधित वाक्यांश को केवल भय के मुहावरे के रूप में लिया जाए या शारीरिक विघटन की छवि बनाए रखी जाए
  choice: ‘मेरी कमर टूट गई’ के रूप में शारीरिक छवि बनाए रखी गई
  alternative: ‘मेरी शक्ति जाती रही’
  rationale: दर्शन के प्रभाव का वर्णन क्रमशः कंपकंपाने, भय, कमर, गुर्दों और भूमि पर गिरने के माध्यम से होता है; अमूर्त परिभाषा इस देहात्मक क्रम को कमजोर कर देती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर दर्शन-संबंधी वर्णन की गरिमा और तीव्र देहात्मकता बनाए रखी गई है। ‘गुर्दे’ जानबूझकर ठोस और कुछ अपरिचित बिंब के रूप में रखा गया है; पादटिप्पणी उसके सांस्कृतिक आशय को स्पष्ट करती है, मुख्य पाठ में उसका अर्थ तय नहीं करती।
