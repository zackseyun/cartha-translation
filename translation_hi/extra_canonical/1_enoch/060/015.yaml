base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/015.yaml
  text: For when the lightning flashes[a], the thunder gives its voice, and the spirit rests at its appointed time, and it divides equally among them; for the treasury of their times is of sand, and the two of them are restrained with a bridle and turned back by the power of the spirit[d][c][b], and they are driven on likewise according to the many regions of the earth.
translation:
  language: hi
  text: क्योंकि जब बिजली चमकती है, तब गर्जन अपना स्वर देता है; और आत्मा[a] अपने नियत समय पर ठहरती है और उनके बीच बराबर बाँटती है[c]। क्योंकि उनके समयों का भंडार रेत का है, और उन दोनों को लगाम से रोके जाते हैं और आत्मा की शक्ति से पीछे मोड़े जाते हैं[d]; फिर वे भी पृथ्वी के अनेक प्रदेशों के अनुसार आगे हाँके जाते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ और आगे ‘आत्मा’ के स्थान पर ‘हवा’ भी संभव है; गीइज़ शब्द का अर्थ हवा, श्वास या आत्मा हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम वाक्यांश इथियोपिक पाठ में कठिन है; ‘प्रदेशों’ को ‘दिशाओं’ या अधिक व्यापक अर्थ में पृथ्वी के भागों के रूप में भी समझा जा सकता है।
    reason: textual_difficulty
  - marker: c
    text: ‘उनके बीच बराबर बाँटती है’ अनिश्चित है; अधिक सावधान अनुवाद होगा, ‘उनके बीच हिस्सा बाँटती है।’
    reason: alternative_reading
  - marker: d
    text: इस कठिन खंड के कुछ पुराने अनुवाद बहुत अलग हैं; यहाँ शब्दों को ‘लगाम से रोकना’, ‘पीछे मोड़ना’ और आगे ‘हाँकना’ समझा गया है, न कि ‘हिलाना’ या ‘शुद्ध करना’।
    reason: translation_history
lexical_decisions:
- source_word: ይበርቅ መብረቅ
  choice: बिजली चमकती है
  rationale: क्रिया और संज्ञा के युग्म को स्वाभाविक आधुनिक हिन्दी में जीवंत मौसम-संबंधी क्रिया के रूप में रखा गया है।
- source_word: ነጐድጓድ ቃሎ ይሁብ
  choice: गर्जन अपना स्वर देता है
  rationale: मूल की सजीव, मानवीकृत ब्रह्मांडीय छवि को केवल ‘गरजता है’ कहकर समतल नहीं किया गया।
- source_word: መንፈስ
  choice: आत्मा
  rationale: शब्द का अर्थ हवा, श्वास या आत्मा हो सकता है। मुख्य पाठ में उसकी सक्रिय भूमिका और शक्ति के कारण ‘आत्मा’ रखा गया, जबकि मौसम-संबंधी ‘हवा’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: በጊዜሃ ያዐርፍ
  choice: अपने नियत समय पर ठहरती है
  rationale: यह ब्रह्मांडीय प्रक्रियाओं के ठहराए हुए समय को व्यक्त करता है, बिना अनावश्यक व्याख्या जोड़े।
- source_word: ዐሩየ ይከፍል ማእከሎሙ
  choice: उनके बीच बराबर बाँटती है
  rationale: विभाजन अथवा बँटवारे का अर्थ स्पष्ट है; बराबरी का भाव संभव है, पर अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: መዝገበ ጊዜያቲሆሙ ዘኆጻ ውእቱ
  choice: उनके समयों का भंडार रेत का है
  rationale: ‘भंडार’ मूल की ठोस अपोकैलिप्टिक छवि और ‘रेत का’ संशोधित शाब्दिक अर्थ सुरक्षित रखता है; इसे ‘निश्चित’ नहीं बनाया गया।
- source_word: በአጓም ይትነኃዙ ወይትመየጡ
  choice: लगाम से रोका जाता है और ... पीछे मोड़ा जाता है
  rationale: नियंत्रण की लगाम-वाली छवि तथा दो निष्क्रिय क्रियाओं—रोके जाने और वापस मोड़े जाने—को स्पष्ट रखा गया है।
- source_word: በኃይለ መንፈስ
  choice: आत्मा की शक्ति से
  rationale: कारक शक्ति को बनाए रखते हुए መንፈስ के ‘हवा’ वाले संभावित अर्थ को पादटिप्पणी में रखा गया है।
- source_word: ወይትነጸኡ
  choice: आगे हाँके जाते हैं
  rationale: यहाँ धातु का अर्थ धकेलना या आगे चलाना है, शुद्ध करना नहीं।
- source_word: ብዙኃ አድዋስ ምድር
  choice: पृथ्वी के अनेक प्रदेश
  rationale: አድዋስ को भौगोलिक ‘प्रदेशों/दिशाओं’ के अर्थ में लिया गया है; अंतिम वाक्यांश की कठिनता पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: መንፈስ को ‘हवा’ कहा जाए या ‘आत्मा’
  choice: आत्मा
  alternative: हवा; श्वास
  rationale: संदर्भ तूफान का है, इसलिए ‘हवा’ वास्तविक संभावना है; फिर भी शब्द को समय, क्रिया और शक्ति से जोड़ा गया है। मुख्य पाठ में ‘आत्मा’ और पादटिप्पणी में ‘हवा’ रखकर ब्रह्मांडीय तथा मौसम-संबंधी दोनों अर्थों का तनाव सुरक्षित रखा गया है।
- issue: बाँटने वाली सत्ता की पहचान
  choice: व्याकरणिक रूप से ‘आत्मा’ से संबद्ध स्त्रीलिंग क्रिया
  alternative: 'अव्यक्त कर्ता: ‘वह उनके बीच बाँटता है’'
  rationale: निकटतम कर्ता መንፈስ है, पर कठिन पाठ में कर्ता पूरी तरह निर्विवाद नहीं है; इसलिए पहचान की अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘गर्जन अपना स्वर देता है’, ‘भंडार’ और ‘लगाम’ जैसी ठोस छवियाँ मूल की अपोकैलिप्टिक शैली बचाती हैं। कठिन अथवा बहुअर्थी स्थानों को मुख्य पाठ में अत्यधिक सरल नहीं किया गया और पादटिप्पणियों में वास्तविक विकल्प दिए गए हैं।
