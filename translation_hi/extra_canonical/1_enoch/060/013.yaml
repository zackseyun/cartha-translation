base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/013.yaml
  text: And the thunder[a], according to their places of striking, and for every division that is divided by the lightning, so that it may flash—and their restraint[d][c][b], so that they may hear quickly.
translation:
  language: hi
  text: और गर्जन[a], उनके गिरने के स्थानों के अनुसार; और प्रत्येक विभाजन जो बिजली से विभाजित होता है, ताकि वह चमके—और उनका संयम, ताकि वे शीघ्र सुनें।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गीज़ पाठ कठिन है। यहाँ प्रयुक्त शब्द का आशय उनके गिरने के स्थानों से है; इसे ‘उनके प्रहार-स्थानों के अनुसार’ भी अनूदित किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम शब्दों का शाब्दिक अर्थ है, “ताकि वे शीघ्र सुनें।” प्रसंग में इसका भाव तुरंत प्रत्युत्तर देने या आज्ञा मानने का भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ነጐድጓድ
  choice: गर्जन
  rationale: यह संज्ञा बादल की गड़गड़ाहट अथवा गर्जन को दर्शाती है; ‘गर्जन’ ब्रह्मांडीय-तूफानी बिंब को संक्षिप्त और स्वाभाविक रूप में रखता है।
- source_word: በበመዳቃቲሆሙ
  choice: उनके प्रहार-स्थानों के अनुसार
  rationale: መዳቃ का मूल अर्थ गिरने या प्रहार होने का स्थान है। यह अनुवाद अस्पष्ट ‘ठिकानों’ की अपेक्षा ठोस मौसम-संबंधी चित्र को सुरक्षित रखता है।
- source_word: ኵሉ ክፍለ ዘይትከፈል
  choice: हर उस भाग के लिए जो ... बाँटा जाता है
  rationale: ‘भाग’ और ‘बाँटा’ द्वारा स्रोत के सजातीय तथा पुनरुक्त शब्द-विन्यास को यथासंभव बनाए रखा गया है।
- source_word: በመብረቅ
  choice: बिजली से
  rationale: 'पूर्वसर्ग का करणार्थक प्रयोग यहाँ सबसे स्वाभाविक है: विभाजन बिजली के द्वारा अथवा उससे चिह्नित होता है।'
- source_word: ከመ ይበርቅ
  choice: ताकि वह चमके
  rationale: क्रिया बिजली और प्रकाश की चमक से संबद्ध है; ‘चमके’ आधुनिक हिंदी में सहज है और तूफानी बिंब को बनाए रखता है।
- source_word: ትዕግሥቶሙ
  choice: उनका संयम
  rationale: संज्ञा धैर्य, सहनशीलता या रोक/संयम का अर्थ दे सकती है। इस कठिन मौसम-संबंधी प्रसंग में ‘संयम’ नियंत्रित शक्ति के भाव को बिना अधिक व्याख्या के व्यक्त करता है।
- source_word: ፍጡነ ይስምዑ
  choice: वे शीघ्र सुनें
  rationale: मूल क्रिया का सीधा अर्थ ‘सुनना’ है, यद्यपि सामी प्रयोग में तत्पर प्रत्युत्तर या आज्ञापालन का भाव भी संभव है। मुख्य पाठ में अधिक शाब्दिक अर्थ रखा गया है।
theological_decisions:
- issue: क्या अस्पष्ट मौसम-संबंधी क्रम को ब्रह्मांडीय शक्तियों के परमेश्वर की आज्ञा मानने के कथन के रूप में स्पष्ट किया जाए
  choice: गर्जन, बिजली, भागों और संयम की ठोस परंतु कठिन भाषा को न्यूनतम व्याख्या के साथ बनाए रखना
  alternative: अंतिम उपवाक्य का अनुवाद ‘ताकि वे तुरंत आज्ञा मानें’ करना, या पूरे पद को तूफानी शक्तियों की सुव्यवस्थित क्रिया के रूप में भावानुवादित करना
  rationale: गीज़ पाठ कठिन है और ‘सुनना’ आज्ञापालन का संकेत दे सकता है, पर उसे निश्चित रूप से ‘आज्ञा मानना’ कहना वास्तविक अस्पष्टता को समाप्त कर देगा।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। स्रोत की खंडित और कठिन वाक्यरचना को पूरी तरह समतल नहीं किया गया, ताकि उसकी वास्तविक अस्पष्टता बनी रहे। सभी पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित हैं।
