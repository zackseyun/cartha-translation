base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/001.yaml
  text: In the five-hundredth year, in the seventh month, on the fourteenth day of the month, in the life of Henok, in that parable I saw that the heaven of heavens was shaken with a great shaking, and the host of the Most High, and the angels, thousands of thousands and ten thousand times ten thousand, were stirred in a great turmoil.
translation:
  language: hi
  text: हनोक के जीवनकाल के पाँच सौवें वर्ष में, सातवें महीने के चौदहवें दिन, उस दृष्टान्त में मैंने देखा कि आकाशों का आकाश[a] बड़े कम्पन से हिल उठा,[c] और परमप्रधान की सेना[b] तथा हज़ारों के हज़ार और दस हज़ारों के दस हज़ार स्वर्गदूत बड़ी उथल-पुथल में पड़ गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सबसे ऊँचा आकाश।” गीइज़ में शाब्दिक रूप से “आकाशों का आकाश” है, जो सर्वोच्च स्वर्गीय लोक को सूचित करने वाली अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: “परमप्रधान की सेना” का अर्थ “परमप्रधान की स्वर्गीय सेना” या “परमप्रधान की सामर्थ्य” भी हो सकता है; पर इसके तुरंत बाद असंख्य स्वर्गदूतों का उल्लेख सेना के अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: c
    text: या, “बड़े झटके से हिल उठा।” मूल में बड़े कम्पन की प्रबल पुनरुक्त अभिव्यक्ति है।
    reason: previous_rendering
lexical_decisions:
- source_word: በዓመት ፭ምእት ... አመ ዐሡሩ ወረቡዑ ለወርኅ
  choice: पाँच सौवें वर्ष में, सातवें महीने के चौदहवें दिन
  rationale: काल-सूचना को मूल क्रम और सटीकता के साथ स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: በሕይወተ ሄኖክ
  choice: हनोक के जीवनकाल के
  rationale: मूल के ‘जीवन’ संबंधी पद को बनाए रखते हुए हिन्दी वाक्य में दिनांक के साथ स्वाभाविक रूप से जोड़ा गया है।
- source_word: በውእቱ አምሳል
  choice: उस दृष्टान्त में
  rationale: यह पद पुस्तक के ‘दृष्टान्तों/सादृश्यों’ वाले खंड से जुड़ा पारिभाषिक शब्द है; ‘दृष्टान्त’ हिन्दी पाठक के लिए परिचित और गरिमापूर्ण है।
- source_word: ሰማየ ሰማያት
  choice: आकाशों का आकाश
  rationale: मूल की सामासिक अतिशयोक्ति और विशिष्ट ब्रह्माण्डीय बिंब को समतल किए बिना सुरक्षित रखा गया है।
- source_word: ታድለቀልቅ ... ይልቅልቅ ዐቢይ
  choice: बड़े भूकम्प की तरह हिल उठा
  rationale: पाठ के तीव्र, महान कम्पन को प्राकृतिक हिन्दी में व्यक्त करता है; ‘भूकम्प’ यहाँ उपमा के रूप में है, न कि घटना की संकीर्ण पहचान के रूप में।
- source_word: ኀይሉ ልዑል
  choice: परमप्रधान की स्वर्गीय सेना
  rationale: इसके तुरंत बाद असंख्य स्वर्गदूतों का उल्लेख सामूहिक स्वर्गीय दल का अर्थ समर्थित करता है; ‘स्वर्गीय’ अर्थ-स्पष्टता के लिए जोड़ा गया है।
- source_word: መላእክት አእላፈ አእላፍ ወትእልፊተ ትእልፊት
  choice: हज़ारों-हज़ार और दस हज़ार गुना दस हज़ार स्वर्गदूत
  rationale: मूल की विशाल संख्या और पुनरुक्त संख्यात्मक अलंकार को निकटता से बनाए रखा गया है।
- source_word: ትሀውኩ ሁከተ ዐቢየ
  choice: बड़ी उथल-पुथल में पड़ गए
  rationale: क्रिया और संज्ञा के संयुक्त प्रबल भाव को सुबोध, गरिमापूर्ण हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: क्या ኀይሉ ልዑል अमूर्त ‘परमप्रधान की सामर्थ्य’ है या उनका स्वर्गीय सैन्य-दल
  choice: परमप्रधान की स्वर्गीय सेना
  alternative: परमप्रधान की सामर्थ्य
  rationale: आगे असंख्य स्वर्गदूतों की गणना होने के कारण सामूहिक स्वर्गीय सेना का अर्थ प्रसंग में अधिक संगत है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: ሰማየ ሰማያት को शाब्दिक सामासिक रूप में रखना या सामान्य सर्वोच्चता के रूप में खोलना
  choice: आकाशों का आकाश
  alternative: सबसे ऊँचा आकाश
  rationale: शाब्दिक रूप मूल के प्रलयदर्शी ब्रह्माण्डीय मुहावरे और उसके धार्मिक उत्कर्ष को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण और प्रलयदर्शी है, पर वाक्य सामान्य पाठक के लिए सुबोध रखा गया है। ‘हनोक’ प्रचलित हिन्दी रूप है। संख्या-सूत्र और ‘आकाशों का आकाश’ जानबूझकर मूल के निकट रखे गए हैं।
