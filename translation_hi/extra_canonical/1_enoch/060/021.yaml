base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/021.yaml
  text: And when the spirit of the rain is stirred from its storehouse[a], the angels come and open the storehouse and bring it out. And when it is scattered upon all the dry ground, it is joined with the water that is upon the dry ground; and whenever it is joined with the water upon the dry ground . [d][c][b]. .
translation:
  language: hi
  text: और जब वर्षा की आत्मा अपने भंडार से उद्वेलित होती है, तब स्वर्गदूत आकर भंडार खोलते हैं और उसे बाहर निकालते हैं। और जब वह सारी सूखी भूमि पर बिखेरी जाती है,[a] तब वह सूखी भूमि पर स्थित जल के साथ मिल जाती है; और जब वह हर समय सूखी भूमि पर स्थित जल के साथ मिलती है . . .[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बोई जाती है”; इसका अर्थ “बिखेरी जाती है” या “उंडेली जाती है” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल गीइज़ पाठ में सूखी भूमि पर स्थित जल के साथ मिलने का कथन दोहराया गया है। अंतिम वाक्यांश कठिन और वाक्यगत रूप से अपूर्ण प्रतीत होता है; इसका आशय निरंतर मिलन या जल के साथ जुड़े रहने से हो सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: መንፈሱ ለዝናም
  choice: वर्षा की आत्मा
  rationale: መንፈስ का अर्थ आत्मा, वायु या श्वास हो सकता है। यहाँ ‘वर्षा की आत्मा’ सर्वनिष्ठ आकाशीय-सृष्टि संबंधी चित्र को बनाए रखता है और इसे केवल मौसम की आधुनिक भाषा में सीमित नहीं करता।
- source_word: ይትኃወስ
  choice: हलचल में आती है
  rationale: क्रिया गति या सक्रिय किए जाने का भाव देती है। यह हिंदी में स्वाभाविक है और निष्क्रिय भंडार से वर्षा की शक्ति के प्रवर्तन को व्यक्त करती है।
- source_word: መዝገበ
  choice: भंडार
  rationale: यह प्राकृतिक शक्तियों के स्वर्गीय संग्रह-स्थान की ठोस सर्वनिष्ठ छवि को स्पष्ट और गरिमापूर्ण हिंदी में रखता है।
- source_word: ይመጽኡ መላእክት ... ያርኅዉ ... ያወጽእዎ
  choice: स्वर्गदूत आकर भंडार खोलते हैं और उसे बाहर निकालते हैं
  rationale: मूल में स्वर्गदूत व्यक्तिगत कर्ता हैं; अनुवाद उनकी सक्रिय भूमिका और क्रियाओं का क्रम सुरक्षित रखता है।
- source_word: ይዘራእ
  choice: बिखेरी जाती है
  rationale: मूल धातु का प्राथमिक बिंब बोने या बिखेरने का है। वर्षा के संदर्भ में ‘बिखेरी जाती है’ स्वाभाविक है और ‘उंडेली जाती है’ की अपेक्षा मूल की वितरणात्मक छवि अधिक अच्छी तरह बचाता है।
- source_word: የብስ
  choice: सूखी भूमि
  rationale: यह जल के विपरीत स्थल या शुष्क भूमि को दर्शाता है; ‘सूखी भूमि’ उस विरोध को स्पष्ट रखता है।
- source_word: ይትኃበር ምስለ ማይ
  choice: जल के साथ मिल जाती है
  rationale: यह जुड़ने या सम्मिलित होने के निष्क्रिय/आत्मवाचक भाव को सहज आधुनिक हिंदी में व्यक्त करता है, बिना प्रक्रिया को अनावश्यक रूप से निश्चित किए।
- source_word: በኵሉ ጊዜ
  choice: हर समय
  rationale: शब्दसमूह निरंतरता या स्थायी संगति का भाव देता है। वाक्य की कठिन संरचना के कारण यह अर्थ मुख्य पाठ में रखा गया है और वैकल्पिक समझ पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: वर्षा की सक्रियता को साधारण मौसम-विज्ञान की भाषा में निरपेक्ष करना या सर्वनिष्ठ आकाशीय चित्र बनाए रखना
  choice: ‘वर्षा की आत्मा’ और भंडार का संचालन करने वाले स्वर्गदूतों को बनाए रखा गया
  alternative: ‘जब वर्षा भंडार से निकलती है’ अथवा ‘जब वर्षा-तूफान जलाशय से छोड़ा जाता है’
  rationale: पद एक ऐसे सर्वनिष्ठ विश्व-चित्र को व्यक्त करता है जिसमें प्राकृतिक घटनाओं का संचालन स्वर्गीय शक्तियाँ करती हैं। अनुवाद उस चित्र को आधुनिक निरपेक्ष मौसम-वर्णन में नहीं बदलता।
- issue: अंतिम वाक्यांश में निरंतर मिलन या केवल बार-बार होने वाली प्रक्रिया
  choice: ‘तब वह हर समय उसके साथ मिली रहती है’
  alternative: ‘और हर बार वह सूखी भूमि पर के जल के साथ मिल जाती है’
  rationale: በኵሉ ጊዜ निरंतरता का संकेत दे सकता है, पर पाठ कठिन और पुनरुक्त है। मुख्य पाठ में संभावित स्थायी अवस्था रखी गई है और पुनरावृत्त क्रिया वाला अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सुबोध शैली रखी गई है। ‘आत्मा,’ ‘स्वर्गदूत’ और ‘भंडार’ मूल के सर्वनिष्ठ आकाशीय चित्र को सुरक्षित रखते हैं। अंतिम कठिन और पुनरुक्त खंड को सहज वाक्य में प्रस्तुत किया गया है, जबकि वास्तविक अर्थगत अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
