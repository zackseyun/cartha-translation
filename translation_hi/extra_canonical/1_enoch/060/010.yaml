base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/010.yaml
  text: And he said to me[a], “You, son of man[c][b], here you desire to understand what is hidden.”
translation:
  language: hi
  text: और उसने मुझसे कहा, “हे मनुष्य के पुत्र,[a] तुम यहाँ छिपी हुई बात को समझना चाहते हो।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हे मनुष्य” अथवा “हे नश्वर मनुष्य।” यहाँ “मनुष्य के पुत्र” द्रष्टा के लिए संबोधन है; यह आवश्यक नहीं कि इसका आशय दृष्टान्तों में अन्यत्र वर्णित महिमामय “मनुष्य का पुत्र” हो।
    reason: lexical_alternative
  - marker: b
    text: अंतिम वाक्यांश का अनुवाद “छिपी हुई बात को जानना” या “जो छिपा है, उसे जानना” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይቤለኒ
  choice: और उसने मुझसे कहा
  rationale: गीज़ की सामान्य कथात्मक वाणी-भूमिका को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: አንተ
  choice: तुम
  rationale: स्पष्ट द्वितीय-पुरुष सर्वनाम संबोधन पर बल देता है; हिन्दी में कर्ता के रूप में ‘तुम’ रखकर यह बल सुरक्षित रहता है।
- source_word: ወልደ ሰብእ
  choice: हे मनुष्य के पुत्र
  rationale: शाब्दिक सामी मुहावरे और प्रलयदर्शी शैली को बनाए रखता है। यहाँ यह द्रष्टा को संबोधन है, इसलिए संबोधन-सूचक ‘हे’ लगाया गया है।
- source_word: በዝየ
  choice: यहाँ
  rationale: दृश्य के स्थान अथवा तत्काल प्रसंग की संकेतात्मकता को संक्षेप में सुरक्षित रखता है।
- source_word: ትፈቅድ
  choice: चाहते हो
  rationale: इच्छा या अभिलाषा का सहज आधुनिक हिन्दी रूप है; ‘अभिलाषा रखते हो’ की अपेक्षा सामान्य पाठक के लिए अधिक स्वाभाविक है।
- source_word: ታእምር
  choice: समझना
  rationale: प्रकट की जा रही गुप्त बात के बौद्धिक बोध का अर्थ देता है; ‘जानना’ भी संभव है।
- source_word: ዘኅቡእ
  choice: छिपी हुई बात
  rationale: संबंधवाचक-विशेषणात्मक रचना को ठोस किन्तु अनिर्धारित रूप में रखता है और तकनीकी ‘रहस्य’ शब्द अनावश्यक रूप से आरोपित नहीं करता।
theological_decisions:
- issue: दृष्टान्तों में ወልደ ሰብእ का अर्थ
  choice: मनुष्य के पुत्र
  alternative: मनुष्य / नश्वर मनुष्य
  rationale: इस पद में यह हनोक जैसे मानवीय द्रष्टा के लिए संबोधन है, फिर भी पारंपरिक सामी अभिव्यक्ति को बनाए रखने से अन्य स्थानों की उपाधिगत भाषा के साथ वास्तविक साहित्यिक और धर्मवैचारिक तनाव सुरक्षित रहता है। पादटिप्पणी इसे अनिवार्य रूप से महिमामय ‘मनुष्य का पुत्र’ व्यक्तित्व मानने से रोकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘हे मनुष्य के पुत्र’ मूल के संबोधन और प्रलयदर्शी स्वर को सुरक्षित रखता है; मुख्य पाठ में अनावश्यक तकनीकी धर्मशास्त्रीय भाषा से बचा गया है।
