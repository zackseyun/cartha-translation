    reason: lexical_alternative
lexical_decisions:
- source_word: ባዕዳን
  choice: बाकी सब
  rationale: संदर्भ में यह पहले बताए गए अगुओं के अतिरिक्त समूह के शेष सदस्यों को सूचित करता है; ‘बाकी सब’ सामूहिक और व्यापक अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: ኵሉ
  choice: सब
  rationale: यह पूरे शेष समूह की सहभागिता पर बल देता है।
- source_word: ምስሌሆሙ
  choice: उनके साथ के
  rationale: यह पहले उल्लिखित व्यक्तियों के साथ संगति और संबद्धता व्यक्त करता है।
- source_word: ነሥኡ ሎሙ አንስተ
  choice: अपने लिए पत्नियाँ ले लीं
  rationale: यह वाक्यांश स्त्रियों को पत्नी के रूप में ग्रहण करने का भाव देता है; ‘अपने लिए’ ሎሙ के आत्मवाची बल को सुरक्षित रखता है।
- source_word: ኃረዩ
  choice: चुन लिया
  rationale: यह प्रत्येक व्यक्ति द्वारा जानबूझकर चुनाव किए जाने को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ለለ ርእሱ አሐተ
  choice: हर एक ने अपने लिए एक को
  rationale: यह वितरणात्मकता, आत्मवाची भाव और एक स्त्री की संख्या—तीनों को बनाए रखता है।
theological_decisions:
- issue: አንስተ का अनुवाद ‘स्त्रियाँ’ किया जाए या ‘पत्नियाँ’
  choice: पत्नियाँ
  alternative: स्त्रियाँ
  rationale: संज्ञा सामान्यतः स्त्रियों को भी सूचित कर सकती है, पर इस रचना में पत्नी के रूप में ग्रहण करने का अर्थ अधिक संभावित है। ‘पत्नियाँ’ पात्रों द्वारा स्थापित किए गए वैवाहिक-जैसे संबंध को बताता है, उनके कार्य को उचित नहीं ठहराता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली अपनाई गई है। ‘हर एक’ और ‘अपने लिए एक’ द्वारा मूल का वितरणात्मक तथा आत्मवाची बल सुरक्षित रखा गया है।
