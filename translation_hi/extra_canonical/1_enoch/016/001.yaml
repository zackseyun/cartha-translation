base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/016/001.yaml
  text: From the days of the slaughter and destruction and death of the giants[a], the spirits that have gone out from the souls of their flesh shall destroy without incurring judgment; thus they shall destroy until the day of the completion of the great judgment[d][c][b], when the great age shall be brought to its end.
translation:
  language: hi
  text: दैत्यों के वध, विनाश और मृत्यु के दिनों से[a], उनकी देह के प्राणों से निकली आत्माएँ[b] न्याय के बिना विनाश करती रहेंगी; वे इसी प्रकार उस दिन तक विनाश करती रहेंगी जब महान न्याय पूरा होगा और महान युग का अन्त कर दिया जाएगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरम्भिक वाक्यांश का पाठ कठिन है। भाव यह है कि दैत्यों के वध, विनाश और मृत्यु से आरम्भ हुए समय से इन आत्माओं की विनाशकारी गतिविधि जारी रहती है।
    reason: textual_variant
  - marker: b
    text: ‘उनकी देह के प्राणों से निकली आत्माएँ’ एक कठिन और असामान्य वाक्यांश का निकट अनुवाद है। प्रसंग में सम्भवतः दैत्यों की मृत्यु के बाद उनसे सम्बन्धित आत्माएँ अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: c
    text: ‘महान युग’ का अनुवाद ‘महान संसार’ या ‘महान विश्व-व्यवस्था’ भी हो सकता है; मूल शब्द ‘युग’ और ‘संसार’ दोनों अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እመዋዕለ
  choice: के दिनों से
  rationale: यह पद समय के आरम्भ-बिन्दु को सूचित करता है; ‘के दिनों से’ उस निरन्तरता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ቀትል ወሙስና ወሞተ ረዓይት
  choice: दैत्यों के वध, विनाश और मृत्यु
  rationale: ረዓይት को प्रसंग और प्राचीन समानान्तर साक्ष्य के आधार पर ‘दैत्य’ समझते हुए विनाशकारी त्रिक को बनाए रखा गया है।
- source_word: ወፅአ መናፍስት እምነፍሳት ሥጋሆሙ
  choice: उनकी देह के प्राणों से निकली आत्माएँ
  rationale: असामान्य गीइज़ सम्बन्धवाचक संरचना को जानबूझकर पूरी तरह सरल नहीं किया गया; ‘आत्माएँ’ और ‘प्राण’ के भेद से መናፍስት और ነፍሳት दोनों की उपस्थिति दिखाई देती है।
- source_word: ዘያማስን
  choice: विनाश करती रहेंगी
  rationale: क्रिया की पुनरावृत्ति और भावी निरन्तर गतिविधि को रखा गया है; इस न्याय-सन्दर्भ में ‘विनाश करना’ उपयुक्त है।
- source_word: ዘእንበለ ኵነኔ
  choice: बिना दण्ड पाए
  rationale: शाब्दिक ‘बिना न्याय’ हिन्दी में अस्पष्ट हो सकता था; यह रूप अन्तिम न्याय से पहले उनके विनाशकारी कार्य पर दण्ड लागू न होने का भाव देता है, बिना यह कहे कि वे निर्दोष हैं।
- source_word: እስከ ዕለተ ተፍጻሜት ኵነኔ ዐቢይ
  choice: उस दिन तक ... जब महान न्याय पूरा होगा
  rationale: ‘दिन’, ‘पूर्णता’ और ‘महान न्याय’—तीनों अपोकैलिप्टिक तत्व स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित हैं।
- source_word: አመ ዓለም ዐቢይ ይትፌጸም
  choice: और महान युग का अन्त कर दिया जाएगा
  rationale: ዓለም की ‘युग/संसार’ अस्पष्टता में प्रसंगानुकूल ‘युग’ चुना गया है; कर्मवाच्य मूल क्रिया को प्रतिबिम्बित करता है।
theological_decisions:
- issue: आत्माओं की पहचान
  choice: मुख्य पाठ उन्हें दैत्यों की देह के प्राणों से निकली आत्माओं के रूप में प्रस्तुत करता है।
  alternative: इसे अधिक सरल करके ‘दैत्यों के शरीरों से निकली आत्माएँ’ कहा जा सकता है।
  rationale: निकटवर्ती प्रहरी-वृत्तान्त दैत्यों से सम्बन्ध का समर्थन करता है, पर कठिन मूल वाक्यांश को पूरी तरह समतल करना उसकी वास्तविक अस्पष्टता मिटा देता।
- issue: ‘बिना न्याय’ का अर्थ
  choice: ‘बिना दण्ड पाए’
  alternative: ‘बिना न्याय के’ या ‘बिना दोषी ठहराए’
  rationale: यह चयन उनकी गतिविधि के अन्तिम न्याय तक जारी रहने को व्यक्त करता है; इसे निर्दोषता या ईश्वरीय अनुमोदन का कथन नहीं बनाया गया।
- issue: ዓለም का अर्थ
  choice: युग
  alternative: संसार या विश्व-व्यवस्था
  rationale: अन्तकालीन प्रसंग में किसी युग की नियत समाप्ति स्वाभाविक है, पर वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। ‘दैत्य’, ‘आत्मा’, ‘प्राण’, ‘महान न्याय’ और ‘युग’ जैसे शब्द अपोकैलिप्टिक स्वर बनाए रखते हैं। कठिन मूल सम्बन्धवाचक पद को मुख्य पाठ में कुछ औपचारिक रखा गया और पादटिप्पणी में समझाया गया है।
