base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/004.yaml
  text: But seek and choose for yourselves righteousness and a good life[a], and walk in the paths of peace[c][b], so that you may live and prosper.
translation:
  language: hi
  text: परन्तु धार्मिकता और उत्तम जीवन[a] की खोज करो और उन्हें अपने लिए चुन लो; शान्ति के पथों[b] पर चलो, जिससे तुम जीवित रहो और फलो-फूलो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इथियोपियाई पाठ की इस प्रतिलिपि में “उत्तम जीवन” के आस-पास का शब्द-विन्यास कुछ कठिन है; आशय ऐसा जीवन चुनने का है जो भलाई या खराई से पहचाना जाए।
    reason: textual_variant
  - marker: b
    text: या, “शान्ति के मार्गों पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: እላ
  choice: परन्तु
  rationale: यहाँ पाठ में विरोध अथवा पिछले कथन से मोड़ दिखाने वाला अव्यय समझना सन्दर्भ और नवीन पाठ-समीक्षा के अनुरूप है।
- source_word: ፍቅዱ
  choice: खोज करो
  rationale: यह ፈቀደ धातु का बहुवचन आज्ञार्थक रूप है, जिसका भाव चाहने, अभिलाषा करने या खोजने का है; ‘खोज करो’ नैतिक प्रयत्न को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ወኀረዩ
  choice: और … चुन लो
  rationale: बहुवचन आज्ञा में सोच-समझकर नैतिक चुनाव करने का सीधा आह्वान है।
- source_word: ለክሙ
  choice: अपने लिए
  rationale: लाभार्थक-आत्मवाचक भाव को स्पष्ट रखता है।
- source_word: ጽድቀ
  choice: धार्मिकता
  rationale: यह व्यापक नैतिक-धार्मिक खराई का बोध देता है; ‘न्याय’ यहाँ अनावश्यक रूप से अर्थ को केवल सामाजिक न्याय तक सीमित कर सकता है।
- source_word: ወሕይወተ ኄራተ
  choice: और उत्तम जीवन
  rationale: शब्दसमूह को ‘अच्छा/उत्तम जीवन’ के रूप में लिया गया है; ‘उत्तम’ गरिमापूर्ण और सामान्य आधुनिक हिन्दी में सुबोध है।
- source_word: ወሖሩ
  choice: चलो
  rationale: आचरण के लिए प्रयुक्त बाइबिलीय ‘चलने’ के रूपक को बनाए रखता है।
- source_word: በፍኖዋተ ሰላም
  choice: शान्ति के पथों पर
  rationale: बहुवचन और ज्ञान-साहित्य की मार्ग-छवि दोनों सुरक्षित रहते हैं।
- source_word: ወተሐደዉ
  choice: जिससे तुम जीवित रहो
  rationale: समापन को पूर्ववर्ती आज्ञाओं के फल अथवा उद्देश्य के रूप में स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ወትደለዉ
  choice: और फलो-फूलो
  rationale: यह सफलता और समृद्ध दशा के व्यापक भाव को व्यक्त करता है, पर उसे केवल भौतिक धन तक सीमित नहीं करता।
theological_decisions:
- issue: ጽድቀ का अनुवाद ‘धार्मिकता’ हो या ‘न्याय’
  choice: धार्मिकता
  alternative: न्याय
  rationale: इस उपदेशात्मक सन्दर्भ में व्यक्तिगत और व्यापक नैतिक खराई प्रमुख है; ‘धार्मिकता’ उस विस्तृत अर्थ को सुरक्षित रखती है।
- issue: अन्तिम दो क्रियाओं को साधारण समुच्चय माना जाए या फल/उद्देश्य
  choice: जिससे तुम जीवित रहो और फलो-फूलो
  alternative: और जीवित रहो और सफल होओ
  rationale: सन्दर्भ इन्हें शान्ति के पथों पर चलने के फल के रूप में पढ़ने देता है, किन्तु मूल संयोजकों की सम्भावित साधारण समुच्चयात्मकता को टिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, उपदेशात्मक रूप अपनाया गया है। ‘धार्मिकता’, ‘पथ’ और ‘चलो’ मूल की ज्ञान-साहित्य संबंधी नैतिक छवि बनाए रखते हैं; ‘फलो-फूलो’ को केवल आर्थिक समृद्धि के अर्थ से बचाने के लिए चुना गया है।
