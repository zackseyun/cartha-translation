base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/001.yaml
  text: 'And now I say to you[a], my children: love righteousness and walk in it; for the paths of righteousness are worthy and acceptable[c][b], but the paths of iniquity will quickly be destroyed and vanish.'
translation:
  language: hi
  text: 'और अब, मेरे बच्चो, मैं तुमसे कहता हूँ: धार्मिकता से प्रेम करो और धार्मिकता के मार्ग पर चलो; क्योंकि धार्मिकता के मार्ग उचित और स्वीकार्य हैं,[a] पर अधर्म के मार्ग शीघ्र ही नष्ट होकर मिट जाएँगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उचित और स्वीकार्य” के पीछे का गीइज़ शब्द-युग्म कुछ कठिन है; इसका अर्थ “योग्य और स्वीकृत” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እብለክሙ
  choice: मैं तुमसे कहता हूँ
  rationale: प्रत्यक्ष संबोधन और पिता-सदृश उपदेशात्मक स्वर को सहज हिन्दी में बनाए रखता है।
- source_word: ደቂቅየ
  choice: मेरे बच्चो
  rationale: पारिवारिक संबोधन को सुरक्षित रखता है और श्रोताओं को केवल पुरुषों तक सीमित नहीं करता।
- source_word: አፍቅርዋ ለጽድቅ
  choice: धार्मिकता से प्रेम करो
  rationale: यहाँ ጽድቅ व्यापक नैतिक सदाचार को दर्शाता है; ‘धार्मिकता’ बाइबिलीय प्रयोग से संगत है।
- source_word: ወባቲ ሖሩ
  choice: और उसी पर चलो
  rationale: मूल के नैतिक मार्ग-रूपक को स्वाभाविक हिन्दी में व्यक्त करता है; ‘उसी’ का संकेत धार्मिकता की ओर है।
- source_word: ፍኖዋተ ጽድቅ
  choice: धार्मिकता के मार्ग
  rationale: मूल की बहुवचन मार्ग-छवि और नैतिक विरोध को बनाए रखता है।
- source_word: ይደሉ ወይትወከፍ
  choice: उचित और स्वीकार्य हैं
  rationale: 'कठिन मूल्यांकनात्मक पद-युग्म के दोनों पक्षों को बनाए रखता है: अनुकूलता/योग्यता और स्वीकृति।'
- source_word: ፍኖዋተ ዓመፃ
  choice: अधर्म के मार्ग
  rationale: ዓመፃ यहाँ ጽድቅ का सीधा नैतिक विलोम है; ‘अधर्म’ अन्याय और दुष्टता की व्यापकता को रखता है तथा अगले पद में प्रयुक्त विशिष्ट ‘हिंसा’ से भेद करता है।
- source_word: ፍጡነ
  choice: शीघ्र ही
  rationale: न्याय की निकटता और गति को गरिमापूर्ण, वर्तमान हिन्दी में व्यक्त करता है।
- source_word: ይትሐጐላ ወየሐፅፃ
  choice: नष्ट होकर मिट जाएँगे
  rationale: दोनों क्रियाओं के विनाश और लोप के संयुक्त बल को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ጽድቅ का नैतिक अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: संदर्भ किसी एक सामाजिक-वैधानिक गुण से अधिक व्यापक जीवन-पद्धति का आह्वान करता है; इसलिए ‘धार्मिकता’ उपयुक्त है, जबकि ‘न्याय’ उसका एक संभव आयाम है।
- issue: ዓመፃ का अनुवाद
  choice: अधर्म
  alternative: अन्याय; हिंसा
  rationale: इस पद में यह धार्मिकता का व्यापक नैतिक विलोम है। ‘हिंसा’ अर्थ-क्षेत्र में संभव हो सकता है, पर यहाँ उसे चुनने से व्यापक विरोध संकुचित होगा और निकटवर्ती विशिष्ट हिंसा-संबंधी शब्दावली से भेद धुँधला पड़ सकता है।
- issue: धार्मिक मार्गों के मूल्यांकनात्मक पद-युग्म का बल
  choice: उचित और स्वीकार्य
  alternative: योग्य और स्वीकृत
  rationale: मूल की वास्तविक कठिनाई और दोहरे कथन को बनाए रखते हुए हिन्दी में स्वाभाविक अर्थ देता है; इसे केवल एक विशेषण में नहीं समेटा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, उपदेशात्मक शैली रखी गई है। ‘मेरे बच्चो’ आत्मीय संबोधन है; ‘उसी पर चलो’ नैतिक मार्ग के रूपक को सहज बनाता है। विराम-चिह्नों से संबोधन, आज्ञा और कारणात्मक विरोध स्पष्ट किया गया है।
