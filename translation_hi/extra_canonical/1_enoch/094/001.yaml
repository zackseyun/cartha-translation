  terminology: ‘धार्मिकता,’ ‘अधर्म,’ ‘मार्ग,’ and ‘उचित और स्वीकार्य’ are appropriate in a dignified modern Hindi biblical register. The footnote appropriately signals the lexical difficulty without overstating it.
  issues:
