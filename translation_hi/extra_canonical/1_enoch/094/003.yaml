base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/003.yaml
  text: 'And now I say to you[a], the righteous: do not walk in the paths of evil, nor in the paths of death, and do not draw near to them[b], lest you be destroyed.'
translation:
  language: hi
  text: 'और अब, हे धर्मियों, मैं तुमसे कहता हूँ: बुराई के मार्गों पर और मृत्यु के मार्गों पर मत चलो; उनके निकट मत जाओ[a], कहीं ऐसा न हो कि तुम नष्ट हो जाओ[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उनके’ से आशय बुराई और मृत्यु के मार्गों से भी हो सकता है, या उन मार्गों पर चलने वालों से।
    reason: referential_ambiguity
  - marker: b
    text: इसका अनुवाद ‘कहीं तुम मिट न जाओ’ या ‘कहीं तुम विनाश में बहा न दिए जाओ’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: और अब
  rationale: यह नया उपदेश आरम्भ करने वाला काल-सूचक संक्रमण है; ‘और अब’ गीइज़ की सरलता और प्रवाह दोनों बनाए रखता है।
- source_word: ለጻድቃን
  choice: तुम धर्मियों से
  rationale: मूल में संबोधित समूह ‘धर्मी’ हैं; हिंदी में ‘तुम धर्मियों से’ प्रत्यक्ष संबोधन को स्वाभाविक और स्पष्ट बनाता है।
- source_word: ኢትሖሩ
  choice: मत चलो
  rationale: ‘मार्गों’ के साथ चलने की नैतिक रूपक-छवि को सुरक्षित रखता है, उसे केवल ‘जीना’ या ‘जाना’ बनाकर सपाट नहीं करता।
- source_word: በፍኖዋተ እኩይ
  choice: बुराई के मार्गों पर
  rationale: बहुवचन मार्गों और नैतिक बुराई का सीधा, वर्तमान हिंदी रूप; किसी व्यक्तिगत ‘दुष्ट’ का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: በፍኖዋተ ሞት
  choice: मृत्यु के मार्गों पर
  rationale: ‘मृत्यु’ को यथावत रखकर मूल की कठोर प्रलयकारी-ज्ञानपरक छवि सुरक्षित रखी गई है।
- source_word: ኢትቅረቡ ኀቤሆሙ
  choice: उनके निकट मत जाओ
  rationale: निकट आने या संगति करने की चेतावनी व्यक्त होती है; ‘उनके’ का संदर्भ मूल की तरह कुछ खुला रखा गया है।
- source_word: ከመ ኢትትሐጐሉ
  choice: कहीं ऐसा न हो कि तुम नष्ट हो जाओ
  rationale: नकारात्मक प्रयोजन/परिणाम और विनाश की गंभीरता व्यक्त करता है, बिना यह निश्चित किए कि विनाश शारीरिक, नैतिक या न्यायिक है।
theological_decisions:
- issue: ‘उनके’ का संदर्भ
  choice: मुख्य पाठ में बहुवचन सर्वनाम को खुला रखा गया है, जो दुष्ट मार्गों से जुड़े लोगों की ओर संकेत कर सकता है।
  alternative: इसे केवल पहले बताए गए मार्गों का रूपकात्मक संदर्भ माना जा सकता है।
  rationale: गीइज़ बहुवचन सर्वनाम का सटीक संदर्भ पूरी तरह स्पष्ट नहीं करता। इसलिए हिंदी पाठ और पादटिप्पणी दोनों संभावनाएँ बनाए रखते हैं और संगति-विरोधी अर्थ को अनिवार्य नहीं बनाते।
- issue: अंतिम विनाश का स्वरूप
  choice: ‘नष्ट हो जाओ’
  alternative: ‘मिट जाओ’ या ‘विनाश में बहा दिए जाओ’
  rationale: यह न्याय और विनाश की तीव्रता रखता है, पर उसके नैतिक, न्यायिक या शारीरिक स्वरूप को संकीर्ण नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सीधा उपदेशात्मक स्वर रखा गया है। ‘मार्ग’ और ‘चलना’ ज्ञान-साहित्य की नैतिक रूपक-छवि बनाए रखते हैं।
