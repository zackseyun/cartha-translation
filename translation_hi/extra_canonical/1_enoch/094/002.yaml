base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/002.yaml
  text: And to wise men from a generation[a], the paths of violence and death will be revealed[b], and they will keep far from them and will not follow them.
translation:
  language: hi
  text: और एक पीढ़ी के कुछ लोगों को[a] हिंसा और मृत्यु के मार्ग प्रकट किए जाएँगे; तब वे उनसे दूर रहेंगे और उनके पीछे नहीं चलेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “एक पीढ़ी के बुद्धिमान लोगों को।” गीइज़ እሙራን को यहाँ “कुछ/निश्चित” समझा गया है; इसे “बुद्धिमान” भी समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: እሙራን ሰብእ
  choice: कुछ लोगों
  rationale: እሙራን को यहाँ ሰብእ के साथ ‘ज्ञात/निश्चित लोग’, अर्थात ‘कुछ लोग’, समझा गया है। इससे ‘बुद्धिमान’ का वह अर्थ नहीं थोपा जाता जिसके लिए गीइज़ में अधिक स्पष्ट शब्द उपलब्ध हैं।
- source_word: እምትውልድ
  choice: एक पीढ़ी के
  rationale: वाक्यांश को एकवचन और गैर-पुनरावृत्त रखा गया है; ‘पीढ़ी-दर-पीढ़ी’ के लिए अपेक्षित विस्तार मूल पाठ में नहीं है। संबंधसूचक ‘के’ आधुनिक हिन्दी में स्वाभाविक है, यद्यपि ‘में से’ भी संभव है।
- source_word: ይትከሠት
  choice: प्रकट किए जाएँगे
  rationale: क्रिया के प्रकटन/उद्घाटन के भाव और उसके कर्मवाच्य स्वरूप को बनाए रखता है।
- source_word: ፍኖዋተ
  choice: मार्ग
  rationale: ठोस रास्तों की नैतिक रूपक-छवि को सुरक्षित रखता है; इसे अमूर्त ‘आचरण’ में नहीं बदला गया।
- source_word: ግፍዕ
  choice: हिंसा
  rationale: यह शब्द हिंसक अन्याय या उत्पीड़न का अर्थ दे सकता है; संक्षिप्त और तीखी नैतिक छवि के लिए ‘हिंसा’ उपयुक्त है।
- source_word: ሞት
  choice: मृत्यु
  rationale: शब्द का सीधा अर्थ रखा गया है; ‘विनाश’ जैसा व्याख्यात्मक विस्तार नहीं किया गया।
- source_word: ይርኅቁ እምኔሆሙ
  choice: वे उनसे दूर रहेंगे
  rationale: शारीरिक दूरी और नैतिक परहेज़, दोनों की संभावना बनाए रखता है।
- source_word: ኢይትለውዎሙ
  choice: उनके पीछे नहीं चलेंगे
  rationale: ‘अनुसरण करना’ का अर्थ और मार्ग-संबंधी रूपक दोनों स्वाभाविक हिन्दी में सुरक्षित रहते हैं।
theological_decisions:
- issue: नैतिक मार्गों की ठोस छवि बनाम अमूर्त नैतिक व्याख्या
  choice: ‘हिंसा और मृत्यु के मार्ग’ की मूल छवि बनाए रखना
  alternative: ‘हिंसक और घातक आचरण’ या ‘दुष्टता के वे मार्ग जो मृत्यु तक ले जाते हैं’
  rationale: मूल गीइज़ में रास्तों/मार्गों के लिए ठोस बहुवचन संज्ञा है। उसका रूपक सुरक्षित रखने से अपोकैलिप्टिक-ज्ञानपरक शैली बनी रहती है और कारण-परिणाम का अतिरिक्त कथन पाठ में नहीं जोड़ा जाता।
- issue: እሙራን का आशय
  choice: ‘कुछ लोगों’
  alternative: ‘बुद्धिमान लोगों’
  rationale: शब्द को ‘ज्ञात/निश्चित’ के मुहावरेदार अर्थ में लेना इस पद की संशोधित शब्द-समीक्षा से मेल खाता है; फिर भी पाठ-परंपरा में ‘बुद्धिमान’ की व्याख्या रही है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट वाक्य-विन्यास रखा गया है। ‘मार्ग’, ‘हिंसा’, ‘मृत्यु’ और ‘प्रकट’ मूल की ज्ञानपरक-अपोकैलिप्टिक छवि बनाए रखते हैं। मुख्य पाठ में वास्तविक शब्दार्थ-संदेह को [a] से चिह्नित किया गया है।
