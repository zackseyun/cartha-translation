base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/005.yaml
  text: And command them in the thought of your hearts[a], and do not let my words be blotted out from your hearts; for I know that sinners will tempt men to practice evil wisdom, and no place will be found for it[f][e][d][c][b], and no temptation will diminish.
translation:
  language: hi
  text: और अपने हृदयों में सोच-समझकर उन्हें आज्ञा दो[a], और मेरी बातों को अपने हृदयों से मिटने न दो; क्योंकि मैं जानता हूँ कि पापी मनुष्यों को बुरी बुद्धि का आचरण करने के लिए लुभाएँगे, और उसके लिए कोई स्थान न मिलेगा[b], और कोई प्रलोभन कम न होगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने हृदयों के अभिप्राय में उन्हें यह दायित्व सौंपो।” गीइज़ में विचार या अभिप्राय को हृदय, अर्थात भीतरी संकल्प के केंद्र, से जोड़ा गया है।
    reason: lexical_alternative
  - marker: b
    text: “उसके लिए कोई स्थान न मिलेगा” कठिन वाक्यांश है। “स्थान” का अर्थ वास्तविक जगह, गुंजाइश या अवसर हो सकता है।
    reason: alternative_reading
  - marker: c
    text: अंतिम वाक्यांश अनिश्चित है। इसका अर्थ “कोई परीक्षा कम न होगी” या “कोई क्लेश उसे घटा अथवा समाप्त न करेगा” भी हो सकता है।
    reason: textual_uncertainty
lexical_decisions:
- source_word: ትእዛዙ
  choice: आज्ञा दो
  rationale: यह बहुवचन आज्ञार्थक रूप आदेश देने या दृढ़तापूर्वक सौंपने का भाव रखता है। ‘आज्ञा दो’ उपदेशात्मक स्वर की शक्ति बनाए रखता है।
- source_word: በሐሊና ልብክሙ
  choice: अपने हृदयों के विचार में
  rationale: ሐሊና विचार, मन या अभिप्राय का बोध कराता है और ‘हृदय’ के साथ मिलकर भीतरी चिंतन तथा संकल्प को व्यक्त करता है। कुछ असामान्य किंतु अर्थपूर्ण सामी शैली को सुरक्षित रखा गया है।
- source_word: ኢይደምስስ ነገርየ እምልብክሙ
  choice: मेरी बातों को अपने हृदयों से मिटने न दो
  rationale: क्रिया मिटाने, पोंछ डालने या नष्ट करने का चित्र प्रस्तुत करती है। हिंदी में यह स्मृति और अंतरात्मा से वचन के लुप्त होने का भाव स्वाभाविक ढंग से रखता है।
- source_word: ያሜክሮዎሙ ኃጥኣን ለሰብእ
  choice: पापी मनुष्यों को … लुभाएँगे
  rationale: समीक्षित रूप አመከረ से संबंधित है, जिसका अर्थ परखना, प्रलोभित करना या बहकाना है; अतः इसे ‘सिखाएँगे’ नहीं किया गया। ‘लुभाएँगे’ अंतिम መከራ के साथ प्रलोभन की शब्दगत कड़ी भी बनाए रखता है।
- source_word: ይግበሩ ጥበበ እኩየ
  choice: बुरी बुद्धि का आचरण करने के लिए
  rationale: ጥበብ का सामान्य अर्थ बुद्धि है, पर यहाँ वह नैतिक रूप से विकृत कौशल या चतुराई को सूचित करता है। ‘बुरी बुद्धि’ मूल की विडंबनापूर्ण तनावपूर्ण अभिव्यक्ति को बनाए रखता है।
- source_word: ኵሉ መካን ኢይትረከብ ላቲ
  choice: उसके लिए कोई स्थान न मिलेगा
  rationale: መካን स्थान, जगह या अवसर हो सकता है। निकट अनुवाद वास्तविक स्थान और रूपकात्मक गुंजाइश—दोनों संभावनाएँ खुली रखता है।
- source_word: ኵሉ መከራ አያሐፅፅ
  choice: कोई प्रलोभन कम न होगा
  rationale: መከራ परीक्षा, प्रलोभन, क्लेश या संकट हो सकता है। यहाँ पूर्ववर्ती ‘लुभाएँगे’ के साथ मूल की शब्दगत कड़ी को बनाए रखने के लिए ‘प्रलोभन’ चुना गया, जबकि कठिन अंतिम क्रिया को सामान्य ‘कम होना’ से व्यक्त किया गया।
theological_decisions:
- issue: क्या चेतावनी सामान्य दुष्ट आचरण की है या बुद्धि के विकृतिकरण की
  choice: ‘बुरी बुद्धि’ रखा गया
  alternative: ‘दुष्ट चतुराई’ अथवा केवल ‘बुराई’
  rationale: मूल में ‘बुद्धि’ के लिए प्रयुक्त शब्द को बनाए रखने से झूठी या नैतिक रूप से उलटी बुद्धि का तनाव सुरक्षित रहता है; इसे सामान्य दुष्टता में समतल नहीं किया गया।
- issue: लुभाने और अंतिम प्रलोभन के बीच शब्दगत संबंध
  choice: ‘लुभाएँगे’ और ‘प्रलोभन’
  alternative: ‘बहकाएँगे’ और ‘क्लेश’
  rationale: दोनों गीइज़ पदों की मूलगत निकटता को हिंदी में यथासंभव दृश्यमान रखा गया, पर अंतिम पद की अर्थगत अनिश्चितता पादटिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गंभीर और उपदेशात्मक रखी गई है। ‘हृदयों के विचार’ और ‘बुरी बुद्धि’ जैसी थोड़ी असामान्य अभिव्यक्तियाँ मूल की अंतःकरण-संबंधी तथा ज्ञान-संबंधी तनावपूर्ण भाषा को सुरक्षित रखने के लिए जानबूझकर रखी गई हैं।
