base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/007.yaml
  text: Woe to those who build their houses by sin, for they will be torn down from all their foundations; [and they will fall by the sword;] and those who acquire gold and silver will quickly be destroyed in judgment.
translation:
  language: hi
  text: हाय उन लोगों पर जो पाप के द्वारा अपने घर बनाते हैं, क्योंकि उनके घर अपनी सारी नींवों से उखाड़ दिए जाएँगे; [और वे तलवार से मारे जाएँगे;][a] और जो सोना और चाँदी बटोरते हैं, वे न्याय में शीघ्र नष्ट हो जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “और वे तलवार से मारे जाएँगे” वाला वाक्यांश उपलब्ध मूल पाठ में कोष्ठकों के भीतर है, जो उसके पाठगत रूप पर अनिश्चितता दर्शाता है।
    reason: मूल-स्रोत में चिह्नित पाठगत अनिश्चितता को पाठक के सामने बनाए रखना।
lexical_decisions:
- source_word: በኃጢአት
  choice: पाप के द्वारा
  rationale: करणवाचक በ को बनाए रखते हुए यह स्पष्ट करता है कि पाप घर बनाने का साधन या आधार है; केवल ‘पाप में’ कहने से संबंध अनावश्यक रूप से अस्पष्ट हो सकता था।
- source_word: እምኵሉ፡ መሠረቶሙ፡ ይትነሠቱ
  choice: उनके घर अपनी सारी नींवों समेत उखाड़ दिए जाएँगे
  rationale: मूल के नींव से हटाए या उखाड़े जाने के प्रबल चित्र को सुरक्षित रखा गया है। हिन्दी में कर्ता स्पष्ट करने के लिए ‘उनके घर’ दोहराया गया है।
- source_word: ያጠርይዎ፡ ለወርቅ፡ ወለብሩር
  choice: सोना और चाँदी बटोरते हैं
  rationale: क्रिया धन अर्जित या जमा करने का भाव देती है; ‘बटोरते हैं’ सामान्य हिन्दी में संचय की प्रवृत्ति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: በጽነኔ
  choice: न्याय में
  rationale: उपलब्ध पाठ और परामर्श-स्तर के अनुवाद के अनुसार इसे न्यायिक प्रसंग में लिया गया है; इसे सोना-चाँदी अर्जित करने के साथ जोड़कर ‘अन्याय से’ नहीं बनाया गया।
- source_word: ፍጡነ፡ ይትሐጐሉ
  choice: शीघ्र नष्ट हो जाएँगे
  rationale: क्रियाविशेषण की तत्परता और विनाशसूचक क्रिया दोनों को सीधे तथा स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: पाप और घर बनाने के बीच संबंध
  choice: पाप के द्वारा अपने घर बनाते हैं
  alternative: पाप में अपने घर बनाते हैं
  rationale: मूल के करणवाचक संबंध को प्राथमिकता दी गई है और पाप को केवल परिवेश बताने के बजाय निर्माण के अनैतिक साधन के रूप में व्यक्त किया गया है।
- issue: सोना-चाँदी बटोरने वालों का विनाश
  choice: वे न्याय में शीघ्र नष्ट हो जाएँगे
  alternative: जो अन्याय से सोना-चाँदी बटोरते हैं, वे शीघ्र नष्ट हो जाएँगे
  rationale: वाक्यांश को ‘न्याय’ से जोड़ने वाली स्रोत-आधारित समझ बरकरार रखी गई है; नैतिक दोष को धन अर्जन की विधि में स्थानांतरित नहीं किया गया।
- issue: तलवार वाला खंड
  choice: मुख्य पाठ में कोष्ठकों सहित रखा गया
  alternative: बिना कोष्ठक के निर्बाध मुख्य पाठ में रखना
  rationale: प्रदत्त मूल-साक्ष्य में यह खंड स्वयं वर्ग कोष्ठकों में है, इसलिए उसकी पाठगत अनिश्चितता को मिटाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘हाय उन लोगों पर’ भविष्यद्वाणी-संबंधी चेतावनी का पारंपरिक भार बनाए रखता है।
