base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/009.yaml
  text: You have committed reproach and violence[a], and you have made yourselves ready for the day of the shedding of blood, and for the day of darkness[c][b], and for the day of the great judgment.
translation:
  language: hi
  text: तुमने निंदा और हिंसा की है[a], और तुम लहू बहने के दिन[b], अंधकार के दिन और महान न्याय के दिन के लिए तैयार हो गए हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल की व्याकरणिक रचना का अर्थ ‘तुमने निंदा और हिंसा की है’ है; अधिक शब्दशः रूप में क्रिया के भीतर एक पूर्वसूचक कर्म-सर्वनाम भी उपस्थित है।
    reason: grammar_clarification
  - marker: b
    text: या ‘रक्तपात के दिन’ अथवा ‘लहू बहाए जाने के दिन’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ገበርክምዋ፡ ለጽርፈት፡ ወለዓመፃ
  choice: तुमने निंदा और हिंसा की है
  rationale: क्रिया ገበረ का अर्थ यहाँ ‘करना/अंजाम देना’ है। उसमें लगा स्त्रीलिंग एकवचन कर्म-प्रत्यय आगे आने वाले कर्मों की पूर्वसूचना देता है, और ለ इस रचना में प्रयोजन नहीं बल्कि कर्म को चिह्नित करता है। इसलिए ‘निंदा और हिंसा की है’ स्रोत की व्याकरणिक रचना और आरोपात्मक स्वर को स्पष्ट रखता है।
- source_word: ለጽርፈት
  choice: निंदा
  rationale: यह संज्ञा निंदा, अपमान या बुरा-भला कहने का भाव दे सकती है। ‘निंदा’ आधुनिक हिन्दी में स्वाभाविक है और नैतिक-न्यायिक स्वर बनाए रखती है।
- source_word: ወለዓመፃ
  choice: और हिंसा
  rationale: शब्द का अर्थ हिंसक दुष्कर्म, अत्याचार या उत्पीड़न तक विस्तृत हो सकता है। आगामी लहू बहने के उल्लेख के कारण ‘हिंसा’ यहाँ उपयुक्त और सशक्त है।
- source_word: ወድልዋነ፡ ኮንክሙ
  choice: और तुम ... के लिए तैयार हो गए हो
  rationale: रचना दूसरे पुरुष बहुवचन में तैयार हो जाने की अवस्था व्यक्त करती है। हिन्दी का ‘तैयार हो गए हो’ उस परिणामी अवस्था को सहज ढंग से व्यक्त करता है।
- source_word: ለዕለተ፡ ክዕወት፡ ደም
  choice: लहू बहने के दिन
  rationale: मूल पदबंध लहू के बहाए या उंडेले जाने की घटना की ओर संकेत करता है। ‘लहू बहने’ से दृश्यात्मकता बनी रहती है और यह अनावश्यक रूप से तय नहीं करता कि लहू कौन बहाएगा।
- source_word: ወለዕለተ፡ ጽልመት
  choice: अंधकार के दिन
  rationale: यह सीधा और स्वाभाविक अनुवाद बार-बार आने वाली प्रलय-संबंधी ‘दिन’ की संरचना को सुरक्षित रखता है।
- source_word: ወለዕለተ፡ ኵነኔ፡ ዐቢይ
  choice: और महान न्याय के दिन
  rationale: ኵነኔ न्याय, दंडादेश या दोषसिद्धि का अर्थ दे सकता है। ‘महान न्याय’ निर्णय की गंभीरता बनाए रखता है, पर दोषसिद्धि को अनुवाद में पहले से निश्चित नहीं करता।
theological_decisions:
- issue: क्या अंतिम तीन पदबंध सामान्य ऐतिहासिक विपत्ति बताते हैं या अंतिम न्याय की प्रलय-संबंधी भाषा हैं
  choice: ‘लहू बहने के दिन, अंधकार के दिन और महान न्याय के दिन’ के रूप में तीनों ‘दिन’ स्पष्ट रूप से बनाए रखे गए हैं।
  alternative: इन्हें सामान्य विपत्ति, दंड या ऐतिहासिक विनाश के रूप में ढीले ढंग से व्यक्त करना।
  rationale: ‘दिन’ की पुनरावृत्ति, अंधकार और महान न्याय का उत्कर्ष प्रलय-संबंधी न्याय की भाषा को सूचित करता है। फिर भी अनुवाद उस दिन की घटनाओं का कोई अतिरिक्त धर्मसैद्धांतिक क्रम निर्धारित नहीं करता।
- issue: ኵነኔ को ‘न्याय’ या ‘दोषदंड’ कहना
  choice: महान न्याय
  alternative: महान दोषदंड अथवा महान दंडादेश
  rationale: मूल शब्द में निर्णय और दोषसिद्धि दोनों की अर्थ-संभावना है। ‘न्याय’ व्यापकता को बनाए रखता है और परिणाम को मूल से अधिक निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘लहू’, ‘अंधकार’ और ‘महान न्याय’ से मूल की प्रलय-संबंधी चित्रात्मकता बनी रहती है; वाक्य में ‘दिन’ की पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है।
