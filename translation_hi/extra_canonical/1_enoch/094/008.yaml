base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/008.yaml
  text: Woe to you[a], rich ones, for you have trusted in your riches, and from your riches you will depart[b], because you did not remember the Most High in the days of your riches.
translation:
  language: hi
  text: हे धनवानो, तुम पर हाय[a]! क्योंकि तुमने अपनी धन-संपत्ति पर भरोसा रखा है; और अपनी धन-संपत्ति से तुम अलग हो जाओगे[b], क्योंकि अपनी धन-संपत्ति के दिनों में तुमने परमप्रधान को स्मरण नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे धनवानो, हाय तुम पर!”
    reason: हिंदी में संबोधन और हाय-घोषणा के शब्दक्रम का वैकल्पिक रूप।
  - marker: b
    text: शाब्दिक रूप से, “अपनी धन-संपत्ति से तुम निकल जाओगे।” इसका संकेत धन छिन जाने या न्याय के समय उसे पीछे छोड़ देने—दोनों में से किसी ओर हो सकता है।
    reason: मूल अभिव्यक्ति की स्थानगत छवि और उसके संभावित अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: አሌ
  choice: हाय
  rationale: यह भविष्यद्वक्ताओं जैसी न्याय-घोषणा का सूत्र है; ‘हाय’ उसके चेतावनी और दंड के भाव को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: አብዕልት
  choice: धनवानो
  rationale: बहुवचन संबोधन को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ብዕልክሙ
  choice: अपनी धन-संपत्ति
  rationale: धन और संपदा का अर्थ देता है तथा पद में इसकी पुनरावृत्ति को सुरक्षित रखता है।
- source_word: ተወከልክሙ
  choice: तुमने ... भरोसा रखा है
  rationale: क्रिया में निर्भरता और विश्वास दोनों का भाव है; यह गलत आधार पर भरोसे की नैतिक आलोचना को स्पष्ट रखता है।
- source_word: ትወፅኡ
  choice: तुम अलग हो जाओगे
  rationale: እምነ के साथ यह किसी वस्तु से निकलने अथवा उससे अलग होने का संकेत देता है। हिंदी में यह सहज है और न्याय के ठीक स्वरूप को अनिर्धारित रहने देता है।
- source_word: ለልዑል
  choice: परमप्रधान
  rationale: यह यहूदी सर्वनाश-साहित्य में प्रचलित ईश्वरीय उपाधि का स्थापित और संक्षिप्त हिंदी रूप है।
- source_word: ኢተዘከርክምዎ
  choice: तुमने ... स्मरण नहीं किया
  rationale: मूल क्रिया ‘स्मरण करना’ है; यह समृद्धि के बीच परमेश्वर को भूलने के नैतिक आरोप को सुरक्षित रखती है।
- source_word: በመዋዕለ ብዕልክሙ
  choice: अपनी समृद्धि के दिनों में
  rationale: कालसूचक पदबंध को स्वाभाविक हिंदी में व्यक्त करता है; यहाँ ‘समृद्धि’ काल या अवस्था का बोध ‘धन-संपत्ति के दिनों’ से अधिक सहजता से कराती है।
theological_decisions:
- issue: ‘अपनी धन-संपत्ति से तुम निकलोगे’ का अभिप्राय
  choice: ‘अपनी धन-संपत्ति से तुम अलग हो जाओगे’ कहकर मूल अलगाव की छवि को बनाए रखना
  alternative: इसे मृत्यु, धन छिन जाने, या निर्वासन के रूप में स्पष्ट कर देना
  rationale: गीज़ पाठ संक्षिप्त और बहुअर्थी है। अनुवाद धन से होने वाले भावी अलगाव को बताता है, पर यह तय नहीं करता कि वह मृत्यु, संपत्ति की हानि, या किसी अन्य न्याय के द्वारा होगा।
translation_notes:
  register: आधुनिक मानक हिंदी का गंभीर, भविष्यद्वक्ताओं जैसा चेतावनीपूर्ण स्वर अपनाया गया है। ‘धनवानो’, ‘हाय’ और ‘परमप्रधान’ जैसे शब्द सामान्य पाठक के लिए बोधगम्य रहते हुए गरिमा बनाए रखते हैं। मुख्य पाठ में अनावश्यक रूप से मृत्यु या संपत्ति-हरण का अर्थ नहीं थोपा गया।
