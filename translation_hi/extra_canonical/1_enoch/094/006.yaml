base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/006.yaml
  text: Woe to those who build up unrighteousness and oppression[a], and who lay the foundation of deceit, for they will be swiftly overthrown[b], and they will have no peace.
translation:
  language: hi
  text: हाय उन पर जो अधर्म और अत्याचार का निर्माण करते हैं और छल की नींव डालते हैं[a]! क्योंकि वे शीघ्र ही ढा दिए जाएँगे[b], और उन्हें शांति नहीं मिलेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस गीइज़ पदबंध का ठीक व्याकरणिक संबंध कुछ अनिश्चित है; इसका अर्थ ‘छल की नींव डालते हैं’, ‘छल को स्थापित करते हैं’ या ‘छल पर नींव रखते हैं’ हो सकता है। सभी पाठों में निर्माण की छवि छल या कपट से जुड़ी रहती है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘शीघ्र ही हटा दिए जाएँगे’ अथवा ‘उखाड़ दिए जाएँगे।’ निर्माण के प्रसंग में ‘ढा दिए जाएँगे’ चुना गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ
  choice: हाय उन पर
  rationale: यह न्याय की भविष्यवाणी का उद्घोष है; ‘हाय’ उसकी निंदा और आसन्न विपत्ति—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: የሐንጽዋ
  choice: निर्माण करते हैं
  rationale: मूल के भवन-निर्माण रूपक को बनाए रखता है और आगे आने वाली ‘नींव’ तथा ‘ढा दिए जाने’ की भाषा से जुड़ता है।
- source_word: ለዓመፃ
  choice: अधर्म
  rationale: यह व्यापक नैतिक और न्यायिक बुराई को व्यक्त करता है; इसे केवल सामाजिक अन्याय तक सीमित नहीं करता।
- source_word: ወለግፍዕ
  choice: और अत्याचार
  rationale: बलपूर्वक किए जाने वाले दमन और दुर्व्यवहार का भाव देता है तथा ‘अधर्म’ के साथ स्वाभाविक युग्म बनाता है।
- source_word: ወይሣርርዋ ለጕሕሉት
  choice: और छल की नींव डालते हैं
  rationale: ጕሕሉት को विशेषण नहीं, ‘छल’ अर्थ वाले भाववाचक संज्ञा-रूप में रखता है और निर्माण का रूपक सुरक्षित रखता है।
- source_word: ፍጡነ
  choice: शीघ्र ही
  rationale: आसन्न और तेजी से होने वाले न्याय का भाव सहज, गरिमापूर्ण हिन्दी में देता है।
- source_word: ይትነሠቱ
  choice: ढा दिए जाएँगे
  rationale: क्रिया के हटाए या गिराए जाने के न्याय-संबंधी भाव को निर्माण-रूपक के अनुरूप व्यक्त करता है, बिना उसकी संभावित व्यापकता छिपाए।
- source_word: ወአልቦሙ ሰላመ
  choice: और उन्हें शांति नहीं मिलेगी
  rationale: अंतिम न्याय-वाक्य को सीधी और स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: क्या नैतिक बुराइयों को अमूर्त कर्मों के रूप में कहा जाए या निर्माण-रूपक बनाए रखा जाए
  choice: ‘निर्माण’, ‘नींव’ और ‘ढा दिए जाएँगे’ के द्वारा निर्माण-रूपक बनाए रखा गया है।
  alternative: ‘जो अधर्म, अत्याचार और छल करते हैं’ जैसे पूर्णतः अमूर्त शब्दों में अर्थ देना।
  rationale: मूल में भवन और नींव की छवि जानबूझकर प्रयुक्त प्रतीत होती है, और उसके उत्तर में आने वाला विनाश उसी छवि को पूरा करता है; इसे बनाए रखने से अपोकैलिप्टिक न्याय-वाणी की शक्ति सुरक्षित रहती है।
- issue: ይትነሠቱ में विनाश की छवि का स्वरूप
  choice: ढा दिए जाएँगे
  alternative: हटा दिए जाएँगे / उखाड़ दिए जाएँगे
  rationale: संदर्भ में निर्माण और नींव की भाषा होने के कारण ‘ढा दिए जाएँगे’ सर्वाधिक संगत है, पर मूल क्रिया हटाए जाने या उखाड़े जाने की व्यापक छाया भी रख सकती है; इसे पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, भविष्यद्वाणी-सदृश स्वर रखा गया है। वाक्य सामान्य पाठक के लिए सहज है, जबकि ‘अधर्म’, ‘अत्याचार’, ‘नींव’ और ‘शांति’ जैसे शब्द मूल की नैतिक तथा साहित्यिक गंभीरता बनाए रखते हैं।
