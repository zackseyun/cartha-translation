base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/064/002.yaml
  text: And I heard the voice of the angel saying[a], 'These are the angels who came down upon the earth and revealed what was hidden to the children of men[b], and led the children of men astray so that they committed sin.'
translation:
  language: hi
  text: और मैंने स्वर्गदूत की आवाज़ सुनी। वह कह रहा था, “ये वे स्वर्गदूत हैं जो पृथ्वी पर उतरे और जिन्होंने मनुष्यों की संतान[a] को वह प्रकट किया जो छिपा हुआ था[b]; उन्होंने मनुष्यों की संतान को भटका दिया, ताकि वे पाप करें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “मनुष्यों की संतान”; हनोक-साहित्य में यह मानवजाति के लिए प्रयुक्त अभिव्यक्ति है।
    reason: cultural_note
  - marker: b
    text: इसे “छिपी हुई बातें खोलकर बता दीं” भी कहा जा सकता है। गीइज़ अभिव्यक्ति उस चीज़ के उजागर किए जाने की ओर संकेत करती है जो छिपी थी, पर इस पद में यह नहीं बताती कि वे रहस्य क्या थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰማዕኩ
  choice: मैंने ... सुनी
  rationale: प्रथम पुरुष की पूर्ण क्रिया को दर्शन-वर्णन में सीधे और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ቃሎ ለመልአክ
  choice: स्वर्गदूत की आवाज़
  rationale: श्रवण-सूचक क्रिया के साथ ቃል का अर्थ यहाँ ‘आवाज़’ स्वाभाविक है, यद्यपि इसका अर्थ ‘वचन’ या ‘कथन’ भी हो सकता है।
- source_word: እንዘ ይብል
  choice: वह कह रहा था
  rationale: प्रत्यक्ष कथन का परिचय देने वाली निरंतर क्रिया को आधुनिक हिन्दी में सहज रूप देता है।
- source_word: እሉ ውእቶሙ
  choice: ये वे ... हैं
  rationale: मूल के संकेतवाचक और पहचानसूचक बल, दोनों को बनाए रखता है।
- source_word: መላእክት እለ ወረዱ ዲበ ምድር
  choice: वे स्वर्गदूत ... जो पृथ्वी पर उतरे
  rationale: स्वर्गदूतों के नीचे उतरने की अपोकैलिप्टिक छवि को बिना अतिरिक्त उपाधि जोड़े सुरक्षित रखता है।
- source_word: ወዘበኅቡእ ከሠቱ
  choice: वह प्रकट किया जो छिपा हुआ था
  rationale: छिपी हुई वस्तु या विषय को अनावश्यक रूप से विशिष्ट किए बिना छिपे को खोलने या प्रकट करने का भाव रखता है।
- source_word: ለውሉደ ሰብእ
  choice: मनुष्यों की संतान
  rationale: हनोक-साहित्य की पारंपरिक मानव-समुदायसूचक अभिव्यक्ति को आधुनिक हिन्दी में समझने योग्य रूप में बनाए रखता है।
- source_word: ወአስሐትዎሙ
  choice: भटका दिया
  rationale: यह नैतिक पथभ्रष्टता और किसी को भूल में डालने, दोनों भावों को संक्षेप में व्यक्त करता है।
- source_word: ከመ ይግበሩ ኃጢአተ
  choice: ताकि वे पाप करें
  rationale: उद्देश्य या परिणाम की मूल अस्पष्टता को ‘ताकि’ के द्वारा पर्याप्त रूप से खुला रखता है और पाप को किए गए कार्य के रूप में व्यक्त करता है।
theological_decisions:
- issue: अपराधी स्वर्गदूतों की पहचान
  choice: केवल ‘वे स्वर्गदूत ... जो पृथ्वी पर उतरे’
  alternative: ‘पहरेदार’ या ‘पतित स्वर्गदूत’
  rationale: इस पद में गीइज़ पाठ केवल ‘स्वर्गदूत’ कहता है। व्यापक हनोक-परंपरा की उपाधि को यहाँ जोड़ना स्थानीय पाठ से आगे जाना होता।
- issue: प्रकट की गई छिपी सामग्री का स्वरूप
  choice: ‘वह ... जो छिपा हुआ था’
  alternative: ‘गुप्त विद्याएँ’, ‘स्वर्गीय रहस्य’ या ‘निषिद्ध ज्ञान’
  rationale: पद स्वयं उस सामग्री को निर्दिष्ट नहीं करता; इसलिए अनुवाद उसकी वास्तविक व्यापकता और अस्पष्टता को बनाए रखता है।
- issue: पाप और भटकाए जाने का संबंध
  choice: ‘भटका दिया, ताकि वे पाप करें’
  alternative: ‘धोखा दिया और उन्होंने पाप किया’
  rationale: मूल के उद्देश्य/परिणामसूचक संबंध को सुरक्षित रखते हुए यह स्वर्गदूतों की प्रेरक भूमिका बताता है, पर मानव उत्तरदायित्व के विषय में पाठ से अधिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है, पर दर्शन-साहित्य के अनुरूप गरिमामय रखी गई है। ‘स्वर्गदूत’, ‘पृथ्वी पर उतरे’ और ‘मनुष्यों की संतान’ जैसे पद मूल की धार्मिक-साहित्यिक छवि को रखते हैं; वाक्य-विन्यास सामान्य पाठक के लिए सहज बनाया गया है।
