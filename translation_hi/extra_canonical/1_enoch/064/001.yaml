  rationale: संक्षिप्त दर्शनीय कथन में ठोस बिंब को सुरक्षित रखना उचित है। ‘व्यक्ति’ या ‘प्राणी’ मूल में निहित संभावित आशय हो सकता है, पर उसे मुख्य पाठ में रखने से वास्तविक अस्पष्टता समाप्त हो जाएगी।
