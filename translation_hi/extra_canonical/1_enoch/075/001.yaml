base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/001.yaml
  text: And the leaders of the heads of thousands[a], who are over all creation and over all the stars, together with those four that are added and do not separate from their service[e][d][c][b], according to the reckoning of the year—and these render service on the four days that are not counted in the reckoning of the year.
translation:
  language: hi
  text: और उनके अगुए—हज़ारों के प्रधान[a], जो सारी सृष्टि और सब तारों के ऊपर हैं—उन चारों के साथ, जो जोड़े जाते हैं[b] और वर्ष की गणना के अनुसार अपने कार्य से अलग नहीं होते; और वे चार दिनों में सेवा करते हैं[c], जिन्हें वर्ष की गणना में नहीं गिना जाता[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हज़ारों के सिर”; अर्थात पदानुक्रम में प्रधान अधिकारी।
    reason: lexical_alternative
  - marker: b
    text: या “संलग्न किए जाते हैं।” गीज़ शब्द का अर्थ किसी व्यवस्थित क्रम में जोड़ना भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: कठिन क्रिया; इसका अनुवाद “अपनी बारी लेते हैं” या “बदलते हैं” भी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: ये चार अतिरिक्त पंचांग-दिन हैं, जो खगोलीय पुस्तक की 364-दिवसीय वर्ष-व्यवस्था में वर्ष के चार मोड़ों से जुड़े हैं।
    reason: cultural_note
lexical_decisions:
- source_word: መራሕያኒሆሙ
  choice: उनके अगुए
  rationale: मूल शब्द नेतृत्व या मार्गदर्शन करने वालों को दर्शाता है। ‘अगुए’ आधुनिक हिन्दी में इस ब्रह्मांडीय प्रशासनिक भूमिका को सहज और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: አርእስተ አእላፍ
  choice: हज़ारों के प्रधान
  rationale: शाब्दिक अर्थ ‘हज़ारों के सिर/प्रधान’ है। यह अनुवाद पदानुक्रम का भाव बनाए रखता है, पर अनावश्यक सैनिक अर्थ नहीं जोड़ता।
- source_word: ዲበ ኵሉ ፍጥረት ወዲበ ኵሉ ከዋክብት
  choice: सारी सृष्टि और सब तारों के ऊपर
  rationale: दोनों सार्वभौमिक पदबंधों और ब्रह्मांडीय अधिकार-क्षेत्र को निकटता से सुरक्षित रखता है।
- source_word: ይትዌሰኩ
  choice: जोड़े जाते हैं
  rationale: निष्क्रिय अर्थ जोड़ने या व्यवस्थित क्रम से संलग्न करने का संकेत देता है; पंचांग-संबंधी संदर्भ में ‘जोड़े जाते हैं’ स्वाभाविक है।
- source_word: ኢይትሌለዩ እምነ ምግባሮሙ
  choice: अपने कार्य से अलग नहीं होते
  rationale: ምግባር का अर्थ कार्य, कर्तव्य या व्यवहार हो सकता है। ‘कार्य’ व्यापक है और ब्रह्मांडीय सेवा की किसी विशेष धार्मिक व्याख्या को आरोपित नहीं करता।
- source_word: በከመ ሐሳበ ዓመት
  choice: वर्ष की गणना के अनुसार
  rationale: तकनीकी पंचांग-संबंधी अर्थ को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ይትቀየዩ
  choice: बारी-बारी से अपना कार्य करते हैं
  rationale: क्रिया कठिन है और बदलने, क्रम बदलने या अपनी बारी का कार्य करने का भाव दे सकती है। संदर्भ में यह चुनाव परिवर्तन और नियत कार्य—दोनों संकेतों को यथासंभव रखता है।
- source_word: ፬ መዋዐለ እለ ኢይትኃሰቡ
  choice: उन चार दिनों में ... जिन्हें ... नहीं गिना जाता
  rationale: चार दिनों और वार्षिक गणना से उनके बहिष्कार को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘उन चारों’ की प्रकृति
  choice: मुख्य पाठ उन्हें केवल ‘उन चारों’ कहता है और अंतिम खंड उन्हें चार अगणित दिनों से कार्यात्मक रूप से जोड़ता है।
  alternative: उन्हें सीधे चार दिन, चार स्वर्गीय अधिकारी, या दिनों के चार दूत-पर्यवेक्षक कहा जा सकता था।
  rationale: गीज़ पाठ पहले केवल ‘इन चार’ कहता है और बाद में ‘चार दिन’ कहता है। इसलिए अनुवाद इस संबंध को पूरी तरह एक ही अर्थ में सीमित नहीं करता।
- issue: ‘जो जोड़े जाते हैं और ... अलग नहीं होते’ का व्याकरणिक संबंध
  choice: दोनों क्रियाओं को निकटतम पद ‘उन चारों’ से जोड़ा गया है।
  alternative: ‘अपने कार्य से अलग नहीं होते’ को अगुओं और उन चारों से मिलकर बने पूरे समूह का मुख्य कथन माना जा सकता है।
  rationale: सापेक्ष सूचक እለ स्पष्टतः ‘जो जोड़े जाते हैं’ को उन चारों से जोड़ता है; आगे की क्रिया का कर्ता वाक्य-विन्यास में कुछ हद तक अस्पष्ट रह सकता है।
- issue: ይትቀየዩ में सेवा या परिवर्तन का भाव
  choice: ‘बारी-बारी से अपना कार्य करते हैं’
  alternative: ‘सेवा करते हैं’ या ‘बदलते हैं’
  rationale: इस कठिन क्रिया में परिवर्तन/बारी और नियत कार्य दोनों की संभावना है। चुना हुआ रूप संदर्भ में समझने योग्य रहते हुए दोनों को समेटता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है। वाक्य की प्राचीन, पदानुक्रमिक और खगोलीय गरिमा बनाए रखते हुए ‘गणना’, ‘प्रधान’ और ‘कार्य’ जैसे सामान्यतः समझ में आने वाले शब्द चुने गए हैं। मूल की कठिन वाक्य-संरचना को अत्यधिक सरल नहीं किया गया, ताकि ‘चारों’ की पहचान और उनकी भूमिका की वास्तविक अस्पष्टता बनी रहे।
