- source_word: አርአየኒ
  choice: मुझे दिखाया
  rationale: दर्शन-संबंधी क्रिया का स्पष्ट और मूल के निकट रूप।
- source_word: እግዚአ ስብሐት
  choice: महिमा के प्रभु
  rationale: दैवी उपाधि की संबंधकारक रचना और गरिमापूर्ण स्वर सुरक्षित रहता है।
- source_word: ብርሃናት ሰማይ
  choice: आकाश की सभी ज्योतियाँ
  rationale: खगोलीय प्रकाश-पिंडों का बोध कराता है और सामान्य हिन्दी में समझने योग्य है।
- source_word: በሰማይ ወበዓለም
  choice: स्वर्ग में और संसार में
  rationale: मूल के दो ब्रह्मांडीय क्षेत्रों को बिना समतल किए निकटता से रखता है।
- source_word: ይምልኩ
  choice: शासन करती हैं
  rationale: मूल में निहित शासन और अधिकार की सजीव भाषा को बनाए रखता है।
- source_word: ገጸ ሰማይ
  choice: आकाश का मुख
  rationale: दृश्य आकाश-विस्तार के मूल रूपक को सुरक्षित रखता है।
- source_word: መራሕያነ
  choice: मार्गदर्शक
  rationale: दिन और रात को व्यवस्थित या निर्देशित करने की भूमिका व्यक्त करता है।
- source_word: ቅንየታት
  choice: सेवक शक्तियाँ
