base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/003.yaml
  text: For concerning the signs and the seasons and the years and the days[a], Uriel, the angel whom the Lord of glory appointed forever over all the luminaries of heaven in heaven and in the world, showed me how they rule over the face of heaven and are seen upon the earth[e][d][c][b], and become guides for day and for night—the sun and the moon and the stars and all the ministering powers that make their circuit in all the chariots of heaven.
translation:
  language: hi
  text: 'क्योंकि चिह्नों, ऋतुओं[a], वर्षों और दिनों के विषय में ऊरीएल ने मुझे दिखाया कि—वह स्वर्गदूत, जिसे महिमा के प्रभु ने सदा के लिए स्वर्ग में और संसार में आकाश की सभी ज्योतियों पर नियुक्त किया—वे किस प्रकार आकाश के मुख[b] पर शासन करती हैं और पृथ्वी पर दिखाई देती हैं, और दिन तथा रात के लिए मार्गदर्शक बनती हैं: सूर्य, चन्द्रमा, तारे और वे सभी सेवक शक्तियाँ[c], जो आकाश के सब रथों[d] में अपना चक्कर लगाती हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नियत समयों’; यह शब्द पंचांग के निश्चित काल-विभागों का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘आकाश का मुख’ दृश्य आकाश-विस्तार के लिए प्रयुक्त एक शाब्दिक मुहावरा है।
    reason: cultural_note
  - marker: c
    text: ‘सेवक शक्तियाँ’ का अर्थ अनिश्चित है; इससे खगोलीय पिंडों से जुड़ी सेवारत स्वर्गीय श्रेणियाँ या उनके व्यवस्थित कार्य अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
  - marker: d
    text: ‘आकाश के रथ’ संभवतः उन व्यवस्थित मार्गों को सूचित करते हैं जिन पर खगोलीय पिंड चलते हैं; मुख्य पाठ में मूल रूपक बनाए रखा गया है।
    reason: lexical_alternative
