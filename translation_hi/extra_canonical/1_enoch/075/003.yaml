  rationale: परिक्रामी गति का स्वाभाविक हिन्दी वर्णन।
- source_word: ሰረገላት ሰማይ
  choice: आकाश के रथ
  rationale: मूल की प्रलयदर्शी छवि को आधुनिक ‘कक्षा’ जैसे शब्द से प्रतिस्थापित नहीं करता।
- source_word: ለዓለም
  choice: सदा के लिए
  rationale: ऊरीएल की नियुक्ति की स्थायी अवधि को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: ज्योतियों के कार्य को सजीव शासन-भाषा में रखना
  choice: ‘वे ... शासन करती हैं’ और ‘मार्गदर्शक बनती हैं’ रखा गया है।
  alternative: इसे निर्जीव खगोलीय भाषा में ‘चलती और दिन-रात को चिह्नित करती हैं’ कहना।
  rationale: गीज़ पाठ शासन और मार्गदर्शन की भाषा इस्तेमाल करता है; इसे बनाए रखने से ग्रंथ का प्रलयदर्शी ब्रह्मांड-दृष्टिकोण सुरक्षित रहता है।
- issue: ‘आकाश के रथों’ का रूपक
  choice: मुख्य पाठ में ‘आकाश के ... रथ’ रखा गया है।
  alternative: ‘आकाशीय मार्ग’ या ‘कक्षाएँ’ कहना।
  rationale: संभावित खगोलीय आशय के बावजूद मूल की रथ-संबंधी छवि को मिटाना उचित नहीं; स्पष्टीकरण पादटिप्पणी में दिया गया है।
- issue: ऊरीएल की नियुक्ति में ለዓለም का संबंध
  choice: ‘जिसे ... सदा के लिए ... नियुक्त किया’
  alternative: ‘सदा के लिए सभी ज्योतियों पर’ को ऐसा पढ़ना कि स्थायित्व ज्योतियों से जुड़ा हो।
  rationale: वाक्य-संरचना में ‘सदा के लिए’ को प्रभु द्वारा ऊरीएल की नियुक्ति की अवधि से जोड़ना सर्वाधिक स्वाभाविक है, जबकि मूल की गरिमा बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, किंतु सामान्य पाठक के लिए सुबोध शैली। ‘ऊरीएल’, ‘महिमा के प्रभु’, ‘आकाश का मुख’ और ‘आकाश के रथ’ द्वारा प्रलयदर्शी स्वर तथा मूल रूपक सुरक्षित रखे गए हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
