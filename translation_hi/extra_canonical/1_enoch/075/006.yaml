base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/006.yaml
  text: When the twelve other portals in heaven[a], at the ends of the earth, are opened[c][b], from which the sun and the moon and the stars come out.
translation:
  language: hi
  text: जब आकाश में, पृथ्वी के छोरों पर[b] स्थित अन्य बारह द्वार[a] खोले जाते हैं, जिनमें से सूर्य, चन्द्रमा और तारे निकलते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मार्ग’, ‘छिद्र’ अथवा ‘खिड़कियाँ’; गीइज़ शब्द आकाशीय संरचना में बने निकासों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: ‘पृथ्वी के छोर’ प्राचीन ब्रह्मांड-कल्पना की भाषा है, आधुनिक वैज्ञानिक विवरण नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: ሶበ
  choice: जब
  rationale: यह कालवाचक संयोजक आश्रित उपवाक्य आरम्भ करता है; इसलिए ‘जब’ मूल की व्याकरणिक अपूर्णता और अगले प्रसंग से उसके संबंध को बनाए रखता है।
- source_word: ይትረኃዉ
  choice: खोले जाते हैं
  rationale: यह ርኅወ (‘खोलना’) का कर्मवाच्य/आत्मवाच्य रूप है; इसे अस्तित्वसूचक ‘हैं’ कहना क्रिया को खो देगा।
- source_word: ፲ሥሩ ወካልእ
  choice: अन्य बारह
  rationale: संख्या बारह के साथ ካልእ की अतिरिक्तता को ‘अन्य’ द्वारा व्यक्त किया गया है, जिससे पहले वर्णित द्वारों के संबंध का संकेत बना रहता है।
- source_word: ኃዋላወ
  choice: द्वार
  rationale: यह स्वर्गीय संरचना के उन छिद्रों या मार्गों को दर्शाता है जिनसे खगोलीय पिंड निकलते हैं; ‘द्वार’ इस ठोस ब्रह्मांडीय बिंब को सहज हिन्दी में सुरक्षित रखता है।
- source_word: በሰማይ
  choice: आकाश में
  rationale: इस खगोलीय वर्णन में ‘आकाश’ आधुनिक हिन्दी में स्वाभाविक है और ऊपर की ब्रह्मांडीय संरचना का आशय बनाए रखता है।
- source_word: ዲበ አጽናፈ ምድር
  choice: पृथ्वी के छोरों पर
  rationale: यह पृथ्वी की सीमाओं या किनारों की प्राचीन ब्रह्मांड-कल्पना को बिना आधुनिक वैज्ञानिक पुनर्व्याख्या के व्यक्त करता है।
- source_word: እለ እምኔሆሙ ይወፅእ
  choice: जिनमें से ... निकलते हैं
  rationale: सम्बन्धवाचक रचना द्वारों को खगोलीय पिंडों के बाहर आने से जोड़ती है; हिन्दी में बहुवचन ‘जिनमें से’ और ‘निकलते हैं’ स्वाभाविक हैं।
- source_word: ፀሐይ ወወርኅ ወከዋክብት
  choice: सूर्य, चन्द्रमा और तारे
  rationale: मूल की तीनों खगोलीय श्रेणियाँ स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में रखी गई हैं।
theological_decisions:
- issue: आकाशीय द्वारों और पृथ्वी के छोरों की ब्रह्मांडीय भाषा
  choice: ‘द्वार’ और ‘पृथ्वी के छोर’ के ठोस बिंब बनाए रखे गए
  alternative: इन्हें दिशाओं, क्षितिजों या आधुनिक खगोलीय क्षेत्रों के रूप में व्याख्यायित करना
  rationale: मूल पाठ एक संरचित प्राचीन ब्रह्मांड की कल्पना प्रस्तुत करता है। अनुवाद उस कल्पना को आधुनिक विज्ञान के अनुरूप ढालने या उसका पौराणिक स्वर मिटाने के बजाय यथावत रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी लिपि और गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शब्दावली अपनाई गई है। ‘जब’ से आरम्भ होने वाली आश्रित रचना को जानबूझकर स्वतंत्र मुख्य वाक्य में नहीं बदला गया, क्योंकि उपलब्ध मूल पद्य स्वयं अगले या पूर्ववर्ती संदर्भ पर निर्भर वाक्यांश जैसा है।
