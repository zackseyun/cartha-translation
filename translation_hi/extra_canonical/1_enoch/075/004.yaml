base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/004.yaml
  text: Likewise[a], Uriel showed me twelve openings in the circuit of the chariots of the sun in the sky, from which the rays of the sun go out[b], and from which warmth comes forth upon the earth when they are opened in the seasons appointed for them.
translation:
  language: hi
  text: इसी प्रकार, ऊरीएल ने मुझे आकाश में सूर्य के रथों के परिपथ में बारह द्वार[a] दिखाए। उन्हीं से सूर्य की किरणें[b] निकलती हैं, और जब वे उनके लिए निर्धारित समयों पर खोले जाते हैं, तब उन्हीं से पृथ्वी पर गरमी निकलती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध गीइज़ लिप्यंतरण यहाँ विकृत है। पाठ-संशोधन के आधार पर इसका पठन ‘बारह द्वार’ या ‘बारह खुले स्थान’ किया गया है।
    reason: textual_difficulty
  - marker: b
    text: गीइज़ शब्द का अक्षरशः अर्थ संभवतः ‘उसके पाँव’ है; प्रसंग में इसे सूर्य की बाहर निकलती ‘किरणें’ समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ፲ወ፪ኆኃውተ (पाठ-संशोधन द्वारा पुनर्निर्मित)
  choice: बारह द्वार
  rationale: प्राप्त लिप्यंतरण का आरंभ विकृत है, पर नवीन पाठ-समीक्षा इसे ‘बारह खुले स्थान/द्वार’ के रूप में पहचानती है। ‘द्वार’ हनोक की ठोस खगोलीय कल्पना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ኃዋላወ / በአውደ (पाठ-संशोधित पठन)
  choice: परिपथ में
  rationale: संदर्भ सूर्य के रथों के घेरे या चक्राकार मार्ग का है। ‘परिपथ’ तकनीकी अर्थ और आकाशीय गति—दोनों को व्यक्त करता है।
- source_word: ሰረገላት ፀሐይ
  choice: सूर्य के रथों
  rationale: वाहन-संबंधी मूल बिंब को अमूर्त ‘गतियों’ में बदलने के बजाय ज्यों का त्यों रखा गया है।
- source_word: እገሪሃ ለፀሐይ
  choice: सूर्य की किरणें
  rationale: शब्द का अक्षरशः अर्थ संभवतः ‘सूर्य के पाँव’ है, किंतु इस प्रसंग में उससे निकलने वाली किरणें अभिप्रेत प्रतीत होती हैं; कठिनाई को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ሞቅ
  choice: गरमी
  rationale: यह पृथ्वी पर पड़ने वाले मौसमी ताप को दर्शाता है। ‘गरमी’ सामान्य आधुनिक हिन्दी में सहज है और अनावश्यक तीव्रता नहीं जोड़ता।
- source_word: በአዝማን እለ እሙራን ሎሙ
  choice: अपने लिए नियत ऋतुओं में
  rationale: मूल में निर्धारित समयों/ऋतुओं की व्यवस्थित धारणा है। यह अनुवाद नियत ब्रह्मांडीय क्रम को बनाए रखता है, पर नियत करने वाले कर्ता को नहीं जोड़ता।
theological_decisions:
- issue: आकाशीय व्यवस्था का स्वरूप
  choice: सूर्य के रथों और उनके द्वारों की ठोस ब्रह्मांडीय छवि को बनाए रखा गया है।
  alternative: इसे केवल सूर्यप्रकाश और मौसम का आधुनिक, अमूर्त वर्णन बनाया जा सकता था।
  rationale: हनोक का खगोलीय भाग अपनी बात दर्शनात्मक ब्रह्मांडीय बिंबों में कहता है; अनुवाद को उस विश्वदृष्टि को आधुनिक विज्ञान के अनुरूप पुनर्लेखित नहीं करना चाहिए।
- issue: नियत ऋतुओं का कर्ता
  choice: ‘नियत’ कहा गया है, पर यह स्पष्ट नहीं किया गया कि किसने नियत किया।
  alternative: ‘परमेश्वर द्वारा नियत’ जोड़ना।
  rationale: पद में व्यवस्था के नियत होने का भाव है, पर इस वाक्य में कर्ता व्यक्त नहीं है; इसलिए धर्मवैचारिक निष्कर्ष को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर दर्शनात्मक और ब्रह्मांडीय गरिमा बनाए रखी गई है। ‘ऊरीएल’, ‘सूर्य के रथ’, ‘परिपथ’ और ‘द्वार’ जैसे शब्द मूल की ठोस अपोकैलिप्टिक छवि को सुरक्षित रखते हैं।
