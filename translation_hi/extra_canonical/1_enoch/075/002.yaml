- source_word: ይትፌጸም ጥንቃቄ ዓለም
  choice: संसार की सावधानीपूर्वक व्यवस्था ... पूरी होती है
  rationale: ጥንቃቄ में सावधानी, सूक्ष्मता और शुद्धता का भाव है। यह अनुवाद खगोलीय गणना को अत्यधिक स्पष्ट करके ‘वर्ष’ नहीं बना देता, पर उसकी सटीक व्यवस्था का भाव रखता है।
- source_word: ፻፷ወ፬
  choice: तीन सौ चौंसठ
  rationale: गीज़ पाठ की स्पष्ट संख्या को शब्दों में स्वाभाविक हिंदी रूप दिया गया है।
theological_decisions:
- issue: खगोलीय प्रसंग में በጽድቅ का अर्थ
  choice: ‘धार्मिकता के अनुसार’ रखकर नैतिक और ब्रह्मांडीय दोनों अर्थ खुले रखे गए।
  alternative: ‘ठीक रीति से’ या ‘उचित क्रम में’
  rationale: हनोक का खगोलीय क्रम नैतिक-धार्मिक भाषा में प्रस्तुत होता है; इसे केवल यांत्रिक नियमितता में बदलना मूल की धर्मवैचारिक तनावशीलता को घटा देता।
- issue: तीन सौ चौंसठ का आशय
  choice: मुख्य पाठ में ‘संसार के तीन सौ चौंसठ स्थान’ रखा गया।
  alternative: तीन सौ चौंसठ दिनों का वर्ष या गणना
  rationale: प्रसंग 364-दिवसीय हनोकी योजना की ओर संकेत करता है, किंतु गीज़ पाठ यहाँ सीधे ‘दिन’ या ‘वर्ष’ नहीं कहता; स्पष्ट पंचांगी व्याख्या पादटिप्पणी में रखी गई।
- issue: द्वारों के साथ संख्याएँ
  choice: गीज़ में लिखे अंकों के अनुसार पहले द्वार में एक और तीसरे, चौथे तथा छठे में दो-दो रखा गया।
  alternative: हर उल्लिखित द्वार में एक
  rationale: मूल-पाठ में ፩ के बाद ፪, ፪, ፪ स्पष्ट हैं। फिर भी पाठ की कठिनता और पूर्व अनुवाद-परंपरा को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, देवनागरी और सम्मानपूर्ण अपोकैलिप्टिक शैली अपनाई गई है। ‘ज्योतियाँ’, ‘धार्मिकता’ और ‘द्वार’ जैसे शब्द सामान्य पाठक के लिए बोधगम्य रहते हुए मूल की ब्रह्मांडीय-धार्मिक भाषा बचाते हैं। मुख्य पाठ गीज़ के स्पष्ट अंकों और परिवर्तन-सूचक क्रिया को प्राथमिकता देता है; कठिन वाक्य-विन्यास तथा पंचांगी आशय पादटिप्पणियों में खुले रखे गए हैं।
