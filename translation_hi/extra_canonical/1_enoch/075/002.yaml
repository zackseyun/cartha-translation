- source_word: በጽድቅ
  choice: धार्मिकता के अनुसार
  rationale: यह शब्द नैतिक-धार्मिक ‘धार्मिकता’ और उचित ब्रह्मांडीय क्रम—दोनों की प्रतिध्वनि रखता है; केवल ‘ठीक ढंग से’ कहने पर धार्मिक आयाम मिट जाता।
- source_word: ይትቀየዩ መንበረ ዓለም
  choice: संसार में अपने निर्धारित स्थान बदलती हैं
  rationale: क्रिया परिवर्तन या अदला-बदली का संकेत देती है और መንበር स्थान/आसन का। ‘निर्धारित स्थान’ नियमित खगोलीय गतियों को सहज हिंदी में व्यक्त करता है, जबकि पादटिप्पणी वैकल्पिक सेवा-संबंधी पाठ देती है।
- source_word: ኆኅት
