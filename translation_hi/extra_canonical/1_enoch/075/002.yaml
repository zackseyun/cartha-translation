base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/002.yaml
  text: 'And because of them people go astray concerning them[a], for these lights render service at the stations of the world in righteousness: one in the first portal, and one in the third portal of heaven, and one in the fourth portal, and one in the sixth portal[e][d][c][b]; and the careful ordering of the world is completed in three hundred and sixty-four stations of the world.'
translation:
  language: hi
  text: 'और इन्हीं के कारण लोग इनके विषय में भूल करते हैं[a][e], क्योंकि ये ज्योतियाँ धार्मिकता के अनुसार संसार के नियत स्थानों के बीच अपना स्थान बदलती हैं: एक आकाश के पहले द्वार में, दो तीसरे द्वार में, दो चौथे द्वार में, और दो छठे द्वार में[d]; और संसार की सूक्ष्म व्यवस्था संसार के तीन सौ चौंसठ स्थानों के माध्यम से पूरी होती है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोग भूल करते हैं, क्योंकि ये ज्योतियाँ अपने स्थान उचित रीति से बदलती हैं।” पंक्ति की वाक्य-रचना कठिन है; आशय मनुष्यों की भूल और ज्योतियों के नियमित क्रम के बीच विरोध हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम वाक्यांश कठिन है। संभवतः यह हनोकी पंचांग के 364 दिनों या क्रमबद्ध स्थितियों की योजना की ओर संकेत करता है; गीज़ पाठ अधिक शाब्दिक रूप से संसार की सटीक व्यवस्था के 364 ‘स्थानों’ में पूरी होने की बात करता है।
    reason: alternative_reading
  - marker: d
    text: गीज़ पाठ में संख्याएँ क्रमशः एक, दो, दो और दो हैं। कुछ पूर्व अनुवादों में प्रत्येक उल्लिखित द्वार के साथ ‘एक’ पढ़ा गया है।
    reason: textual_difficulty
  - marker: e
    text: शाब्दिक रूप से “उनमें” या “उनके द्वारा”; यहाँ इसे ज्योतियों के विषय में की गई भूल समझा गया है।
    reason: lexical_alternative
