theological_decisions:
- issue: ओस से संबंधित पदबंध को साधारण मौसम-विज्ञान की भाषा में बदलना या उसकी ब्रह्मांडीय छवि बनाए रखना
  choice: मुख्य पाठ में ‘ओस की आत्मा’ रखा गया
  alternative: ओस की साँस; ओस लाने वाली हवा
  rationale: यह अंश ब्रह्मांडीय शक्तियों और आकाशीय व्यवस्थाओं की सूची का भाग है। असामान्य अभिव्यक्ति को बनाए रखने से मूल का रहस्यपूर्ण तनाव सुरक्षित रहता है और किसी विशेष धर्मवैज्ञानिक व्याख्या को आरोपित नहीं किया जाता।
