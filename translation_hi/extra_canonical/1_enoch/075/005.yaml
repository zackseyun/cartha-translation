    text: स्रोत-पाठ में कोष्ठकों में सुरक्षित यह उपवाक्य पाठ की दृष्टि से अनिश्चित है। ‘द्वार’ का अनुवाद ‘खुले स्थान’, ‘खिड़कियाँ’ या ‘झरोखे’ भी किया जा सकता है।
