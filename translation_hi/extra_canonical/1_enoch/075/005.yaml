  - marker: b
    text: ‘ओस की आत्मा’ एक कठिन पदबंध है; इसका अर्थ ‘ओस की साँस’ या ‘ओस लाने वाली हवा’ भी समझा जा सकता है।
    reason: lexical_alternative
