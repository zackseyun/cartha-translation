  yaml_path: translation/extra_canonical/1_enoch/079/003.yaml
  text: And the moon wanes[a], which takes place through the sixth gate; for in this sixth gate its light is completed[c][b], and from it comes the beginning of the waning.
translation:
  language: hi
  text: और चन्द्रमा घटता है[a]; यह छठे द्वार से होता है, क्योंकि इसी छठे द्वार में उसका प्रकाश पूर्ण होता है और उसी से[c] उसके घटने का आरम्भ होता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चन्द्रमा क्षीण होता है।” मूल क्रिया घटने या कम होने की प्रक्रिया बताती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “घटाव का सिर”; अर्थात घटने का आरम्भ।
    reason: idiom
  - marker: c
    text: या, “वहीं से।” गीज़ सर्वनाम अपने आप में केवल “उससे” कहता है; निकटतम संदर्भ छठा द्वार जान पड़ता है।
    reason: referent_ambiguity
lexical_decisions:
- source_word: ሐጸጸ፡ ወርኅ
  choice: चन्द्रमा घटता जाता है
  rationale: गीज़ क्रिया चन्द्रमा के घटने या क्षीण होने की प्रक्रिया बताती है। ‘घटता जाता है’ आधुनिक हिन्दी में स्वाभाविक है और प्रक्रिया का भाव बनाए रखता है।
- source_word: ዘይትገበር
  choice: यह … होता है
  rationale: मध्यवाच्य/कर्मवाच्य रूप किसी प्रक्रिया के घटित होने को दर्शाता है; ‘होता है’ औपचारिक ‘सम्पन्न किया जाता है’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: በሳድስት፡ ኆኅት
  choice: छठे द्वार से
  rationale: द्वार यहाँ ज्योतिर्मय पिंड की गति का मार्ग है; ‘से’ साधन अथवा मार्ग—दोनों अर्थों की गुंजाइश रखता है।
- source_word: ይትፌጸም፡ ብርሃኑ፡ ዚአሁ
  choice: उसका प्रकाश पूर्ण हो जाता है
  rationale: क्रिया पूर्णता या पूरी मात्रा तक पहुँचने का भाव देती है; यह अनुवाद चन्द्रमा के प्रकाश की पूर्ण अवस्था को बिना आधुनिक खगोलीय व्याख्या जोड़े व्यक्त करता है।
- source_word: እምኔሁ
  choice: वहीं से
  rationale: सर्वनाम निकटतम स्थान, छठे द्वार, की ओर संकेत करता जान पड़ता है; पादटिप्पणी उसके सम्भावित शाब्दिक विकल्प को सुरक्षित रखती है।
- source_word: ርእሰ፡ ታሕጻጼት
  choice: उसके घटने का आरम्भ
  rationale: शाब्दिक रूप से ‘घटाव का सिर’ है। ‘आरम्भ’ हिन्दी में इस सामी मुहावरे का स्वाभाविक अर्थ व्यक्त करता है।
theological_decisions:
- issue: प्राचीन ब्रह्माण्ड-वर्णन को आधुनिक खगोल-विज्ञान के अनुसार समझाकर लिखना या मूल बिंब बनाए रखना
  choice: ‘छठे द्वार’ और क्रमबद्ध प्रक्रिया के बिंब को ज्यों का त्यों बनाए रखा गया है।
  alternative: इसे केवल चन्द्रमा की कलाओं के आधुनिक वर्णन के रूप में प्रस्तुत करना।
  rationale: यह अंश आकाशीय गतियों को द्वारों से संचालित एक व्यवस्थित प्रक्रिया के रूप में चित्रित करता है। आधुनिक वैज्ञानिक व्याख्या जोड़ना मूल साक्ष्य को अनावश्यक रूप से समतल कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘चन्द्रमा’, ‘प्रकाश’ और ‘द्वार’ जैसे परिचित शब्द प्राचीन खगोलीय बिंब को स्पष्ट रखते हैं; वाक्य की प्रक्रियात्मक शैली मूल के अनुरूप सुरक्षित है।
