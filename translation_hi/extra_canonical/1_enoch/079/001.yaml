base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/079/001.yaml
  text: And now[a], my son, I have shown you everything[b], and the order of all the stars of heaven has been completed.
translation:
  language: hi
  text: और अब, मेरे पुत्र, मैंने तुम्हें सब कुछ दिखा दिया है; और आकाश के सभी तारों की व्यवस्था[b] पूरी हो गई है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अर्थ यह भी हो सकता है कि आकाश के सभी तारों की व्यवस्था का वर्णन पूरा हो गया है। मूल गीइज़ में यह वाक्य व्यवस्था के स्वयं पूर्ण होने अथवा उसके विवरण के पूरा होने—दोनों अर्थों में सुना जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘क्रम’ अथवा ‘विन्यास’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: और अब
  rationale: यह समापन अथवा संक्रमण का सूचक वाक्यांश है; ‘और अब’ मूल के प्रवाह और प्रत्यक्ष संबोधन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ወልድየ
  choice: मेरे पुत्र
  rationale: यह शिक्षापरक और प्रकाशनात्मक प्रसंग में आत्मीय पारिवारिक संबोधन है; ‘मेरे पुत्र’ गरिमापूर्ण किंतु बोधगम्य है।
- source_word: ኵሎ
  choice: सब कुछ
  rationale: यह ‘दिखा दिया है’ का कर्म है और समग्रता व्यक्त करता है।
- source_word: አርአይኩከ
  choice: मैंने तुम्हें ... दिखा दिया है
  rationale: क्रिया दिखाने अथवा प्रकट करने का भाव रखती है; हिन्दी का पूर्णतासूचक रूप प्रसंग के सारांशात्मक स्वर के अनुकूल है।
- source_word: ተፈጸመት
  choice: पूरी हो गई है
  rationale: यह मूल के निष्पन्न अथवा पूर्ण होने के भाव को रखता है और तारों के नष्ट हो जाने का अनावश्यक अर्थ नहीं देता।
- source_word: ሥርዓተ
  choice: व्यवस्था
  rationale: यह तारों के सुव्यवस्थित क्रम, विन्यास या नियत प्रणाली को दर्शाता है; ‘व्यवस्था’ हिन्दी में स्वाभाविक है और अर्थ की व्यापकता बनाए रखता है।
- source_word: ኵሉ ከዋክብተ ሰማያት
  choice: आकाश के सभी तारे
  rationale: यह मूल की सार्वभौमिक खगोलीय अभिव्यक्ति को बिना ‘सभी’ का दोहरा अनुवाद किए स्पष्ट हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: क्या अंतिम खंड से तारों की व्यवस्था के स्वयं पूर्ण होने का अर्थ है, या उसके वर्णन के पूरा होने का?
  choice: आकाश के सभी तारों की व्यवस्था पूरी हो गई है
  alternative: आकाश के सभी तारों की व्यवस्था का वर्णन पूरा हो गया है
  rationale: शिक्षापरक संदर्भ वर्णन के समापन की ओर संकेत करता है, पर मूल में ‘वर्णन’ शब्द नहीं है। इसलिए मुख्य पाठ निष्क्रिय/पूर्णतासूचक संरचना और उसकी वास्तविक अस्पष्टता को बनाए रखता है; पादटिप्पणी दोनों संभावनाएँ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शिक्षापरक शैली अपनाई गई है। ‘मेरे पुत्र’ मूल के प्रत्यक्ष संबोधन को रखता है। अर्धविराम दोनों समन्वित खंडों को स्पष्ट करता है। अंतिम खंड की स्रोतगत अस्पष्टता को मुख्य पाठ में नहीं सुलझाया गया, बल्कि पादटिप्पणी में स्पष्ट किया गया है।
