base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/079/004.yaml
  text: And the waning that is done in the first gate in its season until one hundred and seventy-seven days are completed—by the reckoning of weeks, twenty-five and two days.
translation:
  language: hi
  text: और वह ह्रास, जो पहले द्वार में अपने नियत समय पर होता है, एक सौ सतहत्तर दिन पूरे होने तक होता है—सप्ताहों की गणना के अनुसार, पच्चीस और दो दिन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ታሕጻጼት
  choice: घटाव
  rationale: यह शब्द कमी या घटने की प्रक्रिया को व्यक्त करता है; प्रसंग में खगोलीय अवधि के क्रमिक घटाव के लिए सरल और स्वाभाविक हिन्दी।
- source_word: ቀዳሚት
  choice: पहले द्वार
  rationale: स्त्रीलिंग क्रमवाचक रूप संदर्भित ‘द्वार’ के प्रथम होने को बताता है।
- source_word: በዘመኑ ዚአሁ
  choice: अपने नियत समय पर
  rationale: शाब्दिक ‘उसके समय में’ को प्राकृतिक हिन्दी में प्रस्तुत करते हुए निर्धारित काल का भाव सुरक्षित रखा गया है।
- source_word: ሥርዓተ ሰንበት
  choice: सप्ताहों की गणना
  rationale: यहाँ ‘सब्तों की व्यवस्था/गणना’ 177 दिनों को 25 सप्ताह और 2 दिनों में व्यक्त करती है; इसलिए कालगणना का आशय स्पष्ट किया गया है।
