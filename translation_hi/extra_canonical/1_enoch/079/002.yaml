base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/079/002.yaml
  text: And he showed me all their ordinances—those for every day and every season[a], and for every year, and for its going out and its command[c][b], in every month and every sabbath.
translation:
  language: hi
  text: और उसने मुझे उनके सारे निर्धारित क्रम दिखाए—जो हर दिन और हर समय के लिए, हर वर्ष के लिए, और उसके निकलने तथा उसके आदेश के लिए, हर महीने और हर सब्त के लिए हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद का इथियोपिक पाठ कठिन है। प्रतिलिपि में दिखाई देने वाले ፴, ፴፭ और ፵ संभवतः पंक्ति-संख्याएँ हैं, इसलिए यहाँ ‘तीन सौ पैंसठ’ नहीं पढ़ा गया है। अंतिम शब्द का अर्थ ‘सब्त’ के साथ-साथ कालदर्शकीय संदर्भ में ‘सप्ताह’ भी हो सकता है।
    reason: textual_variant_and_lexical_alternative
lexical_decisions:
- source_word: አርአየኒ
  choice: उसने मुझे ... दिखाए
  rationale: क्रिया दर्शनीय प्रकटाव को व्यक्त करती है; सरल हिन्दी में ‘दिखाए’ वृत्तांत की शैली और कर्म के बहुवचन को स्वाभाविक रूप से रखता है। आरम्भिक ፴ पंक्ति-संख्या का अवशेष प्रतीत होता है।
- source_word: ኵሎ ሥርዓቶሙ
  choice: उनके सभी निर्धारित क्रम
  rationale: खगोलीय संदर्भ में ሥርዓት नियत व्यवस्था, विधान या क्रम को सूचित करता है। ‘निर्धारित क्रम’ साधारण पाठक के लिए स्पष्ट है और स्थिर ब्रह्मांडीय व्यवस्था का भाव बचाता है।
- source_word: በኵሉ ዕለት
  choice: हर दिन के लिए
  rationale: बार-बार आने वाली कालगत परिधि को सूची-सदृश ढंग से व्यक्त करता है।
- source_word: በኵሉ ዘመን
  choice: हर समय के लिए
  rationale: ዘመን का अर्थ समय, काल या ऋतु हो सकता है। ‘समय’ मूल की व्यापकता और संभावित अस्पष्टता को सुरक्षित रखता है।
- source_word: ዘበ፴፭ሥልጣን
  choice: अनुवाद में स्वतंत्र संख्या या ‘अधिकार’ वाक्यांश के रूप में ग्रहण नहीं किया
  rationale: ፴፭ समीपस्थ पंक्ति-संख्या/ओसीआर अवशेष प्रतीत होता है, न कि 365। पाठ-प्रवाह संदिग्ध होने के कारण काल्पनिक संख्या या अस्वाभाविक उपवाक्य जोड़ने से बचा गया है; कठिनाई पादटिप्पणी में बताई गई है।
- source_word: በኵሉ ዓመት
  choice: हर वर्ष के लिए
  rationale: दोहराई गई कालगत संरचना का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: በሙጻኡ
  choice: उसके निकलने के लिए
  rationale: एकवचन प्रत्यय को ‘उसके’ से रखा गया है। मूल धातु निकलने/प्रकट होने को सूचित करती है; ‘निकलना’ यह खुला रखता है कि तकनीकी आशय उदय, प्रकट होना या प्रस्थान है।
- source_word: በትእዛዙ
  choice: उसके आदेश के लिए
  rationale: एकवचन प्रत्यय सुरक्षित रखा गया है। ትእዛዝ आदेश या निर्देश का बोध देता है और हनोक की ब्रह्मांडीय व्यवस्था में प्राधिकार का स्वर बनाए रखता है।
- source_word: በኵሉ ወርኅ
  choice: हर महीने
  rationale: सीधा कालदर्शकीय पद; हिन्दी में ‘हर महीने’ स्वाभाविक है।
- source_word: ኵሉ ሰንበት
  choice: हर सब्त में
  rationale: ፵ पंक्ति-संख्या का अवशेष प्रतीत होता है। ሰንበት का मूल धार्मिक-कालदर्शकीय पद ‘सब्त’ रखा गया है, यद्यपि संदर्भ में ‘सप्ताह’ भी संभव है।
theological_decisions:
- issue: ሰንበት को ‘सब्त’ या ‘सप्ताह’ कहना
  choice: सब्त
  alternative: सप्ताह
  rationale: मूल पद की उपासना-संबंधी और धर्मवैचारिक बनावट को बनाए रखा गया है। कालदर्शकीय संदर्भ ‘सप्ताह’ की अनुमति देता है, इसलिए विकल्प पादटिप्पणी में दर्ज है।
- issue: दूषित अंकयुक्त खंड को 365 दिनों के अधिकार के रूप में समझना
  choice: 365 का उल्लेख नहीं जोड़ा गया; पाठगत कठिनाई पादटिप्पणी में रखी गई
  alternative: ‘तीन सौ पैंसठ के अधिकार में’ अथवा ‘जिसका अधिकार है’
  rationale: प्रतिलिखित पाठ में ፴, ፴፭ और ፵ क्रमशः पंक्ति-संख्या के अवशेष जान पड़ते हैं। 35 से 365 बनाना स्रोत-साक्ष्य से समर्थित नहीं है और 1 हनोक के 364-दिवसीय संदर्भ में विशेष रूप से भ्रामक होगा। शेष वाक्य-विन्यास भी अस्थिर है, इसलिए झूठी निश्चितता से बचा गया।
- issue: ሙጻኡ और ትእዛዙ के प्रत्ययों की संख्या
  choice: एकवचन—‘उसके निकलने’ और ‘उसके आदेश’
  alternative: बहुवचन—‘उनके निकलने’ और ‘उनके आदेश’
  rationale: दोनों रूपों में तृतीय पुरुष एकवचन संबंधसूचक प्रत्यय है; हिन्दी में इसे स्पष्ट रूप से सुरक्षित रखा गया है, भले उसका पूर्वपद संदर्भ में पूर्णतः स्पष्ट न हो।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘विधि-विधान’ के बजाय ‘निर्धारित क्रम’ चुना गया ताकि खगोलीय व्यवस्थाओं का भाव स्पष्ट रहे। मूल की सूची-सदृश पुनरावृत्ति को अधिकांशतः बनाए रखा गया है। एक ही पादटिप्पणी-चिह्न [a] मुख्य पाठ में उपस्थित है और पाठगत तथा शब्दार्थगत दोनों कठिनाइयों को संक्षेप में स्पष्ट करता है।
