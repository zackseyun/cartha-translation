base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/096/001.yaml
  text: Hope[a], you righteous, for the sinners will swiftly be destroyed from before you, and authority over them will be yours[c][b], according to your desire.
translation:
  language: hi
  text: हे धर्मियो, आशा रखो[a], क्योंकि पापी शीघ्र ही तुम्हारे सामने से नष्ट कर दिए जाएँगे[b], और उन पर अधिकार तुम्हारा होगा[c], जैसा तुम चाहते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे धर्मियो, आशावान रहो।” आरम्भ की आज्ञा सीधे धर्मियों को सम्बोधित करती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तुम्हारे सामने से”; यह पापियों को धर्मियों की उपस्थिति से हटा दिए जाने की छवि बनाए रखता है।
    reason: lexical_alternative
  - marker: c
    text: “उन पर अधिकार” प्रलय-साहित्यिक उलटाव व्यक्त करता है, जिसमें धर्मियों को न्यायाधीन पापियों पर अधिकार दिया जाता है।
    reason: cultural_note
lexical_decisions:
- source_word: ተስፈዉ
  choice: आशा रखो
  rationale: बहुवचन आज्ञार्थक क्रिया सीधे प्रोत्साहन देती है। ‘आशा रखो’ आधुनिक हिन्दी में स्वाभाविक है और मूल के आशा/भरोसा करने के भाव को बनाए रखता है।
- source_word: ጻድቃን
  choice: हे धर्मियो
  rationale: आज्ञार्थक क्रिया और बहुवचन संदर्भ के कारण यह सीधा सम्बोधन है। सम्बोधन-चिह्न ‘हे’ अर्थ को स्पष्ट रखते हुए गरिमापूर्ण शैली देता है।
- source_word: ፍጡነ
  choice: शीघ्र ही
  rationale: यह विनाश की तीव्रता या निकटता का संकेत देता है। ‘शीघ्र ही’ ऊँची किन्तु सहज हिन्दी में दोनों छायाओं को कुछ हद तक खुला रखता है।
- source_word: ይትሀጐሉ
  choice: नष्ट कर दिए जाएँगे
  rationale: न्याय के प्रसंग में क्रिया विनाश या मिटा दिए जाने का निष्क्रिय भाव रखती है; अनुवाद विनाश की विधि को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: ኃጥኣን
  choice: पापी
  rationale: यह न्यायाधीन लोगों के एक वर्ग को सूचित करने वाला बहुवचन संज्ञात्मक प्रयोग है। हिन्दी में ‘पापी’ एकवचन और बहुवचन दोनों रूपों में स्वाभाविक है।
- source_word: እምቅድሜክሙ
  choice: तुम्हारे सामने से
  rationale: मूल की स्थान-संबंधी छवि को सुरक्षित रखता है—पापियों को धर्मियों के सामने या उनकी उपस्थिति से हटा दिया जाता है।
- source_word: ሥልጣን
  choice: अधिकार
  rationale: यह केवल सामर्थ्य नहीं, बल्कि किसी पर शासन या प्रभुत्व रखने का वैध अथवा प्रदत्त अधिकार व्यक्त करता है।
- source_word: ይከውን ለክሙ ዲቤሆሙ
  choice: उन पर अधिकार तुम्हारा होगा
  rationale: यह अधिकार के स्वामित्व और पापियों के ऊपर उसके प्रयोग—दोनों को संक्षेप में बनाए रखता है।
- source_word: በከመ ፈቀድክሙ
  choice: जैसा तुम चाहते हो
  rationale: वाक्यांश धर्मियों की इच्छा के अनुरूप होने का भाव देता है। यह सहज हिन्दी है और ‘इच्छा’ को ‘आज्ञा’ या ‘निर्णय’ में नहीं बदलता।
theological_decisions:
- issue: न्याय के बाद पापियों के साथ धर्मियों का सम्बन्ध
  choice: धर्मियों को पापियों पर वास्तविक ‘अधिकार’ मिलने की बात स्पष्ट रखी गई है।
  alternative: इसे केवल धर्मियों की नैतिक विजय या सार्वजनिक निर्दोष-ठहराए जाने के रूप में नरम किया जा सकता था।
  rationale: संज्ञा ሥልጣን और ‘उन पर’ का मेल वास्तविक अधिकार की ओर संकेत करता है। अनुवाद इस प्रलय-साहित्यिक उलटाव को बनाए रखता है, पर उस शासन के स्वरूप को निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा और सहज प्रलय-साहित्यिक स्वर रखा गया है। ‘हे धर्मियो’ सीधा सम्बोधन स्पष्ट करता है; ‘तुम’ बहुवचन समुदाय के लिए प्रयुक्त है। मूल की स्थान-संबंधी छवि और धर्मियों को मिलने वाले अधिकार की असहज धार्मिक तीव्रता को नरम नहीं किया गया।
