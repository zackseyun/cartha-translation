base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/096/003.yaml
  text: But you[a], do not fear—you who have suffered—for healing will come to you, and a bright light will shine for you[b], and you will hear the voice of rest from heaven.
translation:
  language: hi
  text: परन्तु तुम[a], जिन्होंने दुःख सहा है, मत डरो; क्योंकि तुम्हारे लिए चंगाई होगी, और एक उज्ज्वल प्रकाश तुम्हारे लिए चमकेगा, और तुम स्वर्ग से विश्राम की वाणी[b] सुनोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘परन्तु तुम जो क्लेश में हो, मत डरो।’ गीज़ पद व्यापक रूप से पीड़ा या संकट सहनेवालों का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘विश्राम की वाणी/वचन।’ यहाँ ‘शान्ति’ या ‘सांत्वना’ कहकर अर्थ खोलने के बजाय मूल अभिव्यक्ति के निकट रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትፍርሁ
  choice: मत डरो
  rationale: यह बहुवचन में निषेधात्मक आज्ञा है। ‘मत डरो’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: እለ ሐመምክሙ
  choice: जिन्होंने दुःख सहा है
  rationale: यह पद पीड़ा या क्लेश से चिह्नित लोगों को संबोधित करता है; ‘दुःख’ शारीरिक पीड़ा तक अर्थ को सीमित नहीं करता।
- source_word: ፈውስ
  choice: चंगाई
  rationale: संज्ञा आरोग्य और व्यापक पुनर्स्थापन दोनों का संकेत दे सकती है। ‘चंगाई’ सामान्य धार्मिक हिन्दी में बोधगम्य है और केवल चिकित्सकीय इलाज तक सीमित नहीं है।
- source_word: ይከውነክሙ
  choice: तुम्हारे लिए ... होगी
  rationale: मूल क्रिया का व्यापक अर्थ ‘होना/बनना’ है। यह अनुवाद ‘आएगी’ की अपेक्षा उसके रूप को अधिक निकटता से रखता है।
- source_word: ብርሃነ ብሩህ
  choice: एक उज्ज्वल प्रकाश
  rationale: मूल की प्रबल प्रकाश-छवि को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ያበርህ ለክሙ
  choice: तुम्हारे लिए चमकेगा
  rationale: प्रकाश देने या चमकने की क्रिया तथा हितसूचक पद दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ቃለ ዕረፍት
  choice: विश्राम की वाणी
  rationale: मूलतः ‘विश्राम की वाणी/वचन’ है। यह श्रवण-छवि और ‘विश्राम’ की ठोस प्रतिज्ञा को बनाए रखता है।
- source_word: እምሰማይ
  choice: स्वर्ग से
  rationale: प्रकाशना के स्रोत को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ቃለ ዕረፍት को अधिक व्याख्यात्मक धार्मिक अभिव्यक्ति में अनूदित करना या नहीं
  choice: विश्राम की वाणी
  alternative: शान्ति की वाणी; सांत्वना का वचन
  rationale: गीज़ पाठ पहले ‘विश्राम/आराम’ की ओर संकेत करता है। ‘शान्ति’ या ‘सांत्वना’ चुनने से अर्थ की व्याख्या पहले ही तय हो जाती; इसलिए मूल की संभावित अर्थ-व्याप्ति और तनाव को रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सांत्वनापरक और प्रकाशनात्मक शैली। वाक्य-संरचना मूल के क्रमिक ‘और’ को बनाए रखती है; अत्यधिक संस्कृतनिष्ठ या संप्रदाय-विशिष्ट शब्दावली से बचा गया है।
