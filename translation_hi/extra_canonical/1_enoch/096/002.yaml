base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/096/002.yaml
  text: And on the day of the judgment of sinners[a], your children will rise up and be lifted up like eagles, and your nest will be higher than the vultures. You will go up and enter the clefts of the earth and the fissures of the rock forever, like coneys before the lawless[f][e][d][c][b]; and the sirens will groan over you and weep.
translation:
  language: hi
  text: पापियों की विपत्ति के दिन[a] तुम्हारे बच्चे उकाबों के समान उठेंगे और ऊँचे उठाए जाएंगे; तुम्हारा बसेरा गिद्धों से भी अधिक ऊँचा होगा। तुम ऊपर चढ़ोगे और सदा के लिए धरती की दरारों और चट्टान की फाँकों में प्रवेश करोगे—जैसे हाइरैक्स अधर्मियों के सामने से छिप जाते हैं[b]। और सायरन[c] तुम्हारे ऊपर कराहेंगे और रोएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त शब्द का अर्थ ‘संकट’, ‘क्लेश’ या दण्ड के रूप में आने वाली ‘विपत्ति’ भी हो सकता है।
    reason: lexical_ambiguity
  - marker: b
    text: मूल में उस छोटे चट्टानवासी जीव का नाम है जिसे परम्परागत रूप से ‘शापान’ या ‘कोनी’ और आधुनिक प्राणी-विज्ञान में ‘हाइरैक्स’ कहा जाता है। यह ‘बिज्जू’ से भिन्न जीव है। ‘अधर्मियों के सामने से’ का भाव ‘उनकी उपस्थिति से दूर’ या ‘उनके सामने से बचकर’ भी हो सकता है।
    reason: cultural_and_lexical_note
  - marker: c
    text: ‘सायरन’ यूनानी मूल का ऋणशब्द है। यहाँ इसका संकेत प्राचीन साहित्य में उजाड़ स्थानों पर विलाप करने वाले प्राणियों की ओर है, आवश्यक नहीं कि बाद की कथाओं की समुद्री सायरनों की ओर हो।
    reason: cultural_note
lexical_decisions:
- source_word: ምንዳቤሆሙ ለኃጥኣን
  choice: पापियों की विपत्ति
  rationale: संज्ञा दुःख, संकट या दण्डात्मक विपत्ति का बोध करा सकती है। ‘विपत्ति’ अनुभव किए जाने वाले कष्ट और न्याय-संबंधी भाव—दोनों को खुला रखती है; इसे केवल औपचारिक ‘न्याय’ नहीं बनाया गया।
- source_word: ይትሌዐሉ ወይትነሥኡ
  choice: उठेगी और ऊँची उठाई जाएगी
  rationale: दोनों क्रियाओं को अलग रखकर आरोहण और ऊँचा किए जाने की समानान्तर, बलाघाती भाषा सुरक्षित रखी गई है।
- source_word: አንስርት
  choice: उकाबों
  rationale: यह बड़े शिकारी पक्षी, सामान्यतः eagle, का मानक अर्थ है। ‘उकाब’ आधुनिक हिन्दी में इस पक्षी को ‘गरुड़’ की पौराणिक विशिष्टता के बिना व्यक्त करता है।
- source_word: እጐለ / ምጽላልክሙ
  choice: तुम्हारी सन्तान / तुम्हारा बसेरा
  rationale: पहला रूप सम्बोधित समुदाय की सन्तान को और कठिन दूसरा रूप छायादार आश्रय या निवास को सूचित करता है। ‘बसेरा’ पक्षी-रूपक को बनाए रखते हुए शाब्दिक घोंसले से अधिक व्यापक अर्थ की सम्भावना खुली रखता है।
- source_word: ንደብታተ ምድር / ንቅዓታተ ኰኵሕ
  choice: धरती की दरारों / चट्टान की फाँकों
  rationale: दोनों बहुवचन पद भूमि और चट्टान के टूटे, खुले स्थानों का चित्र प्रस्तुत करते हैं; हिन्दी में निकट किन्तु अलग शब्द रखे गए हैं।
- source_word: ጊሔ
  choice: चट्टानी बिज्जू
  rationale: यह परम्परागत ‘शापान/coney’ अर्थात hyrax जैसे छोटे चट्टानवासी जीव को सूचित करता है। हिन्दी पाठक के लिए पहचान योग्य समीपस्थ नाम चुना गया और पादटिप्पणी में प्राणी की पहचान स्पष्ट की गई है।
- source_word: እምቅድመ ዓማፅያን
  choice: अधर्मियों के सामने से
  rationale: संयुक्त पूर्वसर्ग का अर्थ ‘के सामने/उपस्थिति से’ है और प्रसंग में बच निकलने या छिपने का भाव देता है; ‘सामने से’ इस गति को बनाए रखता है।
- source_word: ጼደናት
  choice: सायरन
  rationale: यह यूनानी σειρῆνες से आया ऋणशब्द है, न कि ‘धर्मी स्त्रियाँ’। लिप्यन्तरण रखा गया और प्राचीन उजाड़-प्रदेशीय शोक-प्राणी का अर्थ पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: क्या दूसरे पुरुष के बहुवचन रूप धर्मी समुदाय से कहे गए प्रतिज्ञात्मक वचन हैं?
  choice: सम्बोधन उस समुदाय से माना गया है जिसकी सन्तान पापियों की विपत्ति के समय ऊँची की जाएगी।
  alternative: कठिन मध्यवर्ती पाठ के कारण सम्बोधन का लक्ष्य अधिक सामान्य या कुछ अस्पष्ट माना जा सकता है।
  rationale: निकटवर्ती साहित्यिक प्रसंग पापियों और सम्बोधित जन के बीच विरोध रखता है। अनुवाद इस विरोध को सुरक्षित रखता है, पर सम्बोधित जन पर कोई बाद की सम्प्रदायगत पहचान आरोपित नहीं करता।
- issue: ምንዳቤሆሙ को ‘न्याय’ या ‘विपत्ति’ कहना
  choice: विपत्ति
  alternative: न्याय; दण्ड; संकट
  rationale: मूल शब्द भोगे जाने वाले क्लेश तथा दण्डात्मक संकट दोनों को समेट सकता है। ‘विपत्ति’ न्यायिक पृष्ठभूमि को नकारे बिना मूल की अर्थगत व्यापकता बनाए रखती है।
- issue: अन्तिम अलौकिक/काव्यात्मक प्राणियों की पहचान
  choice: सायरन को प्राचीन उजाड़-प्रदेश के विलाप करने वाले प्राणियों के रूप में रहने दिया गया है।
  alternative: गीदड़-जैसे वन्य जीव; धर्मी स्त्रियाँ
  rationale: गीज़ रूप यूनानी ऋणशब्द से मेल खाता है; ‘धर्मी स्त्रियाँ’ भिन्न मूल से बनतीं। फिर भी आधुनिक लोककथा की समुद्री सायरन की धारणा पाठ में नहीं थोपी गई।
