  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। अपोकैलिप्टिक ऊँचाई, चट्टानी शरण और विलाप के चित्र सुरक्षित हैं। ‘बसेरा’ कठिन पाठ में ‘घोंसला’, ‘छायादार स्थान’ और ‘आश्रय’ की सम्भावनाओं के बीच स्वाभाविक मध्यवर्ती चयन है।
