- source_word: ἱερεῖς
  choice: याजक
  rationale: धार्मिक पद के लिए यह आधुनिक, गरिमापूर्ण और प्रचलित हिन्दी शब्द है।
- source_word: τὰς ἀναγραφὰς τῶν χρόνων
  choice: समय-गणना के अभिलेखों
  rationale: यह वाक्यांश कालक्रम से संबंधित लिखित अभिलेखों को सूचित करता है; ‘समय-गणना’ हिन्दी में इस आशय को स्वाभाविक रूप से स्पष्ट करती है।
- source_word: ἐπισκέπτονται
  choice: जाँच करते हैं
  rationale: यहाँ क्रिया का अर्थ अभिलेखों को ध्यान से देखना या परखना है।
- source_word: αὐτὸν ... ἐληλυθέναι
  choice: कि वह ... आया था
  rationale: पुल्लिंग सर्वनाम प्रसंग में फीनिक्स पक्षी की ओर संकेत करता है; परोक्ष कथन के पूर्ण क्रिया-रूप को हिन्दी में ‘आया था’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: πεντακοσιοστοῦ ἔτους πεπληρωμένου
  choice: पाँच सौवाँ वर्ष पूरा होने पर
  rationale: यह जननात्मक निरपेक्ष संरचना को उसके काल-संबंधी अर्थ सहित सहज हिन्दी में रखता है और ‘पाँच सौवें वर्ष’ की मूल क्रमवाचक अभिव्यक्ति बनाए रखता है।
