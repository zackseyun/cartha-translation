translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज वर्णनात्मक शैली अपनाई गई है। पक्षी के लिए प्रसंगानुसार स्त्रीलिंग 'वह...जाती है' रखा गया है, जैसा कि निकटवर्ती फीनिक्स-वर्णन में अपेक्षित है। मुख्य पाठ का [a] चिह्न संबंधित पादटिप्पणी से मेल खाता है।
