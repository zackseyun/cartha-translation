  text: And by day[a], in the sight of all, it flies to the altar of the sun, places them there, and so starts back.
translation:
  language: hi
  text: और दिन में[a], सबके देखते-देखते, वह सूर्य की वेदी पर उड़कर पहुँचती है, उन्हें वहाँ रखती है, और इस प्रकार वापस लौट पड़ती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और दिन के समय, सबके देखते-देखते, वह सूर्य की वेदी पर उड़कर पहुँचती है और उन्हें वहाँ रखती है, और इस प्रकार वापस लौट पड़ती है।”
    reason: पूर्ववर्ती प्रस्तुति के अनुरूप समयवाचक पद का वैकल्पिक स्वाभाविक रूप।
lexical_decisions:
- source_word: ἡμέρας
  choice: दिन के समय
  rationale: समयवाचक संबंधकारक का स्वाभाविक हिन्दी रूप; यह स्पष्ट करता है कि घटना दिन में और खुले रूप से होती है।
- source_word: βλεπόντων πάντων
  choice: सबके देखते-देखते
  rationale: संबंधकारक निरपेक्ष रचना का सहज और अर्थनिष्ठ हिन्दी रूप, जो सार्वजनिक दृश्यता पर बल बनाए रखता है।
- source_word: ἐπιπτὰς
  choice: उड़कर जाती है
  rationale: पक्षी के वेदी तक उड़कर पहुँचने की क्रिया को प्रसंगानुकूल और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὸν τοῦ ἡλίου βωμόν
  choice: सूर्य की वेदी
  rationale: यूनानी संबंध को सीधे बनाए रखता है; यह 'सूर्य को समर्पित वेदी' अथवा 'सूर्य की वेदी' के बीच संभावित सांस्कृतिक सूक्ष्मता को अनावश्यक रूप से नहीं खोलता।
- source_word: τίθησιν αὐτὰ
  choice: उन्हें वहाँ रखती है
  rationale: नपुंसकलिंग बहुवचन सर्वनाम αὐτά पूर्ववर्ती वस्तुओं की ओर संकेत करता है; हिन्दी में संदर्भगत 'उन्हें' उचित है।
- source_word: εἰς τοὐπίσω ἀφορμᾷ
  choice: लौटने के लिए चल पड़ती है
  rationale: वापसी की दिशा में प्रस्थान करने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
