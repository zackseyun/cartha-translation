  text: σηπομένης δὲ τῆς σαρκὸς σκώληξ τις γεννᾶται, ὃς ἐκ τῆς ἰκμάδος τοῦ τετελευτηκότος ζώου ἀνατρεφόμενος πτεροφυεῖ· εἶτα γενναῖος γενόμενος αἴρει τὸν σηκὸν ἐκεῖνον, ὅπου τὰ ὀστᾶ τοῦ προγεγονότος ἐστίν, καὶ ταῦτα βαστάζων διανύει ἀπὸ τῆς Ἀραβικῆς χώρας ἕως τῆς Αἰγύπτου εἰς τὴν λεγομένην Ἡλιούπολιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025/003.yaml
  text: But as its flesh decays[a], a certain worm is produced, which, being nourished from the moisture of the dead creature, grows wings. Then, when it has become strong, it lifts up that nest in which are the bones of the one that came before, and carrying them it travels from the land of Arabia as far as Egypt, to the city called Heliopolis.
translation:
  language: hi
  text: पर उसके मांस के सड़ने पर एक कीड़ा उत्पन्न होता है, जो उस मृत जीव की नमी से पोषित होकर पंख उगा लेता है। फिर सामर्थ्यवान हो जाने पर वह उस घोंसले[a] को उठा लेता है, जिसमें उससे पहले वाले की हड्डियाँ होती हैं; और उन्हें लेकर वह अरब प्रदेश से मिस्र में स्थित हेलियोपोलिस कहलाने वाले नगर तक यात्रा करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उस घेरे हुए स्थान’।
    reason: यूनानी σηκός का अर्थ इस संदर्भ में ‘घोंसला’ है, पर वह घेरा, बाड़ा, या बंद स्थान भी सूचित कर सकता है।
lexical_decisions:
- source_word: σκώληξ τις
  choice: एक कीड़ा
  rationale: यूनानी पद किसी विशेष प्रजाति की पहचान नहीं कराता; इसलिए सामान्य और स्वाभाविक हिंदी रखी गई है।
- source_word: ἰκμάδος
  choice: नमी
  rationale: यहाँ शब्द मृत जीव के शरीर में बची नमी या रस को सूचित करता है; ‘नमी’ मूल की व्यापकता को बनाए रखती है।
- source_word: γενναῖος
  choice: बलवान
  rationale: इस प्रसंग में शब्द परिपक्व होकर सामर्थ्यवान होने का भाव देता है, क्योंकि आगे वह घोंसला और हड्डियाँ उठाता है।
- source_word: σηκόν
  choice: घोंसला
  rationale: फ़ीनिक्स-वर्णन के संदर्भ में यह सबसे स्वाभाविक अर्थ है, यद्यपि यूनानी शब्द अधिक सामान्यतः घिरे हुए स्थान या बाड़े के लिए भी प्रयुक्त हो सकता है।
- source_word: τοῦ προγεγονότος
  choice: उसके पूर्ववर्ती
  rationale: शाब्दिक भाव ‘जो पहले हो चुका था’ है; ‘पूर्ववर्ती’ वर्तमान जीव से पहले वाले उसी जीव को स्पष्ट किए बिना स्वाभाविक रूप से व्यक्त करता है।
- source_word: διανύει
  choice: पहुँचता है
  rationale: क्रिया दूरी तय करने का भाव रखती है; गंतव्य के साथ हिंदी में ‘पहुँचता है’ सहज और अर्थसंगत है।
