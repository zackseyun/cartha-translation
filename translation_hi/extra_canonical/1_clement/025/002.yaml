  text: ὄρνεον γάρ ἐστιν, ὃ προσονομάζεται φοῖνιξ· τοῦτο μονογενὲς ὑπάρχον ζῇ ἔτη πεντακόσια, γενόμενόν τε ἤδη πρὸς ἀπόλυσιν τοῦ ἀποθανεῖν αὐτό, σηκὸν ἑαυτῷ ποιεῖ ἐκ λιβάνου καὶ σμύρνης καὶ τῶν λοιπῶν ἀρωμάτων, εἰς ὃν πληρωθέντος τοῦ χρόνου εἰσέρχεται καὶ τελευτᾷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025/002.yaml
  text: For there is a bird that is called the phoenix. This creature[a], being the only one of its kind, lives for five hundred years; and when it has now come near to the time of its death, it makes for itself a nest from frankincense and myrrh and the other spices. When the time has been fulfilled, it enters into it and dies.
translation:
  language: hi
  text: क्योंकि एक पक्षी है, जिसे फ़ीनिक्स कहा जाता है। यह अपनी जाति का अकेला पक्षी है और पाँच सौ वर्ष तक जीवित रहता है। जब वह अपनी मृत्यु के समय के निकट पहुँच जाता है[a], तब वह लोबान, गन्धरस और अन्य सुगन्धित द्रव्यों से अपने लिए एक घोंसला बनाता है। समय पूरा होने पर वह उसमें प्रवेश करता है और मर जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्यांश में ‘मरने’ का स्पष्ट उल्लेख है और मृत्यु के लिए विदाई या प्रस्थान की छाया भी है।
    reason: ἀπόλυσις की संदर्भानुकूल अर्थ-छाया और τοῦ ἀποθανεῖν के स्पष्ट मृत्यु-संदर्भ को बिना ‘मुक्ति’ जैसे अनावश्यक धर्मवैचारिक अर्थ या गलत ‘मरने के द्वारा’ संरचना के स्पष्ट करता है।
lexical_decisions:
- source_word: προσονομάζεται φοῖνιξ
  choice: जिसे फ़ीनिक्स कहा जाता है
  rationale: क्रिया का आशय नाम से पुकारे जाने का है; आधुनिक हिन्दी में स्वाभाविक रूप रखा गया और प्राणी का पारंपरिक नाम लिप्यंतरित किया गया।
- source_word: μονογενὲς
  choice: अपनी जाति का अकेला
  rationale: यहाँ शब्द उस पक्षी के अपने प्रकार में एकमात्र होने को बताता है; 'एकलौता' अकेले कहने की अपेक्षा यह अधिक स्पष्ट है।
- source_word: ἀπόλυσιν τοῦ ἀποθανεῖν αὐτό
  choice: अपनी मृत्यु के समय के निकट
  rationale: यूनानी में विदाई/मुक्ति और मरने—दोनों की भाषा जुड़ी है। मुख्य पाठ स्पष्ट और स्वाभाविक हिन्दी में मृत्यु का प्रत्यक्ष उल्लेख बनाए रखता है; संरचना की अतिरिक्त छाया पाद-टिप्पणी में दी गई है।
- source_word: σηκόν
  choice: घोंसला
  rationale: मूल शब्द घेरे, कोठरी या पवित्र घेरे के अर्थ दे सकता है, पर फ़ीनिक्स की कथा और प्रयुक्त सामग्री के संदर्भ में 'घोंसला' सर्वाधिक सुबोध है।
- source_word: λίβανος καὶ σμύρνα
  choice: लोबान और गन्धरस
  rationale: इन सुगन्धित पदार्थों के प्रचलित हिन्दी बाइबलीय नाम चुने गए हैं।
- source_word: τελευτᾷ
  choice: मर जाता है
  rationale: इस प्रसंग में क्रिया जीवन के अंत को दर्शाती है; स्पष्ट मृत्यु-वाचक अनुवाद पूर्ववर्ती ἀποθανεῖν के अनुरूप है।
theological_decisions:
- issue: फ़ीनिक्स के वर्णन की ऐतिहासिक या प्राणीवैज्ञानिक स्थिति
  choice: लेखक के कथन को बिना संपादकीय समर्थन या खंडन के सीधे प्रस्तुत किया गया
  alternative: कथा या किंवदंती जैसे विशेषण जोड़ना
  rationale: मूल पाठ इसे उदाहरण के रूप में कथित करता है; अनुवाद को न तो इसकी ऐतिहासिकता स्थापित करनी चाहिए, न अस्वीकार।
- issue: ἀπόλυσις में निहित 'विदाई/मुक्ति' की धार्मिक व्याख्या
  choice: मुख्य पाठ में मृत्यु-समय और पाद-टिप्पणी में शाब्दिक विदाई/मुक्ति की छाया
  alternative: इसे आत्मा की मुक्ति जैसे धर्मसैद्धांतिक अर्थ में स्पष्ट करना
  rationale: मूल वाक्यांश मृत्यु की ओर संकेत करता है, लेकिन किसी विशिष्ट परलोक-सिद्धांत को स्पष्ट रूप से प्रतिपादित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण गद्य रखा गया है। फ़ीनिक्स नाम को प्रचलित ध्वनि के अनुसार लिप्यंतरित किया गया है। वाक्यों को हिन्दी की स्वाभाविक पठनीयता के लिए विभाजित किया गया, जबकि मूल क्रम और विवरण सुरक्षित हैं।
