  text: So then, having completed all these things, he praised them and blessed them and said, “Be fruitful and multiply.”
translation:
  language: hi
  text: इसलिए इन सब चीज़ों को पूरा करने के बाद, उसने उनकी प्रशंसा की, उन्हें आशीष दी और कहा, “बढ़ो और बहुत हो जाओ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τελειώσας
  choice: पूरा करने के बाद
  rationale: यह क्रियाविशेषणीय कृदंत कार्य के पूर्ण हो जाने और उसके बाद की क्रियाओं के क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπῄνεσεν
  choice: प्रशंसा की
  rationale: मूल क्रिया का सीधा अर्थ ‘सराहना/प्रशंसा करना’ है; इसे ‘अच्छा कहा’ में बदलने के बजाय मूल की विशिष्ट अभिव्यक्ति रखी गई है।
- source_word: ηὐλόγησεν
  choice: आशीष दी
  rationale: सृष्टि-वर्णन के धार्मिक संदर्भ में εὐλογέω के लिए सहज और प्रचलित हिन्दी पद।
- source_word: Αὐξάνεσθε καὶ πληθύνεσθε
  choice: फूलो-फलो और बढ़ते जाओ
  rationale: दोनों आदेशों के वृद्धि और बहुगुणित होने के भाव को मुहावरेदार आधुनिक हिन्दी में रखा गया है; ‘फूलो-फलो’ जननशीलता तथा ‘बढ़ते जाओ’ संख्या-वृद्धि को व्यक्त करता है।
theological_decisions:
- issue: αὐτά के सजीव बहुवचन संदर्भ का हिन्दी रूप
  choice: उनकी प्रशंसा की, उन्हें आशीष दी
  alternative: उन वस्तुओं की प्रशंसा की और उन्हें आशीष दी
  rationale: यूनानी नपुंसकलिंग बहुवचन सर्वनाम पूर्वोक्त सृष्ट वस्तुओं/जीवों को सामूहिक रूप से दर्शाता है। संक्षिप्त सर्वनाम मूल की व्यापकता और संभावित संदर्भगत तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। वाक्य का क्रम यूनानी के निकट रखा गया है, पर कृदंत को स्वाभाविक हिन्दी रचना में बदला गया है।
