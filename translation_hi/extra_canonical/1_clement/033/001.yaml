source:
  edition: Funk 1901 (normalized OCR)
  text: Τί οὖν ποιήσωμεν, ἀδελφοί; ἀργήσωμεν ἀπὸ τῆς ἀγαθοποιΐας καὶ ἐγκαταλίπωμεν τὴν ἀγάπην; μηδαμῶς τοῦτό ἐάσει ὁ δεσπότης ἐφ’ ἡμῖν γε γενηθῆναι, ἀλλὰ σπεύσωμεν μετὰ ἐκτενείας καὶ προθυμίας πᾶν ἔργον ἀγαθὸν ἐπιτελεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/001.yaml
  text: What then shall we do, brothers? Shall we cease from doing good and abandon love? May the Master never allow this to happen among us. Rather, let us hasten with earnestness and eagerness to accomplish every good work.
translation:
  language: hi
  text: तो फिर, भाइयो, हम क्या करें? क्या हम भलाई करना छोड़ दें और प्रेम को त्याग दें? स्वामी ऐसा हमारे बीच कभी न होने दे! बल्कि हम पूरी लगन और तत्परता से हर भला काम पूरा करने के लिए उत्साह से आगे बढ़ें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀργήσωμεν ἀπὸ τῆς ἀγαθοποιΐας
  choice: क्या हम भलाई करना छोड़ दें
  rationale: ἀργέω ἀπό का अर्थ किसी कार्य से रुक जाना या उसे छोड़ देना है; यह केवल ढिलाई से भलाई करते रहने का भाव नहीं देता।
- source_word: ἐγκαταλίπωμεν τὴν ἀγάπην
  choice: प्रेम को त्याग दें
  rationale: ἐγκαταλείπω का प्रबल अर्थ छोड़ देना या त्याग देना है; ἀγάπη को सामान्य और धर्मवैचारिक रूप से खुला रखते हुए ‘प्रेम’ कहा गया है।
- source_word: ὁ δεσπότης
  choice: स्वामी
  rationale: δεσπότης अधिकारसंपन्न स्वामी का बोध कराता है; ‘स्वामी’ हिन्दी में इस उपाधि की गरिमा और सामान्य अर्थ दोनों बनाए रखता है।
- source_word: μετὰ ἐκτενείας καὶ προθυμίας
  choice: पूरी लगन और तत्परता से
  rationale: ἐκτένεια में निरंतर गंभीर प्रयास या लगन और προθυμία में उत्सुक तत्परता का भाव है।
- source_word: πᾶν ἔργον ἀγαθὸν ἐπιτελεῖν
  choice: हर भला काम पूरा करने के लिए
  rationale: ἐπιτελέω किसी कार्य को संपन्न या पूरा करने का अर्थ देता है; ‘हर भला काम’ यूनानी पदक्रम का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: δεσπότης के संदर्भ की स्पष्टता
  choice: ‘स्वामी’ रखा गया, बिना ‘परमेश्वर’ या ‘प्रभु’ जोड़कर संदर्भ निश्चित किए
  alternative: ‘परमेश्वर’ या ‘प्रभु’
  rationale: यूनानी पाठ केवल उपाधि δεσπότης देता है। अनुवाद में संभावित दैवी संदर्भ को अनावश्यक रूप से अधिक स्पष्ट करना मूल की अभिव्यक्ति से आगे जाता।
- issue: प्रेम का आशय
  choice: सामान्य ‘प्रेम’
  alternative: ‘मसीही प्रेम’ या ‘भाईचारा’
  rationale: ἀγάπη का आशय प्रसंग में सामुदायिक और नैतिक हो सकता है, पर मूल पाठ कोई संप्रदायगत या अधिक सीमित विशेषण नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामुदायिक उपदेशात्मक शैली रखी गई है। प्रश्नों की तीव्रता और फिर सकारात्मक आह्वान का विरोधाभास सुरक्षित है। ‘भाइयो’ प्रत्यक्ष संबोधन को स्वाभाविक हिन्दी रूप में प्रस्तुत करता है।
