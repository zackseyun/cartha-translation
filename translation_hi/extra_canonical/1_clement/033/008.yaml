review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys ὑπογραμμός as an exemplary pattern, ἀόκνως as acting without hesitation, the metaphor of drawing near to God's will, and the comprehensive force of ἐξ ὅλης τῆς ἰσχύος ἡμῶν. However, “जब हमारे सामने यह आदर्श है” shifts the participial ἔχοντες (“having”) into a temporal condition and adds “our” explicitly. Rendering it as “इस आदर्श को सामने रखकर” more directly carries the Greek participial sense. The singular ἔργον is also better retained as “कार्य.”
  naturalness: “इस आदर्श को सामने रखकर” is idiomatic modern standard Hindi and preserves the image of a model set before the readers. “उसकी इच्छा के निकट आएँ” is somewhat elevated but understandable and appropriately retains the Greek metaphor without narrowing it to mere obedience. “धार्मिकता का कार्य करें” is natural in a formal exhortative register.
  terminology: “आदर्श” is suitable for ὑπογραμμός. “धार्मिकता” is retained for δικαιοσύνη because it can encompass the ethical and God-related force without reducing the term to social justice alone. “पूरी शक्ति से” accurately expresses the totality of ἐξ ὅλης τῆς ἰσχύος ἡμῶν.
