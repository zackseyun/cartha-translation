base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/008.yaml
  text: Having[a], then, this pattern, let us draw near to his will without hesitation. With all our strength let us do the work of righteousness.
translation:
  language: hi
  text: अतः, इस आदर्श को सामने रखकर, हम बिना हिचकिचाए उसकी इच्छा के निकट आएँ। हम अपनी पूरी शक्ति से धार्मिकता का कार्य करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπογραμμός
  choice: आदर्श
  rationale: यह शब्द अनुकरण के लिए सामने रखे गए नमूने या उदाहरण को दर्शाता है; आधुनिक हिन्दी में ‘आदर्श’ इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀόκνως
  choice: बिना हिचकिचाए
  rationale: यह ὄκνος के अभाव को, अर्थात हिचक, संकोच या पीछे हटने के बिना कार्य करने को व्यक्त करता है; इसका प्राथमिक अर्थ केवल ‘उत्साह से’ नहीं है।
- source_word: προσέλθωμεν τῷ θελήματι αὐτοῦ
  choice: उसकी इच्छा के निकट आएँ
  rationale: प्रसέρχομαι के निकट आने वाले बिंब को बनाए रखते हुए दत्तिव θελήματι के साथ यूनानी अभिव्यक्ति की कुछ असामान्यता और अर्थगत खुलापन सुरक्षित रखा गया है।
- source_word: ἐξ ὅλης τῆς ἰσχύος ἡμῶν
  choice: अपनी पूरी शक्ति से
  rationale: मूल के समग्र बल और प्रयत्न के भाव का सीधा तथा स्वाभाविक हिन्दी रूप।
- source_word: ἐργασώμεθα ἔργον δικαιοσύνης
  choice: धार्मिकता के काम करें
  rationale: सजातीय क्रिया-संज्ञा की यूनानी रचना को कृत्रिम ‘काम को कार्य करें’ बनाने के बजाय स्वाभाविक हिन्दी में व्यक्त किया गया है; δικαιοσύνη का नैतिक-धार्मिक आयाम ‘धार्मिकता’ में बना रहता है।
theological_decisions:
- issue: ‘उसकी इच्छा के निकट आना’ का अर्थ
  choice: 'रूपक को बनाए रखा गया: ‘उसकी इच्छा के निकट आएँ’'
  alternative: ‘उसकी इच्छा पूरी करने में लग जाएँ’
  rationale: वैकल्पिक रूप अर्थ को आज्ञापालन या क्रियान्वयन तक सीमित कर देता है, जबकि मूल यूनानी ‘निकट आने’ की अभिव्यक्ति रखता है और उसके संबंधगत तथा आज्ञापालन-संबंधी दोनों संकेत खुले छोड़ता है।
- issue: δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय / सही काम
  rationale: यहाँ शब्द केवल सामाजिक न्याय या सामान्य सही आचरण तक स्पष्ट रूप से सीमित नहीं है; ‘धार्मिकता’ व्यापक नैतिक और ईश्वर-संबंधी तनाव को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सामूहिक आह्वान वाली, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। यूनानी वाक्य के रूपक को अनावश्यक व्याख्या से नहीं बदला गया।
