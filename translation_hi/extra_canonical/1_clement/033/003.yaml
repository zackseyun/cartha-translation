id: 1CLEM.33.3
reference: 1 Clement 33:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: τῷ γὰρ παμμεγεθεστάτῳ αὐτοῦ κράτει οὐρανοὺς ἐστήριξεν καὶ τῇ ἀκαταλήπτῳ αὐτοῦ συνέσει διεκύβευσεν αὐτούς· τὴν τε γῆν διεχώρισεν ἀπὸ τοῦ περιέχοντος αὐτὴν ὕδατος καὶ ἔδρασεν ἐπὶ τὸν ἀσφαλῆ τοῦ ἰδίου βουλήματος θεμέλιον· τὰ τε ἐν αὐτῇ ζῷα φοιτώντα τῇ ἑαυτοῦ διατάξει ἐκέλευσεν εἶναι· τὴν θάλασσαν καὶ τὰ ἐν αὐτῇ ζῷα προετοιμάσας ἐνέκλεισεν τῇ ἑαυτοῦ δυνάμει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/003.yaml
  text: For by his exceedingly great might he established the heavens[a], and by his incomprehensible understanding he ordered them. He also separated the earth from the water that surrounds it and fixed it upon the secure foundation of his own purpose. And the living creatures that move about on it he commanded to exist by his own ordinance. Having prepared the sea and the living creatures in it, he enclosed it by his own power.
translation:
  language: hi
  text: क्योंकि उसने अपने अत्यन्त महान सामर्थ्य से आकाशों को स्थिर किया[a] और अपनी अगम बुद्धि से उन्हें सुव्यवस्थित किया। उसने पृथ्वी को उसे घेरे हुए जल से अलग किया और उसे अपने ही संकल्प की दृढ़ नींव पर स्थापित किया। पृथ्वी पर विचरण करनेवाले जीवों को उसने अपने ही विधान से अस्तित्व में आने की आज्ञा दी। समुद्र और उसमें रहनेवाले जीवों को तैयार करके उसने अपनी ही शक्ति से समुद्र को सीमाओं में बाँध दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आकाशों को थामे रखा।”
    reason: ἐστήριξεν का मुख्य अर्थ 'स्थिर/दृढ़ करना' है; 'थामे रखना' उसका संदर्भानुकूल वैकल्पिक हिन्दी रूप है।
lexical_decisions:
- source_word: παμμεγεθεστάτῳ ... κράτει
  choice: अत्यन्त महान सामर्थ्य
  rationale: अतिशयोक्तिपूर्ण विशेषण और κράτος के प्रभावी सामर्थ्य—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀκαταλήπτῳ ... συνέσει
  choice: अगम बुद्धि
  rationale: ऐसी समझ या बुद्धि का भाव रखता है जो मानवीय ग्रहण से परे है।
- source_word: διεκύβευσεν
  choice: सुव्यवस्थित किया
  rationale: दुर्लभ क्रिया में कुशल संचालन या व्यवस्था का भाव है; यहाँ आकाशों के दैवी नियमन को सहज हिन्दी में व्यक्त किया गया है।
- source_word: τοῦ ἰδίου βουλήματος
  choice: अपनी ही इच्छा
  rationale: βούλημα की संकल्पित इच्छा या उद्देश्य की अर्थ-सीमा को बनाए रखता है; 'ही' αὐτοῦ/ἰδίου का बल व्यक्त करता है।
- source_word: τῇ ἑαυτοῦ διατάξει
  choice: अपनी ही आज्ञा से
  rationale: διάταξις यहाँ दैवी आदेश अथवा विधान है; 'आज्ञा' अगले क्रियापद ἐκέλευσεν के साथ हिन्दी में स्वाभाविक है।
- source_word: ἐνέκλεισεν
  choice: सीमाओं में बाँध दिया
  rationale: समुद्र को दैवी शक्ति से रोकने या निर्धारित सीमा में रखने का ठोस भाव व्यक्त करता है।
theological_decisions:
- issue: βουλήματος में दैवी इच्छा या उद्देश्य
  choice: अपनी ही इच्छा
  alternative: अपने ही उद्देश्य
  rationale: यूनानी शब्द दोनों अर्थों को समेट सकता है। मुख्य पाठ में सरल और व्यापक 'इच्छा' रखा गया है, बिना किसी विशिष्ट धर्मवैज्ञानिक प्रणाली को आरोपित किए।
- issue: अन्तिम αὐτήν का संदर्भ
  choice: उसे
  alternative: समुद्र को
  rationale: यूनानी स्त्रीलिंग सर्वनाम निकटवर्ती θάλασσαν अर्थात समुद्र की ओर संकेत करता है, पर मूल की सर्वनामात्मक अभिव्यक्ति और उसकी हल्की वाक्यगत अस्पष्टता सुरक्षित रखी गई है।
- issue: सृष्टि-वर्णन की ब्रह्माण्ड-कल्पना
  choice: पृथ्वी को उसके चारों ओर के जल से अलग किया
  alternative: पृथ्वी को उसे घेरे हुए जल से अलग किया
  rationale: περιέχοντος के स्थानिक अर्थ को सीधे रखा गया है और आधुनिक वैज्ञानिक व्याख्या आरोपित नहीं की गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। लम्बे यूनानी वाक्य को अर्थगत इकाइयों में विभाजित किया गया है, जबकि समानांतर सृष्टि-वर्णन और दैवी कर्तृत्व का बल सुरक्षित है।
