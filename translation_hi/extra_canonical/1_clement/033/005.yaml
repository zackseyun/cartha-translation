source:
  edition: Funk 1901 (normalized OCR)
  text: οὕτως γὰρ φησὶν ὁ θεός· Ποιήσωμεν ἄνθρωπον κατ’ εἰκόνα καὶ καθ’ ὁμοίωσιν ἡμετέραν· καὶ ἐποίησεν ὁ θεὸς τὸν ἄνθρωπον, ἄρσεν καὶ θῆλυ ἐποίησεν αὐτούς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/005.yaml
  text: For thus God says, “Let us make man according to our image and according to our likeness.” And God made man; male and female he made them.
translation:
  language: hi
  text: क्योंकि परमेश्वर इस प्रकार कहता है, “हम मनुष्य को अपने स्वरूप के अनुसार और अपनी समानता के अनुसार बनाएँ।” और परमेश्वर ने मनुष्य को बनाया; उसने उन्हें नर और नारी बनाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπον
  choice: मनुष्य
  rationale: यहाँ शब्द मानवजाति के प्रतिनिधि अर्थ में एकवचन है; आगे ‘उन्हें’ और ‘नर और नारी’ से उसका सामूहिक आशय स्पष्ट होता है।
- source_word: κατ’ εἰκόνα
  choice: अपने स्वरूप के अनुसार
  rationale: ‘स्वरूप’ εἰκών का स्वाभाविक और प्रतिष्ठित हिन्दी समतुल्य है; ‘के अनुसार’ κατά की तुलना/अनुरूपता को बनाए रखता है।
- source_word: καθ’ ὁμοίωσιν
  choice: अपनी समानता में
  rationale: ὁμοίωσις के समानता-संबंधी अर्थ को बनाए रखते हुए पहले पद की हूबहू पुनरावृत्ति से बचता है।
- source_word: ἄρσεν καὶ θῆλυ
  choice: नर और नारी
  rationale: सृष्टि-वर्णन की युग्मात्मक जैविक अभिव्यक्ति को dignified आधुनिक हिन्दी में प्रस्तुत करता है।
- source_word: ἐποίησεν αὐτούς
  choice: उसने उन्हें बनाया
  rationale: बहुवचन सर्वनाम को स्पष्ट रखता है, जिससे एकवचन ‘मनुष्य’ से नर और नारी दोनों की ओर होने वाला मूल संक्रमण सुरक्षित रहता है।
theological_decisions:
- issue: बहुवचन ‘हम...बनाएँ’
  choice: बहुवचन को ज्यों का त्यों रखा गया
  alternative: इसे एकवचन करना या इसकी व्याख्या जोड़ना
  rationale: ग्रीक पाठ का बहुवचन वास्तविक है, पर पद स्वयं उसका कारण नहीं बताता; इसलिए किसी त्रिएकतावादी, राजकीय या स्वर्गीय-सभा संबंधी व्याख्या को अनुवाद में नहीं जोड़ा गया।
- issue: मनुष्य का एकवचन और बाद का बहुवचन
  choice: ‘मनुष्य’ के बाद ‘उन्हें’ रखा गया
  alternative: आरंभ से ‘मनुष्यों’ कहना
  rationale: मूल पाठ की एकवचन-से-बहुवचन संरचना और उसके भीतर निहित मानवजाति की सामूहिकता को सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और शास्त्रीय उद्धरण के अनुकूल रजिस्टर। मूल यूनानी की पुनरुक्ति तथा एकवचन से बहुवचन में परिवर्तन को जानबूझकर बनाए रखा गया है।
