revisions:
- from: क्योंकि परमेश्वर इस प्रकार कहता है, “हम मनुष्य को अपने स्वरूप के अनुसार और अपनी समानता में बनाएँ।” और परमेश्वर ने मनुष्य को बनाया; नर और नारी करके उसने उन्हें बनाया।
  to: क्योंकि परमेश्वर इस प्रकार कहता है, “हम मनुष्य को अपने स्वरूप के अनुसार और अपनी समानता के अनुसार बनाएँ।” और परमेश्वर ने मनुष्य को बनाया; उसने उन्हें नर और नारी बनाया।
  rationale: The revision restores the parallel comparative force of both Greek prepositional phrases and recasts the final clause into natural modern standard Hindi. It retains the unexplicated divine plural and the original’s transition from singular ‘मनुष्य’ to plural ‘उन्हें,’ without adding doctrinal explanation.
