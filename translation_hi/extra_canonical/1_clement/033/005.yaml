review_pass:
  verdict: revise
  source_fidelity: Draft accurately preserves the divine plural in Ποιήσωμεν, the generic singular ἄνθρωπον followed by plural αὐτούς, and the paired terms ἄρσεν καὶ θῆλυ. However, καθ’ ὁμοίωσιν, like the preceding κατ’ εἰκόνα, has an explicit comparative sense ('according to'); this is not fully represented by 'अपनी समानता में.'
  naturalness: ‘अपनी समानता में’ and especially ‘नर और नारी करके उसने उन्हें बनाया’ are not natural modern standard Hindi. The revision uses clear, dignified Hindi while retaining the source’s singular-to-plural movement.
  terminology: ‘परमेश्वर,’ ‘मनुष्य,’ and ‘स्वरूप’ are appropriate in this register. ‘समानता’ suitably distinguishes ὁμοίωσις from εἰκών without importing an interpretation. ‘नर और नारी’ is retained as a formal and comprehensible rendering of the source pair.
  issues:
  - severity: medium
    issue: The second comparative phrase is undertranslated.
    rationale: καθ’ ὁμοίωσιν means ‘according to [our] likeness,’ parallel to κατ’ εἰκόνα. ‘अपनी समानता में’ changes this to a locative expression.
  - severity: medium
    issue: The final clause is idiomatically awkward.
    rationale: ‘नर और नारी करके उसने उन्हें बनाया’ is not natural Hindi syntax. ‘उसने उन्हें नर और नारी बनाया’ directly and idiomatically conveys ἄρσεν καὶ θῆλυ ἐποίησεν αὐτούς.
  revised_text: क्योंकि परमेश्वर इस प्रकार कहता है, “हम मनुष्य को अपने स्वरूप के अनुसार और अपनी समानता के अनुसार बनाएँ।” और परमेश्वर ने मनुष्य को बनाया; उसने उन्हें नर और नारी बनाया।
