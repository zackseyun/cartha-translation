base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/007.yaml
  text: Let us see that all the righteous were adorned with good works[a], and that the Lord himself also, having adorned himself with good works[b], rejoiced.
translation:
  language: hi
  text: आइए, देखें कि सभी धर्मी भले कामों से सुशोभित हुए, और स्वयं प्रभु भी भले कामों से अपने को सुशोभित करके आनंदित हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδωμεν
  choice: हम देखें
  rationale: प्रथम पुरुष बहुवचन के उपदेशात्मक रूप को सीधे और स्वाभाविक ढंग से व्यक्त करता है; यहाँ अर्थ ‘सुनिश्चित करें’ नहीं, बल्कि ध्यान देकर देखना है।
- source_word: ἐν ἔργοις ἀγαθοῖς
  choice: भले कामों से
  rationale: साधन या अलंकरण के माध्यम का भाव देता है और आधुनिक हिन्दी में सहज है।
- source_word: ἐκοσμήθησαν / κοσμήσας
  choice: सुशोभित हुए / अपने आपको सुशोभित करके
  rationale: एक ही यूनानी धातु के अलंकरण-संबंधी रूपक को दोनों स्थानों पर बनाए रखता है और क्रमशः कर्मवाच्य तथा कर्तृवाच्य रूप का भेद दिखाता है।
- source_word: οἱ δίκαιοι
  choice: सभी धर्मी
  rationale: πάντες सहित उन लोगों को सूचित करता है जो धर्मी हैं; ‘धर्मी’ धार्मिक साहित्य में परिचित और संक्षिप्त शब्द है।
- source_word: ἐχάρη
  choice: आनन्दित हुए
  rationale: अओरिस्ट क्रिया के पूर्ण कथन और गरिमापूर्ण हिन्दी शैली को व्यक्त करता है।
theological_decisions:
- issue: प्रभु के भले कामों से स्वयं को सुशोभित करने का कथन
  choice: रूपक को यथावत रखा गया
  alternative: ‘प्रभु ने भी भले काम किए और आनन्दित हुए’
  rationale: मूल पाठ प्रभु के विषय में भी κοσμέω का वही रूपक दोहराता है; इसे सरल बनाकर केवल काम करने का कथन कर देना साहित्यिक और धर्मवैचारिक तनाव को मिटा देता।
- issue: καὶ αὐτὸς δὲ का बल
  choice: ‘और स्वयं प्रभु भी’
  alternative: ‘और यहाँ तक कि स्वयं प्रभु’
  rationale: ‘भी’ योगात्मक बल को स्वाभाविक हिन्दी में रखता है, जबकि ‘यहाँ तक कि’ मूल की अपेक्षा अधिक आश्चर्य या विरोध का संकेत दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मूल के समानांतर वाक्य-विन्यास वाला अनुवाद। ‘सुशोभित’ ने κόσμος-सम्बन्धी अलंकरण रूपक को सुरक्षित रखा है; प्रभु के लिए आदरसूचक बहुवचन क्रिया-रूप प्रयुक्त हैं।
