source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπὶ πᾶσι τὸ ἐξοχώτατον καὶ παμμέγεθες κατὰ διάνοιαν, ἄνθρωπον, ταῖς ἱεραῖς καὶ ἀμιάντοις χερσὶν ἔπλασεν τῆς ἑαυτοῦ εἰκόνος χαρακτῆρα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/004.yaml
  text: Above all[a], with his holy and undefiled hands he formed man, the most excellent and exceedingly great work according to his mind, as the imprint of his own image.
translation:
  language: hi
  text: सबसे बढ़कर, उसने अपने पवित्र और अकलुषित हाथों से मनुष्य को—अपनी बुद्धि के अनुसार सबसे उत्कृष्ट और अत्यन्त महान कृति[a] को—अपने ही स्वरूप की छाप के रूप में गढ़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समझ में सबसे उत्कृष्ट और सचमुच महान प्राणी।”
    reason: यह κατὰ διάνοιαν को मनुष्य की समझ/बौद्धिकता से जोड़ने वाले वैकल्पिक अर्थ को दर्ज करता है, जबकि मुख्य पाठ निकट प्रसंग के अनुसार इसे परमेश्वर की सृजनात्मक बुद्धि से जोड़ता है।
lexical_decisions:
- source_word: ἐπὶ πᾶσι
  choice: सबसे बढ़कर
  rationale: यह पदबंध सृष्टि के अन्य कार्यों के ऊपर मनुष्य की विशिष्टता व्यक्त करता है; हिन्दी में यह स्वाभाविक रहते हुए मूल का बल बनाए रखता है।
- source_word: τὸ ἐξοχώτατον καὶ παμμέγεθες
  choice: सबसे उत्कृष्ट और अत्यन्त महान कृति
  rationale: नपुंसकलिंग विशेषणों को सृष्ट वस्तु या कृति के रूप में समझना प्रसंगानुकूल है; ‘अत्यन्त महान’ παμ- के प्रबल भाव को व्यक्त करता है।
- source_word: κατὰ διάνοιαν
  choice: उसकी बुद्धि के अनुसार
  rationale: κατά के अनुरूप ‘के अनुसार’ रखा गया है और प्रसंग में διάνοια को परमेश्वर की बुद्धि/मन से जोड़ा गया है, न कि मनुष्य की समझ से।
- source_word: ἔπλασεν
  choice: गढ़ा
  rationale: क्रिया हाथों से आकार देने या रचने का सजीव भाव रखती है।
- source_word: χαρακτῆρα
  choice: छाप
  rationale: यह किसी प्रतिरूप या अंकित समानता का भाव देता है और εἰκών से अलग शब्द रहते हुए उसके संबंध को स्पष्ट करता है।
- source_word: τῆς ἑαυτοῦ εἰκόνος
  choice: अपने ही स्वरूप की
  rationale: ἑαυτοῦ के आत्मवाचक बल के लिए ‘अपने ही’ और εἰκών के लिए परिचित, गरिमापूर्ण ‘स्वरूप’ चुना गया है।
theological_decisions:
- issue: κατὰ διάνοιαν का संबंध
  choice: इसे परमेश्वर की बुद्धि के अनुसार बनी कृति से संबद्ध किया गया है।
  alternative: इसे मनुष्य की समझ या बौद्धिक महानता से संबद्ध किया जा सकता है।
  rationale: अध्याय का निकट प्रसंग सृष्टि में परमेश्वर की बुद्धि, इच्छा, व्यवस्था और सामर्थ्य पर बल देता है; नपुंसकलिंग τὸ ἐξοχώτατον καὶ παμμέγεθες भी मनुष्य को महान ‘कृति’ के रूप में पढ़ने का समर्थन करता है।
- issue: χαρακτῆρα का विधेयात्मक संबंध
  choice: मनुष्य को परमेश्वर के स्वरूप की छाप बनाया गया।
  alternative: मनुष्य को परमेश्वर के स्वरूप की छाप के रूप में गढ़ा गया।
  rationale: दोनों व्याकरणतः निकट हैं; चुना गया रूप हिन्दी में स्पष्ट है और मनुष्य तथा छाप की समानाधिकरणीयता बनाए रखता है, बिना स्वरूप और छाप को एक ही शब्द बना देने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और सार्वजनिक पाठ के योग्य शैली। वाक्य की डैश-रचना यूनानी पदक्रम के घने विशेषण-समूह को स्पष्ट करती है। ‘पवित्र और निष्कलंक हाथ’ का मूर्त रूप जानबूझकर सुरक्षित रखा गया है; इसे रूपक बताकर या अमूर्त बनाकर धर्मवैचारिक तनाव नहीं मिटाया गया।
