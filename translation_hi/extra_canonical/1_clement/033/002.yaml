  text: αὐτὸς γὰρ ὁ δημιουργὸς καὶ δεσπότης τῶν ἁπάντων ἐπὶ τοῖς ἔργοις αὐτοῦ ἀγάλλεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/002.yaml
  text: For the Creator and Master of all himself rejoices in his works.
translation:
  language: hi
  text: क्योंकि समस्त का सृष्टिकर्ता और स्वामी स्वयं अपने कार्यों पर हर्षित होता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δημιουργὸς
  choice: सृष्टिकर्ता
  rationale: यहाँ शब्द समस्त वस्तुओं को बनाने वाले के अर्थ में प्रयुक्त है; ‘सृष्टिकर्ता’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: δεσπότης
  choice: स्वामी
  rationale: यह अधिकार और प्रभुत्व का भाव रखता है; ‘स्वामी’ इस भाव को स्पष्ट रूप से व्यक्त करता है।
- source_word: τῶν ἁπάντων
  choice: सबका
  rationale: समस्त सृष्टि पर सृष्टिकर्ता और स्वामी के संबंध को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ τοῖς ἔργοις αὐτοῦ
  choice: अपने कार्यों से
  rationale: ἐπί के कारण या आधार संबंधी भाव को हिन्दी में सहज ढंग से व्यक्त करता है; संदर्भ में आशय उसके किए हुए कार्यों से है।
- source_word: ἀγάλλεται
  choice: आनन्दित होता है
  rationale: यह साधारण प्रसन्नता से अधिक हर्षित होने का भाव देता है; ‘आनन्दित होता है’ गरिमापूर्ण तथा सुबोध है।
theological_decisions:
- issue: αὐτός द्वारा कर्ता पर बल
  choice: ‘स्वयं’ को स्पष्ट रखा गया
  alternative: बल को अनूदित न करना
  rationale: यूनानी पाठ सृष्टिकर्ता और स्वामी पर जोर देता है; ‘स्वयं’ उस बल को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘सृष्टिकर्ता और स्वामी’ यूनानी की दोनों उपाधियों को अलग-अलग सुरक्षित रखता है।
