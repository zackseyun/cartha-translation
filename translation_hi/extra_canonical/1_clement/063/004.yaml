  text: τοῦτο δὲ ἐποιήσαμεν, ἵνα εἰδῆτε, ὅτι πᾶσα ἡμῶν φροντὶς καὶ γέγονεν καὶ ἔστιν εἰς τὸ ἐν τάχει ὑμᾶς εἰρηνεῦσαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/004.yaml
  text: And we have done this so that you may know that all our concern has been[a], and is, toward your being quickly at peace.
translation:
  language: hi
  text: और हमने यह इसलिए किया है कि तुम जान लो कि हमारी सारी चिंता तुम्हारे शीघ्र शांति से रहने की रही है और अब भी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φροντίς
  choice: चिंता
  rationale: यहाँ शब्द का अर्थ समुदाय की स्थिति के प्रति गंभीर सरोकार है; ‘चिंता’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस भाव को व्यक्त करता है।
- source_word: ἐν τάχει
  choice: शीघ्र
  rationale: यह पद समय की तत्परता दर्शाता है; ‘शीघ्र’ संक्षिप्त, dignified और स्रोत के निकट है।
- source_word: εἰρηνεῦσαι
  choice: शांति से रहो
  rationale: सक्रिय infinitive का अर्थ ‘शांति में/से रहना’ है। यह अनुवाद निष्क्रिय ‘शांति में बहाल किए जाओ’ जैसा अतिरिक्त भाव नहीं जोड़ता।
theological_decisions:
- issue: εἰρηνεῦσαι में शांति की अवस्था और मेल-मिलाप की प्रक्रिया के बीच संभावित अर्थ-छाया
  choice: शांति से रहो
  alternative: मेल-मिलाप कर लो
  rationale: यूनानी सक्रिय रूप मुख्यतः शांति से रहने या शांति बनाए रखने को व्यक्त करता है। ‘मेल-मिलाप कर लो’ संदर्भतः संभव होते हुए भी क्रिया के अर्थ को अधिक विशिष्ट बना देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण बहुवचन संबोधन रखा गया है। καὶ γέγονεν καὶ ἔστιν की कालगत दृढ़ता को ‘रही है और अब भी यही है’ से स्पष्ट किया गया है।
