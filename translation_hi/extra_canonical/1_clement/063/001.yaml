id: 1CLEM.63.1
reference: 1 Clement 63:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: Θεμιτὸν οὖν ἐστὶν τοῖς τοιούτοις καὶ τοσούτοις ὑποδείγμασιν προσεληλυθότας ὑποθεῖναι τὸν τράχηλον καὶ τὸν τῆς ὑπακατὰ τὸν προκείμενον ἡμῖν ἐν ἀληθείᾳ σκοπὸν δίχα παντὸς μώμου καταντήσωμεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/001.yaml
  text: Therefore it is fitting that, having come near to such and so many examples, we should bow the neck and, fulfilling the place of obedience, we should be quiet, so that having ceased from the vain sedition, we may reach the goal set before us in truth, without any blemish.
translation:
  language: hi
  text: इसलिए उचित है कि, ऐसे और इतने अधिक उदाहरणों से रूबरू होने के बाद, हम अपनी गर्दन झुकाएँ और आज्ञाकारिता का अपना दायित्व पूरा करके[a] शांत हो जाएँ, ताकि इस व्यर्थ कलह को छोड़कर हम किसी भी दोष के बिना उस लक्ष्य तक पहुँचें, जो वास्तव में हमारे सामने रखा गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आज्ञाकारिता का स्थान पूरा करके।”
    reason: यूनानी मुहावरे के अधिक अक्षरशः रूप को सुरक्षित रखना और मुख्य पाठ के स्वाभाविक अनुवाद को पारदर्शी बनाना।
lexical_decisions:
- source_word: ὑποθεῖναι τὸν τράχηλον
  choice: अपनी गर्दन झुका दें
  rationale: यह अधीनता स्वीकार करने के यूनानी रूपक को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τὸν τῆς ὑπακοῆς τόπον ἀναπληρώσαντας
  choice: आज्ञाकारिता की अपनी भूमिका पूरी करते हुए
  rationale: ‘स्थान पूरा करना’ का अक्षरशः रूप हिन्दी में अस्वाभाविक है; ‘भूमिका पूरी करना’ मूल के दायित्व निभाने के भाव को व्यक्त करता है।
- source_word: ἡσυχάσαι
  choice: शांत हो जाएँ
  rationale: संदर्भ में इसका अर्थ केवल मौन रहना नहीं, बल्कि विघटनकारी गतिविधि रोककर शांत होना है।
- source_word: τῆς ματαίας στάσεως
  choice: इस व्यर्थ कलह से
  rationale: στάσις यहाँ समुदाय के भीतर गुटबंदी, विद्रोह या संघर्ष का द्योतक है; ‘कलह’ आधुनिक हिन्दी में इस संदर्भ को सहजता से समेटता है।
- source_word: ἐν ἀληθείᾳ
  choice: सचमुच
  rationale: यह क्रियाविशेषणीय रूप मूल के ‘वास्तव में/सत्यतः’ भाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे लक्ष्य के विशेषण के रूप में अनावश्यक रूप से निश्चित किए।
- source_word: δίχα παντὸς μώμου
  choice: निर्दोष
  rationale: मूल का अर्थ ‘हर प्रकार के दोष से रहित’ है; ‘निर्दोष’ संक्षिप्त, dignified और अर्थपूर्ण हिन्दी है।
theological_decisions:
- issue: आज्ञाकारिता किसके प्रति है
  choice: ‘आज्ञाकारिता’ को बिना किसी स्पष्ट कर्म के रखा गया है
  alternative: ‘अगुओं के प्रति आज्ञाकारिता’ या ‘परमेश्वर के प्रति आज्ञाकारिता’
  rationale: यूनानी वाक्य स्वयं आज्ञाकारिता के लक्ष्य को स्पष्ट नहीं करता; किसी विशिष्ट अधिकारी या ईश्वरीय संदर्भ को जोड़ना मूल की वास्तविक अस्पष्टता को समाप्त कर देता।
- issue: ἐν ἀληθείᾳ का संबंध
  choice: इसे ‘सचमुच हमारे सामने रखा गया है’ के रूप में लिया गया है
  alternative: ‘सत्य में स्थित लक्ष्य’
  rationale: वाक्यरचना एक से अधिक संबंध की अनुमति देती है। चुना गया रूप यूनानी के क्रियाविशेषणीय बल को बनाए रखता है और ‘सत्य’ को कोई अलग धर्मवैज्ञानिक संज्ञा नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामुदायिक उपदेश के अनुरूप गरिमामय किंतु सरल शैली। पाठ में बहुवचन आग्रह और मूल रूपक बनाए गए हैं। उपलब्ध पांडुलिपीय/आलोचनात्मक साक्ष्य के आधार पर OCR में छूटा हुआ शांत होने और व्यर्थ कलह से विरत होने वाला खंड अनूदित किया गया है।
