revisions:
- from: इसलिए उचित है कि ऐसे और इतने सारे उदाहरणों के सामने आने के बाद हम अपनी गर्दन झुका दें और आज्ञाकारिता की अपनी भूमिका पूरी करते हुए[a] शांत हो जाएँ, ताकि इस व्यर्थ कलह से विरत होकर हम उस लक्ष्य तक निर्दोष पहुँचें, जो सचमुच हमारे सामने रखा गया है।
  to: इसलिए उचित है कि, ऐसे और इतने अधिक उदाहरणों से रूबरू होने के बाद, हम अपनी गर्दन झुकाएँ और आज्ञाकारिता का अपना दायित्व पूरा करके[a] शांत हो जाएँ, ताकि इस व्यर्थ कलह को छोड़कर हम किसी भी दोष के बिना उस लक्ष्य तक पहुँचें, जो वास्तव में हमारे सामने रखा गया है।
  rationale: The revision corrects the direction of the opening participial phrase and improves the final Hindi expression for ‘without any blemish.’ It retains the audit-supported clause concerning quietness and cessation from vain factional conflict, despite its omission in the supplied normalized OCR, and preserves the source’s ambiguity concerning both the object of obedience and the precise syntactic attachment of ἐν ἀληθείᾳ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T17:09:49Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft properly incorporates the clause absent from the normalized Funk OCR but supported by the critical-text audit trail: being quiet and ceasing from the vain στάσις. Its renderings of submission, obedience, quietness, and the goal are substantively faithful. However, ‘उदाहरणों के सामने आने के बाद’ reverses the Greek participle’s perspective: the readers, not the examples, have come near/been brought into contact with the examples.'
  naturalness: The prose is generally modern and dignified. ‘निर्दोष पहुँचें’ is somewhat compressed and awkward in Hindi; ‘किसी भी दोष के बिना ... पहुँचें’ is clearer while retaining the source sense. ‘ऐसे ... उदाहरणों से रूबरू होने के बाद’ is natural and avoids the reversed perspective.
  terminology: ‘आज्ञाकारिता,’ ‘शांत हो जाएँ,’ and ‘व्यर्थ कलह’ are appropriate. ‘आज्ञाकारिता का अपना दायित्व’ is more idiomatic than ‘अपनी भूमिका’ and adequately conveys the idiomatic ‘fulfilling the place of obedience.’ The reference of obedience remains appropriately unspecified. ‘वास्तव में’ preserves the non-doctrinal adverbial force and does not force a disputed syntactic attachment.
  issues:
  - severity: medium
    issue: The opening phrase gives the examples the action of coming before the readers.
    rationale: 'προσεληλυθότας modifies the implied ‘we’: ‘having come near to / encountered such and so many examples.’ Hindi ‘उदाहरणों के सामने आने के बाद’ instead says that the examples came before us.'
  - severity: low
    issue: ‘निर्दोष पहुँचें’ is stylistically abrupt.
    rationale: δίχα παντὸς μώμου means reaching the goal without any blame or blemish. Expressing this as ‘किसी भी दोष के बिना’ is more natural Hindi and preserves the scope of παντός.
  revised_text: इसलिए उचित है कि, ऐसे और इतने अधिक उदाहरणों से रूबरू होने के बाद, हम अपनी गर्दन झुकाएँ और आज्ञाकारिता का अपना दायित्व पूरा करके[a] शांत हो जाएँ, ताकि इस व्यर्थ कलह को छोड़कर हम किसी भी दोष के बिना उस लक्ष्य तक पहुँचें, जो वास्तव में हमारे सामने रखा गया है।
