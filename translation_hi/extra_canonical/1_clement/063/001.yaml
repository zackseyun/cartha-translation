  revision_rationale: The revision corrects the direction of the opening participial phrase and improves the final Hindi expression for ‘without any blemish.’ It retains the audit-supported clause concerning quietness and cessation from vain factional conflict, despite its omission in the supplied normalized OCR, and preserves the source’s ambiguity concerning both the object of obedience and the precise syntactic attachment of ἐν ἀληθείᾳ.
