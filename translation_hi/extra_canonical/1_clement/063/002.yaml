  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: χαρὰν γὰρ καὶ ἀγαλλίασιν ἡμῖν παρέξετε, ἐὰν ὑπήκοοι γενήμενοι τοῖς ὑφʼ ἡμῶν γεγραμμένοις διὰ τοῦ ἁγίου πνεύματος ἐκκόψητε τὴν ἄθεμον τῆς ζήλους ὑμῶν ὀργὴν κατὰ τὴν ἔντευξιν, ἣν ἐποιησάμεθα περὶ εἰρήνης καὶ ὁμονοίας ἐν τῇδε τῇ ἐπιστολῇ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/002.yaml
  text: For you will give us joy and exultation if, becoming obedient to the things written by us through the Holy Spirit, you cut off the lawless anger of your jealousy, in accordance with the appeal that we made in this letter concerning peace and concord.
translation:
  language: hi
  text: क्योंकि यदि तुम पवित्र आत्मा के द्वारा हमारे लिखी हुई बातों के आज्ञाकारी बनकर अपनी ईर्ष्या के विधि-विरुद्ध क्रोध को काटकर दूर कर दोगे, उस अपील के अनुसार जो हमने इस पत्र में शांति और एकमनता के विषय में की है, तो तुम हमें आनंद और हर्ष दोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαρὰν ... καὶ ἀγαλλίασιν
  choice: आनंद और हर्ष
  rationale: दोनों निकटार्थी संज्ञाओं का युग्म बनाए रखते हुए स्वाभाविक और गरिमापूर्ण हिन्दी दी गई है।
- source_word: ὑπήκοοι γενήμενοι
  choice: आज्ञाकारी बनकर
  rationale: परिवर्तनसूचक कृदन्त γενήμενοι और आज्ञापालन के भाव, दोनों को संक्षेप में व्यक्त करता है।
- source_word: τοῖς ὑφʼ ἡμῶν γεγραμμένοις
  choice: हमारे लिखे हुए वचनों
  rationale: यूनानी बहुवचन का आशय पत्र में लिखी बातों/निर्देशों से है; ‘वचनों’ से लिखित विषय का स्वाभाविक हिन्दी रूप मिलता है।
- source_word: διὰ τοῦ ἁγίου πνεύματος
  choice: पवित्र आत्मा के द्वारा
  rationale: διά के साधन/माध्यमसूचक अर्थ को बिना धर्मवैज्ञानिक तनाव घटाए स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: ἐκκόψητε
  choice: काटकर दूर कर दोगे
  rationale: मूल क्रिया के सशक्त, रूपकात्मक ‘काट डालने’ के भाव को हिन्दी में स्पष्ट किया गया है।
- source_word: τὴν ἄθεμον ... ὀργὴν
  choice: अधर्मपूर्ण क्रोध
  rationale: ἄθεμος का अर्थ विधि-विरुद्ध या अनैतिक है; ‘अधर्मपूर्ण’ धार्मिक-नैतिक संदर्भ में स्वाभाविक है।
- source_word: τῆς ζήλους ὑμῶν
  choice: अपनी ईर्ष्या के
  rationale: पाठ का ζήλους असामान्य रूप है, पर आशय ζῆλος से उत्पन्न ईर्ष्या/प्रतिद्वंद्विता का है; प्रसंग में ‘ईर्ष्या’ उपयुक्त है।
- source_word: ἔντευξιν
  choice: निवेदन
  rationale: यहाँ प्रार्थना या अपील के अर्थ में प्रयुक्त शब्द को पाठकों के लिए सहज ‘निवेदन’ से व्यक्त किया गया है।
- source_word: εἰρήνης καὶ ὁμονοίας
  choice: शांति और एकता
  rationale: εἰρήνη को ‘शांति’ और ὁμόνοια को समान मन/सहमति के सामाजिक भाव सहित ‘एकता’ के रूप में दिया गया है।
theological_decisions:
- issue: लेखकों की लिखी बातों और पवित्र आत्मा का संबंध
  choice: ‘पवित्र आत्मा के द्वारा हमारे लिखे हुए वचनों’
  alternative: ‘पवित्र आत्मा के द्वारा तुम्हें लिखी गई हमारी बातों’
  rationale: मूल वाक्य में διὰ τοῦ ἁγίου πνεύματος का संबंध लिखी हुई बातों से स्वाभाविक रूप से है। अनुवाद प्रेरणा की प्रकृति या सीमा पर कोई अतिरिक्त सिद्धांत आरोपित किए बिना यही दावा बनाए रखता है।
- issue: ζῆλος का नैतिक अर्थ
  choice: ईर्ष्या
  alternative: जोश / प्रतिद्वंद्विता
  rationale: क्रोध, अशांति और मेल की अपील के संदर्भ में नकारात्मक ‘ईर्ष्या’ सर्वाधिक उपयुक्त है, फिर भी इससे किसी विशिष्ट संप्रदायगत अर्थ को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली। मूल के लंबे शर्तवाचक वाक्य को सुरक्षित रखा गया है; डैश केवल ‘निवेदन’ वाले पदबंध का संबंध स्पष्ट करता है। ‘काटकर दूर कर दोगे’ मूल रूपक की तीव्रता बनाए रखता है।
