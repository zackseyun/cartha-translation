  yaml_path: translation/extra_canonical/1_clement/063/003.yaml
  text: And we have sent faithful and prudent men, who from youth until old age have conducted themselves blamelessly among us; these will also be witnesses between you and us.
translation:
  language: hi
  text: और हमने विश्वासयोग्य और विवेकी पुरुषों को भेजा है, जो युवावस्था से लेकर बुढ़ापे तक हमारे बीच निर्दोष आचरण करते रहे हैं। ये तुम्हारे और हमारे बीच गवाह भी होंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστούς
  choice: विश्वासयोग्य
  rationale: यहाँ शब्द भेजे गए पुरुषों की भरोसेमंद निष्ठा और विश्वसनीयता को व्यक्त करता है।
- source_word: σώφρονας
  choice: विवेकी
  rationale: यह संयमित, समझदार और संतुलित चरित्र का स्वाभाविक हिन्दी निरूपण है।
- source_word: ἀναστραφέντας
  choice: आचरण करते रहे हैं
  rationale: क्रिया जीवन-व्यवहार या चाल-चलन को दर्शाती है; दीर्घ अवधि के संदर्भ में यह रूप स्वाभाविक है।
- source_word: ἀμέμπτως
  choice: निर्दोष
  rationale: इसका अर्थ ऐसा आचरण है जिस पर उचित दोष न लगाया जा सके।
- source_word: μάρτυρες
  choice: गवाह
  rationale: संदर्भ में ये पुरुष दोनों पक्षों के बीच घटनाओं और प्रतिक्रिया के प्रत्यक्ष साक्षी होंगे।
