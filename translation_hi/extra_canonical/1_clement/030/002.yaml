  yaml_path: translation/extra_canonical/1_clement/030/002.yaml
  text: For it says[a], "God opposes the proud, but gives grace to the humble."
translation:
  language: hi
  text: क्योंकि कहा गया है[a], “परमेश्वर घमंडियों का विरोध करता है, पर नम्रों को अनुग्रह देता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि परमेश्वर—वह कहता है—घमंडियों का विरोध करता है, पर नम्रों को अनुग्रह देता है।”
    reason: ग्रीक φησίν उद्धरण को आरंभ करने वाला निर्वैयक्तिक सूत्र है; यद्यपि मुख्य पाठ में उसका स्वाभाविक हिन्दी रूप ‘कहा गया है’ है, यह विकल्प यूनानी के बीच में आए parenthetical सूत्र को दर्शाता है।
lexical_decisions:
- source_word: ὑπερηφάνοις
  choice: घमण्डियों
  rationale: यह शब्द अभिमानी या अहंकारी लोगों को दर्शाता है; ‘घमण्डियों’ से सामान्य पाठक के लिए अर्थ स्पष्ट और स्वाभाविक रहता है।
- source_word: ἀντιτάσσεται
  choice: विरोध करता है
  rationale: क्रिया सक्रिय प्रतिरोध या विरुद्ध खड़े होने का भाव रखती है; ‘विरोध करता है’ इस अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: ταπεινοῖς
  choice: दीनों
  rationale: यहाँ घमण्डियों के विपरीत विनम्र या नम्र लोगों का उल्लेख है; ‘दीनों’ शास्त्रीय गरिमा और व्यापक अर्थ बनाए रखता है।
- source_word: χάριν
  choice: अनुग्रह
  rationale: यहाँ χάρις परमेश्वर द्वारा दिए जाने वाले कृपापूर्ण अनुग्रह को सूचित करता है; ‘अनुग्रह’ धार्मिक संदर्भ में सटीक और प्रचलित है।
theological_decisions:
- issue: φησίν को उद्धरण-सूचक रूप में समझना
  choice: ‘लिखा है’ के द्वारा इसे पवित्रशास्त्र के उद्धरण की भूमिका के रूप में प्रस्तुत किया गया है।
  alternative: ‘वह कहता है’ या ‘क्योंकि परमेश्वर, वह कहता है, ...’
  rationale: यहाँ φησίν नीतिवचन 3:34 के उद्धरण को प्रस्तुत करने वाला निर्वैयक्तिक सूत्र है। ‘लिखा है’ हिन्दी में उस कार्य को स्वाभाविक ढंग से स्पष्ट करता है, जबकि मुख्य पाठ की वैकल्पिक व्याकरणिक सम्भावना पादटिप्पणी में सुरक्षित है।
- issue: ταπεινοῖς का अर्थ-क्षेत्र
  choice: ‘दीनों’
  alternative: ‘नम्र लोगों को’
  rationale: मूल शब्द सामाजिक नीचता और आन्तरिक नम्रता दोनों का संकेत दे सकता है। ‘दीनों’ इस संक्षिप्त विरोधात्मक कथन में अर्थ की व्यापकता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली। उद्धरण की संक्षिप्त समानांतर संरचना सुरक्षित रखी गई है; ‘परमेश्वर’, ‘अनुग्रह’ और ‘दीनों’ जैसे परिचित शास्त्रीय शब्द सामान्य पाठक के लिए बोधगम्य हैं।
