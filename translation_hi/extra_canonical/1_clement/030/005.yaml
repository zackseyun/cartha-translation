  text: εὐλογημένος γεννητὸς γυναικὸς ὀλιγόβιος. μὴ πολὺς ἐν ῥήμασιν γίνου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/005.yaml
  text: Blessed is one born of woman[a], short-lived. Do not be one of many words.
translation:
  language: hi
  text: स्त्री से जन्मा अल्पायु मनुष्य धन्य है। बहुत बोलनेवाले मत बनो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “शब्दों में बहुत मत बनो।”
    reason: यूनानी मुहावरे की मूल संरचना दिखाने के लिए, जिसे मुख्य पाठ में स्वाभाविक हिन्दी में व्यक्त किया गया है।
lexical_decisions:
- source_word: εὐλογημένος
  choice: धन्य
  rationale: यह पूर्ण कृदंत यहाँ विशेषणात्मक अर्थ में है; ‘धन्य’ आशीषित या प्रशंसित होने का अर्थ संक्षेप में व्यक्त करता है।
- source_word: γεννητὸς γυναικὸς
  choice: स्त्री से जन्मा मनुष्य
  rationale: यूनानी पद का शाब्दिक अर्थ ‘स्त्री से जन्मा’ है। हिन्दी में निहित व्यक्ति को स्पष्ट करने के लिए ‘मनुष्य’ जोड़ा गया है।
- source_word: ὀλιγόβιος
  choice: अल्पायु
  rationale: इसका अर्थ कम आयु या थोड़े जीवन वाला है; ‘अल्पायु’ स्वाभाविक और संक्षिप्त हिन्दी है।
- source_word: μὴ πολὺς ἐν ῥήμασιν γίνου
  choice: बहुत बोलनेवाले मत बनो
  rationale: शाब्दिक संरचना ‘शब्दों में बहुत मत बनो’ हिन्दी में अस्वाभाविक है। यह चयन वाचाल न होने की आज्ञा को सहज रूप में व्यक्त करता है।
theological_decisions:
- issue: पहले वाक्य में ‘धन्य’ और अल्पायु मानव का संबंध
  choice: स्त्री से जन्मे अल्पायु मनुष्य को ‘धन्य’ कहा गया है
  alternative: विराम-चिह्न या पाठ-संबंध के आधार पर ‘धन्य’ को आस-पास के वाक्य से जोड़ना
  rationale: प्रदत्त यूनानी पाठ और उसके विराम के अनुसार εὐλογημένος इसी वाक्य में γεννητὸς γυναικὸς ὀλιγόβιος का विधेय है; अनावश्यक रूप से कथन का तनाव हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अल्पायु’ साहित्यिक होते हुए भी प्रचलित और स्पष्ट है।
