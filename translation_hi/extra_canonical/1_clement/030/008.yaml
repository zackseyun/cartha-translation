source:
  edition: Funk 1901 (normalized OCR)
  text: θράσος καὶ αὐθάδεια καὶ τόλμα τοῖς κατηραμένοις ὑπὸ τοῦ θεοῦ· ἐπιείκεια καὶ ταπεινοφροσύνη καὶ πραΰτης παρὰ τοῖς ηὐλογημένοις ὑπὸ τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/008.yaml
  text: Insolence and arrogance and recklessness belong to those cursed by God[a]; but gentleness and humility and meekness are found among those blessed by God.
translation:
  language: hi
  text: ढिठाई, अहंकार और दुस्साहस उन लोगों में होते हैं जिन्हें परमेश्वर ने शाप दिया है; परंतु सौम्यता, दीनता और नम्रता उन लोगों में पाई जाती हैं जिन्हें परमेश्वर ने आशीष दी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θράσος
  choice: ढिठाई
  rationale: यहाँ दुर्गुणों की सूची में शब्द निर्लज्ज धृष्टता या उद्दंड साहस का नकारात्मक भाव रखता है; ‘साहस’ सकारात्मक समझा जा सकता है।
- source_word: αὐθάδεια
  choice: अहंकार
  rationale: स्वेच्छाचारी आत्म-महत्त्व और दूसरों की परवाह न करने वाले घमंड का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: τόλμα
  choice: दुस्साहस
  rationale: इस नकारात्मक संदर्भ में यह उतावले और अनुचित साहस को व्यक्त करता है, न कि प्रशंसनीय वीरता को।
- source_word: ἐπιείκεια
  choice: उदारता
  rationale: यह कठोरता के विपरीत संयत, सहनशील और न्यायोचित उदार व्यवहार को दर्शाता है; केवल ‘कोमलता’ इसकी नैतिक व्यापकता को सीमित कर सकती है।
- source_word: ταπεινοφροσύνη
  choice: दीनता
  rationale: मन की विनम्रता या नम्र आत्म-दृष्टि को संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: πραΰτης
  choice: नम्रता
  rationale: कोमल, अनाक्रामक और आत्म-संयमित व्यवहार का स्वाभाविक हिन्दी पद।
- source_word: τοῖς κατηραμένοις ὑπὸ τοῦ θεοῦ
  choice: जो परमेश्वर के शाप के अधीन हैं
  rationale: ग्रीक निष्क्रिय कृदंत और कर्ता ‘परमेश्वर के द्वारा’ को स्पष्ट रखते हुए हिन्दी में अप्राकृतिक ‘शापित किए गए’ से बचता है।
- source_word: τοῖς ηὐλογημένοις ὑπὸ τοῦ θεοῦ
  choice: जिन्हें परमेश्वर ने आशीष दी है
  rationale: पूर्ण निष्क्रिय कृदंत का स्वाभाविक हिन्दी रूप, जिसमें परमेश्वर स्पष्ट कर्ता बना रहता है।
theological_decisions:
- issue: शाप और आशीष में परमेश्वर की भूमिका
  choice: दोनों खंडों में परमेश्वर को स्पष्ट कर्ता/स्रोत रखा गया है
  alternative: ‘शापित लोगों’ और ‘आशीषित लोगों’ जैसे संक्षिप्त रूप
  rationale: मूल यूनानी दोनों स्थानों पर ὑπὸ τοῦ θεοῦ कहकर परमेश्वर की भूमिका स्पष्ट करता है; इसे लोप करना अर्थ को कमजोर करता।
- issue: παρά के संबंध का स्वरूप
  choice: ‘उन लोगों में पाई जाती हैं’
  alternative: ‘उन लोगों के पास होती हैं’
  rationale: यह गुणों के आशीष पाए लोगों के बीच/उनमें विद्यमान होने का स्वाभाविक हिन्दी निरूपण है और स्वामित्व का अनावश्यक कठोर अर्थ नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, समांतर और गरिमापूर्ण वाक्य-विन्यास। दुर्गुणों और सद्गुणों के त्रिक तथा दोनों खंडों का विरोध सुरक्षित रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि θράσος का नकारात्मक भाव ‘ढिठाई’ में स्पष्ट है।
