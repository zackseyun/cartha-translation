    reason: πολλὰ λέγων, ἀντακούσεται और εὐλάλος के निकटतर वैकल्पिक रूपों को दर्ज करना।
lexical_decisions:
- source_word: πολλὰ λέγων
  choice: बहुत-सी बातें बोलता है
  rationale: यह यूनानी पदबंध की बहुलता और बोलने की क्रिया—दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἀντακούσεται
  choice: उत्तर भी सुनेगा
  rationale: क्रिया में प्रत्युत्तर सुनने का भाव है; यह चयन अस्पष्टता बनाए रखता है कि वह उत्तर खंडन, प्रतिवाद या सामान्य प्रत्युत्तर है।
- source_word: εὐλάλος
  choice: वाक्पटु मनुष्य
  rationale: यह शब्द सुचारु, कुशल या प्रभावशाली ढंग से बोलने वाले व्यक्ति को सूचित करता है; ‘वाक्पटु’ संक्षिप्त और गरिमापूर्ण हिन्दी है।
- source_word: δίκαιος
  choice: धर्मी
  rationale: यह नैतिक और धार्मिक अर्थ-क्षेत्र वाले यूनानी विशेषण का प्रचलित, धर्मशास्त्रीय रूप से तटस्थ हिन्दी समतुल्य है।
theological_decisions:
- issue: वाक्पटुता और धार्मिकता का संबंध
  choice: 'प्रश्न को खुला और आलोचनात्मक रखा गया है: ‘क्या ... अपने आप को धर्मी समझता है?’'
  alternative: इसे निर्णायक कथन बनाना कि वाक्पटु व्यक्ति धर्मी नहीं है
  rationale: यूनानी पाठ आलंकारिक प्रश्न प्रस्तुत करता है; अनुवाद को निहित उत्तर स्पष्ट करके धर्मशास्त्रीय तनाव को समाप्त नहीं करना चाहिए।
- issue: λέγει का अनिर्दिष्ट कर्ता
  choice: ‘वह कहता है’
  alternative: ‘पवित्रशास्त्र कहता है’ या किसी विशिष्ट वक्ता का नाम देना
  rationale: मूल पाठ में कर्ता स्पष्ट नाम से नहीं दिया गया; इसलिए अनुवाद में अतिरिक्त पहचान नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। उद्धरण पूरे पद के अंत तक जारी रखा गया है, क्योंकि λέγει γάρ के बाद का समूचा वाक्य उद्धृत सामग्री है।
