source:
  edition: Funk 1901 (normalized OCR)
  text: ἡ μαρτυρία τῆς ἀγαθῆς πράξεἡμῶν διδόσθω ὑπ’ ἄλλων, καθὼς ἐδόθη τοῖς πατράσιν ἡμῶν τοῖς δικαίοις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/007.yaml
  text: Let the testimony of our good deeds be given by others[a], just as it was given to our righteous fathers.
translation:
  language: hi
  text: हमारे अच्छे आचरण की गवाही दूसरे लोग दें,[a] जैसे हमारे धर्मी पूर्वजों को दी गई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हमारे अच्छे काम की गवाही’।
    reason: एकवचन πρᾶξις का अर्थ सामान्य आचरण भी हो सकता है और कोई अच्छा काम भी।
lexical_decisions:
- source_word: μαρτυρία
  choice: गवाही
  rationale: यह शब्द किसी व्यक्ति के आचरण के विषय में दूसरों द्वारा दी जाने वाली साक्षी या प्रशंसात्मक पुष्टि को व्यक्त करता है; ‘गवाही’ सरल और स्रोत के निकट है।
- source_word: ἀγαθῆς πράξεως
  choice: अच्छे आचरण
  rationale: एकवचन πρᾶξις यहाँ किसी एक अलग काम के साथ-साथ जीवन-व्यवहार या आचरण को भी सूचित कर सकता है। प्रसंग में ‘अच्छे आचरण’ स्वाभाविक है और निरंतर नैतिक व्यवहार का भाव देता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ὑπ’ ἄλλων
  choice: दूसरे लोग दें
  rationale: कर्ता-सूचक ὑπό के अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πατράσιν ἡμῶν τοῖς δικαίοις
  choice: हमारे धर्मी पूर्वजों
  rationale: πατέρες समुदाय के पहले के श्रद्धेय जनों को सूचित करता है; हिन्दी में ‘पूर्वज’ इस आशय को स्वाभाविक रूप से व्यक्त करता है, और δικαίοις के लिए ‘धर्मी’ उपयुक्त धार्मिक-नैतिक पद है।
theological_decisions:
- issue: τοῖς πατράσιν का दातृकारक संबंध
  choice: जैसे हमारे धर्मी पूर्वजों को दी गई थी
  alternative: जैसे हमारे धर्मी पूर्वजों के विषय में दी गई थी
  rationale: यूनानी पाठ में दातृकारक का औपचारिक संबंध बनाए रखा गया है और उसे ‘को’ से व्यक्त किया गया है। ‘के विषय में’ आशय को अधिक स्पष्ट करता, पर वह स्रोत में निहित संबंध की व्याख्या कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। आज्ञार्थक भाव के लिए ‘दें’ रखा गया है। ‘पितरों’ की अपेक्षा ‘पूर्वजों’ को चुना गया, क्योंकि यह सामान्य पाठक के लिए अधिक स्पष्ट है और किसी विशिष्ट पारिभाषिक धार्मिक अर्थ को अनावश्यक रूप से नहीं जोड़ता।
