source:
  edition: Funk 1901 (normalized OCR)
  text: Ἅγια οὖν μερὶς ὑπάρχοντες ποιήσωμεν τὰ τοῦ ἁγιασμοῦ πάντα, φεύγοντες καταλαλιάς, μιαράς τε καὶ ἀνάγνους συμπλοκὰς, μέθας τε καὶ νεωτεροποιΐας καὶ βδελυκτὰς ἐπιθυμίας, μυσερὰν μοιχείαν, βδελυκτὴν ὑπερηφανίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/001.yaml
  text: Therefore, since we are a holy portion, let us do all the things that belong to sanctification, fleeing slanders, foul and unclean entanglements, drunkenness and seditions, and detestable desires, loathsome adultery, detestable pride.
translation:
  language: hi
  text: अतः, एक पवित्र भाग होने के कारण, हम पवित्रीकरण से संबंधित सब कुछ करें—निंदाओं, घिनौने और अशुद्ध संसर्गों, मदिरा-जनित मदहोशियों और उपद्रवों[a], घृणित अभिलाषाओं, जुगुप्सित व्यभिचार, घृणित घमंड से दूर भागते हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उपद्रवों” का अनुवाद “विद्रोही गतिविधियों” या “व्यवस्था-विरोधी नई चालों” भी हो सकता है।
    reason: यूनानी νεωτεροποιΐας स्थापित व्यवस्था के विरुद्ध नई गतिविधियों, अशांति, उपद्रव या विद्रोही कार्रवाइयों का संकेत दे सकता है।
lexical_decisions:
- source_word: Ἅγια ... μερὶς
  choice: पवित्र भाग
  rationale: यूनानी में सामूहिक पहचान बताने वाला एकवचन पदबंध है; ‘पवित्र भाग’ उसके रूपक और वचन को बनाए रखता है।
- source_word: ἁγιασμοῦ
  choice: पवित्रीकरण
  rationale: यह केवल नैतिक ‘पवित्रता’ नहीं, पवित्र बनाए जाने अथवा पवित्र जीवन की प्रक्रिया का भाव भी रख सकता है; ‘पवित्रीकरण’ इस अर्थ-तनाव को सुरक्षित रखता है।
- source_word: καταλαλιάς
  choice: निंदा की बातों
  rationale: बहुवचन रूप और दूसरों के विरुद्ध बुरा बोलने के अर्थ, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μιαράς τε καὶ ἀνάγνους συμπλοκὰς
  choice: घिनौने और अशुद्ध संबंधों
  rationale: συμπλοκή में उलझाव, संसर्ग या यौन संबंध का संकेत हो सकता है; ‘संबंध’ प्रसंगानुकूल है और अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: μέθας
  choice: मतवालेपन
  rationale: यह मदिरापान से उत्पन्न नशे और मदहोशी की दशा को बताता है; हिन्दी में सहज सामूहिक संज्ञा चुनी गई है।
- source_word: νεωτεροποιΐας
  choice: विद्रोहों
  rationale: शब्द स्थापित व्यवस्था के विरुद्ध नवीन उपद्रव या राजद्रोही गतिविधि का बोध देता है; संक्षिप्त मुख्य-पाठ विकल्प के साथ पादटिप्पणी में व्यापक अर्थ दिया गया है।
- source_word: βδελυκτὰς ... βδελυκτὴν
  choice: घृणित ... घृणित
  rationale: मूल में अभिलाषाओं और घमंड के लिए एक ही विशेषण दोहराया गया है; हिन्दी में भी यह आलंकारिक पुनरावृत्ति रखी गई है।
- source_word: μυσερὰν μοιχείαν
  choice: जुगुप्सित व्यभिचार
  rationale: μυσερός की तीव्र घृणा जगाने वाली शक्ति और μοιχεία का ‘व्यभिचार’ अर्थ स्पष्ट रूप से व्यक्त होता है।
theological_decisions:
- issue: ‘पवित्रीकरण’ का अर्थ
  choice: ‘जो पवित्रीकरण से जुड़े हैं’
  alternative: ‘जो पवित्रता के योग्य हैं’
  rationale: यूनानी संबंधसूचक वाक्यांश τὰ τοῦ ἁγιασμοῦ को किसी निश्चित धर्मवैज्ञानिक सिद्धांत में सीमित किए बिना उसके प्रक्रिया और आचरण—दोनों संभावित आयामों सहित रखा गया है।
- issue: ‘पवित्र भाग’ की सामूहिक पहचान
  choice: एक समुदाय के रूप में ‘पवित्र भाग’
  alternative: ‘पवित्र लोग’
  rationale: मूल का ‘भाग/अंश’ रूपक महत्त्वपूर्ण है; उसे सामान्यीकृत करके केवल ‘लोग’ कहना पाठ की सामूहिक और संभवतः वाचा-संबंधी छवि को खो देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज उपदेशात्मक स्वर रखा गया है। निषेध-सूची में मूल के संयोजनों और अंतिम असंयोजित पदक्रम को यथासंभव सुरक्षित रखा गया है; इसी कारण अंतिम ‘घृणित घमंड’ से पहले ‘और’ नहीं जोड़ा गया।
