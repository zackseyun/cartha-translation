base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/003.yaml
  text: Let us therefore cling to those to whom grace has been given from God. Let us clothe ourselves with concord, being humble-minded and self-controlled, keeping ourselves far from every whispering and slander, being justified by works and not by words.
translation:
  language: hi
  text: इसलिए आओ, हम उनसे जुड़ें जिन्हें परमेश्वर की ओर से अनुग्रह दिया गया है। हम विनम्र मन के और संयमी होकर एकता को पहन लें; अपने आप को हर कानाफूसी और निंदा से दूर रखते हुए, बातों से नहीं बल्कि कामों से धर्मी ठहराए जाते हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κολληθῶμεν
  choice: हम ... से जुड़े रहें
  rationale: क्रिया का अर्थ दृढ़ता से लगना या जुड़े रहना है; यह स्वाभाविक हिन्दी में उसके निरंतर और घनिष्ठ संबंध के भाव को रखता है।
- source_word: χάρις
  choice: अनुग्रह
  rationale: यह θεοῦ से मिलने वाली कृपा/अनुकम्पा के धार्मिक अर्थ को संक्षिप्त और प्रतिष्ठित हिन्दी में व्यक्त करता है।
- source_word: ὁμόνοιαν
  choice: मेल-मिलाप
  rationale: यह एकमतता, सामंजस्य और परस्पर सौहार्द का व्यावहारिक भाव देता है; केवल बौद्धिक 'एकमतता' से अधिक व्यापक है।
- source_word: ταπεινοφρονοῦντες
  choice: दीन मन ... रखते हुए
  rationale: मूल में विनम्र मनोवृत्ति है; 'दीन मन' इस नैतिक गुण को सहज, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐγκρατευόμενοι
  choice: संयम रखते हुए
  rationale: आत्म-संयम या इच्छाओं पर नियंत्रण का सामान्य अर्थ सुरक्षित रहता है।
- source_word: ψιθυρισμοῦ
  choice: कानाफूसी
  rationale: यह गुप्त बड़बड़ाहट, चुगली या असंतोषपूर्ण फुसफुसाहट के भाव को निकटता से व्यक्त करता है।
- source_word: καταλαλιᾶς
  choice: निंदा
  rationale: दूसरों के विरुद्ध अपमानजनक या बदनाम करने वाली वाणी का अर्थ देता है।
- source_word: δικαιούμενοι
  choice: धर्मी ठहरें
  rationale: ग्रीक के न्यायिक/मूल्यांकनात्मक भाव को बनाए रखता है और इसे केवल 'अच्छे सिद्ध हों' तक सीमित नहीं करता।
theological_decisions:
- issue: ἔργοις δικαιούμενοι का अर्थ
  choice: कामों से धर्मी ठहरें
  alternative: कामों से धर्मी सिद्ध हों
  rationale: δικαιόω की वास्तविक धार्मिक और न्यायिक तीक्ष्णता को सुरक्षित रखा गया है। पाठ स्वयं परमेश्वर के अंतिम न्याय, समुदाय की मान्यता, या आचरण द्वारा दावे की पुष्टि के बीच स्पष्ट चुनाव नहीं करता; अनुवाद इस तनाव को नहीं सुलझाता।
- issue: χάρις का स्वरूप
  choice: परमेश्वर की ओर से अनुग्रह दिया गया है
  alternative: परमेश्वर ने कृपा प्रदान की है
  rationale: दिव्य स्रोत और दिए जाने की निष्क्रिय रचना दोनों रखे गए हैं, बिना अनुग्रह के स्वरूप या साधन को अतिरिक्त रूप से परिभाषित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध। समानांतर उपदेशात्मक क्रियाओं और वस्त्र पहनने के रूपक को रखा गया है। 'कामों से धर्मी ठहरें' को जानबूझकर व्याख्यात्मक नरमी के बिना रखा गया है।
