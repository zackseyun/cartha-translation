  yaml_path: translation/extra_canonical/1_clement/030/006.yaml
  text: Let our praise be in God and not from ourselves, for God hates those who praise themselves.
translation:
  language: hi
  text: हमारी प्रशंसा परमेश्वर में हो, न कि हमारी अपनी ओर से; क्योंकि परमेश्वर अपनी प्रशंसा आप करने वालों से घृणा करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔπαινος ἡμῶν
  choice: हमारी प्रशंसा
  rationale: मूल के ‘हमारी प्रशंसा’ को बनाए रखता है; प्रसंगतः इसका अर्थ वह प्रशंसा या गौरव है जिसका आधार परमेश्वर हो।
- source_word: ἐν θεῷ
  choice: परमेश्वर में
  rationale: ἐν के जानबूझकर व्यापक संबंध को सुरक्षित रखता है—प्रशंसा का आधार, क्षेत्र या केंद्र परमेश्वर है—बिना इसे केवल ‘परमेश्वर की ओर से’ तक सीमित किए।
- source_word: μὴ ἐξ αὐτῶν
  choice: स्वयं अपनी ओर से नहीं
  rationale: ἐξ का स्रोत-संबंध व्यक्त करता है और αὐτῶν का आत्म-संदर्भ स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: αὐτεπανέτους
  choice: अपनी प्रशंसा आप करनेवालों
  rationale: इस दुर्लभ संयुक्त शब्द का अर्थ आत्म-प्रशंसक है; यह हिन्दी रूप अर्थ को स्पष्ट और सटीक ढंग से व्यक्त करता है।
- source_word: μισεῖ
  choice: घृणा करता है
  rationale: यूनानी क्रिया के प्रबल और सीधे अर्थ को नरम किए बिना सुरक्षित रखता है।
theological_decisions:
- issue: प्रशंसा का परमेश्वर ‘में’ होना
  choice: परमेश्वर में
  alternative: परमेश्वर की ओर से
  rationale: मूल ἐν θεῷ कहता है, जबकि अगला वाक्यांश ἐξ (‘से/की ओर से’) प्रयोग करता है। दोनों पूर्वसर्गों का अंतर बनाए रखने से मूल की अर्थगत व्यापकता और तनाव सुरक्षित रहता है।
- issue: परमेश्वर का आत्म-प्रशंसकों के प्रति भाव
  choice: घृणा करता है
  alternative: पसंद नहीं करता
  rationale: मूल μισεῖ की तीव्रता को बनाए रखा गया है; इसे हल्का करना स्रोत के नैतिक कथन को कमजोर करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली। ‘अपनी प्रशंसा आप’ स्वाभाविक हिन्दी मुहावरा है और आत्म-प्रशंसा के अर्थ को ठीक व्यक्त करता है।
