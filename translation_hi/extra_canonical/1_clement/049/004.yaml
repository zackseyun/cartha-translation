translation:
  language: hi
  text: जिस ऊँचाई तक प्रेम ले जाता है, उसका वर्णन नहीं किया जा सकता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ὕψος
  choice: जिस ऊँचाई तक
  rationale: ‘ऊँचाई’ मूल रूपक को बनाए रखता है; संबंधवाचक रचना εἰς ὃ के साथ स्वाभाविक हिन्दी देती है।
- source_word: ἀνάγει
  choice: ले जाता है
  rationale: क्रिया का अर्थ ऊपर की ओर ले जाना या पहुँचाना है। ‘ले जाता है’ मूल में अनुपस्थित ‘हमें’ जोड़े बिना लक्ष्य तक नेतृत्व का भाव व्यक्त करता है।
- source_word: ἡ ἀγάπη
  choice: प्रेम
  rationale: यह सामान्य, गरिमापूर्ण और व्यापक हिन्दी शब्द है, जो यहाँ ἀγάπη के अर्थ को किसी संप्रदायगत व्याख्या तक सीमित नहीं करता।
- source_word: ἀνεκδιήγητόν ἐστιν
  choice: उसका वर्णन नहीं किया जा सकता
  rationale: यह अकथनीयता को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἀνάγει में निहित कर्म
  choice: कोई कर्म, जैसे ‘हमें’, नहीं जोड़ा गया
  alternative: जिस ऊँचाई तक प्रेम हमें उठा ले जाता है
  rationale: यूनानी पाठ में कर्म स्पष्ट नहीं है; उसे अनकहा रखकर मूल की व्याकरणिक खुलावट सुरक्षित रहती है।
- issue: ‘ऊँचाई’ के रूपक की व्याख्या
  choice: रूपक को बिना विस्तार के बनाए रखा गया
  alternative: प्रेम जिस सर्वोच्च आत्मिक दशा तक पहुँचाता है
  rationale: मूल पाठ ‘ऊँचाई’ का आशय नहीं खोलता; आत्मिक या नैतिक अर्थ स्पष्ट रूप से जोड़ना अनावश्यक व्याख्या होती।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। मूल यूनानी की रूपकात्मकता और अकथनीयता दोनों सुरक्षित रखी गई हैं।
