source:
  edition: Funk 1901 (normalized OCR)
  text: ἐν ἀγάπῃ προσελάβετο ἡμᾶς ὁ δεσπότης· διὰ τὴν ἀγάπην, ἣν ἔσχεν πρὸς ἡμᾶς, τὸ αἷμα αὐτοῦ ἔδωκεν ὑπὲρ ἡμῶν Ἰησοῦς Χριστὸς ὁ κύριος ἡμῶν ἐν θελήματι θεοῦ, καὶ τὴν σάρκα ὑπὲρ τῆς σαρκὸς ἡμῶν καὶ τὴν ψυχὴν ὑπὲρ τῶν ψυχῶν ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/049/006.yaml
  text: In love the Master received us; because of the love that he had toward us[a], Jesus Messiah our Lord gave his blood for us by the will of God, and his flesh for our flesh and his life for our lives.
translation:
  language: hi
  text: प्रेम में स्वामी ने हमें अपना लिया। हमारे प्रति अपने प्रेम के कारण हमारे प्रभु यीशु मसीह ने परमेश्वर की इच्छा के अनुसार हमारे लिए अपना रक्त दे दिया—अपनी देह हमारी देह के लिए और अपना प्राण हमारे प्राणों के लिए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी आत्मा हमारी आत्माओं के लिए”; यहाँ ‘प्राण’ के लिए प्रयुक्त यूनानी शब्द का अर्थ ‘आत्मा’ या ‘जीवन’ भी हो सकता है।
    reason: ψυχή के ‘आत्मा’ और ‘जीवन’ सम्बन्धी अर्थ-क्षेत्र को दर्शाता है, जबकि मुख्य पाठ में देह–प्राण की समानांतरता बनी रहती है।
lexical_decisions:
- source_word: ἐν ἀγάπῃ
  choice: प्रेम में
  rationale: मूल के संक्षिप्त और बलयुक्त वाक्यांश को बनाए रखता है; प्रेम को स्वामी द्वारा स्वीकार किए जाने का क्षेत्र और ढंग दोनों रहने देता है।
- source_word: προσελάβετο
  choice: अपना लिया
  rationale: सिर्फ औपचारिक रूप से ‘स्वीकार किया’ नहीं, बल्कि अपने पास ग्रहण करने और अपनाने का भाव व्यक्त करता है।
- source_word: ὁ δεσπότης
  choice: स्वामी
  rationale: δεσπότης के अधिकार और प्रभुत्व को सहज, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: Ἰησοῦς Χριστὸς
  choice: यीशु मसीह
  rationale: Χριστός को उसके पदनाम-संबंधी अर्थ ‘मसीह’ के रूप में प्रस्तुत करता है, न कि केवल ध्वन्यात्मक रूप में।
- source_word: ἐν θελήματι θεοῦ
  choice: परमेश्वर की इच्छा के अनुसार
  rationale: हिन्दी में स्वाभाविक रूप से यह बताता है कि आत्म-बलिदान परमेश्वर की इच्छा के अनुरूप हुआ।
- source_word: σάρκα
  choice: देह
  rationale: शारीरिक अस्तित्व का स्पष्ट संकेत देता है और अगले समांतर पद ‘प्राण’ के साथ मूल की अलंकारिक जोड़ी बनाए रखता है।
- source_word: ψυχὴν / ψυχῶν
  choice: प्राण / प्राणों
  rationale: ψυχή की ‘जीवन’ और ‘आत्मा’ दोनों अर्थ-छायाओं को समेटने वाला स्वाभाविक हिन्दी शब्द है तथा एकवचन-बहुवचन और ‘देह के बदले देह’ की समानांतर रचना सुरक्षित रखता है।
theological_decisions:
- issue: ὑπέρ का बलिदानी संबंध
  choice: हमारे लिए; हमारी देह के बदले…हमारे प्राणों के बदले
  alternative: हमारी ओर से / हमारे स्थान पर
  rationale: पहले प्रयोग में लाभार्थी अथवा प्रतिनिधिक अर्थ को अनावश्यक रूप से सीमित नहीं किया गया; बाद की स्पष्ट समानांतर रचना में ‘के बदले’ मूल के विनिमयात्मक बल को व्यक्त करता है।
- issue: ψυχή का मानवशास्त्रीय अर्थ
  choice: प्राण
  alternative: आत्मा या जीवन
  rationale: ‘प्राण’ जीवन और आत्मा के बीच मूल की अर्थगत व्यापकता को बनाए रखता है, जबकि देह–प्राण की जानबूझकर बनाई गई समरूपता भी स्पष्ट रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण पर सहज रखी गई है। ‘रक्त’, ‘देह’ और ‘प्राण’ मूल की बलिदानी तथा काव्यात्मक समानांतरता को बनाए रखते हैं।
