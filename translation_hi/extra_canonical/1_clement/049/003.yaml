  yaml_path: translation/extra_canonical/1_clement/049/003.yaml
  text: Who is sufficient to declare the majesty of his beauty?[a]
translation:
  language: hi
  text: उसकी सुंदरता के वैभव का वर्णन करने में कौन समर्थ है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी सुंदरता की महानता को पूरी तरह कौन बता सकता है?”
    reason: μεγαλεῖον को ‘महानता’ और ἐξειπεῖν को ‘पूरी तरह बताना’ भी अनूदित किया जा सकता है।
lexical_decisions:
- source_word: μεγαλεῖον
  choice: वैभव
  rationale: यह शब्द साधारण ‘महानता’ से बढ़कर भव्यता, महिमा या उत्कर्ष का भाव देता है; ‘वैभव’ इस अलंकृत प्रश्न की गरिमा बनाए रखता है।
- source_word: καλλονῆς
  choice: सुंदरता
  rationale: यह सौंदर्य या मनोहरता को व्यक्त करता है; आधुनिक हिन्दी में ‘सुंदरता’ स्वाभाविक और स्पष्ट है।
- source_word: ἐξειπεῖν
  choice: वर्णन करने
  rationale: क्रिया का अर्थ पूरी तरह कह सुनाना, व्यक्त करना या घोषित करना है। इस प्रसंग में ‘वर्णन करना’ उस सुंदरता के वैभव को वाणी में व्यक्त करने की असमर्थता को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: ἀρκετὸς
  choice: समर्थ
  rationale: यहाँ अर्थ किसी कार्य के लिए पर्याप्त या योग्य होने का है; हिन्दी के आलंकारिक प्रश्न में ‘समर्थ’ उपयुक्त है।
- source_word: αὐτοῦ
  choice: उसकी
  rationale: यूनानी सर्वनाम पुल्लिंग एकवचन है, पर हिन्दी ‘उसकी’ निकटवर्ती संदर्भ की कुछ अस्पष्टता को बनाए रखते हुए ‘सुंदरता’ के साथ स्वाभाविक रूप से जुड़ता है।
theological_decisions:
- issue: αὐτοῦ का संदर्भ
  choice: ‘उसकी’ द्वारा संदर्भ को अनिर्दिष्ट रखना
  alternative: ‘उसकी’ को व्याख्यात्मक रूप से ‘उसके प्रेम की’ या किसी स्पष्ट नाम से बदलना
  rationale: इस एक वाक्य में सर्वनाम का संदर्भ पूर्णतः स्पष्ट नहीं है। मूल की वास्तविक संदर्भगत अस्पष्टता को बनाए रखना किसी विशिष्ट धर्मवैचारिक पहचान को आरोपित करने से बेहतर है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वैभव’ मूल के ऊँचे आलंकारिक स्वर को व्यक्त करता है, जबकि प्रश्नवाचक संरचना यूनानी वाक्य की भावात्मक शक्ति बनाए रखती है।
