- source_word: ἀγάπης τοῦ θεοῦ
  choice: परमेश्वर के प्रेम
  rationale: यह यूनानी संबंधकारक की वास्तविक अस्पष्टता बनाए रखता है—अर्थ परमेश्वर का प्रेम अथवा परमेश्वर के प्रति प्रेम हो सकता है।
- source_word: ἐξηγήσασθαι
  choice: वर्णन करना
  rationale: संदर्भ की अलंकारिक प्रशंसा और आगे आने वाली कथन-वर्णन संबंधी शब्दावली के अनुरूप; ‘समझाना’ भी संभव है।
