source:
  edition: Funk 1901 (normalized OCR)
  text: ἀγάπη κολλᾷ ἡμᾶς τῷ θεῷ, ἀγάπη καλύπτει πλῆθος ἁμαρτιῶν, ἀγάπη πάντα ἀνέχεται, πάντα μακροθυμεῖ· οὐδὲν βάναυσον ἐν ἀγάπῃ, οὐδὲν ὑπερήφανον· ἀγάπη σχίσμα οὐκ ἔχει, ἀγάπη οὐ στασιάζει, ἀγάπη πάντα ποιεῖ ἐν ὁμονοίᾳ· ἐν τῇ ἀγάπῃ ἐτελειώθησαν πάντες ἐκλεκτοὶ τοῦ θεοῦ, δίχα ἀγάπης οὐδὲν εὐάρεστόν ἐστιν τῷ θεῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/049/005.yaml
  text: Love joins us to God; love covers a multitude of sins; love endures all things, is patient in all things. There is nothing coarse in love, nothing arrogant. Love has no schism; love does not stir up faction; love does all things in concord. In love all the elect of God were made complete; apart from love, nothing is pleasing to God.
translation:
  language: hi
  text: प्रेम हमें परमेश्वर से जोड़ता है; प्रेम असंख्य पापों को ढक देता है; प्रेम सब कुछ सह लेता है, सब बातों में धीरज रखता है। प्रेम में कोई नीचता नहीं, कोई घमंड नहीं। प्रेम में फूट नहीं होती; प्रेम गुटबाज़ी नहीं करता; प्रेम सब कुछ एकमत होकर करता है। प्रेम में परमेश्वर के सभी चुने हुए लोग पूर्ण किए गए; प्रेम के बिना कोई भी बात परमेश्वर को प्रसन्न नहीं करती।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγάπη
  choice: प्रेम
  rationale: यह सामान्य, गरिमापूर्ण और व्यापक हिन्दी शब्द है, जो यूनानी शब्द की निष्ठावान और आत्मसमर्पित प्रेम की धारणा को किसी संप्रदायगत विशेष अर्थ तक सीमित नहीं करता।
- source_word: κολλᾷ
  choice: जोड़ता है
  rationale: क्रिया का मूल अर्थ चिपकाने या निकटता से जोड़ने का है; स्वाभाविक हिन्दी में ‘जोड़ता है’ परमेश्वर के साथ गहरे संबंध को स्पष्ट रखता है।
- source_word: καλύπτει πλῆθος ἁμαρτιῶν
  choice: असंख्य पापों को ढक देता है
  rationale: ‘ढक देता है’ मूल रूपक को बनाए रखता है और ‘असंख्य’ πλῆθος की बड़ी संख्या का सहज हिन्दी रूप है।
- source_word: πάντα ἀνέχεται
  choice: सब कुछ सह लेता है
  rationale: ἀνέχομαι का सहन करने का अर्थ सीधे और स्वाभाविक रूप में व्यक्त होता है।
- source_word: πάντα μακροθυμεῖ
  choice: हर बात में धीरज रखता है
  rationale: μακροθυμέω दीर्घ-सहनशीलता और धैर्य को दर्शाता है; यह अनुवाद πάντα की व्यापकता भी सुरक्षित रखता है।
- source_word: βάναυσον
  choice: ओछा
  rationale: यहाँ शब्द नीच, अभद्र या अनुदार आचरण का भाव देता है; ‘ओछा’ आधुनिक हिन्दी में संक्षिप्त और बोधगम्य है।
- source_word: σχίσμα
  choice: फूट
  rationale: यह विभाजन या दरार का सामान्य अर्थ रखता है और बाद के तकनीकी कलीसियाई अर्थ को अनावश्यक रूप से नहीं थोपता।
- source_word: στασιάζει
  choice: गुटबाज़ी नहीं करता
  rationale: क्रिया दल या विद्रोही गुट खड़ा करने और आपसी संघर्ष भड़काने का भाव देती है; ‘गुटबाज़ी’ इसे सहज आधुनिक हिन्दी में व्यक्त करती है।
- source_word: ἐν ὁμονοίᾳ
  choice: एकमत होकर
  rationale: ὁμόνοια मनों की एकता और मेल को दर्शाता है; क्रियाविशेषणीय हिन्दी रूप वाक्य में स्वाभाविक है।
- source_word: ἐτελειώθησαν
  choice: सिद्ध किए गए
  rationale: निष्क्रिय क्रिया पूर्णता तक पहुँचाए जाने का भाव रखती है; ‘सिद्ध किए गए’ उस निष्क्रियता और धार्मिक गहराई दोनों को सुरक्षित रखता है।
- source_word: ἐκλεκτοὶ τοῦ θεοῦ
  choice: परमेश्वर के सभी चुने हुए लोग
  rationale: ‘चुने हुए लोग’ सामान्य पाठक के लिए स्पष्ट है और चयन के स्वर को बिना अतिरिक्त धर्मसैद्धांतिक व्याख्या के बनाए रखता है।
- source_word: εὐάρεστόν
  choice: प्रसन्न करती
  rationale: परमेश्वर को स्वीकार्य अथवा मनभावन होने का अर्थ स्वाभाविक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: पापों को ‘ढकने’ का अर्थ
  choice: मूल रूपक ‘पापों को ढक देता है’ बनाए रखा गया।
  alternative: ‘पापों को क्षमा कर देता है’ या ‘उनकी अनदेखी करता है।’
  rationale: मूल पाठ क्षमा के कर्ता या प्रक्रिया को स्पष्ट नहीं करता; ‘ढकना’ जानबूझकर खुला रूपक है, इसलिए उसे किसी निश्चित प्रायश्चित-सिद्धांत में नहीं बदला गया।
- issue: परमेश्वर के चुने हुओं का प्रेम में सिद्ध किया जाना
  choice: निष्क्रिय रूप ‘सिद्ध किए गए’ रखा गया।
  alternative: ‘सिद्ध हो गए’ या ‘परिपक्व बने।’
  rationale: यूनानी निष्क्रिय रूप पूर्ण किए जाने की संभावना खुली रखता है; कर्ता को स्पष्ट रूप से परमेश्वर बताना भी पाठ से आगे जाना होता।
- issue: ‘प्रेम के बिना कुछ भी प्रसन्न नहीं’ की व्यापकता
  choice: ‘कोई भी बात परमेश्वर को प्रसन्न नहीं करती’ रखा गया।
  alternative: इसे केवल धार्मिक कर्मों या व्यक्तियों तक सीमित करना।
  rationale: οὐδὲν व्यापक और अनिर्दिष्ट है; अनुवाद उसी पूर्ण दावे को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। मूल की आवृत्तिमूलक अलंकार-रचना बनाए रखने के लिए हर खंड में ‘प्रेम’ दोहराया गया है। अर्धविरामों से यूनानी वाक्य की लय और विचार-खंड सुरक्षित रखे गए हैं।
