  text: Whoever has love in the Messiah, let him do the Messiah’s commandments.
translation:
  language: hi
  text: जो मसीह में प्रेम रखता है, वह मसीह की आज्ञाओं का पालन करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ἔχων
  choice: जिसमें … है
  rationale: यूनानी कृदंत वाक्यांश का स्वाभाविक हिन्दी रूप; यह उस व्यक्ति की ओर संकेत करता है जिसके भीतर यह प्रेम विद्यमान है।
- source_word: ἀγάπην ἐν Χριστῷ
  choice: मसीह में प्रेम
  rationale: ἐν Χριστῷ को सीधे ‘मसीह में’ रखा गया है, ताकि मसीह से जुड़े अथवा उनके क्षेत्र में स्थित प्रेम की मूल अभिव्यक्ति की व्यापकता बनी रहे।
- source_word: ποιησάτω
  choice: पालन करे
  rationale: आज्ञाओं के साथ हिन्दी में ‘पालन करना’ स्वाभाविक है और तृतीय पुरुष आज्ञार्थक भाव को ‘करे’ सुरक्षित रखता है।
- source_word: τὰ τοῦ Χριστοῦ παραγγέλματα
  choice: मसीह की आज्ञाओं
  rationale: παραγγέλματα निर्देशों अथवा आदेशों को दर्शाता है; ‘आज्ञाएँ’ संक्षिप्त, प्रतिष्ठित और सामान्य पाठक के लिए स्पष्ट है।
theological_decisions:
- issue: ἐν Χριστῷ का संबंध
  choice: ‘मसीह में प्रेम’—पूर्वसर्गीय पद को प्रेम के साथ रखा गया
  alternative: ‘जो मसीह में है और प्रेम रखता है’ अथवा ‘मसीह के प्रति प्रेम’
  rationale: यूनानी शब्दक्रम में ἐν Χριστῷ सीधे ἀγάπην के बाद है। ‘मसीह के प्रति’ संबंध की दिशा को अनावश्यक रूप से निश्चित कर देता, जबकि ‘जो मसीह में है’ व्याकरणिक संबंध को बदल देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और उपदेशात्मक शैली। ‘वह … करे’ से मूल यूनानी के तृतीय पुरुष आज्ञार्थक भाव को स्वाभाविक रूप दिया गया है।
