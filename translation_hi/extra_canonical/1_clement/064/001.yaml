source:
  edition: Funk 1901 (normalized OCR)
  text: Λοιπὸν ὁ παντεπόπτης θεὸς καὶ δεσπότης τῶν πνευμάτων καὶ κύριος πάσης σαρκός, ὁ ἐκλεξάμενος τὸν κύριον Ἰησοῦν Χριστὸν καὶ ἡμᾶς διʼ αὐτοῦ εἰς λαὸν περιούσιον, δῴη πάσῃ ψυχῇ ἐπικεκλημένῃ τὸ μεγαλοπρεπὲς καὶ ἅγιον ὄνομα αὐτοῦ πίστιν, φόβον, εἰρήνην, ὑπομονὴν καὶ μακροθυμίαν, ἐγκράτειαν, ἁγνείαν καὶ σωφροσύνην, εἰς εὐαρέστησιν τῷ ὀνόματι αὐτοῦ διὰ τοῦ ἀρχιερέως καὶ προστάτου ἡμῶν Ἰησοῦ Χριστοῦ, διʼ οὗ αὐτῷ δόξα καὶ μεγαλωσύνη, κράτος καὶ τιμή, καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/064/001.yaml
  text: Finally, may the all-seeing God and Master of spirits and Lord of all flesh, who chose the Lord Jesus Messiah and us through him to be a people for his own possession, grant to every soul that has been called by his magnificent and holy name faith, fear, peace, endurance and longsuffering, self-control, purity, and sound judgment, so as to be pleasing to his name through our high priest and protector Jesus Messiah, through whom be glory and majesty to him, might and honor, both now and through all the ages of ages. Amen.
translation:
  language: hi
  text: अन्त में, सब कुछ देखनेवाला परमेश्वर, जो आत्माओं का स्वामी और समस्त देहधारियों का प्रभु है, जिसने प्रभु यीशु मसीह को चुना और उसके द्वारा हमें अपनी निज प्रजा होने के लिए चुना, वह हर उस व्यक्ति को, जो उसके प्रतापी और पवित्र नाम से बुलाया गया है, विश्वास, भय, शान्ति, धीरज और सहनशीलता, आत्म-संयम, शुद्धता और विवेक प्रदान करे, ताकि वह हमारे महायाजक और संरक्षक यीशु मसीह के द्वारा उसके नाम को प्रिय हो सके। उसी के द्वारा परमेश्वर को महिमा और प्रताप, सामर्थ्य और आदर, अभी और युगानुयुग हो। आमीन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λοιπὸν
  choice: अन्त में
  rationale: यहाँ समापन की प्रार्थना आरम्भ होती है; इसलिए प्रसंगानुसार स्वाभाविक हिन्दी।
- source_word: παντεπόπτης
  choice: सब कुछ देखनेवाला
  rationale: यूनानी विशेषण का पारदर्शी और सहज अर्थ, जो परमेश्वर की सर्वदर्शिता व्यक्त करता है।
- source_word: δεσπότης τῶν πνευμάτων
  choice: आत्माओं का स्वामी
  rationale: δεσπότης के अधिकारपूर्ण अर्थ को ‘स्वामी’ और πνεύματα को बिना अनावश्यक व्याख्या के ‘आत्माएँ’ रखा गया।
- source_word: κύριος πάσης σαρκός
  choice: समस्त प्राणियों का प्रभु
  rationale: शाब्दिक ‘समस्त देह’ हिन्दी में अस्वाभाविक हो सकता है; बाइबिलीय मुहावरे का आशय सभी नश्वर जीवित मनुष्यों/प्राणियों पर प्रभुता है।
- source_word: λαὸν περιούσιον
  choice: अपनी निज प्रजा
  rationale: विशेष स्वामित्व और बहुमूल्य अधिकार के भाव को संक्षेप में सुरक्षित रखता है।
- source_word: ψυχῇ
  choice: व्यक्ति
  rationale: ‘हर आत्मा’ की तुलना में आधुनिक हिन्दी में मनुष्य को सूचित करने वाला स्वाभाविक प्रयोग।
- source_word: μακροθυμίαν
  choice: सहनशीलता
  rationale: दीर्घकाल तक धैर्य रखने, विशेषतः लोगों के प्रति सहने, का भाव; निकटवर्ती ὑπομονή से कुछ भेद बनाए रखता है।
- source_word: σωφροσύνην
  choice: विवेक
  rationale: संयत और स्वस्थ निर्णय-बुद्धि का व्यापक अर्थ देता है तथा ἐγκράτεια से अनावश्यक पुनरुक्ति टालता है।
- source_word: προστάτου
  choice: सहायक
  rationale: रक्षक, पक्षधर या सहायक के अर्थों वाला शब्द; ‘सहायक’ यहाँ व्यापक और अनावश्यक विधिक विशिष्टता से मुक्त है।
- source_word: εἰς πάντας τοὺς αἰῶνας τῶν αἰώνων
  choice: युगानुयुग
  rationale: दीर्घ यूनानी स्तुतिवाक्य का स्थापित, स्वाभाविक और अर्थ-संगत हिन्दी रूप।
theological_decisions:
- issue: ὁ ἐκλεξάμενος के अन्तर्गत मसीह और समुदाय का चुनाव
  choice: जिसने प्रभु यीशु मसीह को चुना और उसके द्वारा हमें ... चुना
  alternative: जिसने प्रभु यीशु मसीह और उसके द्वारा हमें चुना
  rationale: यूनानी रचना में मसीह प्रत्यक्ष कर्म है और ‘हमें’ δι’ αὐτοῦ से जुड़ा है; हिन्दी में क्रिया दोहराने से यह सम्बन्ध स्पष्ट रहता है, बिना चुनाव की प्रकृति समझाए।
- issue: εἰς εὐαρέστησιν τῷ ὀνόματι αὐτοῦ
  choice: ताकि वह ... उसके नाम को प्रसन्न करे
  alternative: जिससे उसके नाम को प्रसन्नता हो
  rationale: मूल के ‘नाम को प्रसन्न करने’ वाले असामान्य धार्मिक वाक्यांश को बनाए रखा गया है; इसे चुपचाप ‘परमेश्वर को प्रसन्न करे’ में नहीं बदला गया।
- issue: διὰ τοῦ ἀρχιερέως καὶ προστάτου ἡμῶν
  choice: हमारे महायाजक और सहायक यीशु मसीह के द्वारा
  alternative: हमारे महायाजक और रक्षक यीशु मसीह के द्वारा
  rationale: मसीह की मध्यस्थ भूमिका को मूल के अनुसार रखा गया, पर προστάτης की सम्भावित विधिक या संरक्षक छाया को किसी एक संकीर्ण सिद्धान्त में नहीं बाँधा गया।
- issue: अन्तिम स्तुतिवाक्य में αὐτῷ का निर्देश
  choice: उसी के द्वारा परमेश्वर की महिमा ... होता रहे
  alternative: उसी के द्वारा उसकी महिमा ... होती रहे
  rationale: ‘उसी के द्वारा’ यीशु मसीह की ओर और αὐτῷ परमेश्वर की ओर संकेत करता है; हिन्दी में अस्पष्ट सर्वनाम से भ्रम हो सकता था, इसलिए सम्बन्ध स्पष्ट किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमामय प्रार्थनात्मक शैली। पारम्परिक ईसाई पद ‘प्रभु’, ‘मसीह’, ‘महायाजक’ और ‘आमीन’ बनाए गए हैं। वाक्य की मूल दीर्घ स्तुतिपरक गति को पठनीयता के लिए दो वाक्यों में बाँटा गया है।
