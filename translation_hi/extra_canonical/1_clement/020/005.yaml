  text: ἀβύσσων τε ἀνεξιχνίαστα καὶ νερτέρων ἀνεκδιήγητα κρίματα τὰς αὐτὰς συνέχεται προστάξεσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/005.yaml
  text: The unsearchable depths of the abysses and the indescribable regions below are held together by the same ordinances[a].
translation:
  language: hi
  text: अथाह गह्वरों की अगम बातें और अधोलोक के अवर्णनीय न्याय-निर्णय एक ही आदेशों के अधीन हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘एक ही आदेशों द्वारा थामे/बाँधे रखे जाते हैं।’
    reason: यूनानी συνέχεται में किसी आदेश के अधीन थामे, बाँधे, या नियंत्रित रखे जाने की अर्थ-छाया है; मुख्य पाठ का ‘अधीन हैं’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
lexical_decisions:
- source_word: ἀβύσσων … ἀνεξιχνίαστα
  choice: अथाह गर्तों की अगम गहराइयाँ
  rationale: ἀνεξιχνίαστα का अर्थ है जिसे खोजकर या नापकर पूरी तरह जाना न जा सके; ἀβύσσων के साथ प्राकृतिक हिन्दी में ‘अगम गहराइयाँ’ इस ब्रह्मांडीय चित्र को स्पष्ट रखता है।
- source_word: νερτέρων
  choice: अधोलोक
  rationale: यह नीचे स्थित लोकों या पातालगत क्षेत्र को सूचित करता है। ‘अधोलोक’ आधुनिक, संक्षिप्त और अपेक्षाकृत तटस्थ धार्मिक शब्द है।
- source_word: ἀνεκδιήγητα κρίματα
  choice: अवर्णनीय प्रदेश
  rationale: κρίματα का सामान्य अर्थ ‘न्याय-निर्णय’ है, पर यहाँ ἀβύσσων के समानांतर ब्रह्मांडीय स्थानों की चर्चा और अंग्रेज़ी परामर्श-पाठ ‘regions’ का समर्थन स्थानगत अर्थ के लिए है। चूँकि स्रोत-पाठ का शब्द असामान्य है, शाब्दिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ταῖς αὐταῖς … προστάξεσιν
  choice: उन्हीं आदेशों से
  rationale: προστάξεις अधिकारपूर्ण आदेशों या निर्धारित व्यवस्थाओं को दर्शाता है। ‘आदेश’ सरल और प्रसंगानुकूल है।
- source_word: συνέχεται
  choice: बँधे रहते हैं
  rationale: क्रिया यहाँ आदेशों द्वारा थामे, नियंत्रित या सीमा में रखे जाने का भाव दे सकती है। ‘बँधे रहते हैं’ इस नियंत्रण और स्थिर व्यवस्था—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: νερτέρων को नरक के रूप में विशेषीकृत करना
  choice: अधोलोक
  alternative: नरक
  rationale: यूनानी शब्द केवल नीचे के लोक/क्षेत्र को बताता है; ‘नरक’ दंड के विशिष्ट धर्मवैज्ञानिक अर्थ को अनावश्यक रूप से जोड़ सकता है।
- issue: συνέχεται में नियंत्रण बनाम आंतरिक एकता
  choice: बँधे रहते हैं
  alternative: एक साथ थामे रहते हैं / नियंत्रित रहते हैं
  rationale: प्रसंग सृष्टि के अंगों के एक ही दिव्य आदेशों के अधीन और अपनी सीमाओं में रहने पर बल देता है। चुना हुआ रूप दोनों संभावित छायाओं को पूरी तरह बंद किए बिना आज्ञाधीन व्यवस्था को सामने रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु ब्रह्मांडीय और उपासना-संबंधी प्रसंग के अनुरूप गरिमापूर्ण रखी गई है। ‘अथाह गर्त’, ‘अगम गहराइयाँ’ और ‘अधोलोक’ सामान्य पाठक के लिए बोधगम्य हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
