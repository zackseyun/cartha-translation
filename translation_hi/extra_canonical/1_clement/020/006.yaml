source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ χύτος τῆς ἀπείρου θαλάσσης κατὰ τὴν δημιουργίαν αὐτοῦ συσταθὲν εἰς τὰς συναγωγὰς οὐ παρεκβαίνει τὰ περιτεθειμένα αὐτῇ χείλη, ἀλλὰ καθὼς διετάξεν αὐτῇ, οὕτως ποιεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/006.yaml
  text: The mass of the boundless sea[a], gathered together according to his creation into its basins, does not pass beyond the bounds set around it, but as he commanded it, so it does.
translation:
  language: hi
  text: असीम समुद्र की जलराशि, उसकी रचना के अनुसार जलाशयों में इकट्ठी की गई, अपने चारों ओर ठहराई गई सीमाओं[a] को पार नहीं करती, बल्कि जैसा उसने उसे आदेश दिया है, वैसा ही करती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “किनारों” या “होंठों”।'
    reason: यूनानी χείλη का चित्रात्मक शाब्दिक अर्थ सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: χύτος
  choice: जलराशि
  rationale: यह शब्द यहाँ समुद्र के जल के विशाल समूह या विस्तार को दर्शाता है, पात्र या जलाशय को नहीं।
- source_word: ἀπείρου θαλάσσης
  choice: असीम समुद्र
  rationale: ἀπείρου का मूल भाव सीमा-रहित या अपरिमित होना है; ‘असीम’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: κατὰ τὴν δημιουργίαν αὐτοῦ
  choice: उसकी सृष्टि के अनुसार
  rationale: यह δημιουργία के ‘सृष्टि/रचना’ संबंधी अर्थ और κατὰ के ‘के अनुसार’ भाव को निकटता से बनाए रखता है।
- source_word: εἰς τὰς συναγωγάς
  choice: जलाशयों में
  rationale: संदर्भ में συναγωγαί वे स्थान या संग्रह हैं जिनमें समुद्र का जल इकट्ठा किया गया है; ‘जलाशय’ हिन्दी में अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: χείλη
  choice: सीमाओं
  rationale: शाब्दिक अर्थ ‘होंठ/किनारे’ है, पर समुद्र के चारों ओर निर्धारित हदों के लिए ‘सीमाएँ’ प्रसंगानुकूल है; रूपक को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: διετάξεν
  choice: आदेश दिया
  rationale: क्रिया में अधिकारपूर्वक निर्धारित या आज्ञापित करने का भाव है, जिसे ‘आदेश दिया’ स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: सृष्टि पर परमेश्वर की व्यवस्था और समुद्र की आज्ञाकारिता
  choice: कर्ता को सर्वनाम ‘उसने/उसकी’ से ही व्यक्त किया गया है
  alternative: स्पष्टता के लिए ‘परमेश्वर’ जोड़ना
  rationale: यूनानी पाठ इस पद में नाम नहीं दोहराता; सर्वनाम बनाए रखने से मूल की वाक्यगत निरंतरता और संकेतात्मकता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली रखी गई है। स्त्रीलिंग क्रियाएँ ‘जलराशि’ के अनुरूप हैं। लंबे यूनानी वाक्य को पठनीयता के लिए दो हिन्दी वाक्यों में बाँटा गया है, बिना उसके तर्क-संबंध को बदले।
