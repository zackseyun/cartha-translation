  yaml_path: translation/extra_canonical/1_clement/020/012.yaml
  text: to whom be the glory and the majesty forever and ever. Amen.
translation:
  language: hi
  text: उसी की महिमा और महानता युगानुयुग होती रहे। आमीन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δόξα
  choice: महिमा
  rationale: यह δόξα का स्वाभाविक, प्रतिष्ठित और व्यापक हिन्दी धार्मिक समतुल्य है।
- source_word: μεγαλωσύνη
  choice: महानता
  rationale: यह शब्द परमेश्वर की महान गरिमा और महत्ता को व्यक्त करता है; सरल आधुनिक हिन्दी में ‘महानता’ मूल अर्थ को स्पष्ट रखता है।
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: युगानुयुग
  rationale: यह यूनानी कालसूचक मुहावरे की अनंत निरंतरता को संक्षिप्त, dignified और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: ἀμήν
  choice: आमीन
  rationale: मूल से ग्रहण किया हुआ और हिन्दी मसीही प्रयोग में सर्वमान्य पुष्टिसूचक रूप।
theological_decisions:
- issue: दातृवाचक सम्बन्धवाचक सर्वनाम ᾧ का संदर्भ
  choice: उसी की
  alternative: जिसकी
  rationale: यह पद पिछले वाक्य के संदर्भित व्यक्ति की ओर लौटता है। स्वतंत्र हिन्दी वाक्यांश में ‘उसी की’ उस पूर्वसंदर्भ और बल को स्वाभाविक ढंग से बनाए रखता है, बिना संदर्भित व्यक्ति की पहचान को इस पद में जोड़कर अस्पष्टता मिटाए।
- issue: क्रियारहित आशीर्वचन/स्तुतिवचन
  choice: होती रहे
  alternative: है
  rationale: यूनानी में स्पष्ट क्रिया नहीं है। ‘होती रहे’ हिन्दी में ‘महिमा ... हो’ वाले कामनात्मक स्तुतिवचन को स्वाभाविक रूप देता है और अंग्रेज़ी consultation layer के ‘be’ से भी मेल रखता है; इसे वर्णनात्मक ‘है’ बनाकर तनाव को नहीं मिटाया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘उसी की’ पूर्ववर्ती संदर्भ को बनाए रखता है; ‘युगानुयुग’ पारंपरिक होते हुए भी सामान्य पाठक के लिए बोधगम्य है।
