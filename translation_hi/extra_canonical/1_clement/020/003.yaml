  text: ἥλιός τε καὶ σελήνη, ἀστέρων τε χοροὶ κατὰ τὴν διαταγὴν αὐτοῦ ἐν ὁμονοίᾳ δίχα πάσης παρεκβάσεως ἐξελίσσουσιν τοὺς ἐπιτεταγμένους αὐτοῖς ὁρισμούς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/003.yaml
  text: The sun and the moon and the choirs of stars[a], according to his ordinance, move in concord, without any deviation, along the courses assigned to them.
translation:
  language: hi
  text: सूर्य, चन्द्रमा और तारों के समूह उसके विधान के अनुसार एकमत होकर, बिना किसी विचलन के, अपने लिए निर्धारित मार्गों पर चलते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: अपने लिए निर्धारित सीमाओं के भीतर आगे बढ़ते हैं।'
    reason: ἐξελίσσουσιν ... ὁρισμούς का अर्थ नियत मार्गों पर चलना अथवा निर्धारित सीमाओं के भीतर आगे बढ़ना—दोनों हो सकता है।
lexical_decisions:
- source_word: χοροὶ
  choice: समूह
  rationale: χορός का शाब्दिक अर्थ गायक-मंडली या नृत्य-मंडली हो सकता है, पर तारों के संदर्भ में ‘समूह’ स्वाभाविक हिन्दी है और व्यवस्थित सामूहिक गति का भाव बनाए रखता है।
- source_word: διαταγήν
  choice: विधान
  rationale: यह किसी प्राधिकारी द्वारा ठहराई गई व्यवस्था या आदेश को दर्शाता है; ‘विधान’ इस संदर्भ में गरिमापूर्ण और सहज है।
- source_word: ἐν ὁμονοίᾳ
  choice: एकमत होकर
  rationale: यह केवल सौंदर्यात्मक सामंजस्य नहीं, बल्कि सहमति और एकचित्तता का भाव रखता है; 1 क्लेमेंट में कलह के विपरीत प्रयुक्त इस प्रमुख भाव को बनाए रखा गया है।
- source_word: δίχα πάσης παρεκβάσεως
  choice: बिना किसी विचलन के
  rationale: मूल का पूर्ण निषेध और निर्धारित क्रम से न हटने का भाव सीधे व्यक्त करता है।
- source_word: ἐξελίσσουσιν ... ὁρισμούς
  choice: निर्धारित मार्गों पर चलते हैं
  rationale: शाब्दिक रूप से कठिन वाक्यांश में आगे बढ़ने और नियत सीमाओं अथवा परिधियों का संयुक्त भाव है; खगोलीय संदर्भ में ‘मार्गों पर चलते हैं’ स्वाभाविक है, जबकि सीमा वाला वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ἐν ὁμονοίᾳ में नैतिक-सामुदायिक प्रतिध्वनि
  choice: एकमत होकर
  alternative: सामंजस्य में
  rationale: ‘एकमत’ 1 क्लेमेंट में एकता बनाम कलह की व्यापक शब्दावली से संबंध बनाए रखता है और इसे केवल संगीतात्मक या खगोलीय तालमेल तक सीमित नहीं करता।
- issue: नियत गति और सीमा के बीच अस्पष्टता
  choice: अपने लिए निर्धारित मार्गों पर चलते हैं
  alternative: अपने लिए निर्धारित सीमाओं के भीतर आगे बढ़ते हैं
  rationale: मुख्य पाठ में खगोलीय गति को सहज हिन्दी में व्यक्त किया गया है, पर ὁρισμούς के ‘सीमाएँ’ अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। ‘चन्द्रमा’ और ‘विधान’ औपचारिकता देते हैं, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सहज रखा गया है।
