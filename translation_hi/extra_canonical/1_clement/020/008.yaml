  text: The ocean, impassable to men, and the worlds beyond it are directed by the ordinances of the Master.
translation:
  language: hi
  text: मनुष्यों के लिए अगम्य महासागर और उसके पार के लोक स्वामी की व्यवस्थाओं के अनुसार संचालित होते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠκεανὸς ἀπέραντος ἀνθρώποις
  choice: मनुष्यों के लिए अगम्य महासागर
  rationale: ἀπέραντος यहाँ महासागर की ऐसी विशालता या दुर्गमता व्यक्त करता है जिसे मनुष्य पार नहीं कर सकते; ‘अगम्य’ इस भाव को संक्षेप और गरिमा के साथ रखता है।
- source_word: οἱ μετ᾽ αὐτὸν κόσμοι
  choice: उसके पार के लोक
  rationale: μετ᾽ αὐτόν का स्थानगत अर्थ ‘उसके पार’ है और κόσμοι बहुवचन में व्यवस्थित जगतों या लोकों को सूचित करता है; ‘लोक’ संभावित प्राचीन विश्व-कल्पना को आधुनिक वैज्ञानिक अर्थ में सीमित नहीं करता।
- source_word: ταγαῖς
  choice: व्यवस्थाओं
  rationale: पाठ का ταγαῖς सामान्यतः διαταγαῖς/τάξεσιν से संबंधित ‘नियत व्यवस्थाएँ’ या ‘आदेश’ का भाव देता है; ‘व्यवस्थाओं’ में आदेश और सुव्यवस्थित क्रम दोनों की गुंजाइश बनी रहती है।
- source_word: τοῦ δεσπότου
  choice: स्वामी की
  rationale: δεσπότης अधिकार-संपन्न स्वामी को दर्शाता है; ‘स्वामी’ स्वाभाविक, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: διευθύνονται
  choice: संचालित होते हैं
  rationale: क्रिया मार्गदर्शन, नियमन या सुव्यवस्थित संचालन का भाव देती है; कर्मवाच्य ‘संचालित होते हैं’ यूनानी रूप और ब्रह्मांडीय व्यवस्था दोनों को व्यक्त करता है।
theological_decisions:
- issue: ‘लोकों’ की प्रकृति
  choice: उसके पार के लोक
  alternative: उसके पार के संसार
  rationale: κόσμοι की बहुवचन अस्पष्टता को बनाए रखा गया है; इसे न आधुनिक ग्रहों के रूप में और न किसी विशिष्ट धर्मवैज्ञानिक लोक-व्यवस्था के रूप में परिभाषित किया गया।
- issue: दैवी नियमन का स्वरूप
  choice: स्वामी की व्यवस्थाओं के अनुसार
  alternative: स्वामी के आदेशों से
  rationale: ταγαῖς में आदेश और व्यवस्थित विधान दोनों संभव हैं। ‘व्यवस्थाओं’ से किसी विशेष सिद्धान्त को थोपे बिना व्यापक अर्थ सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘अगम्य’, ‘लोक’ और ‘व्यवस्थाएँ’ प्राचीन ब्रह्मांडीय कथन की औपचारिकता तथा मूल की अर्थगत खुली जगह को बनाए रखते हैं।
