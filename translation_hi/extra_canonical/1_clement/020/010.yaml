source:
  edition: Funk 1901 (normalized OCR)
  text: ἀνέμων σταθμοὶ κατὰ τὸν ἴδιον καιρὸν τὴν λειτουργίαν αὐτῶν ἀπροσκόπως ἐπιτελοῦσιν· ἀέναοί τε πηγαί, πρὸς ἀπόλαυσιν καὶ ὑγείαν δημιουργηθεῖσαι, δίχα ἐλλείψεως παρέχονται τοῖς πρὸς ζωὴν ἀνθρώποις μαζούς· τά τε ἐλάχιστα τῶν ζῴων τὰς συνελεύσεις αὐτῶν ἐν ὁμονοίᾳ καὶ εἰρήνῃ ποιοῦνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/010.yaml
  text: The courses of the winds[a], each in its own season, fulfill their service without hindrance; and the ever-flowing springs, created for enjoyment and health, without fail provide their breasts for the life of men[b]. And the smallest of living creatures hold their gatherings in harmony and peace.
translation:
  language: hi
  text: हवाओं के मार्ग[a] अपने-अपने नियत समय पर बिना किसी बाधा के अपनी सेवा पूरी करते हैं। और निरंतर बहने वाले सोते, जो आनंद और स्वास्थ्य के लिए रचे गए हैं, मनुष्यों के जीवन के लिए बिना किसी कमी के अपने स्तन प्रदान करते हैं[b]। और सबसे छोटे जीव अपने समूहों में सद्भाव और शांति से एकत्र होते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हवाओं के नियत ठिकाने।”
    reason: σταθμοί का अर्थ ‘ठहरने के स्थान/नियत अवस्थाएँ’ भी हो सकता है; प्रसंग में ‘मार्ग’ सम्भावित अर्थ है।
  - marker: b
    text: “अपने स्तन प्रदान करते हैं” सोतों के जीवनदायी जल का रूपक है।
    reason: मूल यूनानी के असामान्य मातृरूपक को बनाए रखते हुए आधुनिक पाठक के लिए उसका संकेत स्पष्ट करना।
lexical_decisions:
- source_word: ἀνέμων σταθμοὶ
  choice: हवाओं के मार्ग
  rationale: σταθμοί का मूल अर्थ ठहरने के स्थान या नियत अवस्थाएँ हो सकता है, पर हवाओं और उनके समयबद्ध कार्य के इस प्रसंग में ‘मार्ग’ स्वाभाविक रूप से उनके नियत क्रम या गति को व्यक्त करता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ἀπροσκόπως
  choice: बिना किसी बाधा के
  rationale: यहाँ भाव निर्विघ्न और अवरोधरहित ढंग से सेवा पूरी करने का है; शाब्दिक ‘बिना ठोकर खाए’ हवाओं के लिए अस्वाभाविक होता।
- source_word: λειτουργίαν
  choice: सेवा
  rationale: यह सृष्टि में हवाओं के नियत कार्य को दर्शाता है; यहाँ बाद के तकनीकी धार्मिक अर्थ को आरोपित नहीं किया गया।
- source_word: ἀέναοί ... πηγαί
  choice: निरन्तर बहने वाले सोते
  rationale: ἀέναος की अविरलता और πηγή के प्राकृतिक जलस्रोत का स्पष्ट, आधुनिक हिन्दी रूप।
- source_word: μαζούς
  choice: अपने स्तन
  rationale: लेखक के सजीव मातृरूपक को मिटाने के बजाय हिन्दी में सुरक्षित रखा गया है।
- source_word: τὰς συνελεύσεις αὐτῶν ... ποιοῦνται
  choice: एकत्र होते हैं
  rationale: शाब्दिक ‘अपनी सभाएँ करते हैं’ पशु-जगत के संदर्भ में कृत्रिम लगता; यह क्रिया-भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν ὁμονοίᾳ καὶ εἰρήνῃ
  choice: आपसी सहमति और शान्ति से
  rationale: ὁμόνοια केवल सामान्य मेल नहीं, एकमतता या सामंजस्य का भाव रखता है; ‘आपसी सहमति’ इसे सरल हिन्दी में बनाए रखता है।
theological_decisions:
- issue: सोते किसके द्वारा रचे गए हैं
  choice: ‘रचे गए हैं’—कर्ता को अनुल्लिखित रखा गया
  alternative: ‘परमेश्वर ने रचा है’
  rationale: यूनानी में δημιουργηθεῖσαι कर्मवाच्य है और कर्ता स्पष्ट नहीं किया गया; प्रसंग में परमेश्वर निहित हो सकता है, पर अनुवाद ने उसे पाठ में जोड़ा नहीं।
- issue: सबसे छोटे जीवों पर बल
  choice: ‘और सबसे छोटे जीव भी’
  alternative: ‘और सबसे छोटे जीव’
  rationale: τε मूलतः समन्वयकारी है, जबकि हिन्दी में ‘भी’ सूची की निरन्तरता और इस आश्चर्यजनक उदाहरण को स्वाभाविक बनाता है; इसे प्रबल ‘यहाँ तक कि’ के रूप में नहीं बढ़ाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। सृष्टि के सुव्यवस्थित संचालन की सूचीगत लय को तीन समन्वित वाक्यों में सुरक्षित रखा गया है। ‘स्तन’ का साहसी मूल रूपक हटाया नहीं गया, पर पादटिप्पणी से स्पष्ट किया गया है।
