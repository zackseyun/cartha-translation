  text: ἡμέρα τε καὶ νὺξ τὸν τεταγμένον ὑπ᾽ αὐτοῦ δρόμον ἀνύουσιν, μηδὲν ἀλλήλαις ἐμποδίζοντα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/002.yaml
  text: Day and night complete the course appointed by him, hindering one another in nothing.
translation:
  language: hi
  text: दिन और रात उसके द्वारा निर्धारित मार्ग को पूरा करते हैं और एक-दूसरे के लिए किसी भी प्रकार की बाधा नहीं बनते।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δρόμον
  choice: मार्ग
  rationale: यहाँ शब्द का मूल अर्थ दौड़ने का मार्ग या निर्धारित पथ है; ‘मार्ग’ सृष्टि की नियमित गति को स्वाभाविक और सुबोध ढंग से व्यक्त करता है।
- source_word: ἀνύουσιν
  choice: पूरा करते हैं
  rationale: क्रिया किसी मार्ग या क्रम को अंत तक संपन्न करने का भाव देती है।
- source_word: τεταγμένον ὑπ᾽ αὐτοῦ
  choice: उसके द्वारा निर्धारित
  rationale: यूनानी कर्मवाच्य रचना और कर्ता के स्पष्ट संकेत को सुरक्षित रखता है।
- source_word: ἐμποδίζοντα
  choice: बाधा नहीं बनते
  rationale: शाब्दिक अर्थ ‘रोकना/आड़े आना’ है; हिन्दी में पारस्परिक अवरोध न होने का भाव सहजता से व्यक्त होता है।
theological_decisions:
- issue: ‘उसके’ का संदर्भ
  choice: सर्वनाम ‘उसके’ को बनाए रखा
  alternative: ‘परमेश्वर के द्वारा’
  rationale: इस पद में यूनानी पाठ सर्वनाम का प्रयोग करता है; संदर्भ को स्पष्ट करने के लिए संज्ञा जोड़ना मूल की अपेक्षा अधिक व्याख्यात्मक होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मूल यूनानी की समानांतर संरचना के निकट।
