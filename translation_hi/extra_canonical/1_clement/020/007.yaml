  yaml_path: translation/extra_canonical/1_clement/020/007.yaml
  text: For he said, “Thus far you shall come, and your waves shall be broken within you.”
translation:
  language: hi
  text: क्योंकि उसने कहा, “तू यहीं तक आएगा, और तेरी लहरें तेरे भीतर टूट जाएँगी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἕως ὧδε
  choice: यहीं तक
  rationale: यह स्थान अथवा सीमा तक पहुँचने के भाव को स्वाभाविक और संक्षिप्त आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἥξεις
  choice: तू ... आएगा
  rationale: भविष्यकाल के एकवचन संबोधन को बनाए रखता है; संदर्भ में समुद्र का मानवीकरण होने के कारण ‘तू’ स्वाभाविक है।
- source_word: τὰ κύματά σου
  choice: तेरी लहरें
  rationale: मूल के स्वामित्वसूचक संबोधन और बहुवचन का सीधा, सहज अनुवाद।
- source_word: ἐν σοὶ συντριβήσεται
  choice: तेरे ही भीतर चूर हो जाएँगी
  rationale: ἐν σοὶ को ‘तेरे ही भीतर’ से स्पष्ट रखा गया है और συντριβήσεται के टूटकर निष्फल हो जाने के प्रबल भाव को ‘चूर हो जाएँगी’ व्यक्त करता है।
theological_decisions:
- issue: εἶπεν का अप्रकट कर्ता
  choice: उसने कहा
  alternative: परमेश्वर ने कहा
  rationale: मूल यूनानी में कर्ता का नाम नहीं दिया गया है; इसलिए संदर्भ से परमेश्वर समझे जाने पर भी उसे पाठ में जोड़कर अस्पष्टता दूर नहीं की गई।
- issue: समुद्र का मानवीकृत एकवचन संबोधन
  choice: तू ... तेरी ... तेरे
  alternative: तुम ... तुम्हारी ... तुम्हारे
  rationale: यूनानी एकवचन को सुरक्षित रखते हुए काव्यात्मक, अधिकारपूर्ण संबोधन व्यक्त किया गया है; इससे कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा जाता।
