revisions:
- from: आकाश उसकी व्यवस्था से गतिमान होते हुए[a] शान्ति में उसके अधीन रहते हैं।
  to: आकाश उसके प्रबन्ध से गतिमान होकर शान्तिपूर्वक उसके अधीन होते हैं।[a]
  rationale: Revision clarifies that the heavens’ motion is under and effected by divine governance, uses more natural modern Hindi for their peaceful submission, and preserves the lexical range of σαλευόμενοι in the footnote without forcing a disruptive sense into the main text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T16:32:58Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the heavens’ motion under God’s διοίκησις and their submission to him. However, ‘उसकी व्यवस्था से’ can sound like an abstract arrangement rather than active governance, and ‘गतिमान होते हुए’ does not clearly retain the source’s passive/causative relation (‘being moved/shaken by his governance’).
  naturalness: ‘शान्ति में उसके अधीन रहते हैं’ is understandable but somewhat wooden in modern Hindi. ‘शान्तिपूर्वक उसके अधीन होते हैं’ conveys ἐν εἰρήνῃ naturally while preserving peaceful, orderly submission.
  terminology: ‘प्रबन्ध’ naturally conveys διοίκησις here as governing administration. ‘आकाश’ is an acceptable collective Hindi rendering of the plural οἱ οὐρανοί. The footnote should retain the lexical ambiguity of σαλευόμενοι without implying that the alternative is necessarily violent.
  issues:
  - severity: medium
    issue: The governing agency in the participial phrase is underexpressed.
    rationale: σαλευόμενοι is linked to τῇ διοικήσει αὐτοῦ; ‘उसकी व्यवस्था से गतिमान होते हुए’ is possible, but ‘उसके प्रबन्ध से गतिमान होकर’ more clearly expresses movement effected by his governance.
  - severity: low
    issue: The phrasing for peaceful submission is stilted.
    rationale: ‘शान्ति में ... अधीन रहते हैं’ is overly literal and ‘रहते हैं’ weakens the present act of submission in ὑποτάσσονται. ‘शान्तिपूर्वक उसके अधीन होते हैं’ is idiomatic and source-faithful.
  revised_text: आकाश उसके प्रबन्ध से गतिमान होकर शान्तिपूर्वक उसके अधीन होते हैं।[a]
