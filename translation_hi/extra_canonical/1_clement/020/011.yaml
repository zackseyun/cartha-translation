base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/011.yaml
  text: All these things the great Creator and Master of all has appointed to be in peace and harmony, doing good to all things, but exceedingly more to us who have fled for refuge to his mercies through our Lord Jesus Messiah,
translation:
  language: hi
  text: इन सब बातों को महान सृष्टिकर्ता और सबके स्वामी ने शांति और सामंजस्य में रहने की आज्ञा दी है। वह सबका भला करता है, और हमारा तो अत्यन्त अधिक भला करता है—हमारा, जिन्होंने हमारे प्रभु यीशु मसीह के द्वारा उसकी करुणाओं की शरण ली है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δημιουργός
  choice: सृष्टिकर्ता
  rationale: यहाँ शब्द समस्त सृष्टि को व्यवस्थित करने और बनाने वाले के अर्थ में है; आधुनिक हिन्दी में ‘सृष्टिकर्ता’ स्वाभाविक और गरिमापूर्ण है।
- source_word: δεσπότης
  choice: स्वामी
  rationale: यह अधिकार और अधिपत्य व्यक्त करता है; ‘स्वामी’ सामान्य पाठक के लिए स्पष्ट है और अनावश्यक कठोरता नहीं जोड़ता।
- source_word: ὁμόνοια
  choice: एकता
  rationale: संदर्भ में परस्पर सहमति और सामंजस्य का भाव है; ‘एकता’ शांति के साथ स्वाभाविक हिन्दी युग्म बनाता है।
- source_word: ὑπερεκπερισσῶς
  choice: अत्यन्त अधिक
  rationale: यह प्रबल अतिशयता दर्शाता है; इस अभिव्यक्ति से तुलना और विशेष बल दोनों बने रहते हैं।
- source_word: προσπεφευγότας
  choice: शरण ली है
  rationale: क्रिया संकट से बचने के लिए किसी की ओर भागकर आश्रय लेने का भाव रखती है; ‘शरण ली है’ हिन्दी में उस आश्रय-भाव को स्पष्ट रखता है।
- source_word: οἰκτιρμοῖς
  choice: करुणा
  rationale: यूनानी में बहुवचन है, पर हिन्दी में परमेश्वर की दयालु करुणा के सामूहिक भाव के लिए एकवचन अधिक स्वाभाविक है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: उपाधि का अर्थ और यहूदी-मसीही संदर्भ सुरक्षित रखने के लिए मानक हिन्दी रूप ‘मसीह’ चुना गया है।
theological_decisions:
- issue: ‘सबका भला’ और ‘हम पर अत्यन्त अधिक’ के बीच तुलना
  choice: वाक्य को इस प्रकार रखा गया कि परमेश्वर का उपकार सबके प्रति है, किन्तु शरण लेने वालों के प्रति विशेष रूप से अत्यधिक है।
  alternative: ‘सब वस्तुओं को लाभ पहुँचाता है, पर हमें सीमा से परे’
  rationale: यूनानी कृदन्त εὐεργετῶν दोनों पदों को नियंत्रित करता है; चयन तुलना को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- issue: करुणाओं में शरण लेने का संबंध
  choice: ‘हमारे प्रभु यीशु मसीह के द्वारा उसकी करुणा में शरण ली है’
  alternative: ‘उसकी करुणाओं की शरण में आए हैं’
  rationale: ‘के द्वारा’ को यीशु मसीह के माध्यम से परमेश्वर की करुणा तक पहुँचने के रूप में रखा गया है, बिना इस संबंध को किसी अधिक विशिष्ट सिद्धान्त में बदलने के।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण धार्मिक गद्य। मूल यूनानी के लंबे वाक्य को स्पष्टता के लिए दो वाक्यों में बाँटा गया है; दूसरे वाक्य में पुनरुक्त ‘हम पर’ से मूल के प्रबल विशेष बल को व्यक्त किया गया है।
