id: 1CLEM.20.4
reference: 1 Clement 20:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: γῆ κυοφοροῦσα κατὰ τὸ θέλημα αὐτοῦ τοῖς ἰδίοις καιροῖς τὴν πανπληθῆ ἀνθρώποις τε καὶ θηρίοις καὶ πᾶσι τοῖς οὖσιν ἐπ᾽ αὐτῆς ζῶσιν ἀνατέλλει τροφήν, μήτε διστατάσουσα μηδὲ ἀλλοιοῦσά τι τῶν δεδογματισμένων ὑπ᾽ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/004.yaml
  text: The earth, bearing according to his will at its proper seasons abundant food for men and beasts and all living things upon it, brings it forth, neither wavering nor altering anything of what has been decreed by him.
translation:
  language: hi
  text: पृथ्वी उसकी इच्छा के अनुसार अपने नियत समयों पर मनुष्यों, पशुओं और उस पर रहने वाले सभी जीवों के लिए भरपूर भोजन गर्भ में धारण करती और उसे उपजाती है। वह न तो हिचकिचाती है और न ही उसके द्वारा ठहराई गई किसी बात में कोई बदलाव करती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κυοφοροῦσα
  choice: गर्भ में धारण करती
  rationale: इस कृदन्त का मूल अर्थ गर्भ धारण करना/अपने भीतर उपज को पालना है। इसे केवल ‘फलती’ कहने के बजाय पृथ्वी के गर्भधारण के सजीव रूपक को बनाए रखा गया है।
- source_word: τοῖς ἰδίοις καιροῖς
  choice: अपने-अपने नियत समयों पर
  rationale: बहुवचन और प्रत्येक उपज के उचित या निर्धारित अवसर का भाव सुरक्षित रहता है।
- source_word: τὴν πανπληθῆ ... τροφήν
  choice: भरपूर भोजन
  rationale: πανπληθής यहाँ अत्यधिक प्रचुरता का बोध देता है; सहज आधुनिक हिन्दी में ‘भरपूर’ वही अर्थ संक्षेप में देता है।
- source_word: ἀνατέλλει
  choice: उपजाती है
  rationale: पृथ्वी के विषय में यह क्रिया उगाने या अंकुरित कर सामने लाने का अर्थ देती है; ‘उपजाती है’ हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: μήτε διστατάσουσα
  choice: न तो हिचकिचाती है
  rationale: διστάζω के संकोच, डगमगाने या हिचकने के भाव को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῶν δεδογματισμένων ὑπ᾽ αὐτοῦ
  choice: उसके द्वारा ठहराई गई किसी बात
  rationale: दिव्य आदेश या निर्णय के रूप में निर्धारित बातों का अर्थ रखता है, बिना इसे अनावश्यक रूप से किसी तकनीकी धार्मिक पद में सीमित किए।
theological_decisions:
- issue: αὐτοῦ के कर्ता की पहचान
  choice: ‘उसकी/उसके द्वारा’ सर्वनाम बनाए रखा
  alternative: स्पष्ट रूप से ‘परमेश्वर की/परमेश्वर के द्वारा’
  rationale: निकटवर्ती प्रसंग में संकेत परमेश्वर की ओर है, पर इस वाक्य के यूनानी पाठ में नाम के स्थान पर सर्वनाम है; उसी संदर्भगत रूप को सुरक्षित रखा गया है।
- issue: प्रकृति की आज्ञाकारिता का मानवीकरण
  choice: ‘हिचकिचाती’ और ‘बदलाव करती’ के रूप में मानवीकरण बनाए रखा
  alternative: प्रकृति के नियमों की अमूर्त भाषा में पुनर्लेखन
  rationale: मूल पाठ पृथ्वी को दिव्य इच्छा का स्थिरता से पालन करते हुए चित्रित करता है; इसे वैज्ञानिक या अमूर्त भाषा में बदलना अलंकार और धार्मिक तनाव दोनों को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण गद्य। यूनानी वाक्य के लंबे कृदन्तीय ढाँचे को स्पष्टता के लिए दो वाक्यों में बाँटा गया है, जबकि गर्भधारण और आज्ञाकारी पृथ्वी की मूल छवि सुरक्षित रखी गई है।
