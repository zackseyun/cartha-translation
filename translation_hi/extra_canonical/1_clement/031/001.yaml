source:
  edition: Funk 1901 (normalized OCR)
  text: Κολληθῶμεν οὖν τῇ εὐλογίᾳ αὐτοῦ καὶ ἴδωμεν, τίνες αἱ ὁδοὶ τῆς εὐλογίας. ἀνατυλίξωμεν τὰ ἀπ’ ἀρχῆς γενόμενα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/031/001.yaml
  text: Let us therefore cling to his blessing, and let us see what the ways of blessing are. Let us unfold the things that have happened from the beginning.
translation:
  language: hi
  text: इसलिए हम उसकी आशीष से मज़बूती से जुड़े रहें और देखें कि आशीष के मार्ग कौन-से हैं। आओ, आरम्भ से हुई बातों को एक-एक करके सामने लाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κολληθῶμεν
  choice: हम ... दृढ़ता से जुड़े रहें
  rationale: क्रिया का मूल भाव किसी वस्तु से चिपके या घनिष्ठ रूप से जुड़े रहने का है; यह हिन्दी में आग्रह और स्थायित्व दोनों व्यक्त करता है।
- source_word: εὐλογίᾳ
  choice: आशीष
  rationale: यहाँ εὐλογία परमेश्वर से मिलने वाली आशीष को सूचित करता है; आधुनिक धार्मिक हिन्दी में ‘आशीष’ स्वाभाविक और स्पष्ट है।
- source_word: αἱ ὁδοὶ τῆς εὐλογίας
  choice: आशीष पाने के मार्ग
  rationale: शाब्दिक ‘आशीष के मार्ग’ हिन्दी में अस्पष्ट हो सकता है। प्रसंग उन मार्गों या जीवन-पद्धतियों की खोज का है जिनके द्वारा आशीष प्राप्त होती है; ‘पाने के’ इसी सम्बन्ध को सहज रूप से व्यक्त करता है।
- source_word: ἀνατυλίξωμεν
  choice: खोलकर देखें
  rationale: शब्द में किसी लपेटी हुई वस्तु को खोलने का चित्र है और प्रसंग में प्राचीन घटनाओं को क्रमशः सामने लाने का भाव; ‘खोलकर देखें’ रूपक को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: τὰ ἀπ’ ἀρχῆς γενόμενα
  choice: आरम्भ से घटी घटनाओं को
  rationale: यह अभिव्यक्ति आरम्भिक काल से हुई बातों या घटनाओं की ओर संकेत करती है; ‘घटी घटनाएँ’ ऐतिहासिक सन्दर्भ को स्पष्ट रखता है।
theological_decisions:
- issue: ‘उसकी आशीष’ में सर्वनाम का संदर्भ
  choice: उसकी आशीष
  alternative: परमेश्वर की आशीष
  rationale: यूनानी पाठ αὐτοῦ में सर्वनाम ही रखता है। पूर्ववर्ती प्रसंग उसका संदर्भ स्पष्ट कर सकता है, इसलिए अनुवाद में नाम जोड़कर मूल की संदर्भगत प्रकृति को अनावश्यक रूप से नहीं बदला गया।
- issue: आशीष के ‘मार्गों’ का सम्बन्ध
  choice: आशीष पाने के मार्ग
  alternative: आशीष के मार्ग
  rationale: सम्बन्धवाचक पदबंध अपने आप में कुछ अस्पष्ट है, पर अध्याय का आगामी उदाहरण उन आचरणों पर केंद्रित है जो आशीष से जुड़े हैं। हिन्दी में ‘पाने के’ सहज है, फिर भी इसे योग्यता द्वारा उद्धार जैसी किसी विशिष्ट धर्मवैज्ञानिक व्यवस्था के रूप में नहीं बढ़ाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामूहिक उपदेशात्मक स्वर रखा गया है। दोहरे प्रथम-पुरुष बहुवचन आग्रह को ‘हम ... जुड़े रहें और देखें’ तथा ‘आओ ... देखें’ से व्यक्त किया गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
