  text: Isaac[a], knowing with confidence what was to come, gladly offered himself as a sacrifice.
translation:
  language: hi
  text: इसहाक, जो दृढ़ विश्वास के साथ जानता था कि आगे क्या होने वाला है, सहर्ष बलिदान के लिए आगे बढ़ा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ πεποιθήσεως
  choice: पूरे भरोसे के साथ
  rationale: यह पदबंध दृढ़ विश्वास/भरोसे के भाव को व्यक्त करता है और हिन्दी में स्वाभाविक रूप से जानने की क्रिया से जुड़ता है।
- source_word: τὸ μέλλον
  choice: आगे क्या होने वाला है
  rationale: यूनानी नपुंसकलिंग कृदंत भावी घटनाओं या आनेवाली बात को सामूहिक रूप से दर्शाता है; यह हिन्दी रूप उस व्यापकता को बनाए रखता है।
- source_word: ἡδέως
  choice: सहर्ष
  rationale: ‘खुशी से’ या ‘स्वेच्छा से’ के निकट अर्थ को संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल ढंग से व्यक्त करता है।
- source_word: προσήγετο θυσία
  choice: बलिदान के रूप में प्रस्तुत हुआ
  rationale: मध्य/कर्मवाच्य रूप προσήγετο में स्वयं आगे आने, प्रस्तुत किए जाने या अर्पित होने की छायाएँ हैं। ‘प्रस्तुत हुआ’ अनावश्यक रूप से पूर्ण सक्रियता आरोपित किए बिना स्वैच्छिक भाव को संदर्भ में रहने देता है।
theological_decisions:
- issue: क्या इसहाक ने स्वयं को सक्रिय रूप से अर्पित किया या वह बलिदान के लिए प्रस्तुत हुआ?
  choice: बलिदान के रूप में प्रस्तुत हुआ
  alternative: अपने आपको बलिदान के रूप में अर्पित किया
  rationale: यूनानी मध्य/कर्मवाच्य रूप दोनों दिशाओं की गुंजाइश रखता है। मुख्य पाठ में ऐसा रूप चुना गया है जो इसहाक की सहर्ष भागीदारी को व्यक्त करता है, पर उसकी भूमिका को स्रोत से अधिक सक्रिय नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘पूरे भरोसे के साथ’ को ‘जानते हुए’ के निकट रखकर यूनानी वाक्य-संबंध स्पष्ट किया गया है।
