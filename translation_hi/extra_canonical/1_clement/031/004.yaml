  text: Ἰακὼβ μετὰ ταπεινοφροσύνης ἐξεχώρησεν τῆς γῆς αὐτοῦ δι’ ἀδελφὸν καὶ ἐπορεύθη πρὸς Λαβὰν καὶ ἐδούλευσεν, καὶ ἐδόθη αὐτῷ τὸ δωδεκάσκηπτρον τοῦ Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/031/004.yaml
  text: Jacob[a], with humility, departed from his land because of his brother and went to Laban and served, and to him was given the twelve-sceptered people of Israel.
translation:
  language: hi
  text: याकूब नम्रता के साथ अपने भाई के कारण अपनी भूमि छोड़कर लाबान के पास गया और लाबान की सेवा की; और उसे इस्राएल के बारह गोत्र दिए गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ एक दुर्लभ संयुक्त शब्द है, जिसका शाब्दिक रूप ‘बारह राजदण्डों वाला’ है। बाइबलीय प्रयोग में इसका आशय इस्राएल के बारह गोत्रों से है।
    reason: दुर्लभ यूनानी संयुक्त शब्द के शाब्दिक राजदण्ड-रूपक को दर्ज रखते हुए उसके प्रचलित बाइबलीय आशय को स्पष्ट करता है।
lexical_decisions:
- source_word: ταπεινοφροσύνης
  choice: नम्रता
  rationale: यह शब्द दीन और विनीत मनोभाव को व्यक्त करता है; ‘नम्रता’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: δι’ ἀδελφὸν
  choice: अपने भाई के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण को व्यक्त करता है। ‘अपने’ संबंध को प्रसंगानुसार स्पष्ट करता है, जबकि यूनानी में संबंध संदर्भ से समझा जाता है।
- source_word: ἐδούλευσεν
  choice: उसकी सेवा की
  rationale: क्रिया का मूल अर्थ दास के रूप में सेवा करना है। यहाँ लाबान के अधीन याकूब की सेवा का संकेत स्वाभाविक हिन्दी में रखा गया है।
- source_word: τὸ δωδεκάσκηπτρον τοῦ Ἰσραήλ
  choice: इस्राएल का बारह राजदण्डों वाला जनसमुदाय
  rationale: दुर्लभ संयुक्त शब्द δωδεκάσκηπτρον का राजदण्ड-संबंधी रूपक बनाए रखते हुए उसके सामूहिक अर्थ को ‘जनसमुदाय’ से स्पष्ट किया गया है; यह इस्राएल के बारह गोत्रों की ओर संकेत करता है।
theological_decisions:
- issue: दुर्लभ δωδεκάσκηπτρον को ‘बारह गोत्र’ या उसके राजदण्ड-रूपक सहित प्रस्तुत करना
  choice: मुख्य पाठ में ‘बारह राजदण्डों वाला जनसमुदाय’
  alternative: ‘इस्राएल के बारह गोत्र’
  rationale: σκῆπτρον राजदण्ड और गोत्र—दोनों से जुड़े बाइबलीय शब्द-संबंध की पृष्ठभूमि रखता है। मुख्य पाठ मूल की असामान्य अभिव्यक्ति और रूपक को बचाता है, जबकि पादटिप्पणी अपेक्षित आशय बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य की क्रमिक कथात्मक संरचना मूल यूनानी के निकट है, पर हिन्दी में प्रवाह के लिए अर्धविराम का प्रयोग किया गया है।
