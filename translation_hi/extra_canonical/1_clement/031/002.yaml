translation:
  language: hi
  text: हमारे पिता अब्राहम को किस कारण आशीष मिली? क्या इसलिए नहीं कि उन्होंने विश्वास के द्वारा धार्मिकता और सत्य का आचरण किया?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνος χάριν
  choice: किस कारण
  rationale: यूनानी प्रश्नवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ηὐλογήθη
  choice: आशीष मिली
  rationale: कर्मवाच्य अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὁ πατὴρ ἡμῶν Ἀβραάμ
  choice: हमारे पिता अब्राहम
  rationale: मूल की सामुदायिक और आदरपूर्ण अभिव्यक्ति को बनाए रखता है।
- source_word: δικαιοσύνην καὶ ἀλήθειαν ... ποιήσας
  choice: धार्मिकता और सच्चाई के काम किए
  rationale: ποιέω के क्रियात्मक बल को सुरक्षित रखते हुए हिन्दी में अस्वाभाविक ‘धार्मिकता और सच्चाई की’ से बचता है; दोनों संज्ञाओं को कर्म और आचरण के रूप में प्रस्तुत करता है।
- source_word: διὰ πίστεως
  choice: विश्वास के द्वारा
  rationale: διά + संबंधकारक के साधन अथवा माध्यम-सूचक अर्थ को बिना अधिक व्याख्या के बनाए रखता है।
- source_word: οὐχί
  choice: क्या इसलिए नहीं कि
  rationale: अपेक्षित सकारात्मक उत्तर वाले यूनानी आलंकारिक प्रश्न को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अब्राहम की आशीष, विश्वास और धार्मिक कर्मों के बीच संबंध
  choice: ‘विश्वास के द्वारा धार्मिकता और सच्चाई के काम किए’
  alternative: ‘विश्वास के कारण धर्मी ठहराए गए’
  rationale: मूल पाठ आशीष का संबंध विश्वास के द्वारा धार्मिकता और सच्चाई करने से जोड़ता है; यह ‘धर्मी ठहराए जाने’ की तकनीकी भाषा नहीं रखता। अनुवाद मूल के नैतिक और धार्मिक तनाव को बिना सांप्रदायिक समायोजन के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरपूर्ण, स्पष्ट और सार्वजनिक पाठ के योग्य शैली। ‘आशीष मिली’ सहज है, जबकि ‘धार्मिकता और सच्चाई के काम किए’ मूल ποιήσας के सक्रिय भाव को बनाए रखता है।
