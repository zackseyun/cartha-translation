source:
  edition: Funk 1901 (normalized OCR)
  text: Ἕκαστος ἡμῶν, ἀδελφοί, ἐν τῷ ἰδίῳ τάγματι εὐαρεστείτω τῷ θεῷ ἐν ἀγαθῇ συνειδήσει ὑπάρχων, μὴ παρεκβαίνων τὸν ὡρισμένον τῆς λειτουργίας αὐτοῦ κανόνα, ἐν σεμνότητι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/041/001.yaml
  text: Let each of us, brothers, please God in his own rank, maintaining a good conscience, not overstepping the fixed rule of his ministry, with dignity.
translation:
  language: hi
  text: भाइयो, हममें से हर एक अपने-अपने स्थान पर, अच्छा विवेक बनाए रखते हुए, अपनी सेवा के लिए निर्धारित मर्यादा का उल्लंघन किए बिना, गरिमा के साथ परमेश्वर को प्रसन्न करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τάγματι
  choice: स्थान
  rationale: यहाँ शब्द किसी व्यवस्थित क्रम में व्यक्ति के अपने स्थान या पद को सूचित करता है; सामान्य हिन्दी में ‘स्थान’ स्वाभाविक है और अनावश्यक रूप से सैन्य अर्थ नहीं थोपता।
- source_word: εὐαρεστείτω
  choice: परमेश्वर को प्रसन्न करे
  rationale: सक्रिय आज्ञार्थक क्रिया का सीधा और स्वाभाविक अनुवाद।
- source_word: ἐν ἀγαθῇ συνειδήσει ὑπάρχων
  choice: अच्छा विवेक बनाए रखते हुए
  rationale: वर्तमान कृदन्त की निरंतर अवस्था को सहज हिन्दी में व्यक्त करता है; ‘शुद्ध विवेक’ की अपेक्षा ‘अच्छा विवेक’ मूल विशेषण ἀγαθῇ के अधिक निकट है।
- source_word: τὸν ὡρισμένον ... κανόνα
  choice: निर्धारित मर्यादा
  rationale: κανών यहाँ सेवा की तय सीमा या नियम को दर्शाता है; ‘मर्यादा’ सीमा न लाँघने के प्रसंग में स्वाभाविक है।
- source_word: λειτουργίας
  choice: सेवा
  rationale: इस संदर्भ में नियत धार्मिक या सामुदायिक कर्तव्य का व्यापक अर्थ रखता है; ‘आराधना-पद्धति’ जैसा संकीर्ण बाद का अर्थ नहीं थोपा गया।
- source_word: ἐν σεμνότητι
  choice: गरिमा के साथ
  rationale: σεμνότης की गंभीर, सम्मानजनक और मर्यादित रीति को आधुनिक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: τάγματι को कलीसियाई पदक्रम के तकनीकी पद के रूप में समझना
  choice: अपने-अपने स्थान पर
  alternative: अपने-अपने पद में
  rationale: मूल व्यवस्थित क्रम में स्थान का संकेत देता है, पर इस पद में किसी विशिष्ट कलीसियाई पदवी को स्पष्ट नहीं करता; इसलिए व्यापक अर्थ सुरक्षित रखा गया।
- issue: λειτουργία का धार्मिक-तकनीकी अर्थ
  choice: सेवा
  alternative: उपासना-सेवा
  rationale: यह शब्द सौंपे गए कार्य या सेवा को सूचित कर सकता है; केवल अनुष्ठानिक उपासना तक अर्थ सीमित करना मूल की संभावित व्यापकता घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध शैली। ‘भाइयो’ संबोधन मूल ἀδελφοί को सीधे रखता है। वाक्य-विन्यास को हिन्दी की स्वाभाविक धारा के अनुसार व्यवस्थित किया गया है, जबकि अपने स्थान, अच्छे विवेक, निर्धारित सीमा और गरिमा—इन सभी मूल घटकों को सुरक्षित रखा गया है।
