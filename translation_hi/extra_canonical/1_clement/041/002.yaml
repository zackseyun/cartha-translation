base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/041/002.yaml
  text: For the sacrifices of the continual offering, or of prayers, or concerning sin and transgression, are not offered everywhere, brothers, but only in Jerusalem; and even there they are not offered in every place, but before the sanctuary, at the altar, after the offering has been inspected for blemishes by the high priest and the ministers already mentioned.
translation:
  language: hi
  text: निरंतर अर्पण के बलिदान, प्रार्थनाओं के बलिदान[a], और पाप तथा अपराध के लिए बलिदान, भाइयो, हर जगह नहीं चढ़ाए जाते, बल्कि केवल यरूशलेम में। और वहाँ भी वे हर स्थान पर नहीं चढ़ाए जाते, बल्कि मंदिर के सामने, वेदी पर, उस चढ़ाई जाने वाली भेंट की महायाजक और पहले बताए गए सेवकों द्वारा दोषों के लिए जाँच हो जाने के बाद।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी εὐχή का सामान्य अर्थ ‘प्रार्थना’ है; बलिदानों के इस अनुष्ठानिक संदर्भ में इसका अर्थ ‘मन्नत’ या ‘मनौती’ भी हो सकता है।
    reason: εὐχῶν की अर्थगत अस्पष्टता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: θυσίαι ἐνδελεχισμοῦ
  choice: नित्य अर्पण के बलिदान
  rationale: ἐνδελεχισμός नियमित या निरन्तर अर्पण को सूचित करता है; यह वाक्यांश बलिदान की श्रेणी के रूप में स्वाभाविक हिन्दी देता है।
- source_word: εὐχῶν
  choice: मन्नत के बलिदान
  rationale: εὐχή का सामान्य अर्थ ‘प्रार्थना’ भी हो सकता है, पर बलिदानों की इस सूची में इसका अनुष्ठानिक अर्थ मन्नत या मनौती से जुड़ा अर्पण अधिक उपयुक्त है।
- source_word: περὶ ἁμαρτίας καὶ πλημμελείας
  choice: पाप तथा अपराध के लिए बलिदान
  rationale: दोनों यूनानी पदों का भेद बनाए रखा गया है; पहला पाप और दूसरा दोष/अपराध को दर्शाता है।
- source_word: ἔμπροσθεν τοῦ ναοῦ πρὸς τὸ θυσιαστήριον
  choice: मन्दिर के सामने वेदी पर
  rationale: स्थान और वेदी—दोनों संकेतों को संक्षिप्त, स्पष्ट और अनुष्ठानिक हिन्दी में रखा गया है।
- source_word: μωροσκοπηθὲν τὸ προσφερόμενον
  choice: चढ़ाई जानेवाली भेंट की जाँच कर लेते हैं कि उसमें कोई दोष न हो
  rationale: दुर्लभ क्रिया का आशय बलि-पशु या भेंट को दोषों के लिए परखना है; हिन्दी में अर्थ स्पष्ट करने हेतु क्रियात्मक रूप अपनाया गया है।
- source_word: λειτουργῶν
  choice: सेवक
  rationale: यहाँ मन्दिर में नियुक्त अनुष्ठानिक सेवा करनेवाले व्यक्तियों का संदर्भ है; ‘सेवक’ पद को बिना बाद की कलीसियाई पदवी आरोपित किए रखा गया है।
theological_decisions:
- issue: εὐχῶν को ‘प्रार्थनाएँ’ या ‘मन्नत के बलिदान’ समझना
  choice: मन्नत के बलिदान
  alternative: प्रार्थनाओं के बलिदान
  rationale: पाठ यरूशलेम, वेदी और बलिदानों की विधिवत श्रेणियों की चर्चा करता है; इसलिए मन्नत से संबंधित बलिदान यहाँ अधिक सुसंगत है, यद्यपि शब्द में प्रार्थना का अर्थ भी सम्भव है।
- issue: ἁμαρτίας और πλημμελείας के बीच भेद
  choice: पाप तथा अपराध
  alternative: पाप और दोष
  rationale: दोनों श्रेणियों को एक ही सामान्य पद में विलीन नहीं किया गया; ‘अपराध’ दूसरी श्रेणी के अनुष्ठानिक और नैतिक आयाम को स्वाभाविक हिन्दी में व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सहज शैली रखी गई है। ‘भाइयो’ मूल सम्बोधन को बनाए रखता है। वाक्य को हिन्दी की पठनीयता के लिए दो वाक्यों में बाँटा गया है, जबकि यूनानी तर्क-क्रम सुरक्षित है। उपलब्ध यूनानी उद्धरण अन्त में कट गया है; अंतिम कर्ता-वाक्यांश अंग्रेज़ी परामर्श-पाठ और प्रचलित यूनानी पाठ-परम्परा के अनुरूप प्रस्तुत किया गया है।
