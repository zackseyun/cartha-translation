  text: ὁ μόνος δυνάμενος ποιῆσαι ταῦτα καὶ περισσότερα ἀγαθὰ μεθ’ ἡμῶν, σοὶ ἐξομολογούμεθα διὰ τοῦ ἀρχιερέως καὶ προστάτου τῶν ψυχῶν ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ σοι ἡ δόξα καὶ ἡ μεγαλωσύνη καὶ νῦν καὶ εἰς γενεὰν γενεῶν καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/061/003.yaml
  text: To you[a], who alone are able to do these and greater good things among us, we give thanks through the high priest and guardian of our souls, Jesus Christ, through whom be the glory and the majesty to you both now and from generation to generation and unto the ages of ages[b]. Amen.
translation:
  language: hi
  text: आप, जो अकेले हमारे बीच ये और इनसे भी बड़ी भलाईयाँ करने में समर्थ हैं, हम हमारी आत्माओं के महायाजक और संरक्षक, यीशु मसीह के द्वारा आपका धन्यवाद करते हैं। उन्हीं के द्वारा अभी, पीढ़ी से पीढ़ी तक और युगानुयुग आपकी महिमा और महानता हो। आमीन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμῶν
  choice: हमारे बीच
  rationale: साथ होने या किसी समुदाय के बीच कार्य करने का भाव बनाए रखता है; इसे केवल ‘हमारे लिए’ कहना यूनानी संबंधवाचक पदबंध को अनावश्यक रूप से लाभार्थक बना देता।
- source_word: ἐξομολογούμεθα
  choice: हम आपका धन्यवाद करते हैं
  rationale: प्रार्थना और स्तुतिगान के इस संदर्भ में धन्यवाद/कृतज्ञता व्यक्त करना स्वाभाविक है, यद्यपि क्रिया में स्तुति या अंगीकार का अर्थ भी संभव है।
- source_word: ἀρχιερέως
  choice: महायाजक
  rationale: प्रचलित और स्रोत के पद-संबंधी अर्थ को स्पष्ट रूप से व्यक्त करने वाला हिन्दी शब्द।
- source_word: προστάτου
  choice: रक्षक
  rationale: यहाँ आत्माओं की देखभाल और रक्षा करने वाले का भाव है; ‘संरक्षक’ भी संभव है, पर ‘रक्षक’ अधिक सहज और संक्षिप्त है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: औपचारिक आराधनात्मक सूत्र में Χριστός स्थिर उपाधि/नाम की तरह प्रयुक्त है; हिन्दी की स्थापित अभिव्यक्ति ‘यीशु मसीह’ उसी रजिस्टर को बनाए रखती है।
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: युगानुयुग
  rationale: यूनानी अतिशयोक्तिपूर्ण काल-सूत्र का स्वाभाविक, गरिमापूर्ण और परिचित हिन्दी समतुल्य।
theological_decisions:
- issue: μεθ’ ἡμῶν का संबंधात्मक अर्थ
  choice: हमारे बीच
  alternative: हमारे साथ / हमारे लिए
  rationale: स्रोत में σύν-सदृश सहभागिता या समुदाय के मध्य होने का भाव है। ‘हमारे लिए’ संभावित आशय हो सकता है, पर व्याकरणिक रूप से कम सीधा है; इसलिए अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: δι’ οὗ वाली महिमावाणी
  choice: उन्हीं के द्वारा आपकी महिमा और महानता ... होती रहे
  alternative: जिनके द्वारा महिमा और महानता आपकी है
  rationale: यूनानी में क्रिया लुप्त है। कामनार्थक हिन्दी वाक्य आराधनात्मक प्रवाह बनाए रखता है, बिना यह तय किए कि कथन केवल वर्तमान स्वामित्व का है या स्तुतिपरक कामना का।
- issue: Χριστός का रूपांतरण
  choice: मसीह
  alternative: अभिषिक्त जन
  rationale: इस औपचारिक सूत्र में यह स्थिर उपाधि/नाम के रूप में है; वर्णनात्मक अनुवाद करने से मूल का आराधनात्मक रजिस्टर बदल जाएगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक प्रार्थना के अनुकूल रखी गई है। परमेश्वर के लिए सम्मानसूचक ‘आप’ और उससे संगत बहुवचन क्रियारूप प्रयुक्त हैं। लंबे यूनानी वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है, पर उसकी सतत महिमावाणी और मध्यस्थता की संरचना सुरक्षित है।
