id: 1CLEM.61.2
reference: 1 Clement 61:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: σὺ γάρ, δέσποτα, ἐπουράνιε βασιλεῦ τῶν αἰώνων, δίδως τοῖς υἱοῖς τῶν ἀνθρώπων δόξαν καὶ τιμὴν καὶ ἐξουσίαν τῶν ἐπὶ τῆς γῆς ὑπαρχόντων· σὺ, κύριε, διεύθυνον τὴν βουλὴν αὐτῶν κατὰ τὸ καλὸν καὶ εὐάρεστον ἐνώπιον σου, ὅπως διέποντες ἐν εἰρήνῃ καὶ πραΰτητι εὐσεβῶς τὴν ὑπὸ σοῦ αὐτοῖς δεδομένην ἐξουσίαν θεοῦ σου τυγχάνωσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/061/002.yaml
  text: For you[a], Master, heavenly King of the ages, give glory and honor and authority to the sons of men over those who are on the earth. You, Lord, direct their counsel according to what is good and pleasing before you, so that, governing in peace and gentleness, and with godliness, the authority you have given them, they may obtain your favor.
translation:
  language: hi
  text: क्योंकि हे स्वामी, युगों के स्वर्गीय राजा, तुम मनुष्यों को पृथ्वी पर रहने वालों पर महिमा, सम्मान और अधिकार देते हो। हे प्रभु, उनके परामर्श को उस ओर निर्देशित करो जो तुम्हारी दृष्टि में भला और मनभावना है, ताकि वे तुम्हारे दिए हुए अधिकार का शांति और नम्रता से, और भक्तिपूर्वक, संचालन करते हुए तुम्हारी कृपा[a] पाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दिए गए यूनानी OCR-पाठ में यहाँ θεοῦ σου पढ़ा जाता है, जो τυγχάνωσιν के साथ व्याकरणतः और प्रसंगतः अत्यन्त कठिन है। सामान्यतः अपेक्षित पाठ ἵλεω σου है, जिसका अर्थ है “तुम्हारी कृपा” या “तुम्हारी अनुकम्पा”; अनुवाद उसी पाठ पर आधारित है।
    reason: दिए गए OCR-पाठ और प्रसंगानुकूल/अपेक्षित यूनानी पाठ के बीच महत्त्वपूर्ण अंतर को पारदर्शी रूप से दिखाना।
lexical_decisions:
- source_word: δέσποτα
  choice: हे स्वामी
  rationale: यह संबोधन परम अधिकार रखनेवाले स्वामी को दर्शाता है; ‘स्वामी’ आधुनिक हिन्दी में dignified और सहज है।
- source_word: βασιλεῦ τῶν αἰώνων
  choice: युगों के ... राजा
  rationale: बहुवचन αἰώνων की कालगत व्यापकता को बनाए रखता है और उसे केवल ‘अनन्त राजा’ में समेटता नहीं।
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: मनुष्यों के पुत्रों को
  rationale: मूल की सेमिटिक शैली को औपचारिक रूप से सुरक्षित रखा गया है; प्रसंग में इसका अर्थ मानव शासक है।
- source_word: τῶν ἐπὶ τῆς γῆς ὑπαρχόντων
  choice: पृथ्वी पर रहनेवालों के ऊपर
  rationale: संबंधवाचक रूप को व्यक्तियों के रूप में लिया गया है, जैसा शासन-संबंधी प्रसंग संकेत करता है, पर किसी विशिष्ट प्रजा-वर्ग को नहीं जोड़ा गया।
- source_word: διεύθυνον
  choice: उस दिशा में ले चलो
  rationale: आज्ञार्थक प्रार्थना का बल स्पष्ट करता है और ‘उनकी मंत्रणा को सीधा/सही दिशा देना’ का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: βουλὴν
  choice: मंत्रणा
  rationale: यहाँ शासकों की सलाह, विचार-विमर्श और नीति-निर्णय का भाव है; ‘मंत्रणा’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: διέποντες
  choice: संचालन करके
  rationale: दिए गए अधिकार को व्यवस्थित रूप से चलाने/प्रयोग करने का भाव व्यक्त करता है।
- source_word: εὐσεβῶς
  choice: भक्ति के साथ
  rationale: ईश्वर के प्रति श्रद्धापूर्ण, धर्मनिष्ठ आचरण का अर्थ देता है, बिना किसी संप्रदायगत विशेषता के।
- source_word: 'ἵλεώ σου (expected reading; supplied OCR: θεοῦ σου)'
  choice: तुम्हारी कृपा
  rationale: τυγχάνω के साथ यह स्वाभाविक यूनानी अर्थ ‘तुम्हारी अनुकम्पा/कृपा पाना’ देता है और उपलब्ध अंग्रेज़ी परामर्श-पाठ से भी मेल खाता है।
theological_decisions:
- issue: राजकीय अधिकार का स्रोत
  choice: ‘तुम ... अधिकार देते हो’ और ‘तुम्हारे दिए हुए अधिकार’
  alternative: अधिकार को केवल मानवीय नियुक्ति या शासकों के स्वाधीन अधिकार के रूप में कहना
  rationale: मूल पाठ स्पष्टतः परमेश्वर को सांसारिक शासन-अधिकार का दाता बताता है; अनुवाद इस कथन को बनाए रखता है, पर शासकों के हर कार्य को दैवी स्वीकृति प्राप्त नहीं बताता।
- issue: शासकों के लिए प्रार्थना का लक्ष्य
  choice: उनकी मंत्रणा परमेश्वर को भली और मनभावनी दिशा में चले तथा वे शांति, नम्रता और भक्ति से शासन करें
  alternative: राजकीय सफलता, विजय या निरंकुश आज्ञापालन पर बल देना
  rationale: मूल प्रार्थना शासन को नैतिक और ईश्वराभिमुख सीमाओं में रखती है; अनुवाद वही तनाव सुरक्षित रखता है।
- issue: अंतिम प्रतिफल
  choice: ‘तुम्हारी कृपा पाएँ’
  alternative: ‘अपने परमेश्वर को पाएँ’
  rationale: प्रेषित OCR का θεοῦ σου व्याकरण और प्रसंग में अत्यंत कठिन है; अपेक्षित ἵλεώ σου तथा परामर्श-पाठ अंतिम वाक्य को दैवी कृपा पाने की याचना बताते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में प्रार्थनामय, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। परमेश्वर के लिए निकट किंतु आदरपूर्ण ‘तुम’ का प्रयोग पूरे वाक्य में सुसंगत है। ‘हे स्वामी’ और ‘हे प्रभु’ मूल के दो अलग संबोधनों δέσποτα और κύριε को बनाए रखते हैं।
