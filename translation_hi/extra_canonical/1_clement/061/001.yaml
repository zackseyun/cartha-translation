  to: हे स्वामी, आपने अपने प्रतापमय और अवर्णनीय सामर्थ्य के द्वारा उन्हें शासन का अधिकार दिया, ताकि हम यह जानकर कि आपने उन्हें महिमा और सम्मान दिया है, उनके अधीन रहें और आपकी इच्छा का किसी भी बात में विरोध न करें। हे प्रभु, उन्हें स्वास्थ्य, शांति, सहमति और स्थिरता प्रदान कीजिए, ताकि वे उस शासन को, जो आपने उन्हें दिया है, निर्विघ्न चला सकें।
  rationale: 'The revision preserves the source''s syntax and its restraint concerning the relationship between submission to rulers and God''s will. It makes only minor lexical and idiomatic adjustments: governmental “शासन” for ἡγεμονία, “सहमति” for concord, and a more idiomatic prayer imperative. No footnote is needed because the retained “निर्विघ्न” adequately preserves the breadth of ἀπροσκόπως without choosing between its possible practical and moral nuances.'
