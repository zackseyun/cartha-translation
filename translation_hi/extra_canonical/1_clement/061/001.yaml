review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the prayer''s central sequence: God grants rulers authority; believers recognize the glory and honor God gave them and submit without opposing God''s will; God is asked to grant rulers health, peace, concord, stability, and effective administration. The final rendering of ἡγεμονία as “नेतृत्व” is somewhat too general for the explicitly governmental context.'
  naturalness: The Hindi is clear, dignified, and suitable for a prayer. “प्रदान करें” is understandable as a reverential imperative, but “प्रदान कीजिए” is more idiomatic in this direct address. “जो शासन आपने उन्हें दिया है” also reads more naturally and precisely than “आपके द्वारा दिए गए नेतृत्व.”
  terminology: “हे स्वामी” for δέσποτα and “हे प्रभु” for κύριε appropriately preserve the distinct addresses. “शासन का अधिकार,” “महिमा और सम्मान,” and “निर्विघ्न” are sound. “सहमति” better represents ὁμόνοια here as concord than the broader “एकता.”
  issues:
  - severity: low
    issue: ἡγεμονία is rendered “नेतृत्व.”
    rationale: Although “नेतृत्व” can refer to governing, it can also mean generic leadership. In this prayer for civil rulers, “शासन” more directly retains the governmental sense of ἡγεμονία.
  - severity: low
    issue: ὁμόνοια is rendered “एकता.”
    rationale: “एकता” is acceptable, but “सहमति” more specifically conveys concord or harmony of mind, the sense of ὁμόνοια.
  - severity: low
    issue: Direct prayer imperative “प्रदान करें.”
    rationale: It is intelligible, but “प्रदान कीजिए” is the more natural modern Hindi polite imperative in direct address to God.
  revised_text: हे स्वामी, आपने अपने प्रतापमय और अवर्णनीय सामर्थ्य के द्वारा उन्हें शासन का अधिकार दिया, ताकि हम यह जानकर कि आपने उन्हें महिमा और सम्मान दिया है, उनके अधीन रहें और आपकी इच्छा का किसी भी बात में विरोध न करें। हे प्रभु, उन्हें स्वास्थ्य, शांति, सहमति और स्थिरता प्रदान कीजिए, ताकि वे उस शासन को, जो आपने उन्हें दिया है, निर्विघ्न चला सकें।
