id: 1CLEM.61.1
reference: 1 Clement 61:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: Σύ, δέσποτα, ἔδωκας τὴν ἐξουσίαν τῆς βασιλείας αὐτοῖς διὰ τοῦ μεγαλοπρεποῦς καὶ ἀνεκδιηγήτου κράτους σου, εἰς τὸ γινώσκοντας ἡμᾶς τὴν ὑπὸ σοῦ αὐτοῖς δεδομένην δόξαν καὶ τιμὴν ὑποτάσσεσθαι αὐτοῖς, μηδὲν ἐναντιουμένους τῷ θελήματί σου· οἷς δός, κύριε, ὑγίειαν, εἰρήνην, ὁμόνοιαν, εὐστάθειαν, εἰς τὸ διέπειν αὐτοὺς τὴν ὑπὸ σοῦ δεδομένην αὐτοῖς ἡγεμονίαν ἀπροσκόπως.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/061/001.yaml
  text: You, Master, gave them the authority of rule through your magnificent and indescribable might, so that, knowing the glory and honor given to them by you, we might submit ourselves to them, opposing your will in nothing. Grant to them, Lord, health, peace, concord, and stability, so that they may administer without offense the leadership you have given them.
translation:
  language: hi
  text: हे स्वामी, आपने अपने प्रतापमय और अवर्णनीय सामर्थ्य के द्वारा उन्हें शासन का अधिकार दिया, ताकि हम यह जानकर कि आपने उन्हें महिमा और सम्मान दिया है, उनके अधीन रहें और आपकी इच्छा का किसी भी बात में विरोध न करें। हे प्रभु, उन्हें स्वास्थ्य, शांति, सहमति और स्थिरता प्रदान कीजिए, ताकि वे उस शासन को, जो आपने उन्हें दिया है, निर्विघ्न चला सकें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέσποτα
  choice: हे स्वामी
  rationale: संबोधन में परम अधिकार और प्रभुता का भाव रखता है; आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ἐξουσίαν τῆς βασιλείας
  choice: शासन का अधिकार
  rationale: यहाँ βασιλεία राजकीय शासन को सूचित करता है; 'राज्य का अधिकार' की संभावित अस्पष्टता से बचते हुए शासकीय सत्ता का अर्थ स्पष्ट किया गया है।
- source_word: μεγαλοπρεποῦς καὶ ἀνεκδιηγήτου κράτους
  choice: प्रतापमय और अवर्णनीय सामर्थ्य
  rationale: κράτος की प्रबल शक्ति तथा μεγαλοπρεπής की वैभवपूर्ण महानता को संक्षिप्त, गरिमापूर्ण हिन्दी में रखा गया है।
- source_word: δόξαν καὶ τιμὴν
  choice: महिमा और सम्मान
  rationale: दोनों समन्वित संज्ञाओं का भेद बनाए रखते हुए पारंपरिक किंतु सहज समतुल्य चुने गए हैं।
- source_word: ὁμόνοιαν
  choice: एकता
  rationale: मूल में मनों की सहमति और सामंजस्य का भाव है; सामान्य हिन्दी पाठक के लिए 'एकता' सहज है।
- source_word: εὐστάθειαν
  choice: स्थिरता
  rationale: व्यवस्था की दृढ़, स्थिर दशा को सीधे व्यक्त करता है।
- source_word: ἡγεμονίαν
  choice: नेतृत्व
  rationale: यह शासकीय पद और अधिकार-क्षेत्र का संकेत देता है; प्रसंग में 'नेतृत्व' स्वाभाविक है और इसे परम सार्वभौम शासन के अर्थ में अतिरंजित नहीं करता।
- source_word: ἀπροσκόπως
  choice: निर्विघ्न
  rationale: क्रियाविशेषण शासन-संचालन के बिना ठोकर, बाधा या आपत्तिजनक चूक के होने को व्यक्त कर सकता है; 'निर्विघ्न' इस व्यापकता को संक्षेप में रखता है।
theological_decisions:
- issue: शासकों के प्रति अधीनता और परमेश्वर की इच्छा का संबंध
  choice: उनके अधीन रहें और आपकी इच्छा का किसी भी बात में विरोध न करें
  alternative: उनके अधीन रहें, क्योंकि हम आपकी इच्छा का किसी बात में विरोध नहीं करते
  rationale: यूनानी participle μηδὲν ἐναντιουμένους अधीन रहने वाले 'हम' से जुड़ता है। अनुवाद दोनों विचारों को साथ रखता है, पर यह अतिरिक्त दावा नहीं करता कि शासकों की हर आज्ञा स्वतः परमेश्वर की इच्छा है।
- issue: ἀπροσκόπως का नैतिक या व्यावहारिक अर्थ
  choice: निर्विघ्न संचालन
  alternative: बिना किसी को ठोकर पहुँचाए संचालन
  rationale: शब्द दोनों अर्थ-संभावनाएँ रखता है। संदर्भ में प्रशासन की कुशल और बाधारहित पूर्ति प्रमुख लगती है; किसी विशिष्ट नैतिक व्याख्या को थोपने से बचा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, प्रार्थनात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। परमेश्वर के लिए आदरसूचक बहुवचन क्रियारूप ('आपने', 'करें') और शासकों के लिए सामान्य बहुवचन प्रयोग हुआ है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
