id: 1CLEM.4.1
reference: 1 Clement 4:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: Γέγραπται γὰρ οὕτως· Καὶ ἐγένετο μεθ' ἡμέρας, ἤνεγκεν Κάϊν ἀπὸ τῶν καρπῶν τῆς γῆς θυσίαν τῷ θεῷ, καὶ Ἄβελ ἤνεγκεν καὶ αὐτὸς ἀπὸ τῶν πρωτοτόκων τῶν προβάτων καὶ ἀπὸ τῶν στεάτων αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/001.yaml
  text: 'For it is written thus: “And it came to pass after some days that Cain brought from the fruits of the earth an offering to God, and Abel also brought from the firstborn of the sheep and from their fat portions.'
translation:
  language: hi
  text: 'क्योंकि ऐसा लिखा है: “और कुछ दिनों के बाद ऐसा हुआ कि कैन भूमि की उपज में से परमेश्वर के लिए एक भेंट लाया, और हाबिल भी भेड़ों के पहलौठों में से और उनकी चर्बी में से लाया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γέγραπται γὰρ οὕτως
  choice: क्योंकि ऐसा लिखा है
  rationale: ग्रीक के कारणसूचक γὰρ और उद्धरण-परिचायक οὕτως को सहज तथा निकट रूप में रखा गया है।
- source_word: μεθ' ἡμέρας
  choice: कुछ दिनों के बाद
  rationale: शाब्दिक अर्थ ‘दिनों के बाद’ है; हिन्दी में अर्थ स्पष्ट और स्वाभाविक करने के लिए ‘कुछ’ जोड़ा गया है, जैसा संदर्भ में अभिप्रेत है।
- source_word: ἀπὸ τῶν καρπῶν τῆς γῆς
  choice: भूमि की उपज में से
  rationale: καρποί यहाँ पेड़ों के फल तक सीमित नहीं, बल्कि भूमि की पैदावार को दर्शाता है; ‘उपज’ इस व्यापकता को बनाए रखता है।
- source_word: θυσίαν
  choice: एक भेंट
  rationale: संदर्भ में परमेश्वर को चढ़ाई गई वस्तु अभिप्रेत है; ‘भेंट’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से रक्तबलि का संकेत नहीं देती।
- source_word: τῶν πρωτοτόκων τῶν προβάτων
  choice: भेड़ों के पहलौठों में से
  rationale: πρωτότοκα झुंड में पहले जन्मे पशुओं को दर्शाता है; ‘पहलौठे’ बाइबलीय संदर्भ में सटीक और परिचित शब्द है।
- source_word: τῶν στεάτων αὐτῶν
  choice: उनकी चर्बी में से
  rationale: στεάτων का सीधा अर्थ पशुओं की चर्बी अथवा मोटे भाग हैं; मूल की ठोस बलिदानी भाषा सुरक्षित रखी गई है।
theological_decisions:
- issue: कैन और हाबिल की भेंटों के मूल्यांकन का संकेत
  choice: केवल लाई गई भेंटों का वर्णन किया गया; स्वीकृति या अस्वीकृति का कारण नहीं जोड़ा गया।
  alternative: भेंटों की गुणवत्ता या हृदय की दशा पर व्याख्यात्मक संकेत जोड़ना।
  rationale: इस पद का यूनानी पाठ केवल दोनों भेंटों का विवरण देता है; धर्मवैचारिक निष्कर्ष अगले संदर्भ पर छोड़ना मूल की तनावपूर्ण संक्षिप्तता को बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय शैली अपनाई गई है। उद्धरण इस अंश में समाप्त नहीं होता, इसलिए आरंभिक उद्धरण-चिह्न रखा गया है पर समापन-चिह्न नहीं।
