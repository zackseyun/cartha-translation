translation:
  language: hi
  text: ईर्ष्या के कारण हारून और मरियम ने छावनी के बाहर डेरा डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ ζῆλος
  choice: ईर्ष्या के कारण
  rationale: ग्रीक पद कारण व्यक्त करता है। ζῆλος यहाँ प्रसंगानुसार नकारात्मक भाव—ईर्ष्या—रखता है।
- source_word: παρεμβολῆς
  choice: छावनी
  rationale: इस्राएली समुदाय के शिविर के लिए स्वाभाविक और प्रचलित हिन्दी शब्द।
- source_word: ηὐλίσθησαν
  choice: डेरा डाला
  rationale: क्रिया का मूल अर्थ खुले स्थान में ठहरना या रात बिताना है; छावनी के प्रसंग में ‘डेरा डाला’ स्वाभाविक है और केवल सामान्य निवास की अपेक्षा मूल बिंब को बेहतर रखता है।
theological_decisions:
- issue: हारून और मरियम के छावनी से बाहर होने का कारण
  choice: 'वाक्य की संक्षिप्त कारणात्मक अस्पष्टता बनाए रखी गई: ‘ईर्ष्या के कारण’।'
  alternative: इसे दंड, कुष्ठ रोग, या किसी विशेष व्यक्ति की ईर्ष्या के रूप में स्पष्ट करना।
  rationale: ग्रीक पाठ स्वयं कर्ता या दंड की पूरी परिस्थिति नहीं बताता; अनुवाद में गिनती 12 की कथा से अतिरिक्त विवरण नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज वाक्य। ‘हारून’ और ‘मरियम’ हिन्दी बाइबलीय परंपरा के परिचित नाम-रूप हैं।
