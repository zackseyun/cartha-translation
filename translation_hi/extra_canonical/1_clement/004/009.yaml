  language: en
  yaml_path: translation/extra_canonical/1_clement/004/009.yaml
  text: Jealousy caused Joseph to be persecuted even to death and to enter into slavery[a].
translation:
  language: hi
  text: ईर्ष्या के कारण यूसुफ को मृत्यु की हद तक सताया गया और वह दासता में जा पहुँचा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या अधिक शाब्दिक रूप में: “ईर्ष्या ने यूसुफ को मृत्यु की हद तक सताया जाने और दासता में प्रवेश करने तक पहुँचाया।”'
    reason: यूनानी के दोनों μέχρι-वाक्यांशों की समानांतर सीमा-संरचना को दिखाता है। ‘मृत्यु की हद तक’ का अर्थ यह नहीं कि यूसुफ वास्तव में मर गया।
lexical_decisions:
- source_word: ζῆλος
  choice: ईर्ष्या
  rationale: यहाँ शब्द उस द्वेषपूर्ण ईर्ष्या को दर्शाता है जिसके कारण यूसुफ के भाइयों ने उसके विरुद्ध कार्रवाई की।
- source_word: ἐποίησεν
  choice: के कारण … गया / जाना पड़ा
  rationale: यूनानी की कारक रचना को स्वाभाविक हिन्दी में कारणसूचक ढंग से व्यक्त किया गया है।
- source_word: διωχθῆναι
  choice: सताया गया
  rationale: निष्क्रिय क्रिया का अर्थ पीछा किए जाने या उत्पीड़ित किए जाने का है; संदर्भ में ‘सताया गया’ सहज और पर्याप्त व्यापक है।
- source_word: μέχρι θανάτου
  choice: मृत्यु की हद तक
  rationale: μέχρι सीमा या चरम बिंदु बताता है। यह अनुवाद उत्पीड़न के प्राणघातक स्तर तक पहुँचने को व्यक्त करता है, बिना यह कहे कि यूसुफ वास्तव में मर गया।
- source_word: μέχρι δουλείας εἰσελθεῖν
  choice: दासता में जाना पड़ा
  rationale: शाब्दिक भाव ‘दासता तक/में प्रवेश करना’ है; हिन्दी में अनैच्छिक परिस्थिति को स्वाभाविक रूप से व्यक्त करने के लिए ‘जाना पड़ा’ चुना गया है।
theological_decisions:
- issue: क्या μέχρι θανάτου का अर्थ यूसुफ की वास्तविक मृत्यु है?
  choice: ‘मृत्यु की हद तक’—प्राणघातक सीमा तक उत्पीड़न
  alternative: ‘मृत्यु तक सताया गया’
  rationale: यूनानी वाक्यांश सीमा या चरम तक पहुँचने का अर्थ दे सकता है। यूसुफ-कथा में उसकी हत्या का इरादा था, पर वह मरा नहीं; इसलिए अनुवाद को वास्तविक मृत्यु का अनावश्यक संकेत नहीं देना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। ‘दासता’ प्राचीन सामाजिक स्थिति के लिए स्पष्ट है, और ‘मृत्यु की हद तक’ मूल की तीव्रता रखते हुए यूसुफ की वास्तविक मृत्यु का भ्रम टालता है।
