  text: καὶ εἶπεν ὁ θεὸς πρὸς Κάϊν· Ἱνατί περίλυπος ἐγένου, καὶ ἱνατί συνέπεσεν τὸ πρόσωπόν σου; οὐκ ἐὰν ὀρθῶς προσενέγκῃς, ὀρθῶς δὲ μὴ διέλῃς, ἥμαρτες;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/004.yaml
  text: And God said to Cain, ‘Why have you become grieved, and why has your face fallen? If you offer rightly, but do not divide rightly, have you not sinned?’
translation:
  language: hi
  text: और परमेश्वर ने कैन से कहा, “तू क्यों दुःखी हो गया है, और तेरा मुख क्यों उतर गया है? यदि तू ठीक रीति से भेंट चढ़ाए, पर ठीक रीति से विभाजन न करे, तो क्या तूने पाप नहीं किया?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίλυπος
  choice: दुःखी
  rationale: यह स्वाभाविक आधुनिक हिन्दी में गहरे शोक या व्यथा का अर्थ व्यक्त करता है, पर मूल से अधिक तीव्रता नहीं जोड़ता।
- source_word: συνέπεσεν τὸ πρόσωπόν σου
  choice: तेरा मुख उतर गया है
  rationale: यह यूनानी रूपक का स्वाभाविक हिन्दी समतुल्य है और उदासी या खिन्नता की मुख-मुद्रा बनाए रखता है।
- source_word: προσενέγκῃς
  choice: भेंट चढ़ाए
  rationale: संदर्भ में क्रिया धार्मिक अर्पण को सूचित करती है; ‘भेंट चढ़ाना’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: διέλῃς
  choice: उसका विभाजन करे
  rationale: क्रिया के ‘बाँटना/विभाजित करना’ अर्थ को सुरक्षित रखता है; अस्पष्ट कर्म को निकटवर्ती भेंट से जोड़ने के लिए ‘उसका’ रखा गया है, बिना यह तय किए कि विभाजन किस रीति का है।
- source_word: ἥμαρτες
  choice: तूने पाप नहीं किया
  rationale: प्रश्नवाचक οὐκ के साथ अपेक्षित सकारात्मक उत्तर वाली रचना को हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: कैन की भेंट में त्रुटि का स्वरूप
  choice: ‘ठीक रीति से उसका विभाजन न करे’ को यथावत रखा
  alternative: ‘ठीक रीति से बाँटे नहीं’ अथवा त्रुटि को नैतिक मनोभाव से समझाकर अनुवाद करना
  rationale: यूनानी पाठ विभाजन की प्रकृति स्पष्ट नहीं करता। अनुवाद उसकी विधिक/अनुष्ठानिक संभावना और वास्तविक अस्पष्टता दोनों सुरक्षित रखता है।
- issue: अंतिम वाक्य का प्रश्नात्मक रूप
  choice: ‘तो क्या तूने पाप नहीं किया?’
  alternative: ‘तो तू पाप करता है’
  rationale: मूल में प्रश्न है; उसे कथन में बदलना पाठ के आलंकारिक तनाव को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में dignified किंतु सरल शैली अपनाई गई है। कैन को एकवचन ‘तू’ से संबोधित करना मूल के निकट और बाइबिलीय प्रत्यक्ष संबोधन में स्वाभाविक है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
