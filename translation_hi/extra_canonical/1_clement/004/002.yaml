source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ εἶδεν ὁ θεὸς ἐπὶ Ἄβελ καὶ ἐπὶ τοῖς δώροις αὐτοῦ, ἐπὶ δὲ Κάϊν καὶ ἐπὶ ταῖς θυσίαις αὐτοῦ οὐ προσέσχεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/002.yaml
  text: And God looked upon Abel and upon his gifts[a], but to Cain and to his sacrifices he paid no heed.
translation:
  language: hi
  text: और परमेश्वर ने हाबिल और उसकी भेंटों पर कृपादृष्टि की, परन्तु कैन और उसके बलिदानों पर उसने ध्यान नहीं दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδεν ... ἐπὶ
  choice: पर कृपादृष्टि की
  rationale: शाब्दिक अर्थ ‘पर दृष्टि की’ है, पर प्रसंग में यह अनुकूलता से स्वीकार करने को व्यक्त करता है; ‘कृपादृष्टि की’ इस भाव को गरिमापूर्ण और स्वाभाविक हिन्दी में रखता है।
- source_word: δῶρα
  choice: भेंटों
  rationale: यह हाबिल द्वारा परमेश्वर को अर्पित वस्तुओं के लिए सामान्य शब्द है; ‘भेंटें’ और आगे का अधिक विशिष्ट ‘बलिदान’ अलग रखे गए हैं।
- source_word: θυσίαις
  choice: बलिदानों
  rationale: θυσία के यज्ञीय/बलिदानी अर्थ का सीधा और प्रचलित हिन्दी रूप।
- source_word: οὐ προσέσχεν
  choice: ध्यान नहीं दिया
  rationale: προσέχω यहाँ ध्यान देने, मान देने या स्वीकार करने का भाव रखता है। सरल हिन्दी ‘ध्यान नहीं दिया’ मूल की अभिव्यक्ति को अनावश्यक रूप से अधिक निर्णायक बनाए बिना सुरक्षित रखती है।
theological_decisions:
- issue: परमेश्वर की दृष्टि और ध्यान का अर्थ
  choice: पहले खंड में ‘कृपादृष्टि की’ और दूसरे में ‘ध्यान नहीं दिया’
  alternative: ‘स्वीकार किया ... स्वीकार नहीं किया’
  rationale: ‘स्वीकार किया’ प्रसंगगत अर्थ है, किंतु यूनानी पाठ के ‘देखा/दृष्टि की’ और ‘ध्यान दिया’ रूपकों को पूरी तरह समाप्त कर देता। चुना हुआ पाठ स्वाभाविक हिन्दी के साथ मूल की शब्दगत और धर्मवैचारिक तनातनी बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, शास्त्रीय किंतु सामान्य पाठक के लिए सुबोध शैली। नामों के प्रचलित हिन्दी रूप ‘हाबिल’ और ‘कैन’ रखे गए हैं।
