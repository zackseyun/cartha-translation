  yaml_path: translation/extra_canonical/1_clement/004/006.yaml
  text: And Cain said to Abel his brother[a], ‘Let us go into the field.’ And it came to pass, while they were in the field, Cain rose up against Abel his brother and killed him.
translation:
  language: hi
  text: और कैन ने अपने भाई हाबिल से कहा, “आओ, हम मैदान में चलें।” और ऐसा हुआ कि जब वे मैदान में थे, तब कैन अपने भाई हाबिल पर टूट पड़ा और उसे मार डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διέλθωμεν εἰς τὸ πεδίον
  choice: आओ, हम मैदान में चलें
  rationale: संदर्भ में यह वाक्य एक स्थान से मैदान की ओर जाने का निमंत्रण है। सहज हिन्दी में ‘मैदान में चलें’ ग्रीक दिशा-बोध को व्यक्त करता है; ‘मैदान से होकर चलें’ अनावश्यक रूप से उसे पार करने का भाव जोड़ता।
- source_word: ἀνέστη ... ἐπʼ
  choice: पर टूट पड़ा
  rationale: यहाँ क्रिया और पूर्वसर्ग मिलकर शत्रुतापूर्ण ढंग से उठकर आक्रमण करने का भाव देते हैं। ‘पर टूट पड़ा’ आधुनिक हिन्दी में इस हिंसक कार्रवाई को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπέκτεινεν
  choice: मार डाला
  rationale: ग्रीक क्रिया स्पष्ट रूप से हत्या कर देने को बताती है; ‘मार डाला’ सामान्य, सटीक और प्रभावशाली हिन्दी है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक शैली सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल रखी गई है। ‘अपने भाई हाबिल’ की पुनरावृत्ति स्रोत की नैतिक और भावात्मक तीव्रता बनाए रखने के लिए सुरक्षित रखी गई है।
