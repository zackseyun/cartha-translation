  text: διὰ ζῆλος Δαυὶδ φθόνον ἔσχεν οὐ μόνον ὑπὸ τῶν ἀλλοφύλων, ἀλλὰ καὶ ὑπὸ Σαοὺλ βασιλέως Ἰσραὴλ ἐδιώχθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/013.yaml
  text: Because of jealousy David incurred envy not only from the foreigners[a], but was also persecuted by Saul king of Israel.
translation:
  language: hi
  text: ईर्ष्या के कारण दाऊद न केवल विदेशियों[a] की ईर्ष्या का पात्र बना, बल्कि इस्राएल के राजा शाऊल ने भी उसे सताया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ ‘दूसरे लोगों’ या ‘विदेशियों’ है; पुराने नियम के यूनानी प्रयोग में इससे अक्सर पलिश्ती अभिप्रेत होते हैं।
    reason: मुख्य पाठ में शब्द का व्यापक अर्थ रखा गया है; पादटिप्पणी दाऊद के प्रसंग में सम्भावित पारंपरिक, अधिक विशिष्ट संकेत बताती है।
lexical_decisions:
- source_word: διὰ ζῆλος
  choice: ईर्ष्या के कारण
  rationale: पाठ में रूप असामान्य है (अपेक्षित रूप ζῆλον), पर अर्थ स्पष्टतः कारण बताता है; हिन्दी में स्वाभाविक और प्रसंगानुकूल अभिव्यक्ति चुनी गई है।
- source_word: φθόνον ἔσχεν ... ὑπὸ
  choice: की ईर्ष्या का पात्र बना
  rationale: यह मुहावरा दाऊद के दूसरों की ईर्ष्या का निशाना बनने को व्यक्त करता है। यह अनुवाद यूनानी रचना का अर्थ बनाए रखते हुए हिन्दी में स्वाभाविक है।
- source_word: τῶν ἀλλοφύλων
  choice: पराए लोगों
  rationale: शब्द का मूल अर्थ दूसरे समुदाय या जाति के लोग है; पुराने नियम के यूनानी प्रयोग में यह विशेष रूप से पलिश्तियों को भी सूचित कर सकता है। मुख्य पाठ में व्यापक शब्द रखकर संभावित संकेत को पादटिप्पणी में बताया गया है।
- source_word: ἐδιώχθη
  choice: उसे सताया
  rationale: निष्क्रिय यूनानी क्रिया को हिन्दी की अधिक स्वाभाविक सक्रिय रचना में व्यक्त किया गया है, जिसमें कर्ता शाऊल स्पष्ट है।
theological_decisions:
- issue: ईर्ष्या के लिए ζῆλος और φθόνος का संबंध
  choice: दोनों को ‘ईर्ष्या’ से व्यक्त करते हुए कारण और अनुभव का भेद वाक्य-रचना से दिखाया गया
  alternative: पहले शब्द को ‘जलन’ और दूसरे को ‘डाह’ कहना
  rationale: यहाँ दोनों निकटार्थी हैं; अलग-अलग दुर्लभ या कृत्रिम पर्याय रखने के बजाय ‘ईर्ष्या के कारण’ और ‘ईर्ष्या का पात्र’ से मूल की पुनरुक्ति तथा तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘ईर्ष्या का पात्र बना’ मूल मुहावरे का अर्थ स्पष्ट करता है, और समानार्थी यूनानी शब्दों की जानबूझकर की गई पुनरुक्ति बनाए रखता है।
