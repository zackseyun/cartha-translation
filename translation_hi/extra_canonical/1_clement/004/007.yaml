lexical_decisions:
- source_word: ὁρᾶτε
  choice: देखो
  rationale: वर्तमान आज्ञार्थक का सीधा और स्वाभाविक हिन्दी रूप; पाठकों को पिछले उदाहरणों पर ध्यान देने के लिए बुलाता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: प्रत्यक्ष सम्बोधन को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ζῆλος καὶ φθόνος
  choice: ईर्ष्या और डाह
  rationale: दो निकटार्थक यूनानी शब्दों की युगल अभिव्यक्ति को दो अलग हिन्दी शब्दों से सुरक्षित रखता है; यहाँ ζῆλος का नकारात्मक अर्थ संदर्भ से स्पष्ट है।
- source_word: ἀδελφοκτονίαν
  choice: भाई की हत्या
  rationale: यूनानी संयुक्त शब्द का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है और ἀδελφοί के साथ 'भाई' की आलंकारिक पुनरावृत्ति भी बनाए रखता है।
- source_word: κατειργάσατο
  choice: करवा दी
  rationale: 'मध्य रूप और परिणामकारी अर्थ को कारणवाचक हिन्दी में व्यक्त करता है: ईर्ष्या और डाह ने भाई की हत्या को घटित कराया।'
