source:
  edition: Funk 1901 (normalized OCR)
  text: ζῆλος Δαθὰν καὶ Ἀβειρὼν ζῶντας κατήγαγεν εἰς ᾅδου διὰ τὸ στασιάσαι αὐτοὺς πρὸς τὸν θεράποντα τοῦ θεοῦ Μωυσῆν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/012.yaml
  text: Jealousy brought Dathan and Abiram down alive into Hades because they rebelled against Moses[a], the servant of God.
translation:
  language: hi
  text: ईर्ष्या दातान और अबीराम को जीवित ही अधोलोक में उतार ले गई, क्योंकि उन्होंने परमेश्वर के सेवक[a] मूसा के विरुद्ध विद्रोह किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परिचर।” यहाँ प्रयुक्त यूनानी शब्द सम्मानसूचक रूप में परमेश्वर की सेवा करनेवाले व्यक्ति को दर्शाता है।
    reason: θεράπων के सामान्य अर्थ ‘परिचर/सेवा करनेवाला’ और मूसा के लिए उसके सम्मानसूचक बाइबलीय प्रयोग—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: ζῆλος
  choice: ईर्ष्या
  rationale: यहाँ प्रसंग में विनाशकारी jealousy/envy का भाव है; ‘ईर्ष्या’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ζῶντας κατήγαγεν εἰς ᾅδου
  choice: जीवित ही अधोलोक में उतार ले गई
  rationale: ‘जीवित ही’ ζῶντας पर बल बनाए रखता है, और ‘अधोलोक’ ᾅδης को किसी बाद की विशिष्ट नरक-कल्पना से मिलाए बिना व्यक्त करता है।
- source_word: στασιάσαι ... πρὸς
  choice: के विरुद्ध विद्रोह किया
  rationale: क्रिया का अर्थ गुटबंदी करके सत्ता के विरुद्ध उठ खड़ा होना है; ‘विद्रोह किया’ इस प्रसंग में संक्षिप्त और स्वाभाविक है।
- source_word: θεράποντα τοῦ θεοῦ
  choice: परमेश्वर के सेवक
  rationale: मूसा के लिए यह सम्मानसूचक बाइबलीय पदवी है; ‘सेवक’ उसके धार्मिक और साहित्यिक अनुनाद को बनाए रखता है।
theological_decisions:
- issue: ᾅδου का स्वरूप
  choice: अधोलोक
  alternative: हेडेस
  rationale: ‘अधोलोक’ मृतकों के लोक का व्यापक अर्थ देता है और पाठ से परे जाकर अंतिम दण्ड या नरक का अर्थ आरोपित नहीं करता।
- issue: मूसा के लिए θεράπων की पदवी
  choice: सेवक
  alternative: परिचर
  rationale: ‘सेवक’ मूसा के सम्मानसूचक बाइबलीय पद को बेहतर व्यक्त करता है, जबकि शब्द की वैकल्पिक सामान्य छाया को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की कारणात्मक संरचना तथा ‘जीवित ही’ पर मूल यूनानी का बल सुरक्षित है।
