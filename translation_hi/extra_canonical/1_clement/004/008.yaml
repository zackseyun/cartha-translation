translation:
  language: hi
  text: ईर्ष्या के कारण हमारे पूर्वज याकूब अपने भाई एसाव के सामने से भाग गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ ζῆλος
  choice: ईर्ष्या के कारण
  rationale: ग्रीक पद कारण व्यक्त करता है। ζῆλος यहाँ उस ईर्ष्या को सूचित करता है जिसके कारण याकूब को भागना पड़ा; हिंदी में यह वाक्य जानबूझकर कर्ता को अनिर्दिष्ट रखता है, जैसा स्रोत में है।
- source_word: ὁ πατὴρ ἡμῶν
  choice: हमारे पूर्वज
  rationale: शाब्दिक अर्थ 'हमारे पिता' है, पर याकूब जैसे प्राचीन कुलपिता के लिए आधुनिक हिंदी में 'हमारे पूर्वज' अधिक स्वाभाविक और स्पष्ट है।
- source_word: ἀπέδρα
  choice: भाग गए
  rationale: क्रिया संकट से बच निकलने अथवा पलायन करने का भाव रखती है; 'भाग गए' सरल और सटीक हिंदी है।
- source_word: ἀπὸ προσώπου Ἠσαῦ
  choice: एसाव के सामने से
  rationale: πρόσωπον की स्रोत-भाषाई छवि को बनाए रखते हुए यह स्वाभाविक हिंदी प्रयोग है और एसाव की उपस्थिति से दूर भागने का अर्थ देता है।
- source_word: τοῦ ἀδελφοῦ αὐτοῦ
  choice: अपने भाई
  rationale: संबंध को सहज हिंदी में व्यक्त करता है और स्पष्ट करता है कि एसाव याकूब का भाई था।
