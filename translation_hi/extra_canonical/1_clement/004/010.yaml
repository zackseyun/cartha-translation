source:
  edition: Funk 1901 (normalized OCR)
  text: ζῆλος φυγεῖν ἠνάγκασεν Μωυσῆν ἀπὸ προσώπου Φαραὼ βασιλέως Αἰγύπτου ἐν τῷ ἀκοῦσαι αὐτὸν ἀπὸ τοῦ ὁμοφύλου· Τίς σε κατέστησεν κριτὴν ἢ δικαστὴν ἐφʼ ἡμῶν; μὴ ἀνελεῖν με σὺ θέλεις, ὃν τρόπον ἀνεῖλες ἐχθὲς τὸν Αἰγύπτιον;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/010.yaml
  text: Jealousy compelled Moses to flee from the presence of Pharaoh king of Egypt[a], when he heard from his fellow tribesman, ‘Who appointed you judge or magistrate over us? Do you want to kill me, as you killed the Egyptian yesterday?’
translation:
  language: hi
  text: ईर्ष्या ने मूसा को मिस्र के राजा फ़िरौन की उपस्थिति से भागने को विवश कर दिया, जब उसने अपने ही लोगों में से एक व्यक्ति को यह कहते सुना, “किसने तुम्हें हम पर न्यायाधीश या दंडाधिकारी नियुक्त किया है? क्या तुम मुझे मार डालना चाहते हो, जैसे तुमने कल उस मिस्री को मार डाला था?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: ईर्ष्या
  rationale: यहाँ प्रसंग में द्वेषपूर्ण ईर्ष्या अभिप्रेत है; ‘जलन’ की अपेक्षा ‘ईर्ष्या’ अधिक dignified और सटीक है।
- source_word: ἀπὸ προσώπου Φαραὼ
  choice: फ़िरौन के सामने से
  rationale: यूनानी मुहावरे के ‘उपस्थिति/सामने’ भाव को स्वाभाविक हिन्दी में रखा गया है।
- source_word: ὁμοφύλου
  choice: अपने ही जाति-भाई
  rationale: शाब्दिक अर्थ समान जाति या समुदाय के व्यक्ति का है; यह मूसा के साथी इब्रानी को स्पष्ट करता है।
- source_word: κριτὴν ἢ δικαστὴν
  choice: न्यायी या दंडाधिकारी
  rationale: क्लेमेंट के पाठ में आए दो पृथक न्यायिक पदों को बनाए रखा गया है; परिचित निर्गमन-पाठ के ‘शासक’ को आयात नहीं किया गया।
- source_word: ἀνελεῖν
  choice: मार डालना
  rationale: संदर्भ में क्रिया का स्पष्ट अर्थ हत्या करना है और अगले खंड की समान क्रिया से संबंध बनाए रखता है।
theological_decisions:
- issue: क्लेमेंट के उद्धरण को निर्गमन 2:14 के प्रचलित पाठ से मिलाना
  choice: κριτής और δικαστής को दो न्यायिक पदों—‘न्यायी या दंडाधिकारी’—के रूप में अनूदित किया
  alternative: ‘शासक या न्यायी’
  rationale: मौजूदा यूनानी स्रोत में ἄρχων (‘शासक’) नहीं, बल्कि दो न्यायिक संज्ञाएँ हैं; इसलिए क्लेमेंट की वास्तविक शब्दावली सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। प्रत्यक्ष कथन में स्रोत की तीक्ष्णता और प्रश्नात्मक स्वर बनाए गए हैं।
