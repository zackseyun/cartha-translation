review_pass:
  verdict: revise
  source_fidelity: Draft accurately conveys the body analogy, mutual dependence, necessity of the smallest members, the vivid συνεπνεῖ image, and the purpose of preserving the whole body. However, “एक ही अधीनता में रहते हैं” renders a state of being rather than χρῆται, which expresses using, exercising, or following the one submission.
  naturalness: The Hindi is generally clear and suitably formal. “अपने शरीर को ही लें” is understandable, but “अपने शरीर को उदाहरण के रूप में लें” more naturally introduces the analogy. “एक ही अधीनता का पालन करते हैं” is more idiomatic and retains the verbal force of the Greek.
  terminology: “अधीनता” appropriately represents ὑποταγή without adding a specific authority or doctrinal interpretation. “सुरक्षित रहे” suitably conveys σώζεσθαι in this bodily-unity context.
  issues:
  - severity: medium
    issue: Final clause weakens χρῆται
    rationale: “एक ही अधीनता में रहते हैं” means ‘remain in one submission’ and does not adequately express χρῆται (‘use/exercise/practice’). The translation should retain both the unified submission and the active verbal idea.
  - severity: low
    issue: Introduction to the analogy is slightly less natural than it could be
    rationale: The Greek imperative invites readers to consider the body. Explicitly saying “उदाहरण के रूप में” makes that function clear in idiomatic Hindi without materially adding to the sense.
