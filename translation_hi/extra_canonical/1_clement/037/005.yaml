id: 1CLEM.37.5
reference: 1 Clement 37:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: λάβωμεν τὸ σῶμα ἡμῶν· ἡ κεφαλὴ δίχα τῶν ποδῶν οὐδέν ἐστιν, οὕτως οὐδὲ οἱ πόδες δίχα τῆς κεφαλῆς· τὰ δὲ ἐλάχιστα μέλη τοῦ σώματος ἡμῶν ἀναγκαῖα καὶ εὔχρηστά εἰσιν ὅλῳ τῷ σώματι· ἀλλὰ πάντα συνεπνεῖ καὶ ὑποταγῇ μιᾷ χρῆται εἰς τὸ σώζεσϑαι ὅλον τὸ σῶμα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/005.yaml
  text: 'Let us take our body as an example: the head is nothing without the feet; likewise the feet are nothing without the head. Even the smallest members of our body are necessary and useful to the whole body. But all breathe together and make use of one submission[a], so that the whole body may be preserved.'
translation:
  language: hi
  text: 'आइए, अपने शरीर को उदाहरण के रूप में लें: पैरों के बिना सिर कुछ नहीं है, और उसी तरह सिर के बिना पैर भी कुछ नहीं हैं। हमारे शरीर के सबसे छोटे अंग भी पूरे शरीर के लिए आवश्यक और उपयोगी हैं। परन्तु सभी अंग एक साथ साँस लेते हैं और एक ही अधीनता का पालन करते हैं[a], ताकि पूरा शरीर सुरक्षित रहे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “एक ही अधीनता का उपयोग करते हैं”; इसका अर्थ “एक ही अधीनता को अपनाते या उसका पालन करते हैं” भी हो सकता है।
    reason: ὑποταγῇ μιᾷ χρῆται में χράομαι का शाब्दिक ‘उपयोग करना’ अमूर्त संज्ञा के साथ हिन्दी में अस्वाभाविक है; फुटनोट शब्दशः रूप और सम्भव मुहावरेदार अर्थ दोनों को सुरक्षित रखता है।
lexical_decisions:
- source_word: λάβωμεν τὸ σῶμα ἡμῶν
  choice: आइए, हम अपने शरीर को ही लें
  rationale: ग्रीक के आग्रहसूचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है; प्रसंग में शरीर को उदाहरण के रूप में लेने का अर्थ स्वतः स्पष्ट है।
- source_word: δίχα
  choice: के बिना
  rationale: यहाँ अलगाव अथवा किसी अंग के बिना होने का संबंध बताता है; आधुनिक हिन्दी में सहज है।
- source_word: τὰ ἐλάχιστα μέλη
  choice: सबसे छोटे अंग
  rationale: ἐλάχιστα के उत्कृष्टतम भाव और μέλη के शारीरिक अर्थ, दोनों को सीधे रखता है।
- source_word: συνεπνεῖ
  choice: एक साथ साँस लेते हैं
  rationale: क्रिया के सजीव श्वास-संबंधी रूपक को सुरक्षित रखता है; इसे केवल 'मिलकर काम करते हैं' कहकर अर्थ-संकुचन नहीं किया गया।
- source_word: ὑποταγῇ μιᾷ χρῆται
  choice: एक ही अधीनता में रहते हैं
  rationale: χράομαι के अमूर्त संज्ञा के साथ प्रयोग को स्वाभाविक हिन्दी में प्रस्तुत करता है, जबकि μία की एकता और ὑποταγή के अधीन रहने के भाव को बनाए रखता है।
- source_word: εἰς τὸ σώζεσϑαι ὅλον τὸ σῶμα
  choice: ताकि पूरा शरीर सुरक्षित रहे
  rationale: उद्देश्यसूचक εἰς τό और σώζεσθαι के संरक्षण/सुरक्षित रहने के भाव को स्पष्ट और गैर-सांप्रदायिक रूप में देता है।
theological_decisions:
- issue: ὑποταγή का अर्थ
  choice: अधीनता
  alternative: आज्ञाकारिता
  rationale: मूल शब्द व्यवस्था के अधीन होने पर बल देता है; 'आज्ञाकारिता' संभव है, पर वह किसी स्पष्ट आज्ञा या आज्ञादाता का भाव अधिक जोड़ सकती है।
- issue: σώζεσθαι का आशय
  choice: सुरक्षित रहे
  alternative: बचाया जाए
  rationale: शरीर की एकता और कार्यशीलता के प्रसंग में संरक्षण का अर्थ प्रमुख है; 'बचाया जाए' अनावश्यक रूप से धार्मिक उद्धार का विशेष अर्थ जगा सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। शरीर और अंगों के मूल रूपक तथा ‘एक साथ साँस लेते हैं’ की विशिष्ट छवि को जानबूझकर सुरक्षित रखा गया है।
