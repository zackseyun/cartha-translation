source:
  edition: Funk 1901 (normalized OCR)
  text: οὐ πάντες εἰσὶν ἔπαρχοι οὐδὲ χιλίαρχοι οὐδὲ ἑκατόνταρχοι οὐδὲ πεντηκόνταρχοι οὐδὲ τὸ καϑεξῆς, ἀλλ’ ἕκαστος ἐν τῷ ἰδίῳ τάγματι τὰ ἐπιτασσόμενα ὑπὸ τοῦ βασιλέως καὶ τῶν ἡγουμένων ἐπιτελεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/003.yaml
  text: Not all are prefects[a], nor tribunes, nor centurions, nor commanders of fifty, nor so on in order; but each, in his own rank, carries out the orders given by the king and by the leaders.
translation:
  language: hi
  text: सभी अधिपति नहीं होते, न सहस्रपति, न शतपति, न पचासपति, और न क्रम में आने वाले अन्य अधिकारी; बल्कि हर व्यक्ति अपने पद पर राजा और नेताओं द्वारा दिए गए आदेशों को पूरा करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπαρχοι
  choice: अधिपति
  rationale: यह उच्च पदस्थ शासकीय या सैन्य अधिकारी को सूचित करता है; ‘अधिपति’ पद की वरिष्ठता बनाए रखते हुए आधुनिक हिन्दी में समझने योग्य है।
- source_word: χιλίαρχοι
  choice: सहस्रपति
  rationale: शाब्दिक रूप से हजार के अधिकारी का पद; अगले संख्यात्मक सैन्य पदों के साथ क्रम बनाए रखता है।
- source_word: ἑκατόνταρχοι
  choice: शतपति
  rationale: सौ के अधिकारी के लिए संक्षिप्त और परंपरागत हिन्दी पदनाम।
- source_word: πεντηκόνταρχοι
  choice: पचास-पतियों के प्रधान
  rationale: पचास जनों पर नियुक्त अधिकारी का अर्थ सामान्य पाठक के लिए स्पष्ट करता है; दुर्लभ ‘पंचाशतपति’ से अधिक सुबोध है।
- source_word: τὸ καθεξῆς
  choice: इसी क्रम के अन्य अधिकारी
  rationale: पदों की क्रमिक शृंखला में आगे आने वाले अन्य पदों का भाव व्यक्त करता है और हिन्दी में स्वाभाविक है।
- source_word: τάγματι
  choice: श्रेणी
  rationale: यहाँ सैन्य व्यवस्था में प्रत्येक के नियत पद या स्थान का बोध है; ‘श्रेणी’ उस संगठित क्रम को बनाए रखती है।
- source_word: ἐπιτελεῖ
  choice: पूरा करता है
  rationale: दिए गए आदेशों को कार्यान्वित करने या पूरा करने का सीधा भाव।
- source_word: ἡγουμένων
  choice: अगुओं
  rationale: यह व्यापक रूप से नेतृत्व करने वालों को दर्शाता है; इसे अनावश्यक रूप से केवल सैन्य ‘सेनापतियों’ तक सीमित नहीं करता।
