base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/004.yaml
  text: The great cannot exist without the small[a], nor the small without the great. There is a certain blending in all things, and in these there is usefulness.
translation:
  language: hi
  text: बड़े छोटों के बिना हो नहीं सकते, और न छोटे बड़ों के बिना। सभी चीज़ों में एक प्रकार का मिश्रण है, और इनमें[a] उपयोगिता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “इनमें” बहुवचन है; इसका संकेत सभी चीज़ों की ओर भी हो सकता है और बड़े तथा छोटे की ओर भी।
    reason: मूल यूनानी ἐν τούτοις बहुवचन है, पर उसका सटीक पूर्वपद स्पष्ट नहीं है।
lexical_decisions:
- source_word: οἱ μεγάλοι / οἱ μικροί
  choice: बड़े / छोटे
  rationale: मूल यूनानी में विशेषण संज्ञा के रूप में प्रयुक्त हैं। बिना अनावश्यक रूप से आयु, आकार, पद या सामाजिक हैसियत निश्चित किए यह व्यापक विरोध बनाए रखता है।
- source_word: σύγκρασίς τις
  choice: एक प्रकार का मेल
  rationale: σύγκρασις मिश्रण, संयोजन या परस्पर मेल को व्यक्त करता है; सहज हिन्दी में ‘एक प्रकार का मेल’ अर्थ को स्पष्ट रखते हुए τις की अनिश्चितता भी बचाता है।
- source_word: χρῆσις
  choice: उपयोगिता
  rationale: यहाँ शब्द का अर्थ उपयोग, काम आने की क्षमता या उपयोगिता हो सकता है। वाक्य में ‘उपयोगिता’ दोनों वर्गों अथवा उनके मेल के व्यावहारिक मूल्य को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ἐν τούτοις का संदर्भ
  choice: इनमें
  alternative: इनका उपयोग भी है
  rationale: यूनानी सर्वनाम बहुवचन है और उसका संदर्भ ‘सभी चीज़ों’ अथवा ‘बड़े और छोटे’ दोनों की ओर हो सकता है। ‘इनमें’ बहुवचन और संदर्भगत अस्पष्टता दोनों बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। समानांतर वाक्य-विन्यास को संक्षिप्त रखा गया है; ‘बड़े’ और ‘छोटे’ को जानबूझकर व्यापक अर्थ में छोड़ा गया है।
