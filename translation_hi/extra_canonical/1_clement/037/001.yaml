  text: Therefore let us serve as soldiers, brothers, with all earnestness under his blameless commands.
translation:
  language: hi
  text: इसलिए, भाइयो, आओ हम पूरी लगन के साथ उसकी निष्कलंक आज्ञाओं के अधीन सैनिकों के रूप में सेवा करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Στρατευώμεϑα
  choice: आओ हम ... सैनिकों के समान सेवा करें
  rationale: यह मध्यवाच्य उपदेशात्मक रूप सैनिक के रूप में सेवा करने या युद्ध-अभियान में भाग लेने का भाव देता है। हिन्दी में ‘सैनिकों के समान सेवा करें’ सैन्य रूपक को स्पष्ट और स्वाभाविक रखता है।
- source_word: ἄνδρες ἀδελφοί
  choice: भाइयो
  rationale: यह सामूहिक संबोधन है; आधुनिक हिन्दी में ‘भाइयो’ स्वाभाविक है और ‘पुरुष भाइयो’ जैसा असहज दोहराव नहीं करता।
- source_word: μετὰ πάσης ἐκτενείας
  choice: पूरे उत्साह के साथ
  rationale: ἐκτένεια लगन, तत्परता और गंभीर प्रयास का बोध कराता है; ‘पूरे उत्साह’ सहज हिन्दी में इस तीव्रता को व्यक्त करता है।
- source_word: ἐν τοῖς ἀμώμοις προστάγμασιν αὐτοῦ
  choice: उसकी निर्दोष आज्ञाओं के अधीन
  rationale: ἐν का यहाँ सैन्य सेवा के क्षेत्र या अधीनता से जुड़ा अर्थ है। ‘अधीन’ अंग्रेज़ी consultation layer के ‘under’ के अनुरूप है, जबकि ἀμώμοις का मूल्यांकनात्मक अर्थ ‘निर्दोष’ से सुरक्षित रहता है।
theological_decisions:
- issue: ‘उसकी’ का संदर्भ
  choice: सर्वनाम को ‘उसकी’ ही रखा गया
  alternative: ‘परमेश्वर की’ या ‘मसीह की’ आज्ञाएँ
  rationale: इस एक पद में सर्वनाम का संदर्भ नाम लेकर स्पष्ट नहीं किया गया है; किसी विशिष्ट संदर्भ को जोड़ना मूल की वास्तविक संदर्भगत अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक आह्वान के योग्य रखी गई है। सैन्य रूपक को बनाए रखते हुए वाक्य को सामान्य हिन्दी पाठक के लिए सहज बनाया गया है।
