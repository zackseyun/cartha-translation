  text: 'Let us consider those who serve as soldiers under our commanders: how orderly[a], how obedient, how submissively they carry out what is commanded.'
translation:
  language: hi
  text: आइए, हम उन लोगों पर ध्यान दें जो हमारे सेनापतियों के अधीन सैनिक के रूप में सेवा करते हैं—वे कितनी व्यवस्था, आज्ञाकारिता और अधीनता के साथ दिए गए आदेशों को पूरा करते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατανοήσωμεν
  choice: आइए, हम ... ध्यान दें
  rationale: यह प्रथम पुरुष बहुवचन का आह्वान है; ‘ध्यान दें’ विचारपूर्वक देखने और मनन करने, दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοὺς στρατευομένους τοῖς ἡγουμένοις ἡμῶν
  choice: जो हमारे सेनापतियों के अधीन सैनिक के रूप में सेवा करते हैं
  rationale: στρατευομένους सैनिक-सेवा को और τοῖς ἡγουμένοις अधीनस्थ संबंध को व्यक्त करता है; सैन्य प्रसंग में ‘सेनापति’ सामान्य ‘अगुवा’ से अधिक सटीक है।
- source_word: εὐτάκτως
  choice: सुव्यवस्थित ढंग से
  rationale: यह अच्छी व्यवस्था, अनुशासन और निर्धारित क्रम के अनुसार कार्य करने का भाव रखता है।
- source_word: εἰκτικῶς
  choice: आज्ञाकारिता से
  rationale: यह झुकने, मान लेने या अनुपालन करने का भाव देता है; सैन्य संदर्भ में ‘आज्ञाकारिता से’ स्वाभाविक और सटीक है।
- source_word: ὑποτεταγμένως
  choice: अधीनता से
  rationale: यह अपने को अधिकार के अधीन रखकर कार्य करने का भाव स्पष्ट रूप से बनाए रखता है।
- source_word: ἐπιτελοῦσιν τὰ διατασσόμενα
  choice: दिए गए आदेशों को पूरा करते हैं
  rationale: ἐπιτελοῦσιν कार्य को पूरा करने और τὰ διατασσόμενα आदेशित बातों को सूचित करता है।
