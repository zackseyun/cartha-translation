source:
  edition: Funk 1901 (normalized OCR)
  text: Ἵνα δὲ καὶ ὑποδείγματα ἐθνῶν ἐνέγκωμεν· πολλοὶ βασιλεῖς καὶ ἡγούμενοι, λοιμικοῦ τινος ἐνστάντος καιροῦ, χρησμοδοτηθέντες παρέδωκαν ἑαυτοὺς εἰς θάνατον, ἵνα ῥύσωνται διὰ τοῦ ἑαυτῶν αἵματος τοὺς πολίτας· πολλοὶ ἐξεχώρησαν ἰδίων πόλεων, ἵνα μὴ στασιάζωσιν ἐπὶ πλεῖον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/001.yaml
  text: 'And so, to bring forward examples even from the nations: many kings and rulers, when some pestilential crisis had arisen, being instructed by oracles, handed themselves over to death so that through their own blood they might rescue their citizens. Many departed from their own cities so that they might no longer be torn by faction.'
translation:
  language: hi
  text: 'और हम अन्यजातियों में से भी उदाहरण प्रस्तुत करें: बहुत-से राजाओं और शासकों ने, जब महामारी का कोई संकट आ पड़ा, देववाणियों से निर्देश पाकर अपने आपको मृत्यु के हवाले कर दिया, ताकि अपने रक्त के द्वारा अपने नागरिकों को बचाएँ। बहुत-से लोग अपने नगरों से चले गए, ताकि वे और अधिक गुटबाज़ी न करें।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐθνῶν
  choice: अन्यजातियों
  rationale: यह शब्द यहाँ यहूदी-ईसाई समुदाय से बाहर के राष्ट्रों या लोगों की ओर संकेत करता है; ‘अन्यजातियाँ’ इस ऐतिहासिक धार्मिक संदर्भ को बनाए रखता है।
- source_word: λοιμικοῦ τινος ἐνστάντος καιροῦ
  choice: जब महामारी का कोई संकट आ पड़ा
  rationale: λοιμικός का महामारी-संबंधी अर्थ और καιρός की संकटपूर्ण परिस्थिति—दोनों को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: χρησμοδοτηθέντες
  choice: देववाणियों से निर्देश पाकर
  rationale: यह यूनानी धार्मिक परिप्रेक्ष्य में दैवज्ञ-वाणी या ओरेकल से मिले निर्देश को दर्शाता है; अनावश्यक रूप से उसकी सत्यता की पुष्टि नहीं करता।
- source_word: παρέδωκαν ἑαυτοὺς εἰς θάνατον
  choice: अपने आपको मृत्यु के हवाले कर दिया
  rationale: स्वेच्छापूर्वक मृत्यु के लिए स्वयं को सौंपने की तीव्रता को निकटता से बनाए रखता है।
- source_word: πολίτας
  choice: अपने नागरिकों
  rationale: नगर-राज्य के सहनागरिकों का मूल नागरिक अर्थ सुरक्षित रखा गया है।
- source_word: ἐξεχώρησαν
  choice: चले गए
  rationale: अपने नगर से हट जाने या बाहर निकल जाने का सामान्य और प्रसंगानुकूल अर्थ।
- source_word: στασιάζωσιν
  choice: वहाँ गुटबाज़ी ... न बढ़े
  rationale: στάσις परिवार का शब्द नागरिक कलह, दलगत संघर्ष या गुटबाज़ी दर्शाता है; बहुवचन कर्ता और प्रसंग में यह नगर के भीतर चल रहे संघर्ष की ओर संकेत करता है।
theological_decisions:
- issue: गैर-यहूदी राजाओं की आत्मबलि का वर्णन
  choice: वर्णन को उदाहरण के रूप में रखा गया, बिना उसे धार्मिक आदर्श या उद्धारकारी प्रायश्चित घोषित किए
  alternative: ‘बलिदान दिया’ जैसी अधिक धार्मिक शब्दावली
  rationale: मूल पाठ उनके अपने रक्त से नागरिकों को बचाने का दावा वर्णित करता है, पर उससे किसी विशिष्ट प्रायश्चित-सिद्धांत की स्थापना नहीं करता।
- issue: देववाणी की प्रामाणिकता
  choice: ‘देववाणियों से निर्देश पाकर’
  alternative: ‘ईश्वर से आदेश पाकर’
  rationale: χρησμός गैर-यहूदी ओरेकल को सूचित करता है; ‘ईश्वर’ कहना मूल के सांस्कृतिक और धार्मिक भेद को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय गद्य। वाक्य-विन्यास को हिन्दी के अनुरूप बनाया गया है, जबकि महामारी, देववाणी, स्वेच्छा से मृत्यु स्वीकारना, रक्त द्वारा नागरिकों की रक्षा और नागरिक गुटबाज़ी के मूल भाव सुरक्षित रखे गए हैं।
