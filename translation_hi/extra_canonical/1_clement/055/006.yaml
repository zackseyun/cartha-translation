source:
  edition: Funk 1901 (normalized OCR)
  text: οὐχ ἧττον καὶ ἡ τελεία κατὰ πίστιν Ἐσθὴρ κινδύνῳ ἑαυτὴν παρέβαλεν, ἵνα τὸ δωδεκάφυλον τοῦ Ἰσραὴλ μέλλον ἀπολέσθαι ῥύσηται· διὰ γὰρ τῆς νηστείας καὶ τῆς ταπεινώσεως ἠξίωσεν τὸν παντεπόπτην δεσπότην, θεὸν τῶν αἰώνων· ὃς ἰδὼν τὸ ταπεινὸν τῆς ψυχῆς αὐτῆς ἐρύσατο τὸν λαόν, ὧν χάριν ἐκινδύνευσεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/006.yaml
  text: And no less also Esther[a], perfect according to faith, put herself in danger so that she might rescue the twelve-tribed people of Israel, who were about to perish. For through fasting and humiliation she entreated the all-seeing Master, God of the ages; and he, seeing the humility of her soul[c][b], rescued the people for whose sake she had faced danger.
translation:
  language: hi
  text: और एस्तेर ने भी कम नहीं, जो विश्वास के अनुसार सिद्ध थी, अपने आप को खतरे में डाल दिया, ताकि वह इस्राएल के बारह गोत्रों को, जो नाश होने वाले थे, बचा सके। क्योंकि उसने उपवास और अपने को दीन करने के द्वारा सर्वदर्शी स्वामी, युगों के परमेश्वर, से विनती की। और उन्होंने उसकी आत्मा की दीनता को देखकर उन लोगों को बचाया, जिनके लिए उसने खतरा मोल लिया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τελεία κατὰ πίστιν
  choice: विश्वास में सिद्ध
  rationale: यह सहज आधुनिक हिन्दी में एस्तेर की विश्वास-संबंधी परिपक्वता अथवा पूर्णता व्यक्त करता है; κατὰ का अधिक शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: τὸ δωδεκάφυλον τοῦ Ἰσραὴλ
  choice: इस्राएल के ... बारह गोत्रों
  rationale: δωδεκάφυλον एक सामूहिक संज्ञा है जिसका स्वाभाविक हिन्दी रूप ‘बारह गोत्र’ है; प्रसंग में इन्हें लोगों के सामूहिक समुदाय के रूप में देखा गया है।
- source_word: κινδύνῳ ἑαυτὴν παρέβαλεν
  choice: अपने आपको जोखिम में डाल दिया
  rationale: यूनानी मुहावरे का सीधा और स्वाभाविक हिन्दी प्रतिरूप, जिसमें एस्तेर के स्वेच्छापूर्वक खतरा मोल लेने का भाव बना रहता है।
- source_word: τῆς ταπεινώσεως
  choice: आत्म-दीनता
  rationale: उपवास के साथ प्रयुक्त ταπείνωσις स्वेच्छा से परमेश्वर के सामने स्वयं को दीन करने का संकेत देता है, न कि दूसरों द्वारा किए गए अपमान का।
- source_word: ἠξίωσεν
  choice: से विनती की
  rationale: इस वाक्य में क्रिया उपवास और आत्म-दीनता के द्वारा प्रभु से आग्रह करने का भाव रखती है; हिन्दी में ‘विनती की’ प्रसंगानुकूल और स्पष्ट है।
- source_word: παντεπόπτην δεσπότην
  choice: सब कुछ देखने वाले स्वामी
  rationale: παντεπόπτης की सर्वदर्शिता और δεσπότης की प्रभुता, दोनों को स्पष्ट रखा गया है।
- source_word: θεὸν τῶν αἰώνων
  choice: युगों के परमेश्वर
  rationale: बहुवचन αἰώνων को बनाए रखते हुए पारंपरिक धार्मिक अभिव्यक्ति का स्वाभाविक हिन्दी रूप दिया गया है।
theological_decisions:
- issue: एस्तेर को τελεία कहे जाने का आशय
  choice: विश्वास में सिद्ध
  alternative: विश्वास के अनुसार सिद्ध
  rationale: मुख्य पाठ सहज हिन्दी में गुण को विश्वास के क्षेत्र से जोड़ता है, जबकि स्रोत के κατὰ की औपचारिक संरचना पादटिप्पणी में सुरक्षित है; ‘सिद्ध’ को निष्पापता की किसी विशिष्ट सांप्रदायिक धारणा के रूप में नहीं खोला गया।
- issue: उद्धार का कर्ता
  choice: परमेश्वर ने लोगों को बचाया
  alternative: एस्तेर ने लोगों को बचाया
  rationale: उद्देश्य-वाक्य में एस्तेर लोगों को बचाने निकलती है, पर मुख्य क्रिया ἐρύσατο स्पष्ट करती है कि अंततः परमेश्वर ने उन्हें बचाया; दोनों स्तर अनुवाद में बने हुए हैं।
- issue: ταπείνωσις का धार्मिक भाव
  choice: आत्म-दीनता
  alternative: अपमान
  rationale: उपवास के साथ यह स्वैच्छिक आत्म-दीनता को दर्शाता है; ‘अपमान’ अनैच्छिक तिरस्कार का भ्रामक अर्थ दे सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘आत्म-दीनता’ धार्मिक-साहित्यिक पद है, पर ‘अपमान’ की अपेक्षा स्रोत में निहित स्वैच्छिक विनम्रता को अधिक ठीक व्यक्त करता है। परमेश्वर के लिए आदरसूचक बहुवचन क्रिया ‘उन्होंने’ हिन्दी के स्वाभाविक धार्मिक प्रयोग के अनुसार है।
