  text: The blessed Judith[a], when the city was under siege, asked the elders to permit her to go out into the camp of the foreigners.
translation:
  language: hi
  text: धन्य यूदीत ने, जब नगर घेराबंदी में था, प्राचीनों से यह अनुमति माँगी कि वह बाहर निकलकर परदेशियों की छावनी में जा सके।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰουδὶθ
  choice: यहूदीत
  rationale: यूनानी नाम का प्रचलित और स्रोत-सन्निकट हिन्दी रूप।
- source_word: ἡ μακαρία
  choice: धन्य
  rationale: μακαρία के सम्मानसूचक अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν συγκλεισμῷ οὔσης τῆς πόλεως
  choice: जब नगर घेराबंदी में था
  rationale: नगर के बंद कर दिए जाने अथवा घेरे में होने की परिस्थिति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τῶν πρεσβυτέρων
  choice: प्राचीनों
  rationale: समुदाय के वरिष्ठ अगुओं के लिए आरंभिक मसीही साहित्य में मान्य औपचारिक पदनाम; केवल आयु का संकेत देने वाले ‘बुज़ुर्गों’ से अधिक उपयुक्त।
- source_word: ἐαθῆναι αὐτὴν ἐξελθεῖν
  choice: अनुमति माँगी कि वह ... बाहर निकलकर जाए
  rationale: अनुमति दिए जाने वाले निष्क्रिय क्रियारूप और बाहर जाने की गति—दोनों को स्पष्ट रखता है।
- source_word: τὴν παρεμβολὴν τῶν ἀλλοφύλων
  choice: परदेशियों की छावनी
  rationale: παρεμβολή का अर्थ सैन्य छावनी और ἀλλόφυλοι का मूल अर्थ दूसरे जातीय/राष्ट्रीय समूह के लोग है; ‘शत्रु’ का निहितार्थ स्रोत में प्रत्यक्ष नहीं जोड़ा गया।
