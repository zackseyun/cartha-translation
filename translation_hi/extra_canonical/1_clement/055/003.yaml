  text: πολλαὶ γυναῖκες ἐνδυναμωθεῖσαι διὰ τῆς χάριτος τοῦ θεοῦ ἐπετέλεσαν πολλὰ ἀνδρεῖα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/003.yaml
  text: Many women[a], strengthened through the grace of God, accomplished many courageous deeds.
translation:
  language: hi
  text: बहुत-सी स्त्रियों ने परमेश्वर के अनुग्रह से सामर्थ्य पाकर अनेक साहसी कार्य किए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अनेक पुरुषोचित कार्य।” यूनानी शब्द का सामान्य अर्थ “साहसी” या “वीरतापूर्ण” है, पर उसकी व्युत्पत्ति “पुरुष” से जुड़ी है।
    reason: ἀνδρεῖα के मुख्य प्रसंगगत अर्थ के साथ उसकी पुरुष-संबंधी व्युत्पत्तिगत शब्द-छाया और स्त्रियों के संदर्भ में संभावित अलंकारिक तनाव को सुरक्षित रखना।
lexical_decisions:
- source_word: ἐνδυναμωθεῖσαι
  choice: सामर्थ्य पाकर
  rationale: यह क्रिया स्त्रियों के सामर्थ्यवान बनाए जाने को व्यक्त करती है; कर्मवाच्य भाव को स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: διὰ τῆς χάριτος τοῦ θεοῦ
  choice: परमेश्वर के अनुग्रह से
  rationale: διά के साधनवाचक अर्थ और χάρις के धार्मिक आशय को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πολλὰ ἀνδρεῖα
  choice: साहस के अनेक काम
  rationale: ἀνδρεῖα का प्रसंगगत मुख्य अर्थ वीरतापूर्ण या साहसी कार्य है। यह चयन हिन्दी में स्वाभाविक है, जबकि शब्द की पुरुष-संबंधी व्युत्पत्तिगत छाया पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἐπετέλεσαν
  choice: किए
  rationale: संदर्भ में इसका अर्थ कार्यों को पूरा करना या कर दिखाना है; ‘किए’ संक्षिप्त और सहज हिन्दी है।
theological_decisions:
- issue: सामर्थ्य का स्रोत
  choice: परमेश्वर के अनुग्रह से सामर्थ्य पाकर
  alternative: परमेश्वर के अनुग्रह के द्वारा बलवन्त की गईं
  rationale: मूल यूनानी में सामर्थ्य प्रदान किए जाने और उसके साधन के रूप में परमेश्वर के अनुग्रह—दोनों को रखा गया है, बिना कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘अनुग्रह’ धार्मिक संदर्भ में प्रचलित और सटीक है; ‘साहस के अनेक काम’ स्वाभाविक हिन्दी में मूल का भाव देता है।
