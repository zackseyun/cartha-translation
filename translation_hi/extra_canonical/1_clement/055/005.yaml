id: 1CLEM.55.5
reference: 1 Clement 55:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: παραδοῦσα οὖν ἑαυτὴν τῷ κινδύνῳ ἐξῆλθεν δι’ ἀγάπην τῆς πατρίδος καὶ τοῦ λαοῦ τοῦ ὄντος ἐν συγκλεισμῷ, καὶ παρέδωκεν κύριος Ὀλοφέρνην ἐν χειρὶ θηλείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/005.yaml
  text: So then[a], handing herself over to danger, she went out because of love for her homeland and for the people who were under siege, and the Lord handed Holofernes over into the hand of a woman.
translation:
  language: hi
  text: इसलिए अपने आप को खतरे के हवाले करके वह अपने देश और घेराबंदी में फँसे लोगों से प्रेम के कारण बाहर निकल गई; और प्रभु ने होलोफेरनेस को एक स्त्री के हाथ में हवाले कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραδοῦσα … παρέδωκεν
  choice: हवाले करके … हवाले कर दिया
  rationale: एक ही यूनानी क्रिया की पुनरावृत्ति को हिन्दी में भी रखा गया है, जिससे उसके आत्मसमर्पण और प्रभु द्वारा होलोफेरनेस को सौंपे जाने के बीच का अलंकारिक संबंध बना रहता है।
- source_word: συγκλεισμῷ
  choice: घेराबंदी में फँसे
  rationale: यहाँ यह शब्द घिरे या बंद किए गए लोगों की दशा बताता है; प्रसंग के अनुसार ‘घेराबंदी’ स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: ἐν χειρὶ θηλείας
  choice: एक स्त्री के हाथ में
  rationale: शाब्दिक अर्थ ‘स्त्री के हाथ में’ है। यह हिन्दी में स्वाभाविक है और स्त्री होने पर दिए गए यूनानी बल को बनाए रखता है।
- source_word: δι’ ἀγάπην
  choice: प्रेम के कारण
  rationale: कारणसूचक अर्थ को स्पष्ट रखते हुए देश और लोगों—दोनों के प्रति प्रेम से जोड़ा गया है।
theological_decisions:
- issue: प्रभु की भूमिका और मानवीय साहस के बीच संबंध
  choice: 'वाक्य के दोनों खंडों को ज्यों का त्यों साथ रखा गया: स्त्री स्वयं खतरे में गई, और प्रभु ने शत्रु को उसके हाथ में सौंपा।'
  alternative: केवल दैवी छुटकारे या केवल मानवीय वीरता पर बल देना।
  rationale: यूनानी पाठ दोनों पहलुओं को बिना किसी तनाव को मिटाए साथ रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हवाले’ की पुनरावृत्ति जानबूझकर मूल यूनानी की शब्दगत पुनरावृत्ति को प्रतिबिंबित करती है।
