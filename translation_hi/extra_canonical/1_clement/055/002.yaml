base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/002.yaml
  text: We know of many among us who have handed themselves over to chains so that they might ransom others. Many handed themselves over into slavery, and after receiving the price for themselves, they fed others.
translation:
  language: hi
  text: हम अपने बीच ऐसे बहुतों को जानते हैं जिन्होंने दूसरों को छुड़ाने के लिए अपने आपको बेड़ियों में सौंप दिया। बहुतों ने अपने आपको दासता में बेच दिया और अपने बदले मिली कीमत पाकर उससे दूसरों को भोजन कराया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἡμῖν
  choice: अपने बीच
  rationale: यह स्वाभाविक हिन्दी में समुदाय के भीतर के लोगों को व्यक्त करता है।
- source_word: παραδεδωκότας ἑαυτοὺς εἰς δεσμά
  choice: अपने आपको बेड़ियों में सौंप दिया
  rationale: आत्मसमर्पण और वास्तविक बंधन—दोनों भावों को निकटता से बनाए रखता है।
- source_word: λυτρώσωνται
  choice: छुड़ाने
  rationale: संदर्भ में मूल्य देकर किसी को मुक्त कराने का भाव है; सामान्य पाठक के लिए 'छुड़ाने' सहज है।
- source_word: παρέδωκαν εἰς δουλείαν
  choice: अपने आपको दासता में बेच दिया
  rationale: शाब्दिक अर्थ 'दासता में सौंप दिया' है, पर अगले वाक्यांश में मूल्य प्राप्त करने के कारण हिन्दी में 'बेच दिया' निहित लेन-देन को स्पष्ट और स्वाभाविक बनाता है।
- source_word: τὰς τιμὰς αὐτῶν
  choice: अपने मूल्य की रकम
  rationale: बहुवचन अभिव्यक्ति का आशय उन व्यक्तियों के बदले मिली कीमत/रकम है; यह अनावश्यक रूप से 'चुकाई गई' नहीं जोड़ता।
- source_word: ἐψώμισαν
  choice: भोजन कराया
  rationale: क्रिया का अर्थ दूसरों को खिलाना या भोजन उपलब्ध कराना है; 'भोजन कराया' dignified और सहज है।
