review_pass:
  verdict: revise
  source_fidelity: 'Greek clauses and parallel structure are preserved well. The two actions are correctly distinguished: voluntary submission to bonds to ransom others, and voluntary entry into slavery followed by using the received price to feed others. However, “अपने मूल्य की रकम” can suggest a person''s inherent valuation rather than the price received in exchange for that person.'
  naturalness: The register is clear and dignified modern Hindi. “अपने बदले मिली कीमत” is more idiomatic and immediately intelligible than “अपने मूल्य की रकम.”
  terminology: “बेड़ियों,” “दासता,” “छुड़ाने,” and “भोजन कराया” are suitable and non-sectarian. “बेच दिया” appropriately makes explicit the transactional implication supported by the immediately following receipt of a price, while retaining the sense of self-surrender into slavery.
  issues:
  - severity: low
    issue: “अपने मूल्य की रकम” is semantically awkward in Hindi.
    rationale: It can be read as ‘the amount of their own value,’ whereas τὰς τιμὰς αὐτῶν denotes the price received for them. “अपने बदले मिली कीमत” expresses this relationship naturally without adding a claim about who paid it.
  revised_text: हम अपने बीच ऐसे बहुतों को जानते हैं जिन्होंने दूसरों को छुड़ाने के लिए अपने आपको बेड़ियों में सौंप दिया। बहुतों ने अपने आपको दासता में बेच दिया और अपने बदले मिली कीमत पाकर उससे दूसरों को भोजन कराया।
