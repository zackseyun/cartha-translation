lexical_decisions:
- source_word: λάβωμεν τοὺς καρπούς
  choice: आओ, फलों पर विचार करें
  rationale: λάβωμεν यहाँ किसी उदाहरण को विचार के लिए लेने का भाव देता है; καρπούς का निकट और स्वाभाविक हिन्दी रूप ‘फलों’ है।
- source_word: ὁ σπόρος
  choice: बोना
  rationale: इस प्रसंग में σπόρος को बोने की क्रिया के अर्थ में लेना सम्भव और अगले पद के σπέρμα (‘बीज’) से अर्थपूर्ण रूप से भिन्न है।
- source_word: πῶς καὶ τίνα τρόπον γίνεται
  choice: कैसे और किस रीति से होता है
  rationale: दोनों प्रश्नवाचक अभिव्यक्तियों को बनाए रखा गया है; क्रियावाचक ‘बोना’ के साथ γίνεται का स्वाभाविक अनुवाद ‘होता है’ है।
theological_decisions:
- issue: σπόρος का अर्थ क्रिया ‘बोना’ है या वस्तु ‘बीज’
  choice: मुख्य पाठ में ‘बोना’
  alternative: ‘बीज कैसे और किस रीति से उत्पन्न होता है?’
  rationale: शब्द दोनों अर्थ दे सकता है, पर निकटवर्ती प्रसंग में अगले पद पर बीज के लिए σπέρμα आने के कारण यहाँ बोने की क्रिया अधिक सम्भावित है; वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; ‘आओ’ सामूहिक आग्रह को स्वाभाविक बनाता है, जबकि ‘विचार करें’ उदाहरण को सामने रखकर देखने का आशय स्पष्ट करता है। भाषा सरल, गरिमापूर्ण और स्रोत की पुनरुक्त प्रश्न-रचना के निकट रखी गई है।
