  text: 'Let us take the fruits as an example: how and in what way does the seed come to be?[a]'
translation:
  language: hi
  text: 'आओ, फलों को उदाहरण के रूप में लें: बोआई कैसे और किस प्रकार होती है?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बीज कैसे और किस प्रकार उत्पन्न होता है?”
