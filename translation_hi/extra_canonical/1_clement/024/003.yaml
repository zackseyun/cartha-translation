source:
  edition: Funk 1901 (normalized OCR)
  text: ἡμέρα καὶ νὺξ ἀνάστασιν ἡμῖν δηλοῦσιν· κοιμᾶται ἡ νύξ, ἀνίσταται ἡ ἡμέρα· ἡ ἡμέρα ἄπεισιν, νὺξ ἐπέρχεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/024/003.yaml
  text: 'Day and night show us a resurrection: the night falls asleep[a], the day rises; the day departs, night comes.'
translation:
  language: hi
  text: 'दिन और रात हमें पुनरुत्थान दिखाते हैं: रात सो जाती है, दिन उठ खड़ा होता है; दिन चला जाता है, रात आ पहुँचती है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνάστασιν
  choice: पुनरुत्थान
  rationale: यहाँ दिन के फिर उठने के प्राकृतिक दृश्य को भावी पुनरुत्थान के दृष्टांत के रूप में प्रस्तुत किया गया है; ‘पुनरुत्थान’ इस धार्मिक और चित्रात्मक दोनों अर्थों को बनाए रखता है।
- source_word: κοιμᾶται
  choice: सो जाती है
  rationale: ग्रीक में रात को मानवीय क्रिया देकर कहा गया है कि वह ‘सोती है’; इसे शाब्दिक और स्वाभाविक हिंदी में सुरक्षित रखा गया है।
- source_word: ἀνίσταται
  choice: उठ खड़ा होता है
  rationale: यह क्रिया ἀνάστασιν के साथ शब्दगत संबंध बनाती है। ‘उठ खड़ा होता है’ उस संबंध और दिन के उदय की सजीव छवि को ‘निकलता है’ की अपेक्षा बेहतर बनाए रखता है।
- source_word: ἄπεισιν
  choice: चला जाता है
  rationale: मूल का सीधा अर्थ ‘चला जाता/विदा होता है’ है; सरल वर्तमानकालीन अभिव्यक्ति चुनी गई है।
- source_word: ἐπέρχεται
  choice: आ पहुँचती है
  rationale: क्रिया के आने या निकट आ पड़ने के भाव को स्वाभाविक हिंदी में व्यक्त करता है, और केवल ‘आती है’ से थोड़ा अधिक गतिशील है।
theological_decisions:
- issue: ἀνάστασιν का सामान्य अथवा निश्चित पुनरुत्थान के रूप में अनुवाद
  choice: पुनरुत्थान
  alternative: एक पुनरुत्थान
  rationale: ग्रीक में अनिश्चित लेख का अभाव निर्णायक नहीं है। हिंदी में ‘हमें एक पुनरुत्थान दिखाते हैं’ अस्वाभाविक और संभावित रूप से भ्रामक है; संदर्भ में दिन-रात पुनरुत्थान की वास्तविकता का दृष्टांत देते हैं, इसलिए बिना संख्या-सूचक शब्द के अनुवाद उपयुक्त है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिंदी अपनाई गई है। मूल के संयोजक-विहीन, तीव्र लयबद्ध विरोध को अल्पविराम और अर्धविराम द्वारा बनाए रखा गया है; अनावश्यक ‘और’ नहीं जोड़े गए। रात और दिन के मानवीकरण को भी सुरक्षित रखा गया है।
