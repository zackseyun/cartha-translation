source:
  edition: Funk 1901 (normalized OCR)
  text: ἐξῆλθεν ὁ σπείρων καὶ ἔβαλεν εἰς τὴν γῆν ἕκαστον τῶν σπερμάτων, ἅτινα πεσόντα εἰς τὴν γῆν ξηρὰ καὶ γυμνὰ διαλύεται· εἶτʼ ἐκ τῆς διαλύσεως ἡ μεγαλειότης τῆς προνοίας τοῦ δεσπότου ἀνίστησιν αὐτά, καὶ ἐκ τοῦ ἑνὸς πλείονα αὔξει καὶ ἐκφέρει καρπόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/024/005.yaml
  text: The sower went out and cast each of the seeds into the ground; these[a], when they fall into the ground, dry and bare, decay. Then from that decay the greatness of the Master's providence raises them up, and from one it increases many and brings forth fruit.
translation:
  language: hi
  text: बोनेवाला बाहर निकला और उसने हर एक बीज भूमि में डाला। वे बीज भूमि में गिरकर सूखे और नंगे ही गल जाते हैं। फिर स्वामी की देखरेख की महानता उसी गलने में से उन्हें उठा खड़ा करती है; और उस एक से बहुतों को बढ़ाती है और फल उत्पन्न करती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उस एक से अनेक उगते हैं और फल लाते हैं।”
    reason: यूनानी πλείονα को नपुंसकलिंग बहुवचन कर्ता मानना संभव है, जिसके साथ एकवचन क्रियाएँ आ सकती हैं। मुख्य पाठ में निकटवर्ती एकवचन कर्ता ‘स्वामी की देखरेख की महानता’ को बनाए रखा गया है।
lexical_decisions:
- source_word: ὁ σπείρων
  choice: बोनेवाला
  rationale: यह सामान्य और स्वाभाविक हिन्दी में कर्ता-संज्ञा को व्यक्त करता है तथा कृषि-संबंधी चित्र बनाए रखता है।
- source_word: ἕκαστον τῶν σπερμάτων
  choice: हर एक बीज
  rationale: ἕκαστον की एक-एक पर केंद्रित अर्थछाया को बनाए रखते हुए हिन्दी में सहज अभिव्यक्ति है।
- source_word: ξηρὰ καὶ γυμνὰ
  choice: सूखे और नंगे
  rationale: दोनों विशेषणों की ठोस कृषि-छवि को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: διαλύεται / διαλύσεως
  choice: गल जाते हैं / गलने
  rationale: मिट्टी में पड़े बीज के विघटन या क्षय को सामान्य हिन्दी में व्यक्त करता है और दोनों संबद्ध यूनानी रूपों की पुनरावृत्ति बनाए रखता है।
- source_word: ἡ μεγαλειότης τῆς προνοίας
  choice: प्रबंध की महानता
  rationale: μεγαλειότης की अमूर्त महानता और πρόνοια की पूर्वदर्शी देखभाल/व्यवस्था को अपेक्षाकृत औपचारिक पर सुबोध रूप में रखता है।
- source_word: τοῦ δεσπότου
  choice: स्वामी के
  rationale: δεσπότης के अधिकार और स्वामित्व का भाव देता है, बिना किसी अतिरिक्त सांप्रदायिक पदावली को जोड़े।
- source_word: ἀνίστησιν αὐτά
  choice: उन्हें उठा खड़ा करती है
  rationale: पुनर्जीवन के संदर्भ में ἀνίστημι की उठाने/खड़ा करने की सशक्त छवि को बनाए रखता है।
- source_word: ἐκ τοῦ ἑνὸς πλείονα
  choice: उस एक से अनेक
  rationale: निश्चित लेख सहित ‘उस एक’ और ‘अनेक’ के स्पष्ट विरोध को सुरक्षित रखता है।
- source_word: ἐκφέρει καρπόν
  choice: फल लाते हैं
  rationale: फल उत्पन्न करने की कृषि-छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: αὔξει और ἐκφέρει का कर्ता
  choice: ‘अनेक’ को कर्ता मानकर ‘अनेक उगते हैं और फल लाते हैं’
  alternative: ‘प्रबंध की महानता’ को कर्ता मानकर ‘वह एक से अनेकों को बढ़ाती है और फल उत्पन्न करती है’
  rationale: πλείονα नपुंसकलिंग बहुवचन कर्ता हो सकता है, जिसके साथ यूनानी में एकवचन क्रिया सामान्य है; यह कृषि-चित्र में एक बीज से अनेक पौधों के उगने का सहज क्रम भी देता है। फिर भी रूपगत अस्पष्टता के कारण वैकल्पिक पाठ फुटनोट में रखा गया है।
- issue: बीज के गलने और उठाए जाने की पुनरुत्थान-संबंधी छवि
  choice: ठोस कृषि-भाषा को ज्यों का त्यों रखा गया
  alternative: इसे सीधे ‘मरने’ और ‘जी उठने’ की धर्मवैज्ञानिक शब्दावली में स्पष्ट करना
  rationale: संदर्भ का संकेत प्रबल है, पर पद स्वयं बीज के गलने और उठाए जाने की उपमा में बोलता है; अनुवाद को निहित व्याख्या को मुख्य पाठ में नहीं जोड़ना चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। कृषि-चित्र की ठोस शब्दावली और मूल की संभावित व्याकरणिक अस्पष्टता दोनों सुरक्षित हैं।
