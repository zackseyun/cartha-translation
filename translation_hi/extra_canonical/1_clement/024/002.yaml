  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य में मूल यूनानी का सम्बोधन, सामूहिक आग्रह और कालगत अभिव्यक्ति सुरक्षित हैं।
