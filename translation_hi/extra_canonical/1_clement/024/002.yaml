  language: hi
  text: हे प्रिय जनो, आइए, हम उस पुनरुत्थान को देखें जो उचित समय पर होता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδωμεν
  choice: हम ... ध्यान दें
  rationale: यह प्रथम पुरुष बहुवचन का आग्रह है; ‘ध्यान दें’ यहाँ देखने के साथ विचारपूर्वक अवलोकन करने का स्वाभाविक हिन्दी भाव देता है।
- source_word: ἀγαπητοί
  choice: हे प्रिय जनो
  rationale: सम्बोधन और बहुवचन दोनों को स्पष्ट रखते हुए गरिमापूर्ण, सहज हिन्दी प्रयोग चुना गया है।
- source_word: ἀνάστασιν
  choice: पुनरुत्थान
  rationale: यह ἀνάστασις का मानक और धर्मवैचारिक रूप से तटस्थ हिन्दी समतुल्य है।
- source_word: κατὰ καιρὸν γινομένην
  choice: जो उचित समय पर होता है
  rationale: κατὰ καιρόν का समयानुकूल अर्थ ‘उचित समय पर’ से व्यक्त होता है; γινομένην को वर्तमानकालिक सामान्य घटना के रूप में ‘होता है’ रखा गया है, बिना ऐसे किसी नियोजनकर्ता को जोड़ने के जिसका यूनानी में उल्लेख नहीं है।
theological_decisions:
- issue: यहाँ ‘पुनरुत्थान’ का आशय
  choice: मूल का व्यापक शब्द ‘पुनरुत्थान’ बनाए रखा गया
  alternative: इसे विशेष रूप से मृतकों के अंतिम पुनरुत्थान या प्रकृति के पुनर्जीवन के रूप में स्पष्ट करना
  rationale: इस एक वाक्य में यूनानी पाठ आशय को सीमित नहीं करता; आस-पास का संदर्भ आगे उदाहरण दे सकता है, इसलिए यहाँ निहित तनाव और व्यापकता सुरक्षित रखी गई है।
