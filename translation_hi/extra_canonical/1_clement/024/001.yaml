source:
  edition: Funk 1901 (normalized OCR)
  text: Κατανοήσωμεν, ἀγαπητοί, πῶς ὁ δεσπότης ἐπιδείκνυται διηνεκῶς ἡμῖν τὴν μέλλουσαν ἀνάστασιν ἔσεσθαι, ἧς τὴν ἀπαρχὴν ἐποιήσατο τὸν κύριον Ἰησοῦν Χριστὸν ἐκ νεκρῶν ἀναστήσας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/024/001.yaml
  text: Let us consider, beloved, how the Master continually shows us that the future resurrection will take place, of which he made the Lord Jesus Messiah the firstfruits by raising him from the dead.
translation:
  language: hi
  text: हे प्रिय जनो, आओ हम विचार करें कि स्वामी हमें निरन्तर कैसे दिखाता है कि भावी पुनरुत्थान होगा। उसने प्रभु यीशु मसीह को मरे हुओं में से उठाकर उस पुनरुत्थान का पहला फल ठहराया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατανοήσωμεν
  choice: हम इस बात पर ध्यान दें
  rationale: यह विचारपूर्वक देखने और समझने के सामूहिक आह्वान को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὁ δεσπότης
  choice: स्वामी
  rationale: δεσπότης के अधिकार और प्रभुता के भाव को बनाए रखता है तथा आगे आने वाले κύριον के लिए प्रयुक्त ‘प्रभु’ से शब्दगत भेद भी सुरक्षित रखता है।
- source_word: τὴν μέλλουσαν ἀνάστασιν
  choice: भविष्य में पुनरुत्थान
  rationale: μέλλουσαν के भाव को सहज हिन्दी में व्यक्त करता है और यूनानी संरचना की अनावश्यक पुनरुक्ति से बचता है।
- source_word: τὴν ἀπαρχὴν
  choice: पहला फल
  rationale: किसी आगामी, व्यापक उपज के आरम्भिक और प्रतिनिधि फल की रूपकात्मक छवि को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: ἐκ νεκρῶν ἀναστήσας
  choice: मरे हुओं में से जिलाया
  rationale: ἐκ νεκρῶν की सामूहिक अभिव्यक्ति और परमेश्वर द्वारा यीशु को उठाए जाने की सक्रियता दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: यीशु मसीह और भावी पुनरुत्थान के बीच ‘पहला फल’ का सम्बन्ध
  choice: ‘उस पुनरुत्थान का पहला फल उसने प्रभु यीशु मसीह को बनाया’
  alternative: ‘प्रभु यीशु मसीह का पुनरुत्थान उसका आरम्भ बनाया’
  rationale: मूल पाठ यीशु मसीह को स्वयं ἀπαρχή कहता है; इसे केवल उनके पुनरुत्थान की घटना में बदलना मूल रूपक को कमजोर करता।
- issue: पुनरुत्थान के होने की अभिव्यक्ति
  choice: ‘भविष्य में पुनरुत्थान होगा’
  alternative: ‘होनेवाला पुनरुत्थान सचमुच होगा’
  rationale: μέλλουσαν ἀνάστασιν ἔσεσθαι यूनानी में स्वाभाविक रूप से भावी पुनरुत्थान के घटित होने को व्यक्त करता है; हिन्दी में कृत्रिम पुनरुक्ति जोड़ना आवश्यक नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक उपदेशात्मक शैली में रखी गई है। ‘हे प्रिय जनो’ सम्बोधन को स्पष्ट करता है; ‘स्वामी’ और ‘प्रभु’ मूल के δεσπότης तथा κύριος के भेद को बनाए रखते हैं।
