base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/001.yaml
  text: Therefore let our whole body be preserved in Messiah Jesus, and let each one be subject to his neighbor, just as he was appointed in his gift.
translation:
  language: hi
  text: इसलिए हमारा पूरा शरीर मसीह यीशु में सुरक्षित रहे,[a] और हर व्यक्ति अपने पड़ोसी के अधीन रहे, जिस प्रकार वह अपने वरदान में ठहराया गया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारा पूरा शरीर बचा रहे।”
    reason: σωζέσθω ‘बचने’, ‘सुरक्षित रहने’ या ‘उद्धार पाने’ का भाव दे सकता है।
  - marker: b
    text: 'अधिक शाब्दिक: “जैसा वह अपने वरदान में नियुक्त किया गया है।”'
    reason: καθὼς ἐτέθη ἐν τῷ χαρίσματι αὐτοῦ की संक्षिप्त यूनानी रचना व्यक्ति की नियुक्ति और उसके वरदान के संबंध को कुछ अस्पष्ट छोड़ती है।
lexical_decisions:
- source_word: 'Σωζέσθω (OCR: Συνξέσϑω)'
  choice: सुरक्षित रहे
  rationale: प्रमाणित पाठ के σωζέσθω का अर्थ ‘बचा/सुरक्षित रखा जाए’ है। यह OCR-पाठ से अनुमानित ‘एक साथ जुड़ा रहे’ की अपेक्षा पांडुलिपि-परंपरा के अनुकूल है।
- source_word: ὅλον τὸ σῶμα
  choice: हमारा पूरा शरीर
  rationale: समुदाय को एक शरीर के रूप में प्रस्तुत करने वाले रूपक को यथासंभव सीधे रखा गया है।
- source_word: ὑποτασσέσθω
  choice: अधीन रहे
  rationale: क्रिया के आज्ञार्थक और संबंधपरक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τῷ πλησίον αὐτοῦ
  choice: अपने पड़ोसी के
  rationale: πλησίον का सीधा अर्थ ‘पड़ोसी/निकटवर्ती व्यक्ति’ है; ‘पड़ोसी’ परिचित और व्यापक रूप से बोधगम्य है।
- source_word: χαρίσματι
  choice: वरदान
  rationale: ईश्वर द्वारा अनुग्रह से दिए गए दान या सामर्थ्य का धार्मिक अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: ἐτέθη का कर्ता और χαρίσματι से उसका संबंध
  choice: जैसा उसके वरदान के अनुसार उसके लिए ठहराया गया है
  alternative: जैसा वह अपने वरदान में नियुक्त किया गया है
  rationale: यूनानी में व्यक्ति के ‘रखे/ठहराए जाने’ और उसके वरदान के संबंध की संक्षिप्तता कुछ अस्पष्ट है। मुख्य पाठ स्वाभाविक हिन्दी में भूमिका या स्थान के ठहराए जाने का भाव देता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- issue: σωζέσθω का सामुदायिक अर्थ
  choice: सुरक्षित रहे
  alternative: उद्धार पाए
  rationale: ‘सुरक्षित रहे’ यूनानी क्रिया की व्यापक अर्थ-सीमा और इस प्रसंग में पूरे शरीर की कुशलता/संरक्षा दोनों को बनाए रखता है, बिना इसे केवल अंतिम उद्धार तक सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामुदायिक और उपदेशात्मक शैली रखी गई है। ‘मसीह यीशु’, ‘शरीर’, ‘अधीन’ और ‘वरदान’ जैसे परिचित धार्मिक पद मूल रूपक और धर्मवैचारिक तनाव को सुरक्षित रखते हैं।
