source:
  edition: Funk 1901 (normalized OCR)
  text: ἀναλογισώμεθα οὖν, ἀδελφοί, ἐκ ποίας ὕλης ἐγενήθημεν, ποῖοι καὶ τίνες εἰσῆλθομεν εἰς τὸν κόσμον, ἐκ ποίου τάφου καὶ σκότους ὁ πλάσας ἡμᾶς καὶ δημιουργήσας εἰσήγαγεν εἰς τὸν κόσμον αὐτοῦ, προετοιμάσας τὰς εὐεργεσίας αὐτοῦ, πρὶν ἡμᾶς γεννηθῆναι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/003.yaml
  text: Let us therefore consider[a], brothers, from what material we came to be, what kind of people and what sort we were when we entered into the world, from what grave and darkness the one who formed us and created us brought us into his world[b], having prepared his benefits before we were born.
translation:
  language: hi
  text: इसलिए, भाइयो, हम विचार करें कि हम किस पदार्थ से बने, संसार में प्रवेश करते समय हम किस प्रकार के और कौन थे, और जिसने हमें गढ़ा और रचा, वह हमें किस कब्र और अंधकार से अपने संसार में लाया, जबकि उसने हमारे जन्म लेने से पहले ही अपने उपकार तैयार कर रखे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλογισώμεθα
  choice: हम विचार करें
  rationale: यह क्रिया मन लगाकर सोचने या विचार करने का आह्वान करती है; सरल और स्वाभाविक हिन्दी में यही अर्थ रखा गया है।
- source_word: ὕλης
  choice: पदार्थ
  rationale: मूल शब्द उस सामग्री या द्रव्य को दर्शाता है जिससे कुछ बनाया जाता है; ‘पदार्थ’ इस सृष्टिगत चित्र को बनाए रखता है।
- source_word: ποῖοι καὶ τίνες
  choice: हम कैसे और कौन थे
  rationale: 'दोनों प्रश्नवाचक शब्दों की भिन्नता को बनाए रखा गया है: ποῖοι गुण, प्रकार या दशा की ओर और τίνες पहचान की ओर संकेत करता है। हिन्दी में यह जानबूझकर दोहरा और चिंतनशील प्रयोग है।'
- source_word: τάφου καὶ σκότους
  choice: कब्र और अंधकार
  rationale: दोनों ठोस रूपकों को बिना यह तय किए रखा गया है कि उनका संकेत गर्भ, मृत्यु, अथवा किसी अन्य पूर्व दशा की ओर है।
- source_word: πλάσας ... δημιουργήσας
  choice: गढ़ा और रचा
  rationale: दो निकटार्थक किन्तु अलग क्रियाओं को बनाए रखा गया है; ‘गढ़ा’ आकार देने और ‘रचा’ सृजन करने का भाव देता है।
- source_word: εὐεργεσίας
  choice: उपकारों
  rationale: यह शब्द लाभकारी कार्यों या benefactions के लिए प्रयुक्त होता है और केवल सामान्य ‘भेंटों’ से अधिक स्पष्ट रूप से उपकारी कृत्यों का भाव देता है।
theological_decisions:
- issue: ‘कब्र और अंधकार’ का आशय
  choice: रूपक को ज्यों का त्यों खुला रखा गया
  alternative: इसे ‘गर्भ’ या किसी निश्चित आत्मिक दशा के रूप में स्पष्ट करना
  rationale: मूल पाठ τάφος और σκότος कहता है, पर उनके अभिप्राय की स्पष्ट व्याख्या नहीं करता; किसी एक धर्मवैचारिक अर्थ को आरोपित करना उचित नहीं होगा।
- issue: सृष्टिकर्ता के दो कार्यवाचक पद
  choice: ‘गढ़ा और रचा’ दोनों रखा गया
  alternative: दोनों को मिलाकर केवल ‘बनाया’ कहना
  rationale: मूल में πλάσας और δημιουργήσας दोनों हैं; दोहरे वर्णन से मनुष्य के गठन और सृजन पर दिया गया बल सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और चिंतनशील रूप अपनाया गया है। वाक्य की लंबाई घटाने के लिए मूल के प्रवाह को दो वाक्यों में बाँटा गया, पर तर्कक्रम और रूपक सुरक्षित रखे गए हैं। ‘भाइयो’ सामुदायिक संबोधन के रूप में स्वाभाविक है; ‘उपकारों’ से εὐεργεσία का लाभकारी और संरक्षक-सदृश भाव सामान्य धार्मिक ‘वरदानों’ में नहीं घुलता।
