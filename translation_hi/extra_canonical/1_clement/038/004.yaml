  yaml_path: translation/extra_canonical/1_clement/038/004.yaml
  text: Therefore, having all these things from him, we ought in every way to give thanks to him, to whom be the glory forever and ever. Amen.
translation:
  language: hi
  text: इसलिए, ये सब बातें उसी से पाकर, हमें हर बात में उसका धन्यवाद करना चाहिए; उसी की महिमा युगानुयुग हो। आमीन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα οὖν πάντα ἐξ αὐτοῦ ἔχοντες
  choice: इसलिए, जब हमें ये सब बातें उसी से मिली हैं
  rationale: कारणसूचक οὖν को स्वाभाविक हिन्दी में ‘इसलिए’ और ἔχοντες ... ἐξ αὐτοῦ को स्रोत से प्राप्त होने के भाव में प्रस्तुत किया गया है। ‘उसी’ से इस बात पर बल बना रहता है कि ये सब उसी से प्राप्त हैं।
- source_word: κατὰ πάντα εὐχαριστεῖν αὐτῷ
  choice: हर तरह से उसका धन्यवाद करना
  rationale: κατὰ πάντα का व्यापक अर्थ ‘हर तरह से’ रखा गया है और εὐχαριστεῖν को सामान्य, वर्तमान हिन्दी के ‘धन्यवाद करना’ से व्यक्त किया गया है।
- source_word: ᾧ ἡ δόξα
  choice: उसी की महिमा ... होती रहे
  rationale: यूनानी में क्रिया लुप्त है; हिन्दी में स्वाभाविक स्तुतिवचन के लिए इच्छासूचक ‘होती रहे’ जोड़ा गया है, बिना किसी अतिरिक्त धर्मवैज्ञानिक दावे के।
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: युगानुयुग
  rationale: यह स्थापित और सुबोध हिन्दी मुहावरा यूनानी के अनंत काल तक बने रहने वाले भाव को संक्षेप में सुरक्षित रखता है।
- source_word: ἀμήν
  choice: आमीन
  rationale: परंपरागत रूप से स्वीकृत हिन्दी लिप्यंतरण रखा गया है।
theological_decisions:
- issue: ᾧ का संदर्भ और स्तुतिवचन का क्रियात्मक भाव
  choice: ‘उसी की महिमा ... होती रहे’
  alternative: ‘जिसकी महिमा युगानुयुग है’
  rationale: ᾧ निकटवर्ती αὐτῷ की ओर लौटता है। मूल में स्पष्ट क्रिया नहीं है; इच्छासूचक स्तुतिवचन हिन्दी में स्वाभाविक है, जबकि ‘है’ मूल की संभावित स्तुतिपरक कामना को कथन में बदल सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामुदायिक पाठ के अनुकूल रखी गई है। कोई पाद-टिप्पणी आवश्यक नहीं है।
