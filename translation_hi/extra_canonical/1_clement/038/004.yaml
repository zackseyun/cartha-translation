    issue: Temporal recasting of the participle
    rationale: '''जब हमें ये सब बातें उसी से मिली हैं'' can sound primarily temporal and uses a completed-receipt formulation. The Greek participle ἔχοντες more directly grounds the exhortation in possessing/receiving these things from him.'
  - severity: low
    issue: Scope of κατὰ πάντα
    rationale: '''हर तरह से'' is possible, but ''हर बात में'' more directly preserves the broad ''in all things/every respect'' sense.'
