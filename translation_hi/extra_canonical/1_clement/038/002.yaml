source:
  edition: Funk 1901 (normalized OCR)
  text: ὁ ἰσχυρὸς ἐπιμελείσϑω τὸν ἀσϑενῆ, ὁ δὲ ἀσϑενὴς ἐντρεπέσϑω τὸν ἰσχυρόν· ὁ πλούσιος ἐπιχορηγείτω τῷ πτωχῷ, ὁ δὲ πτωχὸς εὐχαριστείτω τῷ ϑεῷ, ὅτι ἔδωκεν αὐτῷ, ᾧ οὐ ἀναπληρωθῇ αὐτοῦ τὸ ὑστέρημα· ὁ σοφὸς ἐνδεικνύσθω τὴν σοφίαν αὐτοῦ μὴ ἐν λόγοις, ἀλλʼ ἐν ἔργοις ἀγαθοῖς· ὁ ταπεινοφρονῶν μὴ ἑαυτῷ μαρτυρείτω, ἀλλʼ ἔατω ὑφʼ ἑτέρου ἑαυτὸν μαρτυρεῖσθαι· ὁ ἁγνὸς ἐν τῇ σαρκὶ μὴ ἀλαζονευέσθω, γινώσκων, ὅτι ἕτερός ἐστιν ὁ ἐπιχορηγῶν αὐτῷ τὴν ἐγκράτειαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/002.yaml
  text: Let the strong care for the weak[a], and let the weak respect the strong. Let the rich provide for the poor, and let the poor give thanks to God, because he has given him one through whom his need may be supplied. Let the wise show his wisdom not in words, but in good works. Let the humble-minded not testify concerning himself, but let him allow himself to be testified to by another. Let the one who is pure in the flesh not boast[b], knowing that it is another who supplies him with self-control.
translation:
  language: hi
  text: बलवान निर्बल की देखभाल करे, और निर्बल बलवान का आदर करे। धनी निर्धन की आवश्यकताएँ पूरी करे, और निर्धन परमेश्वर को धन्यवाद दे, क्योंकि उसने उसे ऐसा व्यक्ति दिया है जिसके द्वारा उसकी कमी पूरी हो सके।[a] बुद्धिमान अपनी बुद्धि शब्दों से नहीं, बल्कि भले कामों से दिखाए। नम्र मन वाला अपने विषय में स्वयं गवाही न दे, बल्कि किसी दूसरे को अपने विषय में गवाही देने दे। जो शरीर में शुद्ध है, वह घमंड न करे, क्योंकि वह जानता है कि उसे संयम प्रदान करने वाला कोई और है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में उस व्यक्ति की पहचान स्पष्ट नहीं की गई है जिसके द्वारा निर्धन की कमी पूरी होती है; संदर्भ में धनी व्यक्ति अभिप्रेत हो सकता है।
    reason: सर्वनाम-संदर्भ की वास्तविक अस्पष्टता को सुरक्षित रखना।
  - marker: b
    text: ‘कोई और’ से संभवतः परमेश्वर अभिप्रेत है, पर मूल पाठ यहाँ उसका नाम स्पष्ट रूप से नहीं लेता।
    reason: धर्मवैचारिक संकेत को बताए बिना मूल की अप्रत्यक्षता मिटाए नहीं रखना।
lexical_decisions:
- source_word: ἐπιμελείσϑω
  choice: देखभाल करे
  rationale: यह क्रिया सक्रिय चिंता, ध्यान और देखरेख का भाव रखती है; आधुनिक हिन्दी में ‘देखभाल करे’ स्वाभाविक और स्पष्ट है।
- source_word: ἐντρεπέσϑω
  choice: आदर करे
  rationale: यहाँ बलवान के प्रति सम्मान या संकोचपूर्ण मान रखने का भाव है; ‘आदर करे’ सामान्य पाठक के लिए सहज है और अनावश्यक रूप से भय का अर्थ नहीं जोड़ता।
- source_word: ἐπιχορηγείτω
  choice: आवश्यकताएँ पूरी करे
  rationale: संदर्भ में धनी द्वारा निर्धन को आवश्यक सहायता या साधन उपलब्ध कराने का अर्थ है; केवल ‘दे’ की अपेक्षा यह आशय अधिक स्पष्ट करता है।
- source_word: ὑστέρημα
  choice: कमी
  rationale: यह अभाव या आवश्यकता की कमी को सूचित करता है और अगले क्रियापद ἀναπληρωθῇ के साथ स्वाभाविक हिन्दी बनाता है।
- source_word: ταπεινοφρονῶν
  choice: नम्र मन वाला
  rationale: शब्द मनोवृत्ति की नम्रता पर बल देता है, न कि केवल बाहरी दीनता पर।
- source_word: ἁγνὸς ἐν τῇ σαρκί
  choice: शरीर में शुद्ध
  rationale: मूल की देह-संबंधी शुद्धता को जानबूझकर व्यापक रूप में रखा गया है; इसे किसी एक विशिष्ट लैंगिक या तपस्वी अर्थ तक सीमित नहीं किया गया।
- source_word: ἐγκράτειαν
  choice: संयम
  rationale: यह आत्म-संयम या इंद्रिय-निग्रह का बोध कराता है; ‘संयम’ आधुनिक हिन्दी में संक्षिप्त, गरिमापूर्ण और पर्याप्त व्यापक है।
theological_decisions:
- issue: निर्धन को दिया गया व्यक्ति कौन है
  choice: ‘ऐसा व्यक्ति ... जिसके द्वारा’ कहकर व्यक्ति की पहचान अनिर्दिष्ट रखी गई
  alternative: इसे सीधे ‘धनी व्यक्ति’ कहना
  rationale: यूनानी में सर्वनाम है और निकट संदर्भ धनी व्यक्ति की ओर संकेत कर सकता है, पर पहचान स्पष्ट रूप से कही नहीं गई; इसलिए निहितार्थ को सिद्ध तथ्य नहीं बनाया गया।
- issue: संयम प्रदान करने वाला ‘दूसरा’
  choice: ‘कोई और’
  alternative: स्पष्ट रूप से ‘परमेश्वर’
  rationale: संदर्भ में परमेश्वर अभिप्रेत होने की प्रबल संभावना है, पर यूनानी ἕτερός केवल ‘दूसरा/कोई और’ कहता है; अनुवाद ने इस अप्रत्यक्षता और धार्मिक तनाव को सुरक्षित रखा है।
- issue: शरीर में शुद्धता का क्षेत्र
  choice: मूल के व्यापक वाक्यांश ‘शरीर में शुद्ध’ को रखा
  alternative: ‘यौन रूप से शुद्ध’ या ‘ब्रह्मचारी’
  rationale: मूल पाठ विशिष्ट अवस्था या संप्रदायगत अनुशासन का नाम नहीं लेता; अधिक संकीर्ण अनुवाद अनावश्यक व्याख्या जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और उपदेशात्मक लहजा रखा गया है। समानांतर आज्ञार्थक संरचनाएँ सुरक्षित हैं। कठिन शाब्दिक निष्क्रिय वाक्यांशों को स्वाभाविक हिन्दी में बदला गया है, पर मूल की सर्वनामगत और धर्मवैचारिक अस्पष्टताएँ पादटिप्पणियों सहित बनाए रखी गई हैं।
