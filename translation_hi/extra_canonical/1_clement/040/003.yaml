source:
  edition: Funk 1901 (normalized OCR)
  text: ποῦ τε καὶ διὰ τίνων ἐπιτελεῖσθαι θέλει, αὐτὸς ὥρισεν τῇ ὑπερτάτῃ αὐτοῦ βουλήσει, ἵνʼ ὁσίως πάντα γινόμενα ἐν εὐδοκήσει εὐπρόσδεκτα εἴη τῷ θελήματι αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/003.yaml
  text: And where and through whom he wants them to be performed[a], he himself determined by his supreme will, so that all things, being done in holiness, might be acceptable to his will according to his good pleasure.
translation:
  language: hi
  text: और उसने स्वयं अपनी सर्वोच्च योजना से यह निर्धारित किया है कि वे कहाँ और किनके द्वारा सम्पन्न किए जाएँ, ताकि सब कुछ पवित्रता से किया जाए और उसकी इच्छा को उसकी प्रसन्नता के अनुसार स्वीकार्य हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιτελεῖσθαι
  choice: सम्पन्न किए जाएँ
  rationale: यह क्रिया निर्धारित धार्मिक कार्यों को विधिपूर्वक पूरा करने का भाव देती है; संदर्भ से निहित बहुवचन कर्म को ‘वे’ द्वारा बनाए रखा गया है।
- source_word: τῇ ὑπερτάτῃ αὐτοῦ βουλήσει
  choice: अपनी परम इच्छा से
  rationale: ὑπερτάτῃ का सर्वोच्चता-बोध ‘परम’ से और βούλησις का निर्णयकारी इच्छा-बोध ‘इच्छा’ से स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: ὁσίως
  choice: पवित्रता से
  rationale: यह धार्मिक रीति से अथवा पवित्र ढंग से किए जाने का क्रियाविशेषणात्मक भाव रखता है।
- source_word: εὐπρόσδεκτα
  choice: स्वीकार्य
  rationale: शब्द का अर्थ अनुग्रहपूर्वक ग्रहण किए जाने योग्य होना है; ‘स्वीकार्य’ इसे संक्षेप और स्पष्टता से व्यक्त करता है।
theological_decisions:
- issue: ἐν εὐδοκήσει का वाक्यगत संबंध
  choice: मुख्य पाठ में इसे ‘स्वीकार्य ठहरे’ से जोड़कर ‘उसकी प्रसन्नता के अनुसार’ रखा गया है।
  alternative: 'इसे γινόμενα के साथ जोड़कर अर्थ हो सकता है: सब कुछ ‘पवित्रता से और उसकी प्रसन्न इच्छा के अनुसार किया जाए।’'
  rationale: यूनानी पदबंध दोनों प्रकार से जुड़ सकता है। मुख्य पाठ हाल की स्रोत-समीक्षा और वाक्य-प्रवाह का अनुसरण करता है, जबकि पादटिप्पणी वास्तविक व्याकरणिक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। धार्मिक अनुष्ठान का संदर्भ स्पष्ट करने हेतु ‘सम्पन्न’ चुना गया है, पर मूल में निहित कर्म की अनिर्दिष्टता ‘वे’ के रूप में सुरक्षित है।
