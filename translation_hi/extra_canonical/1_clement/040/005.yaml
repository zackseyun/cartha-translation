source:
  edition: Funk 1901 (normalized OCR)
  text: τῷ γὰρ ἀρχιερεῖ ἴδιαι λειτουργίαι δεδομέναι εἰσίν, καὶ τοῖς ἱερεῦσιν ἴδιος ὁ τόπος προστέτακται, καὶ λευΐταις ἴδιαι διακονίαι ἐπίκεινται· ὁ λαϊκὸς ἄνθρωπος τοῖς λαϊκοῖς προστάγμασιν δέδεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/005.yaml
  text: For to the high priest his own ministries have been given[a], and to the priests their own place has been assigned, and upon the Levites their own services are laid; the layman is bound by the lay ordinances.
translation:
  language: hi
  text: क्योंकि महायाजक को उसकी अपनी सेवा-विधियाँ दी गई हैं, और याजकों को उनका अपना स्थान सौंपा गया है, और लेवियों पर उनके अपने सेवा-कार्य लगाए गए हैं; साधारण व्यक्ति साधारण जन के लिए ठहराई गई आज्ञाओं से बँधा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρχιερεῖ
  choice: महायाजक
  rationale: यह स्थापित और स्पष्ट हिन्दी धार्मिक पदनाम है, जो यूनानी के एकवचन पद को ठीक प्रकार व्यक्त करता है।
- source_word: λειτουργίαι
  choice: सेवाएँ
  rationale: यहाँ शब्द महायाजक को दिए गए विधिवत धार्मिक कर्तव्यों को दर्शाता है; ‘सेवाएँ’ स्वाभाविक हिन्दी में इस भाव को व्यापक रूप से बनाए रखता है।
- source_word: ἱερεῦσιν
  choice: याजकों
  rationale: पुरोहितीय पद के लिए प्रचलित बाइबलीय हिन्दी शब्द, बहुवचन को बनाए रखते हुए।
- source_word: τόπος
  choice: स्थान
  rationale: मूल का शाब्दिक अर्थ ‘स्थान’ है और संदर्भ में नियुक्त पद अथवा कार्यक्षेत्र की संभावित व्यापकता को बिना सीमित किए सुरक्षित रखता है।
- source_word: λευΐταις
  choice: लेवियों
  rationale: इस्राएली उपासना-व्यवस्था के समूह के लिए प्रचलित हिन्दी रूप।
- source_word: διακονίαι
  choice: सेवाएँ
  rationale: विभिन्न सौंपे गए सेवा-कार्य इसका आशय हैं; ‘सेवाएँ’ बहुवचन और कर्तव्यगत अर्थ दोनों को सहजता से व्यक्त करता है।
- source_word: λαϊκὸς ἄνθρωπος
  choice: साधारण जन
  rationale: यह गैर-याजकीय व्यक्ति को दर्शाता है। ‘साधारण जन’ आधुनिक पाठक के लिए ‘लौकिक मनुष्य’ अथवा उधार लिए गए ‘लेमैन’ से अधिक स्पष्ट और स्वाभाविक है।
- source_word: λαϊκοῖς προστάγμασιν
  choice: साधारण जन के लिए ठहराई गई आज्ञाओं
  rationale: विशेषण λαϊκοῖς को उसके वर्गगत अर्थ में व्यक्त करता है और हिन्दी में अस्पष्ट ‘साधारण आज्ञाओं’ से बचता है।
- source_word: δέδεται
  choice: से बँधा है
  rationale: पूर्णकालिक निष्क्रिय रूप की स्थायी बाध्यता को निकटता से व्यक्त करता है।
theological_decisions:
- issue: κληρकीय और साधारण जन के बीच भूमिकाओं का भेद
  choice: पदों और सौंपे गए कर्तव्यों का स्पष्ट भेद बनाए रखा गया है।
  alternative: इसे कलीसियाई अधिकार-क्रम या किसी आधुनिक संप्रदाय की पदव्यवस्था के रूप में अधिक स्पष्ट करना।
  rationale: मूल पाठ पुराने विधान की उपासना-व्यवस्था का उदाहरण देता है; अनुवाद को इससे आगे कोई विशिष्ट आधुनिक कलीसियाई संरचना स्थापित नहीं करनी चाहिए।
- issue: τόπος का आशय
  choice: ‘स्थान’ रखा गया है।
  alternative: ‘पद’, ‘कार्यक्षेत्र’ या ‘नियत सेवा-स्थान’।
  rationale: यूनानी शब्द वास्तविक स्थान और नियत भूमिका—दोनों की ओर संकेत कर सकता है; ‘स्थान’ मूल की अस्पष्टता को सुरक्षित रखता है।
- issue: महायाजक और लेवियों की सेवाओं के लिए समान हिन्दी शब्द
  choice: λειτουργίαι और διακονίαι दोनों के लिए ‘सेवाएँ’ रखा गया है।
  alternative: पहले के लिए ‘धार्मिक अनुष्ठान’ और दूसरे के लिए ‘सेवा-कार्य’।
  rationale: मूल में दो अलग शब्द हैं, पर इस छोटे पद में कृत्रिम तकनीकी भेद आरोपित करना उचित नहीं; ‘सेवाएँ’ दोनों के कर्तव्यगत अर्थ को व्यक्त करता है, जबकि वाक्य-संरचना उनके अलग-अलग सौंपे जाने को दिखाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली। वाक्य का समानांतर ढाँचा और अंतिम अर्धविराम मूल यूनानी की तर्कात्मक लय को बनाए रखते हैं। किसी आधुनिक संप्रदाय-विशेष की शब्दावली से बचा गया है।
