  text: τὰς τε προσφορὰς καὶ λειτουργίας ἐπιτελεῖσθαι, καὶ οὐκ εἰκῇ ἢ ἀτάκτως ἐκέλευσεν γίνεσθαι, ἀλλʼ ὡρισμένοις καιροῖς καὶ ὥραις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/002.yaml
  text: He commanded that both the offerings and the services be performed[a], and not take place casually or disorderly, but at appointed times and hours.
translation:
  language: hi
  text: उसने आज्ञा दी कि भेंटें अर्पित की जाएँ और सेवाएँ संपन्न की जाएँ, और ये मनमाने ढंग से या अव्यवस्थित रीति से नहीं, बल्कि निर्धारित अवसरों और घंटों पर की जाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσφορὰς
  choice: भेंटें
  rationale: यह धार्मिक संदर्भ में अर्पित की जाने वाली भेंटों को स्वाभाविक और व्यापक रूप से व्यक्त करता है।
- source_word: λειτουργίας
  choice: सेवाएँ
  rationale: यहाँ धार्मिक अथवा उपासना-संबंधी निर्धारित सेवाएँ अभिप्रेत हैं; ‘सेवाएँ’ किसी बाद की विशिष्ट पद-व्यवस्था को आरोपित किए बिना अर्थ को बनाए रखता है।
- source_word: ἐπιτελεῖσθαι
  choice: पूरी की जाएँ
  rationale: क्रिया का अर्थ संपन्न या पूरा किए जाने का है; भेंटों के साथ हिंदी में अधिक स्वाभाविक संगति के लिए अलग क्रिया ‘चढ़ाई जाएँ’ प्रयुक्त हुई है।
- source_word: εἰκῇ
  choice: मनमाने ढंग से
  rationale: यह बिना योजना, उद्देश्य या निर्धारित व्यवस्था के किए जाने का भाव व्यक्त करता है और ‘निर्धारित समयों’ के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: ἀτάκτως
  choice: अव्यवस्थित रीति से
  rationale: यह क्रम अथवा व्यवस्था के अभाव को सीधे व्यक्त करता है।
- source_word: ὡρισμένοις καιροῖς καὶ ὥραις
  choice: निर्धारित समयों और घड़ियों पर
  rationale: καιροῖς और ὥραις, दोनों समय-सूचक शब्दों का भेद यथासंभव सुरक्षित रखा गया है; ‘घड़ियों’ से नियत घंटों का भाव आता है।
theological_decisions:
- issue: आज्ञा देने वाले का संदर्भगत कर्ता
  choice: उसने
  alternative: परमेश्वर ने / प्रभु ने
  rationale: यूनानी वाक्य में कर्ता अंतर्निहित है और इस अंश में पूर्वसंदर्भ से ग्रहण किया जाता है। संप्रदायगत या व्याख्यात्मक स्पष्टता जोड़ने के बजाय सर्वनाम द्वारा मूल की संदर्भ-निर्भरता बनाए रखी गई है।
- issue: λειτουργίας का संस्थागत अर्थ
  choice: सेवाएँ
  alternative: सेवकाइयाँ / धर्म-विधियाँ
  rationale: मूल शब्द धार्मिक सेवा या कर्तव्य का संकेत देता है, पर यहाँ किसी विशिष्ट बाद की कलीसियाई पद-व्यवस्था को निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय किंतु सहज शैली। वाक्य के समानांतर धार्मिक कार्यों को हिंदी में स्वाभाविक बनाने के लिए ‘भेंटें चढ़ाई जाएँ’ और ‘सेवाएँ पूरी की जाएँ’ रखा गया है। मूल के निषेधात्मक विरोध और निर्धारित अवसरों/घंटों की द्विविध समय-अभिव्यक्ति सुरक्षित है।
