source:
  edition: Funk 1901 (normalized OCR)
  text: Προδήλων οὖν ἡμῖν ὄντων τούτων, καὶ ἐγκεχυφότες εἰς τὰ βάθη τῆς θείας γνώσεως, πάντα τάξει ποιεῖν ὀφείλομεν, ὅσα ὁ δεσπότης ἐπιτελεῖν ἐκέλευσεν κατὰ καιροὺς τεταγμένους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/001.yaml
  text: Therefore, since these things are plain to us, and since we have peered into the depths of the divine knowledge, we ought to do Therefore, since these things are plain to us, and since we have peered into the depths of the divine knowledge, we ought to do in order everything that the Master commanded to be carried out at the appointed times. to be carried out at the appointed times.
translation:
  language: hi
  text: इसलिए, जब ये बातें हमारे लिए स्पष्ट हैं और हम दिव्य ज्ञान की गहराइयों में झाँक चुके हैं, तो हमें वे सभी काम क्रम से करने चाहिए, जिन्हें स्वामी ने नियत समयों पर पूरा करने की आज्ञा दी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προδήλων
  choice: स्पष्ट
  rationale: यह शब्द ऐसी बातों को दर्शाता है जो पहले से प्रत्यक्ष या साफ़ हैं; आधुनिक हिन्दी में ‘स्पष्ट’ स्वाभाविक और सटीक है।
- source_word: ἐγκεχυφότες
  choice: ध्यानपूर्वक झाँक चुके हैं
  rationale: क्रिया का मूल भाव किसी वस्तु पर झुककर गहराई से देखने या मन लगाकर जाँचने का है; यह अनुवाद उसके पूर्ण कृदन्त और गंभीर अध्ययन—दोनों भावों को रखता है।
- source_word: τὰ βάθη τῆς θείας γνώσεως
  choice: परमेश्वर के ज्ञान की गहराइयों
  rationale: θείας को केवल अमूर्त ‘दिव्य’ कहने के बजाय संदर्भानुकूल रूप से परमेश्वर-संबंधी स्वामित्व में व्यक्त किया गया है, जबकि बहुवचन ‘गहराइयों’ को सुरक्षित रखा गया है।
- source_word: τάξει
  choice: उचित क्रम से
  rationale: करण/रीति के अर्थ वाले इस संप्रदान कारक का आशय व्यवस्थित ढंग से है, न कि प्रयोजनवाचक ‘ताकि’; ‘उचित’ हिन्दी में निहित सुव्यवस्था को स्वाभाविक बनाता है।
- source_word: δεσπότης
  choice: प्रभु
  rationale: δεσπότης अधिकारयुक्त स्वामी को सूचित करता है। धार्मिक हिन्दी में ‘प्रभु’ गरिमापूर्ण और सहज है तथा यहाँ परमेश्वर के प्रभुत्व का भाव रखता है।
- source_word: κατὰ καιροὺς τεταγμένους
  choice: निर्धारित समयों पर
  rationale: καιρούς का बहुवचन और τεταγμένους का नियत/ठहराए हुए होने का भाव दोनों सुरक्षित हैं।
theological_decisions:
- issue: θεία γνώσις का संबंध
  choice: ‘परमेश्वर के ज्ञान’ के रूप में अनुवाद
  alternative: ‘दिव्य ज्ञान’
  rationale: यूनानी वाक्यांश परमेश्वर से संबंधित ज्ञान को व्यक्त करता है और संदर्भ में परमेश्वर की प्रकट व्यवस्था की ओर संकेत करता है। फिर भी यह अनुवाद ज्ञान के कर्तृवाचक या विषयवाचक संबंध को आगे स्पष्ट करके तनाव को कृत्रिम रूप से हल नहीं करता।
- issue: δεσπότης की पहचान और अधिकार
  choice: ‘प्रभु’
  alternative: ‘स्वामी’
  rationale: ‘प्रभु’ धार्मिक संदर्भ में स्वाभाविक है और अधिकार का भाव देता है, बिना पाठ से परे किसी विशिष्ट ख्रीस्तीय व्यक्ति की पहचान आरोपित किए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। वाक्य की तर्कगत गति—‘इसलिए’, दो आधारवाचक कथन, और फिर नैतिक दायित्व—सुरक्षित है। अंग्रेज़ी परामर्श-पाठ की पुनरावृत्ति/विकृति का अनुसरण नहीं किया गया; यूनानी τάξει को रीति-सूचक मानकर ‘उचित क्रम से’ अनूदित किया गया है।
