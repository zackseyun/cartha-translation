id: 1CLEM.40.4
reference: 1 Clement 40:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: οἱ οὖν τοῖς προστεταγμένοις καιροῖς ποιοῦντες τὰς προσφορὰς αὐτῶν εὐπρόσδεκτοί τε καὶ μακάριοί· τοῖς γὰρ νομίμοις τοῦ δεσπότου ἀκολουθοῦντες οὐ διαμαρτάνουσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/004.yaml
  text: Therefore those who make their offerings at the appointed times are both acceptable and blessed[a]; for by following the lawful ordinances of the Master they do not go astray.
translation:
  language: hi
  text: इसलिए जो लोग नियत समयों पर[a] अपनी भेंटें चढ़ाते हैं, वे स्वीकारयोग्य और धन्य हैं; क्योंकि स्वामी के विधानों का पालन करते हुए वे चूकते नहीं हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निर्धारित समयों पर’।
    reason: यूनानी पदबंध में समयों के पहले से नियुक्त या निर्धारित किए जाने का भाव है; दोनों हिंदी रूप संभव हैं।
lexical_decisions:
- source_word: τοῖς προστεταγμένοις καιροῖς
  choice: नियत समयों पर
  rationale: प्रोस्तेताग्मेनोइस का पूर्ण कर्मवाच्य भाव उन समयों को दर्शाता है जो पहले से निर्धारित किए गए हैं; ‘नियत समयों पर’ संक्षिप्त और स्वाभाविक है।
- source_word: τὰς προσφορὰς αὐτῶν
  choice: अपनी भेंटें
  rationale: प्रोस्फोरा धार्मिक रूप से अर्पित भेंट को सूचित करता है; बहुवचन को बनाए रखा गया है और क्रिया में ‘चढ़ाते हैं’ से अर्पण का भाव स्पष्ट किया गया है।
- source_word: εὐπρόσδεκτοί
  choice: स्वीकारयोग्य
  rationale: यह शब्द ऐसे व्यक्तियों के लिए है जिनका अनुकूल रूप से स्वागत या स्वीकार होता है; ‘स्वीकारयोग्य’ उस भाव को बिना अतिरिक्त व्याख्या के रखता है।
- source_word: τοῖς νομίμοις τοῦ δεσπότου
  choice: स्वामी के विधानों
  rationale: नॉमिमा यहाँ वैध रूप से ठहराए गए नियमों या विधानों को दर्शाता है। देस्पोतेस के अधिकारपूर्ण भाव के लिए ‘स्वामी’ चुना गया है।
- source_word: οὐ διαμαρτάνουσιν
  choice: वे चूकते नहीं
  rationale: क्रिया का मूल भाव लक्ष्य या अपेक्षित कर्तव्य से चूकना है; यह अनावश्यक नैतिक विस्तार किए बिना स्रोत की संक्षिप्तता रखता है।
theological_decisions:
- issue: δεσπότης को दैवी उपाधि के रूप में प्रस्तुत करना
  choice: स्वामी
  alternative: प्रभु
  rationale: ‘स्वामी’ यूनानी शब्द में निहित अधिकार और अधिपत्य को सीधे व्यक्त करता है, जबकि ‘प्रभु’ इसे अधिक परिचित धार्मिक उपाधि बना सकता है। स्रोत यहाँ केवल ‘स्वामी’ कहता है, इसलिए उसी तनाव को बनाए रखा गया है।
- issue: νομίμοις का आशय
  choice: विधानों
  alternative: नियमों
  rationale: ‘विधान’ निर्धारित धार्मिक व्यवस्था और अधिकृत प्रथाओं दोनों को समेटता है; इससे पद को किसी विशिष्ट संप्रदाय की विधि-व्यवस्था तक सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘भेंटें चढ़ाते हैं’ धार्मिक संदर्भ में स्वाभाविक है, जबकि ‘स्वामी के विधान’ मूल के अधिकारपूर्ण और औपचारिक स्वर को बनाए रखता है।
