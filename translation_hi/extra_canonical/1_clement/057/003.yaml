source:
  edition: Funk 1901 (normalized OCR)
  text: οὕτω γὰρ λέγει ἡ πανάρετος σοφία· Ἰδοὺ, προΐομαι ὑμῖν ἐμῆς πνοῆς ῥῆσιν, διδάξω δὲ ὑμᾶς τὸν ἐμὸν λόγον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/003.yaml
  text: 'For thus says all-virtuous Wisdom: “Behold[a], I will pour out to you a saying from my breath, and I will teach you my word.”'
translation:
  language: hi
  text: 'क्योंकि सर्वगुणसंपन्न बुद्धि इस प्रकार कहती है: “देखो, मैं तुम पर अपनी श्वास से निकली वाणी उंडेलूँगी[a] और तुम्हें अपना वचन सिखाऊँगी।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप के अधिक निकट: “मैं तुम पर अपनी श्वास की एक उक्ति उंडेलूँगी।”'
    reason: ἐμῆς πνοῆς ῥῆσιν में संबंध ‘मेरी श्वास की उक्ति’ या अधिक स्वाभाविक रूप से ‘मेरी श्वास से निकली वाणी’ समझा जा सकता है; टिप्पणी इस संरचनात्मक अस्पष्टता को सुरक्षित रखती है।
lexical_decisions:
- source_word: πανάρετος σοφία
  choice: सर्वगुणसंपन्न बुद्धि
  rationale: यह व्यक्तिरूप में बोलती ‘बुद्धि’ को स्त्रीलिंग रखते हुए πανάρετος के ‘समस्त सद्गुणों से युक्त’ अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: προΐομαι
  choice: उंडेलूँगी
  rationale: इस संदर्भ में क्रिया किसी बात को बाहर प्रवाहित करने या प्रकट करने का चित्र देती है; ‘उंडेलूँगी’ मूल बिंब को बनाए रखता है।
- source_word: ἐμῆς πνοῆς ῥῆσιν
  choice: अपनी श्वास से निकली वाणी
  rationale: πνοή का ठोस अर्थ ‘श्वास’ और ῥῆσις का अर्थ ‘उक्ति/वाणी’ है। यह पदबंध दोनों को स्वाभाविक हिन्दी में रखते हुए उनके संबंध की हल्की अस्पष्टता भी बचाता है।
- source_word: τὸν ἐμὸν λόγον
  choice: अपना वचन
  rationale: λόγος को ῥῆσις से अलग रखते हुए ‘वचन’ मूल की शब्दावली और काव्यात्मक समानांतरता को सुरक्षित रखता है।
theological_decisions:
- issue: ‘बुद्धि’ का व्यक्तिरूप और स्त्रीलिंग
  choice: कहती है…उंडेलूँगी…सिखाऊँगी
  alternative: लिंग-निरपेक्ष या पुरुषलिंग क्रियाएँ
  rationale: σοφία यूनानी में स्त्रीलिंग है और यहाँ स्वयं बोलती हुई व्यक्तिरूप में प्रस्तुत है; हिन्दी की ‘बुद्धि’ भी स्त्रीलिंग होने से यह रूप स्रोत के अनुरूप और स्वाभाविक है।
- issue: πνοή को ‘आत्मा’ या ‘श्वास’ कहना
  choice: श्वास
  alternative: आत्मा
  rationale: πνοή का प्रत्यक्ष अर्थ ‘श्वास/फूँक’ है। ‘आत्मा’ चुनने से ऐसा धर्मवैज्ञानिक अर्थ जुड़ सकता था जिसे यह यूनानी पद आवश्यक नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सर्वगुणसंपन्न’ साहित्यिक है, पर अत्यधिक संस्कृतनिष्ठ नहीं; ‘वाणी’ और ‘वचन’ से यूनानी ῥῆσις तथा λόγος का भेद यथासंभव बनाए रखा गया है।
