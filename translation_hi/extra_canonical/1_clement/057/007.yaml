source:
  edition: Funk 1901 (normalized OCR)
  text: ἀνθ' ὧν γὰρ ἠδίκουν νηπίους φονευθήσονται, καὶ ἐξέτασμος ἀσεβεῖς ὀλεῖ· ὁ δὲ ἐμοῦ ἀκούων κατασκηνώσει ἐπ' ἐλπίδι πεποιθὼς καὶ ἡσυχάσει ἀφόβως ἀπὸ παντὸς κακοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/007.yaml
  text: For because they were wronging the innocent[a], they will be slain, and inquiry will destroy the ungodly; but the one who hears me will dwell, trusting in hope, and will be at rest without fear from every evil.
translation:
  language: hi
  text: क्योंकि वे भोले लोगों[a] के साथ अन्याय करते थे, इसलिए वे मार डाले जाएँगे; और जाँच भक्तिहीनों का नाश कर देगी। पर जो मेरी सुनता है, वह आशा में भरोसा रखकर बसेगा और हर बुराई से निर्भय होकर चैन पाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बालकों’; अथवा ‘अपरिपक्व/अनुभवहीन लोगों’। प्रसंग के अनुसार ‘असहाय निर्दोष लोगों’ का भाव भी समझा गया है।
    reason: यूनानी νηπίους का शाब्दिक अर्थ बालक हो सकता है, और ज्ञान-साहित्य में यह भोले या अनुभवहीन लोगों के लिए भी प्रयुक्त होता है। ‘निर्दोष’ एक व्याख्यात्मक, संदर्भगत संभावना है, निश्चित अर्थ नहीं।
lexical_decisions:
- source_word: νηπίους
  choice: भोले लोगों
  rationale: यह शब्द मूलतः छोटे या अपरिपक्व लोगों को सूचित कर सकता है और ज्ञान-साहित्य में अनुभवहीन अथवा भोले लोगों के लिए प्रयुक्त होता है। ‘निर्दोष’ नैतिक निष्पापता का अर्थ अधिक स्पष्टता से जोड़ देता, जो यूनानी शब्द में अनिवार्य नहीं है।
- source_word: ἐξέτασμος
  choice: जाँच
  rationale: यह दुर्लभ संज्ञा छानबीन, परीक्षण या जाँच को सूचित करती है। ‘जाँच’ आधुनिक हिन्दी में स्वाभाविक है और मूल की संक्षिप्तता बनाए रखती है।
- source_word: ἀσεβεῖς
  choice: भक्तिहीनों
  rationale: यह शब्द परमेश्वर के प्रति श्रद्धा या भक्ति से रहित लोगों को दर्शाता है; ‘भक्तिहीन’ उसके धार्मिक और नैतिक आयाम को बनाए रखता है।
- source_word: κατασκηνώσει
  choice: बसेगा
  rationale: क्रिया का अर्थ डेरा डालना या निवास करना है। यहाँ स्थिर और सुरक्षित निवास के भाव के लिए ‘बसेगा’ स्वाभाविक हिन्दी है, जबकि सुरक्षा का भाव आगे के निर्भय विश्राम से प्रकट होता है।
- source_word: ἡσυχάσει
  choice: चैन पाएगा
  rationale: क्रिया शांत रहने या विश्राम पाने का भाव देती है। ‘चैन पाएगा’ निर्भय शांति को सरल, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: νηπίους का नैतिक अर्थ
  choice: मुख्य पाठ में ‘भोले लोगों’
  alternative: ‘निर्दोष लोगों’
  rationale: यूनानी शब्द स्वयं नैतिक निष्पापता को निश्चित नहीं करता। ज्ञान-साहित्य की ‘भोले/अनुभवहीन’ श्रेणी को मुख्य पाठ में रखना और वैकल्पिक अर्थ को पादटिप्पणी में बताना वास्तविक अर्थ-सीमा को सुरक्षित रखता है।
- issue: ἐξέτασμος को कर्ता के रूप में बनाए रखना
  choice: ‘जाँच भक्तिहीनों का नाश कर देगी’
  alternative: ‘भक्तिहीन जाँच में नष्ट हो जाएँगे’
  rationale: मूल वाक्य में ‘जाँच’ व्याकरणिक कर्ता है। इसे बनाए रखने से न्यायिक छानबीन के मानवीय या दैवी अभिकर्ता को अनावश्यक रूप से निश्चित नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-समीप शैली अपनाई गई है। न्याय और आश्वासन के बीच मूल विरोध को ‘पर’ से स्पष्ट रखा गया है; वाक्य के संक्षिप्त, सूक्तिपरक स्वर को बनाए रखने का प्रयास किया गया है।
