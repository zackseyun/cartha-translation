source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπειδὴ ἐκάλουν καὶ οὐχ ὑπηκούσατε, καὶ ἐξέτεινον λόγους καὶ οὐ προσεἴχετε, ἀλλὰ ἀκύρους ἐποιεῖτε τὰς ἐμὰς βουλάς, τοῖς δὲ ἐμοῖς ἐλέγχοις ἠπειθήσατε· τοιγαροῦν κἀγὼ τῇ ὑμετέρᾳ ἀπωλείᾳ ἐπιγελάσομαι, καταχαροῦμαι δέ, ἥνικα ἂν ἔρχηται ὑμῖν ὄλεθρος καὶ ὡς ἂν ἀφίκηται ὑμῖν ἄφνω θόρυβος, ἡ δὲ καταστροφή ὁμοία καταιγὶδι παρῇ, ἢ ὅταν ἔρχηται ὑμῖν θλῖψις καὶ πολιορκία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/004.yaml
  text: Because I called and you did not listen, and I stretched out words and you paid no attention, but made my counsels void, and disobeyed my reproofs, therefore I also will laugh at your ruin; I will rejoice when destruction comes upon you, and when sudden turmoil reaches you, and your overthrow comes like a storm, or when affliction and siege come upon you.
translation:
  language: hi
  text: क्योंकि मैंने पुकारा और तुमने नहीं सुना; मैंने अपने वचन आगे बढ़ाए और तुमने ध्यान नहीं दिया; बल्कि तुमने मेरी सलाहों को निष्फल कर दिया और मेरी ताड़नाओं को नहीं माना। इसलिए मैं भी तुम्हारी बरबादी पर हँसूँगा; जब तुम पर विनाश आएगा, तब मैं आनंदित होऊँगा; जब अचानक कोलाहल तुम पर आ पड़ेगा और तुम्हारा पतन आँधी के समान आ पहुँचेगा, या जब तुम पर क्लेश और घेराबंदी आएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέτεινον λόγους
  choice: मैंने अपनी बातें तुम्हारे सामने रखीं
  rationale: शाब्दिक रूप से ‘मैंने बातें फैलायीं/आगे बढ़ायीं’; हिन्दी में यह स्वाभाविक रूप से लगातार और स्पष्ट रूप से बात सामने रखने का भाव देता है, बिना स्रोत में निहित असामान्य रूपक को कठोर बनाने के।
- source_word: ἀκύρους ἐποιεῖτε
  choice: व्यर्थ ठहराया
  rationale: ἀκύρους का अर्थ प्रभावहीन, अमान्य या निष्फल करना है; ‘व्यर्थ ठहराया’ सलाह को अस्वीकार करके निष्प्रभावी मानने का भाव सुरक्षित रखता है।
- source_word: ἐλέγχοις
  choice: डाँट
  rationale: यहाँ शब्द सुधारने वाली फटकार या ताड़ना को सूचित करता है; सामान्य पाठक के लिए ‘डाँट’ स्पष्ट और स्वाभाविक है।
- source_word: ἀπώλεια
  choice: विनाश
  rationale: व्यक्ति पर आने वाली बरबादी या नाश के लिए गंभीर और व्यापक हिन्दी पद।
- source_word: ὄλεθρος
  choice: बरबादी
  rationale: निकटवर्ती ἀπώλεια की पुनरुक्ति को यथासंभव अलग रखते हुए नाशकारी विपत्ति का भाव व्यक्त करता है।
- source_word: θόρυβος
  choice: कोलाहल
  rationale: शब्द हंगामे, उथल-पुथल या आतंकपूर्ण हलचल को दर्शा सकता है; ‘कोलाहल’ स्रोत की अस्पष्टता को किसी विशिष्ट आपदा में सीमित नहीं करता।
- source_word: καταστροφή
  choice: सर्वनाश
  rationale: अचानक आने वाले पूर्ण उलटाव और विध्वंस का प्रबल भाव देता है तथा आँधी की उपमा के साथ स्वाभाविक बैठता है।
- source_word: πολιορκία
  choice: घेराबंदी
  rationale: नगर या लोगों को चारों ओर से घेर लेने की प्रत्यक्ष सैन्य-संकट संबंधी धारणा को ठीक प्रकार व्यक्त करता है।
theological_decisions:
- issue: विनाश पर हँसने और आनन्द मनाने वाला वक्ता
  choice: प्रथम पुरुष के कठोर न्याय-वचन को ज्यों का त्यों रखा गया
  alternative: इसे केवल रूपकात्मक चेतावनी या अनिवार्य परिणाम के रूप में नरम करना
  rationale: यूनानी पाठ में κἀγὼ ... ἐπιγελάσομαι और καταχαροῦμαι स्पष्ट हैं। अनुवाद को इस धर्मवैचारिक तनाव को कम या व्याख्यायित नहीं करना चाहिए।
- issue: सलाह और डाँट की अस्वीकृति
  choice: मानवीय प्रतिक्रिया को सक्रिय अस्वीकार के रूप में व्यक्त किया गया
  alternative: सिर्फ अनजाने में ध्यान न देने के रूप में प्रस्तुत करना
  rationale: ἀκύρους ἐποιεῖτε और ἠπειθήσατε जानबूझकर अमान्य ठहराने और न मानने का भाव रखते हैं।
- issue: ἢ ὅταν का संबंध
  choice: ‘या जब’ द्वारा वैकल्पिक अथवा समानांतर आपदा-वर्णन सुरक्षित रखा गया
  alternative: इसे पिछले कथन का निश्चित क्रम मानकर ‘और तब’ करना
  rationale: स्रोत में ἢ उपस्थित है; वाक्य-संबंध कुछ असहज होने पर भी उसकी वास्तविक वैकल्पिकता को मिटाना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल शैली अपनायी गयी है। छोटे समानांतर उपवाक्यों और अर्धविरामों से यूनानी वचन की संचयी लय रखी गयी है। कोई पादटिप्पणी आवश्यक नहीं समझी गयी, इसलिए मुख्य पाठ में भी कोई पादटिप्पणी-चिह्न नहीं है।
