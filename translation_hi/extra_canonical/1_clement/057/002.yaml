id: 1CLEM.57.2
reference: 1 Clement 57:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: μάθετε ὑποτάσσεσθαι, ἀποθέμενοι τὴν ἀλαζόνα καὶ ὑπερήφανον τῆς γλώσσης ὑμῶν αὐθάδειαν· ἄμεινον γάρ ἐστιν ὑμῖν, ἐν τῷ ποιμνίῳ τοῦ Χριστοῦ μικροὺς καὶ ἐλλογίμους εὑρεθῆναι, ἢ καθ' ὑπεροχὴν δοκοῦντας ἐκβληθῆναι ἐκ τῆς ἐλπίδος αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/002.yaml
  text: Learn to submit[a], putting away the arrogant and proud self-will of your tongue. For it is better for you to be found small and esteemed within the flock of Christ than, while seeming preeminent[b], to be cast out from his hope.
translation:
  language: hi
  text: अधीन होना सीखो और अपनी जीभ की डींगभरी और घमंडी ढिठाई को दूर कर दो। क्योंकि तुम्हारे लिए यह बेहतर है कि तुम मसीह के झुंड में छोटे और गिने हुए पाए जाओ, बजाय इसके कि श्रेष्ठ दिखाई देते हुए उसकी आशा से बाहर निकाल दिए जाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποτάσσεσθαι
  choice: अधीन होना
  rationale: मध्य/कर्मवाच्य infinitive का स्वाभाविक और सीधा अर्थ; संदर्भ में अधिकार या समुदाय की व्यवस्था के प्रति विनम्र समर्पण है।
- source_word: ἀλαζόνα καὶ ὑπερήφανον ... αὐθάδειαν
  choice: डींगभरी और घमंडी ढिठाई
  rationale: ἀλαζών की शेखी/डींग, ὑπερήφανος के घमंड और αὐθάδεια की उद्दंड आत्म-हठधर्मिता—तीनों का संयुक्त बल बनाए रखता है।
- source_word: ἐλλογίμους
  choice: गिने हुए
  rationale: यहाँ ‘हिसाब में लिए गए/सदस्य माने गए’ अर्थ को व्यक्त करता है और झुंड के भीतर होने तथा बाहर निकाले जाने के विरोध को सुरक्षित रखता है; ‘सम्मानित’ भी शब्द का संभव अर्थ है, पर ‘छोटे’ के साथ इस संदर्भ में कम उपयुक्त है।
- source_word: καθ' ὑπεροχὴν δοκοῦντας
  choice: श्रेष्ठ दिखाई देते हुए
  rationale: δοκοῦντας की आभासी प्रतिष्ठा और ὑπεροχή की प्रमुखता/श्रेष्ठता दोनों व्यक्त होते हैं, बिना वास्तविक श्रेष्ठता मान लिए।
- source_word: ἐκ τῆς ἐλπίδος αὐτοῦ
  choice: उसकी आशा से
  rationale: यूनानी संबंध को जानबूझकर यथावत रखा गया है; इसका अर्थ ‘उसमें रखी आशा’ या ‘उसके द्वारा दी गई आशा’ हो सकता है।
theological_decisions:
- issue: Χριστός का रूप
  choice: मसीह
  alternative: अभिषिक्त जन
  rationale: प्रथम क्लेमेंट के कलीसियाई संदर्भ में Χριστός स्थापित उपाधि/नाम की तरह प्रयुक्त है; हिन्दी ईसाई प्रयोग में ‘मसीह’ इसका स्वाभाविक समकक्ष है।
- issue: ‘उसकी आशा’ का संबंध
  choice: अस्पष्टता को मुख्य पाठ में बनाए रखा
  alternative: ‘उसमें रखी आशा’ या ‘उससे मिलने वाली आशा’
  rationale: αὐτοῦ संबंधवाचक है और स्रोत स्पष्ट नहीं करता कि आशा का आश्रय मसीह है या वह आशा मसीह से प्राप्त होती है; किसी एक अर्थ को थोपना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, उपदेशात्मक और सामुदायिक लहजा रखा गया है। वाक्यरचना सहज बनाई गई है, पर ‘उसकी आशा’ जैसी वास्तविक स्रोत-अस्पष्टता को नहीं सुलझाया गया।
