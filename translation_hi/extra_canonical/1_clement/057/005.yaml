- from: क्योंकि ऐसा होगा कि जब तुम मुझे पुकारोगे, तब मैं तुम्हारी नहीं सुनूँगा। बुरे लोग मुझे खोजेंगे, पर मुझे नहीं पाएँगे। क्योंकि उन्होंने बुद्धि से घृणा की और प्रभु का भय मानना नहीं चुना। वे मेरी सम्मतियों पर ध्यान देना भी नहीं चाहते थे, बल्कि मेरी फटकारों का उपहास करते थे।
