id: 1CLEM.57.5
reference: 1 Clement 57:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: ἔσται γάρ, ὅταν ἐπικαλέσησθέ με, ἐγὼ δὲ οὐκ εἰσακούσομαι ὑμῶν· ζητήσουσί με κακοὶ καὶ οὐχ εὑρήσουσιν. ἐμίσησαν γὰρ σοφίαν, τὸν δὲ φόβον τοῦ κυρίου οὐ προείλαντο, οὐδὲ ἤθελον ἐμαῖς προσέχειν βουλαῖς· ἐμυκτήριζον δὲ ἐμοὺς ἐλέγχους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/005.yaml
  text: For it shall be that when you call upon me, I will not listen to you; evil men will seek me and will not find me. For they hated wisdom, and did not choose the fear of the Lord, nor were they willing to attend to my counsels, but they mocked my reproofs.
translation:
  language: hi
  text: क्योंकि ऐसा होगा कि जब तुम मुझे पुकारोगे, तब मैं तुम्हारी पुकार नहीं सुनूँगा। बुरे लोग मुझे खोजेंगे, पर मुझे नहीं पाएँगे। क्योंकि उन्होंने बुद्धि से घृणा की और प्रभु के भय को नहीं चुना। वे मेरी सलाहों पर ध्यान देना भी नहीं चाहते थे, बल्कि मेरी फटकारों का उपहास करते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικαλέσησθέ
  choice: पुकारोगे
  rationale: यह क्रिया सहायता या उत्तर के लिए किसी को पुकारने का भाव रखती है; आधुनिक हिन्दी में ‘पुकारना’ स्वाभाविक और अर्थसंगत है।
- source_word: οὐκ εἰσακούσομαι
  choice: नहीं सुनूँगा
  rationale: यहाँ केवल ध्वनि सुनना नहीं, बल्कि पुकार सुनकर उत्तर देना निहित है; ‘तुम्हारी नहीं सुनूँगा’ हिन्दी में इस संबंधपरक भाव को बनाए रखता है।
- source_word: κακοὶ
  choice: बुरे लोग
  rationale: विशेषण का संज्ञात्मक बहुवचन प्रयोग है; ‘बुरे लोग’ सरल और प्रत्यक्ष अनुवाद है।
- source_word: σοφίαν
  choice: बुद्धि
  rationale: σοφία का प्रचलित और व्यापक हिन्दी समतुल्य ‘बुद्धि’ है, जो इस नीतिवचन-सदृश संदर्भ के अनुकूल है।
- source_word: τὸν φόβον τοῦ κυρίου
  choice: प्रभु का भय मानना
  rationale: संज्ञा-पद को स्वाभाविक हिन्दी क्रियात्मक रूप दिया गया है; इससे श्रद्धामय भय का पारंपरिक धार्मिक भाव खुला रहता है।
- source_word: βουλαῖς
  choice: सम्मतियों
  rationale: βουλή यहाँ परामर्श या सलाह को सूचित करता है; ‘सम्मतियों’ बहुवचन को सुरक्षित रखते हुए dignified हिन्दी देता है।
- source_word: ἐλέγχους
  choice: फटकारों
  rationale: ἔλεγχος में दोष दिखाने और सुधारने वाली डाँट का भाव है; ‘फटकार’ इस संदर्भ में सामान्य पाठक के लिए स्पष्ट है।
- source_word: ἐμυκτήριζον
  choice: उपहास करते थे
  rationale: क्रिया तिरस्कारपूर्वक मज़ाक उड़ाने को दर्शाती है; ‘उपहास करना’ गरिमापूर्ण और सटीक है।
theological_decisions:
- issue: प्रभु के भय का अर्थ
  choice: ‘प्रभु का भय मानना’ को यथावत रखा गया
  alternative: ‘प्रभु का आदर करना’
  rationale: मूल φόβος की धर्मवैचारिक व्यापकता—भय, श्रद्धा और विस्मय—को केवल ‘आदर’ कहकर सीमित नहीं किया गया।
- issue: ईश्वरीय न सुनने का कथन
  choice: ‘मैं तुम्हारी नहीं सुनूँगा’
  alternative: ‘मैं तुम्हारी पुकार का उत्तर नहीं दूँगा’
  rationale: मूल εἰσακούομαι में सुनने और अनुकूल उत्तर देने दोनों का संकेत है; अधिक प्रत्यक्ष रूप मूल की कठोरता और संभावित अर्थ-विस्तार को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गंभीर और नीतिवचनात्मक रखी गई है। यूनानी पाठ के वाक्य-संबंध, बहुवचन संबोधन और चेतावनी की कठोरता सुरक्षित हैं; किसी सांप्रदायिक व्याख्या को नहीं जोड़ा गया।
