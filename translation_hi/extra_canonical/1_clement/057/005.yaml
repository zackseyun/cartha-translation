review_pass:
  verdict: revise
  source_fidelity: 'Draft is substantially faithful to the Greek: it retains the future warning, plural addressees, the refusal to hear, seeking without finding, rejection of wisdom and the fear of the Lord, refusal of counsel, and mockery of reproofs. However, ‘सम्मतियों’ does not mean ‘counsels’ in modern Hindi, and ‘तुम्हारी नहीं सुनूँगा’ can idiomatically suggest ‘I will not obey you’; specifying the previously stated call removes this avoidable ambiguity.'
  naturalness: The register is appropriately serious and proverbial. ‘बुरे लोग’ and ‘फटकारों का उपहास’ are natural. Replacing ‘सम्मतियों’ with ‘सलाहों’ materially improves clarity, and ‘तुम्हारी पुकार नहीं सुनूँगा’ is more idiomatic in this context.
  terminology: ‘बुद्धि’ suitably renders σοφία in this wisdom-saying context. ‘प्रभु के भय’ preserves the theological phrase without reducing it to mere respect. ‘सलाहों’ accurately renders βουλαῖς; ‘सम्मतियों’ instead ordinarily denotes agreements or opinions assented to.
  issues:
  - severity: medium
    issue: ‘सम्मतियों’ for βουλαῖς
    rationale: βούλαι are counsels/plans/advice. In contemporary standard Hindi, ‘सम्मतियाँ’ means agreements, assents, or concurring opinions, not advice given by the speaker.
  - severity: low
    issue: ‘मैं तुम्हारी नहीं सुनूँगा’ is potentially ambiguous
    rationale: Although understandable from context, this Hindi idiom may mean ‘I will not obey/listen to you.’ ‘मैं तुम्हारी पुकार नहीं सुनूँगा’ directly reflects the preceding act of calling and makes the intended sense clear.
  - severity: low
    issue: ‘प्रभु का भय मानना नहीं चुना’ combines two constructions awkwardly
    rationale: The Greek says they did not choose the fear of the Lord. ‘प्रभु के भय को नहीं चुना’ is closer to the object construction and remains natural enough in the elevated register.
  revised_text: क्योंकि ऐसा होगा कि जब तुम मुझे पुकारोगे, तब मैं तुम्हारी पुकार नहीं सुनूँगा। बुरे लोग मुझे खोजेंगे, पर मुझे नहीं पाएँगे। क्योंकि उन्होंने बुद्धि से घृणा की और प्रभु के भय को नहीं चुना। वे मेरी सलाहों पर ध्यान देना भी नहीं चाहते थे, बल्कि मेरी फटकारों का उपहास करते थे।
