  yaml_path: translation/extra_canonical/1_clement/057/006.yaml
  text: Therefore they will eat the fruits of their own way and be filled with their own ungodliness.
translation:
  language: hi
  text: इसलिए वे अपने ही मार्ग के फल खाएँगे और अपनी ही अभक्ति से भर जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοιγαροῦν
  choice: इसलिए
  rationale: यह पूर्व कथन से निकलने वाले परिणाम को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: τῆς ἑαυτῶν ὁδοῦ τοὺς καρποὺς
  choice: अपने ही मार्ग के फल
  rationale: यूनानी रूपक और आत्म-संबंधी बल को बनाए रखता है; ‘मार्ग’ व्यक्ति के आचरण या जीवन-पद्धति को सूचित करता है।
- source_word: ἀσεβείας
  choice: अभक्ति
  rationale: यह परमेश्वर के प्रति श्रद्धा या भक्ति के अभाव को संक्षेप में व्यक्त करता है और ‘दुष्टता’ जैसे अधिक व्यापक अर्थ से बचता है।
- source_word: πλησθήσονται
  choice: भर जाएँगे
  rationale: भविष्यकालीन कर्मवाच्य अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ἀσέβεια का नैतिक-धार्मिक अर्थ
  choice: अभक्ति
  alternative: दुष्टता / अधर्म
  rationale: ‘अभक्ति’ शब्द मूल के ईश्वर-विमुखता वाले धार्मिक आयाम को सुरक्षित रखता है, जबकि विकल्प अर्थ को सामान्य नैतिक बुराई की ओर अधिक झुका सकते हैं।
translation_notes:
