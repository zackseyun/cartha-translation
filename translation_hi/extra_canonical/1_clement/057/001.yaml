source:
  edition: Funk 1901 (normalized OCR)
  text: Ὑμεῖς οὖν οἱ τὴν καταβολὴν τῆς στάσεως ποιήσαντες ὑποτάγητε τοῖς πρεσβυτέροις καὶ παιδεύθητε εἰς μετάνοιαν, κάμψαντες τὰ γόνατα τῆς καρδίας ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/001.yaml
  text: Therefore, you who laid the foundation of the rebellion, submit yourselves to the elders and be disciplined unto repentance, bending the knees of your heart.
translation:
  language: hi
  text: इसलिए तुम, जिन्होंने विद्रोह[a] की नींव डाली है, प्राचीनों के अधीन हो जाओ और पश्चात्ताप के लिए शिक्षा ग्रहण करो, अपने हृदय के घुटने झुकाते हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘फूट’ अथवा ‘कलह’।
    reason: στάσις में विद्रोह के साथ गुटबंदी, फूट और नागरिक कलह के अर्थ भी संभव हैं।
lexical_decisions:
- source_word: στάσις
  choice: विद्रोह
  rationale: इस प्रसंग में यह शब्द स्थापित व्यवस्था के विरुद्ध विघटनकारी गुटबंदी या बगावत को दर्शाता है। ‘विद्रोह’ उसके नकारात्मक और अधिकार-विरोधी भाव को स्पष्ट रखता है; अन्य संभावित अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: πρεσβύτεροι
  choice: प्राचीन
  rationale: यह समुदाय में मान्य वरिष्ठ अगुवों के लिए प्रयुक्त पद है। ‘प्राचीन’ हिन्दी बाइबलीय प्रयोग में परिचित है और केवल आयु नहीं, बल्कि सामुदायिक पद का संकेत भी दे सकता है।
- source_word: παιδεύθητε
  choice: अनुशासन स्वीकार करके
  rationale: निष्क्रिय आज्ञार्थक रूप सुधारात्मक शिक्षा अथवा अनुशासन के अधीन होने का भाव देता है। यह अनुवाद उस स्वैच्छिक अधीनता और सुधार, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μετάνοια
  choice: मन फिराओ
  rationale: यह केवल दुःख अनुभव करने के बजाय सोच और आचरण के परिवर्तन को व्यक्त करता है। क्रियात्मक रूप हिन्दी वाक्य में स्वाभाविक है और εἰς द्वारा सूचित लक्ष्य को स्पष्ट करता है।
- source_word: τὰ γόνατα τῆς καρδίας
  choice: अपने हृदय के घुटने
  rationale: मूल का सजीव रूपक जानबूझकर बनाए रखा गया है; यह भीतरी नम्रता और समर्पण को दर्शाता है।
theological_decisions:
- issue: μετάνοια का अर्थ
  choice: मन फिराओ
  alternative: पश्चात्ताप करो
  rationale: ‘पश्चात्ताप’ कभी-कभी केवल पछतावे तक सीमित समझा जाता है, जबकि ‘मन फिराओ’ भीतरी दिशा और आचरण के परिवर्तन का व्यापक भाव सुरक्षित रखता है।
- issue: हृदय के घुटने टेकने का रूपक
  choice: रूपक को ज्यों का त्यों बनाए रखना
  alternative: मन से दीन बनो
  rationale: व्याख्यात्मक विकल्प अर्थ को स्पष्ट करता, पर मूल की विशिष्ट और प्रभावशाली छवि मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘प्राचीन’ जैसे स्थापित सामुदायिक पद और ‘हृदय के घुटने’ जैसे मूल रूपक को संरक्षित किया गया है।
