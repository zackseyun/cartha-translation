source:
  edition: Funk 1901 (normalized OCR)
  text: Πέτρον, ὃς διὰ ζῆλον ἄδικον οὐχ ἕνα οὐδὲ δύο, ἀλλὰ πλείονας ὑπήνεγκεν πόνους, καὶ οὕτω μαρτυρήσας ἐπορεύθη εἰς τὸν ὀφειλόμενον τόπον τῆς δόξης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/004.yaml
  text: Peter, who because of unrighteous jealousy endured not one or two but many sufferings, and so, having borne witness, went to the glorious place that was due him.
translation:
  language: hi
  text: पतरस ने अन्यायपूर्ण ईर्ष्या के कारण एक या दो नहीं, बल्कि बहुत से कष्ट सहे; और इस प्रकार गवाही देकर वह महिमा के उस स्थान पर चला गया जो उसके लिए नियत था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πέτρον
  choice: पतरस
  rationale: आधुनिक हिन्दी बाइबलीय प्रयोग में इस व्यक्ति के लिए प्रचलित और सहज नाम।
- source_word: διὰ ζῆλον ἄδικον
  choice: अधर्मी ईर्ष्या के कारण
  rationale: ζῆλος यहाँ संदर्भानुसार नकारात्मक ‘ईर्ष्या’ है और ἄδικος उसके अन्यायपूर्ण/अधर्मी स्वरूप को व्यक्त करता है।
- source_word: πλείονας ... πόνους
  choice: बहुत-से कष्ट
  rationale: πόνοι कठिनाइयों, पीड़ाओं और श्रमसाध्य कष्टों को समेटता है; ‘कष्ट’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: μαρτυρήσας
  choice: गवाही देकर
  rationale: शब्द का मूल अर्थ ‘गवाही देना’ सुरक्षित रखा गया है; इसे केवल ‘शहीद होकर’ कहना संभावित शहादत-संकेत को अनावश्यक रूप से निश्चित कर देता।
- source_word: τὸν ὀφειλόμενον τόπον τῆς δόξης
  choice: महिमा के उस स्थान पर ... जो उसके लिए ठहराया गया था
  rationale: ग्रीक संबंधवाचक संरचना ‘महिमा का स्थान’ तथा ὀφειλόμενον के देय/नियत भाव को स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: μαρτυρήσας में शहादत का संभावित संकेत
  choice: गवाही देकर
  alternative: शहीद होकर
  rationale: प्रारम्भिक मसीही संदर्भ में यह क्रिया मृत्यु तक दी गई गवाही का संकेत दे सकती है, पर क्रिया स्वयं स्पष्ट रूप से ‘गवाही देना’ कहती है; अतः अर्थगत तनाव को खुला रखा गया है।
- issue: ὀφειλόμενον का अर्थ
  choice: उसके लिए ठहराया गया था
  alternative: जो उसे मिलना ही था / जिसका वह अधिकारी था
  rationale: ‘ठहराया गया’ नियत या देय स्थान का भाव देता है, पर यह दावा नहीं करता कि पतरस ने कर्मों से महिमा अर्जित की थी।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी वाक्य में ‘पतरस’ कर्मकारक में है और पूर्ववर्ती प्रसंग पर निर्भर है; स्वतंत्र पद के रूप में हिन्दी में स्वाभाविक पूर्ण वाक्य बनाया गया है।
