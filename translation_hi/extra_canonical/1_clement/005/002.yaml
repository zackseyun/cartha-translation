  text: Because of jealousy and envy, the greatest and most righteous pillars were persecuted and struggled even unto death.
translation:
  language: hi
  text: ईर्ष्या और डाह के कारण सबसे महान और सबसे धर्मी स्तंभ सताए गए और मृत्यु तक संघर्ष किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλον καὶ φθόνον
  choice: ईर्ष्या और डाह
  rationale: दोनों निकटार्थक यूनानी शब्दों का अलग-अलग पदों से अनुवाद किया गया है, ताकि मूल की पुनरुक्ति और भावात्मक तीव्रता बनी रहे।
- source_word: οἱ μέγιστοι καὶ δικαιότατοι στῦλοι
  choice: सबसे महान और सबसे धर्मी स्तंभ
  rationale: अतिशयोक्तिपरक विशेषणों और समुदाय के प्रमुख सहारों के लिए प्रयुक्त ‘स्तंभ’ रूपक को सीधे बनाए रखा गया है।
- source_word: ἐδιώχθησαν
  choice: सताए गए
  rationale: यह क्रिया शत्रुतापूर्ण उत्पीड़न का बोध कराती है; ‘सताए गए’ आधुनिक धार्मिक-ऐतिहासिक संदर्भ में स्वाभाविक और सटीक है।
- source_word: ἤθλησαν
  choice: संघर्ष करते रहे
  rationale: ἀθλέω के प्रतियोगितात्मक अथवा कठिन संघर्ष के रूपक को सहज हिन्दी में व्यक्त करता है; ‘करते रहे’ संघर्ष की जारी प्रकृति को उभारता है।
- source_word: ἕως θανάτου
  choice: मृत्यु तक
  rationale: मूल की सीमा-सूचक अभिव्यक्ति को संक्षिप्त और स्वाभाविक रूप से सुरक्षित रखता है, बिना यह अनावश्यक रूप से तय किए कि मृत्यु संघर्ष का परिणाम थी या उसकी चरम सीमा।
theological_decisions:
- issue: ‘स्तंभों’ की पहचान
  choice: रूपक को बिना पहचान स्पष्ट किए रखा गया
  alternative: ‘कलीसिया के प्रमुख अगुए’
  rationale: इस पद में व्यक्तियों या संस्था का स्पष्ट उल्लेख नहीं है; व्याख्यात्मक पूर्ति मूल की अस्पष्टता को अनावश्यक रूप से समाप्त कर देती।
- issue: ἕως θανάτου का आशय
  choice: ‘मृत्यु तक’
  alternative: ‘मरते दम तक’ या ‘जिससे उनकी मृत्यु हुई’
  rationale: चुना हुआ रूप संघर्ष की अंतिम सीमा व्यक्त करता है, पर कारणात्मक संबंध या मृत्यु की सटीक परिस्थिति नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य में मूल यूनानी की समानांतर संरचना तथा ‘स्तंभ’ का रूपक सुरक्षित है।
