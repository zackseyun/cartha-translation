  yaml_path: translation/extra_canonical/1_clement/005/001.yaml
  text: But to cease from the ancient examples, let us come to the athletes who lived nearest to our own time. Let us take the noble examples from our own generation.
translation:
  language: hi
  text: पर अब प्राचीन उदाहरणों को छोड़कर, आइए उन वीरों की ओर आएँ जो हमारे अपने समय के सबसे निकट रहे हैं। आइए अपनी ही पीढ़ी के श्रेष्ठ उदाहरणों को लें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν ἀρχαίων ὑποδειγμάτων παυσώμεθα
  choice: प्राचीन उदाहरणों की चर्चा छोड़कर
  rationale: यह पदबंध प्राचीन उदाहरणों से आगे बढ़ने का संकेत देता है। हिंदी में ‘चर्चा छोड़कर’ स्रोत के आशय को स्वाभाविक रूप से स्पष्ट करता है, बिना यह अर्थ दिए कि सूची उन्हीं पर समाप्त हो रही है।
- source_word: τοὺς ἔγγιστα γενομένους ἀθλητάς
  choice: उन योद्धाओं ... जो हमारे समय के सबसे निकट हुए हैं
  rationale: ἀθλητάς का मूल अर्थ प्रतियोगिता में संघर्ष करने वाले खिलाड़ी है, पर आरंभिक मसीही नैतिक भाषा में यह संघर्षशील वीरों के लिए रूपक है। ‘योद्धाओं’ से रूपक की गरिमा और संघर्ष का भाव सहज हिंदी में बना रहता है; ἔγγιστα का कालगत संबंध संदर्भानुसार स्पष्ट किया गया है।
- source_word: τῆς γενεᾶς ἡμῶν
  choice: अपनी ही पीढ़ी के
  rationale: γενεά यहाँ लेखक और पाठकों के समकालीन युग अथवा पीढ़ी को सूचित करता है। ‘अपनी ही पीढ़ी’ इसका सीधा और स्वाभाविक हिंदी रूप है।
- source_word: τὰ γενναῖα ὑποδείγματα
  choice: श्रेष्ठ उदाहरणों
  rationale: γενναῖα में कुलीन, साहसी और उत्कृष्ट होने का भाव है। व्यक्तियों को अनुकरणीय नमूनों के रूप में प्रस्तुत करने वाले संदर्भ में ‘श्रेष्ठ उदाहरण’ व्यापक अर्थ को स्वाभाविक ढंग से संप्रेषित करता है।
- source_word: λάβωμεν
  choice: सामने रखें
  rationale: शाब्दिक ‘ग्रहण करें’ हिंदी में कृत्रिम होता। संदर्भ में लेखक विचार और अनुकरण के लिए उदाहरण प्रस्तुत कर रहा है, इसलिए ‘सामने रखें’ उपयुक्त है।
