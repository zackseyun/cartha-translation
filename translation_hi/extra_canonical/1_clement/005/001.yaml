translation_notes:
  register: आधुनिक मानक हिंदी में सामूहिक आग्रह (‘आइए’) रखा गया है। शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। यूनानी ἀθλητάς के रूपक को ‘योद्धाओं’ से व्यक्त किया गया है; इससे शारीरिक खेल तक अर्थ सीमित नहीं होता और आगे आने वाले उत्पीड़न-सहन के संदर्भ का संघर्ष-भाव सुरक्षित रहता है।
