revisions:
- from: पर प्राचीन उदाहरणों की चर्चा छोड़कर, आइए उन योद्धाओं की ओर ध्यान दें जो हमारे समय के सबसे निकट हुए हैं। आइए अपनी ही पीढ़ी के श्रेष्ठ उदाहरणों को सामने रखें।
  to: पर अब प्राचीन उदाहरणों को छोड़कर, आइए उन वीरों की ओर आएँ जो हमारे अपने समय के सबसे निकट रहे हैं। आइए अपनी ही पीढ़ी के श्रेष्ठ उदाहरणों को लें।
  rationale: The revision retains the collective exhortation and the transition from ancient to recent exemplars. It replaces the overly military ‘योद्धाओं’ with ‘वीरों,’ improves the temporal idiom, and renders λάβωμεν more directly as ‘लें.’ No footnote is needed, since the Hindi wording does not reproduce the English alternative’s ambiguity.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T16:32:09Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the transition away from ancient examples and the appeal to examples from the writer's own generation. However, ‘योद्धाओं’ narrows the metaphorical Greek ἀθλητάς to military combatants, and ‘सामने रखें’ is less direct than λάβωμεν (‘let us take’).
  naturalness: ‘जो हमारे समय के सबसे निकट हुए हैं’ is understandable but unidiomatic in modern Hindi. ‘जो हमारे अपने समय के सबसे निकट रहे हैं’ is more natural while preserving the temporal comparison.
  terminology: ‘वीरों’ appropriately renders the honorific, metaphorical sense of ἀθλητάς without importing a specifically military meaning. ‘श्रेष्ठ उदाहरण’ suitably conveys γενναῖα ὑποδείγματα in modern standard Hindi.
  issues:
  - severity: medium
    issue: ‘योद्धाओं’ for ἀθλητάς
    rationale: Although ἀθλητάς can function metaphorically for those who struggle nobly, ‘योद्धा’ specifically evokes soldiers or warfare. The Greek athletic/contest metaphor should not be restricted to military imagery.
  - severity: low
    issue: Awkward temporal wording
    rationale: ‘हमारे समय के सबसे निकट हुए हैं’ is not idiomatic Hindi. A formulation using ‘रहे हैं’ naturally expresses people who lived nearest to the author's time.
  - severity: low
    issue: ‘सामने रखें’ for λάβωμεν
    rationale: The Greek calls readers to take up or draw examples from their own generation; ‘सामने रखें’ shifts toward presenting examples to others. ‘लें’ is direct and natural here.
  revised_text: पर अब प्राचीन उदाहरणों को छोड़कर, आइए उन वीरों की ओर आएँ जो हमारे अपने समय के सबसे निकट रहे हैं। आइए अपनी ही पीढ़ी के श्रेष्ठ उदाहरणों को लें।
  revised_footnotes: []
