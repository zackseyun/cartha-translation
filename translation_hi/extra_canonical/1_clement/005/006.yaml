review_pass:
  verdict: revise
  source_fidelity: Draft retains the sevenfold imprisonment, exile, stoning, eastern and western heralding, and receiving renown. However, ‘के बाद’ makes the preceding participial actions a completed temporal sequence before the heralding, whereas the Greek strings these as coordinated descriptions without explicitly marking such sequence. ‘उत्तम यश’ weakens γενναῖον (‘noble, valiant, distinguished’), and ‘विश्वास के कारण’ resolves the genitive more narrowly as causation than necessary.
  naturalness: The sentence is generally understandable, but ‘पत्थरवाह किए जाने’ is not idiomatic modern standard Hindi. ‘पत्थरों से मारे जाने’ is clear and standard in this historical context. A coordinated participial construction is also more natural here than the temporal ‘के बाद’ frame.
  terminology: ‘बेड़ियाँ,’ ‘निर्वासित,’ and ‘प्रचारक’ suitably convey the principal terms. ‘उद्घोषक’ is a closer and still natural rendering for κῆρυξ, preserving its public-proclamation sense without importing a particular modern religious office. ‘प्रतिष्ठित यश’ better represents κλέος modified by γενναῖον.
  issues:
  - severity: medium
    issue: ‘के बाद’ adds an explicit temporal sequencing.
    rationale: The Greek aorist participles are coordinated with κῆρυξ γενόμενος and do not state that imprisonment, exile, and stoning occurred before his activity as herald.
  - severity: medium
    issue: ‘पत्थरवाह किए जाने’ is nonstandard/awkward Hindi.
    rationale: ‘पत्थरों से मारे जाने’ clearly and naturally conveys λιθασθείς.
  - severity: low
    issue: ‘उत्तम यश’ and ‘विश्वास के कारण’ respectively undertranslate and narrow the final phrase.
    rationale: γενναῖον denotes noble/distinguished renown, while τῆς πίστεως αὐτοῦ is best left as closely associated with his faith rather than made solely causal.
  revised_text: सात बार बेड़ियाँ पहनकर, निर्वासित किए जाकर, पत्थरों से मारे जाकर, और पूर्व तथा पश्चिम दोनों में उद्घोषक बनकर, उसने अपने विश्वास का प्रतिष्ठित यश प्राप्त किया।
  revised_footnotes: []
  revision_rationale: The revision preserves the Greek’s coordinated participial list without adding temporal order, uses idiomatic Hindi for stoning, renders κῆρυξ as ‘उद्घोषक,’ and more closely retains the association between faith and noble renown in the final genitive phrase.
