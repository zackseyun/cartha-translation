- from: सात बार बेड़ियाँ पहनने, निर्वासित किए जाने और पत्थरवाह किए जाने के बाद, और पूर्व तथा पश्चिम दोनों में प्रचारक बनकर, उसने अपने विश्वास के कारण उत्तम यश प्राप्त किया।
  to: सात बार बेड़ियाँ पहनकर, निर्वासित किए जाकर, पत्थरों से मारे जाकर, और पूर्व तथा पश्चिम दोनों में उद्घोषक बनकर, उसने अपने विश्वास का प्रतिष्ठित यश प्राप्त किया।
