  text: ἑπτάκις δεσμὰ φορέσας, φυγαδευθείς, λιθασθείς, κῆρυξ γενόμενος ἔν τε τῇ ἀνατολῇ καὶ ἐν τῇ δύσει, τὸ γενναῖον τῆς πίστεως αὐτοῦ κλέος ἔλαβεν,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/006.yaml
  text: having worn chains seven times, having been driven into exile, having been stoned, having become a herald both in the east and in the west, he received the noble renown of his faith,
translation:
  language: hi
  text: सात बार बेड़ियाँ पहनकर, निर्वासित किए जाकर, पत्थरों से मारे जाकर, और पूर्व तथा पश्चिम दोनों में उद्घोषक बनकर, उसने अपने विश्वास का प्रतिष्ठित यश प्राप्त किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑπτάκις δεσμὰ φορέσας
  choice: सात बार बेड़ियाँ पहनने
  rationale: संख्या और δεσμά के बंधन/बेड़ियों वाले ठोस अर्थ को बनाए रखते हुए हिन्दी में स्वाभाविक अभिव्यक्ति।
- source_word: φυγαδευθείς
  choice: निर्वासित किए जाने
  rationale: यह कर्मवाच्य कृदन्त जबरन देश-निकाला या निर्वासन दिए जाने को व्यक्त करता है।
- source_word: λιθασθείς
  choice: पत्थरवाह किए जाने
  rationale: λιθάζω के तकनीकी और हिंसात्मक अर्थ—पत्थरों से मारना—को संक्षेप में व्यक्त करता है।
- source_word: κῆρυξ γενόμενος
  choice: प्रचारक बनकर
  rationale: κῆρυξ सार्वजनिक उद्घोषक या संदेश सुनाने वाले को दर्शाता है; संदर्भ में ‘प्रचारक’ सहज और उपयुक्त है।
- source_word: ἔν τε τῇ ἀνατολῇ καὶ ἐν τῇ δύσει
  choice: पूर्व तथा पश्चिम दोनों में
  rationale: भौगोलिक व्यापकता और τε…καί की ‘दोनों’ संरचना सुरक्षित रखी गई है।
- source_word: τὸ γενναῖον τῆς πίστεως αὐτοῦ κλέος ἔλαβεν
  choice: उसने अपने विश्वास के कारण उत्तम यश प्राप्त किया
  rationale: κλέος को ‘यश’ और γενναῖον को ‘उत्तम’ से व्यक्त किया गया है। संबंधवाचक षष्ठी τῆς πίστεως को स्वाभाविक हिन्दी में कारण/आधार के रूप में रखा गया है, यद्यपि उसमें संबद्धता की कुछ गुंजाइश है।
theological_decisions:
- issue: τῆς πίστεως αὐτοῦ में षष्ठी का संबंध
  choice: अपने विश्वास के कारण
  alternative: अपने विश्वास का उत्तम यश
  rationale: शाब्दिक विकल्प हिन्दी में ऐसा आभास दे सकता है मानो विश्वास स्वयं प्रसिद्ध हुआ। चुना हुआ रूप व्यक्ति को उसके विश्वास के आधार पर मिले यश का अर्थ देता है, साथ ही किसी विशिष्ट सांप्रदायिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। यूनानी वाक्य की क्रमिक कृदन्त संरचना को हिन्दी में ‘के बाद’ और ‘बनकर’ से स्वाभाविक बनाया गया है।
