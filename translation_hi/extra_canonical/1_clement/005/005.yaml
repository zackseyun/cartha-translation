lexical_decisions:
- source_word: ζῆλον
  choice: ईर्ष्या
  rationale: संदर्भ में यह शब्द नकारात्मक ‘जलन/ईर्ष्या’ का भाव रखता है; ‘ईर्ष्या’ आधुनिक मानक हिन्दी में स्वाभाविक और सटीक है।
- source_word: ἔριν
  choice: कलह
  rationale: यह विवाद, झगड़े या वैमनस्य को व्यक्त करता है; ‘कलह’ संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: ὑπομονῆς
  choice: धीरज
  rationale: यह कठिनाई में डटे रहने और सहनशीलता का भाव व्यक्त करता है; ‘धीरज’ साधारण पाठकों के लिए सहज है और केवल निष्क्रिय सहन करने तक अर्थ को सीमित नहीं करता।
- source_word: βραβεῖον
  choice: पुरस्कार
  rationale: प्रतियोगिता में मिलने वाले इनाम के रूपक को सीधे बनाए रखता है।
- source_word: ἔδειξεν
  choice: दिखाया
  rationale: यूनानी क्रिया का सीधा अर्थ ‘दिखाया/प्रदर्शित किया’ है; यह पौलुस के उदाहरण द्वारा पुरस्कार को प्रत्यक्ष करने की भावछाया को बिना अनावश्यक विस्तार के सुरक्षित रखता है।
