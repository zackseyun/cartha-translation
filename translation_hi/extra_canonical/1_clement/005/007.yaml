  text: δικαιοσύνην διδάξας ὅλον τὸν κόσμον, καὶ ἐπὶ τὸ τέρμα τῆς δύσεως ἐλθὼν καὶ μαρτυρήσας ἐπὶ τῶν ἡγουμένων, οὕτως ἀπηλλάγη τοῦ κόσμου καὶ εἰς τὸν ἅγιον τόπον ἐπορεύθη, ὑπομονῆς γενόμενος μέγιστος ὑπογραμμός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/007.yaml
  text: having taught righteousness to the whole world[a], and having come to the farthest limit of the west, and having borne witness before the rulers, thus he departed from the world and went to the holy place, having become the greatest example of endurance.
translation:
  language: hi
  text: सारे संसार को धार्मिकता की शिक्षा देकर, पश्चिम की अंतिम सीमा तक पहुँचकर और शासकों के सामने गवाही देकर, वे इस प्रकार संसार से विदा हुए और पवित्र स्थान गए, धैर्य का सबसे महान उदाहरण बनकर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: यहाँ नैतिक और ईश्वर-सम्मत सही आचरण की शिक्षा का भाव है; ‘धार्मिकता’ सामान्य हिन्दी बाइबलीय प्रयोग में इसे संक्षेप और गरिमा से व्यक्त करता है।
- source_word: ὅλον τὸν κόσμον
  choice: सारे संसार
  rationale: मूल के व्यापक दावे को बिना घटाए स्वाभाविक हिन्दी में रखा गया है।
- source_word: τὸ τέρμα τῆς δύσεως
  choice: पश्चिम की अंतिम सीमा
  rationale: τέρμα के सीमा/छोर और δύσις के पश्चिम अर्थ को औपचारिक किंतु बोधगम्य रूप में सुरक्षित रखता है; किसी विशेष भौगोलिक स्थान की पहचान नहीं थोपी गई।
- source_word: μαρτυρήσας
  choice: गवाही देकर
  rationale: शासकों के सामने साक्ष्य देने के मूल अर्थ को रखता है और शब्द में निहित संभावित शहादत-संबंधी प्रतिध्वनि को किसी एक अर्थ तक सीमित नहीं करता।
- source_word: ἀπηλλάγη τοῦ κόσμου
  choice: संसार से विदा ली
  rationale: यह यूनानी मुहावरा मृत्यु अथवा संसार छोड़ने को सूचित करता है; ‘विदा ली’ स्वाभाविक हिन्दी है और अनपेक्षित ‘छुड़ाया गया’ अर्थ से बचाता है।
- source_word: ὑπομονῆς
  choice: धीरज
  rationale: कठिनाई में स्थिर बने रहने के भाव को साधारण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: μέγιστος ὑπογραμμός
  choice: सर्वोत्तम उदाहरण
  rationale: ὑπογραμμός का अनुकरणीय नमूने का भाव और μέγιστος की उत्कृष्टता स्वाभाविक हिन्दी में व्यक्त होते हैं।
theological_decisions:
- issue: μαρτυρέω में गवाही और शहादत की संभावित प्रतिध्वनि
  choice: गवाही देकर
  alternative: शहीद होकर
  rationale: संदर्भ मृत्यु की ओर संकेत करता है, पर क्रिया का प्रत्यक्ष अर्थ शासकों के सामने गवाही देना है। ‘शहीद होकर’ संभावित आशय को निश्चित बनाकर मूल की अर्थ-व्याप्ति घटा देगा।
- issue: ‘पश्चिम की अंतिम सीमा’ की भौगोलिक पहचान
  choice: मूल का सामान्य भौगोलिक वाक्यांश बनाए रखा
  alternative: स्पेन अथवा रोम जैसे किसी विशिष्ट स्थान का नाम
  rationale: मूल पाठ किसी स्थान का नाम नहीं देता; ऐतिहासिक व्याख्या को अनुवाद में शामिल करना उचित नहीं।
- issue: ‘पवित्र स्थान’ का स्वरूप
  choice: पवित्र स्थान
  alternative: स्वर्ग
  rationale: मूल ἅγιος τόπος कहता है; ‘स्वर्ग’ संभव व्याख्या है, किंतु उससे मूल की अभिव्यक्ति अधिक निश्चित हो जाएगी।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। यूनानी वाक्य के क्रमिक कृदंतों को ‘और... और...’ से कुछ हद तक सुरक्षित रखा गया, पर अंतिम परिणाम-वाक्य को स्पष्टता के लिए अलग वाक्य बनाया गया है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई।
