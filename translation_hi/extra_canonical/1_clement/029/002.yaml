base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/029/002.yaml
  text: 'For thus it is written:

    “When the Most High divided the nations,

    when he scattered the sons of Adam,

    he fixed the boundaries of the nations

    according to the number of the angels of God.

    And his people Jacob became the Lord’s portion,

    Israel the measuring-line of his inheritance.”'
translation:
  language: hi
  text: 'क्योंकि ऐसा लिखा है:


    “जब परमप्रधान ने जातियों को बाँटा,


    जब उसने आदम की संतानों को तितर-बितर किया,


    तब उसने परमेश्वर के स्वर्गदूतों की संख्या के अनुसार


    जातियों की सीमाएँ ठहराईं।[a]


    और याकूब, उसकी प्रजा, प्रभु का भाग बना,


    इस्राएल उसकी विरासत का माप कर ठहराया हुआ भाग।”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी पाठ में “परमेश्वर के स्वर्गदूतों” है; कुछ पाठ-परंपराओं में “इस्राएल की संतानों” मिलता है।
    reason: व्यवस्थाविवरण 32:8 के प्रसिद्ध पाठांतर को बताए बिना मुख्य पाठ की साक्ष्य-निष्ठा बनाए रखना।
  - marker: b
    text: 'शाब्दिक रूप से: “उसकी विरासत की नापने की रस्सी”; आशय रस्सी से नापा और निर्धारित किया हुआ हिस्सा है।'
    reason: σχοίνισμα के ठोस रूपक और उसके प्रसंगगत अर्थ दोनों को उपलब्ध कराना।
lexical_decisions:
- source_word: ἔθνη
  choice: जाति-जाति के लोग / जातियाँ
  rationale: संदर्भ में विभिन्न जनसमूहों अथवा राष्ट्रों का बोध है। पहली पंक्ति में स्वाभाविक हिन्दी के लिए ‘जाति-जाति के लोगों’ और सीमा-विभाजन के प्रसंग में ‘जातियों’ का प्रयोग किया गया है।
- source_word: υἱοὺς Ἀδάμ
  choice: आदम की संतानों
  rationale: शाब्दिक अर्थ ‘आदम के पुत्र’ है, पर यहाँ समस्त मानव समुदाय अभिप्रेत है; ‘संतानों’ से समावेशी सामूहिक अर्थ स्वाभाविक रूप में आता है।
- source_word: ἀγγέλων θεοῦ
  choice: परमेश्वर के स्वर्गदूतों
  rationale: क्लेमेंट के यूनानी पाठ के विशिष्ट पाठांतर को सीधे सुरक्षित रखा गया है; इसे किसी दूसरे पाठ-रूप से नहीं बदला गया।
- source_word: μερὶς κυρίου
  choice: प्रभु का भाग
  rationale: κληρονομία से जुड़े आवंटित हिस्से के भाव को संक्षेप और औपचारिक रूप में व्यक्त करता है।
- source_word: σχοίνισμα κληρονομίας
  choice: विरासत का नापा हुआ हिस्सा
  rationale: σχοίνισμα मूलतः नापने की रस्सी से निर्धारित भूभाग या हिस्सा दर्शाता है। केवल ‘नापने की डोरी’ कहने पर हिन्दी में याकूब/इस्राएल स्वयं डोरी प्रतीत हो सकता है, इसलिए नापकर निर्धारित हिस्से का आशय स्पष्ट किया गया है।
theological_decisions:
- issue: व्यवस्थाविवरण 32:8 के उद्धरण में ἀγγέλων θεοῦ का पाठ
  choice: परमेश्वर के स्वर्गदूतों की संख्या के अनुसार
  alternative: इस्राएल की संतानों की संख्या के अनुसार
  rationale: प्रस्तुत यूनानी स्रोत स्पष्ट रूप से ἀγγέλων θεοῦ पढ़ता है। पाठगत और धर्मवैचारिक तनाव को बनाए रखते हुए अनुवाद उसी साक्ष्य का अनुसरण करता है।
- issue: याकूब और इस्राएल का संबंध
  choice: समानांतर काव्य-पंक्तियों में दोनों नाम यथावत
  alternative: दोनों को व्याख्यात्मक रूप से एक ही पद में मिला देना
  rationale: स्रोत की समानांतर काव्य-संरचना और प्रभु की प्रजा/विरासत की दोहरी अभिव्यक्ति सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य काव्यात्मक विन्यास रखा गया है। ‘परमप्रधान’, ‘प्रभु’, ‘विरासत’ और ‘इस्राएल’ जैसे परिचित धार्मिक पद प्रयुक्त हैं, पर वाक्य-विन्यास को अनावश्यक रूप से पुरातन नहीं बनाया गया।
