base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/029/003.yaml
  text: 'And in another place he says:

    “Behold, the Lord takes for himself a nation from the midst of nations,

    as a man takes the firstfruits of his threshing floor;

    and from that nation the Holy of Holies shall come forth.”'
translation:
  language: hi
  text: 'और एक दूसरे स्थान पर वह कहता है:


    “देखो, प्रभु जातियों के बीच से अपने लिए एक जाति लेता है,


    जैसे कोई मनुष्य अपने खलिहान की पहली उपज लेता है;


    और उस जाति में से परमपवित्र प्रकट होगा।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “परमपवित्र” का यूनानी पद शाब्दिक रूप से “पवित्रों का पवित्र” है और इसका अर्थ “परमपवित्र स्थान” भी हो सकता है। “प्रकट होगा” का शाब्दिक अर्थ “बाहर निकलेगा” है।
    reason: ἅγια ἁγίων के निश्चित धार्मिक पद के रूप में संभावित अर्थ और उसके संदर्भगत आशय की वास्तविक अस्पष्टता, तथा ἐξελεύσεται की अधिक शाब्दिक गति-सूचना, दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: λαμβάνει ἑαυτῷ
  choice: अपने लिए ... चुन लेता है
  rationale: शाब्दिक अर्थ ‘अपने लिए लेता है’ है; जातियों में से एक जाति को अपने लिए ग्रहण करने के प्रसंग में ‘चुन लेता है’ स्वाभाविक हिन्दी है और चयन का भाव व्यक्त करता है।
- source_word: ἔθνος ἐκ μέσου ἐθνῶν
  choice: जातियों के बीच से ... एक जाति
  rationale: एकवचन और बहुवचन का विरोध बनाए रखता है तथा यूनानी संरचना को स्पष्ट हिन्दी में प्रस्तुत करता है।
- source_word: ἀπαρχὴν ... τῆς ἅλω
  choice: अपने खलिहान की पहली उपज
  rationale: ἀπαρχή पहली उपज अथवा प्रथम अंश है; ἅλως यहाँ खलिहान को सूचित करता है। यह कृषि-रूपक आधुनिक पाठक के लिए सहज रखता है।
- source_word: ἅγια ἁγίων
  choice: परमपवित्र
  rationale: यह शाब्दिक रूप से ‘पवित्रों का पवित्र’ है और यूनानी बाइबिल में परमपवित्र स्थान के लिए रूढ़ पद भी है। हिन्दी का ‘परमपवित्र’ उस निश्चित धार्मिक पद को संक्षेप और गरिमा से व्यक्त करता है, जबकि संदर्भगत अस्पष्टता फुटनोट में सुरक्षित है।
- source_word: ἐξελεύσεται
  choice: प्रकट होगा
  rationale: मूल अर्थ ‘बाहर निकलेगा/आगे आएगा’ है। किसी जाति में से व्यक्ति या पवित्र सत्ता के उद्भव के लिए ‘प्रकट होगा’ स्वाभाविक है, पर वैकल्पिक शाब्दिक अर्थ फुटनोट में दिया गया है।
theological_decisions:
- issue: ἅγια ἁγίων का आशय
  choice: मुख्य पाठ में ‘परमपवित्र’ रखा गया और इसे पुल्लिंग एकवचन क्रिया ‘होगा’ के साथ प्रस्तुत किया गया।
  alternative: ‘परमपवित्र स्थान’ या ‘पवित्रतम वस्तुएँ’
  rationale: यूनानी पद नपुंसकलिंग बहुवचन रूप में होते हुए भी एक निश्चित उपाधि/पद की तरह प्रयुक्त हो सकता है। उद्धरण का सटीक स्रोत और आशय अनिश्चित है; इसलिए ‘स्थान’ जोड़कर अर्थ सीमित नहीं किया गया, न ही इसे स्पष्ट रूप से किसी विशेष मसीही पहचान से जोड़ा गया।
- issue: λαμβάνει को चुनाव की भाषा में व्यक्त करना
  choice: ‘चुन लेता है’
  alternative: ‘लेता है’ या ‘ग्रहण करता है’
  rationale: अध्याय के चुनाव-संबंधी संदर्भ में यह अर्थ स्वाभाविक है, फिर भी इसमें किसी विशिष्ट पूर्वनियति-सिद्धांत को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सरल शैली। काव्यात्मक उद्धरण को पंक्तियों में रखा गया है। ‘देखो’ बाइबिलीय उद्घोष का सीधा और परिचित रूप है; अनावश्यक संस्कृतनिष्ठ शब्दावली से बचा गया है।
