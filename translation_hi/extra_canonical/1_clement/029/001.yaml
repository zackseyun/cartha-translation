source:
  edition: Funk 1901 (normalized OCR)
  text: Προσέλθωμεν οὖν αὐτῷ ἐν ὁσιότητι ψυχῆς, ἁγνὰς καὶ ἀμιάντους χεῖρας αἴροντες πρὸς αὐτόν, ἀγαπῶντες τὸν ἐπιεικῆ καὶ εὔσπλαγχνον πατέρα ἡμῶν, ὃς ἐκλογῆς μέρος ἡμᾶς ἐποίησεν ἑαυτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/029/001.yaml
  text: Therefore let us come near to him in holiness of soul, lifting pure and undefiled hands to him, loving our gentle and compassionate Father, who has made us a chosen portion for himself.
translation:
  language: hi
  text: इसलिए हम आत्मा की पवित्रता में उसके निकट आएँ और उसकी ओर शुद्ध और निष्कलंक हाथ उठाएँ। हम अपने कोमल और करुणामय पिता से प्रेम करें, जिसने हमें अपने लिए चुना हुआ भाग बनाया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσέλθωμεν
  choice: हम ... उसके निकट आएँ
  rationale: क्रिया का आह्वानात्मक भाव और परमेश्वर की ओर बढ़ने का अर्थ स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: ἐν ὁσιότητι ψυχῆς
  choice: आत्मा की पवित्रता में
  rationale: ὁσιότης की धार्मिक-नैतिक पवित्रता और ψυχή के भीतरी व्यक्ति/आत्मा संबंधी अर्थ को निकटता से व्यक्त करता है।
- source_word: ἁγνὰς καὶ ἀμιάντους χεῖρας
  choice: शुद्ध और निष्कलंक हाथ
  rationale: दोनों प्रत्यक्ष विशेषणों को बनाए रखता है; ἁγνός शुद्धता और ἀμίαντος कलंक से रहित होने पर बल देता है।
- source_word: ἐπιεικῆ καὶ εὔσπλαγχνον
  choice: कोमल और करुणामय
  rationale: ἐπιεικής की नम्र, सौम्य उदारता और εὔσπλαγχνος की गहरी करुणा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐκλογῆς μέρος
  choice: चुना हुआ भाग
  rationale: शाब्दिक संरचना और परमेश्वर द्वारा अपने लिए अलग किए गए समुदाय का भाव बनाए रखता है।
theological_decisions:
- issue: ἐκλογῆς μέρος का संबंध चुनाव से है या चुने हुए समुदाय में हिस्सेदारी से
  choice: चुना हुआ भाग
  alternative: चुनाव में सहभागी
  rationale: यूनानी वाक्यांश का स्वाभाविक अर्थ ‘chosen portion’ के निकट है; यह चुनाव की किसी विशिष्ट सिद्धान्तगत व्याख्या को आरोपित किए बिना मूल की संक्षिप्तता और संभावित तनाव बनाए रखता है।
- issue: हाथ उठाने की क्रिया का धार्मिक अर्थ
  choice: उसकी ओर ... हाथ उठाएँ
  alternative: उससे प्रार्थना करते हुए ... हाथ उठाएँ
  rationale: मूल में प्रार्थना का संकेत संभव है, पर ‘प्रार्थना’ शब्द स्पष्ट रूप से नहीं है; इसलिए शारीरिक बिंब को बिना व्याख्यात्मक विस्तार के रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामुदायिक उपदेशात्मक शैली। ‘आएँ’, ‘उठाएँ’ और ‘प्रेम करें’ से यूनानी hortatory subjunctive का आग्रहपूर्ण समावेशी स्वर सुरक्षित है।
