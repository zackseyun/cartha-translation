source:
  edition: Funk 1901 (normalized OCR)
  text: δέξασθε τὴν συμβουλὴν ἡμῶν, καὶ ἔσται ἀμεταμέλητα ὑμῖν. ζῇ γὰρ ὁ θεὸς καὶ ζῇ ὁ κύριος Ἰησοῦς Χριστὸς καὶ τὸ πνεῦμα τὸ ἅγιον, ἥ τε πίστις καὶ ἡ ἐλπὶς τῶν ἐκλεκτῶν, ὅτι ὁ ποιήσας ἐν ταπεινοφροσύνῃ μετ᾽ ἐκτενοῦς ἐπιεικείας ἀμεταμελήτως τὰ ὑπὸ τοῦ θεοῦ δεδομένα δικαιώματα καὶ προστάγματα· οὕτως ἐντεταγμένος καὶ ἐλλόγιμος ἔσται εἰς τὸν ἀριθμὸν τῶν σῳζομένων διὰ Ἰησοῦ Χριστοῦ, δι᾽ οὗ ἐστὶν αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/058/002.yaml
  text: Accept our counsel[a], and you will have no cause for regret. For as God lives, and the Lord Jesus Messiah lives, and the Holy Spirit, and the faith and hope of the elect, so surely the one who in humility, with earnest gentleness, without regret carries out the righteous requirements and commandments given by God, this one will be enrolled and counted among the number of those being saved through Jesus Messiah, through whom be the glory to him forever and ever. Amen.
translation:
  language: hi
  text: हमारी सलाह स्वीकार करो, और तुम्हें इसका पछतावा नहीं होगा। क्योंकि परमेश्वर जीवित हैं, प्रभु यीशु मसीह जीवित हैं, और पवित्र आत्मा तथा चुने हुओं का विश्वास और आशा भी जीवित हैं[a]—इसलिए यह निश्चित है कि जो कोई दीनता और गहन सौम्यता के साथ, बिना पछताए, परमेश्वर की दी हुई धार्मिक विधियों और आज्ञाओं का पालन करता है, वह यीशु मसीह के द्वारा उद्धार पाने वालों की संख्या में सम्मिलित और गिना जाएगा। जिसके द्वारा उसकी महिमा युगानुयुग हो। आमीन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में “जीवित हैं” केवल परमेश्वर और प्रभु यीशु मसीह के साथ स्पष्ट रूप से लिखा है; पवित्र आत्मा और चुने हुओं के विश्वास तथा आशा के साथ यह क्रिया निहित है। इस प्रकार विश्वास और आशा को अलंकारिक रूप से जीवित साक्षियों के समान प्रस्तुत किया गया है।
    reason: मूल यूनानी शपथ-वाक्य की असामान्य व्याकरणिक और अलंकारिक बनावट को सुरक्षित और स्पष्ट करना।
lexical_decisions:
- source_word: συμβουλή
  choice: सलाह
  rationale: यहाँ प्रेषित उपदेश या परामर्श को दर्शाने वाला सामान्य शब्द है; ‘सलाह’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἀμεταμέλητα / ἀμεταμελήτως
  choice: पछताना नहीं पड़ेगा / बिना पछताए
  rationale: दोनों संबंधित यूनानी रूपों में पश्चात्ताप या खेद न होने का भाव है; हिन्दी में पुनरावृत्ति बनाए रखी गई है।
- source_word: ἐκτενοῦς ἐπιεικείας
  choice: पूरे धैर्य से भरी कोमलता
  rationale: ἐκτενής की उत्कटता/पूर्णता और ἐπιείκεια की सौम्यता, सहनशीलता तथा उदार संयम—दोनों को साथ व्यक्त करता है।
- source_word: δικαιώματα καὶ προστάγματα
  choice: विधियों और आज्ञाओं
  rationale: δικαιώματα परमेश्वर द्वारा ठहराई गई धार्मिक विधियों या अपेक्षाओं और προστάγματα स्पष्ट आदेशों को दर्शाता है।
- source_word: ἐντεταγμένος καὶ ἐλλόγιμος
  choice: सम्मिलित और गिना जाएगा
  rationale: दोनों शब्द नाम दर्ज किए जाने और किसी समूह की गणना में आने की संयुक्त धारणा देते हैं।
- source_word: σῳζομένων
  choice: उद्धार पाने वालों
  rationale: वर्तमान कृदन्त उद्धार की प्रक्रिया में रहने वाले लोगों को दर्शाता है; हिन्दी में सहज रूप से ‘उद्धार पाने वालों’ कहा गया है।
- source_word: Χριστός
  choice: मसीह
  rationale: यूनानी उपाधि Χριστός का प्रचलित हिन्दी मसीही समकक्ष ‘मसीह’ है।
theological_decisions:
- issue: शपथ-सदृश कथन में पवित्र आत्मा, विश्वास और आशा के साथ ‘जीवित हैं’ का संबंध
  choice: ‘जीवित हैं’ को स्पष्ट रूप से पूरा किया और विश्वास व आशा की अलंकारिक सजीवता बनाए रखी
  alternative: केवल ‘और पवित्र आत्मा, और चुने हुओं का विश्वास और आशा’ छोड़ देना
  rationale: यूनानी में ζῇ पहले दो पदों के साथ स्पष्ट है और बाद के कर्ताओं के साथ निहित समझा जाता है। स्पष्ट हिन्दी क्रिया पाठ को बोधगम्य बनाती है, जबकि मूल की असामान्य अलंकारिकता नहीं मिटाती।
- issue: अंतिम महिमावचन में αὐτῷ का संदर्भ
  choice: ‘परमेश्वर की महिमा’
  alternative: ‘उनकी महिमा’—जिसका निकटतम संदर्भ यीशु मसीह भी समझा जा सकता है
  rationale: पुल्लिंग सर्वनाम व्याकरणतः संदिग्ध है। व्यापक वाक्य-संरचना में परमेश्वर संभावित संदर्भ हैं, पर अस्पष्टता को टिप्पणी में स्वीकार किया गया है और किसी विशिष्ट सिद्धान्त को निर्णायक नहीं बनाया गया।
- issue: उद्धार की अभिव्यक्ति
  choice: ‘उद्धार पाने वालों की संख्या में’
  alternative: ‘बचाए जा रहे लोगों की संख्या में’
  rationale: यह रूप वर्तमान कृदन्त का प्रक्रियात्मक भाव पर्याप्त रूप से रखता है और आधुनिक धार्मिक हिन्दी में अधिक स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानसूचक बहुवचन क्रिया ‘हैं’ का प्रयोग परमेश्वर, प्रभु यीशु मसीह और पवित्र आत्मा के लिए किया गया है। शैली गरिमामय किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘दीनता’, ‘विधियाँ’, ‘आज्ञाएँ’, ‘उद्धार’ और ‘युगानुयुग’ जैसे परिचित धार्मिक शब्द आवश्यक सटीकता के लिए बनाए रखे गए हैं।
