id: 1CLEM.58.1
reference: 1 Clement 58:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὑποταχθῶμεν οὖν τῷ παναγίῳ καὶ ἐνδόξῳ ὀνόματι αὐτοῦ φυγόντες τὰς προειρημένας διὰ τῆς σοφίας τοῖς ἀπειθοῦσιν ἀπειλάς, ἵνα κατασκηνώσωμεν πεποιθότες ἐπὶ τὸ ὀσιώτατον τῆς μεγαλωσύνης αὐτοῦ ὄνομα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/058/001.yaml
  text: Let us therefore submit ourselves to his all-holy and glorious name, fleeing the threats previously spoken through wisdom against the disobedient, so that we may dwell, trusting in the most holy name of his majesty.
translation:
  language: hi
  text: इसलिए हम उसके परम पवित्र और महिमामय नाम के अधीन हों, और बुद्धि के द्वारा पहले आज्ञा न माननेवालों के विरुद्ध कही गई धमकियों से भागते हुए, उसकी महिमा के परम पवित्र नाम पर भरोसा रखते हुए निवास करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑποταχθῶμεν
  choice: हम ... के अधीन हो जाएँ
  rationale: मध्य/कर्मवाच्य उपदेशात्मक रूप स्वेच्छापूर्वक अधीन होने का भाव देता है; यह सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τῷ ... ὀνόματι
  choice: नाम के अधीन
  rationale: यूनानी में क्रिया का संबंध संप्रदान कारक ‘नाम’ से है; ‘नाम’ यहाँ परमेश्वर के प्रकट व्यक्तित्व और अधिकार का प्रतिनिधित्व करता है, इसलिए इसे यथावत रखा गया है।
- source_word: φυγόντες
  choice: दूर भागें
  rationale: मूल क्रिया में केवल बचने नहीं, सक्रिय रूप से पलायन करने का प्रबल भाव है।
- source_word: τοῖς ἀπειθοῦσιν
  choice: जो आज्ञा नहीं मानते
  rationale: ἀπειθέω में अविश्वास और अवज्ञा दोनों की अर्थ-छाया हो सकती है; प्रसंग में चेतावनियों के प्रति आज्ञा न मानना सहज और पर्याप्त रूप से व्यापक है।
- source_word: κατασκηνώσωμεν
  choice: निवास करें
  rationale: शाब्दिक अर्थ डेरा डालना/बसना है; यहाँ स्थायी आश्रय या निवास का भाव है।
- source_word: πεποιθότες ἐπὶ
  choice: पर भरोसा रखते हुए
  rationale: पूर्ण कृदंत वर्तमान में स्थापित भरोसे की दशा दर्शाता है और ἐπί के साथ भरोसे के आधार को व्यक्त करता है; ‘सुरक्षित’ जोड़कर दोहरा अनुवाद नहीं किया गया।
- source_word: μεγαλωσύνης
  choice: महानता
  rationale: यह महिमा, प्रताप या महानता सूचित कर सकता है; ‘महानता’ मूल की अमूर्त संज्ञा और अंग्रेज़ी परामर्श-पाठ दोनों के निकट है।
theological_decisions:
- issue: ‘नाम’ को परमेश्वर के अधिकार/व्यक्तित्व के स्थान पर स्पष्ट करना
  choice: मूल रूपक ‘नाम’ को बनाए रखा
  alternative: उसके अधिकार के अधीन हो जाएँ / उसी पर भरोसा रखें
  rationale: मूल पाठ ‘नाम’ को दो बार जानबूझकर दोहराता है; इसे व्याख्यात्मक समानार्थी से बदलने पर साहित्यिक और धर्मवैचारिक बल घट जाता।
- issue: ἀπειθοῦσιν में अविश्वास बनाम अवज्ञा
  choice: जो आज्ञा नहीं मानते
  alternative: अविश्वासियों के लिए
  rationale: शब्द दोनों अर्थ-क्षेत्रों को छू सकता है। ‘अविश्वासी’ इसे केवल बौद्धिक विश्वास तक सीमित कर सकता है, जबकि चेतावनी का नैतिक संदर्भ अवज्ञा को प्रमुख बनाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। यूनानी वाक्य की लंबाई को हिन्दी में स्पष्टता हेतु दो वाक्यों में बाँटा गया, पर कारण-उद्देश्य क्रम और सभी मुख्य संबंध सुरक्षित हैं।
