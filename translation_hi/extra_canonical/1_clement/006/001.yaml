base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/006/001.yaml
  text: To these men, who had conducted themselves in holiness, there was gathered a great multitude of the elect, who, having suffered many outrages and tortures because of jealousy, became a most beautiful example among us.
translation:
  language: hi
  text: इन पुरुषों के साथ, जिन्होंने पवित्रता से जीवन बिताया था, चुने हुओं की एक बड़ी भीड़ इकट्ठी हुई। ईर्ष्या के कारण बहुत-से अत्याचार और यातनाएँ सहकर वे हमारे बीच एक अत्यंत उत्कृष्ट उदाहरण बन गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ईर्ष्या के कारण बहुत-से अत्याचार और यातनाएँ सहते हुए।”
    reason: यूनानी कृदन्त παθόντες की संरचना और διὰ ζῆλος के अपेक्षाकृत निकट शब्दक्रम को दिखाने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: ὁσίως πολιτευσαμενοις
  choice: पवित्र जीवन बितानेवाले
  rationale: क्रियापद का अर्थ पवित्रता के अनुरूप आचरण या जीवन-व्यवहार करना है; यह सहज हिन्दी में उसके नैतिक और धार्मिक भाव को बनाए रखता है।
- source_word: συνηθροίσθη
  choice: सम्मिलित हो गई
  rationale: यह इन पुरुषों के साथ एक बड़ी भीड़ के जुड़ने या एकत्र होने को व्यक्त करता है।
- source_word: ἐκλεκτῶν
  choice: चुने हुओं
  rationale: ἐκλεκτός का पारंपरिक और स्पष्ट धार्मिक अर्थ सुरक्षित रखा गया है।
- source_word: αἰκίαις
  choice: अत्याचार
  rationale: शब्द अपमानजनक दुर्व्यवहार, क्रूरता और शारीरिक उत्पीड़न का बोध देता है; ‘अत्याचार’ हिन्दी में इस व्यापकता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: βασάνοις
  choice: यातनाएँ
  rationale: यह कठोर शारीरिक पीड़ा या यातना के लिए सीधा और आधुनिक हिन्दी शब्द है।
- source_word: ζῆλος
  choice: ईर्ष्या
  rationale: प्रसंग में नकारात्मक अर्थ वाला जोश या डाह अभिप्रेत है; ‘ईर्ष्या’ पूर्ववर्ती प्रसंग और सामान्य हिन्दी दोनों के अनुकूल है।
- source_word: ὑπόδειγμα κάλλιστον
  choice: एक अत्यंत सुंदर उदाहरण
  rationale: κάλλιστον की सौंदर्यात्मक तीव्रता को केवल ‘उत्तम’ बनाकर कम नहीं किया गया; हिन्दी में अर्थबोध के लिए ‘उदाहरण’ रखा गया है।
- source_word: ἐν ἡμῖν
  choice: हमारे बीच
  rationale: समुदाय के भीतर या उसकी दृष्टि में उदाहरण बनने का स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: ‘चुने हुओं’ की पहचान और चुनाव का स्वरूप
  choice: चुने हुओं
  alternative: विश्वासियों / परमेश्वर के चुने हुए लोगों
  rationale: मूल पाठ केवल ἐκλεκτῶν कहता है; विस्तार जोड़ने से ऐसी व्याख्या आ सकती थी जो पाठ स्वयं स्पष्ट नहीं करता।
- issue: διὰ ζῆλος का संबंध
  choice: ईर्ष्या के कारण उन्होंने अत्याचार और यातनाएँ सहीं
  alternative: ईर्ष्या के द्वारा बहुत-से अत्याचार और यातनाएँ सहते हुए
  rationale: διὰ का कारणसूचक अर्थ प्रसंग में सर्वाधिक स्वाभाविक है, लेकिन यूनानी वाक्यांश की संरचना और वैकल्पिक संयोजन को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामुदायिक और शहादत-वर्णन के अनुकूल शैली रखी गई है। ‘पवित्र जीवन बितानेवाले’ और ‘हमारे बीच’ जैसे रूप सामान्य पाठकों के लिए सहज हैं, जबकि ‘चुने हुए’ और ‘यातनाएँ’ मूल की धार्मिक एवं ऐतिहासिक गंभीरता बनाए रखते हैं।
