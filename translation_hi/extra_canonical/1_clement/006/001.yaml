  verdict: revise
  source_fidelity: 'The draft correctly represents the principal clauses: the holy conduct of the preceding men, the gathering of a great multitude of the elect, suffering due to jealousy, and their becoming an example within the community. The relative pronoun refers to the multitude of the elect; the revision makes that antecedent clearer in Hindi. The participial sense of παθόντες is retained by “सहकर.”'
  naturalness: “एक अत्यंत सुंदर उदाहरण” is a rather literal and somewhat unnatural Hindi collocation. “एक अत्यंत उत्कृष्ट उदाहरण” is idiomatic in a serious modern Hindi register while retaining the emphatic superlative force. Recasting the first participial phrase as a relative clause also improves readability.
  terminology: “चुने हुओं,” “ईर्ष्या,” “अत्याचार,” and “यातनाएँ” are suitable and preserve the theological and historical register without unwarranted interpretation. “पवित्रता से जीवन बिताया था” naturally conveys ὁσίως πολιτευσαμένοις.
  issues:
  - severity: low
    issue: The phrase “अत्यंत सुंदर उदाहरण” is stylistically calqued and unnatural in this context.
    rationale: Although κάλλιστον can bear an aesthetic sense, with ὑπόδειγμα it functions as an emphatic commendation. “अत्यंत उत्कृष्ट उदाहरण” is more idiomatic Hindi and preserves the superlative evaluative force.
  - severity: low
    issue: The antecedent of “उन्होंने” can momentarily be less clear after the first sentence.
    rationale: The Greek relative pronoun refers to “चुने हुओं की एक बड़ी भीड़,” not to the preceding men. Using “वे” after explicitly naming the multitude improves clarity without changing meaning.
