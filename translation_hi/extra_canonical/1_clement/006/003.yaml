  verse: 3
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/006/003.yaml
  text: 'Jealousy estranged wives from their husbands and altered what was spoken by our father Adam: “This now is bone from my bones and flesh from my flesh.”'
translation:
  language: hi
  text: 'ईर्ष्या ने पत्नियों को उनके पतियों से अलग कर दिया और हमारे पिता आदम के कहे हुए इन शब्दों को बदल दिया: “यह अब मेरी हड्डियों में की हड्डी और मेरे मांस में का मांस है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: ईर्ष्या
  rationale: इस प्रसंग में यह शब्द विनाशकारी जलन या डाह को दर्शाता है; ‘ईर्ष्या’ आधुनिक मानक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἀπηλλοτρίωσεν
  choice: अलग कर दिया
  rationale: यह क्रिया संबंध-विच्छेद या परायापन उत्पन्न करने का भाव रखती है; वैवाहिक संदर्भ में ‘अलग कर दिया’ अर्थ को सहज रूप से व्यक्त करता है।
- source_word: ἠλλοίωσεν
  choice: बदल दिया
  rationale: मूल अर्थ ‘बदलना/विकृत रूप देना’ है। यहाँ कथन के आशय को उलट देने की बात है, पर यूनानी की संक्षिप्त अस्पष्टता बनाए रखने के लिए ‘बदल दिया’ चुना गया है।
- source_word: τὸ ῥηθὲν
  choice: कहे हुए इन शब्दों
  rationale: शाब्दिक अर्थ ‘जो कहा गया था’ है; इसके बाद आने वाले प्रत्यक्ष उद्धरण से स्वाभाविक हिन्दी संबंध बनाने के लिए यह रूप लिया गया है।
- source_word: Τοῦτο νῦν ὀστοῦν ἐκ τῶν ὀστέων μου καὶ σὰρξ ἐκ τῆς σαρκός μου
  choice: अब यह मेरी हड्डियों में की हड्डी और मेरे मांस में का मांस है
  rationale: उत्पत्ति 2:23 की परिचित सामी अभिव्यक्ति और यूनानी पाठ की संरचना को यथासंभव बनाए रखते हुए स्पष्ट हिन्दी दी गई है।
theological_decisions:
- issue: ईर्ष्या ने आदम के कथन को किस अर्थ में ‘बदल दिया’
  choice: पाठ में केवल ‘बदल दिया’ रखा गया है
  alternative: ‘उलट दिया’ या ‘झुठला दिया’
  rationale: यूनानी ἠλλοίωσεν परिवर्तन बताता है, लेकिन परिवर्तन की ठीक प्रकृति स्पष्ट नहीं करता; इसलिए व्याख्यात्मक विस्तार नहीं जोड़ा गया।
- issue: γυναῖκας ἀνδρῶν में संबंध की पहचान
  choice: ‘पत्नियों को उनके पतियों से’
  alternative: ‘स्त्रियों को पुरुषों से’
  rationale: आदम के वैवाहिक कथन के तत्काल उद्धरण से पति-पत्नी का संबंध संदर्भगत रूप से स्पष्ट है; हिन्दी में इसे व्यक्त करना स्वाभाविक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आदम के उद्धरण में बाइबलीय मुहावरे की औपचारिकता सुरक्षित रखी गई है; कोई पादटिप्पणी आवश्यक नहीं है।
