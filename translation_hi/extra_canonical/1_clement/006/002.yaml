base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/006/002.yaml
  text: Because of jealousy, women were persecuted as Danaids and Dircae; after suffering terrible and unholy outrages, they safely reached the goal of the faith and received a noble reward, though weak in body.
translation:
  language: hi
  text: ईर्ष्या के कारण स्त्रियों को दानाइदों और दिर्काओं के रूप में सताया गया।[a] भयंकर और अपवित्र अत्याचार सहने के बाद वे विश्वास की दृढ़ दौड़ के अंत तक पहुँचीं और शरीर से निर्बल होते हुए भी उन्होंने गौरवपूर्ण पुरस्कार पाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दानाइद” और “दिर्का” यूनानी पौराणिक कथाओं के पात्रों के नाम हैं। संभवतः यहाँ उन स्त्रियों की ओर संकेत है जिन्हें इन कथाओं से जुड़ी भूमिकाएँ निभाने या उन्हीं के अनुरूप यातनाएँ सहने के लिए विवश किया गया था।
    reason: आधुनिक पाठक के लिए अपरिचित सांस्कृतिक संकेत स्पष्ट करना और ऐतिहासिक विवरण की अनिश्चितता बनाए रखना।
lexical_decisions:
