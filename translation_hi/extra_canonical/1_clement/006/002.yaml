  choice: ईर्ष्या के कारण
  rationale: संदर्भ में ζῆλος विनाशकारी जलन या ईर्ष्या को सूचित करता है; यूनानी में कारक-रूप असामान्य है, पर अर्थ स्पष्ट है।
- source_word: Δαναΐδες καὶ Δίρκαι
  choice: दानाइदों और दिर्काओं के रूप में
  rationale: ये यूनानी पौराणिक कथाओं से जुड़े बहुवचन नाम हैं और संभवतः उन कथाओं पर आधारित यातनाओं या सार्वजनिक अभिनय की भूमिकाओं की ओर संकेत करते हैं। 'के रूप में' इस संकेत को व्यक्त करता है, पर नामों की ऐतिहासिक पहचान को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: αἰκίσματα δεινὰ καὶ ἀνόσια
  choice: भयंकर और अपवित्र अत्याचार
  rationale: αἰκίσματα क्रूर दुर्व्यवहार, अपमान या यातना को दर्शाता है; विशेषण उनकी भयावहता और अधार्मिक प्रकृति दोनों बनाए रखते हैं।
- source_word: τὸν τῆς πίστεως βέβαιον δρόμον κατήντησαν
  choice: विश्वास की दृढ़ दौड़ के अंत तक पहुँचीं
  rationale: δρόμος की दौड़ या निर्धारित मार्ग की रूपक-छवि तथा κατήντησαν में निहित गंतव्य तक पहुँचने का भाव दोनों सुरक्षित रखे गए हैं।
- source_word: γέρας γενναῖον
  choice: गौरवपूर्ण पुरस्कार
  rationale: γέρας सम्मानस्वरूप पुरस्कार है और γενναῖον उसकी महान या उत्कृष्ट प्रकृति बताता है; यह चयन स्वाभाविक हिन्दी में दोनों भाव समेटता है।
- source_word: αἱ ἀσθενεῖς τῷ σώματι
  choice: शरीर से निर्बल होते हुए भी
  rationale: मूल में शारीरिक निर्बलता और प्राप्त विजय के बीच निहित विरोध को हिन्दी में स्पष्ट और स्वाभाविक बनाया गया है।
