- issue: स्त्रियों की शारीरिक निर्बलता
  choice: शरीर से निर्बल होते हुए भी
  alternative: निर्बल स्त्रियों ने
  rationale: मूल का बल उनकी अवमानना पर नहीं, बल्कि शारीरिक निर्बलता के बावजूद उनकी दृढ़ता और सम्मानित प्रतिफल पर है।
