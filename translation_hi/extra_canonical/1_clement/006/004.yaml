base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/006/004.yaml
  text: Because of jealousy and strife, great cities have been overthrown and great nations uprooted.
translation:
  language: hi
  text: ईर्ष्या और कलह ने बड़े-बड़े नगरों को नष्ट कर दिया और बड़े-बड़े जनसमुदायों को जड़ से उखाड़ दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: ईर्ष्या
  rationale: इस प्रसंग में शब्द का नकारात्मक अर्थ है; पिछले वाक्यों की शृंखला में यह द्वेषपूर्ण ईर्ष्या को सूचित करता है।
- source_word: ἔρις
  choice: कलह
  rationale: यह झगड़े और संघर्ष दोनों को समेटने वाला स्वाभाविक तथा गरिमापूर्ण हिन्दी शब्द है।
- source_word: πόλεις μεγάλας
  choice: बड़े-बड़े नगरों
  rationale: बहुवचन की व्यापकता और μέγας के बल को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κατέστρεψεν
  choice: नष्ट कर दिया
  rationale: क्रिया सक्रिय एकवचन है और संयुक्त कर्ता को समष्टि रूप में ग्रहण करती है; अर्थ नगरों के विनाश या विध्वंस का है।
- source_word: ἔθνη μεγάλα
  choice: महान जातियों
  rationale: ἔθνη यहाँ बड़े जनसमुदायों अथवा राष्ट्रों को सूचित कर सकता है; ‘जातियाँ’ मूल की व्यापकता को बनाए रखता है।
- source_word: ἐξερίζωσεν
  choice: जड़ से उखाड़ दिया
  rationale: ग्रीक क्रिया के मूल रूपक और पूर्ण विनाश के भाव को सीधे सुरक्षित रखता है।
theological_decisions:
- issue: ζῆλος का अर्थ
  choice: ईर्ष्या
  alternative: उत्साह / जलन
  rationale: अध्याय में इसके विनाशकारी परिणाम बताए गए हैं, इसलिए सकारात्मक ‘उत्साह’ अनुचित है; ‘ईर्ष्या’ अधिक स्पष्ट और प्रसंगानुकूल है।
- issue: ἔθνη का दायरा
  choice: जातियाँ
  alternative: राष्ट्र
  rationale: ‘जातियाँ’ प्राचीन जनसमुदायों और लोगों के समूहों के लिए अपेक्षाकृत व्यापक है तथा आधुनिक राष्ट्र-राज्य की धारणा को अनावश्यक रूप से आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य। मूल ग्रीक में कारणसूचक διά नहीं है; ζῆλος καὶ ἔρις व्याकरणतः कर्ता हैं, इसलिए अनुवाद सक्रिय रखा गया है। कोई पादटिप्पणी आवश्यक नहीं।
