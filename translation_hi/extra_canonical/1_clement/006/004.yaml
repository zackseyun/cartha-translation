revisions:
- from: ईर्ष्या और कलह ने बड़े-बड़े नगरों को नष्ट कर दिया और महान जातियों को जड़ से उखाड़ दिया।
  to: ईर्ष्या और कलह ने बड़े-बड़े नगरों को नष्ट कर दिया और बड़े-बड़े जनसमुदायों को जड़ से उखाड़ दिया।
  rationale: The revision changes only the rendering of ἔθνη μεγάλα, replacing an evaluative and potentially ambiguous expression with a natural modern Hindi term that retains the source’s breadth and emphasis on large-scale peoples or communities. The active construction is retained because the Greek explicitly presents jealousy and strife as the grammatical agents.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T16:32:12Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders ζῆλος καὶ ἔρις as the collective active subject and accurately conveys the destructive force of κατέστρεψεν and ἐξερίζωσεν. However, «महान जातियों» can mean morally or culturally ‘great/noble peoples,’ whereas μεγάλα denotes size or extent in this parallelism with μεγάλα cities.
  naturalness: The sentence is otherwise fluent and suitably concise in modern standard Hindi. «बड़े-बड़े जनसमुदायों» is clear and avoids the modern caste association of «जातियों» while preserving the broad sense of ἔθνη.
  terminology: «ईर्ष्या», «कलह», «नगरों», and «जड़ से उखाड़ दिया» are appropriate. «जनसमुदायों» represents ἔθνη without imposing the narrower modern nation-state sense of «राष्ट्रों».
  issues:
  - severity: low
    issue: «महान जातियों» for ἔθνη μεγάλα
    rationale: «महान» is evaluative in Hindi, but the Greek adjective primarily marks magnitude. «जातियों» can also be heard chiefly as caste categories in contemporary Hindi. A non-evaluative, broader collective expression better reflects the source.
  revised_text: ईर्ष्या और कलह ने बड़े-बड़े नगरों को नष्ट कर दिया और बड़े-बड़े जनसमुदायों को जड़ से उखाड़ दिया।
  revised_footnotes: []
  revision_rationale: The revision changes only the rendering of ἔθνη μεγάλα, replacing an evaluative and potentially ambiguous expression with a natural modern Hindi term that retains the source’s breadth and emphasis on large-scale peoples or communities. The active construction is retained because the Greek explicitly presents jealousy and strife as the grammatical agents.
