id: 1CLEM.46.7
reference: 1 Clement 46:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: ἱνατί διέλκωμεν καὶ διασπῶμεν τὰ μέλη τοῦ Χριστοῦ καὶ στασιάζομεν πρὸς τὸ σῶμα τὸ ἴδιον, καὶ εἰς τοσαύτην ἀπόνοιαν ἐρχόμεθα, ὥστε ἐπιλαθέσθαι ἡμᾶς, ὅτι μέλη ἐσμὲν ἀλλήλων; μνήσθητε τῶν λόγων Ἰησοῦ τοῦ κυρίου ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/007.yaml
  text: 'Why do we pull apart and tear to pieces the members of Messiah[a], and rise in revolt against our own body, and come to such a pitch of madness that we forget that we are members of one another?


    Remember the words of Jesus our Lord.'
translation:
  language: hi
  text: 'हम मसीह के अंगों को क्यों खींचकर अलग करते और टुकड़े-टुकड़े करते हैं, अपने ही शरीर के विरुद्ध क्यों विद्रोह करते हैं, और ऐसी उन्मत्तता तक क्यों पहुँच जाते हैं कि भूल जाते हैं कि हम एक-दूसरे के अंग हैं?


    हमारे प्रभु यीशु के वचनों को स्मरण करो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέλκωμεν καὶ διασπῶμεν
  choice: खींचकर अलग करते और टुकड़े-टुकड़े करते हैं
  rationale: 'दोनों यूनानी क्रियाओं की क्रमिक तीव्रता सुरक्षित रखी गई है: पहली अलग खींचने और दूसरी हिंसापूर्वक चीर डालने का भाव देती है।'
- source_word: τὰ μέλη τοῦ Χριστοῦ
  choice: मसीह के अंगों
  rationale: μέλη शरीर के अंगों को दर्शाता है और आगे के शारीरिक रूपक से जुड़ता है; Χριστός के लिए स्वाभाविक हिन्दी पद ‘मसीह’ रखा गया है।
- source_word: στασιάζομεν
  choice: विद्रोह करते हैं
  rationale: यह शब्द गुटबंदी, कलह या बगावत का प्रबल भाव रखता है; ‘विद्रोह’ अपने ही शरीर के विरुद्ध उठ खड़े होने की तीव्रता व्यक्त करता है।
- source_word: ἀπόνοιαν
  choice: घोर मूर्खता
  rationale: संदर्भ में यह विवेकहीनता या उन्मत्त मूर्खता की चरम अवस्था है; सहज हिन्दी में तीव्रता बनाए रखने के लिए यह पद चुना गया है।
- source_word: μνήσθητε
  choice: स्मरण करो
  rationale: बहुवचन आज्ञार्थक का dignified और स्पष्ट हिन्दी रूप।
theological_decisions:
- issue: ‘मसीह के अंग’ और ‘एक-दूसरे के अंग’ का सामुदायिक-शारीरिक रूपक
  choice: रूपक को प्रत्यक्ष रूप से सुरक्षित रखा गया
  alternative: ‘मसीह की देह के सदस्य’ और ‘एक-दूसरे से जुड़े हुए’
  rationale: मूल पाठ μέλη और σῶμα की देह-संबंधी भाषा को जानबूझकर दोहराता है; व्याख्यात्मक विस्तार उस तनाव और सजीवता को कम कर देता।
- issue: τὸ σῶμα τὸ ἴδιον का संबंध
  choice: ‘अपने ही शरीर के विरुद्ध’
  alternative: ‘अपनी ही देह के विरुद्ध’
  rationale: मूल में सामूहिक देह का अर्थ संभव है और वही ‘एक-दूसरे के अंग’ से पुष्ट होता है; हिन्दी में ‘अपने ही शरीर’ इस संबंध को बिना अतिरिक्त सिद्धान्त आरोपित किए बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, सार्वजनिक-पाठ योग्य शैली रखी गई है। लम्बे यूनानी आलंकारिक प्रश्न को हिन्दी में समानांतर ‘क्यों’ खंडों द्वारा स्पष्ट बनाया गया है, जबकि उसकी तीव्रता और देह-रूपक सुरक्षित हैं।
