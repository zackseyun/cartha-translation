  text: For it is written, “Cling to the holy ones, because those who cling to them will be made holy.”
translation:
  language: hi
  text: क्योंकि लिखा है, “पवित्र जनों से जुड़े रहो, क्योंकि जो उनसे जुड़े रहते हैं, वे पवित्र किए जाएँगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κολλᾶσθε / κολλώμενοι
  choice: लिपटे रहो / लिपटे रहते हैं
  rationale: यह चुनाव यूनानी क्रिया κολλάω के निकटता से जुड़ने और दृढ़ता से साथ बने रहने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; दोनों रूपों की पुनरावृत्ति भी सुरक्षित रखी गई है।
- source_word: τοῖς ἁγίοις
  choice: पवित्र जनों से
  rationale: बहुवचन विशेषण का संज्ञात्मक प्रयोग यहाँ पवित्र व्यक्तियों को दर्शाता है; ‘पवित्र जन’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: ἁγιασθήσονται
  choice: पवित्र किए जाएँगे
  rationale: भविष्यकालीन कर्मवाच्य को यथावत रखा गया है और कर्ता को अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: γέγραπται γάρ
  choice: क्योंकि लिखा है
  rationale: स्थायी प्रामाणिक उद्धरण का परिचय देने वाले यूनानी पूर्ण कर्मवाच्य का स्वाभाविक और पारंपरिक हिन्दी रूप।
theological_decisions:
- issue: पवित्रीकरण के अप्रकट कर्ता
  choice: कर्मवाच्य ‘पवित्र किए जाएँगे’
  alternative: ‘परमेश्वर उन्हें पवित्र करेगा’
  rationale: यूनानी पाठ कर्ता का नाम नहीं देता। कर्मवाच्य अनुवाद इस संभावित दैवी कर्मवाच्य को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- issue: ‘पवित्र जनों’ की पहचान
  choice: सामान्य पद ‘पवित्र जन’
  alternative: ‘संत’ या किसी विशिष्ट धार्मिक वर्ग का नाम
  rationale: मूल पाठ किसी विशेष पद, संस्था या वर्ग की पहचान नहीं करता; इसलिए साम्प्रदायिक अर्थारोपण से बचा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘लिपटे रहो’ मूल क्रिया की प्रबल निकटता को व्यक्त करता है, जबकि वाक्य की उद्धरणात्मक और उपदेशात्मक शैली बनी रहती है।
