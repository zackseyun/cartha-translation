  terminology: '“फूट” for διχοστασίαι and “विभाजन” for σχίσματα provide a useful, intelligible distinction: internal dissension/factional strife followed by actual splits. “युद्ध” correctly retains the force of πόλεμος without deciding whether its use is literal or figurative in context.'
