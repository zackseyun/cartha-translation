  yaml_path: translation/extra_canonical/1_clement/046/005.yaml
  text: Why are there quarrels and anger and divisions and schisms and even war among you?
translation:
  language: hi
  text: तुम्हारे बीच झगड़े, क्रोध, फूट, विभाजन, और यहाँ तक कि युद्ध भी क्यों हैं?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρεις
  choice: झगड़े
  rationale: बहुवचन ἔρεις आपसी विवादों और कलह को दर्शाता है; ‘झगड़े’ सहज और अर्थ-सटीक है।
- source_word: θυμοὶ
  choice: क्रोध
  rationale: θυμοί तीव्र क्रोध या रोष को व्यक्त करता है; मूल की संज्ञात्मक सूची बनाए रखने के लिए ‘क्रोध’ चुना गया है।
- source_word: διχοστασίαι
  choice: फूट
  rationale: यह शब्द समुदाय के भीतर मतभेद से उत्पन्न विभाजन को दर्शाता है; ‘फूट’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: σχίσματα
  choice: अलगाव
  rationale: σχίσματα टूटकर अलग गुट बनने या विदारण का बोध कराता है; ‘अलगाव’ διχοστασίαι से कुछ भिन्नता बनाए रखता है।
- source_word: πόλεμος
  choice: युद्ध
  rationale: शाब्दिक अर्थ ‘युद्ध’ है और यहाँ समुदाय के भीतर संघर्ष की चरम अवस्था को बल देता है; इसे रूपक मानकर हल्का नहीं किया गया।
- source_word: ἐν ὑμῖν
  choice: तुम्हारे बीच
  rationale: समुदाय के सदस्यों के बीच विद्यमान दशा को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: πόλεμος का शाब्दिक या रूपक अर्थ
  choice: युद्ध
  alternative: घोर संघर्ष
  rationale: मूल पाठ ‘युद्ध’ का प्रबल शब्द प्रयोग करता है। संदर्भ में यह रूपक हो सकता है, पर अनुवाद उस तनाव को स्वयं हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। मूल यूनानी की क्रमिक संज्ञा-सूची और अंत में ‘युद्ध’ की तीव्रता को सुरक्षित रखा गया है।
