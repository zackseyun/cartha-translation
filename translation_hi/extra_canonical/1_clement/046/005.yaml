  source_fidelity: 'The draft accurately renders ἔρεις as “झगड़े,” θυμοί as “क्रोध,” διχοστασίαι as “फूट,” πόλεμος as “युद्ध,” and ἐν ὑμῖν as “तुम्हारे बीच.” It also appropriately preserves the intensifying “even war” (πόλεμός τε). However, “अलगाव” for σχίσματα is less precise: it commonly denotes isolation or separation rather than a schism/divisive split within a community.'
