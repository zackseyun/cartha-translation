source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν ἐν ἑτέρῳ τόπῳ λέγει· Μετὰ ἀνδρὸς ἀθῴου ἀθῷος ἔσῃ καὶ μετὰ ἐκλεκτοῦ ἐκλεκτὸς ἔσῃ, καὶ μετὰ στρεβλοῦ διαστρέψεις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/003.yaml
  text: And again[a], in another place it says, “With an innocent man you will be innocent, and with an elect one you will be elect, and with a crooked one you will become twisted.”
translation:
  language: hi
  text: और फिर, एक अन्य स्थान पर वह कहता है, “निर्दोष मनुष्य के साथ तुम निर्दोष रहोगे, चुने हुए मनुष्य के साथ तुम चुने हुए होगे, और टेढ़े मनुष्य के साथ तुम टेढ़े हो जाओगे।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम वाक्यांश का अनुवाद यह भी हो सकता है: “टेढ़े मनुष्य के साथ तुम कुटिल चाल चलोगे।”'
    reason: यूनानी διαστρέψεις सक्रिय रूप में है; उसका क्रियात्मक अर्थ भी संभव है, जबकि मुख्य पाठ समानांतर कथन के परिणामसूचक, चरित्रगत अर्थ को व्यक्त करता है।
lexical_decisions:
- source_word: ἀθῷος
  choice: निर्दोष
  rationale: यह शब्द दोष या अपराध से मुक्त होने का भाव व्यक्त करता है; ‘निर्दोष’ आधुनिक हिन्दी में सहज और सटीक है।
- source_word: ἐκλεκτός
  choice: चुना हुआ
  rationale: यह ἐκλεκτοῦ और ἐκλεκτός की पुनरावृत्ति बनाए रखता है और किसी विशिष्ट उपाधि के बजाय सामान्य व्यक्ति-वर्ग का भाव देता है।
- source_word: στρεβλός / διαστρέψεις
  choice: टेढ़ा / टेढ़े हो जाओगे
  rationale: ‘टेढ़ा’ नैतिक कुटिलता का स्वाभाविक हिन्दी रूपक है। अंतिम क्रिया का प्रसंगगत अर्थ ऐसे व्यक्ति की संगति में स्वयं वैसा हो जाने के रूप में व्यक्त किया गया है।
- source_word: λέγει
  choice: वह कहता है
  rationale: यूनानी का वर्तमानकाल और एकवचन कर्ता सुरक्षित रखा गया है; पूर्व प्रसंग में संकेतित शास्त्रीय वचन इसका स्वाभाविक कर्ता है।
theological_decisions:
- issue: ἐκλεκτός को किसी विशिष्ट मसीहाई उपाधि के रूप में पढ़ना
  choice: ‘चुने हुए मनुष्य’—एक सामान्य, अनिश्चित व्यक्ति-वर्ग
  alternative: ‘उस चुने हुए’ या ‘चुनिंदा व्यक्ति’
  rationale: यूनानी में निश्चित उपपद नहीं है और यह पद ‘निर्दोष मनुष्य’ तथा ‘टेढ़े मनुष्य’ के समानांतर एक लोकोक्तिपरक सामान्य कथन है।
- issue: διαστρέψεις का अर्थ
  choice: ‘तुम भी टेढ़े हो जाओगे’
  alternative: ‘तुम टेढ़ा व्यवहार करोगे’
  rationale: क्रिया शाब्दिक रूप से मोड़ने या विकृत होने/करने की दिशा रखती है; यहाँ समानांतर कथन व्यक्ति के चरित्र पर संगति के प्रभाव की ओर संकेत करता है। वैकल्पिक अधिक क्रियात्मक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए सहज रखी गई है। तीनों समानांतर खंडों में ‘मनुष्य के साथ’ और संबंधित विशेषण की पुनरावृत्ति से यूनानी की लोकोक्तिपरक लय सुरक्षित है।
