- source_word: Τοιούτοις οὖν ὑποδείγμασιν
  choice: इसलिए... ऐसे उदाहरणों से
  rationale: οὖν का निष्कर्षसूचक अर्थ ‘इसलिए’ से और τοιούτοις ὑποδείγμασιν का अर्थ सहज आधुनिक हिन्दी में ‘ऐसे उदाहरणों से’ व्यक्त किया गया है।
- source_word: κολληθῆναι
  choice: जुड़े रहना
  rationale: क्रिया का मूल बिंब किसी वस्तु से दृढ़ता से चिपकने या संलग्न होने का है; ‘जुड़े रहना’ उस स्थायी निष्ठा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καὶ ἡμᾶς δεῖ
  choice: हमें भी... चाहिए
  rationale: καί का समावेशी बल ‘भी’ और δεῖ की आवश्यकता ‘चाहिए’ से सुरक्षित रखी गई है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यह प्रत्यक्ष संबोधन का परंपरागत और स्रोत-सन्निकट रूप है; यहाँ समुदाय के साथी विश्वासियों को संबोधित किया गया है।
