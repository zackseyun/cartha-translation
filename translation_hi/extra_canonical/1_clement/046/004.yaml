  yaml_path: translation/extra_canonical/1_clement/046/004.yaml
  text: Let us therefore join ourselves to the innocent and righteous[a], for these are God’s chosen ones.
translation:
  language: hi
  text: इसलिए हम निर्दोष और धर्मी लोगों से जुड़ जाएँ, क्योंकि[a] ये परमेश्वर के चुने हुए लोग हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और ये परमेश्वर के चुने हुए लोग हैं।”
    reason: यूनानी δὲ यहाँ व्याख्यात्मक संबंध (‘क्योंकि’) या साधारण संयोजन (‘और’) दोनों व्यक्त कर सकता है।
lexical_decisions:
- source_word: κολληθῶμεν
  choice: हम … से जुड़ जाएँ
  rationale: यह क्रिया किसी के साथ निकटता से जुड़ने या उससे लगे रहने का भाव देती है। ‘से जुड़ जाएँ’ आधुनिक हिन्दी में स्वाभाविक है और मूल के सामूहिक आह्वान को बनाए रखता है।
- source_word: ἀθῴοις
  choice: निर्दोष
  rationale: यहाँ उन लोगों का वर्णन है जो दोषरहित या निर्दोष हैं; ‘निर्दोष’ सहज और गरिमापूर्ण हिन्दी है।
- source_word: δικαίοις
  choice: धर्मी
  rationale: यह शब्द नैतिक रूप से सही और न्यायपूर्ण लोगों को सूचित करता है; धार्मिक साहित्य के इस संदर्भ में ‘धर्मी’ सटीक और परिचित है।
- source_word: ἐκλεκτοὶ τοῦ θεοῦ
  choice: परमेश्वर के चुने हुए लोग
  rationale: यह पद परमेश्वर द्वारा चुने गए लोगों को दर्शाता है। ‘चुने हुए लोग’ मूल के बहुवचन विशेषण को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: δὲ द्वारा दूसरे वाक्यांश का संबंध
  choice: क्योंकि
  alternative: और
  rationale: संदर्भ में दूसरा वाक्य पहले आह्वान का कारण बताता हुआ पढ़ा जा सकता है, इसलिए ‘क्योंकि’ सहज है। फिर भी δὲ स्वयं संयोजक ‘और’ के रूप में भी समझा जा सकता है; इस संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली संक्षिप्त, गरिमापूर्ण और सामूहिक उपदेश के अनुकूल है। ‘हम … जुड़ जाएँ’ मूल के प्रथम-पुरुष बहुवचन आह्वान को स्वाभाविक रूप से व्यक्त करता है।
