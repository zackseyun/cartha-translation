  text: εἶπεν γάρ· Οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ· καλὸν ἦν αὐτῷ, εἰ οὐκ ἐγεννήθη, ἢ ἕνα τῶν ἐκλεκτῶν μου σκανδαλίσαι· κρεῖττον ἦν αὐτῷ περιτεθῆναι μύλον καὶ καταποντισθῆναι εἰς τὴν θάλασσαν, ἢ ἕνα τῶν ἐκλεκτῶν μου διαστρέψαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/008.yaml
  text: For he said[a], “Woe to that man. It would have been good for him if he had not been born, rather than to cause one of my chosen ones to stumble. It would have been better for him to have a millstone hung around him and to be sunk into the sea, than to lead one of my chosen ones astray.”
translation:
  language: hi
  text: क्योंकि उसने कहा, “हाय उस मनुष्य पर! उसके लिए अच्छा होता कि वह जन्मा ही न होता, बजाय इसके कि वह मेरे चुने हुओं में से एक को ठोकर खिलाए। उसके लिए इससे अच्छा होता कि उसके गले में चक्की का पाट बाँध दिया जाता और उसे समुद्र में डुबो दिया जाता, बजाय इसके कि वह मेरे चुने हुओं में से एक को भटका दे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκανδαλίσαι
  choice: ठोकर खिलाए
  rationale: यह यूनानी क्रिया किसी को पतन या पाप का अवसर देने का रूपक रखती है; हिन्दी का बाइबलीय और समझने योग्य मुहावरा इस रूपक को बनाए रखता है।
- source_word: ἐκλεκτῶν
  choice: चुने हुओं
  rationale: यह चयन के मूल अर्थ को सीधे रखता है और किसी विशेष साम्प्रदायिक व्याख्या को नहीं जोड़ता।
- source_word: μύλον
  choice: चक्की का पाट
  rationale: यह भारी पीसने वाले पत्थर का स्वाभाविक हिन्दी नाम है; प्रसंग में गले में बाँधने की क्रिया उसके घातक भार को स्पष्ट करती है।
- source_word: διαστρέψαι
  choice: भटका दे
  rationale: यह किसी को सही मार्ग से फेरने का अर्थ देता है और पहले प्रयुक्त σκανδαλίσαι (‘ठोकर खिलाए’) से शब्दगत भेद बनाए रखता है।
- source_word: καταποντισθῆναι
  choice: समुद्र में डुबो दिया जाता
  rationale: कर्मवाच्य और पानी में पूरी तरह डुबोकर नष्ट किए जाने का भाव दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: ἐκλεκτῶν (‘चुने हुओं’) की पहचान
  choice: अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के ‘मेरे चुने हुओं’ रखा गया
  alternative: ‘मेरे विश्वासियों’ या ‘मेरे लोगों’
  rationale: मूल पाठ चयन की भाषा प्रयोग करता है, पर यहाँ उसके धार्मिक सिद्धांत या समूह की सटीक पहचान नहीं बताता।
- issue: σκανδαλίσαι और διαστρέψαι के संबंध
  choice: क्रमशः ‘ठोकर खिलाए’ और ‘भटका दे’
  alternative: दोनों का समान अनुवाद, जैसे ‘पथभ्रष्ट करे’
  rationale: दोनों निकटार्थी हैं, फिर भी मूल में अलग क्रियाएँ हैं; हिन्दी में उनका भेद बनाए रखने से कथन की तीव्रता और विस्तार सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और उद्धरणोचित रूप अपनाया गया है। ‘हाय उस मनुष्य पर’ चेतावनी की भविष्यद्वक्तापूर्ण तीव्रता रखता है। समानांतर वाक्यों की बनावट सुरक्षित रखते हुए अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
