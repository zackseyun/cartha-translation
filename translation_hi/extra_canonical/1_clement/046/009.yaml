base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/009.yaml
  text: Your schism has turned many aside, cast many into discouragement, many into doubt, and all of us into grief; and your factional strife persists.
translation:
  language: hi
  text: तुम्हारी फूट ने बहुतों को भटका दिया, बहुतों को निराशा में डाल दिया, बहुतों को संदेह में डाल दिया, और हम सबको दुःख में डाल दिया; और तुम्हारा गुटीय संघर्ष बना हुआ है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχίσμα
  choice: फूट
  rationale: यहाँ समुदाय के भीतर विभाजन का भाव है; ‘फूट’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: διέστρεψεν
  choice: भटका दिया है
  rationale: क्रिया के किसी को सही मार्ग से फेर देने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀθυμίαν
  choice: निराशा
  rationale: हतोत्साह और मन टूटने की अवस्था के लिए सामान्य, सुबोध शब्द।
- source_word: δισταγμόν
  choice: संदेह
  rationale: हिचकिचाहट, अनिश्चय और संशय की अर्थ-सीमा को संदर्भ में संक्षेपतः व्यक्त करता है।
- source_word: στάσις
  choice: कलह
  rationale: यहाँ गुटबंदी से उपजे समुदायगत संघर्ष का भाव है; ‘कलह’ केवल मतभेद से अधिक तीव्रता रखता है।
- source_word: ἐπίμονος
  choice: बना हुआ है
  rationale: कलह के लगातार और हठपूर्वक टिके रहने का अर्थ स्वाभाविक हिन्दी में देता है; ‘फिर भी’ प्रसंगगत प्रतिकूल निरंतरता स्पष्ट करता है।
