  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी वाक्य की आवृत्तिमूलक संरचना—‘बहुतों को… बहुतों को… बहुतों को… हम सबको’—सुरक्षित रखी गई है।
