source:
  edition: Funk 1901 (normalized OCR)
  text: ἢ οὐχὶ ἕνα θεὸν ἔχομεν καὶ ἕνα Χριστὸν καὶ ἓν πνεῦμα τῆς χάριτος τὸ ἐκχυθὲν ἐφ’ ἡμᾶς, καὶ μία κλῆσις ἐν Χριστῷ;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/006.yaml
  text: Or do we not have one God and one Messiah and one Spirit of grace poured out upon us[b][a], and one calling in Messiah?
translation:
  language: hi
  text: या क्या हमारे पास एक ही परमेश्वर, एक ही मसीह और अनुग्रह का एक ही आत्मा नहीं है, जो हम पर उंडेला गया है, और मसीह में एक ही बुलाहट नहीं है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में ‘एक ही बुलाहट’ प्रथमा कारक में है, जबकि ‘एक परमेश्वर’, ‘एक मसीह’ और ‘एक आत्मा’ ‘हमारे पास है’ के कर्म हैं। इसलिए इसका अनुवाद इस प्रकार भी हो सकता है: ‘...जो हम पर उंडेला गया है—और मसीह में एक ही बुलाहट है।’'
    reason: मूल वाक्य में कारक-परिवर्तन और संभावित वाक्यभंग को दर्शाना।
lexical_decisions:
- source_word: Χριστός
  choice: मसीह
  rationale: यूनानी उपाधि का अर्थ और आरंभिक मसीही संदर्भ बनाए रखता है; हिन्दी में स्वाभाविक और प्रचलित है।
- source_word: πνεῦμα τῆς χάριτος
  choice: अनुग्रह का आत्मा
  rationale: संबंधवाचक यूनानी रचना को जानबूझकर निकटता से रखा गया है; इसका आशय ‘अनुग्रह देनेवाला आत्मा’ या ‘अनुग्रह से चिह्नित आत्मा’ हो सकता है, इसलिए अर्थ को अधिक स्पष्ट करके सीमित नहीं किया गया।
- source_word: κλῆσις
  choice: बुलाहट
  rationale: ईश्वरीय आह्वान के भाव को व्यक्त करने वाला सामान्य और धर्मशास्त्रीय रूप से पर्याप्त हिन्दी शब्द।
- source_word: ἐκχυθὲν ἐφ’ ἡμᾶς
  choice: जो हम पर उंडेला गया है
  rationale: उंडेले जाने के मूल रूपक और निष्पन्न कर्मवाच्य भाव को सुरक्षित रखता है।
theological_decisions:
- issue: μία κλῆσις का कारक और वाक्यगत संबंध
  choice: ‘और मसीह में एक ही बुलाहट नहीं है?’ के रूप में समानांतर प्रश्नात्मक दावा
  alternative: 'इसे पिछले प्रत्यक्ष कर्मों की सूची में सीधे जोड़ना: ‘और मसीह में एक ही बुलाहट रखते हैं’'
  rationale: यूनानी में पहले तीन पद ἔχομεν के कर्म के रूप में द्वितीया में हैं, पर μία κλῆσις प्रथमा में है। हिन्दी में अलग ‘है’ देकर इस बदलाव को स्वाभाविक ढंग से संकेत किया गया है, बिना कोई नया स्वतंत्र धर्मशास्त्रीय कथन गढ़े।
- issue: ἓν πνεῦμα की पहचान
  choice: ‘एक ही आत्मा’ और पुल्लिंग संबंधवाचक ‘जो ... उंडेला गया है’
  alternative: ‘एक ही पवित्र आत्मा’
  rationale: मूल में ‘पवित्र’ नहीं है; उसे जोड़ने के बजाय ‘अनुग्रह का आत्मा’ की वास्तविक अभिव्यक्ति रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘एक ही’ की पुनरावृत्ति मूल के एकता-संबंधी आलंकारिक बल को बनाए रखती है। ‘हमारा ... है’ स्वाभाविक हिन्दी में ἔχομεν का भाव देता है; अंतिम खंड में अलग क्रिया यूनानी के कारक-परिवर्तन को संभालती है।
