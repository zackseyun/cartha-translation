translation:
  language: hi
  text: इसलिए वह हमसे, जो पूरे हृदय से उस पर विश्वास करते हैं, आग्रह करता है कि हम हर भले काम में न तो आलसी हों, न लापरवाह।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προτρέπεται
  choice: आग्रह करता है
  rationale: यह क्रिया प्रोत्साहित करने और दृढ़तापूर्वक उकसाने का भाव रखती है; संदर्भ में ‘आग्रह करता है’ स्वाभाविक और गरिमापूर्ण है।
- source_word: πιστεύοντας ἐξ ὅλης τῆς καρδίας ἐπ᾽ αὐτῷ
  choice: जो पूरे हृदय से उस पर विश्वास करते हैं
  rationale: ग्रीक कृदंत ἡμᾶς का वर्णन करता है; ἐπ᾽ αὐτῷ का व्यक्ति पर भरोसा रखने का भाव ‘उस पर विश्वास’ से सुरक्षित रहता है।
- source_word: ἀργοὺς μηδὲ παρειμένους
  choice: न तो आलसी हों, न ढीले
  rationale: ἀργός निष्क्रिय या आलसी होने को और παρειμένος शिथिल, ढीला या उत्साहहीन होने को व्यक्त करता है; दोनों का भेद संक्षिप्त, सहज हिन्दी में बनाए रखा गया है।
- source_word: ἐπὶ πᾶν ἔργον ἀγαθόν
  choice: हर भले काम में
  rationale: πᾶν की व्यापकता ‘हर’ से व्यक्त होती है और ἐπί यहाँ भले काम के संबंध या क्षेत्र को सूचित करता है।
theological_decisions:
- issue: ἐπ᾽ αὐτῷ में विश्वास का लक्ष्य
  choice: उस पर विश्वास करते हैं
  alternative: उसमें विश्वास करते हैं
  rationale: हिन्दी में किसी व्यक्ति पर भरोसा या विश्वास रखने के लिए ‘उस पर विश्वास’ अधिक स्वाभाविक है और मूल के व्यक्तिगत भरोसे के भाव को बिना अतिरिक्त व्याख्या के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य में मूल यूनानी के निषेधात्मक युग्म और ‘हर भले काम’ की व्यापकता संरक्षित है।
