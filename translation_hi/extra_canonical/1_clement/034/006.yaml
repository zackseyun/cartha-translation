reference: 1 Clement 34:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: λέγει γὰρ ἡ γραφή· Μύριαι μυριάδες παρειστήκεισαν αὐτῷ, καὶ χίλιαι χιλιάδες ἐλειτούργουν αὐτῷ, καὶ ἐκέκραγον· Ἅγιος, ἅγιος, ἅγιος κύριος σαβαώθ, πλήρης πᾶσα ἡ κτίσις τῆς δόξης αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/006.yaml
  text: For the Scripture says, “Myriads of myriads stood by him, and thousands of thousands ministered to him,” and they cried out, “Holy, holy, holy is the Lord Sabaoth; all creation is full of his glory.”
translation:
  language: hi
  text: क्योंकि पवित्रशास्त्र कहता है, “दसियों हज़ारों के दसियों हज़ार उसके पास खड़े थे और हज़ारों के हज़ार उसकी सेवा करते थे,” और वे पुकार रहे थे, “पवित्र, पवित्र, पवित्र है प्रभु सबाओत[a]; सारी सृष्टि उसकी महिमा से भरी हुई है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सबाओत’ हिब्रानी मूल की उपाधि है, जिसका अर्थ ‘सेनाओं के प्रभु’ है।
    reason: लिप्यंतरित दिव्य उपाधि का अर्थ आधुनिक हिन्दी पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: Μύριαι μυριάδες
  choice: दस हज़ारों के दस हज़ार
  rationale: μύριαι का मूल संख्यात्मक अर्थ ‘दस हज़ार’ है; दोहराव असंख्य विशाल समूह का बोध कराता है। यह अभिव्यक्ति मूल की गणनात्मक भव्यता को बनाए रखती है।
- source_word: παρειστήκεισαν αὐτῷ
  choice: उसके सामने खड़े थे
  rationale: क्रिया का अर्थ पास या सम्मुख उपस्थित खड़े होना है; राजकीय स्वर्गीय सभा के संदर्भ में ‘सामने’ स्वाभाविक और सटीक है।
- source_word: ἐλειτούργουν αὐτῷ
  choice: उसकी सेवा करते थे
  rationale: λειτουργέω यहाँ किसी उच्च अधिकारी या परमेश्वर की औपचारिक सेवा करने को व्यक्त करता है; ‘सेवा करते थे’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: κύριος σαβαώθ
  choice: प्रभु सबाओत
  rationale: यूनानी पाठ ने हिब्रानी उपाधि को अनूदित करने के बजाय σαβαώθ के रूप में लिप्यंतरित किया है; हिन्दी में भी इसे बनाए रखा गया और अर्थ पादटिप्पणी में दिया गया है।
- source_word: πᾶσα ἡ κτίσις
  choice: सारी सृष्टि
  rationale: κτίσις का अर्थ समस्त रची हुई सृष्टि है; इसे ‘पृथ्वी’ तक सीमित नहीं किया गया।
theological_decisions:
- issue: ‘सबाओत’ का अनुवाद या लिप्यंतरण
  choice: मुख्य पाठ में ‘सबाओत’ बनाए रखकर पादटिप्पणी में अर्थ दिया गया।
  alternative: ‘सेनाओं का प्रभु’
  rationale: मूल यूनानी स्वयं हिब्रानी शब्द का लिप्यंतरण करता है। उसे मुख्य पाठ में बनाए रखना स्रोत की रूपरेखा को सुरक्षित रखता है, जबकि पादटिप्पणी उसका अर्थ स्पष्ट करती है।
- issue: κτίσις का दायरा
  choice: ‘सारी सृष्टि’
  alternative: ‘सारी पृथ्वी’
  rationale: उद्धरण यशायाह 6 की भाषा की याद दिलाता है, पर उपलब्ध यूनानी पाठ स्पष्ट रूप से κτίσις कहता है; इसलिए संभावित बाइबलीय समानांतर के आधार पर इसे ‘पृथ्वी’ नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। उद्धरण की आवृत्तिपूर्ण भव्यता—‘दस हज़ारों के दस हज़ार’, ‘हज़ारों के हज़ार’ और ‘पवित्र’ का तीन बार उच्चारण—जानबूझकर सुरक्षित रखी गई है।
