  text: λέγει γάρ· Ὀφθαλμὸς οὐκ εἶδεν καὶ οὖς οὐκ ἤκουσεν καὶ ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη, ὅσα ἡτοίμασεν τοῖς ὑπομένουσιν αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/008.yaml
  text: For he says[a], “Eye has not seen, and ear has not heard, and it has not entered into the heart of man, the things that he prepared for those who wait for him.”
translation:
  language: hi
  text: क्योंकि वह कहता है, “न आँख ने देखा, न कान ने सुना, और न मनुष्य के हृदय में वे बातें आईं[a] जो उसने उन लोगों के लिए तैयार की हैं जो धीरज से उसकी प्रतीक्षा करते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मनुष्य के हृदय पर नहीं चढ़ीं।” इसका अर्थ है, “मनुष्य के मन में नहीं आईं।”
    reason: मूल यूनानी में सुरक्षित इब्रानी मुहावरे का शाब्दिक बिंब दिखाने और मुख्य पाठ के स्वाभाविक अर्थ की पुष्टि करने के लिए।
lexical_decisions:
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  choice: न मनुष्य के हृदय में यह बात आई
  rationale: यह एक इब्रानी ढंग की अभिव्यक्ति है, जिसका स्वाभाविक अर्थ है कि कोई बात मन में नहीं आई या उसकी कल्पना नहीं हुई। हिंदी में ‘हृदय में यह बात आई’ मूल बिंब को रखते हुए अर्थ स्पष्ट करता है।
- source_word: ὅσα
  choice: क्या-क्या
  rationale: नपुंसकलिंग बहुवचन संबंधवाचक रूप तैयार की गई समस्त बातों या वस्तुओं की व्यापकता व्यक्त करता है; ‘क्या-क्या’ हिंदी में इस बहुलता और आश्चर्य को स्वाभाविक रूप से सामने लाता है।
- source_word: τοῖς ὑπομένουσιν αὐτόν
  choice: जो धीरज से उसकी बाट जोहते हैं
  rationale: ὑπομένω यहाँ स्थिरता, धैर्य और प्रतीक्षा—इन अर्थों को समेट सकता है। ‘धीरज से ... बाट जोहते हैं’ केवल निष्क्रिय प्रतीक्षा की अपेक्षा दृढ़ प्रतीक्षा को व्यक्त करता है।
theological_decisions:
- issue: λέγει में निहित कर्ता
  choice: वह कहता है
  alternative: पवित्रशास्त्र कहता है / परमेश्वर कहता है
  rationale: यूनानी पाठ में कर्ता स्पष्ट रूप से नामित नहीं है। सर्वनामात्मक अनुवाद मूल की अस्पष्टता बनाए रखता है और अनावश्यक रूप से यह तय नहीं करता कि वक्ता परमेश्वर है या उद्धृत शास्त्र।
- issue: ἡτοίμασεν का काल और कर्ता
  choice: उसने ... तैयार किया है
  alternative: उसने ... तैयार किया था
  rationale: यूनानी एओरिस्ट पूर्ण किए गए कार्य को बताता है; हिंदी का पूर्ण पक्ष यहाँ वर्तमान प्रासंगिकता सहित तैयारी की पूर्णता को स्वाभाविक रूप से व्यक्त करता है, जबकि कर्ता को मूल की तरह सर्वनाम से ही रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, श्रवण-सुगम शैली अपनाई गई है। समानांतर नकारात्मक वाक्य-विन्यास को उद्धरण की काव्यात्मक लय के लिए बनाए रखा गया है; ‘बाट जोहना’ सामान्यतः समझ में आने वाली किंतु गरिमापूर्ण अभिव्यक्ति है।
