  text: Therefore we must be eager for doing good[a], for from him are all things.
translation:
  language: hi
  text: इसलिए हमें भलाई करने के लिए तत्पर रहना चाहिए, क्योंकि सब कुछ उसी से है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεῖν ... ἐστὶ
  choice: हमें ... रहना चाहिए
  rationale: यूनानी पदबंध आवश्यकता या कर्तव्य व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक और गरिमापूर्ण रूप है।
- source_word: προθύμους
  choice: तत्पर
  rationale: यह उत्सुकता के साथ तैयार और इच्छुक होने का भाव व्यक्त करता है।
- source_word: εἰς ἀγαθοποιΐαν
  choice: भलाई करने के लिए
  rationale: क्रियात्मक संज्ञा ἀγαθοποιΐα का अर्थ अच्छे काम करना है; ‘के लिए’ εἰς द्वारा व्यक्त दिशा या उद्देश्य को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐξ αὐτοῦ
  choice: उसी से
  rationale: ἐκ स्रोत को दर्शाता है और αὐτοῦ पुल्लिंग एकवचन सर्वनाम है; ‘उसी से’ पूर्वप्रसंग के व्यक्ति की ओर संकेत को बनाए रखता है।
- source_word: τὰ πάντα
  choice: सब कुछ
  rationale: यह यूनानी के व्यापक, समावेशी अर्थ को संक्षिप्त और सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: सब वस्तुओं का स्रोत
  choice: सब कुछ उसी से है
  alternative: सभी वस्तुएँ उसी की ओर से हैं
  rationale: ‘उसी से’ ἐξ αὐτοῦ के स्रोत-संबंधी अर्थ को सीधे सुरक्षित रखता है और उसके आशय को कारण, सृष्टि या प्रदत्त वरदान जैसे किसी एक धर्मवैज्ञानिक अर्थ तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली; मूल यूनानी की कर्तव्यसूचकता, तत्परता और स्रोत-संबंधी कथन को संक्षेप में बनाए रखा गया है।
