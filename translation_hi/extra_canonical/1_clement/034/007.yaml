source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἡμεῖς οὖν ἐν ὁμονοίᾳ ἐπὶ τὸ αὐτὸ συναχθέντες τῇ συνειδήσει, ὡς ἐξ ἑνὸς στόματος βοήσωμεν πρὸς αὐτὸν ἐκτενῶς εἰς τὸ μετόχους ἡμᾶς γενέσθαι τῶν μεγάλων καὶ ἐνδόξων ἐπαγγελιῶν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/007.yaml
  text: So then[a], let us also, having been gathered together in concord with one mind, cry out to him earnestly as from one mouth, so that we may become sharers in his great and glorious promises.
translation:
  language: hi
  text: इसलिए हम भी, एकमत होकर एकत्रित हुए हैं, एकचित्त से मानो एक ही मुँह से उसकी ओर लगनपूर्वक पुकारें, ताकि हम उसकी महान और महिमामय प्रतिज्ञाओं के सहभागी बनें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ὁμονοίᾳ
  choice: एक मन होकर
  rationale: यह सहमति और पारस्परिक एकता दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ τὸ αὐτὸ συναχθέντες
  choice: एक साथ इकट्ठे हों
  rationale: ἐπὶ τὸ αὐτό यहाँ साथ होने का मुहावरा है; यह अनावश्यक स्थानगत अर्थ जोड़े बिना सामूहिक एकत्रीकरण व्यक्त करता है।
- source_word: τῇ συνειδήσει
  choice: पूरे मन से
  rationale: यहाँ συνείδησις केवल नैतिक ‘विवेक’ नहीं, साझा आंतरिक अभिप्राय या चेतना का बोध देता है; हिन्दी में इसे पुकार की एकनिष्ठता के रूप में सहज रखा गया है।
- source_word: βοήσωμεν
  choice: पुकारें
  rationale: क्रिया ऊँची और आग्रहपूर्ण पुकार को दर्शाती है; ‘पुकारें’ प्रार्थनापरक संदर्भ में स्वाभाविक है।
- source_word: ἐκτενῶς
  choice: पूरे मन से
  rationale: शब्द उत्सुकता, लगन और गंभीर आग्रह व्यक्त करता है; ‘पूरे मन से’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: μετόχους
  choice: सहभागी
  rationale: यह प्रतिज्ञाओं में भाग पाने या हिस्सा रखने के अर्थ को dignified और सटीक रूप से व्यक्त करता है।
- source_word: ἐπαγγελιῶν
  choice: प्रतिज्ञाओं
  rationale: धार्मिक-साहित्यिक संदर्भ में यह स्थापित, स्पष्ट और स्रोत के अनुरूप शब्द है।
theological_decisions:
- issue: प्रतिज्ञाओं के सहभागी बनने के लिए सामूहिक पुकार का प्रयोजन
  choice: ‘ताकि हम ... सहभागी बनें’ के रूप में प्रयोजनवाचक संबंध बनाए रखा
  alternative: इसे परिणाम या निश्चित आश्वासन के रूप में प्रस्तुत करना
  rationale: εἰς τὸ + infinitive प्रयोजन/लक्ष्य व्यक्त करता है; पाठ यह नहीं बताता कि पुकार स्वयं सहभागिता अर्जित करती है या उसका निश्चित कारण है।
- issue: αὐτόν का संदर्भ
  choice: ‘उसकी ओर’ और ‘उसकी ... प्रतिज्ञाओं’ में सर्वनाम बनाए रखा
  alternative: स्पष्ट रूप से ‘परमेश्वर’ जोड़ना
  rationale: इस पद में नाम नहीं दिया गया है; सर्वनाम बनाए रखने से निकटवर्ती संदर्भ और मूल की अभिव्यक्ति सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सामूहिक उपासना के योग्य गरिमामय किंतु सरल शैली। ὁμόνοια और συνείδησις के निकटवर्ती एकता-संबंधी भाव को हिन्दी में बोझिल दोहराव से बचाते हुए ‘एक मन होकर’ तथा ‘पूरे मन से’ में बाँटा गया है।
