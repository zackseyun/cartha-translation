source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ καύχημα ἡμῶν καὶ ἡ παρρησία ἔστω ἐν αὐτῷ· ὑποτασσώμεθα τῷ θελήματι αὐτοῦ· κατανοήσωμεν τὸ πᾶν πλῆθος τῶν ἀγγέλων αὐτοῦ, πῶς τῷ θελήματι αὐτοῦ λειτουργοῦσιν παρεστῶτες.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/005.yaml
  text: Let our boasting and our boldness be in him. Let us submit ourselves to his will. Let us consider the whole multitude of his angels, how they stand by and minister to his will.
translation:
  language: hi
  text: हमारा गौरव और हमारी निर्भीकता उसी में हो। हम उसकी इच्छा के अधीन हों। आओ, हम उसके स्वर्गदूतों के समस्त समूह पर विचार करें कि वे उसके सामने उपस्थित रहकर किस प्रकार उसकी इच्छा के अनुसार सेवा करते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καύχημα
  choice: गर्व
  rationale: यह शब्द गर्व या गौरव के आधार को दर्शाता है; संदर्भ में ‘उसी में गर्व’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: παρρησία
  choice: साहस
  rationale: यहाँ परमेश्वर में आधारित निर्भीकता या निडर भरोसे का भाव है; ‘साहस’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: ὑποτασσώμεθα
  choice: हम अपने आपको ... के अधीन कर दें
  rationale: मध्यवाच्य आग्रह को स्पष्ट करते हुए स्वेच्छापूर्वक अधीन होने का भाव सुरक्षित रखा गया है।
- source_word: κατανοήσωμεν
  choice: हम ... पर ध्यान दें
  rationale: सिर्फ देखने के बजाय मन लगाकर विचार करने या गौर करने का अर्थ व्यक्त करता है।
- source_word: λειτουργοῦσιν
  choice: सेवा करते हैं
  rationale: स्वर्गदूतों द्वारा सम्पन्न सेवा का सामान्य धार्मिक अर्थ देता है, बिना अनावश्यक रूप से किसी विशिष्ट अनुष्ठानिक अर्थ को आरोपित किए।
- source_word: παρεστῶτες
  choice: सामने खड़े होकर
  rationale: परमेश्वर की उपस्थिति में तत्पर खड़े रहने का कृदन्तीय भाव बनाए रखता है।
theological_decisions:
- issue: स्वर्गदूत किसकी सेवा करते हैं
  choice: उसकी इच्छा की सेवा करते हैं
  alternative: उसकी इच्छा के अनुसार सेवा करते हैं
  rationale: यूनानी τῷ θελήματι दत्तिव को निकटता से रखा गया है। यह अभिव्यक्ति असामान्य होते हुए भी मूल पाठ की वह धारणा बचाती है कि उनकी सेवा पूरी तरह परमेश्वर की इच्छा की ओर निर्देशित है।
- issue: ‘उसी में’ का संदर्भ
  choice: सर्वनाम को यथावत रखा
  alternative: ‘परमेश्वर में’ स्पष्ट करना
  rationale: मूल में αὐτῷ सर्वनाम है और निकटवर्ती प्रसंग उसका संदर्भ देता है; नाम जोड़कर मूल से अधिक स्पष्टता आरोपित नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामूहिक उपदेशात्मक स्वर रखा गया है। ‘हो’, ‘कर दें’ और ‘ध्यान दें’ यूनानी आग्रहसूचक रूपों को स्वाभाविक हिन्दी में व्यक्त करते हैं।
