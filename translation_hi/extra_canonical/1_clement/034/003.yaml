  text: προλέγει γὰρ ἡμῖν· Ἰδοὺ ὁ κύριος, καὶ ὁ μισθὸς αὐτοῦ πρὸ προσώπου αὐτοῦ, ἀποδοῦναι ἑκάστῳ κατὰ τὸ ἔργον αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/003.yaml
  text: For he says beforehand to us[a], “Behold, the Lord, and his reward is before him, to repay each one according to his work.”
translation:
  language: hi
  text: क्योंकि वह हमें पहले से यह कहता है, “देखो, प्रभु; और उसका प्रतिफल उसके सामने है, हर एक को उसके काम के अनुसार प्रतिदान देने के लिए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προλέγει
  choice: पहले ही कहता है
  rationale: क्रिया का मूल अर्थ ‘पहले से कहना’ है। इससे संदर्भ में निहित चेतावनी बनी रहती है, पर ‘चेतावनी देता है’ जैसा अतिरिक्त अर्थ स्पष्ट रूप से नहीं जोड़ा जाता।
- source_word: Ἰδοὺ ὁ κύριος
  choice: देखो, प्रभु आ रहा है
  rationale: यूनानी वाक्यांश में स्पष्ट क्रिया नहीं है। उद्धृत भविष्यसूचक संदर्भ में हिन्दी का स्वाभाविक वाक्य बनाने के लिए ‘आ रहा है’ की पूर्ति की गई है; केवल ‘देखो, प्रभु’ हिन्दी में अत्यंत खंडित लगता।
- source_word: ὁ μισθὸς αὐτοῦ
  choice: उसका प्रतिफल
  rationale: μισθός यहाँ उस परिणाम या पारिश्रमिक को दर्शाता है जो प्रभु प्रत्येक को देगा; ‘प्रतिफल’ पुरस्कार और दंड, दोनों की संभावना को खुला रखता है।
- source_word: πρὸ προσώπου αὐτοῦ
  choice: उसके सामने
  rationale: शाब्दिक ‘उसके मुख के सामने’ की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक है और उपस्थिति/साथ होने का भाव सुरक्षित रखता है।
- source_word: ἀποδοῦναι
  choice: बदला दे
  rationale: यह ‘लौटाकर देना/उचित फल देना’ का भाव व्यक्त करता है और अगले वाक्यांश ‘काम के अनुसार’ से सहजता से जुड़ता है।
- source_word: ἑκάστῳ κατὰ τὸ ἔργον αὐτοῦ
  choice: हर एक को उसके काम के अनुसार
  rationale: एकवचन ἔργον को ‘काम’ के रूप में रखा गया है और व्यक्तिगत प्रतिफल का बल सुरक्षित है।
theological_decisions:
- issue: क्या μισθός को केवल सकारात्मक पुरस्कार माना जाए
  choice: प्रतिफल
  alternative: इनाम
  rationale: संदर्भ प्रत्येक व्यक्ति को उसके काम के अनुसार दिए जाने की बात करता है; ‘इनाम’ केवल सकारात्मक अर्थ को अनावश्यक रूप से निश्चित कर देता।
- issue: Ἰδοὺ ὁ κύριος में निहित क्रिया
  choice: प्रभु आ रहा है
  alternative: प्रभु उपस्थित है / देखो, प्रभु
  rationale: भविष्यसूचक उद्धरण का आगमन-संबंधी आशय और हिन्दी की स्वाभाविकता देखते हुए ‘आ रहा है’ चुना गया, जबकि यूनानी में क्रिया अध्याहृत है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य की भविष्यसूचक और न्याय-संबंधी गंभीरता बनाए रखी गई है।
