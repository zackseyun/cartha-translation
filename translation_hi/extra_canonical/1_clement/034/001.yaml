  text: The good worker receives with boldness the bread of his labor, but the sluggish and negligent man cannot look his employer in the eye.
translation:
  language: hi
  text: अच्छा कामगार अपने श्रम की रोटी निर्भयता से पाता है, पर सुस्त और लापरवाह व्यक्ति अपने नियोक्ता की आँखों में आँखें डालकर नहीं देख सकता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθὸς ἐργάτης
  choice: अच्छा काम करनेवाला
  rationale: यह सामान्य और सहज हिन्दी है तथा नैतिक रूप से अच्छे और परिश्रमी कामगार—दोनों निहित भावों को बिना अधिक व्याख्या के खुला रखती है।
- source_word: μετὰ παρρησίας
  choice: निडर होकर
  rationale: παρρησία यहाँ आत्मविश्वास, निर्भीकता या खुलेपन से अपना प्रतिफल लेने का भाव देती है; ‘निडर होकर’ प्रसंग में स्वाभाविक है।
- source_word: τὸν ἄρτον τοῦ ἔργου αὐτοῦ
  choice: अपने काम की रोटी
  rationale: यूनानी रूपक को बनाए रखता है और हिन्दी में आजीविका अथवा मेहनत से प्राप्त भोजन का स्वाभाविक बोध कराता है।
- source_word: νωθρὸς καὶ παρειμένος
  choice: सुस्त और लापरवाह
  rationale: 'दोनों विशेषणों का भेद बनाए रखता है: पहला ढिलाई या आलस्य और दूसरा शिथिलता अथवा उपेक्षा व्यक्त करता है।'
- source_word: ἐργοδότῃ
  choice: काम देनेवाले
  rationale: शाब्दिक अर्थ ‘काम देनेवाला’ है; यह आधुनिक ‘नियोक्ता’ की अपेक्षा व्यापक और सामान्य है।
- source_word: οὐκ ἀντοφθαλμεῖ
  choice: आँख नहीं मिला सकता
  rationale: मुहावरे का सीधा भाव आमने-सामने दृष्टि मिलाने या निर्भीक होकर सामना करने में असमर्थ होना है; हिन्दी मुहावरा इसे सहजता से व्यक्त करता है।
