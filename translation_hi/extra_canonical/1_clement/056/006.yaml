id: 1CLEM.56.6
reference: 1 Clement 56:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: Καὶ πάλιν λέγει· Μακάριος ἄνθρωπος, ὃν ἤλεγξεν ὁ κύριος· νουθέτημα δὲ παντοκράτορος μὴ ἀπαναίνου· αὐτὸς γὰρ ἀλγεῖν ποιεῖ, καὶ πάλιν ἀποκαθίστησιν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/006.yaml
  text: 'And again it says:


    “Blessed is the man whom the Lord reproves;

    and do not reject the admonition of the Almighty.

    For he causes pain[a], and then restores;'
translation:
  language: hi
  text: 'और फिर वह कहता है:


    “धन्य है वह मनुष्य जिसे प्रभु ताड़ना देता है;[a]


    सर्वशक्तिमान के अनुशासन को मत ठुकरा।


    क्योंकि वही पीड़ा देता है और फिर बहाल करता है;”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसे प्रभु ने ताड़ना दी है।”
    reason: यूनानी क्रिया एओरिस्ट काल में है; इस धन्य-वचन में वह सामान्य सत्य व्यक्त कर सकती है, पर उसका औपचारिक भूतकालिक अर्थ भी सम्भव है।
lexical_decisions:
- source_word: ἤλεγξεν
  choice: सुधारता है
  rationale: क्रिया रूप भूतकालिक एओरिस्ट है, पर इस धन्य-वचन में सामान्य सत्य व्यक्त करता है; इसलिए स्वाभाविक हिन्दी वर्तमान काल चुना गया। ‘सुधारता’ में दोष दिखाने और सुधारने, दोनों का भाव बना रहता है।
- source_word: νουθέτημα
  choice: चेतावनी
  rationale: यह सुधार के उद्देश्य से दी गई समझाइश या चेतावनी है। ‘चेतावनी’ आधुनिक पाठक के लिए सहज है और संदर्भ की गंभीरता बनाए रखती है।
- source_word: παντοκράτορος
  choice: सर्वशक्तिमान
  rationale: यह यूनानी उपाधि के व्यापक अर्थ—सब पर सामर्थ्य और प्रभुत्व रखने वाला—का प्रचलित और गरिमापूर्ण हिन्दी रूप है।
- source_word: ἀλγεῖν ποιεῖ
  choice: पीड़ा देता है
  rationale: शाब्दिक अर्थ ‘पीड़ा अनुभव कराता है’ है। चुना गया रूप संक्षिप्त, स्वाभाविक और कर्ता की सक्रिय भूमिका के प्रति निष्ठावान है।
- source_word: ἀποκαθίστησιν
  choice: बहाल करता है
  rationale: क्रिया किसी को फिर से पूर्व या ठीक दशा में लाने का अर्थ देती है। ‘बहाल करता है’ इस पुनर्स्थापन के भाव को बिना अनावश्यक विस्तार के व्यक्त करता है।
theological_decisions:
- issue: ἤλεγξεν का कालगत अर्थ
  choice: 'सामान्य सत्य के रूप में वर्तमान काल: ‘सुधारता है’'
  alternative: 'विशिष्ट पूर्ण घटना के रूप में: ‘सुधारा है’'
  rationale: धन्य-वचन की लोकोक्तिपरक रचना और आगे की वर्तमानकालिक क्रियाएँ सामान्य, बार-बार लागू होने वाले सत्य की ओर संकेत करती हैं; फिर भी एओरिस्ट का औपचारिक भूतकालिक रूप पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: ईश्वर द्वारा पीड़ा और पुनर्स्थापन
  choice: दोनों कार्यों का कर्ता स्पष्ट रूप से वही रखा गया है
  alternative: पीड़ा को केवल अनुमति देना या पुनर्स्थापन को अस्पष्ट करना
  rationale: मूल यूनानी αὐτός और सक्रिय ποιεῖ ईश्वर की प्रत्यक्ष कर्तृता पर बल देते हैं। पाठ की धार्मिक तनातनी को नरम करके किसी विशेष सिद्धान्त के अनुसार नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सरल शैली। एकवचन सम्बोधन के कारण ‘मत ठुकरा’ रखा गया है। उद्धरण का अन्त अर्धविराम पर है, क्योंकि उपलब्ध पद आगे जारी रहने वाले वाक्य का अंश है।
