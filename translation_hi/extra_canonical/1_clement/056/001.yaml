id: 1CLEM.56.1
reference: 1 Clement 56:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: Καὶ ἡμεῖς οὖν ἐντύχωμεν περὶ τῶν ἐν τινι παραπτώματι ὑπαρχόντων, ὅπως δοθῇ αὐτοῖς ἐπιείκεια καὶ ταπεινοφροσύνη εἰς τὸ εἶξαι αὐτοὺς μὴ ἡμῖν, ἀλλὰ τῷ θελήματι τοῦ θεοῦ· οὕτως γὰρ ἔσται αὐτοῖς ἔγκαρπος καὶ τελεία ἡ πρὸς τὸν θεὸν καὶ τοὺς ἁγίους μετ’ οἰκτιρμῶν μνεία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/001.yaml
  text: Therefore let us also intercede concerning those who are in some transgression, so that gentleness and humility may be given to them, that they may yield not to us, but to the will of God. For in this way their compassionate remembrance before God and the saints will be fruitful and complete.
translation:
  language: hi
  text: इसलिए हम भी उन लोगों के लिए विनती करें जो किसी अपराध में हैं, ताकि उन्हें सौम्यता और नम्रता दी जाए और वे हमारी नहीं, बल्कि परमेश्वर की इच्छा मानें। क्योंकि इस प्रकार परमेश्वर और पवित्र जनों के सामने उनका करुणापूर्ण स्मरण फलदायी और पूर्ण होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντύχωμεν
  choice: विनती करें
  rationale: यहाँ क्रिया दूसरों के पक्ष में प्रार्थनापूर्वक निवेदन करने का भाव रखती है; ‘विनती करें’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: παραπτώματι
  choice: अपराध
  rationale: यह नैतिक चूक या उल्लंघन को व्यक्त करता है; ‘अपराध’ इसके गंभीर भाव को बनाए रखता है, बिना ‘पकड़े गए’ जैसी स्रोत में अनुपस्थित धारणा जोड़े।
- source_word: ἐπιείκεια
  choice: कोमलता
  rationale: यहाँ आशय कठोरता के विपरीत सौम्य, विनम्र और मान देने वाले स्वभाव से है; ‘कोमलता’ सामान्य पाठक के लिए स्पष्ट है और निकटवर्ती ‘दीनता’ से अलग भी रहती है।
- source_word: ταπεινοφροσύνη
  choice: दीनता
  rationale: यह मन की नम्रता को दर्शाता है; ‘दीनता’ गरिमापूर्ण धार्मिक हिन्दी में इस भाव को संक्षेप में व्यक्त करती है।
- source_word: εἶξαι
  choice: आगे झुकें
  rationale: क्रिया का अर्थ मान जाना, अधीन होना या रास्ता देना है। ‘आगे झुकें’ हमारे सामने और परमेश्वर की इच्छा के सामने होने वाले विरोध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τοὺς ἁγίους
  choice: पवित्र जनों
  rationale: बहुवचन विशेषण का व्यक्तिवाचक प्रयोग है। ‘पवित्र जन’ यह स्पष्ट करता है कि संकेत व्यक्तियों की ओर है, जबकि उनकी सटीक पहचान को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: μνεία
  choice: स्मरण
  rationale: यह याद किए जाने या उल्लेख किए जाने का भाव रखता है। ‘स्मरण’ स्रोत की संक्षिप्तता और संभावित प्रार्थनात्मक संदर्भ दोनों को खुला रखता है।
theological_decisions:
- issue: ‘पवित्र जनों’ की पहचान
  choice: पहचान को अनिर्धारित रखा गया
  alternative: इसे विशेष रूप से स्वर्गवासी संतों, विश्वासियों या कलीसिया के अगुओं के रूप में स्पष्ट करना
  rationale: यूनानी पाठ केवल τοὺς ἁγίους कहता है; किसी एक विशिष्ट समूह की पहचान थोपना स्रोत से आगे जाना होगा।
- issue: ‘परमेश्वर की इच्छा के आगे झुकना’
  choice: अधीनता का लक्ष्य परमेश्वर की इच्छा रखा गया
  alternative: समुदाय या उसके अगुओं के अधिकार के अधीन होना
  rationale: पाठ स्पष्ट विरोध करता है—‘हमारे आगे नहीं, बल्कि परमेश्वर की इच्छा के आगे’; अनुवाद ने इसी धार्मिक तनाव को सुरक्षित रखा है।
- issue: करुणा और स्मरण का संबंध
  choice: ‘करुणापूर्ण स्मरण’
  alternative: ‘करुणा के साथ उनका स्मरण फलदायी और पूर्ण होगा’
  rationale: यूनानी शब्द-क्रम और वाक्य-संरचना μετ’ οἰκτιρμῶν को μνεία, अर्थात स्मरण की विशेषता, के रूप में पढ़ने का समर्थन करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण रखी गई है। वाक्य की प्रार्थनात्मक और सामुदायिक ध्वनि बनाए रखते हुए अनावश्यक संप्रदायगत शब्दावली से बचा गया है। ‘करुणापूर्ण स्मरण’ कुछ साहित्यिक है, पर मूल यूनानी में करुणा का संबंध ‘स्मरण’ से बनाए रखने के लिए इसे चुना गया है।
