source:
  edition: Funk 1901 (normalized OCR)
  text: εἶτα γνώσῃ, ὅτι εἰρηνεύσει σου ὁ οἶκος, ἡ δὲ δίαιτα τῆς σκηνῆς σου οὐ μὴ ἁμάρτῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/013.yaml
  text: 'Then you will know that your house will be at peace,

    and you will inspect your dwelling and not miss anything[a].'
translation:
  language: hi
  text: 'तब तू जान लेगा कि तेरे घर में शांति होगी,


    और तू अपने निवास का निरीक्षण करेगा और कुछ भी नहीं चूकेगा।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और तेरे तंबू का निवास निश्चय ही विफल नहीं होगा।” यूनानी में दूसरा उपवाक्य संक्षिप्त और कुछ हद तक अस्पष्ट है। प्रसंग में इसका अर्थ निवास की जाँच करने पर किसी चीज़ को न चूकना या कोई कमी न पाना हो सकता है।
    reason: δίαιτα ‘निवास/आवास’ और οὐ μὴ ἁμάρτῃ के व्यापक ‘न चूकना/विफल न होना’ वाले भाव को सुरक्षित रखते हुए मुख्य पाठ के संदर्भगत अर्थ को स्पष्ट करता है।
lexical_decisions:
- source_word: εἰρηνεύσει
  choice: शान्ति में है
  rationale: क्रिया का अर्थ शान्त और सुरक्षित अवस्था में होना है; भविष्य का भाव ‘जान लेगा’ के अधीन हिन्दी में स्वाभाविक रूप से व्यक्त है।
- source_word: δίαιτα τῆς σκηνῆς σου
  choice: अपने निवास
  rationale: δίαιτα यहाँ रहने की जगह/निवास को दर्शाता है और σκηνή के साथ तम्बू-सदृश निवास का चित्र देता है; संक्षिप्त हिन्दी ‘निवास’ समानांतर अर्थ को बनाए रखती है।
- source_word: οὐ μὴ ἁμάρτῃ
  choice: कुछ भी न पाएगा जो अपनी जगह पर न हो
  rationale: ἁμαρτάνω का मूल भाव चूकना या लक्ष्य से हटना है। अय्यूब 5:24 के प्रसंग में यह निवास की जाँच करते समय किसी कमी या गड़बड़ी के न मिलने का मुहावरेदार आशय देता है।
