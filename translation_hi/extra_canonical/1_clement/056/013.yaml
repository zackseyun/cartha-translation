  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; उद्धरण की काव्यात्मक समानांतरता के लिए ‘घर’ और ‘निवास’ रखा गया है। एकवचन अनौपचारिक ‘तू/तेरा’ मूल यूनानी के एकवचन संबोधन को स्पष्ट करता है और ज्ञान-साहित्य की पारंपरिक काव्य-ध्वनि बनाए रखता है।
