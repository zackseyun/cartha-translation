source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἀπὸ μάστιγος γλώσσης σε κρύψει, καὶ οὐ μὴ φοβηθήσῃ κακῶν ἐπερχομένων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/010.yaml
  text: And he will hide you from the scourge of the tongue[a], and you will certainly not fear evils when they come.
translation:
  language: hi
  text: और वह जीभ के कोड़े से तुझे छिपाएगा, और आने वाली विपत्तियों से तू तनिक भी नहीं डरेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάστιγος γλώσσης
  choice: जीभ के कोड़े
  rationale: यूनानी रूपक को बनाए रखता है; इसका आशय वाणी से पहुँचने वाली चोट या निंदा है, पर मुख्य पाठ में उसे व्याख्यात्मक रूप से सीमित नहीं किया गया।
- source_word: κρύψει
  choice: छिपाएगा
  rationale: मूल क्रिया के सीधे अर्थ और संरक्षण के चित्र, दोनों को सुरक्षित रखता है।
- source_word: κακῶν ἐπερχομένων
  choice: आने वाली विपत्तियों
  rationale: वर्तमान कृदंत ἐπερχομένων के निकट रहते हुए स्वाभाविक हिन्दी देता है; κακά के प्रसंगगत अर्थ को अमूर्त 'बुराइयों' के बजाय संकटकारी घटनाओं के रूप में व्यक्त करता है।
- source_word: οὐ μὴ φοβηθήσῃ
  choice: तनिक भी नहीं डरेगा
  rationale: οὐ μή की प्रबल निषेधात्मक शक्ति को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: कर्ता का लिंग और संदर्भ
  choice: वह
  alternative: परमेश्वर
  rationale: यूनानी पाठ में कर्ता पूर्वप्रसंग से समझा जाता है; यहाँ स्पष्ट रूप से 'परमेश्वर' जोड़ना मूल की अंतर्निहितता को अनावश्यक रूप से खोल देता।
- issue: κακά का अर्थ
  choice: विपत्तियाँ
  alternative: बुराइयाँ
  rationale: यहाँ आने वाली भयावह घटनाओं या संकटों का अर्थ अधिक स्वाभाविक है, जबकि नैतिक बुराई का अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक और गरिमापूर्ण शैली। आरंभिक καὶ को 'और' से तथा दोनों खंडों की समांतर संरचना को सुरक्षित रखा गया है। एकवचन संबोधन के लिए 'तुझे/तू' मूल के निकट और उद्धरण की काव्यात्मक शैली के अनुरूप है।
