  text: ἐλεύσῃ δὲ ἐν τάφῳ ὥσπερ σῖτος ὥριμος κατὰ καιρὸν θεριζόμενος, ἢ ὥσπερ θημωνιὰ ἅλωνος καθ’ ὥραν συγκομισθεῖσα.
