base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/015.yaml
  text: 'And you will come to the grave like ripe grain harvested in its season,

    or like a heap from the threshing floor gathered in at the proper time[a].'
translation:
  language: hi
  text: 'और तुम कब्र तक ऐसे पहुँचोगे जैसे पका हुआ अनाज अपने समय पर काटा जाता है,


    या जैसे खलिहान से अनाज का ढेर ठीक समय पर इकट्ठा किया गया हो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύσῃ
  choice: तुम ... जाओगे
  rationale: इस प्रसंग में कब्र की ओर जाने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; यूनानी क्रिया के भविष्यकाल और द्वितीय पुरुष एकवचन को बनाए रखता है।
- source_word: τάφῳ
  choice: कब्र में
  rationale: मृत्यु के बाद रखे जाने के स्थान के लिए सामान्य, स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी।
- source_word: σῖτος ὥριμος
  choice: पका हुआ अनाज
  rationale: σῖτος का व्यापक अर्थ ‘अनाज’ और ὥριμος का फसल के पक जाने का भाव सुरक्षित रहता है।
- source_word: κατὰ καιρὸν θεριζόμενος
  choice: अपने समय पर काटा जाता है
  rationale: कटाई और उसके निर्धारित ऋतु-संगत समय—दोनों अर्थों को सहज हिन्दी में रखता है।
- source_word: θημωνιὰ ἅλωνος
  choice: खलिहान की उपज का ढेर
  rationale: θημωνιά के ढेर और ἅλων के खलिहान-संदर्भ को स्पष्ट करता है; केवल ‘खलिहान का ढेर’ की संभावित अस्पष्टता से बचता है।
- source_word: καθ’ ὥραν συγκομισθεῖσα
  choice: उचित समय पर इकट्ठा किया जाता है
  rationale: सही अवसर पर फसल को एकत्र करने का भाव और निष्क्रिय रूप दोनों सुरक्षित रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों कृषि-उपमाओं की समानांतर संरचना तथा उचित समय पर पूर्णता का भाव सुरक्षित है। अंग्रेज़ी परत का अनाथ उद्धरण-चिह्न वाला पूर्व-पाठभेद हिन्दी में नहीं अपनाया गया, क्योंकि उसका यूनानी स्रोत में कोई आधार नहीं है।
