translation:
  language: hi
  text: 'तुम अन्यायियों और कानूनहीनों पर हँसोगे,


    और जंगली पशुओं से बिलकुल नहीं डरोगे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδίκων
  choice: अधर्मियों
  rationale: यह बहुवचन विशेषण संज्ञा के रूप में प्रयुक्त है और अन्यायी/अधर्मी लोगों को सूचित करता है; ‘अधर्मी’ संक्षिप्त और गरिमापूर्ण है।
- source_word: ἀνόμων
  choice: व्यवस्था-विहीन लोगों
  rationale: ἄνομος का मूल भाव व्यवस्था या नियम से रहित होना है। यह चयन ἀδίκων से भेद बनाए रखता है और केवल सामान्य ‘दुष्ट’ कहकर अर्थ को समतल नहीं करता।
- source_word: καταγελάσῃ
  choice: पर हँसोगे
  rationale: क्रिया का अर्थ उपहास करना या किसी पर हँसना है। हिंदी में ‘पर हँसोगे’ सहज है और प्रसंग की विजयपूर्ण निर्भयता बनाए रखता है।
- source_word: θηρίων ἀγρίων
  choice: जंगली पशुओं
  rationale: दोनों शब्दों के संयुक्त अर्थ को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: οὐ μὴ φοβηθῇς
  choice: बिलकुल नहीं डरोगे
  rationale: οὐ μή प्रबल निषेध व्यक्त करता है; ‘बिलकुल नहीं’ उस बल को हिंदी में स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: ἀνόμων में ‘व्यवस्था’ का आशय
  choice: व्यवस्था-विहीन लोगों
  alternative: कानून तोड़ने वालों
  rationale: यूनानी शब्द यह निर्दिष्ट नहीं करता कि केवल नागरिक कानून या विशेष रूप से मूसा की व्यवस्था अभिप्रेत है। चुना हुआ रूप इस अस्पष्टता को बनाए रखता है।
- issue: καταγελάσῃ का भाव
  choice: पर हँसोगे
  alternative: उपहास करोगे
  rationale: ‘उपहास करोगे’ अधिक कठोर और जानबूझकर तिरस्कारपूर्ण लग सकता है। ‘पर हँसोगे’ मूल अर्थ को रखते हुए निर्भयता और पलटे हुए हालात की सम्भावना को खुला छोड़ता है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण काव्यात्मक पंक्ति-विन्यास। प्रबल निषेध को ‘बिलकुल नहीं’ से व्यक्त किया गया है। कोई पादटिप्पणी आवश्यक नहीं है।
