base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/002.yaml
  text: Let us accept discipline, at which no one ought to be resentful, beloved. The admonition that we give to one another is good and exceedingly beneficial, for it binds us to the will of God.
translation:
  language: hi
  text: आओ, हम अनुशासन को स्वीकार करें, जिसे लेकर किसी को खीझना नहीं चाहिए, प्रिय जनो। जो समझाइश हम एक-दूसरे को करते हैं, वह अच्छी और अत्यंत लाभकारी है, क्योंकि वह हमें परमेश्वर की इच्छा से जोड़ती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλάβωμεν παιδείαν
  choice: हम अनुशासन को स्वीकार करें
  rationale: ἀναλαμβάνω यहाँ किसी बात को ग्रहण या स्वीकार करने का भाव रखता है; παιδεία सुधारकारी शिक्षा और अनुशासन दोनों को समेटता है।
- source_word: ἀγανακτεῖν
  choice: अप्रसन्न होना
  rationale: यह क्रिया रोष, खीझ या नाराज़गी व्यक्त करती है; ‘अप्रसन्न होना’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: νουθέτησις
  choice: चेतावनी
  rationale: शब्द का आशय मन में बात बैठाकर सुधारने वाली समझाइश या चेतावनी है; प्रसंग में परस्पर सुधार का भाव बनाए रखा गया है।
- source_word: ὑπεράγαν ὠφέλιμος
  choice: अत्यंत लाभकारी
  rationale: तीव्र बल देने वाले ὑπεράγαν को ‘अत्यंत’ और ὠφέλιμος को ‘लाभकारी’ से व्यक्त किया गया है।
- source_word: κολλᾷ
  choice: जोड़े रखती है
  rationale: मूल क्रिया का शाब्दिक भाव चिपकाने या दृढ़ता से जोड़ने का है; ‘जोड़े रखती है’ हिंदी में प्राकृतिक ढंग से उस निकट और स्थायी संबंध को व्यक्त करता है।
theological_decisions:
- issue: पारस्परिक चेतावनी और परमेश्वर की इच्छा के बीच संबंध
  choice: ‘वह हमें परमेश्वर की इच्छा से जोड़े रखती है’
  alternative: ‘वह हमें परमेश्वर की इच्छा का पालन करने में लगाती है’
  rationale: मूल τῷ θελήματι के साथ κολλᾷ सीधे जुड़ाव का रूपक रखता है; इसे केवल आज्ञापालन के अर्थ में सीमित नहीं किया गया।
