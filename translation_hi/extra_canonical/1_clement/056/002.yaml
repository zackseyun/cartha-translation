  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सामुदायिक उपदेशात्मक शैली। संबोधन ἀγαπητοί को स्वाभाविक हिंदी क्रम में ‘हे प्रिय जनो’ रखा गया है।
