source:
  edition: Funk 1901 (normalized OCR)
  text: οὕτως γάρ φησιν ὁ ἅγιος λόγος· Παιδεύων ἐπαίδευσέν με ὁ κύριος, καὶ τῷ θανάτῳ οὐ παρέδωκέν με·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/003.yaml
  text: 'For thus says the holy word:


    “The Lord disciplined me severely,

    and he did not hand me over to death.”[a]'
translation:
  language: hi
  text: 'क्योंकि पवित्र वचन इस प्रकार कहता है:


    “प्रभु ने मुझे कठोरता से अनुशासित किया,


    पर उसने मुझे मृत्यु के हवाले नहीं किया।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु ने मुझे बहुत कठोरता से अनुशासित किया।”
    reason: यूनानी में एक ही मूल के कृदंत और क्रिया का प्रयोग अनुशासन की तीव्रता पर बल देता है; इसे हिन्दी में अलग-अलग स्वाभाविक तीव्रतासूचक रूपों से व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: ὁ ἅγιος λόγος
  choice: पवित्र वचन
  rationale: यह यूनानी पद का सीधा और स्वाभाविक अनुवाद है तथा उद्धृत पवित्रशास्त्रीय वचन की ओर संकेत बनाए रखता है।
- source_word: Παιδεύων ἐπαίδευσέν με
  choice: मुझे कठोर अनुशासन दिया
  rationale: सजातीय कृदंत और क्रिया की यह सेप्टुआजिन्टीय रचना अनुशासन की तीव्रता पर बल देती है; ‘कठोर’ उस बल को आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: τῷ θανάτῳ οὐ παρέδωκέν με
  choice: मुझे मृत्यु के हाथ में नहीं सौंपा
  rationale: ‘के हाथ में सौंपना’ हिन्दी में παρέδωκεν का स्वाभाविक रूपक है और मृत्यु को जिस सजीव शक्ति के रूप में प्रस्तुत किया गया है, उसे सुरक्षित रखता है।
theological_decisions:
- issue: दिव्य अनुशासन की तीव्रता और उसका उद्देश्य
  choice: ‘कठोर अनुशासन’ द्वारा तीव्रता व्यक्त की गई, पर इसे दंड या विनाश नहीं कहा गया।
  alternative: ‘निश्चय ही मुझे अनुशासित किया’
  rationale: παιδεύων ἐπαίδευσεν को केवल कथन की निश्चितता के रूप में लेने की अपेक्षा, भजन 118:18 की पृष्ठभूमि में क्रिया की तीव्रता समझना अधिक उपयुक्त है; साथ की पंक्ति अनुशासन और मृत्यु के हवाले किए जाने में भेद रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमामय किंतु सरल। काव्यात्मक उद्धरण को दो पंक्तियों में रखा गया है। ‘अनुशासन दिया’ साधारण पाठक के लिए स्वाभाविक है और παιδεύω के सुधारात्मक आशय को बनाए रखता है।
