translation:
  language: hi
  text: 'और तुम जान लोगे कि तुम्हारी संतान बहुत होगी[a],


    और तुम्हारे बच्चे खेत की बहुत-सी घास के समान होंगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारा बीज बहुत होगा।”
    reason: σπέρμα के शाब्दिक ‘बीज’ और उसके सामूहिक ‘संतान/वंशज’ अर्थ के बीच पारदर्शिता बनाए रखने के लिए; यह अंग्रेज़ी POB audit-trail footnote के अनुरूप है।
lexical_decisions:
- source_word: γνώσῃ
  choice: तुम जान लोगे
  rationale: भविष्यकालीन मध्यम रूप का स्वाभाविक हिन्दी रूप; यहाँ आश्वस्त होकर जानने का भाव संदर्भ से बना रहता है।
- source_word: σπέρμα
  choice: संतान
  rationale: शाब्दिक अर्थ ‘बीज’ है, पर वंशजों के सामूहिक अर्थ में आधुनिक हिन्दी में ‘संतान’ स्पष्ट और स्वाभाविक है।
- source_word: πολύ
  choice: बहुत होगी
  rationale: नपुंसकलिंग एकवचन सामूहिक संज्ञा σπέρμα के साथ मात्रा/बहुलता व्यक्त करता है; ‘संतान’ के साथ यही स्वाभाविक हिन्दी है।
- source_word: τέκνα
  choice: बच्चे
  rationale: बहुवचन का सीधा, सहज और अर्थसंगत रूप।
- source_word: παμβότανον τοῦ ἀγροῦ
  choice: मैदान की घनी घास
  rationale: παμβότανον खेत/मैदान में प्रचुरता से उगने वाली वनस्पति या घास को सूचित करता है; ‘घनी घास’ उपमा की बहुतायत और स्वाभाविक हिन्दी दोनों बनाए रखती है।
