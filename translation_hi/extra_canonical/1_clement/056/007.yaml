  text: उसने मारा, और उसके हाथों ने चंगा किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπαισεν
  choice: उसने मारा
  rationale: क्रिया के सामान्य अर्थ ‘मारना/प्रहार करना’ और यूनानी के अनिर्दिष्ट कर्ता को सीधे बनाए रखता है।
- source_word: αἱ χεῖρες αὐτοῦ
  choice: उसके हाथों ने
  rationale: यूनानी में ‘उसके हाथ’ कर्ता हैं; हिंदी में ‘ने’ लगाकर उनकी कर्तृभूमिका स्पष्ट और स्वाभाविक रखी गई है।
- source_word: ἰάσαντο
  choice: चंगा किया
  rationale: यहाँ क्रिया उपचार करने के अर्थ में है। यूनानी में कर्म व्यक्त नहीं है, इसलिए हिंदी में भी कोई कर्म नहीं जोड़ा गया।
theological_decisions:
- issue: चंगा किए जाने वाले कर्म का लोप
  choice: 'कर्म को अव्यक्त रखा गया: ‘चंगा किया’'
  alternative: ‘उसे चंगा किया’
  rationale: मूल यूनानी में कर्म नहीं है। ‘उसे’ जोड़ने से संभावित आशय स्पष्ट होता, पर स्रोत की संक्षिप्तता और वास्तविक अस्पष्टता समाप्त हो जाती।
translation_notes:
  register: भाषा सरल, गरिमापूर्ण और आधुनिक मानक हिंदी की है। ‘चंगा किया’ बाइबलीय संदर्भ में परिचित है और यहाँ सकर्मक अर्थ को बनाए रखता है।
