reference: 1 Clement 56:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: Παιδεύσει με γάρ, φησίν, δίκαιος ἐν ἐλέει καὶ ἐλέγξει με, ἔλαιον δὲ ἁμαρτωλῶν μὴ λιπανάτω τὴν κεφαλήν μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/005.yaml
  text: '“For,” it says[a], “a righteous person will discipline me in mercy and will reprove me,

    but let not the oil of sinners anoint my head.”'
translation:
  language: hi
  text: “क्योंकि,” वह कहता है[a], “एक धर्मी व्यक्ति दया से मुझे अनुशासित करेगा और मुझे सुधारेगा, पर पापियों का तेल मेरे सिर का अभिषेक न करे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “धर्मी जन।”
    reason: δίκαιος संज्ञा के रूप में प्रयुक्त विशेषण है; ‘व्यक्ति’ अर्थ स्पष्ट करता है, जबकि ‘धर्मी जन’ मूल की संक्षिप्तता के अधिक निकट है।
lexical_decisions:
- source_word: Παιδεύσει
  choice: अनुशासित करे
  rationale: क्रिया भविष्यत् रूप में है, पर उद्धृत भजन की प्रार्थनात्मक/अनुमतिसूचक शक्ति हिंदी में स्वाभाविक रूप से ‘करे’ से व्यक्त होती है; इसमें सुधारात्मक अनुशासन का भाव बना रहता है।
- source_word: δίκαιος
  choice: कोई धर्मी व्यक्ति
  rationale: यूनानी शब्द बिना निश्चित उपपद के है और प्रसंग में सामान्य रूप से किसी धर्मी व्यक्ति को सूचित करता है; ‘वह धर्मी’ अनावश्यक निश्चितता या ईश्वरीय/मसीही संकेत ला सकता है।
- source_word: ἐν ἐλέει
  choice: दया से
  rationale: यह अनुशासन के दयापूर्ण ढंग या भाव को व्यक्त करता है, न कि कठोर दंड को।
- source_word: ἐλέγξει
  choice: मुझे सुधारे
  rationale: ἐλέγχω में दोष दिखाने, झिड़कने और सुधारने का भाव है; वर्तमान पारस्परिक सुधार के प्रसंग में ‘सुधारे’ सहज और अर्थपूर्ण है।
- source_word: ἔλαιον δὲ ἁμαρτωλῶν
  choice: पर पापियों का तेल
  rationale: मूल की संबंधवाचक अस्पष्टता सुरक्षित रखी गई है—यह पापियों से मिलने वाला तेल अथवा उनसे संबद्ध तेल हो सकता है।
- source_word: μὴ λιπανάτω τὴν κεφαλήν μου
  choice: मेरे सिर का अभिषेक न करे
  rationale: λιπαίνω का मूल भाव चिकना/तेलयुक्त करना है; सिर और तेल के साथ ‘अभिषेक करना’ हिंदी में स्वाभाविक है और रूपक को बनाए रखता है।
theological_decisions:
- issue: δίκαιος की निश्चितता और पहचान
  choice: ‘कोई धर्मी व्यक्ति’—सामान्य, अनिश्चित संदर्भ
  alternative: ‘वह धर्मी जन’ या ‘धर्मी प्रभु’
  rationale: अनिश्चित δίκαιος और 1 क्लेमेंट 56 में पारस्परिक चेतावनी के प्रसंग के कारण किसी विशिष्ट ईश्वरीय या मसीही व्यक्ति की पहचान आरोपित नहीं की गई।
- issue: भजन के कथन का वाच्यार्थ
  choice: धर्मी व्यक्ति की दयापूर्ण ताड़ना स्वीकार करने की प्रार्थनात्मक इच्छा
  alternative: भविष्य की सीधी भविष्यवाणी—‘अनुशासित करेगा’
  rationale: ग्रीक भविष्यत् रूप को मानते हुए भी उद्धरण का व्यावहारिक बल स्वीकृति/कामना का है; हिंदी विधिलिंग इसे अधिक स्वाभाविक ढंग से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, पठनीय शैली रखी गई है। ‘अनुशासित करे’ और ‘सुधारे’ क्रमशः παιδεύω तथा ἐλέγχω का भेद यथासंभव बनाए रखते हैं। मुख्य पाठ में फुटनोट चिह्न [a] सम्मिलित है।
