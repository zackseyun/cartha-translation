id: 1CLEM.56.16
reference: 1 Clement 56:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: βλέπετε, ἀγαπητοί, πόσος ὑπερασπισμός ἐστιν τοῖς παιδευομένοις ὑπὸ τοῦ δεσπότου· πατὴρ γὰρ ἀγαθὸς ὢν παιδεύει εἰς τὸ ἐλεηθῆναι ἡμᾶς διὰ τῆς ὁσίας παιδείας αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/016.yaml
  text: See, beloved, how great a defense there is for those who are disciplined by the Master. For, being a good Father, he disciplines us so that we may receive mercy through his holy discipline.
translation:
  language: hi
  text: प्रिय जनो, देखो, स्वामी से अनुशासन पाने वालों के लिए कितनी बड़ी रक्षा[a] है। क्योंकि वह भला पिता है, इसलिए वह हमें अनुशासित करता है, ताकि उसके पवित्र अनुशासन के द्वारा हम पर दया की जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘रक्षा’ का अर्थ यहाँ ‘बचाव’ या ‘पक्ष-समर्थन’ भी हो सकता है।
    reason: दुर्लभ यूनानी शब्द ὑπερασπισμός के अर्थ-क्षेत्र में रक्षा और किसी के पक्ष में खड़े होने, दोनों के भाव संभव हैं।
lexical_decisions:
- source_word: ὑπερασπισμός
  choice: बचाव
  rationale: यह शब्द रक्षा, बचाव या पक्ष-समर्थन का भाव रखता है। ‘बचाव’ मूल के न्यायिक अथवा संरक्षक दोनों संभावित भावों को संक्षेप में बनाए रखता है।
- source_word: παιδευομένοις / παιδεύει / παιδείας
  choice: अनुशासन पाने वालों / अनुशासित करता है / अनुशासन
  rationale: एक ही यूनानी शब्द-परिवार की पुनरावृत्ति को हिंदी में भी बनाए रखा गया है। ‘अनुशासन’ में सुधारात्मक शिक्षा और ताड़ना दोनों का भाव समा सकता है।
- source_word: δεσπότου
  choice: स्वामी
  rationale: यह पद अधिकार रखने वाले स्वामी को दर्शाता है; ‘स्वामी’ आधुनिक हिंदी में स्पष्ट, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: ἐλεηθῆναι
  choice: हम पर दया की जाए
  rationale: यूनानी कर्मवाच्य रूप को बनाए रखता है और दया पाने के आशय को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ὁσίας
  choice: पवित्र
  rationale: यहाँ परमेश्वर के अनुशासन की पवित्र और धर्मसम्मत प्रकृति व्यक्त होती है; ‘पवित्र’ इसका सहज धार्मिक समतुल्य है।
theological_decisions:
- issue: अनुशासन और दया के बीच उद्देश्य-संबंध
  choice: ‘ताकि ... हम पर दया की जाए’
  alternative: ‘जिससे ... हम दया पाएँ’
  rationale: εἰς τὸ ἐλεηθῆναι उद्देश्य अथवा परिणाम का संकेत दे सकता है। ‘ताकि’ प्रमुख उद्देश्यात्मक भाव को व्यक्त करता है, जबकि कर्मवाच्य रचना मूल की संरचना और धर्मवैचारिक तनाव को बनाए रखती है।
- issue: परमेश्वर के लिए ‘पिता’ और ‘स्वामी’ दोनों संबोधन
  choice: दोनों को अलग-अलग बनाए रखा गया
  alternative: दोनों स्थानों पर एक ही संबोधन
  rationale: मूल पाठ उसके अधिकार को ‘स्वामी’ और उसकी भलाई तथा सुधारात्मक देखभाल को ‘पिता’ के रूप में प्रस्तुत करता है; इन भिन्न छवियों को मिलाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘प्रिय जनो’ संबोधन समावेशी है, और मूल में आए अनुशासन-संबंधी शब्दों की पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है।
