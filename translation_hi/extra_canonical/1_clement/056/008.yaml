  text: ἑξάκις ἐξ ἀναγκῶν ἐξελεῖταί σε, ἐν δὲ τῷ ἑβδόμῳ οὐχ ἅψεταί σου κακόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/008.yaml
  text: 'Six times he will deliver you from distresses,

    and in the seventh no evil will touch you.'
translation:
  language: hi
  text: 'वह छह बार तुम्हें संकटों से छुड़ाएगा,


    और सातवीं बार कोई बुराई तुम्हें नहीं छुएगी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ἀναγκῶν
  choice: संकटों से
  rationale: बहुवचन ἀνάγκαι यहाँ विवश करने वाली कठिन परिस्थितियों या विपत्तियों को दर्शाता है; ‘संकटों’ से अर्थ सहज और व्यापक रहता है।
- source_word: ἐξελεῖταί
  choice: छुड़ाएगा
  rationale: ἐξαιρέω का भाव किसी संकट से निकालने या बचाने का है; ‘छुड़ाएगा’ भविष्यकाल और उद्धारकारी क्रिया दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἅψεταί σου
  choice: तुम्हें छू भी न सकेगी
  rationale: ἅπτομαι का मूल अर्थ ‘छूना’ है। ‘भी’ और ‘न सकेगी’ हिन्दी में इस आश्वासन की प्रबलता व्यक्त करते हैं, बिना ‘हानि पहुँचाने’ जैसा अतिरिक्त अर्थ जोड़ने के।
- source_word: κακόν
  choice: कोई बुराई
  rationale: नपुंसकलिंग κακόν किसी बुरी वस्तु, विपत्ति या अनिष्ट के लिए व्यापक है; ‘कोई बुराई’ इसी अर्थगत खुलापन को बनाए रखता है।
theological_decisions:
- issue: सातवें अवसर पर बुराई का संबंध
  choice: ‘कोई बुराई तुम्हें छू भी न सकेगी’—मूल के प्रत्यक्ष आश्वासन को बनाए रखा गया है।
  alternative: ‘कोई अनिष्ट तुम्हारा कुछ न बिगाड़ेगा।’
  rationale: वैकल्पिक रूप परिणाम की व्याख्या करता, जबकि यूनानी पाठ स्पर्श की छवि का प्रयोग करता है; इसलिए मूल रूपक और उसकी धार्मिक-वाचिक प्रबलता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। काव्यात्मक समानांतरता बनाए रखने हेतु वाक्य दो पंक्तियों में रखा गया है। ‘छः बार/सातवीं बार’ यूनानी क्रम को स्पष्ट करता है।
