  text: ἐν λιμῷ ῥύσεταί σε ἐκ θανάτου, ἐν πολέμῳ δὲ ἐκ χειρὸς σιδήρου λύσει σε·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/009.yaml
  text: 'In famine he will rescue you from death,

    and in war he will deliver you from the hand of the sword[a].'
translation:
  language: hi
  text: 'अकाल में वह तुम्हें मृत्यु से बचाएगा,

    और युद्ध में तलवार के वश से छुड़ाएगा[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘लोहे के हाथ से’। यहाँ ‘लोहा’ संभवतः तलवार या लोहे के हथियार का संकेत है।
    reason: यूनानी के सामी मुहावरे और उसके शाब्दिक रूप को सुरक्षित रखते हुए मुख्य पाठ में स्वाभाविक हिन्दी देना।
lexical_decisions:
- source_word: ἐν λιμῷ
  choice: अकाल में
  rationale: λιμός यहाँ व्यापक भुखमरी या अन्न-संकट को सूचित करता है; ‘अकाल’ स्वाभाविक और प्रसंगानुकूल हिन्दी है।
- source_word: ῥύσεταί σε ἐκ θανάτου
  choice: वह तुम्हें मृत्यु से बचाएगा
  rationale: ῥύομαι संकट से बचाने या छुड़ाने का भाव देता है; हिन्दी में ‘मृत्यु से बचाएगा’ स्पष्ट और स्वाभाविक है।
- source_word: ἐν πολέμῳ
  choice: युद्ध में
  rationale: πολέμος का सीधा और उपयुक्त अर्थ ‘युद्ध’ है।
- source_word: ἐκ χειρὸς σιδήρου
  choice: तलवार के वश से
  rationale: शाब्दिक रूप ‘लोहे के हाथ से’ एक सामी मुहावरा है; σίδηρος यहाँ हथियार, विशेषतः तलवार, का लाक्षणिक संकेत है और χείρ अधिकार या वश का। यह रूप अर्थ को स्वाभाविक हिन्दी में रखता है, जबकि शाब्दिक रूप पाद-टिप्पणी में सुरक्षित है।
- source_word: λύσει σε
  choice: छुड़ाएगा
  rationale: λύω का मूल भाव खोलना, मुक्त करना या छुड़ाना है; पहली पंक्ति के ῥύσεται से क्रियात्मक भेद भी बना रहता है।
