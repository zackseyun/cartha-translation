  text: ὃν γὰρ ἀγαπᾷ κύριος, παιδεύει, μαστιγοῖ δὲ πάντα υἱόν, ὃν παραδέχεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/004.yaml
  text: '“For the Lord disciplines the one whom he loves,

    and he scourges every son whom he receives.”'
translation:
  language: hi
  text: '“क्योंकि प्रभु जिससे प्रेम करता है, उसे अनुशासित करता है,


    और वह हर उस पुत्र को कोड़े लगाता है जिसे वह स्वीकार करता है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδεύει
  choice: अनुशासित करता है
  rationale: यह शब्द सुधारने और शिक्षित करने वाले अनुशासन को व्यक्त करता है; केवल दंड देने का अर्थ नहीं देता।
- source_word: μαστιγοῖ
  choice: कोड़े लगाता है
  rationale: यूनानी क्रिया का प्रबल और ठोस बिंब सुरक्षित रखता है, उसे हल्के ‘दंड देता है’ में नहीं बदलता।
- source_word: παραδέχεται
  choice: स्वीकार करता है
  rationale: किसी को अपनाकर मान्यता देने या ग्रहण करने का स्वाभाविक हिन्दी समतुल्य है।
- source_word: πάντα υἱόν
  choice: जिस किसी पुत्र को
  rationale: ‘हर पुत्र’ के सार्वत्रिक भाव को सम्बन्धवाचक वाक्य में स्वाभाविक हिन्दी के साथ बनाए रखता है।
theological_decisions:
- issue: प्रभु के प्रेम और कठोर अनुशासन के बीच तनाव
  choice: ‘अनुशासित करता है’ और ‘कोड़े लगाता है’ दोनों को स्पष्ट रखा गया
  alternative: कठोर बिंब को नरम करके ‘दंड देता है’ कहना
  rationale: मूल पाठ प्रेमपूर्ण स्वीकार और पीड़ादायक सुधार के तनाव को साथ रखता है; अनुवाद इसे चुपचाप हल्का नहीं करता।
