base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/004.yaml
  text: But when those from the king stood by and said, “The spies of our land came in to you; bring them out, for the king so orders,” she answered, “The men whom you seek did indeed come in to me, but they immediately departed and are going on the road,” while she pointed them in another direction.
translation:
  language: hi
  text: पर जब राजा के लोग वहाँ आ खड़े हुए और कहने लगे, “हमारे देश के जासूस तुम्हारे यहाँ आए हैं; उन्हें बाहर निकालो, क्योंकि राजा की यही आज्ञा है,” तो उसने उत्तर दिया, “जिन पुरुषों को तुम खोज रहे हो, वे मेरे यहाँ आए तो थे, पर वे तुरंत चले गए और रास्ते पर जा रहे हैं,” और वह उन्हें दूसरी दिशा दिखा रही थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπισταθέντων
  choice: वहाँ आ खड़े हुए
  rationale: क्रिया में पास आकर उपस्थित होने या सामने खड़े होने का भाव है; यह केवल ‘आए’ की अपेक्षा यूनानी अभिव्यक्ति को अधिक स्पष्ट रूप से दर्शाता है।
- source_word: τῶν περὶ τοῦ βασιλέως
  choice: राजा के भेजे हुए लोग
  rationale: शाब्दिक अर्थ ‘राजा से जुड़े/राजा के पक्ष के लोग’ है। प्रसंग में ये राजकीय प्रतिनिधि हैं; ‘भेजे हुए’ स्वाभाविक हिन्दी में उनके अधिकार-संबंध को व्यक्त करता है, बिना किसी विशिष्ट पद का अनुमान लगाए।
- source_word: κατάσκοποι
  choice: भेदिये
  rationale: यह गुप्त रूप से जानकारी लेने वाले व्यक्तियों के लिए प्रचलित और प्रसंगानुकूल हिन्दी शब्द है।
- source_word: ἐξάγαγε
  choice: बाहर निकालो
  rationale: आज्ञार्थक क्रिया का सीधा अर्थ सुरक्षित रखा गया है।
- source_word: Εἰσῆλθον μέν
  choice: आए तो थे
  rationale: μέν के स्वीकारात्मक बल को स्वाभाविक हिन्दी ‘तो थे’ से व्यक्त किया गया है।
- source_word: ὑποδεικνύουσα αὐτοῖς ἐνλλάξις
  choice: यह कहते हुए उसने उन्हें दूसरी दिशा बता दी
  rationale: अंतिम पाठ में OCR या पाठगत असामान्यता है, पर आशय उन्हें वास्तविक मार्ग से अलग दिशा दिखाने का है; अंग्रेज़ी परामर्श-पाठ भी इसी अर्थ की पुष्टि करता है।
