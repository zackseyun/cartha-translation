  text: You see[a], beloved, that not only faith, but also prophecy came to be in the woman.
translation:
  language: hi
  text: हे प्रिय जनो, देखो कि उस स्त्री में न केवल विश्वास, बल्कि भविष्यवाणी भी हो गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁρᾶτε
  choice: देखो
  rationale: यह वर्तमानकालीन आदेश/आह्वान है; ‘देखो’ लेखक के निष्कर्ष पर ध्यान दिलाने का स्वाभाविक और सीधा हिन्दी रूप है।
- source_word: ἀγαπητοί
  choice: हे प्रियो
  rationale: सम्बोधन का स्नेहपूर्ण तथा बहुवचन भाव बनाए रखता है और गरिमापूर्ण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐν τῇ γυναικί
  choice: उस स्त्री में
  rationale: निश्चित उपपद τῇ को प्रसंग-सूचक ‘उस’ से व्यक्त किया गया है; ἐν का स्थानीय/अंतर्निहित भाव ‘में’ से सुरक्षित रहता है।
- source_word: γέγονεν
  choice: उत्पन्न हुई
  rationale: γίνομαι के पूर्णकाल रूप का ‘अस्तित्व में आना/हो जाना’ वाला भाव व्यक्त करता है और केवल स्थिर अवस्था बताने वाले ‘थी’ या खोज का भाव जोड़ने वाले ‘पाई गई’ से बचता है।
theological_decisions:
- issue: विश्वास और भविष्यवाणी का उस स्त्री में होना
  choice: 'दोनों को समानांतर संज्ञाओं के रूप में रखा गया: ‘न केवल विश्वास, बल्कि भविष्यवाणी भी’'
  alternative: भविष्यवाणी को उसके विश्वास का परिणाम या प्रमाण बताना
  rationale: यूनानी पाठ दोनों के बीच कारणात्मक या व्याख्यात्मक सम्बन्ध स्पष्ट नहीं करता; इसलिए उसका धर्मवैचारिक तनाव और समानांतर रचना सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘हे प्रियो’ पत्रात्मक सम्बोधन को बनाए रखता है, जबकि वाक्यक्रम यूनानी कथन के जोर को स्वाभाविक हिन्दी में प्रस्तुत करता है।
