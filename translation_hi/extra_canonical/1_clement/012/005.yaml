source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ εἶπεν πρὸς τοὺς ἄνδρας· Γινώσκουσα γινώσκω ἐγώ, ὅτι κύριος ὁ θεὸς παραδίδωσιν ὑμῖν τὴν γῆν ταύτην· ὁ γὰρ φόβος καὶ ὁ τρόμος ὑμῶν ἐπέπεσεν τοῖς κατοικοῦσιν αὐτήν. ὡς ἐὰν οὖν γένηται λαβεῖν αὐτὴν ὑμᾶς, διασώσατέ με καὶ τὸν οἶκον τοῦ πατρός μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/005.yaml
  text: And she said to the men, “I know for certain that the Lord God is giving this land to you, for the fear and dread of you has fallen upon those who dwell in it. Therefore, when it comes about that you take it, preserve me and my father’s house.”
translation:
  language: hi
  text: और उसने उन पुरुषों से कहा, “मैं निश्चय जानती हूँ कि प्रभु परमेश्वर यह देश तुम्हें सौंप रहा है, क्योंकि तुम्हारा भय और आतंक इसके निवासियों पर छा गया है। इसलिए जब तुम इस पर अधिकार कर लो, तो मुझे और मेरे पिता के घराने को बचा लेना।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκουσα γινώσκω
  choice: मैं निश्चय जानती हूँ
  rationale: ग्रीक की बलाघाती पुनरुक्ति को स्वाभाविक हिन्दी में निश्चितता व्यक्त करने वाले वाक्यांश से प्रस्तुत किया गया है।
- source_word: παραδίδωσιν
  choice: सौंप रहा है
  rationale: वर्तमानकालीन क्रिया और भूमि को उनके अधिकार में देने के भाव को बनाए रखता है।
- source_word: ὁ φόβος καὶ ὁ τρόμος
  choice: भय और आतंक
  rationale: दोनों निकटार्थक संज्ञाओं की तीव्रता और अलग-अलग उपस्थिति सुरक्षित रखी गई है।
- source_word: τοῖς κατοικοῦσιν αὐτήν
  choice: इसके निवासियों पर
  rationale: शाब्दिक ‘इसमें रहने वालों’ का संक्षिप्त और स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: λαβεῖν αὐτὴν
  choice: इस पर अधिकार कर लो
  rationale: भूमि को ‘लेने’ का आशय विजय के द्वारा अधिकार प्राप्त करना है; हिन्दी में ‘देश को ले लो’ की अस्वाभाविकता से बचा गया है।
- source_word: διασώσατέ
  choice: बचा लेना
  rationale: सुरक्षित निकालने अथवा जीवित बचाने की प्रार्थना को सहज हिन्दी में व्यक्त करता है।
- source_word: τὸν οἶκον τοῦ πατρός μου
  choice: मेरे पिता के घराने को
  rationale: οἶκος यहाँ भवन मात्र नहीं, पारिवारिक गृहसमुदाय को सूचित करता है; ‘घराना’ इस अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: κύριος ὁ θεός का संबोधन
  choice: प्रभु परमेश्वर
  alternative: प्रभु, परमेश्वर
  rationale: ग्रीक पदबंध को पारंपरिक और सामान्य हिन्दी बाइबलीय अभिव्यक्ति में रखा गया है, बिना किसी अतिरिक्त व्याख्यात्मक उपाधि के।
- issue: भूमि सौंपने की क्रिया का काल और आशय
  choice: यह देश तुम्हें सौंप रहा है
  alternative: यह देश तुम्हें सौंप चुका है
  rationale: ग्रीक वर्तमान παραδίδωσιν को वर्तमान रूप में बनाए रखा गया है; परिणाम की पूर्णता को अनावश्यक रूप से पहले से निश्चित व्याकरणिक पूर्णकाल में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। प्रत्यक्ष कथन की निश्चितता, भय की द्विपदी अभिव्यक्ति और ‘पिता के घराने’ के सामूहिक अर्थ को सुरक्षित रखा गया है।
