source:
  edition: Funk 1901 (normalized OCR)
  text: ἐκπεμφθέντων γὰρ ὑπὸ Ἰησοῦ τοῦ τοῦ Ναυὴ κατασκόπων εἰς τὴν Ἰεριχώ, ἔγνω ὁ βασιλεὺς τῆς γῆς, ὅτι ἥκασιν κατασκοπεῦσαι τὴν χώραν αὐτῶν, καὶ ἐξέπεμψεν ἄνδρας τοὺς συλλημψομένους αὐτούς, ὅπως συλληφθέντες θανατωθῶσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/002.yaml
  text: For when spies had been sent out by Joshua son of Nun to Jericho, the king of the land learned that they had come to spy out their land, and he sent men to seize them, so that, once captured, they might be put to death.
translation:
  language: hi
  text: क्योंकि जब नून के पुत्र यहोशू ने यरीहो भेजने के लिए जासूसों को भेजा, तब उस देश के राजा को पता चला कि वे उस देश की जासूसी करने आए हैं, और उसने उन्हें पकड़ने के लिए आदमी भेजे, ताकि पकड़े जाने पर उन्हें मार डाला जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦ τοῦ τοῦ Ναυὴ
  choice: नून के पुत्र यहोशू
  rationale: यहाँ पुराने नियम के पात्र Joshua का उल्लेख है; प्रचलित हिन्दी बाइबलीय नाम और पुत्र-संबंध स्रोत को स्पष्ट व स्वाभाविक रूप में व्यक्त करते हैं।
- source_word: κατασκόπων / κατασκοπεῦσαι
  choice: जासूस / जासूसी करने
  rationale: संज्ञा और उसी मूल की क्रिया के बीच स्रोत में उपस्थित शब्द-संबंध को हिन्दी में बनाए रखा गया है।
- source_word: τὴν χώραν αὐτῶν
  choice: उनके देश की
  rationale: αὐτῶν का बहुवचन संबंध बनाए रखते हुए χώρα को यहाँ राजनीतिक-भौगोलिक क्षेत्र के अर्थ में स्वाभाविक हिन्दी 'देश' से व्यक्त किया गया है।
- source_word: συλλημψομένους / συλληφθέντες
  choice: पकड़ने / पकड़े जाने पर
  rationale: पकड़ने के उद्देश्य और उसके पूर्ण हो जाने की दशा—दोनों को स्रोत के अनुसार स्पष्ट रखा गया है।
- source_word: θανατωθῶσιν
  choice: उन्हें मार डाला जाए
  rationale: यह क्रिया केवल मरने नहीं, किसी के द्वारा मृत्युदंडात्मक रूप से मारे जाने को व्यक्त करती है; कर्मवाच्य भी सुरक्षित है।
