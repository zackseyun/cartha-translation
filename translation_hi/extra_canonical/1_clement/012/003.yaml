  text: इसलिए अतिथि-सत्कार करनेवाली राहाब ने उनका स्वागत किया और उन्हें ऊपर के कमरे में सन के डंठलों के नीचे छिपा दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλόξενος
  choice: अतिथि-सत्कार करनेवाली
  rationale: यह विशेषण राहाब की पहचान को आतिथ्यशीलता से जोड़ता है। हिंदी में यह पदबंध अर्थ को स्वाभाविक ढंग से व्यक्त करता है और यूनानी के विशेषणात्मक बल को बनाए रखता है।
- source_word: εἰσδεξαμένη
  choice: स्वागत किया
  rationale: क्रिया का अर्थ भीतर ग्रहण करना या आतिथ्यपूर्वक स्वीकार करना है; संदर्भ में ‘स्वागत किया’ सहज और उपयुक्त है।
- source_word: ὑπερῷον
  choice: ऊपर के कमरे
  rationale: यह घर की ऊपरी मंज़िल पर स्थित कक्ष को सूचित करता है; ‘ऊपर का कमरा’ आधुनिक हिंदी में स्पष्ट है।
- source_word: λινοκαλάμην
  choice: सन के डंठलों
  rationale: संयुक्त शब्द सन के काटे या सुखाए जा रहे डंठलों को दर्शाता है; बहुवचन हिंदी में दृश्य को स्वाभाविक रूप देता है।
