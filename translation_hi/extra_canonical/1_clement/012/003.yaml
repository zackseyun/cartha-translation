  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिंदी। यूनानी ἡ φιλόξενος Ῥαὰβ के विशेषणात्मक, लगभग उपाधिसदृश बल को ‘अतिथि-सत्कार करनेवाली राहाब’ से बनाए रखा गया है; इसे कारणसूचक ‘राहाब ने अतिथि-सत्कार करते हुए’ नहीं बनाया गया।
