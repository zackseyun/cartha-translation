  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण प्रत्यक्ष कथन रखा गया है। एकवचन संबोधन के लिए सम्मानपूर्ण और प्रचलित ‘तुम’ का प्रयोग किया गया है; भाषा में अनावश्यक धार्मिक पारिभाषिकता नहीं जोड़ी गई।
