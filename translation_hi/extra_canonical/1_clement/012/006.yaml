source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ εἶπαν αὐτῇ· Ἔσται οὕτως, ὡς ἐλάλησας ἡμῖν. ὡς δʼ ἂν γνῷς παραγινομένους ἡμᾶς, συνάξεις πάντας τοὺς σοὺς ὑπὸ τὸ στέγος σου, καὶ διασωθήσονται· ὅσοι γὰρ ἐὰν εὑρεθῶσιν ἔξω τῆς οἰκίας, ἀπολοῦνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/006.yaml
  text: And they said to her, “It shall be so, as you have spoken to us. But when you know that we are coming, you shall gather all your people under your roof, and they will be preserved; for as many as are found outside the house will perish.”
translation:
  language: hi
  text: और उन्होंने उससे कहा, “जैसा तुमने हमसे कहा है, वैसा ही होगा। लेकिन जब तुम्हें पता चले कि हम आ रहे हैं, तब अपने सभी जनों को अपनी छत के नीचे इकट्ठा कर लेना, और वे बचा लिए जाएँगे; क्योंकि जितने भी घर के बाहर पाए जाएँगे, वे नाश हो जाएँगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγινομένους
  choice: आ रहे हैं
  rationale: यह आगमन की प्रक्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है और यूनानी कृदंत के अर्थ को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाता।
- source_word: πάντας τοὺς σοὺς
  choice: अपने सभी जनों को
  rationale: यूनानी का शाब्दिक अर्थ ‘तुम्हारे सभी’ है; ‘अपने सभी जनों’ से परिवार और अपने लोगों का व्यापक आशय बना रहता है।
- source_word: διασωθήσονται
  choice: बचा लिए जाएँगे
  rationale: यह निष्क्रिय क्रिया के संरक्षण अथवा सुरक्षित बच निकलने के भाव को प्रसंगानुकूल ढंग से रखता है।
- source_word: ἀπολοῦνται
  choice: नाश हो जाएँगे
  rationale: यह विनाश/मृत्यु के प्रबल अर्थ को बनाए रखता है और घर के भीतर बचाए जाने के साथ मूल विरोध को स्पष्ट करता है।
theological_decisions: []
