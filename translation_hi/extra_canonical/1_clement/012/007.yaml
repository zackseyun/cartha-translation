source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ προσέθεντο αὐτῇ δοῦναι σημεῖον, ὅπως ἐκκρεμάσῃ ἐκ τοῦ οἴκου αὐτῆς κόκκινον, πρόδηλον ποιοῦντες, ὅτι διὰ τοῦ αἵματος τοῦ κυρίου λύτρωσις ἔσται πᾶσι τοῖς πιστεύουσιν καὶ ἐλπίζουσιν ἐπὶ τὸν θεόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/007.yaml
  text: And they gave her a sign[a], that she should hang scarlet from her house, making it clear that through the blood of the Lord there will be redemption for all who believe and hope in God.
translation:
  language: hi
  text: और उन्होंने उसे एक चिन्ह दिया[a] कि वह अपने घर से लाल रंग की वस्तु लटका दे। इस प्रकार उन्होंने यह प्रकट किया कि प्रभु के लहू के द्वारा उन सभी के लिए छुटकारा होगा जो परमेश्वर पर विश्वास और आशा रखते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उन्होंने आगे बढ़कर उसे एक चिन्ह दिया।”
    reason: προσέθεντο ... δοῦναι एक सामी प्रभाव वाला प्रयोग है, जिसका अर्थ ‘आगे बढ़कर देना’ या सामान्यतः ‘देना’ हो सकता है।
lexical_decisions:
- source_word: προσέθεντο αὐτῇ δοῦναι
  choice: उन्होंने उसे ... दिया
  rationale: यह सामी प्रभाव वाला यूनानी प्रयोग यहाँ कार्य को आगे करके पूरा करने का अर्थ देता है; हिंदी में सीधा भूतकाल स्वाभाविक है और भावी अथवा शर्तसूचक अर्थ नहीं जोड़ता।
- source_word: σημεῖον
  choice: चिन्ह
  rationale: यह राहाब को दिया गया पहचान-संकेत है; ‘चिन्ह’ मूल के व्यापक अर्थ को बनाए रखता है।
- source_word: κόκκινον
  choice: लाल रंग की कोई वस्तु
  rationale: मूल में विशेषण संज्ञा के रूप में प्रयुक्त है और वस्तु स्पष्ट नहीं की गई। हिंदी में अर्थगम्यता के लिए ‘कोई वस्तु’ जोड़ा गया है, पर ‘डोरी’ जैसी अनुल्लिखित विशिष्ट वस्तु नहीं जोड़ी गई।
- source_word: λύτρωσις
  choice: छुटकारा
  rationale: यह मुक्ति अथवा उद्धार का अर्थ देता है; ‘छुटकारा’ सामान्य पाठक के लिए सहज है और रक्त के द्वारा विमोचन के भाव को रखता है।
- source_word: πιστεύουσιν καὶ ἐλπίζουσιν ἐπὶ τὸν θεόν
  choice: परमेश्वर पर विश्वास और आशा रखते हैं
  rationale: दोनों समन्वित कृदंतों को बनाए रखते हुए ἐπί के भरोसा-केंद्रित भाव को स्वाभाविक हिंदी में व्यक्त किया गया है।
theological_decisions:
- issue: प्रभु के लहू और छुटकारे का संबंध
  choice: ‘प्रभु के लहू के द्वारा ... छुटकारा होगा’
  alternative: इसे केवल प्रतीकात्मक समानता या पहले से पूर्ण हो चुके छुटकारे के रूप में स्पष्ट करना
  rationale: मूल διὰ और भविष्यकाल ἔσται के साथ सीधे यह कथन करता है। अनुवाद उसके भावी रूप और धार्मिक तनाव को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- issue: πᾶσι τοῖς πιστεύουσιν καὶ ἐλπίζουσιν की व्यापकता
  choice: ‘उन सभी का ... जो ... विश्वास और आशा रखते हैं’
  alternative: ‘विश्वासियों’ या किसी विशिष्ट कलीसियाई समूह तक सीमित करना
  rationale: मूल सार्वभौमिक ‘सभी’ कहता है और दो वर्तमान कृदंतों से उनकी पहचान करता है; किसी सांप्रदायिक सीमा का समावेश उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सरल शैली रखी गई है। ‘लहू’ बाइबलीय प्रसंग में परिचित है। κόκκινον की वास्तविक वस्तु अस्पष्ट होने के कारण ‘डोरी’ नहीं जोड़ी गई; ‘लाल रंग की कोई वस्तु’ हिंदी में उस अस्पष्टता को यथासंभव स्वाभाविक ढंग से बनाए रखता है।
