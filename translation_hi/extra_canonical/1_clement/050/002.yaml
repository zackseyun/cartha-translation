id: 1CLEM.50.2
reference: 1 Clement 50:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: τίς ἱκανὸς ἐν αὐτῇ εὑρεθῆναι, εἰ μὴ οὓς ἂν καταξιώσῃ ὁ θεός; δεηθῶμεν οὖν καὶ αἰτώμεθα ἀπὸ τοῦ ἐλέους αὐτοῦ, ἵνα ἐν ἀγάπῃ εὑρεθῶμεν δίχα προσκλίσεως ἀνθρωπίνης, ἄμωμοι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/002.yaml
  text: Who is sufficient to be found in it, except those whom God may count worthy? Therefore let us pray and ask from his mercy that we may be found in love, without human partiality, blameless.
translation:
  language: hi
  text: कौन इस प्रेम में पाया जाने के योग्य है, सिवाय उनके जिन्हें परमेश्वर योग्य ठहराए? इसलिए हम प्रार्थना करें और उसकी दया की याचना करें, कि हम प्रेम में पाए जाएँ—मानवीय पक्षपात से रहित और निर्दोष।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱκανός
  choice: योग्य
  rationale: यहाँ शब्द किसी कार्य की क्षमता से अधिक प्रेम में पाए जाने की पात्रता/पर्याप्तता दर्शाता है; आगे के καταξιώσῃ के साथ हिंदी में स्वाभाविक संबंध भी बनता है।
- source_word: καταξιώσῃ
  choice: योग्य ठहराए
  rationale: यह परमेश्वर द्वारा किसी को योग्य मानने या ठहराने का भाव सुरक्षित रखता है, न कि मनुष्य की अंतर्निहित योग्यता का।
- source_word: δεηθῶμεν
  choice: प्रार्थना करें
  rationale: परमेश्वर से विनती करने के धार्मिक संदर्भ में यह आधुनिक हिंदी का स्वाभाविक और गरिमापूर्ण पद है।
- source_word: ἀπὸ τοῦ ἐλέους αὐτοῦ
  choice: उसकी दया से
  rationale: यूनानी ἀπό को बनाए रखते हुए दया को उस स्रोत के रूप में व्यक्त करता है जिससे निवेदन किया जाता है।
- source_word: δίχα προσκλίσεως ἀνθρωπίνης
  choice: मानवीय पक्षपात से रहित
  rationale: πρόσκλισις का झुकाव, पक्षधरता या पक्षपात का भाव यहाँ संक्षेप और स्पष्टता से व्यक्त होता है।
- source_word: ἄμωμοι
  choice: निर्दोष
  rationale: नैतिक दोष या कलंक से रहित होने का सामान्य और गरिमापूर्ण हिंदी रूप।
theological_decisions:
- issue: प्रेम में पाए जाने और परमेश्वर द्वारा योग्य ठहराए जाने का संबंध
  choice: ‘सिवाय उनके जिन्हें परमेश्वर योग्य ठहराए’
  alternative: ‘सिवाय उनके जिन्हें परमेश्वर इसके योग्य समझे’
  rationale: मुख्य रूप मूल की दैवी क्रिया और वाक्य की संक्षिप्तता बनाए रखता है; यह नहीं बताता कि योग्यता किस आधार पर दी या मानी जाती है।
- issue: αὐτῇ का संदर्भ
  choice: ‘इस प्रेम में’
  alternative: ‘उसमें’
  rationale: पूर्ववर्ती संदर्भ के ἀγάπη की ओर संकेत स्पष्ट करने के लिए संज्ञा दोहराई गई है, जबकि मूल का आशय अपरिवर्तित है।
translation_notes:
  register: आधुनिक मानक हिंदी, सामूहिक उपदेशात्मक स्वर और गरिमापूर्ण धार्मिक भाषा। मूल की अलंकारिक प्रश्न-रचना, दैवी योग्य-ठहराव और अंतिम समानांतर विशेषणों को सुरक्षित रखा गया है।
