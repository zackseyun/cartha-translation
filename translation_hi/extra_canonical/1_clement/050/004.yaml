source:
  edition: Funk 1901 (normalized OCR)
  text: γέγραπται γάρ· Εἰσέλθετε εἰς τὰ ταμεῖα μικρὸν ὅσον ὅσον, ἕως οὗ παρέλθῃ ἡ ὀργὴ καὶ ὁ θυμός μου, καὶ μνησθήσομαι ἡμέρας ἀγαθῆς, καὶ ἀναστήσω ὑμᾶς ἐκ τῶν θηκῶν ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/004.yaml
  text: For it is written, “Enter into your chambers for a very little while, until my wrath and anger pass by; and I will remember a good day, and I will raise you from your tombs.”
translation:
  language: hi
  text: क्योंकि लिखा है, “थोड़ी ही देर के लिए अपनी कोठरियों में चले जाओ, जब तक मेरा कोप और क्रोध टल न जाए; तब मैं एक शुभ दिन को स्मरण करूँगा और तुम्हें तुम्हारी कब्रों में से उठा खड़ा करूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταμεῖα
  choice: कोठरियों
  rationale: यह बहुवचन संज्ञा निजी या भीतरी कक्षों को सूचित करती है; ‘कोठरियाँ’ मूल के ठोस कक्ष-संबंधी अर्थ को बिना ‘भीतरी’ जोड़े स्वाभाविक हिंदी में रखती है।
- source_word: μικρὸν ὅσον ὅσον
  choice: थोड़ी ही देर के लिए
  rationale: दोहराव अत्यल्प अवधि पर बल देता है; यह वाक्यांश उसी बल को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: ὀργὴ καὶ ὁ θυμός μου
  choice: मेरा कोप और क्रोध
  rationale: दोनों निकटार्थी पदों को अलग-अलग रखकर मूल की द्विपदी तीव्रता संरक्षित की गई है।
- source_word: ἡμέρας ἀγαθῆς
  choice: एक शुभ दिन
  rationale: अनिश्चित रूप और ‘अच्छे/कल्याणकारी’ दिन की सकारात्मक गुणवत्ता दोनों को बनाए रखता है।
- source_word: ἀναστήσω
  choice: उठा खड़ा करूँगा
  rationale: क्रिया का अर्थ उठाने या जिलाने दोनों की ओर संकेत कर सकता है; कब्रों के संदर्भ में पुनरुत्थान का संकेत रहते हुए भी अनावश्यक व्याख्यात्मक विस्तार नहीं किया गया।
- source_word: θηκῶν
  choice: कब्रों
  rationale: इस संदर्भ में रखने के स्थान या पात्र का अर्थ दफन-स्थानों से है; ‘कब्रों’ संदर्भानुकूल और सामान्य पाठक के लिए स्पष्ट है।
theological_decisions:
- issue: ἀναστήσω का पुनरुत्थान-संबंधी अर्थ
  choice: उठा खड़ा करूँगा
  alternative: जीवित करूँगा
  rationale: ‘उठा खड़ा करूँगा’ मूल क्रिया की प्रत्यक्ष छवि और पुनरुत्थान-संकेत दोनों रखता है, जबकि ‘जीवित करूँगा’ संभावित अर्थ को अधिक स्पष्ट करके मूल की कुछ अर्थगत व्यापकता घटा देता।
- issue: दैवी क्रोध के दो यूनानी पद
  choice: कोप और क्रोध
  alternative: रोष और प्रकोप
  rationale: मूल में दो अलग संज्ञाएँ हैं; दोनों को बनाए रखना उचित है, भले हिंदी में उनके अर्थ निकट हों।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। उद्धरण की भविष्यवाणीय लय बनाए रखते हुए अनावश्यक संस्कृतनिष्ठता और व्याख्यात्मक जोड़ से बचा गया है।
