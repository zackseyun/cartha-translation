reference: 1 Clement 50:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: γέγραπται γάρ· Μακάριοι, ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι· μακάριος ἀνήρ, οὗ οὐ μὴ λογίσηται κύριος ἁμαρτίαν, οὐδέ ἐστιν ἐν τῷ στόματι αὐτοῦ δόλος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/006.yaml
  text: For it is written[a], “Blessed are those whose lawless deeds are forgiven, and whose sins are covered; blessed is the man whose sin the Lord will certainly not reckon, and in whose mouth there is no deceit.”
translation:
  language: hi
  text: 'क्योंकि लिखा है[a]: “धन्य हैं वे, जिनके अधर्मपूर्ण काम क्षमा किए गए हैं और जिनके पाप ढाँप दिए गए हैं; धन्य है वह मनुष्य, जिसके पाप को प्रभु कभी नहीं गिनेगा और जिसके मुँह में कोई छल नहीं है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिनके अधर्मपूर्ण काम क्षमा किए गए थे और जिनके पाप ढाँप दिए गए थे।”
    reason: यूनानी अओरिस्ट कर्मवाच्यों को साधारण भूतकाल के रूप में प्रस्तुत करने वाला वैकल्पिक अनुवाद; मुख्य पाठ धन्य-वचन के सामान्य, वर्तमान-परिणामी भाव को व्यक्त करता है।
lexical_decisions:
- source_word: ἀνομίαι
  choice: अधर्म के काम
  rationale: बहुवचन संज्ञा यहाँ व्यवस्था-विरोधी अपराधों या कुकर्मों को दर्शाती है; ‘अधर्म के काम’ सामान्य पाठक के लिए स्वाभाविक और अर्थतः स्पष्ट है।
- source_word: ἀφέθησαν
  choice: क्षमा किए गए
  rationale: अओरिस्ट कर्मवाच्य को उसके पूर्ण किए गए दैवी क्षमाकर्म के रूप में रखा गया है; इस धन्य-वचन में परिणामस्वरूप वर्तमान दशा भी निहित है।
- source_word: ἐπεκαλύφθησαν
  choice: ढाँप दिए गए
  rationale: मूल के आवरण-रूपक और कर्मवाच्य को बनाए रखता है, बिना उसे केवल ‘क्षमा’ का पर्याय बनाकर समतल किए।
- source_word: οὐ μὴ λογίσηται
  choice: निश्चय ही नहीं लगाएगा
  rationale: οὐ μή की प्रबल निषेधात्मक शक्ति को ‘निश्चय ही नहीं’ से व्यक्त किया गया है; ‘हिसाब लगाना’ पाप को किसी के खाते में दर्ज करने की गणनात्मक छवि सुरक्षित रखता है।
- source_word: δόλος
  choice: छल
  rationale: कपटपूर्ण या धोखेबाज़ वाणी के व्यापक अर्थ को संक्षिप्त और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पाप को न गिनने का अर्थ
  choice: ‘जिसके पाप का हिसाब प्रभु निश्चय ही नहीं लगाएगा’
  alternative: ‘जिस पर प्रभु पाप का दोष नहीं लगाएगा’
  rationale: हिसाब लगाने की भाषा λογίζομαι की लेखांकन-संबंधी छवि बचाती है और क्षमा की किसी विशिष्ट सम्प्रदायगत व्याख्या को आरोपित नहीं करती।
- issue: अओरिस्ट क्रियाओं का कालगत रूप
  choice: ‘क्षमा किए गए’ और ‘ढाँप दिए गए’
  alternative: ‘क्षमा किए जाते हैं’ और ‘ढाँप दिए जाते हैं’
  rationale: यूनानी अओरिस्ट रूपों को औपचारिक रूप से सुरक्षित रखते हुए धन्य-वचन के सामान्य, परिणामकारी अर्थ को हिन्दी में स्वाभाविक रहने दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; उद्धरण की भजन-सदृश गरिमा और समानांतर संरचना बनाए रखी गई है। ‘अधर्म के काम’ तथा ‘हिसाब लगाएगा’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि ‘ढाँप दिए गए’ मूल रूपक को सुरक्षित रखता है।
