id: 1CLEM.50.5
reference: 1 Clement 50:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Funk 1901 (normalized OCR)
  text: μακάριοι ἐσμὲν, ἀγαπητοί, εἰ τὰ προστάγματα τοῦ θεοῦ ἐποι₁₀ οῦμεν ἐν ὁμονοίᾳ ἀγάπης, εἰς τὸ ἀφεθῆναι ἡμῖν δι’ ἀγάπης τὰς ἁμαρτίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/005.yaml
  text: Blessed are we[a], beloved, if we do the commandments of God in the harmony of love, so that through love our sins may be forgiven us.
translation:
  language: hi
  text: हे प्रियजनो, यदि हम प्रेम की एकता में परमेश्वर की आज्ञाओं का पालन करें, तो हम धन्य हैं, ताकि प्रेम के द्वारा हमारे पाप क्षमा किए जाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: धन्य
  rationale: यह यूनानी शब्द परमेश्वर की कृपा से प्राप्त सौभाग्य और कल्याण को व्यक्त करता है; ‘धन्य’ हिन्दी के धार्मिक-साहित्यिक संदर्भ में स्वाभाविक और सटीक है।
- source_word: ἀγαπητοί
  choice: हे प्रियजनो
  rationale: संबोधन और आत्मीयता दोनों को स्पष्ट रखने वाला आधुनिक, गरिमापूर्ण रूप।
- source_word: προστάγματα
  choice: आज्ञाओं
  rationale: यहाँ परमेश्वर के आदेशों या निर्देशों का बोध है; ‘आज्ञाओं’ सामान्य पाठक के लिए सहज है।
- source_word: ἐποιούμεν
  choice: पालन करें
  rationale: आज्ञाओं को ‘करना’ के बजाय हिन्दी में ‘पालन करना’ अधिक स्वाभाविक है; यूनानी का शर्तार्थक भाव ‘यदि ... करें’ में रखा गया है।
- source_word: ὁμονοίᾳ ἀγάπης
  choice: प्रेम से उपजी एकता में
  rationale: ὁμόνοια साझा मन, सहमति और मेल को दर्शाता है। ‘एकता’ उसके सामुदायिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करती है, जबकि संबंधसूचक ἀγάπης को ‘प्रेम से उपजी’ के रूप में पढ़ना संभावित संबंध को दर्शाता है।
- source_word: δι’ ἀγάπης
  choice: प्रेम के द्वारा
  rationale: διά के साधनात्मक अर्थ को स्पष्ट रखा गया है और प्रेम की केंद्रीय भूमिका को कम नहीं किया गया।
- source_word: ἁμαρτίας
  choice: पाप
  rationale: धार्मिक और नैतिक अपराध के लिए स्थापित तथा स्रोत-संगत हिन्दी शब्द।
theological_decisions:
- issue: आज्ञापालन, प्रेम और पापों की क्षमा का संबंध
  choice: ‘ताकि प्रेम के द्वारा हमारे पाप क्षमा किए जाएँ’
  alternative: ‘जिसके फलस्वरूप प्रेम के द्वारा हमारे पाप क्षमा होते हैं’
  rationale: εἰς τὸ ἀφεθῆναι उद्देश्य अथवा परिणाम की दिशा व्यक्त कर सकता है। ‘ताकि’ स्रोत की उद्देश्यसूचक संरचना को बनाए रखता है, बिना यह तय किए कि प्रेम अपने आप में क्षमा का स्वतंत्र आधार है या उस क्षमा का माध्यम/परिसर।
- issue: ἀγάπης का ὁμονοίᾳ से संबंध
  choice: ‘प्रेम से उपजी एकता’
  alternative: ‘प्रेम की एकता’ या ‘प्रेममय एकता’
  rationale: यूनानी संबंधसूचक रूप कई अर्थ दे सकता है। मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई है, पर इसे किसी विशिष्ट सांप्रदायिक सिद्धांत में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, आत्मीय संबोधन और गरिमापूर्ण धार्मिक शैली। वाक्य की शर्तार्थक तथा उद्देश्यसूचक संरचना सुरक्षित रखी गई है। कोई पादटिप्पणी नहीं जोड़ी गई, क्योंकि इस पद में आवश्यक पाठांतर नहीं है; अंग्रेज़ी परत की दी हुई पादटिप्पणी अपने वर्तमान रूप में मुख्य पाठ के वास्तविक वैकल्पिक अनुवाद से मेल नहीं खाती।
