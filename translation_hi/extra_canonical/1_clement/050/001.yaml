  text: See, beloved, how great and marvelous love is, and of its perfection there is no description.
translation:
  language: hi
  text: हे प्रिय जनो, देखो कि प्रेम कितना महान और अद्भुत है, और उसकी पूर्णता का वर्णन नहीं किया जा सकता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: देखो
  rationale: बहुवचन आज्ञार्थक रूप को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀγαπητοί
  choice: हे प्रिय जनो
  rationale: सम्बोधन और बहुवचन दोनों को बनाए रखते हुए आधुनिक हिन्दी में गरिमापूर्ण तथा सहज है।
- source_word: ἀγάπη
  choice: प्रेम
  rationale: सामान्य और व्यापक हिन्दी शब्द, जो यूनानी संज्ञा के अर्थ को बिना अतिरिक्त धार्मिक विशिष्टता जोड़े व्यक्त करता है।
- source_word: μέγα καὶ θαυμαστόν
  choice: महान और अद्भुत
  rationale: दोनों विशेषणों का क्रम और बल सुरक्षित रखता है।
- source_word: τελειότητος
  choice: सिद्धता
  rationale: पूर्ण अवस्था या परिपूर्ण गुण के अर्थ को संक्षिप्त और गरिमापूर्ण रूप में व्यक्त करता है।
- source_word: ἐξήγησις
  choice: वर्णन
  rationale: यहाँ शब्द का आशय कथन, विवरण या शब्दों में प्रस्तुति है; आधुनिक अर्थ में कारणात्मक 'व्याख्या' नहीं। निषेध को स्वाभाविक हिन्दी में 'वर्णन नहीं किया जा सकता' के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: प्रेम की सिद्धता के विषय में कथन की सीमा
  choice: उसकी सिद्धता का वर्णन नहीं किया जा सकता
  alternative: उसकी सिद्धता की कोई व्याख्या नहीं है
  rationale: यूनानी पाठ प्रेम की सिद्धता को शब्दों में पर्याप्त रूप से प्रस्तुत न कर पाने पर बल देता है। चुना हुआ रूप यह तनाव बनाए रखता है और ऐसा नहीं कहता कि उसकी कोई तार्किक व्याख्या या कारण ही नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्बोधन गरिमापूर्ण पर सरल है। वाक्य की मूल द्विखंडीय संरचना और विस्मयकारी स्वर सुरक्षित रखे गए हैं।
