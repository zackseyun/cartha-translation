source:
  edition: Funk 1901 (normalized OCR)
  text: οὗτος ὁ μακαρισμὸς ἐγένετο ἐπὶ τοὺς ἐκλελεγ₁₅ μένους ὑπὸ τοῦ θεοῦ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν, ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/007.yaml
  text: This blessedness came upon those chosen by God through Jesus Messiah our Lord[a], to whom be the glory forever and ever. Amen.
translation:
  language: hi
  text: यह धन्यता[a] उन लोगों को प्राप्त हुई जिन्हें परमेश्वर ने हमारे प्रभु यीशु मसीह के द्वारा चुना है। उनकी महिमा युगानुयुग हो। आमीन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह आशीष।”
    reason: μακαρισμός ‘धन्यता’ अथवा प्रसंगानुसार ‘आशीष’ के रूप में समझा जा सकता है; मुख्य पाठ अवस्था/धन्यत्व के भाव को प्राथमिकता देता है।
lexical_decisions:
- source_word: μακαρισμός
  choice: धन्यता
  rationale: यह शब्द केवल दी गई ‘आशीष’ नहीं, बल्कि धन्य होने की अवस्था या धन्य घोषित किए जाने का भाव भी व्यक्त करता है। ‘धन्यता’ इस अर्थ को संक्षेप में सुरक्षित रखता है; अधिक सामान्य विकल्प फुटनोट में दिया गया है।
- source_word: ἐγένετο ἐπί
  choice: को मिली
  rationale: शाब्दिक ‘के ऊपर आई’ आधुनिक हिन्दी में अस्वाभाविक है। प्रसंग में किसी धन्यता का चुने हुओं को प्राप्त होना अभिप्रेत है, इसलिए ‘को मिली’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: ἐκλελεγμένους
  choice: जिन्हें ... चुना है
  rationale: ग्रीक पूर्ण कृदंत परमेश्वर द्वारा किए गए चयन और उसके बने हुए परिणाम को दर्शाता है। हिन्दी का संबंधवाचक उपवाक्य इसे सहज रूप में व्यक्त करता है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: Χριστός का अर्थ ‘अभिषिक्त जन/मसीह’ है। हिन्दी धार्मिक प्रयोग में ‘मसीह’ स्वाभाविक है और इसे केवल ध्वन्यात्मक पदवी ‘क्राइस्ट’ नहीं बनाता।
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: युगानुयुग
  rationale: ग्रीक के प्रबल अनंतकालिक स्तुतिवाक्य का हिन्दी में प्रतिष्ठित, संक्षिप्त और गरिमापूर्ण समतुल्य।
theological_decisions:
- issue: ᾧ (‘जिसकी/जिनकी’) का संदर्भ
  choice: ‘उन्हीं की’ को निकटतम पूर्वपद ‘हमारे प्रभु यीशु मसीह’ से संबद्ध रखा गया है।
  alternative: इसे परमेश्वर की ओर संकेत मानना।
  rationale: ग्रीक में संबंधवाचक सर्वनाम का निकटतम व्याकरणिक पूर्वपद Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν है। हिन्दी ‘उन्हीं की’ उसी स्वाभाविक संबंध को बनाए रखता है, बिना अतिरिक्त doctrinal व्याख्या जोड़े।
- issue: चयन का कर्ता और माध्यम
  choice: परमेश्वर चयनकर्ता हैं और यीशु मसीह माध्यम हैं।
  alternative: ‘यीशु मसीह के द्वारा परमेश्वर के चुने हुए’ जैसी संक्षिप्त संरचना।
  rationale: ὑπὸ τοῦ θεοῦ कर्ता और διὰ Ἰησοῦ Χριστοῦ माध्यम को स्पष्ट करता है। पूर्ण उपवाक्य हिन्दी में दोनों संबंधों को असंदिग्ध रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कलीसियाई गद्य। मूल में कोई निष्कर्षसूचक अव्यय (‘तब/अतः’) नहीं है, इसलिए ऐसा कोई शब्द नहीं जोड़ा गया। ‘आमीन’ पारंपरिक और व्यापक रूप से समझा जाने वाला रूप रखा गया है।
