  text: αἱ γενεαὶ πᾶσαι ἀπὸ Ἀδὰμ ἕως τῆσδε τῆς ἡμέρας παρῆλθον, ἀλλ’ οἱ ἐν ἀγάπῃ τελειωθέντες κατὰ τὴν τοῦ θεοῦ χάριν ἔχουσιν χῶρον εὐσεβῶν, οἳ ₅ φανερωθήσονται ἐν τῇ ἐπισκοπῇ τῆς βασιλείας τοῦ Χριστοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/003.yaml
  text: All the generations from Adam until this day have passed away, but those who were perfected in love according to the grace of God have a place among the godly, who will be revealed in the visitation of the kingdom of Messiah.
translation:
  language: hi
  text: आदम से लेकर आज तक की सभी पीढ़ियाँ बीत गईं, पर जो परमेश्वर के अनुग्रह के अनुसार प्रेम में सिद्ध किए गए हैं, उनका भक्त जनों के बीच स्थान है, जो मसीह के राज्य के निरीक्षण[a] के समय प्रकट किए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ “भेंट” या “देखरेख” भी हो सकता है; यहाँ इसका आशय निर्णायक निरीक्षण या भेंट के समय से है।
    reason: ἐπισκοπή की अर्थ-व्याप्ति को सुरक्षित रखने और ‘निरीक्षण’ को एकमात्र संभव अर्थ न ठहराने के लिए।
lexical_decisions:
- source_word: ἐν ἀγάπῃ τελειωθέντες
  choice: प्रेम में सिद्ध किए गए
  rationale: कृदंत के कर्मवाच्य भाव और ‘प्रेम में परिपक्व/पूर्ण किए जाने’ के आशय को बनाए रखता है।
- source_word: χῶρον εὐσεβῶν
  choice: भक्त जनों के बीच स्थान
  rationale: शाब्दिक ‘भक्तों का स्थान’ की अपेक्षा स्वाभाविक हिन्दी में उस समुदाय या क्षेत्र में स्थान पाने का भाव व्यक्त करता है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: ग्रीक उपाधि Χριστός का हिन्दी में स्थापित अर्थ-संगत रूप है।
- source_word: φανερωθήσονται
  choice: प्रकट किए जाएँगे
  rationale: भविष्यत् कर्मवाच्य रूप को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ἐπισκοπῇ
  choice: आगमन
  rationale: इस प्रसंग में राज्य के निर्णायक प्रकट होने या भेंट करने के अवसर को सहज हिन्दी में व्यक्त करता है; शब्द की व्यापकता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ‘प्रेम में सिद्ध किए गए’ का कर्ता
  choice: कर्मवाच्य रखा गया
  alternative: ‘जो प्रेम में सिद्ध हुए’
  rationale: ग्रीक τελειωθέντες कर्मवाच्य है; अनुवाद परमेश्वर को स्पष्ट कर्ता जोड़कर मूल की निहितता को अनावश्यक रूप से नहीं खोलता।
- issue: ἐπισκοπή का युगान्त-संबंधी अर्थ
  choice: मुख्य पाठ में ‘आगमन’, पादटिप्पणी में वैकल्पिक अर्थ
  alternative: ‘निरीक्षण’ या ‘भेंट’
  rationale: प्रसंग मसीह के राज्य के निर्णायक प्रकट होने की ओर संकेत करता है, पर मूल शब्द में ‘भेंट/निरीक्षण’ की वास्तविक अर्थ-व्याप्ति भी है; उसे पादटिप्पणी में बनाए रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। लंबे यूनानी वाक्य को दो वाक्यों में बाँटा गया है, जबकि संबंधवाचक आशय ‘वे’ द्वारा बनाए रखा गया है।
